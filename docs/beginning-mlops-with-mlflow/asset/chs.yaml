  如果你还记得上一章的内容，正常数据与异常数据之间的分布存在严重不平衡。因此，你将采用一种略有不同的方法来处理这些数据。


  这就是数据分析发挥作用的地方。由于你知道每个类别的数据量存在巨大差异，现在你需要特别小心地构建数据集，以确保每个数据集中都包含足够数量的异常数据。如果你只是简单地从
  `df` 中选取 100,000 个数据点，然后将其拆分为训练集、测试集和验证集，那么很有可能其中一个或多个集合中只包含极少甚至没有异常数据。到那时，你将很难让模型正确学习这个任务。


  这就是为什么你要将异常点和正常点分开，来创建训练集、测试集和验证集。


  考虑到这一点，让我们为正常点和欺诈点创建数据框：


  ```

  normal = df[df.Class == 0].sample(frac=0.5, random_state=2020).reset_index(drop=True)

  anomaly = df[df.Class == 1]

  ```


  你将 `random_state` 设置为一个特定值，这样无论重复多少次随机采样，结果都应该相同，这有助于结果的可复现性。不幸的是，鉴于模型学习方式的特性，你不能期望每次都能得到相同的结果，例如对于神经网络这类模型。


  在这段代码中，你按类别筛选出相应的值，并抽取整个数据框中 50% 的正常点，以此构成当前上下文中的正常数据。


  请参考图 2-4 查看单元格中的这段代码。




  ![../images/499842_1_En_2_Chapter/499842_1_En_2_Fig4_HTML.jpg](img/499842_1_En_2_Fig4_HTML.jpg)


  图 2-4


  按类别过滤数据框的值，以创建正常数据框和异常数据框。正常数据框包含所有正常数据点中的 50%，这些数据点是根据种子（random_state）随机选择的。


  你还可以添加一些代码来检查形状：


  ```

  print(f"Normal: {normal.shape}")

  print(f"Anomaly: {anomaly.shape}")

  ```


  输出结果请参考图 2-5。


  ![../images/499842_1_En_2_Chapter/499842_1_En_2_Fig5_HTML.jpg](img/499842_1_En_2_Fig5_HTML.jpg)


  图 2-5


  打印正常数据框和异常数据框的形状。两个数据框中的条目数量存在明显差异。


  如你所见，正常数据点与异常数据点之间仍然存在巨大差异。以逻辑回归为例，模型仍然能够学习如何区分两者；但以神经网络为例，这种差异意味着模型永远无法真正学会如何对异常进行分类。不过，正如你将在本章后面看到的，你可以告诉模型，在其学习过程中，对异常数据点的权重远高于正常数据点。


  现在，你可以开始创建训练集/测试集/验证集的分割。然而，scikit-learn 仅提供创建训练集/测试集分割的功能。为了解决这个问题，你将先创建训练集和测试集，然后将训练集再次分割为训练集和验证集。


  首先，你将数据分割为训练数据和测试数据，并保持正常数据点和异常数据点分离。为此，你将使用 scikit-learn 的 `train_test_split()`
  函数。常用的参数包括：


  *   `x`：你想要分割的 x 集合

  *   `y`：与 x 集合对应的、你想要分割的 y 集合

  *   `test_size`：你希望从 x 和 y 中随机抽取用于测试集的数据比例。


  因此，要将 x 和 y 分割为训练集和测试集，你可能会看到如下代码：


  ```

  x_train, x_test, y_train, y_test = train_test_split(x, y, test_size=0.2, random_state
  = 2020)

  ```


  和之前一样，`random_state` 用于设置随机种子，这样每次运行时，数据都会以相同的方式分割。


  如果你不传入 `y` 参数，则只会对 x 数据进行分割。记住这一点，现在让我们将你的正常数据点和异常数据点分割为训练集和测试集：


  ```

  normal_train, normal_test = train_test_split(normal, test_size = 0.2, random_state
  = 2020)

  anomaly_train, anomaly_test = train_test_split(anomaly, test_size = 0.2, random_state
  = 2020)

  ```


  应该不会有输出，但请参考图 2-6 查看单元格中的代码。


  ![../images/499842_1_En_2_Chapter/499842_1_En_2_Fig6_HTML.jpg](img/499842_1_En_2_Fig6_HTML.jpg)


  图 2-6


  将正常数据框和异常数据框分割为训练子集和测试子集。各自的测试集占原始数据集的 20%。


  现在，你可以通过对各自的训练集调用相同的函数来创建训练集和验证集。不过，你不想再次按 20% 进行分割，因为训练集已经是原始数据集的 80%。如果你再次使用 20%
  的分割，验证集将占原始数据的 16%，而训练集将占原始数据的 64%。相反，你将按照 60-20-20 的比例分别分割训练数据、测试数据和验证数据，因此你将使用新的
  `test_size` 值 0.25 来确保这些比例成立（0.25 * 0.8 = 0.2）。


  记住这一点，让我们创建训练集和验证集的分割：


  ```

  normal_train, normal_validate = train_test_split(normal_train, test_size = 0.25,
  random_state = 2020)

  anomaly_train, anomaly_validate = train_test_split(anomaly_train, test_size = 0.25,
  random_state = 2020)

  ```


  请参考图 2-7 查看单元格中的代码。


  ![../images/499842_1_En_2_Chapter/499842_1_En_2_Fig7_HTML.jpg](img/499842_1_En_2_Fig7_HTML.jpg)


  图 2-7


  你从训练数据中创建了训练集和验证集的分割。你选择让验证集占各自原始训练集的 25%。由于这些原始训练集本身占原始正常数据框和异常数据框的 80%，因此各自的验证集分割占其原始正常数据框和异常数据框的
  20%（0.25 * 0.8）。因此，最终的训练集分割也变为原始数据的 60%，因为 0.75 * 0.8 = 0.6。


  为了创建最终的训练集、测试集和验证集，你必须将各自的正常数据分割和异常数据分割连接起来。


  首先，定义 `x_train`、`x_test` 和 `x_validate`：


  ```

  x_train = pd.concat((normal_train, anomaly_train))

  x_test = pd.concat((normal_test, anomaly_test))

  x_validate = pd.concat((normal_validate, anomaly_validate))

  ```


  接下来，定义 `y_train`、`y_test` 和 `y_validate`：


  ```

  y_train = np.array(x_train["Class"])

  y_test = np.array(x_test["Class"])

  y_validate = np.array(x_validate["Class"])

  ```


  最后，你必须删除 x 集合中的 `Class` 列，因为如果你直接给出标签，就违背了教模型学习如何区分正常交易和欺诈交易的目的：


  ```

  x_train = x_train.drop("Class", axis=1)

  x_test = x_test.drop("Class", axis=1)

  x_validate = x_validate.drop("Class", axis=1)

  ```


  要查看单元格中的所有代码，请参考图 2-8。


  ![../images/499842_1_En_2_Chapter/499842_1_En_2_Fig8_HTML.jpg](img/499842_1_En_2_Fig8_HTML.jpg)


  图 2-8


  创建训练集、测试集和验证集各自的 x 和 y 分割。对于每个分割（训练、测试、验证），x 集合是正常集合和异常集合的组合，而 y 集合只是这些 x 集合中 Class
  列的数据。然后，你从 x 集合中删除标签列。


  让我们获取刚刚创建的集合的形状：


  ```

  print("Training sets:\nx_train: {} y_train: {}".format(x_train.shape, y_train.shape))

  print("\nTesting sets:\nx_test: {} y_test: {}".format(x_test.shape, y_test.shape))

  print("\nValidation sets:\nx_validate: {} y_validate: {}".format(x_validate.shape,
  y_validate.shape))

  ```


  请参考图 2-9 查看输出结果。


  ![../images/499842_1_En_2_Chapter/499842_1_En_2_Fig9_HTML.jpg](img/499842_1_En_2_Fig9_HTML.jpg)


  图 2-9


  打印不同集合的输出结果。这三个集合应分别占原始正常集合和异常集合并集的 60%、20% 和 20%。


  查看数据分析，你会发现有些值变得非常大。具体细节超出了本书的范围，但当某些特征的范围相对较小，而其他特征的范围极大时（想想上一章中 `V1` 和 `Time`
  的范围），模型的学习将变得困难得多。


  更详细地说，模型将难以优化成本函数，并且可能需要更多步骤才能收敛（如果它能够收敛的话）。


  因此，最好通过归一化数据来将所有数据缩放到一个合适的范围。你将使用 scikit-learn 的 `StandardScaler`，它会将所有数据归一化，使得均值为
  0，标准差为 1。


  以下是标准化数据的代码：


  ```

  scaler = StandardScaler()

  scaler.fit(pd.concat((normal, anomaly)).drop("Class", axis=1))

  x_train = scaler.transform(x_train)

  x_test = scaler.transform(x_test)

  x_validate = scaler.transform(x_validate)

  ```




  需要注意的是，你是在整个数据框上拟合缩放器，以便以相同的方式标准化所有数据。这是为了确保最佳结果，因为你不想以各自的方式标准化 `x_train`、`x_test`
  和 `x_validate`，因为这会在数据中造成差异，并对模型产生问题。当然，一旦你部署了模型并开始接收新数据，你仍然会使用训练过程中的缩放器对其进行标准化，但这些新数据可能来自与训练数据略有不同的分布。如果趋势开始发生变化，这种情况尤其会发生——这种新的标准化数据可能会让模型更难处理，因为它不太适合模型训练时所依据的分布。


  请参考图 2-10 查看单元格中的代码。


  ![../images/499842_1_En_2_Chapter/499842_1_En_2_Fig10_HTML.jpg](img/499842_1_En_2_Fig10_HTML.jpg)


  图 2-10


  在正常数据框和异常数据框的拼接上拟合一个标准缩放器对象。这样做是为了让训练集、测试集和验证集各自根据相同的标准进行缩放，确保数据缩放之间没有差异。


  ### 模型训练


  最后，你现在可以定义你的逻辑回归模型了：


  ```

  sk_model = LogisticRegression(random_state=None, max_iter=400, solver=''newton-cg'').fit(x_train,
  y_train)

  ```


  请参考图 2-11 查看单元格中的代码。如果一切顺利，执行后不应有任何输出。你可能看到的任何错误都可能涉及收敛失败。为此，更改 `max_iter` 参数可能会有所帮助，更改
  `solver` 算法也可能有帮助。


  ![../images/499842_1_En_2_Chapter/499842_1_En_2_Fig11_HTML.jpg](img/499842_1_En_2_Fig11_HTML.jpg)


  图 2-11


  定义逻辑回归模型并在训练数据上对其进行训练


  训练过程之后，接下来可以是评估步骤或验证步骤。只要测试集和验证集来自不同的分布（验证集源自训练集，而测试集源自原始数据），模型在技术层面上就是在评估和验证过程中看到新数据。


  上下文也很重要。如果你使用验证过程从一组训练好的模型中选择最佳模型，那么验证过程可以在训练过程之后进行。你仍然可以评估一个或所有训练好的模型，但这可能是不必要的，因为在这种情况下，你正在尝试为代码找到最佳模型。


  在你试图为将要坚持使用的模型调整超参数的情况下，先进行评估还是先进行验证并不重要。像你即将做的那样先进行评估，可以在开始验证步骤之前让你很好地了解模型当前的表现。模型永远不会从评估数据中学习，因此在此数据上评估模型没有坏处。


  在这个例子中，你正在考虑调整类别权重的超参数（正常样本的权重和欺诈样本的权重）。


  但首先，让我们评估一下你的模型，以便更深入地了解一切是如何运作的。


  ### 模型评估


  你现在可以查看准确率和 AUC 分数。首先，使用模型内置的评分函数找到准确率：


  ```

  eval_acc = sk_model.score(x_test, y_test)

  ```


  接下来，让我们从模型中获取预测列表，以帮助计算 AUC 分数。AUC 通常是一个更好的指标，因为它能更好地解释模型的性能。其大致要点是，一个能完美分类每个数据点的模型，其
  AUC 分数将为 100%。


  在这种情况下，准确率的问题在于，如果有 100,000 个正常点和大约 100 个异常点，模型可以正确分类所有正常点，而一个异常点也分不对，但仍然能获得高于 99%
  的非常高准确率。然而，AUC 分数会显示一个低得多的值，大约在 0.5 左右。AUC 为 0.5 意味着模型一无所知，实际上只是在随机猜测，但在这个案例中，这意味着模型对于它看到的任何点都只预测为“正常”。换句话说，如果模型不知道如何预测异常点，它实际上并没有学到什么。


  还值得一提的是，AUC 并不是判断模型价值的唯一指标，因为上下文很重要。在这种情况下，正常点的数量远远超过异常点，因此准确率是一个相对较差的、仅凭其判断模型性能的指标。在这种情况下，AUC
  分数能很好地反映模型的性能，但也可能出现 AUC 分数较高而准确率较低的情况。这仅仅意味着你必须仔细查看结果，以准确理解正在发生的事情。为了帮助解决这个问题，你稍后将查看一个“混淆矩阵”。


  现在，让我们获取预测并计算 AUC 分数：


  ```

  preds = sk_model.predict(x_test)

  auc_score = roc_auc_score(y_test, preds)

  ```


  最后，让我们打印出分数：


  ```

  print(f"Auc Score: {auc_score:.3%}")

  print(f"Eval Accuracy: {eval_acc:.3%}")

  ```


