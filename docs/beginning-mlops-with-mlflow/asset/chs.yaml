  你通过调用名为 `to_categorical()` 的函数转换了 y 集合。该函数将每个样本从整数值（例如 2 或 4，对应于 x 样本所代表的数字）转换为一个独热编码向量。


  这种格式的样本现在是长度为 `num_classes` 的零向量。换句话说，这些向量的长度都与总类别数一致。标签原本的值现在变成了值为 1 的索引。因此，如果标签是
  1，那么该向量中索引为 1 的位置的值就是 1，其余位置都是 0。


