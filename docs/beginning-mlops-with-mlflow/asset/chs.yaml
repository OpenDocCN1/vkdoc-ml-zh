  \n记下我们用红色高亮标出的内部 IP。在你的情况下，它会不同。\n\n现在，你必须添加一条防火墙规则，以便在服务器启动后允许访问。返回门户网站，滚动到“网络”部分，然后点击“VPC\
  \ 网络”选项。你应该会看到类似图 7-16 的内容。\n\n![../images/499842_1_En_7_Chapter/499842_1_En_7_Fig16_HTML.jpg](img/499842_1_En_7_Fig16_HTML.jpg)\n\
