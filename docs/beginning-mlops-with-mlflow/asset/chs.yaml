  \ 100 美元，但有些金额可能非常高，达到 25,000 美元。\n\n\n\n### 绘制图表\n\n现在，让我们采用图形化的方法来更直观地说明这一点。首先，定义一些函数来帮助绘制数据中的各个列，以便更轻松地可视化各种关系：\n\
  \n```\ndef plot_histogram(df, bins, column, log_scale=False):\nbins = 100\nanomalies\
  \ = df[df.Class == 1]\nnormal = df[df.Class == 0]\nfig, (ax1, ax2) = plt.subplots(2,\
  \ 1, sharex=True)\nfig.suptitle(f'Counts of {column} by Class')\nax1.hist(anomalies[column],\
  \ bins = bins, color=\"red\")\nax1.set_title('Anomaly')\nax2.hist(normal[column],\
  \ bins = bins, color=\"orange\")\nax2.set_title('Normal')\nplt.xlabel(f'{column}')\n\
  plt.ylabel('Count')\nif log_scale:\nplt.yscale('log')\nplt.xlim((np.min(df[column]),\
  \ np.max(df[column])))\nplt.show()\ndef plot_scatter(df, x_col, y_col, sharey =\
  \ False):\nanomalies = df[df.Class == 1]\nnormal = df[df.Class == 0]\nfig, (ax1,\
  \ ax2) = plt.subplots(2, 1, sharex=True, sharey=sharey)\nfig.suptitle(f'{y_col}\
  \ over {x_col} by Class')\nax1.scatter(anomalies[x_col], anomalies[y_col], color=\"\
  red\")\nax1.set_title('Anomaly')\nax2.scatter(normal[x_col], normal[y_col], color=\"\
  orange\")\nax2.set_title('Normal')\nplt.xlabel(x_col)\nplt.ylabel(y_col)\nplt.show()\n\
  ```\n\n请参考图 1-12 查看单元格中的代码。\n\n![../images/499842_1_En_1_Chapter/499842_1_En_1_Fig12_HTML.jpg](img/499842_1_En_1_Fig12_HTML.jpg)\n\
  \n图 1-12\n\n每个绘图函数都位于各自的 Jupyter 单元格中\n\n现在，让我们开始为整个数据框绘制按 `Class` 分组的 `Amount`\
  \ 值：\n\n```\nplt.scatter(df.Amount, df.Class)\nplt.title(\"Transaction Amounts by\
  \ Class\")\nplt.ylabel(\"Class\")\nplt.yticks(range(2), [\"Normal\", \"Anomaly\"\
  ])\nplt.xlabel(\"Transaction Amounts ($)\")\nplt.show()\n```\n\n请参考图 1-13。\n\n![../images/499842_1_En_1_Chapter/499842_1_En_1_Fig13_HTML.jpg](img/499842_1_En_1_Fig13_HTML.jpg)\n\
  \n图 1-13\n\n数据框中包含所有数据值的散点图。绘制的列是 x 轴上的 Amount 和 y 轴上的 Class\n\n正如所料，正常数据集中似乎存在一些巨大的异常值。然而，该图在展示数值计数方面信息量不大，因此让我们使用之前定义的绘图函数来绘制能提供更多背景信息的图表：\n\
  \n```\nbins = 100\nplot_histogram(df, bins, \"Amount\", log_scale=True)\n```\n\n\
  请参考图 1-14。\n\n![../images/499842_1_En_1_Chapter/499842_1_En_1_Fig14_HTML.jpg](img/499842_1_En_1_Fig14_HTML.jpg)\n\
