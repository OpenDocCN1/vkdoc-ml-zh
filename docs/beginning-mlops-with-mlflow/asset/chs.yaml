  PySpark 认为其面积（AUC）约为 0.97997，请记住完美的 AUC 分数是 1.00


  这条曲线看起来相当理想。现在让我们查看混淆矩阵，以详细了解模型的表现：


  ```

  conf_matrix = confusion_matrix(y_true, y_pred)

  ax = sns.heatmap(conf_matrix, annot=True,fmt=''g'')

  ax.invert_xaxis()

  ax.invert_yaxis()

  plt.ylabel(''Actual'')

  plt.xlabel(''Predicted'')

