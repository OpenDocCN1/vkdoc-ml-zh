  \n图 1-30\n\ny 轴为 Amount、x 轴为 V12 的散点图。再次，您可以看到欺诈点与正常点之间存在明显的偏差。在这种情况下，大多数欺诈点似乎偏离了正常点簇。您还可以看到，在远离主簇的地方有一条正常点带，并且该点带与异常数据点重合。如果模型将此类点归类为异常，这是一个可能需要牢记的可能原因\n\
  \n\n\n你可以再次看到，`V12` 能够持续区分异常数据和正常数据。然而，仍然存在一个问题，即相当一部分异常数据隐藏在正常数据簇中。\n\n![../images/499842_1_En_1_Chapter/499842_1_En_1_Fig31_HTML.jpg](img/499842_1_En_1_Fig31_HTML.jpg)\n\
  \n图 1-31\n\n一个散点图，y 轴为 Amount 列，x 轴为 V17 列。与图 1-30 类似，你可以再次看到欺诈点偏离了正常点簇。同样，大多数欺诈点都表现出这种偏离，但你也可以看到一些正常点与这些异常点重合。\n\
  \n你还可以看到，这种正常点与欺诈点之间的区分在 `V17` 列上，结合交易金额来看，也是成立的。\n\n你也可以查看每个 V 列的数据，并将它们相互绘制成图，但这更有助于识别趋势的精确变化，如果你希望进一步训练模型以提高其在新数据上的性能，了解这些变化会更有用。首先，并非每个特征都非常重要。因此，即使趋势发生变化，也不一定意味着模型性能会下降。\n\
  \n对数据进行透彻分析，有助于数据科学家更好地理解各个数据列之间的相互关系，并让他们能够识别趋势是否随时间推移而发生变化。随着数据持续不断地被收集，数据偏差和趋势必然会发生变化。所以，也许一年后，是\
  \ `V18` 列在异常点和正常点之间显示出显著差异，而 `V17` 列则显示大多数异常点都包含在正常点簇中。\n\n## 总结\n\n数据分析是创建机器学习解决方案过程中的关键步骤。它不仅决定了模型的类型，并影响将为训练过程选择的特征集，还有助于识别随时间推移的任何趋势变化，这些变化可能表明模型需要进一步训练。你探索并分析了信用卡数据集中的数据，生成了许多图表以了解两个绘制变量之间的关系，并识别出了一些区分正常点和异常点的特征。在下一章中，你将处理数据以创建各种子集，从而帮助训练几种类型的机器学习模型。\n\
  \n"
- '# 2. 构建模型


  在本章中，我们将介绍如何在 scikit-learn 和 PySpark 中构建一个简单的逻辑回归模型。我们还将介绍在 scikit-learn 中使用 k 折交叉验证来调整超参数的过程。


  ## 引言


  在上一章中，你加载了信用卡数据集并分析了其数据分布。你还查看了特征之间的关系，并对它们对标签的影响程度有了大致了解。


  既然你已经对数据集有了更好的理解，接下来将继续构建模型本身。你将使用与上一章相同的信用卡数据集。在本章中，你将了解两个框架：**scikit-learn** 和
  **PySpark**。你在 scikit-learn 和 PySpark 中构建的模型将在本书的其余部分中持续使用，因为稍后你将把它们托管在云服务上进行预测。我们将保持简单，在这两个框架中构建逻辑回归模型。由于这两个框架的输入数据格式不同，你不能提前进行数据处理，然后为这两个框架使用相同的训练/测试/验证集。然而，例如，对于
  scikit-learn 和 Keras，这是可能的，具体取决于 Keras 模型中最后一层的构建方式。


  你将使用 scikit-learn 模型执行验证步骤来调整超参数。**超参数**可以被视为影响训练过程和结果的模型相关参数。


  话不多说，让我们开始使用 scikit-learn 并构建一个逻辑回归模型。需要注意的一点是，我们将在 scikit-learn 模型中提供大量注释，而在 PySpark
  示例中可能会跳过这些注释，所以请务必至少通读 scikit-learn 的流程，以大致了解训练-测试-验证是如何工作的。


  ## Scikit-Learn


  在开始之前，这里是你需要的包及其版本。我们将提供一种简单的方法，让你在代码内部检查包的版本。


