  由于 TensorFlow/Keras 中的二维卷积层期望输入为四维格式 (m, h, w, c)，其中 *m* 表示数据集中的样本数量，*h* 和 *w* 分别表示高度和宽度，*c*
  表示通道数（例如，如果是 RGB 彩色图像则为 3），因此你需要重塑数据以符合这些规范。你的图像都是黑白的，所以技术上通道数为 1。因此，你必须像这样重塑它们：


