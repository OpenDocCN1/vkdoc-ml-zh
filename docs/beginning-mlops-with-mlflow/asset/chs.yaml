  ## PySpark


  我们提供了将要使用的模块版本。安装 PySpark 可能有点复杂，因为根据版本不同，并非简单地执行`pip install PySpark`即可，请注意这一点。


  以下是我们的配置版本：


  *   Python 3.6.5


  *   PySpark 3.0.0


