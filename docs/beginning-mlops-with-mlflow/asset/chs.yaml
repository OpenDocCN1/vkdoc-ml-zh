  MLFlow 在其文档中还提供了对其他框架的指标、参数、工件甚至模型进行日志记录的支持。接下来，我们将了解如何将 MLFlow 与 TensorFlow 2.0+/Keras、PyTorch
  和 PySpark 集成。


  ## MLFlow 与其他框架




  ### 使用 TensorFlow 2.0 (Keras) 的 MLFlow


  MLFlow 提供了与 TensorFlow 2.0+（任何 2.0 及以上版本）的简便集成。为了了解具体方法，让我们来看一个在 MNIST 数据集上构建手写数字分类器模型的非常基础的示例。为了演示方便，我们将使用内置的
  Keras 模块来保持简单。MLFlow 最低支持 TensorFlow 1.12，因此只要你安装了至少 TensorFlow 1.12，这段代码就能运行。


  我们假设你对 TensorFlow 2 有基本的了解，因此不会深入解释函数、模型层、优化器和损失函数的含义。


  在开始之前，这里是我们使用的 TensorFlow、CUDA 和 CuDNN 的版本。请注意，我们使用的是 TensorFlow 的 GPU 版本（包名为 tensorflow-gpu），不过即使没有
  GPU，你也可以运行此代码，只是运行时间会更长：


  *   **TensorFlow**（GPU 版本）– 2.3.0

  *   **CUDA** – 10.1

  *   **CuDNN** – v7.6.5.32（适用于 CUDA 10.1）

  *   **Sklearn** – 0.22.2.post1

  *   **MLFlow** – 1.10.0


  #### 数据处理


  以下是导入必要模块并打印其版本的代码：


  ```

  import tensorflow as tf

  from tensorflow.keras.models import Sequential

  from tensorflow.keras.layers import Dense, Conv2D, Flatten

  from tensorflow.keras.datasets import mnist

  import numpy as np

  import matplotlib

  import matplotlib.pyplot as plt

  import sklearn

  from sklearn.metrics import roc_auc_score

  import mlflow

  import mlflow.tensorflow

  print("TensorFlow: {}".format(tf.__version__))

  print("Scikit-Learn: {}".format(sklearn.__version__))

  print("Numpy: {}".format(np.__version__))

  print("MLFlow: {}".format(mlflow.__version__))

  print("Matplotlib: {}".format(matplotlib.__version__))

  ```


  你应该会看到类似图 4-47 的内容。


  ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig48_HTML.jpg](img/499842_1_En_4_Fig48_HTML.jpg)


  图 4-47：导入必要模块并打印其版本


  现在让我们加载数据：


  ```

  (x_train, y_train), (x_test, y_test) = mnist.load_data()

  ```


  Keras（以及其扩展 TensorFlow）为你提供了 MNIST 手写数字数据集，因此加载数据只需调用该函数即可，如图 4-48 所示。


