- "# 1.  入门：数据分析\n\n在本章中，我们将介绍我们试图通过机器学习解决方案来解决的问题的前提，该解决方案是我们希望投入生产的。我们还将开始对数据集进行数据分析和特征工程。\n\
  \n\n\n## 引言与前提\n\n欢迎阅读《基于 MLFlow 的 MLOps 入门》！在本书中，我们将以一个示例问题为起点，为其开发机器学习解决方案，并在\
  \ AWS SageMaker、Microsoft Azure、Google Cloud 和 Datarobots 上实现模型的生产化部署。我们将探讨的问题是对信用卡数据集进行异常检测。本章将探索该数据集，展示其整体结构，并讲解一些分析该数据的技术。该数据集可在[`www.kaggle.com/mlg-ulb/creditcardfraud`](http://www.kaggle.com/mlg-ulb/creditcardfraud)找到。\n\
  \n如果你已经熟悉如何分析数据和构建机器学习模型，可以直接获取数据集，跳至第 3 章，直接进入 MLOps 部分。\n\n否则，我们将首先介绍机器学习解决方案通常的创建流程。该流程大致如下：\n\
  \n1.  **问题识别：** 首先，你需要明确问题是什么，可以采取什么措施，已经采取了哪些措施，以及为什么这是一个值得解决的问题。\n\n以下是一个问题示例：一种对当地环境有害的入侵蛇类在某地区泛滥成灾。这种蛇毒性极强，且与当地一种无毒蛇类外形极为相似。此外，入侵物种对当地环境具有破坏性，并在与本地物种的竞争中占据优势。\n\
  \n作为回应，当地政府发表声明，鼓励市民见即杀之，消灭这种有毒的入侵物种。但问题在于，由于两种蛇极易混淆，市民们也在误杀本地物种。\n\n对此可以采取什么措施？一个可能的解决方案是利用机器学习的力量，构建一个应用程序来帮助市民识别蛇的种类。已经采取了哪些措施？也许有人发布了一款应用，但在区分两种蛇方面效果不佳，无助于改善现状。也许已经发放了宣传单，但仅凭一张图片很难准确识别每一个物种的个体。\n\
  \n为什么这是一个值得解决的问题？本地物种对当地环境至关重要。误杀错误物种可能会加剧问题，导致入侵物种取代本地物种占据环境优势。因此，构建一个基于计算机视觉的应用，能够区分各种蛇类（尤其是与问题相关的两种蛇），将是帮助市民消灭正确蛇类的绝佳方法。\n\
  \n2.  **数据收集：** 确定问题后，你需要收集相关数据。在蛇类分类问题中，你需要寻找所在地区各种蛇类的图像。具体地点取决于你的项目规模：是要识别世界上任何地方的蛇，还是仅限佛罗里达州的蛇？\n\
  \n如果条件允许，收集的数据越多，潜在的训练效果就越好。更多的训练样本可以为模型引入更多样性，从长远来看使其表现更佳。深度学习模型的性能会随着数据量的增加而提升，请牢记这一点。\n\
  \n3.  **数据分析：** 收集完所有原始数据后，你需要对其进行清洗、处理和格式化，以便更好地分析数据。\n\n对于图像，这可能涉及应用算法裁剪掉图像中不必要的部分，仅聚焦于蛇本身。此外，你可能还想对图像进行中心裁剪，以去除数据样本中所有多余的视觉信息。无论如何，原始图像数据很少能直接使用；几乎总是需要处理才能获得所需的关联数据。\n\
  \n对于图像这类非结构化数据，将其格式化为足以分析的形式，可能包括创建一个包含所有相应蛇类及其相关图像数据的目录。然后，你可以查看每个蛇类类别的图像数量，并判断是否需要为特定物种获取更多样本。\n\
  \n对于结构化数据，例如信用卡数据集，处理原始数据可能意味着删除任何包含空值的条目。为了便于分析，可以应用降维技术，如主成分分析（PCA）。注意：事实证明，信用卡数据集中的大部分数据已经过\
  \ PCA 处理，部分原因是为了保护数据来源用户的隐私。\n\n至于分析，你可以构建多个不同特征的图表，以了解整体分布情况以及特征之间的相互关系。这样，你就能发现某些特征之间的显著关系，在创建训练数据时加以留意。\n\
  \n有一些工具可以帮助你找出对标签影响最大的特征，例如**phi-k 相关系数**。通过查看各个特征与目标标签之间的不同相关系数值，你可以更深入地理解数据集中特征之间的关系。如有必要，你还可以从数据中剔除影响不大的特征。在此步骤中，你确实需要扎实地理解数据，以便应用最适合它的模型架构。\n\
  \n4.  **特征工程与数据处理：** 现在，你可以利用从分析各种特征及其相互关系中获得的知识，通过组合多个现有特征来构建新特征。例如，泰坦尼克号数据集就是一个非常适合应用特征工程的绝佳例子。在这种情况下，你可以利用诸如舱位等级、年龄、票价、兄弟姐妹数量、父母数量等信息，创建尽可能多的特征。\n\
  \n特征工程的核心在于为模型提供更深入的上下文，使其能更好地学习任务。你不必为了创建特征而随意创建，而应创建一些可能相关的特征，例如女性亲属的数量。（由于女性在泰坦尼克号沉没事件中幸存的可能性更高，那么如果一个人有更多女性亲属，他们幸存的可能性是否会更低，因为优先权给了他们的女性亲属？）\n\
  \n特征工程之后的下一步是数据处理，这一步涉及为将数据传入模型而进行的所有准备工作。在蛇类图像数据中，这可能包括将所有值归一化到 0 到 1 之间，以及将数据“分批”处理。\n\
  \n这一步通常还会从初始数据中创建几个子集：**训练数据集**、**测试数据集**和**验证数据集**。我们稍后将详细说明每个数据集的目的。目前，**训练数据集**包含你希望模型从中学习的数据，**测试数据集**包含用于评估模型性能的数据，而**验证数据集**则用于选择模型或帮助调整模型的超参数以获得更佳性能。\n\
  \n\n\n5.  **构建模型：** 数据处理完成后，这一步的重点是选择合适的架构并构建模型。对于蛇类图像数据，使用卷积神经网络（CNN）是一个不错的选择，因为它在处理图像相关任务时表现非常出色。接下来，你需要根据模型的层结构来定义其具体架构。\n\
  \n6.  **训练、评估与验证：** 在训练 CNN 模型时，通常会分批传入数据，直到整个数据集完整地通过模型一次。根据这次“前向传播”的结果，模型会进行计算，指导如何调整权重，这些调整通过所谓的“反向传播”在网络中逆向进行。训练过程本质上是模型学习如何执行任务，并且随着它看到更多样本，其表现会越来越好。\n\
  \n训练过程结束后，接下来可以进行评估或验证步骤。只要测试集和验证集来自不同的数据分布（验证集可以从训练集中划分，而测试集可以从原始数据中划分），从技术上讲，模型在评估和验证过程中看到的是新数据。模型永远不会从评估数据中学习任何内容，因此你可以随时测试模型。\n\
  \n模型评估是指在模型从未见过的数据集上评估其性能指标，例如准确率、精确率、召回率等。我们将在下一章（第 2 章）中更详细地介绍评估步骤，届时其相关性会更强。\n\
  \n根据具体情境，验证的确切目的可能有所不同，同时训练后是否应先进行评估的问题也会变化。让我们定义几个需要使用验证的示例场景：\n    *   **选择模型架构：**\
  \ 对于多种模型类型或架构，你可以使用例如 k 折交叉验证，在验证集的某个数据分区上快速训练和评估每个模型，以了解它们的表现。这样，你就能清楚哪个模型表现最佳，从而选择该模型并继续后续流程。\n\
  \n*   **选择最佳模型：** 对于多个训练好的模型，你可以使用类似 k 折交叉验证的方法，在验证数据上快速评估每个模型，从而了解哪些模型表现最好。\n\n\
  *   **调整超参数：** 快速训练一个模型，并用不同的超参数设置进行测试，以了解哪些配置效果更好。你可以从较宽的超参数范围开始，然后根据结果缩小范围，直到找到满意的配置。例如，深度学习模型可能有很多超参数，因此使用验证来调整这些超参数在深度学习环境中效果很好。但要注意收益递减现象。当超参数设置达到一定精度后，模型性能的提升就不会那么显著了。\n\
  \n*   **高方差的指示：** 这个验证数据与前三个示例略有不同。在神经网络的情况下，该数据是从训练数据中划分出的一小部分。在训练数据完整通过一次后，模型会在这个验证数据上进行评估，以计算损失和准确率等指标。\n\
  \n如果训练准确率高且训练损失低，但验证准确率低且验证损失高，这表明你的模型存在**高方差**问题。这意味着模型没有学会将其“学习”到的内容泛化到新数据上，因为此处的验证数据由它从未见过的数据组成。换句话说，你的模型正在**过拟合**。模型无法在新数据上复现其在训练数据上获得的表现。\n\
  \n如果模型训练准确率低且训练损失高，则表明模型存在**高偏差**问题，这意味着它根本没有学会如何在训练数据上正确执行任务。\n\n训练过程中的这一小部分验证拆分可以让你及早发现过拟合何时发生。\n\
  \n7.  **进行预测：** 一旦模型经过训练、评估和验证，就可以进行预测了。在蛇类检测器的场景中，这一步涉及输入相关蛇类的视觉图像，以获得某种预测结果。例如，如果模型需要检测蛇、在其周围画框并标注（在目标检测任务中），它就会执行这些操作，并在应用中实时显示结果。\n\
  \n如果模型只是对图片中的蛇进行分类，用户只需通过应用将蛇的照片发送给模型，即可获得物种分类预测结果，可能还会附带一个概率置信度分数。\n\n希望现在你对创建机器学习解决方案的过程有了更清晰的认识。\n\
  \n了解了这些之后，让我们开始示例部分，你将使用信用卡数据集，利用这些数据构建简单的异常检测模型。\n\n## 信用卡数据集\n\n在执行任何数据分析之前，你首先需要收集数据。同样，该数据集可以在以下链接找到：[`www.kaggle.com/mlg-ulb/creditcardfraud`](https://www.kaggle.com/mlg-ulb/creditcardfraud)。\n\
  \n点击链接后，你应该会看到类似下图 1-1 的内容。\n\n![../images/499842_1_En_1_Chapter/499842_1_En_1_Fig1_HTML.jpg](img/499842_1_En_1_Fig1_HTML.jpg)\n\
