  \n### 正常数据与欺诈数据\n\n由于只有两个类别，即 `normal` 和 `fraud`，让我们按类别拆分数据框，并继续进行数据分析。在异常检测的上下文中，`fraud`\
  \ 类别也是 `anomaly` 类别，因此我们选择将表示欺诈交易数据的数据框命名为 `anomalies`，并且可以互换地将此类称为 `fraud` 或 `anomaly`。\n\
  \n代码如下：\n\n```\nanomalies = df[df.Class == 1]\nnormal = df[df.Class == 0]\n```\n\
