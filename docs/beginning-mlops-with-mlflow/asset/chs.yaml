  \n## 总结\n\nGoogle Cloud 是一个云平台，为广泛的用户群体提供众多高级服务。虽然 MLFlow 并未明确提供对 Google Cloud 部署的支持，但你仍然可以利用\
  \ MLFlow 的模型服务功能和 Google Cloud 的计算引擎，在云端对模型进行运维。\n\n在本章中，你学习了如何设置 Google Cloud，以便在虚拟机上部署模型。具体来说，你了解了如何将\
  \ MLFlow 运行记录推送到存储桶，如何在虚拟机上设置 Conda 环境，如何设置防火墙以允许模型被访问和查询，以及如何通过简单地切换运行 ID（以及适当情况下的实验\
  \ ID）来管理你的部署。\n\n在附录中，你可以了解 Databricks 如何帮助你通过模型注册表来运维和管理模型。\n\n索引 A, B 分析数据 AWS\
