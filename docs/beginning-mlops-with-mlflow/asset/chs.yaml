  \ 中其他所有内容的配置。现在你可以继续部署模型了。\n\n## 部署和查询模型\n\n虚拟机配置完成后，就可以部署模型了。\n\n确保你仍然记着那个内部 IP。返回\
  \ PuTTY 客户端，现在输入以下命令：\n\n```\nmlflow models serve -m gs://mlops-storage/EXPERIMENT_ID/RUN_ID/artifacts/MODEL_NAME\
  \ -h 10.142.0.4\n```\n\n我们的命令如下所示。我们只是使用了 Google 存储桶中的第一次运行。\n\n```\nmlflow models\
  \ serve -m gs://mlops-storage/8/1eb809b446d949d5a70a1e22e4b4f428/artifacts/log_reg_model\
  \ -h 10.142.0.4\n```\n\n你应该会看到类似图 7-18 的内容。\n\n![../images/499842_1_En_7_Chapter/499842_1_En_7_Fig18_HTML.jpg](img/499842_1_En_7_Fig18_HTML.jpg)\n\
  \n图 7-18\n\n如果成功构建了 Conda 环境并且现在正在提供模型服务，你的输出应该看起来像这样\n\n在成功使用此模型进行预测之前，只剩下一步了。你现在必须查看你的外部\
  \ IP。为此，请返回“虚拟机实例”页面找到你的虚拟机。你应该会看到类似图 7-19 的内容。\n\n![../images/499842_1_En_7_Chapter/499842_1_En_7_Fig19_HTML.jpg](img/499842_1_En_7_Fig19_HTML.jpg)\n\
  \n图 7-19\n\n门户网站中的“虚拟机实例”部分应显示服务器的外部 IP。我们用红色高亮标出了我们的 IP，但你的很可能不同\n\n一旦获得外部 IP 地址，请将其复制到某处。\n\
  \n现在你可以启动 Jupyter notebook 并查询此模型。\n\n在 Jupyter notebook 单元格中，运行以下代码。确保 `data` 文件夹与此\
  \ notebook 位于同一目录，并且 `data` 文件夹包含 `creditcard.csv` 文件：\n\n```\nimport pandas as\
  \ pd\nimport seaborn as sns\nimport matplotlib.pyplot as plt\nfrom sklearn.preprocessing\
  \ import StandardScaler\nfrom sklearn.model_selection import train_test_split\n\
  from sklearn.metrics import roc_auc_score, accuracy_score, confusion_matrix\nimport\
  \ numpy as np\nimport subprocess\nimport json\ndf = pd.read_csv(\"data/creditcard.csv\"\
  )\n```\n\n接下来，定义你将用于获取模型预测的 `query()` 函数：\n\n```\ndef query(input_json):\nproc =\
  \ subprocess.run([\"curl\",  \"-X\", \"POST\", \"-H\", \"Content-Type:application/json;\
  \ format=pandas-split\",\n\"--data\", input_json, \"http://34.75.74.9:5000/invocations\"\
  ],\nstdout=subprocess.PIPE, encoding='utf-8')\noutput = proc.stdout\npreds = json.loads(output)\n\
  return preds\n```\n\n注意，IP 现在是 `http://34.75.74.9:5000/invocations`。基本上，你的 IP 应该采用\
  \ `http://YOUR_EXTERNAL_IP:5000/invocations` 的形式，将占位符替换为你的虚拟机的外部 IP 地址。\n\n现在让我们查询你的模型：\n\
  \n```\ninput_json = df.iloc[:80].drop([\"Time\", \"Class\"], axis=1).to_json(orient=\"\
  split\")\npd.DataFrame(query(input_json)).T\n```\n\n总的来说，你应该会看到类似图 7-20 的内容。\n\n\
  ![../images/499842_1_En_7_Chapter/499842_1_En_7_Fig20_HTML.jpg](img/499842_1_En_7_Fig20_HTML.jpg)\n\
  \n图 7-20\n\n使用数据框的前 80 行查询模型的输出\n\n正如预期的那样，预测结果不正确，因为你在查询模型之前没有对数据进行缩放。但是，你已经验证了查询的地址是正确的，并且模型能够返回预测结果。\n\
  \n现在运行以下单元格：\n\n```\nnormal = df[df.Class == 0].sample(frac=0.5, random_state=2020).reset_index(drop=True)\n\
  anomaly = df[df.Class == 1]\nnormal_train, normal_test = train_test_split(normal,\
  \ test_size = 0.2, random_state = 2020)\nanomaly_train, anomaly_test = train_test_split(anomaly,\
  \ test_size = 0.2, random_state = 2020)\nscaler = StandardScaler()\nscaler.fit(pd.concat((normal,\
  \ anomaly)).drop([\"Time\", \"Class\"], axis=1))\ntest = pd.concat((normal.iloc[:1900],\
  \ anomaly.iloc[:100]))\ntrue = test.Class\ntest = scaler.transform(test.drop([\"\
  Time\", \"Class\"], axis=1))\npreds = []\nbatch_size = 80\nfor f in range(25):\n\
  print(f\"Batch {f}\", end=\" - \")\nsample = pd.DataFrame(test[f*batch_size:(f+1)*batch_size]).to_json(orient=\"\
  split\")\noutput = query(sample)\nresp = pd.DataFrame([output])\npreds = np.concatenate((preds,\
  \ resp.values[0]))\nprint(\"Completed\")\neval_acc = accuracy_score(true, preds)\n\
  eval_auc = roc_auc_score(true, preds)\nprint(\"Eval Acc\", eval_acc)\nprint(\"Eval\
  \ AUC\", eval_auc)\n```\n\n完成后，你应该会看到类似图 7-21 的内容。\n\n![../images/499842_1_En_7_Chapter/499842_1_En_7_Fig21_HTML.jpg](img/499842_1_En_7_Fig21_HTML.jpg)\n\
  \n图 7-21\n\n运行批量查询脚本的结果\n\n## 更新和移除部署\n\n更新模型部署非常简单。根据你的设置方式，只需退出模型服务命令（Ctrl-C），然后使用不同的运行\
  \ ID 重新运行该命令即可。\n\n让我们尝试部署一个不同的运行。在你的情况下，检查你的 Google 存储桶并选择第二次运行。\n\n在我们的例子中，我们运行了以下命令：\n\
  \n```\nmlflow models serve -m gs://mlops-storage/8/3862eb3bd89b43e8ace610c521d974e6/artifacts/log_reg_model\
  \ -h 10.142.0.4\n```\n\n如图 7-22 所示，它已成功部署，我们可以简单地使用相同的脚本进行查询。\n\n![../images/499842_1_En_7_Chapter/499842_1_En_7_Fig22_HTML.jpg](img/499842_1_En_7_Fig22_HTML.jpg)\n\
  \n图 7-22\n\n使用相同的命令约定部署不同的模型运行\n\n至于移除部署，你只需使用 Ctrl-C 取消命令，你的部署就会被取消。\n\n至此，你现在知道了如何提供模型服务、切换模型并部署不同的模型，以及通过简单地取消模型服务命令来移除部署。\n\
  \n\n\n## 清理资源\n\n现在需要删除你创建的所有服务实例，以免产生任何费用。以下是所用服务的清单：\n\n*   Google Cloud 存储桶\n\
  \n*   Compute Engine 虚拟机实例\n\n*   ️ 网络防火墙规则\n\n从虚拟机实例开始，首先点击 **停止** 来停止 VM 运行。根据你访问该\
  \ VM 的位置，你应该会看到类似图 7-23 的界面。\n\n![../images/499842_1_En_7_Chapter/499842_1_En_7_Fig23_HTML.jpg](img/499842_1_En_7_Fig23_HTML.jpg)\n\
  \n图 7-23\n\n停止后的虚拟机实例\n\n之后，你可以直接点击 **删除** 来移除该 VM。停止 VM 仅能确保你不会因 CPU/GPU 使用而被收费，但无法阻止与\
  \ VM 关联的服务所产生的任何费用。\n\n接下来，我们进入存储桶。只需勾选你的存储桶，然后点击 **删除** 即可移除该存储。请参考图 7-24。\n\n\
