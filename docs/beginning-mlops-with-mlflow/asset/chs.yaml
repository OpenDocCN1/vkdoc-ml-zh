  ### MLFlow 与 PyTorch


  MLFlow 也提供了与 PyTorch 的集成。虽然这个过程不像与 Keras 或 TensorFlow 那样简单，但将 MLFlow 集成到你现有的 PyTorch
  代码中却相当简单。为了了解如何操作，我们将再次探索一个应用于 MNIST 数据集的简单卷积神经网络。


  在开始之前，这里是我们使用的模块版本，包括 CUDA 和 CuDNN：


  *   **Torch** - 1.6.0


  *   **Torchvision** – 0.7.0


  *   **CUDA** – 10.1


  *   **CuDNN** – v7.6.5.32（适用于 CUDA 10.1）


  *   **Sklearn** – 0.22.2.post1


  *   **MLFlow –** 1.10.0


  *   **numpy –** 1.18.5


