- fmt: '### Configuring the Firewall


    First, you need to look at the internal IP that your VM instance is using. To
    do that, run the following:


    ```

    ifconfig

    ```


    You should see something like Figure [7-15](#499842_1_En_7_Chapter.xhtml#Fig15).


    ![../images/499842_1_En_7_Chapter/499842_1_En_7_Fig15_HTML.jpg](images/499842_1_En_7_Chapter/499842_1_En_7_Fig15_HTML.jpg)


    Figure 7-15


    Something similar to what you should see when you run the command. We have highlighted
    in red where you can find the internal IP of your machine. In our case, it is
    `10.142.0.4`. Yours will be different.


    Make a note of the internal IP, which we have highlighted in red. In your case,
    it will be different.


    Now, you must add a firewall to allow access to your server once it is started.
    Go back to the portal, scroll to the section that says Networking, and click the
    VPC Networks option. You should see something like Figure [7-16](#499842_1_En_7_Chapter.xhtml#Fig16).


    ![../images/499842_1_En_7_Chapter/499842_1_En_7_Fig16_HTML.jpg](images/499842_1_En_7_Chapter/499842_1_En_7_Fig16_HTML.jpg)


    Figure 7-16


    The VPC Networks module in the portal. Click the Firewall option to look at the
    firewall options.


    Now, click Firewall and then click Create Firewall Rule. Namely, you want to enter
    the following values:


    - **Name**: `mlflow-server`

    - **Target tags**: `mlops-server`, `http-server`, `https-server`

    - **Source IP ranges**: `0.0.0.0/0`

    - **Protocols and Ports**: Check TCP and type `5000`


    If you made a mistake, you can edit the firewall rules. You should see something
    like Figure [7-17](#499842_1_En_7_Chapter.xhtml#Fig17).


    ![../images/499842_1_En_7_Chapter/499842_1_En_7_Fig17_HTML.jpg](images/499842_1_En_7_Chapter/499842_1_En_7_Fig17_HTML.jpg)


    Figure 7-17


    What your firewall configuration should look like. We have autofilled the values
    with our own.


    Now click Create. You are done configuring the firewall and configuring everything
    else in Google Cloud. Now you can move on to deploying your model.


    ## Deploying and Querying the Model


    With your virtual machine fully configured, it’s time to deploy your model.


    Make sure you still have that internal IP logged in. Go back to the PuTTY client
    and now enter the following command:


    ```

    mlflow models serve -m gs://mlops-storage/EXPERIMENT_ID/RUN_ID/artifacts/MODEL_NAME
    -h 10.142.0.4

    ```


    Our command looks like the following. We simply took the first run in the Google
    Storage bucket.


    ```

    mlflow models serve -m gs://mlops-storage/8/1eb809b446d949d5a70a1e22e4b4f428/artifacts/log_reg_model
    -h 10.142.0.4

    ```


    You should see something like Figure [7-18](#499842_1_En_7_Chapter.xhtml#Fig18).


    ![../images/499842_1_En_7_Chapter/499842_1_En_7_Fig18_HTML.jpg](images/499842_1_En_7_Chapter/499842_1_En_7_Fig18_HTML.jpg)


    Figure 7-18


    This is what your output should look like if it successfully built the Conda environment
    and is now serving the model.


    There’s only one more step that remains before you can successfully make predictions
    with this model. You must now see what your external IP is. To do so, go back
    to the VM Instances page to find your VM machine. You should see something like
    Figure [7-19](#499842_1_En_7_Chapter.xhtml#Fig19).


    ![../images/499842_1_En_7_Chapter/499842_1_En_7_Fig19_HTML.jpg](images/499842_1_En_7_Chapter/499842_1_En_7_Fig19_HTML.jpg)


    Figure 7-19


    The VM Instances section in the portal should display the external IP of your
    server. We have highlighted ours in red, but yours is most likely something different.


    Once you have the external IP address, copy it down somewhere.


    Now you can start up your Jupyter notebook and query this model.


    In a Jupyter notebook cell, run the following. Make sure you have the `data` folder
    in the same directory as this notebook, and that the `data` folder contains the
    `creditcard.csv` file:


    ```

    import pandas as pd

    import seaborn as sns

    import matplotlib.pyplot as plt

    from sklearn.preprocessing import StandardScaler

    from sklearn.model_selection import train_test_split

    from sklearn.metrics import roc_auc_score, accuracy_score, confusion_matrix

    import numpy as np

    import subprocess

    import json

    df = pd.read_csv("data/creditcard.csv")

    ```


    Next, you define your `query()` function that you will use to get model predictions:


    ```

    def query(input_json):

    proc = subprocess.run(["curl",  "-X", "POST", "-H", "Content-Type:application/json;
    format=pandas-split",

    "--data", input_json, "http://34.75.74.9:5000/invocations"],

    stdout=subprocess.PIPE, encoding=''utf-8'')

    output = proc.stdout

    preds = json.loads(output)

    return preds

    ```


    Notice that the IP is now `http://34.75.74.9:5000/invocations`. Basically, your
    IP should take the form of `http://YOUR_EXTERNAL_IP:5000/invocations`, replacing
    the placeholder with the external IP address of your VM.


    Let’s now query your model:


    ```

    input_json = df.iloc[:80].drop(["Time", "Class"], axis=1).to_json(orient="split")

    pd.DataFrame(query(input_json)).T

    ```


    Altogether, you should see something like Figure [7-20](#499842_1_En_7_Chapter.xhtml#Fig20).


    ![../images/499842_1_En_7_Chapter/499842_1_En_7_Fig20_HTML.jpg](images/499842_1_En_7_Chapter/499842_1_En_7_Fig20_HTML.jpg)


    Figure 7-20


    The output of querying the model with the first 80 rows of your data frame.


    As expected, the predictions aren’t correct because you did not scale the data
    before querying the model with it. However, you have verified that you have queried
    the correct address and that the model is able to return predictions.


    Now run the following cells:


    ```

    normal = df[df.Class == 0].sample(frac=0.5, random_state=2020).reset_index(drop=True)

    anomaly = df[df.Class == 1]

    normal_train, normal_test = train_test_split(normal, test_size = 0.2, random_state
    = 2020)

    anomaly_train, anomaly_test = train_test_split(anomaly, test_size = 0.2, random_state
    = 2020)

    scaler = StandardScaler()

    scaler.fit(pd.concat((normal, anomaly)).drop(["Time", "Class"], axis=1))

    test = pd.concat((normal.iloc[:1900], anomaly.iloc[:100]))

    true = test.Class

    test = scaler.transform(test.drop(["Time", "Class"], axis=1))

    preds = []

    batch_size = 80

    for f in range(25):

    print(f"Batch {f}", end=" - ")

    sample = pd.DataFrame(test[f*batch_size:(f+1)*batch_size]).to_json(orient="split")

    output = query(sample)

    resp = pd.DataFrame([output])

    preds = np.concatenate((preds, resp.values[0]))

    print("Completed")

    eval_acc = accuracy_score(true, preds)

    eval_auc = roc_auc_score(true, preds)

    print("Eval Acc", eval_acc)

    print("Eval AUC", eval_auc)

    ```


    Once finished, you should see something like Figure [7-21](#499842_1_En_7_Chapter.xhtml#Fig21).


    ![../images/499842_1_En_7_Chapter/499842_1_En_7_Fig21_HTML.jpg](images/499842_1_En_7_Chapter/499842_1_En_7_Fig21_HTML.jpg)


    Figure 7-21


    The results of running your batch query script.


    ## Updating and Removing a Deployment


    Updating the model deployment is extremely easy. With how you set it up, it’s
    only a matter of quitting the model serving command (`Ctrl-C`), and rerunning
    the command with a different run ID.


    Let’s try deploying a different run. In your case, check your Google Storage bucket
    and pick the second run.


    In our case, we ran the following:


    ```

    mlflow models serve -m gs://mlops-storage/8/3862eb3bd89b43e8ace610c521d974e6/artifacts/log_reg_model
    -h 10.142.0.4

    ```


    As you can see in Figure [7-22](#499842_1_En_7_Chapter.xhtml#Fig22), it successfully
    deployed, and we can simply query it using the same script.


    ![../images/499842_1_En_7_Chapter/499842_1_En_7_Fig22_HTML.jpg](images/499842_1_En_7_Chapter/499842_1_En_7_Fig22_HTML.jpg)


    Figure 7-22


    Deploying a different model run using the same command convention.


    As for removing a deployment, all you have to do is just cancel the command with
    `Ctrl-C` and your deployment is now cancelled.


    With that, you now know how to serve models, switch a model and deploy a different
    one, and remove a deployment by simply canceling the model serving command.'
