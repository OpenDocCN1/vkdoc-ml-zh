    Figure 4-94


    MLFlow UI showing that your run has successfully finished


    If everything went well, you should see a run logged in this experiment. Click
    it, and you should see something like Figure [4-95](#499842_1_En_4_Chapter.xhtml#Fig96).


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig96_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig96_HTML.jpg)


    Figure 4-95


    Looking at the run, it appears that all of your metrics have successfully been
