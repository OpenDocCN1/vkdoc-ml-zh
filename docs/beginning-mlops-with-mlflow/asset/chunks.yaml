    接下来，找到您要部署的特定运行。转到您的 S3 存储桶列表，单击您创建的存储桶，其标题应为 `mlops-sagemaker-runs`。


    在此处导航，直到看到显示多个运行的文件夹。我们选择了最上面的运行。请参考图 5-10。


