  trans: '

    ### 加载数据集


    让我们开始吧！首先，打开一个新的笔记本，导入所有依赖项，并为该笔记本设置全局参数：


    ```

    %matplotlib inline

    import numpy as np

    import pandas as pd

    import matplotlib.pyplot as plt

    from pylab import rcParams

    rcParams[''figure.figsize''] = 14, 8

    ```


    请参考图 1-2。


    ![../images/499842_1_En_1_Chapter/499842_1_En_1_Fig2_HTML.jpg](img/499842_1_En_1_Fig2_HTML.jpg)


    图 1-2


    Jupyter 笔记本单元格，包含一些导入语句以及所有 matplotlib 图表尺寸的全局参数定义


    现在你已经导入了必要的库，可以加载数据集了。在本例中，`data` 文件夹与笔记本文件位于同一目录下，其中包含 `creditcard.csv` 文件。代码如下：


    ```

    data_path = "data/creditcard.csv"

    df = pd.read_csv(data_path)

    ```


    请参考图 1-3。


    ![../images/499842_1_En_1_Chapter/499842_1_En_1_Fig3_HTML.jpg](img/499842_1_En_1_Fig3_HTML.jpg)


    图 1-3


    定义信用卡数据集 .csv 文件的数据路径，读取其内容，并创建一个 pandas 数据框对象


    现在数据框已加载完毕，让我们查看一下它的内容：


    ```

    df.head()

    ```


    请参考图 1-4。


    ![../images/499842_1_En_1_Chapter/499842_1_En_1_Fig4_HTML.jpg](img/499842_1_En_1_Fig4_HTML.jpg)


    图 1-4


    在数据框上调用 `head()` 函数，以显示数据框的前五行


    如果你不熟悉 `df.head(n)` 函数，它本质上会打印数据框的前 n 行。如果像上图那样没有传入任何参数，则该函数默认值为 5，即打印数据框的前五行。


    你可以随意尝试使用该函数，也可以使用滚动条探索其余特征。


    现在，让我们查看一些与该数据框中数值相关的基本统计值：


    ```

    df.describe()

    ```


    请参考图 1-5。


    ![../images/499842_1_En_1_Chapter/499842_1_En_1_Fig5_HTML.jpg](img/499842_1_En_1_Fig5_HTML.jpg)


    图 1-5


    在数据框上调用 `describe()` 函数，以获取每列数据的统计摘要


    你可以随意向右滚动，查看其余列的各种统计信息。如图 1-5 所示，该函数会为数据框中每一列的数据生成统计摘要。


    这里的主要收获是数据点数量巨大。事实上，你可以通过简单调用以下代码来检查数据框的形状：


    ```

    df.shape

    ```


    请参考图 1-6。


    ![../images/499842_1_En_1_Chapter/499842_1_En_1_Fig6_HTML.jpg](img/499842_1_En_1_Fig6_HTML.jpg)


    图 1-6


    在数据框上调用 `shape()` 函数，以获取格式为 (行数, 列数) 的输出


