    Figure 4-92


    The output of the MLFlow run. The experiment has been created and the metrics
    and model successfully logged


    Alright, now that MLFlow has finished logging everything and the run has ended,
    open up the MLFlow UI. You should see something like Figure [4-93](#499842_1_En_4_Chapter.xhtml#Fig94).


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig94_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig94_HTML.jpg)


    Figure 4-93


