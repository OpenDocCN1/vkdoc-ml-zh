    对数据的深入分析有助于数据科学家更好地理解各个数据列之间的相互关系，并让他们能够识别趋势是否随时间推移而发生变化。随着数据随时间不断收集，数据偏差和趋势必然会发生变化。因此，也许一年后，`V18`列会显示出异常点和正常点之间的显著差异，而`V17`则显示大多数异常点都包含在正常点簇中。


    ## 总结


    数据分析是创建机器学习解决方案过程中的关键步骤。它不仅决定了模型的类型并影响将选择用于训练过程的特征集，还有助于识别随时间推移的任何趋势变化，这些变化可能表明模型需要进一步训练。您探索并分析了信用卡数据集中的数据，生成了许多图表以了解两个绘制变量之间的关系，并识别出了一些区分正常点和异常点的特征。在下一章中，您将处理数据以创建各种子集，从而帮助训练几种类型的机器学习模型。


    # 2. 构建模型


    在本章中，我们将介绍如何在`scikit-learn`和`PySpark`中构建一个简单的逻辑回归模型。我们还将介绍在`scikit-learn`中使用k折交叉验证来调整超参数的过程。


    ## 引言


    在上一章中，您加载了信用卡数据集并分析了其数据分布。您还查看了特征之间的关系，并对它们对标签的影响程度有了大致了解。


    现在您已经对数据集有了更好的理解，接下来将继续构建模型本身。您将使用与上一章相同的信用卡数据集。在本章中，您将了解两个框架：`scikit-learn`和`PySpark`。您在`scikit-learn`和`PySpark`中构建的模型将在本书的其余部分中保持相关性，因为稍后您将使用这两个模型将它们托管在云服务上进行预测。我们将保持简单，在这两个框架中构建逻辑回归模型。由于这两个框架的输入数据格式不同，您不能提前进行数据处理，然后为这两个框架使用相同的训练/测试/验证集。然而，例如，对于`scikit-learn`和`Keras`，这是可能的，具体取决于`Keras`模型中最后一层的构建方式。


    您将使用`scikit-learn`模型执行验证步骤以调整超参数。**超参数**可以被视为影响训练过程和结果的模型相关参数。


