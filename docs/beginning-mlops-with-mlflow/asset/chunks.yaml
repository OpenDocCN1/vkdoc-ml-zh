- fmt: "# Introduction\n\nIn the previous chapter, we went over how you can deploy\
    \ your models to Microsoft Azure, manage them through update or delete events,\
    \ and query them. This time, we will explore how you can operationalize your models\
    \ using Google Cloud.\n\n`MLFlow` does not provide explicit support for deploying\
    \ in Google Cloud like it does with AWS SageMaker and Microsoft Azure, and so\
    \ you will approach this a bit differently from how you operationalized models\
    \ in the previous two chapters.\n\nThis time, you will use the same model serving\
    \ functionality that you used in Chapter [4](#499842_1_En_4_Chapter.xhtml) except\
    \ you will host it on a Google Cloud machine that is accessible by the Internet.\
    \ However, deployment is far quicker this way since you don’t have to wait for\
    \ the creation of an endpoint. Furthermore, once you set up the machine, swapping\
    \ models is very simple, and you can serve multiple models by using different\
    \ ports.\n\nIt’s worth noting that Google Cloud has an assortment of advanced\
    \ tools and functionality dedicated to machine learning, such as Kubeflow. Kubeflow\
    \ is a tool that allows you to essentially integrate your machine learning lifecycles\
    \ into Kubernetes. And so all your machine learning pipelines are managed through\
    \ Kubernetes. Kubeflow also integrates into the Google Cloud platform, seeing\
    \ as how Kubernetes was built by Google. In this chapter, we will just go over\
    \ how you can deploy `MLFlow` logged models. We won’t get into any of the platform-specific\
    \ tools that help manage your machine learning lifecycles.\n\nBefore you begin,\
    \ here is an **important prerequisite**:\n\n* Download and install the Google\
    \ Cloud SDK so you can use the CLI to connect to your server.\n\nIn detail, we\
    \ will go over the following in this chapter:\n\n* **Configuring Google:** This\
    \ is perhaps the hardest step in this deployment process. First, you set up a\
    \ bucket and push the contents of your `mlruns` folder to be stored on the cloud.\n\
    \n  Next, you set up the virtual machine that will host your server when you deploy\
    \ the model. This involves installing Conda and `MLFlow`.\n\n  Finally, you set\
    \ up a firewall to allow your server to have inbound access through the default\
    \ port of 5000 that `MLFlow` uses so that you can actually connect to this server\
    \ through your Jupyter notebook.\n\n* **Deploying and querying the model:** Here,\
    \ you check the IP address, pick a run, and launch the code to serve the model.\
    \ Then, you query the model and run the batch query script as well.\n\n* **Updating\
    \ and removing a deployment:** Here, you stop deployment and simply rerun the\
    \ model serving script with a different model run to fulfill model switching functionality.\
    \ After you have updated the model, removing the deployment is as easy as stopping\
    \ the model serving.\n\n* **Cleaning up:** Here, you go through all of the new\
    \ services you used and delete them all so as not to incur any charges.\n\nWith\
    \ that, let’s get started!\n\n# Configuring Google\n\nMost of the work that is\
    \ involved in deploying your models using Google Cloud is actually taken up by\
    \ the configuration process. Once you set up the storage and the machine to host\
    \ your model, model serving becomes an extremely easy task. To switch up models,\
    \ you only need to change up the model run and let `MLFlow` take care of the rest.\n\
    \nAs for where you are storing the models, you will be using Google Cloud Storage\
    \ to do so. Once again, this fulfills a functionality similar to storing your\
    \ runs in Amazon S3 buckets or Azure blobs. The purpose of pushing all of your\
    \ runs to the cloud is so that there is a centralized storage container that holds\
    \ the models. Now anyone can access them anywhere around the world, and there\
    \ are no issues with version mismatch where your copy of the run happens to differ\
    \ with someone else’s. In a sense, this is serving the role of a model registry,\
    \ just without the added functionality of the `MLFlow Model Registry`.\n\n## Bucket\
    \ Storage\n\nAnd so, let’s begin. First, open up the Google Cloud portal. You\
    \ should see something like Figure [7-1](#499842_1_En_7_Chapter.xhtml#Fig1). Be\
    \ aware, though, that Google Cloud is also constantly being updated, so your portal\
    \ screen may look different.\n\n![../images/499842_1_En_7_Chapter/499842_1_En_7_Fig1_HTML.jpg](images/499842_1_En_7_Chapter/499842_1_En_7_Fig1_HTML.jpg)\n\
    \nFigure 7-1\n\nWhat our Google Cloud portal screen looks like\n\nNotice the scroll\
    \ bar on the left side of the screen. This is where you can look at the services\
    \ Google Cloud provides. Scroll to the section that says Storage, and click the\
    \ service named Storage. You should see something similar to Figure [7-2](#499842_1_En_7_Chapter.xhtml#Fig2).\n\
    \n![../images/499842_1_En_7_Chapter/499842_1_En_7_Fig2_HTML.jpg](images/499842_1_En_7_Chapter/499842_1_En_7_Fig2_HTML.jpg)\n\
    \nFigure 7-2\n\nSomething similar to what you might see. In your case, you might\
    \ not have any buckets here\n\nClick the button that says CREATE BUCKET. Type\
    \ in `mlops-storage`.\n\nNext, where it asks for a location type, select the Region\
    \ option to have the lowest costs. Refer to Figure [7-3](#499842_1_En_7_Chapter.xhtml#Fig3).\n\
    \n![../images/499842_1_En_7_Chapter/499842_1_En_7_Fig3_HTML.jpg](images/499842_1_En_7_Chapter/499842_1_En_7_Fig3_HTML.jpg)\n\
    \nFigure 7-3\n\nSpecifying the storage option for your bucket. Select Region to\
    \ keep the costs the lowest, although with the amount of data you are pushing,\
    \ the actual costs are very little\n\nKeep the rest of the options as is and click\
    \ the Create button. You should now see something that looks like Figure [7-4](#499842_1_En_7_Chapter.xhtml#Fig4).\n\
    \n![../images/499842_1_En_7_Chapter/499842_1_En_7_Fig4_HTML.jpg](images/499842_1_En_7_Chapter/499842_1_En_7_Fig4_HTML.jpg)\n\
    \nFigure 7-4\n\nWhat your bucket might look like after creation\n\nFrom here,\
    \ you want to upload your `MLFlow` experiments (the content of your `mlruns` directory)\
    \ as folders, so click Upload Folder, and upload all of the folders inside the\
    \ `mlruns` directory. You can leave out the folder named `.trash`. In our case,\
    \ we only uploaded the experiment using scikit-learn and left the rest out since\
    \ we won’t be using the other experiments.\n\nYou should see something like Figure\
    \ [7-5](#499842_1_En_7_Chapter.xhtml#Fig5) when finished.\n\n![../images/499842_1_En_7_Chapter/499842_1_En_7_Fig5_HTML.jpg](images/499842_1_En_7_Chapter/499842_1_En_7_Fig5_HTML.jpg)\n\
    \nFigure 7-5\n\nOur bucket after uploading the contents of our `mlruns` directory.\
    \ We only uploaded the experiment using scikit-learn to save on costs\n\nWith\
    \ that, you have finished configuring your storage. The next thing to configure\
    \ is the virtual machine that will be hosting your model."
