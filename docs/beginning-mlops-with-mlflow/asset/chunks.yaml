  trans: "\n5.  **构建模型：** 数据处理完成后，这一步的重点是选择合适的架构并构建模型。对于蛇类图像数据，使用卷积神经网络（CNN）是一个不错的选择，因为它在处理图像相关任务时表现非常出色。接下来，你需要根据模型的层结构来定义其具体架构。\n\
    \n6.  **训练、评估与验证：** 在训练 CNN 模型时，通常会分批传入数据，直到整个数据集完整地通过模型一次。根据这次“前向传播”的结果，模型会进行计算，指导如何调整权重，这些调整通过所谓的“反向传播”在网络中逆向进行。训练过程本质上是模型学习如何执行任务，并且随着它看到更多样本，其表现会越来越好。\n\
    \n训练过程结束后，接下来可以进行评估或验证步骤。只要测试集和验证集来自不同的数据分布（验证集可以从训练集中划分，而测试集可以从原始数据中划分），从技术上讲，模型在评估和验证过程中看到的是新数据。模型永远不会从评估数据中学习任何内容，因此你可以随时测试模型。\n\
    \n模型评估是指在模型从未见过的数据集上评估其性能指标，例如准确率、精确率、召回率等。我们将在下一章（第 2 章）中更详细地介绍评估步骤，届时其相关性会更强。\n\
    \n根据具体情境，验证的确切目的可能有所不同，同时训练后是否应先进行评估的问题也会变化。让我们定义几个需要使用验证的示例场景：\n    *   **选择模型架构：**\
    \ 对于多种模型类型或架构，你可以使用例如 k 折交叉验证，在验证集的某个数据分区上快速训练和评估每个模型，以了解它们的表现。这样，你就能清楚哪个模型表现最佳，从而选择该模型并继续后续流程。\n\
    \n*   **选择最佳模型：** 对于多个训练好的模型，你可以使用类似 k 折交叉验证的方法，在验证数据上快速评估每个模型，从而了解哪些模型表现最好。\n\
    \n*   **调整超参数：** 快速训练一个模型，并用不同的超参数设置进行测试，以了解哪些配置效果更好。你可以从较宽的超参数范围开始，然后根据结果缩小范围，直到找到满意的配置。例如，深度学习模型可能有很多超参数，因此使用验证来调整这些超参数在深度学习环境中效果很好。但要注意收益递减现象。当超参数设置达到一定精度后，模型性能的提升就不会那么显著了。\n\
    \n*   **高方差的指示：** 这个验证数据与前三个示例略有不同。在神经网络的情况下，该数据是从训练数据中划分出的一小部分。在训练数据完整通过一次后，模型会在这个验证数据上进行评估，以计算损失和准确率等指标。\n\
    \n如果训练准确率高且训练损失低，但验证准确率低且验证损失高，这表明你的模型存在**高方差**问题。这意味着模型没有学会将其“学习”到的内容泛化到新数据上，因为此处的验证数据由它从未见过的数据组成。换句话说，你的模型正在**过拟合**。模型无法在新数据上复现其在训练数据上获得的表现。\n\
    \n如果模型训练准确率低且训练损失高，则表明模型存在**高偏差**问题，这意味着它根本没有学会如何在训练数据上正确执行任务。\n\n训练过程中的这一小部分验证拆分可以让你及早发现过拟合何时发生。\n\
    \n7.  **进行预测：** 一旦模型经过训练、评估和验证，就可以进行预测了。在蛇类检测器的场景中，这一步涉及输入相关蛇类的视觉图像，以获得某种预测结果。例如，如果模型需要检测蛇、在其周围画框并标注（在目标检测任务中），它就会执行这些操作，并在应用中实时显示结果。\n\
    \n如果模型只是对图片中的蛇进行分类，用户只需通过应用将蛇的照片发送给模型，即可获得物种分类预测结果，可能还会附带一个概率置信度分数。\n\n希望现在你对创建机器学习解决方案的过程有了更清晰的认识。\n\
    \n了解了这些之后，让我们开始示例部分，你将使用信用卡数据集，利用这些数据构建简单的异常检测模型。\n\n## 信用卡数据集\n\n在执行任何数据分析之前，你首先需要收集数据。同样，该数据集可以在以下链接找到：[`www.kaggle.com/mlg-ulb/creditcardfraud`](https://www.kaggle.com/mlg-ulb/creditcardfraud)。\n\
    \n点击链接后，你应该会看到类似下图 1-1 的内容。\n\n![../images/499842_1_En_1_Chapter/499842_1_En_1_Fig1_HTML.jpg](img/499842_1_En_1_Fig1_HTML.jpg)\n\
    \n图 1-1\n\nKaggle 网站上关于信用卡数据的页面\n\n接下来，你需要点击“新建笔记本”旁边的“下载（144 MB）”按钮来下载数据集。如果你尚未登录，系统会跳转到登录页面，但登录后你应该就能下载数据集了。\n\
    \n下载完成后，将 zip 文件解压到某个位置，即可获得信用卡数据集。现在，让我们打开 Jupyter 并探索这个数据集。在开始这一步之前，我们先了解一下所需的具体包及其版本：\n\
    \n*   Python 3.6.5\n\n*   numpy 1.18.3\n\n*   pandas 0.24.2\n\n*   matplotlib\
    \ 3.2.1\n\n要检查你的包版本，可以运行如下命令：\n\n```\npip show package_name\n```\n\n或者，你也可以在笔记本中运行以下代码来显示版本：\n\
    \n```\nimport module_name\nprint(module_name.__version__)\n```\n\n在此例中，`module_name`\
    \ 是你导入的包名，例如 numpy。\n"
- fmt: '### Loading the Data Set


    Let’s begin! First, open a new notebook and import all of the dependencies and
    set global parameters for this notebook:


    ```

    %matplotlib inline

    import numpy as np

    import pandas as pd

    import matplotlib.pyplot as plt

    from pylab import rcParams

    rcParams[''figure.figsize''] = 14, 8

    ```


    Refer to Figure [1-2](#499842_1_En_1_Chapter.xhtml#Fig2).


    ![../images/499842_1_En_1_Chapter/499842_1_En_1_Fig2_HTML.jpg](images/499842_1_En_1_Chapter/499842_1_En_1_Fig2_HTML.jpg)


    Figure 1-2


    Jupyter notebook cell with some import statements as well as a global parameter
    definition for the size of all matplotlib plots


    Now that you have imported the necessary libraries, you can load the data set.
    In this case, the `data` folder exists in the same directory as the notebook file
    and contains the `creditcard.csv` file. Here is the code:


    ```

    data_path = "data/creditcard.csv"

    df = pd.read_csv(data_path)

    ```


    Refer to Figure [1-3](#499842_1_En_1_Chapter.xhtml#Fig3).


    ![../images/499842_1_En_1_Chapter/499842_1_En_1_Fig3_HTML.jpg](images/499842_1_En_1_Chapter/499842_1_En_1_Fig3_HTML.jpg)


    Figure 1-3


    Defining the data path to the credit card data set `.csv` file, reading its contents,
    and creating a pandas data frame object


    Now that the data frame has been loaded, let’s take a look at its contents:


    ```

    df.head()

    ```


    Refer to Figure [1-4](#499842_1_En_1_Chapter.xhtml#Fig4).


    ![../images/499842_1_En_1_Chapter/499842_1_En_1_Fig4_HTML.jpg](images/499842_1_En_1_Chapter/499842_1_En_1_Fig4_HTML.jpg)


    Figure 1-4


    Calling the `head()` function on the data frame to display the first five rows
    of the data frame


    If you are not familiar with the `df.head(n)` function, it essentially prints
    the first `n` rows of the data frame. If you did not pass any arguments, like
    in the figure above, then the function defaults to a value of five, printing the
    first five rows of the data frame.


    Feel free to play around with that function as well as use the scroll bar to explore
    the rest of the features.


    Now, let’s look at some basic statistical values relating to the values in this
    data frame:


    ```

    df.describe()

    ```


    Refer to Figure [1-5](#499842_1_En_1_Chapter.xhtml#Fig5).


    ![../images/499842_1_En_1_Chapter/499842_1_En_1_Fig5_HTML.jpg](images/499842_1_En_1_Chapter/499842_1_En_1_Fig5_HTML.jpg)


    Figure 1-5


    Calling the `describe()` function on the data frame to get statistical summaries
    of the data in each column


    Feel free to scroll right and look at the various statistics for the rest of the
    columns. As you can see in Figure [1-5](#499842_1_En_1_Chapter.xhtml#Fig5), the
    function generates statistical summaries for data in each of the columns in the
    data frame.


    The main takeaway here is that there are a huge number of data points. In fact,
    you can check the shape of the data frame by simply calling


    ```

    df.shape

    ```


    Refer to Figure [1-6](#499842_1_En_1_Chapter.xhtml#Fig6).


    ![../images/499842_1_En_1_Chapter/499842_1_En_1_Fig6_HTML.jpg](images/499842_1_En_1_Chapter/499842_1_En_1_Fig6_HTML.jpg)


    Figure 1-6


    Calling the `shape()` function on the data frame to get an output in the format
    `(number_of_rows, number_of_columns)`


    There are 284,807 rows and 31 columns in this data frame. That’s a lot of entries!
    Not only that, but if you look at Figure [1-5](#499842_1_En_1_Chapter.xhtml#Fig5),
    you’ll see that the values can get really large for the column `Time`. In fact,
    keep scrolling right, and you’ll see that values can get very large for the column
    `Amount` as well. Refer to Figure [1-7](#499842_1_En_1_Chapter.xhtml#Fig7).


    ![../images/499842_1_En_1_Chapter/499842_1_En_1_Fig7_HTML.jpg](images/499842_1_En_1_Chapter/499842_1_En_1_Fig7_HTML.jpg)


    Figure 1-7


    Scrolling right in the output of the `describe` function reveals that the maximum
    data value in the column `Amount` is also very large, just like the maximum data
    value in the column `Time`


    As you can see, there are at least two columns with very large values. What this
    tells you is that later on, when building the various data sets for the model
    training process, you definitely need to scale down the data. Otherwise, such
    large data values can potentially mess up the training process.


    ### Normal Data and Fraudulent Data


    Since there are only two classes, `normal` and `fraud`, let’s split up the data
    frame by class and continue with the data analysis. In the context of anomaly
    detection, the `fraud` class is also the `anomaly` class, hence why we chose to
    name the data frame representing fraudulent transaction data `anomalies` and interchangeably
    refer to this class as either `fraud` or `anomaly`.


    Here is the code:


    ```

    anomalies = df[df.Class == 1]

    normal = df[df.Class == 0]

    ```


    After that, run the following in a separate cell:


    ```

    print(f"Anomalies: {anomalies.shape}")

    print(f"Normal: {normal.shape}")

    ```


    Refer to Figure [1-8](#499842_1_En_1_Chapter.xhtml#Fig8).


    ![../images/499842_1_En_1_Chapter/499842_1_En_1_Fig8_HTML.jpg](images/499842_1_En_1_Chapter/499842_1_En_1_Fig8_HTML.jpg)


    Figure 1-8


    Defining data frames for fraudulent/anomalous data and for normal data and printing
    their shapes


    From here, you can see that the data is overwhelmingly biased towards normal data,
    and that anomalies only comprise a vast minority of data points in the overall
    data set. What this tells you is that you will have to craft the training, evaluation,
    and validation sets more carefully so each of these sets will have a good representation
    of anomaly data.


    In fact, let’s look at this disparity in a graphical manner just to see how large
    the difference is:


    ```

    class_counts = pd.value_counts(df[''Class''], sort = True)

    class_counts.plot(kind = ''bar'', rot=0)

    plt.title("Class Distribution")

    plt.xticks(range(2), ["Normal", "Anomaly"])

    plt.xlabel("Label")

    plt.ylabel("Counts")

    ```


    Refer to Figure [1-9](#499842_1_En_1_Chapter.xhtml#Fig9).


    ![../images/499842_1_En_1_Chapter/499842_1_En_1_Fig9_HTML.jpg](images/499842_1_En_1_Chapter/499842_1_En_1_Fig9_HTML.jpg)


    Figure 1-9


    A graph visually demonstrating the difference in counts for normal data and anomalous
    data


    The graph visually shows the immense difference between the number of data values
    of the two classes.


    So now you can begin analyzing some of the characteristics of data points in each
    class. First of all, the columns in this data set are `Time`, values `V1` through
    `V28`, `Amount`, and `Class`.


    So, do anomalous data values comprise transactions with excessive amounts? Let’s
    look at some statistical summary values for `Amount`:


    ```

    anomalies.Amount.describe()

    ```


    Refer to Figure [1-10](#499842_1_En_1_Chapter.xhtml#Fig10) for the output.


    ![../images/499842_1_En_1_Chapter/499842_1_En_1_Fig10_HTML.jpg](images/499842_1_En_1_Chapter/499842_1_En_1_Fig10_HTML.jpg)


    Figure 1-10


    Output of the `describe()` function on the data frame for fraudulent values for
    the column `Amount`


    It seems like the data is skewed right, and that anomalous transactions comprise
    values that are not very high. In fact, most of the transactions are less than
    $100, so it’s not like fraudulent transactions are high-value transactions.


    ```

    normal.Amount.describe()

    ```


    Refer to Figure [1-11](#499842_1_En_1_Chapter.xhtml#Fig11) for the output.


    ![../images/499842_1_En_1_Chapter/499842_1_En_1_Fig11_HTML.jpg](images/499842_1_En_1_Chapter/499842_1_En_1_Fig11_HTML.jpg)


    Figure 1-11


    Output of the `describe()` function on the data frame for normal values for the
    column `Amount`


    If you look at the normal data, it’s even more skewed right than the anomalies.
    Most of the transactions are below $100, and some of the amounts can get very
    high to values like $25,000.'
