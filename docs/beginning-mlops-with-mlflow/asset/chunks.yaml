  trans: "\n## 引言\n\n在上一章中，你了解了什么是 MLFlow，以及如何利用其提供的功能将 MLOps 原则集成到你的代码中。你还学习了如何将模型部署到本地服务器并执行模型推理。然而，现在是时候进入下一阶段，探索如何将你的机器学习模型部署到云平台，以便多个实体可以使用其预测服务。\n\
    \n在开始之前，这里有一些**重要的前提条件**：\n\n*   你必须已安装 AWS 命令行界面（CLI）并配置好凭证。\n    *   凭证验证通过后，AWS\
    \ CLI 可让你连接到 AWS 工作区。从这里开始，你可以通过命令行创建新的存储桶、检查 SageMaker 端点等。\n\n*   你必须定义一个身份和访问管理（IAM）执行角色，该角色授予\
    \ SageMaker 访问你的 S3 存储桶的权限。有关更多信息，请参考图 5-8。\n\n*   你必须已安装 Docker 并确保其正常工作。验证你能够构建\
    \ Docker 镜像。\n    *   确保 Docker 在你的系统上正常工作至关重要，因为如果没有它，MLFlow 就无法构建要推送到 AWS ECR\
    \ 的 Docker 容器镜像。\n\n我们还建议你了解 AWS 的基本情况及其工作原理。具备 AWS 的背景知识有助于你理解本章内容，并能让你更轻松地解决任何问题。\n\
    \n具体来说，我们将在本章中讨论以下内容：\n\n*   **配置 AWS：** 在此步骤中，你将设置一个存储桶，并将你的 `mlruns` 文件夹推送到此处以存储在云端。这些文件夹包含与实验相关的所有运行信息以及记录的模型本身。接下来，你将构建一个由\
    \ MLFlow 定义的专用 Docker 容器，并将其推送到 AWS ECR。SageMaker 使用此容器镜像来提供 MLFlow 模型服务。\n\n\
    *   **将模型部署到 AWS SageMaker：** 在此步骤中，你将使用内置的 MLFlow SageMaker 模块代码将模型推送到 SageMaker。SageMaker\
    \ 创建端点后，模型将利用你之前推送到 ECR 的 Docker 镜像托管在此处。\n\n*   **进行预测：** 模型完成部署并准备好提供服务后，你将使用\
    \ Boto3 查询模型并接收预测结果。\n\n*   **切换模型：** MLFlow 提供了让你能够将已部署的模型切换为新模型的功能。SageMaker\
    \ 本质上会用你尝试部署的新模型更新端点。\n\n*   **移除已部署的模型：** 最后，MLFlow 允许你完全移除已部署的模型并删除端点。这样做很重要，可以避免因端点持续运行而产生费用。\n\
    \n另外，需要注意的是，AWS 正在持续开发中，功能和操作流程可能会发生变化！这意味着现在能用的功能，将来可能无法使用。\n\n不过，MLFlow 专门为\
    \ SageMaker 提供了支持，因此如果 SageMaker 运行方式的基础部分在未来发生变化，MLFlow 很可能会在下一个版本中加以考虑。\n\n\
    在最坏的情况下，如果上述情况没有发生，你仍然可以运行一个 MLFlow 服务器并将其托管在 AWS 上。你仍然可以部署模型并使用它们进行推理，整体功能依然保留。与直接使用\
    \ MLFlow 容器镜像让 SageMaker 托管模型不同，你需要执行类似于我们在第 4 章中进行的本地模型部署实验的操作，只不过你需要连接到托管 MLFlow\
    \ 服务器的服务器 IP 和端口。\n\n我们将探讨如何使用 Google Cloud 实现这一点，因为 MLFlow 对 Google Cloud 的支持不如对\
    \ SageMaker 和 Azure 那样完善。\n\n那么，让我们开始吧！\n\n## 配置 AWS\n\n在将任何模型实际推送到 SageMaker\
    \ 之前，你需要设置你的 Amazon 工作区。你可以像进行本地模型部署一样，从本地的 `mlruns` 目录推送模型，但将所有运行推送到 AWS 并存储在存储桶中会更加方便和集中。这样，所有团队都可以访问存储在此处的模型。从某种意义上说，这可以充当你的“模型注册表”，尽管它不提供与\
    \ MLFlow 提供的模型注册表相同的功能。\n\nMLFlow 允许你选取特定的运行，并决定将该模型暂存到开发分支还是生产分支。在这种情况下，你可以为每个团队设置存储桶，并划分为开发或生产分支。这比\
    \ MLFlow 的模型注册表多了一些步骤，但它仍然能让你享受到拥有模型注册表的好处。\n\n在本例中，你将只创建一个存储桶来托管你所有的 MLFlow 运行。从这里开始，你将选择一个特定的运行并部署到\
    \ SageMaker。为简单起见，你将再次使用之前训练的 scikit-learn 逻辑回归模型作为要部署的模型。\n\n那么，创建一个简单的存储桶，并将其命名为类似\
    \ `mlflow-sagemaker` 的名称。你可以通过 AWS CLI 创建，也可以通过浏览器中的 AWS 控制台创建。\n\n我们将采用后一种方式，这样你可以直观地看到\
    \ Amazon 在创建存储桶时实际做了什么。\n\n请记住，AWS 一直在更新其用户界面，因此你的屏幕可能不会与所展示的完全一样。话虽如此，你仍然很可能能够访问\
    \ S3 存储桶服务，因此核心功能应该保持不变，尽管用户界面有所变化。\n\n当你登录门户时，应该会看到类似图 5-1 的内容。\n\n![../images/499842_1_En_5_Chapter/499842_1_En_5_Fig1_HTML.jpg](img/499842_1_En_5_Fig1_HTML.jpg)\n\
    \n图 5-1\n\nAWS 控制台的主屏幕。请注意，你的屏幕很可能与这里显示的有所不同\n\n如你所见，你可以使用搜索栏查找服务。在这里，输入 `S3`，然后点击显示“S3”且描述为“云中的可扩展存储”的结果。\n\
    \n你应该会进入一个类似图 5-2 的页面。\n\n![../images/499842_1_En_5_Chapter/499842_1_En_5_Fig2_HTML.jpg](img/499842_1_En_5_Fig2_HTML.jpg)\n\
    \n图 5-2\n\n打开 S3 存储桶服务模块时屏幕可能的样子。我们已将存储桶的名称灰化处理，但你可以在此处看到字符串名称\n\n你应该会看到一个标有“创建存储桶”的按钮。点击它，你将看到类似图\
    \ 5-3 的内容。\n\n![../images/499842_1_En_5_Chapter/499842_1_En_5_Fig3_HTML.jpg](img/499842_1_En_5_Fig3_HTML.jpg)\n\
    \n图 5-3\n\n这是你的存储桶创建屏幕可能的样子。在本例中，你只需命名存储桶，无需关心其他选项\n\n我们将存储桶命名为 `mlops-sagemaker-runs`。你无需担心其余选项，直接滚动到底部并点击“创建存储桶”。完成后，你应该能够在存储桶列表中看到你的存储桶。\n\
    \n接下来，让我们使用一个子进程将本地的 `mlruns` 目录同步到此存储桶。这样做会将整个 `mlruns` 目录上传到你的存储桶，从而将所有运行都存储在云端。\n\
    \n首先，收集以下属性：\n\n*   `s3_bucket_name`：你尝试推送到的 S3 存储桶的名称是什么？\n\n*   `mlruns_directory`：你推送到存储桶的\
    \ `mlruns` 目录的位置在哪里？\n\n基于这些信息，运行以下命令。我们在示例中包含了存储桶名称和 `mlruns` 目录，因此只需将它们替换为你自己的值即可。\n"
- fmt: '```python

    import subprocess

    s3_bucket_name = "mlops-sagemaker-runs"

    mlruns_direc = "./mlruns/"

    output = subprocess.run(["aws",  "s3", "sync", "{}".format(mlruns_direc), "s3://{}".format(s3_bucket_name)],
    stdout=subprocess.PIPE, encoding=''utf-8'')

    print(output.stdout)

    print("\nSaved to bucket: ", s3_bucket_name)

    ```


    After running that code, you should see something similar to Figure [5-4](#499842_1_En_5_Chapter.xhtml#Fig4),
    letting you know that it has synchronized your local `mlruns` directory with the
    bucket. If you see no output, that means there’s nothing new to push (if you are
    rerunning it). Ensure that the `mlruns` directory is in the same directory as
    this notebook; otherwise it won’t be able to find it.


    ![../images/499842_1_En_5_Chapter/499842_1_En_5_Fig4_HTML.jpg](images/499842_1_En_5_Chapter/499842_1_En_5_Fig4_HTML.jpg)


    Figure 5-4


    This is what your output may look like when you are first syncing your `mlruns`
    directory with the bucket. Make sure that your `mlruns` directory is in the same
    directory as this notebook file.


    Once this is done, you can proceed to building the container that SageMaker will
    use to host the model once you get to deployment. To do that, run the following
    command in your terminal:


    ```

    mlflow sagemaker build-and-push-container

    ```


    Again, this requires you to have your Amazon credentials configured.


    You do not need to create a new docker image each time you use a new framework.
    This one image will be able to handle all your MLFlow models thanks to modularization.
    This is similar to the deployment pipeline we discussed in Chapter [3](#499842_1_En_3_Chapter.xhtml)
    from which you simply need to swap models in and out.


    This step can take some time, so sit back, relax, and let it do its thing. You
    should see something like Figure [5-5](#499842_1_En_5_Chapter.xhtml#Fig5).


    ![../images/499842_1_En_5_Chapter/499842_1_En_5_Fig5_HTML.jpg](images/499842_1_En_5_Chapter/499842_1_En_5_Fig5_HTML.jpg)


    Figure 5-5


    Something similar to what you should see when you run the command to build the
    container.


    Once this is finished, the console should output something like Figure [5-6](#499842_1_En_5_Chapter.xhtml#Fig6).


    ![../images/499842_1_En_5_Chapter/499842_1_En_5_Fig6_HTML.jpg](images/499842_1_En_5_Chapter/499842_1_En_5_Fig6_HTML.jpg)


    Figure 5-6


    What you should see when the docker container image has successfully been built
    and pushed to Amazon ECR.


    Now, you should be able to see a new container in the portal when you navigate
    to Amazon ECR.


    From your home console, navigate to Amazon ECR, and verify you see something called
    `mlflow-pyfunc`. You should see something like Figure [5-7](#499842_1_En_5_Chapter.xhtml#Fig7),
    confirming that the docker image has successfully been pushed to AWS ECR.


    ![../images/499842_1_En_5_Chapter/499842_1_En_5_Fig7_HTML.jpg](images/499842_1_En_5_Chapter/499842_1_En_5_Fig7_HTML.jpg)


    Figure 5-7


    After running the command, you should be able to see your container in the ECR
    repository list.


    With that, you have set up everything related to MLFlow functionality that you
    need in your AWS console in order to deploy your models to SageMaker.


    Let’s now look at deploying one of the models.


    ## Deploying a Model to AWS SageMaker


    To deploy a model to SageMaker, you need to gather the following information:


    *   `app_name`

    *   `model_uri`

    *   `execution_role`

    *   `region`

    *   `image_ecr_url`


    The execution role refers to the Identity and Access Management (IAM) role, which
    you can find by searching for "IAM" in the console. Once you have created or selected
    an execution role (make sure it can access S3 and can perform get, put, delete,
    and list operations on it), copy the entire value that exists there.


    As for the specific policy that this role should follow, refer to Figure [5-8](#499842_1_En_5_Chapter.xhtml#Fig8)
    to see how our IAM execution role is set up.


    As for the execution role ARN number, you should see something like Figure [5-8](#499842_1_En_5_Chapter.xhtml#Fig8).


    ![../images/499842_1_En_5_Chapter/499842_1_En_5_Fig8_HTML.jpg](images/499842_1_En_5_Chapter/499842_1_En_5_Fig8_HTML.jpg)


    Figure 5-8


    In the IAM tab, under policies, select (or create) the role you are going to use
    to execute the deployment process. There, you should be able to see the specific
    Policy ARN value, which you must copy and keep track of.


    Make sure you have the Policy ARN value copied down. AWS lets you copy it to the
    clipboard if you click the little clipboard symbol next to the policy.


    To find the `image_ecr_url` value, go back to the ECR and look for something like
    Figure [5-7](#499842_1_En_5_Chapter.xhtml#Fig7). Now click it to see something
    like Figure [5-9](#499842_1_En_5_Chapter.xhtml#Fig9).


    ![../images/499842_1_En_5_Chapter/499842_1_En_5_Fig9_HTML.jpg](images/499842_1_En_5_Chapter/499842_1_En_5_Fig9_HTML.jpg)


    Figure 5-9


    The Image URI is the value you want to copy.


    Copy the value where it says Image URI, except for the version you want. We are
    running MLFlow version 1.10.0, so copy the value for that one.


    Next, find the specific run that you want to deploy. Go to your list of S3 buckets
    and click the one you created, which should be titled `mlops-sagemaker-runs`.


    In here, navigate until you see the folder with several runs displayed. We picked
    the top run. Refer to Figure [5-10](#499842_1_En_5_Chapter.xhtml#Fig10).


    ![../images/499842_1_En_5_Chapter/499842_1_En_5_Fig10_HTML.jpg](images/499842_1_En_5_Chapter/499842_1_En_5_Fig10_HTML.jpg)


    Figure 5-10


    Look at your bucket to find the run you want to deploy. (These runs all have the
    same performance metrics, so it does not matter which one we pick. If it did,
    we could look at it through the MLFlow UI (ensuring the terminal is in the same
    directory as the same `mlruns` directory we pushed) and select the best run.)
    Also, remember to take note of the experiment ID and the name of the model you
    logged. You should be able to find it if you click the run ID and then artifacts.
    For our case, it is `log_reg_model`.


    With all that information gathered, let’s proceed to the deployment. Run the following:


    ```python

    import boto3

    import mlflow.sagemaker as mfs

    import json

    app_name = "mlops-sagemaker"

    execution_role_arn = "arn:aws:iam::180072566886:role/service-role/AmazonSageMaker-ExecutionRole-20181112T142060"

    image_ecr_url = "180072566886.dkr.ecr.us-east-2.amazonaws.com/mlflow-pyfunc:1.10.0"

    region = "us-east-2"

    s3_bucket_name = "mlops-sagemaker-runs"

    experiment_id = "8"

    run_id = "1eb809b446d949d5a70a1e22e4b4f428"

    model_name = "log_reg_model"

    model_uri = "s3://{}/{}/{}/artifacts/{}/".format(s3_bucket_name, experiment_id,
    run_id, model_name)

    ```


    This will set up all of the parameters that you will use to run the deployment
    code.


    Finally, let’s get on to the actual deployment code:


    ```python

    mfs.deploy(app_name=app_name,

    model_uri=model_uri,

    execution_role_arn=execution_role_arn,

    region_name=region,

    image_url=image_ecr_url,

    mode=mfs.DEPLOYMENT_MODE_CREATE)

    ```


    You should see something like Figure [5-11](#499842_1_En_5_Chapter.xhtml#Fig11).


    ![../images/499842_1_En_5_Chapter/499842_1_En_5_Fig11_HTML.jpg](images/499842_1_En_5_Chapter/499842_1_En_5_Fig11_HTML.jpg)


    Figure 5-11'
