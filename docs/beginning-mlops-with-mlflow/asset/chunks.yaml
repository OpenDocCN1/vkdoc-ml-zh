- fmt: '#### Data Preprocessing


    With the model now selected and built, and with feature data supplied by the feature
    store, the process can now move forward to the next stage in the pipeline: data
    preprocessing. Refer to Figure [3-7](#499842_1_En_3_Chapter.xhtml#Fig7).


    ![../images/499842_1_En_3_Chapter/499842_1_En_3_Fig7_HTML.jpg](images/499842_1_En_3_Chapter/499842_1_En_3_Fig7_HTML.jpg)


    Figure 3-7


    The operator has chosen to normalize and resize the image data. The process creates
    a training set, a testing set, and a validation set.


    The data preprocessing can be done manually or automatically. In this case, the
    data preprocessing only involves normalization and resizing of image feature data,
    so the operator can implement this manually. Depending on the level of automation,
    the operator can also call some function that takes in data and automatically
    processes it depending on the type of data and any other parameters provided.


    Either way, the end of the processing stage will result in the data being broken
    up into subsets. In this example, the operator chose to create a training set,
    a testing set, and a validation set. Now, the operator can begin the training
    process.


    #### Training Process


    Depending on the framework being used, the operator can further split up the training
    data into a training set and a data validation set and use both in the training
    process. The data validation set exists totally separate from the training set
    (although it is derived from it) since the model never sees it during training.
    Its purpose is to periodically evaluate the model’s performance on a data set
    that it has never seen before. Refer to Figure [3-8](#499842_1_En_3_Chapter.xhtml#Fig8).


    ![../images/499842_1_En_3_Chapter/499842_1_En_3_Fig8_HTML.jpg](images/499842_1_En_3_Chapter/499842_1_En_3_Fig8_HTML.jpg)


    Figure 3-8


    The model training process begins.


    In the context of deep learning, for example, the model can evaluate on the validation
    set at the end of each epoch, generating some metric data for the operator to
    see. Based on this, the operator can judge how the model is doing and whether
    or not it could be overfitting and adjust hyperparameters or model structure if
    needed.


    The `API` can also be told what script to run in order to initiate this entire
    pipeline process. The script can contain the training, evaluation, and validation
    code all at once so the `API` can run this entire pipeline when needed.


    Once the training process is done, the process moves to the evaluation stage.


    #### Model Evaluation


    In the evaluation stage, the model’s performance is measured on a test data set
    that it has never seen. This performance will indicate to the operator whether
    or not the model is overfitting, especially if it performed extremely well in
    training but has trouble replicating those results in this stage. That is part
    of why the training data can be split to include some validation data, as it can
    be an early indicator of overfitting. This can be crucial especially if the model
    takes a significant amount of time to run. You would rather know earlier, partway
    through training, if the model is overfitting, rather than after it ran all night
    and is evaluated the next morning. Refer to Figure [3-9](#499842_1_En_3_Chapter.xhtml#Fig9).


    ![../images/499842_1_En_3_Chapter/499842_1_En_3_Fig9_HTML.jpg](images/499842_1_En_3_Chapter/499842_1_En_3_Fig9_HTML.jpg)


    Figure 3-9


    Training results are stored in a common area (for example, the `API` could be
    called to monitor these results) for the metrics of the current model. Model evaluation
    begins on the trained model using the testing set.


    Another thing to note again is that the validation stage could come before the
    evaluation stage, but in this case, the trained model will be evaluated first
    on a test data set before the validation stage begins. This is just to get a sense
    of how the model does on the testing set before hyperparameter tuning begins.
    Of course, hyperparameter tuning via the validation step could be performed first
    before the final model evaluation, but in some frameworks, model evaluation would
    come first. An example of this is a validation process like `scikit-learn`’s cross-validation.
    Of course, you can evaluate the tuned model on the test set once again to get
    a final performance evaluation.


    Once the evaluation finishes, metrics are stored by the `API` or by some other
    mechanism that the team has implemented, and the process moves on to the validation
    stage.


    #### Model Validation


    In this stage, the model begins the validation process, which attempts to seek
    the best hyperparameters. You could combine the use of a script to iterate through
    various configurations of hyperparameter values and utilize k-fold cross-validation,
    for example, to help decide the best hyperparameters. Refer to Figure [3-10](#499842_1_En_3_Chapter.xhtml#Fig10).


    ![../images/499842_1_En_3_Chapter/499842_1_En_3_Fig10_HTML.jpg](images/499842_1_En_3_Chapter/499842_1_En_3_Fig10_HTML.jpg)


    Figure 3-10


    Evaluation metrics are stored along with the training metrics by the `API`, and
    the validation process begins.


    In any case, the point of a validation set is to help tune the model’s hyperparameters.
    The team could even automate this process entirely if they tend to train a lot
    of models of the same few types, saving time and resources in the long run by
    automating the validation and hyperparameter tuning process for that set of models.


    Finally, once the model achieves a good level of performance and finishes the
    validation stage, the validation results are stored, and all relevant data is
    displayed as a summary to the operator. Again, depending on the level of automation,
    perhaps the model is retrained and evaluated on the best hyperparameter setup
    discovered in the validation stage. The `API` simply needs to be told what metrics
    to track and it will automatically do so.


    #### Model Summary


    At this point, the operator can compare the outcome of this experiment with that
    of other models, using the metrics as baselines for comparison. The `API` can
    track the relevant metrics for different model runs and can compare them all at
    the same time. Should the operator decide to move forward with this particular
    model, the `API` and the MLOps software can allow for deployment on a simple click
    of a button. Usually, the deployment is to a staging environment first, where
    the functionality can be tested further before moving directly into the production
    environment. Everything is configurable, and the `API` can adapt to the needs
    of the business and its workflow. If the developers want to deploy straight to
    production, sure, though that could potentially be unwise considering the case
    of failure. Refer to Figure [3-11](#499842_1_En_3_Chapter.xhtml#Fig11).


    ![../images/499842_1_En_3_Chapter/499842_1_En_3_Fig11_HTML.jpg](images/499842_1_En_3_Chapter/499842_1_En_3_Fig11_HTML.jpg)


    Figure 3-11


    Validation is complete, and all metrics are displayed to the operator.


    After the model passes the tests in the staging environment, it can then be deployed
    to the production environment, where it can be further monitored by the software.


    Hopefully now you have a better understanding of what a pipeline really is. The
    pipelines for models and pipeline integration testing are similar, except they
    are assisted by MLOps software and APIs such as `Databricks` and `MLFlow`, for
    example. Let’s now look at how you can go about using those APIs and software
    to help you implement MLOps.'
  raw: '#### Data Preprocessing


    With the model now selected and built, and with feature data supplied by the feature
    store, the process can now move forward to the next stage in the pipeline: data
    preprocessing. Refer to Figure [3-7](#499842_1_En_3_Chapter.xhtml#Fig7).


    ![../images/499842_1_En_3_Chapter/499842_1_En_3_Fig7_HTML.jpg](images/499842_1_En_3_Chapter/499842_1_En_3_Fig7_HTML.jpg)


    Figure 3-7


    The operator has chosen to normalize and resize the image data. The process creates
    a training set, a testing set, and a validation set


    The data preprocessing can be done manually or automatically. In this case, the
    data preprocessing only involves normalization and resizing of image feature data,
    so the operator can implement this manually. Depending on the level of automation,
    the operator can also call some function that takes in data and automatically
    processes it depending on the type of data and any other parameters provided.


    Either way, the end of the processing stage will result in the data being broken
    up into subsets. In this example, the operator chose to create a training set,
    a testing set, and a validation set. Now, the operator can begin the training
    process.


    #### Training Process


    Depending on the framework being used, the operator can further split up the training
    data into a training set and a data validation set and use both in the training
    process. The data validation set exists totally separate from the training set
    (although it is derived from it) since the model never sees it during training.
    Its purpose is to periodically evaluate the model’s performance on a data set
    that it has never seen before. Refer to Figure [3-8](#499842_1_En_3_Chapter.xhtml#Fig8).


    ![../images/499842_1_En_3_Chapter/499842_1_En_3_Fig8_HTML.jpg](images/499842_1_En_3_Chapter/499842_1_En_3_Fig8_HTML.jpg)


    Figure 3-8


    The model training process begins


    In the context of deep learning, for example, the model can evaluate on the validation
    set at the end of each epoch, generating some metric data for the operator to
    see. Based on this, the operator can judge how the model is doing and whether
    or not it could be overfitting and adjust hyperparameters or model structure if
    needed.


    The API can also be told what script to run in order to initiate this entire pipeline
    process. The script can contain the training, evaluation, and validation code
    all at once so the API can run this entire pipeline when needed.


    Once the training process is done, the process moves to the evaluation stage.


    #### Model Evaluation


    In the evaluation stage, the model’s performance is measured on a test data set
    that it has never seen. This performance will indicate to the operator whether
    or not the model is overfitting, especially if it performed extremely well in
    training but has trouble replicating those results in this stage. That is part
    of why the training data can be split to include some validation data, as it can
    be an early indicator of overfitting. This can be crucial especially if the model
    takes a significant amount of time to run. You would rather know earlier, partway
    through training, if the model is overfitting, rather than after it ran all night
    and is evaluated the next morning. Refer to Figure [3-9](#499842_1_En_3_Chapter.xhtml#Fig9).


    ![../images/499842_1_En_3_Chapter/499842_1_En_3_Fig9_HTML.jpg](images/499842_1_En_3_Chapter/499842_1_En_3_Fig9_HTML.jpg)


    Figure 3-9


    Training results are stored in a common area (for example, the API could be called
    to monitor these results) for the metrics of the current model. Model evaluation
    begins on the trained model using the testing set


    Another thing to note again is that the validation stage could come before the
    evaluation stage, but in this case, the trained model will be evaluated first
    on a test data set before the validation stage begins. This is just to get a sense
    of how the model does on the testing set before hyperparameter tuning begins.
    Of course, hyperparameter tuning via the validation step could be performed first
    before the final model evaluation, but in some frameworks, model evaluation would
    come first. An example of this is a validation process like scikit-learn’s cross-validation.
    Of course, you can evaluate the tuned model on the test set once again to get
    a final performance evaluation.


    Once the evaluation finishes, metrics are stored by the API or by some other mechanism
    that the team has implemented, and the process moves on to the validation stage.


    #### Model Validation


    In this stage, the model begins the validation process, which attempts to seek
    the best hyperparameters. You could combine the use of a script to iterate through
    various configurations of hyperparameter values and utilize k-fold cross-validation,
    for example, to help decide the best hyperparameters. Refer to Figure [3-10](#499842_1_En_3_Chapter.xhtml#Fig10).


    ![../images/499842_1_En_3_Chapter/499842_1_En_3_Fig10_HTML.jpg](images/499842_1_En_3_Chapter/499842_1_En_3_Fig10_HTML.jpg)


    Figure 3-10


    Evaluation metrics are stored along with the training metrics by the API, and
    the validation process begins


    In any case, the point of a validation set is to help tune the model’s hyperparameters.
    The team could even automate this process entirely if they tend to train a lot
    of models of the same few types, saving time and resources in the long run by
    automating the validation and hyperparameter tuning process for that set of models.


    Finally, once the model achieves a good level of performance and finishes the
    validation stage, the validation results are stored, and all relevant data is
    displayed as a summary to the operator. Again, depending on the level of automation,
    perhaps the model is retrained and evaluated on the best hyperparameter setup
    discovered in the validation stage. The API simply needs to be told what metrics
    to track and it will automatically do so.


    #### Model Summary


    At this point, the operator can compare the outcome of this experiment with that
    of other models, using the metrics as baselines for comparison. The API can track
    the relevant metrics for different model runs and can compare them all at the
    same time. Should the operator decide to move forward with this particular model,
    the API and the MLOps software can allow for deployment on a simple click of a
    button. Usually, the deployment is to a staging environment first, where the functionality
    can be tested further before moving directly into the production environment.
    Everything is configurable, and the API can adapt to the needs of the business
    and its workflow. If the developers want to deploy straight to production, sure,
    though that could potentially be unwise considering the case of failure. Refer
    to Figure [3-11](#499842_1_En_3_Chapter.xhtml#Fig11).


    ![../images/499842_1_En_3_Chapter/499842_1_En_3_Fig11_HTML.jpg](images/499842_1_En_3_Chapter/499842_1_En_3_Fig11_HTML.jpg)


    Figure 3-11


    Validation is complete, and all metrics are displayed to the operator


    After the model passes the tests in the staging environment, it can then be deployed
    to the production environment, where it can be further monitored by the software.


    Hopefully now you have a better understanding of what a pipeline really is. The
    pipelines for models and pipeline integration testing are similar, except they
    are assisted by MLOps software and APIs such as Databricks and MLFlow, for example.
    Let’s now look at how you can go about using those APIs and software to help you
    implement MLOps.'
  trans: '

    #### 数据预处理


    选定并构建好模型，且特征存储提供了特征数据后，流程便可进入流水线的下一阶段：数据预处理。请参考图 3-7。


    ![../images/499842_1_En_3_Chapter/499842_1_En_3_Fig7_HTML.jpg](img/499842_1_En_3_Fig7_HTML.jpg)


    图 3-7


    操作员选择对图像数据进行归一化和调整大小。该过程会创建训练集、测试集和验证集。


    数据预处理可以手动完成，也可以自动完成。在本例中，数据预处理仅涉及图像特征数据的归一化和大小调整，因此操作员可以手动实现。根据自动化程度的不同，操作员也可以调用某个函数，该函数接收数据并根据数据类型和提供的任何其他参数自动处理数据。


    无论采用哪种方式，处理阶段结束时，数据都会被分割成若干子集。在此示例中，操作员选择创建训练集、测试集和验证集。现在，操作员可以开始训练过程了。


    #### 训练过程


    根据所使用的框架，操作员可以进一步将训练数据拆分为训练集和数据验证集，并在训练过程中同时使用两者。数据验证集与训练集完全分离（尽管它源自训练集），因为模型在训练期间从未见过它。其目的是定期评估模型在从未见过的数据集上的性能。请参考图
    3-8。


    ![../images/499842_1_En_3_Chapter/499842_1_En_3_Fig8_HTML.jpg](img/499842_1_En_3_Fig8_HTML.jpg)


    图 3-8


    模型训练过程开始


    例如，在深度学习的背景下，模型可以在每个 epoch 结束时对验证集进行评估，生成一些指标数据供操作员查看。基于此，操作员可以判断模型的表现如何，是否存在过拟合的风险，并在需要时调整超参数或模型结构。


    还可以告知 API 要运行哪个脚本以启动整个流水线过程。该脚本可以同时包含训练、评估和验证代码，以便 API 在需要时运行整个流水线。


    训练过程完成后，流程进入评估阶段。


    #### 模型评估


    在评估阶段，使用模型从未见过的测试数据集来衡量其性能。该性能将向操作员表明模型是否过拟合，特别是当模型在训练中表现极佳，但在此阶段难以复现相同结果时。这也是为什么训练数据可以被拆分以包含一些验证数据的原因之一，因为它可以作为过拟合的早期指标。如果模型运行需要大量时间，这一点可能至关重要。你宁愿在训练中途尽早知道模型是否过拟合，而不是等它运行一整夜后，在第二天早上评估时才发现。请参考图
    3-9。


    ![../images/499842_1_En_3_Chapter/499842_1_En_3_Fig9_HTML.jpg](img/499842_1_En_3_Fig9_HTML.jpg)


    图 3-9


    训练结果存储在一个公共区域（例如，可以调用 API 来监控这些结果），用于记录当前模型的指标。使用测试集对训练好的模型开始进行模型评估。


    另需再次注意，验证阶段可能在评估阶段之前，但在本例中，训练好的模型将首先在测试数据集上进行评估，然后才开始验证阶段。这只是为了在超参数调优开始前，了解模型在测试集上的表现。当然，也可以在最终模型评估之前，先通过验证步骤进行超参数调优，但在某些框架中，模型评估会先进行。一个例子是像
    scikit-learn 的交叉验证这样的验证过程。当然，你也可以再次在测试集上评估调优后的模型，以获得最终的性能评估。


    评估完成后，指标由 API 或团队实施的其他机制存储，流程进入验证阶段。


    #### 模型验证


    在此阶段，模型开始验证过程，旨在寻找最佳超参数。例如，你可以结合使用脚本来迭代各种超参数值配置，并利用 k 折交叉验证来帮助确定最佳超参数。请参考图 3-10。


    ![../images/499842_1_En_3_Chapter/499842_1_En_3_Fig10_HTML.jpg](img/499842_1_En_3_Fig10_HTML.jpg)


    图 3-10


    评估指标与训练指标一起由 API 存储，验证过程开始


    无论如何，验证集的作用是帮助调整模型的超参数。如果团队倾向于训练大量同类型的模型，他们甚至可以完全自动化这个过程，通过自动化该组模型的验证和超参数调优过程，从长远来看可以节省时间和资源。


    最后，一旦模型达到良好的性能水平并完成验证阶段，验证结果将被存储，所有相关数据将以摘要形式显示给操作员。同样，根据自动化程度，也许模型会基于验证阶段发现的最佳超参数设置进行重新训练和评估。API
    只需要被告知要跟踪哪些指标，它就会自动执行。


    #### 模型总结


    此时，操作员可以将此实验的结果与其他模型的结果进行比较，使用指标作为比较的基准。API 可以跟踪不同模型运行的相关指标，并可以同时比较它们。如果操作员决定继续使用这个特定模型，API
    和 MLOps 软件可以允许通过单击按钮进行部署。通常，首先部署到预发布环境，在那里可以进一步测试功能，然后再直接进入生产环境。一切都是可配置的，API 可以适应业务及其工作流程的需求。如果开发人员想直接部署到生产环境，当然也可以，但考虑到失败的情况，这可能是不明智的。请参考图
    3-11。


    ![../images/499842_1_En_3_Chapter/499842_1_En_3_Fig11_HTML.jpg](img/499842_1_En_3_Fig11_HTML.jpg)


    图 3-11


    验证完成，所有指标都显示给操作员


    模型通过预发布环境的测试后，就可以部署到生产环境，在那里软件可以对其进行进一步监控。


    希望现在你对流水线到底是什么有了更好的理解。模型流水线和流水线集成测试是相似的，区别在于它们得到了 MLOps 软件和 API（例如 Databricks
    和 MLFlow）的辅助。现在，让我们看看如何使用这些 API 和软件来帮助你实施 MLOps。

    '
- fmt: '# How to Implement MLOps


    MLOps sounds great. It helps you deploy machine learning models rapidly and helps
    maintain them once they’re deployed. However, the biggest problem now seems to
    be the question of how to get there. The level of automation described in the
    setups requires significant work from both the “ML” and “Ops” sides of the workflow
    to achieve it. It almost seems better in the short run to build and deploy the
    models manually rather than devote resources to setting up the entire infrastructure,
    but this is simply unsustainable in the long run.


    Also, `Jupyter` is great for performing experiments, so is there a way to track
    them as well? This sort of functionality would be extremely useful especially
    when teams are implementing advanced machine learning architectures from scratch,
    as it would let them compare the new models across all of the relevant metrics
    with deployed models or current architectures. Tasks like these are more convenient
    to do in a notebook and having to convert everything to a proper model file is
    simply further work.


    The takeaway here is that accounting for these factors and more would require
    significant resources to plan, develop, and test. For smaller-scale businesses,
    this is an undertaking that’s possibly beyond their reach. So, what now?


    The good news is that are a great assortment of tools available to use now that
    essentially implement all of the automation for you, such as the API we looked
    at in the pipeline example earlier. Several examples of such tools that we will
    explore in later chapters are `MLFlow`, `Databricks`, `AWS SageMaker`, `Microsoft
    Azure`, `Google Cloud`, and `Datarobots`. With these tools, implementing MLOps
    principles into your workflow will be significantly easier.


    In the case of `MLFlow`, integrating it into code is extremely simple. You only
    have to write a couple lines of code to track all of the metrics you need. The
    functionality of the API we looked at earlier in the pipeline example is all provided
    by `MLFlow`. Furthermore, `MLFlow` also saves the model for you, allowing for
    model serving functionality where given some data, the model returns its predictions.


    `MLFlow` also integrates into `Databricks`, `AWS SageMaker`, `Microsoft Azure`,
    and can be deployed to `Google Cloud` as well, all of which are tools that help
    manage your MLOps setup and serve as platforms to deploy your models on. While
    the cloud platforms do provide some MLOps functionality, with the extent of this
    varying for each platform, the advantage of using `MLFlow` is that it lets you
    have the freedom of choice when it comes to one platform to commit to. Furthermore,
    it gives you a greater degree of freedom, as you can perform all the experiments
    locally and offline, and you can support models from many different frameworks.
    `MLFlow` also provides functionality to help you modularize any custom-built models
    or models made from other frameworks not explicitly supported.


    And so, to really answer the question of how to implement MLOps, you will get
    familiar with `MLFlow` and explore each of those tools. The goal is to take the
    model we built in Chapter [2](#499842_1_En_2_Chapter.xhtml) all the way to deployment
    and beyond.


    ## Summary


    MLOps is a set of principles and practices adopted from DevOps and applied to
    machine learning. You explored three different types of MLOps setups with varying
    degrees of automation: `manual implementation`, `continuous model delivery`, and
    `continuous integration/continuous delivery of pipelines`. You identified that
    the manual implementation was riddled with issues regarding scalability and efficiency
    and you explored a setup that ensured continuous model delivery. Although this
    setup fixed many of the issues found in the manual setup, there were still some
    problems with pipeline integration testing to be solved. The final setup solved
    this issue too and ensured continuous integration and delivery of pipelines, completing
    the total automation setup.


    You also looked into what a pipeline really is so that you can understand why
    they are so crucial to the automation setup. Finally, you learned about some tools
    that can help you implement MLOps into your workspace, avoiding the trouble of
    implementing all the automation from scratch. In the next chapter, you will look
    at `MLFlow`, an excellent API that lets you implement your own MLOps setups and
    is compatible with many platforms and frameworks.


    # 4. Introduction to MLFlow


    In this chapter, we will cover what `MLFlow` is, what it does, and how you can
    implement MLOps setups into your existing projects. More specifically, we will
    cover how you can integrate `MLFlow` with `scikit-learn`, `TensorFlow 2.0+/Keras`,
    `PyTorch`, and `PySpark`. We will go over experiment creation; metric, parameter,
    and artifact logging; model logging; and how you can deploy models on a local
    server and query them for predictions.'
