    Notice that a new experiment called `PySpark_CreditCard` has been created. Click
    it, and you should see something like Figure [4-94](#499842_1_En_4_Chapter.xhtml#Fig95).
    If MLFlow didn’t log the run here, try rerunning the cell. It should log it correctly.


