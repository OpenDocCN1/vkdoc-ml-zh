- fmt: '# Configuring Azure


    Before you can start using Azure’s functionality to operationalize your models,
    you must first create or connect to an existing Azure workspace. You can do this
    either through code or the UI in a browser.


    In your case, you will open up the portal in the browser and learn how to create
    a workspace. Refer to Figure [6-1](#499842_1_En_6_Chapter.xhtml#Fig1).


    ![../images/499842_1_En_6_Chapter/499842_1_En_6_Fig1_HTML.jpg](images/499842_1_En_6_Chapter/499842_1_En_6_Fig1_HTML.jpg)


    Figure 6-1: An example of the Microsoft Azure portal home screen


    Next, click the **Create a resource** option and search for “Machine Learning.”
    You should see something like Figure [6-2](#499842_1_En_6_Chapter.xhtml#Fig2).


    ![../images/499842_1_En_6_Chapter/499842_1_En_6_Fig2_HTML.jpg](images/499842_1_En_6_Chapter/499842_1_En_6_Fig2_HTML.jpg)


    Figure 6-2: An example of the service “Machine Learning” provided by Azure. You
    want to create a workspace within this service, so click the **Create** button


    Click the **Create** button. You should see something like Figure [6-3](#499842_1_En_6_Chapter.xhtml#Fig3).
    (We filled the fields with our own parameters.)


    Your subscription might differ from ours. For the resource group, we created a
    new one titled `azure-mlops`.


    The fields you completed in Figure [6-3](#499842_1_En_6_Chapter.xhtml#Fig3) are
    enough to create your workspace. Next, click the **Review + create** option and
    click **Create** once Azure states that the validation procedure has been passed
    and allows you to click **Create**.


    ![../images/499842_1_En_6_Chapter/499842_1_En_6_Fig3_HTML.jpg](images/499842_1_En_6_Chapter/499842_1_En_6_Fig3_HTML.jpg)


    Figure 6-3: Workspace creation UI (we filled in the fields with our own parameters)


    This will take some time to deploy. Once the workspace has been created, go back
    to the home portal and click the **All resources** option. You should see something
    like Figure [6-4](#499842_1_En_6_Chapter.xhtml#Fig4).


    Click your workspace, which should have an image of a chemical beaker next to
    it.


    In this overview, you will see several parameters associated with this workspace.
    Make sure to keep track of the following attributes of the workspace so that you
    can connect to it in the code:


    *   `workspace_name` (`azure-mlops-workspace`)

    *   `subscription` (The value where it says Subscription-ID)

    *   `resource_group` (`azure-mlops`)

    *   `location` (`East-US`)


    ![../images/499842_1_En_6_Chapter/499842_1_En_6_Fig4_HTML.jpg](images/499842_1_En_6_Chapter/499842_1_En_6_Fig4_HTML.jpg)


    Figure 6-4: You might see something like this when you look at the **All resources**
    option


    Refer to Figure [6-5](#499842_1_En_6_Chapter.xhtml#Fig5).


    ![../images/499842_1_En_6_Chapter/499842_1_En_6_Fig5_HTML.jpg](images/499842_1_En_6_Chapter/499842_1_En_6_Fig5_HTML.jpg)


    Figure 6-5: You should see something like this for your own workspace. Here we’ve
    censored potentially sensitive fields, but you should be able to see your own
    unique subscription ID on your screen. This is the value you want to use


    Now that you have that, run the following to create/connect to your own workspace:


    ```python

    import azureml

    from azureml.core import Workspace

    workspace_name = "MLOps-Azure"

    workspace_location="East US"

    resource_group = "mlflow_azure"

    subscription_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

    workspace = Workspace.create(name = workspace_name,

    location = workspace_location,

    resource_group = resource_group,

    subscription_id = subscription_id,

    exist_ok=True)

    ```


    If you have successfully connected to your workspace, the cell should run without
    any issues.


    Next, you must build the MLFlow container image to be used by Azure. Here, you
    also specify the run of the model you are trying to deploy.


    In the case of Amazon SageMaker, you were able to reference runs from your local
    machine or runs from an S3 bucket. You can do the same thing for Azure, except
    using Azure’s storage entities called blobs.


    Either way, you need the **run ID** of the model you are deploying and the **artifact
    scheme** that the model is logged in. For the models you stored in Amazon S3 buckets,
    you used the scheme `s3:/`, but this time you will just use a run locally. If
    you’d like, you can still use your Amazon S3 bucket or Google Cloud buckets. Where
    you store your run does not matter.


    Run the following, replacing the values with your specific run and storage scheme:


    ```python

    run_id = "1eb809b446d949d5a70a1e22e4b4f428"

    model_name = "log_reg_model"

    model_uri = f"runs:/{run_id}/{model_name}"

    ```


    The model name should be the same in your case unless you changed it. Since we
    are using local runs, we have a URI starting with `runs:/`. Again, change this
    to whatever is appropriate in your case.


    Finally, with all that information set, let’s create the container image:


    ```python

    import mlflow.azureml

    model_image, azure_model = mlflow.azureml.build_image(model_uri=model_uri,

    workspace=workspace,

    model_name="sklearn_logreg_dev",

    image_name="model",

    description="SkLearn LogReg Model for Anomaly Detection",

    synchronous=False)

    ```


    You should see something like Figure [6-6](#499842_1_En_6_Chapter.xhtml#Fig6).
    You may or may not see the warning messages depending on your version of MLFlow.


    ![../images/499842_1_En_6_Chapter/499842_1_En_6_Fig6_HTML.jpg](images/499842_1_En_6_Chapter/499842_1_En_6_Fig6_HTML.jpg)


    Figure 6-6: Building and pushing the container to Azure’s container registry.
    Ignore the warning messages for now. You might not see these messages in the future.
    Since this is code created and maintained by MLFlow, it is likely that they will
    provide support for whatever new functionality Azure pushes


    Next, run the following to check the status of the container:


    ```python

    model_image.wait_for_creation(show_output=True)

    ```


    You should see something like Figure [6-7](#499842_1_En_6_Chapter.xhtml#Fig7).


    ![../images/499842_1_En_6_Chapter/499842_1_En_6_Fig7_HTML.jpg](images/499842_1_En_6_Chapter/499842_1_En_6_Fig7_HTML.jpg)


    Figure 6-7: Checking the output of the progress in the image creation operation


    Once the image has been created, you can now deploy your model.'
