    Making predictions with your loaded model


    Let’s print out the evaluation accuracy and the AUC score:


    ```

    print(f"AUC Score: {roc_auc_score(y_true, y_pred):.3%}")

    print(f"Accuracy Score: {accuracy_score(y_true, y_pred):.3%}")

    ```


    Refer to Figure [4-99](#499842_1_En_4_Chapter.xhtml#Fig100).


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig100_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig100_HTML.jpg)


    Figure 4-99


    Printing out the evaluation metrics. The AUC score noticeably differs, but the
    accuracy score matches what was displayed during the MLFlow run


    You will notice that the AUC score differs compared to what was calculated in
    the evaluation function. This is likely because PySpark calculates the ROC curve
    slightly differently because it has direct access to the model itself. On the
    other hand, with scikit-learn, you only have the true labels and the predictions
    to work with, so the ROC curve is calculated slightly differently.


    Finally, let’s construct the confusion matrix:


    ```

    conf_matrix = confusion_matrix(y_true, y_pred)

    ax = sns.heatmap(conf_matrix, annot=True,fmt=''g'')

    ax.invert_xaxis()

    ax.invert_yaxis()

    plt.ylabel(''Actual'')

    plt.xlabel(''Predicted'')

    ```


    Refer to Figure [4-100](#499842_1_En_4_Chapter.xhtml#Fig101).


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig101_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig101_HTML.jpg)


    Figure 4-100


    Displaying the confusion matrix using the true values and the predictions made
    by the model you loaded


    From the confusion matrix, you can see that the AUC score as calculated by PySpark
    must be reflecting its performance on how well it classifies normal data. Looking
    at the anomalies, a fair chunk of the fraudulent data has been misclassified.
    Roughly speaking, the model only got two-thirds of the anomalies when evaluated
    on the test data. Perhaps this explains the disparity between what scikit-learn
    says is the AUC score and what PySpark says is the AUC score. Both must have calculated
    the ROC curves slightly differently with PySpark’s graph somehow favoring the
    excellent true positive rate of the normal data’s classification.


    With that, you now know how to integrate MLFlow into your PySpark experiments.


    Next, we will take a look at how you can deploy your models locally and how you
    can query the models with samples of data and receive predictions.


