  trans: "\n### 手动实现\n\n既然我们已经确立了三种不同的设置方案，接下来让我们看看机器学习模型三种部署方案中的第一种，该方案未集成任何 MLOps\
    \ 原则。\n\n在这种情况下，有一个由数据科学家和机器学习工程师组成的团队（以下称为“模型开发团队”），他们手动执行数据分析，并构建、训练、测试和验证他们的模型。一旦模型最终确定，他们必须创建一个模型类并将其推送到代码仓库。软件工程师提取这个模型类，并将其集成到现有的应用程序或系统中，而运维团队则负责监控应用程序、维护功能，并向软件和模型开发团队提供反馈。\n\
    \n这里的一切都是手动的，这意味着数据中的任何新趋势都会导致模型开发团队必须更新模型并重复整个流程。考虑到每天有大量用户与你的模型交互，这种情况很可能会发生。结合性能指标和用户数据收集，这些信息将揭示关于你的模型以及模型所服务的用户群体的许多方面。你很可能会需要更新模型以保持其在新数据上的性能。在您按照图表中的流程进行操作时，请牢记这一点。\n\
    \n请参考图 3-2 以了解该设置的图形表示。\n\n![../images/499842_1_En_3_Chapter/499842_1_En_3_Fig2_HTML.jpg](img/499842_1_En_3_Fig2_HTML.jpg)\n\
    \n图 3-2\n\n该图描绘了一种未遵循 MLOps 原则的机器学习模型可能的部署设置。带有虚线边框的箭头表示进入下一步取决于当前步骤中的某个条件。例如，在模型验证步骤中，机器学习工程师必须确保模型在将模型类推送到仓库之前达到最低性能基准。\n\
    \n让我们一步步来看。我们可以将流程大致分为两部分：**实验阶段**，涉及整个工作流程中的机器学习方面；以及**部署阶段**，负责将模型集成到应用程序中并维持运维。\n\
    \n**实验阶段：**\n\n1.  **数据存储：** 数据存储指的是存储与数据分析和模型开发相关的数据的地方。数据存储的一个例子是使用 Hadoop 来存储大量数据，这些数据可以被多个模型开发团队使用。在这个例子中，数据科学家可以从这个数据存储中提取原始数据，开始进行实验和数据分析。\n\
    \n2.  **处理原始数据：** 如前所述，必须处理原始数据以收集相关信息。此外，还必须清除其中的错误和损坏数据。当一家公司每天收集海量数据时，其中一些数据最终必然会以某种方式损坏或出错，清除这些数据点很重要，因为它们可能会损害数据分析和模型开发过程。例如，一个空值条目就可能完全破坏用于回归（值预测）任务的神经网络的训练过程。\n\
    \n3.  **数据分析：** 此步骤涉及分析数据的各个方面。前面已经讨论过其大致要点，但在更新模型的背景下，数据科学家希望查看数据中是否存在他们认为模型应该更新的任何新趋势或变化。由于初始训练过程可以被视为真实世界环境的一个小样本，模型在初始部署后不久就需要更新的可能性很大。当然，这取决于原始训练集捕获了多少真实用户群体的特征，但用户群体会随时间变化，模型也必须随之变化。这里所说的“用户群体”，指的是使用模型预测服务的实际客户。\n\
    \n4.  **模型构建阶段：** 这个阶段与我们之前讨论的大致相同。在第二次更新模型时，可能需要对模型层进行细微调整。在最坏的情况下，即使使用新数据或进行架构调整，当前使用的模型架构也无法达到足够高的性能。可能必须构建、训练和验证一个全新的模型。如果没有此类问题，那么模型将只需进一步训练、测试、验证，并在满足某些性能标准后推送到代码仓库。\n\
    \    *   关于这个实验阶段，需要注意的一点是，使用 Jupyter notebook 进行实验非常普遍。当模型开发团队达到目标性能水平时，他们必须着手构建一个可被其他代码调用的、可工作的模型。例如，可以通过创建一个包含各种函数的模型类来实现，这些函数提供诸如\
    \ `load_weights`、`predict`，甚至可能还有 `evaluate` 等功能，以便更容易地收集性能指标。由于在实时环境中无法获知真实标签，评估指标可以简单地是均方根误差之类的东西。\n\
    \n**部署阶段：**\n\n1.  **模型部署：** 在此情况下，这一步是软件工程师必须手动将模型集成到他们正在开发的系统/应用程序中。每当模型开发团队完成实验、构建出可工作的模型并将其推送到代码仓库时，工程团队都必须再次手动集成。虽然第二次执行该过程可能没那么糟糕，但仍然存在修复新模型可能带来的任何潜在错误的问题。此外，工程团队不仅需要处理模型集成到应用程序后的测试，还需要处理应用程序其余部分的测试。\n\
    \n2.  **模型服务：** 这一步是模型最终部署并与用户群体实时交互的阶段。这也是运维团队介入以帮助维护软件功能的阶段。例如，如果模型功能的某个方面出现问题，运维团队必须记录该错误并将其转发给模型开发团队。\n\
    \n3.  **数据收集：** 运维团队还可以收集原始数据和性能指标。这些数据对于公司的运营至关重要，因为公司正是基于这些数据做出决策。例如，公司可能想知道哪种服务在用户群体中最受欢迎，或者机器学习模型到目前为止表现如何。这项工作也可以由应用程序执行，将所有相关数据存储在与该应用程序相关的某个特定数据存储中。\n\
    \n4.  **数据转发至数据存储：** 这一步是运维团队将数据发送到数据存储的阶段。由于可能收集到海量数据，可以合理地假设运维团队在这方面会采用一定程度的自动化。此外，应用程序本身也可以负责将其收集的数据转发到相关的数据存储。\n"
- fmt: '# Reflection on the Setup


    Right away, you can notice some problems that may arise from such an implementation.
    The first thing to realize is that the entire experimental stage is manual, meaning
    data scientists and machine learning engineers must repeat those steps every time.
    When models are constantly exposed to new data that is more than likely not captured
    in the original training set, models must frequently be retrained so that they
    are always up to date with current trends in user data. Unfortunately, when the
    entire process of analyzing new trends, training, testing, and validating data
    is manual, this may require significant resources over time, which may become
    unfeasible for a company without the resources to spare. Additionally, trends
    in data can change over time. For example, perhaps the age group with the largest
    number of users logging into the site is comprised of people in their early twenties.
    A year later, perhaps the dominant age group is now teenagers. What was normal
    back then isn’t normal now, and this could lead to losses in ad revenues, for
    example, if that’s the service (targeted advertising) the model in this case provides.


    Another issue is that tools such as Jupyter notebook are very popular for prototyping
    and experimenting machine learning and deep learning models. Even if the experiments
    aren’t carried out on notebooks, it’s likely that work must be done in order to
    push the model to the source repo. For example, constructing a model class with
    some important functions such as `load_weights`, `predict`, and `evaluate` would
    be ideal for a model class. Some external code may call upon `load_weights()`
    to set the model weights from different training instances (so if the model has
    been further trained and updated, simply call this function to get the new model).
    The function `predict()` would then be called to make predictions based on some
    input data and provide the services the application requires, and the function
    `evaluate()` would be useful in keeping performance metrics. Live data will almost
    never have truth labels on it (unless the user provides instant feedback, like
    Google’s captchas where you select the correct images), so a score metric like
    a root-mean-squared error can be useful when keeping track of performance.


    Once the model class is completed and pushed, software engineering teams must
    integrate the model class into the overall application/system. This could prove
    difficult the first time around, but once the integration has been completed,
    updates to the model can be as simple as loading new weights. Unfortunately, model
    architectures are likely to change, so the software teams must reintegrate new
    model classes into the application.


    Furthermore, deep learning is a complicated and rapidly evolving field. Models
    that were cutting-edge several years ago can be far surpassed by the current state-of-the-art
    models, so it’s important to keep updating your model architectures and to make
    full use of the new developments in the field. This means teams must continuously
    repeat the model-building process in order to keep up with developments in the
    field.


    Hopefully it is more clear that this implementation is quite flawed in how much
    work is required to not only create and deploy the model in the first place, but
    also to continuously maintain it and keep it up to par.


    Alright, so how would we go about improving it? Where does this MLOps come into
    play? To answer these questions, let’s look at the second setup of the three defined
    earlier.


    ## Continuous Model Delivery


    This setup contains **pipelines** for automatic training of the deployed model
    as well as for speeding up the experimental process. Refer to Figure [3-3](#499842_1_En_3_Chapter.xhtml#Fig3)
    for a graphical representation of this setup.


    ![../images/499842_1_En_3_Chapter/499842_1_En_3_Fig3_HTML.jpg](images/499842_1_En_3_Chapter/499842_1_En_3_Fig3_HTML.jpg)


    Figure 3-3


    Graph depicting a possible deployment setup of a machine learning model with automation
    via pipelines


    This is a lot to take in at once, so let’s break it down and follow it according
    to the numbers on the graph.


    1. **Feature store:** This is a data storage bin that takes the place of the data
    store in the previous example. The reason for this is that all data can now be
    standardized to a common definition that all processes can use in this instance.
    For example, the processes in the experimental stage will be using the same input
    data as the deployed training pipeline because all of the data is held to the
    same definition. What is meant by **common definition** is that raw data is cleansed
    and processed in a procedural way that applies to all relevant raw data. These
    processed features are then held in the feature store for pipelines to draw from,
    and it is ensured that every pipeline uses features processed according to this
    standard. This way, any perceived differences in trends between two different
    pipelines won’t be attributed to deviances in processing procedures.


    Presume for an instance that you are trying to provide an object detection service
    that detects and identifies various animals in a national park. All video feed
    from the trail cameras (a video can be thought of as a sequence of frames) can
    be stored as raw data, but it can be possible that different trail cameras have
    different resolutions. Instead of repeating the same data processing procedure,
    you can simply apply the same procedure (normalizing, scaling, and batching the
    frames, for example) to the raw videos and store the features that you know all
    pipelines will use.


    2. **Data analysis:** In this step, data analysis is still performed to give data
    scientists and machine learning engineers an idea of what the data looks like,
    how it’s distributed, and so on, just like in the manual setup. Similarly, this
    step can determine whether or not to proceed with construction of a new model
    or just update the current model.


    3. **Automated model building and analysis:** In this step, data scientists and
    machine learning engineers can select a model, set any specific hyperparameters,
    and let the pipeline automate the entire process. The pipeline will automatically
    process the data according to the specifications of this model (take the case
    where the features are 331x331x3 images but this particular model only accepts
    images that are 224x224x3), build the model, train it, evaluate it, and validate
    it. During validation, the pipeline may automatically tune the hyperparameters
    as well optimize performance. It is possible that manual intervention may be required
    in some cases (debugging, for example, when the model is particularly large and
    complex, or if the model has a novel architecture), but automation should otherwise
    take care of producing an optimal model. Once this occurs, modularized code is
    automatically created so that this pipeline can be easily deployed.


    Everything in this stage is set up so that the experimental stage goes very smoothly,
    requiring only that the model is built. Depending on the level of automation implemented,
    perhaps all that is required is that the model architecture is selected with some
    hyperparameters specified, and the automation takes care of the rest. Either way,
    the development process in the experimental stage is sped up massively. With this
    stage going faster, more experiments can be performed too, leading to possible
    boosts in overall efficiency as productivity is increased and optimal solutions
    can be found quicker.'
