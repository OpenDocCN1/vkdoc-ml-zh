    further room for improvement looking at these results, as you have not tuned the
    hyperparameters of the model yet, but it already does ok in detecting anomalies.
    The goal now is to keep the accuracy for the normal points as high as possible,
    or at a high enough level that’s acceptable, while raising the accuracy for the
    anomaly points as high as possible. Based on this confusion matrix plot, you can
