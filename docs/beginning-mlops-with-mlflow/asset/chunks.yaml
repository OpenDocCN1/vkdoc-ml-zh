    ## Making Predictions


    Making predictions is simple. All you need is the name of the endpoint and the
    functionality that `boto3` provides in order for the model to be queried. Let’s
    define a function to query the model:


    ```

    def query(input_json):

    client = boto3.session.Session().client("sagemaker-runtime", region)

    response = client.invoke_endpoint(

    EndpointName=app_name,

    Body=input_json,

    ContentType=''application/json; format=pandas-split'',

    )

    preds = response[''Body''].read().decode("ascii")

    preds = json.loads(preds)

    return preds

    ```


    Now, let’s load your data, process it, and scale it just like you did for the
    local model deployment example. Make sure that the folder `data` exists, ensuring
    that `creditcard.csv` exists within it. Run the following:


    ```

    import pandas as pd

    import mlflow

    import mlflow.sklearn

    import seaborn as sns

    import matplotlib.pyplot as plt

    from sklearn.preprocessing import StandardScaler

    from sklearn.model_selection import train_test_split

    from sklearn.metrics import roc_auc_score, accuracy_score, confusion_matrix

    import numpy as np

    df = pd.read_csv("data/creditcard.csv")

    ```


    Once the `import` statements and the data frame has been loaded, run the following:


    ```

    normal = df[df.Class == 0].sample(frac=0.5, random_state=2020).reset_index(drop=True)

    anomaly = df[df.Class == 1]

    normal_train, normal_test = train_test_split(normal, test_size = 0.2, random_state
    = 2020)

    anomaly_train, anomaly_test = train_test_split(anomaly, test_size = 0.2, random_state
    = 2020)

    scaler = StandardScaler()

    scaler.fit(pd.concat((normal, anomaly)).drop(["Time", "Class"], axis=1))

    ```


    Once this is all finished, run the following to ensure that the model is actually
    making predictions:


    ```

    scaled_selection = scaler.transform(df.iloc[:80].drop(["Time", "Class"], axis=1))

    input_json = pd.DataFrame(scaled_selection).to_json(orient="split")

    pd.DataFrame(query(input_json)).T

    ```


    You should see an output like Figure [5-13](#499842_1_En_5_Chapter.xhtml#Fig13).


    ![../images/499842_1_En_5_Chapter/499842_1_En_5_Fig13_HTML.jpg](images/499842_1_En_5_Chapter/499842_1_En_5_Fig13_HTML.jpg)


    Figure 5-13


    Querying the deployed model with the scaled data representing the first 80 rows
    of the data frame and getting a response back


    Figure [5-13](#499842_1_En_5_Chapter.xhtml#Fig13) shows a successful query of
    the model while it is hosted on a SageMaker endpoint and the predictions received
    as a response.


    Let’s run the batch query script with some modifications:


    ```

    test = pd.concat((normal.iloc[:1900], anomaly.iloc[:100]))

    true = test.Class

    test = scaler.transform(test.drop(["Time", "Class"], axis=1))

    preds = []

    batch_size = 80

    for f in range(25):

    print(f"Batch {f}", end=" - ")

    sample = pd.DataFrame(test[f*batch_size:(f+1)*batch_size]).to_json(orient="split")

    output = query(sample)

    resp = pd.DataFrame([output])

    preds = np.concatenate((preds, resp.values[0]))

    print("Completed")

    eval_acc = accuracy_score(true, preds)

    eval_auc = roc_auc_score(true, preds)

    print("Eval Acc", eval_acc)

    print("Eval AUC", eval_auc)

    ```


    Once finished, you should see something like Figure [5-14](#499842_1_En_5_Chapter.xhtml#Fig14).


    ![../images/499842_1_En_5_Chapter/499842_1_En_5_Fig14_HTML.jpg](images/499842_1_En_5_Chapter/499842_1_En_5_Fig14_HTML.jpg)


    Figure 5-14


    Output of the batch querying script. You included a mix of 100 anomalies with
    1900 normal points so that you can get a better idea of how the model performs
    against anomalies as well. Otherwise, you would have gotten a handful of anomalies


    All this is great, but what do you do when you want to switch the model that is
    deployed? Well, SageMaker allows you to update the endpoint and switch to a new
    model. Let’s look at how to do this.


    ## Switching Models


    Perhaps you want to update your model, or you have no more use for the current
    model and its prediction services so you want to replace it without having to
    delete and create a new endpoint. In this case, you can simply update the endpoint
    and swap out the model that is currently hosted on there. To do so, you only need
    to collect the new `model_uri`.


    This time, the `model_uri` refers to the URI of the new model that you want to
    deploy. In your case, you are selecting the second run of the three runs you uploaded
    to your bucket. Everything else remains the same, so you only have to get a new
    `model_uri`.


    Now, run the following, replacing the `run_id` value with your chosen `run_id`:


    ```

    new_run_id = "3862eb3bd89b43e8ace610c521d974e6"

    new_model_uri = "s3://{}/{}/{}/artifacts/{}/".format(s3_bucket_name, experiment_id,
    new_run_id, model_name)

    ```


    Now that you have run this, run the following code to update the model:


    ```

    mfs.deploy(app_name=app_name,

    model_uri=new_model_uri,

    execution_role_arn=execution_role_arn,

    region_name=region,

    image_url=image_ecr_url,

    mode=mfs.DEPLOYMENT_MODE_REPLACE)

    ```


    You will find that this function looks quite similar to the one you used to deploy
    the model. The only parameter that differs is the mode, as you are now doing `mfs.DEPLOYMENT_MODE_REPLACE`
    instead of `mfs.DEPLOYMENT_MODE_CREATE`.


    Refer to Figure [5-15](#499842_1_En_5_Chapter.xhtml#Fig15) to see what the output
    should look like. Note that this also can take some time to finish.


    ![../images/499842_1_En_5_Chapter/499842_1_En_5_Fig15_HTML.jpg](images/499842_1_En_5_Chapter/499842_1_En_5_Fig15_HTML.jpg)


    Figure 5-15


    This is what your output should look like after running the update code


    While this is running, you can check on the endpoint in your portal to see that
    it is now updating. Refer to Figure [5-16](#499842_1_En_5_Chapter.xhtml#Fig16)
    to see this.


    ![../images/499842_1_En_5_Chapter/499842_1_En_5_Fig16_HTML.jpg](images/499842_1_En_5_Chapter/499842_1_En_5_Fig16_HTML.jpg)


    Figure 5-16


    The endpoint is now updating. Once finished, it should show “InService” just like
    when the endpoint was being created


    Once it finishes running, you can query this model again using the same function.
    You don’t have to modify the batch script either.


    Now that you know how to update the endpoint with a new model, we will look at
    how you can remove the endpoint and the deployed model.'
