- fmt: "### Manual Implementation\n\nNow that we’ve established three variations of\
    \ setups, let’s look at the first of the three deployment setups of machine learning\
    \ models, which has no MLOps principles integrated.\n\nIn this case, there is\
    \ a team of data scientists and machine learning engineers, who will now be referred\
    \ to as the “model development team,” manually performing data analysis and building,\
    \ training, testing, and validating their models. Once their model has been finalized,\
    \ they must create a model class and push this to a code repository. Software\
    \ engineers extract this model class and integrate it into an existing application\
    \ or system, and operational teams are in charge of monitoring the application,\
    \ maintaining functionality, and providing feedback to both the software and model\
    \ development teams.\n\nEverything here is manual, meaning any new trends in the\
    \ data lead to the model development team having to update the model and repeat\
    \ the entire process again. This is quite likely to happen considering the high\
    \ volume of users interacting with your model every day. Combined with performance\
    \ metrics and user data collection, the information will reveal a lot of aspects\
    \ about your model as well as the user base the model is servicing. Chances are\
    \ high that you will have to update it to maintain its performance on the new\
    \ data. This is something to keep in mind as you follow through with the process\
    \ on the graph.\n\nRefer to Figure [3-2](#499842_1_En_3_Chapter.xhtml#Fig2) for\
    \ a graphical representation of the setup.\n\n![../images/499842_1_En_3_Chapter/499842_1_En_3_Fig2_HTML.jpg](images/499842_1_En_3_Chapter/499842_1_En_3_Fig2_HTML.jpg)\n\
    \n**Figure 3-2** Graph depicting a possible deployment setup of a machine learning\
    \ model without MLOps principles. The arrows with a dotted border mean that progression\
    \ to the next step depends upon a condition in the current step. For example,\
    \ in the model validation step, machine learning engineers must ensure that the\
    \ model meets a minimum benchmark in performance before pushing a model class\
    \ to the repository.\n\nLet’s go through this step by step. We can split the flow\
    \ into roughly two parts: the **experimental stage**, which involves the machine\
    \ learning side of the entire workflow, and the **deployment stage**, which handles\
    \ integration of the model into the application and maintaining operations.\n\n\
    #### Experimental Stage\n\n1. **Data store:** The data store refers to wherever\
    \ data relevant to data analysis and model development is stored. An example of\
    \ a data store could be using Hadoop to store large volumes of data, which can\
    \ be used by multiple model development teams. In this example, data scientists\
    \ can pull raw data from this data store to start performing experiments and conducting\
    \ data analysis.\n\n2. **Process raw data:** As previously mentioned, raw data\
    \ must be processed in order to collect the relevant information. From there,\
    \ it must also be purged of faults and corrupted data. When a company collects\
    \ massive volumes of data every day, some of it is bound to be corrupted or faulty\
    \ in some way eventually, and it’s important to get rid of these points because\
    \ they can harm the data analysis and model development processes. For example,\
    \ one null value entry can completely destroy the training process of a neural\
    \ network used for a regression (value prediction) task.\n\n3. **Data analysis:**\
    \ This step involves analyzing all aspects of the data. The general gist of it\
    \ was discussed earlier, but in the context of updating the model, data scientists\
    \ want to see if there are any new trends or variety in data that they think the\
    \ model should be updated on. Since the initial training process can be thought\
    \ of as a small representation of the real-world setting, there is a fair chance\
    \ that the model will need to be updated soon after the initial deployment. This\
    \ does depend on how many characteristics of the true user base the original training\
    \ set captured however, but user bases change over time, and so must the models.\
    \ By “user base,” we refer to the actual customers using the prediction services\
    \ of the model.\n\n4. **Model building stage:** This stage is more or less the\
    \ same as what we discussed earlier. The second time around, when updating the\
    \ model, it could turn out that slight adjustments to the model layers may be\
    \ needed. In some of the worst cases, the current model architecture being used\
    \ cannot achieve a high enough performance even with new data or architectural\
    \ tweaks. An entirely new model may have to be built, trained, and validated.\
    \ If there are no such issues, then the model would just be further trained, tested,\
    \ validated, and pushed to the code repository upon meeting some performance criteria.\n\
    \   - An important thing to note about this experimental stage is that it is quite\
    \ popular for experiments to be conducted using Jupyter notebook. When model development\
    \ teams reach a target level of performance, they must work on building a workable\
    \ model that can be called by other code. For example, this can be done by creating\
    \ a model class with various functions that provide functionality such as `load_weights`,\
    \ `predict`, and perhaps even `evaluate` to allow for easier gathering of performance\
    \ metrics. Since the true label can’t be known in real-time settings, evaluation\
    \ metrics can simply be something like a root-mean-squared error.\n\n#### Deployment\
    \ Stage\n\n1. **Model deployment:** In this case, this step is where software\
    \ engineers must manually integrate the model into the system/application they\
    \ are developing. Whenever the model development team finishes with their experiments,\
    \ builds a workable model, and pushes it to the code repository, the engineering\
    \ team must manually integrate it again. Although the process may not be that\
    \ bad the second time around, there is still the issue of fixing any potential\
    \ bugs that may arise from the new model. Additionally, engineering teams must\
    \ also handle testing of not only the model once it is integrated into the application,\
    \ but also of the rest of the application.\n\n2. **Model services:** This step\
    \ is where the model is finally deployed and is interacting with the user base\
    \ in real time. This is also where the operational team steps in to help maintain\
    \ the functionality of the software. For example, if there are any issues with\
    \ some aspect of the model functionality, the operational team must record the\
    \ bug and forward it to the model development team.\n\n3. **Data collection:**\
    \ The operational team can also collect raw data and performance metrics. This\
    \ data is crucial for the company to operate since that is how it makes its decisions.\
    \ For example, the company might want to know what service is most popular with\
    \ the user base, or how well the machine learning models are performing so far.\
    \ This job can be performed by the application as well, storing all the relevant\
    \ data in some specific data store related to the application.\n\n4. **Data forwarded\
    \ to data store:** This step is where the operational team sends the data to the\
    \ data store. Because there could be massive volumes of data collected, it’s fair\
    \ to assume some degree of automation on behalf of the operational team on this\
    \ end. Additionally, the application itself could also be in charge of forwarding\
    \ data it collects to the relevant data store."
