    Figure 4-47 – Importing the necessary modules and printing their versions


    Let’s now load the data:


    ```python

    (x_train, y_train), (x_test, y_test) = mnist.load_data()

    ```


    `Keras`, and by extension `TensorFlow`, provides the `MNIST` handwritten digit
    dataset for you, so all you need to do to load the data is call the function,
    like in Figure [4-48](#499842_1_En_4_Chapter.xhtml#Fig49).


    Refer to Figure [4-48](#499842_1_En_4_Chapter.xhtml#Fig49) to see the code in
    a cell.


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig49_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig49_HTML.jpg)


