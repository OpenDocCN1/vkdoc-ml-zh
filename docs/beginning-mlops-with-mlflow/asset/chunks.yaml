- fmt: '# Making Predictions


    Now that you have your model deployed, let’s run your code to make predictions.


    First of all, let’s run the following to make sure that you are receiving predictions.
    You should already have defined `input_json`:


    ```

    preds = query(scoring_uri=azure_service.scoring_uri, inputs=input_json)

    pd.DataFrame(preds).T

    ```


    You should now see something like Figure [6-14](#499842_1_En_6_Chapter.xhtml#Fig14).


    ![../images/499842_1_En_6_Chapter/499842_1_En_6_Fig14_HTML.jpg](images/499842_1_En_6_Chapter/499842_1_En_6_Fig14_HTML.jpg)


    Figure 6-14


    Querying the deployed model with your batch of scaled data to ensure it works


    Now, let’s run your batch querying script:


    ```

    test = pd.concat((normal.iloc[:1900], anomaly.iloc[:100]))

    true = test.Class

    test = scaler.transform(test.drop(["Time", "Class"], axis=1))

    preds = []

    batch_size = 80

    for f in range(25):

    print(f"Batch {f}", end=" - ")

    sample = pd.DataFrame(test[f*batch_size:(f+1)*batch_size]).to_json(orient="split")

    output = query(scoring_uri=azure_service.scoring_uri, inputs=sample)

    resp = pd.DataFrame([output])

    preds = np.concatenate((preds, resp.values[0]))

    print("Completed")

    eval_acc = accuracy_score(true, preds)

    eval_auc = roc_auc_score(true, preds)

    print("Eval Acc", eval_acc)

    print("Eval AUC", eval_auc)

    ```


    Once finished, you should see something like Figure [6-15](#499842_1_En_6_Chapter.xhtml#Fig15).


    ![../images/499842_1_En_6_Chapter/499842_1_En_6_Fig15_HTML.jpg](images/499842_1_En_6_Chapter/499842_1_En_6_Fig15_HTML.jpg)


    Figure 6-15


    The results of running the batch querying script. This effectively made predictions
    on 2,000 data points


    With that, you now know how to query your deployed model and make predictions
    with it. This should be the same procedure if you’ve opted to deploy to a specific
    compute cluster with, for example, Azure Kubernetes Service.


    # Cleaning Up


    Unfortunately, there does not seem to be any specific functionality to **update**
    the service with a new model. The procedure seems to be to delete the service
    and create a new service with another model URI.


    So, with that, let’s now look at how you can remove all the services you just
    created.


    Run the following:


    ```

    aci_service.delete()

    azure_service.delete()

    ```


    Refer to Figure [6-16](#499842_1_En_6_Chapter.xhtml#Fig16).


    ![../images/499842_1_En_6_Chapter/499842_1_En_6_Fig16_HTML.jpg](images/499842_1_En_6_Chapter/499842_1_En_6_Fig16_HTML.jpg)


    Figure 6-16


    Deleting the web services you launched earlier


    Now, navigate to the All resources section again from the home portal. Check every
    item with the resource group type named Container Instance. You should see that
    there are none. Figure [6-17](#499842_1_En_6_Chapter.xhtml#Fig17) shows what this
    might look like. (We have a container instance here, but it is unrelated.) Since
    you deleted the services just now, you should not see `sklearn-logreg` or `sklearn-model-dev`.


    ![../images/499842_1_En_6_Chapter/499842_1_En_6_Fig17_HTML.jpg](images/499842_1_En_6_Chapter/499842_1_En_6_Fig17_HTML.jpg)


    Figure 6-17


    You should not see any resources titled `sklearn-logreg` or `sklearn-model-dev`
    of type container instance. (There is one here, but it is not related to the experiments
    from above, and only exists to show what a resource with this resource type looks
    like.)


    If you want to remove services from here, you can simply delete the container
    instances or other services, as in Figure [6-18](#499842_1_En_6_Chapter.xhtml#Fig18).


    ![../images/499842_1_En_6_Chapter/499842_1_En_6_Fig18_HTML.jpg](images/499842_1_En_6_Chapter/499842_1_En_6_Fig18_HTML.jpg)


    Figure 6-18


    Deleting services manually through the All resources UI


    You can now delete everything else (or just the new resources created for this
    chapter) in your UI following this same procedure to clean up your Azure workspace.


    With that, you now know how to use MLFlow to deploy a model on Microsoft Azure.


    It’s worth mentioning that Azure has a lot of additional functionality relating
    to monitoring your machine learning experiments and more, but that might also
    come with additional costs depending on the depth of functionality you are going
    after. Be sure to refer to their excellent documentation if you’d like to learn
    more about Azure and its functionality.


    # Summary


    Like Amazon AWS, Microsoft Azure is a cloud platform that performs many advanced
    services for a wide range of users. In particular, Azure has a lot of support
    for operationalizing machine learning models using built-in functionality separate
    from MLFlow.


    In this chapter, you learned how to build a container image for a specific MLFlow
    model run, deploy it in a development setting/production setting, and query the
    model on Microsoft Azure.


    In the next chapter, we will look at how you can use Google Cloud as a platform
    to operationalize your MLFlow models. There is no explicit MLFlow support for
    Google Cloud, so you will be adopting a different approach where you serve the
    models on a server hosted on Google Cloud and make predictions that way.


    # 7. Deploying in Google


    In this chapter, we will cover how you can use MLFlow and Google Cloud to operationalize
    your models even without MLFlow providing explicit deployment support for Google
    Cloud.


    More specifically, we will cover how to set up your Google Cloud bucket and virtual
    machine (used to run the server) and how you can operationalize and query your
    models.'
