    `V12` and `V17` hold data that best help distinguish fraudulent transactions from
    normal transactions. You can see in the graph that a few normal points are with
    the anomalous points as well, but hopefully the model can learn the true difference
    taking into account all of the data.


    Finally, let’s see the relationship between each of these columns and `Amount`:


    ```

    for f in range(1, 29):

    print(f''Amount vs V{f}'')

    plot_scatter(df,  f''V{f}'', "Amount", sharey=True)

    ```


    This time there seems to be a few more graphs more clearly showing the differences
    between the normal and fraudulent points. Refer to Figure [1-29](#499842_1_En_1_Chapter.xhtml#Fig29),
    Figure [1-30](#499842_1_En_1_Chapter.xhtml#Fig30), and Figure [1-31](#499842_1_En_1_Chapter.xhtml#Fig31).


