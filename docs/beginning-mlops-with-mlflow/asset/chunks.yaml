    This is what a confusion matrix looks like. The y-axis consists of the true labels,
    while the x-axis consists of predicted labels. When the true label is `"0"` and
    the model predicts `"0"`, we call this a **true negative**. “True” refers to the
    true label, and “negative” refers to the label the model predicts.


    What counts as “positive” and what counts as “negative” can differ. In tasks such
    as disease detection, if a test finds someone to have the disease, they are said
    to “test positive.” Otherwise, they “test negative.” Anomaly detection is similar.
    When a model thinks that a point is an anomaly, it flags it with the label `"1"`.
    And so, a point is labeled “positive” if the model thinks it is an anomaly, and
    “negative” if it doesn’t.


    You may notice that we have inverted the axes in the code. This is simply to get
    it in the format so that the top left of the matrix corresponds to “true positives,”
    the top right of the matrix corresponds to “false negatives,” the bottom left
    of the matrix corresponds to “false positives,” and the bottom right of the matrix
    corresponds to “true negatives.”


    To quickly recap these concepts:


    - **True positives** are values that the model predicts as positive that actually
    are positive.

    - **False negatives** are values that the model predicts as negative that actually
    are positive.

    - **False positives** are values that the model predicts as positive that actually
    are negative.

    - **True negatives** are values that the model predicts as negative that actually
    are negative.


    To look at how well the model identifies anomalies, look at the `1` row on the
    y-axis. The sum of this row should equal the total number of anomalies in the
    test set: 99 anomalies. The model predicted about 68.7% of the anomalies correctly
    (`68/(68+31)`) and predicted 99.98% of the normal points correctly (`28425/(28425
    + 7)`) looking at the bottom row.


    As you can see, the confusion matrix gives us a really good look at the true performance
    of the model. You now know that it does very well in the task of predicting normal
    points but does an ok job at predicting anomalies. That being said, the model
    can still predict a majority of anomalies correctly. And so you can see that the
    AUC score of 0.84 was much more accurate at indicating the performance of the
    model than the graph, which had an AUC of 0.98. With an AUC of 0.98, you can expect
    that there are very, very few instances of false negatives or false positives.


    ## Model Validation


    Let’s now look at how to use the process of k-fold cross-validation to compare
    several hyperparameter values. After the validation process has ended, you will
    compare the evaluation metrics to get a better idea of what hyperparameter setting
    works best.


    The hyperparameter you want to tune is how much you want to weight the anomalies
    by compared to the normal data points. By default, both of them are weighted equally.
    Let’s define a list of weights to iterate over:


    ```

    anomaly_weights = [1, 5, 10, 15]

    ```


    Next, you define the number of folds and initialize your data fold generator:


    ```

    num_folds = 5

    kfold = KFold(n_splits=num_folds, shuffle=True, random_state=2020)

    ```


    What this `KFold()` function does is that it splits the data passed in into `num_folds`
    different partitions. A single fold acts as a validation set at a time, while
    the rest of the folds are used for training. In this context, the “validation
    fold” is basically what the model will be evaluating on. It is called “validation”
    since it helps us get an idea of how the model is doing on data it has never seen
    before.


    If you have built deep learning models before, you may know that during the training
    process, you can split a small portion of the training set aside as a validation
    set. This lets you know during training if you’re overfitting or not, as decreasing
    training loss and increasing validation loss would indicate.


    Refer to Figure [2-15](#499842_1_En_2_Chapter.xhtml#Fig15) to see the code above
    in cells.


    ![../images/499842_1_En_2_Chapter/499842_1_En_2_Fig15_HTML.jpg](images/499842_1_En_2_Chapter/499842_1_En_2_Fig15_HTML.jpg)


    Figure 2-15


    Setting the different values for anomaly weights to test with the validation script
    and constructing the `KFold` data generator. In this case, you are using five
    folds, so the data passed in will be split five ways


    Now you define the validation script:


    ```

    logs = []

    for f in range(len(anomaly_weights)):

    fold = 1

    accuracies = []

    auc_scores= []

    for train, test in kfold.split(x_validate, y_validate):

    weight = anomaly_weights[f]

    class_weights= {

    0:1,

    1: weight

    }

    sk_model = LogisticRegression(random_state=None,

    max_iter=400,

    solver=''newton-cg'',

    class_weight=class_weights).fit(x_validate[train], y_validate[train])

    for h in range(40): print(''-'', end="")

    print(f"\nfold {fold}\nAnomaly Weight: {weight}")

    eval_acc = sk_model.score(x_validate[test], y_validate[test])

    preds = sk_model.predict(x_validate[test])

    try:

    auc_score = roc_auc_score(y_validate[test], preds)

    except:

    auc_score = -1

    print("AUC: {}\neval_acc: {}".format(auc_score, eval_acc))

    accuracies.append(eval_acc)

    auc_scores.append(auc_score)

    log = [sk_model, x_validate[test], y_validate[test], preds]

    logs.append(log)

    fold = fold + 1

    print("\nAverages: ")

    print("Accuracy: ", np.mean(accuracies))

    print("AUC: ", np.mean(auc_scores))

    print("Best: ")

    print("Accuracy: ", np.max(accuracies))

    print("AUC: ", np.max(auc_scores))

    ```


    That’s a lot to take in at once, so be sure to refer to Figure [2-16](#499842_1_En_2_Chapter.xhtml#Fig16)
    to make sure your code is formatted correctly.


    ![../images/499842_1_En_2_Chapter/499842_1_En_2_Fig16_HTML.jpg](images/499842_1_En_2_Chapter/499842_1_En_2_Fig16_HTML.jpg)


    Figure 2-16


    The validation script in a cell. The script is quite long, so be sure it is formatted
    correctly because a single space misalignment can cause issues


    Before you run the script, let’s go over what the code does, as that was a lot
    of code thrown out at once.


    The first loop goes over each of the anomaly weights. You set the fold number
    here equal to 1 and define empty lists to hold values for accuracy and AUC scores
    for each run with the current weight parameter.'
