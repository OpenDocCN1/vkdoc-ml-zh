  raw: '#### MLFlow Run – Training and Evaluating


    Let’s move on to the creation of your model. You will be using the `Sequential`
    method of model creation. The model will be quite simple, consisting of a couple
    2D convolutional layers that feed into three dense layers. Run the following:


    ```

    model = Sequential()

    model.add(Conv2D(filters=16, kernel_size=3, strides=2, padding="same", input_shape=(28,
    28, 1), activation="relu"))

    model.add(Conv2D(filters=8, kernel_size=3, strides=2, padding="same", input_shape=(28,
    28, 1), activation="relu"))

    model.add(Flatten())

    model.add(Dense(30, activation="relu"))

    model.add(Dense(20, activation="relu"))

    model.add(Dense(10, activation="softmax"))

    model.summary()

    ```


    You should see something like Figure [4-53](#499842_1_En_4_Chapter.xhtml#Fig54)
    .


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig54_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig54_HTML.jpg)


    Figure 4-53


    Creating the model and outputting a summary of the model’s architecture


    Let’s now compile your model using the Adam optimizer and categorical cross-entropy
    for your loss. For your metric, you will only be using accuracy. Run the following:


    ```

    model.compile(optimizer="Adam", loss="categorical_crossentropy", metrics=["accuracy"])

    ```


    You should see something like Figure [4-54](#499842_1_En_4_Chapter.xhtml#Fig55).


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig55_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig55_HTML.jpg)


    Figure 4-54


    Compiling your model, setting the optimizer to Adam optimizer, setting the loss
    to categorical cross-entropy, and setting the metric to be accuracy


    Now you get to the part where you tell MLFlow to log this run. You want all of
    the metrics to be logged to the same run, so you must tell MLFlow specifically
    to run a block of code in the context of the same run. To do so, you once again
    block your code using the following line:


    ```

    with mlflow.start_run():

    ```


    With that, run the following to set the experiment name, train the model, get
    the evaluation metrics you need, and log them all to MLFlow:


    ```

    mlflow.set_experiment("TF_Keras_MNIST")

    with mlflow.start_run():

    mlflow.tensorflow.autolog()

    model.fit(x=x_train, y=y_train, batch_size=256, epochs=10)

    preds = model.predict(x_test)

    preds = np.round(preds)

    eval_acc = model.evaluate(x_test, y_test)[1]

    auc_score = roc_auc_score(y_test, preds)

    print("eval_acc: ", eval_acc)

    print("auc_score: ", auc_score)

    mlflow.tensorflow.mlflow.log_metric("eval_acc", eval_acc)

    mlflow.tensorflow.mlflow.log_metric("auc_score", auc_score)

    mlflow.end_run()

    ```


    Refer to Figure [4-55](#499842_1_En_4_Chapter.xhtml#Fig56) to see the output.
    Ignore the warning messages. They don’t hinder the training process or the performance
    of the model.


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig56_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig56_HTML.jpg)


    Figure 4-55


    Output of the MLFlow run and the training process. You can also see that the metrics
    you calculated have been updated


    Another new line of code is the following:


    ```

    mlflow.keras.autolog()

    ```


    This basically tells MLFlow to log all the parameters and metrics associated with
    the particular TensorFlow/Keras model. As you will see shortly, MLFlow will log
    the hyperparameters, model metrics listed in the `compile()` function, and even
    the model itself once the training has finished.


    #### MLFlow UI – Checking Your Run


    With that, let’s now open the MLFlow UI and check your run in MLFlow. Make sure
    your terminal or command prompt is in the same directory where the mlruns are
    stored. Usually, MLFlow saves all these runs in the same directory of the Jupyter
    notebook.


    Now that you’ve opened the UI, you should see something like Figure [4-56](#499842_1_En_4_Chapter.xhtml#Fig57).


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig57_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig57_HTML.jpg)


    Figure 4-56


    The MLFlow UI after running the TensorFlow experiment. Notice that there is a
    new experiment titled TF_Keras_MNIST


    Click the tab called TF_Keras_MNIST to see the results of the experiment you just
    logged. You should see something like Figure [4-57](#499842_1_En_4_Chapter.xhtml#Fig58).


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig58_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig58_HTML.jpg)


    Figure 4-57


    Opening the experiment titled TF_Keras_MNIST. You can see that it successfully
    logged a run


    As you can see, your run was just successfully logged. Next, click it to explore
    all of the parameters, metrics, and artifacts that MLFlow logged.


    You should see something like Figure [4-58](#499842_1_En_4_Chapter.xhtml#Fig59).


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig59_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig59_HTML.jpg)


    Figure 4-58


    Looking at the specific run logged in the experiment. As you can see, all the
    parameters and metrics were logged, even the one you specified. It also shows
    you the duration and the status of the run, so now you know how long it took to
    train the model as well as whether or not it completed


    MLFlow saved all of the hyperparameters used when creating the model. This could
    be very useful for hyperparameter tuning on a validation set, for example, where
    you are trying to tune many hyperparameters at once. For example, you can definitely
    tune `batch_size`, `epochs`, or something related to the Adam optimizer like `opt_learning_rate`,
    `opt_beta_1`, or `opt_beta_2`.


    As you can see in Figure [4-58](#499842_1_En_4_Chapter.xhtml#Fig59), MLFlow saved
    the model metrics for accuracy and loss as calculated during the training process.
    In addition, MLFlow also saved the metrics that you defined.


    Scroll down to artifacts and click model and then data. You should see something
    like Figure [4-59](#499842_1_En_4_Chapter.xhtml#Fig60).


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig60_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig60_HTML.jpg)


    Figure 4-59


    Upon closer inspection of the artifacts, it seems MLFlow has also logged the model
    itself


    Here, you can see that MLFlow also saved the model after the training process
    finished. In fact, let’s briefly look at how you can load this model. Make sure
    you go to the top and copy the run ID before doing this.'
