    are in a channels-first format, and the y-sets are in a one-hot encoded format


    #### MLFlow Run – Training and Evaluating


    Now, let’s define your model. A popular convention in PyTorch is to define the
    model as a class since it allows you to much more easily use the GPU while training.
    Instead of passing in every layer to the GPU, you can just send in the model object
    directly.


    Run the following code to define your model:


    ```

    class model(nn.Module):

    def __init__(self):

    super(model, self).__init__()

    # IN 1x28x28 OUT 16x14x14

    self.conv1 = nn.Conv2d(in_channels=1, out_channels=16, kernel_size=3, stride=2,
    padding=1, dilation=1)

    # IN 16x14x14 OUT 32x6x6

    self.conv2 = nn.Conv2d(in_channels=16, out_channels=32, kernel_size=3, stride=2,
    padding=0, dilation=1)

    # IN 32x6x6 OUT 64x2x2

    self.conv3 = nn.Conv2d(in_channels=32, out_channels=64, kernel_size=3, stride=2,
    padding=0, dilation=1)

    # IN 64x2x2 OUT 256

    self.flat1 = nn.Flatten()

    self.dense1 = nn.Linear(in_features=256, out_features=128)

    self.dense2 = nn.Linear(in_features=128, out_features=64)

    self.dense3 = nn.Linear(in_features=64, out_features=10)

    def forward(self, x):

    x = self.conv1(x)

    x = nn.ReLU()(x)

    x = self.conv2(x)

    x = nn.ReLU()(x)

    x = self.conv3(x)

    x = nn.ReLU()(x)

    x = self.flat1(x)

    x = self.dense1(x)

    x = nn.ReLU()(x)

    x = self.dense2(x)

    x = nn.ReLU()(x)

    x = self.dense3(x)

    x = nn.Softmax()(x)

    return x

    ```


    Refer to Figure [4-72](#499842_1_En_4_Chapter.xhtml#Fig73).


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig73_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig73_HTML.jpg)


    Figure 4-72


    Defining the model’s architecture as a class


    Next, let’s send your model to the device, define and initialize an instance of
    Adam optimizer with the learning rate you set earlier, and set your loss function:


    ```

    model = model().to(device)

    optimizer = torch.optim.Adam(model.parameters(), lr=learning_rate)

    criterion = nn.BCELoss()

    ```


    Refer to Figure [4-73](#499842_1_En_4_Chapter.xhtml#Fig74).


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig74_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig74_HTML.jpg)


    Figure 4-73


    Sending the model object to the device, defining your optimizer, and initializing
    the loss function


    Next, you will define a data loader using functionality provided by PyTorch to
    take care of batching your data set:


    ```

    dataset = data.TensorDataset(x_train,y_train)

    train_loader = data.DataLoader(dataset, batch_size=batch_size)

    ```


    Refer to Figure [4-74](#499842_1_En_4_Chapter.xhtml#Fig75).


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig75_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig75_HTML.jpg)


    Figure 4-74


    Creating a data loader object out of your data set. With this functionality, PyTorch
    will batch your data set for you, allowing you to pass in a minibatch at a time
    in your training loop. This essentially is what the TensorFlow 2/Keras `.fit()`
    function does, but it’s all abstracted for you


    As you can see, this is much simpler than having to make an intricate loop to
    batch and pass in data yourself.


    Finally, let’s define the training loop:


    ```

    num_epochs = 5

    for f in range(num_epochs):

    for batch_num, minibatch in enumerate(train_loader):

    minibatch_x, minibatch_y = minibatch[0], minibatch[1]

    output = model.forward(torch.Tensor(minibatch_x.float()).cuda())

    loss = criterion(output, torch.Tensor(minibatch_y.float()).cuda())

    optimizer.zero_grad()

    loss.backward()

    optimizer.step()

    print(f"Epoch {f} Batch_Num {batch_num} Loss {loss}")

    ```


    This can take at least a couple minutes depending on your GPU, and even longer
    if you’re using a CPU. Feel free to lower the number of epochs if you’d like to
    decrease total training time.


    You should see an output like Figure [4-75](#499842_1_En_4_Chapter.xhtml#Fig76).


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig76_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig76_HTML.jpg)


    Figure 4-75


    Output of your training loop. Feel free to reduce the number of epochs to save
    on training time, but this could potentially hinder the model’s performance


    Now, let’s start an MLFlow run, calculate the metrics you want, and log everything:


    ```

    mlflow.set_experiment("PyTorch_MNIST")

    with mlflow.start_run():

    preds = model.forward(torch.Tensor(x_test.float()).cuda())

    preds = np.round(preds.detach().cpu().numpy())

    eval_acc = accuracy_score(y_test, preds)

    auc_score = roc_auc_score(y_test, preds)

    mlflow.log_param("batch_size", batch_size)

    mlflow.log_param("num_epochs", num_epochs)

    mlflow.log_param("learning_rate", learning_rate)

    mlflow.log_metric("eval_acc", eval_acc)

    mlflow.log_metric("auc_score", auc_score)

    print("eval_acc: ", eval_acc)

    print("auc_score: ", auc_score)

    mlflow.pytorch.log_model(model, "PyTorch_MNIST")

    mlflow.end_run()

    ```


    As you can see, MLFlow integration is still quite easy with PyTorch. Refer to
    Figure [4-76](#499842_1_En_4_Chapter.xhtml#Fig77) to see the output.


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig77_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig77_HTML.jpg)


    Figure 4-76


    Setting the experiment, and logging the parameters, metrics, and the model to
    the MLFlow run'
