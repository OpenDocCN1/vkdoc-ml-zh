    ![../images/499842_1_En_3_Chapter/499842_1_En_3_Fig5_HTML.jpg](img/499842_1_En_3_Fig5_HTML.jpg)


    图 3-5


    软件开发环境中的测试流水线。上述最优设置中用于测试打包模型流水线的流水线与此类似：必须测试单个组件，必须分组测试组件，并且流水线首先部署到测试环境，在那里进行进一步测试，然后才部署到生产环境。


