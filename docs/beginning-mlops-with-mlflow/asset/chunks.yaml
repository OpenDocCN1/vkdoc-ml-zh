    ```


    You should see something like Figure [4-49](#499842_1_En_4_Chapter.xhtml#Fig50).


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig50_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig50_HTML.jpg)


    Figure 4-49 – Looking at what one of the data samples looks like using `matplotlib`.
    You also printed out the class label associated with this sample, which was `5`


    Also notice that you printed out the class label associated with this specific
    image. The labels are all integers between `0` and `9`, each associated with an
    image that shows a handwritten digit from `0` to `9`.


    Since 2D convolutional layers in `TensorFlow/Keras` expect four dimensions in
    the format of `(m, h, w, c)` where `m` stands for the number of samples in the
    dataset, `h` and `w` stand for the height and width, respectively, and `c` stands
    for the number of channels (three if it’s an RGB color image for example), you
    need to reshape your data so that it conforms to these specifications. Your images
    are all black and white, so they technically have a channel of one. And so, you
    must reshape them like so:


    ```python

    x_train = x_train.reshape(x_train.shape[0], x_train.shape[1], x_train.shape[2],
    1)

    x_test = x_test.reshape(x_test.shape[0], x_test.shape[1], x_test.shape[2], 1)

    y_train = tf.keras.utils.to_categorical(y_train)

    y_test = tf.keras.utils.to_categorical(y_test)

    ```


    Refer to Figure [4-50](#499842_1_En_4_Chapter.xhtml#Fig51) to see that code in
    a cell.


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig51_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig51_HTML.jpg)


    Figure 4-50 – Reshaping the data to include one channel, conforming with the specifications
    of the convolutional layers. Additionally, the `y` sets are being converted to
    one-hot encoded formats


    You converted the `y` sets by calling a function called `to_categorical()`. This
    converts each sample from an integer value of say `2` or `4` corresponding to
    the digit represented by the `x` samples into a one-hot encoded vector.


    Samples in this format are now `0` vectors with a `num_classes` number of digits.
    In other words, these vectors all have a length matching the total number of classes.
    Whatever value the label was is now the index of the value `1`. And so, if the
    label is `1`, the value at the index of `1` in this vector will be one, and everything
    else is a `0`.


    This may be a little confusing, so refer to Figure [4-51](#499842_1_En_4_Chapter.xhtml#Fig52)
    to see what the one-hot encoded label looks like for a digit representing `5`.


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig52_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig52_HTML.jpg)


    Figure 4-51 – The new output of the one-hot encoded label representing a value
    of `5`. Notice that the value at index `5` is now `1`


    As you can see, the index of the `1` is `5`, corresponding to the first `x_train`
    example you looked at earlier, which was the digit `5`.


    Now, let’s print out the shapes:


    ```python

    print("Shapes")

    print("x_train: {}\ny_train: {}".format(x_train.shape, y_train.shape))

    print("x_test: {}\ny_test: {}".format(x_test.shape, y_test.shape))

