    This step is crucial because it dictates how you are going to approach the problem.
    If you already have a trained model you are looking to update, it also tells you
    if there are any new trends in the data that your model should be updated to consider.
    If you identified any “useless features” that don’t really influence the output,
    you might drop them and train a new model to improve training speed while possibly
    boosting performance.


    *   **Process the data for training:** In this step, you could be scaling the
    data to a more appropriate range and perhaps removing any outliers and/or anomalies
    that could interfere with model performance. Furthermore, you could also be applying
    feature engineering to create new features from existing data points and perhaps
    give your model more or a better context during training. This is also where you
    create training and testing data sets, though optimal practice is to make training,
    testing, and validation data sets.


    *   **Construct, train, and test the model:** In this step, you are creating the
    model, setting hyperparameters, and training the model. In the case of deep learning,
    you can also select a subsection of the training set to be a data validation set.
    The purpose of this set is to have the model be evaluated on it at the end of
    every epoch or full forward pass of the data through the model. By comparing the
    model performance on data it’s seen many times over during training versus data
    it hasn’t seen at all (or rather, data that has no effect on weight adjustment),
    you can see if the model is truly learning to generalize or if it’s just overfitting.


    **Overfitting** is when a model performs significantly better on a training set
    compared to data that it has never seen before. As just discussed, one way to
    give an early indication of overfitting is to set aside a portion of the training
    set as validation data during the training phase. This can give you an early indication
    of overfitting without having to find out after the training process has finished,
    which can take anywhere from minutes to days depending on the depth of the model
    and the equipment used. And so, it follows that overfitting can also be observed
    when the model is evaluated on the testing data or validation data, and discrepancies
    in model performance can be observed between these sets and the training set.


    This phenomenon of overfitting could partially result from the model not receiving
    enough data points during training to reflect the variety it is expected to see,
    so fixing the training set by introducing more variety or even increasing the
    number of data points can help. Additionally, including methods such as regularization
    or dropout into the model’s architecture can also help combat overfitting in the
    case of deep learning models.


    *   An important thing to discuss is the purpose of the **testing** and **validation**
    sets. Testing sets are reserved for evaluating a model’s performance on data it’s
    never seen before.


    Validation sets are reserved for helping select models, select model architecture,
    tune hyperparameters, or simply to give an indication of model performance on
    data it’s never seen during the training process.


    An example of validation is k-fold cross-validation, where it generates k random
    partitions of test-train data from validation data and can be used to train/evaluate
    the model on all of them to give an idea of the best performance it can attain
    with various hyperparameter settings. Of course, we can also use k-fold cross
    validation to perform the other functions that validation helps with. You looked
    at an example using this method of validation in Chapter [2](#499842_1_En_2_Chapter.xhtml),
    when you used it to help tune the weighting of anomalies.


    Coupling this technique with a script that has a set of hyperparameters can result
    in an optimal model with proper hyperparameters. From there, the model can be
    retrained and evaluated again on the test set to get a final performance benchmark.


    The specific order this is done in can differ, though. For example, trained models
    can also be evaluated first and then validated, compared to the other way around.
    This is because the training process is likely to be repeated with altered hyperparameters
    anyway after the evaluation stage reflects some form of performance discrepancy
    or if validation data during the training process reveals that possible overfitting
    is occurring. Either way, it really depends, but good practice is to at least
    incorporate both testing and validation data to best tune the model.


    *   **Validate and tune the model:** As previously discussed, the validation set
    can be another “testing” set that the model has never seen before, and can be
    used in any of the several ways described earlier and in Chapter [1](#499842_1_En_1_Chapter.xhtml).
    Once your model has reached an acceptable level of performance on the validation
    set and is retrained and evaluated again, you can look at deploying the model.


    *   **Deploy and monitor the model:** In this step, the model has finally left
    the hands of the machine learning/data science team. It is now the job of engineering
    and operational teams to integrate this model into the application and put it
    into service. Operational teams are in charge of constantly monitoring the performance
    of the model, with dips in performance possibly indicating that this entire process
    may need to be repeated to update the model to understand new trends. Operational
    teams are also responsible for reporting any bugs and unexpected model predictions
    to the data science team, feedback that also contributes to the start of this
    whole cycle as the model needs to be fixed.


    Hopefully, it’s clear just how work-intensive the entire process can get, especially
    since it will most likely need to be repeated multiple times. While it is possibly
    easier the second time around since you’re only updating the model on new data
    patterns and trends, it is still a problem that can take up hours of manual labor
    that can be better spent elsewhere. After all, maintenance of applications in
    the software development process is usually where most of the money and resources
    go, not the initial construction and release of the application. The same can
    apply to machine learning models, worsening the overall maintenance costs because
    the costs for deployed machine learning models are added on top of the costs for
    the software application utilizing the services of the models.'
  trans: '

    ## 引言


    为各种问题创建机器学习解决方案可能是一项相当艰巨的任务。让我们设身处地地想象一下，一个团队正试图用机器学习来解决某个问题。如果你读过第 1 章，可能对这个过程很熟悉，但为了建立上下文，我们将再次回顾整个过程。如果你已经熟悉，可以跳过本节。整个过程大致如下：


    *   **收集并处理原始数据：** 原始数据很少是易于训练模型的格式。通常，它需要经过处理，以移除异常数据点，例如空值和错误数据值。其他时候，你可能需要处理原始数据，以便从所有噪声中仅提取你需要的信息。


    *   **分析数据：** 这一步涉及查看数据点并理解其特征。数据是如何结构的？数据点的分布看起来如何？数据中是否存在任何可识别的趋势或偏差？这一步至关重要，因为它决定了你将如何着手解决问题。如果你已有想要更新的训练模型，它还能告诉你数据中是否存在任何模型需要更新以考虑的新趋势。如果你识别出了一些对输出没有实际影响的“无用特征”，你可以丢弃它们并训练一个新模型，以提高训练速度，同时可能提升性能。


    *   **处理数据以用于训练：** 在这一步，你可能会将数据缩放到更合适的范围，并可能移除任何可能干扰模型性能的离群值和/或异常值。此外，你还可能应用特征工程，从现有数据点创建新特征，或许能在训练期间为模型提供更多或更好的上下文。这也是你创建训练集和测试集的地方，尽管最佳实践是创建训练集、测试集和验证集。


    *   **构建、训练和测试模型：** 在这一步，你创建模型、设置超参数并训练模型。对于深度学习，你还可以选择训练集的一个子集作为数据验证集。该验证集的目的是在每个训练周期（epoch）结束时，或每次数据完整前向传播通过模型后，对模型进行评估。通过比较模型在训练期间多次见过的数据与从未见过的数据（或者说，对权重调整没有影响的数据）上的性能，你可以判断模型是否真正学会了泛化，还是仅仅在过拟合。


    **过拟合**是指模型在训练集上的表现显著优于在从未见过的数据上的表现。正如刚才讨论的，一种早期指示过拟合的方法是在训练阶段留出一部分训练集作为验证数据。这可以在训练过程结束前就给出过拟合的早期信号，而无需等到训练完成后才发现——训练过程根据模型深度和所用设备，可能需要几分钟到几天不等。因此，当模型在测试数据或验证数据上评估时，如果观察到这些数据集与训练集之间存在性能差异，也表明可能发生了过拟合。


    过拟合现象的部分原因可能是模型在训练期间没有接收到足够的数据点来反映它预期会看到的多样性，因此通过引入更多多样性甚至增加数据点数量来修正训练集可能会有所帮助。此外，在模型架构中加入正则化或丢弃法（dropout）等方法，也有助于在深度学习模型中对抗过拟合。


    *   需要讨论的一个重要问题是**测试集**和**验证集**的用途。测试集保留用于评估模型在从未见过的数据上的性能。


    验证集保留用于帮助选择模型、选择模型架构、调整超参数，或者仅仅是在训练过程中指示模型在从未见过的数据上的性能。


    验证的一个例子是 k 折交叉验证，它从验证数据中生成 k 个随机的训练-测试数据划分，并可用于在所有划分上训练/评估模型，以了解在不同超参数设置下能达到的最佳性能。当然，我们也可以使用
    k 折交叉验证来执行验证所帮助的其他功能。你在第 2 章中看到了一个使用这种验证方法的例子，当时你用它来帮助调整异常值的权重。


    将这种技术与一个包含一组超参数的脚本相结合，可以得到一个具有合适超参数的最优模型。然后，可以重新训练该模型，并再次在测试集上进行评估，以获得最终的性能基准。


    不过，执行这些步骤的具体顺序可能有所不同。例如，训练好的模型也可以先评估再验证，而不是反过来。这是因为，在评估阶段反映出某种性能差异后，或者训练过程中的验证数据揭示可能发生过拟合后，训练过程很可能会以调整后的超参数重复进行。无论如何，这确实取决于具体情况，但好的做法是至少同时使用测试数据和验证数据，以最佳地调整模型。


    *   **验证和调优模型：** 如前所述，验证集可以是另一个模型从未见过的“测试”集，并且可以用于前面以及第 1 章中描述的几种方式中的任何一种。一旦你的模型在验证集上达到了可接受的性能水平，并经过重新训练和再次评估，你就可以考虑部署模型了。


    *   **部署并监控模型：** 在这一步，模型终于离开了机器学习/数据科学团队之手。现在，工程和运维团队的工作是将此模型集成到应用程序中并投入使用。运维团队负责持续监控模型的性能，性能下降可能表明需要重复整个流程来更新模型，使其理解新的趋势。运维团队还负责向数据科学团队报告任何错误和意外的模型预测，这些反馈也促成了整个周期的重新开始，因为模型需要修复。


    希望你现在能清楚整个过程是多么耗费精力，尤其是它很可能需要重复多次。虽然第二次可能会更容易一些，因为你只是在更新模型以适应新的数据模式和趋势，但这仍然是一个可能占用数小时手动劳动的问题，而这些时间本可以更好地用在其他地方。毕竟，在软件开发过程中，应用程序的维护通常是资金和资源投入最多的地方，而不是最初的构建和发布。这一点同样适用于机器学习模型，并且会加剧总体维护成本，因为已部署机器学习模型的成本是在使用这些模型服务的软件应用程序成本之上额外增加的。'
- fmt: 'Imagine if you could simply automate this entire process away, allowing you
    to take full advantage of high-performance machine learning models without all
    of that hassle. This is where MLOps comes in, something that can be thought of
    as the intersection between machine learning and DevOps practices. `DevOps`, or
    developmental operations, refers to a set of practices that combines the work
    processes of software developers with those of operational teams to create a common
    set of practices that functions as a hybrid of the two roles. As a result, the
    developmental cycle of software is expedited, and continuous delivery of software
    products is ensured. Total costs also go down because maintenance costs are reduced
    as a result of the increase in efficiency of the workflow in maintaining the software
    applications. Refer to Figure [3-1](#499842_1_En_3_Chapter.xhtml#Fig1) to see
    a graph representing the DevOps workflow.


    ![../images/499842_1_En_3_Chapter/499842_1_En_3_Fig1_HTML.jpg](images/499842_1_En_3_Chapter/499842_1_En_3_Fig1_HTML.jpg)


    Figure 3-1


    A graph depicting the workflow in a DevOps environment. Software development teams
    typically adopt the Agile methodology of software development, which is summarized
    above through the planning, building, and testing stages. Operational teams are
    in charge of deploying, maintaining, and collecting feedback in the form of bugs
    and user feedback and relaying this information to the development teams. From
    there, the development team enters the maintenance phase of the application, where
    they plan, build, test, and push the next patch/update for the application. Furthermore,
    automating the process of testing and deploying allows for continuous integration
    and delivery of software products, something we will expand upon later in this
    chapter.


    Similarly, MLOps adopts DevOps principles and applies them to machine learning
    models in place of software, uniting the developmental cycles followed by data
    scientists and machine learning engineers with that of operational teams to help
    ensure continuous delivery of high-performance machine learning models. The process
    of model development in what’s called the `experimental stage`, something we will
    look at in detail later in the chapter, can lead to impressive performances and
    can seem like very promising solutions. However, the reality is more that most
    models simply never make it past this experimental stage, since deploying them
    is a massive undertaking on its own. Unfortunately, maintaining models once deployed
    also drains resources, as every new update requires reintegration into the application.
    This means that even if the model is deployed, all teams have their work cut out
    for them. For these reasons, most models simply never make it past the prototype
    phase.


    Until the emergence of MLOps principles, deploying solutions created using the
    latest in machine learning technology served as a significant challenge to businesses
    due to the amount of resources that would be required. This is why MLOps is so
    crucial. It makes it significantly easier to deploy and maintain your machine
    learning solutions by automating most of the hard parts for you, massively expediting
    the development and maintenance processes. With a fully automated setup, teams
    can keep up with the latest in machine learning technology and deploy new models
    quickly. Services can maintain their high level of performance and perhaps even
    improve on this front as teams can deploy newer, more promising model architectures.


    Now that you have a better idea of what MLOps is about and why it is so important,
    let’s jump into the details and look at how an ideal MLOps implementation is set
    up.


    ## MLOps Setups


    Before we look at any specific MLOps setups, let’s first establish three different
    setups representing the various stages of automation: `manual implementation`,
    `continuous model delivery`, and `continuous integration/continuous delivery of
    pipelines`.


    `Manual implementation` refers to a setup where there are no MLOps principles
    applied and everything is manually implemented. The steps discussed above in the
    creation of a machine learning model are all manually performed. Software engineering
    teams must manually integrate the models into the application, and operational
    teams must help ensure all functionality is preserved along with collecting data
    and performance metrics of the model.


    `Continuous model delivery` is a good middle ground between a manual setup and
    a fully automated one. Here, we see the emergence of `pipelines` to allow for
    automation of the machine learning side of the process. Note that we will mention
    this term quite often in the sections below. If you’d like to get a better idea
    about what a pipeline is, refer to the section titled “Pipelines and Automation”
    further down in this chapter. For now, a `pipeline` is an infrastructure that
    contains a sequence of components manipulating information as it passes through
    the pipeline. The function of the pipeline can slightly differ within the setups,
    so be sure to refer to the graphs and explanations to get a better idea of how
    the pipeline in the example functions.


    The main feature of this type of setup is that the deployed model has pipelines
    established to continuously train it on new data, even after deployment. Automation
    of the experimental stage, or the model development stage, also emerges along
    with modularization of code to allow for further automation in the subsequent
    steps. In this setup, `continuous delivery` refers to expedited development and
    deployment of new machine learning models. With the barriers to rapid deployment
    lifted (the tediousness of manual work in the experimental stage) by automation,
    models can now be created or updated at a much faster pace.


    `Continuous integration/continuous delivery of pipelines` refers to a setup where
    pipelines in the experimental stage are thoroughly tested in an automated process
    to make sure all components work as intended. From there, pipelines are packaged
    and deployed, where deployment teams deploy the pipeline to a test environment,
    handle additional testing to ensure both compatibility and functionality, and
    then deploy it to the production environment. In this setup, pipelines can now
    be created and deployed at a quick pace, allowing for teams to continuously create
    new pipelines built around the latest in machine learning architectures without
    any of the resource barriers associated with manual testing and integration.'
