  trans: '

    ## 配置 Azure


    在开始使用 Azure 的功能将模型投入生产之前，您必须首先创建一个新的 Azure 工作区或连接到现有的工作区。您可以通过代码或浏览器中的 UI 来完成此操作。


    在本例中，您将在浏览器中打开门户并学习如何创建工作区。请参考图 6-1。


    ![../images/499842_1_En_6_Chapter/499842_1_En_6_Fig1_HTML.jpg](img/499842_1_En_6_Fig1_HTML.jpg)


    图 6-1


    Microsoft Azure 门户主页示例


    接下来，单击“创建资源”选项并搜索“Machine Learning”。您应该会看到类似图 6-2 的内容。


    ![../images/499842_1_En_6_Chapter/499842_1_En_6_Fig2_HTML.jpg](img/499842_1_En_6_Fig2_HTML.jpg)


    图 6-2


    Azure 提供的“Machine Learning”服务示例。您需要在此服务中创建一个工作区，因此请单击“创建”按钮


    单击“创建”按钮。您应该会看到类似图 6-3 的内容。（我们已使用自己的参数填写了字段。）


    您的订阅可能与我们的不同。对于资源组，我们创建了一个名为 `azure-mlops` 的新资源组。


    您在 6-3 中填写的字段足以创建您的工作区。接下来，单击“查看 + 创建”选项，并在 Azure 声明验证已通过并允许您单击“创建”后，单击“创建”。


    ![../images/499842_1_En_6_Chapter/499842_1_En_6_Fig3_HTML.jpg](img/499842_1_En_6_Fig3_HTML.jpg)


    图 6-3


    工作区创建 UI（我们已使用自己的参数填写了字段）


    部署需要一些时间。工作区创建完成后，返回主页门户并单击“所有资源”选项。您应该会看到类似图 6-4 的内容。


    单击您的工作区，其旁边应有一个化学烧杯图标。


    在此概览中，您将看到与此工作区关联的几个参数。请务必记录工作区的以下属性，以便在代码中连接到它：


    *   `workspace_name` (azure-mlops-workspace )


    *   `subscription` (显示“订阅 ID”的值)


    *   `resource_group` (azure-mlops)


    *   `location` (East-US)


    ![../images/499842_1_En_6_Chapter/499842_1_En_6_Fig4_HTML.jpg](img/499842_1_En_6_Fig4_HTML.jpg)


    图 6-4


    查看“所有资源”选项时，您可能会看到类似这样的内容


    请参考图 6-5。


    ![../images/499842_1_En_6_Chapter/499842_1_En_6_Fig5_HTML.jpg](img/499842_1_En_6_Fig5_HTML.jpg)


    图 6-5


    您应该会看到类似这样的您自己的工作区。这里我们隐藏了可能敏感的字段，但您应该能够在屏幕上看到自己唯一的订阅 ID。这就是您要使用的值


    现在，运行以下命令来创建/连接到您自己的工作区：


    ```

    import azureml

    from azureml.core import Workspace

    workspace_name = "MLOps-Azure"

    workspace_location="East US"

    resource_group = "mlflow_azure"

    subscription_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

    workspace = Workspace.create(name = workspace_name,

    location = workspace_location,

    resource_group = resource_group,

    subscription_id = subscription_id,

    exist_ok=True)

    ```


    如果您已成功连接到工作区，该单元格应能无错误地运行。


    接下来，您必须构建 Azure 要使用的 MLFlow 容器镜像。在此，您还需要指定要部署的模型的运行。


    对于 Amazon SageMaker，您可以引用本地机器上的运行或 S3 存储桶中的运行。对于 Azure，您可以执行相同的操作，只是使用 Azure 的存储实体（称为
    blob）。


    无论哪种方式，您都需要所部署模型的**运行 ID** 以及模型记录所在的**工件方案**。对于存储在 Amazon S3 存储桶中的模型，您使用了方案 `s3:/`，但这次您将仅使用本地运行。如果您愿意，仍然可以使用您的
    Amazon S3 存储桶或 Google Cloud 存储桶。运行存储在哪里并不重要。


    运行以下命令，将值替换为您特定的运行和存储方案：


    ```

    run_id = "1eb809b446d949d5a70a1e22e4b4f428"

    model_name = "log_reg_model"

    model_uri = f"runs:/{run_id}/{model_name}"

    ```


    除非您更改了模型名称，否则模型名称应与您的情况相同。由于我们使用的是本地运行，因此我们有一个以 `runs:/` 开头的 URI。同样，请根据您的情况将其更改为适当的值。


    最后，设置好所有这些信息后，让我们创建容器镜像：


    ```

    import mlflow.azureml

    model_image, azure_model = mlflow.azureml.build_image(model_uri=model_uri,

    workspace=workspace,

    model_name="sklearn_logreg_dev",

    image_name="model",

    description="SkLearn LogReg Model for Anomaly Detection",

    synchronous=False)

    ```


    您应该会看到类似图 6-6 的内容。根据您的 MLFlow 版本，您可能会或可能不会看到警告消息。


    ![../images/499842_1_En_6_Chapter/499842_1_En_6_Fig6_HTML.jpg](img/499842_1_En_6_Fig6_HTML.jpg)


    图 6-6


    构建容器并将其推送到 Azure 的容器注册表。暂时忽略警告消息。您将来可能不会看到这些消息。由于这是由 MLFlow 创建和维护的代码，他们很可能会为 Azure
    推出的任何新功能提供支持


    接下来，运行以下命令检查容器的状态：


    ```

    model_image.wait_for_creation(show_output=True)

    ```


    您应该会看到类似图 6-7 的内容。


    ![../images/499842_1_En_6_Chapter/499842_1_En_6_Fig7_HTML.jpg](img/499842_1_En_6_Fig7_HTML.jpg)


    图 6-7


    检查镜像创建操作中的进度输出


    镜像创建完成后，您现在就可以部署模型了。

    '
- fmt: '# Deploying to Azure (Dev Stage)


    One interesting bit of functionality that Azure provides is the ACI webservice.
    This webservice is specifically used for the purposes of debugging or testing
    some model under development, hence why it is suitable for use in the development
    stage.


    You are going to deploy an ACI webservice instance based on the model image you
    just created.


    Run the following:


    ```

    from azureml.core.webservice import AciWebservice, Webservice

    aci_service_name = "sklearn-model-dev"

    aci_service_config = AciWebservice.deploy_configuration()

    aci_service = Webservice.deploy_from_image(name=aci_service_name,

    image=model_image,

    deployment_config=aci_service_config,

    workspace=workspace)

    ```


    You should see something like Figure [6-8](#499842_1_En_6_Chapter.xhtml#Fig8).


    ![../images/499842_1_En_6_Chapter/499842_1_En_6_Fig8_HTML.jpg](images/499842_1_En_6_Chapter/499842_1_En_6_Fig8_HTML.jpg)


    Figure 6-8


    The output of creating the ACI service. It seems that this function may be removed
    in the future, but for now this is one way to access the ACI service and deploy
    the model


    This exact way of starting the service may be deprecated in the near future in
    favor of Environments. For the time being, you should still be able to start an
    ACI service in this manner, but the important thing to know is that there is a
    web service specifically tailored for development stage testing.


    Now run the following to check the progress:


    ```

    aci_service.wait_for_deployment(show_output=True)

    ```


    You should see something like Figure [6-9](#499842_1_En_6_Chapter.xhtml#Fig9).


    ![../images/499842_1_En_6_Chapter/499842_1_En_6_Fig9_HTML.jpg](images/499842_1_En_6_Chapter/499842_1_En_6_Fig9_HTML.jpg)


    Figure 6-9


    The output you should see from checking if the deployment has succeeded


    Before making your predictions, let’s first verify that you can reach your service:


    ```

    aci_service.scoring_uri

    ```


    You should see something like Figure [6-10](#499842_1_En_6_Chapter.xhtml#Fig10).
    If not, try going into your resources in the portal to verify that a new container
    exists with the name `sklearn-model-dev`. If not, try rerunning the cells in the
    same order. It should display some URI this time.


    ![../images/499842_1_En_6_Chapter/499842_1_En_6_Fig10_HTML.jpg](images/499842_1_En_6_Chapter/499842_1_En_6_Fig10_HTML.jpg)


    Figure 6-10


    The scoring URI is displayed, indicating that you can connect to it and make predictions


    You should see something like Figure [6-10](#499842_1_En_6_Chapter.xhtml#Fig10).


    You can now make predictions with this model.


    ## Making Predictions


    Now you need to acquire some data to predict with.


    Just like before, you will be loading the credit card dataset, preprocessing it,
    and setting aside a small batch that you will query the model with. Run the following
    blocks of code, and make sure you have the folder named `data` in this directory
    with `creditcard.csv` in it:


    ```

    import pandas as pd

    import mlflow

    import mlflow.sklearn

    import seaborn as sns

    import matplotlib.pyplot as plt

    from sklearn.preprocessing import StandardScaler

    from sklearn.model_selection import train_test_split

    from sklearn.metrics import roc_auc_score, accuracy_score, confusion_matrix

    import numpy as np

    import subprocess

    import json

    df = pd.read_csv("data/creditcard.csv")

    ```


    Once you have loaded all the modules and have loaded the data, run the following:


    ```

    normal = df[df.Class == 0].sample(frac=0.5, random_state=2020).reset_index(drop=True)

    anomaly = df[df.Class == 1]

    normal_train, normal_test = train_test_split(normal, test_size = 0.2, random_state
    = 2020)

    anomaly_train, anomaly_test = train_test_split(anomaly, test_size = 0.2, random_state
    = 2020)

