    between the scaling of the data


    ### Model Training


    Finally, you can now define your logistic regression model:


    ```

    sk_model = LogisticRegression(random_state=None, max_iter=400, solver=''newton-cg'').fit(x_train,
    y_train)

    ```


    Refer to Figure [2-11](#499842_1_En_2_Chapter.xhtml#Fig11) to see the code in
    a cell. There should not be any outputs after execution if it all goes well. Any
    errors you might see could involve a failure to converge. For that, changing the
    `max_iter` parameter could help, and changing the `solver` algorithm could help
    as well.


    ![../images/499842_1_En_2_Chapter/499842_1_En_2_Fig11_HTML.jpg](images/499842_1_En_2_Chapter/499842_1_En_2_Fig11_HTML.jpg)


    Figure 2-11


    Defining the logistic regression model and training it on the training data


    After the training process, either the evaluation step or validation step can
    come next. As long as the testing set and the validation set come from different
    distributions (the validation set is derived from the training set, while the
    testing set is derived from the original data), the model is technically seeing
    new data in the evaluation and in the validation processes.


    The context also matters. If you are using the validation process to select the
    best model out of a set of trained models, then the validation process can come
    after the training process. You can still evaluate one or all of your trained
    models, but it could be unnecessary because in this context you’re trying to find
    the best model for the code.


    In the context where you’re trying to tune your hyperparameters for a model you
    are going to stick with, it doesn’t matter whether you do the evaluation first
    or the validation first. Doing the evaluation first, as you will be doing shortly,
    can give you a good idea of how well the model is doing currently before starting
    the validation step. The model will never learn from the evaluation data, so there’s
    no harm in evaluating the model on this data.


    In this example, you are looking at tuning the hyperparameter for class weights
    (how much to weight a normal sample and how much to weight a fraudulent sample).


    But first, let’s evaluate your model to get a deeper understanding of how everything
    works.


    ### Model Evaluation


    You can now look at accuracy and AUC scores. First, you find the accuracy using
    the built-in `score` function of the model:


    ```

    eval_acc = sk_model.score(x_test, y_test)

    ```


    Next, let’s get the list of predictions from the model to help calculate the AUC
    score. AUC is usually a better metric since it better explains the performance
    of the model. The general gist of it is that a model that perfectly classifies
    every point correctly will have an AUC score of 100%.


    The problem with accuracy in this context is that if there are 100,000 normal
    points and perhaps around 100 anomalies, the model can classify all of the normal
    points correctly and none of the anomalies and still get a really high accuracy
    above 99%. However, the AUC score would show a value much lower at around 0.5.
    An AUC of 0.5 means that the model knows nothing and is practically just guessing
    randomly, but in this case, it means the model only ever predicts “normal” for
    any point it sees. In other words, it hasn’t actually learned much of anything
    if it doesn’t know how to predict an anomaly.


    It’s also worth mentioning that AUC isn’t the sole metric by which one should
    base the worthiness of a model, since context matters. In this case, normal points
    far outnumber anomalies, so accuracy is a relatively poor metric to solely judge
    model performance on. AUC scores in this case would reflect the mode’s performance
    well, but it’s also possible to get higher AUC scores but lower accuracy scores.
    That just means you must look at the results carefully to understand exactly what’s
    happening. To help with this, you will look at a “confusion matrix” shortly.


    Now, let’s get the predictions and calculate the AUC score:


    ```

    preds = sk_model.predict(x_test)

    auc_score = roc_auc_score(y_test, preds)

    ```


    Finally, let’s print out the scores:


    ```

    print(f"Auc Score: {auc_score:.3%}")

    print(f"Eval Accuracy: {eval_acc:.3%}")

    ```


    Refer to Figure [2-12](#499842_1_En_2_Chapter.xhtml#Fig12) to see all three of
    the cells above and the output that results.


    ![../images/499842_1_En_2_Chapter/499842_1_En_2_Fig12_HTML.jpg](images/499842_1_En_2_Chapter/499842_1_En_2_Fig12_HTML.jpg)


    Figure 2-12


    Printing out the AUC score and the accuracy for the scikit-learn logistic regression
    model


    In this case, both the AUC score and the accuracy score are high. Between the
    two, the accuracy score is definitely inflated by the number of normal points
    that exist, but the AUC score indicates that the model does a pretty good job
    at distinguishing between the anomalies and the normal points.


    Scikit-learn actually provides a function that lets you see the ROC curve—the
    figure from which the AUC score (or “area under curve”) is derived from. Run the
    following:


    ```

    roc_plot = plot_roc_curve(sk_model, x_test, y_test, name=''Scikit-learn ROC Curve'')

    ```


    Refer to Figure [2-13](#499842_1_En_2_Chapter.xhtml#Fig13) for the output.


    ![../images/499842_1_En_2_Chapter/499842_1_En_2_Fig13_HTML.jpg](images/499842_1_En_2_Chapter/499842_1_En_2_Fig13_HTML.jpg)


    Figure 2-13


    The ROC curve generated for the logistic regression model you just trained. An
    ROC curve starting with a true positive value of 1.0 at a false positive value
    of 0.0 is the best possible curve in theory. From that point, it should keep going
    right while maintaining its value as it hits 1.0 on the x-axis. This graph is
    quite close to that ideal, hence why the AUC score is so high at 0.98. The discrepancy
    in AUC score here compared to when you calculated it earlier has to do with how
    the value is actually calculated


    What’s basically happening is that scikit-learn takes in the model and the evaluation
    set to dynamically generate the curve as it predicts on the test sets. The metrics
    you see on the axes are derived from how correctly the model predicts each of
    the values. The “true positive rate” and the “false positive rate” are derived
    from the values on the confusion matrix that you will see below.'
