- fmt: '# Removing Deployed Model


    Perhaps you have multiple endpoints each with a different model hosted, and you
    no longer want to keep an endpoint running because of the cost. To delete an endpoint,
    you only need the following information:


    * `app_name`

    * `region`


    With that information defined, which it already should be, you can simply run
    the following:


    ```

    mfs.delete(app_name=app_name,region_name=region)

    ```


    You should see it output something like Figure [5-17](#499842_1_En_5_Chapter.xhtml#Fig17).
    This process finishes quite quickly.


    ![../images/499842_1_En_5_Chapter/499842_1_En_5_Fig17_HTML.jpg](images/499842_1_En_5_Chapter/499842_1_En_5_Fig17_HTML.jpg)


    Figure 5-17


    The output of the deletion command


    You can go check the endpoint in the portal as well, and it should show something
    like Figure [5-18](#499842_1_En_5_Chapter.xhtml#Fig18).


    ![../images/499842_1_En_5_Chapter/499842_1_En_5_Fig18_HTML.jpg](images/499842_1_En_5_Chapter/499842_1_En_5_Fig18_HTML.jpg)


    Figure 5-18


    SageMaker endpoint resources after the deletion. There should be nothing here
    if the deletion process went successfully


    As you can see, the endpoint is now completely gone.


    One thing to note is that you should make sure you don’t accidentally leave any
    resources running because the costs can certainly stack up over time and put a
    dent in your wallet. For services like SageMaker endpoints, you are charged by
    the hour, so be sure to delete them once you’re done with them.


    As for the S3 bucket and the ECR container, those are a one-time charge that only
    bill for data transfer.


    With that, you now know how to operationalize your MLFlow model with AWS SageMaker.


    ## Summary


    MLFlow provides explicit AWS SageMaker support in its operationalization code.
    And so we covered how to upload your runs to an S3 bucket and how to create and
    push an MLFlow Docker container image for AWS SageMaker to use when operationalizing
    your models. We also covered how to deploy your model on an endpoint, query it,
    update the endpoint with a new model, and delete the endpoint. Hopefully now you
    now know how to operationalize your machine learning models with MLFlow and AWS
    SageMaker.


    In the next chapter, we will look at how you can operationalize your MLFlow models
    with Microsoft Azure.


    # Deploying in Azure


    In this chapter, we will cover how you can use Microsoft Azure to operationalize
    your MLFlow models. In particular, we will look at how you can also utilize Azure’s
    built-in functionality to deploy a model to a development branch and to a production
    branch, along with how you can query the models once deployed.


    ## Introduction


    In the previous chapter, we went over how to deploy your models to Amazon SageMaker,
    manage them through update or delete events, and query them. Now, we will shift
    our focus to show how you can operationalize your MLFlow models using Microsoft
    Azure.


    Before you begin, here is an **important prerequisites**:


    * Install `azureml-sdk` in your Python environment.


    Just like with AWS, Microsoft Azure is constantly being worked on and updated.
    Since MLFlow supports Microsoft Azure, you should be able to utilize MLFlow to
    operationalize your models. Any new functionality is sure to be documented by
    MLFlow, and in the absolute worst-case scenario, you should still be able to host
    a server on Azure and maintain your MLOps functionality that way.


    Again, we will explore how to do this in the next chapter when we look at how
    to operationalize your MLFlow models with the Google Cloud API.


    In detail, we will go over the following in this chapter:


    * **Configuring Azure:** Here, you basically use MLFlow’s functionality to build
    a container image for the model to be hosted in. Then, you push it to Azure’s
    Azure Container Instances (ACI), similar to how you pushed an image to the Amazon
    AWS Elastic Container Registry (ECR).


    * **Deploying a model to Azure (dev stage):** Here, you use built-in `azureml-sdk`
    module code to push a model to Azure. However, this is a development stage deployment,
    so this model is not production-ready since its computational resources are limited.


    * **Making predictions:** Once the model has finished deployment, it is ready
    to be queried. This is done through an HTTP request. This is how you can verify
    that your model works once hosted on the cloud since it’s in the development stage.


    * **Deploying to production:** Here, you utilize MLFlow Azure module code to deploy
    the model to production by creating a container instance (or any other deployment
    configuration provided, like Azure Kubernetes Service).


    * **Making predictions:** Similar to how you query the model in the dev stage,
    you query the model once it has been deployed to the production stage and run
    the batch query script from the previous chapter.


    * **Switching models:** MLFlow does not provide explicit functionality to switch
    your models, so you must delete the service and recreate it with another model
    run.


    * **Removing the deployed model:** Finally, you undo every deployment that you
    did and remove all resources. That is, you delete both the development and production
    branch services as well as the container registries and any additional services
    created once you are done.


    With that, let’s get started!'
