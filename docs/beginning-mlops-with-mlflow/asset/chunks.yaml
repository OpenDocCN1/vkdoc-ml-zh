  trans: "\n### 管道的持续集成/持续交付\n\n在此设置中，我们将引入一个系统，用于在管道组件打包并准备部署之前对其进行全面测试。这将确保**管道代码的持续集成**以及**管道的持续交付**，这是先前设置所缺失的自动化流程的关键要素。请参考图\
    \ 3-4 查看此类设置的图形表示。\n\n![../images/499842_1_En_3_Chapter/499842_1_En_3_Fig4_HTML.jpg](img/499842_1_En_3_Fig4_HTML.jpg)\n\
    \n图 3-4\n\n描述在图 3-2 的自动化设置中新增的测试系统和包存储的图表\n\n虽然这与之前的设置基本相同，但我们将逐步重新介绍，并重点强调新引入的元素。\n\
    \n1.  **特征存储：** 特征存储包含已处理为标准格式的数据特征。数据科学家可以提取这些特征用于离线数据分析。当触发器被激活时，特征也可以被发送到自动化训练管道，以进一步训练已部署的模型。\n\
    \n2.  **数据分析：** 此步骤由数据科学家对从特征存储中提取的特征执行。分析结果可以决定是构建新模型，还是调整现有模型的架构并在此基础上重新训练。\n\
    \n3.  **自动化模型构建与分析：** 此步骤由模型开发团队执行。团队可以构建模型并将其传入管道，前提是它们与训练、测试和验证代码兼容，整个过程会自动进行，并在最后生成模型分析报告。如果团队想要实现一些最新的机器学习架构，则必须从头开始创建模型，并考虑到与管道的集成以保持模块化。管道代码的某些部分可能也需要更改，这是可以接受的，因为此设置的新组件可以自动处理这些更改。\n\
    \n4.  **模块化代码：** 一旦模型在验证步骤中达到最低性能水平，管道、其组件和模型就可以被模块化并存储在源代码仓库中。\n\n5.  **源代码仓库：**\
    \ 源代码仓库保存了不同管道和不同模型的所有打包后的管道和模型代码。团队可以同时为不同目的创建多个副本并全部存储在此处。在旧的设置中，管道和模型会从这里被拉取，并由软件工程团队手动集成和部署。在此设置中，模块化代码现在必须经过测试，以确保所有组件都能正常工作。\n\
    \n6.  **测试：** 此步骤对于实现**持续集成**至关重要，或者说是自动化的结果，即新组件和元素在新环境中被持续设计、构建和部署。\n\n管道及其组件（包括模型）必须经过全面测试，以确保所有输出都是正确的。此外，管道本身也必须经过测试，以保证它们能够与应用程序及其设计方式协同工作。例如，管道中不应存在会破坏其与应用程序兼容性的错误。应用程序被编程为期望管道具有特定行为，而管道必须相应地运行。\n\
    \n如果你熟悉软件开发，那么管道组件和模型的测试类似于开发人员编写的用于检查应用程序各个功能部分的自动化测试。一个简单的例子是自动化测试，以确保各种类型的数据被服务器成功接收并添加到正确的数据库中。\n\
    \n对于管道和机器学习模型，测试的一些示例包括：\n    *   验证测试过程是否会导致超参数的正确调整？\n\n*   每个管道组件是否正常工作？它是否输出了预期的元素？例如，在模型评估之后，它是否正确启动了验证步骤？（或者，如果模型评估在模型验证之后，评估步骤是否正确启动？）\n\
    \n*   数据处理是否正确执行？数据后处理是否存在任何可能导致模型性能不佳的问题？最好避免这种结果，因为修复数据处理组件会浪费资源。如果业务依赖于快速管道部署，那么避免此类情况就更为关键。\n\
    \n*   数据处理组件是否正确执行了数据缩放？它是否正确执行了特征工程？它是否正确转换了图像？\n\n*   模型分析是否正常工作？你需要确保你的决策基于准确的数据。如果模型实际表现良好，但管道中模型分析组件的缺陷导致数据科学家/机器学习工程师认为模型表现不佳，那么可能会导致管道部署速度变慢的问题。同样，你也不希望模型分析显示错误信息，即使它错误地将精确度显示为准确率。\n\
    \n自动化测试越彻底，就越能保证管道在应用程序中无问题地运行。（这不一定包括模型性能，因为模型性能更多与模型架构、模型的开发方式及其能力有关。）\n\n一旦管道通过了所有测试，它就会被自动打包并发送到包存储。现在，管道的持续集成得以实现，因为团队可以更快地构建经过测试的模块化管道，并使其准备好部署。\n\
    \n7.  **包存储：** 包存储是一个容纳各种打包后管道的容器。它是可选的，但在此设置中包含它，以便有一个集中区域，所有团队都可以访问准备部署的打包管道。模型开发团队将内容推送到此包存储，软件工程师和运维团队可以检索打包的管道并进行部署。通过这种方式，它类似于模型注册中心，两者都有助于实现**持续交付**。包存储有助于实现管道的持续交付，就像模型注册中心有助于实现模型和模型服务的持续交付一样。\n\
    \n得益于自动化测试提供的管道持续集成以及通过包存储实现的管道持续交付，运维团队和软件工程师也可以快速部署管道。有了这些，企业可以轻松跟上机器学习架构的最新趋势和进步，从而实现越来越好的性能和更复杂的服务。\n\
    \n8.  **部署管道：** 在此步骤中，可以从包存储中检索管道并进行部署。软件工程和运维团队必须确保管道能够无故障地集成到应用程序中。因此，软件工程团队可能需要进行更多测试，以确保管道的正确集成。例如，一项测试可以是确保应用程序中考虑了管道的依赖关系（例如，如果\
    \ TensorFlow 已更新并包含管道现在使用的新功能，应用程序也应更新其 TensorFlow 版本）。\n"
- fmt: '团队通常希望将流水线部署到测试环境中，在那里它将接受进一步的自动化测试，以确保与应用程序完全兼容。这可以自动完成（流水线从包存储进入测试环境），也可以手动完成（由团队决定将流水线部署到测试环境）。在流水线通过所有测试后，团队可以选择手动将其部署到生产环境，或让其自动完成。


    无论采用哪种方式，流水线的创建和部署现在都是一个快得多的过程，特别是因为团队无需手动测试流水线，也无需每次都为适配流水线而构建或修改应用程序。


    9.  **自动化训练流水线：** 自动化训练流水线一旦部署，其作用是在触发器激活时进一步训练模型。这有助于使模型尽可能跟上数据的新趋势，并在更长时间内保持高性能。模型经过验证后，会被发送到模型注册表，在那里保存，直到服务需要时使用。


    10. **模型注册表：** 模型注册表保存训练好的模型，直到服务需要它们。同样，由于自动化训练流水线持续为模型注册表提供高性能的机器学习模型以执行各种服务，因此实现了模型服务的持续交付。


    11. **模型服务：** 从模型注册表中拉取最佳模型，为应用程序执行各种服务。


    12. **性能与用户数据收集：** 收集模型性能数据和用户数据，分别发送给模型开发团队和特征存储。团队可以利用模型性能指标以及数据分析结果，帮助决定下一步行动。


    13. **训练流水线触发器：** 此步骤涉及满足某个条件（参考之前的设置，*持续模型交付*），以启动已部署流水线的训练过程，并向其提供从特征存储拉取的新特征数据。


    #### 对设置的反思


    此设置修复了之前设置的主要问题，即流水线部署问题。以前，流水线必须由机器学习团队和运维团队手动测试，以确保流水线及其组件能够工作，并且与应用程序兼容。然而，在此设置中，测试是自动化的，使得团队能够比以往更轻松地构建和部署流水线。这样做最大的优势在于，企业现在可以跟上需要创建新模型和新流水线的重大数据变化，并且还可以利用最新的机器学习趋势和架构——这一切都得益于快速的流水线创建和部署，以及之前设置中模型服务的持续交付。


    从所有这些例子中需要理解的重要一点是，自动化是前进的方向。机器学习技术在过去十年中取得了令人难以置信的进步，而最终，让您能够利用这些进步的基础设施也正在迎头赶上。


    希望看完这三个可能的 MLOps 设置后，您能对 MLOps 以及 MLOps 原则的实现方式有更多了解。您可能已经注意到，在描述这些设置时经常提到“流水线”，您可能会想：“什么是流水线？为什么它们对自动化如此关键？”


    为了回答这个问题，让我们来看看“流水线”到底是什么。


    ## 流水线与自动化


    流水线是采用 DevOps 原则的自动化设置中的重要组成部分。理解**流水线**的一种方式是，它是一个特定的、通常是顺序的过程，规定了信息在流经流水线时的流动方式。要查看软件开发环境中测试流水线的示例，请参考图
    [3-5](#499842_1_En_3_Chapter.xhtml#Fig5)。


    ![../images/499842_1_En_3_Chapter/499842_1_En_3_Fig5_HTML.jpg](images/499842_1_En_3_Chapter/499842_1_En_3_Fig5_HTML.jpg)


    图 3-5


    软件开发环境中的测试流水线。上述最优设置中用于测试打包模型流水线的流水线与此类似：必须测试单个组件，必须分组测试组件，并且流水线首先部署到测试环境，在那里进行进一步测试，然后才部署到生产环境。


    在上述 MLOps 设置中，您已经看到了用于自动化训练已部署模型过程的流水线，以及用于构建、测试和打包流水线，以及在将打包流水线部署到生产环境之前测试其集成的流水线。


    那么，这到底意味着什么呢？为了更好地理解流水线中具体发生了什么，让我们跟随数据在实验阶段的流水线中的流动。即使您了解流水线的工作原理，也值得跟随这个例子走一遍，因为我们现在将结合使用
    MLOps API 的上下文来审视这条流水线。


    ### 流水线之旅


    我们将关注实验阶段的模型开发流水线。在开始之前，需要说明的是，我们将在本流水线中引用 API 调用。这是因为在模型开发的关键节点，可以在执行脚本甚至 Jupyter
    单元格时调用某些 API，从而向 MLOps 监控软件提供关于模型训练、模型评估和模型验证的信息。在流水线结束时，MLOps 软件还会通过 API 提供的功能，使模型准备好进行部署。


    您将在下一章（第 [4](#499842_1_En_4_Chapter.xhtml) 章）中了解更多关于此 API 的信息，但现在，您可以假设在跟随示例的过程中，API
    将负责自动化工作。


    #### 模型选择


    如图 [3-4](#499842_1_En_3_Chapter.xhtml#Fig4) 所示，实验流水线从选择模型开始。这取决于操作者，操作者现在必须选择并构建一个模型。一些
    API 允许您在构建模型时调用其功能，以便在后续过程中与 MLOps 软件连接。然后，该软件会跟踪与模型开发相关的所有相关指标以及模型本身，以便启动部署过程。


    在本例中，操作者选择使用逻辑回归。请参考图 [3-6](#499842_1_En_3_Chapter.xhtml#Fig6)。


    ![../images/499842_1_En_3_Chapter/499842_1_En_3_Fig6_HTML.jpg](images/499842_1_En_3_Chapter/499842_1_En_3_Fig6_HTML.jpg)


    图 3-6


    流水线的图形化表示，其中操作者选择了逻辑回归模型。其余步骤暂时隐藏，将随着我们逐步深入流水线而显现'
  raw: 'Teams usually want to deploy the pipelines into a test environment where it
    will be subjected to further automated testing to ensure full compatibility with
    the application. This can be done automatically, where the pipelines go from the
    package store into the test environment, or manually, where teams decide to deploy
    the pipeline into the test environment. After the pipeline passes all the tests,
    teams can choose to manually deploy the pipeline into the production environment
    or have it automatically done.


    Either way, pipeline creation and deployment is a much faster process now especially
    since teams do not have to manually test the pipelines and they do not have to
    build or modify the application to work with the pipeline every time.


    9.  **Automated training pipeline:** The automated training pipeline, once deployed,
    exists to further train models upon activation of the trigger. This helps keep
    models as up to date as possible on new trends in data and maintain high performance
    for longer. Upon validation of the model, models are sent to the model registry
    where they are held until they are needed for services.


    10.  **Model registry:** The model registry holds trained models until they are
    needed for their services. Once again, continuous delivery of model services is
    achieved as the automated training pipeline continuously provides the model registry
    with high-performance machine learning models to be used to perform various services.


    11.  **Model services:** The best models are pulled from the model registry to
    perform various services for the application.


    12.  **Performance and user data collection:** Model performance data and user
    data is collected to be sent to model development teams and the feature store,
    respectively. Teams can use the model performance metrics along with the results
    from the data analysis to help decide their next course of action.


    13.  **Training pipeline trigger:** This step involves some condition being met
    (refer to the previous setup, *continuous model delivery*) to initiate the training
    process of the deployed pipeline and feed it with new feature data pulled from
    the feature store.


    #### Reflection on the Setup


    The main issue of the previous setup that this one fixes is that of pipeline deployment.
    Previously, pipelines had to be manually tested by machine learning teams and
    operational teams to ensure that the pipeline and its components worked, and that
    the pipeline and its components were compatible with the application. However,
    in this setup, testing is automated, allowing for teams to much more easily build
    and deploy pipelines than before. The biggest advantage to this is that businesses
    can now keep up with significant changes in the data requiring the creation of
    new models and new pipelines, and can also capitalize on the latest machine learning
    trends and architectures all thanks to rapid pipeline creation and deployment
    combined with continuous delivery of model services from the previous setup.


    The important thing to understand from all these examples is that automation is
    the way to go. Machine learning technology has progressed incredibly far within
    the last decade alone, but finally, the infrastructure to allow you to capitalize
    on these advancements is catching up.


    Hopefully, after seeing the three possible MLOps setups, you understand more about
    MLOps and how implementations of MLOps principles might look. You might have noticed
    that pipelines have been mentioned quite often throughout the descriptions of
    the setups, and you might be wondering, “What are pipelines, and why are they
    so crucial for automation?”


    To answer that question, let’s take a look at what a “pipeline” really is.


    ## Pipelines and Automation


    Pipelines are an important part of automation setups employing DevOps principles.
    One way to think about a **pipeline** is that it is a specific, often sequential
    procedure that dictates the flow of information as it passes through the pipeline.
    To see an example of a testing pipeline in a software development setting, refer
    to Figure [3-5](#499842_1_En_3_Chapter.xhtml#Fig5).


    ![../images/499842_1_En_3_Chapter/499842_1_En_3_Fig5_HTML.jpg](images/499842_1_En_3_Chapter/499842_1_En_3_Fig5_HTML.jpg)


    Figure 3-5


    A testing pipeline in a software development setting. The pipeline for testing
    packaged model pipelines in the optimal setup above is similar in that individual
    components must be tested, components must be tested in groups, and in the case
    where pipelines are deployed to a test environment first where further tests are
    performed before they are deployed to the production environment


    In the MLOps setups above, you’ve seen pipelines for automating the process of
    training a deployed model and for building, testing, and packing pipelines as
    well as for testing integration of packaged pipelines before deploying them to
    the production environment.


    So, what does all that really mean? To get a better idea of what exactly goes
    on in a pipeline, let’s follow the flow of data through a pipeline in the experimental
    stage. Even if you understand how pipelines work, it may be worth following the
    example anyway as we now look at this pipeline through the context of using MLOps
    APIs.


    ### Journey Through a Pipeline


    We will be looking at the model development pipeline in the experimental stage.
    Before we begin, it is important to mention that we will be referencing API calls
    in this pipeline. This is because some APIs can be called while executing scripts
    or even Jupyter cells at key points in the model’s development, giving MLOps monitoring
    software information on model training, model evaluation, and model validation.
    At the end of the pipeline, the MLOps software would also ready the model for
    deployment via functionality provided by the API.


    You will read more about this API in the next chapter, Chapter [4](#499842_1_En_4_Chapter.xhtml),
    but for now, you may assume that the API will take care of automation as you follow
    along through the example.


    #### Model Selection


    As seen in Figure [3-4](#499842_1_En_3_Chapter.xhtml#Fig4), the experimental pipeline
    begins with the selection of a model. This is up to the operator, who must now
    choose and build a model. Some APIs allow you to call their functionality while
    building the model to connect with MLOps software as the rest of the process goes
    on. This software then keeps track of all relevant metrics related to the model’s
    development along with the model itself in order to initiate the deployment process.


    In this case, the operator has chosen to use a logistic regression. Refer to Figure
    [3-6](#499842_1_En_3_Chapter.xhtml#Fig6).


    ![../images/499842_1_En_3_Chapter/499842_1_En_3_Fig6_HTML.jpg](images/499842_1_En_3_Chapter/499842_1_En_3_Fig6_HTML.jpg)


    Figure 3-6


    A graphical representation of a pipeline where the operator has selected a logistic
    regression model. The rest of the steps have been hidden for now and will appear
    as we gradually move through the pipeline'
