- fmt: '你可以看到，如果实验不存在，`MLFlow`会自动生成一个新的实验，因此你可以直接从代码中创建新实验。你还可以看到，代码的其余部分基本照常输出，只是还会打印你指定的当前`MLFlow`运行的运行ID。稍后当你选择要服务的特定模型时，会用到这个ID。接下来，你将打开`MLFlow`提供的UI，在那里你可以查看所有实验和模型运行。最后，你还需要将模型本身作为工件记录到`MLFlow`中。`MLFlow`会将这段代码模块化，使其能与`MLFlow`提供的代码配合使用，以支持多种`MLOps`原则的实现。


    以下操作在**Windows 10**上完成，但在`MacOS`或`Linux`上应该相同。首先，打开命令提示符/`PowerShell`/终端。然后，你必须进入包含此笔记本文件的目录。列出该目录的内容（或在文件资源管理器/`Jupyter`内部查看），你会注意到一个名为`mlruns`的新目录。


    如果你在`Conda`中安装了所有包，请确保在运行此操作之前已激活`Conda`环境。


    现在要做的是，确保你的命令提示符、`PowerShell`或终端位于包含`mlruns`的同一目录中，然后输入以下内容：


    ```

    mlflow ui -p 1234

    ```


    命令`mlflow ui`在默认端口5000上本地托管`MLFlow` UI。然而，选项`-p 1234`告诉它你希望将其专门托管在端口1234上。


