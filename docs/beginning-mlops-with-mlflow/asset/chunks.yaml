    查看特定验证折的ROC曲线。如你所见，ROC曲线非常理想。完美的ROC曲线会尽可能接近y轴上的1.0，同时在到达x轴上的1.0时保持该水平。这样的ROC图意味着AUC将尽可能接近1.0。在这种情况下，你几乎看到了完美的AUC曲线，并且AUC被声明为1.0。图[2-19](#499842_1_En_2_Chapter.xhtml#Fig19)中的混淆矩阵将揭示更多关于AUC分数为何如此之低的原因。


