    图 2-13


    为你刚刚训练的逻辑回归模型生成的 ROC 曲线。理论上，一条在假阳性率为 0.0 时真阳性率起始值为 1.0 的 ROC 曲线是最佳曲线。从该点开始，它应该保持其值向右延伸，直到在
    x 轴上达到 1.0。此图非常接近该理想状态，因此 AUC 分数高达 0.98。此处 AUC 分数与你之前计算时的差异与值的实际计算方式有关


    基本上发生的事情是，scikit-learn 接收模型和评估集，在测试集上进行预测时动态生成曲线。你在坐标轴上看到的指标源自模型正确预测每个值的程度。“真阳性率”和“假阳性率”源自你将在下面看到的混淆矩阵上的值。

