- fmt: '### Deploying the Model


    Serving and querying models locally is very easy and can be done in the command
    line. You only need the experiment ID and the run ID to serve the model. This
    is where the print statement from earlier can apply, as it prints the run ID of
    that specific run. If you just want to serve the latest model, you may do so using
    that ID.


    Otherwise, you can look in the MLFlow UI, select a model run that suits your needs,
    and paste the run this way.


    Before you begin, go to the MLFlow UI once again, and click the experiment `scikit_learn_experiment`.
    Pick a run and copy the run ID. Don’t forget the model name that you logged the
    model with either, which should be `log_reg_model`.


    You may create a new notebook at this point to keep the code more organized, but
    be sure to import the following:


    ```

    import pandas as pd

    import mlflow

    import mlflow.sklearn

    import seaborn as sns

    import matplotlib.pyplot as plt

    from sklearn.preprocessing import StandardScaler

    from sklearn.model_selection import train_test_split

    from sklearn.metrics import roc_auc_score, accuracy_score, confusion_matrix

    import numpy as np

    import subprocess

    import json

    ```


    You’ll notice that you are now importing `subprocess`. If you’re using the same
    notebook, make sure to import this module as well.


    Refer to Figure [4-101](#499842_1_En_4_Chapter.xhtml#Fig102) to see this code
    in a cell.


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig102_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig102_HTML.jpg)


    Figure 4-101


    Importing the necessary modules


    Now, open up your command prompt/terminal so that you can begin to serve your
    local model. First, you need to change your directory to one that contains the
    `mlruns` folder with all your experiments. Next, you need two things: your **model
    run** and your **model name**.


    Again, your model run can be anything you pick from the MLFlow UI or it can simply
    be the latest run. The model name is whatever you set it to when logging the model.
    In this case, it will be `log_reg_model`.


    Once you have that, run the following command in your command prompt/terminal.
    We have generalized the command, so be sure to replace the fields with your model
    run and model name, respectively:


    ```

    mlflow models serve --model-uri runs:/YOUR_MODEL_RUN/YOUR_MODEL_NAME -p 1235

    ```


    In our case, our model run was `3862eb3bd89b43e8ace610c521d974e6`, and our model
    name was once again `log_reg_model`. And so, the command we ran looks like Figure
    [4-102](#499842_1_En_4_Chapter.xhtml#Fig103).


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig103_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig103_HTML.jpg)


    Figure 4-102


    The command that we ran to serve our model locally


    In text, the command looks like this:


    ```

    mlflow models serve --model-uri runs:/3862eb3bd89b43e8ace610c521d974e6/log_reg_model
    -p 1235

    ```


    MLFlow should start constructing a new conda environment right away that it will
    use to serve locally. In this environment, it installs basic packages and specific
    packages that the model needs to be able to run.


    After some time, you should see something like in Figure [4-103](#499842_1_En_4_Chapter.xhtml#Fig104).


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig104_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig104_HTML.jpg)


    Figure 4-103


    The result of running the command to deploy the model locally. You might see something
    different, such as `localhost:1235`, but this is because we have docker installed


    MLFlow should create a new conda environment before hosting the model on your
    local server. The port option `-p` lets you set a specific port to host the model
    on. We selected a specific port so that we can have MLFlow UI running at the same
    time, as both of them default to port 5000. In our case, our MLFlow UI is running
    on port 1234, so we are serving the model on port 1235.


    ### Querying the Model


    You are now ready to query the model with data and receive predictions. This is
    where the `subprocess` module comes in, and you’ll see why shortly. First, let’s
    load up your data frame again. Run the following code:


    ```

    df = pd.read_csv("data/creditcard.csv")

    ```


    You should see something like Figure [4-104](#499842_1_En_4_Chapter.xhtml#Fig105).


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig105_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig105_HTML.jpg)


    Figure 4-104


    Loading the credit card dataset


    Next, select 80 values from your data frame to query your model with. Run the
    following code:


    ```

    input_json = df.iloc[:80].drop(["Time", "Class"], axis=1).to_json(orient="split")

    ```


    You should see something like Figure [4-105](#499842_1_En_4_Chapter.xhtml#Fig106).


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig106_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig106_HTML.jpg)


    Figure 4-105


    Converting a selection of 80 rows, dropping the `Time` and `Class` columns since
    they were dropped in the original `x_train` used to train the model, to a JSON
    with a split orient


    The next step is important because of how you preprocessed the data before training
    your model originally. To show why it’s so important, we will quickly demonstrate
    the difference in evaluation metrics from passing in non-scaled data and scaled
    data. First of all, here is the code to send data to the model and receive predictions
    back:


    ```

    proc = subprocess.run(["curl",  "-X", "POST", "-H", "Content-Type:application/json;
    format=pandas-split", "--data", input_json, "http://127.0.0.1:1235/invocations"],
    stdout=subprocess.PIPE, encoding=''utf-8'')

    output = proc.stdout

    df2 = pd.DataFrame([json.loads(output)])

    df2

    ```


    Essentially, what this does is run the following command within Python itself:


    ```

    curl -X POST -H "Content-Type:application/json; format=pandas-split" –data "CONTENT_OF_INPUT_JSON"  "http://127.0.0.1:1235/invocations"

    ```


    The core of the problem is that if you are running this in command line, pasting
    the JSON format data of the data frame can get very messy because there’s so many
    columns. That is why we chose to use `subprocess` as it is easier to directly
    pass in the JSON itself using a variable name, `input_json` in this case, to hold
    the contents of the JSON.


    You should see something like Figure [4-106](#499842_1_En_4_Chapter.xhtml#Fig107).


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig107_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig107_HTML.jpg)


    Figure 4-106


    Sending data to the locally hosted model and receiving predictions from the model


    Now, you will query the model with input data that is not scaled.'
