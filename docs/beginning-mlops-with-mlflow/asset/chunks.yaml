    训练结果的混淆矩阵图。正常点的准确率非常高，但异常点的准确率尚可。从这些结果来看，仍有进一步改进的空间，因为你尚未调整模型的超参数，但它在检测异常方面已经表现不错。现在的目标是尽可能保持正常点的准确率，或将其维持在一个可接受的高水平，同时尽可能提高异常点的准确率。基于这个混淆矩阵图，你现在可以看到，较低的
    AUC 分数更能准确反映模型的真实性能。你可以看到，有相当数量的异常点被错误地分类为正常点，因此，0.84 的 AUC 分数比图表上显示的 0.98 分数更能指示模型的性能。


    这就是混淆矩阵的样子。y 轴由真实标签组成，而 x 轴由预测标签组成。当真实标签为“0”且模型预测为“0”时，我们称之为**真负例**。“真”指的是真实标签，“负”指的是模型预测的标签。


    什么算作“正例”，什么算作“负例”可能有所不同。在疾病检测等任务中，如果测试发现某人患有疾病，则称其“检测呈阳性”。否则，他们“检测呈阴性”。异常检测与此类似。当模型认为某个点是异常点时，它会用标签“1”标记它。因此，如果模型认为某个点是异常点，则该点被标记为“正例”；如果模型认为不是，则标记为“负例”。


    你可能注意到我们在代码中反转了坐标轴。这只是为了使其格式符合要求，使得矩阵的左上角对应“真正例”，右上角对应“假负例”，左下角对应“假正例”，右下角对应“真负例”。


    快速回顾这些概念：


    *   **真正例**是模型预测为正例且实际为正例的值。

    *   **假负例**是模型预测为负例但实际为正例的值。

    *   **假正例**是模型预测为正例但实际为负例的值。

    *   **真负例**是模型预测为负例且实际为负例的值。


    要查看模型识别异常点的效果，请查看 y 轴上的`1`行。该行的总和应等于测试集中异常点的总数：99 个异常点。模型正确预测了约 68.7%的异常点（68/(68+31)），并正确预测了
    99.98%的正常点（28425/(28425 + 7)），查看底行即可。


    如你所见，混淆矩阵让我们很好地了解了模型的真实性能。你现在知道它在预测正常点方面做得非常好，但在预测异常点方面表现尚可。话虽如此，该模型仍然可以正确预测大多数异常点。因此，你可以看到，0.84
    的 AUC 分数在指示模型性能方面比 AUC 为 0.98 的图表准确得多。对于 0.98 的 AUC，你可以预期假负例或假正例的实例非常非常少。


    ### 模型验证


    现在，让我们看看如何使用 k 折交叉验证过程来比较几个超参数值。验证过程结束后，你将比较评估指标，以便更好地了解哪种超参数设置效果最佳。


    你想要调整的超参数是相对于正常数据点，对异常点赋予多少权重。默认情况下，两者权重相等。让我们定义一个要迭代的权重列表：


    ```

    anomaly_weights = [1, 5, 10, 15]

    ```


    接下来，定义折数并初始化数据折生成器：


    ```

    num_folds = 5

    kfold = KFold(n_splits=num_folds, shuffle=True, random_state=2020)

    ```


    这个`KFold()`函数的作用是将传入的数据分割成`num_folds`个不同的分区。单个折在每次迭代中充当验证集，而其余折用于训练。在此上下文中，“验证折”基本上就是模型将要评估的数据。它被称为“验证”，因为它有助于我们了解模型在从未见过的数据上的表现。


    如果你之前构建过深度学习模型，你可能知道在训练过程中，可以将训练集的一小部分分割出来作为验证集。这让你在训练期间就能知道是否过拟合，因为训练损失下降而验证损失上升就表明了这一点。


    请参考图 2-15 查看上述代码在单元格中的形式。


    ![../images/499842_1_En_2_Chapter/499842_1_En_2_Fig15_HTML.jpg](img/499842_1_En_2_Fig15_HTML.jpg)


    图 2-15


    设置不同的异常权重值以使用验证脚本进行测试，并构建 KFold 数据生成器。在本例中，你使用了五折，因此传入的数据将被分成五份


    现在定义验证脚本：


    ```

    logs = []

    for f in range(len(anomaly_weights)):

    fold = 1

    accuracies = []

    auc_scores= []

    for train, test in kfold.split(x_validate, y_validate):

    weight = anomaly_weights[f]

    class_weights= {

    0:1,

    1: weight

    }

    sk_model = LogisticRegression(random_state=None,

    max_iter=400,

    solver=''newton-cg'',

    class_weight=class_weights).fit(x_validate[train], y_validate[train])

    for h in range(40): print(''-'', end="")

    print(f"\nfold {fold}\nAnomaly Weight: {weight}")

    eval_acc = sk_model.score(x_validate[test], y_validate[test])

    preds = sk_model.predict(x_validate[test])

    try:

    auc_score = roc_auc_score(y_validate[test], preds)

    except:

    auc_score = -1

    print("AUC: {}\neval_acc: {}".format(auc_score, eval_acc))

    accuracies.append(eval_acc)

    auc_scores.append(auc_score)

    log = [sk_model, x_validate[test], y_validate[test], preds]

    logs.append(log)

    fold = fold + 1

    print("\nAverages: ")

    print("Accuracy: ", np.mean(accuracies))

    print("AUC: ", np.mean(auc_scores))

    print("Best: ")

    print("Accuracy: ", np.max(accuracies))

    print("AUC: ", np.max(auc_scores))

    ```


