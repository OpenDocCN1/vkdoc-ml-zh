- fmt: "### Loading a Logged Model\n\nNext, let’s briefly look at how you can load\
    \ the models logged by MLFlow. Go back to the experiment and click a run. Note\
    \ the run ID at the top and copy it. Then, go back to the notebook, and run the\
    \ following. Note that there is a placeholder for the run ID:\n\n```\nloaded_model\
    \ = mlflow.sklearn.load_model(\"runs:/YOUR_RUNID_HERE/log_reg_model\")\n```\n\n\
    To better understand what this path is, let’s split it up into three sections:\
    \ the format (`runs:/`), the run ID (`YOUR_RUNID_HERE`), and the model name that\
    \ you used when you logged it (`log_reg_model`).\n\nIn our case, our run ID was\
    \ `3862eb3bd89b43e8ace610c521d974e6`, so our cell looks like Figure [4-21](#499842_1_En_4_Chapter.xhtml#Fig21).\
    \ Ensure your code looks somewhat like Figure [4-21](#499842_1_En_4_Chapter.xhtml#Fig21),\
    \ with the only difference being the run ID that you chose since it will be different\
    \ from ours.\n\n![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig21_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig21_HTML.jpg)\n\
    \n**Figure 4-21** – The code to load a model that we logged using the specific\
    \ run ID we logged it in along with the model’s name we used when we logged it\n\
    \nThis is now the same model that you had when MLFlow logged it in the first place.\
    \ With this, you can call something like `.score()` and see that it’s the same\
    \ as during training:\n\n```\nloaded_model.score(x_test, y_test)\n```\n\nThis\
    \ outputs the accuracy as the model is evaluated on the test set. If this truly\
    \ is the same model, then the accuracy should match what was output earlier during\
    \ the evaluation portion of the model run.\n\nRefer to Figure [4-22](#499842_1_En_4_Chapter.xhtml#Fig22)\
    \ to see the output.\n\n![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig22_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig22_HTML.jpg)\n\
    \n**Figure 4-22** – This is the evaluation accuracy of the loaded model after\
    \ evaluation on the test sets. If you compare this with Figure [4-11](#499842_1_En_4_Chapter.xhtml#Fig11),\
    \ you can see that the numbers more or less match, disregarding rounding\n\nAs\
    \ you can see, this value matches the evaluation accuracy from Figure [4-11](#499842_1_En_4_Chapter.xhtml#Fig11).\n\
    \nNow you know how to load a model from a specific MLFlow run.\n\nWith that, you’ve\
    \ seen some of the functionality that MLFlow provides and how it can help in keeping\
    \ your prototyping experiments much more organized. As you will see shortly, this\
    \ entire pipeline that you just explored is pretty much all you need to recreate\
    \ the train, test, validate pipeline that you saw earlier. Before you move on\
    \ to looking at how you can use MLFlow with other frameworks, let’s go over how\
    \ you can use MLFlow functionality to vastly improve the model validation process.\n\
    \n### Model Validation (Parameter Tuning) with MLFlow\n\n#### Parameter Tuning\
    \ – Broad Search\n\nJust like in Chapter [2](#499842_1_En_2_Chapter.xhtml), you\
    \ will use a script to help with model validation with respect to hyperparameter\
    \ tuning. The tuning script will largely remain the same, except for a few modifications\
    \ where MLFlow code has been added in.\n\nRun the following code to set the range\
    \ of anomaly weights and to set the number of folds:\n\n```\nanomaly_weights =\
    \ [1, 5, 10, 15]\nnum_folds = 5\nkfold = KFold(n_splits=num_folds, shuffle=True,\
    \ random_state=2020)\n```\n\nThe code should look like Figure [4-23](#499842_1_En_4_Chapter.xhtml#Fig23).\n\
    \n![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig23_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig23_HTML.jpg)\n\
    \n**Figure 4-23** – The code to determine the list of anomaly weights to perform\
    \ validation over, to determine the number of folds, and to initialize the KFolds\
    \ generator based on the number of folds\n\nNow, paste the following. This is\
    \ the first half of the entire function:\n\n```\nmlflow.set_experiment(\"sklearn_creditcard_broad_search\"\
    )\nlogs = []\nfor f in range(len(anomaly_weights)):\n    fold = 1\n    accuracies\
    \ = []\n    auc_scores= []\n    for train, test in kfold.split(x_validate, y_validate):\n\
    \        with mlflow.start_run():\n            weight = anomaly_weights[f]\n \
    \           mlflow.log_param(\"anomaly_weight\", weight)\n            class_weights=\
    \ {\n                0: 1,\n                1: weight\n            }\n       \
    \     sk_model = LogisticRegression(random_state=None,\n                     \
    \                     max_iter=400,\n                                        \
    \  solver='newton-cg',\n                                          class_weight=class_weights).fit(x_validate[train],\
    \ y_validate[train])\n            for h in range(40): print('-', end=\"\")\n \
    \           print(f\"\\nfold {fold}\\nAnomaly Weight: {weight}\")\n          \
