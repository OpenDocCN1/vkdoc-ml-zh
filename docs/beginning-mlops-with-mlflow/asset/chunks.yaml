- fmt: '### MLFlow with TensorFlow 2.0 (Keras)


    `MLFlow` provides easy integration with `TensorFlow 2.0+` (any version of `TensorFlow
    2.0` and above). To see how, let’s go over a very basic example of a handwritten
    digit classifier model on the `MNIST` dataset. We will be using the built-in `Keras`
    module to keep things simple for demonstration purposes. `MLFlow` supports `TensorFlow
    1.12` at a minimum, so this code should run as long as you have at least `TensorFlow
    1.12`.


    We will assume a basic level of familiarity with `TensorFlow 2`, so we won’t go
    into much depth about what the functions, model layers, optimizers, and loss functions
    mean.


    Before we begin, here are the versions of `TensorFlow`, `CUDA`, and `CuDNN` that
    we used. Keep in mind that we ran this using the GPU version of `TensorFlow` (the
    package is called `tensorflow-gpu`), although you should be able to run this without
    a GPU at the cost of it taking longer:


    - **TensorFlow** (GPU version) – `2.3.0`

    - **CUDA** – `10.1`

    - **CuDNN** – `v7.6.5.32` for `CUDA 10.1`

    - **Sklearn** – `0.22.2.post1`

    - **MLFlow** – `1.10.0`


    #### Data Processing


    Here is the code to import the necessary modules and print out their versions:


    ```python

    import tensorflow as tf

    from tensorflow.keras.models import Sequential

    from tensorflow.keras.layers import Dense, Conv2D, Flatten

    from tensorflow.keras.datasets import mnist

    import numpy as np

    import matplotlib

    import matplotlib.pyplot as plt

    import sklearn

    from sklearn.metrics import roc_auc_score

    import mlflow

    import mlflow.tensorflow

    print("TensorFlow: {}".format(tf.__version__))

    print("Scikit-Learn: {}".format(sklearn.__version__))

    print("Numpy: {}".format(np.__version__))

    print("MLFlow: {}".format(mlflow.__version__))

    print("Matplotlib: {}".format(matplotlib.__version__))

    ```


