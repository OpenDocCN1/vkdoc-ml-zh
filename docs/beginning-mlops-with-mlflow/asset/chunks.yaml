    Checking the output of the first sample in y_train, you now see that the tensor
    has been converted into a one-hot encoded format


    As you can see, it is now in a one-hot encoded format. Now you can proceed to
    checking the shapes of your data sets:


    ```

    print("Shapes")

    print("x_train: {}\ny_train: {}".format(x_train.shape, y_train.shape))

    print("x_test: {}\ny_test: {}".format(x_test.shape, y_test.shape))

