- fmt: '### MLFlow Run – Training, UI, and Loading an MLFlow Model


    Now that you have finished defining the training and evaluation functions along
    with the metrics you want to log, it’s time to start an MLFlow run and build a
    model:


    ```

    lr = LogisticRegression(featuresCol = ''features'', labelCol = ''label'', maxIter=10)

    mlflow.set_experiment("PySpark_CreditCard")

    with mlflow.start_run():

    trainedLR = train(lr, train_set)

    evaluate(trainedLR, test_set)

    mlflow.spark.log_model(trainedLR, "creditcard_model_pyspark")

    mlflow.end_run()

    ```


