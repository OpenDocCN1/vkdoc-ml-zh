- fmt: '### Loading an MLFlow Model


    With the run ID copied, head on over to the notebook and create a new cell. Run
    the following code, but replace the run ID with yours:


    ```

    loaded_model = mlflow.keras.load_model("runs:/YOUR_RUN_ID/model")

    ```


    Your code should look similar to Figure [4-60](#499842_1_En_4_Chapter.xhtml#Fig61).
    Our run was `ba423a8f28d24b67b8f703ca6be43fc2`, so that’s what we replaced `YOUR_RUN_ID`
    with.


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig61_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig61_HTML.jpg)


    Figure 4-60


    Loading a logged model using a specific run. Notice that we are doing `mlflow.keras`.
    This is because the model is technically a Keras model.


    You’ll notice that we did `mlflow.keras` instead of `mlflow.tensorflow`. This
    is because this model is technically a Keras model, and so it conforms to the
    specific `load_model()` code in the `mlflow.keras` module.


    Run the following code to quickly calculate the same evaluation metrics that you
    logged earlier:


    ```

    eval_loss, eval_acc = loaded_model.evaluate(x_test, y_test)

    preds = loaded_model.predict(x_test)

    preds = np.round(preds)

    eval_auc = roc_auc_score(y_test, preds)

    print("Eval Loss:", eval_loss)

    print("Eval Acc:", eval_acc)

    print("Eval AUC:", eval_auc)

    ```


    This just ensures that the model is the same and demonstrates that you can use
    the model to make predictions. Refer to Figure [4-61](#499842_1_En_4_Chapter.xhtml#Fig62)
    to see the output.


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig62_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig62_HTML.jpg)


    Figure 4-61


    The output of the code block printing out the loss, accuracy, and AUC score when
    the model was evaluated on the test set. These three values match the corresponding
    values from the output of the run earlier.


    As you can see, this output matches the values from the output of the run earlier.
    Additionally, this model is also functional and can make predictions.


    And with that, you now know how to integrate MLFlow into your TensorFlow 2.0+
    experiments. Again, MLFlow supports TensorFlow 1.12+, which also contains the
    Keras submodule. This means that you should be able to follow the same convention
    to log `tf.keras` module code as long as you have TensorFlow 1.12+.


    In practice, you are likely to have functions to build and compile the model,
    functions to train the model, and functions to evaluate and perhaps even validate
    the model. Just be sure to call all of them in the block `with mlflow.start_run():`
    so that MLFlow knows all of this is happening within the same run.


    Next, let’s look at how to integrate MLFlow with PyTorch.


    ### MLFlow with PyTorch


    MLFlow also provides integration with PyTorch. While the process isn’t as easy
    as with Keras or TensorFlow, integrating MLFlow into your existing PyTorch code
    is quite simple. To see how to do so, we will be exploring a simple convolutional
    neural network applied to the MNIST dataset once again.


    Before we begin, here are the versions of the modules we are using, including
    CUDA and CuDNN:


    - **Torch** - 1.6.0

    - **Torchvision** – 0.7.0

    - **CUDA** – 10.1

    - **CuDNN** – v7.6.5.32 for CUDA 10.1

    - **Sklearn** – 0.22.2.post1

    - **MLFlow –** 1.10.0

    - **numpy –** 1.18.5


    #### Data Processing


    Let’s get started. Here’s the code to import the necessary modules, print out
    their versions, and set the device that PyTorch will use:


    ```

    import torch

    import torch.nn as nn

    from torch.utils import data

    import torchvision

    import torchvision.datasets

    import sklearn

    from sklearn.metrics import roc_auc_score, accuracy_score

    import numpy as np

    import mlflow

    import mlflow.pytorch

    device = torch.device("cuda:0" if torch.cuda.is_available() else "cpu")

    print("PyTorch: {}".format(torch.__version__))

    print("torchvision: {}".format(torchvision.__version__))

    print("sklearn: {}".format(sklearn.__version__))

    print("MLFlow: {}".format(mlflow.__version__))

    print("Numpy: {}".format(np.__version__))

    print("Device: ", device)

    ```


    Refer to Figure [4-62](#499842_1_En_4_Chapter.xhtml#Fig63) to see the output.


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig63_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig63_HTML.jpg)


    Figure 4-62


    Importing the necessary modules and printing the versions of the modules.


    The line of code


    ```

    device = torch.device("cuda:0" if torch.cuda.is_available() else "cpu")

    ```


    tells PyTorch which device to run the code on. If there is a GPU that CUDA can
    connect to, it will use that instead. Otherwise, it will run everything on the
    CPU. In our case, we have CUDA set up with our GPU, so Torch displays `"cuda:0"`
    as seen in Figure [4-62](#499842_1_En_4_Chapter.xhtml#Fig63).


    Next, you will define some basic hyperparameters:


    ```

    batch_size = 256

    num_classes = 10

    learning_rate = 0.001

    ```


    Refer to Figure [4-63](#499842_1_En_4_Chapter.xhtml#Fig64) to see them in a cell.


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig64_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig64_HTML.jpg)


    Figure 4-63


    Setting the hyperparameters relevant to the training of the model.


    Next, you will load in the MNIST dataset. Like Keras and TensorFlow, PyTorch also
    provides example datasets. In this case, you are loading MNIST:


    ```

    train_set = torchvision.datasets.MNIST(root=''./data'', train=True, download=True,
    transform=None)

    test_set = torchvision.datasets.MNIST(root=''./data'', train=False, download=True,
    transform=None)

    ```


    Refer to Figure [4-64](#499842_1_En_4_Chapter.xhtml#Fig65) to see this code in
    a cell.


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig65_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig65_HTML.jpg)


    Figure 4-64


    Defining the training and testing sets by loading the data from PyTorch.


    You will now define your `x_train`, `y_train`, `x_test`, and `y_test` datasets:


    ```

    x_train, y_train = train_set.data, train_set.targets

    x_test, y_test = test_set.data, test_set.targets

    ```


    Refer to Figure [4-65](#499842_1_En_4_Chapter.xhtml#Fig66).


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig66_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig66_HTML.jpg)


    Figure 4-65


    Creating your `x_train`, `y_train`, `x_test`, and `y_test` data sets from the
    training and testing sets.


    In PyTorch, you want the data to be channels first. In other words, the format
    of the data should be `(m, c, h, w)`, where *m* stands for the number of samples,
    *c* stands for the number of channels, *h* stands for the height of the samples,
    and *w* stands for the width of the samples.


    Notice that this is the “opposite” format of how Keras and TensorFlow do it by
    default, which is channels last. In Keras and TensorFlow, you can also do channels
    first, but you must specify that you are doing it this way.


    Let’s reshape your x-sets:


    ```

    x_train, y_train = train_set.data, train_set.targets

    x_test, y_test = test_set.data, test_set.targets

    ```


    Refer to Figure [4-66](#499842_1_En_4_Chapter.xhtml#Fig67) to see this code in
    a cell.


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig67_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig67_HTML.jpg)


    Figure 4-66


    Reshaping the x-sets so the data is encoded in a channels-first format.


    Before you print out all the shapes, note that your y-sets are not in a one-hot
    encoded format. Run the following:


    ```

    y_train[0]

    ```'
