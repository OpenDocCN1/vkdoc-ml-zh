    ### 使用 MLFlow 进行训练与评估


    现在只剩下训练和评估模型了。我们将稍后展示如何使用 MLFlow 功能进行验证，但首先，让我们定义训练和测试函数来组织代码。这也是你开始将 MLFlow 集成到代码中的地方。以下是
    `train` 函数：


    ```

    def train(sk_model, x_train, y_train):

    sk_model = sk_model.fit(x_train, y_train)

    train_acc = sk_model.score(x_train, y_train)

    mlflow.log_metric("train_acc", train_acc)

    print(f"Train Accuracy: {train_acc:.3%}")

    ```


    请参考图 4-9 查看此代码在单元格中的样子。


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig9_HTML.jpg](img/499842_1_En_4_Fig9_HTML.jpg)


    图 4-9


    定义训练函数以更好地组织代码。此外，你正在定义一个训练准确率指标，该指标将由 MLFlow 记录


    你可能已经注意到了这段新代码的第一行：


    ```

    mlflow.log_metric("train_acc", train_acc)

    ```


    你在这里专门为训练准确率创建了一个新指标，以便跟踪这个指标。此外，你告诉 MLFlow 记录这个指标，这样 MLFlow 就会在每次运行中跟踪这个值。当你记录多次运行时，你可以比较每次运行中的这个指标，从而选出例如
    AUC 分数最高的模型。


    现在让我们继续看 `evaluate` 函数：


    ```

    def evaluate(sk_model, x_test, y_test):

    eval_acc = sk_model.score(x_test, y_test)

    preds = sk_model.predict(x_test)

    auc_score = roc_auc_score(y_test, preds)

    mlflow.log_metric("eval_acc", eval_acc)

    mlflow.log_metric("auc_score", auc_score)

    print(f"Auc Score: {auc_score:.3%}")

    print(f"Eval Accuracy: {eval_acc:.3%}")

    roc_plot = plot_roc_curve(sk_model, x_test, y_test, name=''Scikit-learn ROC Curve'')

    plt.savefig("sklearn_roc_plot.png")

    plt.show()

    plt.clf()

    conf_matrix = confusion_matrix(y_test, preds)

    ax = sns.heatmap(conf_matrix, annot=True,fmt=''g'')

    ax.invert_xaxis()

    ax.invert_yaxis()

    plt.ylabel(''Actual'')

    plt.xlabel(''Predicted'')

    plt.title("Confusion Matrix")

    plt.savefig("sklearn_conf_matrix.png")

    mlflow.log_artifact("sklearn_roc_plot.png")

    mlflow.log_artifact("sklearn_conf_matrix.png")

    ```


    请参考图 4-10 查看上述代码在单元格中的样子。


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig10_HTML.jpg](img/499842_1_En_4_Fig10_HTML.jpg)


    图 4-10


    一个用于计算 AUC 分数和准确率评估指标的函数。生成混淆矩阵和 ROC 曲线的图表，并将指标和图表都记录到 MLFlow


    再次，你告诉 MLFlow 记录另外两个指标：AUC 分数和测试集上的准确率。你通过以下代码行来实现：


    ```

    mlflow.log_metric("eval_acc", eval_acc)

    mlflow.log_metric("auc_score", auc_score)

    ```


    此外，你还可以告诉 MLFlow 保存由 matplotlib 和 seaborn 生成的图表。这样，你就可以以高度组织的方式查看每次训练运行的每个图表。你必须首先保存这些图表，保存在同一目录下。然后，你必须告诉
    MLFlow 获取这些工件并记录它们，如下所示：


    ```

    mlflow.log_artifact("sklearn_roc_plot.png")

    mlflow.log_artifact("sklearn_conf_matrix.png")

    ```


    确保它们的名称与你保存的图表名称一致。


    ### 记录和查看 MLFlow 运行


    最后，让我们运行实际设置实验名称、启动 MLFlow 运行并执行所有这些代码的代码：


    ```

    sk_model = LogisticRegression(random_state=None, max_iter=400, solver=''newton-cg'')

    mlflow.set_experiment("scikit_learn_experiment")

    with mlflow.start_run():

    train(sk_model, x_train, y_train)

    evaluate(sk_model, x_test, y_test)

    mlflow.sklearn.log_model(sk_model, "log_reg_model")

    print("Model run: ", mlflow.active_run().info.run_uuid)

    mlflow.end_run()

    ```


    注意 MLFlow 代码的新行。我们将逐一介绍它们。


    首先，从设置实验名称的代码开始：


    ```

    mlflow.set_experiment("scikit_learn_experiment")

    ```


    它的作用是将运行归入你作为参数传入的任何实验名称下。如果该名称不存在，MLFlow 将创建一个该名称的新实验，并将运行放入其中。


    ```

    with mlflow.start_run():

    ...

    ...

    ```


    这行代码允许你将所有代码块组织在同一个 MLFlow 运行的上下文中。这确保了指标记录位置的一致性，并且当你打算将所有内容记录到同一次运行时，不会创建两个不同的运行。


    ```

    mlflow.sklearn.log_model(sk_model, "log_reg_model")

    ```


    这行代码是记录模型时的通用约定。参数依次是你要保存的模型，以及保存时你为模型设置的名称。在此例中，你正在将逻辑回归模型以名称 `log_reg_model`
    保存到本次运行中。


    正如你稍后将看到的，大多数其他框架在保存模型时都遵循相同的风格。有几个例外，但我们会在适当的时候介绍。在此例中，你调用的是 `mlflow.sklearn`，但如果你想记录一个
    PySpark 模型，你会使用 `mlflow.spark`。


    基本上，记录模型时，模型构建所用的框架必须与 MLFlow 的框架模块匹配。也可以在 MLFlow 中创建自定义“模型”并记录它，这在文档中有介绍。你可以使用这个自定义模型来指定你希望预测函数如何工作。例如，如果你希望在做出预测之前对数据进行更多处理，MLFlow
    允许你通过使用 MLFlow PyFunc 模块来指定这个额外功能。请参考文档，你可以在这里找到：[`www.mlflow.org/docs/latest/models.html#model-customization`](http://www.mlflow.org/docs/latest/models.html%2523model-customization)。


    ```

    print("Model run: ", mlflow.active_run().info.run_uuid)

    ```


    这行代码本质上是获取当前正在记录模型和指标的运行，并将其打印出来。如果你想直接从笔记本本身检索运行，而不是通过 UI 来操作，这会非常方便。


    ```

    mlflow.end_run()

    ```


    最后，这告诉 MLFlow 结束当前运行。如果在 MLFlow 启动运行的代码块中出现错误，导致运行没有终止，可以这样做来强制结束当前运行。基本上，它用于确保在执行完与当前运行相关的所有代码后，MLFlow
    停止该运行。


    接下来，请参考图 4-11 查看代码的完整输出。


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig11_HTML.jpg](img/499842_1_En_4_Fig11_HTML.jpg)


    图 4-11


    运行 MLFlow 实验的输出。在 MLFlow 运行上下文中，你正在训练模型，输出评估函数生成的图表，并将包括模型在内的所有指标记录到本次运行中

