    10 到 15 的平均 AUC 下降基本上可以忽略不计。那么，如果最佳值可能超过 15，而你一开始搜索的范围就不对呢？


    从这个验证实验的结果来看，你似乎还没有找到一个可以确定聚焦的明确数值范围。因此，你必须进一步扩大范围，看看能否通过更高的异常权重获得更好的结果。


    观察数据的分布情况以及正常点数量远超异常点的事实，你可以凭借直觉来指导超参数搜索，并将范围扩大得多一些。


    既然你已经了解了这一点，那就让我们尝试将范围扩大得多一些吧。

    '
- fmt: '#### Parameter Tuning – Guided Search


    The best overall performances were achieved by anomaly weights 10 and 15, but
    it seems to be on an upward trend the higher up you go with the anomaly weight.


    Now that you know this, let’s try another validation run with a broader range
    of anomaly weights to try.


    Go back to the cell (or copy-paste it into a new cell) in Figure [4-23](#499842_1_En_4_Chapter.xhtml#Fig23)
    and change the anomaly weights so that they look like the following:


    ```

    anomaly_weights = [10, 50, 100, 150, 200]

    ```


    You should see something like Figure [4-40](#499842_1_En_4_Chapter.xhtml#Fig40).


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig40_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig40_HTML.jpg)


    **Figure 4-40** – Setting a narrow range of values to search over during the second
    validation run


    The validation script itself should be the same, so if you simply replaced the
    anomaly weights in the original cell, **don’t run the validation script yet!**
    Let’s create a new experiment so that you don’t clutter the original tuning experiment
    with these new runs.


    Modify the following line in the old validation script so that it goes from


    ```

    mlflow.set_experiment("sklearn_creditcard_broad_search")

    ```


    to


    ```

    mlflow.set_experiment("sklearn_creditcard_guided_search")

    ```


    You should see something like Figure [4-41](#499842_1_En_4_Chapter.xhtml#Fig41).


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig41_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig41_HTML.jpg)


    **Figure 4-41** – Setting a new experiment called `sklearn_creditcard_guided_search`
    so that the results of this second validation experiment are stored separately


    Now you can run this code. Once it finishes, go back to the UI, refresh it, and
    select the new experiment named `sklearn_creditcard_guided_search`. You should
    see something like Figure [4-42](#499842_1_En_4_Chapter.xhtml#Fig42).


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig42_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig42_HTML.jpg)


    **Figure 4-42** – The results of the second validation experiment


    The whole point of broadening the range of anomaly weights that you are performing
    the tuning experiment on is to help you understand where the best hyperparameter
    range may lie. You did not know this initially, so you picked a range that was
    too small to help you discover the best value. Now that you do know, you have
    expanded your search range considerably.


    From the results of this experiment, you can hopefully narrow your range a lot
    more and repeat the experiment with a massively reduced range and arrive at the
    correct hyperparameter setting.


    You will now filter out each of the values by each unique anomaly weight (10,
    50, 100, 150, and 200) to get an idea of how the runs with that setting performed.


    Make sure you’re sorting AUC scores in descending order, type the following query,
    and search:


    ```

    parameters.anomaly_weight = "10"

    ```


    You should see something like Figure [4-43](#499842_1_En_4_Chapter.xhtml#Fig43).


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig43_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig43_HTML.jpg)


    **Figure 4-43** – Filtering the runs by anomaly weight of 10 and setting the AUC
    score to display in descending order


    The average AUC score as displayed by the validation script is around 0.9215.
    Of course, this is the same result as from earlier.


    Let’s see how the scores look for an anomaly weight of 50. Refer to Figure [4-44](#499842_1_En_4_Chapter.xhtml#Fig44).


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig44_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig44_HTML.jpg)


    **Figure 4-44** – Filtering the runs by an anomaly weight of 50 and setting the
    AUC score to display in descending order. It seems there’s a slight difference
    in values


    There appears to be a minute difference in the range of AUC scores already. Looking
    at the script, you can see that the average AUC is around 0.9248, so there appears
    to be a small increase in the AUC score.


    Let’s keep going and check the results for the anomaly weight of 100. Refer to
    Figure [4-45](#499842_1_En_4_Chapter.xhtml#Fig45).


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig45_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig45_HTML.jpg)


    **Figure 4-45** – Filtering the runs by an anomaly weight of 100 and setting the
    AUC score to display in descending order


    The average this time appears to be 0.9327. Despite the massive increase in weight,
    the average AUC score did not go up that high. However, notice that the first
    result with an AUC score of 0.995 has appeared. The best AUC score up until the
    anomaly weight of 50 was 0.975, but this anomaly weight setting has broken past
    that.


    Let’s keep going and see if it increases with an anomaly weight setting of 150.
    Refer to Figure [4-46A](#499842_1_En_4_Chapter.xhtml#Fig46).


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig46_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig46_HTML.jpg)


    **Figure 4-46A** – Filtering the runs by an anomaly weight of 150 and setting
    the AUC score to display in descending order


    The AUC scores overall seem to be a bit higher. Indeed, the average AUC score
    is now 0.9365, so there was an increase. Finally, let’s check the AUC scores for
    an anomaly weight setting of 200. Refer to Figure [4-46B](#499842_1_En_4_Chapter.xhtml#Fig47).


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig47_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig47_HTML.jpg)


    **Figure 4-46B** – Filtering the runs by an anomaly weight of 200 and setting
    the AUC score to display in descending order


    The new average AUC now is 0.9396, so this anomaly weight setting seems even better.


    In fact, you still weren’t able to come to a conclusion about an optimal range,
    since the AUC scores keep increasing as you set higher anomaly weights.


    So, from this, you know that the best hyperparameter setting is somewhere above
    200. You simply shift the range of the scope to start at 200 and search over a
    slightly different area, and once you have found a good range of values to search
    over (eventually the AUC scores will start trending down as you increase the anomaly
    weight), you can narrow the focus and start searching again.


    After a certain amount of precision with the parameter value, you start to see
    diminishing returns where the added effort only produces negligible improvements
    in performance, but you will likely encounter this as you start getting deeper
    into the decimal values.


    Hopefully now you understand more about how you can integrate MLFlow into the
    model training, testing, and validation pipeline using scikit-learn. You also
    looked at how to use the UI for basic comparisons, along with how you might perform
    hyperparameter tuning more easily using MLFlow.


    A quick note to make is that if you’d like to perform more complicated searches
    over multiple metrics or parameters, MLFlow provides functionality through the
    API to let you do so via SQL searches within the code, letting you order by multiple
    columns, for example.


    MLFlow also provides support for logging metrics, parameters, artifacts, and even
    models for other frameworks in their documentation. We will now take a look at
    how to integrate MLFlow with TensorFlow 2.0+/Keras, PyTorch, and PySpark.


    ## MLFlow and Other Frameworks'
