  raw: '### Training and Evaluating with MLFlow


    All that is left now is to train and evaluate your model. We will showcase validation
    with MLFlow functionality in a bit, but first let’s define the train and test
    functions to organize the code. This is also where you start integrating MLFlow
    into your code. Here is the `train` function:


    ```

    def train(sk_model, x_train, y_train):

    sk_model = sk_model.fit(x_train, y_train)

    train_acc = sk_model.score(x_train, y_train)

    mlflow.log_metric("train_acc", train_acc)

    print(f"Train Accuracy: {train_acc:.3%}")

    ```


    Refer to Figure [4-9](#499842_1_En_4_Chapter.xhtml#Fig9) to see this code in a
    cell.


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig9_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig9_HTML.jpg)


    Figure 4-9


    Defining the train function to better organize the code. Additionally, you are
    defining a training accuracy metric that will be logged by MLFlow


    You may have noticed the first of the new code with this line:


    ```

    mlflow.log_metric("train_acc", train_acc)

    ```


    You create a new metric here specifically for the training accuracy so that you
    can keep track of this metric. Furthermore, you are telling MLFlow to log this
    metric, so that MLFlow will keep track of this value in each run. When you log
    multiple runs, you can compare this metric across each of those runs so that you
    can pick a model with the best AUC score for example.


    Let’s now move on to the `evaluate` function :


    ```

    def evaluate(sk_model, x_test, y_test):

    eval_acc = sk_model.score(x_test, y_test)

    preds = sk_model.predict(x_test)

    auc_score = roc_auc_score(y_test, preds)

    mlflow.log_metric("eval_acc", eval_acc)

    mlflow.log_metric("auc_score", auc_score)

    print(f"Auc Score: {auc_score:.3%}")

    print(f"Eval Accuracy: {eval_acc:.3%}")

    roc_plot = plot_roc_curve(sk_model, x_test, y_test, name=''Scikit-learn ROC Curve'')

    plt.savefig("sklearn_roc_plot.png")

    plt.show()

    plt.clf()

    conf_matrix = confusion_matrix(y_test, preds)

    ax = sns.heatmap(conf_matrix, annot=True,fmt=''g'')

    ax.invert_xaxis()

    ax.invert_yaxis()

    plt.ylabel(''Actual'')

    plt.xlabel(''Predicted'')

    plt.title("Confusion Matrix")

    plt.savefig("sklearn_conf_matrix.png")

    mlflow.log_artifact("sklearn_roc_plot.png")

    mlflow.log_artifact("sklearn_conf_matrix.png")

    ```


    Refer to Figure [4-10](#499842_1_En_4_Chapter.xhtml#Fig10) to see the above code
    in a cell.


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig10_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig10_HTML.jpg)


    Figure 4-10


    A function to calculate the evaluation metrics for the AUC score and accuracy.
    Plots for the confusion matrix and the ROC curve are generated, and both the metrics
    and the graphs are logged to MLFlow


    Once again, you have told MLFlow to log two more metrics: the AUC score and the
    accuracy on the test set. You do so with these lines of code:


    ```

    mlflow.log_metric("eval_acc", eval_acc)

    mlflow.log_metric("auc_score", auc_score)

    ```


    Furthermore, you can also tell MLFlow to save the plots generated by matplotlib
    and by seaborn. With this, you can look at each of the graphs for each training
    run and do so in a highly organized manner. You must first save these plots, which
    you do in the same directory. Then, you must tell MLFlow to grab the artifacts
    to log them like so:


    ```

    mlflow.log_artifact("sklearn_roc_plot.png")

    mlflow.log_artifact("sklearn_conf_matrix.png")

    ```


    Make sure that they have the same names as the graphs you saved.


    ### Logging and Viewing MLFlow Runs


    Finally, let’s run the code that actually sets the experiment name, starts the
    MLFlow run, and executes all this code:


    ```

    sk_model = LogisticRegression(random_state=None, max_iter=400, solver=''newton-cg'')

    mlflow.set_experiment("scikit_learn_experiment")

    with mlflow.start_run():

    train(sk_model, x_train, y_train)

    evaluate(sk_model, x_test, y_test)

    mlflow.sklearn.log_model(sk_model, "log_reg_model")

    print("Model run: ", mlflow.active_run().info.run_uuid)

    mlflow.end_run()

    ```


    Notice the new lines of MLFlow code. We will go through them one by one.


    First, let’s begin with what appears to set the experiment name:


    ```

    mlflow.set_experiment("scikit_learn_experiment")

    ```


    What this does is that it puts the run under whatever experiment name you pass
    in as a parameter. If that name does not exist, MLFlow will create a new one under
    that name and put the run there.


    ```

    with mlflow.start_run():

    ...

    ...

    ```


    This line of code allows you to chunk all of your code under the context of one
    MLFlow run. This ensures that there are no discrepancies between where your metrics
    are being logged, and that it doesn’t create two different runs when you mean
    it to log everything for the same run.


    ```

    mlflow.sklearn.log_model(sk_model, "log_reg_model")

    ```


    This line of code is the general convention to use when you’re logging a model.
    The parameters, in order, are the model you’re saving and then the name you’re
    setting for the model when saving. In this case, you are saving your logistic
    regression model with the name `log_reg_model` in this run.


    As you will see later, most other frameworks follow the same style when saving
    the model. There are a couple exceptions, but we will cover this when the time
    comes. In this case, you are calling `mlflow.sklearn`, but if you wanted to log
    a PySpark model, you would do `mlflow.spark`.


    Basically, the framework the model was built in must match the framework module
    of MLFlow when logging the model. It is possible to create a custom “model” in
    MLFlow and log this as well, something that is covered in the documentation. You
    can use this custom model to then specify how you want the prediction function
    to work. If you’d like to process the data some more before making predictions,
    for example, MLFlow allows you to specify this extra functionality through the
    use of the MLFlow PyFunc module. Refer to the documentation, which you can find
    here: [`www.mlflow.org/docs/latest/models.html#model-customization`](http://www.mlflow.org/docs/latest/models.html%2523model-customization).


    ```

    print("Model run: ", mlflow.active_run().info.run_uuid)

    ```


    This line of code essentially gets the current run that the model and metrics
    are being logged to and prints it out. This makes it handy if you want to retrieve
    the run directly from the notebook itself instead of going to the UI to do so.


    ```

    mlflow.end_run()

    ```


    Finally, this tells MLFlow to end the current run. In cases where there is an
    error in the MLFlow start run code block, and the run does not terminate, do this
    to forcibly end the current run. Basically, it is there to ensure that MLFlow
    stops the run after you executed all the code relevant to the current run.


    Moving on, refer to Figure [4-11](#499842_1_En_4_Chapter.xhtml#Fig11) to see the
    full output of the code.


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig11_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig11_HTML.jpg)


    Figure 4-11


    The output of running the MLFlow experiment. Under an MLFlow run context, you
    are training the model, outputting the graphs from the evaluation function, and
    logging all the metrics including the model to this run'
