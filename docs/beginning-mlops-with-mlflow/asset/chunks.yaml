    # Summary


    Google Cloud is a cloud platform that provides many advanced services for a wide
    range of users. While MLFlow does not explicitly provide support for deployment
    for Google Cloud, you are still able to operationalize your models using MLFlow’s
    model serving functionality and Google Cloud’s compute engine to serve the models
    on the cloud.


    In this chapter, you learned how to set up Google Cloud so that it can deploy
    your models on a virtual machine. In particular, you looked at how you can push
    your MLFlow runs to a bucket, how you can set up the Conda environment on a virtual
    machine, how you can set up a firewall to allow your model to be accessed in order
