    现在，让我们开始为整个数据框绘制按 `Class` 分组的 `Amount` 值：


    ```

    plt.scatter(df.Amount, df.Class)

    plt.title("Transaction Amounts by Class")

    plt.ylabel("Class")

    plt.yticks(range(2), ["Normal", "Anomaly"])

    plt.xlabel("Transaction Amounts ($)")

    plt.show()

    ```


    请参考图 1-13。


