  raw: '#### Batch Querying


    Unfortunately, there is a limit to how many data samples you can ask the model
    to make predictions on. The number 80 is really close to the maximum number of
    samples you can send at one time. So how do you get around this issue and make
    predictions on more than just 80 samples? For one, you can try batching the samples
    and making predictions one batch at a time.


    Run the following code:


    ```

    test = df.iloc[:8000]

    true = test.Class

    test = scaler.transform(test.drop(["Time", "Class"], axis=1))

    preds = []

    batch_size = 80

    for f in range(100):

    sample = pd.DataFrame(test[f*batch_size:(f+1)*batch_size]).to_json(orient="split")

    proc = subprocess.run(["curl",  "-X", "POST", "-H",

    "Content-Type:application/json; format=pandas-split", "--data",

    sample, "http://127.0.0.1:1235/invocations"],

    stdout=subprocess.PIPE, encoding=''utf-8'')

    output = proc.stdout

    resp = pd.DataFrame([json.loads(output)])

    preds = np.concatenate((preds, resp.values[0]))

    eval_acc = accuracy_score(true, preds)

    eval_auc = roc_auc_score(true, preds)

    print("Eval Acc", eval_acc)

    print("Eval AUC", eval_auc)

    ```


    Here, you are selecting the first 8,000 samples from the data frame. Since the
    batch size is 80, you have 100 batches that you are passing to the model. Of course,
    you must scale this data as well before passing it in. You will scale it in a
    manner similar to how you did it earlier: you will fit the scaler on the same
    normal and anomaly data that you used in the model training pipeline samples to
    transform the values you want to send to the model. Once finished, you should
    see something like Figure [4-113](#499842_1_En_4_Chapter.xhtml#Fig114). This might
    take several seconds to finish, so sit tight!


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig114_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig114_HTML.jpg)


    Figure 4-113


    The results of querying the model with the first 8,000 samples in the data frame.
    Notice that the AUC score is far better samples


    This time, you don’t have to worry about only having one class in the entire data.
    This is because there are examples of anomalies in this selection of 8,000 data
    points, so the true labels and predictions should contain samples of both classes.


    You can see that the model performs quite well on this data, which includes data
    that the model has never seen before. Although you did end up using all of the
    anomalies when training the data, the model still performs well on the normal
    data, as evidenced by the relatively high AUC score.


