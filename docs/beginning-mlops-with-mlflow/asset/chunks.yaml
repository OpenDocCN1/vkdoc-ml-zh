    Figure 1-29


    Looking at the scatterplot for Amount on the y-axis and V10 on the x-axis, you
    can see a pronounced deviation of fraudulent points from the normal points. For
    the relationship of the V columns against Amount, it seems that more columns show
    an increased deviation compared to the earlier plots. This difference is not so
    large, as you still see that a sizeable portion of the anomalies are within the
    normal data cluster. However, this still gives the model some context in how a
    fraudulent transaction differs from a normal transaction


    The graphs from `V9` through `V12` all show a clear differentiation between the
    anomalies and the normal points, even if a good portion of the anomalies are within
    the cluster of normal points. One thing to note is that it may not be the same
