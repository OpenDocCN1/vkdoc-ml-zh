    生成的混淆矩阵如图[2-19](#499842_1_En_2_Chapter.xhtml#Fig19)所示。


    ![../images/499842_1_En_2_Chapter/499842_1_En_2_Fig19_HTML.jpg](images/499842_1_En_2_Chapter/499842_1_En_2_Fig19_HTML.jpg)


    图2-19


    特定验证折的混淆矩阵。它在标记正常数据点方面具有很高的准确性，并且在处理异常点方面也做得很好。此外，如果你计算顶行的条目，可以看到此验证折中几乎没有异常：21个异常点对5,685个正常点。因此，对异常赋予更高的权重有助于模型在学习过程中考虑这些异常，从而在异常检测中取得更好的性能。


    模型在对异常进行分类方面做得相当好，但此处的验证目标只是帮助将超参数设置推向正确的方向。基于验证过程的结果，你知道最佳超参数值位于10和15之间，因为这两个设置产生了最佳结果。


    当然，你可以进一步缩小范围，将异常权重的值包括在10到15之间，并重复此过程，不断缩小范围，直到找到一个良好的最佳值。然而，超过一定精度后，你会发现收益递减，并且你投入超参数调优的努力只会带来近乎可以忽略的性能提升。


    至此，你现在知道了如何在`scikit-learn`中训练、评估和验证逻辑回归模型。


    ## PySpark


    我们提供了将要使用的模块版本。安装PySpark可能有点复杂，因为它不仅仅是执行`pip install PySpark`，具体取决于版本，所以请注意这一点。


    以下是我们配置的版本：


    *   Python 3.6.5

    *   PySpark 3.0.0

    *   matplotlib 3.2.1

    *   seaborn 0.10.1

    *   sklearn 0.22.1.post1


    那么，让我们开始吧。再次强调，我们不会提供像`scikit-learn`示例中那样详细的注释，所以请务必回顾`scikit-learn`中的整个过程，以了解其大致流程。此外，在此示例中，我们不会在PySpark中验证模型。'
  raw: 'The second loop goes over the five fold boundaries that the `KFold()` object
    defines. You set the `class_weights` dictionary and pass it into the model as
    a hyperparameter. After the training process, you evaluate as usual. There is
    a try-except block for the AUC score in the event that the fold generated only
    has values of one class (so really if it only has normal data and no anomalies).
    If the AUC score is -1 for any fold, then you know there was a problem with one
    of the folds.


    You do save the model, the validation data, and the predictions so that you can
    examine the confusion matrix and plot the ROC curve for any run you like. After
    the end of the five folds, the script then displays averages and the best scores.


    The output will be truncated when you run this, so don’t forget to expand it like
    in the previous chapter to look at all of the runs. Feel free to explore the output
    or even change the number of folds but beware of the results because increasing
    the number of folds can mean that the number of anomalies must be spread across
    even more partitions. In this specific context, a lower number of folds is likely
    to be better because you have so few anomaly points.


    When you sift through the output, you can see that the best results occur when
    the anomaly weight is set to 10\. This setting had the highest average AUC score
    and had the best AUC score as well, resulting in an output like what you see in
    Figure [2-17](#499842_1_En_2_Chapter.xhtml#Fig17).


    ![../images/499842_1_En_2_Chapter/499842_1_En_2_Fig17_HTML.jpg](images/499842_1_En_2_Chapter/499842_1_En_2_Fig17_HTML.jpg)


    Figure 2-17


    Looking at the results of the best setup in the validation script output. The
    best setup turned out to be one where the anomalies were weighted as 10, as it
    had the best average AUC score and the best AUC score with the other anomaly weight
    parameters. The true best weight is likely around an anomaly weight of 10, though
    you must perform another hyperparemter search with a more narrowed range to find
    the absolute best setting. You can keep narrowing the search as much as you’d
    like, but past a certain precision, you will find that you are getting diminishing
    returns


    Let’s examine the plots for this setup since it was the best performer of all
    of them on average.


    First, you load the correct log in the list of logs. Since the anomaly weight
    was 10, and the second fold performed the best, you want to look at the twelfth
    index in the entries in logs. (The first five correspond to indices 0-4, and the
