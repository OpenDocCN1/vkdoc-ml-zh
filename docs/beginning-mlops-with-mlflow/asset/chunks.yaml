    ### MLFlow with PySpark


    In our final example, we will look at how MLFlow integrates with PySpark. Like
    in the scikit-learn example, we will be looking at the application of a logistic
    regression model to the credit card dataset. In fact, this code is very similar
    to the PySpark example from Chapter [2](#499842_1_En_2_Chapter.xhtml).


    Before we begin, here are the versions of the modules we are using, including
    CUDA and CuDNN:


    *   **PySpark** – 2.4.5

