    The output of the first sample in the y_train set. Note that the numbers are not
    in a one-hot encoded format


    Notice that this outputs a number, not a vector. You must convert your y-sets
    into a one-hot encoded format. However, there isn’t a handy function like `keras.utils.to_categorical()`
    you can just call, so you will define one:


    ```

    def to_one_hot(num_classes, labels):

    one_hot = torch.zeros(([labels.shape[0], num_classes]))

    for f in range(len(labels)):

    one_hot[f][labels[f]] = 1

    return one_hot

    ```


    That being said, you can always call `keras.utils.to_categorical()`: and type-cast
    the resulting output to a PyTorch tensor.


    Refer to Figure [4-68](#499842_1_En_4_Chapter.xhtml#Fig69) to see this in a cell.


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig69_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig69_HTML.jpg)


    Figure 4-68


    A custom function that converts the input called “labels,” given the number of
    classes, into a one-hot encoded format and returns it


    Now let’s convert your y-sets to be in a one-hot encoded format:


    ```

    y_train = to_one_hot(num_classes, y_train)

    y_test = to_one_hot(num_classes, y_test)

    ```


    Refer to Figure [4-69](#499842_1_En_4_Chapter.xhtml#Fig70) to see this code in
    a cell.


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig70_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig70_HTML.jpg)


