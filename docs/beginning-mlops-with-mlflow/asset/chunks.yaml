  trans: '

    #### 对设置的反思


    你马上就能注意到这种实现方式可能引发的一些问题。首先需要意识到的是，整个实验阶段都是手动的，这意味着数据科学家和机器学习工程师每次都必须重复这些步骤。当模型不断接触到很可能未被原始训练集捕获的新数据时，模型必须频繁地重新训练，以便始终跟上用户数据的最新趋势。不幸的是，当分析新趋势、训练、测试和验证数据的整个过程都是手动时，随着时间的推移，这可能需要大量的资源，对于没有多余资源的公司来说，这可能会变得不可行。此外，数据趋势会随时间变化。例如，登录网站用户数量最多的年龄段可能是二十岁出头的人群。一年后，主导年龄段可能变成了青少年。过去正常的情况现在不再正常，这可能会导致广告收入损失，例如，如果本案例中的模型提供的服务是定向广告的话。


    另一个问题是，像 Jupyter notebook 这样的工具在机器学习和深度学习模型的原型设计和实验阶段非常流行。即使实验不是在 notebook 上进行的，也可能需要做一些工作才能将模型推送到源代码仓库。例如，为模型类构建一些重要的函数，如
    `load_weights`、`predict` 和 `evaluate`，对于模型类来说是理想的。一些外部代码可能会调用 `load_weights()`
    来从不同的训练实例中设置模型权重（因此，如果模型经过进一步训练和更新，只需调用此函数即可获取新模型）。然后会调用 `predict()` 函数根据一些输入数据进行预测，并提供应用程序所需的服务，而
    `evaluate()` 函数则有助于跟踪性能指标。实时数据几乎永远不会带有真实标签（除非用户提供即时反馈，比如谷歌验证码中让你选择正确图片），因此，在跟踪性能时，像均方根误差这样的评分指标会很有用。


    一旦模型类完成并推送，软件工程团队必须将模型类集成到整个应用程序/系统中。第一次这样做可能会很困难，但一旦集成完成，更新模型就可以简单到加载新的权重。不幸的是，模型架构可能会发生变化，因此软件团队必须将新的模型类重新集成到应用程序中。


    此外，深度学习是一个复杂且快速发展的领域。几年前最先进的模型可能被当前最先进的模型远远超越，因此不断更新模型架构并充分利用该领域的新发展非常重要。这意味着团队必须持续重复模型构建过程，以跟上该领域的发展。


    希望现在更清楚了：这种实现方式存在很大缺陷，不仅在于最初创建和部署模型需要大量工作，还在于持续维护和使其保持最佳状态也需要大量工作。


    好了，那么我们该如何改进它呢？MLOps 在这里又扮演什么角色？为了回答这些问题，让我们看看前面定义的三种设置中的第二种。


    ### 持续模型交付


    这种设置包含用于自动训练已部署模型以及加速实验过程的**流水线**。请参考图 3-3 查看此设置的图形表示。


    ![../images/499842_1_En_3_Chapter/499842_1_En_3_Fig3_HTML.jpg](img/499842_1_En_3_Fig3_HTML.jpg)


    图 3-3


    描述通过流水线实现自动化的机器学习模型可能部署设置的图表


    这信息量很大，让我们分解一下，并按照图表上的编号来理解。


    1.  **特征存储：** 这是一个数据存储库，取代了之前示例中的数据存储。这样做的原因是，所有数据现在都可以标准化为一个通用定义，所有流程都可以在此实例中使用。例如，实验阶段的流程将使用与已部署训练流水线相同的输入数据，因为所有数据都遵循相同的定义。**通用定义**的含义是，原始数据以一种适用于所有相关原始数据的过程化方式进行清洗和处理。这些处理后的特征随后被保存在特征存储中，供流水线提取，并且确保每个流水线都使用根据此标准处理的特征。这样，两个不同流水线之间感知到的任何趋势差异都不会归因于处理流程的偏差。


    假设你正在尝试提供一个目标检测服务，用于检测和识别国家公园中的各种动物。来自步道摄像头的所有视频源（视频可以看作是一系列帧）可以作为原始数据存储，但不同的步道摄像头可能有不同的分辨率。与其重复相同的数据处理过程，你可以简单地将相同的过程（例如，对帧进行归一化、缩放和批处理）应用于原始视频，并存储你知道所有流水线都会使用的特征。


    2.  **数据分析：** 在此步骤中，仍然会进行数据分析，让数据科学家和机器学习工程师了解数据的样子、分布情况等，就像手动设置中一样。同样，此步骤可以决定是继续构建新模型还是仅更新当前模型。


    3.  **自动化模型构建与分析：** 在此步骤中，数据科学家和机器学习工程师可以选择一个模型，设置任何特定的超参数，然后让流水线自动化整个流程。流水线将根据此模型的规格自动处理数据（例如，特征是
    331x331x3 的图像，但特定模型只接受 224x224x3 的图像），构建模型，训练它，评估它并验证它。在验证期间，流水线可能会自动调整超参数以优化性能。在某些情况下可能需要人工干预（例如，当模型特别庞大复杂，或者模型具有新颖架构时进行调试），但自动化应该负责生成最优模型。一旦完成，模块化代码会自动创建，以便此流水线可以轻松部署。


    此阶段的一切设置都是为了实验阶段能够非常顺利地进行，只需要构建模型即可。根据实现的自动化程度，也许只需要选择模型架构并指定一些超参数，自动化就会处理其余部分。无论哪种方式，实验阶段的开发过程都大大加快了。随着这个阶段速度加快，也可以进行更多的实验，从而可能提高整体效率，因为生产力提高了，并且可以更快地找到最优解决方案。

    '
- fmt: "4. **Modularized code:** The experimental stage is set up so that the pipeline\
    \ and its components are modularized. In this specific context, the data scientist/machine\
    \ learning engineer defines and builds some model, and the data is standardized\
    \ to some definition. Basically, the pipeline should be able to accept any constructed\
    \ model and perform the corresponding steps given some data without hardcoding\
    \ anything. (Meaning there isn’t any code that will only work for a specific model\
    \ and specific data. The code works with generalized cases of models and data.)\n\
    \nThis is **modularization**, when the whole system is divided into individual\
    \ components that each have their own function, and these components can be switched\
    \ out depending on variable inputs. Thanks to the modularized code, when the pipeline\
    \ is deployed, it will be able to accept any new feature data as needed in order\
    \ to update the deployed model. Furthermore, this structure also lets it swap\
    \ out models as needed, so there’s no need to construct the entire pipeline for\
    \ every new model architecture.\n\nThink of it this way: the pipeline is a puzzle\
    \ piece, and the models along with their feature data are various puzzle pieces\
    \ that can all fit within the pipeline. They all have their own “image” on the\
    \ piece and the other sides can have variable shapes, but what is important is\
    \ that they fit with the pipeline and can easily be swapped out for others.\n\n\
    5. **Deploy pipeline:** In this step, the pipeline is manually deployed and is\
    \ retrieved from the source code. Thanks to its modularization, the pipeline setup\
    \ is able to operate independently and automatically train the deployed model\
    \ on any new data if needed, and the application is built around the code structure\
    \ of the pipeline so all components will work with each other correspondingly.\
    \ The engineering team has to build parts of the application around the pipeline\
    \ and its modularized components the first time around, but after that, the pipelines\
    \ should work seamlessly with the applications so as long as the structure remains\
    \ the same. Models are simply swapped, unlike before when the model had to be\
    \ manually integrated into the application. This time, the pipeline must be integrated\
    \ into the application, and the models are simply swapped out.\n\nHowever, it\
    \ is important to mention that pipeline structures can change depending on the\
    \ model. The main takeaway here is that pipelines should be able to handle many\
    \ more models before having to be restructured compared to the setup before where\
    \ “swapping” models meant you only loaded updated weights. Now, if several architectures\
    \ all have common training, testing, and validation code, they can all be used\
    \ under the same pipeline.\n\n6. **Automated training pipeline:** This pipeline\
    \ contains the model that provides its services and is set up to automatically\
    \ fetch new features upon activation of the trigger. The conditions for trigger\
    \ activation will be discussed in item 10. When the pipeline finishes updating\
    \ a trained model, the model is saved to a model registry, a type of storage unit\
    \ that holds trained models for ease of access.\n\n7. **Model registry:** This\
    \ is a storage unit that specifically holds model classes and/or weights. The\
    \ purpose of this unit is to hold trained models for easy retrieval by an application,\
    \ for example, and it is a good component to add to an automation setup. Without\
    \ the model registry, the model classes and weights would just be saved to whatever\
    \ source code repository is established, but this way, we make the process simpler\
    \ by providing a centralized area of storage for these models. It also serves\
    \ to bridge the gap between model development teams, software development teams,\
    \ and operational teams since it is accessible by everyone, which is ultimately\
    \ what we want in an ideal automation setup.\n\nThis registry along with the automated\
    \ training pipeline assures **continuous delivery of model services** since models\
    \ can frequently be updated, pushed to this registry, and deployed without having\
    \ to go through the entire experimental stage.\n\n8. **Model services:** Here\
    \ the application pulls the latest, best performing model from the model registry\
    \ and makes use of its prediction services. This action then goes on to provide\
    \ the desired functionality in the application.\n\n9. **Performance and user data\
    \ collection:** New data is collected as usual along with performance metrics\
    \ related to the model. This data goes to the feature store, where the new data\
    \ is processed and standardized so that it can be used in both the experimental\
    \ stage and the deployment stage and there are no discrepancies between the data\
    \ used by either stage. Performance data is stored so that data scientists can\
    \ tell how the model is performing once deployed. Based on that data, important\
    \ decisions such as whether or not to build a new model with a new architecture\
    \ can be made.\n\n10. **Training pipeline trigger:** This trigger, upon activation,\
    \ initiates the automated training pipeline for the deployed model and allows\
    \ for feature retrieval by the pipeline from the feature store. The trigger can\
    \ have any of the following conditions, although it is not limited to them:\n\
    \    * **Manual trigger:** Perhaps the model is to be trained only if the process\
    \ is manually initiated. For example, data science teams can choose to start this\
    \ process after reviewing performance and data and concluding that the deployed\
    \ model needs to train on fresh batches of data.\n    * **Scheduled training:**\
    \ Perhaps the model is set to train on a specific schedule. This can be a certain\
    \ time on the weekend, every night during hours of lowest traffic, every month,\
    \ and so on.\n    * **Performance issues:** Perhaps performance data indicates\
    \ that the model’s performance has dipped below a certain benchmark. This can\
    \ automatically activate the training process to attempt to get the performance\
    \ back up to par. If this is not possible or is taking too many resources, data\
    \ scientists and machine learning engineers can choose to build and deploy a new\
    \ model.\n    * **Changes in data patterns:** Perhaps changes in the trends of\
    \ the data have been noticed while creating the features in the feature store.\
    \ Of course, the feature store isn’t the only possible place that can analyze\
    \ data and identify any new trends or changes in the data. There can be a separate\
    \ process/program dedicated to this task, which can decide whether or not to activate\
    \ the trigger.\n\nThis would also be a good condition to begin the training process,\
    \ since the new trends in the data are likely to lead to performance degradation.\
    \ Instead of waiting for the performance hit to activate the trigger, the model\
    \ can begin training on new data immediately upon sufficient detection of such\
    \ changes in the data, allowing for the company to minimize any potential losses\
    \ from such a scenario."
  raw: "4.  **Modularized code:** The experimental stage is set up so that the pipeline\
    \ and its components are modularized. In this specific context, the data scientist/machine\
    \ learning engineer defines and builds some model, and the data is standardized\
    \ to some definition. Basically, the pipeline should be able to accept any constructed\
    \ model and perform the corresponding steps given some data without hardcoding\
    \ anything. (Meaning there isn’t any code that will only work for a specific model\
    \ and specific data. The code works with generalized cases of models and data.)\n\
    \nThis is **modularization** , when the whole system is divided into individual\
    \ components that each have their own function, and these components can be switched\
    \ out depending on variable inputs. Thanks to the modularized code, when the pipeline\
    \ is deployed, it will be able to accept any new feature data as needed in order\
    \ to update the deployed model. Furthermore, this structure also lets it swap\
    \ out models as needed, so there’s no need to construct the entire pipeline for\
    \ every new model architecture.\n\nThink of it this way: the pipeline is a puzzle\
    \ piece, and the models along with their feature data are various puzzle pieces\
    \ that can all fit within the pipeline. They all have their own “image” on the\
    \ piece and the other sides can have variable shapes, but what is important is\
    \ that they fit with the pipeline and can easily be swapped out for others.\n\n\
    5.  **Deploy pipeline:** In this step, the pipeline is manually deployed and is\
    \ retrieved from the source code. Thanks to its modularization, the pipeline setup\
    \ is able to operate independently and automatically train the deployed model\
    \ on any new data if needed, and the application is built around the code structure\
    \ of the pipeline so all components will work with each other correspondingly.\
    \ The engineering team has to build parts of the application around the pipeline\
    \ and its modularized components the first time around, but after that, the pipelines\
    \ should work seamlessly with the applications so as long as the structure remains\
    \ the same. Models are simply swapped, unlike before when the model had to be\
    \ manually integrated into the application. This time, the pipeline must be integrated\
    \ into the application, and the models are simply swapped out.\n\nHowever, it\
    \ is important to mention that pipeline structures can change depending on the\
    \ model. The main takeaway here is that pipelines should be able to handle many\
    \ more models before having to be restructured compared to the setup before where\
    \ “swapping” models meant you only loaded updated weights. Now, if several architectures\
    \ all have common training, testing, and validation code, they can all be used\
    \ under the same pipeline.\n\n6.  **Automated training pipeline:** This pipeline\
    \ contains the model that provides its services and is set up to automatically\
    \ fetch new features upon activation of the trigger. The conditions for trigger\
    \ activation will be discussed in item 10\\. When the pipeline finishes updating\
    \ a trained model, the model is saved to a model registry, a type of storage unit\
    \ that holds trained models for ease of access.\n\n7.  **Model registry:** This\
    \ is a storage unit that specifically holds model classes and/or weights. The\
    \ purpose of this unit is to hold trained models for easy retrieval by an application,\
    \ for example, and it is a good component to add to an automation setup. Without\
    \ the model registry, the model classes and weights would just be saved to whatever\
    \ source code repository is established, but this way, we make the process simpler\
    \ by providing a centralized area of storage for these models. It also serves\
    \ to bridge the gap between model development teams, software development teams,\
    \ and operational teams since it is accessible by everyone, which is ultimately\
    \ what we want in an ideal automation setup.\n\nThis registry along with the automated\
    \ training pipeline assures **continuous delivery of model services** since models\
    \ can frequently be updated, pushed to this registry, and deployed without having\
    \ to go through the entire experimental stage.\n\n8.  **Model services:** Here\
    \ the application pulls the latest, best performing model from the model registry\
    \ and makes use of its prediction services. This action then goes on to provide\
    \ the desired functionality in the application.\n\n9.  **Performance and user\
    \ data collection:** New data is collected as usual along with performance metrics\
    \ related to the model. This data goes to the feature store, where the new data\
    \ is processed and standardized so that it can be used in both the experimental\
    \ stage and the deployment stage and there are no discrepancies between the data\
    \ used by either stage. Performance data is stored so that data scientists can\
    \ tell how the model is performing once deployed. Based on that data, important\
    \ decisions such as whether or not to build a new model with a new architecture\
    \ can be made.\n\n10.  **Training pipeline trigger:** This trigger, upon activation,\
    \ initiates the automated training pipeline for the deployed model and allows\
    \ for feature retrieval by the pipeline from the feature store. The trigger can\
    \ have any of the following conditions, although it is not limited to them:\n\
    \    *   **Manual trigger:** Perhaps the model is to be trained only if the process\
    \ is manually initiated. For example, data science teams can choose to start this\
    \ process after reviewing performance and data and concluding that the deployed\
    \ model needs to train on fresh batches of data.\n\n*   **Scheduled training:**\
    \ Perhaps the model is set to train on a specific schedule. This can be a certain\
    \ time on the weekend, every night during hours of lowest traffic, every month,\
    \ and so on.\n\n*   **Performance issues:** Perhaps performance data indicates\
    \ that the model’s performance has dipped below a certain benchmark. This can\
    \ automatically activate the training process to attempt to get the performance\
    \ back up to par. If this is not possible or is taking too many resources, data\
    \ scientists and machine learning engineers can choose to build and deploy a new\
    \ model.\n\n*   **Changes in** **data patterns:** Perhaps changes in the trends\
    \ of the data have been noticed while creating the features in the feature store.\
    \ Of course, the feature store isn’t the only possible place that can analyze\
    \ data and identify any new trends or changes in the data. There can be a separate\
    \ process/program dedicated to this task, which can decide whether or not to activate\
    \ the trigger.\n\nThis would also be a good condition to begin the training process,\
    \ since the new trends in the data are likely to lead to performance degradation.\
    \ Instead of waiting for the performance hit to activate the trigger, the model\
    \ can begin training on new data immediately upon sufficient detection of such\
    \ changes in the data, allowing for the company to minimize any potential losses\
    \ from such a scenario."
  trans: "\n4.  **模块化代码：** 实验阶段的设置使得流水线及其组件实现模块化。在此特定情境下，数据科学家/机器学习工程师定义并构建某些模型，数据则按照某种定义进行标准化。基本上，流水线应能接受任何构建好的模型，并在给定数据的情况下执行相应步骤，而无需硬编码任何内容。（这意味着不存在任何仅适用于特定模型和特定数据的代码。该代码适用于模型和数据的通用情况。）\n\
    \n这就是**模块化**，即整个系统被划分为各自拥有独立功能的单个组件，并且这些组件可以根据不同的输入变量进行替换。得益于模块化代码，当流水线部署后，它能够根据需要接受任何新的特征数据，以便更新已部署的模型。此外，这种结构还允许它根据需要替换模型，因此无需为每一种新的模型架构重新构建整个流水线。\n\
    \n可以这样理解：流水线是一个拼图块，而模型及其特征数据是各种不同的拼图块，它们都能嵌入到流水线中。每个拼图块上都有自己的“图像”，其他边可能有不同的形状，但重要的是它们能与流水线契合，并且可以轻松地替换为其他拼图块。\n\
    \n5.  **部署流水线：** 在此步骤中，流水线被手动部署并从源代码中获取。得益于其模块化，流水线设置能够独立运行，并在需要时自动使用任何新数据训练已部署的模型。应用程序是围绕流水线的代码结构构建的，因此所有组件都能相互协同工作。工程团队在首次部署时需要围绕流水线及其模块化组件构建部分应用程序，但此后，只要结构保持不变，流水线就应与应用程序无缝协作。模型只需被简单替换，而不像以前那样需要手动将模型集成到应用程序中。这一次，流水线必须集成到应用程序中，而模型则被简单替换。\n\
    \n然而，需要指出的是，流水线结构可能会根据模型的不同而改变。这里的主要要点是，与之前“替换”模型仅意味着加载更新权重的设置相比，流水线在需要重构之前应能处理更多的模型。现在，如果多个架构都拥有共同的训练、测试和验证代码，它们都可以在同一个流水线下使用。\n\
    \n6.  **自动化训练流水线：** 此流水线包含提供服务的模型，并设置为在触发器激活时自动获取新特征。触发器激活的条件将在第 10 项中讨论。当流水线完成更新训练好的模型后，该模型会被保存到模型注册表中，这是一种存储单元，用于保存训练好的模型以便于访问。\n\
    \n7.  **模型注册表：** 这是一个专门保存模型类和/或权重的存储单元。该单元的目的是保存训练好的模型，以便于应用程序（例如）轻松检索，并且它是添加到自动化设置中的一个好组件。如果没有模型注册表，模型类和权重将只能保存到已建立的任何源代码仓库中，但通过这种方式，我们为这些模型提供了一个集中的存储区域，从而简化了流程。由于每个人都可以访问它，它还有助于弥合模型开发团队、软件开发团队和运维团队之间的鸿沟，而这正是我们在理想的自动化设置中最终想要的。\n\
    \n该注册表与自动化训练流水线一起确保了**模型服务的持续交付**，因为模型可以频繁更新、推送到此注册表并部署，而无需经历整个实验阶段。\n\n8.  **模型服务：**\
    \ 在此，应用程序从模型注册表中拉取最新、性能最佳的模型，并利用其预测服务。然后，此操作继续在应用程序中提供所需的功能。\n\n9.  **性能与用户数据收集：**\
    \ 像往常一样收集新数据以及与模型相关的性能指标。这些数据会进入特征存储，在那里新数据被处理和标准化，以便在实验阶段和部署阶段都能使用，并且两个阶段使用的数据之间没有差异。性能数据被存储起来，以便数据科学家能够了解模型在部署后的表现。基于这些数据，可以做出重要决策，例如是否要构建具有新架构的新模型。\n\
    \n10. **训练流水线触发器：** 此触发器在激活后，会为已部署的模型启动自动化训练流水线，并允许流水线从特征存储中检索特征。触发器可以包含以下任何一种条件，但不限于这些条件：\n\
    \    *   **手动触发：** 可能只有在手动启动该过程时才会训练模型。例如，数据科学团队可以在审查性能和数据并得出结论认为已部署的模型需要使用新批次的数据进行训练后，选择启动此过程。\n\
    \n    *   **定时训练：** 可能模型被设置为按特定时间表进行训练。这可以是周末的某个时间、每晚流量最低时段、每月一次，等等。\n\n    *\
    \   **性能问题：** 可能性能数据表明模型的性能已低于某个基准。这可以自动激活训练过程，以尝试使性能恢复到正常水平。如果这不可能或消耗过多资源，数据科学家和机器学习工程师可以选择构建并部署一个新模型。\n\
    \n    *   **数据模式变化：** 可能是在特征存储中创建特征时注意到了数据趋势的变化。当然，特征存储并非唯一可以分析数据并识别任何新趋势或数据变化的地方。可以有一个专门负责此任务的独立进程/程序，它可以决定是否激活触发器。\n\
    \n这也是开始训练过程的一个好条件，因为数据中的新趋势很可能导致性能下降。无需等待性能下降来激活触发器，模型可以在充分检测到数据中的此类变化后立即开始对新数据进行训练，从而使公司能够将此类情况可能造成的任何潜在损失降至最低。\n"
- fmt: '# Reflection on the Setup


    This implementation fixes many of the issues from the previous setup. Thanks to
    the integration of pipelines in the experimental stage, the previous problem of
    having the entire stage be composed of manual processes is no longer a concern.
    The pipeline automates the whole process of training, evaluating, and validating
    a model. The model development team now only needs to build the model and reuse
    any common training, evaluation, and validation procedures that are still applicable
    to this model. At the end of the model development pipeline, relevant model metrics
    are collected and displayed to the operator. These metrics can help the model
    development team to prototype quickly and arrive at optimal solutions even faster
    than they would have without the automation since they can run multiple pipelines
    on different models and compare all of them at once.


    Automated model creation pipelines in the experimental stage allow for teams to
    respond faster to any significant changes in the data or any issues with the deployed
    model that need to be resolved. Unlike before, where the only model swapping was
    the result of loading updated weights for the same model, these pipelines are
    structured to allow for various models with different architectures as long as
    they all use the same training, evaluation, and validation procedures. Thanks
    to the modularized code, the pipeline can simply swap out model classes and their
    respective weights once deployed. The modularization allows for easier deployment
    of the pipeline and lets models be swapped out easily to allow for further training
    of any model during deployment. Should a model require special attention from
    the model development team, it can simply be trained further by the team and swapped
    back in once it is ready. Now teams can respond much more quickly by being able
    to swap models in and out in such a manner.


    The pipelines also make it much easier for software engineering teams and operational
    teams to deploy the pipelines and models. Because everything is modularized, teams
    do not have to work on integrating new model classes into the application every
    time. Everyone benefits, and model development teams do not have to be as hesitant
    about implementing new architectures so as long as the new model still uses the
    same training, evaluation, and validation code as in the existing pipeline.


    While this setup solves most of the issues that plagued the original setup, there
    are still some important problems that remain. Firstly, there are no mechanisms
    in place to test and debug the pipelines, so this must all be done manually before
    it is pushed to a source repository. This can become a problem when you’re trying
    to push many iterations of pipelines, such as when you’re building different models
    with architectures that differ in how they must be trained, tested, and validated.
    Perhaps the latest models are showing a vast improvement over the old state-of-the
    art, and your team wants to implement these new solutions as soon as possible.
    In situations like this, teams will frequently need to debug and test pipelines
    before pushing them to source code for deployment. In this case, there is still
    some automation left to be done to avoid manual work.


    Pipelines are also manually deployed, so if the structure in the code changes,
    the engineering teams must rebuild parts of the application to work with the new
    pipeline and its modularized code. Modularization works smoothly when all components
    know what to expect from each other, but if the code of one of the components
    changes so that it isn’t compatible anymore, either the application must be rebuilt
    to accommodate the new changes or the component must be rewritten to work with
    the original pipeline. Unfortunately, new model architectures may require that
    part of the pipeline itself be rewritten, so it is likely that the application
    itself must be worked on to accommodate the new pipeline.


    Hopefully you begin to see the vast improvements that automation has made in this
    setup, but also the issues that remain to be solved. The automation has solved
    the issue of building and creating new models, but the problem of building and
    creating new pipelines still remains.


    To find an answer to that problem, let’s take a look at the last of the three
    setups defined earlier.'
