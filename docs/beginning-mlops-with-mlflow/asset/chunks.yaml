    ## Summary


    Data analysis is a crucial step in the process of creating a machine learning
    solution. Not only does it determine the type of model and influence the set of
    features that will be selected for the training process, but it also helps identify
    any changes in trends over time that may signify that the model needs to be further
    trained. You explored and analyzed the data in the credit card data set, generated
    many plots to get an idea of the relationship between the two plotted variables,
    and identified some features that distinguish between normal points and anomalies.
    In the next chapter, you will process the data to create various subsets to help
    train several types of machine learning models.


    # 2. Building Models


    In this chapter, we will go over how to build a simple logistic regression model
    in both scikit-learn and PySpark. We will also go over the process of k-fold cross
    validation to tune a hyperparameter in scikit-learn.


    ## Introduction


    In the previous chapter, you loaded the credit card data set and analyzed the
    distribution of its data. You also looked at the relationships between the features
    and got a general idea of how heavily they influence the labels.


    Now that you’ve gained a better understanding of the data set, you will proceed
    with building the models themselves. You will be using the same credit card data
    set as in the previous chapter. In this chapter, you will look at two frameworks:
    **scikit-learn**, and **PySpark**. The models you build in scikit-learn and in
    PySpark will stay relevant for the rest of the book, as you will be using both
    of them later on when you host them on cloud services to make predictions. You
    will keep it simple and construct logistic regression models in these two frameworks.
    Since the input data format is different for these two frameworks, you can’t just
    conduct the data processing in advance and use those train/test/validate sets
    for these two frameworks. However, it is possible to do so for scikit-learn and
    Keras, for example, depending on how the last layer is constructed in the Keras
    model.


    You will be performing the validation step with the scikit-learn model to tune
    a hyperparameter. **Hyperparameters** can be thought of as model-related parameters
    that influence the training process and result.


    That being said, let’s get started with scikit-learn and build a logistic regression
    model. One thing to note is that we will provide a lot of commentary in the scikit-learn
    model that we may skip over in the PySpark example, so be sure to at least read
    through the process for scikit-learn to get a general idea of how train-test-validate
    works.


    ## Scikit-Learn


    Before we get started, here are the packages and their versions that you will
    need. We will provide an easy way for you to check the versions of your packages
    within the code itself.


    Here are the versions of our configuration:


    *   Python 3.6.5


    *   numpy 1.18.5


    *   pandas 1.1.0


    *   matplotlib 3.2.1


    *   seaborn 0.10.1


    *   sklearn 0.22.1.post1


    In the code below, you will find that some of the imports are unnecessary, such
    as importing all of sklearn when you only use a bit of its functionality. This
    is done for the purpose of displaying the version and such statements have a #
    beside them.'
