  trans: '

    ## 如何实施 MLOps


    MLOps 听起来很棒。它可以帮助你快速部署机器学习模型，并在模型部署后对其进行维护。然而，目前最大的问题似乎是如何实现这一目标。描述中的自动化水平需要工作流中“ML”和“Ops”双方付出大量努力才能实现。短期内，手动构建和部署模型似乎比投入资源搭建整个基础设施更好，但从长远来看，这根本不可持续。


    此外，Jupyter 非常适合进行实验，那么有没有办法也能追踪这些实验呢？这种功能会非常有用，尤其是当团队从头开始实现高级机器学习架构时，因为它可以让他们将新模型与已部署的模型或当前架构在所有相关指标上进行对比。像这样的任务在笔记本中操作更为便捷，而将所有内容转换为合适的模型文件则只是额外的工作。


    这里的要点是，考虑到这些因素以及更多因素，需要投入大量资源进行规划、开发和测试。对于规模较小的企业来说，这可能是一项超出其能力范围的任务。那么，现在该怎么办呢？


    好消息是，现在有大量可用的工具，它们基本上为你实现了所有的自动化功能，例如我们在之前的管道示例中看到的 API。我们将在后续章节中探讨的几个此类工具的例子包括
    **MLFlow、Databricks**、**AWS SageMaker**、**Microsoft Azure**、**Google Cloud** 和
    **Datarobots**。使用这些工具，将 MLOps 原则应用到你的工作流中将变得容易得多。


    以 MLFlow 为例，将其集成到代码中非常简单。你只需编写几行代码，就能追踪所有需要的指标。我们在之前的管道示例中看到的 API 功能全部由 MLFlow
    提供。此外，MLFlow 还会为你保存模型，提供模型服务功能，即给定一些数据，模型就能返回其预测结果。


    MLFlow 还可以集成到 Databricks、AWS SageMaker、Microsoft Azure 中，并且也可以部署到 Google Cloud
    上，所有这些工具都能帮助你管理 MLOps 设置，并作为部署模型的平台。虽然这些云平台确实提供了一些 MLOps 功能，且每个平台的功能范围各不相同，但使用
    MLFlow 的优势在于，它让你在选择承诺使用的平台时拥有自由选择权。此外，它还为你提供了更大程度的自由度，因为你可以在本地和离线状态下进行所有实验，并且可以支持来自许多不同框架的模型。MLFlow
    还提供了功能，帮助你模块化任何自定义构建的模型或由其他未明确支持的框架制作的模型。


    因此，为了真正回答如何实施 MLOps 的问题，你需要熟悉 MLFlow 并探索这些工具。目标是让我们在第 2 章中构建的模型一路走到部署及后续阶段。


    ## 总结


    MLOps 是一套从 DevOps 借鉴并应用于机器学习的原理和实践。你探索了三种不同类型的 MLOps 设置，它们具有不同程度的自动化：**手动实现**、**持续模型交付**以及**管道的持续集成/持续交付**。你发现手动实现在可扩展性和效率方面存在诸多问题，并探索了一种确保持续模型交付的设置。尽管这种设置解决了手动设置中的许多问题，但在管道集成测试方面仍存在一些问题需要解决。最终的设置也解决了这个问题，并确保了管道的持续集成和交付，完成了完全的自动化设置。


    你还了解了管道究竟是什么，以便理解为什么它们对自动化设置如此关键。最后，你学习了一些可以帮助你在工作区中实施 MLOps 的工具，避免了从头开始实现所有自动化的麻烦。在下一章中，你将了解
    MLFlow，这是一个出色的 API，它允许你实现自己的 MLOps 设置，并且与许多平台和框架兼容。


    # 4. MLFlow 简介


    在本章中，我们将介绍 MLFlow 是什么、它能做什么，以及如何在你现有的项目中实施 MLOps 设置。更具体地说，我们将介绍如何将 MLFlow 与 scikit-learn、TensorFlow
    2.0+/Keras、PyTorch 和 PySpark 集成。我们将介绍实验创建；指标、参数和工件记录；模型记录；以及如何在本地服务器上部署模型并查询其预测结果。

    '
- fmt: '# Introduction


    In the previous chapter, we went over what an optimal MLOps setup looks like.
    However, the level of automation presented would require an immense amount of
    resources dedicated to the project. Fortunately, there are APIs that do this for
    you, such as `MLFlow`. `MLFlow` is an API that allows you to integrate MLOps principles
    into your projects with minimal changes made to existing code. With just a couple
    lines of code here and there, you can track all of the details relevant to the
    project that you want. Furthermore, you can even save the model for future use
    in deployment, for example, and you can compare all of the metrics between individual
    models to help you select the best model.


    The great thing about `MLFlow` is that it abstracts everything for you. It packages
    and modularizes the models for you so that when you deploy the model and want
    to make predictions, all you need to do is simply pass in the input data in a
    certain format. All of the modularization that we discussed in the previous chapter
    with the pipelines is taken care of by `MLFlow`. `MLFlow` also allows you to create
    a wrapper around your model if your model prediction code needs to be different.
    We will look at this functionality in detail in the next chapter, when you deploy
    your models to Amazon SageMaker. Even with custom code, `MLFlow` will modularize
    it so that it will still work the same way as any other model once it is deployed
    and ready to make predictions.


    In detail, we will go over the following in this chapter:


    * **Creating experiments:** Experiments in `MLFlow` essentially allow you to group
    your models and any relevant metrics. For example, you can compare models that
    you’ve built in TensorFlow and in PyTorch and name this experiment something like
    `pytorch_tensorflow`. In the context of anomaly detection, you can create an experiment
    called `model_prototyping` and group all of the models that you want to test by
    running the training pipelines after setting `model_prototyping` as the experiment
    name.


    As you’ll see shortly, grouping model training sessions by experiment can really
    help organize your workspace because you’ll get a clear idea of the context behind
    trained models.


    * **Model and metric logging:** `MLFlow` allows you to save a model in a modularized
    form and log all of the metrics related to the **model run**. A model run can
    be thought of as the model training, testing, and validation pipeline from the
    previous chapter. In `MLFlow`, you can mark the start and the end of each run
    and decide which metrics you want to save. Additionally, you can save graphs,
    so you can also view plots like confusion matrices and ROC curves. A **model run**
    is basically the instance in which `MLFlow` executes the code that you tell it
    to, so if you want, you can only train the model and leave it at that.


    It is possible for you to train, evaluate, and even validate your model, logging
    all of the metrics for each respective step in the whole process. `MLFlow` gives
    you a lot of flexibility in how you define a model run. You can end the run after
    simply training it, or you can end the run after training and evaluating it. If
    you wish, you can even set up an entire validation script to log the entire process
    for you, allowing you to much more easily compare different hyperparameter setups
    all at once in `MLFlow`. We will explore how to perform model validation with
    `MLFlow` shortly when we revisit the scikit-learn experiment from Chapter [2](#499842_1_En_2_Chapter.xhtml).


    * **Comparing model metrics:** `MLFlow` also allows you to compare different models
    and their metrics all at once. And so, when performing validation to help tune
    a model’s hyperparameters, you can compare all of the selected metrics together
    in `MLFlow` using its user interface. In the previous chapter, you printed out
    everything, making the cell output possibly very large if the script is quite
    involved in its hyperparameter setups.


    * **Model Registry:** `MLFlow` also adds functionality to allow you to implement
    a model registry, allowing you to define what stage a particular model is in.
    Databricks integrates quite well with `MLFlow`, providing built-in model registry
    functionality. You will explore how to use the `MLFlow` Model Registry when you
    look at Databricks in Appendix.


    * **Local deployment:** `MLFlow` also allows you to deploy on a local server,
    allowing you to test **model inference**. Model inference is basically the prediction
    process of a model. Data is sent to the model in one of several standardized formats,
    and `MLFlow` returns the predictions made by the model.


    Such a setup can easily be converted to work on a hosted server as well. As you
    will see in the next several chapters, `MLFlow` also allows you to deploy your
    models on popular cloud services such as Amazon SageMaker, Microsoft Azure, Google
    Cloud, and Databricks. The process at its core remains similar to how you will
    perform local model serving. The only difference comes with where you host the
    model and the particular procedure for querying it.


    With that being said, let’s get started by revisiting the scikit-learn logistic
    regression model and integrating `MLFlow` into it.


    ## MLFlow with Scikit-Learn


    Before we begin, here are the versions of Python and the packages that were used:


    * **Python**: 3.6.5

    * **numpy**: 1.18.5

    * **scikit-learn**: 0.22.2.post1

    * **pandas**: 1.1.0

    * **Matplotlib**: 3.2.1

    * **Seaborn**: 0.10.1

    * **MLFlow**: 1.10.0


    You don’t need the exact versions of the packages we used, but in case some functionality
    is removed, renamed, or just changed in the newer versions and the code runs into
    an error, you have the exact version of the module you can try running the code
    with.


    `MLFlow` in particular is updated quite frequently, so you are more likely to
    run into issues running code with something like `MLFlow` compared to a package
    like `numpy`.


    With that being said, let’s dive into the first example. In this case, let’s revisit
    the scikit-learn code from the previous chapter and add `MLFlow` integration to
    it.'
