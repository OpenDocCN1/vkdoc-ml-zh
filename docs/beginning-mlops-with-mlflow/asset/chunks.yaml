    单元格中的验证脚本。脚本相当长，因此请确保其格式正确，因为单个空格错位都可能导致问题


    在运行脚本之前，让我们回顾一下代码的作用，因为一下子抛出了很多代码。


    第一个循环遍历每个异常权重。你将折数在此处设置为 1，并定义空列表来存储每次使用当前权重参数运行时的准确率和 AUC 分数。

