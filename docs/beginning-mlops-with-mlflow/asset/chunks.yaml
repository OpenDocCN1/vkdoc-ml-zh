    and would be problematic for the model. Of course, once you’ve deployed the model
    and start receiving new data, you would still standardize it using the scaler
    from the training process, but this new data could possibly come from a slightly
    different distribution than your training data. This would especially be the case
    if trends start shifting - this new standardized data could possibly lead to a
    tougher time for the model since it wouldn’t fit very well in the distribution
    that the model trained on.


