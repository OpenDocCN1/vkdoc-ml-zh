    ### 模型评估


    模型训练完成后，运行评估代码：


    ```

    predictions = lrModel.transform(test)

    y_true = predictions.select([''label'']).collect()

    y_pred = predictions.select([''prediction'']).collect()

    evaluations = lrModel.evaluate(test)

    accuracy = evaluations.accuracy

    ```


    添加以下代码以显示指标：


    ```

    print(f"AUC Score: {roc_auc_score(y_pred, y_true):.3%}")

    print(f"PySpark AUC Score: {pyspark_auc_score:.3%}")

    print(f"Accuracy Score: {accuracy:.3%}")

    ```


    请参考图 2-28 查看输出结果。


    ![../images/499842_1_En_2_Chapter/499842_1_En_2_Fig28_HTML.jpg](img/499842_1_En_2_Fig28_HTML.jpg)


    图 2-28


    输出指标。AUC 分数使用 scikit-learn 的评分算法计算，而 PySpark AUC 分数指标来自 PySpark 模型的训练摘要。最后，还输出了准确率分数


    你可以看到 AUC 分数和准确率都相当高，那么让我们来检查一下图表。


    首先，我们来看 ROC 曲线：


    ```

    pyspark_roc = trainingSummary.roc.toPandas()

    plt.xlabel(''False Positive Rate'')

    plt.ylabel(''True Positive Rate'')

    plt.title(''PySpark ROC Curve'')

    plt.plot(pyspark_roc[''FPR''],pyspark_roc[''TPR''])

    ```


    要查看图表，请参考图 2-29。


    ![../images/499842_1_En_2_Chapter/499842_1_En_2_Fig29_HTML.jpg](img/499842_1_En_2_Fig29_HTML.jpg)


    图 2-29


    你刚刚训练的 PySpark 逻辑回归模型的 ROC 曲线。完美的 ROC 曲线会从真正率 1.0 开始，然后一直延伸到假正率 1.0。这条曲线非常接近这个标准，因此
    PySpark 认为其面积（AUC）约为 0.97997，请记住完美的 AUC 分数是 1.00


    这条曲线看起来相当理想。现在让我们查看混淆矩阵，以详细了解模型的表现：


    ```

    conf_matrix = confusion_matrix(y_true, y_pred)

    ax = sns.heatmap(conf_matrix, annot=True,fmt=''g'')

    ax.invert_xaxis()

    ax.invert_yaxis()

    plt.ylabel(''Actual'')

    plt.xlabel(''Predicted'')

    ```


    请参考图 2-30 查看混淆矩阵图。


    ![../images/499842_1_En_2_Chapter/499842_1_En_2_Fig30_HTML.jpg](img/499842_1_En_2_Fig30_HTML.jpg)


    图 2-30


    你刚刚训练的 PySpark 逻辑回归模型的混淆矩阵图。对于正常数据，正确标记点的准确率非常高，而对于异常数据，准确率也尚可


    由此，你可以更详细地了解模型的表现。仅看异常点，你会发现模型预测异常的准确率为 81.4%（70/(70+16)）。这比你之前在 scikit-learn
    中训练的模型要好，尽管你还没有调整超参数以达到最佳性能。


    PySpark 确实提供了对数据进行加权的选项，但这是基于每个样本进行的。这意味着，不是为每个类别传入一个权重字典，而是需要在数据框中创建一个列，例如，将每个异常点加权为某个值，每个正常点加权为
    1。默认情况下，所有点的权重都是 1，这意味着 PySpark 模型在性能上可能比 scikit-learn 模型有更大的潜力。


    再来看正常点，你会发现准确率非常高，达到了 99.96%（28363/(28363+10)），因此它能够非常好地识别正常点。


    ## 总结


    利用从数据分析中获得的见解，你在 scikit-learn 和 PySpark 中将数据处理成了训练集、测试集和验证集（在 PySpark 中你只做了训练-测试拆分，但你可以像在
    scikit-learn 中一样，将训练数据拆分为训练集和验证集）。接着，你在每个框架中构建了逻辑回归模型，并进行了训练和评估。你查看了准确率和 AUC 分数作为指标，并通过观察
    ROC 曲线和混淆矩阵来更深入地了解模型的表现。对于 scikit-learn 模型，你执行了 k 折交叉验证来帮助调整超参数。在下一章中，你将带着数据分析和模型创建的经验，学习
    MLOps 以及如何将模型投入生产。


    # 3. 什么是 MLOps？


    在本章中，我们将介绍“MLOps”这一术语背后的概念，并详细说明它是什么、为什么有用以及如何实现。

