    检查你保存的混淆矩阵图表。也可以随意点击另一个图表，那是`ROC`图。


    很神奇，对吧？一切都井井有条，你无需担心为所有内容创建多个文件夹并保持组织性。只需告诉`MLFlow`要做什么，它就会记录你需要的与此运行相关的所有信息。你可以记录深度学习模型的学习率、周期数、特定优化器参数（如`Adam`优化器的`beta1`和`beta2`）等超参数。


    你甚至可以记录图表，如图[4-17](#499842_1_En_4_Chapter.xhtml#Fig17)所示，以及模型本身。使用`MLFlow`，即使你不需要部署到云服务的能力，也可以让你的实验保持高度组织性。


    现在，让我们尝试再记录几个运行。重新运行图[4-11](#499842_1_En_4_Chapter.xhtml#Fig11)中的单元格几次，直到完成，然后返回`MLFlow`
    UI。确保你已选择了名为`scikit_learn_experiment`的实验。你应该会看到类似图[4-18](#499842_1_En_4_Chapter.xhtml#Fig18)的内容。


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig18_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig18_HTML.jpg)


    图4-18


    在记录了一些运行后重新查看你的实验。运行按时间戳升序排列，因此最新的运行位于顶部。


    让我们比较一下这些运行记录的指标。选择至少两个运行，并确保你的UI看起来有点像图[4-19](#499842_1_En_4_Chapter.xhtml#Fig19)。我们选择了三个运行。


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig19_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig19_HTML.jpg)


    图4-19


    选择几个运行后，你的UI应该看起来像这样。确保至少选择两个，以便有内容可以比较。还要注意，名为`Compare`的按钮变为实心。


    点击`Compare`后，你应该会看到类似图[4-20](#499842_1_En_4_Chapter.xhtml#Fig20)的内容。


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig20_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig20_HTML.jpg)


