- fmt: "# Introduction\n\nIn the previous chapter, you learned what MLFlow is and\
    \ how you can utilize the functionality it provides to integrate MLOps principles\
    \ into your code. You also looked at how to deploy a model to a local server and\
    \ perform model inference. However, now it’s time to move to the next stage and\
    \ explore how you can deploy your machine learning models to a cloud platform\
    \ so that multiple entities can use its prediction services.\n\nBefore you begin,\
    \ here are some important prerequisites:\n\n- You must have the AWS command line\
    \ interface (CLI) installed and have your credentials configured.\n  - Once your\
    \ credentials are verified, the AWS CLI lets you connect to your AWS workspace.\
    \ From here, you can create new buckets, check your SageMaker endpoints, and so\
    \ on all through the command line.\n- You must have an Identity and Access Management\
    \ (IAM) execution role defined that grants SageMaker access to your S3 buckets.\
    \ Refer to Figure [5-8](#499842_1_En_5_Chapter.xhtml#Fig8) to see more on this.\n\
    - You must have Docker installed and working properly. Verify that you can build\
    \ Docker images.\n  - It is essential to have Docker working on your system because\
    \ without it, MLFlow cannot build the Docker container image to push to the AWS\
    \ ECR.\n\nWe also recommend that you learn about AWS in general and how it works.\
    \ Having background knowledge of AWS and how it works can help you understand\
    \ this chapter and allow you to fix any issues much more easily.\n\nIn detail,\
    \ we will go over the following in this chapter:\n\n- **Configuring AWS:** Here,\
    \ you set up a bucket and push your `mlruns` folders here to be stored on the\
    \ cloud. These folders contain information about all of the runs associated with\
    \ the experiments along with the logged models themselves. Next, you build a special\
    \ Docker container as defined by MLFlow and push that to AWS ECR. SageMaker uses\
    \ this container image to serve the MLFlow model.\n- **Deploying a model to AWS\
    \ SageMaker:** Here, you use the built-in MLFlow SageMaker module code to push\
    \ a model to SageMaker. After SageMaker creates an endpoint, the model is hosted\
    \ on here utilizing the docker image that you pushed earlier to the ECR.\n- **Making\
    \ predictions:** Once the model has finished deployment and is ready to serve,\
    \ you use Boto3 to query the model and receive predictions.\n- **Switching models:**\
    \ MLFlow provides functionality that enables you to switch out a deployed model\
    \ with a new one. SageMaker essentially updates the endpoint with the new model\
    \ you are trying to deploy.\n- **Removing the deployed model:** Finally, MLFlow\
    \ lets you remove your deployed model altogether and delete the endpoint. This\
    \ is important to do so that you don’t incur the charges of leaving an endpoint\
    \ running.\n\nAlso, it is important to note that AWS is actively being worked\
    \ on, and functionality and operating procedures can change! What that means is\
    \ that something that works now may not work later on.\n\nHowever, MLFlow specifically\
    \ provides support for SageMaker, so if something fundamental to how SageMaker\
    \ runs changes in the future, MLFlow is likely to account for it in the next build.\n\
    \nIn the absolute worst-case scenario where that doesn’t happen, you can still\
    \ run an MLFlow server and host it on AWS. You will still be able to deploy models\
    \ and make inferences with them, and the overall functionality is still preserved.\
    \ Instead of SageMaker directly hosting the model using an MLFlow container image,\
    \ you would do something similar to the local model deployment experiment we did\
    \ in Chapter [4](#499842_1_En_4_Chapter.xhtml), except you would connect to the\
    \ server IP and port that the MLFlow server is hosted on.\n\nWe will explore how\
    \ to do this with Google Cloud, as MLFlow does not support Google Cloud like it\
    \ does SageMaker and Azure.\n\nWith that, let’s get started!\n\n# Configuring\
    \ AWS\n\nBefore you can actually push any model to SageMaker, you need to set\
    \ up your Amazon workspace. You can push models from your local `mlruns` directory,\
    \ similar to how you did local model deployment, but it is much more convenient\
    \ and centralized to have all your runs be pushed to AWS and stored in a bucket.\
    \ This way, all teams can access models that are stored here. In a sense, this\
    \ can act as your “model registry,” although it doesn’t offer the same functionality\
    \ as the model registry provided by MLFlow.\n\nWhat MLFlow allows you to do is\
    \ take specific runs and determine whether to stage that model to the development\
    \ branch or to production. In this case, you can have buckets for each team, separated\
    \ into development or production branches. It’s a couple extra steps on top of\
    \ MLFlow’s model registry, but it would still allow you to enjoy the benefits\
    \ of having a model registry.\n\nIn this case, you will simply be creating one\
    \ bucket to host all of your MLFlow runs. From here, you will be picking a specific\
    \ run and deploying to SageMaker. To keep it simple, you will once again use the\
    \ scikit-learn logistic regression model that you trained as the model you are\
    \ deploying.\n\nSo with that, create a simple bucket and name it something like\
    \ `mlflow-sagemaker`. You can either create it through the AWS CLI or do so through\
    \ the AWS console in your browser.\n\nWe will do the latter so that you can visually\
    \ see what Amazon is really doing when a bucket is created.\n\nKeep in mind that\
    \ AWS is always working on its UI, so your screen may not look exactly like what\
    \ is portrayed. That being said, you are still likely able to access S3 bucket\
    \ storage services, so the core functionality should still be the same, despite\
    \ the UI changes.\n\nWhen you log into your portal, you should see something like\
    \ Figure [5-1](#499842_1_En_5_Chapter.xhtml#Fig1).\n\n![../images/499842_1_En_5_Chapter/499842_1_En_5_Fig1_HTML.jpg](images/499842_1_En_5_Chapter/499842_1_En_5_Fig1_HTML.jpg)\n\
    \nFigure 5-1\n\nThe home screen of the AWS console. Keep in mind that yours is\
    \ likely to look different to the one shown here\n\nAs you can see, you can look\
    \ up services with the search bar. Here, type `S3` and click the result that states\
    \ “S3” with the description “Scalable Storage in the Cloud.”\n\nYou should go\
    \ to a page that looks like Figure [5-2](#499842_1_En_5_Chapter.xhtml#Fig2).\n\
    \n![../images/499842_1_En_5_Chapter/499842_1_En_5_Fig2_HTML.jpg](images/499842_1_En_5_Chapter/499842_1_En_5_Fig2_HTML.jpg)\n\
    \nFigure 5-2\n\nWhat your screen might look like when you open the S3 bucket services\
    \ module. We have greyed out the names of the buckets, but you can see string\
    \ names here\n\nYou should see a button that says Create Bucket. Click it and\
    \ you will see something like Figure [5-3](#499842_1_En_5_Chapter.xhtml#Fig3).\n\
    \n![../images/499842_1_En_5_Chapter/499842_1_En_5_Fig3_HTML.jpg](images/499842_1_En_5_Chapter/499842_1_En_5_Fig3_HTML.jpg)\n\
    \nFigure 5-3\n\nThis is how your bucket creation screen may look. In this case,\
    \ you are just naming the bucket and aren’t concerned with anything else\n\nWe\
    \ named our bucket `mlops-sagemaker-runs`. You don’t have to worry about the rest\
    \ of the options, so scroll down to the bottom and click Create Bucket. Once done,\
    \ you should be able to see your bucket in the list of buckets.\n\nFrom here,\
    \ let’s use a subprocess to sync the local `mlruns` directory to this bucket.\
    \ What this does is upload the entire `mlruns` directory to your bucket, so that\
    \ all of your runs are stored on the cloud.\n\nFirst, collect the following attributes:\n\
    \n- `s3_bucket_name`: What is the name of the S3 bucket you are trying to push\
    \ to?\n- `mlruns_directory`: What is the location of the `mlruns` directory you’re\
    \ pushing to the bucket?\n\nBased on that, run the following. We included the\
    \ bucket name and `mlruns` directory in our case, so just replace them with your\
    \ respective values."
