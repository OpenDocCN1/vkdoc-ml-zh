    函数中列出的模型指标，甚至在训练完成后还会记录模型本身。


    #### MLFlow UI – 检查你的运行


    接下来，让我们打开 MLFlow UI 并在 MLFlow 中检查你的运行。请确保你的终端或命令提示符位于存储 mlruns 的同一目录中。通常，MLFlow
    会将所有运行保存在 Jupyter notebook 的同一目录下。


