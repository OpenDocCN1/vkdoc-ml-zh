- fmt: '#### Querying Without Scaling


    You will keep the selection of 80 values from earlier and query the model. The
    model accepts data in the JSON format, so you will have to convert the format
    of your data before sending it to the model. Run the cell in Figure [4-106](#499842_1_En_4_Chapter.xhtml#Fig107).


    You should see something like Figure [4-107](#499842_1_En_4_Chapter.xhtml#Fig108).


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig108_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig108_HTML.jpg)


    Figure 4-107


    The list of predictions that you get after querying the model with `input_json`.
    Notice that it’s predicting a lot of anomalies. This is the first red flag that
    indicates something’s wrong.


    The resulting data frame is what you get by converting the predictions that you
    got back from the model into a data frame. Since you have the true predictions,
    let’s calculate an AUC score and an accuracy score to see how the model did. Run
    the following code:


    ```

    y_true = df.iloc[:80].Class

    df2 = df2.T

    eval_acc = accuracy_score(y_true, df2)

    y_true.iloc[-1] = 1

    eval_auc = roc_auc_score(y_true, df2)

    print("Eval Acc", eval_acc)

    print("Eval AUC", eval_auc)

    ```


    First of all, you had to transpose `df2` using `.T` so that you can get the predictions
    to be in a Pandas Series format. Next, the AUC score cannot be calculated if one
    of the arrays `y_true` or `y_preds` only have one class. In this case, `y_true`
    is only comprised of normal values, so you had to manipulate the last value and
    make it 1 when it really isn’t just to get an AUC score. Of course, the resulting
    AUC score will be nonsense.


    You should see something like Figure [4-108](#499842_1_En_4_Chapter.xhtml#Fig109).


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig109_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig109_HTML.jpg)


    Figure 4-108


    Evaluating the accuracy and the AUC score from the predictions. The AUC score
    is nonsense, but the accuracy score reveals that the model has performed very
    poorly.


    As you can see, the accuracy score is horrible. This basically means that the
    model doesn’t know the difference between the anomalies and the normal points
    but seems to have some idea about normal points.


    The reason the model did so poorly despite doing so well during the training process
    is that the input data has not been scaled. You will see the difference in model
    performance when you now scale the data before passing it in.


    #### Querying with Scaling


    You will take the same split of data except you will now scale it before passing
    it in. Run the following code to recreate the data that you used to fit the scaler
    when training the model originally:


    ```

    normal = df[df.Class == 0].sample(frac=0.5, random_state=2020).reset_index(drop=True)

    anomaly = df[df.Class == 1]

    normal_train, normal_test = train_test_split(normal, test_size = 0.2, random_state
    = 2020)

    anomaly_train, anomaly_test = train_test_split(anomaly, test_size = 0.2, random_state
    = 2020)

    scaler = StandardScaler()

    scaler.fit(pd.concat((normal, anomaly)).drop(["Time", "Class"], axis=1))

    ```


    You should see something like Figure [4-109](#499842_1_En_4_Chapter.xhtml#Fig110).


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig110_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig110_HTML.jpg)


    Figure 4-109


    Recreating the original dataset that you used to fit the standard scaler when
    processing the data originally. Using this, you will transform your new sample
    of data and pass it into the model.


    Now that you have fit the scaler, let’s transform your data selection:


    ```

    scaled_selection = scaler.transform(df.iloc[:80].drop(["Time", "Class"], axis=1))

    input_json = pd.DataFrame(scaled_selection).to_json(orient="split")

    ```


    Refer to Figure [4-110](#499842_1_En_4_Chapter.xhtml#Fig111).


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig111_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig111_HTML.jpg)


    Figure 4-110


    Scaling the selection of 80 values from the original data frame and converting
    it into a JSON format to be sent to the model.


    Now run the following:


    ```

    proc = subprocess.run(["curl",  "-X", "POST", "-H", "Content-Type:application/json;
    format=pandas-split",

    "--data", input_json, "http://127.0.0.1:1235/invocations"],

    stdout=subprocess.PIPE, encoding=''utf-8'')

    output = proc.stdout

    preds = pd.DataFrame([json.loads(output)])

    preds

    ```


    You should see something like Figure [4-111](#499842_1_En_4_Chapter.xhtml#Fig112).


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig112_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig112_HTML.jpg)


    Figure 4-111


    Querying the model with the scaled values. From a first glance, the predictions
    appear to be correct this time around.


    One thing to note is that you are scaling it on the combination of all normal
    data and all anomaly data, as you did when you were creating the train, test,
    and validation splits. Since the model was trained on data that was scaled on
    the partition of data you used in the training process (the training, testing,
    and validation data together), passing in data scaled differently won’t result
    in the correct predictions. When you scale the new data, it must be scaled after
    fitting it on the training set.


    One problem that may eventually arise is that new data might have a different
    distribution than the original training data. This could lead to performance issues
    with the model, but really that’s a sign that you need to train your model to
    update it on the new data.


    Let’s check how your model did now:


    ```

    y_true = df.iloc[:80].Class

    preds = preds.T

    eval_acc = accuracy_score(y_true, preds)

    y_true.iloc[-1] = 1

    eval_auc = roc_auc_score(y_true, preds)

    print("Eval Acc", eval_acc)

    print("Eval AUC", eval_auc)

    ```


    Refer to Figure [4-112](#499842_1_En_4_Chapter.xhtml#Fig113).


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig113_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig113_HTML.jpg)


    Figure 4-112


    Checking the accuracy and the AUC scores of the predictions. The accuracy score
    is far better, but you will need more prediction data with both normal and anomaly
    values to be able to get AUC scores.


    As you can see, the accuracy score is noticeably higher, and the model’s performance
    is reminiscent of when it was trained and evaluated. Unfortunately, the AUC score
    isn’t a very accurate reflection of the model’s performance since the samples
    you are querying the model with only have normal data.


    Let’s see how the model performs when you query it with a larger sample of data.'
