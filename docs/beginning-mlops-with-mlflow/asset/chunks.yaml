  trans: '

    #### 对当前设置的反思


    这一实现方案解决了先前设置中的许多问题。得益于实验阶段对流水线的整合，之前整个阶段完全由人工流程构成的问题已不复存在。流水线实现了模型训练、评估和验证全流程的自动化。模型开发团队现在只需构建模型，并复用任何仍适用于该模型的通用训练、评估和验证流程。在模型开发流水线的末端，相关的模型指标会被收集并展示给操作人员。这些指标能帮助模型开发团队快速构建原型，甚至比没有自动化时更快地找到最优解决方案，因为他们可以在不同模型上运行多条流水线，并一次性对所有结果进行比较。


    实验阶段的自动化模型创建流水线使团队能够更快地响应数据的重大变化，或已部署模型需要解决的任何问题。与之前只能通过加载同一模型的更新权重来替换模型不同，这些流水线的结构允许使用不同架构的多种模型，只要它们都使用相同的训练、评估和验证流程即可。得益于模块化代码，流水线在部署后只需替换模型类及其各自的权重。模块化使得流水线的部署更加容易，并且可以轻松替换模型，以便在部署期间对任何模型进行进一步训练。如果某个模型需要模型开发团队的特殊关注，团队可以对其进行进一步训练，待准备就绪后再替换回来。现在，团队能够通过这种模型替换方式，实现更快速的响应。


    流水线还使得软件工程团队和运维团队能够更轻松地部署流水线和模型。由于一切都是模块化的，团队无需每次都费力将新的模型类集成到应用程序中。每个人都从中受益，模型开发团队也不必对实现新架构过于犹豫，只要新模型仍使用与现有流水线相同的训练、评估和验证代码即可。


    虽然这一设置解决了困扰原始设置的大部分问题，但仍有一些重要问题有待解决。首先，没有现成的机制来测试和调试流水线，因此在推送到源代码仓库之前，所有这些工作都必须手动完成。当你试图推送多个迭代版本的流水线时，比如在构建不同架构的模型，而这些模型的训练、测试和验证方式又各不相同的情况下，这就会成为一个问题。也许最新的模型相比旧的最先进模型有了巨大改进，你的团队希望尽快实现这些新方案。在这种情况下，团队在将流水线推送到源代码进行部署之前，需要频繁地进行调试和测试。这意味着，在避免人工工作方面，仍有部分自动化工作需要完成。


    流水线也是手动部署的，因此如果代码结构发生变化，工程团队必须重建应用程序的部分组件，以适应新的流水线及其模块化代码。当所有组件都清楚彼此之间的预期时，模块化运行会很顺畅；但如果某个组件的代码发生变化导致不再兼容，那么要么必须重建应用程序以适应新的变化，要么必须重写该组件以使其与原始流水线兼容。不幸的是，新的模型架构可能要求重写流水线本身的部分内容，因此很可能需要对应用程序本身进行修改，以适应新的流水线。


    希望你能开始看到自动化在这一设置中带来的巨大改进，同时也看到仍有待解决的问题。自动化解决了构建和创建新模型的问题，但构建和创建新流水线的问题依然存在。


    为了找到这个问题的答案，让我们来看看前面定义的三种设置中的最后一种。

    '
- fmt: '### Continuous Integration/Continuous Delivery of Pipelines


    In this setup, we will be introducing a system to thoroughly test pipeline components
    before they are packaged and ready to deploy. This will ensure **continuous integration
    of pipeline code** along with **continuous delivery of pipelines**, crucial elements
    of the automation process that the previous setup was missing. Refer to Figure
    [3-4](#499842_1_En_3_Chapter.xhtml#Fig4) for a graphical representation of such
    a setup.


    ![../images/499842_1_En_3_Chapter/499842_1_En_3_Fig4_HTML.jpg](images/499842_1_En_3_Chapter/499842_1_En_3_Fig4_HTML.jpg)


    **Figure 3-4** Graph depicting added testing systems and a package store to the
    automation setup in Figure [3-2](#499842_1_En_3_Chapter.xhtml#Fig2)


    Though this is mostly the same setup, we will go through it again step by step
    with an emphasis on the newly introduced elements.


    1. **Feature store:** The feature store contains standardized data processed into
    features. Features can be pulled by data scientists for offline data analysis.
    Upon activation of the trigger, features can also be sent to the automated training
    pipeline to further train the deployed model.


    2. **Data analysis:** This step is performed by data scientists on features pulled
    from the feature store. The results from the analysis can determine whether or
    not to build a new model or adjust the architecture of an existing model and retrain
    it from there.


    3. **Automated model building and analysis:** This step is performed by the model
    development team. Models can be built by the team and passed into the pipeline,
    assuming that they are compatible with the training, testing, and validation code,
    and the entire process is automatically conducted with a model analysis report
    generated at the end. In the case where the team wants to implement some of the
    latest machine learning architectures, models will have to be created from scratch
    with integration into pipelines in mind to maintain modularity. Parts of the pipeline
    code may have to change as well, which is acceptable because the new components
    of this setup can handle this automatically.


    4. **Modularized code:** Once the model reaches a minimum level of performance
    in the validation step, the pipeline, its components, and the model are all ready
    to be modularized and stored in a source repository.


    5. **Source repository:** The source repository holds all of the packaged pipeline
    and model code for different pipelines and different models. Teams can create
    multiples at once for different purposes and store them all here. In the old setup,
    pipelines and models would be pulled from here and manually integrated and deployed
    by software engineering teams. In this setup, the modularized code must now be
    tested to make sure all of the components will work correctly.


    6. **Testing:** This step is crucial in achieving **continuous integration**,
    or a result of automation where new components and elements are continuously designed,
    built, and deployed in the new environment.


    Pipelines and their components, including the model, must be thoroughly tested
    to ensure that all outputs are correct. Furthermore, the pipelines themselves
    must be tested so that they are guaranteed to work with the application and how
    it is designed. There shouldn’t be bugs in the pipeline, for example, that would
    break its compatibility with the application. The application is programmed to
    expect a specific behavior from the pipeline, and the pipeline must behave correspondingly.


    If you are familiar with software development, the testing of pipeline components
    and the models is similar to the automated testing that developers write to check
    various parts of an application’s functionality. A simple example is automated
    testing to ensure data of various types are successfully received by the server
    and are added to the correct databases.


    With pipelines and machine learning models, some examples of testing include:

    - Does the validation testing procedure lead to correct tuning of the hyperparameters?

    - Does each pipeline component work correctly? Does it output the expected element?
    For example, after model evaluation, does it correctly begin the validation step?
    (Alternatively, if model evaluation goes after model validation, does the evaluation
    step correctly initiate?)

    - Is the data processing performed correctly? Are there any issues with the data
    post-processing that would lead to poor model performance? Avoiding this outcome
    is for the best since it would waste resources having to fix the data processing
    component. If the business relies on rapid pipeline deployment, then avoiding
    this type of scenario is even more crucial.

    - Does the data processing component correctly perform data scaling? Does it correctly
    perform feature engineering? Does it correctly transform images?

    - Does the model analysis work correctly? You want to make sure that you’re basing
    decisions on accurate data. If the model truly performs well but faults in the
    model analysis component of the pipeline lead the data scientist/machine learning
    engineer to believe the model isn’t performing that well, then it could lead to
    issues where pipeline deployment is slowed down. Likewise, you don’t want the
    model analysis to be displaying the wrong information, even if it mistakenly displays
    precision for accuracy.


    The more thorough the automated testing, the better the guarantee that the pipeline
    will operate within the application without issues. (This doesn’t necessarily
    include model performance as that has to do more with the model architecture,
    how the model is developed, and what it is capable of.)


    Once the pipeline passes all the tests, it is then automatically packaged and
    sent to a package store. Continuous integration of pipelines is now achieved since
    teams can build modularized and tested pipelines much more quickly and have them
    ready for deployment.


    7. **Package store:** The package store is a containment unit that holds various
    packaged pipelines. It is optional but included in this setup so that there is
    a centralized area where all teams can access packaged pipelines that are ready
    for deployment. Model development teams push to this package store, and software
    engineers and operational teams can retrieve a packaged pipeline and deploy it.
    In this way, it is similar to the model registry in that both help achieve **continuous
    delivery**. The package store helps achieve continuous delivery of pipelines just
    as the model registry helps achieve continuous delivery of models and model services.


    Thanks to automated testing providing continuous integration of pipelines and
    continuous delivery of pipelines via the package store, pipelines can also be
    deployed rapidly by operational teams and software engineers. With this, businesses
    can easily keep up with the latest trends and advances in machine learning architectures,
    allowing for better and better performance and more involved services.


    8. **Deploy pipeline:** Pipelines can be retrieved from the package store and
    deployed in this step. Software engineering and operational teams must ensure
    that the pipeline will integrate without incident into the application. Because
    of that, there can be more testing on the part of software engineering teams to
    ensure proper integration of the pipeline. For example, one test can be to ensure
    the dependencies of the pipeline are considered in the application (if, for example,
    `TensorFlow` has updated and contains new functionality the pipeline now uses,
    the application should update its version of `TensorFlow` as well).'
