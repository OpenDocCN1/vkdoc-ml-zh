    查看特定验证折的 ROC 曲线。如你所见，ROC 曲线非常理想。完美的 ROC 曲线会尽可能从 y 轴上的 1.0 开始，并在到达 x 轴上的 1.0 时保持该水平。这样的
    ROC 图意味着 AUC 将尽可能接近 1.0。在这种情况下，你几乎看到了完美的 AUC 曲线，并且 AUC 显示为 1.0。图 2-19 中的混淆矩阵将更详细地揭示
    AUC 分数为何如此之低。


    这张图与你之前看到的 ROC 图看起来不同。事实上，它几乎堪称完美。


    让我们查看混淆矩阵，以便更好地了解模型在此折上的表现：


    ```

    conf_matrix = confusion_matrix(y_val, preds)

    ax = sns.heatmap(conf_matrix, annot=True,fmt=''g'')

    ax.invert_xaxis()

    ax.invert_yaxis()

    plt.ylabel(''实际'')

    plt.xlabel(''预测'')

    ```


    得到的混淆矩阵如图 2-19 所示。


    ![../images/499842_1_En_2_Chapter/499842_1_En_2_Fig19_HTML.jpg](img/499842_1_En_2_Fig19_HTML.jpg)


    图 2-19


    特定验证折的混淆矩阵。它在标记正常数据点方面具有很高的准确性，并且在处理异常点方面也表现良好。此外，如果你数一下顶行的条目，会发现这个验证折中几乎没有异常点：21
    个异常点对 5685 个正常点。因此，对异常点赋予更高的权重有助于模型在学习过程中考虑这些异常点，从而在异常检测中取得更好的性能，这就不足为奇了。


    模型在对异常点进行正确分类方面做得相当好，但此处的验证目标仅仅是帮助将超参数设置调整到正确的方向。基于验证过程的结果，你知道最佳超参数值位于 10 和 15
    之间，因为这两个设置产生了最佳结果。


    当然，你可以进一步缩小范围，将异常权重在 10 到 15 之间的值包含进来，并重复此过程，不断缩小范围，直到找到一个良好、最优的值。然而，超过一定精度后，你会发现收益递减，投入超参数调优的努力只能带来近乎可以忽略的性能提升。


    至此，你现在已经知道如何在 scikit-learn 中训练、评估和验证逻辑回归模型了。


    ## PySpark


    我们提供了将要使用的模块版本。安装 PySpark 可能有点复杂，因为根据版本不同，并非简单地执行`pip install PySpark`即可，请注意这一点。


    以下是我们的配置版本：


    *   Python 3.6.5


    *   PySpark 3.0.0


    *   matplotlib 3.2.1


    *   seaborn 0.10.1


    *   sklearn 0.22.1.post1


    那么，让我们开始吧。再次说明，我们不会像 scikit-learn 示例那样提供详细的注释，因此请务必回顾 scikit-learn 中的整个过程，以便对其流程有清晰的认识。此外，在此示例中，我们不会在
    PySpark 中验证模型。

