    The model did quite well on correctly classifying the anomalies, but the goal
    of validation in this case is just to help nudge the hyperparameter setting in
    the right direction. Based on the results of the validation process, you know
    that the optimal hyperparameter value lies within the values of 10 and 15 because
    those two settings produced the best results.


    Of course, you can narrow the range further to include values between 10 and 15
