  raw: '#### Loading a Logged Model


    Next, let’s briefly look at how you can load the models logged by MLFlow. Go back
    to the experiment and click a run. Note the run ID at the top and copy it. Then,
    go back to the notebook, and run the following. Note that there is a placeholder
    for the run ID:


    ```

    loaded_model = mlflow.sklearn.load_model("runs:/YOUR_RUNID_HERE/log_reg_model")

    ```


    To better understand what this path is, let’s split it up into three sections:
    the format (`runs:/)`, the run ID (`YOUR_RUNID_HERE`), and the model name that
    you used when you logged it (`log_reg_model)`.


    In our case, our run ID was 3862eb3bd89b43e8ace610c521d974e6, so our cell looks
    like Figure [4-21](#499842_1_En_4_Chapter.xhtml#Fig21). Ensure your code looks
    somewhat like Figure [4-21](#499842_1_En_4_Chapter.xhtml#Fig21), with the only
    difference being the run ID that you chose since it will be different from ours.


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig21_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig21_HTML.jpg)


    Figure 4-21


    The code to load a model that we logged using the specific run ID we logged it
    in along with the model’s name we used when we logged it


    This is now the same model that you had when MLFlow logged it in the first place.
    With this, you can call something like `.score()` and see that it’s the same as
    during training:


    ```

    loaded_model.score(x_test, y_test)

    ```


    This outputs the accuracy as the model is evaluated on the test set. If this truly
    is the same model, then the accuracy should match what was output earlier during
    the evaluation portion of the model run.


    Refer to Figure [4-22](#499842_1_En_4_Chapter.xhtml#Fig22) to see the output.


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig22_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig22_HTML.jpg)


    Figure 4-22


    This is the evaluation accuracy of the loaded model after evaluation on the test
    sets. If you compare this with Figure [4-11](#499842_1_En_4_Chapter.xhtml#Fig11),
    you can see that the numbers more or less match, disregarding rounding


    As you can see, this value matches the evaluation accuracy from Figure [4-11](#499842_1_En_4_Chapter.xhtml#Fig11).


    Now you know how to load a model from a specific MLFlow run.


    With that, you’ve seen some of the functionality that MLFlow provides and how
    it can help in keeping your prototyping experiments much more organized. As you
    will see shortly, this entire pipeline that you just explored is pretty much all
    you need to recreate the train, test, validate pipeline that you saw earlier.
    Before you move on to looking at how you can use MLFlow with other frameworks,
    let’s go over how you can use MLFlow functionality to vastly improve the model
    validation process.


    ### Model Validation (Parameter Tuning) with MLFlow


    #### Parameter Tuning – Broad Search


    Just like in Chapter [2](#499842_1_En_2_Chapter.xhtml), you will use a script
    to help with model validation with respect to hyperparameter tuning. The tuning
    script will largely remain the same, except for a few modifications where MLFlow
    code has been added in.


    Run the following code to set the range of anomaly weights and to set the number
    of folds:


    ```

    anomaly_weights = [1, 5, 10, 15]

    num_folds = 5

    kfold = KFold(n_splits=num_folds, shuffle=True, random_state=2020)

    ```


    The code should look like Figure [4-23](#499842_1_En_4_Chapter.xhtml#Fig23).


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig23_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig23_HTML.jpg)


    Figure 4-23


    The code to determine the list of anomaly weights to perform validation over,
    to determine the number of folds, and to initialize the KFolds generator based
    on the number of folds


    Now, paste the following. This is the first half of the entire function:


    ```

    mlflow.set_experiment("sklearn_creditcard_broad_search")

    logs = []

    for f in range(len(anomaly_weights)):

    fold = 1

    accuracies = []

    auc_scores= []

    for train, test in kfold.split(x_validate, y_validate):

    with mlflow.start_run():

    weight = anomaly_weights[f]

    mlflow.log_param("anomaly_weight", weight)

    class_weights= {

    0: 1,

    1: weight

    }

    sk_model = LogisticRegression(random_state=None,

    max_iter=400,

    solver=''newton-cg'',

    class_weight=class_weights).fit(x_validate[train], y_validate[train])

    for h in range(40): print(''-'', end="")

    print(f"\nfold {fold}\nAnomaly Weight: {weight}")

    train_acc = sk_model.score(x_validate[train], y_validate[train])

    mlflow.log_metric("train_acc", train_acc)

    eval_acc = sk_model.score(x_validate[test], y_validate[test])

    preds = sk_model.predict(x_validate[test])

    mlflow.log_metric("eval_acc", eval_acc)

    ```


    Here is some more of the code. Make sure this all aligns with the code from above.


    ```

    try:

    auc_score = roc_auc_score(y_validate[test], preds)

    except:

    auc_score = -1

    mlflow.log_metric("auc_score", auc_score)

    print("AUC: {}\neval_acc: {}".format(auc_score, eval_acc))

    accuracies.append(eval_acc)

    auc_scores.append(auc_score)

    log = [sk_model, x_validate[test], y_validate[test], preds]

    logs.append(log)

    mlflow.sklearn.log_model(sk_model, f"anom_weight_{weight}_fold_{fold}")

    fold = fold + 1

    mlflow.end_run()

    print("\nAverages: ")

    print("Accuracy: ", np.mean(accuracies))

    print("AUC: ", np.mean(auc_scores))

    print("Best: ")

    print("Accuracy: ", np.max(accuracies))

    print("AUC: ", np.max(auc_scores))

    ```


    First, let’s look at what that giant chunk of code looks like in a cell. Ensure
    your code and alignment matches Figure [4-24](#499842_1_En_4_Chapter.xhtml#Fig24).


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig24_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig24_HTML.jpg)


    Figure 4-24


    The entire validation script from Chapter [2](#499842_1_En_2_Chapter.xhtml) with
    some MLFlow code additions to log everything during the validation process


    Now, let’s run this script. It should log the parameter for the anomaly weight
    and all of the metrics that you specified for every fold generated. When the script
    finishes, go to your MLFlow UI and switch the experiment to `sklearn_creditcard_broad_search`
    to see all the runs you just logged. You should see something like in Figure [4-25](#499842_1_En_4_Chapter.xhtml#Fig25).


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig25_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig25_HTML.jpg)


    Figure 4-25


    The output you should see after the validation experiment has finished. Make sure
    you select the experiment titled sklearn_creditcard_broad_search


    Let’s try sorting this by the AUC score to find the best parameters for the AUC.
    In the `metrics` column, click `auc_score`.


    The action should result in something that looks like Figure [4-26](#499842_1_En_4_Chapter.xhtml#Fig26).


    ![../images/499842_1_En_4_Chapter/499842_1_En_4_Fig26_HTML.jpg](images/499842_1_En_4_Chapter/499842_1_En_4_Fig26_HTML.jpg)


    Figure 4-26'
