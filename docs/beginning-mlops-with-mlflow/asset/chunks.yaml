    data so you can apply a model architecture that is most suitable for it.


    4.  **Feature engineering and data processing:** Now you can use the knowledge
    you gained from analyzing the various features and their relationships to each
    another to potentially construct new features from combinations of several existing
    ones. For example, the Titanic data set is a great example that you can apply
    feature engineering to. In this case, you can take information such as class,
    age, fare, number of siblings, number of parents, and so on to create as many
    features as you can think up.


    Feature engineering is really about giving your model a deeper context so it can
    learn the task better. You don’t necessarily want to create random features for
    the sake of it, but something that’s potentially relevant like number of female
    relatives, for example. (Since females were more likely to survive the sinking
    of the Titanic, could it be possible that if a person had more female relatives,
    they were less likely to survive as preference was given to their female relatives
    instead?)


    The next step after feature engineering is data processing, which is a step involving
    all preparations made to process the data to be passed into the model. In the
    context of the snake species image data, this could involve normalizing all the
    values to be between 0 and 1 as well as “batching” the data into groups.


    This step also usually creates several subsets of your initial data: a **training
    data set**, a **testing data set**, and a **validation data set**. We will go
    into more detail on the purpose of each of these data sets later. For now, a **training
    data set** contains the data you want the model to learn from, the **testing data
    set** contains data you want to evaluate the model’s performance on, and the **validation
    data set** is used to either select a model or help tune a model’s hyperparameters
    to draw out a better performance.'
  trans: '

    ## 引言与前提


    欢迎阅读《基于 MLFlow 的 MLOps 入门》！在本书中，我们将以一个示例问题为起点，为其开发机器学习解决方案，并在 AWS SageMaker、Microsoft
    Azure、Google Cloud 和 Datarobots 上实现模型的生产化部署。我们将探讨的问题是对信用卡数据集进行异常检测。本章将探索该数据集，展示其整体结构，并讲解一些分析该数据的技术。该数据集可在[`www.kaggle.com/mlg-ulb/creditcardfraud`](http://www.kaggle.com/mlg-ulb/creditcardfraud)找到。


    如果你已经熟悉如何分析数据和构建机器学习模型，可以直接获取数据集，跳至第 3 章，直接进入 MLOps 部分。


    否则，我们将首先介绍机器学习解决方案通常的创建流程。该流程大致如下：


    1.  **问题识别：** 首先，你需要明确问题是什么，可以采取什么措施，已经采取了哪些措施，以及为什么这是一个值得解决的问题。


    以下是一个问题示例：一种对当地环境有害的入侵蛇类在某地区泛滥成灾。这种蛇毒性极强，且与当地一种无毒蛇类外形极为相似。此外，入侵物种对当地环境具有破坏性，并在与本地物种的竞争中占据优势。


    作为回应，当地政府发表声明，鼓励市民见即杀之，消灭这种有毒的入侵物种。但问题在于，由于两种蛇极易混淆，市民们也在误杀本地物种。


    对此可以采取什么措施？一个可能的解决方案是利用机器学习的力量，构建一个应用程序来帮助市民识别蛇的种类。已经采取了哪些措施？也许有人发布了一款应用，但在区分两种蛇方面效果不佳，无助于改善现状。也许已经发放了宣传单，但仅凭一张图片很难准确识别每一个物种的个体。


    为什么这是一个值得解决的问题？本地物种对当地环境至关重要。误杀错误物种可能会加剧问题，导致入侵物种取代本地物种占据环境优势。因此，构建一个基于计算机视觉的应用，能够区分各种蛇类（尤其是与问题相关的两种蛇），将是帮助市民消灭正确蛇类的绝佳方法。


    2.  **数据收集：** 确定问题后，你需要收集相关数据。在蛇类分类问题中，你需要寻找所在地区各种蛇类的图像。具体地点取决于你的项目规模：是要识别世界上任何地方的蛇，还是仅限佛罗里达州的蛇？


    如果条件允许，收集的数据越多，潜在的训练效果就越好。更多的训练样本可以为模型引入更多样性，从长远来看使其表现更佳。深度学习模型的性能会随着数据量的增加而提升，请牢记这一点。


    3.  **数据分析：** 收集完所有原始数据后，你需要对其进行清洗、处理和格式化，以便更好地分析数据。


    对于图像，这可能涉及应用算法裁剪掉图像中不必要的部分，仅聚焦于蛇本身。此外，你可能还想对图像进行中心裁剪，以去除数据样本中所有多余的视觉信息。无论如何，原始图像数据很少能直接使用；几乎总是需要处理才能获得所需的关联数据。


    对于图像这类非结构化数据，将其格式化为足以分析的形式，可能包括创建一个包含所有相应蛇类及其相关图像数据的目录。然后，你可以查看每个蛇类类别的图像数量，并判断是否需要为特定物种获取更多样本。


    对于结构化数据，例如信用卡数据集，处理原始数据可能意味着删除任何包含空值的条目。为了便于分析，可以应用降维技术，如主成分分析（PCA）。注意：事实证明，信用卡数据集中的大部分数据已经过
    PCA 处理，部分原因是为了保护数据来源用户的隐私。


    至于分析，你可以构建多个不同特征的图表，以了解整体分布情况以及特征之间的相互关系。这样，你就能发现某些特征之间的显著关系，在创建训练数据时加以留意。


    有一些工具可以帮助你找出对标签影响最大的特征，例如**phi-k 相关系数**。通过查看各个特征与目标标签之间的不同相关系数值，你可以更深入地理解数据集中特征之间的关系。如有必要，你还可以从数据中剔除影响不大的特征。在此步骤中，你确实需要扎实地理解数据，以便应用最适合它的模型架构。


    4.  **特征工程与数据处理：** 现在，你可以利用从分析各种特征及其相互关系中获得的知识，通过组合多个现有特征来构建新特征。例如，泰坦尼克号数据集就是一个非常适合应用特征工程的绝佳例子。在这种情况下，你可以利用诸如舱位等级、年龄、票价、兄弟姐妹数量、父母数量等信息，创建尽可能多的特征。


    特征工程的核心在于为模型提供更深入的上下文，使其能更好地学习任务。你不必为了创建特征而随意创建，而应创建一些可能相关的特征，例如女性亲属的数量。（由于女性在泰坦尼克号沉没事件中幸存的可能性更高，那么如果一个人有更多女性亲属，他们幸存的可能性是否会更低，因为优先权给了他们的女性亲属？）


    特征工程之后的下一步是数据处理，这一步涉及为将数据传入模型而进行的所有准备工作。在蛇类图像数据中，这可能包括将所有值归一化到 0 到 1 之间，以及将数据“分批”处理。


    这一步通常还会从初始数据中创建几个子集：**训练数据集**、**测试数据集**和**验证数据集**。我们稍后将详细说明每个数据集的目的。目前，**训练数据集**包含你希望模型从中学习的数据，**测试数据集**包含用于评估模型性能的数据，而**验证数据集**则用于选择模型或帮助调整模型的超参数以获得更佳性能。

    '
- fmt: '5. **Build the model:** Now that the data processing is done, this step is
    all about selecting the proper architecture and building the model. For the snake
    species image data, a good choice would be to use a convolutional neural network
    (CNN) because they work very well for any tasks involving images. From there,
    it is up to you to define the specific architecture of the model with respect
    to its layer composition.


    6. **Training, evaluating, and validating:** When you’re training your CNN model,
    you’re usually passing in batches of data until the entire data makes a full pass
    through the model. From the results of this “forward pass,” calculations are made
    that tell the model how to adjust the weights as they are made going backwards
    across the network in what’s called the “backward pass.” The training process
    is essentially where the model learns how to perform the task and gets better
    at it the more examples it sees.


    After the training process, either the evaluation step or the validation step
    can come next. As long as the testing set and validation set come from different
    distributions (the validation set can be derived from the training set, while
    the testing set can be derived from the original data), the model is technically
    seeing new data in the evaluation and validation processes. The model will never
    learn anything from the evaluation data, so you can test your model anytime.


    Model evaluation is where the model’s performance metrics such as accuracy, precision,
    recall, and so on are evaluated on a data set that it has never seen before. We
    will go into more detail on the evaluation step once it becomes more relevant
    in the next chapter, Chapter [2](#499842_1_En_2_Chapter.xhtml).


    Depending on the context, the exact purpose of validation can differ, along with
    the question of whether or not evaluation should be performed first after training.
    Let’s define several sample scenarios where you would use validation:

    - **Selecting a model architecture:** Of several model types or architectures,
    you use k-fold cross-validation, for example, to quickly train and evaluate each
    of the models on some data partition of the validation set to get an idea of how
    they are performing. This way, you can get a good idea of which model is performing
    best, allowing you to pick a model and continue with the rest of the process.

    - **Selecting the best model:** Of several trained models, you can use something
    like k-fold cross-validation to quickly evaluate each model on the validation
    data to allow you to get an idea of which ones are performing best.

    - **Tuning hyperparameters:** Quickly train a model and test it with different
    hyperparameter setups to get an idea of which configurations work better. You
    can start with a broad range of hyperparameters. From there, you can use the results
    to narrow the range of hyperparameters until you get to a configuration where
    you are satisfied. Models in deep learning, for example, can have many hyperparameters,
    so using validation to tune those hyperparameters can work well in deep learning
    settings. Just beware of diminishing returns. After a certain precision with the
    hyperparameter setting, you’re not going to see that big of a performance boost
    in the model.

    - **Indication of high variance:** This validation data is slightly different
    from the other three examples. In the case of neural networks, this data is derived
    from a small split of the training data. After one full pass of the training data,
    the model evaluates on this validation data to calculate metrics such as loss
    and accuracy.


    If your training accuracy is high and training loss is low, but the validation
    accuracy is low and the validation loss is high, that’s an indication that your
    model suffers from **high variance**. What this means is that your model has not
    learned to generalize what it is “learning” to new data, as the validation data
    in this case is comprised of data it has never seen before. In other words, your
    model is **overfitting**. The model just isn’t recreating the kind of performance
    it gets on the training data on new data that it hasn’t seen before.


    If your model has poor training accuracy and high training loss, then your model
    suffers from **high bias**, meaning it isn’t learning how to perform the task
    correctly on the training data at all.


    This little validation split during the training process can give you an early
    indication of when overfitting is occurring.


    7. **Predicting:** Once the model has been trained, evaluated, and validated,
    it is then ready to make predictions. In the context of the snake species detector,
    this step involves passing in visual images of the snake in question to get some
    prediction back. For example, if the model is supposed to detect the snake, draw
    a box around it, and label it (in an object detection task), it will do so and
    display the results in real time in the application.


    If it just classifies the snake in the picture, the user simply sends their photo
    of a snake to the model (via the application) to get a species classification
    prediction along with perhaps a probability confidence score.


    Hopefully now you have a better idea of what goes on when creating machine learning
    solutions.


    With all that in mind, let’s get started on the example, where you will use the
    credit card data set to build simple anomaly detection models using the data.


    ## Credit Card Data Set


    Before you perform any data analysis, you need to first collect your data. Once
    again, the data set can be found at the following link: [`www.kaggle.com/mlg-ulb/creditcardfraud`](https://www.kaggle.com/mlg-ulb/creditcardfraud).


    Following the link, you should see something like the following in Figure [1-1](#499842_1_En_1_Chapter.xhtml#Fig1).


    ![../images/499842_1_En_1_Chapter/499842_1_En_1_Fig1_HTML.jpg](images/499842_1_En_1_Chapter/499842_1_En_1_Fig1_HTML.jpg)


    Figure 1-1


    Kaggle website page on the credit card data


    From here, you want to download the data set by clicking the Download (144 MB)
    button next to New Notebook. It should take you to a sign-in page if you’re not
    already signed in, but you should be able to download the data set after that.


    Once the zip file finishes downloading, simply extract it somewhere to reveal
    the credit card data set. Now let’s open up Jupyter and explore this data set.
    Before you start this step, let’s go over the exact packages and their versions:


    - Python 3.6.5

    - numpy 1.18.3

    - pandas 0.24.2

    - matplotlib 3.2.1


    To check your package versions, you can run a command like


    ```

    pip show package_name

    ```


    Alternatively, you can run the following code to display the version in the notebook
    itself:


    ```

    import module_name

    print(module_name.__version__)

    ```


    In this case, `module_name` is the name of the package you’re importing, such
    as numpy.'
