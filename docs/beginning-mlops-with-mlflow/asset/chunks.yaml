    The output should look something like in Figure [2-20](#499842_1_En_2_Chapter.xhtml#Fig20).


    ![../images/499842_1_En_2_Chapter/499842_1_En_2_Fig20_HTML.jpg](images/499842_1_En_2_Chapter/499842_1_En_2_Fig20_HTML.jpg)


    Figure 2-20


    Importing the necessary modules and printing their versions. Once again, modules
    imported solely for the purpose of displaying versions are marked with a `#` so
    you may remove them and the `print` statements if desired.


    You will notice that there is some additional code relating to PySpark that you
    have had to define. With PySpark, you must define a Spark context and create a
    Spark session. What this really means is that you are creating a point of connection
    to the Spark engine, enabling the engine to run all of the code relating to Spark
    functionality.


    Let’s now load the data set. PySpark has its own functionality for creating data
    frames, so you won’t be using pandas. Execute the following:


    ```

    data_path = ''data/creditcard.csv''

    df = spark.read.csv(data_path, header = True, inferSchema = True)

    labelColumn = "Class"

    columns = df.columns

    numericCols = columns

    numericCols.remove(labelColumn)

    print(numericCols)

    ```


    You should see something like Figure [2-21](#499842_1_En_2_Chapter.xhtml#Fig21).


    ![../images/499842_1_En_2_Chapter/499842_1_En_2_Fig21_HTML.jpg](images/499842_1_En_2_Chapter/499842_1_En_2_Fig21_HTML.jpg)


    Figure 2-21


    Reading the credit card data set in PySpark and removing the `Class` column from
    the list of columns. This is done because you don’t want the `Class` column to
    be included in the feature vector, as you will see in Figure [2-22](#499842_1_En_2_Chapter.xhtml#Fig22).


    Printing the columns is just to ensure that the label column has been removed
    successfully.


    You can look at the data frame now just to ensure that it has been loaded properly.
    You will have to use built-in functionality to convert to a pandas data frame,
    because Spark data frames are not very clean to look at.


    Look at the following two cells and their outputs:


    ```

    df.show(2)

    ```


    Refer to Figure [2-22](#499842_1_En_2_Chapter.xhtml#Fig22).


    ![../images/499842_1_En_2_Chapter/499842_1_En_2_Fig22_HTML.jpg](images/499842_1_En_2_Chapter/499842_1_En_2_Fig22_HTML.jpg)


    Figure 2-22


    The output of the Spark data frame. Since there are so many columns in the data
    frame, the output is very messy and very difficult to read. Fortunately, there
    is built-in functionality to convert PySpark data frames into pandas data frames,
    making it much easier to view the rows in the Spark data frame.


    Now compare this to the following:


    ```

    df.toPandas().head()

    ```


    Refer to Figure [2-23](#499842_1_En_2_Chapter.xhtml#Fig23).


    ![../images/499842_1_En_2_Chapter/499842_1_En_2_Fig23_HTML.jpg](images/499842_1_En_2_Chapter/499842_1_En_2_Fig23_HTML.jpg)


    Figure 2-23


    Using PySpark’s built-in functionality to convert the spark data frame into a
    pandas data frame for easier viewing. As seen in Figure [2-22](#499842_1_En_2_Chapter.xhtml#Fig22),
    it is extremely hard to read the direct output of a Spark data frame.


    So whenever you want to check a Spark data frame, make sure to convert it to pandas
    if it has a lot of columns.


    The data processing procedure for PySpark is slightly different than in pandas.
    To train the model, you must pass in a vector called `features`. Take a look at
    the following code:


    ```

    stages = []

    assemblerInputs = numericCols

    assembler = VectorAssembler(inputCols=assemblerInputs, outputCol="features")

    stages += [assembler]

    dfFeatures = df.select(F.col(labelColumn).alias(''label''), *numericCols )

    ```


    This defines the inputs to the assembler so that it knows what columns to transform
    into the `features` vector.


    From here, let’s add to the cell above and create the normal and anomaly data
    splits as with the scikit-learn example.


    ```

    normal = dfFeatures.filter("Class == 0").sample(withReplacement=False, fraction=0.5,
    seed=2020)

    anomaly = dfFeatures.filter("Class == 1")

    normal_train, normal_test = normal.randomSplit([0.8, 0.2], seed = 2020)

    anomaly_train, anomaly_test = anomaly.randomSplit([0.8, 0.2], seed = 2020)

    ```


    The cell should look like Figure [2-24](#499842_1_En_2_Chapter.xhtml#Fig24).


    ![../images/499842_1_En_2_Chapter/499842_1_En_2_Fig24_HTML.jpg](images/499842_1_En_2_Chapter/499842_1_En_2_Fig24_HTML.jpg)


    Figure 2-24


    Constructing the `VectorAssembler` that will be used later to create a feature
    vector from the input data. You also create a normal and anomaly data split similar
    to how it was done in scikit-learn, and split it in a similar fashion into training
    and testing subsets.


    Just like in the scikit-learn example, you combine the respective normal and anomaly
    splits to form your training and testing sets. This time, however, you won’t have
    a validation set, so you are looking at an 80-20 split between the training and
    testing data.


    ```

    train = normal_train.union(anomaly_train)

    test = normal_test.union(anomaly_test)

    ```


    Refer to Figure [2-25](#499842_1_En_2_Chapter.xhtml#Fig25) to see the cell.


    ![../images/499842_1_En_2_Chapter/499842_1_En_2_Fig25_HTML.jpg](images/499842_1_En_2_Chapter/499842_1_En_2_Fig25_HTML.jpg)


    Figure 2-25


    Creating the training and testing sets in a similar manner to how you did it in
    scikit-learn, but with PySpark’s functionality.


    Let’s finish the rest of the pipeline and create the `feature` vector:


    ```

    pipeline = Pipeline(stages = stages)

    pipelineModel = pipeline.fit(dfFeatures)

    train = pipelineModel.transform(train)

    test = pipelineModel.transform(test)

    selectedCols = [''label'', ''features''] + numericCols

    train = train.select(selectedCols)

    test = test.select(selectedCols)

    print("Training Dataset Count: ", train.count())

    print("Test Dataset Count: ", test.count())

    ```


    Refer to Figure [2-26](#499842_1_En_2_Chapter.xhtml#Fig26) to see the output.


    ![../images/499842_1_En_2_Chapter/499842_1_En_2_Fig26_HTML.jpg](images/499842_1_En_2_Chapter/499842_1_En_2_Fig26_HTML.jpg)


    Figure 2-26


    Using a pipeline to create a feature vector from the data frame. This feature
    vector is what the logistic regression model will train on.


    ### Model Training


    You can now define and train the model:


    ```

    lr = LogisticRegressionPySpark(featuresCol = ''features'', labelCol = ''label'',
    maxIter=10)

    lrModel = lr.fit(train)

    trainingSummary = lrModel.summary

    pyspark_auc_score = trainingSummary.areaUnderROC

    ```


    Refer to Figure [2-27](#499842_1_En_2_Chapter.xhtml#Fig27) to see the above code
    in a cell.


    ![../images/499842_1_En_2_Chapter/499842_1_En_2_Fig27_HTML.jpg](images/499842_1_En_2_Chapter/499842_1_En_2_Fig27_HTML.jpg)


    Figure 2-27


    Defining the PySpark logistic regression model, training it, and finding the AUC
    score using the built-in function of the model.'
