  trans: "\n## 引言\n\n在上一章中，我们介绍了如何将模型部署到 Microsoft Azure、通过更新或删除事件进行管理以及查询模型。本章，我们将探讨如何使用\
    \ Google Cloud 实现模型的生产化运营。\n\nMLFlow 并未像支持 AWS SageMaker 和 Microsoft Azure 那样，为在\
    \ Google Cloud 中部署提供显式支持，因此你的操作方式将与前面两章中模型生产化运营的方式略有不同。\n\n这一次，你将使用与第 4 章相同的模型服务功能，只不过会将其托管在一台可通过互联网访问的\
    \ Google Cloud 机器上。然而，这种方式下的部署速度要快得多，因为你无需等待端点的创建。此外，一旦设置好机器，更换模型就变得非常简单，并且你可以通过使用不同的端口来服务多个模型。\n\
    \n值得注意的是，Google Cloud 拥有一系列专用于机器学习的先进工具和功能，例如 Kubeflow。Kubeflow 是一个工具，它允许你将机器学习生命周期集成到\
    \ Kubernetes 中。因此，你所有的机器学习管道都通过 Kubernetes 进行管理。鉴于 Kubernetes 是由 Google 开发的，Kubeflow\
    \ 也集成到了 Google Cloud 平台中。在本章中，我们只介绍如何部署 MLFlow 记录的模型。我们不会深入探讨任何有助于管理机器学习生命周期的平台特定工具。\n\
    \n在开始之前，有一个**重要的前提条件**：\n\n*   下载并安装 Google Cloud SDK，以便使用 CLI 连接到你的服务器。\n\n具体来说，本章将涵盖以下内容：\n\
    \n*   **配置 Google：** 这可能是整个部署过程中最困难的一步。首先，你需要设置一个存储桶，并将 `mlruns` 文件夹的内容推送到云端存储。\n\
    \n    接下来，你需要设置一台虚拟机，用于在部署模型时托管你的服务器。这包括安装 Conda 和 MLFlow。\n\n    最后，你需要设置防火墙，允许你的服务器通过\
    \ MLFlow 使用的默认端口 5000 进行入站访问，这样你才能通过 Jupyter notebook 实际连接到这台服务器。\n\n*   **部署和查询模型：**\
    \ 在此步骤中，你将检查 IP 地址、选择一个运行记录，并启动代码来服务模型。然后，你将查询模型，并同时运行批量查询脚本。\n\n*   **更新和移除部署：**\
    \ 在此步骤中，你将停止部署，然后简单地使用不同的模型运行记录重新运行模型服务脚本，以实现模型切换功能。更新模型后，移除部署就像停止模型服务一样简单。\n\n\
    *   **清理：** 在此步骤中，你将检查所有使用过的新服务，并将其全部删除，以免产生任何费用。\n\n那么，让我们开始吧！\n\n## 配置 Google\n\
    \n使用 Google Cloud 部署模型所涉及的大部分工作实际上都花在了配置过程中。一旦你设置好存储和托管模型的机器，模型服务就变成了一项极其简单的任务。要切换模型，你只需要更改模型运行记录，剩下的交给\
    \ MLFlow 处理即可。\n\n至于模型的存储位置，你将使用 Google Cloud Storage。同样，这实现了类似于将运行记录存储在 Amazon\
    \ S3 存储桶或 Azure Blob 中的功能。将所有运行记录推送到云端的目的，是为了有一个集中式的存储容器来保存模型。这样，世界各地的任何人都可以访问它们，并且不会出现你的运行记录副本与他人版本不一致的问题。从某种意义上说，这起到了模型注册表的作用，只是没有\
    \ MLFlow 模型注册表的附加功能。\n\n### 存储桶\n\n那么，让我们开始吧。首先，打开 Google Cloud 门户。你应该会看到类似图 7-1\
    \ 的界面。不过请注意，Google Cloud 也在不断更新，因此你的门户屏幕可能看起来有所不同。\n\n![../images/499842_1_En_7_Chapter/499842_1_En_7_Fig1_HTML.jpg](img/499842_1_En_7_Fig1_HTML.jpg)\n\
    \n图 7-1\n\n我们的 Google Cloud 门户屏幕外观\n\n注意屏幕左侧的滚动条。你可以在这里查看 Google Cloud 提供的服务。滚动到标有“存储”的部分，然后点击名为“存储”的服务。你应该会看到类似图\
    \ 7-2 的界面。\n\n![../images/499842_1_En_7_Chapter/499842_1_En_7_Fig2_HTML.jpg](img/499842_1_En_7_Fig2_HTML.jpg)\n\
    \n图 7-2\n\n与你可能看到的界面类似。在你的情况下，这里可能没有任何存储桶\n\n点击标有“创建存储桶”的按钮。输入 `mlops-storage`。\n\
    \n接下来，在要求选择位置类型的地方，选择“区域”选项以获得最低成本。请参考图 7-3。\n\n![../images/499842_1_En_7_Chapter/499842_1_En_7_Fig3_HTML.jpg](img/499842_1_En_7_Fig3_HTML.jpg)\n\
    \n图 7-3\n\n为你的存储桶指定存储选项。选择“区域”以保持最低成本，尽管考虑到你要推送的数据量，实际成本非常低\n\n保持其余选项不变，然后点击“创建”按钮。你现在应该会看到类似图\
    \ 7-4 的界面。\n\n![../images/499842_1_En_7_Chapter/499842_1_En_7_Fig4_HTML.jpg](img/499842_1_En_7_Fig4_HTML.jpg)\n\
    \n图 7-4\n\n创建后你的存储桶可能的样子\n\n接下来，你需要将 MLFlow 实验（`mlruns` 目录的内容）作为文件夹上传，因此点击“上传文件夹”，并上传\
    \ `mlruns` 目录内的所有文件夹。你可以省略名为 `.trash` 的文件夹。在我们的例子中，我们只**上传了使用 scikit-learn 的实验**，并省略了其余部分，因为我们不会用到其他实验。\n\
    \n完成后，你应该会看到类似图 7-5 的界面。\n\n![../images/499842_1_En_7_Chapter/499842_1_En_7_Fig5_HTML.jpg](img/499842_1_En_7_Fig5_HTML.jpg)\n\
    \n图 7-5\n\n上传 mlruns 目录内容后的存储桶。为了节省成本，我们只上传了使用 scikit-learn 的实验\n\n至此，你已经完成了存储的配置。接下来要配置的是托管模型的虚拟机。\n"
- fmt: '### Configuring the Virtual Machine


    After going back to the portal, scroll to the Compute section and click the Compute
    Engine option. You should see something like Figure [7-6](#499842_1_En_7_Chapter.xhtml#Fig6).
    You want to make sure you’re in the portal for the service titled VM Instances.


    ![../images/499842_1_En_7_Chapter/499842_1_En_7_Fig6_HTML.jpg](images/499842_1_En_7_Chapter/499842_1_En_7_Fig6_HTML.jpg)


    Figure 7-6: What your VM Instances screen may look like. In our case, we already
    have another machine running, but that is irrelevant since we are creating a new
    machine.


    Now, click Create Instance and you should see something like Figure [7-7](#499842_1_En_7_Chapter.xhtml#Fig7).


    ![../images/499842_1_En_7_Chapter/499842_1_En_7_Fig7_HTML.jpg](images/499842_1_En_7_Chapter/499842_1_En_7_Fig7_HTML.jpg)


    Figure 7-7: The options you can fill in when creating your VM machine instance.
    You should match the selections shown in the figure to ensure consistency with
    our results.


    In our case, we filled in or selected the options that we want our VM machine
    to use. We named our machine `mlops-server`, selected our region (it autoselects
    a zone for you), and specified that we want to use Ubuntu 18.04 LTS. Finally,
    at the end, we want to allow HTTPS traffic from the internet.


    Finally, when finished, you should be able to see your VM machine on the list
    of machines. What you want to do now is to open your VM machine instance by clicking
    the name `mlops-server`. This should take you to a screen that looks like Figure
    [7-8](#499842_1_En_7_Chapter.xhtml#Fig8).


    ![../images/499842_1_En_7_Chapter/499842_1_En_7_Fig8_HTML.jpg](images/499842_1_En_7_Chapter/499842_1_En_7_Fig8_HTML.jpg)


    Figure 7-8: What you should see when you click `mlops-server`. Notice the box
    that says SSH. You will use that shortly.


    Now look at the box that says SSH. There should be a little down arrow indicating
    that it is a drop-down list of something. Click that arrow and select the View
    gcloud command option. Refer to Figure [7-9](#499842_1_En_7_Chapter.xhtml#Fig9).


    ![../images/499842_1_En_7_Chapter/499842_1_En_7_Fig9_HTML.jpg](images/499842_1_En_7_Chapter/499842_1_En_7_Fig9_HTML.jpg)


    Figure 7-9: The drop-down options for connecting to this VM instance.


    This should take you to a popup window that looks like Figure [7-10](#499842_1_En_7_Chapter.xhtml#Fig10).
    You have two options: running that command in a new instance of the Google Cloud
    SDK CLI (in our case, we had to search “Google Cloud SDK Shell” and it opened
    a configured Google Cloud terminal instance), or running it through a shell directly
    on the portal page itself. You can do either option, as both connect to the VM
    anyway.


    ![../images/499842_1_En_7_Chapter/499842_1_En_7_Fig10_HTML.jpg](images/499842_1_En_7_Chapter/499842_1_En_7_Fig10_HTML.jpg)


    Figure 7-10: The command that lets you connect to the VM via SSH. You can also
    run it within the portal page itself if you’d like.


    Copy and paste that command in your terminal to connect to the VM. When finished
    running, you should see something like Figure [7-11](#499842_1_En_7_Chapter.xhtml#Fig11),
    where it opens up a PuTTY instance of the actual shell inside the VM.


    ![../images/499842_1_En_7_Chapter/499842_1_En_7_Fig11_HTML.jpg](images/499842_1_En_7_Chapter/499842_1_En_7_Fig11_HTML.jpg)


    Figure 7-11: The result of running the `gcloud` command that the portal provided.
    On the right, you can see a PuTTY terminal where you have the shell open inside
    the VM.


    This is where you must configure your VM so that it can host your MLFlow models.


    First, run the following commands:


    ```

    sudo apt update

    sudo apt upgrade

    ```


    Answer “y” to any prompts.


    Once finished, you can now install Conda. Without Conda, MLFlow won’t be able
    to reconstruct the environment that the MLFlow model was logged in. This is part
    of MLFlow’s modularization. In the case of SageMaker and Azure, you built containers
    that, as their name suggests, “contain” these Conda environments already. This
    way, SageMaker does not have to reinstall any Conda packages once the container
    is in the cloud. It simply has to run an instance of the container and it already
    has everything configured.


    First, find out how to install Anaconda on Linux by going to its webpage. An install
    link should be provided. Copy the link and paste it somewhere. You will retrieve
    that link using a command.


    Run the following one at a time:


    ```

    cd /tmp

    curl -O https://repo.anaconda.com/archive/Anaconda3-2020.07-Linux-x86_64.sh

    ```


    You should see something like Figure [7-12](#499842_1_En_7_Chapter.xhtml#Fig12).


    ![../images/499842_1_En_7_Chapter/499842_1_En_7_Fig12_HTML.jpg](images/499842_1_En_7_Chapter/499842_1_En_7_Fig12_HTML.jpg)


    Figure 7-12: The output of fetching the Anaconda installation script.


    Next, let’s install Anaconda by running the following. You can type in `bash Anaconda`
    and press Tab to autofill the rest of the script name.


    ```

    bash https://repo.anaconda.com/archive/Anaconda3-2020.07-Linux-x86_64.sh

    ```


    It should ask you to look through the license agreement. At the end, answer yes,
    and press Enter to confirm the default installation location. Conda should then
    proceed with the installation. Answer yes to any further prompts. Once it’s done,
    restart the shell (close the PuTTY client and rerun the command or cloud shell),
    and you should now have Conda fully configured.


    As you will now see, Conda has already started the base environment. Let’s create
    a new environment by running the following code:


    ```

    conda create -n mlflow python=3.7

    ```


    Answer “y” to any following prompts, and you should see something like Figure
    [7-13](#499842_1_En_7_Chapter.xhtml#Fig13).


    ![../images/499842_1_En_7_Chapter/499842_1_En_7_Fig13_HTML.jpg](images/499842_1_En_7_Chapter/499842_1_En_7_Fig13_HTML.jpg)


    Figure 7-13: If you see this, then your Conda environment has successfully installed.


    Next, you will install the following packages: `mlflow` and `google-cloud-storage`.
    The former is self-explanatory: you will need MLFlow to do anything with MLFlow.
    You need `google-cloud-storage` because you are going to access your runs from
    the Google storage bucket from earlier.


    Run the following:


    ```

    conda activate mlflow

    pip install mlflow google-cloud-storage

    ```


    Running this code should also install all of the dependencies. In the future,
    should you need to install any more dependencies, it’s as simple as activating
    the `mlflow` environment and using `pip install` to get any more packages or update
    existing packages.


    Once it has finished installing everything, you should see something like Figure
    [7-14](#499842_1_En_7_Chapter.xhtml#Fig14).


    ![../images/499842_1_En_7_Chapter/499842_1_En_7_Fig14_HTML.jpg](images/499842_1_En_7_Chapter/499842_1_En_7_Fig14_HTML.jpg)


    Figure 7-14: The final output after finishing installing the necessary packages
    in the Conda environment.


    With that, you have fully configured your VM. All that is left is to configure
    the firewall.'
