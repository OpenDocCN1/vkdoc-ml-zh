    现在你已经完成了训练和评估函数的定义，以及要记录的指标，接下来可以启动一个 MLFlow 运行并构建模型：


    ```

    lr = LogisticRegression(featuresCol = ''features'', labelCol = ''label'', maxIter=10)

    mlflow.set_experiment("PySpark_CreditCard")

