- fmt: '# Introduction and Premise


    Welcome to *Beginning MLOps with MLFlow*! In this book, we will be taking an example
    problem, developing a machine learning solution to it, and operationalizing our
    model on AWS SageMaker, Microsoft Azure, Google Cloud, and Datarobots. The problem
    we will be looking at is the issue of performing anomaly detection on a credit
    card data set. In this chapter, we will explore this data set and show the overall
    structure while explaining a few techniques on analyzing this data. This data
    set can be found at [`www.kaggle.com/mlg-ulb/creditcardfraud`](http://www.kaggle.com/mlg-ulb/creditcardfraud).


    If you are already familiar with how to analyze data and build machine learning
    models, feel free to grab the data set and skip ahead to 3 to jump right into
    MLOps.


    Otherwise, we will first go over the general process of how machine learning solutions
    are generally created. The process goes something like this:


    1. **Identification of the problem:** First of all, you need to have an idea of
    what the problem is, what can be done about it, what has been done about it, and
    why it is a problem worth solving.


    Here’s an example of a problem: an invasive snake species harmful to the local
    environment has infested a region. This species is highly venomous and looks very
    similar to a harmless species of snake native to this same environment. Furthermore,
    the invasive species is destructive to the local environment and is outcompeting
    the local species.


    In response, the local government has issued a statement encouraging citizens
    to go out and kill the venomous, invasive species on sight, but the problem is
    that it turns out citizens have been killing the local species as well due to
    how easy it is to confuse the two species.


    What can be done about this? A possible solution is to use the power of machine
    learning and build an application to help citizens identify the snake species.
    What has been done about it? Perhaps someone released an app that does a poor
    job at distinguishing the two species, which doesn’t help remedy the current situation.
    Perhaps fliers have been given out, but it can be hard to identify every member
    of a species correctly based on just one picture.


    Why is it a problem worth solving? The native species is important to the local
    environment. Killing the wrong species can end up exacerbating the situation and
    lead to the invasive species claiming the environment over the native species.
    And so building a computer vision-based application that can discern between the
    various snake species (and especially the two species relevant to the problem)
    could be a great way to help citizens get rid of the right snake species.


    2. **Collection of data:** After you’ve identified the problem, you want to collect
    the relevant data. In the context of the snake species classification problem,
    you want to find images of various snake species in your region. The location
    depends on how big of a scale your project will operate on. Is it going to identify
    any snake in the world? Just snakes in Florida?


    If you can afford to do so, the more data you collect, the better the potential
    training outcomes will be. More training examples can introduce increased variety
    to your model, making it better in the long run. Deep learning models scale in
    performance with large volumes of data, so keep that in mind as well.


    3. **Data analysis:** Once you’ve collected all the raw data, you want to clean
    it up, process it, and format it in a way that allows you to analyze the data
    better.


    For images, this could be something like applying an algorithm to crop out unnecessary
    parts of the image to focus solely on the snake. Additionally, maybe you want
    to center-crop the image to remove all the extra visual information in the data
    sample. Either way, raw image data is rarely ever in good enough condition to
    be used directly; it almost always requires processing to get the relevant data
    you want.


    For unstructured data like images, formatting this data in a way good enough to
    analyze it could be something like creating a directory with all of the respective
    snake species and the relevant image data. From there, you can look at the count
    of images for each snake species class that you have and determine if you need
    to retrieve more samples for a particular species or not.


    For structured data, say the credit-card data set, processing the raw data can
    mean something like getting rid of any entries with null values in them. Formatting
    them in a way so you can analyze them better can involve dimensionality-reduction
    techniques such as principal component analysis (PCA). Note: It turns out that
    most of the data in the credit card data set has actually been processed with
    PCA in part to preserve the privacy of the users the data has been extracted from.


    As for the analysis, you can construct multiple graphs of different features to
    get an idea of the overall distribution and how the features look plotted against
    each other. This way, you can see any significant relationships between certain
    features that you might keep in mind when creating your training data.


    There are some tools you can use in order to find out what features have the greatest
    influence on the label, such as `phi-k correlation`. By allowing you to see the
    different correlation values between the individual features and the target label,
    you can gain a deeper understanding of the relationships between the features
    in this data set. If needed, you can also drop features that aren’t very influential
    from the data. In this step, you really want to get a solid understanding of your
    data so you can apply a model architecture that is most suitable for it.


    4. **Feature engineering and data processing:** Now you can use the knowledge
    you gained from analyzing the various features and their relationships to each
    another to potentially construct new features from combinations of several existing
    ones. For example, the Titanic data set is a great example that you can apply
    feature engineering to. In this case, you can take information such as class,
    age, fare, number of siblings, number of parents, and so on to create as many
    features as you can think up.


    Feature engineering is really about giving your model a deeper context so it can
    learn the task better. You don’t necessarily want to create random features for
    the sake of it, but something that’s potentially relevant like number of female
    relatives, for example. (Since females were more likely to survive the sinking
    of the Titanic, could it be possible that if a person had more female relatives,
    they were less likely to survive as preference was given to their female relatives
    instead?)


    The next step after feature engineering is data processing, which is a step involving
    all preparations made to process the data to be passed into the model. In the
    context of the snake species image data, this could involve normalizing all the
    values to be between 0 and 1 as well as “batching” the data into groups.


    This step also usually creates several subsets of your initial data: a `training
    data set`, a `testing data set`, and a `validation data set`. We will go into
    more detail on the purpose of each of these data sets later. For now, a `training
    data set` contains the data you want the model to learn from, the `testing data
    set` contains data you want to evaluate the model’s performance on, and the `validation
    data set` is used to either select a model or help tune a model’s hyperparameters
    to draw out a better performance.'
