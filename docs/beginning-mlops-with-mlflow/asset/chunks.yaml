- fmt: '### Model Evaluation


    Once the model has finished training, run the evaluation code:


    ```

    predictions = lrModel.transform(test)

    y_true = predictions.select([''label'']).collect()

    y_pred = predictions.select([''prediction'']).collect()

    evaluations = lrModel.evaluate(test)

    accuracy = evaluations.accuracy

    ```


    Add the following code as well to display the metrics:


    ```

    print(f"AUC Score: {roc_auc_score(y_pred, y_true):.3%}")

    print(f"PySpark AUC Score: {pyspark_auc_score:.3%}")

    print(f"Accuracy Score: {accuracy:.3%}")

    ```


    Refer to Figure [2-28](#499842_1_En_2_Chapter.xhtml#Fig28) to see the output.


    ![../images/499842_1_En_2_Chapter/499842_1_En_2_Fig28_HTML.jpg](images/499842_1_En_2_Chapter/499842_1_En_2_Fig28_HTML.jpg)


    Figure 2-28


    The output metrics. The AUC score is calculated using `scikit-learn`’s scoring
    algorithm, while the PySpark AUC score metric comes from the training summary
    of the PySpark model. Finally, the accuracy score is also outputted.


    You can see that the AUC score and the accuracy are quite high, so let’s examine
    the graphs.


    First, let’s look at the ROC curve:


    ```

    pyspark_roc = trainingSummary.roc.toPandas()

    plt.xlabel(''False Positive Rate'')

    plt.ylabel(''True Positive Rate'')

    plt.title(''PySpark ROC Curve'')

    plt.plot(pyspark_roc[''FPR''],pyspark_roc[''TPR''])

    ```


    To see the graph, refer to Figure [2-29](#499842_1_En_2_Chapter.xhtml#Fig29).


    ![../images/499842_1_En_2_Chapter/499842_1_En_2_Fig29_HTML.jpg](images/499842_1_En_2_Chapter/499842_1_En_2_Fig29_HTML.jpg)


    Figure 2-29


    The ROC curve for the PySpark logistic regression model you just trained. A perfect
    ROC curve would have the true positive rate starting at 1.0, where it continues
    right to a false positive rate value of 1.0. This curve is quite close to that,
    hence why its area (AUC) is said to be around 0.97997 by PySpark, keeping in mind
    a perfect AUC score is 1.00.


    The curve looks quite optimal. Let’s now look at the confusion matrix to get a
    detailed idea of how the model performs:


    ```

    conf_matrix = confusion_matrix(y_true, y_pred)

    ax = sns.heatmap(conf_matrix, annot=True,fmt=''g'')

    ax.invert_xaxis()

    ax.invert_yaxis()

    plt.ylabel(''Actual'')

    plt.xlabel(''Predicted'')

    ```


    Refer to Figure [2-30](#499842_1_En_2_Chapter.xhtml#Fig30) to view the confusion
    matrix plot.


    ![../images/499842_1_En_2_Chapter/499842_1_En_2_Fig30_HTML.jpg](images/499842_1_En_2_Chapter/499842_1_En_2_Fig30_HTML.jpg)


    Figure 2-30


    The plotted confusion matrix of the PySpark logistic regression model you just
    trained. The accuracy of correctly labeled points for the normal data is very
    high and is decent for the anomalous data.


    From this, you have a much more detailed account of how the model performed. Looking
    at just the anomalies, you see that the model has a 81.4% accuracy (70/(70+16))
    in predicting anomalies. This is better than the model you trained in `scikit-learn`,
    though you haven’t tuned the hyperparameter to attain maximum performance.


    PySpark does have an option to weight your data, but this is done on a sample-by-sample
    basis. What this means is that instead of passing in a weight dictionary for each
    class, you have to create a column in the data frame with each anomaly being weighted
    a certain amount and each normal point being weighted as 1, for example. By default,
    everything is weighted as 1, so that means the PySpark model may have a greater
    potential in performance than the `scikit-learn` model.


    Moving on to the normal points, you see a really good accuracy of 99.96% (28363/(28363+10)),
    so it is able to identify normal points very well.


    ## Summary


    With the insights you gained from data analysis, you processed the data into training,
    testing, and validation sets in `scikit-learn` and PySpark (you only did a train-test
    split in PySpark, but you could have split the training data into training and
    validation sets just like in `scikit-learn`). From there, you constructed logistic
    regression models in each framework and trained and evaluated on them. You looked
    at accuracy and AUC scores as metrics and looked at the ROC curve and confusion
    matrix to get a better idea of how the model performed. For the `scikit-learn`
    model, you performed k-fold cross-validation to help tune the hyperparameter.
    In the next chapter, you will keep your experiences with data analysis and model
    creation in mind as you learn about MLOps and how you can operationalize your
    models.


    # 3. What Is MLOps?


    In this chapter, we will cover the concepts behind the term “MLOps” and go over
    what it is, why it’s useful, and how it’s implemented.'
