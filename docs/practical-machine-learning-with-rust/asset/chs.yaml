  ## 引言


  本书旨在探索使用 Rust 语言进行机器学习。我们将学习创建机器学习应用程序的复杂性，以及它们如何融入 Rust 的世界观。


  我们将从理解机器学习的一些重要概念以及 Rust 语言的基础知识开始。在后续章节中，我们将深入探讨机器学习的更具体领域，例如数据处理、计算机视觉和自然语言处理；并介绍那些能简化这些领域应用程序创建的
  Rust 库。我们还将探讨如何将这些应用程序部署到本地或云端。


  通过阅读本书，读者将对使用 Rust 创建高计算量库有扎实的理解。掌握了这门神奇语言的知识后，他们可以开始着手创建性能更高、内存更安全、资源消耗更少的应用程序。


  ## 目标读者是谁？


  本书最适合从事工业优化问题、并寻求编写更好代码和创建更好应用程序的程序员。尽管本书不假设读者具备机器学习经验，并会解释所有概念，但最好能有一些机器学习经验，特别是使用
  Python 等主流编程语言的经验。本书不假设读者具备 Rust 知识，因此非常适合对机器学习感兴趣的 Rust 新手开发者，或者对当前生态系统不满意、希望了解其他可用选项的人。


