- "# 1. Rust 基础\n\n在本章中，我们将探索 Rust 作为一种语言，以及 Rust 支持的独特结构和编程模型。我们还将讨论 Rust 最大的卖点，以及是什么让这门语言对机器学习应用程序特别有吸引力。\n\
  \n在概述了 Rust 语言之后，我们将从安装开始。然后我们将转向 Cargo，它是 Rust 的官方包管理器，以及我们如何用 Rust 创建应用程序。之后，我们将研究\
  \ Rust 的编程结构，例如变量、循环结构和所有权模型。本章最后，我们将为 Rust 代码编写单元测试，并展示如何使用标准包管理器运行这些测试。\n\n在本章结束时，你应该对如何用\
  \ Rust 编写和编译简单应用程序有了相当的理解。\n\n## 1.1 为什么选择 Rust？\n\n人们普遍认为，底层系统编程语言和高级应用程序编程语言之间存在差异。公认的观点是，如果你想创建高性能的应用程序并创建在裸机上运行的库，你需要使用\
  \ C 或 C++ 这样的语言；如果你想为业务用例创建应用程序，则需要使用 Java/Python/JavaScript 等语言进行编程。\n\nRust 语言的目标是位于高级语言和低级语言之间的交叉点。接近底层的程序必然直接处理内存，这意味着其中没有垃圾回收机制。在高级语言中，内存是由系统为程序员管理的。\n\
  \n实现垃圾回收是有成本的。同时，我们现有的垃圾回收策略并不完美，在具有自动内存管理的程序中仍然存在内存泄漏的例子。高级语言中内存泄漏的主要原因之一是，当创建包以在高级语言中提供接口，但核心实现却使用低级语言时。例如，Python\
  \ 库 pandas 就有不少内存泄漏。此外，没有证据并不代表证据不存在，因此没有正式证明表明引入垃圾回收策略将消除所有可能的内存泄漏。\n\n另一个问题与引用有关。引用在原理上很容易理解，它们开销低且对于在软件创建中实现开发者效率至关重要。因此，像\
  \ C 和 C++ 这样针对底层软件创建的语言允许无限制地创建引用和修改被引用的对象。\n\n\n\n## 1.2 更好的引用\n\n通常，在对象系统中，对象存在于一个称为堆或对象存储的全局对象空间中。对象可以访问对象存储的哪一部分并没有严格的约束，因为对象引用的传递方式没有限制。这在防止聚合对象的表示暴露时会产生影响。构成聚合对象的组件被认为包含在该聚合对象内部，并且是其表示的一部分。但是，由于对象存储是全局的，通常无法阻止其他对象访问该表示。使用标准的引用语义来强制执行包含的概念是不可能的。\n\
  \n一个更好的解决方案可以是限制所创建的不同类型对象的可见性。这是通过声明所有对象都有一个与之关联的上下文来实现的。从系统根节点出发的所有路径都必须经过对象的所有者。\n\
  \n在 Rust 中，类型维护了一些关键的不变性，这里列出它们。首先，每个存储位置都保证具有以下两种情况之一：\n\n*   1 个可变引用和 0 个不可变引用，或者\n\
  *   0 个可变引用和 n 个不可变引用。\n\n我们将在本章的后面部分看到这如何转化为实际代码。这个不变性通过禁止对单个内存位置进行并发读写，从而防止了并发系统中的竞态条件。然而，仅凭这个不变性本身并不足以保证内存安全，尤其是在存在可移动对象的情况下。例如，由于一个给定的变量在对象被移动后变得不可用，与该变量关联的存储位置可能会被重用或释放。结果，任何先前创建的引用在移动后都将成为悬垂引用。\n\
  \n这个问题也通过 Rust 之前的所有权规则得到了解决。对对象的引用是通过其所有者传递创建的。类型系统保证在引用未完成时，所有者不会在移动后发生变化。相反，类型系统允许在没有未完成引用时更改所有权。本章后面部分将更详细地讨论这方面的例子。\n\
  \n所有刚才提到的内容在机器学习应用中甚至更为重要。训练机器学习应用涉及大量数据，并且数据的变化越多越好，这意味着在训练阶段会创建大量对象。你可能不希望出现内存错误。在模型部署后，创建的模型是矩阵和张量，它们被实现为浮点数集合。即使在不再有用之后，让过去的对象和预测结果悬垂在内存中可能也是不可取的。创建并发系统也有好处。Rust\
  \ 类型保证不会出现竞态条件，因此程序员可以安全地创建试图尽可能分散计算的机器学习应用。\n\n在所有这些关于内存安全和高性能的讨论之外，我们还有诸如类型推断这样的高级特性，因此我们不需要为所有变量编写类型。我们将在本章后面部分看到何时定义类型是重要的。从之前的讨论中得出的另一个有趣点是，在编写\
  \ Rust 代码时，我们并不需要考虑内存。因此，从使用的角度来看，感觉内存正在为我们管理。然后还有其他的结构，如闭包、迭代器和标准库，它们使得用 Rust 编写代码更像是在用高级语言编写。对于机器学习应用来说，这一点至关重要。像\
  \ Python 这样的高级语言之所以在机器学习领域取得成功，是因为该语言的表达能力支持自由形式的实验和开发人员生产力。\n\n在本章中，我们将了解 Rust\
  \ 的基础知识以及使 Rust 成为其自身语言的编程结构。我们主要涵盖诸如结构体和枚举之类的主题，这些主题在这种语言中看起来和感觉上有所不同，并且可能不是我们在这种语言中所期望的。我们将跳过许多重要的事情，例如单独的数据类型，它们与\
  \ C 和 Java 等其他语言类似。Rust 的核心设计之一是，编程感觉应该与更流行的 C 和 Java 相同，这样来自这些语言的程序员就不必进行大量的思维改造，同时还能获得许多以前未曾考虑过的内存优势。\n\
