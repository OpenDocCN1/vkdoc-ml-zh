  pub fn jaccard_index(clusters1: &[HashSet],

  clusters2: &[HashSet]) -> f64 {

  let (n11, n10, n01, n00) = count_pairwise_cooccurence(clusters1, clusters2);

  let denominator = n11 + n10 + n01;

  if denominator > 0.0 {

  return n11 / denominator;

  } else {

  0.0

  }

  }

