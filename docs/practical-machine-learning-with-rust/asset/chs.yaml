  \ 和 xml）加载数据。\n\n*   我们了解了如何通过网络爬虫从互联网上的开放资源创建自己的结构化数据。\n\n*   我们研究了如何从 SQL 和 NoSQL\
  \ 数据源拉取和存储数据。\n\n*   我们还了解了如何使用 datafusion 进行大数据转换，以及使用 ndarray 进行矩阵变换。\n\n接下来，我们将学习如何在更真实的机器学习领域（如计算机视觉和自然语言处理）中工作。\n\
