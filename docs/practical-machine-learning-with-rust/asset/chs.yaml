  请注意其中的区别：我们不考虑实际值为“O”的情况。这是因为该标签表示“其他”，而大多数标签都属于其他类别。因此，如果将其纳入准确率计算，会虚增准确率，使结果优于实际水平。更通用的
  CRF 模型准确率评估方法是使用精确率、召回率和 F1 分数，这些指标同样可以在 Rust 中以类似方式实现。


