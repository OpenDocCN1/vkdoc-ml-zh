  target/debug/myfirstapp\n$ ./target/debug/myfirstapp\nHello, world!\n```\n\n在开发过程中，我们也可以使用\
  \ `cargo run` 命令来简化上述流程。\n\n```\n$ cargo run\nFinished dev [unoptimized + debuginfo]\
  \ target(s) in 0.42s\nRunning `target/debug/myfirstapp`\nHello, world!\n```\n\n\
  ## 1.6 Rust 中的变量\n\n在 Rust 中，变量使用 `let` 关键字定义。变量的类型会被自动推断。请看下一个例子。\n\n```\nlet x\
  \ = \"learning rust\";\nprintln!(\"{}\", x);\n```\n\n`println` 用于查看变量。\n\n这里需要注意\
  \ `println!` 这个特殊结构。当你在函数名后面看到 `!` 符号时，这意味着正在使用一个宏。宏是 Rust 中特殊的元编程结构，这超出了本书的范围。之所以使用\
  \ `println` 宏，是因为 Rust 不支持函数中的可变参数，因此 `println` 必须是一个宏。\n\n我们可以使用以下代码查看变量的类型。\n\n\
  ```\n#![feature(core_intrinsics)]\nfn print_type_of(_: &T) {\nprintln!(\"{}\", unsafe\
  \ { std::intrinsics::type_name::() });\n}\nfn main() {\nlet x = \"learning rust\"\
  ;\nprintln!(\"{}\", x);\nprint_type_of(&x);\n}\n```\n\n不过，这段代码不能在默认的稳定版本中运行，需要在\
  \ nightly 版本中编译。需要启用 nightly 编译器。Nightly 版本是存放不稳定或潜在不稳定代码的地方，因此我们正在讨论的这种语言特性只在 nightly\
  \ 版本中可用。\n\n```\n$ rustup default nightly\n```\n\n现在我们应该能够运行这段代码了。\n\n```\n$ ./variables1\n\
  learning rust\n&str\n```\n\n现在尝试使用不同类型的变量。\n\n```\nlet x = \"learning rust\";\n\
  let y = 6;\nlet z = 3.14;\nprintln!(\"{}\", x);\nprintln!(\"type of x:\");\nprint_type_of(&x);\n\
  println!(\"type of y:\");\nprint_type_of(&y);\nprintln!(\"type of z:\");\nprint_type_of(&z);\n\
  ```\n\n使用上述代码的输出是：\n\n```\n$ ./variables1\nlearning rust\ntype of x:\n&str\ntype\
  \ of y:\ni32\ntype of z:\nf64\n```\n\n### 注意\n\n`i32` 本质上是 32 位整数，`f64` 是 64 位浮点数。我们将在本书中讨论不同类型的数字，但\
  \ Rust 主要遵循不同语言中通用的基本数据类型格式，以便于编译到不同的架构。\n\n### 1.6.1 可变性与遮蔽\n\n使用 `let` 关键字创建的变量是不可变的。根据\
  \ Rust 官方文档，这样做是因为 Rust 的主要关注点之一是安全性。^(¹) 当需要更改变量的值时，我们可以创建可变的变量。这通过将 `mut` 关键字与\
  \ `let` 一起使用来实现。\n\n```\nlet mut x = 32;\nprintln!(\"Current value of x: {}\", x);\n\
  x = 64;\nprintln!(\"Current value of x: {}\", x);\n```\n\n输出是：\n\n```\nCurrent value\
  \ of x: 32\nCurrent value of x: 64\n```\n\n但是，不允许更改变量的类型。\n\n```\nlet mut x = 32;\n\
  println!(\"Current value of x: {}\", x);\nx = \"rust\";\nprintln!(\"Current value\
  \ of x: {}\", x);\n```\n\n因此，对于像上面这样的例子，我们会得到一个错误，如下所示。\n\n```\n$ rustc variables3.rs\n\
  error[E0308]: mismatched types\n--> variables3.rs:4:9\n|\n4 |       x = \"rust\"\
  ;\n|       ^^^^^^ expected integer, found reference\n|\n= note: expected type `{integer}`\n\
  found type `&'static str`\nerror: aborting due to previous error\nFor more information\
  \ about this error, try `rustc --explain E0308`.\n```\n\n注意，在将 `x` 赋值为字符串的地方，编译器告诉我们代码应该是一个整数。现在传入字符串是行不通的。\n\
  \n对于简单的计算，我们也可以使用遮蔽原则。当一个在外部作用域中声明的变量与在内部作用域中使用的变量同名时，就会发生遮蔽。因此，像下面这样的代码是完全有效的。\n\
  \n```\nfn main() {\nlet x = 1;\nlet x = x + 2;\nlet x = x * 2;\nprintln!(\"Value\
  \ of x: {}\", x);\n}\n```\n\n上述代码的输出是 `Value of x: 6`。\n\n### 1.6.2 变量作用域\n\n此外，在这种情况下，需要严格维护变量的作用域。让我们看一个例子。\n\
  \n```\n// variables5.rs\nfn main() {\nlet x = 5;\nif 4 < 10 {\nlet x = 10;\nprintln!(\"\
  Inside if x = {:?}\", x);\n}\nprintln!(\"Outside if x = {:?}\", x);\n}\n```\n\n\
  检查输出。由于内部变量 `x` 的作用域在第一个打印语句之后结束，因此第一个打印语句打印出 `x` 为 10，而外部的打印语句打印出 5。\n\n```\n$\
  \ ./variables5\nInside if x = 10\nOutside if x = 5\n```\n\n如你所见，变量的作用域得到了维护，一旦 `if`\
  \ 语句的作用域结束，变量 `x` 就恢复到之前的状态。\n\n## 1.7 数据类型\n\n这些数据类型与你会在其他语言中找到的大致相似。请查看以下列表。\n\
  \n*   bool : 布尔类型。\n*   char : 字符类型。\n*   i8 : 8 位有符号整数类型。\n*   i16 : 16 位有符号整数类型。\n\
  *   i32 : 32 位有符号整数类型。\n*   i64 : 64 位有符号整数类型。\n*   isize : 指针大小的有符号整数类型。\n*   u8\
  \ : 8 位无符号整数类型。\n*   u16 : 16 位无符号整数类型。\n*   u32 : 32 位无符号整数类型。\n*   u64 : 64 位无符号整数类型。\n\
  *   usize : 指针大小的无符号整数类型。\n*   f32 : 32 位浮点类型。\n*   f64 : 64 位浮点类型。\n*   array :\
  \ 固定大小的数组，表示为 `[T; N]`，其中 T 是元素类型，N 是非负的编译时常量大小。\n*   slice : 一个连续序列的动态大小视图，表示为\
  \ `[T]`。\n*   str : 字符串切片。\n*   tuple : 有限异构序列 `(T, U, ...)`。\n\n## 1.8 函数\n\n函数使用\
  \ `fn` 关键字定义。定义函数时，需要说明函数的签名和参数。对于 void 函数，我们可以省略函数签名。回想一下，我们在 `main` 函数的情况下没有提供任何签名。要从函数返回，没有显式的\
  \ `return` 语句。相反，返回语句的末尾不能有分号。\n\n```\nfn main() {\nprintln!(\"{:?}\", square_of(-5));\n\
  }\nfn square_of(x: i32) -> i32 {\nprintln!(\"x = {:?}\", x);\nx.pow(2)\n}\n// output:\n\
  //     x = -5\n//     25\n```\n\n## 1.9 条件判断\n\n有两种方法可以进行条件检查。一种是普通的 `if` 块，另一种是模式匹配。\n\
  \n\n\n### 1.9.1 条件判断（If Conditions）\n\n条件判断的工作方式与其他语言类似。唯一可能让你感到意外的是，在 Rust 中，`if`\
  \ 代码块可以返回一个语句。这一点非常方便，因为正如你之前所见，Rust 有着严格的作用域规则。\n\n```\n// 用法：\n// $ ./conditions\n\
  // \"cold\"\nfn main() {\nlet place = \"himalayas\";\nlet weather = if place ==\
  \ \"himalayas\" {\n\"cold\"\n} else {\n\"hot\"\n};\nprintln!(\"{:?}\", weather);\n\
  }\n```\n\n### 注意\n\n使用 `{:?}` 打印变量的 `println!` 语句，只有在变量类型实现了 `Debug` trait 时才能正常工作。我们将在后续章节中为不同的类实现\
  \ `Debug`，这将是本书中打印变量的标准方法。\n\n### 1.9.2 模式匹配（Pattern Matching）\n\n对于 1.9.1 节中展示的相同逻辑，我们可以使用\
  \ `match` 运算符采用更具声明性的语法。需要注意的是，所有可能的情况都必须被覆盖。上面的 `if` 语句可以写成下面这样。\n\n```\n// 用法：\n\
  // $ ./match\n// \"cold\"\nfn main() {\nlet place = \"himalayas\";\nlet weather\
  \ = match place {\n\"himalayas\" => \"cold\",\n_ => \"hot\",\n};\nprintln!(\"{:?}\"\
  , weather);\n}\n```\n\n## 1.11 面向对象编程（Object-Oriented Programming）\n\nRust 既包含了丰富的函数式编程范式，也包含了面向对象编程（OOP）范式。但由于本书的读者可能来自机器学习领域，并且有兴趣学习机器学习（这是我们做出的假设），而且基于对象的编程模型在这些领域很流行（就像在几乎所有编程领域一样），我们将特别关注基于对象的编程模型。为了深入探讨这一点，我们将从核心类型开始，然后介绍\
  \ Rust 中各个部分是如何结合在一起的。\n\n### 1.11.1 结构体（Structures）\n\n首先是结构体。结构体本质上是具名元组，可用于存储有组织的信息。它们也可以被视为一个实例的属性。请看下面的代码。\n\
  \n```\n// structures.rs\n// $ ./structures\n// Planet { co2: 0.04, nitrogen: 78.09\
  \ }\n// Planet { co2: 95.32, nitrogen: 2.7 }\n#[derive(Debug)]\nstruct Planet {\n\
  co2: f32,\nnitrogen: f32\n}\nfn main() {\nlet earth = Planet { co2: 0.04, nitrogen:\
  \ 78.09 };\nprintln!(\"{:?}\", earth);\nlet mars = Planet { co2: 95.32, nitrogen:\
  \ 2.7 };\nprintln!(\"{:?}\", mars);\n}\n```\n\n另外请注意，在创建结构体时，我们使用了 `Debug` trait\
  \ 进行注解。这样做是因为它允许我们在 `main` 方法中以调试模式打印类实例 `earth` 和 `mars`。因此，我们将得到类似下面的输出，清晰地显示了类、变量名和值。\n\
  \n```\n// $ ./oops\n// Planet { co2: 0.04, nitrogen: 78.09 }\n// Planet { co2: 95.32,\
  \ nitrogen: 2.7 }\n```\n\n### 1.11.2 特质（Traits）\n\n结构体和其他数据结构本身并不拥有功能。这些功能是通过特质来定义的。特质类似于面向对象编程语言中的接口。Rust\
  \ 的核心原则之一是零成本抽象原则。用 Bjarne Stroustrup 的话来说：\n\n> *C++ 的实现遵循零开销原则：你不使用的东西，就不需要为之付费\
  \ [Stroustrup, 1994]。更进一步说：你使用的东西，你无法手工编写出更好的代码。*\n> \n> —Stroustrup\n\n特质旨在支持零成本抽象。一个特质可以为多种类型实现，并且可以使用特质为旧类型添加新功能。下面展示了一个简单特质的例子。`co2`\
  \ 和 `nitrogen` 是特质的成员，而 `summarize` 是一个方法。\n\n```\ntrait Atmosphere {\nfn new(co2:\
  \ f32, nitrogen: f32) -> Self;\nfn amount_of_other_gases(&self) -> f32;\nfn summarize(&self);\n\
  }\n```\n\n### 1.11.3 方法与 impl 块（Methods and impl）\n\n你可以使用 `impl` 代码块在结构体上实现方法。通过这种方式，我们得到了类似于对象的东西，这意味着我们拥有一个封装了数据和行为的类型。下面展示了一个结合了之前结构体和特质的例子，以及如何为特定结构体进行实现。\n\
  \n```\n// oops.rs\n#[derive(Debug)]\nstruct Planet {\nco2: f32,\nnitrogen: f32\n\
  }\ntrait Atmosphere {\nfn new(co2: f32, nitrogen: f32) -> Self;\nfn amount_of_other_gases(&self)\
  \ -> f32;\nfn summarize(&self);\n}\nimpl Atmosphere for Planet {\nfn new(co2: f32,\
  \ nitrogen: f32) -> Planet {\nPlanet { co2: co2, nitrogen: nitrogen }\n}\nfn amount_of_other_gases(&self)\
  \ -> f32 {\n100.0 - self.co2 - self.nitrogen\n}\nfn summarize(&self) {\nlet other_gases\
  \ = self.amount_of_other_gases();\nprintln!(\"For planet {planet:?}: co2 = {co2},\
  \ nitrogen={nitrogen}, other_gases={other_gases}\",\nplanet=self, co2=self.co2,\
  \ nitrogen=self.nitrogen, other_gases=other_gases);\n}\n}\nfn main() {\nlet earth\
  \ = Planet { co2: 0.04, nitrogen: 78.09 };\nprintln!(\"{:?}\", earth);\nlet mars\
  \ = Planet { co2: 95.32, nitrogen: 2.7 };\nprintln!(\"{:?}\", mars);\nearth.summarize();\n\
  mars.summarize();\n}\n```\n\n对于上面的代码，我们将看到下面的输出。你可以看到，在创建实例 `earth` 和 `mars` 之后，实例的\
  \ `summarize` 方法运行了，该方法计算了不同的参数并打印了结果。\n\n```\n// $ ./oops\n// Planet { co2: 0.04,\
  \ nitrogen: 78.09 }\n// Planet { co2: 95.32, nitrogen: 2.7 }\n// For planet Planet\
  \ { co2: 0.04, nitrogen: 78.09 }: co2 = 0.04, nitrogen=78.09, other_gases=21.870003\n\
  // For planet Planet { co2: 95.32, nitrogen: 2.7 }: co2 = 95.32, nitrogen=2.7, other_gases=1.9800003\n\
  ```\n\n### 1.11.4 枚举（Enumerations）\n\n枚举是一种有趣的方式，用于创建一种可以持有几个不同变体中某一个值的类型。例如，IP\
  \ 地址可以是多种 IP 地址类型中的一种，但不能同时是多种。一本书可以是精装本或平装本，但不能两者都是，等等。在这种情况下，我们可以将类型定义为枚举。请看下面的代码。\n\
  \n```\n// enumerations.rs\n#[derive(Debug)]\nenum NationalHolidays {\nGandhiJayanti,\n\
  RepublicDay,\nIndependenceDay,\n}\nfn inspect(day: NationalHolidays) -> String {\n\
  match day {\nNationalHolidays::GandhiJayanti => String::from(\"Oct 2\"),\nNationalHolidays::RepublicDay\
  \ => String::from(\"Jan 26\"),\nNationalHolidays::IndependenceDay => String::from(\"\
  Aug 15\"),\n}\n}\nfn main() {\nlet day = NationalHolidays::GandhiJayanti;\nlet date\
  \ = inspect(day);\nprintln!(\"{:?}\", date); // 输出: Oct 2\n}\n```\n\n与结构体类似，我们也可以为枚举附加功能。运行此代码作为练习留给读者。\n\
  \n## 1.12 编写测试（Writing Tests）\n\n最后，作为我们正在学习的 Rust 核心基础知识的一部分，我们来到了如何在 Rust 中编写测试的部分。作为示例，我们采用\
  \ `ownership1.rs` 代码，并为 `add_version` 函数编写一个测试。该方法的代码很简单，就是将字符串 \"2018\" 连接到输入字符串后面。\n\
  \n为了给这个方法编写测试，我们需要编写一个函数，并用 `#[test]` 注解该函数。然后编译器就会知道这个函数是一个测试方法。Rust 中的 `assert_eq`\
  \ 函数是一个宏。之后，第一个参数是函数的实际输出，在本例中是 `add_version` 函数，下一个参数是期望值，即 `String::from(\"abcd\
  \ 2018.\")`。\n\n```\nfn add_version(s: &str) -> String {\ns.to_string() + \" 2018.\"\
  \n}\n#[test]\nfn test_add_version() {\nassert_eq!(add_version(\"abcd\"), String::from(\"\
  abcd 2018.\"));\n}\n```\n\n如果写在 Cargo 包中，我们可以使用 `cargo test` 命令来编译并为我们运行测试。\n\n\
  ```\n$ cargo test\nCompiling unittestingexample v0.1.0 (/path/to/code)\nFinished\
  \ dev [unoptimized + debuginfo] target(s) in 9.75s\nRunning target/debug/deps/unittestingexample-9d94da4358544e8a\n\
  running 1 test\ntest test_add_version ... ok\ntest result: ok. 1 passed; 0 failed;\
  \ 0 ignored; 0 measured; 0 filtered out\n```\n\n请注意，会创建一个新的测试二进制文件，并且运行该测试二进制文件来评估测试用例。\n\
  \n\n\n## 1.13 本章小结\n\n本章通过展示如何安装 Rust 和设置开发环境、如何使用 Cargo 启动 Rust 项目以及如何在 Rust 中使用变量和函数，向您介绍了\
  \ Rust 的基础知识。您还初步了解了 Rust 中的所有权和引用，以及如何使用结构体、枚举、特性和实现来实现一些面向对象范式。\n\n在下一章中，您将学习如何使用\
  \ Rust 以及创建利用机器学习算法（如线性回归或逻辑回归）的 Rust 程序。\n\n"
- "# 2. 监督学习\n\n## 2.1 什么是机器学习？\n\n机器学习是一门让计算机无需明确编程即可行动的学科。这是通过实现能够检测数据中模式的特殊算法来完成的。从开发者的角度来看，这意味着创建一个能够访问相关数据、将数据馈送给机器学习算法、并能够获取输出并将其重定向到下游流程和任务的系统。\n\
  \n**监督学习** 当您将输入和期望的输出都传递给系统，并且希望生成的机器学习模型能够捕捉它们之间的关系时，就属于监督学习。根据标签的类型，监督学习又分为两个子类。\n\
  \n当目标变量是连续值时，监督任务被称为回归问题。例如，产品的价格可以是任何值。当需要对某种数量进行预测时，我们通常应该采用回归技术。回归模型的质量通常使用某种形式的误差度量来衡量，即目标值与预测值之间的差异。\n\
  \n分类问题与回归问题的不同之处在于，其标签是离散且有限的。例如，我们可以将电子邮件分类为垃圾邮件或正常邮件。因此，当我们关心一组特定特征读数将落入哪个结果类别时，该问题就是一个分类问题。分类模型的质量通常使用准确率度量来衡量，该度量本质上是模型预测正确的次数。\n\
  \n**无监督学习** 在无监督算法中，不提供标签或目标类别。因此，无监督学习的目标是尝试找到数据的自然划分。\n\n无监督学习的最佳应用场景是当期望结果的数据未知时，例如创建一个企业从未销售过的新产品类别。\n\
  \n**强化学习** 在强化学习中，专门设计的智能体被释放到一个环境中，它们在该环境中学习根据某种奖励和惩罚的概念来采取行动。强化学习已成功应用于机器人运动和不同类别的游戏。\n\
  \n在本章中，我们将研究如何使用 Rust 为不同的机器学习算法创建模型。我们首先从一个 CSV 文件中读取数据集。这是一个常见的数据集，将代表现实世界中的数据类型。然后，我们将研究流行算法的逻辑、它们为何有效，以及如何使用一些\
  \ Rust 机器学习包（如 `rusty_machine`）来实现它们。我们还将研究如何评估每个模型的准确率。\n\n到本章结束时，您应该对如何创建常见的机器学习模型并在\
  \ Rust 中实现它们有了相当的理解。\n\n## 2.2 数据集特定代码\n\n在进入回归算法和相关代码之前，让我们先构建周围的样板代码。查看本书附带的代码中的\
  \ *rusty_machine_regression* 包。\n\n为了演示回归的用法，我们将使用波士顿房价数据集。^(²) 您也可以从 Kaggle 的波士顿数据集页面下载该数据。^(³)\
  \ 该数据集有 14 个特征和 506 个样本。以下是该数据集的描述。\n\n*   CRIM - 城镇人均犯罪率\n*   ZN - 占地面积超过 25,000\
  \ 平方英尺的住宅用地比例\n*   INDUS - 每个城镇非零售商业英亩数的比例\n*   CHAS - 查尔斯河虚拟变量（如果区域边界临河则为 1；否则为\
  \ 0）\n*   NOX - 一氧化氮浓度（每千万分之一）\n*   RM - 每栋住宅的平均房间数\n*   AGE - 1940 年之前建造的自住单位比例\n\
  *   DIS - 到波士顿五个就业中心的加权距离\n*   RAD - 通往径向高速公路的便利性指数\n*   TAX - 每 10,000 美元的全额财产税率\n\
  *   PTRATIO - 城镇的师生比\n*   B - 1000(Bk - 0.63)![$$ \\hat{2} $$](img/482357_1_En_2_Chapter_TeX_IEq1.png)，其中\
  \ Bk 是城镇黑人人口比例\n*   LSTAT - 人口中较低地位阶层的百分比\n*   MEDV - 自住房屋的中位价值（单位：千美元）\n\n现在让我们先创建项目。我们可以使用\
  \ cargo 命令创建项目，如下面的清单 2-1 所示。\n\n```\n$ cargo new rustymachine-regression --bin\n\
  $ cd rustymachine-regression\n清单 2-1\n创建新包\n```\n\n我们可以看到，目录中已创建了一个 `src/main.rs`\
  \ 文件和一个 `Cargo.toml` 文件。我们可以使用命令 `mkdir data` 创建额外的 `data` 目录，以便将波士顿房价数据集保存在那里。\n\
  \n数据保存在文件 “data/housing.csv” 中。快速查看 CSV 文件表明它是一个没有标题的固定宽度文件（清单 2-2）。\n\n```\n$ head\
  \ -n1 data/housing.csv \\\n| grep -Eo '[0-9]*[.]?[0-9]*' \\\n| wc -l\n\n$ head -n2\
  \ data/housing.csv\n0.00632  18.00   ...   4.98  24.00\n0.02731   0.00   ...   9.14\
  \  21.60\n清单 2-2\n住房数据\n```\n\n为了解析文件并创建我们的模型，我们需要依赖各种外部依赖项。Rust 包通常被称为 crate。要访问不同\
  \ crate 中的代码，我们需要将它们添加到 `Cargo.toml` 文件中。crate `csv` 借助额外的 crate `serde` 和 `serde-derive`\
  \ 来解析 CSV 文件。我们稍后会讨论 `rusty-machine` crate，所以现在只需将它们添加到 toml 文件中。请注意，我们使用的是 Rust\
  \ 2018 版本。这是本书将全程使用的版本（清单 2-3）。\n\n```\n[package]\nname = \"rustymachine_regression\"\
  \nversion = \"0.1.0\"\nedition = \"2018\"\n[dependencies]\nrusty-machine = \"0.5.4\"\
  \nserde = \"1\"\nserde_derive = \"1\"\nrand = \"0.6.5\"\ncsv = \"1.0.7\"\n清单 2-3\n\
  chapter2/rustymachine_regression/Cargo.toml\n```\n\n对于您的应用程序，请访问 `crates.io` 页面以查找相应依赖项的可用版本。在该网站上，您可以看到一个搜索栏，您可以在其中输入搜索词。在图\
  \ 2-1 中，显示了 `csv` 页面。\n\n如果您向下滚动，还会看到附带的文档。\n\n![../images/482357_1_En_2_Chapter/482357_1_En_2_Fig1_HTML.jpg](img/482357_1_En_2_Fig1_HTML.jpg)\n\
  \n图 2-1\n\nCrates 页面\n\n现在我们将开始编写本书中第一个模块的代码。除非另有说明，本书中的大部分代码都将写在 `src/main.rs`\
  \ 文件中。此外，您可以通过代码块的标签了解代码所在的文件。我们将继续添加需要使用 `use` 语句导入的必要模块（清单 2-4）。\n\n\n\n```\n\
  extern crate serde;\n#[macro_use]\nextern crate serde_derive;\nuse std::io::prelude::*;\n\
  use std::io::BufReader;\nuse std::path::Path;\nuse std::fs::File;\nuse std::vec::Vec;\n\
  use std::error::Error;\nuse rand::thread_rng;\nuse rand::seq::SliceRandom;\n清单 2-4\n\
  chapter2/rustymachine_regression/src/lin_reg.rs\n```\n\n为了解析文件并与相应的记录匹配，我们创建了一个`struct`，其中每个值都是`float64`类型（清单\
  \ 2-5）。^(⁴) 由于我们将使用稍后在本节介绍的 Rust 机器学习库，因此需要将它们初始化为`float64`。\n\n```\npub struct\
  \ BostonHousing {\ncrim: f64, zn: f64, indus: f64, chas: f64, nox: f64,\nrm: f64,\
  \ age: f64, dis: f64, rad: f64, tax: f64,\nptratio: f64, black: f64, lstat: f64,\
  \ medv: f64,\n}\n清单 2-5\nchapter2/ml-utils/src/datasets.rs\n```\n\n将文件转换为记录的一种方法是逐行读取文件并构建`BostonHousing`记录。这使我们能够实现将预测变量与响应变量或目标变量分离的方法。在此案例中，我们将房屋的中位数价格（房价）视为目标，并尝试根据可用的预测变量来预测房价。\n\
  \n清单 2-6 展示了实现构建`BostonHousing`记录以及构建特征向量和目标值方法的代码。\n\n```\nimpl BostonHousing {\n\
  pub fn new(v: Vec) -> BostonHousing {\nlet f64_formatted: Vec = v.iter().map(\n\
  |s| s.parse().unwrap()).collect();\nBostonHousing {\ncrim: f64_formatted[0], zn:\
  \ f64_formatted[1],\nindus: f64_formatted[2], chas: f64_formatted[3],\nnox: f64_formatted[4],\
  \ rm: f64_formatted[5],\nage: f64_formatted[6], dis: f64_formatted[7],\nrad: f64_formatted[8],\
  \ tax: f64_formatted[9],\nptratio: f64_formatted[10], black: f64_formatted[11],\n\
  lstat: f64_formatted[12], medv: f64_formatted[13] }\n}\npub fn into_feature_vector(&self)\
  \ -> Vec {\nvec![self.crim, self.zn, self.indus, self.chas, self.nox,\nself.rm,\
  \ self.age, self.dis, self.rad,\nself.tax, self.ptratio, self.black, self.lstat]\n\
  }\npub fn into_targets(&self) -> f64 {\nself.medv\n}\n}\n清单 2-6\nchapter2/ml-utils/src/datasets.rs\n\
  ```\n\n现在我们可以继续使用`get_boston_records_from_file`函数逐行读取文件。每一行将被传递给`get_boston_record`函数，该函数将字符串分割成字符串向量，以便由`BostonRecord`进行适当解析（清单\
  \ `2-7`）。\n\n```\nfn get_boston_record(s: String) -> BostonHousing {\nlet v: Vec\
  \ = s.split_whitespace().collect();\nlet b: BostonHousing = BostonHousing::new(v);\n\
