  \ = subset_ids.map(|s| s.trim().to_owned());\nsubset_ids.collect()\n} else {\nVec::new()\n\
  };\nfor k in subset_ids {\nSIF.insert(k, subset_description.to_owned());\n}\n}\n\
  }\n// 其余代码 ...\n}\n列表 7-7\nchapter7/statistics/src/main.rs\n```\n\n在列表 7-7 的代码中，`SIF`\
  \ 是一个映射，将 `subset_sample_id` 行中的不同 `subset_ids` 映射到它们上面提到的 `subset_description`。这个过程需要持续到到达\
  \ `dataset_table_begin` 为止。参见列表 7-8。\n\n```\n'linereading: for line in BufReader::new(file).lines()\
  \ {\nlet thisline = line?;\nlet line_split: Vec = thisline.split(\"=\").map(|s|\
  \ s.to_owned()).collect();\nif thisline.starts_with(\"!dataset_table_begin\") {\n\
  within_dataset_table = true;\nwithin_headers = false;\ncontinue 'linereading;\n\
