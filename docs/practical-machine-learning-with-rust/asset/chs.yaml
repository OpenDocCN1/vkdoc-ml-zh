  \n*   `rustup` 脚本已成功识别我的发行版，并将安装与之兼容的 Rust 二进制文件。\n*   通过此命令将运行 Rust 以及 Cargo（官方\
  \ Rust 包管理器）的安装。\n*   这些命令将被添加到 `<home/>.cargo/bin` 目录，并可从命令行访问。\n\n## 1.4 包管理器与\
  \ Cargo\n\nCargo 是一个用于开发 Rust 应用程序和库的便捷构建工具。包信息应保存在一个 toml（Tom's Obvious, Minimal\
  \ Language）文件中。toml 文件格式相对较新，根据 github 上的 toml 仓库，它被设计为能够明确地映射到一个哈希表。\n\n\n\n##\
  \ 1.5 在 Rust 中创建新应用\n\n在 Rust 中创建新应用非常简单。\n\n```\n$ cargo new myfirstapp\nCreated\
  \ binary (application) `myfirstapp` package\n```\n\n检查 `Cargo.toml` 文件。你应该会看到类似下面的内容。\n\
  \n```\n[package]\nname = \"myfirstapp\"\nversion = \"0.1.0\"\nauthors = [\"Joydeep\
  \ Bhattacharjee\"]\nedition = \"2018\"\n[dependencies]\n```\n\n如你所见，这里添加了一些基本信息。重要的项是名称和版本。\n\
  \n如果你检查 `src/` 文件夹的内容，你还会看到一个 `main.rs` 文件。检查 `main.rs` 文件的内容。你会看到一个包含 `main` 函数的最小文件。要运行一个\
  \ Rust 应用，你需要一个 `main` 函数作为代码的入口点。这里的代码是一个简单的打印 \"hello world\"。\n\n```\nfn main()\
  \ {\nprintln!(\"Hello, world!\");\n}\n```\n\n现在我们可以使用 `build` 命令来构建应用。这将生成一个可用于运行应用的二进制文件。一旦应用开发完成，我们可以使用\
  \ `--release` 标志来创建一个优化后的二进制文件。这样做是必要的，因为默认情况下，cargo 构建会禁用许多优化，以便于测试。因此，在创建用于生产环境的构建时，应该使用\
  \ release 标志。\n\n```\n$ cargo build\nCompiling myfirstapp v0.1.0 (/tmp/myfirstapp)\n\
