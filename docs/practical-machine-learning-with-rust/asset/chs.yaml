  };\n// 剩余代码...\n}\n代码清单 7-9\nchapter7/statistics/src/main.rs\n```\n\n在代码清单 7-9 的代码中，当各个标识符以“GSM”开头时，就会创建索引。一旦标识符就位，就会通过\
  \ SIF 理解到描述的映射，然后返回 STD、STP 和 indices 的值供后续使用。解析完这一标题行后，我们不再希望对该行进行求值，因此在将 `gene_expression_headers`\
  \ 赋值为 `false` 后继续循环，这样在后续的连续行读取中就不会再执行此代码块。\n\n现在所有标题信息都已解析完毕，我们遍历从 soft 文件中第 196\
  \ 行到末尾的基因数据。这部分数据处于数据集表中且不是 `gene_expression_headers` 这一独特条件下。因此，我们可以采用代码清单 7-10\
  \ 中所示的以下代码。\n\n```\nfn process_file(filename: &Path) {\n// 之前的代码 ...\nif within_dataset_table\
  \ && !gene_expression_headers {\nif thisline.starts_with(\"!dataset_table_end\"\
  ) {\nbreak 'linereading;\n}\nlet (gene_expression_measures, gene_identifiers) =\
  \ process_gene_expresssion_data(&thisline, &indices);\ngene_expression_measures_vec.extend(gene_expression_measures);\n\
  gene_identifiers_vec.push(gene_identifiers);\n}\n// 剩余代码 ...\n代码清单 7-10\nchapter7/statistics/src/main.rs\n\
  ```\n\n`process_gene_expresssion_data` 是负责处理这些行的解析，并将其放入 `gene_expression_measures_vec`\
  \ 和 `gene_identifiers_vec` 的函数。`gene_expression_measures_vec` 将包含不同标题对应的所有向量，而 `gene_identifiers_vec`\
  \ 将包含拼接后的 id 引用和标识符。\n\n创建 `gene_expression_measures_vec` 后，我们可以将其转换为 ndarray 矩阵。在代码清单\
  \ 7-11 中，我们将使用 ndarray 提供的不同 Array 结构。`Array` 用于任意维度的 ndarray，而 `Array2` 和 `Array1`\
  \ 分别提供维度为 2 和 1 的数组。可以使用 `stack` 函数将 ndarray 重塑为新的维度，其中 `Axis` 函数提供轴索引。\n\n```\n\
  use ndarray;\nuse ndarray::{Array, Array2, Array1, Axis, stack};\nfn convert_to_log_scale(X:\
  \ &Array2) -> Array2 {\nlet two = 2.0f64;\nlet two_log = two.ln();\nX.mapv(|x| x.ln()/two_log)\n\
  }\nfn process_file(filename: &Path) {\n// 之前的代码 ...\nlet gene_expression_measures_matrix\
  \ = Array::from_shape_vec(\n(22283, 127), gene_expression_measures_vec).unwrap();\n\
  let gene_expression_measures_matrix = convert_to_log_scale(\n&gene_expression_measures_matrix);\n\
  // 剩余代码 ...\n代码清单 7-11\nchapter7/statistics/src/main.rs\n```\n\n从这个矩阵中，我们需要分离出 UC\
  \ 和克罗恩病样本的索引。参见代码清单 7-12。\n\n```\nfn filter_specific_samples(\nSTP: &Vec,\ngroup_type:\
  \ &str) -> Vec {\nSTP.iter().enumerate()\n.filter(|&(_, x)| x == group_type)\n.map(|(i,\
  \ _)| i).collect()\n}\nfn different_samples(\nSTP: &Vec) -> (Vec, Vec) {\nlet UC\
  \ = filter_specific_samples(&STP, \"ulcerative colitis\");\nlet CD = filter_specific_samples(&STP,\
  \ \"Crohn's disease\");\n(UC, CD)\n}\nlet (UC, CD) = different_samples(&STP);\n\
  代码清单 7-12\nchapter7/statistics/src/main.rs\n```\n\n现在我们有了数据，可以计算每个组的均值和方差，这些将用于计算\
  \ Z 分数，以汇总差异表达的证据。为了构建 Z 分数，我们需要构建一些函数。第一个函数是，如果我们传递样本索引，则从 `gene_expression_measures_matrix`\
  \ 中过滤出相应的列。其思路是，我们应该能够传递相关的 UC 和 CD 索引，并获取子矩阵。参见代码清单 7-13。\n\n```\nfn filter_out_relevant_columns(samples:\
  \ &Vec,\ngene_expression_measures_matrix: &Array2) -> Array2 {\nlet shape1 = samples.len();\n\
  let shape0 = gene_expression_measures_matrix.shape()[0];\nlet mut cols = Vec::new();\n\
  for &msamples_columns in samples {\nlet col = gene_expression_measures_matrix.column(\n\
  msamples_columns);\ncols.push(col);\n}\nlet Msamples = stack(Axis(0), &cols[..]).unwrap();\n\
  let Msamples = Array::from_iter(Msamples.iter());\nlet Msamples = Msamples.into_shape((shape0,\
  \ shape1)).unwrap();\nMsamples.mapv(|&x| x)\n}\n代码清单 7-13\nchapter7/statistics/src/main.rs\n\
  ```\n\n现在我们有了子矩阵，可以计算样本的均值或方差，这在 ndarray 中是一个简单的函数（代码清单 7-14）。\n\n```\nfn mean_of_samples(samples:\
  \ &Vec,\ngene_expression_measures_matrix: &Array2) -> Array1 {\nlet Msamples = filter_out_relevant_columns(\n\
  samples, gene_expression_measures_matrix);\nMsamples.mean_axis(Axis(1))\n}\nfn variance_of_samples(\n\
  samples: &Vec,\ngene_expression_measures_matrix: &Array2)\n-> Array1 {\nlet Msamples\
  \ = filter_out_relevant_columns(samples, gene_expression_measures_matrix);\nMsamples.var_axis(Axis(1),\
  \ 1.)\n}\n代码清单 7-14\nchapter7/statistics/src/main.rs\n```\n\n因此，我们最终能够计算两个样本的 Z\
  \ 分数（代码清单 7-15）。\n\n```\nfn generate_zscores(UC: &Vec,\nCD: &Vec,\ngene_expression_measures_matrix:\
  \ &Array2)\n-> Array1 {\nlet MUC = mean_of_samples(&UC, &gene_expression_measures_matrix);\n\
  let MCD = mean_of_samples(&CD, &gene_expression_measures_matrix);\nlet VUC = variance_of_samples(&UC,\
  \ &gene_expression_measures_matrix);\nlet VCD = variance_of_samples(&CD, &gene_expression_measures_matrix);\n\
  let nUC = UC.len();\nlet nCD = CD.len();\nlet z_scores_num = MUC - MCD;\nlet z_scores_den\
  \ = (VUC/nUC as f64 + VCD/nCD as f64).mapv(f64::sqrt);\nlet z_scores = z_scores_num\
  \ / z_scores_den;\nz_scores\n}\nfn process_file(filename: &Path) {\n// 之前的代码 ...\n\
  let z_scores = generate_zscores(&UC, &CD, &gene_expression_measures_matrix);\nlet\
  \ z_scores_mean = z_scores.sum() / z_scores.len() as f64;\nlet z_scores_std = z_scores.std_axis(Axis(0),\
  \ 1.);\nprintln!(\"z scores mean {:?}\", z_scores_mean);\nprintln!(\"z scores mean\
  \ {:?}\", z_scores_std);\n}\n代码清单 7-15\nchapter7/statistics/src/main.rs\n```\n\n\
  如果一个基因没有差异表达，它在两组样本中的期望值相同。在这种情况下，Z 分数将是标准化的，即均值为零且标准差为单位值。打印 `z_scores_mean` 和\
  \ `z_scores_std`，我们发现值分别为 0.042918212228268235 和 3.5369539066322027。请注意，由于向量是 ndarray\
  \ 格式，我们可以轻松地使用 ndarray API 计算统计量。\n\n\n\n由于标准差远大于 1，似乎存在多个基因在溃疡性结肠炎（UC）和克罗恩病样本中的平均表达水平存在差异。此外，由于平均\
  \ Z 分数为正值，主要模式似乎是 UC 样本中基因的表达量高于克罗恩病样本。\n\n同样地，我们可以计算 p 值。具体结果对本节而言并不重要，本节旨在说明，一旦在\
  \ Rust 中将值转换为`ndarray`矩阵，对它们进行统计分析就变得相当简单。\n\n## 7.2 编写高性能代码\n\n许多能够使用 GPU 的机器学习代码，都是通过\
  \ Rust 绑定到本质上用 C/C++编写的库来实现的。为了能够使用 GPU 或编写高性能代码，我们可以使用诸如`blas-src`或`lapack-src`之类的\
  \ crate，它们提供了对底层数学运算的访问。\n\n在大多数情况下，我们在前几章讨论过的高级 crate 和库就足够了，但有时我们需要深入底层，执行直接的向量运算。单指令多数据流（SIMD）操作库，更广为人知的名字是\
  \ SIMD，是一个用于执行向量运算的流行库，而`faster`^(³²) crate 为我们提供了在 Rust 中运行 SIMD 指令的良好抽象。\n\n如果我们试图在向量上并行执行指令并返回结果，SIMD\
  \ 和`faster`非常有用。这种转换会作用于向量的每个元素。在清单 7-16 所示的代码中，我们将获取一个向量并返回该向量中所有元素的立方。\n\n在运行安装代码之前，你可能需要在系统中安装好`blas`和`lapack`库。在\
  \ Ubuntu 系统中安装可能需要类似此代码中所示的命令。\n\n```\n$ sudo apt-get install libblas-dev liblapack-dev\n\
  $ sudo apt-get install libopenblas-dev\n$ sudo apt-get install gfortran\n$\n清单 7-16\n\
  安装 libblas\n```\n\n现在我们可以创建一个 Rust 项目来探索如何编写高性能代码，并将其命名为`high-performance-computing`（清单\
  \ `7-17`）。\n\n```\n$ cd chapter7\n$ cargo new high-performance-computing --bin &&\
  \ cd high-performance-computing\n清单 7-17\n创建用于高性能计算的 Rust 项目\n```\n\n我们现在应该有了`main.rs`文件和`Cargo.toml`文件。由于我们将使用`lapack`、`openblas`和\
  \ SIMD 依赖项，我们需要添加能够使用这些依赖项的 crate。参见清单 7-18。\n\n```\n[package]\nname = \"high-performance-computing\"\
  \nversion = \"0.1.0\"\nedition = \"2018\"\n[dependencies]\nfaster = \"0.5.0\"\n\
  rblas = \"0.0.13\"\n清单 7-18\nchapter7/high-performance-computing/Cargo.toml\n```\n\
  \n在清单 7-18 的依赖项列表中，crate `faster` 是用于在 Rust 中编写 SIMD 代码的 Rust 代码，`rblas` crate 使我们能够访问\
  \ Open BLAS 和 OpenBLAS 包。\n\n我们现在应该能够编写代码了，我们将从使用`faster`包并编写使用 SIMD 软件的代码开始（清单\
  \ 7-19）。\n\n```\nuse faster::*;\nfn main() {\nlet my_vector: Vec = (0..10).map(\n\
  |v| v as f32).collect();\nlet power_of_3 = (&my_vector[..]).simd_iter(f32s(0.0))\n\
  .simd_map(|v| v * v * v)\n.scalar_collect();\nprintln!(\"{:?}\", power_of_3);\n\
  }\n清单 7-19\nchapter7/high-performance-computing/src/main.rs\n```\n\n类似地，当我们尝试对向量执行归约操作时，可以使用`simd_reduce`方法。例如，在清单\
  \ 7-20 的代码中，我们将尝试求向量中元素的和。\n\n```\nfn main() {\n// 之前的代码 ...\nlet reduced = (&power_of_3[..])\n\
  .simd_iter(f32s(0.0))\n.simd_reduce(f32s(0.0), |a, v| a + v ).sum();\n}\n清单 7-20\n\
  chapter7/high-performance-computing/src/main.rs\n```\n\n另一个对向量执行的常见操作是两个向量的点积，在这种情况下，我们将使用之前包含的`rblas`\
  \ crate，它是`blas`和`openblas`库的封装。BLAS，即基本线性代数规范（Basic Linear Algebra Specification），是一组用于执行常见线性运算的底层例程。`rblas`\
  \ crate 在`blas`之上实现了点积运算 [1]。\n\n在清单 7-21 中，我们计算两个已初始化向量的点积。\n\n```\nuse rblas::Dot;\n\
  fn main() {\nlet x = vec![1.0, -2.0, 3.0, 4.0];\nlet y = [1.0, 1.0, 1.0, 1.0, 7.0];\n\
  let d = Dot::dot(&x, &y[..x.len()]);\nprintln!(\"dot product {:?}\", d);\n}\n清单\
  \ 7-21\nchapter7/high-performance-computing/src/main.rs\n```\n\n运行清单 7-21 中的代码，我们应该得到清单\
  \ 7-22 中的输出。\n\n```\n$ cargo run\nFinished dev [unoptimized + debuginfo] target(s)\
  \ in 0.01s\nRunning `target/debug/high-performance-computing`\n[3.0, 3.0, ..., 3.0,\
  \ 3.0]\n[0.0, 1.0, 8.0, 27.0, 64.0, 125.0, 216.0, 343.0, 512.0, 729.0]\n2025.0\n\
  dot product 6.0\n清单 7-22\nhigh-performance-computing 输出\n```\n\n因此，通过使用这些高性能库的封装，我们应该能够在\
  \ Rust 应用程序中编写高性能代码。\n\n## 7.3 推荐系统\n\n推荐系统是机器学习技术在商业中最成功、最广泛的应用之一。推荐系统中的机器学习算法通常分为两类——基于内容的过滤和协同过滤，尽管现代架构主要结合使用两者。基于内容的方法基于项目属性的相似性，而协同方法则根据交互计算相似性。\n\
  \n在 Rust 中，我们能够创建推荐引擎，这主要归功于优秀的`sbr-rs` crate。^(³³) 在这个 crate 中实现了两个模型。这个 crate\
  \ 需要安装一些额外的操作系统级依赖项。确保你的系统中安装了`libssl`。在 Ubuntu 系统中，运行清单 7-23 中的以下命令应该没问题。\n\n```\n\
  $ sudo apt install libssl-dev\n$\n清单 7-23\n在 Ubuntu 上安装 libssl\n```\n\n我们可以使用`sbr`包创建的模型如下：\n\
  \n*   **LSTM**：使用 LSTM 网络对用户交互序列进行建模，以预测其下一个动作；\n*   **EWWA**：该模型使用过去动作的指数加权平均值来预测未来的交互。\n\
  \n要启动项目，我们可以像清单 7-24 所示那样使用`cargo`创建一个项目。\n\n```\n$ cargo new --bin goodbooks-recommender\n\
  $\n清单 7-24\n新建 Rust goodbooks 包\n```\n\n这将设置项目，包含`src/main.rs`文件和`Cargo.toml`文件，正如我们在前几章中看到的那样。在\
  \ cargo 文件中添加依赖项。其中一些依赖项我们已经见过，例如用作 Web 客户端的`reqwest`。`Failure`是一个用于更好处理错误的优秀 crate。`serde`、`serde_json`和`serde_json`这些\
  \ crate 用于序列化和反序列化数据。我们将需要`csv` crate 来处理 csv 文件。`rand` crate 将帮助我们随机化数据，而`structopt`\
  \ crate 用于创建良好的命令行界面。根据本节内容，最重要的 crate 是`sbr` crate，它实现了我们将在此处调用的推荐模块，如清单 7-25 所示。\n\
  \n```\n[package]\nname = \"goodbooks-recommender\"\nversion = \"0.1.0\"\nauthors\
  \ = [\"author names\"]\nedition = \"2018\"\n[dependencies]\nreqwest = \"0.9.17\"\
  \nfailure = \"0.1.5\"\nserde = \"1\"\nserde_derive = \"1\"\nserde_json = \"1\"\n\
  csv = \"1\"\nsbr = \"0.4.0\"\nrand = \"0.6.5\"\nstructopt = \"0.2.15\"\n清单 7-25\n\
  chapter7/goodbooks-recommender/Cargo.toml\n```\n\n\n\n### 7.3.1 命令行\n\n现在我们将开始创建命令行。对于熟悉\
  \ `git` 的读者来说，你可能已经注意到 git 有诸如 `git clone` 或 `git pull` 这样的第一级命令，然后根据第一个命令，我们会有第二级命令，例如\
  \ `origin master` 作为 `pull` 的子命令，这使我们能够编写 `git pull origin master`。类似地，我们将尝试构建一个命令行解析器（清单\
  \ 7-26）。\n\n```\nuse structopt::StructOpt;\n#[derive(Debug, StructOpt)]\n#[structopt(name\
  \ = \"goodbooks-recommender\", about = \"Books Recommendation\")]\nenum Opt {\n\
  #[structopt(name = \"fit\")]\n/// 将拟合模型。\nFit,\n#[structopt(name = \"predict\")]\n\
  /// 将根据其后的字符串预测模型。请仅在运行 fit 并保存模型后运行此命令。\nPredict(BookName),\n}\n// 子命令也可以通过使用 1\
  \ 元组枚举变体来外部化\n#[derive(Debug, StructOpt)]\nstruct BookName {\n#[structopt(short\
  \ = \"t\", long = \"text\")]\n/// 输入你想要预测的书籍文本\n/// 多个书籍可以用逗号分隔的方式传入\ntext: String,\n\
  }\nfn main() {\nlet opt = Opt::from_args();\n}\n清单 7-26\ngoodbooks-recommender/src/main.rs\n\
  ```\n\n在清单 7-26 的代码中，goodbooks-recommender 接收一个第一级命令，这本质上是一个枚举，要么是 Fit 要么是 Predict。Fit\
  \ 本身就可以使用，但 Predict 需要一个单独的子命令，即一个文本。帮助函数也提供了相关文档（清单 7-27）。\n\n```\n$ cargo run\
  \ -- --help\nFinished dev [unoptimized + debuginfo] target(s) in 0.23s\nRunning\
  \ `target/debug/goodbooks-recommender --help`\ngoodbooks-recommender 0.1.0\n书籍推荐\n\
  用法:\ngoodbooks-recommender \n标志:\n-h, --help       打印帮助信息\n-V, --version    打印版本信息\n\
  子命令:\nfit        将拟合模型。\nhelp       打印此消息或给定子命令的帮助信息\npredict    将根据其后的字符串预测模型。请仅在运行\
  \ fit 并保存模型后运行此命令。\n清单 7-27\n包运行帮助\n```\n\n我们还可以看到 predict 的帮助文本，如清单 7-28 所示。\n\n\
  ```\n$ cargo run -- predict --help\nFinished dev [unoptimized + debuginfo] target(s)\
  \ in 0.23s\nRunning `target/debug/goodbooks-recommender predict --help`\ngoodbooks-recommender-predict\
  \ 0.1.0\n将根据其后的字符串预测模型。请仅在运行 fit 并保存模型后运行此命令。\n用法:\ngoodbooks-recommender predict\
  \ --text \n标志:\n-h, --help       打印帮助信息\n-V, --version    打印版本信息\n选项:\n-t, --text\
  \     输入你想要预测的书籍文本。多个书籍可以用逗号分隔的方式传入。\n清单 7-28\n包运行 predict 帮助\n```\n\n### 7.3.2\
  \ 下载数据\n\n现在我们应该能够创建用于下载数据的函数，并将文件保存到目标文件夹中（清单 7-29）。\n\n```\nuse std::fs::File;\n\
  use std::io::BufWriter;\nuse std::path::Path;\nfn download(url: &str, destination:\
  \ &Path)\n-> Result {\nif destination.exists() {\nreturn Ok(()) // 不要多次下载\n}\nlet\
  \ mut writer = BufWriter::new(file);\nlet mut response = reqwest::get(url)?;\nresponse.copy_to(&mut\
  \ writer)?;\nOk(())\n}\n清单 7-29\nchapter7/goodbooks-recommender/src/main.rs\n```\n\
  \n在上述清单 7-29 所示的下载函数中，我们将 url 作为 str 类型，destination 作为路径。如果路径已存在，则无需执行任何操作。我们将由该函数的调用者来确保\
  \ url 和 destination 的组合是正确的。然后，我们将从 url 获取响应，并使用 `BufWriter` 模块将其写入路径。这应该能够下载我们传递给函数的任何\
  \ url。\n\n使用上述函数，我们可以从以下 GitHub 仓库 [`https://github.com/zygmuntz/goodbooks-10k/`](https://github.com/zygmuntz/goodbooks-10k/)\
  \ 下载好书数据集。该数据集包含一万本最受欢迎书籍的六百万条评分。数据集中提供的其他信息包括 isbn 值、作者等，但在此示例中我们不会关注这些。我们将下载 `ratings.csv`\
  \ 和 `books.csv`，如清单 7-30 所示。\n\n```\n/// 下载评分数据和元数据。\nfn download_data(ratings_path:\
  \ &path,\nbooks_path: &path) {\nlet ratings_url = \"https://github.com/zygmuntz/\\\
  \ngoodbooks-10k/raw/master/ratings.csv\";\nlet books_url = \"https://github.com/zygmuntz/\\\
  \ngoodbooks-10k/raw/master/books.csv\";\ndownload(&ratings_url, ratings_path)\n\
  .expect(\"无法下载评分数据\");\ndownload(&books_url, books_path)\n.expect(\"无法下载元数据\");\n\
  }\n清单 7-30\nchapter7/goodbooks-recommender/src/main.rs\n```\n\n### 7.3.3 数据\n\n\
  现在我们可以运行这个函数，会看到文件已下载到根文件夹中。查看这两个 csv 文件。books.csv 文件中的列包括 `book_id`、`goodreads_book_id`、`work_id`、`books_count`、isbn、isbn13、authors、`original_publication_year`、`language_code`、title、`language_code`、`average_rating`、`ratings_count`、`work_ratings_count`、`work_text_reviews_count`、`ratings_1`、`ratings_2`、`ratings_3`、`ratings_4`、`ratings_5`、`image_url`\
  \ 和 `small_image_url`，共 23 列。类似地，评分文件包含 user_id、`book_id` 和 rating。\n\n从这个评分文件中，我们将创建\
  \ `user_id` 和 `book_id` 之间的映射，从书籍文件中创建 `book_id` 和 `title` 之间的映射。这可以用一个结构体来编码。为了简单起见，我们只取少量特征，但你应该尝试使用更多特征。参见清单\
  \ 7-31。\n\n```\n#[derive(Debug, Serialize, Deserialize)]\nstruct UserReadsBook {\n\
  user_id: usize,\nbook_id: usize,\n}\n#[derive(Debug, Deserialize, Serialize)]\n\
  struct Book {\nbook_id: usize,\ntitle: String\n}\n清单 7-31\nchapter7/goodbooks-recommender/src/main.rs\n\
  ```\n\n现在我们可以编写两个函数，一个用于反序列化评分数据，另一个用于反序列化书籍数据（清单 7-32）。\n\n```\nuse csv;\nfn deserialize_ratings(path:\
  \ &Path)\n-> Result, failure::Error> {\nlet mut reader = csv::Reader::from_path(path)?;\n\
  let entries = reader.deserialize()\n.collect::, _>>()?;\nOk(entries)\n}\nfn deserialize_books(path:\
  \ &Path)\n-> Result,\nHashMap), failure::Error> {\nlet mut reader = csv::Reader::from_path(path)?;\n\
  let entries: Vec = reader.deserialize::()\n.collect::, _>>()?;\nlet id_to_title:\
  \ HashMap = entries\n.iter()\n.map(|book| (book.book_id, book.title.clone()))\n\
  .collect();\nlet title_to_id: HashMap = entries\n.iter()\n.map(|book| (book.title.clone(),\
  \ book.book_id))\n.collect();\nOk((id_to_title, title_to_id))\n}\n清单 7-32\nchapter7/goodbooks-recommender/src/main.rs\n\
  ```\n\n在清单 7-31 和 7-32 中，我们将使用 csv 读取文件，然后收集向量。在 `deserialize_ratings` 函数中，我们不直接返回向量，而是返回由\
  \ `Result<Vec<UserReadsBook>` 给出的向量结果。在 `deserialize_books` 函数中，我们还创建了 `id_to_title`\
  \ 和 `title_to_id` 映射，以便能够通过相关映射的简单查找从一个获取另一个。\n\n\n\n### 7.3.4 模型构建\n\n数据部分已经完成，现在我们可以编写用于构建模型的函数。如前所述，sbr\
  \ 实现了两种模型：基于 LSTM 的模型和基于移动平均的模型（EWMA）。我们将使用 EWMA 模型。EWMA 模型在计算量上更简单，我们在此使用它。指数加权移动平均是一种用于监控过程均值微小偏移的控制方法。它按几何递减的顺序对观测值进行加权，使得最近的观测值权重最大，而较旧的观测值对模型贡献很小。在许多情况下，这已经足够了。\n\
  \n首先，我们编写一个函数来设置模型的超参数（清单 7-33）。\n\n```\nuse sbr::models::ewma::{Hyperparameters,\
  \ ImplicitEWMAModel};\nuse sbr::models::{Loss, Optimizer};\nfn build_model(num_items:\
  \ usize) -> ImplicitEWMAModel {\nlet hyperparameters = Hyperparameters::new(num_items,\
  \ 128)\n.embedding_dim(32)\n.learning_rate(0.16)\n.l2_penalty(0.0004)\n.loss(Loss::WARP)\n\
  .optimizer(Optimizer::Adagrad)\n.num_epochs(10)\n.num_threads(1);\nhyperparameters.build()\n\
  }\n清单 7-33\nchapter7/goodbooks-recommender/src/main.rs\n```\n\n为了使模型能够工作，我们需要将数据转换为\
  \ sbr 的 interactions 对象。Interactions 接收用户数量、物品数量以及时间戳。由于 ID 是序数，我们可以取最大的 ID 作为用户和物品的数量，并假设数据按时间顺序排列，将索引作为时间戳。在其他情况下，我们需要以不同的方式处理这些问题（清单\
  \ 7-34）。\n\n```\nfn build_interactions(data: &[UserReadsBook]) -> Interactions {\n\
  let num_users = data\n.iter()\n.map(|x| x.user_id)\n.max()\n.unwrap() + 1;\nlet\
  \ num_items = data\n.iter()\n.map(|x| x.book_id)\n.max()\n.unwrap() + 1;\nlet mut\
  \ interactions = Interactions::new(num_users,\nnum_items);\nfor (idx, datum) in\
  \ data.iter().enumerate() {\ninteractions.push(\nInteraction::new(datum.user_id,\n\
  datum.book_id,\nidx)\n);\n}\ninteractions\n}\n清单 7-34\nchapter7/goodbooks-recommender/src/main.rs\n\
  ```\n\n现在模型已经构建完成，我们需要在数据上进行训练。接下来，我们将创建一个拟合函数。与之前进行的其他训练一样，需要将数据拆分为测试集和训练集，以便评估模型的拟合程度，并确保模型确实在学习。参见清单\
  \ 7-35。\n\n```\nuse sbr::evaluation::mrr_score;\nfn fit(model: &mut ImplicitEWMAModel,\n\
  data: &Interactions)\n-> Result {\nlet (train, test) = user_based_split(\ndata,\
  \ &mut rng, 0.2);\nmodel.fit(&train.to_compressed())?;\nlet mrr = mrr_score(model,\
  \ &test.to_compressed())?;\nOk(mrr)\n}\n清单 7-35\nchapter7/goodbooks-recommender/src/main.rs\n\
  ```\n\n在清单 7-35 的拟合函数中，结果是 MRR 分数。MRR 分数，即平均倒数排名，是衡量单个最高排名项目有效性的分数。遗憾的是，另一种流行的评分方法——平均精度均值（MAP），在\
  \ sbr 中并未实现，需要用户自行实现。\n\n模型训练完成后，我们需要对模型进行序列化，以便将其保存到文件中。我们可以使用 serde 库来完成此操作（清单\
  \ 7-36）。\n\n```\nfn serialize_model(model: &ImplicitEWMAModel,\npath: &Path) ->\
  \ Result {\nlet file = File::create(path)?;\nlet mut writer = BufWriter::new(file);\n\
  Ok(serde_json::to_writer(&mut writer, model)?)\n}\n清单 7-36\nchapter7/goodbooks-recommender/src/main.rs\n\
  ```\n\n现在，我们需要一个函数来依次执行我们刚才提到的各个函数。参见清单 7-37。\n\n```\nfn main_build() {\nlet ratings_path\
  \ = Path::new(\"ratings.csv\");\nlet books_path = Path::new(\"books.csv\");\nlet\
  \ model_path = Path::new(\"model.json\");\n// 如果模型已存在，则提前退出。\nif model_path.exists()\
  \ {\nprintln!(\"模型已拟合。\");\nreturn ();\n}\ndownload_data(ratings_path, books_path);\n\
  let ratings = deserialize_ratings(ratings_path).unwrap();\nlet (id_to_title,\ntitle_to_id)\
  \ = deserialize_books(books_path).unwrap();\nprintln!(\"已反序列化 {} 条评分。\", ratings.len());\n\
  println!(\"已反序列化 {} 本书。\", id_to_title.len());\nlet interactions = build_interactions(&ratings);\n\
  let mut model = build_model(interactions.num_items());\nprintln!(\"正在拟合...\");\n\
  let mrr = fit(&mut model, &interactions)\n.expect(\"无法拟合模型。\");\nprintln!(\"模型拟合完成，MRR\
  \ 为 {:.2}\", mrr);\nserialize_model(&model, &model_path)\n.expect(\"无法序列化模型。\");\n\
  }\n清单 7-37\nchapter7/goodbooks-recommender/src/main.rs\n```\n\n现在，我们应该将这个 `main_build`\
  \ 函数接入主函数中（清单 7-38）。\n\n```\nfn main() {\nlet opt = Opt::from_args();\nmatch opt\
  \ {\nOpt::Fit => main_build(),\n_ => {\nunimplemented!();\n},\n}\n}\n清单 7-38\nchapter7/goodbooks-recommender/src/main.rs\n\
  ```\n\n现在使用 `cargo run – fit` 运行它，应该会将模型保存到 `model.json` 文件中（清单 7-39）。\n\n```\n\
  $ ls\nbooks.csv  Cargo.lock  Cargo.toml  fit  model.json  ratings.csv  src  target\n\
  $\n清单 7-39\n检查目录中的 model.json 文件\n```\n\n\n\n### 7.3.5 模型预测\n\n为了能够进行预测，我们需要完成两件事。首先是模型反序列化。模型反序列化后，它将位于\
  \ `ImplicitEWMAModel` 结构体中（代码清单 7-40）。\n\n```\nuse std::io::BufReader;\nfn deserialize_model()\
  \ -> Result {\nlet file = File::open(\"model.json\")?;\nlet reader = BufReader::new(file);\n\
  let model = serde_json::from_reader(reader)?;\nOk(model)\n}\n代码清单 7-40\nchapter7/goodbooks-recommender/src/main.rs\n\
  ```\n\n模型反序列化完成后，我们将使用该模型进行预测。因此，需要将预测函数传递给模型进行推理。同时，还需要传递目标令牌（代码清单 7-41）。\n\n```\n\
  fn predict(input_titles: &[String],\nmodel: &ImplicitEWMAModel)\n-> Result, failure::Error>\
  \ {\nlet (id_to_title,\ntitle_to_id) = deserialize_books(\n&Path::new(\"books.csv\"\
  )\n).unwrap();\n// 首先检查输入是否有效。\nfor title in input_titles {\nif !title_to_id.contains_key(title)\
  \ {\nprintln!(\"未找到该标题，忽略: {}\", title);\n}\n}\n// 其余代码..\n}\n代码清单 7-41\nchapter7/goodbooks-recommender/src/main.rs\n\
  ```\n\n为此，我们需要创建用户表示以及可能被预测的索引。\n\n由于模型是基于标题 ID 训练的，我们将提供这些 ID 作为预测的输入。我们还需要可能被预测的\
  \ ID。在这种情况下，ID 是有序的，因此我们可以直接从 0 取到长度值。在其他情况下，我们可能需要收集实际的向量。参见代码清单 7-42。\n\n```\n\
  fn predict(input_titles: &[String],\nmodel: &ImplicitEWMAModel)\n-> Result, failure::Error>\
  \ {\n// 之前的代码..\n// 将标题映射为索引。\nlet input_indices: Vec = input_titles\n.iter()\n\
  .filter_map(|title| title_to_id.get(title))\n.cloned()\n.collect();\nlet indices_to_score:\
  \ Vec =\n(0..id_to_title.len()).collect();\n// 其余代码..\n}\n代码清单 7-42\nchapter7/goodbooks-recommender/src/main.rs\n\
  ```\n\n基于 `input_indices` 向量，我们可以获取用户表示，并将其传递给模型进行预测（代码清单 7-43）。\n\n```\nfn predict(input_titles:\
  \ &[String],\nmodel: &ImplicitEWMAModel)\n-> Result, failure::Error> {\n// 之前的代码\
  \ ..\n// 获取用户表示。\nlet user = model.user_representation(&input_indices)?;\n// 获取实际预测结果。\n\
  let predictions = model.predict(&user, &indices_to_score)?;\n// 其余代码 ..\n代码清单 7-43\n\
  chapter7/goodbooks-recommender/src/main.rs\n```\n\n生成预测结果后，我们需要根据分数进行排序。这里我们只展示前\
  \ 10 个结果（代码清单 7-44）。\n\n```\nfn predict(input_titles: &[String],\nmodel: &ImplicitEWMAModel)\n\
  -> Result, failure::Error> {\n// 之前的代码 ...\nlet mut predictions: Vec\n= indices_to_score.iter()\n\
  .zip(predictions)\n.map(|(idx, score)| (idx, score))\n.collect();\npredictions\n\
  .sort_by(\n|(_, score_a), (_, score_b)|\nscore_b.partial_cmp(score_a)\n.unwrap());\n\
  Ok((&predictions[..10])\n.iter()\n.map(|(idx, _)| id_to_title.get(idx).unwrap())\n\
  .cloned()\n.collect())\n}\n代码清单 7-44\nchapter7/goodbooks-recommender/src/main.rs\n\
  ```\n\n将其接入主方法后，应能得到我们所需的结果（代码清单 7-45）。\n\n```\nfn main() {\nlet opt = Opt::from_args();\n\
  match opt {\nOpt::Fit => main_build(),\nPredict(book) => {\nlet model = deserialize_model()\n\
  .expect(\"无法反序列化模型。\");\nlet tokens: Vec = book.text.split(\",\").map(\n|s| s.to_string()).collect();\n\
  let predictions = predict(&tokens, &model)\n.expect(\"无法获取预测结果\");\nprintln!(\"\
  预测结果:\");\nfor prediction in predictions {\nprintln!(\"{}\", prediction);\n}\n},\n\
  }\n}\n代码清单 7-45\nchapter7/goodbooks-recommender/src/main.rs\n```\n\n使用代码清单 7-46\
  \ 中的命令，我们可以预测用户输入的标题。\n\n```\n$ cargo run -- predict --text \"The Alchemist\"\n\
  Finished dev [unoptimized + debuginfo] target(s) in 0.22s\nRunning `target/debug/goodbooks-recommender\
  \ predict --text 'The Alchemist'`\nPredictions:\nThe Alchemist\nThe Kite Runner\n\
  One Hundred Years of Solitude\nThe Da Vinci Code (Robert Langdon, #2)\nA Thousand\
  \ Splendid Suns\nLife of Pi\nEat, Pray, Love\nMemoirs of a Geisha\nAngels & Demons\
  \  (Robert Langdon, #1)\nThe Five People You Meet in Heaven\n$\n代码清单 7-46\nchapter7/goodbooks-recommender/src/main.rs\n\
  ```\n\n## 7.4 本章小结\n\n本章向你介绍了 Rust 在高性能计算中不同有趣的领域，这些领域通常是机器学习的非传统应用。本章从统计分析开始，说明了一旦我们能够将数据集转换为\
  \ ndarray 矩阵，统计分析就变得非常简单。在下一节中，我们使用了 SIMD 和 BLAS 的封装器来对向量执行高性能和并行计算。最后，我们使用 Rust\
  \ 中一个流行的推荐系统 crate 构建了一个推荐系统。\n\n在本书的最后一章，你将学习如何利用云以及其他部署 Rust 机器学习应用和模型的方式，创建并部署用于生产的\
  \ Rust ML 应用。\n\n# 8. 使用 Rust 应用\n\n在本书中，我们探讨了数据转换以及在 Rust 中创建机器学习模型。一旦我们确定了要采用的机器学习工作流，就需要一种方法将其集成到整体架构中。由于\
  \ Rust 是一门相对较新的语言，你的项目中的整体架构很可能是用主流语言创建的。在本章中，我们将探讨如何将 Rust 代码集成到整体生产架构中。我们将从在 Python\
  \ 应用中集成 Rust 代码开始，然后转向在 Java 应用中集成 Rust 代码。最后，我们将介绍如何在 Rust 中创建无服务器应用。\n\n## 8.1\
  \ Rust 即插即用\n\n由于 Rust 是一门相对较新的应用语言，你很可能正在处理一个用 Python 或 Java 等流行语言编写的、拥有数百万行代码的遗留应用。在这种情况下，使用\
  \ Rust ML 应用意味着只使用现有应用的一小部分。Rust 没有运行时这一特性，使得只要“其他”语言有调用共享库的方式，就很容易在这些语言中调用 Rust\
  \ 代码。通常，所有主流语言都具备这种能力。在接下来的几节中，我们将举两个例子：一个是在 Python 中调用 Rust 函数，另一个是在 Java 中调用。\n\
  \n\n\n### 8.1.1 Python\n\n在本节中，我们将使用 PyO3 运行 Rust 代码。^(³⁴) PyO3 为 Python 提供了 Rust\
