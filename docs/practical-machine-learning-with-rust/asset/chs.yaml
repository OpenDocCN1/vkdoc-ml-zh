  ```


  注意清单 8-21 中我们加载的依赖项。`JNIEnv` 是 JVM 的接口，大多数方法都将基于它工作。`jni::objects` 中的对象是携带额外生命周期信息的对象，这些信息防止它们逃逸出上下文。`jni::sys`
  中的对象旨在从 Rust 返回指向相应数据的指针。我们不能发送确切的数据，因为生命周期检查器不允许。


  现在让我们关注包装函数 `Java_IrisClassificationXgboost_fit` 和 `Java_IrisClassificationXgboost_predict`。我们将对这些包装函数应用
  `no_mangle` 外部属性，这样 Rust 在创建二进制文件时就不会混淆方法名称，Java 也能够识别这些函数。通常，如果在创建二进制文件时不这样做，Rust
  会在内部混淆代码中编写的方法名称。^(³⁶) Java 需要按照 `Java_ 类名 _ 方法名` 的格式编写。通过这种方式，创建了 `Java_IrisClassificationXgboost_fit`
  和 `Java_IrisClassificationXgboost_predict` 包装函数。


  现在 `fit` 方法没问题，因为它是一个 void 方法，但对于 `Java_IrisClassificationXgboost_predict`，我们返回一个字符串。在这种情况下，我们需要处理一些额外的事情。输出类型需要是
  `jstring`，因此我们需要使用 `predict` 函数中的 `env.new_string` 创建一个新的 Java 字符串。然后我们将返回指向该函数的指针。


  现在我们已经编写了所有将 Rust 函数暴露给 Java 代码的代码。我们现在应该能够运行这段代码了。为此，我们在 Java 中创建 `main` 方法（清单
  8-22）。


