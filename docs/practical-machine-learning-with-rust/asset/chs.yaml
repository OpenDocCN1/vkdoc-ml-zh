  \n\n## 4.6 在 S3 上存储数据\n\n机器学习模型，尤其是深度学习模型，需要海量数据才能有效训练并创建出具有可用精度的模型。存储如此大量的数据可能是一个挑战，因为我们可能需要拥有数\
  \ TB 的磁盘空间，或者投入资源来采购和配置这么大的空间。云存储解决方案使我们能够规避这个问题。亚马逊和 Azure 等各类云提供商都提供低成本的存储解决方案，承诺在互联网上公开或私下存储和管理我们的数据。\n\
  \nAmazon S3 是这方面最流行的解决方案之一。要从 Rust 执行 S3 操作，一个流行的 crate 是 `rusoto`。^(¹⁷) Rusoto\
  \ 是一个集成项目，为每个 AWS 服务都提供了一个 crate。要使用 S3，我们将使用 `rusoto-s3` crate。\n\n为了探索与 Amazon\
  \ S3 配合使用的代码，我们将创建一个名为 `s3_files` 的二进制包（清单 4-40）。\n\n```\n$ cd chapter4 && cargo\
  \ new s3_files --bin\n清单 4-40\n创建二进制包 s3_files\n```\n\n现在应该已经创建了 `s3_files` 文件夹，其中包含\
  \ `src/main.rs` 和 `Cargo.toml` 文件。我们现在可以将 S3 依赖项（`rusoto_s3` 和 `rusoto_core` crate）添加到\
  \ toml 文件中（清单 4-41）。我们还有一些额外的 crate，例如提供良好日志配置管理的 `env_logger`，以及提供高效文件管理良好类型的 `futures`\
  \ 和 `futures-fs`。我们之前也见过 `rustlearn` crate、`rand` crate、`csv` crate 和 `ml-utils`\
  \ crate。\n\n```\n[package]\nname = \"s3_files\"\nversion = \"0.1.0\"\nedition =\
  \ \"2018\"\n[dependencies]\nrusoto_s3 = \"0.38.0\"\nrusoto_core = \"0.38.0\"\nenv_logger\
  \ = \"0.6.1\"\nfutures = \"0.1.26\"\nfutures-fs = \"0.0.5\"\nrand = \"0.6.5\"\n\
  csv = \"1.0.7\"\nml-utils = { path = \"../../ml-utils\" }\nrustlearn = \"0.5.0\"\
  \n清单 4-41\nchapter4/s3_files/Cargo.toml\n```\n\n现在我们应该能够编写一个函数，该函数接收客户端、存储桶和文件名，并将其放入\
  \ S3（清单 4-42）。\n\n```\nuse futures::{Future, Stream};\nuse rusoto_core;\nuse rusoto_core::credential::{\n\
  AwsCredentials, DefaultCredentialsProvider};\nuse rusoto_core::{Region, ProvideAwsCredentials,\
  \ RusotoError};\nuse rusoto_s3::{\nCreateBucketRequest, DeleteBucketRequest,\nDeleteObjectRequest,\
  \ GetObjectRequest, ListObjectsV2Request,\nPutObjectRequest, S3Client, S3,\n};\n\
  fn push_file_to_s3(\nclient: &S3Client, bucket: &str,\ndest_filename: &str, local_filename:\
  \ &str,\n) {\nlet mut f = File::open(local_filename).unwrap();\nlet mut contents:\
  \ Vec = Vec::new();\nmatch f.read_to_end(&mut contents) {\nErr(why) => panic!(\"\
  Error opening file to send to S3: {}\", why),\nOk(_) => {\nlet req = PutObjectRequest\
  \ {\nbucket: bucket.to_owned(),\nkey: dest_filename.to_owned(),\nbody: Some(contents.into()),\n\
  ..Default::default()\n};\nclient.put_object(req).sync().expect(\"Couldn't PUT object\"\
  );\n}\n}\n}\n清单 4-42\nchapter4/s3_files/src/main.rs\n```\n\n清单 4-42 中的函数接收一个由 `local_filename`\
  \ 指定的文件，并将其放入 S3，其中 `dest_filename` 是键。要能够运行此函数，我们需要一个 S3 客户端（清单 4-43）。\n\n```\n\
