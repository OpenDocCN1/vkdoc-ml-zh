  ### 8.1.2 Java


  与我们之前看到的 Python 示例类似，我们可以集成 Rust 函数并在 Java 类中调用它们。概念是相似的，我们需要在 C 接口中暴露 Rust 函数，并在
  Java 中定义引用这些 C 接口的本地方法。这是通过 `jni` crate 完成的。让我们以第 2 章的 xgboost 示例为例，并将其增强为一个 Java
  应用程序。


  与我们之前在 Python 部分看到的一样，任何 FFI 项目都会在两种语言中都有一些代码。我们将看到作为 Java 端和 Rust 端之间桥梁所需的最少代码量。Java
  要求所有本地方法都遵循 Java 本地接口（JNI）标准。因此，我们需要从 Java 定义函数签名，然后编写符合该签名的 Rust 代码。步骤如下：


