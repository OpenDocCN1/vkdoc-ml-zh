  \n\n\n为了完成 SQL 这一节的内容，我们将对最热列求平均值，以找出班加罗尔气温中最高的温度。SQL 在数据科学中的主要优势在于，它允许我们不将数据拉取到代码中，而是将代码发送到数据所在处。这可以通过将业务逻辑编写为\
  \ SQL 查询，并将查询发送到数据库执行来实现（清单 4-32）。\n\n```\npub fn run() -> Result> {\n// 之前的代码 ...\n\
