  ### 2.8.9 模型评估\n\n与回归部分类似，在本分类部分中，我们也一直在展示模型的准确率以及相应的模型代码，以便读者可以自行执行代码并核对准确率。本节将解释我们使用的各个模型评估函数。\n\
  \n**准确率** 评估分类模型最常用的指标是分类准确率。它是正确预测的数量与总输入样本数量的比值。\n\n![$$ \\mathrm{准确率}=\\frac{\\\
  mathrm{正确预测的数量}}{\\mathrm{预测总数}} $$](img/482357_1_En_2_Chapter_TeX_Equ9.png)\n\n\
  (9)\n\n我们可以使用下面的函数（列表 2-65）来实现它。\n\n```\npub fn accuracy(y_test: &[u32], y_preds:\
  \ &[u32]) -> f32 {\nlet mut correct_hits = 0;\nfor (predicted, actual) in y_preds.iter().zip(y_test.iter())\
  \ {\nif predicted == actual {\ncorrect_hits += 1;\n}\n}\nlet acc: f32 = correct_hits\
  \ as f32 / y_test.len() as f32;\nacc\n}\n列表 2-65\nml-utils/src/sup_metrics.rs\n\
  ```\n\n该函数的签名使用 `u32` 类型，因为 y 值将是特定的标签。\n\n或者，由于我们在本章中使用 `rustlearn`，我们可以使用该包中的\
  \ `accuracy_score` 函数（列表 2-66）。\n\n```\nuse rustlearn::metrics::accuracy_score;\n\
  pub fn run() -> Result> {\n// 之前的代码 ...\nlet prediction = model.predict(&flower_x_test).unwrap();\n\
  let acc = accuracy_score(&flower_y_test, &prediction);\n// 剩余代码 ...\n列表 2-66\nchapter3/rustlearn_classification_tasks/src/logistic_reg.rs\n\
  ```\n\n使用上述函数，我们应该能够看到所实现模型的以下准确率分数（列表 2-67）。\n\n```\n$ cargo run lr < data/iris.csv\n\
  Finished dev [unoptimized + debuginfo] target(s) in 3.66s\nRunning `target/debug/rustlearn_classification_tasks\
  \ lr`\nLogistic Regression: accuracy: 0.3\nLogistic Regression: accuracy: 0.3\n\
  列表 2-67\nchapter3/rustlearn_classification_tasks/src/logistic_reg.rs}\n```\n\n这种计算准确率分数的方法仅在每个类别的样本数量相等时才有效。例如，假设\
  \ 99% 的样本属于 A 类，其余 1% 属于 B 类。那么根据上述指标，一个简单的模型（如列表 2-68 所示）将所有样本外类别预测为 A 类，其准确率将达到\
  \ 99%。\n\n```\nfn model(y_test: &Vec) -> Vec {\nvec![String::from(\"Class A\");\
  \ y_test.len()]\n}\n列表 2-68\n我的超棒机器学习模型\n```\n\n结果将是，我们会对达到高准确率产生一种虚假的安全感。\n\n**对数损失**\
  \ 对数损失，或称交叉熵损失，通过惩罚错误分类来工作。它适用于多类分类。当预测概率偏离实际标签时，对数损失会增加。一个完美的模型的对数损失为 0。因此，当实际观测标签为\
  \ 1 时，预测概率为 0.12 将会很糟糕，并导致较高的对数损失 [10]。其公式如下：\n\n![$$ {H}_p(q)=-\\frac{1}{N}\\;\\\
  sum \\limits_{i=1}^N{y}_i\\cdot \\log \\left(p\\left({y}_i\\right)\\right)+\\left(1-{y}_i\\\
  right)\\log\\;\\left(1-p\\left({y}_i\\right)\\right) $$](img/482357_1_En_2_Chapter_TeX_Equ10.png)\n\
  \n(10)\n\n图 2-6 中的图表显示了在真实观测值为 1 的情况下，可能出现的对数损失范围。当概率接近 1 时，对数损失并不陡峭，但当概率趋近于 0 时，它会迅速增加。我们希望任何错误都受到惩罚，但请注意，当预测器自信且错误时，惩罚是无限的。\n\
  \n![../images/482357_1_En_2_Chapter/482357_1_En_2_Fig6_HTML.jpg](img/482357_1_En_2_Fig6_HTML.jpg)\n\
  \n图 2-6\n\n对数损失\n\n因此，与简单的“是/否”性质相比，对数损失对准确率有更细致的考量。它根据模型与真实值的偏差程度给出一个值。\n\n在 Rust\
  \ 中，列表 2-69 中的函数将计算对数损失分数。向量 `y_test` 和 `y_preds` 分别是真实值和预测值。对数损失对于概率值 0 和 1 是未定义的，因此\
  \ `y_test` 向量被限制在略高于 0 和略低于 1 的范围内，由 `eps` 根据公式 max(min(*p*, 1 − ∈), ∈) 给出。注意，这里使用了\
  \ `partial_cmp` 进行比较，因为我们是在两个浮点数之间进行比较。Rust 官方的立场是，比较浮点数非常棘手且依赖于具体情况，最好尽可能避免。没有“开箱即用”的万能解决方案\
  \ [11]。\n\n完成后，我们将在限制后的向量上实现用于二分类的实际对数损失函数。\n\n```\nfn logloss_score(y_test: &Vec,\n\
  y_preds: &Vec,\neps: f32) -> f32 {\nlet y_preds = y_preds.iter().map(|&p| {\nmatch\
  \ p.partial_cmp(&(1.0 - eps)) {\nSome(Ordering::Less) => p,\n_ => 1.0 - eps, //\
  \ 如果相等或更大。\n}\n});\nlet y_preds = y_preds.map(|p| {\nmatch p.partial_cmp(&eps) {\n\
  Some(Ordering::Less) => eps,\n_ => p,\n}\n});\nlet logloss_vals = y_preds.zip(y_test.iter())\n\
  .map(|(predicted, &actual)| {\nif actual as f32 == 1.0 {\n(-1.0) * predicted.ln()\n\
  } else if actual as f32 == 0.0 {\n(-1.0) * (1.0 - predicted).ln()\n} else {\npanic!(\"\
  不支持。y_preds 应为 0 或 1\");\n}\n});\nlogloss_vals.sum()\n}\n列表 2-69\nml-utils/src/sup_metrics.rs\n\
  ```\n\n现在可以将其用于类似列表 2-70 的代码中。\n\n```\npub fn run() -> Result> {\nlet preds = vec![1.,\
  \ 0.0001, 0.908047338626,\n0.0199900075962, 0.904058545833, 0.321508119045,\n0.657086320195];\n\
  let actuals = vec![1., 0., 0., 1., 1., 0., 0.];\nprintln!(\"{:?}\",\nlogloss_score(&actuals,\
  \ &preds, 1e-15)); // 输出 7.8581247\nOk(())\n}\n列表 2-70\nchapter2/rustlearn_classification_tasks/src/binary_class_scores.rs\n\
  ```\n\n**ROC-AUC** ROC 曲线（接收者操作特征曲线）是一个显示分类模型在所有分类阈值下性能的图表 [12]。该曲线绘制了两个参数。\n\n\
  *   真正率\n\n*   假正率\n\n真正率（TPR）是召回率的同义词，因此定义为：\n\n![$$ TPR=\\frac{TP}{TP+ FN} $$](img/482357_1_En_2_Chapter_TeX_Equ11.png)\n\
