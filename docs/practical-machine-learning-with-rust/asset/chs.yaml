  \n## 6.4 结论\n\n本章向我们介绍了计算机视觉中不同的有趣应用。本章从图像分类开始，以及如何使用 tch 库构建图像分类器，该库可以轻松使用 pytorch\
  \ 深度学习库。然后，本章继续介绍在数据集样本数量较少时，如何使用预训练网络进行图像分类。接下来讨论的应用是神经风格迁移，并创建了一个应用程序，该程序接收内容图像和风格图像，并将内容图像以风格图像的风格进行转换。本章的下一个应用是生成式神经网络的工作原理，以及使用\
  \ tch 库创建假人脸生成器应用程序。在主要使用 tch 库之后，本章还包含了一个使用 tensorflow 库在图像中识别人脸的应用。\n\n在下一章中，你将了解机器学习中的其他不同需求，例如\
  \ Rust 中的统计分析和推荐系统。\n\n# 7. 机器学习领域\n\n在前两章中，我们了解了机器学习在 NLP 和计算机视觉这两个主要领域中的处理方法。这些领域涵盖了机器学习的主要突破，并且这些领域的最新技术水平正在不断被推进。但许多机器学习和高性能计算也出现在这些领域之外。在本章中，我们将了解其中一些领域，以及\
  \ Rust 如何帮助在这些领域创建应用程序。我们将从统计分析开始，计算遗传数据集中不同疾病的 Z 分数。然后，我们将继续了解如何使用 Rust 中的 SIMD\
  \ 和 BLAS 库编写高性能代码。最后，我们将在 Rust 中构建一个优秀书籍推荐系统。\n\n到本章结束时，你应该对如何在不同领域构建机器学习应用程序有一个相当清晰的理解。\n\
  \n\n\n## 7.1 统计分析\n\n作为数据科学家和机器学习工程师，我们需要对不同类型的数据进行大量统计分析。本节的基本假设是，如果我们能够解析数据并将变量的不同测量值存储到\
  \ ndarray 矩阵中，就应该能够对其进行统计分析。许多拥有机器学习库的编程语言都实现了 ndarray 矩阵类型。ndarray 是一个多维容器，用于存储相同类型且大小固定的元素。数组的维度和元素数量由其形状（shape）定义。在\
  \ Rust 中，ndarray 类型由 ndarray crate 实现。第 4 章已详细讨论了 ndarray crate。\n\n为了探索如何使用 Rust\
  \ 计算不同的统计参数，我们创建一个名为 statistics 的 Rust 项目，并在其中编写代码。在终端中切换到 chapter7 目录，并创建 Rust\
  \ 二进制包 statistics（列表 7-1）。\n\n```\n$ cd chapter7\n$ cargo new statistics --bin &&\
  \ cd statistics\n列表 7-1\n创建 Rust 二进制包 statistics\n```\n\n现在我们应该拥有 main.rs 文件和 Cargo.toml\
  \ 文件。将依赖项添加到 toml 文件中。由于在本例中我们要计算数据集的不同统计量，因此需要在依赖项中添加 ndarray crate（列表 7-2）。\n\n\
  ```\n[package]\nname = \"statistics\"\nversion = \"0.1.0\"\nedition = \"2018\"\n\
  [dependencies]\nndarray = \"0.12.1\"\n列表 7-2\nchapter7/statistics/Cargo.toml\n```\n\
  \n现在让我们继续讨论数据集。作为 Rust 如何使我们能够对原始数据进行统计分析的一个示例，我们可以对基因表达数据集执行简单的差异表达分析。在进行涉及大规模多重假设检验的分析时，我们将使用错误发现率来提供可解释的结果。请注意数据集的格式，以及我们将如何读取数据集以创建我们选择的向量。\n\
  \n我们可以从这个网址下载原始数据：`{`[`https://www.ncbi.nlm.nih.gov/sites/GDSbrowser?acc=GDS1615}`](https://www.ncbi.nlm.nih.gov/sites/GDSbrowser%253Facc%253DGDS1615%257d)。参见列表\
  \ 7-3。\n\n```\n$ wget ftp://ftp.ncbi.nlm.nih.gov/geo/datasets\\\n/GDS1nnn/GDS1615/soft/GDS1615_full.soft.gz\n\
