  ## 3.7 结论


  在本章中，我们探讨了无监督学习和强化学习。在无监督学习部分，我们了解了如何使用 `rusty_machine` 在无标签数据集上实现 K-means、高斯混合模型和
  DBSCAN 进行聚类，以及使用 PCA 进行降维。接着，我们使用两种流行的方法（Rand 指数和 Jaccard 指数）评估了聚类模型。实现其他评估标准的基本方法与此类似。


  最后，我们探讨了强化学习以及如何在 rsrl 中使用它实现自定义模型。


  在下一章中，我们将离开模型，聚焦于机器学习的另一个重要维度：如何处理常见的数据格式和转换技术。我们还将学习如何在现有数据完全非结构化的情况下创建结构化数据。


  '
- "# 4. 处理数据\n\n机器学习应用依赖于数据运行。构建机器学习应用时，主要活动之一是从不同数据源整理数据、以有效格式存储，并将原始数据转换为适合机器学习应用的格式。数据可能以不同格式出现。在前面的章节中，我们主要处理\
  \ CSV 文件。CSV 文件非常适合存储和检索信息。此外，CSV 中的数据范式可以很好地转换为大多数计算发生的矩阵格式，这是一个额外优势。但在实际处理真实数据时，我们很少发现数据以完美的\
  \ CSV 格式呈现。在本章中，我们将探讨存储和检索信息的几种流行范式，并了解如何利用它们来提取、处理和存储数据。\n\n## 4.1 JSON\n\nJSON\
  \ 代表 JavaScript 对象表示法（JavaScript Object Notation）。它是一种非常常见的用于异步浏览器-服务器通信的格式；因此，很多时候来自某些网络进程的数据会直接以\
  \ JSON 格式存储。许多开发者认为 JSON 是 Web 的默认序列化-反序列化数据结构，其结果是许多 Web API 以 JSON 格式发布数据。在本节中，我们将了解如何处理\
  \ JSON 数据。\n\nSerde 及其相关 crate 非常适合不同数据格式的序列化和反序列化。对于 JSON，我们有 `serde_json`。\n\n\
  为了了解如何处理 JSON 数据结构以及如何编写将 JSON 对象解析为 Rust 数据类型的代码，让我们创建一个名为 `data_formats` 的包（代码清单\
  \ 4-1）。\n\n```\n$ cd chapter4 && cargo new data_formats –bin\n代码清单 4-1\n为 data_formats\
  \ 创建 bin 包\n```\n\n现在，在 `data_formats` 文件夹内，打开 `Cargo.toml` 文件，并用代码清单 4-2 中所示的依赖项更新其内容。正如我们之前所见，`serde`\
  \ 和 `serde-derive` 用于数据管理，而 `serde_json` 用于解析 JSON 文件。\n\n```\n[package]\nname =\
  \ \"data_formats\"\nversion = \"0.1.0\"\nedition = \"2018\"\n[dependencies]\nserde\
  \ = \"1.0.90\"\nserde_derive = \"1.0.90\"\nserde_json = \"1.0\"\n代码清单 4-2\nchapter4/working_with_data/data_formats/Cargo.toml\n\
  ```\n\n现在，我们应该能够读取任意 JSON 字符串并获取 JSON 的结构。这由 `serde_json::Value` 枚举实现（代码清单 4-3）。\n\
  \n```\npub fn run() -> Result> {\nlet json_str = r#\"{\n\"FirstName\": \"John\"\
  ,\n\"LastName\": \"Doe\",\n\"Age\": 43,\n\"Address\": {\n\"Street\": \"Downing Street\
  \ 10\",\n\"City\": \"London\",\n\"Country\": \"Great Britain\"\n},\n\"PhoneNumbers\"\
  : [\n\"+44 1234567\",\n\"+44 2345678\"\n]\n}\"#;\nlet person: serde_json::Value\
  \ = serde_json::from_str(json_str)\n.expect(\"JSON 格式不正确\");\nlet address = person.get(\"\
  Address\").unwrap();\nprintln!(\"{:?}\", address.get(\"City\").unwrap());\n}\n代码清单\
  \ 4-3\nchapter4/working_with_data/data_formats/src/jsonreading.rs\n```\n\n为了能够运行代码，我们需要在\
  \ main 函数中调用该函数。与我们目前看到的其他包类似，我们可以定义包含 main 方法的 `main.rs` 文件，该方法仅解析传入的参数。如果传入的参数是\
  \ `json`，则将控制权传递给 `jsonreading` 模块中的 `run` 函数。为此，当然，我们需要使用 `mod` 关键字暴露 `jsonreading`\
  \ 模块（代码清单 4-4）。\n\n```\n#[macro_use]\nextern crate serde_derive;\nextern crate serde;\n\
  extern crate serde_json;\nextern crate serde_xml_rs;\nuse std::vec::Vec;\nuse std::process::exit;\n\
  use std::env::args;\nmod jsonreading;\nmod xmlreading;\nmod csvreading;\nfn main()\
  \ {\nlet args: Vec = args().collect();\nlet model = if args.len()  {println!(\"\
  无操作\",); Ok(())},\nSome(\"json\") => jsonreading::run(),\n};\n// 将主代码放在另一个函数中有两个目的：\n\
  // 1. 我们可以使用 '?' 运算符。\n// 2. 我们可以安全地调用 exit，它不会运行任何析构函数。\nexit(match res {\nOk(_)\
  \ => 0,\nErr(e) => {\nprintln!(\"{}\", e);\n\n}\n})\n}\n代码清单 4-4\nchapter4/working_with_data/data_formats/src/main.rs\n\
  ```\n\n现在我们已经有了这些结构，可以运行该包并获取输出（代码清单 4-5）。\n\n```\n$ cargo run json\nFinished dev\
  \ [unoptimized + debuginfo] target(s) in 0.05s\nRunning 'target/debug/data_formats\
  \ json'\nString(\"London\")\n代码清单 4-5\nchapter4/working_with_data/data_formats/src/jsonreading.rs\n\
  ```\n\n\n\n虽然清单 4-3 中的代码可以运行，但其缺点在于我们没有利用 Rust 的强类型能力。使用强类型数据结构非常有益，因为当传入的数据格式发生变化时（这种情况经常发生），你希望程序能够失败，并且你希望快速获知这一信息。你不希望损坏的数据畅通无阻地通过，进而污染下游的机器学习应用。\n\
  \n因此，我们要做的是引入一个强类型结构，并基于该结构进行反序列化。这样，我们还能额外获得数据验证的好处。\n\n举个例子，我们将处理一个稍微复杂一点的 JSON\
  \ 文件，它是一个包含不同领域诺贝尔奖的数据集。^(¹²) 为了解析这个数据集，我们将创建一个本质上为结构体层次结构的东西（清单 4-6）。\n\n```\n\
  #[derive(Debug, Serialize, Deserialize)]\nstruct Prizes {\nprizes: Vec,\n}\n#[derive(Debug,\
  \ Serialize, Deserialize)]\n#[allow(non_snake_case)]\nstruct Prize {\ncategory:\
  \ String,\n#[serde(default)]\noverallMotivation: Option,\nlaureates: Vec,\n#[serde(deserialize_with\
  \ = \"de_u16_from_str\")]\nyear: u16,\n}\n#[derive(Debug, Serialize, Deserialize)]\n\
  struct NobelLaureate {\nshare: String,\n#[serde(default)]\nmotivation: Option,\n\
  surname: String,\n#[serde(deserialize_with = \"de_u16_from_str\")]\nid: u16,\nfirstname:\
  \ String,\n}\n清单 4-6\nchapter4/working_with_data/data_formats/src/jsonreading.rs\n\
  ```\n\n所以，顶层字段是 `prizes`，它是一个 `Prizes` 列表，每个 `Prizes` 包含 `categories`、`overallMotivation`\
  \ 和 `year` 作为单一属性，以及 `laureates` 作为 `laureates` 列表；`laureates` 包含 `share`、`motivation`、`surname`、`id`\
  \ 和 `firstname` 作为属性。`Motivation` 和 `overallMotivation` 可能不存在。因此，我们可以通过“告知” serde\
  \ 提供默认值（此处为 `None`）来将它们设为可选。由于 `year` 和 `id` 是数字，我们将尝试将它们修改为 `u16` 类型，并编写一个简单的辅助函数\
  \ `de_u16_from_str` 来执行从字符串到 `u16` 的转换。默认情况下，serde 反序列化器只支持转换为字符串（清单 4-7）。\n\n```\n\
  fn de_u16_from_str(deserializer: D)\n-> Result\nwhere D: Deserializer\n{\nlet s\
  \ = String::deserialize(deserializer)?;\nu16::from_str(&s).map_err(de::Error::custom)\n\
  }\n清单 4-7\nchapter4/working_with_data/data_formats/src/jsonreading.rs\n```\n\n在清单\
  \ 4-7 中，`deserializer` 是实现了 Serde 反序列化器 trait 的对象，内存中对此对象的任何引用都将具有 `'a` 生命周期。一旦从反序列化器中获取到特定的字符串对象，我们就使用\
  \ `u16::from_str` 函数将其解析为 `u16` 对象并返回。如果出现错误，则会引发 `de::Error::custom` 错误。\n\n现在我们已经完成了结构体的定义，serde\
  \ 应该能够轻松地将文件读取到该结构中（清单 4-8）。\n\n```\nuse std::fs::File;\npub fn run() -> Result>\
  \ {\n// 之前的代码 ...\nprintln!(\"from prizes json file\");\nlet file = File::open(\"\
  data/prize.json\")\n.expect(\"file should open read only\");\nlet prizes_data: Prizes\
  \ = serde_json::from_reader(file)\n.expect(\"file should be proper JSON\");\n//\
  \ 检查输出\nlet prizes_0 = &prizes_data.prizes[0];\nprintln!(\"category: {:?}\", prizes_0.category);\n\
  }\n清单 4-8\nchapter4/working_with_data/data_formats/src/jsonreading.rs\n```\n\n运行清单\
  \ 4-8 的输出应与清单 4-9 中的输出类似。\n\n```\n$ cargo run json\nFinished dev [unoptimized +\
  \ debuginfo] target(s) in 0.02s\nRunning `target/debug/data_formats json`\nString(\"\
  London\")\nfrom prizes json file\ncategory: \"physics\"\n清单 4-9\nchapter4/working_with_data/data_formats/src/jsonreading.rs\
  \ 输出\n```\n\n如果没有错误，我们就能毫无问题地解析 JSON 文件，并且定义的模式结构体也能正常工作。\n\n## 4.2 XML\n\n另一种流行的数据格式是\
  \ XML 数据格式。XML 格式也被认为是应用和设备间通信的开放标准之一。因此，大量数据也以 XML 格式提供。解析 XML 文件的工作方式和逻辑与 JSON\
  \ 文件格式中展示的相同。我们以结构体层次结构定义数据，然后尝试使用 serde 反序列化数据。在这种情况下，为了解析 XML 文件，我们将使用 `serde-xml-rs`\
  \ crate。\n\n解析 XML 文件的代码将位于同一个二进制包 `data_formats` 中，即我们在之前的 JSON 模式中创建的那个。这应该能让我们意识到，XML\
  \ 和 JSON 本质上都是层次化的数据格式，因此在编写 Rust 解析代码时，它们将具有相似的代码结构。唯一的区别在于底层的依赖项。本章剩余部分的代码也将体现类似的动机。因此，我们将在同一个\
  \ `data_formats` 二进制包中更新 `Cargo.toml` 文件（清单 4-10）。请注意，除了之前见过的 crate 之外，我们还添加了 `serde-xml-rs`\
  \ crate 用于解析 XML 文件。\n\n```\n[dependencies]\nserde = \"1.0.90\"\nserde_derive =\
  \ \"1.0.90\"\nserde_json = \"1.0\"\nserde-xml-rs = \"0.3.1\" // 添加 xml 依赖项\n清单 4-10\n\
  chapter4/working_with_data/data_formats/Cargo.toml\n```\n\n我们将为 `sample_2.xml` 文件创建一个\
  \ Rust 模型。该文件可以在 `chapter4/data/sample_2.xml` 中找到。文件结构类似于清单 4-11 所示。\n\n```\nproject\n\
  libraries\nlibrary\nmodule\nfiles\nfile\nlibraries\nlibrary\nmodule\nfiles\nfile\n\
  清单 4-11\n可能的文件结构\n```\n\n打开文件并注意上述结构。因此，我们将继续创建捕获 XML 文件中上述结构的结构体（清单 4-12）。\n\n\
  ```\nuse serde_xml_rs;\nuse serde_xml_rs::from_reader;\nuse serde_xml_rs::Deserializer;\n\
  #[derive(Deserialize, Debug)]\nstruct Project {\nname: String,\nlibraries: Vec,\n\
  module: Vec,\n}\n#[derive(Deserialize, Debug)]\nstruct Module {\nfiles: Vec,\n#[serde(default)]\n\
  libraries: Vec,\n}\n#[derive(Deserialize, Debug)]\nstruct Files {\nfile: Vec,\n\
  }\n#[derive(Deserialize, Debug)]\nstruct FileName {\nname: String,\n#[serde(rename\
  \ = \"type\")]\nlang: String,\n#[serde(rename = \"$value\")]\nbody: String,\n}\n\
  #[derive(Deserialize, Debug)]\nstruct Libraries {\nlibrary: Vec,\n}\n#[derive(Deserialize,\
  \ Debug)]\nstruct Library {\n#[serde(rename = \"groupId\")]\ngroup_id: String,\n\
  #[serde(rename = \"artifactId\")]\nartifact_id: String,\nversion: String,\n}\n清单\
  \ 4-12\nchapter4/working_with_data/data_formats/src/xmlreading.rs\n```\n\n在一个小的技术细节上，在结构体\
  \ `FileName` 中，我们不能使用 `type` 作为属性名，需要将其从 `lang` 重命名为 `type`，因为 `type` 是 Rust 中的关键字。其他的重命名是出于美观原因。另外，`#[serde(rename\
  \ = \"$value\")]` 有助于获取特定字段的值。所有其他构造应该是不言自明的，因为这类似于在 csv 和 json 中反序列化的方式。\n\n现在，我们应该能够将文件传递给反序列化器，这将创建我们的\
  \ `project` 变量（清单 4-13）。\n\n```\npub fn run() -> Result> {\nlet file = File::open(\"\
  data/sample_2.xml\").unwrap();\nlet project: Project = from_reader(file).unwrap();\n\
  println!(\"{:#?}\", project.libraries[0].library[0]);\nOk(())\n}\n清单 4-13\nchapter4/working_with_data/data_formats/src/xmlreading.rs\n\
  ```\n\n与我们在 JSON 部分看到的情况类似，我们需要在 `main.rs` 文件中添加模块，并添加一个参数，以便能够执行 `xmlreading` 模块中的\
  \ `run` 函数。因此，我们将在 `main` 方法中添加以下几行代码（清单 4-14）。\n\n\n\n```\n// 之前的导入\nmod jsonreading;\n\
  mod xmlreading;\nfn main() {\n// 之前的代码 ...\nlet res = match model {\nNone => {println!(\"\
  无内容\", ); Ok(())},\nSome(\"json\") => jsonreading::run(),\nSome(\"xml\") => xmlreading::run(),\n\
  Some(_) => {println!(\n\"目前仅允许 json 和 xml 格式\", ); Ok(())},\n};\n// 代码的剩余部分 ...\n\
  }\n代码清单 4-14\nchapter4/working_with_data/data_formats/src/main.rs\n```\n\n请注意代码清单\
  \ 4-12 中强类型构造的优势。这本质上是一种免费的数据验证：只需编写一次，所有数据问题便迎刃而解。此外，我们还能像操作代码一样高效地遍历数据。例如，类似下面的操作变得可行。^(¹³)\n\
  \n```\npub fn run() -> Result> {\n// 之前的代码 ...\nprintln!(\"{:#?}\", project.libraries[0].library[0]);\n\
  }\n```\n\n运行 `xmlreading::run` 函数并查看上述打印语句的输出，我们应该会得到代码清单 4-15 所示的结果。\n\n```\n$\
  \ cargo run xml\n    Finished dev [unoptimized + debuginfo] target(s) in 0.03s\n\
  \     Running `target/debug/data_formats xml`\nLibrary {\n    group_id: \"org.example\"\
  ,\n    artifact_id: \"\",\n    version: \"0.1\",\n}\n代码清单 4-15\nxmlreading::run\
  \ 输出\n```\n\n在本书附带的代码中，为完整起见，也保留了 csv 代码。该代码可从本书网站 [`apress.com`](http://apress.com)\
  \ 下载。\n\n## 4.3 网页抓取\n\n到目前为止，我们已经了解了如何读取 csv、json 和 xml 文件格式。尽管这些数据格式在存储和共享结构化数据方面非常流行，但有时数据可能根本不以结构化格式存在，我们需要从不同来源收集数据并将其整合在一起。实现这一目标的方法之一就是网页抓取。网页抓取是指筛选互联网上公开可用的数据，并将数据传递给后续处理流程。要通过\
  \ Rust 进行网页抓取，我们需要两个 crate 作为依赖项，即 `reqwest` 和 `scraper`。\n\n为了探索执行网页抓取所需的代码，我们现在将创建一个名为\
  \ `scraping` 的新包（代码清单 4-16）。\n\n```\n$ cd chapter4 && cargo new scraping –bin\n\
  代码清单 4-16\n创建 scraping 包\n```\n\n现在，我们可以在 `Cargo.toml` 文件中添加 `reqwest` 和 `scraper`\
  \ 依赖项（代码清单 4-17）。\n\n```\n[package]\nname = \"scraping\"\nversion = \"0.1.0\"\n\
  edition = \"2018\"\n\n[dependencies]\nreqwest = \"0.9.15\"\nscraper = \"0.10.0\"\
  \n代码清单 4-17\nchapter4/working_with_data/scraping/Cargo.toml\n```\n\n`reqwest` 包是一个便捷的高级\
  \ Web 客户端，我们将用它来访问特定的网页；而 `scraper` 将用于使用 CSS 选择器解析和查询 HTML 页面。\n\n作为示例，我们将以 [`moneycontrol.com`](http://moneycontrol.com)\
  \ 网站为例。该网站是一个印度在线商业新闻网站。需要牢记的重要一点是，该网站还发布在 BSE 和 NSE 上市的不同上市公司的定期股票价格。BSE 和 NSE\
  \ 是印度的两大主要证券交易所。\n\n现在考虑一个假设场景：我们想要构建一个关于某家特定印度公司（即 NTPC）的时间线和价格的数据集。NTPC 是一家由印度政府拥有的火电公司，并在\
  \ sensex 指数中上市。我们可以在 moneycontrol 网站的这个 money control NTPC 链接中找到 NTPC 股票的当前价格：[`https://www.moneycontrol.com/india/stockpricequote/power-generation-distribution/ntpc/NTP`](https://www.moneycontrol.com/india/stockpricequote/power-generation-distribution/ntpc/NTP)。\n\
  \n![../images/482357_1_En_4_Chapter/482357_1_En_4_Fig1_HTML.jpg](img/482357_1_En_4_Fig1_HTML.jpg)\n\
  \n图 4-1\n\nMoneycontrol\n\n如图 4-1 所示，列出了 BSE 和 NSE 的价格。要获取数据，我们需要获取页面的响应。这可以使用 `reqwest`\
  \ API 来完成（代码清单 4-18）。\n\n```\nuse reqwest;\n\nfn main() -> Result> {\n    let mut\
  \ resp = reqwest::get(\n\"https://www.moneycontrol.com/india/stockpricequote/power-generation-distribution/ntpc/NTP\"\
  )?;\n    assert!(resp.status().is_success());\n    // 剩余代码 ...\n}\n代码清单 4-18\nchapter4/working_with/data/scraping/src/main.rs\n\
  ```\n\n这部分代码会将响应存储在 `resp` 变量中。完成后，我们需要解析 HTML，选择特定的目标数据，然后将其收集到一个变量中。如代码清单 4-19\
  \ 所示。\n\n```\nuse scraper::{Selector, Html};\n\nfn main() -> Result> {\n    // 之前的代码\
  \ ...\n    let body = resp.text().unwrap();\n    let fragment = Html::parse_document(&body);\n\
  \    let stories = Selector::parse(\"#Bse_Prc_tick > strong:nth-child(1)\").unwrap();\n\
  \    for price in fragment.select(&stories) {\n        let price_txt = price.text().collect::>();\n\
  \        // 其余代码 ...\n        // 剩余代码 ...\n    }\n}\n代码清单 4-19\nchapter4/working_with_data/scraping/src/main.rs\n\
  ```\n\n传入 `Selector::parse` 方法的字符串是 CSS 选择器。我们可以使用 Chrome 开发者工具获取合适的选择器。右键单击特定项目（在本例中为\
  \ BSE 价格），然后选择“检查”。这应该会打开 Chrome 开发者工具。打开工具后，复制选择器。请查看图 4-2。\n\n复制选择器后，您应该会得到选择器字符串，它是该价格在网站中的标识符。应用程序几乎完成了。我们现在可以使用标准库中的时间模块来获取捕获价格时的时间快照，然后将其打印到标准输出。然后，我们可能可以在\
  \ cron 作业或其他调度系统中运行此应用程序。这样，我们就得到了股票时间和价格的时间序列（代码清单 4-20）。\n\n```\nuse std::time::{SystemTime,\
  \ UNIX_EPOCH};\n\nfn main() -> Result> {\n    let start = SystemTime::now();\n代码清单\
  \ 4-20\nchapter4/working_with_data/scraping/src/main.src\n```\n\n![../images/482357_1_En_4_Chapter/482357_1_En_4_Fig2_HTML.jpg](img/482357_1_En_4_Fig2_HTML.jpg)\n\
  \n图 4-2\n\nChrome 选择器\n\n```\n    let since_the_epoch = start.duration_since(UNIX_EPOCH)\n\
  \        .expect(\"时间倒流\");\n    // 抓取代码 ...\n    for price in fragment.select(&stories)\
  \ {\n        let price_txt = price.text().collect::>();\n        if price_txt.len()\
  \ == 1 {\n            println!(\"{:?}\", (since_the_epoch, price_txt[0]));\n   \
  \     }\n    }\n    Ok(())\n}\n```\n\n代码清单 4-20 的输出应类似于代码清单 4-21 中的内容。\n\n```\n\
  $ cargo run\n    Finished dev [unoptimized + debuginfo] target(s) in 0.60s\n   \
  \  Running `target/debug/scraping`\n(1566103337.390445s, \"1.05\")\n代码清单 4-21\n\
  抓取输出\n```\n\n\n\n## 4.4 SQL\n\n大量数据存储在 SQL 数据库中，因此要在这些数据上运行机器学习算法，我们需要一种与这些数据库通信并从中聚合数据的方法。在本节中，我们将了解\
  \ postgres 数据库，并尝试加载、访问以及在 postgres 数据库上运行 SQL 查询。为此，我们将使用 postgres Rust crate，顾名思义，它是用于\
  \ `postgres` 的 Rust 原生 crate。除了编写原生 SQL 查询之外，另一种流行的查询数据库方法是使用 ORM。Rust 也有一个流行的 ORM\
  \ crate，名为 `diesel`，但我们不会讨论如何使用 ORM。这是因为 ORM 通常最适合于 Web 应用程序，在这些应用程序中，开发人员执行的查询类型相当一致且可预测。然而，在机器学习应用中，我们可能需要编写复杂的查询，在这种情况下，使用\
  \ ORM 编写查询可能会变得过于复杂。因此，我们将坚持使用 SQL 编写原生查询。\n\n本 SQL 部分的代码也将位于一个名为 `databases` 的独立包中（清单\
  \ 4-22）。\n\n```\n$ cd chapter4 && cargo new databases --bin\n清单 4-22\n创建二进制包 databases\n\
  ```\n\n现在，在编写任何代码之前，我们需要一个 postgres 数据库。有多种创建数据库的方法。我们可以安装 postgres，然后使用客户端访问数据库。但可能更简单的方法是使用\
  \ postgres docker。Docker 是一个容器化平台，用于将软件及其底层依赖项打包到 docker 容器中，以便它在任何环境中都能无缝运行。要使用\
  \ docker，我们需要先安装 docker。你可以通过此链接查看安装 docker 的方法：[`https://docs.docker.com/v17.12/install/#supported-platforms`](https://docs.docker.com/v17.12/install/%2523supported-platforms)。安装好\
  \ docker 后，可以执行清单 4-23 中的命令来启动一个正在运行的 postgres 容器。在单独的终端中执行该命令。\n\n```\nsudo docker\
  \ run \\\n--name rust-postgres \\\n-e POSTGRES_PASSWORD=postgres -e POSTGRES_USER=postgres\
  \ \\\n-p 5432:5432 -d \\\npostgres\n清单 4-23\ndocker postgres\n```\n\n上述命令将运行一个名为\
  \ `rust-postgres` 的 postgres 容器，用户名为 `postgres`，密码为 `postgres`。Postgres 运行在端口 `5432`\
  \ 上，因此该端口将映射到主机的 `5432` 端口。`-d` 命令表示以守护进程模式运行此容器，换句话说，即作为后台进程运行。\n\n现在我们可以开始更新 `databases`\
  \ 包了。作为示例，我们将从此网址输入数据：[`https://www.yr.no/place/India/Karnataka/Bangalore/statistics.html`](https://www.yr.no/place/India/Karnataka/Bangalore/statistics.html)。因此，我们将在另一个模块\
  \ `postgres_db.rs` 中创建一个包含数据的元组向量（清单 4-24）。\n\n```\npub fn run() -> Result> {\n\
  let weathers = vec![\n(\"January\", 21.3, 27.3, 15.1),\n(\"February\", 23.6, 30.1,\
