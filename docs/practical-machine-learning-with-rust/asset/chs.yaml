  ## 3.6 强化学习


  强化学习是利用不同算法，在给定情境下选择合适的行动以最大化奖励。与监督学习的区别在于，可能不存在标记好的输入/输出对。在无监督学习中，我们关注的是寻找数据点之间的相似性和差异性。而强化学习更侧重于在给定环境中找到最佳行为。要构建一个强化系统，软件系统应具备在环境中进行观察和采取行动的机制。作为回报，它应以某种形式获得奖励。其理念是最大化长期奖励。


  强化学习在现实世界中有多种应用。机器人已在制造业中使用了一段时间。一些重复性任务，例如拾取物体并将其放入容器中，通过在编程中使用强化学习而受益匪浅。无论成功还是失败，它们都能自我训练，并以良好的速度和精度完成任务。强化学习的另一个良好应用领域是股票市场的投机交易。智能体被用于通过
  Q-learning 在交易策略之间进行选择，使用一个简单的指令来最大化投资组合的价值。强化学习在那些高度受控且需要在大量行动中快速做出选择的系统中具有巨大价值。


  软件用于决定其行动所采用的算法称为其策略。该策略应能访问目标主体的两个函数：一种将观察结果作为输入的方式，以及一种采取下一步行动的方式。


  强化学习的挑战之一在于，为了训练智能体，我们需要创建环境。环境既可以是现实世界，也可以是软件模拟。现实世界模拟超出了本书的范围，因此我们将针对软件模拟的一个子集。一个用于强化学习的优秀
  crate 是 `rsrl`。由于 API 尚不稳定，我们将使用稍作修改的代码版本，以便能够良好地调用函数（代码清单 3-14）。因此，我们使用 `ndarray`
  crate 进行矩阵操作，使用 `slog` 进行日志记录。本节重点关注的 crate 是 `rsrl`，它将为我们提供强化学习的相关类型。


