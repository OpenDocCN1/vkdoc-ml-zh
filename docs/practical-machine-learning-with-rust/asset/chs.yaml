  ## 3.3 基于密度的噪声应用空间聚类（DBSCAN）


  DBSCAN 的核心思想是：聚类本质上是高密度区域，被低密度区域分隔开。这很像城市，通常高密度聚集，而乡村则密度较低。高密度意味着可能是一个聚类，低密度则被视为噪声。与
  k-means 的一个有趣区别在于，k-means 假设底层聚类是凸形的，但 DBSCAN 发现聚类时并不需要这个假设；因此，DBSCAN 可能更具通用性。因此，当数据集很大、聚类形状复杂且数据集中噪声较多时，该算法特别有用。


  从评估角度来看，每个点 P 都会被评估，并且在点 P 的设定半径 *R* 内，必须至少存在一定数量的点 *m*[1]、*m*[2]……。这是聚类必须满足的最小密度。该算法需要三个输入参数
  [6]。


  *   k，最近邻列表的大小；

  *   eps，界定一个点邻域范围的半径；

  *   min points，在 eps 邻域内必须存在的最小点数。


  DBSCAN 的问题在于它无法处理密度变化的情况。此外，该算法对参数设置相当敏感。


  可以使用 `rusty_machine` 创建 DBSCAN 模型。在列表 3-7 中，我们创建了一个 DBSCAN 模型，其中 eps 设为 3，最小样本数设为
  10。然后，我们将 `true` 标志传递给模型的 `set_predict` 方法。这使我们能够对新的未见数据使用 `predict` 方法。与之前的模型类似，我们可以在数据集上进行训练和预测。除此之外，我们还可以检查模型已学习到的聚类。


  ```

  use rm::learning::dbscan::DBSCAN;

  use rm::learning::UnSupModel;

  fn main() -> Result> {

  // 之前的代码 ...

  let mut model = DBSCAN::new(0.3, 10);

  model.set_predictive(true);

  model.train(&flower_x_train)?;

  let clustering = model.clusters().unwrap();

  let classes = model.predict(&flower_x_test).unwrap();

  // 剩余代码 ...

