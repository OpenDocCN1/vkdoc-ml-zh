  ## 8.2 云中的 Rust


  在云中使用机器学习有多种好处。


  *   云的按需付费模式非常适合突发性和不稳定的 AI 或机器学习工作负载。


  *   云使企业能够轻松试验机器学习能力，并随着项目投入生产以及需求增加而进行扩展。


  *   构建能为企业带来价值的机器学习应用存在诸多障碍：从围绕数据筛选、构建和训练优秀机器学习模型的专业知识，到机器学习模型所需的专用硬件。优秀的云提供商专注于为所有这些方面提供解决方案。


  在本节中，我们将了解 AWS Lambda。在设计和学习了一个 ML 模型之后，最困难的部分实际上是在生产环境中运行和维护它。将无服务器应用集成到机器学习工作流中，可以快速扩展机器学习应用。


  在创建无服务器应用时，我们通常会选择 Python 或 Node 作为运行时。幸运的是，我们有 Rust 的 AWS 运行时^(³⁷)，因此我们能够用 Rust
  创建无服务器应用。AWS 无服务器应用的 API 定义了 Lambda 编程模型的基于 HTTP 的规范，理想情况下，该规范可以在任何模型中实现。


  在我们的应用中，我们将创建一个简单的单词计数应用。要创建该应用，我们需要将依赖项添加到 `Cargo.toml` 文件中。`serde` 依赖项将序列化和反序列化传入的数据。我们可以使用
  `log` 和 `simple-logger` 进行日志记录，并使用 `regex` 来解析传入的文本。最后，最重要的是，我们需要添加 `lambda_runtime`
  才能创建无服务器应用（清单 8-25）。


  ```

  [package]

  name = "my_lambda_function"

  version = "0.1.0"

  edition = "2018"

  [dependencies]

  lambda_runtime = "0.1"

  serde = "¹"

  serde_derive = "¹"

  serde_json = "¹"

  log = "0.4"

  simple_logger = "¹"

  regex = "1"

  Listing 8-25

  chapter8/my_lambda_function/Cargo.toml

  ```


  为了能够序列化和反序列化传入的数据，我们需要创建一个事件结构体，并添加序列化和反序列化功能，以便运行时能够解析数据（清单 8-26）。


  ```

  use serde_derive;

  use serde_derive::{Serialize, Deserialize};

  #[derive(Serialize, Deserialize)]

  struct CustomEvent {

  string: String,

  }

  Listing 8-26

  chapter8/my_lambda_function/src/main.rs

  ```


  在我们的 lambda 应用中，我们需要在 `main` 函数中执行处理程序。在清单 8-27 中，`my_handler` 是处理函数，它将包含事件输出的处理代码。


  ```

  use lambda_runtime;

  use lambda_runtime::{lambda, Context, error::HandlerError};

  use log;

  use log::error;

  use std::error::Error;

  fn main() -> Result> {

  simple_logger::init_with_level(log::Level::Debug).unwrap();

  lambda!(my_handler);

  Ok(())

  }

  Listing 8-27

  chapter8/my_lambda_function/src/main.rs

  ```


  现在，我们应该能够放入处理程序的代码了。传入的数据将被解析并使用 `serde` 放入 `CustomEvent` 结构体中。如果没有提供字符串，则返回提示，说明未提供输入字符串。如果提供了字符串，则创建一个哈希映射，其中包含字符串中的所有单词，其值为单词在字符串中出现的次数。字符串中的单词通过使用
  `regex` 模块进行解析来识别。最后，我们需要将其序列化为字符串，我们使用 json 序列化来执行此操作（清单 8-28）。


  ```

  use std::collections;

  use std::collections::hash_map::Entry::{Occupied, Vacant};

  use regex;

  use regex::Regex;

  fn my_handler(

  event: CustomEvent, ctx: Context)

  -> Result {

  if event.string == "" {

  error!("Empty string in request {}", ctx.aws_request_id);

  return Err(ctx.new_error("Empty input string"));

  }

  let mut map = collections::HashMap::::new();

  let re = Regex::new(r"\w+").unwrap();

  for caps in re.captures_iter(&event.string) {

  if let Some(cap) = caps.get(0) {

  let word = cap.as_str();

  match map.entry(word.to_string()) {

  Occupied(mut view) => { *view.get_mut() += 1; }

  Vacant(view) => { view.insert(1); }

  }

  }

  }

  let j = serde_json::to_string(&map).unwrap();

  Ok(j)

  }

  Listing 8-28

  chapter8/my_lambda_function/src/main.rs

  ```


  现在，虽然应用本身已经完成，但我们还需要执行一些额外的步骤，才能使其在云服务器上的 lambda 运行时中运行。当配置为使用带有运行时 API 的自定义运行时，AWS
  Lambda 期望部署包包含一个名为 `bootstrap` 的可执行文件。我们可以配置 Cargo 生成一个名为 `bootstrap` 的文件，无论我们的
  crate 名称是什么。首先，在文件的 `[package]` 部分，添加 `autobins = false` 设置。然后，在 `Cargo.toml` 的底部，添加一个新的
  `[[bin]]` 部分，提供二进制文件的名称和代码的路径（清单 8-29）。


  ```

  [package]

  name = "my_lambda_function"

  version = "0.1.0"

  authors = ["joydeep bhattacharjee"]

  autobins = false

  edition = "2018"

  '
- '# dependencies code

  [[bin]]

  name = "bootstrap"

  path = "src/main.rs"

  Listing 8-29

  chapter8/my_lambda_function/Cargo.toml

  ```


  这将创建一个名为 `bootstrap` 的二进制可执行文件，其构建方式符合 AWS 的期望。


  现在，在构建之前，我们需要确保 Rust 编译器针对正确的平台。AWS Lambda 在 Amazon Linux 环境中执行，因此我们需要针对这个特定平台进行构建。这正是
  Cargo 作为工具再次大放异彩的地方，因为它使我们能够非常轻松地构建跨平台工具。因此，我们不一定需要在 Amazon Linux 机器上编译，也可以在 MacOS
  笔记本电脑上进行构建。首先，我们需要安装 `musl` 工具，以便能够针对该平台进行构建（清单 8-30）。


  ```

  $ rustup target add x86_64-unknown-linux-musl

  $

  Listing 8-30

  rustup add linux target

  ```


  在构建平台之前，我们需要为编译工具链添加一个链接器。这意味着我们需要在 MacOS 平台上运行 `brew install` 命令。^(³⁸) 参见清单 8-31。


  ```

  $ brew install filosottile/musl-cross/musl-cross

  $

  Listing 8-31

  Brew install musl-cross

  ```


  完成后，我们需要告诉 Cargo 在构建时使用这个链接器而不是默认的链接器。这可以通过在 `.cargo/config` 中创建一个包含链接器信息的新文件来完成（清单
  8-32）。


  ```

  [target.x86_64-unknown-linux-musl]

  linker = "x86_64-linux-musl-gcc"

  Listing 8-32

  chapter8/my_lambda_function/.cargo/config

  ```


  有时链接器无法被直接识别，因此我们可能需要手动创建指向链接器的软链接（清单 8-33）。


  ```

  $ ln -s /usr/local/bin/x86_64-linux-musl-gcc /usr/local/bin/musl-gcc

  $

  Listing 8-33

  link musl gcc

  ```


  现在，工具链已完全就绪，我们应该能够创建可以在 lambda 平台上运行的可执行文件了（清单 8-34）。


  ```

  $ cargo build --release --target x86_64-unknown-linux-musl

  $

  Listing 8-34

  cargo build

  ```


  现在，我们应该能够在目标文件夹中看到构建好的可执行文件（清单 8-35）。


  ```

  $ ls target/x86_64-unknown-linux-musl/release/

  bootstrap      bootstrap.d     build         deps       examples       incremental     native        runtime_release

  $

  Listing 8-35

  check executable fi le

  ```




  我们需要将这个可执行文件压缩成 zip 包，以便能够部署到 AWS Lambda 上（清单 8-36）。


  ```

  $ zip -j rust.zip ./target/x86_64-unknown-linux-musl/release/bootstrap

  $

  清单 8-36

  为 AWS 压缩 zip 包

  ```


  由于这涉及相当多的命令，我们可以将它们放在一个简单的构建 shell 文件中（清单 8-37）。


  ```

  rm -f rust.zip

  cargo build --release --target x86_64-unknown-linux-musl

  zip -j rust.zip target/x86_64-unknown-linux-musl/release/bootstrap

  清单 8-37

  chapter8/my_lambda_function/buildthis.sh

  ```


  现在我们可以将这个文件部署到 AWS Lambda。导航到 AWS Lambda 控制台并创建一个新函数。我们需要选择“从头开始创作”。输入一个函数名称，并且重要的是，将运行时选择为“提供您自己的引导程序”。页面应该类似于图
  8-1。


  在下一页中，向下滚动到函数代码。点击代码输入类型，然后选择“上传 .zip 文件”。见图 8-2。


  现在我们需要选择正确的文件并点击保存按钮。如图 8-3 所示。


  保存后，我们的 lambda 函数就创建完成了。我们现在可以在控制台中配置一个测试用例，以查看函数是否按预期运行。如图 8-4 所示。由于我们的函数期望一个字符串参数，我们可以向字符串参数传递一个随机句子，它应该会返回单词计数。


  在图 8-5 中，我们看到运行测试用例给出了正确的结果。


  我们已经成功地在 Rust 中创建了一个无服务器应用程序。不过，这种编程模型存在一些注意事项。在我们的案例中，算法很简单，可以很容易地使用 Rust 构建。如果代码是纯
  Rust 代码，那么构建的 Rust 工具链就能正常工作，我们应该能够轻松地构建无服务器应用程序。如果应用程序有外部库依赖项，例如我们在本书大部分内容中看到的那些，那么执行交叉链接和编译并为
  AWS 平台创建二进制文件就相当困难。不过，如果我们能够做到这一点，那么模型推理就能工作。没有展示使用无服务器 Rust 进行模型训练，因为这需要时间，而无服务器应用程序有超时限制。尽管如此，在机器学习工作流中集成无服务器应用程序为开发者带来了巨大的生产力提升。


