  \ f64 = row.get(0);\nprintln!(\"{:?}\", x);  // 对于此处输入的数据，输出 31.075\n}\n}\n清单 4-32\n\
  chapter4/databases/src/postgres_db.rs\n```\n\n## 4.5 NoSQL\n\n尽管 SQL 数据库非常流行，但它们的主要缺点在于难以扩展。查询依赖索引来理解不同表之间的关系。因此，每次更新表时，都需要重新计算所有内容。这给数据库的更新量带来了真正的瓶颈。如果目标是快速增长的数据接收端，SQL\
  \ 数据库可能无法胜任。作为解决方案，NoSQL 应运而生。虽然 NoSQL 数据库有多种类型，但在本节中，我们将介绍 Neo4J，它属于图数据库类别。\n\n\
  在图数据库中，会创建节点和边，从而发现数据之间有趣的关系。这些节点和边在命名空间中定义。为了理解其工作原理，我们将使用 MovieLens 数据集^(¹⁵)，并根据它们创建关系。下载\
  \ `ml-latest-small.zip` 文件并将其解压到目录中。对于本节中的代码，我们需要通过 HTTP 暴露这些文件，我们可以使用一个方便的 Python\
  \ 命令来实现。打开终端，`cd` 到 `ml-latest-small` 目录，并运行清单 4-33 中所示的命令。这样，将在 Docker 容器中启动的 Neo4j\
  \ 就能够获取这些文件。如你所愿，此命令依赖于计算机上已安装的 `python3`。另一个创建简单 HTTP 服务器的简便方法是使用 npm 的 `http-server`^(¹⁶)。请注意，要将其暴露在端口\
  \ 8000 上。该命令应在包含 MovieLens 目录的文件夹内运行。\n\n```\n$ python3 -m http.server\nServing\
  \ HTTP on 0.0.0.0 port 8000 (http://0.0.0.0:8000/) ...\n清单 4-33\nBash\n```\n\n要启动\
  \ Neo4j 数据库，我们在终端中运行以下 Docker 命令（清单 4-34）。这将启动最新的 Neo4j 容器。\n\n```\nsudo docker\
  \ run \\\n--name rust-neo4j \\\n--rm --env=NEO4J_AUTH=none \\\n--publish=7474:7474\
  \ \\\n--publish=7687:7687 \\\n--volume=$HOME/neo4j/data:/data neo4j:3.5.8\n清单 4-34\n\
  Bash\n```\n\n现在，我们将向 `databases` 包添加与 Neo4j 通信的能力。我们需要在依赖项中添加一个 `rusted-cypher`\
  \ crate（清单 4-35）。\n\n```\n[package]\nname = \"databases\"\nversion = \"0.1.0\"\n\
  edition = \"2018\"\n[dependencies]\npostgres = \"0.15.2\"\nrusted_cypher = \"1.1.0\"\
  \ // 添加 neo4j 依赖\n清单 4-35\nchapter4/databases/Cargo.toml\n```\n\n现在，我们应该能够在代码中连接到数据库。与\
  \ SQL 部分类似，需要传递连接字符串，其格式为 `http://username:password@uri:port/db/data`。在我们的例子中，Neo4j\
  \ 是在无认证的情况下启动的，因此不需要用户名和密码（清单 4-36）。\n\n```\nuse rusted_cypher;\nuse rusted_cypher::{GraphClient,\
  \ Statement, GraphError};\nuse std::iter::repeat;\nfn main() -> Result> {\nlet graph\
  \ = GraphClient::connect(\n\"http://localhost:7474/db/data\")?;\n// 其余代码..\n清单 4-36\n\
  chapter4/databases/src/neo4j_db.rs\n```\n\n要加载电影数据，我们首先需要创建命名空间（清单 4-37）。\n\n```\n\
  fn main() -> Result> {\n// 之前的代码 ...\nlet mut query = graph.query();\nlet statement1\
  \ = Statement::new(\n\"CREATE CONSTRAINT ON (m:Movie) ASSERT m.id IS UNIQUE;\");\n\
  let statement2 = Statement::new(\n\" CREATE CONSTRAINT ON (u:User) ASSERT u.id IS\
  \ UNIQUE;\"\n);\nlet statement3 = Statement::new(\n\" CREATE CONSTRAINT ON (g:Genre)\
  \ ASSERT g.name IS UNIQUE;\"\n);\nquery.add_statement(statement1);\nquery.add_statement(statement2);\n\
  query.add_statement(statement3);\nquery.send()?;\n// 剩余代码 ...\n}\n清单 4-37\nchapter4/databases/src/neo4j_db.rs\n\
  ```\n\n这将创建命名空间。现在，我们应该能够从文件中拉取数据了（清单 4-38）。\n\n```\nfn main() -> Result> {\n//\
  \ 导入 movies.csv\ngraph.exec(\n\"USING PERIODIC COMMIT LOAD CSV WITH HEADERS \\\n\
  FROM \\\"http://10.0.1.43:8000/movies.csv\\\" AS line \\\nWITH line, SPLIT(line.genres,\
  \ \\\"|\\\") AS Genres \\\nCREATE (m:Movie { id: TOINTEGER(line.`movieId`), title:\
  \ line.`title` }) \\\nWITH Genres \\\nUNWIND RANGE(0, SIZE(Genres)-1) as i \\\n\
  MERGE (g:Genre {name: UPPER(Genres[i])}) \\\nCREATE (m)-[r:GENRE {position:i+1}]->(g);\"\
  \n)?;\n// 导入 ratings.csv\ngraph.exec(\n\" USING PERIODIC COMMIT LOAD CSV WITH HEADERS\
  \ \\\nFROM \\\"http://10.0.1.43:8000/ratings.csv\\\" AS line \\\nWITH line \\\n\
  MATCH (m:Movie { id: TOINTEGER(line.`movieId`) }) \\\nMATCH (u:User { id: TOINTEGER(line.`userId`)\
  \ }) \\\nCREATE (u)-[r:RATING {rating: TOFLOAT(line.`rating`)}]->(m);\"\n)?;\n//\
  \ 导入 tags\ngraph.exec(\n\" USING PERIODIC COMMIT LOAD CSV WITH HEADERS \\\nFROM\
  \ \\\"http://10.0.1.43:8000/tags.csv\\\" AS line \\\nWITH line \\\nMATCH (m:Movie\
  \ { id: TOINTEGER(line.`movieId`) }) \\\nMERGE (u:User { id: TOINTEGER(line.`userId`)\
  \ }) \\\nCREATE (u)-[r:TAG {tag: line.`tag`}]->(m);\"\n)?;\n// 剩余代码 ...\n}\n清单 4-38\n\
  chapter4/databases/src/neo4j_db.rs\n```\n\n用于获取数据的 `10.0.1.43` IP 地址是机器的 IP 地址，在你的情况下，这个\
