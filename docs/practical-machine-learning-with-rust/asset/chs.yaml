  \ POST \\\n--data '{\"contents\":\"set the temperature to 23 degrees in the bedroom\"\
  }' \\\nlocalhost:8000/infer\n[\n{\n\"intentName\": \"setTemperature\",\n\"confidenceScore\"\
  : 1.0\n},\n{\n\"intentName\": null,\n\"confidenceScore\": 0.291604\n},\n{\n\"intentName\"\
  : \"turnLightOn\",\n\"confidenceScore\": 0.08828778\n},\n{\n\"intentName\": \"turnLightOff\"\
  ,\n\"confidenceScore\": 0.070788406\n}\n]\n$\n清单 5-56\n在另一个终端中 nlu 引擎的输出\n```\n\n\
  NLP 中的一个重要问题领域是聊天机器人，要构建聊天机器人，我们需要一个良好的意图推理引擎。在本节中，我们了解了如何训练一个 snips 模型，并在一个简单的\
  \ Web 应用中使用该模型来推理用户指定查询中的意图。\n\n## 5.4 结论\n\n本章向你介绍了 NLP 中不同的有趣问题。本章从文本分类以及如何使用\
  \ fasttext 算法构建分类器开始。它还介绍了可以在 Rust 中执行的常见文本预处理步骤。然后，本章继续探讨了如何在语料库上执行命名实体识别，以及如何使用\
  \ `crfsuite` crate 创建 CRF 模型来执行 NER 任务。最后，我们研究了如何使用 snips 库创建一个意图推理 Web 应用。\n\n\
  在下一章中，你将学习如何创建计算机视觉模型和运行图像分类器。\n\n脚注 1   2   3   4   5   6   7\n\n# 6. 计算机视觉\n\n\
  在上一章中，我们了解了机器学习如何应用于人类语言领域。这涵盖了我们的语言和听觉感官。机器学习具有巨大影响力的另一个感官是我们的视觉感官，以及机器学习如何捕捉图像的本质。整个分支被称为计算机视觉，正如我们将在本章中看到的，在\
  \ Rust 中解决计算机视觉问题已经取得了巨大进展。\n\n作为本章的一部分，我们将研究计算机视觉中的不同应用，例如：\n\n*   图像分类\n\n*  \
  \ 使用预训练模型\n\n*   神经风格迁移\n\n*   人脸检测\n\n## 6.1 图像分类\n\n图像分类是将机器学习应用于图像，其目标是：给定一张图像和一个经过训练以查找感兴趣对象的模型，该模型将识别该对象是否存在于图像中。这是通过定义一组目标类别（要在图像中识别的对象）并使用带标签的示例照片训练模型来识别它们来实现的。\n\
  \n使用传统模型进行图像分类是通过从像素数据中添加新特征来实现的，例如颜色直方图、纹理和形状。这种方法的缺点是，在图像分类的情况下，特征工程成本巨大。特征需要非常精确地调整，因此在许多情况下构建鲁棒模型非常具有挑战性，且准确率较低。\n\
  \n\n\n### 6.1.1 卷积神经网络（CNN）\n\n与传统模型相比，包含卷积层的神经网络在图像分类任务中表现更佳。CNN 能够逐步提取图像内容中越来越高级的表征。CNN\
  \ 无需预处理数据以提取纹理和形状等特征，而是直接将图像的原始像素作为输入，“学习”如何提取这些特征，并最终推断出它们构成了什么物体。\n\nCNN 从一个三维的输入特征图开始，其中前两个维度的大小是图像的像素长度和宽度。第三个维度的大小是图像的通道数，通常为\
  \ 3。CNN 由多个模块堆叠而成，每个模块执行三个操作 [1]。\n\n1.  卷积层：提取输入特征图的图块，并对这些特征应用滤波器。一个滤波器矩阵在特征矩阵上滑动，逐元素相乘后的和存储在结果矩阵中。在训练过程中，CNN\
  \ “学习”特征矩阵的最优值，从而能够提取有意义的特征。图 6-1 展示了在 4x4 输入特征图上，使用 3*x*3 滤波器层进行此过程的方式。\n\n   \
  \ ![../images/482357_1_En_6_Chapter/482357_1_En_6_Fig1_HTML.jpg](img/482357_1_En_6_Fig1_HTML.jpg)\n\
  \n    图 6-1\n\n    通过卷积提取特征\n\n2.  在卷积层之后引入一个 Relu 层，以便为模型引入非线性。Relu 函数定义为 *f*(*x*)=*max*(0,*x*)，如图\
  \ 6-2 所示。\n\n3.  应用 Relu 激活函数后，进行池化操作以对卷积后的特征进行下采样。下采样需要在尽可能降低维度的同时，保留最关键的特征信息。通常使用最大池化，即从特征图中提取图块，并保留每个图块中的最大值，丢弃所有其他值。\n\
  \n在 CNN 层的末端，需要一个或多个全连接层，以便根据卷积提取的特征进行分类。\n\n![../images/482357_1_En_6_Chapter/482357_1_En_6_Fig2_HTML.jpg](img/482357_1_En_6_Fig2_HTML.jpg)\n\
  \n图 6-2\n\nRelu 函数\n\n### 6.1.2 Rust 与 Torch\n\n如第 2 章所述，我们可以使用 torch 深度学习库，^(²⁸)\
  \ 许多开发者称之为 pytorch。由于在计算机视觉领域，深度学习已被证明能取得最佳效果，因此我们将主要关注创建和使用深度神经模型。目前，在 Rust 中创建和使用深度神经模型方面，torch\
  \ 是最实用的；因此在本章中，我们将主要在 torch 范式下工作。\n\n### 6.1.3 Torch 数据集\n\n现在，我们将创建一个用于图像分类的 Rust\
  \ 项目。首先创建一个名为 chapter 6 的目录，并在其中创建一个 `pytorch-image-classification` 项目（清单 6-1）。\n\
  \n```\n$ cd chapter6\n$ cargo new pytorch-image-classification --bin\n$ cd pytorch-image-classification\n\
  $\n清单 6-1\n创建图像分类项目\n```\n\n由于我们将使用 torch 依赖项，让我们也下载库文件并为其建立引用，以便 tch 库能够找到相关的核心依赖项（清单\
  \ 6-2）。\n\n```\n$ wget https://github.com/intel/mkl-dnn/releases/download/v0.19/mklml_mac_2019.0.5.20190502.tgz\n\
  $ gunzip -c mklml_mac_2019.0.5.20190502.tgz | tar xvf -\n$ wget https://download.pytorch.org/libtorch/cpu/libtorch-macos-1.1.0.zip\n\
  $ unzip libtorch-macos-1.1.0.zip\n$ export LD_LIBRARY_PATH=mklml_mac_2019.0.5.20190502/lib:\"\
  $LD_LIBRARY_PATH\"\n$ export LIBTORCH=libtorch\n$ export LD_LIBRARY_PATH=${LIBTORCH}/lib:$LD_LIBRARY_PATH\n\
  $\n清单 6-2\n下载 mkl 和 libtorch 依赖项\n```\n\n为了构建图像分类模型，我们将使用 Caltech101^(²⁹) 数据集。要下载文件，请访问脚注中给出的链接并下载图像（清单\
  \ 6-3）。\n\n```\n$ wget http://www.vision.caltech.edu/Image_Datasets\\\n/Caltech101/101_ObjectCategories.tar.gz\n\
  $ gunzip -c 101_ObjectCategories.tar.gz | tar xvf -\n$\n清单 6-3\n下载图像\n```\n\n或者，您也可以使用浏览器下载。如果在浏览器中点击链接\
  \ [`http://www.vision.caltech.edu/Image_Datasets/Caltech101/`](http://www.vision.caltech.edu/Image_Datasets/Caltech101/)，您应该会看到一个如图\
  \ 6-3 所示的链接。如果使用浏览器下载，您仍然需要使用 gunzip 命令解压缩。\n\n![../images/482357_1_En_6_Chapter/482357_1_En_6_Fig3_HTML.jpg](img/482357_1_En_6_Fig3_HTML.jpg)\n\
  \n图 6-3\n\n下载 caltech101\n\n与 `torch-vision` 类似，为了处理图像数据集，我们有一个 `vision::Dataset`\
  \ 结构。让我们来看看这个结构（清单 6-4）。\n\n```\n#[derive(Debug)]\npub struct Dataset {\npub train_images:\
  \ Tensor,\npub train_labels: Tensor,\npub test_images: Tensor,\npub test_labels:\
  \ Tensor,\npub labels: i64,\n}\n清单 6-4\ntch-rs/src/vision/dataset.rs\n```\n\n`tch`\
  \ crate 中一个便捷的函数是 `tch::vision::imagenet::load_from_dir`，用于加载图像并将其转换为上述的 `dataset`。为此，我们需要将已创建的\
  \ caltech101 文件按以下格式分离到训练和验证文件夹中。在根文件夹内，我们需要有“train”和“val”两个文件夹，在这些文件夹内，我们需要将不同的图像放在以标签命名的文件夹中。换句话说，所有具有相同标签的图像将位于同一个文件夹中（清单\
  \ 6-5）。\n\n```\ndataset\ntrain\naccordion\nimage_0001.jpg\nimage_0002.jpg\nairplanes\n\
  image_0001.jpg\nimage_0060.jpg\n...\nval\naccordion\nimage_0036.jpg\nairplanes\n\
  image_0685.jpg\n...\n清单 6-5\n我们需要的数据集目录\n```\n\ncaltech 数据集解压后的格式如下（清单 6-6）。\n\n\
  ```\n101_ObjectCategories\naccordion\nimage_0001.jpg\nimage_0002.jpg\nairplanes\n\
  image_0001.jpg\nimage_0002.jpg\n...\n102 directories, 9145 files\n清单 6-6\n当前目录结构\n\
  ```\n\n\n\n尽管目录结构大体相似，我们仍需编写一个小函数来将数据集拆分为训练集和验证集。清单 6-7 中的函数正是为此目的而编写的，它是一个递归函数：如果路径是目录，则继续深入；否则，对其中一个文件执行测试函数，对其余文件执行训练函数。变量\
  \ `this_label` 用于检查当前标签是否已经执行过测试函数。我们将把 `train_fn` 和 `test_fn` 实现为执行实际移动操作的函数。这些功能本可以在同一个\
  \ `visit_dir` 函数中实现，但将其作为独立函数实现会使代码更具模块化，也更易于测试。\n\n```\nuse std::io;\nuse std::fs::{self,\
  \ DirEntry, copy, create_dir_all};\nuse std::path::Path;\nfn visit_dir(dir: &Path,\n\
  train_fn: &Fn(&DirEntry),\ntest_fn: &Fn(&DirEntry)) -> io::Result {\nif dir.is_dir()\
  \ {\nlet mut this_label = String::from(\"\");\nfor entry in fs::read_dir(dir)? {\n\
  let entry = entry?;\nlet path = entry.path();\nif path.is_dir() {\nvisit_dir(&path,\
  \ train_fn, test_fn)?;\n} else {\nlet full_path: Vec = path.to_str().unwrap()\n\
  .split(\"/\").into_iter()\n.map(|x| x[..].to_string()).collect();\nif this_label\
  \ == full_path[1] {\ntrain_fn(&entry); // 移动训练文件\n} else {\ntest_fn(&entry); //\
  \ 移动测试文件\n}\n// 第二个条目是标签\nthis_label = full_path[1].clone();\n}\n}\n}\nOk(())\n\
  }\n清单 6-7\nchapter6/pytorch-image-classifi cation/src/main.rs\n```\n\n现在，我们需要定义从源文件夹到目标文件夹的实际文件复制函数。请记住，我们的目标路径格式应为“`root_dataset_foldername`\
  \ > 根据文件是训练文件还是验证文件，选择 'train' 或 'val' 文件夹 > 以标签作为特定图像的文件夹名称 > 图像文件”。该函数应创建所有可能不存在的中间目录。这可以通过清单\
  \ 6-8 中的 `move_file` 函数来实现。\n\n```\nuse std::fs::{self, DirEntry, copy, create_dir_all};\n\
  const DATASET_FOLDER: &str = \"dataset\";\nfn move_file(\nfrom_path: &DirEntry,\
  \ to_path: &Path)\n-> io::Result {\nlet root_folder = Path::new(DATASET_FOLDER);\n\
  let second_order = root_folder.join(to_path);\nlet full_path: Vec = from_path.path().to_str().unwrap()\n\
  .split(\"/\").into_iter().map(|x| x[..].to_string()).collect();\nlet label = full_path[1].clone();\n\
  let third_order = second_order.join(label);\ncreate_dir_all(&third_order)?;\nlet\
  \ filename = from_path.file_name();\nlet to_filename = third_order.join(&filename);\n\
  copy(from_path.path(), to_filename)?;\nOk(())\n}\n清单 6-8\nchapter6/pytorch-image-classifi\
  \ cation/src/main.rs\n```\n\n如清单 6-8 所示，根文件夹是数据集文件夹，而 `to_path` 本质上决定了文件需要进入训练文件夹还是验证文件夹。接下来，我们将源路径分割到\
  \ `full_path` 变量中，以便能够从完整路径中检索标签。一旦所有路径拼接完成，就使用 `std::fs` 标准库中的 `create_dir_all`\
  \ 函数来创建所有目录。从 `from_path` 变量中解析出相应的文件名，并将其拼接到 `to_filename` 变量中。成功构建目标路径的完整路径后，我们将目标路径（即\
  \ `to_filename` 变量）传递给 `std::fs` 标准库中的 `copy` 函数，以创建文件夹结构。\n\n现在，我们应该能够运行此代码，并将数据集分离为训练图像和验证图像（清单\
  \ 6-9）。\n\n```\nfn main() {\nlet obj_categories = Path::new(\"101_ObjectCategories\"\
  );\nlet move_to_train = |x: &DirEntry| {\nlet to_folder = Path::new(\"train\");\n\
  move_file(&x, &to_folder).unwrap();\n}\nlet move_to_test =\n|x: &DirEntry| {\nlet\
  \ to_folder = Path::new(\"val\");\nmove_file(&x, &to_folder).unwrap();\n};\nvisit_dir(\n\
  &obj_categories, &move_to_train,\n&move_to_test).unwrap();\nprintln!(\n\"files kept\
  \ in the imagenet format in {}\", DATASET_FOLDER);\n... 剩余代码\n清单 6-9\nchapter6/pytorch-image-classifi\
  \ cation/src/main.rs\n```\n\n在此处运行到清单 6-9 的代码，您应该会看到文件夹正在被移动到各自的文件夹中（清单 6-10）。\n\
  \n```\n$ cargo run\nwarning: clang: warning: -Wl,-rpath=chapter6/pytorch-image-classification/libtorch/lib:\
  \ 'linker' input unused [-Wunused-command-line-argument]\nFinished dev [unoptimized\
  \ + debuginfo] target(s) in 0.05s\nRunning `target/debug/pytorch-image-classification`\n\
  files kept in the imagenet format in dataset\n$ ls dataset\ntrain val\n清单 6-10\n\
  pytorch-image-classifi cation 当前输出\n```\n\n在清单 6-10 的代码中，我们创建了两个闭包 `move_to_train`\
  \ 和 `move_to_test`，它们会将适当的目标文件夹传递给 `move_file` 函数。然后，这些闭包被传递给 `visit_dir` 函数，正如我们之前所见，该函数会执行它们。运行到目前为止的代码应该能够分离文件夹，并将它们整理成\
  \ imagenet 格式。现在，我们应该能够使用 `load_from_dir` 函数，这是 `torch::vision` 中一个便捷的函数。该函数将以正确的格式加载目录，以便\
  \ `tch` 能够对其进行操作。参见清单 6-11。\n\n```\nuse tch::vision::imagenet::load_from_dir;\n\
  fn main() {\n// 之前的代码 ...\nlet image_dataset = load_from_dir(DATASET_FOLDER).unwrap();\n\
  // 剩余代码 ...\n}\n清单 6-11\nchapter6/pytorch-image-classifi cation/src/main.rs\n```\n\
  \nPyTorch 以及 `tch` 对图像使用 NCHW 格式。如果图像形状为 [256, 3, 224, 224]，这意味着样本数量为 256，每张图像有\
  \ 3 个通道，224x224 是数据集的高度和宽度。\n\n\n\n### 6.1.4 CNN 模型\n\n现在数据格式已正确，我们将着手定义模型。Rust\
  \ 的优势在于模型可以是一个简单的结构体（清单 6-12）。\n\n```\nuse tch::{Device, Tensor, nn};\nuse tch::nn::{ModuleT,\
  \ OptimizerConfig, conv2d, linear};\n#[derive(Debug)]\nstruct CnnNet {\nconv1: nn::Conv2D,\n\
  conv2: nn::Conv2D,\nfc1: nn::Linear,\nfc2: nn::Linear,\n}\n清单 6-12\nchapter6/pytorch-image-classifi\
  \ cation/src/main.rs\n```\n\n可以为清单 6-12 中的结构体实现一个 `new` 方法，用于创建 `CnnNet` 的实例。\n\n\
  ```\nconst LABELS: i64 = 102;\nconst W: i64 = 224;\nconst H: i64 = 224;\nconst C:\
  \ i64 = 3;\nimpl CnnNet {\nfn new(vs: &nn::Path) -> CnnNet {\nlet conv1 = conv2d(vs,\
  \ C, 32, 5, Default::default());\nlet conv2 = conv2d(vs, 32, 64, 5, Default::default());\n\
  let fc1 = linear(vs, 1024, 1024, Default::default());\nlet fc2 = linear(vs, 1024,\
  \ LABELS, Default::default());\nCnnNet {\nconv1,\nconv2,\nfc1,\nfc2,\n}\n}\n}\n\
  清单 6-13\nchapter6/pytorch-image-classifi cation/src/main.rs\n```\n\n在清单 6-13 中，`conv1`\
  \ 是一个卷积层，其输入维度为 `C`（常量 3），输出维度为 32。输入维度必须为 3，因为我们将 `conv1` 定义为第一个卷积层，而数据集中每张图像由\
  \ 3 个通道组成。此外，`conv1` 的卷积核大小为 5x5，由第四个参数指定。最后一个参数是卷积配置，此处可传入默认参数。默认参数可在 `tch-rs`\
  \ 库的 `conv.rs` 文件中查看（清单 6-14）。\n\n```\nimpl Default for ConvConfig {\nfn default()\
  \ -> Self {\nConvConfig {\nstride: 1,\npadding: 0,\ndilation: 1,\ngroups: 1,\nbias:\
  \ true,\nws_init: super::Init::KaimingUniform,\nbs_init: super::Init::Const(0.),\n\
  }\n}\n}\n清单 6-14\ntch-rs/src/nn/conv.rs\n```\n\n继续描述清单 6-8，我们将定义与 `conv1` 类似但维度适当的\
  \ `conv2`。这些维度稍后会解释。我们还将创建两个全连接层 `fc1` 和 `fc2`，其中 `fc2` 的最后一维与 `LABELS` 常量定义的标签数量相同。\n\
  \n在 Python 的 PyTorch 中，模型通过继承 `torch.nn.Module` 创建。类似地，在 Rust 中使用 `tch` 时，我们需要实现\
  \ `nn::ModuleT` trait，该 trait 包含可用于训练模型的相关函数。参见清单 6-15。\n\n```\nuse tch::{Device,\
  \ Tensor, nn};\nconst BATCH_SIZE: i64 = 16;\nimpl nn::ModuleT for CnnNet {\nfn forward_t(&self,\
  \ xs: &Tensor, train: bool) -> Tensor {\nxs.view(&[-1, C, H, W])    // 输出维度: [16,\
  \ 3, 224, 224]\n.apply(&self.conv1)      // [16, 32, 220, 220]\n.max_pool2d_default(2)\
  \   // [16, 32, 110, 110]\n.apply(&self.conv2)      // [16, 64, 106, 106]\n.max_pool2d_default(2)\
  \   // [16, 64, 53, 53]\n.view(&[BATCH_SIZE, -1]);// [16, 179776]\n.apply(&self.fc1)\
  \        // [16, 1024]\n.relu()                  // [16, 1024]\n.dropout_(0.5, train)\
  \    // [16, 1024]\n.apply(&self.fc2)        // [16, 102]\n}\n}\n清单 6-15\nchapter6/pytorch-image-classifi\
  \ cation/src/main.rs\n```\n\n在清单 6-15 的代码中，展示了每次张量变换后维度的变化。输入张量 `xs` 的维度从 [16, 3,\
  \ 224, 224] 变为 [16, 102]，即 `(batch_size, outputs)`，这是应用变换后的结果。执行此代码时，你可以验证维度是否匹配。\n\
  \n模型创建完成后，应能在数据集上训练它。PyTorch 模型的训练过程通常类似：初始化模型实例、定义损失函数、初始化优化器。我们还可以将返回类型改为 `Fallible`，这是\
  \ `tch` 仓库中的标准做法。这可以在清单 6-16 的代码中看到。\n\n```\nuse failure;\nfn main() -> failure::Fallible\
  \ {\n// 之前的代码 ...\nlet image_dataset = load_from_dir(dataset_folder).unwrap();\n\
  let vs = nn::varstore::new(device::cuda_if_available());\nlet opt = nn::adam::default().build(&vs,\
  \ 1e-4)?;\nlet net = cnnnet::new(&vs.root());\nfor epoch in 1..100 {\nfor (bimages,\
  \ blabels)\nin image_dataset.train_iter(batch_size)\n.shuffle().to_device(vs.device())\
  \ {\nlet loss = net\n.forward_t(&bimages, true)\n.cross_entropy_for_logits(&blabels);\n\
  opt.backward_step(&loss);\n}\nlet test_accuracy =\nnet.batch_accuracy_for_logits(&image_dataset.test_images,\n\
  &image_dataset.test_labels,\nvs.device(), 1024);\nprintln!(\"epoch: {:4} test acc:\
  \ {:5.2}%\",\nepoch, 100\\. * test_accuracy,);\n}\n// 剩余代码 ...\nOk(())\n}\n清单 6-16\n\
  chapter6/pytorch-image-classifi cation/src/main.rs\n```\n\n在清单 6-16 中，`vs` 用于存储在训练过程不同阶段使用的通用配置。如前所述，模型通过变量\
  \ `net` 初始化。在 100 个 epoch 中，从数据集中分批取出数据进行训练。由于训练变量是 `Dataset` 结构体的实例，`bimages` 和\
  \ `blabels` 被整齐地取出，此处图像的形状为 [32, 3, 244, 244]，标签的形状为 [32]。`forward_t` 方法会将张量传递到之前定义的整个架构中，而\
  \ `opt.backward_step` 会计算梯度。完成 100 个 epoch 后，模型即训练完成。\n\n现在你可以使用 `cargo run` 运行该包。运行后，检查是否生成了\
  \ `trained_model.ot` 文件。\n\n### 注意\n\n由于上述所有代码会消耗大量计算资源，你的笔记本电脑可能无法运行。如果发生这种情况，可以尝试减少预测的标签数量。同时，请相应修改\
  \ `LABELS` 参数，使其与你预测的标签数量一致。你也可以尝试减小 `BATCH_SIZE`。\n\n\n\n### 6.1.5 模型构建与调试\n\n\
  在构建模型时，密切跟踪数据流经过程中所构建的不同张量的形状至关重要。否则，很容易遇到如清单 6-17 所示的错误。\n\n```\nthread 'main'\
  \ panicked at 'called `Result::unwrap()` on an `Err`\nvalue: TorchError { c_error:\
