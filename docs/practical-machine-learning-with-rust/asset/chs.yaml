  [08:26:11] src/tree/updater_prune.cc:74: tree pruning end, 1 roots, 2 extra nodes,\
  \ 0 pruned nodes, max_depth=1\n[08:26:11] src/tree/updater_prune.cc:74: tree pruning\
  \ end, 1 roots, 6 extra nodes, 0 pruned nodes, max_depth=2\n[08:26:11] src/tree/updater_prune.cc:74:\
  \ tree pruning end, 1 roots, 6 extra nodes, 0 pruned nodes, max_depth=2\n[1]   \
