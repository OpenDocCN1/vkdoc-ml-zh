  \ 1.0, 2.0, 0.0, 2.0, 0.0, 2.0, 0.0, 2.0, 2.0, 0.0, 2.0, 2.0, 0.0, 1.0, 1.0, 1.0,\
  \ 2.0, 0.0, 2.0, 0.0, 0.0]\naccuracy=0.93333334 (28/30 correct)\n```\n\n\n\n###\
  \ 2.8.6 支持向量机\n\n支持向量机（SVM）是一种判别式分类器，其正式定义基于一个分离超平面。图 2-3 展示了可能的超平面。换句话说，给定带标签的训练数据，该算法会输出一个最优超平面，用于对新样本进行分类。在二维空间中，这个超平面是一条将平面分成两部分的直线，每一类数据分布在两侧。定义该超平面的向量被称为支持向量。\n\
  \n![../images/482357_1_En_2_Chapter/482357_1_En_2_Fig3_HTML.jpg](img/482357_1_En_2_Fig3_HTML.jpg)\n\
  \n图 2-3\n\nSVM\n\n核函数改变了线性公式中点积的定义。常见的点积类型包括线性、多项式、径向基函数和 Sigmoid 函数。通常，RBF 函数被用作大多数\
  \ SVM 模型的默认核函数 [7]。\n\n在图 2-1 中，针对不同的数据点，我们尝试了多个超平面，但最终选择了超平面（直线 2），因为它具有最大的间隔。\n\
  \n要在 `rustlearn` 中实现 SVM，我们需要首先使用合适的核函数创建模型，然后在训练数据集上拟合模型。`rustlearn` 中的 SVM 模块只是对\
  \ `libsvm` 包的一个封装。^(⁸) 请观察清单 2-47 中的代码片段，其中展示了不同核函数的模型。\n\n```\nuse rustlearn::svm::libsvm::svc::{\n\
  Hyperparameters as libsvm_svc, KernelType};\npub fn run() -> Result> {\n// 之前的代码\
  \ ...\nlet svm_linear_model = libsvm_svc::new(\n4, KernelType::Linear, 3)\n.C(0.3).build();\n\
  let svm_poly_model = libsvm_svc::new(4, KernelType::Polynomial, 3)\n.C(0.3) .build();\n\
  let svm_rbf_model = libsvm_svc::new(4, KernelType::RBF, 3)\n.C(0.3).build();\nlet\
  \ svm_sigmoid_model = libsvm_svc::new(4, KernelType::Sigmoid, 3)\n.C(0.3).build();\n\
  let svm_kernel_types = [\"linear\", \"polynomial\", \"rbf\", \"sigmoid\"];\nlet\
  \ mut svm_model_types = [svm_linear_model, svm_poly_model, svm_rbf_model, svm_sigmoid_model];\n\
  for (kernel_type, svm_model) in svm_kernel_types.iter().zip(svm_model_types.iter_mut())\
  \ {\nsvm_model.fit(&flower_x_train, &flower_y_train).unwrap();\nlet prediction =\
  \ svm_model.predict(&flower_x_test).unwrap();\nlet acc = accuracy_score(&flower_y_test,\
  \ &prediction);\nprintln!(\"Lib svm {kernel}: accuracy: {accuracy}\", accuracy=acc,\
  \ kernel=kernel_type);\n};\n// 剩余代码 ...\n清单 2-47\nchapter3/rustlearn_classification_tasks/src/svm.rs\n\
  ```\n\n我们应该会得到类似于清单 2-48 所示的输出。\n\n```\nLib svm linear: accuracy: 0.9\nLib svm polynomial:\
  \ accuracy: 0.9\nLib svm rbf: accuracy: 0.8666667\nLib svm sigmoid: accuracy: 0.26666668\n\
  清单 2-48\n输出\n```\n\n### 2.8.7 K 近邻算法\n\n在 Rust 中进行分类时，我们主要关注 `rustlearn`；进行回归时，我们使用了\
  \ `rusty machine`。但 `rusty machine` 中有一个流行分类器是 `rustlearn` 所没有的，那就是 K 近邻算法。KNN 算法的假设是“物以类聚”，或者说，相似的事物往往会产生相同的结果。因此，一个对象是通过其邻居的多数投票来分类的。\n\
  \n在 `rusty machine` 中，KNN 分类器尚未发布到 crate 上，因此我们需要克隆仓库并从本地路径构建，或者使用 GitHub 引用（清单\
  \ 2-49）。\n\n```\n[package]\nname = \"rusty_machine_classification\"\nversion = \"\
  0.1.0\"\nedition = \"2018\"\n[dependencies]\nrusty-machine = { path = \"../rusty-machine\"\
  \ }\nml-utils = { path = \"../ml-utils\" }\nrand = \"0.6.5\"\ncsv = \"1.0.7\"\n\
  清单 2-49\nchapter2/rusty_machine_classification/Cargo.toml\n```\n\n由于这是一个分类算法，我们将使用\
  \ `Flower` 结构体和鸢尾花数据集。`Flower` 结构体已为 `rustlearn` 的使用而实现，因此我们需要进行一些额外的调整（清单 2-50）。\n\
  \n```\nuse rusty_machine as rm;\nuse rm::linalg::Matrix;\nuse rm::linalg::Vector;\n\
  use ml_utils;\nuse ml_utils::datasets::Flower;\nfn main() -> Result> {\n// 之前的数据加载和分割代码\
  \ ...\n// 区分特征和标签。\nlet flower_x_train: Vec = train_data.iter().flat_map(|r| {\n\
  let features = r.into_feature_vector();\nlet features: Vec = features.iter().map(\n\
  |&x| x as f64).collect();\nfeatures\n}).collect();\nlet flower_y_train: Vec = train_data.iter().map(\n\
  |r| r.into_int_labels() as usize).collect();\nlet flower_x_test: Vec = test_data.iter().flat_map(|r|\
  \ {\nlet features = r.into_feature_vector();\nlet features: Vec = features.iter().map(\n\
  |&x| x as f64).collect();\nfeatures\n}).collect();\nlet flower_y_test: Vec = test_data.iter().map(\n\
  |r| r.into_int_labels() as u32).collect();\n// 将数据转换为 rusty machine 所需的矩阵\nlet flower_x_train\
  \ = Matrix::new(train_size, 4, flower_x_train);\nlet flower_y_train = Vector::new(flower_y_train);\n\
  let flower_x_test = Matrix::new(test_size, 4, flower_x_test);\n// 剩余代码 ...\n清单 2-50\n\
  chapter2/rusty_machine_classification/src/main.rs\n```\n\n请记住，`rustlearn` 需要 `f32`\
  \ 类型的向量，而在 `rusty machine` 中，我们需要创建 `f64` 类型的 `rulinalg` 矩阵，因此我们需要在以上代码中将这些 `f32`\
  \ 向量转换为 `f64`，然后再创建矩阵。此外，`Flower` 结构体的 `into_int_labels` 方法与 `into_labels` 相同，但此处是为\
  \ `u64` 实现的，因为我们处理的是特定的标签（清单 2-51）。\n\n```\nimpl Flower {\n// ... Flower 的之前代码\n\
  pub fn into_int_labels(&self) -> u64 {\nmatch self.species.as_str() {\n\"setosa\"\
  \ => 0,\n\"versicolor\" => 1,\n\"virginica\" => 2,\nl => panic!(\n\"无法解析目标。传入了其他目标。{:?}\"\
  , l),\n}\n}\n}\n清单 2-51\nchapter2/rust-lang/ml-utils/src/datasets.rs\n```\n\n这被转换为\
  \ `usize` 类型，因为我们稍后要使用的 KNN `struct` 将标签实现为 `usize` 类型。\n\n现在，我们应该能够创建一个简单的 KNN\
  \ 分类器，并在鸢尾花数据集上训练它（清单 2-52）。\n\n```\nuse rm::learning::knn::KNNClassifier;\nuse\
  \ rusty_machine::learning::knn::{KDTree, BallTree, BruteForce};\nuse rm::learning::SupModel;\n\
  use ml_utils::sup_metrics::accuracy;\nfn main() -> Result> {\n// 之前的代码 ...\nlet\
  \ mut knn = KNNClassifier::new(2); // 模型初始化\nknn.train(&flower_x_train, &flower_y_train).unwrap();\
  \ // 训练\nlet preds = knn.predict(&flower_x_test).unwrap(); // 预测\nlet preds: Vec\
  \ = preds.data().iter().map(|&x| x as u32).collect();\nprintln!(\"accuracy {:?}\"\
  ,\naccuracy(preds.as_slice(), &flower_y_test)); // 准确率\nOk(())\n}\n清单 2-52\nchapter2/rusty_machine_classification/src/main.rs\n\
  ```\n\n报告的准确率应该在 93% 到 100% 之间。\n\n在 `rusty-machine` 中，除了默认的 KDTree 算法外，我们还可以使用不同的\
  \ KNN 模型。我们可以使用 Ball tree 算法（适用于维度非常高的情况），或者 Brute force 算法，其优势在于可以轻松并行化（清单 2-53）。\n\
  \n```\nuse rusty_machine::learning::knn::{KDTree, BallTree, BruteForce};\nfn main()\
  \ -> Result> {\n// 之前的代码 ...\nlet mut knn = KNNClassifier::new_specified(2, BallTree::new(30));\n\
  let mut knn = KNNClassifier::new_specified(2, KDTree::default());\nlet mut knn =\
  \ KNNClassifier::new_specified(2, BruteForce::default());\n// 剩余代码 ...\n清单 2-53\n\
  chapter2/rusty_machine_classification/src/main.rs\n```\n\n完整的代码，请查看 `chapter2` 文件夹中的\
  \ `rusty_machine_classification` 包。\n\n\n\n### 2.8.8 神经网络\n\n神经网络是一组算法，其设计灵感来源于人脑，主要用于识别模式。使用神经网络最流行的方法之一是将它们堆叠成组。可用的有效网络通常由多个层组成，这些层又由节点构成。节点是进行计算的地方。节点将数据输入与一组系数或权重相结合，这些系数或权重会放大或抑制输入，从而根据算法试图学习的任务（例如，哪个输入最有助于无误差地对数据进行分类）为输入分配重要性。这些输入与权重的乘积被求和，然后通过一个“激活函数”。激活函数通常是非线性的，它们用于确定信号是否以及以何种程度在网络中进一步传播，以影响最终结果，例如分类任务。如果信号通过，则神经元被“激活”。请参见图\
  \ 2-4 以了解节点可能的样子。\n\n节点层是一排类似神经元的开关，当输入通过网络时，这些开关会打开或关闭。从接收数据的初始输入层开始，每一层的输出同时是下一层的输入。将模型的可调整权重与输入特征配对，是我们根据神经网络如何对输入进行分类和聚类来为这些特征分配重要性的方式。\n\
  \n具有多个隐藏层的神经网络，其每一层节点都基于前一层的输出，在一组不同的特征上进行训练。更深的层能够学习训练数据中更复杂的特征，因为它们能够聚合和重组来自前一层的特征。示例如图\
  \ 2-5 所示。\n\n![../images/482357_1_En_2_Chapter/482357_1_En_2_Fig5_HTML.jpg](img/482357_1_En_2_Fig5_HTML.jpg)\n\
  \n图 2-5\n\n深度神经网络\n\n![../images/482357_1_En_2_Chapter/482357_1_En_2_Fig4_HTML.jpg](img/482357_1_En_2_Fig4_HTML.jpg)\n\
  \n图 2-4\n\n单节点示例\n\n#### 2.8.8.1 Torch 和 tch-rs\n\nTorch 是一个科学计算框架，广泛支持机器学习算法，并且对\
