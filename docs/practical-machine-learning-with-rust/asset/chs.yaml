  \ 文件夹中。现在我们应该能够运行代码并获取结果。\n\n## 2.5 高斯过程\n\n高斯过程可用于回归问题。可以将高斯过程视为在函数上定义分布，并且推理直接在函数空间（即函数空间视角）中进行。高斯过程模型的预测结果采用完整预测分布的形式。因此，高斯过程是一个随机变量的集合，其中任意有限数量的随机变量都服从联合高斯分布。\n\
  \n一个高斯过程完全由其均值函数和协方差函数确定。因此，在高斯过程中，需要指定先验。通常，先验均值被假定为零，而协方差则通过传递一个核对象来指定。\n\n高斯过程的噪声水平也可以传递。适度的噪声水平有助于处理拟合时的数值问题，因为它实际上是以吉洪诺夫正则化的方式实现的，即通过将其添加到核矩阵的对角线上。\n\
  \n创建一个高斯过程模型，用于在上述波士顿数据集的训练部分进行训练。这里，定义一个长度尺度为 2、振幅为 1 的核作为协方差函数。定义一个零函数作为均值函数，并将噪声水平限制在\
  \ 10.0。然后，我们将训练用的 x 和 y 传递给训练方法。这将根据训练值优化模型（列表 2-22）。\n\n```\nuse rusty_machine::learning::gp::GaussianProcess;\n\
  use rusty_machine::learning::gp::ConstMean;\nuse rusty_machine::learning::toolkit::kernel;\n\
  use rusty_machine::learning::SupModel;\npub fn run() -> Result> {\n// 之前的数据加载和划分代码...\n\
  // 核函数\nlet ker = kernel::SquaredExp::new(2., 1.);\n// 均值函数\nlet zero_mean = ConstMean::default();\n\
  // 模型定义\nlet mut gaus_model = GaussianProcess::new(ker, zero_mean, 10f64);\ngaus_model.train(&boston_x_train,\n\
  &boston_y_train)?;\nlet predictions = gaus_model.predict(&boston_x_test).unwrap();\n\
  let predictions = Matrix::new(test_size, 1, predictions);\nlet acc = neg_mean_squared_error(&predictions,\
  \ &boston_y_test);\nprintln!(\"高斯过程回归误差: {:?}\", acc);\nprintln!(\"高斯过程回归 R2 分数:\
  \ {:?}\", r_squared_score(\n&boston_y_test.data(), &predictions.data()));\nOk(())\n\
  }\n列表 2-22\nchapter2/rustymachine_regression/src/gaussian_process_reg.rs\n```\n\n\
  如果这段代码运行无误，意味着我们能够成功创建模型。我们应该会得到类似于列表 2-23 的输出。\n\n```\n$ cd chapter2/rustymachine_regression\n\
  $ cargo run gp\n高斯过程回归误差: -593.9085507602914\n高斯过程回归 R2 分数: -5.578006698530541\n\
  列表 2-23\nchapter2/rustymachine_regression/src/gaussian_process_reg.rs 输出\n```\n\n\
  ## 2.6 广义线性模型\n\n普通线性回归假设未知量是预测变量集的线性组合。如果响应变量是输入变量的正态分布，这个假设是可行的。这类数据可以是任何相对稳定且变化幅度较小的数据。这在许多自然分布中都能看到，例如人类的身高，其中一个值与另一个值相互独立，因此中心极限定理能够发挥作用。然而，在现实生活中，许多分布并非正态分布。\n\
  \n广义线性模型是 OLS 回归模型的一种灵活变体，它允许响应变量具有除正态分布以外的误差分布模型。在这些模型中，响应变量 *y*[*i*] 被假定服从均值为\
  \ *μ*[*i*] 的指数族分布，而该均值被假定为 ![$$ {x}_i^T\\beta $$](img/482357_1_En_2_Chapter_TeX_IEq4.png)\
  \ 的某个（线性或非线性）函数 [1]。\n\nGLM 包含三个要素 [2]。\n\n1.  一个类似于 OLS 的线性预测器\n\n![$$ {\\eta}_i={\\\
  beta}_0+{\\beta}_1{x}_{1i}+\\dots +{\\beta}_p{x}_{pi} $$](img/482357_1_En_2_Chapter_TeX_Equ2.png)\n\
  \n(2)\n\n1.  一个链接函数，描述均值 *E*(*Y*[*i*]) = *μ*[*i*] 如何依赖于线性预测器\n\n*   或者用矩阵形式表示 η = *X*β\n\
  \n![$$ g\\left({\\mu}_i\\right)={\\eta}_i $$](img/482357_1_En_2_Chapter_TeX_Equ3.png)\n\
  \n(3)\n\n1.  一个方差函数，描述方差 var(*Y*[*i*]) 如何依赖于均值\n\n![$$ \\operatorname{var}\\left({Y}_i\\\
  right)=\\phi V\\left(\\mu \\right) $$](img/482357_1_En_2_Chapter_TeX_Equ4.png)\n\
  \n(4)\n\n如果 V 服从指数族分布，则非常方便。未知参数 *β* 通常使用最大似然估计、最大拟似然估计或贝叶斯方法进行估计。可以证明，一般线性模型是 GLM\
  \ 的一个特例，其中链接函数为 *g*(*μ*[*i*]) = *μ*[*i*]，方差函数为 *V*(*μ*[*i*]) = 1。\n\n在 rusty_machine\
  \ 中，我们可以使用列表 2-24 中所示的代码创建一个线性回归模型。\n\n```\nuse rusty_machine::learning::glm::{GenLinearModel,\
  \ Normal};\npub fn run() -> Result> {\n// 数据加载和划分的起始代码...\n// 创建一个正态广义线性模型\nlet\
  \ mut normal_model = GenLinearModel::new(Normal);\nnormal_model.train(\n&boston_x_train,\
  \ &boston_y_train)?;\nlet predictions = normal_model.predict(\n&boston_x_test).unwrap();\n\
  let predictions = Matrix::new(\ntest_size, 1, predictions);\nlet acc = neg_mean_squared_error(\n\
  &predictions, &boston_y_test);\nprintln!(\"GLM 泊松精度: {:?}\", acc);\nprintln!(\"\
  GLM 泊松 R2 分数: {:?}\", r_squared_score(\n&boston_y_test.data(), &predictions.data()));\n\
  Ok(())\n}\n列表 2-24\nchapter2/rustymachine_regression/src/glms.rs\n```\n\n这段代码的输出应类似于列表\
  \ 2-25。\n\n```\n$ cargo run glms\nGLM 泊松精度: -36.55900309522449\nGLM 泊松 R2 分数: 0.6478692745681216\n\
  列表 2-25\nglms.rs 输出\n```\n\n其他已实现的模型包括伯努利模型和二项式模型，它们主要用于分类。我们也可以使用泊松回归作为准则。泊松回归与多元回归类似，不同之处在于因变量是服从泊松分布的观测计数。因此，Y\
  \ 的可能值为非负整数：0, 1, ... 等等。假设大计数值是罕见的。\n\n\n\n## 2.7 回归模型的评估\n\n到目前为止，在我们讨论的所有机器学习模型代码中，我们已经使用了一些函数，例如\
  \ `neg_mean_squared_error` 或 `r_squared_score`，但我们一直避免讨论它们。这些函数用于评估所创建模型的好坏，在本节中，我们将详细讨论这些函数、它们的创建以及用法。\n\
  \n评估模型对于了解它是否能在新的和未来的数据上很好地预测目标变量至关重要。由于未来实例的目标值是未知的，我们需要在已知数据上检查机器学习模型的准确度指标。这就是为什么在训练之前，我们要将数据集拆分为训练集和测试集。这种评估作为衡量机器学习模型模拟真实世界用例接近程度的代理。\n\
  \n### 2.7.1 平均绝对误差和均方误差\n\n对于连续变量，两种最流行的评估指标方法是平均绝对误差和均方误差 [3]。平均绝对误差是预测值与观测值之间绝对差值的平均值。对于从\
  \ *n* 个数据点样本生成的 *n* 个预测值向量 ![$$ \\hat{y} $$](img/482357_1_En_2_Chapter_TeX_IEq5.png)，如果\
  \ *y* 是这些数据点的观测值，那么\n\n![$$ {\\in}_{M\\;A\\;E}=\\frac{1}{n}\\;\\sum \\limits_{i=1}^n\\\
  left|{y}_i-\\hat{y_i}\\right| $$](img/482357_1_En_2_Chapter_TeX_Equ5.png)\n\n(5)\n\
  \n均方误差是预测值与观测值（也称为残差）之间差值的平方和。\n\n![$$ {\\in}_{M\\;S\\;E}=\\frac{1}{n}\\;\\sum \\\
  limits_{i=1}^n{\\left({y}_i-\\hat{y_i}\\right)}² $$](img/482357_1_En_2_Chapter_TeX_Equ6.png)\n\
  \n(6)\n\n在许多情况下，也会取上述结果的平方根，即 ![$$ \\sqrt{\\in_{M\\;S\\;E}} $$](img/482357_1_En_2_Chapter_TeX_IEq6.png)。这本质上将其转换为样本标准差，并称为均方根误差。\n\
  \n对于高斯分布而言，RMSE 是最佳的误差估计量。遗憾的是，大多数真实世界的用例并非严格的高斯分布。它们仅在有限的空间内表现得像高斯分布。结果是，由于对残差进行平方，我们过度重视了异常值。MAE\
  \ 更容易理解，并且不会过分强调异常值。然而，RMSE 是许多模型的默认指标，因为以 RMSE 定义的损失函数是平滑可微的，这使得执行机器学习所需的数学运算更加容易。\n\
  \n在 Rusty Machine 中，要获取这些模型的均方误差，一旦训练完成，我们将 `boston_x_test` 作为参考传递给模型的预测方法以获取预测值。这些预测值与实际值进行比较，得到\
  \ `neg_mean_squared_error` 函数。该函数返回均方误差的相反数。均方误差是预测值与实际观测值之间差值的平方的平均值（列表 2-26）。\n\
  \n```\nuse rusty_machine::analysis::score::neg_mean_squared_error;\npub fn run()\
  \ -> Result> {\n// 前面的部分 ...\nlet predictions = lin_model.predict(&boston_x_test).unwrap();\n\
  let predictions = Matrix::new(test_size, 1, predictions);\nlet acc = neg_mean_squared_error(&predictions,\
  \ &boston_y_test);\nprintln!(\"线性回归误差: {:?}\", acc);\nlet predictions = gaus_model.predict(&boston_x_test).unwrap();\n\
  let predictions = Matrix::new(test_size, 1, predictions);\nlet acc = neg_mean_squared_error(&predictions,\
  \ &boston_y_test);\nprintln!(\"高斯过程回归误差: {:?}\", acc);\n// 剩余代码...\n列表 2-26\nchapter2/rustymachine_regression/src/lin_reg.rs\n\
  ```\n\n### 2.7.2 R 平方误差\n\nR 平方评估数据点围绕拟合回归线的离散程度。它也被称为决定系数。对于相同的数据集，较高的 R 平方值表示观测值与拟合值之间的差异较小。\n\
  \nR 平方是线性模型解释的因变量变异的百分比。\n\n![$$ {R}²=\\frac{\\mathrm{模型解释的方差}}{总方差} $$](img/482357_1_En_2_Chapter_TeX_Equ7.png)\n\
  \n(7)\n\n![$$ =1-\\frac{\\frac{1}{n}\\;{\\sum}_{i=1}^n{\\left({y}_i-{\\hat{y}}_i\\\
  right)}²}{\\frac{1}{n}\\;{\\sum}_{i=1}^n{\\left({y}_i-\\overline{y}\\right)}²} $$](img/482357_1_En_2_Chapter_TeX_Equ8.png)\n\
  \n(8)\n\n在图 2-2 中，我们可以通过两个样本数据点直观地看到 R 平方值如何表示回归线周围的离散程度。\n\n![../images/482357_1_En_2_Chapter/482357_1_En_2_Fig2_HTML.jpg](img/482357_1_En_2_Fig2_HTML.jpg)\n\
  \n图 2-2\n\n样本回归拟合\n\n左侧回归模型的 R 平方为 93%，右侧模型为 47%。当回归模型解释了更多的方差时，数据点更接近回归线。在实践中，从未观察到\
  \ *R*² 为 100% 的回归模型。在这种情况下，拟合值等于数据值，因此所有观测值都恰好落在回归线上。\n\n下一个函数可以用作在 Rust 中实现 R 平方的参考。我们首先获取模型方差，即实际值与预测值之间连续差值的平方和。然后我们获取实际分布的均值，并用它来计算测试分布的方差。然后我们通过\
  \ R 平方公式运行它（列表 2-27）。\n\n```\nfn r_squared_score(y_test: &Vec, y_preds: &Vec) ->\
  \ f64 {\nlet mv: f64 = y_test.iter().zip(y_preds.iter()).fold(\n0., |v, (y_i, y_i_hat)|\
  \ {\nv + (y_i - y_i_hat).powi(2)\n}\n);\nlet mean = y_test.iter().sum::() as f64\n\
  / y_test.len() as f64;\nlet var =  y_test.iter().fold(\n0., |v, &x| {v + (x - mean).powi(2)}\n\
  );\nlet r2: f64 = 1.0 - (mv / var);\nr2\n}\n列表 2-27\nml-utils/src/sup_metrics.rs\n\
  ```\n\n这个函数应该可以通过传递 `y_test` 和 `y_pred` 来获取分数。由于在本章的示例中，`y_test` 和预测值位于 `rusty machine`\
  \ 的矩阵中，我们可能需要像列表 2-28 所示那样操作。\n\n```\npub fn run() -> Result> {\n// 函数的前面部分...\n\
  println!(\"GLM 泊松 R2 分数: {:?}\", r_squared_score(\n&boston_y_test.data(), &predictions.data()));\n\
  }\n列表 2-28\nchapter2/rustymachine_regression/src/glms.rs\n```\n\n## 2.8 分类算法\n\n\
  机器学习算法被任务将输入变量分配到预定义桶中的场景称为分类问题。在本节中，我们将使用 Rust 创建分类模型。\n\n在 Rust 中，我们可以使用 `rustlearn`\
  \ 包创建分类器。这个 crate 包含了许多常见机器学习算法的有效实现。为了能够使用 `rustlearn`，我们需要将浮点数实现为 `float32`。\n\
  \n\n\n### 2.8.1 鸢尾花数据集\n\n为了展示分类算法的用法，我们将使用鸢尾花数据集。^(⁵) 请从网站下载该数据集，或在本节配套代码的 `datasets`\
