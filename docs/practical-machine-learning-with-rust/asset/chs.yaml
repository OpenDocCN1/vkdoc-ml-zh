  \ + &bs;\nlet test_accuracy = test_logits\n.argmax1(-1, false)\n.eq1(&flower_y_test)\n\
  .to_kind(Kind::Float)\n.mean()\n.double_value(&[]);\nprintln!(\n\"epoch: {:4} train\
