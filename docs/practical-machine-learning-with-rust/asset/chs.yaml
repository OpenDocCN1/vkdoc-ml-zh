  \ S3_ENDPOINT env. variable\",\nregion\n);\nregion\n} else {\n// Region::UsEast1\n\
  Region::ApSouth1\n};\nlet credentials = DefaultCredentialsProvider::new()\n.unwrap().credentials()\n\
  .wait().unwrap();\nlet client = S3Client::new(region.clone());\n// rest of the code...\n\
