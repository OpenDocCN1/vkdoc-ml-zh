- '# 3. 无监督学习与强化学习


  在前面的章节中，我们了解了属于监督学习范畴的回归和分类算法 [1]。在本章中，我们将探讨机器学习的其余形式，即无监督算法和强化学习。在无监督算法中，没有给出标签或目标类别。因此，无监督学习的目标是尝试找到模式的自然划分。


  执行无监督学习的主要形式是通过聚类。


  首先，我们将重点介绍不同的无监督学习算法，以及如何使用 Rust 实现它们。我们将使用相同的 Iris 数据集，数据准备步骤与我们在第 2 章中看到的相同。最后，我们应该得到两个
  `rusty_machine` 稠密矩阵 `flower_x_train` 和 `flower_x_test`。尽管该数据集并非完全适合无监督学习（因为我们知道标签），但它是一个理解创建无监督模型工作原理的好数据集。


  ## 3.1 K-Means 聚类


  执行无监督学习的一种方法是基于相似性概念观察哪些数据组聚集在一起。解决聚类问题的最简单模型是 k-means。需要预先设定聚类的数量；基于此，数据集被分类，以便形成这些设定数量的聚类。图
  3-1 展示了一个使用 k-means 进行聚类的数据集示例。


  ![../images/482357_1_En_3_Chapter/482357_1_En_3_Fig1_HTML.jpg](img/482357_1_En_3_Fig1_HTML.jpg)


  图 3-1


  K-means 聚类：此处聚类数取为 3，但我们也可以取为 2


  最终 k-means 的输出很大程度上取决于所使用的初始模式。这些模式通常使用 Forgy、Random Partition 或 K-means++ 方法进行初始化。在
  Forgy 方法中，从数据集中随机选择 k 个观测值作为初始均值。在随机划分方法中，一开始为每个观测值分配一个聚类，然后进入更新步骤，从而将初始均值计算为聚类随机分配点的质心。Forgy
  方法倾向于分散初始均值，而随机划分则将它们全部放置在靠近数据集中心的位置。


  K-Means++ 与普通 K-Means 几乎相同，只是 K-Means++ 首先随机分配一个聚类中心，然后根据第一个中心搜索其他中心 [2]。


  使用 `rusty_machine`，我们可以利用 `K-MeansClassifier` 结构体，通过 `train` 方法在数据上实现和应用 K-Means。然后，我们可以查看模型质心，或者对未见过的数据运行
  predict 方法（清单 3-1）。


