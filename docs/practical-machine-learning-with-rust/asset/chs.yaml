  现在到了有趣的部分。给定数据，我们需要将数据中的每个条目提取到 `crf_suite` crate 提供的 `Attributes` 向量中，以便训练模块能够在数据集上进行训练。这个
  `Attribute` 将包含令牌及其值，即该令牌在序列中的权重。在清单 5-30 中，目标词的权重为 1.0，下一个词的权重为 0.5，但你可以调整这些权重，看看哪个能带来更好的结果。标签可以按预期使用
  `Vec<String>`。


  ```

  fn create_xseq_yseq(

  data: &[NER])

  -> (Vec>, Vec) {

  let mut xseq = vec![];

  let mut yseq = vec![];

  for item in data {

  let seq = vec![Attribute::new(item.lemma.clone(), 1.0),

  Attribute::new(item.next_lemma.clone(), 0.5)]; // 主词的权重更高。

  xseq.push(seq);

  yseq.push(item.tag.clone());

  }

  (xseq, yseq)

  }

