  \ SID[i].clone()).collect();\nlet STP: Vec = SID.iter().map(\n|k| SIF.get(&k.to_string()).unwrap())\n\
  .cloned().collect();\n(SID, STP, indices)\n}\nfn process_file(filename: &Path) {\n\
  // 之前的代码 ..\nlet mut gene_expression_headers = true;\nlet mut indices: Vec = Vec::new();\n\
  let mut gene_expression_measures_vec = Vec::new();\nlet mut gene_identifiers_vec\
  \ = Vec::new();\nlet mut SID = Vec::new();\nlet mut STP = Vec::new();\n'linereading:\
  \ for line in BufReader::new(file).lines() {\nlet thisline = line?;\nlet line_split:\
  \ Vec = thisline.split(\"=\").map(|s| s.to_owned()).collect();\nif within_dataset_table\
  \ && gene_expression_headers {\nlet sid_stp_indices = process_gene_expresssion_data_headers(&thisline,\
