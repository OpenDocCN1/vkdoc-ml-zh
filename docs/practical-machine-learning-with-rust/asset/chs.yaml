  \n在本节中，我们将探索一种基础而优雅的数据结构——矩阵，以及它的近亲张量。矩阵在机器学习领域具有极其重要的地位，因为几乎所有操作和“学习”过程都涉及矩阵乘法。\n\
  \n简单来说，矩阵是按行和列排列的矩形数据数组。矩阵支持基本的算术运算，如加法和乘法，矩阵运算的数学体系也称为线性代数。最流行的线性代数 crate 是 `ndarray`，我们将使用\
