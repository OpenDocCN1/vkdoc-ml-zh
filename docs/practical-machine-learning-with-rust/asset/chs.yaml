  \ ndarray 矩阵，因此需要 ndarray。另外，如果你需要测量更高级的统计量，我们还可以引入 ndarray-stats crate，它为我们处理 ndarray\
  \ 向量时提供了更多选项。\n\n现在我们应该能够读取头部信息了。首先是 `subset_description`，然后在下一行中，`subset_sample_id`\
  \ 以列表形式给出。下面列表 7-6 展示了一个示例。\n\n```\n// 之前的数据 ..\n!subset_description = normal\n\
