  \ }',\nsrc/libcore/result.rs:997:5\n清单 6-18\n训练时可能出现的批次大小失败错误\n```\n\n在这些情况下，我们需要对网络进行调试。一种调试方法是将应用程序迁移到\
  \ Python 应用，并在其中运行，同时打印出每一步的形状。参见清单 6-19。\n\n```\nimport torch.nn as nn\nimport\
  \ torch.nn.functional as F\nclass Net(nn.Module):\ndef __init__(self):\nsuper(Net,\
  \ self).__init__()\nself.conv1 = nn.Conv2d(3, 32, 5)\nself.pool1 = nn.MaxPool2d(2,\
  \ 2)\nself.fc1 = nn.Linear(1600, 1024)\nself.fc2 = nn.Linear(1024, 10)\ndef forward(self,\
  \ x):\nx = self.conv1(x)\nprint(x.shape)\nx = self.pool1(x)\nprint(x.shape)\nx =\
  \ F.relu(self.fc1(x))\nprint(x.shape)\nx = F.dropout(x, training=True)\nprint(x.shape)\n\
  x = self.fc2(x)\nprint(x.shape)\nreturn x\nnet = Net()\n清单 6-19\nPyTorch 中的示例代码\n\
  ```\n\n上述逻辑同样可以应用于 Rust。我们可以将之前的 `forward` 函数改写成上述方式，并在过程中插入 `println` 语句（清单 6-20）。\n\
