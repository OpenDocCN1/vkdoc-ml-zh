  现在，为了训练一个好的 fastText 模型，建议对原始文本进行一些文本预处理。文本预处理主要是为了实现文本规范化，这意味着转换文本的特定区域，使文本更有利于机器学习。本节展示的技术并非详尽无遗，也非万无一失，但在各种上下文中被普遍采用。请根据您的具体上下文使用所有文本规范化技术，以达到最佳效果。


  我们可以将所有文本转换为小写。这主要适用于主要使用拉丁字母书写的日耳曼语言。英语就是一个典型的例子。在这些语言中，小写和大写之间存在差异，并且在计算设备处理过程中它们被视为不同。因此，将文本转换为小写可能很重要，这样在训练期间的学习过程中，相似的文本就不会被区别对待。但是，在将所有文本转换为小写时应小心，因为首字母缩略词和枚举在转换为小写后可能会完全失去其含义。在
  Rust 中，字符串上的 `to_lowercase` 方法会将所有字符转换为小写（列表 5-10）。


  ```

  let lc_text = text.to_lowercase();

  列表 5-10

  chapter5/fasttext-model/src/main.rs

  ```




  传统计算设备通常将文档存储为字符序列。即便是 Rust，也会将随机文档存储为 `Vec<u8>`。但这种格式无法为机器学习算法提供任何信息。因此，文档需要被分解为**具有语言学意义的单元**。这一过程被称为分词。由于不同语言在意义组织方式上存在差异，我们需要为不同语言创建不同的分词库。通常，在英语中，意义存在于由空格分隔的单词中，因此相对而言，英语比中文或日语等语言更容易处理，因为这些语言的书写系统中可能没有空格来分隔“单词”或“标记”。即使在英语中，也需要小心处理；例如，“New
  Delhi”需要作为一个整体来理解其含义。在 Rust 中，如果我们尝试对英文句子进行分词，可以使用 `vtext` crate（代码清单 5-11）。


  ```

  let tok = VTextTokenizer::new("en");

  let tokens: Vec = tok.tokenize(lc_text.as_str()).collect();

