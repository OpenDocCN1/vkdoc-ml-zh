  ```\n\n现在我们应该能够在 `rustlearn` 模型上训练数据了。\n\n### 2.8.2 逻辑回归\n\n逻辑回归是一种流行的分类技术，它使用 logit\
  \ 函数对二元因变量进行建模。其假设是因变量服从伯努利分布。虽然 OLS 回归是一种距离最小化的近似方法，但逻辑回归的参数估计是使用最大似然法完成的。最大化似然函数可以确定最有可能产生观测数据的参数。\n\
  \n与回归不同，对于正态分布的残差，无法找到最大化该函数的闭式解。因此，必须使用迭代方法。一种流行的迭代方法是随机梯度下降法（SGD）。`rustlearn`\
  \ 中实现了 SGD，要在 `rustlearn` 中实现模型训练，我们从 `linear_models` 模块调用 `Hyperparameter` 模块，并可以传递各种参数，例如学习率、L1\
  \ 和 L2 惩罚项，以及是进行多标签分类还是二分类（列表 2-35）。\n\n```\npub fn run() -> Result> {\n// fn 的前面部分\
  \ ..\nlet mut model = lr::new(4)\n.learning_rate(0.1).l2_penalty(0.5)\n.l1_penalty(0.0).one_vs_rest();\n\
  for _ in 0..100 { // 训练 100 个周期\nmodel.fit(&flower_x_train, &flower_y_train).unwrap();\n\
  let prediction = model.predict(&flower_x_test).unwrap();\nlet acc1 = accuracy_score(&flower_y_test,\
  \ &prediction);\nprintln!(\"逻辑回归：准确率：{:?}\", acc1);\nOk(())\n}\n列表 2-35\nchapter3/rustlearn_classification_tasks/src/logistic_reg.rs\n\
  ```\n\n在模型上运行 for 循环相当于对模型进行多个周期的训练。\n\n运行列表 2-35 中的模型应产生类似于列表 2-36 所示的输出。\n\n```\n\
  $ cargo run lr < ../datasets/iris.csv\n逻辑回归：准确率：0.36666667\n列表 2-36\nlogistic_reg.rs\
  \ 输出\n```\n\n\n\n### 2.8.3 决策树\n\n让我们尝试重新定义分类问题，并从不同的角度来理解它。在分类问题中，我们有一个包含 *n* 个观测值的训练样本，这些观测值对应一个取值为\
  \ 1, 2, ..., *k* 的类别变量 *Y*，以及 *p* 个预测变量 *X*[1], *X*[2], …, *X*[*p*]。其中 *x*[*m*]\
  \ 是节点 *m* 中的训练数据。我们的目标是找到一个模型，用于预测新 X 值对应的 Y 值。我们可以将这个问题简单地视为将 X 空间划分为 *k* 个不相交的集合\
  \ *A*[1], *A*[2], …, *A*[*k*]，使得如果 *X* 属于 *A*[*j*]，则 Y 的预测值为 j，其中 *j* = 1, 2, ...,\
  \ *k*。分类树就采用了这种方法。它们通过每次递归地划分一个 *X* 变量来生成矩形集合 *A*[*j*]。这使得这些集合更易于解释。树结构的一个关键优势是它适用于任意数量的变量。\n\
  \n其核心思想如下：\n\n1.  通过前向选择生长一棵过大的树。在每一步中，找到最佳分割点。持续生长，直到所有终端节点满足以下任一条件：\n    1.  数据点数量\
  \ < *n*，\n    2.  节点中的所有数据点具有相同的结果。如果发生这种情况，则该节点被称为“纯节点”。\n\n2.  对树进行剪枝，创建一个嵌套的树序列，其复杂度逐渐降低。\n\
  \n在 `rustlearn` 中实现决策树可以使用清单 2-37 所示的代码。它支持针对稠密和稀疏数据的 CART 算法，并使用基尼不纯度减少量 [4] 来选择特征。\n\
  \n```\nuse rustlearn::trees::decision_tree;\npub fn run() -> Result> {\n// 数据加载和转换部分...\n\
  // 类似于上面的逻辑回归部分...\nlet mut decision_tree_model = decision_tree::Hyperparameters::new(\n\
  flower_x_train.cols()).one_vs_rest();\ndecision_tree_model.fit(&flower_x_train,\
  \ &flower_y_train).unwrap();\nlet prediction = decision_tree_model.predict(\n&flower_x_test).unwrap();\n\
  let acc = accuracy_score(\n&flower_y_test, &prediction);\nprintln!(\"DecisionTree\
  \ model accuracy: {:?}\", acc);\nOk(())\n}\n清单 2-37\nchapter3/rustlearn_classification_tasks/src/trees.rs\n\
  ```\n\n运行上述代码应产生类似于清单 2-38 所示的输出。\n\n```\n$ cargo run trees < ../datasets/iris.csv\n\
  Finished dev [unoptimized + debuginfo] target(s) in 0.03s\nRunning `target/debug/rustlearn_classification_tasks\
  \ trees`\nDecisionTree model accuracy: 0.96666664\n清单 2-38\nchapter3/rustlearn_classification_tasks/src/trees.rs\
  \ 输出\n```\n\n### 2.8.4 随机森林\n\n决策树的一个改进是随机森林。在这种情况下，会生长一组树，并在它们之间进行投票以获取最受欢迎的类别。这些树是树预测器的组合，每棵树都依赖于一个随机向量的值，该向量是独立采样的，并且对于森林中的所有树具有相同的分布。随着森林中树木数量的增加，森林的泛化能力会收敛到一个极限\
  \ [4]。\n\n要在 `rustlearn` 中实现随机森林，我们需要将之前的决策树变量及其参数传递给随机森林的 `hyperparameter` 模块，以便构建一组树（清单\
  \ 2-39）。\n\n```\nuse rustlearn::ensemble::random_forest::Hyperparameters as rf;\n\
  pub fn run() -> Result> {\n// 函数的前面部分...\nlet mut tree_params = decision_tree::Hyperparameters::new(\n\
  flower_x_train.cols());\ntree_params.min_samples_split(10)\n.max_features(4);\n\
  let mut model = randomforest::new(\ntree_params, 10).one_vs_rest();\nmodel.fit(&flower_x_train,\n\
  &flower_y_train).unwrap();\nlet prediction = random_forest_model\n.predict(&flower_x_test).unwrap();\n\
  let acc = accuracy_score(\n&flower_y_test, &prediction);\nprintln!(\"Random Forest:\
  \ accuracy: {:?}\", acc);\nOk(())\n}\n清单 2-39\nchapter3/rustlearn_classification_tasks/src/trees.rs\n\
  ```\n\n在这个例子中，上述代码位于决策树代码的下方，因此在输出中我们将看到两个代码的结果（清单 2-40）。\n\n```\n$ cargo run trees\
  \ < ../datasets/iris.csv\nFinished dev [unoptimized + debuginfo] target(s) in 0.03s\n\
  Running `target/debug/rustlearn_classification_tasks trees`\nDecisionTree model\
  \ accuracy: 1.0\nRandom Forest: accuracy: 1.0\n清单 2-40\nchapter3/rustlearn_classification_tasks/src/trees.rs\
  \ 输出\n```\n\n### 注意\n\n请注意，当我们刚开始使用逻辑回归和其他更简单的算法时，准确率相当低，大约在 30% 左右；但随着我们逐步使用基于树的模型，准确率已经达到了\
  \ 95-100%。请记住，这些都是玩具数据集，之所以选择它们，是因为它们众所周知、简单，并且本书的重点是展示 Rust 在机器学习方面的能力。在现实世界的问题中，要警惕这样的准确率水平。\n\
  \n\n\n### 2.8.5 XGBoost\n\n为了在使用决策树构建优秀分类模型时表现更佳，一种思路是集成一系列弱学习器，并将其转化为强分类器。XGBoost\
  \ 代表极端梯度提升（Extreme Gradient Boosting），让我们逐一解析这些术语。在提升方法中，决策树是顺序构建的，每棵后续树都旨在减少前一棵树的误差。每棵树都从前面的树中学习并更新残差。因此，序列中接下来学习的树将基于更新后的残差版本进行学习。这最终产生了非常强大的分类器\
  \ [5]。\n\n与随机森林（其中决策树生长到最大程度）相反，提升方法使用的是分裂次数较少的树。这种深度不大的小树具有很高的可解释性。交叉验证是提升方法中的一个重要步骤，因为它用于寻找最优参数，例如树的数量（或迭代次数）、梯度提升的学习速率以及树的深度。\n\
  \n**参数** 在运行 XGBoost 之前，我们必须设置三种类型的参数：通用参数、提升器参数和任务参数 [6]。\n\n在本例中，我们将使用 `rust-xgboost`\
  \ 库，而不是 `rustlearn`。^(⁶) 完整代码保存在 `iris_classification_xgboost` 包中，供参考。该库是对 XGBoost\
  \ 库的一个封装。^(⁷)\n\n在本例中，我们需要使用 `xgboost = \"0.1.4\"`，这是对 `XGBoost-v0.82` 的一个封装。在 `main.rs`\
  \ 中，我们将调用相关模块（清单 2-41）。\n\n```\nuse xgboost;\nuse xgboost::{parameters, DMatrix,\
  \ Booster};\nListing 2-41\nchapter3/iris_classification_xgboost/src/main.rs\n```\n\
  \n其他的数据预处理步骤与我们之前在鸢尾花数据集逻辑回归部分使用的相同。一旦创建了向量 `flower_x_train`、`flower_y_train`、`flower_x_test`\
  \ 和 `flower_y_test`，我们需要将它们转换为 XGBoost 兼容的向量。`x` 向量被转换为 `DMatrix`，并设置相应的标签（清单 2-42）。\n\
  \n```\nfn read_csv() -> Result> {\n// 之前的数据加载和分割代码 ...\nlet mut dtrain = DMatrix::from_dense(&flower_x_train,\
  \ train_size).unwrap();\ndtrain.set_labels(&flower_y_train).unwrap();\nlet mut dtest\
  \ = DMatrix::from_dense(&flower_x_test, test_size).unwrap();\ndtest.set_labels(&flower_y_test).unwrap();\n\
  // 代码的剩余部分 ...\nListing 2-42\nchapter3/iris_classification_xgboost/src/main.rs\n\
  ```\n\n现在我们将设置 XGBoost 参数。首先，由于标签数量超过两个，目标函数将设置为多标签 Softmax。然后，我们将设置基于树的模型参数。这些参数用于配置提升器（清单\
  \ 2-43）。\n\n```\nfn read_csv() -> Result> {\n// 函数的前面部分 ..\nlet lps = parameters::learning::LearningTaskParametersBuilder::default()\n\
  .objective(parameters::learning::Objective::MultiSoftmax(3))\n.build().unwrap();\n\
  let tps = parameters::tree::TreeBoosterParametersBuilder::default()\n.max_depth(2).eta(1.0)\n\
  .build().unwrap();\nlet bst_parms = parameters::BoosterParametersBuilder::default()\n\
  .booster_type(parameters::BoosterType::Tree(tps))\n.learning_params(learning_params)\n\
  .verbose(true).build().unwrap();\n// 函数的剩余部分 ...\nListing 2-43\nchapter3/iris_classification_xgboost/src/main.rs\n\
  ```\n\n之后，我们将指定哪些矩阵用于训练，哪些用于测试。这些信息将被传递给一个配置对象，该对象将在训练过程中使用（清单 2-44）。\n\n```\nfn\
  \ read_csv() -> Result> {\n// 之前的代码 ...\nlet ev = &[(&dtrain, \"train\"), (&dtest,\
  \ \"test\")];\nlet params = parameters::TrainingParametersBuilder::default()\n.dtrain(&dtrain).boost_rounds(2)\n\
  .booster_params(bst_parms)\n.evaluation_sets(Some(ev))\n.build().unwrap();\nlet\
  \ booster = Booster::train(&params).unwrap();\n// 剩余的代码 ...\nListing 2-44\nchapter3/iris_classification_xgboost/src/main.rs\n\
  ```\n\n现在可以进行预测并与实际值进行比较（清单 2-45）。\n\n```\nfn read_csv() -> Result> {\n// 之前的代码\
  \ ...\nlet preds = booster.predict(&dtest).unwrap();\nlet labels = dtest.get_labels().unwrap();\n\
  // 计算准确率\nlet mut hits = 0;\nlet mut correct_hits = 0;\nfor (predicted, actual)\
  \ in preds.iter().zip(labels.iter()) {\nif predicted == actual {\ncorrect_hits +=\
  \ 1;\n}\nhits += 1;\n}\nassert_eq!(hits, preds.len());\nprintln!(\"accuracy={} ({}/{}\
  \ correct)\",\ncorrect_hits as f32 / hits as f32, correct_hits, preds.len());\n\
  }\nListing 2-45\nchapter3/iris_classification_xgboost/src/main.rs\n```\n\n上述代码的输出应与以下内容类似，准确率大约在\
  \ 93–96% 之间（清单 2-46）。\n\n```\n$ cd chapter2/iris_classification_xgboost\n$ cargo\
  \ run < ../datasets/iris.csv\nFinished dev [unoptimized + debuginfo] target(s) in\
  \ 0.05s\nRunning `target/debug/iris_classification_xgboost`\n[08:26:11] DANGER AHEAD:\
  \ You have manually specified `updater` parameter. The `tree_method` parameter will\
  \ be ignored. Incorrect sequence of updaters will produce undefined behavior. For\
  \ common uses, we recommend using `tree_method` parameter instead.\n[08:26:11] src/tree/updater_prune.cc:74:\
  \ tree pruning end, 1 roots, 2 extra nodes, 0 pruned nodes, max_depth=1\n[08:26:11]\
  \ src/tree/updater_prune.cc:74: tree pruning end, 1 roots, 4 extra nodes, 0 pruned\
  \ nodes, max_depth=2\nListing 2-46\nchapter3/iris_classification_xgboost/src/main.rs\n\
  ```\n\n```\n[08:26:11] src/tree/updater_prune.cc:74: tree pruning end, 1 roots,\
