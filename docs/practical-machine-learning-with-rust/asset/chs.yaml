  ## 3.5 测试无监督模型


  评估无监督模型的性能很困难，因为没有标签来比较最终得分。一种方法是通过内部指标，例如轮廓系数，其旨在形式化地实现高簇内相似性；即一个簇内的点应彼此接近，并具有低簇间相似性，这意味着两个簇中点之间的相似性应该很低。但内部标准上的高分不一定能转化为应用中的良好效果。另一种方法是在目标应用中进行直接评估。例如，一个实现搜索功能的网站可以测量用户在使用不同聚类算法时找到答案所花费的时间，并通过
  Beta 测试来比较这两种算法。这是最直接的评估方式，但成本高昂，尤其是在需要进行大规模用户研究的情况下。


  第三种方法是使用用户判断的替代指标，在这种情况下，我们使用一组类别并自行创建一个黄金标准。黄金标准最好由具有较高评判者间一致性的评审员生成。然后，我们可以计算一个外部标准，以评估聚类与黄金标准类别的匹配程度。在本节中，将介绍两种外部标准的度量方法，并附有代码。


  **兰德指数** 兰德指数通过考虑所有样本对，并统计在预测聚类和真实聚类中被分配到相同或不同簇的对数，来计算两个聚类之间的相似性度量。兰德指数最常见的公式关注由
  ![$$ \left(\begin{array}{l}n\\ {}k\end{array}\right) $$](img/482357_1_En_3_Chapter_TeX_IEq1.png)
  个元素对给出的以下四组不同排列：*N*[11] 是在两种聚类中都被分到同一簇的元素对数量，*N*[10] 是被 *A* 分到同一簇但被 *B* 分到不同簇的元素对数量，*N*[01]
  是被 *B* 分到同一簇但被 *A* 分到不同簇的元素对数量，*N*[00] 是被 *A* 和 *B* 都分到不同簇的元素对数量。注意，*N*[11] 和 *N*[00]
  是聚类 *A* 和 *B* 之间一致性的指标，而 *N*[10] 和 *N*[01] 则是不一致性的指标。


  表 3-1


  列联表


  | ![../images/482357_1_En_3_Chapter/482357_1_En_3_Figa_HTML.gif](img/482357_1_En_3_Figa_HTML.gif)
  |


  列联表如表 3-1 所示。因此，兰德指数由以下函数给出：


  ![$$ RI\;\left(A,B\right)=\frac{N_{11}+{N}_{00}}{\left(\begin{array}{l}n\\ {}k\end{array}\right)}
  $$](img/482357_1_En_3_Chapter_TeX_Equ2.png)


  (2)


  上述指数的值介于 0 和 1 之间，其中 1 表示聚类结果完全相同，0 表示聚类结果之间没有共享任何一对元素。


  兰德指数已在 `ml-utils` 中实现（列表 3-10）。


  ```

  pub fn rand_index(clusters1: &[HashSet],

  clusters2: &[HashSet]) -> f64 {

  let (n11, n10, n01, n00) = count_pairwise_cooccurence(

  clusters1, clusters2);

  (n11 + n00) / (n11 + n10 + n01 + n00)

  }

