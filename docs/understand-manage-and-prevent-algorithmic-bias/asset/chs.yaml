- '# 9. 算法的稳定性偏差


  在我们对人类认知偏差的回顾中，*稳定性偏差*占据了显著位置。事实证明，人类并非孤例：算法也常常表现出稳定性偏差。在本章中，我们将回顾最重要的几种偏差，并探讨什么样的背景属性会助长它们。


  我们首先将审视问题的根本原因，即系统不稳定性——没有它，就不会产生有害的稳定性偏差。之后，我们将讨论一个概念上的困境：几乎不可能教会算法那些数据中不存在的东西，并且我们将探讨缓慢的响应速度如何严重削弱算法通过快速学习克服稳定性偏差的能力。最后，我们将探讨稳定性偏差的另一个维度——即将结果定义为好或坏。




  ## 系统不稳定性


  对于任何给定的样本，算法在设计上都是无偏的（你可能还记得第 1 章中关于 BLUE 的概念）。但如果情况发生变化会发生什么？算法的一个基本局限性在于，它们隐含地假设样本中存在的任何关系在未来也将持续存在——正如人类的稳定性偏见也根植于每个人主观的历史经验中。


  当然，现实是不断变化的。虽然有些变化是结构性的（例如，印刷术和电力的发明、工业化以及互联网和智能手机推动的许多流程数字化，都深刻改变了经济、社会和我们生活的结构），但其他变化则更具周期性。例如，经济会经历反复的扩张和衰退周期。


  如果我们考察算法在多大程度上能够处理甚至预测其决策所依据的现实环境中的此类变化，我们有时会发现，算法错过了了解此类变化对结果影响的机会，要么是因为样本遗漏了某些类型的实例（即数据表中缺少了某些“行”），要么是因为预测变量（即数据表中的“列”）不充分。


  一般来说，样本应包含未来可能与算法相关的各种环境。因此，对于商业周期等周期性现象，样本尤其应涵盖扩张期和衰退期。这通常意味着样本应覆盖相当长的时间段。例如，如果你假设（或者更好的是，基于历史
  GDP 增长数据，将其确立为事实）典型的商业周期为七年，那么你至少需要考虑七年的数据来训练算法（理想情况下应远多于七年，因为在其他条件相同的情况下，如果模型见过两到三个完整的商业周期，它会更加稳定）。


  为什么这很重要？我们经常观察到，某些关系会因我们在特定周期中所处的阶段而异。例如，银行观察到，在衰退期间，公司的流动性水平作为违约风险的预测指标尤为重要。当银行分析公司的资产负债表时，通常会计算几个衡量流动性的比率（例如，*速动比率*是通过将现金以及一年内将变为或可能变为现金的其他资产（如短期投资和当前应收账款）相加，然后除以公司的总流动负债得出的）。


  如果一个算法完全是在扩张期（高增长、违约率下降、银行通常积极尝试增加贷款）开发的，它会给这些流动性比率分配相对较低的权重——事实上，一些流动性比率甚至可能变得不显著并从算法中消失。这样的算法在衰退期间将严重偏颇且不适用，因为收入下降且银行通常限制贷款，这两种效应都可能导致许多公司出现流动性危机。而在衰退数据上开发的算法通常会赋予流动性比率较高的权重，并且在扩张期不显著的比率现在很可能成为算法中高度显著且重要的因素。


  相比之下，如果样本同时包含衰退和扩张数据，算法不仅会了解到许多流动性比率可能很重要，还可能弄清楚*何时*重要——例如，它可能会根据最近一个季度观察到的 GDP
  增长，增加某些比率的权重或“开启”它们。


  但如果出现结构性断裂，未来算法将面临过去从未发生过、因此永远无法纳入开发样本的情况，会发生什么？嗯，这取决于具体情况。具体来说，这取决于过去是否至少能让算法学习到如何根据环境变化调整估计值的相关（即方向正确的）规则。


  打个比方，考虑一个电子计算器。可能从来没有人计算过 8,368,703,007,682,335,001 的平方根。尽管如此，仍然可以在计算器中编程一个通用规则来正确计算这个数字的平方根（例如，牛顿-拉夫逊法）。相比之下，在负数被发明之前，人们没有这样的概念，因此即使石器时代就有计算器，人们也无法为计算器编程来处理负数。


  现实世界中的许多变化是渐进的。例如，一家汽车保险公司不断面临新车型。当新车型的首批车主为汽车保险单询价时，保险公司没有历史数据来估计这款新车型的事故发生率或典型维修费用。这使得那些基于特定车型历史数据定价保险单的保险公司措手不及——对于新车型，他们几乎需要凭空捏出报价，或者根据一款已存在一段时间的“类似”车型进行主观定价。


  然而，一位深思熟虑的数据科学家可以通过收集每个车型的工程属性及其他*解释*损失情况的属性来克服这个问题。例如，当我在一个新兴市场为汽车保险构建定价模型时，我与一组机械师坐下来讨论，了解在该国驱动维修成本的因素——并了解到，在劳动力廉价的情况下，维修成本的最大驱动因素是汽车制造商是否提供本地生产的（因此便宜）备件，还是备件必须进口（因此极其昂贵）。同样，我与汽车工程师坐下来，确定了一些影响汽车事故倾向性的工程变量（例如，某些特别重的部件的位置会影响汽车翻车的可能性）。


  通过将这些工程变量以及一个指示国内生产备件可用性的标志添加到我的样本中，我可以开发出一个算法，即使对于从未在该国销售过的汽车，也能合理地定价保险。相比之下，那些仅使用特定车型历史损失率作为预测变量的竞争对手保险公司的算法，如果新车型的设计与同一品牌以前的车型在结构上存在差异，或者制造商推出了一款备件必须进口的高端车型，而历史上它只销售过有本地生产备件可用的经济型汽车，那么这些算法就会产生偏差（即系统性偏离）。


  当然，这种方法有其局限性——如果出现全新的技术，所有赌注都失效了。我的样本中没有包含任何电动汽车，因此我的算法对燃油发动机存在无可救药的偏见，我怀疑它对电动汽车能否产生非常准确的预测。认识到某些结构性断裂会使算法对过去产生如此大的偏见，以至于变得无法使用，这一点至关重要。




  ## “我早就告诉过你”


  应对结构性断裂的一个根本挑战在于，算法拒绝学习数据中不存在的内容。假设你是一位天赋异禀的数据科学家，在 2007-2008 年全球金融危机爆发前一年，你就怀疑房价下跌会导致抵押贷款违约率激增。自然，你会尝试扩大样本期，将包含房价下跌的时期纳入其中。然而，你所在的银行只有
  2000 年以来的数据——而在 2000 年至 2006 年期间，房价只有一个方向：上涨。


  这是一个真正的困境。如果你在模型中加入“房价最新变化”这个变量，而样本中没有任何房价下跌时期的数据，那么该变量很可能会被算法以“不显著”为由断然拒绝。即使该变量最终进入了你的方程，你也有理由预期存在某些非线性关系，并且提供不同（正）房价增长率年份的数据，并不能让算法正确学习如何预测房价下跌的情况。


  你能做什么？你会发现自己陷入了进退两难的境地：


  *   你可以回溯更早的历史。20 世纪 80 年代初和 90 年代，美国都曾出现过房价下跌。然而，即使能从雇主地下室里积满灰尘的纸质文件中找回一些当年未偿还抵押贷款的数据，但近年来才有的、并在你的算法中占据重要地位的许多属性将无法获取，因而缺失。这种系统性的数据缺失可能会严重干扰你的算法。


  *   绝望之下，你也可以考虑创建合成数据。你可以先从样本中复制粘贴某些实例，然后手动覆盖部分数值，以虚构一个假设的房价下跌时期的数据。这不仅是一种高度推测性的方法，会严重受到你自身偏见的影响，而且你也难以正确调整其他属性（例如，房主信用报告中的信用卡逾期记录）；结果，你的算法很可能存在重大缺陷和偏见。


  换句话说，没有好的方法可以将样本扩展到包含那些在现有历史中根本未曾发生过的预期情景。


  ## 响应速度


  如果用于开发算法的历史数据无法帮助预测未来的周期性或结构性变化，机器学习还有一张王牌：它可以快速学习。假设昨天出版了两本新书：一本是本书，另一本是 500 页的史诗巨著，讲述
  50 代老鼠与路易十四共享凡尔赛宫的故事。你最喜欢的在线书商的推荐引擎现在需要决定，向购买玛塞拉·哈赞的《经典意大利烹饪书》（自 1976 年以来的畅销书）的买家推荐哪本书。它怎么会知道呢？鉴于这两本书都是前所未有的文学成就，与以往任何作品都不同，因此无法预测哪本书更有可能被购买。


  机器学习提供了一个简单的解决方案：它允许你快速学习。今天，两本书上架的第一天，你可以简单地随机展示其中一本书的推荐，收集哪些客户点击了推荐并最终购买的数据。机器学习的速度足以在一夜之间更新推荐算法，因此从明天开始，推荐引擎将正确预测几乎所有读者都更喜欢我的书（除了那三个*真的*对老鼠情有独钟、已经购买了
  30 多本关于老鼠的书的人）。


  这种快速学习的能力是算法的一项重大创新，得益于机器学习的出现、灵活的 IT 系统以及能够实时记录用户行为的数字渠道。它可以大大减少稳定性偏差，因为在结构性断裂发生的那一刻，算法就可以开始学习结果如何变化，从而调整预测。


  不幸的是，这种快速更新从而消除偏差的能力取决于一个条件：响应必须迅速显现。网站推荐引擎的响应速度极快：如果网页现在显示一个推荐，那么在接下来的几秒钟内，你点击与否就会变得显而易见。即使在更传统的营销中，通过一种称为邮政服务的古老方法寄出实体信件，根据经验法则，购买响应通常可以在
  2-4 周内预期得到。


  然而，其他情况则面临非常长的响应周期。例如，如果你开发一个信用申请评分模型，根据产品（如信用卡 vs. 个人贷款）和市场不同，通常需要 9 到 18 个月才能看到大部分违约。这意味着你的算法至少要滞后
  9-18 个月才能了解到结构性断裂（例如，房价突然下跌）。对于某些抵押贷款，我们甚至看到违约在发放后 3-5 年才激增（这通常是由某些税收优惠到期引起的，因此税收制度的变化会显著改变抵押贷款的违约模式）。而当你想要探索婴儿饮食中的特定食物如何影响老年患阿尔茨海默病的倾向时，你需要等待
  60 到 90 年才能让你的响应变量显现出来。


  这意味着，预测响应速度缓慢的过程结果的算法无法轻易自我修正，因此特别容易受到稳定性偏差的影响，从而对管理和预防偏差构成了特殊的挑战。




  ## 定义“好”时的稳定性偏差


  在之前的讨论中，我们探讨了预测变量（例如，根据公司资产负债表得出的一组流动性比率）与结果（例如，标记公司是否拖欠银行贷款的“好/坏”指标）之间的关系如何随时间变化。在任何预测问题中，另一个可能随时间变化的方面是“好”与“坏”的定义。


  人类在定义好与坏时，往往采取相当整体且流动的视角。例如，在定义“美食”时，人们不仅会考虑味道、口感、温度和摆盘等多个维度，还会持续更新他们所考虑的因素种类（例如，最近“健康性”可能会发挥作用，比如，在阅读了一篇关于欧米伽-3
  脂肪酸的文章后，某种食物中是否含有这种成分，可能至少会暂时被提升为一个关键要求）。


  相比之下，算法会选择唯一定义明确的目标。例如，一个搜索优化算法可能会将用户点击了某个特定链接定义为“好”，并坚持这个定义——即使对人类来说，算法对“好”的定义明显不充分（例如，如果某个特定链接导致许多用户点击，但大多数人立即返回，那么很明显，这个链接并没有将用户带到他们想去的地方）。


  当这种算法最初被设计时，数据科学家可能评估了多个潜在的指标，并发现点击率与更难以衡量的结果（例如，用户参与某件事的时长，或用户对链接内容有用性的主观评价）高度相关（即是一个很好的代理指标）。然而，一旦算法开始引导用户流量，世界就可能发生了变化。例如，营销人员可能已经弄清楚了如何让算法推广他们的链接，而垃圾邮件发送者可能已经找到了利用页面误导性标题来欺骗系统的方法。结果，点击率成为了衡量内容质量越来越差的代理指标——但在一个经典的稳定性偏差案例中，算法会继续优化点击率，直到数据科学家重新审视算法本身的目标函数（即好/坏的定义）。


  ## 总结


  在本章中，你回顾了算法固有的稳定性偏差。最重要的要点是：


  *   稳定性偏差是算法工作方式固有的。它们被设计用来根据历史数据，制定关于我们周围世界可观察属性与特定结果之间关系的规则，并将这些规则应用于未来。

  *   因此，如果我们周围的世界发生周期性或结构性变化，算法就可能被带偏（并产生有害的偏差）。

  *   *周期性*变化会导致算法产生偏差，如果开发样本覆盖的时间跨度不够长（特别是没有覆盖至少 1-2 个完整周期）。

  *   世界的*结构性*变化可能使算法变得无用，如果旧规则不再适用；但如果变化是渐进的，并且可以关联到与结果保持稳定关系的底层因素（元数据），那么这些变化可以被算法内化。

  *   每当预见到未来某种情况，而历史上又没有可比较的数据时，统计模型开发的机制使得将这种预见嵌入算法变得极其困难——实际上，通常是不可能的。

  *   快速更新算法（特别是通过机器学习实现）是算法克服其稳定性偏差的有效方法，但这只有在决策的响应也能快速实现时才可能（即，结果可以在几秒或几天内观察到，而不是几个月或几年）。

  *   当算法预测的结果仅仅是一个更整体、更复杂概念（例如，某种更高层次的“好”与“坏”的定义）的代理指标时，该特定代理指标与算法用户最终目标之间的关系可能会发生变化；因此，算法在其好与坏的定义上也可能遭受稳定性偏差。


  到目前为止，我们已经将所有讨论过的算法偏差追溯到了提供给算法的数据限制或数据科学家做出的其他选择。在下一章中，你将发现算法更“淘气”的一面：算法自身凭空创造出的新偏差。


  '
- '# 10. 算法自身引入的偏差


  在之前的讨论中，你将算法视为中立、以事实为驱动，并积极追求去偏决策的目标。所回顾的各类算法偏差都源于算法外部，例如现实世界中的偏差或数据不足。在本章中，我们将更深入地探讨算法的工作原理，并发现算法“随机地”引入新偏差的情况，这些偏差表现为对特定实例特征的偏见。这在很大程度上可以被视为噪声，但偶尔，这种算法偏差可能会因算法使用环境的放大、强化甚至煽动而变得不成比例。


  我们首先会更深入地审视算法错误，以及样本量和案例频率如何影响算法的工作。然后，我们将更深入地探讨这些问题如何在基于树的建模方法中（许多机器学习模型背后都采用这种方法）以特别严重的方式显现出来。最后，我们将从更哲学的角度讨论这一切的含义。




  ## 算法误差


  人类习惯于做出二元预测，例如“今天会下雨！”或“别雇她；我觉得她无法胜任这项工作。”或“我们买那个吧，它看起来很好吃！”。相比之下，算法则生活在一个概率世界中：它们会说“83%的降雨概率”、“该候选人在入职
  12 个月后被评为良好或优秀的概率为 12%”，或者“你喜欢这款蛋糕的概率为 98%”。事实上，尽管许多算法旨在预测二元结果（今天会不会下雨，是或否？），但由于其构建方式，许多典型算法在数学上无法为任何事件分配
  0 或 1 的概率；它只能介于 0.000……1%（可能还有更多个 0）和 99.999%（可能还有更多个 9）之间。


  当算法被用于决策时，总会有一个决策规则说明“如果估计概率大于 x，则执行此操作”或“如果小于 y，则执行此操作”。因此，每一个是/否决策都隐含着算法在说：“顺便提一下，我的预测有非零概率是错误的；可能不会下雨，这位大学辍学的申请者会成为超级明星，而你会讨厌那块加了辣椒和培根的巧克力海绵蛋糕。”


  这引出了一个有趣的难题：就像一个律师在他所有的陈述中都巧妙地加上免责声明一样，我们永远无法指着某个特定的预测去指责算法出错；算法总会抬起手指，冷静地指出它已经明确指出了其预测出错的概率。事实上，算法在评估一个它完全不了解的情况时，其默认方法是分配总体不良率。换句话说，如果你拥有的数据显示你所在位置平均每年有
  183 天降雨，一个毫无头绪的算法会巧妙地给出 50%的降雨概率。


  因此，证明算法出错的唯一方法是考虑一整组实例，并展示“好”与“坏”结果的数量与算法预测存在显著偏差。例如，如果我们有 1000 名呼叫中心客服，算法预测他们达到最低绩效水平的概率低于
  10%，但我们仍然雇佣了他们（也许是因为我们不小心误读了算法的输出——真实案例：我有几个客户因为意外地做了与算法建议相反的事情，后来才注意到错误，从而偶然发现了算法的性能问题），并且如果我们发现其中
  870 人（即 1000 名客服中的 87%！）不仅达到了最低绩效目标，而且作为一个群体，其表现超过了其他 75%的呼叫中心客服，那么我们就可以论证该算法存在显著偏差，因此是垃圾算法。


  因此，确定算法的输出是否正确是一场数字游戏，这引出了样本量和案例频率的问题，我们将在下一节中讨论。


  ## 样本量与案例频率的作用


  模型开发的核心在于过拟合（从随机模式中解读出规则）与缺乏粒度（忽略特定子群体结果的变异性）之间的张力。让我们用一个例子来探讨这个问题：一个搜索广告优化算法，其任务是估算特定用户点击手杖广告的可能性。更具体地说，假设展示广告的网页所有者知道用户的年龄，因此你现在需要考虑将年龄作为一个预测变量。


  你凭直觉知道孩子很少使用手杖，因此一定存在某个年龄界限，超过这个界限后手杖的使用率会显著上升。你也可以假设，在某个阶段，人们可能患有严重的疾病，以至于他们更可能需要助行器或根本无法行走，因此手杖的使用率可能会从某个年龄开始再次下降。


  如果你拥有全美国人口的数据，那么从 0 岁到至少 80 岁，每个年龄都有超过一百万个数据点。^(³¹) 你不仅可以计算每个年龄点击手杖广告的可能性，而且有足够的数据进一步细分，分别考察男性和女性；或者，如果你相信占星术，可以比较双鱼座与水瓶座使用手杖的倾向。你甚至可以将数据按年龄精确到天（这比按年划分细化了
  365.25 倍），以揭示人们是否更倾向于在生日前一天寻找手杖。


  然而，不幸的是，你通常拥有的数据要少得多。假设你有一个小样本，只有三位 95 岁的人。他们中没有人使用手杖。这是否意味着 95 岁的人使用手杖的概率为零？不，很可能这三位是例外。你根本无法判断在一千名
  95 岁的人中，是没有人、有 100 人、还是有 997 人拥有手杖。换句话说，你遇到了样本量太小而无法做出具有统计显著性的推断的情况。这是试图开发优秀算法的数据科学家每天都要面对的宿命。那么，你能做什么呢？


  算法的默认解决方案是将你那三位宝贵的 95 岁老人与其他但相似的案例合并。也许有两位 96 岁的老人，五位 94 岁的老人，以及一大群 90-93 岁的人。因此，算法可能会创建一个
  90 岁以上或 90-99 岁的人群组。你需要多大的群体才能做出具有统计显著性的推断？这取决于你所研究现象的频率。如果该年龄组中有 20%的人使用手杖，统计方法（这里我们使用调整后的
  Wald 方法）表明，在 95%的置信水平下，你预计在 100 人的样本中会发现 13 到 29 名手杖使用者，因此一个小样本至少能给你一个粗略的概念（但你测量到的倾向可能会有
  5-10 个百分点的偏差）。如果你正在研究一种发病率仅为万分之一罕见疾病，那么在 100 人的样本中，你找到哪怕一个病例的机会当然微乎其微。




  这对你的算法意味着什么？你的算法能够正确评估特定人群（例如 95 岁老人）的概率，取决于样本量越大、二元结果的平均倾向越接近 50%，以及这类特定人群出现得越频繁（即使你拥有全美人口的数据，114
  岁的人可能也只有一两个）。你离理想情况越远（即样本量越小，样本中好坏或是否结果的比例越不平衡，以及你所考虑的特定实例越罕见），你的算法就越有压力将这些案例与许多其他不同的实例混为一谈。


  这种聚合问题对于分类变量来说尤为棘手。将 95 岁和 96 岁的人合并似乎情有可原，但像“其他”这样的职业类别呢？想象一下，有人培育出了一种能产油的细菌，并在网上小批量卖给那些想实现碳中和的露营者。考虑到营销、包装和运输构成了他大部分成本，他算农民、能源行业的创业者，还是更像一个零售交易商？


  其含义是，不常见、非典型的案例很可能与其他同样不常见且非典型的案例（可能相似，也可能完全不相似）被归为一类。结果，模型会产生一种偏差，即一个可能无关的参考群体的行为被投射到这些罕见案例上。例如，如果银行的信用评分模型将我们的生态露营油制造商视为农民，而在该市场中，由于政府补贴和价格管制，农民通常风险较低，那么模型可能会严重低估这种新兴小众业务的风险。


  ## 基于树的模型的问题


  算法有多种结构，每种结构自然都有其自身的优缺点。在第 3 章中，你看到了一个线性模型的例子。这种模型结构的一个优势是它能高效利用现有数据：对于每个输入因子 x，整个样本的数据都被用来估计参数β，并且在估计某个特定实例的结果时，所有输入因子都会被考虑。因此，这类模型在遇到罕见特征时，通常仍能相对较好地做出公正判断。在银行评估我们那位细菌衍生露营油销售商的贷款申请的例子中，评分卡可能会结合三个输入：行业风险指数、流动性比率和企业年龄。即使行业风险被低估，评分卡仍可能因其流动性不足和经营历史短而对该企业扣分。


  还有一类不同的建模方法，它们使用数据的方式要浪费得多：基于树的方法，例如决策树和随机森林（可能由一百个或更多决策树组成的集成模型）。这些方法变得越来越重要，因为它们比特征的线性组合灵活得多，并且是许多机器学习技术的核心。


  决策树是一种分类方法，它将总体不断划分为越来越小的子集，最终每个子集旨在成为一个相当同质的群体，开发样本中观察到的平均结果对该群体具有代表性。在我们的信用评分示例中，决策树考虑的第一个因素可能是行业。它可能根据行业创建三个宽泛的公司群体：农业、制造业和“其他”（如服务业）。对于制造业，它可能在第二步将公司分为高流动性和低流动性公司；在第三步，低流动性公司可能再根据其经营历史长短进行划分。


  然而，对于农业，决策树可能遵循不同的逻辑。例如，在第二层，它可能将拥有土地和房地产的农业经营与租赁土地的农业经营分开；拥有土地的公司可能进一步分为作物生产、畜牧生产和“其他”业务（这可能将我们基于细菌的油生产商和观赏鱼生产商等奇怪的组合混在一起）。


  问题在于样本被字面意义上地分割了。如果你的样本从 10,000 家公司开始，也许有 800 家在农业部门。其中，500 家拥有自己的土地，包括你的细菌基油制造商。这
  500 家然后被分成 230 家作物生产商、240 家畜牧生产商，以及仅 30 家符合“其他”标准的公司。如此小的群体已经超出了算法计算有意义违约率的能力（事实上，根据所有经验法则，样本量是不足的，因为对于许多中小企业投资组合，坏账率在
  2-5%的范围内）。并且，要再根据任何其他标准（如流动性比率或公司年龄）进一步划分几乎是不可能的。


  换句话说，这里发生的情况如下：


  *   我们的公司被与一小群其他不寻常的公司混为一谈，这些公司可能与我们的公司具有可比性，也可能完全不具可比性。

  *   由于这个群体中只有非常少的公司，并且基于树的建模方法对数据点如此浪费和渴求，决策树没有足够的数据来根据其他预测风险的因素（如流动性和企业年龄）进一步区分这个群体。

  *   我们的公司被分配了其所在群体的平均违约率，这可能是也可能不是对该特定公司风险的合理估计。


  现在，说决策树完全是随机的并不正确。上面的决策树确实尝试利用了元数据（例如，数据科学家提供了我们的公司可以被视为农业企业的信息），并且分组反映了因变量，所以如果我们的细菌基油生产商最终违约了，算法会倾向于将其与其他高风险公司分组；而如果表现良好，决策树会尝试将其与低风险公司分组。然而，仅仅一个这样的公司实际上并不允许对这类公司的典型风险得出任何可推广的见解，并且由于结果告知了罕见案例的分组，基于树的模型容易受到一种称为*过拟合*的错误分类的影响。如果这些罕见实例仅仅因为它们有相同的结果（例如，它们都违约了或都没有违约）而被归为一组，那么模型在样本上会表现得非常好，但在预测未来结果时很可能表现糟糕，因为其背后缺乏稳健的逻辑。




  ## 哲学视角


  本章主要讨论了因可用数据量不足，无法对这类事件的本质进行任何统计上有效推断时，所导致的罕见案例误分类问题。其结果是，算法会产生“偏见”，因为它要么将一个或多或少不相关的参考类别的表现投射到此类事件上，要么将这些罕见案例的结果（即因变量的值）泛化到所有类似案例中。


  一方面，可以认为这并非一个大问题：


  *   根据定义，这些案例本身就是罕见的例外。如果此类案例更多，数据的权重会促使算法正确估计这类情况的结果（即无偏见）。


  *   要“证明”算法有误甚至并非易事。算法确实隐含地为其错误分配了非零概率，并且在没有额外数据（扩大样本量）的情况下，通常根据定义，数据不足以“证明”估计概率与算法的估计值存在显著差异。


  另一方面，也可以对此提出两个严重问题：


  *   当算法给出某个估计值（例如，某个重罪犯的累犯率为 83%）时，它并未表明与该估计值相关的不确定性程度。可能样本中有数千个几乎相同的案例，并且预测是在 99%置信区间（+/-
  1%）下做出的，因此如果你有 1000 个这样的重罪犯，算法会以生命打赌，其中 820 到 840 人（这就是 83% +/- 1%的含义）会再次犯罪；或者，这个重罪犯可能是一个非常特殊的案例，83%的估计值是算法将少数几个同样古怪的家伙混在一起后得到的随机结果。因此，可以认为，如果一个整体预测能力很强的算法，在那些更好的答案可能是“我不知道”的案例上给出估计值，那么它的行为就有点欺骗性。


  *   算法的随机预测如果影响了阻碍矛盾数据点产生的决策，就可能变成自我实现的预言。例如，如果一个决定研究生录取的算法随机产生了对女性工程师的偏见，并因此阻止任何女性申请人攻读工程学位，那么就永远不会有数据来证明该算法是错误的。


  在我看来，这个问题的严重性是一个伦理问题，取决于算法的目的。一个为你那古怪公寓楼日常垂直通勤挑选个性化电梯音乐的算法，如果对约翰尼·卡什产生了不合理的偏见，也不太可能造成太大伤害；而一个驱动着对人们生活有实质性影响的决策的算法，则可能造成严重伤害。我们将在第
  13 章更详细地探讨特定偏见严重性这个问题；现在，请记住，误分类是每个算法的本质，但对于不寻常的事件，存在更大的风险得到完全错误的估计，这可能会对受影响的事件造成严重伤害。


  ## 总结


  本章讨论了当样本不足以训练算法充分评估某些罕见事件特征时，随机产生的算法偏见。你特别了解到：


  *   算法的每一个估计都带有一定的错误概率。


  *   虽然对于典型案例（样本中有许多相似事件），算法设计上至少平均而言是正确的，但对于罕见（不寻常）案例，存在特别的风险，即得到完全错误的估计，甚至平均而言也不正确。


  *   这是因为算法要么将不寻常的事件与其他可能完全无关的参考群体混为一谈，要么从非常小且因此统计上不显著的事件数量中推断结果（即所谓的过拟合）。


  *   这种偏见更可能发生在小样本量时，更准确地说，是当样本相对于样本中的多样性较小时。如果只有几十种不同类型的事件，5 万个样本可以算大；但如果存在数百万种不同类型，它就很小了。


  *   如果建模技术是数据饥渴型的，例如对数据利用效率极低的基于树的方法，样本量的问题会加剧。


  *   虽然根据定义，这个问题只会影响罕见类型的事件，但如果偏见的影响很严重，或者受影响的事件类型仅在样本中罕见，但在算法应用到的总体人群中更为常见，那么这种偏见仍然应该引起用户的担忧。


  到目前为止，所回顾的所有偏见都是静态的，即数据科学家设计模型、收集数据并估计模型，然后模型表现出某些偏见。在本部分书的最后一章中，我们最终将深入探讨社交媒体这个特别具有挑战性的世界，在那里，偏见通过算法和用户之间的互动动态发展。


