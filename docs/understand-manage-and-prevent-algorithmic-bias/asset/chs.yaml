- "# 18. 数据科学家在克服算法偏见中的角色\n\n正如我们在算法偏见世界中的旅程所示，数据科学家正面临一项艰巨的挑战：古老的社会实践与偏见、企业主、用户、顽皮的数据集，以及数据科学家疲惫的大脑，都可能共同导致算法偏见的产生。与此同时，数据科学家也拥有大量能力，通过深思熟虑的建模选择来遏制算法偏见。在本书的最后部分，我们将以更深入、更技术性的细节，讨论数据科学家遏制算法偏见的最重要技术。为了避免造成不切实际的期望，请允许我强调：算法偏见并非单一的敌人，而是一整支对抗大军——构建模型的感觉可能就像穿越丛林，你需要抵御从蚊子到毒蛇和凶猛老虎的一切。因此，遗憾的是，没有银弹，只有一堂生存课和一份推荐必备物品（如驱蚊剂和砍刀）的打包清单。\n\
  \n在本章中，我们将重新审视第 4 章中介绍的模型开发过程，并为具有偏见意识的数据科学家指出具体的步骤和工具。下一章将深入探讨评估数据中是否潜藏任何隐藏偏见的技术。考虑到机器学习既可以是朋友也可以是敌人，第\
  \ 20 章将讨论机器学习何时是敌人，应被更手动化的技术取代；而第 21 章则讨论机器学习如何成为你的朋友，并帮助进行算法去偏。第 22 章将在更技术性的层面上重新审视自我改进的机器学习模型问题，第\
  \ 23 章则从治理角度出发，讨论如何将这里讨论的技术嵌入到一个拥有众多数据科学家、你无法亲自逐一指导和监督的大型组织中。\n\n## 第一步：模型设计\n\n\
  在模型设计中，我特别推荐三种做法来对抗偏见：\n\n1.  从一线获取真实世界的洞察！如果你正在为家族经营的杂货店建模信用违约，请与评估他们的信贷员、在分行向他们推销信贷的销售人员、追讨他们未偿贷款的催收员，以及一家向这些店主推销令人难以抗拒的不健康糖果的著名意大利公司的销售代表交谈。如果你正在为汽车保险理赔建模，请与警察谈论汽车盗窃案，与车身修理厂的机械师谈论维修成本，并向德国或瑞典汽车俱乐部的成员（他们进行所谓的*麋鹿测试*，定义于国际标准\
  \ ISO 3888-2）询问当司机急转弯躲避跳到路上的毛茸茸野兽时车辆侧翻的情况。\n\n2.  考虑你当前可用的数据是否可能受到现实世界偏见的污染，以及如何最好地解决这个问题。也许你可以找到外部数据来纠正偏见（例如，在许多市场，对于被拒绝的贷款申请，可以从征信机构购买数据进行所谓的拒绝推断，即根据客户在其他银行的行为推断如果贷款获批会发生什么），或者你可能必须推动专门的数据生成工作（例如，涉及随机选择案例的实验）来从头创建无偏见的数据。\n\
  \n3.  确保整体业务设计能够防止致命的反馈循环。\n\n我再怎么强调与“外面”每天处理现实生活的一线人员交谈的必要性也不为过。他们的见解非常宝贵，尤其有助于避免因遗漏真正的预测因素（同时包含引发偏见的无关因素）而产生的偏见，并有助于为因变量（即你将建模的结果，例如什么是好什么是坏）推导出一个能预先防范偏见的定义。一线人员还能告诉你过去可能使数据产生偏见的历史事件（影响特定时间段和/或地点的创伤性事件），并为你提供顶层基准（例如你所建模人群的总数，或人均平均消费等关键比率），你可以用这些基准来检查你的样本是否看起来完整且与现实一致。^(⁵⁷)\n\
  \n与一线人员交谈时，要仔细考虑哪些问题更容易或更不容易引发带有偏见的回答。例如，对于信贷员来说，正确判断哪些公司属性通常使一家公司“更盈利”要比判断什么使其“更可能违约”容易得多。他见过几十家盈利和不盈利的公司（因此有扎实的经验基础来观察区分属性），而违约可能性低与高之间的差异可能仅为每\
  \ 100 家公司中相差 3 家，因此对于许多属性，信贷员极不可能观察到足够多的案例来进行统计上有效的评估；相反，他的回答很可能锚定在几次创伤性经历上（例如，如果一家美国银行只有一家德国公司作为客户，而这家公司在一场引人注目的倒闭中违约，给信贷员带来了许多令人不快的质询，^(⁵⁸)\
  \ 那么当被问及什么标志着高风险公司时，他的杏仁核极有可能让他脱口而出“德国人！”）。\n\n\n\n我还想强调，认真思考现有数据是否存在偏差（例如，回想一下我们海关检查的例子）至关重要，并且在必要时，应竭力推动创建新的、无偏差的数据，而不是使用垃圾数据。说得更具体些，当我面试数据科学家时，拒绝候选人的最常见原因就是他或她忽略了我的案例研究中涉及有偏差的数据（尽管我给出了明显的提示）。而推动收集新的、无偏差的数据之所以非常困难，有三个原因：这通常意味着业务方设定的截止日期将无法达成，这需要投入（资金和管理时间），并且决策者天生倾向于最小化短期痛苦（即避免错过截止日期或向老板申请投资），而非长期痛苦（即受困于有偏差的算法）。克服这种偏见的最佳方法是让决策者想象一下，一年后他必须为自己辩护，因为他委托开发的新算法完全无用，而他的老板因为未能解决问题而要解雇他。\n\
  \n为了说明问题的严重性，让我回顾一下一家亚洲银行的命运，该银行建立了一个新的消费贷款承销统计模型。该模型是使用该银行已发放的贷款数据构建的——没有人提醒统计学家，历史上分行员工曾将他们认为有风险的客户打发走（例如，其中一个高风险群体是警察——在这个市场中，他们自认为凌驾于法律之上，因此往往不偿还金融债务）。新模型上线后，分行员工被要求将所有申请都通过新系统处理，令他们高兴（可能也惊讶）的是，大多数“高风险”客户都获得了批准（例如，警察）。结果是信贷损失大幅增加——新模型造成了数百万美元的损失。这家银行避免这种命运的唯一方法是，至少针对一个样本（例如，在两周内几家分行收到的所有申请），记录每一个“上门”的客户（包括申请中提供的所有信息）以及一线员工的做法（是打发走客户还是继续处理申请）。\n\
  \n最后，对潜在反馈循环的考虑提醒我们，算法本身并非目的——我们构建和使用它们是为了实现更高层次的业务目标，而业务方所要求的算法及其使用方式可能适合也可能不适合实现其目标。在这里，我们的机会和职责是成为思想伙伴，引导业务方设计更好的业务流程，并帮助定义单个或整套算法在支持此流程中的适当角色和设计。\n\
  \n模型设计中的第四个考虑因素是在存在潜在偏差的情况下选择建模技术。我们将在第 20 章详细讨论这个主题。\n\n## 第二步：数据工程\n\n在第 4 章中，我们讨论了数据工程的五个步骤，对于每个步骤，我想指出一种防止算法偏差的做法：\n\
  \n*   对**样本定义**保持警惕——对于我构建的几乎每个模型，我发现样本定义是最具挑战性的任务，因为它包含了许多可能导致偏差的陷阱。我特别担心 (1) *分层*（即，如何在成本和时间的预算限制下，为特定画像获取足够数量的案例），(2)\
  \ 覆盖哪些*时间段*，以及 (3) 实现稳健模型所需的总体*样本量*（考虑到我假设具有不同行为的子分组的数量和规模、某些稀有属性的频率以及我打算使用的建模技术）。所有这些决策通常需要创造性思维来最小化成本（例如，我最终可能会创建一个模块化结构，对单一昂贵的数据源使用较小的样本，而对所有其他数据源使用更大的样本），并且可能需要申请更大的预算（例如，为了购买更大样本的外部数据）。\n\
  \n*   **数据收集**：对可能无意中排除/遗漏某些画像的查询或手动流程保持高度警惕——这既可能是由于技术问题（例如，对于某个海外分行，某些数据的离线上传可能延迟，这解释了为什么从数据档案中提取的年终快照可能排除该分行的案例），也可能是由于概念性问题（例如，在许多情况下存在幸存者偏差）。例如，当你向银行索要所有违约账户的列表时，你很有可能会遗漏案例。我遇到过一些银行，它们从\
  \ IT 系统中清除了已核销（即未偿还）的账户；在与客户同意重组贷款时（即使银行遭受损失），从系统中移除了违约标志；或者报告称，对于违约客户，包含关键贷款信息的纸质文件“丢失”，因为文件已被物理转移到其清收部门。同样，SQL\
  \ 查询很容易存在微小的概念性缺陷，导致它们遗漏某些画像（或错误分类、重复或混淆它们）。再次强调，解决所有这些问题的关键通常在于一线：向高级会计师和催收部门的后台员工询问贷款可能“变坏”的无数种方式，并获取有用的基准（例如，去年财务报表中该组合的信贷损失总额），以评估你的数据集是否完整。\n\
  \n*   当将样本**分割**为开发样本、测试样本和验证样本时，要仔细选择时间段，尤其要注意结果变量的截断表现窗口和预测变量的截断数据历史，这是两个导致概念偏差的强大来源。\n\
  \n*   **数据质量**对于避免偏差至关重要，因此我将下一整章专门用于讨论这个主题。\n\n\n\n*   在**数据聚合**中，通过仔细检查几个测试用例（尤其是异常情况）来测试概念上的合理性。一个典型问题的例子是具有\
  \ 1:n（即一对多）关系的数据元素——例如，银行可能会在信用局的报告中找到一位客户的多笔贷款；医生查询患者家族癌症史时，可能会遇到多个兄弟姐妹、叔叔等；海关检查员查询托运人历史时，可能会发现过去的多批货物。你如何汇总这些信息？对于高风险标记，通常的默认选择是“最差”标准（例如，“任何（或曾经）逾期\
  \ 90 天”）。然而，这引入了一种针对“多产”的微妙偏见：如果你有幸拥有一个极其庞大的家族，几代人都以拥有两位数的孩子数量为荣，那么在同等条件下，你在家族史中发现一例癌症病例的可能性，要比你的祖先都是独生子女政策的狂热拥护者大得多！因此，在一个评估癌症可能性的算法中，变量“家族中最差癌症状况”可能会造成一种偏见，即如果个体来自一个非常大的家族，则会高估其患癌概率；如果家族规模很大，则会低估。同时，一个比率（家族成员患癌百分比）同样具有误导性——如果你回想一下之前关于显著性的讨论，你会记得，5\
  \ 人中有 0 例远不如 500 人中有 0 例有意义。在这种情况下，最好的方法是创建两个聚合变量——患癌的家族成员数量和未患癌的数量——并在特征开发过程中根据这些值创建更复杂的衍生特征（我们将在下一步中处理这个问题）。\n\
  \n综上所述，数据工程中的这五个子步骤可以消除数据中的许多偏见——但某些偏见在此阶段仍可能存留，需要在模型组装中加以捕捉。\n\n## 第 3 步：模型组装\n\
  \n在模型组装中，我们在第 4 章中区分了七个步骤。在每个步骤中，数据科学家都可以采取具体措施来控制偏见。然而，许多偏见——以及应对它们的适当方法——都极度依赖于具体情境；因此，我所能做的最好的事情就是在每个步骤中，从概念层面指出应该针对哪些类型的偏见，并通过示例说明这在现实生活中可能是什么样子。我强烈建议你在每个步骤中思考如何尽可能多地获取情境信息，以及应该与谁合作，集思广益，探讨潜在的偏见及其消除方法；希望接下来的讨论能清楚地表明，没有大量这样的讨论，就不可能控制算法偏见！\n\
