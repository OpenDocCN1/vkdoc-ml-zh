  \ |\n| 3. | 模型组装 |\n| 3.1 | 在概念层面上，哪些记录应该被排除，为什么？每次排除是如何执行的（特别是在识别相关记录方面）？ |\n|\
  \ 3.2.1 | 你预期会驱动结果的哪些特征在数据中缺失？你使用了哪些代理变量？ |\n| 3.2.2 | 哪些设计原则指导了特征的定义（例如，在归一化方面）？\
  \ |\n| 3.2.3 | 哪些特征已被编码？哪些潜在特征被省略了，为什么？ |\n| 3.3.1 | 特征是如何筛选出来的？ |\n| 3.3.2 | 哪些特征被列入模型估计的候选名单？\
  \ |\n| 3.4.1 | 你考虑了哪些建模技术，最终选择了哪一种（或几种）？ |\n| 3.4.2 | 你如何为所选建模技术设置超参数？ |\n| 3.5.1\
  \ | 初始模型的测试在稳定性和偏见方面产生了什么结果？ |\n| 3.5.2 | 模型在调优过程中是如何演变的？ |\n| 3.6.1 | 哪些考虑因素影响了你的校准方法？\
  \ |\n| 3.6.2 | 你为校准选择了哪些假设和方法？ |\n| 3.6.3 | 对于哪些子群体，模型输出需要某种形式的限定（例如，用“未知”替换估计值）？\
  \ |\n| 4. | 模型实施 |\n| 4.1 | 在模型实施中可能出现哪些导致模型输出有偏见的问题？ |\n| 4.2 | 对于模型实施，你希望提出哪些建议，以确保模型正常运行，并且仅应用于安全且胜任的场景？\
  \ |\n| 4.3 | 你推荐采用什么测试程序来确保模型被正确实施？ |\n| 4.4 | 在模型的持续使用过程中，随着时间的推移可能会出现哪些偏见？ |\n\
  | 4.5 | 你推荐采用什么持续监控机制来识别此类偏见和其他性能问题？ |\n| 4.6 | 必须采取哪些措施（例如，定期进行随机实验），以确保未来有用于挑战和改进模型的无偏见数据？\
  \ |\n\n\n\n*   **排除记录**：样本中哪些类型的记录会误导算法的统计开发？信贷申请就是一个很好的例子，因为其中可能多达四种（甚至更多）的误导性情况：\n\
  \    *   **非实质性违约**（即小额欠款）通常由信贷问题以外的原因导致，如上文所述。\n\n*   **身份欺诈**案件具有误导性，因为申请人的资料与实际情况无关，损失是由于银行身份验证失败造成的（因此，一个冒充他人、拥有良好风险状况的罪犯能够以他人名义获得贷款）。\n\
  \n*   **不活跃账户**（例如，已注销或冻结的信用卡，或已获批但因客户取消购车而从未放款的汽车贷款）并不构成客户的实际还款义务（它们就像银行系统中的幽灵，从未有真实资金交付给客户），因此客户不可能违约。\n\
  \n*   **特殊细分领域**是指常规决策流程不适用的领域（例如，带有政府担保的开发贷款——在此情况下，银行的风险评估无关紧要，唯一的问题是申请是否符合政府要求）。\n\
  \n*   **特征开发**：在此，数据科学家应特别关注两个问题——遗漏和概念性误解。\n    *   你是否*遗漏*了重要的结果预测因子（尤其是前线人员建议的那些）？如果是，你现有的哪些特征可能与遗漏的特征相关？在相关特征无法很好地替代遗漏特征的情况下，这些特征是否会导致偏差？如果会，你如何才能收集到遗漏的特征，哪怕只是一个小样本？如果这完全不可能，开发有偏差的模型是否负责任？对输出结果进行何种覆盖处理有助于防止这种偏差造成损害？\n\
  \n*   并且，衍生特征在*所有*情况下是否都*概念合理*？例如，通过计算样本中两个输入变量的最小值和最大值的比率，你可能会遇到负值，这可能会破坏你计算出的比率。事实上，比率是看似简单的聚合操作却暗藏许多陷阱的绝佳例子。为了说明，让我们考虑一个用于评估公司健康状况的标准比率：杠杆率或债务股本比，通常定义为总债务除以股本。通常，数值越小越安全（10\
  \ 美元/100 美元=0.10，表示负债水平低于 50 美元/100 美元=0.50；相比之下，1000 万美元/1 亿美元也是 0.10，因为这只是一家规模更大的公司，但相对而言，其每单位股本的债务与较小的公司相同——使用比率正是因为它衡量结构而忽略规模）。然而，一些陷入困境的公司拥有负资产——它们的*债务*越大，问题就越严重，但债务与股本的比率却越小（对于无限大的债务，该比率趋近于负无穷）。此外，许多信贷分析师发现，衡量债务的更好指标是*净债务*，它从总债务中扣除所有现金及现金等价物（例如，国债）。如果一家公司的现金多于债务，净债务也可能变为负值。将负的净债务除以正的股本（一家极其健康的公司）也会得到负的比率值——因此，-0.5\
  \ 的比率可能代表一家非常糟糕的公司（大量债务和负资产），也可能代表一家非常安全的公司。如果后一种类型在样本中占主导地位，模型很容易对净债务股本比为负的公司产生正向偏差，并热情地批准一些风险极高的公司，从而给银行造成巨大损失。为了解决这个问题，你需要分别处理分母和分子为正、负或零值的所有不同组合。先进的机器学习技术通常能较好地处理这一点，但如果此类情况很少见，无意义的处理方式仍可能蒙混过关。或者，数据科学家需要创建一个复杂的新特征，仔细地将分母和分子的各种值域映射到一个连续的风险指数中（将负债务和正股本置于最安全区域，正常值域置于中间区域，将正债务但负股本的公司置于最高风险区域，等等）。\n\
  \n*   **筛选清单**：一旦你有了一个初步的特征筛选清单，你应该回到前线人员那里，获取关于任何特征是否可能导致偏差的反馈（例如，你可能认为拥有奢侈背包品牌是预测正面结果的绝佳特征，但一个火星人可能会告诉你，这会歧视火星人，因为大多数火星人认为，如果他们背着背包，在通过火车站和地铁站时会被泽塔双星警察频繁搜查，因此他们避免使用背包）。通常有机会用相关性高但问题较少的特征来替换有问题的特征。主成分分析是促进寻找替代方案的绝佳工具，而这个工作步骤是进行此类讨论的理想时机，因为较短的清单允许更深入的讨论（与可能包含数千个数据字段的初始数据收集相反），但你仍然拥有替换变量的所有自由度。\n\
  \n*   **模型估计**：在此，你应仔细检查超参数以避免过拟合——这是有害模型伪影的根源。\n\n\n\n*   **模型调优**：此时应执行我们在第 15\
  \ 章讨论过的全套分析，以检测初始模型中的偏差。我始终敦促我的数据科学家，通过绘制特征与（移动或类别平均后的）对数几率比（针对二元结果）或连续预测输出（若特征数量庞大，则至少绘制前\
  \ 10-20 个特征）的关系图，来*目视检查*最终模型中的所有特征——这是识别特征开发中问题的绝佳工具。此外，你可以针对几个你认为算法可能存在偏差的代表性案例（真实或人工创建的），*模拟*模型预测结果。举例来说，我曾服务的一家台湾银行的董事会成员曾向我施压，询问新模型是否会不公平地歧视企业家，我当时非常欣赏这种质疑。他举了一个例子：一位在美国拥有丰富专业经验的整形外科医生，在台湾开设了一家新诊所，并向该银行申请融资。我们为此创建了一个假设的整形外科医生申请，并欣慰地看到模型批准了该申请，尽管其风险评估值较高，但我们认为这充分反映了新业务所涉及的风险。\n\
  \n*   **校准**：此时你的注意力应转向两个问题：稳定性偏差和预测能力较差的子群体。为防止*稳定性偏差*，需探讨未来可能与采样期存在系统性差异的方式，以及中心趋势（例如，信贷组合的平均违约率）未来可能如何演变。为了防止算法对*模型预测能力较差的子群体*产生偏差，需决定在哪些情况下将模型输出重新标记为“未知”，而不是提供毫无把握的估计值。\n\
  \n*   **模型文档**：大多数数据科学家非常不喜欢这项任务；如果缺乏强有力的治理，有时甚至会跳过此步骤。部分挑战可能在于，撰写数十页文本所需的技能与建模截然不同，因此对数据科学家来说，这通常既不容易也不愉快。然而，更根本的原因是，它常被视为“附加值”低，且完全是为他人（尤其是通常也不受欢迎的正式验证人员）谋利。这非常可惜，因为如果设计得当，模型文档可以成为数据科学家构建更好模型和避免偏差的绝佳工具！为使模型文档实现这一目标，它必须满足两个要求：必须采用能引发有益反思的格式，并且必须“边做边写”，以便在撰写文档过程中产生的见解仍能触发对最近工作步骤的调整（一旦模型构建完成，数据科学家对采样的反思就几乎毫无用处了）。实现这一目标的一个好方法是将模型文档组织成问答格式；它基本上变成了数据科学家与一位虚构朋友之间的对话记录。在表\
  \ 18-1 中，我提供了此类模型文档的目录示例。\n\n看待表 18-1 中给出的模型文档模板的另一种方式是，将其视为一份针对算法偏差的检查清单。如果你渴望将本书中学到的所有技术融入日常工作，请养成在模型开发过程中逐一对照这份问卷的习惯——即使你不打算用它来记录模型。\n\
  \n## 步骤 4：模型验证\n\n在人类判断做出的重要决策中，遏制偏差的一个久经考验的做法是指定某人明确负责挑战决策者，这个角色有时被称为“魔鬼代言人”。甚至中世纪的国王也会雇佣专门的随从来挑战自己，并提供他们在审议中可能遗漏的新信息：这个小丑。在现代模型治理中，确保算法稳健性的挑战者角色通常通过一个称为模型验证的职能来正式化。不幸的是，中世纪小丑那种欢乐的本质不知何故已消失殆尽，这对有效的验证工作极为不利。\n\
  \n基于我们所学到的关于即使是数据科学家也会存在偏差（我也不例外——我倾向于到处看到偏差，甚至可能只是随机错误的地方！）以及各种微妙的偏差可能潜入算法的众多方式，对算法进行独立挑战的价值和重要性不应有任何疑问——事实上，我见过无数案例，其中模型验证揭示了关键的缺陷。\n\
  \n遗憾的是，在许多组织中——尤其是在那些法律通常强制要求进行模型验证且执行得特别严格的金融机构——模型验证已成为一把相当双刃剑，甚至可以说是功能失调。过度热心的验证职能可能使得新算法几乎不可能获得批准。\n\
  \n例如，我曾与一家银行合作，该银行多年来没有一个新模型通过验证。其中一个关键障碍是，当验证团队从头开始重建模型时（一直回溯到从源系统提取数据——鉴于我们讨论过的数据工程中存在的偏差风险，这本身是一项非常彻底且有价值的练习），它要求模型系数*完全*相同（可能比较小数点后\
  \ 8 位或 10 位的系数）。结果，数据中哪怕最微小的“污点”——比如数千个案例中有一个数字存在轻微笔误——都会导致模型验证失败。\n\n如果模型验证过于严格，可能会造成真正的损害。首先，一个较差的模型可能因为一个被过度放大的担忧而无法被新的、更优的模型取代。此外，我观察到，如果数据科学家过于害怕他们的模型验证失败，他们的行为会以无益的方式改变。他们可能变得不愿尝试创新方法，因为他们认为让模型通过验证的最简单方法是证明其方法与另一个先前已验证的模型完全相同；他们还可能试图掩盖数据或模型其他部分的弱点。\n\
  \n部分原因在于验证者角色的无益定位——从未有银行将其增长或盈利归功于模型验证者批准了优秀的新模型，但一旦模型出现故障或监管机构对模型提出质疑，验证者却不止一次受到指责。结果形成了一种文化，即验证者对于指出哪怕是最微小的问题以及拒绝签字（即使只有最轻微的担忧）有着不对称的利益。\n\
  \n设计建设性验证职能的几个核心原则：\n\n*   模型验证的结果不应是二元结果（批准或拒绝模型），而应是对模型风险的量化（例如，使用像绿灯/黄灯/红灯这样简单的交通灯系统，或者\
  \ 4-5 个等级）。\n\n*   除了绿灯和红灯之外的评级（即，只要模型存在一些非致命的问题或局限性），都应附带制定合理的用途限制（这可能包括监控特定指标，并在超过某些阈值时要求暂停模型，或者对财务下行风险进行限制，例如，一个不可靠的信用评分卡所能批准的最高贷款金额）。\n\
  \n\n\n*   验证者的评估体系应包含多项标准，在风险识别、风险防范与风险承担之间取得健康平衡。例如，平衡计分卡（能为每个维度具体描述五个不同的绩效等级）可评估验证者在识别模型局限性方面的独创性、所施加的模型限制与已识别模型风险的匹配程度，以及验证者在促进创新同时避免给机构带来不当风险方面的有效性。\n\
  \n在实践中，模型验证可以简单到指出模型结果明显存在偏差的某个片段，也可以复杂到构建一个挑战者模型（即从零开始构建的全新算法，可能使用不同的特征和建模技术），以评估手头数据是否也会支持关于某些类别档案应预期何种结果的完全不同的结论。而幽默感始终是一项财富，因为它甚至能为最敏锐的才智提供掩护！\n\
  \n## 第五步：模型实施\n\n在模型实施中，我想强调两个方面：\n\n*   **预测特征的实现** 是一个常被低估的挑战。通常，提取、清洗、聚合和转换算法输入数据所需的众多数据工程步骤是迭代构建的（例如，因为仅在模型调优过程中才发现第\
  \ 25 个数据质量问题，可能需要修正数据提取最开始的数据库查询）。因此，当模型完成后，数据科学家实际上很难整理出一套完整的指令。此外，生产系统（即算法将在实际环境中“运行”的\
  \ IT 环境）中使用的语言和工具通常与数据科学家在开发过程中使用的不同。因此，我鼓励每位数据科学家尽早（纯粹出于测试目的）在生产系统中实现算法的第一个版本（即用机器学习术语创建“管道”），并在模型设计之初就思考最终应使用哪些工具和技术，将数据工程和特征开发过程中开发的代码（例如，用\
  \ R、Python 或 SAS 编写的脚本）转化为满足实际使用要求（如响应速度或分散部署——甚至算法可能需要部署在移动设备上）的生产系统。不言而喻，实施后需要进行严格测试，以确保没有隐藏的偏差悄然潜入。\n\
  \n*   **持续生成新鲜、无偏差的数据** 以挑战和改进算法，最有可能通过自动化实现——例如，如果贷款审批决策系统每月自动随机选择 100 笔贷款（无论信用评分如何）予以批准（可能经过一些常识性筛选）。数据科学家不应将此视为模型文档结尾段落中一厢情愿的想法，而应将其视为模型实施工作的一部分，确保这种数据生成得以实现。想象一架新飞机——当它刚出厂时，就已经配备了“黑匣子”，用于记录数据，以便在发生事故时开发出更好的技术。\n\
  \n在模型实施和未来模型版本的数据生成中实现完整性，是抵御算法偏差的最后一道防线。\n\n## 总结\n\n在本章中，您重新审视了端到端的模型开发过程，并看到在每一步中，数据科学家都有特定的技术来遏制算法偏差。另一方面，如果数据科学家放松警惕，偏差随时可能潜入。以下是我们确定的对抗算法偏差的关键策略：\n\
  \n*   将领域知识和真实的前线洞察投入到您要建模的任何内容中，以告知您的假设：偏差可能潜伏在哪里，以及什么应驱动您建模的结果。\n\n*   如果您知道正确的做法是从头开始生成新的、无偏差的数据，就绝不要屈服于使用有偏差数据进行模型开发的诱惑——即使这意味着错过截止日期或只能使用小样本，从而采用比您期望的简单得多的建模技术。\n\
  \n*   了解您的算法将被部署的端到端业务流程，以及该流程可能如何损害您的算法。\n\n*   对构建良好样本保持偏执，特别要考虑分层需求、覆盖哪些时间段以及争取的最小样本量。\n\
  \n*   对数据收集方法的概念完整性同样保持偏执——使用基准（例如，预期总和或平均值）来双重检查是否无意中遗漏了任何案例。\n\n*   不要通过不恰当的聚合步骤破坏数据的概念合理性。\n\
  \n*   排除可能使模型产生偏差的误导性记录。\n\n*   警惕个别特征不会使算法产生偏差，因为它们要么是缺失特征的糟糕代理，要么在概念上有缺陷——尤其是在筛选出可控数量的特征后，您还应寻求一线从业者的帮助。\n\
  \n*   仔细设置超参数以避免过拟合，并彻底测试初始模型输出中需要在模型调优中解决的偏差。\n\n*   考虑模型校准中必要的调整，例如改变中心趋势以克服稳定性偏差，或用“未知”覆盖预测能力较低的模型输出片段。\n\
  \n*   系统性地使用模型文档作为执行机制，以“勾选”所有最佳实践的去偏差步骤。\n\n*   创建一个增值的模型验证功能，该功能专注于模型局限性*在多大程度上*损害输出，以及制定*补偿*算法偏差的使用限制，并*有动力*在促进创新和保护组织之间取得适当平衡。\n\
  \n*   在实施中，确保不仅算法及其输入特征的编码完美无缺，而且还要建立机制，为未来的模型重新开发工作生成无偏差的数据。\n\n如果您觉得这些要点多得记不住，您的直觉是对的——人类一次几乎记不住超过三到五个项目。所以为了简单起见，以下是本章的一句话总结：您应打印出（问答式）最佳实践模型文档目录（见表\
  \ 18-1），装裱起来，放在您的办公桌上，并从现在起为您构建的每个模型遵循其思路！\n\n在下一章中，我们将深入探讨数据工程，并更深入地讨论如何检测“新黄金”（对于朴实的人来说，那就是*数据*）中的偏差。\n\
  \n脚注 1   2\n\n\n\n"
- "# 19. 数据的 X 光检查\n\n在本章中，我们将深入探讨如何检测数据中算法偏见的根源。从前面的章节中应该已经清楚，我们面对的是多种不同的“敌人”；因此，我们需要扫描数据中各种类型的潜在问题，就像年度健康检查可能包含十多项检查血液、尿液和各种器官的程序一样。通过本章的建议，我的目标是让你通过六个相当简单高效的步骤，拥有“千眼千耳”。这些分析将生成一组“地图”，每张地图都试图用亮红色标出特定的关注区域，就像\
  \ X 光检查能显示骨折、器官破裂和吞下的餐具一样。这将使你能够审查所有重大异常，并（结合你的背景知识以及你在本书中学到的内容，尤其是前一章）判断是否有理由担忧，如果有，如何最好地避免算法偏见。\n\
  \n虽然我试图让这六个步骤尽可能系统化，但我需要强调这是一个迭代过程——尤其是当你拥有大量自变量时，你可能先对某些分析进行较为粗略的运行，如果某个变量被选为最终模型的候选者，你可能希望更详细地重新进行某些特定分析（例如，更深入地挖掘异常值或某些缺失值），尤其是当你基于专业知识的“偏见雷达”让你直觉感到可能有问题时。\n\
  \n事实上，对整个 X 光检查进行两次是有意义的——第一次是在你收到原始数据时，第二次是在你创建了所有衍生特征之后（例如，对更细粒度数据的聚合或复杂转换），因为你的特征生成工作可能引入了新的偏见根源。\n\
  \n在整个过程中，保持批判性思维至关重要。如果你陷入确认偏误，并假设警告信号是虚假效应（“哦，我的数据太稀疏/太旧/太新/噪声太大”）而将其解释掉，而不是在初始\
  \ X 光检查发出警告时试图寻找问题的进一步证据，那么最好的数据 X 光检查流程也毫无用处。\n\n## 步骤 1：样本级分析\n\n考虑到高效的分析方法，我们从五个样本级检查开始，这些检查能让你从“自上而下”的角度了解是否存在会导致算法偏见的广泛数据问题：\n\
  \n1.  **观测数量**（例如，贷款或客户数量）和**关键属性的总和**（例如，贷款金额）是否与外部基准（例如，银行管理信息系统中的投资组合统计数据）匹配？如果不匹配，你的样本看起来不完整。\n\
  \n2.  在关键字段（例如，好/坏指标或标识符）中，有多少百分比的记录存在**缺失值**？显而易见，*关键*的定义是这些字段不能接受任何缺失值。对于其他变量，我们将在步骤\
  \ 3 中以非常高效的方式检查缺失值。不过，你可能已经想先看一眼你预期最具预测性的“关键”特征，以检查缺失值比率是否在你预期的范围内。\n\n3.  在关键字段（例如，贷款金额）中，有多少百分比的记录存在**零值**？对于某些变量，零值和缺失值一样糟糕；对于其他变量，它可能是一个有效值（例如，已批准但从未发放的贷款的账户余额为零），但表明需要特殊处理（例如，排除该记录）。在此步骤中，还要查看具有一对多关系的单独表中相关记录的数量——例如，如果一笔贷款可以有多个（所谓的“共同”）借款人，并且你收到一个单独的数据表，每个借款人有一条记录，那么一笔没有关联借款人的“孤儿”贷款也会是一个问题。\n\
  \n4.  是否存在**重复项**？这听起来可能像新手错误，但查询中的小错误确实偶尔会返回重复项……\n\n5.  **平均结果**（即因变量/标签的平均值，例如信用评分数据集的样本坏账率）是否现实？\n\
  \n这些分析指出了数据中的缺陷，如果不加以解决，很可能会导致偏见；补救措施通常需要识别数据收集过程中的缺陷并重新进行，这让所有相关人员都“乐在其中”。\n\n\
  ## 步骤 2：数据泄露\n\n数据泄露指的是预测变量被事后信息（即只有在被预测的结果已知之后才可获得的信息）污染。一个明显的数据泄露案例是收集当前数据来预测历史事件（例如，如果我检索客户当前的信用报告来预测过去的违约，那么这些过去的违约显然会列在信用报告中）。然而，大多数数据泄露案例要微妙得多。例如，如果某个属性被认为是静态的，但在算法试图预测的特定事件中却被更新了，这种事后偏见就常常会溜进来。例如，贷款账户通常被分配到某个分行；如果中央清收部门被当作一个独立的分行，那么贷款的违约可能会系统性地触发贷款重新分配到清收部门，因此分行标识符现在就成了违约的完美指标。正是因为这些属性*被认为*是恒定的，它们往往没有得到妥善归档。\n\
  \n事后偏见也可能隐藏在缺失值中。例如，我记得有一家银行，违约贷款会从主账户系统中清除，因此仅存储在该系统中的属性的缺失值也成了近乎完美的违约预测指标。许多建模技术（尤其是机器学习）将“缺失”视为自变量的一个有效值，因此一个原本无关紧要的变量仅仅因为其是否缺失是一个高度预测性的指标，而在模型中获得很大权重的情况并不罕见。\n\
  \n我提出两种分析来捕捉数据泄露：\n\n1.  每个变量的**单变量预测能力**；异常高的预测能力通常几乎是泄露的确定指标。\n\n2.  测试每个变量的数据是否**随机缺失**。\n\
  \n\n\n### 衡量单个变量的单变量预测能力\n\n在评估单个变量的预测能力时，我会使用两到三个指标，因为我试图解决一个非对称问题：我担心如果只使用一种技术，而该技术恰好对某种预测变量的分布类型存在偏见（从而未能识别其高预测能力），我可能会遗漏问题；同时，我并不太担心误报（即错误地将一个实际上不存在数据泄露的变量标记为有问题——如果后续分析表明该变量没问题，我仍然可以使用它）。\n\
  \n对于连续型因变量（结果），我通常建议同时计算**皮尔逊积矩相关系数**和**斯皮尔曼秩相关系数**。*皮尔逊积矩相关系数*显然是标准的相关系数指标，但它可能受到异常值和偏态数据的影响（即，如果数据分布不遵循正态分布）。*斯皮尔曼秩相关系数*对这些影响不敏感，并且也适用于有序但非连续的数值（例如，字母数字等级或大学排名），但它可能会对具有相同或非常相似值的观测值簇产生干扰——在这些簇内，单个观测值的序列位置有时并非随机（例如，在数据表中，你仍可能发现按字母顺序排列的受试者残留痕迹），并且如果数据处理导致某些变量按相反方向排序（例如，从\
  \ Z 到 A 而非 A 到 Z），则斯皮尔曼相关系数的测量可能会出现偏差。判断何种相关系数水平属于“高得可疑”高度依赖于具体情境，并且应反映数据科学家在类似建模工作中的经验。\n\
  \n对于二元结果，我通常会同时考虑**基尼系数**和**信息价值（IV）**。\n\n我们在第 15 章中讨论过*基尼系数*；对于单变量基尼系数，我们将单个变量视为一个评分。这指出了两个重要的局限性：基尼系数仅适用于连续变量和有序变量（但不适用于分类变量），并且它假设每个变量与结果之间存在单调关系——如果一个高预测能力的变量与结果之间的关系呈完美的\
  \ U 形（例如，信用风险与年龄：非常年轻和非常年长的人通常风险较高，而处于“黄金年龄”的人风险最低，因为他们往往成熟、健康且就业能力强），那么基尼系数可能为零！\n\
  \n*信息价值*之所以流行，是因为它也能处理分类值和非单调关系，并且存在方便的经验法则用于解释：IV 值在 0.3 到 0.5 之间被认为是强预测能力，而弱预测变量仅能达到\
  \ 0.02 到 0.1 之间的 IV 值。高于 0.5 的值通常被认为是可疑的；较弱的数据泄露情况只能通过将当前变量的 IV 值与这类变量的典型 IV 值进行比较来检测（例如，虽然你预期信用评分的\
  \ IV 值为 0.3，但如果 CEO 的星座达到了同样的预测能力水平，你就会起疑）。^(⁵⁹) IV 的另一个好处是，其计算包含了一个称为*证据权重*的值，我们将在后续分析中也用到这个值。\n\
  \nIV 的复杂之处在于它需要进行分箱。例如，如果你有一个名为“收入”的变量，你首先需要定义有限数量的收入区间。计算要求每个分箱至少包含每种结果类型（例如，好与坏）的一个观测值。并且为了高效评估成百上千个变量，你通常需要完全自动化的处理——因此，IV\
  \ 通常仅基于四到五个分箱进行计算，从而对那些仅适用于样本中一小部分数据的指标存在偏见。\n\n### 评估缺失值是否随机\n\n对于连续型结果，我建议检验在某个变量缺失的观测值与不缺失的观测值之间，结果是否存在显著差异（参见第\
  \ 15 章以及关于 t 检验的讨论）。\n\n对于二元结果，存在几种等效的方法来检测缺失值是否传达了事后信息，特别是：\n\n*   针对一个虚拟变量的基尼系数或\
  \ IV，该变量在变量缺失时为 1，否则为 0。\n\n*   变量的 IV 差异，即一次将“缺失”视为单独的分箱来计算 IV，另一次则排除那些该变量值缺失的观测值（即仅测量非缺失情况下的\
  \ IV）。\n\n在所有这类指标中，事后偏差表现为“缺失”标签具有显著的预测能力。\n\n如果缺失值传达了事后信息，你需要决定是直接丢弃该变量，还是通过适当的缺失值插补来解决问题（例如，条件随机插补可以解决某些情况）。对于这个决策，我建议查看该变量*排除*缺失值后的单变量预测能力。如果该能力可以忽略不计，则该变量除了事后信息外别无他用，应予以丢弃；如果该能力仍然显著且值得数据科学家付出努力，则可以尝试进行处理。\n\
  \n\n\n## 第三步：通过两项分析理解数据结构\n\n作为数据科学家，你显然希望避免“只见树木不见森林”——检测偏差时也是如此。因此，我强烈推荐通过两项分析，以类似地图的、自上而下的简单视角来理解数据结构：\n\
  \n*   找出**具有相似缺失值结构的变量块**，为模型设计提供依据（例如，如果大量客户缺少征信局数据（可能涉及数百个变量），则采用模块化模型结构；如果重要变量在大量案例中*系统性*（即非随机地）无法以数字形式获取，则考虑手动数据收集）；\n\
  \n*   通过**主成分分析（PCA）** 消除冗余变量，使后续步骤能够精准聚焦。\n\n为了检测*缺失值结构*，你需要为每个变量创建一个镜像变量：该变量是一个二元指示符，若某条记录中该变量缺失则设为\
  \ 1，否则设为 0。例如，如果 40%的客户缺少征信局数据，而你的征信局记录包含 140 个变量，那么你需要创建 140 个指示变量，对于这 40%的样本全部显示为\
  \ 1，其余显示为 0（关键在于此时你还不知道这一点——一个小脚本会自动编码这些信息，帮助你发现这一规律）。\n\n通过查询这些指示变量的相关结构——通常一个包含双变量相关系数的简单表格既足够又最实用（更复杂的、能捕捉多重共线性的技术可能无法使用，因为它们无法处理完全相关的变量）——你可以识别出缺失指示符高度相关的变量块，这意味着它们往往同时缺失（因此很可能由同一根本原因导致）。\n\
  \n*主成分分析*在第 15 章中曾简要提及。根据我的经验，PCA 是开发算法时最强大的工具之一。尤其是在机器学习领域，普遍认为向算法中添加更多变量只会提升性能。其隐藏的弊端在于，如果你有数千个变量，你既没有时间也没有精力（在产生精神疲劳之前）去彻底检查每个变量是否存在任何偏差迹象。PCA\
  \ 可以将数千个变量简化为几十个，然后你可以对这些变量进行“深入挖掘”，开展更详细的分析（例如检测异常），包括数据可视化，以及实际与一线人员沟通，为你观察到的任何潜在偏差现象寻求解释。\n\
  \n上一步中 IV 的计算，是我推荐使用 PCA 方法的关键前提，原因有二。首先，为了运行 PCA，你需要先将分类变量转换为数值变量，并填补所有缺失值；IV 计算通过为每个观测值提供证据权重（WOE）（以该观测值所在分箱的\
  \ WOE 形式呈现——因此，如果你只有少数几个分箱，这显然常常是粗略的）来方便地完成这一转换。其次，IV 将驱动每个主成分内变量的优先级排序。^(⁶⁰)\n\n\
  为了回答“通过 PCA，哪些变量最值得关注（并纳入模型）”这一问题，我建议你遵循以下步骤：\n\n*   运行主成分分析，将截止标准设为特征值 = 2（标准经验法则）。\n\
  \n*   执行 Varimax 旋转，以使最大数量的变量与第一主成分对齐。\n\n*   对于每一行（每个原始变量为一行），计算最大*绝对*载荷因子，并将变量分配到对应的主成分。\n\
  \    *   如果最大绝对载荷 ≥ 0.5，则将该变量标记为属于具有该载荷的主成分。\n\n*   如果最大绝对载荷 < 0.5，则将该变量标记为属于“其他”。\n\
  \n*   按两级层次结构对变量排序：首先按变量所属的主成分编号（“其他”排在最后），然后按绝对因子载荷排序；这意味着你首先拥有与主成分#1（特征值最高）相关的所有变量，然后是第二主成分相关的变量，以此类推；在每个块内，变量按对主成分的代表性从高到低排序（因子载荷为+1.00\
  \ 或-1.00 表明该变量完美代表了该主成分；因子载荷的正负号对我们的分析无关紧要）。\n\n*   对于每个主成分，选择 IV 最高的变量（你的选择也可能反映填充率和实际考量，如实施便利性——通常第二或第三代表性的变量比最具代表性的变量更好）；在\
  \ IV 相等的情况下，优先选择因子载荷最高的变量。\n\n*   如果你选择的变量因子载荷在 0.5~0.8 之间，考虑为同一主成分再挑选一两个变量，前提是这些变量也具有高\
  \ IV，并且基于业务判断你认为这些变量可能包含其他已选变量尚未捕捉到的独特信息。\n\n*   最后，审查“其他”桶中的所有变量；这些变量在一定程度上被主成分近似，但如果你看到\
  \ IV 较高（> 0.3）的变量，你也可以将它们列入候选名单，特别是当业务判断表明该变量应被纳入模型，且尚未被其他已入选变量充分代表时。\n\n需要明确的是，这个过程远非确定或完美；它涉及大量关于是否选择某个变量的判断。事实上，这是一种粗放而务实的方法，旨在确认你的森林中有大量的冷杉、山毛榉和巨杉，这样你就可以先检查冷杉上是否有任何毒蛾幼虫（一种能迅速摧毁大片冷杉林的害虫），而不会过早纠结于样本中唯一一棵似乎有少量虫粪（可能表明存在桃树特有的害虫——桃蛀螟）的桃树。\n\
  \n我个人喜欢先用 PCA 筛选出的几十个变量构建一个模型，至少作为初始基准，因为这样我就可以真正专注于特征生成，从而有更多机会检测隐藏的偏差，而且只有这么多变量能让我与一线员工及其他专家进行深入讨论。我发现，这样构建的模型性能通常仅比使用所有原始变量的最复杂机器学习模型低\
  \ 1-2 个基尼点，并且由于其卓越的稳健性，它们往往在短时间内就开始超越那些复杂的机器学习模型（因为微小的结构变化开始暴露出黑箱机器学习模型中仍隐藏的、未被检测到的过拟合和其他偏差）。\n\
  \n然而，一旦你完成了数据 X 光检查，你就可以随意在后续模型开发中包含任意多的变量。PCA 这个工具非常类似于真正的 X 光（将三维身体简化为骨骼的黑白图像），仅此而已。如果对是否在后续建模工作中包含某个变量存有疑虑，你或许应该倾向于将其包含在内。\n\
  \n\n\n## 第四步：异常检测的两种分析\n\n在第 15 章中，我提到了一位好友最爱说的俏皮话：“什么是正常？”尽管这个问题具有相对性，但诚实地尝试识别数据中的异常——离群值、意料之外的值集中区域，以及其他偏差魔鬼的踪迹——仍然至关重要。\n\
  \n在接下来的部分中，我将提出一种手动异常检测方法和一种基于机器学习的异常检测方法。\n\n### 手动异常检测\n\n世界上最好的异常检测设备之一就坐在你的肩膀上：你的大脑。自古以来，动物通过扫描环境中任何偏离常态的事物来发现危险，人类的大脑也不例外。因此，我将分两步向大脑展示数据：此处展示数值输出，而在第六步中展示图表（这样大概能调动大脑的两个半球）。然而，由于精神疲劳，专注力至关重要——这就是为什么在上一步中，我们进行了主成分分析（PCA），以便在进入这一步之前，将变量数量精简到可控范围。表\
  \ 19-1 展示了我为分类变量（包括行业代码等数字代码）推荐的报告格式，而表 19-2 则展示了我建议为数值变量（可以是连续变量，或至少是序数变量，如排名）生成的输出格式。\n\
  \n表 19-1.\n\n分类变量输出模板\n\n| **<变量名称>** | <最频繁出现的值> | <% 的记录数> |\n| --- | --- | ---\
  \ |\n| 缺失值：<% 的记录数> | <第二频繁出现的值> | <% 的记录数> |\n| 类别数量：< # > | <第三频繁出现的值> | <% 的记录数>\
  \ |\n|   | <第四频繁出现的值> | <% 的记录数> |\n|   | <第五频繁出现的值> | <% 的记录数> |\n\n由于分类变量通常包含文本，我发现“报告”格式最为合适，尤其当某些标签较长时。这里每个变量占用五行。每个模块之间留一个空行，并采用良好的格式，确实能帮助大脑！查看它，标记（例如，用圆圈或感叹号）或记下任何自发的反应（例如，惊讶之处、下一步要调查什么，以及特征生成的思路），然后继续。如果你感到疲倦并且进展过快，就停下来休息一下（喝点咖啡，看看窗外的树木等自然景物，真的很有帮助！），然后重新审视之前可能被草率处理的那几个变量。\n\
  \n表 19-2.\n\n数值变量输出模板\n\n| 变量 | 缺失值 最小值 最大值 均值 中位数 众数 | 百分位数 第 1 第 2 第 5 第 10 第\
  \ 25 第 75 第 90 第 95 第 98 第 99 |\n| --- | --- | --- |\n| <变量 #1> | <%> |   |   |\n\
  | <变量 #2> | <%> |   |   |\n| <变量 #3> | <%> |   |   |\n| … |   |   |   |\n\n表 19-2\
  \ 是一个大表格，每个变量占一行。逐行浏览是可行的，但精神疲劳仍然是你的敌人。更好的策略是将其分解为五次运行：\n\n*   首先，按**缺失值**（观测值的百分比）从大到小排序——这样列表顶部就会显示所有缺失值比例高的变量，这可能暗示数据收集问题，或引发模型设计方面的疑问。\n\
  \n*   接下来，按**最小值**从小到大排序——你会首先看到负值，每个**负值**或**零值**不合理或至少引发疑问的变量，都会被转移到“待调查”的类别中。\n\
  \n*   第三，按**最大值**从大到小排序——同样，可能会有几个变量暴露出问题。\n\n*   然后，按**众数**排序，查看是否有任何变量的众数引发疑问——我之所以排序，是因为特定问题通常与特定值相关联。\n\
  \    *   零值有时是一种缺失值（排序会将所有零值情况集中在一起）。\n\n*   所有数字位都设为 9 的大数字（例如，工资 = 9999999）在旧式\
  \ IT 系统中常被用作缺失值指示符，至今仍存在于某些数据库中。\n\n*   连续变量的整数值（例如，工资 = 1000）通常是人为输入猜测值而非真实数字的明显迹象。\n\
  \n*   最后，快速浏览那些在前几步中尚未被标记为异常的其他变量。最小值、最大值、均值、中位数、众数以及百分位数都能让你了解分布情况——这合理吗？较低百分位数是否表明，拥有较小值的人口比例比你想象的要大得多（例如，你认为大多数人至少持有两张信用卡，而实际上他们只持有一张）？\n\
  \n如果此分析识别出以特定数字（例如，0 或 999）编码的缺失值，请考虑也针对这些类型的缺失值重新运行第三步，以便更好地理解它们的结构及其对偏差的影响。\n\n\
  \n\n### 基于机器学习的异常检测\n\n人工异常检测的一大优势在于，它能充分利用数据科学家的全部知识——例如，认识到支票账户可能出现负存款余额（即所谓的透支），但孩子的数量不可能为负。然而，它也存在诸多严重局限性——例如，对输出结果进行主观审查可能会遗漏重大问题，数据科学家通常只能手动审查一组优先变量，而且人工方法难以应对某些特定情况，尤其是时间序列数据（例如，随时间变化的使用模式），以及当多个变量的特定值组合起来才显得异常的情况（例如，在尝试对数字身份欺诈进行建模时，扫描的身份证显示申请人为女性，或者实时自拍的图像分析显示有胡须，这两者本身都不异常。然而，一个留着时髦胡须的申请人使用女性身份证的组合，则是一个极不寻常的事件，你可能需要深入调查这个案例以了解情况——这可能是一个手法拙劣的欺诈者，或者表明你数据库中身份证与图像文件的映射关系已损坏）。\n\
  \n机器学习技术在检测此类异常方面可以非常强大，因此我建议，除了对步骤 3 中识别出的最重要变量进行人工审查外，还应使用这些技术。然而，在推荐具体技术时，我则犹豫得多，原因有二：首先，不同的数据科学家有不同的专长领域，有些人可能非常擅长开发，比如，用神经网络识别异常的自编码器，而我合作过的其他数据科学家则对\
  \ k 近邻概念感到更得心应手。其次，其中一些技术比我在这本书中讨论的其他概念要年轻得多，因此仍有许多新的研究成果涌现，同时市场上也不断出现更强大的软件包来执行先进的机器学习算法以检测异常；因此，今天看来很棒的技术，明天可能就显得不那么理想了。\n\
  \n然而，对于刚开始探索这些技术的数据科学家，我推荐一个使用相对熟悉概念的三步法：\n\n*   首先，使用你偏好的标准（例如，平均轮廓系数，^(⁶¹) 这是一种可以自动评估的指标）来确定聚类数量，然后对样本中的观测值进行\
  \ k-means 聚类。\n*   接着，测量每个观测值到任意聚类中心的最小马氏距离 ^(⁶²)。\n*   最后，先按最近的聚类排序观测值，再按到该聚类的距离（从大到小）排序，以便人工审查异常案例。\n\
  \n聚类可以识别出“相似”的观测值组（簇）。相似性通过彼此之间的距离来衡量，每个变量作为一个维度上的距离度量。这意味着三个重要事项：\n\n*   每个变量必须是数值型的；为此，你可以再次使用步骤\
  \ 2（数据泄露）中将分类值和缺失值映射为证据权重的方法。\n*   至关重要的是，对于现实世界中的每个“维度”，聚类中只能使用一个变量，否则该维度会因每个相关变量而获得额外权重——k-means\
  \ 聚类中的一个典型错误是，许多变量都衡量“规模”，结果聚类过程得出了一个令人惊讶的发现：存在小、中、大三种情况；因此，主成分分析（PCA）是一个关键前提。\n\
  *   由于每个聚类代表了一大类案例，你应该预期一线人员熟悉这类情况；因此，在与专家和现实生活中的其他人讨论数据时，你可以从每个聚类的中心选取一个或少数几个案例（即那些距离*最短*的案例），来说明你所区分并用于定义“正常”的案例*原型*。\n\
  \n对于时间序列数据，可以采用类似的方法，只不过你可以选择将样本定义为一个时间窗口（就像移动平均计算一样）。虽然异常值会是时间序列中远离聚类中心的单个数据点，但如果一个观测单元（例如，记录背后的人）随着时间的推移越来越远离聚类，则会出现另一种类型的问题。\n\
  \n当你从“最怪异”的案例开始，逐步审查那些远离任何聚类中心的案例时，自然会遇到何时停止的问题。如果你审查了一个聚类中最远的三到五个案例，但没有发现任何问题，你可能会得出结论，至少没有压倒性的证据表明存在有害的异常值；每当你发现一个问题时，看看是否能识别出具有相同问题的其他观测值，并考虑在继续调查之前将它们全部搁置一旁，以便在短时间内最大限度地识别出*不同*类型的问题。并且请注意，评估一个案例是否正常，可能需要将其发送给一线专家。\n\
  \n\n## 步骤 5：与受保护变量的相关性分析\n\n到目前为止，我们采取了一种整体性的方法来识别数据中各种偏见的种子。然而，通常人们会特别关注某一种特定的偏见，例如针对特定种族或性别的歧视。在这一步中，我们将检测这种偏见在数据中的嵌入程度。但这要求每个观测样本的受保护属性（例如，种族）是实际已知的。在现实中，这个属性可能恰恰因为其受保护的性质而未被收集（甚至可能被禁止收集），这使得这项特定的分析不幸地无法进行。\n\
  \n为了进行这项分析，我建议对样本中的每个变量（这包括因变量和所有自变量的证据权重）执行 t 检验，根据受保护类别的二元指示变量（例如，性别标志）对样本进行分割，并比较\
  \ t 值。\n\n首先，我们想知道*因*变量在我们的受保护类别与其余人群之间是否显示出显著差异——如果是，这种差异是否让我们觉得是实质性的。如果是，我们就遇到了一个问题，因为我们应该预期算法会在现实世界的结果中复制这种差异（即，存在现实世界的偏见）。\n\
  \n其次，我们将所有*其他*变量的 t 值与我们从因变量获得的 t 值进行比较。如果 t 检验显著，但 t 值相等或更小（即，任何相关性的显著性都低于或等于我们为结果变量建立的相关性），那么情况是可控的，因为因变量可能帮助算法复制现实生活中的偏见，但至少不会放大它。然而，如果某个特征的\
  \ t 值大于我们的基准值，那么我们就遇到了一个变量，它可以作为代表非期望偏见原因（例如，性别）的属性的相对纯粹的代理变量，从而帮助算法甚至放大这种偏见。\n\n\
  每当 t 检验显著时，就会出现关键的设计问题——例如，是否应该删除该变量，是否应该保留该变量但通过管理覆盖层来解决偏见，或者对后果的仔细分析是否表明该变量可以保留在算法中而无需进一步调整？\n\
  \n根据我的经验，这种双变量诊断方法（一次只比较两个变量）就足够了。然而，有时只有多个变量的巧妙组合才能“暴露”受保护属性——特别是当数据集包含计算特征，而受保护属性可能是其输入时。如果你想确保也能检测到此类情况，请以受保护变量以及你在上述步骤\
  \ 3（数据结构）中通过 PCA 选择的解释变量运行线性回归（即使对于二元结果也是如此）（但是，排除所有你已经标记为有问题的变量；否则它们会再次出现并干扰对其他变量的评估），并检查方差膨胀因子（VIF）。我的经验法则是，如果受保护变量的\
  \ VIF 为 2 或更高，则存在多重共线性，并且受保护变量可以很好地由其他变量的线性组合来近似。可以通过相似的 VIF 值来检测问题变量，当你开始删除其中一个或多个时，你可以发现需要排除多少个变量才能消除受保护属性的任何隐藏线索。\n\
  \n最后（这对 99% 的读者来说应该是显而易见的），如果指示变量是分类的且类别超过两个（例如，你区分了三个或更多种族），你将需要运行方差分析（ANOVA）而不是\
  \ t 检验。\n\n## 步骤 6：可视化分析\n\n在我们的最后一步中，我们让大脑再次有机会审视数据并指出异常情况——但这次是利用我们大脑的视觉能力。为此，我将因变量的移动平均线（在\
  \ Y 轴上）与步骤 3（PCA）中入围的每个连续变量进行绘图——对于二元结果，因变量是 log-odds 比率；对于近似对数分布的变量（特别是金额，如收入），是其对数；对于所有其他变量，则是简单均值。\n\
  \n对于有序变量，有时将其视为连续变量是有意义的（例如，如果有许多不同的级别），否则，只要每个类别的观测数量有意义（100 规则），可以考虑使用条形图。\n\n\
  平滑的关系（如画册般的直线、平缓的曲线，甚至是 U 形）让我感到放心，表明一个变量捕捉到了某些潜在的真相。相比之下，锯齿状图形会引起我的注意，因为它们有时能直接指向问题——例如，有一次，绘制信用违约的\
  \ log-odds 比率与客户连续付款月数的图表显示，在 3.5 处出现了一个奇怪的尖峰！自变量的奇怪值（你可能有 3 个月或 4 个月的付款，但不会有 3.5\
  \ 个月）暴露了这里有一位初级分析师进行了一次欠考虑的空值插补，对付款历史缺失的客户插入了样本平均值（因此计算出了大约 3.5 的值），尽管该细分群体的违约率异常高。如果我没有发现它，这个错误可能会导致对恰好付款\
  \ 3 个月或 4 个月的客户产生严重偏见（因为算法可能将他们视为高风险）。\n\n这种视觉检查的第二个好处是，它将数据科学家的工作从数据工程过渡到模型开发，因为它也能为必要的转换产生见解，这些转换可以在特征生成中处理。\n\
  \n## 总结\n\n在本章中，我们编制了一套数据 X 光检查的常规流程，旨在全面且高效地针对数据中潜在的偏见发出预警信号。我们将该流程组织为六个相互构建的步骤：\n\
  \n*   第一步扫描样本的完整性，特别是通过评估样本级别的指标并确认关键数据字段没有缺失值。\n\n*   第二步旨在检测数据泄露，方法包括：a) 检测单个变量可疑的高预测能力，以及\
  \ b) 捕捉通过缺失值编码的事后信息。\n\n*   第三步通过提取缺失值和预测变量的结构，使后续的诊断和补救工作更加高效。\n\n*   第四步利用手动方法和机器学习来检测异常值。\n\
  \n*   第五步专门扫描针对受保护类别（例如，火星人）的偏见种子。\n\n*   第六步通过交叉表对数据进行可视化，为你的大脑提供第二次机会，以便在瞥见潜在异常时发出警报。\n\
  \n到现在为止，你应该已经非常熟悉你的数据以及手头建模问题的许多特定问题。鉴于此，你现在可以就最基本的模型设计问题之一做出明智的决定——即选择哪种建模方法，特别是使用机器学习还是更多的手动技术。这将是下一章的重点。\n\
  \n脚注 1   2   3   4\n\n\n\n"
- '# 20. 何时使用机器学习


  正如计算机和互联网的发明从根本上改变了我们的世界一样，机器学习正突然让分析能力几乎无处不在。在如此快速的变化发生之时，我们人类自然也很容易变得亢奋，甚至炒作，有时我们需要退后一步，深吸一口气，以便保持清醒的视角。


  1995 年，当我在吉森大学上市场营销课时，教授使用了一张 20 世纪 60 年代的图表，该图表用不同类型的织物说明了产品生命周期的概念。棉布被描绘在其生命周期的垂死末端，而尼龙则被说成处于辉煌生涯的开端。除非你像我的教授一样（他可能已经离开地球几十年了，也许是在研究火星人？），否则你一定已经注意到，对尼龙的这种热情被夸大了且是短暂的：棉布在
  70 年代就已经重新流行起来，而尼龙的使用仅限于特定产品（例如降落伞和冬装），在这些产品中其优势超过了局限性。


  在观察当前围绕机器学习的炒作时，请记住尼龙的命运。我稍后会承认机器学习的重要益处，并且我相信它会持续存在，并且其用途将比连裤袜和冬装广泛得多。然而，不要忘记，机器学习——尤其是神经网络——模仿的是人类*潜意识*大脑的工作方式，这是大脑中动物性的部分，是狮子用来捕猎、让狗成为优秀看门狗（它们基本上是可爱的、有着响亮吠声的异常检测机器）的那种基于模式、毫不费力、超快速的决策引擎。然而，当大自然设计人类时，它提升了水平，并增加了一种全新的能力，我们称之为*逻辑思维*。逻辑思维使人类的能量消耗惊人地增加了
  25%，但这完全被性能（即我们所说的智能）的提升所抵消。因此，*人工*智能在现阶段被设计得更像是一只聪明的贵宾犬，而不是一位拥有博士学位的*数据科学家*。我绝对相信每个家庭都会从养狗中受益，并且绝不会声称我捕捉飞行物体的能力能比得上我父母家的狗的本领。然而，在开发算法方面，我仍然相信，在许多情况下，手工方法可以产生更好的模型。


  机器学习的价值主张主要在于其快速且廉价。因此，在我看来，“数据挖掘”具有快餐的吸引力。就像很少有人会争辩说快餐比米其林三星级美食更好吃，而你的用餐偏好主要取决于你的时间和金钱预算一样，我相信，当你没有时间采用更手工的方法，或者确实缺乏必要的“烹饪”技能时（对于某些类型的数据，如图像，这一点一点也不奇怪），机器学习就会派上用场。


  “手工”在数据科学领域并不常用，但当我注意到城里最好的冰淇淋通常被宣传为“手工制作”（而从未被宣传为“机器生产”）后，我开始相信，手工技艺的概念很好地捕捉到了一位熟练的数据科学家通过不断检查她所处理的数据并修改方法以规避数据中出现的特定限制和陷阱，从而巧妙地避开有害偏差所增加的价值。


  但是，难道你没有听说过机器学习模型的预测能力也强得多吗？根据我的观察，许多机器学习模型预测能力更强的竞赛，实际上可以解释为构建手工挑战模型的数据科学家没有足够的时间——对于某些类型的“大数据”，这个差距可能是一年，但也可能只是一两周（许多基准测试工作确实很仓促）。而且，这些比较很少承认机器学习模型更高的预测能力是否是以偏差为代价的。^(⁶³)
  事实上，最好的算法“厨师”会窃取机器学习许多最好的技巧，就像高级美食通常是一项高科技活动，使用一整套机器，包括喷灯、研磨机、真空泵等等。我们将在下一章探讨这一点。然而，在本章中，我想讨论一个基本选择：给定的建模问题是否可以安全地通过机器学习解决，还是需要更手工的方法来管理算法偏差。


  当我们让机器学习与手工方法（数据科学家以更手动的方式经历模型开发过程，将她的商业判断和背景知识注入所有建模决策中）进行对比时，我们可以使用我们在第 12 章中用于在算法和判断决策之间做出决定的相同成本效益框架。手工方法会增加大量的人工成本，并显著延迟算法的可用性；另一方面，机器学习*可能*引入大量的业务风险，即发生算法偏差并导致财务和非财务损害。


  为了量化这种来自算法偏差的业务风险，需要考虑三个方面：


  *   首先，我们需要确定可能存在哪些偏差。为此，我们在第 19 章中系统地扫描了数据以寻找证据。


  *   其次，我们需要确定遵循手工方法的数据科学家会采取哪些具体行动来处理这些偏差，但这些行动会被快速、自动化的机器学习方法所忽略。第 18 章为这一评估提供了背景，从而使我们能够定义使用机器学习解决特定建模问题会产生的算法偏差风险敞口。


  *   最后，我们需要评估这种算法偏差风险敞口可能导致的损失严重程度，如第 13 章所述。


  在实践中，我发现机器学习尤其会在以下情况下被提倡：


  *   **速度**至关重要——如果当手工数据科学家精心制作出算法时，该算法已经过时，那么要么用机器学习，要么就什么都没有。防范信用卡交易欺诈和网络安全事件的算法就是这类情况的好例子。


  *   **洞察力**很低——如果数据科学家和组织中的其他人都没有多少背景洞察力，因此无法证明手工方法会比机器学习模型提供任何优势，那么决策可能就归结为要么用机器学习，要么根本不用算法（如第
  12 章所述）。那些刚刚开始使用算法、因此在数据科学方面专业知识很少（并依赖自动将机器学习应用于其决策问题的软件）的组织可能会发现自己处于这一类别，尽管他们应该问自己，这是否是他们想要长期保持的状态。


  *   **经济效益**很小——如果业务问题根本负担不起复杂的手工方法，那么决策同样归结为要么用机器学习，要么根本不用算法。




  另一方面，如果机器学习的**经济风险**很高，那么采用**手工**方法就不可避免；而如果有足够多的洞察、时间和资金来构建一个出色的算法，这种方法就会变得特别有吸引力。


  涉及非常大或难以处理的数据（例如，跨多个渠道的文本消息等非结构化数据、包含丰富且可能非结构化元数据的交易等复杂时间序列数据、语音和图像数据）的建模问题，可能会带来无法通过“常规”方法解决的建模挑战，就像人类大脑在处理视觉、语言和坠入爱河等任务时，依赖于潜意识中的“贵宾犬”一样。在这种情况下，可能需要真正的团队合作，让手工数据科学和机器学习相辅相成，就像一个拥有闪亮潜意识的绅士学会了“管住自己的嘴”，抑制住潜意识中那些不受欢迎的、冲动的言语。这将是下一章的主题。


  ## 总结


  本章对比了机器学习与手工方法在处理算法偏差方面的各自能力，并推导出每种方法最适合的应用场景。具体来说，你了解到：


  *   如果我们发现证据表明，我们的算法**容易**产生一种偏差，这种偏差会带来**实质性**的业务风险，并且**只有**通过手工方法才能妥善解决，那么我们就最应该关注使用机器学习的问题。


  *   另一方面，如果**速度**至关重要，我们的组织几乎没有或完全没有处理偏差的**洞察**，或者算法的**经济效益**不足以证明手工开发的合理性，那么我们可能**负担不起**手工方法。


  *   如果机器学习和手工方法都不可行，那么完全不使用算法可能是最佳选择。


  *   在其他情况下——特别是当我们处理非常**大**或**复杂的数据**时——我们希望采用一种结合了机器学习和手工技术的混合方法。


  在下一章中，我们将讨论这种混合方法可能是什么样子。


