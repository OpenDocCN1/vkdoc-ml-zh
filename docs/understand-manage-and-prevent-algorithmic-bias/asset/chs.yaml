- '# 3. 算法如何消除决策中的偏见


  在上一章中，你参加了一门心理学速成课，以理解为什么人类在决策时有时会带有偏见，以及一些最常见的偏见是什么。在本章中，主要面向那些没有亲自构建算法经验的读者，我将解释算法是如何工作的。更具体地说，我将展示一个*好的*算法是如何工作的，以及它如何能够*减轻*人类偏见；这样在后续章节中，你就能更容易地理解算法是如何出错的（即表现出偏见），以及解决这个问题的不同方案是什么。


  ## 一个简单的算法示例


  在引言中，我提到算法是旨在做出*无偏见*决策的统计公式。它们究竟是如何做到这一点的呢？


  最简单的统计算法之一是线性回归。你可以用一个如下所示的方程来估算一个数值——例如，一个人头上的头发数量：


  y = c + β[1] • x[1] + β[2] • x[2] + β[3] • x[3]


  *因*变量（即你想要估算的数值，这里指一个人头上的头发数量）通常用 y 表示。它被估算为*自变量*（也称为*预测变量*）的线性组合。这里，数据科学家选择了三个预测变量：x[1]、x[2]
  和 x[3]。x[1] 可能是这个人的头皮表面积（头越大，头发越多），x[2] 可能是这个人的年龄（随着年龄增长，人们可能会掉一些头发），x[3] 可能是性别（男性似乎比女性更容易秃顶）。


  这个方程是如何工作的呢？假设今天早上你在你妈妈头上标记了一平方厘米，并数出了 281 根头发。因此，你可能会将头皮表面积（记为 x[1]，以平方厘米为单位）乘以
  281。统计学家称 281 为*系数*，并将其记为 β[1]。下标 1 仅表示 β[1] 属于 x[1]。


  根据你今天早上在床上发现的头发数量进行推断，你可能还认为人们平均每年会掉 1000 根头发。因此，你将 –1000 放入 β[2]。


  最后，你猜测男性平均比女性少 50000 根头发。但这里你遇到了一个问题：性别是一个定性属性，但你的方程需要数字。你如何解决这个问题？解决方案就是数据科学家所说的*变量转换*或*特征生成*：他们创建新的数值来衡量定性属性（或其他事物——将定性值转换为数字只是特征生成的一个例子）。在我们的例子中，他们会将
  x[3] 定义为一个表示“男性化程度”的数值。最简单的方法是使用虚拟变量：x[3] 可以定义为一个二元变量，对于男性为 1，否则为 0。在这种情况下，β[3]
  可以设置为 –50000。


  然而，另一位数据科学家可能会争辩说，性别的二元定义已经过时且过于粗糙，因此建议用血液中的睾酮水平来衡量“男性化程度”。在这种情况下，模型可能表明，每增加 1 ng/dL
  的睾酮，头发数量就会减少 70 根。请注意，你已经遇到了第一个例子，说明数据科学家的信念——这里指关于性别是否为二元属性的信念——如何塑造一个算法。


  通过观察非常有限的数据——你妈妈头上的一平方厘米、今天早上在床上发现的头发，以及你几乎凭空想出的关于性别差异的一些估计——你因此得出了一个算法：


  hair = 281 • x[1] – 1,000 • x[2] – 70 • x[3]


  这个算法的问题在于它相当不准确。你的妈妈可能相当特殊；你的计数可能有误；从概念上讲，你忽略了男性头部比女性大的事实，因此存在统计学家所说的 x[1] 和 x[3]
  之间的某种相关性（当你为 x[3] 选择系数时，你没有考虑 x[1] 在方程另一端的作用）。凭借上一章的知识，你可以看到你的认知偏见是如何助长了这一团乱麻：你将数据收集建立在你直系亲属的基础上，从而成为了*可得性偏见*的受害者；你甚至没有考虑你的邻居，表现出了极端的*锚定效应*；并且你相信这种方法实际上有任何意义，表现出了严重的*过度自信*！




  幸运的是，统计学可以助你一臂之力：如果你测量一组样本（你的统计学家朋友可能会建议至少 100-200 人，尽管一百万人会更好）的头发数量以及 x[1]、x[2]
  和 x[3]，统计学将以最小化估计误差的方式优化你的系数值。统计估计过程会“尝试调整”并找到四个参数的最优估计值：β[1]、β[2]、β[3] 以及常数参数 c。


  这里我做一个技术说明：线性回归在统计上仍然非常简单，以至于使用矩阵代数就可以直接计算出系数。然而，对于更复杂的算法，“尝试调整”确实是找到良好解决方案的唯一途径。诸如最大似然估计之类的技术会通过迭代方式找到参数的最优解。这暗示了为什么先进统计技术的普及如此依赖于计算机速度的不断提升——以及为什么数据科学家的技能（或其使用的软件工具的技能）中一个要素在于计算效率，例如知道一些巧妙的方法来加速最大似然估计的搜索过程。


  统计学开发的算法最伟大之处在于，它们能与我们“对话”——某种程度上是这样。通过审视统计输出，我们不仅能了解大量关于数据和试图预测的现象的信息，还能了解算法是如何“思考”的。我将在接下来的章节中简要说明这一点。


  ## 算法会给你什么


  如果你收集了 200 人的头发数据（我怀疑我的出版商不会为此买单，所以我不得不完全编造以下数字），你的统计软件可能会生成以下方程：


  hair = 75,347 + 159 • x[1] – 0.3 • x[2] – 23 • x[3]


  这是一个极其有趣的结果！这个方程至少有三个特别值得注意的方面：


  1.  这个新方程比原始方程产生的误差要小得多（你看不到这一点，但请相信我的话）。事实上，估计技术保证了这是你能得到的最佳估计（还记得第 1 章中 BLUE（最佳线性无偏估计）的概念吗？）。如果你的生计依赖于了解人们的头发数量（例如，因为你是一个疯狂的理发师，按剪掉的头发数量收费，但你的顾客合理地要求你在开始之前先报价），你的处境会好得多——很可能没有这个方程你甚至无法经营你的生意。然而，有一个注意事项：“误差”是以一种特定的方式定义的，即算法对样本中每个人头发数量的估计值与实际值之差的平方（这就是为什么统计学家也将这种技术称为普通最小二乘法或
  OLS）。这意味着，如果你对误差的权衡有不同的看法（因为 OLS 对误差进行平方，它会惩罚大误差而轻视小误差——你可能不同意这一点），你可能会偏好一组不同的系数。


  2.  你可能已经注意到，常数项有一个非常大的数字，而 β[1] 比原始方程中低得多。本质上，算法将自己锚定在一个基准点上（使其接近平均值的一半），并限制了由个体属性引起的变化量。这带有稳定性偏差的意味，并呼应了前一节的讨论，我在那里观察到，大自然将稳定性偏差硬编码到我们的大脑中是有道理的——一定程度的锚定确实能改善估计。从经验上我们可以观察到，预测变量或模型的整体结构越差，方程就越会以总体平均值为基准（在极端情况下，如果所有自变量都毫无意义，方程将是一个常数函数，所有自变量的系数为零，从而为每个人估计总体平均值，在这种情况下这并非一个坏主意）。


  3.  最后，你可能会对年龄的系数 –0.3 感到惊讶（是的，这甚至不到半根头发！）。如果一位统计学家更仔细地审视这个估计值，她可能会告诉你它是“不显著的”（即，该系数很可能为零）。零系数是统计学告诉你某个变量没有意义的方式。仔细想想，你就能明白为什么：在年轻时，你的头发会增多，而不是减少；即使作为成年人，你不仅会掉头发（然后早上可以在床上找到它们），也会长出新头发。因此，大多数人只有在生命较晚的时期才会经历净脱发。线性模型简单地假设你每年失去相同数量的头发——因此这确实没有太大意义。并且重要的是要理解，由于样本量较小，估计的系数很少会*恰好*为零；系数通常包含一点噪声。不幸的是，显著性的概念有点复杂，但统计学家说某个系数不显著的意思是：如果实际上该系数为零（即该变量毫无意义），由于数据中的噪声和你拥有的样本量，你应该预期计算出的系数会落在一个从某处到某处的范围内（在这个例子中，可能是
  –0.5 到 +0.5）。由于你实际得到的系数恰好落在这个范围内，你应该假设它在现实中为零，因此该变量毫无意义。这是确定的吗？不，不是！然而，统计学家有工具来量化他们的陈述正确的概率——在这种情况下，我们称这个概率为*置信水平*。如果一个变量在
  99.9% 的置信水平下被认为不显著，这意味着如果真实系数为零，估计值有 99.9% 的概率落在一个特定范围内（由统计软件计算得出），而你为该变量得到的系数实际上就在那个范围内。事实上，你也可以问统计学家：“如果真实系数是
  -1,000，我得到我们现在这个结果的概率是多少？”统计学家可能会看起来很困惑，因为这不是人们通常思考问题的方式——但在抱怨一番之后，他可能会告诉你概率是 0.0000417%。这意味着我们平均每年掉
  1,000 根头发的可能性非常小——但基于你那 200 人的样本，这并非完全不可能。


  最后提到的一点——告诉我们某个变量很可能毫无意义——是统计算法帮助我们消除决策逻辑偏差的最重要方式之一。统计学家常说统计检验“拒绝”了我们的假设：它告诉我们，基于手头的数据，我们的信念似乎是错误的。


  我作为一名顾问，花了多年时间消除判断性信贷和保险承保中的偏差。为了做到这一点，我花了大量时间与承保人一起列出他们关注的所有信息；通常我们会得到包含 200-400
  个因素的冗长清单。然后我与他们合作，对他们认为最重要的 40-70 个因素进行优先级排序和筛选。接着我应用统计学来验证这些因素——在超过 100 次这样的研究中，每一次，大约一半的优先因素都被证明是不显著的。承保人遭受了我在前一章中列出的所有认知偏差的影响。例如，如果一位中国信贷官员曾经遇到一位德国借款人因一场引人注目的破产而违约，怪异效应可能会导致这位信贷官员拒绝所有德国申请人，认为他们风险极高。作为一个德国人，我可以向你保证，这简直是疯了！




  根据统计测试结果，我重新设计了评估逻辑。虽然主观风险评估通常发生在核保人的头脑中，但我用统计算法取代了它。当我曾任职的银行和保险公司测试新算法时，他们发现决策质量持续提升，将信贷和保险损失降低了
  30-50%（有时甚至更多），同时*还*批准了更多交易（从而实现了更快的业务增长）！这对金融机构来说显然价值巨大（也使得为我的服务付费成为一项非常棒的投资）。


  因此，可以公平地说，统计算法是对抗偏见的重要工具。然而，正如你将在后续章节中看到的，遗憾的是，这并*不*意味着算法是完美的，或者它们本身不会成为偏见的受害者。


  ## 总结


  在本章中，你探讨了什么是算法，并确定了与偏见相关的一些重要特性：


  *   原则上，统计算法旨在做出无偏见的预测；它们通过客观分析提供给它们的所有数据点来实现这一点。


  *   检查算法可以提供重要信息——我们不仅能更多地了解数据和想要预测的现象，还能理解算法是如何“思考”的。这很有价值，因为它使我们能够进一步追问这种思考是否存在缺陷。


  *   当我们在模型中输入特定变量（作为对潜在因果关系信念的体现）时，统计*显著性*使我们能够检验我们的假设是否得到数据的支持。如果没有，那么很可能我们存在偏见，而算法帮助我们发现了这种偏见。


  *   从经验上看，统计算法的表现通常优于主观的人类判断，因为它们成功地消除了许多偏见。


  *   统计算法以总体平均值为锚点，模型结构越差、自变量的预测能力越弱，这种稳定性偏见就越强。


  为了理解偏见是如何潜入统计算法的，更详细地了解数据科学家实际是如何开发这些算法的会有所帮助。这正是我们接下来要讨论的内容。


  '
- '# 4. 模型开发过程


  在上一章中，你了解了算法是如何工作的。在本章中，我将回顾算法是如何开发的；这显然对于理解偏见可能以多种方式潜入算法非常有帮助。此外，经验丰富的数据科学家可能也想简要浏览一下本章，以便了解我的思维框架和术语，因为我将在后续内容中频繁引用它们。关于术语的一点说明：随着机器学习的出现，引入了一整套新词汇（例如，*观测值*变成了*实例*，*因变量*变成了*标签*，*预测变量*变成了*特征*），不幸的是，这使得写出让所有世代的数据科学家都能理解的内容变得非常困难。至少，*数据科学家*这个新头衔比*模型开发者*或*建模者*（数据科学家在古代（大约公元
  2010 年）的称呼）要时髦得多！除了头衔之外，我通常会使用更传统的术语，这主要是为了那些可能在其他研究领域只接触过一点点统计学的人，使用他们熟悉的术语会更容易让他们将知识点联系起来。


  你可能想知道为什么本章的标题是开发一个*模型*，而不是一个*算法*。当数据科学家估算一个方程的参数，以在特定背景下预测特定结果时（例如，预测银行加拿大中小企业零售贷款组合的违约概率），我们通常将结果称为一个*模型*。术语通常因行业、地域、职能（例如，风险管理或市场营销）甚至组织而异；一些读者（例如，在银行业工作的人）可能听说过*模型*这个术语（例如，美国银行监管机构使用这个术语来监管银行的算法），而其他人可能习惯于*算法*这个术语（例如，处理网站上特定功能如推荐引擎的人）。就我们的目的而言，没有必要区分*模型*和*算法*这两个术语。


  ## 模型开发过程概述


  从高层次来看，可以将模型开发区分为五个主要步骤：模型设计、数据工程、模型组装、模型验证和模型实施。


  1.  *模型设计*定义了模型的整体结构，例如模型的输入和输出应该是什么——这与建筑师为新房子建造所做的规划并无不同。


  2.  *数据工程*准备用于估算算法系数的数据。它涵盖了从确定你想要收集的数据（在我们的建筑类比中，这第一个子步骤是订购建筑材料）到将所有数据整齐地放入一个或多个大型表格中的所有活动——而大多数挑战都隐藏在“整齐地”这个概念背后。（想想浴室瓷砖——如果你想要一个完美的浴室，瓷砖工应该仔细检查每块瓷砖，丢弃破损的，并切割一些瓷砖使其长度刚好适合角落和缝隙。）


  3.  *模型组装*是模型开发的核心。在这里，原始数据被转化为一个方程，其系数通过统计技术推导得出。


  4.  *模型验证*是对模型适用性的独立审查和确认。


  5.  *模型实施*是将模型部署到实际业务运营中。


  让我们更详细地讨论每个步骤，特别是对控制偏见最重要的两个步骤：数据工程和模型组装。


  ## 步骤 1：模型设计


  模型设计决定了关于模型的一些重大、根本性的问题。我们可以称之为“四个什么”：


  *   预测什么结果……


  *   针对什么样的业务问题……


  *   基于什么样的数据……


  *   使用什么样的方法论？


  这些问题的答案实际上是由业务用户的需求以及他们打算如何使用模型来驱动的；正如建筑师如果对客户需求理解不足可能会设计出无用的建筑一样，如果数据科学家和业务用户之间沟通不足，许多偏见就可能潜入模型。




  ## 第二步：数据工程


  正如一些最优秀的巴黎大厨会自豪地在凌晨时分前往兰吉斯国际市场采购最新鲜的顶级本地食材（该市场凌晨 1 点开门，上午 11 点关门），数据科学家创造的许多价值也发生在数据工程阶段。尽管不同的数据科学家对其活动使用的术语和分组略有不同，但我认为最有效的方式是区分数据工程的五个主要要素：样本定义、数据收集、样本拆分、（处理）数据质量以及数据聚合。


  *   *样本定义* 精确决定了要收集哪些历史参考案例的数据。在你的头发示例中，你选择了 200 个参考案例——它们应该全部来自你的社区，还是应该包含来自其他城市甚至其他国家的数据点？你是否应该确保以特定比例包含白种人、黑人和拉丁裔——这个过程称为*分层*？那太平洋岛民呢？你是否还应该按年龄和性别进行分层？收集
  500 人、5 万人还是 500 万人的数据会更好？样本定义很快就会变得复杂，你做出的任何权衡都可能很快带来麻烦！只有某些价格过高的软件工具的销售人员才会声称这很容易——根据我的经验，许多最严重的算法问题都源于糟糕的抽样。


  *   *数据收集* 是为你的样本获取实际数据的过程。在过去，这通常需要 IT 部门为主机编写 COBOL 查询语句，或从地下室布满灰尘的档案中检索数据磁带；如今，数据科学家可能只需在数据湖中输入一个简单的查询。数据可能需要从多个来源进行整理；有时甚至可能需要手动采集（例如，在纸质文件中查找并输入到电子表格中）。


  *   *将样本拆分为开发样本、测试样本和验证样本* 对于正确验证模型（确保模型正常运作的关键技术）至关重要。如果你忘记这一步，或者在拆分方式上做出糟糕的选择（例如，导致用于验证的数据太少或不合适），你就会陷入麻烦。模型系数是基于开发样本估算的；如果模型在测试样本上未能表现出相似的预测能力，数据科学家就会知道模型对开发样本过拟合，因此不稳定，并可以调整模型。然而，如果迭代次数过多，模型也可能对测试样本过拟合，因此，在最终验证之前从未使用过的独立验证样本，才是对模型稳定性的最终考验。一个多疑的用户可能不会在模型完成前将开发样本交给数据科学家（建模竞赛就是这样进行的）。相比之下，如果你的数据科学家一开始就忘记拆分样本，那么即使后来预留了验证样本，整个思维过程的完整性也已遭到破坏。这有点像读你孩子的日记：一旦你读了，你就辜负了她的信任，即使你把日记本*原封不动*地放回架子上。


  *   *数据质量* 需要首先进行评估，一旦确定了收集到的数据的具体问题（例如，缺失数据或无意义的值），就需要通过一项令人厌恶的活动——称为*数据清洗*——来实现数据质量。例如，如果你查看
  2018 年 11 月 1 日的个人样本，发现其中一半人恰好是 118 岁零 10 个月，这很可疑——进一步调查可能会发现，数据库中许多人的出生日期并未收集，而是因为三次并购前某个非常古老的计算机系统在这种情况下将
  1900 年 1 月 1 日作为默认出生日期输入。那么，你需要么将每个 1900 年 1 月 1 日的实例覆盖为“缺失”标记，要么，如果你运气真的很好，你意识到这些人都是中国公民，而你恰好也有他们的身份证号码，其中恰好编码了出生日期——这样你就可以找出每个人的正确年龄，从而通过用从身份证号码中提取的正确出生日期覆盖
  1900 年 1 月 1 日来*清理*这个数据质量问题。但为什么这项活动令人厌恶呢？在进行清理时，你可能会偶然发现，对于许多其他人（拥有更合理的出生日期），身份证显示的出生日期也不同。感到恼火，你可能会决定根据他们的身份证*全部*替换出生日期。然而，此时你发现有几个人的出生年份是
  2058 年，在撰写本书时这仍然是未来。对他们的身份证号码进行调查后发现，身份证号码的校验位是错误的，因此身份证号码肯定是被错误录入的。你叹了口气，意识到这将没完没了，你*真的*讨厌数据清洗。


  *   *数据聚合* 将多个数据项（例如，你用信用卡进行的单笔交易或浏览器搜索历史中的项目）组合成新的变量。这是一个关键步骤，它既可以创建更具洞察力的变量（例如，知道你平均每月在食品上花费
  1287 美元，可能比知道昨天你在全食超市花了 1.99 美元——忘了买鲜奶油，是吧？更有意义），同时也会丢失信息（事实上，在四分之三的情况下，你在进行一笔超过
  50 美元的大额采购后，会在五小时内返回同一家超市进行另一笔低于 10 美元的小额采购，这是一个非常重要的洞察，可能向银行表明你比普通客户更有可能忘记还信用卡——因此，如果我将所有食品采购聚合为每天或每月的总金额，我就丢失了你是个真正粗心大意的人这一信息）。


  在大多数模型开发工作中，数据工程是最耗时的步骤；正如你很快会看到的，它也是产生偏见的机会温床。




  ## 第三步：模型组装


  数据准备就绪后，数据科学家就可以开始组装算法了。这远不止是运行一个统计软件包来估算方程系数那么简单——实际上，它包含七个子步骤。步骤 2、4 和 5 是数据科学家通常最享受的有趣部分；因此，他们有时会沉浸其中，导致没有足够时间完成其他步骤，这或许并非巧合。


  我还需要指出，*模型组装*并非一个非常常见的术语；通常你会听到*模型估计*——但我在此要强调的核心是，模型估计只是七个重要步骤之一，如果其他步骤被遗忘或敷衍了事，偏见往往会悄然渗入模型。


  *   *基于逻辑标准排除记录*是防止偏见的关键步骤。许多样本包含隐藏的垃圾数据，如果数据科学家没有在此步骤上投入足够时间，这些数据就会蒙混过关。例如，你可能会天真地认为，要构建一个信用风险模型，只需查看过去的贷款，将其分类为已偿还或违约，然后构建模型即可。大错特错！由于四舍五入的问题，许多银行的账簿中都有一些客户认为已完全还清，但技术上仍欠几分钱的贷款账户。如果这几毛钱逾期超过
  90 天，天真的方法就会将该账户标记为“违约”。同时，银行可能有一条合理的操作规则：如果违约客户欠款不到一美元，他们不会采取任何行动，因为追讨几分钱的成本远高于欠款本身；相反，他们会定期核销这些账户。现在，我们进一步假设这些四舍五入问题仅发生在贷款金额包含$12,000
  的分数时——这是因为银行设定的利率小数点后保留三位，而$12,000 的 0.001%恰好是每月$0.01（= $12,000 * 0.001% / 12）。你能看出会发生什么吗？一个聪明的算法可能会发现，如果贷款金额是$12,000
  的倍数，违约风险远低于正常水平——从而制造一个漏洞，让一些高风险客户得以蒙混过关获得贷款，尽管对于任何其他贷款金额，算法都会拒绝他们。因此，数据科学家必须审查违约余额金额的分布，识别这个与无关紧要数值相关的问题，并排除所有余额低于银行启动催收操作阈值的记录。需要注意的是，与数据清洗（处理事实错误的数据）不同，此步骤处理的是由事实上完全正确的数据引起的概念性问题。因此，此步骤更依赖于数据科学家的领域知识和判断力。


  *   *特征开发*是创建新变量的过程，旨在从原始数据中挖掘出可用于算法输入的见解。在头发示例中，你遇到了一个非常简单的例子：编码一个表示男性的虚拟变量（即男性
  = 1，女性 = 0）。一部手机当前位置与过去 12 个月内其最常停留的前三个位置中最近一个的距离，则是一个非常复杂的特征示例。也许你正在尝试打击在线欺诈——在这种情况下，你可能会想到，如果手机远离其典型位置，那么手机被盗且小偷试图使用它的可能性就更大。什么是典型位置？这里你决定定义为前三个位置。为此，你首先需要创建过去
  12 个月的手机位置日志，因此你需要某种形式的位置数据（例如，来自手机连接基站时的登录事件，或者可能由应用程序记录或随搜索查询发送的更精确位置），对其进行处理以将每个时间单位分配一个位置，并对如何处理数据中的空白做出假设（例如，如何处理连续两周完全没有发送数据的情况——有可能此人一直待在家里（也许在照顾生病的家人），但更可能是手机坏了被送去维修，或者此人去喜马拉雅山徒步了——因此你可能会决定，在最后一个信号发出
  12 或 24 小时后，将位置设置为“未知”，并从分析中排除位置未知的时间段）。然后，你需要汇总每个位置的总停留时间，选择前三个，并计算手机当前位置到这三个位置中每一个的距离，从而得出你心目中的变量。这甚至还不是我见过的最复杂的变量！但它说明了三件事：它很有趣，它很复杂（因此也很耗时），并且它涉及大量的假设和判断性决策。请记住最后一点——这显然是偏见产生的地方！


  *   *变量筛选*对于数据科学家处理的大型数据表的列而言，就如同记录排除对于行一样：我们删除单个变量（即列——为了构建算法，我们通常需要将所有数据排列在一个大型表格中，其中每个观测值（例如，样本中你观察到了头发数量以及预测属性的人）是一行，每个预测变量（要么是你收集的原始属性，如年龄，要么是你基于其他数据计算出的特征）是一列）。这也是一个数据科学家若跳过往往会自食其果的步骤。许多被考虑的特征完全无用（即根本没有预测价值），而其他一些特征可能具有预测性，但由于与其他特征非常相似（用统计学家的语言说：高度相关）而显得冗余（举个极端的例子，一个人的体重以公斤和以磅表示是完全相同的信息，只是单位不同）。如果这些变量保留在样本中，它们没有任何益处，反而可能造成各种混乱——在极端情况下（例如像体重例子中两个完全相关的变量），它们实际上可能导致模型估计过程崩溃（从某种意义上说这算是幸运的情况，因为至少数据科学家会注意到），但通常它们只是对数据科学家耍各种花招，其中一些会导致模型产生偏差。




  *   *模型估计*是实际估算模型系数的步骤——在此步骤中，我们可能会为 OLS 回归进行一些矩阵代数运算，或在统计软件包中运行脚本，以使用 XGBoost 构建梯度提升决策树（即，使用他人开发的工具构建一个非常复杂的模型，以至于我们*甚至*可以在不完全了解自己在做什么的情况下完成此操作……）。这可能非常有趣，尤其是当我们尝试一些以前从未使用过的新奇算法，并且最终模型的性能比我们通常使用的标准算法高出
  0.0001%时！


  *   *模型调优*是一系列迭代步骤，数据科学家在此过程中查看初步结果，对其进行评估（例如，检测到模型存在不希望的偏差或其他不良行为），并尝试通过以下三种方式之一来解决问题：数据科学家可以选择不同的数据行集（例如，事后移除余额为一美分的账户），或更改包含预测特征的数据列（例如，修正某个变量中的逻辑缺陷），或更改模型估计过程中的一些参数设置。后者也称为*超参数*——就像面包师可以调节烤箱的温度和湿度并调整烘烤时间一样，你可以将模型估计过程视为一台带有几个旋钮和按钮的机器，你可以通过调整它们来获得更好的“烘烤”效果。我将以决策树的估计为例来说明这一点：决策树容易过拟合数据（例如，如果你的头发模型样本中包含三个恰好都出生于
  3 月 1 日的秃头人士，那么一个过于激进的决策树可能会得出结论：出生于 3 月 1 日是预测秃头的绝佳指标）。对抗这种情况的一种方法是所谓的 Bonferroni
  校正（它基本上“调高”了模型在相信某个属性*并非*随机之前，希望看到的具有相同属性的人数）。然而，Bonferroni 校正可能过于保守，你可能会决定改用 Holm-Bonferroni
  方法或Šidák 校正。^(¹⁶) 对于许多类型的模型而言，这些超参数的可能变化几乎是无限的，遗憾的是，没有一种设置这些超参数的方法可以被认为是普遍正确或优于所有其他设置的。这意味着数据科学家在选择这些超参数时的判断非常重要——这也是偏差的另一个潜在来源！


  *   *模型输出与决策规则的校准*是将原始模型输出（例如，违约概率）转换为业务应用决策规则（例如，批准或拒绝贷款申请）的步骤。在此过程中，会涉及许多额外的考虑和判断（例如，审批决策通常会考虑某种盈利能力标准，而这需要分配成本），这带来了一些非常哲学化且最终是主观武断的判断。现在你知道了，有判断的地方，就有偏差……


  *   *模型文档*是数据科学家记录其已完成工作的步骤，以便其他人能够理解模型并形成独立的意见。由他人对模型进行概念验证和正确使用，对于防止偏差至关重要——而这取决于适当的模型文档。如果模型文档中存在空白或失实陈述，读者的偏见就会起作用（例如，如果模型文档吹嘘其具有很高的预测能力，这将引发锚定效应和确认偏差，从而阻止读者提出澄清性问题，以揭示模型的一些隐藏问题）。


  因此，模型组装产生了一个算法，该算法现在可以应用于决策流程中，例如批准贷款、向机场安检发出潜在恐怖分子警报，或建议你购买我的最新书籍。


  ## 第 4 步：模型验证


  模型验证可以是非正式的，或者，在受监管的金融机构中，是由组织内专门部门执行的正式治理流程。其灵感来源于在许多其他生活领域已证明其价值的技术检查——例如，在许多国家，汽车需要定期进行技术检查，以验证它们仍然可以在公共道路上安全使用。正如你将在第
  7 章中听到的，算法偏差的一个根本原因是数据科学家的偏见，而通过模型验证创建的独立质疑功能可以成为对抗此类偏差的有效制衡力量。


  ## 第 5 步：模型实施


  在大多数情况下，模型是在与实际处理业务交易的系统不同的计算机系统上开发的。为了在“现实生活”中使用模型来做出业务决策（这通常被称为“投入生产”），需要额外的工作步骤，这些步骤被称为*实施*。例如，一旦数据科学家开发出用于审批信用卡申请的新评分卡，银行就需要将该算法上传到其信贷决策（IT）系统中，并创建一个流程来收集评分卡所需的数据输入。正如你将在后续章节中看到的，这些数据的创建或从其他来源收集的方式——以及系统在实时运营中如何处理缺失或无意义的值——也可能引入有偏差的决策；因此，模型实施需要被视为对抗算法偏差工作范围的一部分。


  ## 总结


  在本章中，你回顾了开发模型的整个过程；从宏观层面，你探讨了构建模型所涉及的五个主要步骤：


  *   *模型设计*通过定义要预测的结果、在何种群体上开发、使用哪些预测数据以及应用何种建模方法，确保模型支持其战略目标。


  *   *数据工程*通过定义合适的样本、收集原始数据、将样本分为开发、测试和验证三部分、通过识别和清理数据问题来确保高数据质量，以及聚合细粒度数据，为模型开发准备合适的数据。


  *   *模型组装*产生实际的算法。此步骤包括七个子步骤，即：基于逻辑标准排除不合适的记录、开发新特征、消除无用或冗余的特征、模型系数的初步估计、其迭代调优、模型输出及围绕它们的决策规则的校准，以及模型的文档记录。


  *   *模型验证*是一个治理流程，用于独立确认模型是否适合使用。


  *   *模型实施*将模型部署到实际业务运营中；这尤其涉及将数据输入馈送到模型中，并将模型输出与业务决策联系起来。


  对这五个工作步骤的讨论，让你了解了数据科学家的工作以及使用统计技术开发算法所需的过程。除了提及不同的复杂程度之外，我尚未对不同建模技术进行区分。你最近肯定经常听到的一类建模技术被称为机器学习。在下一章中，我将揭开关于机器学习的真相与迷思。


