- '# 第一部分 偏见与算法导论


  '
- '# 1. 引言


  什么是偏见？一个被广泛引用的来源^(¹) 将其定义如下：


  > *对某个人或群体的倾向或偏见，尤其是以被认为不公平的方式*。


  偏见是一把双刃剑。正如你将在下一章中看到的，偏见通常不是性格缺陷或罕见的异常，而是人类大脑能够以看似毫不费力、超快速度每天做出数千个决策所必须付出的代价。你是否曾惊叹于自己能在瞬间躲避一个快速移动的物体，比如一辆即将撞上你的汽车？神经科学家和心理学家已经开始揭开思维的奥秘，他们发现大脑只有通过走大量捷径才能达到这种速度。


  捷径意味着大脑会在没有充分考虑所有事实的情况下仓促得出结论（例如，认为一道菜不可食用，或一个陌生人很危险）。换句话说，大脑为了追求速度而使用了偏见。


  因此，在决策中使用偏见是不公平的，因为它（故意）忽略了某些可能支持不同决策的事实。例如，如果你的伴侣曾经吃过一次马赛鱼汤后病得很重，他或她就再也不会吃马赛鱼汤了，甚至可能拒绝尝试你刚煮好的美味马赛鱼汤，幸福地忽略了你以优异成绩毕业于烹饪学校，并且购买了国内最好最新鲜的食材这一事实。


  算法是用于解决特定问题的数学方程或其他逻辑规则——例如，决定一个二元问题（是/否）或估算一个未知数。就像大脑在瞬间做出决策一样，算法承诺能立即给出答案（在大多数情况下，算法方程的分值可以在不到一秒内计算出来），它们也是一种捷径，因为它们只以预定方式考虑有限数量的因素。


  在一个层面上，算法是机器模拟或取代人类决策者的一种方式。例如，一家每月需要审批数千笔贷款申请的银行，可能会求助于计算机应用的算法，而不是由人类信贷员来承销这些贷款；这通常是因为算法比人类更快、更便宜。


  然而，在另一个层面上，算法也可以成为减少甚至消除偏见的一种方式。统计学家已经开发出专门在无偏约束下设计算法的技术——例如，普通最小二乘法（OLS）回归是一种被定义为
  BLUE（最佳线性无偏估计）的统计技术。遗憾的是，我不得不写道，算法“*可以*”减少或消除偏见——算法也可能像人类决策一样有偏见，甚至更糟。本书的多个章节致力于解释算法可能产生偏见的多种方式。


  然而，在算法的语境下，对*偏见*的定义应该更加具体。算法解决的问题至少在理论上有正确答案。例如，如果我估算一位知名总统头上的头发数量，可能从未有人数过，但任何有无限时间和接触总统机会的人，都可以验证我估算的
  107,817 根头发是否正确。




  在大多数情况下（包括总统的发型问题），正确的答案至少无法*先验地*（即，在算法应用时）获知。因此，算法通常是一种进行预测的方式。通过预测，算法有助于减少和管理不确定性。例如，如果我申请一笔贷款，银行（尚）不知道我是否会偿还贷款，但如果一个算法告诉银行，我违约的概率是
  5%，银行就可以通过将预期损失与收取的利息及其他成本进行比较，来决定以 5.99%的利率给我贷款是否能从中获利。这说明了算法的一种典型用法：算法估算特定事件（例如，客户贷款违约、汽车在事故中受损、或某人在人寿保险合同期满前死亡）的概率，而这些概率使得承担承保风险的企业能够基于客观的预期风险调整回报标准，做出批准/拒绝的决定。


  算法是在信息不完善的情况下部署的（例如，银行的信用评级算法不知道我昨晚欠下的赌债，也不知道我的公司下个月是否会解雇我）。因此，算法*确实*会犯错；然而，它们应该*在平均意义上*是正确的。如果所有预测的平均值系统地偏离了正确答案，那么就存在**偏差**。例如，如果银行的算法为
  10,000 个不同的客户分配了 5%的违约概率，那么可以预期这 10,000 人中有 500 人会违约（500/10,000 = 5%）。如果你调查情况，发现实际上有
  10%的客户违约，但每当申请人持有德国护照时，算法就会将真实估计值减半，那么这个算法就存在偏差——在这种情况下，是偏向德国人的。（这个算法恰好是由一个德国人创建的，这是巧合吗？）


  预测中的系统性错误——无论是人为还是算法造成的——都可能对企业产生严重影响，遗憾的是，这类错误屡见不鲜。例如，一项针对大型基础设施项目的研究——分析了 20 个不同国家的
  258 个项目——发现其中近九成的项目存在成本超支，这表明对真实成本存在系统性低估。^(²) 在全球金融危机期间，北岩银行、雷曼兄弟和华盛顿互助银行等机构之所以倒闭，是因为它们系统性地低估了信用风险、市场风险和流动性风险。


  有时，人类的偏见是罪魁祸首。例如，一家美国银行曾有一个经济资本模型（一种量化特定投资组合中可能导致银行挤兑或破产的“意外损失”的复杂模型），该模型在全球金融危机前就通过估算比预期损失大数倍的意外损失，暗示了房屋净值贷款中潜伏的巨大风险；可悲的是，管理层驳回了这些估算，因为他们习惯于看到意外损失与预期损失非常接近，因此认为该模型有缺陷。


  然而，在其他时候，算法本身也存在缺陷。例如，一家亚洲银行购买了一个消费信用卡评分模型，该模型将信用卡的使用率作为违约的预测指标之一。该算法认为使用率低的客户（例如，仅使用信用额度的
  10%）比使用率高的客户更安全；对于安全客户，算法会提高其信用额度。然而，这造成了一个循环引用：当算法提高信用额度时，使用率（通过将当前未结余额除以信用额度计算得出）会下降，导致算法进一步提高额度（因此，如果未结余额为
  10，额度为 100，使用率为 10%；如果系统将额度从 100 提高 25%至 125，使用率则降至 8%（= 10/125），从而触发额度的再次提升，以此类推）。这种情况一直持续到信用额度达到远超客户偿还银行能力的惊人水平。当越来越多的客户开始实际使用他们极高的信用额度时，许多人违约也就不足为奇了，该银行在核销了超过
  10 亿美元的坏账后几乎破产。


  算法偏差的形式多种多样。2016 年，ProPublica 发布了一份研究报告，显示美国当局用于估算罪犯再犯概率的算法 COMPAS 存在针对黑人的种族偏见。^(³)
  麻省理工学院报告称，自然语言处理算法存在性别歧视，将家庭主妇与女性关联，将程序员与男性关联。^(⁴) 2014 年进行的一项研究表明，在谷歌的广告设置中将用户资料设为女性，可能会导致广告中出现的高薪职位减少。^(⁵)
  随着越来越多的决策由算法做出——影响着消费者、公司、员工、政府、环境，甚至宠物和无生命物体——算法偏差的危险性和影响与日俱增。然而，这并非必然——偏差仅仅是算法工作的一个副作用，因此是算法创建者和使用者有意或无意选择的副产品。这些选择可以被重新审视和改变，以减少甚至消除算法偏差。


  这本书是关于算法偏差的。首先，我们想更好地理解它是什么——它从何而来，以及它如何对重要决策造成严重破坏。其次，我们希望通过探索如何管理算法偏差——无论是作为用户还是监管者——来控制其损害。第三，我们想探索数据科学家预防算法偏差的方法。


  第一部分，即第 2 章至第 5 章，介绍该主题。我将从快速回顾心理学和人类决策偏差开始，因为算法偏差在诸多方面与它们相似，其程度远超表面所见（第 2 章），并讨论算法如何帮助消除决策中的此类偏差（第
  3 章）。考虑到本书许多读者是外行而非数据科学家，我将接着回顾“香肠是如何制作的”——即算法是如何开发的（第 4 章），并揭开机器学习背后的神秘面纱（第 5 章）。




  本书的第二部分，即第 6 章至第 11 章，探讨了算法偏见的来源。第 6 章审视了现实世界中的偏见如何被算法所镜像（而非纠正）。第 7 章转向数据科学家的角色，探讨数据科学家自身的（人类）偏见如何导致算法偏见。第
  8 章深入探讨了数据的作用，第 9 章回顾了算法本身的特性如何引入所谓的稳定性偏见。第 10 章着眼于统计产物所产生的新偏见，而第 11 章则深入探讨了社交媒体，在那里，人类行为与算法偏见会以一种尤为恶劣的方式相互强化。


  本书的第三部分，即第 12 章至第 17 章，从用户的角度探讨算法偏见。该部分首先简要讨论了是否应该实际使用算法（第 12 章），以及如何评估特定决策问题中算法偏见风险的严重程度（第
  13 章）。第 14 章概述了保护自己免受算法偏见影响的技术。第 15 章更具体地描述了诊断算法偏见的技术，第 16 章讨论了克服算法中根深蒂固的偏见（即便不是在现实生活中）的管理策略。第
  17 章讨论了算法用户如何通过生成无偏见数据，为算法的去偏见化做出关键贡献。


  本书的第四部分，即第 18 章至第 23 章，面向开发算法的数据科学家。第 18 章概述了数据科学家防范算法偏见的各种方法。第 19 章深入探讨了识别有偏见数据的具体技术。第
  20 章讨论了在开发算法时，如何在机器学习和其他统计技术之间进行选择，以最大限度地减少算法偏见，第 21 章在此基础上提出了结合两者优点的混合方法。第 22 章讨论了如何将本书介绍的去偏见技术，应用于需要“即时”验证的自我改进型机器学习模型。第
  23 章则从开发众多算法的大型组织的视角出发，描述了如何在机构层面，将预防算法偏见的最佳实践嵌入到稳健的模型开发和部署流程中。


