- '# 13. 评估算法偏差的风险


  上一章为明智决策奠定了基础，即在使用算法解决决策问题时，它是否比人类判断、简单标准或掷骰子等替代方法更好或更差。该讨论得出的结论是，根据经验，在许多情况下，算法能比替代方法做出更好的决策：它们犯的错误更少（尤其是因为人类决策往往偏差更大），并且可以更快、成本更低。然而，引入算法进行决策可能会以产生新的偏差为代价。


  在第 15 章中，我们将讨论如何通过分析来确定现有算法是否存在某种形式的偏差。但这只能在算法开发完成后进行。如果你仍处于设计特定决策方法的阶段，并且只是将算法视为一种可能的选项，那么你需要在实际投资开发算法之前，了解算法偏差的风险。因此，本章将从概念层面阐述如何区分算法偏差风险高和低的情况。


  保险公司通常通过分别评估损失的频率和严重程度来量化风险。类似的区分在此处也很有帮助。我们将讨论哪些因素会导致算法偏差的可能性，以及哪些因素会导致偏差发生时的严重程度。


  ## 评估损失严重程度


  评估有偏差算法造成的损害，一种方法当然是伦理考量。然而，对于商业决策而言，风险通常需要从经济角度进行量化。算法偏差造成的经济损失来自三个方面：法律风险、声誉风险和模型性能。伦理考量则体现在其是否被法规和公众舆论所反映。


  *   **法律风险** 指的是那些转化为法律禁止的对个人或案件的歧视的偏差。法规通常划定严格的红线（例如，法律可能禁止基于性别或年龄的歧视），违反此类法律法规可能会招致巨额罚款，甚至吊销营业执照。


  *   相比之下，**声誉风险** 则是灰色、模糊的界限，可能迅速变化。算法任何完全合法的歧视行为，如果被认为不公平，并且算法偏差的证据通过社交媒体等途径传播开来，仍然可能激起公众的愤怒。


  *   **模型性能** 是一种纯粹的**业务风险**。算法的偏差可能产生反效果，例如，如果它引发恶性循环，或者人群向算法存在有害偏差的类别转移，从而导致业务损失。


  对这些风险的量化通常会受到机构风险偏好的影响。激进的冒险者可能会选择游走在法律边缘，并在声誉风险上进行有计划的赌博（例如，赌某种偏差不会为公众所知）；谨慎的组织则通常采取安全策略，严格遵守法律界限（通常比法院更严格地解释法律），并最大限度地降低任何声誉风险。而模型性能风险可以通过频繁且快速的模型性能测量来部分缓解，这使得机构能够在决策结果中出现有害偏差时迅速进行补救。


  因此，风险评估将涉及你根据具体业务背景，对算法偏差的法律、声誉和业务影响所具备的知识和评估。一个风险极低的例子是典型的营销模型，用于决定向哪些客户发送营销优惠。假设你是一家在线书商，你使用算法来确定哪些客户会收到推销本书的营销邮件。显然，*每个人*
  都想阅读这个激动人心的话题——但如果你的营销算法歧视那些过去购买过多本编织书籍的客户，并错误地认为那些织袜子的老奶奶们并不深切关心算法偏差问题，那么这不太可能危及你作为书商的生计。每当你在“无害”的选择之间进行优化时，算法，尤其是机器学习生成的低成本算法，都承诺带来巨大的收益，而几乎没有任何负面影响。


  另一方面，某些算法的应用可能带来极端负面影响。一个非常有争议的领域是刑事起诉。诸如是否允许嫌疑人保释或是否假释囚犯等决策，是经典的、适合使用统计算法的决策问题，并且有充分证据表明，如果此类决策由人类做出，偏差可能会悄然出现。然而，如果这样的算法本身存在任何偏差，显然将构成对公平和民主原则的严重违反。鉴于算法本质上不考虑特定案件的“独特”情况，关于此类决策在多大程度上应由算法做出，可以展开健康的辩论。如今，大多数社会选择人工（司法）决策流程，尽管有人可能会争辩说，如果法官的决策基于经过精心校准的算法所提出的非约束性建议，这种混合方法可能更好，因为它有助于抵消法官决策中可能存在的任何偏差。


  其他偏差会带来高成本的领域包括医疗决策和信贷承销。例如，在美国，信贷承销受到严格监管，歧视受保护的客户群体不仅违反民主理想，还会带来严厉的处罚。如果算法哪怕存在一丝针对受保护群体的偏差风险，那么使用算法可能取决于数据科学家能否证明不存在非法歧视。这可能对数据科学家选择建模技术和数据产生重要影响。


  对于医院来说，如果患者因算法拒绝了一项关键的医疗程序而死亡，即使大多数从业者认为该患者是理应接受该程序的典型病例，这也可能构成极端的声誉风险。即使算法以极高的置信度建议采取特定行动方案（例如，表明某项特定程序有
  99.9%的概率失败），如果该程序被认为是此情况下的标准治疗方法，而拒绝它将带来不可接受的声誉（以及潜在的法律）风险，人类决策者仍可能决定继续进行该程序。


  业务风险的大小通常由所涉金额决定，这就是为什么大多数机构通过交易金额（例如，贷款、投资或发票金额）来限制算法的自动决策。更成熟的机构会根据客观的风险调节因素调整金额。例如，银行可能会根据抵押品价值调整贷款金额，而对于金融投资，则可以使用更复杂的风险指标，如风险价值。在贸易融资中，使用简单的标准来界定算法决策的范围，例如是否涉及高风险国家，或者两个贸易方之前是否有过交易。




  ## 评估偏差倾向


  一个算法表现出有害偏差的可能性，与评估偏差后果的严重程度是相互独立的。先评估损失倾向（即有害偏差发生的可能性）还是损失严重性，可以根据便利性决定；然而，最终决定行动方案的往往是损失严重性，因此最有效的方式可能是先评估严重性。


  要全面评估算法的偏差倾向，自然需要审查第二章中讨论的算法偏差完整清单。为了快速审查，我建议采用以下实用的三项检查清单：


  *   该算法是否正在取代一个已知在过去曾受偏差影响（例如，招聘决策中的性别或种族偏见）的现实世界决策过程？


  *   用于开发算法的历史数据是否极其稀疏（例如，低于 200 个案例，或少于数据科学家通常使用的样本量的十分之一）？虽然存在相对稳健的建模技术，例如对 600
  个观测值样本进行逻辑回归，但许多机器学习技术（如基于树的方法）在如此小的样本量下实际上会失效。


  *   用于开发算法的历史数据是否存在实质性缺陷？例如，样本选择存在偏差（例如，案例是由被怀疑有偏见的人类选择的），或者预期行为与其余人群不同的特定人群子群体缺失，或者数据采集的时期与未来预期的情况存在实质性差异。


  如果你对以上任何问题的回答是肯定的，那么存在较高的偏差风险。这意味着什么？除非严重性可以忽略不计，否则你可能首先需要采取具体措施来应对偏差，例如进行实验以收集无偏差数据（这是后续章节的主题），并且只有在你确信任何有害偏差已被消除后，才引入算法。如果无法做到这一点，你应该考虑是否存在比完全由算法驱动的决策过程更安全的替代方案。


  ## 总结


  在本章中，你探讨了如何以前瞻性的方式量化特定算法存在偏差的风险。关键要点包括：


  *   你应该同时评估偏差一旦发生你将面临的损失严重性，以及算法实际存在偏差的可能性。


  *   损失严重性由法律、声誉和业务风险驱动。


  *   损失严重性的评估既反映了你对特定业务背景的了解，也反映了你的风险偏好（它就像一个应用于最坏情况场景的折现因子）。


  *   高偏差倾向的三大指标是：1）历史结果中存在的人类偏见影响了算法的学习，2）稀疏数据导致统计不稳定性，以及 3）历史数据样本存在实质性缺陷，使其具有偏差。


  *   如果损失严重性可以忽略不计，算法偏差可能不会构成严重问题，有偏差的算法仍可被使用，未来的算法更新可能会尝试采取措施减少或消除偏差。


  *   如果损失严重性为中等，经济上的成本效益权衡可能会发现，在部署算法之前先采取措施消除算法偏差更为可取。


  *   如果损失严重性很高，则不仅必须采取一切可能的措施来避免算法偏差，而且即使残留的算法偏差非常小，决策过程的架构也可能需要增加额外的安全机制，例如对算法决策进行人工验证。


  现在，你能够对算法偏差采取一种更加细致入微的看法：与其在非黑即白的世界里看待算法（认为事物要么全好要么全坏），你了解到算法既有益处、风险，也有成本，并且有时即使是有偏差的算法也比完全没有算法要好。


  你也知道，有时算法偏差无法消除，那么现在让我们讨论如何处理有偏差的算法，以最大限度地减少它们造成的损害。




  '
- '# 14. 如何安全使用算法


  在上一章中，你学习了如何评估特定算法存在偏见的风险。结论是，在许多情况下，我们可能会发现算法存在一定的偏见风险，但基于成本效益分析，该算法仍能比其他方法（例如偏见更严重的人类）做出更优决策。这种情况可以类比于一种能救命但有严重副作用的药物。正如医生会设法减轻药物的副作用，本章我们将讨论你可以采取哪些措施来保护自己免受算法偏见的影响。


  非专业人士应如何应对算法，以避免算法偏见带来的问题？对非专业人士而言，最重要的防线是**明智地使用算法**。


  打个比方，想想一个明智的消费者是如何考虑购买食品杂货和消费食物的：我们中很少有人是专业营养师，或具备必要的医学和生物学知识来理解特定食品的健康风险。更糟的是，如果你关注关于什么对你有益或有害的“最新”见解的新闻流，有时你难免会产生一种印象：即使是科学界也仍在摸索特定食物对我们身体的作用。然而，存在一些广泛且基本的经验法则，能帮助我们依然做出明智的决策。例如，我们知道纤维有益，而过量糖分有害，并且我们意识到均衡营养是避免重大营养失误的良好保障。


  消费者*不应*做的是盲目购买任何味道好的东西——我们知道这几乎必然导致摄入过多垃圾食品——同时我们也知道不应过于轻信广告。因此，明智消费者的一个关键习惯是阅读——阅读产品标签，也阅读偶尔出现的相关主题文章。


  通过阅读本书，你显然已经走在成为明智算法用户的黄金道路上。具体来说，我想敦促你养成三个习惯：


  第一，提问、提问、再提问。用充满好奇的问题向你的数据科学家发问。*好奇的*问题是那些纯粹帮助你理解的问题。不要假设你的数据科学家心怀恶意或向你隐瞒事实——那只会毒害你们的关系，并诱使你的数据科学家采取防御姿态——相反，让你天生的好奇心驱动对话。询问如何准确解读算法的输出，并真诚地惊叹于新的信用评分能够精准定位一组超安全公司，它们无法偿还债务的概率仅为
  0.03%。询问信用评分如何能在不阅读你精心撰写的信贷备忘录的情况下实现这一点，并绞尽脑汁向你的数据科学家请教：如果一家公司伪造其财务报表，可能会发生什么。最重要的是，实事求是地询问算法可能存在哪些偏见，在哪些情况下你应特别谨慎对待其输出，以及什么情况可能导致算法出错。你希望通过这些提问达成的目标是，帮助你的数据科学家更好地理解算法在现实世界中可能遇到的挑战，以及算法最大的弱点可能是什么。这不仅能让数据科学家思考下一版本评分的改进方案，还能更好地监控算法，并通过建议对评分的使用施加特定约束来保护业务成果。你的数据科学家越是将你视为合作伙伴而非批评者或敌人，这种关系就越富有成效。不要假装自己是数据科学家，也不要因为自己不是而被吓退——你的附加值恰恰在于你从一个完全不同的、非技术的视角来解决问题，这与数据科学家的统计视角形成互补。^(³⁸)


  第二，理解算法在哪些情况下缺乏做出有用预测的充分依据，并要求数据科学家为这些情况贴上“未知”标签，而不是给出一个估计值。实际上，许多算法*总是*会提供它们的最佳估计值（即使只是总体均值或一个随机数），而不是诚实地声明“我不知道”，这本身就是一个可能致命的设计缺陷。^(³⁹)
  将某些案例类别标记为“未知”是一个双重明智之举。一方面，它能够实现更优的混合决策流程——例如，这些案例适合进行某种人工干预或采用保守的决策规则。另一方面，它也防止了人类用户被不可靠的估计值所偏见（锚定）——一旦算法提供了一个估计值，这个数字就有可能“自行其是”，并在潜意识中影响任何覆盖性的人类判断，即使完全清楚这个数字纯粹是随机的。这种效应常常因格式设置而被放大——一个
  2.47% 的输出看起来*非常*精确，即使它仅仅是总体均值。算法甚至不会对其最离谱的猜测进行四舍五入！唯一能恰当警示人类用户的输出是“我不知道”。


  第三，要求定期查看有意义的监控报告，如果你认为额外的指标有助于你评估一切是否正常运转，请尝试将它们添加到报告中。正如周到的营养搭配应辅以定期的健康检查，而高胆固醇结果会触发对饮食习惯的审视一样，监控的客观事实性对于检测算法偏见（以及算法的许多其他问题）具有不可估量的价值。事实上，监控如此重要，以至于我们将在下一章详细讨论如何监控算法。只需记住，这些监控报告必须是*有意义的*。这意味着，首先，所有指标实际上都需要对你有意义（否则它们只是在浪费你的时间）；其次，综合来看，这些指标应该相当全面；最后，报告应将你的注意力引向重要的洞察——如果那个高喊“存在偏见！”的指标被埋没在一千个看起来都正常的指标中，那就毫无帮助。因此，好的报告旨在特别将你的注意力引向两类情况：超出“安全”或“正常”值范围的指标，以及显示重大变化的指标。这实际上也是我们大脑持续监控危险的方式——它寻找不寻常的事物（你已经遇到过“怪异效应”），并留意重大变化。我的一位银行客户的经历说明了监控的力量：一个对房屋净值贷款表现非常有意义的指标，即所谓的“年份曲线”的缩放因子，早在
  2005 年就显示出重大变化——比全球金融危机爆发整整早了两年。这个指标相当于海啸的早期预警信号（我们将在下一章讨论校准分析时再次提及）。


  综上所述，这三种实践不仅能让算法用户在不需任何特定技术知识的情况下了解算法偏见带来的风险，还能推动具体的解决方案。


  通过与数据科学家的对话（例如，了解数据弱点）来理解算法偏见的特定风险和局限性，可以为业务方面（例如，对某些类型的案例进行人工审查以及对算法使用的其他限制）和建模方面（例如，对数据进行特定修正、从方程中移除特定变量，或对特定指标进行针对性监控）的预防措施提供依据。而有效的监控则有助于用户检测到新出现的偏见或现有偏见的加剧。




  最后一点说明：在推荐的三种习惯中，第二种（让算法承认自己确实不知道）是最不常见的做法。这颇具讽刺意味，因为苏格拉底曾说过，他比他的雅典同胞知道得更多，是因为他*知道*自己不知道什么（“Έν
  οἶδα ὅτι οὐδὲν οἶδα”，即“我知道我一无所知”）——而其他人甚至不知道自己不知道什么。希望这本书能改变这一点！


  ## 总结


  在本章中，你学习了算法外行用户可以采用的三种习惯，以便在不成为技术专家的情况下掌控算法偏差的风险。需要记住的要点是：


  *   讨论并理解算法的风险和局限性，不仅能使外行用户能够在业务流程中设计适当的防护措施，还能使他们成为数据科学家的思想伙伴，提供高度互补的实际业务洞察。


  *   对于业务用户来说，既不能让数据科学家对他们的工作产生防御心理，也不能让技术术语妨碍以务实的商业语言讨论现实世界的风险，这一点至关重要。业务用户和数据科学家之间的友好讨论对双方都极具价值。


  *   讨论算法的局限性和偏差风险的一个非常实际的成果，是为那些应抑制算法输出、并直接替换为“我不知道”标签的情况，确定客观标准。


  *   在用户应该看到“我不知道”的任何地方，抑制数字输出的出现，对于防止用户锚定在有偏差的值上至关重要。


  *   讨论算法的局限性和偏差风险的另一个非常实际的成果，是定义一套量身定制的监控机制。


  在下一章中，你将更深入地探讨监控这一主题，不仅将主动监控视为防止算法已知弱点爆发的一种方式，还将把它作为一种技术，用于检测那些概念上看似合理、但算法中却存在意外偏差的情况。随后，你将更广泛地探索处理有偏差算法的管理策略。


