  ## 特征级机器学习


  在处理**非常**细粒度（因此也很大）的数据时，机器学习相比其他技术具有特殊优势，例如，每个观察单位（如患者或贷款申请人）都有大量交易数据，比如来自连续血糖监测系统的读数或信用卡和借记卡交易。它也有明显的缺点，例如，如果分类变量包含非常罕见的类别，或者数据中存在事后偏差，则容易过拟合（即变得不稳定）。那么，为什么不将机器学习的应用限制在那些专门从机器学习表现最佳的数据源中提取的特定特征上呢？


  如果你使用机器学习从特定数据输入中构建一个独立的估计值，你就得到了一个复杂的、希望是高度预测性的特征，然后你可以小心地将其嵌入到一个手工方程中——这意味着你可以应用任意数量的修改或约束来保护算法免受偏差影响。事实上，这种方法甚至为使用联邦机器学习开辟了可能性——在这种方法中，用于开发算法的数据分布在多台机器上（例如，许多不同用户的手机或物联网冰箱），并且永远不会合并成一个可供数据科学家审查的大型数据库；该方法在每个设备上估计一个独立的算法，然后仅将算法本身发送到中央服务器，中央服务器利用所有算法的聚合来不断提出一个优化版本，并将其分发回所有设备。


  如何控制这些特征取决于你所选方法的复杂性。一种称为**遗传算法**的方法会创建并测试各种变量变换，然后将找到的最佳变换发送给你；这些变换通常仍然足够透明，领域专家可以判断该变换是否有意义，并且从偏差角度来看是否安全。


  其他方法则会使特征成为一个黑箱。例如，考虑一个通过视频聊天招聘分行销售人员的流程。由机器学习驱动的视频分析可以测量应聘者微笑的时间百分比——这可能是衡量应聘者与客户建立融洽关系能力的一个有用指标，特别是如果算法能够区分假笑（只有一块面部肌肉在动——那块可以受意识控制的肌肉）和真笑（需要两块肌肉收缩，其中一块无法被操纵，因此真正反映了共情的情感状态）。在这里，你无法检查算法本身——相反，需要通过第
  19 章讨论的那种分析来确定该特征中是否存在算法偏差。


  现在假设回测显示，该算法对泽塔双星人比对火星人有效得多——结果，火星人大约有一半的微笑时间，算法未能捕捉到，从而系统性地给火星人打出了较低的友好度分数。


  一位数据科学家通过对复杂微笑特征进行“X 光”检查（例如，她可能观察到了微笑倾向与种族之间的相关性）而意识到这个问题，现在可以通过将原始微笑特征（衡量占总谈话时间的百分比）转换为排名变量来解决这个问题。这如何能消除种族偏差？如果排名是在种族内部计算的，那么“微笑最多的前
  20%”将始终包含所有火星人的 20%和所有泽塔双星人的 20%，即使你的机器学习算法声称微笑最多的火星人微笑的时间还不到微笑最多的泽塔双星人的一半。




  此外，如果在日常运营中突然出现问题（例如，你的模型监控显示，用于计算微笑特征的机器学习算法对穿着暖色调沙漠和日落色系衣服的人群存在巨大偏见，而这恰好是最新的时尚潮流），有一个临时解决方案可以关闭这个单一特征，而无需停止整个算法（如果所有功能都集成在一个黑盒中，这将困难得多）。


  ## 细分


  机器学习算法优于手工推导算法的另一个来源，是能够检测需要不同预测变量集的子细分群体。许多手工主力模型（如逻辑回归）对所有人都应用相同的预测变量集，而数据科学家往往难以注意到存在一个需要完全不同方法（因此需要单独模型）的子细分群体。


  为了兼得两者之长，我首先构建一个手工模型和一个机器学习挑战者模型。然后，我计算样本中每个观测值在两个模型下的估计误差，并由此得出两个模型之间的误差差异。正差异意味着对于该观测值，机器学习模型表现更好；负差异则意味着手工模型表现更好。


  现在，你可以使用经过主成分分析（PCA）优先排序后的预测变量候选列表（参见第 19 章讨论的步骤 3）运行一个 CHAID 树，来预测误差差异。找到具有最大正误差差异的终端节点（即手工模型的平均误差远大于机器学习模型平均误差的那些节点），并追溯定义这些子细分群体的变量和分割点。这些子细分群体是否具有商业意义？它们是否是其他因素的代理变量（甚至可能是建模数据集中未包含的变量所定义的细分群体的代理变量）？


  此类分析得出的经典例子可能包括：在大多数客户为受薪阶层的零售信用卡样本中，存在一个自雇客户群体；或者存在一个规模可观、缺少征信局信息的细分群体。与一线人员讨论这些结果，总能获得宝贵的见解——有时
  CHAID 树只是近似于基于商业洞察应定义的“正确”细分群体。


  请注意，有时细分反映了外部偏见——例如，在一个高度歧视的环境中，火星人往往不被大学录取，你可能会意识到 CHAID 树的建议是为火星人建立一个单独的模型，因为所有与申请人大学教育细节相关的特征只对泽塔双星人有效。你会看到，你可能会很快陷入一些非常棘手的权衡取舍——但这种混合方法的最大优势在于，作为手工数据科学家，你牢牢掌握着决定如何处理数据中这种模式的主动权。


  一旦你确定了一个或两个需要根本不同模型的细分群体，你就可以为它们构建单独的手工算法。结果令人惊叹——通常，通过这种技术，我获得的预测能力不仅与机器学习基准模型相当，而且*更高*（例如，对于二元结果，性能提升可能达到
  1-2 个基尼点，这在某些应用中可能意味着一大笔钱——如果你的信贷组合年亏损额为 5 亿美元，即使只减少几个百分点，也足以让你余生每晚都能在米其林三星餐厅享用美食……）。


  ## 偏移效应


  机器学习算法提供的、手工方法经常忽略的另一个洞察来源是交互效应；即只有多个属性的组合才有意义的情况。例如，如果你的记录显示客户是女性，但与自动语音应答系统交互的声音听起来是男性，那么欺诈者冒充客户的可能性就很高。在这种情况下，存在一个信号，应该向上调整欺诈概率的估计值。完美的手工模型会捕捉到该信号，但除此之外，它仍然可以使用与总体中任何其他案例相同的预测变量集。在这里，创建子细分群体（例如，为女性和男性客户分别建立欺诈模型）会引入不必要的复杂性（和工作量）——相反，偏移效应技术只需向手工模型添加额外的变量。


  迄今为止最简单（且通常足够）的方法是为每个偏移效应添加一个二元指示变量（即所谓的*虚拟变量*）。可以通过引入一个新变量来“修补”模型：如果记录中的客户是女性且声音听起来是男性，则该变量为
  1，否则为 0。你也可以考虑更复杂的调整，例如引入客户性别与声音“男性化”评分的*交互效应*（如果声音听起来不太明确，则“调低”警告信号）。


  最难识别（但通常非常强大）的机会在于，通过将自变量除以一个情境基准来进行归一化。例如，当我构建一个预测新兴市场小企业收入的模型时，我使用了信用卡收款额、用电量和营业面积等预测变量。该模型存在一些偏差，因为在某些行业，每平方米销售额特别高，而在农村地区，信用卡的使用远不如城市普遍。因此，我通过同行的中位数（例如，农村与城市药店的对比）对预测变量进行了归一化，从而得到了一个更强大（也更公平）的模型。


  就像细分方法一样，偏移效应技术也能将混合模型的性能提升到基准机器学习模型之上。而且，不言而喻，这两种技术（细分和偏移效应）甚至可以结合使用，让纯机器学习模型面临真正的挑战！




  ## 第二意见技术


  当你逐一比较人工模型和机器学习模型的误差时，你会发现机器学习模型的优越性能仅体现在*平均*意义上——机器学习模型估计结果劣于人工模型的案例数量，往往与其表现更优的案例数量几乎相当。


  对此情形的一种自然解读是，两个模型产生分歧的案例在某种程度上具有特殊性，因此需要借助人类专家的判断。第二意见方法正是将机器学习模型与人工模型并行运行，并标记出两者差异较大的案例以供人工审核。通过制定规则来标记差异的可能来源（例如，标记案例中可能属于异常的特征——在许多情况下，让人工审核员调整某些输入数据就足以使两个模型达成一致），以及为人工审核规定框架甚至具体步骤（如手动收集特定的补充信息），往往能大幅提升人工审核的效果。事实上，在许多情况下，我创建了一套完整的独立*定性*评分卡，它不仅通过人工审核员系统性地收集了大约
  10 到 25 个额外数据点，还通过我称之为心理护栏的方法主动消除了判断偏差。


  严格来说，通过比较两个竞争模型来标记部分案例进行人工审核，并非一种建模技术。但将其列入我的清单，是为了重申我的信念：数据科学家的最终目标是优化决策问题，而决策过程的最优架构很可能包含统计算法之外的步骤。数据科学家往往处于独特的位置，能够向业务负责人建议这种可能性，并通过倡导这一方法创造巨大价值。


  ## 总结


  在本章中，你了解到数据科学家确实可以两全其美：利用机器学习从数据中提取有价值的洞察，同时仍使用人工技术将偏见排除在模型之外。关键要点如下：


  *   当大数据和复杂数据只能通过机器学习来驾驭时，与其构建一个大型黑箱模型，不如考虑使用机器学习来构建一组复杂的特征（通常每个特征仅使用特定的数据源或数据字段集，从而赋予其严格定义的业务含义）。


  *   当基准机器学习模型的表现优于你的人工模型时，你可以使用 CHAID 树来理解驱动这种优越表现的案例类型。


  *   如果你发现机器学习基准模型的优越表现来自于你的人工模型不适用的特定子群体，你可以考虑为这些子群体构建单独的模型。通常问题确实只集中在一两个这样的子群体中。


  *   相反，如果优越表现来自于交互效应，你可以通过在你的人工模型中纳入额外的变量（例如，指示变量）来捕捉这些效应。


  *   以这种方式通过机器学习增强的人工模型，其表现往往优于机器学习基准模型。


  *   然而，如果即使采用人工方法也无法消除偏见，或者上述技术未能复制机器学习基准模型所获得的洞察，你还应考虑重新审视整体决策过程架构；最佳方案可能是让人工模型和机器学习模型并行运行，并将两个模型预测结果强烈冲突的案例交由人工审核。


  我反驳了“鱼与熊掌不可兼得”这句老话。不过，还有一句智慧之言依然成立：天下没有免费的午餐——因此你必须为你的奇迹蛋糕付出代价。这里介绍的混合方法需要时间，因为它们本质上是手动的。然而，在某些情况下，根本没有时间进行手动模型调优——这一点在自我改进的机器学习算法中尤为突出。当数据科学家更新完一个人工模型时，一个自我改进的机器学习算法可能已经经历了数代更新，使得数据科学家的工作在完成之前就已经过时了。


  因此，在下一章中，我们将讨论如何最好地将偏见排除在自我改进的机器学习算法之外。


  '
- '# 22. 如何防止自我改进模型中的偏见


  机器学习最大的优势之一在于，模型可以在没有任何人工干预的情况下自行构建和更新，从而能够以最快的速度响应结构性变化。正是这种需要自我改进算法的环境（其运行环境的快速变化），也成为了偏见影响算法风险加剧的根源，无论是我们在社交媒体背景下经历过的自我强化的反馈循环（第
  11 章），还是可能使算法对受保护群体产生偏见的新数据。


  因此，在本章中，我将介绍一些特定的工具，它们有助于在自我改进的机器学习模型中控制算法偏见。每种技术的适用性和有效性在很大程度上取决于具体环境，因此我的目的是为你定制模型设计提供有用的指导，而不是描述一种“一刀切”的解决方案。


  为了安全地运行自我改进的机器学习模型，我建议考虑三个要素：


  *   模型机制


  *   一个“紧急制动器”，当实质性偏见的预警信号出现时，它能阻止模型更新版本上线


  *   以及定期对生产环境中自我改进模型的输入、特征和输出进行人工审核（此过程虽不能阻止有偏见的模型上线，但通过尝试快速发现问题来限制下行风险）


  最后，我们将讨论如何处理*实时*机器学习，这是自我改进模型中速度最快的版本。




  ## 模型机制


  在这一类别中，模型设计、数据工程以及估算模型的算法需要你特别关注。


  **模型设计**能够通过“限制”自我改进型机器学习来降低偏差风险，如下面两个例子所示：


  *   通过为火星人和齐塔网状星系人构建*独立的模型*，自我改进算法能够专注于在其同辈群体内进行更优排序，但整体决策引擎不可能对其中任何一个群体产生偏见。


  *   自我改进型机器学习算法也可以仅仅是一个稳定、手工推导模型中的*特征*。例如，简历筛选算法可以是一个手工构建的逻辑回归模型，该模型由针对“技术知识”、“目标达成”和“人员领导力”等方面的离散自我改进型机器学习评分组成。


  **数据工程**部分应将第 18 章中讨论的所有最佳实践导入到自我改进算法的机制中。这尤其意味着：


  *   向算法输入新数据的脚本需要正确应用所有必需的排除规则（例如，非实质性违约）和数据清洗步骤（例如，处理异常值）。

  *   考虑仅使用来自持续随机试验的数据来刷新算法（而不是使用反映算法先前版本所做选择的、带有偏差的反馈）。

  *   在决定从哪个时间窗口提取数据以刷新模型时，应考虑根据特定类型事件或特征发生的频率来调整窗口长度（例如，不要总是只看过去七天的互联网使用情况，要认识到，虽然一个特征（例如，衡量一个人在做出决定前探索多种选项程度的特征）可能在七天的窗口内找到足够多的数据点，但另一个特征（例如，将特定网站或搜索词映射到风险画像的特征）可能需要一年的数据量，因为它处理的是分类变量，其中许多值相当罕见，因此七天的数据量会使大多数术语的映射在统计上不具结论性（从而为偏见大开方便之门）。

  *   正确识别未知值——新类别突然出现存在真正的危险，因为它们常常会被意外地解释为其他东西。这是因为将分类数据映射到风险指数或分组的代码通常包含一个“其他所有”子句（例如，一个自动将素食菜单项与非素食菜单项分开的算法，可能首先将含有鸡肉、牛肉、小牛肉、羊肉、鹿肉或麋鹿肉的项标记为“肉类”，然后搜索表示鱼或海鲜的关键词，并将所有其他项标记为“蔬菜”，从而迅速将你的新天竺鼠菜肴当作土豆处理）。正确的处理方式是定义一个“我不知道”类别，并可能将此类情况路由到异常处理例程中（即，在没有人工干预的情况下不做出自动决策）。

  *   考虑将自动偏差检测例程嵌入到你的脚本中，这样如果数据中出现了新的偏差，脚本可以发出警报，并且自动更新甚至可能被暂停。


  而对于**估算模型**的脚本，我特别推荐以下两个保障措施：


  *   限制自我改进算法可以创建和测试的特征类型。有些脚本会创建数千个变换，包括，比如说，账号余弦值的立方，如果这样一个深奥的特征在初始模型开发期间从未出现过，那么它在模型中的突然出现就值得怀疑，更有可能通过过拟合数据引入新的偏差，而不是构成对深奥数字命理学的突破性洞察。

  *   编写一个彻底的自动验证例程，该例程至少应包括一个期内留出样本和一个期外验证样本，但也可以包括一个专门针对偏差和估计稳定性指标进行测试的特殊“考试”样本。在我自己的工作中，我经常使用一个程序，该程序生成数千个候选模型，按预测能力或业务影响排序，然后逐一验证，直到找到一个能通过所有测试的模型。鉴于我对模型稳健性的执着，第一个模型很少能通过所有测试，但大多数时候，最终选定的模型表现并不差太多。


  对自我改进型机器学习算法施加此类约束的设计，当然面临着在榨取最大预测能力（这可以转化为实际业务价值）与降低有害偏差风险的稳健性之间进行权衡。如果你想两全其美，还可以考虑运行一个系统，其中生产环境中的自我改进算法受到严格约束，同时并行运行一个纯粹用于基准测试的“自由式”自我改进模型，如果该算法通过考虑你的信用卡号码余弦值的立方发现了显著的性能提升，那么一个警报就会出现在你的桌面上。




  ## 设计紧急制动装置的考量


  紧急制动装置是对我们之前在模型估计中讨论的自动化验证流程的补充；它重点关注模型输入和模型输出的持续流动。


  在设计紧急制动装置时，有两个决策尤为突出：触发条件是什么，以及触发后的影响是什么。


  区分“紧急制动”的触发条件与那些仅会在自我改进模型实施后的人工审查中引发关注的事项，这本身是主观的，取决于风险偏好以及实际考量。相关指标必须能够提供一个客观的触发标准，并且误报的数量必须是可以接受的。


  在安全性与控制误报数量之间进行权衡校准，可能需要一些试错过程；如果模型方程的大多数更新都会触发人工审查，那么你实际上就不再拥有一个自我改进的算法了。为了设计出合适的紧急制动装置，我建议采用一个三步法：


  1.  编制一份你希望在实施后进行监控的完整指标清单（参见下一小节），并为每个指标定义你的风险偏好（即，你愿意接受多大的性能变化或恶化程度）。


  2.  在你自我改进算法的模拟运行中，基于历史数据对你的假设指标进行回测，并追踪每个指标触发警报的频率；对于那些导致误报过于频繁的指标，考虑是更改紧急制动装置的触发点，还是完全放弃该指标。


  3.  启动自我改进算法，并持续追踪每个指标触发误报的频率；重新审视任何过于频繁触发误报的指标。


  你还需要决定当紧急制动被激活时该怎么做：是希望冻结（即保留）模型的先前版本，直到自我改进版本经过人工评估，还是希望完全暂停决策流程？这将取决于环境是否发生了重大的结构性变化，或者仅仅是算法的最新迭代出现了问题。自我改进算法可以通过在最新数据上同时测试其自身先前版本来评估这一点；如果这也触发了紧急制动，那么继续使用任何算法进行自动化决策似乎都不够审慎，此时应暂停自动化决策。


  紧急制动装置的理念也可用于监管自我改进算法。例如，目前机器学习在医疗用途上存在一个问题，因为美国食品药品监督管理局将算法的每一个更新版本都视为需要重新审批的新“设备”，这导致了一个长达两年的行政流程。相比之下，一种更基于触发条件的安全监管方法，在一些实行车辆强制安全检验的国家已有先例：车辆获得上路许可的期限可能为几年，在此期间，只有对车辆进行实质性改动才会触发立即进行新安全检验的要求（但安装更大的后视镜或贴上宣传本书的保险杠贴纸则不会）。


  ## 模型监控


  你应该监控哪些指标？我建议追踪模型的四个前瞻性方面：


  *   群体画像


  *   模型输出（预测结果）


  *   模型属性


  *   样本外验证性能


  群体画像可以通过对案例重要属性（例如关键模型输入，以及可能由业务用户积极追踪的其他一些属性，如银行通常追踪按征信机构评分划分的贷款申请人分布，即使其信用评分算法使用了比该汇总评分更细粒度的输入）进行分布分析来衡量；这是检测群体结构性变化的一种有效方法。


  你也可以对“基础群体”（例如，初始模型开发所用的样本）进行聚类，并衡量最新样本中远离所有原始聚类中心的案例百分比；如果该比例上升，则很可能有新的细分市场或画像进入了该群体。虽然这正是自我更新算法设计所要应对的情况，但这同时也意味着可能需要进行额外的人工验证，因为你可能没有正确的输入数据来预测这个新细分市场的结果。


  在这样做时，重要的是参考群体是“冻结”的（例如，数据科学家在开发自我改进算法的初始版本并确定各种参数和约束时所使用的样本），否则算法可能会“打盹”（甚至被操纵），尤其是在异常检测是其主要目的的情况下（例如，在欺诈和网络安全领域）。就像细菌如果最初只摄入少量抗生素就可能产生耐药性一样，如果某种特定类型的“异常”交易数量从非常小开始，然后逐日缓慢增长，那么将今天的群体与昨天的群体进行比较的算法可能不会发出警报。


  **模型输出** 指的是第 15 章讨论的前瞻性指标；如果你突然发现批准率或平均预测收入出现偏离，那么你的模型很可能感染了偏差错误。


  **模型属性** 指的是我们在第 15 章中关于 XAI（可解释机器学习）和监控自我改进算法的讨论。


  **样本外验证** 计算两组分析：


  *   在第 15 章中讨论的、基于某些可获得结果标签的历史验证样本计算出的回顾性指标

  *   算法新版本与某个早期参考版本之间模型输出分布的比较


  对这些指标的人工审查补充了自动化触发的阈值。群体画像或模型输出的重大变化可能触发紧急制动；模型属性的重大变化或样本外验证中的显著问题，本身就应该触发模型估计过程拒绝该算法。


  这意味着对这些指标的人工审查将更侧重于以下情况：某个指标处于“黄灯”区域（谨慎地发出警告但未越过红线），或者这些指标呈现出恶化的*趋势*。我们想知道，基于这些数据，人工审查员是否能够拼凑出一个确实令人担忧的趋势，或者洞察到现实世界中的某些变化是如何逐渐侵蚀决策系统所采用的分析方法的，这可能需要你从根本上重新思考应该使用哪些数据来做出当前的决策。


  此外，第 15 章中讨论的关于排序能力和校准度的回顾性指标也应受到监控。如果在审查此处讨论的指标时结果已经可用，则可以将它们包含在同一份报告中；否则，由于时间延迟，这将是一个独立的监控流程。对这些指标的监控与传统模型并无不同。


  最后但同样重要的是，如果你面临对特定偏差（例如，火星人是否受到歧视）有特别担忧的情况，你可以将模型输出与受保护变量之间相关性的直接测量结果包含在本报告中，正如第
  19 章步骤 5 中所讨论的那样。




  ## 实时机器学习


  在结束本章之前，我想简要谈谈实时机器学习。虽然其他类型的自我改进机器学习算法会经历按固定时间间隔（或由某些事件触发）开发的离散版本，但实时机器学习会持续产生新算法。有多少新案例流入系统，就可能产生多少个新版本。


  实时机器学习并非适用于所有场景。它还需要实时标注（即定义每个案例的结果，例如好/坏指标），而每当标注需要人工干预或实际上是一个批处理过程时（例如，如果账户逾期
  90 天未付款则发生“违约”，这发生在午夜钟声敲响或会计系统进行日终处理时），这些过程将定义算法可能进行自我改进的最早时刻。


  然而，如果实时机器学习确实发生了，比如在搜索优化中，点击数据流与新的搜索查询一样快速涌入，你该怎么办？此时，实时紧急制动既不可能也没必要。它们（可能）不可能，是因为速度方面的考量（算法必须以闪电般的速度进行评估）；但它们也没必要，是因为算法的稳定性偏差。单个观测值能够显著改变算法的可能性，就像一只鸟推动超级油轮就能让船转向一样。


  也就是说，除非这只鸟背上了喷气背包——或者新数据点是一个极端杠杆点。单个极端异常值确实有能力使算法产生偏差，因此不仅会带来意外偏差的风险，还会带来蓄意操纵的风险。我可以很容易地想象到，在某些应用中，存在大量经济激励来这样做，例如试图智胜自动交易算法（那些在股票和外汇市场进行交易的机器人）。而单个数据点无法实现的目标，或许可以通过一连串被操纵的数据点来实现……


  因此，保护实时机器学习免受偏差影响需要双管齐下的方法。一方面，密切关注输入数据至关重要——自动数据清洗（对数值进行下限和上限设定，或以其他方式防范异常值）应与对输入数据异常的专门监控相结合，特别是当可能存在对贵组织有加害意图的人时。


  另一方面，你需要运行一个后台进程，该进程以频繁、固定的时间间隔评估紧急制动的触发条件，并在出现问题时进行干预（当然，这包括输入数据的问题）。


  ## 总结


  自我改进算法本质上是自动驾驶开发的。为了设置这种自动驾驶以防止偏差，有几种做法尤为突出：


  *   **模型设计**可以通过有意地将自我改进的机器学习算法限制在总体模型设计框架内，来限制算法偏差的危险。


  *   **数据工程**需要仔细嵌入所有相关技术，以防止算法偏差通过自动化数据馈送潜入。


  *   **自动化模型估计过程**可以通过对自动特征生成施加约束，并自动验证模型的每个新版本，来限制偏差风险。


  *   **紧急制动**会自动监控群体概况和模型输出，如果一组经过精心选择和校准的触发条件发出警报，则要么回退到安全的早期模型版本，要么停止整个自动决策过程。


  *   **定期（事后）人工监控**是对抗偏差的自动化保障措施的补充。


  在本章及前四章中，我们讨论了作为数据科学家，如何系统地将对抗算法偏差的技术整合到你自己的模型开发中。然而，如果你管理着一个数据科学家团队，仅仅了解这些技术是不够的——你还需要思考如何将这些技术制度化。这将是本书最后一章的主题。


  '
- '# 23. 如何将去偏机制制度化


  作为顾问，我学到的第一件事就是：想出好主意很容易——真正的挑战在于实施它们！在阅读了本书的 22 章之后，你的头脑中想必充满了关于如何对抗算法偏差的好主意。但如何将其付诸实践呢？特别是，如果你要监督几百名追赶截止日期的数据科学家，而他们又通过表现出应有的过度自信偏差来证明自己是凡人，该怎么办？


  在本章中，我将介绍七个具体步骤，将本书讨论的去偏实践制度化到你的组织中。这些步骤涉及：


  *   数据流与数据仓库

  *   标准与模板

  *   重要性框架

  *   校准

  *   模型验证

  *   模型监控

  *   持续生成无偏差数据


  ## 数据流与数据仓库


  我们可能生活在机器学习时代——但我们也可以说，我们生活在首席数据官（CDO）时代，这是一个许多组织采用的新角色，旨在确保获取“新石油”，即数据。在整本书中，我强调了数据的重要性——因此，保持模型无偏差通常也需要对数据质量进行投资，主要通过增加对数据流的控制和自动化（例如，确保数据的完整性和“单一事实”，即对于给定对象的给定属性，组织的
  IT 系统应提供单一（且真实）的答案——令人惊讶的是，当询问某个客户借了多少钱时，一些银行的 IT 系统会提供多少种不同的答案）。


  首席数据官还可以承担其他不那么显而易见的职责：


  *   建立一种万无一失的方法来访问历史数据，且无数据泄露；

  *   寻找并提供企业级访问外部数据的途径，以补充或替代有偏差的内部数据集；

  *   建立标准流程来检测数据集中的偏差，并向业务部门警示偏差的存在；

  *   通过发布权威数据字典（从而防止因对数据含义的误解而可能导致的偏差），以及发布关于已知数据限制和其他隐藏偏差来源的指南，来提高组织的数据素养。




  ## 标准与模板


  每位数据科学家都有自己偏好的建模方法，这既反映了他们最熟悉的技术，也体现了其根深蒂固的信念；改变这些做法并非易事。尽管如此，我发现结合使用两种工具对于改变实践最为有效：


  *   创建一份定义你所负责领域“标准”的文档——当我第一次组建一个大型建模团队时，我谦逊地将我的最佳实践合集称为“我们的圣经”，并孜孜不倦地培训每一批新员工，让他们掌握这些标准，因为这是塑造数据科学家方法论的最佳时机。


  *   创建模板，通过为流程中的特定步骤规定特定输出，来隐含地引导某种方法。


  第 18 章的表 18-1 就是这样一个模板的例子——强制规定模型文档的特定格式，对于推行一套实践方法大有裨益。我还为模型开发过程中的特定步骤创建了模板，例如第
  19 章的表 19-1 和表 19-2，或者主成分分析的格式。


  遗憾的是，许多模板被束之高阁，无人问津。为了真正让它们得到应用，你可能需要运用另外两种技巧：


  *   管理者必须自上而下地顽固推行模板的使用，包括你自己——直接拒绝查看任何未使用规定模板的内容，并确保层级较低的管理者（例如你的团队领导）也这样做。如果温和的督促不够，可以考虑将“使用正确模板的分析占比”作为一项正式追踪的指标，如果同侪压力仍不足够，则将其纳入团队领导和其他管理者的
  KPI（驱动薪酬的关键绩效指标）中。


  *   让你的团队创建现成的脚本，尽可能自动化地生成标准输出（例如我在表 19-1 和表 19-2 中展示的报告），并且要审慎（你不希望在你希望团队进行深度思考的地方提供现成脚本！）。便利性是影响行为的另一个有力杠杆，而且显然比强制手段感觉好得多！


  ## 重要性框架


  古老的德尔斐神庙上刻有一句多立克式的箴言：“μηδεν αγαν”，意为凡事勿过度——希腊哲学家将其称为“中庸之道”。在提升组织对偏见的认知时，请谨记这一古老智慧。由于大多数现实生活现象中都存在一定程度的偏见，过度担忧偏见可能会使你的团队陷入瘫痪，仿佛无偏数据突然变得几乎不可能获得。


  如何划分无关紧要的偏见与值得关注的偏见之间的界限，将取决于许多因素，包括你所在行业的法律要求、特定类型的决策、你所处文化和市场中的文化敏感性，以及你和所在组织的风险偏好与信念。当你开始向算法偏见宣战时，你可能需要首先清晰地阐明你认为最大的问题在哪里以及为什么（这既能聚焦初期努力，也能为什么是“问题”设定一个基准），然后随着时间的推移，尝试更概括地阐述哪些偏见是不可接受的，而哪些情况则被视为无关紧要。


  ## 校准


  如第 4 章所述，将算法输出转化为决策涉及两个重要的校准步骤：*中心趋势*的校准和*决策规则*的校准。


  **中心趋势**是你想要预测的对象的平均值——从统计学上讲，这与你在第 3 章中遇到的方程中的常数项 c 有关。一个经常被忽视的细节是，这种校准应反映你*在未来*将遇到的平均结果——而一种经典的稳定性偏见是将其校准为过去观察到的平均值。例如，当我校准一个信用评分卡时，我需要将其校准到我在未来（比如）12
  个月内将遇到的投资组合违约率。数据科学家会知道吗？


  嗯，除非数据科学家还有一份通灵师的副业，否则他不可能知道。业务人员最接近这个问题，但可能被严重的利益偏见所蒙蔽。因此，我始终建议我的客户将这一校准决策变成一个定义明确的委员会决策（例如，在银行中，代表业务和风险管理双方的信贷委员会自然适合做这件事），并且理想情况下要明确地对流程进行去偏（例如，通过使用不同技术运行多个预测模型来创建强有力的锚点，如年份模型、使用滚动率的动量模型，以及使用宏观经济因素的时间序列模型）。


  **决策规则**定义了在“是”（可能意味着从发放新信用卡到提前出狱等各种情况）和“否”之间划清界限的位置——而这一划界行为可能包括为补偿算法偏见而进行的特定调整，如第
  16 章所述。与中心趋势的情况一样，公平且审慎地促成此类调整的方法，是将决策规则的校准提升为一项明确的管理决策，而不是将其埋没在一个只提供神奇“是/否”决策的黑箱算法中。


  ## 模型验证


  如第 18 章所述，对数据科学家的工作进行独立验证具有巨大价值——它有可能破除从因疲劳数据科学家的疏忽造成的偶然偏见，到该数据科学家被两层厚的过度自信所掩盖的根深蒂固的偏见等各种问题。在我管理数据科学家团队的职业生涯早期，我曾有过非正式同行评审的乌托邦式梦想，但我不得不得出结论，有效的同行评审发生的概率，就像你的猫央求你每天给它洗澡一样。^(⁶⁴)


  正式验证还有一个额外的好处，即它也可以成为执行标准和模板的强大力量——如果你所在组织的治理规则要求验证团队在实施新算法之前签字批准，并且如果验证团队拒绝查看任何文档未遵循你定义模板的模型，那么你至少在这场战斗中获胜了！


  我必须承认，正式验证这个想法并非我的原创——一些聪明的银行监管者在这方面走在了我前面，如今在金融行业，大多数司法管辖区都要求某种形式的正式模型验证。事实上，今天所缺失的是对经典箴言更广泛的了解，特别是德尔斐神庙的铭文，因为如今许多银行正遭受着我认为是*过度*验证实践的困扰，正如第
  18 章简要讨论的那样。


  在企业界，情况则大不相同，许多组织才刚刚开始广泛使用算法，因此验证实践充其量也只是处于萌芽阶段。我应该指出，正式模型验证实践在对抗算法偏见方面的价值几乎算是一种附带福利——有缺陷的模型通常可能产生重大（甚至灾难性）的业务影响，因此，如果开发算法有商业理由，那么进行正式验证很可能也有强有力的商业理由。




  ## 模型监控


  德尔斐神庙上似乎缺少一句智慧箴言（反而被一个无法考证的消息来源归功于一位名叫加布里埃尔·贝尔的十五世纪作家）^(⁶⁵)，那就是“一分钱一分货”。对企业而言，这意味着如果你真的想让某件事发生，只需花钱雇人去做。而模型监控正是值得雇人来做的一件事。


  在这方面，银行一直处于领先地位，但即便在这个行业，几年前我也发现一家银行对已使用超过七年的模型从未进行过监控。那个模型仅仅因为通货膨胀就产生了偏差——它有一个特征是将申请人的收入与“平均”收入进行比较，如果这个平均值取自理发还只要
  25 美分的年代（我只是*稍微*夸张了一点），那么每个申请人都像是小约翰·D·洛克菲勒的富豪兄弟。


  这个轶事指向了一个更根本的挑战：包括银行在内的许多公司实际上都难以追踪它们使用的所有模型。虽然一些“高知名度”的模型由中央职能部门进行正式验证和监控，但总部可能根本不知道巴布亚新几内亚分行下属子公司运营的小额个人贷款业务所使用的某个模型。直到最近，银行监管机构才开始正式要求银行建立“模型清单”，这一举措揭示了许多有趣的事情。


  这不仅暴露了一些模型在“雷达之下”运行且缺乏适当监控，还揭示了另一个问题：有些模型被机会主义地使用（例如，它们被用来批准那些看起来会被模型通过的贷款，而对于看起来会被拒绝的贷款申请则绕过模型），这本身就引入了一种新的决策偏差。


  为了确保偏差一旦在组织的某个地方出现——无论是流入算法的数据还是算法输出的结果——都能被可靠地检测出来，因此指派专人或者团队来监控模型至关重要。他们的工作职责应明确包括：编录组织中使用的所有模型，并确保每个模型都受到监控，除非该模型不重要或监控不经济。


  一个最佳实践是，明确的规则将持续监控中出现的严重问题转化为强制性的补救措施，这些措施可以包括从数据科学家审查情况到暂停算法等一切行动。并且，为了避免过度自信且带有偏见的人类在意见不合时绕过算法，监控应覆盖整个决策过程，包括人工干预以及未咨询算法而做出的决策。


  ## 持续生成无偏差数据


  冒着听起来像老生常谈的风险，我想最后一次重申，努力确保持续获得新鲜、无偏差的数据流以测试和优化算法的重要性。根据我的经验，在这方面表现出色的组织，并非因为某个数据科学家的个人努力——他们已经将测试和学习内化为一种文化，如果提出一个新产品或其他商业创意却没有生成此类数据的计划，同事们投来的困惑目光，就像你给一个巴伐利亚人端上一根白香肠（Weißwurst）却没有配上足量的甜芥末一样。


  因此，要真正消除算法偏差，重要的是高级管理人员要定下基调：他们需要理解算法偏差可能出现在哪里，询问同事们在涉及算法的任何事务中采用了哪些技术来遏制偏差，并在适用时询问未来收集或生成无偏差数据的方法。这通常需要开展明确的实验或其他数据收集工作，并为此编制预算。


  ## 总结


  在最后一章中，你探讨了在大型组织中嵌入去偏差化的挑战，并学习了七项重要实践：


  *   完整且无偏差的数据需要投资于数据流的自动化以及“单一事实来源”的数据仓库建设。首席数据官是一个新兴角色，正越来越多地倡导和协调这些工作。

  *   标准和模板是培训员工的有效方式，也是强制执行防止算法偏差的一致方法的绝佳基础（但还不够）。

  *   重要性框架对于防止因过度偏差恐惧症而导致的瘫痪至关重要。

  *   校准是将算法输出转化为决策的重要步骤，这应提升到管理决策层面，而非作为数据科学家黑箱设计的一部分。

  *   模型验证对于对抗数据科学家的偏差和执行标准具有不可估量的价值，但前提是它必须被正式授权。

  *   模型监控是对模型验证的补充，但同样需要正式化才能可靠地执行。

  *   持续生成无偏差数据是解决算法偏差问题的关键部分，高层管理人员应将其作为信条和企业文化的一部分来拥抱。


  至此，我们结束了在算法偏差世界中的旅程。我们既未能找到对抗它的灵丹妙药，也未能找到多少算法偏差会消失的保证。然而，我希望你已经对算法偏差的众多来源有了透彻的理解，并且学到了具体且实用的步骤，无论你的角色和专业水平如何，都可以采取这些步骤来检测、管理和预防算法偏差。


  临别之际，我与你分享最后一份清单——这是一份我有时会与数据科学家分享的、半开玩笑的“十诫”，尤其是在处理信用评分卡时（尽管它们适用范围更广）。幽默往往比严厉的警告传播得更快更远，所以请随意在你的组织中分享这份清单，作为你对抗算法偏差征程的一部分。



  ### 模型开发十诫


  1.  你应当阅读并应用本手册，因其内容优良，且是许多惨痛教训的结晶。


  2.  你应当始终从理解业务用户如何使用评分卡开始并结束你的建模工作，因为评分卡只是一个工具，而错误的工具落入错误的人手中，可能成为致命的武器。


  3.  你应当始终让你的工作暴露在阳光下。业务用户就是阳光，因此你应通过几乎每天向业务方的项目对接人分享精心整合的输出来让阳光普照。


  4.  你应当始终审视数据，因为不用眼睛观察事物的人是盲人，而盲人有时意识不到致命的危险。


  5.  你绝不应使用你不理解或无法解释的变量或特征，因为魔鬼可能隐藏其中。


  6.  你不可在同一模型中使用高度相关的变量，因为它们是魔鬼施展黑魔法的工具。


  7.  你应当始终在不大幅损失性能的前提下，尽可能保持一切——模型结构、特征、建模技术——的简洁，因为魔鬼隐藏在复杂性背后。


  8.  你应当尽可能保持特征和得分的连续性，因为阶梯即是悬崖，许多人因坠崖而亡。


  9.  你应当始终在全新的、未使用过的数据上彻底验证模型，因为不用新数据验证模型的数据科学家，只是在解读魔鬼摆布的茶叶渣。


  10. 你应当始终思考你的模型表现薄弱的那些大批量案例（例如，由于系统性缺失值或不同的行为特征），因为细分之神说，在你的第一个模型失效之处，你应当拥有其他模型或模块。


