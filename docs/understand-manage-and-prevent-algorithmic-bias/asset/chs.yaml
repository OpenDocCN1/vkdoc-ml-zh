- '# 2. 人类决策中的偏见


  正如你将在后续章节中看到的，算法偏见在许多方面源于或镜像了人类的认知偏见。因此，理解算法偏见的最佳起点是理解人类偏见。虽然通俗地说，“偏见”通常被认为是一件坏事，是体贴、善意的人会避免的，但实际上，它是人类大脑运作方式的核心。原因是，大自然需要同时解决三个相互竞争的目标：准确性、速度和（能源）效率。


  *准确性*是一个显而易见的目标。如果你外出捕猎，但一个功能不佳的认知系统让你在遇到的每第二棵树干或岩石上都看到一只动物，那么你显然很难猎到任何可吃的东西。


  相比之下，*速度*常常被忽视。在野外生存往往取决于毫秒之间。如果一只老虎出现在你的视野中，你的额叶——逻辑思维的区域——至少需要 200 毫秒才能识别出你正盯着一只老虎。到那时，老虎很可能已经向你扑来，不久之后，你作为老虎早餐的生命就将终结。我们作为一个物种的生存，很可能取决于大自然能否将“战或逃”反射的触发时间缩短到
  30-40 毫秒——这区区 160 毫秒的差异，就决定了是走向灭绝，还是如某些说法所言，成为万物之灵！正如约翰·科茨在其著作《狼与狗的时间》^(⁶)中详尽描述的那样，大自然不得不通过一系列令人难以置信的调整和技巧来实现这一点。解决方案的一个关键方面是：如有疑问，就假设你看到了一只老虎。正如你将看到的，偏见因此成为大自然加速决策的工具箱中的一个关键项目。


  *效率*是大自然处理思考和决策方式中最不为人知的方面。你很可能从小相信，逻辑的、有意识的思考就是你大脑所做的一切。你要是知道真相就好了！实际上，大多数思考是在潜意识中完成的。即使是感觉像有意识的思考，也常常是有意识和潜意识思考之间的来回互动。例如，想象你今晚想出去吃晚饭。你会选择哪家餐厅？请在此暂停，并实际做出一个选择！准备好了吗？你做出选择了吗？好的。这是一个有意识还是潜意识的选择？你可能看了几个选项，然后有意识地做出了选择。然而，你考虑的那几个选项的短名单是如何产生的呢？你是否创建了一个电子表格，仔细地浏览你所在城市存在的几十或几千家餐厅，根据精心挑选的标准进行评估，然后做出决定？还是你神奇地想到了一个相当短的餐厅选择列表？这就是你的潜意识向有意识思考伸出援手的例子——通过将选择范围缩小到一个相当短的列表，它让决定晚餐地点的任务变得容易得多。


  大自然如此执着于效率的原因在于，你的逻辑性、有意识的思考效率极其低下。普通大脑的重量不到一个人体重的 2%，却消耗了身体 20%的能量。^(⁷) 这意味着你获取和消化的食物中，有
  20%的能量仅仅用于为你的大脑提供动力！对于身体这么小的一部分来说，这是大量的能量。而且，这些能量大部分被你从事的逻辑思考所消耗（与几乎毫不费力的潜意识模式识别相反）。正如现代飞机和船舶拥有各种降低能耗的技术方法一样，大自然母亲也在大脑中嵌入了各种机制，以最大限度地减少逻辑思考的能量消耗（以免你每天需要吃
  20 块牛排）。毫不奇怪，它通过这种方式引入了各种偏见。


  如果你收集心理学文献中描述的各种偏见，你会发现超过 100 种。^(⁸) 然而，其中许多是大脑工作方式更基本原则的具体体现，因此，一些作者将文献归纳为 4-5
  种主要类型的偏见。我个人喜欢丹·洛瓦洛和我的前同事奥利维耶·西博尼提出的框架：^(⁹) 他们区分了行动导向型偏见、稳定性偏见、模式识别型偏见、利益偏见和社会偏见。在接下来的内容中，我将大致遵循这个框架，讨论一些对于理解算法偏见最为重要的偏见。




  ## 行动导向型偏见


  *行动导向型偏见*体现了自然的洞见：速度往往至关重要。你认为谁更有可能在野外生存下来？是那位谨慎的计划者，他会撰写一份 20 页的风险评估报告，并在决定是战斗还是逃跑以应对五米外突然出现的老虎之前，至少思考五种不同的应对方案；还是那位在瞬间决定与老虎搏斗的冒险者？


  一些偏见可以说明行动导向型偏见的本质。首先，像冯·雷斯托夫效应（关注眼前众多物品中突出的那一个）和怪异效应（关注与我们预期最不同的物品）这类偏见，会将我们的注意力引向周围灌木和树木中的黄色皮毛；而过度乐观和过度自信则会抑制可能导致致命拖延的自我怀疑。


  怪异效应会扭曲我们的认知，就像异常值和杠杆点在估算算法系数时可能产生巨大影响一样。这是因为可得性启发——如果我们回忆起某个特定数据点比其他数据点更容易（例如，因为它从大多数其他数据点中脱颖而出），我们就会高估这个易记数据点的代表性。这可以解释为什么，比如说，一个外国人实施的一次引人注目的犯罪事件，会严重扭曲我们对具有该外国人国籍的人的认知，从而引发对他们不成比例的敌意和攻击。


  过度自信值得我们特别关注，因为它也能在很大程度上解释为什么人们对偏见（尤其是算法偏见）的应对不足。许多研究人员通过询问人们如何将自己与他人进行比较来证明过度自信的存在。^(¹⁰)
  例如，70% 接受调查的高三学生认为自己的领导能力“高于平均水平”，但只有 2% 的人认为自己“低于平均水平”（根据定义，大约各有 50% 的人应分别低于和高于平均水平）。在与他人相处的能力方面，60%
  的人甚至认为自己属于前 10%，25% 的人认为自己属于前 1%。在驾驶和软件编程等技术技能方面也发现了类似的结果。过度乐观本质上是同一种偏见，但应用于对结果和事件的评估，例如一个大型建筑项目能否保持在成本预算之内。


  这对对抗偏见意味着什么？即使人们接受他人可能存在偏见这一事实，他们也会高估自己在判断时抵御偏见的能力——结果就是抵制消除自身决策偏见的努力。由于大多数人都会陷入过度乐观，我们很容易遇到这样一种情况：大多数人承认偏见的存在，但大多数人仍然拒绝采取任何行动。


  关于过度乐观研究的另一个迷人之处在于：它在西方文化中被发现，但在远东地区却没有。^(¹¹) 这表明，个人性格和国家的整体文化（或公司/组织文化）都会影响我们的决策方式，从而影响偏见。我们在一种情境中观察到的偏见可能不会在另一种情境中出现——但其他偏见可能会出现。


  ### 注


  过度自信的一个绝佳例证是，我观察到，由于过度自信，大多数人未能采取行动来消除其决策中的偏见——但我还是写了一本关于消除算法偏见的书，不知何故相信，尽管困难重重，我能够克服读者中的人类偏见，并促使他们实施我的建议。然而，我也知道，*你*，我亲爱的读者，*是*不同于普通读者的，并且比其他人更倾向于采取实际行动；因此，请允许我指出，为了与你当之无愧的积极自我形象保持一致，你应该今天就制定一个行动计划，说明你将如何把本书的见解和建议应用到日常工作中，并积极抵制那种认为自己不受偏见影响的诱人想法，以免辜负我们彼此对自己各自技能的高期望。☺


  ## 稳定性偏见


  *稳定性偏见*是自然追求效率的一种方式。想象一下，你是一部艺术片下午场的唯一观众——因此你实际上可以选择 200 个座位中的任何一个。你会怎么做：每 30 秒就跳起来尝试另一个座位，还是基本上固定在一个座位上，最多换一两次，也许是为了获得更多伸腿空间或避开讨厌的空调冷风？从自然的角度来看，每次你仅仅考虑换座位，就已经消耗了精神能量；而如果你真的站起来换座位，你的肌肉会消耗宝贵的能量，更不用说你可能还会错过电影的最佳场景。许多偏见试图通过将你“粘”在现状上来防止精神和身体资源的浪费。


  这些偏见的例子包括现状偏见和损失厌恶。你更喜欢你坐着的座位而不是其他座位，仅仅因为它是现状——而且你讨厌失去它的想法。这是损失厌恶的一种特定表现，被称为*禀赋效应*；涉及大学咖啡杯和钢笔的实验表明，一旦某件物品归你所有（即你被“赋予”了该物品），你愿意出售的最低价格可能大约是*两倍*于你愿意为该物品支付的最高价格。^(¹²)


  虽然经济学家认为这种情况是非理性和不正常的，但从自然的角度来看，这似乎完全合理——自然希望你休息一下，或者做一些比以微不足道的个人利益交易小物品更有生产力的事情！然而，有时这种现状偏见会过度。例如，年度预算中的公司决策表现出非常强烈的现状偏见，一项分析报告称，各部门或单位的预算分配年复一年的相关性高达
  90%。虽然这可能避免了因削减某些部门的预算而引发激烈争论，但这种稳定性付出了巨大的经济代价：预算分配更动态的公司增长速度是屈从于现状偏见的公司的两倍。^(¹³)


  另一个重要的稳定性偏见是锚定效应。研究时间序列模型的经济计量学家常常惊讶于所谓的朴素模型效果如此之好^(¹⁴)——对于许多时间序列来说，本期的值是下一期值的极佳预测指标，许多复杂的时间序列模型几乎无法超越这个朴素模型。自然一定注意到了这一点，因为当人类做出估计时，他们常常严重依赖于他们拥有的任何初始值，并且随着时间的推移，只有在出现新信息时才会做出微小的调整。然而，有时这种偏见会严重误导人——即当初始值严重错误或完全是随机的时候。一个流行的锚定效应演示是，让参与者在估计一件物品（如一瓶酒或一盒巧克力）的价格之前，写下他们社会安全号码或电话号码的最后两位数字。尽管这些数字与物品价格显然毫无关系，但写下高数字的人估计的价格始终比写下低数字的人高出
  60% 到 120%。^(¹⁵)




  ## 模式识别偏差


  *模式识别偏差*涉及我们认知中一个非常棘手的问题：我们的感官感知大多是不完整的，而且我们所感知到的信息中存在大量噪声。想象一下你上次与某人交谈的情景——可能就在几分钟前，如果你正在旅途中阅读这本书，也许你刚和列车员或空乘人员说过话。回想一下对方在对话中说过的一句信息量丰富、内容充实的话。很可能这句话的一部分被一声巨响（比如另一个人的喷嚏声）完全淹没，几个音节可能含糊不清，而且你可能因为瞥了一眼手机而错过了部分内容。你当时请对方重复那句话了吗？还是你仍然大致明白了对方的意思？通常情况是后者——这要归功于我们大脑“填补空白”的神奇能力。我们的大脑非常擅长进行高度有根据的猜测——但有时这些猜测会系统性地出错，这就是模式识别偏差的领域。


  模式识别偏差与本书尤其相关，因为模式识别本质上就是算法所做的事情。


  为了解决从充满噪声、不完整的数据（无论是视觉或其他感官感知，还是实际数据，例如一份充满小字号表格的管理信息系统报告）中提取意义的问题，大脑需要制定规则。如果规则本身错误，或者规则被错误应用，就会产生系统性错误（即偏差）。


  “得克萨斯神枪手谬误”就是一个错误规则的例子。你的大脑在不存在规则（即模式）的数据中看到了规则。这或许可以解释许多迷信现象。如果一个销售人员连续三次在佩戴丈夫送她的生日礼物——红色领带时成功签单，大脑可能会草率地得出结论，认为这是一条“幸运领带”。有趣的是，大脑可能并没有错——红色可能确实对买家有心理影响，从而增加了签单的几率——只是三次成功签单在统计上是一个微不足道的样本，数据量太小，无法做出任何可靠的推断。这说明，自然界思考模式识别的方式深受“宁可错杀，不可放过”心态的影响——邻居的狗咬你多少次，你才会得出结论，最好离这只可爱的狗狗远点？同理，大脑天生就会认为，即使红色领带只有很小的几率能带来帮助，为什么不戴上它，以免冒失去大单的风险呢？


  确认偏误可能是“得克萨斯神枪手谬误”的帮凶，是自然界在模式识别中追求效率的一种方式。确认偏误可以被视为一种“假设驱动”的数据收集方法。这意味着，当大脑有一个假设时（例如，你相信买这本书是个好主意），你就会倾向于挑选出能证实你信念的新数据（例如，你称赞这本书的五星好评，认为其见解精辟），并拒绝矛盾的数据（例如，你将给出差评的作者视为傻瓜——当然，我得赶紧说，这完全合理！）。确认偏误的背后，似乎是自然界渴望快速做出决定并减少认知努力。实验室实验表明，参与者阅读支持自己观点的新闻文章的可能性远高于阅读相反观点的文章。因此，在关于社交媒体算法偏差的第
  11 章中，你会将确认偏误视为一个核心对手。


  确认偏误也会影响我们处理“嘈杂”信息的方式。想象一下前面提到的与空乘人员或列车员的互动。她问你在读什么书，你自豪地给她看了这本书的封面。就在她回答时，一声巨响淹没了她部分话语。你根本无法判断她说的是“我爱那本书！”还是“我讨厌那本书！”但很可能你“听到”她说她喜欢这本书。这是因为你的大脑当然期望她会这么说，于是不确定的声音会自动且下意识地被替换成预期的内容。


  刻板印象是确认偏误的一种延伸，也是规则被过度僵化应用的偏差例子。首先，想象你在一家高档餐厅里。服务员刚把账单送到你旁边的桌子，一位气度不凡、年长的白人男子从裤子里掏出一个黑色物体。你认为那是什么？你可能想象的是一个钱包。现在想象一辆警车经过一位明显痛苦地躺在街边的女性。当警车驶过时，这位女性喊道“我的钱包，我的钱包！”并朝空中挥手。这时，警察注意到附近有一个年轻的黑人男子正跑向地铁站。他们立即追赶那名男子，喊道“站住！警察！”并举起枪瞄准他。当男子跑到地铁站入口的台阶时，他从口袋里掏出一个黑色物体。那是什么？如果你想象的是枪（而不是那个男子需要赶紧掏出的地铁卡钱包，以免错过地铁而迟到钢琴课），那么你就成了刻板印象的受害者。基于情境背景，你的大脑已经对接下来可能发生的事情有了一些预期。在餐厅里刚收到账单的人，很可能会从口袋里掏出钱包、信用卡或一叠钞票；一个看似犯了抢劫罪的人，在试图逃离警察时，很可能会从口袋里掏出刀、枪或手榴弹。当大脑只知道从口袋里掏出一个“黑色物体”时，它会根据对在这种情境下的人口袋里最可能有什么东西的刻板看法来“填补空白”。问题在于，这个猜测可能是错误的。很明显，一个在嫌疑人从口袋里掏出黑色物体的瞬间就开枪的警察，比一个更谨慎、深思熟虑、除非嫌疑人毫无疑问地用枪指着自己否则不开枪的警察，中枪的可能性更小，因此生存几率更高，所以进化论并非正当程序的忠实拥趸。然而，如果警察最终因为无辜者看起来像他脑海中“刻板印象”中的劫匪而开枪射杀了他，那么自然的诡计和决策偏差就悲剧性地夺走了一条生命。


  这个例子也指向一个严峻的事实：有时，创建和使用算法需要我们决定严重的伦理困境——无论是剥夺疑似恐怖分子的人权，决定是否给予已定罪罪犯假释，还是为自动驾驶汽车编程，使其在面对与行人发生致命碰撞不可避免、但汽车可以选择撞向哪几个行人的情况时做出决策。就像经典悲剧中英雄必须在两条同样灾难性的道路之间做出选择一样，算法有时也必须预先设定好走向某个方向，而我们最终决定嵌入算法中的“偏差”，反映了我们对在这种情况下什么是最合乎道德的决策的最佳评估。




  ## 利益偏见


  *利益偏见*超越了单纯的启发式捷径。行动偏见、稳定偏见和模式识别偏见仅仅旨在尽可能准确、快速、高效地做出“正确”决策，而利益偏见则明确考虑了“我想要什么？”这个问题。请思考一下你所在地区一家你只会勉强去吃的、表现平平的餐厅。现在想象一下，一位朋友邀请你明天去那里吃午餐。你脑海中浮现了什么想法？你是否很快就想到“还是别去了——我们去……怎么样？”现在想象一下，你的信用卡公司提供了一个绝佳优惠：如果你在本周末之前用这张卡在这家表现平平的餐厅消费一顿双人餐，就能获得一张价值
  500 美元的购物券。现在再次想象你的朋友约你出去吃午餐——不过，这次是去另一家你通常非常喜欢的餐厅。你现在作何反应？你是否突然感觉到想去那家表现平平的餐厅了？


  如果你非常仔细地倾听自己的想法，你可能会意识到，你的潜意识正以相当微妙的方式影响着你的思维过程。在我们的练习中，你可能不仅思考了如何向朋友建议去另一家餐厅，你的潜意识还可能提供了几个谈话要点来支持你的建议（即，反对或支持那家表现平平的餐厅的额外论点）。如果我让你不喜欢某家特定的餐厅，你的大脑必然会特别检索出那家餐厅你不喜欢的那些特质。相反，如果我让你感受到想去同一家餐厅的欲望，你的大脑必然会检索出那家餐厅更具吸引力的特质。


  关键在于，你不仅可能理性地偏好那家表现平平的餐厅（如果去那里有望获得 500 美元的意外之财），而且这种明确或隐藏的偏好会更广泛地影响你的评估（可以将其视为一种确认偏见），因此你可能会认真地相信，这家餐厅对你的朋友（他/她不幸不会得到购物券）来说也是一个不错的选择。因此，利益偏见会极大地混淆视听——你的大脑不会客观地陈述某个选项对你有益但对其他所有人有害，反而可能会错误地说服你，让你相信你偏好的选项在客观上对每个利益相关者都是最优的。


  在企业环境中，当某些决策具有非常个人化的影响时，人们经常可以观察到这种行为。想象一下，你的公司正在考虑将办公室搬到城镇的另一边。你对此有何感受？你认为你对搬迁的整体评估与你个人是否希望办公室位于城镇的这一边或另一边之间存在任何关联吗？因此，利益偏见极大地影响着数据科学家以及算法用户的行为。


  ## 社会偏见


  *社会偏见*可以说是利益偏见的一个子类别——但它们如此重要，以至于我认为将其单独列为一组是合理的。人类是社会性动物，除了少数成功的隐士之外，无法在群体之外生存。直白地说，如果一个穴居人惹恼了他的同伴，以至于被赶出洞穴，他很快就会被野兽吃掉。因此，人类对被排斥有着根本性的恐惧，这种恐惧本质上是对死亡的恐惧——事实上，社会排斥会引起痛苦（作为即将受到伤害的警告信号），这种痛苦比大多数形式的身体疼痛更强烈（这也解释了为什么日益加剧的孤独感是一场公共卫生危机，以及英国任命了一位“孤独事务部长”）。


  因此，在决策时，大脑会权衡任何可能行动的益处与被排斥的风险。*向日葵管理*是一种倾向于同意老板意见的偏见；*群体思维*是一种倾向于同意群体共识的偏见。负责重要决策的委员会成员经常承认，他们支持了自己个人认为严重错误、甚至可能是灾难性的决策（想想那些摧毁了原本健康公司的并购决策），因为他们认为否决它在社交上是不可接受的。


  与其他利益偏见类似，社会偏见在两个层面上起作用。虽然人们常常完全清楚正确答案是什么，但仍然会选择替代方案，因为他们认为说出真相无异于自取灭亡；同时，社会偏见也会更广泛地影响认知过程——例如，它们可能触发一种确认偏见，即委员会努力寻找大量证据来支持主席的观点，同时潜意识地拒绝接受他可能出错的证据。


  ## 具体决策 vs. 全局图景


  利益偏见和社会偏见表明，自然（或天性）常常着眼于更大的图景，而不仅仅是单个决策。这一观察结果也被用作对认知偏见这一概念的批评——其论点认为，偏见的概念是一种错觉，因为我们只关注某个特定决策的某个特定结果（例如，在某个特定实验中，参与者是否正确估计了我们要求的数字），而自然（或天性）着眼于一个更大的背景，在这个背景下，个体的行为和决策是完全理性和正确的。


  我们无需陷入对心理学文献中描述的每一种认知效应是否算作偏见的争论中；重要的是要认识到，“真相”（或者在统计建模科学中，一个二元结果 0 或 1，即 1 的定义）往往是一个令人惊讶地依赖于情境的概念，并且当一个决策看起来有偏见时，它可能仅仅是竞争目标之间妥协的反映——无论是简单地考虑速度和效率的重要性，还是认识到单个决策可能是一个更大、更复杂问题（例如维持良好的社会关系）中微不足道的一部分。


  这种认识对于检测、管理和避免偏见至关重要。正如你将在后续章节中看到的，并非每一次预测结果（以及由此推断的、负责的底层算法）看起来有偏见时，都构成一个需要修复的“问题”。同时，导致（错误地）有偏见结果的行为可能仍然是合理的，或者至少是理性的，因此，遏制这种偏见的有效方法必须绕开这种行为，而不是期望行为本身发生改变。并且，每当数据科学家采取行动明确地从算法中消除某种特定偏见时，他或她可能必须评估这样做是否会在整个系统中引起另一个不同的问题，以及因此这种干预是否合理，是否真正符合那些本应受益于算法去偏见的利益相关者的最佳利益。




  ## 总结


  在本章中，你了解了偏见如何源于对决策速度和效率的需求，或其他个人利益，包括有时会凌驾于准确性需求之上的社会融入需求。这些偏见塑造了算法所描述和预测的许多现象；它们也塑造了创建、使用或监管算法的人类行为。正如你将在后续章节中看到的，用于开发算法的技术可以消除其中一些偏见，而另一些偏见则必然会被算法所镜像。最后，对人类认知偏见的概述也将有助于理解其他类型的偏见，这些偏见由于算法的开发和部署方式而特定于算法本身。


  对我们而言，最重要的偏见包括：


  *   ***行动导向偏见*** 通过集中注意力并消除因自我怀疑而产生的拖延，驱使我们迅速采取行动。

  *   ***可得性偏见*** 是一种特定的行动导向偏见，它让特定的数据点——尤其是离奇或值得注意的数据点——过度地影响我们的预测。

  *   ***过度乐观*** 和 ***过度自信*** 是特定的行动导向偏见，可能导致算法的开发者和用户忽视危险和局限性，并高估其算法的预测能力。

  *   ***稳定性偏见*** 通过让我们固守现状来最小化认知和体力上的努力。

  *   ***锚定效应*** 是一种特定的稳定性偏见，它通过将估计植根于完全随机或存在严重缺陷的参考点，从而损害估计的准确性。

  *   ***模式识别偏见*** 通过从随机模式中形成决策规则，或不适当地应用合理的规则，导致有缺陷的预测。

  *   ***确认偏见*** 是一种特定的模式识别偏见，它损害了我们在制定基于模式的决策规则时所考虑的数据。

  *   ***利益偏见*** 通过将客观判断与我们的自身利益相混合，从而损害了客观判断。

  *   ***社会偏见*** 是一种特定类型的利益偏见，专门侧重于维护我们在社会环境中的地位。


  现在，我们将转向算法，并开始揭示它们受这些偏见影响以及与这些偏见相互作用的多种方式。作为第一步，我们需要将一般的统计算法与特定类型的算法（即通过机器学习开发的算法）区分开来。


