  \ 500 到 2000 笔贷款的测试）。你还可以通过仍然排除那些你确信不值得授信的申请人来避免不必要的损失，例如那些目前已在其他银行违约的申请人。尽管有成本，但这种方法仍然是开采新黄金——无偏数据——的黄金标准。\n\
  \n为了对抗动态产生的偏差，关键不仅在于一次性生成无偏数据，而是要将其作为常规实践，嵌入到你“照常”运营业务的方式中。许多情况会引入隐藏的偏差。例如，如果银行拒绝了某一特定客户群体，它就不会生成能够证明算法错误的数据（即，没有记录显示该客户偿还了她所申请的贷款），并且可能也没有用于适当拒绝推断的外部数据（例如，如果*所有*银行都拒绝借钱给火星人，征信机构将缺乏任何火星人偿还贷款的证据）。只有定期生成关于火星人的无偏数据，才能让你的算法保持诚实——并借此发现向有信用的火星人提供盈利贷款的商业机会。\n\
  \n## 总结\n\n在本章中，你学习了如何通过深思熟虑的努力来创建无偏数据，从而开采一种新型黄金。关键要点包括：\n\n*   购买路易威登包时，检查皮革印章上的\
  \ L、O、T 字母，以确保它不是假货。\n\n*   用于建模的现成数据可能存在致命偏差，获得无偏数据的唯一方法是进行谨慎的流程重新设计，或开展一个完全无偏数据收集的试点项目。\n\
  \n*   为了获得无偏数据，数据必须包含所有案例（即整个总体）或一个真正的*随机*样本，并且结果的评估必须对所有案例遵循统一、标准化的方法。\n\n*   如果人类参与数据的生成或收集，执行这样的无偏数据收集是一项具有挑战性的工作，因为它需要前线人员的完全合规。因此，通常最好将其作为一个试点项目进行，只涉及选定的前线员工小组和精心构建的样本。\n\
  \n*   相比之下，自动化流程则适合定期运行完全随机选择案例的试验，以挑战并持续改进算法。\n\n*   只有那些将定期生成新鲜、无偏数据嵌入其“照常业务”运营的组织，才能确保他们的数据金矿永远不会被偏见污染。\n\
  \n至此，我们从用户角度对算法偏差的讨论告一段落。我们首先自上而下地审视了决策问题的整体架构，并讨论了鉴于算法的风险收益特征，在特定决策过程中是否以及以何种形式应用算法。接着，我们探讨了使用算法的保障措施及其监控方法。最后，我们讨论了管理策略如何克服算法中根深蒂固的偏差，以及如何创建新的、无偏的数据来开发无偏算法。在本书的最后一个部分，即第四部分，我们将转向数据科学家，更详细地审视数据科学家可以用来消除或减少算法偏差的具体技术。\n\
