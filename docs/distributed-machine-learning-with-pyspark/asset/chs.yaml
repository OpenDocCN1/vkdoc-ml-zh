  ## 使用交叉验证选择算法


  交叉验证是一种通过将数据集分割成 k 折来评估机器学习模型性能的方法。然后，模型在 k-1 折上进行训练，并在剩余的一折上进行测试。此过程重复 k 次，每一折都轮流作为测试集。


  这种方法优于仅在单个数据集上训练和测试模型，原因如下：


  1.  K 折交叉验证通过降低对特定训练集过拟合的风险，可以更好地估计模型性能。通过使用数据的多个折来训练和评估模型，我们可以更好地了解模型在未见数据上的表现。


  2.  通过 k 折交叉验证，我们可以获得模型性能的多个估计值，因此可以做出更明智的模型选择决策。这种方法降低了选择在特定训练集上表现良好但在未见数据上表现不佳的模型的可能性。


  3.  通过将数据分割成多个折，我们可以使用更多数据来训练模型，这可以带来更好的性能。当数据集规模有限时，这种方法尤其有用。


  为了说明 k 折交叉验证的工作原理，我们将比较四个分类器（尽管我们可以使用任意数量的模型）的性能：逻辑回归、决策树分类器、随机森林分类器和支持向量分类器。选择的评估指标将是
  ROC 曲线下面积（受试者工作特征曲线），也称为 AUC（曲线下面积）。我们将在评估模型时更详细地解释这个重要指标。


  在计算每个分类器的 ROC AUC 之前，我们将首先使用 `StandardScaler` 函数对特征进行标准化。标准缩放，也称为 z-score 归一化或标准化，是一种数据预处理技术，用于将数值特征转换为均值为
  0、标准差为 1。它涉及从数据中减去每个特征的均值，然后除以标准差。


  特征 x 的标准缩放公式为：


  x_scaled = (x - mean(x)) / std(x)


  其中 mean(x) 是特征 x 的均值，std(x) 是其标准差。


  标准缩放是数据预处理中的一个关键步骤，用于使特征具有可比性，并提高机器学习算法的性能和稳定性。它确保特征具有一致的尺度，这在处理对输入数据尺度敏感的算法或解释模型系数时尤其重要。我们将使用
  Scikit-Learn 和 PySpark 对上一节描述的相同糖尿病数据集进行分类。我们将使用相同的分类器列表，并使用十折交叉验证对每个分类器进行评估。


  在本章中，我们将使用默认超参数。虽然 Scikit-Learn 和 PySpark 都为其模型提供了默认超参数，但这些默认值并不总是相同的。我们将在第 16 章中演示如何使用网格搜索来微调这些超参数，以改进模型性能。


  Scikit-Learn 和 PySpark 之间还有其他差异。首先，Scikit-Learn 将交叉验证与超参数调优分开，而 PySpark 默认将它们结合在一起。其次，PySpark
  将特征组合成一个向量，而 Scikit-Learn 则不会。




  ### Scikit-Learn


  在本小节中，我们将演示如何使用 Scikit-Learn 平台进行数据预处理、定义分类模型以及执行 k 折交叉验证来评估模型性能。我们将使用之前通过以下代码生成的同一个
  `pandas_df` DataFrame：


  ```

  [In]: url = ''https://raw.githubusercontent.com/abdelaziztestas/spark_book/main/diabetes.csv''

  [In]: pandas_df = pd.read_csv(url)

  [In]: pandas_df = pandas_df.loc[(pandas_df[''Glucose''] != 0)

  & (pandas_df[''BloodPressure''] != 0)

  & (pandas_df[''BMI''] != 0),

  [''Pregnancies'',

  ''Glucose'',

  ''BloodPressure'',

  ''BMI'',

  ''DiabetesPedigreeFunction'',

  ''Age'',

  ''Outcome'']]

  ```


  在生成这个过滤掉无效糖尿病读数记录的 DataFrame 之后，k 折交叉验证过程的第一步是导入所需的库：


  步骤 1：导入必要的包


  *   `StandardScaler` 用于预处理


  *   `cross_val_score` 用于交叉验证


  *   `LogisticRegression`、`DecisionTreeClassifier`、`RandomForestClassifier` 和 `LinearSVC`（线性支持向量分类）用于分类


  ```

  [In]: from sklearn.preprocessing import StandardScaler

  [In]: from sklearn.model_selection import cross_val_score

  [In]: from sklearn.linear_model import LogisticRegression

  [In]: from sklearn.tree import DecisionTreeClassifier

  [In]: from sklearn.ensemble import RandomForestClassifier

  [In]: from sklearn.svm import LinearSVC

  ```


  步骤 2：定义特征列和目标列。将特征列赋值给变量 `x`，将目标列赋值给变量 `y`：


  ```

  [In]: x_cols = [''Pregnancies'', ''Glucose'', ''BloodPressure'', ''BMI'', ''DiabetesPedigreeFunction'',
  ''Age'']

  [In]: x = pandas_df[x_cols]

  [In]: y = pandas_df["Outcome"]

  ```


  步骤 3：使用 `StandardScaler()` 函数对特征进行标准化，该函数将特征缩放为均值为 0、标准差为 1 的分布


  ```

  [In]: scaler = StandardScaler()

  [In]: x_scaled = scaler.fit_transform(x)

  ```


  步骤 4：定义一个分类器列表：


  ```

  [In]: classifiers = [LogisticRegression(), DecisionTreeClassifier(), RandomForestClassifier(),
  LinearSVC(max_iter=1500)]

  ```


  `LinearSVC` 中的 *max_iter* 参数是一个超参数，用于控制算法为达到收敛而运行的最大迭代次数。我们将其设置为 1500，因为该算法在默认的最大迭代次数（即
  1000）内未能收敛。正如我们将在第 16 章中看到的，尝试不同的迭代次数是超参数调优过程的一部分。


  `LinearSVC` 中的“Linear”一词意味着我们使用的是基于 SVM（支持向量机）且带有线性核的分类器，该分类器使用线性决策边界来分隔类别。Scikit-Learn
  中还有另一个分类器 `SVC()`，它可以实现带有多项式核的 SVM。当需要非线性决策边界时，这是一个更好的选择。我们没有尝试这个算法，因为它目前在 PySpark
  中不可用，原因是核化 SVM 的训练难以分布式进行。但请注意，`SVC()` 也可以实现线性核，因此 `SVC(kernel=''linear'')` 会给出与
  `LinearSVC()` 相当相似的结果。


  步骤 5：使用 *for 循环* 对每个分类器执行十折交叉验证。这会将数据分成十份，并计算每个折中模型准确率（通过 roc_auc 评分衡量）的平均值。每个分类器的模型名称和平均
  ROC AUC 都会被打印出来：


  ```

  [In]: for classifier in classifiers:

  result = cross_val_score(

  classifier,

  x_scaled,

  y,

  cv=10,

  scoring= "roc_auc" )

  print(f"{classifier.__class__.__name__}

  mean: {result.mean():.2f}")

  [Out]:

  LogisticRegression mean: 0.84

  DecisionTreeClassifier mean: 0.67

  RandomForestClassifier mean: 0.83

  LinearSVC mean: 0.84

  ```


  让我们详细解释一下这些数字的含义。在输出中，平均 ROC AUC 表示十个交叉验证折的平均 ROC AUC 分数。ROC AUC 的取值范围为 0 到 1，数值越高表示性能越好。


  ROC 曲线是二分类器在不同判别阈值（即分类器用于确定样本属于正类还是负类的不同值）下性能的图形表示。该曲线通过在不同阈值下绘制真正率（TPR）与假正率（FPR）的关系来生成。


  以下是 ROC 曲线关键组成部分的详细说明：


  1.  真正率（TPR）或灵敏度：


  TPR 是被分类器正确识别为正类的正样本（实际正类）的比例。其计算公式如下：


  TPR = 真正例 / (真正例 + 假负例)


  TPR 也称为灵敏度或召回率。


  2.  假正率（FPR）或误报率：


  FPR 是被分类器错误分类为正类的负样本（实际负类）的比例。其计算公式如下：


  FPR = 假正例 / (假正例 + 真负例)


  FPR 也称为误报率。


  ROC 曲线通过沿垂直 y 轴绘制 TPR（灵敏度）和沿水平 x 轴绘制 FPR（1-特异度）来生成。该曲线直观地描绘了判别阈值的变化如何影响分类器的效能。在理想情况下，分类器的
  ROC 曲线会从原点（FPR = 0）直接上升，然后水平延伸至右上角（TPR = 1），表示两个类别之间的完美区分。


  在现实场景中，大多数分类器生成的曲线会向左上角弯曲。ROC 曲线越接近这个角，分类器的性能质量就越高——越接近表示性能越好。ROC 曲线下的面积（AUC）是一个单一指标，它概括了分类器在所有可能阈值下的性能。AUC
  值为 1 表示完美分类器，而 AUC 值为 0.5 则表示分类器的性能不比随机猜测好。


  让我们继续绘制决策树和随机森林分类器的 ROC 曲线，以便更好地理解它们。我们可以使用以下代码实现这一点，使用我们之前生成的同一个 `pandas_df` DataFrame
  来训练和评估模型：


  步骤 1：导入必要的库


  ```

  [In]: import matplotlib.pyplot as plt

  [In]: from sklearn.model_selection import cross_val_predict

  [In]: from sklearn.tree import DecisionTreeClassifier

  [In]: from sklearn.ensemble import RandomForestClassifier

  [In]: from sklearn.metrics import RocCurveDisplay, roc_curve, auc

  ```


  步骤 2：定义决策树和随机森林模型


  ```

  [In]: decision_tree_model = DecisionTreeClassifier()

  [In]: random_forest_model = RandomForestClassifier()

  ```


  步骤 3：对模型执行交叉验证预测


  ```

  [In]: y_scores_decision_tree = cross_val_predict(

  decision_tree_model,

  x,

  y,

  cv=10,

  method="predict_proba"

  )

  [In]: y_scores_random_forest = cross_val_predict(

  random_forest_model,

  x,

  y,

  cv=10,

  method="predict_proba"

  )

  ```


  步骤 4：计算模型的 ROC 曲线和 AUC


  ```

  [In]: fpr_decision_tree, tpr_decision_tree, _ = roc_curve(y, y_scores_decision_tree[:,
  1])

  [In]: roc_auc_decision_tree = auc(fpr_decision_tree, tpr_decision_tree)

  [In]: fpr_random_forest, tpr_random_forest, _ = roc_curve(y, y_scores_random_forest[:,
  1])

  [In]: roc_auc_random_forest = auc(fpr_random_forest, tpr_random_forest)

  ```


  步骤 5：绘制 ROC 曲线




  ```

  [In]: plt.figure()

  [In]: plt.plot(fpr_decision_tree, tpr_decision_tree, color=''darkorange'', lw=2,
  label=''Decision Tree (area = %0.2f)'' % roc_auc_decision_tree)

  [In]: plt.plot(fpr_random_forest, tpr_random_forest, color=''blue'', lw=2, label=''Random
  Forest (area = %0.2f)'' % roc_auc_random_forest)

  [In]: plt.plot([0, 1], [0, 1], color=''navy'', lw=2, linestyle=''--'')

  [In]: plt.xlim([0.0, 1.0])

  [In]: plt.ylim([0.0, 1.05])

  [In]: plt.xlabel(''False Positive Rate'')

  [In]: plt.ylabel(''True Positive Rate'')

  [In]: plt.title(''Receiver Operating Characteristic'')

  [In]: plt.legend(loc="lower right")

  [In]: plt.show()

  [Out]:

  ```


  ![](img/604220_1_En_2_Figa_HTML.jpg)


  一张折线图，比较了真正例率与假正例率。决策树和随机森林的曲线从大约 0.0 开始，逐渐增加到 0.8，然后达到 1.0。


  随机森林分类器的 ROC 曲线（ROC AUC 为 0.83）比决策树分类器的曲线更靠近图的左上角。这表明随机森林分类器能够以更适中的假正例率，更准确地对正例和负例实例进行分类。


  这并不意外，因为众所周知，随机森林分类器通常比单一决策树分类器表现更好。这是由于随机森林的集成特性及其减少了过拟合。随机森林结合了多个决策树的预测结果，每棵树都在数据的一个子集上进行训练并做出独立预测。最终的预测结果由各棵树的预测结果通过多数投票决定。这种集成方法有助于减少过拟合的影响。


  此外，随机森林中的多数投票或平均有助于减少噪声数据点或异常值对最终预测的影响。决策树可能对单个数据点敏感，这可能导致泛化能力较差。


  更重要的是，随机森林比单一决策树能更有效地对数据中的复杂关系进行建模。通过结合多棵树的预测，它可以更好地逼近非线性决策边界。回顾一下四个分类器的 k 折交叉验证输出，结果表明逻辑回归和线性
  SVC 表现最佳，AUC 均为 0.84，其次是随机森林，AUC 为 0.83。决策树分类器表现不佳，AUC 仅为 0.67。这些发现表明，我们可以考虑将逻辑回归或线性
  SVC 作为进一步训练和评估的首选模型。


  ## PySpark


  在本节中，我们将 Scikit-Learn 代码转换为 PySpark，以突出它们的相似之处。我们将使用之前生成的同一个`spark_df` DataFrame，该
  DataFrame 是在过滤掉无效读数后得到的。以下是实现此任务的代码提醒：


  ```

  [In]: import pandas as pd

  [In]: from pyspark.sql import SparkSession

  [In]: url = ''https://raw.githubusercontent.com/abdelaziztestas/spark_book/main/diabetes.csv''

  [In]: pandas_df = pd.read_csv(url)

  [In]: spark = SparkSession.builder.appName("diabetes_data").getOrCreate()

  [In]: spark_df = spark.createDataFrame(pandas_df)

  [In]: spark_df = spark_df.filter((col(''Glucose'') != 0)

  & (col(''BloodPressure'') != 0)

  & (col(''BMI'') != 0)) \

  .select([''Pregnancies'',

  ''Glucose'',

  ''BloodPressure'',

  ''BMI'',

  ''DiabetesPedigreeFunction'',

  ''Age'',

  ''Outcome''])

  ```


  简而言之，我们的第一步是将 CSV 文件读入 Pandas DataFrame。然后，我们将此 DataFrame 转换为 PySpark DataFrame，并继续过滤掉无效记录。一旦我们生成了干净的
  DataFrame，使用 PySpark 进行 k 折交叉验证过程的初始阶段需要我们导入必要的库：


  步骤 1：导入所需的库


  *   `VectorAssembler` 和 `StandardScaler` 用于特征工程

  *   `LogisticRegression`、`DecisionTreeClassifier`、`RandomForestClassifier` 和 `LinearSVC`
  用于分类

  *   `BinaryClassificationEvaluator` 用于评估模型性能

  *   `CrossValidator` 用于交叉验证

  *   `col` 函数用于重命名标签列

  *   `ParamGridBuilder` 用于超参数


  ```

  [In]: from pyspark.ml.feature import VectorAssembler, StandardScaler

  [In]: from pyspark.ml.classification import LogisticRegression, DecisionTreeClassifier,
  RandomForestClassifier, LinearSVC

  [In]: from pyspark.ml.evaluation import BinaryClassificationEvaluator

  [In]: from pyspark.ml.tuning import CrossValidator, ParamGridBuilder

  [In]: from pyspark.sql.functions import col

  ```


  步骤 2：使用 `VectorAssembler` 将特征列组合成一个名为 `features` 的单一向量列：


  ```

  [In]: assembler = VectorAssembler(inputCols=[

  ''Pregnancies'',

  ''Glucose'',

  ''BloodPressure'',

  ''BMI'',

  ''DiabetesPedigreeFunction'',

  ''Age'', ], outputCol="features")

  [In]: data = assembler.transform(spark_df)

  ```


  步骤 3：使用 `VectorAssembler` 将一组输入特征转换为一个单一的向量特征，然后将其用作下一步的输入


  这一步在分布式计算中是必要的，因为数据以分布式方式存储，需要先转换为向量格式才能用于机器学习。另一方面，Scikit-Learn 是为单机使用而设计的，不需要使用
  `VectorAssembler`。Scikit-Learn 中的输入特征通常存储在 NumPy 数组或 pandas DataFrame 中，可以直接用于训练机器学习模型。


  为了了解 `VectorAssembler` 的作用，让我们打印“data” DataFrame 的前五行（参数 `truncate=False` 表示我们希望显示每列的完整内容，即使它超过了默认的显示长度，通常是
  20 个字符）：


  | Pregnancies | Glucose | BloodPressure | BMI | DiabetesPedigreeFunction | Age |
  Outcome | features |

  | --- | --- | --- | --- | --- | --- | --- | --- |

  | 6 | 148 | 72 | 33.6 | 0.627 | 50 | 1 | [6,148,72,33.6,0.627,50] |

  | 1 | 85 | 66 | 26.6 | 0.351 | 31 | 0 | [1,85,66,26.6,0.351,31] |

  | 8 | 183 | 64 | 23.3 | 0.672 | 32 | 1 | [8,183,64,23.3,0.672,32] |

  | 1 | 89 | 66 | 28.1 | 0.167 | 21 | 0 | [1,89,66,28.1,0.167,21] |

  | 0 | 137 | 40 | 43.1 | 2.288 | 33 | 1 | [0,137,40,43.1,2.288,33] |


  ```

  [In]: data.show(5, truncate=False)

  [Out]:

  ```




  从上述向量组装输出可以看出，特征已被合并为一个名为 features 的单一向量。例如，第一行将怀孕次数、血糖、血压、BMI、糖尿病遗传函数和年龄的各自数值组合成了数值向量
  [6,148,72,33.6,0.627,50]。


  请注意，标签列（Outcome）并未包含在此组装过程中，因为向量组装专门针对特征，排除了目标变量。


  **步骤 4：使用 `withColumnRenamed` 将标签列 Outcome 重命名为 label**


  这样做是为了方便，因为在机器学习中，包含目标变量的列通常被称为“label”。此外，代码后面使用的 `BinaryClassificationEvaluator`
  期望目标变量位于名为 label 的列中，因此将 Outcome 列重命名为 label 可确保评估器能够正确评估训练模型的性能：


  ```

  [In]: data = data.withColumnRenamed("Outcome", "label")

  ```


  **步骤 5：使用 `StandardScaler` 标准化特征列**：


  ```

  [In]: scaler = StandardScaler(inputCol="features", outputCol="scaled_features")

  [In]: data = scaler.fit(data).transform(data)

  ```


  特征缩放是分类模型中一项重要的工程/预处理步骤，包括逻辑回归、LinearSVC（支持向量分类器）以及基于树的分类器（如决策树和随机森林）。这是为了确保算法能够以最佳状态和一致性运行。


  逻辑回归和 LinearSVC 模型使用基于梯度的优化算法来寻找特征的最佳系数。缩放通过确保所有特征具有相似的尺度来帮助优化过程，这可以防止某个特征因其较大的量级而主导优化过程。它还可以提高收敛速度。


  虽然决策树不受特征缩放的直接影响，但像随机森林这样的集成方法涉及聚合多个决策树。缩放可以通过确保树的构建过程不受不同特征尺度的影响，来帮助提高这些集成方法的稳定性和性能。这可以带来更准确的预测和更好的泛化能力。


  **步骤 6：定义要评估的分类模型列表**


  ```

  [In]: classifiers = [

  LogisticRegression(),

  DecisionTreeClassifier(),

  RandomForestClassifier(),

  LinearSVC(maxIter=1500)])]

  ```


  **步骤 7：使用 `ParamGridBuilder` 构建一个空的参数网格**：


  ```

  [In]: paramGrid = ParamGridBuilder().build()

  ```


  这里，使用 `ParamGridBuilder().build()` 构建了一个空的参数网格。`ParamGridBuilder` 类构建了一个超参数网格，在交叉验证期间会搜索该网格以训练模型。`build()`
  方法返回一个空的参数网格，然后可以用它来定义每个模型超参数的搜索空间。


  这在 PySpark 中是必要的，因为 MLlib 默认集成了 `ParamGridBuilder`。在 Scikit-Learn 中，这不是必需的，因为它将交叉验证与超参数调优过程分离开来。我们将在第
  16 章更深入地研究超参数调优。


  **步骤 8：定义一个 `BinaryClassificationEvaluator`，根据 ROC 曲线下面积评估模型**：


  ```

  [In]: evaluator = BinaryClassificationEvaluator(labelCol="label",

  rawPredictionCol="rawPrediction", metricName="areaUnderROC")

  ```


  **步骤 9：对于分类器列表中的每个分类器**：


  *   使用当前分类器、参数网格、评估器和折数（10）定义一个 `CrossValidator`

  *   将 `CrossValidator` 拟合到数据并获取模型

  *   使用模型转换数据，并使用 `BinaryClassificationEvaluator` 评估性能

  *   打印分类器的名称及其由 ROC AUC 衡量的平均准确率。


  ```

  [In]: for classifier in classifiers:

  cv = CrossValidator(

  estimator=classifier, estimatorParamMaps=paramGrid,

  evaluator=evaluator, numFolds=10)

  cvModel = cv.fit(data)

  results = cvModel.transform(data)

  accuracy = evaluator.evaluate(results)

  print(f"{classifier.__class__.__name__} mean:

  {accuracy:.2f}")

  [Out]:

  LogisticRegression mean: 0.84

  DecisionTreeClassifier mean: 0.78

  RandomForestClassifier mean: 0.91

  LinearSVC mean: 0.84

  ```


  结果表明，随机森林表现最佳，AUC 为 0.91，其次是逻辑回归和支持向量机，AUC 均为 0.84。决策树分类器表现不佳，AUC 为 0.78。


  这些发现与 Scikit-Learn 的结果并不完全相同，因为这两个框架使用不同的默认超参数，这可能导致准确率指标存在差异（我们将在第 16 章详细探讨超参数调优）。此外，k
  折采样是随机的，因此每次执行 k 折交叉验证时，都会使用不同的数据集进行训练和验证，从而产生不同的模型和评估指标。


  ## 整合所有内容


  在分别描述完每段代码后，我们将它们全部整合到一个代码块中，分别用于 Scikit-Learn 和 PySpark，以便数据科学家能够看到代码如何作为一个整体工作。


  ## Scikit-Learn


  ```

  # 导入必要的包

  [In]: from sklearn.preprocessing import StandardScaler

  [In]: from sklearn.model_selection import cross_val_score

  [In]: from sklearn.linear_model import LogisticRegression

  [In]: from sklearn.tree import DecisionTreeClassifier

  [In]: from sklearn.ensemble import RandomForestClassifier

  [In]: from sklearn.svm import LinearSVC

  [In]: import pandas as pd

  # 读取 csv 文件并创建 Pandas 数据框

  [In]: url = ''https://raw.githubusercontent.com/abdelaziztestas/spark_book/main/diabetes.csv''

  [In]: pandas_df = pd.read_csv(url)

  # 过滤掉无效记录

  [In]: pandas_df = pandas_df.loc[(pandas_df[''Glucose''] != 0)

  & (pandas_df[''BloodPressure''] != 0)

  & (pandas_df[''BMI''] != 0),

  [''Pregnancies'',

  ''Glucose'',

  ''BloodPressure'',

  ''BMI'',

  ''DiabetesPedigreeFunction'',

  ''Age'',

  ''Outcome'']]

  # 定义特征列和目标列

  [In]: x_cols = [''Pregnancies'',

  ''Glucose'',

  ''BloodPressure'',

  ''BMI'',

  ''DiabetesPedigreeFunction'',

  ''Age'']

  [In]: x = pandas_df[x_cols]

  [In]: y = pandas_df["Outcome"]

  # 使用 StandardScaler 对象标准化特征

  [In]: scaler = StandardScaler()

  [In]: x_scaled = scaler.fit_transform(x)

  # 定义用于交叉验证的模型列表

  [In]: classifiers = [

  LogisticRegression(),

  DecisionTreeClassifier(),

  RandomForestClassifier(),

  LinearSVC(max_iter=1500)])

  ]

  # 对每个模型执行 10 折交叉验证并打印平均准确率

  [In]: for classifier in classifiers:

  result = cross_val_score(

  classifier,

  x_scaled,

  y,

  cv=10,

  scoring= "roc_auc"  #"accuracy"

  )

  # 打印模型名称、平均准确率和准确率标准差

  print(f"{classifier.__class__.__name__} mean:

  {result.mean():.2f}")

  ```




  ## PySpark


  ```

  [In]: from pyspark.sql.session import SparkSession

  [In]: from pyspark.ml.feature import VectorAssembler, StandardScaler

  [In]: from pyspark.ml.classification import LogisticRegression, DecisionTreeClassifier,
  RandomForestClassifier, LinearSVC

  [In]: from pyspark.ml.evaluation import BinaryClassificationEvaluator

  [In]: from pyspark.ml.tuning import CrossValidator, ParamGridBuilder

  [In]: from pyspark.sql.functions import col

  [In]: import pandas as pd

  # 从 CSV 文件读取数据并创建 Pandas 数据框

  [In]: url = ''https://raw.githubusercontent.com/abdelaziztestas/spark_book/main/diabetes.csv''

  [In]: pandas_df = pd.read_csv(url)

  [In]: spark = SparkSession.builder.appName("diabetes_data").getOrCreate()

  [In]: spark_df = spark.createDataFrame(pandas_df)

  # 过滤无效记录

  [In]: spark_df = spark_df.filter((col(''Glucose'') != 0)

  & (col(''BloodPressure'') != 0)

  & (col(''BMI'') != 0)) \

  .select([''Pregnancies'',

  ''Glucose'',

  ''BloodPressure'',

  ''BMI'',

  ''DiabetesPedigreeFunction'',

  ''Age'',

  ''Outcome''])

  # 将特征列合并为单个向量列

  [In]: assembler = VectorAssembler(inputCols=[

  ''Pregnancies'',

  ''Glucose'',

  ''BloodPressure'',

  ''BMI'',

  ''DiabetesPedigreeFunction'',

  ''Age''], outputCol="features")

  [In]: data = assembler.transform(spark_df)

  # 指定标签列的名称

  [In]: data = data.withColumnRenamed("Outcome", "label")

  # 对特征列进行标准化

  [In]: scaler = StandardScaler(inputCol="features", outputCol="scaled_features")

  [In]: data = scaler.fit(data).transform(data)

  # 定义要评估的分类模型

  [In]: classifiers = [

  LogisticRegression(),

  DecisionTreeClassifier(),

  RandomForestClassifier(),

  LinearSVC(maxIter=1500)]

  # 定义模型的参数网格

  [In]: paramGrid = ParamGridBuilder().build()

  # 定义评估器

  [In]: evaluator = BinaryClassificationEvaluator(labelCol="label", rawPredictionCol="rawPrediction",
  metricName="areaUnderROC")

  # 对每个模型执行交叉验证

  [In]: for classifier in classifiers:

  # 定义交叉验证器

  cv = CrossValidator(estimator=classifier,

  estimatorParamMaps=paramGrid,

  evaluator=evaluator, numFolds=10)

  # 使用交叉验证评估模型

  cvModel = cv.fit(data)

  results = cvModel.transform(data)

  accuracy = evaluator.evaluate(results)

  # 打印结果

  print(f"{classifier.__class__.__name__} 均值:

  {accuracy:.2f}")

  ```


  ## 总结


  本章介绍了分类这一机器学习建模技术。演示了如何利用 Scikit-Learn 和 PySpark 对糖尿病数据进行分类，并从四个监督学习分类器（逻辑回归、决策树、随机森林和支持向量机）中选出性能最佳的算法。此外，本章还阐述了交叉验证和超参数调优的过程——这两者都是机器学习流程中的关键步骤。


  在下一章中，我们将演示如何构建、训练、评估和使用另一种监督式机器学习：多元线性回归。我们将展示机器学习所涉及的步骤，包括数据拆分、模型训练、模型评估和预测，在
  Scikit-Learn 和 PySpark 中都是相同的。此外，我们还将演示 Pandas 和 PySpark 在数据处理方面具有相似的方法，这简化了诸如数据探索之类的任务。


