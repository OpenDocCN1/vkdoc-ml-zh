  PySpark 的输出中没有索引，只有三个标签或列的数组。PySpark 不像 Pandas 那样使用索引的概念，因为 PySpark 旨在处理跨多台机器的分布式计算，而
  Pandas 则设计用于单台机器上的内存数据处理。在 PySpark 中，数据通常以分布式方式存储在多台机器上，并且计算在这些机器上并行执行。这使得索引概念在
