  让我们总结一下代码在每个步骤中的作用：


  **步骤 1：导入必要的库**




  在此步骤中，我们导入代码中将要使用的必要库和模块。这些库包括 Pandas、用于分布式数据处理的 PySpark，以及用于机器学习任务（如创建特征向量和训练决策树分类器）的特定模块。我们还从
  Scikit-Learn 导入了 `load_iris` 函数，用于加载鸢尾花数据集。


  步骤 2：创建 PySpark DataFrame


  此步骤包含两个子步骤：


  2.1\. 加载鸢尾花数据集并以 Pandas DataFrame 形式返回


  这里定义了一个自定义函数 `load_iris_dataset`。该函数使用 Scikit-Learn 的 `load_iris` 函数加载鸢尾花数据集，并提取特征数据
  (X)、目标标签 (y) 以及其他相关信息，如特征名称和目标名称。然后，它创建一个包含数据和标签的 Pandas DataFrame 并返回。


  2.2\. 使用 SparkSession (spark) 将 Pandas DataFrame 转换为 Spark DataFrame


  在此子步骤中，定义了另一个自定义函数 `convert_to_spark_df`。它接收 Pandas DataFrame 作为输入参数，以及一个 SparkSession
  (spark)，并使用 `spark.createDataFrame` 方法将 Pandas DataFrame 转换为 Spark DataFrame。生成的
  Spark DataFrame 将用于 PySpark 中的后续处理。


  步骤 3：数据准备


  此步骤包含两个子步骤：


  3.1\. 准备特征向量


  这里定义了一个自定义函数 `prepare_feature_vector`。该函数接收一个 Spark DataFrame 作为输入 (spark_df)，并通过使用
  PySpark 的 `VectorAssembler` 将特征列组合成一个向量列来准备特征向量。结果是一个包含特征向量列的新 DataFrame。


  3.2\. 将数据集拆分为训练集和测试集


  在此子步骤中，定义了一个自定义函数 `split_data`。它接收转换后的数据（包含特征向量的 DataFrame）作为输入，以及训练集比例和随机种子的参数。该函数使用
  PySpark 提供的 `randomSplit` 方法将数据拆分为训练集和测试集。


  步骤 4：模型训练


  在此步骤中，定义了一个自定义函数 `build_decision_tree`。它接收训练数据作为输入，并使用 PySpark 机器学习库 (pyspark.ml)
  中的 `DecisionTreeClassifier` 构建一个决策树分类器。返回训练好的模型。


  决策树的一个重要特性是，一旦模型训练完成，我们可以提取特征重要性，以识别驱动预测的特征以及冗余特征。我们可以使用 `featureImportances` 属性来实现此任务。


  在以下代码中，我们为该属性添加了几行代码，以将特征名称附加到特征重要性上，并按降序排序：


  ```

  [In]: feature_importances = model.featureImportances.toArray()

  [In]: feature_names = spark_df.columns[:-1]

  [In]: feature_importance_tuples = [(feature_name, importance) for feature_name,
  importance in zip(feature_names, feature_importances)]

  [In]: sorted_feature_importance_tuples = sorted(feature_importance_tuples, key=lambda
  x: x[1], reverse=True)

  [In]: for feature_name, importance in sorted_feature_importance_tuples:

  print(f"{feature_name}: {importance}")

  [Out]:

  petal length (cm): 0.52

  petal width (cm): 0.50

  sepal length (cm): 0.0

  sepal width (cm): 0.0

  ```


  在上述代码中，我们首先获取特征重要性及其对应的名称，创建一个将每个特征与其重要性分数配对的元组列表。接下来，我们根据重要性分数按降序对该列表进行排序，从而能够识别出最具影响力的特征。最后，我们打印排序后的特征重要性。


  输出结果表明，花瓣的长度和宽度是模型预测的主要驱动力。在 PySpark 模型中，花萼的长度和宽度是冗余的，因为它们的重要性分数均为 0。


  步骤 5：模型评估


  在此步骤中，定义了一个自定义函数 `evaluate_model`。它接收训练好的模型和测试数据作为输入。该函数使用模型进行预测，并使用 PySpark 的 `MulticlassClassificationEvaluator`
  评估其性能。它返回模型的准确率和预测结果。


  在步骤 6 中调用这些函数后，我们得到一个输出，显示准确率为 94%。这表明决策树模型在测试数据上进行正确预测方面相当有效。它正确分类了绝大多数实例的目标变量，这通常是模型预测能力良好的标志。


  值得注意的是，PySpark 模型的准确率低于 Scikit-Learn 的 100%。这种差异是因为我们使用默认超参数构建模型，而这两个框架具有不同的默认设置。我们将在第
  16 章中探讨如何自定义算法超参数。


  ## 整合所有步骤


  在本章前面的部分中，我们提供了独立演示每个建模步骤的代码。然而，在本节中，我们的目标是将所有这些步骤中的相关代码合并到一个代码块中。这使得数据科学家能够将代码作为一个整体来执行。


  ### Scikit-Learn


  ```

  [In]: from sklearn.datasets import load_iris

  [In]: from sklearn.model_selection import train_test_split

  [In]: from sklearn.tree import DecisionTreeClassifier

  [In]: from sklearn.metrics import accuracy_score

  [In]: def load_iris_dataset():

  """

  加载并返回鸢尾花数据集的特征 (X) 和标签 (y)。

  返回:

  X (numpy.ndarray): 鸢尾花数据集的特征矩阵。

  y (numpy.ndarray): 鸢尾花数据集的目标标签。

  """

  iris = load_iris()

  X = iris.data

  y = iris.target

  return X, y

  [In]: def split_data(X, y, test_size=0.2, random_state=42):

  """

  将数据拆分为训练集和测试集。

  参数:

  X (numpy.ndarray): 数据集的特征矩阵。

  y (numpy.ndarray): 数据集的目标标签。

  test_size (float): 包含在测试集中的数据比例 (默认=0.2)。

  random_state (int): 随机数生成的种子 (默认=42)。

  返回:

  X_train (numpy.ndarray): 训练集的特征矩阵。

  X_test (numpy.ndarray): 测试集的特征矩阵。

  y_train (numpy.ndarray): 训练集的目标标签。

  y_test (numpy.ndarray): 测试集的目标标签。

  """

  X_train, X_test, y_train, y_test = train_test_split(X, y,

  test_size=test_size, random_state=random_state)

  return X_train, X_test, y_train, y_test

  [In]: def build_decision_tree(X, y):

  """

  使用提供的特征 (X) 和标签 (y) 构建并返回一个决策树分类器。

  参数:

  X (numpy.ndarray): 数据集的特征矩阵。

  y (numpy.ndarray): 数据集的目标标签。

  返回:

  clf (DecisionTreeClassifier): 训练好的决策树分类器。

  """

  clf = DecisionTreeClassifier()

  clf.fit(X, y)

  return clf

  [In]: def evaluate_model(clf, X_test, y_test):

  """

  评估并返回提供的分类器 (clf) 在测试特征 (X_test) 和标签 (y_test) 上的准确率分数。

  参数:

  clf (DecisionTreeClassifier): 训练好的决策树分类器。

  X_test (numpy.ndarray): 测试集的特征矩阵。

  y_test (numpy.ndarray): 测试集的目标标签。

  返回:

  accuracy (float): 分类器在测试数据上的准确率分数。

  """

  y_pred = clf.predict(X_test)

  accuracy = accuracy_score(y_test, y_pred)

  return accuracy

  [In]: X, y = load_iris_dataset()

  [In]: X_train, X_test, y_train, y_test = split_data(X, y)

  [In]: clf = build_decision_tree(X_train, y_train)

  [In]: accuracy = evaluate_model(clf, X_test, y_test)

  [In]: print("Accuracy:", accuracy)

  ```




  ### PySpark


  ```

  [In]: import pandas as pd

  [In]: from pyspark.sql import SparkSession

