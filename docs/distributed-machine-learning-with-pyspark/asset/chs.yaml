  输出结果表明模型已正确分类了每个品种，因为所有五个预测值都与实际标签值匹配。这导致了 100% 的准确率。然而，为了更全面地了解模型性能，有必要使用整个样本点集来计算整体准确率。


  **步骤 5：模型评估**


  此步骤中的代码定义了一个名为 `evaluate_model` 的函数，用于评估训练好的分类器模型在测试数据集上的性能并计算其准确率。该函数接受三个参数：


  *   `clf`：要评估的训练好的分类器模型

  *   `X_test`：测试数据集的特征数据（矩阵）

  *   `y_test`：测试数据集的真实目标标签（数组）


  函数内部的第一行使用分类器 `clf` 对测试数据集的特征矩阵 `X_test` 进行标签预测。分类器的 `predict` 方法将特征数据作为输入，并返回给定数据的预测标签。


  下一行使用 `accuracy_score` 函数计算预测标签（`y_pred`）与真实标签（`y_test`）相比的准确率。`accuracy_score`
  函数衡量预测标签中正确预测相对于真实标签的比例。


  最后，该函数将计算出的准确率作为输出返回。准确率分数表示训练好的分类器在测试数据上的表现如何。


  **步骤 6：使用函数**


  在此步骤中，我们主要使用之前定义的函数。在此步骤的代码序列中，使用 `load_iris_dataset` 函数加载鸢尾花数据集。然后使用 `split_data`
  函数将数据集分割为训练集和测试集，默认测试集大小为 20%。使用 `build_decision_tree` 函数利用训练数据构建决策树分类器。使用 `evaluate_model`
  函数评估分类器在测试数据上的准确率，该函数使用 `accuracy_score` 计算准确率。最后，打印模型在测试数据上的准确率，得到 1.00（或 100%）的准确率，表明在此特定执行中达到了完美拟合。


