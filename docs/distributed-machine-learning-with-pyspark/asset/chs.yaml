  ```




  ### 使用 PySpark 实现随机森林


  在本小节中，我们将开发与上一小节提供的 Scikit-Learn 代码等效的 PySpark 代码。建模步骤大致相同：数据准备、模型训练、模型评估和预测。与 Scikit-Learn
  类似，我们通过导入必要的库来开始模型构建过程：


  步骤 1\. 导入必要的库


  ```

  [In]: from sklearn.datasets import load_iris

  [In]: import pandas as pd

  [In]: from pyspark.sql import SparkSession

  [In]: from pyspark.ml.feature import VectorAssembler

  [In]: from pyspark.ml.classification import RandomForestClassifier

  [In]: from pyspark.ml.evaluation import MulticlassClassificationEvaluator

  ```


  步骤 2\. convert_to_spark_df() 函数


  为了能够使用 PySpark，我们需要将包含鸢尾花数据集的 Pandas DataFrame 转换为 PySpark DataFrame。`convert_to_spark_df()`
  函数接收一个 Pandas DataFrame（`pandas_df`）和一个 SparkSession（`spark`）作为输入。它使用 SparkSession
  的 `createDataFrame()` 方法将 Pandas DataFrame 转换为 Spark DataFrame。然后返回生成的 Spark DataFrame：


  ```

  [In]: def convert_to_spark_df(pandas_df, spark):

  return spark.createDataFrame(pandas_df)

  ```


  步骤 3\. build_random_forest() 函数


  `build_random_forest()` 函数接收一个 Spark DataFrame（`data`）作为输入。它创建一个 `RandomForestClassifier()`
  对象 `rf`，并将标签列设置为 `label`，特征列设置为 `features`。然后，该函数使用 `fit` 方法将随机森林模型拟合到提供的数据上，从而得到一个训练好的模型。最后，返回训练好的模型：


  ```

  [In]: def build_random_forest(data):

  rf = RandomForestClassifier(labelCol="label",

  featuresCol="features")

  model = rf.fit(data)

  return model

  ```


  步骤 4\. evaluate_model() 函数


  `evaluate_model()` 函数接收训练好的随机森林模型（`model`）和一个 Spark DataFrame（`data`）作为输入。它使用训练好的模型通过
  `transform()` 方法对提供的数据进行预测。预测结果存储在新的 DataFrame `predictions` 中。然后，该函数创建一个 `MulticlassClassificationEvaluator`
  对象 `evaluator`，并将标签列设置为 `label`，预测列设置为 `prediction`，评估指标设置为 `accuracy`。它使用评估器的 `evaluate()`
  方法评估预测的准确率，从而得到一个准确率分数。该函数返回准确率分数和预测结果 DataFrame：


  ```

  [In]: def evaluate_model(model, data):

  predictions = model.transform(data)

  evaluator =

  MulticlassClassificationEvaluator(labelCol="label",

  predictionCol="prediction", metricName="accuracy")

  accuracy = evaluator.evaluate(predictions)

  return accuracy, predictions

  ```


  步骤 5\. 使用函数


  现在我们可以调用前面的函数，以获取准确率指标来评估模型性能：


  5.1\. 加载鸢尾花数据集


  ```

  [In]: iris = load_iris()

  ```


  5.2\. 访问特征数据（X）和目标标签（y）


  ```

  [In]: X = iris.data

  [In]: y = iris.target

  ```


  5.3\. 定义列名


  ```

  [In]: feature_names = iris.feature_names

  [In]: target_names = iris.target_names

  ```


  5.4\. 创建包含列名的 DataFrame


  ```

  [In]: df = pd.DataFrame(X, columns=feature_names)

  [In]: df[''label''] = y

  ```


  5.5\. 创建 SparkSession


  ```

  [In]: spark = SparkSession.builder.appName("IrisRandomForest").getOrCreate()

  ```


  5.6\. 将 Pandas DataFrame 转换为 PySpark DataFrame


  ```

  [In]: data = convert_to_spark_df(df, spark)

  ```


  5.7\. 准备特征向量


  ```

  [In]: assembler = VectorAssembler(inputCols=data.columns[:-1], outputCol="features")

  [In]: transformed_data = assembler.transform(data)

  ```


  5.8\. 将数据集拆分为训练集和测试集


  ```

  [In]: train_data, test_data = transformed_data.randomSplit([0.8, 0.2], seed=42)

  ```


  5.9\. 构建随机森林模型


  ```

  [In]: model = build_random_forest(train_data)

  ```


  5.10\. 评估模型并获取预测结果


  ```

  [In]: accuracy, predictions = evaluate_model(model, test_data)

  ```


  此时，我们已经可以比较一部分预测数据和实际数据，以了解模型的表现：


  | 标签 | 预测值 |

  | --- | --- |

  | 0 | 0 |

