  \ Pandas 输出，我们使用列名列表遍历分类变量的每一列。对于每一列，我们执行以下操作：\n\n*   我们使用 Pandas Series 的 `unique()`\
  \ 方法来获取唯一值数组。该方法返回 Pandas Series 中所有唯一值的数组。\n*   然后，我们打印列名及其唯一值。\n\n```\n[In]: for\
