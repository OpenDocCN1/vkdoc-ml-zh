  ## 数据集


  我们项目的第一步是生成一些数据，以演示如何使用 Pandas 和 PySpark 进行数据探索，接着使用 Scikit-Learn 和 PySpark 进行多元线性回归的机器学习。


  以下代码为 Scikit-Learn 生成了这些数据：


  ```

  [In]: import pandas as pd

  [In]: from sklearn.datasets import make_regression

  [In]: X, y = make_regression(n_samples=100, n_features=2, noise=10, random_state=42)

  [In]: pandas_df = pd.DataFrame({''Feature 1'': X[:, 0], ''Feature 2'': X[:, 1],
  ''Target'': y})

  ```


  这段代码使用 Scikit-Learn 的 `make_regression` 函数生成了包含两个特征和随机噪声的回归数据。`n_samples` 参数指定样本数量，`n_features`
  指定特征数量，`noise` 控制添加到数据中的随机噪声量，而 `random_state` 则确保结果可重现。


  生成的特征存储在变量 X 中，对应的目标变量存储在变量 y 中。代码将 NumPy 数组 X 和 y 转换为名为 `pandas_df` 的 Pandas DataFrame。这是通过一个字典构建的，其中键是列名（Feature
  1、Feature 2、Target），值则从 X 和 y 数组中提取。`X[:, 0]` 代表 X 的第一列，`X[:, 1]` 代表第二列，`y` 代表目标值。X
  中的值被分配到对应的 Feature 1 和 Feature 2 列，而 y 中的值则被分配到 Target 列。


  让我们用 PySpark 做同样的事情：


  ```

  [In]: from pyspark.sql import SparkSession

  [In]: spark = SparkSession.builder.appName("PySparkRegressionData").getOrCreate()

  [In]: spark_df = [(float(X[i, 0]), float(X[i, 1]), float(y[i])) for i in range(len(X))]

  [In]: spark_df = spark.createDataFrame(spark_df, ["Feature 1", "Feature 2", "Target"])

  ```


  为了在 PySpark 环境中处理数据，代码将之前生成的 NumPy 数组 X 和 y 转换为 PySpark DataFrame。DataFrame 的每一行都创建为一个元组，其中特征值和目标值被转换为浮点数并包含在元组中。循环遍历
  X 的长度范围，确保为对应的特征值和目标值创建每一行。名为 `spark_df` 的 PySpark DataFrame 创建时包含相同的三列：Feature
  1、Feature 2 和 Target。


