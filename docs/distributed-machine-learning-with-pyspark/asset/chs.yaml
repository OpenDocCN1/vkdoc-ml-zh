  \ `pyspark.sql.functions` 模块中提供的 `col()` 函数。在我们的循环中，每个分类列都会被单独处理，遵循以下步骤：\n\n*  \
  \ 我们通过使用 `select()` 方法创建一个新的 DataFrame，仅关注所需的列。\n*   然后对选定的列应用 `distinct()` 方法来收集唯一值。\n\
  *   通过使用 `collect()` 方法，我们将所有记录作为 Row 对象的列表检索出来。\n*   为了从列表中分离出唯一值，我们利用带有 lambda\
  \ 函数的 `flatMap()`。\n*   在打印输出中，将结果列名与其唯一值关联起来。\n\n```\n[In]: from pyspark.sql.functions\
  \ import col\n[In]: for col_name in ['mainroad', 'guestroom', 'basement', 'hotwaterheating',\
