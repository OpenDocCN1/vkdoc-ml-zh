  ## 决策树分类


  在本节中，我们将使用鸢尾花数据集构建、训练并评估一个决策树分类器。该数据集包含三种鸢尾花（山鸢尾、维吉尼亚鸢尾和变色鸢尾）各 50 个样本的四个特征（花萼和花瓣的长度与宽度）。由于这些特征采用相同的测量单位（厘米），因此无需进行缩放。无论是否缩放，决策树都能同样出色地执行。


  使用鸢尾花数据集，决策树分类器将根据输入数据的特征，遵循一组规则进行预测。它从根节点开始，评估一个特征以决定遵循哪个分支。例如，如果花瓣长度小于 2.5 厘米，它可能遵循左分支；如果大于或等于
  2.5 厘米，则可能遵循右分支。此过程持续进行，直到到达一个叶节点，分类器会根据到达该叶节点的训练样本的多数类别来分配一个类别标签。这个分配的类别标签即为给定输入的预测结果。


  我们将使用 Scikit-Learn 和 PySpark 来构建和训练决策树分类器，并使用鸢尾花数据集评估其性能。此比较旨在帮助已经熟悉 Scikit-Learn
  库的数据科学家顺利过渡到 PySpark，以便利用其提供的分布式机器学习环境。这能够处理更大规模的数据，并提高训练和评估的速度。


  在开始模型构建过程之前，让我们看看 Scikit-Learn 和 PySpark 在建模步骤以及它们使用的函数和类方面有何异同。


  ## Scikit-Learn 与 PySpark 的相似之处


  下表比较了在多类决策树分类的模型构建中，Scikit-Learn 使用的类与函数及其在 PySpark 中的对应项：


  | 任务 | Scikit-Learn | PySpark |

  | --- | --- | --- |

  | 数据准备 |   |   |

  | 数据拆分 | train_test_split | randomSplit |

  | 特征缩放 | StandardScaler | StandardScaler |

  | 类别编码 | OneHotEncoder | OneHotEncoder |

  | 缺失值处理 | SimpleImputer | Imputer |

  | 特征向量化 | 不适用 | VectorAssembler |

  | 模型训练 |   |   |

  | 模型类 | DecisionTreeClassifier | DecisionTreeClassifier |

  | 训练 | fit( ) | fit( ) |

  | 模型评估 |   |   |

  | 准确率 | accuracy_score | MultiClassificationEvaluator |

  | 精确率 | precision_score |

  | 召回率 | recall_score |

  | F1 分数 | f1_score |

  | 预测 |   |   |

  | 生成预测 | predict | transform |


  这些比较表明，Scikit-Learn 和 PySpark 都遵循相同的建模步骤：数据准备、模型训练、模型评估和预测。在某些情况下，两个平台中函数或类的名称甚至相同。这些包括：`StandardScaler`，用于通过移除均值并缩放到单位方差来标准化特征；`OneHotEncoder`，用于将分类数据转换为独热编码特征；`DecisionTreeClassifier`，代表一个决策树分类器模型；以及
  `fit()` 方法，用于训练机器学习模型。


  然而，也存在显著差异。例如，Scikit-Learn 不需要 `VectorAssembler` 步骤来将特征组合成单个向量。原因在于，对于像 Scikit-Learn
  这样的非分布式系统，此步骤并非必需。类似地，PySpark 的评估类 `MultiClassificationEvaluator` 旨在处理所有性能指标，这与
  Scikit-Learn 不同，后者针对评估指标（如 `accuracy_score`、`precision_score`、`recall_score` 和 `f1_score`）存在独立的函数。


  此外，Scikit-Learn 提供了一个名为 `confusion_matrix` 的专用函数来计算混淆矩阵，而在 PySpark 中，此计算通常手动执行。不过，存在一个
  RDD 类（`MulticlassMetrics`）可以自动计算混淆矩阵以及所有其他评估指标（精确率、召回率、F1 分数），如下所示：


  ```

  [In]: from pyspark.mllib.evaluation import MulticlassMetrics

  [In]: metrics = MulticlassMetrics(predictions)

  [In]: precision = metrics.precision()

  [In]: recall = metrics.recall()

  [In]: f1_score = metrics.fMeasure()

  [In]: confusion_matrix = metrics.confusionMatrix().toArray()

  ```


  然而，在本书中，我们的重点是 ML 库而非 RDD 的 mllib，因为 RDD 使用较少，并且可能在某个时候被弃用。


  在本节的后续小节中，我们将把这些建模步骤转化为代码。值得注意的是，我们使用默认超参数构建模型，这意味着 Scikit-Learn 和 PySpark 的结果可能会有所不同。我们将在第
  16 章中演示如何微调模型的超参数。




  ### 使用 Scikit-Learn 进行决策树分类


  在本小节中，我们将编写 Scikit-Learn 代码来构建、训练和评估决策树分类模型的性能，并利用该模型根据鸢尾花的特征测量值预测其品种。我们遵循的步骤与之前描述的相同：数据准备、模型训练、评估和预测。然而，在这些步骤之前，我们需要导入必要的库并创建一个包含鸢尾花数据的
  DataFrame。


  **步骤 1：导入必要的库**


  在此步骤中，我们导入必要的库来加载鸢尾花数据、将数据拆分为训练集和测试集、构建决策树分类器并计算准确率分数：


  ```

  [In]: from sklearn.datasets import load_iris

  [In]: from sklearn.model_selection import train_test_split

  [In]: from sklearn.tree import DecisionTreeClassifier

  [In]: from sklearn.metrics import accuracy_score

  ```


  **步骤 2：读取数据**


  在此步骤中，我们定义一个函数来加载并返回鸢尾花数据集的特征（X）和标签（y）。


  ```

  [In]: def load_iris_dataset():

  iris = load_iris()

  X = iris.data

  y = iris.target

  return X, y

  ```


  **步骤 3：数据准备**


  在此步骤中，我们定义一个函数将数据拆分为训练集和测试集。


  ```

  [In]: def split_data(X, y, test_size=0.2, random_state=42):

  X_train, X_test, y_train, y_test = train_test_split(X, y,

  test_size=test_size, random_state=random_state)

  return X_train, X_test, y_train, y_test

  ```


  **步骤 4：模型训练**


  在此步骤中，我们定义一个函数，使用提供的特征（X）和标签（y）构建并返回一个决策树分类器。


  ```

  [In]: def build_decision_tree(X, y):

  clf = DecisionTreeClassifier()

  clf.fit(X, y)

  return clf

  ```


  **步骤 5：模型评估**


  此步骤中的代码定义了一个函数，用于评估并返回决策树分类器（clf）在测试特征（X_test）和标签（y_test）上的准确率分数。


  ```

  [In]: def evaluate_model(clf, X_test, y_test):

  y_pred = clf.predict(X_test)

  accuracy = accuracy_score(y_test, y_pred)

  return accuracy

  ```


  **步骤 6：使用函数**


  此步骤包含多个子步骤，用于调用先前定义的函数：


  6.1\. 加载鸢尾花数据集


  ```

  [In]: X, y = load_iris_dataset()

  ```


  6.2\. 使用 `split_data` 函数将数据集拆分为训练集和测试集


  ```

  [In]: X_train, X_test, y_train, y_test = split_data(X, y)

  ```


  6.3\. 使用训练数据构建决策树模型


  ```

  [In]: clf = build_decision_tree(X_train, y_train)

  ```


  6.4\. 在测试数据上评估模型


  ```

  [In]: accuracy = evaluate_model(clf, X_test, y_test)

  ```


  6.5\. 打印准确率


  ```

  [In]: print("Accuracy:", accuracy)

  [Out]: 1.00

  ```


  让我们逐步分析代码：


  **步骤 1：导入必要的库**


  在此步骤中，代码导入了多个模块和类，用于准备数据、构建和训练模型、评估其性能以及对测试数据进行预测。


  代码首先导入 `load_iris` 函数以加载鸢尾花数据集。然后引入 `train_test_split` 函数，该函数用于将数据集拆分为训练子集和测试子集。这是为了确保模型的性能是在其训练期间未见过的数据上进行评估的。下一个导入语句引入了
  `DecisionTreeClassifier` 类，该类代表决策树分类器。最后一个导入语句引入了 `accuracy_score` 函数，该函数计算分类模型预测的准确率。它将预测标签与实际标签进行比较，并返回正确预测实例的比例。


  **步骤 2：读取数据**


  在此步骤中，代码定义了一个函数来加载并返回鸢尾花数据集。在函数内部，代码使用 `load_iris` 函数加载鸢尾花数据集，包括特征和目标标签。然后，它将鸢尾花数据集的特征数据和目标标签分别赋值给变量
  X 和 y。该函数最终将特征矩阵 X 和目标数组 y 作为元组返回。


  **步骤 3：数据准备**


  在此步骤中，代码定义了一个名为 `split_data` 的函数，用于将数据集拆分为训练集和测试集。它接受以下参数：


  *   X：数据集的特征数据（矩阵）。

  *   y：数据集的目标标签（数组）。

  *   test_size：要包含在测试拆分中的数据集比例（默认为 0.2，即 20%）。

  *   random_state：随机数生成器的种子（默认为 42）。它确保拆分的可重复性。


  函数内部的行使用 `train_test_split` 函数将数据拆分为训练集和测试集。它以特征矩阵 X 和目标标签 y 作为输入。`test_size` 参数决定应分配给测试的数据比例，此处为
  0.2 或 20%。`random_state` 参数设置拆分过程中数据随机打乱的种子。


  该函数返回四个变量：


  *   X_train：训练集的特征数据

  *   X_test：测试集的特征数据

  *   y_train：训练集的目标标签

  *   y_test：测试集的目标标签


  最后，该函数将这四个集合（训练和测试的特征数据及标签）作为元组返回。


  **步骤 4：模型训练**


  此步骤中的代码定义了一个名为 `build_decision_tree` 的函数，用于使用特征 X 和标签 y 构建并返回一个决策树分类器。该函数接受两个参数：


  *   X：数据集的特征数据（矩阵）

  *   y：数据集的目标标签（数组）


  函数内部的第一行创建了一个 `DecisionTreeClassifier` 类的实例。这代表一个基于决策树的分类模型。分类器使用其默认设置进行初始化，我们可以通过向此构造函数传递各种参数来自定义其行为。我们将在第
  16 章中展示如何自定义模型的参数。


  下一行在提供的特征矩阵 X 和目标标签 y 上训练决策树分类器。`fit` 方法学习数据中的模式和关系，使分类器能够基于所学知识进行预测。


  最后，该函数将训练好的决策树分类器（clf）作为输出返回。这使我们能够使用训练好的分类器对新的、未见过的数据进行预测。


  训练好模型后，我们可以检查哪些特征驱动了模型的预测：


  ```

  [In]: feature_names = [''sepal length'', ''sepal width'', ''petal length'', ''petal
  width'']

  [In]: feature_importances = clf.feature_importances_

  [In]: importances_with_names = list(zip(feature_names, feature_importances))

  [In]: importances_with_names_sorted = sorted(importances_with_names, key=lambda
  x: x[1], reverse=True)

  [In]: for name, importance in importances_with_names_sorted:

  print(f"{name}: {importance:.4f}")

  [Out]:

  petal length: 0.9061

  petal width: 0.0772

  sepal length: 0.0167

  sepal width: 0.0000

  ```


  我们可以用一行代码打印特征重要性：


  ```

  [In]: clf.feature_importances_

  ```


  然而，我们需要添加特征名称并按降序对重要性进行排序。代码首先定义一个列表 `feature_names`，其中包含鸢尾花数据集中四个特征的名称。然后，它提取由训练好的决策树分类器
  `clf` 计算出的特征重要性。属性 `feature_importances_` 提供了分类器分配给每个特征的重要性分数。




  进入下一步，代码使用 `zip` 函数将 `feature_names` 列表和 `feature_importances` 数组组合成一个元组列表。然后，代码使用
  `sorted` 函数，并设置 `reverse=True` 参数，根据重要性分数（其中 `x[1]` 指每个元组的第二个元素，即重要性分数）对元组列表（`importances_with_names`）进行降序排序。


  接下来的步骤涉及一个循环，该循环遍历排序后的元组列表 `importances_with_names_sorted`，并将每个元组解包为变量 `name` 和
  `importance`。在循环内部，有一行代码打印特征名称（`name`）及其对应的重要性分数（`importance`）。


  输出结果显示了每个特征对分类器预测的相对影响。重要性分数较高的特征对模型的决策过程贡献更大，而分数较低的特征影响相对较小。在我们的模型中，花瓣长度和宽度对鸢尾花数据集的决策树分类器决策起着更关键的作用。花萼宽度的分数为
  0，表示它是冗余的，对预测没有贡献。


  我们还可以查看实际值与预测值之间的样本对比：


  |     | 实际值 | 预测值 |

