  再造时代与优化数据到学习再到行动时代的对比


  如今，崛起的国际竞争威胁显然是**中国**，与日本不同，中国拥有规模优势和持续动力，能够成为更持久的竞争压力驱动因素。而且，这种竞争压力不仅限于像日本那样主要提高制造业的竞争门槛，而是几乎涉及经济的每一个领域，包括人工智能、生物技术和材料科学等科学领域中最先进的理论和应用。


  在现在看来似乎有些过时的 20 世纪 80 年代和 90 年代的技术环境中，推动再造浪潮的主要动力是企业资源规划（ERP）系统。这些系统，至少在最初，主要关注制造和采购等交易流程。那是那个时代颠覆性的企业技术。


  当然，现在我们有了云、物联网、人工智能/机器学习、先进的商业智能能力、新的协作方式等等。紧随这些技术之后的是区块链、虚拟/混合现实、3D 打印等等。正如中国作为全球化的竞争颠覆力量远非日本可比，当今技术的颠覆潜力与再造时代早期相比，很可能要大一个数量级。


  再造时代的财务驱动力主要是效率，这当然仍然重要。然而，再造的这种普遍关注点也是它常常不受许多员工欢迎的原因，因为它有时被视为仅仅是裁员的委婉说法。相比之下，优化数据到学习再到行动的财务驱动力则更为全面。从整体企业绩效的角度来看，优化数据到学习再到行动旨在提高资产回报率以及其他重要的财务指标。而从单个投资机会以及投资机会组合的角度来看，它关注的是总价值，其中明确包含了学习的价值。因此，它触及组织中的每一个经济决策。


  再造更侧重于改善组织的交易和运营领域，而优化数据到学习再到行动则拥有更广泛的职责，即普遍改善学习和决策，影响组织的每一个领域，包括几乎所有商业模式的核心竞争优势领域——即组织持续成长和自我更新的流程。


  并且，由于优化数据到学习再到行动在其企业绩效目标以及其覆盖组织职能和流程的范围方面都更为全面，它不易产生适得其反的局部优化和其他经济扭曲，而这些往往是更狭隘的绩效改进关注点带来的常见后果。


  数据到学习再到行动的时代注定会持续多久？当然，技术的进步绝不会削弱其重要性。相反，这些进步只会使优化数据到学习再到行动变得更加关键，尤其是当基于机器的学习变得日益普遍和强大时。


  因此，很难想象会有这样一个时代，优化组织的数据到学习再到行动流程不再是实现可持续绩效改进的最相关杠杆。毕竟，被优化的是普遍流程，即学习的流程。还有什么比这更根本的呢？


  ## 后续步骤


  那么，你和你的组织下一步该做什么？我建议尝试一种方法，它能够：


  *   提供一种在当今高度颠覆性的竞争和技术环境中成功导航的方法；

  *   聚焦于可持续竞争优势的核心——改进学习和决策，包括针对企业最具战略意义领域的学习和决策；

  *   通过可信地量化学习投资的价值，支持组织的持续更新；

  *   简化组织的决策过程；

  *   直接改善关键财务指标；并且

  *   完全适用于组织的所有部分。


  当然，这些是优化数据到学习再到行动方法所独有的属性组合。它们也应该是能够满足决策者关注点的要素，这些决策者可以帮助你为你的组织实现这一目标。第 10 章提供了一些关于如何开始的建议。


  因此，本书为你提供了数据和信息。从这些数据和信息中，你已经学到了东西。而你现在知道，这个过程的下一步是……行动！




