  当我们浏览图 11-1 时，请注意其与 20 世纪 90 年代至 21 世纪初的再造范式的相似之处和对比之处。例如，在 20 世纪 80 年代，日本是新的国际竞争威胁，最终不仅推动了再造浪潮，也推动了诸如质量改进和约束理论等方法的普及，所有这些最终都为全球范围内更强大的企业和实践做出了贡献。


