  trans: '

    ## 自动驾驶汽车


    在人工智能领域，最具深远影响的领域之一便是自动驾驶汽车。有趣的是，这一类别其实并不新鲜。没错，几十年来它一直是众多科幻小说的标志性元素！但一段时间以来，也出现了许多现实生活中的创新实例，例如：


    *   *斯坦福推车*：其研发始于 20 世纪 60 年代初，最初目标是制造用于月球任务的遥控车辆。但研究人员最终改变了重点，开发出了一款基本的自动驾驶车辆，它利用摄像头和人工智能进行导航。虽然这在当时是一项杰出的成就，但它并不实用，因为规划任何移动都需要超过
    10 分钟！


    *   *恩斯特·迪克曼斯*：一位杰出的德国航空航天工程师，他在 20 世纪 80 年代中期将注意力转向了将一辆梅赛德斯货车改装成自动驾驶汽车的想法。他连接了摄像头、传感器和计算机。他在软件使用方面也很有创意，例如，只将图形处理集中在重要的视觉细节上以节省电力。通过这一切，他成功开发出一个能够控制汽车转向、油门和刹车的系统。1994
    年，他在巴黎的一条高速公路上测试了这辆梅赛德斯，行驶了超过 600 英里，最高时速达到 81 英里。^(¹⁹⁴) 尽管如此，研究资金还是被撤回了，因为当时远不能确定能否及时实现商业化。而且，人工智能正进入又一个寒冬，这也于事无补。


    但自动驾驶汽车的转折点出现在 2004 年。主要催化剂是伊拉克战争，这场战争给美国士兵带来了惨重伤亡。对于 DARPA（美国国防高级研究计划局）来说，他们相信自动驾驶车辆可能是一个解决方案。


    但该机构面临着许多严峻挑战。这就是为什么它在 2004 年设立了一项名为“DARPA 大挑战赛”的比赛，并提供了 100 万美元的大奖以鼓励更广泛的创新。该赛事包括在莫哈韦沙漠进行一场
    150 英里的比赛，不幸的是，结果并不令人鼓舞，因为参赛车辆表现糟糕。没有一辆车完成比赛！


    但这反而激发了更多的创新。到了第二年，有五辆车完成了比赛。随后在 2007 年，车辆已经非常先进，能够执行诸如掉头和并线等操作。


    通过这个过程，DARPA 得以催生出自动驾驶汽车的关键组件：


    *   *传感器*：包括雷达和超声波系统，能够检测车辆和其他障碍物，例如路缘石。


    *   *摄像头*：能够检测路标、交通信号灯和行人。


    *   *激光雷达（光探测与测距）*：这个设备通常位于自动驾驶汽车顶部，发射激光束来测量周围环境。数据随后被整合到现有地图中。


    *   *计算机*：用于控制汽车，包括转向、加速和制动。该系统利用人工智能进行学习，但也内置了避让物体、遵守交通法规等规则。


    现在，谈到自动驾驶汽车，人们对“自动驾驶”的真正含义存在很多困惑。是指汽车完全自主驾驶，还是必须有人类驾驶员？


    为了理解其中的细微差别，存在五个级别的自动驾驶：


    *   *0 级*：由人类控制所有系统。


    *   *1 级*：计算机控制有限的功能，如巡航控制或制动——但一次只能控制一个。


    *   *2 级*：这类汽车可以自动化两个功能。


    *   *3 级*：汽车自动化所有安全功能。但如果出现问题，驾驶员可以干预。


    *   *4 级*：汽车通常可以自行驾驶。但在某些情况下，人类必须参与。


    *   *5 级*：这是终极目标，汽车完全自主驾驶。


    汽车行业是最大的市场之一，而人工智能很可能会引发颠覆性的变革。要知道，交通是家庭第二大支出，仅次于住房，并且是医疗支出的两倍。还有一点需要记住：典型的汽车只有大约
    5%的时间在使用，因为它通常停放在某个地方。^(¹⁹⁵)


    鉴于改进的巨大潜力，自动驾驶汽车行业吸引了大量投资也就不足为奇了。这不仅涉及风险投资家对众多初创公司的投资，也包括福特、通用汽车和宝马等传统汽车制造商的创新。


    那么，我们何时能看到这个行业成为主流呢？各种预测差异很大。但根据联合市场研究公司的一项研究，预计到 2026 年，该市场规模将达到 5566.7 亿美元，这意味着
    39.47%的复合年增长率。^(¹⁹⁶)


    但仍有许多问题需要解决。“充其量，我们距离一辆不需要方向盘的汽车还有数年之遥，”Fair 公司的首席执行官兼创始人斯科特·佩因特说。“即使你从未来开着一辆德罗宁跑车回来，并带来了如何让这些汽车完全自动驾驶的手册，汽车仍然需要保险、维修和保养。我们每年生产
    1 亿辆汽车，其中美国有 1600 万辆。而且，假设你希望整个供应链都具备这些人工智能功能，考虑到道路上包含不同级别人工智能的汽车数量与没有这些技术的汽车数量相比，仍然需要
    20 年时间。”^(¹⁹⁷)


    但还有许多其他因素需要考虑。毕竟，事实仍然是驾驶是复杂的，尤其是在城市和郊区。如果交通标志被更改甚至篡改怎么办？如果自动驾驶汽车必须面对一个两难境地，比如是撞向迎面而来的汽车，还是冲上可能有人行道的路缘，该怎么办？所有这些都极其困难。


    即使是看似简单的任务也可能难以完成。谷歌 Waymo 的首席执行官约翰·克拉夫奇克指出，停车场就是一个典型的例子。^(¹⁹⁸) 它们需要寻找可用车位、避开其他车辆和行人（可能难以预测），并驶入车位。


    但技术只是自动驾驶汽车面临的挑战之一。以下是一些其他需要考虑的因素：


    *   *基础设施*：我们的城市和城镇是为传统汽车建造的。但混合使用自动驾驶汽车，可能会产生许多物流问题。汽车如何预测人类驾驶员的行为？实际上，可能需要在道路旁安装传感器。或者另一种选择是为自动驾驶汽车设置专用道路。政府也可能需要改变驾驶员教育，提供关于如何在道路上与自动驾驶汽车互动的指导。


    *   *法规*：这是一个很大的不确定因素。在很大程度上，这可能是最大的障碍，因为政府往往行动缓慢且抗拒变革。美国也是一个诉讼高度频繁的国家——这可能是另一个可能阻碍发展的因素。


    *   *接受度*：自动驾驶汽车可能不会便宜，因为像激光雷达这样的系统成本高昂。这肯定是一个限制因素。但同时，有迹象表明公众对此持怀疑态度。根据美国汽车协会的一项调查，约
    71%的受访者表示他们害怕乘坐自动驾驶汽车。^(¹⁹⁹)


    鉴于所有这些，自动驾驶汽车的初始阶段可能适用于受控场景，例如卡车运输、采矿或穿梭巴士。一个例子是森科尔能源公司，它在加拿大各地使用自动驾驶卡车进行挖掘作业。


    像优步和来福车这样的网约车平台可能是另一个起点。这些服务结构相对清晰，公众也容易理解。

    '
- fmt: '# Waymo 的自动驾驶出租车服务


    请记住，Waymo 一直在凤凰城测试自动驾驶出租车服务（这类似于 Uber 等拼车系统，但汽车拥有自动驾驶系统）。以下是该公司一篇博文的解释：


    我们将首先让乘客访问我们的应用程序。他们可以使用该应用程序全天候呼叫我们的自动驾驶汽车。他们可以在凤凰城大都会区的多个城市间穿梭，包括钱德勒、坦佩、梅萨和吉尔伯特。无论是为了享受一个有趣的夜晚，还是仅仅为了从驾驶中解脱出来，我们的乘客每次都能获得同样干净的车辆，以及我们拥有超过1000万英里公共道路经验的`Waymo
    Driver`。乘客在接受行程前，会根据目的地的时间和距离等因素看到预估价格。^([^(200)](#fn200))


    Waymo 发现，关键在于教育，因为乘客有很多问题。为了解决这个问题，该公司在应用程序中内置了一个聊天系统，以便联系支持人员。汽车的仪表盘上还有一个屏幕，可以提供行程的详细信息。


    根据这篇博文，“来自乘客的反馈在每一步都至关重要。”^([^(201)](#fn201))


    ## 美国 vs. 中国


    中国的迅速崛起令人惊叹。几年内，其经济规模可能超过美国，而增长的关键部分将是人工智能。中国政府设定了雄心勃勃的目标，即到2030年在该技术上投入1500亿美元。^([^(202)](#fn202))
    与此同时，百度、阿里巴巴和腾讯等公司将继续进行重大投资。


    尽管中国通常被认为不如硅谷那样具有创造力或创新性——常被贴上“抄袭者”的标签——但这种看法可能被证明是一个误解。艾伦人工智能研究所的一项研究强调，中国在人工智能领域被引用最多的技术论文数量预计将超过美国。^([^(203)](#fn203))


    中国还有其他一些优势，人工智能专家兼风险投资家李开复在其颇具争议的著作《AI 超级大国：中国、硅谷和新世界秩序》中指出了这一点^([^(204)](#fn204))：


    *   **热情**：早在20世纪50年代，苏联发射人造卫星激发了美国民众对太空计划工程师职业的兴趣。类似的情况实际上也发生在中国。当中国的顶级围棋选手柯洁输给`AlphaGo`人工智能系统时，这无疑是一记警钟。结果是，这激励了许多年轻人投身人工智能事业。


    *   **数据**：中国拥有超过13亿人口，数据资源丰富（互联网用户超过7亿）。但该国的威权政府也至关重要，因为隐私不被认为特别重要，这意味着在开发人工智能模型时有更多的自由度。例如，在一篇发表在《自然医学》上的论文中，中国研究人员获取了60万名患者的数据来进行一项医疗研究。^([^(205)](#fn205))
    尽管仍处于早期阶段，但研究表明，一个人工智能模型能够有效诊断儿童疾病，如流感和脑膜炎。


    *   **基础设施**：作为中国政府投资计划的一部分，重点一直放在创建允许自动驾驶汽车和其他人工智能系统运行的下一代城市上。5G网络也在积极部署。


    至于美国，政府对人工智能的态度则要谨慎得多。特朗普总统签署了一项名为“美国人工智能倡议”的行政命令，以鼓励该技术的发展，但条款含糊不清，且远未明确将投入多少资金。


    ## 技术性失业


    技术性失业的概念因大萧条时期著名经济学家约翰·梅纳德·凯恩斯而广为人知，它解释了创新如何导致长期失业。然而，这方面的证据一直难以捉摸。尽管自动化严重影响了制造业等行业，但随着人们的适应，劳动力通常会经历转型。


    但人工智能革命会有所不同吗？很有可能。例如，加利福尼亚州州长加文·纽森担心，该州可能会在卡车运输和仓储等领域出现大规模失业——而且很快就会发生。^([^(206)](#fn206))


    另一个例子：`Harvest CROO Robotics`公司制造了一个名为`Harv`的机器人，它可以采摘草莓和其他植物而不会造成碰伤。诚然，它仍处于实验阶段，但该系统正在迅速改进。预计一个机器人将完成30个人的工作量。^([^(207)](#fn207))
    当然，这还无需支付工资或承担劳动责任风险。


    但人工智能可能不仅仅意味着取代低技能工作。已有迹象表明，该技术可能对白领职业产生重大影响。坦率地说，自动化这些工作的动力甚至更大，因为它们能带来更高的报酬。


    可能面临人工智能导致失业的一个类别是法律领域，因为`Lawgood`、`NexLP`和`RAVN ACE`等众多初创公司正在争夺这个市场。这些解决方案专注于自动化法律研究和合同审查等领域。^([^(208)](#fn208))
    尽管这些系统远非完美，但它们处理的信息量肯定比人类大得多——并且随着使用次数的增加，它们也会变得更智能。


    诚然，整体就业市场是动态的，并且将会出现新的职业类型。人工智能也可能出现辅助员工的创新——使他们的工作更容易完成。例如，软件初创公司`Measure Square`已经能够使用复杂的算法将纸质平面图转换为数字交互式平面图。正因为如此，项目更容易按时启动和完成。


    然而，鉴于人工智能潜在的变革性影响，认为它将对广泛的行业产生不利影响似乎是合理的。20世纪60年代至90年代制造业失业的情况或许预示了这一点。根据皮尤研究中心的说法，在过去40年里，实际工资几乎没有增长。^([^(209)](#fn209))
    在此期间，美国的贫富差距也在扩大。伯克利经济学家加布里埃尔·祖克曼估计，0.1%的人口控制了近20%的财富。^([^(210)](#fn210))


    然而，我们可以采取一些行动。首先，政府可以提供教育和过渡援助。在当今世界快速变化的节奏下，大多数人需要持续更新技能。IBM 首席执行官金妮·罗梅蒂指出，人工智能将在未来5到10年内改变所有工作。顺便提一下，由于自动化，她的公司的人力资源部门已经裁员30%。^([^(211)](#fn211))


    其次，有些人提倡全民基本收入，即向每个人提供最低限度的补偿。这当然会缓解一些不平等现象，但也有缺点。人们确实从自己的职业生涯中获得自豪感和满足感。那么，如果一个人找不到工作，他的士气会如何？这可能会产生深远的影响。


    最后，甚至有人谈论某种形式的人工智能税。这基本上将从那些受益于该技术的公司手中收回巨额收益。不过，鉴于它们的实力，通过这类立法可能很困难。'
  raw: 'Keep in mind that Waymo has been testing a self-driving taxi service in Phoenix
    (this is similar to a ride-sharing system like Uber, but the cars have autonomous
    systems). Here’s how a blog post from the company explains it:


    We’ll start by giving riders access to our app. They can use it to call our self-driving
    vehicles 24 hours a day, 7 days a week. They can ride across several cities in
    the Metro Phoenix area, including Chandler, Tempe, Mesa, and Gilbert. Whether
    it’s for a fun night out or just to get a break from driving, our riders get the
    same clean vehicles every time and our Waymo driver with over 10 million miles
    of experience on public roads. Riders will see price estimates before they accept
    the trip based on factors like the time and distance to their destination.^([^(200)](#fn200))


    Waymo has found that a key is education because the riders have lots of questions.
    To deal with this, the company has built in a chat system in the app to contact
    a support person. The dashboard of the car also has a screen that provides details
    of the ride.


    According to the blog post, “Feedback from riders will continue to be vital every
    step of the way.”^([^(201)](#fn201))


    ## US vs. China


    The rapid ascent of China has been astonishing. Within a few years, the economy
    may be larger than the United States, and a key part of the growth will be AI.
    The Chinese government has set forth the ambitious goal of spending $150 billion
    on this technology through 2030.^([^(202)](#fn202)) In the meantime, there will
    continue to be major investments from companies like Baidu, Alibaba, and Tencent.


    Even though China is often considered to not be as creative or innovative as Silicon
    Valley—often tagged as “copycats”—this perception may prove to be a myth. A study
    from the Allen Institute for Artificial Intelligence highlights that China is
    expected to outrank the United States in the most cited technical papers on AI.^([^(203)](#fn203))


    The country has some other advantages, which AI expert and venture capitalist
    Kai-Fu Lee has pointed out in his provocative book, *AI Superpowers: China, Silicon
    Valley, and the New World Order*^([^(204)](#fn204)):


    *   *Enthusiasm*: Back in the 1950s, Russia’s launch of Sputnik sparked interest
    in people in the United States to become engineers for the space program. Something
    similar has actually happened in China. When the country’s top Go player, Ke Jie,
    lost to the AlphaGo AI system, this was a wake-up call. The result is that this
    has inspired many young people to pursue a career in AI.


    *   *Data*: With a population of over 1.3 billion, China is rich with data (there
    are more than 700 million Internet users). But the country’s authoritarian government
    is also critical as privacy is not considered particularly important, which means
    there is much more leeway when developing AI models. For example, in a paper published
    in *Nature Medicine*, the Chinese researchers had access to data on 600,000 patients
    to conduct a healthcare study.^([^(205)](#fn205)) While still in the early stages,
    it showed that an AI model was able to effectively diagnose childhood conditions
    like the flu and meningitis.


    *   *Infrastructure*: As a part of the Chinese government’s investment plans,
    there has been a focus on creating next-generation cities that allow for autonomous
    cars and other AI systems. There has also been an aggressive rollout of 5G networks.


    As for the United States, the government has been much more tentative with AI.
    President Trump has signed an executive order—called the “American AI Initiative”—to
    encourage development of the technology, but the terms are vague and it is far
    from clear how much money will be committed to it.


    ## Technological Unemployment


    The concept of technological unemployment, which gained notoriety from famed economist
    John Maynard Keynes during the Great Depression, explains how innovations can
    lead to long-term job loss. However, evidence of this has been elusive. Notwithstanding
    the fact that automation has severely impacted industries like manufacturing,
    there is often a transition of the workforce as people adapt.


    But could the AI revolution be different? It very well could. For example, California
    Governor Gavin Newsom fears that his state could see massive unemployment in areas
    like trucking and warehousing—and soon.^([^(206)](#fn206))


    Here’s another example: Harvest CROO Robotics has built a robot, called Harv,
    that can pick strawberries and other plants without causing bruises. Granted,
    it is still in the experimental phase, but the system is quickly improving. The
    expectation is that one robot will do the work of 30 people.^([^(207)](#fn207))
    And of course, there will be no wages to pay or labor liability exposure.


    But AI may mean more than replacing low-skilled jobs. There are already signs
    that the technology could have a major impact on white-collar professions. Let’s
    face it, there is even more incentive to automate these jobs because they fetch
    higher compensation.


    Just one category that could face AI job loss is the legal field, as a variety
    of startups are gunning for the market like Lawgood, NexLP, and RAVN ACE. The
    solutions are focused on automating areas such as legal research and contract
    review.^([^(208)](#fn208)) Even though the systems are far from perfect, they
    can certainly process much more volume than people—and can also get smarter as
    they are used more and more.


    True, the overall job market is dynamic, and there will be new types of careers
    that will be created. There will also likely be AI innovations that are assistive
    for employees—making their job easier to do. For example, software startup Measure
    Square has been able to use sophisticated algorithms to convert paper-based floorplans
    into digitally interactive floorplans. Because of this, it has been easier to
    get projects started and completed on time.


    However, in light of the potential transformative impact of AI, it does seem reasonable
    that there will be an adverse impact on a broad range of industries. Perhaps a
    foreshadowing of this is what happened with job losses from manufacturing in the
    1960s to 1990s. According to the Pew Research Center, there has been virtually
    no real wage growth in the last 40 years.^([^(209)](#fn209)) During this period,
    the United States has also experienced a widening gap in wealth. Berkeley economist
    Gabriel Zucman estimates that 0.1% of the population controls nearly 20% of the
    wealth.^([^(210)](#fn210))


    Yet there are actions that can be taken. First of all, governments can look to
    provide education and transition assistance. With the pace of change in today’s
    world, there will need to be ongoing renewal of skills for most people. IBM CEO
    Ginni Rometty has noted that AI will change all jobs within the next 5–10 years.
    By the way, her company has seen a 30% reduction of headcount in the HR department
    because of automation.^([^(211)](#fn211))


    Next, there are some people who advocate basic income, which provides a minimum
    amount of compensation to everyone. This would certainly soften some of the inequality,
    but it also has drawbacks. People definitely get pride and satisfaction from their
    careers. So what might a person’s morale be if he or she cannot find a job? It
    could have a profound impact.


    Finally, there is even talk of some type of AI tax. This would essentially claw
    back the large gains from those companies that benefit from the technology. Although,
    given their power, it probably would be tough to pass this type of legislation.'
