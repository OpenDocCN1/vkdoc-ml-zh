    ![../images/480660_1_En_3_Chapter/480660_1_En_3_Fig11_HTML.jpg](images/480660_1_En_3_Chapter/480660_1_En_3_Fig11_HTML.jpg)


    Figure 3-11.


    If there are areas of thin data, the k-Means algorithm may not pick them up


