  trans: '

    ## NLP 的挑战


    正如我们在第 1 章中所见，语言是图灵测试的关键，而图灵测试旨在验证人工智能。语言也是将我们与动物区分开来的东西。


    但这一研究领域极其复杂。以下只是 NLP 面临的部分挑战：


    *   语言常常具有歧义。我们学会快速说话，并通过非语言暗示、语气或对环境做出的反应来强调我们的意思。例如，如果一个高尔夫球正朝某人飞去，你会大喊“看球！”。但
    NLP 系统很可能无法理解这一点，因为它无法处理情境的上下文。


    *   随着世界的变化，语言也在频繁变化。根据《牛津英语词典》，2018 年新增了超过 1100 个单词、义项和子词条（总计超过 829,000 个）^(¹⁰⁴)。一些新收录的词包括
    mansplain（男性说教）和 hangry（饿怒）。


    *   我们说话时会犯语法错误。但这通常不是问题，因为人类有很强的推理能力。然而，这对 NLP 来说是一个重大挑战，因为单词和短语可能有多种含义（这被称为一词多义）。例如，著名的人工智能研究员杰弗里·辛顿喜欢比较“recognize
    speech”（识别语音）和“wreck a nice beach”（毁掉一个漂亮的海滩）^(¹⁰⁵)。


    *   语言有口音和方言。


    *   单词的含义可能会根据，比如说，讽刺或其他情绪反应的使用而改变。


    *   词语可能含糊不清。毕竟，“迟到”到底意味着什么？


    *   许多单词本质上含义相同，但存在细微差别。


    *   对话可能是非线性的，并且会有打断。


    尽管如此，NLP 还是取得了巨大进步，正如 Siri、Alexa 和 Cortana 等应用所展示的那样。大部分进展也发生在过去十年内，这得益于深度学习的强大力量。


    现在，人们可能会对人类语言和计算机语言感到困惑。计算机不是多年来一直能够理解 BASIC、C 和 C++ 这类语言吗？这绝对是事实。同样，计算机语言也包含像
    *if*、*then*、*let* 和 *print* 这样的英语单词。


    但这种语言与人类语言截然不同。考虑到计算机语言具有有限的指令集和严格的逻辑。如果你使用不当，就会导致代码中出现错误——从而导致崩溃。是的，计算机语言是非常字面化的！


    ## 理解人工智能如何翻译语言


    正如我们在第 1 章中所见，NLP 是人工智能研究人员早期关注的焦点。但由于计算机能力有限，其能力非常薄弱。目标是创建规则来解释单词和句子——结果证明这既复杂又难以扩展。在某种程度上，早期的
    NLP 更像是一种计算机语言！


    但随着时间的推移，它逐渐形成了一种通用结构。这一点至关重要，因为 NLP 处理的是非结构化数据，这类数据可能不可预测且难以解释。


    以下是两个关键步骤的总体高级概览：


    *   *文本清洗与预处理*：这涉及使用分词、词干提取和词形还原等技术来解析文本。


    *   *语言理解与生成*：这无疑是该过程中最密集的部分，通常使用深度学习算法。


    在接下来的几节中，我们将更详细地了解各个步骤。


    ### 步骤 #1——清洗与预处理


    在清洗和预处理步骤中，需要完成三件事：分词、词干提取和词形还原。


    #### 分词


    在进行 NLP 之前，必须将文本解析并分割成各个部分——这个过程称为分词。例如，假设我们有下面这个句子：“John ate four cupcakes.”（约翰吃了四个纸杯蛋糕。）然后你需要分离并分类每个元素。图
    6-1 说明了这种分词。


    ![../images/480660_1_En_6_Chapter/480660_1_En_6_Fig1_HTML.jpg](img/480660_1_En_6_Fig1_HTML.jpg)


    图 6-1.


    句子分词示例


    总而言之，有点简单？算是吧。


    分词之后，将进行文本规范化。这需要转换部分文本以便于分析，例如将大小写统一、删除标点符号以及消除缩写。


    但这很容易导致一些问题。假设我们有一个包含“A.I.”的句子。我们应该去掉句点吗？如果去掉，计算机能知道“A I”是什么意思吗？


    很可能不知道。


    有趣的是，甚至单词的大小写也会对含义产生重大影响。看看“fed”和“Fed”之间的区别就知道了。“Fed”通常是美联储的别称。或者，在另一种情况下，假设我们有“us”和“US”。我们是在谈论美国吗？


    以下是其他一些问题：


    *   *空格问题*：当两个或多个单词构成一个复合短语时，它们应该被当作一个词元。一些例子包括“New York”（纽约）和“Silicon Valley”（硅谷）。


    *   *科学词汇和短语*：这类词汇通常包含连字符、括号和希腊字母。如果你去掉这些字符，系统可能无法理解这些单词和短语的含义。


    *   *混乱的文本*：坦率地说，许多文档都存在语法和拼写错误。


    *   *句子分割*：像“Mr.”或“Mrs.”这样的词可能会因为句点而过早地结束一个句子。


    *   *非重要词汇*：有些词对句子含义几乎没有或完全没有增加，比如“the”、“a”和“an”。要删除它们，你可以使用一个简单的停用词过滤器。


    正如你所见，很容易错误地解析句子（在某些语言中，比如中文和日文，语法方面可能会更加困难）。但这可能会产生深远的影响。由于分词通常是第一步，几个错误就可能级联影响整个
    NLP 过程。


    #### 词干提取


    词干提取描述了将单词还原为其词根（或词元）的过程，例如通过去除词缀和后缀。这实际上对搜索引擎很有效，搜索引擎使用聚类来得出更相关的结果。通过词干提取，由于单词具有更广泛的含义，可以找到更多匹配项，甚至可以处理拼写错误等问题。并且在使用人工智能应用程序时，它有助于提高整体理解能力。


    图 6-2 展示了一个词干提取的例子。


    ![../images/480660_1_En_6_Chapter/480660_1_En_6_Fig2_HTML.jpg](img/480660_1_En_6_Fig2_HTML.jpg)


    图 6-2.


    词干提取示例


    有多种算法可以进行词干提取，其中许多相当简单。但它们的效果参差不齐。根据 IBM 的说法：


    > 例如，波特算法会认为‘universal’与‘university’和‘universities’具有相同的词干，这种观察可能有历史依据，但在语义上已不再相关。波特词干提取器也无法识别‘theater’和‘theatre’应属于同一词干类别。基于这些原因，Watson
    Explorer Engine 不使用波特词干提取器作为其英语词干提取器。^(¹⁰⁶)


    事实上，IBM 已经创建了自己的专有词干提取器，并允许进行大量定制。

    '
- fmt: '### Lemmatization


    `Lemmatization` is similar to `stemming`. But instead of removing affixes or prefixes,
    there is a focus on finding similar root words. An example is “better,” which
    we could lemmatize to “good.” This works so long as the meaning remains mostly
    the same. In our example, both are roughly similar, but “good” has a clearer meaning.
    `Lemmatization` also may work with providing better searches or language understanding,
    especially with translations.


    Figure [6-3](#480660_1_En_6_Chapter.xhtml#Fig3) shows an example of `lemmatization`.


    ![../images/480660_1_En_6_Chapter/480660_1_En_6_Fig3_HTML.jpg](images/480660_1_En_6_Chapter/480660_1_En_6_Fig3_HTML.jpg)


    Figure 6-3. Example of lemmatization


    To effectively use `lemmatization`, the NLP system must understand the meanings
    of the words and the context. In other words, this process usually has better
    performance than `stemming`. On the other hand, it also means that the algorithms
    are more complicated and there are higher levels of computing power required.


    ### Step #2—Understanding and Generating Language


    Once the text has been put into a format that computers can process, then the
    NLP system must understand the overall meaning. For the most part, this is the
    hardest part.


    But over the years, researchers have developed a myriad of techniques to help
    out, such as the following:


    - **Tagging Parts of Speech (POS)**: This goes through the text and designates
    each word into its proper grammatical form, say nouns, verbs, adverbs, etc. Think
    of it like an automated version of your grade school English class! What’s more,
    some POS systems have variations. Note that a noun has singular nouns (`NN`),
    singular proper nouns (`NNP`), and plural nouns (`NNS`).


    - **Chunking**: The words will then be analyzed in terms of phrases. For example,
    a noun phrase (`NP`) is a noun that acts as the subject or object to a verb.


    - **Named Entity Recognition**: This is identifying words that represent locations,
    persons, and organizations.


    - **Topic Modelling**: This looks for hidden patterns and clusters in the text.
    One of the algorithms, called `Latent Dirichlet Allocation (LDA)`, is based on
    unsupervised learning approaches. That is, there will be random topics assigned,
    and then the computer will iterate to find matches.


    For many of these processes, we can use deep learning models. They can be extended
    to more areas of analysis—to allow for seamless language understanding and generation.
    This is a process known as distributional semantics.


    With a convolutional neural network (`CNN`), which we learned about in Chapter
    [4](#480660_1_En_4_Chapter.xhtml), you can find clusters of words that are translated
    into a feature map. This has allowed for applications like language translation,
    speech recognition, sentiment analysis, and Q&A. In fact, the model can even do
    things like detect sarcasm!


    Yet there are some problems with `CNNs`. For example, the model has difficulties
    with text that has dependencies across large distances. But there are some ways
    to handle this, such as with time-delayed neural networks (`TDNN`) and dynamic
    convolutional neural networks (`DCNN`). These methods have shown high performance
    in handling sequenced data. Although, the model that has shown more success with
    this is the recurrent neural network (`RNN`), as it memorizes data.


    So far, we have been focused mostly on text analysis. But for there to be sophisticated
    NLP, we also must build voice recognition systems. We’ll take a look at this in
    the next section.


    ## Voice Recognition


    In 1952, Bell Labs created the first voice recognition system, called `Audrey`
    (for Automatic Digit Recognition). It was able to recognize phonemes, which are
    the most basic units of sounds in a language. English, for example, has 44.


    `Audrey` could recognize the sound of a digit, from zero to nine. It was accurate
    for the voice of the machine’s creator, HK Davis, about 90% of the time.^([^(107)](#fn107))
    And for anyone else, it was 70% to 80% or so.


    `Audrey` was a major feat, especially in light of the limited computing power
    and memory available at the time. But the program also highlighted the major challenges
    with voice recognition. When we speak, our sentences can be complex and somewhat
    jumbled. We also generally talk fast—an average of 150 words per minute.


    As a result, voice recognition systems improved at a glacially slow pace. In 1962,
    IBM’s Shoebox system could recognize only 16 words, 10 digits, and 6 mathematical
    commands.


    It was not until the 1980s that there was significant progress in the technology.
    The key breakthrough was the use of the hidden Markov model (`HMM`), which was
    based on sophisticated statistics. For example, if you say the word “dog,” there
    will be an analysis of the individual sounds d, o, and g. The `HMM` algorithm
    will assign a score to each of these. Over time, the system will get better at
    understanding the sounds and translate them into words.


    While `HMM` was critical, it was still unable to effectively handle continuous
    speech. For example, voice systems were based on template matching. This involved
    translating sound waves into numbers, which was done by sampling. The result was
    that the software would measure the frequency of the intervals and store the results.
    But there had to be a close match. Because of this, the voice input had to be
    quite clear and slow. There also had to be little background noise.


    But by the 1990s, software developers would make strides and come out with commercial
    systems, such as Dragon Dictate, which could understand thousands of words in
    continuous speech. However, adoption was still not mainstream. Many people still
    found it easier to type into their computers and use the mouse. Yet there were
    some professions, like medicine (a popular use case with transcribing diagnosis
    of patients), where speech recognition found high levels of usage.


    With the emergence of machine learning and deep learning, voice systems have rapidly
    become much more sophisticated and accurate. Some of the key algorithms involve
    the use of the long short-term memory (`LSTM`), recurrent neural networks, and
    deep feed-forward neural networks. Google would go on to implement these approaches
    in Google Voice, which was available to hundreds of millions of smartphone users.
    And of course, we’ve seen great progress with other offerings like Siri, Alexa,
    and Cortana.


    ## NLP in the Real World


    For the most part, we have gone through the main parts of the NLP workflow. Next,
    let’s take a look at the powerful applications of this technology.'
