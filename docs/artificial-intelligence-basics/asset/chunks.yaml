    *   *Black Box*: A deep learning model could easily have millions of parameters
    that involve many hidden layers. Having a clear understanding of this is really
    beyond a person’s capabilities. True, this may not necessarily be a problem with
    recognizing cats in a dataset. But it could definitely be an issue with models
    for medical diagnosis or determining the safety of an oil rig. In these situations,
    regulators will want to have a good understanding of the transparency of the models.
    Because of this, researchers are looking at creating systems to determine “explainability,”
    which provides an understanding of deep learning models.


    *   *Data*: The human brain has its flaws. But there are some functions that it
    does extremely well like the ability to learn by abstraction. For example, suppose
    Jan, who is five years old, goes to a restaurant with her family. Her mother points
    out an item on the plate and says it is a “taco.” She does not have to explain
    it or provide any information about it. Instead, Jan’s brain will instantly process
    this information and understand the overall pattern. In the future, when she sees
    another taco—even if it has differences, such as with the dressing—she will know
    what it is. For the most part, this is intuitive. But unfortunately, when it comes
    to deep learning, there is no taco learning by abstraction! The system has to
    process enormous amounts of information to recognize it. Of course, this is not
    a problem for companies like Facebook, Google, or even Uber. But many companies
    have much more limited datasets. The result is that deep learning may not be a
    good option.


    *   *Hierarchical Structure*: This way of organizing does not exist in deep learning.
    Because of this, language understanding still has a long way to go (especially
    with long discussions).


    *   *Open-Ended Inference*: Marcus notes that deep learning cannot understand
    the nuances between “John promised Mary to leave” and “John promised to leave
    Mary.” What’s more, deep learning is far away from being able to, for instance,
    read Jane Austen’s *Pride and Prejudice* and be able to divine Elizabeth Bennet’s
    character motivations.


    *   *Conceptual Thinking*: Deep learning cannot have an understanding of concepts
    like democracy, justice, or happiness. It also does not have imagination, thinking
    of new ideas or plans.'
  trans: '

    ## 何时使用深度学习？


    由于深度学习的强大能力，人们在创建人工智能项目时往往会首先想到使用这项技术。但这可能是一个重大错误。深度学习的应用场景仍然较为狭窄，例如适用于文本、视频、图像和时间序列数据集。同时，它还需要大量的数据和强大的计算机系统。


    哦，还有一点，当结果可以被量化和验证时，深度学习的效果会更好。


    为了说明原因，让我们考虑以下示例。由约翰霍普金斯大学毒理学家托马斯·哈通领导的一个研究团队，基于 80 万次动物测试创建了一个包含约 1 万种化学物质的数据集。通过使用深度学习，结果显示该模型在毒性预测方面比许多动物测试更准确。^(⁸³)
    请记住，动物测试不仅成本高昂且需要安全措施，而且由于对同一种化学物质进行重复测试，其结果也可能不一致。


    “第一个场景展示了深度学习的预测能力，以及它从人类永远无法发现的大型数据集中挖掘相关性的能力，”DarwinAI 的首席执行官谢尔登·费尔南德斯说。^(⁸⁴)


    那么，深度学习在哪些场景中表现不佳呢？实际上，2018 年俄罗斯世界杯（法国队夺冠）就是一个例证。许多研究人员试图预测全部 64 场比赛的结果，但结果远非准确：^(⁸⁵)


    *   一组研究人员采用了博彩公司共识模型，该模型预测巴西队将获胜。

    *   另一组研究人员使用随机森林和泊松排名等算法预测西班牙队将获胜。


    这里的问题在于，很难找到具有预测能力的正确变量。事实上，深度学习模型基本上无法处理某些事件特征的复杂性，尤其是那些具有混沌元素的事件。


    然而，即使你拥有足够的数据和计算能力，你仍然需要雇佣具有深度学习背景的人员，这并非易事。请记住，选择合适的模型并对其进行微调是一项挑战。应该设置多少个超参数？隐藏层的数量应该是多少？以及如何评估模型？所有这些都是高度复杂的。


    即使是专家也可能出错。以下是谢尔登的分享：


    > 我们的一位汽车客户遇到了一些奇怪的行为：一辆自动驾驶汽车在天空呈现某种紫色色调时，会越来越频繁地左转。经过数月痛苦的调试，他们确定，针对某些转弯场景的训练是在内华达沙漠进行的，当时天空恰好是那种特定的颜色。神经网络在其人类设计者不知情的情况下，在其转弯行为与天空色调之间建立了一种关联。^(⁸⁶)


    有一些工具可以帮助进行深度学习过程，例如亚马逊的 SageMaker、谷歌的 HyperTune 和 SigOpt。但仍有很长的路要走。


    如果深度学习不合适，那么你可能需要考虑机器学习，它通常需要相对较少的数据。此外，模型往往要简单得多，但结果可能仍然更有效。


    ## 深度学习的缺点


    鉴于所有的创新和突破，许多人认为深度学习是灵丹妙药也是合理的。这将意味着我们不再需要开车。甚至可能意味着我们将治愈癌症。


    怎么可能不感到兴奋和乐观呢？这是自然而合理的。但重要的是要注意到，深度学习仍处于初级阶段，实际上存在许多棘手的问题。最好还是降低预期。


    2018 年，加里·马库斯撰写了一篇题为《深度学习：批判性评估》的论文，他在其中清晰地阐述了这些挑战。^(⁸⁷) 在他的论文中，他指出：


    > 在语音识别、图像识别和游戏等领域取得显著进展，以及大众媒体热情高涨的背景下，我提出了对深度学习的十点担忧，并认为如果我们想要达到通用人工智能，深度学习必须辅以其他技术。^(⁸⁸)


    马库斯绝对有资格提出他的担忧，因为他兼具人工智能领域的学术和商业背景。在成为纽约大学心理学系教授之前，他将自己创立的初创公司 Geometric Intelligence
    卖给了优步。马库斯还是几本畅销书的作者，例如《人类心智的偶然构建》。^(⁸⁹)


    以下是他对深度学习的一些担忧：


    *   **黑箱**：一个深度学习模型可能轻易拥有数百万个参数，涉及许多隐藏层。清晰理解这一点确实超出了人类的能力范围。诚然，在数据集中识别猫可能不一定是问题。但对于用于医疗诊断或确定石油钻井平台安全性的模型来说，这绝对可能是个问题。在这些情况下，监管机构希望充分了解模型的透明度。因此，研究人员正在考虑创建系统来确定“可解释性”，从而提供对深度学习模型的理解。


    *   **数据**：人脑有其缺陷。但有些功能它做得非常好，比如通过抽象进行学习的能力。例如，假设五岁的简和家人去一家餐馆。她妈妈指着盘子里的一个东西说这是“玉米卷”。她不需要解释或提供任何相关信息。相反，简的大脑会立即处理这些信息并理解整体模式。将来，当她看到另一个玉米卷时——即使它有所不同，比如调味料不同——她也会知道它是什么。在大多数情况下，这是直觉性的。但不幸的是，对于深度学习来说，没有通过抽象学习玉米卷这回事！系统必须处理海量信息才能识别它。当然，对于脸书、谷歌甚至优步这样的公司来说，这不是问题。但许多公司的数据集要有限得多。结果是，深度学习可能不是一个好的选择。


    *   **层级结构**：这种组织方式在深度学习中并不存在。因此，语言理解还有很长的路要走（尤其是在长篇讨论中）。


    *   **开放式推理**：马库斯指出，深度学习无法理解“约翰答应玛丽离开”和“约翰答应离开玛丽”之间的细微差别。更重要的是，深度学习距离能够阅读简·奥斯汀的《傲慢与偏见》并洞悉伊丽莎白·班纳特的性格动机还差得很远。


    *   **概念性思维**：深度学习无法理解民主、正义或幸福等概念。它也没有想象力，无法思考新的想法或计划。

