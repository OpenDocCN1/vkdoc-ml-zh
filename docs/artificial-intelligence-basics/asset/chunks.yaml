    ## 什么是机器人？


    “机器人”一词的起源可以追溯到 1921 年卡雷尔·恰佩克的一部戏剧《罗素姆的万能机器人》。该剧讲述了一家工厂用有机物质制造机器人的故事，没错，这些机器人充满敌意！它们最终联合起来反抗人类主人（请注意，“机器人”一词源自捷克语
    *robata*，意为强制劳动）。


    但时至今日，对于这类系统，一个恰当的定义是什么？请记住，机器人有无数种形态和功能，因此定义也多种多样。


    不过，我们可以将其归结为几个关键部分：


    *   **物理形态**：机器人的尺寸范围很广，从能探索人体内部的微型机器，到大型工业系统，再到飞行器和水下航行器。此外，还需要某种能源，如电池、电力或太阳能。


    *   **执行动作**：简单来说，机器人必须能够执行某些动作。这可能包括移动物品，甚至说话。


    *   **感知环境**：为了执行动作，机器人必须理解其环境。这可以通过传感器和反馈系统来实现。


    *   **智能**：这并不意味着需要完整的 AI 能力。但机器人需要能够被编程以执行动作。


    如今，从头开始制造一个机器人并不太难。例如，RobotShop.com 上有数百种套件，价格从不到 10 美元到高达 35,750.00 美元不等（例如 Dr.
    Robot Jaguar V6 履带式移动平台）。


    关于建造机器人的独创性，有一个暖心的故事，主角是两岁的西利安·杰克逊。他出生时患有一种罕见的遗传病，导致他无法行动。他的父母试图为一种特殊的电动轮椅申请报销，但被拒绝了。


    于是，法明顿高中的学生们行动起来，为西利安建造了一个系统。^(¹³⁸) 本质上，这是一个机器人轮椅，只花了一个月就完成了。正因为如此，西利安现在可以在家里追逐他的两只柯基犬了！


    虽然上面我们探讨了机器人的特征，但还有一些关键的交互作用需要考虑：


    *   **传感器**：典型的传感器是摄像头或激光雷达（光探测与测距），它使用激光扫描仪创建 3D 图像。但机器人也可能配备用于声音、触觉、味觉甚至嗅觉的系统。事实上，它们还可能包含超越人类能力的传感器，例如夜视或检测化学物质。来自传感器的信息被发送到控制器，控制器可以激活机械臂或机器人的其他部件。


    *   **执行器**：这些是机电设备，例如电机。在大多数情况下，它们有助于手臂、腿、头部以及任何其他可移动部件的运动。


    *   **计算机**：有内存和处理器来处理来自传感器的输入。在高级机器人中，可能还有 AI 芯片或连接到 AI 云平台的互联网连接。


    图 7-1 展示了这些功能的交互作用。


    ![../images/480660_1_En_7_Chapter/480660_1_En_7_Fig1_HTML.jpg](img/480660_1_En_7_Fig1_HTML.jpg)


    图 7-1.


    实体机器人的通用系统


    操作机器人主要有两种方式。首先，是由人类操作的远程控制。在这种情况下，机器人被称为远程机器人。其次是自主机器人，它利用自身能力进行导航——例如借助 AI。


    那么，第一个可移动、会思考的机器人是什么？它就是 Shakey。这个名字很贴切，正如该系统的项目经理查尔斯·罗森所说：“我们花了一个月想给它起个好名字，从希腊名字到各种名字都想遍了，然后我们中的一个人说：‘嘿，它晃得厉害，还能到处移动，我们就叫它
    Shakey 吧。’”^(¹³⁹)


    斯坦福研究所（SRI）在 DARPA 的资助下，从 1966 年到 1972 年一直在研究 Shakey。在当时，它相当先进。Shakey 体型庞大，超过五英尺高，有轮子可以移动，还有传感器和摄像头辅助触觉。它还通过无线方式连接到
    DEC PDP-10 和 PDP-15 计算机。通过这种方式，人们可以通过电传打字机输入命令。不过，Shakey 使用算法在其环境中导航，甚至能关门。


    这个机器人的开发是众多 AI 突破的成果。例如，尼尔斯·尼尔森和理查德·菲克斯创建了 STRIPS（斯坦福研究所问题求解器），它实现了自动规划，以及用于在消耗最少计算机资源的情况下找到最短路径的
    A∗ 算法。^(¹⁴⁰)


    到 20 世纪 60 年代末，当美国专注于太空计划时，Shakey 引起了不小的轰动。《生活》杂志上一篇赞美文章宣称，这个机器人是“第一个电子人”。^(¹⁴¹)


    但不幸的是，1972 年，随着 AI 寒冬的到来，DARPA 撤回了对 Shakey 的资助。然而，这个机器人仍然是科技史上的关键部分，并于 2004 年入选机器人名人堂。^(¹⁴²)

    '
- fmt: '# Industrial and Commercial Robots


    The first real-world use of robots had to do with manufacturing industries. But
    these systems did take quite a while to get adoption.


    The story begins with George Devol, an inventor who did not finish high school.
    But this was not a problem. Devol had a knack for engineering and creativity,
    as he would go on to create some of the core systems for microwave ovens, barcodes,
    and automatic doors (during his life, he would obtain over 40 patents).


    It was during the early 1950s that he also received a patent on a programmable
    robot called `Unimate`. He struggled to get interest in his idea as every investor
    turned him down.


    However, in 1957, his life would change forever when he met Joseph Engelberger
    at a cocktail party. Think of it like when Steve Jobs met Steve Wozniak to create
    the Apple computer.


    Engelberger was an engineer but also a savvy businessman. He even had a love for
    reading science fiction, such as Isaac Asimov’s stories. Because of this, Engelberger
    wanted the `Unimate` to benefit society.


    Yet there was still resistance—as many people thought the idea was unrealistic
    and, well, science fiction—and it took a year to get funding. But once Engelberger
    did, he wasted little time in building the robot and was able to sell it to General
    Motors (GM) in 1961. `Unimate` was bulky (weighing 2,700 pounds) and had one 7-foot
    arm, but it was still quite useful and also meant that people would not have to
    do inherently dangerous activities. Some of its core functions included welding,
    spraying, and gripping—all done accurately and on a 24/7 basis.


    Engelberger looked for creative ways to evangelize his robot. To this end, he
    appeared on Johnny Carson’s *The Tonight Show* in 1966, in which `Unimate` putted
    a golf ball perfectly and even poured beer. Johnny quipped that the machine could
    “replace someone’s job.”^([^(143)](#fn143))


    But industrial robots did have their nagging issues. Interestingly enough, GM
    learned this the hard way during the 1980s. At the time, CEO Roger Smith promoted
    the vision of a “lights out” factory—that is, where robots could build cars in
    the dark!


    He went on to shell out a whopping $90 billion on the program and even created
    a joint venture, with Fujitsu-Fanuc, called `GMF Robotics`. The organization would
    become the world’s largest manufacturer of robots.


    But unfortunately, the venture turned out to be a disaster. Besides aggravating
    unions, the robots often failed to live up to expectations. Just some of the fiascos
    included robots that welded doors shut or painted themselves—not the cars!


    However, the situation of `GMF` is nothing really new—and it’s not necessarily
    about misguided senior managers. Take a look at Tesla, which is one of the world’s
    most innovative companies. But CEO Elon Musk still suffered major issues with
    robots on his factory floors. The problems got so bad that Tesla’s existence was
    jeopardized.


    In an interview on *CBS This Morning* in April 2018, Musk said he used too many
    robots when manufacturing the Model 3 and this actually slowed down the process.^([^(144)](#fn144))
    He noted that he should have had more people involved.


    All this points to what Hans Moravec once wrote: “It is comparatively easy to
    make computers exhibit adult level performance on intelligence tests or playing
    checkers, and difficult or impossible to give them the skills of a one-year-old
    when it comes to perception and mobility.”^([^(145)](#fn145)) This is often called
    the Moravec paradox.


    Regardless of all this, industrial robots have become a massive industry, expanding
    across diverse segments like consumer goods, biotechnology/healthcare, and plastics.
    As of 2018, there were 35,880 industrial and commercial robots shipped in North
    America, according to data from the Robotic Industries Association (RIA).^([^(146)](#fn146))
    For example, the auto industry accounted for about 53%, but this has been declining.


    Jeff Burnstein, president of the Association for Advancing Automation, had this
    to say:


    > And as we’ve heard from our members and at shows such as Automate, these sales
    and shipments aren’t just to large, multinational companies anymore. Small and
    medium-sized companies are using robots to solve real-world challenges, which
    is helping them be more competitive on a global scale.^([^(147)](#fn147))


    At the same time, the costs of manufacturing industrial robots continue to drop.
    Based on research from ARK, there will be a 65% reduction by 2025—with devices
    averaging less than $11,000 each.^([^(148)](#fn148)) The analysis is based on
    Wright’s Law, which states that for every cumulative doubling in the number of
    units produced, there is a consistent decline in costs in percentage terms.


    OK then, what about AI and robots? Where is that status of the technology? Even
    with the breakthroughs with deep learning, there has generally been slow progress
    with using AI with robots. Part of this is due to the fact that much of the research
    has been focused on software-based models, such as with image recognition. But
    another reason is that physical robots require sophisticated technologies to understand
    the environment—which is often noisy and distracting—in real-time. This involves
    enabling simultaneous localization and mapping (SLAM) in unknown environments
    while simultaneously tracking the robot’s location. To do this effectively, there
    may even need to be new technologies created, such as better neural network algorithms
    and quantum computers.


    Despite all this, there is certainly progress being made, especially with the
    use of reinforcement learning techniques. Consider some of the following innovations:


    *   *Osaro*: The company develops systems that allow robots to learn quickly.
    Osaro describes this as “the ability to mimic behavior that requires learned sensor
    fusion as well as high level planning and object manipulation. It will also enable
    the ability to learn from one machine to another and improve beyond a human programmer’s
    insights.” ^([^(149)](#fn149)) For example, one of its robots was able to learn,
    within only five seconds, how to lift and place a chicken (the system is expected
    to be used in poultry factories).^([^(150)](#fn150)) But the technology could
    have many applications, such as for drones, autonomous vehicles, and IoT (Internet
    of Things).


    *   *OpenAI*: They have created the `Dactyl`, which is a robot hand that has human-like
    dexterity. This is based on sophisticated training of simulations, not real-world
    interactions. OpenAI calls this “domain randomization,” which presents the robot
    many scenarios—even those that have a very low probability of happening. With
    `Dactyl`, the simulations were able to involve about 100 years of problem solving.^([^(151)](#fn151))
    One of the surprising results was that the system learned human hand actions that
    were not preprogrammed—such as sliding of the finger. `Dactyl` also has been trained
    to deal with imperfect information, say when the sensors have delayed readings,
    or when there is a need to handle multiple objects.


    *   *MIT*: It can easily take thousands of sample data for a robot to understand
    its environment, such as to detect something as simple as a mug. But according
    to a research paper from professors at MIT, there may be a way to reduce this.
    They used a neural network that focused on only a few key features.^([^(152)](#fn152))
    The research is still in the early stages, but it could prove very impactful for
    robots.


    *   *Google*: Beginning in 2013, the company went on an M&A (mergers and acquisitions)
    binge for robotics companies. But the results were disappointing. Despite this,
    it has not given up on the business. Over the past few years, Google has focused
    on pursuing simpler robots that are driven by AI and the company has created a
    new division, called `Robotics at Google`. For example, one of the robots can
    look at a bin of items and identify the one that is requested—picking it up with
    a three-fingered hand—about 85% of the time. A typical person, on the other hand,
    was able to do this at about 80%.^([^(153)](#fn153))


    So does all this point to complete automation? Probably not—at least for the foreseeable
    future. Keep in mind that a major trend is the development of cobots. These are
    robots that work along with people. All in all, it is turning into a much more
    powerful approach, as there can be leveraging of the advantages of both machines
    and humans.


    Note that one of the major leaders in this category is Amazon.com. Back in 2012,
    the company shelled out $775 million for Kiva, a top industrial robot manufacturer.
    Since then, Amazon.com has rolled out about 100,000 systems across more than 25
    fulfillment centers (because of this, the company has seen 40% improvement in
    inventory capacity).^([^(154)](#fn154)) This is how the company describes it:


    > Amazon Robotics automates fulfilment center operations using various methods
    of robotic technology including autonomous mobile robots, sophisticated control
    software, language perception, power management, computer vision, depth sensing,
    machine learning, object recognition, and semantic understanding of commands.^([^(155)](#fn155))


    Within the warehouses, robots quickly move across the floor helping to locate
    and lift storage pods. But people are also critical as they are better able to
    identify and pick individual products.


    Yet the setup is very complicated. For example, warehouse employees wear Robotic
    Tech Vests so as not to be run down by robots!^([^(156)](#fn156)) This technology
    makes it possible for a robot to identify a person.


    But there are other issues with cobots. For example, there is the real fear that
    employees will ultimately be replaced by the machines. What’s more, it’s natural
    for people to feel like a proverbial cog in the wheel, which could mean lower
    morale. Can people really bond with robots? Probably not, especially industrial
    robots, which really do not have human qualities.'
  raw: '## Industrial and Commercial Robots


    The first real-world use of robots had to do with manufacturing industries. But
    these systems did take quite a while to get adoption.


    The story begins with George Devol, an inventor who did not finish high school.
    But this was not a problem. Devol had a knack for engineering and creativity,
    as he would go on to create some of the core systems for microwave ovens, barcodes,
    and automatic doors (during his life, he would obtain over 40 patents).


    It was during the early 1950s that he also received a patent on a programmable
    robot called “Unimate.” He struggled to get interest in his idea as every investor
    turned him down.


    However, in 1957, his life would change forever when he met Joseph Engelberger
    at a cocktail party. Think of it like when Steve Jobs met Steve Wozniak to create
    the Apple computer.


    Engelberger was an engineer but also a savvy businessman. He even had a love for
    reading science fiction, such as Isaac Asimov’s stories. Because of this, Engelberger
    wanted the Unimate to benefit society.


    Yet there was still resistance—as many people thought the idea was unrealistic
    and, well, science fiction—and it took a year to get funding. But once Engelberger
    did, he wasted little time in building the robot and was able to sell it to General
    Motors (GM) in 1961\. Unimate was bulky (weighing 2,700 pounds) and had one 7-foot
    arm, but it was still quite useful and also meant that people would not have to
    do inherently dangerous activities. Some of its core functions included welding,
    spraying, and gripping—all done accurately and on a 24/7 basis.


    Engelberger looked for creative ways to evangelize his robot. To this end, he
    appeared on Johnny Carson’s *The Tonight Show* in 1966, in which Unimate putted
    a golf ball perfectly and even poured beer. Johnny quipped that the machine could
    “replace someone’s job.”^([^(143)](#fn143))


    But industrial robots did have their nagging issues. Interestingly enough, GM
    learned this the hard way during the 1980s. At the time, CEO Roger Smith promoted
    the vision of a “lights out” factory—that is, where robots could build cars in
    the dark!


    He went on to shell out a whopping $90 billion on the program and even created
    a joint venture, with Fujitsu-Fanuc, called GMF Robotics. The organization would
    become the world’s largest manufacturer of robots.


    But unfortunately, the venture turned out to be a disaster. Besides aggravating
    unions, the robots often failed to live up to expectations. Just some of the fiascos
    included robots that welded doors shut or painted themselves—not the cars!


    However, the situation of GMF is nothing really new—and it’s not necessarily about
    misguided senior managers. Take a look at Tesla, which is one of the world’s most
    innovative companies. But CEO Elon Musk still suffered major issues with robots
    on his factory floors. The problems got so bad that Tesla’s existence was jeopardized.


    In an interview on *CBS This Morning* in April 2018, Musk said he used too many
    robots when manufacturing the Model 3 and this actually slowed down the process.^([^(144)](#fn144))
    He noted that he should have had more people involved.


    All this points to what Hans Moravec once wrote: “It is comparatively easy to
    make computers exhibit adult level performance on intelligence tests or playing
    checkers, and difficult or impossible to give them the skills of a one-year-old
    when it comes to perception and mobility.”^([^(145)](#fn145)) This is often called
    the Moravec paradox.


    Regardless of all this, industrial robots have become a massive industry, expanding
    across diverse segments like consumer goods, biotechnology/healthcare, and plastics.
    As of 2018, there were 35,880 industrial and commercial robots shipped in North
    America, according to data from the Robotic Industries Association (RIA).^([^(146)](#fn146))
    For example, the auto industry accounted for about 53%, but this has been declining.


    Jeff Burnstein, president of the Association for Advancing Automation, had this
    to say:


    > And as we’ve heard from our members and at shows such as Automate, these sales
    and shipments aren’t just to large, multinational companies anymore. Small and
    medium-sized companies are using robots to solve real-world challenges, which
    is helping them be more competitive on a global scale.^([^(147)](#fn147))


    At the same time, the costs of manufacturing industrial robots continue to drop.
    Based on research from ARK, there will be a 65% reduction by 2025—with devices
    averaging less than $11,000 each.^([^(148)](#fn148)) The analysis is based on
    Wright’s Law, which states that for every cumulative doubling in the number of
    units produced, there is a consistent decline in costs in percentage terms.


    OK then, what about AI and robots? Where is that status of the technology? Even
    with the breakthroughs with deep learning, there has generally been slow progress
    with using AI with robots. Part of this is due to the fact that much of the research
    has been focused on software-based models, such as with image recognition. But
    another reason is that physical robots require sophisticated technologies to understand
    the environment—which is often noisy and distracting—in real-time. This involves
    enabling simultaneous localization and mapping (SLAM) in unknown environments
    while simultaneously tracking the robot’s location. To do this effectively, there
    may even need to be new technologies created, such as better neural network algorithms
    and quantum computers.


    Despite all this, there is certainly progress being made, especially with the
    use of reinforcement learning techniques. Consider some of the following innovations:


    *   *Osaro*: The company develops systems that allow robots to learn quickly.
    Osaro describes this as “the ability to mimic behavior that requires learned sensor
    fusion as well as high level planning and object manipulation. It will also enable
    the ability to learn from one machine to another and improve beyond a human programmer’s
    insights.” ^([^(149)](#fn149)) For example, one of its robots was able to learn,
    within only five seconds, how to lift and place a chicken (the system is expected
    to be used in poultry factories).^([^(150)](#fn150)) But the technology could
    have many applications, such as for drones, autonomous vehicles, and IoT (Internet
    of Things).


    *   *OpenAI*: They have created the Dactyl, which is a robot hand that has human-like
    dexterity. This is based on sophisticated training of simulations, not real-world
    interactions. OpenAI calls this “domain randomization,” which presents the robot
    many scenarios—even those that have a very low probability of happening. With
    Dactyl, the simulations were able to involve about 100 years of problem solving.^([^(151)](#fn151))
    One of the surprising results was that the system learned human hand actions that
    were not preprogrammed—such as sliding of the finger. Dactyl also has been trained
    to deal with imperfect information, say when the sensors have delayed readings,
    or when there is a need to handle multiple objects.


    *   *MIT*: It can easily take thousands of sample data for a robot to understand
    its environment, such as to detect something as simple as a mug. But according
    to a research paper from professors at MIT, there may be a way to reduce this.
    They used a neural network that focused on only a few key features.^([^(152)](#fn152))
    The research is still in the early stages, but it could prove very impactful for
    robots.


    *   *Google* : Beginning in 2013, the company went on an M&A (mergers and acquisitions)
    binge for robotics companies. But the results were disappointing. Despite this,
    it has not given up on the business. Over the past few years, Google has focused
    on pursuing simpler robots that are driven by AI and the company has created a
    new division, called Robotics at Google. For example, one of the robots can look
    at a bin of items and identify the one that is requested—picking it up with a
    three-fingered hand—about 85% of the time. A typical person, on the other hand,
    was able to do this at about 80%.^([^(153)](#fn153))


    So does all this point to complete automation? Probably not—at least for the foreseeable
    future. Keep in mind that a major trend is the development of cobots. These are
    robots that work along with people. All in all, it is turning into a much more
    powerful approach, as there can be leveraging of the advantages of both machines
    and humans.


    Note that one of the major leaders in this category is Amazon.com. Back in 2012,
    the company shelled out $775 million for Kiva, a top industrial robot manufacturer.
    Since then, Amazon.com has rolled out about 100,000 systems across more than 25
    fulfillment centers (because of this, the company has seen 40% improvement in
    inventory capacity).^([^(154)](#fn154)) This is how the company describes it:


    > Amazon Robotics automates fulfilment center operations using various methods
    of robotic technology including autonomous mobile robots, sophisticated control
    software, language perception, power management, computer vision, depth sensing,
    machine learning, object recognition, and semantic understanding of commands.^([^(155)](#fn155))


    Within the warehouses, robots quickly move across the floor helping to locate
    and lift storage pods. But people are also critical as they are better able to
    identify and pick individual products.


    Yet the setup is very complicated. For example, warehouse employees wear Robotic
    Tech Vests so as not to be run down by robots!^([^(156)](#fn156)) This technology
    makes it possible for a robot to identify a person.


    But there are other issues with cobots. For example, there is the real fear that
    employees will ultimately be replaced by the machines. What’s more, it’s natural
    for people to feel like a proverbial cog in the wheel, which could mean lower
    morale. Can people really bond with robots? Probably not, especially industrial
    robots, which really do not have human qualities.'
  trans: '

    ## 工业与商业机器人


    机器人首次真正意义上的应用与制造业有关。但这些系统确实花了相当长的时间才得到采用。


    故事始于乔治·德沃尔，一位没有完成高中学业的发明家。但这并不是问题。德沃尔天生具有工程和创造力方面的才能，他后来创造了微波炉、条形码和自动门的一些核心系统（他一生中获得了超过
    40 项专利）。


    正是在 20 世纪 50 年代早期，他还获得了一项名为“尤尼梅特”的可编程机器人的专利。他努力想让自己的创意引起人们的兴趣，但每个投资者都拒绝了他。


    然而，1957 年，他在一次鸡尾酒会上遇到了约瑟夫·恩格尔伯格，他的人生从此彻底改变。可以把它想象成史蒂夫·乔布斯遇到史蒂夫·沃兹尼亚克，共同创造了苹果电脑。


    恩格尔伯格是一名工程师，同时也是一位精明的商人。他甚至热爱阅读科幻小说，比如艾萨克·阿西莫夫的故事。正因为如此，恩格尔伯格希望尤尼梅特能够造福社会。


    然而，阻力依然存在——许多人认为这个想法不切实际，而且，嗯，是科幻小说——他们花了一年时间才获得资金。但一旦恩格尔伯格拿到资金，他就毫不拖延地制造出了机器人，并于
    1961 年将其卖给了通用汽车公司。尤尼梅特体积庞大（重达 2700 磅），有一个 7 英尺长的手臂，但它仍然非常有用，也意味着人们不必再从事固有的危险活动。它的一些核心功能包括焊接、喷涂和抓取——所有这些都能精确完成，并且全天候运行。


    恩格尔伯格寻找创造性的方式来宣传他的机器人。为此，他于 1966 年出现在约翰尼·卡森的《今夜秀》上，节目中尤尼梅特完美地推杆进洞，甚至还倒了啤酒。约翰尼打趣说，这台机器可以“取代某人的工作”。^(¹⁴³)


    但工业机器人确实有其令人头疼的问题。有趣的是，通用汽车在 20 世纪 80 年代就深刻体会到了这一点。当时，首席执行官罗杰·史密斯推行“熄灯工厂”的愿景——即机器人可以在黑暗中制造汽车！


    他随后在该项目上投入了高达 900 亿美元的巨资，甚至与富士通-发那科合资成立了 GMF 机器人公司。该组织后来成为世界上最大的机器人制造商。


    但不幸的是，这次合资最终以灾难告终。除了激怒工会之外，机器人也常常达不到预期效果。其中一些失败案例包括机器人焊死车门，或者给自己喷漆——而不是给汽车喷漆！


    然而，GMF 的情况并非什么新鲜事——也不一定归咎于管理层的错误决策。看看特斯拉，它是世界上最具创新力的公司之一。但首席执行官埃隆·马斯克在其工厂车间里仍然遇到了机器人的重大问题。问题严重到危及特斯拉的生存。


    在 2018 年 4 月接受《CBS 今晨》采访时，马斯克表示，他在制造 Model 3 时使用了太多机器人，这实际上拖慢了生产进程。^(¹⁴⁴)他指出，他本应该让更多人参与进来。


    所有这些都印证了汉斯·莫拉维克曾写过的话：“让计算机在智力测试或下跳棋方面表现出成人水平的性能相对容易，但在感知和移动能力方面赋予它们一岁孩子的技能却很难，甚至不可能。”^(¹⁴⁵)这通常被称为莫拉维克悖论。


    尽管如此，工业机器人已经成为一个庞大的产业，扩展到消费品、生物技术/医疗保健和塑料等不同领域。根据机器人工业协会的数据，截至 2018 年，北美地区共出货了
    35,880 台工业和商业机器人。^(¹⁴⁶)例如，汽车行业约占 53%，但这一比例一直在下降。


    推进自动化协会主席杰夫·伯恩斯坦曾这样说道：


    > 正如我们从会员那里以及在“自动化展”等展会上听到的那样，这些销售和出货不再仅仅面向大型跨国公司。中小型企业正在使用机器人解决现实世界中的挑战，这有助于它们在全球范围内更具竞争力。^(¹⁴⁷)


    与此同时，工业机器人的制造成本持续下降。根据 ARK 的研究，到 2025 年，成本将降低 65%——每台设备的平均价格将低于 11,000 美元。^(¹⁴⁸)该分析基于赖特定律，该定律指出，累计产量每翻一番，成本就会以一定的百分比持续下降。


    那么，人工智能和机器人呢？这项技术的现状如何？即使深度学习取得了突破，将人工智能应用于机器人的进展总体上仍然缓慢。部分原因是许多研究都集中在基于软件的模型上，例如图像识别。但另一个原因是，物理机器人需要复杂的技术来实时理解环境——而环境通常充满噪音和干扰。这涉及到在未知环境中实现同步定位与地图构建，同时跟踪机器人的位置。为了有效做到这一点，甚至可能需要创造新技术，例如更好的神经网络算法和量子计算机。


    尽管如此，确实正在取得进展，尤其是在使用强化学习技术方面。看看下面的一些创新：


    *   *Osaro*：该公司开发的系统能让机器人快速学习。Osaro 将其描述为“模仿需要学习传感器融合以及高级规划和物体操作的行为的能力。它还将实现从一台机器向另一台机器学习，并超越人类程序员的洞察力进行改进的能力。”^(¹⁴⁹)例如，它的一款机器人能够在短短五秒钟内学会如何提起并放置一只鸡（该系统预计将用于家禽工厂）。^(¹⁵⁰)但这项技术可能有许多应用，例如用于无人机、自动驾驶汽车和物联网。


    *   *OpenAI*：他们创造了 Dactyl，这是一个具有类人灵巧性的机器人手。这基于对模拟环境的复杂训练，而非真实世界的交互。OpenAI 称之为“领域随机化”，它为机器人呈现了许多场景——即使是那些发生概率极低的场景。借助
    Dactyl，模拟能够涉及大约 100 年的问题解决时间。^(¹⁵¹)令人惊讶的结果之一是，系统学会了未经预先编程的人类手部动作——例如手指的滑动。Dactyl
    还经过训练，可以处理不完美的信息，例如当传感器读数延迟时，或者当需要处理多个物体时。


    *   *麻省理工学院*：机器人可能需要数千个样本数据才能理解其环境，例如检测像杯子这样简单的东西。但根据麻省理工学院教授的一篇研究论文，或许有办法减少这一数据量。他们使用了一个只关注少数关键特征的神经网络。^(¹⁵²)这项研究仍处于早期阶段，但可能对机器人产生重大影响。


    *   *谷歌*：从 2013 年开始，该公司掀起了一场针对机器人公司的并购狂潮。但结果令人失望。尽管如此，它并没有放弃这项业务。在过去几年里，谷歌专注于开发由人工智能驱动的更简单的机器人，并成立了一个名为“谷歌机器人”的新部门。例如，其中一款机器人可以查看一箱物品，并识别出被要求的那一件——用三指手将其拿起——成功率约为
    85%。而普通人做到这一点大约有 80%的成功率。^(¹⁵³)


    那么，所有这些都指向完全自动化吗？可能不会——至少在可预见的未来不会。请记住，一个主要趋势是协作机器人的发展。这些机器人与人类一起工作。总而言之，这正变成一种更强大的方法，因为它可以同时利用机器和人类的优势。


    请注意，这一领域的主要领导者之一是亚马逊。早在 2012 年，该公司就斥资 7.75 亿美元收购了顶级工业机器人制造商 Kiva。自那以后，亚马逊已在超过
    25 个配送中心部署了约 10 万个系统（正因如此，公司的库存容量提高了 40%）。^(¹⁵⁴)该公司这样描述道：


    > 亚马逊机器人利用各种机器人技术方法实现配送中心运营自动化，包括自主移动机器人、复杂的控制软件、语言感知、电源管理、计算机视觉、深度感知、机器学习、物体识别以及对命令的语义理解。^(¹⁵⁵)


    在仓库内，机器人在地板上快速移动，帮助定位和搬运存储货架。但人类也至关重要，因为他们能更好地识别和挑选单个产品。


    然而，这种设置非常复杂。例如，仓库员工会穿着机器人技术背心，以免被机器人撞倒！^(¹⁵⁶)这项技术使机器人能够识别人类。


    但协作机器人还存在其他问题。例如，员工确实担心最终会被机器取代。更重要的是，人们自然会感觉自己像机器中一个无足轻重的齿轮，这可能意味着士气低落。人类真的能与机器人建立情感联系吗？可能不会，尤其是工业机器人，它们确实不具备人类特质。

    '
- fmt: '# Robots in the Real World


    OK then, let’s now take a look at some of the other interesting use cases with
    industrial and commercial robots.


    ## Use Case: Security


    Both Erik Schluntz and Travis Deyle have extensive backgrounds in the robotics
    industry, with stints at companies like Google and SpaceX. In 2016, they wanted
    to start their own venture but first spent considerable time trying to find a
    real-world application for the technology, which involved talking to numerous
    companies. Schluntz and Deyle found one common theme: the need for physical security
    of facilities. How could robots provide protection after 5 pm—without having to
    spend large amounts on security guards?


    This resulted in the launch of Cobalt Robotics. The timing was spot-on because
    of the convergence of technologies like computer vision, machine learning, and,
    of course, the strides in robotics.


    While using traditional security technology is effective—say with cameras and
    sensors—they are static and not necessarily good for real-time response. But with
    a robot, it’s possible to be much more proactive because of the mobility and the
    underlying intelligence.


    However, people are still in the loop. Robots can then do what they are good at,
    such as 24/7 data processing and sensing, and people can focus on thinking critically
    and weighing the alternatives.


    Besides its technology, Cobalt has been innovative with its business model, which
    it calls Robotics as a Service (`RaaS`). By charging a subscription, these devices
    are much more affordable for customers.


    ## Use Case: Floor-Scrubbing Robots


    We are likely to see some of the most interesting applications for robots in categories
    that are fairly mundane. Then again, these machines are really good at handling
    repetitive processes.


    Take a look at Brain Corp, which was founded in 2009 by Dr. Eugene Izhikevich
    and Dr. Allen Gruber. They initially developed their technology for Qualcomm and
    DARPA. But Brain has since gone on to leverage machine learning and computer vision
    for self-driving robots. In all, the company has raised $125 million from investors
    like Qualcomm and SoftBank.


    Brain’s flagship robot is `Auto-C`, which efficiently scrubs floors. Because of
    the AI system, called `BrainOS` (which is connected to the cloud), the machine
    is able to autonomously navigate complex environments. This is done by pressing
    a button, and then `Auto-C` quickly maps the route.


    In late 2018, Brain struck an agreement with Walmart to roll out 1,500 `Auto-C`
    robots across hundreds of store locations.^([^(157)](#fn157)) The company has
    also deployed robots at airports and malls.


    But this is not the only robot in the works for Walmart. The company is also installing
    machines that can scan shelves to help with inventory management. With about 4,600
    stores across the United States, robots will likely have a major impact on the
    retailer.^([^(158)](#fn158))


    ## Use Case: Online Pharmacy


    As a second-generation pharmacist, TJ Parker had first-hand experience with the
    frustrations people felt when managing their prescriptions. So he wondered: Might
    the solution be to create a digital pharmacy?


    He was convinced that the answer was yes. But while he had a strong background
    in the industry, he needed a solid tech co-founder, which he found in Elliot Cohen,
    an MIT engineer. They would go on to create PillPack in 2013.


    The focus was to reimagine the customer experience. By using an app or going to
    the PillPack web site, a user could easily sign up—such as to input insurance
    information, enter prescription needs, and schedule deliveries. When the user
    received the package, it would have detailed information about dose instructions
    and even images of each pill. Furthermore, each of the pills included labels and
    were presorted into containers.


    To make all this a reality required a sophisticated technology infrastructure,
    called `PharmacyOS`. It also was based on a network of robots, which were located
    in an 80,000-square-foot warehouse. Through this, the system could efficiently
    sort and package the prescriptions. But the facility also had licensed pharmacists
    to manage the process and make sure everything was in compliance.


    In June 2018, Amazon.com shelled out about $1 billion for PillPack. On the news,
    the shares of companies like CVS and Walgreens dropped on the fears that the e-commerce
    giant was preparing to make a big play for the healthcare market.


    ## Use Case: Robot Scientists


    Developing prescription drugs is enormously expensive. Based on research from
    the Tufts Center for the Study of Drug Development, the average comes to about
    $2.6 billion per approved compound.^([^(159)](#fn159)) In addition, it can easily
    take over a decade to get a new drug to market because of the onerous regulations.


    But the use of sophisticated robots and deep learning could help. To see how,
    look at what researchers at the Universities of Aberystwyth and Cambridge have
    done. In 2009, they launched Adam, which was essentially a robot scientist that
    helped with the drug discovery process. Then a few years later, they launched
    Eve, which was the next-generation robot.


    The system can come up with hypotheses and test them as well as run experiments.
    But the process is not just about brute-force calculations (the system can screen
    more than 10,000 compounds per day).^([^(160)](#fn160)) With deep learning, Eve
    is able to use intelligence to better identify those compounds with the most potential.
    For example, it was able to show that triclosan—a common element found in toothpaste
    to prevent the buildup of plaque—could be effective against parasite growth in
    malaria. This is especially important since the disease has been becoming more
    resistant to existing therapies.'
  raw: '## Robots in the Real World


    OK then, let’s now take a look at some of the other interesting use cases with
    industrial and commercial robots.


    ### Use Case: Security


    Both Erik Schluntz and Travis Deyle have extensive backgrounds in the robotics
    industry, with stints at companies like Google and SpaceX. In 2016, they wanted
    to start their own venture but first spent considerable time trying to find a
    real-world application for the technology, which involved talking to numerous
    companies. Schluntz and Deyle found one common theme: the need for physical security
    of facilities. How could robots provide protection after 5 pm—without having to
    spend large amounts on security guards?


    This resulted in the launch of Cobalt Robotics. The timing was spot-on because
    of the convergence of technologies like computer vision, machine learning, and,
    of course, the strides in robotics.


    While using traditional security technology is effective—say with cameras and
    sensors—they are static and not necessarily good for real-time response. But with
    a robot, it’s possible to be much more proactive because of the mobility and the
    underlying intelligence.


    However, people are still in the loop. Robots can then do what they are good at,
    such as 24/7 data processing and sensing, and people can focus on thinking critically
    and weighing the alternatives.


    Besides its technology, Cobalt has been innovative with its business model, which
    it calls Robotics as a Service (RaaS). By charging a subscription, these devices
    are much more affordable for customers.


    ### Use Case: Floor-Scrubbing Robots


