    Foreword


    As this book demonstrates, the adoption of artificial intelligence (AI) will be
    a major inflection point in human history. Like other similarly groundbreaking
    technologies, how it’s administered and who has access to it will shape society
    for generations to come. However, AI stands out from the other transformative
    technologies of the nineteenth and twentieth centuries—think the steam engine,
    the electrical grid, genomics, computers, and the Internet—because it doesn’t
    depend exclusively on critically expensive physical infrastructure to enable adoption;
    after all, many of its benefits can be delivered through existing hardware we
    all carry around in our pockets. Instead, the fundamental limiting factor when
    it comes to the mass adoption of AI technology is our shared intellectual infrastructure:
    education, understanding, and vision.


    This is a crucial difference because, if handled correctly, AI can act as a sweeping
    democratizing force. It has and will eliminate from our lives the drudgery of
    the past and free up a tremendous amount of human energy and capital. But that
    "if" is far from certain. AI executed irresponsibly has the power to destabilize
    large parts of the world economy by causing, as many people fear, a shrinking
    workforce, reduced purchasing power for the middle class, and an economy without
    a wide and stable base fueled by an endless debt spiral.


    However, before we succumb to pessimism on AI, we should take a look back. Historic
    though AI’s transformative capacity may be—and it is historic—these same issues
    are and have been at play in the economic landscape for decades, even centuries.
    AI is, after all, an extension of a trend toward automation that has been at play
    since Henry Ford. In fact, Zoho itself was born from the tension between automation
    and egalitarian economic principles. Back in the early 2000s, we came to a realization
    that has shaped our approach to technology: regular people—small business owners,
    here and abroad—should have access to the same advanced business automations that
    the Fortune 500 companies have; otherwise, a huge swath of the population will
    be locked out of the economy.


    At the time, powerful digital software was almost unanimously gated behind rigid
    contracts, exorbitant fee structures, and complicated on-premise implementations.
    Big companies could shoulder the burden of such systems, while smaller operators
    were locked out, putting them at a tremendous disadvantage. We sought to disrupt
    that by opening up the promise of technology to wider and wider audiences. Over
    the last two decades, we’ve endeavored to increase the value of our products without
    increasing the price by tapping into the scalability of cloud technology. Our
    goal is to empower people at all levels of society by pushing down the price of
    business software while expanding the power of the tools. Access to capital shouldn’t
    limit success; businesses should rise or fall based on the strength of their vision
    for the future.


    Viewed this way, AI is the fulfillment of the promise of technology. It frees
    people from the constraints of time by enabling them to offload tedious or unpleasant
    rote labor. It helps them identify patterns at microscopic and macroscopic scales,
    which humans are not naturally well suited to perceive. It can forecast problems,
    and it can correct errors. It can save money, time, and even lives.


    Seeking to democratize these benefits just as we did for general business software,
    Zoho has threaded AI throughout our suite of apps. We spent the last six years
    quietly developing our own internal AI technology, built on the bedrock of our
    own principles. The result is Zia, an AI assistant who is smart, but not clever.
    This is a crucial distinction. A smart system has the information and functionality
    to empower the unique vision and intuition of an active operator. A clever system
    obfuscates the internal workings of the process, reducing the human to a passive
    user who simply consumes the insights provided by the machine. AI should be a
    tool to be wielded, not a lens through which we view the world. To steer such
    a powerful tool, we must be equipped with the knowledge to understand and operate
    it without eroding the human quality of our human systems.


    The need to stay current on this technology is exactly why a book like *Artificial
    Intelligence Basics* is so important in today’s world. It is the intellectual
    infrastructure that will enable people—regular people—to tap into the power of
    AI. Without these kinds of initiatives, AI will tip the balance of power in favor
    of big companies with big budgets. It’s crucial that the general population equip
    themselves with the skills to understand AI systems, because these systems will
    increasingly define how we interact with and navigate through the world. Soon,
    the information contained in this book won’t be merely a topic of interest; it
    will be a prerequisite for participation in the modern economy.'
