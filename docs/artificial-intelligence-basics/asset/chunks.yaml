    \ [22](#480660_1_En_2_Chapter.xhtml#Fn22_source)\n\n# 3. Machine Learning\n\n\
    Mining Insights from Data\n\n> *A breakthrough in machine learning would be worth\
    \ ten Microsofts.*\n> \n> —Bill Gates^([^(36)](#fn36))\n\nWhile Katrina Lake liked\
    \ to shop online, she knew the experience could be much better. The main problem:\
    \ It was tough to find fashions that were personalized.\n\nSo began the inspiration\
    \ for Stitch Fix, which Katrina launched in her Cambridge apartment while attending\
    \ Harvard Business School in 2011 (by the way, the original name for the company\
    \ was the less catchy “Rack Habit”). The site had a Q&A for its users—asking about\
    \ size and fashion styles, just to name a few factors—and expert stylists would\
    \ then put together curated boxes of clothing and accessories that were sent out\
    \ monthly.\n\nThe concept caught on quickly, and the growth was robust. But it\
    \ was tough to raise capital as many venture capitalists did not see the potential\
    \ in the business. Yet Katrina persisted and was able to create a profitable operation—fairly\
    \ quickly.\n\nAlong the way, Stitch Fix was collecting enormous amounts of valuable\
    \ data, such as on body sizes and style preferences. Katrina realized that this\
    \ would be ideal for machine learning. To leverage on this, she hired Eric Colson,\
    \ who was the vice president of Data Science and Engineering at Netflix, his new\
    \ title being chief algorithms officer.\n\nThis change in strategy was pivotal.\
    \ The machine learning models got better and better with their predictions, as\
    \ Stitch Fix collected more data—not only from the initial surveys but also from\
    \ ongoing feedback. The data was also encoded in the SKUs.\n\nThe result: Stitch\
    \ Fix saw ongoing improvement in customer loyalty and conversion rates. There\
    \ were also improvements in inventory turnover, which helped to reduce costs.\n\
    \nBut the new strategy did not mean firing the stylists. Rather, the machine learning\
    \ greatly augmented their productivity and effectiveness.\n\nThe data also provided\
    \ insights on what types of clothing to create. This led to the launch of Hybrid\
    \ Designs in 2017, which is Stitch Fix’s private-label brand. This proved effective\
    \ in dealing with the gaps in inventory.\n\nBy November 2017, Katrina took Stitch\
    \ Fix public, raising $120 million. The valuation of the company was a cool $1.63\
    \ billion—making her one of the richest women in the United States.^([^(37)](#fn37))\
    \ Oh, and at the time, she had a 14-month-old son!\n\nFast forward to today, Stitch\
    \ Fix has 2.7 million customers in the United States and generates over $1.2 billion\
    \ in revenues. There are also more than 100 data scientists on staff and a majority\
    \ of them have PhDs in areas like neuroscience, mathematics, statistics, and AI.^([^(38)](#fn38))\n\
    \nAccording to the company’s 10-K filing:\n\n> Our data science capabilities fuel\
    \ our business. These capabilities consist of our rich and growing set of detailed\
    \ client and merchandise data and our proprietary algorithms. We use data science\
    \ throughout our business, including to style our clients, predict purchase behavior,\
    \ forecast demand, optimize inventory and design new apparel.^([^(39)](#fn39))\n\
    \nNo doubt, the story of Stitch Fix clearly shows the incredible power of machine\
    \ learning and how it can disrupt an industry. In an interview with digiday.com,\
    \ Lake noted:\n\n> Historically, there’s been a gap between what you give to companies\
    \ and how much the experience is improved. Big data is tracking you all over the\
    \ web, and the most benefit you get from that right now is: If you clicked on\
    \ a pair of shoes, you’ll see that pair of shoes again a week from now. We’ll\
    \ see that gap begin to close. Expectations are very different around personalization,\
    \ but importantly, an authentic version of it. Not, ‘You abandoned your cart and\
    \ we’re recognizing that.’ It will be genuinely recognizing who you are as a unique\
    \ human. The only way to do this scalably is through embracing data science and\
    \ what you can do through innovation.^([^(40)](#fn40))\n\nOK then, what is machine\
    \ learning really about? Why can it be so impactful? And what are some of the\
    \ risks to consider?\n\nIn this chapter, we’ll answer these questions—and more."
  raw: "## Key Takeaways\n\n*   Structured data is labeled and formatted—and is often\
