- fmt: '# 2. Data


    The Fuel for AI


    Pinterest is one of the hottest startups in Silicon Valley, allowing users to
    pin their favorite items to create engaging boards. The site has 250 million MAUs
    (monthly active users) and posted $756 million in revenue in 2018.^([^(14)](#fn14))


    A popular activity for Pinterest is to plan for weddings. The bride-to-be will
    have pins for gowns, venues, honeymoon spots, cakes, invitations, and so on.


    This also means that Pinterest has the advantage of collecting huge amounts of
    valuable data. Part of this helps provide for targeted ads. Yet there are also
    opportunities for email campaigns. In one case, Pinterest sent one that said:


    > You’re getting married! And because we love wedding planning—especially all
    the lovely stationery—we invite you to browse our best boards curated by graphic
    designers, photographers and fellow brides-to-be, all Pinners with a keen eye
    and marriage on the mind.^([^(15)](#fn15))


    The problem: Plenty of the recipients of the email were already married or not
    expecting to marry anytime soon.


    Pinterest did act quickly and put out this apology:


    > Every week, we email collections of category-specific pins and boards to pinners
    we hope will be interested in them. Unfortunately, one of these recent emails
    suggested that pinners were actually getting married, rather than just potentially
    interested in wedding-related content. We’re sorry we came off like an overbearing
    mother who is always asking when you’ll find a nice boy or girl.


    It’s an important lesson. Even some of the most tech-savvy companies blow it.


    For example, there are some cases where the data may be spot-on but the outcome
    could still be an epic failure. Consider the case with Target. The company leveraged
    its massive data to send personalized offers to expectant mothers. This was based
    on those customers who made certain types of purchases, such as for unscented
    lotions. Target’s system would create a pregnancy score that even provided estimates
    of due dates.


    Well, the father of one of the customers saw the email and was furious, saying
    his daughter was not pregnant.^([^(16)](#fn16))


    But she was—and yes, she had been hiding this fact from her father.


    There’s no doubt that data is extremely powerful and critical for AI. But you
    need to be thoughtful and understand the risks. In this chapter, we’ll take a
    look at some of the things you need to know.


    ## Data Basics


    It’s good to have an understanding of the jargon of data.


    First of all, a bit (which is short for “binary digit”) is the smallest form of
    data in a computer. Think of it as the atom. A bit can either be 0 or 1, which
    is binary. It is also generally used to measure the amount of data that is being
    transferred (say within a network or the Internet).


    A byte, on the other hand, is mostly for storage. Of course, the numbers of bytes
    can get large very fast. Let’s see how in Table [2-1](#480660_1_En_2_Chapter.xhtml#Tab1).


    Table 2-1. Types of data levels


    | **Unit** | **Value** | **Use Case** |

    | --- | --- | --- |

    | Megabyte | 1,000 kilobytes | A small book |

    | Gigabyte | 1,000 megabytes | About 230 songs |

    | Terabyte | 1,000 gigabytes | 500 hours of movies |

    | Petabyte | 1,000 terabytes | Five years of the Earth Observing System (EOS)
    |

    | Exabyte | 1,000 petabytes | The entire Library of Congress 3,000 times over
    |

    | Zettabyte | 1,000 exabytes | 36,000 years of HD-TV video |

    | Yottabytes | 1,000 zettabytes | This would require a data center the size of
    Delaware and Rhode Island combined |


    Data can also come from many different sources. Here is just a sampling:


    * Web/social (Facebook, Twitter, Instagram, YouTube)

    * Biometric data (fitness trackers, genetics tests)

    * Point of sale systems (from brick-and-mortar stores and e-commerce sites)

    * Internet of Things or IoT (ID tags and smart devices)

    * Cloud systems (business applications like Salesforce.com)

    * Corporate databases and spreadsheets


    ## Types of Data


    There are four ways to organize data. First, there is structured data, which is
    usually stored in a relational database or spreadsheet. Some examples include
    the following:


    * Financial information

    * Social Security numbers

    * Addresses

    * Product information

    * Point of sale data

    * Phone numbers


    For the most part, structured data is easier to work with. This data often comes
    from CRM (Customer Relationship Management) and ERP (Enterprise Resource Planning)
    systems—and usually has lower volumes. It also tends to be more straightforward,
    say in terms of analysis. There are various BI (Business Intelligence) programs
    that can help derive insights from structured data. However, this type of data
    accounts for about 20% of an AI project.


    The majority will instead come from unstructured data, which is information that
    has no predefined formatting. You’ll have to do this yourself, which can be tedious
    and time consuming. But there are tools like next-generation databases—such as
    those based on NoSQL—that can help with the process. AI systems are also effective
    in terms of managing and structuring the data, as the algorithms can recognize
    patterns.


    Here are examples of unstructured data:


    * Images

    * Videos

    * Audio files

    * Text files

    * Social network information like tweets and posts

    * Satellite images


    Now there is some data that is a hybrid of structured and unstructured sources—called
    semi-structured data. The information has some internal tags that help with categorization.


    Examples of semi-structured data include XML (Extensible Markup Language), which
    is based on various rules to identify elements of a document, and JSON (JavaScript
    Object Notation), which is a way to transfer information on the Web through APIs
    (Application Programming Interfaces).


    But semi-structured data represents only about 5% to 10% of all data.


    Finally, there is time-series data, which can be both for structured, unstructured,
    and semi-structured data. This type of information is for interactions, say for
    tracking the “customer journey.” This would be collecting information when a user
    goes to the web site, uses an app, or even walks into a store.


    Yet this kind of data is often messy and difficult to understand. Part of this
    is due to understanding the intent of the users, which can vary widely. There
    is also huge volumes of interactional data, which can involve trillions of data
    points. Oh, and the metrics for success may not be clear. Why is a user doing
    something on the site?


    But AI is likely to be critical for such issues. Although, for the most part,
    the analysis of time-series data is still in the early stages.'
