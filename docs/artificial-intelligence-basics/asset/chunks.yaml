    借助该平台，您可以轻松构建整洁的数据结构。甚至还有内置系统来引导流程，例如问题预警。毫无疑问，这为构建模型奠定了坚实基础。但低代码在其他方面同样大有裨益。例如，您可以测试各种
    AI 平台——比如来自谷歌、亚马逊或微软的——看看哪个表现更佳。然后，您可以用现代化界面创建应用，并将其部署到网页或移动应用中。


    要感受低代码的强大之处，不妨看看毕马威（KPMG）是如何运用这项技术的。该公司成功帮助客户摆脱了在贷款中使用 LIBOR（伦敦银行间同业拆借利率）的做法。首先，毕马威利用其名为
    Ignite 的自有 AI 平台，摄取非结构化数据，并运用机器学习和自然语言处理来修订合同。接着，该公司使用 Appian 来协助文档共享、定制业务规则以及实时报告。


    这样的流程——如果手动完成——很容易耗费数千小时，且错误率高达 10%到 15%。但使用 Ignite/Appian 后，准确率超过了 96%。哦，处理文档的时间也缩短到了几秒钟。


    ## 部署与监控 AI 系统


    即使你构建了一个能正常运行的 AI 模型，也仍有更多工作要做。你需要找到部署和监控它的方法。


    这需要变更管理，而这总是复杂且困难的。AI 不同于典型的 IT 实施，因为它涉及利用预测和洞察进行决策。这意味着人们需要重新思考他们与技术的互动方式。


    同时还要考虑到，最终用户很可能是非技术人员，无论是员工还是消费者。因此，需要付出大量努力，让 AI 模型尽可能易于使用。例如，如果你构建了一个在线营销系统，你可能希望限制用户可选的选项——比如只提供四到五个。


    为什么？如果选项太多，用户可能会感到困惑，甚至不知从何入手。这就是所谓的“分析瘫痪”问题的一部分。一旦发生这种情况，AI 模型就难免会被很少采用，这将严重阻碍进展。


    另一个好策略是使用交互式可视化。换句话说，你可以通过调整一些变量轻松看到趋势如何变化。你还可以允许点击图表的某个部分来深入查看更详细的信息。


    创建文档也至关重要。但这不应仅仅是书面材料。例如，一个有效的方法是制作视频教程。这样的努力将大大有助于促进广泛采用。


    作为最佳实践，初始部署应该有所限制。也许可以只面向一小群测试用户和一小部分客户群体。同时还应发出警告，说明 AI 模型处于早期阶段，可能存在缺陷。


    因此，这个阶段是关于学习的。什么有效？什么应该移除？哪些地方可以改进？


    这绝对是一个迭代过程，不能操之过急。


    然后，一旦 AI 模型准备好全面部署，就应该有足够的支持到位，并有人负责领导项目管理。还必须对团队的胜利给予认可。希望这种赞誉能来自公司最高层，这将有助于鼓励越来越多的创新。


    有各种自动化平台可以帮助简化工作流程，例如 Alteryx。该公司的愿景是让数据科学和分析大众化，无论某人是否有技术背景。Alteryx 系统处理流程中的关键领域：数据发现、数据准备、分析和部署。所有这些都通过无代码的拖放工具完成。此外，该公司的许多客户都是非技术运营商，如凯悦酒店、联合利华和克罗格。


    再次强调，AI 开发确实是一段旅程——你的策略将不可避免地发生变化。这是必然的。据 Dataiku 销售工程副总裁 Kurt Muehmel 表示^(¹⁸⁹)：


    *   企业有时未能意识到的是，通往 AI 的道路是一场长期的演变，不仅涉及技术，还涉及公司协作和共同工作的方式。因此，除了教育之外，AI 战略的关键组成部分之一应该是全面的变更管理。重要的是要制定短期和长期的路线图，规划首先通过预测分析、然后是机器学习，最终——作为长期目标——AI
    来实现什么，以及每个路线图如何影响业务的各个部分以及那些业务线中的人员及其日常工作。


    ## 结论


    如本章所示，在着手实施 AI 时，审视两条路径至关重要。第一条是最大化利用任何采用该技术的第三方系统。但同时也要关注数据质量。否则，结果很可能会偏离目标。


    第二条路径是开展一个基于公司自身数据的 AI 项目。要取得成功，必须有一个融合了技术、业务和领域专业知识的强大团队。很可能还需要一些 AI 培训。即使对于那些拥有数据科学和工程背景的人来说也是如此。


    由此，项目步骤不应操之过急：评估 IT 环境、设定清晰的业务目标、清理数据、选择合适的工具和平台、创建 AI 模型以及部署系统。在早期项目中，挑战不可避免，因此保持灵活性至关重要。但这份努力应该是非常值得的。

    '
- fmt: '# Key Takeaways


    - Even the best companies have difficulties with implementing AI. Because of this,
    there must be great care, diligence, and planning. It’s also important to realize
    that failure is common.

    - There are two main ways to use AI in a company: through a vendor’s software
    application or an in-house model. The latter is much more difficult and requires
    a major commitment from the organization.

    - When using off-the-shelf AI applications, there is still much work to be done.
    For example, if the employees are not correctly inputting the data, then the results
    will likely be off.

    - Education is critical with an AI implementation, even for experienced engineers.
    There are excellent online training resources to help out with this.

    - Be mindful of the risks of AI implementations, such as bias, security, and privacy.

    - Some of the key parts of the AI implementation process include the following:
    identify a problem to solve; put together a strong team; select the right tools
    and platforms; create the AI model; and deploy and monitor the AI model.

    - When developing a model, look at how the technology relates to people. The fact
    is that people can be much better at certain tasks.

    - Forming the team is not easy, so do not rush the process. Have a leader who
    has a good business or operational background, with a mix of technical skills.

    - It’s good to experiment with the various AI Tools. However, before doing this,
    make sure you do an IT assessment.

    - Some of the popular AI Tools include `TensorFlow`, `PyTorch`, `Python`, `Keras`,
    and the `Jupyter Notebook`.

    - Automated machine learning or `autoML` tools help to deal with processes like
    data prep and feature selection for AI models. The focus is on those who do not
    have technical skills.

    - Deployment of the AI model is more than just scaling. It’s also critical to
    have the system easy to use, so as to allow for much more adoption.


