    behind housing, and twice as large as healthcare. Something else to keep in mind:
    The typical car is used only about 5% of the time as it is usually parked somewhere.^([^(195)](#fn195))


    In light of the enormous opportunity for improvement, it should be no surprise
    that the autonomous car industry has seen massive amounts of investment. This
