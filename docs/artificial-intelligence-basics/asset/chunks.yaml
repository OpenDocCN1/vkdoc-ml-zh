    \ “RPA is a great way to infuse AI capabilities into business processes.”^([^(100)](#fn100))\n\
    \nHere are some other ways CRPA can allow for AI functions:\n\n*   You can connect\
    \ chatbots with your system, which will allow for automated customer service (we’ll\
    \ cover this topic in Chapter [6](#480660_1_En_6_Chapter.xhtml)).\n\n*   AI can\
    \ find the right moment to send an email or alert.\n\n*   IVR (Interactive Voice\
    \ Response) has gotten a bad reputation over the years. Simply put, customers\
    \ do not like the hassle of going through multiple steps to solve a problem. But\
    \ with CRPA, you can use something called Dynamic IVR. This personalizes the voice\
    \ messages to each customer, providing for a much better experience.\n\n*   NLP\
    \ and text analysis can convert unstructured data into structured data. This can\
    \ make the CRPA more effective."
  trans: "\n### 确定适合自动化的功能\n\n> *是的，特斯拉过度自动化是一个错误。准确地说，是我的错误。人类被低估了。*\n> \n> ——埃隆·马斯克，特斯拉首席执行官^(⁹⁸)\n\
    \n尽管 RPA 功能强大，能够为公司带来显著成效，但其能力仍然相当有限。这项技术本质上最适合自动化那些重复性、结构化且常规的流程。这包括日程安排、数据输入/传输、遵循规则/工作流、剪切粘贴、填写表单以及搜索等事务。这意味着\
    \ RPA 实际上可以在组织的几乎每个部门发挥作用。\n\n那么，这项技术通常在哪些方面无法奏效呢？嗯，如果某个流程需要独立判断，那么 RPA 可能就不太适用了。同样，当流程频繁变动时也是如此。在这种情况下，你可能会花费大量时间持续调整配置。\n\
    \n一旦你确定了业务中看起来适合应用该技术的部分，还有无数其他因素需要考虑。换句话说，如果你专注于以下几点，项目成功的可能性会更大：\n\n*   业务中表现严重不佳的领域\n\
    *   占用员工大量时间且错误率高的流程\n*   业务量增加时需要更多人手的任务\n*   你正在考虑外包的领域\n*   步骤繁多且涉及多种应用程序的流程\n\
    \n### 评估流程\n\n公司拥有许多未成文的流程是很常见的。这没问题。这种方法允许灵活性，而这正是人类所擅长的。\n\n然而，对于机器人来说，情况远非如此。要成功实施，你需要对流程进行深入评估。这实际上可能需要一些时间，并且请外部顾问来帮忙可能是明智之举。他们的优势在于更加中立，并且能更好地识别弱点。\n\
    \n一些 RPA 供应商确实拥有自己的工具来帮助分析流程——你应该充分利用这些工具。还有一些第三方软件提供商也有自己的产品。其中之一是 Celonis，它与\
    \ UiPath、Automation Anywhere、Blue Prism 等 RPA 平台集成。该软件本质上执行一种数字 MRI，分析数据，提供关于你的流程实际运作方式的见解。它还会识别弱点和机会，例如增加收入、提高客户满意度和释放资源。\n\
    \n无论你采取何种方法，制定一个清晰的计划至关重要，该计划需要吸纳 IT 部门、高层管理人员以及受影响的部门的意见。同时，确保让数据分析人员参与进来，因为可能存在利用数据的机会。\n\
    \n### 选择 RPA 供应商并部署软件\n\n通过前两个步骤，你将处于一个非常有利的位置来评估不同的 RPA 系统。例如，如果你的主要目标是裁员，那么你会寻找专注于无人值守机器人的软件。或者，如果你想利用数据（例如用于\
    \ AI 应用），那么这将导向其他类型的 RPA 平台。\n\n然后，一旦你选定了一个，就可以开始部署。好消息是，这个过程可能相对较快，比如不到一个月。\n\
    \n但随着你继续开展更多的 RPA 项目，你可能会遇到所谓的“自动化疲劳”。这时，回报通常开始下降。\n\n可以这样理解：当你刚开始时，重点通常放在业务中最需要自动化的领域，这意味着投资回报率会很高。但随着时间的推移，重点会转向那些不太适合自动化的任务，即使要实现微小的改进，也可能需要付出更多的努力。\n\
    \n因此，在进行大规模的 RPA 转型时，适当降低期望值是个好主意。\n\n### 建立团队管理 RPA 平台\n\n仅仅因为 RPA 提供了高度的自动化，并不意味着它不需要管理。相反，最好的方法是组建一个团队，通常被称为卓越中心（CoE）。\n\
    \n为了充分利用 CoE，你需要明确每个人的职责。例如，你应该能够回答以下问题：\n\n*   如果机器人出现问题该怎么办？在哪些节点应该进行人工干预？\n\
    *   谁负责监控 RPA？\n*   谁负责培训？\n*   谁将担任一线支持的角色？\n*   谁负责开发机器人？\n\n对于较大的组织，你可能还想扩展这些角色。你可以设立一个\
    \ RPA 倡导者，他将是整个公司该平台的布道者。或者可以有一个 RPA 变革经理，负责提供沟通以帮助推广采用。\n\n最后，随着 RPA 实施规模的扩大，一个关键目标应该是审视所有部分如何协同工作。像许多其他软件系统一样，存在跨组织蔓延的风险——这可能意味着无法获得更高的性能。这时，一个积极主动的\
    \ CoE 可以产生重大的积极影响。\n\n## RPA 与 AI\n\n尽管仍处于初期阶段，AI 已经在 RPA 工具方面取得了进展。这导致了认知机器人流程自动化（CRPA）软件机器人的出现。\n\
    \n这很合理。毕竟，RPA 是关于优化流程并涉及大量数据的。因此，供应商开始实施机器学习、深度学习、语音识别和自然语言处理等系统。CRPA 领域的一些领导者包括\
    \ UiPath、Automation Anywhere、Blue Prism、NICE Systems 和 Kryon Systems。\n\n例如，使用\
    \ Automation Anywhere，机器人可以处理诸如从电子邮件中提取发票等任务，这涉及复杂的文本处理。该公司还拥有与第三方 AI 服务（如 IBM\
    \ Watson、AWS Machine Learning 和 Google Cloud AI）的预构建集成。^(⁹⁹)\n\n“近年来，AI 驱动的服务激增，但企业往往难以将其投入运营，”Automation\
    \ Anywhere 的产品营销总监 Mukund Srigopal 表示。“RPA 是将 AI 能力注入业务流程的绝佳方式。”^(¹⁰⁰)\n\n以下是\
    \ CRPA 实现 AI 功能的其他一些方式：\n\n*   你可以将聊天机器人连接到你的系统，从而实现自动化客户服务（我们将在第 6 章中讨论这个主题）。\n\
    *   AI 可以找到发送电子邮件或警报的最佳时机。\n*   IVR（交互式语音应答）多年来名声不佳。简而言之，客户不喜欢为了解决问题而经历多个步骤的麻烦。但有了\
    \ CRPA，你可以使用称为动态 IVR 的技术。这为每位客户个性化语音消息，提供了更好的体验。\n*   NLP 和文本分析可以将非结构化数据转换为结构化数据。这可以使\
    \ CRPA 更加有效。\n"
- fmt: '# RPA in the Real World


    To get a better sense of how RPA works and to understand the benefits, here’s
    a look at a case study of Microsoft.^([^(101)](#fn101)) Every year, the company
    pays billions of dollars in royalties to game developers, partners, and content
    creators. Yet the process was mostly manual, involving the sending of thousands
    of statements—and yes, this was a big time waster for the company.


    So the company selected Kyron for an RPA implementation. By doing an initial process
    review, Microsoft realized that anywhere from 70% to 80% of the statements were
    straightforward and could be easily automated. The rest included exceptions that
    required human intervention, such as approvals.


    With the RPA system, a visual detection algorithm could divvy up the statements
    and find the exceptions. The setup was also fairly quick, taking about 6 weeks.


    As should be no surprise, the results had a material impact on the process. For
    instance, a bot was able to take only 2.5 hours to complete 150 royalty statements.
    By comparison, it would take 50 hours for employees to do this. The bottom line:
    Microsoft achieved a 2,000% savings. There was also an elimination of any rework
    from human error (which before was about 5% in a given month).


    ## Conclusion


    As seen with the Microsoft case study, RPA can lead to major savings. But there
    still needs to be diligent planning, so as to understand your processes. For the
    most part, the focus should be on tasks that are manual and repetitive—not those
    that rely heavily on judgment. Next, it is important to setup a CoE to oversee
    the ongoing management of the automation, which will help with handling exceptions,
    collecting data, and tracking KPIs.


    RPA is also a great way to implement basic AI within an organization. Actually,
    because there could be significant ROI, this may spur even more investment in
    pursuing this technology.


    ## Key Takeaways


    - Robotic Process Automation (RPA) allows you to use low-code visual drag-and-drop
    systems to automate the workflow of a process.

    - Unattended RPA is when a process is completely automated.

    - RDA (Robotic Desktop Automation) is where RPA helps an employee with a job or
    task.

    - Some of the benefits of RPA include higher customer satisfaction, lower error
    rates, improved compliance, and easier integration with legacy systems.

    - Some of the drawbacks of RPA include the difficulty with adapting to changes
    in the underlying applications, issues with virtualized apps, and resistance from
    employees.

    - RPA tends to work best where you can automate repetitive, structured, and routine
    processes, such as scheduling, inputting/transferring data, and following rules/workflows.

    - When implementing an RPA solution, some of the steps to consider include determining
    the functions to automate, assessing the processes, selecting the RPA vendor and
    deploying the software, and setting in place a team to manage the platform.

    - A center of excellence (CoE) is a team that manages an RPA implementation.

    - Cognitive Robotic Process Automation (CRPA) is an emerging category of RPA that
    focuses on AI technologies.


