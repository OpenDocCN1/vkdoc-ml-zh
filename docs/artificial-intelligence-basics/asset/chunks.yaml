- fmt: '# Naïve Bayes Classifier (Supervised Learning/Classification)


    Earlier in this chapter, we looked at Bayes’ theorem. As for machine learning,
    this has been modified into something called the Naïve Bayes Classifier. It is
    “naïve” because the assumption is that the variables are independent from each
    other—that is, the occurrence of one variable has nothing to do with the others.
    True, this may seem like a drawback. But the fact is that the Naïve Bayes Classifier
    has proven to be quite effective and fast to develop.


    There is another assumption to note as well: the a priori assumption. This says
    that the predictions will be wrong if the data has changed.


    There are three variations on the Naïve Bayes Classifier:


    - *Bernoulli*: This is if you have binary data (true/false, yes/no).

    - *Multinomial*: This is if the data is discrete, such as the number of pages
    of a book.

    - *Gaussian*: This is if you are working with data that conforms to a normal distribution.


    A common use case for Naïve Bayes Classifiers is text analysis. Examples include
    email spam detection, customer segmentation, sentiment analysis, medical diagnosis,
    and weather predictions. The reason is that this approach is useful in classifying
    data based on key features and patterns.


    To see how this is done, let’s take an example: Suppose you run an e-commerce
    site and have a large database of customer transactions. You want to see how variables
    like product review ratings, discounts, and time of year impact sales.


    Table [3-2](#480660_1_En_3_Chapter.xhtml#Tab2) shows a look at the dataset.


    **Table 3-2.** Customer transactions dataset


    | Discount | Product Review | Purchase |

    | --- | --- | --- |

    | Yes | High | Yes |

    | Yes | Low | Yes |

    | No | Low | No |

    | No | Low | No |

    | No | Low | No |

    | No | High | Yes |

    | Yes | High | No |

    | Yes | Low | Yes |

    | No | High | Yes |

    | Yes | High | Yes |

    | No | High | No |

    | No | Low | Yes |

    | Yes | High | Yes |

    | Yes | Low | No |


    You will then organize this data into frequency tables, as shown in Tables [3-3](#480660_1_En_3_Chapter.xhtml#Tab3)
    and [3-4](#480660_1_En_3_Chapter.xhtml#Tab4).


    **Table 3-4.** Product review frequency table


    | | Purchase | |

    | --- | --- | --- |

    | | Yes | No | Total |

    | **Product Review** | **High** | 21 | 2 | 11 |

    | | **Low** | 3 | 4 | 8 |

    | | **Total** | 24 | 6 | 19 |


    **Table 3-3.** Discount frequency table


    | | Purchase |

    | --- | --- |

    | | Yes | No |

    | **Discount** | Yes | 19 | 1 |

    | | Yes | 5 | 5 |


    When looking at this, we call the purchase an event and the discount and product
    reviews as independent variables. Then we can make a probability table for one
    of the independent variables, say the product reviews. See Table [3-5](#480660_1_En_3_Chapter.xhtml#Tab5).


    **Table 3-5.** Product review probability table


    | | Purchase | |

    | --- | --- | --- |

    | | Yes | No | |

    | **Product Reviews** | **High** | 9/24 | 2/6 | 11/30 |

    | | **Low** | 7/24 | 1/6 | 8/30 |

    | | | 24/30 | 6/30 | |


    Using this chart, we can see that the probability of a purchase when there is
    a low product review is 7/24 or 29%. In other words, the Naïve Bayes Classifier
    allows more granular predictions within a dataset. It is also relatively easy
    to train and can work well with small datasets.


    ## K-Nearest Neighbor (Supervised Learning/Classification)


    The k-Nearest Neighbor (k-NN) is a method for classifying a dataset (k represents
    the number of neighbors). The theory is that those values that are close together
    are likely to be good predictors for a model. Think of it as “Birds of a feather
    flock together.”


    A use case for k-NN is the credit score, which is based on a variety of factors
    like income, payment histories, location, home ownership, and so on. The algorithm
    will divide the dataset into different segments of customers. Then, when there
    is a new customer added to the base, you will see what cluster he or she falls
    into—and this will be the credit score.


    K-NN is actually simple to calculate. In fact, it is called lazy learning because
    there is no training process with the data.


    To use k-NN, you need to come up with the distance between the nearest values.
    If the values are numerical, it could be based on a Euclidian distance, which
    involves complicated math. Or, if there is categorical data, then you can use
    an overlap metric (this is where the data is the same or very similar).


    Next, you’ll need to identify the number of neighbors. While having more will
    smooth the model, it can also mean a need for huge amount of computational resources.
    To manage this, you can assign higher weights to data that are closer to their
    neighbors.


    ## Linear Regression (Supervised Learning/Regression)


    Linear regression shows the relationship between certain variables. The equation—assuming
    there is enough quality data—can help predict outcomes based on inputs.


    Example: Suppose we have data on the number of hours spent studying for an exam
    and the grade. See Table [3-6](#480660_1_En_3_Chapter.xhtml#Tab6).


    **Table 3-6.** Chart for hours of study and grades


    | Hours of Study | Grade Percentage |

    | --- | --- |

    | 1 | 0.75 |

    | 1 | 0.69 |

    | 1 | 0.71 |

    | 3 | 0.82 |

    | 3 | 0.83 |

    | 4 | 0.86 |

    | 5 | 0.85 |

    | 5 | 0.89 |

    | 5 | 0.84 |

    | 6 | 0.91 |

    | 6 | 0.92 |

    | 7 | 0.95 |


    As you can see, the general relationship is positive (this describes the tendency
    where a higher grade is correlated with more hours of study). With the regression
    algorithm, we can plot a line that has the best fit (this is done by using a calculation
    called “least squares,” which minimizes the errors). See Figure [3-4](#480660_1_En_3_Chapter.xhtml#Fig4).


    ![../images/480660_1_En_3_Chapter/480660_1_En_3_Fig4_HTML.jpg](images/480660_1_En_3_Chapter/480660_1_En_3_Fig4_HTML.jpg)


    **Figure 3-4.** This is a plot of a linear regression model that is based on hours
    of study


    From this, we get the following equation:


    `Grade = Number of hours of study × 0.03731 + 0.6889`


    Then, let’s suppose you study 4 hours for the exam. What will be your estimated
    grade? The equation tells us how:


    `0.838 = 4 × 0.03731 + 0.6889`


    How accurate is this? To help answer this question, we can use a calculation called
    R-squared. In our case, it is 0.9180 (this ranges from 0 to 1). The closer the
    value is to 1, the better the fit. So 0.9180 is quite high. It means that the
    hours of study explains 91.8% of the grade on the exam.


    Now it’s true that this model is simplistic. To better reflect reality, you can
    add more variables to explain the grade on the exam—say the student’s attendance.
    When doing this, you will use something called multivariate regression.


    ### Note


    If the coefficient for a variable is quite small, then it might be a good idea
    to not include it in the model.


    Sometimes data may not be in a straight line either, in which case the regression
    algorithm will not work. But you can use a more complex version, called polynomial
    regression.'
