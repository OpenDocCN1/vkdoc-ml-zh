    # 8. 人工智能的实施


    为你的公司推动变革


    2019年3月，一名枪手在Facebook上直播了他在新西兰两座清真寺残忍杀害50人的过程。该视频被观看了约4000次，直到袭击发生29分钟后才被关闭。^([(170)](#fn170))
    随后，该视频被上传到其他平台，并被观看了数百万次。


    是的，这是一个鲜明的例子，展示了人工智能如何以可怕的方式失败。


    在一篇博文中，Facebook的产品管理副总裁盖伊·罗森指出：


    > 人工智能系统基于“训练数据”，这意味着你需要成千上万个内容示例来训练一个能够检测特定类型文本、图像或视频的系统。这种方法在色情内容、恐怖主义宣传以及暴力画面等领域效果很好，因为我们有大量示例可用于训练系统。然而，这个特定的视频并未触发我们的自动检测系统。要实现这一点，我们需要向系统提供大量此类特定内容的数据，但由于这些事件不幸地非常罕见，这很困难。另一个挑战是自动将此类内容与视觉上相似的无害内容区分开来——例如，如果来自直播游戏视频的数千个视频被我们的系统标记，我们的审核人员可能会错过那些重要的真实世界视频，而我们本可以提醒急救人员在地面提供帮助。^([(171)](#fn171))


    此外，各种不良行为者重新上传了该视频的编辑版本以欺骗Facebook的人工智能系统，这也无济于事。


    当然，这是技术缺陷的一个重大教训，该公司表示致力于不断改进其系统。但Facebook的案例研究也突显出，即使是技术最先进的公司也面临重大挑战。这就是为什么在实施人工智能时，需要有周密的计划，并理解问题将不可避免地出现。但这可能很困难，因为公司的高级管理人员面临着从这项技术中取得成果的压力。


    在本章中，我们将探讨人工智能实施的一些最佳实践。'
  raw: '## Key Takeaways


    *   A robot can take actions, sense its environment, and have some level of intelligence.
    There are also key functions like sensors, actuators (such as motors), and computers.


    *   There are two main ways to operate a robot: the telerobot (this is controlled
    by a human) and autonomous robot (based on AI systems).


    *   Developing robots is incredibly complicated. Even some of the world’s best
    technologists, like Tesla’s Elon Musk, have had major troubles with the technology.
    A key reason is the Moravec paradox. Basically, what’s easy for humans is often
    difficult for robots and vice versa.


    *   While AI is making an impact on robots, the process has been slow. One reason
    is that there has been more emphasis on software-based technologies. But also
    robots are extremely complicated when it comes to moving and understanding the
    environment.


    *   Cobots are machines that work alongside humans. The idea is that this will
    allow for the leveraging of the advantages of both machines and people.


    *   The costs of robots are a major reason for lack of adoption. But innovative
    companies, like Cobalt Robotics, are using new business models to help out, such
    as with subscriptions.


    *   Consumer robots are still in the initial stages, especially compared to industrial
    robots. But there are some interesting use cases, such as with machines that can
    be companions for people.


    *   During the 1950s, science fiction writer Isaac Asimov created the Three Laws
    of robotics. For the most part, they focused on making sure that the machines
    would not harm people or society. Even though there are criticisms of Asimov’s
    approach, they are still widely accepted.


    *   Security has not generally been a problem with robots. But this will likely
    change—and fast. After all, more robots are connected to the cloud, which allows
    for the intrusion of viruses and malware.


    *   The Robot Operating System (ROS) has become a standard for the robotics industry.
    This middleware helps with planning, simulations, mapping, localization, perception,
    and prototypes.


    *   Developing intelligent robots has many challenges because of the need to create
    physical systems. Although, there are tools to help out, such as by allowing for
    sophisticated simulations.


