- fmt: '# Neural Networks and Deep Learning


    As a teen in the 1950s, Geoffrey Hinton wanted to be a professor and to study
    AI. He came from a family of noted academics (his great-great-grandfather was
    George Boole). His mom would often say, “Be an academic or be a failure.”^([^(13)](#fn13))


    Even during the first AI winter, Hinton was passionate about AI and was convinced
    that Rosenblatt’s neural network approach was the right path. So in 1972, he received
    his PhD on the topic from the University of Edinburgh.


    But during this period, many people thought that Hinton was wasting his time and
    talents. AI was essentially considered a fringe area. It wasn’t even thought of
    as a science.


    But this only encouraged Hinton more. He relished his position as an outsider
    and knew that his ideas would win out in the end.


    Hinton realized that the biggest hindrance to AI was computer power. But he also
    saw that time was on his side. Moore’s Law predicted that the number of components
    on a chip would double about every 18 months.


    In the meantime, Hinton worked tirelessly on developing the core theories of neural
    networks—something that eventually became known as deep learning. In 1986, he
    wrote—along with David Rumelhart and Ronald J. Williams—a pathbreaking paper,
    called “Learning Representations by Back-propagating Errors.” It set forth key
    processes for using backpropagation in neural networks. The result was that there
    would be significant improvement in accuracy, such as with predictions and visual
    recognition.


    Of course, this did not happen in isolation. Hinton’s pioneering work was based
    on the achievements of other researchers who also were believers in neural networks.
    And his own research spurred a flurry of other major achievements:


    * *1980*: Kunihiko Fukushima created Neocognitron, which was a system to recognize
    patterns that became the basis of convolutional neural networks. These were based
    on the visual cortex of animals.

    * *1982*: John Hopfield developed “Hopfield Networks.” This was essentially a
    recurrent neural network.

    * *1989*: Yann LeCun merged convolutional networks with backpropagation. This
    approach would find use cases with analyzing handwritten checks.

    * *1989*: Christopher Watkins’ PhD thesis, “Learning from Delayed Rewards,” described
    Q-Learning. This was a major advance in helping with reinforcement learning.

    * *1998*: Yann LeCun published “Gradient-Based Learning Applied to Document Recognition,”
    which used descent algorithms to improve neural networks.


    ## Technological Drivers of Modern AI


    Besides advances in new conceptual approaches, theories, and models, AI had some
    other important drivers. Here’s a look at the main ones:


    * *Explosive Growth in Datasets*: The internet has been a major factor for AI
    because it has allowed for the creation of massive datasets. In the next chapter,
    we’ll take a look at how data has transformed this technology.

    * *Infrastructure*: Perhaps the most consequential company for AI during the past
    15 years or so has been Google. To keep up with the indexing of the Web—which
    was growing at a staggering rate—the company had to come up with creative approaches
    to build scalable systems. The result has been innovation in commodity server
    clusters, virtualization, and open source software. Google was also one of the
    early adopters of deep learning, with the launch of the “Google Brain” project
    in 2011. Oh, and a few years later the company hired Hinton.

    * *GPUs (Graphics Processing Units)*: This chip technology, which was pioneered
    by NVIDIA, was originally for high-speed graphics in games. But the architecture
    of GPUs would eventually be ideal for AI as well. Note that most deep learning
    research is done with these chips. The reason is that—with parallel processing—the
    speed is multiples higher than traditional CPUs. This means that computing a model
    may take a day or two vs. weeks or even months.


    All these factors reinforced themselves—adding fuel to the growth of AI. What’s
    more, these factors are likely to remain vibrant for many years to come.


    ## Structure of AI


    In this chapter, we’ve covered many concepts. Now it can be tough to understand
    the organization of AI. For instance, it is common to see terms like machine learning
    and deep learning get confused. But it is essential to understand the distinctions,
    which we will cover in detail in the rest of this book.


    But on a high-level view of things, Figure [1-3](#480660_1_En_1_Chapter.xhtml#Fig3)
    shows how the main elements of AI relate to each other. At the top is AI, which
    covers a wide variety of theories and technologies. You can then break this down
    into two main categories: machine learning and deep learning.


    ![../images/480660_1_En_1_Chapter/480660_1_En_1_Fig3_HTML.png](images/480660_1_En_1_Chapter/480660_1_En_1_Fig3_HTML.png)


    Figure 1-3. This is a high-level look at the main components of the AI world


    ## Conclusion


    There’s nothing new that AI is a buzzword today. The term has seen various stomach-churning
    boom-bust cycles.


    Maybe it will once again go out of favor? Perhaps. But this time around, there
    are true innovations with AI that are transforming businesses. Mega tech companies
    like Google, Microsoft, and Facebook consider the category to be a major priority.
    All in all, it seems like a good bet that AI will continue to grow and change
    our world.


    ## Key Takeaways


    * Technology often takes longer to evolve than originally understood.

    * AI is not just about computer science and mathematics. There have been key contributions
    from fields like economics, neuroscience, psychology, linguistics, electrical
    engineering, mathematics, and philosophy.

    * There are two main types of AI: weak and strong. Strong is where machines become
    self-aware, whereas weak is for systems that focus on specific tasks. Currently,
    AI is at the weak stage.

    * The Turing Test is a common way to test if a machine can think. It is based
    on whether someone really thinks a system is intelligent.

    * Some of the key drivers for AI include new theories from researchers like Hinton,
    the explosive growth in data, new technology infrastructure, and GPUs.


