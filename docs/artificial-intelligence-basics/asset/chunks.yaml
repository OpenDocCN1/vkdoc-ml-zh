  trans: '

    ## 反向传播


    人工神经网络的主要缺点之一是对模型中的权重进行调整的过程。传统方法，例如使用变异算法，采用的是随机值，这被证明非常耗时。


    鉴于此，研究人员开始寻找替代方案，例如反向传播。这项技术自 20 世纪 70 年代就已存在，但由于性能不佳而鲜受关注。但大卫·鲁梅尔哈特、杰弗里·辛顿和罗纳德·威廉姆斯意识到，只要加以改进，反向传播仍有潜力。1986
    年，他们发表了一篇题为《通过反向传播误差学习表征》的论文，这在人工智能界引起了轰动。^(⁵⁶) 该论文清楚地表明，反向传播不仅可以更快，还能实现更强大的人工神经网络。


    毫不意外，反向传播涉及大量数学运算。但归根结底，它是在发现错误时调整神经网络，然后再次通过神经网络迭代新的数值。本质上，这个过程涉及持续的微小调整，以不断优化模型。


    例如，假设某个输入的输出为 0.6。这意味着误差为 0.4（1.0 减去 0.6），这并不理想。但我们可以反向传播这个输出，也许新的输出可以达到 0.65。这种训练将持续进行，直到数值非常接近
    1。


    图 4-3 说明了这一过程。起初，由于权重过大，误差水平很高。但通过迭代，误差会逐渐下降。然而，过度迭代可能导致误差增加。换句话说，反向传播的目标是找到中间点。


    ![../images/480660_1_En_4_Chapter/480660_1_En_4_Fig3_HTML.jpg](img/480660_1_En_4_Fig3_HTML.jpg)


    图 4-3.


    反向传播函数的最优值位于图表底部


    作为反向传播成功的一个衡量标准，涌现了大量商业应用。其中之一是 NETtalk，由特伦斯·谢伊诺夫斯基和查尔斯·罗森伯格在 20 世纪 80 年代中期开发。这台机器能够学习如何发音英语文本。NETtalk
    非常有趣，甚至曾在《今日秀》上演示过。


    还出现了许多利用反向传播技术的初创公司，例如 HNC Software。该公司构建了检测信用卡欺诈的模型。直到 HNC 在 20 世纪 80 年代末成立之前，这个过程大多由人工完成，导致错误成本高昂且发卡量低。但通过使用深度学习方法，信用卡公司得以节省数十亿美元。


    2002 年，HNC 被费埃哲公司（Fair, Isaac）以 8.1 亿美元收购。^(⁵⁷)


    ## 各种神经网络


    最基本的神经网络类型是全连接神经网络。顾名思义，它是指所有神经元在层与层之间都有连接。这种网络实际上非常流行，因为它在创建模型时几乎不需要进行判断。


    那么，还有哪些其他类型的神经网络呢？常见的包括循环神经网络（RNN）、卷积神经网络（CNN）和生成对抗网络（GAN），我们接下来将介绍这些网络。


    ### 循环神经网络


    对于循环神经网络（RNN），其功能不仅处理当前输入，还处理跨时间的先前输入。一个例子是你在消息应用中输入字符时发生的情况。当你开始打字时，系统会预测单词。所以，如果你输入“He”，计算机可能会建议“He”、“Hello”和“Here''s”。RNN
    本质上是一系列基于复杂算法相互馈送的神经网络。


    该模型有多种变体。其中一种称为 LSTM，即长短期记忆网络。这源于塞普·霍赫赖特教授和于尔根·施密德胡伯教授在 1997 年发表的一篇论文。^(⁵⁸) 在该论文中，他们提出了一种有效利用长时间间隔输入的方法，从而允许使用更多的数据集。


    当然，RNN 也有缺点。存在梯度消失问题，这意味着随着模型变大，准确性会下降。模型也可能需要更长的训练时间。


    为了解决这个问题，谷歌开发了一种名为 Transformer 的新模型，该模型通过并行处理输入，效率更高，并且能产生更准确的结果。


    谷歌通过其翻译应用（Translate）对 RNN 有了深入的了解，该应用支持超过 100 种语言，每天处理超过 1000 亿个单词。^(⁵⁹) 该应用于
    2006 年推出，最初使用机器学习系统。但在 2016 年，谷歌转向深度学习，创建了谷歌神经机器翻译系统。^(⁶⁰) 总而言之，这带来了更高的准确率。^(⁶¹)


    想想谷歌翻译如何帮助医生与说其他语言的患者沟通。根据加州大学旧金山分校（UCSF）发表在《美国医学会内科杂志》上的一项研究，该应用在英语到西班牙语的翻译中准确率达到
    92%。这比过去几年的 60%有所提高。^(⁶²)


    ### 卷积神经网络（CNN）


    直观上，让神经网络中的所有单元都连接起来是有道理的。这在许多应用中效果很好。


    但在某些场景下，这远非最优，例如图像识别。想象一下，如果每个像素都是一个单元，模型会变得多么复杂！它很快就会变得难以管理。还会出现其他复杂情况，比如过拟合。这意味着数据不能反映测试内容，或者模型关注了错误的特征。


    为了解决这些问题，你可以使用卷积神经网络（CNN）。其起源可以追溯到 1998 年，当时扬·勒昆教授发表了一篇题为《基于梯度学习的文档识别应用》的论文。^(⁶³)
    尽管其见解深刻且具有突破性，但并未获得太多关注。然而，随着深度学习在 2012 年开始展现出显著进展，研究人员重新审视了这个模型。


    勒昆从诺贝尔奖得主大卫·休伯尔和托斯坦·维厄瑟尔那里获得了 CNN 的灵感，他们研究视觉皮层的神经元。该系统从视网膜获取图像，并在不同阶段进行处理——从简单到复杂。每个阶段称为一个卷积。例如，第一级是识别线条和角度；接下来，视觉皮层会找到形状；然后检测物体。


    这与基于计算机的 CNN 的工作方式类似。让我们举个例子：假设你想构建一个能够识别字母的模型。CNN 的输入形式是一张包含 3072 个像素的图像。每个像素都有一个从
    0 到 255 的值，表示整体强度。通过使用 CNN，计算机将经历多次变化来识别特征。


    首先是卷积层，它是一个扫描图像的滤波器。在我们的例子中，这可能是 5×5 像素。这个过程会创建一个特征图，它是一个长长的数字数组。接下来，模型会对图像应用更多滤波器。通过这样做，CNN
    将识别线条、边缘和形状——所有这些都用数字表示。利用各种输出层，模型将使用池化，将它们组合起来生成单个输出，然后创建一个全连接神经网络。


    CNN 确实可能变得复杂。但它应该能够准确地识别输入到系统中的数字。

    '
- fmt: '# Generative Adversarial Networks (GANs)


    Ian Goodfellow, who got his masters in computer science at Stanford and his PhD
    in machine learning at the Université de Montréal, would go on to work at Google.
    In his 20s, he co-authored one of the top books in AI, called *Deep Learning*,^([^(64)](#fn64))
    and also made innovations with Google Maps.


    But it was in 2014 that he had his most impactful breakthrough. It actually happened
    in a pub in Montreal when he talked with some of his friends about how deep learning
    could *create* photos.^([^(65)](#fn65)) At the time, the approach was to use generative
    models, but they were often blurry and nonsensical.


    Goodfellow realized that there had to be a better way. So why not use game theory?
    That is, have two models compete against each other in a tight feedback loop.
    This could also be done with unlabeled data.


    Here’s a basic workflow:


    - *Generator*: This neural network creates a myriad of new creations, such as
    photos or sentences.

    - *Discriminator*: This neural network looks at the creations to see which ones
    are real.

    - *Adjustments*: With the two results, a new model would change the creations
    to make them as realistic as possible. Through many iterations, the discriminator
    will no longer need to be used.


    He was so excited about the idea that after he left the pub he started to code
    his ideas. The result was a new deep learning model: the generative adversarial
    network or GAN. And the results were standout. He would soon become an AI rock
    star.


    GAN research has already spurred over 500 academic papers.^([^(66)](#fn66)) Companies
    like Facebook have also used this technology, such as for its photo analysis and
    processing. The company’s chief AI scientist, Yann LeCun, noted that GANs are
    the “the coolest idea in deep learning in the last 20 years.”^([^(67)](#fn67))


    GANs have also been shown to help with sophisticated scientific research. For
    example, they have helped improve the accuracy of detecting behavior of subatomic
    particles in the Large Hadron Collider at CERN in Switzerland.^([^(68)](#fn68))


    While still in the early innings, this technology could lead to such things as
    a computer that can develop new types of fashion items or maybe a new-fangled
    wearable. Perhaps a GAN could even come up with a hit rap song.


    And it could be sooner than you think. As a teenager, Robbie Barrat taught himself
    how to use deep learning systems and built a model to rap in the style of Kanye
    West.


    But this was just the beginning of his AI wizardry. As a researcher at Stanford,
    he developed his own GAN platform, which processed roughly 10,000 nude portraits.
    The system then would create truly mesmerizing new works of art (you can find
    them at his Twitter account at `@DrBeef_`).


    Oh, and he also made his system open source at his GitHub account. This caught
    the attention of a collective of French artists, called Obvious, that used the
    technology to create portraits of an eighteenth-century fictional family. It was
    based on processing 15,000 portraits from the fourteenth to the twentieth centuries.


    In 2018, Obvious put its artwork at a Christie’s auction, fetching a cool $432,000.^([^(69)](#fn69))


    But unfortunately, when it comes to GANs, there have been uses that have been
    less than admirable. One example is to use them for deepfakes, which involve leveraging
    neural networks to create images or videos that are misleading. Some of this is
    just kind of playful. For example, one GAN makes it possible to have Barack Obama
    say anything you tell him!


    Yet there are lots of risks. Researchers at New York University and the Michigan
    State University wrote a paper that focused on “DeepMasterPrints.”^([^(70)](#fn70))
    It showed how a GAN can develop fake fingerprints to unlock three types of smartphones!


    Then there was the incident of a so-called deepfake video of actress Jennifer
    Lawrence at a Golden Globes press conference. Her face was merged with Steve Buscemi’s.^([^(71)](#fn71))


    ## Deep Learning Applications


    With so much money and resources being devoted to deep learning, there has been
    a surge in innovations. It seems that every day there is something amazing that
    is being announced.


    Then what are some of the applications? Where has deep learning proven to be a
    game changer? Let’s take a look at some that cover areas like healthcare, energy,
    and even earthquakes.


    ### Use Case: Detecting Alzheimer’s Disease


    Despite decades of research, a cure for Alzheimer’s disease remains elusive. Although,
    scientists have developed drugs that have slowed down the progression of the disease.


    In light of this, early diagnosis is critical—and deep learning can potentially
    be a big help. Researchers at the UCSF Department of Radiology and Biomedical
    Imaging have used this technology to analyze brain screens—from the Alzheimer’s
    Disease Neuroimaging Initiative public dataset—and to detect changes in the levels
    of glucose.


    The result: The model can diagnose Alzheimer’s disease up to six years before
    a clinical diagnosis. One of the tests showed a 92% accuracy rate, and another
    was 98%.


    Now this is still in the beginning phases—and there will need to be more datasets
    analyzed. But so far, the results are very encouraging.


    According to Dr. Jae Ho Sohn, who authored the study:


    > This is an ideal application of deep learning because it is particularly strong
    at finding very subtle but diffuse processes. Human radiologists are really strong
    at identifying tiny focal finding like a brain tumor, but we struggle at detecting
    more slow, global changes. Given the strength of deep learning in this type of
    application, especially compared to humans, it seemed like a natural application.^([^(72)](#fn72))


    ### Use Case: Energy


    Because of its massive data center infrastructure, Google is one of the largest
    consumers of energy. Even a small improvement in efficiency can lead to a sizeable
    impact on the bottom line. But there could also be the benefits of less carbon
    emissions.


    To help with these goals, Google’s DeepMind unit has been applying deep learning,
    which has involved better management of wind power. Even though this is a clean
    source of energy, it can be tough to use because of the changes in weather.


    But DeepMind’s deep learning algorithms have been critical. Applied to 700 megawatts
    of wind power in the United States, they were able to make accurate forecasts
    for output with a lead time of 36 hours.


    According to DeepMind’s blog:


    > This is important, because energy sources that can be scheduled (i.e. can deliver
    a set amount of electricity at a set time) are often more valuable to the grid…To
    date, machine learning has boosted the value of our wind energy by roughly 20
    percent, compared to the baseline scenario of no time-based commitments to the
    grid.^([^(73)](#fn73))


    But of course, this deep learning system could be more than just about Google—it
    could have a wide-ranging impact on energy use across the world.'
