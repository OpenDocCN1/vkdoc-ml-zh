    # 1. AI Foundations


    History Lessons


    > *Artificial intelligence would be the ultimate version of* *Google* *. The ultimate
    search engine that would understand everything on the web. It would understand
    exactly what you wanted, and it would give you the right thing. We’re nowhere
    near doing that now. However, we can get incrementally closer to that, and that
    is basically what we work on.*

    >

    > —Larry Page, the co-founder of Google Inc. and CEO of Alphabet^([⁴](#fn4))


    In Fredric Brown’s 1954 short story, “Answer,” all of the computers across the
    96 billion planets in the universe were connected into one super machine. It was
    then asked, “Is there a God?” to which it answered, “Yes, *now* there is a God.”


    No doubt, Brown’s story was certainly clever—as well as a bit comical and chilling!
    Science fiction has been a way for us to understand the implications of new technologies,
    and artificial intelligence (AI) has been a major theme. Some of the most memorable
    characters in science fiction involve androids or computers that become self-aware,
    such as in *Terminator*, *Blade Runner*, *2001: A Space Odyssey*, and even *Frankenstein*.


    But with the relentless pace of new technologies and innovation nowadays, science
    fiction is starting to become real. We can now talk to our smartphones and get
    answers; our social media accounts provide us with the content we’re interested
    in; our banking apps provide us with reminders; and on and on. This personalized
    content creation almost seems magical but is quickly becoming normal in our everyday
    lives.


    To understand AI, it’s important to have a grounding in its rich history. You’ll
    see how the development of this industry has been full of breakthroughs and setbacks.
    There is also a cast of brilliant researchers and academics, like Alan Turing,
    John McCarthy, Marvin Minsky, and Geoffrey Hinton, who pushed the boundaries of
    the technology. But through it all, there was constant progress.


    Let’s get started.


    ## Alan Turing and the Turing Test


    Alan Turing is a towering figure in computer science and AI. He is often called
    the “father of AI.”


    In 1936, he wrote a paper called “On Computable Numbers.” In it, he set forth
    the core concepts of a computer, which became known as the `Turing machine`. Keep
    in mind that real computers would not be developed until more than a decade later.


    Yet it was his paper, called “Computing Machinery and Intelligence,” that would
    become historic for AI. He focused on the concept of a machine that was intelligent.
    But in order to do this, there had to be a way to measure it. What is intelligence—at
    least for a machine?


    This is where he came up with the famous “Turing Test.” It is essentially a game
    with three players: two that are human and one that is a computer. The evaluator,
    a human, asks open-ended questions of the other two (one human, one computer)
    with the goal of determining which one is the human. If the evaluator cannot make
    a determination, then it is presumed that the computer is intelligent. Figure
    [1-1](#480660_1_En_1_Chapter.xhtml#Fig1) shows the basic workflow of the Turing
    Test.


    ![../images/480660_1_En_1_Chapter/480660_1_En_1_Fig1_HTML.jpg](images/480660_1_En_1_Chapter/480660_1_En_1_Fig1_HTML.jpg)


    Figure 1-1. The basic workflow of the Turing Test


    The genius of this concept is that there is no need to see if the machine actually
    knows something, is self-aware, or even if it is correct. Rather, the Turing Test
    indicates that a machine can process large amounts of information, interpret speech,
    and communicate with humans.


    Turing believed that it would actually not be until about the turn of the century
    that a machine would pass his test. Yes, this was one of many predictions of AI
    that would come up short.


    So how has the Turing Test held up over the years? Well, it has proven to be difficult
    to crack. Keep in mind that there are contests, such as the Loebner Prize and
    the Turing Test Competition, to encourage people to create intelligent software
    systems.


    In 2014, there was a case where it did look like the Turing Test was passed. It
    involved a computer that said it was 13 years old.^([⁵](#fn5)) Interestingly enough,
    the human judges likely were fooled because some of the answers had errors.


    Then in May 2018 at Google’s I/O conference, CEO Sundar Pichai gave a standout
    demo of `Google Assistant`.^([⁶](#fn6)) Before a live audience, he used the device
    to call a local hairdresser to make an appointment. The person on the other end
    of the line acted as if she was talking to a person!


    Amazing, right? Definitely. Yet it still probably did not pass the Turing Test.
    The reason is that the conversation was focused on one topic—not open ended.


    As should be no surprise, there has been ongoing controversy with the Turing Test,
    as some people think it can be manipulated. In 1980, philosopher John Searle wrote
    a famous paper, entitled “Minds, Brains, and Programs,” where he set up his own
    thought experiment, called the “Chinese room argument” to highlight the flaws.


    Here’s how it worked: Let’s say John is in a room and does not understand the
    Chinese language. However, he does have manuals that provide easy-to-use rules
    to translate it. Outside the room is Jan, who does understand the language and
    submits characters to John. After some time, she will then get an accurate translation
    from John. As such, it’s reasonable to assume that Jan believes that John can
    speak Chinese.


    Searle’s conclusion:


    > The point of the argument is this: if the man in the room does not understand
    Chinese on the basis of implementing the appropriate program for understanding
    Chinese then neither does any other digital computer solely on that basis because
    no computer, qua computer, has anything the man does not have.^([⁷](#fn7))


    It was a pretty good argument—and has been a hot topic of debate in AI circles
    since.


    Searle also believed there were two forms of AI:'
