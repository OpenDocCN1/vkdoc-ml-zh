  trans: '

    ### 第三步——数据准备


    数据准备过程的第一步是决定使用哪些数据集。


    让我们来看一个场景：假设你在一家出版公司工作，想要制定一项提高客户留存率的策略。一些可能有帮助的数据包括客户群的人口统计信息，如年龄、性别、收入和受教育程度。为了提供更多细节，你还可以查看浏览器信息。客户对什么类型的内容感兴趣？访问频率和时长如何？是否有其他有趣的模式——比如在周末访问信息？通过整合这些信息来源，你可以构建一个强大的模型。例如，如果某些领域的活动量下降，可能预示着取消订阅的风险。这将提醒销售人员主动联系客户。


    虽然这是一个明智的过程，但仍然存在隐患。即使只包含或排除一个变量，也可能对人工智能模型产生显著的负面影响。要了解原因，可以回顾一下金融危机。当时用于承销抵押贷款的模型非常复杂，并且基于海量数据。在正常经济时期，这些模型运行得相当好，高盛、摩根大通和美国国际集团等大型金融机构都严重依赖它们。


    但有一个问题：这些模型没有考虑到房价下跌！主要原因是——几十年来——从未出现过全国性的房价下跌。当时的假设是，房价主要是一种局部现象。


    当然，房价不仅仅是下跌——而是暴跌。事实证明，这些模型与实际情况相去甚远，数十亿美元的损失几乎摧毁了美国的金融体系。联邦政府别无选择，只能提供 7000 亿美元贷款用于救助华尔街。


    诚然，这是一个极端的案例。但它确实凸显了数据选择的重要性。这正是拥有一个由领域专家和数据科学家组成的坚实团队至关重要的地方。


    接下来，在数据准备阶段，需要进行数据清洗。事实上，所有数据都存在缺陷。即使是像 Facebook 这样的公司，其数据集中也存在空白、歧义和异常值。这是不可避免的。


    因此，以下是一些你可以用来清洗数据的操作：


    *   *去重*：设置测试来识别任何重复项，并删除多余的数据。

    *   *异常值*：这是指远远超出其余大部分数据范围的数据。这可能表明该信息没有帮助。但当然，在某些情况下，情况恰恰相反，例如用于欺诈检测。

    *   *一致性*：确保你对变量有清晰的定义。即使是像“收入”或“客户”这样的术语也可能有多种含义。

    *   *验证规则*：在查看数据时，尝试找出其固有的局限性。例如，你可以为年龄列设置一个标记。如果在许多情况下年龄超过 120，那么数据存在严重问题。

    *   *分箱*：某些数据可能不需要那么具体。一个人是 35 岁还是 37 岁真的重要吗？可能不重要。但比较 30-40 岁和 41-50 岁的人群可能就有意义了。

    *   *时效性*：数据是否及时和相关？

    *   *合并*：在某些情况下，数据列可能包含非常相似的信息。也许一列是以英寸为单位的高度，另一列是以英尺为单位。如果你的模型不需要更精确的数字，你可以只使用英尺那一列。

    *   *独热编码*：这是一种将分类数据替换为数字的方法。例如：假设我们有一个数据库，其中一列有三个可能的值：苹果、菠萝和橙子。你可以将苹果表示为 1，菠萝表示为
    2，橙子表示为 3。听起来很合理，对吧？也许并非如此。问题在于，人工智能算法可能会认为橙子大于苹果。但使用独热编码，你可以避免这个问题。你将创建三个新列：is_Apple、is_Pineapple
    和 is_Orange。对于数据中的每一行，你将在水果存在的那一列填入 1，其余列填入 0。

    *   *转换表*：当你需要将数据从一种标准转换为另一种标准时，可以使用此方法。例如，如果你有十进制系统的数据，并希望转换为公制系统。


    这些步骤将大大有助于提高数据质量。还有一些自动化工具可以提供帮助，例如来自 SAS、Oracle、IBM、Lavastorm Analytics 和 Talend
    等公司的工具。此外，还有开源项目，如 OpenRefine、plyr 和 reshape2。


    无论如何，数据都不会是完美的。没有哪个数据源是完美的。很可能仍然存在空白和不准确之处。


    这就是为什么你需要有创造力。看看 BlueVine 首席执行官 Eyal Lifshitz 的做法。他的公司利用人工智能为小企业提供融资。“我们的数据来源之一是我们客户的信用信息，”他说。“但我们发现，小企业主会错误地识别他们的业务类型。这可能对我们的承销产生不良结果。为了解决这个问题，我们使用人工智能算法从客户网站上抓取数据，这有助于识别行业。”^(³⁰)


    数据清洗方法还将取决于人工智能项目的用例。例如，如果你正在为制造业构建一个预测性维护系统，挑战将在于处理来自不同传感器的巨大差异。结果是，大量数据可能价值不大，并且主要是噪声。

    '
- fmt: '# Ethics and Governance


    You need to be mindful of any restrictions on the data. Might the vendor prohibit
    you from using the information for certain purposes? Perhaps your company will
    be on the hook if something goes wrong? To deal with these issues, it is advisable
    to have the legal department brought in.


    For the most part, data must be treated with care. After all, there are many high-profile
    cases where companies have violated privacy. A prominent example of this is Facebook.
    One of the company’s partners, Cambridge Analytica, accessed millions of data
    points from profiles without the permission of users. When a whistleblower uncovered
    this, Facebook stock plunged—losing more than $100 billion in value. The company
    also came under pressure from the US and European governments.^([^(31)](#fn31))


    Something else to be wary of is scraping data from public sources. True, this
    is often an efficient way to create large datasets. There are also many tools
    that can automate the process. But scraping could expose your company to legal
    liability as the data may be subject to copyrights or privacy laws.


    There are also some precautions that may ironically have inherent flaws. For example,
    a recent study from MIT shows that anonymized data may not be very anonymized.
    The researchers found that it was actually quite easy to reconstruct this type
    of data and identify the individuals—such as by merging two datasets. This was
    done by using data in Singapore from a mobile network (GPS tracking) and a local
    transportation system. After about 11 weeks of analysis, the researchers were
    able to identify 95% of the individuals.^([^(32)](#fn32))


    Finally, make sure you take steps to secure the data. The instances of cyberattacks
    and threats continue to increase at an alarming rate. In 2018, there were 53,000+
    incidents and about 2,200 breaches, according to Verizon.^([^(33)](#fn33)) The
    report also noted the following:


    - 76% of the breaches were financially motivated.

    - 73% were from those outside the company.

    - About half came from organized criminal groups and 12% from nation-state or
    state-affiliated actors.


    The increasing use of cloud and on-premise data can subject a company to gaps
    in security as well. Then there is the mobile workforce, which can mean access
    to data that could expose it to breaches.


    The attacks are also getting much more damaging. The result is that a company
    can easily suffer penalties, lawsuits, and reputational damage.


    Basically, when putting together an AI project, make sure there is a security
    plan and that it is followed.


    # How Much Data Do You Need for AI?


    The more data, the better, right? This is usually the case. Look at something
    called Hughes Phenomenon. This posits that as you add features to a model, the
    performance generally increases.


    But quantity is not the end-all, be-all. There may come a point where the data
    starts to degrade. Keep in mind that you may run into something called the curse
    of dimensionality. According to Charles Isbell, who is the professor and senior
    associate dean of the School of Interactive Computing at Georgia Tech, “As the
    number of features or dimensions grows, the amount of data we need to generalize
    accurately grows exponentially.”^([^(34)](#fn34))


    What is the practical impact? It could make it impossible to have a good model
    since there may not be enough data. This is why that when it comes to applications
    like vision recognition, the curse of dimensionality can be quite problematic.
    Even when analyzing RGB images, the number of dimensions is roughly 7,500. Just
    imagine how intensive the process would be using real-time, high-definition video.


    # More Data Terms and Concepts


    When engaging in data analysis, you should know the basic terms. Here are some
    that you’ll often hear:


    - **Categorical Data**: This is data that does not have a numerical meaning. Rather,
    it has a textual meaning like a description of a group (race and gender). Although,
    you can assign numbers to each of the elements.

    - **Data Type**: This is the kind of information a variable represents, such as
    a Boolean, integer, string, or floating point number.

    - **Descriptive Analytics**: This is analyzing data to get a better understanding
    of the current status of a business. Some examples of this include measuring what
    products are selling better or determining risks in customer support. There are
    many traditional software tools for descriptive analytics, such as BI applications.

    - **Diagnostic Analytics**: This is querying data to see why something has happened.
    This type of analytics uses techniques like data mining, decision trees, and correlations.

    - **ETL (Extraction, Transformation, and Load)**: This is a form of data integration
    and is typically used in a data warehouse.

    - **Feature**: This is a column of data.

    - **Instance**: This is a row of data.

    - **Metadata**: This is data about data—that is, descriptions. For example, a
    music file can have metadata like the size, length, date of upload, comments,
    genre, artist, and so on. This type of data can wind up being quite useful for
    an AI project.

    - **Numerical Data**: This is any data that can be represented by a number. But
    numerical data can have two forms. There is discrete data, which is an integer—that
    is, a number without a decimal point. Then there is continuous data that has a
    flow, say temperature or time.

    - **OLAP (Online Analytical Processing)**: This is technology that allows you
    to analyze information from various databases.

    - **Ordinal Data**: This is a mix of numerical and categorical data. A common
    example of this is the five-star rating on Amazon.com. It has both a star and
    a number associated with it.

    - **Predictive Analytics**: This involves using data to make forecasts. The models
    for this are usually sophisticated and rely on AI approaches like machine learning.
    To be effective, it is important to update the underlying model with new data.
    Some of the tools for predictive analytics include machine learning approaches
    like regressions.

    - **Prescriptive Analytics**: This is about leveraging Big Data to make better
    decisions. This is not only focused on predicting outcomes—but understanding the
    rationales. And this is where AI plays a big part.

    - **Scalar Variables**: These are variables that hold single values like name
    or credit card number.

    - **Transactional Data**: This is data that is recorded on financial, business,
    and logistical actions. Examples include payments, invoices, and insurance claims.


    # Conclusion


    Being successful with AI means having a data-driven culture. This is what has
    been critical for companies like Amazon.com, Google, and Facebook. When making
    decisions, they look to the data first. There should also be wide availability
    of data across the organization.


    Without this approach, success with AI will be fleeting, regardless of your planning.
    Perhaps this helps explain that—according to a study from NewVantage Partners—about
    77% of respondents say that “business adoption” of Big Data and AI remain challenges.^([^(35)](#fn35))'
  raw: '## Ethics and Governance


    You need to be mindful of any restrictions on the data. Might the vendor prohibit
    you from using the information for certain purposes? Perhaps your company will
    be on the hook if something goes wrong? To deal with these issues, it is advisable
    to have the legal department brought in.


    For the most part, data must be treated with care. After all, there are many high-profile
    cases where companies have violated privacy. A prominent example of this is Facebook.
    One of the company’s partners, Cambridge Analytica, accessed millions of data
    points from profiles without the permission of users. When a whistleblower uncovered
    this, Facebook stock plunged—losing more than $100 billion in value. The company
    also came under pressure from the US and European governments.^([^(31)](#fn31))


    Something else to be wary of is scraping data from public sources. True, this
    is often an efficient way to create large datasets. There are also many tools
    that can automate the process. But scraping could expose your company to legal
    liability as the data may be subject to copyrights or privacy laws.


    There are also some precautions that may ironically have inherent flaws. For example,
    a recent study from MIT shows that anonymized data may not be very anonymized.
    The researchers found that it was actually quite easy to reconstruct this type
    of data and identify the individuals—such as by merging two datasets. This was
    done by using data in Singapore from a mobile network (GPS tracking) and a local
    transportation system. After about 11 weeks of analysis, the researchers were
    able to identify 95% of the individuals.^([^(32)](#fn32))


    Finally, make sure you take steps to secure the data. The instances of cyberattacks
    and threats continue to increase at an alarming rate. In 2018, there were 53,000+
    incidents and about 2,200 breaches, according to Verizon.^([^(33)](#fn33)) The
    report also noted the following:


    *   76% of the breaches were financially motivated.


    *   73% were from those outside the company.


    *   About half came from organized criminal groups and 12% from nation-state or
    state-affiliated actors.


    The increasing use of cloud and on-premise data can subject a company to gaps
    in security as well. Then there is the mobile workforce, which can mean access
    to data that could expose it to breaches.


    The attacks are also getting much more damaging. The result is that a company
    can easily suffer penalties, lawsuits, and reputational damage.


    Basically, when putting together an AI project, make sure there is a security
    plan and that it is followed.


    ## How Much Data Do You Need for AI?


    The more data, the better, right? This is usually the case. Look at something
    called Hughes Phenomenon. This posits that as you add features to a model, the
    performance generally increases.


    But quantity is not the end-all, be-all. There may come a point where the data
    starts to degrade. Keep in mind that you may run into something called the curse
    of dimensionality. According to Charles Isbell, who is the professor and senior
    associate dean of the School of Interactive Computing at Georgia Tech, “As the
    number of features or dimensions grows, the amount of data we need to generalize
    accurately grows exponentially.”^([^(34)](#fn34))


    What is the practical impact? It could make it impossible to have a good model
    since there may not be enough data. This is why that when it comes to applications
    like vision recognition, the curse of dimensionality can be quite problematic.
    Even when analyzing RGB images, the number of dimensions is roughly 7,500\. Just
    imagine how intensive the process would be using real-time, high-definition video.


    ## More Data Terms and Concepts


    When engaging in data analysis, you should know the basic terms. Here are some
    that you’ll often hear:


    *Categorical Data*: This is data that does not have a numerical meaning. Rather,
    it has a textual meaning like a description of a group (race and gender). Although,
    you can assign numbers to each of the elements.


    *Data Type*: This is the kind of information a variable represents, such as a
    Boolean, integer, string, or floating point number.


    *Descriptive Analytics*: This is analyzing data to get a better understanding
    of the current status of a business. Some examples of this include measuring what
    products are selling better or determining risks in customer support. There are
    many traditional software tools for descriptive analytics, such as BI applications.


    *Diagnostic Analytics*: This is querying data to see why something has happened.
    This type of analytics uses techniques like data mining, decision trees, and correlations.


    *ETL (Extraction, Transformation, and Load)*: This is a form of data integration
    and is typically used in a data warehouse.


    *Feature*: This is a column of data.


    *Instance*: This is a row of data.


    *Metadata*: This is data about data—that is, descriptions. For example, a music
    file can have metadata like the size, length, date of upload, comments, genre,
    artist, and so on. This type of data can wind up being quite useful for an AI
    project.


    *Numerical Data*: This is any data that can be represented by a number. But numerical
    data can have two forms. There is discrete data, which is an integer—that is,
    a number without a decimal point. Then there is continuous data that has a flow,
    say temperature or time.


    *OLAP (Online Analytical Processing*): This is technology that allows you to analyze
    information from various databases.


    *Ordinal Data*: This is a mix of numerical and categorical data. A common example
    of this is the five-star rating on Amazon.com. It has both a star and a number
    associated with it.


    *Predictive Analytics*: This involves using data to make forecasts. The models
    for this are usually sophisticated and rely on AI approaches like machine learning.
    To be effective, it is important to update the underlying model with new data.
    Some of the tools for predictive analytics include machine learning approaches
    like regressions.


    *Prescriptive Analytics*: This is about leveraging Big Data to make better decisions.
    This is not only focued on predicting outcomes—but understanding the rationales.
    And this is where AI plays a big part.


    *Scalar Variables*: These are variables that hold single values like name or credit
    card number.


    *Transactional Data*: This is data that is recorded on financial, business, and
    logistical actions. Examples include payments, invoices, and insurance claims.


    ## Conclusion


    Being successful with AI means having a data-driven culture. This is what has
    been critical for companies like Amazon.com, Google, and Facebook. When making
    decisions, they look to the data first. There should also be wide availability
    of data across the organization.


    Without this approach, success with AI will be fleeting, regardless of your planning.
    Perhaps this helps explain that—according to a study from NewVantage Partners—about
    77% of respondents say that “business adoption” of Big Data and AI remain challenges.^([^(35)](#fn35))'
  trans: '

    ## 伦理与治理


    你需要留意数据可能存在的任何限制。供应商是否会禁止你将信息用于某些目的？如果出现问题，你的公司是否需要承担责任？为了处理这些问题，建议让法务部门介入。


    在大多数情况下，数据必须谨慎处理。毕竟，有许多知名案例涉及公司侵犯隐私。一个突出的例子是 Facebook。该公司的合作伙伴之一剑桥分析公司在未经用户许可的情况下，从用户资料中获取了数百万个数据点。当一名举报人揭露此事后，Facebook
    股价暴跌，市值损失超过 1000 亿美元。该公司还面临来自美国和欧洲政府的压力。^(³¹)


    另一件需要警惕的事情是从公共来源抓取数据。诚然，这通常是创建大型数据集的有效方法。也有很多工具可以自动化这一过程。但抓取数据可能会使你的公司面临法律责任，因为这些数据可能受版权或隐私法保护。


    还有一些预防措施可能具有讽刺意味地存在固有缺陷。例如，麻省理工学院最近的一项研究表明，匿名化数据可能并不那么匿名。研究人员发现，实际上很容易重建这类数据并识别出个人身份——例如通过合并两个数据集。他们通过使用新加坡移动网络（GPS
    追踪）和当地交通系统的数据做到了这一点。经过大约 11 周的分析，研究人员能够识别出 95%的个人。^(³²)


    最后，确保你采取措施保护数据安全。网络攻击和威胁事件的数量正以惊人的速度持续增长。根据威瑞森公司的数据，2018 年发生了超过 5.3 万起安全事件和约 2200
    起数据泄露。^(³³) 该报告还指出：


    *   76%的数据泄露是出于经济动机。

    *   73%来自公司外部人员。

    *   约一半来自有组织的犯罪集团，12%来自国家或国家附属行为者。


    云服务和本地数据使用量的增加也可能使公司面临安全漏洞。此外，还有移动办公人员，这意味着对数据的访问可能使其暴露于泄露风险之中。


    攻击造成的破坏性也越来越大。其结果是，公司很容易遭受处罚、诉讼和声誉损害。


    基本上，在组建人工智能项目时，要确保制定并遵守安全计划。


    ## 人工智能需要多少数据？


    数据越多越好，对吗？通常情况确实如此。看看所谓的休斯现象。该理论认为，随着你向模型添加特征，性能通常会提高。


    但数量并非决定一切。可能会有一个临界点，数据开始导致性能下降。请记住，你可能会遇到所谓的维度灾难。据佐治亚理工学院交互计算学院教授兼高级副院长查尔斯·伊斯贝尔称，“随着特征或维度的数量增长，我们进行准确泛化所需的数据量呈指数级增长。”^(³⁴)


    实际影响是什么？由于可能没有足够的数据，这可能导致无法构建一个好的模型。这就是为什么在视觉识别等应用中，维度灾难可能相当成问题。即使分析 RGB 图像，维度数量也大约为
    7500。想象一下，使用实时高清视频进行处理的过程会有多么密集。


    ## 更多数据术语与概念


    在进行数据分析时，你应该了解基本术语。以下是一些你经常会听到的术语：


    *分类数据*：这是没有数值意义的数据。相反，它具有文本意义，例如对某个群体（种族和性别）的描述。不过，你可以为每个元素分配数字。


    *数据类型*：这是变量所代表的信息种类，例如布尔值、整数、字符串或浮点数。


    *描述性分析*：这是通过分析数据来更好地了解业务的当前状态。一些例子包括衡量哪些产品卖得更好，或确定客户支持中的风险。有许多用于描述性分析的传统软件工具，例如商业智能应用。


    *诊断性分析*：这是通过查询数据来了解某事发生的原因。这类分析使用数据挖掘、决策树和相关性等技术。


    *ETL（提取、转换、加载）*：这是一种数据集成形式，通常用于数据仓库。


    *特征*：这是数据的一列。


    *实例*：这是数据的一行。


    *元数据*：这是关于数据的数据——即描述信息。例如，一个音乐文件可以包含大小、时长、上传日期、评论、流派、艺术家等元数据。这类数据最终可能对人工智能项目非常有用。


    *数值数据*：这是任何可以用数字表示的数据。但数值数据有两种形式。有离散数据，即整数——也就是不带小数点的数字。还有连续数据，它具有连续性，例如温度或时间。


    *OLAP（联机分析处理）*：这是一种允许你分析来自多个数据库信息的技术。


    *序数数据*：这是数值数据和分类数据的混合。一个常见的例子是亚马逊网站上的五星评级。它既包含星级，也关联着一个数字。


    *预测性分析*：这涉及使用数据进行预测。用于此的模型通常很复杂，并依赖于机器学习等人工智能方法。为了有效，用新数据更新底层模型非常重要。一些用于预测性分析的工具包括回归等机器学习方法。


    *规范性分析*：这是关于利用大数据做出更好的决策。它不仅关注预测结果，还理解其背后的逻辑。这正是人工智能发挥重要作用的地方。


    *标量变量*：这些是保存单个值的变量，例如姓名或信用卡号。


    *事务数据*：这是记录在财务、业务和物流活动上的数据。例如付款、发票和保险索赔。


    ## 结论


    在人工智能方面取得成功意味着要拥有数据驱动的文化。这对于亚马逊、谷歌和 Facebook 等公司至关重要。在做决策时，他们首先会查看数据。数据还应在整个组织中广泛可用。


    如果没有这种方法，无论你的计划如何，在人工智能方面取得的成功都将是短暂的。这或许有助于解释——根据 NewVantage Partners 的一项研究——约
    77%的受访者表示，“业务采用”大数据和人工智能仍然是挑战。^(³⁵)

