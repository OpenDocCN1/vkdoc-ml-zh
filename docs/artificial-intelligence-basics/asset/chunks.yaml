  trans: '

    #### 词形还原


    词形还原与词干提取类似，但重点在于寻找相似的词根，而非去除词缀或前缀。例如，“better”一词，我们可以将其还原为“good”。只要核心意义基本保持不变，这种方法就有效。在我们的例子中，两者大致相似，但“good”的含义更清晰。词形还原还有助于提供更好的搜索或语言理解，尤其是在翻译中。


    图 6-3 展示了词形还原的一个示例。


    ![../images/480660_1_En_6_Chapter/480660_1_En_6_Fig3_HTML.jpg](img/480660_1_En_6_Fig3_HTML.jpg)


    图 6-3.


    词形还原示例


    要有效使用词形还原，NLP 系统必须理解单词的含义和上下文。换句话说，这个过程通常比词干提取性能更好。另一方面，这也意味着算法更复杂，并且需要更高的计算能力。


    ### 第二步——理解与生成语言


    一旦文本被转换成计算机可以处理的格式，NLP 系统就必须理解整体含义。在大多数情况下，这是最困难的部分。


    但多年来，研究人员开发了大量技术来提供帮助，例如：


    *   *词性标注*：遍历文本，将每个单词归类到其正确的语法形式中，例如名词、动词、副词等。可以把它想象成你小学英语课的自动化版本！此外，一些词性标注系统还有变体。请注意，名词包括单数名词（NN）、单数专有名词（NNP）和复数名词（NNS）。


    *   *组块分析*：然后根据短语对单词进行分析。例如，名词短语（NP）是充当动词主语或宾语的名词。


    *   *命名实体识别*：识别代表地点、人物和组织的单词。


    *   *主题建模*：寻找文本中的隐藏模式和聚类。其中一种算法称为潜在狄利克雷分配（LDA），它基于无监督学习方法。也就是说，会随机分配主题，然后计算机进行迭代以寻找匹配项。


    对于许多此类过程，我们可以使用深度学习模型。它们可以扩展到更多的分析领域——以实现无缝的语言理解和生成。这个过程被称为分布式语义学。


    利用我们在第 4 章学到的卷积神经网络（CNN），你可以找到被转换为特征图的单词聚类。这催生了诸如语言翻译、语音识别、情感分析和问答系统等应用。事实上，该模型甚至能够检测讽刺等！


    然而，CNN 也存在一些问题。例如，该模型在处理具有长距离依赖关系的文本时会遇到困难。但有一些方法可以解决这个问题，例如使用延时神经网络（TDNN）和动态卷积神经网络（DCNN）。这些方法在处理序列数据方面表现出高性能。尽管如此，在这方面更为成功的模型是循环神经网络（RNN），因为它能够记忆数据。


    到目前为止，我们主要关注文本分析。但要实现复杂的 NLP，我们还必须构建语音识别系统。我们将在下一节中对此进行探讨。


    ## 语音识别


    1952 年，贝尔实验室创建了第一个语音识别系统，名为 Audrey（自动数字识别）。它能够识别音素，即语言中最基本的语音单位。例如，英语有 44 个音素。


    Audrey 可以识别从 0 到 9 的数字发音。对于机器创造者 HK Davis 的声音，其准确率约为 90%。^(¹⁰⁷) 而对于其他人，准确率则在 70%
    到 80% 左右。


    Audrey 是一项重大成就，尤其是在当时计算能力和内存有限的情况下。但该程序也凸显了语音识别的主要挑战。当我们说话时，句子可能复杂且有些混乱。我们通常也说得很快——平均每分钟
    150 个单词。


    因此，语音识别系统的改进速度极其缓慢。1962 年，IBM 的 Shoebox 系统只能识别 16 个单词、10 个数字和 6 个数学命令。


    直到 20 世纪 80 年代，这项技术才取得了重大进展。关键的突破是使用了基于复杂统计学的隐马尔可夫模型（HMM）。例如，如果你说“dog”这个词，系统会分析
    d、o、g 这三个独立的发音。HMM 算法会为每个发音分配一个分数。随着时间的推移，系统会更好地理解这些发音并将其转化为单词。


    虽然 HMM 至关重要，但它仍然无法有效处理连续语音。例如，语音系统基于模板匹配。这涉及将声波转换为数字，通过采样完成。结果是软件会测量间隔的频率并存储结果。但必须高度匹配。因此，语音输入必须非常清晰且缓慢，背景噪音也必须很小。


    但到了 20 世纪 90 年代，软件开发人员取得了长足进步，并推出了商业系统，例如 Dragon Dictate，它可以理解连续语音中的数千个单词。然而，其应用仍未成为主流。许多人仍然觉得用键盘输入和使用鼠标更方便。但在某些职业中，例如医学（一个流行的用例是转录患者诊断），语音识别得到了广泛应用。


    随着机器学习和深度学习的出现，语音系统迅速变得更加复杂和精确。一些关键算法涉及长短期记忆网络（LSTM）、循环神经网络和深度前馈神经网络。谷歌随后将这些方法应用于
    Google Voice，为数亿智能手机用户提供服务。当然，我们也看到了 Siri、Alexa 和 Cortana 等其他产品的巨大进步。


    ## 现实世界中的 NLP


    总的来说，我们已经了解了 NLP 工作流程的主要部分。接下来，让我们看看这项技术的强大应用。

    '
- fmt: '### Use Case: Improving Sales


    `Roy Raanani`, who has a career in working with tech startups, thought that the
    countless conversions that occur every day in business are mostly ignored. Perhaps
    AI could transform this into an opportunity?


    In 2015, he founded `Chorus` to use NLP to divine insights from conversations
    from sales people. `Raanani` called this the Conversation Cloud, which records,
    organizes, and transcribes calls—which are entered in a CRM (Customer Relationship
    Management) system. Over time, the algorithms will start to learn about best practices
    and indicate how things can be improved.


    But pulling this off has not been easy. According to a `Chorus` blog:


    *   There are billions of ways to ask questions, raise objections, set action
    items, challenge hypotheses, etc. all of which need to be identified if sales
    patterns are to be codified. Second, signals and patterns evolve: new competitors,
    product names and features, and industry-related terminology change over time,
    and machine-learned models quickly become obsolete.^([^(108)](#fn108))


    For example, one of the difficulties—which can be easily overlooked—is how to
    identify the parties who are talking (there are often more than three on a call).
    Known as “speaker separation,” it is considered even more difficult than speech
    recognition. `Chorus` has created a deep learning model that essentially creates
    a “voice fingerprint”—which is based on clustering—for each speaker. So after
    several years of R&D, the company was able to develop a system that could analyze
    large amounts of conversations.


    As a testament to this, look at one of `Chorus`’ customers, `Housecall Pro`, which
    is a startup that sells mobile technologies for field service management. Before
    adopting the software, the company would often create personalized sales pitches
    for each lead. But unfortunately, it was unscalable and had mixed results.


    But with `Chorus`, the company was able to create an approach that did not have
    much variation. The software made it possible to measure every word and the impact
    on the sales conversions. `Chorus` also measured whether a sales rep was on-script
    or not.


    The outcome? The company was able to increase the win rate of the sales organization
    by 10%.^([^(109)](#fn109))


    ### Use Case: Fighting Depression


    Across the world, about 300 million people suffer from depression, according to
    data from the World Health Organization.^([^(110)](#fn110)) About 15% of adults
    will experience some type of depression during their life.


    This may go undiagnosed because of lack of healthcare services, which can mean
    that a person’s situation could get much worse. Unfortunately, the depression
    can lead to other problems.


    But NLP may be able to improve the situation. A recent study from Stanford used
    a machine learning model that processed 3D facial expressions and the spoken language.
    As a result, the system was able to diagnose depression with an average error
    rate of 3.67 when using the Patient Health Questionnaire (PHQ) scale. The accuracy
    was even higher for more aggravated forms of depression.


    In the study, the researchers noted: “This technology could be deployed to cell
    phones worldwide and facilitate low-cost universal access to mental health care.”^([^(111)](#fn111))


    ### Use Case: Content Creation


    In 2015, several tech veterans like `Elon Musk`, `Peter Thiel`, `Reid Hoffman`,
    and `Sam Altman` launched `OpenAI`, with the support of a whopping $1 billion
    in funding. Structured as a nonprofit, the goal was to develop an organization
    with the goal “to advance digital intelligence in the way that is most likely
    to benefit humanity as a whole, unconstrained by a need to generate financial
    return.”^([^(112)](#fn112))


    One of the areas of research has been on NLP. To this end, the company launched
    a model called `GPT-2` in 2019, which was based on a dataset of roughly eight
    million web pages. The focus was to create a system that could predict the next
    word based on a group of text.


    To illustrate this, `OpenAI` provided an experiment with the following text as
    the input: “In a shocking finding, scientist discovered a herd of unicorns living
    in a remote, previously unexplored valley, in the Andes Mountains. Even more surprising
    to the researchers was the fact that the unicorns spoke perfect English.”


    From this, the algorithms created a convincing story that was 377 words in length!


    Granted, the researchers admitted that the storytelling was better for topics
    that related more to the underlying data, on topics like *Lord of the Rings* and
    even Brexit. As should be no surprise, `GPT-2` demonstrated poor performance for
    technical domains.


    But the model was able to score high on several well-known evaluations of reading
    comprehension. See Table [6-1](#480660_1_En_6_Chapter.xhtml#Tab1).^([^(113)](#fn113))


    **Table 6-1.** Reading comprehension results


    | DataSet | Prior Record for Accuracy | GPT-2’s Accuracy |

    | --- | --- | --- |

    | Winograd Schema Challenge | 63.7% | 70.70% |

    | LAMBADA | 59.23% | 63.24% |

    | Children’s Book Test Common Nouns | 85.7% | 93.30% |

    | Children’s Book Test Named Entities | 82.3% | 89.05% |


    Even though a typical human would score 90%+ on these tests, the performance of
    `GPT-2` is still impressive. It’s important to note that the model used Google’s
    neural network innovation, called a Transformer, and unsupervised learning.


    In keeping with `OpenAI`’s mission, the organization decided not to release the
    complete model. The fear was that it could lead to adverse consequences like fake
    news, spoofed `Amazon.com` reviews, spam, and phishing scams.'
