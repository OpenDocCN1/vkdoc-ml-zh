- fmt: '# The Weaponization of AI


    The Air Force Research Lab is working on prototypes for something called `Skyborg`.
    It’s right out of *Star Wars*. Think of `Skyborg` as R2-D2 that serves as an AI
    wingman for a fighter jet, helping to identify targets and threats.^([^(212)](#fn212))
    The AI robot may also be able to take control if the pilot is incapacitated or
    distracted. The Air Force is even looking at using the technology to operate drones.


    Cool, huh? Certainly. But there is a major issue: By using AI, might humans ultimately
    be taken out of the loop when making life-and-death decisions on the battlefield?
    Could this ultimately lead to more bloodshed? Perhaps the machines will make the
    wrong decisions—causing even more problems?


    Many AI researchers and entrepreneurs are concerned. To this end, more than 2,400
    have signed a statement that calls for a ban of so-called robot killers.^([^(213)](#fn213))


    Even the United Nations is exploring some type of ban. But the United States,
    along with Australia, Israel, the United Kingdom, and Russia, have resisted this
    move.^([^(214)](#fn214)) As a result, there may be a true AI arms race emerging.


    According to a paper from the RAND Corporation, there is even the potential that
    the technology could lead to nuclear war, say by the year 2040. How? The authors
    note that AI may make it easier to target submarines and mobile missile systems.
    According to the report:


    *   Nations may be tempted to pursue first-strike capabilities as a means of gaining
    bargaining leverage over their rivals even if they have no intention of carrying
    out an attack, researchers say. This undermines strategic stability because even
    if the state possessing these capabilities has no intention of using them, the
    adversary cannot be sure of that.^([^(215)](#fn215))


    But in the near term, AI will probably have the most impact on information warfare,
    which could still be highly destructive. We got a glimpse of this when the Russian
    government interfered with the 2016 presidential election. The approach was fairly
    low-tech as it used social media troll farms to disseminate fake news—but the
    consequences were significant.


    But as AI gets more powerful and becomes more affordable, we’ll likely see it
    supercharge these kinds of campaigns. For example, deepfake systems can easily
    create life-like photos and videos of people that could be used to quickly spread
    messages.


    ## Drug Discovery


    The advances in drug discovery have been almost miraculous as we now have cures
    for such intractable diseases like hepatitis C and have continued to make strides
    with a myriad of cancers. But of course, there is certainly much that needs to
    be done. The fact is that drug companies are having more troubles coming up with
    treatments. Here’s just one example: In March 2019, `Biogen` announced that one
    of its drugs for Alzheimer’s, which was in Phase III trials, failed to show meaningful
    results. On the news, the company’s shares plunged by 29%, wiping out $18 billion
    of market value.^([^(216)](#fn216))


    Consider that traditional drug development often involves much trial and error,
    which can be time consuming. Then might there be a better way?


    Increasingly, researchers are looking to AI for help. We are seeing a variety
    of startups spring up that are focusing on the opportunity.


    One is `Insitro`. The company, which got its start in 2019, had little trouble
    raising a staggering $100 million in its Series A round. Some of the investors
    included `Alexandria Venture Investments`, `Bezos Expeditions` (which is the investment
    firm of Amazon.com’s Jeff Bezos), `Mubadala Investment Company`, `Two Sigma Ventures`,
    and `Verily`.


    Even though the team is relatively small—with about 30 employees—they all are
    brilliant researchers who span areas like data science, deep learning, software
    engineering, bioengineering, and chemistry. The CEO and founder, `Daphne Koller`,
    has the rare blend of experience in advanced computer science and health sciences,
    having led Google’s healthcare business, `Calico`.


    As a testament to `Insitro`’s prowess, the company has already struck a partnership
    with mega drug operator `Gilead`. It involves potential payments of over $1 billion
    for research on nonalcoholic steatohepatitis (NASH), which is a serious liver
    disease.^([^(217)](#fn217)) A key is that `Gilead` has been able to assemble a
    large amount of data, which can train the models. This will be done using cells
    outside of a person’s body—that is, with an in vitro system. `Gilead` has some
    urgency for looking at alternative approaches since one of its NASH treatments,
    `selonsertib`, failed in its clinical trials (it was for those who had the disease
    in the later stages).


    The promise of AI is that it will speed up drug discovery because deep learning
    should be able to identify complex patterns. But the technology could also turn
    out to be helpful in developing personalized treatments—such as geared to a person’s
    genetic make-up—which is likely to be critical for curing certain diseases.


    Regardless, it is probably best to temper expectations. There will be major hurdles
    to deal with as the healthcare industry will need to undergo changes because there
    will be increased education for AI. This will take time, and there will likely
    be resistance.


    Next, deep learning is generally a “black box” when it comes to understanding
    how the algorithms really work. This could prove difficult in getting regulatory
    approval for new drugs as the FDA focuses on causal relationships.


    Finally, the human body is highly sophisticated, and we still are learning about
    how it works. And besides, as we have seen with innovations like the decoding
    of the Human Genome, it usually takes considerable time to understand new approaches.


    As a sign of the complexities, consider the situation of IBM’s `Watson`. Even
    though the company has some of the most talented AI researchers and has spent
    billions on the technology, it recently announced that it would no longer sell
    `Watson` for drug discovery purposes.^([^(218)](#fn218))'
  raw: '## The Weaponization of AI


    The Air Force Research Lab is working on prototypes for something called Skyborg.
    It’s right out of *Star Wars*. Think of Skyborg as R2-D2 that serves as an AI
    wingman for a fighter jet, helping to identify targets and threats.^([^(212)](#fn212))
    The AI robot may also be able to take control if the pilot is incapacitated or
    distracted. The Air Force is even looking at using the technology to operate drones.


    Cool, huh? Certainly. But there is a major issue: By using AI, might humans ultimately
    be taken out of the loop when making life-and-death decisions on the battlefield?
    Could this ultimately lead to more bloodshed? Perhaps the machines will make the
    wrong decisions—causing even more problems?


    Many AI researchers and entrepreneurs are concerned. To this end, more than 2,400
    have signed a statement that calls for a ban of so-called robot killers.^([^(213)](#fn213))


    Even the United Nations is exploring some type of ban. But the United States,
    along with Australia, Israel, the United Kingdom, and Russia, have resisted this
    move.^([^(214)](#fn214)) As a result, there may be a true AI arms race emerging.


    According to a paper from the RAND Corporation, there is even the potential that
    the technology could lead to nuclear war, say by the year 2040\. How? The authors
    note that AI may make it easier to target submarines and mobile missile systems.
    According to the report:


    *   Nations may be tempted to pursue first-strike capabilities as a means of gaining
    bargaining leverage over their rivals even if they have no intention of carrying
    out an attack, researchers say. This undermines strategic stability because even
    if the state possessing these capabilities has no intention of using them, the
    adversary cannot be sure of that.^([^(215)](#fn215))


    But in the near term, AI will probably have the most impact on information warfare,
    which could still be highly destructive. We got a glimpse of this when the Russian
    government interfered with the 2016 presidential election. The approach was fairly
    low-tech as it used social media troll farms to disseminate fake news—but the
    consequences were significant.


    But as AI gets more powerful and becomes more affordable, we’ll likely see it
    supercharge these kinds of campaigns. For example, deepfake systems can easily
    create life-like photos and videos of people that could be used to quickly spread
    messages.


    ## Drug Discovery


    The advances in drug discovery have been almost miraculous as we now have cures
    for such intractable diseases like hepatitis C and have continued to make strides
    with a myriad of cancers. But of course, there is certainly much that needs to
    be done. The fact is that drug companies are having more troubles coming up with
    treatments. Here’s just one example: In March 2019, Biogen announced that one
    of its drugs for Alzheimer’s, which was in Phase III trials, failed to show meaningful
    results. On the news, the company’s shares plunged by 29%, wiping out $18 billion
    of market value.^([^(216)](#fn216))


    Consider that traditional drug development often involves much trial and error,
    which can be time consuming. Then might there be a better way?


    Increasingly, researchers are looking to AI for help. We are seeing a variety
    of startups spring up that are focusing on the opportunity.


    One is Insitro. The company, which got its start in 2019, had little trouble raising
    a staggering $100 million in its Series A round. Some of the investors included
    Alexandria Venture Investments, Bezos Expeditions (which is the investment firm
    of Amazon.com’s Jeff Bezos), Mubadala Investment Company, Two Sigma Ventures,
    and Verily.


    Even though the team is relatively small—with about 30 employees—they all are
    brilliant researchers who span areas like data science, deep learning, software
    engineering, bioengineering, and chemistry. The CEO and founder, Daphne Koller,
    has the rare blend of experience in advanced computer science and health sciences,
    having led Google’s healthcare business, Calico.


    As a testament to Insitro’s prowess, the company has already struck a partnership
    with mega drug operator Gilead. It involves potential payments of over $1 billion
    for research on nonalcoholic steatohepatitis (NASH), which is a serious liver
    disease.^([^(217)](#fn217)) A key is that Gilead has been able to assemble a large
    amount of data, which can train the models. This will be done using cells outside
    of a person’s body—that is, with an in vitro system. Gilead has some urgency for
    looking at alternative approaches since one of its NASH treatments, selonsertib,
    failed in its clinical trials (it was for those who had the disease in the later
    stages).


    The promise of AI is that it will speed up drug discovery because deep learning
    should be able to identify complex patterns. But the technology could also turn
    out to be helpful in developing personalized treatments—such as geared to a person’s
    genetic make-up—which is likely to be critical for curing certain diseases.


    Regardless, it is probably best to temper expectations. There will be major hurdles
    to deal with as the healthcare industry will need to undergo changes because there
    will be increased education for AI. This will take time, and there will likely
    be resistance.


    Next, deep learning is generally a “black box” when it comes to understanding
    how the algorithms really work. This could prove difficult in getting regulatory
    approval for new drugs as the FDA focuses on causal relationships.


    Finally, the human body is highly sophisticated, and we still are learning about
    how it works. And besides, as we have seen with innovations like the decoding
    of the Human Genome, it usually takes considerable time to understand new approaches.


    As a sign of the complexities, consider the situation of IBM’s Watson. Even though
    the company has some of the most talented AI researchers and has spent billions
    on the technology, it recently announced that it would no longer sell Watson for
    drug discovery purposes.^([^(218)](#fn218))'
  trans: '

    ## AI 的武器化


    美国空军研究实验室正在研发一种名为“天堡”（Skyborg）的原型机。这简直就像从《星球大战》里走出来的一样。可以把“天堡”想象成 R2-D2，它充当战斗机的
    AI 僚机，协助识别目标和威胁。^(²¹²) 如果飞行员丧失行动能力或分心，这个 AI 机器人或许还能接管控制权。空军甚至正在考虑利用这项技术来操控无人机。


    很酷，对吧？确实如此。但有一个重大问题：通过使用 AI，人类在战场上做出生死决策时，是否最终会被排除在决策圈之外？这是否最终会导致更多流血冲突？也许机器会做出错误决策——从而引发更多问题？


    许多 AI 研究人员和企业家对此感到担忧。为此，已有超过 2400 人签署了一份声明，呼吁禁止所谓的“杀手机器人”。^(²¹³)


    甚至连联合国也在探讨某种形式的禁令。但美国，以及澳大利亚、以色列、英国和俄罗斯，都抵制这一举措。^(²¹⁴) 结果，一场真正的 AI 军备竞赛可能正在浮现。


    根据兰德公司的一篇论文，这项技术甚至有可能导致核战争，比如说在 2040 年之前。怎么会这样？作者指出，AI 可能使瞄准潜艇和移动导弹系统变得更加容易。报告称：


    *   研究人员表示，各国可能会受到诱惑，去追求先发制人的打击能力，以此作为在与对手谈判中获取筹码的手段，即使它们并无发动攻击的意图。这会破坏战略稳定，因为即使拥有这些能力的国家无意使用它们，对手也无法确定这一点。^(²¹⁵)


    但在短期内，AI 可能对信息战产生最大影响，而信息战本身仍可能具有高度破坏性。当俄罗斯政府干预 2016 年总统选举时，我们就曾一窥其貌。当时的方法技术含量较低，利用社交媒体水军农场来传播假新闻——但后果却十分严重。


    然而，随着 AI 变得更加强大且成本更低，我们很可能会看到它极大地增强这类行动。例如，深度伪造系统可以轻松创建逼真的人物照片和视频，这些内容可用于快速传播信息。


    ## 药物发现


    药物发现领域的进步几乎是奇迹般的，我们现在已经能够治愈像丙型肝炎这样棘手的疾病，并在多种癌症的治疗上不断取得进展。但当然，还有很多工作要做。事实是，制药公司在研发治疗方法方面正遇到越来越多的困难。仅举一例：2019
    年 3 月，百健公司宣布其一种处于 III 期试验的阿尔茨海默病药物未能显示出有意义的结果。消息公布后，该公司股价暴跌 29%，市值蒸发 180 亿美元。^(²¹⁶)


    考虑到传统的药物开发通常涉及大量的试错过程，这可能非常耗时。那么，有没有更好的方法呢？


    越来越多的研究人员正在寻求 AI 的帮助。我们看到各种专注于这一机遇的初创公司如雨后春笋般涌现。


    其中一家是 Insitro。这家成立于 2019 年的公司，在 A 轮融资中轻松筹集了惊人的 1 亿美元。部分投资者包括 Alexandria Venture
    Investments、贝佐斯探险（亚马逊公司杰夫·贝佐斯的投资公司）、穆巴达拉投资公司、Two Sigma Ventures 和 Verily。


    尽管团队相对较小——大约有 30 名员工——但他们都是杰出的研究人员，涵盖数据科学、深度学习、软件工程、生物工程和化学等领域。首席执行官兼创始人达芙妮·科勒拥有高级计算机科学和健康科学领域的罕见复合经验，曾领导谷歌的医疗保健业务
    Calico。


    作为 Insitro 实力的证明，该公司已经与大型制药商吉利德达成了合作。这项合作涉及潜在超过 10 亿美元的付款，用于研究非酒精性脂肪性肝炎（NASH），这是一种严重的肝脏疾病。^(²¹⁷)
    关键在于，吉利德已经能够收集大量数据，这些数据可以用于训练模型。这将使用人体外的细胞进行——即通过体外系统。吉利德在寻找替代方法方面有些紧迫性，因为其一种
    NASH 治疗药物 selonsertib 在临床试验中失败了（该试验针对的是疾病晚期患者）。


    AI 的前景在于它将加速药物发现，因为深度学习应该能够识别复杂的模式。但这项技术也可能有助于开发个性化治疗方案——例如针对个人的基因构成——这对于治愈某些疾病可能至关重要。


    无论如何，最好还是降低预期。医疗行业需要经历变革，因为 AI 方面的教育需要加强，因此将面临重大障碍。这需要时间，而且可能会遇到阻力。


    其次，在理解算法如何真正运作方面，深度学习通常是一个“黑箱”。当 FDA 关注因果关系时，这可能使新药获得监管批准变得困难。


    最后，人体非常复杂，我们仍在学习其运作方式。此外，正如我们在人类基因组解码等创新中所看到的，理解新方法通常需要相当长的时间。


    作为复杂性的一个标志，可以看看 IBM 的 Watson 的情况。尽管该公司拥有一些最有才华的 AI 研究人员，并在这项技术上花费了数十亿美元，但它最近宣布将不再销售用于药物发现的
    Watson。^(²¹⁸)

