    ### 用例：肢体语言


    仅仅关注语言本身可能具有局限性。肢体语言也应当被纳入先进的 AI 模型之中。


    这正是拉娜·埃尔·卡利乌比（Rana el Kaliouby）思考已久的问题。她在埃及长大，在开罗美国大学获得理学硕士学位，随后前往剑桥大学纽纳姆学院攻读计算机科学博士学位。但有一件事深深吸引着她：计算机如何能够检测人类的情绪？


    然而，在她的学术圈子里，人们对这个话题兴趣寥寥。计算机科学界的共识是，这个课题实际上没什么用处。


    但拉娜并未气馁，她与著名教授罗莎琳德·皮卡德（Rosalind Picard）合作，创建了创新的机器学习模型（她撰写了一本名为《*情感计算*》的关键著作，探讨了情感与机器的关系）。^(¹¹⁴)
    然而，这还需要利用神经科学和心理学等其他领域的知识。其中很大一部分工作是基于保罗·艾克曼（Paul Ekman）的开创性研究，他根据人的面部肌肉对人类情绪进行了广泛研究。他发现，人类有六种普遍情绪（愤怒、厌恶、恐惧、快乐、悲伤和惊讶），这些情绪可以通过
    46 种被称为“动作单元”的面部运动进行编码——所有这些都成为了面部动作编码系统（FACS）的一部分。


    在麻省理工学院媒体实验室期间，拉娜开发了一种“情感助听器”，这是一种可穿戴设备，旨在帮助自闭症患者更好地在社交环境中互动。^(¹¹⁵) 该系统能够检测他人的情绪，并提供适当的反应方式。


    这项创新具有开创性意义，《*纽约时报*》将其评为 2006 年最具影响力的创新之一。但拉娜的系统也引起了麦迪逊大道的注意。简单来说，这项技术可以成为衡量观众对电视广告情绪反应的有效工具。


    几年后，拉娜创立了 Affectiva 公司。公司迅速成长，并吸引了大量风险投资（总计已筹集 5420 万美元）。


    曾经被忽视的拉娜，如今已成为“情绪追踪 AI”趋势的领导者之一。


    Affectiva 的旗舰产品是 Affdex，这是一个基于云的平台，用于测试观众对视频内容的反应。全球财富 500 强中约有四分之一的公司使用它。


    但该公司还开发了另一款产品，名为 Affectiva Automotive AI，这是一种车载舱内传感系统。其部分功能包括：


    *   监测驾驶员疲劳或分心情况，并触发警报（例如安全带振动）。

    *   如果驾驶员不清醒或处于愤怒状态，则提供向半自动驾驶系统的切换功能。甚至还能提供替代路线，以减少“路怒症”的潜在可能！

    *   根据乘客的情绪个性化内容——例如音乐。


    对于所有这些产品，都采用了先进的深度学习系统，处理一个包含超过 750 万张人脸、拥有海量特征的数据库。这些模型还考虑了文化影响和人口统计学差异——所有这一切都是实时完成的。


    ## 语音商务


    由 NLP 驱动的技术，如虚拟助手、聊天机器人和智能音箱，有望催生强大的商业模式——甚至可能颠覆电子商务和营销等市场。我们已经从腾讯的微信生态中看到了其早期版本。这家成立于
    20 世纪 90 年代末互联网繁荣鼎盛时期的公司，最初推出了一款名为 OICQ 的基于 PC 的简单即时通讯产品。但真正改变游戏规则的是微信的推出，它已成为中国最大的社交媒体平台，拥有超过
    10 亿的月活跃用户。^(¹¹⁶)


    但这款应用的功能远不止交换信息和发布内容。微信已迅速演变成一个多功能的虚拟助手，你可以轻松地叫车、在本地零售商处付款、预订航班或玩游戏。例如，该应用每月约占中国智能手机总使用时长的近
    35%。微信也是中国日益成为无现金社会的主要原因之一。


    这一切都指向了一个新兴类别——语音商务（或称 v-commerce）的强大力量，即通过聊天或语音进行购买。这是一个至关重要的趋势，以至于 Facebook
    的马克·扎克伯格在 2019 年初写了一篇博文，^(¹¹⁷) 表示公司将变得更像……微信。


    根据 Juniper Research 的研究，到 2023 年，语音商务市场的规模预计将达到惊人的 800 亿美元。^(¹¹⁸) 但就这个市场的赢家而言，很可能是那些拥有庞大智能设备装机量的公司，如亚马逊、苹果和谷歌。不过，下一代
    NLP 技术的提供商仍将拥有发展空间。


    那么，这些 AI 系统将如何影响营销行业呢？《*哈佛商业评论*》上有一篇由尼拉吉·达瓦尔（Niraj Dawar）和尼尔·本德尔（Neil Bendle）撰写的文章，题为“Alexa
    时代的营销”。作者在文中指出：“AI 助手将改变公司与客户联系的方式。它们将成为人们获取信息、商品和服务的主要渠道，而营销将变成争夺他们注意力的战场。”^(¹¹⁹)


    因此，聊天机器人、数字助手和智能音箱的增长潜力可能远超最初的基于网络的电子商务革命。这些技术为客户带来了显著的好处，例如便利性。告诉设备要买什么东西很容易，而且机器还会学习你的习惯。所以下次你说想喝杯软饮料时，电脑就会知道你在指什么。


    但这可能导致赢家通吃的局面。最终，消费者似乎只会使用一台智能设备进行购物。此外，对于想要销售商品的品牌来说，需要深入了解客户的真实需求，以便成为推荐引擎中的首选供应商。

