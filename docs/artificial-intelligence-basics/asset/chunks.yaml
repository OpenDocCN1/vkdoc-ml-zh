  trans: '

    # 2. 数据


    人工智能的燃料


    Pinterest 是硅谷最热门的初创公司之一，允许用户收藏他们喜爱的物品来创建引人入胜的展板。该网站拥有 2.5 亿月活跃用户，并在 2018 年实现了
    7.56 亿美元的收入。^(¹⁴)


    Pinterest 上一个受欢迎的活动是策划婚礼。准新娘会收藏婚纱、场地、蜜月地点、蛋糕、请柬等内容的图钉。


    这也意味着 Pinterest 在收集海量有价值数据方面具有优势。这部分数据有助于提供定向广告。同时，也存在开展电子邮件营销活动的机会。在一个案例中，Pinterest
    发送了一封内容如下的邮件：


    > 您要结婚了！因为我们热爱婚礼策划——尤其是所有可爱的文具——我们邀请您浏览由平面设计师、摄影师和其他准新娘策划的最佳展板，她们都是眼光独到且心系婚姻的
    Pin 用户。^(¹⁵)


    问题在于：这封邮件的许多收件人已经结婚，或者近期没有结婚的打算。


    Pinterest 确实迅速采取了行动，并发布了如下道歉声明：


    > 每周，我们都会向我们认为可能感兴趣的用户发送特定类别图钉和展板的邮件合集。不幸的是，最近的一封邮件暗示用户实际上要结婚了，而不仅仅是可能对婚礼相关内容感兴趣。我们很抱歉表现得像一位总是追问你何时能找到如意郎君或佳人的专横母亲。


    这是一个重要的教训。即使是一些最精通技术的公司也会搞砸。


    例如，在某些情况下，数据可能非常精准，但结果仍然可能是一场彻底的失败。以 Target 为例。该公司利用其海量数据向准妈妈们发送个性化优惠。这是基于那些进行了特定类型购买的客户，例如购买无香型乳液。Target
    的系统会生成一个怀孕评分，甚至能提供预产期的估算。


    结果，其中一位客户的父亲看到邮件后非常愤怒，声称他的女儿没有怀孕。^(¹⁶)


    但事实上她怀孕了——而且，没错，她一直对父亲隐瞒着这件事。


    毫无疑问，数据对于人工智能来说极其强大且至关重要。但你需要深思熟虑并理解其中的风险。在本章中，我们将探讨一些你需要了解的内容。


    ## 数据基础


    了解数据领域的行话是件好事。


    首先，比特（bit，是“二进制位”的缩写）是计算机中数据的最小形式。可以把它想象成原子。一个比特可以是 0 或 1，这是二进制的。它通常也用于衡量正在传输的数据量（例如在网络或互联网中）。


    另一方面，字节（byte）主要用于存储。当然，字节数会增长得非常快。让我们在表 2-1 中看看具体情况。


    表 2-1. 数据级别类型


    | **单位** | **数值** | **使用场景** |

    | --- | --- | --- |

    | 兆字节 | 1,000 千字节 | 一本小书 |

    | 吉字节 | 1,000 兆字节 | 约 230 首歌曲 |

    | 太字节 | 1,000 吉字节 | 500 小时的电影 |

    | 拍字节 | 1,000 太字节 | 地球观测系统五年的数据 |

    | 艾字节 | 1,000 拍字节 | 整个美国国会图书馆的 3,000 倍 |

    | 泽字节 | 1,000 艾字节 | 36,000 年的高清电视视频 |

    | 尧字节 | 1,000 泽字节 | 这需要一个特拉华州和罗德岛州面积总和的数据中心 |


    数据也可以来自许多不同的来源。以下仅举几例：


    *   网络/社交（Facebook、Twitter、Instagram、YouTube）

    *   生物识别数据（健身追踪器、基因检测）

    *   销售点系统（来自实体店和电子商务网站）

    *   物联网（ID 标签和智能设备）

    *   云系统（如 Salesforce.com 等商业应用）

    *   企业数据库和电子表格


    ## 数据类型


    组织数据有四种方式。首先是结构化数据，通常存储在关系数据库或电子表格中。一些例子包括：


    *   财务信息

    *   社会安全号码

    *   地址

    *   产品信息

    *   销售点数据

    *   电话号码


    在大多数情况下，结构化数据更容易处理。这些数据通常来自 CRM（客户关系管理）和 ERP（企业资源规划）系统——并且通常数据量较小。在分析方面，它也往往更直接。有多种
    BI（商业智能）程序可以帮助从结构化数据中获取洞察。然而，这类数据仅占人工智能项目的大约 20%。


    大部分数据将来自非结构化数据，即没有预定义格式的信息。你需要自己处理这些数据，这可能既繁琐又耗时。但是，有一些工具，比如基于 NoSQL 的下一代数据库，可以帮助完成这个过程。人工智能系统在管理和结构化数据方面也很有效，因为算法可以识别模式。


    以下是非结构化数据的例子：


    *   图像

    *   视频

    *   音频文件

    *   文本文件

    *   社交网络信息，如推文和帖子

    *   卫星图像


    还有一些数据是结构化数据和非结构化数据的混合体——称为半结构化数据。这些信息包含一些有助于分类的内部标签。


    半结构化数据的例子包括 XML（可扩展标记语言），它基于各种规则来识别文档的元素；以及 JSON（JavaScript 对象表示法），这是一种通过 API（应用程序编程接口）在网络上传输信息的方式。


    但半结构化数据仅占所有数据的 5% 到 10%。


    最后，还有时间序列数据，它可以是结构化、非结构化和半结构化数据。这类信息用于交互，例如追踪“客户旅程”。这会在用户访问网站、使用应用程序甚至走进商店时收集信息。


    然而，这类数据通常杂乱且难以理解。部分原因在于需要理解用户的意图，而用户的意图可能千差万别。交互数据量也非常巨大，可能涉及数万亿个数据点。哦，成功的衡量标准可能也不明确。用户为什么要在网站上做某件事？


    但人工智能对于解决此类问题可能至关重要。不过，在大多数情况下，时间序列数据的分析仍处于早期阶段。

    '
- fmt: '# Big Data


    With the ubiquity of Internet access, mobile devices, and wearables, there has
    been the unleashing of a torrent of data. Every second, Google processes over
    40,000 searches or 3.5 billion a day. On a minute-by-minute basis, Snapchat users
    share 527,760 photos, and YouTube users watch more than 4.1 million videos. Then
    there are the old-fashioned systems, like emails, that continue to see significant
    growth. Every minute, there are 156 million messages sent.^([^(17)](#fn17))


    But there is something else to consider: Companies and machines also generate
    huge sums of data. According to research from Statista, the number of sensors
    will reach 12.86 billion by 2020.^([^(18)](#fn18))


    In light of all this, it seems like a good bet that the volumes of data will continue
    to increase at a rapid clip. In a report from International Data Corporation (IDC)
    called “Data Age 2025,” the amount of data created is expected to hit a staggering
    163 zettabytes by 2025.^([^(19)](#fn19)) This is about ten times the amount in
    2017.


    To deal with all this, there has emerged a category of technology called Big Data.
    This is how Oracle explains the importance of this trend:


    > Today, big data has become capital. Think of some of the world’s biggest tech
    companies. A large part of the value they offer comes from their data, which they’re
    constantly analyzing to produce more efficiency and develop new products.^([^(20)](#fn20))


    So yes, Big Data will remain a critical part of many AI projects.


    Then what exactly is Big Data? What’s a good definition? Actually, there isn’t
    one, even though there are many companies that focus on this market! But Big Data
    does have the following characteristics, which are called the three Vs (Gartner
    analyst Doug Laney came up with this structure back in 2001^([^(21)](#fn21))):
    volume, variety, and velocity.


    ## Volume


    This is the scale of the data, which is often unstructured. There is no hard-and-fast
    rule on a threshold, but it is usually tens of terabytes.


    Volume is often a major challenge when it comes to Big Data. But cloud computing
    and next-generation databases have been a big help—in terms of capacity and lower
    costs.


    ## Variety


    This describes the diversity of the data, say a combination of structured, semi-structured,
    and unstructured data (explained above). It also shows the different sources of
    the data and uses. No doubt, the high growth in unstructured data has been a key
    to the variety of Big Data.


    Managing this can quickly become a major challenge. Yet machine learning is often
    something that can help streamline the process.


    ## Velocity


    This shows the speed at which data is being created. As seen earlier in this chapter,
    services like YouTube and Snapchat have extreme levels of velocity (this is often
    referred to as a “firehouse” of data). This requires heavy investments in next-generation
    technologies and data centers. The data is also often processed in memory not
    with disk-based systems.


    Because of these issues, velocity is often considered the most difficult when
    it comes to the three Vs. Let’s face it, in today’s digital world, people want
    their data as fast as possible. If it is too slow, people will get frustrated
    and go somewhere else.


    Over the years, though, as Big Data has evolved, there have been more Vs added.
    Currently, there are over ten.


    But here are some of the common ones:


    - *Veracity*: This is about data that is deemed accurate. In this chapter, we’ll
    look at some of the techniques to evaluate veracity.

    - *Value*: This shows the usefulness of the data. Often this is about having a
    trusted source.

    - *Variability*: This means that data will usually change over time. For example,
    this is the case with social media content that can morph based on overall sentiment
    regarding new developments and breaking news.

    - *Visualization*: This is using visuals—like graphs—to better understand the
    data.


    As you can see, managing Big Data has many moving parts, which leads to complexity.
    This helps to explain why many companies still use only a tiny fraction of their
    data.


    # Databases and Other Tools


    There are a myriad of tools that help with data. At the core of this is the database.
    As should be no surprise, there has been an evolution of this critical technology
    over the decades. But even older technologies like relational databases are still
    very much in use today. When it comes to mission-critical data, companies are
    reluctant to make changes—even if there are clear benefits.


    To understand this market, let’s rewind back to 1970, when IBM computer scientist
    Edgar Codd published “A Relational Model of Data for Large Shared Data Banks.”
    It was pathbreaking as it introduced the structure of relational databases. Up
    until this point, databases were fairly complex and rigid—structured as hierarchies.
    This made it time consuming to search and find relationships in the data.


    As for Codd’s relational database approach, it was built for more modern machines.
    The `SQL` script language was easy to use allowing for `CRUD` (Create, Read, Update,
    and Delete) operations. Tables also had connections with primary and foreign keys,
    which made important connections like the following:


    - *One-to-One*: One row in a table is linked to only one row in another table.
    Example: A driver’s license number, which is unique, is associated with one employee.

    - *One-to-Many*: This is where one row in a table is linked to other tables. Example:
    A customer has multiple purchase orders.

    - *Many-to-Many*: Rows from one table are associated with rows of another. Example:
    Various reports have various authors.


    With these types of structures, a relational database could streamline the process
    of creating sophisticated reports. It truly was revolutionary.


    But despite the advantages, IBM was not interested in the technology and continued
    to focus on its proprietary systems. The company thought that the relational databases
    were too slow and brittle for enterprise customers.


    But there was someone who had a different opinion on the matter: Larry Ellison.
    He read Codd’s paper and knew it would be a game changer. To prove this, he would
    go on to co-found Oracle in 1977 with a focus on building relational databases—which
    would quickly become a massive market. Codd’s paper was essentially a product
    roadmap for his entrepreneurial efforts.


    It was not until 1993 that IBM came out with its own relational database, `DB2`.
    But it was too late. By this time, Oracle was the leader in the database market.


    Through the 1980s and 1990s, the relational database was the standard for mainframe
    and client-server systems. But when Big Data became a factor, the technology had
    serious flaws like the following:


    - *Data Sprawl*: Over time, different databases would spread across an organization.
    The result was that it got tougher to centralize the data.

    - *New Environments*: Relational database technology was not built for cloud computing,
    high-velocity data, or unstructured data.

    - *High Costs*: Relational databases can be expensive. This means that it can
    be prohibitive to use the technology for AI projects.

    - *Development Challenges*: Modern software development relies heavily on iterating.
    But relational databases have proven challenging for this process.


    In the late 1990s, there were open source projects developed to help create next-generation
    database systems. Perhaps the most critical one came from Doug Cutting who developed
    `Lucene`, which was for text searching. The technology was based on a sophisticated
    index system that allowed for low-latency performance. `Lucene` was an instant
    hit, and it started to evolve, such as with Apache Nutch that efficiently crawled
    the Web and stored the data in an index.'
