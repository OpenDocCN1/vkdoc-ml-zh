    # 6. 自然语言处理（NLP）


    计算机如何交谈


    2014 年，微软推出了一款名为“小冰”的聊天机器人——一种与人交流的 AI 系统。它被集成到了中国最大的社交消息服务平台——腾讯的微信中。小冰表现相当出色，在几年内就获得了
    4000 万用户。


    鉴于这一成功，微软想看看能否在美国市场也做出类似的产品。该公司的必应以及技术与研究部门利用 AI 技术构建了一个新的聊天机器人：Tay。开发人员甚至请来了即兴喜剧演员，让对话变得引人入胜且有趣。


    2016 年 3 月 23 日，微软在 Twitter 上推出了 Tay——结果是一场彻头彻尾的灾难。这个聊天机器人迅速喷出了种族主义和性别歧视的言论！以下是成千上万个例子中的一个：


    > *@TheBigBrebowski 瑞奇·热维斯从阿道夫·希特勒那里学到了极权主义，而希特勒是无神论的发明者* ^(¹⁰²)


    Tay 生动地诠释了“戈德温法则”。该法则内容如下：在线讨论持续的时间越长，有人提到阿道夫·希特勒或纳粹的可能性就越高。


    所以，没错，微软在 24 小时内就下架了 Tay，并发表了道歉博客。在博客中，微软医疗保健部门的企业副总裁彼得·李写道：


    *   展望未来，我们在 AI 设计方面面临着一些困难——但同样令人兴奋——的研究挑战。AI 系统从与人的积极和消极互动中汲取养分。从这个意义上说，这些挑战既是技术性的，也是社会性的。我们将尽一切可能限制技术上的漏洞，但我们也知道，如果不从错误中学习，就无法完全预测所有可能的人类交互误用。要做好
    AI，就需要与许多人反复迭代，并且常常在公共论坛上进行。我们必须极其谨慎地进入每一个环节，最终一步步地学习和改进，并且在此过程中不冒犯他人。我们将坚定不移地努力从这次以及其他经历中学习，致力于为互联网做出贡献，使其代表人性中最好的一面，而非最坏的一面。^(¹⁰³)


    Tay 的一个关键机制是重复提问者的一些内容。在很大程度上，这是一种有效的方法。正如我们在第 1 章中看到的，这是第一个聊天机器人 ELIZA 的核心。


    但同时也必须设置有效的过滤器。当聊天机器人被用于像 Twitter 这样的自由形式平台时（或者，就此而言，在任何现实场景中），这一点尤其重要。


    然而，像 Tay 这样的失败是重要的。它们让我们能够学习并推动技术发展。


    在本章中，我们将探讨聊天机器人以及自然语言处理（NLP），这是计算机理解和操作语言的关键部分。这是 AI 的一个子集。


    让我们开始吧。

    '
- fmt: '# The Challenges of NLP


    As we saw in Chapter [1](#480660_1_En_1_Chapter.xhtml), language is the key to
    the Turing Test, which is meant to validate AI. Language is also something that
    sets us apart from animals.


    But this area of study is exceedingly complex. Here are just some of the challenges
    with NLP:


    - Language can often be ambiguous. We learn to speak in a quick fashion and accentuate
    our meaning with nonverbal cues, our tone, or reactions to the environment. For
    example, if a golf ball is heading toward someone, you’ll yell “Fore!” But an
    NLP system would likely not understand this because it cannot process the context
    of the situation.

    - Language changes frequently as the world changes. According to the Oxford English
    Dictionary, there were more than 1,100 words, senses, and subentries in 2018 (in
    all, there are over 829,000)^([^(104)](#fn104)). Some of the new entries included
    `mansplain` and `hangry`.

    - When we talk, we make grammar mistakes. But this is usually not a problem as
    people have a great ability for inference. But this is a major challenge for NLP
    as words and phrases may have multiple meanings (this is called polysemy). For
    example, noted AI researcher Geoffrey Hinton likes to compare “recognize speech”
    and “wreck a nice beach.”^([^(105)](#fn105))

    - Language has accents and dialects.

    - The meaning of words can change based on, say, the use of sarcasm or other emotional
    responses.

    - Words can be vague. After all, what does it really mean to be “late”?

    - Many words have essentially the same meaning but involve degrees of nuances.

    - Conversations can be non-linear and have interruptions.


    Despite all this, there have been great strides with NLP, as seen with apps like
    Siri, Alexa, and Cortana. Much of the progress has also happened within the last
    decade, driven by the power of deep learning.


    Now there can be confusion about human languages and computer languages. Haven’t
    computers been able to understand languages like BASIC, C, and C++ for years?
    This is definitely true. It’s also true that computer languages have English words
    like `if`, `then`, `let`, and `print`.


    But this type of language is very different from human language. Consider that
    a computer language has a limited set of commands and strict logic. If you use
    something incorrectly, this will result in a bug in the code—leading to a crash.
    Yes, computer languages are very literal!


    # Understanding How AI Translates Language


    Now as we saw in Chapter [1](#480660_1_En_1_Chapter.xhtml), NLP was an early focus
    for AI researchers. But because of the limited computer power, the capabilities
    were quite weak. The goal was to create rules to interpret words and sentences—which
    turned out to be complex and not very scalable. In a way, NLP in the early years
    was mostly like a computer language!


    But over time, there evolved a general structure for it. This was critical since
    NLP deals with unstructured data, which can be unpredictable and difficult to
    interpret.


    Here’s a general high-level look at the two key steps:


    - *Cleaning and Preprocessing the Text*: This involves using techniques like tokenization,
    stemming, and lemmatization to parse the text.

    - *Language Understanding and Generation*: This is definitely the most intensive
    part of the process, which often uses deep learning algorithms.


    In the next few sections, we’ll look at the different steps in more detail.


    ## Step #1—Cleaning and Preprocessing


    Three things need to be done during the cleaning and preprocessing step: tokenization,
    stemming, and lemmatization.


    ### Tokenization


    Before there can be NLP, the text must be parsed and segmented into various parts—a
    process known as tokenization. For example, let’s say we have the following sentence:
    “John ate four cupcakes.” You would then separate and categorize each element.
    Figure [6-1](#480660_1_En_6_Chapter.xhtml#Fig1) illustrates this tokenization.


    ![../images/480660_1_En_6_Chapter/480660_1_En_6_Fig1_HTML.jpg](images/480660_1_En_6_Chapter/480660_1_En_6_Fig1_HTML.jpg)


    Figure 6-1. Example of sentence tokenization


    All in all, kind of easy? Kind of.


    After tokenization, there will be normalization of the text. This will entail
    converting some of the text so as to make it easier for analysis, such as by changing
    the case to upper or lower, removing punctuation, and eliminating contractions.


    But this can easily lead to some problems. Suppose we have a sentence that has
    “A.I.” Should we get rid of the periods? And if so, will the computer know what
    “A I” means?


    Probably not.


    Interestingly enough, even the case of words can have a major impact on the meaning.
    Just look at the difference between “fed” and the “Fed.” The Fed is often another
    name for the Federal Reserve. Or, in another case, let’s suppose we have “us”
    and “US.” Are we talking about the United States here?


    Here are some of the other issues:


    - *White Space Problem*: This is where two or more words should be one token because
    the words form a compound phrase. Some examples include “New York” and “Silicon
    Valley.”

    - *Scientific Words and Phrases*: It’s common for such words to have hyphens,
    parentheses, and Greek letters. If you strip out these characters, the system
    may not be able to understand the meanings of the words and phrases.

    - *Messy Text*: Let’s face it, many documents have grammar and spelling errors.

    - *Sentence Splitting*: Words like “Mr.” or “Mrs.” can prematurely end a sentence
    because of the period.

    - *Non-important Words*: There are ones that really add little or no meaning to
    a sentence, like “the,” “a,” and “an.” To remove these, you can use a simple Stop
    Words filter.


    As you can see, it can be easy to mis-parse sentences (and in some languages,
    like Chinese and Japanese, things can get even more difficult with the syntax).
    But this can have far-ranging consequences. Since tokenization is generally the
    first step, a couple errors can cascade through the whole NLP process.


    ### Stemming


    Stemming describes the process of reducing a word to its root (or lemma), such
    as by removing affixes and suffixes. This has actually been effective for search
    engines, which involve the use of clustering to come up with more relevant results.
    With stemming, it’s possible to find more matches as the word has a broader meaning
    and even to handle such things as spelling errors. And when using an AI application,
    it can help improve the overall understanding.


    Figure [6-2](#480660_1_En_6_Chapter.xhtml#Fig2) shows an example of stemming.


    ![../images/480660_1_En_6_Chapter/480660_1_En_6_Fig2_HTML.jpg](images/480660_1_En_6_Chapter/480660_1_En_6_Fig2_HTML.jpg)


    Figure 6-2. Example of stemming


    There are a variety of algorithms to stem words, many of which are fairly simple.
    But they have mixed results. According to IBM:


    > The Porter algorithm, for example, will state that ‘universal’ has the same
    stem as ‘university’ and ‘universities,’ an observation that may have historical
    basis but is no longer semantically relevant. The Porter stemmer also does not
    recognize that ‘theater’ and ‘theatre’ should belong to the same stem class. For
    reasons such as these, Watson Explorer Engine does not use the Porter stemmer
    as its English stemmer.^([^(106)](#fn106))


    In fact, IBM has created its own proprietary stemmer, and it allows for significant
    customization.'
