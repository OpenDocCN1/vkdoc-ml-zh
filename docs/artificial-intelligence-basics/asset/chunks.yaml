    for each lead. But unfortunately, it was unscalable and had mixed results.


    But with Chorus, the company was able to create an approach that did not have
    much variation. The software made it possible to measure every word and the impact
    on the sales conversions. Chorus also measured whether a sales rep was on-script
    or not.


    The outcome? The company was able to increase the win rate of the sales organization
    by 10%.^([^(109)](#fn109))


    ### Use Case: Fighting Depression


    Across the world, about 300 million people suffer from depression, according to
    data from the World Health Organization.^([^(110)](#fn110)) About 15% of adults
    will experience some type of depression during their life.


    This may go undiagnosed because of lack of healthcare services, which can mean
    that a person’s situation could get much worse. Unfortunately, the depression
    can lead to other problems.


    But NLP may be able to improve the situation. A recent study from Stanford used
    a machine learning model that processed 3D facial expressions and the spoken language.
    As a result, the system was able to diagnose depression with an average error
    rate of 3.67 when using the Patient Health Questionnaire (PHQ) scale. The accuracy
    was even higher for more aggravated forms of depression.


    In the study, the researchers noted: “This technology could be deployed to cell
    phones worldwide and facilitate low-cost universal access to mental health care.”^([^(111)](#fn111))


    ### Use Case: Content Creation


    In 2015, several tech veterans like Elon Musk, Peter Thiel, Reid Hoffman, and
    Sam Altman launched OpenAI, with the support of a whopping $1 billion in funding.
    Structured as a nonprofit, the goal was to develop an organization with the goal
    “to advance digital intelligence in the way that is most likely to benefit humanity
    as a whole, unconstrained by a need to generate financial return.”^([^(112)](#fn112))


    One of the areas of research has been on NLP. To this end, the company launched
    a model called GPT-2 in 2019, which was based on a dataset of roughly eight million
    web pages. The focus was to create a system that could predict the next word based
    on a group of text.


    To illustrate this, OpenAI provided an experiment with the following text as the
    input: “In a shocking finding, scientist discovered a herd of unicorns living
    in a remote, previously unexplored valley, in the Andes Mountains. Even more surprising
    to the researchers was the fact that the unicorns spoke perfect English.”


    From this, the algorithms created a convincing story that was 377 words in length!


    Granted, the researchers admitted that the storytelling was better for topics
    that related more to the underlying data, on topics like *Lord of the Rings* and
    even Brexit. As should be no surprise, GPT-2 demonstrated poor performance for
    technical domains.


    But the model was able to score high on several well-known evaluations of reading
    comprehension. See Table [6-1](#480660_1_En_6_Chapter.xhtml#Tab1).^([^(113)](#fn113))


    Table 6-1.


    Reading comprehension results


    | DataSet | Prior Record for Accuracy | GPT-2’s Accuracy |

    | --- | --- | --- |

    | Winograd Schema Challenge | 63.7% | 70.70% |

    | LAMBADA | 59.23% | 63.24% |

    | Children’s Book Test Common Nouns | 85.7% | 93.30% |

    | Children’s Book Test Named Entities | 82.3% | 89.05% |


    Even though a typical human would score 90%+ on these tests, the performance of
    GPT-2 is still impressive. It’s important to note that the model used Google’s
    neural network innovation, called a Transformer, and unsupervised learning.


    In keeping with OpenAI’s mission, the organization decided not to release the
    complete model. The fear was that it could lead to adverse consequences like fake
    news, spoofed Amazon.com reviews, spam, and phishing scams.'
