  trans: '

    ## 确定要解决的问题


    HCL Technologies 成立于 1976 年，是最大的 IT 咨询公司之一，在 44 个国家拥有 132,000 名员工，并且《财富》500 强中有一半是其客户。该公司还实施了大量的
    AI 系统。


    以下是 HCL Technologies 的企业副总裁兼全球首席技术官 Kalyan Kumar 的观点：


    *   企业领导者需要理解并认识到，采用人工智能是一个旅程，而非短跑。在企业内部推动 AI 应用的人必须对时间框架以及 AI 的能力范围保持现实态度。人与
    AI 之间的关系是相互赋能的，任何 AI 实施都需要一段时间才能开始产生积极且显著的影响。^(¹⁷⁵)


    这是极好的建议。正因如此——尤其是对于刚刚踏上 AI 之旅的公司而言——采取实验性方法至关重要。可以将其视为组建一个试点项目——也就是说，你正处于“爬行和行走阶段”。


    但在 AI 实施过程中，人们很容易过度关注不同的技术，这些技术固然迷人且强大。然而，成功远不止技术本身；换句话说，必须首先有一个清晰的商业案例。因此，在起步阶段，以下是一些值得思考的领域：


    *   毫无疑问，公司中的决策往往是临时性的，甚至可以说是猜测！但借助 AI，你有机会利用数据驱动的决策，这应该会带来更高的准确性。那么，在你的组织中，哪些环节能从中获得最大收益？


    *   正如我们在第 5 章中介绍的机器人流程自动化（RPA）所展示的那样，AI 在处理重复性和单调性任务时极为高效。


    *   聊天机器人是开始使用 AI 的另一种方式。它们相对容易设置，并且可以服务于特定的用例，例如客户服务。你可以在第 6 章中了解更多相关信息。


    Landing AI 的 CEO、前 Google Brain 负责人吴恩达提出了多种方法，用于在确定初始 AI 项目的关注点时进行思考：^(¹⁷⁶)


    *   *速赢*：一个项目应耗时 6 到 12 个月，并且必须具有很高的成功概率，这有助于为更多举措提供动力。吴恩达建议同时开展几个项目，因为这样可以增加取得成功的几率。


    *   *有意义*：一个项目不一定要具有变革性。但它应产生能够以显著方式帮助公司改进的成果，从而为更多的 AI 投资创造支持。其价值通常来自降低成本、增加收入、发现新的业务拓展领域或降低风险。


    *   *行业特定聚焦*：这一点至关重要，因为一个成功的项目将是提升支持度的另一个因素。因此，如果你的公司销售订阅服务，那么一个用于减少客户流失的 AI 系统将是一个很好的起点。


    *   *数据*：不要因为数据量而限制你的选择。吴恩达指出，一个成功的 AI 项目可能只有 100 个数据点。但数据必须仍然高质量且相当干净，这是第 2 章涵盖的关键主题。


    在审视这一阶段时，评估员工与机器之间的“探戈”也很有价值。请记住，这一点常常被忽略——并且可能对 AI 项目产生不利后果。正如我们在本书中所见，AI 擅长以极快的速度、极低的错误率处理海量数据。该技术在预测和检测异常方面也表现出色。但人类在某些任务上做得更好，例如发挥创造力、进行抽象思考以及理解概念。


    请注意 Cobalt Robotics 联合创始人兼首席技术官 Erik Schluntz 的以下例子：


    *   我们的安全机器人非常擅长检测工作场所和校园环境中的异常事件，例如利用 AI 热成像技术在黑暗的办公室中发现人员。但随后，我们的一名人类操作员会介入并决定如何响应。即使
    AI 潜力巨大，在面对不断变化的环境变量和人类不可预测性时，它仍然不是最佳的关键任务选择。试想一下 AI 在不同情况下犯错的影响——未能检测到恶意入侵者比向我们的操作员误报假警报要糟糕得多。^(¹⁷⁷)


    接下来，确保你对关键绩效指标（KPI）有清晰的定义，并勤勉地进行衡量。例如，如果你正在为客服开发一个定制聊天机器人，你可能希望根据解决率和客户满意度等指标进行衡量。


    最后，你需要进行 IT 评估。如果你拥有大量遗留系统，那么实施 AI 可能会更加困难和昂贵，即使供应商提供了 API 和集成方案。这意味着你需要调整你的期望值。


    尽管如此，这些投资确实能够带来显著改变，即使对于老牌公司也是如此。以 Symrise 为例，其历史可追溯到 200 多年前的德国。截至撰写本文时，该公司是一家全球性的香精香料生产商，拥有超过
    30,000 种产品。


    几年前，Symrise 在 IBM 的帮助下启动了一项重大计划，利用 AI 来创造新的香水。该公司不仅需要改造其现有的 IT 基础设施，还必须花费大量时间来微调模型。但一个巨大的帮助是，它已经拥有广泛的数据集，这使得结果更加精确。请注意，即使化合物混合中出现微小偏差，也可能导致香水失败。


    据 Symrise 香氛与护理部门总裁 Achim Daub 表示：


    *   现在，我们的调香师可以与一位 AI 学徒并肩工作，它能够分析数千种配方和历史数据，以识别模式并预测新颖的组合，从而帮助他们提高生产力，并通过引导他们走向前所未有的配方来加速设计过程。^(¹⁷⁸)

    '
- fmt: '# Forming the Team


    How large should the initial team be for an AI project? Perhaps a good guide is
    to use Jeff Bezos’ “two pizza rule.”^([^(179)](#fn179)) In other words, is this
    enough to feed the people who are participating?


    Oh, and there should be no rush to build the team. Everyone must be highly focused
    on success and understand the importance of the project. If there is little to
    show from the AI project, the prospects for future initiatives could be in jeopardy.


    The team will need a leader who generally has a business or operational background
    but also has some technical skills. Such a person should be able to identify the
    business case for the AI project but also communicate the vision to multiple stakeholders
    in the company, such as the IT department and senior management.


    In terms of the technical people, there will probably not be a need for a PhD
    in AI. While such people are brilliant, they are often focused primarily on innovations
    in the field, such as by refining models or creating new ones. These skillsets
    are usually not essential for an AI pilot.


    Rather, look for those people who have a background in software engineering or
    data science. However, as noted earlier in the chapter, these people may not have
    a strong background in AI. Because of this, there may be a need to have them spend
    a few months of training on learning the core principles of machine learning and
    deep learning. There should also be a focus on understanding how to use AI platforms,
    such as `TensorFlow`.


    Given the challenges, it may be a good idea to seek the help of consultants, who
    can help identify the AI opportunities but also provide advice on data preparation
    and the development of the models.


    Since an AI pilot will be experimental, the team should have people who are willing
    to take risks and are open minded. If not, progress could be extremely difficult.


    ## The Right Tools and Platforms


    There are many tools for helping create AI models, and most of them are open source.
    Even though it’s good to test them out, it is still advisable to first conduct
    your IT assessment. By doing this, you should be in a better position to evaluate
    the AI Tools.


    Something else: You may realize that your company is already using multiple AI
    Tools and platforms! This may cause issues with integration and the management
    of the process with AI projects. In light of this, a company should develop a
    strategy for the tools. Think of it as your AI Tools stack.


    OK then, let’s take a look at some of the more common languages, platforms, and
    tools for AI.


    ### Python Language


    Guido van Rossum, who got his master’s degree in mathematics and computer science
    from the University of Amsterdam in 1982, would go on to work at various research
    institutes in Europe like the Corporation for National Research Initiatives (CNRI).
    But it was in the late 1980s that he would create his own computer language, called
    Python. The name actually came from the popular British comedy series *Monty Python*.


    So the language was kind of offbeat—but this made it so powerful. Python would
    soon become the standard for AI development.


    Part of this was due to the simplicity. With just a few scripts of code, you can
    create sophisticated models, say with functions like `filter`, `map`, and `reduce`.
    But of course, the language allows for much sophisticated coding as well.


    Van Rossum developed Python with a clear philosophy:^([^(180)](#fn180))


    * Beautiful is better than ugly.

    * Explicit is better than implicit.

    * Simple is better than complex.

    * Complex is better than complicated.

    * Flat is better than nested.

    * Sparse is better than dense.


    These are just some of the principles.


    What’s more, Python had the advantage of growing in the academic community, which
    had access to the Internet that helped accelerate the distribution. But it also
    made it possible for the emergence of a global ecosystem with thousands of different
    AI packages and libraries. Here are just some:


    * `NumPy`: This allows for scientific computing applications. At the heart of
    this is the ability to create a sophisticated array of objects at high performance.
    This is critical for high-end data processing in AI models.


    * `Matplotlib`: With this, you can plot datasets. Often `Matplotlib` is used in
    conjunction with `NumPy`/`Pandas` (`Pandas` refers to “Python Data Analysis Library”).
    This library makes it relatively easy to create data structures for developing
    AI models.


    * `SimpleAI`: This is an implementation of the AI algorithms from the book *Artificial
    Intelligence: A Modern Approach*, by Stuart Russel and Peter Norvig. The library
    not only has rich functionality but also provides helpful resources to navigate
    the process.


    * `PyBrain`: This is a modular machine learning library that makes it possible
    to create sophisticated models—neural networks and reinforcement learning systems—without
    much coding.


    * `Scikit-Learn`: Launched in 2007, this library has a deep source of capabilities,
    allowing for regression, clustering, and classification of data.


    Another benefit for Python is that there are many resources for learning. A quick
    search on YouTube will show thousands of free courses.


    Now there are other solid languages you can use for AI like `C++`, `C#`, and `Java`.
    While they are generally more powerful than Python, they are also complex. Besides,
    when it comes to building models, there is often little need to create full-fledged
    applications. And finally, there are Python libraries built for high-speed AI
    machines—with GPUs—like `CUDA Python`.'
