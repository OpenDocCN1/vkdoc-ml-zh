- fmt: '# Backpropagation


    One of the major drawbacks with artificial neural networks is the process of making
    adjustments to the weights in the model. Traditional approaches, like the use
    of the mutation algorithm, used random values that proved to be time consuming.


    Given this, researchers looked for alternatives, such as backpropagation. This
    technique had been around since the 1970s but got little interest as the performance
    was lacking. But David Rumelhart, Geoffrey Hinton, and Ronald Williams realized
    that backpropagation still had potential, so long as it was refined. In 1986,
    they wrote a paper entitled “Learning Representations by Back-propagating Errors,”
    and it was a bombshell in the AI community.^([^(56)](#fn56)) It clearly showed
    that backpropagation could be much faster but also allow for more powerful artificial
    neural networks.


    As should be no surprise, there is a lot of math involved in backpropagation.
    But when you boil things down, it’s about adjusting the neural network when errors
    are found and then iterating the new values through the neural network again.
    Essentially, the process involves slight changes that continue to optimize the
    model.


    For example, let’s say one of the inputs has an output of `0.6`. This means that
    the error is `0.4` (`1.0` minus `0.6`), which is subpar. But we can then backpropogate
    the output, and perhaps the new output may get to `0.65`. This training will go
    on until the value is much closer to `1`.


    Figure [4-3](#480660_1_En_4_Chapter.xhtml#Fig3) illustrates this process. At first,
    there is a high level of errors because the weights are too large. But by making
    iterations, the errors will gradually fall. However, doing too much of this could
    mean an increase in errors. In other words, the goal of backpropagation is to
    find the midpoint.


    ![../images/480660_1_En_4_Chapter/480660_1_En_4_Fig3_HTML.jpg](images/480660_1_En_4_Chapter/480660_1_En_4_Fig3_HTML.jpg)


    Figure 4-3. The optimal value for a backpropagation function is at the bottom
    of the graph


    As a gauge of the success of backpropagation, there were a myriad of commercial
    applications that sprung up. One was called `NETtalk`, which was developed by
    Terrence Sejnowski and Charles Rosenberg in the mid-1980s. The machine was able
    to learn how to pronounce English text. `NETtalk` was so interesting that it was
    even demoed on the *Today show*.


    There were also a variety of startups that were created that leveraged backpropagation,
    such as `HNC Software`. It built models that detected credit card fraud. Up until
    this point—when `HNC` was founded in the late 1980s—the process was done mostly
    by hand, which led to costly errors and low volumes of issuances. But by using
    deep learning approaches, credit card companies were able to save billions of
    dollars.


    In 2002, `HNC` was acquired by Fair, Isaac and valued at $810 million.^([^(57)](#fn57))


    # The Various Neural Networks


    The most basic type of a neural network is a fully connected neural network. As
    the name implies, it is where all the neurons have connections from layer to layer.
    This network is actually quite popular since it means having to use little judgment
    when creating the model.


    Then what are some of the other neural networks? The common ones include the recurrent
    neural network (`RNN`), the convolutional neural network (`CNN`), and the generative
    adversarial network (`GAN`), which we’ll cover next.


    ## Recurrent Neural Network


    With a recurrent neural network (`RNN`), the function not only processes the input
    but also prior inputs across time. An example of this is what happens when you
    enter characters in a messaging app. As you begin to type, the system will predict
    the words. So if you tap out “He,” the computer will suggest “He,” “Hello,” and
    “Here’s.” The `RNN` is essentially a string of neural networks that feed on each
    other based on complex algorithms.


    There are variations on the model. One is called `LSTM`, which stands for long
    short-term memory. This came about from a paper written by professors Sepp Hochreiter
    and Jürgen Schmidhuber in 1997.^([^(58)](#fn58)) In it, they set forth a way to
    effectively use inputs that are separated from each other for long time periods,
    allowing the use of more datasets.


    Of course, `RNN`s do have drawbacks. There is the vanishing gradient problem,
    which means that the accuracy decays as the models get larger. The models can
    also take longer to train.


    To deal with this, Google developed a new model called the `Transformer`, which
    is much more efficient since it processes the inputs in parallel. It also results
    in more accurate results.


    Google has gained much insight about `RNN`s through its `Translate` app, which
    handles over 100 languages and processes over 100 billion words a day.^([^(59)](#fn59))
    Launched in 2006, it initially used machine learning systems. But in 2016, Google
    switched to deep learning by creating `Google Neural Machine Translation`.^([^(60)](#fn60))
    All in all, it has resulted in much higher accuracy rates.^([^(61)](#fn61))


    Consider how `Google Translate` has helped out doctors who work with patients
    who speak other languages. According to a study from the University of California,
    San Francisco (`UCSF`), that was published in *JAMA Internal Medicine*, the app
    had a 92% accuracy rate with English-to-Spanish translations. This was up from
    60% over the past couple years.^([^(62)](#fn62))


    ## Convolutional Neural Network (CNN)


    Intuitively, it makes sense to have all the units in a neural network to be connected.
    This works well with many applications.


    But there are scenarios where it is far from optimal, such as with image recognition.
    Just imagine how complex a model would be where every pixel is a unit! It could
    quickly become unmanageable. There would also be other complications like overfitting.
    This is where the data is not reflective of what is being tested or there is a
    focus on the wrong features.


    To deal with all this, you can use a convolutional neural network (`CNN`). The
    origins of this go back to professor Yann LeCun in 1998, when he published a paper
    called “Gradient-Based Learning Applied to Document Recognition.”^([^(63)](#fn63))
    Despite its strong insights and breakthroughs, it got little traction. But as
    deep learning started to show significant progress in 2012, researchers revisited
    the model.


    LeCun got his inspiration for the `CNN` from Nobel Prize winners David Hubel and
    Torsten Wiesel who studied neurons of the visual cortex. This system takes an
    image from the retina and processes it in different stages—from easy to more complex.
    Each of the stages is called a convolution. For example, the first level would
    be to identify lines and angles; next, the visual cortex will find the shapes;
    and then it will detect the objects.


    This is analogous to how a computer-based `CNN` works. Let’s take an example:
    Suppose you want to build a model that can identify a letter. The `CNN` will have
    input in the form of an image that has 3,072 pixels. Each of the pixels will have
    a value that is from 0 to 255, which indicates the overall intensity. By using
    a `CNN`, the computer will go through multiple variations to identify the features.


    The first is the convolutional layer, which is a filter that scans the image.
    In our example, this could be 5 × 5 pixels. The process will create a feature
    map, which is a long array of numbers. Next, the model will apply more filters
    to the image. By doing this, the `CNN` will identify the lines, edges and shapes—all
    expressed in numbers. With the various output layers, the model will use pooling,
    which combines them to generate a single output, and then create a fully connected
    neural network.


    A `CNN` can definitely get complex. But it should be able to accurately identify
    the numbers that are input into the system.'
