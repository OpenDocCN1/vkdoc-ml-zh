    ## 机器学习流程


    要将机器学习成功应用于某个问题，采取系统化的方法至关重要。否则，结果可能会严重偏离预期。


    首先，你需要经历一个数据处理流程，我们在前一章已经介绍过。完成这一步后，最好对数据进行可视化处理。数据是大多呈散乱分布？还是存在某些模式？如果答案是肯定的，那么这些数据就很有可能是机器学习的良好候选。


    机器学习流程的目标是创建一个基于一种或多种算法的模型。我们通过训练来开发这个模型，目标是让模型具备高度的可预测性。


    现在，让我们更详细地看看这个过程（顺便提一下，这也适用于我们将在下一章介绍的深度学习）：


    ### 第一步——数据排序


    如果你的数据是排序的，这可能会扭曲结果。也就是说，机器学习算法可能会将其检测为一种模式！因此，随机打乱数据顺序是个好主意。


    ### 第二步——选择模型


    你需要选择一个算法。这将是一个有根据的猜测，会涉及反复试验的过程。在本章中，我们将介绍各种可用的算法。


    ### 第三步——训练模型


    训练数据（约占完整数据集的 70%）将用于在算法中建立各种关系。例如，假设你正在构建一个机器学习系统来估算二手车的价值。一些特征将包括制造年份、品牌、型号、里程数和车况。通过处理这些训练数据，算法会计算出每个因素的权重。


    示例：假设我们使用一个线性回归算法，其格式如下：


    y = m * x + b


    在训练阶段，系统会计算出 m（即图表上的斜率）和 b（即 y 轴截距）的值。


    ### 第四步——评估模型


    你将整理出测试数据，即数据集中剩余的 30%。它应该能代表训练数据中信息的范围和类型。


    通过测试数据，你可以判断算法是否准确。在我们的二手车示例中，市场价值是否与现实世界的情况一致？


    ### 注意


    训练数据和测试数据绝不能有任何混杂。这很容易导致结果失真。有趣的是，这是一个常见的错误。


    准确率是衡量算法成功与否的一个指标。但在某些情况下，这可能会产生误导。考虑欺诈检测的情况。与数据集相比，通常只有少量特征。但遗漏一个特征可能是灾难性的，导致公司损失数百万美元。


    这就是为什么你可能想使用其他方法，比如贝叶斯定理。


    ### 第五步——微调模型


    在这一步中，我们可以调整算法中参数的值。这是为了看看我们是否能获得更好的结果。


    在微调模型时，可能还会涉及超参数。这些是无法直接从训练过程中学习到的参数。


    ## 应用算法


    有些算法计算起来相当简单，而另一些则需要复杂的步骤和数学运算。好消息是，你通常不需要自己计算算法，因为有多种语言（如 Python 和 R）可以让这个过程变得直接明了。


    至于机器学习，算法通常与传统算法不同。原因在于，第一步是处理数据——然后，计算机将开始学习。


    尽管有数百种机器学习算法可用，但它们实际上可以分为四大类：监督学习、无监督学习、强化学习和半监督学习。我们将逐一介绍。


    ### 监督学习


    监督学习使用标记数据。例如，假设我们有一组包含数千张狗的照片。如果每张照片都标明了狗的品种，那么这些数据就被认为是标记过的。在大多数情况下，这使得分析更容易，因为我们可以将结果与正确答案进行比较。


    监督学习的关键之一是需要大量的数据。这有助于完善模型并产生更准确的结果。


    但有一个大问题：现实情况是，许多可用数据并未被标记。此外，如果数据集非常庞大，提供标签可能会非常耗时。


    然而，有一些创造性的方法可以解决这个问题，比如众包。ImageNet 系统就是这样构建的，这曾是人工智能创新的一个突破。但创建它仍然花费了数年时间。


    或者，在某些情况下，可以采用自动化方法来标记数据。以 Facebook 为例。2018 年，该公司在其 F8 开发者大会上宣布，它利用了来自 Instagram
    的庞大照片数据库，这些照片都带有标签。^(⁴⁷)


    诚然，这种方法有其缺陷。一个标签可能给出照片的非视觉描述——比如 #tbt（即“Throwback Thursday”）——或者可能过于模糊，比如 #party。这就是为什么
    Facebook 称其方法为“弱监督数据”。但该公司才华横溢的工程师找到了一些提高质量的方法，例如构建一个复杂的标签预测模型。


    总而言之，结果相当不错。Facebook 的机器学习模型包含了 35 亿张照片，基于 ImageNet 识别基准的准确率达到 85.4%。这实际上是历史上记录的最高水平，高出
    2 个百分点。


    这个人工智能项目还需要创新的方法来构建基础设施。根据 Facebook 的博文：


    > 由于单台机器需要一年多的时间才能完成模型训练，我们创建了一种方法，将任务分布到多达 336 个 GPU 上，将总训练时间缩短到仅几周。随着模型规模越来越大——这项研究中最大的模型是
    ResNeXt 101-32x48d，拥有超过 8.61 亿个参数——这种分布式训练变得越来越重要。此外，我们设计了一种去除重复项的方法，以确保我们不会意外地在用于评估模型的图像上训练模型，而这个问题一直困扰着该领域的类似研究。^(⁴⁸)


    展望未来，Facebook 看到了将其方法应用于多个领域的潜力，包括以下方面：


    *   改进信息流中的排名


    *   更好地检测不良内容


    *   为视障人士自动生成描述文字

    '
- fmt: '### Unsupervised Learning


    Unsupervised learning is when you are working with unlabeled data. This means
    that you will use deep learning algorithms to detect patterns.


    By far, the most common approach for unsupervised learning is clustering, which
    takes unlabeled data and uses algorithms to put similar items into groups. The
    process usually starts with guesses, and then there are iterations of the calculations
    to get better results. At the heart of this is finding data items that are close
    together, which can be accomplished with a variety of quantitative methods:


    - `Euclidean Metric`: This is a straight line between two data points. The Euclidean
    metric is quite common with machine learning.

    - `Cosine Similarity Metric`: As the name implies, you will use a cosine to measure
    the angle. The idea is to find similarities between two data points in terms of
    the orientation.

    - `Manhattan Metric`: This involves taking the sum of the absolute distances of
    two points on the coordinates of a graph. It’s called the “Manhattan” because
    it references the city’s street layout, which allows for shorter distances for
    travel.


    In terms of use cases for clustering, one of the most common is customer segmentation,
    which is to help better target marketing messages. For the most part, a group
    that has similar characteristics is likely to share interests and preferences.


    Another application is sentiment analysis, which is where you mine social media
    data and find the trends. For a fashion company, this can be crucial in understanding
    how to adapt the styles of the upcoming line of clothes.


    Now there are other approaches than just clustering. Here’s a look at three more:


    - `Association`: The basic concept is that if X happens, then Y is likely to happen.
    Thus, if you buy my book on AI, you will probably want to buy other titles in
    the genre. With association, a deep learning algorithm can decipher these kinds
    of relationships. This can result in powerful recommendation engines.

    - `Anomaly Detection`: This identifies outliers or anomalous patterns in the dataset,
    which can be helpful with cybersecurity applications. According to Asaf Cidon,
    who is the VP of Email Security at Barracuda Networks: “We’ve found that by combining
    many different signals—such as the email body, header, the social graph of communications,
    IP logins, inbox forwarding rules, etc.—we’re able to achieve an extremely high
    precision in detecting social engineering attacks, even though the attacks are
    highly personalized and crafted to target a particular person within a particular
    organization. Machine learning enables us to detect attacks that originate from
    within the organization, whose source is a legitimate mailbox of an employee,
    which would be impossible to do with a static one-size-fits-all rule engine.”^([^(49)](#fn49))

    - `Autoencoders`: With this, the data will be put into a compressed form, and
    then it will be reconstructed. From this, new patterns may emerge. However, the
    use of autoencoders is rare. But it could be shown to be useful in helping with
    applications like reducing noise in data.


    Consider that many AI researchers believe that unsupervised learning will likely
    be critical for the next level of achievements. According to a paper in *Nature*
    by Yann LeCun, Geoffrey Hinton, and Yoshua Bengio, “We expect unsupervised learning
    to become far more important in the longer term. Human and animal learning is
    largely unsupervised: we discover the structure of the world by observing it,
    not by being told the name of every object.”^([^(50)](#fn50))


    ### Reinforcement Learning


    When you were a kid and wanted to play a new sport, chances were you did not read
    a manual. Instead, you observed what other people were doing and tried to figure
    things out. In some situations, you made mistakes and lost the ball as your teammates
    would show their displeasure. But in other cases, you made the right moves and
    scored. Through this trial-and-error process, your learning was improved based
    on positive and negative reinforcement.


    At a high level, this is analogous to reinforcement learning. It has been key
    for some of the most notable achievements in AI, such as the following:


    - `Games`: They are ideal for reinforcement learning since there are clear-cut
    rules, scores, and various constraints (like a game board). When building a model,
    you can test it with millions of simulations, which means that the system will
    quickly get smarter and smarter. This is how a program can learn to beat the world
    champion of Go or chess.

    - `Robotics`: A key is being able to navigate within a space—and this requires
    evaluating the environment at many different points. If the robot wants to move
    to, say, the kitchen, it will need to navigate around furniture and other obstacles.
    If it runs into things, there will be a negative reinforcement action.


    ### Semi-supervised Learning


    This is a mix of supervised and unsupervised learning. This arises when you have
    a small amount of unlabeled data. But you can use deep learning systems to translate
    the unsupervised data to supervised data—a process that is called pseudo-labeling.
    After this, you can then apply the algorithms.


    An interesting use case of semi-supervised learning is the interpretation of MRIs.
    A radiologist can first label the scans, and after this, a deep learning system
    can find the rest of the patterns.


    ## Common Types of Machine Learning Algorithms


    There is simply not enough room in this book to cover all the machine learning
    algorithms! Instead, it’s better to focus on the most common ones.


    In the remaining part of this chapter, we’ll take a look at those for the following:


    - `Supervised Learning`: You can boil down the algorithms to two variations. One
    is classification, which divides the dataset into common labels. Examples of the
    algorithms include Naive Bayes Classifier and k-Nearest Neighbor (neural networks
    will be covered in Chapter [4](#480660_1_En_4_Chapter.xhtml)). Next, there is
    regression, which finds continuous patterns in the data. For this, we’ll take
    a look at linear regression, ensemble modelling, and decision trees.

    - `Unsupervised Learning`: In this category, we’ll look at clustering. For this,
    we’ll cover k-Means clustering.


    Figure [3-3](#480660_1_En_3_Chapter.xhtml#Fig3) shows a general framework for
    machine learning algorithms.


    ![../images/480660_1_En_3_Chapter/480660_1_En_3_Fig3_HTML.jpg](images/480660_1_En_3_Chapter/480660_1_En_3_Fig3_HTML.jpg)


    Figure 3-3. General framework for machine learning algorithms'
