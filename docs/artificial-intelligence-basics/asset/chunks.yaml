- fmt: '# The Machine Learning Process


    To be successful with applying machine learning to a problem, it’s important to
    take a systematic approach. If not, the results could be way off base.


    First of all, you need to go through a data process, which we covered in the prior
    chapter. When this is finished, it’s a good idea to do a visualization of the
    data. Is it mostly scattered? Or are there some patterns? If the answer is yes,
    then the data could be a good candidate for machine learning.


    The goal of the machine learning process is to create a model, which is based
    on one or more algorithms. We develop this by training it. The goal is that the
    model should provide a high-degree of predictability.


    Now let’s take a closer look at this (by the way, this will also be applicable
    for deep learning, which we’ll cover in the next chapter):


    ## Step #1—Data Order


    If your data is sorted, then this could skew the results. That is, the machine
    learning algorithm may detect this as a pattern! This is why it’s a good idea
    to randomize the order of the data.


    ## Step #2—Choose a Model


    You will need to select an algorithm. This will be an educated guess, which will
    involve a process of trial and error. In this chapter, we’ll look at the various
    algorithms available.


    ## Step #3—Train the Model


    The training data, which will be about 70% of the complete dataset, will be used
    to create the relationships in the algorithm. For example, suppose you are building
    a machine learning system to find the value of a used car. Some of the features
    will include the year manufactured, make, model, mileage, and condition. By processing
    this training data, the algorithm will calculate the weights for each of these
    factors.


    Example: Suppose we are using a linear regression algorithm, which has the following
    format:


    ```

    y = m * x + b

    ```


    In the training phase, the system will come up with the values for `m` (which
    is the slope on a graph) and `b` (which is the y-intercept).


    ## Step #4—Evaluate the Model


    You will put together test data, which is the remaining 30% of the dataset. It
    should be representative of the ranges and type of information in the training
    data.


    With the test data, you can see if the algorithm is accurate. In our used car
    example, are the market values consistent with what’s happening in the real world?


    ### Note


    With the training and test data, there must not be any intermingling. This can
    easily lead to distorted results. Interestingly enough, this is a common mistake.


    Now accuracy is one measure of the success of the algorithm. But this can, in
    some cases, be misleading. Consider the situation with fraud deduction. There
    are usually a small number of features when compared to a dataset. But missing
    one could be devastating, costing a company millions of dollars in losses.


    This is why you might want to use other approaches like Bayes’ theorem.


    ## Step #5—Fine-Tune the Model


    In this step, we can adjust the values of the parameters in the algorithm. This
    is to see if we can get better results.


    When fine-tuning the model, there may also be hyperparameters. These are parameters
    that cannot be learned directly from the training process.


    # Applying Algorithms


    Some algorithms are quite easy to calculate, while others require complex steps
    and mathematics. The good news is that you usually do not have to compute an algorithm
    because there are a variety of languages like `Python` and `R` that make the process
    straightforward.


    As for machine learning, an algorithm is typically different from a traditional
    one. The reason is that the first step is to process data—and then, the computer
    will start to learn.


    Even though there are hundreds of machine learning algorithms available, they
    can actually be divided into four major categories: supervised learning, unsupervised
    learning, reinforcement learning, and semi-supervised learning. We’ll take a look
    at each.


    ## Supervised Learning


    Supervised learning uses labeled data. For example, suppose we have a set of photos
    of thousands of dogs. The data is considered to be labeled if each photo identifies
    each for the breed. For the most part, this makes it easier to analyze since we
    can compare our results with the correct answer.


    One of the keys with supervised learning is that there should be large amounts
    of data. This helps to refine the model and produce more accurate results.


    But there is a big issue: The reality is that much of the data available is not
    labeled. In addition, it could be time consuming to provide labels if there is
    a massive dataset.


    Yet there are creative ways to deal with this, such as with crowdfunding. This
    is how the `ImageNet` system was built, which was a breakthrough in AI innovation.
    But it still took several years to create it.


    Or, in some cases, there can be automated approaches to label data. Take the example
    of Facebook. In 2018, the company announced—at its F8 developers conference—it
    leveraged its enormous database of photos from Instagram, which were labeled with
    hashtags.^([^(47)](#fn47))


    Granted, this approach had its flaws. A hashtag may give a nonvisual description
    of the photo—say `#tbt` (which is “throwback Thursday)—or could be too vague,
    like `#party`. This is why Facebook called its approach “weakly supervised data.”
    But the talented engineers at the company found some ways to improve the quality,
    such as by building a sophisticated hashtag prediction model.


    All in all, things worked out quite well. Facebook’s machine learning model, which
    included 3.5 billion photos, had an accuracy rate of 85.4%, which was based on
    the `ImageNet` recognition benchmark. It was actually the highest recorded in
    history, by 2%.


    This AI project also required innovative approaches for building the infrastructure.
    According to the Facebook blog post:


    > Since a single machine would have taken more than a year to complete the model
    training, we created a way to distribute the task across up to 336 GPUs, shortening
    the total training time to just a few weeks. With ever-larger model sizes—the
    biggest in this research is a `ResNeXt 101-32x48d` with over 861 million parameters—such
    distributed training is increasingly essential. In addition, we designed a method
    for removing duplicates to ensure we don’t accidentally train our models on images
    that we want to evaluate them on, a problem that plagues similar research in this
    area.^([^(48)](#fn48))


    Going forward, Facebook sees potential in using its approach to various areas,
    including the following:


    * Improved ranking in the newsfeed

    * Better detection of objectionable content

    * Auto generation of captions for the visually impaired'
