    \ [16](#480660_1_En_2_Chapter.xhtml#Fn16_source) [17](#480660_1_En_2_Chapter.xhtml#Fn17_source)\
    \ [18](#480660_1_En_2_Chapter.xhtml#Fn18_source) [19](#480660_1_En_2_Chapter.xhtml#Fn19_source)\
