    # 9. The Future of AI


    The Pros and Cons


    At the Web Summit conference in late 2017, the legendary physicist Stephen Hawking
    offered his opinion about the future of AI. On the one hand, he was hopeful that
    the technology could outpace human intelligence. This would likely mean that many
    horrible diseases will be cured and perhaps there will be ways to deal with environmental
    problems, including climate change.


    But there was the dark side as well. Hawking talked about how the technology had
    the potential to be the “worst event in the history of our civilization.”^([^(190)](#fn190))
    Just some of the problems include mass unemployment and even killer robots. Because
    of this, he urged for ways to control AI.


    Hawking’s ideas are certainly not on the fringe. Prominent tech entrepreneurs
    like Elon Musk and Bill Gates also have expressed deep worries about AI.


    Yet there are many who are decidedly optimistic, if not exuberant. Masayoshi Son,
    who is the CEO of SoftBank and the manager of the $100 billion Vision venture
    fund, is one of them. In an interview with CNBC, he proclaimed that within 30
    years, we’ll have flying cars, people will be living much longer, and we’ll have
    cured many diseases.^([^(191)](#fn191)) He also noted that the main focus of his
    fund is on AI.


    OK then, who is right? Will the future be dystopian or utopian? Or will it be
    somewhere in the middle? Well, predicting new technologies is exceedingly difficult,
    almost impossible. Here are some examples of forecasts that have been wide off
    the mark:


    - Thomas Edison declared that AC (alternating current) would fail.^([^(192)](#fn192))

    - In his book *The Road Ahead* (published in late 1995), Bill Gates did not mention
    the Internet.

    - In 2007, Jim Balsillie, the co-CEO of Research in Motion (the creator of the
    BlackBerry device), said that the iPhone would get little traction.^([^(193)](#fn193))

    - In the iconic science fiction movie *Blade Runner*—released in 1982 and was
    set in 2019—there were many predictions that were wrong like phone booths with
    video phones and androids (or “replicants”) that were nearly indistinguishable
    from humans.


    Despite all this, there is one thing that is certain: In the coming years, we’ll
    see lots of innovation and change from AI. This seems inevitable, especially since
    there continues to be huge amounts invested in the industry.


    So then, let’s take a look at some of the areas that are likely to have an outsized
    impact on society.'
