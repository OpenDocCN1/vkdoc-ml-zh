    ## 现实世界中的机器人


    那么，现在让我们来看看工业机器人和商业机器人的其他一些有趣用例。


    ### 用例：安保


    埃里克·施伦茨和特拉维斯·戴尔都在机器人行业拥有丰富的背景，曾在谷歌和 SpaceX 等公司任职。2016 年，他们想创办自己的企业，但首先花了大量时间试图为这项技术寻找实际应用场景，这包括与众多公司进行交流。施伦茨和戴尔发现了一个共同主题：对设施物理安全的需求。机器人如何在下午
    5 点后提供保护——而无需花费大量资金雇佣保安？


    这促成了 Cobalt Robotics 的成立。时机恰到好处，因为计算机视觉、机器学习等技术正在融合，当然，机器人技术也取得了长足进步。


    虽然使用传统安全技术（比如摄像头和传感器）很有效，但它们是静态的，不一定适合实时响应。但有了机器人，由于具备移动性和底层智能，就有可能变得更加主动。


    然而，人类仍然参与其中。机器人可以发挥其擅长之处，例如全天候的数据处理和感知，而人类则可以专注于批判性思考和权衡各种方案。


    除了技术，Cobalt 在其商业模式上也有所创新，他们称之为机器人即服务（RaaS）。通过收取订阅费，这些设备对客户来说更加实惠。


    ### 用例：地板擦洗机器人


    我们可能会在相当平凡的类别中看到一些最有趣的机器人应用。话又说回来，这些机器确实非常擅长处理重复性流程。


    来看看 Brain Corp，它由尤金·伊兹克维奇博士和艾伦·格鲁伯博士于 2009 年创立。他们最初为高通和 DARPA 开发技术。但 Brain 后来利用机器学习和计算机视觉来制造自动驾驶机器人。总体而言，该公司已从高通和软银等投资者那里筹集了
    1.25 亿美元。


    Brain 的旗舰机器人是 Auto-C，它能高效地擦洗地板。由于名为 BrainOS（连接到云端）的人工智能系统，该机器能够自主导航复杂环境。只需按下一个按钮，Auto-C
    就能快速绘制出路线图。


    2018 年底，Brain 与沃尔玛达成协议，将在数百家门店部署 1500 台 Auto-C 机器人。^(¹⁵⁷) 该公司还在机场和商场部署了机器人。


    但这并不是沃尔玛正在开发的唯一机器人。该公司还在安装能够扫描货架以帮助库存管理的机器。沃尔玛在美国拥有约 4600 家门店，机器人可能会对这家零售商产生重大影响。^(¹⁵⁸)


    ### 用例：在线药房


    作为第二代药剂师，TJ·帕克亲身经历过人们在管理处方时感到的挫败感。所以他思考：解决方案可能是创建一个数字药房吗？


    他确信答案是肯定的。但尽管他在该行业有深厚的背景，他需要一位坚实的技术联合创始人，他找到了麻省理工学院的工程师埃利奥特·科恩。他们于 2013 年创立了 PillPack。


    其重点是重新构想客户体验。通过使用应用程序或访问 PillPack 网站，用户可以轻松注册——例如输入保险信息、输入处方需求以及安排配送。当用户收到包裹时，上面会有关于剂量说明的详细信息，甚至每片药丸的图片。此外，每粒药丸都附有标签，并预先分装到容器中。


    为了实现这一切，需要一个名为 PharmacyOS 的复杂技术基础设施。它还基于一个机器人网络，这些机器人位于一个 8 万平方英尺的仓库中。通过这种方式，系统可以高效地分类和包装处方。但该设施也有持证药剂师来管理流程并确保一切合规。


    2018 年 6 月，亚马逊公司斥资约 10 亿美元收购了 PillPack。消息传出后，CVS 和沃尔格林等公司的股价下跌，原因是担心这家电商巨头正准备大举进军医疗保健市场。


    ### 用例：机器人科学家


    开发处方药成本极其高昂。根据塔夫茨药物开发研究中心的研究，每个获批化合物的平均成本约为 26 亿美元。^(¹⁵⁹) 此外，由于繁琐的法规，一种新药上市通常需要十多年的时间。


    但使用先进的机器人和深度学习可能会有所帮助。要了解这一点，可以看看阿伯里斯特威斯大学和剑桥大学的研究人员所做的工作。2009 年，他们推出了亚当，这本质上是一个帮助药物发现过程的机器人科学家。几年后，他们推出了下一代机器人夏娃。


    该系统可以提出假设并进行测试，还能运行实验。但这个过程不仅仅是蛮力计算（该系统每天可以筛选超过一万种化合物）。^(¹⁶⁰) 通过深度学习，夏娃能够利用智能更好地识别那些最具潜力的化合物。例如，它能够证明三氯生——牙膏中用于防止牙菌斑堆积的常见成分——可能有效对抗疟疾中的寄生虫生长。这一点尤其重要，因为这种疾病对现有疗法的耐药性越来越强。

    '
- fmt: '# Humanoid and Consumer Robots


    The popular cartoon, *The Jetsons*, came out in the early 1960s and had a great
    cast of characters. One was Rosie, which was a robot maid that always had a vacuum
    cleaner in hand.


    Who wouldn’t want something like this? I would. But don’t expect something like
    Rosie coming to a home anytime soon. When it comes to consumer robots, we are
    still in the early days. In other words, we are instead seeing robots that have
    only some human features.


    Here are notable examples:


    *   *Sophia*: Developed by the Hong Kong–based company Hanson Robotics, this is
    perhaps the most famous. In fact, in late 2017 Saudi Arabia granted her citizenship!
    Sophia, which has the likeness of Audrey Hepburn, can walk and talk. But there
    are also subtleties with her actions, such as sustaining eye contact.

    *   *Atlas*: The developer is Boston Dynamics, which launched this in the summer
    of 2013. No doubt, Atlas has gotten much better over the years. It can, for example,
    perform backflips and pick itself up when it falls down.

    *   *Pepper*: This is a humanoid robot, created by SoftBank Robotics, that is
    focused on providing customer service, such as at retail locations. The machine
    can use gestures—to help improve communication—and can also speak multiple languages.


    As humanoid technologies get more realistic and advanced, there will inevitably
    be changes in society. Social norms about love and friendship will evolve. After
    all, as seen with the pervasiveness with smartphones, we are already seeing how
    technology can change the way we relate to people, say with texting and engaging
    in social media. According to a survey of Millennials from Tappable, close to
    10% would rather sacrifice their pinky finger than forgo their smartphone!^([^(161)](#fn161))


    As for robots, we may see something similar. It’s about social robots. Such a
    machine—which is life-like with realistic features and AI—could ultimately become
    like, well, a friend or…even a lover.


    Granted, this is likely far in the future. But as of now, there are certainly
    some interesting innovations with social robots. One example is ElliQ, which involves
    a tablet and a small robot head. For the most part, it is for those who live alone,
    such as the elderly. ElliQ can talk but also provide invaluable assistance like
    give reminders for taking medicine. The system can allow for video chats with
    family members as well.^([^(162)](#fn162))


    Yet there are certainly downsides to social robots. Just look at the awful situation
    of Jibo. The company, which had raised $72.7 million in venture funding, created
    the first social robot for the home. But there were many problems, such as product
    delays and the onslaught of knock-offs. Because of all this, Jibo filed for bankruptcy
    in 2018, and by April the following year, the servers were shut down.^([^(163)](#fn163))


    Needless to say, there were many disheartened owners of Jibo, evidenced by the
    many posts on Reddit.


    ## The Three Laws of Robotics


    Isaac Asimov, a prolific writer of many diverse subjects like science fiction,
    history, chemistry, and Shakespeare, would also have a major impact on robots.
    In a short story he wrote in 1942 (“Runaround”), he set forth his Three Laws of
    Robotics:


    1.  A robot may not injure a human being or, through inaction, allow a human being
    to come to harm.

    2.  A robot must obey the orders given to it by human beings, except where such
    orders would conflict with the First Law.

    3.  A robot must protect its own existence as long as such protection does not
    conflict with the First or Second Law.


    ### Note


    Asimov would later add another one, the zeroth law, which stated: “A robot may
    not harm humanity, or, by inaction, allow humanity to come to harm.” He considered
    this law to be the most important.


    Asimov would write more short stories that reflected how the laws would play out
    in complex situations, and they would be collected in a book called *I, Robot*.
    All these took place in the world of the 21st century.


    The Three Laws represented Asimov’s reaction to how science fiction portrayed
    robots as malevolent. But he thought this was unrealistic. Asimov had the foresight
    that there would emerge ethical rules to control the power of robots.


    As of now, Asimov’s vision is starting to become more real—in other words, it
    is a good idea to explore ethical principles. Granted, this may not necessarily
    mean that his approach is the right way. But it is a good start, especially as
    robots get smarter and more personal because of the power of AI.


    ## Cybersecurity and Robots


    Cybersecurity has not been much of a problem with robots. But unfortunately, this
    will not likely be the case for long. The main reason is that it is becoming much
    more common for robots to be connected to the cloud. The same goes for other systems,
    such as the Internet of Things or IoT, and autonomous cars. For example, many
    of these systems are updated wirelessly, which exposes them to malware, viruses,
    and even ransoms. Furthermore, when it comes to electric vehicles, there is also
    a vulnerability to attacks from the charging network.


    In fact, your data could linger within a vehicle! So if it is wrecked or you sell
    it, the information—say video, navigation details, and contacts from paired smartphone
    connections—may become available to other people. A white hat hacker, called GreenTheOnly,
    has been able to extract this data from a variety of Tesla models at junkyards,
    according to CNBC.com.^([^(164)](#fn164)) But it’s important to note that the
    company does provide options to wipe the data and you can opt out of data collection
    (but this means not having certain advantages, like over-the-air (OTA) updates).


    Now if there is a cybersecurity breach with a robot, the implications can certainly
    be devastating. Just imagine if a hacker infiltrated a manufacturing line or a
    supply chain or even a robotic surgery system. Lives could be in jeopardy.


    Regardless, there has not been much investment in cybersecurity for robots. So
    far, there are just a handful of companies, like Karamba Security and Cybereason,
    that are focused on this. But as the problems get worse, there will inevitably
    be a ramping of investments from VCs and new initiatives from legacy cybersecurity
    firms.'
