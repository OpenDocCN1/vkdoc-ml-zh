    which IBM had been developing since 1985, processed 200 million positions per
    second.


    But there were issues with expert systems. They were often narrow and difficult
    to apply across other categories. Furthermore, as the expert systems got larger,
    it became more challenging to manage them and feed data. The result was that there
    were more errors in the outcomes. Next, testing the systems often proved to be
    a complex process. Let’s face it, there were times when the experts would disagree
    on fundamental matters. Finally, expert systems did not learn over time. Instead,
    there had to be constant updates to the underlying logic models, which added greatly
    to the costs and complexities.


    By the late 1980s, expert systems started to lose favor in the business world,
    and many startups merged or went bust. Actually, this helped cause another AI
    winter, which would last until about 1993\. PCs were rapidly eating into higher-end
    hardware markets, which meant a steep reduction in Lisp-based machines.


    Government funding for AI, such as from DARPA, also dried up. Then again, the
    Cold War was rapidly coming to a quiet end with the fall of the Soviet Union.'
