    这就是普通人也能享受 AI 革命成果的方式。在未来几年里，我们如何定义工作，以及哪些活动具有经济价值，都将发生改变。我们必须接受这样一个事实：未来的工作对我们而言，可能就像坐办公室对我们的远古祖先一样陌生。但我们必须——也应该——相信人类有能力创新出新的工作形式，即使这些工作看起来不像我们熟悉的那样。但首要的一步，在一切之前，是去更多地了解这项全新的、激动人心的、且从根本上实现民主化的技术。


    > ——斯里达尔·文布，Zoho 公司联合创始人兼 CEO


    引言


    从表面上看，Uber 应用很简单。只需点击几下，你就能在几分钟内叫到一辆车。


    但在幕后，却是一个高度依赖人工智能（AI）的先进技术平台。以下是其中部分能力：


    *   一个能够理解对话的自然语言处理（NLP）系统，提供流畅的用户体验

    *   用于验证数百万张图片和文档（如驾照和餐厅菜单）的计算机视觉软件

    *   有助于提高密集城区定位精度的传感器处理算法，包括通过感知司机或乘客手机的异常移动来自动检测碰撞

    *   能够预测司机供应、乘客需求和预计到达时间（ETA）的复杂机器学习算法


    这些技术无疑令人惊叹，但也是必需的。如果没有 AI，Uber 根本无法实现其规模扩张——这其中包括处理超过 100 亿次行程。鉴于此，该公司在这项技术上投入数亿美元，并拥有一支庞大的
    AI 专家团队也就不足为奇了。^(¹)


    但 AI 并非只属于高速发展的初创公司。这项技术也正成为传统公司的关键优先事项。看看麦当劳就知道了。2019 年，该公司斥资 3 亿美元收购了科技初创公司
    Dynamic Yield。这是该公司自 1999 年收购波士顿市场以来最大的一笔交易。^(²)


    Dynamic Yield 成立于 2011 年，是利用 AI 在网页、应用和电子邮件中创建个性化客户互动体验的先驱。其部分客户包括 Hallmark 频道、宜家和丝芙兰。


    至于麦当劳，它正在进行数字化转型——而 AI 是该战略的关键部分。借助 Dynamic Yield，该公司计划利用这项技术重新构想其占收入大部分的“得来速”服务。通过分析天气、交通和时段等数据，数字菜单将动态变化以增加收入机会。看起来麦当劳还将使用地理围栏甚至车牌图像识别来增强定向能力。


    但这仅仅是个开始。麦当劳预计将把 AI 用于店内自助点餐机、标识牌以及供应链。


    该公司意识到未来既充满希望也暗藏风险。如果公司不主动拥抱新技术，最终可能会失败。看看柯达是如何对数码相机反应迟缓的。或者想想出租车行业在面对 Uber 和
    Lyft 的冲击时是如何一成不变的。


    另一方面，新技术对一家公司来说几乎可以成为灵丹妙药。但这需要坚实的战略、对可能性的充分理解以及承担风险的意愿。因此，在这本书中，我将提供有助于实现这一切的工具。


    那么，AI 的规模会有多大？根据普华永道的一项研究，到 2030 年，AI 将为全球 GDP 增加惊人的 15.7 万亿美元，这比中国和印度的产出总和还要多。该报告的作者指出：“AI
    几乎触及我们生活的方方面面。而且它才刚刚开始。” ^(³)


    诚然，在预测趋势时，可能会有很多炒作。然而，AI 可能有所不同，因为它有潜力成为一种通用技术。与此类似的是 19 世纪电力的出现，它对世界产生了变革性的影响。


    作为 AI 战略重要性的一个标志，谷歌、微软、亚马逊、苹果和 Facebook 等科技公司已在该领域进行了大量投资。例如，谷歌自称是一家“AI 优先”的公司，并已花费数十亿美元收购该领域的公司以及雇佣了数千名数据科学家。


    换句话说，越来越多的工作将需要 AI 知识。当然，这并不意味着你需要学习编程语言或理解高级统计学。但拥有扎实的基础知识将至关重要。


    至于这本书，其目标是提供能够对你的组织和职业生涯产生重大影响的可操作建议。你不会在这里找到深奥的技术解释、代码片段或公式。相反，《人工智能基础》旨在回答管理者们最关心的问题：AI
    在哪些方面有意义？有哪些陷阱？如何评估这项技术？如何启动 AI 试点项目？


    本书还从现实世界的角度审视这项技术。作为福布斯网站的撰稿人和科技领域的顾问，我的一大优势是能够与 AI 领域的许多才华横溢的人士交流——这有助于我识别行业中真正重要的东西。我还能了解到成功的案例研究和实例。


    本书的组织方式涵盖了 AI 的主要主题——你无需按顺序阅读每一章。《人工智能基础》旨在成为一本手册。


    以下是各章的简要描述：


    *   *第* *1* *章——AI 基础*：本章概述了可追溯到 20 世纪 50 年代的丰富 AI 历史。你将了解到艾伦·图灵、约翰·麦卡锡、马文·明斯基和杰弗里·辛顿等杰出的研究者和计算机科学家。还将涵盖关键概念，如用于衡量机器是否实现了真正
    AI 的图灵测试。


    *   *第* *2* *章——数据*：数据是 AI 的命脉。算法通过数据发现模式和相关性，从而提供洞察。但数据也存在陷阱，例如质量和偏差。本章提供了一个在
    AI 项目中处理数据的框架。


    *   *第* *3* *章——机器学习*：这是 AI 的一个子集，涉及回归等传统统计技术。但在本章中，我们还将涵盖高级算法，如 K 近邻（k-NN）和朴素贝叶斯分类器。除此之外，还将探讨如何构建一个机器学习模型。


    *   *第* *4* *章——深度学习*：这是 AI 的另一个子集，显然是过去十年中创新最多的领域。深度学习涉及使用神经网络来寻找模仿大脑的模式。在本章中，我们将探讨主要算法，如循环神经网络（RNN）、卷积神经网络（CNN）和生成对抗网络（GAN）。还将解释反向传播等关键概念。


    *   *第* *5* *章——机器人流程自动化*：这使用系统来自动化重复性流程，例如在客户关系管理（CRM）系统中输入数据。由于投资回报率（ROI）高，机器人流程自动化（RPA）在过去几年中经历了巨大的增长。该技术也已成为公司实施
    AI 的入门方式。

