  trans: '

    ## 相关性


    机器学习算法通常涉及数据之间的某种相关性。一种量化描述方式是使用皮尔逊相关系数，它显示两个变量之间关系的强度，取值范围为 1 到 -1（即相关系数）。


    其工作原理如下：


    *   ***大于 0***：表示一个变量增加会导致另一个变量增加。例如：假设收入与支出之间的相关系数为 0.9。如果收入增加 1000 美元，那么支出将增加
    900 美元（1000 美元 × 0.9）。


    *   ***0***：表示两个变量之间不存在相关性。


    *   ***小于 0***：表示一个变量的任何增加都会导致另一个变量的减少，反之亦然。这描述了一种反向关系。


    那么，什么是强相关性呢？根据一般经验法则，如果相关系数达到 +0.7 左右，即为强相关。如果低于 0.3，则相关性很弱。


    这一切都印证了那句老话：“相关性并不必然意味着因果关系。”然而，在机器学习中，这个概念很容易被忽视，从而导致误导性的结果。


    例如，许多相关性只是随机出现的。事实上，有些甚至相当滑稽。请看下面来自 Tylervigen.com 的例子：^(⁴³)


    *   缅因州的离婚率与人造黄油的人均消费量之间的相关性高达 99.26%。

    *   美国小姐的年龄与因蒸汽、热蒸汽和热带地区导致的谋杀案之间的相关性为 87.01%。

    *   美国从挪威进口的原油量与因与火车相撞而死亡的司机人数之间的相关性为 95.4%。


    这有一个专门的名称：模式性。这是一种在无意义的噪音中寻找模式的倾向。


    ## 特征提取


    在第 2 章中，我们讨论了为模型选择变量。这个过程通常被称为特征提取或特征工程。


    例如，一个从照片中识别男性或女性的计算机模型。对人类来说，这相当容易且快速，是一种直觉行为。但如果有人让你描述其中的差异，你能做到吗？对大多数人来说，这将是一项艰巨的任务。然而，如果我们想构建一个有效的机器学习模型，就需要正确地进行特征提取——而这可能是主观的。


    表 3-1 展示了一些关于男性面部与女性面部可能存在的差异的想法。


    表 3-1. 面部特征


    | 特征 | 男性 |

    | --- | --- |

    | 眉毛 | 更粗、更直 |

    | 脸型 | 更长、更大，更偏向方形 |

    | 下颌骨 | 方形、更宽、更棱角分明 |

    | 颈部 | 有喉结 |


    这只是冰山一角，我相信你也有自己的想法或方法。这很正常。但这也是为什么人脸识别这类事情高度复杂且容易出错的原因。


    特征提取也存在一些细微的问题。其中之一是潜在的偏差。例如，你对男性或女性的外貌是否有先入为主的观念？如果有，这可能导致模型给出错误的结果。


    鉴于所有这些原因，最好由一个专家团队来确定正确的特征。如果特征工程被证明过于复杂，那么机器学习可能不是一个好的选择。


    但还有另一种方法可以考虑：深度学习。这涉及到在数据中寻找特征的复杂模型。实际上，这也是深度学习成为人工智能领域重大突破的原因之一。我们将在下一章中了解更多。


    ## 你能用机器学习做什么？


    由于机器学习已经存在了几十年，这项强大的技术已经有了许多用途。此外，它在节省成本、创造收入和风险监控方面的明显优势也助长了其应用。


    为了让你了解其众多的应用场景，下面来看一些例子：


    *   ***预测性维护***：通过监控传感器来预测设备何时可能发生故障。这不仅有助于降低成本，还能减少停机时间并提高安全性。事实上，像 PrecisionHawk
    这样的公司正在使用无人机来收集数据，这效率要高得多。这项技术已被证明在能源、农业和建筑等行业非常有效。以下是 PrecisionHawk 对其基于无人机的预测性维护系统的描述：“一位客户测试了使用视距内（VLOS）无人机检查半径三英里内一组
    10 个井场的情况。我们的客户确定，使用无人机可将检查成本降低约 66%，从传统检查方法的每个井场 80-90 美元降至使用 VLOS 无人机任务的每个井场
    45-60 美元。”^(⁴⁴)


    *   ***招聘员工***：这可能是一个繁琐的过程，因为许多简历往往各不相同。这意味着很容易错过优秀的候选人。但机器学习可以极大地帮助解决这个问题。以 CareerBuilder
    为例，它收集并分析了超过 230 万个职位、6.8 亿个独特档案、3.1 亿份独特简历、1000 万个职位名称、13 亿项技能和 250 万次背景调查，从而构建了
    Hello to Hire 平台。这个平台利用机器学习，将成功招聘所需的平均求职申请数量减少到了 75 份。而行业平均水平约为 150 份。^(⁴⁵) 该系统还能自动创建职位描述，甚至考虑了基于行业和地点的细微差别！


    *   ***客户体验***：如今，客户希望获得个性化的体验。通过使用 Amazon.com 和 Uber 等服务，他们已经习惯了这一点。借助机器学习，公司可以利用其数据获得洞察力——了解真正有效的方法。这一点非常重要，以至于
    Kroger 收购了该领域的一家公司，名为 84.51°。该公司拥有超过 6000 万美国家庭的数据，这无疑是关键所在。这里有一个简短的案例研究：Kroger
    的大部分门店都销售散装牛油果，只有少数门店销售 4 个装。传统观点认为，由于与散装牛油果存在尺寸差异，4 个装必须打折。但应用机器学习分析后，这被证明是不正确的，因为
    4 个装吸引了新的、不同的家庭群体，如千禧一代和 ClickList 购物者。通过在连锁店中推广 4 个装，牛油果的整体销量得到了提升。^(⁴⁶)


    *   ***金融***：机器学习可以检测差异，例如在账单方面。但有一类新的技术，称为 RPA（机器人流程自动化），可以帮助解决这个问题（我们将在第 5 章中讨论这个主题）。它自动化常规流程以帮助减少错误。RPA
    也可能使用机器学习来检测异常或可疑交易。


    *   ***客户服务***：过去几年，聊天机器人得到了发展，它们使用机器学习来自动化与客户的互动。我们将在第 6 章中讨论这一点。


    *   ***约会***：机器学习可以帮助你找到灵魂伴侣！Tinder 是最大的约会应用之一，它正在使用这项技术来帮助改善匹配。例如，它有一个系统可以自动标记每天上传的超过
    100 亿张照片。


    图 3-2 展示了机器学习的一些应用。


    ![../images/480660_1_En_3_Chapter/480660_1_En_3_Fig2_HTML.jpg](img/480660_1_En_3_Fig2_HTML.jpg)


    图 3-2. 机器学习的应用

