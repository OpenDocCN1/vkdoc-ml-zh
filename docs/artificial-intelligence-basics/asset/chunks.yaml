  trans: '

    ### 生成对抗网络（GANs）


    伊恩·古德费洛在斯坦福大学获得计算机科学硕士学位，并在蒙特利尔大学获得机器学习博士学位，之后他进入谷歌工作。二十多岁时，他合著了人工智能领域的顶级著作之一《深度学习》^(⁶⁴)，并在谷歌地图方面做出了创新。


    但最具影响力的突破发生在 2014 年。当时他在蒙特利尔的一家酒吧与朋友讨论深度学习如何能够*创造*照片。^(⁶⁵) 那时，主流方法是使用生成模型，但生成的照片往往模糊不清且毫无意义。


    古德费洛意识到一定有更好的方法。那么，为什么不运用博弈论呢？也就是说，让两个模型在紧密的反馈循环中相互竞争。这种方法同样适用于未标记的数据。


    以下是基本工作流程：


    *   *生成器*：这个神经网络会创造出大量新作品，例如照片或句子。

    *   *判别器*：这个神经网络会审视这些作品，判断哪些是真实的。

    *   *调整*：根据两个结果，新模型会修改作品，使其尽可能逼真。经过多次迭代后，判别器将不再需要被使用。


    他对这个想法兴奋不已，离开酒吧后便开始编写代码实现自己的想法。结果便诞生了一种新的深度学习模型：生成对抗网络（GAN）。其效果非常出色。他很快成为了人工智能领域的摇滚明星。


    GAN 研究已经催生了超过 500 篇学术论文。^(⁶⁶) 像 Facebook 这样的公司也已将这项技术用于照片分析和处理等领域。该公司首席人工智能科学家杨立昆指出，GAN
    是“过去 20 年里深度学习中最酷的想法”。^(⁶⁷)


    GAN 还被证明有助于复杂的科学研究。例如，它们帮助提高了在瑞士欧洲核子研究中心大型强子对撞机中检测亚原子粒子行为的准确性。^(⁶⁸)


    尽管仍处于早期阶段，这项技术有望催生出能够开发新型时尚单品或新奇可穿戴设备的计算机。也许，GAN 甚至能创作出一首热门说唱歌曲。


    而这可能比你想象的要来得更快。十几岁时，罗比·巴拉特就自学了如何使用深度学习系统，并构建了一个能以坎耶·维斯特风格进行说唱的模型。


    但这只是他人工智能魔法的开始。作为斯坦福大学的研究员，他开发了自己的 GAN 平台，处理了大约 10,000 幅裸体肖像。该系统随后能够创作出真正令人着迷的新艺术作品（你可以在他的
    Twitter 账号@DrBeef_ 上找到它们）。


    哦，他还将自己的系统在 GitHub 账户上开源了。这引起了名为 Obvious 的法国艺术家团体的注意，他们利用这项技术创作了一个 18 世纪虚构家族的肖像画。该作品基于对
    14 世纪到 20 世纪的 15,000 幅肖像画的处理。


    2018 年，Obvious 将他们的作品放在佳士得拍卖行拍卖，最终以 43.2 万美元的高价成交。^(⁶⁹)


    但不幸的是，在 GAN 的应用方面，也出现了一些不那么光彩的用途。一个例子是用于深度伪造，即利用神经网络创建具有误导性的图像或视频。其中一些只是带有戏谑性质。例如，有一个
    GAN 可以让巴拉克·奥巴马说出你告诉他的任何话！


    然而，这其中存在巨大风险。纽约大学和密歇根州立大学的研究人员发表了一篇关于“深度万能指纹”的论文。^(⁷⁰) 该论文展示了 GAN 如何能够生成假指纹来解锁三种类型的智能手机！


    还有一起事件涉及女演员詹妮弗·劳伦斯在金球奖新闻发布会上的所谓深度伪造视频。她的脸被换成了史蒂夫·布西密的脸。^(⁷¹)


    ## 深度学习应用


    由于大量资金和资源投入到深度学习中，创新成果层出不穷。似乎每天都有令人惊叹的新成果发布。


    那么，有哪些具体的应用呢？深度学习在哪些领域被证明是颠覆性的？让我们来看看一些涵盖医疗、能源甚至地震等领域的应用案例。


    ### 应用案例：检测阿尔茨海默病


    尽管经过数十年的研究，阿尔茨海默病的治愈方法仍然难以捉摸。不过，科学家们已经开发出能够减缓疾病进展的药物。


    鉴于此，早期诊断至关重要——而深度学习可能大有裨益。加州大学旧金山分校放射科与生物医学成像系的研究人员利用这项技术分析脑部扫描图像（数据来自阿尔茨海默病神经影像学倡议公共数据集），并检测葡萄糖水平的变化。


    结果：该模型能够在临床诊断前最多六年诊断出阿尔茨海默病。其中一项测试显示准确率达到 92%，另一项则达到 98%。


    目前这仍处于起步阶段——还需要分析更多的数据集。但迄今为止，结果非常令人鼓舞。


    该研究的作者 Jae Ho Sohn 博士表示：


    > 这是深度学习的理想应用，因为它特别擅长发现非常细微但弥散的过程。人类放射科医生非常擅长识别像脑肿瘤这样微小的局灶性发现，但在检测更缓慢、全局性的变化方面则比较吃力。鉴于深度学习在此类应用中的优势，尤其是与人类相比，这似乎是一个很自然的应用方向。^(⁷²)


    ### 应用案例：能源


    由于其庞大的数据中心基础设施，谷歌是最大的能源消耗者之一。即使是效率上的微小提升，也能对利润产生显著影响。同时，还可能带来减少碳排放的好处。


    为了帮助实现这些目标，谷歌的 DeepMind 部门一直在应用深度学习，其中包括更好地管理风能。尽管风能是一种清洁能源，但由于天气变化，其利用可能颇具挑战性。


    但 DeepMind 的深度学习算法发挥了关键作用。将其应用于美国 700 兆瓦的风力发电中，该算法能够提前 36 小时准确预测发电量。


    根据 DeepMind 的博客：


    > 这一点很重要，因为可调度的能源（即能够在设定时间输送设定电量的能源）对电网来说通常更有价值……迄今为止，与不对电网做出时间承诺的基准情景相比，机器学习已使我们的风能价值提升了大约
    20%。^(⁷³)


    当然，这个深度学习系统的影响可能远不止于谷歌——它可能对全球的能源使用产生广泛影响。

    '
- fmt: '### Use Case: Earthquakes


    Earthquakes are extremely complicated to understand. They are also exceedingly
    difficult to predict. You need to evaluate faults, rock formations and deformations,
    electromagnetic activity, and changes in the groundwater. Hey, there is even evidence
    that animals have the ability to sense an earthquake!


    But over the decades, scientists have collected huge amounts of data on this topic.
    In other words, this could be an application for deep learning, right?


    Absolutely.


    Seismologists at Caltech, which include Yisong Yue, Egill Hauksson, Zachary Ross,
    and Men-Andrin Meier, have been doing considerable research on this, using convolutional
    neural networks and recurrent neural networks. They are trying to build an effective
    early-warning system.


    Here’s what Yue had to say:


    > AI can [analyze earthquakes] faster and more accurately than humans can, and
    even find patterns that would otherwise escape the human eye. Furthermore, the
    patterns we hope to extract are hard for rule-based systems to adequately capture,
    and so the advanced pattern-matching abilities of modern deep learning can offer
    superior performance than existing automated earthquake monitoring algorithms.^([^(74)](#fn74))


    But the key is improving data collection. This means more analysis of small earthquakes
    (in California, there is an average of 50 each day). The goal is to create an
    earthquake catalog that can lead to the creation of a virtual seismologist, who
    can make evaluations of an earthquake faster than a human. This could allow for
    faster lead times when an earthquake strikes, which may help to save lives and
    property.


    ### Use Case: Radiology


    PET scans and MRIs are amazing technology. But there are definitely downsides.
    A patient needs to stay within a confining tube for 30 minutes to an hour. This
    is uncomfortable and means being exposed to gadolinium, which has been shown to
    have harmful side effects.


    Greg Zaharchuk and Enhao Gong, who met at Stanford, thought there could be a better
    way. Zaharchuk was an MD and PhD, with a specialization in radiology. He was also
    the doctoral advisor of Gong, who was an electrical engineering PhD in deep learning
    and medical image reconstruction.


    In 2017, they co-founded Subtle Medical and hired some of the brightest imaging
    scientists, radiologists, and AI experts. Together, they set themselves to the
    challenge of improving PET scans and MRIs. Subtle Medical created a system that
    not only reduces the time for an MRI and PET scans by up to ten times, but the
    accuracy has been much higher. This was powered by high-end NVIDIA GPUs.


    Then in December 2018, the system received FDA (Federal Drug Administration) 510(k)
    clearance and a CE mark approval for the European market.^([^(75)](#fn75)) It
    was the first ever AI-based nuclear medical device to achieve both of these designations.


    Subtle Medical has more plans to revolutionize the radiology business. As of 2019,
    it is developing `SubtleMRTM`, which will be even more powerful than the company’s
    current solution, and `SubtleGADTM`, which will reduce gadolinium dosages.^([^(76)](#fn76))


    ## Deep Learning Hardware


    Regarding chip systems for deep learning, GPUs have been the primary choice. But
    as AI gets more sophisticated—such as with GANs—and the datasets much larger,
    there is certainly more room for new approaches. Companies also have custom needs,
    such as in terms of functions and data. After all, an app for a consumer is usually
    quite different than one that is focused on the enterprise.


    As a result, some of the mega tech companies have been developing their own chipsets:


    *   *Google*: In the summer of 2018, the company announced its third version of
    its Tensor Processing Unit (`TPU`; the first chip was developed in 2016).^([^(77)](#fn77))
    The chips are so powerful—handling over 100 petaflops for training of models—there
    needs to be liquid cooling in the data centers. Google has also announced a version
    of its `TPU` for devices. Essentially, it means that processing will have less
    latency because there will be no need to access the cloud.


    *   *Amazon*: In 2018, the company announced `AWS Inferentia`.^([^(78)](#fn78))
    The technology, which has come out of the acquisition of Annapurna in 2015, is
    focused on handling complex inference operations. In other words, this is what
    happens after a model has been trained.


    *   *Facebook and Intel*: These companies have joined forces to create an AI chip.^([^(79)](#fn79))
    But the initiative is still in the initial phases. Intel also has been getting
    traction with an AI chip called the `Nervana Neural Network Processor (NNP)`.


    *   *Alibaba*: The company has created its own AI chip company called Pingtouge.^([^(80)](#fn80))
    It also has plans to build a quantum computer processor, which is based on qubits
    (they represent subatomic particles like electrons and photons).


    *   *Tesla*: Elon Musk has developed his own AI chip. It has 6 billion transistors
    and can process 36 trillion operations per second.^([^(81)](#fn81))


    There are a variety of startups that are making a play for the AI chip market
    as well. Among the leading companies is Untether AI, which is focused on creating
    chips that boost the transfer speeds of data (this has been a particularly difficult
    part of AI). In one of the company’s prototypes, this process was more than 1,000
    faster than a typical AI chip.^([^(82)](#fn82)) Intel, along with other investors,
    participated in a $13 million round of funding in 2019.


    Now when it comes to AI chips, NVIDIA has the dominant market share. But because
    of the importance of this technology, it seems inevitable that there will be more
    and more offerings that will come to the market.'
