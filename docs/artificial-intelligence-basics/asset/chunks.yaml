    on routine tasks. But with RPA, companies can often get a strong ROI (Return on
    Investment)—so long as the implementation is done right.


    Here are some other advantages:


    *   *Customer Satisfaction*: RPA means minimal errors as well as high speed. A
    bot also works 24/7\. This means that customer satisfaction scores—like the NPS
    (Net Promoter Score)—should improve. Note that increasingly more customers, such
    as from the Millennial generation, prefer to deal with apps/web sites, not people!
    RPA also means that reps will have more time to spend on value-added tasks, instead
    of dealing with the tedious matters that waste time.


    *   *Scalability*: Once a bot is created, it can be quickly expanded to meet spikes
    in activity. This can be critical for seasonal businesses like retailers.


    *   *Compliance*: For people, it’s tough to keep track of rules, regulations,
    and laws. Even worse, they often change. But with RPA, compliance is built into
    the process—and is always followed. This can be a major benefit in terms of avoiding
    legal problems and fines.


    *   *Insights and Analytics*: Next-generation RPA platforms come equipped with
    sophisticated dashboards, which focus on KPIs for your business. You can also
    set up alerts if there are any problems.


    *   *Legacy Systems*: Older companies are often bogged down with old IT systems,
    which makes it extremely tough to pull off a digital transformation. But RPA software
    is able to work fairly well with legacy IT environments.


    *   *Data*: Because of the automation, the data is much cleaner as there are minimal
    input errors. This means that organizations will—over time—have more accurate
    understandings of their businesses. The data quality will also increase the likelihood
    of success of AI implementations.


    While all this is great, RPA still has its drawbacks. For example, if you have
    current processes that are inefficient and you rush to implement the RPA system,
    you will be essentially replicating a bad approach! This is why it is critical
    to evaluate your workflows before implementing a system.


    But there are certainly other potential landmines to note, such as the following:


    *   *Brittleness*: RPA can easily break if there are changes in the underlying
    applications. This could also be the case if there are changes in procedures and
    regulations. It’s true that newer systems are getting better at adapting and may
    also leverage APIs. But RPA is not about hands-off activity.


    *   *Virtualized Apps*: This type of software, such as from Citrix, can be difficult
    with RPA systems because they cannot effectively capture the processes. The reason
    is that the data is stored on an outside server and the output is a snapshot on
    a monitor. But some companies are using AI to solve the problem, such as UiPath.
    The company has created a system, called “Pragmatic AI,” which uses computer vision
    to interpret the screen snapshots to record the processes.


    *   *Specialization*: Many RPA tools are for general-purpose activities. But there
    may be areas that require specialization, such as with finance. In this case,
    you may look at a niche software app that can handle it.


    *   *Testing*: This is absolutely critical. You want to first sample some transactions
    to make sure the system is working correctly. After this, you can do a more extensive
    rollout of the RPA system.


    *   *Ownership*: The temptation is to have IT own the RPA implementation and management.
    But this is probably not advisable. The reason? RPA systems are fairly low tech.
    After all, they can be developed by nonprogrammers. Because of this, the business
    managers are ideal for owning the process since they can generally handle the
    technical issues and also have a firmer grasp of the employee workflows.


    *   *Resistance*: Change is always difficult. With RPA, there may be fears that
    the technology will displace jobs. This means you need to have a clear set of
    messages, which focus on the benefits of the technology. For example, RPA will
    mean more time to focus on important matters, which should make a person’s job
    more interesting and meaningful.


    ## What Can You Expect from RPA?


    When it comes to RPA, the industry is still in the early phases. Yet there are
    clear signs that the technology is making a big difference for many companies.


    Take a look at the research report from Computer Economics Technology, which included
    roughly 250 companies (they were across many industries and had revenues that
    were from $20 million to over $1 billion). Of those that implemented an RPA system,
    about half reported a positive return within 18 months of deployment. This is
    definitely standout for enterprise software, which can be challenging in getting
    adoption.^([^(95)](#fn95))


    And to get a sense of the strategic importance of this technology, look to see
    what the US Defense Department—which is engaged in over 500 AI projects—is doing.
    Here’s what the agency’s Joint Artificial Intelligence Center director, Air Force
    Lt. Gen. Jack Shanahan, had to say during a Congressional hearing:


    *   When you talk about smart automation, or in the vernacular of the industry,
    Robotic Process Automation, it’s not headline grabbing in terms of big AI projects,
    but it may be where the most efficiencies can be found. That’s the case if you
    read some of the dailies in industry, whether it’s in medicine or finance, this
    is where early gains are being realized in AI. Some of the other projects we take
    on in the department are probably years in the making in return on investment.^([^(96)](#fn96))


    Despite all this, there are still many failed RPA implementations as well. Ernst
    & Young, for example, has received large amount of consulting business because
    of this. Based on this experience, the failure rate for initial RPA projects ranges
    from 30% to 50%.^([^(97)](#fn97))


    But this is inevitable with any type of enterprise software system. Yet so far,
    the problems appear mostly to be about planning, strategy, and expectations—not
    the technology.


    Another problem is that the hype surrounding RPA may be raising expectations to
    excessive levels. This means that disappointment will be fairly common, even if
    implementations are successful!


    Of course, technologies are not cure-alls. And they require much time, effort,
    and diligence to work.


    ## How to Implement RPA


    Then what are some steps to take for a successful RPA implementation? There is
    no standard answer, but there are certainly some best practices emerging:


    *   Determine the right functions to automate.


    *   Assess the processes.


    *   Select the RPA vendor and deploy the software.


    *   Set in place a team to manage the RPA platform.


    Let’s take a closer look at each of these.'
