    and Dr. Allen Gruber. They initially developed their technology for Qualcomm and
    DARPA. But Brain has since gone on to leverage machine learning and computer vision
    for self-driving robots. In all, the company has raised $125 million from investors
    like Qualcomm and SoftBank.


