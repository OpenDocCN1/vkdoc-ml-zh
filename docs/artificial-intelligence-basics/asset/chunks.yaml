    \ AI. Examples included the following:\n\n*   *SAINT or Symbolic Automatic INTegrator\
    \ (1961)*: This program, created by MIT researcher James Slagle, helped to solve\
    \ freshman calculus problems. It would be updated into other programs, called\
    \ SIN and MACSYMA, that did much more advanced math. SAINT was actually the first\
    \ example of an expert system , a category of AI we’ll cover later in this chapter.\n\
    \n*   *ANALOGY (1963)*: This program was the creation of MIT professor Thomas\
    \ Evans. The application demonstrated that a computer could solve analogy problems\
    \ of an IQ test.\n\n*   *STUDENT (1964)*: Under the supervision of Minsky at MIT,\
    \ Daniel Bobrow created this AI application for his PhD thesis. The system used\
    \ Natural Language Processing (NLP) to solve algebra problems for high school\
    \ students.\n\n*   *ELIZA (1965)*: MIT professor Joseph Weizenbaum designed this\
    \ program, which instantly became a big hit. It even got buzz in the mainstream\
    \ press. It was named after Eliza (based on George Bernard Shaw’s play *Pygmalion*)\
    \ and served as a psychoanalyst. A user could type in questions, and ELIZA would\
    \ provide counsel (this was the first example of a chatbot). Some people who used\
    \ it thought the program was a real person, which deeply concerned Weizenbaum\
    \ since the underlying technology was fairly basic. You can find examples of ELIZA\
    \ on the web, such as at [`http://psych.fullerton.edu/mbirnbaum/psych101/Eliza.htm`](http://psych.fullerton.edu/mbirnbaum/psych101/Eliza.htm)\
    \ .\n\n*   *Computer Vision (1966)*: In a legendary story, MIT’s Marvin Minsky\
    \ said to a student, Gerald Jay Sussman, to spend the summer linking a camera\
    \ to a computer and getting the computer to describe what it saw. He did just\
    \ that and built a system that detected basic patterns. It was the first use of\
    \ computer vision.\n\n*   *Mac Hack (1968)*: MIT professor Richard D. Greenblatt\
    \ created this program that played chess. It was the first to play in real tournaments\
    \ and got a C-rating.\n\n*   *Hearsay I (Late 1960s)*: Professor Raj Reddy developed\
    \ a continuous speech recognition system. Some of his students would then go on\
    \ to create Dragon Systems, which became a major tech company.\n\nDuring this\
    \ period, there was a proliferation of AI academic papers and books. Some of the\
    \ topics included Bayesian methods, machine learning, and vision.\n\nBut there\
    \ were generally two major theories about AI. One was led by Minsky, who said\
    \ that there needed to be symbolic systems. This meant that AI should be based\
    \ on traditional computer logic or preprogramming—that is, the use of approaches\
    \ like If-Then-Else statements.\n\nNext, there was Frank Rosenblatt, who believed\
    \ that AI needed to use systems similar to the brain like neural networks (this\
    \ field was also known as connectionism). But instead of calling the inner workings\
    \ neurons, he referred to them as perceptrons. A system would be able to learn\
    \ as it ingested data over time.\n\nIn 1957, Rosenblatt created the first computer\
    \ program for this, called the Mark 1 Perceptron. It included cameras to help\
    \ to differentiate between two images (they had 20 × 20 pixels). The Mark 1 Perceptron\
    \ would use data that had random weightings and then go through the following\
    \ process:\n\n1.  Take in an input and come up with the perceptron output.\n\n\
    2.  If there is not a match, then\n    1.  If the output should have been 0 but\
    \ was 1, then the weight for 1 will be decreased.\n\n2.  If the output should\
    \ have been 1 but was 0, then the weight for 1 will be increased.\n\n3.  Repeat\
    \ steps #1 and #2 until the results are accurate.\n\nThis was definitely pathbreaking\
    \ for AI. The *New York Times* even had a write-up for Rosenblatt, extolling “The\
    \ Navy revealed the embryo of an electronic computer today that it expects will\
    \ be able to walk, talk, see, write, reproduce itself and be conscious of its\
    \ existence.”^([^(10)](#fn10))\n\nBut there were still nagging issues with the\
    \ perceptron. One was that the neural network had only one layer (primarily because\
    \ of the lack of computation power at the time). Next, brain research was still\
    \ in the nascent stages and did not offer much in terms of understanding cognitive\
    \ ability.\n\nMinsky would co-write a book, along with Seymour Papert, called\
    \ *Perceptrons* (1969). The authors were relentless in attacking Rosenblatt’s\
    \ approach, and it quickly faded away. Note that in the early 1950s Minsky developed\
    \ a crude neural net machine, such as by using hundreds of vacuum tubes and spare\
    \ parts from a B-24 bomber. But he saw that the technology was nowhere at a point\
    \ to be workable.\n\nRosenblatt tried to fight back, but it was too late. The\
    \ AI community quickly turned sour on neural networks. Rosenblatt would then die\
    \ a couple years later in a boating accident. He was 43 years old.\n\nYet by the\
    \ 1980s, his ideas would be revived—which would lead to a revolution in AI, primarily\
    \ with the development of deep learning.\n\nFor the most part, the Golden Age\
    \ of AI was freewheeling and exciting. Some of the brightest academics in the\
    \ world were trying to create machines that could truly think. But the optimism\
    \ often went to the extremes. In 1965, Simon said that within 20 years, a machine\
    \ could do anything a human could. Then in 1970, in an interview with *Life* magazine,\
    \ he said this would happen in only 3–8 years (by the way, he was an advisor on\
    \ the *2001: A Space Odyssey* movie).\n\nUnfortunately, the next phase of AI would\
    \ be much darker. There were more academics who were becoming skeptical. Perhaps\
    \ the most vocal was Hubert Dreyfus, a philosopher. In books such as *What Computers\
    \ Still Can’t Do: A Critique of Artificial Reason,*^([^(11)](#fn11)) he set forth\
    \ his ideas that computers were not similar to the human brain and that AI would\
    \ woefully fall short of the lofty expectations."
  trans: "\n## 人工智能的黄金时代\n\n从 1956 年到 1974 年，人工智能领域是科技界最热门的领域之一。一个主要的催化剂是计算机技术的快速发展。它们从基于真空管的庞大系统，转变为运行在集成电路上的更小系统，速度更快，存储容量也更大。\n\
    \n联邦政府也在大力投资新技术。部分原因是阿波罗太空计划的宏伟目标以及冷战的严苛需求。\n\n至于人工智能，主要的资金来源是高级研究计划局（ARPA），该机构是在苏联发射人造卫星带来的冲击之后，于\
    \ 20 世纪 50 年代末成立的。项目支出通常要求很少，目标是激发突破性创新。ARPA 的领导人之一 J. C. R. 利克莱德有一句座右铭：“资助人才，而非项目。”大部分资金主要流向了斯坦福大学、麻省理工学院、林肯实验室和卡内基梅隆大学。\n\
    \n除了 IBM，私营部门对人工智能发展的参与很少。请记住，到 20 世纪 50 年代中期，IBM 开始收缩业务，专注于其计算机的商业化。实际上，客户担心这项技术会导致大量失业，因此\
    \ IBM 不想因此受到指责。\n\n换句话说，人工智能领域的许多创新都源于学术界。例如，1959 年，纽厄尔、肖和西蒙通过开发一个名为“通用问题求解器”的程序，继续推动人工智能领域的边界。顾名思义，该程序旨在解决数学问题，例如汉诺塔。\n\
    \n但还有许多其他程序试图实现某种程度的强人工智能。例如：\n\n*   *SAINT 或符号自动积分器（1961 年）*：这个由麻省理工学院研究员詹姆斯·斯拉格创建的程序，帮助解决大学一年级的微积分问题。它后来被更新为其他程序，称为\
    \ SIN 和 MACSYMA，用于处理更高级的数学问题。SAINT 实际上是专家系统的第一个例子，我们将在本章后面介绍这一类人工智能。\n\n*   *ANALOGY（1963\
    \ 年）*：这个程序由麻省理工学院教授托马斯·埃文斯创建。该应用程序证明计算机可以解决智商测试中的类比问题。\n\n*   *STUDENT（1964 年）*：在麻省理工学院明斯基的指导下，丹尼尔·博布罗为其博士论文创建了这个人工智能应用程序。该系统使用自然语言处理（NLP）来为高中生解决代数问题。\n\
    \n*   *ELIZA（1965 年）*：麻省理工学院教授约瑟夫·维森鲍姆设计了这款程序，它迅速风靡一时，甚至在主流媒体中也引起了轰动。它以伊丽莎（源自萧伯纳的戏剧《卖花女》）命名，扮演心理分析师的角色。用户可以输入问题，ELIZA\
    \ 会提供咨询（这是聊天机器人的第一个例子）。一些使用过它的人认为该程序是真人，这令维森鲍姆深感担忧，因为底层技术相当基础。你可以在网上找到 ELIZA 的例子，例如在[`http://psych.fullerton.edu/mbirnbaum/psych101/Eliza.htm`](http://psych.fullerton.edu/mbirnbaum/psych101/Eliza.htm)。\n\
    \n*   *计算机视觉（1966 年）*：在一个传奇故事中，麻省理工学院的马文·明斯基对学生杰拉德·杰伊·萨斯曼说，让他花一个夏天的时间将相机连接到计算机，并让计算机描述它所看到的东西。他确实做到了，并构建了一个能够检测基本模式的系统。这是计算机视觉的首次应用。\n\
    \n*   *Mac Hack（1968 年）*：麻省理工学院教授理查德·D·格林布拉特创建了这个下国际象棋的程序。它是第一个参加正式锦标赛的程序，并获得了\
    \ C 级评级。\n\n*   *Hearsay I（20 世纪 60 年代末）*：拉吉·雷迪教授开发了一个连续语音识别系统。他的一些学生后来创立了龙系统公司，该公司成为一家重要的科技公司。\n\
    \n在此期间，人工智能领域的学术论文和书籍大量涌现。一些主题包括贝叶斯方法、机器学习和视觉。\n\n但关于人工智能，通常有两种主要理论。一种由明斯基领导，他认为需要符号系统。这意味着人工智能应该基于传统的计算机逻辑或预编程——即使用诸如\
    \ If-Then-Else 语句之类的方法。\n\n另一种是弗兰克·罗森布拉特，他认为人工智能需要使用类似于大脑的系统，比如神经网络（这个领域也被称为联结主义）。但他没有将内部工作机制称为神经元，而是称之为感知器。一个系统将能够在随时间摄取数据的过程中学习。\n\
    \n1957 年，罗森布拉特为此创建了第一个计算机程序，称为 Mark 1 感知器。它包括摄像头，用于帮助区分两个图像（它们有 20×20 像素）。Mark\
    \ 1 感知器将使用具有随机权重的数据，然后经历以下过程：\n\n1.  接收输入并得出感知器输出。\n2.  如果不匹配，则\n    1.  如果输出应为\
    \ 0 但却是 1，则权重 1 将减小。\n    2.  如果输出应为 1 但却是 0，则权重 1 将增大。\n3.  重复步骤#1 和#2，直到结果准确。\n\
    \n这对人工智能来说无疑是开创性的。《纽约时报》甚至为罗森布拉特写了一篇报道，称赞“海军今天展示了一台电子计算机的雏形，预计它将能够行走、说话、观看、书写、自我复制，并意识到自己的存在。”^(¹⁰)\n\
    \n但感知器仍然存在一些棘手的问题。一个是神经网络只有一层（主要是因为当时缺乏计算能力）。其次，大脑研究仍处于起步阶段，在理解认知能力方面提供的帮助不多。\n\
    \n明斯基与西摩·帕珀特合著了一本书，名为《感知器》（1969 年）。作者们毫不留情地攻击罗森布拉特的方法，该方法很快就销声匿迹了。请注意，在 20 世纪\
    \ 50 年代初期，明斯基开发了一台粗糙的神经网络机器，例如使用了数百个真空管和 B-24 轰炸机的备件。但他看到这项技术远未达到可行的程度。\n\n罗森布拉特试图反击，但为时已晚。人工智能界很快对神经网络失去了兴趣。几年后，罗森布拉特在一次划船事故中去世，年仅\
    \ 43 岁。\n\n然而，到了 20 世纪 80 年代，他的想法得以复兴——这导致了人工智能的革命，主要是深度学习的发展。\n\n总的来说，人工智能的黄金时代是自由奔放和激动人心的。世界上一些最聪明的学者正试图创造能够真正思考的机器。但这种乐观情绪常常走向极端。1965\
    \ 年，西蒙说，在 20 年内，机器可以做人类能做的任何事情。然后在 1970 年，在接受《生活》杂志采访时，他说这将在 3 到 8 年内发生（顺便说一句，他是电影《2001：太空漫游》的顾问）。\n\
    \n不幸的是，人工智能的下一个阶段要暗淡得多。越来越多的学者开始持怀疑态度。也许最直言不讳的是哲学家休伯特·德雷福斯。在《计算机仍然不能做什么：对人工智能理性的批判》^(¹¹)等书中，他阐述了自己的观点：计算机与人脑并不相似，人工智能将可悲地无法达到崇高的期望。\n"
- fmt: '# AI Winter


    During the early 1970s, the enthusiasm for AI started to wane. It would become
    known as the “AI winter,” which would last through 1980 or so (the term came from
    “nuclear winter,” an extinction event where the sun is blocked and temperatures
    plunge across the world).


    Even though there were many strides made with AI, they still were mostly academic
    and involved in controlled environments. At the time, the computer systems were
    still limited. For example, a `DEC PDP-11/45`—which was common for AI research—had
    the ability to expand its memory to only `128K`.


    The `Lisp` language also was not ideal for computer systems. Rather, in the corporate
    world, the focus was primarily on `FORTRAN`.


    Next, there were still many complex aspects when understanding intelligence and
    reasoning. Just one is disambiguation. This is the situation when a word has more
    than one meaning. This adds to the difficulty for an AI program since it will
    also need to understand the context.


    Finally, the economic environment in the 1970s was far from robust. There were
    persistent inflation, slow growth, and supply disruptions, such as with the oil
    crisis.


    Given all this, it should be no surprise that the US government was getting more
    stringent with funding. After all, for a Pentagon planner, how useful is a program
    that can play chess, solve a theorem, or recognize some basic images?


    Not much, unfortunately.


    A notable case is the Speech Understanding Research program at Carnegie Mellon
    University. For the Defense Advanced Research Projects Agency (DARPA), it thought
    this speech recognition system could be used for fighter pilots to make voice
    commands. But it proved to be unworkable. One of the programs, which was called
    `Harpy`, could understand 1,011 words—which is what a typical 3-year-old knows.


    The officials at DARPA actually thought that it had been hoodwinked and eliminated
    the $3 million annual budget for the program.


    But the biggest hit to AI came via a report—which came out in 1973—from Professor
    Sir James Lighthill. Funded by the UK Parliament, it was a full-on repudiation
    of the “grandiose objectives” of strong AI. A major issue he noted was “combinatorial
    explosion,” which was the problem where the models got too complicated and were
    difficult to adjust.


    The report concluded: “In no part of the field have the discoveries made so far
    produced the major impact that was then promised.”^([^(12)](#fn12)) He was so
    pessimistic that he did not believe computers would be able to recognize images
    or beat a chess grand master.


    The report also led to a public debate that was televised on the BCC (you can
    find the videos on YouTube). It was Lighthill against Donald Michie, Richard Gregory,
    and John McCarthy.


    Even though Lighthill had valid points—and evaluated large amounts of research—he
    did not see the power of weak AI. But it did not seem to matter as the winter
    took hold.


    Things got so bad that many researchers changed their career paths. And as for
    those who still studied AI, they often referred to their work with other terms—like
    machine learning, pattern recognition, and informatics!


    # The Rise and Fall of Expert Systems


    Even during the AI winter, there continued to be major innovations. One was backpropagation,
    which is essential for assigning weights for neural networks. Then there was the
    development of the recurrent neural network (RNN). This allows for connections
    to move through the input and output layers.


    But in the 1980s and 1990s, there also was the emergence of expert systems. A
    key driver was the explosive growth of PCs and minicomputers.


    Expert systems were based on the concepts of Minsky’s symbolic logic, involving
    complex pathways. These were often developed by domain experts in particular fields
    like medicine, finance, and auto manufacturing.


    Figure [1-2](#480660_1_En_1_Chapter.xhtml#Fig2) shows the key parts of an expert
    system.


    ![../images/480660_1_En_1_Chapter/480660_1_En_1_Fig2_HTML.jpg](images/480660_1_En_1_Chapter/480660_1_En_1_Fig2_HTML.jpg)


    Figure 1-2.


    Key parts of an expert system


    While there are expert systems that go back to the mid-1960s, they did not gain
    commercial use until the 1980s. An example was `XCON` (eXpert CONfigurer), which
    John McDermott developed at Carnegie Mellon University. The system allowed for
    optimizing the selection of computer components and initially had about 2,500
    rules. Think of it as the first recommendation engine. From the launch in 1980,
    it turned out to be a big cost saver for DEC for its line of VAX computers (about
    $40 million by 1986).


    When companies saw the success of `XCON`, there was a boom in expert systems—turning
    into a billion-dollar industry. The Japanese government also saw the opportunity
    and invested hundreds of millions to bolster its home market. However, the results
    were mostly a disappointment. Much of the innovation was in the United States.


    Consider that IBM used an expert system for its `Deep Blue` computer. In 1996,
    it would beat grand chess master Garry Kasparov, in one of six matches. `Deep
    Blue`, which IBM had been developing since 1985, processed 200 million positions
    per second.


    But there were issues with expert systems. They were often narrow and difficult
    to apply across other categories. Furthermore, as the expert systems got larger,
    it became more challenging to manage them and feed data. The result was that there
    were more errors in the outcomes. Next, testing the systems often proved to be
    a complex process. Let’s face it, there were times when the experts would disagree
    on fundamental matters. Finally, expert systems did not learn over time. Instead,
    there had to be constant updates to the underlying logic models, which added greatly
    to the costs and complexities.


    By the late 1980s, expert systems started to lose favor in the business world,
    and many startups merged or went bust. Actually, this helped cause another AI
    winter, which would last until about 1993. PCs were rapidly eating into higher-end
    hardware markets, which meant a steep reduction in Lisp-based machines.


    Government funding for AI, such as from DARPA, also dried up. Then again, the
    Cold War was rapidly coming to a quiet end with the fall of the Soviet Union.'
