- fmt: '*   *Common Sense*: This is something deep learning does not do well. If anything,
    this means a model can be easily confused. For example, let’s say you ask an AI
    system, “Is it possible to make a computer with a sponge?” For the most part,
    it will probably not know that this is a ridiculous question.

    *   *Causation*: Deep learning is unable to determine this. It’s all about finding
    correlations.

    *   *Prior Knowledge*: `CNNs` can help with some prior information, but this is
    limited. Deep learning is still fairly self-contained, as it only solves one problem
    at a time. It cannot take in the data and create algorithms that span various
    domains. In addition, a model does not adapt. If there is change in the data,
    then a new model needs to be trained and tested. And finally, deep learning does
    not have prior understanding of what people know instinctively—such as basic physics
    of the real world. This is something that has to be explicitly programmed into
    an AI system.

    *   *Static*: Deep learning works best in environments that are fairly simple.
    This is why AI has been so effective with board games, which have a clear set
    of rules and boundaries. But the real world is chaotic and unpredictable. This
    means that deep learning may fall short with complex problems, even with self-driving
    cars.

    *   *Resources*: A deep learning model often requires a tremendous amount of CPU
    power, such as with `GPUs`. This can get costly. Although, one option is to use
    a third-party cloud service.


    This is quite a lot? It’s true. But the paper still has left out some drawbacks.
    Here are a couple other ones:


    *   *Butterfly Effect*: Because of the complexity of the data, networks, and connections,
    a minute change can have a major impact in the results of the deep learning model.
    This could easily lead to conclusions that are wrong or misleading.

    *   *Overfitting*: We explained this concept earlier in the chapter.


    As for Marcus, his biggest fear is that AI could “get trapped in a local minimum,
    dwelling too heavily in the wrong part of intellectual space, focusing too much
    on the detailed exploration of a particular class of accessible but limited models
    that are geared around capturing low-hanging fruit—potentially neglecting riskier
    excursions that might ultimately lead to a more robust path.”


    However, he is not a pessimist. He believes that researchers need to go beyond
    deep learning and find new techniques that can solve tough problems.


    ## Conclusion


    While Marcus has pointed out the flaws in deep learning, the fact is that this
    AI approach is still extremely powerful. In less than a decade, it has revolutionized
    the tech world—and is also significantly impacting areas like finance, robotics,
    and healthcare.


    With the surge in investments from large tech companies and VCs, there will be
    further innovation with the models. This will also encourage engineers to get
    postgraduate degrees, creating a virtuous cycle of breakthroughs.


    ## Key Takeaways


    *   Deep learning, which is a subfield of machine learning, processes huge amounts
    of data to detect relationships and patterns that humans are often unable to detect.
    The word “deep” describes the number of hidden layers.

    *   An artificial neural network (`ANN`) is a function that includes units that
    have weights and are used to predict values in an AI model.

    *   A hidden layer is a part of a model that processes incoming data.

    *   A feed-forward neural network has data that goes only from input to the hidden
    layer to the output. The results do not cycle back. Yet they can go into another
    neural network.

    *   An activation function is non-linear. In other words, it tends to do a better
    job of reflecting the real world.

    *   A sigmoid is an activation function that compresses the input value into a
    range of 0–1, which makes it easier for analysis.

    *   Backpropagation is a sophisticated technique to adjust the weights in a neural
    network. This approach has been critical for the growth in deep learning.

    *   A recurrent neural network (`RNN`) is a function that not only processes the
    input but also prior inputs across time.

    *   A convolutional neural network (`CNN`) analyzes data section by section (that
    is, by convolutions). This model is geared for complex applications like image
    recognition.

    *   A generative adversarial network or `GAN` is where two neural networks compete
    with each other in a tight feedback loop. The result is often the creation of
    a new object.

    *   Explainability describes techniques for transparency with complex deep learning
    models.


