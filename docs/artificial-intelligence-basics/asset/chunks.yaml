    # 7. Physical Robots


    The Ultimate Manifestation of AI


    In the city of Pasadena, I went to CaliBurger for lunch and noticed a crowd of
    people next to the area where the food was being cooked—which was behind glass.
    The people were taking photos with their smartphones!


    Why? The reason was Flippy, an AI-powered robot that can cook burgers.


    I was there at the restaurant with David Zito, the CEO and co-founder of the company
    Miso Robotics that built the system. “Flippy helps improve the quality of the
    food because of the consistency and reduces production costs,” he said. “We also
    built the robot to be in strict compliance with regulatory standards.”^([^(136)](#fn136))


    After lunch, I walked over to the lab for Miso Robotics, which included a testing
    center with sample robots. It was here that I saw the convergence of software
    AI systems and physical robots. The engineers were building Flippy’s brain, which
    was uploaded to the cloud. Just some of the capabilities included washing down
    utensils and the grill, learning to adapt to problems with cooking, switching
    between a spatula for raw meat and one for cooked meat, and placing baskets in
    the fryer. All this was being done in real-time.


    But the food service industry is just one of the many areas that will be greatly
    impacted by robotics and AI.


    According to International Data Corporation (IDC), the spending on robotics and
    drones is forecasted to go from $115.7 billion in 2019 to $210.3 billion by 2022.^([^(137)](#fn137))
    This represents a compound annual growth rate of 20.2%. About two thirds of the
    spending will be for hardware systems.


    In this chapter, we’ll take a look at physical robots and how AI will transform
    the industry.'
