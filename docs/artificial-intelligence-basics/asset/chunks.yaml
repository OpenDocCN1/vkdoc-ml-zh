    正如本书所展示的，人工智能（AI）的采用将成为人类历史上的一个重大转折点。与其他同样具有开创性的技术一样，如何管理它以及谁能够使用它，将塑造未来几代人的社会形态。然而，AI
    与 19 世纪和 20 世纪的其他变革性技术——如蒸汽机、电网、基因组学、计算机和互联网——有所不同，因为它并不完全依赖于极其昂贵的物理基础设施来实现普及；毕竟，它的许多好处可以通过我们随身携带的现有硬件来传递。相反，AI
    技术大规模普及的根本限制因素在于我们共享的知识基础设施：教育、理解和远见。


    这是一个关键的区别，因为如果处理得当，AI 可以成为一种广泛的民主化力量。它已经并将继续从我们的生活中消除过去的苦差事，释放出巨大的人类能量和资本。但那个“如果”远非确定无疑。不负责任地应用
    AI 可能会破坏世界大部分地区的经济稳定，正如许多人担心的那样，导致劳动力萎缩、中产阶级购买力下降，以及一个缺乏广泛稳定基础、由无休止的债务螺旋驱动的经济。


    然而，在我们对 AI 陷入悲观之前，我们应该回顾一下历史。尽管 AI 的变革能力具有历史意义——而且它确实是历史性的——但同样的问题几十年来甚至几个世纪以来一直在经济格局中发挥作用。毕竟，AI
    是自亨利·福特以来一直存在的自动化趋势的延伸。事实上，Zoho 本身就诞生于自动化与平等主义经济原则之间的张力之中。早在 21 世纪初，我们就意识到一个塑造了我们技术方法的理念：普通人——无论是国内还是国外的小企业主——应该能够使用与《财富》500
    强公司相同的先进业务自动化工具；否则，大量人口将被排除在经济体系之外。


    当时，强大的数字软件几乎无一例外地被严格的合同、高昂的费用结构和复杂的本地部署实施所限制。大公司能够承担此类系统的负担，而较小的运营商则被拒之门外，使他们处于巨大的劣势。我们试图通过将技术的承诺开放给越来越广泛的受众来打破这种局面。在过去的二十年里，我们致力于利用云技术的可扩展性，在不提高价格的情况下增加我们产品的价值。我们的目标是通过降低商业软件的价格并扩展工具的功能，来赋能社会各阶层的人们。获取资本不应限制成功；企业应该根据其未来愿景的强弱而兴衰。


    从这个角度来看，AI 是技术承诺的实现。它使人们能够摆脱繁琐或不愉快的重复性劳动，从而将他们从时间的束缚中解放出来。它帮助人们识别微观和宏观尺度上的模式，而这些模式是人类天生不擅长感知的。它可以预测问题，也可以纠正错误。它可以节省金钱、时间，甚至生命。


    为了像我们为通用商业软件所做的那样，将这些好处民主化，Zoho 已将 AI 贯穿于我们的整个应用套件中。在过去的六年里，我们基于自己的原则，悄然开发了内部
    AI 技术。其成果是 Zia，一个智能但不耍小聪明的 AI 助手。这是一个关键的区别。一个智能的系统拥有信息和功能，能够赋能活跃操作者的独特愿景和直觉。一个耍小聪明的系统会模糊流程的内部运作，将人降级为一个被动用户，仅仅消费机器提供的见解。AI
    应该是一个可供使用的工具，而不是我们观察世界的透镜。要驾驭如此强大的工具，我们必须掌握理解并操作它的知识，同时不削弱我们人类系统的人性特质。


    保持对这项技术的了解，正是像《人工智能基础》这样的书在当今世界如此重要的原因。它是知识基础设施，将使人们——普通人——能够利用 AI 的力量。如果没有这类举措，AI
    将使权力天平向拥有巨额预算的大公司倾斜。普通大众掌握理解 AI 系统的技能至关重要，因为这些系统将日益定义我们如何与世界互动并导航。很快，本书所包含的信息将不仅仅是一个有趣的话题；它将成为参与现代经济的先决条件。'
- fmt: 'This is how the average person can enjoy the fruits of the AI revolution.
    In the years to come, how we define work and which activities carry economic value
    will change. We have to embrace the fact that the future of work may be as foreign
    to us as a desk job would be to our distant ancestors. But we have to—and should—have
    faith in the human capacity to innovate new forms of work, even if that work doesn’t
    look like the work we’re familiar with. But the first step, before everything
    else, is to learn more about this new, exciting, and fundamentally democratizing
    technology.


    > —Sridhar Vembu, co-founder and CEO of Zoho


    ## Introduction


    On the face of it, the Uber app is simple. With just a couple clicks, you can
    hail a driver within a few minutes.


    But behind the scenes, there is an advanced technology platform, which relies
    heavily on artificial intelligence (AI). Here are just some of the capabilities:


    *   A natural language processing (NLP) system that can understand conversations,
    allowing for a streamlined experience

    *   Computer vision software that verifies millions of images and documents like
    drivers’ licenses and restaurant menus

    *   Sensor processing algorithms that help improve the accuracy in dense urban
    areas, including automatic crash detection by sensing unexpected movement from
    the phone of a driver or passenger

    *   Sophisticated machine learning algorithms that predict driver supply, rider
    demand, and ETAs


    Such technologies are definitely amazing, but they are also required. There is
    no way that Uber could have scaled its growth—which has involved handling over
    10 billion trips—without AI. In light of this, it should be no surprise that the
    company spends hundreds of millions on the technology and has a large group of
    AI experts on staff. ^([¹](#fn1))


    But AI is not just for fast-charging startups. The technology is also proving
    a critical priority for traditional companies. Just look at McDonald’s. In 2019,
    the company shelled out $300 million to acquire a tech startup, Dynamic Yield.
    It was the company’s largest deal since it purchased Boston Market in 1999. ^([²](#fn2))


    Dynamic Yield, which was founded in 2011, is a pioneer in leveraging AI for creating
    personalized customer interactions across the Web, apps, and email. Some of its
    customers include the Hallmark Channel, IKEA, and Sephora.


    As for McDonald’s, it has been undergoing a digital transformation—and AI is a
    key part of the strategy. With Dynamic Yield, the company plans to use the technology
    to reimagine its Drive Thru, which accounts for a majority of its revenues. By
    analyzing data, such as the weather, traffic, and time of day, the digital menus
    will be dynamically changed to enhance the revenue opportunities. It also looks
    like McDonald’s will use geofencing and even image recognition of license plates
    to enhance the targeting.


    But this will just be the start. McDonald’s expects to use AI for in-store kiosks
    and signage as well as the supply chain.


    The company realizes that the future is both promising and dangerous. If companies
    are not proactive with new technologies, they may ultimately fail. Just look at
    how Kodak was slow to adapt to digital cameras. Or consider how the taxi industry
    did not change when faced with the onslaught of Uber and Lyft.


    On the other hand, new technologies can be almost an elixir for a company. But
    there needs to be a solid strategy, a good understanding of what’s possible, and
    a willingness to take risks. So in this book, I’ll provide tools to help with
    all this.


    OK then, how big will AI get? According to a study from PWC, it will add a staggering
    $15.7 trillion to the global GDP by 2030, which is more than the combined output
    of China and India. The authors of the report note: “AI touches almost every aspect
    of our lives. And it’s only just getting started.” ^([³](#fn3))


    True, when it comes to predicting trends, there can be a good deal of hype. However,
    AI may be different because it has the potential for turning into a general-purpose
    technology. A parallel to this is what happened in the nineteenth century with
    the emergence of electricity, which had a transformative impact across the world.


    As a sign of the strategic importance of AI, tech companies like Google, Microsoft,
    Amazon.com, Apple, and Facebook have made substantial investments in this industry.
    For example, Google calls itself an “AI-first” company and has spent billions
    buying companies in the space as well as hiring thousands of data scientists.


    In other words, more and more jobs will require knowledge of AI. Granted, this
    does not mean you’ll need to learn programming languages or understand advanced
    statistics. But it will be critical to have a solid foundation of the fundamentals.


    As for this book, the goal is to provide actionable advice that can make a big
    difference in your organization and career. Now you will not find deeply technical
    explanations, code snippets, or equations. Instead, *Artificial Intelligence Basics*
    is about answering the top-of-mind questions that managers have: Where does AI
    make sense? What are the gotchas? How do you evaluate the technology? What about
    starting an AI pilot?


    This book also takes a real-world view of the technology. A big advantage I have
    as a writer for Forbes.com and an advisor in the tech world is that I get to talk
    to many talented people in the AI field—and this helps me to identify what is
    really important in the industry. I also get to learn about case studies and examples
    of what works.


    This book is organized in a way to cover the main topics in AI—and you do not
    have to read each chapter in order. *Artificial Intelligence Basics* is meant
    to be a handbook.


    Here are brief descriptions of the chapters:


    *   *Chapter* [*1*](#480660_1_En_1_Chapter.xhtml) *—AI Foundations* : This is
    an overview of the rich history of AI, which goes back to the 1950s. You will
    learn about brilliant researchers and computer scientists like Alan Turing, John
    McCarthy, Marvin Minsky, and Geoffrey Hinton. There will also be coverage of key
    concepts like the Turing Test, which gauges if a machine has achieved true AI.

    *   *Chapter* [*2*](#480660_1_En_2_Chapter.xhtml) *—Data* : Data is the lifeblood
    of AI. It’s how algorithms can find patterns and correlations to provide insights.
    But there are landmines with data, such as quality and bias. This chapter provides
    a framework to work with data in an AI project.

    *   *Chapter* [*3*](#480660_1_En_3_Chapter.xhtml) *—Machine Learning* : This is
    a subset of AI and involves traditional statistical techniques like regressions.
    But in this chapter, we’ll also cover the advanced algorithms, such as K-Nearest
    Neighbor (k-NN) and the Naive Bayes Classifier. Besides this, there will be a
    look at how to put together a machine learning model.

    *   *Chapter* [*4*](#480660_1_En_4_Chapter.xhtml) *—Deep Learning* : This is another
    subset of AI and is clearly the one that has seen much of the innovation during
    the past decade. Deep learning is about using neural networks to find patterns
    that mimic the brain. In the chapter, we’ll take a look at the main algorithms
    like recurrent neural networks (RNNs), convolutional neural networks (CNNs), and
    generative adversarial networks (GANs). There will also be explanations of key
    concepts like backpropagation.

    *   *Chapter* [*5*](#480660_1_En_5_Chapter.xhtml) *—Robotic Process Automation:*
    This uses systems to automate repetitive processes, such as inputting data in
    a Customer Relationship Management (CRM) system. Robotic Process Automation (RPA)
    has seen tremendous growth during the past few years because of the high ROI (Return
    on Investment). The technology has also been an introductory way for companies
    to implement AI.'
  raw: 'This is how the average person can enjoy the fruits of the AI revolution.
    In the years to come, how we define work and which activities carry economic value
    will change. We have to embrace the fact that the future of work may be as foreign
    to us as a desk job would be to our distant ancestors. But we have to—and should—have
    faith in the human capacity to innovate new forms of work, even if that work doesn’t
    look like the work we’re familiar with. But the first step, before everything
    else, is to learn more about this new, exciting, and fundamentally democratizing
    technology.


    > —Sridhar Vembu, co-founder and CEO of Zoho


    Introduction


    On the face of it, the Uber app is simple. With just a couple clicks, you can
    hail a driver within a few minutes.


    But behind the scenes, there is an advanced technology platform, which relies
    heavily on artificial intelligence (AI). Here are just some of the capabilities:


    *   A natural language processing (NLP) system that can understand conversations,
    allowing for a streamlined experience


    *   Computer vision software that verifies millions of images and documents like
    drivers’ licenses and restaurant menus


    *   Sensor processing algorithms that help improve the accuracy in dense urban
    areas, including automatic crash detection by sensing unexpected movement from
    the phone of a driver or passenger


    *   Sophisticated machine learning algorithms that predict driver supply, rider
    demand, and ETAs


    Such technologies are definitely amazing, but they are also required. There is
    no way that Uber could have scaled its growth—which has involved handling over
    10 billion trips—without AI. In light of this, it should be no surprise that the
    company spends hundreds of millions on the technology and has a large group of
    AI experts on staff. ^([¹](#fn1))


    But AI is not just for fast-charging startups. The technology is also proving
    a critical priority for traditional companies. Just look at McDonald’s. In 2019,
    the company shelled out $300 million to acquire a tech startup, Dynamic Yield.
    It was the company’s largest deal since it purchased Boston Market in 1999\. ^([²](#fn2))


    Dynamic Yield, which was founded in 2011, is a pioneer in leveraging AI for creating
    personalized customer interactions across the Web, apps, and email. Some of its
    customers include the Hallmark Channel, IKEA, and Sephora.


    As for McDonald’s, it has been undergoing a digital transformation—and AI is a
    key part of the strategy. With Dynamic Yield, the company plans to use the technology
    to reimagine its Drive Thru, which accounts for a majority of its revenues. By
    analyzing data, such as the weather, traffic, and time of day, the digital menus
    will be dynamically changed to enhance the revenue opportunities. It also looks
    like McDonald’s will use geofencing and even image recognition of license plates
    to enhance the targeting.


    But this will just be the start. McDonald’s expects to use AI for in-store kiosks
    and signage as well as the supply chain.


    The company realizes that the future is both promising and dangerous. If companies
    are not proactive with new technologies, they may ultimately fail. Just look at
    how Kodak was slow to adapt to digital cameras. Or consider how the taxi industry
    did not change when faced with the onslaught of Uber and Lyft.


    On the other hand, new technologies can be almost an elixir for a company. But
    there needs to be a solid strategy, a good understanding of what’s possible, and
    a willingness to take risks. So in this book, I’ll provide tools to help with
    all this.


    OK then, how big will AI get? According to a study from PWC, it will add a staggering
    $15.7 trillion to the global GDP by 2030, which is more than the combined output
    of China and India. The authors of the report note: “AI touches almost every aspect
    of our lives. And it’s only just getting started.” ^([³](#fn3))


    True, when it comes to predicting trends, there can be a good deal of hype. However,
    AI may be different because it has the potential for turning into a general-purpose
    technology. A parallel to this is what happened in the nineteenth century with
    the emergence of electricity, which had a transformative impact across the world.


    As a sign of the strategic importance of AI, tech companies like Google, Microsoft,
    Amazon.com, Apple, and Facebook have made substantial investments in this industry.
    For example, Google calls itself an “AI-first” company and has spent billions
    buying companies in the space as well as hiring thousands of data scientists.


    In other words, more and more jobs will require knowledge of AI. Granted, this
    does not mean you’ll need to learn programming languages or understand advanced
    statistics. But it will be critical to have a solid foundation of the fundamentals.


    As for this book, the goal is to provide actionable advice that can make a big
    difference in your organization and career. Now you will not find deeply technical
    explanations, code snippets, or equations. Instead, *Artificial Intelligence Basics*
    is about answering the top-of-mind questions that managers have: Where does AI
    make sense? What are the gotchas? How do you evaluate the technology? What about
    starting an AI pilot?


    This book also takes a real-world view of the technology. A big advantage I have
    as a writer for Forbes.com and an advisor in the tech world is that I get to talk
    to many talented people in the AI field—and this helps me to identify what is
    really important in the industry. I also get to learn about case studies and examples
    of what works.


    This book is organized in a way to cover the main topics in AI—and you do not
    have to read each chapter in order. *Artificial Intelligence Basics* is meant
    to be a handbook.


    Here are brief descriptions of the chapters:


    *   *Chapter* [*1*](#480660_1_En_1_Chapter.xhtml) *—AI Foundations* : This is
    an overview of the rich history of AI, which goes back to the 1950s. You will
    learn about brilliant researchers and computer scientists like Alan Turing, John
    McCarthy, Marvin Minsky, and Geoffrey Hinton. There will also be coverage of key
    concepts like the Turing Test, which gauges if a machine has achieved true AI.


    *   *Chapter* [*2*](#480660_1_En_2_Chapter.xhtml) *—Data* : Data is the lifeblood
    of AI. It’s how algorithms can find patterns and correlations to provide insights.
    But there are landmines with data, such as quality and bias. This chapter provides
    a framework to work with data in an AI project.


    *   *Chapter* [*3*](#480660_1_En_3_Chapter.xhtml) *—Machine Learning* : This is
    a subset of AI and involves traditional statistical techniques like regressions.
    But in this chapter, we’ll also cover the advanced algorithms, such as K-Nearest
    Neighbor (k-NN) and the Naive Bayes Classifier. Besides this, there will be a
    look at how to put together a machine learning model.


    *   *Chapter* [*4*](#480660_1_En_4_Chapter.xhtml) *—Deep Learning* : This is another
    subset of AI and is clearly the one that has seen much of the innovation during
    the past decade. Deep learning is about using neural networks to find patterns
    that mimic the brain. In the chapter, we’ll take a look at the main algorithms
    like recurrent neural networks (RNNs), convolutional neural networks (CNNs), and
    generative adversarial networks (GANs). There will also be explanations of key
    concepts like backpropagation.


    *   *Chapter* [*5*](#480660_1_En_5_Chapter.xhtml) *—Robotic Process Automation:*
    This uses systems to automate repetitive processes, such as inputting data in
    a Customer Relationship Management (CRM) system. Robotic Process Automation (RPA)
    has seen tremendous growth during the past few years because of the high ROI (Return
    on Investment). The technology has also been an introductory way for companies
    to implement AI.'
