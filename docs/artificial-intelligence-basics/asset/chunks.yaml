    | Accuracy of predictions | <80% | 87.5% |


    Pretty good, right? Absolutely. But there are still some caveats. With Lenovo
    Brazil, the company had the benefit of skilled data scientists, who understood
    the nuances of creating models.


    However, if you use an `autoML` tool without such expertise, you could easily
    run into serious trouble. There’s a good chance that you may create models that
    have faulty assumptions or data. If anything, the results may ultimately prove
    far worse than not using AI! Because of this, `DataRobot` actually requires that
    a new customer have a dedicated field engineer and data scientist work with the
    company for the first year.^([^(188)](#fn188))


    Now there are also low-code platforms that have proven to be useful in accelerating
    the development of AI projects. One of the leaders in the space is `Appian`, which
    has the bold guarantee of “Idea to app in eight weeks.”'
  raw: '### AI Frameworks


    There are a myriad of AI frameworks, which provide end-to-end systems to build
    models, train them, and deploy them. By far the most popular is TensorFlow, which
    is backed by Google. The company started development of this framework in 2011,
    through its Google Brain division. The goal was to find a way to create neural
    networks faster so as to embed the technology across many Google applications


    By 2015, Google decided to open source TensorFlow, primarily because the company
    wanted to accelerate the progress of AI. And no doubt, this is what happened.
    By open sourcing TensorFlow, Google made its technology an industry standard for
    development. The software has been downloaded over 41 million times, and there
    are more than 1,800 contributors. In fact, TensorFlow Lite (which is for embedded
    systems) is running on more than 2 billion mobile devices.^([^(181)](#fn181))


    The ubiquity of the platform has resulted in a large ecosystem. This means there
    are many add-ons like TensorFlow Federated (for decentralized data), TensorFlow
    Privacy, TensorFlow Probability, TensorFlow Agents (for reinforcement learning),
    and Mesh TensorFlow (for massive datasets).


    To use TensorFlow, you have the option of a variety of languages to create your
    models, such as Swift, JavaScript, and R. Although, for the most part, the most
    common one is Python.


    In terms of the basic structure, TensorFlow takes in input data as a multidimensional
    array, which is also known as a tensor. There is a flow to it, represented by
    a chart, as the data courses through the system.


    When you enter commands into TensorFlow, they are processed using a sophisticated
    C++ kernel. This allows for much higher performance, which can be essential as
    some models can be massive.


    TensorFlow can be used for just about anything when it comes to AI. Here are some
    of the models that it has powered:


    *   Researchers from NERSC (National Energy Research Scientific Computing Center)
    at the Lawrence Berkeley National Laboratory created a deep learning system to
    better predict extreme weather. It was the first such model that broke the expo
    (1 billion billion calculations) computing barrier. Because of this, the researchers
    won the Gordon Bell Prize.^([^(182)](#fn182))


    *   Airbnb used TensorFlow to build a model that categorized millions of listing
    photos, which increased the guest experience and led to higher conversions.^([^(183)](#fn183))


    *   Google used TensorFlow to analyze data from NASA’s Kepler space telescope.
    The result? By training a neural network, the model discovered two exoplanets.
    Google also made available the code to the public.^([^(184)](#fn184))


    Google has been working on TensorFlow 2.0, and a key focus is to make the API
    process simpler. There is also something called Datasets, which helps to streamline
    the preparation of data for AI models.


    Then what are some of the other AI frameworks? Let’s take a look:


    *   *PyTorch*: Facebook is the developer of this platform, which was released
    in 2016\. Like TensorFlow, the main language to program the system is Python.
    While PyTorch is still in the early phases, it is already considered the runner-up
    to TensorFlow in terms of usage. So what is different with this platform? PyTorch
    has a more intuitive interface. The platform also allows for dynamic computation
    of graphs. This means you can easily make changes to your models in runtime, which
    helps speed up development. PyTorch also makes it possible for having different
    types of back-end CPUs and GPUs.


    *   *Keras*: Even though TensorFlow and PyTorch are for experienced AI experts,
    Keras is for beginners. With a small amount of code—in Python—you can create neural
    networks. In the documentation, it notes: “Keras is an API designed for human
    beings, not machines. It puts user experience front and center. Keras follows
    best practices for reducing cognitive load: it offers consistent and simple APIs,
    it minimizes the number of user actions required for common use cases, and it
    provides clear and actionable feedback upon user error.”^([^(185)](#fn185)) There
    is a “Getting Started” guide that takes only 30 seconds! Yet the simplicity does
    not mean that it is not powerful. The fact is that you can create sophisticated
    models with Keras. For example, TensorFlow has integrated Keras on its own platform.
    Even for those who are pros at AI, the system can be quite useful for doing initial
    experimentations with models.


    With AI development, there is another common tool: Jupyter Notebook. It’s not
    a platform or development tool. Instead, Jupyter Notebook is a web app that makes
    it easy to code in Python and R to create visualizations and import AI systems.
    You can also easily share your work with other people, similar to what GitHub
    does.


    During the past few years, there has also emerged a new category of AI Tools called
    automated machine learning or autoML. These systems help to deal with processes
    like data prep and feature selection. For the most part, the goal is to provide
    help for those organizations that do not have experienced data scientists and
    AI engineers. This is all about the fast-growing trend of the “citizen data scientist”—that
    is, a person who does not have a strong technical background who can still create
    useful models.


    Some of the players in the autoML space include H2O.ai, DataRobot, and SaaS. The
    systems are intuitive and use drag-and-drop ease with the development of models.
    As should be no surprise, mega tech operators like Facebook and Google have created
    autoML systems for their own teams. In the case of Facebook, it has Asimo, which
    helps manage the training and testing of 300,000 models every month.^([^(186)](#fn186))


    For a use case of autoML, take a look at Lenovo Brazil. The company was having
    difficulty creating machine learning models to help predict and manage the supply
    chain. It had two people who coded 1,500 lines of R code each week—but this was
    not enough. The fact is that it would not be cost-effective to hire more data
    scientists.


    Hence the company implemented DataRobot. By automating various processes, Lenovo
    Brazil was able to create models with more variables, which led to better results.
    Within a few months, the number of users of DataRobot went from two to ten.


    Table [8-1](#480660_1_En_8_Chapter.xhtml#Tab1) shows some other results.^([^(187)](#fn187))


    Table 8-1.


    The results of implementing an autoML system


    | Tasks | Before | After |

    | --- | --- | --- |

    | Model creation | 4 weeks | 3 days |

    | Production models | 2 days | 5 minutes |

    | Accuracy of predictions | <80% | 87.5% |


    Pretty good, right? Absolutely. But there are still come caveats. With Lenovo
    Brazil, the company had the benefit of skilled data scientists, who understood
    the nuances of creating models.


    However, if you use an autoML tool without such expertise, you could easily run
    into serious trouble. There’s a good chance that you may create models that have
    faulty assumptions or data. If anything, the results may ultimately prove far
    worse than not using AI! Because of this, DataRobot actually requires that a new
    customer have a dedicated field engineer and data scientist work with the company
    for the first year.^([^(188)](#fn188))


    Now there are also low-code platforms that have proven to be useful in accelerating
    the development of AI projects. One of the leaders in the space is Appian, which
    has the bold guarantee of “Idea to app in eight weeks.”'
  trans: '

    ### AI 框架


    市面上有众多 AI 框架，它们提供端到端的系统来构建、训练和部署模型。迄今为止，最流行的是由谷歌支持的 TensorFlow。该公司于 2011 年通过其
    Google Brain 部门开始开发此框架，目标是找到一种更快创建神经网络的方法，以便将该技术嵌入到众多谷歌应用中。


    到 2015 年，谷歌决定将 TensorFlow 开源，主要原因是公司希望加速 AI 的进步。毫无疑问，这确实实现了。通过开源 TensorFlow，谷歌使其技术成为了行业开发标准。该软件已被下载超过
    4100 万次，拥有超过 1800 名贡献者。事实上，TensorFlow Lite（用于嵌入式系统）运行在超过 20 亿台移动设备上。^(¹⁸¹)


    该平台的普及催生了一个庞大的生态系统。这意味着有许多附加组件，如 TensorFlow Federated（用于去中心化数据）、TensorFlow Privacy、TensorFlow
    Probability、TensorFlow Agents（用于强化学习）和 Mesh TensorFlow（用于大规模数据集）。


    使用 TensorFlow 时，你可以选择多种语言来创建模型，例如 Swift、JavaScript 和 R。不过，最常用的还是 Python。


    在基本结构方面，TensorFlow 将输入数据作为多维数组（也称为张量）进行处理。数据在系统中流动时，会通过图表来表示其流程。


    当你向 TensorFlow 输入命令时，它们会通过一个复杂的 C++ 内核进行处理。这可以实现更高的性能，这对于某些可能非常庞大的模型来说至关重要。


    在 AI 领域，TensorFlow 几乎可以用于任何用途。以下是它驱动的一些模型示例：


    *   劳伦斯伯克利国家实验室 NERSC（国家能源研究科学计算中心）的研究人员创建了一个深度学习系统，以更好地预测极端天气。这是首个突破 exaflop（百亿亿次计算）计算障碍的此类模型。因此，研究人员获得了戈登·贝尔奖。^(¹⁸²)


    *   Airbnb 使用 TensorFlow 构建了一个模型，对数百万张房源照片进行分类，从而提升了客人体验并带来了更高的转化率。^(¹⁸³)


    *   谷歌使用 TensorFlow 分析 NASA 开普勒太空望远镜的数据。结果如何？通过训练神经网络，该模型发现了两颗系外行星。谷歌还将代码公开。^(¹⁸⁴)


    谷歌一直在开发 TensorFlow 2.0，其中一个关键重点是简化 API 流程。此外，还有一个名为 Datasets 的功能，有助于简化 AI 模型的数据准备工作。


    那么，其他一些 AI 框架有哪些呢？让我们来看看：


    *   *PyTorch*：Facebook 是此平台的开发者，于 2016 年发布。与 TensorFlow 一样，该系统的主要编程语言是 Python。虽然
    PyTorch 仍处于早期阶段，但在使用率上已被视为 TensorFlow 的亚军。那么这个平台有何不同？PyTorch 拥有更直观的界面。该平台还允许动态计算图。这意味着你可以在运行时轻松更改模型，从而加快开发速度。PyTorch
    还支持使用不同类型的后端 CPU 和 GPU。


    *   *Keras*：尽管 TensorFlow 和 PyTorch 面向经验丰富的 AI 专家，但 Keras 是为初学者设计的。只需少量 Python
    代码，你就可以创建神经网络。文档中指出：“Keras 是一个为人而非机器设计的 API。它将用户体验置于核心位置。Keras 遵循减少认知负荷的最佳实践：它提供一致且简单的
    API，最大限度地减少常见用例所需的用户操作数量，并在用户出错时提供清晰且可操作的反馈。”^(¹⁸⁵) 有一个“入门”指南只需 30 秒！然而，简单并不意味着它不强大。事实上，你可以使用
    Keras 创建复杂的模型。例如，TensorFlow 已将 Keras 集成到其自身平台中。即使是 AI 专业人士，该系统对于进行模型的初步实验也非常有用。


    在 AI 开发中，还有另一个常用工具：Jupyter Notebook。它不是一个平台或开发工具。相反，Jupyter Notebook 是一个 Web 应用，可以轻松使用
    Python 和 R 进行编码，以创建可视化并导入 AI 系统。你还可以像 GitHub 那样轻松地与其他人分享你的工作。


    在过去几年中，还出现了一类新的 AI 工具，称为自动化机器学习或 autoML。这些系统有助于处理数据准备和特征选择等流程。在很大程度上，其目标是为那些没有经验丰富的数据科学家和
    AI 工程师的组织提供帮助。这完全符合“公民数据科学家”这一快速增长的趋势——即没有强大技术背景的人也能创建有用的模型。


    autoML 领域的一些参与者包括 H2O.ai、DataRobot 和 SaaS。这些系统直观易用，通过拖放方式即可轻松开发模型。毫不意外，像 Facebook
    和谷歌这样的科技巨头已经为其团队创建了 autoML 系统。以 Facebook 为例，它拥有 Asimo，该系统每月帮助管理和训练测试 30 万个模型。^(¹⁸⁶)


    关于 autoML 的一个用例，可以看看联想巴西公司。该公司在创建机器学习模型以帮助预测和管理供应链方面遇到了困难。他们有两名员工每周编写 1500 行 R
    代码——但这还不够。事实上，雇佣更多的数据科学家并不划算。


    因此，该公司实施了 DataRobot。通过自动化各种流程，联想巴西能够创建包含更多变量的模型，从而获得了更好的结果。几个月内，DataRobot 的用户数从两个增加到了十个。


    表 8-1 显示了一些其他结果。^(¹⁸⁷)


    表 8-1.


    实施 autoML 系统的结果


    | 任务 | 之前 | 之后 |

    | --- | --- | --- |

    | 模型创建 | 4 周 | 3 天 |

    | 生产模型 | 2 天 | 5 分钟 |

    | 预测准确率 | <80% | 87.5% |


    相当不错，对吧？确实如此。但仍然存在一些注意事项。对于联想巴西来说，该公司拥有熟练的数据科学家，他们了解创建模型的细微差别。


    然而，如果你在没有此类专业知识的情况下使用 autoML 工具，很容易陷入严重困境。你很可能创建出带有错误假设或数据的模型。结果甚至可能比不使用 AI 还要糟糕！正因如此，DataRobot
    实际上要求新客户在第一年配备一名专门的现场工程师和数据科学家与公司合作。^(¹⁸⁸)


    现在，还有一些低代码平台已被证明有助于加速 AI 项目的开发。该领域的领导者之一是 Appian，它大胆承诺“从创意到应用只需八周”。

    '
- fmt: 'With this platform, you can easily set up the data structure that is clean.
    There are even systems in place to help guide the process, such as alerting for
    issues. No doubt, this provides a solid foundation for building a model. But low-code
    also helps in other ways. For example, you can test various AI platforms—say from
    Google, Amazon, or Microsoft—to see which one performs better. Then you can create
    the app with a modern interface and deploy it to the Web or mobile apps.


    To get a sense of the power of low-code, take a look at what KPMG has done with
    the technology. The company was able to help its clients transition away from
    the use of LIBOR in loans. First of all, KPMG used its own AI platform, called
    Ignite, to ingest the unstructured data and use machine learning and Natural Language
    Processing to remediate the contracts. Next, the company used Appian to help with
    document sharing, customizable business rules, and real-time reporting.


    Such a process—when done manually—could easily take thousands of hours, with the
    error rate of 10% to 15%. But when using Ignite/Appian, the accuracy was over
    96%. Oh, and the time to process the documents was in seconds.


    ## Deploy and Monitor the AI System


    Even when you build an AI model that works, there is still more work to do. You
    need to find ways to deploy and monitor it.


    This requires change management, which is always complex and difficult. AI is
    different than a typical IT implementation since it involves using predictions
    and insights for decision-making. This means people will need to rethink how they
    interact with the technology.


    Also consider that the chances are that the end-users will be non-technical people,
    whether employees or consumers. This is why there needs to be much work on making
    the AI model as easy as possible. For example, if you have built a system for
    online marketing, you might want to limit the options for the user—say to just
    four or five of them.


    Why? If there are too many, then users may get frustrated and not even know where
    to start. This is all part of the so-called “analysis paralysis” problem. When
    this happens, there will inevitably be little adoption of the AI model, which
    will severely result in impeded progress.


    Another good strategy is to use visualizations that are interactive. In other
    words, you can easily see how the trends change by adjusting some variables. You
    can also allow for clicking a certain part of the chart to drill down into more
    details.


    It’s also essential to create documentation. But this should be more than just
    written materials. For example, an effective approach is to develop video tutorials.
    Such an effort will go a long way in creating strong adoption.


    As a best practice, the initial deployment should be limited. Perhaps this could
    be to a small group of beta users and a small section of the customer base. There
    should also be warnings that the AI model is in the early stages and may have
    bugs.


    Therefore, this phase is about learning. What works? What should be removed? Where
    can things be improved?


    This is definitely an iterative process that must not be rushed.


    Then once the AI model is ready for full deployment, there should be enough support
    in place and someone to lead the management of the project. There also must be
    recognition for the team for the win. Hopefully, the praise will come from the
    highest levels of the company, which will help encourage more and more innovation.


    There are a variety of automated platforms to help streamline the workflow process,
    such as Alteryx. The company’s vision is to democratize data science and analytics,
    regardless if someone has a technical background or not. The Alteryx system handles
    the key areas of the process: data discovery, data preparation, analytics, and
    deployment. And all of this is done with code-free drag-and-drop tools. Furthermore,
    many of the company’s customers are non-technology operators like Hyatt, Unilever,
    and Kroger.


    Again, AI development is really a journey—and your strategy will inevitably change.
    This is inevitable. According to Kurt Muehmel, who is the VP of Sales Engineering
    at Dataiku^([^(189)](#fn189)):


    > What businesses sometimes fail to realize is that the path to AI is a long-term
    evolution of not only technology but in the way the company collaborates and works
    together. So, in addition to education, one of the key components to an AI strategy
    should be overall change management. It is important to create both short- and
    long-term roadmaps of what will be accomplished with first maybe predictive analytics,
    then perhaps machine learning, and ultimately—as a longer-term goal—AI, and how
    each roadmap impacts various pieces of the business as well as people who are
    a part of those business lines and their day-to-day work.


    ## Conclusion


    As shown in this chapter, when approaching implementing AI, it’s critical to look
    at two paths. The first is to get the maximum use of any third-party systems that
    use the technology. But there should also be a focus on data quality. If not,
    the results will likely be off the mark.


    The second path is to do an AI project, which is based on your company’s own data.
    To be successful, there must be a strong team that has a blend of technical, business,
    and domain expertise. There will also likely be a need for some AI training. This
    is the case even for those with backgrounds in data science and engineering.


    From here, there should be no rush in the steps of the project: assessing the
    IT environment, setting up a clear business objective, cleaning the data, selecting
    the right tools and platforms, creating the AI model, and deploying the system.
    With early projects, there will inevitably be challenges so it’s critical to be
    flexible. But the effort should be well worth it.'
