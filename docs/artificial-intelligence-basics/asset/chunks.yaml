    \ was then asked, “Is there a God?” to which it answered, “Yes, *now* there is\
    \ a God.”\n\nNo doubt, Brown’s story was certainly clever—as well as a bit comical\
    \ and chilling! Science fiction has been a way for us to understand the implications\
    \ of new technologies, and artificial intelligence (AI) has been a major theme.\
    \ Some of the most memorable characters in science fiction involve androids or\
    \ computers that become self-aware, such as in *Terminator*, *Blade Runner*, *2001:\
    \ A Space Odyssey,* and even *Frankenstein*.\n\nBut with the relentless pace of\
    \ new technologies and innovation nowadays, science fiction is starting to become\
    \ real. We can now talk to our smartphones and get answers; our social media accounts\
    \ provide us with the content we’re interested in; our banking apps provide us\
    \ with reminders; and on and on. This personalized content creation almost seems\
    \ magical but is quickly becoming normal in our everyday lives.\n\nTo understand\
    \ AI, it’s important to have a grounding in its rich history. You’ll see how the\
    \ development of this industry has been full of breakthroughs and setbacks. There\
    \ is also a cast of brilliant researchers and academics, like Alan Turing, John\
    \ McCarthy, Marvin Minsky, and Geoffrey Hinton, who pushed the boundaries of the\
    \ technology. But through it all, there was constant progress.\n\nLet’s get started.\n\
    \n## Alan Turing and the Turing Test\n\nAlan Turing is a towering figure in computer\
    \ science and AI. He is often called the “father of AI.”\n\nIn 1936, he wrote\
    \ a paper called “On Computable Numbers.” In it, he set forth the core concepts\
    \ of a computer, which became known as the Turing machine. Keep in mind that real\
    \ computers would not be developed until more than a decade later.\n\nYet it was\
    \ his paper, called “Computing Machinery and Intelligence,” that would become\
    \ historic for AI. He focused on the concept of a machine that was intelligent.\
    \ But in order to do this, there had to be a way to measure it. What is intelligence—at\
    \ least for a machine?\n\nThis is where he came up with the famous “Turing Test.”\
    \ It is essentially a game with three players: two that are human and one that\
    \ is a computer. The evaluator, a human, asks open-ended questions of the other\
    \ two (one human, one computer) with the goal of determining which one is the\
    \ human. If the evaluator cannot make a determination, then it is presumed that\
    \ the computer is intelligent. Figure [1-1](#480660_1_En_1_Chapter.xhtml#Fig1)\
    \ shows the basic workflow of the Turing Test.\n\n![../images/480660_1_En_1_Chapter/480660_1_En_1_Fig1_HTML.jpg](images/480660_1_En_1_Chapter/480660_1_En_1_Fig1_HTML.jpg)\n\
    \nFigure 1-1.\n\nThe basic workflow of the Turing Test\n\nThe genius of this concept\
    \ is that there is no need to see if the machine actually knows something, is\
    \ self-aware, or even if it is correct. Rather, the Turing Test indicates that\
    \ a machine can process large amounts of information, interpret speech, and communicate\
    \ with humans.\n\nTuring believed that it would actually not be until about the\
    \ turn of the century that a machine would pass his test. Yes, this was one of\
    \ many predictions of AI that would come up short.\n\nSo how has the Turing Test\
    \ held up over the years? Well, it has proven to be difficult to crack. Keep in\
    \ mind that there are contests, such as the Loebner Prize and the Turing Test\
    \ Competition, to encourage people to create intelligent software systems.\n\n\
    In 2014, there was a case where it did look like the Turing Test was passed. It\
    \ involved a computer that said it was 13 years old.^([⁵](#fn5)) Interestingly\
    \ enough, the human judges likely were fooled because some of the answers had\
    \ errors.\n\nThen in May 2018 at Google’s I/O conference, CEO Sundar Pichai gave\
    \ a standout demo of Google Assistant.^([⁶](#fn6)) Before a live audience, he\
    \ used the device to call a local hairdresser to make an appointment. The person\
    \ on the other end of the line acted as if she was talking to a person!\n\nAmazing,\
    \ right? Definitely. Yet it still probably did not pass the Turing Test. The reason\
    \ is that the conversation was focused on one topic—not open ended.\n\nAs should\
    \ be no surprise, there has been ongoing controversy with the Turing Test, as\
    \ some people think it can be manipulated. In 1980, philosopher John Searle wrote\
    \ a famous paper, entitled “Minds, Brains, and Programs,” where he set up his\
    \ own thought experiment, called the “Chinese room argument” to highlight the\
    \ flaws.\n\nHere’s how it worked: Let’s say John is in a room and does not understand\
    \ the Chinese language. However, he does have manuals that provide easy-to-use\
    \ rules to translate it. Outside the room is Jan, who does understand the language\
    \ and submits characters to John. After some time, she will then get an accurate\
    \ translation from John. As such, it’s reasonable to assume that Jan believes\
    \ that John can speak Chinese.\n\nSearle’s conclusion:\n\n> The point of the argument\
    \ is this: if the man in the room does not understand Chinese on the basis of\
    \ implementing the appropriate program for understanding Chinese then neither\
    \ does any other digital computer solely on that basis because no computer , qua\
    \ computer, has anything the man does not have.^([⁷](#fn7))\n\nIt was a pretty\
    \ good argument—and has been a hot topic of debate in AI circles since.\n\nSearle\
    \ also believed there were two forms of AI:"
  trans: "\n*   *第* *6* *章——自然语言处理（NLP）*：这种涉及理解对话的人工智能形式最为普遍，正如 Siri、Cortana 和 Alexa\
    \ 所展现的那样。但诸如聊天机器人之类的 NLP 系统在企业界也变得至关重要。本章将展示如何有效利用这项技术，以及如何避免棘手的问题。\n\n*   *第*\
    \ *7* *章——实体机器人*：人工智能正开始对这个行业产生重大影响。借助深度学习，机器人理解其环境变得越来越容易。在本章中，我们将通过大量用例来审视消费级和工业级机器人。\n\
    \n*   *第* *8* *章——人工智能的实施*：我们将采用循序渐进的方法来整合一个人工智能项目，从最初的概念到部署。本章还将涵盖各种工具，如 Python、TensorFlow\
    \ 和 PyTorch。\n\n*   *第* *9* *章——人工智能的未来*：本章将涵盖人工智能领域的一些最大趋势，如自动驾驶、人工智能武器化、技术性失业、药物发现和监管。\n\
    \n在本书的末尾，您还会找到一个供进一步学习的资源附录，以及一份与人工智能相关的常用术语词汇表。\n\n## 配套材料\n\n任何更新都将提供在我的网站 [`www.Taulli.com`](http://www.taulli.com)\
    \ 上。\n\n### 关于作者\n\n脚注 1   2   3\n\n# 1. 人工智能基础\n\n历史课\n\n> *人工智能将是* *Google*\
    \ *的终极版本。那个能理解网络上一切内容的终极搜索引擎。它会准确理解你想要什么，并给出正确的结果。我们现在离实现这一点还差得很远。然而，我们可以逐步接近这个目标，而这基本上就是我们正在努力的方向。*\n\
    > \n> ——拉里·佩奇，Google Inc. 联合创始人兼 Alphabet 首席执行官^(⁴)\n\n在弗雷德里克·布朗 1954 年的短篇小说《答案》中，宇宙中\
    \ 960 亿颗行星上的所有计算机被连接成一个超级机器。然后有人问它：“有上帝吗？”它回答道：“是的，*现在*有上帝了。”\n\n毫无疑问，布朗的故事确实很巧妙——同时也带点滑稽和令人不寒而栗！科幻小说一直是我们理解新技术影响的一种方式，而人工智能（AI）一直是一个重要主题。科幻小说中一些最令人难忘的角色涉及变得具有自我意识的机器人或计算机，例如在《终结者》、《银翼杀手》、《2001：太空漫游》，甚至《弗兰肯斯坦》中。\n\
    \n但随着当今新技术和创新永不停歇的步伐，科幻小说开始变成现实。我们现在可以对着智能手机说话并得到答案；我们的社交媒体账户为我们提供感兴趣的内容；我们的银行应用提供提醒；诸如此类。这种个性化内容创作几乎像魔法一样，但正迅速成为我们日常生活中的常态。\n\
    \n要理解人工智能，了解其丰富的历史基础至关重要。你会看到这个行业的发展充满了突破和挫折。还有一群才华横溢的研究人员和学者，如艾伦·图灵、约翰·麦卡锡、马文·明斯基和杰弗里·辛顿，他们不断推动着技术的边界。但纵观整个过程，进步从未停止。\n\
    \n让我们开始吧。\n\n## 艾伦·图灵与图灵测试\n\n艾伦·图灵是计算机科学和人工智能领域的杰出人物。他常被称为“人工智能之父”。\n\n1936 年，他撰写了一篇题为《论可计算数》的论文。在这篇论文中，他阐述了计算机的核心概念，后来被称为图灵机。请记住，真正的计算机直到十多年后才被开发出来。\n\
    \n然而，正是他那篇题为《计算机器与智能》的论文，在人工智能领域具有历史意义。他专注于智能机器的概念。但要做到这一点，必须有一种方法来衡量它。什么是智能——至少对机器而言？\n\
    \n这就是他提出著名的“图灵测试”的地方。这本质上是一个有三个参与者的游戏：两个是人类，一个是计算机。评估者（人类）向另外两个参与者（一个人，一台计算机）提出开放式问题，目的是确定哪一个是人类。如果评估者无法做出判断，那么就可以假定计算机是智能的。图\
    \ 1-1 展示了图灵测试的基本工作流程。\n\n![../images/480660_1_En_1_Chapter/480660_1_En_1_Fig1_HTML.jpg](img/480660_1_En_1_Fig1_HTML.jpg)\n\
    \n图 1-1.\n\n图灵测试的基本工作流程\n\n这个概念的天才之处在于，无需检查机器是否真的知道某些东西、是否具有自我意识，甚至其回答是否正确。相反，图灵测试表明一台机器可以处理大量信息、解释语音并与人类交流。\n\
    \n图灵认为，实际上可能要等到世纪之交，机器才能通过他的测试。是的，这是人工智能领域众多未能实现的预测之一。\n\n那么，多年来图灵测试的表现如何呢？嗯，事实证明它很难被攻克。请记住，有一些竞赛，如勒布纳奖和图灵测试竞赛，旨在鼓励人们创建智能软件系统。\n\
    \n2014 年，有一个案例看起来确实通过了图灵测试。它涉及一台自称 13 岁的计算机。^(⁵) 有趣的是，人类评委很可能被愚弄了，因为有些答案存在错误。\n\
    \n然后在 2018 年 5 月的 Google I/O 大会上，首席执行官桑达尔·皮查伊对 Google Assistant 进行了一次引人注目的演示。^(⁶)\
    \ 在现场观众面前，他使用该设备给当地一家理发店打电话预约。电话那头的人表现得就像在跟真人说话一样！\n\n很神奇，对吧？确实如此。然而，它可能仍然没有通过图灵测试。原因是对话集中在一个主题上——而不是开放式的。\n\
    \n毫不奇怪，图灵测试一直存在争议，因为有些人认为它可以被操纵。1980 年，哲学家约翰·塞尔撰写了一篇著名论文，题为《心灵、大脑与程序》，他在其中提出了自己的思想实验，称为“中文房间论证”，以突出其缺陷。\n\
    \n其工作原理如下：假设约翰在一个房间里，不懂中文。然而，他有一些手册，提供了易于使用的翻译规则。房间外是简，她懂中文，并向约翰提交字符。过了一段时间，她会从约翰那里得到准确的翻译。因此，简有理由相信约翰会说中文。\n\
    \n塞尔的结论：\n\n> 这个论证的要点是：如果房间里的那个人仅仅通过执行一个理解中文的适当程序而不理解中文，那么任何其他数字计算机也仅仅基于此基础也无法理解中文，因为没有任何计算机，作为计算机，拥有那个人所没有的东西。^(⁷)\n\
    \n这是一个相当不错的论点——并且自那以后一直是人工智能界热议的话题。\n\n塞尔还认为人工智能有两种形式：\n"
- fmt: '*   **强人工智能**：这是指机器真正理解正在发生的事情。它甚至可能拥有情感和创造力。在很大程度上，这就是我们在科幻电影中看到的情景。这类人工智能也被称为通用人工智能（AGI）。请注意，只有少数公司专注于这一类别，例如谷歌的`DeepMind`。


    *   **弱人工智能**：在这种情况下，机器进行模式匹配，并且通常专注于狭窄的任务。这方面的例子包括苹果的`Siri`和亚马逊的`Alexa`。


    现实情况是，人工智能正处于弱人工智能的早期阶段。达到强人工智能的水平可能需要数十年时间。一些研究人员认为这可能永远不会发生。


    鉴于图灵测试的局限性，出现了一些替代方案，例如：


    *   **库兹韦尔-卡普尔测试**：来自未来学家`Ray Kurzweil`和科技企业家`Mitch Kapor`。他们的测试要求计算机进行两小时的对话，并且三位评委中有两位认为它是人类在说话。至于`Kapor`，他认为这要到2029年才能实现。


    *   **咖啡测试**：来自苹果公司联合创始人`Steve Wozniak`。根据咖啡测试，机器人必须能够进入陌生人的家中，找到厨房，并煮好一杯咖啡。


    ## 大脑是一台……机器？


    1943年，`Warren McCulloch`和`Walter Pitts`在芝加哥大学相遇，尽管他们的背景截然不同，年龄也相差悬殊（`McCulloch`42岁，`Pitts`18岁），但他们很快成为了挚友。`McCulloch`在一个富裕的东部世家长大，就读于名校。而`Pitts`则成长于低收入社区，甚至在青少年时期无家可归。


    尽管如此，他们的合作却成为了人工智能发展史上最具影响力的合作之一。`McCulloch`和`Pitts`提出了解释大脑的新理论，这些理论常常与弗洛伊德心理学的传统观念相悖。但两人都认为逻辑可以解释大脑的能力，并且也借鉴了`Alan
    Turing`的见解。由此，他们在1943年合著了一篇论文，题为《神经活动中固有思想的逻辑演算》，并发表在《数学生物物理学通报》上。其论点是，大脑的核心功能（如神经元和突触）可以用逻辑和数学来解释，例如使用`And`、`Or`和`Not`等逻辑运算符。通过这些运算符，你可以构建一个能够处理信息、学习和思考的复杂网络。


    具有讽刺意味的是，这篇论文并未在神经学家中获得太多关注。但它确实引起了从事计算机和人工智能研究人员的注意。


    ## 控制论


    虽然`Norbert Wiener`创立了多种理论，但他最著名的是控制论。该理论侧重于理解动物、人和机器中的控制与通信——展示了反馈回路的重要性。


    1948年，`Wiener`出版了《控制论：或关于在动物和机器中控制和通信的科学》。尽管这是一部学术著作——充满了复杂的方程式——但这本书仍然成为了畅销书，登上了《纽约时报》榜单。


    这本书的内容确实非常广泛。其中涉及的一些主题包括牛顿力学、气象学、统计学、天文学和热力学。这本书预示了混沌理论、数字通信甚至计算机内存的发展。


    但这本书对人工智能也产生了影响。像`McCulloch`和`Pitts`一样，`Wiener`将人脑与计算机进行了比较。此外，他推测计算机将能够下棋，并最终击败国际象棋大师。主要原因是他相信机器可以在下棋的过程中学习。他甚至认为计算机能够自我复制。


    但《控制论》也并非乌托邦。`Wiener`在理解计算机的负面影响方面也很有先见之明，例如非人化的可能性。他甚至认为机器会使人变得多余。


    这无疑是一个好坏参半的信息。但`Wiener`的思想是强大的，并推动了人工智能的发展。'
  raw: '*   *Strong AI* : This is when a machine truly understands what is happening.
    There may even be emotions and creativity. For the most part, it is what we see
    in science fiction movies. This type of AI is also known as Artificial General
    Intelligence (AGI). Note that there are only a handful of companies that focus
    on this category, such as Google’s DeepMind.


    *   *Weak AI* : With this, a machine is pattern matching and usually focused on
    narrow tasks. Examples of this include Apple’s Siri and Amazon’s Alexa.


    The reality is that AI is in the early phases of weak AI. Reaching the point of
    strong AI could easily take decades. Some researchers think it may never happen.


    Given the limitations to the Turing Test, there have emerged alternatives, such
    as the following:


    *   *Kurzweil-Kapor Test*: This is from futurologist Ray Kurzweil and tech entrepreneur
    Mitch Kapor. Their test requires that a computer carry on a conversation for two
    hours and that two of three judges believe it is a human talking. As for Kapor,
    he does not believe this will be achieved until 2029.


    *   *Coffee Test*: This is from Apple co-founder Steve Wozniak. According to the
    coffee test, a robot must be able to go into a stranger’s home , locate the kitchen,
    and brew a cup of coffee.


    ## The Brain Is a…Machine?


    In 1943, Warren McCulloch and Walter Pitts met at the University of Chicago, and
    they became fast friends even though their backgrounds were starkly different
    as were their ages (McCulloch was 42 and Pitts was 18). McCulloch grew up in a
    wealthy Eastern Establishment family, having gone to prestigious schools. Pitts,
    on the other hand, grew up in a low-income neighborhood and was even homeless
    as a teenager.


    Despite all this, the partnership would turn into one of the most consequential
    in the development of AI. McCulloch and Pitts developed new theories to explain
    the brain, which often went against the conventional wisdom of Freudian psychology.
    But both of them thought that logic could explain the power of the brain and also
    looked at the insights from Alan Turing. From this, they co-wrote a paper in 1943
    called “A Logical Calculus of the Ideas Immanent in Nervous Activity,” and it
    appeared in the *Bulletin of Mathematical Biophysics*. The thesis was that the
    brain’s core functions like neurons and synapses could be explained by logic and
    mathematics, say with logical operators like And, Or, and Not. With these, you
    could construct a complex network that could process information, learn, and think.


    Ironically, the paper did not get much traction with neurologists. But it did
    get the attention with those working on computers and AI.


    ## Cybernetics


    While Norbert Wiener created various theories, his most famous one was about cybernetics.
    It was focused on understanding control and communications with animals, people,
    and machines—showing the importance of feedback loops.


    In 1948, Wiener published *Cybernetics: Or Control and Communication in the Animal
    and the Machine*. Even though it was a scholarly work—filled with complex equations—the
    book still became a bestseller, hitting the *New York Times* list.


    It was definitely wide ranging. Some of the topics included Newtonian mechanics,
    meteorology, statistics, astronomy, and thermodynamics. This book would anticipate
    the development of chaos theory, digital communications, and even computer memory.


    But the book would also be influential for AI. Like McCulloch and Pitts, Wiener
    compared the human brain to the computer. Furthermore, he speculated that a computer
    would be able to play chess and eventually beat grand masters. The main reason
    is that he believed that a machine could learn as it played games. He even thought
    that computers would be able to replicate themselves.


    But *Cybernetics* was not utopian either. Wiener was also prescient in understanding
    the downsides of computers, such as the potential for dehumanization. He even
    thought that machines would make people unnecessary.


    It was definitely a mixed message. But Wiener’s ideas were powerful and spurred
    the development of AI.'
