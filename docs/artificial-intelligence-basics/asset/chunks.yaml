- fmt: '# Virtual Assistants


    In 2003, as the United States was embroiled in wars in the Middle East, the Defense
    Department was looking to invest in next-generation technologies for the battlefield.
    One of the key initiatives was to build a sophisticated virtual assistant, which
    could recognize spoken instructions. The Defense Department budgeted $150 million
    for this and tasked the `SRI` (Stanford Research Institute) Lab—based in Silicon
    Valley—to develop the application.^([^(120)](#fn120)) Even though the lab was
    a nonprofit, it still was allowed to license its technologies (like the inkjet
    printer) to startups.


    And this is what happened with the virtual assistant. Some of the members of `SRI`—Dag
    Kittlaus, Tom Gruber, and Adam Cheyer—called it `Siri` and started their own company
    to capitalize on the opportunity. They founded the operation in 2007, which was
    when Apple’s `iPhone` was launched.


    But there had to be much more R&D to get the product to the point where it could
    be useful for consumers. The founders had to develop a system to handle real-time
    data, build a search engine for geographic information, and build security for
    credit cards and personal data. But it was `NLP` that was the toughest challenge.


    In an interview, Cheyer noted:


    > The hardest technical challenge with `Siri` was dealing with the massive amounts
    of ambiguity present in human language. Consider the phrase ‘book 4-star restaurant
    in Boston’ — seems very straightforward to understand. Our prototype system could
    handle this easily. However, when we loaded in tens of millions of business names
    and hundreds of thousands of cities into the system as vocabulary (just about
    every word in the English language is a business name), the number of candidate
    interpretations went through the roof.^([^(121)](#fn121))


    But the team was able to solve the problems and turn `Siri` into a powerful system,
    which was launched on Apple’s App Store in February 2010. “It’s the most sophisticated
    voice recognition to appear on a smartphone yet,” according to a review in `Wired.com`.^([^(122)](#fn122))


    Steve Jobs took notice and called the founders. Within a few days, they would
    meet, and the discussions quickly led to an acquisition, which happened in late
    April for more than $200 million.


    However, Jobs thought there needed to be improvements to `Siri`. Because of this,
    there was a re-release in 2011. This actually happened a day before Jobs died.


    Fast forward to today, `Siri` has the largest market share position in the virtual
    assistant market, with 48.6%. Google Assistant is at 28.7%, and Amazon.com’s `Alexa`
    has 13.2%.^([^(123)](#fn123))


    According to the “Voice Assistant Consumer Adoption Report,” about 146.6 million
    people in the United States have tried virtual assistants on their smartphones
    and over 50 million with smart speakers. But this only covers part of the story.
    Voice technology is also becoming embedded into wearables, headphones, and appliances.^([^(124)](#fn124))


    Here are some other interesting findings:


    - Using voice to search for products outranked searches for various entertainment
    options.

    - When it comes to productivity, the most common use cases for voice include making
    calls, sending emails, and setting alarms.

    - The most common use of voice on smartphones occurs when a person is driving.

    - Regarding complaints with voice assistants on smartphones, the one with the
    highest percentage was inconsistency in understanding requests. Again, this points
    to the continuing challenges of `NLP`.


    The growth potential for virtual assistants remains bright, and the category is
    likely to be a key for the AI industry. Juniper Research forecasts that the number
    of virtual assistants in use on a global basis will more than triple to 2.5 billion
    by 2023.^([^(125)](#fn125)) The fastest category is actually expected to be smart
    TVs. Yes, I guess we’ll be holding conversations with these devices!


    # Chatbots


    There is often confusion between the differences between virtual assistants and
    chatbots. Keep in mind that there is much overlap between the two. Both use `NLP`
    to interpret language and perform tasks.


    But there are still critical distinctions. For the most part, chatbots are focused
    primarily for businesses, such as for customer support or sales functions. Virtual
    assistants, on the other hand, are geared for essentially everyone to help with
    their daily activities.


    As we saw in Chapter [1](#480660_1_En_1_Chapter.xhtml), the origins of chatbots
    go back to the 1960s with the development of `ELIZA`. But it was not until the
    past decade or so that this technology became useable at scale.


    Here’s a sampling of interesting chatbots:


    - *Ushur*: This is integrated in the enterprise systems for insurance companies,
    allowing for the automation of claims/bill processing and sales enablement. The
    software has shown, on average, a reduction of 30% in service center call volumes
    and a 90% customer response rate.^([^(126)](#fn126)) The company built its own
    state-of-the-art linguistics engine called `LISA` (this stands for Language Intelligence
    Services Architecture). `LISA` includes `NLP`, `NLU`, sentiment analysis, sarcasm
    detection, topic detection, data extraction, and language translations. The technology
    currently supports 60 languages, making it a useful platform for global organizations.


    - *Mya*: This is a chatbot that can engage in conversations in the recruiting
    process. Like `Ushur`, this is also based on a home-grown `NLP` technology. Some
    of the reasons for this include having better communications but also handling
    specific topics for hiring.^([^(127)](#fn127)) `Mya` greatly reduces time to interview
    and time to hire by eliminating major bottlenecks.


    - *Jane.ai*: This is a platform that mines data across an organization’s applications
    and databases—say `Salesforce.com`, `Office`, `Slack`, and `Gmail`—in order to
    make it much easier to get answers, which are personalized. Note that about 35%
    of an employee’s time is spent just trying to find information! For example, a
    use case of `Jane.ai` is USA Mortgage. The company used the technology, which
    was integrated into `Slack`, to help brokers to look up information for mortgage
    processing. The result is that USA Mortgage has saved about 1,000 human labor
    hours per month.^([^(128)](#fn128))


    Despite all this, chatbots have still had mixed results. For example, just one
    of the problems is that it is difficult to program systems for specialized domains.


    Take a look at a study from `UserTesting`, which was based on the responses from
    500 consumers of healthcare chatbots. Some of the main takeaways included: there
    remains lots of anxiety with chatbots, especially when handling personal information,
    and the technology has problems with understanding complex topics.^([^(129)](#fn129))


    So before deploying a chatbot, there are some factors to consider:


    - *Set Expectations*: Do not overpromise with the capabilities with chatbots.
    This will only set up your organization for disappointment. For example, you should
    not pretend that the chatbot is a human. This is a surefire way to create bad
    experiences. As a result, you might want to start off a chatbot conversation with
    “Hi, I’m a chatbot here to help you with…”


    - *Automation*: In some cases, a chatbot can handle the whole process with a customer.
    But you should still have people in the loop. “The goal for chatbots is not to
    replace humans entirely, but to be the first line of defense, so to speak,” said
    Antonio Cangiano, who is an AI evangelist at IBM. “This can mean not only saving
    companies money but also freeing up human agents who’ll be able to spend more
    time on complex inquiries that are escalated to them.”^([^(130)](#fn130))'
