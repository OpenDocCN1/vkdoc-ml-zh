- fmt: '### Step #1—Business Understanding


    You should come up with a clear view of the business problem to be solved. Some
    examples:


    - How might a price adjustment impact your sales?

    - Will a change in copy lead to improved conversion of digital ads?

    - Does a fall in engagement mean there will be an increase in churn?


    Then, you must establish how you will measure success. Might it be that sales
    should increase by at least 1% or that conversions should rise by 5%?


    Here’s a case from Prasad Vuyyuru, who is a partner at the Enterprise Insights
    Practice of Infosys Consulting:


    > Identifying which business problem to solve using AI and assessing what value
    will be created are critical for the success of all AI projects. Without such
    diligent focus on business value, AI projects risk not getting adopted in the
    organization. AB Inbev’s experience in using AI to identify packaging line motors
    that are likely to fail is a great example of how AI is creating practical value.
    ABInbev installed 20 wireless sensors to measure vibrations at packaging lines
    motors. They compared sounds with normally functioning motors to identify anomalies
    which predicted eventual failure of the motors.^([^(28)](#fn28))


    Regardless of the goal, it’s essential that the process be free of any prejudgments
    or bias. The focus is to find the best results. No doubt, in some cases, there
    will not be a satisfactory result.


    Or, in other situations, there may be big surprises. A famous example of this
    comes from the book *Moneyball* by Michael Lewis, which was also made into a movie
    in 2011 that starred Brad Pitt. It’s a true story of how the Oakland A’s used
    data science techniques to recruit players. The tradition in baseball was to rely
    on metrics like batting averages. But when using sophisticated data analytics
    techniques, there were some startling results. The Oakland A’s realized that the
    focus should be on slugging and on-base percentages. With this information, the
    team was able to recruit high-performing players at lower compensation levels.


    The upshot is that you need to be open minded and willing to experiment.


    In step #1, you should also assemble the right team for the project. Now unless
    you work at a company like Facebook or Google, you will not have the luxury of
    selecting a group of PhDs in machine learning and data science. Such talent is
    quite rare—and expensive.


    But you also do not need an army of top-notch engineers for an AI project either.
    It is actually getting easier to apply machine learning and deep learning models,
    because of open source systems like TensorFlow and cloud-based platforms from
    Google, Amazon.com, and Microsoft. In other words, you may only need a couple
    people with a background in data science.


    Next, you should find people—likely from your organization—who have the right
    domain expertise for the AI project. They will need to think through the workflows,
    models, and the training data—with a particular understanding of the industry
    and customer requirements.


    Finally, you will need to evaluate the technical needs. What infrastructure and
    software tools will be used? Will there be a need to increase capacity or purchase
    new solutions?


    ### Step #2—Data Understanding


    In this step, you will look at the data sources for the project. Consider that
    there are three main ones, which include the following:


    - *In-House Data*: This data may come from a web site, beacons in a store location,
    IoT sensors, mobile apps, and so on. A major advantage of this data is that it
    is free and customized to your business. But then again, there are some risks.
    There can be problems if there has not been enough attention on the data formatting
    or what data should be selected.


    - *Open Source Data*: This is usually freely available, which is certainly a nice
    benefit. Some examples of open source data include government and scientific information.
    The data is often accessed through an API, which makes the process fairly straightforward.
    Open source data is also usually well formatted. However, some of the variables
    may not be clear, and there could be bias, such as being skewed to a certain demographic.


    - *Third-Party Data*: This is data from a commercial vendor. But the fees can
    be high. In fact, the data quality, in some cases, may be lacking.


    According to Teradata—based on the firm’s own AI engagements—about 70% of data
    sources are in-house, 20% from open source, and the rest from commercial vendors.^([^(29)](#fn29))
    But despite the source, all data must be trusted. If not, there will likely be
    the problem of “garbage in, garbage out.”


    To evaluate the data, you need to answer questions like the following:


    - Is the data complete? What might be missing?

    - Where did the data come from?

    - What were the collection points?

    - Who touched the data and processed it?

    - What have been the changes in the data?

    - What are the quality issues?


    If you are working with structured data, then this stage should be easier. However,
    when it comes to unstructured and semi-structured data, you will need to label
    the data—which can be a protracted process. But there are some tools emerging
    in the market that can help automate this process.'
