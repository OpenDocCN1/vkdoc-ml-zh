  trans: '

    ## 起源故事


    约翰·麦卡锡对计算机的兴趣始于 1948 年，当时他参加了一场名为“行为中的大脑机制”的研讨会，该研讨会探讨了机器最终将如何能够思考这一主题。部分与会者包括该领域的先驱，如约翰·冯·诺依曼、艾伦·图灵和克劳德·香农。


    麦卡锡继续沉浸在新兴的计算机行业中——包括在贝尔实验室工作过一段时间——并于 1956 年在达特茅斯大学组织了一个为期十周的研究项目。他将其称为“人工智能研究”。这是该术语首次被使用。


    与会者包括马文·明斯基、纳撒尼尔·罗切斯特、艾伦·纽厄尔、O. G. 塞尔弗里奇、雷蒙德·所罗门诺夫和克劳德·香农等学者。他们后来都成为了人工智能领域的重要人物。


    该研究的目标无疑是雄心勃勃的：


    > 本研究基于以下假设进行：学习或任何其他智能特征的每一个方面，原则上都可以被精确地描述，以至于可以制造一台机器来模拟它。我们将尝试寻找如何让机器使用语言、形成抽象概念和概念、解决目前保留给人类的各类问题，并实现自我改进。我们认为，如果精心挑选一组科学家，共同工作一个夏天，那么在这些问题中的一个或多个方面，可以取得重大进展。^(⁸)


    在会议上，艾伦·纽厄尔、克里夫·肖和赫伯特·西蒙演示了一个名为“逻辑理论家”的计算机程序，该程序由他们在兰德公司开发。其主要灵感来自西蒙（他后来于 1978
    年获得了诺贝尔经济学奖）。当他看到计算机如何为防空系统在地图上打印文字时，他意识到这些机器可能不仅仅是处理数字。它们还可以处理图像、字符和符号——所有这些都可能导向一台会思考的机器。


    关于逻辑理论家，其重点是解决《数学原理》中的各种数学定理。该软件得出的一个解决方案甚至比原书中的更为优雅——该书的合著者伯特兰·罗素对此感到非常高兴。


    创建逻辑理论家绝非易事。纽厄尔、肖和西蒙使用了 IBM 701 计算机，该计算机使用机器语言。因此，他们创建了一种名为 IPL（信息处理语言）的高级语言，从而加快了编程速度。在数年间，它都是人工智能领域的首选语言。


    IBM 701 也没有足够的内存来运行逻辑理论家。这导致了另一项创新：列表处理。它允许程序在运行时动态地分配和释放内存。


    要点：逻辑理论家被认为是第一个开发出来的人工智能程序。


    尽管如此，它并没有引起太多兴趣！达特茅斯会议总体上令人失望。甚至连“人工智能”这个短语也受到了批评。


    研究人员试图提出替代方案，例如“复杂信息处理”。但它们不像人工智能那样朗朗上口——于是这个术语就保留了下来。


    至于麦卡锡，他继续致力于推动人工智能领域的创新。请看以下内容：


    *   在 20 世纪 50 年代末，他开发了 Lisp 编程语言，该语言因易于处理非数值数据而常被用于人工智能项目。他还创造了递归、动态类型和垃圾回收等编程概念。Lisp
    至今仍在使用，例如在机器人技术和商业应用中。在开发该语言的同时，他还共同创立了麻省理工学院人工智能实验室。


    *   1961 年，他提出了计算机分时概念，这对整个行业产生了变革性的影响。这也促成了互联网和云计算的发展。


    *   几年后，他创立了斯坦福大学人工智能实验室。


    *   1969 年，他撰写了一篇题为“计算机控制的汽车”的论文，其中描述了一个人如何通过键盘输入指令，并由一台电视摄像机来导航车辆。


    *   他于 1971 年获得了图灵奖。该奖项被认为是计算机科学领域的诺贝尔奖。


    在 2006 年的一次演讲中，麦卡锡指出，他对于强人工智能的进展过于乐观了。在他看来，“我们人类并不擅长识别我们自己使用的启发式方法。”^(⁹)

    '
- fmt: "# Golden Age of AI\n\nFrom 1956 to 1974, the AI field was one of the hottest\
    \ spots in the tech world. A major catalyst was the rapid development in computer\
    \ technologies. They went from being massive systems—based on vacuum tubes—to\
    \ smaller systems run on integrated circuits that were much quicker and had more\
    \ storage capacity.\n\nThe federal government was also investing heavily in new\
    \ technologies. Part of this was due to the ambitious goals of the Apollo space\
    \ program and the heavy demands of the Cold War.\n\nAs for AI, the main funding\
    \ source was the Advanced Research Projects Agency (ARPA), which was launched\
    \ in the late 1950s after the shock of Russia’s Sputnik. The spending on projects\
    \ usually came with few requirements. The goal was to inspire breakthrough innovation.\
    \ One of the leaders of ARPA, J. C. R. Licklider, had a motto of “fund people,\
    \ not projects.” For the most part, the majority of the funding was from Stanford,\
    \ MIT, Lincoln Laboratories, and Carnegie Mellon University.\n\nOther than IBM,\
    \ the private sector had little involvement in AI development. Keep in mind that—by\
    \ the mid-1950s—IBM would pull back and focus on the commercialization of its\
    \ computers. There was actually fear from customers that this technology would\
    \ lead to significant job losses. So IBM did not want to be blamed.\n\nIn other\
    \ words, much of the innovation in AI spun out from academia. For example, in\
    \ 1959, Newell, Shaw, and Simon continued to push the boundaries in the AI field\
    \ with the development of a program called “General Problem Solver.” As the name\
    \ implied, it was about solving math problems, such as the Tower of Hanoi.\n\n\
    But there were many other programs that attempted to achieve some level of strong\
    \ AI. Examples included the following:\n\n*   `SAINT` or Symbolic Automatic INTegrator\
    \ (1961): This program, created by MIT researcher James Slagle, helped to solve\
    \ freshman calculus problems. It would be updated into other programs, called\
    \ `SIN` and `MACSYMA`, that did much more advanced math. `SAINT` was actually\
    \ the first example of an expert system, a category of AI we’ll cover later in\
    \ this chapter.\n\n*   `ANALOGY` (1963): This program was the creation of MIT\
    \ professor Thomas Evans. The application demonstrated that a computer could solve\
    \ analogy problems of an IQ test.\n\n*   `STUDENT` (1964): Under the supervision\
    \ of Minsky at MIT, Daniel Bobrow created this AI application for his PhD thesis.\
    \ The system used Natural Language Processing (NLP) to solve algebra problems\
    \ for high school students.\n\n*   `ELIZA` (1965): MIT professor Joseph Weizenbaum\
    \ designed this program, which instantly became a big hit. It even got buzz in\
    \ the mainstream press. It was named after Eliza (based on George Bernard Shaw’s\
    \ play *Pygmalion*) and served as a psychoanalyst. A user could type in questions,\
    \ and `ELIZA` would provide counsel (this was the first example of a chatbot).\
    \ Some people who used it thought the program was a real person, which deeply\
    \ concerned Weizenbaum since the underlying technology was fairly basic. You can\
    \ find examples of `ELIZA` on the web, such as at `http://psych.fullerton.edu/mbirnbaum/psych101/Eliza.htm`.\n\
    \n*   Computer Vision (1966): In a legendary story, MIT’s Marvin Minsky said to\
    \ a student, Gerald Jay Sussman, to spend the summer linking a camera to a computer\
    \ and getting the computer to describe what it saw. He did just that and built\
    \ a system that detected basic patterns. It was the first use of computer vision.\n\
    \n*   Mac Hack (1968): MIT professor Richard D. Greenblatt created this program\
    \ that played chess. It was the first to play in real tournaments and got a C-rating.\n\
    \n*   Hearsay I (Late 1960s): Professor Raj Reddy developed a continuous speech\
    \ recognition system. Some of his students would then go on to create Dragon Systems,\
    \ which became a major tech company.\n\nDuring this period, there was a proliferation\
    \ of AI academic papers and books. Some of the topics included Bayesian methods,\
    \ machine learning, and vision.\n\nBut there were generally two major theories\
    \ about AI. One was led by Minsky, who said that there needed to be symbolic systems.\
    \ This meant that AI should be based on traditional computer logic or preprogramming—that\
    \ is, the use of approaches like `If-Then-Else` statements.\n\nNext, there was\
    \ Frank Rosenblatt, who believed that AI needed to use systems similar to the\
    \ brain like neural networks (this field was also known as connectionism). But\
    \ instead of calling the inner workings neurons, he referred to them as perceptrons.\
    \ A system would be able to learn as it ingested data over time.\n\nIn 1957, Rosenblatt\
    \ created the first computer program for this, called the Mark 1 Perceptron. It\
    \ included cameras to help to differentiate between two images (they had 20 ×\
    \ 20 pixels). The Mark 1 Perceptron would use data that had random weightings\
    \ and then go through the following process:\n\n1.  Take in an input and come\
    \ up with the perceptron output.\n\n2.  If there is not a match, then\n    1.\
    \  If the output should have been 0 but was 1, then the weight for 1 will be decreased.\n\
    \    2.  If the output should have been 1 but was 0, then the weight for 1 will\
    \ be increased.\n\n3.  Repeat steps #1 and #2 until the results are accurate.\n\
    \nThis was definitely pathbreaking for AI. The *New York Times* even had a write-up\
    \ for Rosenblatt, extolling “The Navy revealed the embryo of an electronic computer\
    \ today that it expects will be able to walk, talk, see, write, reproduce itself\
    \ and be conscious of its existence.”^([^(10)](#fn10))\n\nBut there were still\
    \ nagging issues with the perceptron. One was that the neural network had only\
    \ one layer (primarily because of the lack of computation power at the time).\
    \ Next, brain research was still in the nascent stages and did not offer much\
    \ in terms of understanding cognitive ability.\n\nMinsky would co-write a book,\
    \ along with Seymour Papert, called *Perceptrons* (1969). The authors were relentless\
    \ in attacking Rosenblatt’s approach, and it quickly faded away. Note that in\
    \ the early 1950s Minsky developed a crude neural net machine, such as by using\
    \ hundreds of vacuum tubes and spare parts from a B-24 bomber. But he saw that\
    \ the technology was nowhere at a point to be workable.\n\nRosenblatt tried to\
    \ fight back, but it was too late. The AI community quickly turned sour on neural\
    \ networks. Rosenblatt would then die a couple years later in a boating accident.\
    \ He was 43 years old.\n\nYet by the 1980s, his ideas would be revived—which would\
    \ lead to a revolution in AI, primarily with the development of deep learning.\n\
    \nFor the most part, the Golden Age of AI was freewheeling and exciting. Some\
    \ of the brightest academics in the world were trying to create machines that\
    \ could truly think. But the optimism often went to the extremes. In 1965, Simon\
    \ said that within 20 years, a machine could do anything a human could. Then in\
    \ 1970, in an interview with *Life* magazine, he said this would happen in only\
    \ 3–8 years (by the way, he was an advisor on the *2001: A Space Odyssey* movie).\n\
    \nUnfortunately, the next phase of AI would be much darker. There were more academics\
    \ who were becoming skeptical. Perhaps the most vocal was Hubert Dreyfus, a philosopher.\
    \ In books such as *What Computers Still Can’t Do: A Critique of Artificial Reason*,^([^(11)](#fn11))\
    \ he set forth his ideas that computers were not similar to the human brain and\
    \ that AI would woefully fall short of the lofty expectations."
