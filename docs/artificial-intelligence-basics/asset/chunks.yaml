- fmt: '# 排版后的内容


    - **Friction**: As much as possible, try to find ways for the chatbot to solve
    problems as quickly as possible. And this may not necessarily be using a conversation.
    Instead, providing a simple form to fill out could be a better alternative, say
    to schedule a demo.


    - **Repetitive Processes**: These are often ideal for chatbots. Examples include
    authentication, order status, scheduling, and simple change requests.


    - **Centralization**: Make sure you integrate the data with your chatbots. This
    will allow for more seamless experiences. No doubt, customers quickly get annoyed
    if they have to repeat information.


    - **Personalize the Experience**: This is not easy but can yield major benefits.
    Jonathan Taylor, who is the CTO of Zoovu, has this example: “Purchasing a camera
    lens will be different for every shopper. There are many variations of lenses
    that perhaps a slightly informed shopper understands—but the average consumer
    may not be as informed. Providing an assistive chatbot to guide a customer to
    the right lens can help provide the same level of customer service as an in-store
    employee. The assistive chatbot can ask the right questions, understanding the
    goal of the customer to provide a personalized product recommendation including
    ‘what kind of camera do you already have,’ ‘why are you buying a new camera,’
    and ‘what are you primarily trying to capture in your photographs?’”^([^(131)](#fn131))


    - **Data Analytics**: It’s critical to monitor the feedback with a chatbot. What’s
    the satisfaction? What’s the accuracy rate?


    - **Conversational Design and User Experience (UX)**: It’s different than creating
    a web site or even a mobile app. With a chatbot, you need to think about the user’s
    personality, gender, and even cultural context. Moreover, you must consider the
    “voice” of your company. “Rather than creating mockups of a visual interface,
    think about writing scripts and playing them out before to build it,” said Gillian
    McCann, who is head of Cloud Engineering and Artificial Intelligence at Workgrid
    Software.^([^(132)](#fn132))


    Even with the issues with chatbots, the technology is continuing to improve. More
    importantly, these systems are likely to become an increasingly important part
    of the AI industry. According to IDC, about $4.5 billion will be spent on chatbots
    in 2019—which compares to a total of $35.8 billion estimated for AI systems.^([^(133)](#fn133))


    Something else: A study from Juniper Research indicates that the cost savings
    from chatbots are likely to be substantial. The firm predicts they will reach
    $7.3 billion by 2023, up from a mere $209 million in 2019.^([^(134)](#fn134))


    ## Future of NLP


    In 1947, Boris Katz was born in Moldova, which was part of the Soviet Union. He
    would go on to graduate from Moscow State University, where he learned about computers,
    and then left the country to the United States (with the assistance of Senator
    Edward Kennedy).


    He wasted little time with the opportunity. Besides writing more than 80 technical
    publications and receiving two US patents, he created the `START` system that
    allowed for sophisticated NLP capabilities. It was actually the basis for the
    first Q&A site on the Web in 1993. Yes, this was the forerunner to breakout companies
    like Yahoo! and Google.


    Boris’s innovations were also critical for IBM’s `Watson`, which is now at the
    core of the company’s AI efforts. This computer, in 2011, would shock the world
    when it beat two of the all-time champions of the popular game show *Jeopardy!*


    Despite all the progress with NLP, Boris is not satisfied. He believes we are
    still in the early stages and lots more must be done to get true value. In an
    interview with the *MIT Technology Review*, he said: “But on the other hand, these
    programs [like Siri and Alexa] are so incredibly stupid. So there’s a feeling
    of being proud and being almost embarrassed. You launch something that people
    feel is intelligent, but it’s not even close.”^([^(135)](#fn135))


    This is not to imply he’s a pessimist. However, he still thinks there needs to
    be a rethinking of NLP if it is to get to the point of “real intelligence.” To
    this end, he believes researchers must look beyond pure computer science to broad
    areas like neuroscience, cognitive science, and psychology. He also thinks NLP
    systems must do a much better job of understanding the actions in the real world.


    ## Conclusion


    For many people, the first interaction with NLP is with virtual assistants. Even
    while the technology is far from perfect, it still is quite useful—especially
    for answering questions or getting information, say about a nearby restaurant.


    But NLP is also having a major impact in the business world. In the years ahead,
    the technology will become increasingly important for e-commerce and customer
    service—providing significant cost savings and allowing employees to focus on
    more value-added activities.


    True, there is still a long way to go because of the complexities of language.
    But the progress continues to be rapid, especially with the help of next-generation
    AI approaches like deep learning.'
