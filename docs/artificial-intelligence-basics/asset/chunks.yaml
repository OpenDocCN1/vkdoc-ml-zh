    and domain expertise. There will also likely be a need for some AI training. This
    is the case even for those with backgrounds in data science and engineering.


    From here, there should be no rush in the steps of the project: assessing the
    IT environment, setting up a clear business objective, cleaning the data, selecting
    the right tools and platforms, creating the AI model, and deploying the system.
    With early projects, there will inevitably be challenges so it’s critical to be
    flexible. But the effort should be well worth it.'
