- fmt: '# Approaches to Implementing AI


    Using AI in a company generally involves two approaches: using vendor software
    or creating in-house models. The first one is the most prevalent—and may be enough
    for a large number of companies. The irony is that you may already be using software,
    say from `Salesforce.com`, `Microsoft`, `Google`, `Workday`, `Adobe`, or `SAP`,
    that already has powerful AI capabilities. In other words, a good approach is
    to make sure you are taking advantage of these to the fullest.


    To see what’s available, take a look at `Salesforce.com`’s `Einstein`, which was
    launched in September 2016. This AI system is seamlessly embedded into the main
    CRM (Customer Relationship Management) platform, allowing for more predictive
    and personalized actions for sales, service, marketing, and commerce. `Salesforce.com`
    calls `Einstein` a “personal data scientist” as it is fairly easy to use, such
    as with drag and drop to create the workflows. Some of the capabilities include
    the following:


    - *Predictive Scoring*: This shows the likelihood that a lead will convert into
    an opportunity.

    - *Sentiment Analysis*: This provides a way to get a sense of how people view
    your brand and products by analyzing social media.

    - *Smart Recommendations*: `Einstein` crunches data to show what products are
    the most ideal for leads.


    However, while these prebuilt features make it easier to use AI, there are still
    potential issues. “We have been building AI functions into our applications during
    the past few years and this has been a great learning experience,” said Ricky
    Thakrar, who is Zoho’s customer experience evangelist. “But to make the technology
    work, the users must use the software right. If the sales people are not inputting
    information correctly, then the results will likely be off. We also found that
    there should be at least three months of usage for the models to get trained.
    And besides, even if your employees are doing everything right, this does not
    mean that the AI predictions will be perfect. Always take things with a grain
    of salt.”^([^(172)](#fn172))


    Now as for building your own AI models, this is a significant commitment for a
    company. And this is what we’ll be covering in this chapter.


    But regardless of what approach you may take, the implementation and use of AI
    should first begin with education and training. It does not matter whether the
    employees are non-technical people or software engineers. For AI to be successful
    in an organization, everyone must have a core understanding of the technology.
    Yes, this book will be helpful but there are many online resources to help out
    as well, such as from training platforms like `Lynda`, `Udacity`, and `Udemy`.
    They provide hundreds of high-quality courses on many topics about AI.


    To give a sense of what a corporate training program looks like, consider `Adobe`.
    Even though the company has incredibly talented engineers, there are still a large
    number who do not have a background in AI. Some of them may not have specialized
    in this in school or their work. Yet `Adobe` wanted to ensure that all the engineers
    had a solid grasp of the core principles of AI. To this end, the company has a
    six-month certification program, which trained 5,000 engineers in 2018. The goal
    is to unleash the data scientist in each engineer.


    The program includes both online courses and in-person sessions, which not only
    cover technical topics but also areas like strategy and even ethics. `Adobe` also
    provides help from senior computer scientists to assist students to master the
    topics.


    Next, early on in the implementation process, it’s essential to think about the
    potential risks. Perhaps one of the most threatening is bias since it can easily
    seep into an AI model.


    An example of this is `Amazon.com`, which shut down its AI-powered recruiting
    software in 2017. The main issue was that it was biased for hiring males. Interestingly
    enough, this was a classic case of a training problem for the model. Consider
    that a majority of the resume submissions were from men—so the data was skewed.
    `Amazon.com` even tried to tweak the model, but still the results were far from
    being gender neutral.^([^(173)](#fn173))


    In this case, the issue was not just about making decisions that were based on
    faulty premises. `Amazon.com` was also probably exposing itself to potential legal
    liability, such as with discrimination claims.


    Given the tricky issues with AI, more companies are putting together ethics boards.
    But even this can be fraught with problems. Hey, what may be ethical for one person
    may not be a big deal for someone else, right? Definitely.


    For example, `Google` closed down its own ethics board in about a week of its
    launch. It appears the main reason was the backlash that came from including a
    member from the Heritage Foundation, which is a conservative think tank.^([^(174)](#fn174))


    ## The Steps for AI Implementation


    If you plan to implement your own AI models, what are the main steps to consider?
    What are the best practices? Well, first of all, it’s critically important that
    your data is fairly clean and structured in a way to allow for modelling (see
    Chapter [2](#480660_1_En_2_Chapter.xhtml)).


    Here are some other steps to look at:


    - Identify a problem to solve.

    - Put together a strong team.

    - Select the right tools and platforms.

    - Create the AI model (we went through this process in Chapter [3](#480660_1_En_3_Chapter.xhtml)).

    - Deploy and monitor the AI model.


    Let’s take a look at each.'
  raw: '## Approaches to Implementing AI


    Using AI in a company generally involves two approaches: using vendor software
    or creating in-house models. The first one is the most prevalent—and may be enough
    for a large number of companies. The irony is that you may already be using software,
    say from Salesforce.com, Microsoft, Google, Workday, Adobe, or SAP, that already
    has powerful AI capabilities. In other words, a good approach is to make sure
    you are taking advantage of these to the fullest.


    To see what’s available, take a look at Salesforce.com’s Einstein, which was launched
    in September 2016\. This AI system is seamlessly embedded into the main CRM (Customer
    Relationship Management) platform, allowing for more predictive and personalized
    actions for sales, service, marketing, and commerce. Salesforce.com calls Einstein
    a “personal data scientist” as it is fairly easy to use, such as with drag and
    drop to create the workflows. Some of the capabilities include the following:


    *   *Predictive Scoring*: This shows the likelihood that a lead will convert into
    an opportunity.


    *   *Sentiment Analysis*: This provides a way to get a sense of how people view
    your brand and products by analyzing social media.


    *   *Smart Recommendations*: Einstein crunches data to show what products are
    the most ideal for leads.


    However, while these prebuilt features make it easier to use AI, there are still
    potential issues. “We have been building AI functions into our applications during
    the past few years and this has been a great learning experience,” said Ricky
    Thakrar, who is Zoho’s customer experience evangelist. “But to make the technology
    work, the users must use the software right. If the sales people are not inputting
    information correctly, then the results will likely be off. We also found that
    there should be at least three months of usage for the models to get trained.
    And besides, even if your employees are doing everything right, this does not
    mean that the AI predictions will be perfect. Always take things with a grain
    of salt.”^([^(172)](#fn172))


    Now as for building your own AI models, this is a significant commitment for a
    company. And this is what we’ll be covering in this chapter.


    But regardless of what approach you may take, the implementation and use of AI
    should first begin with education and training. It does not matter whether the
    employees are non-technical people or software engineers. For AI to be successful
    in an organization, everyone must have a core understanding of the technology.
    Yes, this book will be helpful but there are many online resources to help out
    as well, such as from training platforms like Lynda, Udacity, and Udemy. They
    provide hundreds of high-quality courses on many topics about AI.


    To give a sense of what a corporate training program looks like, consider Adobe.
    Even though the company has incredibly talented engineers, there are still a large
    number who do not have a background in AI. Some of them may not have specialized
    in this in school or their work. Yet Adobe wanted to ensure that all the engineers
    had a solid grasp of the core principles of AI. To this end, the company has a
    six-month certification program, which trained 5,000 engineers in 2018. The goal
    is to unleash the data scientist in each engineer.


    The program includes both online courses and in-person sessions, which not only
    cover technical topics but also areas like strategy and even ethics. Adobe also
    provides help from senior computer scientists to assist students to master the
    topics.


    Next, early on in the implementation process, it’s essential to think about the
    potential risks. Perhaps one of the most threatening is bias since it can easily
    seep into an AI model.


    An example of this is Amazon.com, which shut down its AI-powered recruiting software
    in 2017\. The main issue was that it was biased for hiring males. Interestingly
    enough, this was a classic case of a training problem for the model. Consider
    that a majority of the resume submissions were from men—so the data was skewed.
    Amazon.com even tried to tweak the model, but still the results were far from
    being gender neutral.^([^(173)](#fn173))


    In this case, the issue was not just about making decisions that were based on
    faulty premises. Amazon.com was also probably exposing itself to potential legal
    liability, such as with discrimination claims.


    Given the tricky issues with AI, more companies are putting together ethics boards.
    But even this can be fraught with problems. Hey, what may be ethical for one person
    may not be a big deal for someone else, right? Definitely.


    For example, Google closed down its own ethics board in about a week of its launch.
    It appears the main reason was the backlash that came from including a member
    from the Heritage Foundation, which is a conservative think tank.^([^(174)](#fn174))


    ## The Steps for AI Implementation


    If you plan to implement your own AI models, what are the main steps to consider?
    What are the best practices? Well, first of all, it’s critically important that
    your data is fairly clean and structured in a way to allow for modelling (see
    Chapter [2](#480660_1_En_2_Chapter.xhtml)).


    Here are some other steps to look at:


    *   Identify a problem to solve.


    *   Put together a strong team.


    *   Select the right tools and platforms.


    *   Create the AI model (we went through this process in Chapter [3](#480660_1_En_3_Chapter.xhtml)).


    *   Deploy and monitor the AI model.


    Let’s take a look at each.'
  trans: '

    ## 实施人工智能的方法


    在企业中使用人工智能通常涉及两种方法：使用供应商软件或创建内部模型。第一种方法最为普遍——并且可能对大量公司来说已经足够。讽刺的是，你可能已经在使用来自 Salesforce.com、微软、谷歌、Workday、Adobe
    或 SAP 等公司的软件，这些软件已经具备了强大的人工智能功能。换句话说，一个好的方法是确保你充分利用了这些功能。


    要了解有哪些可用功能，可以看看 Salesforce.com 在 2016 年 9 月推出的 Einstein。这个人工智能系统无缝嵌入到主要的 CRM（客户关系管理）平台中，为销售、服务、营销和商务提供更具预测性和个性化的操作。Salesforce.com
    将 Einstein 称为“个人数据科学家”，因为它使用起来相当简单，例如通过拖放来创建工作流程。其部分功能包括：


    *   *预测评分*：显示潜在客户转化为商机的可能性。


    *   *情感分析*：通过分析社交媒体，提供一种了解人们如何看待你的品牌和产品的方式。


    *   *智能推荐*：Einstein 分析数据，以显示哪些产品最适合潜在客户。


    然而，虽然这些预构建的功能使人工智能更容易使用，但仍然存在潜在问题。“在过去几年里，我们一直在将人工智能功能构建到我们的应用程序中，这是一次很棒的学习经历，”Zoho
    的客户体验布道者 Ricky Thakrar 说道。“但要让这项技术发挥作用，用户必须正确使用软件。如果销售人员没有正确输入信息，那么结果很可能会偏离。我们还发现，模型至少需要三个月的使用数据来进行训练。此外，即使你的员工一切都做对了，这也不意味着人工智能的预测会是完美的。对任何事情都要持保留态度。”^(¹⁷²)


    至于构建你自己的人工智能模型，这对公司来说是一项重大的投入。而这正是我们将在本章中讨论的内容。


    但无论你采取哪种方法，人工智能的实施和使用都应首先从教育和培训开始。无论员工是非技术人员还是软件工程师，这一点都同样重要。为了让人工智能在一个组织中成功应用，每个人都必须对这项技术有核心的理解。是的，这本书会有所帮助，但网上也有很多资源可以提供帮助，例如来自
    Lynda、Udacity 和 Udemy 等培训平台的资源。它们提供了数百门关于人工智能众多主题的高质量课程。


    为了让你了解企业培训计划是什么样的，可以看看 Adobe 的例子。尽管该公司拥有极具天赋的工程师，但仍有大量工程师没有人工智能背景。他们中的一些人可能在学校或工作中没有专攻这个领域。然而，Adobe
    希望确保所有工程师都扎实掌握人工智能的核心原理。为此，公司设立了一个为期六个月的认证项目，该项目在 2018 年培训了 5000 名工程师。其目标是释放每位工程师身上的数据科学家潜能。


    该项目包括在线课程和线下课程，不仅涵盖技术主题，还涉及战略甚至伦理等领域。Adobe 还提供资深计算机科学家的帮助，以协助学员掌握这些主题。


    接下来，在实施过程的早期阶段，考虑潜在风险至关重要。其中最具威胁性的风险之一可能是偏见，因为它很容易渗透到人工智能模型中。


    亚马逊公司就是一个例子，它在 2017 年关闭了其人工智能驱动的招聘软件。主要问题在于该软件在招聘男性方面存在偏见。有趣的是，这是一个典型的模型训练问题。考虑到大部分简历提交来自男性——因此数据存在偏差。亚马逊甚至试图调整模型，但结果仍然远未达到性别中立。^(¹⁷³)


    在这种情况下，问题不仅仅在于基于错误前提做出决策。亚马逊可能还使自己面临潜在的法律责任，例如歧视索赔。


    鉴于人工智能带来的棘手问题，越来越多的公司正在组建伦理委员会。但即使这样也可能问题重重。嘿，对一个人来说合乎伦理的事情，对另一个人来说可能没什么大不了的，对吧？确实如此。


    例如，谷歌在其伦理委员会成立大约一周后就将其关闭。主要原因似乎是，因纳入来自传统基金会（一个保守派智库）的成员而引发的强烈反对。^(¹⁷⁴)


    ## 人工智能实施的步骤


    如果你计划实施自己的人工智能模型，需要考虑哪些主要步骤？最佳实践是什么？嗯，首先，你的数据必须相当干净且结构合理，以便进行建模（见第 2 章），这一点至关重要。


    以下是一些其他需要考虑的步骤：


    *   确定要解决的问题。


    *   组建一个强大的团队。


    *   选择合适的工具和平台。


    *   创建人工智能模型（我们在第 3 章中介绍了这个过程）。


    *   部署并监控人工智能模型。


    让我们逐一来看。

    '
- fmt: '# Identify a Problem to Solve


    Founded in 1976, `HCL Technologies` is one of the largest IT consulting firms,
    with 132,000 employees across 44 countries, and has half the Fortune 500 as customers.
    The company also has implemented a large number of AI systems.


    Here’s what Kalyan Kumar, who is the corporate vice president and global CTO of
    `HCL Technologies`, has to say:


    - Business leaders need to understand and realize that the adoption of Artificial
    Intelligence is a journey and not a sprint. It is critical that the people driving
    AI adoption within an enterprise remain realistic about the timeframe and what
    AI is capable of doing. The relationship between humans and AI is mutually empowering,
    and any AI implementation may take some time before it starts to make a positive
    and significant impact.^([^(175)](#fn175))


    It’s great advice. This is why—especially for companies that are starting in the
    AI journey—it’s essential to take an experimental approach. Think of it as putting
    together a pilot program—that is, you are in the “crawl and walk phase.”


    But when it comes to the AI implementation process, it’s common to get too focused
    on the different technologies, which are certainly fascinating and powerful. Yet
    success is far more than just technology; in other words, there must first be
    a clear business case. So here are some areas to think about when starting out:


    - No doubt, decisions in companies are often ad hoc and, well, a matter of guessing!
    But with AI, you have an opportunity to use data-driven decision-making, which
    should have more accuracy. Then where in your organization can this have the biggest
    benefit?


    - As seen with Robotic Process Automation (`RPA`), which we covered in Chapter
    [5](#480660_1_En_5_Chapter.xhtml), AI can be extremely effective when handling
    repetitive and mundane tasks.


    - Chatbots can be another way to start out with AI. They are relatively easy to
    set up and can serve specific use cases, such as customer service. You can learn
    more about this in Chapter [6](#480660_1_En_6_Chapter.xhtml).


    Andrew Ng, who is the CEO of `Landing AI` and the former head of `Google Brain`,
    has come up with various approaches to think about when identifying what to focus
    on with your initial AI project:^([^(176)](#fn176))


    - *Quick Win*: A project should take anywhere from 6 to 12 months and must have
    a high probability of success, which should help provide momentum for more initiatives.
    Andrew suggests having a couple projects as it increases the odds of getting a
    win.


    - *Meaningful*: A project does not have to be transformative. But it should have
    results that help improve the company in a notable way, creating more buy-in for
    additional AI investments. The value usually comes from lower costs, higher revenues,
    finding new extensions of the business, or mitigating risks.


    - *Industry-Specific Focus*: This is critical since a successful project will
    be another factor in boosting buy-in. Thus, if you have a company that sells a
    subscription service, then an AI system to lessen churn would be a good place
    to start.


    - *Data*: Do not limit your options based on the amount of data you have. Andrew
    notes that a successful AI project may have as little as 100 data points. But
    the data must still be high quality and fairly clean, which are key topics covered
    in Chapter [2](#480660_1_En_2_Chapter.xhtml).


    When looking at this phase, it is also worth evaluating the “tango” between employees
    and machines. Keep in mind that this is often missed—and it can have adverse consequences
    on an AI project. As we’ve seen in this book, AI is great at processing huge amounts
    of data with little error at great speed. The technology is also excellent with
    predictions and detecting anomalies. But there are tasks that humans do much better,
    such as being creative, engaging in abstraction, and understanding concepts.


    Note the following example of this from Erik Schluntz, who is the co-founder and
    CTO at `Cobalt Robotics`:


    - Our security robots are excellent at detecting unusual events in workplace and
    campus settings, like spotting a person in a dark office with AI-powered thermal-imaging.
    But one of our human operators then steps in and makes the call of how to respond.
    Even with all of AI’s potential, it’s still not the best mission-critical option
    when pitted against constantly changing environmental variables and human unpredictability.
    Consider the gravity of AI making a mistake in different situations—failing to
    detect a malicious intruder is much worse than accidentally sounding a false alarm
    to one of our operators.^([^(177)](#fn177))


    Next, make sure you are clear-cut about the KPIs and measure them diligently.
    For example, if you are developing a custom chatbot for customer service, you
    might want to measure against metrics like the resolution rate and customer satisfaction.


    And finally, you will need to do an IT assessment. If you have mostly legacy systems,
    then it could be more difficult and expensive to implement AI, even if vendors
    have APIs and integrations. This means you will need to temper your expectations.


    Despite all this, the investments can truly move the needle, even for old-line
    companies. To see an example of this, consider `Symrise`, whose roots go back
    more than 200 years in Germany. As of this writing, the company is a global producer
    of flavors and fragrances, with over 30,000 products.


    A few years ago, `Symrise` embarked on a major initiative, with the help of `IBM`,
    to leverage AI to create new perfumes. The company not only had to retool its
    existing IT infrastructure but also had to spend considerable time fine-tuning
    the models. But a big help was that it already had an extensive dataset, which
    allowed for more precision. Note that even a slight deviation in the mixture of
    a compound can make a perfume fail.


    According to `Symrise`’s president of Scent and Care, Achim Daub:


    - Now our perfumers can work with an AI apprentice by their side, that can analyze
    thousands of formulas and historical data to identify patterns and predict novel
    combinations, helping to make them more productive, and accelerate the design
    process by guiding them toward formulas that have never been seen before.^([^(178)](#fn178))'
