  trans: '

    ### 第一步——业务理解


    你需要对要解决的业务问题形成清晰的认识。例如：


    *   价格调整会如何影响销售额？


    *   文案的更改能否提升数字广告的转化率？


    *   用户参与度下降是否意味着流失率会上升？


    接着，你必须确定如何衡量成功。是销售额至少增长 1%，还是转化率提升 5%？


    以下是印孚瑟斯咨询公司企业洞察实践部合伙人普拉萨德·维尤鲁（Prasad Vuyyuru）分享的一个案例：


    > 确定使用人工智能解决哪个业务问题，并评估将创造何种价值，是所有人工智能项目成功的关键。如果缺乏对业务价值的这种专注，人工智能项目就有可能无法在组织内得到采纳。百威英博利用人工智能识别可能发生故障的包装线电机的经验，就是人工智能创造实际价值的一个绝佳范例。百威英博安装了
    20 个无线传感器来测量包装线电机的振动。他们将这些声音与正常运转的电机进行比较，以识别异常，从而预测电机最终可能发生的故障。^(²⁸)


    无论目标是什么，整个过程都必须避免任何预判或偏见。重点是找到最佳结果。毫无疑问，在某些情况下，可能无法得到令人满意的结果。


    或者，在其他情况下，可能会有巨大的惊喜。迈克尔·刘易斯（Michael Lewis）所著的《点球成金》一书中就有一个著名的例子，该书于 2011 年被改编成电影，由布拉德·皮特主演。这是一个关于奥克兰运动家队如何运用数据科学技术招募球员的真实故事。棒球界的传统是依赖诸如击球率之类的指标。但当使用复杂的数据分析技术时，却得出了一些令人震惊的结果。奥克兰运动家队意识到，重点应该放在长打率和上垒率上。凭借这一信息，该队得以用较低的薪酬水平招募到表现出色的球员。


    结论是，你需要保持开放的心态并愿意尝试。


    在第一步中，你还应该为项目组建合适的团队。除非你在像 Facebook 或谷歌这样的公司工作，否则你不太可能奢侈地挑选一群机器学习与数据科学领域的博士。这样的人才相当稀缺——而且成本高昂。


    但一个人工智能项目也并非需要一支顶尖工程师大军。实际上，应用机器学习和深度学习模型正变得越来越容易，这要归功于像 TensorFlow 这样的开源系统，以及来自谷歌、亚马逊和微软的云平台。换句话说，你可能只需要几个有数据科学背景的人。


    接下来，你应该找到——很可能来自你所在组织——那些对人工智能项目拥有正确领域专业知识的人。他们需要深入思考工作流程、模型和训练数据——并对行业和客户需求有特别的理解。


    最后，你需要评估技术需求。将使用哪些基础设施和软件工具？是否需要增加容量或购买新的解决方案？


    ### 第二步——数据理解


    在这一步中，你将审视项目的数据来源。考虑主要有三种数据来源，包括以下内容：


    *   *内部数据*：这些数据可能来自网站、门店内的信标、物联网传感器、移动应用程序等。这类数据的一个主要优势是免费且针对你的业务进行了定制。但同样，也存在一些风险。如果对数据格式或应选择哪些数据关注不足，就可能出现问题。


    *   *开源数据*：这通常是免费提供的，这当然是一个不错的好处。开源数据的一些例子包括政府和科学信息。这些数据通常通过 API 访问，这使得过程相当直接。开源数据通常也格式良好。然而，某些变量可能不明确，并且可能存在偏差，例如偏向于特定人群。


    *   *第三方数据*：这是来自商业供应商的数据。但费用可能很高。事实上，在某些情况下，数据质量可能有所欠缺。


    根据 Teradata 公司基于其自身人工智能项目经验的数据，大约 70%的数据来源是内部的，20%来自开源，其余来自商业供应商。^(²⁹) 但无论来源如何，所有数据都必须可信。否则，很可能会出现“垃圾进，垃圾出”的问题。


    为了评估数据，你需要回答如下问题：


    *   数据完整吗？可能缺少什么？


    *   数据来自哪里？


    *   收集点有哪些？


    *   谁接触并处理过这些数据？


    *   数据发生过哪些变化？


    *   存在哪些质量问题？


    如果你处理的是结构化数据，那么这个阶段应该会更容易。然而，当涉及到非结构化和半结构化数据时，你将需要对数据进行标注——这可能是一个漫长的过程。不过，市场上已经出现了一些有助于自动化这一过程的工具。

    '
- fmt: '### Step #3—Data Preparation


    The first step in the data preparation process is to decide what datasets to use.


    Let’s take a look at a scenario: Suppose you work for a publishing company and
    want to put together a strategy to improve customer retention. Some of the data
    that should help would include demographic information on the customer base like
    age, sex, income, and education. To provide more color, you can also look at browser
    information. What type of content interests customers? What’s the frequency and
    duration? Any other interesting patterns—say accessing information during weekends?
    By combining the sources of information, you can put together a powerful model.
    For example, if there is a drop-off in activity in certain areas, it could pose
    a risk of cancellation. This would alert sales people to reach out to the customers.


    While this is a smart process, there are still landmines. Including or excluding
    even one variable can have a significant negative impact on an AI model. To see
    why, look back at the financial crisis. The models for underwriting mortgages
    were sophisticated and based on huge amounts of data. During normal economic times,
    they worked quite well as major financial institutions like Goldman Sachs, JP
    Morgan, and AIG relied on them heavily.


    But there was a problem: The models did not account for falling housing prices!
    The main reason was that—for decades—there had never been a national drop. The
    assumption was that housing was mostly a local phenomenon.


    Of course, housing prices more than just fell—they plunged. The models then proved
    to be far off the mark, and billions of dollars in losses nearly took down the
    US financial system. The federal government had little choice but to lend $700
    billion for a bailout of Wall Street.


    Granted, this is an extreme case. But it does highlight the importance of data
    selection. This is where having a solid team of domain experts and data scientists
    can be essential.


    Next, when in the data preparation stage, there will need to be data cleansing.
    The fact is that all data has issues. Even companies like Facebook have gaps,
    ambiguities, and outliers in their datasets. It’s inevitable.


    So here are some actions you can take to cleanse the data:


    - **De-duplication**: Set tests to identify any duplications and delete the extraneous
    data.

    - **Outliers**: This is data that is well beyond the range of most of the rest
    of the data. This may indicate that the information is not helpful. But of course,
    there are situations where the reverse is true. This would be for fraud deduction.

    - **Consistency**: Make sure you have clear definitions for the variables. Even
    terms like “revenue” or “customer” can have multiple meanings.

    - **Validation Rules**: As you look at the data, try to find the inherent limitations.
    For example, you can have a flag for the age column. If it is over 120 in many
    cases, then the data has some serious issues.

    - **Binning**: Certain data may not need to be specific. Does it really matter
    if someone is 35 or 37? Probably not. But comparing those from 30–40 to 41–50
    probably would.

    - **Staleness**: Is the data timely and relevant?

    - **Merging**: In some cases, the columns of data may have very similar information.
    Perhaps one has height in inches and another in feet. If your model does not require
    a more detailed number, you can just use the one for feet.

    - **One-Hot Encoding**: This is a way to replace categorical data as numbers.
    Example: Let’s say we have a database with a column that has three possible values:
    Apple, Pineapple, and Orange. You could represent Apple as 1, Pineapple as 2,
    and Orange as 3. Sounds reasonable, right? Perhaps not. The problem is that an
    AI algorithm may think that Orange is greater than Apple. But with one-hot encoding,
    you can avoid this problem. You will create three new columns: `is_Apple`, `is_Pineapple`,
    and `is_Orange`. For each row in the data, you’ll put 1 for where the fruit exists
    and 0 for the rest.

    - **Conversion Tables**: You can use this when translating data from one standard
    to another. This would be the case if you have data in the decimal system and
    want to move over to the metric system.


    These steps will go a long way in improving the quality of the data. There are
    also automation tools that can help out, such as from companies like SAS, Oracle,
    IBM, Lavastorm Analytics, and Talend. Then there are open source projects, such
    as OpenRefine, plyr, and reshape2.


    Regardless, the data will not be perfect. No data source is. There will likely
    still be gaps and inaccuracies.


    This is why you need to be creative. Look at what Eyal Lifshitz did, who is the
    CEO of BlueVine. His company leverages AI to provide financing to small businesses.
    “One of our data sources is credit information of our customers,” he said. “But
    we’ve found that small business owners incorrectly identify their type of business.
    This could mean bad results for our underwriting. To deal with this, we scrape
    data from the customer website with AI algorithms, which helps identify the industry.”^([^(30)](#fn30))


    Data cleansing approaches will also depend on the use cases for the AI project.
    For example, if you are building a system for predictive maintenance in manufacturing,
    the challenge will be to handle the wide variations from different sensors. The
    result is that a large amount of the data may have little value and be mostly
    noise.'
