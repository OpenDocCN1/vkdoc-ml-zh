    # 8. Implementation of AI


    Moving the Needle for Your Company


    In March 2019, a shooter live-streamed on Facebook his brutal killing of 50 people
    in two mosques in New Zealand. It was viewed about 4,000 times and was not shut
    off until 29 minutes after the attack.^([^(170)](#fn170)) The video was then uploaded
    to other platforms and was viewed millions of times.


    Yes, this was a stark example of how AI can fail in a horrible way.


    In a blog post, Facebook’s VP of Product Management, Guy Rosen, noted:


    *   AI systems are based on ‘training data,’ which means you need many thousands
    of examples of content in order to train a system that can detect certain types
    of text, imagery or video. This approach has worked very well for areas such as
    nudity, terrorist propaganda and also graphic violence where there is a large
    number of examples we can use to train our systems. However, this particular video
    did not trigger our automatic detection systems. To achieve that we will need
    to provide our systems with large volumes of data of this specific kind of content,
    something which is difficult as these events are thankfully rare. Another challenge
    is to automatically discern this content from visually similar, innocuous content—for
    example if thousands of videos from live-streamed video games are flagged by our
    systems, our reviewers could miss the important real-world videos where we could
    alert first responders to get help on the ground.^([^(171)](#fn171))


    It also did not help that there were various bad actors that re-uploaded edited
    versions of the video in order to foil Facebook’s AI system.


    Of course, this was a big lesson in the shortfalls of technology, and the company
    says it is committed to keep improving its systems. But the Facebook case study
    also highlights that even the most technologically sophisticated companies have
    major challenges. This is why when it comes to implementing AI, there needs to
    be solid planning as well as an understanding that there will inevitably be problems.
    But it can be tough as senior managers at companies are under pressure to get
    results from this technology.


    In this chapter, we’ll take a look at some of the best practices for AI implementations.'
