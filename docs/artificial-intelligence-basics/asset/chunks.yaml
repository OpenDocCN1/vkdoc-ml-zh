    Then, let’s suppose you study 4 hours for the exam . What will be your estimated
    grade? The equation tells us how:


    0.838 = 4 × 0.03731 + 0.6889


    How accurate is this? To help answer this question, we can use a calculation called
    R-squared. In our case, it is 0.9180 (this ranges from 0 to 1). The closer the
    value is to 1, the better the fit. So 0.9180 is quite high. It means that the
    hours of study explains 91.8% of the grade on the exam.


    Now it’s true that this model is simplistic. To better reflect reality, you can
    add more variables to explain the grade on the exam—say the student’s attendance.
    When doing this, you will use something called multivariate regression .


    ### Note


    If the coefficient for a variable is quite small, then it might be a good idea
    to not include it in the model.


    Sometimes data may not be in a straight line either, in which case the regression
    algorithm will not work . But you can use a more complex version, called polynomial
    regression.'
  trans: '

    ## 朴素贝叶斯分类器（监督学习/分类）


    在本章前面，我们学习了贝叶斯定理。在机器学习领域，它被改进为一种称为朴素贝叶斯分类器的算法。之所以称为“朴素”，是因为它假设变量之间相互独立——即一个变量的出现与其他变量无关。诚然，这看起来像是一个缺点。但事实上，朴素贝叶斯分类器已被证明开发速度快且相当有效。


    还有一个需要注意的假设：先验假设。该假设指出，如果数据发生了变化，预测结果将会出错。


    朴素贝叶斯分类器有三种变体：


    *   *伯努利模型*：适用于二元数据（真/假、是/否）。

    *   *多项模型*：适用于离散数据，例如一本书的页数。

    *   *高斯模型*：适用于符合正态分布的数据。


    朴素贝叶斯分类器的一个常见用例是文本分析。例如电子邮件垃圾邮件检测、客户细分、情感分析、医疗诊断和天气预报。原因在于，这种方法有助于根据关键特征和模式对数据进行分类。


    为了了解其工作原理，我们来看一个例子：假设你运营一个电子商务网站，拥有一个庞大的客户交易数据库。你想了解产品评论评分、折扣和一年中的时间等变量如何影响销售。


    表 3-2 展示了该数据集。


    表 3-2.


    客户交易数据集


    | 折扣 | 产品评论 | 购买 |

    | --- | --- | --- |

    | 是 | 高 | 是 |

    | 是 | 低 | 是 |

    | 否 | 低 | 否 |

    | 否 | 低 | 否 |

    | 否 | 低 | 否 |

    | 否 | 高 | 是 |

    | 是 | 高 | 否 |

    | 是 | 低 | 是 |

    | 否 | 高 | 是 |

    | 是 | 高 | 是 |

    | 否 | 高 | 否 |

    | 否 | 低 | 是 |

    | 是 | 高 | 是 |

    | 是 | 低 | 否 |


    然后，你将把这些数据整理成频率表，如表 3-3 和 3-4 所示。


    表 3-4.


    产品评论频率表


    |   | 购买 |   |

    | --- | --- | --- |

    | 是 | 否 | 总计 |

    | --- | --- | --- |

    | **产品评论** | **高** | 21 | 2 | 11 |

    | **低** | 3 | 4 | 8 |

    |   | **总计** | 24 | 6 | 19 |


    表 3-3.


    折扣频率表


    |   | 购买 |

    | --- | --- |

    | 是 | 否 |

    | --- | --- |

    | **折扣** | 是 | 19 | 1 |

    | 否 | 5 | 5 |


    观察这些表格时，我们将“购买”称为事件，将“折扣”和“产品评论”称为自变量。然后，我们可以为其中一个自变量（例如产品评论）制作一个概率表。见表 3-5。


    表 3-5.


    产品评论概率表


    |   | 购买 |   |

    | --- | --- | --- |

    | 是 | 否 |   |

    | --- | --- | --- |

    | **产品评论** | **高** | 9/24 | 2/6 | 11/30 |

    | **低** | 7/24 | 1/6 | 8/30 |

    |   | 24/30 | 6/30 |   |


    使用此图表，我们可以看到，当产品评论较低时，购买的概率是 7/24，即 29%。换句话说，朴素贝叶斯分类器允许在数据集内进行更细粒度的预测。它也比较容易训练，并且可以很好地处理小数据集。


    ## K-近邻算法（监督学习/分类）


    K-近邻算法（k-NN）是一种对数据集进行分类的方法（k 代表邻居的数量）。其理论是，那些彼此接近的值很可能是模型的好预测因子。可以将其理解为“物以类聚，人以群分”。


    k-NN 的一个用例是信用评分，它基于收入、还款历史、地点、房屋所有权等多种因素。该算法会将数据集划分为不同的客户群体。然后，当有新的客户加入时，你可以看到他/她属于哪个群体——这将是其信用评分。


    K-NN 实际上计算起来很简单。事实上，它被称为惰性学习，因为不需要对数据进行训练过程。


    要使用 k-NN，你需要计算最近值之间的距离。如果值是数值型的，可以基于欧几里得距离，这涉及复杂的数学计算。或者，如果有分类数据，则可以使用重叠度量（即数据相同或非常相似的情况）。


    接下来，你需要确定邻居的数量。虽然拥有更多邻居会使模型更平滑，但也可能意味着需要大量的计算资源。为了管理这一点，你可以为更接近其邻居的数据分配更高的权重。


    ## 线性回归（监督学习/回归）


    线性回归展示了某些变量之间的关系。该方程——假设有足够高质量的数据——可以帮助根据输入预测结果。


    示例：假设我们有关于为考试而学习的小时数和成绩的数据。见表 3-6。


    表 3-6.


    学习时间与成绩图表


    | 学习小时数 | 成绩百分比 |

    | --- | --- |

    | 1 | 0.75 |

    | 1 | 0.69 |

    | 1 | 0.71 |

    | 3 | 0.82 |

    | 3 | 0.83 |

    | 4 | 0.86 |

    | 5 | 0.85 |

    | 5 | 0.89 |

    | 5 | 0.84 |

    | 6 | 0.91 |

    | 6 | 0.92 |

    | 7 | 0.95 |


    如你所见，总体关系是正向的（这描述了更高分数与更多学习时间相关的趋势）。使用回归算法，我们可以绘制一条最佳拟合线（这是通过使用一种称为“最小二乘法”的计算来完成的，该方法可以最小化误差）。见图
    3-4。


    ![../images/480660_1_En_3_Chapter/480660_1_En_3_Fig4_HTML.jpg](img/480660_1_En_3_Fig4_HTML.jpg)


    图 3-4.


    这是一个基于学习时间的线性回归模型图


    由此，我们得到以下方程：


    成绩 = 学习小时数 × 0.03731 + 0.6889


    那么，假设你为考试学习了 4 个小时。你的预估成绩会是多少？该方程告诉我们如何计算：


    0.838 = 4 × 0.03731 + 0.6889


    这个结果有多准确？为了帮助回答这个问题，我们可以使用一种称为 R 平方的计算方法。在我们的例子中，它是 0.9180（范围从 0 到 1）。该值越接近 1，拟合度越好。所以
    0.9180 是相当高的。这意味着学习时间可以解释考试成绩的 91.8%。


    诚然，这个模型过于简单。为了更好地反映现实，你可以添加更多变量来解释考试成绩——比如学生的出勤率。这样做时，你将使用一种称为多元回归的方法。


    ### 注意


    如果某个变量的系数非常小，那么最好将其排除在模型之外。


    有时数据也可能不是直线分布的，在这种情况下，回归算法将不起作用。但你可以使用一个更复杂的版本，称为多项式回归。

    '
- fmt: '# Decision Tree (Supervised Learning/Regression)


    No doubt, clustering may not work on some datasets. But the good news is that
    there are alternatives, such as a decision tree. This approach generally works
    better with nonnumerical data.


    The start of a decision tree is the root node, which is at the top of the flow
    chart. From this point, there will be a tree of decision paths, which are called
    splits. At these points, you will use an algorithm to make a decision, and there
    will be a probability computed. At the end of the tree will be the leaf (or the
    outcome).


    A famous example—in machine learning circles —is to use a decision tree for the
    tragic sinking of the Titanic. The model predicts the survival of a passenger
    based on three features: sex, age, and the number of spouses or children along
    (`sibsp`). Here’s how it looks, in Figure [3-5](#480660_1_En_3_Chapter.xhtml#Fig5).


    ![../images/480660_1_En_3_Chapter/480660_1_En_3_Fig5_HTML.jpg](images/480660_1_En_3_Chapter/480660_1_En_3_Fig5_HTML.jpg)


    Figure 3-5.


    This is a basic decision tree algorithm for predicting the survival of the Titanic


    There are clear advantages for decision trees. They are easy to understand, work
    well with large datasets, and provide transparency with the model.


    However, decision trees also have drawbacks. One is error propagation. If one
    of the splits turns out to be wrong, then this error can cascade throughout the
    rest of the model!


    Next, as the decision trees grow, there will be more complexity as there will
    be a large number of algorithms. This could ultimately result in lower performance
    for the model.


    # Ensemble Modelling (Supervised Learning/Regression)


    Ensemble modelling means using more than one model for your predictions. Even
    though this increases the complexity, this approach has been shown to generate
    strong results.


    To see this in action, take a look at the “Netflix Prize,” which began in 2006.
    The company announced it would pay $1 million to anyone or any team that could
    improve the accuracy of its movie recommendation system by 10% or more. Netflix
    also provided a dataset of over 100 million ratings of 17,770 movies from 480,189
    users.^([^(51)](#fn51)) There would ultimately be more than 30,000 downloads.


    Why did Netflix do all this? A big reason is that the company’s own engineers
    were having trouble making progress. Then why not give it to the crowd to figure
    out? It turned out to be quite ingenious—and the $1 million payout was really
    modest compared to the potential benefits.


    The contest certainly stirred up a lot of activity from coders and data scientists,
    ranging from students to employees at companies like AT&T.


    Netflix also made the contest simple. The main requirement was that the teams
    had to disclose their methods, which helped boost the results (there was even
    a dashboard with rankings of the teams).


    But it was not until 2009 that a team—BellKor’s Pragmatic Chaos—won the prize.
    Then again, there were considerable challenges.


    So how did the winning team pull it off? The first step was to create a baseline
    model that smoothed out the tricky issues with the data. For example, some movies
    only had a handful of ratings, whereas others had thousands. Then there was the
    thorny problem where there were users who would always rate a movie with one star.
    To deal with these matters, BellKor used machine learning to predict ratings in
    order to fill the gaps.


    Once the baseline was finished, there were more tough challenges to tackle like
    the following:


    - A system may wind up recommending the same films to many users.

    - Some movies may not fit well within genres. For example, *Alien* is really a
    cross of science fiction and horror.

    - There were movies, like *Napoleon Dynamite*, that proved extremely difficult
    for algorithms to understand.

    - Ratings of a movie would often change over time.


    The winning team used ensemble modelling, which involved hundreds of algorithms.
    They also used something called boosting, which is where you build consecutive
    models. With this, the weights in the algorithms are adjusted based on the results
    of the previous model, which help the predictions get better over time (another
    approach, called bagging, is when you build different models in parallel and then
    select the best one).


    But in the end, BellKor found the solutions. However, despite this, Netflix did
    not use the model! Now it’s not clear why this was the case. Perhaps it was that
    Netflix was moving away from five-star ratings anyway and was more focused on
    streaming. The contest also had blowback from people who thought there may have
    been privacy violations.


    Regardless, the contest did highlight the power of machine learning—and the importance
    of collaboration.'
