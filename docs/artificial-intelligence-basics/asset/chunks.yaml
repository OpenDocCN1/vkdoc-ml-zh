    # Natural Language Processing (NLP)


    How Computers Talk


    In 2014, Microsoft launched a chatbot—an AI system that communicates with people—called
    Xiaoice. It was integrated into Tencent’s WeChat, the largest social messaging
    service in China. Xiaoice performed quite well, getting to 40 million users within
    a few years.


    In light of the success, Microsoft wanted to see if it could do something similar
    in the US market. The company’s Bing and the Technology and Research Group leveraged
    AI technologies to build a new chatbot: Tay. The developers even enlisted the
    help of improvisational comedians to make the conversion engaging and fun.


    On March 23, 2016, Microsoft launched Tay on Twitter—and it was an unmitigated
    disaster. The chatbot quickly spewed racist and sexist messages! Here’s just one
    of the thousands of examples:


    > *@TheBigBrebowski ricky gervais learned totalitarianism from adolf hitler, the
    inventor of atheism* ^([^(102)](#fn102))


    Tay was a vivid illustration of Godwin’s Law. It reads as follows: the more an
    online discussion continues, the higher are the odds that someone will bring up
    Adolf Hitler or the Nazis.


    So yes, Microsoft took down Tay within 24 hours and blogged an apology. In it,
    the corporate vice president of Microsoft Healthcare, Peter Lee, wrote:


    - Looking ahead, we face some difficult—and yet exciting—research challenges in
    AI design. AI systems feed off of both positive and negative interactions with
    people. In that sense, the challenges are just as much social as they are technical.
    We will do everything possible to limit technical exploits but also know we cannot
    fully predict all possible human interactive misuses without learning from mistakes.
    To do AI right, one needs to iterate with many people and often in public forums.
    We must enter each one with great caution and ultimately learn and improve, step
    by step, and to do this without offending people in the process. We will remain
    steadfast in our efforts to learn from this and other experiences as we work toward
    contributing to an Internet that represents the best, not the worst, of humanity.^([^(103)](#fn103))


    A key to Tay was to repeat some of the content of the people asking questions.
    For the most part, this is a valid approach. As we saw in Chapter [1](#480660_1_En_1_Chapter.xhtml),
    this was at the heart of the first chatbot, ELIZA.


    But there also must be effective filters in place. This is especially the case
    when a chatbot is used in a free-form platform like Twitter (or, for that matter,
    in any real-world scenario).


    However, failures like Tay are important. They allow us to learn and to evolve
    the technology.


    In this chapter, we’ll take a look at chatbots as well as Natural Language Processing
    (NLP), which is a key part of how computers understand and manipulate language.
    This is a subset of AI.


    Let’s get started.'
