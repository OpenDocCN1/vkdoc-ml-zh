    DeepMind。


    *   **弱人工智能**：指机器进行模式匹配，通常专注于狭窄的任务。这方面的例子包括苹果的 Siri 和亚马逊的 Alexa。


    现实情况是，人工智能仍处于弱人工智能的早期阶段。要达到强人工智能的水平，很可能需要数十年时间。一些研究人员认为这可能永远不会发生。


    鉴于图灵测试的局限性，出现了一些替代方案，例如：


    *   **库兹韦尔-卡普测试**：由未来学家雷·库兹韦尔和科技企业家米奇·卡普提出。该测试要求计算机进行两小时的对话，并且三位评委中有两位认为对话的是人类。至于卡普，他认为直到
    2029 年才能实现这一目标。


    *   **咖啡测试**：由苹果联合创始人史蒂夫·沃兹尼亚克提出。根据咖啡测试，机器人必须能够进入陌生人的家中，找到厨房，并煮好一杯咖啡。


    ## 大脑是一台……机器？


    1943 年，沃伦·麦卡洛克和沃尔特·皮茨在芝加哥大学相遇，尽管他们背景迥异，年龄也相差悬殊（麦卡洛克 42 岁，皮茨 18 岁），但他们很快成为了挚友。麦卡洛克成长于富裕的东部名门世家，就读于名校。而皮茨则成长于低收入社区，甚至在青少年时期无家可归。


    尽管如此，他们的合作却成为了人工智能发展史上最具影响力的合作之一。麦卡洛克和皮茨提出了解释大脑的新理论，这些理论常常与弗洛伊德心理学的传统观念相悖。但两人都认为逻辑可以解释大脑的力量，并借鉴了艾伦·图灵的见解。由此，他们在
    1943 年合著了一篇论文，题为《神经活动中内在思想的逻辑演算》，并发表在《数学生物物理学通报》上。论文的核心论点是，大脑的核心功能（如神经元和突触）可以通过逻辑和数学来解释，例如使用“与”、“或”、“非”等逻辑运算符。利用这些运算符，可以构建一个能够处理信息、学习和思考的复杂网络。


    讽刺的是，这篇论文并未在神经学家中引起太大反响。但它确实引起了从事计算机和人工智能研究人员的关注。


    ## 控制论


    诺伯特·维纳提出了多种理论，其中最著名的是控制论。该理论侧重于理解动物、人和机器中的控制与通信——展示了反馈回路的重要性。


    1948 年，维纳出版了《控制论：或关于在动物和机器中控制和通信的科学》。尽管这是一部学术著作——充满了复杂的方程式——但这本书仍然成为了畅销书，登上了《纽约时报》榜单。


    这本书的内容确实包罗万象。其中一些主题包括牛顿力学、气象学、统计学、天文学和热力学。这本书预示了混沌理论、数字通信甚至计算机存储器的发展。


    但这本书对人工智能也产生了影响。像麦卡洛克和皮茨一样，维纳将人脑与计算机进行了比较。此外，他推测计算机将能够下棋，并最终击败国际象棋大师。主要原因是他相信机器可以在下棋的过程中学习。他甚至认为计算机能够自我复制。


    但《控制论》也并非乌托邦式的。维纳在理解计算机的负面影响方面也很有先见之明，例如非人化的可能性。他甚至认为机器会让人变得多余。


    这无疑是一个好坏参半的信息。但维纳的思想是强大的，并推动了人工智能的发展。

    '
- fmt: '## The Origin Story


    John McCarthy’s interest in computers was spurred in 1948, when he attended a
    seminar, called “Cerebral Mechanisms in Behavior,” which covered the topic of
    how machines would eventually be able to think. Some of the participants included
    the leading pioneers in the field such as John von Neumann, Alan Turing, and Claude
    Shannon.


    McCarthy continued to immerse himself in the emerging computer industry—including
    a stint at Bell Labs—and in 1956, he organized a ten-week research project at
    Dartmouth University. He called it a “study of artificial intelligence.” It was
    the first time the term had been used.


    The attendees included academics like Marvin Minsky, Nathaniel Rochester, Allen
    Newell, O. G. Selfridge, Raymond Solomonoff, and Claude Shannon. All of them would
    go on to become major players in AI.


    The goals for the study were definitely ambitious:


    > The study is to proceed on the basis of the conjecture that every aspect of
    learning or any other feature of intelligence can in principle be so precisely
    described that a machine can be made to simulate it. An attempt will be made to
    find how to make machines use language, form abstractions and concepts, solve
    kinds of problems now reserved for humans, and improve themselves. We think that
    a significant advance can be made in one or more of these problems if a carefully
    selected group of scientists work on it together for a summer.^([⁸](#fn8))


    At the conference, Allen Newell, Cliff Shaw, and Herbert Simon demoed a computer
    program called the `Logic Theorist`, which they developed at the Research and
    Development (RAND) Corporation. The main inspiration came from Simon (who would
    win the Nobel Prize in Economics in 1978). When he saw how computers printed out
    words on a map for air defense systems, he realized that these machines could
    be more than just about processing numbers. It could also help with images, characters,
    and symbols—all of which could lead to a thinking machine.


    Regarding `Logic Theorist`, the focus was on solving various math theorems from
    *Principia Mathematica*. One of the solutions from the software turned out to
    be more elegant—and the co-author of the book, Bertrand Russell, was delighted.


    Creating the `Logic Theorist` was no easy feat. Newell, Shaw, and Simon used an
    `IBM 701`, which used machine language. So they created a high-level language,
    called `IPL` (Information Processing Language), that sped up the programming.
    For several years, it was the language of choice for AI.


    The `IBM 701` also did not have enough memory for the `Logic Theorist`. This led
    to another innovation: list processing. It allowed for dynamically allocating
    and deallocating memory as the program ran.


    Bottom line: The `Logic Theorist` is considered the first AI program ever developed.


    Despite this, it did not garner much interest! The Dartmouth conference was mostly
    a disappointment. Even the phrase “artificial intelligence” was criticized.


    Researchers tried to come up with alternatives, such as “complex information processing.”
    But they were not catchy like AI was—and the term stuck.


    As for McCarthy, he continued on his mission to push innovation in AI. Consider
    the following:


    *   During the late 1950s, he developed the `Lisp` programming language, which
    was often used for AI projects because of the ease of using nonnumerical data.
    He also created programming concepts like recursion, dynamic typing, and garbage
    collection. `Lisp` continues to be used today, such as with robotics and business
    applications. While McCarthy was developing the language, he also co-founded the
    MIT Artificial Intelligence Laboratory.


    *   In 1961, he formulated the concept of time-sharing of computers, which had
    a transformative impact on the industry. This also led to the development of the
    Internet and cloud computing.


    *   A few years later, he founded Stanford’s Artificial Intelligence Laboratory.


    *   In 1969, he wrote a paper called “Computer-Controlled Cars,” in which he described
    how a person could enter directions with a keyboard and a television camera would
    navigate the vehicle.


    *   He won the Turing Award in 1971. This prize is considered the Nobel Prize
    for Computer Science.


    In a speech in 2006, McCarthy noted that he was too optimistic about the progress
    of strong AI. According to him, “we humans are not very good at identifying the
    heuristics we ourselves use.”^([⁹](#fn9))'
