- fmt: "# 5. Robotic Process Automation (RPA)\n\nAn Easier Path to AI\n\n> *By interacting\
    \ with applications just as a human would, software robots can open email attachments,\
    \ complete e-forms, record and re-key data, and perform other tasks that mimic\
    \ human action.*\n> \n> —Kaushik Iyengar, director of Digital Transformation and\
    \ Optimization at AT&T^([^(90)](#fn90))\n\nBack in 2005, Daniel Dines and Marius\
    \ Tirca founded `UiPath`, which was located in Bucharest, Romania. The company\
    \ focused mostly on providing integration services for applications from Google,\
    \ Microsoft, and IBM. But it was a struggle as the company relied mostly on custom\
    \ work for clients.\n\nBy 2013, `UiPath` was close to being shut down. But the\
    \ founders did not give up as they saw this as an opportunity to rethink the business\
    \ and find a new opportunity.^([^(91)](#fn91)) To this end, they started to build\
    \ a platform for Robotic Process Automation (RPA). The category, which had been\
    \ around since 2000, was about automating routine and mundane tasks within a company.\n\
    \nYet RPA was actually a backwater area in the tech world—as seen with the slow\
    \ growth rates. However, Dines and Tirca were convinced that they could transform\
    \ the industry. One of the key reasons: the rise of AI and the cloud.\n\nThe new\
    \ strategy was spot-on, and growth took off. Dines and Tirca also were aggressive\
    \ with seeking funding, innovating its RPA platform, and expanding into global\
    \ markets.\n\nBy 2018, `UiPath` was considered the fastest-growing enterprise\
    \ software company—ever. The annual recurring revenue soared from $1 million to\
    \ $100 million, with over 1,800 customers.^([^(92)](#fn92)) The company had the\
    \ most widely used RPA system in the world.\n\n`UiPath` attracted a total of $448\
    \ million in venture capital from marque firms like `CapitalG`, `Sequoia Capital`,\
    \ and `Accel`. The valuation was at $3 billion.\n\nIn light of all this, more\
    \ RPA startups snagged significant funding as well. Then again, the market is\
    \ forecasted to see tremendous growth. Grand View Research predicts that spending\
    \ will hit $3.97 billion in the United States by 2025.^([^(93)](#fn93))\n\nInterestingly\
    \ enough, Forrester had this to say about the RPA trend:\n\n* Today’s most successful\
    \ companies generally operate with fewer employees than those of the past. Consider\
    \ that Kodak at its peak in 1973 employed 120,000, but when Facebook bought Instagram\
    \ in 2012, the photo-sharing site employed only 13 workers. In 2019, we predict\
    \ that one in 10 startups—operating in a more agile, lean, and scalable fashion—\
    \ will look at the world through the lens of tasks, not jobs, and will build business\
    \ models around automation-first principles.^([^(94)](#fn94))\n\nRPA is yet another\
    \ area that has been supercharged with AI. If anything, it could be the gateway\
    \ for many companies because the implementation usually does not take long or\
    \ require heavy costs.\n\nIn this chapter, we’ll take a look at RPA and see how\
    \ it could be a critical driver for many companies.\n\n## What Is RPA?\n\nThe\
    \ term Robotic Process Automation can be a bit confusing. The word “robotic” does\
    \ not mean physical robots (we’ll cover these in Chapter [7](#480660_1_En_7_Chapter.xhtml));\
    \ rather, it is about software-based robots or bots.\n\nRPA allows you to use\
    \ low-code visual drag-and-drop systems to automate the workflow of a process.\
    \ Some examples include the following:\n\n* Inputting, changing, and tracking\
    \ Human Resources (HR) documents, contracts, and employee information\n* Detecting\
    \ issues with customer service and taking actions to resolve the problems\n* Processing\
    \ an insurance claim\n* Sending invoices\n* Issuing refunds to customers\n* Reconciling\
    \ financial records\n* Transferring data from one system to another\n* Providing\
    \ standard replies to customers\n\nThis is all done by having a bot replicate\
    \ the workflows for an application, say for an ERP (Enterprise Resource Planning)\
    \ or CRM (Customer Relationship Management) system. This may even be done with\
    \ the RPA program recording the steps from employees or with the use of OCR (optical\
    \ character recognition) technology to translate handwritten notes. Think of RPA\
    \ as a digital employee.\n\nThere are two flavors of this type of technology:\n\
    \n* *Unattended RPA*: This is a process that is completely autonomous as the bot\
    \ will run in the background. Now this does not mean there is no human intervention.\
    \ There will still be intervention for exception management. This is when the\
    \ bot encounters something it does not understand.\n\n* *RDA (Robotic Desktop\
    \ Automation)*: This is where RPA helps an employee with a job or task. A common\
    \ use case is with a contact center. That is, when a call comes in, the rep can\
    \ use RDA to help find answers, send messages, pull customer profile information,\
    \ and get insight on what to do next. The technology helps improve or augment\
    \ the efficiency of the worker."
