    ## 大数据


    随着互联网接入、移动设备和可穿戴设备的普及，海量数据如潮水般涌现。每秒钟，谷歌要处理超过 4 万次搜索，即每天 35 亿次。按分钟计算，Snapchat 用户分享
    527,760 张照片，YouTube 用户观看超过 410 万个视频。此外，还有像电子邮件这样的传统系统，其使用量仍在显著增长。每分钟，有 1.56 亿条信息被发送。^(¹⁷)


    但还有一点需要考虑：公司和机器也会产生海量数据。根据 Statista 的研究，到 2020 年，传感器数量将达到 128.6 亿个。^(¹⁸)


    鉴于这一切，数据量将继续快速增长似乎是一个合理的预测。在国际数据公司（IDC）一份名为《数据时代 2025》的报告中，预计到 2025 年，产生的数据量将达到惊人的
    163 泽字节。^(¹⁹) 这大约是 2017 年数据量的十倍。


    为了应对这一切，出现了一类名为“大数据”的技术。以下是甲骨文公司对这一趋势重要性的解释：


    > 如今，大数据已成为资本。想想世界上一些最大的科技公司。它们提供的价值很大一部分来自其数据，这些数据被不断分析，以提高效率并开发新产品。^(²⁰)


    所以，没错，大数据仍将是许多人工智能项目的关键组成部分。


    那么，大数据到底是什么？一个好的定义是什么？实际上，并没有一个统一的定义，尽管有很多公司专注于这个市场！但大数据确实具有以下特征，被称为“三 V”（Gartner
    分析师道格·莱尼在 2001 年提出了这个框架^(²¹)）：海量性（Volume）、多样性（Variety）和高速性（Velocity）。


    ### 海量性


    这是指数据的规模，通常是非结构化的。对于阈值没有硬性规定，但通常是几十 TB。


    在处理大数据时，海量性通常是一个主要挑战。但云计算和下一代数据库在容量和降低成本方面提供了巨大帮助。


    ### 多样性


    这描述了数据的多样性，例如结构化、半结构化和非结构化数据（上文已解释）的组合。它也显示了数据的不同来源和用途。毫无疑问，非结构化数据的高速增长一直是大数据多样性的关键。


    管理这一点很快就会成为一个重大挑战。然而，机器学习通常有助于简化这一过程。


    ### 高速性


    这显示了数据生成的速度。正如本章前面所述，像 YouTube 和 Snapchat 这样的服务具有极高的速度（这通常被称为数据的“消防水带”）。这需要对下一代技术和数据中心进行大量投资。数据也通常在内存中处理，而不是使用基于磁盘的系统。


    由于这些问题，在“三 V”中，高速性通常被认为是最困难的。让我们面对现实吧，在当今的数字世界中，人们希望尽可能快地获取数据。如果速度太慢，人们会感到沮丧并转向其他地方。


    然而，多年来，随着大数据的发展，又增加了更多的“V”。目前，已有超过十个。


    但以下是一些常见的：


    *   *真实性（Veracity）*：这是指被认为准确的数据。在本章中，我们将探讨一些评估真实性的技术。


    *   *价值（Value）*：这显示了数据的实用性。这通常涉及拥有可信的来源。


    *   *可变性（Variability）*：这意味着数据通常会随时间变化。例如，社交媒体内容就是这种情况，它会根据对新发展和突发新闻的整体情绪而发生变化。


    *   *可视化（Visualization）*：这是利用图表等视觉元素来更好地理解数据。


    正如你所见，管理大数据涉及许多动态部分，这导致了复杂性。这有助于解释为什么许多公司仍然只使用其数据的一小部分。


    ## 数据库及其他工具


    有无数工具可以帮助处理数据。其核心是数据库。毫不奇怪，几十年来，这项关键技术一直在演进。但即使是像关系数据库这样的较老技术，今天仍然被广泛使用。对于关键任务数据，公司不愿做出改变——即使有明确的好处。


    为了理解这个市场，让我们回到 1970 年，当时 IBM 计算机科学家埃德加·科德发表了《大型共享数据库的关系模型》。这篇论文具有开创性，因为它引入了关系数据库的结构。在此之前，数据库相当复杂和僵化——以层次结构组织。这使得搜索和查找数据中的关系非常耗时。


    至于科德的关系数据库方法，它是为更现代的机器构建的。SQL 脚本语言易于使用，允许进行 CRUD（创建、读取、更新和删除）操作。表之间还通过主键和外键建立连接，从而形成如下重要的关联：


    *   *一对一*：一个表中的一行仅与另一个表中的一行相关联。示例：唯一的驾照号码与一名员工相关联。


    *   *一对多*：一个表中的一行与另一个表中的多行相关联。示例：一个客户有多个采购订单。


    *   *多对多*：一个表中的多行与另一个表中的多行相关联。示例：多份报告有多位作者。


    有了这些类型的结构，关系数据库可以简化创建复杂报告的过程。这确实是革命性的。


    但尽管有这些优势，IBM 对该技术并不感兴趣，并继续专注于其专有系统。该公司认为关系数据库对企业客户来说太慢且脆弱。


    然而，有一个人对此持不同看法：拉里·埃里森。他阅读了科德的论文，并知道这将改变游戏规则。为了证明这一点，他于 1977 年共同创立了甲骨文公司，专注于构建关系数据库——这很快成为一个巨大的市场。科德的论文基本上是他创业努力的产品路线图。


    直到 1993 年，IBM 才推出了自己的关系数据库 DB2。但为时已晚。此时，甲骨文已成为数据库市场的领导者。


    在 20 世纪 80 年代和 90 年代，关系数据库是大型机和客户端-服务器系统的标准。但当大数据成为影响因素时，该技术出现了严重的缺陷，例如：


    *   *数据蔓延*：随着时间的推移，不同的数据库会遍布整个组织。结果是数据集中变得越来越困难。


    *   *新环境*：关系数据库技术并非为云计算、高速数据或非结构化数据而构建。


    *   *高成本*：关系数据库可能很昂贵。这意味着将其用于人工智能项目可能成本过高。


    *   *开发挑战*：现代软件开发严重依赖迭代。但关系数据库已被证明对这一过程具有挑战性。


    在 20 世纪 90 年代末，出现了一些开源项目，旨在帮助创建下一代数据库系统。其中最重要的一个可能来自道格·卡廷，他开发了用于文本搜索的 Lucene。该技术基于一个复杂的索引系统，可实现低延迟性能。Lucene
    一经推出便大获成功，并开始演进，例如 Apache Nutch，它可以高效地抓取网页并将数据存储在索引中。

    '
- fmt: 'But there was a big problem: To crawl the Web, there needed to be an infrastructure
    that could hyperscale. So in late 2003, Cutting began development on a new kind
    of infrastructure platform that could solve the problem. He got the idea from
    a paper published from Google, which described its massive file system. A year
    later, Cutting had built his new platform, which allowed for sophisticated storage
    without the complexity. At the core of this was `MapReduce` that allowed processing
    across multiple servers. The results would then be merged, allowing for meaningful
    reports.


    Eventually, Cutting’s system morphed into a platform called `Hadoop`—and it would
    be essential for managing Big Data, such as making it possible to create sophisticated
    data warehouses. Initially, Yahoo! used it, and then it quickly spread, as companies
    like Facebook and Twitter adopted the technology. These companies were now able
    to get a 360 view of their data, not just subsets. This meant there could be more
    effective data experiments.


    But as an open source project, `Hadoop` still lacked the sophisticated systems
    for enterprise customers. To deal with this, a startup called Hortonworks built
    new technologies like `YARN` on top of the `Hadoop` platform. It had features
    like in-memory analytic processing, online data processing, and interactive SQL
    processing. Such capabilities supported adoption of `Hadoop` across many corporations.


    But of course, there emerged other open source data warehouse projects. The well-known
    ones, like `Storm` and `Spark`, focused on streaming data. `Hadoop`, on the other
    hand, was optimized for batch processing.


    Besides data warehouses, there was also innovation of the traditional database
    business. Often these were known as NoSQL systems. Take `MongoDB`. It started
    as an open source project and has turned into a highly successful company, which
    went public in October 2017. The `MongoDB` database, which has over 40 million
    downloads, is built to handle cloud, on-premise, and hybrid environments.^([^(22)](#fn22))
    There is also much flexibility structuring the data, which is based on a document
    model. `MongoDB` can even manage structured and unstructured data at high petabyte
    scale.


    Even though startups have been a source of innovation in database systems and
    storage, it’s important to note that the mega tech operators have also been critical.
    Then again, companies like Amazon.com and Google have had to find ways to deal
    with the huge scale of data because of the need for managing their massive platforms.


    One of the innovations has been the data lake, which allows for seamless storage
    of structured and unstructured data. Note that there is no need to reformat the
    data. A data lake will handle this and allow you to quickly perform AI functions.
    According to a study from Aberdeen, companies who use this technology have an
    average of 9% organic growth compared to those who do not.^([^(23)](#fn23))


    Now this does not mean you have to get rid of your data warehouses. Rather, both
    serve particular functions and use cases. A data warehouse is generally good for
    structured data, whereas a data lake is better for diverse environments. What’s
    more, it’s likely that a large portion of the data will never be used.


    For the most part, there are a myriad of tools. And expect more to be developed
    as data environments get more complex.


    But this does not mean you should chose the latest technology. Again, even older
    relational databases can be quite effective with AI projects. The key is understanding
    the pros/cons of each and then putting together a clear strategy.


    ## Data Process


    The amount of money shelled out on data is enormous. According to IDC, the spending
    on Big Data and analytics solutions is forecasted to go from $166 billion in 2018
    to $260 billion by 2022.^([^(24)](#fn24)) This represents an 11.9% compound annual
    growth rate. The biggest spenders include banks, discrete manufacturers, process
    manufacturers, professional service firms, and the federal government. They account
    for close to half the overall amount.


    Here’s what IDC’s Jessica Goepfert—the program vice president (VP) of Customer
    Insights and Analysis—said:


    > *At a high level, organizations are turning to Big Data and analytics solutions
    to navigate the convergence of their physical and digital worlds. This transformation
    takes a different shape depending on the industry. For instance, within banking
    and retail—two of the fastest growth areas for Big Data and analytics—investments
    are all about managing and reinvigorating the customer experience. Whereas in
    manufacturing, firms are reinventing themselves to essentially be high tech companies,
    using their products as a platform to enable and deliver digital services.* ^([^(25)](#fn25))


    But a high level of spending does not necessarily translate into good results.
    A Gartner study estimates that roughly 85% of Big Data projects are abandoned
    before they get to the pilot stage.^([^(26)](#fn26)) Some of the reasons include
    the following:


    *   Lack of a clear focus

    *   Dirty data

    *   Investment in the wrong IT tools

    *   Problems with data collection

    *   Lack of buy-in from key stakeholders and champions in the organization


    In light of this, it is critical to have a data process. Notwithstanding there
    are many approaches—often extoled by software vendors—there is one that has widespread
    acceptance. A group of experts, software developers, consultants, and academics
    created the `CRISP-DM` Process in the late 1990s. Take a look at Figure [2-1](#480660_1_En_2_Chapter.xhtml#Fig1)
    for a visual.


    ![../images/480660_1_En_2_Chapter/480660_1_En_2_Fig1_HTML.jpg](images/480660_1_En_2_Chapter/480660_1_En_2_Fig1_HTML.jpg)


    Figure 2-1. The `CRISP-DM` Process


    In this chapter, we’ll take a look at steps #1 through #3. Then in the rest of
    the book, we’ll cover the remaining ones (that is, we will look at Modelling and
    Evaluation in Chapter [3](#480660_1_En_3_Chapter.xhtml) and Deployment in Chapter
    [8](#480660_1_En_8_Chapter.xhtml)).


    Note that steps #1–#3 can account for 80% of the time of the data process, which
    is based on the experience of Atif Kureishy, who is the global VP of Emerging
    Practices at Teradata.^([^(27)](#fn27)) This is due to factors like: The data
    is not well organized and comes from different sources (whether from different
    vendors or silos in the organization), there is not enough focus on automation
    tools, and the initial planning was insufficient for the scope of the project.


    It’s also worth keeping in mind that the `CRISP-DM` Process is not a strict linear
    process. When dealing with data, there can be much iteration. For example, there
    may be multiple attempts at coming up with the right data and testing it.'
  raw: 'But there was a big problem: To crawl the Web, there needed to be an infrastructure
    that could hyperscale. So in late 2003, Cutting began development on a new kind
    of infrastructure platform that could solve the problem. He got the idea from
    a paper published from Google, which described its massive file system. A year
    later, Cutting had built his new platform, which allowed for sophisticated storage
    without the complexity. At the core of this was MapReduce that allowed processing
    across multiple servers. The results would then be merged, allowing for meaningful
    reports.


    Eventually, Cutting’s system morphed into a platform called Hadoop—and it would
    be essential for managing Big Data, such as making it possible to create sophisticated
    data warehouses. Initially, Yahoo! used it, and then it quickly spread, as companies
    like Facebook and Twitter adopted the technology. These companies were now able
    to get a 360 view of their data, not just subsets. This meant there could be more
    effective data experiments.


    But as an open source project, Hadoop still lacked the sophisticated systems for
    enterprise customers. To deal with this, a startup called Hortonworks built new
    technologies like YARN on top of the Hadoop platform. It had features like in-memory
    analytic processing, online data processing, and interactive SQL processing. Such
    capabilities supported adoption of Hadoop across many corporations.


    But of course, there emerged other open source data warehouse projects. The well-known
    ones, like Storm and Spark, focused on streaming data. Hadoop, on the other hand,
    was optimized for batch processing.


    Besides data warehouses, there was also innovation of the traditional database
    business. Often these were known as NoSQL systems. Take MongoDB. It started as
    an open source project and has turned into a highly successful company, which
    went public in October 2017\. The MongoDB database, which has over 40 million
    downloads, is built to handle cloud, on-premise, and hybrid environments.^([^(22)](#fn22))
    There is also much flexibility structuring the data, which is based on a document
    model. MongoDB can even manage structured and unstructured data at high petabyte
    scale.


    Even though startups have been a source of innovation in database systems and
    storage, it’s important to note that the mega tech operators have also been critical.
    Then again, companies like Amazon.com and Google have had to find ways to deal
    with the huge scale of data because of the need for managing their massive platforms.


    One of the innovations has been the data lake, which allows for seamless storage
    of structured and unstructured data. Note that there is no need to reformat the
    data. A data lake will handle this and allow you to quickly perform AI functions.
    According to a study from Aberdeen, companies who use this technology have an
    average of 9% organic growth compared to those who do not.^([^(23)](#fn23))


    Now this does not mean you have to get rid of your data warehouses. Rather, both
    serve particular functions and use cases. A data warehouse is generally good for
    structured data, whereas a data lake is better for diverse environments. What’s
    more, it’s likely that a large portion of the data will never be used.


    For the most part, there are a myriad of tools. And expect more to be developed
    as data environments get more complex.


    But this does not mean you should chose the latest technology. Again, even older
    relational databases can be quite effective with AI projects. The key is understanding
    the pros/cons of each and then putting together a clear strategy.


    ## Data Process


    The amount of money shelled out on data is enormous. According to IDC, the spending
    on Big Data and analytics solutions is forecasted to go from $166 billion in 2018
    to $260 billion by 2022.^([^(24)](#fn24)) This represents an 11.9% compound annual
    growth rate. The biggest spenders include banks, discrete manufacturers, process
    manufacturers, professional service firms, and the federal government. They account
    for close to half the overall amount.


    Here’s what IDC’s Jessica Goepfert—the program vice president (VP) of Customer
    Insights and Analysis—said:


    > *At a high level, organizations are turning to Big Data and analytics solutions
    to navigate the convergence of their physical and digital worlds. This transformation
    takes a different shape depending on the industry. For instance, within banking
    and retail—two of the fastest growth areas for Big Data and analytics—investments
    are all about managing and reinvigorating the customer experience. Whereas in
    manufacturing, firms are reinventing themselves to essentially be high tech companies,
    using their products as a platform to enable and deliver digital services.* ^([^(25)](#fn25))


    But a high level of spending does not necessarily translate into good results.
    A Gartner study estimates that roughly 85% of Big Data projects are abandoned
    before they get to the pilot stage.^([^(26)](#fn26)) Some of the reasons include
    the following:


    *   Lack of a clear focus


    *   Dirty data


    *   Investment in the wrong IT tools


    *   Problems with data collection


    *   Lack of buy-in from key stakeholders and champions in the organization


    In light of this, it is critical to have a data process. Notwithstanding there
    are many approaches—often extoled by software vendors—there is one that has widespread
    acceptance. A group of experts, software developers, consultants, and academics
    created the CRISP-DM Process in the late 1990s. Take a look at Figure [2-1](#480660_1_En_2_Chapter.xhtml#Fig1)
    for a visual.


    ![../images/480660_1_En_2_Chapter/480660_1_En_2_Fig1_HTML.jpg](images/480660_1_En_2_Chapter/480660_1_En_2_Fig1_HTML.jpg)


    Figure 2-1.


    The CRISP-DM Process


    In this chapter, we’ll take a look at steps #1 through #3\. Then in the rest of
    the book, we’ll cover the remaining ones (that is, we will look at Modelling and
    Evaluation in Chapter [3](#480660_1_En_3_Chapter.xhtml) and Deployment in Chapter
    [8](#480660_1_En_8_Chapter.xhtml)).


    Note that steps #1–#3 can account for 80% of the time of the data process, which
    is based on the experience of Atif Kureishy, who is the global VP of Emerging
    Practices at Teradata.^([^(27)](#fn27)) This is due to factors like: The data
    is not well organized and comes from different sources (whether from different
    vendors or silos in the organization), there is not enough focus on automation
    tools, and the initial planning was insufficient for the scope of the project.


    It’s also worth keeping in mind that the CRISP-DM Process is not a strict linear
    process. When dealing with data, there can be much iteration. For example, there
    may be multiple attempts at coming up with the right data and testing it.'
