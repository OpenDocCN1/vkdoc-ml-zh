  trans: '

    ## 决策树（监督学习/回归）


    毫无疑问，聚类可能不适用于某些数据集。但好消息是，还有其他替代方案，例如决策树。这种方法通常对非数值数据效果更好。


    决策树的起点是根节点，位于流程图的顶部。从这里开始，会形成一条由决策路径组成的树，这些路径被称为分裂点。在这些节点上，你将使用算法做出决策，并计算出相应的概率。树的末端是叶节点（即结果）。


    在机器学习领域，一个著名的例子是使用决策树来预测泰坦尼克号沉没事件中的生存情况。该模型根据三个特征预测乘客的生存概率：性别、年龄以及随行的配偶或子女人数（sibsp）。如图
    3-5 所示。


    ![../images/480660_1_En_3_Chapter/480660_1_En_3_Fig5_HTML.jpg](img/480660_1_En_3_Fig5_HTML.jpg)


    图 3-5.


    这是一个用于预测泰坦尼克号生存情况的基本决策树算法


    决策树有明显的优势。它们易于理解，适用于大型数据集，并且模型具有透明性。


    然而，决策树也有缺点。其一是错误传播。如果某个分裂点出错，这个错误可能会级联影响到模型的其余部分！


    其次，随着决策树的增长，由于涉及大量算法，复杂性也会增加。这最终可能导致模型性能下降。


    ## 集成建模（监督学习/回归）


    集成建模意味着使用多个模型来进行预测。尽管这会增加复杂性，但事实证明这种方法能产生强大的结果。


    要了解其实际应用，可以看看始于 2006 年的“Netflix Prize”竞赛。该公司宣布，将向任何能将电影推荐系统准确率提升 10%或以上的个人或团队支付
    100 万美元。Netflix 还提供了一个数据集，包含来自 480,189 名用户对 17,770 部电影的超过 1 亿条评分。^(⁵¹) 最终，该数据集被下载超过
    30,000 次。


    Netflix 为何要这样做？一个主要原因是公司自己的工程师在改进方面遇到了困难。那么，为什么不把问题交给大众来解决呢？事实证明这非常巧妙——与潜在收益相比，100
    万美元的奖金其实相当适中。


    这场竞赛确实激发了从学生到 AT&T 等公司员工在内的众多程序员和数据科学家的热情。


    Netflix 还简化了竞赛规则。主要要求是参赛团队必须公开他们的方法，这有助于提升整体成果（甚至还有一个显示团队排名的仪表板）。


    但直到 2009 年，一个名为 BellKor''s Pragmatic Chaos 的团队才赢得了大奖。当然，这中间也遇到了相当大的挑战。


    那么，获胜团队是如何成功的呢？第一步是创建一个基线模型，以平滑处理数据中的棘手问题。例如，有些电影只有寥寥几条评分，而另一些则有数千条。此外，还有一个棘手的问题：有些用户总是给电影打一星。为了处理这些问题，BellKor
    团队使用机器学习来预测评分，以填补数据空缺。


    基线模型完成后，还有更多艰巨的挑战需要应对，例如：


    *   系统可能会向许多用户推荐相同的电影。

    *   有些电影可能难以归入特定类型。例如，《异形》实际上是科幻和恐怖的混合体。

    *   有些电影，比如《拿破仑炸药》，被证明极难被算法理解。

    *   电影的评分往往会随时间变化。


    获胜团队使用了集成建模，其中包含了数百种算法。他们还使用了一种称为提升（boosting）的方法，即构建连续的模型。通过这种方法，算法中的权重会根据前一个模型的结果进行调整，从而随着时间的推移使预测效果越来越好（另一种方法称为装袋（bagging），即并行构建不同的模型，然后选择最佳的一个）。


    最终，BellKor 团队找到了解决方案。然而，尽管如此，Netflix 并没有使用这个模型！原因尚不清楚。也许是因为 Netflix 当时正在逐渐放弃五星评分系统，而更专注于流媒体服务。此外，这场竞赛也引发了部分人的反弹，他们认为可能存在隐私侵犯问题。


    无论如何，这场竞赛确实凸显了机器学习的力量——以及协作的重要性。

    '
- fmt: '# K-Means Clustering (Unsupervised/Clustering)


    The `k-Means` clustering algorithm, which is effective for large datasets, puts
    similar, unlabeled data into different groups. The first step is to select `k`,
    which is the number of clusters. To help with this, you can perform visualizations
    of that data to see if there are noticeable grouping areas.


    Here’s a look at sample data, in Figure [3-6](#480660_1_En_3_Chapter.xhtml#Fig6):


    ![../images/480660_1_En_3_Chapter/480660_1_En_3_Fig6_HTML.jpg](images/480660_1_En_3_Chapter/480660_1_En_3_Fig6_HTML.jpg)


    Figure 3-6. The initial plot for a dataset


    For this example, we assume there will be two clusters, and this means there will
    also be two centroids. A centroid is the midpoint of a cluster. We will assign
    each randomly, which you can see in Figure [3-7](#480660_1_En_3_Chapter.xhtml#Fig7).


    ![../images/480660_1_En_3_Chapter/480660_1_En_3_Fig7_HTML.jpg](images/480660_1_En_3_Chapter/480660_1_En_3_Fig7_HTML.jpg)


    Figure 3-7. This chart shows two centroids—represented by circles—that are randomly
    placed


    As you can see, the centroid at the top left looks way off, but the one on the
    right side is better. The `k-Means` algorithm will then calculate the average
    distances of the centroids and then change their locations. This will be iterated
    until the errors are fairly minimal—a point that is called convergence, which
    you can see with Figure [3-8](#480660_1_En_3_Chapter.xhtml#Fig8).


    ![../images/480660_1_En_3_Chapter/480660_1_En_3_Fig8_HTML.jpg](images/480660_1_En_3_Chapter/480660_1_En_3_Fig8_HTML.jpg)


    Figure 3-8. Through iterations, the `k-Means` algorithm gets better at grouping
    the data


    Granted, this is a simple illustration. But of course, with a complex dataset,
    it will be difficult to come up with the number of initial clusters. In this situation,
    you can experiment with different `k` values and then measure the average distances.
    By doing this multiple times, there should be more accuracy.


    Then why not just have a high number for `k`? You can certainly do this. But when
    you compute the average, you’ll notice that there will be only incremental improvements.
    So one method is to stop at the point where this starts to occur. This is seen
    in Figure [3-9](#480660_1_En_3_Chapter.xhtml#Fig9).


    ![../images/480660_1_En_3_Chapter/480660_1_En_3_Fig9_HTML.jpg](images/480660_1_En_3_Chapter/480660_1_En_3_Fig9_HTML.jpg)


    Figure 3-9. This shows the optimal point of the `k` value in the `k-Means` algorithm


    However, `k-Means` has its drawbacks. For instance, it does not work well with
    nonspherical data, which is the case with Figure [3-10](#480660_1_En_3_Chapter.xhtml#Fig10).


    ![../images/480660_1_En_3_Chapter/480660_1_En_3_Fig10_HTML.jpg](images/480660_1_En_3_Chapter/480660_1_En_3_Fig10_HTML.jpg)


    Figure 3-10. Here’s a demonstration where `k-Means` does not work with nonspherical
    data


    With this, the `k-Means` algorithm would likely not pick up on the surrounding
    data, even though it has a pattern. But there are some algorithms that can help,
    such as `DBScan` (density-based spatial clustering of applications with noise),
    which is meant to handle a mix of widely varying sizes of datasets. Although,
    `DBScan` can require lots of computational power.


    Next, there is the situation where there are some clusters with lots of data and
    others with little. What might happen? There is a chance that the `k-Means` algorithm
    will not pick up on the light one. This is the case with Figure [3-11](#480660_1_En_3_Chapter.xhtml#Fig11).


    ![../images/480660_1_En_3_Chapter/480660_1_En_3_Fig11_HTML.jpg](images/480660_1_En_3_Chapter/480660_1_En_3_Fig11_HTML.jpg)


    Figure 3-11. If there are areas of thin data, the `k-Means` algorithm may not
    pick them up


    ## Conclusion


    These algorithms can get complicated and do require strong technical skills. But
    it is important to not get too bogged down in the technology. After all, the focus
    is to find ways to use machine learning to accomplish clear objectives.


    Again, Stich Fix is a good place to get guidance on this. In the November issue
    of the *Harvard Business Review*, the company’s chief algorithms officer, Eric
    Colson, published an article, “Curiosity-Driven Data Science.”^([^(52)](#fn52))
    In it, he provided his experiences in creating a data-driven organization.


    At the heart of this is allowing data scientists to explore new ideas, concepts,
    and approaches. This has resulted in AI being implemented across core functions
    of the business like inventory management, relationship management, logistics,
    and merchandise buying. It has been transformative, making the organization more
    agile and streamlined. Colson also believes it has provided “a protective barrier
    against competition.”


    His article also provides other helpful advice for data analysis:


    *   *Data Scientists*: They should not be part of another department. Rather,
    they should have their own, which reports directly to the CEO. This helps with
    focusing on key priorities as well as having a holistic view of the needs of the
    organization.

    *   *Experiments*: When a data scientist has a new idea, it should be tested on
    a small sample of customers. If there is traction, then it can be rolled out to
    the rest of the base.

    *   *Resources*: Data scientists need full access to data and tools. There should
    also be ongoing training.

    *   *Generalists*: Hire data scientists who span different domains like modelling,
    machine learning, and analytics (Colson refers to these people as “full-stack
    data scientists”). This leads to small teams—which are often more efficient and
    productive.

    *   *Culture*: Colson looks for values like “learning by doing, being comfortable
    with ambiguity, balancing long-and short-term returns.”'
  raw: '## K-Means Clustering (Unsupervised/Clustering)


    The k-Means clustering algorithm, which is effective for large datasets, puts
    similar, unlabeled data into different groups. The first step is to select k,
    which is the number of clusters. To help with this, you can perform visualizations
    of that data to see if there are noticeable grouping areas.


    Here’s a look at sample data, in Figure [3-6](#480660_1_En_3_Chapter.xhtml#Fig6):


    ![../images/480660_1_En_3_Chapter/480660_1_En_3_Fig6_HTML.jpg](images/480660_1_En_3_Chapter/480660_1_En_3_Fig6_HTML.jpg)


    Figure 3-6.


    The initial plot for a dataset


    For this example, we assume there will be two clusters, and this means there will
    also be two centroids. A centroid is the midpoint of a cluster. We will assign
    each randomly, which you can see in Figure [3-7](#480660_1_En_3_Chapter.xhtml#Fig7).


    ![../images/480660_1_En_3_Chapter/480660_1_En_3_Fig7_HTML.jpg](images/480660_1_En_3_Chapter/480660_1_En_3_Fig7_HTML.jpg)


    Figure 3-7.


    This chart shows two centroids—represented by circles—that are randomly placed


    As you can see, the centroid at the top left looks way off, but the one on the
    right side is better. The k-Means algorithm will then calculate the average distances
    of the centroids and then change their locations . This will be iterated until
    the errors are fairly minimal—a point that is called convergence, which you can
    see with Figure [3-8](#480660_1_En_3_Chapter.xhtml#Fig8).


    ![../images/480660_1_En_3_Chapter/480660_1_En_3_Fig8_HTML.jpg](images/480660_1_En_3_Chapter/480660_1_En_3_Fig8_HTML.jpg)


    Figure 3-8.


    Through iterations, the k-Means algorithm gets better at grouping the data


    Granted, this is a simple illustration. But of course, with a complex dataset,
    it will be difficult to come up with the number of initial clusters. In this situation,
    you can experiment with different k values and then measure the average distances.
    By doing this multiple times, there should be more accuracy.


    Then why not just have a high number for k? You can certainly do this. But when
    you compute the average, you’ll notice that there will be only incremental improvements.
    So one method is to stop at the point where this starts to occur. This is seen
    in Figure [3-9](#480660_1_En_3_Chapter.xhtml#Fig9).


    ![../images/480660_1_En_3_Chapter/480660_1_En_3_Fig9_HTML.jpg](images/480660_1_En_3_Chapter/480660_1_En_3_Fig9_HTML.jpg)


    Figure 3-9.


    This shows the optimal point of the k value in the k-Means algorithm


    However, k-Means has its drawbacks . For instance, it does not work well with
    nonspherical data, which is the case with Figure [3-10](#480660_1_En_3_Chapter.xhtml#Fig10).


    ![../images/480660_1_En_3_Chapter/480660_1_En_3_Fig10_HTML.jpg](images/480660_1_En_3_Chapter/480660_1_En_3_Fig10_HTML.jpg)


    Figure 3-10.


    Here’s a demonstration where k-Means does not work with nonspherical data


    With this, the k-Means algorithm would likely not pick up on the surrounding data,
    even though it has a pattern. But there are some algorithms that can help, such
    as DBScan (density-based spatial clustering of applications with noise), which
    is meant to handle a mix of widely varying sizes of datasets. Although, DBScan
    can require lots of computational power.


    Next, there is the situation where there are some clusters with lots of data and
    others with little. What might happen? There is a chance that the k-Means algorithm
