- fmt: '# When to Use Deep Learning?


    Because of the power of deep learning, there is the temptation to use this technology
    first when creating an AI project. But this can be a big mistake. Deep learning
    still has narrow use cases, such as for text, video, image, and time-series datasets.
    There is also a need for large amounts of data and high-powered computer systems.


    Oh, and deep learning is better when outcomes can be quantified and verified.


    To see why, let’s consider the following example. A team of researchers, led by
    Thomas Hartung (a toxicologist at Johns Hopkins University), created a dataset
    of about 10,000 chemicals that were based on 800,000 animal tests. By using deep
    learning, the results showed that the model was more predictive than many animal
    tests for toxicity.^([^(83)](#fn83)) Remember that animal tests can not only be
    costly and require safety measures but also have inconsistent results because
    of repeated testing on the same chemical.


    “The first scenario illustrates the predictive power of deep learning, and its
    ability to unearth correlations from large datasets that a human would never find,”
    said Sheldon Fernandez, who is the CEO of DarwinAI.^([^(84)](#fn84))


    So where’s a scenario in which deep learning falls short? Actually, an illustration
    of this is the 2018 FIFA World Cup in Russia, which France won. Many researchers
    tried to predict the outcomes of all 64 matches, but the results were far from
    accurate:^([^(85)](#fn85))


    * One group of researchers employed the bookmaker consensus model that indicated
    that Brazil would win.

    * Another group of researchers used algorithms such as random forest and Poisson
    ranking to forecast that Spain would prevail.


    The problem here is that it is tough to find the right variables that have predictive
    power. In fact, deep learning models are basically unable to handle the complexity
    of features for certain events, especially those that have elements of being chaotic.


    However, even if you have the right amount of data and computing power, you still
    need to hire people who have a background in deep learning, which is not easy.
    Keep in mind that it is a challenge to select the right model and fine-tune it.
    How many hyperparameters should there be? What should be the number of hidden
    layers? And how do you evaluate the model? All of these are highly complex.


    Even experts can get things wrong. Here’s the following from Sheldon:


    > One of our automotive clients encountered some bizarre behavior in which a self-driving
    car would turn left with increasing regularity when the sky was a certain shade
    of purple. After months of painful debugging, they determined the training for
    certain turning scenarios had been conducted in the Nevada desert when the sky
    was a particular hue. Unbeknownst to its human designers, the neural network had
    established a correlation between its turning behavior and the celestial tint.^([^(86)](#fn86))


    There are some tools that are helping with the deep learning process, such as
    Amazon.com’s SageMaker, Google’s HyperTune, and SigOpt. But there is still a long
    way to go.


    If deep learning is not a fit, then you may want to consider machine learning,
    which often requires relatively less data. Furthermore, the models tend to be
    much simpler, but the results may still be more effective.


    # Drawbacks with Deep Learning


    Given all the innovations and breakthroughs, it’s reasonable that many people
    consider deep learning to be a silver bullet. It will mean we no longer have to
    drive a car. It may even mean that we’ll cure cancer.


    How is it not possible to be excited and optimistic? This is natural and reasonable.
    But it is important to note that deep learning is still in a nascent stage and
    there are actually many nagging issues. It’s a good idea to temper expectations.


    In 2018, Gary Marcus wrote a paper entitled “Deep Learning: A Critical Appraisal,”
    in which he clearly set forth the challenges.^([^(87)](#fn87)) In his paper, he
    notes:


    > Against a background of considerable progress in areas such as speech recognition,
    image recognition, and game playing, and considerable enthusiasm in the popular
    press, I present ten concerns for deep learning, and suggest that deep learning
    must be supplemented by other techniques if we are to reach Artificial General
    Intelligence.^([^(88)](#fn88))


    Marcus definitely has the right pedigree to present his concerns, as he has both
    an academic and business background in AI. Before becoming a professor at the
    Department of Psychology at New York University, he sold his startup, called Geometric
    Intelligence, to Uber. Marcus is also the author of several bestselling books
    like *The Haphazard Construction of the Human Mind*.^([^(89)](#fn89))


    Here’s a look at some of his worries about deep learning:


    * *Black Box*: A deep learning model could easily have millions of parameters
    that involve many hidden layers. Having a clear understanding of this is really
    beyond a person’s capabilities. True, this may not necessarily be a problem with
    recognizing cats in a dataset. But it could definitely be an issue with models
    for medical diagnosis or determining the safety of an oil rig. In these situations,
    regulators will want to have a good understanding of the transparency of the models.
    Because of this, researchers are looking at creating systems to determine “explainability,”
    which provides an understanding of deep learning models.


    * *Data*: The human brain has its flaws. But there are some functions that it
    does extremely well like the ability to learn by abstraction. For example, suppose
    Jan, who is five years old, goes to a restaurant with her family. Her mother points
    out an item on the plate and says it is a “taco.” She does not have to explain
    it or provide any information about it. Instead, Jan’s brain will instantly process
    this information and understand the overall pattern. In the future, when she sees
    another taco—even if it has differences, such as with the dressing—she will know
    what it is. For the most part, this is intuitive. But unfortunately, when it comes
    to deep learning, there is no taco learning by abstraction! The system has to
    process enormous amounts of information to recognize it. Of course, this is not
    a problem for companies like Facebook, Google, or even Uber. But many companies
    have much more limited datasets. The result is that deep learning may not be a
    good option.


    * *Hierarchical Structure*: This way of organizing does not exist in deep learning.
    Because of this, language understanding still has a long way to go (especially
    with long discussions).


    * *Open-Ended Inference*: Marcus notes that deep learning cannot understand the
    nuances between “John promised Mary to leave” and “John promised to leave Mary.”
    What’s more, deep learning is far away from being able to, for instance, read
    Jane Austen’s *Pride and Prejudice* and be able to divine Elizabeth Bennet’s character
    motivations.


    * *Conceptual Thinking*: Deep learning cannot have an understanding of concepts
    like democracy, justice, or happiness. It also does not have imagination, thinking
    of new ideas or plans.'
