    ## RPA 的优缺点


    当然，对于典型的后台员工来说，相当多的时间都花在了日常任务上。但借助 RPA，公司通常可以获得可观的 ROI（投资回报率）——只要实施得当。


    以下是一些其他优势：


    *   *客户满意度*：RPA 意味着极低的错误率和高速处理。机器人还能 7x24 小时工作。这意味着客户满意度评分——如 NPS（净推荐值）——应该会得到提升。请注意，越来越多的客户，例如千禧一代，更倾向于使用应用程序/网站，而不是与人打交道！RPA
    还意味着客服代表将有更多时间处理增值任务，而不是处理那些浪费时间的繁琐事务。


    *   *可扩展性*：一旦创建了机器人，就可以快速扩展以应对活动高峰。这对于零售商等季节性业务至关重要。


    *   *合规性*：对于人类来说，要跟踪所有的规则、法规和法律是很困难的。更糟糕的是，它们还经常变化。但有了 RPA，合规性就被内置到了流程中——并且始终得到遵循。这在避免法律问题和罚款方面是一个主要优势。


    *   *洞察与分析*：新一代 RPA 平台配备了复杂的仪表盘，专注于您业务的 KPI。如果出现任何问题，您还可以设置警报。


    *   *遗留系统*：老牌公司常常被旧的 IT 系统拖累，这使得实现数字化转型极其困难。但 RPA 软件能够与遗留 IT 环境相当良好地协同工作。


    *   *数据*：由于实现了自动化，数据输入错误极少，因此数据更加干净。这意味着，随着时间的推移，组织将对其业务有更准确的理解。数据质量也将提高 AI 实施成功的可能性。


    尽管这一切都很棒，但 RPA 仍然有其缺点。例如，如果您当前的流程效率低下，并且您急于实施 RPA 系统，那么您本质上是在复制一种糟糕的方法！这就是为什么在实施系统之前评估您的工作流程至关重要。


    但当然还有其他潜在的“雷区”需要注意，例如：


    *   *脆弱性*：如果底层应用程序发生变化，RPA 很容易崩溃。如果流程和法规发生变化，情况也可能如此。诚然，较新的系统在适应变化方面做得更好，并且可能还会利用
    API。但 RPA 并非完全无需人工干预的活动。


    *   *虚拟化应用*：这类软件，例如来自 Citrix 的软件，可能难以与 RPA 系统配合使用，因为它们无法有效捕获流程。原因在于数据存储在外部服务器上，输出的是显示器上的快照。但一些公司正在使用
    AI 来解决这个问题，例如 UiPath。该公司创建了一个名为“实用 AI”的系统，该系统使用计算机视觉来解释屏幕快照以记录流程。


    *   *专业化*：许多 RPA 工具用于通用目的的活动。但可能存在需要专业化的领域，例如金融领域。在这种情况下，您可能需要寻找一个能够处理该领域的专业软件应用程序。


    *   *测试*：这绝对至关重要。您应该首先抽样测试一些事务，以确保系统正常工作。之后，您可以更广泛地推广 RPA 系统。


    *   *所有权*：人们倾向于让 IT 部门拥有 RPA 的实施和管理权。但这可能并不可取。原因何在？RPA 系统技术含量相对较低。毕竟，非程序员也可以开发它们。因此，业务经理是拥有该流程的理想人选，因为他们通常能够处理技术问题，并且对员工工作流程有更牢固的把握。


    *   *阻力*：变革总是困难的。对于 RPA，人们可能会担心该技术会取代工作岗位。这意味着您需要有一套清晰的信息，重点强调该技术的好处。例如，RPA 意味着有更多时间专注于重要事务，这应该会让一个人的工作更有趣、更有意义。


    ## 您对 RPA 有何期待？


    就 RPA 而言，该行业仍处于早期阶段。然而，有明显迹象表明，该技术正在为许多公司带来巨大改变。


    看看 Computer Economics Technology 的研究报告，该报告涵盖了大约 250 家公司（它们跨越多个行业，收入从 2000 万美元到超过
    10 亿美元不等）。在那些实施了 RPA 系统的公司中，大约有一半报告在部署后 18 个月内获得了正回报。这对于企业软件来说绝对是出类拔萃的，因为企业软件在获得采用方面可能具有挑战性。^(⁹⁵)


    要了解这项技术的战略重要性，可以看看美国国防部——该部门参与了 500 多个 AI 项目——正在做什么。以下是该机构联合人工智能中心主任、空军中将杰克·沙纳汉在国会听证会上的发言：


    *   当你谈论智能自动化，或者用行业术语来说，机器人流程自动化时，它在大型 AI 项目方面并不引人注目，但它可能是最能找到效率提升点的地方。如果你阅读一些行业日报，无论是医学还是金融领域，情况都是如此，这是
    AI 早期成果正在实现的地方。我们在部门承担的其他一些项目，其投资回报可能需要数年时间才能实现。^(⁹⁶)


    尽管如此，仍然有许多失败的 RPA 实施案例。例如，安永会计师事务所因此获得了大量的咨询业务。根据这一经验，初始 RPA 项目的失败率在 30% 到 50%
    之间。^(⁹⁷)


    但这对于任何类型的企业软件系统来说都是不可避免的。然而，到目前为止，问题似乎主要在于规划、策略和期望——而不是技术本身。


    另一个问题是，围绕 RPA 的炒作可能将期望值提升到了过高的水平。这意味着，即使实施成功，失望情绪也会相当普遍！


    当然，技术并非万能药。它们需要投入大量的时间、精力和勤奋才能发挥作用。


    ## 如何实施 RPA


    那么，成功实施 RPA 需要采取哪些步骤呢？没有标准答案，但确实出现了一些最佳实践：


    *   确定要自动化的正确功能。


    *   评估流程。


    *   选择 RPA 供应商并部署软件。


    *   建立一个团队来管理 RPA 平台。


    让我们更详细地看看每一步。

    '
- fmt: '### Determine the Right Functions to Automate


    > *Yes, excessive automation at Tesla was a mistake. To be precise, my mistake.
    Humans are underrated.*

    >

    > —Elon Musk, CEO of Tesla^([^(98)](#fn98))


    Even though RPA is powerful and can move the needle in a big way for a company,
    the capabilities are still fairly limited. The technology essentially makes the
    most sense for automating repetitive, structured, and routine processes. This
    involves things like scheduling, inputting/transferring data, following rules/workflows,
    cut and paste, filling out forms, and search. This means that RPA can actually
    have a role in just about every department in an organization.


    Then where does this technology generally fail to deliver? Well, if a process
    requires independent judgment, then RPA probably does not make sense. The same
    goes for when the processes are subject to frequent change. In this situation,
    you can spend lots of time with ongoing adjustments to the configurations.


    Once you establish a part of the business where the technology looks like a good
    fit, there are a myriad of other considerations. In other words, you’ll likely
    have more success with a project if you focus on the following:


    - The areas of the business that have serious levels of underperformance

    - The processes that take up a high percentage of employee time and involve high
    error rates

    - The tasks that need more hiring when there are higher volumes

    - The areas that you are thinking of outsourcing

    - A process that has a large number of steps and in which there are various applications
    involved


    ### Assess the Processes


    It’s common for a company to have many unwritten processes. And this is fine.
    This approach allows for adaptability, which is what people are good at.


    However, this is far from the case with a bot. To have a successful implementation,
    you need to have a deep assessment of the processes. This can actually take a
    while, and it may make sense to get outside consultants to help out. They have
    the advantage of being more neutral and better able to identify the weaknesses.


    Some of the RPA vendors do have their own tools to help with analyzing processes—which
    you should definitely use. There are also third-party software providers that
    have their own offerings. One is Celonis, which integrates with RPA platforms
    such as UiPath, Automation Anywhere, Blue Prism, and others. The software performs
    essentially a digital MRI that analyzes data, providing insights on how your processes
    really work. It will also identify weakness and opportunities, such as to increase
    revenues, improve customer satisfaction, and free up resources.


    Regardless of what approach you take, it is critical that you formulate a clear-cut
    plan that has the input from IT, higher management, and the departments impacted.
    Also make sure to get analytics people involved, as there could be opportunities
    for leveraging the data.


    ### Select the RPA Vendor and Deploy the Software


    By going through the first two steps, you’ll be in a very good position to evaluate
    the different RPA systems. For example, if your main goal is to cut staff, then
    you would look for software that is focused on unattended bots. Or, if you want
    to leverage data—such as for AI applications—then this will lead to other types
    of RPA platforms.


    Then, once you have selected one, you will begin the deployment. The good news
    is that this can be relatively fast, say less than a month.


    But as you go on to do further RPA projects, you may run into something called
    automation fatigue. This is where the returns generally start to deteriorate.


    Think of it this way: When you start out, the focus will usually be on those areas
    of the business that need automation the most, which means the ROI will be significant.
    But over time, there will be a focus on tasks that are not as amenable to automation,
    and it will likely take much more work to realize even slight improvements.


    Because of this, it is a good idea to temper expectations when engaging in a widespread
    RPA transformation.


    ### Set in Place a Team to Manage the RPA Platform


    Just because RPA provides a high degree of automation does not mean it requires
    little management. Rather, the best approach is to put together a team, which
    is often referred to as a center of excellence (CoE).


    In order to make the best use of the CoE, you need to be clear on each person’s
    responsibilities. For example, you should be able to answer the following questions:


    - What happens if there is a problem with a bot? At what points should there be
    human intervention?

    - Who is in charge of monitoring the RPA?

    - Who is in charge of training?

    - Who will have the role for the first line of support?

    - Who is responsible for developing the bots?


    For larger organizations, you might also want to expand the roles. You could have
    an RPA champion, who would be the evangelist of the platform—for the whole company.
    Or there could be an RPA change manager, who provides the communication to help
    with adoption.


    Finally, as the RPA implementation gets larger, a key goal should be to look at
    how all the parts fit together. Like many other software systems, there is the
    risk of sprawl across the organization—which can mean not getting higher performance.
    This is where having a proactive CoE can make a major positive impact.


    ## RPA and AI


    While still in the initial phases, AI is already making strides with RPA tools.
    This is leading to the emergence of Cognitive Robotic Process Automation (CRPA)
    software bots.


    And this makes sense. After all, RPA is about optimizing processes and involves
    large amounts of data. So vendors are starting to implement systems like machine
    learning, deep learning, speech recognition, and Natural Language Processing.
    Some of the leaders in the CRPA space include UiPath, Automation Anywhere, Blue
    Prism, NICE Systems, and Kryon Systems.


    For example, with Automation Anywhere, a bot can handle tasks such as extracting
    invoices from emails, which involves sophisticated text processing. The company
    also has prebuilt integrations with third-party AI services like IBM Watson, AWS
    Machine Learning, and Google Cloud AI.^([^(99)](#fn99))


    “There has been a proliferation of AI-enabled services in recent years, but businesses
    often struggle to operationalize them,” said Mukund Srigopal, who is the director
    of Product Marketing at Automation Anywhere. “RPA is a great way to infuse AI
    capabilities into business processes.”^([^(100)](#fn100))


    Here are some other ways CRPA can allow for AI functions:


    - You can connect chatbots with your system, which will allow for automated customer
    service (we’ll cover this topic in Chapter [6](#480660_1_En_6_Chapter.xhtml)).

    - AI can find the right moment to send an email or alert.

    - IVR (Interactive Voice Response) has gotten a bad reputation over the years.
    Simply put, customers do not like the hassle of going through multiple steps to
    solve a problem. But with CRPA, you can use something called Dynamic IVR. This
    personalizes the voice messages to each customer, providing for a much better
    experience.

    - NLP and text analysis can convert unstructured data into structured data. This
    can make the CRPA more effective.'
