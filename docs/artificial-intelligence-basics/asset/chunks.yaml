- fmt: '# Programming Robots for AI


    It is getting easier to create intelligent robots, as systems get cheaper and
    there are new software platforms emerging. A big part of this has been due to
    the Robot Operating System (`ROS`), which is becoming a standard in the industry.
    The origins go back to 2007 when the platform began as an open source project
    at the Stanford Artificial Intelligence Laboratory.


    Despite its name, `ROS` is really not a true operating system. Instead, it is
    middleware that helps to manage many of the critical parts of a robot: planning,
    simulations, mapping, localization, perception, and prototypes. `ROS` is also
    modular, as you can easily pick and choose the functions you need. The result
    is that the system can easily cut down on development time.


    Another advantage: `ROS` has a global community of users. Consider that there
    are over 3,000 packages for the platform.^([^(165)](#fn165))


    As a testament to the prowess of `ROS`, Microsoft announced in late 2018 that
    it would release a version for the Windows operating system. According to the
    blog post from Lou Amadio, the principal software engineer of Windows IoT, “As
    robots have advanced, so have the development tools. We see robotics with artificial
    intelligence as universally accessible technology to augment human abilities.”^([^(166)](#fn166))


    The upshot is that `ROS` can be used with Visual Studio and there will be connections
    to the Azure cloud, which includes AI Tools.


    OK then, when it comes to developing intelligent robots, there is often a different
    process than with the typical approach with software-based AI. That is, there
    not only needs to be a physical device but also a way to test it. Often this is
    done by using a simulation. Some developers will even start with creating cardboard
    models, which can be a great way to get a sense of the physical requirements.


    But of course, there are also useful virtual simulators, such as `MuJoCo`, `Gazebo`,
    `MORSE`, and `V-REP`. These systems use sophisticated 3D graphics to deal with
    movements and the physics of the real world.


    Then how do you create the AI models for robots? Actually, it is little different
    from the approach with software-based algorithms (as we covered in Chapter [2](#480660_1_En_2_Chapter.xhtml)).
    But with a robot, there is the advantage that it will continue to collect data
    from its sensors, which can help evolve the AI.


    The cloud is also becoming a critical factor in the development of intelligent
    robots, as seen with Amazon.com. The company has leveraged its hugely popular
    `AWS` platform with a new offering, called `AWS RoboMaker`. By using this, you
    can build, test, and deploy robots without much configuration. `AWS RoboMaker`
    operates on `ROS` and also allows the use of services for machine learning, analytics,
    and monitoring. There are even prebuilt virtual 3D worlds for retail stores, indoor
    rooms, and race tracks! Then once you are finished with the robot, you can use
    `AWS` to develop an over-the-air (`OTA`) system for secure deployment and periodic
    updates.


    And as should be no surprise, Google is planning on releasing its own robot cloud
    platform (it’s expected to launch in 2019).^([^(167)](#fn167))


    # The Future of Robots


    Rodney Brooks is one of the giants of the robotics industry. In 1990, he co-founded
    `iRobot` to find ways to commercialize the technology. But it was not easy. It
    was not until 2002 that the company launched its `Roomba` vacuuming robot, which
    was a big hit with consumers. As of this writing, `iRobot` has a market value
    of $3.2 billion and posted more than $1 billion in revenues for 2018.


    But `iRobot` was not the only startup for Brooks. He would also help to launch
    Rethink Robotics—and his vision was ambitious. Here’s how he put it during 2010,
    when his company announced a $20 million funding:


    > Our robots will be intuitive to use, intelligent and highly flexible. They’ll
    be easy to buy, train, and deploy and will be unbelievably inexpensive. [Rethink
    Robotics] will change the definition of how and where robots can be used, dramatically
    expanding the robot marketplace.^([^(168)](#fn168))


    But unfortunately, as with `iRobot`, there were many challenges. Even though Brook’s
    idea for cobots was pioneering—and would ultimately prove to be a lucrative market—he
    had to struggle with the complications of building an effective system. The focus
    on safety meant that precision and accuracy was not up to the standards of industrial
    customers. Because of this, the demand for Rethink’s robots was tepid.


    By October 2018, the company ran out of cash and had to close its doors. In all,
    Rethink had raised close to $150 million from VCs and strategic investors like
    Goldman Sachs, Sigma Partners, GE, and Bezos Expeditions. The company’s intellectual
    property was sold off to a German automation firm, HAHN Group.


    True, this is just one example. But then again, it does show that even the smartest
    tech people can get things wrong. And more importantly, the robotics market has
    unique complexities. When it comes to the evolution of this category, progress
    may be choppy and volatile.


    As Cobalt’s Schluntz has noted:


    > While the industry has made progress in the last decade, robotics hasn’t yet
    realized its full potential. Any new technology will create a wave of numerous
    new companies, but only a few will survive and turn into lasting businesses. The
    Dot-Com bust killed the majority of internet companies, but Google, Amazon, and
    Netflix all survived. What robotics companies need to do is to be upfront about
    what their robots can do for customers today, overcome Hollywood stereotypes of
    robots as the bad guys, and demonstrate a clear ROI (Return On Investment) to
    customers.^([^(169)](#fn169))


    # Conclusion


    Until the past few years, robots were mostly for high-end manufacturing, such
    as for autos. But with the growth in AI and the lower costs for building devices,
    robots are becoming more widespread across a range of industries. As seen in this
    chapter, there are interesting use cases with robots that do things like clean
    floors or provide security for facilities.


    But the use of AI with robotics is still in the nascent stages. Programming hardware
    systems is far from easy, and there is the need of sophisticated systems to navigate
    environments. However, with AI approaches like reinforcement learning, there has
    been accelerated progress.


    But when thinking of using robots, it’s important to understand the limitations.
    There also must be a clear-cut purpose. If not, a deployment can easily lead to
    a costly failure. Even some of the world’s most innovative companies, like Google
    and Tesla, have had challenges in working with robots.'
