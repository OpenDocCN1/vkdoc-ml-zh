  trans: '

    ## 组建团队


    人工智能项目的初始团队应该有多大？或许可以参考杰夫·贝佐斯的“两块披萨原则”^(¹⁷⁹)。换句话说，团队规模是否小到足以让参与者都能吃饱？


    哦，还有，组建团队不必操之过急。每个人都必须高度专注于成功，并理解项目的重要性。如果人工智能项目拿不出什么成果，未来项目的推进前景可能会岌岌可危。


    团队需要一位通常具备业务或运营背景，同时也掌握一定技术技能的领导者。这样的人应该能够识别人工智能项目的商业案例，同时也能向公司内部多个利益相关方（如 IT
    部门和高级管理层）传达愿景。


    至于技术人员，可能并不需要拥有人工智能领域的博士学位。虽然这类人才非常出色，但他们通常主要专注于该领域的创新，例如优化模型或创建新模型。这些技能对于人工智能试点项目通常并非必需。


    相反，应该寻找那些具有软件工程或数据科学背景的人。然而，正如本章前面所述，这些人可能没有深厚的人工智能背景。因此，可能需要让他们花几个月的时间接受培训，学习机器学习和深度学习的核心原理。同时，还应重点关注如何理解和使用人工智能平台，例如
    TensorFlow。


    鉴于这些挑战，寻求顾问的帮助可能是个好主意。他们不仅能帮助识别人工智能的机会，还能在数据准备和模型开发方面提供建议。


    由于人工智能试点项目具有实验性质，团队中应该有愿意承担风险且思想开放的人。否则，进展可能会极其困难。


    ## 合适的工具与平台


    有许多工具可以帮助创建人工智能模型，而且其中大部分是开源的。尽管尝试这些工具是好事，但仍建议先进行 IT 评估。这样做，你就能处于更有利的位置来评估人工智能工具。


    另外一点：你可能会发现你的公司已经在使用多种人工智能工具和平台！这可能会在人工智能项目的集成和流程管理方面引发问题。鉴于此，公司应该为这些工具制定一个策略。可以将其视为你的人工智能工具栈。


    那么，接下来让我们看看一些更常见的人工智能语言、平台和工具。


    ### Python 语言


    吉多·范罗苏姆于 1982 年在阿姆斯特丹大学获得数学和计算机科学硕士学位，之后他曾在欧洲多家研究机构工作，例如国家研究计划公司（CNRI）。但正是在 20
    世纪 80 年代末，他创建了自己的计算机语言，名为 Python。这个名字实际上来源于英国热门喜剧系列《蒙提·派森的飞行马戏团》。


    所以这种语言有点另类——但这正是它如此强大的原因。Python 很快成为了人工智能开发的标准。


    这在一定程度上归功于它的简洁性。只需几行脚本代码，你就可以创建复杂的模型，例如使用 filter、map 和 reduce 等函数。当然，这种语言也支持非常复杂的编码。


    范罗苏姆开发 Python 时遵循着清晰的哲学理念：^(¹⁸⁰)


    *   优美胜于丑陋。

    *   显式胜于隐式。

    *   简单胜于复杂。

    *   复杂胜于凌乱。

    *   扁平胜于嵌套。

    *   稀疏胜于稠密。


    这些只是其中的一部分原则。


    更重要的是，Python 在学术界得到了发展，而学术界能够访问互联网，这加速了它的传播。但这同时也使得一个拥有数千种不同人工智能包和库的全球生态系统得以出现。以下仅列举其中一部分：


    *   *NumPy*：用于科学计算应用。其核心是能够以高性能创建复杂的对象数组。这对于人工智能模型中的高端数据处理至关重要。

    *   *Matplotlib*：用于绘制数据集。Matplotlib 通常与 NumPy/Pandas（Pandas 指“Python 数据分析库”）结合使用。这个库使得为开发人工智能模型创建数据结构相对容易。

    *   *SimpleAI*：这是对斯图尔特·罗素和彼得·诺维格所著《人工智能：一种现代方法》一书中人工智能算法的实现。该库不仅功能丰富，还提供了有用的资源来指导整个过程。

    *   *PyBrain*：这是一个模块化的机器学习库，无需大量编码即可创建复杂的模型——如神经网络和强化学习系统。

    *   *Scikit-Learn*：该库于 2007 年推出，功能深厚，支持数据的回归、聚类和分类。


    Python 的另一个好处是学习资源丰富。在 YouTube 上快速搜索一下，就能找到成千上万的免费课程。


    当然，还有其他可靠的语言可用于人工智能开发，如 C++、C#和 Java。虽然它们通常比 Python 更强大，但也更复杂。此外，在构建模型时，通常很少需要创建完整的应用程序。最后，还有为高速人工智能机器（配备
    GPU）构建的 Python 库，例如 CUDA Python。

    '
- fmt: '### AI Frameworks


    There are a myriad of AI frameworks, which provide end-to-end systems to build
    models, train them, and deploy them. By far the most popular is `TensorFlow`,
    which is backed by Google. The company started development of this framework in
    2011, through its Google Brain division. The goal was to find a way to create
    neural networks faster so as to embed the technology across many Google applications.


    By 2015, Google decided to open source `TensorFlow`, primarily because the company
    wanted to accelerate the progress of AI. And no doubt, this is what happened.
    By open sourcing `TensorFlow`, Google made its technology an industry standard
    for development. The software has been downloaded over 41 million times, and there
    are more than 1,800 contributors. In fact, `TensorFlow Lite` (which is for embedded
    systems) is running on more than 2 billion mobile devices.^([^(181)](#fn181))


    The ubiquity of the platform has resulted in a large ecosystem. This means there
    are many add-ons like `TensorFlow Federated` (for decentralized data), `TensorFlow
    Privacy`, `TensorFlow Probability`, `TensorFlow Agents` (for reinforcement learning),
    and `Mesh TensorFlow` (for massive datasets).


    To use `TensorFlow`, you have the option of a variety of languages to create your
    models, such as Swift, JavaScript, and R. Although, for the most part, the most
    common one is Python.


    In terms of the basic structure, `TensorFlow` takes in input data as a multidimensional
    array, which is also known as a tensor. There is a flow to it, represented by
    a chart, as the data courses through the system.


    When you enter commands into `TensorFlow`, they are processed using a sophisticated
    C++ kernel. This allows for much higher performance, which can be essential as
    some models can be massive.


    `TensorFlow` can be used for just about anything when it comes to AI. Here are
    some of the models that it has powered:


    *   Researchers from NERSC (National Energy Research Scientific Computing Center)
    at the Lawrence Berkeley National Laboratory created a deep learning system to
    better predict extreme weather. It was the first such model that broke the expo
    (1 billion billion calculations) computing barrier. Because of this, the researchers
    won the Gordon Bell Prize.^([^(182)](#fn182))

    *   Airbnb used `TensorFlow` to build a model that categorized millions of listing
    photos, which increased the guest experience and led to higher conversions.^([^(183)](#fn183))

    *   Google used `TensorFlow` to analyze data from NASA’s Kepler space telescope.
    The result? By training a neural network, the model discovered two exoplanets.
    Google also made available the code to the public.^([^(184)](#fn184))


    Google has been working on `TensorFlow 2.0`, and a key focus is to make the API
    process simpler. There is also something called `Datasets`, which helps to streamline
    the preparation of data for AI models.


    Then what are some of the other AI frameworks? Let’s take a look:


    *   `PyTorch`: Facebook is the developer of this platform, which was released
    in 2016. Like `TensorFlow`, the main language to program the system is Python.
    While `PyTorch` is still in the early phases, it is already considered the runner-up
    to `TensorFlow` in terms of usage. So what is different with this platform? `PyTorch`
    has a more intuitive interface. The platform also allows for dynamic computation
    of graphs. This means you can easily make changes to your models in runtime, which
    helps speed up development. `PyTorch` also makes it possible for having different
    types of back-end CPUs and GPUs.

    *   `Keras`: Even though `TensorFlow` and `PyTorch` are for experienced AI experts,
    `Keras` is for beginners. With a small amount of code—in Python—you can create
    neural networks. In the documentation, it notes: “`Keras` is an API designed for
    human beings, not machines. It puts user experience front and center. `Keras`
    follows best practices for reducing cognitive load: it offers consistent and simple
    APIs, it minimizes the number of user actions required for common use cases, and
    it provides clear and actionable feedback upon user error.”^([^(185)](#fn185))
    There is a “Getting Started” guide that takes only 30 seconds! Yet the simplicity
    does not mean that it is not powerful. The fact is that you can create sophisticated
    models with `Keras`. For example, `TensorFlow` has integrated `Keras` on its own
    platform. Even for those who are pros at AI, the system can be quite useful for
    doing initial experimentations with models.


    With AI development, there is another common tool: `Jupyter Notebook`. It’s not
    a platform or development tool. Instead, `Jupyter Notebook` is a web app that
    makes it easy to code in Python and R to create visualizations and import AI systems.
    You can also easily share your work with other people, similar to what GitHub
    does.


    During the past few years, there has also emerged a new category of AI Tools called
    automated machine learning or `autoML`. These systems help to deal with processes
    like data prep and feature selection. For the most part, the goal is to provide
    help for those organizations that do not have experienced data scientists and
    AI engineers. This is all about the fast-growing trend of the “citizen data scientist”—that
    is, a person who does not have a strong technical background who can still create
    useful models.


    Some of the players in the `autoML` space include `H2O.ai`, `DataRobot`, and SaaS.
    The systems are intuitive and use drag-and-drop ease with the development of models.
    As should be no surprise, mega tech operators like Facebook and Google have created
    `autoML` systems for their own teams. In the case of Facebook, it has `Asimo`,
    which helps manage the training and testing of 300,000 models every month.^([^(186)](#fn186))


    For a use case of `autoML`, take a look at Lenovo Brazil. The company was having
    difficulty creating machine learning models to help predict and manage the supply
    chain. It had two people who coded 1,500 lines of R code each week—but this was
    not enough. The fact is that it would not be cost-effective to hire more data
    scientists.


    Hence the company implemented `DataRobot`. By automating various processes, Lenovo
    Brazil was able to create models with more variables, which led to better results.
    Within a few months, the number of users of `DataRobot` went from two to ten.


    Table [8-1](#480660_1_En_8_Chapter.xhtml#Tab1) shows some other results.^([^(187)](#fn187))


    **Table 8-1.** The results of implementing an `autoML` system


