  trans: '

    ## K-Means 聚类（无监督/聚类）


    K-Means 聚类算法对于大型数据集非常有效，它能够将相似的未标记数据归入不同的组别。第一步是选择 k，即簇的数量。为了帮助确定这个值，你可以对数据进行可视化，观察是否存在明显的分组区域。


    图 3-6 展示了一些示例数据：


    ![../images/480660_1_En_3_Chapter/480660_1_En_3_Fig6_HTML.jpg](img/480660_1_En_3_Fig6_HTML.jpg)


    图 3-6.


    数据集的初始绘图


    在这个例子中，我们假设会有两个簇，这意味着也会有两个质心。质心是一个簇的中点。我们将随机分配每个质心，如图 3-7 所示。


    ![../images/480660_1_En_3_Chapter/480660_1_En_3_Fig7_HTML.jpg](img/480660_1_En_3_Fig7_HTML.jpg)


    图 3-7.


    此图显示了两个随机放置的质心（用圆圈表示）


    如你所见，左上角的质心看起来偏差很大，但右侧的那个质心位置更好。然后，K-Means 算法会计算质心的平均距离，并改变它们的位置。这个过程会不断迭代，直到误差变得相当小——这个点被称为收敛，如图
    3-8 所示。


    ![../images/480660_1_En_3_Chapter/480660_1_En_3_Fig8_HTML.jpg](img/480660_1_En_3_Fig8_HTML.jpg)


    图 3-8.


    通过迭代，K-Means 算法在数据分组方面表现越来越好


    诚然，这是一个简单的示例。但当然，对于复杂的数据集，很难确定初始簇的数量。在这种情况下，你可以尝试不同的 k 值，然后测量平均距离。通过多次执行此操作，结果应该会更准确。


    那么，为什么不直接使用一个较大的 k 值呢？你当然可以这样做。但是，当你计算平均值时，你会发现只会带来微小的改进。因此，一种方法是在这种改进开始出现时就停止。如图
    3-9 所示。


    ![../images/480660_1_En_3_Chapter/480660_1_En_3_Fig9_HTML.jpg](img/480660_1_En_3_Fig9_HTML.jpg)


    图 3-9.


    此图显示了 K-Means 算法中 k 值的最优点


    然而，K-Means 也有其缺点。例如，它不适用于非球形数据，如图 3-10 所示的情况。


    ![../images/480660_1_En_3_Chapter/480660_1_En_3_Fig10_HTML.jpg](img/480660_1_En_3_Fig10_HTML.jpg)


    图 3-10.


    这里演示了 K-Means 不适用于非球形数据的情况


    在这种情况下，即使数据存在某种模式，K-Means 算法也可能无法识别出周围的数据。但有一些算法可以提供帮助，例如 DBScan（基于密度的含噪声应用空间聚类），它旨在处理大小差异很大的混合数据集。不过，DBScan
    可能需要大量的计算能力。


    接下来，还有一种情况是某些簇包含大量数据，而其他簇包含少量数据。可能会发生什么？K-Means 算法有可能无法识别出数据稀疏的簇。如图 3-11 所示的情况。


    ![../images/480660_1_En_3_Chapter/480660_1_En_3_Fig11_HTML.jpg](img/480660_1_En_3_Fig11_HTML.jpg)


    图 3-11.


    如果存在数据稀疏的区域，K-Means 算法可能无法识别它们


    ## 结论


    这些算法可能很复杂，并且确实需要扎实的技术技能。但重要的是不要过度陷入技术细节中。毕竟，重点是找到使用机器学习来实现明确目标的方法。


    再次强调，Stitch Fix 是获取这方面指导的一个好地方。在《哈佛商业评论》11 月刊中，该公司的首席算法官埃里克·科尔森发表了一篇文章，题为“好奇心驱动的数据科学”。^(⁵²)
    在文章中，他分享了自己在创建数据驱动型组织方面的经验。


    其核心是允许数据科学家探索新的想法、概念和方法。这导致了人工智能在业务核心功能中的实施，如库存管理、关系管理、物流和商品采购。这具有变革性，使组织更加敏捷和精简。科尔森还认为，这提供了“一道抵御竞争的屏障”。


    他的文章还为数据分析提供了其他有用的建议：


    *   *数据科学家*：他们不应隶属于其他部门。相反，他们应该拥有自己的部门，直接向 CEO 汇报。这有助于专注于关键优先事项，并全面了解组织的需求。


    *   *实验*：当数据科学家有新想法时，应该在一小部分客户样本上进行测试。如果效果良好，则可以推广到其余客户群体。


    *   *资源*：数据科学家需要完全访问数据和工具。还应该提供持续的培训。


    *   *通才*：招聘跨领域的数据科学家，如建模、机器学习和分析（科尔森称这些人为“全栈数据科学家”）。这有助于组建小型团队——这些团队通常更高效、更有生产力。


    *   *文化*：科尔森寻找的价值观包括“在实践中学习、适应模糊性、平衡长期与短期回报”。

    '
- fmt: '# Key Takeaways


    - Machine learning, whose roots go back to the 1950s, is where a computer can
    learn without being explicitly programmed. Rather, it will ingest and process
    data by using sophisticated statistical techniques.

    - An outlier is data that is far outside the rest of the numbers in the dataset.

    - The standard deviation measures the average distance from the mean.

    - The normal distribution—which has a shape like a bell—represents the sum of
    probabilities for a variable.

    - The Bayes’ theorem is a sophisticated statistical technique that provides a
    deeper look at probabilities.

    - A true positive is when a model makes a correct prediction. A false positive,
    on the other hand, is when a model prediction shows that the result is true even
    though it is not.

    - The Pearson correlation shows the strength of the relationship between two variables
    that range from 1 to -1.

    - Feature extraction or feature engineering describes the process of selecting
    variables for a model. This is critical since even one wrong variable can have
    a major impact on the results.

    - Training data is what is used to create the relationships in an algorithm. The
    test data, on the other hand, is used to evaluate the model.

    - Supervised learning uses labeled data to create a model, whereas unsupervised
    learning does not. There is also semi-supervised learning, which uses a mix of
    both approaches.

    - Reinforcement learning is a way to train a model by rewarding accurate predictions
    and punishing those that are not.

    - The k-Nearest Neighbor (k-NN) is an algorithm based on the notion that values
    that are close together are good predictors for a model.

    - Linear regression estimates the relationship between certain variables. The
    R-squared will indicate the strength of the relationship.

    - A decision tree is a model that is based on a workflow of yes/no decisions.

    - An ensemble model uses more than one model for the predictions.

    - The k-Means clustering algorithm puts similar unlabeled data into different
    groups.


