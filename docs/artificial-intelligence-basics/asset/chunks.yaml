    # 4. Deep Learning


    The Revolution in AI


    > *Take any old classification problem where you have a lot of data, and it’s
    going to be solved by deep learning. There’s going to be thousands of applications
    of deep learning.*

    >

    > —Geoffrey Hinton, English Canadian cognitive psychologist and computer scientist^([(53)](#fn53))


    Fei-Fei Li, who got a BA degree in physics from Princeton in 1999 with high honors
    and a PhD in electrical engineering from Caltech in 2005, focused her brilliance
    on developing AI models. But she had a major challenge: finding quality datasets.
    At first, she looked at creating them by hand, such as with graduate students
    who downloaded images from the Internet. But the process was too slow and tedious.


    One day a student mentioned to Li that Amazon.com’s Mechanical Turk, an online
    service that uses crowdsourcing to solve problems, could be a good way to scale
    the process. It would allow for fast and accurate labeling of the data.


    Li gave it a try, and it worked out quite well. By 2010, she had created ImageNet,
    which had 3.2 million images across over 5,200 categories.


    Yet it got a tepid response from the academic community. But this did not deter
    Li. She continued to work tirelessly to evangelize the dataset. In 2012, she put
    together a contest as a way to encourage researchers to create more effective
    models and push the boundaries of innovation. It would turn out to be a game changer,
    and the contest would become an annual event.


    In the first contest, professors from the University of Toronto—Geoffrey Hinton,
    Ilya Sutskever, and Alex Krizhevsky—used sophisticated deep learning algorithms.
    And the results were standout. The system they built, which was called AlexNet,
    beat all the other contestants by a margin of 10.8%.^([(54)](#fn54))


    This was no fluke. In the years after this, deep learning continued to show accelerated
    progress with ImageNet. As of now, the error rate for deep learning is a mere
    2% or so—which is better than humans.


    By the way, Li has since gone on to become a professor at Stanford and co-director
    of the school’s AI lab. She is also Google’s chief scientist of AI and Machine
    Learning. Needless to say, whenever she has new ideas now, people listen!


    In this chapter, we’ll take a look at deep learning, which is clearly the hottest
    area of AI. It has led to major advances in areas like self-driving cars and virtual
    assistants like Siri.


    Yes, deep learning can be a complicated subject, and the field is constantly changing.
    But we’ll take a look at the main concepts and trends—without getting into the
    technical details.


    ## Difference Between Deep Learning and Machine Learning


    There is often confusion between deep learning and machine learning. And this
    is reasonable. Both topics are quite complex, and they do share many similarities.


    So to understand the differences, let’s first take a look at two high-level aspects
    of machine learning and how they relate to deep learning. First of all, while
    both usually require large amounts of data, the types are generally different.


    Take the following example: Suppose we have photos of thousands of animals and
    want to create an algorithm to find the horses. Well, machine learning cannot
    analyze the photos themselves; instead, the data must be labeled. The machine
    learning algorithm will then be trained to recognize horses, through a process
    known as supervised learning (covered in Chapter [3](#480660_1_En_3_Chapter.xhtml)).


    Even though machine learning will likely come up with good results, they will
    still have limitations. Wouldn’t it be better to look at the pixels of the images
    themselves—and find the patterns? Definitely.


    But to do this with machine learning, you need to use a process called feature
    extraction. This means you must come up with the kinds of characteristics of a
    horse—such as the shape, the hooves, color, and height—which the algorithms will
    then try to identify.


    Again, this is a good approach—but it is far from perfect. What if your features
    are off the mark or do not account for outliers or exceptions? In such cases,
    the accuracy of the model will likely suffer. After all, there are many variations
    to a horse. Feature extraction also has the drawback of ignoring a large amount
    of the data. This can be exceedingly complicated—if not impossible—for certain
    use cases. Look at computer viruses. Their structures and patterns, which are
    known as signatures, are constantly changing so as to infiltrate systems. But
    with feature extraction, a person would somehow have to anticipate this, which
    is not practical. This is why cybersecurity software is often about collecting
    signatures after a virus has exacted damage.


    But with deep learning, we can solve these problems. This approach analyzes all
    the data—pixel by pixel—and then finds the relationships by using a neural network,
    which mimics the human brain.


    Let’s take a look.'
