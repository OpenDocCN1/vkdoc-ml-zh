- fmt: '### Use Case: Body Language


    Just focusing on language itself can be limiting. Body language is also something
    that should be included in a sophisticated AI model.


    This is something that Rana el Kaliouby has been thinking about for some time.
    While growing up in Egypt, she earned her master’s degree in science from the
    American University in Cairo and then went on to get her PhD in computer science
    at Newnham College of the University of Cambridge. But there was something that
    was very compelling to her: How can computers detect human emotions?


    However, in her academic circles, there was little interest. The consensus view
    in the computer science community was that this topic was really not useful.


    But Rana was undeterred and teamed up with noted professor Rosalind Picard to
    create innovative machine learning models (she wrote a pivotal book, called *Affective
    Computing*, which looked at emotions and machines).^([^(114)](#fn114)) Yet there
    also had to be the use of other domains like neuroscience and psychology. A big
    part of this was leveraging the pioneering work of Paul Ekman, who did extensive
    research on human emotions based on a person’s facial muscles. He found that there
    were six universal human emotions (wrath, grossness, scaredness, joy, loneliness,
    and shock) that could be coded by 46 movements called action units—all becoming
    a part of the Facial Action Coding System, or FACS.


    While at the MIT Media Lab, Rana developed an “emotional hearing aid,” which was
    a wearable that allowed those people with autism to better interact in social
    environments.^([^(115)](#fn115)) The system would detect the emotions of people
    and provide appropriate ways to react.


    It was groundbreaking as the *New York Times* named it as one of the most consequential
    innovations in 2006. But Rana’s system also caught the attention of Madison Avenue.
    Simply put, the technology could be an effective tool to gauge an audience’s mood
    about a television commercial.


    Then a couple years later, Rana launched Affectiva. The company quickly grew and
    attracted substantial amounts of venture capital (in all, it has raised $54.2
    million).


    Rana, who was once ignored, had now become one of the leaders in a trend called
    “emotion-tracking AI.”


    The flagship product for Affectiva is `Affdex`, which is a cloud-based platform
    for testing audiences for video. About a quarter of the Fortune Global 500 use
    it.


    But the company has developed another product, called `Affectiva Automotive AI`,
    which is an in-cabin sensing system for a vehicle. Some of the capabilities include
    the following:


    - Monitoring for driver fatigue or distraction, which will trigger an alert (say
    a vibration of the seat belt).

    - Providing for a handoff to a semi-autonomous system if the driver is not waking
    or is angry. There is even an ability to provide route alternatives to lessen
    the potential for road rage!

    - Personalizing the content—say music—based on the passenger’s emotions.


    For all of these offerings, there are advanced deep learning systems that process
    enormous amounts of features of a database that has more than 7.5 million faces.
    These models also account for cultural influences and demographic differences—which
    is all done in real-time.


    ## Voice Commerce


    NLP-driven technologies like virtual assistants, chatbots, and smart speakers
    are poised to have powerful business models—and may even disrupt markets like
    e-commerce and marketing. We have already seen an early version of this with Tencent’s
    WeChat franchise. The company, which was founded during the heyday of the Internet
    boom in the late 1990s, started with a simple PC-based messenger product called
    `OICQ`. But it was the introduction of WeChat that was a game changer, which has
    since become China’s largest social media platform with over 1 billion monthly
    active users.^([^(116)](#fn116))


    But this app is more than for exchanging messages and posting content. WeChat
    has quickly morphed into an all-purpose virtual assistant, where you can easily
    hail a ride-sharing service, make a payment at a local retailer, place a reservation
    for a flight, or play a game. For example, the app accounts for close to 35% of
    the entire usage time on smartphones in China on a monthly basis. WeChat is also
    a major reason that the country has become increasingly a cash-less society.


    All this points to the power of an emerging category called voice commerce (or
    v-commerce), where you can make purchases via chat or voice. It’s such a critical
    trend that Facebook’s Mark Zuckerberg wrote a blog post,^([^(117)](#fn117)) in
    early 2019, where he said the company would become more like…WeChat.


    According to research from Juniper, the market for voice commerce is forecasted
    to hit a whopping $80 billion by 2023.^([^(118)](#fn118)) But in terms of the
    winners in this market, it seems like a good bet that it will be those companies
    that have large install bases of smart devices like Amazon, Apple, and Google.
    But there will still be room for providers of next-generation NLP technologies.


    OK then, how might these AI systems impact the marketing industry? Well, to see
    how, there was an article in the *Harvard Business Review*, called “Marketing
    in the Age of Alexa” by Niraj Dawar and Neil Bendle. In it, the authors note that
    “AI assistants will transform how companies connect with their customers. They’ll
    become the primary channel through which people get information, goods and services,
    and marketing will turn into the batter for their attention.”^([^(119)](#fn119))


    Thus, the growth in chatbots, digital assistants, and smart speakers could be
    much bigger than the initial web-based e-commerce revolution. These technologies
    have significant benefits for customers, such as convenience. It’s easy to tell
    a device to buy something, and the machine will also learn about your habits.
    So the next time you say you want to have a soft drink, the computer will know
    what you are referring to.


    But this may lead to a winners-take-all scenario. Ultimately, it seems like consumers
    will use only one smart device for their shopping. In addition, for brands that
    want to sell their goods, there will be a need to deeply understand what customers
    really want, so as to become the preferred vendor within the recommendation engine.'
