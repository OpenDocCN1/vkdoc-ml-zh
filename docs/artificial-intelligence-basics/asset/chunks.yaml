- fmt: "# Key Takeaways\n\n- Structured data is labeled and formatted—and is often\
    \ stored in a relational database or spreadsheet.\n- Unstructured data is information\
    \ that has no predefined formatting.\n- Semi-structured data has some internal\
    \ tags that help with categorization.\n- Big Data describes a way to handle huge\
    \ amounts of volumes of information.\n- A relational database is based on relationships\
    \ of data. But this structure can prove difficult for modern-day applications,\
    \ such as AI.\n- A NoSQL database is more free-form, being based on a document\
    \ model. This has made it better able to deal with unstructured and semi-structured\
    \ data.\n- The CRISP-DM Process provides a way to manage data for a project, with\
    \ steps that include business understanding, data understanding, data preparation,\
    \ modelling, evaluation, and deployment.\n- Quantity of data is certainly important,\
    \ but there also needs to be much work on the quality. Even small errors can have\
    \ a huge impact on the results of an AI model.\n\nFootnotes [1](#480660_1_En_2_Chapter.xhtml#Fn1_source)\
