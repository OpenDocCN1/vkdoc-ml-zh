    real-life examples of innovation, like the following:


    *   *Stanford Cart*: Its development started in the early 1960s, and the original
    goal was to create a remote-controlled vehicle for moon missions. But the researchers
    eventually changed their focus and developed a basic autonomous vehicle, which
    used cameras and AI for navigation. While it was a standout achievement for the
    era, it was not practical as it required more than 10 minutes to plan for any
    move!


    *   *Ernst Dickmanns*: A brilliant German aerospace engineer, he would turn his
    attention to the idea of converting a Mercedes van into an autonomous vehicle…in
    the mid-1980s. He wired together cameras, sensors, and computers. He also was
    creative in how he used software, such as by only focusing the graphics processing
    on important visual details to save on power. By doing all this, he was able to
    develop a system that would control a car’s steering, gas pedal, and brakes. He
    tested the Mercedes on a Paris highway—in 1994—and it went over 600 miles, with
    a speed up to 81 MPH.^([^(194)](#fn194)) Nevertheless, the research funding was
    pulled because it was far from clear if there could be commercialization in a
    timely manner. It also did not help that AI was entering another winter.


    But the inflection point for autonomous cars came in 2004\. The main catalyst
