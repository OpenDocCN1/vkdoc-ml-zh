    at just some:


    *   The analysis of social media platforms can help track the outbreak of a disease.


    *   A nonprofit, called the Rainforest Connection, uses TensorFlow to create AI
    models—based on audio data—to locate illegal logging.


    *   Researchers have built a neural network that is trained on videos of poachers
    in Africa. With this, a drone flies over areas to detect violators, such as by
    using thermal infrared images.


    *   AI is being used to analyze data on 55,893 parcels in the city of Flint to
    find evidence of lead poisoning. The system relies primarily on a Bayesian model,
    which allows for more sophisticated predictions of toxicity. This means the health
    workers can more quickly take action if there are any problems in the city, potentially
    saving lives.


    ## Conclusion


    This topic is a good place to end this book, I think. Regardless of all the potential
    for harm and the adverse consequences, AI truly has the promise for being transformative
    for the world. And the good news is that there are many people who are focused
    on making this a reality. It’s not about making huge amounts of money or getting
    fame. The goal is to change the world.'
  trans: '

    ## 政府


    2019 年 4 月彭博社的一篇文章引起了轩然大波。文章描述了亚马逊如何管理其 Alexa 音箱 AI 系统的幕后情况。^(²¹⁹) 虽然其中大部分基于算法，但也有数千人分析语音片段以帮助改善结果。重点往往在于处理俚语和地区方言的细微差别，这对深度学习算法来说一直是个难题。


    但当然，人们自然会想：我的智能音箱真的在听我说话吗？我的对话是私密的吗？


    亚马逊迅速指出，它有严格的规定和要求。但即便如此，也引发了更多担忧！根据彭博社的文章，AI 审核员有时会听到涉及潜在犯罪活动（如性侵犯）的片段。但亚马逊显然有政策不进行干预。


    随着 AI 变得越来越普及，我们将会看到更多此类故事；而且在大多数情况下，不会有明确的答案。有些人可能最终决定不购买 AI 产品。但这可能只是一小部分人。嘿，即使
    Facebook 存在无数隐私问题，其用户增长也并未下降。


    更有可能的是，政府将开始介入 AI 问题。一群国会议员发起了一项名为《算法问责法案》的议案，旨在强制公司审计其 AI 系统（这将适用于收入超过 5000 万美元且用户超过
    100 万的大型公司）。^(²²⁰) 该法律如果颁布，将由联邦贸易委员会执行。


    各州和城市也有立法行动。2019 年，纽约市通过了其自己的法律，要求 AI 更加透明。^(²²¹) 华盛顿州、伊利诺伊州和马萨诸塞州也在努力。


    在所有这些活动中，一些公司开始主动采取行动，例如成立自己的伦理委员会。看看微软就知道了。该公司的伦理委员会名为 Aether（工程与研究中的 AI 与伦理），决定不允许在加利福尼亚州的交通拦截中使用其面部识别系统。^(²²²)


    与此同时，我们可能还会看到 AI 行动主义，即人们组织起来抗议某些应用程序的使用。亚马逊再次成为目标，其 Rekognition 软件使用面部识别来帮助执法部门识别嫌疑人。美国公民自由联盟对该系统的准确性表示担忧，尤其是在女性和少数族裔方面。在其一项实验中，它发现
    Rekognition 将 28 名国会议员识别为有犯罪前科！^(²²³) 至于亚马逊，它对这些说法提出了异议。


    Rekognition 只是执法领域引发争议的各种 AI 应用之一。也许最著名的例子是 COMPAS（替代制裁的矫正罪犯管理画像），它使用分析来评估某人可能犯罪的可能性。该系统常用于量刑。但大问题是：这是否会侵犯一个人获得正当程序的宪法权利，因为
    AI 确实存在不正确或歧视的风险？实际上，目前很少有好的答案。但鉴于 AI 算法将在我们的司法系统中发挥重要作用，最高法院很可能会制定新的法律。


    ## AGI（通用人工智能）


    在第 1 章中，我们了解了强 AI 和弱 AI 之间的区别。在大多数情况下，我们处于弱 AI 阶段，该技术用于狭窄的类别。


    至于强 AI，它关乎终极目标：机器与人类匹敌的能力。这也被称为通用人工智能或 AGI。实现这一目标可能还需要很多年，也许要到下个世纪甚至永远无法实现。


    但当然，也有一些杰出的研究人员相信 AGI 很快就会到来。其中一位是雷·库兹韦尔，他是一位发明家、未来学家、畅销书作家和谷歌工程总监。在 AI 方面，他在文本转语音系统等领域留下了自己的印记。


    库兹韦尔相信 AGI 将会实现——图灵测试将在 2019 年被破解——然后到 2045 年，将会出现奇点。届时我们将拥有一个混合人类的世界：半人半机器。


    有点疯狂？也许吧。但库兹韦尔确实有很多高调的追随者。


    但要实现 AGI，还有很多艰巨的工作要做。即使深度学习取得了巨大进步，它通常仍然需要大量数据和强大的计算能力。


    AGI 反而需要新的方法，例如使用无监督学习的能力。迁移学习也可能至关重要。例如，正如我们在本书前面所介绍的，AI 已经在围棋等游戏中实现了超人的能力。但迁移学习意味着该系统将能够利用这些知识来玩其他游戏或学习其他领域。


    此外，AGI 需要具备常识、抽象、好奇心和发现因果关系（而不仅仅是相关性）的能力。事实证明，这些能力在计算机上极其难以实现。如果有什么的话，那将需要在硬件和芯片技术上取得突破。这是世界顶级
    AI 研究员之一、Facebook 首席人工智能科学家扬·勒昆的观点。^(²²⁴) 他还认为，在电池和其他能源方面需要取得更多进展。


    另一个关键因素：AI 领域需要更多多样性。根据 AI Now 研究所的一份报告，约 80%的 AI 教授是男性；在 Facebook 和 Google 的
    AI 研究人员中，女性分别占 15%和 10%。^(²²⁵)


    这种不平衡意味着研究可能更容易受到偏见的影响。此外，还会失去更广泛观点和见解带来的好处。


    ## 社会公益


    管理咨询公司麦肯锡撰写了一份题为“应用人工智能促进社会公益”的广泛研究。^(²²⁶) 它展示了 AI 如何被用于应对贫困、自然灾害和改善教育等问题。该研究包含大约
    160 个用例。以下仅列举其中一些：


    *   对社交媒体平台的分析可以帮助追踪疾病的爆发。

    *   一个名为“雨林连接”的非营利组织使用 TensorFlow 创建基于音频数据的 AI 模型，以定位非法伐木。

    *   研究人员构建了一个神经网络，该网络使用非洲偷猎者的视频进行训练。借助此网络，无人机飞越区域以检测违规者，例如使用热红外图像。

    *   AI 被用于分析弗林特市 55,893 个地块的数据，以寻找铅中毒的证据。该系统主要依赖贝叶斯模型，该模型能够对毒性进行更复杂的预测。这意味着如果城市出现任何问题，卫生工作者可以更快地采取行动，从而可能挽救生命。


    ## 结论


    我认为，这个主题是结束本书的好地方。尽管存在各种潜在的危害和不利后果，但 AI 确实有改变世界的希望。好消息是，有很多人正专注于让这成为现实。这并非为了赚大钱或出名。目标是改变世界。

    '
- fmt: '# Key Takeaways


    - Autonomous cars are far from new. But the inflection point for the development
    of this technology came in 2004, with a contest sponsored by `DARPA`.

    - Some of the key components of an autonomous car include video cameras, `Lidar`
    (lasers that help process the environment), and sensors (such as for detecting
    other vehicles and obstacles like curbs).

    - In terms of defining what is “autonomous,” there are five levels. The fifth
    is when the vehicle is fully autonomous.

    - Some of the challenges for autonomous cars are infrastructure (existing highways
    are not ideal), regulation, costs, and consumer adoption.

    - The United States is considered the global leader in `AI`. But this could change
    soon. China is investing heavily in `AI` and has major advantages like enormous
    amounts of data and large numbers of skilled engineers.

    - One of the fears of `AI` is that it will lead to mass unemployment, whether
    for blue-collar or white-collar jobs. It’s true that technology has already impacted
    industries, like manufacturing, but the markets have proven adaptable. But if
    `AI` is transformative, it could lead to quite a bit of disruption. This is why
    there will likely be a need for training and re-skilling for new careers.

    - Drones have had a major impact on warfare. But with `AI`, it’s becoming possible
    to allow this technology to make the decisions on the battlefield. Now there are
    many people who see this as a big problem. However, the United States, Russia,
    and other countries appear to be focused on pursuing autonomous weapons.

    - But when it comes to warfare—at least in the near term—`AI` may have a more
    immediate effect with the spread of false information. We saw this with the Russian’s
    interference with the 2016 presidential election.

    - `AI` is expected to greatly help with the drug discovery process. Already mega
    pharma operators, like `Gilead`, are exploring the technology. `AI` can not only
    process huge amounts of data but also detect patterns that may not be discernable
    for humans.

    - As `AI` becomes more pervasive, there will be growing concerns about privacy
    and transparency. Because of this, there have been moves in the Congress, including
    cities and states, to impose regulations. It’s not clear what may transpire, but
    it seems likely we’ll see more restrictions. In the meantime, some companies are
    trying to be proactive, such as by setting up ethics boards.

    - `Artificial General Intelligence` or `AGI` is where a system has human intelligence.
    We are likely a long way from this, though. The reason is that there will need
    to be new innovations in `AI`, such as with unsupervised learning and the creation
    of new hardware.


