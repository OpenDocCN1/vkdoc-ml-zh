- fmt: '# Correlation


    A machine learning algorithm often involves some type of correlation among the
    data. A quantitative way to describe this is to use the Pearson correlation, which
    shows the strength of the relationship between two variables that range from 1
    to –1 (this is the coefficient).


    Here’s how it works:


    - **Greater than 0**: This is where an increase in one variable leads to the increase
    in another. For example: Suppose that there is a 0.9 correlation between income
    and spending. If income increases by $1,000, then spending will be up by $900
    ($1,000 X 0.9).

    - **0**: There is no correlation between the two variables.

    - **Less than 0**: Any increase in the variable means a decrease in another and
    vice versa. This describes an inverse relationship.


    Then what is a strong correlation? As a general rule of thumb, it’s if the coefficient
    is +0.7 or so. And if it is under 0.3, then the correlation is tenuous.


    All this harkens the old saying of “Correlation is not necessarily causation.”
    Yet when it comes to machine learning, this concept can easily be ignored and
    lead to misleading results.


    For example, there are many correlations that are just random. In fact, some can
    be downright comical. Check out the following from Tylervigen.com:^([^(43)](#fn43))


    - The divorce rate in Maine has a 99.26% correlation with per capita consumption
    of margarine.

    - The age of Miss America has an 87.01% correlation with the murders by steam,
    hot vapors, and hot tropics.

    - The US crude oil imports from Norway have a 95.4% correlation with drivers killed
    in collision with a railway train.


    There is a name for this: patternicity. This is the tendency to find patterns
    in meaningless noise.


    # Feature Extraction


    In Chapter [2](#480660_1_En_2_Chapter.xhtml), we looked at selecting the variables
    for a model. The process is often called feature extraction or feature engineering.


    An example of this would be a computer model that identifies a male or female
    from a photo. For humans, this is fairly easy and quick. It’s something that is
    intuitive. But if someone asked you to describe the differences, would you be
    able to? For most people, it would be a difficult task. However, if we want to
    build an effective machine learning model, we need to get feature extraction right—and
    this can be subjective.


    Table [3-1](#480660_1_En_3_Chapter.xhtml#Tab1) shows some ideas about how a man’s
    face may differ from a woman’s.


    **Table 3-1. Facial features**


    | Features | Male |

    | --- | --- |

    | Eyebrows | Thicker and straighter |

    | Face shape | Longer and larger, with more of a square shape |

    | Jawbone | Square, wider, and sharper |

    | Neck | Adam’s apple |


    This just scratches the surface as I’m sure you have your own ideas or approaches.
    And this is normal. But this is also why such things as facial recognition are
    highly complex and subject to error.


    Feature extraction also has some nuanced issues. One is the potential for bias.
    For example, do you have preconceptions of what a man or woman looks like? If
    so, this can result in models that give wrong results.


    Because of all this, it’s a good idea to have a group of experts who can determine
    the right features. And if the feature engineering proves too complex, then machine
    learning is probably not a good option.


    But there is another approach to consider: deep learning. This involves sophisticated
    models that find features in a data. Actually, this is one of the reasons that
    deep learning has been a major breakthrough in AI. We’ll learn more about this
    in the next chapter.


    # What Can You Do with Machine Learning?


    As machine learning has been around for decades, there have been many uses for
    this powerful technology. It also helps that there are clear benefits, in terms
    of cost savings, revenue opportunities, and risk monitoring.


    To give a sense of the myriad applications, here’s a look at some examples:


    - **Predictive Maintenance**: This monitors sensors to forecast when equipment
    may fail. This not only helps to reduce costs but also lessens downtime and boosts
    safety. In fact, companies like PrecisionHawk are actually using drones to collect
    data, which is much more efficient. The technology has proven quite effective
    for industries like energy, agriculture, and construction. Here’s what PrecisionHawk
    notes about its own drone-based predictive maintenance system: “One client tested
    the use of visual line of sight (VLOS) drones to inspect a cluster of 10 well
    pads in a three-mile radius. Our client determined that the use of drones reduced
    inspection costs by approximately 66%, from $80–$90 per well pad from traditional
    inspection methodology to $45–$60 per well pad using VLOS drone missions.”^([^(44)](#fn44))


    - **Recruiting Employees**: This can be a tedious process since many resumes are
    often varied. This means it is easy to pass over great candidates. But machine
    learning can help in a big way. Take a look at CareerBuilder, which has collected
    and analyzed more than 2.3 million jobs, 680 million unique profiles, 310 million
    unique resumes, 10 million job titles, 1.3 billion skills, and 2.5 million background
    checks to build Hello to Hire. It’s a platform that has leveraged machine learning
    to reduce the number of job applications—for a successful hire—to an average of
    75. The industry average, on the other hand, is about 150.^([^(45)](#fn45)) The
    system also automates the creation of job descriptions, which even takes into
    account nuances based on the industry and location!


    - **Customer Experience**: Nowadays, customers want a personalized experience.
    They have become accustomed to this by using services like Amazon.com and Uber.
    With machine learning, a company can leverage its data to gain insight—learning
    about what really works. This is so important that it led Kroger to buy a company
    in the space, called 84.51°. It is definitely key that it has data on more than
    60 million US households. Here’s a quick case study: For most of its stores, Kroger
    had bulk avocados, and only a few carried 4-packs. The conventional wisdom was
    that 4-packs had to be discounted because of the size disparity with the bulk
    items. But when applying machine learning analysis, this proved to be incorrect,
    as the 4-packs attracted new and different households like Millennials and ClickList
    shoppers. By expanding 4-packs across the chain, there was an overall increase
    in avocado sales.^([^(46)](#fn46))


    - **Finance**: Machine learning can detect discrepancies, say with billing. But
    there is a new category of technology, called RPA (Robotic Process Automation),
    that can help with this (we’ll cover this topic in Chapter [5](#480660_1_En_5_Chapter.xhtml)).
    It automates routine processes in order to help reduce errors. RPA also may use
    machine learning to detect abnormal or suspicious transactions.


    - **Customer Service**: The past few years has seen the growth in chatbots, which
    use machine learning to automate interactions with customers. We’ll cover this
    in Chapter [6](#480660_1_En_6_Chapter.xhtml).


    - **Dating**: Machine learning could help find your soul mate! Tinder, one of
    the largest dating apps, is using the technology to help improve the matches.
    For instance, it has a system that automatically labels more than 10 billion photos
    that are uploaded on a daily basis.


    Figure [3-2](#480660_1_En_3_Chapter.xhtml#Fig2) shows some of the applications
    for machine learning.


    ![../images/480660_1_En_3_Chapter/480660_1_En_3_Fig2_HTML.jpg](images/480660_1_En_3_Chapter/480660_1_En_3_Fig2_HTML.jpg)


    **Figure 3-2. Applications for machine learning**'
