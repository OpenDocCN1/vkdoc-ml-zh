- "# 5. 机器人流程自动化（RPA）\n\n通往人工智能的更便捷之路\n\n> *软件机器人通过像人类一样与应用程序交互，可以打开电子邮件附件、填写电子表格、记录和重新输入数据，并执行其他模仿人类行为的任务。*\n\
  > \n> ——AT&T 数字化转型与优化总监 Kaushik Iyengar^(⁹⁰)\n\n早在 2005 年，Daniel Dines 和 Marius\
  \ Tirca 在罗马尼亚布加勒斯特创立了 UiPath。公司主要专注于为 Google、Microsoft 和 IBM 的应用程序提供集成服务。但由于公司主要依赖为客户定制开发，经营举步维艰。\n\
  \n到 2013 年，UiPath 濒临倒闭。但创始人并未放弃，他们视此为重新思考业务、寻找新机遇的契机。^(⁹¹) 为此，他们开始构建一个机器人流程自动化（RPA）平台。这个自\
  \ 2000 年就已存在的技术类别，旨在实现公司内部常规和琐碎任务的自动化。\n\n然而，RPA 实际上是科技领域的一个边缘地带——其缓慢的增长率便可见一斑。但\
  \ Dines 和 Tirca 坚信他们能够改变这个行业。其中一个关键原因在于：人工智能和云计算的兴起。\n\n新战略精准无误，公司增长迅速。Dines 和 Tirca\
  \ 在寻求融资、创新 RPA 平台以及拓展全球市场方面也表现得非常积极。\n\n到 2018 年，UiPath 被认为是史上增长最快的企业软件公司。其年度经常性收入从\
  \ 100 万美元飙升至 1 亿美元，客户超过 1800 家。^(⁹²) 该公司拥有全球使用最广泛的 RPA 系统。\n\nUiPath 从 CapitalG、红杉资本和\
  \ Accel 等知名风投公司共获得了 4.48 亿美元的风险投资，估值达到 30 亿美元。\n\n有鉴于此，更多的 RPA 初创公司也获得了大量融资。此外，市场预计将迎来巨大增长。Grand\
  \ View Research 预测，到 2025 年，美国在该领域的支出将达到 39.7 亿美元。^(⁹³)\n\n有趣的是，Forrester 对 RPA\
  \ 趋势有如下评论：\n\n*   如今最成功的公司通常比过去的公司员工更少。想想看，柯达在 1973 年巅峰时期拥有 12 万名员工，而当 Facebook\
  \ 在 2012 年收购 Instagram 时，这个照片分享网站只有 13 名员工。我们预测，到 2019 年，每十家初创公司中就有一家——以更敏捷、更精简、更具可扩展性的方式运营——会以任务而非岗位的视角看待世界，并围绕自动化优先原则构建商业模式。^(⁹⁴)\n\
  \nRPA 是另一个因人工智能而得到极大增强的领域。可以说，它可能是许多公司的入门途径，因为实施通常不需要很长时间，也不需要高昂的成本。\n\n在本章中，我们将探讨\
  \ RPA，并了解它如何成为许多公司的关键驱动力。\n\n## 什么是 RPA？\n\n“机器人流程自动化”这个术语可能有点令人困惑。“机器人”一词并非指物理机器人（我们将在第\
  \ 7 章中讨论），而是指基于软件的机器人或程序。\n\nRPA 允许您使用低代码的可视化拖放系统来自动化某个流程的工作流。一些示例如下：\n\n*   输入、更改和跟踪人力资源（HR）文档、合同和员工信息\n\
  *   检测客户服务问题并采取措施解决问题\n*   处理保险索赔\n*   发送发票\n*   向客户退款\n*   核对财务记录\n*   将数据从一个系统传输到另一个系统\n\
  *   向客户提供标准回复\n\n所有这些都是通过让机器人复制某个应用程序（例如 ERP（企业资源规划）或 CRM（客户关系管理）系统）的工作流来完成的。这甚至可以通过\
  \ RPA 程序记录员工的步骤，或使用 OCR（光学字符识别）技术来翻译手写笔记来实现。可以将 RPA 视为数字员工。\n\n这类技术有两种类型：\n\n* \
  \  *无人值守 RPA*：这是一个完全自主的流程，机器人将在后台运行。但这并不意味着没有人工干预。在异常管理时仍需要干预。即当机器人遇到它无法理解的情况时。\n\
  \n*   *RDA（机器人桌面自动化）*：这是 RPA 帮助员工完成某项工作或任务的方式。一个常见的用例是联络中心。也就是说，当有电话进来时，客服人员可以使用\
  \ RDA 来帮助寻找答案、发送消息、调取客户资料信息，并获取下一步该做什么的见解。该技术有助于提高或增强员工的工作效率。\n\n\n\n## RPA 的优缺点\n\
  \n当然，对于典型的后台员工来说，相当多的时间都花在了日常任务上。但借助 RPA，公司通常可以获得可观的 ROI（投资回报率）——只要实施得当。\n\n以下是一些其他优势：\n\
  \n*   *客户满意度*：RPA 意味着极低的错误率和高速处理。机器人还能 7x24 小时工作。这意味着客户满意度评分——如 NPS（净推荐值）——应该会得到提升。请注意，越来越多的客户，例如千禧一代，更倾向于使用应用程序/网站，而不是与人打交道！RPA\
  \ 还意味着客服代表将有更多时间处理增值任务，而不是处理那些浪费时间的繁琐事务。\n\n*   *可扩展性*：一旦创建了机器人，就可以快速扩展以应对活动高峰。这对于零售商等季节性业务至关重要。\n\
  \n*   *合规性*：对于人类来说，要跟踪所有的规则、法规和法律是很困难的。更糟糕的是，它们还经常变化。但有了 RPA，合规性就被内置到了流程中——并且始终得到遵循。这在避免法律问题和罚款方面是一个主要优势。\n\
  \n*   *洞察与分析*：新一代 RPA 平台配备了复杂的仪表盘，专注于您业务的 KPI。如果出现任何问题，您还可以设置警报。\n\n*   *遗留系统*：老牌公司常常被旧的\
  \ IT 系统拖累，这使得实现数字化转型极其困难。但 RPA 软件能够与遗留 IT 环境相当良好地协同工作。\n\n*   *数据*：由于实现了自动化，数据输入错误极少，因此数据更加干净。这意味着，随着时间的推移，组织将对其业务有更准确的理解。数据质量也将提高\
  \ AI 实施成功的可能性。\n\n尽管这一切都很棒，但 RPA 仍然有其缺点。例如，如果您当前的流程效率低下，并且您急于实施 RPA 系统，那么您本质上是在复制一种糟糕的方法！这就是为什么在实施系统之前评估您的工作流程至关重要。\n\
  \n但当然还有其他潜在的“雷区”需要注意，例如：\n\n*   *脆弱性*：如果底层应用程序发生变化，RPA 很容易崩溃。如果流程和法规发生变化，情况也可能如此。诚然，较新的系统在适应变化方面做得更好，并且可能还会利用\
  \ API。但 RPA 并非完全无需人工干预的活动。\n\n*   *虚拟化应用*：这类软件，例如来自 Citrix 的软件，可能难以与 RPA 系统配合使用，因为它们无法有效捕获流程。原因在于数据存储在外部服务器上，输出的是显示器上的快照。但一些公司正在使用\
  \ AI 来解决这个问题，例如 UiPath。该公司创建了一个名为“实用 AI”的系统，该系统使用计算机视觉来解释屏幕快照以记录流程。\n\n*   *专业化*：许多\
  \ RPA 工具用于通用目的的活动。但可能存在需要专业化的领域，例如金融领域。在这种情况下，您可能需要寻找一个能够处理该领域的专业软件应用程序。\n\n*  \
  \ *测试*：这绝对至关重要。您应该首先抽样测试一些事务，以确保系统正常工作。之后，您可以更广泛地推广 RPA 系统。\n\n*   *所有权*：人们倾向于让\
  \ IT 部门拥有 RPA 的实施和管理权。但这可能并不可取。原因何在？RPA 系统技术含量相对较低。毕竟，非程序员也可以开发它们。因此，业务经理是拥有该流程的理想人选，因为他们通常能够处理技术问题，并且对员工工作流程有更牢固的把握。\n\
  \n*   *阻力*：变革总是困难的。对于 RPA，人们可能会担心该技术会取代工作岗位。这意味着您需要有一套清晰的信息，重点强调该技术的好处。例如，RPA 意味着有更多时间专注于重要事务，这应该会让一个人的工作更有趣、更有意义。\n\
  \n## 您对 RPA 有何期待？\n\n就 RPA 而言，该行业仍处于早期阶段。然而，有明显迹象表明，该技术正在为许多公司带来巨大改变。\n\n看看 Computer\
  \ Economics Technology 的研究报告，该报告涵盖了大约 250 家公司（它们跨越多个行业，收入从 2000 万美元到超过 10 亿美元不等）。在那些实施了\
  \ RPA 系统的公司中，大约有一半报告在部署后 18 个月内获得了正回报。这对于企业软件来说绝对是出类拔萃的，因为企业软件在获得采用方面可能具有挑战性。^(⁹⁵)\n\
  \n要了解这项技术的战略重要性，可以看看美国国防部——该部门参与了 500 多个 AI 项目——正在做什么。以下是该机构联合人工智能中心主任、空军中将杰克·沙纳汉在国会听证会上的发言：\n\
  \n*   当你谈论智能自动化，或者用行业术语来说，机器人流程自动化时，它在大型 AI 项目方面并不引人注目，但它可能是最能找到效率提升点的地方。如果你阅读一些行业日报，无论是医学还是金融领域，情况都是如此，这是\
  \ AI 早期成果正在实现的地方。我们在部门承担的其他一些项目，其投资回报可能需要数年时间才能实现。^(⁹⁶)\n\n尽管如此，仍然有许多失败的 RPA 实施案例。例如，安永会计师事务所因此获得了大量的咨询业务。根据这一经验，初始\
  \ RPA 项目的失败率在 30% 到 50% 之间。^(⁹⁷)\n\n但这对于任何类型的企业软件系统来说都是不可避免的。然而，到目前为止，问题似乎主要在于规划、策略和期望——而不是技术本身。\n\
  \n另一个问题是，围绕 RPA 的炒作可能将期望值提升到了过高的水平。这意味着，即使实施成功，失望情绪也会相当普遍！\n\n当然，技术并非万能药。它们需要投入大量的时间、精力和勤奋才能发挥作用。\n\
  \n## 如何实施 RPA\n\n那么，成功实施 RPA 需要采取哪些步骤呢？没有标准答案，但确实出现了一些最佳实践：\n\n*   确定要自动化的正确功能。\n\
  \n*   评估流程。\n\n*   选择 RPA 供应商并部署软件。\n\n*   建立一个团队来管理 RPA 平台。\n\n让我们更详细地看看每一步。\n\n\
  \n\n### 确定适合自动化的功能\n\n> *是的，特斯拉过度自动化是一个错误。准确地说，是我的错误。人类被低估了。*\n> \n> ——埃隆·马斯克，特斯拉首席执行官^(⁹⁸)\n\
  \n尽管 RPA 功能强大，能够为公司带来显著成效，但其能力仍然相当有限。这项技术本质上最适合自动化那些重复性、结构化且常规的流程。这包括日程安排、数据输入/传输、遵循规则/工作流、剪切粘贴、填写表单以及搜索等事务。这意味着\
  \ RPA 实际上可以在组织的几乎每个部门发挥作用。\n\n那么，这项技术通常在哪些方面无法奏效呢？嗯，如果某个流程需要独立判断，那么 RPA 可能就不太适用了。同样，当流程频繁变动时也是如此。在这种情况下，你可能会花费大量时间持续调整配置。\n\
  \n一旦你确定了业务中看起来适合应用该技术的部分，还有无数其他因素需要考虑。换句话说，如果你专注于以下几点，项目成功的可能性会更大：\n\n*   业务中表现严重不佳的领域\n\
  *   占用员工大量时间且错误率高的流程\n*   业务量增加时需要更多人手的任务\n*   你正在考虑外包的领域\n*   步骤繁多且涉及多种应用程序的流程\n\
  \n### 评估流程\n\n公司拥有许多未成文的流程是很常见的。这没问题。这种方法允许灵活性，而这正是人类所擅长的。\n\n然而，对于机器人来说，情况远非如此。要成功实施，你需要对流程进行深入评估。这实际上可能需要一些时间，并且请外部顾问来帮忙可能是明智之举。他们的优势在于更加中立，并且能更好地识别弱点。\n\
  \n一些 RPA 供应商确实拥有自己的工具来帮助分析流程——你应该充分利用这些工具。还有一些第三方软件提供商也有自己的产品。其中之一是 Celonis，它与 UiPath、Automation\
  \ Anywhere、Blue Prism 等 RPA 平台集成。该软件本质上执行一种数字 MRI，分析数据，提供关于你的流程实际运作方式的见解。它还会识别弱点和机会，例如增加收入、提高客户满意度和释放资源。\n\
  \n无论你采取何种方法，制定一个清晰的计划至关重要，该计划需要吸纳 IT 部门、高层管理人员以及受影响的部门的意见。同时，确保让数据分析人员参与进来，因为可能存在利用数据的机会。\n\
  \n### 选择 RPA 供应商并部署软件\n\n通过前两个步骤，你将处于一个非常有利的位置来评估不同的 RPA 系统。例如，如果你的主要目标是裁员，那么你会寻找专注于无人值守机器人的软件。或者，如果你想利用数据（例如用于\
  \ AI 应用），那么这将导向其他类型的 RPA 平台。\n\n然后，一旦你选定了一个，就可以开始部署。好消息是，这个过程可能相对较快，比如不到一个月。\n\n\
  但随着你继续开展更多的 RPA 项目，你可能会遇到所谓的“自动化疲劳”。这时，回报通常开始下降。\n\n可以这样理解：当你刚开始时，重点通常放在业务中最需要自动化的领域，这意味着投资回报率会很高。但随着时间的推移，重点会转向那些不太适合自动化的任务，即使要实现微小的改进，也可能需要付出更多的努力。\n\
  \n因此，在进行大规模的 RPA 转型时，适当降低期望值是个好主意。\n\n### 建立团队管理 RPA 平台\n\n仅仅因为 RPA 提供了高度的自动化，并不意味着它不需要管理。相反，最好的方法是组建一个团队，通常被称为卓越中心（CoE）。\n\
  \n为了充分利用 CoE，你需要明确每个人的职责。例如，你应该能够回答以下问题：\n\n*   如果机器人出现问题该怎么办？在哪些节点应该进行人工干预？\n*\
  \   谁负责监控 RPA？\n*   谁负责培训？\n*   谁将担任一线支持的角色？\n*   谁负责开发机器人？\n\n对于较大的组织，你可能还想扩展这些角色。你可以设立一个\
  \ RPA 倡导者，他将是整个公司该平台的布道者。或者可以有一个 RPA 变革经理，负责提供沟通以帮助推广采用。\n\n最后，随着 RPA 实施规模的扩大，一个关键目标应该是审视所有部分如何协同工作。像许多其他软件系统一样，存在跨组织蔓延的风险——这可能意味着无法获得更高的性能。这时，一个积极主动的\
  \ CoE 可以产生重大的积极影响。\n\n## RPA 与 AI\n\n尽管仍处于初期阶段，AI 已经在 RPA 工具方面取得了进展。这导致了认知机器人流程自动化（CRPA）软件机器人的出现。\n\
  \n这很合理。毕竟，RPA 是关于优化流程并涉及大量数据的。因此，供应商开始实施机器学习、深度学习、语音识别和自然语言处理等系统。CRPA 领域的一些领导者包括\
  \ UiPath、Automation Anywhere、Blue Prism、NICE Systems 和 Kryon Systems。\n\n例如，使用 Automation\
  \ Anywhere，机器人可以处理诸如从电子邮件中提取发票等任务，这涉及复杂的文本处理。该公司还拥有与第三方 AI 服务（如 IBM Watson、AWS Machine\
  \ Learning 和 Google Cloud AI）的预构建集成。^(⁹⁹)\n\n“近年来，AI 驱动的服务激增，但企业往往难以将其投入运营，”Automation\
  \ Anywhere 的产品营销总监 Mukund Srigopal 表示。“RPA 是将 AI 能力注入业务流程的绝佳方式。”^(¹⁰⁰)\n\n以下是 CRPA\
  \ 实现 AI 功能的其他一些方式：\n\n*   你可以将聊天机器人连接到你的系统，从而实现自动化客户服务（我们将在第 6 章中讨论这个主题）。\n*   AI\
  \ 可以找到发送电子邮件或警报的最佳时机。\n*   IVR（交互式语音应答）多年来名声不佳。简而言之，客户不喜欢为了解决问题而经历多个步骤的麻烦。但有了 CRPA，你可以使用称为动态\
  \ IVR 的技术。这为每位客户个性化语音消息，提供了更好的体验。\n*   NLP 和文本分析可以将非结构化数据转换为结构化数据。这可以使 CRPA 更加有效。\n\
  \n\n\n## 现实世界中的 RPA\n\n为了更好地理解 RPA 的工作原理及其优势，我们来看一个微软的案例研究。^(¹⁰¹) 每年，该公司向游戏开发者、合作伙伴和内容创作者支付数十亿美元的版税。然而，这个过程大部分是手动的，涉及发送数千份对账单——没错，这对公司来说非常耗时。\n\
  \n因此，微软选择了 Kyron 来实施 RPA。通过初步的流程审查，微软意识到 70% 到 80% 的对账单是直截了当的，可以轻松实现自动化。其余部分则包含需要人工干预的例外情况，例如审批。\n\
  \n借助 RPA 系统，一个视觉检测算法可以分类处理这些对账单并找出例外情况。系统的搭建也相当迅速，大约只用了 6 周时间。\n\n毫不意外，结果对流程产生了实质性影响。例如，一个机器人仅需\
  \ 2.5 小时就能完成 150 份版税对账单。相比之下，员工完成这项工作需要 50 小时。最重要的是：微软实现了 2000% 的成本节约。同时，也消除了因人为错误导致的任何返工（此前每月约有\
  \ 5% 的返工率）。\n\n## 结论\n\n从微软的案例研究中可以看出，RPA 可以带来巨大的成本节约。但仍然需要周密的规划，以便理解你的流程。在大多数情况下，重点应放在手动且重复的任务上——而不是那些严重依赖判断的任务。其次，建立一个卓越中心（CoE）来监督自动化的持续管理非常重要，这将有助于处理例外情况、收集数据和跟踪关键绩效指标（KPI）。\n\
  \nRPA 也是在组织内实施基础 AI 的好方法。实际上，由于可能带来显著的投资回报率（ROI），这可能会刺激对该技术的更多投资。\n\n## 关键要点\n\n\
  *   机器人流程自动化（RPA）允许你使用低代码的可视化拖放系统来自动化流程的工作流。\n\n*   无人值守 RPA 是指流程完全自动化。\n\n*   RDA（机器人桌面自动化）是指\
  \ RPA 帮助员工完成某项工作或任务。\n\n*   RPA 的一些优势包括：更高的客户满意度、更低的错误率、改进的合规性，以及更易于与遗留系统集成。\n\n\
  *   RPA 的一些缺点包括：难以适应底层应用程序的变化、虚拟化应用程序的问题以及员工的抵触情绪。\n\n*   RPA 最适用于自动化重复性、结构化和常规性的流程，例如日程安排、数据输入/传输以及遵循规则/工作流。\n\
  \n*   在实施 RPA 解决方案时，需要考虑的步骤包括：确定要自动化的功能、评估流程、选择 RPA 供应商并部署软件，以及建立一个团队来管理该平台。\n\n\
  *   卓越中心（CoE）是管理 RPA 实施的团队。\n\n*   认知机器人流程自动化（CRPA）是 RPA 的一个新兴类别，专注于 AI 技术。\n\n\
