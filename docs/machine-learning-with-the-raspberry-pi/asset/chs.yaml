  \n\n\n### 朴素贝叶斯\n\n朴素贝叶斯是一种适用于二分类（二元）和多分类问题的分类算法。该技术最适合处理二元或类别型输入值。\n\n它之所以被称为朴素贝叶斯，是因为对每个假设的概率计算被简化了，从而使其计算成为可能。该方法并非试图计算每个属性值\
  \ P(d1, d2|h) 的概率，而是假设它们在给定目标数据值的条件下是条件独立的，并计算为 P(d1|h) * P(d2|h)。\n\n这是一个非常强的假设，对于现实世界的数据来说很可能不成立。该假设基于一个前提，即类别属性之间不存在相互作用。尽管如此，这种方法在基本假设不成立的数据上似乎也表现良好。\n\
  \n在进入实际演示之前，我认为先回顾一些关于贝叶斯逻辑的基本原理是明智的。\n\n#### 贝叶斯定理简要回顾\n\n在分类问题中，一个假设 (h) 可以被视为要为每个新数据实例\
  \ (d) 分配的类别。在给定新数据的情况下，选择最可能假设的一种简单方法是利用关于该问题的任何先验知识。贝叶斯定理提供了一种在给定先验知识的情况下计算假设概率的方法。\n\
  \n贝叶斯定理表述如下：\n\nP(h|d) = (P(d|h) * P(h)) / P(d)\n\n其中：\n\n*   P(h|d) 是在给定数据 d 的情况下假设\
  \ h 的概率。这被称为后验概率。\n*   P(d|h) 是假设 h 为真时数据 d 的概率。\n*   P(h) 是假设 h 为真的概率（不考虑数据）。这被称为\
  \ h 的先验概率。\n*   P(d) 是数据的概率（不考虑假设）。\n\n显而易见，目标是从先验概率 P(h) 出发，结合 P(d) 和 P(d|h) 来计算后验概率\
  \ P(h|d)。\n\n在计算了多个不同假设的后验概率后，选择概率最高的假设。这个被选中的 h 就是最大可能假设，正式名称为最大后验概率（MAP）假设。它可以用几种形式表示：\n\
  \nMAP(h) = max(P(h|d))\n\n或\n\nMAP(h) = max((P(d|h) * P(h)) / P(d))\n\n或\n\nMAP(h)\
  \ = max(P(d|h) * P(h))\n\nP(d) 是一个归一化项，用于计算归一化概率。当只关心最可能的假设时，可以忽略它，因为该项是常数，仅用于归一化，这就引出了前面展示的最后一个\
  \ MAP 方程。\n\n如果训练数据中每个类别的实例分布相等，则可以进一步简化。在这种情况下，每个类别（P(h)）的概率将相等。这会导致 MAP 方程中又出现一个常数项，该项也可以被去掉，最终得到方程：\n\
  \nMAP(h) = max(P(d|h))\n\n#### 为朴素贝叶斯模型准备数据\n\n在应用朴素贝叶斯模型之前，需要计算类别概率和条件概率。顾名思义，类别概率是与训练集中每个类别相关的概率。条件概率是与给定类别下每个输入数据值相关的概率。\n\
  \n训练速度很快，因为只需要计算每个类别的概率以及给定不同输入值时每个类别的概率。与回归模型不同，这里不需要通过优化过程来拟合系数。\n\n类别概率就是属于每个类别的实例频率除以实例总数。\n\
  \n例如，在一个二分类问题中，实例属于类别 1 的概率计算如下：\n\nP(class1) = count(class1) / (count(class0) +\
  \ count(class1))\n\n在最简单的情况下，如果每个类别的实例数量相等，那么每个类别的概率将是 0.5 或 50%。\n\n条件概率是给定类别值下每个属性值的频率除以具有该类别值的实例频率。\n\
  \n接下来的这个例子应该有助于阐明朴素贝叶斯模型的工作原理。\n\n##### 朴素贝叶斯模型示例\n\n以下是一个关于天气的训练数据集以及相应的目标变量“Play”（表示玩耍的可能性）。\n\
  \n表 2-3 显示了天气状况和 Play 变量值的记录。\n\n表 2-3\n\n天气/Play 数据集\n\n| 天气 | Play |\n| --- |\
  \ --- |\n| 晴天 | 否 |\n| 阴天 | 是 |\n| 雨天 | 是 |\n| 晴天 | 是 |\n| 晴天 | 是 |\n| 阴天 | 是 |\n\
  | 雨天 | 否 |\n| 雨天 | 否 |\n| 晴天 | 是 |\n| 雨天 | 是 |\n| 晴天 | 否 |\n| 阴天 | 是 |\n| 阴天 | 是\
  \ |\n| 雨天 | 否 |\n\n第一步是将训练数据集转换为频率表，如表 2-4 所示。\n\n表 2-4\n\n频率表\n\n| 频率表 |\n| ---\
  \ |\n| 天气 | 否 | 是 |\n| 阴天 |   | 4 |\n| 雨天 | 3 | 2 |\n| 晴天 | 2 | 3 |\n| 总计 | 5 |\
  \ 9 |\n\n第二步是通过计算概率来创建似然表。例如，阴天的概率是 0.29，所有天气条件下总的玩耍概率是 0.64。表 2-5 显示了似然表。\n\n表\
  \ 2-5\n\n似然表\n\n| 似然表 |\n| --- |\n| **天气** | **否** | **是** |   | **天气概率** |\n| 阴天\
  \ |   | 4 | 4/14 | 0.29 |\n| 雨天 | 3 | 2 | 5/14 | 0.36 |\n| 晴天 | 2 | 3 | 5/14 | 0.36\
  \ |\n| 总计 | 5 | 9 |   |   |\n|   | 5/14 | 9/14 |   |   |\n| 玩耍概率 | 0.36 | 0.64 |\
  \   |   |\n\n下一步是使用朴素贝叶斯方程计算每个类别的后验概率。后验概率最高的类别即为预测结果。\n\n问题陈述：如果天气晴朗，玩家会玩耍。这个说法正确吗？\n\
  \n使用后验概率方法解决此问题。\n\n*   P(是 | 晴天) = P(晴天 | 是) * P(是) / P(晴天)\n\n代入实际概率得到：\n\n* \
  \  P(晴天 | 是) = 3/9 = 0.33\n*   P(晴天) = 5/14 = 0.36\n*   P(是) = 9/14 = 0.64\n\n因此：\n\
  \n*   P(是 | 晴天) = 0.33 * 0.64 / 0.36 = 0.60\n\n接下来计算另一个 Play 类别值“否”的后验概率。\n\n* \
  \  P(否 | 晴天) = P(晴天 | 否) * P(否) / P(晴天)\n\n代入实际概率得到：\n\n*   P(晴天 | 否) = 2/5 = 0.40\n\
  *   P(晴天) = 5/14 = 0.36\n*   P(否) = 5/14 = 0.36\n\n因此：\n\n*   P(否 | 晴天) = 0.40 *\
  \ 0.36 / 0.36 = 0.40\n\n概率 P(是 | 晴天) 高于 P(否 | 晴天)，因此是 MAP 或预测结果。请注意，你可以简单地从 1.0\
  \ 中减去 P(是 | 晴天) 来获得互补概率，这对于二元类别值总是成立的。然而，对于非二元类别值的情况，该操作并不成立。\n\n\n\n##### 优点与缺点\n\
  \n以下是使用朴素贝叶斯数据模型的一些优缺点。\n\n**优点：**\n\n*   从测试数据集预测类别值简单且快速。在多类别预测中表现同样出色。\n\n* \
  \  当独立性假设成立时，朴素贝叶斯分类器比逻辑回归等其他模型表现更好，且所需的训练数据更少。\n\n*   与数值型变量相比，它在处理类别型输入变量时表现更佳。对于数值型变量，通常假设其服从正态分布，这是一个较强的假设。\n\
  \n**缺点：**\n\n*   如果测试数据集中某个类别变量包含训练数据集中未出现过的类别，模型将赋予其 0 概率，从而无法进行预测。这种情况通常被称为“零频率”。常使用一种称为拉普拉斯估计的平滑技术来解决此问题。\n\
  \n*   朴素贝叶斯也被认为是一个较差的估计器，因此其概率输出可能不准确。\n\n*   朴素贝叶斯的另一个局限性是预测变量独立的假设。在现实世界中，几乎不可能得到一组完全独立的预测变量。\n\
  \n接下来将简要使用 scikit-learn 库在 Python 中构建一个朴素贝叶斯模型。scikit-learn 库提供了三种类型的朴素贝叶斯模型：\n\n\
  *   **高斯模型** – 用于分类，并假设特征服从正态分布。\n\n*   **多项式模型** – 用于离散计数。将文本分类问题视为一个伯努利试验，本质上是“统计一个词在文档中出现的频率”。可以理解为“在\
  \ n 次试验中观察到结果 x[i] 的次数”。\n\n*   **伯努利模型** – 当特征向量是二值（即 0 和 1）时，伯努利模型非常有用。一个应用场景是使用“词袋”模型进行文本分类，其中\
  \ 1 和 0 分别表示“词出现在文档中”和“词未出现在文档中”。\n\n你可以根据数据集选择上述任意一种模型。\n\n##### 高斯朴素贝叶斯\n\n朴素贝叶斯可以扩展到实值属性，最常见的方式是假设其服从高斯分布。这种扩展被称为高斯朴素贝叶斯。虽然可以使用其他函数来估计数据分布，但高斯分布（或正态分布）是最容易处理的，因为它只需要从训练数据中计算均值和标准差。\n\
  \n每个类别值对应的每个输入变量 (x) 的均值和标准差通过以下公式计算：\n\n*mean(x) = 1/n * sum(x)*\n\n*standard deviation(x)\
  \ = sqrt(1/n * sum(x*[*i*]*-mean(x)²))*\n\n其中\n\n*   n = 实例数量\n\n*   x = 输入变量的值\n\
  \n新 x 值的概率通过高斯概率密度函数 (PDF) 计算。在进行预测时，可以将这些参数与 x 变量的新输入一起代入高斯 PDF，该函数将给出该新输入值属于该类别的概率估计。\n\
  \n*pdf(x, mean, sd) = (1 / (sqrt(2 * PI) * sd)) * exp(-((x-mean²)/(2*sd²)))*\n\n\
  其中 pdf(x) 是高斯 PDF，sqrt() 是平方根，mean 和 sd 分别是均值和标准差，PI 是数学常数，exp() 是数学常数 e（欧拉数）的幂，x\
  \ 是输入变量的值。\n\n下面的演示使用了上述公式，但这些公式是软件包的内置组成部分，会被单独调用。\n\n##### 高斯朴素贝叶斯 (GNB) 演示\n\n\
  以下名为 gnbTest.py 的 Python 脚本使用了 scikit-learn 软件包中的 GNB 模型。脚本中包含一个最小的训练数据集，用于让模型“学习”并进行预测。该数据集可以是完全任意的，也可以根据数据是否经过编码来代表实际的现实世界属性。无论如何，由于该预测器仅基于数值数据，它都能正常运行。最终结果的解码始终是用户的责任。此脚本可从本书的配套网站获取：\n\
  \n```\n# 导入高斯朴素贝叶斯模型库\nfrom sklearn.naive_bayes import GaussianNB\nimport numpy\
  \ as np\n# 分配预测变量和目标变量\nx= np.array([[-3,7],[1,5], [1,2], [-2,0], [2,3], [-4,0],\
  \ [-1,1], [1,1], [-2,2], [2,7], [-4,1], [-2,7]])\ny = np.array([3, 3, 3, 3, 4, 3,\
  \ 3, 4, 3, 4, 4, 4])\n# 创建一个高斯分类器\nmodel = GaussianNB()\n# 使用训练集训练模型\nmodel.fit(x,\
  \ y)\n# 预测输出\npredicted= model.predict([[1,2],[3,4]])\nprint(predicted)\n```\n\n\
  通过输入以下命令运行脚本：\n\n```\npython gnbTest.py\n```\n\n图 2-21 显示了运行此脚本的结果。\n\n![../images/482214_1_En_2_Chapter/482214_1_En_2_Fig21_HTML.jpg](img/482214_1_En_2_Fig21_HTML.jpg)\n\
  \n图 2-21\n\ngnbTest 脚本的结果\n\n最终结果显示预测值为 [3 4]。正如我之前提到的，这在现实世界中意味着什么，取决于数据集最初是如何编码的。\n\
  \n## k-近邻 (k-NN) 模型\n\n我在前一章的鸢尾花演示（第 3 部分）中介绍了 k-NN 模型。但当时我没有提到使用该模型的两个主要缺点。如果这两个问题都不存在，那么\
  \ k-NN 模型绝对值得考虑使用，因为它是一个简单且稳健的分类器。\n\n第一个问题是性能问题。由于它是一个懒惰模型，必须加载所有训练数据，并用于计算与所有训练样本的欧几里得距离。这可以通过朴素的方式完成，也可以使用更复杂的数据结构（如\
  \ k-d 树）。无论如何，当涉及大型训练集时，这可能会对性能造成很大影响。\n\n第二个问题是距离度量。基本的 k-NN 模型使用欧几里得距离，当涉及高维数据时，这是一个有问题的距离度量。随着维度的增加，由于距离度量在数据维度显著增加时变得毫无意义，算法的性能会变差。另一个相关的问题是遇到噪声特征时。这个问题之所以发生，是因为模型对所有特征（无论是否为噪声）都应用相同的权重。此外，所有特征（无论其类型是类别型、数值型还是二值型）都被赋予相同的权重。\n\
  \n总之，如果一个系统需要用少量样本和维度来学习复杂的（即非线性的）模式，k-NN 模型通常是最佳选择。\n\n### KNN 演示\n\n本演示将使用加州大学欧文分校数据库中的汽车数据集。所需的两个\
  \ CSV 数据文件以及 kNN.py 类文件可以从以下地址下载：\n\n`https://github.com/amallia/kNN`\n\n\n\n###\
  \ 注意\n\n本网站还提供了一个 Jupyter notebook 文件。该文件不会被使用，因为我在下面提供了一个 Python 脚本，它实现了与 notebook\
  \ 文件相同的功能。\n\n问题陈述是：根据汽车的排量和马力，预测其每加仑英里数（mpg）。数据集中的每条记录对应一辆汽车。\n\nkNN 类文件如下所示，其中包含初始化、计算和预测函数。该脚本名为\
  \ `kNN.py`，可从所列网站或本书的配套网站获取。我在脚本清单中添加了注释，以说明正在执行的功能。\n\n```\n#!/usr/bin/env python\n\
  import math\nimport operator\nclass kNN(object):\n# 初始化\ndef __init__(self, x, y,\
  \ k, weighted=False):\nassert (k <= len(x)\n), \"k 不能大于训练集长度\"\nself.__x = x\nself.__y\
  \ = y\nself.__k = k\nself.__weighted = weighted\n# 计算欧几里得距离\n@staticmethod\ndef\
  \ __euclidean_distance(x1, y1, x2, y2):\nreturn math.sqrt((x1 - x2)**2 + (y1 - y2)**2)\n\
  # 计算概率密度函数\n@staticmethod\ndef gaussian(dist, sigma=1):\nreturn 1./(math.sqrt(2.*math.pi)*sigma)*math.exp(-dist**2/(2*sigma**2))\n\
  # 执行预测\ndef predict(self, test_set):\npredictions = []\nfor i, j in test_set.values:\n\
  distances = []\nfor idx, (l, m) in enumerate(self.__x.values):\ndist = self.__euclidean_distance(i,\
  \ j, l, m)\ndistances.append((self.__y[idx], dist))\ndistances.sort(key=operator.itemgetter(1))\n\
  v = 0\ntotal_weight = 0\nfor i in range(self.__k):\nweight = self.gaussian(distances[i][1])\n\
  if self.__weighted:\nv += distances[i][0]*weight\nelse:\nv += distances[i][0]\n\
  total_weight += weight\nif self.__weighted:\npredictions.append(v/total_weight)\n\
  else:\npredictions.append(v/self.__k)\nreturn predictions\n```\n\n以下脚本名为 `knnTest.py`，其中从\
  \ kNN 类文件实例化了一个 k-NN 模型。针对 k = 1、3 和 20 的情况，分别对非加权和加权情况进行了系列预测。计算了所有情况下的结果误差。此脚本可从本书的配套网站获取：\n\
  \n```\n# 导入所需库\nimport pandas\nfrom kNN import kNN\nfrom sklearn.metrics import\
  \ mean_squared_error\n# 读取训练 CSV 文件\ntraining_data = pandas.read_csv(\"auto_train.csv\"\
  )\nx = training_data.iloc[:,:-1]\ny = training_data.iloc[:,-1]\n# 读取测试 CSV 文件\n\
  test_data = pandas.read_csv(\"auto_test.csv\")\nx_test = test_data.iloc[:,:-1]\n\
  y_test = test_data.iloc[:,-1]\n# 显示每个 CSV 文件的前几行\nprint('训练数据')\nprint(training_data.head())\n\
  print('测试数据')\nprint(test_data.head())\n# 计算 k = 1, 3, 20 且无加权时的误差\nfor k in [1,\
  \ 3, 20]:\nclassifier = kNN(x,y,k)\npred_test = classifier.predict(x_test)\ntest_error\
  \ = mean_squared_error(y_test, pred_test)\nprint('k={} 时的测试误差: {}'.format(k, test_error\
  \ * len(y_test)/2))\n# 计算 k = 1, 3, 20 且有加权时的误差\nfor k in [1, 3, 20]:\nclassifier\
  \ = kNN(x,y,k,weighted=True)\npred_test = classifier.predict(x_test)\ntest_error\
  \ = mean_squared_error(y_test, pred_test)\nprint('k={} 时的测试误差: {}'.format(k, test_error\
  \ * len(y_test)/2))\n```\n\n通过输入以下命令运行脚本：\n\n```\npython knnTest.py\n```\n\n图 2-22\
  \ 显示了运行此脚本的结果。\n\n![../images/482214_1_En_2_Chapter/482214_1_En_2_Fig22_HTML.jpg](img/482214_1_En_2_Fig22_HTML.jpg)\n\
  \n图 2-22\n\nknnTest 脚本的结果\n\n此图显示了每个 CSV 数据文件的前五条记录。接下来的三个测试误差结果分别是 k 等于 1、3 和 20\
  \ 时的非加权预测结果。最后三个测试误差结果是相同 k 值下的加权预测结果。查看误差结果可以发现，随着 k 的增加，误差值略有减小，并且在应用加权的情况下，误差值甚至略低。\n\
  \n## 决策树分类器\n\n这将是本章讨论的最后一个数据模型。决策树分类器数据模型是解决常见业务问题的一种巧妙方案。例如，如果您是银行贷款经理，您可以使用此模型根据客户的财务和信用记录，将其分类为安全或风险类别。分类通常分两步完成，第一步是学习，第二步是预测。学习步骤中的模型仅基于可用的训练数据进行开发和调优。然后，使用训练好的数据以及根据调优和用户经验输入的任何适当超参数，利用该模型预测未来结果。\n\
  \n### 决策树算法\n\n决策树是一种类似流程图的树状结构，其中内部节点代表一个特征或属性，分支代表一个决策规则，每个叶节点代表一个结果。根节点是决策树中最顶层的节点。该模型学习如何根据属性值进行划分。树以递归方式进行划分，这种划分方式自然被称为递归划分。这种类似流程图的结构合理地类比了人类进行决策的过程。使用流程图来可视化此过程将有助于您理解此模型。图\
  \ 2-23 显示了一个通用决策树的部分结构。\n\n![../images/482214_1_En_2_Chapter/482214_1_En_2_Fig23_HTML.jpg](img/482214_1_En_2_Fig23_HTML.jpg)\n\
  \n图 2-23\n\n决策树的通用流程图\n\n决策树算法的一个良好特性是其决策逻辑易于理解。该模型被称为白盒机器学习算法。将此开放性对比于黑盒模型，后者是人工神经网络（ANN）的典型特征，其任何决策逻辑通常都难以理解。此外，决策树算法的训练时间通常远快于\
  \ ANN。决策树算法不依赖于任何特定类型的训练数据概率分布，这使其成为一种非参数方法。因此，决策树算法能够以良好的精度处理高维数据。\n\n决策树算法遵循以下简单的三步流程：\n\
  \n1.  使用属性选择度量（ASM）选择最佳属性来分割记录。\n\n2.  将该属性设为决策节点，并将数据集拆分为更小的子集。\n\n3.  通过为每个子节点递归重复此过程来开始构建树，直到满足*以下*条件之一：\n\
  \    *   所有元组都属于同一个属性值。\n\n    *   没有更多剩余属性。\n\n    *   没有更多实例。\n\nASM 是一种启发式方法，用于选择以最优方式划分数据的分割标准。ASM\
  \ 也称为分割规则，因为它有助于确定给定节点上元组的分割点。ASM 通过解释给定的数据集，为每个特征或属性提供排名。然后，得分最高的属性将被选为分割属性。对于连续值属性，还需要定义分支分割点。\n\
  \n以下补充内容详细讨论了信息熵、信息增益、基尼系数和增益比。虽然这不是运行决策树演示的先决条件，但我建议您花时间阅读一下。它肯定会加深您对该算法工作原理的理解。\n\
  \n\n\n#### 信息增益\n\n信息增益衡量一个特征为我们提供关于某个类别的“信息”量。任何能够完美划分的特征都应提供最大信息。同样，不相关的特征应不提供任何信息。信息增益衡量的是熵的减少，而熵是衡量任意样本集合中纯度或不纯度的指标。一个更正式的熵定义是：\n\
  \n> *数据*[*随机源*](https://en.wikipedia.org/wiki/Stochastic)*产生*[*信息*](https://en.wikipedia.org/wiki/Information)*的*[*平均*](https://en.wikipedia.org/wiki/Expected_value)*速率。*\n\
  \n与每个可能数据值相关的信息熵度量，是通过该值的[概率质量函数](https://en.wikipedia.org/wiki/Probability_mass_function)的负[对数](https://en.wikipedia.org/wiki/Logarithm)来计算的。\n\
  \n在深入探讨细节之前，先回顾一下信息增益背后的一些基本原理是明智的。\n\n##### 分裂准则\n\n假设我们希望根据变量 (\U0001D465) 进行分裂：\n\
  \n*   1 2 3 4 5 6 7 8\n\n*   y 0 0 0 1 1 1 1 1\n\n如果我们在 \U0001D4651 < 3.5 处分裂，会得到一个最优分裂。如果在\
  \ \U0001D465 < 4.5 处分裂，则会产生错误或误分类。其思想是将分裂点定位在能使样本变得“纯净”或同质的位置。当然，我们需要衡量分裂的效果，这可以通过信息增益、增益率或基尼指数等\
  \ ASM 来实现。上述所有讨论都基于如何衡量信息。实现这一点完全依赖于信息熵的概念，该概念由克劳德·香农在其 1948 年具有里程碑意义的论文《通信的数学理论》中提出。顺便提一下，香农博士因其在该领域的巨大贡献而被誉为“信息论之父”。\n\
  \n##### 衡量信息\n\n将图 2-24 中所示的条形图视为一个信息源，其中区域被数字编码。\n\n![../images/482214_1_En_2_Chapter/482214_1_En_2_Fig24_HTML.jpg](img/482214_1_En_2_Fig24_HTML.jpg)\n\
  \n图 2-24\n\n数字编码的信息源\n\n图中较大的区域用较少的比特编码，而较小的区域则需要更多的比特。该信息源的期望值是所有值的概率与该值本身乘积的总和。在此示例中，期望值计算如下：\n\
  \n![$$ Expected\\ Value=\\frac{1}{4}\\ast 2+\\frac{1}{8}\\ast 3+\\frac{1}{8}\\ast\
  \ 3+\\frac{1}{2}\\ast 1 $$](img/482214_1_En_2_Chapter_TeX_Equj.png)\n\n每当图中区域的大小减半时，比特数就增加一。当大小减半时，概率也减少\
  \ 0.5。从该图可以得出的结论是，随机事件 *x* 的信息量与该事件概率倒数的对数（以 2 为底）成正比。用公式表示即为：\n\n![$$ Information(x)={\\\
  mathit{\\log}}_2\\left(\\frac{1}{P\\left(D=x\\right)}\\right) $$](img/482214_1_En_2_Chapter_TeX_Equk.png)\n\
  \n通常，随机变量的期望信息或“熵”与期望值相同，只是将值替换为信息：\n\n![$$ Entropy\\ of\\ D=\\sum \\limits_xP\\\
  left(D=x\\right)\\ast Information(x) $$](img/482214_1_En_2_Chapter_TeX_Equl.png)\n\
  \n![$$ =\\sum \\limits_xP\\left(D=x\\right)\\ast {\\mathit{\\log}}_2\\left(\\frac{1}{P\\\
  left(D=x\\right)}\\right) $$](img/482214_1_En_2_Chapter_TeX_Equm.png)\n\n![$$ =-\\\
  sum \\limits_xP\\left(D=x\\right)\\ast {\\mathit{\\log}}_2\\Big(P\\left(D=x\\right)\
  \ $$](img/482214_1_En_2_Chapter_TeX_Equn.png)\n\n##### 熵的性质\n\n当组成元素异质（不纯）时，熵最大：如果 \n\
  \n![$$ {p}_k=\\frac{1}{k} $$](img/482214_1_En_2_Chapter_TeX_Equ1.png)\n\n那么，\n\n\
  ![$$ Entropy=H=-K\\ast \\frac{1}{k}\\ast {\\mathit{\\log}}_2\\left(\\frac{1}{k}\\\
  right)={\\mathit{\\log}}_2(K) $$](img/482214_1_En_2_Chapter_TeX_Equo.png)\n\n相反，当元素同质（纯净）时，熵最小：\n\
  \n如果 *p*[*i*] = 1 或 *p*[*i*] = 0\n\n那么，\n\n![$$ Entropy=H=0 $$](img/482214_1_En_2_Chapter_TeX_Equp.png)\n\
  \n将熵定义为\n\n![$$ H=-\\sum \\limits_{i=1}^K{p}_k\\ast {\\mathit{\\log}}_2\\left({p}_k\\\
  right) $$](img/482214_1_En_2_Chapter_TeX_Equq.png)\n\n那么，熵的任何变化都被视为信息增益，并定义为\n\n\
  ![$$ \\Delta H=H-\\frac{m_L}{m}\\ast {H}_L-\\frac{m_D}{m}\\ast {H}_D $$](img/482214_1_En_2_Chapter_TeX_Equr.png)\n\
  \n其中 \U0001D45A 是实例总数，\U0001D45A[\U0001D458] 是属于类别 \U0001D458 的实例数，\U0001D43E =\
  \ 1, … , \U0001D458。\n\n\n\n##### 信息增益示例\n\n以下示例可视为朴素贝叶斯章节中示例的扩展。表 2-6 增加了若干特征，这些特征将用于计算在给定条件下是否进行活动的决策。\n\
  \n表 2-6\n\n活动决策\n\n| 天气 | 温度 | 湿度 | 有风 | 活动 |\n| --- | --- | --- | --- | --- |\n\
  | 晴 | 热 | 高 | 否 | 否 |\n| 晴 | 热 | 高 | 是 | 否 |\n| 阴 | 热 | 高 | 否 | 是 |\n| 雨 | 温和 |\
  \ 高 | 否 | 是 |\n| 雨 | 凉爽 | 正常 | 否 | 是 |\n| 雨 | 凉爽 | 正常 | 是 | 否 |\n| 阴 | 凉爽 | 正常 |\
  \ 是 | 是 |\n| 晴 | 温和 | 高 | 否 | 否 |\n| 晴 | 凉爽 | 正常 | 否 | 是 |\n| 雨 | 温和 | 正常 | 否 |\
  \ 是 |\n| 晴 | 温和 | 正常 | 是 | 是 |\n| 阴 | 温和 | 高 | 是 | 是 |\n| 阴 | 热 | 正常 | 否 | 是 |\n\
  | 雨 | 温和 | 高 | 是 | 否 |\n\n活动属性的信息值计算如下：\n\n![$$ H(Y)=-\\sum \\limits_{i=1}^K{p}_k\\\
  ast {\\mathit{\\log}}_2\\left({p}_k\\right) $$](img/482214_1_En_2_Chapter_TeX_Equs.png)\n\
  \n![$$ =-\\frac{5}{14}{\\mathit{\\log}}_2\\left(\\frac{5}{14}\\right)-\\frac{9}{14}{\\\
  mathit{\\log}}_2\\left(\\frac{9}{14}\\right) $$](img/482214_1_En_2_Chapter_TeX_Equt.png)\n\
  \n![$$ =-(0.357)\\ast \\left(-1.486\\right)-(0.643)\\ast \\left(-0.637\\right) $$](img/482214_1_En_2_Chapter_TeX_Equu.png)\n\
  \n![$$ =0.531+0.410 $$](img/482214_1_En_2_Chapter_TeX_Equv.png)\n\n![$$ =0.941 $$](img/482214_1_En_2_Chapter_TeX_Equw.png)\n\
  \n现在，考虑选择湿度属性时的信息增益。\n\n![$$ InfoGain(Humdity)=H(Y)-\\frac{m_L}{m}{H}_L-\\frac{m_R}{m}{H}_R\
  \ $$](img/482214_1_En_2_Chapter_TeX_Equx.png)\n\n其中\n\n*   *m* = 湿度样本数量\n*   *m*[*L*]\
  \ = 湿度值为“正常”的样本数量\n*   *m*[*R*] = 湿度值为“高”的样本数量\n*   *H*[*L*] = 湿度值为“正常”的样本的信息值\n\
  *   *H*[*R*] = 湿度值为“高”的样本的信息值\n\n代入后得到\n\n![$$ InfoGain(Humdity)=H(Y)=0.941-\\frac{7}{14}{H}_L-\\\
  frac{7}{14}{H}_R $$](img/482214_1_En_2_Chapter_TeX_Equy.png)\n\n![$$ {H}_L=-\\frac{6}{7}{\\\
  mathit{\\log}}_2\\left(\\frac{6}{7}\\right)-\\frac{1}{7}{\\mathit{\\log}}_2\\left(\\\
  frac{1}{7}\\right) $$](img/482214_1_En_2_Chapter_TeX_Equz.png)\n\n![$$ {H}_L=0.592\
  \ $$](img/482214_1_En_2_Chapter_TeX_Equaa.png)\n\n![$$ {H}_R=-\\frac{3}{7}{\\mathit{\\\
  log}}_2\\left(\\frac{6}{7}\\right)-\\frac{4}{7}{\\mathit{\\log}}_2\\left(\\frac{4}{7}\\\
  right) $$](img/482214_1_En_2_Chapter_TeX_Equab.png)\n\n![$$ {H}_R=0.985 $$](img/482214_1_En_2_Chapter_TeX_Equac.png)\n\
  \n![$$ H(Y)=0.941-\\frac{7}{14}\\ast 0.592-\\frac{7}{14}\\ast 0.985 $$](img/482214_1_En_2_Chapter_TeX_Equad.png)\n\
  \n![$$ H(Y)=0.152 $$](img/482214_1_En_2_Chapter_TeX_Equae.png)\n\n对剩余所有特征执行上述计算，得到：\n\
  \n*   天气 = 0.247\n*   温度 = 0.029\n*   湿度 = 0.152\n*   有风 = 0.048\n\n初始分裂将使用天气特征，因为根据属性选择度量（ASM）过程，它具有最高的信息增益值。\n\
  \n下一层的最优分裂如图 2-25 所示，图中附带了每次分裂所选的属性及其信息增益。\n\n![../images/482214_1_En_2_Chapter/482214_1_En_2_Fig25_HTML.jpg](img/482214_1_En_2_Fig25_HTML.jpg)\n\
  \n图 2-25\n\n带有信息增益值的下一层分裂\n\n图 2-26 是最终的决策树。\n\n![../images/482214_1_En_2_Chapter/482214_1_En_2_Fig26_HTML.jpg](img/482214_1_En_2_Fig26_HTML.jpg)\n\
  \n图 2-26\n\n最终决策树示意图\n\n请注意，并非所有叶节点都必须纯净；有时相似（甚至相同）的实例会属于不同类别。当数据无法进一步分裂时，分裂过程即停止。\n\
  \n##### 基尼指数\n\n决策树算法 CART（分类与回归树）使用基尼方法来创建分裂点。计算基尼指数的公式为：\n\n![$$ Gini(D)=1-\\\
  sum \\limits_{k=1}^K{p}_i² $$](img/482214_1_En_2_Chapter_TeX_Equaf.png)\n\n其中 *p*[*i*]\
  \ 是 *D* 中元组属于类别 *C*[*i*] 的概率。\n\n基尼指数考虑每个属性的二元分裂。你可以计算每个分区不纯度的加权和。如果属性 *A* 上的二元分裂将数据\
  \ *D* 划分为 *D*[*1*] 和 *D*[*2*]，则 *D* 的基尼指数为：\n\n![$$ {Gini}_A(D)=\\frac{\\mid {D}_1\\\
  mid }{D} Gini\\left({D}_1\\right)+\\frac{\\mid {D}_2\\mid }{D} Gini\\left({D}_2\\\
  right) $$](img/482214_1_En_2_Chapter_TeX_Equag.png)\n\n对于离散值属性，选择使该属性基尼指数最小的子集作为分裂属性。对于连续值属性，策略是将每对相邻值作为可能的分裂点，并选择基尼指数较小的点作为分裂点。\n\
  \n![$$ \\Delta Gini(A)= Gini(D)-{Gini}_A(D) $$](img/482214_1_En_2_Chapter_TeX_Equah.png)\n\
  \n基尼指数最小的属性被选为分裂属性。\n\n当元素异质（不纯）时，该指数最大。\n\n如果\n\n![$$ {p}_k=\\frac{1}{k} $$](img/482214_1_En_2_Chapter_TeX_Equai.png)\n\
  \n那么\n\n![$$ Gini=1-\\sum \\limits_{k=1}^K\\frac{1}{k²}=1-\\frac{1}{k} $$](img/482214_1_En_2_Chapter_TeX_Equaj.png)\n\
  \n相应地，当元素同质（纯净）时，该指数最小。\n\n如果\n\n\U0001D45D[\U0001D456] = 1 或 \U0001D45D[\U0001D456\
  ] = 0\n\n那么\n\n*Gini* = 1 − 1 − 0 = 0\n\n\n\n###### 简单的基尼指数示例\n\n我将从一个任意数据集开始，如表\
  \ 2-7 所示，该数据集包含五个特征，其中特征 E 是预测特征。该特征有两个类别：正类或负类。为了简化计算，每个类别的实例数量恰好相等。\n\n表 2-7\n\
  \n任意数据集\n\n| 索引 | A | B | C | D | E |\n| --- | --- | --- | --- | --- | --- |\n|\
  \ 1 | 4.8 | 3.4 | 1.9 | 0.2 | 正类 |\n| 2 | 5 | 3 | 1.6 | 1.2 | 正类 |\n| 3 | 5 | 3.4\
  \ | 1.6 | 0.2 | 正类 |\n| 4 | 5.2 | 3.5 | 1.5 | 0.2 | 正类 |\n| 5 | 5.2 | 3.4 | 1.4\
  \ | 0.2 | 正类 |\n| 6 | 4.7 | 3.2 | 1.6 | 0..2 | 正类 |\n| 7 | 4.8 | 3.1 | 1.6 | 0.2\
  \ | 正类 |\n| 8 | 5.4 | 3.4 | 1.5 | 0.4 | 正类 |\n| 9 | 7 | 3.2 | 4.7 | 1.4 | 负类 |\n\
  | 10 | 6.4 | 3.2 | 4.7 | 1.5 | 负类 |\n| 11 | 6.9 | 3.1 | 4.9 | 1.5 | 负类 |\n| 12 |\
  \ 5.5 | 2.3 | 4 | 1.3 | 负类 |\n| 13 | 6.5 | 2.8 | 4.6 | 1.5 | 负类 |\n| 14 | 5.7 |\
  \ 2.8 | 4.5 | 1.3 | 负类 |\n| 15 | 6.3 | 3.3 | 4.7 | 1.6 | 负类 |\n| 16 | 4.9 | 2.4\
  \ | 3.3 | 1 | 负类 |\n\n计算基尼指数的第一步是为每个特征或属性选择一些随机值进行分类（初始分割）。为该数据集选择的值如表 2-8 所示。\n\
  \n表 2-8\n\n初始分割属性值\n\n| A | B | C | D |\n| --- | --- | --- | --- |\n| >= 5.0 | >=\
  \ 3.0 | >= 4.2 | >= 1.4 |\n| < 5.0 | < 3.0 | < 4.2 | < 1.4 |\n\n计算属性 A 的基尼指数：\n\n\
  *   值 >= 5\n\n*   实例数量 = 12\n\n*   值 >=5 且为正类的实例数量 = 5\n\n*   值 >= 5 且为负类的实例数量 =\
  \ 7\n\n![$$ {\\boldsymbol{Gini}}_{\\boldsymbol{A}}\\left(&gt;=\\mathbf{5}\\right)=\\\
  mathbf{1}-{\\left(\\frac{\\mathbf{5}}{\\mathbf{12}}\\right)}^{\\mathbf{2}}-{\\left(\\\
