  ## 人工神经网络


  人工神经网络在人工智能领域有着相对悠久的历史。关于人工神经网络的奠基性论文被认为是沃伦·麦卡洛克和沃尔特·皮茨于 1943 年发表的《神经活动中固有思想的逻辑演算》，他们在文中提出了一种基于数学和算法（他们称之为阈值逻辑）的神经网络计算模型。该模型为后续神经网络研究分为两种方法铺平了道路：一种方法侧重于大脑中的生物过程，另一种则侧重于神经网络在人工智能中的应用。


  人工神经网络的一个核心概念是神经元模型，其旨在一定程度上模仿人脑神经元。我认为在讨论人工神经元之前，首先讨论人脑神经元非常重要。通过这种方式，你应该能理解人工神经元为何会以今天的形式被创造出来。


  人脑神经元的生物示意图如图 4-15 所示。


  ![../images/482214_1_En_4_Chapter/482214_1_En_4_Fig15_HTML.jpg](img/482214_1_En_4_Fig15_HTML.jpg)


  图 4-15


  人脑神经元示意图


  图中所示的人脑神经元部分描述如下：


  *   **树突** – 树突允许细胞体从大量（>1000 个）相邻神经元接收信号。每个树突都能通过其“权重值”对电信号进行“乘法”运算。这种乘法是通过增加或减少突触神经递质与响应突触神经递质而引入树突的信号化学物质的比例来实现的。通过沿树突体传递信号抑制剂（即带相反电荷的离子）以响应突触神经递质的接收，可以实现负乘法效应。


  *   **胞体** – 胞体起到求和函数的作用。当正负信号（分别为兴奋性和抑制性）从树突到达胞体时，正负离子通过简单地在细胞体内的溶液中混合而有效地相加求和。


  *   **轴突** – 轴突从胞体内发生的求和行为中获取信号。轴突的开口本质上是对胞体内溶液的电位进行采样。一旦胞体达到某个电位，轴突就会沿其长度传递一个全有或全无的信号脉冲。通过这种方式，轴突直接与其他神经元通信。


  生物神经元以离散脉冲的形式放电。每次胞体内的电位达到预设阈值时，就会有一个脉冲沿轴突传递。这种脉冲可以转化为连续值。轴突放电的速率（每秒激活次数等）直接转化为相邻神经元接收信号离子的速率。生物神经元放电越快，附近神经元积累电位（或失去电位，取决于连接到放电神经元的树突的“权重”）的速度就越快。正是这种转换使得人工智能研究人员能够使用可以输出不同值（通常在-1
  到 1 范围内）的人工神经元来模拟生物神经网络。


  早期的人工智能研究人员基于前述部分生物学事实，开发了一个相对简单的脑神经元模型。图 4-16 展示了一个具有*N*个输入和一个输出的人工神经元示意图。


  ![../images/482214_1_En_4_Chapter/482214_1_En_4_Fig16_HTML.jpg](img/482214_1_En_4_Fig16_HTML.jpg)


  图 4-16


  人工神经元示意图


  带有权重的输入分支相当于树突。圆圈是一个求和节点，相当于胞体内发生的过程。标有激活函数的方框相当于轴突，当加权电信号的总和超过某个阈值时，它就会放电。我认为这个模型非常简单，但似乎能真实地捕捉到真实脑神经元中发生的情况。


  人工神经元的数学表示简洁地展示如下：


  ![$$ g\left({x}_1,{x}_2,{x}_3,\cdots {x}_n\right)=g(X)=\sum \limits_{i=1}^n{x}_i
  $$](img/482214_1_En_4_Chapter_TeX_Equm.png)


  ![$$ y=f\left(g(X)\right)=1\kern0.5em if\ g(X)\ge \theta $$](img/482214_1_En_4_Chapter_TeX_Equn.png)


  ![$$ =0\kern0.5em if\ g(X)&lt;\theta $$](img/482214_1_En_4_Chapter_TeX_Equo.png)


  输出 1 和 0 仅表示加权输入总和超过某个阈值*θ*时的状态。实际输出值取决于由激活函数转换后的真实总和值。


  人工神经元模型中常用的激活函数是 Sigmoid 函数，我在第 2-16 章中向你介绍过它。请回顾该讨论以加深印象，并查看图 2 以了解该函数如何转换求和信号。通过检查该图，你应该很容易意识到，对于大多数在-8
  到+8 范围内的求和信号，最终输出信号将在 0 到 1.0 的范围内。




  ### 人工神经网络（ANN）的训练与工作原理


  现在，我们来探索一个由人工神经元组成的网络，通常简称为 ANN。


  图 4-17 展示了一个通用的三层 ANN 结构。


  ![../images/482214_1_En_4_Chapter/482214_1_En_4_Fig17_HTML.jpg](img/482214_1_En_4_Fig17_HTML.jpg)


  图 4-17


  三层人工神经网络


  构成 ANN 的三个层级分别是：


  *   **输入层** – 原始数据输入到这一层。这些数据输入不带权重。一个 ANN 中只有一个输入层。


  *   **隐藏层** – 指既不是输入层也不是输出层的任何层。隐藏层可以有一个或多个。权重通常与隐藏层节点之间的连接，以及最后一个隐藏层到输出层的连接相关联。


  *   **输出层** – 处理后的信号作为输出从这一层产生。对于分类 ANN，输出节点的数量通常等于类别的数量。


  ANN 通常分为两类：


  *   **前馈型**


  *   **反馈型**


  图 4-18 展示了信号在这两种 ANN 中的流动方式。


  ![../images/482214_1_En_4_Chapter/482214_1_En_4_Fig18_HTML.jpg](img/482214_1_En_4_Fig18_HTML.jpg)


  图 4-18


  前馈型和反馈型 ANN 模型


  每种 ANN 类别相对于另一种都有其优缺点。最终使用哪种 ANN 模型取决于数据集的性质以及 ANN 的预期用途。然而，在训练 ANN 时，总是使用反馈模型。这是因为训练的主要目的是确定用于隐藏层节点的权重值。确定这些值是
  ANN“学习”的关键方法。ANN 的学习过程是：首先将大型数据集逐条或逐元素地输入网络。这些输入数据最终产生输出数据，然后将输出数据与真实数据进行对比。产生的任何误差随后会在反馈配置中用于调整权重值，以减少并最小化误差。这种单条记录的训练周期通常会重复数千次，以完成网络的完整训练。术语“**轮次**”用于描述将整个数据集一次性通过
  ANN 的过程。在一次训练会话中使用多个轮次并不罕见，为了获得比单次遍历更好的学习效果，训练数据集会在下一个轮次中稍作重新排列。整个训练过程被称为*反向传播*。


  图 4-19 展示了一个三层 ANN，并在节点互连上标注了权重。


  ![../images/482214_1_En_4_Chapter/482214_1_En_4_Fig19_HTML.jpg](img/482214_1_En_4_Fig19_HTML.jpg)


  图 4-19


  带权重的三层人工神经网络


  权重标注为*w*[*i,j*]，其中*i*是源节点，*j*是目标节点。图中并非所有节点都有互连，因为我不想让图显得过于“拥挤”。实际上，当学习开始时，所有节点都会与其他节点“连接”。最终，一些权重会逐渐减小到不再被使用的程度，这意味着节点连接实际上将不复存在。


  #### 实际 ANN 示例


  我认为展示一个完全“解算”的 ANN 示例将是一个有用的学习练习。图 4-20 展示了一个高度简化的两层 ANN，我将用它作为本例。


  ![../images/482214_1_En_4_Chapter/482214_1_En_4_Fig20_HTML.jpg](img/482214_1_En_4_Fig20_HTML.jpg)


  图 4-20


  两层人工神经网络


  本例中不需要隐藏层，因为我只专注于演示反向传播过程。用于开始本例的初始数据输入和权重如表 4-2 所示。


  表 4-2


  初始输入和权重值


  | 符号 | 值 |

  | --- | --- |

  | in1 | 0.8 |

  | in2 | 0.4 |

  | w[1,1] | 0.8 |

  | w[1,2] | 0.1 |

  | w[2,1] | 0.9 |

  | w[2,2] | 0.4 |


  这些值是随机的，并不反映任何现实世界的问题领域。我将在后面的章节中描述如何使用随机数生成器预设一整组权重。另外需要注意的一点是，我将使用 Sigmoid 函数来转换求和值。Sigmoid
  方程如下：


  ![$$ y=\frac{1}{\left(1+{e}^{-x}\right)} $$](img/482214_1_En_4_Chapter_TeX_Equp.png)


  其中


  *   *e* = 2.71828 ...（欧拉数）


  将*x* = 1 代入上述方程，可得*y* = 0.731。


  计算*out*1 需要求解以下方程：


  ![$$ 加权输入之和=x={w}_{1,1}\ast in1+{w}_{2,1}\ast in2 $$](img/482214_1_En_4_Chapter_TeX_Equq.png)


  ![$$ out1=\frac{1}{\left(1+{e}^{-x}\right)} $$](img/482214_1_En_4_Chapter_TeX_Equr.png)


  代入表 4-2 中的值得出：


  ![$$ x=0.8\ast 0.8+0.9\ast 0.4=1.0 $$](img/482214_1_En_4_Chapter_TeX_Equs.png)


  ![$$ out1=\frac{1}{\left(1+{e}^{-1}\right)}=0.731 $$](img/482214_1_En_4_Chapter_TeX_Equt.png)


  类似地，计算*out*2 需要求解这些方程：


  ![$$ 加权输入之和=x={w}_{1,2}\ast in1+{w}_{2,2}\ast in2 $$](img/482214_1_En_4_Chapter_TeX_Equu.png)


  ![$$ out2=\frac{1}{\left(1+{e}^{-x}\right)} $$](img/482214_1_En_4_Chapter_TeX_Equv.png)


  代入表 4-2 中的值得出：


  ![$$ x=0.1\ast 0.8+0.4\ast 0.4=0.24 $$](img/482214_1_En_4_Chapter_TeX_Equw.png)


  ![$$ out2=\frac{1}{\left(1+{e}^{-0.24}\right)}=0.560 $$](img/482214_1_En_4_Chapter_TeX_Equx.png)


  通过相当多的手动计算，现在已经确定了两个 ANN 的输出。此时应该清楚，尝试手动计算更大、更复杂的 ANN 的输出是不现实的。既然我已经演示了手动计算是多么繁琐，从现在开始将使用矩阵和矩阵运算。


  这个简单示例的输入数据可以表示为一个向量：


  ![$$ \left\{\begin{array}{c} in1\\ {} in2\end{array}\right\} $$](img/482214_1_En_4_Chapter_TeX_Equy.png)


  同样，权重矩阵可以表示为一个 2 x 2 矩阵：


  ![$$ \left\{\begin{array}{c}{w}_{1,1}\ {w}_{1,2}\\ {}{w}_{2,1}\ {w}_{2,2}\end{array}\right\}
  $$](img/482214_1_En_4_Chapter_TeX_Equz.png)


  图 4-21 展示了在交互式 Python 会话中使用矩阵运算执行相同手动计算的过程。


  ![../images/482214_1_En_4_Chapter/482214_1_En_4_Fig21_HTML.jpg](img/482214_1_En_4_Fig21_HTML.jpg)


  图 4-21


  交互式 Python 会话


  你可以很容易地看到，Python 会话的结果与手动计算的结果相匹配。




  #### 复杂 ANN 示例


  图 4-22 展示了一个更复杂的 ANN 示例，我使用 Python 脚本对其进行了处理。


  ![../images/482214_1_En_4_Chapter/482214_1_En_4_Fig22_HTML.jpg](img/482214_1_En_4_Fig22_HTML.jpg)


  图 4-22


  复杂 ANN 示例


  输入数据向量并不代表任何有意义的领域问题。它只是一组随机数，因为本次演示的目的是展示复杂 ANN 的计算过程。


  向量格式的输入数据集为


  ![$$ input=\left\{\begin{array}{c}0.8\\ {}0.2\\ {}0.7\end{array}\right\} $$](img/482214_1_En_4_Chapter_TeX_Equaa.png)


  输入层与隐藏层之间的权重矩阵（*wtg*[*ih*]）为


  ![$$ {wtg}_{ih}=\left\{\begin{array}{c}{w}_{1,1}\ {w}_{1,2}\ {w}_{1,3}\\ {}{w}_{2,1}\
  {w}_{2,2}\ {w}_{2,3}\\ {}{w}_{3,1}\ {w}_{3,2}\ {w}_{3,3}\end{array}\right\} $$](img/482214_1_En_4_Chapter_TeX_IEq2.png)
  = ![$$ \left\{\begin{array}{c}0.8\ 0.6\ 0.3\\ {}0.2\ 0.9\ 0.3\\ {}0.2\ 0.5\ 0.8\end{array}\right\}
  $$](img/482214_1_En_4_Chapter_TeX_IEq3.png)


  隐藏层与输出层之间的权重矩阵（*wtg*[*ho*]）为


  ![$$ {wtg}_{ho}=\left\{\begin{array}{c}{w}_{1,1}\ {w}_{1,2}\ {w}_{1,3}\\ {}{w}_{2,1}\
  {w}_{2,2}\ {w}_{2,3}\\ {}{w}_{3,1}\ {w}_{3,2}\ {w}_{3,3}\end{array}\right\} $$](img/482214_1_En_4_Chapter_TeX_IEq4.png)
  = ![$$ \left\{\begin{array}{c}0.4\ 0.8\ 0.4\\ {}0.5\ 0.7\ 0.2\\ {}0.9\ 0.1\ 0.6\end{array}\right\}
  $$](img/482214_1_En_4_Chapter_TeX_IEq5.png)


  这些矩阵的元素被赋值为 0 到 1.0 范围内的随机数。


  用于处理该 ANN 的 Python 脚本名为 annDemo1.py，可从本书的配套网站获取。该脚本注释详尽，不过我在代码清单之后还会补充一些说明。


  ```

  # 导入所需库

  import numpy as np

  # 创建输入数据向量

  input = np.array([0.8, 0.2, 0.7])[:,None]

  # 创建 wtgih 矩阵

  wtgih = np.matrix([[0.8, 0.6, 0.3], \

  [0.2, 0.9, 0.3], \

  [0.2, 0.5, 0.8]])

  # 创建 wtgho 矩阵

  wtgho = np.matrix([[0.4, 0.8, 0.4], \

  [0.5, 0.7, 0.2], \

  [0.9, 0.1, 0.6]])

  # 计算输入向量与 wtgih 矩阵的点积

  X1 = np.dot(input.T, wtgih)

  # 显示矩阵

  print(''X1 矩阵\n'', X1)

  print()

  # 对 X1 矩阵应用激活函数

  out1 = 1 / (1 + np.exp(-X1))

  # 显示矩阵

  print(''out1 矩阵\n'', out1)

  print()

  # 计算 X1 与 wtgho 矩阵的点积

  X2 = np.dot(out1, wtgho)

  # 显示矩阵

  print(''X2 矩阵\n'', X2)

  print()

  # 对 X2 矩阵应用激活函数

  out2 = 1 / (1 + np.exp(-X2))

  # 显示矩阵

  print(''out2 矩阵\n'', out2)

  ```


  该脚本利用 numpy 的点积函数来完成矩阵乘法。另外，请注意使用 numpy 的`exp`函数应用激活函数是多么简便。


  通过输入以下命令来运行脚本：


  ```

  python annDemo1.py

  ```


  图 4-23 显示了运行脚本后的结果。


  ![../images/482214_1_En_4_Chapter/482214_1_En_4_Fig23_HTML.jpg](img/482214_1_En_4_Fig23_HTML.jpg)


  图 4-23


  运行 annDemo1 脚本的结果


  最终输出向量以及所有中间矩阵和向量都一并显示。顺便提一下，当我在矩阵和向量这两个术语之间混用时，请不要感到困惑。我通常将单行数据称为向量，尽管从技术上讲，你也可以将其标记为一维矩阵。在我看来，这种标记方式有点过于学究气了。


  该 ANN 的最终输出数据没有实际意义，因为输入数据本身就没有意义。不过，最终输出应该在一定程度上反映输入值。表 4-3 比较了输入值和输出值以及它们之间的误差。


  表 4-3


  输入值与输出值对比


  | 输入 | 输出 | 误差 |

  | --- | --- | --- |

  | 0.8 | 0.78187033 | 0.01812967 |

  | 0.2 | 0.75745360 | –0.55745360 |

  | 0.7 | 0.69970531 | 0.00029469 |


  除了表中的中间值，结果都很接近。这表明必须修改初始权重以减少误差。但如何做到呢？答案将在下一节揭晓。




  #### 修改权重值


  考虑如图 4-24 所示三个节点相连的情况。


  ![../images/482214_1_En_4_Chapter/482214_1_En_4_Fig24_HTML.jpg](img/482214_1_En_4_Fig24_HTML.jpg)


  **图 4-24**

  单一误差分配设置


  求和节点存在一些误差，必须通过调整输入节点 1 和 2 与输出节点 1 之间的权重来修正。一种简单的方法可能是将误差平均分配给各个节点。然而，这并不能准确反映每个输入节点的误差贡献，因为节点
  1 的权重是节点 2 的两倍。正确的解决方案是根据连接节点的权重按比例分配误差。在这种情况下，节点 1 应承担三分之二的误差，节点 2 承担三分之一。


  以这种方式使用权重矩阵是初次接触人工神经网络（ANN）时不易察觉的一个额外特性。通常，信号如前所述以前馈配置传播。而这种修改方法则利用权重将误差值反向传播。这就是为何这种误差确定方法被称为反向传播。


  现在考虑如图 4-25 所示，两个输出节点出现多个误差的情况。


  ![../images/482214_1_En_4_Chapter/482214_1_En_4_Fig25_HTML.jpg](img/482214_1_En_4_Fig25_HTML.jpg)


  **图 4-25**

  多重误差分配设置


  多节点的权重修改过程与单节点相同。这是因为输出节点之间相互独立，没有直接连接。分配给每条互连线的误差比例仅取决于连接到该输出节点的每条线上的权重值。在图 4-25
  的情况下，分配给误差 e[1]的权重 w[1,1]和 w[2,1]的比例为：


  ![$$ \frac{w_{1,1}}{\left({w}_{1,1}+{w}_{2,1}\right)}\kern0.5em \mathrm{和}\ \frac{w_{2,1}}{\left({w}_{1,1}+{w}_{2,1}\right)}
  $$](img/482214_1_En_4_Chapter_TeX_Equab.png)


  类似地，误差 e[2]的比例为：


  ![$$ \frac{w_{1,2}}{\left({w}_{1,2}+{w}_{2,2}\right)}\kern0.5em \mathrm{和}\ \frac{w_{2,2}}{\left({w}_{1,2}+{w}_{2,2}\right)}
  $$](img/482214_1_En_4_Chapter_TeX_Equac.png)


  到目前为止，基于输出误差修改权重的过程很简单。由于训练数据易于获取，误差很容易确定。训练两层人工神经网络时无需其他操作。但是，当隐藏层中肯定存在误差，却又没有训练数据时，如何处理三层人工神经网络呢？


  图 4-26 展示了一个三层、六节点的人工神经网络，每层有两个节点。


  ![../images/482214_1_En_4_Chapter/482214_1_En_4_Fig26_HTML.jpg](img/482214_1_En_4_Fig26_HTML.jpg)


  **图 4-26**

  三层、六节点人工神经网络


  此人工神经网络已被简化，以帮助您专注于所需的少量反向传播计算。输出误差是随机生成的，因为后续计算需要用到它们。以下各个误差贡献是根据图中所示的权重计算得出的：


  对于 w[1,1]线：


  ![$$ {e}_{1 node1}\ast \frac{w_{1,1}}{\left({w}_{1,1}+{w}_{2,1}\right)}=0.96\ast
  \frac{2}{\left(2+3\right)}=0.96\ast 0.4=0.38 $$](img/482214_1_En_4_Chapter_TeX_Equad.png)


  对于 w[2,1]线：


  ![$$ {e}_{1 node2}\ast \frac{w_{2,1}}{\left({w}_{1,1}+{w}_{2,1}\right)}=0.96\ast
  \frac{3}{\left(2+3\right)}=0.96\ast 0.6=0.58 $$](img/482214_1_En_4_Chapter_TeX_Equae.png)


  对于 w[1,2]线：


  ![$$ {e}_{2 node1}\ast \frac{w_{1,2}}{\left({w}_{1,2}+{w}_{2,2}\right)}=0.8\ast
  \frac{2}{\left(2+1\right)}=0.8\ast 0.66=0.53 $$](img/482214_1_En_4_Chapter_TeX_Equaf.png)


  对于 w[2,2]线：


  ![$$ {e}_{2 node2}\ast \frac{w_{2,2}}{\left({w}_{1,2}+{w}_{2,2}\right)}=0.8\ast
  \frac{1}{\left(2+1\right)}=0.8\ast 0.33=0.27 $$](img/482214_1_En_4_Chapter_TeX_Equag.png)


  每个隐藏节点的总归一化误差值是该节点各个误差贡献之和，计算如下：


  ![$$ {e}_1={e}_{1 node1}\kern0.5em +{e}_{2 node1}=0.38+0.53=0.91 $$](img/482214_1_En_4_Chapter_TeX_Equah.png)


  ![$$ {e}_2={e}_{1 node2}\kern0.5em +{e}_{2 node2}=0.58+0.27=0.85 $$](img/482214_1_En_4_Chapter_TeX_Equai.png)


  这些值显示在图 4-26 中每个隐藏节点旁边。


  此误差计算过程可以继续，以涵盖所有剩余隐藏层节点的所有误差，不仅限于本例中的单个隐藏层，而是针对人工神经网络中任意数量的隐藏层。但是，无需计算输入层的误差值，因为所有输入层节点的误差必须为
  0。它们只是不加修改地传递输入数据向量值。


  您应该能察觉到，计算隐藏层误差值是一个繁琐的过程，并且可以像前馈计算那样以自动化方式进行。如果误差计算直接从我刚才演示的手动过程转换而来，则适用以下矩阵表示法：


  ![$$ {e}_{hidden}=\left\{\begin{array}{c}\frac{w_{1,1}}{\left({w}_{1,1}+{w}_{2,1}\right)}\kern0.5em
  \frac{w_{1,2}}{\left({w}_{1,1}+{w}_{2,1}\right)}\\ {}\frac{w_{2,1}}{\left({w}_{2,1}+{w}_{2,2}\right)}\kern0.5em
  \frac{w_{2,2}}{\left({w}_{2,1}+{w}_{2,2}\right)}\end{array}\right\}\ast \left\{\begin{array}{c}
  in1\\ {} in2\end{array}\right\} $$](img/482214_1_En_4_Chapter_TeX_Equaj.png)


  不幸的是，没有简单的方法可以像矩阵中所示那样输入分数。然而，只需考虑分数仅用于归一化误差贡献，这意味着贡献值范围仅在 0 到 1.0 之间。通过舍弃分母，仍然可以保持相对误差贡献。去掉分母得到：


  ![$$ {e}_{hidden}=\left\{\begin{array}{c}{w}_{1,1}\kern0.5em {w}_{1,2}\\ {}{w}_{2,1}\kern0.5em
  {w}_{2,2}\end{array}\right\}\ast \left\{\begin{array}{c} in1\\ {} in2\end{array}\right\}
  $$](img/482214_1_En_4_Chapter_TeX_Equak.png)


  这个矩阵公式与之前演示的相同，并且可以轻松地使用 numpy 函数处理。


  到目前为止，我只讨论了如何确定各个误差贡献。现在是时候讨论在确定误差贡献后如何修改权重了。


  我将首先向您展示一个相当复杂的方程，该方程用于计算三层、九节点人工神经网络中给定输出节点的输出：


  ![$$ {O}_k=\frac{1}{-\sum \limits_{j=1}³\left({w}_{j,k}\ast \frac{1}{\sum \limits_{j=1}³\left({w}_{j,k}\ast
  {x}_i\right)}\right)} $$](img/482214_1_En_4_Chapter_TeX_Equal.png)


  其中


  ![$$ {O}_k= 第 k 个节点的输出 $$](img/482214_1_En_4_Chapter_TeX_Equam.png)


  ![$$ {w}_{j,k}= 互连权重 $$](img/482214_1_En_4_Chapter_TeX_Equan.png)


  ![$$ {x}_i= 输入数据 $$](img/482214_1_En_4_Chapter_TeX_Equao.png)


  即使这个方程仅适用于一个简单的三层、九节点人工神经网络，它也已经相当复杂。想象一下适用于六输入、五层人工神经网络的方程会是什么样。拥有更大规模的人工神经网络极为常见，因此试图解析求解人工神经网络方程完全不切实际，也超出了人类的理解能力。排除了解析方法后，您可能会尝试一种“暴力”方法。




  考虑使用一台极快的计算机，并对每个权重尝试一系列不同的值。假设权重范围是 –1 到 +1，这对于一个实际的人工神经网络来说是完全可能的。再假设增量大小为 0.001，这同样是一个合理的假设。这意味着对于一个三层、九个节点的人工神经网络，将有
  18 个权重需要测试，每个连接进行 2000 次测试，总共需要进行 36,000 次增量测试。假设每次测试需要 1 秒，那么总共需要 36,000 秒，即大约
  10 小时的运算时间。十个小时虽然很长，但你可以去睡觉，电脑在早上就能完成。但现在考虑一个实际的 900 节点人工神经网络，我计划在下一章中进行演示。这将需要近十亿次测试，大约需要
  32 年才能完成。我不知道你怎么想，但等待一代人左右的时间来完成一次计算，似乎有点过分了。暴力方法的实用替代方案是使用本章前面介绍过的梯度下降算法。


  图 4-27 将作为我用来解释如何将梯度下降应用于人工神经网络的网络。


  ![../images/482214_1_En_4_Chapter/482214_1_En_4_Fig27_HTML.jpg](img/482214_1_En_4_Fig27_HTML.jpg)


  图 4-27


  三层、六节点人工神经网络


  除了图中所示的符号外，还需要一个额外的符号 *e*[*k*] 来表示输出节点误差。


  输出节点误差表示为


  ![$$ {e}_k={t}_k-{o}_k $$](img/482214_1_En_4_Chapter_TeX_Equap.png)


  其中


  ![$$ {t}_k= 真实值 $$](img/482214_1_En_4_Chapter_TeX_Equaq.png)


  ![$$ {o}_k= 由 {x}_i 输入产生的输出 $$](img/482214_1_En_4_Chapter_TeX_Equar.png)


  总误差是每个节点误差值的总和。得到的方程是


  ![$$ {e}_k=\sum \limits_{i=1}^N{\left({t}_k-{o}_k\right)}² $$](img/482214_1_En_4_Chapter_TeX_Equas.png)


  其中


  ![$$ N= 人工神经网络中的节点总数 $$](img/482214_1_En_4_Chapter_TeX_Equat.png)


  误差项也被平方，以确保负误差不会抵消正误差，正如我在讨论梯度下降时提到的那样。


  这个误差函数等同于损失函数。这意味着必须对其关于 w[j,k] 求导，以创建用于优化权重的方程。导数形式为


  ![$$ \frac{\partial e}{\partial {w}_{j,k}}=\frac{\partial }{\partial {w}_{j,k}}\sum
  \limits_{i=1}^N{\left({t}_k-{o}_k\right)}² $$](img/482214_1_En_4_Chapter_TeX_Equau.png)


  注意到任何给定节点的误差完全由其输入连接引起，可以大大简化这个方程。这意味着第 *k* 个节点仅依赖于其输入连接上的权重 *w*[*j,k*]。认识到这一事实，你可以从误差函数中移除求和，因为没有其他节点对第
  *k* 个节点的输出有贡献。这种简化得到了一个简单得多的误差函数：


  ![$$ \frac{\partial e}{\partial {w}_{j,k}}=\frac{\partial }{\partial {w}_{j,k}}{\left({t}_k-{o}_k\right)}²
  $$](img/482214_1_En_4_Chapter_TeX_Equav.png)


  完成微分并应用激活函数后的最终方程是


  ![$$ \frac{\partial e}{\partial {w}_{j,k}}=-\left({t}_k-{o}_k\right)\ast sigmoid\left(\sum
  \limits_j{w}_{j,k}\ast {o}_j\right)\ast \left(1- sigmoid\left(\sum \limits_j{w}_{j,k}\ast
  {o}_j\right)\right)\ast {o}_j $$](img/482214_1_En_4_Chapter_TeX_Equaw.png)


  前面的方程虽然看起来相当复杂，但如果赋予其物理意义，实际上很容易理解。第一部分 (*t*[*k*] − *o*[*k*]) 就是误差。sigmoid 函数内部的求和是输入到第
  *k* 个最终层节点的值。最后一项 *o*[*j*] 是隐藏层中第 *j* 个节点的输出。


  隐藏层梯度下降算法的方程与前面所示的类似。它是


  ![$$ \frac{\partial e}{\partial {w}_{i,j}}=-\left({e}_j\ \right)\ast sigmoid\left(\sum
  \limits_j{w}_{i,j}\ast {o}_i\right)\ast \left(1- sigmoid\left(\sum \limits_j{w}_{i,j}\ast
  {o}_i\right)\right)\ast {o}_i $$](img/482214_1_En_4_Chapter_TeX_Equax.png)


  剩下的唯一需要展示的方程是，如何根据旧权重和梯度下降算法的结果来计算新权重。这个方程是


  ![$$ new\ {w}_{j,k}= old\ {w}_{j,k}-\alpha \ast \frac{\partial e}{\partial {w}_{j,k}}
  $$](img/482214_1_En_4_Chapter_TeX_Equay.png)


  其中


  ![$$ \alpha = 学习率 $$](img/482214_1_En_4_Chapter_TeX_Equaz.png)


  你应该能够看到，学习率参数对人工神经网络在梯度下降过程中的步进效果有很强的影响。


  用矩阵符号表示上述所有方程在计算上会更高效。以下函数计算连接隐藏层节点到输出节点的单个链接的梯度下降值：


  ![$$ g\left({w}_{j,k}\right)=\alpha \ast {e}_k\ast sigmoid\left({o}_k\right)\ast
  \left(1- sigmoid\left({o}_k\right)\right)\ast {o}_j^T $$](img/482214_1_En_4_Chapter_TeX_Equba.png)


  其中


  ![$$ {o}_j^T= 隐藏层矩阵的转置 $$](img/482214_1_En_4_Chapter_TeX_Equbb.png)


  以下是三层、六节点人工神经网络示例的矩阵：


  ![$$ \left\{\begin{array}{c}g\left({w}_{1,1}\right)\ g\left({w}_{2,1}\right)\ g\left(\
  {w}_{3,1}\right)\\ {}g\left({w}_{1,2}\right)\ g\left({w}_{2,2}\right)\ g\left({w}_{3,2}\right)\end{array}\right\}\ast
  \left\{\begin{array}{c}{e}_1\ast {sigmoid}_1\ast \Big(1-{sigmoid}_1\\ {}{e}_2\ast
  {sigmoid}_2\ast \Big(1-{sigmoid}_2\end{array}\right\}\ast \left\{{o}_1\kern0.5em
  {o}_2\right\} $$](img/482214_1_En_4_Chapter_TeX_Equbc.png)


  其中


  *   *o*[*n*] = 来自隐藏层的输出


  至此，我已经涵盖了所有必要的理论和数学背景，以便你理解一个关于人工神经网络如何学习的详尽示例。




  ### 实际 ANN 权重修改示例


  我将使用之前模型中稍作修改的网络来详细说明如何计算修改后的权重。图 4-28 是图 4-26 的修改版本，我在其中插入了两个随机值来表示隐藏层节点的输出。


  ![../images/482214_1_En_4_Chapter/482214_1_En_4_Fig28_HTML.jpg](img/482214_1_En_4_Fig28_HTML.jpg)


  图 4-28


  修改后的三层六节点 ANN


  计算从更新*w*[*1,1*]开始，该权重连接隐藏层节点 1 与输出层节点 1。以下是该连接的梯度下降方程：


  ![$$ \frac{\partial e}{\partial {w}_{j,k}}=-\left({t}_k-{o}_k\right)\ast sigmoid\left(\sum
  \limits_j{w}_{j,k}\ast {o}_j\right)\ast \left(1- sigmoid\left(\sum \limits_j{w}_{j,k}\ast
  {o}_j\right)\right)\ast {o}_j $$](img/482214_1_En_4_Chapter_TeX_Equbd.png)


  将图中的数值代入该方程可得


  ![$$ \left({t}_k-{o}_k\right)={e}_1=0.96 $$](img/482214_1_En_4_Chapter_TeX_Eqube.png)


  ![$$ \left(\sum \limits_j{w}_{j,k}\ast {o}_j\right)=\left(2.0\ast 0.6\right)+\left(3.0\ast
  0.4\right)=2.4 $$](img/482214_1_En_4_Chapter_TeX_Equbf.png)


  ![$$ sigmoid=\frac{1}{\left(1+{e}^{-2.4}\right)}=0.9168 $$](img/482214_1_En_4_Chapter_TeX_Equbg.png)


  ![$$ 1- sigmoid=0.0832 $$](img/482214_1_En_4_Chapter_TeX_Equbh.png)


  ![$$ {o}_1=0.6 $$](img/482214_1_En_4_Chapter_TeX_Equbi.png)


  将上述因子相乘得到


  ![$$ -0.96\ast 0.9168\ast 0.0832\ast 0.6=-0.04394 $$](img/482214_1_En_4_Chapter_TeX_Equbj.png)


  假设学习率为 0.15，则新权重为


  ![$$ new\ {w}_{j,k}= old\ {w}_{j,k}-\alpha \ast \frac{\partial e}{\partial {w}_{j,k}}
  $$](img/482214_1_En_4_Chapter_TeX_Equbk.png)


  ![$$ new\ {w}_{j,k}=2.0-0.15\ast \left(-0.04394\right)=2.0+0.0066=2.0066 $$](img/482214_1_En_4_Chapter_TeX_Equbl.png)


  新权重与旧权重相差不大；但请注意，在达到全局最小值之前，可能需要数百甚至数千次迭代。当多次迭代累积后，微小的变化最终会导致巨大的改变。


  网络中所有其他权重的调整过程与我刚才演示的相同。


  #### ANN 学习中的一些问题


  关于 sigmoid 激活函数，有两个要点需要了解。我将图 2-16 复制为图 4-29，以辅助本次讨论。


  ![../images/482214_1_En_4_Chapter/482214_1_En_4_Fig29_HTML.jpg](img/482214_1_En_4_Fig29_HTML.jpg)


  图 4-29


  Sigmoid 函数


  观察该图，您应该能发现当 x 输入大于 2.5 时，y 输出变化非常小。这是因为 sigmoid 函数在该值附近渐近趋近于 1.0。大 x 输入下的微小变化意味着梯度变化非常小。由于梯度下降算法依赖于存在“合理”的斜率，ANN
  学习会受到抑制。因此，ANN 训练数据集应将 x 值限制在所谓的*伪线性*范围内，大约为-3 到 3。负值限制的出现是因为 sigmoid 函数关于 y 轴对称，当
  x 小于或等于 2.5 时会发生饱和。超出*伪线性*范围的 x 值会导致 ANN 产生饱和效应，无法进行有效的权重更新。


  sigmoid 函数的另一个问题是它无法输出大于 1.0 或小于 0 的值。必须选择初始权重，以确保函数能在其允许范围内输出。实际上，由于前面描述的渐近特性，输出范围必须大致在
  0.01 到 0.99 之间。


  如前所述，初始权重的选择至关重要。选择一组良好的 ANN 初始权重可以避免输入饱和和输出限制问题。最直接的选择是将权重限制在我之前指定的*伪线性*范围内。然而，为了更保守起见，权重通常被限制在±1
  之间。


  多年来，AI 研究人员一直遵循一条有用的经验法则来帮助选择权重：


  > *初始权重应使用正态分布分配，其均值设置为 ANN 节点数的平方根的倒数。*


  如果您使用一个包含 36 个节点的小型 ANN，则均值为![$$ \frac{1}{\sqrt{36}} $$](img/482214_1_En_4_Chapter_TeX_IEq6.png)或
  0.16667。图 4-30 显示了具有该均值及±2 个标准差的正态概率分布。


  ![../images/482214_1_En_4_Chapter/482214_1_En_4_Fig30_HTML.jpg](img/482214_1_En_4_Fig30_HTML.jpg)


  图 4-30


  36 节点 ANN 初始权重的正态偏差


  在约-0.5 到 0.833 范围内随机选择权重，可以为 36 节点 ANN 的学习提供一个极佳的起点。


  关于初始权重选择，最后还有两点。第一点是避免将所有权重设置为相同值。ANN 学习依赖于权重的非均匀分布。第二点（希望显而易见）是不要将所有权重设置为 0，因为那样会禁用
  ANN。


  最后这一节完成了关于 ANN 的所有预备性讨论。是时候着手构建一个基于 Python 的实际 ANN 了。




  ### ANN Python 演示 – 第 1 部分


  在本演示的第 1 部分中，我将向您展示如何使用 Python 创建一个未经训练的 ANN。在第 2 部分中，我将向您展示如何训练该 ANN。


  本讨论首先描述一个实用 ANN 的组成模块。每个模块都必须有精心设计的软件，使其能够实现其目的。


  第一个模块是 Init 模块，用于“构建”ANN 结构。在本演示中，我将构建一个三层、九个节点的 ANN。这意味着我必须拥有代表每一层的对象，以及输入、输出和权重。表
  4-4 显示了 Init 模块的对象和引用。


  表 4-4


  Init 模块对象和引用


  | 名称 | 描述 |

  | --- | --- |

  | inode | 输入层节点数 |

  | hnode | 隐藏层节点数 |

  | onode | 输出层节点数 |

  | wtgih | 输入层与隐藏层之间的权重矩阵 |

  | wtgho | 隐藏层与输出层之间的权重矩阵 |

  | w[ij] | 单个权重矩阵元素 |

  | input | 输入向量 |

  | output | 输出向量 |

  | ohidden | 隐藏层输出数组 |

  | lr | 学习率 |


  以下 Init 模块代码设置了节点的数量和类型以及学习率：


  ```

  def __init__(self, inode, hnode, onode, lr):

  # 设置局部变量

  self.inode = inode

  self.hnode = hnode

  self.onode = onode

  self.lr = lr

  ```


  必须使用适当的值调用此 Init 模块代码，以构建一个三层、九个节点的 ANN。这些值为：


  *   inode = 3


  *   hnode = 3


  *   onode = 3


  *   lr = 0.25


  接下来要讨论的模块是设置权重矩阵的模块。我决定使用均值为 0.1667、标准差为 0.3333 的正态分布，正如我之前讨论的那样。NumPy 包含一个随机数生成器，可以很好地满足这一要求。以下代码创建了一个名为
  wtgih 的 3 x 3 矩阵，其中填充了具有所需统计特征的随机数：


  ```

  self.wtgih = np.random.normal(0.1667, 0.3333, self.hnodes, self. inodes)

  ```


  我在 Python 交互式会话中测试了上述代码，如图 4-31 所示。


  ![../images/482214_1_En_4_Chapter/482214_1_En_4_Fig31_HTML.jpg](img/482214_1_En_4_Fig31_HTML.jpg)


  图 4-31


  测试代码的 Python 交互式会话


  生成的 wtgih 矩阵结构良好，初始值非常出色。现在可以扩展 Init 模块以包含矩阵生成代码，其中我使用了前面描述的经验法则来设置矩阵的统计参数。


  ```

  def __init__(self, inode, hnode, onode, lr):

  # 设置局部变量

  self.inode = inode

  self.hnode = hnode

  self.onode = onode

  self.lr = lr

  # 均值是节点数之和的平方根的倒数

  mean = 1 / (pow((inode + hnode + onode), 0.5))

  # 标准差约为总权重范围的 1/6

  # 总范围 = 2

  sd = 2 / 6

  # 生成两个权重矩阵

  # 输入层到隐藏层

  self.wtgih = np.random.normal(mean, sd, [hnode, inode])

  # 隐藏层到输出层

  self.wtgho = np.random.normal(mean, sd, [onode, hnode])

  ```


  此时，我将引入第二个模块，用于测试 Init 模块。这个新模块名为 testNet，这反映了它的用途。该模块接收一个输入向量并返回一个输出向量。这个新模块执行以下步骤：


  1.  将输入数据向量转换为 numpy 数组。


  2.  将输入数组乘以 wtgih 权重矩阵。


  3.  应用 sigmoid 激活函数。


  4.  将隐藏层输出乘以 wtgho 矩阵。


  5.  应用 sigmoid 激活函数。


  这个新模块的代码清单如下：


  ```

  import numpy as np

  def testNet(self, input):

  # 将输入数据向量转换为数组

  input = np.array(input, ndmin=2).T

  # 将输入数组乘以 wtgih 矩阵

  hInput = np.dot(self.wtgih, input)

  # 应用激活函数

  hOutput = 1 / (1 + np.exp(-hInput))

  # 将隐藏层输出乘以 wtgho 矩阵

  oInput = np.dot(self.wtgho, hOutput)

  # 应用激活函数

  oOutput = 1 / (1 + np.exp(-oInput))

  return oOutput

  ```


  Init 和 testNet 模块都被放入一个名为 ANN 的 Python 类中，我将在第 2 部分演示之后向您展示这个类。但是，我首先需要演示一个完全未经训练的
  ANN 的表现。


