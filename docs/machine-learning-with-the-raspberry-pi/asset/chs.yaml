  \n图 1-17\n\ncheckLib.py 脚本的结果\n\n你显示的版本号可能与图中的版本号有所不同，因为开源软件在不断修订。但是，除非进行了某些根本性的、不可预见的大幅更改，否则这些软件包的功能应与早期版本相同。出于一致性的考虑，通常不会进行此类更改。\n\
  \n一旦所有依赖项安装完毕并正常运行，你就可以准备进行机器学习演示了。\n\n### 机器学习事实\n\n机器学习是人工智能（AI）母领域中的一个重要子主题。图\
  \ 1-18 是一个维恩图，突出了人工智能、机器学习和深度学习（DL）之间的关系。\n\n![../images/482214_1_En_1_Chapter/482214_1_En_1_Fig18_HTML.jpg](img/482214_1_En_1_Fig18_HTML.jpg)\n\
  \n图 1-18\n\n人工智能、机器学习和深度学习的维恩图\n\n从图中可以清楚地看出，机器学习是人工智能的重要组成部分，而深度学习是机器学习的重要组成部分。就当前的关注度和发展而言，该图应该颠倒过来，深度学习获得最多关注，其次是机器学习，最后是广义的人工智能。本书也将遵循深度学习占据主要关注度的层级结构，仅仅因为深度学习是实现计算机视觉的基本要素，而计算机视觉是当前人工智能和机器学习中最热门的话题。我将在后续章节中深入探讨深度学习；然而，在尝试更复杂的深度学习问题之前，我必须首先探索一些基础的机器学习主题。\n\
  \n\n\n#### 机器学习基础\n\n如果你向十几位人工智能/机器学习研究者询问什么是机器学习，你很可能会得到十几个略有不同但又有些相似的答案。我研究过许多定义，并认为我下面提出的这个定义，与我见过的其他任何定义一样恰当。\n\
  \n> *机器学习是创建算法，使计算机能够从数据中学习而无需进行显式编程的科学与艺术。*\n\n有趣的是，我发现多个定义都使用了完全相同的短语“无需进行显式编程”，这印证了我的观点：任何纯粹的机器学习应用都必须排除所有封装了专家知识的算法或系统。请注意，专家系统是人工智能中非常重要的一部分，但不在机器学习范畴内。然而，很可能存在同时结合了机器学习和专家系统的混合系统，它们充分利用了这两种技术各自的最佳能力。\n\
  \n机器学习最早于 1959 年由麻省理工学院教授、公认为计算机科学和人工智能先驱的阿瑟·塞缪尔提出。塞缪尔教授的部分表述是：“……赋予计算机无需显式编程就能学习的能力。”他本质上想表达的是，计算机可以通过算法进行编程，这些算法既能从输入数据中学习，又能基于相同的数据做出相应的预测。这意味着这些学习算法可以完全脱离任何预编程或静态算法，并通过基于输入数据构建模型，自由地做出数据驱动的决策或预测。\n\
  \n机器学习模型主要用于预测和分类。在讨论更复杂的机器学习应用之前，有必要向你介绍一些关于这些操作的基本概念。这个介绍将以一个虽小但完整的机器学习项目的形式展开。\n\
  \n#### 线性预测与分类\n\n本项目主要基于一篇 2016 年 6 月的博客文章，标题为“*你的第一个 Python 机器学习项目：逐步指南*”，作者是杰森·布朗利博士，他目前是居住在澳大利亚的一位活跃的机器学习研究者。我建议你查看他的博客[`MachineLearningMastery.com`](http://machinelearningmastery.com)，其中包含了丰富的机器学习信息和资源。杰森建议（我由衷赞同）你应该以结构化的方法启动所有机器学习项目，该方法包括以下步骤（我已对博客内容进行了转述）：\n\
  \n1.  定义问题。\n2.  准备并清洗所有相关数据。\n3.  评估所有适用的算法。\n4.  持续改进结果，直至收益递减点。\n5.  以尽可能清晰明确的方式呈现结果。\n\
  \n这个入门级的机器学习项目是一个关于鸢尾花分类的著名项目。鸢尾花数据集是一个多变量数据集，由英国统计学家和生物学家罗纳德·费希尔在他 1936 年的论文《分类学问题中多重测量的应用》中提出，作为线性判别分析的一个示例。该数据集有时也被称为安德森鸢尾花数据集，因为埃德加·安德森收集了这些数据，用于量化三种相关鸢尾花物种的形态变异。其中两个物种采集自加拿大魁北克的加斯佩半岛，“全部来自同一片牧场，在同一天采摘，并由同一个人使用同一设备在同一时间测量”，正如安德森论文中所引述。三种鸢尾花物种的照片如图\
  \ 1-19 所示。\n\n![../images/482214_1_En_1_Chapter/482214_1_En_1_Fig19_HTML.jpg](img/482214_1_En_1_Fig19_HTML.jpg)\n\
  \n图 1-19\n三种鸢尾花物种\n\n该数据集包含来自三种鸢尾花（山鸢尾、维吉尼亚鸢尾和变色鸢尾）各 50 个样本。每个样本测量了四个特征：花萼和花瓣的长度与宽度，单位是厘米。费希尔基于这四个特征的组合开发了一个线性判别模型，用以区分不同的鸢尾花物种。花萼是被子植物花朵的一部分，通常呈绿色。花萼的主要功能是在花蕾期保护花朵，并在开花时为花瓣提供支撑。花瓣是围绕花朵生殖器官的变态叶片，它们通常颜色鲜艳或形状奇特，以吸引传粉者，例如蜜蜂。图\
  \ 1-20 展示了一朵花（非鸢尾花），并标明了花萼和花瓣。\n\n![../images/482214_1_En_1_Chapter/482214_1_En_1_Fig20_HTML.jpg](img/482214_1_En_1_Fig20_HTML.jpg)\n\
  \n图 1-20\n花萼与花瓣\n\n问题解决方法的第 1 步相当简单：根据给定的四个维度（花萼高度和宽度，以及花瓣高度和宽度）来识别鸢尾花物种。所有维度应以厘米为单位，以匹配底层数据集中的单位。\n\
  \n解决过程的下一步是处理数据集。有几个在线资源可以下载 CSV 格式的原始鸢尾花数据集。我使用了杰森在 github.com 上提供的鸢尾花 CSV 数据集。本章演示的第一部分将侧重于熟悉该数据集。\n\
  \n\n\n#### 鸢尾花演示 – 第一部分\n\n以下列出的 Python 脚本名为 irisDemo.py，旨在通过一系列步骤帮助您熟悉数据属性与特征。熟悉数据有助于您选择最适合需求的算法。这些步骤如下：\n\
  \n*   加载依赖项。\n*   加载数据集。\n*   显示数据集维度。\n*   显示数据集中的前 20 条记录。\n*   显示数据集统计信息。\n*\
  \   显示数据集类别及对应数量。\n*   单变量与多变量数据图。\n\n以下完整脚本可从本书配套网站获取。我将在代码清单之后讨论整个脚本的结果。\n\n```\n\
  # Usage\n# python irisDemo.py\n# Load libraries\nimport pandas\nfrom pandas.plotting\
  \ import scatter_matrix\nimport matplotlib.pyplot as plt\n# Load dataset\nurl =\
  \ \"https://raw.githubusercontent.com/jbrownlee/Datasets/master/iris.csv\"\nnames\
  \ = ['sepal-length', 'sepal-width', 'petal-length', 'petal-width', 'class']\ndataset\
  \ = pandas.read_csv(url, names=names)\n# Display the shape\nprint('Dataset dimensions')\n\
  print(dataset.shape)\n# Display the first portion of the data\nprint('Head of the\
  \ data')\nprint(dataset.head(20))\n# Display data statistics\nprint('Statistics')\n\
  print(dataset.describe())\n# Display class distribution\nprint('Class distribution')\n\
  print(dataset.groupby('class').size())\n# Visualize data with box and whisker diagrams\n\
  dataset.plot(kind='box', subplot=True, layout=(2,2), sharex=False, sharey=False)\n\
  plt.show()\n# Visualize data with histograms\ndataset.hist()\nplt.show()\n# Visualize\
  \ data with scatter plots\nscatter_matrix(dataset)\nplt.show()\n```\n\n图 1-21 展示了\
  \ irisDemo 脚本结果的第一部分。\n\n![../images/482214_1_En_1_Chapter/482214_1_En_1_Fig21_HTML.jpg](img/482214_1_En_1_Fig21_HTML.jpg)\n\
  \n图 1-21\n\nirisDemo 结果的初始部分\n\n前两行显示数据集维度为 150 行、5 列。随后是数据集的前 20 行。列标题清晰可见，所有行数据以表格形式呈现。此列表应能让您对即将处理的数据有深入了解。\n\
  \n接下来是一个小型统计展示，显示数据集各列的经典统计指标，包括均值、标准差、最小值/最大值，以及 25%、50% 和 75% 分位数值。\n\n最后，显示数据集中每个鸢尾花类别的计数结果。毫不意外，每个类别均报告有\
  \ 50 个样本，与预期值完全吻合。\n\n图 1-22 展示了四个类别属性的“箱线图”。\n\n![../images/482214_1_En_1_Chapter/482214_1_En_1_Fig22_HTML.jpg](img/482214_1_En_1_Fig22_HTML.jpg)\n\
  \n图 1-22\n\n类别属性的箱线图\n\n这些单变量图是帮助您理解每个属性数值分布的有用辅助工具。某些模型可能能够处理较宽的数值分布，而另一些模型则更为敏感，可能导致不理想的结果。查看图表发现，与萼片属性相比，花瓣长度和花瓣宽度属性的数值分布范围更广。此外，萼片宽度属性似乎存在一些数据异常值，这可能会给某些模型带来问题。这些图表旨在提供对数据的进一步洞察，以帮助解释任何异常的模型结果。\n\
  \n另一种可视化数据的方法是为每个输入变量创建直方图。图 1-23 展示了所有四个鸢尾花属性的直方图。\n\n![../images/482214_1_En_1_Chapter/482214_1_En_1_Fig23_HTML.jpg](img/482214_1_En_1_Fig23_HTML.jpg)\n\
  \n图 1-23\n\n类别属性的直方图\n\n两个萼片属性似乎具有高斯分布或近似高斯分布。这一信息有助于为预测目的选择合适的模型或算法。花瓣属性则呈现双峰直方图，这一有趣的事实可能有助于选择诸如大津二值化之类的算法。\n\
  \n另一种检查数据集的方法是查看属性之间的结构化关系。这种方法称为多变量分析。图 1-24 展示了所有类别属性对的散点图。\n\n![../images/482214_1_En_1_Chapter/482214_1_En_1_Fig24_HTML.jpg](img/482214_1_En_1_Fig24_HTML.jpg)\n\
  \n图 1-24\n\n所有类别属性的散点图\n\n这些图表有助于可视化在仅查看数值列表时不易察觉的关系。您应注意到图中某些属性对呈对角线状分布。这强烈表明属性之间存在高度相关性，并且可能存在可量化的关系。\n\
  \n演示的下一部分是将数据输入一系列模型并运行预测。我必须提醒您，我将犯下技术书籍写作中的大忌——在未事先介绍的情况下直接使用模型。请放心，我将在本章或后续章节中，作为本书机器学习基础部分的内容，详细讨论模型算法。\n\
  \n\n\n#### 鸢尾花演示 – 第二部分\n\n以下列出的 Python 脚本名为 `irisDemoTest.py`，其创建目的是使用鸢尾花数据集测试多个模型，并确定它们在给定一组鸢尾花属性时描述鸢尾花种类的准确程度。测试将按照与第一部分类似的方式分步骤进行。这些步骤包括：\n\
  \n*   导入所有模型。\n*   创建训练集和验证集。\n*   使用十折交叉验证设置测试框架。\n*   使用六种不同的模型根据属性测量值描述鸢尾花种类。\n\
  *   选择一个准确的模型。\n\n以下列出的 Python 脚本名为 `irisDemoTest.py`，可从本书的配套网站获取。我将在代码清单之后讨论脚本中与各步骤相关的部分。\n\
  \n```\n# Usage\n# python irisDemoTest.py\n# Load libraries\nimport pandas\nfrom\
  \ pandas.plotting import scatter_matrix\nimport matplotlib.pyplot as plt\nfrom sklearn\
  \ import model_selection\nfrom sklearn.metrics import classification_report\nfrom\
  \ sklearn.metrics import confusion_matrix\nfrom sklearn.metrics import accuracy_score\n\
  from sklearn.linear_model import LogisticRegression\nfrom sklearn.tree import DecisionTreeClassifier\n\
  from sklearn.neighbors import KNeighborsClassifier\nfrom sklearn.discriminant_analysis\
  \ import LinearDiscriminantAnalysis\nfrom sklearn.naive_bayes import GaussianNB\n\
  from sklearn.svm import SVC\n# Load dataset\nurl = \"https://raw.githubusercontent.com/jbrownlee/Datasets/master/iris.csv\"\
  \nnames = ['sepal-length', 'sepal-width', 'petal-length', 'petal-width', 'class']\n\
  dataset = pandas.read_csv(url, names=names)\n# Create training and validation datasets\n\
  array = dataset.values\nX = array[:,0:4]\nY = array[:,4]\nvalidation_size = 0.20\n\
  seed = 7\nX_train, X_validation, Y_train, Y_validation = model_selection.train_test_split(X,\
  \ Y, test_size=validation_size, random_state=seed)\n# Set the scoring criteria\n\
  scoring = 'accuracy'\n# Build all the models\nmodels = []\nmodels.append(('LR',\
  \ LogisticRegression(solver='liblinear', multi_class=\"ovr\")))\nmodels.append(('LDA',\
  \ LinearDiscriminantAnalysis()))\nmodels.append(('KNN', KNeighborsClassifier()))\n\
  models.append(('CART', DecisionTreeClassifier()))\nmodels.append(('NB', GaussianNB()))\n\
  models.append(('SVM', SVC(gamma='auto')))\n# Evaluate each model\nresults = []\n\
  names = []\nfor name, model in models:\nkfold = model_selection.KFold(n_splits=10,\
  \ random_state=seed)\ncv_results = model_selection.cross_val_score(model, X_train,\
  \ Y_train, cv=kfold, scoring=scoring)\nresults.append(cv_results)\nnames.append(name)\n\
  msg = \"%s: %f(%f)\" % (name, cv_results.mean(), cv_results.std())\nprint(msg)\n\
  ```\n\n与第一个脚本相比，导入列表发生了很大变化。现在它包含了来自 `sklearn` 包的六个模型。按字母顺序排列的模型列表如下：\n\n*   `DecisionTreeClassifier`\n\
  *   `GaussianNB`\n*   `KNeighborsClassifier`\n*   `LinearDiscriminantAnalysis`\n\
  *   `LogisticRegression`\n*   `SVC`\n\n如前所述，我不会讨论模型功能的任何具体细节。\n\n然后，数据集以与第一个脚本完全相同的方式加载。使用这个精确的数据集很重要，这是我尝试使用来自不同来源的鸢尾花数据集后发现的。我怀疑在使用新数据集时，格式上的微小变化是导致问题的原因。\n\
  \n脚本的下一部分涉及创建训练集和验证集的步骤。原始数据集的 80% 将用于模型训练，20% 将分配给验证。在验证过程中，原始数据的一小部分子集将被输入到尚未使用该子集进行训练的模型中。然后，将模型产生的输出与验证集中每条记录的物种标签进行比较。百分比准确率将计算为正确识别的物种数量与数据集中记录总数之间的简单比率。\n\
  \n测试过程的下一步是建立一个循环，为每个模型实现十折交叉验证过程。这意味着输入数据集最初被分成十份，其中九份用于训练，仅使用第十份进行验证。记录结果后，数据集再次被随机分成十份，该过程总共重复十次，因此得名“十折”。我确实想指出一点可能让读者感到困惑的地方。十折交叉验证过程中使用的数据集仅是训练数据集，而不是验证数据集。验证数据集将不会使用，直到讨论下一个脚本，其中将详细讨论模型的预测准确率。\n\
  \n脚本中的循环为每个模型运行交叉验证分数。结果如图 1-25 所示。\n\n![../images/482214_1_En_1_Chapter/482214_1_En_1_Fig25_HTML.jpg](img/482214_1_En_1_Fig25_HTML.jpg)\n\
  \n图 1-25\n\n六个模型的交叉验证分数\n\n你可以看到它们的分数都在 90 多分，这意味着在给定一组类别属性的情况下，它们很可能都是鸢尾花种类的良好描述器。括号中的数字是每个模型结果的标准差。你应该能够看到偏差相对较小，这意味着这些模型再次成为良好的描述器。查看该图，支持向量机（SVM）模型似乎取得了最佳结果，得分为\
  \ 0.991667，标准差仅为 0.025。但它真的是最适合我们目的的模型吗？这将在本演示的第三部分中讨论。\n\n\n\n#### 鸢尾花演示 – 第 3\
  \ 部分\n\n接下来的讨论通过箱线图比较了六种模型的准确率。所使用的脚本名为 `irisDemoSelection.py`，除了增加了绘图函数以及一些用于详细展示选定模型性能的算法外，该脚本与之前的脚本基本相同。脚本中还移除了六种模型的准确率显示：\n\
  \n```\n# 加载库\nimport pandas\nfrom pandas.plotting import scatter_matrix\nimport\
  \ matplotlib.pyplot as plt\nfrom sklearn import model_selection\nfrom sklearn.metrics\
  \ import classification_report\nfrom sklearn.metrics import confusion_matrix\nfrom\
  \ sklearn.metrics import accuracy_score\nfrom sklearn.linear_model import LogisticRegression\n\
  from sklearn.tree import DecisionTreeClassifier\nfrom sklearn.neighbors import KNeighborsClassifier\n\
  from sklearn.discriminant_analysis import LinearDiscriminantAnalysis\nfrom sklearn.naive_bayes\
  \ import GaussianNB\nfrom sklearn.svm import SVC\n# 加载数据集\nurl = \"https://raw.githubusercontent.com/jbrownlee/Datasets/master/iris.csv\"\
  \nnames = ['sepal-length', 'sepal-width', 'petal-length', 'petal-width', 'class']\n\
  dataset = pandas.read_csv(url, names=names)\n# 创建训练集和验证集\narray = dataset.values\n\
  X = array[:,0:4]\nY = array[:,4]\nvalidation_size = 0.20\nseed = 7\nX_train, X_validation,\
  \ Y_train, Y_validation = model_selection.train_test_split(X, Y, test_size=validation_size,\
  \ random_state=seed)\n# 设置评分标准\nscoring = 'accuracy'\n# 构建所有模型\nmodels = []\nmodels.append(('LR',\
  \ LogisticRegression(solver='liblinear', multi_class=\"ovr\")))\nmodels.append(('LDA',\
  \ LinearDiscriminantAnalysis()))\nmodels.append(('KNN', KNeighborsClassifier()))\n\
  models.append(('CART', DecisionTreeClassifier()))\nmodels.append(('NB', GaussianNB()))\n\
  models.append(('SVM', SVC(gamma='auto')))\n# 评估每个模型\nresults = []\nnames = []\n\
  for name, model in models:\nkfold = model_selection.KFold(n_splits=10, random_state=seed)\n\
  cv_results = model_selection.cross_val_score(model, X_train, Y_train, cv=kfold,\
  \ scoring=scoring)\nresults.append(cv_results)\nnames.append(name)\n# 绘制模型结果\nfigure\
  \ = plt.figure()\nfigure.suptitle('Algorithm Comparison')\nalgPlot = figure.add_subplot(1,\
  \ 1, 1)\nplt.boxplot(results)\nalgPlot.set_xticklabels(names)\nplt.show()\n# KNN\
  \ 预测\nknn = KNeighborsClassifier()\nknn.fit(X_train, Y_train)\npredictions = knn.predict(X_validation)\n\
  print(accuracy_score(Y_validation, predictions))\nprint(confusion_matrix(Y_validation,\
  \ predictions))\nprint(classification_report(Y_validation, predictions)\n```\n\n\
  图 1-26 以箱线图的形式展示了所有模型的结果。\n\n![../images/482214_1_En_1_Chapter/482214_1_En_1_Fig26_HTML.jpg](img/482214_1_En_1_Fig26_HTML.jpg)\n\
  \n**图 1-26**\n\n模型结果的箱线图\n\n你可以观察到，箱线图在 y 轴范围的顶部被压缩，这表明有一半的模型达到了或接近 100% 的准确率。在这种情况下，选择表现最佳的模型几乎是不可能的；不过，我确实选择了\
  \ KNN 模型来更详细地检查其性能。KNN 是一个简单且准确的模型。KNN 模型的正式名称是 K-近邻算法，它是现有最简单的分类算法之一，并且很可能是使用最广泛的算法之一。KNN\
  \ 是一种非参数、懒惰学习算法。它主要用于数据点被分成多个类别的数据集，以预测新数据点或样本的分类。简单来说，KNN 被描述为一种实现“告诉我你的邻居是谁，我就告诉你你是谁”这句口号的算法。\n\
  \n我将 KNN 描述为非参数模型，这意味着该模型不对底层数据分布做任何假设。换句话说，模型结构是由数据决定的。鉴于此，当你对数据分布知之甚少或一无所知时，KNN\
  \ 可能应该是你进行分类研究的首选之一。\n\nKNN 也是一种懒惰算法，与急切算法相对。这意味着它不使用训练数据点进行任何泛化。换句话说，没有明确的训练阶段，或者训练阶段非常少。这意味着任何训练阶段的持续时间都可能很短，这对于大型数据集来说是一个重要的点。缺乏泛化也意味着\
  \ KNN 会保留所有训练数据。更准确地说，没有泛化意味着在验证/测试阶段会使用大部分（如果不是全部）训练数据。\n\nKNN 算法基于特征相似性。这意味着样本外特征与训练集的相似程度决定了给定数据点如何被分类。通过查看图\
  \ 1-27（一个 KNN 分类的图形示例），这个过程应该会更清晰。\n\n![../images/482214_1_En_1_Chapter/482214_1_En_1_Fig27_HTML.jpg](img/482214_1_En_1_Fig27_HTML.jpg)\n\
  \n**图 1-27**\n\nKNN 分类\n\n测试样本（内圈内）可以被分类到第一类（蓝色方块）或第二类（红色三角形）。如果 k = 3（外圈），它被分配到第二类，因为内圈内有\
  \ 2 个三角形和只有 1 个方块。例如，如果 k = 5，新样本将被分配到第一类（外圈外有 3 个方块 vs. 2 个三角形）。\n\n脚本的最后一部分直接使用验证数据集运行\
  \ KNN 模型。最终准确率得分、混淆矩阵和分类报告的汇总结果如图 1-28 所示。\n\n![../images/482214_1_En_1_Chapter/482214_1_En_1_Fig28_HTML.jpg](img/482214_1_En_1_Fig28_HTML.jpg)\n\
  \n**图 1-28**\n\nKNN 模型验证结果\n\n第一行显示准确率得分为 0.9 或 90%。这个准确率得分是一个汇总评级，显示了正确预测数量与整个数据集大小的比率。在这种情况下，数据集有\
  \ 30 条记录，正确预测的数量是 27，从而产生了 0.9 的结果。回想一下，这个准确率得分是基于使用验证数据集（占原始鸢尾花数据集的 20%）得出的。图 1-28\
  \ 中显示的准确率得分由于十折交叉验证测试的性质而被人为地提高了。这个较低的准确率得分反映了真实世界的情况，应该被认为更可信。\n\n混淆矩阵（误差矩阵）指出了三个错误发生的位置。表\
  \ 1-1 详细列出了实际类别与预测类别的对比。\n\n**表 1-1**\n\n实际类别与预测类别\n\n|   | 实际类别 |\n| --- | ---\
  \ |\n| 山鸢尾 | 变色鸢尾 | 维吉尼亚鸢尾 |\n| --- | --- | --- |\n| 预测类别 | 山鸢尾 | 7 | 0 | 0 |\n\
  | 变色鸢尾 | 0 | 11 | 1 |\n| 维吉尼亚鸢尾 | 0 | 2 | 9 |\n\n最后，由 sklearn 指标提供的分类报告按精确率、召回率、F1\
  \ 分数和支持度对类别结果进行了细分。尽管验证数据集很小，但该报告显示的结果非常好甚至极好。我在表 1-2 中解释了每个指标。\n\n**表 1-2**\n\n\
  sklearn 指标分析\n\n| 指标 | 山鸢尾 | 变色鸢尾 | 维吉尼亚鸢尾 | 备注（参见注释） |\n| --- | --- | --- | ---\
  \ | --- |\n| 精确率 | 1.00 | 0.85 | 0.90 | 精确率 = tp / (tp + fp) |\n| 召回率 | 1.00 | 0.92\
  \ | 0.82 | 召回率 = tp / (tp + fn) |\n| F1 分数 | 1.00 | 0.88 | 0.86 | 均值(精确率 + 召回率)\
  \ |\n| 支持度 | 7 | 12 | 11 | 类别大小 |\n\n\n\n*注：tp = 真正例*\n\n*fp = 假正例*\n\n*fn = 假负例*\n\
  \n精确率直观上表示分类器不会将负样本错误标记为正样本的能力。\n\n召回率直观上表示分类器找出所有正样本的能力。\n\nF1 分数（F-beta）可以理解为精确率和召回率的加权调和平均值，F-beta\
  \ 分数的最佳值为 1，最差值为 0。\n\n关于微平均、宏平均和加权平均的更多内容，请参考 sklearn 文档。页面地址为：\n\n[`https://scikit-learn.org/stable/modules/generated/sklearn.metrics.precision_recall_fscore_support.html`](https://scikit-learn.org/stable/modules/generated/sklearn.metrics.precision_recall_fscore_support.html)\n\
  \n"
- "# 2. 机器学习数据模型探索：第一部分\n\n本章主要讨论和演示机器学习中使用的基本数据模型。但在深入数据模型操作的核心之前，我需要先向你展示如何安装 OpenCV\
  \ 4 和 Seaborn 软件包。这两个软件包都是正确支持基本数据模型运行和可视化所必需的。它们还将支持本书后续章节中介绍的其他演示。\n\n## 安装 OpenCV\
  \ 4\n\n本节介绍如何安装开源 OpenCV 软件包。我将使用 OpenCV 进行各种机器学习演示，包括利用该软件包中包含的丰富可视化工具。OpenCV 4\
  \ 是最新版本，目前还不能从任何主流仓库直接下载安装。必须以源代码格式加载并在本地构建。以下说明将指导你完成此任务。务必严格按照这些说明操作，否则 OpenCV\
  \ 安装很可能不会成功。\n\n第一步是安装 CMake 工具以及其他三个关键工具。输入以下命令：\n\n```\nsudo apt-get install build-essential\
  \ cmake unzip pkg-config\n```\n\n接下来，安装三个支持最流行图像格式（jpeg、png 和 tiff）的图像和视频库。输入以下命令：\n\
  \n```\nsudo apt-get install libjpeg-dev libpng-dev libtiff-dev\n```\n\n为了确保上述命令成功执行，请先根据以下命令更新\
  \ apt-get：\n\n```\nsudo apt-get update\n```\n\n现在安装三个用于常见视频处理功能的图像处理工具。输入以下命令。同样，请确保\
  \ apt-get 已更新。\n\n```\nsudo apt-get install libavcodec-dev libavformat-dev libswscale-dev\n\
  ```\n\n接下来安装两个补充视频处理库。输入以下命令：\n\n```\nsudo apt-get install libxvidcore-dev libx264-dev\n\
  ```\n\n下一条命令安装 GTK 库。GTK 将用于实现 OpenCV 的 GUI 后端。输入以下命令：\n\n```\nsudo apt-get install\
  \ libgtk2.0-dev\n```\n\n下一条命令减少或消除不必要的 GTK 警告。命令中的“*”确保加载支持 ARM 处理器的正确模块。输入以下命令：\n\
  \n```\nsudo apt-get install libcanberra-gtk*\n```\n\n接下来的两个软件包用于 OpenCV 的数值优化。输入以下命令：\n\
  \n```\nsudo apt-get install libatlas-base-dev gfortran\n```\n\n一旦所有上述依赖项加载完毕，你就可以准备下载\
  \ OpenCV 4 源代码了。\n\n### 下载 OpenCV 4 源代码\n\n在开始下载之前，请确保你处于虚拟环境中，并且位于主目录下。如果你不在主目录，请输入以下命令前往：\n\
  \n```\ncd ~\n```\n\n接下来，使用 wget 命令下载最新的 OpenCV 和 opencv_contrib 模块。在撰写本文时，最新版本是\
  \ 4.0.1。当你尝试下载时，版本可能不同。只需将本文中出现的版本号替换为最新版本即可。opencv_contrib 模块包含开源社区贡献的补充函数，本书的项目和演示中将用到这些函数。输入以下命令从\
  \ GitHub 网站下载 OpenCV 压缩文件：\n\n```\nwget -O opencv.zip https://github.com/opencv/opencv/archive/4.0.1.zip\n\
  ```\n\n输入以下命令从 GitHub 网站下载 opencv_contrib 压缩文件：\n\n```\nwget -O opencv_contrib.zip\
  \ https://github.com/opencv/opencv_contrib/archive/4.0.1.zip\n```\n\n现在需要使用以下命令解压并展开下载的文件：\n\
  \n```\nunzip opencv.zip\nunzip opencv_contrib.zip\n```\n\n接下来，将新生成的目录重命名为以下名称，以便于访问\
  \ OpenCV 包和函数，并确保目录名称符合 CMake 配置文件的预期。输入以下命令：\n\n```\nmv opencv-4.0.1 opencv\nmv\
  \ opencv_contrib-4.0.1 opencv_contrib\n```\n\n源代码下载完成后，你就可以开始构建 OpenCV 包了。\n\n###\
  \ 构建 OpenCV 软件\n\n在开始构建之前，你需要确保已安装 numpy 库。我在第 1 章中讨论了如何安装 numpy 以及其他几个依赖项。如果你尚未安装\
  \ numpy，可以使用以下命令轻松安装：\n\n```\npip install numpy\n```\n\n下一步是设置一个用于构建的目录。通过输入以下命令创建并进入构建目录：\n\
  \n```\ncd ~/opencv\nmkdir build\ncd build\n```\n\n完成上述命令后，输入以下命令以运行带有多个构建选项的 CMake\
  \ 命令。请注意，“\\”符号（反斜杠）是必需的，以便命令行解释器（CLI）识别出单个命令跨越多行。不要忽略以下复杂命令末尾的两个句点。这两个句点指示 CLI\
  \ 执行句点之前输入的所有内容。\n\n```\ncmake -D CMAKE_BUILD_TYPE=RELEASE \\\n-D CMAKE_INSTALL_PREFIX=/usr/local\
  \ \\\n-D OPENCV_EXTRA_MODULES_PATH=~/opencv_contrib/modules \\\n-D ENABLE_NEON=ON\
  \ \\\n-D ENABLE_VFPV3=ON \\\n-D BUILD_TESTS=OFF \\\n-D OPENCV_ENABLE_NONFREE=ON\
  \ \\\n-D INSTALL_PYTHON_EXAMPLES=OFF \\\n-D BUILD_EXAMPLES=OFF ..\n```\n\n\n\n###\
  \ 注意\n\n选项 `OPENCV_ENABLE_NONFREE=ON` 确保在编译步骤中所有第三方功能均可用。图 2-1 结果屏幕中的一行\n\n`\"Non-free\
  \ algorithms:   YES\"`\n\n确认了该条件已设置。\n\n![../images/482214_1_En_2_Chapter/482214_1_En_2_Fig1_HTML.jpg](img/482214_1_En_2_Fig1_HTML.jpg)\n\
  \n图 2-1\n\n非自由算法可用性确认\n\n拥有非自由算法适用于非商业应用。如果您打算开发用于销售或授权的应用程序，则必须遵守所有适用的许可协议。OpenCV\
  \ 软件包中包含若干专利算法，未经支付版税不得用于商业开发。\n\n您还应确认虚拟环境指向 Python 3 和 numpy 的正确目录。图 2-2 显示了 cv\
  \ 虚拟环境中的正确目录。\n\n![../images/482214_1_En_2_Chapter/482214_1_En_2_Fig2_HTML.jpg](img/482214_1_En_2_Fig2_HTML.jpg)\n\
  \n图 2-2\n\npy3cv4_1 虚拟环境中 Python 3 和 numpy 目录的确认\n\n默认的 100 MB 磁盘交换空间必须更改为 2048\
  \ MB 才能成功编译。编译完成后，交换空间将恢复为默认值。重要的是要认识到，交换空间大小对用作 RasPi 辅助存储器的 micro SD 卡的寿命有显著影响。这些卡在失效前具有有限的写入操作次数。写入操作次数会随着交换空间大小的增加而急剧增加。对于此一次性过程，更改交换空间大小不会对卡寿命产生影响。首先使用\
  \ nano 编辑器打开交换配置文件进行编辑，如下所示：\n\n```\nsudo nano /etc/dphys-swapfile\n```\n\n接下来注释掉\
  \ `CONF_SWAPSIZE=100` 这一行，并添加 `CONF_SWAPSIZE=2048` 这一行。重要的是添加额外的一行，而不是仅仅将 100 改为\
  \ 2048。完成编译后，您将撤销此更改。文件修改后的部分如下所示：\n\n```\n# set size to absolute value, leaving\
  \ empty (default) then uses computed value\n# you most likely don't want this, unless\
  \ you have a special disk situation\n# CONF_SWAPSIZE=100\nCONF_SWAPSIZE=2048\n```\n\
  \n### 注意\n\n未能更改交换空间大小可能会导致 RasPi 在编译期间“死机”。\n\n进行编辑后，您需要使用以下命令停止并启动交换服务：\n\n```\n\
  sudo /etc/init.d/dphys-swapfile stop\nsudo /etc/init.d/dphys-swapfile start\n```\n\
  \n下一步是从源代码编译为二进制文件。使用所有四个 RasPi 核心大约需要 1.5 小时。您应该注意一个称为竞态条件的问题，当特定核心需要另一个核心当前正在使用的资源时，该问题可能随机发生。该问题是由于非常严格的时序问题导致的，即使用中的核心无法释放资源，而请求核心也不放弃对该资源的请求。结果是处理器“永远”挂起。这是一个非常糟糕的情况。幸运的是，有一个解决方案，即不强制使用四个核心。我不知道完整编译需要多长时间，但怀疑至少需要\
  \ 3 小时。使用四个核心编译的命令是\n\n```\nmake -j4\n```\n\n不使用任何特定核心数量进行编译的命令就是 `make`。\n\n有个好消息是，如果初始编译在使用\
  \ `-j4` 选项时挂起，您可以仅使用 `make` 命令重新编译，系统会找到并使用所有已编译的代码。这将大大缩短编译时间。我知道这是真的，因为我亲身经历过。我的第一次编译在\
  \ 100% 时挂起。我仅使用 `make` 命令重新启动编译，它在大约 15 分钟内成功完成。图 2-3 显示了成功编译后的屏幕。\n\n![../images/482214_1_En_2_Chapter/482214_1_En_2_Fig3_HTML.jpg](img/482214_1_En_2_Fig3_HTML.jpg)\n\
  \n图 2-3\n\n成功编译\n\n通过输入以下命令完成 OpenCV 4 的安装：\n\n```\nsudo make install\nsudo ldconfig\n\
  ```\n\n这是最后一步，包含一些收尾和验证操作。首先，通过取消注释以下行将交换空间大小恢复为原始的 100 MB：\n\n```\nCONF_SWAPSIZE=100\n\
  ```\n\n并注释掉新添加的行：\n\n```\n# CONF_SWAPSIZE=2048\n```\n\n接下来，为 OpenCV 创建一个符号链接，以便虚拟环境中创建的新\
  \ Python 脚本可以使用它。输入以下命令：\n\n```\ncd ~/.virtualenvs/py3cv4_1/lib/python3.5/site-packages/\n\
  ln -s /usr/local/lib/python3.5/site-packages/cv2/python-3.5/cv2.cpython-35m-arm-linux-gnueabihf.so\
  \  cv2.so\ncd ~\n```\n\n未能创建符号链接意味着您将无法访问任何 OpenCV 函数。\n\n最后，通过输入以下命令测试您完成的安装：\n\
  \n```\nsource ~/.profile\nworkon cv\npython\n>>> import cv2\n>>> cv2.__version__\n\
  '4.0.1'\n>>> exit()\n```\n\n前两个命令启动 py3cv4_1 虚拟环境。下一个命令启动与此环境关联的 Python 解释器，即 Python\
  \ 3。接下来的命令使用您刚刚创建的符号链接导入 OpenCV。这一行应能说明符号链接的重要性。再下一个命令请求 OpenCV 版本，返回结果为 4.0.1，如版本请求的下一行所示。最后一个命令退出\
  \ Python 解释器。图 2-4 显示了 py3cv4_1 版本验证。\n\n![../images/482214_1_En_2_Chapter/482214_1_En_2_Fig4_HTML.jpg](img/482214_1_En_2_Fig4_HTML.jpg)\n\
  \n图 2-4\n\npy3cv4_1 版本验证\n\n至此，您应该拥有一个在 Python 虚拟环境中运行且功能完备的 OpenCV 软件包。要退出 OpenCV，只需关闭终端窗口即可。\n\
  \n\n\n### Seaborn 数据可视化库\n\n正如我在前一章所讨论的，在处理机器学习模型时，数据可视化是一个重要步骤。有许多有用的 Python 兼容工具和软件包可以帮助你完成这项任务。希望你已经在上一章描述的依赖加载过程中安装了\
  \ Matplotlib 库。OpenCV 包也包含有用的可视化例程和算法。在本节中，我将介绍 Seaborn 库，这是另一个有用的数据可视化工具，被认为是 Matplotlib\
  \ 和 OpenCV 中数据可视化功能的补充。\n\nSeaborn 专门针对统计数据可视化。它使用的参数集也与 Matplotlib 不同。\n\n本节需要的第一步是安装\
  \ Seaborn 软件包。只需输入以下命令即可轻松完成：\n\n```\npip install seaborn\n```\n\n图 2-5 显示了安装 Seaborn\
  \ 软件包的结果。你应该从图中注意到，Seaborn 包需要相当多的依赖项，包括 numpy、Pandas、Matplotlib、scipy、kiwisolver\
  \ 以及其他几个 Python 工具。\n\n![../images/482214_1_En_2_Chapter/482214_1_En_2_Fig5_HTML.jpg](img/482214_1_En_2_Fig5_HTML.jpg)\n\
  \n图 2-5\n\nSeaborn 包安装结果\n\n安装完成后，我认为解释 Seaborn 最简单的方法是使用它来可视化第 1 章中介绍的鸢尾花数据集。Seaborn\
  \ 一个非常方便的特性是，该包中直接包含有限数量的数据集。鸢尾花数据集就是这些原生数据集之一（并非双关语）。要使用鸢尾花数据集，你只需在脚本中加入以下语句：\n\
  \n```\nimport seaborn as sns\niris = sns.load_dataset(\"iris\")\n```\n\n其中 `sns`\
  \ 是对 Seaborn 导入的引用。\n\nSeaborn 包中有 15 个可用数据集。现列出如下供你参考：\n\n*   anscombe\n*   attention\n\
  *   brain_networks\n*   car_crashes\n*   diamonds\n*   dots\n*   exercise\n*   flights\n\
  *   fmri\n*   gammas\n*   iris\n*   mpg\n*   planets\n*   tips\n*   titanic\n\n\
  从名称来看，Seaborn 数据集多种多样且有些不同寻常。它们显然是为了展示 Seaborn 包在分析和可视化方面的能力而选择的。除了鸢尾花数据集之外，我将在数据模型讨论中使用其中一些数据集。\n\
  \n表 2-1 显示了鸢尾花数据集的前五条记录，该表由以下命令生成：\n\n表 2-1\n\n鸢尾花数据集的 head 命令结果\n\n| 记录编号 | 花萼长度\
  \ | 花萼宽度 | 花瓣长度 | 花瓣宽度 | 物种 |\n| --- | --- | --- | --- | --- | --- |\n| 0 | 5.1\
  \ | 3.5 | 1.4 | 0.2 | Setosa |\n| 1 | 4.9 | 3.0 | 1.4 | 0.2 | Setosa |\n| 2 | 4.7\
  \ | 3.2 | 1.3 | 0.2 | Setosa |\n| 3 | 4.6 | 3.1 | 1.5 | 0.2 | Setosa |\n| 4 | 5.0\
  \ | 3.6 | 1.4 | 0.2 | Setosa |\n\n```\niris.head()\n```\n\n在选择最能处理数据集的数据模型时，数据可视化是一个重要的初始步骤。Seaborn\
  \ 提供了多种数据可视化方式来帮助你完成这项关键任务。我将介绍一系列有助于你进行数据可视化的脚本。以下所有脚本都将使用多变量鸢尾花数据集。\n\n#### 散点图\n\
  \n从散点图开始数据可视化过程可能是处理数据可视化任务最简单的方法。散点图本质上是二维图，使用数据集的两个分量作为坐标对进行绘制。Seaborn 包使用 `jointplot`\
  \ 方法作为绘图函数，以表明图的二维性质。我使用了以下名为 jointPlot.py 的脚本来创建花萼长度与花瓣高度的散点图。此脚本可从本书的配套网站获取：\n\
  \n```\n# 导入所需库\nimport matplotlib.pyplot as plt\nimport seaborn as sns\n# 加载鸢尾花数据集\n\
  iris = sns.load_dataset(\"iris\")\n# 生成散点图\nsns.jointplot(x=\"sepal_length\",y=\"\
  sepal_width\", data=iris,size=6)\n# 显示图形\nplt.show()\n```\n\n通过输入以下命令运行脚本：\n\n```\n\
  python jointPlot.py\n```\n\n图 2-6 显示了运行此脚本的结果。\n\n![../images/482214_1_En_2_Chapter/482214_1_En_2_Fig6_HTML.jpg](img/482214_1_En_2_Fig6_HTML.jpg)\n\
  \n图 2-6\n\n花萼长度与花萼高度的散点图（所有物种）\n\n查看该图，你可以很容易地看到数据点散布在整个图中，这表明这两个数据集分量之间没有强相关性。顶部的花萼长度直方图显示值分布较广，而右侧的花萼宽度直方图则显示峰值中值约为\
  \ 3.0。请注意，此图涵盖了所有鸢尾花物种，并且可能掩盖了一个或多个单个物种的现有数据关系。正如你稍后将看到的，其他可视化工具可以揭示隐藏的关系。\n\n####\
  \ 分面网格图\n\n分面网格图是上一节中介绍的散点图的一种变体。然而，在分面网格图中，所有数据集分量都被清晰地标识出来，而不是像散点图中那样未分类且模糊不清。我使用了以下名为\
  \ facetGridPlot.py 的脚本来创建花萼长度与花瓣高度的分面网格图。此脚本可从本书的配套网站获取：\n\n```\n# 导入所需库\nimport\
  \ matplotlib.pyplot as plt\nimport seaborn as sns\n# 加载鸢尾花数据集\niris = sns.load_dataset(\"\
  iris\")\n# 生成分面网格图\nsns.FacetGrid(iris,hue=\"species\",size=6) \\\n.map(plt.scatter,\"\
  sepal_length\",\"sepal_width\") \\\n.add_legend()\n# 显示图形\nplt.show()\n```\n\n通过输入以下命令运行脚本：\n\
  \n```\npython facetGridPlot.py\n```\n\n图 2-7 显示了运行此脚本的结果。\n\n![../images/482214_1_En_2_Chapter/482214_1_En_2_Fig7_HTML.jpg](img/482214_1_En_2_Fig7_HTML.jpg)\n\
  \n图 2-7\n\n花萼长度与花萼高度的分面网格图\n\n我承认，在出版的书中，灰度图可能难以辨认，但你应该能够辨别出图中左上角的一组点似乎形成了有意义的关系，其中可以画一条线性斜线穿过这组点来表示这种关系。这些点都来自山鸢尾物种。\n\
  \n同样的这组点也在图 2-6 中绘制过，但那里没有根据点所代表的物种进行区分，因此这种关系不容易被识别。可视化可能的关系是选择合适数据模型的重要第一步。在这种情况下，对此特定数据子集使用线性回归模型将是一个不错的选择。我将在本章后面讨论线性回归数据模型。\n\
  \n图 2-7 中剩余的点属于其他鸢尾花物种，据我所知，它们似乎没有任何明显的视觉关系。不过，我仍将继续向你展示一些可能有助于分析的附加图表。\n\n\n\n\
  #### 箱线图\n\n箱线图在前一章中首次被介绍；不过，当时我是用 Matplotlib 包来生成这些图的。下面的箱线图是通过一个名为 `boxplot` 的\
  \ Seaborn 方法生成的。实际上，我怀疑这个图很可能还是由 Matplotlib 软件创建的，因为 Seaborn 包与 Matplotlib 有着紧密的联系。\n\
  \n我使用了以下名为 `boxPlot.py` 的脚本来为所有鸢尾花种类的花萼长度属性创建箱线图。该脚本可从本书的配套网站获取：\n\n```\n# 导入所需的库\n\
  import matplotlib.pyplot as plt\nimport seaborn as sns\n# 加载鸢尾花数据集\niris = sns.load_dataset(\"\
  iris\")\n# 生成箱线图\nsns.boxplot(x=\"species\",y=\"sepal_length\", data=iris)\n# 显示图形\n\
  plt.show()\n```\n\n通过输入以下命令运行该脚本：\n\n```\npython boxPlot.py\n```\n\n图 2-8 展示了运行此脚本的结果。\n\
  \n![../images/482214_1_En_2_Chapter/482214_1_En_2_Fig8_HTML.jpg](img/482214_1_En_2_Fig8_HTML.jpg)\n\
  \n图 2-8\n\n所有鸢尾花种类的花萼长度箱线图\n\n箱线图本质上属于单变量图，因为它们仅基于单一数据集维度（即一维）创建。尽管如此，它们能提供关于数据集属性范围、方差和均值的重要见解。箱线图有助于识别数据异常值，这些异常值很容易干扰某些数据模型，进而导致在使用这些模型时，若无意中将具有破坏性的异常值作为输入，会产生不可预测和不确定的结果。\n\
  \n#### 带状图\n\n带状图可以被视为增强版的箱线图，因为它不仅包含底层的箱线图，还显示了构成该箱线图的实际数据点。通常情况下，这些数据点会沿着每个数据集类别的单条垂直线绘制；然而，Seaborn\
  \ 的 `stripplot` 方法提供了一个抖动选项，可以将数据点随机偏离垂直线。这种随机抖动不会影响数据显示，因为纵轴是唯一用于识别数据点值的坐标轴。在研究了示例图之后，这个概念应该会变得清晰。\n\
  \n我使用了以下名为 `stripPlot.py` 的脚本来为所有鸢尾花种类的花萼长度属性创建带状图。该脚本可从本书的配套网站获取：\n\n```\n# 导入所需的库\n\
  import matplotlib.pyplot as plt\nimport seaborn as sns\n# 加载鸢尾花数据集\niris = sns.load_dataset(\"\
  iris\")\n# 生成带状图\nax = sns.boxplot(x=\"species\",y=\"sepal_length\", data=iris)\n\
  ax = sns.stripplot(x=\"species\", y=\"sepal_length\", data=iris, jitter=True, edgecolor=\"\
  gray\")\n# 显示图形\nplt.show()\n```\n\n通过输入以下命令运行该脚本：\n\n```\npython stripPlot.py\n\
  ```\n\n图 2-9 展示了运行此脚本的结果。\n\n![../images/482214_1_En_2_Chapter/482214_1_En_2_Fig9_HTML.jpg](img/482214_1_En_2_Fig9_HTML.jpg)\n\
  \n图 2-9\n\n所有鸢尾花种类的花萼长度带状图\n\n我之前关于箱线图的评论同样适用于此。带状图只是提供了一些额外的见解，展示了构成箱线图的数据点是如何在记录的数值范围内分布的。\n\
  \n#### 小提琴图\n\n小提琴图与箱线图类似，不同之处在于，代表数据集类别数据的垂直线两侧各有一个旋转的核密度图。这些核密度图表示数据在不同数值处的概率密度，并通过核密度估计函数进行平滑处理。在查看图形后，这个图奇特的名字应该就显而易见了。\n\
  \n我使用了以下名为 `violinPlot.py` 的脚本来为所有鸢尾花种类的花萼长度属性创建小提琴图。该脚本可从本书的配套网站获取：\n\n```\n# 导入所需的库\n\
  import matplotlib.pyplot as plt\nimport seaborn as sns\n# 加载鸢尾花数据集\niris = sns.load_dataset(\"\
  iris\")\n# 生成小提琴图\nsns.violinplot(x=\"species\",y=\"sepal_length\", data=iris, size=6)\n\
  # 显示图形\nplt.show()\n```\n\n通过输入以下命令运行该脚本：\n\n```\npython violinPlot.py\n```\n\n\
  图 2-10 展示了运行此脚本的结果。\n\n![../images/482214_1_En_2_Chapter/482214_1_En_2_Fig10_HTML.jpg](img/482214_1_En_2_Fig10_HTML.jpg)\n\
  \n图 2-10\n\n所有鸢尾花种类的花萼长度小提琴图\n\n小提琴图克服了箱线图固有的一个大问题。箱线图可能会产生误导，因为它不受原始数据分布的影响。当底层数据集改变形状或本质上“变形”时，箱线图可以轻松地保持其先前的统计量，包括中位数和范围。而小提琴图则会在包含相同箱线图统计量的同时，反映任何新的形状或数据分布。\n\
  \n小提琴图的“小提琴”形状来源于类别数据集的密度图。密度图被旋转 90 度，并放置在箱线图的两侧，相互镜像。解读小提琴形状的方式与解读密度图完全相同。较厚的部分意味着小提琴图该区域的数值具有更高的出现频率或概率，而较薄的部分则意味着频率或概率较低。\n\
  \n小提琴图相对容易阅读。中间的圆点代表中位数。箱体代表四分位距。须线显示 95% 的置信区间。小提琴的形状展示了数值的频率。图 2-10 中显示的图例指出了这些特征。\n\
  \n#### KDE 图\n\nKDE 图仅显示数据集类别的密度图。KDE 是核密度估计（kernel density estimators）的缩写，它正是小提琴图中使用的相同图形。如果你只关注数据分布而非数据统计量（如箱线图或小提琴图的情况），那么\
  \ KDE 图最为有用。\n\n我使用了以下名为 `kdePlot.py` 的脚本来为所有鸢尾花种类的花萼长度属性创建 KDE 图。该脚本可从本书的配套网站获取：\n\
  \n```\n# 导入所需的库\nimport matplotlib.pyplot as plt\nimport seaborn as sns\n# 加载鸢尾花数据集\n\
  iris = sns.load_dataset(\"iris\")\n# 生成 KDE 图\nsns.FacetGrid(iris,hue=\"species\"\
  ,size=6) \\\n.map(sns.kdeplot,\"sepal_length\") \\\n.add_legend()\n# 显示图形\nplt.show()\n\
  ```\n\n通过输入以下命令运行该脚本：\n\n```\npython kdePlot.py\n```\n\n图 2-11 展示了运行此脚本的结果。\n\n\
  ![../images/482214_1_En_2_Chapter/482214_1_En_2_Fig11_HTML.jpg](img/482214_1_En_2_Fig11_HTML.jpg)\n\
  \n图 2-11\n\n所有鸢尾花种类的花萼长度 KDE 图\n\n数据分布图的结果之前已经讨论过了。\n\n\n\n#### 配对图\n\n当联合图推广到高维数据集时，就生成了配对图。这些图是探索多维数据之间相关性的有用工具，因为所有数据配对值都会相互绘制。可视化鸢尾花数据集的多维关系非常简单，只需输入以下脚本（我将其命名为\
  \ pairPlot.py）。该脚本可从本书的配套网站获取：\n\n```\n# 导入所需库\nimport matplotlib.pyplot as plt\n\
  import seaborn as sns\n# 加载鸢尾花数据集\niris = sns.load_dataset(\"iris\")\n# 生成配对图\n\
  sns.pairplot(iris, hue=\"species\", size=2.5)\n# 显示图形\nplt.show()\n```\n\n图 2-12\
  \ 展示了运行上述脚本的结果。\n\n![../images/482214_1_En_2_Chapter/482214_1_En_2_Fig12_HTML.jpg](img/482214_1_En_2_Fig12_HTML.jpg)\n\
  \n图 2-12\n\n鸢尾花数据集配对图\n\n乍一看，这张配对图似乎是目前展示的最全面、最复杂的图形。但仔细观察后，你会很快发现图中显示的各个图形要么是分面网格图，要么是核密度估计图，这些图形之前已经讨论过。从左上角到右下角的主对角线上的图形，都是针对相同交叉数据集类别的核密度估计图。而非交叉的图形（即\
  \ x 轴和 y 轴对应不同类别的图形）则都是分面网格图。当你审视各个图形时，类别属性之间的关系应该会很快显现出来。例如，在几乎所有配对图中，Setosa 的属性都明显与其他物种的属性区分开来。这表明聚类数据模型在这种情况下可能非常有效。我相信花大量时间研究配对图将有助于你深入理解底层数据集。\n\
  \n我认为，任何积极参与机器学习的人都应该对作为机器学习核心概念基础的底层基本模型有深入的了解，这至关重要。我在前一章中介绍了六个模型，但没有深入探讨这些模型的细节。这些模型（按字母顺序排列）包括：\n\
  \n*   *决策树分类器\n*   *高斯朴素[贝叶斯](http://scholar.google.com/scholar%253Fq%253DGaussian%252BNaive%252BBayesian%2526hl%253Den%2526as_sdt%253D0%2526as_vis%253D1%2526oi%253Dscholart)\n\
  *   *K 近邻分类器\n*   线性判别分析\n*   *逻辑回归\n*   支持向量机\n\n还有另外四个模型，也将在本书中介绍：\n\n*   学习向量量化\n\
  *   *线性回归\n*   Bagging 与随机森林\n*   主成分分析\n*   （* 本章讨论）\n\n经验丰富的数据科学家无法在不针对特定问题领域尝试所有这十个模型的情况下，告诉你哪个模型表现最佳。虽然还有许多其他机器学习模型和算法，但这十个通常被认为是最流行的。学习并使用这十个模型作为机器学习教育的坚实起点，将是明智之举。\n\
  \n### 底层大原则\n\n所有用于预测建模的监督式机器学习算法都遵循一个共同原则。\n\n机器学习算法最好被描述为学习一个目标函数 f( )，该函数能够最佳地将输入变量\
  \ x 映射到输出变量 y，用方程形式表示即为：\n\n*y = f(x)*\n\n一个常见的问题是，当给定输入变量 x 的新输入值时，需要对某些 y 进行预测。然而，函数\
  \ *f(x)* 是未知的。如果已知，那么预测就可以说是解析性的，可以直接求解，也就无需使用机器学习算法从数据中“学习”它了。\n\n最常见的机器学习问题类型可能就是学习映射关系\
  \ *y = f(x)*，以便对新的 x 值预测 y。这种方法正式名称为预测建模或预测分析，其目标是做出准确的预测。\n\n我将从可能是预测中最常用的模型开始回顾数据模型。\n\
  \n#### 线性回归\n\n线性回归是一种在给定输入变量 x 值的情况下预测输出 y 的方法。这种方法背后的假设是，x 和 y 之间必然存在某种线性关系。这种关系用数学术语表达为：\n\
  \n![$$ y={b}_0+{b}_1x+e $$](img/482214_1_En_2_Chapter_TeX_Equa.png)\n\n其中\n\n*b*[1]\
  \ = 直线的斜率\n\n*b*[0] = y 轴截距\n\n*e* = 估计误差\n\n图 2-13 展示了一个简化案例，包含三个数据点以及一条在所有点之间最佳拟合的直线。![$$\
  \ \\hat{y} $$](img/482214_1_En_2_Chapter_TeX_IEq1.png) 点是使用线性回归方程对给定 *x*[*i*] 计算出的估计值。*r*[*i*]\
  \ 值是真实数据点与对应 ![$$ \\hat{y} $$](img/482214_1_En_2_Chapter_TeX_IEq2.png) 估计值之间的估计误差。\n\
  \n![../images/482214_1_En_2_Chapter/482214_1_En_2_Fig13_HTML.jpg](img/482214_1_En_2_Fig13_HTML.jpg)\n\
  \n图 2-13\n\n简单线性回归案例示例\n\n创建线性回归方程的常规方法是使所有 *r*[*i*] 误差的总和最小化。可以使用不同的技术从数据中学习线性回归模型，例如用于普通最小二乘法的线性代数解法，以及使用梯度下降优化。\n\
  \n线性回归已有 200 多年的历史，并得到了广泛的研究。使用该技术时，两个有用的经验法则是移除非常相似的自变量，以及移除数据集中的任何噪声。这是一种快速简单的技术，也是一个很好的首选算法。\n\
  \n\n\n##### 线性回归演示\n\n以下名为 lrTest.py 的 Python 脚本旨在围绕一条斜线创建一组伪随机点，该斜线的基础方程为\n\n![$$\
  \ y=2x-5 $$](img/482214_1_En_2_Chapter_TeX_Equb.png)\n\nscikit-learn 包中包含的线性回归方法利用该伪随机数据集来重建基础方程。此脚本可从本书的配套网站获取：\n\
  \n```\n# 导入所需库\nimport matplotlib.pyplot as plt\nimport seaborn as sns\nimport numpy\
  \ as np\nfrom sklearn.linear_model import LinearRegression\n# 生成随机数据集\nrng = np.random.RandomState(1)\n\
  x = 10*rng.rand(50)\ny = 2*x -5 + rng.randn(50)\n# 设置线性回归模型\nmodel = LinearRegression(fit_intercept=True)\n\
  model.fit(x[:, np.newaxis], y)\n# 生成估计值\nxfit = np.linspace(0, 10, 1000)\nyfit =\
  \ model.predict(xfit[:, np.newaxis])\n# 显示包含随机数据点和最佳拟合线的图表\nax = plt.scatter(x,y)\n\
  ax = plt.plot(xfit, yfit)\nplt.show()\n# 显示线性回归系数\nprint(\"模型斜率:      \", model.coef_[0])\n\
  print(\"模型截距:  \", model.intercept_)\n```\n\n通过输入以下命令运行脚本：\n\n```\npython lrTest.py\n\
  ```\n\n图 2-14 显示了运行此脚本的结果。\n\n![../images/482214_1_En_2_Chapter/482214_1_En_2_Fig14_HTML.jpg](img/482214_1_En_2_Fig14_HTML.jpg)\n\
  \n图 2-14\n\nlrTest 脚本的结果\n\n从图中可以明显看出，最佳拟合线完美地置于数据集中，这与数据生成方式所预期的结果一致。这是一个恰当的结果，因为本次演示的唯一目的是说明线性回归模型的工作原理。\n\
  \n图 2-15 显示了线性回归模型计算出的 *b*[0] 和 *b*[1] 系数。它们分别非常接近真实值 2 和 -5。\n\n![../images/482214_1_En_2_Chapter/482214_1_En_2_Fig15_HTML.jpg](img/482214_1_En_2_Fig15_HTML.jpg)\n\
  \n图 2-15\n\n计算出的线性回归系数\n\n#### 逻辑回归\n\n逻辑回归通常用于分类目的。它与线性回归的不同之处在于，因变量 (*x*) 只能取有限数量的值，而在线性回归中，值的数量是无限的。这是因为逻辑回归对因变量使用类别。当只有两个类别时，它就变成了二元逻辑回归。\n\
  \n在线性回归中，输出是输入的加权和。逻辑回归是线性回归的一种泛化，从某种意义上说，输入的加权和不是直接输出，而是通过一个函数，该函数将任何实数输入值映射到 0\
  \ 到 1 之间的输出。在线性回归中，输出可以取任何值，但对于逻辑回归，值必须在 0 到 1 之间。\n\n图 2-16 显示了映射加权输入和的函数。这被称为\
  \ Sigmoid 函数，也称为激活函数。\n\n![../images/482214_1_En_2_Chapter/482214_1_En_2_Fig16_HTML.jpg](img/482214_1_En_2_Fig16_HTML.jpg)\n\
  \n图 2-16\n\nSigmoid 函数\n\n该图显示，Sigmoid 函数的输出值 (*y*) 始终介于 0 和 1 之间，并且当 x = 0 时，y\
  \ = 0.5。在两个类别的情况下，如果 y >= 0.5，则可以判定检测到类别 1；否则，它必须是类别 0。\n\n在我深入探讨实际数据模型之前，有必要回顾一下应用逻辑回归必须满足的两个基本假设。它们是：\n\
  \n*   因变量必须是分类变量。\n*   自变量（特征）必须相互独立。\n\n我将使用吴恩达教授的数据集，该数据集涉及根据两次考试成绩决定是否被大学录取。完整数据集包含\
  \ 100 条记录，包含两次考试成绩或分数，范围从 0 到 100。每条记录还包含一个 1 或 0，其中 1 表示申请人被录取，0 表示未被录取。该数据模型的目标是根据两次考试成绩预测申请人是否会被录取。原始数据来自一个名为\
  \ marks.txt 的 CSV 文件，可从以下网址获取：\n\n`https://github.com/animesh-agarwal/Machine-Learning/blob/master/LogisticRegression/data/marks.txt`\n\
  \n数据使用 Pandas 软件作为 DataFrame 加载到以下脚本中。数据还被分为已录取和未录取两类，以帮助可视化数据并满足分类假设。这个名为 logRTest.py\
  \ 的脚本用于生成原始数据集的图表。此脚本可从本书的配套网站获取：\n\n```\n# 导入所需库\nimport matplotlib.pyplot as plt\n\
  import pandas as pd\ndef load_data(path, header):\nmarks_df = pd.read_csv(path,\
  \ header=header)\nreturn marks_df\nif __name__ == \"__main__\":\n# 从文件加载数据\ndata\
  \ = load_data(\"marks.txt\", None)\n# X = 特征值，除最后一列外的所有列\nX = data.iloc[:, :-1]\n\
  # y = 目标值，数据框的最后一列\ny = data.iloc[:, -1]\n# 筛选已录取的申请人\nadmitted = data.loc[y ==\
  \ 1]\n# 筛选未录取的申请人\nnot_admitted = data.loc[y == 0]\n# 显示数据集图表\nplt.scatter(admitted.iloc[:,\
  \ 0], admitted.iloc[:, 1], s=10, label=\"已录取\")\nplt.scatter(not_admitted.iloc[:,\
  \ 0], not_admitted.iloc[:, 1], s=10, label='未录取')\nplt.legend()\nplt.show()\n```\n\
  \n通过输入以下命令运行脚本：\n\n```\npython logRTest.py\n```\n\n图 2-17 显示了运行此脚本的结果。\n\n![../images/482214_1_En_2_Chapter/482214_1_En_2_Fig17_HTML.jpg](img/482214_1_En_2_Fig17_HTML.jpg)\n\
  \n图 2-17\n\nlogRTest 脚本的结果\n\n\n\n##### LogR 模型开发\n\n通过观察此图，您或许能想象出一条从左上到右下的直线，它将大部分数据点一分为二，被录取的学生位于右侧，未被录取的位于左侧。问题就变成了如何确定这样一条分类线的系数。LR\
  \ 无法确定这条线，但 LogR 数据模型可以。\n\n此时，我将尝试解释 LogR 模型是如何开发的。然而，我必然要省略许多底层数学原理，否则会使讨论陷入过多细枝末节，从而偏离简单介绍\
  \ LogR 数据模型这一主要目的。请放心，网上有许多优秀的博客和教程，深入探讨了 LogR 的数学细节。\n\n这个 LogR 示例的基本假设是确定“最佳拟合”以下方程的系数\
  \ *θ*[*i*]：\n\n![$$ h(x)={\\theta}_0+{\\theta}_1{x}_1+{\\theta}_2{x}_2 $$](img/482214_1_En_2_Chapter_TeX_Equc.png)\n\
  \n其中\n\n![$$ h(x)= 分类值\\ \\left\\{\\begin{array}{c} 类别\\ 1\\ 如果\\ h(x)=&gt;0\\\\\
  \ {} 类别\\ 0\\ 如果\\ h(x)&lt;0\\\\ {}\\ \\end{array}\\right. $$](img/482214_1_En_2_Chapter_TeX_Equd.png)\n\
  \n![$$ {x}_1= 类别\\ 1\\ 值 $$](img/482214_1_En_2_Chapter_TeX_Eque.png)\n\n![$$ {x}_2=\
  \ 类别\\ 2\\ 值 $$](img/482214_1_En_2_Chapter_TeX_Equf.png)\n\n在这个二元 LogR 示例中，*x*[1]\
  \ 是考试 1 的分数，*x*[2] 是考试 2 的分数。\n\n必须为此假设分配一个成本函数，以便应用梯度法来最小化成本，进而确定最小成本解所需的系数。在此不提供证明或推导，我仅直接给出成本函数，如图\
  \ 2-18 所示。\n\n![../images/482214_1_En_2_Chapter/482214_1_En_2_Fig18_HTML.png](img/482214_1_En_2_Fig18_HTML.png)\n\
  \n图 2-18\n\n示例问题的 LogR 成本函数\n\n图中用 *J(θ)* 表示的所有训练样本的成本，可以通过计算训练数据集中所有 100 条记录的成本平均值来获得。\n\
  \n##### LogR 演示\n\n以下脚本名为 `logRDemo.py`，将按前述方法计算所需的系数。此外，该脚本还会绘制分类线并与训练数据集叠加显示。最后，会显示系数，以便获得一个可用的分类器方程。我在脚本中添加了许多注释，以帮助您理解代码的运行逻辑。此脚本可从本书的配套网站获取：\n\
  \n```\n# 导入所需库\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport pandas\
  \ as pd\nimport scipy.optimize as so\ndef load_data(path, header):\n# 将 CSV 文件加载到\
  \ pandas 数据框中\nmarks_df = pd.read_csv(path, header=header)\nreturn marks_df\ndef\
  \ sigmoid(x):\n# 激活函数\nreturn 1/(1 + np.exp(-x))\ndef net_input(theta, x):\n# 通过\
  \ numpy 点积计算输入的加权和\nreturn np.dot(x, theta)\ndef probability(theta, x):\n# 返回应用\
  \ Sigmoid 函数后的概率\nreturn sigmoid(net_input(theta, x))\ndef cost_function(theta,\
  \ x, y):\n# 计算成本函数\nm = x.shape[0]\ntotal_cost = -(1/m)*np.sum(y*np.log(probability(theta,x))+(1-y)*np.log(1-probability(theta,x)))\n\
  return total_cost\ndef gradient(theta, x, y):\n# 计算成本函数的梯度\nm = x.shape[0]\nreturn\
  \ (1/m)*np.dot(x.T,sigmoid(net_input(theta,x))-y)\ndef fit(x, y, theta):\n# 在此计算最优系数\n\
  opt_weights = so.fmin_tnc(func=cost_function, x0=theta, fprime=gradient,args=(x,y.flatten()))\n\
  return opt_weights[0]\nif __name__ == \"__main__\":\n# 从文件加载数据\ndata = load_data(\"\
  marks.txt\", None)\n# X = 特征值，除最后一列外的所有列\nX = data.iloc[:, :-1]\n# 保存副本用于输出绘图\n\
  X0 = X\n# y = 目标值，数据框的最后一列\ny = data.iloc[:, -1]\n# 保存副本用于输出绘图\ny0 = y\nX = np.c_[np.ones((X.shape[0],\
  \ 1)), X]\ny = y[:, np.newaxis]\ntheta = np.zeros((X.shape[1], 1))\nparameters =\
  \ fit(X, y, theta)\nx_values = [np.min(X[:,1]-5), np.max(X[:,2] + 5)]\ny_values\
  \ = -(parameters[0] + np.dot(parameters[1], x_values)) / parameters[2]\n# 筛选被录取的申请者\n\
  admitted = data.loc[y0 == 1]\n# 筛选未被录取的申请者\nnot_admitted = data.loc[y0 == 0]\n#\
  \ 绘制原始数据集及分类线\nax = plt.scatter(admitted.iloc[:, 0], admitted.iloc[:, 1], s=10,\
  \ label=\"已录取\")\nax = plt.scatter(not_admitted.iloc[:, 0], not_admitted.iloc[:,\
  \ 1], s=10, label='未录取')\nax = plt.plot(x_values, y_values, label='决策边界')\nax =\
  \ plt.xlabel('第一次考试分数')\nax = plt.ylabel('第二次考试分数')\nax = plt.legend()\nplt.show()\n\
  print(parameters)\n```\n\n通过输入以下命令运行脚本：\n\n```\npython logRDemo.py\n```\n\n图 2-19\
  \ 显示了运行此脚本的结果。\n\n![../images/482214_1_En_2_Chapter/482214_1_En_2_Fig19_HTML.jpg](img/482214_1_En_2_Fig19_HTML.jpg)\n\
  \n图 2-19\n\n`logRDemo` 脚本的运行结果\n\n分类线似乎被恰当地放置在数据点之间，将已录取学生与未录取学生分开。然而，如果仔细检查分类线，您会发现有五个已录取学生的数据点位于分类线的左侧。如果使用\
  \ LogR 分类模型，这些点将导致假阴性，因为拥有这些考试分数的学生被拒绝录取，但实际上应该被录取。类似地，有六个未录取学生位于分类线上或右侧。如果使用 LogR\
  \ 分类模型，这些点将导致假阳性，因为拥有这些考试分数的学生被录取了，但实际上应该被拒绝录取。总共有 11 个假阴性或假阳性点，这使得 LogR 模型的整体准确率为\
  \ 89%。这并不算太差，并且很可能通过增加训练数据集的大小来改进。\n\n图 2-20 显示了 LogR 模型计算出的 *θ*[*i*] 系数。\n\n![../images/482214_1_En_2_Chapter/482214_1_En_2_Fig20_HTML.jpg](img/482214_1_En_2_Fig20_HTML.jpg)\n\
  \n图 2-20\n\n计算出的 LogR 系数\n\n使用计算出的 *θ*[*i*] 系数得到的最终 LogR 分类器方程为：\n\n![$$ h(x)=-25.1613+0.2062{x}_1+0.2015{x}_2\
