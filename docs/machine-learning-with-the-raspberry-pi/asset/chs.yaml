  显然，在将时间序列转换为输入/输出样本以训练模型时，会丢弃一些数据。选择输入时间步的数量将对最终使用的训练数据量产生很大影响。一个名为 *split_sequences*\
  \ 的函数将接收之前重塑后的数据集，并返回所需的输入/输出样本。以下代码实现了 *split_sequences* *函数*：\n\n```\n# 将多变量序列分割为样本\n\
  def split_sequences(sequences, n_steps):\n    X, y = list(), list()\n    for i in\
  \ range(len(sequences)):\n        # 找到该模式的结束索引\n        end_ix = i + n_steps\n \
  \       # 检查是否超出数据集范围\n        if end_ix > len(sequences):\n            break\n\
  \        # 收集模式的输入和输出部分\n        seq_x, seq_y = sequences[i:end_ix, :-1], sequences[end_ix-1,\
  \ -1]\n        X.append(seq_x)\n        y.append(seq_y)\n    return array(X), array(y)\n\
  ```\n\n以下代码测试了之前所有的代码片段和函数。我将此脚本命名为 splitMultivariateTimeSeries.py。该脚本可从本书的配套网站获取。\n\
