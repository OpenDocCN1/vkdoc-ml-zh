  \ 2 章的鸢尾花数据集图来亲自验证。\n\n#### 何时使用 PCA\n\n我认为增加一个关于何时使用 PCA 的简短章节是个好主意。当有理由怀疑数据集中可能包含使用传统二维可视化技术不易观察到的隐藏或潜在模式时，PCA\
  \ 将是一个合适的数据模型选择。\n\n每当需要进行降维时，PCA 也很有帮助。这种降维与以下情况密切相关：\n\n*   高维数据的可视化。\n*   噪声降低。通常，高阶主成分仅负责数据中的微小变化。\n\
  *   用于预处理将与其他机器学习算法一起使用的数据。这些算法可以包括那些在较小维度数据集上表现更好的算法。\n*   用于减少数据集内的相关性。相关数据对整体可用信息的贡献不大，但却会显著增加计算效率低下问题。\n\
  \n## 线性判别分析\n\n线性判别分析（LDA）与我在上一节讨论的主成分分析（PCA）非常相似。一个主要区别在于，PCA 旨在确定那些最大化数据方差的轴或主成分，而\
  \ LDA 则旨在寻找那些最大化类别间分离度的轴。我强烈建议你在阅读 LDA 部分之前先阅读 PCA 部分，因为在 LDA 部分中，我将使用在 PCA 部分中首次引入和解释的术语，而不再另行说明。\n\
  \nLDA 与 PCA 一样，是一种降维算法，但它是监督式的。稍后我将解释在此上下文中“监督式”的含义。LDA 将数据集投影到较低维度的空间，同时增加类别可分性。增加的类别可分性降低了发生过拟合的概率。LDA\
  \ 还提高了计算效率。限制过拟合的能力使 LDA 相对于 PCA 算法具有明显的优势。\n\n由于 PCA 和 LDA 看起来非常相似，我加入了图 3-4，该图突出了这两种算法之间的一些显著差异。\n\
  \n![../images/482214_1_En_3_Chapter/482214_1_En_3_Fig4_HTML.jpg](img/482214_1_En_3_Fig4_HTML.jpg)\n\
  \n图 3-4\n\nPCA 与 LDA 的区别\n\nPCA 是一种“无监督”算法，因为它不使用类别标签，其主要目的是计算能够最大化数据集方差的轴或主成分。另一方面，LDA\
  \ 是“监督式”的，它使用类别数据来计算能够最大化多个类别之间分离度的轴或线性判别式。\n\nLDA 过程涉及五个步骤。它们是：\n\n1.  从数据集中计算不同类别的\
  \ d 维均值向量，其中 d 是特征空间的维度。\n2.  计算类间散度矩阵和类内散度矩阵。\n3.  计算散度矩阵的特征向量和配对的特征值。\n4.  选择与\
  \ top k 个特征值对应的 k 个特征向量，以形成一个维度为 d x k 的变换矩阵。\n5.  通过变换矩阵将 d 维特征空间 X 变换为 k 维特征空间\
  \ X_lda。\n\n\n\n### LDA 脚本讨论\n\n本演示将使用与 PCA 演示中相同的鸢尾花数据集。不过，与 PCA 脚本相比，此脚本会自动加载数据集。\n\
  \n以下是一个名为 `ldaTest.py` 的 Python 脚本的完整清单，该脚本将完成一个完整的 LDA 并附带可视化效果。此脚本中有一个我希望指出的额外功能。在脚本接近结尾处，我演示了如何仅使用\
  \ sklearn 的 LDA 模块来执行 LDA，而无需像前面脚本部分那样经历所有步骤。\n\n像往常一样，我也会根据需要为这些代码部分提供额外的解释性注释。此脚本可从本书的配套网站获取：\n\
  \n```\n#导入所需库\nimport numpy as np\nimport pandas as pd\nimport matplotlib.pyplot\
  \ as plt\nimport seaborn as sns\nfrom sklearn.preprocessing import StandardScaler\n\
  from sklearn.discriminant_analysis import LinearDiscriminantAnalysis\nnp.set_printoptions(precision=4)\n\
