- '# 4. 深度学习准备


  本章将为您提供足够的背景知识，以便理解后续章节中开始的深度学习讨论。在尝试理解任何实际的深度学习算法之前，理解一些基本的深度学习术语和概念非常重要。我尽量减少了数学内容，但有些公式是不可避免的，因为深度学习本质上全是数学。


  ## 深度学习基础


  任何深度学习讨论的起点显然都必须是回答“什么是深度学习？”这个问题。像许多相对较新的技术领域一样，如果你让一打专家来定义某样东西，你很可能会得到一打不同但又出奇相似的答案。深度学习也不例外。我研究了许多不同的深度学习定义，并创建了以下一个似乎包含了众多定义中共同主题的定义：


  > *深度学习是机器学习的一个子领域，涉及被称为人工神经网络的算法，这些算法受人类大脑的结构和功能启发。从数据集中学习可以是*[*监督式*](https://en.wikipedia.org/wiki/Supervised_learning)*、*[*半监督式*](https://en.wikipedia.org/wiki/Semi-supervised_learning)
  *或无监督式的。*


  我将在下一章介绍并讨论人工神经网络，但首先我需要讨论这些基础知识。




  ### 从数据模式中学习机器学习


  机器学习（ML）是深度学习（DL）的一个重要子集，通常被描述为对算法和数据模型的研究，这些算法和模型能够执行计算机实现的任务，而无需通过显式编程来完成这些任务。相反，机器学习依赖于检测数据模式并生成关于数据的推论。机器学习通常有四个主要任务。这些任务是：


  *   检测

  *   分类

  *   识别

  *   预测


  这些任务中的大多数（如果不是全部）都可以应用于各种数据集，包括静态图像、数值数据和实时数据流。最后提到的数据集包括视频、音频，甚至射频（RF）流。我也非常肯定，机器学习还有其他我尚未提及的应用。


  我将从讨论分类任务开始我的基础知识讲解，这个任务在前面的章节中已经讨论过。回想一下在第 1 章关于 k-NN 数据模型的讨论中，我提到过：


  > *我将 k-NN 描述为非参数化的，这意味着该模型不会对底层数据分布做出任何假设。换句话说，模型结构是由数据决定的。鉴于此，当对数据分布方式知之甚少或一无所知时，k-NN
  可能应该是你进行分类研究的首选之一。*


  你可能对我使用术语*非参数化*来描述 k-NN 数据模型感到有些困惑。希望解释什么是参数化分类算法有助于澄清这个术语。参数化的定义如下：


  > *参数化是一个*[数学](https://en.m.wikipedia.org/wiki/Mathematical)*过程，包括将*[系统](https://en.m.wikipedia.org/wiki/System)*、*[过程](https://en.m.wikipedia.org/wiki/Process_%2528science%2529)*或模型的状态表示为某些独立量（称为*[参数](https://en.m.wikipedia.org/wiki/Parameter)*）的*[函数](https://en.m.wikipedia.org/wiki/Function_%2528mathematics%2529)*。


  在机器学习应用中，用于描述系统状态的关键参数包括：


  *   数据

  *   评分函数

  *   损失函数

  *   权重和偏置


  是的，我知道最后一个列表项包含两个组成部分，但它们紧密交织在一起，通常被视为构成一个单一参数。我将分别讨论每个参数。


  **数据** – 这是所有机器学习必须基于的过程中的一个明显元素。数据有两个方面，第一个是数值，第二个是类别标签。数值的范围很广，从图像中的原始像素值到住房数据集中的房价。在机器学习领域中，数据通常表示为一个矩阵。这样的矩阵通常被称为设计矩阵，命名为
  **X**，其中


  ![$$ {x}_i={i}^{th}\ element\ in\ the\ design\ matrix $$](img/482214_1_En_4_Chapter_TeX_Equa.png)


  ![$$ {y}_i={i}^{th}\ class\ label $$](img/482214_1_En_4_Chapter_TeX_Equb.png)


  **评分函数** – 一个将输入数据映射到预测类别标签的函数。这可以用一个通用方程形式表示：


  ![$$ f\left( input\ data\right)= predicted\ class\ label $$](img/482214_1_En_4_Chapter_TeX_Equc.png)


  实际上，这个方程只是产生一个数值。与该最大值相关联的类别标签将是该分类器的预测结果。


  **损失函数** – 一个量化预测类别标签与数据集中记录的实际类别标签一致程度的函数。在机器学习术语中，实际类别标签也称为真实标签。低损失值是理想的，因为这意味着预测结果与真实标签高度一致。本章后面将详细讨论如何计算损失函数以获得最小损失值。


  **权重和偏置** – 权重矩阵 `W` 和偏置向量 `b` 被迭代计算，以便相对于评分函数最小化损失函数。


  #### 线性分类器


  在本节中，我将讨论什么是线性分类器以及它是如何工作的。我加入这个讨论的原因是为了向你提供一个框架，通过这个框架你可以更好地理解神经网络是如何工作的。线性分类器和神经网络的基本概念是相同的。我还会将前面介绍的四个关键参数中的三个融入到这个讨论中。损失函数将在下一节中单独讨论。


  用于这个线性分类器的数据集名为“哺乳动物”，包含三个类别（即猫、狗和松鼠）的 5000 张图像。每张图像的分辨率相当低，为 32 x 32 像素，总共 1024
  个像素。此外，每个像素都是全彩 RGB，需要三个字节来表示 RGB 颜色通道值，这意味着分类器需要处理 3072 个值。表示一张图像的数据点被“展平”成一个一维向量（1D），命名为
  **X**，它有 N 个元素，其中 N 等于 3072。权重矩阵 **W** 的形状必须是 3 x 3072，因为数据集中有三个类别。最后，偏置向量 **b**
  的大小仅为 3 x 1。使用刚刚描述的符号，最终的评分方程为：


  ![$$ f\left(\boldsymbol{X},\boldsymbol{W},\boldsymbol{b}\right)=\boldsymbol{W}\cdotp
  \boldsymbol{X}\kern0.5em +\boldsymbol{b} $$](img/482214_1_En_4_Chapter_TeX_Equd.png)


  其中 ***W*** · ***X*** 是权重矩阵与输入数据向量之间的点积。


  图 4-1 是评分函数的图形表示。


  ![../images/482214_1_En_4_Chapter/482214_1_En_4_Fig1_HTML.jpg](img/482214_1_En_4_Fig1_HTML.jpg)


  图 4-1


  评分函数的图形表示


  图中的所有数值都是虚构的，但我确实让猫类在评分函数向量中获得了最高值，这将使其成为预测的类别标签。


  有一个常用的简化“技巧”，可以将评分函数中的参数从三个减少到两个。这个技巧是将偏置向量包含到权重矩阵中。图 4-2 展示了如何做到这一点。


  ![../images/482214_1_En_4_Chapter/482214_1_En_4_Fig2_HTML.jpg](img/482214_1_En_4_Fig2_HTML.jpg)


  图 4-2


  将偏置向量添加到权重矩阵中


  输入数据向量 ***X*** 被扩展了一个元素，该元素始终包含值 1。在这个例子中，权重矩阵 ***W*** 也被扩展了一列，现在其形状变为 3 x 3073。这个额外的列就是偏置向量
  ***b***。新的评分函数现在简化为一个单一的点积乘法，如下面的方程所示：


  ![$$ f\left(\boldsymbol{X},\boldsymbol{W}\right)=\boldsymbol{W}\cdotp \boldsymbol{X}
  $$](img/482214_1_En_4_Chapter_TeX_Eque.png)


  使用这种偏置技巧意味着你只需要一个单一的权重矩阵，而不是一个权重矩阵和一个偏置向量。这个技巧只是数据预处理的一部分，有助于简化整个机器学习工作。




  以下内容旨在向您展示如何在 Python 中实现一个线性分类器。这个脚本绝对是“作弊”的，它会直接选择标签列表中的第一个类别。之所以必须这样做，是因为该脚本没有使用任何预训练网络。我的目标仅仅是展示如何编写一个简单的线性分类器。我没有将其称为演示，而是认为它更接近于伪代码的范畴。再次强调，这仅供您参考，因为它确实用到了我讨论过的四个主要参数，只是缺少了对预训练网络的调用。该脚本名为
  `linear_Classifier.py`。我*没有*将其放在本书的配套网站上，因为我认为它只是一个用于教学的工具。如果您愿意，可以随意从代码清单中复制它。


  ```

  # 导入所需库

  import numpy as np

  import cv2

  # 初始化类别标签并设置伪随机种子值

  labels = [''dog'', ''cat'', ''squirrel'']

  np.random.seed(1)

  # 随机初始化权重矩阵和偏置向量

  W = np.random.randn(3, 3072)

  b = np.random.randn(3)

  # 设置用于绘制标签的字体

  font = cv2.FONT_HERSHEY_SIMPLEX

  # 加载图像并调整大小。图像来自数据集。

  orig = cv2.imread(''dog.png'')

  image = cv2.resize(orig, (32,32)).flatten()

  # 计算输出分数

  scores = W.dot(image) + b

  # 遍历分数和标签

  for (label, score) in zip(labels, scores):

  print(''[INFO] {}: {:.2f}''.format(label, score))

  # 获取得分最高的类别标签

  classLabel = labels[np.argmax(scores)]

  # 在原始图像上绘制预测的标签

  cv2.putText(orig, classLabel, (10,30),  font, 0.9, (255,0,0), 2)

  # 显示图像

  cv2.imshow(''Image'', orig)

  cv2.waitKey(0)

  ```


  通过输入以下命令来运行此脚本：


  ```

  python linear_Classifier.py

  ```


  图 4-3 显示了输入命令后的终端窗口结果。


  ![../images/482214_1_En_4_Chapter/482214_1_En_4_Fig3_HTML.jpg](img/482214_1_En_4_Fig3_HTML.jpg)


  图 4-3


  运行 linear_Classifier 脚本后的终端结果


  您应该能够看到，dog 类别的值最大，因此它是预测的类别标签。


  图 4-4 显示了叠加了类别标签的原始图像。


  ![../images/482214_1_En_4_Chapter/482214_1_En_4_Fig4_HTML.jpg](img/482214_1_En_4_Fig4_HTML.jpg)


  图 4-4


  linear_Classifier 脚本处理后的图像


  从这个例子中要理解的关键点是，必须对权重矩阵进行优化，才能实际执行真正的分类任务。我将在下一章中通过一个实际问题来讨论如何实现这一点。目前我并不太关注偏置向量，因为它通常用于“微调”最终的网络解决方案。在考虑偏置向量之前，创建一个有效的权重矩阵要重要得多。


  ### 损失函数


  损失函数是机器学习的核心。它使您能够将算法从理论概念转化为实际实现，并将神经网络从抽象的矩阵乘法转变为深度学习。


  损失函数的概念非常简单。它是一种评估算法对输入数据集建模效果的方法。如果预测或分类出现错误，损失函数会输出一个高数值。如果结果合理，则数值会较低。它还能告知开发者，随着网络和模型的训练，算法的改进情况如何。该函数可以轻松显示训练过程是收敛还是发散。收敛是好的，而您需要避免发散。


  #### 不同类型的损失函数


  一种朴素的损失函数方法可能简单如下：


  ![$$ \epsilon = abs\left(\hat{y_i}-{y}_i\right) $$](img/482214_1_En_4_Chapter_TeX_Equf.png)


  其中


  *   ϵ = 误差


  *   ![$$ \hat{y_i} $$](img/482214_1_En_4_Chapter_TeX_IEq1.png) = 预测的类别标签


  *   *y*[*i*] = 实际的类别标签（真实值）


  在这个损失函数定义中，预测值过高或过低都没有区别。唯一重要的是它们错误的程度，即方向无关。这种方法并不适用于所有损失函数。损失函数会根据机器学习问题的领域而有显著变化。在某个特定项目中，猜测过高可能比猜测过低糟糕得多，所选的损失函数必须反映这种情况。


  以下是几种常用的损失函数：


  均方误差（MSE）——这是基本损失函数中非常流行的一种。它易于理解和实现，且效果良好。MSE 的计算方法是：计算预测值与真实值之间的差值，将其平方，然后求和，再除以整个数据集的大小。MSE
  的 Python 代码如下：


  ```

  def MSE(y_Hat, y):

  sq_error = (y_Hat - y) ** 2

  sum_sq_error = np.sum(sq_error)

  mse = sum_sq_sq_error / y.size

  return mse

  ```


  似然函数——似然函数也很简单，常用于分类问题。该函数取每个输入数据类别的预测概率，并将它们相乘。虽然输出结果不易于人类解读，但它对于比较模型的表现非常有用。


  考虑以下示例，其中模型输出了一系列与不同数据集类别相关的概率。概率如表 4-1 所示。


  表 4-1


  示例分类模型的概率


  | 类别 | 真实值 (y[i]) | 概率 (p) | 1 - p |

  | --- | --- | --- | --- |

  | A | 0 | 0.4 | 0.6 |

  | B | 1 | 0.6 | 不适用 |

  | C | 1 | 0.9 | 不适用 |

  | D | 0 | 0.1 | 0.9 |


  当模型输出为 False 或真实值为 0 时，在似然计算中使用 1 - p 概率，如下所示：


  *   0.6 ∗ 0.6 ∗ 0.9 ∗ 0.9 = 0.292


  对数损失（交叉熵损失）——对数损失也是一种常用于分类问题的损失函数。它是使用对数对似然函数进行的修改。


  ![$$ \epsilon =-\Big(y\ast \mathit{\log}(p)+\left(1-y\right)\ast \mathit{\log}\left(1-p\right)
  $$](img/482214_1_En_4_Chapter_TeX_Equg.png)


  这个公式与似然函数的公式相同，但使用了对数。然而，您应该注意到，当类别值为 1 时，函数的后半部分消失；当类别值为 0 时，前半部分消失。这样，在乘法中只使用了真实值类别的预测概率的对数。


  对数损失函数有一个有趣的特点，即它会严厉惩罚那些“非常自信”但“非常错误”的情况。为错误类别预测高概率会使函数“爆炸”。图 4-5 说明了当真实标签 = 1 时发生的情况。您可以看到，当标签
  = 0 的预测概率接近 1 时，损失值会急剧上升。


  ![../images/482214_1_En_4_Chapter/482214_1_En_4_Fig5_HTML.jpg](img/482214_1_En_4_Fig5_HTML.jpg)


  图 4-5


  对数损失函数图


  关于损失函数讨论的最后一点是，要认识到它们提供的不仅仅是模型性能的静态表示。大多数机器学习算法在优化过程中或确定数据集最佳参数（权重）时都会使用损失函数。




  以我在前一章讨论的线性回归数据模型为例。在传统的“最小二乘”回归中，最佳拟合线是通过均方误差（MSE）确定的。对于模型尝试的每组权重，都会计算所有输入样本的 MSE。然后，模型会优化
  MSE 函数，换句话说，就是通过使用像梯度下降这样的优化器算法，使其尽可能达到最小值。


  正如不同的问题有不同类型的损失函数一样，不同的优化器也对应着特定的问题领域，我将在下一节中讨论这一点。


  ### 优化器算法


  机器学习从业者常说，优化器算法是机器学习的核心。没有好的优化器，机器学习就不可能存在。最常见的算法称为梯度下降，它有两种形式：线性和随机。我将先讨论线性版本，因为它最容易理解和解释。实际上，随机版本才是现实世界中最常用的。在介绍完线性版本后，我会解释随机版本。


  为了给梯度下降的讨论做好铺垫，我想请你想象以下场景。假设你正在山里徒步旅行，忘记了时间，天开始黑了。你很快意识到，必须在天色太暗、气温太低之前下到地势较低的地方。假设你还忘了带手电筒或提灯，所以只能依靠仅存的、逐渐减弱的日光来安全抵达低处。你自然会开始向山下走，但由于光线不好，你看不太远。这种情况迫使你只能迈小步，以免撞上巨石，或掉进坑洞或洼地。本质上，你是在一点一点地摸索下山，每一步都试图走得更低，并且每次不小心开始上坡时，都会进行微小的修正。


  这个场景类比了梯度下降的工作原理。梯度下降的峰和谷是其算法定义的直接结果。为了便于讨论，考虑一个极其简单的网络，它只有两个权重，没有偏置值。这种简单情况下的损失函数将完全依赖于这两个权重值。图
  4-6 展示了一个假设的损失函数与两个独立权重值的三维图。


  ![../images/482214_1_En_4_Chapter/482214_1_En_4_Fig6_HTML.jpg](img/482214_1_En_4_Fig6_HTML.jpg)


  图 4-6


  两个权重变量的损失函数


  图中的峰值是最大损失值，需要避免；而谷底是最小值，是网络达到最佳性能所期望的。我还要指出，图中有些谷底比其他谷底更深。最深的那个谷底被称为全局最小值，它始终是设置所有权重值时最理想的目标。那些“不那么深”的谷底被称为局部最小值，虽然并非最优，但通常也“足够好了”。关于这一点，稍后会在讨论中详细介绍。


  计算图上任意一点的斜率，是确定如何在峰谷之间穿行或“行走”的关键。回想一下开头的场景，你总是想向下走，从而避开那些高成本区域的峰值。因此，持续计算瞬时斜率并沿着向下的方向前进是合理的。从分析的角度来看，斜率是通过计算原始方程的导数来确定的。在这种情况下，原始方程就是损失函数，并且有两个自变量，代表两个权重。由于涉及两个自变量，这种情况下必须使用偏导数。寻找全局最小值还涉及步长的大小。步长太大，很容易错过最小值；步长太小，则可能导致训练时间过长。你很快就会知道，步长和学习率是同义词。


  此时还需要指出一点。前面展示的三维图只涉及两个权重和一个损失函数。实际上，一个实用的神经网络模型涉及的权重远不止三个。在下一章中，我将讨论一个包含 100 个权重的网络。我无法想象，并且我怀疑许多其他人也无法想象，100
  个自变量将如何与单个输出函数相互作用。当然，无法像我对两个变量那样，将这种相互作用可视化。我建议你只需接受这个假设：从数学上讲，优化 100 个变量的方式与处理
  2 个变量是相同的。


  考虑这样一种情况：一个垂直平面与图 4-6 所示的图形相交，得到一个二维图，显示损失函数与自变量某个范围的关系。这个范围对于本讨论来说无关紧要。图 4-7 展示了一个具有全局最小值和局部最小值的代表性二维图。


  ![../images/482214_1_En_4_Chapter/482214_1_En_4_Fig7_HTML.jpg](img/482214_1_En_4_Fig7_HTML.jpg)


  图 4-7


  显示全局最小值和局部最小值的二维图




  #### 深入探讨梯度下降算法


  对梯度下降算法的深入探讨，首先要回顾我在第 2 章中讨论的线性回归（LR）数据模型。我建议你重新阅读该讨论，以重温关于该模型的关键要点。广义的线性回归方程如下：


  ![$$ y=\kern0.75em m\ast x+b $$](img/482214_1_En_4_Chapter_TeX_Equh.png)


  其中


  *   *m* = 直线的斜率

  *   *b* = y 轴截距


  请注意，我对第 2 章中展示的方程做了略微改动，去掉了误差估计项，并将斜率常数改为 *m*，截距常数改为 *b*。这样做是为了与本次讨论中使用的图形保持一致。


  我将从一些数据的 x-y 散点图开始，并配以一条平坦的线性回归方程直线，如图 4-8 所示。


  ![../images/482214_1_En_4_Chapter/482214_1_En_4_Fig8_HTML.jpg](img/482214_1_En_4_Fig8_HTML.jpg)


  图 4-8


  带有平坦线性回归预测线的数据散点图


  最优的线性回归预测线穿过数据点的位置，能够最小化总误差——如果你仅使用该预测线来计算任意给定 *x*[*i*] 数据点对应的 *y*[*i*] 值，就会产生这个总误差。确定最优
  *m* 和 *b* 值的通用方法是遍历数据集中所有可能的 *m* 和 *b* 值，并找出使用所有 *x*[*i*] 值计算时产生的最小误差。下面列出了一些实现此通用过程的示例
  Python 代码：


  ```

  # 使用 y = mx + b 方程

  # m 是斜率，b 是 y 轴截距

  def computeErrorForLineGivenPoints(b, m, points):

  totalError = 0

  for i in range(0, len(points)):

  totalError += (points[i].y - (m * points[i].x + b)) ** 2

  return totalError / float(len(points))

  ```


  在调用此脚本之前，需要设置一个名为 `points` 的数据数组，其中包含所有原始的 x-y 点。此外，主调用脚本必须设置待测试的 *m* 和 *b* 变量的范围。


  此线性回归示例的正式误差函数如下所示：


  ![$$ {e}_{m,b}=\frac{1}{N}\sum \limits_{i=1}^N{\left({y}_i-\left(m\ast {x}_i+b\right)\right)}²
  $$](img/482214_1_En_4_Chapter_TeX_Equi.png)


  现在的重点是推导出一个方程，该方程能针对 *m* 和 *b* 优化这个误差函数，从而产生最小误差。在讨论这一点之前，先说明一下这个线性回归示例中变量相互作用的性质会很有帮助。图
  4-9 从两个角度展示了 *m* 和 *b* 的不同取值如何影响误差函数。


  ![../images/482214_1_En_4_Chapter/482214_1_En_4_Fig9_HTML.jpg](img/482214_1_En_4_Fig9_HTML.jpg)


  图 4-9


  误差随 m 和 b 变量变化的曲线图


  你应该能很容易地想象出，让一颗弹珠从斜坡上滚下，最终停在一个最低点。这个最低点对应着最小 *e*[*m,b*] 值所关联的 *m* 和 *b* 值。使用梯度下降搜索方法就相当于让弹珠滚下斜坡。


  实现梯度下降方法的第一步是对误差函数进行两次偏微分，因为这里有两个自变量。这一步与我之前讨论的两个权重示例中的步骤完全相同。偏微分方程实际上比原始误差方程更简单：


  ![$$ \frac{\partial }{\partial m}=\frac{2}{N}\sum \limits_{i=N}^N-{x}_i\ast \left({y}_i-\left(m\ast
  {x}_i+b\right)\right) $$](img/482214_1_En_4_Chapter_TeX_Equj.png)


  ![$$ \frac{\partial }{\partial b}=\frac{2}{N}\sum \limits_{i=N}^N-\left({y}_i-\left(m\ast
  {x}_i+b\right)\right) $$](img/482214_1_En_4_Chapter_TeX_Equk.png)


  搜索通常从原点开始，即 *m* = –1 且 *b* = 0。这个 –1 值只是让弹珠开始滚下坡。梯度下降算法是迭代的，这意味着每次迈出一小步，然后重新评估误差函数，如果可能进一步改进，则再迈出一步。以下
  Python 代码为线性回归示例实现了一个梯度下降算法：


  ```

  def stepGradient(b_current, m_current, points, learningRate):

  b_gradient = 0

  m_gradient = 0

  N = float(len(points))

  for i in range(0, len(points)):

  b_gradient += -(2/N) * (points[i].y - ((m_current*points[i].x) + b_current))

  m_gradient += -(2/N) * points[i].x * (points[i].y - ((m_current*points[i].x) + b_current))

  new_b = b_current - (learningRate * b_gradient)

  new_m = m_current - (learningRate * m_gradient)

  return [new_b, new_m]

  ```


  前面脚本中的 `learningRate` 参数控制步长。这个参数必须仔细调整，因为值太大容易错过最小值，而值太小则会不必要地增加找到最小值之前的迭代次数。


  接下来的一系列图将说明梯度下降算法如何为这个线性回归示例收敛到最优解。在每张图中，左侧的图显示了梯度下降的起始位置，右侧的图则显示了当前 *m* 和 *b* 变量对应的数据点和预测线。


  图 4-10 显示了梯度搜索的起点。


  ![../images/482214_1_En_4_Chapter/482214_1_En_4_Fig10_HTML.jpg](img/482214_1_En_4_Fig10_HTML.jpg)


  图 4-10


  梯度搜索的起点


  从这张图中可以明显看出，初始估计值偏差很大。


  下一次迭代如图 4-11 所示。


  ![../images/482214_1_En_4_Chapter/482214_1_En_4_Fig11_HTML.jpg](img/482214_1_En_4_Fig11_HTML.jpg)


  图 4-11


  梯度搜索的第二次迭代


  请注意，图左侧的图中现在出现了一条线，它表示搜索算法从初始起点所走的路径。图右侧显示的预测线相比初始图有了很大改进。然而，它显然还需要改进，因为它完全没有穿过任何数据点。


