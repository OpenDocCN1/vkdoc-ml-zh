  \n\n\n### 另一种改进的基线模型\n\n增加深度并非改进模型的唯一途径。增加宽度（即增加隐藏层节点数量）同样可以提升模型性能，有望增强网络提取潜在特征的能力。该模型的代码如下：\n\
  \n```\n# 定义更宽的模型\ndef wider_model():\n# 创建模型\nmodel = Sequential()\nmodel.add(Dense(20,\
