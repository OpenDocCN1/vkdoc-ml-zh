  搜索算法所走的路径与第二次迭代的路径完全相同。然而，预测线现在勉强穿过了几个数据点，但显然还需要进一步改进。


  快进到第 100 次迭代（由于从 0 开始计数，实际上是第 101 次），从图 4-13 中可以看出，预测线在视觉上“看起来”拟合得很好。


  ![../images/482214_1_En_4_Chapter/482214_1_En_4_Fig13_HTML.jpg](img/482214_1_En_4_Fig13_HTML.jpg)


