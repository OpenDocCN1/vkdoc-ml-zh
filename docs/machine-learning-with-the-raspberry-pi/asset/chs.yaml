  ```


  这是定义 CNN 并对其进行编译的代码部分。该模型与第 5 章最后一次演示中使用的 MLP 模型有很大不同。首先，它按以下顺序包含六个层：


  1.  卷积层


  2.  池化层


  3.  丢弃层


  4.  展平层


  5.  全连接层


  6.  输出层


  每一层都为 CNN 贡献了一个顺序操作，从而实现了从输入图像到分类输出的转换。


  在第 5 章的 Keras 演示中，我在讨论编译函数时简要提到了 Adam 优化器。我将进一步阐述优化器的使用，因为理解其功能及其假设非常重要。CNN 的优化器是一个控制网络学习方式的函数。在非
  Keras 网络（如第 5 章的 MLP）中，学习率（lr）控制梯度步长。较小的学习率意味着在尝试定位成本函数的全局最小值时步长较小。这意味着非常小的步长可能会使梯度下降算法花费数小时才能最终收敛到全局最小值。优化器采用不同的方法，使用动态技术来设置步长，以最小化定位全局最小值所需的总时间。


  Adam 优化器根据梯度的一阶和二阶矩估计，为不同参数计算自适应的学习率。Adam 的作者将其描述为结合了随机梯度下降的另外两种扩展的优点。具体来说：


  *   自适应梯度算法（AdaGrad），它保持每个参数的学习率，从而在稀疏梯度问题上提高性能。


  *   均方根传播（RMSProp），它也保持每个参数的学习率，并根据权重梯度最近幅度的平均值（例如，其变化速度）进行调整。这意味着该算法在在线和非平稳问题（例如，噪声数据）上表现良好。




  Adam 算法同时实现了 AdaGrad 和 RMSProp 算法的优势。与 RMSProp 基于平均一阶矩（均值）调整参数学习率不同，Adam 还利用了梯度的二阶矩（非中心方差）的平均值。具体来说，该算法会计算梯度及其平方的指数移动平均值。参数
  `beta1` 和 `beta2` 控制这些移动平均值的衰减率。


  Adam 是深度学习领域一种流行的算法，因为它能快速取得良好效果。实证结果表明，Adam 在实践中表现优异，且优于其他随机优化方法。在原始论文中，Adam 证明了其收敛性符合论文理论分析的预期。Adam
  已被应用于 [MNIST 手写数字识别](https://machinelearningmastery.com/how-to-develop-a-convolutional-neural-network-from-scratch-for-mnist-handwritten-digit-classification/)
  和 IMDB 情感分析数据集上的逻辑回归算法。作者得出结论，Adam 能够高效解决实际的深度学习问题。


