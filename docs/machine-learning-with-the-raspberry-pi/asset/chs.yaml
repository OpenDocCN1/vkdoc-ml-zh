  CNN 的设计与所处理的数据集相匹配。如何做到这一点更像是一门艺术而非科学。目前存在许多 CNN 设计策略，希望您通过阅读本章前面关于 CNN 演进的讨论已经有所了解。对于任何给定的数据集，使用哪种策略必然取决于实践者的判断和经验。我无法在这方面提供任何指导，因为我尚未积累足够的使用当前众多
