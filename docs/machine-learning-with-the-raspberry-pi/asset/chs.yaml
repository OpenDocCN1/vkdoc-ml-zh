  本演示将使用一个 VGG CNN 模型，以向您展示测试 `fashion_mnist` 数据集的另一种方法。首先，我要感谢 Adrian Rosebrock 在
  2019 年 2 月发表的题为“Fashion MNIST with Keras and Deep Learning”的博客，本演示的灵感以及所使用的模型均来源于此。我承认对模型代码做了细微调整，以适配我的预处理语句以及模型的编译方式。


  在本演示中，模型定义被放入一个类中，并单独存储在名为 `VGG.py` 的文件中。类的清单如下所示，可从本书的配套网站获取。


  ```

  # 导入所需库

  from keras.models import Sequential

  from keras.layers.normalization import BatchNormalization

  from keras.layers.convolutional import Conv2D

  from keras.layers.convolutional import MaxPooling2D

  from keras.layers.core import Activation

  from keras.layers.core import Flatten

  from keras.layers.core import Dropout

  from keras.layers.core import Dense

  from keras import backend as K

  class VGG:

  @staticmethod

  def build(width, height, depth, classes):

  # 初始化模型以及输入形状为 "channels last" 和通道维度本身

  model = Sequential()

  inputShape = (height, width, depth)

  chanDim = -1

  # 如果我们使用 "channels first"，则更新输入形状和通道维度

  if K.image_data_format() == "channels_first":

  inputShape = (depth, height, width)

  chanDim = 1

  # 第一组 CONV => RELU => CONV => RELU => POOL 层

  model.add(Conv2D(32, (3, 3), padding="same",

  input_shape=inputShape))

  model.add(Activation("relu"))

  model.add(BatchNormalization(axis=chanDim))

  model.add(Conv2D(32, (3, 3), padding="same"))

  model.add(Activation("relu"))

  model.add(BatchNormalization(axis=chanDim))

  model.add(MaxPooling2D(pool_size=(2, 2)))

  model.add(Dropout(0.25))

  # 第二组 CONV => RELU => CONV => RELU => POOL 层

  model.add(Conv2D(64, (3, 3), padding="same"))

  model.add(Activation("relu"))

  model.add(BatchNormalization(axis=chanDim))

  model.add(Conv2D(64, (3, 3), padding="same"))

  model.add(Activation("relu"))

  model.add(BatchNormalization(axis=chanDim))

  model.add(MaxPooling2D(pool_size=(2, 2)))

  model.add(Dropout(0.25))

  # 第一组（也是唯一一组）FC => RELU 层

  model.add(Flatten())

  model.add(Dense(512))

  model.add(Activation("relu"))

  model.add(BatchNormalization())

  model.add(Dropout(0.5))

  # Softmax 分类器

  model.add(Dense(classes))

  model.add(Activation("softmax"))

  # 编译模型

  model.compile(loss=''categorical_crossentropy'', optimizer="adam", metrics=[''accuracy''])

  # 返回构建的网络架构

  return model

  ```


  主脚本如下所示，命名为 `kerasVGGTest.py`，同样可从本书的配套网站获取。




