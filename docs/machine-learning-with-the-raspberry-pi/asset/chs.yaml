- "# 8. 使用 CNN 和 MLP 进行医学研究预测\n\n在上一章中，我向您介绍了如何使用 ANN 和 CNN 进行预测。所讨论的预测严格与数值数据集相关，并未直接涉及任何输入图像。在本章中，我将讨论如何使用图像与\
  \ CNN 进行医学诊断预测。目前，这一研究领域极其重要，许多 AI 研究人员正在探索可行的研究方向以推动该主题的发展。实际上，我在本章末尾增加了一个面向数据的\
  \ MLP 演示，希望能向您展示纯数据项目在该领域仍然具有相关性。\n\n本章内容很大程度上受到了 Adrian Rosebrock 于 2019 年 2 月发表的博客文章“使用\
  \ Keras 和深度学习进行乳腺癌分类”的启发。正如 Adrian 在其博客中指出的，他的大多数读者“都认识某个曾患癌症的人”。我相信这句话对于本书的大多数读者来说也是成立的。希望本章的内容能为潜在的癌症患者带来一些希望，让他们看到在利用\
  \ AI、ML 和 DL 早期检测某些类型癌症方面正在取得实质性进展。\n\n## 零件清单\n\n本章演示需要标准的 RasPi 桌面配置。\n\n| 项目\
  \ | 型号 | 数量 | 来源 |\n| --- | --- | --- | --- |\n| Raspberry Pi 4 | Model B（2 或 4\
  \ GB RAM 的 RasPi 4） | 1 | mcmelectronics.comadafruit.comdigikey.commouser.comfarnell.com\
  \ |\n| Micro SD 卡 | 32 GB，class 10 或更大 | 1 | amazon.com |\n| USB 键盘 | Amazon Basic\
  \ | 1 | amazon.com |\n| USB 鼠标 | Amazon Basic | 1 | amazon.com |\n| HDMI 显示器 | 通用型\
  \ | 1 | amazon.com |\n\n### 注意\n\n至少需要 2 GB RAM 才能使 RasPi 4 编译和训练本章演示中使用的 CNN 模型。只有\
  \ 1 GB RAM 的 RasPi 无法成功完成演示。\n\n需要使用 32 GB 的 micro SD 卡，因为在虚拟 Python 环境中，OpenCV、Keras、TensorFlow、演示中使用的数据集以及最新的\
  \ Raspbian 操作系统的总内存需求超过 16 GB。\n\n\n\n## 下载乳腺癌组织学图像数据集\n\n组织学，又称显微解剖学或微观解剖学，是[生物学](https://en.wikipedia.org/wiki/Biology)的一个分支，研究生物[组织](https://en.wikipedia.org/wiki/Tissue_%2528biology%2529)的微观[解剖学](https://en.wikipedia.org/wiki/Anatomy)。具体来说，本问题领域所涉及的组织学，是指取自患有和未患有恶性乳腺癌细胞的患者的显微图像。\n\
  \n本演示中使用的数据集是针对浸润性导管癌（IDC）的。该数据集可通过以下链接下载：\n\n*   `www.kaggle.com/paultimothymooney/breast-histopathology-images`\n\
  \n这是一个非常大的下载文件（1.6 GB），需要解压两次才能访问原始图像。最终提取的数据集大小超过 2.4 GB。\n\n以下是数据集下载网站提供的背景和内容描述：\n\
  \n`背景：`\n\n浸润性导管癌（IDC）是所有乳腺癌中最常见的亚型。为了对整张切片样本进行侵袭性分级，病理学家通常关注包含 IDC 的区域。因此，自动侵袭性分级的常见预处理步骤之一是在整张切片中描绘出\
  \ IDC 的确切区域。\n\n`内容：`\n\n原始数据集包含 162 张以 40 倍放大倍数扫描的乳腺癌（BCa）标本整张切片图像。从中提取了 277,524\
  \ 个大小为 50 x 50 的图块（其中 198,738 个 IDC 阴性，78,786 个 IDC 阳性）。每个图块的文件名格式为 u_xX_yY_classC.png。例如，`10253_idx5_x1351_y1101_class0.png`，其中\
  \ u 是患者 ID（10253_idx5），X 是裁剪该图块的 x 坐标，Y 是裁剪该图块的 y 坐标，C 表示类别，0 为非 IDC，1 为 IDC。\n\n\
  综上所述，根据上述描述，数据集包含：\n\n*   277,524 个 50×50 像素的图像图块\n\n*   78,786 个正例（即表明图块中检测到乳腺癌）\n\
  \n*   198,738 个负例（即未检测到乳腺癌）\n\n通过检查部分图块坐标样本，我推断原始整张切片图像的像素尺寸必须为 1600 x 1600。这意味着，假设没有重叠图块，任何一张切片最多可以提取\
  \ 1024 个图块。这意味着，假设每位患者都有癌症和非癌症图块，整个数据集的最大潜在图块数为患者数量乘以 1024。稍后我将向您展示，本研究中共有 837 位患者，这意味着潜在的最大图块数为\
  \ 857,088 个。实际上，数据集中有 277,524 张图像，这意味着仅采样了潜在图块的 32%。虽然这个统计数据对于统计学家来说可能关乎任何预测的整体“质量”，但为了本演示的目的，我将选择忽略它。\n\
  \n然而，数据集中图像类型存在明显的不平衡。负类图像的数量是正类图像的两倍。这将在数据预处理时进行处理。\n\n图 8-1 展示了数据集中正类和负类图像的一小部分。\n\
  \n![../images/482214_1_En_8_Chapter/482214_1_En_8_Fig1_HTML.jpg](img/482214_1_En_8_Fig1_HTML.jpg)\n\
  \n图 8-1\n\n数据集图像的代表性样本\n\n在主目录 `IDC_regular_ps50_idc5` 下有 837 个子目录。接下来，您需要将此目录重命名为\
  \ `dataset`，以使其与我稍后将讨论的配置脚本兼容。您可以使用 `cp` 命令或使用文件管理器工具进行此更改。我几乎总是使用文件管理器，因为它很方便。\n\
  \n图 8-2 是运行 `tree` 命令的结果，您可以看到 837 个子目录中的一小部分。\n\n![../images/482214_1_En_8_Chapter/482214_1_En_8_Fig2_HTML.jpg](img/482214_1_En_8_Fig2_HTML.jpg)\n\
  \n图 8-2\n\n数据集主目录的 `tree` 命令\n\n每个子目录都包含特定患者的正类和负类图像，其数字 ID 即为子目录的名称。在每个子目录中，还有两个名为\
  \ `0` 和 `1` 的子目录。`0` 目录包含未检测到任何癌细胞的图像。`1` 目录包含检测到癌细胞的图像。\n\n本演示的最终目标是训练一个 CNN 模型来区分正类和负类图像，从而预测给定患者是否患有\
  \ IDC。\n\n### 准备项目环境\n\n在尝试任何项目脚本之前，第一步是设置一个 Python 虚拟环境。我在之前的演示中使用过这种环境类型，并将继续在本章的演示中使用。如果您需要复习，请参考第\
  \ 1 章关于如何创建虚拟环境的内容。\n\n必须安装五个依赖项以支持本章使用的脚本。如果您一直在复现前一章的演示，您可能已经安装了大部分（如果不是全部）依赖项。无论如何，您只需输入以下命令即可确保安装所需的依赖项：\n\
  \n```\npip install numpy opencv-contrib-python\npip install pillow\npip install\
  \ tensorflow keras\npip install imutils\npip install scikit-learn matplotlib\n```\n\
  \n如果您尚未安装 OpenCV，则在使用 `imutils` 包时会遇到问题。虽然本章的任何脚本都没有直接调用 OpenCV 函数，但 `imutils` 确实与此包存在一些嵌入式依赖关系。如果您需要安装\
  \ OpenCV 的指导，请参考第 2 章。\n\n设置好虚拟环境后，您就可以开始处理第一个脚本了。\n\n#### 配置脚本\n\n以下脚本设置了适当的目录路径，并定义了用于训练和验证的数据量。此脚本名为\
  \ `config_IDC.py`，可从本书的配套网站获取：\n\n```\n# 导入所需库\nimport os\n# 初始化输入图像目录的路径。\nORIG_INPUT_DATASET\
  \ = \"dataset\"\n# 初始化包含训练和测试分割后剩余图像的目录的基本路径。\nBASE_PATH = \"datasets/idc\"\n# 定义训练、验证和测试目录路径。\n\
  TRAIN_PATH = os.path.sep.join([BASE_PATH, \"training\"])\nVAL_PATH = os.path.sep.join([BASE_PATH,\
  \ \"validation\"])\nTEST_PATH = os.path.sep.join([BASE_PATH, \"testing\"])\n# 定义将用于训练的数据分割比例。\n\
  TRAIN_SPLIT = 0.8\n# 定义将用于验证的数据分割比例。\nVAL_SPLIT = 0.1\n# 向用户显示配置完成。\nprint('[INFO]:\
  \ Configuration complete')\n```\n\n此配置脚本将在运行接下来要讨论的脚本时执行。\n\n演示的下一步是构建数据集。\n\n\n\
  \n#### 构建数据集\n\n构建数据集的部分工作是将原始数据集拆分为三个较小的数据集，如图 8-3 所示。\n\n![../images/482214_1_En_8_Chapter/482214_1_En_8_Fig3_HTML.jpg](img/482214_1_En_8_Fig3_HTML.jpg)\n\
  \n图 8-3\n\n数据集拆分\n\n你首先应该意识到的一点是，原始数据集的大小略超过 5.8 GB。对于我用来运行此演示的 4 GB RasPi 4 来说，这显然太大了。为了避免这个问题，将使用\
  \ Keras 的 `ImageDataGenerator` 类从拆分后的数据集中创建更小的批次，这样就无需将整个原始数据集加载到 RAM 中。但是，必须先对原始数据集进行拆分和重新组织。\n\
  \n此脚本名为 `build_IDC_dataset.py`，将用于组织原始数据集。该脚本使用配置常量，这些常量在脚本开头运行 `config_IDC` 脚本时设置。此脚本可从本书的配套网站获取。代码清单后附有一些解释性注释。\n\
  \n```\n# 导入所需的库\nfrom config_IDC import config_IDC\nfrom imutils import paths\n\
  import random\nimport shutil\nimport os\n# 获取原始输入目录中所有输入图像的路径并打乱它们。\nimagePaths\
  \ = list(paths.list_images(config_IDC.ORIG_INPUT_DATASET))\nrandom.seed(42)\nrandom.shuffle(imagePaths)\n\
  # 计算训练集和测试集的拆分比例。\ni = int(len(imagePaths) * config_IDC.TRAIN_SPLIT)\ntrainPaths\
  \ = imagePaths[:i]\ntestPaths = imagePaths[i:]\n# 使用部分训练数据作为验证集。\ni = int(len(trainPaths)\
  \ * config.VAL_SPLIT)\nvalPaths = trainPaths[:i]\ntrainPaths = trainPaths[i:]\n\
  # 定义要构建的数据集。\ndatasets = [\n(\"training\", trainPaths, config.TRAIN_PATH),\n(\"\
  validation\", valPaths, config.VAL_PATH),\n(\"testing\", testPaths, config.TEST_PATH)\n\
  ]\n# 遍历数据集。\nfor (dType, imagePaths, baseOutput) in datasets:\n# 显示创建了哪个数据拆分\nprint(\"\
  [INFO] building '{}' split\".format(dType))\n# 如果基础输出目录不存在，则创建它。\nif not os.path.exists(baseOutput):\n\
  print(\"[INFO] 'creating {}' directory\".format(baseOutput))\nos.makedirs(baseOutput)\n\
  # 遍历输入图像路径。\nfor inputPath in imagePaths:\n# 提取输入图像的文件名，并提取类别标签（\"0\" 表示 \"阴性\"\
  ，\"1\" 表示 \"阳性\"）。\nfilename = inputPath.split(os.path.sep)[-1]\nlabel = filename[-5:-4]\n\
  # 构建标签目录的路径。\nlabelPath = os.path.sep.join([baseOutput, label])\n# 如果标签输出目录不存在，则创建它。\n\
  if not os.path.exists(labelPath):\nprint(\"[INFO] 'creating {}' directory\".format(labelPath))\n\
  os.makedirs(labelPath)\n# 构建目标图像的路径，然后复制图像本身。\np = os.path.sep.join([labelPath,\
  \ filename])\nshutil.copy2(inputPath, p)\n```\n\n解释性注释：\n\n配置设置和路径在脚本开头运行 `config_IDC`\
  \ 脚本后收集。Python 的 `random` 库用于随机打乱路径。`shutil` 库用于复制图像，`os` 库用于连接路径和创建目录。\n\n接下来，打乱所有数据集的\
  \ `imagePaths`，以提高随机性，从而获得更好的最终结果。然后计算训练/测试拆分的索引，并通过切片 `imagePaths` 来构建 `trainPaths`\
  \ 和 `testPaths`。`trainPaths` 被进一步拆分，以保留一部分用于验证。\n\n然后定义一个名为 `datasets` 的列表。该列表包含三个元组，每个元组都包含将所有\
  \ `imagePaths` 组织成训练、验证和测试数据所需的信息。\n\n然后开始对所有数据集进行迭代。循环中执行以下步骤：\n\n*   创建一个基础输出目录（仅一次）。\n\
  *   在当前拆分中，对所有输入图像进行嵌套循环，其中：\n    *   从输入路径中提取文件名，并从文件名中提取类别标签。\n*   构建 `labelPath`，并创建一个标签输出目录（仅一次）。\n\
  *   将每个文件复制到其目标目录。\n\n#### 运行构建数据集脚本\n\n通过输入以下命令来运行 `build_IDC_dataset.py` 脚本：\n\
  \n```\npython build_IDC_dataset.py\n```\n\n图 8-4 显示了运行脚本的结果。\n\n![../images/482214_1_En_8_Chapter/482214_1_En_8_Fig4_HTML.jpg](img/482214_1_En_8_Fig4_HTML.jpg)\n\
  \n图 8-4\n\n运行 `build_IDC_dataset` 脚本后的结果\n\n接下来，我在新构建的 `datasets` 目录上运行了 `tree`\
  \ 命令，以确认所需的数据集已按预期构建完成。图 8-5 显示了运行 `tree` 命令的结果。\n\n![../images/482214_1_En_8_Chapter/482214_1_En_8_Fig5_HTML.jpg](img/482214_1_En_8_Fig5_HTML.jpg)\n\
  \n图 8-5\n\n对 `datasets` 目录应用 `tree` 命令\n\n现在，数据集已经设置好，是时候讨论 CNN 模型了。\n\n\n\n####\
  \ CNN 模型\n\n本演示中使用的模型主要基于上一章讨论过的 VGGNet 风格模型。该模型包含多个堆叠的卷积层，这些卷积层使用了 VGG 模型典型的 3\
  \ x 3 滤波器。然而，此 VGG 模型使用的是深度可分离卷积层，而非标准卷积层。在此不深入细节，只需说明深度可分离卷积相比传统卷积，计算效率更高。\n\n\
  这个 CNN 模型被命名为 CancerNet，鉴于其根据患者的组织学研究来预测患者是否患有该疾病，这个名字似乎很贴切。图 8-6 展示了 CancerNet\
  \ 的结构。\n\n![../images/482214_1_En_8_Chapter/482214_1_En_8_Fig6_HTML.png](img/482214_1_En_8_Fig6_HTML.png)\n\
  \n图 8-6\n\nCancerNet 结构\n\n从该图可以明显看出，这个 CNN 网络非常复杂，包含许多层。这个 CNN 确实是深度网络的经典代表。图中显示了\
  \ 31 层，您可以通过统计以下类定义中添加到模型的层数来确认。\n\n以下类定义文件名为 cancernet.py，可从本书的配套网站获取：\n\n```\n\
  # 导入所需库\nfrom keras.models import Sequential\nfrom keras.layers.normalization import\
  \ BatchNormalization\nfrom keras.layers.convolutional import SeparableConv2D\nfrom\
  \ keras.layers.convolutional import MaxPooling2D\nfrom keras.layers.core import\
  \ Activation\nfrom keras.layers.core import Flatten\nfrom keras.layers.core import\
  \ Dropout\nfrom keras.layers.core import Dense\nfrom keras import backend as K\n\
  class CancerNet:\n@staticmethod\ndef build(width, height, depth, classes):\n# 初始化模型以及输入形状为\n\
  # \"channels last\" 和通道维度本身\nmodel = Sequential()\ninputShape = (height, width,\
  \ depth)\nchanDim = -1\n# 如果使用 \"channels first\"，则更新输入形状\n# 和通道维度。\nif K.image_data_format()\
  \ == \"channels_first\":\ninputShape = (depth, height, width)\nchanDim = 1\n# CONV\
  \ => RELU => POOL\nmodel.add(SeparableConv2D(32, (3, 3), padding=\"same\",\ninput_shape=inputShape))\n\
  model.add(Activation(\"relu\"))\nmodel.add(BatchNormalization(axis=chanDim))\nmodel.add(MaxPooling2D(pool_size=(2,\
  \ 2)))\nmodel.add(Dropout(0.25))\n# (CONV => RELU => POOL) * 2\nmodel.add(SeparableConv2D(64,\
  \ (3, 3), padding=\"same\"))\nmodel.add(Activation(\"relu\"))\nmodel.add(BatchNormalization(axis=chanDim))\n\
  model.add(SeparableConv2D(64, (3, 3), padding=\"same\"))\nmodel.add(Activation(\"\
  relu\"))\nmodel.add(BatchNormalization(axis=chanDim))\nmodel.add(MaxPooling2D(pool_size=(2,\
  \ 2)))\nmodel.add(Dropout(0.25))\n# (CONV => RELU => POOL) * 3\nmodel.add(SeparableConv2D(128,\
  \ (3, 3), padding=\"same\"))\nmodel.add(Activation(\"relu\"))\nmodel.add(BatchNormalization(axis=chanDim))\n\
  model.add(SeparableConv2D(128, (3, 3), padding=\"same\"))\nmodel.add(Activation(\"\
  relu\"))\nmodel.add(BatchNormalization(axis=chanDim))\nmodel.add(SeparableConv2D(128,\
  \ (3, 3), padding=\"same\"))\nmodel.add(Activation(\"relu\"))\nmodel.add(BatchNormalization(axis=chanDim))\n\
  model.add(MaxPooling2D(pool_size=(2, 2)))\nmodel.add(Dropout(0.25))\n# 第一组（也是唯一一组）FC\
  \ => RELU 层\nmodel.add(Flatten())\nmodel.add(Dense(256))\nmodel.add(Activation(\"\
  relu\"))\nmodel.add(BatchNormalization())\nmodel.add(Dropout(0.5))\n# Softmax 分类器\n\
  model.add(Dense(classes))\nmodel.add(Activation(\"softmax\"))\n# 返回构建好的网络架构\nreturn\
  \ model\n```\n\n该模型结构是顺序的，这意味着各层以串行方式添加。此模型中使用的层类型，除了实现前述深度可分离卷积的 `SeparableConv2D`\
  \ 层之外，大部分都在第 7 章的 CNN 模型中使用过。\n\n模型中定义了三个 `DEPTHWISE_CONV => RELU => POOL` 块，并增加了堆叠层数和滤波器数量。同时还添加了\
  \ `BatchNormalization` 和 `Dropout` 层。\n\n网络最后由 `FC => RELU` 层和 softmax 分类器完成。softmax\
  \ 分类器的输出将为每个预测类别生成预测百分比。\n\n该模型被构建为一个可调用的方法，这意味着实例化后的模型将被返回给训练脚本。\n\n\n\n#### 训练与测试脚本\n\
  \n训练脚本是关键部分，它最终将整个项目整合在一起。该脚本名为 `train_IDC_model.py`，不仅用于训练模型，还用于测试其预测准确性。此脚本可从本书的配套网站获取。以下是代码清单后的解释性注释。\n\
  \n```\n# 设置 matplotlib 后端，以便将图形保存到\n# 后台\nimport matplotlib\nmatplotlib.use(\"Agg\"\
  )\n# 导入所需的库\nfrom keras.preprocessing.image import ImageDataGenerator\nfrom keras.callbacks\
  \ import LearningRateScheduler\nfrom keras.optimizers import Adagrad\nfrom keras.utils\
  \ import np_utils\nfrom sklearn.metrics import classification_report\nfrom sklearn.metrics\
  \ import confusion_matrix\nfrom cancernet import CancerNet\nimport config_IDC as\
  \ config\nfrom imutils import paths\nimport matplotlib.pyplot as plt\nimport numpy\
  \ as np\nimport argparse\nimport os\n# 构建参数解析器并解析参数。\nap = argparse.ArgumentParser()\n\
  ap.add_argument(\"-p\", \"--plot\", type=str, default=\"plot.png\",\nhelp=\"输出损失/准确率图的路径\"\
  )\nargs = vars(ap.parse_args())\n# 初始化训练轮数、初始学习率和\n# 批次大小。\nNUM_EPOCHS = 40\nINIT_LR\
  \ = 1e-2\nBS = 32\n# 确定训练、验证和测试目录中的\n# 图像路径总数。\ntrainPaths = list(paths.list_images(config.TRAIN_PATH))\n\
  totalTrain = len(trainPaths)\ntotalVal = len(list(paths.list_images(config.VAL_PATH)))\n\
  totalTest = len(list(paths.list_images(config.TEST_PATH)))\n# 处理标签数据中的偏斜\ntrainLabels\
  \ = [int(p.split(os.path.sep)[-2]) for p in trainPaths]\ntrainLabels = np_utils.to_categorical(trainLabels)\n\
  classTotals = trainLabels.sum(axis=0)\nclassWeight = classTotals.max() / classTotals\n\
  # 初始化训练数据增强对象\ntrainAug = ImageDataGenerator(\nrescale=1 / 255.0,\nrotation_range=20,\n\
  zoom_range=0.05,\nwidth_shift_range=0.1,\nheight_shift_range=0.1,\nshear_range=0.05,\n\
  horizontal_flip=True,\nvertical_flip=True,\nfill_mode=\"nearest\")\n# 初始化验证（和测试）数据增强\n\
  # 对象。\nvalAug = ImageDataGenerator(rescale=1 / 255.0)\n# 初始化训练生成器。\ntrainGen = trainAug.flow_from_directory(\n\
  config.TRAIN_PATH,\nclass_mode=\"categorical\",\ntarget_size=(48, 48),\ncolor_mode=\"\
  rgb\",\nshuffle=True,\nbatch_size=BS)\n# 初始化验证生成器。\nvalGen = valAug.flow_from_directory(\n\
  config.VAL_PATH,\nclass_mode=\"categorical\",\ntarget_size=(48, 48),\ncolor_mode=\"\
  rgb\",\nshuffle=False,\nbatch_size=BS)\n# 初始化测试生成器。\ntestGen = valAug.flow_from_directory(\n\
  config.TEST_PATH,\nclass_mode=\"categorical\",\ntarget_size=(48, 48),\ncolor_mode=\"\
  rgb\",\nshuffle=False,\nbatch_size=BS)\n# 初始化 CancerNet 模型并编译它。\nmodel = CancerNet.build(width=48,\
  \ height=48, depth=3,\nclasses=2)\nopt = Adagrad(lr=INIT_LR, decay=INIT_LR / NUM_EPOCHS)\n\
  model.compile(loss=\"binary_crossentropy\", optimizer=opt,\nmetrics=[\"accuracy\"\
  ])\n# 拟合模型。\nH = model.fit_generator(\ntrainGen,\nsteps_per_epoch=totalTrain //\
  \ BS,\nvalidation_data=valGen,\nvalidation_steps=totalVal // BS,\nclass_weight=classWeight,\n\
  epochs=NUM_EPOCHS)\n# 重置测试生成器，然后使用训练好的模型\n# 对数据进行预测。\nprint(\"[INFO] 正在评估网络...\"\
  )\ntestGen.reset()\npredIdxs = model.predict_generator(testGen,\nsteps=(totalTest\
  \ // BS) + 1)\n# 对于测试集中的每张图像，找到\n# 对应最大预测概率的标签索引。\npredIdxs = np.argmax(predIdxs,\
  \ axis=1)\n# 显示格式良好的分类报告。\nprint(classification_report(testGen.classes, predIdxs,\n\
  target_names=testGen.class_indices.keys()))\n# 计算混淆矩阵，并据此推导出原始\n# 准确率、敏感度和特异度。\n\
  cm = confusion_matrix(testGen.classes, predIdxs)\ntotal = sum(sum(cm))\nacc = (cm[0,\
  \ 0] + cm[1, 1]) / total\nsensitivity = cm[0, 0] / (cm[0, 0] + cm[0, 1])\nspecificity\
  \ = cm[1, 1] / (cm[1, 0] + cm[1, 1])\n# 显示混淆矩阵、准确率、敏感度和\n# 特异度。\nprint(cm)\nprint(\"\
  acc: {:.4f}\".format(acc))\nprint(\"sensitivity: {:.4f}\".format(sensitivity))\n\
  print(\"specificity: {:.4f}\".format(specificity))\n# 绘制训练损失和准确率图。\nN = NUM_EPOCHS\n\
  plt.style.use(\"ggplot\")\nplt.figure()\nplt.plot(np.arange(0, N), H.history[\"\
  loss\"], label=\"train_loss\")\nplt.plot(np.arange(0, N), H.history[\"val_loss\"\
  ], label=\"val_loss\")\nplt.plot(np.arange(0, N), H.history[\"acc\"], label=\"train_acc\"\
  )\nplt.plot(np.arange(0, N), H.history[\"val_acc\"], label=\"val_acc\")\nplt.title(\"\
  数据集上的训练损失和准确率\")\nplt.xlabel(\"轮次 #\")\nplt.ylabel(\"损失/准确率\")\nplt.legend(loc=\"\
  lower left\")\nplt.savefig(args[\"plot\"])\n```\n\n解释性注释如下：\n\n该脚本使用了以下库，并附有简要说明：\n\
  \n1.  **Matplotlib** – 这是科学绘图包，是 Python 的事实标准。该库设置为使用“Agg”后端，以便将训练图保存到磁盘。\n\n2.\
  \  **Keras** – 使用 Keras 的 `ImageDataGenerator`、`LearningRateScheduler`、`Adagrad`\
  \ 优化器和 `np_utils`。\n\n3.  **sklearn** – 使用 scikit-learn 实现的 `classification_report`\
  \ 和 `confusion_matrix`。\n\n4.  **config_IDC** – 使用此脚本配置来获取三个数据分区的路径。\n\n5.  **cancernet**\
  \ – 训练和评估所需的 `CancerNet` 类定义。\n\n6.  **imutils** – 使用 `paths` 模块获取每张图像的路径。\n\n7.\
  \  **numpy** – 用于 Python 中的数值处理。\n\n8.  **argparse** – 用于解析命令行参数。\n\n9.  **os**\
  \ – 用于访问操作系统级别的命令。\n\n该脚本有一个可选的命令行参数 `--plot`。如果在运行时在终端中提供了此参数，脚本将使用该名称将图保存到磁盘。如果未指定带有绘图文件名的命令行参数，则将使用默认名称\
  \ `plot.png`。\n\n训练轮数、初始学习率和批次大小在解析器代码之后定义。\n\n在这些定义之后，确定训练、验证和测试目录中的图像路径总数。\n\n\
  然后为训练数据计算 `classWeight` 参数，以处理类别不平衡/偏斜。当训练数据集中数据元素的比例失衡时，就会发生类别不平衡。正如我在本章开头提到的，本项目就是这种情况。良性样本图像的数量是恶性样本图像的两倍多。类别不平衡会给模型带来两个问题：\n\
  \n*   对于不平衡的类别，永远无法获得优化的结果，因为模型从未得到充分训练。\n*   由于类别之间的错误表示，验证变得困难，其中一个或多个类别严重代表性不足。\n\
  \nKeras 的 `fit` 函数使用 `classWeight` 参数来帮助纠正数据集的不平衡。我不确定该函数内部是如何实现的。\n\n接下来的代码部分涉及数据增强，这是一种正则化形式。正则化对于几乎所有深度学习实验都至关重要，有助于模型的泛化。该函数在将训练数据集传入网络进行训练之前，会对其进行扰动，略微修改其内容。这种方法在一定程度上减少了对收集额外训练数据的需求。\n\
  \n首先初始化数据增强对象 `trainAug`。然后在应用于训练数据集时，对其应用随机旋转、平移、剪切和翻转。`trainAug` 对象还将图像像素强度重新缩放到\
  \ 0 到 1 的范围。\n\n接下来，初始化训练、验证和测试生成器。每个生成器按需提供图像批次，如 `batch_size` 参数所指定。\n\n然后使用 `Adagrad`\
  \ 优化器初始化模型。回想一下，我在前一章中提到过 Keras 中可用的各种优化器。`Adagrad` 优化器是一种基于梯度的优化算法，它使学习率（lr）适应参数，对与频繁出现的特征相关的参数执行较小的更新（即低学习率），对与不频繁特征相关的参数执行较大的更新（即高学习率）。因此，它非常适合处理稀疏数据，而本训练数据集（至少对于一个类别而言）正是这种情况。`Adagrad`\
  \ 优化器在其操作中同时使用初始学习率和衰减学习率。\n\n然后使用 `binary_crossentropy` 损失函数编译模型，因为只有两个数据类别。\n\n\
  Keras 的 `fit_generator` 方法启动训练过程。通过使用此方法，训练图像数据可以驻留在磁盘上，并以批次方式应用，而不是在整个训练过程中将整个数据集保存在\
  \ RAM 中。这是树莓派系统处理如此庞大训练数据集的唯一可行方法。\n\n训练完成后，对所有测试数据进行预测。在预测过程中再次使用生成器对象。\n\n收集每个样本的最高预测索引，然后显示\
  \ `classification_report`。\n\n然后生成混淆矩阵。该矩阵显示模型准确率、敏感度和特异度。\n\n最后，生成包含训练/验证损失和训练/验证准确率的训练历史图。这些是时间序列图，用于检测过拟合/欠拟合。\n\
  \n\n\n#### 运行训练与测试脚本\n\n### 注意\n\n此脚本计算量极大。经我测试，在 RasPi 4 系统上完成 1 个 epoch 就需要 2.7\
  \ 小时。如果你选择像原博客那样运行 40 个 epoch，那么预计需要等待约 108 小时才能完成。那可是 4.5 天！另一种选择是将 epoch 数量减少到更易管理的数值，例如\
  \ 8 个，但这仍然意味着你需要等待大约 21 小时才能完成。我估计，精度的损失最多仅在 0.5% 到 1.0% 的范围内，我认为这是为了节省近 4 天等待时间而可以接受的权衡。运行这个演示让我确信了\
  \ GPU 加速处理的价值。\n\n我在 RasPi 4 系统（4 GB 内存）上运行了 `train_IDC_model` 脚本，使用了默认配置值，仅将 epoch\
  \ 数量设置为 8。我不确定这个脚本及其训练集是否能在标准的 RasPi 3 系统上运行。\n\n通过输入以下命令来运行脚本：\n\n```\npython train_IDC_model.py\n\
  ```\n\n图 8-7 显示了脚本开始运行时的结果。\n\n![../images/482214_1_En_8_Chapter/482214_1_En_8_Fig7_HTML.jpg](img/482214_1_En_8_Fig7_HTML.jpg)\n\
  \n图 8-7\n\n脚本开始运行\n\n21.5 小时后，脚本运行结束，最终结果如图 8-8 所示。\n\n![../images/482214_1_En_8_Chapter/482214_1_En_8_Fig8_HTML.jpg](img/482214_1_En_8_Fig8_HTML.jpg)\n\
  \n图 8-8\n\n运行 `train_IDC_model` 脚本后的结果\n\n图中显示的混淆矩阵（误差矩阵）在表 8-1 中复现。如果你需要复习混淆矩阵的相关知识，请参考第\
  \ 1 章的讨论。\n\n表 8-1\n\nCNN 混淆矩阵\n\n|   | 预测值 |\n| --- | --- |\n| **实际值** | 0 | 1\
  \ |\n| 0 | 35055 (TN) | 4788 (FP) |\n| 1 | 3455 (FN) | 12207 (TP) |\n\n其中\n\n0 =\
  \ 未检测到癌细胞（阴性）\n\n1 = 检测到癌细胞（阳性）\n\n有关 TN、FN、TP 和 FP 的定义，请参见以下数据。\n\n图 8-9 包含了训练损失和准确率的时间变化图。这些图只是每个\
  \ epoch 完成后的中间结果。\n\n![../images/482214_1_En_8_Chapter/482214_1_En_8_Fig9_HTML.jpg](img/482214_1_En_8_Fig9_HTML.jpg)\n\
  \n图 8-9\n\n训练损失和准确率的时间变化图\n\n在这些图中需要注意几点。首先，训练和验证的准确率图在第一个 epoch 完成后趋于一致，并在所有后续\
  \ epoch 中保持同步。这表明 CNN 模型几乎没有出现过拟合或欠拟合。该模型似乎与这个数据集拟合得非常好。其次要注意的是，在第二个 epoch 完成后，准确率图看起来是水平的，这证实了我的假设：8\
  \ 个 epoch 足以产生可靠的结果。同时观察损失图，可以看到它们已经稳定在某个值附近，随着 epoch 增加仅有微小变化，这证实了最终结果的稳定性。\n\n\
  #### 通过讨论敏感性、特异性和 AUROC 曲线来评估结果\n\n观察该图，你可以看到模型达到了 85.15% 的准确率；然而，这个准确率值在很大程度上受到“无癌症”类别以\
  \ 91% 的比率被正确分类这一事实的影响。\n\n计算结果的敏感性和特异性也有助于更好地理解模型的性能。在开始讨论这些指标之前，我需要定义一些术语并提供一些公式作为背景。假设在接下来的讨论中，提到的模型用于预测患者是否患有某种疾病。阳性结果表示存在疾病，阴性结果表示没有疾病。\n\
  \n真正例 (TP) – 真正例是指模型正确预测出阳性类别的结果。\n\n真负例 (TN) – 真负例是指模型正确预测出阴性类别的结果。\n\n假正例 (FP)\
  \ – 假正例是指模型错误地预测出阳性类别的结果。\n\n假负例 (FN) – 假负例是指模型错误地预测出阴性类别的结果。\n\n真正例率 (TPR)/敏感性/召回率公式：\n\
  \n![$$ TPR=\\frac{TP}{TP+ FN} $$](img/482214_1_En_8_Chapter_TeX_Equa.png)\n\n特异性公式：\n\
  \n![$$ Specificity=\\frac{TN}{TN+ FP} $$](img/482214_1_En_8_Chapter_TeX_Equb.png)\n\
  \n假正例率 (FPR) 公式：\n\n![$$ FPR=1- Specificity $$](img/482214_1_En_8_Chapter_TeX_Equc.png)\n\
  \n![$$ =\\frac{FP}{TN+ FP} $$](img/482214_1_En_8_Chapter_TeX_Equd.png)\n\n假负例率 (FNR)\
  \ 公式：\n\n![$$ FNR=\\frac{FN}{TP+ FN} $$](img/482214_1_En_8_Chapter_TeX_Eque.png)\n\
  \n在演示模型中，敏感性衡量了实际为 TP 且被预测为阳性的比例，达到了 87.98%。相反，特异性衡量的 TN 率为 77.94%。务必小心处理假负例。你绝对不想在某人实际上是“癌症阳性”时，将其归类为“无癌症”。\n\
  \n假正例率也很重要，因为你不想错误地将患者归类为“癌症阳性”，然后让他们接受可能不必要且可能痛苦的广泛治疗。\n\n任何 AI 从业者都必须注意敏感性和特异性之间的平衡，尤其是在涉及深度学习和医疗/健康治疗时。\n\
  \n##### 什么是敏感性？\n\n敏感性是衡量实际阳性案例中被预测为阳性（TP）的比例。敏感性的另一个名称是召回率，这意味着会有另一部分实际阳性案例被错误地预测为阴性，可称为\
  \ FN。这也以 FNR 的形式表示。敏感性与假负例率 (FNR) 之和始终为 1。当模型用于预测某人是否患有疾病时，这个概念可能更容易理解。敏感性衡量的是患有疾病的人中被正确预测为患有疾病的比例。换句话说，就是不健康的人实际上被预测为不健康。\n\
  \n理想情况下，模型应力求降低 FN，因为这可能危及生命。\n\n较高的敏感性值意味着较高的 TP 值和较低的 FN 值。较低的敏感性值意味着较低的 TP 值和较高的\
  \ FN 值。出于医疗和财务原因，人们希望使用高敏感性的模型。\n\n##### 什么是特异性？\n\n特异性定义为实际阴性案例中被预测为阴性（TN）的比例。这意味着会有另一部分实际阴性案例被预测为阳性，可称为\
  \ FP。这个比例也称为 FPR。特异性和 FPR 之和始终为 1。当模型用于预测某人是否患有疾病时，这个概念可能更容易理解。特异性衡量的是没有患病的人中被正确预测为没有患病的比例。换句话说，特异性就是健康的人实际上被预测为健康。\n\
  \n较高的特异性值意味着较高的 TN 值和较低的 FPR。较低的特异性值意味着较低的 TN 值和较高的 FP 值。\n\n\n\n##### 敏感度与特异度有何区别？它们如何应用？\n\
  \n敏感度指标用于衡量实际阳性案例中被正确预测的比例。特异度指标则用于衡量实际阴性案例中被正确预测的比例。\n\n敏感度和特异度指标可用于绘制受试者工作特征曲线下面积（AUC-ROC）。AUC-ROC（也称为\
  \ AUROC）曲线是一种图形化展示，用于说明二分类系统在不同判别阈值下的诊断能力。ROC 是一条概率曲线，而 AUC 代表类别可分性的程度或度量。它反映了模型区分不同类别的能力。AUC\
  \ 值越高，模型将 0 预测为 0、将 1 预测为 1 的能力就越强。类比而言，AUC 值越高，模型区分患病患者与未患病患者的能力就越强。\n\nAUROC 曲线是通过在不同阈值设置下，以\
  \ y 轴为真正率（TPR）、x 轴为假正率（FPR）绘制而成的。FPR 也称为误报率或虚警概率，可通过 1 − TPR 计算得出。因此，AUROC 曲线本质上是敏感度随误报率变化的函数。图\
  \ 8-10 展示了一条典型的 AUROC 曲线。\n\n![../images/482214_1_En_8_Chapter/482214_1_En_8_Fig10_HTML.jpg](img/482214_1_En_8_Fig10_HTML.jpg)\n\
  \n**图 8-10**\n典型 AUROC 曲线\n\n一个优秀的模型其 AUC 接近 1.0，这意味着它具有良好的类别预测分离能力。一个较差的模型其 AUC\
  \ 接近 0，表示其类别可分性最差。实际上，这种情况是将 0 预测为 1、将 1 预测为 0。这种状况被称为类别反转。当 AUC 为 0.5 时，意味着模型完全无法区分不同类别。\n\
  \n接下来的系列图示将有助于阐明 AUROC 曲线如何用于解释模型性能。\n\n如前所述，ROC 是一条概率曲线，因此本讨论将使用概率分布图。假设图中右侧曲线代表正类（即患病患者），相应地，左侧曲线代表健康患者。图\
  \ 8-11 展示了两个类别完全分离且 AUC 为 1.0 的情况。此时模型能够完全区分正类和负类样本。\n\n![../images/482214_1_En_8_Chapter/482214_1_En_8_Fig11_HTML.jpg](img/482214_1_En_8_Fig11_HTML.jpg)\n\
  \n**图 8-11**\n完美的类别分离\n\n这种情况下的 AUROC 曲线如图 8-12 所示。\n\n![../images/482214_1_En_8_Chapter/482214_1_En_8_Fig12_HTML.jpg](img/482214_1_En_8_Fig12_HTML.jpg)\n\
  \n**图 8-12**\nAUC = 1.0 时的 AUROC 曲线\n\n现在，让我们稍微改变情况，假设概率分布有少量重叠。这引入了统计学家所称的第一类错误和第二类错误发生的可能性。第一类错误是假阳性（FP），即在此情境下，预测患者患病但实际上并未患病。类似地，第二类错误是假阴性（FN），即预测患者未患病但实际上已患病。图\
  \ 8-13 展示了 AUC 等于 0.7 时的分布情况。\n\n![../images/482214_1_En_8_Chapter/482214_1_En_8_Fig13_HTML.jpg](img/482214_1_En_8_Fig13_HTML.jpg)\n\
  \n**图 8-13**\n70%的类别分离度\n\nAUC 为 0.7 意味着模型有 70%的概率能够成功区分正类和负类。\n\n这种情况下的 AUROC 曲线如图\
  \ 8-14 所示。\n\n![../images/482214_1_En_8_Chapter/482214_1_En_8_Fig14_HTML.jpg](img/482214_1_En_8_Fig14_HTML.jpg)\n\
  \n**图 8-14**\nAUC = 0.7 时的 AUROC 曲线\n\n现在，让情况变得更糟，将 AUC 设为 0.5。在此 AUC 值下，模型无法区分不同类别。图\
  \ 8-15 展示了重叠的概率分布曲线，这证明了模型为何无效。\n\n![../images/482214_1_En_8_Chapter/482214_1_En_8_Fig15_HTML.jpg](img/482214_1_En_8_Fig15_HTML.jpg)\n\
  \n**图 8-15**\n50%的类别分离度\n\n这种情况下的 AUROC 曲线如图 8-16 所示。\n\n![../images/482214_1_En_8_Chapter/482214_1_En_8_Fig16_HTML.jpg](img/482214_1_En_8_Fig16_HTML.jpg)\n\
  \n**图 8-16**\nAUC = 0.5 时的 AUROC 曲线\n\n最后一种情况发生在分布发生翻转时，如图 8-11 所示，但此时正类位于左侧，负类位于右侧。这就是我之前提到的反转情况，这种情况下的\
  \ AUROC 曲线如图 8-17 所示。\n\n![../images/482214_1_En_8_Chapter/482214_1_En_8_Fig17_HTML.jpg](img/482214_1_En_8_Fig17_HTML.jpg)\n\
  \n**图 8-17**\nAUC = 0.0 时的 AUROC 曲线\n\n反转是一种极端情况，在任何实际模型中都不应发生。此处展示仅是为了完善背景讨论。\n\
  \n我将在下一个演示中向您展示一条实际的 AUROC 曲线。\n\n### 使用 MLP 模型进行乳腺癌预测\n\n本演示使用了来自 699 名患者乳腺癌样本的组织学研究结果，根据记录的特征预测癌症的存在与否。此演示与本章中第一个使用\
  \ CNN 模型的演示有显著不同。在本例中，使用的是病理学家活检检查的结果，而不是像第一个演示那样直接处理原始图像。该模型是一个 MLP 应用，而非 CNN 应用。\n\
  \n数据集是威斯康星州乳腺癌（诊断）数据集特征，这些特征是根据乳腺肿块细针穿刺（FNA）的数字化图像计算得出的。数据描述了图像中存在的细胞核特征。该数据集由 K.\
  \ P. Bennett 和 O. L. Mangasarian 在《鲁棒线性规划对两个线性不可分集的判别》（《优化方法与软件》1992 年第 1 期）中详细描述。\n\
  \n您可以从 UCI 机器学习库下载输入数据集。\n\n`https://archive.ics.uci.edu/ml/datasets/Breast+Cancer+Wisconsin+%28Diagnostic%29`\n\
  \n将下载的文件重命名为 data.csv，并放置在一个名为 input 的新子目录中。\n\n现在，您需要将第七列中的 16 个'?'条目替换为 1。我知道这可能会对数据集产生一些偏差，但如果不将这些字符替换为数字，脚本将无法运行。我选择的数字是该列中出现频率最高的数字。我使用\
  \ MS Excel 程序进行了更改，但您也可以使用 RasPi 系统上应已安装的 LibreOffice Calc 应用程序。\n\n以下脚本名为 bcMLP.py，可从本书配套网站获取。无需进一步的解释性注释，因为我在之前的脚本中已经向您展示过相同或几乎相同的代码。\n\
  \n\n\n```\n# 导入所需的库\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot\
  \ as plt\nimport seaborn as sns\nfrom sklearn.preprocessing import LabelEncoder\n\
  from sklearn.model_selection import train_test_split\nfrom sklearn.preprocessing\
  \ import StandardScaler\nfrom sklearn.metrics import confusion_matrix\nfrom sklearn.metrics\
  \ import roc_curve, auc\nfrom sklearn.ensemble import RandomForestClassifier\nimport\
  \ keras\nfrom keras.models import Sequential\nfrom keras.layers import Dense, Dropout\n\
  # 加载数据\ndata = pd.read_csv('input/data.csv')\n#del data['Unnamed: 32']\nX = data.iloc[:,\
  \ 1:9].values\ny = data.iloc[:, 10].values\n# 编码分类数据\nlabelencoder_X_1 = LabelEncoder()\n\
  y = labelencoder_X_1.fit_transform(y)\n# 将数据集拆分为训练集和测试集\nX_train, X_test, y_train,\
  \ y_test = train_test_split(X, y, test_size = 0.1, random_state = 0)\n#特征缩放\nsc\
  \ = StandardScaler()\nX_train = sc.fit_transform(X_train)\nX_test = sc.transform(X_test)\n\
  # 初始化人工神经网络\nclassifier = Sequential()\n# 添加输入层和第一个隐藏层\nclassifier.add(Dense(output_dim=16,\
  \ init=\"uniform\", activation=\"relu\", input_dim=8))\n# 添加 Dropout 以防止过拟合\nclassifier.add(Dropout(p=0.1))\n\
  # 添加第二个隐藏层\nclassifier.add(Dense(output_dim=16, init=\"uniform\", activation=\"\
  relu\"))\n# 添加 Dropout 以防止过拟合\nclassifier.add(Dropout(p=0.1))\n# 添加输出层\nclassifier.add(Dense(output_dim=1,\
  \ init=\"uniform\", activation=\"sigmoid\"))\n# 编译人工神经网络\nclassifier.compile(optimizer='adam',\
  \ loss=\"binary_crossentropy\", metrics=['accuracy'])\n# 将人工神经网络拟合到训练集\n# 批次大小和迭代次数通过试错法设定。\n\
  classifier.fit(X_train, y_train, batch_size=100, nb_epoch=150)\n# 预测测试集结果\ny_pred\
  \ = classifier.predict(X_test)\ny_pred = (y_pred > 0.5) # 将连续值转换为二值\n# 创建混淆矩阵对象\n\
  cm = confusion_matrix(y_test, y_pred)\n# 显示准确率\nprint('准确率为 {}%'.format(((cm[0][0]\
  \ + cm[1][1])/70)*100))\n# 显示混淆矩阵\nprint('\\n 混淆矩阵\\n',cm)\n# 生成并显示 Seaborn 热力图\n\
  sns.heatmap(cm, annot=True)\nplt.savefig('bcHeatmap.png')\nplt.show()\n# 实例化随机森林分类器\n\
  rf_clf = RandomForestClassifier(n_estimators=100)\nrf_clf.fit(X_train, y_train)\n\
  # 计算概率分布\nprobas = rf_clf.predict_proba(X_test)# 绘图\nplt.figure(dpi=150)\nplt.hist(probas,\
  \ bins=20)\nplt.title('分类概率')\nplt.xlabel('概率')\nplt.ylabel('实例数量')\nplt.xlim([0.5,\
  \ 1.0])\nplt.legend('01')\nplt.show()\n# 计算假正率和真正率\nfpr, tpr, thresholds = roc_curve(y_test,\
  \ probas[:,0], pos_label=0)\n# 计算曲线下面积\nroc_auc = auc(fpr, tpr)\n# 绘制 AUROC 曲线\n\
  plt.figure(dpi=150)\nplt.plot(fpr, tpr, lw=1, color=\"green\", label=f'AUC = {roc_auc:.3f}')\n\
  plt.title('随机森林分类器的 ROC 曲线')\nplt.xlabel('假正率')\nplt.ylabel('真正率（召回率）')\nplt.xlim([-0.05,\
  \ 1.05])\nplt.ylim([-0.05, 1.05])\nplt.legend()\nplt.show()\n```\n\n#### 运行 MLP\
  \ 脚本\n\n通过输入以下命令来运行脚本：\n\n```\npython bcMLP.py\n```\n\n图 8-18 显示了运行脚本后的结果。\n\n![../images/482214_1_En_8_Chapter/482214_1_En_8_Fig18_HTML.jpg](img/482214_1_En_8_Fig18_HTML.jpg)\n\
  \n图 8-18\n\n运行 bcMLP 脚本后的结果\n\n图中显示的混淆矩阵在表 8-2 中复现。\n\n表 8-2\n\nMLP 混淆矩阵\n\n|  \
  \ | 预测值 |\n| --- | --- |\n| **实际值** | 0 | 1 |\n| 0 | 40 | 1 |\n| 1 | 0 | 29 |\n\n\
  其中\n\n0 = 未检测到癌症（阴性）\n\n1 = 检测到癌症（阳性）\n\n从表中可以清楚地看到，该模型在预测未患癌症时准确率为 100%（0 个假正例），在预测患癌症时准确率为\
  \ 98.57%（1 个假负例）。最后这个指标与脚本运行后显示的准确率值完全相同。当然，在癌症仍然存在的情况下报告患者无癌，其现实后果可能对患者造成毁灭性打击。因此，即使\
  \ 1.43% 的错误率极低，但由于涉及患者安全的巨大后果，也必须谨慎看待。\n\n顺便提一下，虽然大多数读者已经明白，但我还是要明确指出，混淆矩阵中显示的总数\
  \ 70 是由于测试集大小采用了 10% 的分割比例。由于原始数据集中有 699 名患者，测试集大小四舍五入为 70。\n\n图 8-19 是一个热力图，提供了另一种可视化混淆矩阵结果的方式。\n\
  \n![../images/482214_1_En_8_Chapter/482214_1_En_8_Fig19_HTML.jpg](img/482214_1_En_8_Fig19_HTML.jpg)\n\
  \n图 8-19\n\n热力图\n\n对于纸质书读者，我强烈建议查看包含本书所有彩色图片的 PDF 中图 8-19 的彩色图像版本。\n\n为了生成 AUROC\
  \ 图，必须首先创建概率分布。由于 MLP 模型无法直接提供概率分布，这就是我实例化一个名为 `rf_clf` 的随机森林分类器对象的原因。虽然底层模型不同，但由于数据集的特性，最终的\
  \ AUROC 图应该几乎相同。图 8-20 是正类（1）和负类（0）概率分布的条形图。\n\n![../images/482214_1_En_8_Chapter/482214_1_En_8_Fig20_HTML.jpg](img/482214_1_En_8_Fig20_HTML.jpg)\n\
  \n图 8-20\n\n数据集类别概率分布\n\n你可以清楚地看到，两个类别的分布都高度右偏，这将迫使 AUROC 图类似于图 8-12。正如你在图 8-21\
  \ 中所见，这正是生成该图时发生的情况。\n\n![../images/482214_1_En_8_Chapter/482214_1_En_8_Fig21_HTML.jpg](img/482214_1_En_8_Fig21_HTML.jpg)\n\
  \n图 8-21\n\n乳腺癌数据集的随机森林模型 AUROC 图\n\n当你看到这样的图时，你的直接收获是，该分类器模型对于该特定数据集来说是一个性能出色的模型。这一结论得到了用于量化模型的其他性能指标的支持。\n\
  \n\n\n"
- "# 9. 强化学习\n\n大多数读者可能都听说过人工智能自学玩电脑游戏的例子，其中最著名的当属 DeepMind。2016 年，DeepMind 团队因其 AlphaGo\
  \ 程序击败韩国围棋世界冠军而登上国际新闻。同样，过去也有许多成功的尝试，旨在开发能够玩《*打砖块*》、《*乓*》和《*太空侵略者*》等雅达利游戏的软件智能体。\n\
  \n这些程序都遵循一种称为强化学习（RL）的机器学习范式。以下是一个关于 RL 工作原理的直观类比。\n\n以 1978 年经典的雅达利游戏《*打砖块*》为例。游戏的目标是通过从屏幕底部反弹一个球，清除屏幕顶部的所有砖块。你控制屏幕底部的一个挡板来反弹球。每次击中砖块，砖块就会消失，分数增加，即获得奖励。图\
  \ 9-1 展示了一系列《*打砖块*》的截图，说明了游戏的功能。\n\n![../images/482214_1_En_9_Chapter/482214_1_En_9_Fig1_HTML.jpg](img/482214_1_En_9_Fig1_HTML.jpg)\n\
  \n图 9-1\n\n雅达利《打砖块》游戏截图\n\n现在，让我们考虑如何教会一个人工神经网络（ANN）玩这个游戏。一种方法是输入一系列截图，并输出诸如“向右移动挡板”、“向左移动挡板”或“发射”（即发射球）等指令。从这个意义上说，学习过程变成了一个分类问题，即给定的屏幕图像预测应采取三种动作中的哪一种。这看起来很简单，但请考虑一下这将需要海量的训练样本。这种方法相当幼稚，因为不需要游戏专家重复成千上万次地指示“做这个”或“做那个”。我们需要的是某种反馈，表明所采取的动作是正确的或接近正确，并允许进行一些自我修正。\n\
  \nRL 试图解决这类问题。RL 既可以是监督学习，也可以是无监督学习。监督学习为每个训练样本提供一个目标标签，而无监督学习则没有标签。RL 拥有稀疏的“标签”，这些标签是时间延迟的，被称为奖励。软件智能体必须仅基于奖励来学习行为。\n\
  \n实际上，为《*打砖块*》游戏实现 RL 算法面临着诸多挑战。事实证明，所给予的奖励可能与奖励给出之前立即采取的动作关系不大。当球击中砖块时才会获得奖励，但挡板必须事先正确定位，并且发射按钮必须在适当的时间按下。即时奖励与所有必要的前置动作之间的脱节被称为信用分配问题，即哪个前置动作对奖励负责，以及负责到什么程度？\n\
  \n玩《*打砖块*》以及大多数其他游戏通常需要策略。玩家通常一开始会以随机方式玩游戏，但随着观察游戏的进展，他们会逐渐演变出自己的游戏策略。例如，在《*打砖块*》中，球往往更频繁地飞向左侧而非右侧。一个简单的策略——将挡板更多地移到左侧——通常能获得更多分数。但这可能不是提高分数的唯一方法。确定最优策略的一种方法被称为探索-利用困境，这是在试图获得最多奖励时需要考虑的一个有用框架。\n\
  \nRL 模型是封装我们人类学习经验的有效方式，无论是在学校、商业领域，甚至政府或军事环境中。信用分配和探索-利用困境每天都在我们的所有活动中出现。RL 是一个值得探索和实验的重要课题，而游戏则是一个完美的、无威胁的沙盒。\n\
  \n在完成以下所有演示后，我将进一步讨论 Q 学习与深度学习如何交叉。届时，你应该已经具备了良好的 Q 学习背景，能够欣赏并理解最后的讨论。\n\n## 马尔可夫决策过程\n\
  \n马尔可夫决策过程（MDP）是 RL 的形式化表述。假设你是一个智能体，处于像《*打砖块*》游戏这样的环境中。环境处于某种状态（例如，挡板位置、球的位置和方向、砖块数量等）。智能体在此环境中执行某些动作，例如向左或向右移动挡板。动作有时会带来奖励。任何动作都会在一定程度上改变环境，并导致一个新状态。然后智能体可以执行另一个动作，导致另一个状态，依此类推。这些动作如何被选择的规则集称为策略。环境通常是随机的，这意味着下一个状态会有一定的随机性。对于《*打砖块*》游戏，这意味着每个新球都会以一个随机方向发射。\n\
  \n图 9-2 是描绘 MDP 数据流的示意图。\n\n![../images/482214_1_En_9_Chapter/482214_1_En_9_Fig2_HTML.jpg](img/482214_1_En_9_Fig2_HTML.jpg)\n\
  \n图 9-2\n\nMDP 数据流\n\nMDP 由状态、动作以及从一个状态转换到另一个状态的规则组成。此过程的一个回合（游戏）可以表示为状态、动作和奖励的有限序列：\n\
  \n![$$ \\left({s}_o,{a}_0,{r}_1\\right)-&gt;\\left({s}_1,{a}_1,{r}_2\\right)\\cdots\
  \ -&gt;\\left({s}_{n-1},{a}_{n-1},{r}_n\\right)-&gt;{s}_n $$](img/482214_1_En_9_Chapter_TeX_Equa.png)\n\
  \n其中\n\n*s*[*i*] = 状态\n\n*a*[*i*] = 动作\n\n*r*[*i* + 1] = 执行动作 *a*[*i*] 后的奖励\n\n\
  该回合以终止状态 *s*[*n*] 结束。MDP 依赖于马尔可夫假设，即下一个状态 *s*[*i* + 1] 的概率仅取决于当前状态 *s*[*i*] 和动作\
  \ *a*[*i*]，而不取决于之前的状态或动作。\n\n### 折扣未来奖励\n\n为了使 MDP 表现良好，必须同时考虑长期奖励和即时奖励。一个回合的总奖励可以表示为：\n\
  \n![$$ R={r}_1+{r}_2+{r}_3+\\cdots +{r}_n $$](img/482214_1_En_9_Chapter_TeX_Equb.png)\n\
  \n从时间点 t 开始的未来总奖励可以表示为：\n\n![$$ {R}_t={r}_t+{r}_{t+1}+{r}_{t+2}+\\cdots +{r}_n $$](img/482214_1_En_9_Chapter_TeX_Equc.png)\n\
  \n由于环境是随机的，下次执行相同动作时，无法确定性地获得相同的奖励。考虑的未来奖励越远，它们可能偏离得越多。为了考虑这种不确定性，通常使用折扣未来奖励，其表示为：\n\
  \n![$$ {R}_t={r}_t+{\\gamma r}_{t+1}+{\\gamma}²{r}_{t+2}+\\cdots +{\\gamma}^{n-t}{r}_n\
  \ $$](img/482214_1_En_9_Chapter_TeX_Equd.png)\n\n其中\n\nγ = 折扣因子（取值范围为 0 到 1.0）\n\
  \n由于折扣因子小于 1.0 且被乘方，所有未来奖励都会被大幅减少或折扣。时间步 t 的折扣未来奖励可以用时间步 t+1 的相同量来表示：\n\n![$$ {R}_t={r}_t+\\\
  gamma \\left({r}_{t+1}+\\gamma \\left({r}_{t+2}+\\cdots \\right)\\right)={r}_t+{\\\
  gamma R}_{t+1} $$](img/482214_1_En_9_Chapter_TeX_Eque.png)\n\n如果折扣因子 γ 设置为 0，那么策略将没有长期参与，仅依赖于即时奖励。即时奖励与未来奖励之间的平衡应设置一个折扣因子，例如\
  \ *γ* = 0.9。如果环境几乎是确定性的，且相同动作总是产生相同奖励，那么折扣因子可以设置为 1.0。\n\n智能体的一个好策略是始终选择能最大化（折扣）未来奖励的动作。\n\
  \n\n\n### Q-learning\n\n在 Q-learning 中，函数 *Q*(*s*[*t*], *a*[*t*]) 被定义为：当在状态 *s*[*t*]\
  \ 下执行动作 *a*[*t*] 并从此处开始持续最优操作时，所能获得的最大折现未来奖励。\n\n![$$ Q\\left({s}_t,{a}_t\\right)=\\\
  mathit{\\max}\\ {R}_{t+1} $$](img/482214_1_En_9_Chapter_TeX_Equf.png)\n\n理解 *Q*(*s*[*t*],\
  \ *a*[*t*]) 的一种方式是将其视为“在状态 *s*[*t*] 下执行动作 *a*[*t*] 后，游戏结束时可能获得的最佳分数”。它被称为 Q 函数，因为它代表了在给定状态下某个动作的“质量”。\n\
  \n乍一看，Q 函数的定义似乎令人费解。游戏结束时的最终分数如何能估算出来？未来的状态和动作根本无从知晓。但假设存在这样一个函数，对于支持最大化未来可能奖励的假设至关重要。\n\
  \n接下来考虑拥有这样一个函数意味着什么。假设存在一个状态，有两种可能的动作。应该选择那个能带来游戏最高分数的动作。但是，应该选择哪个动作呢？一旦你有了 Q 函数，答案就变得简单了。只需选择具有最高\
  \ Q 值的动作。以下方程代表了这一策略：\n\n![$$ \\pi (s)={argmax}_a\\left(Q\\left(s,a\\right)\\right)\
  \ $$](img/482214_1_En_9_Chapter_TeX_Equg.png)\n\n其中\n\n*π* = 策略（关于如何在给定状态下选择动作的规则）\n\
  \n现在的问题是，基于之前的讨论，Q 函数是如何定义的？我将首先只关注一个转移过程 (*s, a, r, s’*)，其中 *s'* 代表 *s* 之后的下一个状态。状态\
  \ *s* 和动作 *a* 的 Q 值可以用下一个状态 *s’* 的 Q 值来表示，如下所示：\n\n![$$ Q\\left(s,a\\right)=r+\\\
  gamma {\\mathit{\\max}}_{a^{\\prime }}Q\\left({s}^{\\prime },{a}^{\\prime}\\right)\
  \ $$](img/482214_1_En_9_Chapter_TeX_Equh.png)\n\n这个方程被称为**贝尔曼方程**。这是一个相当直观的概念：当前状态和动作的最大未来奖励等于即时奖励加上下一个状态的最大未来奖励。\n\
  \nQ-learning 的核心概念是，可以使用贝尔曼方程迭代地逼近 Q 函数。在最简单的情况下，Q 函数可以作为一个表格来实现，其中状态作为行，动作作为列。\n\
  \nQ-learning 算法的流程图如图 9-3 所示。\n\n![../images/482214_1_En_9_Chapter/482214_1_En_9_Fig3_HTML.jpg](img/482214_1_En_9_Fig3_HTML.jpg)\n\
  \n**图 9-3**\n\nQ-learning 流程图\n\nQ-learning 算法首先从输入中识别当前状态 *s*。识别状态后，将从动作列表中选择一个动作，要么通过搜索最大奖励，要么（如果是随机策略）通过接受一个贪婪概率\
  \ *ε*。利用前几步初始化的所有值，使用贝尔曼方程计算在状态 *s* 下所采取动作的 Q 值。然后，该 Q 值将被存储在 Q 表中。换句话说，智能体的经验被捕获在\
  \ Q 表中。所提出的 Q-learning 的奖励和惩罚通过一组为奖励函数（策略）设定的简单规则进行评估。在执行选定的动作 *a* 后，将确定 Q-learning\
  \ 算法的下一个状态 *s*′。当确定下一个状态 s′ 后，将检查 Q-learning 算法的停止条件。如果下一个状态 *s*′ 是 Q-learning 的最终目标，则过程结束；否则，下一个状态\
  \ *s*′ 将成为下一次迭代的当前状态 *s*。此过程持续进行，直到达到目标或满足停止条件。\n\n以下是一个详细的示例，有助于阐明 Q-learning 过程。\n\
  \n#### Q-learning 示例\n\n我首先要感谢几位博主，他们精彩的帖子启发了这个示例。他们也受到了其他致力于解释 Q-learning 复杂问题的人们的启发，以便\
  \ AI 社区能更好地理解这个主题。这些博客是：\n\n“Reinforcement Learning: A Simple Python Example and\
  \ a Step Closer to AI with Assisted QLearning”，作者 Manuel Amunategui\n\n[`https://l-ing.ru/watch/Reinforcement-Learning--A-Simple-Python-Example-and-A-Step-Closer-to-AI-with-Assisted-QLearning/`](https://l-ing.ru/watch/Reinforcement-Learning--A-Simple-Python-Example-and-A-Step-Closer-to-AI-with-Assisted-QLearning/)\n\
  \n“Getting AI smarter with Qlearning: a simple first step in Python”，来自 *The Beginner\
  \ Programmer*\n\n[`http://firsttimeprogrammer.blogspot.com/2016/09/getting-ai-smarter-with-q-learning.html`](http://firsttimeprogrammer.blogspot.com/2016/09/getting-ai-smarter-with-q-learning.html)\n\
  \n[`http://mnemstudio.org/path-finding-q-learningtutorial.htm`](http://mnemstudio.org/path-finding-q-learningtutorial.htm)\n\
  \n本示例首先展示了一个包含五个房间的建筑平面图，如图 9-4 所示。\n\n![../images/482214_1_En_9_Chapter/482214_1_En_9_Fig4_HTML.jpg](img/482214_1_En_9_Fig4_HTML.jpg)\n\
  \n**图 9-4**\n\n示例建筑平面图\n\n建筑中的每个房间都有一扇门，机器人或智能体可以通过它双向移动。请注意图中，房间 1 和 4 的门通向室外，在本示例中，室外被描绘为“房间”5。然而，要实现的目标是让智能体进入房间\
  \ 5，即室外。智能体可以从任意房间开始。每个门都会被分配一个奖励值，并且最终目标的奖励值将远大于那些不直接通向目标的门的奖励值。\n\n图 9-5 是一个节点图，描绘了房间之间所有可能的路径，以及哪些是可能成功的路径。\n\
  \n![../images/482214_1_En_9_Chapter/482214_1_En_9_Fig5_HTML.jpg](img/482214_1_En_9_Fig5_HTML.jpg)\n\
  \n**图 9-5**\n\n节点图\n\n如前所述，智能体可以从任意房间开始，并从该房间走出建筑（即目标房间 5）。为了将此房间设为目标，每个门都关联了一个奖励值。直接通向目标的门有\
  \ 100 的即时奖励。其他不直接连接目标房间的门奖励为 0。每个房间分配了两个箭头，因为门是双向的（0 通向 4，4 也通向 0）。每个箭头包含一个即时奖励值，如图\
  \ 9-6 所示。\n\n![../images/482214_1_En_9_Chapter/482214_1_En_9_Fig6_HTML.jpg](img/482214_1_En_9_Fig6_HTML.jpg)\n\
  \n**图 9-6**\n\n标注了奖励的节点图\n\n请注意图中，房间 5 内有一条路径循环回到自身，奖励为 100，而所有其他通向目标房间的链接奖励也为 100。在\
  \ Q-learning 中，目标是达到具有最高奖励的状态，因此如果智能体到达目标，它应该永远停留在那里。这种目标类型被称为“吸收目标”。\n\n将我们的智能体想象成一个可以通过经验学习的虚拟机器人。智能体可以从一个房间移动到另一个房间，但对环境一无所知，也不知道哪扇门的序列通向室外。\n\
  \n目标是确定智能体从建筑内任意房间到室外的路径。在接下来的讨论中，假设智能体从房间 2 开始，并试图到达建筑外部，即房间 5。图 9-7 很好地概括了这个初始环境。\n\
  \n![../images/482214_1_En_9_Chapter/482214_1_En_9_Fig7_HTML.jpg](img/482214_1_En_9_Fig7_HTML.jpg)\n\
  \n**图 9-7**\n\n初始环境\n\n\n\n在 Q 学习术语中，每个房间（包括外部）都是一个“状态”，而智能体从一个房间移动到另一个房间则是一个“动作”。因此，在上述节点图中，“状态”被描绘为一个节点，而“动作”则由箭头表示。\n\
  \n请参考图 9-8 进行以下讨论。\n\n![../images/482214_1_En_9_Chapter/482214_1_En_9_Fig8_HTML.jpg](img/482214_1_En_9_Fig8_HTML.jpg)\n\
  \n图 9-8\n\n初始动作\n\n如前所述，智能体从状态 2 开始。从状态 2 出发，它只能前往状态 3，因为状态 2 仅与状态 3 相连。从状态 3 出发，它可以前往状态\
  \ 1 或 4，或者返回状态 2。如果智能体处于状态 4，则有三种可能的动作：前往状态 0、5 或 3。如果智能体处于状态 1，它可以前往状态 5 或 3。从状态\
  \ 0 出发，它只能返回状态 4。\n\n可以构建一个矩阵“R”（代表奖励）来捕捉状态图及即时奖励值。图 9-9 展示了这个矩阵。\n\n![../images/482214_1_En_9_Chapter/482214_1_En_9_Fig9_HTML.jpg](img/482214_1_En_9_Fig9_HTML.jpg)\n\
  \n图 9-9\n\nR 矩阵\n\n表中的 -1 表示空值（即节点之间不存在连接）。例如，状态 0 无法前往状态 1。\n\n现在，一个类似的矩阵“Q”被添加到智能体的大脑中。这个矩阵代表了智能体通过经验所学到的记忆。Q\
  \ 矩阵的行代表智能体的当前状态，列代表通往下一状态的可行动作，即节点之间的连接。\n\n由于智能体初始时一无所知，Q 矩阵被初始化为零。在本例中，状态数量为六，代表每个节点。如果状态数量未知，Q\
  \ 矩阵可以仅从一个元素开始。随着新状态的发现，向 Q 矩阵中添加更多列和行是一项简单的任务。\n\nQ 学习的转换规则是贝尔曼方程：\n\n![$$ Q\\\
  left(s,a\\right)=r+\\gamma {\\mathit{\\max}}_{a^{\\prime }}Q\\left({s}^{\\prime\
  \ },{a}^{\\prime}\\right) $$](img/482214_1_En_9_Chapter_TeX_Equi.png)\n\n智能体将在没有教师的情况下，通过经验进行学习，这是其无监督学习体验的一部分。智能体从一个状态探索到另一个状态，直到达到目标。每次探索称为一个回合。每个回合包括智能体从初始状态移动到目标状态。每次智能体到达目标状态时，脚本进入下一个回合。\n\
  \nQ 学习算法可总结如下：\n\n1.  设置 *γ* 参数以及 R 矩阵中的环境奖励。\n\n2.  将 Q 矩阵初始化为零。\n\n3.  对于每个回合（循环）：\n\
  \n4.  选择一个随机的初始状态。\n\n5.  如果尚未达到目标状态，则进行迭代（循环）：\n    *   为当前状态选择所有可能的动作之一。\n\n*\
  \   利用这个可能的动作，考虑前往下一个状态。\n\n*   基于所有可能的动作，获取这个下一状态的最大 Q 值。\n\n*   计算 - ![$$ Q\\\
  left(s,a\\right)=r+\\gamma {\\mathit{\\max}}_{a^{\\prime }}Q\\left({s}^{\\prime\
  \ },{a}^{\\prime}\\right) $$](img/482214_1_En_9_Chapter_TeX_IEq1.png)\n\n*   将下一状态设置为当前状态。\n\
  \n上述算法被智能体用于从经验中学习。每个回合相当于一次训练会话。在每次训练会话中，智能体探索由 R 矩阵表示的环境，并接收奖励（如果有的话），直到达到目标状态。训练的目的是增强我们智能体的“大脑”，即由\
  \ Q 矩阵表示的部分。与人工神经网络（ANN）的情况类似，训练越多，得到的 Q 矩阵就越优化。\n\n你应该意识到，用于更新 *Q*(*s*, *a*) 的函数\
  \ ![$$ {\\mathit{\\max}}_{a^{\\prime }}Q\\left({s}^{\\prime },{a}^{\\prime}\\right)\
  \ $$](img/482214_1_En_9_Chapter_TeX_IEq2.png) 只是一个近似值，并且在训练的早期阶段，它可能完全错误。然而，这个近似值会随着每个回合而改善，如果更新次数足够多，那么\
  \ Q 函数将会收敛并代表真实的 Q 值。\n\n一旦 Q 矩阵得到增强，智能体将找到通往目标状态的最快路径。要使用增强后的 Q 矩阵，智能体只需追踪从初始状态到目标状态的状态序列。\n\
  \n以下是几个逐步手动计算的 Q 学习实验，希望能充分解释这一过程。\n\n\n\n##### 手动 Q 学习实验\n\n为了理解 Q 学习算法的工作原理，我将逐步演示几个回合。\n\
  \n第一个回合开始时，将学习参数 γ 的值设为 0.8，初始状态设为房间 1。\n\nQ 矩阵也初始化为全 0，如图 9-10 所示。\n\n![../images/482214_1_En_9_Chapter/482214_1_En_9_Fig10_HTML.jpg](img/482214_1_En_9_Fig10_HTML.jpg)\n\
  \n图 9-10\n\n初始化的 Q 矩阵\n\n接下来检查图 9-9 中 R 矩阵的第二行（状态 1）。当前状态 1 有两个可能的动作：\n\n*   前往状态\
  \ 3。\n*   前往状态 5。\n\n现在，假设通过随机选择，选中了动作 5。\n\n接下来，想象一下如果智能体处于状态 5 会发生什么。查看 R 矩阵的第六行。它有三个可能的动作：\n\
  \n*   前往状态 1。\n*   前往状态 4。\n*   前往状态 5。\n\n应用贝尔曼方程得到：\n\n![$$ Q\\left(s,a\\right)=r+\\\
  gamma {\\mathit{\\max}}_{a^{\\prime }}Q\\left({s}^{\\prime },{a}^{\\prime}\\right)\
  \ $$](img/482214_1_En_9_Chapter_TeX_Equj.png)\n\n![$$ Q\\left(1,5\\right)=R\\left(1,5\\\
  right)+0.8\\ast {\\mathit{\\max}}_{a^{\\prime }}Q\\left(Q\\left(5,1\\right),Q\\\
  left(5,4\\right),Q\\left(5,5\\right)\\right) $$](img/482214_1_En_9_Chapter_TeX_Equk.png)\n\
  \n![$$ Q\\left(1,5\\right)=100+0.8\\ast 0=100 $$](img/482214_1_En_9_Chapter_TeX_Equl.png)\n\
  \n由于 Q 矩阵仍初始化为零，*Q*(5, 1)、*Q*(5, 4)、*Q*(5, 5) 均为 0。*Q*(1, 5) 的计算结果为 100，这是因为来自 *R*(1,\
  \ 5) 的即时奖励。\n\n根据算法，下一个状态 5 现在成为当前状态。由于 5 是目标状态，该回合结束。智能体的大脑现在包含一个增强后的 Q 矩阵，如图 9-11\
  \ 所示。\n\n![../images/482214_1_En_9_Chapter/482214_1_En_9_Fig11_HTML.jpg](img/482214_1_En_9_Fig11_HTML.jpg)\n\
  \n图 9-11\n\n增强后的 Q 矩阵\n\n下一个回合从一个随机选择的初始状态开始。假设状态 3 是初始状态。\n\n查看 R 矩阵的第四行，可以看到有三个可能的动作：\n\
  \n*   前往状态 1。\n*   前往状态 2。\n*   前往状态 4。\n\n假设通过随机过程选择了前往状态 1。接下来想象智能体处于状态 1。检查 R\
  \ 矩阵中状态 1 的第二行。可以看到它有两个可能的动作：\n\n*   前往状态 3。\n*   前往状态 5。\n\n现在必须使用贝尔曼方程计算 Q 值：\n\
  \n![$$ Q\\left(s,a\\right)=r+\\gamma {\\mathit{\\max}}_{a^{\\prime }}Q\\left({s}^{\\\
  prime },{a}^{\\prime}\\right) $$](img/482214_1_En_9_Chapter_TeX_Equm.png)\n\n![$$\
  \ Q\\left(1,5\\right)=R\\left(1,5\\right)+0.8\\ast {\\mathit{\\max}}_{a^{\\prime\
  \ }}Q\\left(Q\\left(1,2\\right),Q\\left(1,5\\right)\\right) $$](img/482214_1_En_9_Chapter_TeX_Equn.png)\n\
  \n![$$ Q\\left(1,5\\right)=0+0.8\\ast \\mathit{\\max}\\left(0,100\\right)=80 $$](img/482214_1_En_9_Chapter_TeX_Equo.png)\n\
  \n上一回合增强后的 Q 矩阵包含了 Q(1, 3) = 0 和 Q(1, 5) = 100 的结果。计算得到 Q(3, 1) = 80，因为奖励为零。Q 矩阵现在变为图\
  \ 9-12 所示。\n\n![../images/482214_1_En_9_Chapter/482214_1_En_9_Fig12_HTML.jpg](img/482214_1_En_9_Fig12_HTML.jpg)\n\
  \n图 9-12\n\n修正后的 Q 矩阵\n\n下一个状态 1 现在成为当前状态。由于状态 1 不是目标状态，Q 学习算法的内循环将重复执行。\n\n因此，在从当前状态\
  \ 1 开始新循环后，有两个可能的动作：\n\n*   前往状态 3。\n*   前往状态 5。\n\n通过随机选择，假设选中的动作是 5。如图 9-13 所示。\n\
  \n![../images/482214_1_En_9_Chapter/482214_1_En_9_Fig13_HTML.jpg](img/482214_1_En_9_Fig13_HTML.jpg)\n\
  \n图 9-13\n\n随机选择到状态 5\n\n现在，想象智能体处于状态 5。有三个可能的动作：\n\n*   前往状态 1。\n*   前往状态 4。\n\
  *   前往状态 5。\n\n使用这些可能动作中的最大值来计算 Q 值：\n\n![$$ Q\\left(s,a\\right)=r+\\gamma {\\mathit{\\\
  max}}_{a^{\\prime }}Q\\left({s}^{\\prime },{a}^{\\prime}\\right) $$](img/482214_1_En_9_Chapter_TeX_Equp.png)\n\
  \n![$$ Q\\left(1,5\\right)=R\\left(1,5\\right)+0.8\\ast {\\mathit{\\max}}_{a^{\\\
  prime }}Q\\left(Q\\left(5,1\\right),Q\\left(5,4\\right),Q\\left(5,5\\right)\\right)\
  \ $$](img/482214_1_En_9_Chapter_TeX_Equq.png)\n\n![$$ Q\\left(1,5\\right)=100+0.8\\\
  ast 0=100 $$](img/482214_1_En_9_Chapter_TeX_Equr.png)\n\nQ 矩阵中 *Q*(5,1)、*Q*(5,4)、*Q*(5,5)\
  \ 的更新条目均为 0。Q(1, 5) 的计算结果为 100，这是因为来自 R(5, 1) 的即时奖励。此结果不会改变增强后的 Q 矩阵。\n\n由于 5 是目标状态，该回合结束。我们智能体的大脑现在包含一个增强后的\
  \ Q 矩阵，如图 9-14 所示。\n\n![../images/482214_1_En_9_Chapter/482214_1_En_9_Fig14_HTML.jpg](img/482214_1_En_9_Fig14_HTML.jpg)\n\
  \n图 9-14\n\n修正后的增强 Q 矩阵\n\n智能体通过完成更多回合最终学到更多知识。它最终会达到 Q 矩阵中的收敛值，如图 9-15 所示。\n\n\
  ![../images/482214_1_En_9_Chapter/482214_1_En_9_Fig15_HTML.jpg](img/482214_1_En_9_Fig15_HTML.jpg)\n\
  \n图 9-15\n\n最终的增强 Q 矩阵\n\n然后，可以通过将所有条目除以一个数来归一化 Q 矩阵，该数将使矩阵的最大值等于 100。在本例中，这个数是\
  \ 5。归一化后的矩阵如图 9-16 所示。\n\n![../images/482214_1_En_9_Chapter/482214_1_En_9_Fig16_HTML.jpg](img/482214_1_En_9_Fig16_HTML.jpg)\n\
  \n图 9-16\n\n归一化后的 Q 矩阵\n\n一旦 Q 矩阵收敛，智能体就学会了通往目标状态的最优路径。追踪最佳状态序列就像在每个状态跟随具有最高值的链接一样简单。如图\
  \ 9-17 所示。\n\n![../images/482214_1_En_9_Chapter/482214_1_En_9_Fig17_HTML.jpg](img/482214_1_En_9_Fig17_HTML.jpg)\n\
  \n图 9-17\n\n具有最终归一化链接值的节点图\n\n例如，从初始状态 2 开始，智能体可以使用 Q 矩阵作为指南：\n\n*   从状态 2 开始，最大\
  \ Q 值表明动作是前往状态 3。\n*   从状态 3 开始，最大 Q 值表明有两个选择：\n    *   前往状态 1。\n    *   前往状态 4。\n\
  *   假设随机选择了前往状态 4 的动作，即前往状态 1。\n*   从状态 1 开始，最大 Q 值表明动作是前往状态 5。\n*   因此，基于 Q 学习的最优路径是\
  \ 2 → 3 → 1 → 5。\n\n##### 使用 Python 脚本演示 Q 学习\n\n\n\n### 注意\n\n我强烈建议你在阅读本节之前先阅读（或重读）上一节。我不会在本节中重复逐步解释。理解这些解释将使本节内容更易于理解且更具趣味性。\n\
  \n在本演示中，我将使用 Python 脚本中的 Q-learning 来寻找两点之间的最短路径。该脚本对环境没有任何先验知识，仅通过强化学习进行学习。\n\n\
  图 9-18 是由脚本生成的随机点图。\n\n![../images/482214_1_En_9_Chapter/482214_1_En_9_Fig18_HTML.jpg](img/482214_1_En_9_Fig18_HTML.jpg)\n\
  \n**图 9-18**\n\n随机点图\n\n点 0 为起始位置，点 7 为目标和终点位置。脚本的目标是使用强化学习算法确定起点与目标位置之间的最优路径。地图中存在明显的错误路径和虚假目标，这些都需要被评估并舍弃。\n\
  \n你需要加载一个额外的库来准备运行此脚本。输入以下命令以加载所需库：\n\n```\npip install networkx\n```\n\n该脚本名为 simpleRL.py，可从本书的配套网站获取。此脚本没有额外的解释性注释，因为之前我已经通过多个逐步示例详细讲解了强化学习过程，相信你已具备足够的知识来理解这个相对简单的脚本是如何工作的。\n\
  \n```\n# 导入所需库\nimport numpy as np\nimport pylab as plt\nimport networkx as nx\n\
  # 映射单元格到单元格，为目标点添加循环单元格\npoints_list = [(0,1), (1,5), (5,6), (5,4), (1,2), (2,3),\
  \ (2,7)]\n# 设置目标节点\ngoal = 7\n# 创建并显示图\nG=nx.Graph()\nG.add_edges_from(points_list)\n\
  pos = nx.spring_layout(G)\nnx.draw_networkx_nodes(G,pos)\nnx.draw_networkx_edges(G,pos)\n\
  nx.draw_networkx_labels(G,pos)\nplt.show()\n# 定义图中的点\nMATRIX_SIZE = 8\n# 创建矩阵 (MATRIX_SIZE\
  \ * MATRIX_SIZE)\nR = np.matrix(np.ones(shape=(MATRIX_SIZE, MATRIX_SIZE)))\nR *=\
  \ -1\n# 为路径分配 0，为到达目标的点分配 100\nfor point in points_list:\nprint(point)\nif point[1]\
  \ == goal:\nR[point] = 100\nelse:\nR[point] = 0\nif point[0] == goal:\nR[point[::-1]]\
  \ = 100\nelse:\n# 点的反向\nR[point[::-1]]= 0\n# 添加目标点的自循环\nR[goal,goal]= 100\n# 创建\
  \ Q 矩阵\nQ = np.matrix(np.zeros([MATRIX_SIZE,MATRIX_SIZE]))\n# 设置学习参数 gamma\ngamma\
  \ = 0.8\n# 设置初始起点\ninitial_state = 1\n# 定义 available_actions 方法\ndef available_actions(state):\n\
  current_state_row = R[state,]\nav_act = np.where(current_state_row >= 0)[1]\nreturn\
  \ av_act\n# 创建变量以保存可能的动作\navailable_act = available_actions(initial_state)\n# 定义随机选择下一个动作的方法\n\
  def sample_next_action(available_actions_range):\nnext_action = int(np.random.choice(available_act,1))\n\
  return next_action\n# 创建变量以保存随机选择的动作\naction = sample_next_action(available_act)\n\
  # 定义在需要时更新状态的方法\ndef update(current_state, action, gamma):\nmax_index = np.where(Q[action,]\
  \ == np.max(Q[action,]))[1]\nif max_index.shape[0] > 1:\nmax_index = int(np.random.choice(max_index,\
  \ size = 1))\nelse:\nmax_index = int(max_index)\nmax_value = Q[action, max_index]\n\
  # 贝尔曼方程\nQ[current_state, action] = R[current_state, action] + gamma * max_value\n\
  print('max_value', R[current_state, action] + gamma * max_value)\nif (np.max(Q)\
  \ > 0):\nreturn(np.sum(Q/np.max(Q)*100))\nelse:\nreturn (0)\n# 基于所选动作更新状态\nupdate(initial_state,\
  \ action, gamma)\n# 训练开始\nscores = []\nfor i in range(700):\ncurrent_state = np.random.randint(0,\
  \ int(Q.shape[0]))\navailable_act = available_actions(current_state)\naction = sample_next_action(available_act)\n\
  score = update(current_state,action,gamma)\nscores.append(score)\nprint ('Score:',\
  \ str(score))\n# 显示奖励矩阵\nprint('\\nRewards matrix R\\n')\nprint(R)\n# 显示增强后的 Q 矩阵\n\
  print('\\nEnhanced Q matrix\\n')\nprint(Q/np.max(Q)*100)\n# 测试开始\ncurrent_state\
  \ = 0\nsteps = [current_state]\n# 循环以确定最优路径\nwhile current_state != 7:\nnext_step_index\
  \ = np.where(Q[current_state,] == np.max(Q[current_state,]))[1]\nif next_step_index.shape[0]\
  \ > 1:\nnext_step_index = int(np.random.choice(next_step_index, size = 1))\nelse:\n\
  next_step_index = int(next_step_index)\nsteps.append(next_step_index)\ncurrent_state\
  \ = next_step_index\nprint(\"Most efficient path:\")\nprint(steps)\nplt.plot(scores)\n\
  plt.show()\n```\n\n##### 运行脚本\n\n通过输入以下命令来运行脚本：\n\n```\npython simpleRL.py\n```\n\
  \n图 9-19 展示了收敛分数与已完成回合数的关系图。\n\n![../images/482214_1_En_9_Chapter/482214_1_En_9_Fig19_HTML.jpg](img/482214_1_En_9_Fig19_HTML.jpg)\n\
  \n**图 9-19**\n\n分数收敛图\n\n你可以清晰地看到，在完成大约 400 个回合后，分数达到最大值。脚本被硬编码为运行 700 个回合。在达到 400\
  \ 回合后，额外运行 300 回合所需的时间微乎其微。\n\n图 9-20 显示了脚本运行完成后的终端窗口。\n\n![../images/482214_1_En_9_Chapter/482214_1_En_9_Fig20_HTML.jpg](img/482214_1_En_9_Fig20_HTML.jpg)\n\
  \n**图 9-20**\n\n最终脚本结果\n\n这张图中有许多值得讨论的有趣内容。首先是图中顶部显示的剩余中间回合结果部分。在这里你可以看到 Q 函数的最大值以及分数。显示的分数是未归一化的最优路径值。\n\
  \n奖励矩阵 R 显示在中间回合结果下方。关于这个矩阵，有两点需要注意。在 R(2, 6) 和 R(6,6) 位置有两个 100 的奖励值。第一个奖励 (R(2,6))\
  \ 对应节点 2 和节点 7 之间的直接路径。第二个奖励 (R(6,6)) 是自吸收链接或目标节点的自循环。接下来需要注意的是，现有链接的值为 0，不存在的链接值为\
  \ -1。\n\n增强并归一化后的 Q 矩阵显示在 R 矩阵下方。不幸的是，Python 3 的 print 语句导致行有些换行，阅读起来有些困难。我曾尝试让它逐行打印，但未能成功。矩阵值也以浮点数形式显示，这又是一个不必要的干扰。\n\
  \n图中的最后一项是显示的最优路径，结果为 0 到 1 到 2 到 7。\n\n在下一个演示中，我将向你展示如何在路径确定中处理敌对环境因素。\n\n\n\n\
  ##### 在敌对环境中演示 Q-learning\n\n有时，强化学习项目中的环境并不总是对试图导航路径的智能体友好。为了在本次演示中明确这一点，我将假设智能体是一群蜜蜂，它们试图到达位于节点\
  \ 7 的蜂巢。现在，蜜蜂不喜欢烟雾，会不惜一切代价避开它。事实上，养蜂人（正式名称为蜂农）在从蜂巢中采集蜂蜜时，会使用烟雾枪来安抚蜜蜂。如图 9-21 所示，我在随机生成的环境中的几个节点添加了烟雾。智能体将始终尝试避开那些通向烟雾的链接。\n\
  \n![../images/482214_1_En_9_Chapter/482214_1_En_9_Fig21_HTML.jpg](img/482214_1_En_9_Fig21_HTML.jpg)\n\
  \n图 9-21\n\n随机生成的蜜蜂环境\n\n以下脚本名为 beeRL.py，可从本书的配套网站获取：\n\n```\n# 导入所需库\nimport numpy\
  \ as np\nimport pylab as plt\nimport networkx as nx\n# 映射单元格到单元格，添加循环单元格到目标点\npoints_list\
  \ = [(0,1), (1,5), (5,6), (5,4), (1,2), (2,3), (2,7)]\n# 设置目标节点\ngoal = 7\nbees\
  \ = [2]\nsmoke = [4,5,6]\ngamma = 0.8\nG=nx.Graph()\nG.add_edges_from(points_list)\n\
  mapping={0:'Start', 1:'1', 2:'2 - Bees', 3:'3', 4:'4 - Smoke', 5:'5 - Smoke', 6:'6\
  \ - Smoke', 7:'7 - Beehive'}\nH=nx.relabel_nodes(G,mapping)\npos = nx.spring_layout(H)\n\
  nx.draw_networkx_nodes(H,pos, node_size=[200,200,200,200,200,200,200,200])\nnx.draw_networkx_edges(H,pos)\n\
  nx.draw_networkx_labels(H,pos)\nplt.show()\n# 定义图中的点\nMATRIX_SIZE = 8\n# 创建矩阵 (MATRIX_SIZE\
  \ * MATRIX_SIZE)\nR = np.matrix(np.ones(shape=(MATRIX_SIZE, MATRIX_SIZE)))\nR *=\
  \ -1\n# 为路径分配 0，为到达目标点分配 100\nfor point in points_list:\nprint(point)\nif point[1]\
  \ == goal:\nR[point] = 100\nelse:\nR[point] = 0\nif point[0] == goal:\nR[point[::-1]]\
  \ = 100\nelse:\n# 点的反向\nR[point[::-1]]= 0\n# 添加目标点往返\nR[goal,goal]= 100\ndef available_actions(state):\n\
  current_state_row = R[state,]\nav_act = np.where(current_state_row >= 0)[1]\nreturn\
  \ av_act\ndef sample_next_action(available_actions_range):\nnext_action = int(np.random.choice(available_act,\
  \ 1))\nreturn next_action\ndef collect_environmental_data(action):\nfound = []\n\
  if action in bees:\nfound.append('b')\nif action in smoke:\nfound.append('s')\n\
  return found\n# 创建 Q 矩阵\nQ = np.matrix(np.zeros([MATRIX_SIZE,MATRIX_SIZE]))\nenviro_bees\
  \ = np.matrix(np.zeros([MATRIX_SIZE, MATRIX_SIZE]))\nenviro_smoke = np.matrix(np.zeros([MATRIX_SIZE,\
  \ MATRIX_SIZE]))\ninitial_state = 1\n# 获取当前状态下的可用动作\navailable_act = available_actions(initial_state)\n\
  # 采样要执行的下一个动作\naction = sample_next_action(available_act)\n# 此函数根据所选路径和 Q 学习算法更新\
  \ Q 矩阵\ndef update(current_state, action, gamma):\nmax_index = np.where(Q[action,]\
  \ == np.max(Q[action,]))[1]\nif max_index.shape[0] > 1:\nmax_index = int(np.random.choice(max_index,\
  \ size = 1))\nelse:\nmax_index = int(max_index)\nmax_value = Q[action, max_index]\n\
  Q[current_state, action] = R[current_state, action] + gamma * max_value\nprint('max_value',\
  \ R[current_state, action] + gamma * max_value)\nenvironment = collect_environmental_data(action)\n\
  if 'b' in environment:\nenviro_bees[current_state, action] += 1\nif 's' in environment:\n\
  enviro_smoke[current_state, action] += 1\nif (np.max(Q) > 0):\nreturn(np.sum(Q/np.max(Q)*100))\n\
  else:\nreturn(0)\nupdate(initial_state,action,gamma)\n# 训练开始\nscores = []\nfor i\
  \ in range(700):\ncurrent_state = np.random.randint(0, int(Q.shape[0]))\navailable_act\
  \ = available_actions(current_state)\naction = sample_next_action(available_act)\n\
  score = update(current_state,action,gamma)\nscores.append(score)\nprint ('Score:',\
  \ str(score))\nplt.plot(scores)\nplt.show()\nprint('Bees found')\nprint(enviro_bees)\n\
  print('Smoke found')\nprint(enviro_smoke)\n```\n\n###### 运行脚本并评估结果\n\n通过输入以下命令来运行脚本：\n\
