  \n现在，必须像处理单变量时间序列那样，将这些重塑后的原始数据向量分割为输入/输出样本。一维 CNN 模型需要足够的输入来学习从输入序列到输出值的映射。数据需要分割为样本，同时保持两个输入序列中观测值的顺序。\n\
  \n如果选择三个输入时间步，那么第一个样本将如下所示：\n\n输入：\n\n*   50, 50\n\n*   100, 75\n\n*   150, 100\n\
