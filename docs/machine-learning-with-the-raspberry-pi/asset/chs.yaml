  \n## 学习向量量化\n\n在开始讨论之前，我首先要感谢 Jason Brownlee 博士在 2018 年 8 月发表的一篇优秀博客，题为“How to Implement\
  \ Learning Vector Quantization from Scratch with Python”，本节中的大部分代码和关键概念都基于此。我之前在讨论中引用过\
  \ Jason 的博客，我发现他的教程非常清晰且富有启发性。我强烈建议你查看他的博客、文章和电子书。\n\n学习向量量化（LVQ）与 k-NN 算法类似，都是通过寻找与现有数据模式最接近的匹配来进行预测。两者之间的显著区别在于，k-NN\
  \ 使用实际的训练模式，而 LVQ 则从训练数据中创建一个模式库。\n\n这个模式库被称为向量码本，库中的每个模式称为一个码本向量。码本向量被初始化为从训练数据集中随机选择的值。然后，经过多个周期或训练轮次，通过使用学习算法对它们进行修改，以最优地总结训练数据。该学习算法一次处理一条训练记录，在码本向量中找到最佳匹配。如果训练记录与码本向量属于同一类别，则对其进行修改使其“更接近”码本向量；如果属于不同类别，则使其“更远离”。我稍后会解释距离这个比喻，以帮助阐明数据项之间“更接近”或“更远离”的概念。\n\
  \n只有在所有码本向量都处理完毕后，才开始进行预测。预测使用 k-NN 算法，其中 k = 1。\n\n### LVQ 基本概念\n\n首先需要讨论的是将在以下所有部分（包括演示）中使用的数据集。该数据集是地球大气层雷达“探测”产生的数值记录集合。每条记录描述了返回雷达信号的属性，其中可能包含电离层的重要测量值。数据模型的目的是预测特定记录是否包含任何重要的电离层测量值。\n\
  \n数据集中有 351 条记录，每条记录包含 34 个数值数据点。这些点被分成 17 对，对应每个雷达返回信号，每个数值的范围为 0 到 1。目标类别的属性值为“g”（表示良好）或“b”（表示不良）。\n\
  \n该数据集名为 inosphere.csv，可以从以下网址下载：\n\n`https://archive.ics.uci.edu/ml/datasets/Ionosphere`\n\
  \n\n\n#### 欧几里得距离\n\n接下来要讨论的概念是欧几里得距离。我意识到在之前的讨论中已经使用过这个术语，而它有时会根据上下文的不同而具有不同的含义。在此案例中，电离层数据集由多行数字组成。欧几里得距离定义为两个向量（由行数据构成）之间差值的平方和的平方根。该距离度量的方程如下：\n\
  \n![$$ distance=\\sqrt{\\sum_i^N{\\left({x}_{1,i}-{x}_{2,i}\\right)}²} $$](img/482214_1_En_3_Chapter_TeX_Equd.png)\n\
  \n其中\n\n*   *x*[*1*] = 第一行数据\n*   *x*[*2*] = 第二行数据\n*   *i* = 列索引\n*   *N* = 列数（属性）\n\
  \n欧几里得距离越小，两条数据记录越相似。反之，距离越大，记录越不相似。如果距离为 0，则记录完全相同。\n\n#### 最佳匹配单元\n\n最佳匹配单元（BMU）是与新数据记录最相似的码本向量。为新记录定位\
  \ BMU 需要计算新记录与每个码本向量之间的欧几里得距离。这需要使用前面讨论过的距离度量方法来完成。计算完成后，对所有距离进行排序，与最小距离值关联的码本向量就是与新记录最相似的。\n\
  \n上述描述的过程与使用 LVQ 进行预测的方式相同。使用 k=1 的 KNN 算法来定位与未知记录最相似的码本向量。然后返回关联的类别值“g”或“b”。\n\n\
  #### 训练码本向量\n\n训练码本向量的第一步是使用从训练数据集中随机选取的特征构建的模式来初始化所有向量。初始化完成后，必须修改这些向量以最优地概括训练数据集。这些修改以迭代方式进行。在顶层，使用完整的训练集重复该过程固定数量的轮次。在每个轮次内，每个训练模式仅使用一次来更新码本向量。为每个训练模式检测一个\
  \ BMU 并进行更新。计算训练模式与 BMU 之间的任何差异，并将其记录为误差。然后比较 BMU 和训练模式的类别值，如果发现匹配，则会将记录的误差加到 BMU\
  \ 上，使其“更接近”训练模式。反之，如果类别值不匹配，则减去误差，导致 BMU 被“推离”训练模式。\n\n学习率（LR）参数控制 BMU 的调整幅度。该参数是一个权重因子，影响应用于所有\
  \ BMU 的变化量。例如，如果 LR 为 0.20 或 20%，这意味着只有 20%的检测误差会被应用于 BMU。此外，LR 本身也会被调整，使其在第一个轮次中效果最大，而在后续轮次中效果递减。这种递减效果称为线性衰减学习率调度，也广泛用于人工神经网络。\n\
  \n### LVQ 演示\n\n在开始我惯常的演示之前，我认为有必要介绍一下零规则算法。在实际尝试各种模型之前，通常无法确定哪种数据模型最适合你的特定问题领域。因此，在开始处理问题时，建立一个性能基线非常重要。基线性能提供了一个参考，可用于与应用于该问题的任何数据模型进行比较。没有基线，就无法了解特定模型取得了多好的效果。分类和回归的基线均由零规则算法创建，该算法也称为\
  \ ZeroR 或 0-R。\n\n分类预测模型预测的是类别值。零规则算法预测训练数据集中观测数量最多的类别值。我将演示如何使用怀卡托知识分析环境（*Weka*）机器学习软件套件将零规则算法应用于电离层数据集。主用户界面称为*Explorer*。Weka\
  \ 是一个基于 Java 的应用程序，可以在 RasPi 上作为 jar 文件运行。Weka 可以从以下地址下载：\n\n`https://sourceforge.net/projects/weka/`\n\
  \n要使用电离层数据集，它必须是 arff 格式。名为 ionosphere.arff 的数据集可以从这个页面下载：\n\n`https://github.com/renatopp/arff-datasets/find/master`\n\
  \n在运行应用程序之前，请确保 ionosphere.arff 与 Weka jar 文件位于同一目录中。然后通过输入以下命令启动应用程序。请注意，Weka 也提供\
  \ Windows 的 exe 扩展名下载，因此你可以使用安装程序来安装 Weka。\n\n```\njava -jar weka.jar\n```\n\n应按照以下七个步骤来获取基线结果：\n\
  \n1.  启动 Weka GUI 选择器。\n2.  点击“Explorer”按钮打开 Weka Explorer 界面。\n3.  加载电离层数据集 *ionosphere.arff*\
  \ 文件。\n4.  点击“Classify”选项卡打开分类选项卡。\n5.  选择 ZeroR 算法（默认应已选中）。\n6.  选择“Cross-validation”测试选项（默认应已选中）。\n\
  7.  点击“Start”按钮评估算法在数据集上的表现。\n\nWeka Explorer 的结果如图 3-23 所示。\n\n![../images/482214_1_En_3_Chapter/482214_1_En_3_Fig23_HTML.jpg](img/482214_1_En_3_Fig23_HTML.jpg)\n\
  \n图 3-23\n\nWeka Explorer 结果\n\n零规则算法对所有实例预测“*g”*值，因为它是多数类，并达到了 64.1%的准确率。任何机器学习算法要证明其在此问题上具有更好的性能，必须达到高于此值的准确率。\n\
  \n以下脚本实现了基础概念部分中介绍的所有概念。它名为 lvqDemo.py，可从本书的配套网站获取。我还在代码清单之后提供了额外的解释性注释。请确保数据集以\
  \ csv 扩展名提供，以便与代码兼容。\n\n\n\n```\n# 针对电离层数据集的 LVQ 算法\nfrom random import seed\nfrom\
  \ random import randrange\nfrom csv import reader\nfrom math import sqrt\n# 加载 CSV\
  \ 文件\ndef load_csv(filename):\ndataset = list()\nwith open(filename, 'r') as file:\n\
  csv_reader = reader(file)\nfor row in csv_reader:\nif not row:\ncontinue\ndataset.append(row)\n\
  return dataset\n# 将字符串列转换为浮点数\ndef str_column_to_float(dataset, column):\nfor row\
  \ in dataset:\nrow[column] = float(row[column].strip())\n# 将字符串列转换为整数\ndef str_column_to_int(dataset,\
  \ column):\nclass_values = [row[column] for row in dataset]\nunique = set(class_values)\n\
  lookup = dict()\nfor i, value in enumerate(unique):\nlookup[value] = i\nfor row\
  \ in dataset:\nrow[column] = lookup[row[column]]\nreturn lookup\n# 将数据集拆分为 k 折\n\
  def cross_validation_split(dataset, n_folds):\ndataset_split = list()\ndataset_copy\
  \ = list(dataset)\nfold_size = int(len(dataset) / n_folds)\nfor i in range(n_folds):\n\
  fold = list()\nwhile len(fold) < fold_size:\nindex = randrange(len(dataset_copy))\n\
  fold.append(dataset_copy.pop(index))\ndataset_split.append(fold)\nreturn dataset_split\n\
  # 计算准确率百分比\ndef accuracy_metric(actual, predicted):\ncorrect = 0\nfor i in range(len(actual)):\n\
  if actual[i] == predicted[i]:\ncorrect += 1\nreturn correct / float(len(actual))\
  \ * 100.0\n# 使用交叉验证拆分评估算法\ndef evaluate_algorithm(dataset, algorithm, n_folds, *args):\n\
  folds = cross_validation_split(dataset, n_folds)\nscores = list()\nfor fold in folds:\n\
  train_set = list(folds)\ntrain_set.remove(fold)\ntrain_set = sum(train_set, [])\n\
  test_set = list()\nfor row in fold:\nrow_copy = list(row)\ntest_set.append(row_copy)\n\
  row_copy[-1] = None\npredicted = algorithm(train_set, test_set, *args)\nactual =\
  \ [row[-1] for row in fold]\naccuracy = accuracy_metric(actual, predicted)\nscores.append(accuracy)\n\
  return scores\n# 计算两个向量之间的欧几里得距离\ndef euclidean_distance(row1, row2):\ndistance\
  \ = 0.0\nfor i in range(len(row1)-1):\ndistance += (row1[i] - row2[i])**2\nreturn\
  \ sqrt(distance)\n# 定位最佳匹配单元\ndef get_best_matching_unit(codebooks, test_row):\n\
  distances = list()\nfor codebook in codebooks:\ndist = euclidean_distance(codebook,\
  \ test_row)\ndistances.append((codebook, dist))\ndistances.sort(key=lambda tup:\
  \ tup[1])\nreturn distances[0][0]\n# 使用码本向量进行预测\ndef predict(codebooks, test_row):\n\
  bmu = get_best_matching_unit(codebooks, test_row)\nreturn bmu[-1]\n# 创建随机码本向量\n\
  def random_codebook(train):\nn_records = len(train)\nn_features = len(train[0])\n\
  codebook = [train[randrange(n_records)][i] for i in range(n_features)]\nreturn codebook\n\
  # 训练一组码本向量\ndef train_codebooks(train, n_codebooks, lrate, epochs):\ncodebooks =\
  \ [random_codebook(train) for i in range(n_codebooks)]\nfor epoch in range(epochs):\n\
  rate = lrate * (1.0-(epoch/float(epochs)))\nfor row in train:\nbmu = get_best_matching_unit(codebooks,\
  \ row)\nfor i in range(len(row)-1):\nerror = row[i] - bmu[i]\nif bmu[-1] == row[-1]:\n\
  bmu[i] += rate * error\nelse:\nbmu[i] -= rate * error\nreturn codebooks\n# LVQ 算法\n\
  def learning_vector_quantization(train, test, n_codebooks, lrate, epochs):\ncodebooks\
  \ = train_codebooks(train, n_codebooks, lrate, epochs)\npredictions = list()\nfor\
  \ row in test:\noutput = predict(codebooks, row)\npredictions.append(output)\nreturn(predictions)\n\
  # 在电离层数据集上测试 LVQ\nseed(1)\n# 加载并准备数据\nfilename = 'ionosphere.csv'\ndataset = load_csv(filename)\n\
  for i in range(len(dataset[0])-1):\nstr_column_to_float(dataset, i)\n# 将类别列转换为整数\n\
  str_column_to_int(dataset, len(dataset[0])-1)\n# 评估算法\nn_folds = 5\nlearn_rate =\
  \ 0.3\nn_epochs = 50\nn_codebooks = 20\nscores = evaluate_algorithm(dataset, learning_vector_quantization,\
  \ n_folds, n_codebooks, learn_rate, n_epochs)\nprint('得分: %s' % scores)\nprint('平均准确率:\
  \ %.3f%%' % (sum(scores)/float(len(scores))))\n```\n\n以下是对前述代码中不易理解部分的补充说明。此外，在讨论代码内部逻辑之前，我只会展示不超过三行代码（主代码部分除外）。\n\
  \n```\n# 将数据集拆分为 k 折\ndef cross_validation_split(dataset, n_folds):\n.\n.\nreturn\
  \ dataset_split\n```\n\n该方法实现了我在第 1 章中已讨论过的 n 折交叉验证过程。请回顾该章节以重温此过程。\n\n```\n# 使用交叉验证拆分评估算法\n\
  def evaluate_algorithm(dataset, algorithm, n_folds, *args):\n.\n.\nreturn scores\n\
  ```\n\n将 LVQ 算法应用于 n 折交叉验证后的数据集。该方法设计为也可按需使用其他算法。\n\n```\n# 定位最佳匹配单元\ndef get_best_matching_unit(codebooks,\
  \ test_row):\n.\n.\nreturn distances[0][0]\n```\n\n为`test_row`参数找到最佳匹配单元（BMU）。该方法实现了\
  \ BMU 部分所述的过程。\n\n```\n# 训练一组码本向量\ndef train_codebooks(train, n_codebooks, lrate,\
  \ epochs):\n.\n.\nreturn codebooks\n```\n\n训练码本向量。该方法实现了训练码本向量部分所述的过程。\n\n```\n\
  # LVQ 算法\ndef learning_vector_quantization(train, test, n_codebooks, lrate, epochs):\n\
  .\n.\nreturn(predictions)\n```\n\n这是实际的 LVQ 算法。从某种意义上说，它并不复杂，只是调用了实现基本 LVQ 概念的其他方法。在调用此方法之前，需要对数据集进行预处理，码本向量也是如此。\n\
  \n```\n# 在电离层数据集上测试 LVQ\nseed(1)\n# 加载并准备数据\nfilename = 'ionosphere.csv'\ndataset\
  \ = load_csv(filename)\n.\n.\nprint('得分: %s' % scores)\nprint('平均准确率: %.3f%%' %\
  \ (sum(scores)/float(len(scores))))\n```\n\n这是主代码部分，处理执行完整 LVQ 数据模型所需的所有步骤。此部分之前的所有代码都是实现\
  \ LVQ 过程中各个步骤的函数定义。主代码体按处理 LVQ 算法并显示最终结果所需的顺序调用这些方法。\n\n通过输入以下命令运行脚本：\n\n```\npython\
  \ lvqDemo.py\n```\n\n图 3-24 显示了运行此脚本的结果。\n\n![../images/482214_1_En_3_Chapter/482214_1_En_3_Fig24_HTML.jpg](img/482214_1_En_3_Fig24_HTML.jpg)\n\
  \n图 3-24\n\nlvqDemo 运行结果\n\n该图显示，此 LVQ 数据模型的平均准确率为 87.1%，相比零规则估计的 64.1%有显著提升。这一结果证实，LVQ\
  \ 模型适用于电离层数据集，并且能够做出相当准确的预测。\n\n## Bagging 与随机森林\n\n在开始讨论之前，我再次感谢 Jason Brownlee\
  \ 博士撰写了一系列关于 Bagging 和随机森林的优秀博客。这些博客包括 2016 年 4 月的《Bagging 与随机森林集成算法在机器学习中的应用》、2016\
  \ 年 11 月的《如何用 Python 从零实现 Bagging》以及 2016 年 11 月的《如何用 Python 从零实现随机森林》。本节中的大部分代码和关键概念均基于上述博客；不过，我在需要的地方添加了自己的注释和详细解释，相信这对经验不足的读者会有所帮助。\n\
  \n\n\n### Bagging（自助聚合）与随机森林简介\n\n随机森林是一种流行的算法，属于集成机器学习算法的一种，称为自助聚合（Bootstrap Aggregation），简称\
  \ Bagging。我将首先讨论“自助法”（Bootstrap）一词的含义。它是一种统计过程，旨在从数据集中估计某个测量值或指标。一个简单的例子有助于阐明这个概念。\n\
  \n如果数据集包含某个变量 *x* 的 100 个样本值，那么均值很容易计算为：\n\n![$$ mean(x)=\\frac{\\sum x}{100} $$](img/482214_1_En_3_Chapter_TeX_Eque.png)\n\
  \n然而，这个计算中可能存在一些估计误差，可以通过以下列出的自助法过程来改进：\n\n1.  从数据集中创建许多（例如 1000 个）有放回的随机子样本（意味着同一个值可以被多次使用）。\n\
  2.  计算每个新子样本的均值。\n3.  计算所有这些新均值的平均值，并将其用作数据集新的估计均值。\n\n这个过程也可以扩展到估计其他指标，例如标准差。\n\
  \n#### 自助聚合（Bagging）\n\nBagging 是一种集成过程，它将从多个机器学习算法收集到的预测结果组合成一个比任何单个机器学习预测都更准确的预测。它基本上是一种协同预测方法，其中一组算法比该组中的任何单个成员都更强大。使用\
  \ Bagging 可以减少那些易受方差影响的算法（如分类与回归树，CART）的方差。例如，决策树对用于创建树的数据选择很敏感。一棵在某个数据子集上训练的特定树，如果在另一个不同于原始数据子集的数据子集上训练，很容易提供不同的预测结果。以下通用的\
  \ Bagging 过程可用于提高 CART 的预测准确性：\n\n1.  从数据集中创建许多（例如 100 个）有放回的随机子样本。\n2.  在每个新样本上训练一个\
  \ CART 模型。\n3.  给定一个新数据集，计算每个模型预测的平均值。\n\n与 Bagging 过程一起使用的决策树必然很深，这意味着每个叶节点上只附着少量训练样本。这样的树会有高方差但低偏差。请参考我之前在第\
  \ 2 章中关于决策树的讨论，以重温这些术语。需要牢记的关键点是，Bagging 只关心样本数量，以及在此情况下的树的数量。这个过程对过拟合也相当宽容，即使运行大量模型，也几乎不会引入太多误差。唯一的问题将是准备模型和执行计算所需的时间。\n\
  \n#### 随机森林\n\n随机森林是为了提高决策树 Bagging 的性能而开发的。CART 生成的决策树的一个大问题是，它们在选择分裂变量时是贪婪的，使用一种试图最小化误差的贪婪算法。这对\
  \ CART 算法本身完全合理，但对 Bagging 过程来说却是个问题。决策树通常可能包含相似的数据结构，这会导致后续预测之间存在高度相关性。如果预测来自相对不相关的子集（子树），Bagging\
  \ 的效果会更好。随机森林改变了学习子集的方式，以提高预测准确性。使所有子集的相关性降低是实现这一目标的必要条件。\n\n随机森林对 CART 算法的修改相当简单。在未经修改的\
  \ CART 算法中，学习部分被允许测试所有变量（特征），以便选择最佳分裂点。随机森林改变了这一过程，使得学习部分现在仅限于测试变量的随机样本。在每个分裂点可以测试的变量数量也被设置为学习算法的一个参数\
  \ *m*。对于随机森林分类问题，建议将 *m* 设置为 *p* 的平方根，其中 *p* 是数据集中的特征数量。\n\n#### 性能估计与变量重要性\n\n\
  当创建自助样本时，会有一些数据样本被排除在子集之外。这些样本被称为袋外（OOB）样本。如果对 OOB 样本的预测结果进行平均，就可以对 Bagging 模型的准确性进行估计。这种估计的性能通常被称为\
  \ OOB 性能估计。这种性能度量是可靠的测试误差估计，并且与交叉验证估计值相关性良好。\n\n在构建 Bagging 决策树时，可以计算每个额外变量在每个分裂点处使误差函数下降了多少。在回归问题中，这可能是平方误差和的下降；在分类问题中，这可能是基尼系数的下降。\n\
  \n这些误差下降值可以在所有决策树中取平均并输出，以提供每个输入变量重要性的估计。当变量被选中时，误差下降越大，其重要性就越高。这些输出有助于识别与问题最相关的输入变量子集，以及可能从数据集中移除（最不相关）的候选变量。\n\
  \n### 自助法重采样演示\n\n本演示将展示自助法过程是如何运作的。首先创建一个由随机数组成的人造数据集，然后从中衍生出各种大小的子集。接着计算每个子集的均值，然后将子集均值的平均值与原始数据集的总体均值进行比较。\n\
  \n此测试的完整脚本名为 bootstrapDemo.py，可从本书的配套网站获取。脚本代码简单明了，除了已包含的注释外，无需额外说明。\n\n```\n# 导入所需库\n\
  from random import seed\nfrom random import random\nfrom random import randrange\n\
  # 从数据集中有放回地创建一个随机子集。\ndef subsample(dataset, ratio=1.0):\nsample = list()\nn_sample\
  \ = round(len(dataset) * ratio)\nwhile len(sample) < n_sample:\nindex = randrange(len(dataset))\n\
  sample.append(dataset[index])\nreturn sample\n# 计算一个数字列表的均值。\ndef mean(numbers):\n\
  return sum(numbers) / float(len(numbers))\nseed(1)\n# 计算真实均值。\n# 原始数据集有 20 行，每行包含一个\
  \ 0 到 9 的随机数。\ndataset = [[randrange(10)] for i in range(20)]\nprint('真实均值: %.3f'\
  \ % mean([row[0] for row in dataset]))\n# 计算并显示来自不同大小子集的估计均值。\nratio = 0.10\nfor\
  \ size in [1, 10, 100]:\nsample_means = list()\nfor i in range(size):\nsample =\
  \ subsample(dataset, ratio)\nsample_mean = mean([row[0] for row in sample])\nsample_means.append(sample_mean)\n\
  print('样本数=%d, 估计均值: %.3f' % (size, mean(sample_means)))\n```\n\n通过输入以下命令来运行脚本：\n\
  \n```\npython bootstrapDemo.py\n```\n\n图 3-25 显示了运行此脚本的结果。\n\n![../images/482214_1_En_3_Chapter/482214_1_En_3_Fig25_HTML.jpg](img/482214_1_En_3_Fig25_HTML.jpg)\n\
  \n图 3-25\n\nbootstrapDemo 结果\n\n您应该能够看到，随着每个子集中样本数量的增加，估计的均值开始向真实均值收敛。\n\n\n\n###\
  \ Bagging（自助聚合）演示\n\n本演示的脚本中包含了决策树数据模型。为了提升整体预测精度，对该模型应用了自助数据聚合（Bagging）方法。\n\n\
  所使用的数据集名为 sonar-data.csv，是海洋环境中经过处理的声纳“探测”数据所生成的数值记录集合。每条记录描述了声纳系统啁啾信号回波的属性。共有 60\
  \ 个输入变量（即特征），它们是在不同发射角度下对回波信号强度的测量值。这是一个二分类问题，因为模型旨在区分岩石（R）和水雷（M）。该数据集包含 208 条记录。所有变量都是连续的，名义范围在\
  \ 0 到 1 之间。输出变量（类别）要么是代表水雷的“M”，要么是代表岩石的“R”。脚本会将这些变量分别转换为整数 1 或 0。\n\n该数据集名为 sonar.all-data.csv，可以从\
  \ `https://archive.ics.uci.edu/ml/datasets/Connectionist+Bench+(Sonar,+Mines+vs.+Rocks)`\
  \ 下载。请务必将下载文件的扩展名改为 csv。\n\n我将脚本命名为 baggingDemo.py，可从本书的配套网站获取。此外，为了换换节奏，我决定不再添加任何进一步的解释性注释，因为该脚本已超过\
  \ 200 行，而且其中的许多代码段，你应该已经从本章前面的讨论以及第 2 章关于决策树的详细讨论中熟悉了。\n\n```\n# Bagging Algorithm\
  \ on the Sonar dataset\n# Import required libraries\nfrom random import seed\nfrom\
  \ random import randrange\nfrom csv import reader\n# Load a CSV file\ndef load_csv(filename):\n\
  dataset = list()\nwith open(filename, 'r') as file:\ncsv_reader = reader(file)\n\
  for row in csv_reader:\nif not row:\ncontinue\ndataset.append(row)\nreturn dataset\n\
  # Convert string column to float\ndef str_column_to_float(dataset, column):\nfor\
  \ row in dataset:\nrow[column] = float(row[column].strip())\n# Convert string column\
  \ to integer\ndef str_column_to_int(dataset, column):\nclass_values = [row[column]\
  \ for row in dataset]\nunique = set(class_values)\nlookup = dict()\nfor i, value\
  \ in enumerate(unique):\nlookup[value] = i\nfor row in dataset:\nrow[column] = lookup[row[column]]\n\
  return lookup\n# Split a dataset into k folds\ndef cross_validation_split(dataset,\
  \ n_folds):\ndataset_split = list()\ndataset_copy = list(dataset)\nfold_size = int(len(dataset)\
  \ / n_folds)\nfor i in range(n_folds):\nfold = list()\nwhile len(fold) = max_depth:\n\
  node['left'], node['right'] = to_terminal(left), to_terminal(right)\nreturn\n# process\
  \ left child\nif len(left) <= min_size:\nnode['left'] = to_terminal(left)\nelse:\n\
  node['left'] = get_split(left)\nsplit(node['left'], max_depth, min_size, depth+1)\n\
  # process right child\nif len(right) <= min_size:\nnode['right'] = to_terminal(right)\n\
  else:\nnode['right'] = get_split(right)\nsplit(node['right'], max_depth, min_size,\
  \ depth+1)\n# Build a decision tree\ndef build_tree(train, max_depth, min_size):\n\
  root = get_split(train)\nsplit(root, max_depth, min_size, 1)\nreturn root\n# Make\
  \ a prediction with a decision tree\ndef predict(node, row):\nif row[node['index']]\
  \ < node['value']:\nif isinstance(node['left'], dict):\nreturn predict(node['left'],\
  \ row)\nelse:\nreturn node['left']\nelse:\nif isinstance(node['right'], dict):\n\
  return predict(node['right'], row)\nelse:\nreturn node['right']\n# Create a random\
  \ subsample from the dataset with replacement\ndef subsample(dataset, ratio):\n\
  sample = list()\nn_sample = round(len(dataset) * ratio)\nwhile len(sample) < n_sample:\n\
  index = randrange(len(dataset))\nsample.append(dataset[index])\nreturn sample\n\
  # Make a prediction with a list of bagged trees\ndef bagging_predict(trees, row):\n\
  predictions = [predict(tree, row) for tree in trees]\nreturn max(set(predictions),\
  \ key=predictions.count)\n# Bootstrap Aggregation Algorithm\ndef bagging(train,\
  \ test, max_depth, min_size, sample_size, n_trees):\ntrees = list()\nfor i in range(n_trees):\n\
  sample = subsample(train, sample_size)\ntree = build_tree(sample, max_depth, min_size)\n\
  trees.append(tree)\npredictions = [bagging_predict(trees, row) for row in test]\n\
  return(predictions)\n# Test bagging on the sonar dataset\nseed(1)\n# load and prepare\
  \ data\nfilename = 'sonar.all-data.csv'\ndataset = load_csv(filename)\n# convert\
  \ string attributes to integers\nfor i in range(len(dataset[0])-1):\nstr_column_to_float(dataset,\
  \ i)\n# convert class column to integers\nstr_column_to_int(dataset, len(dataset[0])-1)\n\
  # evaluate algorithm\nn_folds = 5\nmax_depth = 6\nmin_size = 2\nsample_size = 0.50\n\
  for n_trees in [1, 5, 10, 50]:\nscores = evaluate_algorithm(dataset, bagging, n_folds,\
  \ max_depth, min_size, sample_size, n_trees)\nprint('Trees: %d' % n_trees)\nprint('Scores:\
  \ %s' % scores)\nprint('Mean Accuracy: %.3f%%' % (sum(scores)/float(len(scores))))\n\
  ```\n\n通过输入以下命令来运行脚本：\n\n```\npython baggingDemo.py\n```\n\n图 3-26 显示了运行此脚本的结果。\n\
  \n![../images/482214_1_En_3_Chapter/482214_1_En_3_Fig26_HTML.jpg](img/482214_1_En_3_Fig26_HTML.jpg)\n\
  \n图 3-26\n\nbaggingDemo 结果\n\n图中显示了五折数据集的中间精度分数以及总体聚合精度值。你可以看到，总体精度值从使用 1 棵树时的 71.7%\
  \ 缓慢提升到使用 50 棵树时的 75.6%。虽然表现并非卓越，但通过使用 bagging 方法，整体上还是取得了一点改进。\n\n使用 bagging 方法的一个难点在于，即使构建了很深的树，这些经过\
  \ bagging 的树也彼此相似。因此，使用这些树做出的任何预测也会相似。原本期望基于不同样本训练出的树之间应存在的高方差，也因此被削弱了。这完全归因于我先前讨论过的决策树分裂算法中使用的贪婪算法。本脚本试图通过限制训练过程中使用的样本大小来增加方差，但收效甚微。真正能增加子集方差的方法是使用随机森林算法，这将是下一个演示的主题。\n\
  \n\n\n### 随机森林演示\n\n决策树通常具有高方差，这使得任何预测结果都高度依赖于训练数据。通过一种称为装袋（bagging）的技术，从训练数据的样本中构建多个模型，有助于降低这种方差，但树之间仍然高度相关。\n\
  \n随机森林是装袋的一种扩展，它除了基于训练数据的多个样本构建树之外，还限制了可用于构建树的特征，从而迫使树之间产生差异。这种构建决策树的修改通常会带来性能上的提升。\n\
  \n本演示使用了与之前装袋演示相同的数据集。实际上，除了计算决策分割点的方式不同之外，脚本几乎与之前的脚本完全相同。随机森林的修改使得算法会搜索输入属性的一个样本，而不是搜索使总成本函数最小化的那个属性。这个属性样本可以随机选择且不放回，这意味着在搜索使成本最小化的分割点时，每个输入属性只需被考虑一次。\n\
  \n基尼指数用于评估潜在分割点的成本。你可以参考决策树章节中关于基尼指数的讨论来复习这个函数。\n\n我将此脚本命名为 `randomForestDemo.py`，它可以在本书的配套网站上找到。与之前的脚本一样，我选择不添加任何进一步的解释性注释，因为这个脚本已经超过\
  \ 200 行，并且许多代码段与 `baggingDemo` 脚本相同。\n\n```\n# 在声纳数据集上实现随机森林算法\n# 导入所需库\nfrom random\
  \ import seed\nfrom random import randrange\nfrom csv import reader\nfrom math import\
  \ sqrt\n# 加载 CSV 文件\ndef load_csv(filename):\ndataset = list()\nwith open(filename,\
  \ 'r') as file:\ncsv_reader = reader(file)\nfor row in csv_reader:\nif not row:\n\
  continue\ndataset.append(row)\nreturn dataset\n# 将字符串列转换为浮点数\ndef str_column_to_float(dataset,\
  \ column):\nfor row in dataset:\nrow[column] = float(row[column].strip())\n# 将字符串列转换为整数\n\
  def str_column_to_int(dataset, column):\nclass_values = [row[column] for row in\
  \ dataset]\nunique = set(class_values)\nlookup = dict()\nfor i, value in enumerate(unique):\n\
  lookup[value] = i\nfor row in dataset:\nrow[column] = lookup[row[column]]\nreturn\
  \ lookup\n# 将数据集分割成 k 折\ndef cross_validation_split(dataset, n_folds):\ndataset_split\
  \ = list()\ndataset_copy = list(dataset)\nfold_size = int(len(dataset) / n_folds)\n\
  for i in range(n_folds):\nfold = list()\nwhile len(fold) < fold_size:\nindex = randrange(len(dataset_copy))\n\
  fold.append(dataset_copy.pop(index))\ndataset_split.append(fold)\nreturn dataset_split\n\
  # 计算准确率百分比\ndef accuracy_metric(actual, predicted):\ncorrect = 0\nfor i in range(len(actual)):\n\
  if actual[i] == predicted[i]:\ncorrect += 1\nreturn correct / float(len(actual))\
  \ * 100.0\n# 使用交叉验证分割评估算法\ndef evaluate_algorithm(dataset, algorithm, n_folds, *args):\n\
  folds = cross_validation_split(dataset, n_folds)\nscores = list()\nfor fold in folds:\n\
  train_set = list(folds)\ntrain_set.remove(fold)\ntrain_set = sum(train_set, [])\n\
  test_set = list()\nfor row in fold:\nrow_copy = list(row)\ntest_set.append(row_copy)\n\
  row_copy[-1] = None\npredicted = algorithm(train_set, test_set, *args)\nactual =\
  \ [row[-1] for row in fold]\naccuracy = accuracy_metric(actual, predicted)\nscores.append(accuracy)\n\
  return scores\n# 根据基尼指数分割数据集\ndef test_split(index, value, dataset):\nleft, right\
  \ = list(), list()\nfor row in dataset:\nif row[index] < value:\nleft.append(row)\n\
  else:\nright.append(row)\nreturn left, right\n# 计算分割点的基尼指数\ndef gini_index(groups,\
  \ classes):\n# 计算所有样本点的数量\nn_instances = float(sum([len(group) for group in groups]))\n\
  # 计算每组中每个类别的加权基尼指数\ngini = 0.0\nfor group in groups:\nsize = float(len(group))\n\
  # 避免除以零\nif size == 0:\ncontinue\nscore = 0.0\n# 根据每个类别对组进行评分\nfor class_val in\
  \ classes:\np = [row[-1] for row in group].count(class_val) / size\nscore += p *\
  \ p\n# 通过组内概率加权组间基尼指数\ngini += (1.0 - score) * (size / n_instances)\nreturn gini\n\
  # 选择最佳分割点\ndef get_split(dataset, n_features):\nclass_values = list(set(row[-1]\
  \ for row in dataset))\nb_index, b_value, b_score, b_groups = 999, 999, 999, None\n\
  features = list()\nwhile len(features) < n_features:\nindex = randrange(len(dataset[0])-1)\n\
  if index not in features:\nfeatures.append(index)\nfor index in features:\nfor row\
  \ in dataset:\ngroups = test_split(index, row[index], dataset)\ngini = gini_index(groups,\
  \ class_values)\nif gini < b_score:\nb_index, b_value, b_score, b_groups = index,\
  \ row[index], gini, groups\nreturn {'index':b_index, 'value':b_value, 'groups':b_groups}\n\
  # 创建终端节点值\ndef to_terminal(group):\noutcomes = [row[-1] for row in group]\nreturn\
  \ max(set(outcomes), key=outcomes.count)\n# 为子节点或终端节点创建分割点\ndef split(node, max_depth,\
  \ min_size, n_features, depth):\nleft, right = node['groups']\ndel(node['groups'])\n\
  # 检查是否没有分割点\nif not left or not right:\nnode['left'] = node['right'] = to_terminal(left\
  \ + right)\nreturn\n# 检查最大深度\nif depth >= max_depth:\nnode['left'], node['right']\
  \ = to_terminal(left), to_terminal(right)\nreturn\n# 处理左子节点\nif len(left) <= min_size:\n\
  node['left'] = to_terminal(left)\nelse:\nnode['left'] = get_split(left, n_features)\n\
  split(node['left'], max_depth, min_size, n_features, depth+1)\n# 处理右子节点\nif len(right)\
  \ <= min_size:\nnode['right'] = to_terminal(right)\nelse:\nnode['right'] = get_split(right,\
  \ n_features)\nsplit(node['right'], max_depth, min_size, n_features, depth+1)\n\
  # 构建决策树\ndef build_tree(train, max_depth, min_size, n_features):\nroot = get_split(train,\
  \ n_features)\nsplit(root, max_depth, min_size, n_features, 1)\nreturn root\n# 使用决策树进行预测\n\
  def predict(node, row):\nif row[node['index']] < node['value']:\nif isinstance(node['left'],\
  \ dict):\nreturn predict(node['left'], row)\nelse:\nreturn node['left']\nelse:\n\
  if isinstance(node['right'], dict):\nreturn predict(node['right'], row)\nelse:\n\
  return node['right']\n# 从数据集中创建有放回的随机子样本\ndef subsample(dataset, ratio):\nsample\
  \ = list()\nn_sample = round(len(dataset) * ratio)\nwhile len(sample) < n_sample:\n\
  index = randrange(len(dataset))\nsample.append(dataset[index])\nreturn sample\n\
  # 使用一组装袋树进行预测\ndef bagging_predict(trees, row):\npredictions = [predict(tree, row)\
  \ for tree in trees]\nreturn max(set(predictions), key=predictions.count)\n# 随机森林算法\n\
  def random_forest(train, test, max_depth, min_size, sample_size, n_trees, n_features):\n\
  trees = list()\nfor i in range(n_trees):\nsample = subsample(train, sample_size)\n\
  tree = build_tree(sample, max_depth, min_size, n_features)\ntrees.append(tree)\n\
  predictions = [bagging_predict(trees, row) for row in test]\nreturn(predictions)\n\
  # 测试随机森林算法\nseed(2)\n# 加载并准备数据\nfilename = 'sonar.all-data.csv'\ndataset = load_csv(filename)\n\
  # 将字符串属性转换为整数\nfor i in range(0, len(dataset[0])-1):\nstr_column_to_float(dataset,\
  \ i)\n# 将类别列转换为整数\nstr_column_to_int(dataset, len(dataset[0])-1)\n# 评估算法\nn_folds\
  \ = 5\nmax_depth = 10\nmin_size = 1\nsample_size = 1.0\nn_features = int(sqrt(len(dataset[0])-1))\n\
  for n_trees in [1, 5, 10]:\nscores = evaluate_algorithm(dataset, random_forest,\
  \ n_folds, max_depth, min_size, sample_size, n_trees, n_features)\nprint('Trees:\
  \ %d' % n_trees)\nprint('Scores: %s' % scores)\nprint('Mean Accuracy: %.3f%%' %\
  \ (sum(scores)/float(len(scores))))\n```\n\n通过输入以下命令来运行脚本：\n\n```\npython randomForestDemo.py\n\
  ```\n\n图 3-27 显示了运行此脚本的结果。\n\n![../images/482214_1_En_3_Chapter/482214_1_En_3_Fig27_HTML.jpg](img/482214_1_En_3_Fig27_HTML.jpg)\n\
  \n图 3-27\n\nrandomForestDemo 结果\n\n交叉验证使用了 k 值为 5，使得每次迭代评估时，每折有 208/5 = 41.6 条，即略多于\
