  从该图可以明显看出，将迭代次数扩展到 100 次以上几乎无法带来任何改进。虽然完全有可能未达到全局最小值，但任何边际损失改进都可忽略不计。这种情况正是我在之前讨论中所说的“足够好”。


  对于感兴趣的读者，最终确定的最佳拟合线性回归方程为：


