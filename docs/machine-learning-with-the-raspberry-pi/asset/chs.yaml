  ![../images/482214_1_En_3_Chapter/482214_1_En_3_Fig16_HTML.jpg](img/482214_1_En_3_Fig16_HTML.jpg)\n\
  \n**图 3-16**\n\nsvmDemo1 结果\n\n你首先应该注意到的是 `head` 的结果，它显示了数据集中前五条记录的部分内容。共有 30 个属性，这意味着这是一个高维数据集，线性超平面试图对其进行分割。仅此一点就应该为你敲响警钟。几乎不可能想象出任何一个能够有效分离这么多数据点的平面，尤其是当许多数据点具有相似尺度时。这一现实在预测结果中得到了证实，其加权平均值为\
  \ 0.38。这是一个糟糕的结果，意味着只有 38% 的测试数据被正确预测。从长远来看，你简单地抛硬币都可能做得更好。如何改进这个结果？答案包含在下面的讨论中。\n\
  \n### SVM 演示 – 第二部分\n\nSVM 中有一项技术被称为核“技巧”，它是为处理高维数据集而开发的，例如本演示中使用的乳腺癌数据集。这个技巧实际上并非“卑鄙”或“阴险”意义上的技巧，而仅仅是为了适应高维数据集。当数据点在\
  \ p 维或有限空间中不是线性可分时，有人提出将这个空间映射到一个更高维的空间。然后，可以使用核技巧构建定制的非线性超平面。每个 SVM 核都包含一个非线性核函数。这个函数有助于构建一个高维特征空间。已经开发了许多核函数，并且目前还有其他核函数正在研究中。这是一个极其活跃的研究领域。\n\
  \n我将像解释基本 SVM 概念时那样，采用直观/图形化的方法来解释非线性核，因为该主题的基础数学过于复杂和详细，不适合包含在本书中。\n\n在图 3-17 中，左侧有\
  \ *x* 和 *o* 数据点，对于二维情况，它们显然无法被一个线性平面或直线分开。然而，如果数据点通过某个函数 ∅ 进行变换，它们就可以很容易地被分开，如图右侧所示。\n\
  \n![../images/482214_1_En_3_Chapter/482214_1_En_3_Fig17_HTML.jpg](img/482214_1_En_3_Fig17_HTML.jpg)\n\
  \n**图 3-17**\n\n变换后的数据集\n\n主要思想是通过将原始数据集映射到更高维的空间来改善类别的线性可分性。在图 3-18 中，图左上方的原始数据点无法被线性函数分开。在通过二次函数映射后，它们可以被分开，如右侧的图所示。\n\
  \n![../images/482214_1_En_3_Chapter/482214_1_En_3_Fig18_HTML.jpg](img/482214_1_En_3_Fig18_HTML.jpg)\n\
  \n**图 3-18**\n\n通过二次函数变换的数据集\n\n图 3-19 展示了另一个问题，其中决策边界并不明显。问题是，可以使用什么决策函数来分离这些数据点？\n\
  \n![../images/482214_1_En_3_Chapter/482214_1_En_3_Fig19_HTML.jpg](img/482214_1_En_3_Fig19_HTML.jpg)\n\
  \n**图 3-19**\n\n有问题的数据集\n\n这个问题的答案是使用极坐标，如图 3-20 所示。\n\n![../images/482214_1_En_3_Chapter/482214_1_En_3_Fig20_HTML.jpg](img/482214_1_En_3_Fig20_HTML.jpg)\n\
  \n**图 3-20**\n\n已解决的有问题数据集\n\nSVM 拥有以下核函数来解决非线性数据集问题：\n\n**多项式核** – 该核实现以下方程\n\n\
  ![$$ K\\left({x}_i,{x}_j\\right)={\\left({x}_i\\ast {x}_j+1\\right)}^p $$](img/482214_1_En_3_Chapter_TeX_Equb.png)\n\
  \n其中 *p* = 可调参数。另请注意，计算 *K* 只需要在原始点积的基础上进行 1 次加法和 1 次幂运算。\n\n**径向基函数 (rbf)** – 该核实现以下方程\n\
  \n![$$ K\\left({x}_i,{x}_j\\right)={e}^{-\\frac{{\\left|{x}_i-{x}_j\\right|}²}{2\\\
  ast {\\sigma}²}} $$](img/482214_1_En_3_Chapter_TeX_Equc.png)\n\nrbf 也称为高斯函数。图 3-21\
  \ 展示了高斯函数在示例数据集上的应用。\n\n![../images/482214_1_En_3_Chapter/482214_1_En_3_Fig21_HTML.jpg](img/482214_1_En_3_Fig21_HTML.jpg)\n\
  \n**图 3-21**\n\n高斯函数应用\n\n**Sigmoid 函数** – 这是 sigmoid 函数，它也在其他数据模型中用作激活函数。\n\n\n\
  \n以下脚本名为 svmDemo2.py，可从本书的配套网站获取。此处仅列出新增代码，这些代码必须追加到现有的 svmDemo1.py 脚本中。我在代码后附上了一些解释性注释。\n\
  \n```\n# 网格搜索\nparam_grid = {'C':[0.1, 1, 10, 100, 1000], 'gamma':[1, 0.1, 0.01,\
  \ 0.001, 0.0001], 'kernel':['rbf']}\nfrom sklearn.model_selection import GridSearchCV\n\
  grid = GridSearchCV(SVC(), param_grid, refit=True, verbose=3)\ngrid.fit(X_train,\
  \ y_train)\nprint('\\n')\nprint('最佳参数为 ', grid.best_params_)\ngrid_predictions =\
  \ grid.predict(X_test)\nfrom sklearn.metrics import classification_report\nprint(classification_report(y_test,\
  \ grid_predictions))\n```\n\n以下是对该脚本中包含的新代码的解释性注释。\n\n```\nparam_grid = {'C':[0.1,\
  \ 1, 10, 100, 1000], 'gamma':[1, 0.1, 0.01, 0.001, 0.0001], 'kernel':['rbf']}\n\
  ```\n\n该语句设置了三个重要的 SVM 参数：`kernel`、`C` 和 `gamma`。`kernel` 参数有以下选项：\n\n*   linear\
  \ – 当数据集适合线性超平面分割时使用\n*   rbf – 非线性超平面\n*   poly – 非线性超平面\n\n`C` 参数在训练阶段用于指定在计算支持向量时，对数据异常值的考量程度。`C`\
  \ 值较低会使决策面更平滑，而高值则允许 SVM 模型选择更多样本作为支持向量。\n\n`gamma` 参数定义了单个训练样本的影响范围，低值表示“远”，高值表示“近”。`gamma`\
  \ 参数可以解释为模型选为支持向量的样本影响半径的倒数。\n\n选择合适的参数主要基于数据集的性质。在本例中，对于高维数据集，rbf 是一个不错的选择。为 `C`\
  \ 和 `gamma` 选择合适值则是一个棘手的问题。幸运的是，sklearn 提供了一种迭代方法来选择这些参数。\n\n```\nfrom sklearn.model_selection\
  \ import GridSearchCV\ngrid = GridSearchCV(SVC(), param_grid, refit=True, verbose=3)\n\
  grid.fit(X_train, y_train)\nprint('\\n')\nprint('最佳参数为 ', grid.best_params_)\ngrid_predictions\
  \ = grid.predict(X_test)\n```\n\n`GridSearchCV` 模块生成一个带有交叉验证的网格搜索对象。这段代码对数据集执行了两项任务：交叉验证和（超）参数调优。交叉验证是模型使用一组数据进行训练，并使用另一组数据进行测试的过程。参数调优是为模型参数选择能最大化模型准确率的值的过程。名为\
  \ `grid` 的对象现在包含了通过迭代网格搜索过程得到的 `C` 和 `gamma` 参数的最优值。会显示最优参数值，并使用优化后的参数生成一组新的预测结果。\n\
  \n```\nfrom sklearn.metrics import classification_report\nprint(classification_report(y_test,\
  \ grid_predictions))\n```\n\n预测的准确性通过从 sklearn 的 `metrics` 库导入的 `classification_report`\
  \ 模块来确认。回想一下，我之前在其他演示中使用过这个模块。\n\n通过输入以下命令来运行脚本：\n\n```\npython svmDemo2.py\n```\n\
  \n图 3-22 显示了运行脚本的结果。\n\n![../images/482214_1_En_3_Chapter/482214_1_En_3_Fig22_HTML.jpg](img/482214_1_En_3_Fig22_HTML.jpg)\n\
  \n图 3-22\n\nsvmDemo2 运行结果\n\n你在这张图中首先注意到的可能是顶部滚动显示的中间结果。这仅仅是计算最终优化参数所执行的 75 个步骤中的一小部分。滚动条的最后一行显示最终值为：\n\
  \nkernel = rbf, gamma = 0.0001 且 C = 1000。\n\n显然，内核规范在迭代过程中没有改变，但其他两个参数确实发生了变化。我确实查看了这个滚动条，并确定\
  \ gamma 值似乎对最终准确率影响最大。它最终是一个很小的值，这意味着模型选为支持向量的样本的影响半径很大，也就是说，在确定支持向量时包含了最大数量的数据点。\n\
