  nx.draw_networkx_edges(H,pos)\nnx.draw_networkx_labels(H,pos)\nplt.show()\n# 定义图中的点\n\
  MATRIX_SIZE = 8\n# 创建矩阵 (MATRIX_SIZE * MATRIX_SIZE)\nR = np.matrix(np.ones(shape=(MATRIX_SIZE,\
  \ MATRIX_SIZE)))\nR *= -1\n# 为路径分配 0，为到达目标的点分配 100\nfor point in points_list:\n\
  print(point)\nif point[1] == goal:\nR[point] = 100\nelse:\nR[point] = 0\nif point[0]\
  \ == goal:\nR[point[::-1]] = 100\nelse:\n# 点的反向\nR[point[::-1]]= 0\n# 添加目标点的往返路径\n\
  R[goal,goal]= 100\ndef available_actions(state):\ncurrent_state_row = R[state,]\n\
  av_act = np.where(current_state_row >= 0)[1]\nreturn av_act\ndef sample_next_action(available_actions_range):\n\
  next_action = int(np.random.choice(available_act, 1))\nreturn next_action\ndef collect_environmental_data(action):\n\
  found = []\nif action in bees:\nfound.append('b')\nif action in smoke:\nfound.append('s')\n\
  return found\n# 创建 Q 矩阵\nQ = np.matrix(np.zeros([MATRIX_SIZE,MATRIX_SIZE]))\n# 创建矩阵来保存蜜蜂和烟雾的总数\n\
  enviro_bees = np.matrix(np.zeros([MATRIX_SIZE, MATRIX_SIZE]))\nenviro_smoke = np.matrix(np.zeros([MATRIX_SIZE,\
  \ MATRIX_SIZE]))\n# 从烟雾中减去蜜蜂。这给烟雾一个负偏置\nenviro_matrix = enviro_bees - enviro_smoke\n\
  initial_state = 1\n# 获取当前状态下的可用动作\navailable_act = available_actions(initial_state)\n\
  # 采样下一个要执行的动作\naction = sample_next_action(available_act)\n# 此函数根据所选路径和 Q 学习算法更新\
  \ Q 矩阵\ndef update(current_state, action, gamma):\nmax_index = np.where(Q[action,]\
  \ == np.max(Q[action,]))[1]\nif max_index.shape[0] > 1:\nmax_index = int(np.random.choice(max_index,\
  \ size = 1))\nelse:\nmax_index = int(max_index)\nmax_value = Q[action, max_index]\n\
  Q[current_state, action] = R[current_state, action] + gamma * max_value\nprint('max_value',\
  \ R[current_state, action] + gamma * max_value)\nenvironment = collect_environmental_data(action)\n\
  if 'b' in environment:\nenviro_matrix[current_state, action] += 1\nif 's' in environment:\n\
  enviro_matrix[current_state, action] -= 1\nif (np.max(Q) > 0):\nreturn(np.sum(Q/np.max(Q)*100))\n\
  else:\nreturn(0)\n# 执行一次更新\nupdate(initial_state,action,gamma)\n# 创建事务性矩阵副本，用于 enviro_help\
  \ 方法\nenviro_matrix_snap = enviro_matrix.copy()\ndef available_actions_with_enviro_help(state):\n\
  current_state_row = R[state,]\nav_act = np.where(current_state_row >= 0)[1]\n# 如果存在多条路径，则对负值路径进行降权\n\
  env_pos_row = enviro_matrix_snap[state,av_act]\nif (np.sum(env_pos_row =0]\nif len(temp_av_act)\
  \ > 0:\nprint('从:',av_act)\nprint('到:',temp_av_act)\nav_act = temp_av_act\nreturn\
  \ av_act\n# 训练开始\nscores = []\nfor i in range(700):\ncurrent_state = np.random.randint(0,\
  \ int(Q.shape[0]))\navailable_act = available_actions_with_enviro_help(current_state)\n\
  action = sample_next_action(available_act)\nscore = update(current_state,action,gamma)\n\
  scores.append(score)\nprint ('得分:', str(score))\nplt.plot(scores)\nplt.show()\n\
  ```\n\n###### 运行脚本并评估结果\n\n通过输入以下命令运行脚本：\n\n```\npython beeRLenv.py\n```\n\n图 9-24\
  \ 是本演示中随机生成的环境示意图。\n\n![../images/482214_1_En_9_Chapter/482214_1_En_9_Fig24_HTML.jpg](img/482214_1_En_9_Fig24_HTML.jpg)\n\
  \n图 9-24\n\n随机生成的环境\n\n图 9-25 是一个终端窗口，显示了被评估的路径。最后列出的路径是最优选择路径。如果你查看图 9-24，这应该不会令人意外。但是，你必须记住，智能体并没有这种鸟瞰环境的视角，它必须系统地测试从起始节点出发的每一条可用连接。\n\
  \n![../images/482214_1_En_9_Chapter/482214_1_En_9_Fig25_HTML.jpg](img/482214_1_En_9_Fig25_HTML.jpg)\n\
  \n图 9-25\n\n显示已评估路径的终端窗口\n\n本结果部分的最后一张图是图 9-26，它展示了评分收敛情况。这是本演示唯一的性能衡量指标，也是证明这种动态方法是否有效的关键证据。\n\
  \n![../images/482214_1_En_9_Chapter/482214_1_En_9_Fig26_HTML.jpg](img/482214_1_En_9_Fig26_HTML.jpg)\n\
  \n图 9-26\n\n评分收敛图\n\n从图中可以看出，最终评分值在大约第 180 个回合时有效达到。将此图与图 9-22 中显示的图进行比较，后者的最终评分值在大约第\
  \ 400 个回合时收敛。动态方法收敛得更早，证明其性能远优于不考虑环境条件的方法。这个结果在某种程度上类似于使用偏置值调整人工神经网络（ANN）或卷积神经网络（CNN）以提升性能。\n\
  \n\n\n## Q 学习与神经网络\n\n在*打砖块*游戏中，环境状态仅由挡板位置、球的位置和方向以及每个砖块是否存在来定义。然而，这种直观的表示方式仅适用于特定游戏。是否存在一种更通用的方法，适用于所有游戏？显而易见的选择是使用屏幕像素，因为它们隐含地包含了游戏情境的所有相关信息，但在*打砖块*游戏中，球的速度和方向除外。不过，通过连续两帧或更多帧画面，可以充分描述球的状态。\n\
  \n如果对游戏画面应用 DeepMind 的预处理方法，即取最近四帧屏幕图像，将其调整为 84×84 像素，并转换为 256 级灰度的灰度图。这将产生 256^(84x84x4)\
  \ ≈ 10⁶⁷⁹⁷⁰种可能的游戏状态。这意味着 Q 表中将有 10⁶⁷⁹⁷⁰行，这比已知宇宙中的原子数量还要多——显然这是不可能实现的。这种庞大的状态数量可以通过仅包含已访问过的状态来大幅减少。即便如此，大多数状态很少被访问，Q\
  \ 表需要宇宙的寿命才能收敛——这同样不是一个理想的方案。解决方案在于为从未见过的状态估算 Q 值。\n\n此时，深度学习（DL）将大有裨益。神经网络在从高度结构化的数据中提取有用特征方面表现异常出色。神经网络可以表示一个\
  \ Q 函数，该函数以状态（四帧游戏画面）和动作作为输入，并输出相应的 Q 值。另一种方案是，将游戏画面作为输入，并为每个可能的动作输出一个 Q 值。后者正是\
  \ DeepMind 团队采用的方法。无论采用哪种方法，其优势在于只需通过网络进行一次前向传播，即可执行 Q 值更新或选择具有最高 Q 值的动作。\n\n图 9-27\
  \ 展示了将四个状态输入神经网络并获取单个 Q 值输出的“朴素”方法。\n\n![../images/482214_1_En_9_Chapter/482214_1_En_9_Fig27_HTML.jpg](img/482214_1_En_9_Fig27_HTML.jpg)\n\
  \n图 9-27\n\n使用深度学习与 Q 学习的朴素方法\n\n相比之下，图 9-28 展示了 DeepMind 团队采用的方法，即输入单个状态并输出多个 Q\
  \ 值。\n\n![../images/482214_1_En_9_Chapter/482214_1_En_9_Fig28_HTML.jpg](img/482214_1_En_9_Fig28_HTML.jpg)\n\
  \n图 9-28\n\nDeepMind 的深度学习与 Q 学习方法\n\n作为纯信息参考，表 9-1 展示了 DeepMind 模型中使用的架构。\n\n表\
  \ 9-1\n\nDeepMind 模型架构\n\n| 层 | 输入 | 滤波器大小 | 步长 | 滤波器数量 | 激活函数 | 输出 |\n| --- | ---\
  \ | --- | --- | --- | --- | --- |\n| conv1 | 84x84x4 | 8x8 | 4 | 32 | ReLU | 20x20x32\
  \ |\n| conv2 | 20x20x32 | 4x4 | 2 | 64 | ReLU | 9x9x64 |\n| conv3 | 9x9x64 | 3x3\
  \ | 1 | 64 | ReLU | 7x7x64 |\n| fc4 | 7x7x64 |   |   | 512 | ReLU | 512 |\n| fc5\
  \ | 512 |   |   | 18 | 线性 | 18 |\n\n这是一个卷积神经网络，包含三个卷积层，后接两个全连接层。注意，其中没有池化层。这是因为池化层会导致特征变得平移不变。这意味着模型对图像中物体的位置变得不敏感。这将破坏模型在*打砖块*游戏中追踪球位置的能力。\n\
  \n网络的输入是四帧 84×84 的灰度游戏画面。网络的输出是每个可能动作的 Q 值，在*打砖块*游戏中有 18 个动作。Q 值是实数值，因此这构成了一个回归任务，可以使用简单的平方误差损失（L）进行优化。\n\
  \n![$$ L=\\frac{1}{2}{\\left(r+{\\mathit{\\max}}_{a^{\\prime }}Q\\left({s}^{\\prime\
  \ },{a}^{\\prime}\\right)-Q\\left(s,a\\right)\\right)}² $$](img/482214_1_En_9_Chapter_TeX_Equs.png)\n\
  \n其中\n\n![$$ r+{\\mathit{\\max}}_{a^{\\prime }}Q\\left({s}^{\\prime },{a}^{\\prime}\\\
  right) $$](img/482214_1_En_9_Chapter_TeX_IEq3.png) = 目标值\n\n*Q*(*s*, *a*) = 预测值\n\
  \n给定一个转移 (*s, a, r, s*′)，经典的贝尔曼方程 Q 表更新规则必须替换为以下过程：\n\n1.  对当前状态 *s* 执行一次前馈传播，获取所有动作的预测\
  \ Q 值。\n2.  对下一个状态 *s*^′ 执行一次前馈传播，并计算网络输出的最大值 ![$$ {\\mathit{\\max}}_{a^{\\prime\
  \ }}Q\\left({s}^{\\prime },{a}^{\\prime}\\right) $$](img/482214_1_En_9_Chapter_TeX_IEq4.png)。\n\
  3.  将动作的 Q 值目标设置为 ![$$ r+{\\gamma max}_{a^{\\prime }}Q\\left({s}^{\\prime },{a}^{\\\
  prime}\\right) $$](img/482214_1_En_9_Chapter_TeX_IEq5.png)（使用步骤 2 中计算的最大值）。对于所有其他动作，将\
  \ Q 值目标设置为与步骤 1 中原始返回的值相同，从而使这些输出的误差为 0。\n4.  使用反向传播更新权重。\n\n上述过程展示了如何通过 Q 学习估算每个状态下的未来奖励，并使用\
  \ CNN 近似 Q 函数。然而，事实证明，使用非线性函数近似 Q 值是不稳定的。必须使用许多调优技术才能使其收敛。而且这需要很长时间，使用配备单个 GPU 板的计算机几乎需要一周时间。\n\
  \n最重要的调优技术是使用经验回放。在游戏过程中，所有经验 (*s, a, r, s’*) 都存储在回放记忆中。训练网络时，使用来自回放记忆的随机小批量数据，而不是最近的转移。这打破了训练样本中可能存在的任何相似性，这种相似性可能会无意中将网络推向局部最小值。此外，使用经验回放使训练任务类似于常规的监督学习。这简化了调试和进一步的算法测试。\n\
  \n将深度学习与 Q 学习结合使用，试图解决我在本章开头提到的信用分配问题。这个解决方案之所以有效，是因为奖励会随时间反向传播，直到到达关键的决策点。该点才是获得奖励的实际原因。\n\
  \n另一个主要问题是探索与利用的困境，也在本章开头提到过。你应该意识到，当 Q 表或 Q 网络被随机初始化时，其预测最初也是随机的。如果选择具有最高 Q 值的动作，那么该动作将是随机的，智能体将进行简单的探索。随着\
  \ Q 函数收敛，它会返回更一致的 Q 值，探索量也会减少。可以说，Q 学习将探索作为算法的一部分。但这种探索是“贪婪的”，因为它会选择它找到的第一个有效策略。\n\
  \n针对上述问题，一个简单有效的解决方法是ε-贪婪探索，即以概率ε选择随机动作；否则，选择具有最高 Q 值的“贪婪”动作。DeepMind 系统随时间将ε从 1\
  \ 降低到 0.1。当 DeepMind 系统启动时，它完全随机移动以彻底探索状态空间，然后稳定在一个固定的探索率上。\n\n以上所有讨论都可以通过基于 DeepMind\
  \ 模型的一些伪代码来概括，该伪代码提供了一个相对易于理解的算法。\n\n```\n初始化回放记忆 D\n使用随机权重初始化动作-价值函数 Q\n观察初始状态\
  \ s\n重复：\n  选择一个动作 a\n  以概率 ε 选择一个随机动作\n  否则选择 a = argmaxa'Q(s,a')\n  执行动作 a\n \
  \ 观察奖励 r 和新状态 s'\n  将经验 (s, a, r, s') 存储在回放记忆 D 中\n  从回放记忆 D 中采样随机转移 ( ss, aa, rr,\
  \ ss' )\n  为每个小批量转移计算目标：\n    如果 ss' 是终止状态，则 tt = rr\n    否则 tt = rr + γmaxa'Q(ss',aa')\n\
  \  使用 (tt – Q(ss,aa))2 作为损失训练 Q 网络\n  s = s'\n直到终止\n```\n\nDeepMind 团队为了使其真正工作，还使用了更多调优技术，例如使用目标网络、误差裁剪、奖励裁剪等。我将把这些话题留给感兴趣的读者去深入研究。\n\
  \n令人惊奇的是，这个算法竟然真的能学到东西。试想一下，Q 函数是随机初始化的；当它首次启动时，自然会输出垃圾数据。然后，算法使用这些初始垃圾数据（下一个状态的最大\
  \ Q 值）作为网络的目标，只是偶尔记录一个微小的奖励。从宏观角度来看，这种方法似乎毫无意义。算法怎么可能学到任何有意义的东西？奇怪的事实是，它最终确实学到了。\n\
  \n一些非常聪明的人曾说过，人工智能是我们尚未弄清楚的东西。一旦人工智能被弄清楚，它可能看起来就不再那么智能了。然而，结合深度学习的 Q 学习仍然是一个令人惊叹的话题。观察它学会玩一个新游戏，确实是一件令人敬畏的事情。\n\
