  完整的脚本清单（我将其命名为 `jasonTest.py`）如下所示，也可从本书的配套网站获取。我在清单之后添加了一些解释性注释。


  ```

  # 为 fashion mnist 数据集使用双倍滤波器的模型

  from numpy import mean

  from numpy import std

  from matplotlib import pyplot

  from sklearn.model_selection import KFold

  from keras.datasets import fashion_mnist

  from keras.utils import to_categorical

  from keras.models import Sequential

  from keras.layers import Conv2D

  from keras.layers import MaxPooling2D

  from keras.layers import Dense

  from keras.layers import Flatten

  from keras.optimizers import SGD

  # 加载训练和测试数据集

  def load_dataset():

  # 加载数据集

  (trainX, trainY), (testX, testY) = fashion_mnist.load_data()

  # 重塑数据集为单通道

  trainX = trainX.reshape((trainX.shape[0], 28, 28, 1))

  testX = testX.reshape((testX.shape[0], 28, 28, 1))

  # 对目标值进行独热编码

  trainY = to_categorical(trainY)

  testY = to_categorical(testY)

  return trainX, trainY, testX, testY

  # 缩放像素值

  def prep_pixels(train, test):

  # 将整数转换为浮点数

  train_norm = train.astype(''float32'')

  test_norm = test.astype(''float32'')

  # 归一化到 0-1 范围

  train_norm = train_norm / 255.0

  test_norm = test_norm / 255.0

  # 返回归一化后的图像

  return train_norm, test_norm

  # 定义 cnn 模型

  def define_model():

  model = Sequential()

  model.add(Conv2D(64, (3, 3), padding="same", activation="relu", kernel_initializer="he_uniform",
  input_shape=(28, 28, 1)))

  model.add(MaxPooling2D((2, 2)))

  model.add(Flatten())

  model.add(Dense(100, activation="relu", kernel_initializer="he_uniform"))

  model.add(Dense(10, activation="softmax"))

  # 编译模型

  opt = SGD(lr=0.01, momentum=0.9)

  model.compile(optimizer=opt, loss="categorical_crossentropy", metrics=[''accuracy''])

  return model

  # 使用 k 折交叉验证评估模型

  def evaluate_model(dataX, dataY, n_folds=5):

  scores, histories = list(), list()

  # 准备交叉验证

  kfold = KFold(n_folds, shuffle=True, random_state=1)

  # 枚举分割

  for train_ix, test_ix in kfold.split(dataX):

  # 定义模型

  model = define_model()

  # 选择训练和测试的行

  trainX, trainY, testX, testY = dataX[train_ix], dataY[train_ix], dataX[test_ix],
  dataY[test_ix]

  # 拟合模型

  history = model.fit(trainX, trainY, epochs=10, batch_size=32, validation_data=(testX,
  testY), verbose=0)

  # 评估模型

  _, acc = model.evaluate(testX, testY, verbose=0)

  print(''> %.3f'' % (acc ∗ 100.0))

  # 追加分数

  scores.append(acc)

  histories.append(history)

  return scores, histories

  # 绘制诊断学习曲线

  def summarize_diagnostics(histories):

  for i in range(len(histories)):

  # 绘制损失

  pyplot.subplot(211)

  pyplot.title(''交叉熵损失'')

  pyplot.plot(histories[i].history[''loss''], color="blue", label="训练")

  pyplot.plot(histories[i].history[''val_loss''], color="orange", label="测试")

  # 绘制准确率

  pyplot.subplot(212)

  pyplot.title(''分类准确率'')

  pyplot.plot(histories[i].history[''acc''], color="blue", label="训练")

  pyplot.plot(histories[i].history[''val_acc''], color="orange", label="测试")

  pyplot.show()

  # 总结模型性能

  def summarize_performance(scores):

  # 打印摘要

  print(''准确率: 均值=%.3f 标准差=%.3f, n=%d'' % (mean(scores)∗100, std(scores)∗100, len(scores)))

  # 结果的箱线图

  pyplot.boxplot(scores)

  pyplot.show()

  # 运行评估模型的测试框架

  def run_test_harness():

  # 加载数据集

  trainX, trainY, testX, testY = load_dataset()

  # 准备像素数据

  trainX, testX = prep_pixels(trainX, testX)

  # 评估模型

  scores, histories = evaluate_model(trainX, trainY)

  # 学习曲线

  summarize_diagnostics(histories)

  # 总结估计性能

  summarize_performance(scores)

  # 入口点，运行测试框架

  run_test_harness()

  ```




  该脚本使用 k 折交叉验证作为模型评估的一部分。在此例中，k 等于 5。如果你需要复习这个概念，我建议你回顾一下第 1 章，我在那里讨论了 k 折交叉验证。Jason
  使用 k 折交叉验证本质上会执行 5 个周期，你将在结果屏幕中看到这一点。此外，每个周期的单独结果都存储在一个名为 `histories` 的列表中。当生成性能图时，会使用这个列表。


  Jason 还使用了一个测试框架结构来安排所有模块的调用方式。我个人很喜欢这种风格，并会向任何希望创建可理解且可维护的模块化软件的人推荐它。以模块化方式编写软件的一个优点是，模块之间的解耦相对容易，从而使它们彼此独立。因此，你对某个特定模块所做的任何更改都不会影响其他模块。这种编程风格是软件设计原则——*高内聚，低耦合*——的一个绝佳范例。该原则意味着，软件的编写应使每个模块能做好一两件事（*高内聚*），并且不过分依赖其他模块（*低耦合*）。遵循此原则编写的软件往往更易于理解，对变更的适应性更强，也更易于维护。


