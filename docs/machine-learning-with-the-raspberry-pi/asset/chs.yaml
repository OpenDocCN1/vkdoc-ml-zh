- "# 7. 使用 ANN 和 CNN 进行预测\n\n在前面的章节中，我反复演示了 ANN 和 CNN 如何对包括手写数字和衣物在内的各种物体进行分类。在本章中，我将探讨\
  \ ANN 和 CNN 如何预测结果。我多次注意到，深度学习从业者常常混淆分类和预测。这是可以理解的，因为这些任务紧密相连。例如，当面对一张未知图像时，CNN\
  \ 会尝试将其识别为它被训练识别的类别之一。这显然是一个分类过程。然而，如果从更广阔的视角来看待这个过程，你可以说 CNN 的任务是预测该图像代表什么。我选择采用更狭隘的视角，并限制我对预测的解释，至少就\
  \ ANN 和 CNN 而言，将其限定为以下定义：\n\n*预测指的是深度学习算法在数据集上训练后，当应用新数据来预测特定结果的可能性时所产生的输出。*\n\n\
  “预测”这个词也可能产生误导。在某些情况下，它确实意味着预测未来的结果，例如当你使用深度学习来确定营销活动中的下一个最佳行动时。在其他情况下，预测与判断一笔已经发生的交易是否为欺诈有关。在这种情况下，交易已经发生，算法正在对其是否合法进行有根据的猜测。我的初步演示非常简单，当\
  \ ANN 面对一组事实时，它将做出二元选择。这个选择是：所应用的记录是否属于某个类别。当我接下来进行演示时，最后这句话会变得非常清晰。\n\n## 皮马印第安人糖尿病演示\n\
  \n皮马印第安人糖尿病项目是深度学习学生经常研究的另一个经典问题。这是一个极好的案例研究，展示了当 ANN 在历史数据集上经过充分训练后，如何基于输入的记录进行预测。\n\
  \n### 皮马印第安人糖尿病研究的背景\n\n糖尿病是一组代谢紊乱疾病，其特征是血糖水平长期高于正常值。糖尿病是由于体内胰岛素分泌不足或身体细胞对胰岛素反应不当引起的。前一种糖尿病原因也称为\
  \ 1 型糖尿病或胰岛素依赖型糖尿病，后一种称为 2 型糖尿病或非胰岛素依赖型糖尿病。妊娠期糖尿病是第三种类型的糖尿病，指未患糖尿病的女性在怀孕期间出现高血糖水平。糖尿病对女性尤其不利，因为它可能影响母亲及其未出生的孩子。患有糖尿病的女性发生心脏病、流产或生出有先天缺陷婴儿的可能性更高。\n\
  \n自 1965 年以来，由于皮马族女性糖尿病发病率高，包含亚利桑那州凤凰城附近皮马印第安女性信息的糖尿病数据一直受到持续研究。该数据集最初由美国国家糖尿病、消化和肾脏疾病研究所发布，包含与年龄大于\
  \ 20 岁的女性相关的诊断测量数据。它包含了 768 名女性的信息，其中 268 名女性被诊断患有糖尿病。可用信息包括八个变量，详见表 7-1。数据集中的响应变量是一个二元分类器“结果”，用于指示该人是否被诊断患有糖尿病。\n\
  \n表 7-1\n\n皮马印第安人糖尿病研究中的八个因素\n\n| 变量名 | 数据类型 | 变量描述 |\n| --- | --- | --- |\n| Pregnancies\
  \ | 整数 | 怀孕次数 |\n| Glucose | 整数 | 口服葡萄糖耐量试验中 2 小时的血浆葡萄糖浓度 |\n| BloodPressure | 整数\
  \ | 舒张压 |\n| SkinThickness | 整数 | 三头肌皮褶厚度 |\n| Insulin | 整数 | 2 小时血清胰岛素（μU/ml） |\n\
  | BMI | 数值 | 身体质量指数 |\n| DiabetesPedigreeFunction | 数值 | 亲属糖尿病史的综合指标，以及这些亲属与受试者的遗传关系\
  \ |\n| Outcome | 整数 | 是否发生糖尿病 |\n\n\n\n### 准备数据\n\n首先需要下载数据集。该数据集可从多个网站获取，我使用的是以下网址：\n\
  \n`www.kaggle.com/kumargh/pimaindiansdiabetescsv`\n\n下载的文件是压缩包格式。解压后，我将文件重命名为 `diabetes.csv`，以便于记忆和保持简洁。\n\
