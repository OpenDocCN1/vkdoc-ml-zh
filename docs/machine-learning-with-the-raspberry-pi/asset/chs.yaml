- "# 1. 树莓派（RasPi）机器学习（ML）入门\n\n本章将向您介绍树莓派和机器学习。首先讨论树莓派，这将帮助您了解用于运行本书所有演示的硬件平台。随后是机器学习的入门讨论，这将为您提供一个框架，以理解机器学习的本质，以及为什么它是一个如此令人兴奋且快速发展的研究领域。\n\
  \n## 树莓派简介\n\n您需要使用树莓派来运行本书的演示。在接下来的几节中，我将向您展示如何将树莓派 3 Model B 或 B+ 设置并配置为工作站，以运行各种机器学习演示所需的脚本和程序。图\
  \ 1-1 展示了本书中使用的树莓派 3 Model B+。\n\n![../images/482214_1_En_1_Chapter/482214_1_En_1_Fig1_HTML.png](img/482214_1_En_1_Fig1_HTML.png)\n\
  \n图 1-1\n\n树莓派 3 Model B+\n\n树莓派 3 Model B 和 B+ 之间存在一些差异。它们基本相同，只是 B+ 的处理器时钟速度略有提升，并且与\
  \ B 型号相比，无线功能有所改进。如果您使用 B 型号而不是 B+ 型号，这些改进都不会对运行本书的项目产生重大影响。\n\n我不会讨论树莓派单板计算机的构成，因为许多现有的书籍和博客已经充分涵盖了这一点。如前所述，我在工作站配置中使用了树莓派\
  \ 3 Model B+。这种设置是将树莓派与 USB 键盘、USB 鼠标和 HDMI 显示器连接。在我的设置中，树莓派由 2.2A、5V 电源供电，并带有微型\
  \ USB 连接器。\n\n树莓派不使用机械磁盘驱动器来实现包含操作系统（OS）的文件系统。所有最近的树莓派版本都依赖可插拔的微型 SD 卡作为辅助存储。虽然可以将传统磁盘驱动器连接到树莓派，但它只能作为辅助存储设备，而不能作为操作系统的主存储或可引导分区。接下来，我将向您展示如何下载操作系统并将其安装到微型\
  \ SD 卡上，以使树莓派能够作为功能性的机器学习微控制器。\n\n毫无疑问，启动和运行的最简单方法是购买预编程的微型 SD 卡。此类卡即插即用，只需进行配置以匹配您的特定工作站配置，包括您的\
  \ WiFi 网络。WiFi 配置过程将在后面的章节中讨论，但首先，如果您愿意，我想讨论如何创建您自己的微型 SD 卡。\n\n要加载的微型 SD 卡软件称为\
  \ Raspbian 镜像，可从许多在线网站免费获取，我推荐的网站是树莓派基金会网站 [raspberrypi.​org](http://raspberrypi.org/)。最新的操作系统镜像始终可从网站的“下载”部分获取。您可以下载两种类型的操作系统镜像。第一种类型名为\
  \ NOOBS，是“全新开箱即用软件”的缩写。NOOBS 有两个版本可用。一个版本名为 NOOBS，另一个版本名为 NOOBS Lite。在撰写本文时，这两个版本均标识为\
  \ v3.0.0。NOOBS 有一个易于使用的操作系统安装程序，其中包含 Raspbian 操作系统以及另一个名为 LibreELEC 的流行操作系统。此外，NOOBS\
  \ 版本还提供了一系列备选操作系统，这些系统随后会从互联网下载并安装。NOOBS Lite 包含相同的操作系统安装程序，但没有预装 Raspbian，也没有 LibreELEC\
  \ 选项。但是，此版本提供相同的操作系统选择菜单，允许下载和安装 Raspbian 及其他操作系统镜像。\n\nNOOBS 和 NOOBS Lite 镜像只是文件和子目录的集合，可以使用\
  \ BitTorrent 应用程序下载，也可以直接作为原始 Zip 文件下载。BitTorrent 和 Zip 下载的大小约为 1.2 GB。解压后的镜像大小为\
  \ 1.36 GB，但最终安装后的大小超过 4 GB。这意味着您至少需要使用 8 GB 的微型 SD 卡来容纳最终的镜像。但是，为了复现本书中的所有机器学习演示，我强烈建议您至少使用\
  \ 16 GB、Class 10 的微型 SD 卡，以确保有充足的存储空间，并最大化运行中树莓派的数据吞吐量。\n\n第二种镜像类型是直接的操作系统下载。当前可用的镜像是代号为\
  \ Stretch 的 Raspbian Linux 发行版。此 Raspbian 版本可以使用 BitTorrent 或作为 Zip 文件下载，最终镜像大小与\
  \ NOOBS 镜像相似。\n\n下载镜像后，必须配置微型 SD 卡。我将只讨论直接的 Raspbian 下载类型，因为我相信本书的读者在基本计算机操作以及树莓派方面都有足够的经验，因此他们会绝大多数选择使用直接下载的方法。\n\
  \n\n\n\n### 将 Raspbian 镜像写入 micro SD 卡\n\n在写入镜像之前，无需格式化 micro SD 卡。这部分流程由将镜像写入存储卡的应用程序自动完成。你只需根据主机电脑设置合适的应用程序即可。对于\
  \ Windows 机器，我强烈推荐使用 Win32DiskImager，可从以下地址获取：\n\n[`https://sourceforge.net/projects/win32diskimager/files/latest/download`](https://sourceforge.net/projects/win32diskimager/files/latest/download)\n\
  \n下载的是一个 Zip 文件，使用前需要解压。然后运行该应用程序，选择磁盘镜像所在位置，并选择 micro SD 卡的逻辑盘符。图 1-2 展示了我在 Windows\
  \ 机器上将 Raspbian Stretch 版本写入 micro SD 卡时的配置界面。\n\n![../images/482214_1_En_1_Chapter/482214_1_En_1_Fig2_HTML.jpg](img/482214_1_En_1_Fig2_HTML.jpg)\n\
  \n图 1-2\n\nWin32DiskImager 截图\n\n如果你使用的是 Mac，我推荐使用 Etcher 程序来写入磁盘镜像。可从 [`https://etcher.io/`](https://etcher.io/)\
  \ 获取。该应用程序的功能与 Win32DiskImager 类似。图 1-3 是在我的 MacBook Pro 上运行该程序的截图。\n\n![../images/482214_1_En_1_Chapter/482214_1_En_1_Fig3_HTML.jpg](img/482214_1_En_1_Fig3_HTML.jpg)\n\
  \n图 1-3\n\nEtcher 截图\n\n将操作系统镜像写入 micro SD 卡后，接下来必须进行配置。我将配置过程分为两个部分。第一部分涉及我认为是强制性的配置，即如果不进行这些配置，操作系统就无法按你期望的方式运行。第二部分配置涉及对已进行广泛调整的操作系统进行“微调”，以满足你的特定需求。\n\
  \n### 注意\n\nRasPi 的配置过程是动态且不断演进的。这句话的意思是，以下说明虽然在撰写本文时适用，但当你尝试复现这些步骤时可能不再适用。这仅仅是由开源软件的性质决定的。不过，我相信无论采用何种流程，它们都会清晰且易于遵循。\n\
  \n#### 强制配置\n\n图 1-4 显示了 RasPi 启动后的初始屏幕。\n\n![../images/482214_1_En_1_Chapter/482214_1_En_1_Fig4_HTML.jpg](img/482214_1_En_1_Fig4_HTML.jpg)\n\
  \n图 1-4\n\n初始配置截图\n\n你必须按照图中的提示点击“下一步”按钮开始配置过程。随后会立即出现图 1-5，显示国家、语言和时区的默认设置。\n\n\
  ![../images/482214_1_En_1_Chapter/482214_1_En_1_Fig5_HTML.jpg](img/482214_1_En_1_Fig5_HTML.jpg)\n\
  \n图 1-5\n\n默认的***设置国家***对话框\n\n至少选择正确的国家和语言对你来说非常重要，否则由于物理键盘的设置方式与你想要输入的字符之间存在冲突，你将很难输入任何脚本或程序。时区菜单也会自动调整，以反映所选国家可用的时区。\n\
  \n图 1-6 显示了我做出特定选择后的对话框。\n\n![../images/482214_1_En_1_Chapter/482214_1_En_1_Fig6_HTML.jpg](img/482214_1_En_1_Fig6_HTML.jpg)\n\
  \n图 1-6\n\n自定义的***设置国家***对话框\n\n点击“下一步”按钮将弹出**更改密码**对话框，如图 1-7 所示。\n\n![../images/482214_1_En_1_Chapter/482214_1_En_1_Fig7_HTML.jpg](img/482214_1_En_1_Fig7_HTML.jpg)\n\
  \n图 1-7\n\n***更改密码***对话框\n\n更改默认密码 `raspberry`（这很可能广为人知）应能提高你系统的安全性。这个选择完全取决于你，坦白说，这对复现本书的任何演示都没有影响。你只需要记住密码，否则你将需要重新安装一个新的镜像。我认为在\
  \ Raspbian 操作系统中没有简单的方法来恢复遗忘的密码。如果你选择不更改密码，只需点击“下一步”按钮，**选择 WiFi 网络**对话框就会出现。图 1-8\
  \ 显示了我点击按钮后出现的对话框。\n\n![../images/482214_1_En_1_Chapter/482214_1_En_1_Fig8_HTML.jpg](img/482214_1_En_1_Fig8_HTML.jpg)\n\
  \n图 1-8\n\n***选择 WiFi 网络***对话框\n\n你需要点击相应的 WiFi 网络 SSID 以建立 WiFi 通信链路。另一个对话框会出现，提示你按下物理路由器上的按钮或输入与所选\
  \ WiFi SSID 关联的密码。出于明显的安全原因，我选择不显示这个特定的对话框。点击“下一步”按钮将弹出**检查更新**对话框，如图 1-9 所示。\n\n\
  ![../images/482214_1_En_1_Chapter/482214_1_En_1_Fig9_HTML.jpg](img/482214_1_En_1_Fig9_HTML.jpg)\n\
  \n图 1-9\n\n***检查更新***对话框\n\n如果你没有设置 WiFi 连接，则无法检查更新。我实际上不确定如果没有建立可用的 WiFi 链路，这个对话框是否会出现。假设你确实设置了\
  \ WiFi 链路，那么点击“下一步”按钮将导致 RasPi 连接到互联网，并检查新镜像中包含的当前已安装软件的状态。但是，你不需要在配置的这个阶段运行检查，因为我稍后会向你展示如何使用终端窗口命令进行更新。选择权在你。实际上，两者都做也无害，只是会在配置过程中花费你一些额外时间。如果你想使用手动更新过程，只需点击“跳过”按钮；否则，点击“下一步”按钮。图\
  \ 1-10 显示了我点击“下一步”按钮后**检查更新**对话框的变化。\n\n![../images/482214_1_En_1_Chapter/482214_1_En_1_Fig10_HTML.jpg](img/482214_1_En_1_Fig10_HTML.jpg)\n\
  \n图 1-10\n\n活跃的***检查更新***对话框\n\n活动条将保持活跃状态几分钟，具体取决于检测到多少更新。一旦更新完成，你会看到一个信息框，告知你配置过程已接近完成，你需要点击“重启”按钮来完成该过程。我建议你这样做，并且如果你更改了密码，不要忘记输入你的新密码。\n\
  \n我现在建议你在终端窗口中输入以下命令来检查你的 WiFi 连接状态：\n\n```\nIfconfig\n```\n\n图 1-11 显示了在我的 RasPi\
  \ 系统上输入此命令的结果。\n\n![../images/482214_1_En_1_Chapter/482214_1_En_1_Fig11_HTML.jpg](img/482214_1_En_1_Fig11_HTML.jpg)\n\
  \n图 1-11\n\nifconfig 命令显示\n\n你应该能在 `wlan0` 部分看到，家庭 WiFi 路由器为 RasPi 分配了一个本地 IP 地址\
  \ `192.168.0.6`。此分配确认了 RasPi 能够连接到互联网。检查你的家庭路由器是否设置为 DHCP，以防你看到的 IP 地址与图中所示不同。\n\
  \n\n\n#### 可选配置\n\n可选配置过程使用一个名为 `raspi-config` 的实用工具。该工具已包含在初始下载的镜像中。您可以通过打开终端窗口并输入以下命令来运行\
  \ `raspi-config` 实用工具：\n\n```\nsudo raspi-config\n```\n\n图 1-12 展示了 `raspi-config`\
  \ 实用工具的启动界面。\n\n![../images/482214_1_En_1_Chapter/482214_1_En_1_Fig12_HTML.jpg](img/482214_1_En_1_Fig12_HTML.jpg)\n\
  \n图 1-12\n\n`raspi-config` 启动界面\n\n从菜单中选择“接口选项”（Interfacing Options）后，将出现如图 1-13\
  \ 所示的子菜单。\n\n![../images/482214_1_En_1_Chapter/482214_1_En_1_Fig13_HTML.jpg](img/482214_1_En_1_Fig13_HTML.jpg)\n\
  \n图 1-13\n\n接口选项菜单\n\n如图所示，该菜单包含八个选项。您需要启用哪些选项，取决于您在 RasPi 系统中使用的设备类型。我建议启用以下选项，以匹配本书中讨论的演示和步骤：\n\
  \n*   摄像头（Camera）\n*   SSH\n*   SPI\n*   I2C\n*   串口（Serial）\n*   单总线（1-Wire）\n\n\
  您可以随时通过重新运行 `raspi-config` 实用工具来轻松添加或删除接口选项。无论如何，添加一个接口选项只会略微增加整个操作系统的大小。另请注意，启用某个接口仅会调用该特定设备的相关驱动程序。\n\
  \n您需要再次重启 RasPi 以完成这些可选配置的选择。在终端窗口中输入以下命令来重启计算机：\n\n```\nsudo reboot\n```\n\n至此，您已成功设置并配置了您的\
  \ RasPi 系统。接下来，您需要更新和升级您的系统，以确保安装了最新的 Raspbian 操作系统软件。\n\n### 更新和升级 Raspbian 发行版\n\
  \n如前所述，Raspbian Linux 发行版一直在不断改进。一旦建立互联网连接，确保您拥有最新更新和升级的发行版就变得非常简单。在终端窗口中输入以下命令来更新已安装的操作系统：\n\
  \n```\nsudo apt-get update\n```\n\n更新操作会更改内部系统的软件包列表，使其与当前的在线软件包列表匹配。如果已安装的软件包已过时或陈旧，此操作实际上并不会更改它们。这些更改通过以下命令在终端窗口中执行：\n\
  \n```\nsudo apt-get upgrade\n```\n\n如果最初安装的发行版不是太旧，更新过程会相当快。但是，如果已安装了大量过时的软件包，升级过程可能会花费相当长的时间。\n\
  \n请记住，务必先更新再升级。本书中的所有项目均使用已更新和升级的 Stretch Raspbian 发行版创建。我发现，如果不进行更新和升级，有时会导致一些奇怪的错误和系统故障，这些故障出乎意料且令人费解。\n\
  \n在安装和配置过程的这个阶段，您应该拥有一个功能完整的 RasPi 系统。在进入机器学习讨论之前，我需要在此介绍虚拟 Python 环境的概念。\n\n####\
  \ Python 虚拟环境\n\n本节回答两个问题：\n\n什么是 Python 虚拟环境？\n\n为什么需要它们？\n\n我将先回答第二个问题。与许多类似的面向对象语言一样，Python\
  \ 依赖许多支持库和例程才能运行。在 Python 中，这些库被称为依赖项，并根据其来源存储在两个目录之一中。来源是指那些被认为是 Linux 内核必需或核心的库存储在系统包（System-packages）目录中。所有其他库，尽管它们可能对\
  \ Python 的正常运行至关重要，但都存储在站点包（Site-packages）目录中。每当发布新的 Python 语言修订版时，系统包目录都会根据需要更新和修改，以支持最新的修订版。因此，该目录中只存储了每个必要系统库的一个版本。但站点包目录的情况并非如此。这是因为用户通常会安装所需的软件以及该软件所需的任何及所有库或依赖项。仅仅因为多次软件安装，站点包目录中完全可能存在同一个依赖项的一个或多个版本。由于\
  \ Linux 仅根据依赖项的名称进行安装，而忽略任何版本检查，因此问题很快就会出现。项目 A 可能需要软件库 X 的版本 1，而项目 B 可能需要软件库 X\
  \ 的版本 2。Linux 无法消除版本不一致的问题，导致其中一个或两个项目都无法正常运行。Python 虚拟环境正是为了消除这个问题而设计的。\n\nPython\
  \ 虚拟环境的主要目的是为每个 Python 项目创建一个隔离的环境。这意味着每个项目都将拥有自己的依赖项，而与其他项目所需的依赖项无关。\n\n为项目 A 和项目\
  \ B 分别创建独立的虚拟环境将消除版本不一致的问题。每个环境都可以独立于任何其他项目，依赖所需的任何版本的软件 X。\n\n虚拟环境的一个优点是，除了物理内存的限制外，您创建的环境数量没有限制。回答前面提出的第一个问题很简单。Python\
  \ 虚拟环境只是一组包含一些脚本和符号链接的层级目录，仅此而已。创建它们并不涉及任何黑魔法或巫术。我相信一旦您开始使用它们，就不会再回头。许多开发人员经常使用它们，从而为自己节省了在尝试排查由意外的依赖项问题引起的未知错误时可能浪费的大量时间和精力。\n\
  \n\n\n#### 安装 Python 虚拟环境\n\n在按照以下说明操作之前，请确保 Python 3 已正确安装并正常运行。同时，请确保已按照本章前述内容更新并升级了\
  \ Raspbian Stretch Linux 发行版。\n\n本过程包含六个步骤。请按顺序执行，以成功创建一个用于处理数据模型的 Python 虚拟环境：\n\
  \n1.  安装 pip，这是一个 Python 包管理器工具。该工具与高级打包工具（apt）非常相似，但使用独立的发行版仓库。输入以下命令：\n\n    ```\n\
  \    wget https://bootstrap.pypa.io/get-pip.py\n    sudo python3 get-pip.py\n  \
  \  ```\n\n    **注意** 在撰写本文时，最新的 pip 版本为 19.0.3。\n\n2.  安装 `virtualenv` 和 `virtualenvwrapper`\
  \ 工具。`virtualenv` 工具用于在 Python 3 中创建虚拟环境。`virtualenvwrapper` 工具则用于在 Python 语言与将在该环境中执行的\
  \ Python 代码之间建立链接。输入以下命令：\n\n    ```\n    sudo pip install virtualenv virtualenvwrapper\n\
  \    sudo rm -rf ~/get-pip.py ~/.cache/pip\n    ```\n\n3.  必须编辑位于主目录中名为 .profile\
  \ 的隐藏文件，以包含一些初始化数据。我建议你使用 nano 编辑器，并按照如下所示追加数据：\n\n    ```\n    cd ~\n    sudo nano\
  \ .profile\n    ```\n\n    要追加的数据应放在现有文件的最后一行之后：\n\n    ```\n    # virtualenv and\
  \ virtualenvwrapper\n    export WORKON_HOME=$HOME/.virtualenvs\n    export VIRTUALENVWRAPPER_PYTHON=/usr/bin/python3\n\
  \    source /usr/local/bin/virtualenvwrapper.sh\n    ```\n\n    或者，你也可以直接在命令行提示符下使用以下命令输入初始化数据：\n\
  \n    ```\n    echo -e \"\\n# virtualenv and virtualenvwrapper\" >> ~/.profile\n\
  \    echo \"export WORKON_HOME=$HOME/.virtualenvs\" >> ~/.profile\n    echo \"export\
  \ VIRTUALENVWRAPPER_PYTHON=/usr/bin/python3\" >> ~/.profile\n    echo \"source /usr/local/bin/virtualenvwrapper.sh\"\
  \ >> ~/.profile\n    ```\n\n4.  现在必须加载 `~./profile` 文件。`source` 命令用于将指定文件中包含的函数加载到当前\
  \ shell 中执行。\n\n    ```\n    source ~/.profile\n    ```\n\n### 注意\n\n首次运行上述命令后，你应该会看到如图\
  \ 1-14 所示的文本。\n\n![../images/482214_1_En_1_Chapter/482214_1_En_1_Fig14_HTML.jpg](img/482214_1_En_1_Fig14_HTML.jpg)\n\
  \n图 1-14\n\n初始 source 命令结果\n\n![../images/482214_1_En_1_Chapter/482214_1_En_1_Fig16_HTML.jpg](img/482214_1_En_1_Fig16_HTML.jpg)\n\
  \n图 1-16\n\n`workon` 命令结果\n\n1.  这一步实际上是使用步骤 2 中安装的 `virtualenv` 和 `virtualenvwrapper`\
  \ 工具来生成一个虚拟环境。你需要为环境提供一个唯一的名称。本示例中使用的名称是 py3cv4_1。如果你计划生成多个环境，则可以使用诸如 py3cv4_1、py3cv4_2、py3cv4_3\
  \ 等命名方案。名称 py3cv4_1 表示该虚拟环境使用 Python 3，并且还包含 OpenCV 4 软件包。此外，强烈建议记录创建每个环境的原因，否则你很快就会感到困惑。输入以下命令以生成\
  \ py3cv4_1 Python 虚拟环境：\n\n    ```\n    mkvirtualenv py3cv4_1 -p python3\n    ```\n\
  \n    创建虚拟环境大约需要 40 秒。图 1-15 显示了运行此命令的结果。你应该会注意到常规命令行提示符前添加了 `(py3cv4_1)`。这表明当前已激活一个虚拟环境。\n\
  \n    ![../images/482214_1_En_1_Chapter/482214_1_En_1_Fig15_HTML.jpg](img/482214_1_En_1_Fig15_HTML.jpg)\n\
  \n    图 1-15\n\n    `mkvirtualenv` 命令结果\n\n    你可以通过直接关闭终端窗口来轻松关闭 py3cv4_1 虚拟环境。我建议你这样做。\n\
  \n2.  打开一个新的终端窗口，以验证你可以启动 py3cv4_1 虚拟环境。输入以下命令：\n\n    ```\n    source ~/.profile\n\
  \    workon py3cv4_1\n    ```\n\n    `workon` 命令包含在 `virtualenvwrapper` 软件包中。此命令允许轻松快速地启动任何\
  \ Python 虚拟环境。图 1-16 显示了上述命令的结果。\n\n此图的出现将确认你已拥有一个可用的虚拟环境，并准备好继续执行创建数据模型框架的后续步骤。\n\
  \n#### 安装依赖项\n\n下一个演示需要安装多个软件包作为支持。某些软件包已预装在原始下载的镜像中，而其他软件包则必须显式安装。以下命令将安装所有软件包。如果软件包已安装，你将收到一条信息提示；否则，将进行完整安装。这些命令需要一些时间，因为软件包可能很大且安装过程复杂：\n\
