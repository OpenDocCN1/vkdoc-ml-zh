  \n*   值：< 5\n\n*   实例数量 = 4\n\n*   值 >=5 且为正类的实例数量 = 3\n\n*   值 >= 5 且为负类的实例数量 =\
  \ 1\n\n![$$ {\\boldsymbol{Gini}}_{\\boldsymbol{A}}\\left(&lt;\\mathbf{5}\\right)=\\\
  mathbf{1}-{\\left(\\frac{\\mathbf{3}}{\\mathbf{4}}\\right)}^{\\mathbf{2}}-{\\left(\\\
  frac{\\mathbf{1}}{\\mathbf{4}}\\right)}^{\\mathbf{2}}=\\mathbf{0.375} $$](img/482214_1_En_2_Chapter_TeX_Equal.png)\n\
  \n加权求和得到\n\n![$$ {\\boldsymbol{Gini}}_{\\boldsymbol{A}}=\\frac{\\mathbf{12}}{\\\
  mathbf{16}}\\ast \\mathbf{0.486}+\\frac{\\mathbf{4}}{\\mathbf{16}}\\ast \\mathbf{0.375}=\\\
  mathbf{0.458} $$](img/482214_1_En_2_Chapter_TeX_Equam.png)\n\n以类似方式计算其余属性得到\n\n\
  ![$$ {\\boldsymbol{Gini}}_{\\boldsymbol{B}}=\\mathbf{0.335} $$](img/482214_1_En_2_Chapter_TeX_Equan.png)\n\
  \n![$$ {\\boldsymbol{Gini}}_{\\boldsymbol{C}}=\\mathbf{0.200} $$](img/482214_1_En_2_Chapter_TeX_Equao.png)\n\
  \n![$$ {\\boldsymbol{Gini}}_{\\boldsymbol{D}}=\\mathbf{0.273} $$](img/482214_1_En_2_Chapter_TeX_Equap.png)\n\
  \n使用基尼指数时，初始分割点始终取最小值。基于计算出的指数得到的最终决策树如图 2-27 所示。\n\n![../images/482214_1_En_2_Chapter/482214_1_En_2_Fig27_HTML.jpg](img/482214_1_En_2_Fig27_HTML.jpg)\n\
  \n图 2-27\n\n简单基尼指数示例的最终决策树\n\n#### 增益率\n\n增益率是信息增益的一种改进，旨在减少其对高度分支特征的偏好。该算法在选择特征时会考虑分支的数量和大小。它通过将信息增益除以分割的“固有信息”来实现归一化，固有信息定义为确定实例所属分支所需的信息量。信息增益对具有较多结果的属性存在正向偏差，这意味着信息增益算法倾向于选择具有大量不同值的属性。\n\
  \n##### 固有信息\n\n固有信息表示将数据集分割成*K*个分区所产生的潜在信息：\n\n![$$ IntrinsicInfo(D)=-{\\sum}_{k=1}^K\\\
  frac{\\mid {D}_k\\mid }{D}\\ast {\\mathit{\\log}}_2\\left(\\frac{\\mid {D}_k\\mid\
  \ }{D}\\right) $$](img/482214_1_En_2_Chapter_TeX_Equaq.png)\n\n具有高固有信息的分区在大小上应相似。少数分区包含大部分元组的数据集，其固有信息自然较低。\n\
  \n##### 增益率的定义\n\n增益率定义为\n\n![$$ GainRatio(D)=\\frac{Gain(D)}{IntrinsicInfo(D)}\
  \ $$](img/482214_1_En_2_Chapter_TeX_Equar.png)\n\n具有最大增益率的特征被选为分割特征。\n\nID3 是迭代二分器\
  \ 3（Iterative Dichotomiser 3）的缩写，是由罗斯·昆兰发明的一种用于实现增益率属性选择度量（ASM）的算法。罗斯后来发明了 C4.5\
  \ 算法，该算法是对 ID3 的改进，目前大多数使用增益率算法的机器学习系统都采用此算法。需要注意的是，在 C4.5 算法中，术语 *SplitInfo* 用于表示\
  \ *IntrinsicInfo*。除了这一术语上的差异外，基本的增益率算法保持不变。\n\n此处不再提供增益率的示例，仅仅是因为这个补充说明已经过于冗长，而且如果你已经读到这里，很可能对属性选择度量（ASM）过程已经有了相当不错的理解。\n\
  \n\n\n### 使用 scikit-learn 进行决策树分类器演示\n\n本次决策树演示将使用机器学习社区中一个经典的数据集，名为皮马印第安人糖尿病数据集。该数据集可以\
  \ CSV 格式从以下网址下载：\n\n```\nwww.kaggle.com/uciml/pima-indians-diabetes-database#diabetes.csv\n\
  ```\n\n该数据集最初来自美国国立糖尿病、消化和肾脏疾病研究所。本次演示的目标是根据数据集中包含的某些诊断测量指标，对患者是否患有糖尿病进行诊断性预测。从更大的数据库中选取这些实例时，施加了若干限制条件。具体来说，这里的所有患者都是至少\
  \ 21 岁的皮马印第安人血统的女性。\n\n下载的 CSV 文件是压缩包，使用前必须解压。此外，你必须删除文件的第一行，因为它包含字符串类型的列标题描述。保留这一行会导致预测函数失败，因为字符串内容无法转换为浮点类型。我建议使用任何能够加载\
  \ CSV 文件的电子表格应用程序。我碰巧使用了微软的 Excel 程序，但任何开源的 Linux 应用程序可能也能正常工作。\n\n我将分两个阶段开发 Python\
  \ 脚本，同时讨论与决策树分类器模型相关的基础方法论。第一阶段将加载所有依赖项以及 CSV 文件。还会显示 CSV 文件的头部信息，以确认加载成功。第二阶段将是构建、训练和测试决策树模型。\n\
  \n第一步是加载所需的库，其中包括来自 sklearn 软件包的 `DecisionTreeClassifier` 数据模型。该数据模型默认使用基尼 ASM 过程，但如果需要其他\
  \ ASM 过程，可以更改此设置。\n\n```\n# 加载库\nimport pandas as pd\nfrom sklearn.tree import DecisionTreeClassifier\
  \ # 导入决策树分类器\nfrom sklearn.model_selection import train_test_split # 导入 train_test_split\
  \ 函数\nfrom sklearn import metrics #导入 scikit-learn 的 metrics 模块用于计算准确率\ncol_names\
  \ = ['pregnant', 'glucose', 'bp', 'skin', 'insulin', 'bmi', 'pedigree', 'age', 'label']\n\
  ```\n\n下一步是使用 Pandas 的 read CSV 函数加载所需的皮马印第安人糖尿病数据集。确保下载的数据集与脚本位于同一当前目录下。\n\n```\n\
  # 加载数据集\npima = pd.read_csv(\"diabetes.csv\", header=None, names=col_names)\npima.head()\n\
  ```\n\n图 2-28 显示了 CSV 文件的头部部分，包含前五条记录。\n\n![../images/482214_1_En_2_Chapter/482214_1_En_2_Fig28_HTML.jpg](img/482214_1_En_2_Fig28_HTML.jpg)\n\
  \n图 2-28\n\ndiabetes.csv 头部结果\n\n下一步是将给定的列划分为两种类型的变量：因变量（目标）和自变量（特征）。\n\n```\n#将数据集拆分为特征和目标变量\n\
  feature_cols = ['pregnant', 'insulin', 'bmi', 'age','glucose','bp','pedigree']\n\
  X = pima[feature_cols] # 特征变量\ny = pima.label # 目标变量\n```\n\n模型性能要求将数据集划分为训练集和测试集。可以使用函数\
  \ `train_test_split()` 来划分数据集。必须向此方法传递三个参数，即特征、目标和测试集大小。\n\n```\n# 将数据集拆分为训练集和测试集\n\
  # 70% 训练集，30% 测试集\nX_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.3,\
  \ random_state=1)\n```\n\n下一步是从 sklearn 软件包实例化一个决策树数据模型。该模型被命名为 `clf`，并使用从原始数据集中拆分出的\
  \ 70% 的训练数据集进行训练。最后，使用模型的 `predict()` 方法，用剩余的 30% 数据集自动进行一系列预测。\n\n在存储在 `X_test`\
  \ 中的测试数据中，标签被视为要输入到 `predict()` 方法中的分类器的样本。该样本如下所示。将其作为字符串（而非浮点数）输入到 `predict()`\
  \ 方法是无效的。为了移除它，使用了 `drop()` 函数。这就是 `X_txt.drop(0)` 的返回结果，也是输入到 `predict()` 方法中的内容。\n\
  \n```\n['Pregnancies','Insulin','BMI','Age','Glucose','BloodPressure','DiabetesPedigreeFunction']\n\
  # 创建决策树分类器对象\nclf = DecisionTreeClassifier()\n# 训练决策树分类器\nclf = clf.fit(X_train,y_train)\n\
  # 预测测试数据集的响应\ny_pred = clf.predict(X_test.drop(0))\n```\n\n最后一步是衡量预测集的整体准确率。准确率是通过比较实际的测试集值与预测值来计算的。使用了\
  \ scikit-learn 包中的 `metrics` 模块来进行此准确率测量。\n\n请注意，`y_test` 变量包含标签 `'Outcome'`，它是一个字符串。为了移除它，使用了\
  \ `drop()` 函数。\n\n```\n# 模型准确率\nprint(\"Accuracy:\",metrics.accuracy_score(y_test.drop(0),\
  \ y_pred))\n```\n\n最终结果如下所示：\n\n```\nAccuracy: 0.6753246753246753\n```\n\n67.5%\
  \ 是一个合理的准确率分数。然而，可以通过调整决策树算法使用的超参数来改进它，我将在后面的章节中演示这一点。\n\n完整的脚本列表如下所示，并命名为 diabetesDT.py。该脚本可从本书的配套网站获取。\n\
  \n```\n# 加载库\nimport pandas as pd\nfrom sklearn.tree import DecisionTreeClassifier\
  \ # 导入决策树分类器\nfrom sklearn.model_selection import train_test_split # 导入 train_test_split\
  \ 函数\nfrom sklearn import metrics #导入 scikit-learn 的 metrics 模块用于计算准确率\ncol_names\
  \ = ['pregnant', 'glucose', 'bp', 'skin', 'insulin', 'bmi', 'pedigree', 'age', 'label']\n\
  # 加载数据集\npima = pd.read_csv(\"diabetes.csv\", header=None, names=col_names)\nprint(pima.head())\n\
  #将数据集拆分为特征和目标变量\nfeature_cols = ['pregnant', 'insulin', 'bmi', 'age', 'glucose',\
  \ 'bp', 'pedigree']\nX = pima[feature_cols] # 特征\ny = pima.label # 目标变量\n# 将数据集拆分为训练集和测试集\n\
  # 70% 训练集，30% 测试集\nX_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.3,\
  \ random_state=1)\n# 创建决策树分类器对象\nclf = DecisionTreeClassifier()\n# 训练决策树分类器\nclf\
  \ = clf.fit(X_train,y_train)\n# 预测测试数据集的响应\ny_pred = clf.predict(X_test.drop(0))\n\
  # 模型准确率\nprint(\"Accuracy:\",metrics.accuracy_score(y_test.drop(0), y_pred))\n```\n\
  \n\n\n#### 可视化决策树\n\nscikit-learn 的 `export_`*graphviz* 函数可用于显示决策树。此显示功能还需要 pydotplus\
  \ 库。这些库通过以下命令安装：\n\n```\npip install graphviz\npip install pydotplus\nsudo apt-get\
  \ install python-pydot\n```\n\n*export_graphviz* 函数将最终的决策树分类器文件转换为所谓的点文件（dot file）。然后，pydotplus\
  \ 应用程序将此点文件转换为 png 格式的文件，该文件可以使用系统的图像查看器应用程序显示。\n\n以下脚本名为 diabetesDT.py，可从本书的配套网站获取：\n\
  \n```\n# Load all required libraries\nimport pandas as pd\nfrom sklearn.tree import\
  \ DecisionTreeClassifier\nfrom sklearn.model_selection import train_test_split\n\
  from sklearn.tree import export_graphviz\nfrom sklearn.externals.six import StringIO\n\
  from sklearn import tree\nimport pydotplus\nimport collections\ncol_names = ['pregnant',\
  \ 'glucose', 'bp', 'skin', 'insulin', 'bmi', 'pedigree', 'age', 'label']\n# Load\
  \ dataset\npima = pd.read_csv(\"diabetes.csv\", header=None, names=col_names)\n\
  #split dataset in features and target variable\nfeature_cols = ['pregnant', 'insulin',\
  \ 'bmi', 'age', 'glucose', 'bp', 'pedigree']\nX = pima[feature_cols] # Features\n\
  y = pima.label # Target variable\n# Split dataset into training set and test set\n\
  # 70% training and 30% test\nX_train, X_test, y_train, y_test = train_test_split(X,\
  \ y, test_size=0.3, random_state=1)\n# Create Decision Tree classifer object\nclf\
  \ = DecisionTreeClassifier()\n# Train Decision Tree Classifer\nclf = clf.fit(X_train,y_train)\n\
  dot_data = tree.export_graphviz(clf, out_file=None, filled=True, rounded=True, special_characters=True,\
  \ feature_names= feature_cols, class_names=['0','1'])\ngraph = pydotplus.graph_from_dot_data(dot_data)\n\
  colors = ('turquoise', 'orange')\nedges = collections.defaultdict(list)\nfor edge\
  \ in graph.get_edge_list():\nedges[edge.get_source()].append(int(edge.get_destination()))\n\
  for edge in edges:\nedges[edge].sort()\nfor i in range(2):\ndest = graph.get_node(str(edges[edge][i]))[0]\n\
  dest.set_fillcolor(colors[i])\ngraph.write_png('tree.png')\n```\n\n您可以通过输入以下命令生成\
  \ png 格式的树图像：\n\n```\npython diabetesDT.py\n```\n\n请耐心等待，因为此命令大约需要 20 秒才能完成。脚本运行完成后，您将在显示器屏幕上看到提示符重新出现，除此之外没有任何其他内容。但是，主目录中会有一个名为\
  \ tree.png 的新图像。图 2-29 显示了此图像。\n\n![../images/482214_1_En_2_Chapter/482214_1_En_2_Fig29_HTML.jpg](img/482214_1_En_2_Fig29_HTML.jpg)\n\
  \n图 2-29\n\ntree.png\n\n我完全意识到无法阅读图像中显示的极小文本，这就是我放大了图像一小部分的原因。该部分如图 2-30 所示。\n\n\
  ![../images/482214_1_En_2_Chapter/482214_1_En_2_Fig30_HTML.jpg](img/482214_1_En_2_Fig30_HTML.jpg)\n\
  \n图 2-30\n\n树图像的放大部分\n\n在此决策树图中，每个内部节点都有一个用于分割数据的决策规则。基尼系数（Gini）指的是衡量节点不纯度的基尼比率，我在旁注中讨论过这一点。当一个节点的所有记录都属于同一类别时，该节点是纯的。这样的节点称为叶节点。\n\
  \n此脚本生成的树是未剪枝的。这种未剪枝的树基本上无法解释且不易理解。我将在下一节讨论如何通过剪枝来优化它。\n\n#### 优化决策树\n\n有三个可用的超参数，可用于优化决策树分类器的性能。它们是：\n\
  \n*   criterion：可选（默认=\"gini\"）或选择属性选择度量 – 此参数允许选择不同的 ASM。可用的标准是用于基尼指数的 \"gini\"\
  \ 和用于信息增益的 \"entropy\"。\n\n*   splitter：字符串，可选（默认=\"best\"）或分割策略 – 此参数允许选择分割策略。可用的策略是\
  \ \"best\" 选择最佳分割，以及 \"random\" 选择最佳随机分割。\n\n*   max_depth：整数或 None，可选（默认=None）或树的最大深度\
  \ – 此标准设置树的最大深度。如果为 None，则节点会一直扩展，直到所有叶子包含的样本数少于 `min_samples_split`。最大深度值较高可能会导致过拟合，而值较低则可能导致欠拟合。\n\
  \n在 scikit-learn 中，决策树分类器的优化是在实例化分类器时完成的。树的最大深度用于预剪枝。对 pimaDiabetes.py 脚本进行了修改，将树深度限制为\
  \ 3，并将 ASM 更改为 entropy。为实现此优化，对脚本进行了以下代码更改：\n\n```\n# Create Decision Tree classifer\
  \ object\nclf = DecisionTreeClassifier(criterion=\"entropy\", max_depth=3)\n```\n\
  \n重新运行此脚本，获得了新的准确率分数 `0.7705627705627706`。这个 77% 的分数优于未输入任何性能参数时获得的 67.5% 的分数。\n\
  \n还使用这些新的性能参数重新运行了 diabetesDT.py。树图被重新标记为 tree1.png，以区别于初始版本。图 2-31 显示了使用优化后的超参数生成的新树图。\n\
  \n![../images/482214_1_En_2_Chapter/482214_1_En_2_Fig31_HTML.jpg](img/482214_1_En_2_Fig31_HTML.jpg)\n\
  \n图 2-31\n\ntree1.png\n\n这个剪枝后的模型比之前的决策树图简单得多，也更容易理解。\n\n#### 决策树的优缺点\n\n##### 优点\n\
  \n*   决策树易于解释和可视化。\n\n*   它们可以轻松捕获非线性模式。\n\n*   它们需要用户进行较少的数据预处理。\n\n*   它们可用于特征工程，例如预测适合变量选择的缺失值。\n\
  \n*   决策树对数据分布没有假设，因为它们是非参数模型。\n\n##### 缺点\n\n*   它们对噪声数据敏感。由于噪声数据，它们很容易过拟合。\n\n\
  *   数据中的微小变化（或方差）可能导致不同的决策树。\n\n*   决策树可能会因不平衡的数据集而产生偏差。建议在创建决策树之前平衡数据集。\n\n"
- "# 3. 机器学习数据模型探索：第二部分\n\n本章是上一章开始的关于基本机器学习数据模型的讨论和演示的延续。我在上一章开头介绍了十种数据模型，它们是：\n\n\
  *   线性回归\n\n*   逻辑回归\n\n*   K-近邻分类器\n\n*   高斯朴素[贝叶斯](http://scholar.google.com/scholar%253Fq%253DGaussian%252BNaive%252BBayesian%2526hl%253Den%2526as_sdt%253D0%2526as_vis%253D1%2526oi%253Dscholart)\n\
  \n*   决策树分类器\n\n*   主成分分析\n\n*   线性判别分析\n\n*   支持向量机\n\n*   学习向量量化\n\n*   Bagging\
  \ 和随机森林\n\n前五种已在上一章中介绍，其余五种将在本章中介绍。请不要因为讨论顺序而推断模型之间的任何相对重要性。在每种情况下，我都会具体讨论何时以及如何使用每个模型。\n\
  \n\n\n## 主成分分析\n\n主成分分析（PCA）是一种强大的算法，用于线性变换和降维。它广泛应用于许多领域，包括计算机视觉应用和金融交易。\n\n使用\
  \ PCA 算法的主要目标是通过将大量变量转换成一个较小的变量集来降低数据维度，同时这个较小的变量集仍然包含原始大数据集中的大部分信息。简而言之，PCA 创建了更易于处理、便于数据分析且与其他机器学习算法兼容性更好的小数据集。总结来说，PCA\
  \ 的核心思想是在保留尽可能多信息的同时，减少数据集中的变量数量。PCA 还执行数据压缩功能，我将在代码解释部分对此进行描述。\n\nPCA 算法由于计算效率高，往往占用更少的内存。此外，PCA\
  \ 具有良好的可视化功能，有助于用户理解最终结果。\n\n执行 PCA 时应遵循六个步骤：\n\n1.  对数据进行标准化。\n2.  使用标准化后的数据创建协方差矩阵。\n\
  3.  利用得到的矩阵计算特征向量（主成分）及其对应的特征值。或者，也可以应用奇异值分解（SVD）。\n4.  按降序排列特征值，并选择解释数据中最大方差的 *k*\
  \ 个特征向量（特征值越大，表示该特征解释的方差越多）。\n5.  创建一个新的投影矩阵 W。\n6.  通过 W 变换原始数据集 X，以获得一个 k 维子空间\
  \ Y。\n\n我意识到上述过程中存在一些陌生且未知的术语，可能会让一些读者感到困惑甚至害怕。别担心；这些内容将在接下来的讨论和演示中得到解释和澄清。\n\n\
  ### PCA 脚本讨论\n\n本演示的第一步是加载将要使用的数据集。我将使用的数据集是经典的鸢尾花数据集，在前一章中我也用过。该数据集可从以下网站获取。文件扩展名为\
  \ data。你只需将扩展名改为 csv 即可。\n\n`https://archive.ics.uci.edu/ml/datasets/Iris`\n\n下载文件后，请务必删除包含原始列标题的第一行。如果不这样做，脚本将运行失败。\n\
  \n这个鸢尾花数据集包含了来自三个不同物种的 150 朵鸢尾花的测量数据。\n\n鸢尾花数据集中的三个类别是：\n\n1.  山鸢尾 (n = 50)\n2.\
  \  杂色鸢尾 (n = 50)\n3.  维吉尼亚鸢尾 (n = 50)\n\n每个类别中的四个特征是：\n\n1.  花萼长度 (cm)\n2.  花萼宽度\
  \ (cm)\n3.  花瓣长度 (cm)\n4.  花瓣宽度 (cm)\n\n以下是一个名为 `pcaDemo.py` 的 Python 脚本的完整清单，该脚本将完成包含可视化的完整\
  \ PCA 分析。我还根据需要为这些代码部分提供了额外的解释性注释。此脚本可从本书的配套网站获取：\n\n```\n# 导入所需库\nimport matplotlib.pyplot\
