- "# 5. 实用的深度学习 ANN 演示\n\n本章将展示几个实用的深度学习演示。只要你阅读了前一章，或者之前有过 DL 技术和概念的经验，你就能跟上这些演示。在撰写本章时，我有两个目标。第一个是清晰地展示如何完成一个完整的\
  \ ANN 项目，以产生现实且有用的结果。第二个是指出一些在 ANN 开发中常见的潜在陷阱和不切实际的假设。\n\n## 零件清单\n\n本章的演示需要标准的\
