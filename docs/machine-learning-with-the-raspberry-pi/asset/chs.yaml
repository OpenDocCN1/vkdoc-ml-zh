  ```\n# 将数据表拆分为数据 X 和类别标签 y\nX = df.ix[:,0:4].values\ny = df.ix[:,4].values\n```\n\
  \n在进行标准化之前，需要将数据拆分为名为 *X* 的属性集和名为 *y* 的类别标签集。\n\n```\nX_std = StandardScaler().fit_transform(X)\n\
  ```\n\n这段代码代表了 PCA 流程中的第一步，即对输入数据进行标准化。如果你回顾过输入数据集，你会很快意识到这些数据具有不同的量纲。标准化数据有助于最大化主成分（特征向量）的数据方差。如果不进行标准化，与取值范围为\
  \ 0 到 10 的变量相比，取值范围为 0 到 100 的变量在计算协方差时会产生过大的影响。标准化可以减少分析中引入无意偏差的任何可能性。通用的标准化公式为：\n\
  \n![$$ z=\\frac{value- mean}{standard\\ deviation} $$](img/482214_1_En_3_Chapter_TeX_Equa.png)\n\
  \n在这种情况下，所有数据都被转换到均值为 0、方差和标准差为 1 的单位尺度上。单位尺度变换通常有助于许多不同的机器学习算法获得最佳性能。\n\n```\n\
  mean_vec = np.mean(X_std, axis=0)\ncov_mat = (X_std -mean_vec).T.dot(X_std - mean_vec)\
  \ / (X_std.shape[0] - 1)\nprint('Covariance matrix \\n%s' %cov_mat)\n```\n\nPCA\
  \ 流程的第二步是实例化一个协方差矩阵。协方差矩阵是一个 *n* × *n* 的对称矩阵（其中 *n* 是维度数），其条目包含了与初始变量所有可能配对相关的所有协方差。请注意，此计算中使用的是标准化后的数据集。顺便提一下，标准化数据集的协方差矩阵等同于该数据集的相关系数矩阵。这意味着在\
  \ PCA 流程中，可以使用数据集的相关系数矩阵来代替协方差矩阵。\n\n关于协方差矩阵，有两个事实也有助于你的理解：\n\n*   正值表示两个变量同增或同减。这也被称为正相关。\n\
  \n*   负值表示一个变量增加时，另一个变量减少。这也被称为负相关。\n\n```\n    cov_mat = np.cov(X_std.T)\n    .\n\
  \    .\n    print('Eigenvalues \\n%s' %eig_vals)\n    ```\n\nPCA 流程的第三步是计算与输入数据集相关的特征向量和特征值。这些计算可以通过以下三种方式之一完成：\n\
  \n*   使用协方差矩阵\n\n*   使用相关系数矩阵\n\n*   使用奇异值分解（SVD）\n\n当属性值相似时，通常使用协方差矩阵；当属性值处于不同量纲时，则使用相关系数矩阵。然而，正如我之前解释的，标准化的协方差矩阵也等同于相关系数矩阵，所以基本上两者都可以使用。在这段代码中，使用了协方差矩阵，因为数据已经标准化，并且计算协方差矩阵比计算相关系数矩阵更容易。\n\
  \nNumPy 库使得计算特征向量和特征值变得容易。`np.linalg.eig(cov_mat)` 方法将结果作为两个列表返回，分别命名为 `eig_vecs`\
  \ 和 `eig_vals`。特征向量和特征值总是成对出现的，意味着一个向量总是对应一个值。\n\n需要认识到的一个关键点是，`eig_vecs` 就是主成分。主成分是作为原始变量的线性组合或混合而构建的新变量。这些新变量是不相关的，并且原始变量所包含的大部分信息都被压缩到了前几个主成分中。这就是为什么\
  \ PCA 常被描述为一种数据压缩算法。需要强调的重要一点是，主成分没有任何现实意义，因为它们是由原始数据集变量的线性组合构建的。从几何角度看待主成分，可以得到以下结论：\n\
  \n> *主成分代表了能够解释最大方差量的数据方向（即向量）。*\n\n一个向量所承载的方差越大，数据点沿该向量的离散程度就越大。此外，沿一个向量的离散程度越大，它所携带的信息就越多。为了简化这个概念，只需将主成分视为新的坐标轴，它们提供了观察和评估数据的最佳角度，从而使观测值之间的差异更加明显。\n\
  \n按照特征值从高到低的顺序对特征向量进行排序，就能得到按重要性排序的主成分。\n\n最后，SVD 算法是另一种计算特征向量和特征值的高效计算方法。\n\n```\n\
  eig_pairs = [(np.abs(eig_vals[i]), eig_vecs[:,i]) for i in\n.\n.\nfor i in eig_pairs:\n\
  print(i[0])\n```\n\n这是 PCA 流程的第四步，它按照特征值从高到低的顺序对特征向量进行排序，从而得到按重要性排序的主成分。特征值最低的特征向量包含关于固有数据分布的信息量最少。\n\
  \n```\ntot = sum(eig_vals)\n.\n.\nprint('Eigenvalue ratios:%s' %cum_var_exp)\n```\n\
  \n这段代码创建了一个列表，列出了每个特征向量对总体方差的累积贡献。用户应使用此列表来确定最佳的 k 值。稍后你将在结果部分看到，k = 2 的值解释了数据集中超过\
  \ 95% 的方差。这是一个很好的结果，因为数据可以很容易地进行可视化。\n\n```\n# 创建 W 矩阵\nmatrix_w = np.hstack((eig_pairs[0][1].reshape(4,1),\n\
  eig_pairs[1][1].reshape(4,1)))\nprint('Matrix W:\\n', matrix_w)\n```\n\n这段代码是第五步，它创建了最后一步所需的\
  \ **W 矩阵**。\n\n```\n# 将 X_std 数据集转换到子空间 Y\nY = X_std.dot(matrix_w)\n```\n\n这是 PCA\
  \ 流程的第六步，也是最后一步，其中标准化后的数据集被转换到一个名为矩阵 Y 的 k 维子空间中。\n\n```\nx = df.loc[:,features].values\n\
  .\n.\nplt.show()\n```\n\n这段代码创建了一个散点图，显示了数据点相对于主成分 1 和主成分 2 的分布。该图应为用户提供一种极佳的方式来可视化数据中任何潜在的、使用普通二维特征散点图无法观察到的数据模式。回想一下，原始数据集有四个特征，现在通过\
