  最后一段代码是驱动代码，用于使用 `fashion_mnist` 数据集测试新的 CNN。首先实例化一个名为 `model` 的模型对象，然后使用 Keras
  的 `fit` 函数进行训练。接着，通过调用 Keras 的 `evaluate` 方法生成一个 `scores` 元组。测试持续 10 个周期，最终语句显示
  CNN 的最终错误率。


  完整的脚本名为 `kerasFashionTest.py`，并在下方列出并附有注释。该脚本可从本书的配套网站获取。


  ```

  import numpy as np

  from keras.datasets import fashion_mnist

  from keras.models import Sequential

  from keras.layers import Dense

  from keras.layers import Dropout

  from keras.layers import Flatten

  from keras.layers.convolutional import Conv2D

  from keras.layers.convolutional import MaxPooling2D

  from keras.utils import np_utils

  from keras import backend as K

  K.set_image_dim_ordering(''th'')

  # 设置随机种子

  seed = 42

  np.random.seed(seed)

  # 加载数据集

  (train_images, train_labels),(test_images, test_labels) = fashion_mnist.load_data()

  # 将所有 28 x 28 的图像展平为 784 个元素的 numpy 输入数据向量。

  pixelNum = train_images.shape[1] * train_images.shape[2]

  train_images = train_images.reshape(train_images.shape[0],1,28,28).astype(''float32'')

  test_images = test_images.reshape(test_images.shape[0],1,28,28).astype(''float32'')

  # 将输入从 0-255 归一化到 0-1

  train_images = train_images / 255.0

  test_images = test_images / 255.0

  # 独热编码

  train_labels = np_utils.to_categorical(train_labels)

  test_labels = np_utils.to_categorical(test_labels)

  numClass = test_labels.shape[1]

  # 模型定义

  def cnn_model():

  # 创建模型

  model = Sequential()

  model.add(Conv2D(32, (5, 5), input_shape=(1, 28, 28), activation="relu"))

  model.add(MaxPooling2D(pool_size=(2, 2)))

  model.add(Dropout(0.2))

  model.add(Flatten())

  model.add(Dense(128, activation="relu"))

  model.add(Dense(numClass, activation="softmax"))

  # 编译模型

  model.compile(loss=''categorical_crossentropy'', optimizer="adam", metrics=[''accuracy''])

  return model

  # 运行演示并评估

  model = cnn_model()

  model.fit(train_images, train_labels, validation_data=(test_images, test_labels),
  epochs=10, batch_size=200, verbose=2)

  # 最终评估

  scores = model.evaluate(test_images, test_labels, verbose=0)

  print(scores[1])

  ```


  该脚本应使用以下命令在虚拟环境中运行：


  ```

  python kerasFashionTest.py

  ```


  该脚本大约需要 30 分钟才能运行完成，因为它使用完整的 60,000 个 `fashion_mnist` 训练数据集训练模型，然后使用 10,000 个 `fashion_mnist`
  测试数据集对模型进行十次（即 10 个周期）测试。最终结果如图 6-16 所示。


