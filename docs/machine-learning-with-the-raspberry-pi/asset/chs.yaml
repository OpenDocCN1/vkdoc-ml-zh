  \n```\npip install seaborn\npip install matplotlib\npip install pandas\n```\n\n\
  以下脚本加载 `diabetes.csv` 数据集，然后执行一系列数据检查、汇总和直方图绘制。我将此脚本命名为 `diabetesTest.py`，可从本书的配套网站获取。我还添加了一些解释性注释，以帮助阐明脚本中的操作。\n\
  \n```\n# 导入所需库\nimport matplotlib.pyplot as plt\nimport seaborn as sns\nimport pandas\
  \ as pd\n# 加载 CSV 数据集\ndataset = pd.read_csv('diabetes.csv')\ndataset.head(10)\n\
  # 定义直方图绘制方法\ndef plotHistogram(values, label, feature, title):\nsns.set_style(\"\
  whitegrid\")\nplotOne = sns.FacetGrid(values, hue=label, aspect=2)\nplotOne.map(sns.distplot,\
  \ feature, kde=False)\nplotOne.set(xlim=(0, values[feature].max()))\nplotOne.add_legend()\n\
  plotOne.set_axis_labels(feature, 'Proportion')\nplotOne.fig.suptitle(title)\nplt.show()\n\
  # 绘制胰岛素直方图\nplotHistogram(dataset, 'Outcome', 'Insulin', 'Insulin vs Diagnosis (Blue\
  \ = Healthy; Orange = Diabetes)')\n# 绘制皮肤厚度直方图\nplotHistogram(dataset, 'Outcome',\
  \ 'SkinThickness', 'SkinThickness vs Diagnosis (Blue = Healthy; Orange = Diabetes)')\n\
  # 按特征汇总数据集中零值的数量\ndataset2 = dataset.iloc[:, :-1]\nprint(\"Num of Rows, Num of Columns:\
  \ \", dataset2.shape)\nprint(\"\\nColumn Name          Num of Null Values\\n\")\n\
  print((dataset[:] == 0).sum())\n# 数据集中零值数量的百分比汇总\nprint(\"Num of Rows, Num of Columns:\
  \ \", dataset2.shape)\nprint(\"\\nColumn Name          %Null Values\\n\")\nprint(((dataset2[:]\
  \ == 0).sum()) / 768 * 100)\n# 创建热力图\ng = sns.heatmap(dataset.corr(), cmap=\"BrBG\"\
  , annot=False)\nplt.show()\n# 显示特征相关性值\ncorr1 = dataset.corr()\nprint(corr1[:])\n\
  ```\n\n解释性注释：\n\n*   `dataset = pd.read_csv('diabetes.csv')` – 使用 Pandas 的 `read_csv`\
  \ 方法将 CSV 数据集读入脚本。\n*   `dataset.head(10)` – 显示数据集中的前十条记录。\n*   `def plotHistogram(values,\
  \ label, feature, title)` – 定义一个方法，用于绘制参数列表中提供的数据集特征的直方图。此方法使用我在第 2 章中讨论过的 Seaborn\
  \ 库。在此定义之后，绘制了两个直方图，一个针对 `Insulin`，另一个针对 `SkinThickness`。这两个特征都存在大量零值。\n*   `dataset2\
  \ = dataset.iloc[:, :-1]` – 是代码段的开始，该代码段显示每个数据集特征中存在的实际零值数量。唯一应该包含零值的特征是 `Outcome`\
  \ 和 `Pregnancies`。\n*   `print(\"Num of Rows, Num of Columns: \", dataset2.shape)`\
  \ – 是代码段的开始，该代码段显示每个数据集特征中存在的零值百分比。\n*   `g = sns.heatmap(dataset.corr(), cmap=\"\
  BrBG\", annot=False)` – 为数据集的相关性图生成热力图。热力图是一种以二维形式表示数据的方式。数据值在图中以颜色表示。热力图的目标是提供信息的彩色视觉摘要。\n\
  *   `corr1 = dataset.corr()` – 创建一个数据集特征变量之间的相关性值表。在数据集中的值被调整后，此统计量将具有相当大的意义。\n\n\
  此脚本应在虚拟环境中运行，并且 `diabetes.csv` 数据集应与该脚本位于同一目录中。输入以下命令来运行脚本：\n\n```\npython diabetesTest.py\n\
  ```\n\n此脚本会立即运行并生成一系列结果。最终的屏幕结果如图 7-2 所示。\n\n![../images/482214_1_En_7_Chapter/482214_1_En_7_Fig2_HTML.jpg](img/482214_1_En_7_Fig2_HTML.jpg)\n\
  \n图 7-2\n\n运行 diabetesTest 脚本后的最终结果\n\n\n\n图中第一个表格列出了每个特征的零值（0）。显然，`SkinThickness`\
  \ 和 `Insulin` 这两个特征列中的零值数量达到了不可接受的程度。从图中下一个表格可以轻易看出，近 50% 的 `Insulin` 数据点缺失。这些缺失值会无意中给任何使用该数据集的\
  \ ANN（人工神经网络）引入偏差。这将对整体 ANN 预测性能产生何种影响尚不确定，但无论如何都会成为一个问题。\n\n图中最后一个表格显示了特征变量之间的相关系数值。通常，我希望变量之间的值较低，但那些自然相关的特征（如年龄和怀孕次数）除外。你还应注意，该表格是一个关于单位对角线的对称矩阵。单位对角线（全为\
  \ 1）的出现是因为变量与自身的相关系数必然等于 1。对称矩阵的出现则是因为相关函数是可交换的（变量的顺序无关紧要）。我将关注的关键值是，在修改数据以消除零值后，`SkinThickness`\
  \ 和 `Insulin` 之间当前 0.436783 的相关系数会如何变化。\n\n图 7-3 是显示胰岛素水平与健康/患病患者比例之间关系的直方图。\n\n\
  ![../images/482214_1_En_7_Chapter/482214_1_En_7_Fig3_HTML.jpg](img/482214_1_En_7_Fig3_HTML.jpg)\n\
  \n图 7-3\n\n胰岛素水平与健康/患病患者比例的直方图\n\n在 40 水平以下似乎有大量不健康患者聚集，这不合常理，因为任何活着的患者都不太可能有如此低的水平。此外，健康患者在胰岛素水平为\
  \ 20 或更低时出现强烈峰值也根本不现实。他们同样无法在如此低的水平下存活。显然，过多的零值问题正在扭曲数据，导致 ANN 做出错误预测。\n\n图 7-4\
  \ 是显示皮肤厚度测量值与健康/患病患者比例之间关系的直方图。\n\n![../images/482214_1_En_7_Chapter/482214_1_En_7_Fig4_HTML.jpg](img/482214_1_En_7_Fig4_HTML.jpg)\n\
  \n图 7-4\n\n皮肤厚度测量值与健康/患病患者比例的直方图\n\n在此图中，与前一图类似，健康和不健康患者的皮肤厚度测量值在接近 0 皮肤厚度处均出现异常峰值。皮肤厚度为\
  \ 0 是完全不可能的。过多的零值问题是导致这一异常的唯一原因。\n\n图 7-5 显示了数据集所有特征变量之间相关矩阵的热力图。\n\n![../images/482214_1_En_7_Chapter/482214_1_En_7_Fig5_HTML.jpg](img/482214_1_En_7_Fig5_HTML.jpg)\n\
  \n图 7-5\n\n数据集特征变量的相关热力图\n\n你应在此图中寻找白色块，它们表示相关系数值达到或超过 0.4。该数据集的大多数相关系数值相对较低，除了：\n\
  \n*   Glucose 和 Outcome\n*   Age 和 Pregnancies\n*   Insulin 和 SkinThickness\n\n\
  列表中的前两个完全合理。葡萄糖（血液中的糖水平）确实与糖尿病相关，因此也与 Outcome 相关。年龄和怀孕次数自然相关，因为女性随着年龄增长怀孕次数减少，或者如果她们年轻，则没有足够时间经历多次怀孕。列表中的最后一个值得怀疑，这是由于过多零值问题导致的人为高相关系数值。\n\
  \n现在是时候解决过多的零值问题了。问题自然变成了如何在不给数据集造成太大干扰的情况下做到这一点？大多数统计学家会给出的答案是：对缺失数据进行插补。插补数据是一个棘手的过程，因为它可能给数据集引入额外的偏差。根据数据的性质，插补数据的过程可以有多种形式。如果数据来自时间序列，则缺失数据可以很容易地通过插值缺失值周围的数据来替换。不幸的是，糖尿病数据集对时间不敏感，因此这个选项不可行。\n\
  \n另一种插补方法是直接删除那些包含缺失数据的记录。这称为列表式删除。不幸的是，使用列表式删除会导致近 50% 的现有数据集记录消失。这将对 ANN 学习过程造成严重破坏，因此该选项不可行。剩下的插补选项之一是使用所有现有的特征数据来确定一个值来替换缺失数据。有一些插补过程，如热卡、冷卡、均值和众数，就采用了这种方法。不深入细节，我决定使用众数作为替换缺失数据值的选项。\n\
  \n以下脚本是对之前脚本的修订，其中我对数据集进行了插补，以移除特征变量中的所有零值。该数据集还被拆分为两个数据集，一个用于训练，另一个用于测试。该脚本名为 `revisedDiabetesTest.py`，可从本书的配套网站获取。我在代码清单后提供了一些解释性注释。\n\
  \n```\n# 导入所需库\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport seaborn\
  \ as sns\nimport pandas as pd\nfrom sklearn.model_selection import train_test_split\n\
  from sklearn.impute import SimpleImputer\n# 加载数据集\ndata = pd.read_csv('diabetes.csv')\n\
  X = data.iloc[:, :-1]\ny = data.iloc[:, -1]\n# 将数据集拆分为 80% 训练集和 20% 测试集\nX_train,\
  \ X_test, y_train, y_test = train_test_split(X, y, test_size=0.2, random_state=1)\n\
  # 使用特征众数插补缺失值\nimputer = SimpleImputer(missing_values=0, strategy=\"median\")\n\
  X_train2 = imputer.fit_transform(X_train)\nX_test2 = imputer.transform(X_test)\n\
  # 将 numpy 数组转换为 DataFrame\nX_train3 = pd.DataFrame(X_train2)\n# 显示前 10 条记录\nprint(X_train3.head(10))\n\
  def plotHistogram(values, label, feature, title):\nsns.set_style(\"whitegrid\")\n\
  plotOne = sns.FacetGrid(values, hue=label, aspect=2)\nplotOne.map(sns.distplot,\
  \ feature, kde=False)\nplotOne.set(xlim=(0, values[feature].max()))\nplotOne.add_legend()\n\
  plotOne.set_axis_labels(feature, 'Proportion')\nplotOne.fig.suptitle(title)\nplt.show()\n\
  # 绘制胰岛素和皮肤厚度的健康患者直方图\nplotHistogram(X_train3,None,4,'Insulin vs Diagnosis')\nplotHistogram(X_train3,None,3,'SkinThickness\
  \ vs Diagnosis')\n# 检查是否还有零值残留\ndata2 = X_train2\nprint(\"行数, 列数: \", data2.shape)\n\
  print(\"\\n 列名          空值数量\\n\")\nprint((data2[:] == 0).sum())\nprint(\"行数, 列数:\
  \ \", data2.shape)\nprint(\"\\n 列名          %空值\\n\")\nprint(((data2[:] == 0).sum())\
  \ / 614 * 100)\n# 显示相关矩阵\ncorr1 = X_train3.corr()\nprint(corr1)\n```\n\n解释性注释：\n\
  \n*   `X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.2,\
  \ random_state=1)` – 将输入数据集拆分为两个，其中 80% 用于训练，20% 用于测试\n*   `X_train3 = pd.DataFrame(X_train2)`\
  \ – 将训练数据集从 numpy 数组转换为 Pandas DataFrame，以便与 Pandas 的互相关函数兼容\n\n同样，此脚本应在虚拟环境中运行，并且\
  \ `diabetes.csv` 数据集应与该脚本位于同一目录下。输入以下命令来运行脚本：\n\n```\npython revisedDiabetesTest.py\n\
  ```\n\n\n\n该脚本会立即运行并生成一系列结果。最终屏幕结果如图 7-6 所示。\n\n![../images/482214_1_En_7_Chapter/482214_1_En_7_Fig6_HTML.jpg](img/482214_1_En_7_Fig6_HTML.jpg)\n\
  \n图 7-6\n\n运行修订后的 DiabetesTest 脚本后的最终结果\n\n你可以立即看到，前十条训练集记录中所有的 0 值都已被替换为其他值。这对于所有特征变量都是如此，但\
  \ Outcome 列除外，因为该列是监督学习所必需的。\n\n0 值汇总代码现在显示数据集中已不存在 0 值。\n\n图 7-7 是修订后的直方图，显示了健康患者的胰岛素分布。不再有任何胰岛素值处于或接近\
  \ 0。分布峰值集中在 130 左右，这在我看来是合理的，但再次声明，我并非医学博士。\n\n![../images/482214_1_En_7_Chapter/482214_1_En_7_Fig7_HTML.jpg](img/482214_1_En_7_Fig7_HTML.jpg)\n\
  \n图 7-7\n\n健康患者的胰岛素直方图\n\n图 7-8 是修订后的直方图，显示了健康患者的皮肤厚度分布。与胰岛素图的情况一样，该图显示没有任何值低于 8。峰值似乎集中在\
  \ 29 这个值上，我推测这是一个合理的数值。\n\n![../images/482214_1_En_7_Chapter/482214_1_En_7_Fig8_HTML.jpg](img/482214_1_En_7_Fig8_HTML.jpg)\n\
  \n图 7-8\n\n健康患者的皮肤厚度直方图\n\n图 7-6 底部显示的相关矩阵现在表明，胰岛素与皮肤厚度之间的相关性值显著降低。在移除 0 值之前，这两个特征之间的相关性值为\
  \ 0.436783。现在为 0.168746，大约降低了 61%。移除 0 值确实提高了数据质量，至少对于这两个特征而言是如此。\n\n既然数据集已被“清理”到更好的状态，是时候讨论\
  \ Keras ANN 模型了。将要构建的模型是一个相对简单的三层顺序模型。输入层将有八个输入，对应数据集的八个特征变量。模型将使用 Keras 的密集类（dense\
  \ class）来构建全连接层。前两层将使用 ReLU 激活函数，因为它已被证明是一种性能最佳的激活函数。第三层是输出层，将使用 sigmoid 函数进行激活，因为输出必须在\
  \ 0 和 1 之间。回想一下，这是一个预测模型，输出是二元的，只有 0 或 1 两个值。总之，模型假设如下：\n\n*   期望输入包含八个变量的数据行（`input_dim=8`\
  \ 参数）。\n*   第一个隐藏层有 12 个节点，并使用 ReLU 激活函数。\n*   第二个隐藏层有 8 个节点，并使用 ReLU 激活函数。\n* \
  \  输出层有 1 个节点，并使用 sigmoid 激活函数。\n\n请注意，第一个隐藏层实际上执行了两个功能。它既作为输入层接收八个变量，同时也作为具有 12\
  \ 个节点和相关 ReLU 激活函数的隐藏层。\n\n以下脚本名为 `kerasDiabetesTest.py`，可从本书的配套网站获取。列表后附有解释性注释。\n\
  \n```\n# 导入所需库\nimport numpy as np\nimport pandas as pd\nfrom sklearn.model_selection\
  \ import train_test_split\nfrom sklearn.impute import SimpleImputer\nfrom keras.models\
  \ import Sequential\nfrom keras.layers import Dense\n# 加载数据集\ndata = pd.read_csv('diabetes.csv')\n\
  X = data.iloc[:, :-1]\ny = data.iloc[:, -1]\n# 将数据集拆分为 80% 的训练集和 20% 的测试集\nX_train,\
  \ X_test, y_train, y_test = train_test_split(X, y, test_size=0.2, random_state=1)\n\
  # 使用特征中位数填充缺失值\nimputer = SimpleImputer(missing_values=0,strategy='median')\nX_train2\
  \ = imputer.fit_transform(X_train)\nX_test2 = imputer.transform(X_test)\n# 将 numpy\
  \ 数组转换为 DataFrame\nX_train3 = pd.DataFrame(X_train2)\n# 定义 Keras 模型\nmodel = Sequential()\n\
  model.add(Dense(12, input_dim=8, activation=\"relu\"))\nmodel.add(Dense(8, activation=\"\
  relu\"))\nmodel.add(Dense(1, activation=\"sigmoid\"))\n# 编译 Keras 模型\nmodel.compile(loss='binary_crossentropy',\
  \ optimizer=\"adam\", metrics=['accuracy'])\n# 在数据集上拟合 Keras 模型\nmodel.fit(X_train2,\
  \ y_train, epochs=150, batch_size=10)\n# 评估 Keras 模型\n_, accuracy = model.evaluate(X_test2,\
  \ y_test)\nprint('Accuracy: %.2f' % (accuracy*100))\n```\n\n脚本的第一部分与 `revisedDiabetesTest.py`\
  \ 脚本的第一部分相同，只是增加和删除了一些导入语句。模型定义是内联的，而不是像 CNN 脚本那样单独定义。这样做是因为这是一个非常简洁的模型。编译过程与 CNN\
  \ 模型几乎相同，只是损失函数不同，这里使用的是 `binary_crossentropy` 而不是 `categorical_crossentropy`，后者用于多类别分类。该模型训练和测试速度非常快，因此可以运行多个\
  \ epoch 以提高准确率。在本例中，设置了 150 个 epoch。总体准确率是使用 Keras 的 `evaluate` 方法计算的，与 CNN 模型的做法相同。\n\
  \n此脚本应在虚拟环境中运行，并且 `diabetes.csv` 数据集应与此脚本位于同一目录下。输入以下命令来运行脚本：\n\n```\npython kerasDiabetesTest.py\n\
  ```\n\n该脚本会立即运行并生成一系列结果。最终屏幕结果如图 7-9 所示。\n\n![../images/482214_1_En_7_Chapter/482214_1_En_7_Fig9_HTML.jpg](img/482214_1_En_7_Fig9_HTML.jpg)\n\
  \n图 7-9\n\n运行 kerasDiabetesTest 脚本后的最终结果\n\n此图是一个合成图，显示了开始和结束 epoch 的结果。最终的总体准确率为\
  \ 70.78%。这通常被认为是一个尚可但不算出色的分数。然而，我查阅了一些其他人使用类似模型运行此项目的研究，发现这个结果与大多数其他结果一致。看来皮马印第安人糖尿病研究的预测成功率（或准确率）大约在\
  \ 70% 左右。我相信，如果用于实际的临床试验，这个准确率水平是不可接受的，但在这种学习和实验环境中是完全可以接受的。\n\n\n\n## 将 scikit-learn\
  \ 库与 Keras 结合使用\n\nPython 的 scikit-learn 库利用 scipy 栈实现高效的数值计算。它是一个功能完备的通用机器学习库，提供了许多在模型开发中非常有用的工具。这些工具包括：\n\
  \n*   使用重采样方法（如 k 折交叉验证）进行模型评估\n*   高效评估模型超参数\n\nKeras 库是一个便捷的封装器，用于将深度学习模型与 scikit-learn\
  \ 库结合，进行分类或回归估计。\n\n以下演示使用了 `KerasClassifier` 封装器，该封装器用于在 Keras 中创建的分类神经网络，并与 scikit-learn\
  \ 库配合使用。我还会使用与上一个演示相同的修改版皮马印第安人糖尿病数据集。\n\n这个演示脚本与上一个非常相似，因为它使用了相同的 Keras ANN 模型。显著的区别在于，本脚本中的模型由\
  \ `KerasClassifier` 使用，而不是通过 Keras 的 `fit` 函数将修改后的数据集直接应用于模型。我将在脚本列表之后解释 `KerasClassifier`\
  \ 的工作原理，因为让您了解它是如何被调用的非常重要。\n\n以下脚本命名为 `kerasScikitDiabetesTest.py`，以表明它现在使用 scikit-learn\
  \ 的分类器来代替常规的 Keras `fit` 函数。该脚本可从本书的配套网站获取。\n\n```\n# 加载所需库\nfrom keras.models import\
  \ Sequential\nfrom keras.layers import Dense\nfrom keras.wrappers.scikit_learn import\
  \ KerasClassifier\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.model_selection\
  \ import cross_val_score\nfrom sklearn.model_selection import train_test_split\n\
  from sklearn.impute import SimpleImputer\nimport pandas as pd\n# 创建模型的函数，KerasClassifier\
  \ 需要此函数\ndef create_model():\n# 创建模型\nmodel = Sequential()\nmodel.add(Dense(12,\
  \ input_dim=8, activation=\"relu\"))\nmodel.add(Dense(8, activation=\"relu\"))\n\
  model.add(Dense(1, activation=\"sigmoid\"))\nmodel.compile(loss='binary_crossentropy',\
  \ optimizer=\"adam\", metrics=['accuracy'])\nreturn model\n# 为结果可复现固定随机种子\nseed\
  \ = 42\n# 加载数据集\ndata = pd.read_csv('diabetes.csv')\nX = data.iloc[:, :-1]\ny =\
  \ data.iloc[:, -1]\n# 将数据集拆分为 80% 训练集和 20% 测试集\nX_train, X_test, y_train, y_test\
  \ = train_test_split(X, y, test_size=0.2, random_state=1)\n# 使用特征中位数填充缺失值\nimputer\
  \ = SimpleImputer(missing_values=0,strategy='median')\nX_train2 = imputer.fit_transform(X_train)\n\
  X_test2 = imputer.transform(X_test)\n# 将 numpy 数组转换为 DataFrame\nX_train3 = pd.DataFrame(X_train2)\n\
  # 创建模型\nmodel = KerasClassifier(build_fn=create_model, epochs=150, batch_size=10,\
  \ verbose=0)\n# 使用 10 折交叉验证进行评估\nkfold = StratifiedKFold(n_splits=10, shuffle=True,\
  \ random_state=seed)\n# 使用 cross_val_score 函数进行评估\nresults = cross_val_score(model,\
  \ X_train2, y_train, cv=kfold)\nprint(results.mean())\n```\n\n此脚本应在虚拟环境中运行，并且 `diabetes.csv`\
  \ 数据集应与此脚本位于同一目录中。输入以下命令来运行脚本：\n\n```\npython kerasScikitDiabetesTest.py\n```\n\n\
  此脚本会立即运行并产生一个结果。最终的屏幕结果如图 7-10 所示。\n\n![../images/482214_1_En_7_Chapter/482214_1_En_7_Fig10_HTML.jpg](img/482214_1_En_7_Fig10_HTML.jpg)\n\
  \n图 7-10\n\n运行 kerasScikitDiabetesTest 脚本后的最终结果\n\n图中显示的准确率为 73.45%。该值仅基于训练数据集（占原始数据集的\
  \ 80%）计算得出。因此，我将训练集的分割比例改为 99% 后重新运行了脚本，这意味着它几乎与未分割的数据集大小相同。结果准确率为 73.40%，与第一次运行的结果在统计上无显著差异。\n\
  \nKeras 中的 `KerasClassifier` 和 `KerasRegressor` 类接受一个名为 `build_fn` 的参数，该参数是模型的函数名称。在前面的脚本中，一个名为\
  \ `create_model()` 的方法为此案例创建了一个 MLP。该函数通过 `build_fn` 参数传递给 `KerasClassifier` 类。此外，还有\
  \ `nb_epoch=150` 和 `batch_size=10` 等额外参数，这些参数会被 `fit()` 函数自动使用，而 `fit()` 函数由 `KerasClassifier`\
  \ 类内部调用。\n\n在此示例中，随后使用 scikit-learn 的 `StratifiedKFold` 函数执行十折分层交叉验证。这是一种重采样技术，可为所定义模型在应用数据集上的准确率提供稳健的估计。\n\
  \nscikit-learn 的 `cross_val_score` 函数用于通过交叉验证方案评估模型并显示结果。\n\n### 使用 Keras 和 scikit-learn\
  \ 进行网格搜索\n\n在接下来的演示中，将使用网格搜索来评估 ANN 模型的不同配置。将报告产生最佳估计性能的配置。\n\n**create_model()**\
  \ 函数定义了两个参数：`optimizer` 和 `Init`，两者都有默认值。改变这些参数的值可以评估不同优化算法和权重初始化方案对网络模型的影响。\n\n\
  模型创建后，会定义用于网格搜索的参数数组。搜索旨在测试：\n\n*   用于搜索不同权重值的优化器\n*   用于使用不同方案准备网络权重的初始化器\n*  \
  \ 用于训练模型的不同训练数据集暴露次数的周期数\n*   用于在权重更新前改变样本数量的批次大小\n\n上述选项存储在一个字典中，然后传递给 `GridSearchCV`\
  \ scikit-learn 类的配置。该类会为每个参数组合（优化器、初始化、周期和批次的组合为 2 x 3 x 3 x 3）评估一个版本的 ANN 模型。然后，每个组合都使用默认的三折分层交叉验证进行评估。\n\
  \n模型数量很多，如果您使用 RasPi 复现此演示，会发现这需要相当长的计算时间。此 RasPi 设置的预估时长约为 2 小时，考虑到网络相对较小且数据集也较小（少于\
  \ 800 条记录实例和 9 个特征与属性），这个时间是可以接受的。\n\n脚本运行完成后，会显示最佳模型的性能及其配置组合，随后显示所有参数组合的性能。\n\n\
  以下脚本命名为 `kerasScikitGridSearchDiabetesTest.py`，以表明它使用 scikit-learn 的网格搜索算法来帮助确定\
  \ ANN 模型的最佳配置。该脚本可从本书的配套网站获取：\n\n\n\n```\n# 导入所需库\nimport numpy as np\nimport pandas\
  \ as pd\nfrom keras.models import Sequential\nfrom keras.layers import Dense\nfrom\
  \ sklearn.model_selection import train_test_split\nfrom sklearn.impute import SimpleImputer\n\
  from keras.wrappers.scikit_learn import KerasClassifier\nfrom sklearn.model_selection\
  \ import GridSearchCV\nfrom sklearn.model_selection import cross_val_score\n# 创建模型的函数，KerasClassifier\
  \ 需要此函数\ndef create_model(optimizer='rmsprop', init=\"glorot_uniform\"):\n# 创建模型\n\
  model = Sequential()\nmodel.add(Dense(12, input_dim=8, kernel_initializer=init,\
  \ activation=\"relu\"))\nmodel.add(Dense(8, kernel_initializer=init, activation=\"\
  relu\"))\nmodel.add(Dense(1, kernel_initializer=init, activation=\"sigmoid\"))\n\
  # 编译模型\nmodel.compile(loss='binary_crossentropy', optimizer=optimizer, metrics=['accuracy'])\n\
  return model\n# 为结果可复现设置随机种子\nseed = 42\nnp.random.seed(seed)\n# 加载数据集\ndata = pd.read_csv('diabetes.csv')\n\
  X = data.iloc[:, :-1]\ny = data.iloc[:, -1]\n# 将数据集拆分为 80% 训练集和 20% 测试集\nX_train,\
  \ X_test, y_train, y_test = train_test_split(X, y, test_size=0.2, random_state=1)\n\
  # 使用特征中位数填充缺失值\nimputer = SimpleImputer(missing_values=0,strategy='median')\nX_train2\
  \ = imputer.fit_transform(X_train)\nX_test2 = imputer.transform(X_test)\n# 将 numpy\
  \ 数组转换为 DataFrame\nX_train3 = pd.DataFrame(X_train2)\n# 创建模型\nmodel = KerasClassifier(build_fn=create_model,\
  \ verbose=0)\n# 网格搜索 epochs、batch size 和优化器\noptimizers = ['rmsprop', 'adam']\n\
  init = ['glorot_uniform', 'normal', 'uniform']\nepochs = [50, 100, 150]\nbatches\
  \ = [5, 10, 20]\nparam_grid = dict(optimizer=optimizers, epochs=epochs, batch_size=batches,\
  \ init=init)\ngrid = GridSearchCV(estimator=model, param_grid=param_grid)\ngrid_result\
  \ = grid.fit(X_train2, y_train)\n# 汇总结果\nprint(\"最佳结果: %f 使用 %s\" % (grid_result.best_score_,\
  \ grid_result.best_params_))\nmeans = grid_result.cv_results_['mean_test_score']\n\
  stds = grid_result.cv_results_['std_test_score']\nparams = grid_result.cv_results_['params']\n\
  for mean, stdev, param in zip(means, stds, params):\nprint(\"%f (%f) 参数: %r\" %\
  \ (mean, stdev, param))\n```\n\n此脚本应在虚拟环境中运行，且 `diabetes.csv` 数据集需与该脚本位于同一目录。输入以下命令运行脚本：\n\
  \n```\npython kerasScikitGridSearchDiabetesTest.py\n```\n\n由于运行了多组 epochs，此脚本大约需要\
  \ 2 小时才能完成。最终屏幕结果如图 7-11 所示，该图是我制作的合成图，展示了 epochs 中间结果的起始和结束部分。\n\n![../images/482214_1_En_7_Chapter/482214_1_En_7_Fig11_HTML.jpg](img/482214_1_En_7_Fig11_HTML.jpg)\n\
  \n图 7-11\n\n运行 kerasScikitGridSearchDiabetesTest 脚本后的最终结果\n\n在所有运行的 epochs 组中，达到的最高准确率为\
  \ 76.22%。请注意，我在图中画了一条线指向最优组。该组配置为 150 个 epochs、批次大小为 5、正态分布以及 Adam 优化器。\n\n## 房价回归预测演示\n\
  \n现代在线房产公司使用机器学习技术对房屋进行估值。本演示将使用人工神经网络和 scikit-learn 多元线性回归函数，预测美国马萨诸塞州波士顿都会区的房价。本演示使用的数据集年代较为久远（1978\
  \ 年），但对于本项目的目的而言仍然适用。\n\n该数据集包含 13 个变量和 507 条记录。数据集的特征变量详见表 7-2。\n\n表 7-2\n\n波士顿房价数据集特征变量\n\
  \n| 列名 | 描述 |\n| --- | --- |\n| CRIM | 城镇人均犯罪率 |\n| ZN | 占地面积超过 25,000 平方英尺的住宅用地比例\
  \ |\n| INDUS | 城镇非零售商业用地比例 |\n| CHAS | 查尔斯河虚拟变量（若地块临河则为 1，否则为 0） |\n| NOX | 一氧化氮浓度（每千万分之一）\
  \ |\n| RM | 每栋住宅的平均房间数 |\n| AGE | 1940 年之前建成的自住单位比例 |\n| DIS | 到波士顿五个就业中心的加权距离 |\n\
  | RAD | 径向高速公路可达性指数 |\n| TAX | 每 10,000 美元的全额财产税率 |\n| PTRATIO | 城镇师生比 |\n| LSTAT\
  \ | 人口中较低地位阶层的百分比 |\n| MEDV | 自住房屋的中位数价值（单位：千美元） |\n\n由变量 MEDV 表示的房屋价格是*目标变量*，其余特征则是用于预测房屋价值的*特征变量*。\n\
  \n\n\n### 数据预处理\n\n熟悉项目中将要使用的数据集始终是一个好习惯。显而易见的首要步骤是下载数据集。幸运的是，这个数据集可以通过 scikit-learn\
  \ 库直接获取。以下语句将把数据集下载到脚本中：\n\n```\nfrom sklearn.datasets import load_boston\nboston_dataset\
  \ = load_boston()\n```\n\n接下来，我创建了一个小脚本来研究数据集的特征，包括键和前几条记录。我将此脚本命名为 `inspectBoston.py`，它可以从本书的配套网站获取。\n\
  \n```\n# 加载所需库\nimport pandas as pd\nfrom sklearn.datasets import load_boston\n\
  # 加载波士顿房价数据集\nboston_dataset = load_boston()\n# 显示数据集的键\nprint(boston_dataset.keys())\n\
  # 显示前五条记录\nboston = pd.DataFrame(boston_dataset.data, columns=boston_dataset.feature_names)\n\
  print(boston.head())\n# 显示详细的数据集描述键\nprint(boston_dataset.DESCR)\n```\n\n使用以下命令运行此脚本：\n\
  \n```\npython inspectBoston.py\n```\n\n图 7-12 显示了运行此脚本会话的结果。\n\n![../images/482214_1_En_7_Chapter/482214_1_En_7_Fig12_HTML.jpg](img/482214_1_En_7_Fig12_HTML.jpg)\n\
  \n**图 7-12**\n\n运行 inspectBoston 脚本后的结果\n\n数据集键中的 `DESCR` 部分内容详尽，为这个有用的数据集提供了非同寻常且全面的历史回顾。我希望其他机器学习数据集也能包含如此丰富的信息。\n\
  \n查看前五条记录后发现，目标变量 `MEDV` 在 DataFrame 中缺失。通过添加以下代码行可以轻松解决这个问题：\n\n```\nboston['MEDV']\
  \ = boston_dataset.target\n```\n\n一个易于实现且非常实用的快速数据集检查是检查数据集中是否存在任何缺失值或 0 值。这可以通过\
  \ `isnull()` 方法结合求和操作来完成。实现此操作的语句是：\n\n```\nboston.isnull().sum()\n```\n\n我将这个空值检查与\
  \ `MEDV` 修正一起整合到了修改后的 `inspectBoston` 脚本中。这个修改后的脚本现在命名为 `inspectBostonRev.py`，它不再显示原始脚本中那样详尽的描述。此脚本可从本书的配套网站获取：\n\
  \n```\n# 加载所需库\nimport pandas as pd\nfrom sklearn.datasets import load_boston\n\
  # 加载波士顿房价数据集\nboston_dataset = load_boston()\n# 显示数据集的键\nprint(boston_dataset.keys())\n\
  # 创建 boston DataFrame\nboston = pd.DataFrame(boston_dataset.data, columns=boston_dataset.feature_names)\n\
  # 将目标变量添加到 DataFrame\nboston['MEDV'] = boston_dataset.target\n# 显示前五条记录\nprint(boston.head())\n\
  # 检查数据集中的空值\nprint(boston.isnull().sum())\n```\n\n使用以下命令运行此脚本：\n\n```\npython inspectBostonRev.py\n\
  ```\n\n图 7-13 显示了运行此脚本会话的结果。\n\n![../images/482214_1_En_7_Chapter/482214_1_En_7_Fig13_HTML.jpg](img/482214_1_En_7_Fig13_HTML.jpg)\n\
  \n**图 7-13**\n\n运行 inspectBoston 脚本后的结果\n\n结果显示，`MEDV` 目标变量已成功添加到 DataFrame 中，并且数据集中不存在空值或\
  \ 0 值。基于上述所有检查，我认为该数据集已准备好应用于模型。\n\n### 基线模型\n\n首先将创建一个 MLP Keras 模型，然后将其与 scikit-learn\
  \ 包装器回归函数一起使用，以评估波士顿房价数据集。此操作与第一章演示中的操作几乎相同，区别在于第一章中 scikit-learn 包装器函数是分类器而非回归包。这种将\
  \ Keras 模型与 scikit-learn 包装器函数结合使用的方法非常强大，因为它允许使用易于构建的 Keras 模型，同时利用 scikit-learn\
  \ 库内置的强大评估能力。\n\n基线模型是一个简单的结构，包含一个全连接隐藏层，其节点数与输入特征变量数（13）相同。该网络还使用了高效的 ReLU 激活函数。然而，输出层未使用激活函数，因为该网络旨在预测数值，无需应用任何变换。\n\
  \n使用 Adam 优化器，并以均方误差（MSE）损失函数作为待优化的目标函数。MSE 也将作为评估网络性能的同一指标。这是一个理想的指标，因为它可以在问题的上下文中被直接理解，即房价（以千美元为单位）的平方。\n\
  \n与 scikit-learn 库一起使用的 Keras 包装器对象名为 `KerasRegressor`。它的实例化方式与 `KerasClassifier`\
  \ 对象使用的参数类型相同。需要提供对模型的引用以及几个参数（epoch 数量和 batch size），这些参数最终会传递给执行训练的 `fit()` 函数。\n\
  \n脚本中还使用了一个随机数，以帮助在重复运行脚本时生成一致且可重现的结果。\n\n最终，模型使用十折交叉验证过程进行评估，正如我之前在本章及前几章中讨论的那样。最终指标是\
  \ MSE，包括交叉验证评估中所有十折的平均值和标准差。\n\n在将数据集应用于模型和评估框架之前，必须对其进行归一化。这是因为数据集中包含量级差异很大的值，你现在应该意识到，这对于人工神经网络来说是不利的。归一化后的数据集通常也称为标准化数据集。在此案例中，使用\
  \ scikit-learn 的 `StandardScaler` 函数在交叉验证过程的每一折内对数据进行归一化（标准化）。\n\n以下脚本整合了前面讨论的所有内容。它被命名为\
  \ `kerasRegressionTest.py`，可从本书的配套网站获取。\n\n\n\n```\n# 导入所需库\nimport pandas as pd\n\
  from keras.models import Sequential\nfrom keras.layers import Dense\nfrom keras.wrappers.scikit_learn\
  \ import KerasRegressor\nfrom sklearn.model_selection import cross_val_score\nfrom\
  \ sklearn.model_selection import KFold\nfrom sklearn.preprocessing import StandardScaler\n\
  from sklearn.pipeline import Pipeline\nfrom sklearn.datasets import load_boston\n\
  # 加载波士顿房价数据集\nboston_dataset = load_boston()\n# 创建波士顿数据框\ndataframe = pd.DataFrame(boston_dataset.data,\
  \ columns=boston_dataset.feature_names)\n# 将目标变量添加到数据框\ndataframe['MEDV'] = boston_dataset.target\n\
  # 设置波士顿数据框\nboston = dataframe.values\n# 分割为输入（X）和输出（y）变量\nX = boston[:,0:13]\n\
  y = boston[:,13]\n# 定义基础模型\ndef baseline_model():\n# 创建模型\nmodel = Sequential()\n\
  model.add(Dense(13, input_dim=13,  kernel_initializer='normal', activation=\"relu\"\
  ))\nmodel.add(Dense(1, kernel_initializer=\"normal\"))\n# 编译模型\nmodel.compile(loss='mean_squared_error',\
  \ optimizer=\"adam\")\nreturn model\n# 随机种子以确保可重复性\nseed = 42\n# 创建回归对象\nestimator\
  \ = KerasRegressor(build_fn=baseline_model, epochs=100, batch_size=5, verbose=0)\n\
  # 使用标准化数据集评估模型\nestimators = []\nestimators.append(('standardize', StandardScaler()))\n\
  estimators.append(('mlp', KerasRegressor(build_fn=baseline_model, epochs=50, batch_size=5,\
  \ verbose=0)))\npipeline = Pipeline(estimators)\nkfold = KFold(n_splits=10, random_state=seed)\n\
  results = cross_val_score(pipeline, X, y, cv=kfold)\nprint(\"Standardized: %.2f\
  \ (%.2f) MSE\" % (results.mean(), results.std()))\n```\n\n使用以下命令运行此脚本：\n\n```\n\
  python kerasRegressionTest.py\n```\n\n图 7-14 显示了运行此脚本会话的结果。\n\n![../images/482214_1_En_7_Chapter/482214_1_En_7_Fig14_HTML.jpg](img/482214_1_En_7_Fig14_HTML.jpg)\n\
  \n图 7-14\n\n运行 kerasRegressionTest 脚本后的结果\n\n得到的 MSE 为 28.65，这是一个不错的结果。对于那些在处理 MSE\
  \ 等统计指标时遇到困难的读者，我将提供一个略显朴素但或许更直观的解释。我做了以下简要计算：\n\n*   所有 MEDV 值的平均值 = 22.49（这是 1978\
  \ 年波士顿地区的房价）\n*   MSE 的平方根 = 5.35\n*   MSE 平方根与平均值的比率 = 0.238\n*   1 - 上述值 = 0.762\
  \ 或“准确率” = 76.2%\n\n现在，在统计学家开始批评我之前，我仅提供上述计算，以便对 MSE 指标给出一个有意义的解释。显然，MSE 趋近于 0 是理想的，但从这种方法可以看出，该模型相当准确。事实上，我针对其他人使用相同数据集和类似网络的结果做了一些额外研究。我发现报告的准确率在\
  \ 75% 到 80% 之间，因此本次演示的结果正好处于预期范围内。\n\n### 改进的基础模型\n\n上述脚本的一大优点是，可以在不影响脚本其他部分的情况下对基础模型进行修改。这种固有特性是我之前提到的*高内聚、低耦合*的另一个微妙例子。为了提升模型性能，将在模型中添加另一个层。这个“更深”的模型“可能”允许模型提取并组合数据中嵌入的高阶特征，从而获得更好的预测结果。该模型的代码如下：\n\
  \n```\n# 定义模型\ndef larger_model():\n# 创建模型\nmodel = Sequential()\nmodel.add(Dense(13,\
  \ input_dim=13, kernel_initializer=\"normal\", activation=\"relu\"))\nmodel.add(Dense(6,\
  \ kernel_initializer=\"normal\", activation=\"relu\"))\nmodel.add(Dense(1, kernel_initializer=\"\
  normal\"))\n# 编译模型\nmodel.compile(loss='mean_squared_error', optimizer=\"adam\"\
  )\nreturn model\n```\n\n修改后的脚本被重命名为 kerasDeeperRegressionTest.py，如下所示。该脚本可从本书的配套网站获取。\n\
  \n```\n# 导入所需库\nimport pandas as pd\nfrom keras.models import Sequential\nfrom keras.layers\
  \ import Dense\nfrom keras.wrappers.scikit_learn import KerasRegressor\nfrom sklearn.model_selection\
  \ import cross_val_score\nfrom sklearn.model_selection import KFold\nfrom sklearn.preprocessing\
  \ import StandardScaler\nfrom sklearn.pipeline import Pipeline\nfrom sklearn.datasets\
  \ import load_boston\n# 加载波士顿房价数据集\nboston_dataset = load_boston()\n# 创建波士顿数据框\n\
  dataframe = pd.DataFrame(boston_dataset.data, columns=boston_dataset.feature_names)\n\
  # 将目标变量添加到数据框\ndataframe['MEDV'] = boston_dataset.target\n# 设置波士顿数据框\nboston = dataframe.values\n\
  # 分割为输入（X）和输出（y）变量\nX = boston[:,0:13]\ny = boston[:,13]\n# 定义模型\ndef larger_model():\n\
  # 创建模型\nmodel = Sequential()\nmodel.add(Dense(13, input_dim=13, kernel_initializer=\"\
