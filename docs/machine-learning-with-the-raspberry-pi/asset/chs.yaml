  \ndf = pd.read_csv(file_path, header=None)\ndf.head()\n#对分类标签进行编码\nfrom sklearn.preprocessing\
  \ import LabelEncoder\nclass_le = LabelEncoder()\ny = class_le.fit_transform(df[4].values)\n\
  #标准化特征\nstdsc = StandardScaler()\nX_train_std = stdsc.fit_transform(df.iloc[:,range(0,4)].values)\n\
  # 构建类内协方差散度矩阵 S_W\nS_W = np.zeros((4,4))\nfor i in range(3):\nS_W += np.cov(X_train_std[y==i].T)\n\
  #构建类间散度矩阵 S_B\nN=np.bincount(y) # 给定类别的样本数量\nvecs=[]\n[vecs.append(np.mean(X_train_std[y==i],axis=0))\
  \ for i in range(3)] # 类别均值\nmean_overall = np.mean(X_train_std, axis=0) # 总体均值\n\
  S_B=np.zeros((4,4))\nfor i in range(3):\nS_B += N[i]*(((vecs[i]-mean_overall).reshape(4,1)).dot(((vecs[i]-mean_overall).reshape(1,4))))\n\
  # 计算 inv(S_W)dot(S_B) 的排序后的特征值和特征向量\neigen_vals, eigen_vecs = np.linalg.eig(np.linalg.inv(S_W).dot(S_B))\n\
  eigen_pairs = [(np.abs(eigen_vals[i]), eigen_vecs[:,i]) for i in range(len(eigen_vals))]\n\
  eigen_pairs = sorted(eigen_pairs,key=lambda k: k[0], reverse=True)\nprint('按降序排列的特征值：\\\
  n')\nfor eigen_val in eigen_pairs:\nprint(eigen_val[0])\n# 绘制主要的 LDA 成分\ntot = sum(eigen_vals.real)\n\
  discr = [(i / tot) for i in sorted(eigen_vals.real, reverse=True)]\ncum_discr =\
  \ np.cumsum(discr)\nplt.bar(range(1, 5), discr, width=0.2,alpha=0.5, align=\"center\"\
  ,label='单个“可判别性”')\nplt.step(range(1, 5), cum_discr, where=\"mid\",label='累积“可判别性”')\n\
  plt.ylabel('判别比率')\nplt.xlabel('线性判别成分')\nplt.ylim([-0.1, 1.1])\nplt.legend(loc='best')\n\
  plt.show()\n#将原始特征投影到新的特征空间\nW=np.hstack((eigen_pairs[0][1][:, ].reshape(4,1),eigen_pairs[1][1][:,\
  \ ].reshape(4,1))).real\nX_train_lda = X_train_std.dot(W)\n# 列出并绘制 LDA 子空间中的转换后特征\n\
  data=pd.DataFrame(X_train_lda)\ndata['class']=y\ndata.columns=[\"LD1\",\"LD2\",\"\
  class\"]\ndata.head()\nmarkers = ['s', 'x','o']\nsns.lmplot(x=\"LD1\", y=\"LD2\"\
  , data=data, markers=markers,fit_reg=False, hue=\"class\", legend=False)\nplt.legend(loc='upper\
  \ center')\nplt.show()\n#使用 scikit-learn 实现 LDA\nlda = LinearDiscriminantAnalysis(n_components=2)\n\
  X_train_lda = lda.fit_transform(X_train_std, y)\n# 列出并绘制 scikit-learn 的 LDA 结果\n\
  data=pd.DataFrame(X_train_lda)\ndata['class']=y\ndata.columns=[\"LD1\",\"LD2\",\"\
  class\"]\ndata.head()\nmarkers = ['s', 'x','o']\ncolors = ['r', 'b','g']\nsns.lmplot(x=\"\
  LD1\", y=\"LD2\", data=data, hue=\"class\", markers=markers,fit_reg=False,legend=False)\n\
  plt.legend(loc='upper center')\nplt.show()\n```\n\n以下是对前面脚本中引入 PCA 部分未涉及的新概念的各代码段的解释性讨论。此外，为了节省篇幅，除非代码段不超过三行，否则我将只展示代码段的开头和结尾。\n\
  \n```\nfrom sklearn.preprocessing import LabelEncoder\nclass_le = LabelEncoder()\n\
  y = class_le.fit_transform(df[4].values)\n```\n\n类别字符串值被转换为数值，以便在脚本中更容易处理。sklearn\
  \ 的 `LabelEncoder` 模块完成了此任务。\n\n```\nS_W = np.zeros((4,4))\nfor i in range(3):\n\
  S_W += np.cov(X_train_std[y==i].T)\n```\n\n创建了一个 4 x 4 的矩阵 S_W，它代表了类内协方差。\n\n```\n\
  N=np.bincount(y) # 给定类别的样本数量\n.\n.\nmean_overall).reshape(4,1)).dot(((vecs[i]-mean_overall).reshape(1,4))))\n\
  ```\n\n创建了一个 4 x 4 的矩阵 S_B，它代表了类间协方差。\n\n```\neigen_vals, eigen_vecs = np.linalg.eig(np.linalg.inv(S_W).dot(S_B))\n\
  .\n.\nfor eigen_val in eigen_pairs:\nprint(eigen_val[0])\n```\n\n计算并排序特征向量和特征值。排序后的特征值也会显示在屏幕上。\n\
  \n```\ntot = sum(eigen_vals.real)\n.\n.\nplt.show()\n```\n\n绘制主要的 LDA 成分。\n\n```\n\
  W=np.hstack((eigen_pairs[0][1][:, ].reshape(4,1),eigen_pairs[1][1][:, ].reshape(4,1))).real\n\
  X_train_lda = X_train_std.dot(W)\n```\n\n将原始特征投影到新的特征空间。\n\n```\ndata=pd.DataFrame(X_train_lda)\n\
  .\n.\nplt.show()\n```\n\n将转换后的特征绘制到 LDA 子空间中。\n\n```\nlda = LinearDiscriminantAnalysis(n_components=2)\n\
  X_train_lda = lda.fit_transform(X_train_std, y)\n```\n\n使用 scikit-learn 实现 LDA。\n\
