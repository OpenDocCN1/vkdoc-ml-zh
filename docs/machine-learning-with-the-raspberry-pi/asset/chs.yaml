  \n## 使用 CNN 进行预测\n\n乍一看（请原谅这个双关语），使用 CNN 进行预测似乎是一项奇怪的任务。CNN 的前提是将图像作为输入数据源，那么自然会产生一个问题：什么是“预测”图像？答案在于图像的预期用途。CNN\
  \ 与其对应的 ANN 一样，都是神经网络。它们仅被设计用于处理数值数组和矩阵，仅此而已。用户如何解释 CNN 的输出完全取决于用户。\n\n近年来，CNN 已被用于细胞显微镜应用中，用于检测癌症和其他疾病。在这种情况下，预测是基于显微镜细胞图像分析，判断患者是否患有某种特定诊断。这种分析也广泛用于放射线（X\
  \ 光）检查，其中 CNN 已被应用于大规模图像，以协助患者诊断。医学预测具有巨大的影响，而 CNN 分析只是医生用于辅助诊断的众多工具之一。CNN 医学分析的主题相当复杂，我决定将下一整章专门用于讨论它。\n\
  \nCNN 预测另一个常用的领域是时间序列分析，幸运的是，这个领域远没有医学诊断那么复杂。我包含了一系列相对简单的演示，以说明如何将 CNN 用于时间序列。然而，我将首先回答一个显而易见的问题：什么是时间序列？时间序列只是一系列按时间顺序索引的数据点。最常见的情况是，时间序列是一个数值序列，在时间上以连续等间距的数据点进行采样。它只是一系列离散的、与时间相关的数据点。时间序列的例子包括海洋潮汐高度、太阳黑子活动以及道琼斯工业平均指数的每日收盘值。所有时间序列的共同属性是它们都是历史数据。这就是\
  \ CNN 发挥作用的地方。CNN 利用历史记录来预测下一个数据点。实际上，如果时间序列是逻辑清晰且有序的，这并非一个大问题。如果我向你展示以下时间序列：\n\n\
  *   5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55, ?\n\n并请你预测序列中的下一个数字，我相信我聪明的读者中没有人会觉得有困难。但是，如果我向你展示以下序列：\n\
  \n*   86.6, 50, 0, –50, –86.6, –100, –86.6, –50, 0, 50, 86.6, ?\n\n你们中的一些人可能会在得出答案时遇到一些困难（提示：余弦值乘以\
  \ 100）。尽管有些读者可能立即注意到序列中的重复模式，但 CNN 在检测该模式时不会有任何问题。在前面的例子中，绘制数据点会让你立即识别出正弦模式。\n\n\
  但如果时间序列是完全随机的，那么如何确定下一个数据点呢？这就是 CNN 可以帮助我们的地方——一个投入了大量资源来预测股票市场指数的领域。与这些指数相关的时间序列极其复杂，取决于许多相互冲突的因素，如金融稳定性、全球状况、社会情绪、未来不确定性等等。尽管如此，许多杰出的数据科学家一直在解决这个问题，并应用了一些最具创新性和最复杂的深度学习技术，包括极其复杂的\
  \ CNN。显然，开发一个强大的预测模型所带来的回报将是巨大的。我怀疑如果有人已经开发出了强大的算法，它很可能已被保密，并且很可能将继续保密。\n\n以下演示内容非常简单，并且有意如此。它们仅旨在展示如何将\
  \ CNN 应用于各种时间序列。这些是基本概念，你可以利用它们来构建更复杂、更现实的预测模型。\n\n\n\n### 单变量时间序列 CNN 模型\n\n单变量时间序列是一系列按时间顺序采样的数据点，且样本之间的间隔相等。CNN\
  \ 模型的目标是利用这个一维数值数组来预测序列中的下一个数据点。这个时间序列（或我接下来将称之为数据集）首先需要进行一些预处理，才能与 CNN 模型兼容。我将在数据集预处理部分之后讨论如何构建\
  \ CNN 模型。\n\n#### 预处理数据集\n\n请记住，CNN 必须学习一个函数，该函数将历史数值序列作为输入，映射到单个数值输出。这意味着时间序列必须被转换成\
  \ CNN 可以学习的多个样本。\n\n假设输入提供了以下时间序列：\n\n*   50, 100, 150, 200, 250, 300, 350, 400,\
  \ 450, 500, 550, 600, 650\n\n将上述序列分解为一系列输入/输出样本模式，如表 7-3 所示。\n\n表 7-3\n\n时间序列到样本的分布\n\
  \n| X | y |\n| --- | --- |\n| 50, 100, 150 | 200 |\n| 100, 150, 200 | 250 |\n| 150,\
  \ 200, 250 | 300 |\n| 200, 250, 300 | 350 |\n| 250, 300, 350 | 400 |\n| 300, 350,\
  \ 400 | 450 |\n| 350, 400, 450 | 500 |\n| 400, 450, 500 | 550 |\n| 450, 500, 550\
  \ | 600 |\n| 500, 550, 600 | 650 |\n\n以下脚本将时间序列解析为适用于 CNN 的数据集。该脚本名为`splitTimeSeries.py`，可从本书的配套网站获取：\n\
  \n```\n# Import required library\nfrom numpy import array\n# Split a univariate\
  \ time series into samples\ndef split_sequence(sequence, n_steps):\nX, y = list(),\
  \ list()\nfor i in range(len(sequence)):\n# find the end of this pattern\nend_ix\
  \ = i + n_steps\n# check if we are beyond the sequence\nif end_ix > len(sequence)-1:\n\
  break\n# gather input and output parts of the pattern\nseq_x, seq_y = sequence[i:end_ix],\
  \ sequence[end_ix]\nX.append(seq_x)\ny.append(seq_y)\nreturn array(X), array(y)\n\
  # Define input time series\nraw_seq = [50, 100, 150, 200, 250, 300, 350, 400, 450,\
  \ 500, 550, 600, 650]\n# Choose a number of time steps\nn_steps = 3\n# Split into\
  \ samples\nX, y = split_sequence(raw_seq, n_steps)\n# Display the data\nfor i in\
  \ range(len(X)):\nprint(X[i], y[i])\n```\n\n使用以下命令运行此脚本：\n\n```\npython splitTimeSeries.py\n\
  ```\n\n图 7-17 显示了运行此脚本的结果。\n\n![../images/482214_1_En_7_Chapter/482214_1_En_7_Fig17_HTML.jpg](img/482214_1_En_7_Fig17_HTML.jpg)\n\
  \n图 7-17\n\n运行 splitTimeSeries 脚本后的结果\n\n从图中可以看出，该脚本为 CNN 创建了十个学习样本。这应该足以训练一个 CNN\
  \ 模型来有效预测数据点。本演示的下一步是创建一个 CNN 模型。\n\n#### 创建 CNN 模型\n\nCNN 模型必须有一个一维输入/卷积层，以匹配一维应用数据集。第一层之后是一个池化层，它将对卷积层的输出进行下采样，以提取显著特征。池化层之后连接一个全连接层，该层解释由卷积层提取的特征。随后是另一个全连接层，以帮助进一步定义特征，最后输出层将特征图缩减为一维向量。\n\
  \n该模型的代码如下：\n\n```\n# Define 1-D CNN model\nmodel = Sequential()\nmodel.add(Conv1D(filters=64,\
  \ kernel_size=2, activation=\"relu\", input_shape=(n_steps, n_features)))\nmodel.add(MaxPooling1D(pool_size=2))\n\
  model.add(Flatten())\nmodel.add(Dense(50, activation=\"relu\"))\nmodel.add(Dense(1))\n\
  model.compile(optimizer='adam', loss=\"mse\")\n```\n\n卷积层有两个参数，用于指定期望的时间步数（间隔）和特征数量。对于单变量问题，特征数量为\
  \ 1。时间步数将与用于分割一维时间序列的数字相同，在本例中为 3。\n\n输入数据集包含多条记录，每条记录的维度形状为 [样本数, 时间步数, 特征数]。\n\
  \n`split_sequence` 函数提供的 X 向量形状为 [样本数, 时间步数]，这意味着必须重塑数据集，以添加一个额外元素来覆盖特征数量。以下代码片段正是执行此重塑操作：\n\
  \n```\nn_features = 1\nX = X.reshape(X.shape[0], X.shape[1], n_features))\n```\n\
  \n模型需要进行训练，这通过传统的 Keras `fit` 函数完成。由于这是一个简单的模型，并且与我演示的其他模型相比，数据集非常小，因此单个周期的训练将极其短暂。这意味着可以使用大量的周期来尝试获得性能最佳的模型。在本例中，该数量为\
  \ 1000。以下代码调用模型的 `fit` 函数：\n\n```\nmodel.fit(X, y, epochs=1000, verbose=0)\n```\n\
  \n最后，将使用 Keras 的 `predict` 函数来预测输入序列中的下一个值。例如，如果输入序列是 {150, 200, 250}，那么预测值应为 [300]。预测的代码如下：\n\
  \n```\n# Demonstrate prediction\nx_input = array([150, 200, 250])\nx_input = x_input.reshape((1,\
  \ n_steps, n_features))\nyhat = model.predict(x_input, verbose=0)\n```\n\n整合了前面讨论的所有代码片段的完整脚本名为\
  \ `univariateTimeSeriesTest.py`，如下所示。该脚本可从本书的配套网站获取。\n\n\n\n```\n# 导入所需库\nfrom numpy\
  \ import array\nfrom keras.models import Sequential\nfrom keras.layers import Dense\n\
  from keras.layers import Flatten\nfrom keras.layers.convolutional import Conv1D\n\
  from keras.layers.convolutional import MaxPooling1D\n# 将单变量序列分割为样本\ndef split_sequence(sequence,\
  \ n_steps):\n    X, y = list(), list()\n    for i in range(len(sequence)):\n   \
  \     # 找到该模式的结束索引\n        end_ix = i + n_steps\n        # 检查是否超出序列范围\n       \
  \ if end_ix > len(sequence)-1:\n            break\n        # 收集模式的输入和输出部分\n    \
  \    seq_x, seq_y = sequence[i:end_ix], sequence[end_ix]\n        X.append(seq_x)\n\
  \        y.append(seq_y)\n    return array(X), array(y)\n# 定义输入序列\nraw_seq = [50,\
  \ 100, 150, 200, 250, 300, 350, 400, 450, 500, 550, 600, 650]\n# 选择时间步数\nn_steps\
  \ = 3\n# 分割为样本\nX, y = split_sequence(raw_seq, n_steps)\n# 从 [样本数, 时间步数] 重塑为 [样本数,\
  \ 时间步数, 特征数]\nn_features = 1\nX = X.reshape((X.shape[0], X.shape[1], n_features))\n\
  # 定义一维 CNN 模型\nmodel = Sequential()\nmodel.add(Conv1D(filters=64, kernel_size=2,\
  \ activation=\"relu\", input_shape=(n_steps, n_features)))\nmodel.add(MaxPooling1D(pool_size=2))\n\
  model.add(Flatten())\nmodel.add(Dense(50, activation=\"relu\"))\nmodel.add(Dense(1))\n\
  model.compile(optimizer='adam', loss=\"mse\")\n# 拟合模型\nmodel.fit(X, y, epochs=1000,\
  \ verbose=0)\n# 演示预测\nx_input = array([150, 200, 250])\nx_input = x_input.reshape((1,\
  \ n_steps, n_features))\nyhat = model.predict(x_input, verbose=0)\nprint(yhat)\n\
  ```\n\n使用以下命令运行此脚本：\n\n```\npython univariateTimeSeriesTest.py\n```\n\n图 7-18 显示了运行此脚本的结果。\n\
  \n![../images/482214_1_En_7_Chapter/482214_1_En_7_Fig18_HTML.jpg](img/482214_1_En_7_Fig18_HTML.jpg)\n\
  \n图 7-18\n\n运行 univariateTimeSeriesTest 脚本后的结果\n\n显示的预测值为 296.78，虽然与预期的 300 不完全一致，但已相当接近。算法中存在一定程度的随机性，我尝试多运行了几次。以下列表显示了十次重试的结果：\n\
  \n*   286.68\n\n*   276.35\n\n*   279.15\n\n*   299.96\n\n*   279.66\n\n*   299.86\n\
  \n*   300.07\n\n*   281.75\n\n*   294.20\n\n*   300.09\n\n从列表中可以看出，预期值（四舍五入后）在十次中出现了四次。十个值的平均值为\
  \ 289.78，标准差为 10.03，范围从 276.35 到 300.09。根据这些性能统计数据，我会将这个 CNN 预测器评为良好。\n\n#### 多变量时间序列\
  \ CNN 模型\n\n多变量时间序列与单变量时间序列相同，区别在于每个时间步有多个采样值。有两种模型类型可以处理多变量时间序列数据：\n\n*   多输入序列\n\
  \n*   多并行序列\n\n每种模型类型将分别讨论。\n\n##### 多输入序列\n\n首先需要说明，多输入序列具有并行的输入时间序列，不要与另一种模型类型混淆。这一点稍后会变得清晰。这种并行时间序列在相同的时间步对其值进行采样。例如，考虑以下原始时间序列值集合：\n\
  \n*   [50, 100, 150, 200, 250, 300, 350, 400, 450, 500, 550, 600, 650]\n\n*   [50,\
  \ 75, 100, 125, 150, 175, 200, 225, 250, 275, 300, 325, 350]\n\n输出序列将是每个序列整个长度上每个采样值对的总和。在代码中，上述内容可以表示为：\n\
  \n```\nfrom numpy import array\nin_seq1 = array([50, 100, 150, 200, 250, 300, 350,\
  \ 400, 450, 500, 550, 600, 650])\nin_seq2 = array([50,   75, 100, 125, 150, 175,\
  \ 200, 225, 250, 275, 300, 325, 350])\nout_seq = array([in_seq1[i] + in_seq2[i]\
  \ for i in range(len(in_seq1))])\n```\n\n这些数组必须像之前的演示中那样进行重塑。列也必须水平堆叠以便处理。完成所有这些操作的代码段如下：\n\
