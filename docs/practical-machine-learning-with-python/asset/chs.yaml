  ###### 使用 `merge` 命令实现数据库风格的拼接


  对于熟悉关系型数据库的人来说，最熟悉的拼接数据方式是使用数据库提供的 `join` 操作。`Pandas` 为数据框提供了一套数据库友好的 `join` 操作。这些操作针对高性能进行了优化，通常是拼接不同数据框的首选方法。


  按列拼接：这是拼接两个数据框最自然的方式。在这种方法中，我们有两个共享一个公共列的数据框，我们可以使用该列来拼接这两个数据框。`pandas` 库提供了全套的拼接操作（内连接、外连接、左连接、右连接等），我们将在本小节中演示内连接的使用。你可以通过查阅
  `pandas` 文档轻松了解如何执行其余的 `join` 操作。


  在本例中，我们将把原始的城市数据拆分成两个不同的数据框，一个包含 `city` 信息，另一个包含 `country` 信息。然后，我们可以使用其中一个共享的公共列来拼接它们。


