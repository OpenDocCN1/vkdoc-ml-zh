  分析情感成因


  我们构建了监督式和无监督式模型，以根据评论文本内容预测电影评论的情感。虽然特征工程和建模无疑是当务之急，但你也需要知道如何分析和解释模型预测背后的根本原因。在本节中，我们将分析情感成因。其思路是确定导致正面或负面情感的根本原因或关键因素。第一个关注领域是模型解释，我们将尝试理解、解释和说明分类模型做出预测背后的机制。第二个关注领域是应用主题建模，从正面和负面情感评论中提取关键主题。


  解释预测模型


  机器学习模型面临的挑战之一是从试点或概念验证阶段过渡到生产阶段。业务部门和关键利益相关者通常将机器学习模型视为复杂的黑箱，并提出疑问：我为什么要相信你的模型？向他们解释复杂的数学或理论概念并不能达到目的。有没有什么方法可以让我们以易于解释的方式解释这些模型？事实上，这个话题在
  2016 年最近获得了广泛关注。请参考 M.T. Ribeiro、S. Singh 和 C. Guestrin 的原始研究论文《Why Should I Trust
  You?: Explaining the Predictions of Any Classifier》，网址为 [`https://arxiv.org/pdf/1602.04938.pdf`](https://arxiv.org/pdf/1602.04938.pdf)，以了解更多关于模型解释和
  LIME 框架的信息。更多关于模型解释的内容，请参阅第 5 章，我们在其中详细介绍了 skater 框架，该框架对各种模型进行了出色的解释。


  有多种方法可以解释我们的预测性情感分类模型所做的预测。我们想更深入地了解为什么一条正面评论被正确预测为具有正面情感，或者一条负面评论被正确预测为具有负面情感。除此之外，没有模型是
  100% 准确的，因此我们也想了解错误分类或错误预测的原因。本节使用的代码可在名为 `sentiment_causal_model_interpretation.py`
  的文件中找到，或者你也可以参考名为 `Sentiment Causal Analysis - Model Interpretation.ipynb` 的 Jupyter
  笔记本，以获得交互式体验。


  首先，让我们为迄今为止效果最好的模型构建一个基本的文本分类流水线。这是基于词袋特征模型的逻辑回归模型。我们将利用 `scikit-learn` 的流水线模块，使用以下代码构建此机器学习流水线。


  ```

  from sklearn.feature_extraction.text import CountVectorizer

  from sklearn.linear_model import LogisticRegression

  from sklearn.pipeline import make_pipeline




  '
- '# 在训练评论上构建词袋特征

  cv = CountVectorizer(binary=False, min_df=0.0, max_df=1.0, ngram_range=(1,2))

  cv_train_features = cv.fit_transform(norm_train_reviews)


  '
- '# 构建逻辑回归模型

  lr = LogisticRegression()

  lr.fit(cv_train_features, train_sentiments)


  '
- '# 构建文本分类流水线

  lr_pipeline = make_pipeline(cv, lr)


  '
- '# 保存预测类别列表（正面、负面）

  classes = list(lr_pipeline.classes_)

  ```


  我们的模型基于 `norm_train_reviews` 构建，该数据集包含我们在之前所有分析中使用的标准化训练评论。现在分类流水线已经准备就绪，你可以通过 pickle
  或 joblib 保存分类器和特征对象来实际部署模型，这与我们在第 5 章“模型部署”一节中讨论的方法类似。假设我们的流水线已投入生产，如何将其用于新的电影评论呢？让我们尝试预测两条新样本评论的情感（这些评论未用于模型训练）。


  ```

  In [3]: lr_pipeline.predict([''the lord of the rings is an excellent movie'',

  ...:                      ''i hated the recent movie on tv, it was so bad''])

  Out[3]: array([''positive'', ''negative''], dtype=object)

  ```


  我们的分类流水线正确预测了这两条评论的情感！这是一个良好的开端，但如何解读模型的预测结果呢？一种常见的方法是使用模型预测的类别概率作为置信度的衡量标准。你可以使用以下代码获取样本评论的预测概率。


  ```

  In [4]: pd.DataFrame(lr_pipeline.predict_proba([''the lord of the rings is an excellent
  movie'',

  ...:                      ''i hated the recent movie on tv, it was so bad'']), columns=classes)

  Out[4]:

  negative  positive

  0  0.169653  0.830347

  1  0.730814  0.269186

  ```


  因此，我们可以说第一条电影评论有 83% 的预测置信度或概率为正面情感，而第二条电影评论有 73% 的概率为负面情感。现在让我们更进一步，不再使用玩具示例，而是对
  `test_reviews` 数据集中的真实评论运行相同的分析（我们将使用包含标准化文本评论的 `norm_test_reviews`）。除了预测概率，我们还将使用
  `skater` 框架来轻松解读模型决策，这与我们在第 5 章“模型解读”一节中所做的工作类似。首先需要从 `skater` 包中加载以下依赖项。我们还定义了一个辅助函数，该函数接受文档索引、语料库、其响应预测以及一个解释器对象，帮助我们进行模型解读分析。


  ```

  from skater.core.local_interpretation.lime.lime_text import LimeTextExplainer

  explainer = LimeTextExplainer(class_names=classes)


  '
- '# 模型解读的辅助函数

  def interpret_classification_model_prediction(doc_index, norm_corpus, corpus,

  prediction_labels, explainer_obj):


  '
- '# 显示模型预测和实际情感

  print("测试文档索引: {index}\n 实际情感: {actual}

  \n 预测情感: {predicted}"

  .format(index=doc_index, actual=prediction_labels[doc_index],

  predicted=lr_pipeline.predict([norm_corpus[doc_index]])))


  '
- '# 显示实际评论内容

  print("\n 评论:", corpus[doc_index])


  '
- '# 显示预测概率

  print("\n 模型预测概率:")

  for probs in zip(classes, lr_pipeline.predict_proba([norm_corpus[doc_index]])[0]):

  print(probs)


  '
- "# 显示模型预测解读\nexp = explainer.explain_instance(norm_corpus[doc_index],\nlr_pipeline.predict_proba,\
  \ num_features=10,\nlabels=[1])\nexp.show_in_notebook()\n```\n\n上述代码片段利用 `skater`\
  \ 来解释我们的文本分类器，以易于理解的形式分析其决策过程。尽管从全局角度看模型可能很复杂，但在局部实例上解释和近似模型行为则更为容易。这是通过在感兴趣的数据点\
  \ X 附近学习模型来实现的，具体方法是在 X 周围采样实例，并根据它们与 X 的接近程度分配权重。因此，这些局部学习的线性模型有助于以更易于理解的方式解释复杂模型，包括类别概率以及有助于决策过程的顶级特征对类别概率的贡献。让我们从测试数据集中选取一条实际情感和预测情感均为负面的电影评论，并使用前面代码片段中创建的辅助函数进行分析。\n\
  \n![A448827_1_En_7_Fig15_HTML.jpg](img/A448827_1_En_7_Fig15_HTML.jpg)\n\n图 7-15.\n\
  \n分类模型正确预测负面评论的模型解读\n\n```\nIn [6]: doc_index = 100\n...: interpret_classification_model_prediction(doc_index=doc_index,\
  \ corpus=norm_test_reviews,\ncorpus=test_reviews, prediction_labels=test_sentiments,\n\
  explainer_obj=explainer)\n测试文档索引: 100\n实际情感: negative\n预测情感: ['negative']\n评论: Worst\
  \ movie, (with the best reviews given it) I've ever seen. Over the top dialog, acting,\
  \ and direction. more slasher flick than thriller. With all the great reviews this\
  \ movie got I'm appalled that it turned out so silly. shame on you Martin Scorsese\n\
  模型预测概率:\n('negative', 0.8099323456145181)\n('positive', 0.19006765438548187)\n```\n\
  \n图 7-15 所示的结果向我们展示了类别预测概率，以及对预测决策过程贡献最大的前 10 个特征。这些关键特征也在标准化电影评论文本中突出显示。我们的模型在此场景中表现良好，我们可以看到导致该评论负面情感的关键特征，包括\
  \ `bad, silly, dialog` 和 `shame`，这很合理。除此之外，单词 `great` 对 0.19 的正面概率贡献最大，事实上，如果我们从评论文本中删除这个词，正面概率会显著下降。\n\
  \n以下代码对一条实际情感和预测情感均为正面的测试电影评论进行了类似分析。\n\n![A448827_1_En_7_Fig16_HTML.jpg](img/A448827_1_En_7_Fig16_HTML.jpg)\n\
  \n图 7-16.\n\n分类模型正确预测正面评论的模型解读\n\n```\nIn [7]: doc_index = 2000\n...: interpret_classification_model_prediction(doc_index=doc_index,\
  \ corpus=norm_test_reviews,\ncorpus=test_reviews, prediction_labels=test_sentiments,\n\
  explainer_obj=explainer)\n测试文档索引: 2000\n实际情感: positive\n预测情感: ['positive']\n评论:\
  \ I really liked the Movie \"JOE.\" It has really become a cult classic among certain\
