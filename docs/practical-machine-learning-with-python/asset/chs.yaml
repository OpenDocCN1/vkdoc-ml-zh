  ### 统计方法


  另一种广泛使用的基于过滤器的特征选择方法，其原理稍显复杂，是根据单变量统计检验来选择特征。你可以使用多种统计检验方法用于回归和分类模型，包括互信息、ANOVA（方差分析）和卡方检验。根据这些统计检验得出的分数，你可以依据分数选择最佳特征。现在，让我们加载一个包含
  30 个特征的示例数据集。该数据集被称为威斯康星州诊断乳腺癌数据集，其原生或原始格式也可在 UCI 机器学习库的[`https://archive.ics.uci.edu/ml/datasets/Breast+Cancer+Wisconsin+(Diagnostic`](https://archive.ics.uci.edu/ml/datasets/Breast+Cancer+Wisconsin+(Diagnostic)
  `) 获取。我们将使用 `scikit-learn` 来加载数据特征和响应类别变量。


  ```

