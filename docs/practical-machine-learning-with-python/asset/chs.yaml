  ...:

  ...: # 将测试评论转换为特征

  ...: cv_test_features = cv.transform(norm_test_reviews)

  ...: tv_test_features = tv.transform(norm_test_reviews)

  ...:

  ...: print(''BOW 模型:> 训练特征形状:'', cv_train_features.shape,

  '' 测试特征形状:'', cv_test_features.shape)

