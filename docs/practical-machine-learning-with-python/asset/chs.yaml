  现在，我们可以使用之前构建的`LabelEncoder`对象，并通过以下代码对这些新的数据观测值执行独热编码。见图 4-16。


  ![A448827_1_En_4_Fig16_HTML.jpg](img/A448827_1_En_4_Fig16_HTML.jpg)


  图 4-16.


