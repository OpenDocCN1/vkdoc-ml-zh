  卷积神经网络


  卷积神经网络（CNN）类似于我们在本书中讨论过的一般神经网络。额外的显式假设——输入是图像（张量）——使得 CNN 得到优化，并与通常的神经网络不同。正是这个显式假设使我们能够设计深度
  CNN，同时控制可训练参数的数量（与一般神经网络相比）。


  我们在第 1 章（“深度学习”部分）和第 4 章（“图像数据特征工程”部分）中简要提到了 CNN 的概念。然而，作为快速回顾，以下是值得重申的关键概念：


  *   **卷积层**：这是 CNN 与其他神经网络相比的关键区别组件。卷积层或 conv 层是一组可学习的滤波器。这些滤波器有助于捕获空间特征。它们通常很小（沿宽度和高度），但覆盖图像的完整深度（颜色范围）。在前向传播过程中，我们将滤波器滑过图像的宽度和高度，同时计算滤波器属性与任何位置输入之间的点积。输出是来自每个滤波器的二维激活图，然后将它们堆叠起来以获得最终输出。


  *   **池化层**：这些基本上是下采样层，用于减少空间大小和参数数量。这些层也有助于控制过拟合。池化层插入在卷积层之间。池化层可以使用诸如最大值、平均值、L2
  范数等函数执行下采样。


  *   **全连接层**：也称为 FC 层。这些类似于一般神经网络中的全连接层。它们与前一层的所有神经元都有完全连接。该层有助于执行分类任务。


  *   **参数共享**：除了卷积层之外，CNN 的独特之处在于参数共享。卷积层在所有滤波器中使用相同的权重集，从而减少了所需的总参数数量。


  一个包含所有组件的典型 CNN 架构如图 12-1 所示，这是一个 LeNet CNN 模型（来源：`deeplearning.net`）。


  ![A448827_1_En_12_Fig1_HTML.jpg](img/A448827_1_En_12_Fig1_HTML.jpg)


  图 12-1.


  LeNet CNN 模型（来源：deeplearning.net）


  CNN 已被深入研究，并且不断得到改进和实验。要深入了解 CNN，请参考诸如斯坦福大学的课程，网址为 [`http://cs231n.github.io/convolutional-networks`](http://cs231n.github.io/convolutional-networks)。


  使用 CNN 进行图像分类


  卷积神经网络是神经网络从图像中学习详细特征表示和模式并执行复杂任务（从对象识别到图像分类等等）的潜力和力量的主要例子。CNN 经历了巨大的研究，进步导致了更复杂和强大的架构，如
  VGG-16、VGG-19、Inception V3 以及许多其他有趣的模型。


  我们首先通过解决一个图像分类问题来获得一些 CNN 的实践经验。我们在第 4 章中通过 notebook `Bonus - Classifying handwritten
  digits using Deep CNNs.ipynb` 分享了一个基于 CNN 的分类示例，该示例讨论了通过利用基于 CNN 的深度学习来分类和预测人类手写数字。如果您还没有看过，请不要担心，因为我们将在本文中详细介绍一个示例。对于我们的深度学习需求，我们将使用带有
  `tensorflow` 后端的 keras 框架，类似于我们在前几章中使用的方式。


  问题陈述


  给定一组包含真实世界对象的图像，人类很容易识别它们。我们这里的任务是构建一个多类（10 个类或类别）图像分类器，该分类器可以识别给定图像的正确类别标签。对于此任务，我们将使用
  `CIFAR10` 数据集。


  数据集


  `CIFAR10` 数据集是一个包含跨越 10 个不同类别的带标签小图像的集合。该数据集由 Alex Krizhevsky、Vinod Nair 和 Geoffrey
  Hinton 收集，可在 [ `https://www.cs.toronto.edu/~kriz/cifar.html` ](https://www.cs.toronto.edu/%7Ekriz/cifar.html)
  以及通过 keras 中的 datasets 模块获得。


  该数据集包含大小为 32 x 32 的小图像，有 50,000 个训练样本和 10,000 个测试样本。每个图像只能属于以下类别之一。


  *   汽车

  *   飞机

  *   鸟

  *   猫

  *   鹿

  *   狗

  *   青蛙

  *   马

  *   船

  *   卡车


  每个类别是互斥的。还有一个更大的版本称为 `CIFAR100`。出于本节的目的，我们将考虑 `CIFAR10` 数据集。


  我们将通过 `keras.datasets` 模块访问 `CIFAR10` 数据集。如果所需文件不存在，请下载它们。


  从头开始构建基于 CNN 的深度学习分类器


  与任何机器学习算法类似，神经网络也需要输入数据具有特定的形状、大小和类型。因此，在进入建模步骤之前，首先要做的是对数据本身进行预处理。以下代码片段获取数据集，然后对标签执行独热编码。请记住，有
  10 个类别需要处理，因此我们处理的是一个多类分类问题。


  ```

  In [1]: import keras

  ...: from keras.datasets import cifar10

  ...:

  ...: num_classes = 10

  ...:

  ...: (x_train, y_train), (x_test, y_test) = cifar10.load_data()

  ...:

  ...: # 将类别向量转换为二进制类别矩阵

  ...: y_train = keras.utils.to_categorical(y_train, num_classes)

  ...: y_test = keras.utils.to_categorical(y_test, num_classes)

  ```


  如果数据集尚未在本地存在，则会自动下载。以下是所获得对象的形状。


  ```

  In [2]: print(''x_train 形状:'', x_train.shape)

  ...: print(x_train.shape[0], ''训练样本'')

  ...: print(x_test.shape[0], ''测试样本'')

  ...:

  x_train 形状: (50000, 32, 32, 3)

  50000 训练样本

  10000 测试样本

  ```


  现在我们有了训练和测试数据集。下一步是构建 CNN 模型。由于我们有二维图像（第三维是通道信息），我们将使用 `Conv2D` 层。正如前一节所讨论的，CNN
  使用卷积层和池化层的组合，后跟一个全连接端来识别/分类数据。模型架构构建如下。


  ```

  In [3]: model = Sequential()

  ...: model.add(Conv2D(32, kernel_size=(3, 3),

  ...:                         activation=''relu'',

  ...:                         input_shape=input_shape))

  ...: model.add(Conv2D(64, (3, 3), activation=''relu''))

  ...: model.add(MaxPooling2D(pool_size=(2, 2)))

  ...: model.add(Dropout(0.25))

  ...: model.add(Flatten())

  ...: model.add(Dense(128, activation=''relu''))

  ...: model.add(Dropout(0.5))

  ...: model.add(Dense(num_classes, activation=''softmax''))

  ```


  它从一个卷积层开始，总共有 32 个 3 x 3 滤波器，激活函数为修正线性单元（`relu`）。输入形状对应于每个图像的大小，即 32 x 32 x 3（彩色图像有三个通道——RGB）。接着是另一个卷积层和一个最大池化层。最后，我们有全连接密集层。由于我们有
  10 个类别可供选择，最终输出层具有 `softmax` 激活函数。


  下一步涉及编译。我们使用 `categorical_crossentropy` 作为损失函数，因为我们处理的是多个类别。除此之外，我们使用 Adadelta 优化器，然后在训练数据上训练分类器。以下代码片段展示了这一点。


  ```

  In [4]: model.compile(loss=keras.losses.categorical_crossentropy,

  ...:                 optimizer=keras.optimizers.Adadelta(),

  ...:                 metrics=[''accuracy''])

  ...:

  ...: model.fit(x_train, y_train,

  ...:                 batch_size=batch_size,

  ...:                 epochs=epochs,

  ...:                 verbose=1)

  Epoch 1/10

  50000/50000 [==============================] - 256s - loss: 7.3118 - acc: 0.1798

  Epoch 2/10

  50000/50000 [==============================] - 250s - loss: 1.7923 - acc: 0.3564

  Epoch 3/10

  50000/50000 [==============================] - 252s - loss: 1.5781 - acc: 0.4383

  ...

  Epoch 9/10

  50000/50000 [==============================] - 251s - loss: 1.1019 - acc: 0.6163

  Epoch 10/10

  50000/50000 [==============================] - 254s - loss: 1.0584 - acc: 0.6284

  ```


  从上面的输出可以清楚地看出，我们训练了模型 10 个 epoch。这在 CPU 上需要 200-400 秒，使用 GPU 时性能会成倍提高。根据最后一个 epoch，我们可以看到准确率约为
  63%。我们现在将评估测试性能，这使用模型对象的 evaluate 函数进行检查。结果如下。


  ```

  测试损失: 1.10143025074

  测试准确率: 0.6354

  ```


  因此，我们可以看到，我们非常简单的基于 CNN 的深度学习模型达到了 63.5% 的准确率，考虑到我们构建了一个非常简单的模型，并且没有进行太多预处理或模型调优。我们鼓励您尝试不同的
  CNN 架构，并进行超参数调优实验，看看如何改进结果。


  模型的前几个卷积层大致用于特征提取，而最后几层（全连接层）有助于对数据进行分类。因此，看看我们刚刚创建的 `conv-net` 如何处理图像数据将会很有趣。幸运的是，keras
  提供了在模型中间步骤提取信息的钩子。它们展示了图像的各个区域如何激活卷积层，以及如何提取相应的特征表示和模式。


  ![A448827_1_En_12_Fig2_HTML.jpg](img/A448827_1_En_12_Fig2_HTML.jpg)


