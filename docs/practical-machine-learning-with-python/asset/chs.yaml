  15 个特征构建的另一个模型进行比较。对于模型评估，我们将使用准确率指标（正确预测的百分比）并采用五折交叉验证方案。我们将在第 5 章详细介绍模型评估和调优策略，所以如果你现在无法理解某些术语，请不要灰心。这里的主要目的是比较在不同特征集上训练的模型之间的预测性能。




