  \n我们已经使用几种技术成功构建了一个不错的葡萄酒品质分类器，并且也看到了模型调优和验证的重要性。让我们采用我们最好的模型，并对其执行一些模型解释任务，以尝试更好地理解它。首先，我们可以查看数据集中各种特征的特征重要性排名。以下代码片段显示了使用\
  \ `skater` 以及从 `scikit-learn` 模型本身获得的默认特征重要性的比较特征重要性图。我们使用 `skater` 构建了一个 `Interpretation`\
  \ 和 `InMemoryModel` 对象，这对于我们未来在模型解释中的分析将很有用。\n\n![A448827_1_En_9_Fig29_HTML.jpg](img/A448827_1_En_9_Fig29_HTML.jpg)\n\
  \n图 9-29.\n\n从我们调优后的随机森林模型获得的比较特征重要性分析\n\n```\nIn [31]: from skater.core.explanations\
  \ import Interpretation\n...: from skater.model import InMemoryModel\n...: # leveraging\
  \ skater for feature importances\n...: interpreter = Interpretation(wqp_test_SX,\
  \ feature_names=wqp_feature_names)\n...: wqp_im_model = InMemoryModel(wqp_rf.predict_proba,\
  \ examples=wqp_train_SX,\ntarget_names=wqp_rf.classes_)\n...: # retrieving feature\
  \ importances from the scikit-learn estimator\n...: wqp_rf_feature_importances =\
  \ wqp_rf.feature_importances_\n...: wqp_rf_feature_names, wqp_rf_feature_scores\
  \ = zip(*sorted(zip(wqp_feature_names,\nwqp_rf_feature_importances), key=lambda\
  \ x: x[1]))\n...: # plot the feature importance plots\n...: f, (ax1, ax2) = plt.subplots(1,\
  \ 2, figsize=(10, 3))\n...: t = f.suptitle('Feature Importances for Random Forest',\
  \ fontsize=12)\n...: f.subplots_adjust(top=0.85, wspace=0.6)\n...: y_position =\
  \ list(range(len(wqp_rf_feature_names)))\n...: ax1.barh(y_position, wqp_rf_feature_scores,\
  \ height=0.6, align='center',\ntick_label=wqp_rf_feature_names)\n...: ax1.set_title(\"\
  Scikit-Learn\")\n...: ax1.set_xlabel('Relative Importance Score')\n...: ax1.set_ylabel('Feature')\n\
  ...: plots = interpreter.feature_importance.plot_feature_importance(wqp_im_model,\n\
  ascending=False, ax=ax2)\n...: ax2.set_title(\"Skater\")\n...: ax2.set_xlabel('Relative\
  \ Importance Score')\n...: ax2.set_ylabel('Feature')\n```\n\n我们可以从图 9-29 中清楚地观察到，最重要的特征在两个图中是一致的，考虑到我们只是在同一个模型上使用不同的接口，这是意料之中的。前两个特征是体积酒精含量和挥发酸含量。我们稍后将使用它们进行进一步分析。但现在，让我们看看模型的\
  \ ROC 曲线和曲线下面积 (AUC) 统计量。绘制二元分类器的 ROC 曲线很容易，但是当你处理多类分类器（在我们的例子中是 3 类）时，你该怎么办？有几种方法可以做到这一点。你需要对输出进行二值化。一旦执行了此操作，你可以为每个类别标签绘制一条\
  \ ROC 曲线。除此之外，你还可以遵循两种聚合指标来计算平均 ROC 度量。微平均涉及通过将每个预测元素视为二元预测来在整个预测空间上绘制 ROC 曲线。因此，每个预测分类决策被赋予相等的权重。宏平均涉及在平均时给予每个类别标签相等的权重。我们的\
  \ `model_evaluation_utils` 模块有一个漂亮的、可定制的函数 `plot_model_roc_curve(...)`，它可以帮助绘制具有微平均和宏平均功能的多类分类器\
  \ ROC 曲线。我们建议你查看代码，它非常不言自明。现在让我们为我们的随机森林分类器绘制 ROC 曲线。\n\n![A448827_1_En_9_Fig30_HTML.jpg](img/A448827_1_En_9_Fig30_HTML.jpg)\n\
  \n图 9-30.\n\n我们调优后的随机森林模型的 ROC 曲线\n\n```\nIn [32]: meu.plot_model_roc_curve(wqp_rf,\
  \ wqp_test_SX, wqp_test_y)\n```\n\n你可以在图 9-30 中看到我们调优后的随机森林模型的各种 ROC 图（每个类别和平均）。根据我们所看到的，AUC\
  \ 相当不错。虚线表示每个类别的 ROC 曲线，粗线是宏平均和微平均 ROC 曲线。现在让我们重新审视我们最重要的两个特征——酒精和挥发酸。让我们使用它们并尝试绘制随机森林模型的决策面/边界，类似于我们之前在\
