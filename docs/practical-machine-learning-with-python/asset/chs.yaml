  因此，从上面的样本输出中，我们可以看到我们的情感类别标签是如何被编码为数值表示，进而被转换为独热编码向量的。我们在本节中使用的特征工程技术（步骤 3）是基于词嵌入概念的更高级的词向量化技术。我们将使用
  `word2vec` 和 GloVe 模型来生成嵌入。`word2vec` 模型由 Google 构建，我们在第 4 章的“词嵌入”部分对此进行了详细介绍。在这种情况下，我们将选择大小参数为
  500，表示每个词的特征向量大小为 500。


  ```

  In [9]: # 构建 word2vec 模型

  ...: w2v_num_features = 500

  ...: w2v_model = gensim.models.Word2Vec(tokenized_train, size=w2v_num_features,
  window=150,

  ...:                                    min_count=10, sample=1e-3)

  ```


  我们将使用第 4 章中关于此模型的文档词向量平均方案，将每条电影评论表示为评论中不同词的所有词向量表示的平均向量。以下函数帮助我们计算任何文本文档语料库的平均词向量表示。


  ```

  def averaged_word2vec_vectorizer(corpus, model, num_features):

  vocabulary = set(model.wv.index2word)

  def average_word_vectors(words, model, vocabulary, num_features):

  feature_vector = np.zeros((num_features,), dtype="float64")

  nwords = 0.

  for word in words:

  if word in vocabulary:

  nwords = nwords + 1.

  feature_vector = np.add(feature_vector, model[word])

  if nwords:

  feature_vector = np.divide(feature_vector, nwords)

  return feature_vector

  features = [average_word_vectors(tokenized_sentence, model, vocabulary, num_features)

  for tokenized_sentence in corpus]

  return np.array(features)

  ```


  我们现在可以使用前面的函数在我们的两个电影评论数据集上生成平均词向量表示。


  ```

  In [10]: # 从 word2vec 模型生成平均词向量特征

  ...: avg_wv_train_features = averaged_word2vec_vectorizer(corpus=tokenized_train,

  ...:                                                 model=w2v_model, num_features=500)

  ...: avg_wv_test_features = averaged_word2vec_vectorizer(corpus=tokenized_test,

  ...:                                                 model=w2v_model, num_features=500)

  ```


  GloVe 模型，全称为全局向量，是一种用于获取词向量表示的无监督模型。该模型由斯坦福大学创建，在各种语料库（如维基百科、Common Crawl 和 Twitter）上进行训练，并且提供了相应的预训练词向量，可用于我们的分析需求。有关更多详细信息，您可以参考
  Jeffrey Pennington、Richard Socher 和 Christopher D. Manning 于 2014 年发表的原始论文，题为 [GloVe:
  Global Vectors for Word Representation](https://nlp.stanford.edu/pubs/glove.pdf#_blank)。`spacy`
  库提供了使用 GloVe 模型在 Common Crawl 语料库上训练的 300 维词向量。它们提供了一个简单的标准接口来获取每个词的 300 维特征向量以及整个文本文档的平均特征向量。以下代码片段利用
  `spacy` 为我们的两个数据集获取 GloVe 嵌入。请注意，您也可以通过利用其他预训练模型，或使用 [`https://nlp.stanford.edu/projects/glove`](https://nlp.stanford.edu/projects/glove)
  上提供的资源（包含预训练词嵌入、代码和示例）在自己的语料库上构建模型，来构建您自己的 GloVe 模型。


  ```

  In [11]: # 使用 GloVe 模型进行特征工程

  ...: train_nlp = [tn.nlp(item) for item in norm_train_reviews]

  ...: train_glove_features = np.array([item.vector for item in train_nlp])

  ...:

  ...: test_nlp = [tn.nlp(item) for item in norm_test_reviews]

  ...: test_glove_features = np.array([item.vector for item in test_nlp])

  ```


