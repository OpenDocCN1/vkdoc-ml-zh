  #### Box-Cox 变换


  现在让我们来看 Box-Cox 变换，这是属于幂变换函数族的另一个流行函数。该函数有一个前提条件，即待变换的数值必须为正（与对数变换的要求类似）。如果数值为负，则可以使用常数进行平移。从数学上讲，Box-Cox
  变换函数可以定义为：


  ![$$ y=f\left(x,\lambda \right)={x}^{\lambda }=\left\{\begin{array}{l}\frac{x^{\lambda
  }-1}{\lambda}\; for\;\lambda >0\\ {}{\log}_e(x)\; for\;\lambda =0\end{array}\right\}
  $$](img/A448827_1_En_4_Chapter_Equa.gif)


  这样，得到的变换输出 y 是输入 x 和变换参数 λ 的函数，当 λ = 0 时，结果变换就是我们之前讨论的自然对数变换。λ 的最优值通常通过最大似然估计或对数似然估计来确定。让我们对开发者收入特征应用
  Box-Cox 变换。为此，首先我们通过以下代码从数据分布中移除空值，从而获得最优的 lambda 值。


  ```

  In [26]: # get optimal lambda value from non null income values

  ...: income = np.array(fcc_survey_df[''Income''])

  ...: income_clean = income[∼np.isnan(income)]

  ...: l, opt_lambda = spstats.boxcox(income_clean)

  ...: print(''Optimal lambda value:'', opt_lambda)

  Optimal lambda value: 0.117991239456

  ```


  现在我们已经获得了最优的 λ 值，让我们对 λ = 0 和 λ = λ [最优] 这两个 λ 值使用 Box-Cox 变换，并转换与开发者收入相关的原始数值。


  ![A448827_1_En_4_Fig13_HTML.jpg](img/A448827_1_En_4_Fig13_HTML.jpg)


  图 4-13.


  Box-Cox 变换后开发者收入分布的数据框


  ```

  In [27]: fcc_survey_df[''Income_boxcox_lambda_0''] = spstats.boxcox((1+fcc_survey_df[''Income'']),

  ...:                                                          lmbda=0)

  ...: fcc_survey_df[''Income_boxcox_lambda_opt''] = spstats.boxcox(fcc_survey_df[''Income''],

  ...:                                                            lmbda=opt_lambda)

  ...: fcc_survey_df[[''ID.x'', ''Age'', ''Income'', ''Income_log'',

  ...:                ''Income_boxcox_lambda_0'', ''Income_boxcox_lambda_opt'']].iloc[4:9]

  ```


  图 4-13 所示输出中获得的数据框展示了在 `Income_boxcox_lambda_0` 和 `Income_boxcox_lambda_opt` 字段中，分别对
  λ = 0 和 λ = λ [最优] 应用 Box-Cox 变换后的收入特征。同时，正如预期的那样，`Income_log` 字段的值与 λ = 0 时的 Box-Cox
  变换值相同。现在，让我们绘制使用最优 lambda 的 Box-Cox 变换后开发者值的数据分布。见图 4-14。


  ![A448827_1_En_4_Fig14_HTML.jpg](img/A448827_1_En_4_Fig14_HTML.jpg)


  图 4-14.


  Box-Cox 变换后（λ = λ[最优]）开发者收入分布的直方图


  ```

  In [30]: income_boxcox_mean = np.round(np.mean(fcc_survey_df[''Income_boxcox_lambda_opt'']),
  2)

  ...:

  ...: fig, ax = plt.subplots()

  ...: fcc_survey_df[''Income_boxcox_lambda_opt''].hist(bins=30, color=''#A9C5D3'')

  ...: plt.axvline(income_boxcox_mean, color=''r'')

  ...: ax.set_title(''Developer Income Histogram after Box–Cox Transform'', fontsize=12)

  ...: ax.set_xlabel(''Developer Income (Box–Cox transform)'', fontsize=12)

  ...: ax.set_ylabel(''Frequency'', fontsize=12)

  ...: ax.text(24, 450, r''$\mu$=''+str(income_boxcox_mean), fontsize=10)

