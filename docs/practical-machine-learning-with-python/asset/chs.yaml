  #### 数据操作


  在本书的后续章节中，`pandas` 数据框将是我们进行大多数数据处理和数据整理操作的首选数据结构。因此，我们想花更多时间探索一些可以使用特定函数在数据框上执行的重要操作。


  ##### Values 属性


  每个 `pandas` 数据框都有某些属性。其中一个重要的属性是 `values`。它之所以重要，是因为它允许我们访问存储在数据框中的原始值，并且如果这些值都是同质的（即类型相同），那么我们可以对它们使用
  `numpy` 操作。当我们的数据是数值和其他数据类型的混合，并且经过一些选择和计算后，我们得到了所需的数值数据子集时，这一点就变得很重要。使用输出数据框的 `values`
  属性，我们可以像对待 `numpy` 数组一样对待它。这在处理机器学习中的特征集时非常有用。传统上，`numpy` 的向量化操作比基于函数的数据框操作要快得多。


  ```

