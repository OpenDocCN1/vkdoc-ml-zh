  \n聚类以发现细分群体\n\n我们将使用 K-means 聚类算法来发现数据中的簇（或细分群体）。这是我们可以采用的最简单的聚类算法之一，因此它在实践中被广泛使用。在继续使用该算法在我们的数据中寻找细分群体之前，我们将先简要介绍该算法。\n\
  \nK-Means 聚类\n\nK-means 聚类属于基于划分/基于质心的聚类算法家族。K-means 算法用于划分数据的步骤如下：\n\n1.  算法从随机初始化所需数量的中心点开始。K-means\
  \ 中的“K”代表簇的数量。\n2.  在下一步中，每个数据点被分配给离它最近的中心点。K-means 聚类中使用的距离度量是标准的欧几里得距离。\n3.  数据点分配完成后，通过对属于该簇的点的维度进行平均来重新计算中心点。\n\
  4.  使用新的中心点重复此过程，直到分配变得稳定。在这种情况下，算法终止。\n\n我们将改编 `scikit-learn` 文档中给出的代码（位于 [ `http://scikit-learn.org/stable/auto_examples/cluster/plot_kmeans_silhouette_analysis.html`\
  \ ](http://scikit-learn.org/stable/auto_examples/cluster/plot_kmeans_silhouette_analysis.html)），并使用轮廓系数在我们的聚类过程中找出最佳簇数。我们将其留作练习，让你改编代码并创建图\
  \ 8-6 中的可视化。我们鼓励你修改文档中的代码，不仅要构建可视化，还要将每个簇的中心点和轮廓系数捕获到字典中，因为我们在分析所获得的客户细分群体时需要引用这些信息。当然，如果你觉得难以应对，你始终可以参考\
  \ `Customer Segmentation.ipynb` 笔记本中的详细代码片段。\n\n![A448827_1_En_8_Fig6_HTML.jpg](img/A448827_1_En_8_Fig6_HTML.jpg)\n\
