  `The Python Machine Learning Ecosystem.ipynb` 的 Jupyter 笔记本以获得更具交互性的体验。




  ## Python：简介


  Python 由荷兰数学与计算机科学国家研究所（CWI，参见 [`https://www.cwi.nl/`](https://www.cwi.nl/) ）的吉多·范罗苏姆创建。Python
  的第一个版本于 1991 年发布。吉多编写 Python 是为了作为 ABC 语言的继任者。在随后的几年里，Python 已发展成为一种广泛使用的高级语言和通用编程语言。Python
  是一种解释型语言，这意味着 Python 程序的源代码会被转换为字节码，然后由 Python 虚拟机执行。Python 与 C 和 C++ 等主流编译型语言不同，因为
  Python 代码不需要像这些语言的代码那样进行构建和链接。这一区别带来了两个重要特点：


  *   Python 代码开发速度快：由于代码无需编译和构建，Python 代码可以更轻松地修改和执行。这造就了快速的开发周期。

  *   Python 代码执行速度不快：由于代码不是直接编译执行的，而是由额外的 Python 虚拟机层负责执行，因此与 C、C++ 等传统语言相比，Python
  代码运行速度稍慢。


  ### 优势


  Python 在广泛使用的编程语言排行榜上稳步上升，根据多项调查和研究，它是世界上第五重要的语言。最近几项调查显示，Python 是机器学习和数据科学领域最受欢迎的语言！我们将简要列出
  Python 提供的优势，这或许可以解释其流行原因。


  1.  易于学习：Python 是一种相对容易学习的语言。对于初学者来说，其语法简单易懂。与 C 或 Java 等语言相比，执行 Python 程序所需的样板代码极少。

  2.  支持多种编程范式：Python 是一种多范式、多用途的编程语言。它支持面向对象编程、结构化编程、函数式编程，甚至面向方面编程。这种多功能性使其能被众多程序员使用。

  3.  可扩展性：Python 的可扩展性是其最重要的特性之一。Python 拥有大量易于获取的模块，可以随时安装和使用。这些模块涵盖了从数据访问到流行算法实现的编程各个方面。这种易于扩展的特性确保了
  Python 开发人员的工作效率更高，因为大量问题都可以通过现有的库来解决。

  4.  活跃的开源社区：Python 是开源的，并得到了庞大开发者社区的支持。这使其健壮且适应性强。遇到的错误很容易被 Python 社区修复。由于是开源的，如果需求允许，开发人员可以修改
  Python 的源代码。


  ### 缺点


  尽管 Python 是一种非常流行的编程语言，但它也有自身的缺点。它最重要的限制之一在于执行速度。作为一种解释型语言，与编译型语言相比，它的速度较慢。在需要极高性能代码的场景下，这一限制可能会有些束缚。这是
  Python 未来实现需要改进的主要领域，后续的每个 Python 版本都在解决这个问题。尽管我们必须承认它永远无法像编译型语言那样快，但我们相信它通过在其他方面的高效和有效弥补了这一不足。


  ### 设置 Python 环境


  我们进入数据科学世界的第一步是设置 Python 环境。我们通常有两种选择来设置环境：


  *   单独安装 Python 和必要的库

  *   使用预打包的 Python 发行版，其中包含必要的库，即 Anaconda


  Anaconda 是一个打包的 Python 编译版本，附带一整套各种库，包括数据科学中广泛使用的核心库。由 Anaconda（前身为 Continuum Analytics）开发，它通常是数据科学家的首选设置。`numpy`
  和 `scipy` 库的主要贡献者特拉维斯·奥利芬特是 Anaconda 的总裁兼联合创始人之一。Anaconda 发行版采用 BSD 许可，因此允许我们将其用于商业和再分发目的。该发行版的一个主要优势是我们不需要复杂的设置，并且它在所有类型的操作系统和平台上都能良好运行，尤其是
  Windows，它经常在安装特定 Python 包时引发问题。因此，只需一次下载和安装，我们就可以开始数据科学之旅。Anaconda 发行版广泛应用于行业数据科学环境，它还附带了一个出色的
  IDE——Spyder（科学 Python 开发环境），以及其他有用的工具，如 jupyter notebooks、IPython 控制台和优秀的包管理工具 `conda`。最近，他们还广泛讨论了
  Jupyterlab，这是 Project Jupyter 的下一代用户界面。我们建议使用 Anaconda 发行版，并查看 [`https://www.anaconda.com/what-is-anaconda/`](https://www.anaconda.com/what-is-anaconda/)
  以了解更多关于 Anaconda 的信息。


