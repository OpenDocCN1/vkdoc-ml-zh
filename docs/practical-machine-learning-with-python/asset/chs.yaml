  \n为了结束我们对模型解释的讨论，我们将讨论部分依赖图以及它们在我们的场景中的用处。通常，部分依赖有助于描述一个特征对模型预测决策的边际影响或影响，同时保持其他特征不变。由于可视化高维特征空间非常困难，通常使用一个或两个有影响且重要的特征来可视化部分依赖图。`scikit-learn`\
  \ 框架具有诸如 `partial_dependence(...)` 和 `plot_partial_dependence(...)` 之类的函数，但不幸的是，在撰写本书时，这些函数仅适用于像\
  \ GBM 这样的提升模型。`skater` 的美妙之处在于，我们可以在任何模型上构建部分依赖图，包括我们调优后的随机森林模型。我们将利用 `skater` 的\
  \ `Interpretation` 对象 `interpreter` 和基于我们之前计算特征重要性时创建的随机森林模型的 `InMemoryModel` 对象\
  \ `wqp_im_model`。以下代码基于最重要的特征 `alcohol` 描绘了我们模型预测函数的单向部分依赖图。\n\n![A448827_1_En_9_Fig34_HTML.jpg](img/A448827_1_En_9_Fig34_HTML.jpg)\n\
  \n图 9-34.\n\n基于酒精的随机森林模型预测器的单向部分依赖图\n\n```\nIn [36]: axes_list = interpreter.partial_dependence.plot_partial_dependence(['alcohol'],\n\
  ...:               wqp_im_model, grid_resolution=100, with_variance=True, figsize\
  \ = (4, 3))\n...: axs = axes_list[0][3:]\n...: [ax.set_ylim(0, 1) for ax in axs];\n\
  ```\n\n从图 9-34 的图中，我们可以看到，随着酒精含量的增加，模型预测器预测葡萄酒为中等或高品质的置信度/概率增加，同样地，预测葡萄酒为低品质的概率降低。这表明类别预测与酒精含量之间存在一定的关系，并且酒精对\
  \ `high` 类别预测的影响相当低，考虑到高品质葡萄酒的训练样本较少，这是意料之中的。现在让我们绘制双向部分依赖图，以解释我们的随机森林预测器对酒精和挥发酸（前两个有影响力的特征）的依赖关系。\n\
  \n![A448827_1_En_9_Fig35_HTML.jpg](img/A448827_1_En_9_Fig35_HTML.jpg)\n\n图 9-35.\n\
  \n基于酒精和挥发酸的随机森林模型预测器的双向部分依赖图\n\n```\nIn [42]: plots_list = interpreter.partial_dependence.plot_partial_dependence([('alcohol',\n\
  ...:                                                               'volatile acidity')],\n\
  ...:                    wqp_im_model, n_samples=1000, figsize=(10, 5), grid_resolution=100)\n\
  ...: axs = plots_list[0][3:]\n...: [ax.set_zlim(0, 1) for ax in axs];\n```\n\n图\
  \ 9-35 中的图与图 9-34 中的图有一些相似之处。对于预测高品质葡萄酒，由于缺乏训练数据，虽然随着酒精的增加和挥发酸的相应减少，对高品质葡萄酒类别预测存在一些依赖性，但相当弱，正如我们在最左边的图中看到的那样。对于低品质葡萄酒类别预测，似乎也存在很强的依赖性，伴随着酒精的减少和挥发酸水平的增加。这在最右边的图中清晰可见。中间的图讨论了中等品质葡萄酒类别预测。我们可以观察到预测与酒精的相应增加和挥发酸水平的减少有很强的依赖性。这应该为你利用部分依赖图更深入地研究模型解释打下良好的基础。\n\
  \n总结\n\n在这个以案例研究为导向的章节中，我们处理、分析并建模了一个关于葡萄酒样品的数据集，重点关注类型和品质评级。特别强调了探索性数据分析，而这往往是急于构建和部署模型的数据科学家所忽视的。我们探索了与葡萄酒数据集中各种特征相关的一些领域背景，并对其进行了详细解释。我们建议在解决问题时始终探索你所处的领域，并在需要时寻求领域专家的帮助，同时关注数学、机器学习和分析。\n\
  \n我们研究了分析和可视化数据及其特征的多种方法，包括描述性和推断性统计以及单变量和多变量分析。详细解释了可视化分类和多维数据的特殊技术。目的是让你在这些原则的基础上，将来在自己的数据集上重用类似的原理和代码来可视化属性和关系。本章的两个主要目标是构建预测模型，以根据各种物理化学葡萄酒属性预测葡萄酒的类型和品质。我们涵盖了各种预测模型，包括像逻辑回归这样的线性模型和像深度神经网络这样的复杂模型。除此之外，我们还涵盖了基于树的模型，如决策树，以及集成模型，如随机森林和非常流行的极端梯度提升模型。详细介绍了模型训练、预测、评估、调优和解释的各个方面。我们建议你不仅要构建模型，还要使用验证指标对其进行彻底评估，在必要时使用超参数调优，并利用集成建模来构建稳健、泛化且优越的模型。还特别关注了解释模型的概念和技术，包括分析特征重要性、可视化模型\
  \ ROC 曲线和决策面、解释模型预测以及可视化部分依赖图。\n\n10. 分析音乐趋势与推荐\n\n推荐引擎可能是最流行和最知名的机器学习应用之一。许多不属于机器学习社区的人通常认为推荐引擎是其唯一用途。尽管我们知道机器学习有一个广阔的子空间，推荐引擎只是其中之一，但不可否认推荐引擎的流行。它们流行的原因之一是其无处不在的性质；任何以任何方式上网的人，都以某种形式接触过推荐引擎。它们用于推荐电子商务网站上的产品、旅游门户网站上的旅行目的地、流媒体网站上的歌曲/视频、食品聚合门户网站上的餐厅等。一个长长的列表强调了它们的普遍应用。\n\
  \n推荐引擎的流行源于关于它们的两个非常重要的点：\n\n*   它们易于实现：推荐引擎很容易集成到现有的工作流中。我们所需要的只是收集一些关于用户趋势和模式的数据，这些数据通常可以从业务的事务数据库中提取。\n\
  *   它们有效：这个说法对于我们讨论过的所有其他机器学习解决方案同样适用。但一个重要的区别在于，它们的下行风险非常有限。例如，考虑一个旅游门户网站，它从其数据集中推荐一组最受欢迎的地点。推荐系统可能是一个简单的系统，但仅仅它在用户面前的存在就可能引起用户的兴趣。公司当然可以通过开发复杂的推荐引擎来获益，但即使是一个非常简单的推荐引擎，也保证能以最小的投资带来一些回报。这一点使它们成为一个非常有吸引力的选择。\n\
  \n本章研究如何使用事务数据来开发不同类型的推荐引擎。我们将了解一个非常有趣的数据集的辅助数据集，“百万歌曲数据集”。我们将浏览用户的收听历史，然后使用它来开发多个具有不同复杂程度的推荐引擎。\n\
  \n百万歌曲数据集品味档案\n\n百万歌曲数据集是一个非常流行的数据集，可在 [`https://labrosa.ee.columbia.edu/millionsong/`](https://labrosa.ee.columbia.edu/millionsong/)\
  \ 获取。原始数据集包含跨越多年的大约一百万首歌曲的量化音频特征。该数据集是 Echonest ( [`http://the.echonest.com/`](http://the.echonest.com/)\
  \ ) 和 LABRosa ( [`http://labrosa.ee.columbia.edu/`](http://labrosa.ee.columbia.edu/)\
  \ ) 之间的合作项目。虽然我们不会直接使用这个数据集，但我们将使用它的一部分。\n\n从原始的百万歌曲数据集衍生出了几个其他数据集。其中一个数据集被称为 Echonest\
  \ 品味档案子集。这个特定的数据集是由 Echonest 与一些未公开的合作伙伴创建的。该数据集包含匿名用户对百万歌曲数据集中包含的歌曲的播放次数。品味档案数据集相当大，因为它包含大约\
  \ 4800 万行三元组。三元组包含以下信息：\n\n(用户 ID, 歌曲 ID, 播放次数)\n\n每一行给出了由用户 ID 标识的用户对由歌曲 ID 标识的歌曲的播放次数。整个数据集包含大约一百万个唯一用户，并且其中包含来自百万歌曲数据集的大约\
  \ 384,000 首歌曲。\n\n读者可以从 [`http://labrosa.ee.columbia.edu/millionsong/sites/default/files/challenge/train_triplets.txt.zip`](http://labrosa.ee.columbia.edu/millionsong/sites/default/files/challenge/train_triplets.txt.zip)\
  \ 下载数据集。压缩数据集的大小约为 500MB，解压缩后，你需要大约 3.5GB 的空间。下载并解压缩数据后，你将看到如何对数据集进行子集化以减小其大小。\n\
  \n百万歌曲数据集还有几个其他有用的辅助数据集。我们不会在这里详细介绍它们，但我们鼓励读者探索这些数据集，并发挥想象力开发创新的用例。\n\n探索性数据分析\n\
  \n探索性数据分析是任何数据分析工作流的重要组成部分。到目前为止，我们已经将这一事实牢固地植入了读者的脑海中。在处理大型数据集时，探索性数据分析变得更加重要，因为它通常会引导我们发现可以用来稍微缩减数据集的信息。正如我们将看到的，有时我们也会超越传统的数据访问工具，以规避大数据量带来的问题。\n\
  \n加载和修剪数据\n\n过程中的第一步是从未压缩的文件中加载数据。由于数据大小约为 3GB，我们不会加载完整的数据，而只会从数据集中加载指定数量的行。这可以通过使用\
  \ `pandas` 提供的 `read_csv` 函数的 `nrows` 参数来实现。\n\n```\nIn [2]: triplet_dataset = pd.read_csv(filepath_or_buffer=data_home+'train_triplets.txt',\n\
  ...: nrows=10000,sep='\\t', header=None, names=['user','song','play_count'])\n```\n\
  \n由于数据集没有标题，我们还向函数提供了列名。数据的子集如图 10-1 所示。\n\n![A448827_1_En_10_Fig1_HTML.jpg](img/A448827_1_En_10_Fig1_HTML.jpg)\n\
  \n图 10-1.\n\nEchonest 品味档案数据集中的样本行\n\n在这种大小的数据集中，我们可能想做的第一件事是确定我们应该考虑多少个唯一用户（或歌曲）。在原始数据集中，我们有大约一百万个用户，但我们想确定我们应该考虑的用户数量。例如，如果所有用户的\
  \ 20% 占了总播放次数的 80%，那么将我们的分析重点放在那 20% 的用户身上将是一个好主意。通常，这可以通过按用户（或按歌曲）汇总数据集并获得播放次数的累积和来完成。然后我们可以找出多少用户占了\
  \ 80% 的播放次数等。但由于数据量庞大，`pandas` 提供的累积求和函数会遇到麻烦。因此，我们将编写代码逐行读取文件，并提取用户（或歌曲）的播放次数信息。这也将作为读者在数据集大小超过其系统可用内存时可以使用的可能方法。下面的代码片段将逐行读取文件，提取所有用户的总播放次数，并将该信息持久化以备后用。\n\
  \n```\nIn [2]: output_dict = {}\n...: with open(data_home+'train_triplets.txt')\
  \ as f:\n...: for line_number, line in enumerate(f):\n...:      user = line.split('\\\
  t')[0]\n...:      play_count = int(line.split('\\t')[2])\n...:      if user in output_dict:\n\
  ...:          play_count +=output_dict[user]\n...:          output_dict.update({user:play_count})\n\
  ...:      output_dict.update({user:play_count})\n...: output_list = [{'user':k,'play_count':v}\
  \ for k,v in output_dict.items()]\n...: play_count_df = pd.DataFrame(output_list)\n\
  ...: play_count_df = play_count_df.sort_values(by = 'play_count', ascending = False)\n\
  ...: play_count_df.to_csv(path_or_buf='user_playcount_df.csv', index = False)\n\
  ```\n\n持久化的数据帧可以根据我们的需要加载和使用。我们可以使用类似的策略来提取每首歌曲的播放次数。数据集中的几行如图 10-2 所示。\n\n![A448827_1_En_10_Fig2_HTML.jpg](img/A448827_1_En_10_Fig2_HTML.jpg)\n\
  \n图 10-2.\n\n一些用户的播放次数\n\n我们想了解关于数据集的第一个信息是，我们需要多少用户才能占到总播放次数的 40% 左右。我们任意选择了 40%\
  \ 的值，以保持数据集大小可控；你可以尝试使用这些数字来获得不同大小的数据集，甚至可以利用像 Spark 这样基于 Hadoop 的大数据处理和分析框架来分析完整数据集！以下代码片段将确定占此数据百分比的那部分用户。在我们的例子中，大约\
  \ 10,0000 个用户占了 40% 的播放次数，因此我们将对这些用户进行子集化。\n\n```\nIn [2]: total_play_count = sum(song_count_df.play_count)\n\
  ...: (float(play_count_df.head(n=100000).play_count.sum())/total_play_count)*100\n\
  ...: play_count_subset = play_count_df.head(n=100000)\n```\n\n以类似的方式，我们可以确定解释总播放次数\
  \ 80% 所需的唯一歌曲数量。在我们的例子中，我们会发现 30,000 首歌曲占了大约 80% 的播放次数。这已经是一个伟大的发现，因为大约 10% 的歌曲贡献了\
  \ 80% 的播放次数。使用类似于前面给出的代码片段，我们可以确定此类歌曲的子集。利用这些歌曲和用户子集，我们可以对原始数据集进行子集化，使其仅包含过滤后的用户和歌曲。下面的代码片段使用这些数据帧来过滤原始数据集，然后将结果数据集持久化以备将来使用。\n\
  \n```\nIn [2]: triplet_dataset =\n...: pd.read_csv(filepath_or_buffer=data_home+'train_triplets.txt',sep='\\\
  t', header=None,\n...: names=['user','song','play_count'])\n...: triplet_dataset_sub\
  \ = triplet_dataset[triplet_dataset.user.isin(user_subset) ]\n...: del(triplet_dataset)\n\
  ...: triplet_dataset_sub_song =\n...: triplet_dataset_sub[triplet_dataset_sub.song.isin(song_subset)]\n\
  ...: del(triplet_dataset_sub)\n...: triplet_dataset_sub_song.to_csv(path_or_buf=data_home+'triplet_dataset_sub_song.csv',\
  \ index = False)\n```\n\n这种子集化将为我们提供一个包含大约 1000 万行元组的数据帧。我们将把它作为我们所有未来分析的起始数据集。你可以尝试使用这些数字来获得不同的数据集，并可能获得不同的结果。\n\
  \n增强数据\n\n我们加载的数据只是三元组数据，因此我们无法看到歌曲名称、艺术家名称或专辑名称。我们可以通过添加关于这些歌曲的信息来增强我们的数据。这些信息是百万歌曲数据库的一部分。这些数据以\
  \ SQLite 数据库文件的形式提供。首先，我们将从网页 [`https://labrosa.ee.columbia.edu/millionsong/pages/getting-dataset#subset`](https://labrosa.ee.columbia.edu/millionsong/pages/getting-dataset#subset)\
  \ 下载 `track_metadata.db` 文件来下载数据。\n\n下一步是将这个 SQLite 数据库读取到一个数据帧中，并通过将其与我们的三元组数据帧合并来提取曲目信息。我们还将删除一些我们不会用于分析的额外列。下面的代码片段将加载整个数据集，将其与我们子集化的三元组数据连接，并删除额外的列。\n\
  \n```\nIn [2]: conn = sqlite3.connect(data_home+'track_metadata.db')\n...: cur =\
  \ conn.cursor()\n...: cur.execute(\"SELECT name FROM sqlite_master WHERE type='table'\"\
  )\n...: cur.fetchall()\nOut[2]: [('songs',)]\n```\n\n上面片段的输出显示数据库包含一个名为 `songs`\
  \ 的表。我们将获取此表中的所有行并将其读入一个数据帧。\n\n```\nIn [5]: del(track_metadata_df_sub['track_id'])\n\
  ...: del(track_metadata_df_sub['artist_mbid'])\n...: track_metadata_df_sub = track_metadata_df_sub.drop_duplicates(['song_id'])\n\
  ...: triplet_dataset_sub_song_merged = pd.merge(triplet_dataset_sub_song, track_metadata_df_sub,\
  \ how='left', left_on='song', right_o\n...: n='song_id')\n...: triplet_dataset_sub_song_merged.rename(columns={'play_count':'listen_count'},inplace=True)\n\
  ...: del(triplet_dataset_sub_song_merged['song_id'])\n...: del(triplet_dataset_sub_song_merged['artist_id'])\n\
  ...: del(triplet_dataset_sub_song_merged['duration'])\n...: del(triplet_dataset_sub_song_merged['artist_familiarity'])\n\
  ...: del(triplet_dataset_sub_song_merged['artist_hotttnesss'])\n...: del(triplet_dataset_sub_song_merged['track_7digitalid'])\n\
  ...: del(triplet_dataset_sub_song_merged['shs_perf'])\n...: del(triplet_dataset_sub_song_merged['shs_work'])\n\
  ```\n\n最终的数据集，与三元组数据帧合并后，看起来类似于图 10-3 中的描述。这将构成我们探索性数据分析的起始数据帧。\n\n![A448827_1_En_10_Fig3_HTML.jpg](img/A448827_1_En_10_Fig3_HTML.jpg)\n\
  \n图 10-3.\n\n与歌曲元数据合并的播放次数数据集\n\n可视化分析\n\n在我们开始开发各种推荐引擎之前，让我们对我们的数据集进行一些可视化分析。我们将尝试查看关于歌曲、专辑和发行的不同趋势。\n\
  \n最受欢迎的歌曲\n\n我们可以为数据绘制的第一个信息是关于数据集中不同歌曲的流行度。我们将尝试确定数据集中的前 20 首歌曲。这种流行度的一个轻微修改也将作为我们最基本的推荐引擎。\n\
  \n以下代码片段为我们提供了数据集中最受欢迎的歌曲。\n\n```\nIn [7]: import matplotlib.pyplot as plt; plt.rcdefaults()\n\
  ...: import numpy as np\n...: import matplotlib.pyplot as plt\n...:\n...: popular_songs\
  \ = triplet_dataset_sub_song_merged[['title','listen_count']].groupby('title').sum().reset_index()\n\
  ...: popular_songs_top_20 = popular_songs.sort_values('listen_count', ascending=False).head(n=20)\n\
  ...: objects = (list(popular_songs_top_20['title']))\n...: y_pos = np.arange(len(objects))\n\
  ...: performance = list(popular_songs_top_20['listen_count'])\n...:\n...: plt.bar(y_pos,\
  \ performance, align='center', alpha=0.5)\n...: plt.xticks(y_pos, objects, rotation='vertical')\n\
  ...: plt.ylabel('Item count')\n...: plt.title('Most popular songs')\n...: plt.show()\n\
  ```\n\n代码片段生成的图如图 10-4 所示。该图显示，我们数据集中最受欢迎的歌曲是“You're the One”。我们还可以搜索我们的曲目数据帧，看看负责该特定曲目的乐队是\
  \ The Black Keys。\n\n![A448827_1_En_10_Fig4_HTML.jpg](img/A448827_1_En_10_Fig4_HTML.jpg)\n\
  \n图 10-4.\n\n最受欢迎的歌曲\n\n最受欢迎的艺术家\n\n读者可能感兴趣的下一信息是，数据集中最受欢迎的艺术家是谁？绘制此信息的代码与前面给出的代码非常相似，因此我们将不包含确切的代码片段。结果图如图\
  \ 10-5 所示。\n\n![A448827_1_En_10_Fig5_HTML.jpg](img/A448827_1_En_10_Fig5_HTML.jpg)\n\
  \n图 10-5.\n\n最受欢迎的艺术家\n\n我们可以从图中看出，根据我们的数据集，Coldplay 是最受欢迎的艺术家之一。一位敏锐的音乐爱好者可以看到，除了\
  \ Metallica 和 Radiohead 之外，我们并没有太多来自像 U2 或 The Beatles 这样的经典艺术家的代表。这强调了两个关键点——首先，数据主要来自不仅仅总是在线收听经典艺术家的那一代人；其次，很少有艺术家不是当代的，但在在线播放方面仍然得分很高。令人惊讶的是，在我们的数据集中，这种行为的唯一例子是\
  \ Metallica 和 Radiohead。它们起源于 1980 年代，但在在线播放次数方面仍然相当受欢迎。然而，在前十名艺术家中，展示了多样化的音乐流派，包括像\
  \ Eminem 这样的流行说唱歌手，像 Linkin Park 和 The Killers 这样的另类摇滚乐队，甚至像 Train 和 OneRepublic\
  \ 这样的流行/摇滚乐队，以及像 Radiohead 和 Metallica 这样的经典摇滚或金属乐队！\n\n另一个稍微不同的解读是，Coldplay 是最受欢迎的艺术家，但他们在前十名歌曲列表中没有候选者。这间接暗示了这些播放次数在其所有曲目中分布均匀。你可以将其作为练习，确定出现在图\
  \ 10-5 中的每位艺术家的歌曲播放分布。这将为你提供线索，了解该艺术家是拥有偏斜的还是均匀的流行度。这个想法可以进一步发展成一个成熟的推荐引擎。\n\n用户与歌曲分布\n\
  \n我们可以从数据集中寻求的最后一个信息是关于用户歌曲计数的分布。这些信息将告诉我们用户平均收听的歌曲数量是如何分布的。我们可以利用这些信息创建不同类别的用户，并据此修改推荐引擎。收听非常有限数量歌曲的用户可用于开发简单的推荐引擎，而为我们提供大量关于其行为洞察的用户则可以作为开发复杂推荐引擎的候选者。\n\
  \n在我们绘制该分布之前，让我们尝试找到关于该分布的一些统计信息。以下代码计算该分布，然后显示其汇总统计信息。\n\n```\nIn [11]: user_song_count_distribution\
  \ = triplet_dataset_sub_song_merged[['user','title']].groupby('user').count().reset_index().sort_values(by='title',\
  \ ascending = False)\n...: user_song_count_distribution.title.describe()\nOut[11]:\n\
  count    99996.000000\nmean       107.752160\nstd         79.741555\nmin       \
  \   1.000000\n25%         53.000000\n50%         89.000000\n75%        141.000000\n\
  max       1189.000000\nName: title, dtype: float64\n```\n\n这给了我们一些关于歌曲计数如何在用户之间分布的重要信息。我们看到，平均而言，一个用户会收听\
  \ 100 多首歌曲，但有些用户对歌曲多样化的胃口更大。让我们尝试可视化这个特定的分布。下面的代码将帮助我们绘制数据集中播放次数的分布。我们有意将箱数保持在一个较小的数量，因为这可以给出关于我们拥有的用户类别数量的近似信息。\n\
  \n```\nIn [12]: x = user_song_count_distribution.title\n...: n, bins, patches =\
  \ plt.hist(x, 50, facecolor='green', alpha=0.75)\n...: plt.xlabel('Play Counts')\n\
  ...: plt.ylabel('Probability')\n...: plt.title(r'$\\mathrm{Histogram\\ of\\ User\\\
  \ Play\\ Count\\ Distribution}\\ $')\n...: plt.grid(True)\n...: plt.show()\n```\n\
  \n代码生成的分布图如图 10-6 所示。该图清楚地显示，尽管最小和最大播放次数之间存在巨大差异，但分布的大部分质量集中在 100 多首歌曲计数上。\n\n![A448827_1_En_10_Fig6_HTML.jpg](img/A448827_1_En_10_Fig6_HTML.jpg)\n\
  \n图 10-6.\n\n用户播放次数的分布\n\n鉴于数据的性质，我们可以进行大量很酷的可视化；例如，绘制艺术家的热门曲目是如何被播放的，按年份划分的播放次数分布等。但我们相信，到目前为止，你已经具备了提出相关问题并通过可视化回答这些问题的技能。因此，我们将结束探索性数据分析，并进入本章的主要焦点，即推荐引擎的开发。但请随意尝试对此数据进行额外的分析和可视化，如果你发现了一些很酷的东西，像往常一样，请随时向本书的代码仓库发送拉取请求！\n\
  \n推荐引擎\n\n推荐引擎的工作简洁地体现在其名称中——它需要做的就是提出推荐。但我们必须承认，这种描述过于简单。推荐引擎是一种建模和重新排列关于用户偏好的可用信息，然后利用这些信息基于该信息提供知情推荐的方式。推荐引擎的基础始终是用户与产品之间记录下来的交互。例如，电影推荐引擎将基于用户对不同电影的评分；新闻文章推荐器将考虑用户过去阅读过的文章等。\n\
  \n本节使用用户-歌曲播放次数数据集来揭示我们可以向不同用户推荐新曲目的不同方式。我们将从一个非常基本的系统开始，并尝试线性地演变成一个复杂的推荐系统。在进入构建这些系统之前，我们将检查它们的效用以及推荐引擎的各种类型。\n\
  \n推荐引擎的类型\n\n不同推荐引擎的主要区别在于它们假设在生成推荐过程中最重要的实体。选择中心实体有多种选项，该选择将决定我们将开发的推荐引擎的类型。\n\n\
  *   基于用户的推荐引擎：在这些类型的推荐引擎中，用户是中心实体。算法将寻找用户之间的相似性，并基于这些相似性提出推荐。\n*   基于内容的推荐引擎：在推荐引擎光谱的另一端，我们有基于内容的推荐引擎。在这些引擎中，中心实体是我们试图推荐的内容；例如，在我们的例子中，实体将是我们试图推荐的歌曲。这些算法将尝试找到关于内容的特征并找到相似的内容。然后，这些相似性将被用来向最终用户提出推荐。\n\
  *   混合推荐引擎：这些类型的推荐引擎将同时考虑用户和内容的特征来开发推荐。它们有时也被称为协同过滤推荐引擎，因为它们通过利用内容和用户的相似性进行“协同”。这些是最有效的推荐引擎类别之一，因为它们吸收了两种推荐引擎类别的最佳特征。\n\
  \n推荐引擎的效用\n\n在上一章中，我们讨论了任何组织的一个重要需求，即了解客户。对于在线业务来说，这一需求变得更加重要，因为它们与客户几乎没有物理互动。推荐引擎为这些组织提供了绝佳的机会，不仅可以了解他们的客户群，还可以利用这些信息来增加收入。推荐引擎的另一个重要优势是它们潜在的下行风险非常有限。用户能做的最坏的事情就是忽略向他们提出的推荐。组织可以轻松地将一个粗糙的推荐引擎集成到与用户的交互中，然后根据其性能决定开发更复杂的版本。尽管关于推荐引擎对\
  \ Netflix、Amazon、YouTube 等主要在线服务提供商销售的影响经常有未经证实的说法，但一些论文提供了对其有效性的有趣见解。我们鼓励你阅读一篇这样的论文，网址为\
  \ [`http://ai2-s2-pdfs.s3.amazonaws.com/ba21/7822b81c3c9449014cb92e197d8a6baa4914.pdf`](http://ai2-s2-pdfs.s3.amazonaws.com/ba21/7822b81c3c9449014cb92e197d8a6baa4914.pdf)\
  \ 。该研究声称，一个好的推荐引擎往往会使销售量增加约 35%，并引导客户发现更多产品，这反过来又增加了积极的客户体验。在我们开始讨论各种推荐引擎之前，我们要感谢我们的朋友和\
  \ fellow 数据科学家、作者和课程讲师 Siraj Raval，他帮助我们完成了本章中与推荐引擎相关的大部分代码，并分享了他的代码库用于开发我们的推荐引擎（查看\
  \ Siraj 的 GitHub 仓库 [`https://github.com/llSourcell`](https://github.com/llSourcell)\
  \ ）。我们将修改他的一些代码示例，以开发我们在后续章节中讨论的推荐引擎。感兴趣的读者也可以查看 Siraj 的 YouTube 频道 [ `www.youtube.com/c/sirajology`\
  \ ](http://www.youtube.com/c/sirajology)，他在那里制作了关于机器学习、深度学习、人工智能和其他有趣教育内容的优秀视频。\n\
  \n基于流行度的推荐引擎\n\n最简单的推荐引擎自然是最容易开发的。由于我们可以轻松开发推荐引擎，这种类型的推荐引擎开发起来非常直接。这种推荐引擎的驱动逻辑是，如果某个项目被我们绝大多数用户喜欢（或收听），那么向尚未与该项目交互的用户推荐该项目是一个好主意。\n\
  \n开发这种推荐的代码非常简单，实际上只是一个汇总过程。为了开发这些推荐，我们将确定数据集中哪些歌曲拥有最多的用户收听，然后这将成为我们为每个用户提供的标准推荐集。下面的代码定义了一个函数，该函数将执行此汇总并返回结果数据帧。\n\
  \n```\nIn [1]:\ndef create_popularity_recommendation(train_data, user_id, item_id):\n\
  #Get a count of user_ids for each unique song as recommendation score\ntrain_data_grouped\
  \ = train_data.groupby([item_id]).agg({user_id: 'count'}).reset_index()\ntrain_data_grouped.rename(columns\
  \ = {user_id: 'score'},inplace=True)\n#Sort the songs based upon recommendation\
  \ score\ntrain_data_sort = train_data_grouped.sort_values(['score', item_id], ascending\
  \ = [0,1])\n#Generate a recommendation rank based upon score\ntrain_data_sort['Rank']\
  \ = train_data_sort['score'].rank(ascending=0, method='first')\n#Get the top 10\
  \ recommendations\npopularity_recommendations = train_data_sort.head(20)\nreturn\
  \ popularity_recommendations\nIn [2]: recommendations = create_popularity_recommendation(triplet_dataset_sub_song_merged,'user','title')\n\
  In [3]: recommendations\n```\n\n我们可以使用这个函数在我们的数据集上为每个用户生成前 10 条推荐。我们普通推荐系统的输出如图\
  \ 10-7 所示。在这里，你可以看到推荐与你在上一节中看到的最受欢迎歌曲列表非常相似，这是意料之中的，因为两者背后的逻辑是相同的——只是输出不同。\n\n![A448827_1_En_10_Fig7_HTML.jpg](img/A448827_1_En_10_Fig7_HTML.jpg)\n\
  \n图 10-7.\n\n基于流行度的推荐引擎的推荐\n\n基于项目相似度的推荐引擎\n\n在上一节中，我们见证了一个最简单的推荐引擎。在本节中，我们将处理一个稍微复杂一点的解决方案。这个推荐引擎基于计算用户项目与数据集中其他项目之间的相似度。\n\
  \n在我们进一步进行开发工作之前，让我们描述一下我们计划如何计算“项目-项目”相似度，这是我们的推荐引擎的核心。通常，为了定义一组项目之间的相似度，我们需要一个特征集，基于该特征集可以描述两个项目。在我们的例子中，这将意味着歌曲的特征，基于这些特征可以区分一首歌和另一首歌。尽管我们无法直接访问这些特征（或者我们可以吗？），我们将根据收听这些歌曲的用户来定义相似度。困惑吗？考虑这个数学公式，它应该能让你对这个指标有更多的了解。\n\
  \n相似度 [ij] = 交集(用户 [i] , 用户 [j] )/并集(用户 [i] , 用户 [j] )\n\n这个相似度度量被称为 Jaccard 指数\
  \ ( [`https://en.wikipedia.org/wiki/Jaccard_index`](https://en.wikipedia.org/wiki/Jaccard_index)\
  \ )，在我们的例子中，我们可以用它来定义两首歌曲之间的相似度。基本思想仍然是，如果两首歌曲被总听众中的很大一部分共同用户收听，那么这两首歌曲可以说是彼此相似的。基于这个相似度度量，我们可以定义算法向用户\
  \ k 推荐歌曲所采取的步骤。\n\n1.  确定用户 k 收听的歌曲。\n2.  使用先前定义的相似度度量，计算用户列表中每首歌曲与数据集中歌曲的相似度。\n\
  3.  确定与用户已经收听的歌曲最相似的歌曲。\n4.  根据相似度分数选择这些歌曲的一个子集作为推荐。\n\n由于当我们有大量歌曲时，步骤 2 可能成为一个计算密集型步骤，我们将数据子集化为\
  \ 5,000 首歌曲，以使计算更可行。我们将选择最受欢迎的 5,000 首歌曲，因此我们不太可能错过任何重要的推荐。\n\n```\nIn [4]:\nsong_count_subset\
  \ = song_count_df.head(n=5000)\nuser_subset = list(play_count_subset.user)\nsong_subset\
  \ = list(song_count_subset.song)\ntriplet_dataset_sub_song_merged_sub = triplet_dataset_sub_song_merged[triplet_dataset_sub_song_merged.song.isin(song_subset)]\n\
  ```\n\n这段代码将我们的数据集子集化为仅包含最受欢迎的 5,000 首歌曲。然后，我们将创建基于相似度的推荐引擎，并为随机用户生成推荐。我们在这里利用 Siraj\
  \ 的 Recommenders 模块来实现基于项目相似度的推荐系统。\n\n```\nIn [5]:\ntrain_data, test_data = train_test_split(triplet_dataset_sub_song_merged_sub,\
  \ test_size = 0.30, random_state=0)\nis_model = Recommenders.item_similarity_recommender_py()\n\
  is_model.create(train_data, 'user', 'title')\nuser_id = list(train_data.user)[7]\n\
  user_items = is_model.get_user_items(user_id)\nis_model.recommend(user_id)\n```\n\
  \n随机用户的推荐如图 10-8 所示。注意与基于流行度的推荐引擎的显著差异。因此，这个特定的人几乎可以肯定不会喜欢我们数据集中最受欢迎的歌曲。\n\n![A448827_1_En_10_Fig8_HTML.jpg](img/A448827_1_En_10_Fig8_HTML.jpg)\n\
  \n图 10-8.\n\n基于项目相似度的推荐引擎的推荐\n\n注意\n\n在本节开始时，我们提到我们无法直接访问可用于定义相似度的歌曲特征。作为百万歌曲数据库的一部分，我们可以获得数据集中每首歌曲的这些特征。我们鼓励你用基于歌曲特征的显式相似度替换这种基于共同用户的隐式相似度，并观察推荐如何变化。\n\
  \n基于矩阵分解的推荐引擎\n\n基于矩阵分解的推荐引擎可能是生产中最常用的推荐引擎。在本节中，我们给出一个基于直觉的基于矩阵分解的推荐引擎介绍。我们避免进行过于数学化的讨论，因为从实践者的角度来看，目的是看看我们如何利用它从真实数据中获得有价值的推荐。\n\
  \n矩阵分解指的是从初始矩阵中识别出两个或多个矩阵，使得当这些矩阵相乘时，我们得到原始矩阵。矩阵分解可用于发现两种不同实体之间的潜在特征。这些潜在特征是什么？在我们进行数学解释之前，让我们先讨论一下。\n\
  \n考虑一下你为什么会喜欢某首歌曲——答案可能从深情的歌词，到朗朗上口的音乐，再到旋律优美等等。我们可以尝试通过测量歌曲的节拍、节奏和其他此类特征来用数学术语解释一首歌，然后根据用户定义相似的特征。例如，我们可以根据用户的收听历史知道，他喜欢节拍稍高的歌曲等。一旦我们有意识地定义了这样的“特征”，我们就可以根据一些相似性标准为用户找到匹配项。但通常，这个过程最困难的部分是定义这些特征，因为我们没有手册来指导什么会构成一个好的特征。它主要基于领域专家和一些实验。但正如你将在本节中看到的，你可以使用矩阵分解来发现这些潜在特征，而且它们似乎效果很好。\n\
  \n任何基于矩阵分解的方法的起点都是效用矩阵，如表 10-1 所示。效用矩阵是一个用户 X 项目的矩阵，其中每一行代表一个用户，每一列代表一个项目。\n\n表\
  \ 10-1.\n\n效用矩阵示例\n\n   |\n  项目 1\n |\n  项目 2\n |\n  项目 3\n |\n  项目 4\n |\n  项目\
  \ 5\n |\n\n| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | ---\
  \ | --- |\n\n  用户 A\n |\n\n |\n   |\n   |\n   |\n\n |\n\n  用户 B\n |\n   |\n\n |\n\
  \   |\n\n |\n   |\n\n  用户 C\n |\n\n |\n\n |\n   |\n   |\n   |\n\n注意，矩阵中有很多缺失值；这些是用户尚未评分的项目，要么是因为他还没有看过，要么是因为他不想看。我们可以马上猜到，比如说，项目\
  \ 4 是用户 C 的推荐，因为用户 B 和用户 C 不喜欢项目 2，所以他们很可能最终会喜欢相同的项目，在这种情况下是项目 4。\n\n矩阵分解的过程意味着找到效用矩阵的低秩近似。因此，我们希望将效用矩阵\
  \ U 分解为两个低秩矩阵，以便我们可以通过将这两个矩阵相乘来重建矩阵 U。数学上，\n\nR = U * I ^t\n\n并且\n\n![$$ \\left|R\\\
  right|={\\left|U\\right|}^{\\ast}\\;\\left|I\\right| $$](img/A448827_1_En_10_Chapter_Equa.gif)\n\
  \n这里 R 是我们的原始评分矩阵，U 是我们的用户矩阵，I 是我们的项目矩阵。假设该过程帮助我们识别 K 个潜在特征，我们的目标是找到两个矩阵 X 和 Y，使得它们的乘积（矩阵乘法）近似于\
  \ R。\n\nX = |U| x K 矩阵（维度为 num_users * factors 的矩阵）\n\nY = |P| x K 矩阵（维度为 factors\
  \ * num_movies 的矩阵）\n\n![A448827_1_En_10_Fig9_HTML.jpg](img/A448827_1_En_10_Fig9_HTML.jpg)\n\
  \n图 10-9.\n\n矩阵分解\n\n我们也可以尝试用图像来解释矩阵分解的概念。基于图 10-9，我们可以通过将两个矩阵相乘来重新生成原始矩阵。为了向用户提出推荐，我们可以将第一个矩阵中相应用户的行与项目矩阵相乘，并从具有最大评分的行中确定项目。这将成为我们对用户的推荐。第一个矩阵表示用户与潜在特征之间的关联，而第二个矩阵处理项目（在我们的例子中是歌曲）与潜在特征之间的关联。图\
  \ 10-9 描绘了电影推荐系统的典型矩阵分解操作，但其目的是理解方法论并将其扩展到在这种情况下构建音乐推荐系统。\n\n矩阵分解与奇异值分解\n\n有多种算法可用于确定任何矩阵的分解。我们使用最简单的算法之一，即奇异值分解或\
  \ SVD。请记住，我们在第 1 章中讨论了 SVD 背后的数学原理。在这里，我们解释 SVD 提供的分解如何用作矩阵分解。\n\n你可能还记得第 1 章中，矩阵的奇异值分解返回三个不同的矩阵：U、S\
  \ 和 V。你可以按照以下步骤使用 SVD 函数的输出来确定矩阵的分解。\n\n*   分解矩阵以获得 U、S 和 V 矩阵。\n*   将矩阵 S 缩减为前\
  \ k 个分量。（我们使用的函数只会提供 k 个维度，因此我们可以跳过此步骤。）\n*   计算缩减后的矩阵 S [k] 的平方根，以获得矩阵 S [k] ^(1/2)\
  \ 。\n*   计算两个结果矩阵 U*S [k] ^(1/2) 和 S [k] ^(1/2) *V，因为它们将作为我们的两个分解矩阵，如图 10-9 所示。\n\
  \n然后，我们可以通过取第一个矩阵的第 i 行与第二个矩阵的第 j 列的点积来生成用户 i 对项目 j 的预测。这些信息为我们提供了为数据构建基于矩阵分解的推荐引擎所需的所有知识。\n\
