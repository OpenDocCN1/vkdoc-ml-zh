  通过使用 `TimeDistributed` 层包装器，我们实现了将此数据建模为时间序列的目标。该模型不仅在整体拟合度方面表现更好，而且需要的特征工程少得多，模型也更简单（就训练参数数量而言）。在这个模型中，我们还真正利用了
