  即将推出的技术：Prophet


  数据科学领域在不断发展，新的算法、调整和工具正在快速涌现。其中一种工具叫做 Prophet。这是一个由 Facebook 数据科学团队开源的分析和预报时间序列的框架。


  Prophet 使用一个可以处理趋势和季节性数据的加法模型。该工具的目标是实现大规模预报。它仍处于测试阶段，但已经拥有一些非常有用的功能。更多信息请访问 [`https://facebookincubator.github.io/prophet/`](https://facebookincubator.github.io/prophet/)
  。该工具背后的研究和直觉可在 [`https://facebookincubator.github.io/prophet/static/prophet_paper_20170113.pdf`](https://facebookincubator.github.io/prophet/static/prophet_paper_20170113.pdf)
  的论文中找到。


  安装步骤在网站上已概述，通过 `pip` 和 `conda` 安装非常简单。Prophet 还使用 `scikit` 风格的 `fit()` 和 `predict()`
  API，并提供了额外的工具来更好地处理时间序列数据。对于本节中的动手示例，您可以参考 jupyter notebook `notebook_stock_prediction_fbprophet.ipynb`
  以获取必要的代码片段和示例。


  注意


  Prophet 仍处于测试阶段，正在不断变化。此外，已知其在 Windows 平台上的安装会导致问题。请使用 Anaconda 发行版中的 `conda install`（网站上提到的步骤）以避免问题。


  由于我们已经将 S&P 500 指数价格信息存储在数据框/序列中。我们现在测试如何使用这个工具进行预报。我们首先将时间序列索引转换为其自己的列（这正是 prophet
  期望的数据格式），然后将序列拆分为训练集和测试集（90-10 拆分）。以下代码片段执行所需的操作。


  ```

  In [1] : # 重置索引以将日期时间作为一列

  ...: prophet_df = sp_df.reset_index()

  ...:

  ...: # 准备所需的数据框

