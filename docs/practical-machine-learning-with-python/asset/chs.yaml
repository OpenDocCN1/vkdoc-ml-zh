  \n图 8-8.\n\n三个细分群体之间的销售金额值差异\n\n我们可以通过向已创建的数据集添加相关特征来进一步提高聚类质量。公司通常会从外部数据供应商处购买关于其客户的数据，并用它来增强细分过程。我们受限于只有大约一年的交易数据，但即使是中型组织也可能拥有多年的交易数据，这可以改善结果。另一个可以探索的维度是尝试不同的算法来执行细分，例如我们在前面一些章节中探讨过的层次聚类。一个好的细分过程将涵盖所有这些途径，以得出能够提供宝贵见解的最佳细分群体。我们鼓励你在这个过程中发挥创造力，并构建自己的示例。\n\
  \n从这个分析中得到的重要启示是，当涉及到将结果的实际值与数学指标相关联时，我们不能总是依赖指标。我们需要养成将业务指标和领域见解纳入建模过程的习惯，因为通常这将成为实施的高价值项目与被遗忘的以数据为中心的解决方案之间的区别。一旦我们获得这些结果，我们可以进一步与组织的营销团队讨论，为识别出的每个细分群体制定合适的策略。\n\
  \n交叉销售\n\n什么是交叉销售？简单来说，交叉销售是通过分析客户的购物趋势以及与客户购物模式相似的普遍购物趋势和模式，向客户销售更多产品的能力。这个简单的定义抓住了交叉销售的核心思想，但它并不像我们希望的那样具有描述性。\n\
  \n我们将通过一个例子来说明这个想法。假设我们关心自己的健康（每个人都应该如此），并决定在我们最喜欢的电子商务网站上购买蛋白质补充剂。在大多数情况下，当你进入产品页面时，会有一个部分告诉你，除了你选择的产品之外，你还可以购买的其他产品。见图\
  \ 8-9。\n\n![A448827_1_En_8_Fig9_HTML.jpg](img/A448827_1_En_8_Fig9_HTML.jpg)\n\n\
  图 8-9.\n\n交叉销售示例\n\n很多时候，这些推荐的产品会非常有吸引力。例如，如果我想购买蛋白质补充剂，那么同时购买维生素补充剂对我来说绝对是个好主意。零售商通常会为你提供捆绑产品，并附带一些有吸引力的优惠，我们很可能会购买捆绑产品，而不仅仅是原始商品。这就是交叉销售简单而强大的概念。我们研究客户交易，找出客户原始需求的潜在附加项，并将其作为建议提供给客户，希望并意图让他们购买，从而使客户和零售机构都受益。\n\
  \n交叉销售在线上和线下零售世界中无处不在。这个想法的简单性和有效性使其成为所有类型零售商必不可少且强大的营销工具。交叉销售的概念可以扩展到任何组织，无论它是线上还是线下零售商，也无论它是向最终用户还是批发商销售产品。\n\
  \n在本节中，我们将探讨关联规则挖掘，这是一种可用于交叉销售的强大技术，然后我们将针对一个玩具数据集说明购物篮分析的概念，最后我们将相同的概念应用于我们的零售交易数据集。\n\
  \n使用关联规则挖掘进行购物篮分析\n\n在我们继续理解如何从交易数据生成关联规则之前，让我们先尝试理解我们将如何使用这些规则。数据分析界有一个著名的故事，即“啤酒与尿布”的故事。这个故事的基本要点是，一家大型零售商在分析其客户交易行为时，发现啤酒和尿布的销售之间存在强关联。该零售商能够利用这种关联，将啤酒区移到尿布区附近，从而提高了销售额（故事的起源可能有一些事实依据，但整个概念是有争议的。我们鼓励你通过\
  \ [ `http://www.dssresources.com/newsletters/66.php` ](http://www.dssresources.com/newsletters/66.php)\
  \ 上的讨论来了解更多关于这个故事的信息）。\n\n尽管啤酒和尿布的故事可能是一个神话，但在客户行为中发现销售关联的概念是重要且鼓舞人心的。假设我们能够数学上捕捉这些关联的重要性，那么尝试利用那些可能正确的规则将是一个好主意。关联规则挖掘的整个概念基于这样一个理念：客户购买行为具有一种模式，可以利用这种模式在未来向客户销售更多商品。关联规则通常具有如下方程所示的结构：\n\
  \n![$$ \\left\\{ ite{m}_1, ite{m}_2, ite{m}_3\\to ite{m}_k\\right\\} $$](img/A448827_1_En_8_Chapter_Equa.gif)\n\
  \n这个规则可以以显而易见的方式解读：当客户购买了规则左侧（LHS）的商品时，他很可能购买商品 [k]。在后面的章节中，我们将定义数学指标来捕捉此类规则的强度。\n\
  \n我们可以以多种方式使用这些规则。最明显的方式是开发产品捆绑包，方便客户一起购买这些商品。另一种使用这些规则的方式是将产品与捆绑包中其他相关产品的折扣捆绑在一起，从而确保客户更有可能购买更多商品。一些不太常见的关联规则用途包括设计更好的网站导航结构、入侵检测、生物信息学等。\n\
  \n关联规则挖掘基础\n\n在继续探索我们数据集中的关联规则之前，我们将介绍一些关联规则挖掘的基本概念。这些术语和概念将帮助你进行后续分析，并理解算法将生成的规则。考虑表\
  \ 8-1 中的一些玩具交易数据。\n\n表 8-1.\n\n交易集示例\n\n  Trans.ID\n |\n  Items\n |\n\n| --- | ---\
  \ | --- | --- | --- |\n\n |\n  `{milk, bread}`\n |\n\n |\n  `{butter}`\n |\n\n |\n\
  \  `{beer, diaper}`\n |\n\n |\n  `{milk, bread, butter}`\n |\n\n |\n  `{bread}`\n\
  \ |\n\n表中的每一行包含一个交易。例如，客户在第一个交易中购买了牛奶和面包。以下是关联规则挖掘的一些重要概念。\n\n*   项集：项集只是在一个交易中一起出现的一个或多个项目的集合。例如，这里的\
  \ `{milk, bread}` 就是一个项集的例子。\n*   支持度：支持度定义为项集在数据集中出现的次数。数学上定义为：\n\n    ![$$ \\\
  mathit{\\operatorname{supp}}\\left(\\left\\{ beer, diaper\\right\\}\\right)=\\frac{\\\
  mathrm{number}\\kern0.17em \\mathrm{of}\\kern0.17em \\mathrm{transactions}\\kern0.17em\
  \ \\mathrm{with}\\kern0.17em \\mathrm{beer}\\kern0.17em \\mathrm{and}\\kern0.17em\
  \ \\mathrm{diaper}}{total\\kern0.17em transactions} $$](img/A448827_1_En_8_Chapter_Equb.gif)\n\
  \n    在前面的例子中，`support (beer, diaper) = 1/5 = 0.2`。\n\n*   置信度：置信度是衡量规则在数据集中被发现存在的次数。对于一条声明\
  \ ![$$ \\left\\{ beer\\to diaper\\right\\} $$](img/A448827_1_En_8_Chapter_IEq1.gif)\
  \ 的规则，其置信度数学上定义为：\n\n    ![$$ confidence\\left(\\left\\{ beer, diaper\\right\\}\\\
  right)=\\frac{\\mathit{\\operatorname{supp}}\\left( beer\\kern0.17em and\\kern0.17em\
  \ diaper\\right)}{\\mathit{\\operatorname{supp}}(beer)} $$](img/A448827_1_En_8_Chapter_Equc.gif)\n\
  \n*   提升度：规则提升度定义为观察到的支持度与规则元素独立情况下预期支持度的比率。对于前面的一组交易，如果规则定义为 ![$$ \\left\\{X\\\
  to \\mathrm{Y}\\right\\} $$](img/A448827_1_En_8_Chapter_IEq2.gif)，则规则的提升度定义为：\n\n\
  \    ![$$ lift\\left(X\\to Y\\right)=\\frac{\\mathit{\\operatorname{supp}}\\left(X\\\
  cup Y\\right)}{\\left(\\mathit{\\operatorname{supp}}(X)\\ast \\mathit{\\operatorname{supp}}(X)\\\
  right)} $$](img/A448827_1_En_8_Chapter_Equd.gif)\n\n*   频繁项集：频繁项集是其支持度大于用户定义的支持度阈值的项集。\n\
  \nFP 增长\n\n最著名的关联规则挖掘算法是 Apriori 算法，你可以在网络和标准数据挖掘文献中找到大量关于它的代码和资源。然而，这里我们将使用一种不同且更高效的算法，即\
  \ FP 增长算法，来发现我们的关联规则。任何关联规则挖掘算法的主要瓶颈都是频繁项集的生成。如果交易数据集有 k 种独特产品，那么潜在的可能项集数量为 ![$$\
  \ {2}^k $$](img/A448827_1_En_8_Chapter_IEq3.gif)。Apriori 算法将首先生成这些项集，然后继续寻找频繁项集。\n\
  \n这个限制是一个巨大的性能瓶颈，因为即使只有大约 100 种独特产品，可能的项集数量也是巨大的。这个限制使得 Apriori 算法的计算成本高得令人望而却步。FP\
  \ 增长算法优于 Apriori 算法，因为它不需要生成所有候选项目集。该算法使用一种特殊的数据结构来帮助它保留项集关联信息。图 8-10 描绘了这种数据结构的一个例子。\n\
  \n![A448827_1_En_8_Fig10_HTML.jpg](img/A448827_1_En_8_Fig10_HTML.jpg)\n\n图 8-10.\n\
  \nFP-tree 的一个例子\n\n我们不会在这里深入探讨算法的详细数学描述，因为目的不是让本节充满数学，而是专注于如何利用它来发现数据中的模式。但是，我们将简要解释它，以便你理解此方法的核心概念。FP\
  \ 增长算法采用分治策略，并利用一种称为 FP-tree 的特殊数据结构（如图 8-10 所示）来发现频繁项集，而无需生成所有项集。该算法的核心步骤如下：\n\n\
  1.  接收交易数据库并创建一个 FP-tree 结构来表示频繁项集。\n2.  将此压缩表示划分为多个条件数据集，使得每个数据集都与一个频繁模式相关联。\n\
  3.  在每个这样的数据集中挖掘模式，以便可以将较短的模式递归地连接到较长的模式，从而使其更高效。\n\n如果你有兴趣了解更多，可以参考 Wikibooks 链接\
  \ [`https://en.wikibooks.org/wiki/Data_Mining_Algorithms_In_R/Frequent_Pattern_Mining/The_FP-Growth_Algorithm`](https://en.wikibooks.org/wiki/Data_Mining_Algorithms_In_R/Frequent_Pattern_Mining/The_FP-Growth_Algorithm)\
  \ ，其中详细讨论了 FP 增长和 FP 树结构。\n\n关联规则挖掘实战\n\n我们将使用著名的杂货数据集来说明关联规则挖掘。该数据集默认在 R 语言的基础包中可用。要在\
  \ Python 中使用它，你可以从 [ `https://github.com/stedy/Machine-Learning-with-R-datasets/blob/master/groceries.csv`\
  \ ](https://github.com/stedy/Machine-Learning-with-R-datasets/blob/master/groceries.csv)\
  \ 或从本章开头提到的我们的官方 GitHub 仓库获取。该数据集包含来自一家杂货零售商的交易集合。我们将使用这些数据作为我们分析的基础，并利用这些数据构建我们的规则挖掘工作流程。\n\
  \n一旦我们掌握了在杂货数据集上进行关联规则挖掘的基础知识，我们将把它留作练习，让你将相同的概念应用于我们在客户细分部分使用的交易数据集。请记住在开始之前加载以下依赖项。\n\
  \n```\nimport csv\nimport pandas as pd\nimport matplotlib.pyplot as plt\nimport\
  \ Orange\nfrom Orange.data import Domain, DiscreteVariable, ContinuousVariable\n\
  from orangecontrib.associate.fpgrowth import *\n%matplotlib inline\n```\n\n查看“挖掘规则”部分，了解如何安装\
  \ `Orange` 框架依赖项的详细信息。本节代码可在 `Cross Selling.ipynb` 笔记本中找到。\n\n探索性数据分析\n\n我们之前提到的杂货数据集是这样安排的：数据集中出现的每一行都是一个交易。每行中给出的项目以逗号分隔，并且是该特定交易中的项目。查看图\
  \ 8-11 中描绘的数据集的前几行。\n\n![A448827_1_En_8_Fig11_HTML.jpg](img/A448827_1_En_8_Fig11_HTML.jpg)\n\
  \n图 8-11.\n\n杂货数据集交易\n\n我们从该数据集中得到的第一个观察结果是，它并非以完全结构化、易于分析的格式提供。这个限制意味着我们首先要做的是编写自定义代码，将原始文件转换为我们可用的数据结构。由于到目前为止我们大部分分析都是使用\
  \ `pandas` 数据框完成的，我们将把这些数据转换为类似的数据结构。以下代码片段将为我们执行转换。\n\n```\ngrocery_items = set()\n\
  with open(\"grocery_dataset.txt\") as f:\nreader = csv.reader(f, delimiter=\",\"\
  )\nfor i, line in enumerate(reader):\ngrocery_items.update(line)\noutput_list =\
  \ list()\nwith open(\"grocery_dataset.txt\") as f:\nreader = csv.reader(f, delimiter=\"\
  ,\")\nfor i, line in enumerate(reader):\nrow_val = {item:0 for item in grocery_items}\n\
  row_val.update({item:1 for item in line})\noutput_list.append(row_val)\ngrocery_df\
  \ = pd.DataFrame(output_list)\nIn [3]: grocery_df.shape\nOut[3]: (9835, 169)\n```\n\
  \n转换后我们得到一个维度为 (`num_transaction`, `total_items`) 的数据框，其中每个交易行中，其组成项目对应的列值为 1。例如，对于图\
  \ 8-11 中的第 3 行，`whole milk` 列将为 1，其余列均为 0。尽管这种数据结构是稀疏的，意味着它有很多零，但我们提取关联规则的框架将处理这种稀疏性。\n\
  \n在我们继续在数据集上构建关联规则之前，我们将探索数据集的一些显著特征。我们已经知道数据集中总共有 9,835 笔交易和 169 个项目。但是，数据集中出现的前\
  \ 10 个项目是什么，它们占总销售额的多少？我们可以绘制一个简单的直方图来帮助我们提取这些信息。\n\n```\nIn [4]: total_item_count\
  \ = sum(grocery_df.sum())\n...: print(total_item_count)\n...: item_summary_df =\
  \ grocery_df.sum().sort_values(ascending = False).reset\n...: _index().head(n=20)\n\
  ...: item_summary_df.rename(columns={item_summary_df.columns[0]:'item_name',\n...:\
  \ item_summary_df.columns[1]:'item_count'}, inplace=True)\n...: item_summary_df.head()\n\
  \nOut[4]:\nitem_name  item_count\n0        whole milk        2513\n1  other vegetables\
  \        1903\n2        rolls/buns        1809\n3              soda        1715\n\
  4            yogurt        1372\n```\n\n为了创建直方图，我们将使用前面的代码创建一个汇总数据框。这告诉我们所有交易中总共出现了\
  \ 43,000 多个项目，我们还看到了销量前五的项目。让我们使用这个数据框来绘制销量前 20 的项目。以下代码片段将帮助我们创建所需的条形图。\n\n```\n\
  objects = (list(item_summary_df['item_name'].head(n=20)))\ny_pos = np.arange(len(objects))\n\
  performance = list(item_summary_df['item_count'].head(n=20))\nplt.bar(y_pos, performance,\
  \ align='center', alpha=0.5)\nplt.xticks(y_pos, objects, rotation='vertical')\n\
  plt.ylabel('项目数量')\nplt.title('项目销售分布')\n```\n\n描绘项目销售的条形图如图 8-12 所示。它表明，仅这 20 个项目就占据了总项目的惊人份额。\n\
  \n![A448827_1_En_8_Fig12_HTML.jpg](img/A448827_1_En_8_Fig12_HTML.jpg)\n\n图 8-12.\n\
  \n基于销售额的杂货数据集前 20 个项目\n\n让我们也找出仅这 20 个项目就解释了总销售额的百分比。我们将使用 `pandas` 提供的累积和函数 (`cumsum`)\
  \ 来找出这一点。我们将在数据框中创建两列。一列将告诉特定项目占总销售额的百分比，另一列将保持此销售百分比的累积和。\n\n```\nitem_summary_df['item_perc']\
  \ = item_summary_df['item_count']/total_item_count\nitem_summary_df['total_perc']\
  \ = item_summary_df.item_perc.cumsum()\nitem_summary_df.head(10)\nitem_name  item_count\
  \  item_perc  total_perc\n0        whole milk        2513   0.057947    0.057947\n\
  1  other vegetables        1903   0.043881    0.101829\n2        rolls/buns    \
  \    1809   0.041714    0.143542\n3              soda        1715   0.039546   \
  \ 0.183089\n4            yogurt        1372   0.031637    0.214725\nIn [12]: item_summary_df[item_summary_df.total_perc\
  \ <= 0.5].shape\nOut[12]: (19, 4)\n```\n\n这表明前五个项目贡献了全部销售额的 21.4%，而仅前 20 个项目就贡献了超过\
  \ 50% 的销售额！这对我们很重要，因为我们不想为购买频率非常低的项目寻找关联规则。有了这些信息，我们可以限制我们想要探索以创建关联规则的项目。这也有助于我们将可能的项集数量控制在可控范围内。\n\
  \n挖掘规则\n\n我们将使用 `Orange` 和 `Orange3-Associate` 框架，可以使用命令 `conda install orange3`\
  \ 和 `pip install orange3-associate` 进行安装。`orange3-associate` 包包含了 FP 增长的实现，由开发 `Orange`\
  \ 数据挖掘包的团队提供，即斯洛文尼亚卢布尔雅那大学的生物信息学实验室（ [`https://fri.uni-lj.si/en/laboratory/biolab`](https://fri.uni-lj.si/en/laboratory/biolab)\
  \ ）。\n\n注意\n\n我们鼓励你尝试使用 `Orange` 包，该包可在 [`https://orange.biolab.si/`](https://orange.biolab.si/)\
  \ 获取。它是一个用 Python 编写的、由 GUI 驱动的数据挖掘框架，非常有助于以交互方式学习数据分析。\n\n在我们继续使用该包寻找关联规则之前，我们将讨论\
  \ `Orange` 库中数据的表示方式。数据表示有点棘手，但我们将帮助你修改现有数据，使其符合 `Orange` 要求的格式。我们将主要关注如何将我们的 `pandas`\
  \ 数据框转换为 `Orange Table` 数据结构。\n\nOrange Table 数据结构\n\n`Table` 数据结构是在 `Orange` 中表示任何表格数据的主要方式。尽管它在某些方面类似于\
  \ `numpy` 数组或 `pandas` 数据框，但它在存储关于实际数据的元数据的方式上有所不同。在我们的案例中，我们可以通过提供关于我们列的元数据，轻松地将我们的\
  \ `pandas` 数据框转换为 `Table` 数据结构。我们需要为每个变量定义域。域意味着每个变量可以使用的可能值集合。这些信息将作为元数据存储，并将在后续的数据转换中使用。由于我们的列只有二进制值——即\
  \ 0 或 1——我们可以利用这些信息轻松创建域。以下代码片段帮助我们转换数据框为 `Orange` 表。\n\n```\nfrom Orange.data import\
  \ Domain, DiscreteVariable, ContinuousVariable\nfrom orangecontrib.associate.fpgrowth\
  \ import *\ninput_assoc_rules = grocery_df\ndomain_grocery = Domain([DiscreteVariable.make(name=item,\
  \ values=['0', '1']) for item in\ninput_assoc_rules.columns])\ndata_gro_1 = Orange.data.Table.from_numpy(domain=domain_grocery,\n\
  X=input_assoc_rules.as_matrix(),Y= None)\n```\n\n这里，我们通过将每个变量指定为具有值 `(0, 1)` 的 `DiscreteVariable`\
  \ 来定义数据的域。然后，使用这个域，我们为数据创建了 `Table` 结构。\n\n使用 FP 增长算法\n\n现在我们拥有了执行规则挖掘所需的所有部分。但在继续之前，我们想处理分析的另一个重要方面。我们在前面的章节中看到，只有少数项目负责我们的大部分销售额，因此我们想要修剪我们的数据集以反映这些信息。为此，我们创建了一个函数\
  \ `prune_dataset`（查看 notebook），它将帮助我们根据需求减少数据集的大小。该函数可用于执行两种类型的修剪：\n\n*   基于总销售额百分比的修剪：参数\
  \ `total_sales_perc` 将帮助我们选择能够解释所需销售百分比的项目数量。默认值为 50% 或 0.5。\n*   基于项目排名的修剪：执行修剪的另一种方法是指定我们想要修剪数据集的项目起始和结束排名。\n\
  \n默认情况下，我们只会查找至少包含两个项目的交易，因为只有一个项目的交易与关联规则挖掘的整个概念相悖。以下代码片段将帮助我们仅选择那些通过利用我们的修剪函数解释总销售额\
  \ 40% 的数据子集。\n\n```\noutput_df, item_counts = prune_dataset(input_df=grocery_df,\
  \ length_trans=2,total_sales_perc=0.4)\nprint(output_df.shape)\nprint(list(output_df.columns))\n\
  (4585, 13)\n['whole milk', 'other vegetables', 'rolls/buns', 'soda', 'yogurt', 'bottled\
  \ water', 'root vegetables', 'tropical fruit', 'shopping bags', 'sausage', 'pastry',\
  \ 'citrus fruit', 'bottled beer']\n```\n\n所以我们发现只有 13 个项目贡献了 40% 的销售额，并且有 4585 笔交易包含这些项目以及其他项目，我们还可以看到这些项目是什么。下一步是将这些选定的数据转换为所需的\
  \ `Table` 数据结构。\n\n```\ninput_assoc_rules = output_df\ndomain_grocery = Domain([DiscreteVariable.make(name=item,values=['0',\
  \ '1']) for item in\ninput_assoc_rules.columns])\ndata_gro_1 = Orange.data.Table.from_numpy(domain=domain_grocery,\n\
  X=input_assoc_rules.as_matrix(), Y= None)\ndata_gro_1_en, mapping = OneHot.encode(data_gro_1,\
  \ include_class=False)\n```\n\n前面代码的新增部分是最后一行。这是为了对我们的输入进行编码，以便整个域表示为二进制变量。这将完成规则挖掘所需的所有解析和数据操作。呼！\n\
  \n最后一步是创建我们的规则。我们需要指定两条信息来生成规则：支持度和置信度。我们之前已经在概念上定义了它们，因此我们不再重复定义。一条重要的信息是从较高的支持度开始，因为较低的支持度意味着更多的频繁项集，从而导致更长的执行时间。我们将指定最小支持度为\
  \ 0.01——至少 45 笔交易——并在我们指定置信度并生成规则之前，查看我们获得的频繁项集数量。\n\n```\nmin_support = 0.01\n\
  print(\"num of required transactions = \", int(input_assoc_rules.shape[0]*min_support))\n\
  num_trans = input_assoc_rules.shape[0]*min_support\nitemsets = dict(frequent_itemsets(data_gro_1_en,\
  \ min_support=min_support))\nnum of required transactions =  45\nIn [25]: len(itemsets)\n\
  Out[25]: 166886\n```\n\n所以我们得到了惊人的 166,886 个项集，支持度仅为 1%！如果我们降低支持度或增加数据集中的项目数量，这个数字将呈指数级增长。下一步是指定置信度值并生成我们的规则。我们编写了一个代码片段，它将接受一个置信度值，并生成满足我们指定的支持度和置信度标准的规则。然后使用映射和变量名称对生成的规则进行解码。`Orange3-Associate`\
  \ 还提供了一个辅助函数，帮助我们提取每个规则的指标。以下代码片段将执行规则生成和规则解码，然后将所有内容编译成一个整洁的数据框，我们可以用于进一步分析。\n\n\
  ```\nconfidence = 0.3\nrules_df = pd.DataFrame()\nif len(itemsets) 1 :\nrule_dict\
  \ = {'support' : ex_rule_frm_rule_stat[2],\n'confidence' : ex_rule_frm_rule_stat[3],\n\
  'coverage' : ex_rule_frm_rule_stat[4],\n'strength' : ex_rule_frm_rule_stat[5],\n\
  'lift' : ex_rule_frm_rule_stat[6],\n'leverage' : ex_rule_frm_rule_stat[7],\n'antecedent':\
  \ ante_rule,\n'consequent':named_cons[:-2] }\nrule_list_df.append(rule_dict)\nrules_df\
  \ = pd.DataFrame(rule_list_df)\nprint(\"Raw rules data frame of {} rules generated\"\
  .format(rules_df.shape[0]))\nif not rules_df.empty:\npruned_rules_df = rules_df.groupby(['antecedent','consequent']).max().reset_index()\n\
  else:\nprint(\"Unable to generate any rule\")\nRaw rules data frame of 16628 rules\
  \ generated\n```\n\n此代码片段的输出包括一个关联规则数据框，我们可以用于分析。你可以调整项目编号、后件、前件、支持度和置信度值来生成不同的规则。让我们看一些使用解释总销售额\
  \ 40% 的交易、最小支持度为 1%（所需交易数量 >=45）且置信度大于 30% 生成的示例规则。在这里，我们通过使用以下代码，为每个可以作为后件（出现在右侧）的项目收集了具有最大提升度的规则。\n\
  \n![A448827_1_En_8_Fig13_HTML.jpg](img/A448827_1_En_8_Fig13_HTML.jpg)\n\n图 8-13.\n\
  \n杂货数据集上的关联规则\n\n```\n(pruned_rules_df[['antecedent','consequent',\n'support','confidence','lift']].groupby('consequent')\n\
  .max()\n.reset_index()\n.sort_values(['lift', 'support','confidence'],\nascending=False))\n\
  ```\n\n让我们解释第一条规则，它指出：\n\n![$$ \\left\\{ yogurt, whole\\kern0.17em milk, tropical\\\
  kern0.17em fruit\\to \\mathrm{root}\\kern0.17em \\mathrm{vegtables}\\right\\} $$](img/A448827_1_En_8_Chapter_Eque.gif)\n\
  \n规则在方程中陈述的模式很容易理解——购买酸奶、全脂牛奶和热带水果的人也倾向于购买根茎类蔬菜。让我们尝试理解这些指标。规则的支持度为 228，这意味着所有这些项目一起出现在数据集中的\
  \ 228 笔交易中。规则的置信度为 46%，这意味着在前件出现的交易中，有 46% 的情况下我们也发现了后件（即，46% 的情况下，购买左侧项目的客户也购买了根茎类蔬菜）。图\
  \ 8-13 中的另一个重要指标是提升度。提升度意味着在包含酸奶、全脂牛奶和热带水果的交易中发现根茎类蔬菜的概率大于在之前交易中发现根茎类蔬菜的正常概率（2.23）。通常，提升度值为\
  \ 1 表示前件和后件同时出现的概率彼此独立。因此，我们的想法是寻找提升度远大于 1 的规则。在我们的案例中，前面提到的所有规则都是高质量的规则。\n\n这是一条重要的信息，因为这可以促使零售商将此类特定产品捆绑在一起销售，或者开展一项营销计划，为购买根茎类蔬菜以及这三种其他产品提供折扣。\n\
