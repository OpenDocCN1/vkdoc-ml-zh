  由于我们提供的文件包含表头，这些值被用作结果数据框的列名。这是 `pandas.read_csv` 函数一个非常基础但核心的用法。该函数提供了大量参数，可根据需要修改其行为。我们不会涵盖所有可用参数，建议你阅读该函数的文档，因为它是大多数基于
  Python 的数据分析的起点之一。


  ##### 数据库转换为数据框


  对于数据科学家来说，最重要的数据源是其组织使用的现有数据源。关系型数据库和数据仓库几乎是所有组织中数据存储的事实标准。Pandas 提供了直接连接这些数据库、执行查询以提取数据，然后将查询结果转换为结构化数据框的功能。`pandas.from_sql`
  函数结合 Python 强大的数据库库，使得从数据库获取数据的任务变得简单易行。由于这一能力，无需中间的数据提取步骤。现在，我们将以从 Microsoft SQL
  Server 数据库读取数据为例。以下代码将实现此任务。


  ```

  server = ''xxxxxxxx'' # 数据库服务器地址

  user = ''xxxxxx''     # 数据库服务器的用户名

  password = ''xxxxx''  # 上述用户的密码

  database = ''xxxxx''  # 表所在的数据库

  conn = pymssql.connect(server=server, user=user, password=password, database=database)

  query = "select * from some_table"

  df = pd.read_sql(query, conn)

  ```


  这里需要注意的重要部分是连接对象（代码中的 `conn`）。该对象将向 pandas 标识数据库服务器信息和数据库类型。根据目标数据库服务器的不同，我们会更改连接对象。例如，这里我们使用
  `pymssql` 库来访问 Microsoft SQL Server。如果数据源更改为 Postgres 数据库，连接对象会改变，但其余过程将类似。当我们需要对来自不同来源的数据执行类似分析时，这一功能非常方便。同样，`pandas`
  的 `read_sql` 函数提供了许多参数，允许我们控制其行为。我们还建议你查看 `sqlalchemy` 库，它使得创建连接对象更加容易，无论数据库供应商类型如何，并且还提供了许多其他实用工具。


  #### 数据访问


  读取数据后最重要的部分是利用数据结构的访问机制来访问数据。在 `pandas` 数据框和序列对象中访问数据，与 Python `列表` 或 `numpy` 数组的访问机制非常相似。但它们也提供了一些针对数据框/序列的额外数据访问方法。


  ##### 头部和尾部


  在上一节中，我们看到了 `head` 方法。它返回数据的前几行（默认是 5 行）。对应的函数是 `tail`，它返回数据框的最后几行。这些是最广泛使用的 `pandas`
  函数之一，因为当我们对数据应用不同操作或选择时，经常需要快速查看数据。我们已经看到了 `head` 的输出，因此我们将在同一个数据框上使用 `tail` 函数并查看其输出。


