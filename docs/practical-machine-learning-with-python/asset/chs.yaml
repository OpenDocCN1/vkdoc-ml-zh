  \n分析主题模型\n\n另一种分析关键术语、概念或情感主题的方法是使用一种不同的方法，称为主题建模。我们在第 4 章“文本数据特征工程”下的“主题模型”一节中已经介绍了一些主题建模的基础知识。主题模型的主要目的是提取并描述关键主题或概念，这些主题或概念通常是潜在的，在庞大的文本文档语料库中并不十分突出。我们在第\
  \ 4 章中已经看到了使用潜在狄利克雷分配（LDA）进行主题建模的方法。在本节中，我们将使用另一种称为非负矩阵分解的主题建模技术。请参考名为 `sentiment_causal_topic_models.py`\
  \ 的 Python 文件或名为 `Sentiment Causal Analysis - Topic Models.ipynb` 的 Jupyter Notebook\
  \ 以获得更具交互性的体验。\n\n此分析的第一步是合并所有归一化的 `train` 和 `test` 评论，并将这些评论分为正面情感评论和负面情感评论。完成这一步后，我们将使用\
  \ TF-IDF 特征向量化器从这两个数据集中提取特征。以下代码片段帮助我们实现这一点。\n\n```\nIn [11]: from sklearn.feature_extraction.text\
  \ import TfidfVectorizer\n...:\n...: # consolidate all normalized reviews\n...:\
  \ norm_reviews = norm_train_reviews+norm_test_reviews\n...: # get tf-idf features\
  \ for only positive reviews\n...: positive_reviews = [review for review, sentiment\
  \ in zip(norm_reviews, sentiments)\nif sentiment == 'positive']\n...: ptvf = TfidfVectorizer(use_idf=True,\
  \ min_df=0.05, max_df=0.95,\nngram_range=(1,1), sublinear_tf=True)\n...: ptvf_features\
  \ = ptvf.fit_transform(positive_reviews)\n...: # get tf-idf features for only negative\
  \ reviews\n...: negative_reviews = [review for review, sentiment in zip(norm_reviews,\
  \ sentiments)\nif sentiment == 'negative']\n...: ntvf = TfidfVectorizer(use_idf=True,\
  \ min_df=0.05, max_df=0.95,\nngram_range=(1,1), sublinear_tf=True)\n...: ntvf_features\
  \ = ntvf.fit_transform(negative_reviews)\n...: # view feature set dimensions\n...:\
  \ print(ptvf_features.shape, ntvf_features.shape)\n(25000, 331) (25000, 331)\n```\n\
  \n从上述输出维度可以看出，通过将 `min_df` 设置为 `0.05`、`max_df` 设置为 `0.95`，我们过滤掉了之前构建分类模型时使用的许多特征。这是为了加快主题建模过程，并移除那些出现频率过高或过低的特征。现在，让我们导入主题建模过程所需的依赖项。\n\
  \n```\nIn [12]: import pyLDAvis\n...: import pyLDAvis.sklearn\n...: from sklearn.decomposition\
  \ import NMF\n...: import topic_model_utils as tmu\n...:\n...: pyLDAvis.enable_notebook()\n\
  ...: total_topics = 10\n```\n\n来自 `scikit-learn` 的 `NMF` 类将帮助我们进行主题建模。我们还使用 `pyLDAvis`\
  \ 来构建主题模型的交互式可视化。非负矩阵分解（NNMF）的核心原理是对非负特征矩阵 X 应用矩阵分解（类似于 SVD），使得分解可以表示为 X ≈ WH，其中\
  \ W 和 H 都是非负矩阵，两者相乘应能近似重构特征矩阵 X。可以使用像 L2 范数这样的代价函数来获得这种近似。现在，让我们应用 NNMF 从正面情感评论中提取\
  \ 10 个主题。我们还将利用 `topic_model_utils` 模块中的一些实用函数，以清晰的格式显示结果。\n\n\n\n```\nIn [13]:\
  \ # 基于正面情感评论特征构建主题模型\n...: pos_nmf = NMF(n_components=total_topics,\n...:      \
  \     random_state=42, alpha=0.1, l1_ratio=0.2)\n...: pos_nmf.fit(ptvf_features)\n\
  ...: # 提取特征和成分权重\n...: pos_feature_names = ptvf.get_feature_names()\n...: pos_weights\
  \ = pos_nmf.components_\n...: # 提取并展示主题及其成分\n...: pos_topics = tmu.get_topics_terms_weights(pos_weights,\
  \ pos_feature_names)\n...: tmu.print_topics_udf(topics=pos_topics, total_topics=total_topics,\n\
  ...:                  num_terms=15, display_weights=False)\nTopic #1 without weights\n\
  ['like', 'not', 'think', 'really', 'say', 'would', 'get', 'know', 'thing', 'much',\
  \ 'bad', 'go', 'lot', 'could', 'even']\nTopic #2 without weights\n['movie', 'see',\
  \ 'watch', 'great', 'good', 'one', 'not', 'time', 'ever', 'enjoy', 'recommend',\
  \ 'make', 'acting', 'like', 'first']\nTopic #3 without weights\n['show', 'episode',\
  \ 'series', 'tv', 'watch', 'dvd', 'first', 'see', 'time', 'one', 'good', 'year',\
  \ 'remember', 'ever', 'would']\nTopic #4 without weights\n['performance', 'role',\
  \ 'play', 'actor', 'cast', 'good', 'well', 'great', 'character', 'excellent', 'give',\
  \ 'also', 'support', 'star', 'job']\n...\nTopic #10 without weights\n['love', 'fall',\
  \ 'song', 'wonderful', 'beautiful', 'music', 'heart', 'girl', 'would', 'watch',\
  \ 'great', 'favorite', 'always', 'family', 'woman']\n```\n\n我们在前述输出中生成的 10 个主题里选取了部分进行展示。现在你可以利用`pyLDAvis`以交互式可视化方式呈现这些主题。参见图\
  \ 7-18。\n\n![A448827_1_En_7_Fig18_HTML.jpg](img/A448827_1_En_7_Fig18_HTML.jpg)\n\
  \n图 7-18.\n\n正面情感电影评论的主题模型可视化\n\n```\nIn [14]: pyLDAvis.sklearn.prepare(pos_nmf,\
  \ ptvf_features, ptvf, R=15)\n```\n\n图 7-18 所示的可视化结果向我们展示了来自正面电影评论的 10 个主题，我们可以在输出中看到主题\
  \ 6 的高亮显示的相关性最高的术语。从这些主题和术语中，我们可以看到诸如电影阵容、演员、表演、扮演、角色、音乐、精彩、好等词汇，它们在不同主题中对正面情感做出了贡献。这非常有趣，能让你深入了解评论中哪些成分促成了评论的正面情感。如果你使用的是\
  \ Jupyter Notebook，这个可视化是完全交互式的，你可以点击左侧主题间距离图中代表主题的任意气泡，在右侧的条形图中查看每个主题中相关性最高的术语。\n\
  \n左侧的图是使用多维缩放（MDS）绘制的。相似的主题应彼此靠近，而不相似的主题则应相距较远。每个主题气泡的大小取决于该主题及其成分在整个语料库中的出现频率。\n\
  \n右侧的可视化展示了排名靠前的术语。当未选中任何主题时，它会显示语料库中前 15 个最显著的主题。一个术语的显著性定义为该术语在语料库中出现频率的度量，以及它在区分不同主题时的区分因子。当选中某个主题时，图表会发生变化，显示类似于图\
  \ 7-13 的内容，即该主题下前 15 个最相关的术语。相关性度量由λ控制，可以通过条形图顶部的滑块进行调整（请参考 Notebook 进行交互操作）。如果你对这些可视化背后的数学理论感兴趣，建议查阅[`https://cran.r-project.org/web/packages/LDAvis/vignettes/details.pdf`](https://cran.r-project.org/web/packages/LDAvis/vignettes/details.pdf)了解更多细节，这是\
  \ R 包`LDAvis`的说明文档，该包已被移植到 Python 中，即`pyLDAvis`。\n\n现在，让我们提取主题，并对电影评论数据集中的负面情感评论进行同样的分析。\n\
  \n![A448827_1_En_7_Fig19_HTML.jpg](img/A448827_1_En_7_Fig19_HTML.jpg)\n\n图 7-19.\n\
  \n正面情感电影评论的主题模型可视化\n\n```\nIn [15]: # 基于负面情感评论特征构建主题模型\n...: neg_nmf = NMF(n_components=10,\n\
  ...:           random_state=42, alpha=0.1, l1_ratio=0.2)\n...: neg_nmf.fit(ntvf_features)\n\
