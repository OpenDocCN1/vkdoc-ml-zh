  ### 基于模型的选择


  基于树的模型（如决策树）和集成模型（如随机森林，即树的集成）不仅可以用于建模，还可以用于特征选择。这些模型可以在构建模型时用于计算特征重要性，进而用于选择最佳特征，并丢弃得分较低的不相关特征。随机森林是一种集成模型。它可以作为一种嵌入式特征选择方法使用，其中集成中的每个决策树模型都是通过从整个数据集中抽取一个训练数据样本来构建的。这个样本是一个自助样本（有放回抽样）。任何节点上的分裂都是通过从特征的随机子集中选择最佳分裂来进行的，而不是考虑所有特征。这种随机性倾向于以略微增加偏差为代价来降低模型的方差。总体而言，这会产生一个更好、更泛化的模型。我们将在第
  5 章中更详细地介绍偏差-方差权衡。现在，让我们使用随机森林模型根据特征的重要性对其进行评分和排序。


  ```

