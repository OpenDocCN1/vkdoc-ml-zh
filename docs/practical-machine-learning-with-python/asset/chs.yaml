  从上面的输出中，我们可以看到，正如预期的那样，`word2vec` 模型特征的大小为 500，而 GloVe 特征的大小为 300。我们现在可以进入分类系统工作流程的步骤
  4，在此我们将构建并训练一个基于这些特征的深度神经网络。我们已经在第 1 章的“深度学习”部分简要介绍了深度神经网络的各个方面和架构。我们将使用一个全连接的四层深度神经网络（多层感知器或深度
  ANN）作为我们的模型。我们通常不计算任何深度架构中的输入层，因此我们的模型将由三个隐藏层（每层 512 个神经元或单元）和一个输出层（两个单元）组成，输出层将用于根据输入层特征预测正面或负面情感。图
  7-7 描绘了我们用于情感分类的深度神经网络模型。


  ![A448827_1_En_7_Fig7_HTML.jpg](img/A448827_1_En_7_Fig7_HTML.jpg)


  图 7-7.


  用于情感分类的全连接深度神经网络模型


  我们称之为全连接深度神经网络，因为每对相邻层中的神经元或单元都是完全成对连接的。这些网络也被称为深度人工神经网络或多层感知器，因为它们有多个隐藏层。以下函数利用基于
  `tensorflow` 的 `keras` 来构建所需的 DNN 模型。


  ```

  def construct_deepnn_architecture(num_input_features):

  dnn_model = Sequential()

  dnn_model.add(Dense(512, activation=''relu'', input_shape=(num_input_features,)))

  dnn_model.add(Dropout(0.2))

  dnn_model.add(Dense(512, activation=''relu''))

  dnn_model.add(Dropout(0.2))

  dnn_model.add(Dense(512, activation=''relu''))

  dnn_model.add(Dropout(0.2))

  dnn_model.add(Dense(2))

  dnn_model.add(Activation(''softmax''))

  dnn_model.compile(loss=''categorical_crossentropy'', optimizer=''adam'',

  metrics=[''accuracy''])

  return dnn_model

  ```


  从前面的函数中，您可以看到我们接受一个参数 `num_input_features`，它决定了输入层所需的单元数量（对于 `word2vec` 特征为 `500`，对于
  `glove` 特征为 `300`）。我们构建了一个 `Sequential` 模型，它帮助我们线性地堆叠隐藏层和输出层。


  我们为所有隐藏层使用 `512` 个单元，激活函数 `relu` 表示修正线性单元。该函数通常定义为 ![$$ relu(x)=\max\;\left(0,x\right)
  $$](img/A448827_1_En_7_Chapter_IEq6.gif)，其中 x 通常是神经元的输入。在电子和电气工程中，这也常被称为斜坡函数。与之前流行的
  sigmoid 函数相比，现在更倾向于使用此函数，因为它试图解决梯度消失问题。当 ![$$ x>0 $$](img/A448827_1_En_7_Chapter_IEq7.gif)
  且 x 增加时，sigmoid 函数的梯度变得非常小（几乎消失），但 relu 可以防止这种情况发生。除此之外，它还有助于梯度下降更快地收敛。我们还在网络中以
  `Dropout` 层的形式使用正则化。通过添加 `0.2` 的丢弃率，在训练模型期间的每次更新时，它会随机将 `20%` 的输入特征单元设置为 `0`。这种正则化形式有助于防止模型过拟合。


  最终的输出层由两个单元组成，使用 `softmax` 激活函数。softmax 函数基本上是我们之前看到的逻辑函数的泛化，可用于表示 n 个可能类别结果上的概率分布。在我们的例子中，![$$
  n=2 $$](img/A448827_1_En_7_Chapter_IEq8.gif)，类别可以是正面或负面，softmax 概率将帮助我们确定这一点。二元
  softmax 分类器也可以互换地称为二元逻辑回归函数。


  `compile(...)` 方法用于在我们实际训练 DNN 模型之前配置其学习或训练过程。这涉及在 loss 参数中提供一个成本或损失函数。这将是模型试图最小化的目标或目的。根据您要解决的问题类型，有多种损失函数，例如用于回归的均方误差和用于分类的分类交叉熵。请查看
  [`https://keras.io/losses/`](https://keras.io/losses/) 以获取可能的损失函数列表。


  我们将使用 `categorical_crossentropy`，它有助于我们最小化 softmax 输出的误差或损失。我们需要一个优化器来帮助我们收敛模型并最小化损失或误差函数。梯度下降或随机梯度下降是流行的优化器。我们将使用
  `adam` 优化器，它只需要一阶梯度且内存占用非常小。Adam 还使用了动量，其基本思想是每次更新不仅基于当前点的梯度计算，还包括前一次更新的一部分。这有助于更快地收敛。您可以参考
  [`https://arxiv.org/pdf/1412.6980v8.pdf`](https://arxiv.org/pdf/1412.6980v8.pdf)
  上的原始论文，以获取有关 ADAM 优化器的更多详细信息。最后，`metrics` 参数用于指定模型性能指标，这些指标在训练时用于评估模型（但不用于修改训练损失本身）。现在让我们基于我们的
  `word2vec` 输入特征表示为我们的训练评论构建一个 DNN 模型。


  ```

  In [13]: w2v_dnn = construct_deepnn_architecture(num_input_features=500)

  ```


