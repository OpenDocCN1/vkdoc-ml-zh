  '
- "# 3. 数据处理、整理与可视化\n\n自从计算机和互联网成为主流以来，我们周围的世界发生了巨大变化。随着无处不在的手机以及如今联网设备的普及，数字世界与物理世界之间的界限比以往任何时候都更加模糊。这一切的核心是数据。数据是我们周围一切的中心，无论是金融、供应链、医学科学、太空探索、通信等等。毫不奇怪，我们仅在最近几年就生成了世界上\
  \ 90%的数据，而这仅仅是个开始。数据正被恰当地称为 21 世纪的石油。前几章介绍了机器学习的概念和用于入门的 Python 生态系统。本章将介绍机器学习世界赖以展现其魔力和奇迹的核心实体。\n\
  \n一切数字化的东西，其核心都以某种形式存在着数据。全球众多来源以多种格式、以不同速率生成数据。在深入探讨机器学习的细节之前，我们将花一些时间和精力来理解这个被称为数据的核心实体。理解它的各个方面，并根据需求掌握处理它的不同技术，这一点非常重要。\n\
  \n在本章中，我们将介绍数据在典型的机器学习相关用例中所经历的旅程，即数据从最初的原始形式转变为机器学习算法/模型可以使用的形式。我们将介绍各种数据格式、处理和整理技术，以使数据达到可以被机器学习算法用于分析的形式。我们还将学习不同的可视化技术，以更好地理解手头的数据。这些技术将帮助我们为后续章节以及现实世界场景中要解决的问题做好准备。\n\
  \n第一章介绍了 CRISP-DM 方法论。这是全球数据科学团队遵循的标准工作流程之一。在本章的后续部分，我们将重点讨论该方法的以下几个子部分：\n\n*  \
  \ 数据收集：了解不同数据类型的不同数据检索机制\n*   数据描述：了解所收集数据的各种属性和特征\n*   数据整理：为建模步骤准备数据以供使用\n*  \
  \ 数据可视化：可视化不同属性以分享结果、更好地理解等\n\n本章的代码示例、Jupyter 笔记本和示例数据集可在本书的 GitHub 仓库中找到，地址为 [`https://github.com/dipanjanS/practical-machine-learning-with-python`](https://github.com/dipanjanS/practical-machine-learning-with-python)，位于第三章的目录/文件夹下。\n\
  \n\n\n## 数据收集\n\n数据收集是一切工作的起点。尽管它被列为业务理解与问题定义之后的步骤，但数据收集常常是并行进行的。这样做是为了在形成完整的用例并着手处理之前，通过可用性、潜在价值等事实来辅助增强业务理解过程。当然，一旦问题陈述被定义且项目启动，数据收集就会以更正式、更完善的形式展开。\n\
  \n数据是我们周围一切的核心，这带来了巨大的机遇。然而，这也意味着数据必须以不同的格式、形态和规模存在。其无处不在的特性也意味着数据存在于各种系统中，例如传统机器（如大型机）、网络（如网站和网络应用）、数据库、平面文件、传感器、移动设备等。\n\
  \n让我们来看看一些最常见的数据格式及其收集方式。\n\n### CSV\n\nCSV 数据文件是最广泛使用的数据格式之一。它也是跨领域不同系统仍在使用的、最古老的格式之一。逗号分隔值（CSV）是一种数据文件，其每个属性都由一个“,”（逗号）分隔。图\
  \ 3-1 展示了一个典型 CSV 文件的快速概览。\n\n![A448827_1_En_3_Fig1_HTML.jpg](img/A448827_1_En_3_Fig1_HTML.jpg)\n\
  \n图 3-1.\n\n示例 CSV 文件\n\n示例 CSV 展示了数据的典型排列方式。它包含不同数据类型的属性，这些属性由逗号分隔。CSV 可能包含一个可选的标题行（如示例所示）。CSV\
  \ 也可以选择性地将每个属性用单引号或双引号括起来，以便更好地界定。虽然 CSV 通常用于存储表格数据，即行和列形式的数据，但这并非唯一的方式。\n\nCSV\
  \ 有多种变体，只需将分隔符改为制表符，就变成了 TSV（制表符分隔值）文件。其基本思想是使用一个唯一的符号来界定/分隔不同的属性。\n\n既然我们已经了解了\
  \ CSV 的样子，现在让我们运用一些 Python 魔法来读取/提取这些数据以供使用。\n\n使用 Python 这类语言的优势之一在于其抽象和处理大量事务的能力。与其他需要特定库或大量代码才能完成基本任务的语言不同，Python\
  \ 能轻松优雅地处理。读取 CSV 文件也是如此。读取 CSV 最简单的方法是通过 Python 的 `csv` 模块。该模块提供了一个名为 `reader()`\
  \ 的抽象函数。`reader` 函数接收一个文件对象作为输入，并返回一个包含从 CSV 文件读取信息的 `iterator`。以下代码片段使用 `csv.reader()`\
  \ 函数来读取指定文件。\n\n```\ncsv_reader = csv.reader(open(file_name, 'rb'), delimiter=',')\n\
  ```\n\n一旦返回了 `iterator`，我们就可以轻松地遍历其内容，并以所需的形式/格式获取数据。为了完整性，让我们看一个示例，该示例使用 `csv`\
  \ 模块读取图 3-1 中所示的 CSV 文件内容。然后，我们将提取每个属性，并将数据转换为一个以属性名为键的 `dict`。以下代码片段实现了这些操作。\n\n\
  ```\ncsv_rows = list()\ncsv_attr_dict = dict()\ncsv_reader = None\n# 读取 csv\ncsv_reader\
  \ = csv.reader(open(file_name, 'rb'), delimiter=delimiter)\n# 迭代并提取数据\nfor row in\
  \ csv_reader:\nprint(row)\ncsv_rows.append(row)\n# 迭代并将数据添加到属性列表\nfor row in csv_rows[1:]:\n\
  csv_attr_dict['sno'].append(row[0])\ncsv_attr_dict['fruit'].append(row[1])\ncsv_attr_dict['color'].append(row[2])\n\
  csv_attr_dict['price'].append(row[3])\n```\n\n输出是一个 `dict`，其中每个属性作为一个 `key`，其值是从\
  \ CSV 文件读取的有序 `list`。\n\n```\nCSV Attributes::\n{'color': ['red', 'yellow', 'yellow',\
  \ 'orange', 'green', 'yellow', 'green'],\n'fruit': ['apple', 'banana', 'mango',\
  \ 'orange', 'kiwi', 'pineapple', 'guava'],\n'price': ['110.85', '50.12', '70.29',\
  \ '80.00', '150.00', '90.00', '20.00'],\n'sno': ['1', '2', '3', '4', '5', '6', '7']}\n\
  ```\n\n从 CSV 中提取数据及其转换方式取决于用例需求。将我们的示例 CSV 转换为属性 `dict` 只是其中一种方式。我们可以根据数据和需求选择不同的输出格式。\n\
  \n尽管处理和读取 CSV 文件的工作流程相当直接且易于使用，但我们希望标准化并加速这一过程。此外，通常情况下，以表格形式理解数据更为容易。在上一章中，我们了解了\
  \ `pandas` 库及其一些令人惊叹的功能。现在，让我们也利用 `pandas` 来读取 CSV。\n\n以下代码片段展示了与 `csv` 模块相比，`pandas`\
  \ 如何使从 CSV 中读取和提取数据变得更简单、更一致。\n\n```\ndf = pd.read_csv(file_name,sep=delimiter)\n\
  ```\n\n只需一行代码和几个可选参数（根据需求），`pandas` 就能从 CSV 文件中提取数据到一个数据框（dataframe）中，这是相同数据的表格化表示。使用\
  \ `pandas` 的主要优势之一在于它能够处理 CSV 文件中的许多不同变体，例如带或不带标题的文件、属性值用引号括起来、推断数据类型等等。此外，各种机器学习库能够直接操作\
  \ `pandas` 数据框，这使其实际上成为了处理 CSV 文件的事实标准包。\n\n前面的代码片段生成了以下输出数据框：\n\n```\nsno     \
  \ fruit   color   price\n0    1      apple     red  110.85\n1    2     banana  yellow\
  \   50.12\n2    3      mango  yellow   70.29\n3    4     orange  orange   80.00\n\
  4    5       kiwi   green  150.00\n5    6  pineapple  yellow   90.00\n6    7   \
  \   guava   green   20.00\n```\n\n注意\n\n`pandas` 让读取 CSV 文件的过程变得轻而易举，然而，当我们需要更多灵活性时，`csv`\
  \ 模块就派上了用场。例如，并非每个用例都需要表格形式的数据，或者数据格式可能不一致，这时就需要像 `csv` 这样灵活的库来启用自定义逻辑以处理此类数据。\n\
  \n同样地，来自包含非逗号分隔符（如制表符或分号）的平面文件的数据，也可以使用这两个模块轻松处理。在后续章节处理特定用例时，我们将使用这些工具；在此之前，鼓励大家探索并尝试使用它们，以便更好地理解。\n\
  \n\n### JSON\n\nJavaScript 对象表示法（JSON）是数字领域中使用最广泛的数据交换格式之一。JSON 是 XML（我们将在下一节讨论这种格式）等传统格式的轻量级替代方案。JSON\
  \ 是一种文本格式，与语言无关，并遵循特定的约定。JSON 是一种人类可读的格式，在大多数编程/脚本语言中易于/简单解析。JSON 文件/对象本质上是一组名称（键）-值对的集合。这种键值对结构在编程语言中有对应的数据结构，例如字典（Python\
  \ `dict`）、`struct`、`object`、`record`、键控列表等。更多详细信息请访问 [`http://www.json.org/`](http://www.json.org/)。\n\
  \nJSON 标准定义了其结构，如图 3-2 所示。\n\n![A448827_1_En_3_Fig2_HTML.jpg](img/A448827_1_En_3_Fig2_HTML.jpg)\n\
  \n图 3-2.\n\nJSON 对象结构（参考：[`http://www.json.org/`](http://www.json.org/)）\n\n图 3-3\
  \ 是一个示例 JSON，展示了一条包含多种不同数据类型属性的词汇表记录。\n\n![A448827_1_En_3_Fig3_HTML.jpg](img/A448827_1_En_3_Fig3_HTML.jpg)\n\
  \n图 3-3.\n\n示例 JSON（参考：[`http://www.json.org/`](http://www.json.org/)）\n\nJSON 被广泛用于在系统之间传输信息。Python\
  \ 中与 JSON 对象等价的数据类型是 `dict`，它本身就是一个键值对结构。Python 有各种与 JSON 相关的库，提供了抽象和实用函数。`json`\
  \ 库就是其中之一，它允许我们处理 JSON 文件/对象。让我们先看一下示例 JSON 文件，然后使用这个库将这些数据导入 Python 以供使用。\n\n![A448827_1_En_3_Fig4_HTML.jpg](img/A448827_1_En_3_Fig4_HTML.jpg)\n\
  \n图 3-4.\n\n包含嵌套属性的示例 JSON\n\n图 3-4 中的 JSON 对象展示了一个相当嵌套的结构，其中包含字符串、数字和数组类型的值。JSON\
  \ 也支持对象、布尔值和其他数据类型作为值。以下代码片段读取文件内容，然后使用 `json.loads()` 实用函数将其解析并转换为标准的 Python `dict`。\n\
  \n```\njson_filedata = open(file_name).read()\njson_data = json.loads(json_filedata)\n\
  ```\n\n`json_data` 是一个 Python `dict`，其键和值是解析后的 JSON 文件内容，并已类型转换为 Python 数据类型。`json`\
  \ 库还提供了将 Python 字典写回为 JSON 文件的实用函数，并具备错误检查和类型转换功能。上述操作的输出如下所示。\n\n```\nouter_col_1\
  \ :\nnested_inner_col_1 : val_1\nnested_inner_col_2 : 2\nnested_inner_col_1 : val_2\n\
  nested_inner_col_2 : 2\nouter_col_2 :\ninner_col_1 : 3\nouter_col_3 : 4\n```\n\n\
  在继续介绍下一种格式之前，值得注意的是，`pandas` 也提供了解析 JSON 的实用函数。`pandas read_json()` 是一个非常强大的实用函数，它提供了多种选项来处理不同风格的\
  \ JSON。图 3-5 展示了一个示例 JSON，它表示多个数据点，每个数据点有两个属性，分别列为 `col_1` 和 `col_2`。\n\n![A448827_1_En_3_Fig5_HTML.jpg](img/A448827_1_En_3_Fig5_HTML.jpg)\n\
  \n图 3-5.\n\n展示具有相似属性记录的示例 JSON\n\n我们可以使用 `pandas` 轻松解析这样的 JSON，只需将 `orientation`\
  \ 参数设置为 “`records`”，如下所示。\n\n```\ndf = pd.read_json(file_name,orient=\"records\"\
  )\n```\n\n输出是一个表格型数据框，每个数据点由两个属性值表示，如下所示。\n\n```\ncol_1 col_2\n0     a     b\n1\
  \     c     d\n2     e     f\n3     g     h\n4     i     j\n5     k     l\n```\n\
  \n建议你阅读更多关于 `pandas read_json()` 的内容，请访问 [`https://pandas.pydata.org/pandas-docs/stable/generated/pandas.read_json.html`](https://pandas.pydata.org/pandas-docs/stable/generated/pandas.read_json.html)。\n\
  \n### XML\n\n我们已经介绍了两种最广泛使用的数据格式，现在让我们来看看 XML。XML 是一种相当古老的格式，但仍被许多系统使用。XML 或可扩展标记语言是一种标记语言，它定义了在互联网上共享数据/文档的编码规则。与\
  \ JSON 一样，XML 也是一种人类可读的文本格式。其设计目标包括对各种人类语言的强大支持（通过 Unicode）、平台无关性和简单性。XML 被广泛用于表示各种形状和大小的数据。\n\
  \nXML 被广泛用作不同系统的配置格式、元数据以及 RSS、SOAP 等服务的数据表示格式。\n\nXML 是一种具有语法规则和模式的语言，这些规则和模式多年来不断被定义和完善。XML\
  \ 最重要的组成部分如下：\n\n*   **标签**：一种标记结构，由尖括号（“<” 和 “>”）括起来的字符串表示。\n*   **内容**：未在标签语法内标记的任何数据，都是\
  \ XML 文件/对象的内容。\n*   **元素**：XML 的逻辑结构。一个元素可以由一个开始标签和一个结束标签定义，可以带有属性，也可以只是一个空标签。\n\
  *   **属性**：表示所考虑元素的属性或特性的键值对。这些属性包含在开始标签或空标签内。\n\n图 3-6 是一个示例 XML，展示了可扩展标记语言的各个组成部分。有关关键概念和细节的更多信息，可以浏览\
  \ [`https://www.w3schools.com/xml/`](https://www.w3schools.com/xml/)。\n\n![A448827_1_En_3_Fig6_HTML.jpg](img/A448827_1_En_3_Fig6_HTML.jpg)\n\
  \n图 3-6.\n\n标注了关键组件的示例 XML\n\nXML 可以被视为树状结构，从一个根元素开始，分支到各种元素，每个元素都有自己的属性和进一步的分支，内容位于叶节点。\n\
  \n大多数 XML 解析器使用这种树状结构来读取 XML 内容。以下是两种主要的 XML 解析器类型：\n\n*   **DOM 解析器**：文档对象模型解析器是\
  \ XML 最接近树形表示的形式。它解析 XML 并生成树结构。DOM 解析器的一个主要缺点是处理大型 XML 文件时的不稳定性。\n*   **SAX 解析器**：XML\
  \ 简单 API（简称 SAX）是一种在网络上广泛使用的变体。这是一种基于事件的解析器，它逐个元素地解析 XML，并提供钩子来根据标签触发事件。这克服了 DOM\
  \ 基于内存的限制，但缺乏整体的表示能力。\n\n从这两种类型衍生出了多种变体。首先，让我们看看 Python 的 `xml` 库中提供的 `ElementTree`\
  \ 解析器。`ElementTree` 解析器是对 DOM 解析器的优化，它利用 Python 的数据结构（如 `lists` 和 `dicts`）以简洁的方式处理数据。\n\
  \n以下代码片段使用 `ElementTree` 解析器加载并解析我们之前看到的示例 XML 文件。`parse()` 函数返回一个树对象，该对象具有各种属性、迭代器和实用函数，用于提取解析后的\
  \ XML 的根元素及更多组件。\n\n```\ntree = ET.parse(file_name)\nroot = tree.getroot()\nprint(\"\
  Root tag:{0}\".format(root.tag))\nprint(\"Attributes of Root:: {0}\".format(root.attrib))\n\
  ```\n\n这两个 `print` 语句为我们提供了与根标签及其属性（如果有）相关的值。根对象还附带一个迭代器，可用于提取与所有子节点相关的信息。以下代码片段迭代根对象以打印子节点的内容。\n\
  \n```\nfor child in xml:root:\nprint(\"{0}tag:{1}, attribute:{2}\".format(\n\"\\\
  t\"*indent_level,\nchild.tag,\nchild.attrib))\nprint(\"{0}tag data:{1}\".format(\"\
  \\t\"*indent_level,\nchild.text))\n```\n\n\n\n使用 `ElementTree` 解析 XML 后生成的最终输出如下。我们使用了一个自定义的打印工具来让输出更易读，该工具的代码可在仓库中找到。\n\
  \n```\nRoot tag:records\nAttributes of Root:: {'attr': 'sample xml records'}\ntag:record,\
  \ attribute:{'name': 'rec_1'}\ntag data:\ntag:sub_element, attribute:{}\ntag data:\n\
  tag:detail1, attribute:{}\ntag data:Attribute 1\ntag:detail2, attribute:{}\ntag\
  \ data:2\ntag:sub_element_with_attr, attribute:{'attr': 'complex'}\ntag data:\n\
  Sub_Element_Text\ntag:sub_element_only_attr, attribute:{'attr_val': 'only_attr'}\n\
  tag data:None\ntag:record, attribute:{'name': 'rec_2'}\ntag data:\ntag:sub_element,\
  \ attribute:{}\ntag data:\ntag:detail1, attribute:{}\ntag data:Attribute 1\ntag:detail2,\
  \ attribute:{}\ntag data:2\ntag:sub_element_with_attr, attribute:{'attr': 'complex'}\n\
  tag data:\nSub_Element_Text\ntag:sub_element_only_attr, attribute:{'attr_val': 'only_attr'}\n\
  tag data:None\n```\n\n`xml` 库通过 `ElementTree` 解析器提供了非常有用的工具，但其功能仍有所欠缺。另一个 Python\
  \ 库 `xmltodict` 提供了类似的功能，但使用了 Python 的原生数据结构（如 `dicts`）来提供更 Pythonic 的 XML 处理方式。以下是解析同一\
  \ XML 的快速代码片段。与 `ElementTree` 不同，`xmltodict` 的 `parse()` 函数读取文件对象并将其内容转换为嵌套字典。\n\
  \n```\nxml_filedata = open(file_name).read()\nordered_dict = xmltodict.parse(xml_filedata)\n\
  ```\n\n生成的输出与使用 `ElementTree` 生成的输出类似，区别在于 `xmltodict` 使用 `@` 符号自动标记元素和属性。以下是示例输出。\n\
  \n```\nrecords :\n@attr : sample xml records\nrecord :\n@name : rec_1\nsub_element\
  \ :\ndetail1 : Attribute 1\ndetail2 : 2\nsub_element_with_attr :\n@attr : complex\n\
  #text : Sub_Element_Text\nsub_element_only_attr :\n@attr_val : only_attr\n```\n\n\
  ### HTML 与网页抓取\n\n我们在本章开头讨论了以极快速度生成的巨量信息/数据。互联网或万维网是这场革命的主要驱动力之一，再加上计算机、智能手机和平板电脑的广泛普及。\n\
  \n互联网是一个通过超链接连接的巨大信息网络。互联网上的大量数据以网页的形式存在。这些网页日复一日地被生成、更新和消费数百万次。由于信息存在于这些网页中，我们必须学会如何与之交互并提取这些信息/数据。\n\
  \n到目前为止，我们处理过 CSV、JSON 和 XML 等格式，这些格式可以通过手动下载、API 等各种方法获取/提取。但对于网页，方法则有所不同。在本节中，我们将讨论\
  \ HTML 格式（最常见的网页相关格式）以及网页抓取技术。\n\n#### HTML\n\n超文本标记语言（HTML）是一种类似于 XML 的标记语言。HTML\
  \ 主要由网络浏览器和类似应用程序用于渲染网页以供消费。\n\nHTML 使用标记定义了描述网页的规则和结构。以下是 HTML 页面的标准组件：\n\n*  \
  \ **元素**：构成 HTML 页面基本构建块的逻辑结构。\n*   **标签**：由尖括号（`<` 和 `>`）定义的标记结构。一些重要的标签包括：\n \
  \   *   `<html></html>`：这对标签包含整个 HTML 文档。它标记了 HTML 页面的开始和结束。\n    *   `<body></body>`：这对标签包含浏览器渲染的\
  \ HTML 页面的主要内容。\n\nHTML 标准中定义了许多其他标准标签集；更多信息请访问 [`https://www.w3schools.com/html/html_intro.asp`](https://www.w3schools.com/html/html_intro.asp)。\n\
  \n以下是一个生成 HTML 页面的代码片段，该页面由网络浏览器渲染，如图 3-7 中的截图所示。\n\n![A448827_1_En_3_Fig7_HTML.jpg](img/A448827_1_En_3_Fig7_HTML.jpg)\n\
  \n图 3-7.\n\n浏览器中渲染的示例 HTML 页面\n\n```\n\nSample HTML Page\n\nSample WebPage\nHTML\
  \ has been rendered\n\n```\n\n浏览器使用标记标签来理解特殊指令，如文本格式、定位、超链接等，但仅向最终用户渲染内容以供查看。对于数据/信息存在于\
  \ HTML 页面中的用例，我们需要特殊的技术来提取这些内容。\n\n\n\n#### 网页抓取\n\n网页抓取是一种从网络（尤其是网页）中抓取或提取数据的技术。网页抓取可能涉及手动复制数据，或使用自动化工具来爬取、解析和提取网页中的信息。在大多数情况下，网页抓取指的是自动爬取特定网站或网络的一部分，以提取和解析信息，这些信息随后可用于分析或其他用途。一个典型的网页抓取流程可概括如下：\n\
  \n*   **爬取**：设计一个机器人或网络爬虫，使用所需的 URL 集合向网络服务器发送请求，以获取网页。爬虫可能采用复杂的技术来获取相关 URL 所链接页面中的信息，甚至在一定程度上解析信息。网站会维护一个名为\
  \ `robots.txt` 的文件，以实施所谓的“机器人排除协议”，从而限制或允许对其内容的访问。更多详情请参见 [`http://www.robotstxt.org/robotstxt.html`](http://www.robotstxt.org/robotstxt.html)。\n\
  *   **抓取**：一旦获取到原始网页，下一步就是从中提取信息。抓取任务涉及使用正则表达式、基于 XPath 的提取或特定标签等技术，以精确定位页面上的所需信息。\n\
  \n网页抓取在精确定位所需信息方面需要发挥创造力。随着网站不断变化、网页变得动态化（例如 `asp`、`jsp` 等），以及访问控制（用户名/密码、验证码等）的存在，使得这项任务更加复杂。Python\
  \ 是一种非常强大的编程语言，这一点现在应该已经很明显了，而网页抓取是它提供多种实用工具的另一个领域。让我们从提取 Apress 博客上的一篇博文文本开始，以便更好地理解网页抓取。\n\
  \n第一步是确定我们感兴趣的 URL。在当前示例中，我们专注于 Apress 网站博客页面 [`http://www.apress.com/in/blog/all-blog-posts`](http://www.apress.com/in/blog/all-blog-posts)\
  \ 上当天第一篇博文。点击最顶部的博文会跳转到我们要考虑的主文章。该文章在屏幕上的显示如图 3-8 所示。\n\n![A448827_1_En_3_Fig8_HTML.jpg](img/A448827_1_En_3_Fig8_HTML.jpg)\n\
  \n图 3-8.\n\nApress.com 上的一篇博文\n\n现在我们有了所需的页面及其 URL，我们将使用 `requests` 库来查询所需的 URL\
  \ 并获取响应。以下代码片段实现了这一功能。\n\n```\nbase_url = \"http://www.apress.com/in/blog/all-blog-posts\"\
  \nblog_suffix = \"/wannacry-how-to-prepare/12302194\"\nresponse = requests.get(base_url+blog_suffix)\n\
  ```\n\n如果 `get` 请求成功，响应对象的 `status_code` 属性将包含值 200（相当于 HTTP 成功代码）。在获得成功响应后，下一步是设计一种方法来提取所需信息。\n\
  \n由于在本例中我们关心的是博文的实际内容，让我们分析一下页面背后的 HTML，看看是否能找到感兴趣的特定标签。\n\n注意\n\n大多数现代浏览器都内置了 HTML\
  \ 检查工具。如果你使用的是 Google Chrome，请按 F12 或右键单击页面并选择“检查”或“查看源代码”。这将打开 HTML 代码供你分析。\n\n\
  图 3-9 展示了我感兴趣的博文背后 HTML 的快照。\n\n![A448827_1_En_3_Fig9_HTML.jpg](img/A448827_1_En_3_Fig9_HTML.jpg)\n\
  \n图 3-9.\n\n检查 Apress.com 上博文的 HTML 内容\n\n经过仔细检查，我们可以清楚地看到博文的文本包含在 `div` 标签 `<div\
  \ class=\"cms-richtext\">` 中。现在我们已经缩小到感兴趣的标签，我们使用 Python 的正则表达式库 `re` 来搜索并仅提取这些标签内的数据。以下代码片段使用\
  \ `re.compile()` 编译一个正则表达式，然后使用 `re.findall()` 从获取的响应中提取信息。\n\n```\ncontent_pattern\
  \ = re.compile(r'(.*?)')\nresult = re.findall(content_pattern, content)\n```\n\n\
  `find` 操作的输出是博文中的所需文本。当然，它仍然包含与实际文本交织在一起的 HTML 标签。我们可以进行进一步的清理以达到所需级别，但这已经是一个良好的开端。以下是使用正则表达式提取的信息快照。\n\
  \n```\nOut[59]: 'By Mike HalseyIt was a perfectly ordinary Friday when the Wannacry\
  \ ransomware struck in May 2017\\. The malware spread around the world to more than\
  \ 150 countries in just a matter of a few hours, affecting the National Health Service\
  \ in the UK, telecoms provider Telefonica in Spain, and many other organisations\
  \ and businesses in the USA, Canada, China, Japan, Russia, and right across Europe,\
  \ the Middle-East, and Asia.The malware was reported to have been stolen in an attack\
  \ on the US National Security Agency (NSA), though the NSA denied this, and exploited\
  \ vulnerabilities in the Microsoft Windows operating system. Microsoft had been\
  \ aware of the vulnerabilities since early in the year, and had patched them back\
  \ in March.\n```\n\n这是一种直接且非常基础的方法来获取所需数据。如果我们想更进一步，提取页面上所有博文的相关信息并进行更好的清理，该怎么办？\n\
  \n对于此类任务，我们使用 `BeautifulSoup` 库。`BeautifulSoup` 是用于网页抓取及相关任务的首选标准库。它提供了一些出色的功能来简化抓取过程。对于手头的任务，我们的流程是首先爬取索引页面，提取页面上列出的所有博文链接的\
  \ URL。为此，我们将使用 `requests.get()` 函数来提取内容，然后利用 `BeautifulSoup` 的实用工具从这些 URL 中获取内容。以下代码片段展示了\
  \ `get_post_mapping()` 函数，该函数解析主页内容，将博文标题和相应的 URL 提取到一个字典中。该函数最终返回一个此类字典的列表。\n\n\
  ```\ndef get_post_mapping(content):\n\"\"\"This function extracts blog post title\
  \ and url from response object\nArgs:\ncontent (request.content): String content\
  \ returned from requests.get\nReturns:\nlist: a list of dictionaries with keys title\
  \ and url\n\"\"\"\npost_detail_list = []\npost_soup = BeautifulSoup(content,\"lxml\"\
  )\nh3_content = post_soup.find_all(\"h3\")\nfor h3 in h3_content:\npost_detail_list.append(\n\
  {'title':h3.a.get_text(),'url':h3.a.attrs.get('href')}\n)\nreturn post_detail_list\n\
  ```\n\n上述函数首先创建一个 `BeautifulSoup` 对象，并指定 `lxml` 作为其解析器。然后，它使用 `h3` 标签和基于正则表达式的搜索来提取所需的标签列表（我们通过之前使用的相同检查元素方法找到了\
  \ `h3` 标签）。接下来的任务就是简单地遍历 `h3` 标签列表，并利用 `BeautifulSoup` 的 `get_text()` 实用函数来获取博文标题及其对应的\
  \ URL。该函数返回的列表如下所示。\n\n\n\n```\n[{'title': u\"WannaCry：为何这只是开始，以及如何为后续威胁做好准备\",\n\
  'url': '/in/blog/all-blog-posts/wannacry-how-to-prepare/12302194'},\n{'title': u'在\
  \ Angular 中复用 ngrx/effects（在 reducers 之间通信）',\n'url': '/in/blog/all-blog-posts/reusing-ngrx-effects-in-angular/12279358'},\n\
  {'title': u'采访 Tony Smith——作家兼 SharePoint 专家',\n'url': '/in/blog/all-blog-posts/interview-with-tony-smith-author-and-sharepoint-expert/12271238'},\n\
  {'title': u'理解传感器——类型与识别层级',\n'url': '/in/blog/all-blog-posts/making-sense-of-sensors/12253808'},\n\
  {'title': u'VS 2017、.NET Core 与 JavaScript 框架，天哪！',\n'url': '/in/blog/all-blog-posts/vs-2017-net-core-and-javascript-frameworks-oh-my/12261706'}]\n\
  ```\n\n现在我们有了列表，最后一步就是遍历这个 URL 列表，提取每篇博客文章的文本。以下函数展示了与之前使用正则表达式的方法相比，`BeautifulSoup`如何简化了任务。识别所需标签的方法保持不变，但我们利用了这个库的强大功能来获取不含所有\
  \ HTML 标签的纯文本。\n\n```\ndef get_post_content(content):\n\"\"\"此函数从响应对象中提取博客文章内容\n\
  参数:\ncontent (request.content): 从 requests.get 返回的字符串内容\n返回:\nstr: 博客的纯文本内容\n\"\"\
  \"\nplain_text = \"\"\ntext_soup = BeautifulSoup(content,\"lxml\")\npara_list =\
  \ text_soup.find_all(\"div\",\n{'class':'cms-richtext'})\nfor p in para_list[0]:\n\
  plain_text += p.getText()\nreturn plain_text\n```\n\n以下输出是其中一篇文章的内容。请注意，与之前的方法相比，此处的文本更加干净。\n\
  \n```\nBy Mike Halsey2017 年 5 月，一个看似平常的星期五，WannaCry 勒索病毒突然爆发。该恶意软件在短短几小时内蔓延至全球 150\
  \ 多个国家，影响了英国国家医疗服务体系、西班牙电信公司 Telefonica，以及美国、加拿大、中国、日本、俄罗斯和整个欧洲、中东及亚洲的众多其他组织与企业。据报道，该恶意软件是在一次针对美国国家安全局的攻击中被窃取的，尽管\
  \ NSA 否认了这一点，并且它利用了微软 Windows 操作系统中的漏洞。微软早在当年年初就已获悉这些漏洞，并于 3 月份发布了补丁。\n```\n\n通过这两种方法，我们从目标网站抓取并提取了与博客文章相关的信息。建议您尝试使用`BeautifulSoup`的其他实用工具，并结合其他网站进行实践，以便更好地理解。当然，请务必阅读`robots.txt`并遵守网站管理员设定的规则。\n\
  \n### SQL\n\n数据库的历史可以追溯到 20 世纪 70 年代，它们代表了以关系形式存储的大量数据。数据库中以表格形式存在的数据，或者更具体地说，关系型数据库中的数据，构成了我们在处理不同用例时遇到的另一种结构化数据格式。多年来，出现了多种不同风格的数据库，其中大多数都遵循\
  \ SQL 标准。\n\nPython 生态系统主要通过两种方式处理来自数据库的数据。第一种也是最常见的方式，用于数据科学及相关用例，是直接使用 SQL 查询访问数据。为了使用\
  \ SQL 查询访问数据，像`sqlalchemy`和`pyodbc`这样强大的库提供了便捷的接口，用于连接、提取和操作来自各种关系型数据库（如 MS SQL\
  \ Server、MySQL、Oracle 等）的数据。`sqlite3`库提供了一个轻量级且易于使用的接口来处理 SQLite 数据库，不过其他两个库同样可以处理该任务。\n\
  \n与数据库交互的第二种方式是 ORM（对象关系映射）方法。这种方法与面向对象的数据模型类似，即关系数据被映射为对象和类。`Sqlalchemy`提供了一个高级接口，用于以\
  \ ORM 方式与数据库交互。我们将在后续章节中根据具体用例进一步探讨这些内容。\n\n## 数据描述\n\n在上一节中，我们讨论了各种数据格式及其信息提取方法。每种数据格式都由包含不同类型属性的数据点组成。这些原始数据形式的数据类型构成了机器学习算法以及整个数据科学工作流中其他任务所使用输入特征的基础。在本节中，我们将介绍在处理不同用例时遇到的主要数据类型。\n\
  \n### 数值型\n\n这是最简单的一种数据类型。它也是大多数算法可以直接使用和理解的类型（尽管这并不意味着我们直接使用原始形式的数值数据）。数值数据表示被观测实体的标量信息，例如，网站访问次数、产品价格、人的体重等。数值也是向量特征的基础，其中每个维度由一个标量值表示。数值数据的尺度、范围和分布对算法和/或整个工作流有隐含的影响。为了处理数值数据，我们使用诸如归一化、分箱、量化等技术，根据需求对数值数据进行转换。\n\
  \n### 文本型\n\n由非结构化的字母数字内容组成的数据是最常见的数据类型之一。当文本数据表示人类语言内容时，它包含了隐含的语法结构和含义。这种数据类型需要额外的关注和努力来进行转换和理解。我们将在后续章节中介绍转换和使用文本数据的各个方面。\n\
  \n### 类别型\n\n这种数据类型介于数值型和文本型之间。类别变量指的是被观测实体的类别。例如，头发颜色为黑色、棕色、金色和红色，或经济状况为低、中、高。这些值可以用数字或字母数字表示，它们描述了所考虑项目的属性。根据某些特征，类别变量可以分为：\n\
  \n*   名义型：仅定义数据点的类别，无法进行排序。例如，头发颜色可以是黑色、棕色、金色等，但这些类别之间没有顺序。\n*   有序型：定义类别，但也可以根据上下文规则进行排序。例如，按经济状况（低、中、高）分类的人群可以明确地按相应顺序排序。\n\
  \n需要注意的是，标准的数学运算（如加法、减法、乘法等）对类别变量没有意义，即使它们在语法上可能允许（例如用数字表示的类别变量）。因此，谨慎处理类别变量非常重要，我们将在下一节中介绍几种处理类别数据的方法。\n\
  \n不同的数据类型构成了算法处理当前数据时所使用的特征基础。在接下来的章节中，特别是第 4 章：特征工程与选择，您将学习更多关于如何处理特定数据类型的内容。\n\
  \n\n\n## 数据整理\n\n到目前为止，本章讨论了数据格式和数据类型，并学习了从不同来源收集数据的方法。既然我们已经了解了收集和理解数据的初始过程，那么合乎逻辑的下一步就是能够根据手头的用例，使用各种机器学习算法对数据进行分析。但在这些“原始”数据达到可供算法或可视化使用的阶段之前，我们需要对其进行打磨和塑形。\n\
  \n数据整理（Data wrangling）或数据清洗（data munging）是指对数据进行清洗、转换和映射，使其从一种形式变为另一种形式，以便用于分析、汇总、报告、可视化等任务的过程。\n\
  \n### 理解数据\n\n数据整理是整个数据科学工作流程中最重要且最耗时的步骤之一。此过程的输出会直接影响所有下游步骤，例如探索、汇总、可视化、分析，甚至最终结果。这清楚地说明了为什么数据科学家会花费大量时间在数据收集和整理上。有许多调查都揭示了这样一个事实：数据科学家往往会把\
  \ 80% 的时间花在数据处理和整理上！\n\n因此，在接下来的章节中开始处理实际用例和算法之前，我们必须理解并学习如何整理数据，并将其转换为可用的形式。首先，让我们描述一下手头的数据集。为简单起见，我们准备了一个示例数据集，描述了某些用户的产品购买交易。由于我们已经讨论了收集/提取数据的方法，本节将跳过这一步。图\
  \ 3-10 显示了数据集的快照。\n\n![A448827_1_En_3_Fig10_HTML.jpg](img/A448827_1_En_3_Fig10_HTML.jpg)\n\
  \n图 3-10.\n\n示例数据集 注意\n\n所考虑的数据集是使用标准 Python 库（如 `random, datetime, numpy, pandas`\
  \ 等）生成的。该数据集是使用本书代码仓库中名为 `generate_sample_data()` 的实用函数生成的。数据是随机生成的，仅用于表示目的。\n\n\
  该数据集描述了具有以下属性/特征/特性的交易：\n\n*   日期：交易日期\n*   价格：所购产品的价格\n*   产品 ID：产品识别号\n*   购买数量：本次交易中购买的产品数量\n\
  *   序列号：交易序列号\n*   用户 ID：执行交易的用户的识别号\n*   用户类型：用户类型\n\n现在，让我们开始整理/清洗过程，并了解各种方法/技巧，以清洗、转换和映射我们的数据集，使其成为可用的形式。通常，第一步也是最重要的一步是快速查看记录/行数、列/属性数、列/属性名称及其数据类型。\n\
