  \ 12-9.\n\n用于神经风格迁移的 Italy Street 图像（内容图像）和 Wave Style 画作（风格图像）\n\n我们尝试了更多组图像，结果确实令人惊喜且赏心悦目。对于一幅描绘意大利街道的图像（见图\
  \ 12-9），其神经风格迁移的输出结果在不同迭代次数下如图 12-10 所示。\n\n![A448827_1_En_12_Fig10_HTML.jpg](img/A448827_1_En_12_Fig10_HTML.jpg)\n\
  \n图 12-10.\n\n意大利街道图像在第 1 次、第 10 次和第 20 次迭代时的风格迁移结果\n\n图 12-10 中展示的结果无疑令人赏心悦目，并给人一种整座城市都在水下的感觉！我们鼓励您使用自己的图像，并采用同样的框架进行尝试。同时，也欢迎您尝试使用不同的卷积层来提取风格和内容的特征表示，正如\
  \ Gatys 等人和 Johnson 等人所提及的那样。\n\n注意\n\n神经风格迁移的概念和细节由 Gatys 等人和 Johnson 等人在他们各自的论文中介绍和解释，论文可在\
  \ [ `https://arxiv.org/abs/1508.06576` ](https://arxiv.org/abs/1508.06576) 和 [`https://arxiv.org/abs/1603.08155`](https://arxiv.org/abs/1603.08155)\
  \ 获取。您也可以查阅 François Chollet 所著的《Python 深度学习》一书，以及 Harish Narayanan 关于神经风格迁移的精彩博客，其中提供了详细的分步指南：[`https://harishnarayanan.org/writing/artistic-style-transfer/`](https://harishnarayanan.org/writing/artistic-style-transfer/)\
  \ 。\n\n总结\n\n\n\n本章介绍了机器学习领域最前沿的主题。通过本章，我们运用了关于机器学习（尤其是深度学习）的知识，来理解图像分类、迁移学习和风格迁移的概念。本章首先快速回顾了与卷积神经网络相关的概念，以及它们为何是处理图像相关数据的优化架构。接着，我们着手开发图像分类器。第一个分类器是从零开始构建的，借助\
  \ Keras 我们取得了不错的效果。第二个分类器则利用预训练的 VGG-19 深度 CNN 模型作为图像特征提取器。基于预训练模型的分类器帮助我们理解了迁移学习的概念及其优势。本章的结尾部分介绍了神经风格迁移这一高级主题，这也是本章的主要亮点。风格迁移是将参考图像的风格应用到特定目标图像上的过程，在此过程中，目标图像的原始内容保持不变。该过程利用了\
  \ CNN 在不同粒度上理解图像特征的潜力，并结合了迁移学习。基于我们对这些概念的理解，以及 Gatys 等人和 Johnson 等人的研究工作，我们提供了实现神经风格迁移系统的分步指南。最后，我们展示了一些神经风格迁移过程的惊人成果来结束本节。\n\
  \n深度学习每天都在开辟新的可能性。它在不同领域和问题上的应用，正展现出解决以往未知问题的潜力。机器学习是一个不断演进且涉猎广泛的领域。通过本书，我们从机器学习框架和\
  \ Python 生态系统的基础知识，一路学习到各种算法和概念。随后，我们在多个章节中介绍了多个用例，展示了使用机器学习工具箱中的工具解决问题的不同场景和方法。机器学习的宇宙正以惊人的速度扩张；我们在此尝试是希望引导你在这段奇妙的旅程中走上正确的轨道。\n\
