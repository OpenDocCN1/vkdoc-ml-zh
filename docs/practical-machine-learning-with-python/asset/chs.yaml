  我们的特征集考虑了单词和二元词组。我们现在可以使用一些在文本分类上表现非常好的传统监督机器学习算法。我们建议您在将来处理自己的数据集时使用逻辑回归、支持向量机和多项式朴素贝叶斯模型。在本章中，我们使用逻辑回归和
  SVM 构建了模型。以下代码片段有助于初始化这些分类模型估计器。


  ```

  In [4]: from sklearn.linear_model import SGDClassifier, LogisticRegression

  ...:

  ...: lr = LogisticRegression(penalty=''l2'', max_iter=100, C=1)

  ...: svm = SGDClassifier(loss=''hinge'', n_iter=100)

  ```


  在不深入过多理论复杂性的情况下，逻辑回归模型是一种用于分类的监督线性机器学习模型，尽管其名称如此。在该模型中，我们试图预测给定的电影评论属于某个离散类别（在我们的场景中是二分类）的概率。模型用于学习的函数如下所示。


  ![$$ P\left(y= positive\;\left|X\right.\right)=\upsigma\;\left({\theta}^T\;X\right)
  $$](img/A448827_1_En_7_Chapter_Equa.gif)


  ![$$ P\left(y= negative\;\left|X\right.\right)=1-\upsigma\;\left({\theta}^T\;X\right)
  $$](img/A448827_1_En_7_Chapter_Equb.gif)


  其中，模型试图使用特征向量 和  来预测情感类别， 通常被称为 sigmoid 函数、逻辑函数或 logit 函数。该模型的主要目标是搜索  的最优值，使得当特征向量  对应正面电影评论时，正面情感类别的概率最大，而当其对应负面电影评论时，概率最小。逻辑函数有助于对概率进行建模，以描述最终的预测类别。可以通过使用标准方法（如梯度下降）最小化适当的成本/损失函数来获得  的最优值（如果您对更多细节感兴趣，请参考第
  5 章中的“逻辑回归的三个阶段”部分）。逻辑回归也常被称为 logit 回归或最大熵分类器。


  我们现在将使用 `model_evaluation_utils` 模块中的实用函数 `train_predict_model(...)` 在我们的训练特征上构建一个逻辑回归模型，并在我们的测试特征上评估模型性能（步骤
  4 和 5）。见图 7-5。


