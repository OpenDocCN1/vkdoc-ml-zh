  \n关于推荐引擎库的说明\n\n你可能已经注意到，我们没有使用任何现成的包来构建我们的推荐系统。就像每个可能的任务一样，Python 也有多个可用于构建推荐引擎的库。但我们避免使用这些库，因为我们想让你体验一下推荐引擎背后的原理。大多数这些库将接受稀疏矩阵格式作为输入数据，并允许你开发推荐引擎。我们鼓励你继续使用至少其中一个库进行实验，因为它将让你了解探索同一问题的不同可能实现以及这些实现可能带来的差异。你可以用于此类探索的一些库包括\
  \ `scikit-surprise`、`lightfm`、`crab`、`rec_sys` 等。\n\n总结\n\n在本章中，我们学习了推荐系统，这是一个重要且广为人知的机器学习应用。我们发现了一个非常流行的数据源，它让我们得以一窥在线音乐听众的一小部分。然后，我们开始了构建不同类型推荐引擎的学习曲线。我们从基于歌曲流行度的简单普通版本开始。之后，我们通过开发基于项目相似度的推荐引擎，提高了推荐引擎的复杂度。我们敦促你使用百万歌曲数据库提供的元数据来扩展该推荐引擎。最后，我们通过构建一个采用完全不同视角的推荐引擎来结束本章。我们探索了矩阵分解的一些基础知识，并学习了如何使用像奇异值分解这样非常基本的分解方法来开发推荐。我们以提及你可以使用哪些不同的库来从我们创建的数据集开发复杂的引擎来结束本章。\n\
  \n我们想通过进一步强调推荐引擎的重要性来结束本章，尤其是在在线内容交付的背景下。一个经常与推荐系统相关的未经证实的事实是，“Netflix 60% 的电影观看是通过推荐进行的”。根据维基百科，Netflix\
  \ 的年收入约为 80 亿美元。即使其中一半来自电影，即使这个数字是 30% 而不是 60%，也意味着 Netflix 大约 10 亿美元的收入可以归因于推荐引擎。虽然我们永远无法验证这些数字，但它们无疑是推荐引擎及其所能产生的价值的有力论据。\n\
  \n11. 预测股票和商品价格\n\n在迄今为止的章节中，我们涵盖了各种概念并解决了多样化的现实世界问题。在本章中，我们将深入探讨预测/预报用例。预测分析或建模涉及数据挖掘、高级统计学、机器学习等概念，以对历史数据进行建模来预测未来事件。预测建模在金融服务、医疗保健、电信等领域都有用例。\n\
  \n多年来，已经开发了许多技术来理解时间序列数据并对模式进行建模，以对未来事件和行为进行评分。时间序列分析构成了此类数据的描述性方面，这种理解有助于对相同数据进行建模和预测。像回归分析（见第\
  \ 6 章）和 Box-Jenkins 方法这样的传统方法多年来已被深入研究并应用。最近，计算和机器学习算法的改进使得像神经网络或更具体地说，深度学习这样的机器学习技术在预测用例中取得了进展，并取得了一些惊人的结果。\n\
  \n本章讨论使用股票和商品价格数据集进行预测。我们将利用传统的时间序列模型以及像循环神经网络这样的深度学习模型来预测价格。通过本章，我们将涵盖以下主题：\n\n\
  *   时间序列分析简要概述\n*   使用传统方法（如 ARIMA）预测商品价格\n*   使用较新的深度学习方法（如 RNN 和 LSTM）预测股票价格\n\
  \n本章的代码示例、jupyter 笔记本和示例数据集可在本书的 GitHub 仓库 [ `https://github.com/dipanjanS/practical-machine-learning-with-python`\
  \ ](https://github.com/dipanjanS/practical-machine-learning-with-python) 的第 11 章目录/文件夹下找到。\n\
  \n时间序列数据与分析\n\n时间序列是以时间顺序排列的观测值序列。观测值以等间隔的时间间隔记录。时间序列数据在统计学、经济学、金融学、天气建模、模式识别等领域可用并得到利用。\n\
  \n时间序列分析是研究产生观测值的底层结构和力量。它提供了描述性框架来分析数据的特征和其他有意义的统计量。它还提供了利用这些信息来拟合模型以进行预测、监控和控制的技术。\n\
  \n还有另一种思想流派将时间序列的描述性和建模组件分开。在这里，时间序列分析通常只关注时间序列数据的描述性分析，以理解各种组件和底层结构。利用时间序列进行预测/预报用例的建模方面被称为时间序列预测。尽管总的来说，两种思想流派都使用相同的工具和技术集。这更多是关于如何将概念分组以进行结构化学习和应用。\n\
  \n注意 时间序列及其分析本身就是一个完整的研究领域，我们在这里仅为我们的用例讨论某些概念和技术。本章绝不是时间序列及其分析的完整指南。\n\n时间序列可以在频域和时域中进行分析。频域分析包括谱分析和小波分析技术，而时域包括自相关和互相关分析。在本章中，我们主要关注时域中的时间序列预测，并简要讨论时间序列数据的描述性特征。此外，我们专注于单变量时间序列分析（时间是隐式变量）。\n\
  \n为了更好地理解与时间序列相关的概念，我们使用一个样本数据集。以下代码片段使用 `pandas` 加载了一个每日频率的网站访问数据。你可以参考 jupyter\
  \ 笔记本 `notebook_getting_started_time_series.ipynb` 获取必要的代码片段和示例。该数据集可在 [`http://openmv.net/info/website-traffic`](http://openmv.net/info/website-traffic)\
  \ 获取。\n\n```\nIn [1] : import pandas as pd\n...:\n...: #load data\n...: input_df\
  \ = pd.read_csv(r'website-traffic.csv')\n...:\n...: input_df['date_of_visit'] =\
  \ pd.to_datetime(input_df.MonthDay.\\\n...:                                    \
  \         str.cat( input_df.Year.astype(str),\n...:                            \
  \                 sep=' '))\n```\n\n该代码片段首先使用基础数据框中可用的日、月和年值的组合创建了一个名为 `date_of_visit`\
  \ 的新属性。由于数据集是关于每日网站访问量的，感兴趣的变量是当天的访问次数，时间维度即 `date_of_visit` 是隐式的。每日访问量的输出图如图 11-1\
  \ 所示。\n\n![A448827_1_En_11_Fig1_HTML.jpg](img/A448827_1_En_11_Fig1_HTML.jpg)\n\n\
  图 11-1.\n\n每日网站访问量\n\n时间序列组件\n\n手头的时间序列是与给定网站每日网站访问量相关的数据。如前所述，时间序列分析涉及理解导致我们看到的序列的底层结构和力量。现在让我们尝试解构构成当前时间序列的各种组件。一个时间序列被认为由以下三个主要组件组成：\n\
  \n*   季节性：这是观测数据中的周期性波动。例如，天气模式或销售模式。\n*   趋势：这是序列随时间增加或减少的行为。例如，人口增长模式。\n*   残差：这是去除季节性和趋势信号后剩下的信号。它可以进一步分解以去除噪声成分。\n\
  \n有趣的是，大多数现实世界的时间序列数据都包含这些组件的组合或全部。然而，噪声几乎总是明显存在，而趋势和季节性在某些情况下是可选的。在以下代码片段中，我们利用\
  \ `statsmodels` 将我们的网站访问时间序列分解为其三个组成部分，然后绘制它们。\n\n```\nIn [2] : from statsmodels.tsa.seasonal\
  \ import seasonal_decompose\n...:\n...: # extract visits as series from the dataframe\n\
  ...: ts_visits = pd.Series(input_df.Visits.values,\n...:                       \
  \  index=pd.date_range(\n...:                                         input_df.date_of_visit.min(),\n\
  ...:                                         input_df.date_of_visit.max(),\n...:\
  \                                         freq='D')\n...:                      \
  \   )\n...:\n...:\n...: deompose = seasonal_decompose(ts_visits.interpolate(),\n\
  ...:                               freq=24)\n...: deompose.plot()\n```\n\n我们首先创建一个\
  \ `pandas` `Series` 对象，并特别注意设置时间序列索引的频率。重要的是要注意，`statsmodels` 有许多可用的时间序列建模模块，它们依赖于底层数据结构（如\
  \ `pandas`、`numpy` 等）来指定时间序列的频率。在这种情况下，由于数据是每日级别的，我们将 `ts_visits` 对象的频率设置为 '`D`'，表示每日频率。然后，我们只需使用\
  \ `statsmodels` 中的 `seasonal_decompose()` 函数来获取所需的组成部分。分解后的序列如图 11-2 中的图所示。\n\n\
  ![A448827_1_En_11_Fig2_HTML.jpg](img/A448827_1_En_11_Fig2_HTML.jpg)\n\n图 11-2.\n\
  \n网站访问时间序列及其组成信号\n\n从图 11-2 可以明显看出，手头的时间序列既有上升趋势也有下降趋势。它显示出逐渐上升的趋势，直到 10 月，之后开始下降。该序列肯定具有月度周期性或季节性。剩下的信号在图\
  \ 11-2 中被标记为残差。\n\n平滑技术\n\n正如前几章所讨论的，原始数据的预处理取决于数据以及用例需求。然而，对于每种类型的数据，都有某些标准的预处理技术。与我们迄今为止看到的数据集不同，在那些数据集中，我们认为每个观测值独立于其他（过去或未来）观测值，时间序列对历史观测值具有固有的依赖性。从网站访问序列的分解可以看出，每个观测值受到多个因素的影响。时间序列数据的一个固有属性是，除了其他组成部分之外，还存在随机变化。为了更好地理解、建模和利用时间序列进行预测相关任务，我们通常会执行一个预处理步骤，更好地称为平滑。平滑有助于减少随机变化的影响，并有助于清晰地揭示序列的季节性、趋势和残差成分。有多种方法可以平滑时间序列。它们大致分类如下。\n\
  \n移动平均\n\n移动平均不是取整个时间序列的平均值（我们在非时间序列数据的情况下这样做）来汇总，而是利用滚动窗口方法。在这种情况下，我们计算每个连续较小过去数据窗口的平均值，以平滑随机变化的影响。以下是移动平均计算的一般公式。\n\
  \n![$$ M{A}_t=\\frac{x_t+{x}_{t-1}+{x}_{t-2}+\\dots +{x}_{t-n}}{n} $$](img/A448827_1_En_11_Chapter_Equa.gif)\n\
  \n其中，MA [t] 是时间周期 t 的移动平均，x [t]、x [t-1] 等表示特定时间周期的观测值，n 是窗口大小。例如，以下代码片段计算了窗口大小为\
  \ 3 的访问量的移动平均。\n\n```\nIn [3] : # moving average\n...: input_df['moving_average']\
  \ = input_df['Visits'].rolling(window=3,\n...:                                 \
  \                       center=False).mean()\n...:\n...: print(input_df[['Visits','moving_average']].head(10))\n\
  ...:\n...: plt.plot(input_df.Visits,'-',color='black',alpha=0.3)\n...: plt.plot(input_df.moving_average,color='b')\n\
  ...: plt.title('Website Visit and Moving Average Smoothening')\n...: plt.legend()\n\
  ...: plt.show()\n```\n\n使用窗口大小 3 计算的移动平均具有以下结果。应该很清楚，对于窗口大小 3，前两个观测值不会有任何移动平均值，因此是\
  \ `NaN`。\n\n![A448827_1_En_11_Fig3_HTML.jpg](img/A448827_1_En_11_Fig3_HTML.jpg)\n\
  \n图 11-3.\n\n使用移动平均进行平滑\n\n```\nOut[3]:\nVisits  moving_average\n0      27     \
  \        NaN\n1      31             NaN\n2      38       32.000000\n3      38  \
  \     35.666667\n4      31       35.666667\n5      24       31.000000\n6      21\
  \       25.333333\n7      29       24.666667\n8      30       26.666667\n9     \
  \ 22       27.000000\n```\n\n图 11-3 中的图显示了平滑后的访问量时间序列。平滑后的序列捕捉了原始序列的整体结构，同时减少了其中的随机变化。我们鼓励你探索和尝试不同的窗口大小并比较结果。\n\
  \n根据手头的用例和数据，除了不同的窗口大小之外，我们还会尝试移动平均的不同变体，如居中移动平均、双移动平均等。在本章后续部分处理实际用例时，我们将利用其中一些概念。\n\
  \n指数平滑\n\n基于移动平均的平滑是有效的，但它是一种相当简单的预处理技术。在移动平均的情况下，窗口中的所有过去观测值被赋予相等的权重。与先前方法不同，指数平滑技术对较旧的观测值应用指数递减的权重。简单来说，指数平滑方法给予较近的过去观测值比更旧的观测值更多的权重。根据所需的平滑水平，在指数平滑的情况下，可能需要设置一个或多个平滑参数。\n\
  \n指数平滑也称为指数加权移动平均，简称 EWMA。单指数平滑是最简单的入门方法之一。一般公式如下：\n\n![$$ {E}_t=\\alpha {y}_{t-1}+\\\
  left(1-\\alpha \\right){E}_{t-1} $$](img/A448827_1_En_11_Chapter_Equb.gif)\n\n其中，E\
  \ [t] 是第 t 个平滑观测值，y 是 t-1 时刻的实际观测值，`α` 是介于 0 和 1 之间的平滑常数。有不同方法来引导 E [2] 的值（平滑开始的时间周期）。可以通过将其设置为\
  \ y [1] 或前 n 个时间周期的平均值等来实现。此外，α 的值决定了考虑多少过去。接近 1 的值会快速减弱过去观测值的影响，而接近 0 的值则缓慢减弱。以下代码片段使用\
  \ `pandas ewm()` 函数来计算访问量的平滑序列。在这种情况下，参数 `halflife` 用于计算 α。\n\n```\nIn [4] : input_df['ewma']\
  \ = input_df['Visits'].ewm(halflife=3,\n...:                                   \
  \              ignore_na=False,\n...:                                          \
  \       min_periods=0,\n...:                                                 adjust=True).mean()\n\
  ...:\n...: plt.plot(input_df.Visits,'-',color='black',alpha=0.3)\n...: plt.plot(input_df.ewma,color='g')\n\
  ...: plt.title('Website Visit and Exponential Smoothening')\n...: plt.legend()\n\
  ...: plt.show()\n```\n\n图 11-4 中描绘的图展示了 EWMA 平滑后的序列以及原始序列。\n\n![A448827_1_En_11_Fig4_HTML.jpg](img/A448827_1_En_11_Fig4_HTML.jpg)\n\
  \n图 11-4.\n\n使用 EWMA 进行平滑\n\n在接下来的章节中，我们将应用我们对时间序列、预处理技术等的理解，使用不同的预测方法来解决股票和商品价格预测问题。\n\
  \n预测黄金价格\n\n黄金，这种闪亮的黄色金属，自古以来就是人类的珍爱之物。从制作珠宝到用作投资，黄金涵盖了广泛的用例。黄金，像其他金属一样，也在世界各地的商品指数上进行交易。为了更好地理解现实世界场景中的时间序列，我们将使用历史收集的黄金价格数据，并预测其未来价值。让我们首先正式陈述问题。\n\
  \n问题陈述\n\n像黄金这样的金属在世界各地交易多年。黄金的价格每天根据多种因素确定并用于在商品交易所进行金属交易。仅使用这些每日价格水平信息，我们的任务是预测黄金的未来价格。\n\
  \n数据集\n\n对于任何问题，首先也是最重要的是数据。股票和商品交易所在存储和共享每日水平定价数据方面做得非常出色。出于此用例的目的，我们将使用来自 Quandl\
  \ 的黄金定价数据。Quandl 是一个金融、经济和替代数据集平台。你可以参考 jupyter 笔记本 `notebook_gold_forecast_arima.ipynb`\
  \ 获取必要的代码片段和示例。\n\n要访问 Quandl 上公开共享的数据集，我们可以使用 `pandas-datareader` 库以及 `quandl`（Quandl\
  \ 本身的库）。对于此用例，我们将依赖 `quandl`。请使用 `pip` 或 `conda` 安装它。以下代码片段显示了一个快速的一行代码，可以获取自 1970\
  \ 年代以来的黄金定价信息。\n\n```\nIn [5]: import quandl\n...: gold_df = quandl.get(\"BUNDESBANK/BBK01_WT5511\"\
  , end_date=\"2017-07-31\")\n```\n\n`get()` 函数将股票/商品标识符作为第一个参数，后跟我们需要数据的截止日期。请注意，并非所有数据集都是公开的，有些需要获取\
  \ API 访问权限。\n\n传统方法\n\n时间序列分析和预测已被详细研究很长时间。有成熟且广泛的建模技术可用。其中，以下是一些最常用和探索的技术：\n\n\
  *   基于简单移动平均和指数平滑的预测\n*   基于 Holt's、Holt-Winter's 指数平滑的预测\n*   Box-Jenkins 方法（AR、MA、ARIMA、S-ARIMA\
  \ 等）\n\n注意\n\n因果或横截面预测/建模是指目标变量与一个或多个预测变量存在关系的情况，例如回归模型（见第 6 章）。时间序列预测是关于预测随时间变化的变量。这两种技术都被归入定量技术之下。\n\
  \n如前所述，有相当多的技术可用，每一种都是一个深入的研究和学习主题。在本节和本章的范围内，我们将专注于 ARIMA 模型（来自 Box-Jenkins 方法）来预测黄金价格。在我们继续讨论\
  \ ARIMA 之前，让我们看几个关键概念。\n\n关键概念\n\n*   平稳性：这是我们接下来要讨论的 ARIMA 模型背后的关键假设之一。平稳性指的是时间序列的均值、方差和自相关不随时间变化的性质。换句话说，均值、方差和自相关不随时间改变。例如，具有上升（或下降）趋势的时间序列是非平稳性的一个明显指标，因为其均值会随时间变化（参见上一节中的网站访问数据示例）。\n\
  *   差分：使序列平稳的方法之一。虽然可以有其他变换，但差分被广泛用于稳定时间序列的均值。我们只需计算连续观测值之间的差异来获得差分序列。然后，我们可以应用不同的检验来确认结果序列是否平稳。我们还可以根据手头的时间序列执行二阶差分、季节性差分等。\n\
  *   单位根检验：帮助我们理解给定序列是否平稳的统计检验。增广迪基-富勒检验以序列非平稳的零假设开始，而 Kwiatkowski-Phillips-Schmidt-Shin\
  \ 检验或 KPSS 的零假设是序列是平稳的。然后，我们执行回归拟合以拒绝或无法拒绝零假设。\n\nARIMA\n\nBox-Jenkins 方法包括广泛的统计模型，这些模型被广泛用于对时间序列进行建模以进行预测。在本节中，我们将专注于一个这样的模型，称为\
  \ ARIMA。\n\nARIMA 代表自回归积分滑动平均模型。听起来很复杂，对吧？让我们看看这个模型的基础和组成部分，然后在此基础上理解以预测黄金价格。\n\n\
  *   自回归或 AR 建模：一个简单的线性回归模型，其中当前观测值对一个或多个先前观测值进行回归。该模型表示为：\n    ![$$ {X}_t=\\delta\
  \ +{\\theta}_1{X}_{t-1}+\\dots +{\\theta}_p{X}_{t-p}+{\\varepsilon}_t $$](img/A448827_1_En_11_Chapter_Equc.gif)\n\
  \    其中，X [t] 是时间 t 的观测值，ε[t] 是噪声，并且\n    ![$$ \\delta =\\left(1-\\sum \\limits_{i=1}^p{\\\
  theta}_i\\right)\\mu $$](img/A448827_1_En_11_Chapter_Equd.gif)\n    对先前值的依赖性由 p\
  \ 或 AR 模型的阶数表示。\n*   移动平均或 MA 建模：同样本质上是一个线性回归模型，它模拟了来自先前观测值的噪声/误差对当前观测值的影响。该模型表示为：\n\
  \    ![$$ {X}_t=\\mu +{\\varepsilon}_t-{\\varphi}_1{\\varepsilon}_{t-1}+\\dots +{\\\
  varphi}_q{\\varepsilon}_{t-q} $$](img/A448827_1_En_11_Chapter_Eque.gif)\n    其中，μ\
  \ 是序列均值，ε [i] 是噪声项，q 是模型的阶数。\n\nAR 和 MA 模型在 Box-Jenkins 方法提出之前很久就已为人所知。然而，该方法提出了一种系统的方法来识别和应用这些模型进行预测。\n\
  \n注意\n\nBox、Jenkins 和 Reinsel 在他们名为《时间序列分析：预测与控制》的书中提出了这种方法。我们鼓励你阅读它以获得更深入的理解。\n\
  \nARIMA 模型是这两个模型的逻辑进展和组合。然而，如果我们将 AR 和 MA 与差分序列结合起来，我们得到的就是所谓的 ARIMA(p,d,q) 模型。\n\
  \n其中，\n\n*   p 是自回归的阶数\n*   q 是移动平均的阶数\n*   d 是差分的阶数\n\n因此，对于平稳时间序列，ARIMA 模型结合了自回归和移动平均的概念来模拟长时间运行的时间序列的行为，并有助于预测。现在让我们应用这些概念来模拟黄金价格预测。\n\
  \n建模\n\n在描述数据集时，我们使用 `quandl` 提取了黄金价格信息。让我们首先绘制并查看这个时间序列的样子。以下代码片段使用 `pandas` 来绘制它。\n\
  \n```\nIn [6]: gold_df.plot(figsize=(15, 6))\n...: plt.show()\n```\n\n图 11-5 中的图显示了一个总体上升趋势，在\
  \ 1980 年代和 2010 年左右有突然的上涨。\n\n![A448827_1_En_11_Fig5_HTML.jpg](img/A448827_1_En_11_Fig5_HTML.jpg)\n\
  \n图 11-5.\n\n历年的黄金价格\n\n由于平稳性是 ARIMA 模型的主要假设之一，我们将利用增广迪基-富勒检验来检查我们序列的平稳性。以下代码片段帮助我们计算\
  \ AD Fuller 检验统计量并绘制序列的滚动特征。\n\n```\nIn [7]: # Dickey Fuller test for Stationarity\n\
  ...: def ad_fuller_test(ts):\n...: dftest = adfuller(ts, autolag='AIC')\n...: dfoutput\
  \ = pd.Series(dftest[0:4], index=['Test Statistic',\n...:                      \
  \                           'p-value',\n...:                                   \
  \              '#Lags Used',\n...:                                             \
  \    'Number of Observations Used'])\n...: for key,value in dftest[4].items():\n\
  ...:         dfoutput['Critical Value (%s)'%key] = value\n...: print(dfoutput)\n\
  ...:\n...: # Plot rolling stats for a time series\n...: def plot_rolling_stats(ts):\n\
  ...: rolling_mean = ts.rolling(window=12,center=False).mean()\n...: rolling_std\
  \ = ts.rolling(window=12,center=False).std()\n...:\n...: #Plot rolling statistics:\n\
  ...: orig = plt.plot(ts, color='blue',label='Original')\n...: mean = plt.plot(rolling_mean,\
  \ color='red', label='Rolling Mean')\n...: std = plt.plot(rolling_std, color='black',\
  \ label = 'Rolling Std')\n...: plt.legend(loc='best')\n...: plt.title('Rolling Mean\
  \ & Standard Deviation')\n...: plt.show(block=False)\n```\n\n如果 AD Fuller 检验的检验统计量小于临界值，我们拒绝非平稳性的零假设。AD\
  \ Fuller 检验可作为 `statsmodel` 库的一部分。由于很明显我们的黄金价格原始序列是非平稳的，我们将执行对数变换，看看是否能够获得平稳性。以下代码片段使用滚动统计图\
  \ and AD Fuller 检验来检查这一点。\n\n```\nIn [8]: log_series = np.log(gold_df.Value)\n...:\n\
  ...: ad_fuller_test(log_series)\n...: plot_rolling_stats(log_series)\n```\n\n检验统计量\
  \ -1.8 大于任一临界值，因此我们无法拒绝零假设，即即使在对数变换后，序列也是非平稳的。图 11-6 中显示的输出和图证实了这一点。\n\n![A448827_1_En_11_Fig6_HTML.jpg](img/A448827_1_En_11_Fig6_HTML.jpg)\n\
  \n图 11-6.\n\n对数变换后黄金价格的滚动均值和标准差图\n\n```\nTest Statistic                    -1.849748\n\
  p-value                            0.356057\n#Lags Used                        29.000000\n\
  Number of Observations Used    17520.000000\nCritical Value (1%)               -3.430723\n\
  Critical Value (5%)               -2.861705\nCritical Value (10%)              -2.566858\n\
  dtype: float64\n```\n\n该图指出了序列随时间变化的均值，因此是非平稳的。正如关键概念中所讨论的，对序列进行差分有助于实现平稳性。在以下代码片段中，我们准备了一阶差分对数序列并执行相同的检验。\n\
  \n```\nIn [9]: log_series_shift = log_series - log_series.shift()\n...: log_series_shift\
  \ = log_series_shift[∼np.isnan(log_series_shift)]\n...:\n...: ad_fuller_test(log_series_shift)\n\
  ...: plot_rolling_stats(log_series_shift)\n```\n\n检验统计量为 -23.91，甚至低于 1% 的临界值，因此我们拒绝\
  \ AD Fuller 检验的零假设。以下是检验结果。\n\n![A448827_1_En_11_Fig7_HTML.jpg](img/A448827_1_En_11_Fig7_HTML.jpg)\n\
  \n图 11-7.\n\n对数差分后黄金价格序列的滚动均值和标准差图\n\n```\nTest Statistic                   -23.917175\n\
  p-value                            0.000000\n#Lags Used                        28.000000\n\
  Number of Observations Used    17520.000000\nCritical Value (1%)               -3.430723\n\
  Critical Value (5%)               -2.861705\nCritical Value (10%)              -2.566858\n\
  dtype: float64\n```\n\n这个练习向我们指出，我们需要使用对数差分序列来让 ARIMA 对当前数据集进行建模。见图 11-7。然而，我们仍然需要找出自回归和移动平均分量的阶数，即\
  \ p 和 q。\n\n与其他模型相比，构建 ARIMA 模型需要一些经验和直觉。识别模型的 p、d 和 q 参数可以使用不同的方法完成，尽管找到正确的数字集既取决于需求也取决于经验。\n\
  \n一种常用的方法是绘制 ACF 和 PACF 图来确定 p 和 q 值。ACF 或自相关函数图和 PACF 或偏自相关函数图有助于我们缩小确定 p 和 q 值的搜索空间，但有一些注意事项。多年来，已经开发出某些规则或启发式方法来最好地利用这些图，因此这些并不能保证最佳可能值。\n\
  \nACF 图有助于我们理解观测值与其滞后（或先前值）的相关性。ACF 图用于确定 MA 阶数，即 q。ACF 下降的值是 MA 模型的阶数。\n\n同样，PACF\
  \ 指向观测值与特定滞后值之间的相关性，排除了其他滞后的影响。PACF 下降的值指向 AR 模型的阶数或 ARIMA(p,d,q) 中的 p。\n\n注意\n\n\
  有关 ACF 和 PACF 的更多详细信息，请访问 [`http://www.itl.nist.gov/div898/handbook/eda/section3/autocopl.htm`](http://www.itl.nist.gov/div898/handbook/eda/section3/autocopl.htm)\
  \ 。\n\n让我们再次利用 `statsmodels` 为我们的序列生成 ACF 和 PACF 图，并尝试确定 p 和 q 值。以下代码片段使用对数差分序列来生成所需的图。\n\
  \n```\nIn [10]: fig = plt.figure(figsize=(12,8))\n...: ax1 = fig.add_subplot(211)\n\
  ...: fig = sm.graphics.tsa.plot_acf(log_series_shift.squeeze(), lags=40, ax=ax1)\n\
  ...: ax2 = fig.add_subplot(212)\n...: fig = sm.graphics.tsa.plot_pacf(log_series_shift,\
  \ lags=40, ax=ax2)\n```\n\n输出图（图 11-8）显示 ACF 和 PACF 在滞后 1 处突然下降，因此分别指向 q 和 p 的可能值各为\
  \ 1。\n\n![A448827_1_En_11_Fig8_HTML.jpg](img/A448827_1_En_11_Fig8_HTML.jpg)\n\n\
  图 11-8.\n\nACF 和 PACF 图\n\nACF 和 PACF 图也有助于我们理解序列是否平稳。如果序列的 ACF 和 PACF 值逐渐减小，则表明序列具有非平稳性。\n\
  \n注意\n\n为任何 ARIMA 模型识别 p、d 和 q 值既是科学也是艺术。更多详细信息请访问 [`https://people.duke.edu/~rnau/411arim.htm`](https://people.duke.edu/%7Ernau/411arim.htm)\
  \ 。\n\n推导 p、d、q 参数的另一种方法是对参数空间执行网格搜索。这更符合机器学习的超参数调优方式。尽管 statsmodels 不提供这样的实用程序（尽管原因显而易见），但我们可以编写自己的实用程序来识别最佳拟合模型。此外，与任何其他机器学习/数据科学用例非常相似，我们需要将数据集拆分为训练集和测试集。我们利用\
  \ `scikit-learn` 的 `TimeSeriesSplit` 实用程序来帮助我们获得适当的训练和测试集。\n\n我们编写了一个实用函数 `arima_grid_search_cv()`\
  \ 来使用手头的黄金价格进行网格搜索和交叉验证结果。该函数在 `arima_utils.py` 模块中可供参考。以下代码片段执行五折交叉验证，并使用自动 ARIMA\
  \ 来找到最佳拟合模型。\n\n```\nIn [11]: results_dict = arima_gridsearch_cv(gold_df.log_series,cv_splits=5)\n\
  ```\n\n请注意，我们将对数变换后的序列作为输入传递给 `arima_gridsearch_cv()` 函数。正如我们之前看到的，对数差分序列帮助我们实现了平稳性，因此我们使用对数变换作为起点，并拟合一个\
  \ d 设置为 1 的 ARIMA 模型。函数调用为每个训练-测试拆分（我们有五个）生成详细的输出，每次迭代对 p、d 和 q 执行网格搜索。图 11-9 显示了第一次迭代的输出，其中训练集仅包含\
  \ 2924 个观测值。\n\n![A448827_1_En_11_Fig9_HTML.jpg](img/A448827_1_En_11_Fig9_HTML.jpg)\n\
  \n图 11-9.\n\n自动 ARIMA\n\n与我们使用 ACF-PACF 的发现类似，自动 ARIMA 建议基于 AIC 标准的最佳拟合模型是 ARIMA(1,1,1)。请注意，AIC\
  \ 或 Akaike 信息准则衡量拟合优度和简约性。它是一个相对指标，并不以绝对意义指向模型的质量，即如果所有被比较的模型都很差，AIC 将无法指出这一点。因此，AIC\
  \ 应作为启发式方法使用。较低的值指向更好的拟合模型。以下是 ARIMA(1,1,1) 拟合生成的摘要，见图 11-10。\n\n![A448827_1_En_11_Fig10_HTML.jpg](img/A448827_1_En_11_Fig10_HTML.jpg)\n\
  \n图 11-10.\n\nARIMA(1,1,1) 摘要\n\n摘要非常不言自明。顶部部分显示了关于训练样本、AIC 和其他指标的详细信息。中间部分讨论了拟合模型的系数。对于迭代\
  \ 1 的 ARIMA(1,1,1)，AR 和 MA 系数都具有统计显著性。使用 ARIMA(1,1,1) 拟合的迭代 1 的预测图如图 11-11 所示。\n\
  \n![A448827_1_En_11_Fig11_HTML.jpg](img/A448827_1_En_11_Fig11_HTML.jpg)\n\n图 11-11.\n\
  \nARIMA(1,1,1) 的预测图\n\n从图 11-11 中的图可以明显看出，该模型捕捉了总体上升趋势，尽管它错过了 1980 年左右值的突然跳跃。然而，它似乎很好地展示了使用这种方法可以实现什么。`arima_gridsearch_cv()`\
  \ 函数为五个不同的训练-测试拆分生成了类似的统计数据和图。我们观察到 ARIMA(1,1,1) 为我们提供了足够好的拟合，尽管我们可以定义额外的性能和误差标准来选择特定的模型。\n\
  \n在这种情况下，我们为已经有数据的时间段生成了预测。这有助于我们可视化和理解模型的表现。这也被称为回测。`statsmodels` 通过其 `forecast()`\
  \ 方法也支持样本外预测。此外，图 11-11 中的图展示了变换尺度（即对数尺度）下的值。可以轻松应用逆变换将数据恢复为原始形式。\n\n你还应该注意，商品价格受到许多其他因素的影响，如全球需求、经济状况（如衰退）等。因此，我们在这里展示的在某些方面是对复杂过程的朴素建模。我们需要更多的特征和属性来进行复杂的预测。\n\
  \n股票价格预测\n\n股票和金融工具交易是一个有利可图的选择。世界各地的股票市场促进了此类交易，从而实现了财富交换。股票价格一直在上下波动，拥有预测其走势的能力具有巨大的致富潜力。\n\
  \n股票价格预测长期以来一直让人们感兴趣。有像有效市场假说这样的假说，它认为持续击败市场几乎是不可能的，而其他人则不同意这一点。\n\n有许多已知的方法和正在进行的新研究来寻找让你致富的神奇公式。传统方法之一是时间序列预测，我们在上一节中看到了。基本面分析是另一种方法，其中分析了许多绩效比率来评估给定的股票。在新兴方面，有神经网络、遗传算法和集成技术。\n\
  \n注意 股票价格预测（以及上一节中的黄金价格预测）是解释概念和技术以建模现实世界数据和用例的尝试。本章绝不是算法交易的全面指南。算法交易本身就是一个完整的研究领域，你可以进一步探索。仅凭本章的知识不足以进行任何形式的交易，这超出了本书的范围和意图。\n\
  \n在本节中，我们将学习如何将循环神经网络 (RNN) 应用于股票价格预测问题，并理解其复杂性。\n\n问题陈述\n\n股票价格预测是预测给定股票未来价值的任务。给定\
  \ S&P 500 指数的历史每日收盘价，准备并比较预测解决方案。\n\nS&P 500 或标准普尔 500 指数是一个由来自美国经济不同部门的 500 只股票组成的指数，是美国股票的一个指标。其他此类指数有道琼斯\
  \ 30、NIFTY 50、日经 225 等。为了理解，我们使用 S&P 500 指数，概念和知识也可以应用于其他股票。\n\n数据集\n\n与黄金价格数据集类似，历史股票价格信息也是公开可用的。对于当前的用例，我们将利用\
  \ `pandas_datareader` 库使用雅虎财经数据库获取所需的 S&P 500 指数历史数据。我们将使用数据集中可用的收盘价信息，尽管开盘价、调整收盘价等其他信息也可用。\n\
  \n我们准备了一个实用函数 `get_raw_data()` 来将所需信息提取到 `pandas` 数据帧中。该函数将指数代码名称作为输入。对于 S&P 500\
  \ 指数，代码名称是 ^GSPC。以下代码片段使用该实用函数获取所需数据。\n\n```\nIn [1]: sp_df = get_raw_data('^GSPC')\n\
  ...: sp_close_series = sp_df.Close\n...: sp_close_series.plot()\n```\n\n收盘价的图如图\
  \ 11-12 所示。\n\n![A448827_1_En_11_Fig12_HTML.jpg](img/A448827_1_En_11_Fig12_HTML.jpg)\n\
  \n图 11-12.\n\nS&P 500 指数\n\n图 11-12 中的图显示，自 2010 年以来直到最近，我们都有可用的收盘价信息。\n\n请注意，相同的信息也可以通过\
  \ `quandl`（我们在上一节中用于获取黄金价格信息）获得。你也可以使用它来获取这些数据。\n\n循环神经网络：LSTM\n\n人工神经网络正被用于解决各种领域的许多用例。循环神经网络是一类具有建模序列数据能力的神经网络。LSTM\
  \ 或长短期记忆是一种 RNN 架构，对于建模任意时间间隔的信息非常有用。RNN，特别是 LSTM，在第 1 章中讨论过，而在第 7 章中探索了一个实际用例，用于分析来自电影评论的文本数据进行情感分析。\n\
  \n![A448827_1_En_11_Fig13_HTML.jpg](img/A448827_1_En_11_Fig13_HTML.jpg)\n\n图 11-13.\n\
  \nRNN 和 LSTM 单元的基本结构。（来源：Christopher Olah 的博客：colah.github.io）\n\n作为快速回顾，图 11-13\
  \ 指出了 RNN 的一般架构以及典型 LSTM 单元的内部结构。LSTM 由三个主要门组成——输入门、输出门和遗忘门。这些门协同工作，学习和存储与序列相关的长短期信息。更多详细信息，请参阅第\
  \ 7 章的高级监督深度学习模型。\n\n对于股票价格预测，我们将利用 LSTM 单元来实现 RNN 模型。RNN 在序列建模应用中特别有用；其中一些如下：\n\
  \n*   序列分类任务，如给定语料库的情感分析（详细用例见第 7 章）\n*   序列标注任务，如给定句子的词性标注\n*   序列映射任务，如语音识别\n\n\
  与传统的预测方法（如 ARIMA）不同，后者需要对时间序列信息进行预处理以符合平稳性和其他假设，以及参数识别（例如 p、d、q），神经网络（特别是 RNN）施加的限制要少得多。\n\
  \n由于股票价格信息也是时间序列数据，我们将探索 LSTM 在此用例中的应用并生成预测。有多种方法可以对此问题进行建模以预测值。以下部分涵盖了两种这样的方法。\n\
  \n回归建模\n\n我们在第 6 章中介绍了回归建模，以基于某些预测变量分析自行车需求。本质上，回归建模指的是研究因变量和自变量之间关系的过程。\n\n为了将我们当前的用例建模为回归问题，我们声明时间戳\
  \ t+1 的股票价格（因变量）是时间戳 t、t-1、t-2、…、t-n 的股票价格的函数。其中 n 是股票价格的过去窗口。\n\n现在我们有了一个关于如何对时间序列进行建模的框架，我们需要将时间序列数据转换为窗口形式。见图\
  \ 11-14。\n\n![A448827_1_En_11_Fig14_HTML.jpg](img/A448827_1_En_11_Fig14_HTML.jpg)\n\
  \n图 11-14.\n\n将股票价格时间序列转换为窗口格式\n\n窗口变换在图 11-15 中概述，其中使用了窗口大小为 4。使用过去四个值来预测时间 t+1\
  \ 的值。我们有自 2010 年以来的 S&P 500 指数数据，因此我们将以滚动方式应用此窗口变换并创建多个这样的序列。因此，如果我们有一个长度为 M 的时间序列和一个大小为\
  \ n 的窗口，则总共会生成 M-n-1 个窗口。\n\n![A448827_1_En_11_Fig15_HTML.jpg](img/A448827_1_En_11_Fig15_HTML.jpg)\n\
  \n图 11-15.\n\n来自原始时间序列的滚动/滑动窗口\n\n对于本节中的动手示例，你可以参考 jupyter 笔记本 `notebook_stock_prediction_regression_modeling_lstm.ipynb`\
  \ 获取必要的代码片段和示例。为了使用 LSTM 对我们的时间序列进行建模，我们需要应用另一层变换才能将数据输入。LSTM 接受 3D 张量作为输入，我们将每个窗口（或序列）转换为\
  \ (N, W, F) 格式。这里，N 是来自原始时间序列的样本或窗口数量，W 是每个窗口的大小或历史时间步数，F 是每个时间步的特征数量。在我们的例子中，由于我们只使用收盘价，F\
  \ 等于 1，N 和 W 是可配置的。以下函数使用 `pandas` 和 `numpy` 执行窗口化和 3D 张量变换。\n\n```\ndef get_reg_train_test(timeseries,sequence_length=\
  \ 51,\ntrain_size=0.9,roll_mean_window=5,\nnormalize=True,scale=False):\n```\n\n\
  \n"
- "# 平滑序列\nif roll_mean_window:\n    timeseries = timeseries.rolling(roll_mean_window).mean().dropna()\n\
  \n"
- "# 创建窗口\nresult = []\nfor index in range(len(timeseries) - sequence_length):\n \
  \   result.append(timeseries[index: index + sequence_length])\n\n"
- "# 以第 0 个索引为基准进行归一化\nif normalize:\n    normalised_data = []\n    for window in\
  \ result:\n        normalised_window = [((float(p) / float(window[0])) - 1) \\\n\
  \                             for p in window]\n        normalised_data.append(normalised_window)\n\
  \    result = normalised_data\n\n"
- '# 划分训练集与测试集

  result = np.array(result)

  row = round(train_size * result.shape[0])


  '
- '# 拆分训练集和测试集

  train = result[:int(row), :]

  test = result[int(row):, :]


  '
- "# 将数据缩放到 0-1 范围\nscaler = None\nif scale:\n    scaler = MinMaxScaler(feature_range=(0,\
  \ 1))\n    train = scaler.fit_transform(train)\n    test = scaler.transform(test)\n\
  \n"
- '# 拆分自变量和因变量

  x_train = train[:, :-1]

  y_train = train[:, -1]

  x_test = test[:, :-1]

  y_test = test[:, -1]




  '
- "# LSTM 输入的变换\nx_train = np.reshape(x_train, (x_train.shape[0],\nx_train.shape[1],\n\
  1))\nx_test = np.reshape(x_test, (x_test.shape[0],\nx_test.shape[1],\n1))\nreturn\
  \ x_train,y_train,x_test,y_test,scaler\n```\n\n函数 `get_reg_train_test()` 还执行了许多其他可选的预处理步骤。它允许我们在应用窗口化之前，使用滚动均值对时间序列进行平滑处理。我们还可以根据需求对数据进行归一化和缩放。神经网络对输入值很敏感，通常建议在训练网络之前对输入进行缩放。对于这个用例，我们将对时间序列进行归一化处理，即对于每个窗口，每个时间步都是相对于该窗口第一个值的百分比变化（我们也可以使用缩放，或两者都使用，并重复该过程）。\n\
  \n在我们的案例中，我们从六天的窗口大小开始（你可以尝试更小或更大的窗口，并观察差异）。以下代码片段使用了 `get_reg_train_test()` 函数，并将归一化设置为\
  \ true。\n\n```\nIn [2] : WINDOW = 6\n...: PRED_LENGTH = int(window/2)\n...: x_train,y_train,x_test,y_test,scaler\
  \ = get_reg_train_test(sp_close_series,\n...:                                  \
  \                       sequence_length=WINDOW +1,\n...:                       \
  \                                  roll_mean_window=None,\n...:                \
  \                                         normalize=True,\n...:                \
  \                                         scale=False)\n```\n\n此代码片段创建了一个七天的窗口，其中包含六天的历史数据（`x_train`）和一天的预测值\
  \ `y_train`。训练和测试变量的形状如下。\n\n```\nIn [3] : print(\"x_train shape={}\".format(x_train.shape))\n\
  ...: print(\"y_train shape={}\".format(y_train.shape))\n...: print(\"x_test shape={}\"\
  .format(x_test.shape))\n...: print(\"y_test shape={}\".format(y_test.shape))\nx_train\
  \ shape=(2516, 6, 1)\ny_train shape=(2516,)\nx_test shape=(280, 6, 1)\ny_test shape=(280,)\n\
  ```\n\n`x_train` 和 `x_test` 张量符合我们之前讨论过的 (N, W, F) 格式，这也是 RNN 输入所要求的格式。我们的训练集中有\
  \ 2516 个序列，每个序列有六个时间步和一个待预测的值。同样，测试集中有 280 个序列。\n\n现在我们已经准备好了预处理后的数据集，接下来使用 `keras`\
  \ 构建一个 RNN 网络。`keras` 框架为我们提供了高级抽象，可以在 `theano` 和 `tensorflow` 后端上处理神经网络。以下代码片段展示了使用\
  \ `get_reg_model()` 函数准备的模型。\n\n```\nIn [4]: lstm_model = get_reg_model(layer_units=[50,100],\n\
  ...:                         window_size=window)\n```\n\n生成的 LSTM 模型架构有两个隐藏的 `LSTM`\
  \ 层堆叠在一起，第一层有 50 个 LSTM 单元，第二层有 100 个。输出层是一个具有线性激活函数的 `Dense` 层。我们使用均方误差作为损失函数进行优化。由于我们正在堆叠\
  \ LSTM 层，我们需要将 `return_sequences` 设置为 true，以便后续层能够获取所需的值。显而易见，`keras` 抽象了大部分繁重的工作，使得仅用几行代码就能构建甚至非常复杂的架构变得非常直观。\n\
  \n下一步是训练我们的 LSTM 网络。我们使用批次大小为 16，训练 20 个周期，并设置 5% 的验证集。以下代码片段使用 `fit()` 函数来训练模型。\n\
  \n```\nIn [5]: # 使用早停法避免过拟合\n...: callbacks = [keras.callbacks.EarlyStopping(monitor='val_loss',\n\
  ...:                                                 patience=2,\n...:         \
  \                                        verbose=0)]\n...: lstm_model.fit(x_train,\
  \ y_train,\n...:                 epochs=20, batch_size=16,\n...:               \
  \  verbose=1,validation_split=0.05,\n...:                 callbacks=callbacks)\n\
  ```\n\n模型会生成每个运行周期的训练和验证损失信息。早停回调使我们能够在连续两个周期没有观察到进一步改进时停止训练。我们从批次大小 16 开始；你可以尝试更大的批次大小并观察差异。\n\
  \n模型拟合完成后，下一步是使用 `predict()` 函数进行预测。由于我们将其建模为一个具有固定窗口大小的回归问题，我们将为每个序列生成预测。为此，我们编写了另一个名为\
  \ `predict_reg_multiple()` 的实用函数。该函数将 lstm 模型、窗口化数据集、窗口和预测长度作为输入参数，为每个输入窗口返回一个预测列表。`predict_reg_multiple()`\
  \ 函数的工作方式如下。\n\n1.  对于窗口化序列列表中的每个序列，重复步骤 a-c：\n\n    1.  使用 keras 的 `predict()`\
  \ 函数生成一个输出值。\n\n    2.  将此输出值附加到输入序列的末尾，并移除第一个值以保持窗口大小。\n\n    3.  然后重复此过程（步骤 a\
  \ 和 b），直到达到所需的预测长度。\n\n2.  该函数利用预测值来预测后续值。\n\n该函数可在脚本 `lstm_utils.py` 中找到。以下代码片段使用\
  \ `predict_reg_multiple()` 函数获取测试集上的预测结果。\n\n```\nIn [6] : test_pred_seqs = predict_reg_multiple(lstm_model,\n\
  ...:                                         x_test,\n...:                     \
  \                    window_size=WINDOW,\n...:                                 \
  \        prediction_len=PRED_LENGTH)\n```\n\n为了分析性能，我们将计算拟合序列的 RMSE。我们使用 `sklearn`\
  \ 的 `metrics` 模块来实现。以下代码片段计算了 RMSE 分数。\n\n```\nIn [7] : test_rmse = math.sqrt(mean_squared_error(y_test[1:],\n\
  ...:                                                 np.array(test_pred_seqs).\\\
  \n...:                                                 flatten()))\n...: print('Test\
  \ Score: %.2f RMSE' % (test_rmse))\nTest Score: 0.01 RMSE\n```\n\n输出 RMSE 为 0.01。作为练习，你可以比较不同窗口大小和预测长度下的\
  \ RMSE，并观察整体模型性能。\n\n为了可视化我们的预测，我们将预测值与归一化的测试数据绘制在一起。我们使用 `plot_reg_results()` 函数，该函数也可在\
  \ `lstm_utils.py` 中参考。以下代码片段使用相同的函数生成所需的图表。\n\n![A448827_1_En_11_Fig16_HTML.jpg](img/A448827_1_En_11_Fig16_HTML.jpg)\n\
  \n图 11-16.\n\n使用 LSTM 的预测图，窗口大小为 6，预测长度为 3\n\n```\nIn [8]: plot_reg_results(test_pred_seqs,y_test,prediction_len=PRED_LENGTH)\n\
  ```\n\n在图 11-16 中，灰色线是原始/真实的测试数据（归一化后），黑色线表示以三天为周期的预测/预报值。虚线用于解释预测序列的整体趋势。显而易见，预测结果在一定程度上偏离了实际数据趋势，但它们似乎与实际数据有一些相似之处。\n\
  \n在结束本节之前，有几个重要的点需要牢记。LSTM 是具有存储和使用过去信息能力的强大单元。在我们当前的场景中，我们使用了窗口化方法，并采用了堆叠的 LSTM\
  \ 架构（我们的模型中有两个 LSTM 层）。这也被称为多对一架构，其中使用多个输入值来生成单个输出。这里的另一个重要点是，窗口大小以及网络的其他超参数（如周期数、批次大小、LSTM\
  \ 单元数等）都会对最终结果产生影响（这留作练习供你探索）。因此，在生产环境中部署此类模型之前，我们应该谨慎行事。\n\n序列建模\n\n在上一节中，我们将时间序列建模为一个回归用例。本质上，问题公式虽然利用了过去的窗口进行预测，但并未使用时间步信息。在本节中，我们将通过将其建模为序列，使用\
  \ LSTM 解决相同的股票预测问题。对于本节中的动手示例，你可以参考 jupyter notebook `notebook_stock_prediction_sequence_modeling_lstm.ipynb`\
  \ 以获取必要的代码片段和示例。\n\n循环神经网络天生适合序列建模任务，如机器翻译、语音识别等。RNN 利用记忆（不同于普通的前馈神经网络）来跟踪上下文，并利用它来生成输出。通常，前馈神经网络假设输入是相互独立的。这种独立性在许多场景下可能不成立（例如时间序列数据）。RNN\
  \ 对序列的每个元素应用相同的变换，其结果依赖于先前的值。\n\n对于我们的股票价格时间序列，我们现在希望将其建模为一个序列，其中每个时间步的值是先前值的函数。与类似回归的建模不同，这里我们不将时间序列划分为固定大小的窗口，而是利用\
  \ LSTM 从数据中学习，并确定使用哪些过去的值进行预测。\n\n为此，我们需要对上一案例中处理数据的方式以及构建 RNN 的方式进行一些调整。在上一节中，我们使用了\
  \ (N,W,F) 格式作为输入。在当前设置中，格式保持不变，但有以下变化。\n\n*   N（序列数量）：这将设置为 1，因为我们只处理一只股票的价格信息。\n\
  \n*   W（序列长度）：这将设置为我们拥有的价格信息的总天数。这里我们将整个序列作为一个大序列。\n\n*   F（每个时间戳的特征）：这仍然是 1，因为我们每个时间戳只处理收盘股票价值。\n\
  \n关于输出，在上一节中，我们为每个考虑的窗口/序列生成一个输出。在将数据建模为序列/时间序列时，我们期望输出也是一个序列。因此，输出也是一个遵循与输入张量相同格式的\
  \ 3D 张量。\n\n我们编写了一个小的实用函数 `get_seq_train_test()` 来帮助我们缩放并从时间序列中生成训练和测试数据集。在这种情况下，我们使用\
  \ 70-30 的分割。然后我们使用 `numpy` 将时间序列重塑为 3D 张量。以下代码片段使用 `get_seq_train_test()` 函数来完成此操作。\n\
  \n```\nIn [1]: train,test,scaler = get_seq_train_test(sp_close_series,\n...:   \
  \                                      scaling=True,\n...:                     \
  \                    train_size=TRAIN_PERCENT)\n...:\n...: train = np.reshape(train,(1,train.shape[0],1))\n\
  ...: test = np.reshape(test,(1,test.shape[0],1))\n...:\n...: train_x = train[:,:-1,:]\n\
  ...: train_y = train[:,1:,:]\n...:\n...: test_x = test[:,:-1,:]\n...: test_y = test[:,1:,:]\n\
  ...:\n...: print(\"Data Split Complete\")\n...:\n...: print(\"train_x shape={}\"\
  .format(train_x.shape))\n...: print(\"train_y shape={}\".format(train_y.shape))\n\
  ...: print(\"test_x shape={}\".format(test_x.shape))\n...: print(\"test_y shape={}\"\
  .format(test_y.shape))\nData Split Complete\ntrain_x shape=(1, 1964, 1)\ntrain_y\
  \ shape=(1, 1964, 1)\ntest_x shape=(1, 842, 1)\ntest_y shape=(1, 842, 1)\n```\n\n\
  准备好数据集后，我们现在继续设置 RNN 网络。由于我们计划生成一个序列作为输出，而不是上一案例中的单个输出，我们需要调整我们的网络架构。\n\n这种情况下的要求是对每个时间步应用类似的变换/处理，并且能够为每个输入时间戳获取输出，而不是等待整个序列处理完毕。为了实现这样的场景，`keras`\
  \ 提供了一个名为 `TimeDistributed` 的密集层包装器。这个包装器对每个时间步应用相同的任务，并提供钩子以在每个这样的时间步之后获取输出。我们在\
  \ `Dense` 层上使用 `TimeDistributed` 包装器，以从正在处理的每个时间步获取输出。以下代码片段展示了 `get_seq_model()`\
  \ 函数来生成所需的模型。\n\n```\ndef get_seq_model(hidden_units=4,input_shape=(1,1),verbose=False):\n\
  \n\n\n"
- '# 创建并拟合 LSTM 网络

  model = Sequential()


  '
- '# 输入形状 = 时间步长*特征数

  model.add(LSTM(input_shape=input_shape,

  units = hidden_units,

  return_sequences=True

  ))




  '
- '# TimeDistributedDense 对所有时间步使用相同的处理方式。

  model.add(TimeDistributed(Dense(1)))

  start = time.time()

  model.compile(loss="mse", optimizer="rmsprop")

  if verbose:

  print("> 编译时间 : ", time.time() - start)

  print(model.summary())

  return model

  ```


  该函数返回一个单隐藏层的 RNN 网络，包含四个 `LSTM` 单元和一个 `TimeDistributed Dense` 输出层。我们再次使用均方误差作为损失函数。


  注意


  `TimeDistributed` 是 `keras` 提供的一个强大但棘手的工具。你可以通过 [ `https://github.com/fchollet/keras/issues/1029`
  ](https://github.com/fchollet/keras/issues/1029) 和 [`https://datascience.stackexchange.com/questions/10836/the-difference-between-dense-and-timedistributeddense-of-keras`](https://datascience.stackexchange.com/questions/10836/the-difference-between-dense-and-timedistributeddense-of-keras)
  了解更多信息。


  我们已经对数据集进行了预处理，并将其划分为训练集和测试集，同时使用函数 `get_seq_model()` 创建了一个模型对象。下一步就是使用 `fit()`
  函数来训练模型。在将股票价格信息建模为序列时，我们假设整个时间序列是一个大的序列。因此，在训练模型时，我们将批次大小设置为 1，因为本例中只有一只股票需要训练。以下代码片段获取模型对象，然后使用
  `fit()` 函数对其进行训练。


  ```

  In [2]: # 获取模型

  ...: seq_lstm_model = get_seq_model(input_shape=(train_x.shape[1],1),

  ...:                                 verbose=VERBOSE)

  ...:

  ...: # 训练模型

  ...: seq_lstm_model.fit(train_x, train_y,

  ...:                         epochs=150, batch_size=1,

  ...:                         verbose=2)

  ```


  此代码片段返回一个模型对象及其摘要。我们还可以看到模型在训练数据上训练时，150 个 epoch 中每个 epoch 的输出。


