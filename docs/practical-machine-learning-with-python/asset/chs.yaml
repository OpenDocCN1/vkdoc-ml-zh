  #### 安装库


  我们不会涵盖 Python 的基础知识，因为假设你已经熟悉了基本的 Python 语法。你可以自由查阅任何标准的 Python 编程课程或书籍来学习基础知识。我们将介绍一个非常基础但非常重要的方面：安装额外的库。在
  Python 中，安装额外库的首选方式是使用 `pip` 安装器。使用 `pip` 从 Python 包索引（PyPI）安装包的基本语法如下。


  ```

  pip install required_package

  ```


  如果 `required_package` 存在于 PyPI 中，该命令将安装它。我们也可以使用 PyPI 以外的其他来源来安装包，但通常不需要这样做。Anaconda
  发行版已经附带了大量额外的库，因此我们不太可能需要来自其他来源的额外包。


  另一种安装包的方式（仅限于 Anaconda）是使用 `conda install` 命令。这将从 Anaconda 包渠道安装包，我们通常推荐使用这种方式，尤其是在
  Windows 系统上。


  ### 为什么数据科学选择 Python？


  根据 StackOverflow 2017 年的一项调查（[`https://insights.stackoverflow.com/survey/2017`](https://insights.stackoverflow.com/survey/2017)），Python
  是全球第五大最常用的语言。它是数据科学家使用的三大语言之一，也是 StackOverflow 用户最“想要”的语言之一。事实上，在 KDnuggets 2017
  年最近的一项投票中，根据用户的选择，Python 在分析、数据科学和机器学习领先平台方面获得了最多票数（[`http://www.kdnuggets.com/2017/08/python-overtakes-r-leader-analytics-data-science.html`](http://www.kdnuggets.com/2017/08/python-overtakes-r-leader-analytics-data-science.html)）。Python
  有许多优点，使其成为数据科学实践中的首选语言。我们现在将尝试阐述这些优点，并论证“为什么 Python 是数据科学家的首选语言？”


  #### 强大的包集合


  Python 以其广泛而强大的包集合而闻名。事实上，Python 共享的理念之一是“自带电池”，这意味着 Python 拥有丰富且强大的包集合，可用于各种领域和用例。这一理念也延伸到了数据科学和机器学习所需的包中。像
  `numpy`、`scipy`、`pandas`、`scikit-learn` 等包，是为解决各种现实世界的数据科学问题而量身定制的，并且功能极其强大。这使得
  Python 成为解决数据科学相关问题的首选语言。


  #### 简单快速的原型设计


  在讨论 Python 对数据科学的适用性时，其简洁性是另一个重要方面。Python 语法易于理解且符合习惯，这使得理解现有代码相对简单。这允许开发者轻松修改现有实现并开发自己的实现。这一特性对于开发可能处于实验阶段或尚未被任何外部库支持的新算法尤其有用。基于我们之前讨论的内容，Python
  开发独立于耗时的构建和链接过程。使用 REPL shell、IDE 和笔记本，你可以快速构建并迭代多个研究和开发周期，所有更改都可以随时进行和测试。


  #### 易于协作


  数据科学解决方案很少是单打独斗的工作。在数据科学团队中，通常需要大量协作才能开发出出色的分析解决方案。幸运的是，Python 提供了使多样化团队协作变得极其容易的工具。最受欢迎的功能之一，也是促进这种协作的关键，就是
  Jupyter 笔记本。笔记本是一个新颖的概念，它允许数据科学家在同一个地方共享代码、数据和富有洞察力的结果。这使其成为一种易于重现的研究工具。我们认为这是一个非常重要的特性，并将用一整节来介绍使用笔记本的优势。


  #### 一站式解决方案


  在第一章中，我们探讨了数据科学领域如何与各个领域相互关联。一个典型的项目会有一个迭代的生命周期，涉及数据提取、数据处理、数据分析、特征工程、建模、评估、解决方案开发、部署以及持续更新解决方案。Python
  作为一种多用途编程语言，极其多样化，它允许开发者从一个通用平台处理所有这些不同的操作。使用 Python 库，你可以从多种来源获取数据，对这些数据应用不同的数据整理操作，对处理后的数据应用机器学习算法，并部署开发好的解决方案。这使得
  Python 非常有用，因为不需要接口，也就是说，你不需要将整个流水线的任何部分移植到不同的编程语言。此外，企业级的数据科学项目通常需要与不同的编程语言交互，这也可以通过
  Python 实现。例如，假设某个企业使用自定义的 Java 库进行某种特殊的数据处理，那么你可以使用 Python 的 Jython 实现来使用该 Java
  库，而无需为接口层编写自定义代码。


  #### 庞大且活跃的社区支持


  Python 开发者社区非常活跃且人数众多。这个庞大的社区确保了核心 Python 语言和包保持高效且无错误。开发者可以通过多种平台寻求关于 Python 问题的支持，例如
  Python 邮件列表、Stack Overflow、博客和 Usenet 群组。这种庞大的支持生态系统也是使 Python 成为数据科学首选语言的原因之一。


  ## 介绍 Python 机器学习生态系统


  在本节中，我们将介绍 Python 机器学习生态系统的重要组成部分，并对每个部分进行简要介绍。这些组件是 Python 成为数据科学重要语言的部分原因。本节旨在为你提供一个温和的介绍，并让你熟悉这些核心的数据科学库。深入覆盖所有内容是不切实际的，也超出了当前的范围，因为我们将在后续章节中详细使用它们。拥有一个庞大的
  Python 开发者社区的另一个优势是，只需简单搜索，就能找到关于这些库中每一个的丰富内容。我们涵盖的组件列表绝非详尽无遗，但我们根据它们在整个生态系统中的重要性进行了筛选。




  ### Jupyter Notebooks


  Jupyter notebooks，原名 ipython notebooks，是一种交互式计算环境，可用于开发基于 Python 的数据科学分析，其重点在于可重复研究。这种交互式环境非常适合开发，并使我们能够轻松地在同行之间共享
  notebook 及其代码，让他们可以自行复现我们的研究和分析。这些 Jupyter notebooks 可以包含代码、文本、图像、输出等内容，并且可以按步骤排列，从而完整地逐步展示整个分析过程。这一功能使
  notebook 成为可重复分析和研究的宝贵工具，尤其是在你想与同行分享工作时。在开发分析时，你可以记录你的思考过程，并将结果作为 notebook 的一部分保存下来。这种文档、代码和结果的无缝结合，使得
  Jupyter notebooks 成为每位数据科学家的得力工具。


  我们将使用 Jupyter notebooks，它已随 Anaconda 发行版默认安装。这与 ipython shell 类似，区别在于它可以用于不同的编程后端，而不仅仅是
  Python。但两者的功能相似，而 Jupyter notebooks 还额外具有显示交互式可视化等更多优势。


  #### 安装与执行


  我们不需要为 Jupyter notebooks 进行任何额外安装，因为它已由 Anaconda 发行版安装好了。我们可以通过在命令提示符或终端中执行以下命令来启动
  Jupyter notebook。


  ```

  C:\>jupyter notebook

  ```


  这将在你机器的 `localhost:8888` 地址上启动一个 notebook 服务器。这里需要注意的一个重要点是，你可以通过浏览器访问 notebook，因此你甚至可以在远程服务器上启动它，并使用
  SSH 隧道等技术在本地使用它。当你拥有一个只能远程访问但缺乏图形界面的强大计算资源时，此功能极为有用。Jupyter notebook 允许你在一个可视化的交互式
  shell 中访问这些资源。执行此命令后，你可以在浏览器中导航到地址 `localhost:8888`，找到如图 2-3 所示的登录页面，该页面可用于访问现有
  notebook 或创建新的 notebook。


  ![A448827_1_En_2_Fig3_HTML.jpg](img/A448827_1_En_2_Fig3_HTML.jpg)


  图 2-3.


  Jupyter notebook 登录页面


  在登录页面上，我们可以通过点击右上角的“New”按钮来启动一个新的 notebook。默认情况下，它将使用默认内核（即 Python 3.5 内核），但我们也可以将
  notebook 关联到不同的内核（例如，如果你的系统中安装了 Python 2.7 内核）。一个 notebook 就是一组单元格的集合。notebook 中有三种主要类型的单元格：


  1.  代码单元格：顾名思义，这些单元格可用于编写代码和相关注释。这些单元格的内容会被发送到与 notebook 关联的内核，计算后的输出会作为单元格的输出显示出来。

  2.  Markdown 单元格：Markdown 可用于智能地注释计算过程。这些单元格可以包含简单的文本注释、HTML 标签、图像，甚至 LaTeX 公式。当我们处理新的、非标准的算法，并且想要捕获与算法相关的逐步数学和逻辑时，这些功能将非常有用。

  3.  原始单元格：这是最简单的单元格，它们会按原样显示其中编写的文本。这些单元格可用于添加你不想被 notebook 转换机制转换的文本。


