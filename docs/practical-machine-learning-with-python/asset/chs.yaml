  \ Purchased      int32\nSerial No               int32\nUser ID                 int32\n\
  User Type              object\ndtype: object\n```\n\n列名已清晰列出，并在前面进行了解释。检查数据类型后，我们可以清楚地看到\
  \ `Date` 属性被表示为对象类型。在进行转换和清理之前，让我们进一步深入挖掘并收集更多信息，以理解并制定数据集整理所需任务的策略。以下代码片段有助于获取与包含缺失值的属性/列、行数以及包含缺失值的索引相关的信息。\n\
  \n```\nprint(\"Columns with Missing Values::\",df.columns[df.isnull().any()].tolist())\n\
  print(\"Number of rows with Missing Values::\",len(pd.isnull(df).any(1).nonzero()[0].tolist()))\n\
  print(\"Sample Indices with missing data::\",pd.isnull(df).any(1).nonzero()[0].tolist()[0:5]\
  \ )\n```\n\n使用 `pandas`，下标操作同时适用于行和列（详见第 2 章）。我们使用 `isnull()` 来识别包含缺失值的列。工具函数 `any()`\
  \ 和 `nonzero()` 提供了很好的抽象，用于识别符合某个条件的任何行/列（本例中指向包含缺失值的行/列）。输出如下。\n\n```\nColumns\
  \ with Missing Values:: ['Date', 'Price', 'User Type']\nNumber of rows with Missing\
  \ Values:: 61\nSample Indices with missing data:: [0L, 1L, 6L, 7L, 10L]\n```\n\n\
  让我们也快速进行事实核查，以获取每列非空行的详细信息以及此数据框消耗的内存量。我们还可以获得一些基本的汇总统计信息，如最小值、最大值等；这些信息在后续任务中会很有用。对于第一个任务，我们使用\
  \ `info()` 工具，而汇总统计信息则由 `describe()` 函数提供。以下代码片段实现了这一点。\n\n```\nprint(\"General\
  \ Stats::\")\nprint(df.info())\nprint(\"Summary Stats::\" )\nprint(df.describe())\n\
  ```\n\n以下是使用 `info()` 和 `describe()` 工具生成的输出。它显示 Date 和 Price 都有大约 970 个非空行，而数据集消耗了近\
