  在 CPU 上训练 LSTM 是出了名的慢，正如你所见，我的模型在配备 8 GB 内存的 i5 第三代 Intel CPU 上仅训练五个 epoch 就花费了大约
  3.6 小时。当然，在像 Google Cloud Platform 或 AWS 这样的基于 GPU 的云环境中，训练相同的模型花费了我不到一个小时。因此，我建议你选择基于
  GPU 的深度学习环境，尤其是在处理基于 RNN 或 LSTM 的网络架构时。根据上述输出，我们可以看到，仅用五个 epoch，我们就获得了不错的验证准确率，但训练准确率开始飙升，表明可能发生了一些过拟合。克服这个问题的方法包括添加更多数据或增加丢弃率。不妨试一试，看看是否有效！是时候测试我们的模型了！让我们看看它在预测测试评论情感方面的表现如何，并使用我们之前模型所用的相同模型评估框架（步骤
