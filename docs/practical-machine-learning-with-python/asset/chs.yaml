  \n图 9-19.\n\n每个 epoch 的 DNN 模型性能指标\n\n现在我们有了一个可用的葡萄酒类型分类系统，让我们尝试解释其中一个预测模型。模型解释的关键方面之一是尝试理解数据集中每个特征的重要性。我们将使用我们在前几章中使用的\
  \ `skater` 包来进行模型解释。以下代码有助于可视化我们逻辑回归模型的特征重要性。\n\n![A448827_1_En_9_Fig20_HTML.jpg](img/A448827_1_En_9_Fig20_HTML.jpg)\n\
  \n图 9-20.\n\n从我们的逻辑回归模型获得的特征重要性\n\n```\nIn [16]: from skater.core.explanations import\
  \ Interpretation\n...: from skater.model import InMemoryModel\n...:\n...: wtp_interpreter\
  \ = Interpretation(wtp_test_SX, feature_names=wtp_features.columns)\n...: wtp_im_model\
