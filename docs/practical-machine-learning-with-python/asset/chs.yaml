  本章通过使用公开可用的数据集（如 CIFAR、ImageNet 和 MNIST）进行图像分类任务来讨论卷积神经网络。我们将利用对 CNN 的理解来承担风格迁移的任务，并理解如何使用神经网络来理解高级特征。通过本章，我们将详细讨论以下主题：


  *   卷积神经网络简要概述

  *   从头开始使用 CNN 进行图像分类

  *   迁移学习：使用预训练模型进行图像分类

