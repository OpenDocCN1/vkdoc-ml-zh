  ''`ds`'' 的列中。为了进行预报，prophet 需要一组我们需要预报的日期。为此，它提供了一个简洁的工具，称为 `make_future_dataframe()`，该工具将预报所需的天数作为输入。以下代码片段使用此数据框来预测值。


