  ### 基于决策树的回归


  决策树是一种用于回归和分类问题的监督学习算法。它们简单但功能强大，尤其擅长建模非线性关系。作为一种非参数模型，该算法的目标是学习一个模型，该模型能够基于简单的决策规则（例如，`if-else`
  条件）根据特征预测结果。决策树的可解释性使其更具吸引力，因为我们可以可视化它从数据中推断出的规则。


  我们通过一个例子来解释与决策树相关的概念和术语。假设我们有一个来自不同制造商的汽车模型的假设数据集。假设每个数据点具有诸如 `fuel_capacity, engine_capacity,
  price, year_of_purchase, miles_driven` 和 `mileage` 等特征。给定这些数据，我们需要一个能够根据其他属性预测油耗的模型。


  由于决策树是监督学习算法，我们有一定数量的数据点及其实际的油耗值。决策树从根节点开始，将数据集划分为两个或多个不重叠的子集，每个子集表示为根节点的子节点。它根据特定属性将根节点划分为子集。它会在每个节点继续进行分割，直到到达一个包含目标值的叶节点。关于这一切是如何发生的，可能会有很多问题，我们稍后将逐一解答。为了更好地理解，假设图
  6-14 是从手头数据集中推断出的决策树结构。


  ![A448827_1_En_6_Fig14_HTML.gif](img/A448827_1_En_6_Fig14_HTML.gif)


  图 6-14.


  示例决策树


  图 6-14 中展示的可视化图呈现了一个示例决策树，其叶节点指向目标值。该树首先根据购买年份在根节点处对数据集进行分割，左子节点代表 2010 年之前的购买，右子节点代表
  2010 年之后的购买，其他节点依此类推。当遇到新的/未见过的数据点时，我们只需遍历该树，到达一个决定目标值的叶节点。尽管前面的例子很简单，但它清晰地体现了模型的可解释性以及其学习简单规则的能力。


  #### 节点分裂


  决策树以自顶向下的方式工作，节点分裂是任何决策树算法的一个重要概念。大多数算法采用贪心方法将输入空间划分为子集。


  简单来说，基本过程是尝试使用不同的属性/特征来分割数据点，并针对一个成本函数进行测试。每一步都会选择导致成本最小的分割方式。分类和回归问题使用不同的成本函数集。以下是一些最常见的成本函数：


  *   **均方误差 (MSE)**：主要用于回归树，计算为观测值与预测值之差的平方。

  *   **平均绝对误差**：用于回归树，与 MSE 类似，但我们只使用观测值与预测值之间的差值。

  *   **方差缩减**：最初由 CART 算法引入，它使用方差的标准公式，我们选择导致方差最小的分割方式。

  *   **基尼不纯度/指数**：主要由分类树使用，它衡量的是随机选择一个数据点，在随机标记的情况下被错误标记的概率。

  *   **信息增益**：同样主要用于分类问题，也称为熵。我们根据信息增益的大小来选择分割方式。信息增益越高越好。


  注意


  这些是一些最常用的成本函数。在特定场景下还有更多其他函数被使用。




  #### 停止准则


  如前所述，决策树遵循节点的贪婪递归分裂，但它们如何或何时停止？有许多策略可用于定义停止准则。最常见的是数据点的最小数量。如果进一步分裂会违反此约束，则停止节点分裂。另一个使用的约束是树的深度。


  停止准则与其他参数一起帮助我们实现能够良好泛化的树。一棵非常深或拥有过多非叶节点的树通常会导致过拟合。


  #### 超参数


  超参数是我们为了优化模型在未见数据上的性能而设置的旋钮和控制项。这些超参数不同于参数，参数是学习算法在训练过程中学习到的。超参数帮助我们实现避免过拟合等目标。决策树提供了相当多的超参数供我们使用，其中一些我们在第
  5 章中讨论过。


  最大深度、叶节点的最小样本数、分裂内部节点的最小样本数、最大叶节点数等，都是积极用于提升决策树性能的一些超参数。在接下来的章节中，我们将使用网格搜索（回顾第 5
  章的内容）等技术来为这些超参数确定最优值。


  #### 决策树算法


  决策树已经存在相当长一段时间了。多年来，它们随着基于不同技术的算法改进而不断演变。以下列出了一些最常用的算法：


  *   CART，即分类与回归树

  *   ID3，即迭代二分器 3

  *   C4.5


  现在我们对决策树有了不错的理解，让我们看看能否通过将其用于预测自行车共享需求的回归问题来获得改进。


  #### 训练


  与线性回归的过程类似，我们将使用相同的预处理数据框 `train_df_new`，其中分类变量已转换为独热编码形式，并包含其他数值属性。我们还使用 `scikit-learn`
  中的 `train_test_split()` 工具将数据集再次拆分为 `train` 和 `test`。


  与线性回归相比，决策树的训练过程稍微复杂且有所不同。尽管我们在训练线性回归模型时执行了交叉验证，但我们没有任何需要调整的超参数。对于决策树，我们有很多超参数（其中一些我们甚至在上一节中讨论过）。在深入探讨获取最优超参数的具体细节之前，我们先来看一下
  `sklearn` 的 `tree` 模块中的 `DecisionTreeRegressor`。我们通过实例化一个回归器对象并设置一些超参数来实现，如下所示。


  ```

  In [1]: dtr = DecisionTreeRegressor(max_depth=4,

  ...:                                 min_samples_split=5,

  ...:                                 max_leaf_nodes=10)

  ```


  这段代码片段准备了一个 `DecisionTreeRegressor` 对象，该对象设置为最大深度为 4，最大叶节点数为 10，以及分裂一个节点所需的最小样本数为
  5。虽然可能还有更多参数，但这个示例概述了超参数如何在算法中使用。


  注意


  建议你尝试在训练数据上拟合默认的决策树回归器，并观察其在测试数据集上的性能。


  如前所述，决策树具有可解释性的额外优势。我们可以使用 `Graphviz` 和 `pydot` 库来可视化模型对象，如下面的代码片段所示。


  ```

  In [2]: dot_data = tree.export_graphviz(dtr, out_file=None)

  ...: graph = pydotplus.graph_from_dot_data(dot_data)

  ...: graph.write_pdf("bikeshare.pdf")

  ```


  输出是一个 `pdf` 文件，展示了一个具有上一步中设置的超参数的决策树。下图如图 6-15 所示，显示了根节点在属性 3 上分裂，然后继续直到达到深度 4。也有一些叶节点的深度小于
  4。每个节点都清晰地标出了与其关联的属性。


  ![A448827_1_En_6_Fig15_HTML.jpg](img/A448827_1_En_6_Fig15_HTML.jpg)


  图 6-15.


  在自行车共享数据集上具有定义超参数的决策树


  现在我们开始实际的训练过程。从我们目前的工作流程中应该可以明显看出，我们将使用 k 折交叉验证来训练我们的回归器。由于在决策树的情况下我们还需要担心超参数，我们需要一种方法来微调它们。


  微调超参数的方法有很多种，最常见的是网格搜索和随机搜索，其中网格搜索更受欢迎。顾名思义，随机搜索随机搜索超参数的组合以找到最佳组合，而网格搜索则是一种更系统的方法，在确定最佳组合之前会尝试所有组合。为了让我们的生活更轻松，`sklearn`
  提供了一个工具，可以在使用 `model_selection` 模块中的 `GridSearchCV()` 方法对模型进行交叉验证的同时，对超参数进行网格搜索。


  `GridSearchCV()` 方法将回归器/分类器对象作为输入参数，同时还需要一个超参数字典、所需的交叉验证次数以及其他一些参数。我们使用以下字典来定义我们的超参数网格。


  ```

  In [3]: param_grid = {"criterion": ["mse", "mae"],

  ...:               "min_samples_split": [10, 20, 40],

  ...:               "max_depth": [2, 6, 8],

  ...:               "min_samples_leaf": [20, 40, 100],

  ...:               "max_leaf_nodes": [5, 20, 100, 500, 800],

  ...: }

  ```




  该字典主要提供了我们想要微调的每个超参数的可行值列表。超参数作为键，而值则以这些超参数的可能值列表形式呈现。例如，我们的字典为`max_depth`提供了 2、6
  和 8 层这几个可能值。`GridSearchCV()`函数将依次在这个定义好的可能值列表中搜索，以得出最佳值。以下代码片段准备了一个`GridSearchCV`对象，并将我们的训练数据集拟合到该对象中。


  ```

  In [4]: grid_cv_dtr = GridSearchCV(dtr, param_grid, cv=5)

  ```


  使用 k 折交叉验证进行超参数网格搜索是一个迭代过程，该过程由`GridSearchCV()`函数封装、优化并标准化。由于这一过程，训练需要花费时间，但会生成许多有用的属性用于分析。`best_score_`属性帮助我们获取决策树回归器能达到的最佳交叉验证分数。我们可以使用`best_params_`查看生成最佳分数的模型的超参数。我们还可以使用`cv_results_`属性查看`GridSearchCV()`每次迭代的详细信息。以下代码片段展示了其中一些属性。


  ```

  In [5]: print("R-Squared::{}".format(grid_cv_dtr.best_score_))

  ...: print("Best Hyperparameters::\n{}".format(grid_cv_dtr.best_params_))

  R-Squared::0.85891903233008

  Best Hyperparameters::

  {''min_samples_split'': 10, ''max_depth'': 8, ''max_leaf_nodes'': 500, ''min_samples_leaf'':
  20, ''criterion'': ''mse''}

  ```


  结果相当不错，并且相比我们的线性回归模型有了显著提升。首先，让我们尝试理解该模型拟合在不同设置下的学习/模型拟合结果。为了获取网格搜索过程中准备的不同模型，我们使用`GridSearchCV`对象的`cv_results_`属性。`cv_results_`属性是一个`numpy`数组，我们可以轻松地将其转换为`pandas`数据框。该数据框如图
  6-16 所示。


  ![A448827_1_En_6_Fig16_HTML.jpg](img/A448827_1_En_6_Fig16_HTML.jpg)


  图 6-16.


  展示使用带交叉验证的网格搜索的若干属性进行调优结果的数据框


  理解这一点很重要：带交叉验证的网格搜索旨在优化找到最佳超参数集，以帮助构建一个泛化能力强的决策树回归器。可能存在进一步优化的空间。我们使用`seaborn`来绘制树的深度以及叶节点数量对整体分数的影响。以下代码片段使用了我们之前讨论过的、通过`GridSearchCV`对象的`cv_results_`属性准备的数据框。


  ```

  In [6]: fig,ax = plt.subplots()

  ...: sn.pointplot(data=df[[''mean_test_score'',

  ...:                         ''param_max_leaf_nodes'',

  ...:                         ''param_max_depth'']],

  ...:                 y=''mean_test_score'',x=''param_max_depth'',

  ...:                 hue=''param_max_leaf_nodes'',ax=ax)

  ...: ax.set(title="Affect of Depth and Leaf Nodes on Model Performance")

  ```


  输出显示，当深度从 2 增加到 6 时，分数突然提升，而从 6 增加到 8 时，则是逐渐提升。叶节点数量的影响则相当有趣。100 个叶节点和 800 个叶节点之间的分数差异并不显著。这清楚地表明存在进一步微调的可能性。图
  6-17 展示了这些结果的可视化效果。


  ![A448827_1_En_6_Fig17_HTML.jpg](img/A448827_1_En_6_Fig17_HTML.jpg)


  图 6-17.


  平均测试分数以及树深度和叶节点数量的影响


  如前所述，仍有微调的空间以进一步改善结果。因此，这是一个取决于用例和成本的决策。成本可以体现在工作量、时间以及相应的性能提升上。现在，我们将继续使用`GridSearchCV`对象帮助我们识别出的最佳模型。


  #### 测试


  一旦我们使用优化后的超参数训练好模型，就可以开始常规工作流程，在未见过的数据集上测试性能。我们将采用与准备线性回归测试集时相同的预处理方法（你可以参考线性回归的“测试”部分和/或
  Jupyter notebook `decision_tree_regression.ipynb`）。以下代码片段使用训练阶段获得的最佳估计器来预测测试数据集的输出值。


  ```

  In [7]: y_pred = best_dtr_model.predict(X_test)

  ...: residuals = y_test.flatten() - y_pred

  ```


  最后一步是查看该数据集上的 R 平方分数。一个拟合良好的模型在此数据集上也应具有可比的性能，以下代码片段也证实了这一点。


  ```

  In [1]: print("R-squared::{}".format(r2_score))

  R-squared::0.8722

  ```


  从 R 平方值可以看出，其性能与我们的训练性能相当。我们可以得出结论：与线性回归相比，决策树回归器在预测自行车需求方面表现更好。


  ## 后续步骤


  决策树帮助我们实现了比基于线性回归的模型更好的性能，但仍有改进空间。以下是需要考虑和牢记的几个后续步骤：


  *   **模型微调**：我们通过使用决策树取得了显著改进，但这可以通过分析训练、交叉验证等的结果来进一步优化。可接受的模型性能取决于具体用例，通常在正式确定问题陈述时进行讨论。在我们的案例中，R
  平方值为 0.8 可能非常好，也可能未达到目标，因此需要与所有相关方讨论结果。

  *   **其他模型与集成方法**：如果我们当前的模型未达到性能标准，我们需要评估其他算法，甚至是集成方法。还有许多其他回归模型可供探索。集成方法也非常有用，并且被广泛使用。

  *   **机器学习流水线**：本章分享的工作流程较为详细，以帮助理解和探索概念与技术。一旦预处理和建模步骤的序列稳定下来，就会使用标准化的流水线来维护整个流程的一致性和有效性。建议你进一步探索`sklearn`的`pipeline`模块以获取更多详细信息。




  ## 总结


  本章介绍了来自 UCI 机器学习知识库的共享单车数据集。我们遵循了本书上一节详细讨论过的机器学习工作流程。首先对数据集进行了简要讨论，随后正式定义了问题陈述。一旦我们确立了预测单车需求的任务，下一步就是开始探索性数据分析，以理解并揭示数据中的属性和模式。我们利用
  `pandas`、`numpy` 和 `seaborn/matplotlib` 来操作、转换和可视化手头的数据集。折线图、条形图、箱线图、小提琴图等图表都帮助我们理解了数据集的不同方面。


  随后，我们稍作转向，探索了回归分析。我们讨论了回归分析技术的重要概念、假设和类型。我们还简要涉及了回归问题中通常使用的各种性能/评估标准，例如残差图、正态概率图和决定系数。在更好地理解了数据集和回归本身之后，我们从一个名为线性回归的简单算法开始。它不仅是一个简单的算法，也是回归用例中研究最深入、应用最广泛的算法之一。我们利用
  `sklearn` 的 `linear_model` 来构建和测试针对当前问题的数据集。我们还使用了 `model_selection` 模块来拆分数据集并对模型进行交叉验证。下一步，我们升级到基于决策树的回归模型，以改进线性回归的性能。在将决策树用于数据集建模之前，我们讨论了与其相关的概念和重要方面。线性回归和决策树使用了相同的预处理步骤。最后，我们简要讨论了后续改进和增强的步骤，以此结束本章。本章为后续章节设定了流程和背景，后续章节将在此基础上构建概念和工作流程。


