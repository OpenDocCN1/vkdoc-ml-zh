  这些信息告诉我们，我们有 4898 个白葡萄酒数据点和 1599 个红葡萄酒数据点。合并后的数据集总共包含 6497 个数据点，我们也了解了数值属性和分类属性。让我们快速浏览一下我们的数据集，看看一些样本数据点。\n\
  \n![A448827_1_En_9_Fig1_HTML.jpg](img/A448827_1_En_9_Fig1_HTML.jpg)\n\n图 9-1.\n\n\
  葡萄酒品质数据集的样本数据点\n\n```\nIn [4]: wines.head()\n```\n\n图 9-1 中显示的输出展示了我们葡萄酒品质数据集的样本葡萄酒记录。查看这些值，我们可以了解数值特征和分类特征。现在让我们尝试获取一些关于葡萄酒及其属性的领域知识。领域知识是必不可少的，并且总是被推荐的，特别是当你试图分析和建模来自不同领域的数据时。\n\
  \n葡萄酒是通过葡萄发酵过程制成的酒精饮料，不添加糖、酸、酶、水或其他营养物质。红葡萄酒和白葡萄酒是两种变体。通常，红葡萄酒由深红色和黑色葡萄制成。颜色范围从各种红色、棕色和紫色色调。这是用整颗葡萄（包括果皮）生产的，这增加了红葡萄酒的颜色和风味，使其具有浓郁的风味。白葡萄酒由白葡萄制成，不带果皮或籽。颜色通常是稻草黄色、黄绿色或黄金色。与更浓郁的红葡萄酒相比，大多数白葡萄酒具有清淡和果味的风味。现在让我们深入了解数据集中每个特征的细节。再次感谢\
  \ Karlijn 提供的一些属性描述。我们的数据集总共有 14 个属性，描述如下。\n\n*   `fixed acidity:` 酸是葡萄酒的基本属性之一，对葡萄酒的口感有很大贡献。显著减少酸可能会导致葡萄酒味道平淡。固定酸包括酒石酸、苹果酸、柠檬酸和琥珀酸，这些酸存在于葡萄中（琥珀酸除外）。该变量在数据集中通常以\
  \ ![$$ \\frac{g(tartaricacid)}{d{m}³} $$](img/A448827_1_En_9_Chapter_IEq1.gif) 表示。\n\
  *   `volatile acidity:` 这些酸在完成生产过程之前需要从葡萄酒中蒸馏出来。它主要由乙酸构成，尽管也可能存在其他酸，如乳酸、甲酸和丁酸。过量的挥发酸是不可取的，会导致不愉快的味道。在美国，挥发酸的法律限制是红葡萄酒为\
  \ 1.2 g/L，白葡萄酒为 1.1 g/L。挥发酸在数据集中以 ![$$ \\frac{g(aceticacid)}{d{m}³} $$](img/A448827_1_En_9_Chapter_IEq2.gif)\
  \ 表示。\n*   `citric acid:` 这是赋予葡萄酒新鲜度的固定酸之一。通常，大部分柠檬酸在发酵过程中被消耗，有时会单独添加以赋予葡萄酒更多新鲜度。它在数据集中通常以\
  \ ![$$ \\frac{g}{d{m}³} $$](img/A448827_1_En_9_Chapter_IEq3.gif) 表示。\n*   `residual\
  \ sugar:` 这通常指的是发酵过程停止或被终止后，葡萄中残留的天然糖分。它在数据集中通常以 ![$$ \\frac{g}{d{m}³} $$](img/A448827_1_En_9_Chapter_IEq4.gif)\
  \ 表示。\n*   `chlorides:` 这通常是葡萄酒咸味的主要贡献者。它在数据集中通常以 ![$$ \\frac{g(sodiumchloride)}{d{m}³}\
  \ $$](img/A448827_1_En_9_Chapter_IEq5.gif) 表示。\n*   `free sulfur dioxide:` 这是二氧化硫的一部分，当添加到葡萄酒中时，在剩余部分结合后被认为是游离的。酿酒师总是试图获得最高比例的游离硫来结合。它们也被称为亚硫酸盐，过多是不可取的，会产生刺鼻的气味。该变量在数据集中以\
  \ ![$$ \\frac{mg}{d{m}³} $$](img/A448827_1_En_9_Chapter_IEq6.gif) 表示。\n*   `total\
  \ sulfur dioxide:` 这是结合态和游离态二氧化硫 (SO²) 的总和。这里以 ![$$ \\frac{mg}{d{m}³} $$](img/A448827_1_En_9_Chapter_IEq7.gif)\
  \ 表示。添加它主要是为了杀死有害细菌并保持品质和新鲜度。葡萄酒中的硫含量通常有法律限制，过量甚至会杀死良好的酵母并产生不良气味。\n*   `density:`\
  \ 这可以表示为特定体积葡萄酒的重量与等体积水的重量的比较。它通常用作衡量糖转化为酒精的指标。这里以 ![$$ \\frac{g}{c{m}³} $$](img/A448827_1_En_9_Chapter_IEq8.gif)\
  \ 表示。\n*   `pH:` 也称为氢离子浓度指数，这是一个数值标度，用于指定葡萄酒的酸度或碱度。固定酸对葡萄酒的 pH 值贡献最大。你可能知道，pH 值小于\
  \ 7 的溶液是酸性的，而 pH 值大于 7 的溶液是碱性的。纯水的 pH 值为 7，是中性的。大多数葡萄酒的 pH 值在 2.9 到 3.9 之间，因此是酸性的。\n\
  *   `sulphates:` 这些是含有硫的矿物盐。硫酸盐之于葡萄酒，就像麸质之于食物。它们是世界各地葡萄酒酿造过程中的常规部分，被认为是必不可少的。它们与发酵过程有关，并影响葡萄酒的香气和风味。这里，它们在数据集中以\
  \ ![$$ \\frac{g(potassiumsulphate)}{d{m}³} $$](img/A448827_1_En_9_Chapter_IEq9.gif)\
  \ 表示。\n*   `alcohol:` 葡萄酒是一种酒精饮料。酒精是酵母在发酵过程中转化糖的结果。酒精的百分比因葡萄酒而异。因此，该属性成为该数据集的一部分并不奇怪。它通常以\
  \ % vol 或体积酒精含量 (ABV) 来衡量。\n*   `quality:` 葡萄酒专家将葡萄酒品质评定为 0（非常差）到 10（非常好）。最终的品质分数是至少由同一位葡萄酒专家进行三次评估的中位数。\n\
  *   `wine_type:` 由于我们最初有红葡萄酒和白葡萄酒两个数据集，我们在最终的合并数据集中引入了这个属性，它指示每个数据点的葡萄酒类型。葡萄酒可以是红葡萄酒或白葡萄酒。我们将在本章中构建的预测模型之一将是，我们可以通过查看其他葡萄酒属性来预测葡萄酒的类型。\n\
  *   `quality_label:` 这是从品质属性派生的属性。我们将葡萄酒品质分数分为三个定性类别，即低、中和高。品质分数为 3、4 和 5 的葡萄酒是低品质；分数为\
  \ 6 和 7 的是中等品质；分数为 8 和 9 的是高品质葡萄酒。我们还将在此章中构建另一个模型，根据其他葡萄酒属性来预测这个葡萄酒品质标签。\n\n现在你已经对数据集及其特征有了扎实的了解，让我们分析和可视化各种特征及其相互作用。\n\
  \n描述性统计\n\n我们将首先计算数据集中我们感兴趣的各种特征的一些描述性统计。这涉及计算聚合指标，如均值、中位数、标准差等。如果你还记得，我们的主要目标之一是构建一个能够根据属性正确预测葡萄酒是红葡萄酒还是白葡萄酒的模型。让我们构建一个按葡萄酒类型分隔的各种葡萄酒属性的描述性汇总表。\n\
  \n![A448827_1_En_9_Fig2_HTML.jpg](img/A448827_1_En_9_Fig2_HTML.jpg)\n\n图 9-2.\n\n\
  按葡萄酒类型分隔的葡萄酒属性描述性统计\n\n```\nIn [5]: subset_attributes = ['residual sugar', 'total\
  \ sulfur dioxide', 'sulphates',\n'alcohol', 'volatile acidity', 'quality']\n...:\
  \ rs = round(red_wine[subset_attributes].describe(),2)\n...: ws = round(white_wine[subset_attributes].describe(),2)\n\
  ...: pd.concat([rs, ws], axis=1, keys=['Red Wine Statistics', 'White Wine Statistics'])\n\
  ```\n\n图 9-2 中显示的汇总表向我们展示了各种葡萄酒属性的描述性统计。你注意到任何有趣的特性了吗？首先，白葡萄酒中的平均残留糖分和总二氧化硫含量似乎远高于红葡萄酒。此外，与白葡萄酒相比，红葡萄酒中硫酸盐和挥发酸的平均值似乎更高。尝试包含其他特征，看看是否能找到更有趣的比较！将葡萄酒品质等级视为数据子集，让我们使用以下代码片段构建一些描述性汇总统计。\n\
  \n![A448827_1_En_9_Fig3_HTML.jpg](img/A448827_1_En_9_Fig3_HTML.jpg)\n\n图 9-3.\n\n\
  按葡萄酒品质分隔的葡萄酒属性描述性统计\n\n```\nIn [6]: subset_attributes = ['alcohol', 'volatile acidity',\
  \ 'pH', 'quality']\n...: ls = round(wines[wines['quality_label'] == 'low'][subset_attributes].describe(),2)\n\
  ...: ms = round(wines[wines['quality_label'] == 'medium'][subset_attributes].describe(),2)\n\
  ...: hs = round(wines[wines['quality_label'] == 'high'][subset_attributes].describe(),2)\n\
  ...: pd.concat([ls, ms, hs], axis=1, keys=['Low Quality Wine', 'Medium Quality Wine',\n\
  'High Quality Wine'])\n```\n\n图 9-3 中显示的汇总表向我们展示了按葡萄酒品质评级划分的各种葡萄酒属性的描述性统计。有趣的是，平均酒精含量似乎随着葡萄酒品质评级的提高而增加。我们还看到，不同品质的葡萄酒样品的\
  \ pH 值几乎一致。有没有办法在统计上证明这一点？我们将在下一节中看到。\n\n推断性统计\n\n推断性统计的一般概念是利用数据样本对总体进行推断和提出命题。其思想是使用统计方法和模型从给定的假设中得出统计推断。每个假设包括一个零假设和一个备择假设。根据统计检验结果，如果结果基于预设的显著性水平（例如，如果获得的\
  \ p 值小于 5% 的显著性水平）具有统计显著性，我们拒绝零假设，支持备择假设。否则，如果结果不具有统计显著性，我们得出结论，我们的零假设是正确的。回到上一节的问题，给定基于葡萄酒品质评级的多个数据组或葡萄酒样品子集，有没有办法证明平均酒精含量或\
  \ pH 值在数据组之间存在显著差异？\n\n一个证明或反驳数据子集之间均值差异的极好统计模型是使用单因素方差分析检验。ANOVA 代表“方差分析”，这是一个巧妙的统计模型，可用于分析各组均值或平均值之间统计上显著的差异。这基本上是通过一个统计检验来实现的，该检验帮助我们确定几个组的均值是否相等。通常零假设表示为\n\
  \nH [0] : μ [1] = μ [2] = μ [3] = ... = μ [n]\n\n其中 n 是数据组或子集的数量，它表明基于统计显著性水平，各组的组均值彼此之间没有太大差异。备择假设\
  \ H [A] 告诉我们，至少存在两个组均值在统计上彼此显著不同。通常使用 F 统计量及其相关的 p 值来确定统计显著性。通常，p 值小于 0.05 被认为是统计上显著的结果，此时我们拒绝零假设，支持备择假设。我们建议阅读一本关于推断性统计的标准书籍，以更深入地了解这些概念。\n\
  \n对于我们的场景，根据葡萄酒品质评级从数据中创建了三个数据子集或组。第一个检验中的均值将基于葡萄酒的酒精含量，第二个检验将基于葡萄酒的 pH 值。同时，让我们假设零假设是低、中、高品质葡萄酒的组均值相同，备择假设是至少两个组均值之间存在差异（统计上显著）。以下代码片段帮助我们执行单因素方差分析检验。\n\
  \n```\nIn [7]: from scipy import stats\n...:\n...: F, p = stats.f_oneway(wines[wines['quality_label']\
  \ == 'low']['alcohol'],\n...:                       wines[wines['quality_label']\
  \ == 'medium']['alcohol'],\n...:                       wines[wines['quality_label']\
  \ == 'high']['alcohol'])\n...: print('ANOVA test for mean alcohol levels across\
  \ wine samples with different quality\nratings')\n...: print('F Statistic:', F,\
  \ '\\tp-value:', p)\n...:\n...: F, p = stats.f_oneway(wines[wines['quality_label']\
  \ == 'low']['pH'],\n...:                       wines[wines['quality_label'] == 'medium']['pH'],\n\
  ...:                       wines[wines['quality_label'] == 'high']['pH'])\n...:\
  \ print('\\nANOVA test for mean pH levels across wine samples with different quality\n\
  ratings')\n...: print('F Statistic:', F, '\\tp-value:', p)\nANOVA test for mean\
  \ alcohol levels across wine samples with different quality ratings\nF Statistic:\
  \ 673.074534723      p-value: 2.27153374506e-266\nANOVA test for mean pH levels\
  \ across wine samples with different quality ratings\nF Statistic: 1.23638608035\
  \      p-value: 0.290500277977\n```\n\n从前面的结果中，我们可以清楚地看到，在第一个检验中，p 值远小于 0.05，而在第二个检验中，p\
  \ 值大于 0.05。这告诉我们，在三个组中，至少有两个组的酒精含量均值存在统计上显著的差异（拒绝零假设，支持备择假设）。然而，对于 pH 值均值，我们不拒绝零假设，因此我们得出结论，三个组的\
  \ pH 值均值在统计上没有显著差异。我们甚至可以使用以下代码片段可视化这两个特征并观察均值。\n\n![A448827_1_En_9_Fig4_HTML.jpg](img/A448827_1_En_9_Fig4_HTML.jpg)\n\
  \n图 9-4.\n\n基于品质评级可视化葡萄酒酒精含量和 pH 值分布\n\n```\nf, (ax1, ax2) = plt.subplots(1, 2,\
  \ figsize=(10, 4))\nf.suptitle('Wine Quality - Alcohol Content/pH', fontsize=14)\n\
  f.subplots_adjust(top=0.85, wspace=0.3)\nsns.boxplot(x=\"quality_label\", y=\"alcohol\"\
  ,\ndata=wines, ax=ax1)\nax1.set_xlabel(\"Wine Quality Class\",size = 12,alpha=0.8)\n\
  ax1.set_ylabel(\"Wine Alcohol %\",size = 12,alpha=0.8)\nsns.boxplot(x=\"quality_label\"\
  , y=\"pH\", data=wines, ax=ax2)\nax2.set_xlabel(\"Wine Quality Class\",size = 12,alpha=0.8)\n\
  ax2.set_ylabel(\"Wine pH\",size = 12,alpha=0.8)\n```\n\n图 9-4 中显示的箱线图向我们展示了基于葡萄酒品质的葡萄酒酒精含量分布与\
  \ pH 值分布的显著差异，pH 值看起来在 3.1 - 3.3 之间，事实上，如果你查看三个组的 pH 值均值和单位数，三个组大约都是 3.2，而酒精百分比则差异显著。你能从这些数据中找到其他更有趣的模式和假设吗？试试看！\n\
  \n单变量分析\n\n这也许是探索性数据分析中最简单但也是核心的基础步骤之一。单变量分析涉及分析数据，使得在分析的任何时刻，我们只处理一个变量或特征。不分析多个变量之间的关系或相关性。轻松可视化数据中所有变量的最简单方法是构建一些直方图。以下代码片段有助于可视化所有特征的数据值分布。虽然直方图在许多情况下可能不是合适的可视化方法，但对于数值数据来说，它是一个很好的起点。\n\
  \n![A448827_1_En_9_Fig5_HTML.jpg](img/A448827_1_En_9_Fig5_HTML.jpg)\n\n图 9-5.\n\n\
  描绘葡萄酒品质数据集特征分布的单变量图\n\n```\nred_wine.hist(bins=15, color='red', edgecolor='black',\
  \ linewidth=1.0,\nxlabelsize=8, ylabelsize=8, grid=False)\nplt.tight_layout(rect=(0,\
  \ 0, 1.2, 1.2))\nrt = plt.suptitle('Red Wine Univariate Plots', x=0.65, y=1.25,\
  \ fontsize=14)\nwhite_wine.hist(bins=15, color='white', edgecolor='black', linewidth=1.0,\n\
  xlabelsize=8, ylabelsize=8, grid=False)\nplt.tight_layout(rect=(0, 0, 1.2, 1.2))\n\
  wt = plt.suptitle('White Wine Univariate Plots', x=0.65, y=1.25, fontsize=14)\n\
  ```\n\n像 `matplotlib` 和 `pandas` 这样的包的力量使你能够像图 9-5 中所示，用最少的代码轻松绘制变量分布。你注意到两种葡萄酒类型之间有什么有趣的模式吗？让我们以名为\
  \ `residual sugar` 的特征为例，绘制红葡萄酒和白葡萄酒样品数据的分布。\n\n![A448827_1_En_9_Fig6_HTML.jpg](img/A448827_1_En_9_Fig6_HTML.jpg)\n\
  \n图 9-6.\n\n红葡萄酒和白葡萄酒样品的残留糖分分布\n\n```\nfig = plt.figure(figsize = (10,4))\ntitle\
  \ = fig.suptitle(\"Residual Sugar Content in Wine\", fontsize=14)\nfig.subplots_adjust(top=0.85,\
  \ wspace=0.3)\nax1 = fig.add_subplot(1,2, 1)\nax1.set_title(\"Red Wine\")\nax1.set_xlabel(\"\
  Residual Sugar\")\nax1.set_ylabel(\"Frequency\")\nax1.set_ylim([0, 2500])\nax1.text(8,\
  \ 1000, r'$\\mu$='+str(round(red_wine['residual sugar'].mean(),2)),\nfontsize=12)\n\
  r_freq, r_bins, r_patches = ax1.hist(red_wine['residual sugar'], color='red', bins=15,\n\
  edgecolor='black', linewidth=1)\nax2 = fig.add_subplot(1,2, 2)\nax2.set_title(\"\
  White Wine\")\nax2.set_xlabel(\"Residual Sugar\")\nax2.set_ylabel(\"Frequency\"\
  )\nax2.set_ylim([0, 2500])\nax2.text(30, 1000, r'$\\mu$='+str(round(white_wine['residual\
  \ sugar'].mean(),2)),\nfontsize=12)\nw_freq, w_bins, w_patches = ax2.hist(white_wine['residual\
  \ sugar'], color='white', bins=15,\nedgecolor='black', linewidth=1)\n```\n\n我们可以很容易地从图\
  \ 9-6 的可视化中注意到，白葡萄酒样品中的 `residual sugar` 含量似乎比红葡萄酒样品更多。你可以重用前面代码片段中的绘图模板并可视化更多特征。一些图如下所示（详细代码在\
  \ jupyter 笔记本中）。\n\n![A448827_1_En_9_Fig7_HTML.jpg](img/A448827_1_En_9_Fig7_HTML.jpg)\n\
  \n图 9-7.\n\n红葡萄酒和白葡萄酒样品的硫酸盐含量和酒精含量分布\n\n图 9-7 中显示的图向我们展示了，与白葡萄酒样品相比，红葡萄酒样品中的 `sulphate`\
  \ `content` 略高，而两种类型的平均酒精含量几乎相似。当然，在所有情况下，白葡萄酒的频率计数都更高，因为与红葡萄酒相比，我们有更多的白葡萄酒样品记录。接下来，我们绘制\
  \ `quality` 和 `quality_label` 分类特征的分布，以了解类别分布，我们稍后将预测这些类别。\n\n![A448827_1_En_9_Fig8_HTML.jpg](img/A448827_1_En_9_Fig8_HTML.jpg)\n\
