  RNN 摘要


  图 11-17 显示了 RNN 试图学习的总参数，总共 101 个。我们强烈建议您探索上一节中准备的模型摘要，结果应该会让大多数人感到惊讶（提示：这个模型需要学习的参数非常少！）。这个摘要还指向一个重要事实，即第一个
  LSTM 层的形状。这清楚地表明，模型期望输入在训练和预测时都符合此形状（训练数据集的形状）。


  由于我们的测试数据集较小 `(shape: (1,842,1)`)，我们需要某种方法来匹配所需的形状。在使用 RNN 对序列进行建模时，填充序列以匹配给定形状是一种常见做法。通常，在需要训练多个序列的情况下（例如，文本生成），会使用最长序列的大小，并对较短的序列进行填充以匹配它。我们这样做仅仅是为了编程上的原因，否则会丢弃填充的值（有关更多信息，请参阅
  `keras` 的 masking 功能）。填充工具来自 `keras.preprocessing.sequence` 模块。以下代码片段在实际数据之后用 0
  填充测试数据集（您可以选择前填充或后填充），然后使用填充后的序列进行预测/预报。我们还计算并打印了预报的 RMSE 分数。


  ```

  In [3]: # 填充输入序列

  ...: testPredict = pad_sequences(test_x,

  ...:                                 maxlen=train_x.shape[1],

  ...:                                 padding=''post'',

  ...:                                 dtype=''float64'')

  ...:

  ...: # 预测值

  ...: testPredict = seq_lstm_model.predict(testPredict)

  ...:

  ...: # 评估性能

  ...: testScore = math.sqrt(mean_squared_error(test_y[0],

  ...:                         testPredict[0][:test_x.shape[1]]))

  ...: print(''测试分数: %.2f RMSE'' % (testScore))

  测试分数: 0.07 RMSE

  ```


