  `keras` 的 `fit(...)` 函数进行训练过程，并且有一些参数您应该了解。`epoch` 参数表示所有训练示例通过网络进行一次完整的前向和后向传播。`batch_size`
  参数表示在训练模型和更新梯度时，一次通过 DNN 模型传播以进行一个后向和前向传播的总样本数。因此，如果您有 1,000 个观测值，并且您的批次大小为 100，则每个
  epoch 将包含 10 次迭代，其中每次将 100 个观测值通过网络，并更新隐藏层单元上的权重。我们还指定了 `validation_split` 为 `0.1`，以提取
  `10%` 的训练数据并将其用作验证数据集，以评估每个 epoch 的性能。`shuffle` 参数有助于在训练模型时打乱每个 epoch 中的样本。


