  使用监督学习进行情感分类


  构建模型以理解文本内容并预测基于文本评论的情感，另一种方法是使用监督机器学习。更具体地说，我们将使用分类模型来解决这个问题。我们已经在第 1 章的“监督学习”部分介绍了与监督学习和分类相关的概念。关于构建和评估分类模型的详细信息，如果需要，您可以前往第
  5 章复习。我们将在后续章节中构建一个自动化的情感文本分类系统。实现这一目标的主要步骤如下所述。


  1.  准备训练和测试数据集（可选地，一个验证数据集）

  2.  预处理和标准化文本文档

  3.  特征工程

  4.  模型训练

  5.  模型预测与评估


  这些是构建我们系统的主要步骤。可选地，最后一步是将模型部署到您的服务器或云端。图 7-4 展示了使用监督学习（分类）模型构建标准文本分类系统的详细工作流程。


