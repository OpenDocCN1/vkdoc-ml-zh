  \n让我们看一些类似于我们在第 7 章中所做的模型预测解释，当时我们分析了电影评论情感。为此，我们将利用 `skater` 并查看模型预测。我们将尝试解释为什么模型预测了一个类别标签，以及哪些特征在其决策中具有影响力。首先，我们使用以下代码片段构建一个\
  \ `LimeTabularExplainer` 对象，这将有助于我们解释和说明预测。\n\n```\nfrom skater.core.local_interpretation.lime.lime_tabular\
  \ import LimeTabularExplainer\nexp = LimeTabularExplainer(wqp_train_SX, feature_names=wqp_feature_names,\n\
