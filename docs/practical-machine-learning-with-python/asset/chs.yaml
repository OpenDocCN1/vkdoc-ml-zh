  这里我们在两个数据框中都有一个公共列 `iso3`，`merge` 函数能够自动识别它。如果缺少这样的公共列名，我们可以通过使用 `merge` 函数的 `on`
  参数来指定要用于拼接的列名。`merge` 函数提供了一组丰富的参数，可以根据需要改变其行为。我们将留给你通过尝试一些示例来进一步探索 `merge` 函数。


  ### Scikit-learn


  `Scikit-learn` 是 Python 数据科学和机器学习中最重要的、不可或缺的 Python 框架之一。它实现了广泛的机器学习算法，涵盖了机器学习的主要领域，如分类、聚类、回归等。所有主流的机器学习算法，如支持向量机、逻辑回归、随机森林、K
  均值聚类、层次聚类等等，都在这个库中得到了高效的实现。可以说，这个库构成了应用和实践机器学习的基础。除此之外，其易于使用的 API 和代码设计模式也已被其他框架广泛采用！


  `scikit-learn` 项目由 David Cournapeau 作为谷歌编程之夏项目发起。该库的第一个公开版本发布于 2010 年底。它是目前最活跃的
  Python 项目之一，并且仍在积极开发中，不断添加新功能和增强现有功能。`Scikit-learn` 主要用 Python 编写，但为了提供更好的性能，部分核心代码是用
  Cython 编写的。它还使用了针对流行学习算法实现的封装，例如逻辑回归（使用 `LIBLINEAR`）和支持向量机（使用 `LIBSVM`）。


  在我们对 `scikit-learn` 的介绍中，我们将首先了解该库的基本设计原则，然后在此基础上构建对该包的理论知识。我们将在示例数据上实现一些算法，让你熟悉基本语法。我们将在后续章节中广泛使用
  `scikit-learn`，因此这里的目的是让你了解该库的结构及其核心组件。


  #### 核心 API


  `Scikit-learn` 是一个不断发展的活跃项目，其 GitHub 仓库的统计数据可以证明这一点。该框架建立在相当小而简单的核心 API 思想和设计模式之上。在本节中，我们将简要介绍
  `scikit-learn` 核心操作所基于的核心 API。




  *   **数据集表示**：大多数机器学习任务的数据表示方式彼此非常相似。我们通常会有一组数据点，这些数据点由数据点向量的堆叠来表示。基本上，考虑一个数据集，数据集中的每一行代表一个特定数据点观测值的向量。一个数据点向量包含多个自变量（或特征）以及一个或多个因变量（响应变量）。例如，如果我们有一个线性回归问题，可以表示为
  [(X [1] , X [2] , X [3] , X [4] , …, X [n] ), (Y)]，其中自变量（特征）由 X 表示，因变量（响应变量）由 Y
  表示。其思想是通过在特征上拟合模型来预测 Y。这种数据表示类似于一个矩阵（考虑多个数据点向量），一种自然的描述方式是使用 `numpy` 数组。这种数据表示方式既简单又强大，因为我们可以访问
  `numpy` 数组强大的功能和高效的向量化操作。事实上，`scikit-learn` 的最新更新甚至可以直接接受 `pandas` 数据框作为输入，而无需你显式地将它们转换为特征数组！

  *   **估计器**：估计器接口是 `scikit-learn` 库最重要的组件之一。该包中的所有机器学习算法都实现了估计器接口。学习过程分两步进行。第一步是初始化估计器对象；这包括为算法选择合适的类对象，并为其提供参数或超参数。第二步是对提供的数据（特征集和响应变量）应用
  `fit` 函数。`fit` 函数将学习机器学习算法的输出参数，并将它们作为对象的公共属性暴露出来，以便于检查最终模型。提供给 `fit` 函数的数据通常以输入-输出矩阵对的形式提供。除了机器学习算法之外，一些数据转换机制也使用估计器
  API 实现（例如，特征缩放、PCA 等）。这允许进行简单的数据转换，并提供一种以一致方式暴露转换机制的简单方法。

  *   **预测器**：预测器接口的实现是为了使用已学习的估计器对未知数据进行预测、预报等。例如，在监督学习问题中，预测器接口将为提供给它的未知测试数组提供预测的类别。预测器接口还支持为其输出的结果提供量化值。预测器实现的一个要求是提供一个评分函数；该函数将为其提供的测试输入返回一个标量值，该值将量化所用模型的有效性。这些值将来将用于调整我们的机器学习模型。

  *   **转换器**：在学习模型之前对输入数据进行转换是机器学习中非常常见的任务。一些数据转换很简单，例如用常量替换一些缺失数据、进行对数变换，而一些数据转换则类似于学习算法本身（例如，PCA）。为了简化此类转换任务，一些估计器对象会实现转换器接口。该接口允许我们对输入数据执行非平凡的转换，并将输出提供给我们的实际学习算法。由于转换器对象会保留用于转换的估计器，因此使用
  `transform` 函数将相同的转换应用于未知测试数据变得非常容易。


  #### 高级 API


  在前面的部分中，我们了解了 `scikit-learn` 包的一些最基本的原则。在本节中，我们将简要介绍构建在这些基础之上的高级结构。这些高级 API 集通常可以帮助数据科学家使用简单且流线型的语法来表达一组复杂的核心操作。


  *   **元估计器**：元估计器接口（使用多类接口实现）是一个估计器集合，可以通过累积简单的二元分类器来组合而成。它允许我们扩展二元分类器以实现多类、多标签、多回归以及多类-多标签分类。这个接口很重要，因为这些场景在现代机器学习中很常见，而开箱即用地实现此功能的能力减少了数据科学家的编程需求。我们还应该记住，`scikit-learn`
  库中的大多数二元估计器都内置了多类功能，除非我们需要自定义行为，否则我们不会使用元估计器。

  *   **流水线和特征联合**：机器学习的步骤大多是顺序进行的。我们将读取数据，应用一些简单或复杂的转换，拟合一个合适的模型，并使用该模型对未见过的数据进行预测。机器学习过程的另一个特点是，由于其迭代性质，这些步骤会多次迭代，以得出最佳模型，然后部署该模型。将这些操作链接在一起并作为一个整体单元重复执行，而不是零散地应用操作，是非常方便的。这个概念也称为机器学习流水线。`Scikit-learn`
  提供了一个 Pipeline API 来实现类似的目的。来自 `pipeline` 模块的 `Pipeline()` 对象可以将多个估计器（转换、建模等）链接在一起，并且生成的对象本身可以作为一个估计器使用。除了按顺序应用这些估计器的流水线
  API 之外，我们还可以使用 `FeatureUnion` API，它将并行执行一组指定的操作，并显示所有并行操作的输出。流水线的使用是一个相当高级的话题，当我们后续章节中看到具体示例时，它会变得更加清晰。

  *   **模型调优与选择**：每个学习算法都有一组与之相关的参数或超参数。机器学习的迭代过程旨在找到能为我们提供性能最佳模型的最佳参数集。例如，调整随机森林算法的各种超参数，以找到能提供最佳预测精度（或任何其他性能指标）的参数集。这个过程有时涉及遍历参数空间，搜索最佳参数集。请注意，即使我们在这里提到了“参数”这个术语，我们通常指的是模型的超参数。`Scikit-learn`
  提供了有用的 API，帮助我们轻松地导航这个参数空间，以找到最佳可能的参数组合。我们可以使用两个元估计器——`GridSearchCV` 和 `RandomizedSearchCV`——来促进最佳参数的搜索。顾名思义，`GridSearchCV`
  涉及提供一个可能的参数网格，并尝试它们之间的每种可能组合，以得出最佳组合。一种优化的方法通常是随机搜索可能的参数集；这种方法由 `RandomizedSearchCV`
  API 提供。它对参数进行采样，避免了在参数数量较多时可能导致的组合爆炸。除了参数搜索之外，这些模型选择方法还允许我们使用不同的交叉验证方案和评分函数来衡量性能。




  #### Scikit-learn 示例：回归模型


  在第一章中，我们讨论了一个涉及分类任务的示例。在本节中，我们将解决另一个有趣的机器学习问题：回归问题。请记住，这里的重点是向您介绍使用一些 `scikit-learn`
  库 API 所涉及的基本步骤。我们不会试图过度设计我们的解决方案来获得最佳模型。后续章节将使用真实数据集来关注这些方面。


  对于我们的回归示例，我们将使用 `scikit-learn` 库自带的其中一个数据集，即 `diabetes` 数据集。


  ##### 数据集


  `diabetes` 数据集是 `scikit-learn` 库自带的其中一个数据集。这个小型数据集允许库的新用户通过一个众所周知的数据集来学习和试验各种机器学习概念。它包含了
  442 名糖尿病患者的 10 个基线变量（年龄、性别、身体质量指数、平均血压）以及六项血清测量的观察数据。该库附带的数据集已经过标准化（缩放），即它们具有零均值和单位
  L2 范数。响应变量（或目标变量）是基线一年后疾病进展的定量测量。该数据集可用于回答两个问题：


  *   对未来患者的疾病进展基线预测是什么？

  *   哪些自变量（特征）是预测疾病进展的重要因素？


