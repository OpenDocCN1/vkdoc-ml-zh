  \n总结\n\n在本章中，我们了解了一些简单但高价值的案例研究。本章的核心是认识到，任何基于分析或机器学习的解决方案，其最重要的部分在于它能为组织带来的价值。作为一名分析或数据科学专业人士，我们必须始终努力平衡工作的价值方面与技术复杂性。我们学习了一些重要的方法，这些方法有潜力直接为组织和零售机构创造收入。我们探讨了与客户细分相关的概念及其影响，并探索了一种使用无监督学习来发现客户细分并查看有趣模式和行为的新颖方法。交叉销售向我们介绍了模式挖掘和基于规则的框架（如关联规则挖掘）以及市场购物篮分析等原理的世界。我们利用了一个与我们之前使用的框架完全不同的框架，并理解了数据解析和预处理在常规建模和分析之外的价值。在本书的后续章节中，我们将增加案例研究的技术复杂性，但我们恳请您始终关注定义这些解决方案的价值和影响。敬请期待！\n\
  \n9. 分析葡萄酒类型与品质\n\n在上一章中，我们研究了利用无监督机器学习技术（如聚类和规则挖掘框架）的具体案例研究。在本章中，我们将重点介绍一些与监督机器学习算法和预测分析相关的案例研究。我们在第\
  \ 7 章中研究了基于分类的问题，在那里我们基于文本评论构建了情感分类器来预测电影评论的情感。在本章中，我们要解决的问题是使用物理化学属性来分析、建模和预测葡萄酒的类型和品质。葡萄酒是一种口感宜人的酒精饮料，受到全球数百万人的喜爱。事实上，我们很多人都喜欢用一杯葡萄酒来庆祝成就，甚至在艰难的一天结束时放松一下！弗朗西斯·培根的以下名言应该能激起你对葡萄酒及其重要性的兴趣。\n\
  \n“陈年之佳，见于四物：老木可燃，老酒可饮，老友可信，老书可读。”\n\n——弗朗西斯·培根\n\n无论你是否喜欢和饮用葡萄酒，分析葡萄酒的物理化学属性并理解它们与葡萄酒品质和类型之间的关系及重要性，都将是很有趣的。由于我们将尝试预测葡萄酒的类型和品质，这里涉及的监督机器学习任务是分类。在本章中，我们将研究分析和可视化葡萄酒数据属性和特征的各种方法。我们专注于单变量以及多变量分析。为了预测葡萄酒的类型和品质，我们将基于最先进的监督机器学习技术构建分类器，包括逻辑回归、深度神经网络、决策树以及集成模型（如随机森林和梯度提升）等。特别强调分析、可视化和建模数据，以便你将来可以在自己基于分类的实际问题中模仿类似的原理。我们要感谢加州大学欧文分校机器学习库提供的数据集。同时，特别感谢\
  \ DataCamp 和著名数据科学记者 Karlijn Willems，她在分析葡萄酒品质数据集方面做了出色的工作，并在 [`https://www.datacamp.com/community/tutorials/deep-learning-python`](https://www.datacamp.com/community/tutorials/deep-learning-python)\
  \ 上撰写了一篇关于其发现的文章，你可以查看以获取更多详细信息。我们从这篇文章中借鉴了一些分析和解释作为本章的灵感，Karlijn 也非常乐于与我们分享这些内容。\n\
  \n问题陈述\n\n“给定一个数据集，或者在本例中是两个处理葡萄酒物理化学属性的数据集，你能猜出葡萄酒的类型和品质吗？”这是本章的主要目标。当然，这并不意味着全部重点只在于利用机器学习构建预测模型。我们将基于标准的机器学习和数据挖掘工作流模型（如\
  \ CRISP-DM 模型）来处理、分析、可视化和建模我们的数据集。\n\n本章使用的数据集可在非常流行的 UCI 机器学习库中找到，名称为葡萄酒品质数据集。你可以在\
  \ [`https://archive.ics.uci.edu/ml/datasets/wine+quality`](https://archive.ics.uci.edu/ml/datasets/wine+quality)\
  \ 访问更多详细信息，该网站提供了原始数据集以及数据集中各种特征的详细信息。有两个数据集，一个用于红葡萄酒，另一个用于白葡萄酒。更具体地说，这些葡萄酒数据集与来自葡萄牙北部的红葡萄酒和白葡萄酒\
  \ vinho verde 样品有关。同一网页中的另一个文件讨论了数据集的详细信息，包括属性信息。数据集的功劳归于 P. Cortez、A. Cerdeira、F.\
  \ Almeida、T. Matos 和 J. Reis，你可以在他们发表于《决策支持系统》（Elsevier, 47(4): 547-553, 2009）的论文“通过数据挖掘物理化学属性来建模葡萄酒偏好”中获取更多详细信息。\n\
  \n总结我们的主要目标，我们将尝试通过利用机器学习和数据分析来解决以下主要问题。\n\n*   预测每个葡萄酒样品是红葡萄酒还是白葡萄酒。\n*   预测每个葡萄酒样品的品质，可以是低、中或高。\n\
  \n在继续访问和分析数据之前，让我们先设置必要的依赖项！\n\n设置依赖项\n\n我们将使用几个特定于机器学习和深度学习的 Python 库和框架。就像我们之前的章节一样，你需要确保已安装\
  \ `pandas`、`numpy`、`scipy` 和 `scikit-learn`，它们将用于数据处理和机器学习。我们还将广泛使用 `matplotlib`\
  \ 和 `seaborn` 进行探索性数据分析和可视化。本章使用的深度学习框架包括带有 `tensorflow` 后端的 `keras`，但如果你愿意，也可以使用\
  \ `theano` 作为后端。我们还使用 `xgboost` 库进行梯度提升集成模型。与监督模型拟合、预测和评估相关的实用程序位于 `model_evaluation_utils.py`\
