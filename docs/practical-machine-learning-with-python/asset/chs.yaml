  真实世界案例研究


  '
- '# 6. 分析共享单车趋势


  “只工作不玩耍”是一句众所周知的谚语，我们当然不想变得枯燥乏味。到目前为止，我们已经涵盖了解决数据科学问题所需的理论概念、框架、工作流程和工具。以用例驱动为主题的内容从本章开始。在本书的这一部分，我们将通过真实案例研究涵盖广泛的机器学习/数据科学概念。通过本章及后续章节，我们将讨论并应用迄今为止学到的概念来解决一些激动人心的真实世界问题。


  本章讨论基于回归的模型来分析数据和预测结果。具体来说，我们将利用来自 UCI 机器学习库的 Capital Bike Sharing 数据集来理解用于预测自行车使用需求的回归模型。通过本章，我们将涵盖以下主题：


  *   **共享单车数据集**：了解 UCI 机器学习库中可用的数据集

  *   **问题陈述**：正式定义要解决的问题

  *   **探索性数据分析**：探索和理解手头的数据集

  *   **回归分析**：理解回归建模概念并将其应用于解决问题


  ## 共享单车数据集


  最初几章介绍的 CRISP-DM 模型讨论了与数据科学问题/项目相关的典型工作流程。工作流程图将数据置于中心位置是有原因的。在我们开始使用不同技术来理解和处理数据之前，让我们先了解其来源。


  共享单车数据集可从 UCI 机器学习库获得。它是世界上最大、可能也是历史最悠久的在线数据集存储库之一，被用于世界各地的各类研究。我们将要使用的数据集是该网站上数百个可用数据集中的一个。


  该数据集由葡萄牙波尔图大学于 2013 年捐赠。更多信息请访问[`https://archive.ics.uci.edu/ml/datasets/Bike+Sharing+Dataset`](https://archive.ics.uci.edu/ml/datasets/Bike+Sharing+Dataset)。


  注意


  我们鼓励您查看 UCI 机器学习库，特别是共享单车数据集页面。我们感谢 Fanaee 等人的工作以及通过 UCI 机器学习库分享该数据集。


  Fanaee-T, Hadi, 和 Gama, Joao, Event labeling combining ensemble detectors and background
  knowledge, Progress in Artificial Intelligence (2013): pp. 1-15, Springer Berlin
  Heidelberg.


  ## 问题陈述


  随着环境问题和健康成为热门话题，近年来，使用自行车作为一种交通方式已获得关注。为了鼓励自行车使用，世界各地的城市已成功推出了共享单车计划。根据此类计划，骑行者可以使用遍布城市的自动/手动租赁点租用自行车，租期固定。在大多数情况下，骑行者可以从一个地点取车，并将其归还到任何其他指定地点。


  世界各地的共享单车平台是各种数据的集散地，包括出行时间、起止地点、骑行者人口统计数据等。这些数据连同天气、交通、地形等其他信息来源，使其成为不同研究领域有吸引力的命题。


  Capital Bike Sharing 数据集包含与华盛顿特区正在进行的此类共享单车计划相关的信息。给定这个增强型（共享单车详情及天气信息）数据集，我们能否预测该计划的自行车租赁需求？


  ## 探索性数据分析


  现在我们已经了解了业务案例的概况和正式的问题陈述，下一步就是探索和理解数据。这也被称为探索性数据分析（EDA）步骤。在本节中，我们将把数据加载到分析环境中并探索其属性。值得再次强调的是，EDA
  是整个工作流程中最重要的阶段之一，它不仅有助于理解数据集，还能呈现某些对后续步骤有用的细节。


  注意


  共享单车数据集包含日级别和小时级别的数据。我们将只关注`hour.csv`中可用的小时级别数据。




  ### 预处理


  EDA 过程首先将数据加载到环境中，快速查看数据以及记录数量和属性数量。我们将大量使用 `pandas` 和 `numpy` 来执行数据操作和相关任务。为了可视化，我们将尽可能使用
  `matplotlib` 和 `seaborn` 以及 `pandas` 的可视化功能。


  我们首先加载 `hour.csv` 并检查加载的数据框的形状。以下代码片段实现了这一点。


  ```

  In [2]: hour_df = pd.read_csv(''hour.csv'')

  ...: print("Shape of dataset::{}".format(hour_df.shape))

