  前言


  摩尔定律带来的可负担计算能力的普及，推动了机器学习解决方案的快速发展，并促进了其在各行各业中的采用。通过系统性、易于应用的机器学习解决方案栈，从观测（训练）数据中学习现实世界过程背后的复杂模型，这种能力对企业挖掘有意义的商业价值具有巨大吸引力。机器学习的魅力和机遇催生了大量资源——书籍、教程、在线培训以及面向开发者、分析师、工程师和科学家的课程，供他们学习算法并实现平台和方法论。对于初学者来说，面对如此丰富的材料感到不知所措并不罕见。此外，如果不遵循结构化的工作流程，机器学习解决方案可能无法产生一致且相关的结果。


  构建稳健的机器学习应用并获得一致、可操作结果的关键要求，包括投入大量时间和精力来理解项目的目标和核心价值，建立可靠的数据管道，分析和可视化数据，以及进行特征工程、特征选择和建模。这些项目的迭代性质涉及多个“选择
  → 应用 → 验证 → 调优”循环，然后才能得出合适的基于机器学习的模型。最后也是重要的一步，是将解决方案（机器学习模型）集成到现有（或新的）组织系统或业务流程中，以维持可操作且相关的结果。因此，构建稳健机器学习解决方案所需要素的广泛要求，需要一个不仅适合机器学习交互式建模，而且在数据摄取、处理、可视化、系统集成以及运行时部署和维护的强生态系统支持方面表现出色的开发平台。Python
  是一种极佳的语言选择，因为它凭借其多功能性、易于实现和集成、活跃的开发者社区以及不断增长的机器学习生态系统，满足了当下的需求，导致其在机器学习领域的采用率迅速增长。


  本书作者利用他们使用 Python 及其机器学习生态系统解决实际问题的实践经验，帮助读者掌握应用基本概念、方法、工具和技术解决自身实际问题和用例所需的扎实知识。《Python
  机器学习实战》旨在满足从初学者到专家等不同技能水平的读者的需求，帮助他们构建结构化的、实用的机器学习解决方案。


  拉姆·R·瓦拉 引言


  数据是新的石油，而机器学习则是充分利用它的强大概念和框架。在这个自动化和智能系统的时代，机器学习和数据科学成为最热门的关键词之一并不令人意外。各行各业、企业和领域对数据科学领域的巨大兴趣和重新投资，清楚地表明了其巨大的潜力。智能系统和数据驱动的组织正在成为现实，而工具和技术的进步只会进一步推动其发展。随着数据变得至关重要，对机器学习和数据科学从业者的需求从未像现在这样高。事实上，世界正面临数据科学家的短缺。它被称为“21
  世纪最性感的职业”，这使得尝试在该领域建立一些宝贵的专业知识更加值得。


  《Python 机器学习实战》是一本构建真实世界智能系统的问题解决指南。它采用全面的三层方法，融合了概念、方法、动手示例和代码。本书帮助读者掌握必备技能，通过遵循数据驱动的思维方式，识别并解决机器学习和深度学习中的复杂问题。通过利用流行的
  Python 机器学习生态系统的真实案例研究，本书是您学习机器学习艺术与科学、成为成功从业者的完美伴侣。本书中使用的概念、技术、工具、框架和方法将教您如何思考、设计、构建并成功执行机器学习系统和项目。




  本书将引导您入门如何利用 Python 机器学习生态系统及其多样化的框架和库。本书采用三层递进式方法：首先专注于围绕机器学习基础以及相关工具和框架构建坚实基础；其次强调构建机器学习管道的核心流程；最后利用这些知识解决来自零售、交通、电影、音乐、计算机视觉、艺术和金融等多个领域的真实案例研究。我们还涵盖了广泛的机器学习模型，包括回归、分类、预测、规则挖掘和聚类。本书还涉及深度学习领域的前沿方法和研究，包括迁移学习等概念以及与计算机视觉相关的案例研究，如图像分类和神经风格迁移。每一章都包含详细的概念、完整的动手示例、代码和深入讨论。本书的主要意图是为广泛的读者——包括
  IT 专业人士、分析师、开发者、数据科学家、工程师和研究生——提供一种结构化的方法，以获得与机器学习相关的关键技能，并掌握足够的知识来利用最先进的机器学习技术和框架，从而能够开始解决他们自己的实际问题。本书以应用为重点，因此它不能替代对机器学习算法、方法及其内部实现获得深入概念和理论知识的途径。我们强烈建议您将本书获得的实践知识与一些关于数据挖掘、统计分析以及机器学习算法和方法理论方面的标准书籍相结合，以更深入地了解机器学习的世界。


