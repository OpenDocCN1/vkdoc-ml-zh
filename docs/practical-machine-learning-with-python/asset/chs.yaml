  \n让我们在这个数据上训练一个基于树的模型。决策树分类器是经典树模型的一个极好例子。它基于决策树的概念，决策树专注于使用树状图或流程图来建模决策及其可能的结果。树中的每个决策节点代表对特定数据属性的决策测试。来自每个节点的边或分支代表决策测试的可能结果。每个叶节点代表一个预测的类别标签。要获得所有端到端的分类规则，你需要考虑从根节点到叶节点的路径。机器学习背景下的决策树模型是非参数监督学习方法，它使用这些基于决策树的结构进行分类和回归任务。核心目标是构建一个模型，使得我们可以通过利用基于决策树的结构从输入数据特征中学习决策规则来预测目标响应变量的值。基于决策树的模型的主要优点是模型可解释性，因为理解和解释导致特定模型预测的决策规则相当容易。除此之外，其他优点包括模型能够轻松处理分类和数值数据以及多类分类问题。甚至可以可视化树以更好地理解和解释决策规则。以下代码片段利用\
  \ `DecisionTreeClassifier` 估计器来构建决策树模型并预测我们葡萄酒样品的葡萄酒品质评级。\n\n![A448827_1_En_9_Fig23_HTML.jpg](img/A448827_1_En_9_Fig23_HTML.jpg)\n\
  \n图 9-23.\n\n葡萄酒品质预测模型的决策树模型性能指标\n\n```\nIn [21]: from sklearn.tree import DecisionTreeClassifier\n\
  ...: # train the model\n...: wqp_dt = DecisionTreeClassifier()\n...: wqp_dt.fit(wqp_train_SX,\
  \ wqp_train_y)\n...: # predict and evaluate performance\n...: wqp_dt_predictions\
  \ = wqp_dt.predict(wqp_test_SX)\n...: meu.display_model_performance_metrics(true_labels=wqp_test_y,\n\
  ...:                     predicted_labels=wqp_dt_predictions, classes=wqp_label_names)\n\
  ```\n\n我们获得了大约 73% 的总体 F1 分数和模型准确率，如图 9-23 所示，这对于一个开始来说还不错。查看基于类别的统计数据；我们可以看到高品质葡萄酒样品的召回率相当差，因为很多被错误分类为中等和低品质评级。这有点意料之中，因为如果你还记得我们之前的训练样本大小，我们没有很多高品质葡萄酒的训练样本。考虑到低品质和高品质评级的葡萄酒样品，我们至少应该尝试看看是否可以防止我们的模型将低品质葡萄酒预测为高品质，同样地，防止将高品质葡萄酒预测为低品质。解释这个模型，你可以使用以下代码根据模型学到的模式查看特征重要性分数。\n\
  \n![A448827_1_En_9_Fig24_HTML.jpg](img/A448827_1_En_9_Fig24_HTML.jpg)\n\n图 9-24.\n\
  \n从我们的决策树模型获得的特征重要性\n\n```\nIn [22]: wqp_dt_feature_importances = wqp_dt.feature_importances_\n\
  ...: wqp_dt_feature_names, wqp_dt_feature_scores = zip(*sorted(zip(wqp_feature_names,\n\
  ...:                                    wqp_dt_feature_importances), key=lambda\
  \ x: x[1]))\n...: y_position = list(range(len(wqp_dt_feature_names)))\n...: plt.barh(y_position,\
  \ wqp_dt_feature_scores, height=0.6, align='center')\n...: plt.yticks(y_position\
  \ , wqp_dt_feature_names)\n...: plt.xlabel('Relative Importance Score')\n...: plt.ylabel('Feature')\n\
  ...: t = plt.title('Feature Importances for Decision Tree')\n```\n\n我们可以从图 9-24\
  \ 中清楚地观察到，与我们之前的模型相比，最重要的特征发生了变化。`Alcohol` 和 `volatile acidity` 占据了前两位，而 `total\
  \ sulfur dioxide` 似乎是分类葡萄酒类型和品质的最重要特征之一（如图 9-20 所示）。如果你还记得，我们之前提到过，你也可以轻松地从决策树模型中可视化决策树结构，并查看它从用于预测新数据样本的底层特征中学到的决策规则。以下代码有助于可视化决策树。\n\
  \n![A448827_1_En_9_Fig25_HTML.jpg](img/A448827_1_En_9_Fig25_HTML.jpg)\n\n图 9-25.\n\
  \n可视化我们的决策树模型\n\n```\nIn [23]: from graphviz import Source\n...: from sklearn import\
  \ tree\n...: from IPython.display import Image\n...:\n...: graph = Source(tree.export_graphviz(wqp_dt,\
  \ out_file=None, class_names=wqp_label_names,\n...:                            \
  \        filled=True, rounded=True, special_characters=False,\n...:            \
  \                        feature_names=wqp_feature_names, max_depth=3))\n...: png_data\
  \ = graph.pipe(format='png')\n...: with open('dtree_structure.png','wb') as f:\n\
  ...:     f.write(png_data)\n...: Image(png_data)\n```\n\n我们的决策树模型有大量的节点和分支，因此我们基于前面的代码片段可视化了最大深度为三的树。你可以开始从图\
  \ 9-25 中的树观察决策规则，其中起始分割由规则 `alcohol <= -0.1277` 决定，并且随着每个是/否决策分支分割，当我们下降到树的每个深度级别时，我们有进一步的决策节点。类变量是我们试图预测的，即葡萄酒品质是低、中还是高，而\
  \ value 决定了当前决策节点在每个实例中每个类别的总样本数。`gini` 参数基本上是用于确定和衡量每个决策节点分割质量的标准。最佳分割可以通过基尼不纯度/基尼指数或信息增益等指标来确定。只是为了给你一些背景信息，基尼不纯度是一个有助于最小化错误分类概率的指标。它在数学上通常表示为：\n\
  \n![$$ {I}_G(p)=\\sum \\limits_{i=1}^C{p}_i\\left(1-{p}_i\\right)=1-\\sum \\limits_{i=1}^C{p_i}²\
  \ $$](img/A448827_1_En_9_Chapter_Equa.gif)\n\n其中我们有 C 个类别要预测，p [i] 是标记为类别 i 的项目的分数，或者是选择具有类别标签\
  \ i 的实例的概率度量，而 (1 - p [i] ) 是对该项目进行分类的错误或错误分类度量。基尼不纯度/指数是通过对 C 个类别中每个类别标签的分类实例分数的平方求和，然后从\
  \ 1 中减去结果来计算的。感兴趣的读者可以查看一些关于决策树的标准文献，如果对深入理解熵和基尼之间的差异或理解更复杂的数学细节感兴趣的话。\n\n继续我们改进葡萄酒品质预测模型的使命，让我们看看一些集成建模方法。集成模型通常是机器学习模型，它们组合或采用每个单独基础模型估计器预测的加权（平均/多数）投票，这些估计器是使用它们自己的监督方法构建的。与每个单独的基础模型相比，集成模型有望在底层数据上更好地泛化，更稳健，并做出更优越的预测。集成模型可以分为三大类。\n\
  \n*   装袋方法：术语装袋代表自助聚合，其中集成模型试图通过组合在随机生成的训练样本上训练的单个基础模型的预测来提高预测准确性。从原始训练数据集中抽取自助样本，即独立有放回样本，并在这些采样数据集上构建几个基础模型。在任何实例中，取所有单个估计器预测的平均值，作为集成模型做出最终预测。随机抽样试图减少模型方差，减少过拟合，并提高预测准确性。例子包括非常流行的随机森林。\n\
  *   提升方法：与基于组合或平均原则的装袋方法相比，在提升方法中，我们通过顺序训练每个基础模型估计器来增量地构建集成模型。训练每个模型涉及特别强调学习它之前错误分类的实例。其思想是组合几个弱基础学习器以形成一个强大的集成。弱学习器在训练数据的多次迭代中顺序训练，每次重新训练阶段都插入权重修改。在每次重新训练弱基础学习器时，那些之前被错误分类的训练实例被分配更高的权重。因此，这些方法试图专注于它在先前训练序列中错误预测的训练实例。提升模型容易过拟合，因此应该非常小心。例子包括梯度提升、AdaBoost\
  \ 和非常流行的 XGBoost。\n*   堆叠方法：在基于堆叠的方法中，我们首先在训练数据上构建多个基础模型。然后，通过将这些模型的输出预测作为其训练的额外输入来构建最终的集成模型，以做出最终预测。\n\
  \n现在让我们尝试使用随机森林（一种非常流行的装袋方法）构建一个模型。在随机森林模型中，每个基础学习器是一个在训练数据的自助样本上训练的决策树模型。除此之外，当我们想要分割树中的决策节点时，分割是从所有特征的随机子集中选择的，而不是从所有特征中获取最佳分割。由于引入了这种随机性，偏差增加，当我们对森林中所有树的结果进行平均时，总体方差减小，为我们提供了一个稳健且泛化良好的集成模型。我们将使用来自\
  \ `scikit-learn` 的 `RandomForestClassifier`，它平均森林中所有树的概率预测以进行最终预测，而不是获取实际预测投票然后平均。\n\
  \n![A448827_1_En_9_Fig26_HTML.jpg](img/A448827_1_En_9_Fig26_HTML.jpg)\n\n图 9-26.\n\
  \n葡萄酒品质预测模型的随机森林模型性能指标\n\n```\nIn [24]: from sklearn.ensemble import RandomForestClassifier\n\
  ...: # train the model\n...: wqp_rf = RandomForestClassifier()\n...: wqp_rf.fit(wqp_train_SX,\
  \ wqp_train_y)\n...: # predict and evaluate performance\n...: wqp_rf_predictions\
  \ = wqp_rf.predict(wqp_test_SX)\n...: meu.display_model_performance_metrics(true_labels=wqp_test_y,\n\
  ...:                                      predicted_labels=wqp_rf_predictions,\n\
  ...:                                      classes=wqp_label_names)\n```\n\n测试数据集上的模型预测结果显示，总体\
  \ F1 分数和模型准确率约为 77%，如图 9-26 所示。这比我们仅使用决策树获得的结果提高了 4%，证明集成学习效果更好。\n\n进一步改进此结果的另一种方法是模型调优。更具体地说，模型具有可以调优的超参数，正如我们之前在第\
  \ 5 章的“模型调优和超参数调优”部分中详细讨论的那样。超参数也称为元参数，通常在我们开始模型训练过程之前设置。这些超参数不依赖于从模型训练所依据的底层数据中推导出来。通常，这些超参数代表一些高级概念或旋钮，可用于在训练期间调整和调优模型以提高其性能。我们的随机森林模型有几个超参数，你可以按如下方式查看其默认值。\n\
  \n```\nIn [25]: print(wqp_rf.get_params())\n{'bootstrap': True, 'random_state':\
  \ None, 'verbose': 0, 'min_samples_leaf': 1, 'min_weight_fraction_leaf': 0.0, 'max_depth':\
  \ None, 'class_weight': None, 'max_leaf_nodes': None, 'oob_score': False, 'criterion':\
  \ 'gini', 'n_estimators': 10, 'max_features': 'auto', 'min_impurity_split': 1e-07,\
  \ 'n_jobs': 1, 'warm_start': False, 'min_samples_split': 2}\n```\n\n从前面的输出中，你可以看到许多超参数。我们建议查看官方文档\
  \ [ `http://scikit-learn.org/stable/modules/generated/sklearn.ensemble.RandomForestClassifier.html`\
  \ ](http://scikit-learn.org/stable/modules/generated/sklearn.ensemble.RandomForestClassifier.html)\
  \ 以了解每个参数的更多信息。对于超参数调优，我们将保持简单，重点关注 `n_estimators`（表示森林集成模型中基础树模型的总数）和 `max_features`（表示每次最佳分割时要考虑的特征数量）。我们使用标准的网格搜索方法，配合五折交叉验证来选择最佳超参数。\n\
  \n```\nIn [26]: from sklearn.model_selection import GridSearchCV\n...:\n...: param_grid\
  \ = {\n...:                 'n_estimators': [100, 200, 300, 500],\n...:        \
  \         'max_features': ['auto', None, 'log2']\n...:               }\n...:\n...:\
  \ wqp_clf = GridSearchCV(RandomForestClassifier(random_state=42), param_grid, cv=5,\n\
  ...:                        scoring='accuracy')\n...: wqp_clf.fit(wqp_train_SX,\
  \ wqp_train_y)\n...: print(wqp_clf.best_params_)\n{'max_features': 'auto', 'n_estimators':\
  \ 200}\n```\n\n我们可以在前面的输出中看到网格搜索后获得的超参数选定值。我们有 200 个估计器和 `auto` 最大特征，这表示在最佳分割操作中要考虑的总特征数的平方根。评分参数设置为准确率，以评估模型的最佳准确率。你可以将其设置为其他参数，以根据其他指标（如\
  \ F1 分数、精确率、召回率等）评估模型。查看 [ `http://scikit-learn.org/stable/modules/model_evaluation.html#scoring-parameter`\
  \ ](http://scikit-learn.org/stable/modules/model_evaluation.html#scoring-parameter)\
  \ 了解更多详细信息。你可以按如下方式查看所有超参数组合的网格搜索结果。\n\n```\nIn [27]: results = wqp_clf.cv_results_\n\
  ...: for param, score_mean, score_sd in zip(results['params'], results['mean_test_score'],\n\
  results['std_test_score']):\n...:     print(param, round(score_mean, 4), round(score_sd,\
  \ 4))\n{'max_features': 'auto', 'n_estimators': 100} 0.7928 0.0119\n{'max_features':\
  \ 'auto', 'n_estimators': 200} 0.7955 0.0101\n{'max_features': 'auto', 'n_estimators':\
  \ 300} 0.7941 0.0086\n{'max_features': 'auto', 'n_estimators': 500} 0.795 0.0094\n\
  {'max_features': None, 'n_estimators': 100} 0.7847 0.0144\n{'max_features': None,\
  \ 'n_estimators': 200} 0.781 0.0149\n{'max_features': None, 'n_estimators': 300}\
  \ 0.784 0.0128\n{'max_features': None, 'n_estimators': 500} 0.7858 0.0107\n{'max_features':\
  \ 'log2', 'n_estimators': 100} 0.7928 0.0119\n{'max_features': 'log2', 'n_estimators':\
  \ 200} 0.7955 0.0101\n{'max_features': 'log2', 'n_estimators': 300} 0.7941 0.0086\n\
  {'max_features': 'log2', 'n_estimators': 500} 0.795 0.0094\n```\n\n前面的输出显示了选定的超参数组合及其在网格中的相应平均准确率和标准差。让我们使用调优后的超参数训练一个新的随机森林模型，并评估其在测试数据上的性能。\n\
