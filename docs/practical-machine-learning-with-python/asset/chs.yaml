  \ dioxide', 'density', 'pH', 'sulphates', 'alcohol']\n```\n\n从前面的输出可以看出，我们使用了相同的物理化学葡萄酒特征。还显示了每个品质评级类别中的样本数量。很明显，我们只有很少的高等级评级葡萄酒样品，而有很多中等品质的葡萄酒样品。我们进入下一步特征缩放。\n\
