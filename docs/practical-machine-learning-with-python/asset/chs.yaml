  如果您还记得第 4 章，我们讨论了分类类别标签的编码以及独热编码方案。到目前为止，我们在 `scikit-learn` 中的模型直接接受情感类别标签作为 `positive`
  和 `negative`，并在内部执行这些操作。然而，对于我们的深度学习模型，我们需要显式地执行此操作。以下代码片段帮助我们标记化我们的电影评论，并将基于文本的情感类别标签转换为独热编码向量（构成步骤
