  \n总结\n\n本章以案例研究为导向，介绍了 IMDb 电影评论数据集，目标是根据文本内容预测评论的情感倾向。在本章中，我们涵盖了自然语言处理（NLP）、文本分析、机器学习和深度学习中的概念与技术。我们涉及了\
  \ NLP 的多个方面，包括文本预处理、规范化、特征工程以及文本分类。我们还详细介绍了使用情感词典（如 Afinn、SentiWordNet 和`VADER`）的无监督学习技术，展示了如何在缺乏标注训练数据的情况下分析情感——这在当今的组织中是一个非常现实的问题。将文本分类作为监督式机器学习问题的详细工作流程图，帮助我们建立了\
  \ NLP 与机器学习之间的联系，从而在拥有标注数据时，能够运用机器学习技术和方法来解决预测情感倾向的问题。\n\n\n对监督方法的关注体现在两个方面。这包括传统的机器学习方法及模型，如逻辑回归和支持向量机，以及更新的深度学习模型，包括深度神经网络、RNN\
  \ 和 LSTM。为了以最佳模型性能从电影评论中预测情感，我们涵盖了详细的概念、工作流程、动手实践示例，以及使用多种监督模型和不同特征工程技术进行的比较分析。本章的最后一部分讨论了机器学习中一个非常重要但经常在分析中被忽视的方面。我们研究了分析和解释正面或负面情感原因的方法。通过多个示例，我们介绍了如何分析和可视化模型解释及主题模型，以便让您深入了解如何在自己的数据集上重用这些框架。本章使用的框架和方法论应有助于您未来在处理自己的文本数据时解决类似问题。\n\
  \n8. 客户细分与\n有效的交叉销售\n\n金钱驱动世界运转，而在当前数据密集型商业实践的生态系统中，可以稳妥地说数据同样驱动世界运转。数据科学家一项非常重要的技能是将分析的技术层面与其商业价值（即货币价值）相匹配。这可以通过多种方式实现，并且很大程度上取决于业务类型和可用数据。在前面的章节中，我们介绍了可以构建为业务问题（利用\
  \ CRISP-DM 模型）并与收入产生相关联的问题。在本章中，我们将直接关注两个非常重要的问题，它们可以直接对企业和机构（尤其是零售领域）的收入流产生积极影响。本章的独特之处还在于，我们探讨了机器学习算法的一个不同范式，更侧重于与模式识别和无监督学习相关的任务。\n\
  \n在本章中，我们首先偏离通常的技术焦点，尝试收集一些业务和领域知识。这些知识非常重要，因为对于许多数据科学家来说，这往往是绊脚石——在场景中，一个完美开发的机器学习解决方案由于缺乏对基于业务需求从解决方案中获得实际价值的关注而未能投入生产。牢固掌握底层业务（和货币）动机有助于数据科学家定义其解决方案的价值方面，从而确保它们得以部署，并为雇主创造可实现的价值。\n\
  \n为了实现这一目标，我们将从一个来自 UCI 机器学习库的零售交易数据集（[`http://archive.ics.uci.edu/ml/datasets/online+retail`](http://archive.ics.uci.edu/ml/datasets/online+retail)）开始，并将使用该数据集来解决两个相当简单但重要的问题。本章使用的详细代码、笔记本和数据集可在\
  \ GitHub 仓库中第 8 章的相应目录中找到，地址为[`https://github.com/dipanjanS/practical-machine-learning-with-python`](https://github.com/dipanjanS/practical-machine-learning-with-python)。\n\
  \n*   **客户细分**：客户细分是根据客户与企业的互动来揭示企业客户群信息的问题。在大多数情况下，这种互动体现在他们的购买行为和模式上。我们将探讨一些可以利用这一点的方法。\n\
  \n*   **购物篮分析**：购物篮分析是一种深入了解客户细微行为的方法。这有助于制定策略，从而更深入地理解客户做出的购买决策。这很有趣，因为很多时候，即使是客户自己也可能没有意识到其购买行为中的此类偏见或趋势。\n\
  \n在线零售交易数据集\n\n在线零售交易数据集可从 UCI 机器学习库获取。我们在前面的章节中已经使用过该库的一些数据集，这应该能突显该库对用户的重要性。我们将用于分析的数据集非常简单。根据\
  \ UCI 网站上的描述，它包含一家英国注册的无实体店在线零售商在`01/12/2010`和`09/12/2011`之间发生的所有交易。从网站上我们还了解到，该公司销售独特的万用礼品，其许多客户是批发商。\n\
  \n最后一条信息尤其重要，因为它让我们有机会探索大规模客户的购买行为，而不仅仅是普通零售客户。该数据集没有任何信息可以帮助我们区分批发购买和零售购买。在开始之前，请确保加载以下依赖项。\n\
  \n```\nimport pandas as pd\nimport datetime\nimport math\nimport numpy as np\nimport\
  \ matplotlib.pyplot as plt\nimport matplotlib.mlab as mlab\n%matplotlib inline\n\
  ```\n\n注意\n\n我们鼓励您查看 UCI 机器学习库以及该特定数据集的页面，地址为[`http://archive.ics.uci.edu/ml/datasets/online+retail`](http://archive.ics.uci.edu/ml/datasets/online+retail)。在该网站上，您可以找到一些使用相同数据集的研究论文。我们相信，这些论文以及本章进行的分析将为所有读者带来有趣的阅读体验。\n\
  \n探索性数据分析\n\n我们一直坚持，无论实际用例或算法如何，我们都打算实施标准的分析工作流程，该流程应始终从探索性数据分析（EDA）开始。因此，遵循传统，我们将从对数据集的\
  \ EDA 开始。\n\n您首先应该注意到的是数据集的格式。与本书中处理的大多数数据集不同，该数据集不是 CSV 格式，而是 Excel 文件。在其他一些语言（甚至框架）中，这可能会引起问题，但使用\
  \ Python，特别是`pandas`，我们不会遇到任何此类问题，我们可以使用`pandas`库提供的`read_excel`函数读取数据集。我们还查看了数据集中的一些行。\n\
