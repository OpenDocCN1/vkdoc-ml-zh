  \   386.505376   994.777199\nmin       2.830000     0.000000            0.000000\
  \    -1.000000  -101.000000\n25%     651.622500   342.000000           10.000000\
  \  1223.000000  5236.000000\n50%    1330.925000   635.000000           20.000000\
  \  1480.000000  5496.000000\n75%    2203.897500   875.000000           30.000000\
  \  1745.000000  5726.000000\nmax    5840.370000  1099.000000           41.000000\
  \  2000.000000  6001.000000\n```\n\n\n\n### 数据过滤\n\n我们已经完成了对现有数据集的初步检查，了解了它包含什么以及缺少什么。下一阶段是数据清洗。清洗数据集涉及诸如删除/处理错误或缺失数据、处理异常值等任务。清洗还包括标准化属性列名，使其更具可读性、更直观，并符合某些标准，以便所有相关人员理解。为了执行此任务，我们编写一个小函数，并利用\
  \ `pandas` 的 `rename()` 工具来完成这一步。`rename()` 函数接受一个 `dict`，其中键代表旧列名，值指向新列名。我们还可以通过适当设置\
  \ `inplace` 标志来决定是修改现有数据框还是生成一个新的。以下代码片段展示了这个函数。\n\n```\ndef cleanup_column_names(df,rename_dict={},do_inplace=True):\n\
  \"\"\"此函数用于重命名 pandas 数据框的列\n如果未传递 rename_dict，则将列名转换为蛇形命名法。\n参数:\nrename_dict (dict):\
  \ 键代表旧列名，值指向新列名\ndo_inplace (bool): 标志，用于更新现有数据框或返回新数据框\n返回:\n如果 do_inplace 设置为\
  \ False，则返回 pandas 数据框，否则返回 None\n\"\"\"\nif not rename_dict:\nreturn df.rename(columns={col:\
  \ col.lower().replace(' ','_')\nfor col in df.columns.values.tolist()},\ninplace=do_inplace)\n\
  else:\nreturn df.rename(columns=rename_dict,inplace=do_inplace)\n```\n\n在我们所考虑的\
  \ `dataframe` 上使用此函数后，会生成图 3-11 中的输出。由于我们没有传递任何包含新旧列名的 `dict`，该函数会将所有列更新为蛇形命名法。\n\
  \n![A448827_1_En_3_Fig11_HTML.jpg](img/A448827_1_En_3_Fig11_HTML.jpg)\n\n图 3-11.\
  \ 列名已重命名的数据集\n\n对于不同的算法、分析甚至可视化，我们通常只需要处理属性的一个子集。使用 `pandas`，我们可以通过多种方式垂直切片（选择列的子集）。`pandas`\
  \ 提供了不同的方式来适应不同的场景，如下面的代码片段所示。\n\n```\nprint(\"使用列索引::\" )\nprint(df[[3]].values[:,\
  \ 0] )\nprint(\"使用列名::\" )\nprint(df.quantity_purchased.values)\nprint(\"使用列数据类型::\"\
  \ )\nprint(df.select_dtypes(include=['float64']).values[:,0] )\n```\n\n在此代码片段中，我们以三种不同的方式执行了属性选择。第一种方法利用列索引号来获取所需信息。在此例中，我们只想处理\
  \ `quantity_purchased` 字段，因此索引号为 3（`pandas` 列从 0 开始索引）。第二种方法通过直接以点号表示法引用列名来提取同一属性的数据。第一种方法在循环中非常方便，而第二种方法更具可读性，并且在我们利用\
  \ Python 的面向对象特性时能很好地融合。然而，有时我们只需要根据数据类型来获取属性。第三种方法利用 `select_dtypes()` 工具来完成此任务。它提供了仅基于数据类型来包含和排除列的方法。在此示例中，我们选择了数据类型为浮点型的列（我们数据集中的价格列）。此代码片段的输出如下。\n\
  \n```\n使用列索引::\n[13  1  2 ...,  2 30 17]\n使用列名::\n[13  1  2 ...,  2 30 17]\n使用列数据类型::\n\
  [ 3021.06  1822.62   542.36 ...,  1768.66  1848.5   1712.22]\n```\n\n选择特定的属性/列是数据框子集化的一种方式。也可能存在需要水平拆分数据框的需求。为了处理行的子集，`pandas`\
  \ 提供了如下代码片段中概述的方法。\n\n```\nprint(\"选择特定的行索引::\")\nprint(df.iloc[[10,501,20]] )\n\
  print(\"排除特定的行索引::\" )\nprint(df.drop([0,24,51], axis=0).head())\nprint(\"基于逻辑条件进行子集化::\"\
  \ )\nprint(df[df.quantity_purchased>25].head())\nprint(\"基于距顶部（底部）的偏移进行子集化::\" )\n\
  print(df[100:].head() #df.tail(-100) )\n```\n\n第一种方法利用基于 `iloc`（或整数索引/位置）的选择，我们需要指定要从数据框中获取的索引列表。第二种方法允许从数据框中删除/过滤掉特定的行索引。这在需要过滤掉不满足某些条件的行时非常有用。第三种方法展示了基于条件逻辑的行过滤。最后一种方法基于距数据框顶部的偏移进行过滤。还有一种类似的方法，称为\
  \ `tail()`，可用于从底部进行偏移。生成的输出如图 3-12 所示。\n\n![A448827_1_En_3_Fig12_HTML.jpg](img/A448827_1_En_3_Fig12_HTML.jpg)\n\
  \n图 3-12. 行子集化的不同方式\n\n### 类型转换\n\n类型转换，即将数据转换为适当的数据类型，通常是数据清洗和整理的重要组成部分。数据在从一种形式提取或转换为另一种形式时，常常会被转换为错误的数据类型。此外，不同的平台和系统对每种数据类型的处理方式也不同，因此获得正确的数据类型非常重要。在开始讨论数据整理时，我们检查了数据集中所有列的数据类型。如果你还记得，日期列被标记为对象。虽然如果我们不处理日期，这可能不是问题，但在我们需要日期及相关属性的情况下，将它们作为对象/字符串可能会带来问题。此外，如果日期以字符串形式存在，则很难处理日期操作。为了修复我们的数据框，我们使用\
  \ `pandas` 的 `to_datetime()` 函数。这是一个非常灵活的工具，允许我们设置不同的属性，如日期时间格式、时区等。在我们的例子中，值只是日期，因此我们按如下方式使用该函数及其默认设置。\n\
  \n```\ndf['date'] = pd.to_datetime(df.date)\nprint(df.dtypes)\n```\n\n类似地，我们可以使用\
  \ `to_numeric()` 以及直接的 Python 风格类型转换，将标记为字符串的数值列进行转换。现在检查数据类型，我们可以清楚地看到日期列已转换为正确的\
  \ `datetime64` 数据类型。\n\n```\ndate                  datetime64[ns]\nprice       \
  \                 float64\nproduct_id                     int32\nquantity_purchased\
  \             int32\nserial_no                      int32\nuser_id             \
  \           int32\nuser_type                     object\ndtype: object\n```\n\n\n\
  \n### 转换\n\n数据整理中的另一项常见任务是根据用例或数据本身的需求转换现有列或派生新属性。为了派生或转换列，`pandas` 提供了三种不同的工具——`apply()`、`applymap()`\
  \ 和 `map()`。`apply()` 函数用于对整个对象执行操作，具体取决于轴（默认为所有行）。`applymap()` 和 `map()` 函数按元素工作，其中\
  \ `map()` 来自 `pandas.Series` 层级结构。\n\n为了理解这三种工具，我们以派生一些新属性为例。首先，我们使用 `map()` 函数扩展\
  \ `user_type` 属性。我们编写一个小函数，将每个不同的 `user_type` 代码映射到对应的用户类别，如下所示。\n\n```\ndef expand_user_type(u_type):\n\
  if u_type in ['a','b']:\nreturn 'new'\nelif u_type == 'c':\nreturn 'existing'\n\
  elif u_type == 'd':\nreturn 'loyal_existing'\nelse:\nreturn 'error'\ndf['user_class']\
  \ = df['user_type'].map(expand_user_type)\n```\n\n类似地，我们使用 `applymap()` 函数执行另一个逐元素操作，从日期属性中获取交易所在的周数。在这种情况下，我们使用\
  \ `lambda` 函数来快速完成任务。有关 `lambda` 函数的更多详细信息，请参阅前面的章节。以下代码片段为我们获取了每笔交易的周数。\n\n```\n\
  df['purchase_week'] = df[['date']].applymap(lambda dt:dt.week\nif not pd.isnull(dt.week)\n\
  else 0)\n```\n\n图 3-13 展示了我们的数据框，其中包含两个额外的属性——`user_class` 和 `purchase_week`。\n\n\
  ![A448827_1_En_3_Fig13_HTML.jpg](img/A448827_1_En_3_Fig13_HTML.jpg)\n\n图 3-13.\n\
  \n使用 map 和 applymap 派生属性的数据框\n\n现在，我们使用 `apply()` 函数对整个数据框对象本身执行操作。以下代码片段使用 `apply()`\
  \ 函数获取所有数值属性的范围（最大值到最小值）。我们使用前面讨论过的 `select_dtypes` 和 `lambda` 函数来完成此任务。\n\n```\n\
  df.select_dtypes(include=[np.number]).apply(lambda x: x.max()- x.min())\n```\n\n\
  输出是一个精简的 `pandas.Series` 对象，展示了每个数值列的范围值。\n\n```\nprice                 5837.54\n\
  product_id            1099.00\nquantity_purchased      41.00\nserial_no        \
  \     2001.00\nuser_id               6102.00\npurchase_week           53.00\n```\n\
  \n### 填充缺失值\n\n在处理机器学习和数据科学相关用例时，缺失值可能导致各种问题。它们不仅会给算法带来问题，还可能扰乱计算甚至最终结果。缺失值还存在以非标准方式解释的风险，从而导致混淆和更多错误。因此，填充缺失值在整个数据整理过程中非常重要。\n\
  \n处理缺失值最简单的方法之一是从数据集中忽略或完全删除它们。当数据集相当大并且我们有足够多的各种类型样本时，可以安全地使用此选项。在以下代码片段中，我们使用\
  \ `pandas` 的 `dropna()` 函数删除交易日期缺失的数据行。\n\n```\nprint(\"删除日期缺失的行::\" )\ndf_dropped\
  \ = df.dropna(subset=['date'])\nprint(\"形状::\",df_dropped.shape)\n```\n\n结果是一个没有缺失日期行的数据框。输出数据框如图\
  \ 3-14 所示。\n\n![A448827_1_En_3_Fig14_HTML.jpg](img/A448827_1_En_3_Fig14_HTML.jpg)\n\
  \n图 3-14.\n\n没有任何缺失日期信息的数据框\n\n通常，删除行是一个非常昂贵且不可行的选择。在许多情况下，缺失值是借助数据框中的其他值来填充的。一种常用的技巧是用集中趋势度量（如\
  \ `mean` 或 `median`）替换缺失值。也可以选择其他更复杂的度量/统计方法。在我们的数据集中，价格列似乎有一些缺失数据。我们利用 pandas 的\
  \ `fillna()` 方法，用数据框中的平均价格值填充这些值。\n\n类似地，我们使用 `ffill()` 和 `bfill()` 函数来填充 `user_type`\
  \ 属性的缺失值。由于 `user_type` 是字符串类型属性，我们使用基于邻近度的解决方案来处理这种情况下的缺失值。`ffill()` 和 `bfill()`\
  \ 函数分别从前一行向前复制数据（前向填充）或从下一行复制值（后向填充）。以下代码片段展示了这三个函数。\n\n```\nprint(\"用平均价格填充缺失的价格值::\"\
  \ )\ndf_dropped['price'].fillna(value=np.round(df.price.mean(),decimals=2),\ninplace=True)\n\
  print(\"用前一行的值填充缺失的 user_type 值（前向填充）::\" )\ndf_dropped['user_type'].fillna(method='ffill',inplace=True)\n\
  print(\"用下一行的值填充缺失的 user_type 值（后向填充）::\" )\ndf_dropped['user_type'].fillna(method='bfill',inplace=True)\n\
  ```\n\n除了这些方法之外，在某些情况下，如果一条记录缺失的属性值超过某个阈值，那么这条记录就没有太大用处。例如，如果我们的数据集中，一笔交易的非空属性少于三个，那么这笔交易可能几乎无法使用。在这种情况下，建议直接删除该数据点。我们可以使用\
  \ `dropna()` 函数并设置参数 `thresh` 为非空属性的阈值来过滤掉此类数据点。更多详细信息请参见官方文档页面。\n\n### 处理重复值\n\n\
  许多数据集的另一个问题是存在重复值。虽然数据很重要且多多益善，但重复值本身并不会增加太多价值。更有甚者，重复值有助于我们识别数据记录/收集过程中潜在的错误区域。为了识别重复值，我们有一个名为\
  \ `duplicated()` 的工具，它可以应用于整个数据框，也可以应用于其子集。我们可以通过修复错误并使用 `duplicated()` 函数来处理重复值，尽管我们也可以选择完全删除重复的数据点。要删除重复值，我们使用\
  \ `drop_duplicates()` 方法。以下代码片段展示了这里讨论的两个函数。\n\n```\ndf_dropped[df_dropped.duplicated(subset=['serial_no'])]\n\
  df_dropped.drop_duplicates(subset=['serial_no'],inplace=True)\n```\n\n识别出数据框中 `serial_no`\
  \ 字段具有重复值的子集的输出如图 3-15 所示。前一个代码片段中的第二行只是删除了这些重复值。\n\n![A448827_1_En_3_Fig15_HTML.jpg](img/A448827_1_En_3_Fig15_HTML.jpg)\n\
  \n图 3-15.\n\n具有重复 serial_no 值的数据框\n\n\n\n### 处理分类数据\n\n正如“数据描述”一节所讨论的，分类属性由可取有限数量值（尽管并非总是如此）的数据组成。在我们的数据集中，属性\
  \ `user_type` 是一个分类变量，它只能从允许的集合 {a, b, c, d} 中取有限数量的值。我们在后续章节中将学习和使用的算法大多处理数值数据，而分类变量可能会带来一些问题。使用\
  \ `pandas`，我们可以通过几种不同的方式处理分类变量。第一种是使用 `map()` 函数，我们只需将允许集合中的每个值映射到一个数值。尽管这可能有用，但这种方法需要谨慎处理并注意其局限性。例如，像加法、均值等统计操作，虽然在语法上是有效的，但出于显而易见的原因应避免使用（更多内容将在后续章节中讨论）。第二种方法是使用\
  \ `get_dummies()` 函数将分类变量转换为指示变量。该函数只是一个包装器，用于为所考虑的变量生成独热编码。独热编码和其他编码也可以使用像 `sklearn`\
  \ 这样的库来处理（我们将在后续章节中看到更多示例）。\n\n以下代码片段展示了前面讨论的两种方法，分别使用了 `map()` 和 `get_dummies()`。\n\
  \n```\n# 使用 map 进行虚拟编码\ntype_map={'a':0,'b':1,'c':2,'d':3,np.NAN:-1}\ndf['encoded_user_type']\
  \ = df.user_type.map(type_map)\nprint(df.head())\n# 使用 get_dummies 进行独热编码\nprint(pd.get_dummies(df,columns=['user_type']).head())\n\
  ```\n\n输出结果如图 3-16 和图 3-17 所示。图 3-16 展示了虚拟编码的输出。使用 `map()` 方法，我们控制了特征的数量，但必须注意本节中提到的局限性。\n\
  \n![A448827_1_En_3_Fig16_HTML.jpg](img/A448827_1_En_3_Fig16_HTML.jpg)\n\n图 3-16.\n\
  \n对 user_type 属性进行虚拟编码后的数据框\n\n第二张图，图 3-17，展示了 `user_type` 属性经过独热编码后的输出。\n\n![A448827_1_En_3_Fig17_HTML.jpg](img/A448827_1_En_3_Fig17_HTML.jpg)\n\
  \n图 3-17.\n\n对 user_type 属性进行独热编码后的数据框\n\n我们将在第 4 章讨论特征工程时，更详细地探讨这些方法。\n\n### 归一化数值\n\
  \n属性归一化是标准化属性值范围的过程。在许多情况下，机器学习算法会使用距离度量，而不同尺度/范围的属性或特征可能会对计算产生不利影响或使结果产生偏差。归一化也称为特征缩放。有多种缩放/归一化特征的方法，其中一些包括重新缩放、标准化（或零均值单位方差）、单位缩放等等。我们可以根据特征、算法和手头的用例选择一种归一化技术。当我们处理实际用例时，这一点会更加清晰。我们还会在第\
  \ 4 章“特征工程与选择”中详细介绍特征缩放策略。以下代码片段展示了一个使用 min-max 缩放器的快速示例，该缩放器来自 `sklearn` 的 `preprocessing`\
  \ 模块，可将属性重新缩放到所需的给定范围。\n\n```\ndf_normalized = df.dropna().copy()\nmin_max_scaler\
  \ = preprocessing.MinMaxScaler()\nnp_scaled = min_max_scaler.fit_transform(df_normalized['price'].reshape(-1,1))\n\
  df_normalized['normalized_price'] = np_scaled.reshape(-1,1)\n```\n\n图 3-18 展示了未缩放的\
  \ price 值和已缩放到 `[0, 1]` 范围的归一化 price 值。\n\n![A448827_1_En_3_Fig18_HTML.jpg](img/A448827_1_En_3_Fig18_HTML.jpg)\n\
  \n图 3-18.\n\nprice 的原始值和归一化值\n\n### 字符串操作\n\n原始数据在可用于分析之前，会呈现出各种问题和复杂性。字符串是另一类原始数据，在我们的算法能够理解它们之前，需要特别关注和处理。正如在讨论分类数据的处理方法时提到的，直接在算法中使用字符串数据存在局限性和问题。\n\
  \n表示自然语言的字符串数据噪声很大，需要一套专门的步骤进行处理。尽管这些步骤大多取决于具体用例，但在此提及它们还是值得的（我们将在后续章节中结合用例更详细地介绍，以便更清晰地理解）。字符串数据通常经历以下处理步骤：\n\
  \n*   **分词**：将字符串数据拆分成组成单元。例如，将句子拆分成单词，或将单词拆分成字符。\n*   **词干提取和词形还原**：这些是将单词转换为其词根或规范形式的归一化方法。词干提取是一种实现词根形式的启发式过程，而词形还原则利用语法和词汇规则来推导词根。\n\
  *   **停用词移除**：文本中包含一些出现频率高但信息量不大的词（如标点符号、连词等）。通常会移除这些词/短语，以减少数据的维度和噪声。\n\n除了前面提到的三个常见步骤外，还有其他操作，如词性标注、哈希、索引等。这些操作都需要根据数据和手头的问题陈述进行调整和优化。请继续关注后续章节中关于这些内容的更多细节。\n\
  \n\n\n## 数据汇总\n\n数据汇总是指为手头的原始数据准备紧凑表示形式的过程。该过程涉及使用不同的统计、数学及其他方法对数据进行聚合。汇总有助于可视化、压缩原始数据以及更好地理解其属性。\n\
  \n`pandas` 库提供了多种强大的汇总技术，以满足不同需求。我们将在此介绍其中几种。最广泛使用的汇总形式是基于特定条件或属性对值进行分组。以下代码片段展示了一种此类汇总。\n\
  \n```\nprint(df['price'][df['user_type']=='a'].mean())\nprint(df['purchase_week'].value_counts())\n\
  ```\n\n第一条语句计算了按 `user_type` 分组的所有交易的平均价格，而第二条语句则统计了每周的交易数量。尽管这些计算很有帮助，但基于属性对数据进行分组能帮助我们更好地理解数据。`groupby()`\
  \ 函数可以帮助我们实现这一点，如下面的代码片段所示。\n\n```\nprint(df.groupby(['user_class'])['quantity_purchased'].sum())\n\
  ```\n\n该语句生成一个表格输出，表示每个 `user_class` 购买数量的总和。生成的输出如下所示。\n\n```\nuser_class\nexisting\
  \           4830\nloyal_existing     5515\nnew               10100\nName: quantity_purchased,\
  \ dtype: int32\n```\n\n`groupby()` 函数是一个强大的接口，允许我们执行复杂的分组和聚合操作。在前面的示例中，我们仅对单个属性进行了分组，并执行了单个聚合（即求和）。使用\
  \ `groupby()`，我们可以执行多属性分组，并在不同属性上应用多个聚合函数。以下代码片段展示了 `groupby()` 的三种使用变体及其对应的输出。\n\
  \n```\n# 变体 1：对单个属性进行多种聚合\ndf.groupby(['user_class'])['quantity_purchased'].agg([np.sum,\
  \ np.mean,\nnp.count_nonzero])\n# 变体 2：为每个属性指定不同的聚合函数\ndf.groupby(['user_class','user_type']).agg({'price':np.mean,\n\
  'quantity_purchased':np.max})\n# 变体 3\ndf.groupby(['user_class','user_type']).agg({'price':{'total_price':np.sum,\n\
  'mean_price':np.mean,\n'variance_price':np.std,\n'count':np.count_nonzero},\n'quantity_purchased':np.sum})\n\
  ```\n\n这三种不同的变体可以解释如下。\n\n变体 1：这里我们对按 `user_class` 分组的购买数量应用了三种不同的聚合（参见图 3-19）。\n\
  \n![A448827_1_En_3_Fig19_HTML.jpg](img/A448827_1_En_3_Fig19_HTML.jpg)\n\n图 3-19.\n\
  \n对单个属性进行多种聚合的 Groupby 操作\n\n变体 2：这里，我们对两个不同的属性应用了不同的聚合函数。`agg()` 函数接受一个字典作为输入，其中包含属性作为键，聚合函数作为值（参见图\
  \ 3-20）。\n\n![A448827_1_En_3_Fig20_HTML.jpg](img/A448827_1_En_3_Fig20_HTML.jpg)\n\
  \n图 3-20.\n\n对不同属性应用不同聚合函数的 Groupby 操作\n\n变体 3：这里，我们结合了变体 1 和变体 2，即对价格字段应用多种聚合，同时对\
  \ `quantity_purchased` 仅应用单一聚合。同样，传递了一个字典，如代码片段所示。输出如图 3-21 所示。\n\n![A448827_1_En_3_Fig21_HTML.jpg](img/A448827_1_En_3_Fig21_HTML.jpg)\n\
  \n图 3-21.\n\n展示复杂操作的 Groupby 操作\n\n除了基于 `groupby()` 的汇总之外，其他函数如 `pivot()`、`pivot_table()`、`stack()`、`unstack()`、`crosstab()`\
  \ 和 `melt()` 提供了根据需要重塑 `pandas` 数据框的能力。这些方法的完整描述及示例可在 `pandas` 文档的 [`https://pandas.pydata.org/pandas-docs/stable/reshaping.html`](https://pandas.pydata.org/pandas-docs/stable/reshaping.html)\
  \ 中找到。我们鼓励您仔细阅读。\n\n## 数据可视化\n\n数据科学是一种以数据为主角的叙事方式。作为数据科学从业者，我们处理大量数据，这些数据日复一日地经历着处理、整理和分析，以满足各种用例。用图表、图形、地图等视觉元素来增强这种叙事，不仅有助于提高对数据的理解（进而理解用例/业务问题），而且还提供了发现隐藏模式和潜在洞察的机会。\n\
  \n因此，数据可视化是以图表、图形、图片等形式直观呈现信息的过程，旨在实现更好且普遍一致的理解。\n\n我们提到普遍一致的理解，是为了指出人类语言中一个非常常见的问题。人类语言本质上是复杂的，根据作者的意图和技能，读者可能会以不同的方式理解书面信息（从而引发各种问题）。因此，以可视化方式呈现数据为我们提供了一种一致的语言来呈现和理解信息（尽管这也不能完全避免误解，但它确实提供了一定的一致性）。\n\
  \n在本节中，我们首先利用 `pandas` 及其通过不同可视化方式直观理解数据的能力。然后，我们将从 `matplotlib` 的角度介绍可视化。\n\n注意\n\
  \n数据可视化本身是一个流行且深入的跨领域研究领域。本章和本节仅介绍一些入门主题。这绝不是一份全面详细的数据可视化指南。感兴趣的读者可以进一步探索，不过此处及后续章节涵盖的主题对于大多数常见的可视化相关任务来说应该足够了。\n\
  \n### 使用 Pandas 进行可视化\n\n数据可视化本身是一个多样化的领域和一门科学。尽管可视化类型的选择在很大程度上取决于数据、受众等因素，但我们将继续使用上一节中的产品交易数据集来理解和进行可视化。\n\
  \n快速回顾一下，手头的数据集包含表示某些用户购买产品的交易记录。每笔交易都有以下属性。\n\n*   日期：交易日期\n*   价格：所购产品的价格\n* \
  \  产品 ID：产品标识号\n*   购买数量：本次交易中购买的产品数量\n*   序列号：交易序列号\n*   用户 ID：执行交易的用户的标识号\n* \
  \  用户类型：用户类型\n\n我们整理数据集以清理列名，将属性转换为正确的数据类型，并推导出额外的属性 `user_class` 和 `purchase_week`，如上一节所述。\n\
  \n`pandas` 是一个非常流行且强大的库，我们在本章中已经看到了许多例子。可视化是 `pandas` 另一个重要且广泛使用的特性。它通过绘图接口暴露其可视化能力，并紧密遵循\
  \ `matplotlib` 风格的可视化语法。\n\n\n\n#### 折线图\n\n首先，我们观察一位交易次数最多的用户的购买模式（我们将其作为练习，留给您自行找出该用户）。趋势最适合用折线图来可视化。只需对数据框按所需字段进行子集筛选，`plot()`\
  \ 接口默认就会绘制出折线图。以下代码片段展示了该用户的价格趋势。\n\n```\ndf[df.user_id == max_user_id][['price']].plot(style='blue')\n\
  plt.title('Price Trends for Particular User')\n```\n\n`plt` 是 `matplotlib.pyplot`\
  \ 的别名。我们将在下一节详细讨论，目前只需假设我们需要它来增强 `pandas` 生成的图表。在此例中，我们用它来为图表添加标题。生成的图表如图 3-22 所示。\n\
  \n![A448827_1_En_3_Fig22_HTML.jpg](img/A448827_1_En_3_Fig22_HTML.jpg)\n\n图 3-22.\n\
  \n展示某用户价格趋势的折线图\n\n虽然我们可以通过可视化看到该用户不同交易的价格，但这并没有太大帮助。现在，我们再次使用折线图来了解他/她的购买趋势随时间的变化（请记住数据集中包含交易日期）。我们使用相同的绘图接口，对数据框按两个所需属性进行子集筛选。以下代码片段概述了该过程。\n\
  \n```\ndf[df.user_id == max_user_id].plot(x='date',y='price',style='blue')\nplt.title('Price\
  \ Trends for Particular User Over Time')\n```\n\n这次，由于有两个属性，我们告知 `pandas` 将日期作为\
  \ x 轴，价格作为 y 轴。`plot()` 接口能优雅地处理 `datetime` 数据类型，如下面图 3-23 所示的输出结果。\n\n![A448827_1_En_3_Fig23_HTML.jpg](img/A448827_1_En_3_Fig23_HTML.jpg)\n\
  \n图 3-23.\n\n某用户的价格随时间变化趋势\n\n这次，我们的可视化清晰地展示了该用户的购买模式。虽然我们可以详细讨论从该可视化中获得的见解，但一个快速的推断是显而易见的。如图所示，该用户似乎在年初购买了高价值商品，并且随着时间推移，购买趋势呈下降态势。此外，与一年中的其他时间相比，年初的交易次数更多且更密集。我们可以将这些细节与更多数据关联起来，以识别模式和行为。我们将在后续章节中介绍更多此类方面。\n\
  \n#### 条形图\n\n在观察了特定用户的趋势之后，让我们从聚合层面来看一下我们的数据集。由于我们已经有了一个名为 `purchase_week` 的派生属性，我们用它来聚合用户随时间推移的购买数量。我们首先使用\
  \ `groupby()` 函数按周聚合数据，然后聚合 `quantity_purchased` 属性。最后一步是将聚合结果绘制在条形图上。以下代码片段帮助我们绘制此信息。\n\
  \n```\ndf[['purchase_week',\n'quantity_purchased']].groupby('purchase_week').sum().plot.barh(\n\
  color='orange')\nplt.title('Quantities Purchased per Week')\n```\n\n我们使用 `barh()`\
  \ 函数来绘制水平条形图。它在信息表示方式上与标准的 `bar()` 图类似，区别在于图表的朝向。图 3-24 显示了生成的输出。\n\n![A448827_1_En_3_Fig24_HTML.jpg](img/A448827_1_En_3_Fig24_HTML.jpg)\n\
  \n图 3-24.\n\n表示每周购买数量的条形图\n\n#### 直方图\n\n探索性数据分析（EDA）最重要的方面之一是了解给定数据集中各种数值属性的分布情况。可视化分布最简单、最常用的方法是通过直方图。我们绘制数据集中所购商品的价格分布，如下所示。\n\
  \n```\ndf.price.hist(color='green')\nplt.title('Price Distribution')\n```\n\n我们使用\
  \ `hist()` 函数，仅用一行代码就绘制出了价格分布。输出结果如图 3-25 所示。\n\n![A448827_1_En_3_Fig25_HTML.jpg](img/A448827_1_En_3_Fig25_HTML.jpg)\n\
  \n图 3-25.\n\n表示价格分布的直方图\n\n图 3-25 所示的输出结果清晰地显示了一个偏态且长尾的分布。在算法中使用此类属性时，此信息将非常有用。当我们处理实际用例时，这一点会更加清晰。\n\
  \n我们可以更进一步，尝试可视化每周的价格分布。为此，我们在 `hist()` 函数中使用参数 `by`。该参数帮助我们根据指定的属性（即 `by`）对数据进行分组，然后为每个分组生成一个子图。在我们的例子中，我们按购买周进行分组，如下所示。\n\
  \n```\ndf[['price','purchase_week']].hist(by='purchase_week' ,sharex=True)\n```\n\
  \n图 3-26 所示的输出结果展示了每周的价格分布，其中最高的柱状图用不同颜色清晰标出。\n\n![A448827_1_En_3_Fig26_HTML.jpg](img/A448827_1_En_3_Fig26_HTML.jpg)\n\
  \n图 3-26.\n\n按周划分的直方图\n\n#### 饼图\n\n在理解数据或提取见解时，最常见的问题之一是了解哪种类型贡献最大。为了可视化百分比分布，饼图是最佳选择。对于我们的数据集，以下代码片段帮助我们可视化不同用户类型的购买量。\n\
  \n```\nclass_series = df.groupby('user_class').size()\nclass_series.name = 'User\
  \ Class Distribution'\nclass_series.plot.pie(autopct='%.2f')\nplt.title('User Class\
  \ Share')\nplt.show()\n```\n\n前面的代码片段使用 `groupby()` 提取一个序列，该序列表示每个 `user_class`\
  \ 级别的交易数量。然后我们使用 `pie()` 函数绘制百分比分布。我们使用 `autopct` 参数在图表上标注每个 `user_class` 的实际百分比贡献。图\
  \ 3-27 展示了输出的饼图。\n\n![A448827_1_En_3_Fig27_HTML.jpg](img/A448827_1_En_3_Fig27_HTML.jpg)\n\
  \n图 3-27.\n\n表示用户类别交易分布的饼图\n\n图 3-27 中的图表明确指出，新用户占据了总交易份额的 50% 以上，而 `existing` 和\
  \ `loyal_existing` 用户则占据了剩余部分。我们不建议使用饼图，尤其是在类别超过三或四个时。请改用条形图。\n\n\n\n#### 箱线图\n\n\
  箱线图是重要的可视化工具，有助于我们理解数值数据的四分位数分布。箱线图（或称箱须图）是一种简洁的表示方式，用于理解数据中的不同四分位数、偏度、离散程度和异常值。\n\
  \n我们将使用箱线图来查看属性 `quantity_purchased` 和 `purchase_week`。以下代码片段为我们生成了所需的图表。\n\n```\n\
  df[['quantity_purchased','purchase_week']].plot.box()\nplt.title('Quantity and Week\
  \ value distribution')\n```\n\n现在，我们来看生成的图表（见图 3-28）。箱线图中箱体的底部边缘标记了第一四分位数，而顶部边缘标记了第三四分位数。箱体中间的线条标记了第二四分位数（即中位数）。从箱体延伸出的顶部和底部须线标记了数值的范围。异常值则标记在须线边界之外。在我们的示例中，对于购买数量，中位数非常接近箱体中间，而购买周的中位数则靠近箱体底部（这清楚地指出了数据中的偏度）。鼓励您阅读更多关于箱线图的内容以深入理解，可参考\
  \ [`http://www.physics.csbsju.edu/stats/box2.html`](http://www.physics.csbsju.edu/stats/box2.html)\
  \ 和 [`http://www.stat.yale.edu/Courses/1997-98/101/boxplot.htm`](http://www.stat.yale.edu/Courses/1997-98/101/boxplot.htm)。\n\
  \n![A448827_1_En_3_Fig28_HTML.jpg](img/A448827_1_En_3_Fig28_HTML.jpg)\n\n图 3-28.\n\
  \n使用 pandas 绘制的箱线图\n\n#### 散点图\n\n散点图是另一类可视化工具，通常用于识别属性之间的相关性或模式。与我们目前看到的大多数可视化工具一样，散点图也可以通过\
  \ `pandas` 的 `plot()` 接口获得。\n\n要理解散点图，我们首先需要执行几个数据整理步骤，将数据转换为所需的形状。我们首先使用 `map()`\
  \ 对 `user_class` 进行虚拟编码（如上一节所述），然后使用 `groupby()` 获取每周每个 `user_class` 级别的平均价格和交易数量。以下代码片段帮助我们获取数据框。\n\
  \n![A448827_1_En_3_Fig29_HTML.jpg](img/A448827_1_En_3_Fig29_HTML.jpg)\n\n图 3-29.\n\
  \n按每周每个 user_class 级别聚合的数据框\n\n```\nuclass_map = {'new': 1, 'existing': 2, 'loyal_existing':\
  \ 3,'error':0}\ndf['enc_uclass'] = df.user_class.map(uclass_map)\nbubble_df = df[['enc_uclass',\n\
  'purchase_week',\n'price','product_id']].groupby(['purchase_week',\n'enc_uclass']).agg(\n\
  {'price':'mean',\n'product_id':'count'}\n).reset_index()\nbubble_df.rename(columns={'product_id':'total_transactions'},inplace=True)\n\
  ```\n\n图 3-29 展示了生成的数据框。现在，让我们使用散点图来可视化这些数据。以下代码片段为我们完成了这项工作。\n\n```\nbubble_df.plot.scatter(x='purchase_week',\n\
  y='price')\nplt.title('Purchase Week Vs Price ')\nplt.show()\n```\n\n这将生成图 3-30\
  \ 中的图表，展示了数据在周数和平均价格之间几乎随机的分布，并在图表的左上角略有集中。\n\n![A448827_1_En_3_Fig30_HTML.jpg](img/A448827_1_En_3_Fig30_HTML.jpg)\n\
  \n图 3-30.\n\n显示数据在 purchase_week 和 price 之间分布的散点图\n\n散点图还为我们提供了可视化更多维度的能力。我们可以使用颜色和大小来绘制第三和第四维度。以下代码片段帮助我们理解分布，其中颜色表示\
  \ `user_class`，而气泡的大小表示交易数量。\n\n```\nbubble_df.plot.scatter(x='purchase_week',\n\
  y='price',\nc=bubble_df['enc_uclass'],\ns=bubble_df['total_transactions']*10)\n\
  plt.title('Purchase Week Vs Price Per User Class Based on Tx')\n```\n\n这些参数不言自明——`c`\
  \ 代表颜色，而 `s` 代表气泡的大小。此类图表也称为气泡图。生成的输出如图 3-31 所示。\n\n![A448827_1_En_3_Fig31_HTML.jpg](img/A448827_1_En_3_Fig31_HTML.jpg)\n\
  \n图 3-31.\n\n可视化多维数据的散点图\n\n在本节中，我们利用 `pandas` 绘制了各种类型的可视化图表。这些是一些最广泛使用的可视化图表，`pandas`\
  \ 提供了很大的灵活性来对它们进行更多操作。此外，还有一系列扩展的图表可以使用 `pandas` 进行可视化。完整信息可在 `pandas` 文档中找到。\n\n\
  ### 使用 Matplotlib 进行可视化\n\n`matplotlib` 是一个流行的绘图库。它提供了生成出版级可视化效果的接口和实用程序。从 2003\
  \ 年的第一个版本至今，`matplotlib` 一直由其活跃的开发者社区不断改进。它也是许多其他绘图库的基础和灵感来源。如前一节所述，`pandas` 与 `SciPy`（另一个用于科学计算的流行\
  \ Python 库）一起，为 `matplotlib` 的实现提供了封装，以便于数据可视化。\n\n`matplotlib` 提供了两个主要模块供使用：`pylab`\
  \ 和 `pyplot`。在本节中，我们将只关注 `pyplot` 模块（不鼓励使用 `pylab`）。`pyplot` 接口是一个面向对象的接口，它倾向于显式实例化，而不是\
  \ `pylab` 的隐式实例化。\n\n在上一节中，我们简要介绍了不同的可视化图表，并看到了一些调整它们的方法。由于 `pandas` 的可视化源自 `matplotlib`\
  \ 本身，我们将涵盖 `matplotlib` 的额外概念和功能。这将使您不仅能够轻松使用 `matplotlib`，还能掌握一些技巧来改进使用 `pandas`\
  \ 生成的可视化效果。\n\n\n\n#### 图形与子图\n\n首先，任何 `matplotlib` 风格的可视化基础都始于图形和子图对象。`figure`\
  \ 模块帮助 `matplotlib` 生成绘图窗口对象及其相关元素。简而言之，它是所有可视化组件的顶层容器。在 `matplotlib` 语法中，图形是最顶层的容器，在一个图形内，我们可以灵活地可视化多个图表。因此，子图就是位于这个高层图形容器内部的图表。\n\
  \n让我们从一个简单的示例和必要的导入开始。然后，我们将基于这个示例进一步理解图形和子图的概念。以下代码片段导入了 `matplotlib` 的 `pyplot`\
  \ 模块，并使用 `numpy` 生成 x 和 y 值，绘制了一条简单的正弦曲线。\n\n```\nimport numpy as np\nimport matplotlib.pyplot\
  \ as plt\n# 示例绘图\nx = np.linspace(-10, 10, 50)\ny=np.sin(x)\nplt.plot(x,y)\nplt.title('使用\
  \ matplotlib 绘制的正弦曲线')\nplt.xlabel('x 轴')\nplt.ylabel('y 轴')\n```\n\n`pyplot` 模块暴露了诸如\
  \ `plot()` 之类的方法来生成可视化。在示例中，通过 `plt.plot(x, y)`，`matplotlib` 在后台工作，生成 `figure` 和\
  \ `axes` 对象，以在图 3-32 中输出图表。为完整起见，语句 `plt.title()、plt.xlabel()` 等分别提供了设置图形标题和轴标签的方法。\n\
  \n![A448827_1_En_3_Fig32_HTML.jpg](img/A448827_1_En_3_Fig32_HTML.jpg)\n\n图 3-32.\n\
  \n示例图表\n\n现在我们已经完成了一个示例图表，让我们看看不同对象在 `matplotlib` 世界中是如何交互的。如前所述，`figure` 对象是所有元素的顶层容器。在把事情复杂化之前，我们首先绘制不同的图形，即每个图形只包含一个图表。以下代码片段使用\
  \ `numpy` 和 `matplotlib` 在两个不同的图形中绘制了正弦波和余弦波。\n\n```\n# 第一个图形\nplt.figure(1)\nplt.plot(x,y)\n\
  plt.title('图 1: 正弦曲线')\nplt.xlabel('x 轴')\nplt.ylabel('y 轴')\n# 第二个图形\nplt.figure(2)\n\
  y=np.cos(x)\nplt.plot(x,y)\nplt.title('图 2: 余弦曲线')\nplt.xlabel('x 轴')\nplt.ylabel('y\
  \ 轴')\n```\n\n语句 `plt.figure()` 创建了一个 `Figure` 类型的实例。作为参数传入的数字是图形标识符，当存在多个图形时，它有助于引用同一个图形。其余的语句与我们示例图表中的类似，`pyplot`\
  \ 始终引用当前的图形对象进行绘制。请注意，一旦实例化了一个新图形，除非另有指定，`pyplot` 会引用新创建的对象。生成的输出如图 3-33 所示。\n\n\
  ![A448827_1_En_3_Fig33_HTML.jpg](img/A448827_1_En_3_Fig33_HTML.jpg)\n\n图 3-33.\n\
  \n使用 matplotlib 绘制多个图形\n\n我们在为一个用例讲述数据故事时会绘制多个图形。然而，有些情况下我们需要在同一个图形中绘制多个图表。这就是子图概念发挥作用的地方。子图将一个图形划分为指定行数和列数的网格，并提供与绘图元素交互的接口。子图可以通过几种不同的方式生成，其使用取决于个人偏好和用例需求。我们从最直观的方法\
  \ `add_subplot()` 开始。该方法通过图形对象本身暴露出来。它的参数有助于定义网格布局和其他属性。以下代码片段在一个图形中生成了四个子图。\n\n\
  ```\ny = np.sin(x)\nfigure_obj = plt.figure(figsize=(8, 6))\nax1 = figure_obj.add_subplot(2,2,1)\n\
  ax1.plot(x,y)\nax2 = figure_obj.add_subplot(2,2,2)\nax3 = figure_obj.add_subplot(2,2,3)\n\
  ax4 = figure_obj.add_subplot(2,2,4)\nax4.plot(x+10,y)\n```\n\n此代码片段首先使用 `plt.figure()`\
  \ 定义了一个图形对象。然后，我们获取了一个指向第一个子图的轴对象，该子图是通过语句 `figure_obj.add_subplot(2,2,1)` 生成的。这个语句实际上是将图形划分为两行两列。最后一个参数（值为\
  \ 1）指向此网格中的第一个子图。该代码片段仅在左上角的子图（标识为 2,2,1）中绘制了正弦曲线，并在第四个子图（标识为 2,2,4）中绘制了另一条在 x 轴上偏移了\
  \ 10 个单位的正弦曲线。生成的输出如图 3-34 所示。\n\n![A448827_1_En_3_Fig34_HTML.jpg](img/A448827_1_En_3_Fig34_HTML.jpg)\n\
  \n图 3-34.\n\n使用 add_subplot 方法创建的子图\n\n生成子图的第二种方法是通过 `pyplot` 模块直接进行。`pyplot` 模块暴露了一个\
  \ `subplots()` 方法，该方法返回图形对象和一个 `axes` 对象列表，每个对象都指向 `subplots()` 参数中提到的布局中的一个子图。当我们知道需要多少个子图时，这个方法很有用。以下代码片段展示了这一点。\n\
  \n```\nfig, ax_list = plt.subplots(2,1,sharex=True, figsize=(8, 6))\ny= np.sin(x)\n\
  ax_list[0].plot(x,y)\ny= np.cos(x)\nax_list[1].plot(x,y)\n```\n\n语句 `plt.subplots(2,1,sharex=True)`\
  \ 一次性完成了三件事。首先，它生成了一个 `figure` 对象，然后将其划分为 2 行 1 列（即总共两个子图）。这两个子图以 `axes` 对象列表的形式返回。最后，第三件事是共享\
  \ x 轴，我们通过参数 `sharex` 实现了这一点。这种 x 轴的共享允许该图形中的所有子图拥有相同的 x 轴。这使我们能够在同一尺度上查看数据，同时提升美观性。输出如图\
  \ 3-35 所示，展示了在同一 x 轴上的正弦和余弦曲线。\n\n![A448827_1_En_3_Fig35_HTML.jpg](img/A448827_1_En_3_Fig35_HTML.jpg)\n\
  \n图 3-35.\n\n使用 subplots() 方法创建的子图\n\n另一个变体是 `subplot()` 函数，它也通过 `pyplot` 模块直接暴露出来。这个函数与图形对象的\
  \ `add_subplot()` 方法非常相似。你可以在本章的代码中找到相关示例。在进入其他概念之前，我们快速提一下 `subplot2grid()` 函数，它也通过\
  \ `pyplot` 模块暴露出来。该函数提供了与已讨论方法类似的功能，同时对定义网格布局有更精细的控制，子图可以跨越任意数量的列和行。以下代码片段展示了一个包含不同大小子图的网格。\n\
  \n```\ny = np.abs(x)\nz = x**2\nplt.subplot2grid((4,3), (0, 0), rowspan=4, colspan=2)\n\
  plt.plot(x, y,'b',x,z,'r')\nax2 = plt.subplot2grid((4,3), (0, 2),rowspan=2)\nplt.plot(x,\
  \ y,'b')\nplt.setp(ax2.get_xticklabels(), visible=False)\nplt.subplot2grid((4,3),\
  \ (2, 2), rowspan=2)\nplt.plot(x, z,'r')\n```\n\n`subplot2grid()` 函数接受多个参数，解释如下：\n\
  \n*   `shape`：一个元组，表示网格中的行数和列数，格式为 (rows, columns)。\n*   `loc`：一个元组，表示子图的位置。此参数从\
  \ 0 开始索引。\n*   `rowspan`：此参数表示子图跨越的行数。\n*   `colspan`：此参数表示子图跨越的列数。\n\n代码片段生成的输出如图\
  \ 3-36 所示，其中一个子图覆盖了四行两列，包含两个函数。另外两个子图各覆盖两行一列。\n\n![A448827_1_En_3_Fig36_HTML.jpg](img/A448827_1_En_3_Fig36_HTML.jpg)\n\
  \n图 3-36.\n\n使用 subplot2grid() 创建的子图\n\n\n\n#### 图表格式化\n\n图表格式化是数据叙事中另一个重要方面，`matplotlib`\
  \ 在这方面提供了丰富的功能。从更改颜色到标记点等，`matplotlib` 都提供了易于使用的直观接口。\n\n我们从颜色属性开始，它是 `plot()` 接口的一部分。`color`\
  \ 属性基于 RGBA 规范，允许我们以字符串（如 red、green 等）、单个字母（如 `r`、`g` 等）甚至十六进制值的形式提供 alpha 和颜色值。更多详细信息可参阅\
  \ `matplotlib` 文档：[`https://matplotlib.org/api/colors_api.html`](https://matplotlib.org/api/colors_api.html)。\n\
  \n下面的示例及图 3-37 所示的输出，展示了为图表设置 `color` 和 `alpha` 属性是多么简单。\n\n![A448827_1_En_3_Fig37_HTML.jpg](img/A448827_1_En_3_Fig37_HTML.jpg)\n\
  \n图 3-37.\n\n设置图表的颜色和透明度属性\n\n```\ny = x\n# 颜色\nax1 = plt.subplot(321)\nplt.plot(x,y,color='green')\n\
  ax1.set_title('线条颜色')\n# 透明度\nax2 = plt.subplot(322,sharex=ax1)\nalpha = plt.plot(x,y)\n\
  alpha[0].set_alpha(0.3)\nax2.set_title('线条透明度')\nplt.setp(ax2.get_yticklabels(),\
  \ visible=False)\n```\n\n类似地，我们还可以使用不同的形状来标记数据点，以及使用不同的样式来绘制线条。在将不同属性/类别表示在同一张图表上时，这些选项会非常有用。下面的代码片段及图\
  \ 3-38 所示的输出展示了这一点。\n\n![A448827_1_En_3_Fig38_HTML.jpg](img/A448827_1_En_3_Fig38_HTML.jpg)\n\
  \n图 3-38.\n\n设置图表的标记点和线条样式属性\n\n```\n# 标记点\n# 标记点 -> '+', 'o', '*', 's', ',', '.',\
  \ 等\nax3 = plt.subplot(323,sharex=ax1)\nplt.plot(x,y,marker='*')\nax3.set_title('点标记')\n\
  # 线条样式\n# 线条样式 -> '-','--','-.', ':', 'steps'\nax4 = plt.subplot(324,sharex=ax1)\n\
  plt.plot(x,y,linestyle='--')\nax4.set_title('线条样式')\nplt.setp(ax4.get_yticklabels(),\
  \ visible=False)\n```\n\n尽管还有更多微调选项可用，但我们鼓励您查阅文档以获取详细信息。我们以最后两个技巧来结束格式化部分：线条宽度以及一种可以快速完成所有设置的简写符号，如下面的代码片段所示。\n\
  \n```\n# 线条宽度\nax5 = plt.subplot(325,sharex=ax1)\nline = plt.plot(x,y)\nline[0].set_linewidth(3.0)\n\
  ax5.set_title('线条宽度')\n# 组合线条样式\nax6 = plt.subplot(326,sharex=ax1)\nplt.plot(x,y,'b^')\n\
  ax6.set_title('样式简写')\nplt.setp(ax6.get_yticklabels(), visible=False)\n```\n\n此代码片段使用\
  \ `plot()` 函数返回的线条对象来设置线条宽度。代码片段的第二部分展示了使用简写符号 `b^` 一次性设置线条颜色和数据点标记。图 3-39 所示的输出有助于展示此效果。\n\
  \n![A448827_1_En_3_Fig39_HTML.jpg](img/A448827_1_En_3_Fig39_HTML.jpg)\n\n图 3-39.\n\
  \n展示线条宽度和简写符号的示例\n\n#### 图例\n\n图例是一种键，有助于将颜色/形状或其他属性映射到图表所可视化的不同属性。虽然在大多数情况下，`matplotlib`\
  \ 在准备和显示图例方面做得非常出色，但有时我们需要更精细的控制。\n\n图表的图例可以通过 `legend()` 函数进行控制，该函数可直接通过 `pyplot`\
  \ 模块使用。我们可以通过此函数设置位置、大小和其他格式化属性。以下示例展示了将图例放置在最佳位置。\n\n![A448827_1_En_3_Fig40_HTML.jpg](img/A448827_1_En_3_Fig40_HTML.jpg)\n\
  \n图 3-40.\n\n带有图例的示例图表\n\n```\nplt.plot(x,y,'g',label='y=x²')\nplt.plot(x,z,'b:',label='y=x')\n\
  plt.legend(loc=\"best\")\nplt.title('图例示例')\n```\n\n`matplotlib` 的主要目标之一是提供达到出版质量的图表。`Matplotlib`\
  \ 支持 `LaTEX` 样式的图例格式化，以清晰地显示数学符号和公式。`$` 符号用于标记 `LaTEX` 样式格式化的开始和结束。下面的代码片段和输出图（见图\
  \ 3-41）展示了这一点。\n\n![A448827_1_En_3_Fig41_HTML.jpg](img/A448827_1_En_3_Fig41_HTML.jpg)\n\
  \n图 3-41.\n\n带有 LaTEX 格式化图例的示例图表\n\n```\n# 带有 LaTEX 格式的图例\nplt.plot(x,y,'g',label='$y\
  \ = x²$')\nplt.plot(x,z,'b:',linewidth=3,label='$y = x²$')\nplt.legend(loc=\"best\"\
  ,fontsize='x-large')\nplt.title('带有 $LaTEX$ 格式的图例')\n```\n\n\n\n#### 坐标轴控制\n\n`matplotlib`\
  \ 的另一个功能是能够控制绘图的 x 轴和 y 轴。除了使用 `set_xlabel()` 和 `set_ylabel()` 方法设置轴标签和颜色等基本功能外，还可以进行更精细的控制。我们先来看看如何添加辅助\
  \ y 轴。在很多场景下，我们需要在同一张图上绘制与不同特征（数值尺度不同）相关的数据。为了正确理解，通常将两个特征放在不同的 y 轴上（每个轴缩放到各自的范围内）会有所帮助。要获取额外的\
  \ y 轴，我们使用通过 `axes` 对象暴露的 `twinx()` 函数。以下代码片段概述了这种情况。\n\n```\n## 坐标轴控制\n# 辅助 y 轴\n\
  fig, ax1 = plt.subplots()\nax1.plot(x,y,'g')\nax1.set_ylabel(r\"主 y 轴\", color=\"\
  green\")\nax2 = ax1.twinx()\nax2.plot(x,z,'b:',linewidth=3)\nax2.set_ylabel(r\"\
  辅助 y 轴\", color=\"blue\")\nplt.title('辅助 Y 轴')\n```\n\n起初，使用名为 `twinx()` 的函数来生成辅助\
  \ y 轴可能听起来很奇怪。巧妙的是，`matplotlib` 有这样的函数是为了指出这样一个事实：额外的 y 轴将共享同一个 x 轴，因此命名为 `twinx()`。同理，使用\
  \ `twiny()` 函数可以获得额外的 x 轴。输出图如图 3-42 所示。\n\n![A448827_1_En_3_Fig42_HTML.jpg](img/A448827_1_En_3_Fig42_HTML.jpg)\n\
  \n图 3-42.\n\n带有辅助 y 轴的示例图\n\n默认情况下，`matplotlib` 会识别所绘制数据的范围，并调整 x 轴和 y 轴的刻度及范围。它还提供了通过\
  \ `axis()` 函数手动设置这些值的能力。通过此函数，我们可以使用预定义的关键字（如 `tight`、`scaled` 和 `equal`）来设置轴范围，也可以传递一个列表，使其标记值为\
  \ [xmin, xmax, ymin, ymax]。以下代码片段展示了如何手动调整轴范围。\n\n```\n# 手动\ny = np.log(x)\nz =\
  \ np.log2(x)\nw = np.log10(x)\nplt.plot(x,y,'r',x,z,'g',x,w,'b')\nplt.axis([0,2,-1,2])\n\
  plt.title('手动轴范围')\n```\n\n图 3-43 中的输出展示了左侧未进行任何轴调整生成的图，而右侧则显示了前一个代码片段中所做的轴调整。\n\
  \n![A448827_1_En_3_Fig43_HTML.jpg](img/A448827_1_En_3_Fig43_HTML.jpg)\n\n图 3-43.\n\
  \n展示默认轴和手动调整轴的图\n\n现在我们已经了解了如何设置轴范围，接下来将快速介绍如何手动设置刻度或轴标记。对于轴刻度，我们有两个独立的函数可用，一个用于设置刻度的范围，另一个用于设置刻度标签。这两个函数直观地命名为\
  \ `set_ticks()` 和 `set_ticklabels()`。在下面的示例中，我们为 x 轴设置要标记的刻度，而对于 y 轴，我们使用相应的函数同时设置刻度范围和标签。\n\
  \n```\n# 手动刻度\nplt.plot(x, y)\nax = plt.gca()\nax.xaxis.set_ticks(np.arange(-2,\
  \ 2, 1))\nax.yaxis.set_ticks(np.arange(0, 5))\nax.yaxis.set_ticklabels([\"min\"\
  , 2, 4, \"max\"])\nplt.grid(True)\nplt.title(\"x 轴上的手动刻度\")\n```\n\n输出是一个 x 轴标签仅标记在\
  \ -2 到 1 之间，而 y 轴范围为 0 到 5 且标签已手动更改的图。输出图如图 3-44 所示。\n\n![A448827_1_En_3_Fig44_HTML.jpg](img/A448827_1_En_3_Fig44_HTML.jpg)\n\
  \n图 3-44.\n\n展示带有手动刻度的坐标轴的图\n\n在我们进入下一组功能/特性之前，值得注意的是，使用 `matplotlib`，除了手动设置（如前所述）之外，我们还可以根据数据范围以标准方式缩放坐标轴。以下是一个快速代码片段，用于在对数刻度上缩放\
  \ y 轴。输出如图 3-45 所示。\n\n![A448827_1_En_3_Fig45_HTML.jpg](img/A448827_1_En_3_Fig45_HTML.jpg)\n\
  \n图 3-45.\n\n展示对数缩放 y 轴的图\n\n```\n# 缩放\nplt.plot(x, y)\nax = plt.gca()\n# 值: log,\
  \ logit, symlog\nax.set_yscale(\"log\")\nplt.grid(True)\nplt.title(\"对数缩放轴\")\n\
  ```\n\n#### 注释\n\n`pyplot` 模块中的 `text()` 接口暴露了 `matplotlib` 的注释功能。我们可以使用此接口注释图形/绘图/子图的任何部分。它接受\
  \ x 和 y 坐标、要显示的文本、对齐方式和字体大小参数作为输入，以将注释放置在绘图上的所需位置。以下代码片段注释了抛物线图的最小值。\n\n```\n# 注释\n\
  y = x**2\nmin_x = 0\nmin_y = min_x**2\nplt.plot(x, y, \"b-\", min_x, min_y, \"ro\"\
  )\nplt.axis([-10,10,-25,100])\nplt.text(0, 60, \"抛物线\\n$y = x²$\", fontsize=15,\
  \ ha=\"center\")\nplt.text(min_x, min_y+2, \"最小值\", ha=\"center\")\nplt.text(min_x,\
  \ min_y-6, \"(%0.1f, %0.1f)\"%(min_x, min_y), ha='center',color='gray')\nplt.title(\"\
  带注释的图\")\n```\n\n`text()` 接口提供了更多功能和格式化特性。建议您查阅官方文档和示例以了解详细信息。展示带注释抛物线的输出图如图 3-46\
  \ 所示。\n\n![A448827_1_En_3_Fig46_HTML.jpg](img/A448827_1_En_3_Fig46_HTML.jpg)\n\n\
  图 3-46.\n\n展示注释的图\n\n#### 全局参数\n\n为了保持一致性，我们通常尝试在整个可视化故事中保持绘图大小、字体和颜色相同。设置每个这些属性会增加代码库维护的复杂性和难度。为了克服这些问题，我们可以全局设置格式化设置，如下面的代码片段所示。\n\
  \n```\n# 全局格式化参数\nparams = {'legend.fontsize': 'large',\n'figure.figsize': (10,\
  \ 10),\n'axes.labelsize': 'large',\n'axes.titlesize':'large',\n'xtick.labelsize':'large',\n\
  'ytick.labelsize':'large'}\nplt.rcParams.update(params)\n```\n\n一旦使用 `rcParams.update()`\
  \ 设置，`params` 字典中提供的属性将应用于生成的每个绘图。建议您应用这些设置并重新生成本节讨论的图，以了解差异。\n\n### Python 可视化生态系统\n\
  \n毫无疑问，`matplotlib` 库是一个非常强大且流行的可视化/绘图库。它提供了绘制任何类型数据所需的大部分工具和技巧，并且能够控制最细微的元素。\n\n\
  然而，即使是专业用户，`matplotlib` 也还有很多可以改进的地方。作为一个低级 API，它需要大量的样板代码，交互性有限，并且样式和其他格式化默认值看起来有些过时。\n\
  \n为了解决这些问题并提供高级接口以及与当前 Python 生态系统协同工作的能力，Python 领域有相当多的可视化库可供选择。一些最流行和强大的库包括 `bokeh`、`seaborn`、`ggplot`\
  \ 和 `plotly`。这些库中的每一个都建立在 `matplotlib` 的理解和功能集之上，同时提供自己的一套功能和易于使用的包装器来弥补差距。\n\n\
  建议您探索这些库并了解它们的差异。我们将在后续章节中根据需要介绍其中的一些。尽管不同，但大多数库都基于与 `matplotlib` 相似的概念，因此如果您精通\
  \ `matplotlib`，学习曲线会更短。\n\n\n\n## 总结\n\n本章涵盖了理解、处理和数据整理方面的诸多内容。我们介绍了平面文件（CSV、JSON、XML、HTML\
  \ 等）等主要数据格式，并使用标准库来提取/收集数据。我们简要介绍了标准数据类型及其在整个数据科学过程中的重要性。本章的主要部分涵盖了数据整理任务，包括转换、清理和处理数据，使其成为可用的形式。虽然这些技术是使用\
  \ `pandas` 库进行讲解的，但其概念具有通用性，适用于大多数数据科学相关的用例。你可以将这些技术作为参考，它们可以轻松地使用不同的库和编程/脚本语言来实现。我们使用示例数据集绘制了主要图表，并描述了它们的用法。我们还介绍了\
  \ `matplotlib` 的基础知识和强大技巧。我们强烈建议你阅读参考资料以深入理解。本章涵盖了 CRISP DM 模型中数据收集、处理和可视化的初始步骤。在接下来的章节中，我们将基于这些概念，并将其应用于解决特定的现实世界问题。敬请期待！\n\
  \n"
- '# 4. 特征工程与选择


  构建机器学习系统和流水线需要付出巨大的努力，这一点从你在前几章中获得的知识中可见一斑。在第一章中，我们介绍了一些构建机器学习流水线的高级架构。从数据到洞察和信息的过程并非易事，也非一蹴而就。它既困难又具有迭代性，需要数据科学家和分析师多次重复多个步骤，才能找到完美的模型并得出正确的洞察。机器学习算法的一个局限性在于，它们只能将数值作为输入来理解。这是因为，在任何算法的核心，通常都有多个数学方程、约束条件、优化和计算。因此，我们几乎不可能将原始数据直接输入任何算法并期望得到结果。这就是特征和属性在基于数据构建模型时极其有用的原因。


  构建机器智能是一个多层次、多方面的过程。在本书中，到目前为止，我们已经探讨了如何检索、处理、整理和可视化数据。探索性数据分析和可视化是更好地理解数据的第一步。理解数据涉及理解包含数据的完整范围，包括领域、约束、注意事项、质量和可用属性。从第
  3 章中，你可能还记得数据由多个字段、属性或变量组成。每个属性本身就是数据的一个固有特征。然后，你可以从这些固有特征中推导出更多特征，而这本身就构成了特征工程的主要部分。特征选择是与特征工程相辅相成的另一项重要任务，数据科学家的任务是选择最佳的特征和属性子集，以帮助构建正确的模型。


  这里需要记住的一个重要点是，特征工程和选择不是一个可以临时进行的、一次性的过程。构建机器学习系统的本质是迭代的（遵循 CRISP-DM 原则），因此从数据集中提取和工程化特征并非一次性任务。每次构建模型时，你可能都需要提取新特征并尝试多种选择，以便为你的问题找到最佳和最合适的模型。数据科学家通常将数据处理和特征工程描述为构建任何机器学习系统中最困难的任务或步骤。由于既需要领域知识又需要数学变换，特征工程常被认为既是一门艺术，也是一门科学。显而易见的复杂性涉及处理不同类型的数据和变量。除此之外，每个机器学习问题或任务都需要特定的特征，在特征工程中不存在“一刀切”的解决方案。这使得特征工程更加困难和复杂。


  因此，我们在本章中采用了一种适当的结构化方法，涵盖了特征工程工作流程中的以下三个主要领域。它们如下所述。


  *   特征提取与工程

  *   特征缩放

  *   特征选择


  本章涵盖了上述所有三个主要领域的基本概念。将详细介绍针对多种数据类型（包括数值型、类别型、时间型、文本和图像数据）的特征工程技术。我们要感谢我们的好朋友兼数据科学家
  Gabriel Moreira，他帮助我们出色地整理了这些不同数据类型的特征工程技术。我们还将介绍不同的特征缩放方法，这些方法通常作为特征工程过程的一部分，用于归一化数值，防止高值特征占据不必要的主导地位。还将介绍几种特征选择技术，如过滤法、包装法和嵌入法。技术和概念将辅以足够的动手实践示例和代码片段。请务必查看
  GitHub 仓库中第 4 章下的相关代码，地址为 [`https://github.com/dipanjanS/practical-machine-learning-with-python`](https://github.com/dipanjanS/practical-machine-learning-with-python)，其中包含必要的代码、笔记本和数据。这将使事情更容易理解，帮助你获得足够的知识，了解在哪种场景下应该使用哪种技术，从而帮助你开启自己的特征工程之旅，以构建机器学习模型！


  ## 特征：更好地理解你的数据


  任何机器学习模型的本质都由两个部分组成，即数据和算法。你可能还记得我们在第 1 章中介绍的机器学习范式。任何机器学习算法本质上都是数学函数、方程和优化的组合，这些通常会根据需要与业务逻辑相结合。这些算法通常不够智能，无法处理原始数据并从中发现用于训练系统的潜在模式。因此，我们需要更好的数据表示来构建机器学习模型，这些表示也称为数据特征或属性。让我们在本节中了解一些与数据和特征相关的重要概念。




  ### 数据与数据集


  数据对于分析和机器学习至关重要。没有数据，我们实际上无法实现任何智能系统。数据的正式定义是：基于观测结果，包含定性和/或定量变量值的集合或集。通常，数据是通过各种观测进行测量和收集的。然后，这些数据以其原始形式存储，之后可以根据需要进一步处理和分析。通常，在任何分析或机器学习系统中，您可能需要多个数据源，并且来自一个组件的处理后的数据可以作为原始数据输入到另一个组件进行进一步处理。数据可以是结构化的，具有明确的表示观测值和属性的行和列；也可以是非结构化的，例如自由文本数据。


  数据集可以定义为数据的集合。这通常指以平面文件（如 CSV 文件或 MS Excel 文件）、关系数据库表或视图，甚至是原始数据二维矩阵形式存在的数据。`scikit-learn`
  包中提供了在机器学习中非常流行的样本数据集，以便快速入门。`sklearn.datasets` 模块提供了这些现成的样本数据集以及其他与加载和处理数据集相关的实用程序。您可以通过此链接
  [`http://scikit-learn.org/stable/datasets/index.html#datasets`](http://scikit-learn.org/stable/datasets/index.html#datasets)
  了解更多关于玩具数据集以及处理和加载数据的最佳实践。另一个流行的机器学习数据集资源是加州大学欧文分校（UCI）机器学习库，可在此处找到 [`http://archive.ics.uci.edu/ml/index.php`](http://archive.ics.uci.edu/ml/index.php)，其中包含来自现实世界问题、场景和设备的各种数据集。事实上，流行的机器学习和预测分析竞赛平台
  Kaggle 也提供了一些来自 UCI 的数据集以及与各种竞赛相关的其他数据集。请随意查看这些资源，我们将在本章以及后续章节中实际使用其中的一些数据集。


  ### 特征


  原始数据很少直接用于构建机器学习模型，主要是因为算法无法处理未经适当处理和整理成所需格式的数据。特征是原始数据中获得的属性或特性。每个特征都是原始数据之上的一种特定表示。通常，每个特征都是一个独立的可测量属性，通常由二维数据集中的一列表示。每个观测值由一行表示，并且每个特征对于某个观测值都有一个特定的值。因此，每一行通常表示一个特征向量，而所有观测值中的整个特征集形成一个二维特征矩阵，也称为特征集。特征对于构建机器学习模型极其重要，每个特征都代表了模型所使用的数据中的特定表示和信息块。特征的质量和数量都会影响模型的性能。


  根据数据集，特征可以分为两大类型。固有原始特征是直接从数据集中获得的，无需额外的数据操作或工程处理。派生特征通常是我们通过特征工程从现有数据属性中提取特征而获得的。一个简单的例子是，从包含出生日期的员工数据集中，通过从当前日期减去出生日期来创建一个新的特征“年龄”。下一主要部分将详细介绍如何根据不同的数据类型处理、提取和工程化特征。


  ### 模型


  特征是底层原始数据的更好表示，它们作为任何机器学习模型的输入。通常，一个模型由数据特征、可选的用于监督学习的类别标签或数值响应，以及一个机器学习算法组成。算法是根据我们想要解决的问题类型（在将其转化为特定的机器学习任务之后）来选择的。模型是在系统上对数据特征进行迭代训练，直到达到期望的性能后才构建完成的。因此，模型基本上用于表示数据中各种特征之间的关系。


  通常，建模过程涉及多个主要步骤。模型构建侧重于在数据特征上训练模型。模型调优和优化涉及调整特定的模型参数（称为超参数）并优化模型以获得最佳模型。模型评估涉及使用标准性能评估指标（如准确率）来评估模型性能。模型部署通常是最后一步，一旦我们选择了最合适的模型，就将其部署到生产环境中，这通常涉及基于
  CRISP-DM 方法论围绕该模型构建整个系统。第 5 章将进一步详细讨论这些方面。


