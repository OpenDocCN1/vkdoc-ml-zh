  ##### 连接数据框


  大多数数据科学项目的数据都来自多个数据源。这些数据源中的数据大多以某种方式相互关联，数据分析的后续步骤需要将它们连接或合并起来。`Pandas` 提供了丰富的函数，允许我们合并不同的数据源。我们只介绍其中一小部分方法。在本节中，我们将探索并学习两种可用于执行各种数据框合并操作的方法。


  ###### 使用 concat 方法进行连接


  在 `pandas` 中连接不同数据框的第一种方法是使用 `concat` 方法。通过调整 `concat` 方法的参数，可以实现数据框上的大部分连接操作。让我们看几个例子来理解
  `concat` 方法的工作原理。


  最简单的连接场景是当我们有同一个数据框的多个片段时（如果你是从流中或分块读取数据，就可能出现这种情况）。在这种情况下，我们可以直接将组成数据框提供给 `concat`
  函数，如下所示。


  ```

  In [25]: city_data1 = city_data.sample(3)

  In [26]: city_data2 = city_data.sample(3)

  In [29]: city_data_combine = pd.concat([city_data1,city_data2])

  In [30]: city_data_combine

