  Total params: 20,024,384\nTrainable params: 20,024,384\nNon-trainable params: 0\n\
  _________________________________________________________________\n```\n\n从上面的输出可以看出，该架构非常庞大，包含很多层。图\
  \ 12-4 以更易于理解的视觉方式描绘了所有层。请记住，我们不使用图 12-4 最右侧描绘的全连接层。我们建议阅读由牛津大学工程科学系视觉几何组的 [Karen\
  \ Simonyan](https://arxiv.org/find/cs/1/au:+Simonyan_K/0/1/0/all/0/1) 和 [Andrew\
  \ Zisserman](https://arxiv.org/find/cs/1/au:+Zisserman_A/0/1/0/all/0/1) 撰写的论文《用于大规模图像识别的深度卷积网络》。该论文可在\
  \ [`https://arxiv.org/abs/1409.1556`](https://arxiv.org/abs/1409.1556) 获取，并详细讨论了这些模型的架构。\n\
  \n![A448827_1_En_12_Fig4_HTML.jpg](img/A448827_1_En_12_Fig4_HTML.jpg)\n\n图 12-4.\n\
  \nVGG-19 架构的视觉描绘\n\n加载 `CIFAR10` 训练和测试数据集的方法与上一节讨论的相同。我们也对标签执行类似的独热编码。由于 VGG19 模型是在没有最终全连接层的情况下加载的，模型的\
  \ `predict(...)` 函数帮助我们获取数据集上的提取特征。以下代码片段提取了训练和测试数据集的特征。\n\n```\nIn [2]: bottleneck_features_train\
  \ = vgg_model.predict(x_train, verbose=1)\n...: bottleneck_features_test = vgg_model.predict(x_test,\
  \ verbose=1)\n```\n\n这些特征被广泛称为瓶颈特征，因为输入数据点的总体积有所减少。值得探索模型摘要以了解 VGG 模型如何转换数据。此阶段的输出（瓶颈特征）将用作我们接下来要构建的分类器的输入。以下代码片段构建了一个简单的全连接两层分类器。\n\
  \n```\nIn [3]: clf_model = Sequential()\n...: clf_model.add(Flatten(input_shape=bottleneck_features_train.shape[1:]))\n\
  ...: clf_model.add(Dense(512, activation='relu'))\n...: clf_model.add(Dropout(0.5))\n\
  ...: clf_model.add(Dense(256, activation='relu'))\n...: clf_model.add(Dropout(0.5))\n\
  ...: clf_model.add(Dense(num_classes, activation='softmax'))\n...: clf_model.compile(loss=keras.losses.categorical_crossentropy,\n\
  optimizer=keras.optimizers.Adadelta(),\nmetrics=['accuracy'])\n```\n\n模型的输入层匹配瓶颈特征的维度（原因显而易见）。与我们从头构建的\
  \ CNN 模型一样，该模型也有一个带有 `softmax` 激活函数的密集输出层。与训练完整的 `VGG19` 相比，训练此模型相当简单且快速，如下面的代码片段所示。\n\
  \n```\nIn [4]: clf_model.fit(bottleneck_features_train, y_train, batch_size=batch_size,\n\
  ...:               epochs=epochs, verbose=1)\nEpoch 1/50\n50000/50000 [==============================]\
  \ - 8s - loss: 7.2495 - acc: 0.2799\nEpoch 2/50\n50000/50000 [==============================]\
  \ - 7s - loss: 2.2513 - acc: 0.2768\nEpoch 3/50\n50000/50000 [==============================]\
  \ - 7s - loss: 1.9096 - acc: 0.3521\n...\nEpoch 48/50\n50000/50000 [==============================]\
  \ - 8s - loss: 0.9368 - acc: 0.6814\nEpoch 49/50\n50000/50000 [==============================]\
  \ - 8s - loss: 0.9223 - acc: 0.6832\nEpoch 50/50\n50000/50000 [==============================]\
  \ - 8s - loss: 0.9197 - acc: 0.6830\n```\n\n我们可以添加钩子，根据提前停止标准等来提前停止训练。但现在，我们保持简单。本节完整代码可在笔记本\
  \ `notebook_pretrained_cnn_cifar10_classifier.ipynb` 中找到。总体而言，我们在训练数据集上达到了 68% 的准确率，在测试数据集上达到了约\
  \ 64% 的准确率。\n\n现在你将看到这个基于预训练模型构建的分类器在测试数据集上的性能。以下代码片段展示了一个实用函数，该函数将测试数据集中图像的索引号作为输入，并比较实际标签和预测标签。\n\
  \n```\ndef predict_label(img_idx,show_proba=True):\nplt.imshow(x_test[img_idx],aspect='auto')\n\
  plt.title(\"Image to be Labeled\")\nplt.show()\nprint(\"Actual Class:{}\".format(np.nonzero(y_test[img_idx])[0][0]))\n\
  test_image =np.expand_dims(x_test[img_idx], axis=0)\nbf = vgg_model.predict(test_image,verbose=0)\n\
  pred_label = clf_model.predict_classes(bf,batch_size=1,verbose=0)\nprint(\"Predicted\
  \ Class:{}\".format(pred_label[0]))\nif show_proba:\nprint(\"Predicted Probabilities\"\
  )\nprint(clf_model.predict_proba(bf))\n```\n\n以下是 `predict_label(...)` 函数在测试数据集中的几张图像上测试时的输出。如图\
  \ 12-5 所示，我们正确预测了图像属于类别标签 5（狗）和 9（卡车）！\n\n![A448827_1_En_12_Fig5_HTML.jpg](img/A448827_1_En_12_Fig5_HTML.jpg)\n\
  \n图 12-5.\n\n基于预训练 CNN 的分类器预测的标签\n\n本节展示了迁移学习的强大功能和优势。无需花费时间重新发明轮子，只需几行代码，我们就能够利用最先进的神经网络完成我们的分类任务。\n\
  \n迁移学习的概念构成了神经风格迁移的基础，我们将在下一节中讨论。\n\n使用 CNN 进行艺术风格迁移\n\n绘画（或就此而言的任何艺术形式）需要少数人掌握的特殊技能。绘画呈现出内容与风格的复杂相互作用。而照片则是视角与光线的结合。当两者结合时，结果令人惊叹且出乎意料。图\
  \ 12-6 展示了这样一个例子。\n\n![A448827_1_En_12_Fig6_HTML.jpg](img/A448827_1_En_12_Fig6_HTML.jpg)\n\
  \n图 12-6.\n\n左图：描绘德国图宾根内卡河畔的原始照片。右图：为相应生成图像提供风格的画作（插图：文森特·梵高的《星月夜》）。来源：A Neural\
  \ Algorithm of Artistic Style, Gatys et al. (arXiv:1508.06576v2)\n\n图 12-6 中的结果展示了如何将一幅画作（梵高的《星月夜》）的风格迁移到一张内卡河畔的照片上。乍一看，这个过程似乎从照片中提取了内容，从画作中提取了风格、色彩和笔触模式，并生成了最终结果。结果令人惊叹，但更令人惊讶的是，这是如何做到的？\n\
  \n图 12-6 展示了一个称为艺术风格迁移的过程。该过程是 Gatys 等人研究的成果，并在他们的论文《A Neural Algorithm for Artistic\
  \ Style》中提出。在本节中，我们从实现的角度讨论这篇论文的细节，并看看如何自己执行这项技术。\n\n注意\n\n Prisma 是一款使用基于卷积神经网络的**艺术风格迁移**技术将照片转化为艺术作品的应用程序。有关该应用的更多信息，请访问\
  \ [`https://prisma-ai.com/`](https://prisma-ai.com/)。\n\n背景\n\n正式地，神经风格迁移是将参考图像的“风格”应用于特定目标图像的过程，在此过程中，目标图像的原始“内容”保持不变。这里，风格定义为参考图像中存在的颜色、图案和纹理，而内容定义为图像的整体结构和高级组件。\n\
  \n这里的主要目标是保留原始目标图像的内容，同时将参考图像的风格叠加或采用到目标图像上。为了在数学上定义这个概念，考虑三个图像——原始内容（记为 c）、参考风格（记为\
  \ s）和生成图像（记为 g）。因此，我们需要一种方法来衡量图像 c 和 g 在内容上的差异。如果 c 和 g 完全不同，则趋于 0 的函数，否则增长。这可以简洁地表示为损失函数：\n\
  \nL [内容] = distance(c, g)\n\n其中 distance 是像 L2 这样的范数函数。同样，我们可以定义另一个函数来捕捉图像 s 和 g\
  \ 在风格上的差异。换句话说，这可以表示为：\n\nL [风格] = distance(s, g)\n\n因此，对于神经风格迁移的整个过程，我们有一个总体损失函数，可以定义为内容损失函数和风格损失函数的组合。\n\
  \nL [风格迁移] = argmin [g] (αL [内容] (c, g) + βL [风格] (s, g))\n\n其中 α 和 β 是用于控制内容和风格组件对总体损失影响的权重。我们将尝试最小化的损失函数由三部分组成，即内容损失、风格损失和总变差损失，我们稍后将讨论这些。\n\
  \n深度学习的美妙之处在于，通过利用深度卷积神经网络（CNN）等架构，我们可以在数学上定义上述风格和内容函数。我们将使用迁移学习的原理来构建我们的神经风格迁移系统。我们之前介绍了使用预训练深度\
  \ CNN 模型（如 VGG-19）进行迁移学习的概念。我们将利用相同的预训练模型来完成神经风格迁移的任务。主要步骤如下所述。\n\n*   利用 VGG-19\
  \ 帮助计算风格图像、内容图像和生成图像的层激活。\n\n*   使用这些激活来定义前面提到的特定损失函数。\n\n*   最后，使用梯度下降来最小化总体损失。\n\
  \n我们建议你跟随本节，使用名为 `Neural Style Transfer.ipynb` 的笔记本，其中包含风格迁移过程的逐步细节。我们还要特别感谢 François\
  \ Chollet 和 Harish Narayanan 提供了关于风格迁移的一些优秀资源。具体细节将在后面提到。我们还建议你查看以下论文（详细链接将在后面分享）。\n\
  \n*   [Leon A.​ Gatys](https://arxiv.org/find/cs/1/au:+Gatys_L/0/1/0/all/0/1)、[Alexander\
  \ S.​ Ecker](https://arxiv.org/find/cs/1/au:+Ecker_A/0/1/0/all/0/1) 和 [Matthias\
  \ Bethge](https://arxiv.org/find/cs/1/au:+Bethge_M/0/1/0/all/0/1) 的《A Neural Algorithm\
  \ of Artistic Style》\n\n*   [Justin Johnson](https://arxiv.org/find/cs/1/au:+Johnson_J/0/1/0/all/0/1)、[Alexandre\
  \ Alahi](https://arxiv.org/find/cs/1/au:+Alahi_A/0/1/0/all/0/1) 和 [Li Fei-Fei](https://arxiv.org/find/cs/1/au:+Fei_Fei_L/0/1/0/all/0/1)\
  \ 的《Perceptual Losses for Real-Time Style Transfer and Super-Resolution》\n\n预处理\n\
  \n实现此类网络的首要步骤是预处理数据（在本例中为图像）。以下是用于调整图像大小和通道的快速预处理工具。\n\n```\nimport numpy as np\n\
  from keras.applications import vgg19\nfrom keras.preprocessing.image import load_img,\
  \ img_to_array\ndef preprocess_image(image_path, height=None, width=None):\nheight\
  \ = 400 if not height else height\nwidth = width if width else int(width * height\
  \ / height)\nimg = load_img(image_path, target_size=(height, width))\nimg = img_to_array(img)\n\
  img = np.expand_dims(img, axis=0)\nimg = vgg19.preprocess_input(img)\nreturn img\n\
  def deprocess_image(x):\n```\n\n\n# 通过均值像素去除零中心化\nx[:, :, 0] += 103.939\nx[:, :,\
  \ 1] += 116.779\nx[:, :, 2] += 123.68\n\n# 'BGR'->'RGB'\nx = x[:, :, ::-1]\nx =\
  \ np.clip(x, 0, 255).astype('uint8')\nreturn x\n```\n\n由于我们需要编写自定义损失函数和操作例程，因此需要定义某些占位符。Keras\
  \ 是一个高级库，它利用张量操作后端（如 `tensorflow`、`theano` 和 `CNTK`）来执行繁重的工作。因此，这些占位符提供了高级抽象，以便与底层张量对象协同工作。以下代码片段为风格图像、内容图像和生成图像以及神经网络的输入张量准备了占位符。\n\
  \n```\nIn [1]: # 这是你想要转换的图像路径。\n...: TARGET_IMG = 'data/city_road.jpg'\n...: # 这是风格图像的路径。\n\
  ...: REFERENCE_STYLE_IMG = 'data/style2.png'\n...:\n...: width, height = load_img(TARGET_IMG).size\n\
  ...: img_height = 320\n...: img_width = int(width * img_height / height)\n...:\n\
  ...:\n...: target_image = K.constant(preprocess_image(TARGET_IMG,\n...:        \
  \                                         height=img_height,\n...:             \
  \                                    width=img_width))\n...: style_image = K.constant(preprocess_image(REFERENCE_STYLE_IMG,\n\
  ...:                                                 height=img_height,\n...:  \
  \                                               width=img_width))\n...:\n...: #\
  \ 我们生成图像的占位符\n...: generated_image = K.placeholder((1, img_height, img_width, 3))\n\
  ...:\n...: # 将三张图像合并为一个批次\n...: input_tensor = K.concatenate([target_image,\n...:\
  \                                 style_image,\n...:                           \
  \      generated_image], axis=0)\n```\n\n我们将像上一节那样加载预训练的 VGG-19 模型，即不包含顶部的全连接层。唯一的区别在于，我们需要向模型构造函数提供输入张量的尺寸维度。以下代码片段获取了预训练模型。\n\
  \n```\nIn [2]: model = vgg19.VGG19(input_tensor=input_tensor,\n...:            \
  \             weights='imagenet',\n...:                         include_top=False)\n\
  ```\n\n你可以使用 `summary()` 函数来了解预训练模型的架构。\n\n损失\n函数\n\n正如背景小节中所讨论的，神经风格迁移问题的核心在于内容损失函数和风格损失函数。在本小节中，我们将讨论并定义所需的损失函数。\n\
  \n内容损失\n\n在任何基于 CNN 的模型中，来自顶层激活包含更多全局和抽象信息（如人脸等高级结构），而底层则包含关于图像的局部信息（如眼睛、鼻子、边缘和角落等低级结构）。我们希望利用\
  \ CNN 的顶层来捕获图像内容的正确表征。\n\n因此，对于内容损失，考虑到我们将使用预训练的 VGG-19 CNN，我们可以将损失函数定义为：在目标图像上计算的顶层（提供特征表征）激活与在生成图像上计算的同一层激活之间的\
  \ L2 范数（缩放并平方后的欧几里得距离）。假设我们通常从 CNN 的顶层获得与图像内容相关的特征表征，那么生成的图像预计将与基础目标图像相似。以下代码片段展示了计算内容损失的函数。\n\
  \n```\ndef content_loss(base, combination):\nreturn K.sum(K.square(combination -\
  \ base))\n```\n\n风格损失\n\n关于神经风格迁移的原始论文——Gatys 等人所著的《一种艺术风格的神经算法》——利用了 CNN 中的多个卷积层（而非单个层），从参考风格图像中提取有意义的模式和表征，这些表征捕获了与外观或风格相关的信息，且跨越所有空间尺度，与图像内容无关。\n\
  \n遵循原始论文的思路，我们将利用 Gram 矩阵，并在卷积层生成的特征表征上计算该矩阵。Gram 矩阵计算任意给定卷积层中产生的特征图之间的内积。内积项与相应特征集的协方差成正比，因此能够捕获某一层中倾向于共同激活的特征之间的相关性模式。这些特征相关性有助于捕获特定空间尺度上模式的相关聚合统计信息，这些统计信息对应于风格、纹理和外观，而非图像中的组成部分和物体。\n\
  \n因此，风格损失被定义为参考风格图像与生成图像的 Gram 矩阵之差的缩放并平方后的 Frobenius 范数。最小化此损失有助于确保参考风格图像中不同空间尺度上的纹理在生成图像中相似。\n\
  \n因此，以下代码片段定义了一个基于 Gram 矩阵计算的风格损失函数。\n\n```\ndef style_loss(style, combination,\
  \ height, width):\ndef build_gram_matrix(x):\nfeatures = K.batch_flatten(K.permute_dimensions(x,\
  \ (2, 0, 1)))\ngram_matrix = K.dot(features, K.transpose(features))\nreturn gram_matrix\n\
  S = build_gram_matrix(style)\nC = build_gram_matrix(combination)\nchannels = 3\n\
  size = height * width\nreturn K.sum(K.square(S - C)) / (4\\. * (channels ** 2) *\
  \ (size ** 2))\n```\n\n总变差损失\n\n人们观察到，仅优化风格损失和内容损失会导致输出图像高度像素化和充满噪声。为了解决这个问题，引入了总变差损失。\n\
  \n总变差损失类似于正则化损失。引入它是为了确保生成图像的空间连续性和平滑性，避免产生噪声过多或过度像素化的结果。该损失在以下函数中定义。\n\n```\ndef\
  \ total_variation_loss(x):\na = K.square(\nx[:, :img_height - 1, :img_width - 1,\
  \ :] - x[:, 1:, :img_width - 1, :])\nb = K.square(\nx[:, :img_height - 1, :img_width\
  \ - 1, :] - x[:, :img_height - 1, 1:, :])\nreturn K.sum(K.pow(a + b, 1.25))\n```\n\
  \n总体损失函数\n\n在定义了神经风格迁移总体损失函数的各个组成部分之后，下一步是将这些构建块组合起来。由于 CNN 在网络的不同深度捕获内容和风格信息，我们需要在适当的层上为每种类型的损失应用并计算损失。利用\
  \ Gatys 等人和 Johnson 等人在各自论文中的见解和研究，我们定义了以下实用函数，用于从 VGG-19 模型中识别内容层和风格层。尽管 Johnson\
  \ 等人利用 VGG-16 模型以获得更快更好的性能，但为了便于理解和跨运行的一致性，我们仍局限于使用 VGG-19 模型。\n\n```\n\n# 定义函数，根据源论文设置层\n\
  def set_cnn_layers(source='gatys'):\nif source == 'gatys':\n\n# 来自 Gatys 等人的配置\n\
  content_layer = 'block5_conv2'\nstyle_layers = ['block1_conv1', 'block2_conv1',\
  \ 'block3_conv1',\n'block4_conv1', 'block5_conv1']\nelif source == 'johnson':\n\n\
  # 来自 Johnson 等人的配置\ncontent_layer = 'block2_conv2'\nstyle_layers = ['block1_conv2',\
  \ 'block2_conv2', 'block3_conv3',\n'block4_conv3', 'block5_conv3']\nelse:\n\n\n\n\
  # 默认使用 Gatys 配置\ncontent_layer = 'block5_conv2'\nstyle_layers = ['block1_conv1',\
  \ 'block2_conv1', 'block3_conv1',\n'block4_conv1', 'block5_conv1']\nreturn content_layer,\
  \ style_layers\n```\n\n以下代码片段\n  随后\n基于从 `set_cnn_layers()` 函数中选择的内容和风格层，应用整体损失函数。\n\
  \n```\nIn [2]: # 加权平均损失函数的权重\n...: content_weight = 0.025\n...: style_weight = 1.0\n\
  ...: total_variation_weight = 1e-4\n...:\n...: # 设置所遵循的源研究论文，并设置内容和风格层\n...: source_paper\
  \ = 'gatys'\n...: content_layer, style_layers = set_cnn_layers(source=source_paper)\n\
  ...:\n...: ## 构建加权损失函数\n...:\n...: # 初始化总损失\n...: loss = K.variable(0.)\n...:\n\
  ...: # 添加内容损失\n...: layer_features = layers[content_layer]\n...: target_image_features\
  \ = layer_features[0, :, :, :]\n...: combination_features = layer_features[2, :,\
  \ :, :]\n...: loss += content_weight * content_loss(target_image_features,\n...:\
  \                                         combination_features)\n...:\n...: # 添加风格损失\n\
  ...: for layer_name in style_layers:\n...: layer_features = layers[layer_name]\n\
  ...: style_reference_features = layer_features[1, :, :, :]\n...: combination_features\
  \ = layer_features[2, :, :, :]\n...: sl = style_loss(style_reference_features, combination_features,\n\
  ...:                 height=img_height, width=img_width)\n...: loss += (style_weight\
  \ / len(style_layers)) * sl\n...:\n...: # 添加总变差损失\n...: loss += total_variation_weight\
  \ * total_variation_loss(generated_image)\n```\n\n自定义优化器\n\n目标是通过优化算法迭代地最小化整体损失。在\
  \ Gatys 等人的论文中，使用 L-BFGS 算法进行优化，这是一种基于**拟牛顿法**的优化算法，广泛用于解决非线性优化问题和参数估计。该方法通常比**标准梯度下降法**收敛更快。`SciPy`\
  \ 在 `scipy.optimize.fmin_l_bfgs_b()` 中提供了实现。然而，其局限性包括该函数仅适用于扁平的一维向量，而非我们正在处理的三维图像矩阵，并且损失函数值和梯度需要作为两个独立的函数传递。\n\
  \n我们基于 `keras` 创建者 François Chollet 遵循的模式构建了一个 `Evaluator` 类，以在一次调用中同时计算损失值和梯度值，而不是进行独立且分离的计算。这将在第一次调用时返回损失值，并缓存梯度以供下一次调用。因此，这比独立计算两者更高效。以下代码片段定义了\
  \ `Evaluator` 类。\n\n```\nclass Evaluator(object):\ndef __init__(self, height=None,\
  \ width=None):\nself.loss_value = None\nself.grads_values = None\nself.height =\
  \ height\nself.width = width\ndef loss(self, x):\nassert self.loss_value is None\n\
  x = x.reshape((1, self.height, self.width, 3))\nouts = fetch_loss_and_grads([x])\n\
  loss_value = outs[0]\ngrad_values = outs[1].flatten().astype('float64')\nself.loss_value\
  \ = loss_value\nself.grad_values = grad_values\nreturn self.loss_value\ndef grads(self,\
  \ x):\nassert self.loss_value is not None\ngrad_values = np.copy(self.grad_values)\n\
  self.loss_value = None\nself.grad_values = None\nreturn grad_values\n```\n\n损失和梯度按如下方式获取。该代码片段还创建了一个\
  \ `Evaluator` 类的对象。\n\n```\nIn [3]: # 获取生成图像相对于损失的梯度\n...: grads = K.gradients(loss,\
  \ generated_image)[0]\n...:\n...: # 获取当前损失和当前梯度值的函数\n...: fetch_loss_and_grads =\
  \ K.function([generated_image], [loss, grads])\n...:\n...: # evaluator 对象\n...:\
  \ evaluator = Evaluator(height=img_height, width=img_width)\n```\n\n风格迁移实战\n\n最后一步是使用所有构建模块，观察风格迁移的实际效果。艺术/风格图像和内容图像可在数据目录中参考。以下代码片段概述了如何评估损失和梯度。我们还会在固定间隔（例如第\
  \ 5、10 次迭代等）后写回输出，以便后续理解神经风格迁移过程如何转换所考虑的图像。\n\n```\nIn [4]: result_prefix = 'style_transfer_result_'+TARGET_IMG.split('.')[0]\n\
  ...: result_prefix = result_prefix+'_'+source_paper\n...: iterations = 20\n...:\n\
  ...: # 在生成图像的像素上运行基于 scipy 的优化（L-BFGS）\n...: # 以最小化神经风格损失。\n...: # 这是我们的初始状态：目标图像。\n\
  ...: # 注意 `scipy.optimize.fmin_l_bfgs_b` 只能处理扁平向量。\n...: x = preprocess_image(TARGET_IMG,\
  \ height=img_height, width=img_width)\n...: x = x.flatten()\n...:\n...: for i in\
  \ range(iterations):\n...:         print('开始迭代', (i+1))\n...:         start_time\
  \ = time.time()\n...:         x, min_val, info = fmin_l_bfgs_b(evaluator.loss, x,\n\
  ...:                                 fprime=evaluator.grads, maxfun=20)\n...:  \
  \       print('当前损失值:', min_val)\n...:         if (i+1) % 5 == 0 or i == 0:\n...:\
  \                 # 每 5 次迭代保存一次当前生成的图像\n...:                 img = x.copy().reshape((img_height,\
  \ img_width, 3))\n...:                 img = deprocess_image(img)\n...:        \
  \         fname = result_prefix + '_at_iteration_%d.png' %(i+1)\n...:          \
  \       imsave(fname, img)\n...:                 print('图像已保存为', fname)\n...:  \
  \       end_time = time.time()\n...:         print('迭代 %d 在 %ds 内完成' % (i+1, end_time\
  \ - start_time))\n```\n\n现在应该很明显，神经风格迁移是一项计算密集型任务。对于所考虑的这组图像，在配备 8GB RAM 的 Intel\
  \ i5 CPU 上，每次迭代耗时 500 到 1000 秒。平均而言，每次迭代大约需要 500 秒，但如果同时运行多个网络，每次迭代可能需要长达 1000 秒。如果使用\
  \ GPU 执行相同操作，您可能会观察到速度提升。以下是部分迭代的输出。我们打印每次迭代的损失和耗时，并在五次迭代后保存图像。\n\n```\n开始迭代 1\n\
  当前损失值: 2.4219e+09\n图像已保存为 style_transfer_result_city_road_gatys_at_iteration_1.png\n\
  迭代 1 在 506s 内完成\n开始迭代 2\n当前损失值: 9.58614e+08\n迭代 2 在 542s 内完成\n开始迭代 3\n当前损失值: 6.3843e+08\n\
  迭代 3 在 854s 内完成\n开始迭代 4\n当前损失值: 4.91831e+08\n迭代 4 在 727s 内完成\n开始迭代 5\n当前损失值: 4.03013e+08\n\
  图像已保存为 style_transfer_result_city_road_gatys_at_iteration_5.png\n迭代 5 在 878s 内完成\n\
  ...\n开始迭代 19\n当前损失值: 1.62501e+08\n迭代 19 在 836s 内完成\n开始迭代 20\n当前损失值: 1.5698e+08\n\
  图像已保存为 style_transfer_result_city_road_gatys_at_iteration_20.png\n迭代 20 在 838s 内完成\n\
  ```\n\n现在您将了解神经风格迁移如何对所考虑的图像发挥作用。请记住，我们为每对风格和内容图像在特定迭代后执行了检查点输出。\n\n注意\n\n我们用于第一张图像的风格，如图\
  \ 12-7 所示，名为 Edtaonisl。这是弗朗西斯·皮卡比亚于 1913 年创作的杰作。通过这幅油画，弗朗西斯·皮卡比亚开创了一种新的视觉语言。有关这幅画的更多详细信息，请访问\
  \ [`http://www.artic.edu/aic/collections/artwork/80062`](http://www.artic.edu/aic/collections/artwork/80062)。\n\
