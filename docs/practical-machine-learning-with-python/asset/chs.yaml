  ## 回归分析


  回归分析是一种统计建模技术，被统计学家和数据科学家广泛使用。它是研究因变量和自变量之间关系的过程。回归本身包含了多种用于建模和分析变量之间关系的技术。它被广泛用于预测分析、预测和时间序列分析。


  因变量或目标变量被估计为自变量或预测变量的函数。这个估计函数被称为回归函数。


  注意


  从非常抽象的意义上讲，回归指的是对连续响应/目标变量的估计，这与分类（估计离散目标）不同。


  身高-体重关系是开始学习回归分析的经典例子。该例子指出，一个人的体重取决于他/她的身高。因此，我们可以构建一个回归函数，在给定一个人身高（自变量）的情况下估计其体重（因变量），前提是我们有足够的训练样本。我们将在下一节对此进行更多讨论。


  回归分析对因变量和自变量之间的关系进行建模。需要牢记的是，因变量和自变量之间的相关性并不意味着因果关系！


  ### 回归的类型


  多年来，已经发展出多种技术来帮助我们执行回归分析。通常，所有回归建模技术都涉及以下内容：


  *   自变量 X

  *   因变量或目标变量 Y

  *   未知参数，记为 `β`


  因此，一个回归函数将这些实体关联起来：


  ![$$ Y=f\left(X,\beta \right) $$](img/A448827_1_En_6_Chapter_Equa.gif)


  函数 `f()` 需要根据可用的数据集来指定或学习。根据手头的数据和用例，以下是常用的回归技术：


  *   **线性回归**：顾名思义，它映射因变量和自变量之间的线性关系。在这种技术中，回归线是一条直线。其目标是使误差（例如，平方误差之和）最小化。

  *   **逻辑回归**：当因变量是二元的（0/1 或 是/否）时，使用此技术。它帮助我们确定二元目标变量的概率。其名称来源于该技术使用的 logit 函数。此技术与分类技术的共同点比与回归技术更多。其目标是最大化观测值的似然。

  *   **非线性回归**：当因变量与自变量呈多项式关系时，即回归函数中自变量的幂次大于 1。它也被称为多项式回归。


  回归技术也可以被分类为非参数方法。


  ### 假设条件


  回归分析有一些通用的假设条件，而特定的分析技术也会增加（或减少）一些假设条件。以下是回归分析的重要通用假设条件：


  *   训练数据集需要能够代表被建模的总体。

  *   自变量之间是线性独立的，即一个自变量不能表示为其他自变量的线性组合。换句话说，不应存在多重共线性。

  *   误差的同方差性，即误差的方差在整个样本中是一致的。


  ### 评估标准


  模型性能的评估是数据科学用例的一个重要方面。我们不仅应该能够理解结果，还应该能够评估模型之间的比较情况，或者性能是否可接受。


  通常，评估指标和性能指南是高度用例和领域特定的，而回归分析经常使用一些标准指标。




  #### 残差分析


  回归是利用解释变量上的回归函数对目标变量进行估计。由于输出是近似值，因此目标变量的预测值与观测值之间会存在一定差异。


  残差是观测值与预测值（回归函数的输出）之间的差异。数学上，第 i 个数据点的观测值与预测值之间的残差或差异表示为：


  ![$$ {\mathrm{e}}_{\mathrm{i}}={\mathrm{y}}_{\mathrm{i}}-\mathrm{f}\left({\mathrm{x}}_{\mathrm{i}},\upbeta
  \right) $$](img/A448827_1_En_6_Chapter_Equb.gif)


  一个与数据拟合良好的回归模型，其残差会呈现随机性（即缺乏任何模式）。这源于回归建模的同方差性假设。通常使用残差与预测变量之间的散点图来确认该假设。任何模式的出现都意味着违反了这一性质，并表明模型拟合不佳。


  #### 正态性检验（Q-Q 图）


  这是一种用于检验数据正态性的可视化/图形化测试。该测试有助于我们识别异常值、偏态等。测试方法是将数据与理论分位数进行绘图。相同的数据也会绘制在直方图上以确认正态性。以下是展示数据通过正态性检验的示例图（见图
  6-9）。


  ![A448827_1_En_6_Fig9_HTML.jpg](img/A448827_1_En_6_Fig9_HTML.jpg)


  图 6-9.


  左侧为正态概率图（Q-Q 图），右侧为用于确认正态性的直方图


  正态概率图中任何偏离直线的现象，或直方图中出现偏态/多峰性，都表明数据未通过正态性检验。


  #### R 方：拟合优度


  R 方或决定系数是另一种用于检验回归分析拟合优度的度量。它用于确定回归线是否能够指示由自变量解释的因变量方差。


  R 方是一个介于 0 和 1 之间的数值，1 表示自变量能够完全解释因变量的方差。数值越接近 0，表明模型拟合越差。


  #### 交叉验证


  如第 5 章所述，模型泛化能力也是处理数据科学问题的一个重要方面。一个在训练集上过拟合的模型，可能在未见过的数据上表现不佳，并导致各种问题和业务影响。因此，我们也在回归模型上采用
  k 折交叉验证，以确保没有发生过拟合。


  ## 建模


  现在，我们已准备好开始对共享单车数据集进行建模，并解决预测给定日期时间自行车需求量的业务问题。我们将利用上一节讨论的回归分析概念来建模并评估我们模型的性能。


  本章前面部分已经对数据集进行了分析，并执行了某些转换，例如重命名属性和类型转换。由于数据集包含多个分类变量，因此在建模过程中使用它们之前，我们必须对名义变量进行编码。


  以下代码片段展示了基于我们在第 4 章（特征工程与选择）中详细讨论的方法，对分类变量进行独热编码的函数。


  ```

  def fit_transform_ohe(df,col_name):

  """此函数对指定列执行独热编码。

  参数:

  df(pandas.DataFrame): 包含指定列名的数据框

  col_name: 需要进行独热编码的列

  返回:

  元组: label_encoder, one_hot_encoder, 转换后的列作为 pandas Series

  """

  # 对列进行标签编码

  le = preprocessing.LabelEncoder()

  le_labels = le.fit_transform(df[col_name])

  df[col_name+''_label''] = le_labels

  # 独热编码

  ohe = preprocessing.OneHotEncoder()

  feature_arr = ohe.fit_transform(df[[col_name+''_label'']]).toarray()

  feature_labels = [col_name+''_''+str(cls_label) for cls_label in le.classes_]

  features_df = pd.DataFrame(feature_arr, columns=feature_labels)

  return le,ohe,features_df

  ```


  我们使用 `fit_transform_ohe()` 函数以及 `transform_ohe()` 来对分类变量进行编码。标签编码器和独热编码器是 `scikit-learn`
  的 `preprocessing` 模块的一部分。


  注意


  在接下来的章节中，我们将互换使用 `scikit` 和 `sklearn`。


  如前几章所述，我们通常将手头的数据集划分为训练集和测试集，以评估模型的性能。在本例中，我们也使用 `scikit-learn` 的 `model_selection`
  模块中提供的 `train_test_split()` 函数。我们将数据集分别按 67% 和 33% 的比例拆分为 `train` 和 `test`。以下代码片段展示了这一点。


  ```

  In [11]: X, X_test, y, y_test = train_test_split(hour_df.iloc[:,0:-3],

  ...:                                         hour_df.iloc[:,-1],

  ...:                                         test_size=0.33,

  ...:                                         random_state=42)

  ...:

  ...: X.reset_index(inplace=True)

  ...: y = y.reset_index()

  ...:

  ...: X_test.reset_index(inplace=True)

  ...: y_test = y_test.reset_index()

  ```


  以下代码片段遍历分类变量列表进行转换，并准备一个编码后的属性列表。


  ```

  In [12]: cat_attr_list = [''season'',''is_holiday'',

  ...:                 ''weather_condition'',''is_workingday'',

  ...:                 ''hour'',''weekday'',''month'',''year'']

  ...:

  ...: encoded_attr_list = []

  ...: for col in cat_attr_list:

  ...:         return_obj = fit_transform_ohe(X,col)

  ...:         encoded_attr_list.append({''label_enc'':return_obj[0],

  ...:                                   ''ohe_enc'':return_obj[1],

  ...:                                   ''feature_df'':return_obj[2],

  ...:                                   ''col_name'':col})

  ```


  注意


  尽管我们已经将所有分类变量转换为其独热编码，但请注意，像 hour、weekday 等有序属性不需要此类编码。


  接下来，我们将数值型和独热编码后的分类变量合并到一个数据框中，用于建模目的。以下代码片段帮助我们准备所需的数据集。


  ```

  In [13]: feature_df_list = [X[numeric_feature_cols]]

  ...: feature_df_list.extend([enc[''feature_df''] \

  ...:                                 for enc in encoded_attr_list \

  ...:                                         if enc[''col_name''] in subset_cat_features])

  ...:

  ...: train_df_new = pd.concat(feature_df_list, axis=1)

  ...: print("Shape::{}".format(train_df_new.shape))

  ```


  我们使用原始训练数据框中的数值型和独热编码后的分类属性，准备了一个新的数据框。原始数据框有 10 个这样的属性（包括数值型和分类变量）。经过此转换后，由于对分类变量进行了独热编码，新数据框有
  19 个属性。




  ### 线性回归


  最简单的回归分析技术之一是线性回归。正如本章前面所讨论的，线性回归是分析因变量与自变量之间的关系。线性回归假设两个变量之间存在线性关系。在一般回归分析符号的基础上进行扩展，线性回归采用以下形式：


  ![$$ \boldsymbol{Y}=\boldsymbol{a}+\boldsymbol{bX} $$](img/A448827_1_En_6_Chapter_Equc.gif)


  在这个方程中，`Y` 是因变量，`X` 是自变量。符号 `a` 表示回归线的截距，`b` 表示回归线的斜率。


  基于截距（即 `a`）和斜率（即 `b`）的不同组合，可以将无数条线拟合到给定的数据集上。目标是找到最适合我们数据建模的拟合线。


  如果我们思考一下，最佳拟合线会是什么样子？这样的线必然具有最小的误差/残差，即对于这样一条线，预测值与观测值之间的差异最小。


  普通最小二乘法就是识别最佳拟合线的一种技术。该算法试图在斜率和截距方面最小化误差。它使用平方误差形式，如下所示：


  ![$$ \boldsymbol{q}=\sum {\left({y}_{observed}-{y}_{predicted}\right)}² $$](img/A448827_1_En_6_Chapter_Equd.gif)


  其中，`q` 是总平方误差。我们通过最小化总误差来获得最佳拟合线的斜率和截距。


  #### 训练


  现在我们已经了解了线性回归和 OLS 的背景知识，接下来开始构建模型。线性回归模型通过 `scikit-learn` 的 `linear_model` 模块提供。与
  `scikit` 中的所有机器学习算法一样，它也遵循熟悉的 `fit()` 和 `predict()` 主题。以下代码片段为我们准备了线性回归对象。


  ```

  In [14]: X = train_df_new

  ...: y= y.total_count.values.reshape(-1,1)

  ...:

  ...: lin_reg = linear_model.LinearRegression()

  ```


  一种简单的处理方法是调用 `fit()` 函数来构建我们的线性回归模型，然后在测试数据集上调用 `predict()` 函数来获取用于评估的预测值。我们还需要牢记过拟合的方面，减少其影响，并获得一个可泛化的模型。正如前一节和前面章节所讨论的，交叉验证是控制过拟合的一种方法。


  因此，我们使用 k 折交叉验证（具体为 10 折），如下面的代码片段所示。


  ```

  In [15]: predicted = cross_val_predict(lin_reg, X, y, cv=10)

  ```


  函数 `cross_val_predict()` 通过 `sklearn` 的 `model_selection` 模块提供。该函数将模型对象、预测变量和目标变量作为输入。我们使用
  `cv` 参数指定 k 折中的 k 值。在我们的示例中，我们使用 10 折交叉验证。该函数返回由模型对象拟合的交叉验证预测值。


  我们使用散点图来分析我们的预测。以下代码片段使用 `matplotlib` 生成残差与观测值之间的散点图。


  ![A448827_1_En_6_Fig10_HTML.jpg](img/A448827_1_En_6_Fig10_HTML.jpg)


  图 6-10.


  残差图


  ```

  In [16]: fig, ax = plt.subplots()

  ...: ax.scatter(y, y-predicted)

  ...: ax.axhline(lw=2,color=''black'')

  ...: ax.set_xlabel(''Observed'')

  ...: ax.set_ylabel(''Residual'')

  ...: plt.show()

  ```


  图 6-10 中的图明显违反了同方差性假设，该假设要求残差是随机的，不遵循任何模式。为了进一步量化我们与模型相关的发现，我们绘制了交叉验证得分。我们再次使用 `model_selection`
  模块中提供的 `cross_val_score()` 函数，如图 6-11 的可视化所示。


  ![A448827_1_En_6_Fig11_HTML.jpg](img/A448827_1_En_6_Fig11_HTML.jpg)


