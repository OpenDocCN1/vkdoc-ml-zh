  ...: plots = wtp_interpreter.feature_importance.plot_feature_importance(wtp_im_model,\n\
  ascending=False)\n```\n\n我们可以在图 9-20 中看到，`density`、`total sulfur dioxide` 和 `residual\
  \ sugar` 是对将葡萄酒样品分类为红葡萄酒或白葡萄酒贡献最大的前三个特征。除了查看指标之外，另一种理解模型表现好坏的方法是绘制接收者操作特征曲线，通常也称为\
  \ ROC 曲线。该曲线可以使用分类器的真正率 (TPR) 和假正率 (FPR) 来绘制。TPR 被称为灵敏度或召回率，它是在数据集中所有正样本中预测出的正确正结果的总数。FPR\
  \ 被称为误报率或 (1 - 特异度)，它确定了数据集中所有负样本中不正确正预测的总数。ROC 曲线有时也被称为灵敏度与 (1 − 特异度) 图。以下代码使用我们的模型评估工具模块在\
  \ ROC 空间中为我们的逻辑回归模型绘制 ROC 曲线。\n\n```\nIn [17]: meu.plot_model_roc_curve(wtp_lr,\
  \ wtp_test_SX, wtp_test_y)\n```\n\n通常在任何 ROC 曲线中，ROC 空间位于点 (0,0) 和 (1, 1) 之间。混淆矩阵中的每个预测结果占据\
  \ ROC 空间中的一个点。理想情况下，最佳预测模型会在左上角 (0,1) 处给出一个点，表示完美的分类（100% 灵敏度和特异度）。对角线表示随机猜测的分类器。理想情况下，如果你的\
  \ ROC 曲线出现在图形的上半部分，你有一个不错的分类器，它优于平均水平。图 9-21 使这一点更清晰。\n\n![A448827_1_En_9_Fig21_HTML.jpg](img/A448827_1_En_9_Fig21_HTML.jpg)\n\
  \n图 9-21.\n\n我们逻辑回归模型的 ROC 曲线\n\n如果你还记得，我们为这个模型实现了几乎 100% 的准确率，因此 ROC 曲线几乎是完美的，我们还看到曲线下面积\
  \ (AUC) 为 1，这是完美的。最后，根据我们之前获得的特征重要性排名，让我们看看是否可以可视化模型的决策面或决策边界，这基本上为我们提供了模型能够多好地学习属于每个类别的数据点以及分离属于不同类别的点的视觉描述。这个表面基本上是超曲面，它有助于根据数据样本的特征（特征空间）来分离其底层向量空间。如果这个表面是线性的，那么分类问题是线性的，超曲面也称为超平面。我们的模型评估工具模块借助一个易于使用的函数帮助我们绘制这个（请注意，这目前仅适用于\
  \ `scikit` 估计器，因为对于基于 `keras` 的估计器没有 `clone` 函数，并且在撰写本书时它刚刚在上个月发布；我们可能会在将来稳定后推送更改）。\n\
  \n```\nIn [18]: feature_indices = [i for i, feature in enumerate(wtp_feature_names)\n\
  ...:                        if feature in ['density', 'total sulfur dioxide']]\n\
  ...: meu.plot_model_decision_surface(clf=wtp_lr,\n...:                         \
  \       train_features=wtp_train_SX[:, feature_indices],\n...:                 \
  \               train_labels=wtp_train_y, plot_step=0.02,\n...:                \
  \                cmap=plt.cm.Wistia_r, markers=[',', 'o'],\n...:               \
  \                 alphas=[0.9, 0.6], colors=['r', 'y'])\n```\n\n由于我们想要在底层特征空间上绘制决策面，当你有两个以上特征时，可视化变得极其困难。因此，为了简单和易于解释，我们将使用最重要的两个特征（`density`\
  \ 和 `total sulfur dioxide`）来可视化模型决策面。这是通过将原始模型估计器的克隆模型拟合到这两个特征上，然后根据它学到的内容绘制决策面来完成的。查看\
  \ `plot_model_decision_surface(...)` 函数，了解我们如何可视化决策面的更多底层细节。\n\n![A448827_1_En_9_Fig22_HTML.jpg](img/A448827_1_En_9_Fig22_HTML.jpg)\n\
  \n图 9-22.\n\n可视化我们逻辑回归模型的模型决策面\n\n图 9-22 中显示的图强化了这样一个事实，即我们的模型仅基于两个最重要的特征就很好地学习了底层模式，它使用这些特征将大部分红葡萄酒样品与白葡萄酒样品（由散点表示）分离开来。这里那里有很少的错误分类，这从我们之前在混淆矩阵中获得的统计数据中可以明显看出。\n\
  \n预测葡萄酒品质\n\n在我们的葡萄酒品质数据集中，我们有从 3 到 9 的几个品质评级类别。我们将重点关注的是 `quality_label` 变量，它根据我们在“探索性数据分析”部分创建的映射，基于底层\
  \ `quality` 变量将葡萄酒分为低、中、高评级。这样做是因为几个评级分数只有很少的葡萄酒样品，因此相似的品质评级被合并到一个品质类别评级中。我们为所有涉及葡萄酒品质预测的变量和模型使用前缀\
  \ `wqp_`，以区别于其他分析。前缀 `wqp` 代表葡萄酒品质预测。在本节中，我们将评估和查看基于树的分类模型以及集成模型。以下代码帮助我们准备用于建模的\
  \ `train` 和 `test` 数据集。\n\n```\nIn [19]: wqp_features = wines.iloc[:,:-3]\n...:\
  \ wqp_class_labels = np.array(wines['quality_label'])\n...: wqp_label_names = ['low',\
