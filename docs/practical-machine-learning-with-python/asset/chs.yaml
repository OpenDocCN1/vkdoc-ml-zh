  \ 4% 的提升，并且总体比基础决策树模型获得了 8% 的提升。此外，我们可以看到没有低品质葡萄酒样品被错误分类为高品质。同样，也没有高品质葡萄酒样品被错误分类为低品质。中等品质和高/低品质葡萄酒样品之间存在相当大的重叠，但考虑到数据的性质和类别分布，这是意料之中的。\n\
  \n另一种基于集成的方法建模是提升。一种非常流行的方法是 XGBoost，它代表极端梯度提升。它是梯度提升机 (GBM) 模型的一个变体。该模型在数据科学社区中非常受欢迎，因为它在几个数据科学挑战和竞赛中表现出色，尤其是在\
  \ Kaggle 上。要使用此模型，你可以在 Python 中安装 `xgboost` 包。有关此框架的详细信息，请随时查看官方网站 [`http://xgboost.readthedocs.io/en/latest`](http://xgboost.readthedocs.io/en/latest)，该网站提供了关于安装、模型调优等的详细文档。功劳归于分布式机器学习社区，通常称为\
  \ DMLC，他们创建了 XGBoost 框架以及流行的 MXNet 深度学习框架。梯度提升使用我们之前讨论过的集成提升方法原理，并在添加新的弱基础学习器时使用梯度下降来最小化误差或损失。深入讨论模型内部细节超出了当前范围，但我们建议查看\
  \ [ `http://xgboost.readthedocs.io/en/latest/model.html` ](http://xgboost.readthedocs.io/en/latest/model.html)\
  \ 以了解提升树和 XGBoost 原理的精彩介绍。我们首先在我们的数据上训练了一个基本的 XGBoost 模型，并获得了大约 74% 的总体准确率。在使用网格搜索调优模型后，我们使用以下参数值训练了模型，并评估了其在测试数据上的性能（详细的逐步代码片段可在\
  \ jupyter 笔记本中找到）。\n\n![A448827_1_En_9_Fig28_HTML.jpg](img/A448827_1_En_9_Fig28_HTML.jpg)\n\
  \n图 9-28.\n\n葡萄酒品质预测模型的调优后 XGBoost 模型性能指标\n\n```\nIn [29]: import os\n...: mingw_path\
