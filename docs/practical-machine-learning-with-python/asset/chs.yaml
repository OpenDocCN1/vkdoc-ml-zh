  95.09%。在自己的数据集上试试看吧！你是否看到了任何改进？


  ### 递归特征消除


  你还可以借助基于机器学习的模型估计器对特征进行排序和评分，从而递归地消除得分较低的特征，直到达到特定的特征子集数量。递归特征消除（Recursive Feature
  Elimination，简称 RFE）是一种流行的基于包装器的特征选择技术，它允许你使用这种策略。基本思路是，首先使用一个特定的机器学习估计器（例如我们用于分类需求的逻辑回归算法）。接下来，我们采用包含
  30 个特征的完整特征集以及相应的响应类别变量。RFE 旨在根据模型拟合结果为这些特征分配权重。权重最小的特征被剔除，然后对剩余特征重新拟合模型，以获得新的权重或分数。这一过程会递归执行多次，每次都会消除得分/权重最低的特征，直到修剪后的特征子集包含用户希望选择的特征数量（这在开始时作为一个输入参数传入）。这种策略也常被称为**后向消除**。现在，让我们使用
  RFE 在乳腺癌数据集上选择前 15 个特征。


  ```

  In [14]: from sklearn.feature_selection import RFE

  ...:

  ...: lr = LogisticRegression()

  ...: rfe = RFE(estimator=lr, n_features_to_select=15, step=1)

  ...: rfe.fit(bc_X, bc_y)

  Out[14]:

  RFE(estimator=LogisticRegression(C=1.0, class_weight=None, dual=False, fit_intercept=True,

  intercept_scaling=1, max_iter=100, multi_class=''ovr'', n_jobs=1,

  penalty=''l2'', random_state=None, solver=''liblinear'', tol=0.0001,

  verbose=0, warm_start=False),

  n_features_to_select=15, step=1, verbose=0)

  ```


  现在我们可以使用`get_support(...)`函数来获取最终选定的 15 个特征。如下代码片段所示。


  ```

  In [15]: select_features_rfe = rfe.get_support()

  ...: feature_names_rfe = bc_data.feature_names[select_features_rfe]

  ...: print(feature_names_rfe)

