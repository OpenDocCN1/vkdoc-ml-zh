  ## 文本预处理与标准化\n\n在深入进行特征工程和建模过程之前，关键步骤之一包括清洗、预处理和标准化文本，以便将短语和单词等文本组件转换为某种标准格式。这有助于在整个文档语料库中实现标准化，从而构建有意义的特征，并减少因无关符号、特殊字符、XML\
  \ 和 HTML 标签等多种因素引入的噪声。名为 `text_normalizer.py` 的文件包含了我们进行文本标准化所需的所有工具函数。你也可以参考名为\
  \ `Text Normalization Demo.ipynb` 的 jupyter notebook 以获得更具交互性的体验。本节将描述文本标准化流程中的主要组件。\n\
  \n*   **清洗文本**：我们的文本通常包含 HTML 标签等不必要的内容，这些内容在分析情感时价值不大。因此，我们需要在提取特征之前确保将其移除。`BeautifulSoup`\
  \ 库在这方面提供了出色的函数。我们的 `strip_html_tags(...)` 函数能够清洗和剥离 HTML 代码。\n*   **去除重音字符**：在我们的数据集中，处理的是英文评论，因此我们需要确保任何其他格式的字符，尤其是重音字符，被转换并标准化为\
  \ ASCII 字符。一个简单的例子是将 é 转换为 e。我们的 `remove_accented_chars(...)` 函数在这方面提供了帮助。\n*  \
  \ **扩展缩略词**：在英语中，缩略词基本上是单词或音节的缩写形式。这些现有单词或短语的缩写形式是通过移除特定字母和发音来创建的。通常，单词中的元音会被移除。例如，do\
  \ not 变为 don’t，I would 变为 I’d。缩略词在文本标准化中会带来问题，因为我们需要处理撇号等特殊字符，并且必须将每个缩略词转换为其扩展的原始形式。我们的\
  \ `expand_contractions(...)` 函数使用正则表达式以及 `contractions.py` 模块中映射的各种缩略词，来扩展文本语料库中的所有缩略词。\n\
  *   **去除特殊字符**：文本清洗和标准化的另一项重要任务是去除特殊字符和符号，这些字符和符号常常会增加非结构化文本中的额外噪声。可以使用简单的正则表达式来实现这一点。我们的函数\
  \ `remove_special_characters(...)` 帮助我们去除特殊字符。在我们的代码中，我们保留了数字，但如果你不希望标准化后的语料库中包含数字，也可以将其移除。\n\
  *   **词干提取与词形还原**：词干通常是单词的基本形式，可以通过向词干附加前缀和后缀等词缀来创建新单词。这被称为屈折变化。获取单词基本形式的逆向过程被称为词干提取。一个简单的例子是单词\
  \ WATCHES、WATCHING 和 WATCHED，它们都以单词词根词干 WATCH 作为基本形式。`nltk` 包提供了多种词干提取器，例如 `PorterStemmer`\
  \ 和 `LancasterStemmer`。词形还原与词干提取非常相似，都是移除单词词缀以获取单词的基本形式。然而，在这种情况下，基本形式被称为根词，而不是词根词干。区别在于根词始终是一个在词典中存在的、拼写正确的单词，而词根词干则可能不是。我们将在标准化流程中仅使用词形还原来保留拼写正确的单词。函数\
  \ `lemmatize_text(...)` 在这方面提供了帮助。\n*   **去除停用词**：在从文本构建有意义的特征时，那些意义不大或没有意义的词也被称为停用词。如果你在文档语料库中进行简单的词项或词频统计，这些词通常是频率最高的词。像\
  \ a、an、the 等词被认为是停用词。没有通用的停用词列表，但我们使用了来自 `nltk` 的标准英文停用词列表。如果需要，你也可以添加特定领域的停用词。函数\
  \ `remove_stopwords(...)` 帮助我们移除停用词，并保留语料库中最具意义和上下文的词。\n\n我们将所有这些组件整合到以下名为 `normalize_corpus(...)`\
  \ 的函数中，该函数可以将文档语料库作为输入，并返回经过清洗和标准化文本处理的同一语料库。\n\n\n\n```\ndef normalize_corpus(corpus,\
  \ html_stripping=True, contraction_expansion=True,\naccented_char_removal=True,\
  \ text_lower_case=True,\ntext_lemmatization=True, special_char_removal=True,\nstopword_removal=True):\n\
  normalized_corpus = []\n# 对语料库中的每个文档进行标准化\nfor doc in corpus:\n# 去除 HTML 标签\nif\
  \ html_stripping:\ndoc = strip_html_tags(doc)\n# 去除重音字符\nif accented_char_removal:\n\
  doc = remove_accented_chars(doc)\n# 展开缩写\nif contraction_expansion:\ndoc = expand_contractions(doc)\n\
  # 将文本转换为小写\nif text_lower_case:\ndoc = doc.lower()\n# 去除多余的换行符\ndoc = re.sub(r'[\\\
  r|\\n|\\r\\n]+', ' ',doc)\n# 在特殊字符之间插入空格以将其隔离\nspecial_char_pattern = re.compile(r'([{.(-)!}])')\n\
  doc = special_char_pattern.sub(\" \\\\1 \", doc)\n# 词形还原\nif text_lemmatization:\n\
  doc = lemmatize_text(doc)\n# 去除特殊字符\nif special_char_removal:\ndoc = remove_special_characters(doc)\n\
  # 去除多余空白\ndoc = re.sub(' +', ' ', doc)\n# 去除停用词\nif stopword_removal:\ndoc = remove_stopwords(doc,\
  \ is_lower_case=text_lower_case)\nnormalized_corpus.append(doc)\nreturn normalized_corpus\n\
  ```\n\n以下代码片段展示了使用我们的标准化模块对示例文档进行文本标准化的小型演示。\n\n```\nIn [1]: from text_normalizer\
  \ import normalize_corpus\nIn [2]: document = \"\"\"Héllo! Héllo! can you hear me!\
  \ I just heard about Python!\\r\\n\n...: It's an amazing language which can be used\
  \ for Scripting, Web development,\\r\\n\\r\\n\n...: Information Retrieval, Natural\
  \ Language Processing, Machine Learning & Artificial Intelligence!\\n\n...: What\
  \ are you waiting for? Go and get started. He's learning, she's learning, they've\
  \ already\\n\\n\n...: got a headstart!\n...:            \"\"\"\nIn [3]: document\n\
  Out[3]: \"Héllo! Héllo! can you hear me! I just heard about Python!\\r\\n \\n  \
  \            It's an amazing language which can be used for Scripting, Web development,\\\
  r\\n\\r\\n\\n              Information Retrieval, Natural Language Processing, Machine\
  \ Learning & Artificial Intelligence!\\n\\n              What are you waiting for?\
  \ Go and get started. He's learning, she's learning, they've already\\n\\n\\n  \
  \            got a headstart!\\n           \"\nIn [4]: normalize_corpus([document],\
  \ text_lemmatization=False, stopword_removal=False,\ntext_lower_case=False)\nOut[4]:\
  \ ['Hello Hello can you hear me I just heard about Python It is an amazing language\
  \ which can be used for Scripting Web development Information Retrieval Natural\
  \ Language Processing Machine Learning Artificial Intelligence What are you waiting\
  \ for Go and get started He is learning she is learning they have already got a\
  \ headstart ']\nIn [5]: normalize_corpus([document])\nOut[5]: ['hello hello hear\
  \ hear python amazing language use scripting web development information retrieval\
  \ natural language processing machine learning artificial intelligence wait go get\
  \ start learn learn already get headstart']\n```\n\n现在我们已经准备好了标准化模块，可以开始对语料库进行建模和分析。对文本标准化更深入细节感兴趣的\
  \ NLP 和文本分析爱好者，可以参考《Python 文本分析》（Apress 出版社；Dipanjan Sarkar 著，2016 年）一书第 115 页第\
  \ 3 章的“文本标准化”部分。\n\n## 基于无监督词典的模型\n\n我们之前讨论过无监督学习方法，这些方法指的是可以直接应用于数据特征而无需标注数据的特定建模方法。在任何组织中，主要挑战之一是由于缺乏时间和资源来完成标注数据这项繁琐任务，导致难以获得标注数据集。在这种情况下，无监督方法非常有用，我们将在本节中探讨其中一些方法。即使我们有标注数据，本节也能让您很好地了解基于词典的模型是如何工作的，并且您可以在没有标注数据时将其应用于自己的数据集。\n\
  \n无监督情感分析模型使用精心策划的知识库、本体、词典和数据库，这些资源包含关于主观词汇、短语的详细信息，包括情感、情绪、极性、客观性、主观性等。词典模型通常使用一个专门针对情感分析的词典，也称为字典或词汇表。通常，这些词典包含与正面和负面情感相关的词汇列表、极性（负面或正面分数的幅度）、词性（POS）标签、主观性分类器（强、弱、中性）、情绪、情态等。您可以使用这些词典，通过匹配词典中特定词汇的出现情况来计算文本文档的情感，同时考虑其他附加因素，如否定词的存在、周围词汇、整体上下文和短语，并汇总整体情感极性分数，以决定最终的情感分数。有几种流行的词典模型用于情感分析。其中一些列举如下。\n\
  \n*   刘冰词典\n*   MPQA 主观性词典\n*   Pattern 词典\n*   AFINN 词典\n*   SentiWordNet 词典\n\
  *   VADER 词典\n\n这并不是词典模型的详尽列表，但绝对列出了当今最流行的一些模型。我们将更详细地介绍最后三种词典模型，并使用我们的电影评论数据集提供动手代码和示例。我们将使用最后\
  \ 15,000 条评论来预测其情感，并根据模型评估指标（如准确率、精确率、召回率和 F1 分数）来评估模型的表现，这些指标我们在第 5 章中已详细介绍。由于我们有标注数据，因此很容易看出这些电影评论的实际情感值与基于词典模型预测的情感值的匹配程度。您可以参考名为`unsupervised_sentiment_analysis.py`的\
  \ Python 文件，获取本节中使用的所有代码，或者使用名为`Sentiment Analysis - Unsupervised Lexical.ipynb`的\
  \ Jupyter 笔记本以获得更互动的体验。在开始分析之前，让我们使用以下代码片段加载必要的依赖项和配置设置。\n\n```\nIn [1]: import\
  \ pandas as pd\n...: import numpy as np\n...: import text_normalizer as tn\n...:\
  \ import model_evaluation_utils as meu\n...:\n...: np.set_printoptions(precision=2,\
  \ linewidth=80)\n```\n\n现在，我们可以加载 IMDb 评论数据集，提取出最后 15,000 条评论用于分析，并使用以下代码片段对其进行标准化。\n\
  \n```\nIn [2]: dataset = pd.read_csv(r'movie_reviews.csv')\n...:\n...: reviews =\
  \ np.array(dataset['review'])\n...: sentiments = np.array(dataset['sentiment'])\n\
  ...:\n...: # 提取用于模型评估的数据\n...: test_reviews = reviews[35000:]\n...: test_sentiments\
  \ = sentiments[35000:]\n...: sample_review_ids = [7626, 3533, 13010]\n...:\n...:\
  \ # 标准化数据集\n...: norm_test_reviews = tn.normalize_corpus(test_reviews)\n```\n\n\
  我们还提取了一些示例评论，以便在其上运行模型并详细解释结果。\n\n### 刘冰词典\n\n该词典包含超过 6,800 个词汇，分为两个文件：`positive-words.txt`（包含约\
  \ 2,000 多个词汇/短语）和`negative-words.txt`（包含 4,800 多个词汇/短语）。该词典由刘冰历经数年开发和整理，并在其原始论文（Nitin\
  \ Jindal 和刘冰合著，《识别文本文档中的比较句》，第 29 届 ACM SIGIR 国际年会论文集，西雅图，2006 年）中进行了详细说明。如果您想使用此词典，可以从`https://`\
  \ [`www.cs.uic.edu/~liub/FBS/sentiment-analysis.html#lexicon`](http://www.cs.uic.edu/%7Eliub/FBS/sentiment-analysis.html%23lexicon)\
  \ 获取，该页面还提供了将其作为压缩包（RAR 格式）下载的链接。\n\n\n\n### MPQA 主观性词典\n\n术语 MPQA 代表多视角问答（Multi-Perspective\
  \ Question Answering），它包含一系列与意见语料库、主观性词典、主观性语义标注、论证词典、辩论语料库、意见挖掘器等多种资源相关的多样化数据集。该资源由匹兹堡大学开发并维护，其官方网站\
  \ [`http://mpqa.cs.pitt.edu/`](http://mpqa.cs.pitt.edu/) 包含了所有必要信息。主观性词典是其意见挖掘器框架的一部分，包含了主观性线索和上下文极性。有关详细信息，可参阅\
  \ Theresa Wilson、Janyce Wiebe 和 Paul Hoffmann 的论文《[识别短语级情感分析中的上下文极性](http://www.cs.pitt.edu/%7Ewiebe/pubs/papers/emnlp05polarity.pdf)》（HLT-EMNLP-2005\
  \ 会议论文集）。\n\n你可以从其官方网站 [`http://mpqa.cs.pitt.edu/lexicons/subj_lexicon/`](http://mpqa.cs.pitt.edu/lexicons/subj_lexicon/)\
  \ 下载主观性词典，其中包含数据集 `subjclueslen1-HLTEMNLP05.tff` 中呈现的主观性线索。以下片段展示了该词典中的一些示例行。\n\n\
  ```\ntype=weaksubj len=1 word1=abandonment pos1=noun stemmed1=n priorpolarity=negative\n\
  type=weaksubj len=1 word1=abandon pos1=verb stemmed1=y priorpolarity=negative\n\
  ...\n...\ntype=strongsubj len=1 word1=zenith pos1=noun stemmed1=n priorpolarity=positive\n\
  type=strongsubj len=1 word1=zest pos1=noun stemmed1=n priorpolarity=positive\n```\n\
  \n每一行包含一个特定单词及其关联的极性、词性标注信息、长度（目前仅包含长度为 1 的单词）、主观性上下文以及词干信息。\n\n\n\n### 模式词典\n\n\
  Pattern 包是 Python 中一个完整的自然语言处理框架，可用于文本处理、情感分析等。它由 CLiPS（计算语言学与心理语言学）开发，该研究中心隶属于安特卫普大学文学院语言学系。Pattern\
  \ 使用其自身的情感模块，该模块内部使用一个词典，你可以从其官方 GitHub 仓库 [`https://github.com/clips/pattern/blob/master/pattern/text/en/en-sentiment.xml`](https://github.com/clips/pattern/blob/master/pattern/text/en/en-sentiment.xml)\
  \ 访问该词典，其中包含完整的主观性词典数据库。词典中的每一行通常类似于以下示例。\n\n```\n\n因此，你可以获得重要的元数据信息，如 WordNet 语料库标识符、极性分数、词义、词性标注、强度、主观性分数等。这些信息反过来可用于基于极性和主观性分数计算文本文档的情感。遗憾的是，Pattern\
  \ 仍未正式移植到 Python `3.x`，它目前适用于 Python `2.7.x`。不过，你仍然可以加载此词典并根据需要进行自己的建模。\n\nAFINN\
  \ 词典\n\nAFINN 词典\n  可能是最简单、最流行的词典之一，可广泛用于情感分析。该词典由 Finn Årup Nielsen 开发并维护，你可以在\
  \ Finn Årup Nielsen 的论文《A new ANEW: evaluation of a word list for sentiment analysis\
  \ in microblogs》（ESWC2011 研讨会论文集）中找到关于此词典的更多详细信息。该词典的当前版本是 `AFINN-en-165.txt`，包含超过\
  \ 3300 个单词，每个单词都关联一个极性分数。你可以在作者的官方 GitHub 仓库中找到此词典及其早期版本（包括 `AFINN-111`），地址为 [`https://github.com/fnielsen/afinn/blob/master/afinn/data/`](https://github.com/fnielsen/afinn/blob/master/afinn/data/)\
  \ 。作者还在此基础上创建了一个名为 `afinn` 的 Python 封装库，我们将使用它进行分析。你可以使用以下代码导入该库并实例化一个对象。\n\n```\n\
  In [3]: from afinn import Afinn\n...:\n...: afn = Afinn(emoticons=True)\n```\n\n\
  现在，我们可以使用此对象，通过以下代码片段计算我们选定的四个示例评论的极性。\n\n```\nIn [4]: for review, sentiment in\
  \ zip(test_reviews[sample_review_ids], test_sentiments[sample_review_ids]):\n...:\
  \     print('REVIEW:', review)\n...:     print('Actual Sentiment:', sentiment)\n\
  ...:     print('Predicted Sentiment polarity:', afn.score(review))\n...:     print('-'*60)\n\
  REVIEW: no comment - stupid movie, acting average or worse... screenplay - no sense\
  \ at all... SKIP IT!\nActual Sentiment: negative\nPredicted Sentiment polarity:\
  \ -7.0\n\nREVIEW: I don't care if some people voted this movie to be bad. If you\
  \ want the Truth this is a Very Good Movie! It has every thing a movie should have.\
  \ You really should Get this one.\nActual Sentiment: positive\nPredicted Sentiment\
  \ polarity: 3.0\n\nREVIEW: Worst horror film ever but funniest film ever rolled\
  \ in one you have got to see this film it is so cheap it is unbelievable but you\
  \ have to see it really!!!! P.S. Watch the carrot\nActual Sentiment: positive\n\
  Predicted Sentiment polarity: -3.0\n\n```\n\n我们可以比较每条评论的实际情感标签，并查看预测的情感极性分数。负极性通常表示负面情感。为了对我们包含\
  \ 15,000 条评论的完整测试数据集（我使用了原始文本文档，因为 AFINN 会考虑表情符号和感叹号等其他方面）进行情感预测，我们现在可以使用以下代码片段。我使用阈值\
  \ `>= 1.0` 来判断整体情感是正面还是负面。将来你可以根据自己的语料库分析选择自己的阈值。\n\n```\nIn [5]: sentiment_polarity\
  \ = [afn.score(review) for review in test_reviews]\n...: predicted_sentiments =\
  \ ['positive' if score >= 1.0 else 'negative' for score in\nsentiment_polarity]\n\
  ```\n\n现在我们有了预测的情感标签，我们可以使用效用函数，基于标准性能指标来评估模型性能。参见图 7-1。\n\n![A448827_1_En_7_Fig1_HTML.jpg](img/A448827_1_En_7_Fig1_HTML.jpg)\n\
  \n图 7-1.\n\n基于 AFINN 词典的模型性能指标\n\n```\nIn [6]: meu.display_model_performance_metrics(true_labels=test_sentiments,\n\
  predicted_labels=predicted_sentiments,\nclasses=['positive', 'negative'])\n```\n\
  \n我们得到了 71% 的整体 F1 分数，考虑到这是一个无监督模型，这个结果相当不错。查看混淆矩阵，我们可以清楚地看到，相当多的负面情感评论被错误分类为正面（3,189\
  \ 条），这导致负面情感类别的召回率较低，为 57%。正面类别的性能在召回率或命中率方面更好，我们在 7,510 条正面评论中正确预测了 6,376 条，但由于在负面情感评论的情况下做出了许多错误的正面预测，精确率为\
  \ 67%。\n\nSentiWordNet 词典\n\nWordNet 语料库无疑是英语中最流行的语料库之一，广泛应用于自然语言处理和语义分析。WordNet\
  \ 为我们提供了同义词集（synsets）的概念。SentiWordNet 词典基于 WordNet 同义词集，可用于情感分析和意见挖掘。SentiWordNet\
  \ 词典通常为每个 WordNet 同义词集分配三个情感分数。这些分数包括正面极性分数、负面极性分数和客观性分数。更多详细信息可在官方网站 [`http://sentiwordnet.isti.cnr.it`](http://sentiwordnet.isti.cnr.it)\
  \ 上找到，包括研究论文和词典下载链接。我们将使用 nltk 库，它提供了 SentiWordNet 的 Python 接口。假设我们有形容词 awesome。我们可以使用以下代码片段获取与该词同义词集关联的情感分数。\n\
  \n```\nIn [8]: from nltk.corpus import sentiwordnet as swn\n...:\n...: awesome =\
  \ list(swn.senti_synsets('awesome', 'a'))[0]\n...: print('Positive Polarity Score:',\
  \ awesome.pos_score())\n...: print('Negative Polarity Score:', awesome.neg_score())\n\
  ...: print('Objective Score:', awesome.obj_score())\nPositive Polarity Score: 0.875\n\
  Negative Polarity Score: 0.125\nObjective Score: 0.0\n```\n\n现在，让我们构建一个通用函数，基于文档中匹配的同义词集，提取并聚合完整文本文档的情感分数。\n\
  \n```\ndef analyze_sentiment_sentiwordnet_lexicon(review,\nverbose=False):\n\n"
- '# tokenize and POS tag text tokens

  tagged_text = [(token.text, token.tag_) for token in tn.nlp(review)]

  pos_score = neg_score = token_count = obj_score = 0


  '
- '# get wordnet synsets based on POS tags


  '
- '# get sentiment scores if synsets are found

  for word, tag in tagged_text:

  ss_set = None

  if ''NN'' in tag and list(swn.senti_synsets(word, ''n'')):

  ss_set = list(swn.senti_synsets(word, ''n''))[0]

  elif ''VB'' in tag and list(swn.senti_synsets(word, ''v'')):

  ss_set = list(swn.senti_synsets(word, ''v''))[0]

  elif ''JJ'' in tag and list(swn.senti_synsets(word, ''a'')):

  ss_set = list(swn.senti_synsets(word, ''a''))[0]

  elif ''RB'' in tag and list(swn.senti_synsets(word, ''r'')):

  ss_set = list(swn.senti_synsets(word, ''r''))[0]


  '
- '# if senti-synset is found

  if ss_set:


  '
- '# add scores for all found synsets

  pos_score += ss_set.pos_score()

  neg_score += ss_set.neg_score()

  obj_score += ss_set.obj_score()

  token_count += 1




  '
- '# 聚合最终得分

  final_score = pos_score - neg_score

  norm_final_score = round(float(final_score) / token_count, 2)

  final_sentiment = ''positive'' if norm_final_score >= 0 else ''negative''

  if verbose:

  norm_obj_score = round(float(obj_score) / token_count, 2)

  norm_pos_score = round(float(pos_score) / token_count, 2)

  norm_neg_score = round(float(neg_score) / token_count, 2)


  '
- "# 以表格形式展示结果\nsentiment_frame = pd.DataFrame([[final_sentiment, norm_obj_score,\
  \ norm_pos_score,\nnorm_neg_score, norm_final_score]],\ncolumns=pd.MultiIndex(levels=[['情感统计：'],\n\
  ['预测情感', '客观性',\n'正面', '负面', '总体']],\nlabels=[[0,0,0,0,0],[0,1,2,3,4]]))\nprint(sentiment_frame)\n\
  return final_sentiment\n```\n\n我们的函数基本流程是：接收一条电影评论，为每个单词标注其对应的词性标签，根据词性标签为任何匹配的同义词集提取情感得分，最后聚合这些得分。当我们对示例文档运行该函数时，这一点会更加清晰。\n\
  \n```\nIn [10]: for review, sentiment in zip(test_reviews[sample_review_ids], test_sentiments[sample_review_ids]):\n\
  ...:     print('评论:', review)\n...:     print('实际情感:', sentiment)\n...:     pred\
  \ = analyze_sentiment_sentiwordnet_lexicon(review, verbose=True)\n...:     print('-'*60)\n\
  评论: no comment - stupid movie, acting average or worse... screenplay - no sense\
  \ at all... SKIP IT!\n实际情感: negative\n情感统计:\n预测情感 客观性 正面 负面 总体\n0            negative\
  \        0.76     0.09     0.15   -0.06\n\n评论: I don't care if some people voted\
  \ this movie to be bad. If you want the Truth this is a Very Good Movie! It has\
  \ every thing a movie should have. You really should Get this one.\n实际情感: positive\n\
  情感统计:\n预测情感 客观性 正面 负面 总体\n0            positive        0.74      0.2     0.06  \
  \  0.14\n\n评论: Worst horror film ever but funniest film ever rolled in one you have\
  \ got to see this film it is so cheap it is unbelievable but you have to see it\
  \ really!!!! P.S. watch the carrot\n实际情感: positive\n情感统计:\n预测情感 客观性 正面 负面 总体\n0\
  \            positive         0.8     0.14     0.07    0.07\n\n```\n\n我们可以清晰地看到每条示例电影评论的预测情感、情感极性得分以及客观性得分，这些都以格式化数据框的形式呈现。现在，让我们使用这个模型来预测所有测试评论的情感，并评估其性能。我们使用阈值`>=0`将总体情感极性分类为正面，使用`<\
  \ 0`分类为负面。参见图 7-2。\n\n![A448827_1_En_7_Fig2_HTML.jpg](img/A448827_1_En_7_Fig2_HTML.jpg)\n\
  \n图 7-2.\n\n基于 SentiWordNet 词典的模型性能指标   \n\n```\nIn [11]: predicted_sentiments =\
  \ [analyze_sentiment_sentiwordnet_lexicon(review, verbose=False)\nfor review in\
  \ norm_test_reviews]\n...: meu.display_model_performance_metrics(true_labels=test_sentiments,\n\
  predicted_labels=predicted_sentiments,\n...:                                   \
  \   classes=['positive', 'negative'])\n```\n\n我们得到了 68% 的总体 F1 分数，这相比我们基于 AFINN\
  \ 的模型确实有所下降。虽然被误分类为正面情感的负面评论数量减少了，但模型性能的其他方面受到了影响。\n\nVADER 词典\n\nVADER 词典由 C.J.\
  \ Hutto 开发，是一种基于规则的情感分析框架的词典，专门针对社交媒体中的情感分析进行了调优。VADER 代表 Valence Aware Dictionary\
  \ and Sentiment Reasoner（情感感知词典与情感推理器）。关于该框架的详细信息，可阅读 Hutto, C.J. 和 Gilbert, E.E.\
  \ (2014) 的原始论文，标题为“VADER: A Parsimonious Rule-based Model for Sentiment Analysis\
  \ of Social Media Text”，发表于第八届国际网络日志与社交媒体会议（ICWSM-14）论文集。你可以通过 `nltk.sentiment.vader`\
  \ 模块下的 `nltk` 接口使用该库。除此之外，你还可以从 [`https://github.com/cjhutto/vaderSentiment`](https://github.com/cjhutto/vaderSentiment)\
  \ 下载实际的词典或安装该框架，该网站也包含关于 VADER 的详细信息。这个词典位于名为 `vader_lexicon.txt` 的文件中，包含与单词、表情符号和俚语（如\
  \ wtf、lol、nah 等）相关的情感得分。该词典总共包含超过 9000 个词汇特征，最终从中精选出超过 7500 个经过验证的词汇特征，并附有经过适当验证的效价分数。每个特征按照从\
  \ `\"[-4] 极度负面\"` 到 `\"[4] 极度正面\"` 的等级进行评分，并允许 `\"[0] 中性（或两者皆非，不适用）\"`。选择词汇特征的过程是保留所有平均评分非零且标准差小于\
  \ `2.5` 的特征，该标准差由十位独立评分者的聚合结果确定。下面我们展示 `VADER` 词典的一个样本。\n\n```\n:(     -1.9    \
  \ 1.13578 [-2, -3, -2, 0, -1, -1, -2, -3, -1, -4]\n:)      2.0     1.18322 [2, 2,\
  \ 1, 1, 1, 1, 4, 3, 4, 1]\n...\nterrorizing     -3.0    1.0     [-3, -1, -4, -4,\
  \ -4, -3, -2, -3, -2, -4]\nthankful         2.7    0.78102 [4, 2, 2, 3, 2, 4, 3,\
  \ 3, 2, 2]\n```\n\n上述词典样本中的每一行都描述了一个独特的词条，可以是表情符号或单词。第一个标记表示单词/表情符号，第二个标记表示平均情感极性得分，第三个标记表示标准差，最后一个标记表示由十位独立评分者给出的分数列表。现在，让我们使用\
  \ `VADER` 来分析我们的电影评论！我们构建自己的建模函数如下。\n\n```\nfrom nltk.sentiment.vader import SentimentIntensityAnalyzer\n\
  def analyze_sentiment_vader_lexicon(review,\nthreshold=0.1,\nverbose=False):\n\n"
- '# 预处理文本

  review = tn.strip_html_tags(review)

  review = tn.remove_accented_chars(review)

  review = tn.expand_contractions(review)


  '
- '# 分析评论的情感

  analyzer = SentimentIntensityAnalyzer()

  scores = analyzer.polarity_scores(review)


  '
- '# 获取聚合得分和最终情感

  agg_score = scores[''compound'']

  final_sentiment = ''positive'' if agg_score >= threshold\

  else ''negative''

  if verbose:




  '
- '# 显示详细的情感统计信息

  positive = str(round(scores[''pos''], 2)*100)+''%''

  final = round(agg_score, 2)

  negative = str(round(scores[''neg''], 2)*100)+''%''

  neutral = str(round(scores[''neu''], 2)*100)+''%''

  sentiment_frame = pd.DataFrame([[final_sentiment, final, positive,

  negative, neutral]],

  columns=pd.MultiIndex(levels=[[''情感统计：''],

  [''预测情感'', ''极性得分'',

  ''正面'', ''负面'', ''中性'']],

  labels=[[0,0,0,0,0],[0,1,2,3,4]]))

  print(sentiment_frame)

  return final_sentiment

  ```


  在我们的建模函数中，我们进行了一些基本的预处理，但保留了标点符号和表情符号。除此之外，我们使用`VADER`来获取情感极性以及评论文本在正面、中性和负面情感方面的比例。我们还根据用户输入的聚合情感极性阈值来预测最终情感。通常，`VADER`建议对聚合极性`>=
  0.5`使用正面情感，对`[-0.5, 0.5]`之间使用中性情感，对极性`< -0.5`使用负面情感。在我们的语料库中，我们对正面情感使用`>= 0.4`的阈值，对负面情感使用`<
  0.4`的阈值。以下是对我们样本评论的分析。


