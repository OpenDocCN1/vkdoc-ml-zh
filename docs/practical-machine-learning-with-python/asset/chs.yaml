  \n注意\n\n我们在下一个示例（如图 12-9 所示）中使用的风格是葛饰北斋的著名画作《神奈川冲浪里》。该作品完成于 1830-32 年。看到这些才华横溢的艺术家的风格被迁移到日常照片中，真是令人惊叹。关于这幅作品的更多信息，请访问\
