  ### 神经网络与深度学习


  近年来，深度学习已成为机器学习最广为人知的代表之一。深度学习应用在多个领域，尤其是图像和音频相关领域，取得了显著的准确性和普及度。在学习深度网络和数据的复杂表示方面，Python
  是首选语言。在本节中，我们将简要讨论人工神经网络和深度学习网络。然后，我们将介绍 Python 中流行的深度学习框架。由于人工神经网络背后的数学相当高级，我们将保持介绍内容最少，并侧重于学习神经网络的实践方面。如果您对深度学习和神经网络的内部实现更感兴趣，我们建议您查阅一些标准文献，例如
  Goodfellow 和 Bengio 所著的《深度学习》。以下部分基于我们在第 1 章中详细讨论的内容，对神经网络和深度学习进行简要回顾。




  #### 人工神经网络


  深度学习可视为人工神经网络（ANN）的延伸。神经网络作为一种学习方法，最早由弗兰克·罗森布拉特于 1958 年提出，尽管当时被称为感知机的学习模型与现代神经网络有所不同，但我们仍可将感知机视为第一代人工神经网络。


  人工神经网络大致遵循学习数据分布式表征的原理。其基本假设是：生成的数据是若干潜在因子非线性组合的结果，如果我们能学习到这种分布式表征，就能对未知的新数据集做出准确预测。最简单的神经网络包含输入层、隐藏层（对输入数据应用非线性变换的结果）和输出层。ANN
  模型的参数包括网络中每条连接对应的权重，有时还包括偏置参数。这种简单神经网络如图 2-6 所示。


  ![A448827_1_En_2_Fig6_HTML.jpg](img/A448827_1_En_2_Fig6_HTML.jpg)


  图 2-6.


  一个简单的神经网络


  该网络包含一个大小为 3 的输入向量、一个大小为 4 的隐藏层，以及一个二元输出层。ANN 的学习过程包含以下步骤：


  1.  定义我们想要使用的网络结构或架构。这一步至关重要，因为如果我们选择了一个包含大量神经元/单元（图 2-6 中的每个圆圈都可称为神经元或单元）的庞大网络，就可能导致训练数据过拟合，模型泛化能力变差。

  2.  选择应用于每条连接的非线性变换。这种变换控制着网络中每个神经元的激活程度。

  3.  确定输出层使用的损失函数。这适用于监督学习问题，即每个输入数据点都对应一个输出标签的情况。

  4.  学习神经网络的参数，即确定每条连接权重的值。图 2-6 中的每条箭头都承载着一个连接权重。我们将通过某种优化算法和反向传播方法优化损失函数，从而学习这些权重。


  此处不深入探讨反向传播的细节，因为这超出了本章的范围。我们将在实际使用神经网络时再扩展这些主题。


  #### 深度神经网络


  深度神经网络是普通人工神经网络的延伸。与普通神经网络相比，深度神经网络有两个主要区别。


  ##### 层数


  普通神经网络是浅层的，最多只有一两个隐藏层。而深度神经网络的主要区别在于拥有更多的隐藏层，且这个数量通常非常庞大。例如，谷歌大脑项目使用的神经网络拥有数百万个神经元。


  ##### 多样化的架构


  基于我们在第 1 章讨论的内容，深度神经网络架构种类繁多，包括 DNN、CNN、RNN 和 LSTM。最近的研究甚至提出了基于注意力机制的网络，用于对深度神经网络的特定部分给予特殊关注。因此，借助深度学习，我们无疑已经超越了传统
  ANN 的架构。


  ##### 计算能力


  网络越大、层数越多，网络就越复杂，训练所需的时间和资源也越多。深度神经网络在基于 GPU 的架构上表现最佳，训练时间远少于传统 CPU，尽管近期的改进已大幅缩短了训练时间。


  #### 用于深度学习的 Python 库


  Python 是学术界和企业界开发及使用普通/深度神经网络的首选语言。我们将学习两个软件包——Theano 和 TensorFlow——它们能让我们在数据集上构建基于神经网络的模型。此外，我们还将学习使用
  Keras，这是一个用于轻松构建神经网络的高级接口，拥有简洁的 API，能够同时运行在 TensorFlow 和 Theano 之上。除此之外，还有一些优秀的深度学习框架。我们也建议你了解
  PyTorch、MXNet、Caffe（近期已发布 Caffe2）和 Lasagne。


  ##### Theano


  第一个广泛用于学习神经网络的库是 Theano。虽然 Theano 本身并非传统的机器学习或神经网络学习框架，但它提供了一套强大的构造，可用于训练普通机器学习模型和神经网络。Theano
  允许我们以符号方式定义数学函数，并自动推导其梯度表达式。这是学习任何机器学习模型时最常用的步骤之一。使用 Theano，我们可以用常规的符号表达式来描述学习过程，然后
  Theano 会生成执行这些步骤的优化函数。


  机器学习模型的训练是一个计算密集型过程。尤其是神经网络，由于涉及大量学习步骤和其中的非线性特性，对计算能力的要求很高。当我们决定学习深度神经网络时，这个问题会成倍增加。Theano
  在神经网络学习中如此重要的一个关键原因，在于它能够生成在 CPU 和 GPU 上无缝执行的代码。因此，如果我们使用 Theano 来定义机器学习模型，就能获得现代
  GPU 带来的速度优势。


  在本节的剩余部分，我们将了解如何安装 Theano，并使用 Theano 提供的表达式学习一个非常简单的神经网络。


  ###### 安装


  通过 Python 包管理器`pip`或`conda`可以轻松安装 Theano。


  ```

  pip install theano

  ```


  在 Windows 系统上，`pip`安装器常常会失败，因此我们建议在 Windows 平台上使用`conda install theano`。我们可以通过在
  Python shell 中导入新安装的包来验证安装是否成功。


  ```

  In [1]: import theano

  ```


  如果没有报错，则表明你已成功在系统中安装了`theano`库。




  ###### Theano 基础（精简版）


  在本节中，我们将讨论 `theano` 提供的符号计算能力的一些基础知识，以及如何利用这些能力构建一些简单的学习模型。我们不会在本节中直接使用 `theano`
  来构建神经网络，但您将了解如何在 `theano` 中执行符号运算。除此之外，您将在下一节中看到，当我们使用像 `keras` 这样的高级库时，构建神经网络会容易得多。


  Theano 使用一种称为张量的东西来表达符号表达式。张量最简单的定义是一个多维数组。因此，零阶张量数组是标量，一阶张量是向量，二阶张量是矩阵。


  现在我们来看看如何通过使用 `theano` 提供的结构来处理零阶张量或标量。


  ```

  In [3]: import numpy

  ...: import theano.tensor as T

  ...: from theano import function

  ...: x = T.dscalar(''x'')

  ...: y = T.dscalar(''y'')

  ...: z = x + y

  ...: f = function([x, y], z)

  ...: f(8, 2)

  Out[3]: array(10.0)

  ```


  在这里，我们定义了一个符号运算（用符号 `z` 表示），然后将输入和运算绑定到一个函数中。这是通过使用 `theano` 提供的 `function` 结构实现的。与常规编程范式相比，我们需要自己定义整个函数。这是使用像
  `theano` 这样的符号数学包最强大的方面之一。使用类似的结构，我们可以定义一组复杂的运算。


  图结构：Theano 将符号数学运算表示为图。因此，当我们像前面的例子那样定义一个运算（如 `z`）时，并不会发生计算，而是得到该表达式的图表示。这些图由 Apply、Op
  和变量节点组成。Apply 节点表示在某个变量节点集上应用某个 Op。因此，如果我们想将上一步定义的运算可视化为一个图，它看起来就像图 2-7 中描绘的那样。（来源：[`http://deeplearning.net/software/theano/extending/graphstructures.html`](http://deeplearning.net/software/theano/extending/graphstructures.html)）


  ![A448827_1_En_2_Fig7_HTML.jpg](img/A448827_1_En_2_Fig7_HTML.jpg)


  图 2-7.


  Theano 运算的图结构


  Theano 有各种低层级的张量 API，用于使用张量算术和 Op 构建神经网络架构。这些 API 位于 `theano.tensor.nnet` 模块中，您可以在
  [`http://deeplearning.net/software/theano/library/tensor/nnet/index.html`](http://deeplearning.net/software/theano/library/tensor/nnet/index.html)
  查看相关函数，其中包括用于卷积神经网络的 `conv` 和用于常规神经网络运算的 `nnet`。至此，我们对 `theano` 的基本介绍就结束了。我们保持简单，因为我们很少会直接使用
  `theano`，而是依赖像 `keras` 这样的高级库，用最少的代码构建强大的深度神经网络，并更专注于高效且有效地解决问题。


  ##### Tensorflow


  Tensorflow 是一个由谷歌于 2015 年 11 月发布的开源机器学习软件库。Tensorflow 基于谷歌为其研究及生产系统提供支持所使用的内部系统。Tensorflow
  与 Theano 非常相似，可以被视为谷歌试图通过提供易于使用的深度学习、神经网络和机器学习接口来升级 Theano 的一次尝试，其重点在于快速原型设计和模型部署结构。与
  Theano 一样，它也提供了符号数学的结构，这些结构随后会被转换为计算图。然后这些图被编译成低级代码并高效执行。与 `theano` 一样，`tensorflow`
  也无缝支持 CPU 和 GPU。事实上，`tensorflow` 在谷歌发明的张量处理单元（TPU）上运行效果最佳。除了拥有 Python API 之外，`tensorflow`
  还通过 API 支持 C++、Haskell、Java 和 Go 语言。与 `theano` 相比，`tensorflow` 的主要区别之一在于对高级运算的支持，这简化了机器学习的过程，并且它专注于模型开发以及部署到生产环境，并通过多种机制提供模型服务（[`https://www.tensorflow.org/serving/serving_basic`](https://www.tensorflow.org/serving/serving_basic)）。此外，`theano`
  的文档和使用方式不够直观，这也是 `tensorflow` 旨在通过其易于理解的实现和详尽的文档来填补的另一个领域。


  Tensorflow 提供的结构与 Theano 非常相似，因此我们不再赘述。您可以随时参考 [`https://www.tensorflow.org/`](https://www.tensorflow.org/)
  上提供的 `tensorflow` 文档以获取更多详细信息。


  ###### 安装


  Tensorflow 在 Linux 和 Mac 系统上运行良好，但由于内部依赖 Bazel，之前无法直接在 Windows 上使用。好消息是，它最近也成功地在
  Windows 平台上发布了。其运行至少需要 Python 3.5。该库可以通过使用 `pip` 或使用 `conda install` 函数来安装。请注意，为了成功安装
  Tensorflow，我们的系统上还需要更新 `dask` 和 `pandas` 库。


  ```

  conda install tensorflow

  ```


  安装完库之后，我们可以通过在 `ipython` 控制台中执行以下命令来验证安装是否成功。


  ```

  In [21]: import tensorflow as tf

  ...: hello = tf.constant(''Hello, TensorFlow!'')

  ...: sess = tf.Session()

  ...: print(sess.run(hello))


  b''Hello, TensorFlow!''

  ```


  这条消息验证了我们成功安装了 `tensorflow` 库。您可能还会看到一些警告消息，但可以安全地忽略它们。出现这些消息的原因是默认的 `tensorflow`
  构建没有包含对某些指令集的支持，这可能会稍微减慢学习过程。


  ##### Keras


  Keras 是一个用于 Python 的高级深度学习框架，能够运行在 Theano 和 Tensorflow 之上。由 Francois Chollet 开发，使用
  Keras 最重要的优势在于其易于使用但功能强大的高级 API 节省了时间，能够快速实现想法的原型设计。Keras 允许我们以更直观、更易用的方式使用 Tensorflow
  和 Theano 提供的结构，而无需编写过多的样板代码来构建基于神经网络的模型。这种灵活性和简洁性是 `keras` 广受欢迎的主要原因。除了提供对这两个有些深奥的库的便捷访问之外，`keras`
  还确保我们仍然能够利用这些库所提供的优势。在本节中，您将学习如何安装 Keras，了解使用 Keras 进行模型开发的基础知识，然后学习如何使用 `keras`
  和 `tensorflow` 开发一个示例神经网络模型。




  ###### 安装


  使用常见的 `pip` 或 `conda` 命令即可轻松安装 Keras。我们假设你已经安装了 `tensorflow` 和 `theano`，因为它们将作为
  `keras` 模型开发所需的后端。


  ```

  conda install keras

  ```


  我们可以通过在 `IPython` 中导入 `keras` 来检查它是否已成功安装到我们的环境中。导入成功后，它会显示当前的后端，默认情况下通常是 `theano`。因此，你需要找到位于用户账户目录下
  `.keras` 目录中的 `keras.json` 文件。我们的配置文件内容如下。


  ```

  {"epsilon": 1e-07, "floatx": "float32",

  "backend": "tensorflow", "image_data_format": "channels_last"}

  ```


  你可以参考 [`https://keras.io/backend/`](https://keras.io/backend/) ，该页面介绍了如何轻松地将 `keras`
  的后端从 `theano` 切换为 `tensorflow`。一旦在配置文件中指定了后端，在导入 `keras` 时，你应该会在 `ipython` shell
  中看到以下信息。


  ```

  In [22]: import keras

  Using TensorFlow backend

  ```


  ###### Keras 基础


  在 `keras` 中，神经网络的主要抽象概念是模型。模型是神经元的集合，它将定义神经网络的结构。有两种不同类型的模型：


  *   序贯模型：序贯模型只是层的堆叠。这些层可以共同定义一个神经网络。如果你回顾一下我们介绍神经网络时的图 2-6，该网络可以通过在序贯 `keras` 模型中指定三个层来定义。我们将在本节后面看到一个序贯模型的示例。

  *   函数式 API 模型：序贯模型非常有用，但有时我们的需求会超出序贯模型所能实现的结构。这时函数式模型 API 就派上用场了。该 API 允许我们指定复杂的网络，例如，可以具有多个输出的网络、具有共享层的网络等。当我们需要使用高级神经网络（如卷积神经网络或循环神经网络）时，就需要这类模型。


  ###### 模型构建


  使用 `keras` 构建模型是一个三步过程。第一步是指定模型的结构。这是通过配置我们想要使用的基础模型来完成的，该模型可以是序贯模型或函数式模型。一旦我们为问题确定了基础模型，我们将通过向模型添加层来进一步丰富该模型。我们将从输入层开始，将输入数据的特征向量馈送到该层。后续要添加到模型中的层取决于模型的需求。`keras`
  提供了许多可以添加到模型中的层（隐藏层、全连接层、CNN、LSTM、RNN 等），我们将在运行神经网络示例时介绍其中一些层。我们可以以复杂的方式将这些层堆叠在一起，并添加最终的输出层，从而得到我们的整体模型架构。


  模型学习过程的下一步是编译我们在第一步中定义的模型架构。根据我们在前面关于 Theano 和 Tensorflow 的章节中学到的知识，大多数模型构建步骤都是符号化的，实际的学习过程会推迟到后面进行。在编译步骤中，我们配置学习过程。除了模型的结构之外，学习过程还需要指定以下三个额外的重要参数：


  *   优化器：我们在第一章中学到，学习过程最简单的解释是损失函数的优化。一旦我们有了模型和损失函数，我们就可以指定优化器，它将确定我们实际使用的优化算法或程序，以训练模型并最小化损失或误差。这可以是一个指向已实现优化器的字符串标识符、一个函数，或者一个指向我们可以实现的优化器类的对象。

  *   损失函数：损失函数，也称为目标函数，将指定最小化损失/误差的目标，我们的模型将利用它来在多个周期/迭代中获得最佳性能。它同样可以是一个指向某些预实现损失函数（如交叉熵损失（分类）或均方误差（回归））的字符串标识符，也可以是我们自己开发的自定义损失函数。

  *   性能指标：指标是学习过程的可量化度量。在编译模型时，我们可以指定一个想要跟踪的性能指标（例如，分类模型的准确率），这将让我们了解学习过程的有效性。这有助于评估模型性能。


  模型构建过程的最后一步是执行编译后的方法以开始训练过程。这将执行底层编译后的代码，以在训练过程中找出我们模型所需的参数和权重。在 `keras` 中，与 `scikit-learn`
  类似，这是通过调用模型上的 `fit` 函数来实现的。我们可以通过提供适当的参数来控制该函数的行为。你可以在 [`https://keras.io/models/sequential/`](https://keras.io/models/sequential/)
  了解这些参数。




  ###### 学习一个示例神经网络


  在本节最后，我们将使用 `scikit-learn` 包自带的一个数据集，构建一个简单的工作神经网络模型。我们的示例将使用 `tensorflow` 后端，但你也可以尝试使用
  `theano` 后端，并验证模型在两个后端上的执行情况。


  在我们的示例中，将使用 `scikit-learn` 库自带的威斯康星州乳腺癌数据集。该数据集包含从乳腺肿块细针抽吸物的数字化图像中提取的属性，描述了图像中细胞核的特征。根据这些属性，肿块可以被标记为恶性或良性。我们分类系统的目标是预测这一级别。那么，让我们从加载数据集开始。


  ```

  In [33]: from sklearn.datasets import load_breast_cancer

  ...: cancer = load_breast_cancer()

  ...:

  ...: X_train = cancer.data[:340]

  ...: y_train = cancer.target[:340]

  ...:

  ...: X_test = cancer.data[340:]

  ...: y_test = cancer.target[340:]

  ```


  下一步是使用 `keras` 模型类定义模型架构。我们看到输入向量有 30 个属性，因此我们将构建一个浅层网络，其中包含一个具有一半单元（神经元）的隐藏层，即隐藏层有
  15 个单元。我们添加一个单单元的输出层，根据输入数据点是良性还是恶性来预测 1 或 0。这是一个简单的神经网络，不涉及深度学习。


  ```

  In [39]: import numpy as np

  ...: from keras.models import Sequential

  ...: from keras.layers import Dense, Dropout

  ...:

  In [40]: model = Sequential()

  ...: model.add(Dense(15, input_dim=30, activation=''relu''))

  ...: model.add(Dense(1, activation=''sigmoid''))

  ```


  这里我们定义了一个顺序 `keras` 模型，它有一个包含 15 个单元的密集隐藏层。密集层意味着全连接层，因此这 15 个单元（神经元）中的每一个都与 30
  个输入特征完全连接。我们示例中的输出层是一个带有 sigmoid 激活函数的密集层。sigmoid 激活函数用于将实值输入转换为二进制输出（1 或 0）。定义模型后，我们将通过提供必要的优化器、损失函数以及评估模型性能的指标来编译模型。


  ```

  In [41]: model.compile(loss=''binary_crossentropy'', optimizer=''rmsprop'', metrics=[''accuracy''])

  ```


  这里我们使用了 `binary_crossentropy` 损失函数，这是二分类问题的标准损失函数。对于优化器，我们使用了 `rmsprop`，它是普通梯度下降算法的升级版。下一步是使用
  `fit` 函数拟合模型。


  ```

  In [41]: model.fit(X_train, y_train, epochs=20, batch_size=50)

  Epoch 1/20

  340/340 [==============================] - 0s - loss: 7.3616 - acc: 0.5382

  Epoch 2/20

  340/340 [==============================] - 0s - loss: 7.3616 - acc: 0.5382

  ...

  Epoch 19/20

  340/340 [==============================] - 0s - loss: 7.3616 - acc: 0.5382

  Epoch 20/20

  340/340 [==============================] - 0s - loss: 7.3616 - acc: 0.5382

  ```


  这里，`epochs` 参数表示所有训练样本的一次完整前向和反向传播。`batch_size` 参数表示在训练模型和更新梯度时，一次前向和反向传播中通过神经网络模型传播的样本总数。因此，如果你有
  100 个观测值，批次大小为 10，那么每个 epoch 将由 10 次迭代组成，每次迭代有 10 个观测值（数据点）通过网络，并更新隐藏层单元的权重。然而，我们可以看到整体损失和训练准确率保持不变。这意味着模型从表面上看并没有真正学到任何东西！


  `keras` 的 API 再次遵循了 `scikit-learn` 模型的约定，因此我们可以使用 predict 函数来预测测试集中的数据点。实际上，我们使用
  `predict_classes` 来获取为每个测试数据实例预测的实际类别标签。


  ```

  In [43]: predictions = model.predict_classes(X_test)

  128/229 [===============>..............] - ETA: 0s

  ```


  让我们通过查看测试数据准确率以及其他性能指标（如精确率、召回率和 F1 分数）来评估模型性能。如果你不理解其中一些术语，请不要灰心，我们将在第 5 章中详细介绍。现在，你应该知道分数越接近
  1 表示结果越好，即准确率为 1 表示 100%的模型准确率，这是完美的。幸运的是，`scikit-learn` 为我们提供了必要的性能指标测量 API。


  ```

  In [44]: from sklearn import metrics

  ...: print(''Accuracy:'', metrics.accuracy_score(y_true=y_test, y_pred=predictions))

  ...: print(metrics.classification_report(y_true=y_test, y_pred=predictions))score

  Accuracy: 0.759825327511

  precision    recall  f1-score   support

  0       0.00      0.00      0.00        55

  1       0.76      1.00      0.86       174

  avg / total       0.58      0.76      0.66       229

  ```


  从之前的性能指标可以看出，尽管模型准确率为 76%，但对于患有癌症（恶性）即标签为 0 的数据点，它将其错误分类为 1（55 个实例），而对于其余 174 个类别标签为
  1（良性）的实例，它则完美分类。因此，这个模型并没有学到太多东西，并将每个响应都预测为良性（标签 1）。我们能做得比这更好吗？




  ###### 深度学习的力量


  深度学习的理念是利用多个隐藏层来学习潜在且复杂的数据模式、关系与表征，从而构建一个能够良好学习并泛化于底层数据的模型。我们沿用之前的示例，通过引入两个额外的隐藏层，将其转换为全连接深度神经网络（DNN）。以下代码片段构建并训练了一个
  DNN，其配置与之前的实验相同，仅增加了两个新的隐藏层。


  ```

  In [45]: model = Sequential()

  ...: model.add(Dense(15, input_dim=30, activation=''relu''))

  ...: model.add(Dense(15, activation=''relu''))

  ...: model.add(Dense(15, activation=''relu''))

  ...: model.add(Dense(1, activation=''sigmoid''))

  ...:

  ...: model.compile(loss=''binary_crossentropy'',

  ...:               optimizer=''rmsprop'',

  ...:               metrics=[''accuracy''])

  ...:

  ...: model.fit(X_train, y_train,

  ...:           epochs=20,

  ...:           batch_size=50)

  ...:

  Epoch 1/20

  340/340 [==============================] - 0s - loss: 3.3799 - acc: 0.3941

  Epoch 2/20

  340/340 [==============================] - 0s - loss: 1.3740 - acc: 0.6059

  Epoch 3/20

  340/340 [==============================] - 0s - loss: 0.4258 - acc: 0.8471

  ...

  Epoch 19/20

  340/340 [==============================] - 0s - loss: 0.2361 - acc: 0.9235

  Epoch 20/20

  340/340 [==============================] - 0s - loss: 0.3154 - acc: 0.9000

  ```


  根据上述训练输出，我们观察到训练准确率显著提升，损失值则有所下降。这确实非常出色，前景可期！现在，我们来检验模型在测试数据上的表现。


  ```

  In [46]: predictions = model.predict_classes(X_test)

  ...: print(''Accuracy:'', metrics.accuracy_score(y_true=y_test, y_pred=predictions))

  ...: print(metrics.classification_report(y_true=y_test, y_pred=predictions))score

  Accuracy: 0.912663755459

  precision    recall  f1-score   support

  0       0.78      0.89      0.83        55

  1       0.96      0.92      0.94       174

  avg / total       0.92      0.91      0.91       229

  ```


  我们获得了 91%的整体准确率和 F1 分数，并且可以看到，对于类别标签 0（恶性），F1 分数达到了 83%，而之前的模型为 0%。因此，通过在我们的网络中仅增加更多隐藏层，就能让模型学习到更好的数据表征，从而清晰感受到深度学习的力量。尝试探索其他架构，或引入诸如
  dropout 之类的正则化方法。


  因此，在本节中，你了解了一些与神经网络和深度学习相关的重要框架。在后续章节中，当我们处理实际案例研究时，将重新探讨这些框架的更高级方面。


  ### 文本分析与自然语言处理


  到目前为止，我们主要处理的是结构化数据格式和数据集，即数据中观测值以行形式出现，每个观测值的特征或属性以列形式出现。这种格式对机器学习算法最为便利，但问题在于原始数据并非总是以这种易于解释的格式呈现。音频、视频、文本数据集等非结构化数据格式就是这种情况。在本节中，我们将简要概述当处理的数据是非结构化文本数据时，可用于解决此问题的框架。我们不会深入探讨使用这些框架的详细示例，如果你感兴趣，建议查阅本书的第
  7 章，该章涉及一个分析文本数据的实际案例研究。


  #### 自然语言工具包


  Python 中处理文本数据最重要的库或许是 NLTK，即自然语言工具包。本节将介绍 NLTK 及其重要模块。我们将介绍该库的安装过程，并简要描述其重要模块。


  ##### 安装与介绍


  `nltk`包的安装方式与本书中使用的大多数其他包相同，即使用`pip`或`conda`命令。


  ```

  conda install nltk

  ```


  我们可以通过在`IPython`/Python shell 中导入该包来验证安装。


  ```

  In [1]: import nltk

  ```


  与其他标准库相比，`nltk`库有一个重要区别。对于其他库，通常我们不需要下载任何辅助数据。但要让`nltk`库充分发挥其潜力，我们需要一些辅助数据，这些数据主要是各种语料库。库中的多个函数和模块会利用这些数据。我们可以通过在
  Python shell 中执行以下命令来下载这些数据。


  ```

  In [5]: nltk.download()

  ```


  此命令将显示如图 2-8 所示的界面，我们可以在其中选择要安装的附加数据并选择安装位置。我们将选择安装所有可用的附加数据和包。


  ![A448827_1_En_2_Fig8_HTML.jpg](img/A448827_1_En_2_Fig8_HTML.jpg)


  图 2-8.


  nltk 下载选项


  你也可以选择不使用 GUI，而是通过 ipython 或 Python shell 中的以下命令下载所有必要的数据集。


  ```

  nltk.download(''all'', halt_on_error=False)

  ```


  下载完成后，我们将能够使用`nltk`包的所有必要功能及其捆绑数据。现在，我们将查看`nltk`库的主要模块，并介绍每个模块提供的功能。


  ##### 语料库


  任何文本分析过程的起点都是将感兴趣的文档收集到单个数据集中的过程。该数据集对于后续的处理和分析步骤至关重要。这个文档集合通常称为语料库。多个语料库数据集称为 corpora。`nltk`模块`nltk.corpus`提供了必要的函数，可用于读取各种格式的语料库文件。它支持从`nltk`包中捆绑的数据集以及外部语料库中读取语料库。


  ##### 分词


  分词是文本预处理和标准化中的核心步骤之一。每个文本文档都有多个组成部分，如段落、句子和单词，它们共同构成文档。分词过程用于将文档分解为这些更小的组成部分。这种分词可以分解为句子、单词、从句等。最流行的文档分词方式是使用句子分词和/或单词分词。`nltk`库的`nltk.tokenize`模块提供了能够高效分词任何文本数据的功能。


  ##### 词性标注


  文本文档是基于各种语法规则和结构构建的。语法取决于文本文档的语言。每种语言的语法都包含不同的实体和词性，如名词、代词、形容词、副词等。词性标注过程包括获取文本语料库、对文本进行分词，并为语料库中的每个单词分配元数据信息（如标签）。`nltk.tag`模块包含了可用于此类标注及相关活动的不同算法的实现。




  ##### 词干提取与词形还原


  一个单词根据其词性可能具有多种不同形式。以单词“fly”为例，它在同一文本中可能出现 flying、flies、flyer 等多种形式。词干提取的过程是将单词的所有不同形式转换为基础形式，即所谓的词根步骤。词形还原与词干提取类似，但其基础形式被称为词元，并且始终是一个在语义和词典学上正确的单词。这种转换至关重要，因为很多时候核心词汇包含了关于文档的更多信息，而这些信息可能会被不同的单词形式所稀释。`nltk`
  模块中的 `nltk.stem` 包含了可用于对语料库进行词干提取和词形还原的不同技术。


  ##### 组块分析


  组块分析是一个类似于解析或分词的过程，但主要区别在于，它不是试图解析每个单词，而是针对文档中的短语。考虑句子“The brown fox saw the yellow
  dog”。在这个句子中，有两个我们感兴趣的短语。第一个是短语“the brown fox”，这是一个名词短语；第二个是短语“the yellow dog”，同样也是一个名词短语。通过使用组块分析过程，我们能够为短语标记额外的词性信息，这对于理解文档结构非常重要。`nltk`
  模块中的 `nltk.chunk` 包含了可用于将组块分析过程应用于我们语料库的必要技术。


  ##### 情感分析


  情感或情绪分析是文本数据中最具代表性的应用之一。情感分析是指获取文本文档并试图确定该文档所代表的观点和极性的过程。在文本文档的语境中，极性可以指数据所代表的情感，例如正面、负面或中性。对文本数据的情感分析可以使用不同的算法，并在不同的文本分割层级上进行。`nltk.sentiment`
  包是可用于对文本文档执行不同情感分析的模块。请查看第 7 章，了解关于情感分析的真实案例研究！


  ##### 分类/聚类


  正如我们在第一章中解释的那样，文本文档的分类是一个监督学习问题。文本文档的分类可能涉及学习多个文本文档（语料库）的情感、主题、题材、类别等，然后使用训练好的模型在未来对未知文档进行标注。与普通结构化数据的主要区别在于我们将使用的非结构化文本的特征表示形式。聚类涉及基于某种相似性度量（如余弦相似度、bm25
  距离，甚至语义相似度）将相似的文档分组在一起。一旦我们完成了必要的特征工程和提取，通常使用 `nltk.classify` 和 `nltk.cluster` 模块来执行这些操作。


  #### 其他文本分析框架


  通常，`nltk` 是我们处理文本数据的首选库，但 Python 生态系统中也包含其他可用于处理文本数据的有用库。我们将简要介绍其中一些库，以便您能很好地掌握在处理非结构化文本数据时可以使用的工具包。


  *   `pattern`：`pattern` 框架是 Python 编程语言的一个网络挖掘模块。它拥有用于网络挖掘（从 Google、Twitter 提取数据，网络爬虫，或
  HTML DOM 解析器）、信息检索、自然语言处理、机器学习、情感分析和网络分析以及可视化的工具。遗憾的是，`pattern` 目前在 Python 2.7 上运行效果最佳，并且没有官方的
  Python 3.x 移植版本。

  *   `gensim`：`gensim` 框架（意为生成相似）是一个 Python 库，其核心目标是进行大规模主题建模！这可用于从文档中提取语义主题。`gensim`
  的重点是提供高效的主题建模和相似性分析。它还包含了 Google 流行的 `word2vec` 模型的 Python 实现。

  *   `textblob`：这是另一个承诺简化文本处理的 Python 库。它提供了一个简单的 API 用于执行常见的文本处理任务，包括词性标注、分词、短语提取、情感分析、分类、翻译等等！

  *   `spacy`：这是 Python 文本处理领域的新成员，但尽管如此，它仍是一个出色且健壮的框架。`spacy` 专注于工业级强度的自然语言处理，因此它针对大规模语料库的高效文本分析。它通过在
  Cython 中精心管理内存操作来实现这种效率。我们推荐使用 `spacy` 进行自然语言处理，您还会在第 7 章中看到它被广泛用于我们的文本规范化过程。


  ### Statsmodels


  Statsmodels 是一个用于在 Python 中进行统计和计量经济学分析的库。像 R 这样的语言的优势在于它是一种专注于统计的语言，具有很多功能。它包含易于使用但功能强大的模型，可用于统计分析和建模。然而，从部署、集成和性能方面来看，数据科学家和工程师通常更喜欢
  Python，但它不具备像 R 那样易于使用的统计函数和库的强大功能。`statsmodels` 库旨在为 Python 用户弥合这一差距。它提供了统计、金融和计量经济学操作的能力，旨在将
  Python 的优势与 R 等语言的统计能力相结合。因此，熟悉 R、SAS、Stata、SPSS 等工具并希望在 Python 中获得类似功能的用户可以使用 `statsmodels`。最初的
  `statsmodel` 包是由斯坦福大学的统计学家 Jonathan Taylor 开发的，作为 SciPy 的一部分，名为 `models`。改进此代码库随后被接受为
  2009 年（以及 2010 年）谷歌编程之夏中一个专注于 SciPy 的项目。当前包可作为 SciKit 或 SciPy 的附加包使用。我们建议您阅读 Seabold、Skipper
  和 Josef Perktold 的论文《Statsmodels: Econometric and statistical modeling with Python》，该论文发表于
  2010 年第 9 届 Python 科学会议论文集。


  #### 安装


  该包可以使用 `pip` 或 `conda install` 以及以下命令进行安装。


  ```

  pip install statsmodels

  conda install -c conda-forge statsmodels

  ```


  #### 模块


  在本节中，我们将简要介绍构成 `statsmodel` 包的重要模块以及这些模型提供的功能。这应该能让您充分了解可以利用哪些工具来构建统计模型并执行统计分析和推断。


  ##### 分布


  统计学中的核心概念之一是统计数据集的分布。分布是一种列表或函数，它为数据的所有可能值分配一个概率值。`statsmodels` 包的 `distributions`
  模块实现了一些与统计分布相关的重要函数，包括从分布中抽样、分布的变换、生成重要分布的累积分布函数等。




  ##### 线性回归


  线性回归是统计建模中最简单的形式，用于建立响应因变量与一个或多个自变量之间的关系模型，其中响应变量通常服从正态分布。`statsmodels.regression`
  模块允许我们在具有独立同分布（IID）误差的数据上学习线性模型。该模块支持使用普通最小二乘法（OLS）、加权最小二乘法（WLS）、广义最小二乘法（GLS）等多种方法来估计线性模型参数。


  ##### 广义线性模型


  当因变量服从非正态分布时，可以对普通线性回归进行推广。`statsmodels.genmod` 模块允许我们将普通线性模型扩展到不同的响应变量。当因变量服从非正态分布时，该模块使我们能够预测自变量与因变量之间的线性关系。


  ##### 方差分析


  方差分析是一系列统计过程，用于分析组均值之间的差异及其相关程序。方差分析是检验多个组的均值是否相等的重要方法。它在假设检验和统计推断中是一种极为强大的工具，并在
  `statsmodels` 包的 `anova_lm` 模块中实现。


  ##### 时间序列分析


  时间序列分析是数据分析的重要组成部分。许多数据源，如股票价格、降雨量、人口统计等，本质上具有周期性。时间序列分析用于发现这些数据流中的结构、趋势和模式。这些趋势可用于通过数学模型理解潜在现象，甚至对未来事件进行预测和预报。基本的时间序列模型包括单变量自回归模型（AR）、向量自回归模型（VAR）、单变量自回归移动平均模型（ARMA），以及非常流行的自回归积分滑动平均模型（ARIMA）。`statsmodels`
  包的 `tsa` 模块提供了时间序列模型的实现，同时也提供了时间序列数据操作的工具。


  ##### 统计推断


  传统统计推断的一个重要部分是假设检验过程。统计假设是关于总体参数的假设。假设检验是根据从总体中抽取的样本所收集的观测数据，接受或拒绝关于数据所做假设的正式过程。`statsmodels`
  包的 `stats.stattools` 模块实现了最重要的假设检验。其中一些检验独立于任何模型，而另一些则仅与特定模型相关联。


  ##### 非参数方法


  非参数统计是指不基于任何参数化概率分布族的统计方法。当我们对随机变量的分布做出假设时，我们会指定确定其行为所需的参数数量。例如，如果我们说某个感兴趣的指标服从正态分布，这意味着如果我们能够确定该指标的均值和方差，就能理解其行为。这是非参数方法的关键区别，即描述一个未知随机变量所需的参数数量不是固定的，而是取决于训练数据量。`statsmodels`
  库中的 `nonparametric` 模块将帮助我们对其数据执行非参数分析。它包括单变量和多变量数据的核密度估计、核回归以及局部加权散点图平滑。


  ## 总结


  本章介绍了一组精选的包，我们将常规使用它们来处理、分析和建模数据。你可以将这些库和框架视为数据科学家工具箱中的核心工具。我们涵盖的包列表远非详尽，但它们无疑是最重要的包。我们强烈建议你通过阅读相关文档和教程来进一步熟悉这些包。在后续章节中，我们将继续介绍和解释这些框架的其他重要特性和方面。本章中的示例，结合第一章提供的概念知识，应能让你很好地掌握机器学习，并以简单明了的方式解决问题。在后续章节中，我们将观察到，对数据学习模型的过程往往是这些简单步骤和概念的重复。在下一章中，你将学习如何运用这套工具来解决数据处理、整理和可视化领域中更大、更复杂的问题。


