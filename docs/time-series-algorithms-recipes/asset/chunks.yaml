    \n**Figure 1-11** Monthly level box plot\n\nThe box plot shows a seasonal component\
    \ each year, with a swing from May to August.\n\n## Recipe 1-5A. Time Series Decomposition:\
    \ Additive Model\n\n### Problem\n\nYou want to learn how to decompose a time series\
