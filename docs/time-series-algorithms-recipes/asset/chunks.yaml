    1981-01-05    15.8

    Name: Temp, dtype: float64

    ```


    #### 步骤 3A-3\. 绘制时间序列图。


    现在，让我们绘制时间序列数据以检测模式。


    ```

    data.plot()

    plt.ylabel(''最低气温'')

    plt.title(''1981 年至 1990 年南半球最低气温'')

    plt.show()

