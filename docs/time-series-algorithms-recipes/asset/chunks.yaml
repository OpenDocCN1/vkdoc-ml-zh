    ## Recipe 1-6. Visualization of Seasonality


    ### Problem


    You want to learn how to visualize the seasonality component.


    ### Solution


    Let’s look at a few additional methods to visualize and detect seasonality. The
    retail turnover data shows the seasonality component per quarter.


    ### How It Works


    The following steps load and visualize the time series (i.e., the seasonality
    component).


    #### Step 6-1. Import the required libraries.


    ```

    import pandas as pd

    import matplotlib.pyplot as plt

    ```


    #### Step 6-2. Load the data.


    ```

    turn_over_data = pd.read_csv(''./data/RetailTurnover.csv'')

    ```


    #### Step 6-3. Process the data.


    ```

    date_range = pd.date_range(start=''1/7/1982'', end=''31/3/1992'', freq=''Q'')

    turn_over_data[''TimeIndex''] = pd.DataFrame(date_range, columns=[''Quarter''])

    ```


    #### Step 6-4. Pivot the table.


    Now let’s pivot the table such that quarterly information is in the columns, yearly
    information is in the rows, and the values consist of turnover information.


    ```

    quarterly_turn_over_data = pd.pivot_table(turn_over_data, values = "Turnover",
    columns = "Quarter", index = "Year")

    quarterly_turn_over_data

    ```


    Figure [1-16](#540422_1_En_1_Chapter.xhtml#Fig16) shows the output by quarterly
    turnover.


    ![](images/540422_1_En_1_Chapter/540422_1_En_1_Fig16_HTML.jpg)


    Figure 1-16


    Quarterly turnover output


    #### Step 6-5. Plot the line charts.


    Let’s plot line plots for the four quarters.


    ```

    quarterly_turn_over_data.plot()

    plt.show()

    ```


    Figure [1-17](#540422_1_En_1_Chapter.xhtml#Fig17) shows the quarter-level line
    plots.


    ![](images/540422_1_En_1_Chapter/540422_1_En_1_Fig17_HTML.jpg)


    Figure 1-17


    Quarterly turnover line chart


    #### Step 6-6. Plot the box plots.


    Let’s also plot the box plot at the quarterly level.


    ```

    quarterly_turn_over_data.boxplot()

    plt.show()

    ```


    Figure [1-18](#540422_1_En_1_Chapter.xhtml#Fig18) shows the output of the box
    plot by quarter.


    ![](images/540422_1_En_1_Chapter/540422_1_En_1_Fig18_HTML.jpg)


    Figure 1-18


    Quarterly level box plot


    Looking at both the box plot and the line plot, you can conclude that the yearly
    turnover is significantly high in the first quarter and is quite low in the second
    quarter.


    # 2. Statistical Univariate Modeling


    Univariate time series data analysis is the most popular type of temporal data,
    where a single numeric observation is recorded sequentially over equal time periods.
    Only the variable observed and its relation to time is considered in this analysis.


    The forecasting of future values of this univariate data is done through univariate
    modeling. In this case, the predictions are dependent only on historical values.
    The forecasting can be done through various statistical methods. This chapter
    goes through a few important ones.


    The following recipes for performing univariate statistical modeling are covered.


    - Recipe 2-1. Moving Average (MA) Forecast

    - Recipe 2-2. Autoregressive (AR) Model

    - Recipe 2-3. Autoregressive Moving Average (ARMA) Model

    - Recipe 2-4. Autoregressive Integrated Moving Average (ARIMA) Model

    - Recipe 2-5. Grid search Hyperparameter Tuning for Autoregressive Integrated
    Moving Average (ARIMA) Model

    - Recipe 2-6. Seasonal Autoregressive Integrated Moving Average (SARIMA) Model

    - Recipe 2-7. Simple Exponential Smoothing (SES) Model

    - Recipe 2-8. Holt-Winters (HW) Model


    ## Recipe 2-1. Moving Average (MA) Forecast


    ### Problem


    You want to load time series data and forecast using a *moving average*.


    ### Solution


    A moving average is a method that captures the average change in a metric over
    time. For a particular window length, which is a short period/range in time, you
    calculate the mean target value, and then this window is moved across the entire
    period of the data, from start to end. It is usually used to smoothen the data
    and remove any random fluctuations.


    Let’s use the `pandas` rolling mean function to get the moving average.'
