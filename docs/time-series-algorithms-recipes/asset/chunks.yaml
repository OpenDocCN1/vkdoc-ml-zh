    # 3. Advanced Univariate and Statistical Multivariate Modeling


    Chapter [2](#540422_1_En_2_Chapter.xhtml) explored various recipes for implementing
    univariate statistical modeling in Python. A few more advanced techniques are
    explored in this chapter, as well as modeling another type of temporal data—the
    multivariate time series. Multivariate time series contains additional time-dependent
    features that impact your target, apart from the date and time. The various statistical
    methods and recipes for implementing multivariate modeling in Python are explored.


    This chapter covers the following recipes for performing advanced univariate and
    statistical multivariate modeling.


    *   Recipe 3-1\. FBProphet Univariate Time Series Modeling


    *   Recipe 3-2\. FBProphet Modeling by Controlling the Change Points


    *   Recipe 3-3\. FBProphet Modeling by Adjusting Trends


    *   Recipe 3-4\. FBProphet Modeling with Holidays


    *   Recipe 3-5\. FBProphet Modeling with Added Regressors


    *   Recipe 3-6\. Time Series Forecasting Using Auto-ARIMA


    *   Recipe 3-7\. Multivariate Time Series Forecasting Using the VAR Model


    ## Recipe 3-1\. FBProphet Univariate Time Series Modeling


