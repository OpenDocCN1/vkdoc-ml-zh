    ## Recipe 1-3B. Exploring Types of Time Series Data: Multivariate


    ### Problem


    You want to load and explore multivariate time series data.


    ### Solution


    A *multivariate time series* is a type of time series data with more features
    that the target depends on, which are also time-dependent; that is, the target
    is not only dependent on its past values. This relationship is used to forecast
    the target values.


    Let’s load and explore a Beijing pollution dataset, which is multivariate.


    ### How It Works


    The following steps read and plot the multivariate data.


    #### Step 3B-1. Import the required libraries.


    ```

    import pandas as pd

    from datetime import datetime

    import matplotlib.pyplot as plt

    ```


    #### Step 3B-2. Write the parsing function.


    Before loading the raw dataset and parsing the datetime information as the pandas
    dataframe index, let’s first write a parsing function.


    ```

    def parse(x):

    return datetime.strptime(x, ''%Y %m %d %H'')

    ```


    #### Step 3B-3. Load the dataset.


    ```

    data1 = pd.read_csv(''./data/raw.csv'',  parse_dates = [[''year'', ''month'',
    ''day'', ''hour'']],

    index_col=0, date_parser=parse)

    ```


    #### Step 3B-4. Do basic preprocessing.


    Drop the `No` column.


    ```

    data1.drop(''No'', axis=1, inplace=True)

    ```


    Manually specify each column name.


    ```

    data1.columns = [''pollution'', ''dew'', ''temp'', ''press'', ''wnd_dir'', ''wnd_spd'',
    ''snow'', ''rain'']

    data1.index.name = ''date''

    ```


    Let’s mark all NA values with 0.


    ```

    data1[''pollution''].fillna(0, inplace=True)

    ```


    Drop the first 24 hours.


    ```

    data1 = data1[24:]

    ```


    Summarize the first five rows.


    ```

    print(data1.head(5))

    ```


    The output is as follows.


    ```

    pollution  dew  temp   press wnd_dir  wnd_spd  snow  rain

    date

    2010-01-02 00:00:00      129.0  -16  -4.0  1020.0      SE     1.79     0     0

    2010-01-02 01:00:00      148.0  -15  -4.0  1020.0      SE     2.68     0     0

    2010-01-02 02:00:00      159.0  -11  -5.0  1021.0      SE     3.57     0     0

    2010-01-02 03:00:00      181.0   -7  -5.0  1022.0      SE     5.36     1     0

    2010-01-02 04:00:00      138.0   -7  -5.0  1022.0      SE     6.25     2     0

    ```


    This information is from a dataset on the pollution and weather conditions in
    Beijing. The time aggregation of the recordings was hourly and measured for five
    years. The data includes the datetime column, the pollution metric known as PM2.5
    concentration, and some critical weather information, including temperature, pressure,
    and wind speed.


    #### Step 3B-5. Plot each series.


    Now let’s plot each series as a separate subplot, except wind speed direction,
    which is categorical.


    ```

    vals = data1.values

