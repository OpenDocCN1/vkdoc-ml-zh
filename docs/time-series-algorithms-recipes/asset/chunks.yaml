    In the Auto-ARIMA model, the lowercase `p`, `d`, and `q` values indicate the non-seasonal
    components. The uppercase `P`, `D`, and `Q` values indicate seasonal components.
    It works similarly to hypertuning techniques to find the optimal value of `p`,
    `d`, and `q` with different combinations. The final values are determined with
    the lower AIC and BIC parameters considered.


    Let’s try `p`, `d`, and `q` values ranging from 0 to 5 to get the best values
    from the model.


    ```

    #model building with parameters

    auto_arima_model = auto_arima(train_data, start_p = 0, d=1, start_q = 0, max_p
    = 5, max_d = 5,

    max_q= 5, start_P = 0, D=1, start_Q = 0, max_P = 5, max_D = 5,

    max_Q= 5, m=12, seasonal = True, error_action = ''warn'', trace = True, supress_warnings=
    True,

    stepwise = True, random_state =20, n_fits = 50)

    ```


