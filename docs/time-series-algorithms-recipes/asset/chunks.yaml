    *单变量时间序列*是指仅包含一个随时间变化变量的数据。


    让我们来看一个示例数据集，该数据集记录了 1981 年至 1990 年南半球每月的最低气温。其中，气温是随时间变化的目标变量。


    ### 工作原理


    以下步骤用于读取并绘制单变量数据。


    #### 步骤 3A-1\. 导入所需的库。


    ```

    import pandas as pd

    import matplotlib.pyplot as plt

    ```


    #### 步骤 3A-2\. 读取时间序列数据。


    ```

    data = pd.read_csv(''./data/daily-minimum-temperatures.csv'', header = 0, index_col
    = 0, parse_dates = True, squeeze = True)

    print(data.head())

    ```


    输出结果如下。


    ```

    Date

    1981-01-01    20.7

    1981-01-02    17.9

