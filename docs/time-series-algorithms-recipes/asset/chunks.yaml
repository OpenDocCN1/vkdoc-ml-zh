    # 5. Deep Learning–based Time Series Forecasting


    Deep learning methods offer much promise for time series forecasting, such as
    automatic learning of temporal dependence and automatic processing of temporal
    structures such as trends and seasonality.


    Due to the increasing availability of data and computing power in recent years,
    Deep learning has become an essential part of the new generation of time series
    forecasting models and has achieved excellent results.


    While in classical machine learning models—such as autoregressive models (AR)
    or exponential smoothing—feature engineering is done manually, some parameters
    are often optimized with domain knowledge in mind. Deep learning models learn
    features and dynamics only and directly from data. Thanks to this, they speed
    up the data preparation process and can comprehensively learn more complex data
    patterns.


    This chapter includes the following topics.


    *   Recipe 5-1\. Time Series Forecasting Using LSTM


    *   Recipe 5-2\. Multivariate Time Series Forecasting Using the GRU Model


    *   Recipe 5-3\. Time Series Forecasting Using NeuralProphet


    *   Recipe 5-4\. Time Series Forecasting Using RNN


    ## Recipe 5-1\. Time Series Forecasting Using LSTM


