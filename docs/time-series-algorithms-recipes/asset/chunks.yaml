    \ shows that the trend is linearly increasing, and there is constant linear seasonality.\n\
    \n#### Step 5A-4. Decompose the time series.\n\nLet’s decompose the time series\
    \ by trends, seasonality, and residuals.\n\n```python\ndecomp_turn_over = sm.tsa.seasonal_decompose(turn_over_data.Turnover,\
    \ model=\"additive\", freq=4)\ndecomp_turn_over.plot()\nplt.show()\n```\n\nFigure\
    \ [1-13](#540422_1_En_1_Chapter.xhtml#Fig13) shows the time series decomposition\
    \ output.\n\n![](images/540422_1_En_1_Chapter/540422_1_En_1_Fig13_HTML.jpg)\n\n\
    **Figure 1-13** Time series decomposition output\n\n#### Step 5A-5. Separate the\
    \ components.\n\nYou can get the trends, seasonality, and residuals as separate\
    \ series with the following.\n\n```python\ntrend = decomp_turn_over.trend\nseasonal\
    \ = decomp_turn_over.seasonal\nresidual = decomp_turn_over.resid\n```\n\n## Recipe\
    \ 1-5B. Time Series Decomposition: Multiplicative Model\n\n### Problem\n\nYou\
    \ want to learn how to decompose a time series using multiplicative model decomposition.\n\
    \n### Solution\n\n*   A multiplicative model suggests that the components are\
