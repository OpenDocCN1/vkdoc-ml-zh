- fmt: '# 4. Machine Learning Regression–based Forecasting


    The previous chapters explained how to forecast future values using time series
    algorithms. Again, in time series modeling, there are two types of time series:
    univariate and multivariate. For more information, please refer to Chapters [2](#540422_1_En_2_Chapter.xhtml)
    and [3](#540422_1_En_3_Chapter.xhtml).


    This chapter aims to build classical machine learning (ML) regression algorithms
    for time series forecasting. Machine learning–based forecasting is powerful because
    forecasting takes other factors/features to forecast the values.


    The chapter focuses on building regressor models for forecasting.


    - Recipe 4-1. Formulating Regression Modeling for Time Series Forecasting

    - Recipe 4-2. Implementation of the XGBoost Model

    - Recipe 4-3. Implementation of the LightGBM Model

    - Recipe 4-4. Implementation of the Random Forest Model

    - Recipe 4-5. Selecting the Best Model


    ## Recipe 4-1. Formulating Regression Modeling for Time Series Forecasting


    ### Problem


    You want to formulate regression models for time series forecasting.


    ### Solution


    The following are the basic steps for machine learning regression–based forecasting.


    1. Data collection

    2. Data cleaning and preprocessing

    3. Feature selection

    4. Train–test–validation split

    5. Model building

    6. Evaluation

    7. Prediction


    Figure [4-1](#540422_1_En_4_Chapter.xhtml#Fig1) shows the steps to build ML regression–based
    forecasting.


    ![](images/540422_1_En_4_Chapter/540422_1_En_4_Fig1_HTML.jpg)


    Figure 4-1


    Output


    ### How It Works


    The following steps build regressor models.


    #### Step 1-1. Install and import the required libraries.


    Let’s import all the required libraries.


    ```

    #import libraries

    import pandas as pd

    import numpy as np

    import glob

    import time

    from sklearn.feature_selection import SelectKBest

    from sklearn.feature_selection import f_regression

    import xgboost as xgb

    from lightgbm import LGBMRegressor

    from sklearn.ensemble import RandomForestRegressor

    from sklearn.metrics import mean_squared_error

    from plotly.offline import init_notebook_mode, iplot

    import plotly.graph_objs as go

    from plotly import tools

    init_notebook_mode(connected=True)

    from sklearn.metrics import mean_squared_error

    ```


    #### Step 1-2. Collect the data.


    This chapter uses electricity consumption data. Please find the dataset on GitHub.


    The following code reads the data.


    ```

    df = pd.read_csv(''train_6BJx641.csv'')

    df.head()

    ```


    Figure [4-2](#540422_1_En_4_Chapter.xhtml#Fig2) shows the first five rows of the
    data.


    ![](images/540422_1_En_4_Chapter/540422_1_En_4_Fig2_HTML.jpg)


    Figure 4-2


    Output


    #### Step 1-3. Preprocess the data and create features (feature engineering).


    Before building any model, checking the data quality and preprocessing as per
    the model requirement is a must.


    So, let’s see what cleaning and preprocessing are required.


    The dataset consists of an ID column that cannot be fed into the model, so let’s
    drop the ID column first.


    ```

    del df[''ID'']

    ```


    Let’s check the missing values.


    ```

    df.isnull().sum()

    ```


    Figure [4-3](#540422_1_En_4_Chapter.xhtml#Fig3) shows the output of the nulls.


    ![](images/540422_1_En_4_Chapter/540422_1_En_4_Fig3_HTML.jpg)


    Figure 4-3


    Output


    The output is as follows.


    There are no missing values present in any of the columns, so treating them is
    not required.


    Now, let’s check the datatype of each column.


    ```

    df.info()

    ```


    Figure [4-4](#540422_1_En_4_Chapter.xhtml#Fig4) shows the output of each column
    datatype.


    ![](images/540422_1_En_4_Chapter/540422_1_En_4_Fig4_HTML.jpg)


    Figure 4-4


    Output


    Let’s convert the date column into the pandas datetime format and create features
    (known as *feature engineering*).


    ```

    #Creating datetime features to use in the model to capture seasonality

    df[''time''] = pd.to_datetime(df[''datetime''])

    df[''year''] = df.time.dt.year

    df[''month''] = df.time.dt.month

    df[''day''] = df.time.dt.day

    df[''hour''] = df.time.dt.hour

    df.drop(''time'', axis=1, inplace=True)

    df.head()

    ```


    Figure [4-5](#540422_1_En_4_Chapter.xhtml#Fig5) shows the output of the first
    five rows after creating datetime features.


    ![](images/540422_1_En_4_Chapter/540422_1_En_4_Fig5_HTML.jpg)


    Figure 4-5


    Output


    Let’s sort the dataframe using the datetime column and then drop it because it
    is not considered in model building.


    ```

    #sorting

    df=df.sort_values(by=''datetime'')

    #Deleting the column

    del df[''datetime'']

    ```


    Figure [4-6](#540422_1_En_4_Chapter.xhtml#Fig6) shows the output of the first
    five rows after sorting and deleting the datetime column.


    ![](images/540422_1_En_4_Chapter/540422_1_En_4_Fig6_HTML.jpg)


    Figure 4-6


    Output


    The year, month, day, and hour columns are created using the datetime column and
    considering them to build the model to capture trend and seasonality. Likewise,
    you can add lag features of the target variable as features.


    *Piece of code to create lag features: `df[''lag1'']=df[''col name''].shift(1)`*


    The dataset consists of one categorical feature so let’s encode using the one-hot
    method.


    ```

    #convering all categorical columns to numerical.

    df1=pd.get_dummies(df)

    ```


    Figure [4-7](#540422_1_En_4_Chapter.xhtml#Fig7) shows the output of the first
    five rows after encoding.


    ![](images/540422_1_En_4_Chapter/540422_1_En_4_Fig7_HTML.jpg)


    Figure 4-7


    Output


    The `get_dummies` method is used here. It is defined in pandas to encode all categorical
    columns into numerical ones. There is only one column in this dataset.


    The required cleaning and preprocessing are done. Next, let’s focus on feature
    selection.


    #### Step 1-4. Select the features.


    To build supervised ML models, you need to consider those features that are significant
    to the target feature.


    To get the significant features to build the model, you can perform advanced statistical
    tests like Anova, chi-squared, and correlation, or there is a built-in function
    defined in sklearn called `SelectKBest`, which helps you select features by providing
    scores for each column.


    Before using `SelectKBest`, let’s create separate objects for all independent
    and target features.


    ```

    #creating target and features objects

    x = df1.drop(columns=[''electricity_consumption''])

    y = df1.iloc[:,4]

    ```


    Now, let’s fit `SelectKBest`.


    ```

    #implementing selectKbest

    st=time.time()

    bestfeatures = SelectKBest(score_func=f_regression)

    fit = bestfeatures.fit(x,y)

    et=time.time()-st

    print(et)

    dfscores = pd.DataFrame(fit.scores_)

    dfcolumns = pd.DataFrame(x.columns)

    featureScores = pd.concat([dfcolumns,dfscores],axis=1)

    featureScores.columns = [''Featuress'',''Score'']

    best_features=featureScores.nlargest(5,''Score'')

    best_features

    ```


    Figure [4-8](#540422_1_En_4_Chapter.xhtml#Fig8) shows the output of the top five
    features.


    ![](images/540422_1_En_4_Chapter/540422_1_En_4_Fig8_HTML.jpg)


    Figure 4-8


    Output


    The `n` value is 5, so five features with a score are shown.'
