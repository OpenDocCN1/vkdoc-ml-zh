- fmt: '#### Step 1-5. Work on the train-test and validation split.


    The feature selection part is done. So now, let’s split the dataset for model
    building. You can use the built-in function to split the data. But since this
    is a forecasting problem, you don’t want it to split randomly. The latest date
    records should go into the validation set. Beginning records should go into the
    training set. Middle records into the test set.


    Let’s use the basic pandas method to split the data.


    ```

    # train-test-validation split

    test=df1.tail(7940)

    #test set

