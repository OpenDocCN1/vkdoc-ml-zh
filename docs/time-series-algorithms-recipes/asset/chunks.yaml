    # 3. 高级单变量与统计多变量建模


    第 2 章探讨了在 Python 中实现单变量统计建模的各种配方。本章将探讨一些更高级的技术，以及对另一种时间数据类型——多变量时间序列的建模。多变量时间序列除了日期和时间之外，还包含影响目标变量的其他时间相关特征。本章将探讨在
    Python 中实现多变量建模的各种统计方法和配方。


    本章涵盖以下用于执行高级单变量和统计多变量建模的配方。


