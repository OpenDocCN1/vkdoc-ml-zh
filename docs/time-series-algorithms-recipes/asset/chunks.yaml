    model.add(LSTM(40,activation="tanh",return_sequences=True))

    model.add(Dropout(0.15))

    model.add(LSTM(40,activation="tanh",return_sequences=False))

    model.add(Dropout(0.15))

    model.add(Dense(1))

    ```


