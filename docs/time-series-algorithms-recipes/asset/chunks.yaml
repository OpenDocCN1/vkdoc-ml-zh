    # Preface


    Before reading this book, you should have a basic knowledge of statistics, machine
    learning, and Python programming. If you want to learn how to build basic to advanced
    time series forecasting models, then this book will help by providing recipes
    for implementation in Python. By the end of the book, you will have practical
    knowledge of all the different types of modeling methods in time series.


    The desire to know the unknown and to predict the future has been part of human
    culture for ages. This desire has driven mankind toward the discipline of forecasting.
    Time series forecasting predicts unknown future data points based on the data''s
    previous (past) observed pattern. It can depend not only on the previous target
    points and time (univariate) but also on other independent variables (multivariate).
    This book is a cookbook containing various recipes to handle time series forecasting.


    Data scientists starting a new time series project but don’t have prior experience
    in this domain can easily utilize the various recipes in this book, which are
    domain agnostic, to kick-start and ease their development process.


    This book is divided into five chapters. Chapter [1](#540422_1_En_1_Chapter.xhtml)
    covers recipes for reading and processing the time series data and basic Exploratory
    Data Analysis (EDA). The following three chapters cover various forecasting modeling
    techniques for univariate and multivariate datasets. Chapter [2](#540422_1_En_2_Chapter.xhtml)
    has recipes for multiple statistical univariate forecasting methods, with more
    advanced techniques continued in Chapter [3](#540422_1_En_3_Chapter.xhtml). Chapter
    3 also covers statistical multivariate methods. Chapter [4](#540422_1_En_4_Chapter.xhtml)
    covers time series forecasting using machine learning (regression-based). Chapter
    [5](#540422_1_En_5_Chapter.xhtml) is on advanced time series modeling methods
    using deep learning.


    The code for all the implementations in each chapter and the required datasets
    is available for download at `github.com/apress/time-series-algorithm-recipes`.


    # About the Authors


    # About the Technical Reviewer


    # 1. Getting Started with Time Series


    A *time series* is a sequence of time-dependent data points. For example, the
    demand (or sales) for a product in an e-commerce website can be measured temporally
    in a time series, where the demand (or sales) is ordered according to the time.
    This data can then be analyzed to find critical temporal insights and forecast
    future values, which helps businesses plan and increase revenue.


    Time series data is used in every domain where real-time analytics is essential.
    Analyzing this data and forecasting its future value has become essential to these
    domains.


    Time series analysis/forecasting was previously considered a purely statistical
    problem. It is now used in many machine learning and deep learning–based solutions,
    which perform equally well or even outperform most other solutions. This book
    uses various methods and approaches to analyze and forecast time series.


    This chapter uses recipes to read/write time series data and perform simple preprocessing
    and Exploratory Data Analysis (EDA).


    The following lists the recipes explored in this chapter.


    *   Recipe 1-1. Reading Time Series Objects

    *   Recipe 1-2. Saving Time Series Objects

    *   Recipe 1-3. Exploring Types of Time Series Data

    *   Recipe 1-4. Time Series Components

    *   Recipe 1-5. Time Series Decomposition

    *   Recipe 1-6. Visualization of Seasonality


    ## Recipe 1-1A. Reading Time Series Objects (Air Passengers)


    ### Problem


    You want to read and load time series data into a dataframe.


    ### Solution


    `Pandas` load the data into a dataframe structure.


    ### How It Works


    The following steps read the data.


    #### Step 1A-1. Import the required libraries.


    ```

    import pandas as pd

    import matplotlib.pyplot as plt

    ```


    #### Step 1A-2. Write a parsing function for the datetime column.


    Before reading the data, let’s write a parsing function.


    ```

    date_parser_fn = lambda dates: pd.datetime.strptime(dates, ''%Y-%m'')

    ```


    #### Step 1A-3. Read the data.


    Read the air passenger data.


    ```

    data = pd.read_csv(''./data/AirPassenger.csv'', parse_dates = [''Month''], index_col
    = ''Month'', date_parser = date_parser_fn)

    plt.plot(data)

    plt.show()

    ```


    Figure [1-1](#540422_1_En_1_Chapter.xhtml#Fig1) shows the time series plot output.


    ![](images/540422_1_En_1_Chapter/540422_1_En_1_Fig1_HTML.jpg)


    **Figure 1-1** Output


    The following are some of the important input arguments for `read_csv`.


    *   `parse_dates` mentions the datetime column in the dataset that needs to be
    parsed.

    *   `index_col` mentions the column that is a unique identifier for the pandas
    dataframe. In most time series use cases, it’s the datetime column.

    *   `date_parser` is a function to parse the dates (i.e., converts an input string
    to datetime format/type). `pandas` reads the data in `YYYY-MM-DD HH:MM:SS` format.
    Convert to this format when using the parser function.


    ## Recipe 1-1B. Reading Time Series Objects (India GDP Data)


    ### Problem


    You want to save the loaded time series dataframe in a file.


    ### Solution


    Save the dataframe as a comma-separated (CSV) file.


    ### How It Works


    The following steps read the data.


    #### Step 1B-1. Import the required libraries.


    ```

    import pandas as pd

    import matplotlib.pyplot as plt

    import pickle

    ```


    #### Step 1B-2. Read India’s GDP time series data.


    ```

    indian_gdp_data = pd.read_csv(''./data/GDPIndia.csv'', header=0)

    date_range = pd.date_range(start=''1/1/1960'', end=''31/12/2017'', freq=''A'')

    indian_gdp_data [''TimeIndex''] = pd.DataFrame(date_range, columns=[''Year''])

    indian_gdp_data.head(5).T

    ```


    #### Step 1B-3. Plot the time series.


    ```

    plt.plot(indian_gdp_data.TimeIndex, indian_gdp_data.GDPpercapita)

    plt.legend(loc=''best'')

    plt.show()

    ```


    Figure [1-2](#540422_1_En_1_Chapter.xhtml#Fig2) shows the output time series.


    ![](images/540422_1_En_1_Chapter/540422_1_En_1_Fig2_HTML.jpg)


    **Figure 1-2** Output


    #### Step 1B-4. Store and retrieve as a pickle.


    ```

    ### Store as a pickle object

    import pickle

    with open(''gdp_india.obj'', ''wb'') as fp:

    pickle.dump(IndiaGDP, fp)

    ### Retrieve the pickle object

    with open(''gdp_india.obj'', ''rb'') as fp:

    indian_gdp_data1 = pickle.load(fp)

    indian_gdp_data1.head(5).T

    ```


    Figure [1-3](#540422_1_En_1_Chapter.xhtml#Fig3) shows the retrieved time series
    object transposed.


    ![](images/540422_1_En_1_Chapter/540422_1_En_1_Fig3_HTML.jpg)


    **Figure 1-3** Output


    ## Recipe 1-2. Saving Time Series Objects


    ### Problem


    You want to save a loaded time series dataframe into a file.


    ### Solution


    Save the dataframes as a CSV file.'
