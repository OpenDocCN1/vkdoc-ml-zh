  ## 配方 3-7\. 使用 VAR 模型进行多元时间序列预测


  ### 问题


  您想要加载时间序列数据并使用多个特征进行预测。


  ### 解决方案


  使用 statsmodels 中定义的向量自回归（VAR）模型可以轻松实现。


  ### 工作原理


  以下步骤读取数据并使用 VAR 模型进行预测。


  #### 步骤 7-1\. 导入所需的库。


  ```

