  #### 步骤 5A-4\. 分解时间序列。


  让我们将时间序列分解为趋势、季节性和残差。


  ```

  decomp_turn_over = sm.tsa.seasonal_decompose(turn_over_data.Turnover, model="additive",
  freq=4)

