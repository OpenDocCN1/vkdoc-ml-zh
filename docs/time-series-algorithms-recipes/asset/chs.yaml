  #### 步骤 1-5：处理训练集、测试集和验证集的划分。


  特征选择部分已完成。现在，我们来划分数据集以进行模型构建。你可以使用内置函数来分割数据。但由于这是一个预测问题，我们不希望随机分割。最新的日期记录应归入验证集，最早的记录应归入训练集，中间的记录则归入测试集。


