- '# 4. 基于机器学习回归的预测


  前几章介绍了如何使用时间序列算法预测未来值。同样，在时间序列建模中，有两种类型的时间序列：单变量和多变量。更多信息请参考第 2 章和第 3 章。


  本章旨在构建用于时间序列预测的经典机器学习回归算法。基于机器学习的预测之所以强大，是因为它能够利用其他因素/特征来预测数值。


  本章重点介绍如何构建用于预测的回归模型。


  *   方法 4-1. 为时间序列预测构建回归模型


  *   方法 4-2. 实现 XGBoost 模型


  *   方法 4-3. 实现 LightGBM 模型


  *   方法 4-4. 实现随机森林模型


  *   方法 4-5. 选择最佳模型


  ## 方法 4-1. 为时间序列预测构建回归模型


  ### 问题


  您希望为时间序列预测构建回归模型。


  ### 解决方案


  以下是基于机器学习回归的预测的基本步骤。


  1.  数据收集

  2.  数据清洗与预处理

  3.  特征选择

  4.  训练-测试-验证集划分

  5.  模型构建

  6.  评估

  7.  预测


