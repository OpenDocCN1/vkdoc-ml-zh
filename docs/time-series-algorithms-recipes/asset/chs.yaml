  ## 配方 1-3A. 探索时间序列数据类型：单变量


  ### 问题


  您希望加载并探索单变量时间序列数据。


  ### 解决方案


  *单变量时间序列*是指仅包含一个随时间变化变量的数据。


  让我们来看一个示例数据集，该数据集记录了 1981 年至 1990 年南半球每月的最低气温。其中，气温是随时间变化的目标变量。


  ### 工作原理


  以下步骤用于读取并绘制单变量数据。


  #### 步骤 3A-1\. 导入所需的库。


  ```

  import pandas as pd

  import matplotlib.pyplot as plt

  ```


  #### 步骤 3A-2\. 读取时间序列数据。


  ```

  data = pd.read_csv(''./data/daily-minimum-temperatures.csv'', header = 0, index_col
  = 0, parse_dates = True, squeeze = True)

  print(data.head())

  ```


  输出结果如下。


  ```

  Date

  1981-01-01    20.7

  1981-01-02    17.9

  1981-01-03    18.8

  1981-01-04    14.6

  1981-01-05    15.8

  Name: Temp, dtype: float64

  ```


  #### 步骤 3A-3\. 绘制时间序列图。


  现在，让我们绘制时间序列数据以检测模式。


  ```

  data.plot()

  plt.ylabel(''最低气温'')

  plt.title(''1981 年至 1990 年南半球最低气温'')

  plt.show()

  ```


  图 1-4 显示了输出的时间序列图。


  ![](img/540422_1_En_1_Fig4_HTML.jpg)


  图 1-4


  时间序列图


  这被称为*单变量时间序列分析*，因为只使用了一个变量，即气温（过去 19 年的温度）。


  ## 配方 1-3B. 探索时间序列数据类型：多变量


  ### 问题


  您希望加载并探索多变量时间序列数据。


  ### 解决方案


  *多变量时间序列*是一种时间序列数据类型，其目标变量依赖更多的特征，这些特征也随时间变化；也就是说，目标变量不仅依赖于其过去的值。这种关系用于预测目标值。


  让我们加载并探索一个北京污染数据集，该数据集是多变量的。


  ### 工作原理


  以下步骤用于读取并绘制多变量数据。


  #### 步骤 3B-1\. 导入所需的库。


  ```

  import pandas as pd

  from datetime import datetime

  import matplotlib.pyplot as plt

  ```


  #### 步骤 3B-2\. 编写解析函数。


  在加载原始数据集并将日期时间信息解析为 pandas 数据框索引之前，我们先编写一个解析函数。


  ```

  def parse(x):

  return datetime.strptime(x, ''%Y %m %d %H'')

  ```


  #### 步骤 3B-3\. 加载数据集。


  ```

  data1 = pd.read_csv(''./data/raw.csv'',  parse_dates = [[''year'', ''month'', ''day'',
  ''hour'']],

  index_col=0, date_parser=parse)

  ```


  #### 步骤 3B-4\. 进行基本预处理。


  删除“No”列。


  ```

  data1.drop(''No'', axis=1, inplace=True)

  ```


  手动指定每一列的名称。


  ```

  data1.columns = [''污染'', ''露点'', ''气温'', ''气压'', ''风向'', ''风速'', ''降雪'', ''降雨'']

  data1.index.name = ''日期''

  ```


  将所有缺失值标记为 0。


  ```

  data1[''污染''].fillna(0, inplace=True)

  ```


  删除前 24 小时的数据。


  ```

  data1 = data1[24:]

  ```


  汇总前五行数据。


  ```

  print(data1.head(5))

  ```


  输出结果如下。


  ```

  污染  露点  气温   气压 风向  风速  降雪  降雨

  日期

  2010-01-02 00:00:00      129.0  -16  -4.0  1020.0      SE     1.79     0     0

  2010-01-02 01:00:00      148.0  -15  -4.0  1020.0      SE     2.68     0     0

  2010-01-02 02:00:00      159.0  -11  -5.0  1021.0      SE     3.57     0     0

  2010-01-02 03:00:00      181.0   -7  -5.0  1022.0      SE     5.36     1     0

  2010-01-02 04:00:00      138.0   -7  -5.0  1022.0      SE     6.25     2     0

  ```


  这些信息来自一个关于北京污染和天气状况的数据集。记录的时间粒度为每小时一次，持续测量了五年。数据包括日期时间列、污染指标（即 PM2.5 浓度）以及一些关键的天气信息，包括气温、气压和风速。


  #### 步骤 3B-5\. 绘制每个序列的图表。


  现在，让我们将每个序列绘制为单独的子图，但风向除外，因为它是分类变量。


  ```

  vals = data1.values

  # 指定要绘制的列

  group_list = [0, 1, 2, 3, 5, 6, 7]

  i = 1

  # 绘制每一列

  plt.figure()

  for group in group_list:

  plt.subplot(len(group_list), 1, i)

  plt.plot(vals[:, group])

  plt.title(data1.columns[group], y=0.5, loc=''right'')

  i += 1

  plt.show()

  ```


