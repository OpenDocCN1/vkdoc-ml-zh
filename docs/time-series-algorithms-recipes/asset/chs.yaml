  ## 配方 3-2\. 通过控制变点进行 FBProphet 建模


  ### 问题


  您希望使用 Facebook Prophet 模型进行预测，并调整变点。


  ### 解决方案


  变点是时间序列中检测到突变的确切点。默认情况下，在时间序列的前 80% 中，变点数量设置为 25。让我们通过调整 `n_change_points` 和 `changepoint_range`
  参数来调整这些默认值，以控制预测输出。


  ### 工作原理


  以下步骤使用 FBProphet 进行预测并调整变点。


  本配方同样使用了配方 3-1 中的步骤 1-1 至 1-6。




  #### 步骤 2-1\. 绘制变化点。


  让我们在预测图中绘制基础 Prophet 模型的变化点。


  ```

  plot3 = basic_prophet_model.plot(forecast_df)

  adding_changepoints = add_changepoints_to_plot(plot3.gca(), basic_prophet_model,
  forecast_df)

