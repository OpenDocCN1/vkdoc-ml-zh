  \n### 问题\n\n您希望加载单变量时间序列数据，并使用 NeuralProphet 进行预测。\n\n### 解决方案\n\n通过使用内置包可以轻松实现。\n\
  \n\n\n### 工作原理\n\n以下步骤使用 NeuralProphet 读取数据并进行预测。\n\n#### 步骤 3-1. 导入所需的库。\n\n```\n\
  #import all the required libraries\nimport pandas as pd\nfrom neuralprophet import\
  \ NeuralProphet\nimport matplotlib.pyplot as plt\n```\n\n#### 步骤 3-2. 读取数据。\n\n\
  从 Git 链接下载数据。\n\n以下代码用于读取数据。在读取数据时，我们解析日期列。\n\n```\n#read data\ndf_np = pd.read_csv(\"\
  ./DailyDelhiClimateTrain.csv\",\nparse_dates=[\"date\"])\n```\n\n#### 步骤 3-3. 预处理数据。\n\
  \n我们根据 NeuralProphet 的要求对数据进行预处理。\n\n由于是单变量预测，我们只选择一个特征与日期列一起进行预测。\n\n此外，NeuralProphet\
  \ 要求日期列命名为 \"ds\"，目标列命名为 \"y\"。\n\n```\n#Data pre-process\ndf_np = df_np[[\"date\"\
  , \"meantemp\"]]\ndf_np.rename(columns={\"date\": \"ds\", \"meantemp\": \"y\"},\
  \ inplace=True)\n```\n\n#### 步骤 3-4. 构建模型并进行预测。\n\n我们初始化 NeuralProphet 模型，并定义所有参数，包括附加信息。如果你打算使用默认变量，请使用\
  \ `model = NeuralProphet()`。\n\n```\n# model = NeuralProphet() if you're using default\
  \ variables below.\nmodel = NeuralProphet(\ngrowth=\"linear\",  # 确定趋势类型：'linear',\
  \ 'discontinuous', 'off'\nchangepoints=None, # 可能包含变化点的日期列表（None -> 自动）\nn_changepoints=5,\n\
  changepoints_range=0.8,\ntrend_reg=0,\ntrend_reg_threshold=False,\nyearly_seasonality=\"\
  auto\",\nweekly_seasonality=\"auto\",\ndaily_seasonality=\"auto\",\nseasonality_mode=\"\
  additive\",\nseasonality_reg=0,\nn_forecasts=1,\nn_lags=0,\nnum_hidden_layers=0,\n\
  d_hidden=None,     # AR-Net 隐藏层的维度\nlearning_rate=None,\nepochs=40,\nloss_func=\"\
  Huber\",\nnormalize=\"auto\",  # 归一化类型 ('minmax', 'standardize', 'soft', 'off')\n\
  impute_missing=True,\n)\n```\n\n模型初始化后，我们拟合模型并进行预测。\n\n```\n#make predictions\n\
  metrics = model.fit(df_np, freq=\"D\")\nfuture = model.make_future_dataframe(df_np,\
  \ periods=365, n_historic_predictions=len(df_np))\nforecast = model.predict(future)\n\
  ```\n\n图 5-19 显示了模型的输出。\n\n![](img/540422_1_En_5_Fig19_HTML.jpg)\n\n图 5-19\n\n输出\n\
  \n现在，我们绘制图表以查看预测值。\n\n```\n##forecast plot\nfig, ax = plt.subplots(figsize=(14,\
  \ 10))\nmodel.plot(forecast, xlabel=\"Date\", ylabel=\"Temp\", ax=ax)\nax.set_title(\"\
  Mean Temperature in Delhi\", fontsize=28, fontweight=\"bold\")\n```\n\n图 5-20 显示了预测值与实际值的对比图。\n\
  \n![](img/540422_1_En_5_Fig20_HTML.jpg)\n\n图 5-20\n\n输出\n\n显示了最近一年的预测图。预测值的时间范围为\
  \ 2017 年至 2018 年。预测值与历史值相似，这意味着模型已经捕捉到了季节性和线性趋势。\n\n你还可以绘制模型参数。\n\n```\n##plotting\
  \ model parameters\nmodel.plot_parameters()\n```\n\n图 5-21 显示了模型参数图。\n\n![](img/540422_1_En_5_Fig21_HTML.jpg)\n\
  \n图 5-21\n\n输出\n\n使用平均绝对误差（MAE）绘制的模型损失如下所示。你也可以使用平滑 L1 损失函数。\n\n```\n###ploting\
  \ Evaluation\nfig, ax = plt.subplots(figsize=(14, 10))\nax.plot(metrics[\"MAE\"\
  ], 'ob', linewidth=6)\nax.plot(metrics[\"RMSE\"], '-r', linewidth=2)\n```\n\n图 5-22\
  \ 显示了模型评估图。\n\n![](img/540422_1_En_5_Fig22_HTML.jpg)\n\n图 5-22\n\n输出\n\n## 方法 5-4.\
  \ 使用 RNN 进行时间序列预测\n\n### 问题\n\n你想要加载时间序列数据，并使用*循环神经网络*（RNN）进行预测。\n\n### 解决方案\n\n\
  通过使用 Keras 中定义的内置方法可以轻松实现。\n\n### 工作原理\n\n以下步骤使用 RNN 读取数据并进行预测。\n\n方法 5-1 中的步骤 1-1\
  \ 到 1-9 也适用于本方法。\n\n#### 步骤 4-1. 初始化 RNN 模型。\n\n```\nmodel = Sequential()\nmodel.add(LSTM(40,activation=\"\
  tanh\",return_sequences=True, input_shape=(train_X.shape[1],1)))\nmodel.add(Dropout(0.15))\n\
  model.add(LSTM(40,activation=\"tanh\",return_sequences=True))\nmodel.add(Dropout(0.15))\n\
  model.add(LSTM(40,activation=\"tanh\",return_sequences=False))\nmodel.add(Dropout(0.15))\n\
  model.add(Dense(1))\n```\n\n#### 步骤 4-2. 创建模型摘要。\n\n```\nmodel.summary()\n```\n\n\
  图 5-23 显示了模型摘要。\n\n![](img/540422_1_En_5_Fig23_HTML.jpg)\n\n图 5-23\n\n输出\n\n####\
  \ 步骤 4-3. 拟合模型。\n\n```\nmodel.compile(optimizer=\"adam\",loss=\"MSE\")\nmodel.fit(train_X,\
  \ train_y, epochs=10, batch_size=1000)\n```\n\n图 5-24 显示了第 1 到第 10 个训练周期。\n\n![](img/540422_1_En_5_Fig24_HTML.jpg)\n\
  \n图 5-24\n\n输出\n\n#### 步骤 4-4. 进行模型预测并打印评分。\n\n```\npredictions = model.predict(test_X)\n\
  score = r2_score(test_y,predictions)\nprint(\"R-Squared Score of RNN model = \"\
  ,score)\n```\n\n输出如下。\n\n```\nR-Squared Score of RNN model =  0.9466957722475382\n\
  ```\n\n#### 步骤 4-5 与方法 5-1 中的步骤 1-14 相同。\n\n\n\n\n#### 步骤 4-6\\. 调用 `plotting_actual_vs_pred`\
  \ 函数。\n\n```\nplotting_actual_vs_pred(test_y, predictions, \"Predictions made by\
  \ simple RNN model\")\n```\n\n图 5-25 展示了实际值与预测值的对比图。\n\n![](img/540422_1_En_5_Fig25_HTML.jpg)\n\
