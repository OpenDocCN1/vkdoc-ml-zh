  \ n_in=1, n_out=1, dropnan=True):\nn_vars = 1 if type(data) is list else data.shape[1]\n\
  df = pd.DataFrame(data)\ncols, names = list(), list()\n# 输入序列 (t-n, ... t-1)\nfor\
  \ i in range(n_in, 0, -1):\ncols.append(df.shift(i))\nnames += [(\"var%d(t-%d)\"\
  \ % (j+1, i)) for j in range(n_vars)]\n# 预测序列 (t, t+1, ... t+n)\nfor i in range(0,\
  \ n_out):\ncols.append(df.shift(-i))\nif i == 0:\nnames += [(\"var%d(t)\" % (j+1))\
  \ for j in range(n_vars)]\nelse:\nnames += [(\"var%d(t+%d)\" % (j+1, i)) for j in\
  \ range(n_vars)]\n# 合并所有列\nagg = pd.concat(cols, axis=1)\nagg.columns = names\n\
  # 删除包含 NaN 值的行\nif dropnan:\nagg.dropna(inplace=True)\nreturn agg\n# 调用函数\n# 构建监督学习框架\n\
  # 重塑为 X=t 和 Y=t+1\ni_in  = 100 # 过去观测值数量\nn_out = 1 # 未来观测值数量\nreframed = series_to_supervised(scaled,\
  \ i_in, n_out)\nprint(\"将数据集表示为监督学习问题：\\n\",reframed.head(10))\n```\n\n输出结果如下。\n\
