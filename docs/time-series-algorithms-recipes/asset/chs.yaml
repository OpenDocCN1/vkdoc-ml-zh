  ## 配方 1-4A. 时间序列成分：趋势


  ### 问题


  您希望从趋势开始，找出时间序列的成分。


  ### 解决方案


  *趋势*是指数据在特定方向上的整体运动，即数值在一段时间内上升（增加）或下降（减少）。


  让我们使用一个洗发水销售数据集，该数据集包含三年内每月的销售数量。


  ### 工作原理


  以下步骤用于读取并绘制数据。


  #### 步骤 4A-1\. 导入所需的库。


  ```

  import pandas as pd

  import matplotlib.pyplot as plt

  ```


  #### 步骤 4A-2\. 编写解析函数。


  ```

  def parsing_fn(x):

  return datetime.strptime(''190''+x, ''%Y-%m'')

  ```


  #### 步骤 4A-3\. 加载数据集。


  ```

  data = pd.read_csv(''./data/shampoo-sales.csv'', header=0, parse_dates=[0], index_col=0,
  squeeze=True, date_parser= parsing_fn)

  ```


  #### 步骤 4A-4\. 绘制时间序列图。


  ```

  data.plot()

  plt.show()

  ```


