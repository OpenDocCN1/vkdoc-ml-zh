  在图 3-18 中，蓝色线条代表训练集，橙色线条代表测试集。




  #### 步骤 6-7\. 构建 Auto-ARIMA 模型。


  在 Auto-ARIMA 模型中，小写的 p、d、q 值表示非季节性成分。大写的 P、D、Q 值表示季节性成分。它的工作原理类似于超参数调优技术，通过不同的组合来寻找
  p、d、q 的最优值。最终值根据所考虑的较低 AIC 和 BIC 参数来确定。


  让我们尝试 p、d、q 值从 0 到 5 的范围，以从模型中获得最佳值。


  ```

  #model building with parameters

  auto_arima_model = auto_arima(train_data, start_p = 0, d=1, start_q = 0, max_p =
  5, max_d = 5,

  max_q= 5, start_P = 0, D=1, start_Q = 0, max_P = 5, max_D = 5,

  max_Q= 5, m=12, seasonal = True, error_action = ''warn'', trace = True, supress_warnings=
  True,

  stepwise = True, random_state =20, n_fits = 50)

  ```


