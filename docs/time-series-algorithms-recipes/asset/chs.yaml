  #### 步骤 3-7\. 从训练集中定义实际值。


  ```

  actuals = train_data[''BTC-USD'']

  ```


  #### 步骤 3-8\. 初始化并拟合 ARMA 模型。


  ```

  ARMA_model = ARIMA(actuals, order = (1, 0, 1))

  ARMA_model = ARMA_model.fit()

