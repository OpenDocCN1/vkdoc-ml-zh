- '# 第五部分

  编排智能系统


  编排智能系统


  第 [22](https://doi.org/10.1007/978-1-4842-3366-5_22) 章至第 [26](https://doi.org/10.1007/978-1-4842-3366-5_26)
  章讨论了运行智能系统所需的条件。这包括控制其所有组成部分，保持其智能与经验的平衡，对其进行扩展、调试，并确保其持续达成目标。


  本部分讨论了所需的工具，如何理解智能系统所犯的错误以及如何应对，以及当人们开始滥用你的系统时该怎么做。


