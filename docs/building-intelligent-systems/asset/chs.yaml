- '# 第二部分

  智能体验


  智能体验


  第 [5](https://doi.org/10.1007/978-1-4842-3366-5_5) 章至第 [10](https://doi.org/10.1007/978-1-4842-3366-5_10)
  章解释了如何将智能与用户连接起来，以实现智能系统的目标。本部分讨论了基于模型和机器学习创建用户体验的陷阱和挑战，以及成功智能体验的特性。它解释了如何调整体验以获取数据来发展系统。并提供了一个框架，用于验证智能体验是否按预期运行。


  '
- "# 5. 智能体验的组成部分\n\n每个智能系统的核心都是智能与用户之间的连接。这种连接被称为智能体验。一个有效的智能体验应该：\n\n*   通过选择用户感知智能的方式，平衡智能质量与体验的力度以吸引用户，从而将智能呈现给用户。\n\
  *   通过创造一个环境，让用户以能够实现系统目标的方式行事——同时不会感到不满，从而实现系统目标。\n*   通过减少小错误的影响，并帮助用户发现和纠正确实发生的任何严重问题，来最大限度地减少智能缺陷。\n\
  *   通过塑造交互方式，使其产生清晰、频繁且足够准确的无偏数据，以改进系统的智能，从而创造数据来发展系统。\n\n随着智能系统的发展，实现这些目标并保持它们之间的平衡，与创建智能系统的其他任何部分一样困难，并且对于取得成功至关重要。\n\
  \n本章将介绍智能体验的这些组成部分。后续章节将更详细地探讨关键概念。\n\n\n\n## 向用户呈现智能\n\n智能系统会对世界、用户以及接下来将要发生的事情做出预测。智能体验必须利用这些预测来改变用户所看到和交互的内容。想象一下：\n\
  \n*   智能系统识别出用户可能感兴趣的 10 条内容。体验应如何向用户呈现这些内容？\n*   智能系统认为用户正在对电脑设置进行一项不安全的更改。体验应如何应对？\n\
  *   智能系统判断用户所在的房间光线稍暗，不利于人眼舒适地观看。智能家居的体验应如何响应？\n\n这些例子中的体验可以是被动的，向用户提供温和的提示；也可以是强硬的，在用户面前闪烁巨大的红灯。它们甚至可能自动执行操作。在构建智能体验时，找到正确的平衡点是一项关键挑战。\n\
  \n智能体验可能：\n\n*   **自动执行**：通过代表用户执行操作。例如，当智能系统非常确定用户已入睡时，体验可能会自动调低电视音量。\n*   **提示**：通过询问用户是否应执行某项操作。例如，当智能系统认为用户可能忘记了妻子的生日时，体验可能会询问：“您想让我为妻子的生日订购鲜花吗？”\n\
  *   **整理**：通过以可能有用的顺序呈现一组项目。例如，当智能系统认为用户正在节食时，体验可能会重新整理用户最喜爱餐厅的电子菜单，将用户可能实际食用的最健康食品放在最上面（并隐藏所有过于美味的食物）。\n\
  *   **标注**：通过在显示界面上添加信息。例如，当智能系统认为用户开会要迟到了，体验可能会在屏幕角落显示一个闪烁的跑步小人图标。\n\n或者，智能体验可能会结合使用这些方法，例如在问题不确定时进行标注，但在坏事很可能即将发生时自动执行。\n\
  \n挑战在于，当智能系统正确时，体验应从中获取最大价值；而当智能系统犯错时，体验应仅造成可接受的麻烦。\n\n任何智能系统（无论其智能程度如何）都可以使用这些方法中的任何一种来构建体验。请记住，智能系统中的智能会随时间变化，随着更多用户的使用而变得更好（或随着问题的变化而变差）。正确的体验也可能随时间变化。\n\
  \n### 呈现智能的一个示例\n\n举个例子，我们考虑一个智能家居产品，它可以自动控制用户家中房间的灯光。用户安装了几个传感器来检测光照水平，几个传感器来检测运动，以及几个由计算机控制的灯泡。现在，用户希望被惊艳到。他们想用这个新玩具给朋友们留下深刻印象。他们希望再也不用考虑电灯开关了。\n\
  \n那么，它该如何工作呢？首先，我们来考虑智能部分。智能的作用是解释传感器数据并做出预测。例如：根据最近的运动传感器数据和光照传感器读数，用户在不久的将来想要调整灯光的概率是多少？智能系统可能知道以下信息：\n\
  \n*   如果房间很暗，并且有人刚刚进入，那么灯光在 95%的情况下会很快被打开。\n*   如果灯亮着，并且有人正在离开房间，那么灯光在 80%的情况下会很快被关闭。\n\
  *   如果灯亮着，并且四个小时内没有人出现，那么下一个进入房间的人很可能会对着孩子们大喊大叫，抱怨他们那个年代的电费有多贵，谈论尊重的意义和禁足——然后关掉灯。\n\
  \n那么，灯光自动化系统的体验应该做什么呢？\n\n一种选择是完全自动化控制灯光。如果智能系统认为用户很快想要改变灯光，那就直接进行更改。这是一种相当强硬的体验，因为它直接自动化了原始的智能输出，没有为错误留出余地。它会正确吗？它会让用户满意吗？\n\
  \n嗯，如果用户正在看电影呢？灯光自动化系统的智能对电视一无所知。如果用户正在看电影，而运动传感器检测到了他们——比如他们伸了个懒腰或伸手去拿饮料——灯光可能会突然亮起。这不是一个好的体验。或者，如果用户正在睡觉呢？每次他们翻身时，灯光都会闪烁吗？或者，如果用户正在享用浪漫的晚餐呢？\n\
  \n在这些情况下，仅仅自动化灯光的体验不太可能做对事情。部分原因是智能系统没有足够的信息来做出完美的决策，部分原因是即使它拥有世界上所有的信息，它也不会做出完美的决策（因为智能系统会犯错）。\n\
  \n那么，我们注定失败了吗？我们应该放弃这个产品，回到绘图板前吗？\n\n嗯，我们可以这样做。或者，我们可以考虑其他一些向用户呈现智能的方式。\n\n例如，与其自动化灯光，不如在智能系统认为应该改变灯光时，体验向用户发出提示。例如，如果系统认为光线太暗，它可以（用悦耳的电脑合成女声）询问：“您想让我打开灯吗？”\n\
  \n这可能比自动化更好，因为系统犯错的烦人程度较低（用悦耳的声音提问，而不是突然让房间变暗）。但这足够好吗？如果智能系统犯了太多错误呢？每隔几分钟，那个声音就会响起，愉快地问道：“您想让我现在搞乱您的灯光吗？”……“现在呢？”……“也许现在？”\n\
  \n系统会显得相当愚蠢，每小时多次询问用户是否想搞乱他们的灯光。\n\n另一种侵入性更小的方法是通过提供**标注**来展示灯光信息。例如，如果智能系统认为应该关掉但实际亮着的灯有几盏，也许可以在用户的手表上显示一个微妙的“能源使用”警告。或者，如果智能系统认为用户所在的房间太暗，可以显示一个微妙的“健康警告”。如果用户注意到警告并认为它是正确的，他们可以自己改变灯光。\n\
  \n这些不同的体验可能都建立在同一个智能系统之上——在任何特定情况下，它们可能拥有完全相同的预测——但从用户的角度来看，它们会显得非常不同。\n\n那么，哪一种才是正确的呢？\n\
  \n这取决于系统的目标以及智能的质量。如果智能非常出色，自动化可能有效。如果智能是新的（并且还不太准确），那么标注可能更有意义。智能体验的一个关键目标是站在用户一边，创造出对他们有用的东西。\n\
  \n\n\n## 实现系统目标\n\n一个有效的智能体验会以能够实现智能系统目标的方式呈现智能。体验的设计应让用户看到智能以帮助他们获得良好结果（并帮助智能系统背后的业务实现其目标）的方式呈现。回顾一下，智能系统的目标可以包括：\n\
  \n*   组织成果：销售额和利润。\n*   领先指标：参与度和情感倾向。\n*   用户成果：实现用户目标。\n*   模型属性：拥有准确的智能。\n\n\
  智能体验的任务是获取智能的输出，并利用它来实现用户成果、改善领先指标以及达成组织成果。这意味着，当智能正确时，体验应推动用户采取能够实现目标的行动。而当智能错误时，体验应保护用户免于遭遇太糟糕的体验。\n\
  \n考虑家庭照明自动化系统。如果目标是节省电力，当系统认为应该关灯时，它应该做什么？\n\n*   在电灯开关处播放轻柔的咔嗒声：如果用户碰巧听到并想走到开关处，他们可能会关掉灯。也许吧。\n\
  *   提示用户：如果我们询问用户是否想关灯，他们可能会说“是”，或者他们可能正在忙别的事情（而错过了问题）。\n*   提示用户，然后延迟后自动执行：给用户一个阻止该操作的机会，但无论如何最终执行该操作。\n\
  *   自动控制灯光：直接关掉它们。\n*   切断房屋主断路器的电源：因为，拜托，用户正在浪费电力；他们对自己和他人都是个威胁……\n\n这些体验选项越来越有可能让灯被关掉（并保持关闭）。选择一个过于被动的选项会使系统在实现其目标方面效率降低。选择一个过于极端的选项则会使系统使用起来令人不快。\n\
  \n事实上，在实现智能系统的目标方面，体验与智能同样重要：一个无效的体验可能会像极其不准确的智能预测一样，彻底搞砸整个系统。\n\n一个智能体验可以自由地挑选、忽略无用的智能——采取一切必要手段来实现期望的结果。\n\
  \n### 实现目标的示例\n\n再次考虑自动照明系统。设想该产品的两个可能目标：\n\n1.  最小化消耗的电量。\n2.  最小化老年人被东西绊倒受伤的可能性。\n\
  \n其他一切条件相同——智能、传感器、系统的实现方式——只有目标不同。同样的体验能对这两个目标都成功吗？很可能不行。\n\n旨在节约电力的系统可能永远不会打开灯，即使智能认为开灯是合适的。相反，体验可能依赖于用户在需要开灯时使用开关，并在系统认为用户不再需要灯光时简单地关掉它们。\n\
  \n旨在避免老年人绊倒的系统可能行为截然不同。它可能在任何有可能有用户在房间内时打开灯，并一直亮着，直到非常确定房间空无一人时才关闭。\n\n这些体验截然不同，以至于它们可能作为完全不同的产品出售——包装不同、营销不同、定价不同——并且它们各自都可能完美地实现其总体目标。而且它们可能都使用（并贡献于）完全相同的底层智能。\n\
  \n## 最小化智能缺陷\n\n智能会犯错。很多错误。各种类型的错误。一个有效的智能体验会在存在这些错误的情况下正常运行，最小化其影响，并让用户能够轻松地从错误中恢复。\n\
  \n在设计智能体验时，理解以下几点至关重要：\n\n1.  智能会犯哪些类型的错误。\n2.  它犯错的频率如何。\n3.  错误会给用户（和组织）带来什么代价：\n\
  \    1.  如果用户注意到错误并试图纠正它。\n    2.  如果用户从未注意到错误的发生。\n\n然后，智能体验可以决定如何处理这些错误。体验可以：\n\
  \n1.  通过选择不做风险太大的事情来远离严重错误。\n2.  控制用户与智能的交互次数，以控制用户将遇到的错误数量。\n3.  在错误难以撤销的情况下采取力度较小的行动（例如，提示用户确认他们是否真的想发射核导弹，而不是自动发射）。\n\
  4.  向用户提供关于系统所采取行动的反馈，以及如果出现问题如何恢复的指导。\n\n这些技术使智能系统更安全。它们也通过淡化交互、要求用户更多地关注系统正在做什么，来降低智能系统的潜力。在实现目标与控制错误之间取得平衡，是设计有效智能体验的关键部分。\n\
  \n## 创造数据以发展系统\n\n智能需要数据来发展。它需要看到世界中发生事件的示例，然后看到所产生的结果。这次交互对用户有利吗？对业务有利吗？还是不利？智能可以利用这些关于世界和结果的示例来随时间改进。\n\
  \n体验在使来自智能系统的数据变得有价值方面扮演着重要角色。如果做得好，体验可以产生大量完美适用于机器学习的数据集。如果做得不好，体验可能会使来自系统的数据变得毫无用处。\n\
  \n一个有效的智能体验会以清晰的方式与用户交互，使系统能够知道：\n\n1.  交互的上下文。\n2.  用户采取的行动。\n3.  结果。\n\n有时，体验可以使这种交互完全隐式；也就是说，体验可以设计得如此优雅，以至于用户仅仅通过使用系统就能产生正确类型的数据。\n\
  \n在其他时候，体验可能需要用户明确参与以创建良好的数据（例如，通过留下评分）。我们将在后面的章节中详细讨论从智能体验中获取良好数据的技术和权衡。\n\n\n\n\
  ### 数据收集示例\n\n以自动照明为例。\n\n智能系统将检测传感器并决定灯光应如何运作。体验层将基于这一智能采取行动，以某种方式与用户交互。随后我们需要知道——这种交互是否正确？\n\
  \n如果灯亮着，但系统认为应该关灯，会怎样？我们如何判断智能判断是否正确？\n\n以下情况可能表明判断正确：\n\n*   体验层自动关闭灯光，且用户没有重新打开。\n\
  *   体验层提示用户关闭灯光，用户表示同意。\n*   体验层发出电量警告，用户随后关闭了灯光。\n\n以下情况可能表明判断错误：\n\n*   体验层自动关闭灯光，但用户立即重新打开。\n\
  *   体验层提示用户关闭灯光，但用户表示拒绝。\n*   体验层发出电量警告，但用户并未关闭灯光。\n\n但这种反馈并非完全清晰。用户可能懒得纠正错误。例如：\n\
  \n*   用户可能更希望灯光保持开启，但已放弃与恼人的自动灯光抗争，正努力学着在黑暗中视物。\n*   用户可能看到了关闭灯光的提示，但正沉浸在最爱游戏的某个关卡中，无法做出回应。\n\
  *   用户可能将智能手表放进了抽屉，因此再也看不到任何电量警告。\n\n当结果清晰，且用户有动力对体验层发起的每次交互做出反应时，收集到的数据才是最佳的。这并非总是易事，可能需要做出一些权衡。然而，当用户与智能体验交互时，创建有效的训练数据，是释放智能系统价值的关键途径。\n\
  \n## 总结\n\n本章介绍了智能体验。智能体验的作用在于，以一种能够实现系统目标、最小化智能缺陷并创造数据以改进智能的方式，将智能呈现给用户。\n\n呈现智能涉及选择其出现的位置、频率以及强度。有多种选项可供选择，为你的具体情况选择正确的组合，对于智能系统的成功至关重要。\n\
  \n借助恰当的体验，同一个智能系统可用于实现截然不同的目标。\n\n体验层可以通过降低错误的影响强度、使其更易被察觉、降低其代价以及使其更易被纠正，来控制错误的成本。\n\
  \n有效的体验层应支持智能的改进。这可以通过创建与用户的交互来实现，从而收集关于正面和负面结果的频繁且无偏见的样本。\n\n无论智能系统可能多么糟糕和古怪，智能体验都必须站在用户一边，让他们感到愉悦、投入且高效。\n\
  \n## 思考题…\n\n阅读本章后，你应该能够：\n\n*   理解用户体验与智能如何结合以产生理想的影响。\n*   了解智能体验的主要目标，并能解释与之相关的一些挑战。\n\
  \n你应该能够回答如下问题：\n\n*   回想一下你与智能系统的交互。你经历过的最强硬的智能应用是什么？最被动的呢？\n*   列举三种你提供数据以帮助改进智能体验的方式。其中哪种最有效？为什么？\n\
  \n"
- '# 6. 为什么创建智能体验如此困难


  本章探讨了基于智能的体验与传统体验之间的一些差异。核心要点是：智能会犯错。


  智能系统会犯错；要创建有效的智能体验，你必须坦然接受这一事实。你必须拥抱错误。你必须就如何应对和处理这些错误做出明智的决策。


  智能系统所犯的错误：


  *   不一定符合直觉。

  *   并非每天相同。

  *   不易提前发现。

  *   无法通过“再稍微改进一下智能”来修复。


  本章将探讨智能系统所犯的错误。其目标是向你介绍在创建有效智能体验时需要应对的挑战。理解智能系统犯错的方式以及潜在的权衡，将帮助你了解未来可能遇到的情况，更重要的是，帮助你设计出能够——尽管智能系统会犯错——为用户带来最佳结果并实现系统目标的智能体验。




  ## 智能系统会犯错


  智能系统会犯错，这是无法避免的。有些错误会带来不便，有些则可能相当严重。如果不加以缓解，这些错误会让智能系统显得愚蠢；甚至可能使智能系统变得无用或危险。


  以下是一些因智能系统犯错而可能出现的场景示例：


  *   你让手机订披萨，它却告诉你印度孟买的人口数量。

  *   你的自动驾驶汽车开始沿着一条不存在的道路行驶，最终你掉进了湖里。

  *   你的智能门铃告诉你有人正在靠近前门，但查看视频后，你发现根本没人。

  *   你把一片面包放进智能烤面包机，五分钟后回来，发现面包还是凉的——烤面包机根本没工作。


  这类错误以及其他许多错误，只是使用智能系统所需付出的部分代价，尤其是在使用由机器学习创造的智能系统时。


  而且，这些错误并非智能系统开发者的过错。我的意思是，我猜这些错误可能是他们的责任——人们总有可能工作不力——但即使是那些在应用机器学习领域表现出色、堪称世界级水平的人，所创造的智能系统也会犯错。


  因此，在智能系统中，经验的一个重要角色就是呈现智能，使其在正确时高效运作，同时将其所犯的错误最小化，并便于从中恢复。


  试想，一个准确率为 95%的智能系统，每二十次交互就会犯一次错误。而 95%已经是非常高的准确率了。如果你的智能系统开发者达到了 95%的准确率，他们会觉得自己干得很棒。他们会希望因自己的辛勤工作而获得奖励，然后继续去开发其他项目。他们可不想听你说这个智能系统还不够准确。


  但在一个每天有百万次用户交互的系统中，95%的准确率意味着每天会有 5 万次错误。这可是大量的错误。如果这些错误耗费了用户的时间或金钱，那就会累积成一个真正的问题。


  另一种思考错误的有用方式是，用户在一次错误出现之前会经历多少次交互。例如，一个每天进行 20 次交互、使用准确率为 97%的智能系统的用户，预计每周会遇到 4.2
  次错误。


  这是灾难吗？


  这取决于错误的严重程度以及用户有哪些恢复选项。


  但请考虑一下构建会犯错的系统之外的另一种选择——即，在围绕智能系统构建产品之前，要求其达到完美。完美非常昂贵，在很多情况下甚至是不可能的。而且，从智能系统中获得真正价值并不需要完美——坐等完美是错失大量潜力的好方法。看看这些例子：


  *   语音识别并不完美，而且可能永远都不会完美。

  *   搜索引擎并不总能返回正确答案。

  *   游戏 AI 常因绕圈跑和对着墙壁射击而受到嘲笑。

  *   自动驾驶汽车会发生事故。


  但所有这些（某种程度上）不准确的智能系统，都是我们许多人每天使用的产品的一部分——它们让我们的生活更美好。缓解错误是打造智能体验的一项基本活动。


  ## 智能系统会犯离谱的错误


  冒着啰嗦的风险再说一遍，智能系统会犯离谱的错误。那些错误是疯狂的、莫名其妙的、反直觉的。


  试想——如果一位人类专家有 99%的正确率，你可能会认为他们犯的错误也接近正确。你假设这位专家基本理解情况，如果他们犯了错，那很可能也符合对世界运作方式的理性看法。


  机器学习和人工智能可不是这样。


  一个人工智能系统可能有 99.9%的正确率，但千分之一的情况下，它会说出完全离谱的话。例如：


  *   一个推荐音乐的系统可能会推荐你 999 首摇滚歌曲，然后推荐一首青少年流行歌曲。

  *   一个智能烤面包机可能会完美地烤好 99 片面包，然后决定第 100 片面包不需要任何烘烤——无论如何，都不加热。

  *   一个通过图像读取人类情绪的系统可能正确识别出 999 个人是开心的，然后它看到我的脸，无论我咧着嘴笑得有多傻，它都会说我是悲伤的。


  这些离谱的错误是使用智能系统工作的一部分。


  即使是离谱的错误，也可以被缓解、从中恢复并最小化。但要设计出能与智能系统良好配合的体验，你应该摒弃对理性事物会如何行动的固有观念。相反，你需要培养与你所使用的智能系统之间的直觉。使用它。看看什么容易让它困惑，以及是如何困惑的。思考支持它的方法。


  一种本能反应是去找开发智能系统的人说：“拜托，这太离谱了。修好这个错误吧。它让我们受不了了！”


  这没问题。他们很可能可以修改智能系统来修复困扰你的那个错误。


  但修复一个错误通常会在其他地方引入一个新错误。这个新错误很可能同样离谱。而且你不会知道新错误何时以及如何出现。修复明显的错误并不总是正确的做法；事实上，像打地鼠一样处理明显的错误可能是有害的。有时，更好的做法是让智能系统尽可能优化，然后通过优雅的体验来掩盖错误，从而支持智能系统。




  ## 智能系统会犯不同类型的错误


  尽管你可能觉得我一直在强调这一点，但智能系统确实会犯不同类型的错误。例如：


  *   智能门铃可能会在没人的时候提示有人靠近门口；也可能在有人靠近门口时未能通知用户。

  *   智能烤面包机可能把面包烤得不够熟；也可能烤过头。

  *   语音识别系统可能错误理解用户说的话；也可能拒绝尝试猜测用户说了什么。


  这里主要有三种错误类型：


  1.  将一种情况误判为另一种情况。

  2.  估算出错误的值（例如，正确的烤面包时间）。

  3.  因过于困惑（或保守）而完全无法给出任何判断。


  或许最简单的错误形式就是混淆不同情况，就像智能门铃的例子那样。对于这类系统的智能判断，存在四种可能的结果（图 6-1）：


  ![A455442_1_En_6_Fig1_HTML.gif](img/A455442_1_En_6_Fig1_HTML.gif)


  图 6-1


  不同类型的错误


  *   **真阳性**——当门口有人，且智能系统判断门口有人时，称为真阳性（这是正确判断，而非错误）。

  *   **真阴性**——当门口没人，且智能系统判断门口没人时，称为真阴性（这是另一种正确判断，而非错误）。

  *   **假阳性**——当门口没人，但智能系统判断门口有人时，称为假阳性（这是一种错误）。

  *   **假阴性**——当门口有人，但智能系统判断门口没人时，称为假阴性（这是另一种错误）。


  通常可以通过调整系统的智能参数来控制它犯错误的类型，让某一类错误增多，另一类错误减少。（这通常涉及调整驱动智能的模型所输出的概率阈值。）


  例如，在设计智能门铃的体验时，是让系统在没人的时候提醒用户更好，还是在有人的时候不提醒用户更好？


  如果以增加一次第二种错误为代价，能够消除三次第一种错误呢？这对用户来说是更划算的权衡吗？是否更有助于实现系统的目标？


  这取决于具体的体验。每种类型的错误会让用户感到多恼火？哪种错误更容易被掩盖？哪种错误更妨碍系统目标的实现？用户每天/每月/每年会经历多少次这类错误？他们是否会因此感到疲惫，最终完全不再响应系统的提醒？或者他们会不再信任系统，直接将其关闭？


  其他权衡的例子包括：


  *   在低估与高估之间权衡。例如，当智能烤面包机预测烤面包时间时，是烤过 5% 更好，还是烤不足 5% 更好？

  *   在智能系统给出的选项数量之间权衡。例如，在推荐系统中，系统可能相当确定用户想读 15 本不同书籍中的某一本。是让用户从排名前 5 的书籍中选择更好？还是展示全部
  15 本更好？

  *   在智能系统“给出判断”与“保持沉默”之间权衡。例如，在计算机视觉系统中，智能系统可能有 90% 的把握识别出图像中的人物。是让系统给图像中的人脸打上一个有十分之一概率出错的标签更好？还是让系统什么都不做更好？或者请求用户帮助更好？


  ## 智能会发生变化


  传统的用户体验是确定性的。它们对相同的指令做出相同的响应。例如，当你右键点击一个文件时，每次都会弹出一个菜单（除非出现 bug）。确定性在很多方面都是好的。


  智能系统会随着时间的推移自我改进。昨天执行某个操作得到的结果，今天可能就不同了。而这可能是一件非常好的事情。试想：


  *   昨天你搜索了你最喜欢的乐队，得到了一些还不错的文章。今天你再次搜索同一个乐队，得到了更新、更好的信息。

  *   昨天你用微波炉爆了一些爆米花，有几颗烤焦了。今天你再爆爆米花，微波炉加热时间没那么长，爆米花就完美了。

  *   昨天你的导航应用指引你穿过一个施工区，你的通勤时间比平时多了一个小时。今天应用指引你走另一条路线，你上班时心情更愉快，工作效率也更高。


  这些都是积极变化的例子，这类变化正是智能系统的目标——从用户的角度来看，系统今天比昨天工作得更好。如果现在有点小问题，那也没关系——用户可以相信系统会改进，问题会随着时间的推移而减少。


  这是目标。但变化也可能带来干扰。即使是长期来看积极的变化，短期内也可能让用户感到困惑和失控。想象以下场景：


  *   昨天你用智能笔做笔记，墨水是漂亮的蓝色。但一夜之间，笔连接了它的服务，而该服务——为了优化某个你可能永远不知道的指标——决定调整蓝色的色度。今天你做的笔记变成了另一种颜色。

  *   昨天你去附近的便利店，买了一大杯你最喜欢的冰爽汽水，喝得很开心。一夜之间，汽水机连接了它的服务并调整了配方。今天你又买了一杯汽水，却没那么喜欢了。


  这些变化是好的吗？也许吧。也许它们改善了相关业务中某些非常重要的属性。也许你最终会意识到自己其实喜欢这种改变后的行为——尽管一开始让你感到困扰。


  又或者，这些变化简直就是灾难性的。


  在处理不断变化的智能时，需要考虑以下几点：


  1.  能否控制变化的速度？这可以通过对智能的提供者施加一些限制来实现。例如，也许智能系统每天对不超过 5% 的交互改变其预测。如果限制过严，可能导致智能停滞不前（并消除智能随时间改进的大部分潜力），但一些简单的限制会大有帮助。

  2.  体验能否帮助用户应对变化？也许可以通过告知用户变化已经发生来实现。或者保留旧的行为，同时将改变后的行为作为选项提供给用户。例如，智能笔可以告知用户它发现了一种新的墨水颜色，能让笔记的实用性提高
  5%，并询问用户是否愿意更改，或者如果用户更喜欢旧颜色，则保持不变。

  3.  体验能否限制系统中变化部分的影响，同时仍让它们保持足够的显著性以发挥作用？例如，对变化最频繁的智能部分采用更被动的体验方式？




  ## 人的因素


  智能体验的成功在于以积极的方式与用户互动，让用户更快乐、更高效，并帮助他们以更具生产力的方式行事（或更好地契合积极业务成果的方式）。


  但处理智能系统对某些用户来说可能充满压力，因为它挑战了他们的预期。


  我们可以这样来理解这个问题。


  人类使用工具，比如锯子、书籍、汽车、物品。这些东西的行为是可预测的。我们经过漫长的进化，已经学会理解它们、依赖它们、知道对它们能有什么期待。有时它们会坏掉，但这种情况很少见。大多数时候，它们就是它们本来的样子；我们学会使用它们，然后就不再过多思考它们。


  工具在某种程度上成为了我们自身的一部分，赋予我们原本不具备的能力。


  它们能让我们感觉非常良好、安全且舒适。


  智能系统却并非完全如此。


  智能系统会犯错。它们会改变“主意”。它们在决定行动时会考虑非常细微的因素。有时它们不会连续两次做同样的事情，即使用户看不出任何不同。有时它们甚至有自己的动机，而这些动机与用户的动机并不完全一致。


  与智能系统互动，感觉更像是一种人际关系，而不是使用工具。以下是一些可能影响用户的方式：


  *   **困惑**：当智能系统行为怪异或犯错时，用户会感到困惑。他们可能想要（或需要）投入一些思考和精力来理解发生了什么。

  *   **不信任**：当智能系统影响用户行为时，用户是否会喜欢？例如，系统可能神奇地让用户的生活变得更好，也可能不断唠叨用户去做事，尤其是那些让用户觉得是在把他人利益置于自身利益之上的事（比如向用户展示广告）。

  *   **缺乏信心**：用户是否足够信任系统，让它自行运作？还是用户逐渐认为系统效率低下，总是想帮忙，却总是帮倒忙？

  *   **疲劳**：当系统需要用户关注时，它是否善用了这种关注，还是对用户要求过多？用户很擅长忽略他们不喜欢的东西。

  *   **不适感**：这些互动会让用户感到不舒服吗？也许系统太了解他们了。也许系统会迫使他们做不想做的事，或者将他们认为私密的信息发布到公共论坛。如果一台智能电视看到一对情侣在沙发上亲热，它可以调暗灯光并播放一些巴里·怀特的音乐——但它应该这么做吗？


  要留意用户对智能体验的感受。通过明智地选择呈现什么内容以及以何种力度呈现，来管理他们的感受。


  ## 总结


  智能会犯错。无论如何，它都会犯错。抱怨无济于事。犯错并非因为别人工作不力。而追着错误不放，玩打地鼠游戏，通常（往往）是有害的。


  智能犯的错误可能非常反直觉。即使是通常正确的智能，也可能犯下非常奇怪的错误（人类绝不会犯的那种）。


  错误有不同的类型。一种常见的表述方式是：误报（声称某事发生了，但实际上没有）和漏报（声称某事没发生，但实际上发生了）。智能系统常常需要在不同类型的错误之间进行权衡（例如，通过增加一些误报来减少一些漏报）。


  变化可能会给用户带来困扰，即使从长远来看这种变化是积极的。智能系统会定期变化。帮助用户应对变化是创建有效智能系统的一部分。


  智能系统可能对用户产生负面影响，导致他们不喜欢和不信任该系统。


  创造智能体验是困难的。


  ## 思考题……


  阅读本章后，你应该能够：


  *   理解智能会犯错——这是智能体验需要应对的基本挑战之一。

  *   认识到为什么这些挑战不是智能系统的漏洞（需要修复），而是与智能系统打交道时固有的问题（必须接受）。

  *   了解用户将如何体验智能系统的负面部分，并具备一些同理心，以帮助创造能帮助用户的体验。


  你应该能够回答如下问题：


  *   你见过智能系统犯过的最严重的错误是什么？

  *   智能体验本可以做些什么来减轻这个错误的严重性？

  *   对于哪个产品变更，你最初的反应最强烈，一开始不喜欢，但后来却越来越喜欢？为什么？


  '
- '# 7. 平衡智能体验


  设计成功的智能体验需要在以下三者之间取得平衡：


  1.  达成期望的结果

  2.  保护用户免受错误影响

  3.  获取数据以促进智能成长


  当智能正确时，系统应该大放异彩，创造价值，实现自动化，给予用户所需的选择，并鼓励最安全、最愉快、最有利可图的行为。体验应该强烈鼓励用户利用智能判断正确的任何结果（只要用户不感到厌烦，并觉得从互动中获得了好的回报）。


  当智能出错时，系统应该将损害降到最低。这可能包括允许用户撤销已执行的任何操作。可能包括让用户寻找更多选项。可能包括告诉用户犯错的原因。可能包括为用户提供某种获取帮助的方式。也可能包括让用户在未来避免特定错误的方法。


  问题在于，体验本身无法知道智能是正确的还是错误的。因此，每一处体验都需要通过两个视角来审视：如果用户是因为智能正确而到达此处，他们应该做什么；如果用户是因为智能错误而到达此处，他们又应该做什么。


  这造成了紧张关系，因为让智能系统变得神奇的那些东西（比如无需任何麻烦就能自动执行操作）与让用户应对错误的东西（比如在智能系统行动前要求用户关注并检查每一个决策）是相互矛盾的。


  影响智能体验平衡的主要因素有五个：


  *   **体验的力度**：即体验在多大程度上鼓励用户去做智能认为他们应该做的事情。

  *   **体验的频率**：即智能体验尝试与用户互动的频率。

  *   **智能正确时互动的价值**：即用户认为它给自己带来多大好处，以及它在多大程度上帮助智能系统实现其目标。

  *   **智能错误时互动的代价**：即错误造成的损害有多大，以及用户发现并撤销损害有多困难。

  *   **智能的质量**：即智能正确的频率和错误的频率。


  要创建有效的智能体验，你必须理解这些因素及其相互关系。然后，你必须站在用户一边，构建一种能有效将他们与智能连接起来的体验。本章将更详细地探讨这些因素。




  ## 强制力


  如果用户难以忽略（或停止）某个交互，则该交互具有强制力。如果某个交互不太可能吸引用户的注意力或对其产生影响，则该交互是被动的。例如，一个具有强制力的体验可能会：


  *   自动执行某个操作。

  *   打断用户，并强制其在继续操作前响应提示。

  *   每隔几秒就在用户面前闪烁一个巨大、花哨的弹窗，直到用户做出响应。


  强制交互在以下情况下有效：


  *   系统对智能输出的质量有信心（认为其正确的可能性远大于错误的可能性）。

  *   系统确实希望吸引用户的注意力。

  *   成功的价值远高于出错的代价。

  *   了解用户对智能决策的看法具有很高的价值（有助于创造新的智能）。


  被动体验不要求用户投入注意力。用户很容易选择是否参与被动体验。被动体验包括：


  *   一个不强制用户立即响应的微妙提示。

  *   屏幕角落的一个小图标，用户可能会注意到，也可能不会。

  *   屏幕底部的一列推荐内容，用户可以选择点击或忽略。


  被动交互在以下情况下有效：


  *   系统对智能输出的质量没有信心。

  *   系统不确定智能交互的价值是否高于用户当前正在做的事情。

  *   出错的代价很高。


  思考交互强制力的一种方式是将其视为网页上的广告。如果广告弹出在网页上，并且不点击就不让你继续——这就是一种强制体验。你可能会点击那个愚蠢的广告（因为你不得不点）。如果广告无趣，你会对广告宣传的产品、展示广告的网页，以及编写出允许这种烦人广告存在的愚蠢浏览器的程序员感到愤怒。


  另一方面，如果广告与页面融合得恰到好处，你可能不会注意到它。你可能会点击广告，也可能不会。如果广告宣传的是很棒的东西，你可能会错过。但你不太可能感到恼火。你可能会一次又一次地回到那个网页。随着时间的推移，你可能会在该网页上花费更多时间，如果广告是被动且雅致的，你最终点击的广告数量可能会远超那些强制且花哨的广告。


  ## 频率


  智能体验可以选择与用户交互，也可以选择不交互。例如，想象一个为你提供驾驶导航的智能地图应用。这个智能地图可能正在获取数百万个关于交通状况、事故、天气状况、哪些灯是红灯哪些是绿灯等数据点。每当你到达一个路口，导航应用可能会说“左转可节省
  17 秒”，或者“开快点，赶上下一个绿灯，节省 3 分钟”，或者“掉头，回到上一个路口右转，就像我上次告诉你的那样，你仍然可以节省 2 分钟。”


  或者，该应用可以选择更含蓄的方式，将自身限制为每次行程只提供一个建议，并且只提出能节省至少 10 分钟的建议。


  更频繁的交互往往会让用户感到疲劳，尤其是当这些频繁的交互具有强制力时。另一方面，不那么频繁的交互帮助用户的机会更少，并且当它们出现时可能会让用户感到困惑（如果用户不习惯的话）。


  控制频率的一些方法包括：


  1.  每当智能系统认为有不同答案时就进行交互。例如，十五秒前智能系统认为正确的方向是直行，现在它获得了更多信息，认为正确的方向是右转。十秒后它又改变主意，认为你应该直行。像这样直接使用智能输出可能会导致非常频繁的交互。如果智能系统通常是正确的，并且交互不会占用用户太多注意力，这可能是有效的。否则，它可能会把用户逼疯。

  2.  每当智能系统认为有显著不同的答案时才进行交互。也就是说，只有当新的智能输出能为用户创造“巨大价值”时才进行交互。这牺牲了一些潜在价值，以减少对用户的打扰。“巨大价值”的含义可以随着时间的推移进行调整，以控制交互次数。

  3.  明确限制交互速率。例如，你可能允许每小时一次交互，或每天十次交互。当你不确定用户会如何反应时，这种方法很有效。它可以在限制潜在成本和用户疲劳的同时，获取数据来检验假设并改进智能系统。

  4.  每当智能系统认为用户会响应时才进行交互。这涉及到对用户有一定程度的了解。他们喜欢你提供的交互吗？他们倾向于接受还是忽略它们？他们正在做其他事情，还是愿意接受打断？他们是否开始厌倦所有这些交互？如果做得好，这种交互模式可以很好地适应用户，使智能系统与他们的风格相融合。但这更复杂。并且总是存在误解用户的风险。例如，也许有一天用户车里有个客人，所以他们忽略了所有建议，专注于客人。然后智能体验（错误地）了解到用户根本不喜欢被打断。它停止提供改进的导航。用户错过了系统的价值，因为系统试图变得“太聪明”。

  5.  仅在用户请求时才进行交互。也就是说，在用户明确请求交互之前不进行交互。这对于减少体验中的用户疲劳非常有效。允许用户发起交互是一个很好的后备方案，可以让系统少交互一点，但允许用户在需要时获取信息或执行操作。另一方面，过度依赖这种交互模式可能会大大降低智能系统的潜力——如果用户从不请求交互怎么办？用户甚至如何知道（或记住）如何请求交互？


  请记住，人类会厌倦某些事物。人类的大脑非常擅长忽略那些不断唠叨的事情。如果你的体验与用户交互过于频繁，他们就会开始忽略它。谨慎对待频繁的交互——少即是多。




  ## 成功的价值


  如果用户觉得自己获得了价值，他们就会更愿意容忍错误和问题。当一个智能系统正在帮助处理明显重要的事情时——比如关乎生命的关键问题，或者为用户节省大量金钱和时间——就更容易以用户喜欢的方式平衡智能体验，因为用户愿意投入更多时间来关注智能系统所做的决策。当智能系统提供的价值较小时——比如帮助用户烤面包，或者每天节省几美分的电费——要创造出用户认为值得投入精力去参与的平衡智能体验，本质上就会更加困难。用户往往会在以下情况下觉得交互有价值：


  *   注意到有事情发生了。

  *   感觉交互解决了他们关心的问题，或者相信交互为他们带来了某种有意义的（即使是间接的）改善。

  *   能够将结果与交互联系起来；他们明白交互试图做什么，以及实际做了什么。

  *   相信系统是站在他们这边的，而不仅仅是为了让别人赚钱。

  *   认为系统很酷、很智能，或者很了不起。


  有可能一次交互让用户的情况变得更好，但用户却感觉不到任何价值。也有可能一次交互让用户的情况变得更糟，但用户却认为这个智能系统很棒。智能体验在帮助用户感受到他们从智能系统中获得价值方面，扮演着重要的角色。


  当智能系统正确运行时，一个有效的智能体验会引人注目，会让用户对所发生的事情感觉良好，并且会恰当地归功于自己。但一个精明的智能体验会小心翼翼——智能并不总是正确的，没有什么比一个智能体验在你生活变得更糟时还抢功说帮了你更糟糕的了。


  交互也必须对智能系统有价值。通常，如果一次交互实现了系统的目标，那么它对智能系统就是有价值的；例如，当它：


  *   促使用户更多地使用智能系统（增加参与度）。

  *   让用户对智能系统产生更好的感觉（改善情绪）。

  *   促使用户花更多的钱（创造收入）。

  *   创建有助于智能系统改进的数据（增长智能）。


  通常，那些明确试图赚钱和从用户那里获取数据的体验，会与让用户感觉获得良好价值的目标相冲突。一个有效的智能体验需要足够灵活，在智能系统的整个生命周期中在这些目标之间进行权衡，以帮助各方受益。


  ## 错误的代价


  用户不喜欢问题；而智能系统总会遇到问题。一个平衡的智能体验会对错误给用户带来的代价保持敏感，并会尽最大努力将这些代价降到最低。


  错误根据其类型具有固有的代价。例如，一个威胁到人类生命或耗费大量金钱和时间的错误，其代价本质上是巨大的。而一个造成轻微不便的错误，比如导致烤架温度比用户要求的低了几度，代价就没那么大。


  但大多数错误是可以纠正的。容易纠正的错误比难以（或无法）纠正的错误代价更小。一个智能体验会帮助用户注意到何时发生了错误，并提供从错误中恢复的良好选项。


  有时错误非常轻微，在这种情况下，用户可能根本不在乎是否知道发生了错误。或者可能无法恢复，在这种情况下，智能系统可能想假装一切正常——覆水难收，哭也没用。


  ### 知道存在错误


  解决问题的第一步是知道存在问题。一个有效的智能体验会以以下方式帮助用户知道存在错误：


  1.  不会占用用户太多注意力，尤其是在最终发现并没有错误的时候。

  2.  在仍有时间从损害中恢复时发现错误。

  3.  让用户对错误以及整个交互感觉更好。


  有时错误是显而易见的，比如当智能体验关掉了灯，让用户陷入黑暗。用户坐在黑暗中的那一刻就知道出问题了。但有时错误并不明显，比如当智能体验在没有任何用户交互的情况下更改了计算机系统的设置配置。用户可能会在次优设置下使用多年，却从未意识到出了问题。一些帮助用户识别错误的选项包括：


  *   在智能体验做出更改时通知用户。例如，智能体验可能会自动执行一个操作，但提供一个微妙的提示表明该操作已执行。当这些通知很强势时，它们会吸引用户的注意力，并让用户有机会考虑和发现错误。但这也会使用户感到疲劳，应谨慎使用。

  *   维护智能系统所采取行动的日志。例如，垃圾邮件过滤系统中的“垃圾邮件”文件夹就是被垃圾邮件过滤器拦截的邮件日志。这让用户可以追踪问题，但不需要他们监督每一次交互。请注意，日志不必是完整的；它可能只包含智能系统信心不足的交互。


  ### 从错误中恢复


  智能体验也可以帮助用户从错误中恢复。


  有些错误很容易恢复——例如，当灯关掉时，用户可以走过去重新打开。而有些错误则更难恢复，比如当智能体验代表用户发送了一封电子邮件——一旦那封邮件在收件人的屏幕上响起提示音，就覆水难收了。


  从错误中恢复的两个要素是：错误代价中有多少可以挽回；以及用户需要做什么来从错误中恢复。为了帮助错误变得可恢复，一个智能体验可以：


  1.  限制决策的范围，例如，先采取部分行动，看看用户是否抱怨。

  2.  延迟行动，例如，在采取破坏性行动（如删除所有文件）之前，给用户时间反思他们的决定。

  3.  设计成根本不采取破坏性行动，例如，将体验限制在可以撤销的操作上。


  如果错误的代价足够高，体验可能需要不遗余力地帮助错误变得可恢复。


  当用户想要从错误中恢复时，智能体验可以：


  1.  在体验中直接提供一个撤销操作的选项（通过单个命令）。

  2.  强制用户手动撤销操作（通过追踪操作所做的所有事情，并逐一更改操作的各个部分）。

  3.  提供升级到某些支持代理的选项（当操作只能由系统管理员撤销时）。


  最好的错误是那些容易被注意到、不需要用户花费太多注意力去发现、并且可以通过一次交互完全恢复的错误。


  最糟糕的错误是那些难以发现、只能部分恢复、并且用户需要花费大量时间（而智能系统需要支付支持人员费用）才能恢复的错误。




  ## 智能质量


  体验无法控制智能的质量。但为了打造有效的智能体验，你最好详细了解智能的质量。当智能表现良好时，你会希望更频繁、更有力地使用它。当智能表现不稳定时，你需要谨慎选择与用户交互的时机和方式。


  错误有多种类型。智能系统可能会：


  *   产生大量随机性错误。例如，它可能在 90%的情况下给出正确答案，10%的情况下给出错误答案。在这种情况下，体验可以同时为所有用户保持平衡。

  *   产生集中性错误。例如，它可能对某些用户比对其他用户更有可能给出正确答案。比如，对戴眼镜的用户比不戴眼镜的用户犯更多错误。集中性错误相当常见，且往往难以识别。当集中性错误成为问题时，可能需要为最低共同标准——即结果最差的用户类别——来平衡智能体验（或者放弃部分用户，专注于智能系统表现良好的用户群体）。


  智能质量是一个生命周期，体验需要随着智能的发展而调整。例如，在开发初期，系统尚未拥有真实客户时，智能通常会很差。在某些情况下，智能可能差到最佳体验是完全对用户隐藏智能（同时收集数据）。


  随着系统部署和客户到来，系统将收集数据以帮助智能改进。随着智能的提升，体验将有更多选择来找到平衡，并实现智能系统的目标。请记住：


  1.  更优质的智能可以支持更有力、更频繁的体验。

  2.  改变并不总是容易的（即使改变源于智能的提升）。要小心地引导用户与你一同前进。

  3.  有时智能会以糟糕的方式发生变化，可能是因为问题变得更难，或者新类型的用户开始使用智能系统（或者智能创建者犯了错误）。有时体验需要退一步来支持更广泛的系统。这没关系——生活就是这样。


  ## 总结


  一个有效的智能体验将平衡以下要素：


  *   与用户交互的力度。

  *   与用户交互的频率。

  *   成功交互对用户和智能系统的价值。

  *   错误对用户和智能系统的代价。

  *   智能的质量。


  用户和智能系统都必须获得良好的收益。对用户而言，这意味着他们必须认为智能系统值得花时间与之互动。对智能系统而言，这意味着它必须实现目标并获取数据以改进。


  当智能良好（非常准确）时，智能体验可以频繁且有力，为所有人创造大量价值，并且不会犯太多错误。


  当智能不佳（或错误代价非常高）时，智能体验必须对其建议的行动以及建议方式更加谨慎，并且必须有办法让用户发现错误并从错误中恢复。


  交互频率可以通过以下方式控制：


  *   每当智能改变主意时。

  *   每当智能发现重大改进时。

  *   限制交互次数。

  *   仅在系统认为用户会响应时。

  *   仅在用户请求交互时。


  更频繁地交互会创造更多产生价值的机会。但交互也可能导致疲劳，使用户忽略智能体验。


  当用户理解正在发生的事情并认为自己获得了良好收益时，他们会发现价值。智能体验在帮助用户看到智能所提供内容的价值方面至关重要。


  智能会出错，要打造有效的智能体验，你必须了解它如何出错并努力支持它。智能质量会随着智能系统的生命周期而变化，随着它的变化，智能体验可以重新平衡以创造更多价值。


  ## 思考题…


  阅读本章后，你应该：


  *   了解打造有效智能体验必须平衡的因素：使用愉快、实现目标、减少错误，并随智能发展而演进。

  *   知道如何通过控制关键因素来平衡智能体验：力度、频率、价值、代价以及理解智能质量。


  你应该能够回答如下问题：


  *   你曾与之互动的最有力的智能体验是什么？你能记得的最被动的智能体验是什么？

  *   举一个你认为如果频率更低会更有价值的智能体验的例子。为什么？

  *   列出你曾与之互动的智能体验帮助你发现错误的三种方式。哪种最有效？为什么？


