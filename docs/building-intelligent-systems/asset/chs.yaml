- '# 26. 着手打造你自己的智能系统


  感谢你阅读本书。很高兴你能读到这里。现在，你应该已经具备了执行自己智能系统项目的基础，了解：


  *   如何着手一个智能系统：它的优势是什么，何时需要它，以及如何为其设定目标。

  *   如何设计智能体验：既能实现你的目标，又能产生数据以促进智能的增长。

  *   实现一个智能系统需要什么：如何执行、管理和衡量智能。

  *   如何创造智能：包括多种方法，特别是使用机器学习。

  *   如何编排一个智能系统：在其整个生命周期中将各个部分整合起来，以实现你想要的影响力。


  本章将回顾一些关键概念，并为你着手自己的智能系统项目提供一个检查清单。


  ## 智能系统检查清单


  智能系统通过缩短用户与智能之间的反馈循环来改变世界。它们解决重要问题，取悦用户，并帮助组织取得成功。


  要创建一个智能系统，你需要做很多事情，并做出许多决策。本节将这些关键点汇集一处，并附上相关章节的参考，以便你查找更详细的帮助信息。


  在着手一个智能系统项目时，我建议你考虑以下步骤。


  ### 着手智能系统项目


  1. 首先，确保智能系统适合你。


  当你期望在产品生命周期中多次改变其智能时，智能系统会非常有用。当你的问题具有以下特征时，通常需要这样做：


  *   规模庞大。

  *   开放性强。

  *   随时间变化。

  *   本质困难。


  此外，智能系统在以下情况下效果最佳：


  *   部分解决方案是可行且有价值的。

  *   你可以利用用户与系统交互产生的数据来改进它。

  *   你可以影响一个范围恰当且有意义的客观目标。

  *   该问题值得投入精力去构建智能系统。


  第 2 章更详细地讨论了这些主题。


  2. 为你的智能系统定义成功的标准。


  就你的智能系统应达成的目标达成共识，该目标应能传达期望的结果、可实现且可衡量。


  确定你的智能系统将为实现哪些组织目标（如利润或销售量）做出贡献，以及你可以使用哪些先行指标来更快地获得关于进展的反馈。然后，通过确定你想要创造的用户成果以及成功的关键模型属性，来决定你的智能系统在日常运行中应优化什么。


  制定一个衡量智能系统是否达成目标的计划，其中可能包括：遥测数据、等待结果明朗、使用人工判断以及询问用户。


  并且要做好长期投入的准备，以保持你的目标健康。第 4 章包含了关于为智能系统设定目标的更多细节。




  ### 智能体验规划


  3. 决定如何向用户呈现系统的智能，以实现你的目标。


  智能体验的目标是：


  *   向用户呈现智能。

  *   实现系统的目标。

  *   最小化智能缺陷。

  *   创建有助于改进智能的数据。


  为实现这些目标，你需要通过权衡以下因素来平衡体验：


  *   体验的力度。

  *   交互的频率。

  *   成功的价值。

  *   错误的代价（包括发现和恢复）。

  *   智能的质量。


  平衡智能体验是一个过程，在这个过程中，体验会随着智能的变化而变化。你可能需要为自己留出一些迭代空间。第 7 章讨论了如何平衡智能体验。


  第 8 章讨论了用户与智能之间特定的交互模式，你可以将其作为平衡过程的一部分，包括：


  *   自动化

  *   提示

  *   组织

  *   标注


  在你的智能系统中，几乎肯定会混合使用这些模式，以便在智能确定时体验更具力度，在智能不确定时体验力度减弱。


  4. 规划从体验中获取数据。


  理想的智能体验会产生数据，让你能够随着时间的推移改进智能系统（特别是智能本身）。


  为了有效改进智能系统，数据应满足以下条件：


  *   包含交互的上下文、用户操作和结果。

  *   充分覆盖智能系统的各个部分及问题空间。

  *   代表与用户的真实交互。

  *   无偏差。

  *   避免反馈循环。

  *   具有足够的规模，以便用于创建智能。


  当这些数据作为用户与智能系统交互的自然副产品被隐式创建时，效果是最好的。但有时你需要寻求帮助，以了解用户如何看待他们获得的结果。获取明确用户反馈的方法包括：


  *   允许用户在体验中提供评分（例如点赞、点踩或 1-5 星）。

  *   接受用户对体验中不良结果的报告（例如“举报为垃圾信息”按钮）。

  *   建立支持层级，以便用户升级问题以获得帮助（拨打帮助电话）。

  *   提示用户对你选定的部分结果进行分类。


  但请记住，用户不会愿意花费大量时间和精力来帮助你构建产品。专注于隐式数据，并谨慎使用显式数据。更详细的讨论请参见第 9 章。


  5. 规划验证你的智能体验。


  你需要规划如何：


  *   确保体验正常运行（尽管智能会犯各种错误）。

  *   确保体验在帮助智能系统实现其目标方面发挥了作用。


  为此，你可能需要规划一些工具，用于检查针对任何特定上下文生成的体验，以及用于创建和捕获问题发生上下文的工具。


  你可能还需要规划在这些工具中使用系统智能的不同版本，包括：实时智能；智能的快照；以及一些简单或存根智能。


  第 10 章涵盖了智能体验的验证。


  ### 规划智能系统实现


  实现智能系统需要完成传统系统实现的所有工作，外加启用系统智能的工作。这些额外的组件包括：


  *   智能运行时。

  *   智能管理。

  *   用于促进智能增长的遥测。

  *   智能创建环境。

  *   智能编排工具。


  这些组件为在智能系统的整个生命周期中改进它提供了重要能力。构建正确的实现可以大大简化智能的创建和智能系统的编排。


  第 11 章概述了智能系统实现的各个组件。


  6. 决定你的智能将驻留在何处。


  智能可以是以下任何一种形式：


  *   产品中的静态智能。

  *   客户端智能。

  *   以服务器为中心的智能。

  *   后端（缓存）智能。


  或者可能是这些形式的某种混合。你应该根据以下影响来选择智能的驻留位置：


  *   更新智能的延迟。

  *   执行智能的延迟。

  *   运营智能系统的成本。

  *   任何离线操作的需求。


  第 13 章探讨了智能驻留位置的相关问题；它将提供你为应用程序做出正确决策所需的详细信息。


  7. 设计你的智能运行时。


  智能运行时是执行智能和更新体验的地方。智能运行时必须完成以下所有工作：


  *   收集所需的上下文，以便你的智能能够做出良好的决策。

  *   以安全的方式从上下文中提取特征，同时支持智能创建中的创新。

  *   处理模型文件及其更新。

  *   在上下文（及其特征）上执行模型。

  *   获取执行产生的结果和预测，并点亮智能体验。


  第 12 章详细讨论了智能运行时。


  8. 规划智能管理。


  智能管理系统允许你向系统添加新的智能，并以安全的方式为用户启用它。这包括：


  *   将智能引入智能系统。

  *   对智能进行健全性检查，确保其没有明显的危害或损坏。

  *   当存在多个智能源时，合并智能，包括确保它们全部同步。第 21 章列举了合并智能的方法。

  *   以受控的方式为用户点亮智能。这可以包括静默智能、受控发布、灰度测试（A/B 测试）以及支持回滚。


  第 14 章讨论了智能管理的方法。


  9. 规划遥测。


  遥测是将使用情况与智能连接起来的关键环节，因此智能系统可以随着时间的推移而改进。遥测用于确保智能系统正常工作、了解用户获得的结果以及收集数据以促进智能增长。


  系统中可测量的内容远多于你能测量的，因此你需要就如何控制遥测收集数据的规模做出一些决策。但你也需要提供工具，以便智能创建者和编排者能够随着问题和智能系统随时间的变化而进行调整。这些工具包括：


  *   对遥测收集的数据进行采样，并随时间调整采样率。

  *   以允许高效收集正确信息的方式总结交互。

  *   支持灵活定位要从哪些上下文和用户中采样遥测数据。


  你可以在第 15 章中全面了解遥测。




  ### 准备创造智能


  智能是智能系统中负责做出艰难决策的部分，它从情境映射到预测，驱动智能体验，为用户和组织创造价值。


  10\. 准备评估智能。


  对于智能而言，评估即创造。你应该能够轻松衡量任何智能，以了解：


  *   其泛化能力如何。

  *   它犯错的类型。

  *   其错误分布。


  为此，你需要评估数据，最好来自遥测。这些数据应足以获得具有统计意义的评估结果。同时，它应与训练数据相互独立（这有时颇具挑战性），并且能让你了解智能在重要子群体上的表现。


  第 19 章（本书最长的一章）讨论了评估智能——其重要性可见一斑。


  11\. 决定如何组织你的智能。


  在构建大型智能系统时，组织智能的创建至关重要，因为你需要：


  *   让多人协作创建智能。

  *   清理智能产生的错误。

  *   用简单方法解决简单问题，并将更复杂的技术聚焦于难题。

  *   整合遗留智能或从外部获取的智能。


  以下是组织智能创建的一些常见方式：


  *   解耦特征工程。

  *   执行多次模型搜索。

  *   追踪错误（这可能是最差的方式）。

  *   使用元模型。

  *   执行模型排序。

  *   划分情境。

  *   使用覆盖机制。


  第 21 章讨论了所有这些组织智能创建的方式。


  12\. 建立你的智能创建流程。


  设置流程以利用所有可用的工具和数据来创建和改进智能。这包括：


  *   为你的智能选择表示形式（如第 17 章所述）。

  *   创建简单的启发式规则作为基线。

  *   在需要时使用机器学习生成更复杂的智能（如第 20 章所述）。

  *   帮助理解各种实现选项的权衡。

  *   只要智能需要改进，就持续评估和迭代。


  第 18 章给出了一个智能创建流程的示例。


  ### 编排你的智能系统


  你需要掌控本书中讨论的所有工具，并“驾驶这辆赛车”，在智能系统存续期间日复一日地取得成功。一个编排良好的智能系统将：


  *   长期可靠地实现其目标。

  *   在体验、智能和目标之间保持平衡。

  *   有效缓解错误。

  *   随时间有效扩展。

  *   缓慢退化。


  在以下情况下，编排对智能系统至关重要：


  *   目标发生变化。

  *   用户发生变化。

  *   问题发生变化。

  *   智能发生变化。

  *   系统需要更高效。

  *   发生滥用行为。


  第 22 章详细介绍了编排。


  13\. 在智能系统的整个生命周期中规划编排。


  该规划包括如何启动以及如何随时间进行投入。为了编排一个智能系统，你需要：


  *   监控成功标准。

  *   检查交互。

  *   平衡体验。

  *   覆盖智能。

  *   创建智能。


  等等。第 23 章描述了编排的活动以及如何决定何时何地进行投入。


  14\. 准备识别和处理错误。


  因为有了智能，错误就会随之而来。


  你需要识别智能系统出错的原因，包括：


  *   系统中断。

  *   模型中断。

  *   智能错误。

  *   智能退化。


  当你识别出错误来源后，必须决定如何应对：


  *   在智能上投入。

  *   平衡体验。

  *   以不同方式重新训练智能。

  *   实施护栏机制。

  *   覆盖错误。


  通过接纳错误、主动发现错误并减轻其造成的损害，你可以为智能的闪耀腾出大量空间。第 24 章探讨了错误。


  15\. 准备应对滥用。


  如果有人能通过滥用你的用户或智能系统来赚钱，他们就会这么做。


  你应该准备好，一旦滥用开始发生，就能迅速识别，通过寻找：


  *   具有异常使用模式的用户群体。

  *   活动量激增的情境。

  *   结果发生剧烈变化的情境。

  *   投诉和问题报告中的模式。


  如果滥用确实发生，请记住，这本质上是一门生意。你不需要完全阻止滥用，只需要让滥用者觉得无利可图，他们就会停止。以下是一些可行的方法：


  *   增加智能系统用户的使用成本。

  *   降低对滥用者的吸引力。

  *   与对手方进行建模。

  *   将对手方从循环中移除。


  第 25 章是关于对手方和滥用的内容。


  16\. 享受旅程。


  这并非终点，而是起点。智能系统可以运行多年。吸引用户。实现目标。创造智能。编排一切——然后赢得胜利！


  ## 总结


  感谢您阅读本书。现在，您应该具备了自信地着手智能系统项目所需的知识。


  我很期待看到您将取得的成就！


  ## 思考题…


  阅读本章后，您应该：


  *   为自己阅读本书所付出的努力感到满意。

  *   准备好参与智能系统项目，并确信自己拥有做出贡献的知识。


  您应该能够回答如下问题：


  *   您想构建什么样的智能系统？

  *   它将如何改变世界？

  *   是什么在阻止您？行动起来吧！




