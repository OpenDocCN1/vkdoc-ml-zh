  阅读本章后，你应该能够：


  *   理解在大型、复杂的智能系统上工作，或与智能创建者团队合作需要什么。

  *   能够实现一种智能架构，使正确的智能能够处理问题的正确部分，并且所有参与者都能高效协作。


