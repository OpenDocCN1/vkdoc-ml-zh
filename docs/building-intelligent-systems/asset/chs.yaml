- '# 22. 智能编排概述


  智能编排有点像赛车比赛。一整个团队制造一辆赛车，将最新技术融入其中，并让每一个空气动力学翼片、配重、传动比和进气阀都达到完美——他们制造出了一台能完成其他机器无法完成之事的卓越机器。


  然后，需要有人坐上驾驶座，驶上赛道，并赢得比赛！


  智能编排者就是那些车手。他们掌控智能系统，并采取一切必要措施使其达成目标。他们利用智能创建和管理系统，在正确的时间产生正确的智能，并以最有用的方式组合它们。他们控制遥测系统，收集使智能系统变得更好的数据。他们处理所有错误和问题，平衡一切，使智能系统为用户和你的业务创造最大价值。例如：


  *   如果智能变得更好，可以更强制地运用经验以获得更好的结果。

  *   如果问题发生变化，可能需要优化智能管理，以不同方式或更快速地创建和部署智能。

  *   如果系统停止达成目标，需要有人找出原因，并利用现有系统进行调整。


  这并不容易。


  构建智能系统和编排它们是截然不同的活动。它们需要截然不同的思维方式。而两者对于取得成功都至关重要。


  本章描述了编排良好的智能系统是什么样的，并介绍了编排智能系统的要素，包括生命周期、编排环境、错误和滥用。




  ## 精心编排的智能系统的特性


  一个精心编排的智能系统将能够：


  *   **随时间推移可靠地实现其目标**：也就是说，它会不断成长，越来越出色地达成目标，直至达到收益递减点。此后，它将稳定在该状态，持续创造价值，即使面对用户群体、问题本身以及更广阔世界的变化。

  *   **在体验、智能与目标之间取得平衡**：即，体验的力度将与智能所能支撑的程度相匹配，从而为用户和企业带来最大化的净收益。

  *   **有效缓解错误**：确保高成本错误能被理解、快速检测并纠正。同时，低成本错误也能得到缓解，不会给用户或企业带来过重负担。

  *   **随时间推移有效扩展**：确保维持系统良好状态（包括所有平衡工作、智能创造、错误缓解等）的成本，能够随着用户数量的增长和智能复杂度的提升而良性扩展。这尤其意味着要有效利用机器学习和自动化。

  *   **缓慢退化**：系统不应需要大量人工干预才能维持稳定状态。编排工作的重点应放在寻找机遇上，而不是疲于奔命地“救火”。


  ## 为何需要编排


  编排智能系统，意味着对其进行调优，使其在整个生命周期内创造最大价值。


  此刻你可能会说——等等，等等。我原以为机器学习就是用来在整个生命周期内调优系统的。这是什么？某种玩笑吗？


  不幸的是，并非玩笑。人工智能和机器学习只能带你走到一定程度。编排的意义在于，将这些工具置于最佳情境中，让它们能够创造价值——发挥其优势，弥补其不足——并随着时间推移应对变化。


  需要进行编排的原因可能包括：


  *   智能系统的目标发生变化。

  *   智能系统的用户发生变化。

  *   问题本身发生变化。

  *   智能本身发生变化。

  *   运行智能系统的成本发生变化。

  *   有人试图滥用你的智能系统。


  在智能系统的生命周期中，上述情况几乎必然会发生一两种甚至更多。通过学习识别它们并加以适应，你可以将这些潜在问题转化为机遇。


  ### 目标变化


  当你的目标发生变化时，你的方法也必须随之改变，这意味着需要重新平衡智能系统的各个部分。在以下情况发生时，你可能需要调整目标：


  *   **你对问题有了更深入的理解**：随着工作的推进，你会对问题有更深刻的认识。你可能会意识到最初设定的目标有误，并希望进行调整。请记住，目标通常有多层。你的业务目标可能完全正确，但你会发现所追踪的用户成果并未对该目标做出贡献；或者你意识到正在优化的模型属性并未将你引向正确的方向。在这些情况下，你需要改变目标，并按需调整系统以实现新目标。

  *   **你已经解决了先前的问题**：你可能会发现已经实现了预期目标。智能系统正在运行，用户获得了良好成果，业务表现良好。此时，你可能希望设定一个更高的目标，并相应调整系统。或者，你可能想找出更经济地运行系统的方法（我们将在后面讨论）。

  *   **你意识到先前的问题太难解决**：有时你不得不承认失败。你的系统可能已经运行了一段时间，但始终无法达到预期目标。你可以选择关闭系统，另寻他路；或者设定一个更简单的目标，改变方法，更缓慢地逐步构建。

  *   **你发现了新的机遇**：你可能会灵光一现，想到一个好主意。这个主意与你当前的智能系统类似，但略有不同。也许是一种可以利用现有智能的全新体验。也许是一种可以基于现有遥测数据构建的新型智能。有时，追逐新机遇需要构建全新的智能系统，但有时，通过改变目标，利用现有系统也能实现。


  ### 用户变化


  智能系统的用户群在其生命周期内会以各种方式发生变化：


  *   **新用户加入**：新用户可能与现有用户截然不同。例如，你可能会吸引到新的人群、更随意的用户、使用你智能系统不同功能的用户，或者思维方式不同的用户。随着用户的变化，你将获得学习和适应的机会。你也会有更多可用于创造智能的遥测数据，但同时也必须应对日益增长的采样问题和智能管理复杂性。

  *   **使用模式改变**：随着用户学会使用你的智能系统，他们与系统交互的方式可能会改变。他们将不再探索系统如何运作，而是更专注于从中获取价值。经验丰富的用户与新手用户相比，会从不同的交互中受益。因此，你可能希望你的智能系统随着用户成为专家而改变。

  *   **用户对体验的感知发生变化**：随着时间的推移，用户可能会对力度过强、频率过高的体验感到厌倦。他们可能会开始忽略这些体验，甚至越来越感到恼火。在第一个月使用效果很好的体验，从长远来看可能完全错误——并且可能需要改变。

  *   **用户流失**：当用户离开时，你可能会有点伤心。但生活还要继续。根据离开的用户类型，你可能有机会调整智能与体验的平衡，以优化服务于你仍拥有的用户。同时，遥测数据也会减少，这可能会削弱你创造智能的能力。特别是自动化智能，可能需要重新审视——例如，更多地利用历史数据，而不是依赖较新的数据。


  ### 问题变化


  智能系统是为解决庞大、困难、开放且随时间变化的问题而设计的。这些问题——顾名思义——会随时间变化：


  *   **随时间变化的问题总是在变化**：因此，你过去做出的方法和决策可能不再适用于未来。有时问题可能很简单。有时则会变得非常棘手。有时你会看到大量特定类型的上下文。有时则完全看不到这些上下文。随着问题的变化，几乎总是有机会通过编排来适应并取得更好的成果。

  *   **使用模式变化**：随着用户改变与智能系统的交互方式，你需要解决的问题也可能变得截然不同。例如，用户在夏季和冬季的行为不同；在周末和工作日的行为不同；他们与新内容的交互方式也与旧内容不同。

  *   **你开始解决问题**：这意味着智能开始赶上这个庞大而困难的问题。在这种情况下，你可能希望重新审视方法。也许你希望开始锁定行为，而不是继续增长，更多地使用智能缓存（查找表），并减少对遥测数据的投入。




  ### 智能变化


  当你执行以下任何操作时，系统的智能都会发生变化：


  *   **获取更多数据以构建更好的智能**：随着用户与系统交互，智能将拥有更多数据，并应变得更好。当智能提升时，体验可以变得更具影响力。

  *   **尝试能显著改善效果的新方法**：数据解锁了可能性。一些最强大的机器学习技术对“少量”数据效果不佳，但随着用户使用你的智能系统，你获得大量数据后，这些技术就变得可行。这类变化可以释放各种潜力，让你尝试新的体验或瞄准更激进的目标。

  *   **尝试使情况变得更糟的新方法**：但你不会总是完美的。有时智能进化会倒退。当智能以激进的方式组合（紧密耦合或难以理解）时，这可能成为一个特殊问题。当你依赖大量人工干预来创建智能时（例如使用启发式方法），这也可能成为问题——有时复杂性会越过临界点，脆弱的智能创建计划便无法跟上。在这些情况下，你可能需要回退系统的其他部分，以便给自己时间摆脱困境。


  ### 成本变化


  大型系统需要不断平衡成本与价值。为了节省成本而进行的改变可能需要在其他方面做出妥协。换句话说，你可以通过改变体验或智能来节省大量成本，同时只对用户或你的业务价值造成微小损失。你可以尝试减少以下一项或两项成本：


  *   **遥测成本**：通过改变数据采样方式。这会降低你衡量系统和创建智能的能力，但这可能是一个不错的权衡。例如，当智能增长不多时，你可能收集更少的数据；对已解决问题的部分减少采样；或者移除那些对有用特征（和更好的模型）没有贡献的上下文部分。

  *   **错误成本**：管理错误可能非常昂贵。我们将在第 24 章中更详细地讨论如何处理错误。但你可能会发现，你需要减少错误，降低错误成本，并且可能需要改变系统中的各种事物来实现这一点。


  ### 滥用


  不幸的是，互联网上充满了恶意破坏者。有些人会滥用你的服务，因为他们觉得这很有趣。大多数人会滥用你的服务（以及你的用户）来赚钱——或者让你更难赚钱。如果不加以防范，滥用行为会毁掉一个智能系统，使其成为垃圾信息和风险的污水池，导致用户弃用。


  为了保护你的智能系统免受滥用，你需要了解滥用者的意图，然后采取措施，让你的系统对潜在的滥用者失去吸引力。有时一个小小的调整就能奏效。有时，打击滥用会成为运营智能系统的主要部分。


  但滥用是一个棘手的问题。一旦某个滥用者找到如何从与你的用户的每次交互中赚取十分之一美分的方法，他们就会扩大规模。他们会告诉他们的朋友。滥用可能迅速而猛烈地出现，因此你需要准备好识别并应对它。


  我们将在第 25 章中详细讨论对手与滥用。


  ## 编排团队


  编排一个智能系统需要多样化的技能。特别是，团队应具备以下能力：


  *   成为智能系统业务领域的专家，以便本能地理解目标，并知道用户希望从与系统的交互中获得什么。

  *   理解体验，并能够审视交互，决定如何改进智能向用户呈现的方式——哪些容易，哪些困难，用户会喜欢什么，不喜欢什么。

  *   理解实现的工作原理，以便知道如何追踪问题，并具备根据需要改进实现的能力。

  *   能够对数据提出各种问题，并理解及传达答案。

  *   知道如何进行应用机器学习，以便在需要时创建新的智能并将其注入系统。

  *   从让系统日复一日有效执行中获得满足感。并非所有人都喜欢这样——有些人喜欢发明新事物。编排关乎执行的卓越性——将一些最令人惊叹的机器带到赛道上，并赢得比赛。


  一个编排团队可以由少数几个多面手组成，也可以由技能多样且协作良好的成员组成。


  ## 总结


  一个智能系统需要在其整个生命周期内进行编排才能成功。编排是一个过程，旨在让系统的所有部分各司其职，并在它们遇到问题时提供支持。一个编排良好的智能系统将做到以下几点：


  *   随着时间的推移可靠地实现其目标。

  *   保持体验、智能和目标之间的平衡。

  *   有效减轻错误的影响。

  *   随着时间的推移有效扩展。

  *   缓慢退化。


  编排的一项关键活动是在智能系统的生命周期内重新平衡智能与体验。例如，当智能提升时，让体验更具影响力；或者当问题变得更困难时，降低其影响力。


  编排还涉及处理错误，理解错误是什么以及何时发生，然后管理系统以降低其成本。需要进行编排的原因包括：


  *   目标发生变化。

  *   你的用户发生变化。

  *   问题发生变化。

  *   智能发生变化。

  *   系统需要降低运行成本。


  对手和滥用者常常会成为成功的智能系统的问题。必须识别他们，然后让他们相信你的系统不值得他们浪费时间。


  ## 思考题…


  阅读本章后，你应该：


  *   理解编排智能系统的含义以及为什么需要它。

  *   了解编排智能系统需要什么样的团队。


  你应该能够回答如下问题：


  *   假设一个系统的智能开始表现不佳。可以做出哪些非智能基础的改变来缓解这个问题？

  *   挑选两个你最喜欢的智能系统。哪一个更难编排？为什么？

  *   描述如果一个智能系统的用户群翻倍，并且所有新用户都来自与之前用户不同的国家，该系统可能会遇到哪些类型的问题？




