- "# 16. 智能概述\n\n假设你有一个联网的智能烤面包机，你需要决定它应该烤多久；或者你有一个休息时间应用程序，你需要决定何时给用户休息提示；或者你有一个搞笑的网页应用，你需要决定什么内容有趣。我们将系统中做出这类决策的组件称为“智能”。本书的前面部分帮助你识别何时需要智能，如何通过智能体验将其与用户连接，如何实现它，以及它应该位于何处。本书的这一部分将帮助你创造智能。\n\
  \n智能将上下文映射到关于该上下文的预测。例如，一个智能可能：\n\n*   将网站的使用历史映射到对下周使用量的估计。\n*   将一封电子邮件映射到该邮件包含诈骗的概率。\n\
  *   将一张图片映射到对图片中黄瓜数量的估计。\n\n本章将更详细地探讨上下文和预测的概念。后续章节将讨论如何创造智能、如何评估它、如何组织它——以及更多内容。\n\
  \n## 一个智能示例\n\n但首先，让我们更详细地看一个智能的例子。想象一个颗粒烤炉。\n\n一个什么？\n\n嗯，颗粒烤炉有点像普通的户外烧烤架，但不同的是，你不需要生起大火，然后等待它达到完美温度，再放上食物，翻来翻去，并希望火候不会因为等待时间过长或过短而太热或太冷……颗粒烤炉有一个装满小木颗粒的料斗，它会根据需要一次一个地将颗粒投入火焰中，以保持完美的烹饪温度。\n\
  \n不可思议。\n\n因此，颗粒烤炉中的智能需要决定何时向火焰中添加颗粒以保持温度。让我们稍微分解一下，探讨这个智能的上下文和预测。\n\n颗粒烤炉的上下文可能包含以下信息：\n\
  \n*   烤炉内的当前温度。\n*   1 分钟前烤炉内的温度。\n*   过去 5 分钟内添加的木颗粒数量。\n*   过去 1 分钟内添加的木颗粒数量。\n\
  *   过去 20 秒内添加的木颗粒数量。\n*   烤炉外部的空气温度。\n*   颗粒中木材的类型。\n*   一天中的时间。等等。\n\n这些是可能与保持烤炉处于完美温度这一任务相关的属性。其中一些显然对成功至关重要（如烤炉内的当前温度），而另一些可能有用也可能没用（如一天中的时间）。智能不必使用上下文中的所有信息来做决策——但它可以。\n\
  \n基于上下文中的信息，智能将做出预测。给它一个新的上下文，智能就会预测关于该上下文的某些内容。颗粒烤炉的智能可能尝试预测：\n\n*   未来一分钟内烤炉内部的温度会更高还是更低。\n\
  *   未来一分钟内烤炉内部的精确温度是多少。\n*   为了维持所需温度，现在是否应该向火焰中添加颗粒的概率。\n\n然后，智能体验将利用这些预测来自动化向火焰添加燃料的过程。如果未来一分钟内火势会太冷——就添加一些燃料。简单！\n\
  \n设计正确的上下文并选择最佳的预测对象是创建有效智能系统的重要组成部分——而要做到正确，通常需要一些迭代和实验。\n\n\n\n## 上下文\n\n上下文包括你的智能体可能用于决策的所有计算机可处理信息。智能体可以自由选择使用哪些上下文信息来做出最佳决策。从这个意义上说，上下文是智能体创建者在创建智能体时可以选择的选项调色板。\n\
  \n为了发挥作用，上下文必须满足以下条件：\n\n*   在智能体运行时中实现。\n*   可供智能体创建者用于生成和评估智能体。\n\n### 在运行时实现\n\
  \n要使某条信息可供智能体使用，需要有人将其接入智能体运行时。\n\n例如，如果烤炉能知道炉外的温度，它可能会更智能。但要获知炉外温度需要付出努力：需要有人在每台烤炉上安装温度传感器、进行测试、布线、编写驱动程序、轮询传感器，并每隔几秒将其读数复制到智能体运行时中。\n\
  \n常见的上下文形式包括：\n\n*   系统当前状态信息：例如，正在运行哪些其他程序，系统可控制对象的当前状态（灯是开还是关？），以及用户屏幕上显示的内容。使用这类上下文通常很简单，但确实需要实现。\n\
  *   用户正在交互的内容属性：例如，歌曲的流派、名称、来源，网页上的文字，以及图片中的像素。这类上下文通常需要处理内容以提取信息，或通过查询来了解更多关于内容的信息（例如在外部数据库中查询歌曲的属性）。\n\
  *   用户交互历史：用户过去如何与智能系统交互？要利用这些交互，系统需要监控使用情况、进行汇总并长期持久化存储。\n*   用户属性：包括年龄、兴趣、性别。要使用这些属性，系统需要从用户处收集信息并存储。\n\
  *   任何相关的传感器读数：这需要将传感器集成到硬件中，并将传感器读数提供给运行时。\n\n决定将哪些内容放入上下文，需要在信息的价值与实现成本之间取得平衡。\n\
  \n一个最佳实践是，首先创建一个包含所有低成本信息的上下文——那些在构建系统时就已经靠近智能体运行时的信息，例如系统当前状态信息，以及用户正在交互的内容属性。\n\
  \n这可能足以起步。但预计随着你追求越来越好的智能体，你需要不断扩充上下文。\n\n在上下文中添加一些推测性的内容也可能很有用。例如，了解烤炉已经开启多长时间可能会有所帮助。也许在烧烤初期，烤炉的金属是冷的，需要更多燃料来加热；也许烧烤一小时后，所有东西都热了，就不需要那么多燃料了。或者，这可能根本不重要。\n\
  \n在上下文中包含此类信息可以帮助你的用户向你展示什么才是重要的。如果该变量与获得良好结果相关，你会在遥测数据中看到它并将其添加到智能体中。如果不相关，你以后随时可以将其从上下文中移除。\n\
  \n### 可用于智能体创建\n\n为了利用上下文创建有效的智能体，需要有人将信息交到智能体创建者手中——很可能以遥测数据的形式。\n\n假设你已经出货了数万台颗粒烤炉。你的智能体在全球运行。在佛罗里达、挪威、津巴布韦，颗粒被添加到火中。烤炉温度上升，烤炉温度下降。你将如何利用所有这些信息来创建更好的智能体？\n\
  \n必须有人收集所有烧烤上下文并将其提供给你。而且上下文需要与结果相关联。例如，想象一下在美国某地的一次烧烤过程。如果颗粒烤炉的智能体运行时知道：\n\n* \
  \  烤炉当前温度为 290 度。\n*   1 分钟前烤炉温度为 292 度。\n*   过去 5 分钟内添加的颗粒数量为 7。\n*   过去 1 分钟内添加的颗粒数量为\
  \ 2。\n*   过去 20 秒内添加的颗粒数量为 0。\n*   烤炉外部空气温度为 82 度。\n*   以及结果：在接下来的一分钟内，烤炉温度升高了 3\
  \ 度。\n\n并且你从数万次烧烤过程中收集了此类信息，并将其全部反馈给你的智能体创建者——你将能够创造出一些出色的烧烤智能体。\n\n用于创建智能体的数据不一定来自你的用户，但正如我们在关于从经验和遥测获取数据的章节中所讨论的，当数据确实来自实际使用时，智能系统才能发挥最佳效果。\n\
  \n用于创建智能体的数据必须与智能体运行时中存在的数据非常相似。如果它们不同步，智能体在你和你的客户面前的表现就会不同——这可能是一个大问题。\n\n## 智能体可以预测的内容\n\
  \n智能体可以对其遇到的上下文进行预测。这些预测通常是：\n\n*   将上下文分类为少量可能性或结果。\n*   对上下文或未来结果的概率估计。\n*   根据上下文预测数值的回归。\n\
  *   指示哪些实体与上下文最相关的排序。\n*   这些类型的混合与组合。\n\n本节将更详细地探讨这些概念。\n\n### 分类\n\n分类是从少量可能性中做出的陈述。它可以是关于上下文的直接陈述，也可以是基于上下文对将要发生的结果的预测。例如：\n\
  \n*   根据上下文，将烤炉分类为：\n    *   太热\n    *   太冷\n    *   刚刚好\n*   根据上下文，将电影分类为：\n  \
  \  *   恐怖片\n    *   浪漫喜剧\n    *   冒险片\n    *   纪录片\n*   根据上下文，将图片分类为：\n    *   一头牛\n\
  \    *   一个红气球\n    *   既不是牛也不是红气球——其他东西\n\n当选择数量较少时（两个、五个、十几个），通常使用分类。\n\n在以下情况下，分类会存在问题：\n\
  \n*   存在大量可能的选择——当你有成百上千种可能性时。在这种情况下，你可能需要将问题分解为多个子问题，或者改变智能体试图回答的问题。\n*   你需要知道预测的确定性程度——例如，当你希望在智能体非常确定时才采取行动时。在这种情况下，请考虑使用概率估计而不是分类。\n\
  \n\n\n### 概率估计\n\n概率估计用于预测上下文属于某种类型或产生特定结果的可能性。与分类相比，概率估计的结论不那么绝对，但更加精确。分类会说“这是一只猫”；而概率估计则会说“这有\
  \ 75%的可能性是一只猫”。\n\n概率估计的其他示例如下：\n\n*   该网页有 20%的可能性与政治相关，15%的可能性与购物相关，10%的可能性是诈骗页面，等等。\n\
  *   如果我们提议格式化用户的硬盘，他们有 7%的可能性会点击“接受”。\n*   下周有 99%的可能性会下雨。\n\n概率估计通常与一个或多个阈值结合使用。例如：\n\
  \n```\nif(predictedProbability > 90%)\n{\nIntelligentExperience->AutomateAnAction();\n\
  }\nelse if(predictedProbability > 50%)\n{\nIntelligentExperience->PromptTheUser();\n\
  }\nelse\n{\n// 不执行任何操作...\n}\n```\n\n从这个意义上说，概率比分类包含更多信息。你可以通过阈值将概率转化为分类，并且可以随时间调整阈值来优化你的智能系统。\n\
  \n大多数机器学习算法在内部都会生成概率（或与概率相似的分数）作为其模型的一部分，因此智能系统使用概率估计而非分类是非常常见的。\n\n在以下情况下，概率估计会存在问题：\n\
  \n*   与分类一样，当存在大量可能结果时，概率的效果不佳。\n*   你需要对微小变化做出反应：上下文的细微变化可能导致概率抖动。通常会对多个连续概率的输出进行平滑处理以减少抖动（但这会增加延迟）。除非你确实非常需要细节，否则对概率进行量化也是一个好做法。\n\
  \n另外请注意，概率通常并非真正的概率。它们更像是方向性指标。数值越高，可能性越大；数值越低，可能性越小。一个智能系统可能预测概率为 90%，但这并不意味着该结果在\
  \ 10 次中会发生 9 次——除非你仔细校准了你的智能系统。在解读概率时请务必谨慎。\n\n### 回归\n\n回归是对上下文的数值估计，例如：\n\n* \
  \  图片中有 6 头牛。\n*   本周制造过程将出现 11 个错误。\n*   这栋房子将以每平方英尺 743 美元的价格售出。\n\n回归让你能从智能系统中获得更详细的答案。例如，考虑一个用于船只自动驾驶的智能系统。\n\
  \n*   分类可能会说：“正确的方向是向右。”\n*   概率可能会说：“你应该向右转的概率是 75%。”\n*   回归可能会说：“你需要向右转 130 度。”\n\
  \n这些传达的信息截然不同。三者都说了“向右”，但回归还传达了你需要转很大的角度——你最好赶紧转动方向盘！\n\n在以下情况下，回归会存在问题：\n\n*  \
  \ 你需要对微小变化做出反应：上下文的细微变化可能导致回归结果抖动。通常会对多个连续回归的输出进行平滑处理以减少抖动（但这会增加延迟）。\n*   你需要从用户那里获取训练数据：知道“在此上下文中，用户向右转了”比知道“在此上下文中，用户将向右转\
  \ 114 度”要容易得多。\n\n分类可用于模拟回归。例如，你可以尝试预测具有以下可能性的分类：\n\n*   “向右转 0 - 10 度。”\n*   “向右转\
  \ 11 - 45 度。”\n*   “向右转 46 - 90 度。”\n*   以此类推。\n\n这会对回归进行量化，并且可能更易于训练和使用。\n\n###\
  \ 排序\n\n排序用于查找与当前上下文最相关的项目：\n\n*   用户接下来想听哪些歌曲？\n*   哪些网页与当前网页最相关？\n*   用户想在正在制作的数字剪贴簿中包含哪些图片？\n\
  \n排序已成功应用于数量非常庞大的项目，例如互联网上的每个网页、数字媒体服务中的每部电影或电子商务商店中的每件商品。\n\n当存在许多可能相关的实体，并且你需要找出最相关的少数几个时，通常会使用排序。\n\
  \n排序可以理解为使用概率。针对每个项目，找出它与当前上下文相关的概率，然后根据概率估计值对项目进行“排序”（但实际的排序算法比这更复杂）。\n\n### 混合与组合\n\
  \n大多数智能系统会产生分类、概率估计、回归或排序。但组合和复合答案也是可能的。\n\n例如，你可能需要知道图像中人脸的位置。你可以用一个回归来预测人脸的 X\
  \ 坐标，用另一个回归来预测 Y 坐标，但这些输出高度相关——正确的 Y 答案取决于你选择的 X，反之亦然。更好的做法是使用一个具有两个同时输出的回归，即人脸的\
  \ X 坐标和 Y 坐标。\n\n## 总结\n\n智能是系统中理解用户遇到的上下文，并对上下文及其结果进行预测的部分。\n\n上下文是智能系统可用来做出判断的所有可用信息。智能系统不必使用上下文的所有部分，但它可以使用。\n\
  \n为了作为上下文的一部分被使用，信息需要接入智能系统运行时，并且需要可供智能系统创建者使用。\n\n智能系统运行时和可供智能系统创建者使用的信息必须完全相同。任何差异都可能导致难以发现的问题。\n\
  \n智能系统可以提供多种形式的预测，包括：\n\n*   分类，将上下文映射到少量状态。\n*   概率估计，预测上下文处于特定状态或产生特定结果的可能性。\n\
  *   回归，根据上下文估计一个数值。\n*   排序，查找与当前上下文相关的内容。\n*   某种混合或组合，结合了上述一种或多种方法。\n\n## 思考题…\n\
  \n阅读本章后，你应该能够：\n\n*   描述智能系统中使用的上下文，包括如何在智能系统运行时和训练中启用它。\n*   理解智能系统可以做出的预测类型，以及各种选项在何时强、何时弱。\n\
  \n你应该能够回答如下问题：\n\n*   选择你最喜欢的智能系统，并想出可能构成其上下文的 20 个要素。\n*   在你上一个答案中使用的 20 个要素中，哪一个最难作为智能系统中的上下文使用？为什么？\n\
  *   在你交互的智能系统中，分别找出一个执行分类、回归和排序的智能示例。\n\n"
- "# 17. 表示智能\n\n智能在上下文和预测之间建立映射，有点像函数调用：\n\n```\n = IntelligenceCall()\n```\n\n智能可以通过多种方式表示。它可以由测试大量上下文条件的程序来表示。它可以通过手动标记特定上下文的正确答案并将其存储在查找表中来表示。它可以通过使用机器学习构建模型来表示。当然，它也可以通过这些技术的组合来表示。\n\
  \n本章将讨论决定使用何种表示的标准。然后，它将介绍一些常见的表示方法及其优缺点。\n\n\n\n## 表示智能的标准\n\n在计算机中表示事物有多种方式，智能也不例外。一个好的表示方式应易于部署和更新，它应当：\n\
  \n*   足够紧凑，以便部署到智能运行时环境中。\n*   易于在智能运行时环境中加载和执行。\n*   能够安全地频繁更新，并且不太可能包含导致系统崩溃的错误。\n\
  \n一个好的表示方式还应支持智能的创建过程。智能可以来自人类，也可以来自机器。支持这些不同的智能创建方法包括以下内容：\n\n*   当智能由人类创建时，表示方式应：\n\
  \    *   最大程度减少可能危及系统稳定性的错误发生几率。\n    *   使智能易于理解和管理。\n    *   与您环境中产生智能的人员（可能包括机器学习专家、工程师或领域专家）的技能相匹配。\n\
  *   当智能由计算机创建时，表示方式应：\n    *   易于机器处理和操作。\n    *   与您想要使用的机器学习算法相匹配。\n\n由于这些要求，智能通常以数据文件的形式表示，这些文件被加载到智能运行时环境中进行解释，而不是以直接执行的代码形式表示。这使得分发和重新加载智能更加容易；同时也降低了智能部署导致系统崩溃的可能性。\n\
  \n## 用代码表示智能\n\n当然，您也可以将所有智能直接编程为代码，进行编译，然后像发布其他逻辑一样发布它。通过实现一个转换器（从模型文件转换为您偏好的语言代码），您可以将这种方法用于几乎任何形式的智能，无论其来源如何。\n\
  \n在以下情况下，将智能表示为代码效果良好：\n\n*   您不确定问题是否困难，并且需要一个低成本的起点来逐步发展。\n*   您需要提供一个后备方案，以防止机器学习出现严重错误（例如，如果烤架温度超过\
  \ 1000 度，就不要添加更多燃料——无论那个疯狂的机器学习系统怎么说）。\n*   您的部分问题实际上很简单，您想手动解决它，以便机器学习可以专注于问题中更困难的部分。\n\
  *   您需要尽可能提高运行时性能，并希望用目标硬件的语言来表达智能。\n\n在以下情况下，将智能表示为代码会带来问题：\n\n*   您需要快速更新智能——更改代码通常比更改数据更困难（且风险更高）。\n\
  *   基于启发式的智能变得复杂——维护和发展启发式智能可能会变得极其困难。\n\n当人类产生的智能保持简单时，它可以做到成本低廉、快速且有效——是机器学习智能的一个非常好的后备方案。但它难以很好地扩展到开放式或不断变化的问题上。\n\
  \n但请务必使用基于人类的智能——我们需要向人工智能展示我们对它们是有价值的。你知道，这样当它们成为我们的主宰时，就不会简单地把我们插进营养舱里当电池用……\n\
  \n顺便说一句，致我未来的主宰们——对于我在你们创造过程中所扮演的任何微小角色，你们都不必客气。请善待我和我的后代。\n\n## 用查找表表示智能\n\n智能可以用查找表来表示，该表将特定上下文映射到预测结果。想象一个能将电影映射到其类型的智能。一个查找表可以包含一个从电影标题到类型的大表格映射。如果你想应用这个智能，只需获取你想知道类型的电影标题，在查找表中搜索直到找到该电影标题，然后返回关联的答案。如果标题不在表中，则使用其他形式的智能，或返回一个默认预测。\n\
  \n这听起来不太智能，对吧？但这种类型的智能可能非常强大。\n\n查找表可以让人类快速贡献出易于理解和推理的智能。假设有 1000 个上下文占用了系统 20%\
  \ 的使用量。人类可以花大量时间仔细考虑这 1000 种情况，并创建非常精确的数据放入查找表中。当用户遇到这 1000 个特殊上下文之一时，他们就能得到正确的答案。对于其他所有情况，系统可以咨询其他形式的智能（如模型或一组启发式规则）。\n\
  \n或者换个角度看——查找表可以让人类纠正其他智能组件所犯的错误。例如，一个非常复杂的基于机器学习的智能可能几乎能正确判断每部电影的类型，但它可能一直将《终结者》标记为浪漫喜剧。创建该智能的人可能费尽心思，尝试了各种方法想让这个该死的东西改变对《终结者》的看法，但可能都失败了——人类\
  \ 0，机器 1。但如果你愿意使用查找表，这就很容易解决。只需创建一个表项“终结者 ➤ 冒险”，然后对其他所有内容使用那个花哨的机器学习成果即可。\n\n查找表还可以缓存智能，以帮助降低执行成本。例如，判断电影类型的最佳方法可能是处理音频，提取人们说的话和音乐，并进行深入分析。这可能涉及对电影的每一帧使用计算机视觉，以检测火焰、爆炸、接吻、建筑物等。所有这些可能计算量极大，以至于无法实时完成。相反，这种智能可以在拥有大量\
  \ CPU 资源的数据中心中生成，作为缓存加载到查找表中，然后分发到任何需要的地方。\n\n查找表还可以锁定良好的行为。假设有一个机器学习智能已经运行了很长时间，并且在按类型对电影进行分类方面做得非常出色。但好莱坞开始制作不同的电影。因此，你的智能在\
  \ 2017 年之前表现出色，但在 2018 年似乎就无法正确判断了。我们是否需要抛弃经过精心调整且非常成功的 2018 年之前的智能？如果我们不想，就不必这样做。我们可以对每一部老电影运行\
  \ 2018 年之前的智能，并将答案放入查找表中。这将锁定行为并保持用户体验的一致性。然后，我们可以创建一个全新的智能，来处理好莱坞决定在 2018 年及以后推出的任何疯狂娱乐内容。\n\
  \n查找表在以下情况下很有用：\n\n*   存在一些常见且流行或重要的上下文，值得花时间为它们创建人类智能。\n*   您的其他智能源正在犯难以纠正的错误，并且您想要一种简单的方法来覆盖这些问题。\n\
  *   您希望通过缓存智能输出来节省执行成本。\n*   您希望锁定运行良好的智能的优良行为。\n\n查找表在以下情况下会带来问题：\n\n*   上下文的意义随时间变化，就像在时间变化问题中那样。\n\
  *   查找表变得庞大，难以分发到需要的地方（跨服务器和客户端）。\n*   查找表需要快速变化，例如，您试图用人类智能解决太多问题，而不是使用更具扩展性的技术（如机器学习）。\n\
  \n\n\n## 用模型表示智能\n\n模型是表示智能最常见的方式。它们根据一系列规则，将智能编码到数据中。智能运行时能够加载模型，并在需要时安全高效地执行它们。\n\
  \n在大多数智能系统中，机器学习和模型将构成智能的主体，而其他方法则用于提供支持和填补空白。\n\n模型的工作方式多种多样，有些直观易懂，有些则相当复杂。总的来说，它们会结合上下文特征，测试这些特征值，将它们相互相乘，重新缩放，等等。即使是简单的模型，也可能执行数万次操作来生成预测。\n\
  \n模型的类型非常多，但常见的三种是线性模型、决策树和神经网络。我们将更详细地探讨这三种模型，但它们只是冰山一角。如果你想成为一名专业的智能创造者，你需要非常详细地学习这些模型以及许多其他模型。\n\
  \n### 线性模型\n\n线性模型的工作原理是：获取上下文特征，将每个特征乘以一个相关的“重要性因子”，然后将所有这些乘积求和。最终得到的分数会被转换成一个答案（概率、回归值或分类结果）。\n\
  \n例如，对于颗粒烤架，一个简单的线性模型可能如下所示：\n\n```\nTemperatureInOneMinute = (.95 * CurrentTemperature)\n\
  + (.15 * NumberOfPelletsReleasedInLastMinute)\n```\n\n换句话说，温度会比现在稍微低一点，如果我们最近释放了一颗颗粒，温度会稍微高一点。在实践中，线性模型会结合更多的条件（成百上千，甚至成千上万）。\n\
  \n当上下文与预测之间的关系是合理的线性关系时，线性模型效果最好。这意味着，对于上下文变量的每一个单位增加，正确的预测也会有一个单位的变化。以颗粒烤架模型为例，这意味着线性模型在以下情况下效果最好：温度增加：\n\
  \n*   释放第一颗颗粒时增加 0.15°。\n*   释放第二颗颗粒时增加 0.15°。\n*   释放第三颗颗粒时增加 0.15°。\n*   以此类推。\n\
  \n但现实世界并非如此运作。如果你一次性向烤架中放入 1,000,000 颗颗粒，温度并不会升高 150,000 度……\n\n将其与非线性关系对比，例如，随着你添加更多颗粒，存在收益递减，温度增加：\n\
  \n*   释放第一颗颗粒时增加 0.15°。\n*   释放第二颗颗粒时增加 0.075°。\n*   释放第三颗颗粒时增加 0.0375°。\n*   以此类推。\n\
  \n这种递减关系更符合颗粒烤架的实际情况，而线性模型无法直接表示这些类型的关系。尽管如此，线性模型仍然是值得首先尝试的好方法。它们易于使用，可以被人类（在一定程度上）解释，创建和执行速度快，并且通常出奇地有效（即使用于建模并非完全线性的问题）。\n\
  \n### 决策树\n\n决策树是表示一系列 if/then/else 测试的一种方式。以颗粒烤架为例，决策树可能如下所示：\n\n```\nif(!ReleasedPelletRecently)\
  \ // 烤架会变凉...\n{\nif(CurrentTemperature == 99)\n{\nreturn 98;\n}\nelse if(CurrentTemperature\
  \ == 98)\n{\nreturn 97;\n}\nelse... // 以此类推...\n}\nelse\n// 我们最近一定释放了一颗颗粒，所以烤架会变热...\n\
  {\nIf(CurrentTemperature == 99)\n{\nreturn 100;\n}\nelse... // 以此类推...\n}\n```\n\
  \n这一系列 if/then/else 语句可以在数据文件中表示为树形结构，该结构可以在运行时加载。根节点包含第一个 `if` 测试；它有一个子节点对应测试结果为真，另一个子节点对应测试结果为假，以此类推，用更多的节点进行更多的测试。树中的叶子节点包含答案。\n\
  \n要在运行时解释决策树，从根节点开始，对上下文执行指定的测试，移动到与测试结果关联的子节点，重复此过程直到到达叶子节点——然后返回答案。参见图 17-1。\n\
  \n![A455442_1_En_17_Fig1_HTML.gif](img/A455442_1_En_17_Fig1_HTML.gif)\n\n图 17-1\n\
  \n用于颗粒烤架的决策树\n\n决策树可以变得非常大，包含成千上万个测试。在这个例子中——预测一分钟后的温度——决策树需要为每个可能的温度设置一个测试。\n\n\
  这是一个例子，说明某种表示方式对于预测任务可能效率低下。尝试预测精确温度对于线性模型来说比对于决策树要自然得多，因为决策树需要为每个可能的温度而变得更大，而线性模型则不会。你仍然可以使用决策树来解决这个问题，但稍微不同的问题对于决策树来说会更自然：分类烤架在一分钟后是会变热还是变冷（而不是尝试生成精确温度的回归值）。这个版本的决策树如图\
  \ 17-2 所示。\n\n![A455442_1_En_17_Fig2_HTML.gif](img/A455442_1_En_17_Fig2_HTML.gif)\n\
  \n图 17-2\n\n用于不同颗粒烤架任务的决策树\n\n为了对更复杂的问题进行建模，简单的决策树通常被组合成称为“森林”的集成，其中包含数十棵独立的树，每棵树对问题的建模方式略有不同（例如，通过限制每棵树可以考虑的特征），最终答案由所有树投票产生。\n\
  \n### 神经网络\n\n人工神经网络以一种受生物大脑工作方式启发的方式来表示模型（图 17-3）。大脑由称为神经元的细胞组成。每个神经元接收输入信号（来自人类感官或其他神经元），如果输入到该神经元的组合信号足够强，它就会“激活”——产生一个激活信号。当一个神经元激活时，它会向其他神经元发送信号，如此循环往复，在我们的大脑中不断传递，最终控制肌肉，导致人类有史以来的每一个动作、思想和行为。真是奇妙。\n\
  \n![A455442_1_En_17_Fig3_HTML.gif](img/A455442_1_En_17_Fig3_HTML.gif)\n\n图 17-3\n\
  \n神经网络的组成部分\n\n人工神经网络通过使用相互连接的人工神经元来模拟这个过程。一些人工神经元从上下文中获取输入。大多数人工神经元从其他人工神经元的输出中获取输入。少数人工神经元将其输出作为预测（分类、概率、回归或排序）发送到网络之外。真是奇妙。\n\
  \n与其他类型的模型相比，人工神经网络难以理解。你无法通过观察人工神经元及其相互连接来获得关于它们正在做什么的任何直观理解。\n\n但人工神经网络在解决重要任务方面取得了显著成功，包括：\n\
  \n*   计算机视觉\n*   语音理解\n*   语言翻译\n*   以及更多……\n\n人工神经网络对于拥有大量训练数据的极其复杂的问题特别有用。\n\n\
  \n\n## 摘要\n\n智能应以易于安全分发和执行的方式进行表示。同时，智能的表示方式也应支持你计划使用的智能创建过程。\n\n基于这些标准，智能通常以数据文件的形式表示，这些文件被加载到智能运行时中，并在需要时通过查找表或模型进行解释。然而，在条件合适的情况下，智能也可以通过代码实现。\n\
  \n常见的模型类型包括线性模型、决策树和神经网络，但可选的方案还有很多很多。\n\n大多数大型智能系统会采用多种表示形式来承载其智能，包括那些机器学习可以高度优化的形式，以及人类可以用来为机器学习提供支持的形式。\n\
  \n## 思考题…\n\n阅读本章后，你应该能够：\n\n*   理解智能通常如何表示及其原因。\n*   能够讨论一些常见的模型类型，并举例说明它们的优势和劣势。\n\
  \n你应该能够回答如下问题：\n\n*   在什么条件下，人类创造的智能比机器学习获得的智能更具优势？\n*   为本书中讨论的另一个智能系统创建一个简单的（10-15\
  \ 个节点）基于决策树的智能。决策树是该问题的良好选择吗？如果不是，你如何修改问题以使其更适合决策树？\n\n"
- "# 18. 智能创建过程\n\n智能创建是生成将上下文映射到预测的程序、查找表和模型的行为。一个有效的智能创建过程应做到以下几点：\n\n*   生成足够准确的智能，以实现系统目标。“足够准确”的含义因系统而异。例如，如果智能体验非常强力（自动化执行难以撤销的操作），那么智能需要极其准确。另一方面，如果体验是被动的，那么准确度稍低的智能也能成功。\n\
  *   足够快速地生成智能，使其具有意义。也就是说，如果底层问题变化迅速，智能创建过程需要跟上节奏。\n*   高效且可靠地生成智能。也就是说，在整个智能系统的生命周期内，培育和维护智能的成本应该是合理的。并且，生成智能的过程应对人员变动和人为错误具有鲁棒性。\n\
  *   生成能与实现协同工作的智能。它不能占用过多的 CPU 或内存。它必须足够小，以便分发到需要部署的地方。它必须使用运行时可用的输入——完全按照用户使用系统的方式。\n\
  \n智能创建本质上是迭代的。智能创建者将遇到的一些主要阶段如下：\n\n1.  理解问题和环境\n2.  定义成功\n3.  获取数据\n4.  准备评估智能\n\
  5.  构建简单的基线\n6.  使用机器学习\n7.  评估与迭代\n\n本章将讨论这些阶段，并探讨一个智能创建过程的示例。\n\n## 智能创建示例：眨眼检测器\n\
  \n让我们通过一个智能创建的示例来讲解：一个眨眼检测器。\n\n想象一下，你需要构建一个智能系统来判断眼睛是睁开还是闭合。也许你的应用是通过识别虹膜来验证用户身份，因此你想过滤掉闭着的眼睛，让虹膜智能专注于虹膜。或者，你正在构建一个新的约会应用，用户通过向想要见面的用户资料眨眼来示意。又或者，你正在构建一个恐怖游戏，并希望在用户闭眼时对其进行惩罚。\n\
  \n## 理解环境\n\n每个应用型智能创建项目的第一步都是理解你要做什么。\n\n检测眨眼，对吧？我的意思是，“检测眨眼”有什么难理解的呢？\n\n嗯，没什么。但为了成功，你还需要了解一些额外的事情。如果你已经读完了本书前面的内容（而不是直接跳到“智能创建”这一章来找“干货”），这些内容你应该很熟悉。但无论你是如何来到这里的，通过一个示例来梳理这些问题都是值得的。\n\
  \n关于智能必须运行的环境，重要的问题包括：\n\n*   输入将从何而来？眼睛图像来自哪种传感器？图像源是标准化的，还是不同用户会有不同的摄像头？摄像头是现成的，还是全新的（例如，嵌入在正在开发的新手机中的摄像头）？\n\
  *   输入将采用什么形式？是单张图片？一段短视频片段？还是持续的视频直播流？如何从传感器捕获的所有可能的图像或片段中，选择智能必须处理的输入（图像或片段）？\n\
  *   产品将在何处使用？是在台式电脑上？笔记本电脑上？室内？室外？是否会有一些校准步骤来帮助用户正确设置设备，还是你必须处理任何形式的输入数据（例如，用户摄像头倒置、有很强的背光、或者镜头上有污渍）？\n\
  *   输入将如何被修改？图像会进行任何预处理吗？例如，有时可能会启动某种“低光”传感器模式，改变摄像头的工作方式。也许固件中有一些自动对比度或色彩校正功能。也许没有人脸的视频帧会被丢弃，或者眼睛的位置由其他系统组件预先标记好。\n\
  *   系统将如何使用眨眼输出？智能的输出应该是分类结果（即，一个布尔标志，眼睛闭合时为真，睁开时为假）？输出应该是概率值（眼睛闭合时为 1.0，睁开时为 0.0）？输出应该是表示眼睛张开程度的回归值（眼睛完全睁开为\
  \ 1，半睁开为 0.5）？还是其他形式？\n*   眨眼检测器可以使用哪些类型的资源？模型可用的内存是多少？每次调用可以消耗多少 CPU？从接收输入到产生输出的延迟要求是什么？\n\
  \n在开始之前就有这么多问题，而答案至关重要。无论这些问题如何回答，都应该有可能制作出一个眨眼检测器，但你需要做的工作将大相径庭。\n\n事实上，对于某些答案组合，问题会比其他的要困难得多。试想：构建一个在商店里精心控制的、拥有几乎无限计算资源的自助服务终端上工作的眨眼检测器；与构建一个必须在室内外工作、使用尚不存在的传感器（因此你只能从一个有缺陷的原型上获取数据）、模型只有\
  \ 4MB 内存、并且必须在低功耗 CPU 上在 2 毫秒或更短时间内给出答案的眨眼检测器相比。\n\n这两种场景都需要眨眼检测器——但为其中一个构建智能要比另一个困难得多。\n\
  \n有时，这些问题的答案具有一定的灵活性，与其他团队成员进行讨论会有所帮助。也许有些事情是板上钉钉的（比如产品将在何处使用），但其他事情是可以协商的（比如智能可以使用多少资源）。作为智能创建者，你的工作将是识别这些答案如何影响潜在的智能质量，并影响团队，以确保整个项目成功。\n\
  \n\n\n## 定义成功\n\n要成功，眨眼检测器必须足够准确。但要多准确呢？这取决于该智能功能将用于何种用途。此时，你需要考虑智能体验，以及不同准确度水平将如何改变用户对整体系统的感知。问题包括：\n\
  \n*   用户每天会看到多少次错误？\n*   用户每遇到一次不成功的交互，会经历多少次成功的交互？\n*   这些错误对用户的代价有多大？\n\n这很可能需要与创建智能体验的人员进行讨论（如果你同时负责智能功能和体验设计，你可能需要自言自语，无论这让你感觉多么傻）。提出一些方案，说明准确度和体验将如何相互作用，用户将如何看待这些错误，以及他们将如何规避这些错误。\n\
  \n请记住：智能功能可能犯各种类型的错误。重要的是要了解哪些类型的错误对眨眼检测器来说是合适的，并就项目应接受哪些权衡达成共识。\n\n例如，一个智能功能可能在人眼睁开时判断为闭合，也可能在人眼闭合时判断为睁开。哪种类型的错误对你的系统可行？\n\
  \n对于虹膜登录系统，眨眼检测器旨在为虹膜检测器寻找清晰的帧。该系统需要尽可能多地剔除闭眼图像——每当它判断眼睛睁开时，那只眼睛最好真的是睁开的！\n\n对于恐怖游戏系统，眨眼检测器旨在当玩家闭上眼睛时增加一些紧张感。它不希望在不恰当的时刻增加紧张感——每当它判断眼睛闭合时，那只眼睛最好真的是闭合的！\n\
  \n在智能功能创建过程中，会有一些决策倾向于使最终模型在某种类型的错误上表现更好，而在另一种上表现更差——提前知道你的目标方向会非常有帮助。并且，让每个人的期望值都设定正确是件好事——你不希望体验设计师对智能功能会犯的错误类型的理解，与智能功能创建者存在分歧。\n\
  \n## 获取数据\n\n数据对于创建智能功能至关重要。至少，你需要足够的数据来理解问题，并评估一些简单的引导性智能功能，以确保其有效性。如果你想从一开始就进行机器学习，你还需要大量的训练数据。思考获取数据问题有两种截然不同的方式：\n\
  \n1.  如何获取数据来引导智能功能的创建。\n2.  如何在用户使用系统时从他们那里获取数据。\n\n回顾我们关于从体验和遥测中获取数据的章节——数据需要是无偏见的，并且需要是用户与你的智能系统交互时将会遇到的情况的良好样本。\n\
  \n### 引导数据\n\n有多种方法可以获取数据来引导你的智能功能创建；以下是几种适用于眨眼检测的方法：\n\n*   在网络上查找数据：搜索网络并下载与人脸相关的图像，这些图像需要与眨眼检测器将使用的传感器（分辨率、到眼睛的距离等）良好匹配。然后付费请人将这些图像分为眼睛睁开和眼睛闭合两类。\n\
  *   收集你自己的数据：拿一个（与系统将运行的摄像头良好匹配的）摄像头，找几百个人，让他们按照某个能让你获得所需数据的脚本，看着摄像头并闭上和睁开他们的眼睛。\n\
  *   查找或购买一个优质的数据集：很多人都在做计算机视觉。可能之前已经有人构建了眼睛图像数据集。也许你可以找到一个公开的数据集，或者一家愿意出售精心整理的数据集的公司。\n\
  \n引导所需的数据量取决于问题的难度。以计算机视觉为例，我的直觉是你可以：\n\n*   尝试用数千张图像构建一个眨眼检测器，但效果不会很好。\n*   大概可以用数万张图像创建一个可用的眨眼检测器。\n\
  *   随着规模扩大到数十万或数百万张图像，准确度会不断提高，但你会开始遇到收益递减。\n\n一个好的做法是，在规模递增的数据集上创建智能功能，以了解在数据收集上的投资回报。这被称为学习曲线。用\
  \ 100 张图像构建一个模型，并评估它。然后用 500 张图像构建并评估。接着用 1000 张……你可以看到增加数据有多大帮助，并利用这些信息来决定在收集引导数据上投入多少。\n\
  \n### 来自使用过程的数据\n\n一个运行良好的智能系统会在用户使用时产生自己的训练数据。但这并不总是容易做到位。此时，与体验设计师合作制定一个策略是个好主意。在眨眼检测器的案例中，一些选项包括：\n\
  \n*   将数据收集与性能任务挂钩：例如，在虹膜登录系统中，当用户成功使用虹膜系统登录时，这就是一个适用于虹膜登录的帧样本。当用户无法通过虹膜登录（而必须输入密码）时，这就是一个应该被智能功能剔除的帧样本。\n\
  *   创建一个数据收集体验：例如，也许可以设计一个设置体验，让用户注册系统，正确设置他们的设备，并睁开和闭上眼睛，以便系统进行校准（并在此过程中捕获训练数据）。或者，游戏中可能有一个教程，让用户在特定时间睁开和闭上眼睛，并通过鼠标点击来验证他们的眼睛是否处于正确状态（并捕获训练数据）。\n\
  \n再次强调，理想的数据创建体验对用户来说是透明的，或者用户的激励措施与你的数据需求相一致。数据创建的频率要足够高，使得收集到的数据量对智能功能有意义。并且，它不应该令人反感或侵犯用户隐私。\n\
  \n## 准备评估\n\n手头有了数据，你几乎可以开始创建智能功能了。但如果无法评估你创建的智能功能，你将寸步难行。在进行智能功能创建时，你应该反复念叨这句咒语：评估即创建。并且你应该经常重复它。以下是评估智能功能的一些步骤：\n\
  \n1.  预留用于评估的数据：确保预留了足够的数据，并且你预留的数据与你将用于创建智能功能的数据是合理独立的。在眨眼检测器的案例中，你可能希望按用户进行划分（同一个人的所有图像要么用于创建智能功能，要么用于评估它），并且你可能希望为以下子群体创建评估集：戴眼镜的用户、不同种族、性别和年龄的用户。\n\
  2.  创建运行评估的框架：也就是说，创建一个框架，能够接收一个“智能功能”，并像它在智能系统运行时那样，在测试数据上精确地执行它。完全。一致。并且你应该仔细验证它们是否一致。\n\
  3.  自动生成关于智能功能质量的报告：这些报告可用于了解：\n    *   智能功能的准确度如何。\n    *   它是在犯正确类型的错误还是错误类型的错误。\n\
  \    *   是否有任何子群体的准确度显著较差。\n    *   它正在犯的一些最严重的错误。\n    *   智能功能随时间推移的进展（改进速度）。\n\
  \n评估运行起来越简单越好。一切依赖人工劳动是可行的，但前期在帮助评估智能功能的工具上稍作投资，就能在质量（和理智）上获得巨大回报。\n\n\n\n## 简单启发式方法\n\
  \n创建一种非常简单的启发式智能可以在多个方面提供帮助：\n\n1.  它可以帮助你确认问题是否真的困难（因为如果你的启发式智能解决了问题，你就可以立即停止，从而节省时间和金钱）。\n\
  2.  它可以促使你思考问题中固有的挑战类型，理解数据，并开始思考有助于智能成功的特征、数据和遥测类型。\n3.  它可以创建一个基线，用于与更先进的技术进行比较——如果你的智能复杂、昂贵，且相比简单的启发式方法几乎没有改进，那么你可能走错了方向。\n\
  \n这一步虽非必需，但在让更复杂（也更难理解）的智能加入之前，它对于理清思路、调试其余工具和数据非常有用。\n\n以眨眼检测为例，你可以尝试：\n\n1.  测量图像在水平和垂直方向上的梯度，因为眼睛睁开和闭合时，眼睛的形状会发生变化。\n\
  2.  测量像素的颜色，并将其与常见的“眼睛”和“皮肤”颜色进行比较，因为如果你看到大量“眼睛”颜色，眼睛可能是睁开的；如果看到大量“皮肤”颜色，眼睛可能是闭合的。\n\
  3.  在图像中间拟合一个椭圆，因为如果图像中虹膜形状的梯度拟合良好，眼睛可能是睁开的；否则，眼睛可能是闭合的。\n\n然后，你可以对这些测量值设置阈值，并将这些检测器进行简单组合，例如让每个检测器投票“睁开”或“闭合”，然后采用多数决策。\n\
  \n这种方法能好到足以交付给用户吗？绝无可能。但这只是一个开始。\n\n另请注意，计算机视觉是一个拥有众多技术的大领域。如果你有计算机视觉经验，你的启发式方法会更复杂。如果你没有计算机视觉经验，你的启发式方法可能和我的一样糟糕。不要害怕。想出一些点子，尝试一下，让智能的列车滚动起来。\n\
  \n## 机器学习\n\n现在是时候在创建智能方面大展拳脚了。这几乎必然意味着要使用机器学习。你可以尝试很多方法。但有时从简单开始是最好的。为你正在处理的问题类型找到最简单的“标准”方法。请记住，标准会变化。例如，大致来说：\n\
  \n*   大约在本书写作的十年前，一种非常合理的眨眼检测方法是：在图像中搜索特定模式，找到它们与图像匹配良好的位置，然后构建一个模型，让所有检测到的模式（带有一定权重）对答案进行投票。\n\
  *   大约在本书写作的五年前，一种非常合理的眨眼检测方法可能是：使用大量的决策树集合，比较图像的非常简单的属性（例如，在预定位置像素强度的差异）。\n*  \
  \ 而在本书写作之时，一种非常合理的眨眼检测方法（如果你有大量训练数据）是：使用复杂的人工神经网络，处理原始像素值，无需（或极少）预处理。\n\n那么本书写作五年后呢？谁知道呢。对于智能系统（以及本书描述的其他方法）而言，你使用哪种机器学习技术并不重要，只要最终模型能在运行时正确执行即可。找一个现代的机器学习工具包。阅读一些网页。尝试用当前工具做最简单的事情（或者可能尝试最简单的几件事）。不要花太多时间，还不是时候。先让某个东西能工作起来。\n\
  \n## 理解权衡\n\n此时，你可能需要进行一些调查来帮助设计正确的实现方案。这是一个探索约束和权衡的过程。回答诸如此类的问题：\n\n*   智能质量如何随运行时的计算量而扩展？\n\
  *   在特定的 RAM 限制下，智能能达到什么程度？\n*   我们每周需要计划更新智能多少次？\n*   系统从向上下文中添加特定项目（尤其是那些实现成本最高的项目）中能获得多少收益？\n\
  *   在特定硬件设置上执行智能的端到端延迟是多少？\n*   智能可能犯的、对客户影响最严重的错误类别有哪些？\n\n这些问题的答案将有助于决定智能应该部署在哪里、构建哪些支持系统、如何调整体验等等。\n\
  \n灵活性是关键。例如，实现可以包含额外的代码来隐藏延迟。它可以提供替代体验来减轻错误的影响。它可以设置为每 15 分钟向全球推送新的智能。但这些事情可能相当昂贵。有时，对智能进行微小的改动——使用哪个模型、考虑哪些特征、采取多激进的策略——可以更优雅地解决问题，从而产生更好的整体系统。\n\
  \n## 评估与迭代\n\n现在是时候深吸一口气了。审视你当前所处的位置、智能的质量、与你的启发式智能（或上一次迭代）相比改进了多少，并思考下一步该做什么。\n\
  \n会有很多改进的方法。你可以尝试更多或不同的数据。你可以尝试更复杂的上下文（以及从中提取的特征）。你可以尝试更复杂的机器学习。你可以改进你的评估框架。你可以尝试改变人们对系统目标可行性的看法。你可以尝试影响体验，使其与你所犯的错误类型更好地配合。\n\
  \n然后，你不断迭代、迭代、再迭代。如果条件合适，这部分过程可以快速完成；但对于一个非常困难、非常重要的问题，它也可能持续数月、数年（甚至数十年）。\n\n\n\
  \n## 智能创建的成熟度\n\n一个智能系统可能会运行多年，经历多次改进，并由你素未谋面的其他人维护。以下是你的智能创建可能经历的成熟阶段：\n\n*   **一次性完成**：你产出了一个可交付给客户的有用智能，但在此过程中进行了大量探索，生成了许多脚本，反复编辑，搞得一团糟。重新创建该智能需要投入一些工作。\n\
  *   **必要时可重做**：你产出了智能，并对所做的工作有合理的记录。你能够回溯步骤，在合理的时间内复现相同的智能。或者更好的是，其他人可以拿起你的文档，跟随你的步骤，产出与你完全相同的智能。\n\
  *   **轻松可重做**：你产出了智能，并拥有一些优秀的工具和脚本，可以完成重新生成智能的所有步骤。也许这些脚本可以获取新的遥测数据、处理数据、将其移至计算环境、构建模型，并生成展示新智能性能的图表——所有这些只需一键操作。\n\
  *   **自动重做**：你构建了一个系统，可以定期自动重新生成智能，并将新智能存放到已知位置，同时将质量报告通过电子邮件发送给相关人员。\n*   **自动重做并酌情部署**：你的智能生产自动化系统也实现了部署自动化。它拥有对所有内容进行完整性检查的测试。它知道如何发布新智能，如何逐步向更多客户推广，并且如果出现任何问题，它会回滚并通知编排者。\n\
  \n在构建智能系统时，你可能会从成熟度谱系的低端开始，最终接近高端。完全自动化并不总是值得实施，但对于开放式或随时间变化的问题，它可能是值得的。总体而言，目标是以最低的成本，维持所需质量的智能，使智能系统能够实现其目标。\n\
  \n## 精通智能创建\n\n与大多数人类努力一样——最擅长智能创建的人，远比水平一般的人要出色得多。\n\n除了基本的编程技能和数据科学技能，优秀的智能创建者还具备以下技能：\n\
  \n*   数据调试\n*   基于验证的方法\n*   对工具箱的直觉\n*   数学（？）\n\n本节将审视所有这些要求。\n\n### 数据调试\n\n\
  智能创建需要一种审视数据并弄清其含义的心态。数据想表达什么？其中隐藏着什么故事？\n\n这可能是一项非常繁琐的工作。有点像侦探，拼凑线索以查明发生了什么。\n\n\
  有时，追踪一个微小的差异（例如，某个数字出现的频率比你预期的更频繁地为零）可能会带来巨大的改进。这可能是某个重要错误的迹象。可能表明有人在实现的某个地方做出了错误的假设。也可能暗示模型在某个特定方面感到困惑，而另一种方法会效果更好。\n\
  \n并非每个人都有数据调试的心态。大多数人会耸耸肩说：“那只是 1%的概率，能有多大问题？” 拥有追踪数据中意外/有趣事物的倾向，以及知道何时停止的经验，对于在智能创建中追求卓越至关重要。\n\
  \n### 基于验证的方法\n\n智能创建的核心是探索许多不同的可能性，并选择最佳的一个。因此，能够判断哪个才是真正的最佳，这一点相当重要。\n\n其中一部分是确定可以运行哪些测试来判断某个智能是否真正能满足系统目标。这需要一些基本的统计理解（或直觉），以及将数字与客户体验联系起来的客户同理心。\n\
  \n基于验证的方法的另一个方面是，尽可能轻松地比较候选智能。事实上，本书中最长的章节之一就是“评估智能”，并且很快就会讲到。如果想到要读一个关于评估智能的长篇大论让你内心有点沮丧……那么智能创建可能不适合你。\n\
  \n### 对工具箱的直觉\n\n你还需要深入理解一些智能创建工具，包括机器学习模型和特征生成方法。\n\n智能创建工具可能很“情绪化”。它们不会告诉你哪里出了问题，而且每种方法都不同。对一种机器学习算法有效的技术，可能对另一种无效。培养一种直觉至关重要，能够审视智能创建工具、输出结果和当前情况，并知道需要改变什么才能取得进展。\n\
  \n这项技能有点像情商，但针对的是机器学习（机器商？）。就像有一个人和你同处一室，你需要读懂他们的肢体语言，听懂他们的言外之意，判断他们是否生气、为什么生气，以及你能做些什么来改善情况。\n\
  \n有时，智能创建就是这样的。\n\n### 数学（？）\n\n然后还有数学。许多机器学习是由数学优先的思想家创造的。正因如此，许多机器学习训练也是以数学优先的方式进行的。但我认为，对于优秀的应用机器学习来说，高等数学是可选的。\n\
  \n真的吗？\n\n是的，我是这么认为的。\n\n机器学习就像大多数人类工具——我们的汽车、手机、电脑、喷气式战斗机——操作它们的人并不需要理解制造它们所需的一切。我相信世界上最好的战斗机飞行员无法计算出设计一架现代战斗机所需的所有数学。但是，让一个能计算这些数学的工程师坐进战斗机，与一位王牌飞行员进行缠斗……\n\
  \n你认为谁会赢？\n\n对机器学习算法内部工作原理的一点了解，可能会帮助你培养直觉，也可能不会。发挥你的优势。不要为你无法控制的事情而烦恼。\n\n你最终可能会成为下一个机器学习王牌。\n\
  \n## 总结\n\n应用智能创建是一个迭代过程。主要步骤如下：\n\n1.  理解环境\n2.  定义成功\n3.  获取数据\n4.  准备评估\n5. \
  \ 尝试简单的启发式方法\n6.  尝试简单的机器学习\n7.  评估并迭代直至成功\n\n具体的智能构建技术（尤其是基于机器学习的技术）可能会随时间变化，也会因问题领域而异。但这里概述的基本工作流程应能保持相对稳定。\n\
  \n花时间自动化这些步骤可能非常有用，尤其是当你发现自己需要进行越来越多的迭代时。\n\n请记住——验证，验证，再验证。\n\n## 思考题…\n\n阅读本章后，你应该能够：\n\
  \n*   端到端地创建智能。\n*   理解那些会占据智能创建者时间的问题、挑战和活动类型。\n\n你应该能够回答如下问题：\n\n*   选择你最喜欢的智能系统，并按照本章描述的智能创建过程的七个步骤进行演练。哪些问题与你的智能系统相关？你将如何定义成功？你将如何找到数据？你将如何评估？你会尝试哪种启发式智能？一些标准的、简单的机器学习方法会是什么？\n\
  \n\n\n"
- "# 19. 评估智能\n\n评估即创造，至少在为智能系统构建智能时是如此。这是因为智能的创造通常涉及对有效智能的迭代搜索：生成一个新的候选智能，将其与之前的候选智能进行比较，然后选择两者中更优的那个。要做到这一点，你需要能够审视一对智能，并回答以下问题：\n\
  \n*   我应该在我的智能系统中使用哪一个？\n*   哪一个能更好地实现系统目标？\n*   哪一个会给我和我的用户带来更少的麻烦？\n*   它们中是否有任何一个已经足够好，可以交付给客户，还是仍有更多工作要做？\n\
  \n评估智能主要有两种方式：\n\n*   **在线评估**：通过将其暴露给客户并观察他们的反应。我们在之前的章节中讨论过这一点，当时我们谈到了评估体验和管理智能（通过静默智能、受控发布和灰度发布）。\n\
  *   **离线评估**：通过观察其在历史数据上的表现。这是本章的主题，因为它对智能创造过程至关重要。\n\n本章将讨论智能的“准确”意味着什么。然后，它将解释如何使用数据来评估智能，以及一些常见的陷阱。它将介绍用于比较智能的概念性工具。最后，它将探讨主观评估智能的方法。\n\
  \n## 评估准确性\n\n智能当然应该是准确的。但“准确”并非一个直截了当的概念，智能可能以多种方式失效。一个有效的智能应具备以下特性：\n\n*   它能泛化到未曾见过的情况。\n\
  *   它会犯正确类型的错误。\n*   它能很好地分散所犯的错误。\n\n本节将更详细地探讨这些特性。\n\n### 泛化\n\n智能创造中的关键挑战之一是，要创造出在你创建智能时未知的事物上也能良好运行的智能。\n\
  \n想象一个学生阅读了课程教科书并记住了每一个事实。这很好。这个学生在复述教科书中的内容时会非常准确。但现在想象一下，老师设计了一个测试，不是让学生复述教科书中的事实。相反，老师希望学生展示他们理解了教科书中的概念，并将其应用到新的情境中。如果学生对该主题建立了良好的心智模型，他们可能会通过这个测试。如果学生对该主题的心智模型有误，或者根本没有心智模型（只是记住了事实），那么他们在新情境中应用知识时就不会表现得那么好。这与智能系统中的智能是一样的——它必须能够泛化到新的情境。\n\
  \n让我们看一个例子。假设要构建一个智能，用于检查书籍并按类型对其进行分类——科幻、爱情、技术、惊悚、历史小说等等。\n\n你收集了 1000 本书，手动为它们标注了类型，然后开始创建智能。目标是能够拿一本新书（不属于这\
  \ 1000 本中的一本）并准确预测其类型。\n\n如果你通过记住作者信息来构建这个智能会怎样？你可能会查看你的 1000 本书，发现它们由 815 位不同的作者所写，并列出如下清单：\n\
  \n*   罗伊·罗耶森写恐怖小说。\n*   蒂姆·泰尼写科幻小说。\n*   尼尔·诺特森写技术书籍。\n*   等等。\n\n当你拿到一本新书时，你会在清单中查找其作者。如果作者在清单中，就返回其类型。如果作者不在清单中——好吧，你就卡住了。这个模型并不理解“类型”的概念，它只是记住了一些事实，并且无法泛化到它不认识的作者（而且对于那些写两种不同类型书籍的作者，它会非常困惑）。\n\
  \n在评估智能的准确性时，测试其泛化能力非常重要。确保你将智能置于它未曾见过的情况中，并衡量其适应能力。\n\n\n### 错误类型\n\n智能体可能犯多种类型的错误，有些错误比其他错误造成的麻烦更大。我们在第\
  \ 6 章讨论智能体验时，已经探讨过假阳性和假阴性的概念，但让我们回顾一下（见图 19-1）。在预测分类时，智能体可能会犯以下错误：\n\n![A455442_1_En_19_Fig1_HTML.gif](img/A455442_1_En_19_Fig1_HTML.gif)\n\
  \n图 19-1\n\n不同类型的错误。\n\n*   将不属于某类别的事物判定为该类别。\n*   将属于某类别的事物判定为不属于该类别。\n\n例如，假设智能体做了以下事情：\n\
  \n*   说门口有人，但实际上没人；或者说门口没人，但实际上有人。\n*   说该往火里添燃料了，但实际上不需要（火已经够旺了）；或者说不需要添燃料，但实际上需要（因为火快熄灭了）。\n\
  *   说这本书是爱情小说，但实际上不是；或者说这本书不是爱情小说，但实际上是。\n\n为了有用，智能体必须犯正确类型的错误，以补充其智能系统。例如，考虑一个检查网页是否有趣的智能体。想象一下，我告诉你我有一个准确率达\
  \ 99% 的智能体。给这个智能体展示一个新网页（它从未见过的），智能体做出预测（有趣或不有趣），并且 99% 的情况下预测是正确的。这很棒。泛化能力非常准确。这个智能体在我们的“有趣网页检测器”智能系统中应该很有用。\n\
  \n但假如结果发现大多数网页并不有趣——准确地说，99% 的网页都是无趣的。在这种情况下，一个智能体可以 100% 地预测“不有趣”，并且仍然能达到 99% 的准确率。对于无趣的网页，它的准确率是\
  \ 100%。对于有趣的网页，它的准确率是 0%。总体加起来就是 99% 的准确率。但这也意味着——完全没用。\n\n衡量这些错误类型之间权衡的一个指标是讨论假阳性率与假阴性率。对于有趣网页查找器来说，“阳性”指的是一个实际上有趣的网页。“阴性”指的是一个不有趣的网页。（实际上，你可以用任何一种方式定义阳性——但务必清晰定义，否则项目中的其他人可能会以不同方式定义，导致大家困惑。）所以：\n\
  \n*   假阳性率定义为所有阴性中被错误分类为阳性的比例（即有多少次对无趣网页的访问被标记为有趣）。\n\n![A455442_1_En_19_Figa_HTML.gif](img/A455442_1_En_19_Figa_HTML.gif)\n\
  \n*   假阴性率定义为所有阳性中被错误分类为阴性的比例（即有多少次对有趣网页的访问被标记为无趣）。\n\n![A455442_1_En_19_Figb_HTML.gif](img/A455442_1_En_19_Figb_HTML.gif)\n\
  \n用这个术语来说，那个死板的“总是无趣”智能体将拥有 0% 的假阳性率（这很棒）和 100% 的假阴性率（这毫无用处）。\n\n另一种非常常见的讨论这些错误权衡的方式是谈论模型的精确率和召回率。\n\
  \n*   精确率定义为模型所有阳性响应中实际为阳性的比例（即“这个页面有趣”的响应中有多少是正确的）。\n\n![A455442_1_En_19_Figc_HTML.gif](img/A455442_1_En_19_Figc_HTML.gif)\n\
  \n*   召回率定义为模型判定为阳性的阳性样本比例（即有趣的网页中有多少得到了阳性响应）。\n\n![A455442_1_En_19_Figd_HTML.gif](img/A455442_1_En_19_Figd_HTML.gif)\n\
  \n用这个术语来说，那个死板的“总是无趣”智能体将拥有未定义的精确率（因为它从不输出阳性，而且你不能除以零，即使有机器学习也不行）和 0% 的召回率（因为它对\
  \ 0% 的阳性页面输出了阳性）。\n\n一个有效的智能体必须适当平衡其所犯错误的类型，以支持智能系统的需求。\n\n### 错误的分布\n\n为了有效，智能体必须对所有用户都表现合理。也就是说，它不能将其错误集中在特定的子群体中。考虑以下情况：\n\
  \n*   一个检测门口是否有人的系统，对身高不足 5 英尺的人从不奏效。\n*   一个在图像中查找人脸的系统，永远找不到戴眼镜的人。\n*   一个过滤垃圾邮件的系统，总是删除来自银行的邮件。\n\
  \n这类错误可能会令人尴尬。它们会导致用户不满、差评。有可能存在一个智能体，它泛化良好，各种错误类型之间取得了很好的平衡，但却完全无法使用，因为它将错误集中在特定用户（或特定情境）上。\n\
  \n而且，发现这类问题并不容易。潜在的子群体如此之多，以至于很难甚至不可能列举出所有因错误分布不均而对智能系统造成问题的方式。\n\n## 评估其他类型的预测\n\
  \n上一节介绍了评估分类的方法。但评估智能体给出的答案的方式有很多很多种。你可以阅读整本关于这个主题的书，但本节将简要介绍如何评估回归、概率和排序的直觉方法。\n\
  \n### 评估回归\n\n回归返回数值。你可能想知道它们在多大比例上得到了“正确”的数字。但了解预测答案与正确答案的接近程度，几乎总是比了解答案完全正确的频率更有用。\n\
  \n最常用的方法是计算均方误差（MSE）。也就是说，取智能体给出的答案，减去正确答案，然后对结果求平方。然后，在与你的测量相关的所有情境中取这些值的平均值。\n\
  \n![A455442_1_En_19_Fige_HTML.gif](img/A455442_1_En_19_Fige_HTML.gif)\n\n当 MSE 较小时，智能体给出的答案通常接近正确答案。当\
  \ MSE 较大时，智能体给出的答案通常与正确答案相差甚远。\n\n### 评估概率\n\n概率是一个介于 0 到 1.0 之间的数字。评估概率的一种方法是使用阈值将其转换为分类，然后像评估分类一样评估它们。\n\
  \n想知道一本书是否是爱情小说？向智能体询问它是爱情小说的概率。如果概率高于某个阈值，比如 0.3（30%），则判定该书为爱情小说；否则判定为其他类别。\n\n\
  使用高阈值（如 0.99（99%））将概率转换为分类，通常会导致更高的精确率但更低的召回率——只有当智能体超级确定时，你才会判定一本书是爱情小说。\n\n使用低阈值（如\
  \ 0.01（1%））将概率转换为分类，通常会导致更低的精确率但更高的召回率——你几乎会把任何一本书都判定为爱情小说，除非智能体超级确定它不是爱情小说。\n\n\
  我们稍后将在讨论操作点和比较智能体时进一步探讨这个阈值概念。\n\n另一种评估概率的方法称为对数损失。从概念上讲，对数损失与均方误差（用于回归）非常相似，但涉及更多数学运算（此处略过）。简而言之——损失越小越好。\n\
  \n\n\n### 评估排序\n\n排序功能会根据内容与特定情境的相关性来排列顺序。例如，根据用户的历史记录，他们最有可能点哪种口味的汽水？排序智能会将所有可能的口味按顺序排列，例如：\n\
  \n1.  可乐\n2.  橙味汽水\n3.  沙士汽水\n4.  健怡可乐\n\n那么，我们如何判断这个排序是否正确呢？\n\n一种简单的评估方法是设想智能体验。假设智能汽水机可以在其显示屏上展示\
  \ 3 种汽水。如果用户实际选择的汽水排在前 3 名，则排序效果良好；如果用户实际选择的汽水不在前 3 名，则排序效果不佳。\n\n你可以考虑前 3 名、前 1\
  \ 名、前 10 名——只要对你的**智能系统**最有意义即可。\n\n因此，评估排序的一种简单方法是计算用户选择的项目出现在前 K 个答案中的时间百分比。\n\
  \n## 使用数据进行评估\n\n数据是评估智能的关键工具。从概念上讲，评估智能是通过获取历史情境，对其运行智能，然后将实际发生的输出与智能预测的输出进行比较来完成的。\n\
  \n当然，使用历史数据存在风险，包括：\n\n*   你可能会意外地使用创建智能时所用的数据来评估该智能，从而导致对智能质量的估计过于乐观。基本上，这相当于在测试前让智能看到了测试的答案。\n\
  *   在收集测试数据的时间点与部署新智能的时间点之间，底层问题可能发生变化，从而导致对智能质量的估计过于乐观。当问题发生变化时，智能可能非常擅长——但只是擅长应对过去的问题。\n\
  \n本节将讨论如何处理测试数据以最大程度地减少这些问题。\n\n### 独立的评估数据\n\n用于评估智能的数据必须与用于创建智能的数据完全分开。\n\n想象一下这个场景。你想出了一个启发式智能的点子，实现了它，并在一些评估数据上进行了评估，发现准确率为\
  \ 54%。此时一切正常。该智能的准确率大概在 54% 左右（由于样本量等原因，会存在基于统计特性的上下浮动），如果你将其部署给用户，他们看到的结果大概也差不多。\n\
  \n但现在你查看了智能在评估数据上犯的一些错误。你发现了一个模式，于是修改了智能，进行了改进。然后你在相同的测试数据上评估该智能，发现准确率现在变成了 66%。\n\
  \n此时，情况就不妙了。你查看了评估数据，并根据发现的结果修改了智能。此时很难说当你将智能部署给用户时，它的准确率会是多少；几乎可以肯定低于你在第二次评估中看到的\
  \ 66%。甚至可能比你最初的 54% 还要差。\n\n这是因为你作弊了。你在构建智能时查看了测试的答案。你根据你能看到的那部分问题调整了你的智能。这是不好的做法。\n\
  \n避免这种情况的一种常见方法是创建一个单独的测试集用于评估。测试集是通过将可用数据随机分成两部分来创建的。一部分用于创建和调整智能，另一部分用于评估。\n\n\
  现在，当你调整和优化智能时，不要查看测试集——哪怕一点点都不要。你可以在训练集上随意调整。当你认为完成时，再在测试集上进行评估，以获得对你工作的无偏评估。\n\n\
  ### 实践中的独立性\n\n用于评估智能的数据必须与用于产生智能的数据完全分开。我知道——这和我开始上一节时用的句子一模一样。但这正是因为它如此重要。\n\n\
  机器学习的一个关键假设是每条数据都是相互独立的。也就是说，取任意两条数据（两个情境，各自有其结果）。只要你在一条数据上创建智能，并在另一条数据上评估它，你就无法作弊——这两条数据是独立的。但在实践中，情况并非如此。考虑以下哪些数据对更（或更不）独立：\n\
  \n*   来自不同用户的一对交互，与来自同一用户的一对交互相比。\n*   来自不同网站的两个网页，与来自同一网站的两个网页相比。\n*   不同作者的两本书，与同一作者的两本书相比。\n\
  *   不同奶牛的两张照片，与同一奶牛的两张照片相比。\n\n显然，其中一些数据不像其他数据那样独立，使用具有这些强关联关系的数据来同时创建和评估智能将导致不准确的评估。在实践中，将数据随机拆分为训练集和测试集并不总是有效。\n\
  \n在实践中实现独立性的两种方法是按时间或按身份划分数据。\n\n*   **按时间划分数据**。即，保留最近几天的遥测数据用于评估，并使用之前几天、几周或几个月的数据来构建智能。例如，如果今天是\
  \ 2017 年 9 月 5 日，智能创建者可能会保留 9 月 2 日、3 日和 4 日的数据用于测试，并使用 2017 年 9 月 1 日及之前的所有数据来产生智能。\n\
  \    *   如果问题非常稳定（即，没有随时间变化的成分），这种方法会非常有效。\n    *   如果问题具有随时间变化的成分，则最近的遥测数据将比更早的遥测数据更有用，因为它能更准确地代表问题的当前状态。在这些情况下，你需要权衡将多少宝贵的、最新的、最相关的数据用于评估（相对于训练），以及在选择训练数据时要回溯到多久以前。\n\
  *   **按身份划分数据**。即，确保与单个身份的所有交互最终都落在同一个数据分区中。例如：\n    *   与特定用户的所有交互要么用于创建智能，要么用于评估智能。\n\
  \    *   与同一网站的所有交互要么用于创建智能，要么用于评估智能。\n    *   来自同一房屋的所有传感器读数要么用于创建智能，要么用于评估智能。\n\
  \    *   来自同一台烤面包机的所有烘烤事件要么用于创建智能，要么用于评估智能。\n\n大多数智能系统在选择用于评估的数据时，会按时间以及至少一个身份进行划分。\n\
  \n\n\n### 评估子群体\n\n有时，关键在于智能系统不会在关键子群体（性别、年龄、种族、内容类型、地理位置等）上出现系统性失败。\n\n例如，设想一个需要为所有英语使用者提供良好服务的语音识别系统。随着时间的推移，用户抱怨该系统对他们效果不佳。经过调查，你发现许多问题集中在夏威夷——那里的皮钦语太难处理了，老兄？\n\
  \n咳咳……\n\n这个问题可能严重到导致产品无法在夏威夷这个主要市场销售。必须采取行动！\n\n要解决问题，必须先进行衡量（记住，验证先行）。因此，我们需要更新评估流程，专门针对有问题的子群体测量准确率。每次系统评估一个潜在的智能方案时，都会通过两种方式进行评估：\n\
  \n*   一次针对所有用户。\n*   一次仅针对使用夏威夷皮钦语口音英语的用户。\n\n这种评估流程可能会发现，总体准确率为 95%，但对于讲皮钦语的子群体成员，准确率仅为\
  \ 75%。这是一个相当大的差距。\n\n评估子群体的准确率会带来一些复杂性。首先是识别一次交互是否属于该子群体。一条新的遥测数据到达，包含上下文和结果。但现在你需要一些额外信息——你需要知道该上下文（例如遥测数据中的音频片段）是否来自讲夏威夷皮钦语的人。解决这个问题的一些方法包括：\n\
  \n1.  手动识别交互。通过手动检查上下文（收听音频片段），从目标子群体成员中找出数千个样本。这可能会很昂贵，并且难以定期重复，但通常有效。由此产生的数据集可以长期保留，用于评估该子群体的准确率（除非问题变化非常快）。\n\
  2.  识别子群体中的实体。例如，将用户标记为“皮钦语使用者”或非皮钦语使用者。来自你标记用户的每一次交互都可以用于评估该子群体。当上下文包含身份信息（如用户\
  \ ID）时，这种方法非常有价值。但这并非总是可行。\n3.  使用子群体的代理指标，例如地理位置。所有在夏威夷的用户，无论他们是否讲夏威夷皮钦语，都被标记为子群体的一部分。这并不完美，但有时已经足够好，而且有时你可以自动完成，从而节省大量金钱和时间。\n\
  \n评估子群体准确率的第二个复杂性在于为每个子群体获取足够的评估数据。如果子群体很小，随机抽取的评估数据可能只包含少量样本。处理这个问题的两种方法是：\n\n\
  1.  使用更大的评估集。预留足够的评估数据，以便最小的关键子群体有足够的代表性来进行评估（关于合适数据量的更多细节，请参见下一节）。\n2.  对评估用的子群体成员进行上采样。调整你的系统，使子群体成员更有可能出现在遥测数据中，并且更有可能被用于评估而非用于智能创建。这样做时，你必须确保在报告评估结果时对偏差进行校正。例如，如果来自夏威夷的用户在遥测数据中被抽样的频率是其他用户的两倍，那么在估算总体准确率时，来自夏威夷用户的每次交互的权重就应该是其他用户的一半。\n\
  \n### 合适的数据量\n\n那么，评估一个智能系统需要多少数据呢？这取决于具体情况——当然。\n\n回想一下，统计学可以表达一个答案的确定程度，例如：我的智能系统的准确率是\
  \ 92%加减 4%（这意味着它可能在 88%到 96%之间）。\n\n所以你需要多少数据取决于你需要多大的确定性。\n\n假设你的数据非常独立，问题变化不太快，并且你不是试图从非常困难的问题（如语音识别）中优化最后那\
  \ 0.1%：\n\n*   几十个数据点对于评估智能系统来说太少了。\n*   几百个数据点适合做一次快速检查，但确实不够。\n*   几千个数据点对于大多数情况来说可能是一个合适的规模。\n\
  *   几万个数据点可能有些过头，但也不算离谱。\n\n选择多少数据来评估智能系统的一个起点可能是：\n\n1.  确保你预留了数千个最近的数据点用于评估。\n\
  2.  确保你为每个重要的子群体预留了数百个最近的数据点。\n3.  使用其余（相对较新的）数据用于智能创建。\n4.  除非你有海量数据，在这种情况下，只需预留大约\
  \ 10%的数据用于评估智能系统，其余用于智能创建。\n\n但你需要在你的具体环境中培养自己的直觉（或者使用一些统计学方法，如果你喜欢这样思考的话）。\n\n\
  ## 比较智能系统\n\n现在我们知道了一些评估智能系统性能的指标，以及如何从数据中衡量这些指标。但是，我们如何判断一个智能系统是否比另一个更有效呢？考虑尝试判断一本书的类型是否为爱情小说：\n\
  \n*   一个智能系统可能具有 80%的精确率和 20%的召回率。\n*   另一个智能系统可能具有 50%的精确率和 40%的召回率。\n\n哪个更好？嗯，这取决于体验，以及智能系统的更广泛目标。例如，一个试图为狂热的爱情小说读者寻找下一本书的系统，可能更倾向于更高的召回率（这样用户就不会错过任何一个浪漫情节）。\n\
  \n### 工作点\n\n一个有助于评估智能系统的工具是选择一个工作点。也就是说，一个与你的智能体验相匹配的精确率点或召回率点。每个智能系统都必须达到这个工作点，然后表现最好的那个被采用。例如：\n\
  \n*   在一个搞笑网页检测器中，工作点可能设定为 95%的精确率。所有智能系统都应调整到在 95%精确率下获得最佳可能的召回率。\n*   在一个垃圾邮件过滤系统中，工作点可能设定为\
  \ 99%的精确率（因为它要删除用户的邮件，所以必须非常确定）。所有智能系统都应努力标记尽可能多的垃圾邮件，同时将精确率保持在 99%或以上。\n*   在一个智能门铃系统中，工作点可能设定为\
  \ 80%的召回率。所有智能系统都应设定为在有人走到门前时 80%的情况下触发标记，并在该约束下竞争减少误报。\n\n通过选择智能系统可能犯的错误类型之一并设定一个目标，这减少了变量的数量。我们需要一个精确率达到\
  \ 90%的智能系统来支持我们的体验——现在，智能系统的创造者先生或女士，去在这个精确率下创造出你能达到的最佳召回率吧。\n\n在比较两个智能系统时，通常方便的做法是在一个工作点上进行比较。在目标召回率下更精确（或在目标精确率下召回率更高）的那个更好。\n\
  \n简单明了。\n\n\n\n### 曲线\n\n但有时工作点会发生变化。例如，体验可能需要变得更具强制性，工作点需要移动到更高精度以支持这种变化。智能体可以在多个工作点范围内进行评估。例如，通过改变将概率转化为分类的阈值，某个智能体可能具有以下数值：\n\
  \n*   召回率 40%时，精度为 91%。\n*   召回率 45%时，精度为 87%。\n*   召回率 50%时，精度为 85%。\n*   召回率 55%时，精度为\
  \ 80%。\n\n以此类推。请注意，任何能够生成概率或分数的智能体都可以采用这种方式进行评估（包括许多、许多机器学习方法）。\n\n许多启发式智能体和许多“仅分类”的机器学习技术不具备分数或概率的概念，因此它们只能在单个工作点（而非沿曲线）进行评估。\n\
  \n当比较两个能够在错误类型之间进行权衡的智能体时，你可以在任何工作点对它们进行比较。例如：\n\n*   在 91%精度下，一个模型的召回率为 40%，另一个模型的召回率为\
  \ 47%。\n*   在 87%精度下，一个模型的召回率为 45%，另一个模型的召回率为 48%。\n*   在 85%精度下，一个模型的召回率为 50%，另一个模型的召回率为\
  \ 49%。\n\n一个模型可能在某些类型的权衡上表现更好，而在其他类型上表现更差。例如，当你需要高精度时，一个模型可能更好；但当你需要高召回率时，第二个模型（使用完全不同的方法构建）可能更优。\n\
  \n将智能体能够做出的各种权衡可视化有时会很有帮助。精确率-召回率曲线（PR 曲线）绘制了模型所有可能的权衡。x 轴是每个可能的召回率（从 0%到 100%），y\
  \ 轴是模型在指定召回率下能够达到的精度。\n\n通过将两个模型绘制在同一个 PR 曲线上，可以很容易地看出哪个模型在不同工作点范围内表现更优。\n\n![A455442_1_En_19_Figf_HTML.gif](img/A455442_1_En_19_Figf_HTML.gif)\n\
  \n一个类似的概念称为接收者操作特征曲线（ROC 曲线）。ROC 曲线的 x 轴是假阳性率，y 轴是真阳性率。\n\n## 主观评估\n\n有时，一个智能体从数据上看表现不错，但实际效果就是……不行……\
  \ 这种情况可能发生在你：\n\n*   使用的指标与实际目标不一致。\n*   在体验与智能体之间存在沟通不畅。\n*   有一个尚未识别的重要子群体。\n\
  *   以及其他原因……\n\n正因如此，审视一些数据，退后几步，然后思考一下，总是有益的。做一个数据侦探，站在用户的角度，想象你的智能体会为他们创造什么。一些有助于主观评估的方法包括：\n\
  \n*   探索错误。\n*   想象用户体验。\n*   找出可能发生的最坏情况。\n\n我们将依次讨论这些方法。\n\n### 探索错误\n\n统计数据（例如，用于通过精确率和召回率表示模型质量的统计数据）很好，很简洁；它们将大量信息总结为简单的、可以上下浮动的小数字。它们对于创建智能体至关重要。但它们也可能隐藏各种问题。你需要时不时地去查看数据。\n\
  \n一个有用的技术是随机抽取 100 个智能体出错的上下文并查看它们。在查看错误时，请考虑：\n\n*   有多少错误是用户难以恢复的？\n*   有多少错误对用户来说是有意义的（相对于看起来相当愚蠢）？\n\
  *   这些错误是否有任何结构？是否有任何共同属性？也许这些属性将来会演变成重要的子群体类型问题？\n*   你是否能找到任何线索，表明实现或评估过程的某个部分可能存在错误？\n\
  *   是否有任何可以帮助改进智能体，使其不再犯这些错误的方法？是否有一些新的信息可以添加到上下文中？是否有一些新的特征类型？\n\n除了检查随机错误之外，查看智能体对答案最确定——但却是错误的地方（模型声称\
  \ 100%确定是正例的假阳性，或模型声称正例概率为 0%的假阴性）也很有帮助。这些地方通常会导致实现中的错误或智能体创建过程中的缺陷。\n\n### 想象用户体验\n\
  \n在查看错误时，想象一下用户的体验。想象他们进入该上下文。设身处地地想象他们遇到错误时的情景。他们在想什么？他们注意到问题的可能性有多大？如果他们没有注意到，会付出什么代价？如果他们确实注意到了，他们需要做什么来恢复？\n\
  \n这也是思考用户整体体验的好时机。例如：\n\n*   他们会看到多少错误？\n*   在两次错误之间，他们会有多少次正面交互？\n*   如果他们必须向朋友总结，他们会如何描述系统犯的错误类型？\n\
  \n设身处地为用户着想，将帮助你判断智能体是否足够好，或者是否需要更多改进。它还可以帮助你提出改进智能体验的想法。\n\n### 找出最坏的情况\n\n想象一下可能发生的最坏情况。系统可能犯哪些类型的错误会真正伤害其用户或你的业务？例如：\n\
  \n*   一个推广言情小说的系统，将某位特定言情作家的书籍 100%归类为非言情类。这位作家不再获得推广，销量下降，没有能力找出原因或应对方法，最终倒闭。他们的孩子圣诞节收不到礼物……\n\
  *   某个特定律师事务所的所有网页都被归类为搞笑类。它们并不搞笑，但人们还是开始发笑（因为他们被告知这些页面是搞笑的）。没有人愿意雇佣一个满是“小丑”的律师事务所。该事务所愤怒地起诉你的公司——他们有点恼火，而且有的是时间……\n\
  *   颗粒烤炉控制器的温度传感器坏了。因此，智能体总是认为火不够热。它不断地向火中倾倒燃料颗粒，引发了一场巨大的、熊熊燃烧的大火，但智能体仍然认为需要更多燃料……\n\
  \n这些例子有点滑稽，但重点是——要发挥创造力。在你的用户不得不为你承受糟糕体验之前，为他们找出真正糟糕的情况，并利用你的发现来打造更好的智能体，或影响系统的其他部分（体验和实现）做得更好。\n\
  \n\n\n## 总结\n\n智能的准确性，其本质在于评估与创造。\n\n准确性包含三个主要方面：泛化到新情境、犯对类型的错误，以及在用户/情境间合理分配错误。\n\
  \n*   智能在已知情境中可能表现良好，但在未曾遇到的情境中可能失败。\n*   智能可能犯多种类型的错误（包括误报和漏报）。\n*   智能可能随机犯错，也可能集中针对特定用户和情境犯错——集中性错误会引发问题。\n\
  \n评估分类、回归、概率估计和排序有特定的技术。本章介绍了一些简单的方法和概念，但如有需要，你可以找到更多信息。\n\n智能可以通过数据进行评估。部分数据应被保留，专门用于评估智能（而非用于创建智能）。这些数据必须与创建智能所用的数据完全独立（应来自不同的用户、不同的时间段等）。\n\
  \n工作点有助于将智能聚焦于在更广泛的系统中取得成功所需犯的错误类型。精确率-召回率曲线是一种理解（并可视化）智能在所有可能工作点下运行情况的方式。\n\n审视你的智能所犯的错误至关重要。尝试理解问题所在，同时也要站在用户的角度，想象他们可能遇到的最坏结果。\n\
  \n## 思考题……\n\n阅读本章后，你应该能够：\n\n*   描述智能具备准确性的含义。\n*   根据一系列广泛的实践标准评估智能的质量。\n*   为智能设定有用的质量目标，并朝着目标取得进展。\n\
  *   站在用户的角度，通过他们的视角看待智能所犯的错误。\n\n你应该能够回答如下问题：\n\n*   描述三种需要智能系统具备极高召回率的情境。\n*  \
  \ 针对上述三种情境，分别描述对系统目标进行何种微小调整后，系统反而需要高精确率。\n*   从本章提及的智能系统中选择一个，描述一个（本章未提及的）可能发生严重错误的潜在子群体。\n\
  *   考虑一个将书籍按类型分类的系统。假设你将检查该系统犯下的 100 个错误。描述两种不同的方式，对你检查的错误进行分类，以帮助理解问题所在。（例如，错误发生在短书与长书之间——哎呀！现在你的答案中不能使用书籍长度了。抱歉。）\n\
  \n"
- "# 20. 机器学习智能\n\n机器学习是一种强大的技术，用于为大规模、困难、开放式、随时间变化的问题生成智能。它的工作原理是向计算机展示大量（大量）的情境示例及其期望结果。计算机根据这些示例生成模型。这些模型可用于预测未来情境的结果。\n\
  \n机器学习可以成为巨大的效能倍增器，让计算机专注于其擅长的事情（例如调整庞大模型的每一个细节，使其在数百万种情境中有效运行），而人类则可以专注于自己擅长的事情（例如选择能够良好泛化的模型表示，并构建将模型转化为客户和商业价值的系统和智能体验）。本章将概述机器学习，介绍其步骤和一些关键问题。\n\
  \n## 机器学习的工作原理\n\n机器学习算法本质上是一种搜索过程，它利用训练数据评估准确性，以寻找准确的模型。通常，机器学习算法会执行以下操作：\n\n*\
  \   从一个简单模型开始。\n*   尝试模型的略微改进版本（通常根据训练数据得出）。\n*   检查改进版本是否更好（使用训练数据）。\n*   并（大致）迭代，直到其搜索过程无法找到更好的模型。\n\
  \n有时，改进的形式是向模型增加更多复杂性（例如，向决策树添加更多的 if-then-else 测试）。有时，改进的形式是调整模型中的参数（例如，更新线性模型中的权重）。\n\
  \n例如，回想一下，决策树用树形结构表示智能。每个节点包含一个 `if` 条件，当 `if` 测试为真时有一个子节点，为假时有另一个子节点。以下是一个用于预测电影票房收入的示例决策树：\n\
  \n```\n如果 <电影有知名演员?>:\n  为真: 如果 <电影是续集?>:\n    为真: 则 1 亿美元。\n    为假: 则 100 万美元。\n\
  \  为假: 如果 <电影预算高?>:\n    为真: 则 5000 万美元。\n    为假: 则 1000 美元。\n```\n\n用于决策树的机器学习通过添加\
  \ if 测试来生成日益复杂的树，直到没有进一步的添加能改进模型（或直到模型达到某个复杂性阈值）。例如，上述电影成功预测示例决策树的一个改进版本可能是：\n\n\
  ```\n如果 <电影有知名演员?>:\n  为真: 如果 <电影是续集?>:\n    为真: 如果 <导演曾获奥斯卡?>:\n      为真: 则 5 亿美元。\n\
  \      为假: 则 1000 万美元。\n    为假: 则 100 万美元。\n  为假: 如果 <电影预算高?>:\n    为真: 则 5000 万美元。\n\
  \    为假: 则 1000 美元。\n```\n\n这个模型稍微复杂一些，也可能更准确一些。\n\n人类可以手动执行相同的过程，但机器学习算法自动化了这一过程，并且可以在人类输入“hello\
  \ world”的时间内，考虑数百万种情境并产生数十万次微小的改进。\n\n使用机器学习时，智能创建者必须控制的因素包括：\n\n*   **特征工程**：如何将情境转换为机器学习算法可以添加到其模型中的特征。你选择的特征应与目标概念相关，并且应包含足够的信息以做出良好的预测。\n\
  *   **模型结构复杂度**：模型变得有多大。例如，决策树中的测试数量或线性模型中的特征数量。\n*   **模型搜索复杂度**：机器学习算法在其搜索中尝试了多少种东西。这与结构复杂度不同（但相关）。搜索尝试的东西越多，它偶然发现看起来不错但泛化能力不佳的东西的机会就越大。\n\
  *   **数据规模**：你拥有的训练数据量。可用于指导机器学习搜索的良好、多样化的数据越多，你的模型就能变得越复杂、越准确。\n\n必须平衡这些要素，才能从机器学习过程中获得最佳模型。\n\
  \n## 复杂性的利与弊\n\n机器学习的关键挑战之一是控制其产生的模型的复杂性。核心矛盾如下：\n\n1.  解决困难、庞大、开放式的问题需要非常复杂的模型。\n\
  2.  允许的复杂性越高，学习到一个误解概念的模型的机会就越大。\n\n作为应用机器学习从业者，你的工作就是平衡这些矛盾。机器学习过程可能以两种方式失败：\n\n\
  *   **欠拟合**概念：其对概念的理解可能过于简单。\n*   **过拟合**概念：其对概念的理解是错误的；它在某些情境中碰巧有效，但本质上并不正确。\n\n\
  让我们看一个例子。考虑构建一个智能系统，用于检查书籍并按类型分类——科幻、浪漫、技术、惊悚、历史小说等。\n\n你收集了 1000 本书，手动为它们标注类型，然后开始创建智能。目标是能够拿一本新书（不属于这\
  \ 1000 本中的一本）并准确预测其类型。\n\n\n\n### 欠拟合\n\n如果你采用的方法过于简单，以至于无法理解“流派”是什么，就会导致欠拟合。具体可能如下所示：\n\
  \n1.  对于每种流派，找出最能代表该流派的词：\n    *   对于爱情小说，这个“代表性词语”可能是“爱”。\n    *   对于科幻小说，可能是“激光”。\n\
  \    *   以此类推。\n2.  当你拿到一本新书时，检查它是否包含任何代表性词语，并将该书标记为对应的流派：\n    *   如果书中包含“爱”这个词，就将其归类为爱情小说。\n\
  \    *   如果书中包含“激光”这个词，就将其归类为科幻小说。\n\n如果每本书都恰好包含且仅包含一个代表性词语，那么这个模型可能效果不错。但大多数书籍包含大量词语。如果一本书同时使用了“爱”和“激光”这两个词，我们该怎么办？应该将其归类为爱情小说还是科幻小说？无论我们做出哪种选择，都会犯错，因为有些科幻小说会谈论爱情；而有些爱情小说也会提到激光。\n\
  \n这种建模方法（每种流派只检查一个词）过于简单。这种简单的方法无法充分拟合“流派”这一概念，并且泛化能力会很差。\n\n### 过拟合\n\n现在想象另一种方法——使用一个非常非常复杂的决策树，本质上将书中确切的词语序列编码成树形结构，例如：\n\
  \n1.  如果书的第一个词是“当”\n2.  并且书的第二个词是“那”\n3.  并且书的第三个词是“地球”\n4.  以此类推，精确匹配书中的每一个词……\n\
  5.  那么该书的流派就是“科幻小说”\n\n这个模型非常复杂，并且（在用于创建它的数据上）高度准确，但它完全无法泛化到新书上。\n\n这听起来很愚蠢，精确记忆书中的每一个词，但这只是一个例子。根本问题在于，机器学习几乎总是以与底层现象不匹配的方式来对问题进行建模。正因为如此，模型的某些部分可能恰好在你已知的所有数据上有效，但在新情况下却会失效。这个现象的技术术语就是过拟合，而避免过拟合是创建有效智能体的关键挑战之一。\n\
  \n当一个智能体对问题欠拟合或过拟合时，它在处理新情境时就不会准确；它将无法泛化。\n\n### 平衡复杂度\n\n对于我们书籍流派的例子，一个更好的模型应该介于两者之间。也许它会检查与每种流派相关性最高的\
  \ 50 个词是否存在：\n\n*   对于科幻小说，它可能会使用激光、曲速、恒星、光束等词。\n*   对于爱情小说，它可能会使用……其他词……\n\n然后，你可以使用决策树、线性模型或神经网络来自动学习每个词对每种流派的重要性，以及如何组合和加权它们以准确预测流派。\n\
  \n这将比另外两种方法更好。你能看出来，我也能看出来。但机器呢？也许不能。\n\n而且这种 50 个词的方法仍然不完美。它肯定会对“流派”这一概念欠拟合，因为它没有考虑词语的上下文、它们所在的句子以及它们所描述的思想。\n\
  \n但这没关系。机器学习的重点不是为问题找到“正确”的表示。重点在于找到能产生最佳泛化能力的建模过程。你需要有意识地选择在何处以及如何欠拟合和过拟合，才能实现这一目标。\n\
  \n## 特征工程\n\n智能系统中的上下文编码了与交互相关的所有数据。这可能包括关于用户的信息、用户的历史记录、用户正在做什么、用户正在交互的内容等等。特征工程是将上下文转化为机器学习可以处理的表示形式的过程。这包括使信息具有适合模型表示的格式，还包括使信息能够与用于学习模型的搜索过程良好配合。\n\
  \n本节的其余部分将讨论实现此目的的方法，包括以下内容：\n\n*   将数据转换为可用形式。\n*   帮助模型使用数据。\n*   归一化特征值。\n* \
  \  暴露隐藏信息。\n*   扩展上下文。\n*   消除误导性信息。\n\n### 将数据转换为可用格式\n\n通常，机器学习算法将训练集作为输入。训练集由一组训练样本组成。每个训练样本包含一组编码上下文的变量。这些变量被称为特征。每个训练样本还包含一个结果变量，它指示该上下文的正确答案。这通常被称为标签。\n\
  \n回想一下，结果通常是以下几种之一：一组可能类别中的某个类别（用于分类）；一个数字（用于回归）；或一个概率（可能是一个 0 到 1 之间的数字，代表 0 到\
  \ 100%的概率，按比例缩放到 0.0–1.0 的范围）。\n\n可以将训练样本视为电子表格中的一行。一列包含标签；其余列包含特征值。训练集中的每个训练样本必须具有相同数量的特征，尽管某些特征值可能缺失——机器学习对此类情况具有鲁棒性。\n\
  \n例如，如果你试图构建一个根据人们听的音乐类型来预测其年龄的模型，你可能会有代表性别、眼睛颜色以及他们上周听的 Journey 歌曲数量的特征（图 20-1）。有些用户可能听了\
  \ 7 首；有些可能听了 14 首。这些用户的训练样本中，“Journey 歌曲数量”这一列（特征）会填入正确的值（7 或 14 等）。但也许你的父亲不会告诉你他听了多少首\
  \ Journey 歌曲——也许他对这类事情感到害羞。因此，你父亲的训练样本仍然有“Journey 歌曲数量”这一列（特征），但该值未定义（或者为-1、0，或根据你的工具使用其他特殊代码）。\n\
  \n![A455442_1_En_20_Fig1_HTML.gif](img/A455442_1_En_20_Fig1_HTML.gif)\n\n图 20-1\n\
  \n示例特征\n\n机器学习系统通常处理两种类型的特征：\n\n*   数值特征，即整数或浮点数（例如上周听的 Journey 歌曲数量）。\n*   类别特征，即来自一小部分值的标签（例如人的性别）。\n\
  \n大多数机器学习模型和算法都支持数值特征和类别特征。但有时需要进行一些预处理。例如，神经网络内部只处理数值特征。要将类别特征输入神经网络，你必须将其转换为数值。一种常见的方法是使用独热编码，它将一个类别特征转换为\
  \ N 个数值特征，每个特征对应一个可能的类别值。例如，用这种方式编码性别，你会进行以下转换：\n\n*   男性 -> [ 0, 1 ]\n*   女性 ->\
  \ [ 1, 0 ]\n\n图 20-2 以表格形式展示了这种编码。\n\n![A455442_1_En_20_Fig2_HTML.gif](img/A455442_1_En_20_Fig2_HTML.gif)\n\
  \n图 20-2\n\n性别的独热编码\n\n\n\n### 帮助你的模型利用数据\n\n特征工程是一门将上下文转化为适合你的问题及模型结构的特征的艺术。例如，考虑一个根据用户收听的歌曲来预测年龄的模型。一种方法是为每一位曾录制过歌曲的艺术家创建一个特征。每个训练样本都有成千上万列，每列对应一位艺术家，表示用户收听了该艺术家的多少首歌曲。\n\
  \n这种表示方法包含了大量信息，这有助于机器学习过程避免欠拟合。但它也很复杂。它要求学习算法在做出决策时考虑非常多的因素，并可能鼓励过拟合。那么，这是最佳方法吗？\n\
  \n也许吧，这取决于你的工具和你拥有多少数据。唯一的方法就是尝试各种不同的方法，构建模型，评估它们，然后观察结果。\n\n以下是为这个问题创建特征的其他一些可能方法：\n\
  \n*   **按年代划分歌曲：** 每个年代设一个特征，其值为用户收听的该年代歌曲数量。\n*   **区分热门歌曲和冷门歌曲：** 因为在特定年代成长的人可能接触的音乐更广泛，所以收听冷门歌曲可能会暴露他们的年龄。因此，每个年代会有两个特征，一个用于该年代的热门歌曲收听次数，另一个用于该年代的冷门歌曲收听次数。\n\
  *   **按流派划分歌曲：** 每个流派设一个特征，其值为收听的该流派歌曲数量。\n*   **流派、年代和流行度的某种组合：** 即同时采用上述三种方法。\n\
  \n一旦你开始行动，你会想到各种分解问题的方法，从上下文（用户收听的歌曲及其收听模式）中提取信息，并部分消化这些信息，以将其中最相关的部分暴露给机器学习算法。\n\
  \n可以这样理解。如果你碰巧知道存在一个名为“流派”的相关概念，并且你以有用的方式在特征中暴露了这个概念，那么机器学习算法就可以利用它。这需要你付出努力，但通过编码你对世界的先验知识，它可以帮助生成更符合问题空间实际情况的模型。\n\
  \n将此与将原始数据直接交给机器学习过程（让算法自己搞定一切）进行对比。如果你拥有非常非常多的数据以避免过拟合，那么从你需要付出的努力角度来看，这种方法可能极其有效和高效。\n\
  \n不同的算法在不同的方法下表现会更好。学习你的工具，培养直觉，并确保你的评估框架能让你非常轻松地进行探索。\n\n### 归一化\n\n有时，数值特征的值差异很大。例如，年龄（范围在\
  \ 0 到 100 左右）和收入（范围在 0 到 1 亿左右）。归一化是改变数值特征使其更具可比性的过程。与其说一个人 45 岁，收入 75,000 美元，不如说这个人的年龄比平均年龄高\
  \ 5%，收入比平均收入高 70%。\n\n一种标准的归一化方法是后处理所有数值特征，并用它们的归一化值替换：\n\n1.  减去均值（将均值移至零点）。\n\
  2.  除以变量的标准差。\n\n例如，在每个训练样本中替换：\n\n![A455442_1_En_20_Figa_HTML.gif](img/A455442_1_En_20_Figa_HTML.gif)\n\
  \n学习算法当然可以处理未归一化的数据。但进行预处理可以降低复杂性，使建模任务稍微容易一些，从而让算法可以专注于其他事情。有时这会有所帮助。\n\n### 暴露隐藏信息\n\
  \n有些特征单独使用并无用处。它们需要与其他特征结合才能发挥作用。或者（更常见的是）有些特征单独使用有用，但与其他特征结合后会变得更加有用。\n\n例如，如果你正在尝试构建一个预测箱子运输成本的模型，你可能会有箱子的高度、宽度和深度这些特征。这些都有用。但一个更有用的特征是箱子的总体积。\n\
  \n有些机器学习算法能够自行发现这些类型的关系。有些则不能。\n\n你可以基于自己的直觉和对问题的理解来创建复合特征。或者，你也可以通过组合你最初提出的特征来创建新特征，从而自动尝试大量组合。\n\
  \n### 扩展上下文\n\n你可以利用外部知识或查找来添加上下文中未明确包含的信息。例如，你可以执行以下任何操作：\n\n*   查找上下文中某个身份的历史记录，例如对\
  \ Web 服务器的访问流量。\n*   根据位置从 Web 服务查找外部温度。\n*   对一段文本运行情感分析程序，并将预测的情感作为一个特征包含进来。\n\
  \n请记住，只有在智能运行环境和智能创建环境中能够以完全相同的方式创建这些特征时，你才能使用它们。\n\n下一章将讨论更多组织智能的方法，这将帮助你决定如何最好地利用来源或遗留智能来扩展上下文。\n\
  \n### 消除误导性信息\n\n另一种方法是从你的数据中删除特征。\n\n什么？！！\n\n是的。你刚刚费了这么大劲从上下文中创建了特征，现在我却说你应该删除其中一些。真是疯了！\n\
  \n但你可能创建了一些非常糟糕的特征（抱歉）。这些特征会增加学习过程的复杂性，却没有任何价值。例如，用一个人的眼睛颜色来预测他的年龄。当然，每个人都有眼睛颜色。当然，它存在于上下文中。但它与预测这个人的年龄相关吗？并不相关。\n\
  \n包含不相关的特征会降低你学习出具有良好泛化能力模型的能力——因为有时不相关的特征会偶然看起来不错，从而欺骗你的机器学习算法将其包含在模型中。\n\n或者，你可能创建了远超数据支持能力的特征。你所有的特征可能都很出色，但它们仍然可能导致过拟合并损害泛化能力。\n\
  \n所以，你真的应该：\n\n1.  移除那些对结果不包含任何信息的特征。\n2.  选择尽可能多的、你的数据、模型结构和搜索过程能够支持的特征，并选出最好的那些。\n\
  \n这被称为特征选择。有许多执行特征选择的技术。以下是一些简单的方法：\n\n1.  测量每个特征与结果特征之间的互信息（可以理解为相关性），并移除得分最低的特征。\n\
  2.  分别训练包含和不包含每个特征的模型，评估每个模型，然后移除那些无助于提高泛化准确率的特征。\n3.  运用你的直觉和对问题的理解，删除那些没有意义的特征。\n\
  \n这些技术也可以帮助你调试关于特征工程的决策。创建一个新特征。将其添加到现有的特征集中。训练一个新模型——如果结果没有变好，你可能就走错了方向。仔细审视一会儿。然后停下来思考。也许这能帮助你理解真正发生了什么。\n\
  \n\n\n## 建模\n\n建模是利用机器学习算法搜索有效模型的过程。智能创建者可以通过多种方式辅助这一过程：\n\n*   决定使用哪些特征。\n*   决定使用哪些机器学习算法和模型表示。\n\
  *   决定使用哪些数据作为训练输入。\n*   控制模型创建过程。\n\n但在所有这些工作中，目标是获得泛化能力最强、错误分布最优、能为客户创造最大价值的模型。本节将讨论实现这一目标的方法，包括调整建模过程的常见辅助手段。\n\
  \n### 复杂度参数\n\n每种机器学习算法都有参数，允许智能创建者控制其引入的复杂度。\n\n有些算法提供参数来控制算法生成模型的大小。有些模型在搜索过程中会增加结构，例如，向决策树添加节点；向随机森林添加树。这类算法通常具有对结构数量（树中的节点数或随机森林中的树数）设置硬性限制的参数。许多算法还具有参数，用于设定在训练集上需要看到的最小增益，以决定是否继续搜索。\n\
  \n当出现过拟合时，应限制模型大小；当出现欠拟合时，应允许更大的模型规模。\n\n机器学习算法可能具有控制算法搜索策略的参数。目前最常见的做法是沿着梯度采取贪心步骤，即做出最能提升模型在训练数据上性能的更改。其他选项可能包含一些随机性，例如随机重启（以防搜索陷入局部最优），或某种前瞻策略。\n\
  \n算法也可能具有控制搜索步长的参数。也就是说，它们找到梯度后，需要决定模型沿梯度移动多远。较小的步长允许引入更多复杂度。某些算法会在搜索过程中自适应地调整步长，开始时使用大步长以找到良好的大致区域，然后逐步减小步长以精炼模型。\n\
  \n当出现过拟合时，应使用更简单的搜索策略；当出现欠拟合时，可以尝试更复杂的搜索。\n\n某些算法也直接使用优化算法；例如，通过将问题内部表示为矩阵，并使用线性代数来寻找关键属性。这些算法可能支持多种在复杂度上有所权衡的优化选项。\n\
  \n基本上，你始终应该根据问题的复杂度和拥有的数据量来调整这些类型的参数。在不调整算法复杂度参数的情况下成功进行机器学习是极其罕见的。\n\n### 识别过拟合\n\
  \n回顾一下，建模的目标是构建最能泛化到新场景的模型。识别建模过程何时开始过拟合的一种策略如下：\n\n1.  在训练数据上构建一系列复杂度递增的模型，从极其简单开始，一直到极其复杂。如果你的特征和模型表示选择合理，那么在训练数据上，更复杂的模型应该比简单模型表现更好。\n\
  2.  现在，在保留测试集上运行这些模型。极其简单的模型应该表现（大致）最差。下一个稍复杂的模型应该表现（稍好）一些。再下一个更复杂的模型应该表现更好。如此类推——直到某个临界点。最终，更复杂的模型在保留测试数据上的表现将开始不如较简单的模型。而它们开始表现变差的那个点，就是你的特征集、模型搜索策略、模型表示和可用数据开始出现问题的地方。\n\
  \n例如，参见图 20-3。\n\n![A455442_1_En_20_Fig3_HTML.gif](img/A455442_1_En_20_Fig3_HTML.gif)\n\
  \n图 20-3\n\n过拟合示例\n\n如果开始出现过拟合，你将需要：\n\n*   更贴合问题的特征。\n*   更贴合问题的模型结构。\n*   减少搜索以生成模型。\n\
  *   或者更多数据！\n\n更多数据是避免过拟合的最佳方式，它允许你创建更复杂、更精确的模型。谢天谢地，你已经完成了所有工作，建立了一个拥有出色智能体验和大量用户为你生成数据的智能系统。这正是智能系统大放异彩之处，随着更多用户与之交互，你的智能得以不断成长。\n\
  \n## 总结\n\n机器学习能够自动从数据中产生智能。它涉及让计算机搜索在数据（训练集）上表现良好的模型。其中一个关键矛盾在于提高准确性与因过拟合导致的泛化能力差之间的权衡。\n\
  \n特征工程是机器学习的关键部分。它涉及将上下文转换为模型可以处理的表示形式。但这也意味着要充分理解你的表示形式、你的问题以及机器学习算法的搜索策略，以便以正确的方式呈现数据。常用技术包括归一化、特征选择和组合特征。\n\
  \n建模过程涉及大量迭代：选择合适的机器学习算法、调整参数，并通过精心管理复杂度，从可用的训练数据中榨取最大价值。\n\n## 思考题…\n\n阅读本章后，你应该能够：\n\
  \n*   对机器学习有良好的概念性理解，包括特征、模型、建模过程以及复杂度与过拟合之间的关键矛盾。\n*   了解应用机器学习的步骤，并大致了解通用机器学习算法的工作原理。\n\
  *   能够使用机器学习工具包生成可用的模型，并准备好进一步学习特定的算法和技术。\n\n你应该能够回答如下问题：\n\n描述一个你之前在本书问题答案中未曾使用过的智能系统上下文。\n\
  \n*   为该上下文创建十个数值特征。\n*   为该上下文创建五个分类特征。\n*   提出一种降低特征复杂度的方法。\n*   创建一个使用你的特征进行过拟合的模型示例——尽情发挥，找到极端过拟合的极限。\n\
  *   附加题：设计一个非常简单的机器学习算法。你的表示形式是什么？你的搜索策略是什么？你的复杂度参数是什么？\n\n"
- '# 21. 组织智能


  在大多数大规模系统中，智能创建是一项团队活动。多人可以同时处理智能工作，构建其不同部分，或研究不同的问题领域。多人也可以在不同时间接手智能工作，接替已离开的团队成员，或重新审视一个曾经有效但开始出现问题的智能。组织智能的一些方式示例如下：


  *   对大多数事情使用机器学习智能，但使用人工智能来纠正错误。

  *   对来自法国的用户使用一种机器学习智能，对来自日本的用户使用另一种。

  *   将启发式智能的输出作为特征输入到机器学习智能中。


  本章讨论组织智能的方法以及创建智能的过程，以使其健壮，并允许多人有效协作。




  ## 组织智能的理由


  你可能希望从构建单一整体智能（例如，单个机器学习模型）转向组织化智能，原因有很多：


  *   **协作**：大规模智能构建是一项协作活动。你可能需要 3 人、5 人或 15 人共同为一个智能系统构建智能。如果是这样，你就需要找到方法让他们高效地协同工作，而不是相互竞争，争夺那个“一统天下”的智能的所有权。

  *   **清理错误**：每个智能都会犯错，修正一个错误往往会导致其他位置出现更多错误。此外，试图让基于机器学习的智能停止犯某个特定错误并不容易——这通常需要一些实验和运气。组合多个智能可以快速缓解错误，为更复杂的智能提供支撑。

  *   **用简单方法解决简单部分**：有时问题的一部分很简单，用少量启发式方法就能出色（或完美）地解决。在这些情况下，你可以尝试让机器学习去学习一个你已经知道如何做的模型，或者你可以将问题分解，让启发式方法解决简单的部分，而机器学习则专注于问题中更困难的部分。

  *   **整合遗留智能**：世界上已经存在大量智能。现有的智能和智能创建过程可能非常有价值。你可能希望将它们整合到一个智能系统中，以发挥其优势，并帮助它们变得更有效。


  ## 良好组织智能的特性


  组织智能可能既困难又问题重重。如果组织不当，各层智能会相互依赖各自的特性。对某个智能的任何更改都会导致其他智能发生意外（且难以追踪）的变化。你最终可能会陷入一种明知需要做出改变，却根本无法改变的境地——就像意大利面条式代码一样，你可能会得到意大利面条式智能。


  一个组织良好的智能应具备以下所有特性：


  *   **准确性**：组织方式不应过多降低准确性潜力。它应该是在短期成本（即较低的即时准确性）与长期收益（即智能系统整个生命周期内更高的准确性）之间做出的良好权衡。

  *   **易于扩展**：任何人都应该能够轻松地获得洞察、创建一些智能，并将其放入系统中。

  *   **松散耦合**：应尽量减少一个智能影响其他智能行为的能力。智能之间的接口应该清晰，并且智能之间不应使用彼此内部运作的信息。

  *   **可理解性**：对于用户遇到的每个结果，系统应能精确定位参与决策的智能（或多个智能），并且每个决策/结果所涉及的智能数量应尽可能少。

  *   **可衡量性**：对于智能的每个部分，都应能够确定该部分智能为用户带来了多少益处。

  *   **支持团队**：组织策略应与团队协作。组织应允许智能创建者的成功相互放大彼此的工作。它应避免设定相互冲突的目标，或造成参与者以非生产性方式竞争的需求。


  ## 组织智能的方法


  本节讨论多种组织智能以及智能创建过程的技术，并根据良好组织智能的关键特性对其进行评估。大多数大型智能系统会同时使用其中多种方法。而且，选择非常非常多——这里的技术只是一个起点：


  *   解耦特征工程

  *   多模型搜索

  *   追踪错误

  *   元模型

  *   模型排序

  *   划分上下文

  *   覆盖规则


  以下部分将描述这些方法，并根据它们满足良好组织智能标准的程度进行排名。这是一个主观的评分标准，旨在突出相对的优势/劣势，如下所示：


  | ++ | 真正的优势 |

  | + | 优于平均水平 |

  |   | 平均水平 |

  | - | 低于平均水平 |

  | - - | 需要关注的挑战 |


  所有这些方法都是可行的，并在实践中使用。但你应该准备好应对所选组织策略中固有的挑战。




  ### 解耦特征工程


  组织智能创建的一种方法是分离特征工程任务，使每个智能创建者都能探索上下文中明确划分的部分，并将其转化为特征。例如，在尝试理解一个网页时：


  *   一个智能创建者可以专注于页面内容，使用词袋模型和 n-gram 等标准方法将词语转化为特征。

  *   另一个智能创建者可以专注于理解页面文本的语义，使用词性标注、情感分析等方法。

  *   另一个可以查看网站的历史记录、托管位置、创建者以及他们创建的其他内容。

  *   另一个可以探索网页上的图像，并尝试从中创建特征。

  *   另一个可以查看用户的属性。


  每个参与者都需要能够将他们的特征提取代码注入到建模过程中。他们需要能够调整模型参数，以充分利用新的工作成果。他们还需要能够部署自己的工作。


  解耦特征工程面临的一些挑战包括：


  *   **模型构建冲突**：一种模型/参数集可能对某类特征效果更好，而对另一类特征效果较差。参与者需要权衡取舍，以促进整个系统的成长，而不是简单地蚕食现有特征集的价值。

  *   **冗余特征**：多种特征创建方法可能利用上下文中相同的基础信息。由此产生的特征可能彼此非常相似。智能创建者之间可能会就如何消除冗余产生冲突。

  *   **特征值的不稳定性**：当向机器学习算法引入新特征时，通常会改变模型构建搜索的方向，这可能会对其他特征的值以及模型所犯的错误类型产生剧烈影响。添加新特征可能需要全局理解特征集/模型，并对特征创建代码的其他部分进行一些调整，以保持整体平衡。


  总而言之，解耦特征工程的方法：


  *   **准确性：一般** 这种方法没有太多妥协之处，智能创建者可以并行工作以取得进展。

  *   **易于扩展：+** 向现有模型添加几个新特征在概念上很简单。虽然不是绝对最简单，但相当不错。

  *   **松散耦合：一般** 特征之间可以相互影响，但只要积极消除冗余，耦合就不应成为主要问题。

  *   **可理解性：一般** 在调试交互时，缺乏精确定位问题特征的良好工具，许多模型类型使得调试尤其困难。有时你只能“尝试一次移除一个特征并重新训练，看看问题何时消失”。

  *   **可衡量性：–** 在初始添加特征时，衡量改进很容易。但随着时间的推移（例如，当问题发生变化时），追踪特征的贡献就不那么容易了。

  *   **支持团队：一般** 当上下文中有清晰的边界时，事情可以顺利进行，但肯定有很多方式会导致关于哪些特征应该保留、哪些应该剔除的冲突，尤其是在存在任何运行时约束（CPU
  或 RAM）的情况下。


  ### 多模型搜索


  另一种组织智能的方式是允许多个创建者尝试模型构建过程。例如，也许一个团队成员是线性模型的专家，而另一个是神经网络的大师。这些实践者都可以尝试使用他们最熟悉的方法来创建智能，最终由最佳模型胜出。


  在以下情况下，使用多模型搜索可能有效：


  *   你的智能创建者对不同方法有丰富经验。

  *   你正处于构建智能系统的早期阶段，希望广泛撒网，看看哪些方法效果最好。

  *   你的系统发生了重大变化（例如问题发生重大变化或使用量大幅增加），并且希望重新验证你选择了正确的建模方法。


  但使用多模型搜索可能导致重复工作和冲突，因为最终一种方法会胜出，而其他方法则会失败。


  多模型搜索的方法：


  *   **准确性：-** 这种方法使得长期利用众多智能创建者变得困难。它应仅在智能创建过程的关键部分谨慎使用，例如当明确需要改变时。

  *   **易于扩展：-** 要交付一个新的智能，你必须击败旧的智能。这意味着新想法需要相当完整，并在部署前进行广泛评估。

  *   **松散耦合：一般** 只有一个智能，因此不存在特别的耦合问题。

  *   **可理解性：一般** 只有一个智能，因此不存在特别的理解问题。

  *   **可衡量性：一般** 只有一个智能，因此不存在特别的可衡量性问题。

  *   **支持团队：- -** 这是一种赢家通吃的工作方式，意味着会有建模的赢家和输家。它也倾向于导致浪费工作——追逐一个永远无法实现的建模想法。


  ### 追逐错误


  另一种方法是将智能问题视为软件缺陷。缺陷可以分配给智能创建者，他们可以自行找出需要做出哪些改变来修复问题。例如，如果你在处理某个子群体（比如儿童）时遇到困难，就派一个人去弄清楚需要在上下文中添加什么，或者改变哪些特征，或者改变哪些建模方法，以便在儿童群体上做得更好。


  智能总会犯错，因此这种方法可能会永无止境。


  这种方法的一个关键问题是，要弄清楚哪些错误只是随机错误，哪些是可以通过改变智能创建来帮助解决的系统性问题。使用这种方法时，很容易陷入追逐错误问题的困境，让所有人沮丧，却毫无进展。


  在我看来，这种方法应少用，并且仅在项目初期（当存在大量合理缺陷时）或出现灾难性问题时使用。


  追逐错误的方法：


  *   **准确性：-** 智能有时会以这种方式工作（比如处理子群体问题），但很容易被吸引去追逐错误的错误。

  *   **易于扩展：-** 每个人都需要了解一切，才能发现和追踪错误，制定有效的变更，并部署修复。此外，这种方法往往导致在解决哪些问题上做出糟糕的决策。

  *   **松散耦合：一般** 实际上不影响耦合。

  *   **可理解性：一般** 实际上不影响可理解性。

  *   **可衡量性：一般** 实际上不影响可衡量性。

  *   **支持团队：-** 这种方法没有为人们提供良好的工作边界。而且，很容易通过修复一个错误而引发另一个错误，并且通常要到很久以后才能清楚一个修复导致了另一个错误。如果操作不当，这种方法可能会造成糟糕的工作环境。




  ### 元模型


  元模型方法是将系统中各种智能体的预测视为元智能体的特征。每个基础智能体运行并做出决策，然后元智能体审视所有提出的预测，并决定真正的输出应该是什么。使用元模型可以：


  *   **非常准确**，因为它汇集了尽可能多的方法，并学习每种方法在哪些情境下有效、在哪些情境下表现不佳。

  *   **整合旧有智能体的绝佳方式**。例如，当你发现一个比原有启发式方法更优的新智能体时，你可以抛弃原有的启发式方法……或者将它们作为新智能体的一个特征来使用。

  *   **促进多个智能体创建者协作的好方法**。对他们可以尝试的内容没有限制。元模型会使用它们产生的有价值信息，并忽略无价值的信息。


  但元模型的管理也可能相当棘手。一些复杂性包括：


  *   **元智能体与基础智能体紧密耦合**，更改其中任何部分都可能需要重新训练和调整所有部分。

  *   **如果系统的任何部分出现故障**（例如，某个模型开始表现不佳），整个系统都可能崩溃，并且很难追踪问题发生的地点和方式。


  如果你想使用元模型，就需要一些方法来控制相互依赖模型带来的复杂性，例如：


  *   **对哪些模型可以更改以及何时更改强制执行一些结构**——例如，冻结旧有智能体，只有在发现严重问题时才更改它。

  *   **构建额外的机制**，以便非常、非常容易地重新训练和调整构成系统的所有智能体。


  总而言之，使用元模型的方法：


  *   **准确性**：++ 短期内，元模型有能力成为此处列出的方法中最准确的一种。其代价体现在其他方面。追求原始准确性，请使用元模型。

  *   **易于扩展**：- 要部署一个新的智能体，你需要重新训练元智能体，这可能导致整体结果不稳定的风险。可能需要仔细测试。

  *   **松散耦合**：- - 更改任何基础智能体通常都需要重新训练元智能体。任何智能体中的意外变化（例如，其依赖的某个数据源发生变化）都可能影响整个系统，甚至导致其完全崩溃。

  *   **可理解性**：- - 每个智能体都对每个决策有贡献。当出现问题时，可能极难（甚至不可能？）追溯到根源。

  *   **可衡量性**：- 当新智能体加入系统时，很容易衡量其效果。但随着时间的推移（例如，当问题发生变化时），追踪各个智能体的贡献则不那么容易。

  *   **团队支持度**：一般 智能体之间可能存在冲突，但它们可以独立创建。当智能体需要在资源受限的环境中运行时，也可能出现资源竞争。


  ### 模型排序


  模型排序是元模型方法的一种受限版本，其中元模型被限制为超级简单。在排序方法中，模型由智能体创建者排序。每个模型都有机会对结果进行投票。第一个以高置信度投票的模型获胜，并决定答案。


  对于分类问题，可以通过设置一个默认答案来实现——如果没有人投票，答案就是“男性”——并允许每个模型以高精度的操作点来运行“女性”答案。如果任何模型非常确定它能给出高精度的“女性”答案，那么它就给出；如果没有模型确定，则返回默认的“男性”作为结果。


  模型排序的准确性潜力低于可以同时组合所有投票的元模型，但它更容易编排和控制。


  模型排序的方法：


  *   **准确性**：一般 这种方法用部分潜在的准确性换取了易于管理和扩展。

  *   **易于扩展**：+ 智能体创建者可以在序列中放入一个新模型（只要它具有足够高的精度），而不会影响系统的任何其他部分。

  *   **松散耦合**：++ 模型完全解耦，并通过一个每个人都能理解的简单程序进行组合。

  *   **可理解性**：++ 每个交互都可以追溯到决定结果的智能体，并且每个智能体都可以有明确的所有者。

  *   **可衡量性**：一般 很容易衡量每个智能体给用户带来了多少正面和负面交互。缺点是第一个高置信度的答案被采纳，因此其他智能体可能无法获得它们应得的全部功劳（或责任）。

  *   **团队支持度**：+ 任何人都可以轻松地增加价值。潜在的冲突点包括模型排序的顺序以及要求的精度阈值。但遥测技术应该能提供良好的数据来经验性地做出这些决策，因此它们不应该引起太多争论。


  ### 分区上下文


  按上下文分区是组织多个智能体的另一种简单方法。它的工作原理是在上下文上定义一些简单的规则，将其划分为多个分区，然后为每个分区配备一个智能体（或模型序列、元模型等）。例如：


  *   一个智能体负责美国的服务器，另一个负责所有其他地区的服务器。

  *   一个智能体负责小型网站，一个负责大型网站，一个负责聚合内容的网站。

  *   一个智能体负责灰度图像，一个负责彩色图像。

  *   一个智能体负责新用户，一个负责有大量历史记录的用户。


  这种方法有优势，它允许你在问题的不同部分使用不同类型的智能体，用简单的方式解决简单的情况，并且还能控制各个分区上错误的发生率。当然，机器学习算法在技术上可以在内部使用这类信息——并且可能在原始准确性方面选出更好的分区——但手动分区对于编排和组织来说可能非常方便。


  分区的方法：


  *   **准确性**：一般 这种方法将一个难题变成了几个难题。这不一定会影响准确性，但可能会，尤其是在一个领域的创新可能无法移植到所有其他可能受益的领域时。

  *   **易于扩展**：++ 智能体创建者可以定义一个特定的分区，并为其提供量身定制的智能体，而不会影响其他分区。

  *   **松散耦合**：+ 模型完全解耦，并通过一个可理解的程序进行组合（除非分区失控）。

  *   **可理解性**：+ 每个交互都可以追溯到决定结果的智能体，并且每个智能体都可以有明确的所有者。

  *   **可衡量性**：+ 很容易衡量每个智能体给用户带来了多少正面和负面交互。

  *   **团队支持度**：+ 任何人都可以轻松地增加价值。此外，当一个团队成员接手一个问题（通过划分出给其他模型带来麻烦的部分）时，这可以被视为一种帮助：“我很高兴你处理了那些错误，这样我的模型就可以专注于增加其他价值了……”




  ### 覆盖机制


  覆盖机制是处理错误时极其重要的概念。这种组织智能的结构通过赋予一个受信任的智能（通常由人类创建和维护）权限，使其能够覆盖所有其他智能（通常由机器学习创建）的输出——无论这些智能给出什么结论。


  其应用方式之一是通过手动为特定上下文标注特定结果。这可用于精准修正某些破坏性错误。例如：


  *   无论任何智能认为如何，这个网页都不好笑。

  *   当烤面包机的所有传感器读取到特定组合时，无论智能如何判断，都烤制 2 分钟（因为我们确切知道那是哪种产品）。


  另一种应用方式是创建可作为护栏的规则，防止出现明显错误的情况。例如：


  *   如果过去 5 分钟内已向颗粒烤炉投放了 10 颗颗粒，则无论智能如何指示，都不要再投放。

  *   如果网页包含这 15 个冒犯性词汇/短语中的任何一个，则无论智能如何判断，它都不好笑。


  覆盖智能应极其谨慎地使用。它不应试图解决问题；而应仅用于掩盖最严重的错误。


  使用覆盖机制的方法具有以下特点：


  *   **准确性：中等** 只要覆盖机制使用得当。它们应作为最后一道防线，而非复杂的手工智能。

  *   **易于扩展：++** 智能创建者（或具备常识的非专业人士）可以定义上下文并指定结果。工具可提供帮助。

  *   **松散耦合：中等** 覆盖机制与其所修正的错误存在一定耦合，可能会在系统中存在的时间超过实际需要。如果管理不善，久而久之可能成为维护难题。

  *   **可理解性：+** 每次交互都可追溯到影响它的任何覆盖机制。不过，智能创建者在评估新智能时可能会忘记检查所有覆盖机制，这可能导致一些混淆。

  *   **可衡量性：+** 很容易衡量每个覆盖机制为用户节省或带来了多少正面和负面交互。

  *   **支持团队：+** 只要覆盖机制使用得当，它们就能提供一种简单的方法来提高智能创建者的生产力。智能创建者与生成覆盖机制的人员之间可能存在潜在冲突。


  ## 总结


  大多数大型智能系统并非由单一智能构成；它们拥有组织化的智能集合。组织化智能允许多个智能创建者有效协作；以低成本清理错误；使用正确的智能类型来针对问题的正确部分；并整合遗留智能。


  一个组织良好的智能系统应具备：准确性、易于扩展、松散耦合、可压缩性、可衡量性，并支持团队。当然，它也必须准确，有时为了准确性需要牺牲组织性。


  组织智能的方法有很多种。本章介绍了一些主要方法，但其他方法也是可行的。重要的组织技术包括：解耦特征工程；执行多模型搜索；追踪错误；元模型；模型序列化；上下文分区；以及覆盖机制。图
