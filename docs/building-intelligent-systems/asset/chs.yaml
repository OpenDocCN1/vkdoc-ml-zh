- "# 12. 智能运行时\n\n智能运行时将智能付诸行动。它负责与智能系统的其余部分交互，收集执行系统智能所需的信息，加载和解释智能，并将智能的预测结果连接回系统的其余部分。\n\
  \n从概念上讲，智能运行时可能看起来像这样：\n\n```\nIntelligence theIntelligence =\nInitializeIntelligence(,\n\
  ,\n);\nContext theContext =\nGatherContext(,\n,\n,\n,\n);\nPrediction thePrediction\
  \ =\nExecuteIntelligence(theIntelligence, theContext);\nUpdateTheExperience(thePrediction);\n\
  ```\n\n原理上很简单，但像大多数好东西一样，在实践中可能需要相当大的复杂性。\n\n本节涵盖智能运行时将处理的主要元素：\n\n*   收集上下文。\n\
  *   构建特征。\n*   加载模型。\n*   在上下文/特征上执行模型。\n*   将生成的预测结果与体验连接起来。\n\n\n\n## 上下文\n\n\
  智能运行时中的上下文包含智能体可能用于决策的所有数据。例如：\n\n*   如果智能系统试图判断洒水系统是否应该运行，上下文可能包括：\n    *   自上次洒水以来的时间长度。\n\
  \    *   未来几天的天气预报（是否会下雨）。\n    *   过去几天的降雨量。\n    *   用户拥有的景观类型。\n    *   当前时间。\n\
  \    *   温度。\n    *   湿度。\n    *   等等。\n*   如果智能系统正在图像中寻找猫，上下文可能包括：\n    *   原始图像数据（像素的\
  \ RGB 强度）。\n    *   关于图像捕获方式的元数据（曝光度、帧率、时间、缩放倍数）。\n    *   图像来源的位置。\n    *   等等。\n\
  *   如果智能系统试图判断用户是否应该离开电脑休息一下，上下文可能包括：\n    *   自上次休息以来的时间。\n    *   用户休息后进行的活动（击键次数和鼠标移动次数）。\n\
  \    *   用户活跃程度的指示。\n    *   距离用户下一次会议的时间（根据其日历）。\n    *   用户当前正在交互的应用程序名称。\n  \
  \  *   等等。\n\n上下文可以是任何计算机可处理的信息，例如 URL、来自某个嵌入式设备的传感器读数、数字图像、电影目录、用户过去行为的日志、一段文本、医疗设备的输出、商店的销售收据、程序的行为等等。\n\
  \n这些都是在决定智能系统应该做什么时可能有用的信息。事实上，上下文通常是智能体实际用于决策的信息的超集。\n\n一个好的上下文应该：\n\n*   包含足够的信息，使智能体能够有效运作。\n\
  *   包含足够的信息，使智能体能够成长和适应。\n*   包含足够的信息，使智能系统的编排者能够追踪错误。\n*   在运行时能够高效地收集，以供智能体调用。\n\
  *   足够紧凑，可以包含在遥测数据中。\n\n显然，这里存在权衡。更完整的上下文为智能体提供了更多潜力，但也可能遇到工程和运营上的限制，需要额外的 CPU 和内存使用以及网络带宽，并引入延迟和增加数据量。\n\
  \n## 特征提取\n\n收集这些上下文变量可能需要付出相当大的努力。但这并非过程的终点。还有另一层代码将这些变量转换为智能体所需的表示形式。这额外的一层通常被称为“特征提取”或“特征化”，是机器学习系统中的常见部分。\n\
  \n这对智能体实现至关重要，原因有很多：\n\n*   从上下文生成特征的代码需要在运行时执行。也就是说，它需要高效且可靠。\n*   这段代码通常技术性强、计算开销大、涉及数学运算，并且对于没有丰富数据处理经验的人来说不够直观。\n\
  *   智能体的创建者会希望不断更改这段代码的功能；事实上，他们可能需要定期更改它，以持续发展智能体。\n*   这段代码与智能体紧密耦合，特征提取代码和智能体（模型）必须保持同步——用于构建智能体的特征提取代码的确切版本，在运行时执行智能体时也必须使用。\n\
  \n由于这些因素，特征提取必须仔细规划。一些最佳实践包括：\n\n*   为特征提取代码准备广泛的测试集。这应包括：\n    *   对提取器进行单元测试。\n\
  \    *   性能测试，以确保代码满足 CPU 和 RAM 要求。\n    *   定期（可能是每天，或每次签入时）针对一组已知上下文执行特征提取代码，并将输出与已知基准进行比较的测试。任何输出变化都应由工程师和智能体创建者检查，以确保符合预期。\n\
  \    *   一项测试，确保运行时的特征提取代码（当用户与之交互时）与智能体创建环境中的代码（当用于创建模型时）执行完全相同的操作。\n*   在智能体和特征提取代码中编码版本信息，并让运行时验证它们是否同步。\n\
  *   能够脱离整个应用程序来更改特征提取代码；例如，通过每次模型更新时发送新版本的特征提取代码。\n*   制定一个生命周期，将特征提取的变更从智能体创建者转移到工程师，再到部署。该生命周期应允许智能体创建者快速评估变更，并确保部署给用户的代码质量高。\n\
  \n## 模型\n\n模型是智能体的表示形式（我们将在后续章节讨论表示形式的选择）。现在，将模型想象成一个数据文件。在某些智能系统中，模型每隔几天就会更改一次。在另一些系统中，它们每隔几分钟就会更改一次。\n\
  \n更改频率将取决于以下因素：\n\n1.  系统获取足够数据以改进模型的速度。\n2.  构建新模型所需的时间。\n3.  分发新模型的成本。\n4.  相对于成功标准，变更的必要性。\n\
  \n通常，模型的更改速度会比更大的程序快得多。一个高效的运行时应该：\n\n*   允许轻松更新模型（即，无需重启整个系统）。\n*   确保其使用的模型是有效的，并且所有组件（特征提取器、模型、上下文）都保持同步。\n\
  *   能够轻松地从模型错误中恢复（通过回滚到以前的版本）。\n\n模型的一个关键考虑因素是它们在磁盘和 RAM 中占用的空间量。如果不加控制，机器学习可能会产生相当大的模型。但如果有需要，总是可以在模型大小和准确性之间进行权衡。\n\
  \n\n\n## 执行\n\n执行模型是指基于上下文（及相关特征）请求模型做出预测的过程。\n\n在最简单的情况下，当只有一个模型且该模型位于客户端时，执行模型可以简单到将特征加载到数组中，然后调用现成的模型执行引擎函数。市面上有能够执行机器学习所能构建的几乎所有类型模型的库，在大多数情况下，这些库完全够用——因此，大多数时候你甚至无需编写太多代码就能加载和执行模型。\n\
  \n当然，在某些情况下，这些库并不适用。例如，当内存或 CPU 受限时；或者当执行发生在具有特殊硬件（如 GPU 或 FPGA）的设备上，而库无法利用这些硬件时。\n\
  \n另一种执行形式涉及在服务器上运行的模型。在这种情况下，客户端需要打包上下文（或特征）的某种（紧凑）表示形式，将其发送到服务器，并等待响应，同时处理所有必要的协调工作，以妥善应对调用延迟，避免导致糟糕的用户体验。\n\
  \n当系统包含多个模型时（这很常见），执行过程需要运行每个模型，收集其结果，并将它们组合成最终答案。实现方式有很多种，包括：\n\n*   对结果取平均值。\n\
  *   取最高（最确定）的结果。\n*   根据上下文的某些规则选择信任哪个模型（例如，一个模型在 90210 地区对房价预测很准，但在其他地方表现糟糕；另一个模型适用于公寓，但不适用于独栋住宅）。\n\
  *   使用一个模型来组合其他模型的输出。\n\n第四部分“创造智能”中的章节将更详细地讨论模型组合，以及这些方法（及其他方法）的优缺点。\n\n## 结果\n\
  \n执行智能会得到一个答案。也许智能输出一个 0.91，这表示其讨论的内容有 91%的概率。实现必须利用这个结果来影响智能体验将采取的行动。例如，它可以将该值与阈值进行比较，如果值足够高（或低），则触发提示、自动化某些操作或注释某些信息——无论智能体验想要做什么。\n\
  \n### 智能的不稳定性\n\n直接使用智能的原始输出可能存在风险，因为智能本质上是不稳定的。例如：\n\n拍摄一张奶牛的数码照片。使用奶牛检测模型预测图像中包含奶牛的概率，输出可能很高，比如\
  \ 97.2%。\n\n现在等一天。后端系统有了新的训练数据，构建了一个新的奶牛检测模型，并将其分发到运行时。将更新后的模型应用于同一张奶牛图片，概率估计值几乎肯定会不同。差异可能很小，比如\
  \ 97.21%（相比原来的 97.2%），也可能相对较大，比如 99.2%。新的估计值可能更准确，也可能更不准确。但不同版本的智能之间，估计值极不可能完全相同。\n\
  \n上下文的细微变化也可能产生类似影响。例如，将相机对准一头奶牛，尽可能快地连续拍摄两张数码照片。对人类来说，奶牛在两幅图像中看起来一样，背景看起来一样，光线看起来也一样——“奶牛检测”模型应该对第一张图像和第二张图像输出相同的概率估计。这是人类的看法。\n\
  \n但对于模型来说，这些图像可能看起来非常不同：数字传感器会引入噪声，而图像之间的噪声分布会不同（产生人眼难以察觉的微小斑点）；奶牛可能在一张图像中眨了眨眼，而在另一张中没有；风可能吹过，改变了树叶阴影的位置；相机的位置可能发生了极其微小的变化；相机的自动对焦或曝光校正可能对图像做了略微不同的处理。\n\
  \n由于所有这些原因，智能可能对这两张图像做出不同的估计。可能一张是 94.1%，另一张是 92.7%。\n\n这种变化对于由此产生的智能体验来说可能无关紧要，但也可能至关重要。\n\
  \n试图假装机器学习系统中不存在不稳定性，可能会导致效果较差（甚至糟糕）的智能体验。\n\n### 智能 API\n\n为了解决智能输出的不稳定性，通常将智能封装在一个接口后面会很有帮助，该接口只暴露实现系统目标所需的最少信息：\n\
  \n*   处理概率时，考虑舍弃一些精度：将 92.333534%四舍五入为 90%。\n*   考虑将概率转换为分类：不要说“有 45%的概率存在一头奶牛”，而是说“没有奶牛”。\n\
  *   考虑对预测进行量化：不要说“图像中坐标(14,92)处有一头奶牛”，而是说“图像左侧有一头奶牛”。\n\n实现这些类型转换所需的阈值和策略与智能紧密耦合，应在每次更新模型时一并包含在内。\n\
  \n虽然这些做法确实有助于使模型输出更稳定，并提供一定程度的模型内部封装，但它们并非完美无缺。例如，假设奶牛检测器在一帧图像中有 81%的把握认为存在一头奶牛。模型的阈值设定为\
  \ 80%。因此，系统创建了一个“此处有奶牛”的分类，并点亮了一个用户界面元素。\n\n然后，在下一帧图像中，奶牛检测器只有 79.5%的把握认为存在一头奶牛，用户体验元素闪烁消失。这看起来可能非常糟糕。\n\
  \n一个设计良好的 API，结合一个旨在最小化缺陷的体验设计，两者都是打造有效智能体验所必需的。\n\n## 总结\n\n智能运行时负责：收集系统上下文；将此上下文转换为与智能兼容的形式；执行构成智能的各种组件；组合智能结果，并在智能与体验之间创建良好的接口；以及利用智能的输出来影响用户体验。\n\
  \n智能运行时需要处理的一些关键组件包括：\n\n*   **上下文**，包括在智能系统中做出良好决策相关的所有信息。\n*   **特征**（以及特征提取代码），将上下文转换为与包含系统智能的特定模型兼容的形式。\n\
  *   **模型**，代表智能，通常包含在数据文件中，这些文件在智能系统的生命周期内会相对频繁地变化。\n*   **执行引擎**，在特征上执行模型并返回预测结果。有许多优秀的库支持模型执行，但通常需要对这些库进行封装以组合智能；有时需要针对独特的执行环境进行替换。\n\
  *   **结果**，即智能的预测结果。最佳实践是保持原始结果的私密性，并创建一个智能 API，该 API 仅暴露为智能体验提供支持所需的最少信息，同时能够稳健地应对随时间发生的变化。\n\
  \n一个有效的智能运行时将：易于追踪错误；在运行时中的执行方式与在智能创建环境中的执行方式相同；支持对模型和特征提取进行轻松更改；并使系统的各个部分难以不同步。\n\
  \n\n## 思考题…\n\n阅读本章后，你应该能够：\n\n*   设计一个运行时，使其能够执行智能并利用它来驱动用户体验。\n*   理解如何构建一个智能运行时，以便在智能方面进行创新，并支持智能实现的其他组件。\n\
  \n你应该能够回答以下问题：\n\n*   智能调用的上下文与机器学习模型使用的特征之间有什么区别？\n\n回想一下你最近使用的智能系统。\n\n*   该系统进行的智能调用中，上下文可能包含哪些类型的信息？\n\
  *   从高层级上，简述从该上下文到影响用户体验的步骤（如有必要，可自行补充系统运作方式的细节）。\n*   该系统的智能可能通过哪些方式进行封装，以减轻智能微小变化对用户的影响？\n\
  \n"
- '# 13. 智能的部署位置


  在构建智能系统时，你需要决定智能的部署位置。也就是说，你将在何处将模型、运行时和上下文整合在一起以生成预测，然后如何将这些预测传回智能体验。


  运行时可以位于用户设备上，在这种情况下，你需要弄清楚如何在整个用户群中更新模型。


  运行时也可以位于你运行的服务中，在这种情况下，你必须弄清楚如何以足够低的成本和延迟，将上下文（或特征）从用户设备传输到服务，从而使端到端体验有效。


  本章讨论如何决定智能的部署位置。首先讨论决定智能部署位置时需要考虑的因素，包括延迟和成本，以及它们为何对各种类型的智能体验至关重要。然后讨论在客户端和服务之间定位智能的常见模式，包括每种选项的优缺点。


  ## 定位智能的考量因素


  决定智能部署位置时，一些关键的考量因素如下：


  *   更新智能的延迟。

  *   执行智能的延迟。

  *   运行智能的成本。

  *   用户离线时会发生什么。


  通常，你需要在上述属性之间进行权衡。本节将逐一讨论这些因素。


  ### 更新延迟


  决定智能部署位置时，一个考量因素是尝试更新智能时产生的延迟。新的智能在到达运行时并替换旧智能之前，无法让用户受益。


  当运行时与智能创建环境位于同一台计算机上时，更新智能的延迟可能非常短；当运行时位于客户端计算机上，且该客户端计算机不经常连接互联网时（因此只能偶尔获取新智能），延迟可能会非常长。


  在以下情况下，将智能传输到运行时的延迟非常重要：


  *   智能的质量正在快速提升。

  *   你试图解决的问题正在快速变化。

  *   存在代价高昂的错误风险。


  我们将更详细地讨论这些更新延迟可能导致问题的情况，包括它们如何影响智能体验的示例。


  #### 质量快速提升


  当智能的质量快速提升时，更新智能的延迟就变得重要。


  当问题较新时，很容易取得进展。会有各种技术可供探索。每天都会有新数据到来，新用户会以你未曾预料的方式使用产品。会有兴奋感和活力。智能的质量可能会迅速提高。


  例如，假设这是第一天——你刚刚发布了你的智能鞋。这款鞋旨在根据穿着者的活动调整松紧度。坐着无所事事？鞋子会自动放松，松开鞋带，让穿着者更舒适。但如果用户开始跑步？跳跃？鞋子会自动收紧鞋带，让穿着者获得更好的支撑，减少受伤的可能性。


  你进行了一次盛大的发布。市场上有成千上万双智能鞋。你正在获取遥测数据，了解用户如何移动，何时覆盖鞋子设置以收紧鞋带，以及何时覆盖设置以放松鞋带。你会想利用所有这些数据来生成新的智能。


  如果你生成了新的智能，进行了测试，并确定它并不比你发布时的智能好多少——那没问题！无需担心更新智能的延迟，因为你没有任何收益。


  但如果新的智能更好——好得多——你会急于将其推送到市场上所有的鞋子上。因为用户正穿着这些鞋子。他们会与朋友交谈。评论家会撰写文章。你会想快速更新那个智能！


  当智能快速改进时，部署延迟会阻碍你利用这些智能。这在问题规模非常大（包含非常多的上下文）或问题非常难以解决（质量将在很长一段时间内持续改进）的情况下尤其重要。


  #### 问题快速变化


  当问题快速变化时，更新智能的延迟就变得重要，因为问题可能是开放式的或随时间变化的。


  在某些领域，新上下文出现缓慢，需要数周或数月的时间。例如，修建新道路需要时间；音乐品味演变缓慢；新的烤面包机产品并非每天上市。在这些情况下，部署新智能有几天或几周的延迟可能无关紧要。


  另一方面，在某些领域，新上下文出现迅速，每天成百上千次。例如，每秒都有新的垃圾邮件攻击发生；每天有数百篇新新闻文章被撰写；飓风登陆；股市崩盘。在这些情况下，能够快速部署新智能可能至关重要。


  问题变化有两个重要方面：


  1.  新上下文出现的速度有多快？

  2.  现有上下文消失的速度有多快？


  在那些新上下文不断添加，但旧上下文在相当长的时间内仍然相关的领域，侵蚀会缓慢发生。例如，当一条新道路建成时，你的智能可能不知道如何处理它，但你的智能在它已知的所有现有道路上仍然可以正常工作。


  在那些新上下文取代旧上下文，且你昨天的智能今天不再有用的领域，侵蚀会迅速发生。例如，当一首新歌登上排行榜榜首时，一首老歌就会退出。当垃圾邮件发送者开始新的攻击时，他们会停止旧的攻击。


  当一个问题频繁变化，以至于侵蚀了现有智能的质量时，更新智能的延迟可能成为智能系统成功的关键因素。




  #### 代价高昂的错误风险


  当智能系统可能犯下需要快速纠正的代价高昂的错误时，更新情报的延迟就变得至关重要。


  智能系统会犯各种错误。有些错误并不太严重，尤其是当智能体验能帮助用户应对这些错误时。但有些错误则可能成为真正的问题。


  以智能鞋为例，鞋带会根据穿着者的动作自动放松或收紧。想象一下，有极小一部分用户会以某种特定方式坐立不安，导致鞋子紧紧夹住他们的脚，带来疼痛。


  或者想象一下，有一小部分用户在棒球队中担任右外野手。他们百分之九十九的时间都站在那里，看着云彩飘过——而百分之一的时间则需要疯狂冲刺去接一个高飞球。也许智能鞋跟不上这种节奏。也许右外野手会因此跑掉鞋子、滑倒并受伤。


  当你的智能系统所犯的错误代价高昂，并且这些代价无法通过良好的用户体验来减轻时，延迟就会变得非常痛苦。想象一下，用户日复一日地打电话、投诉、哭诉你给他们造成的损害，而你却在等待新的情报进行传播。这会让你感觉糟糕，也可能让你的业务面临风险。


  ### 执行延迟


  决定情报应置于何处的另一个考量因素是运行时执行情报的延迟。


  要执行情报，系统必须收集上下文，将上下文转换为特征，将特征传输到情报所在的位置（有时是整个上下文被传输，特征提取稍后进行），等待情报执行，等待情报执行结果返回给体验层，然后更新体验。这些步骤中的每一步都可能引入执行情报的延迟。


  当智能运行时与智能体验位于同一台计算机上时，执行延迟可能很短；当智能运行时与智能体验位于不同的计算机上时，延迟则可能很长。


  在以下情况下，情报执行延迟可能成为问题：


  *   用户必须等待延迟。

  *   正确答案变化迅速且剧烈。


  延迟及其对用户的影响可能难以预测。有时用户并不在意一点点延迟。有时一点点延迟就会让他们抓狂，彻底毁掉一种体验。尝试设计那些延迟权衡可以（在编排过程中）轻松更改的体验，以便能够用真实用户测试各种选项。


  #### 智能体验中的延迟


  当用户注意到执行延迟时，尤其是当他们必须等待延迟才能继续操作时，延迟就变得重要。这可能发生在以下情况：


  *   情报调用是渲染体验的重要组成部分。想象一个应用程序在正确渲染之前需要多次情报调用。也许应用程序需要在渲染内容之前判断该内容对用户是否有潜在危害或冒犯性。如果用户在等待情报调用期间无事可做，那么情报执行延迟就可能成为问题。

  *   情报调用是交互式的。想象一个用户直接与情报进行交互的应用程序。也许他们拨动一个开关，期望灯能瞬间亮起。如果开关在改变灯光状态前需要与情报系统确认，而这次情报调用需要几百或几千毫秒——用户可能会撞到脚趾。


  另一方面，本质上是异步的智能体验，例如决定是否向用户显示提示，对执行延迟则不那么敏感。


  #### 正确答案发生剧烈变化


  当正确答案变化迅速且剧烈时，执行情报的延迟就变得至关重要。


  想象一下创建一个用于操控无人机的智能系统。无人机正飞向一个目标；正确的答案是径直飞向目标。没问题。然后有人走到了无人机前面。或者想象无人机在一个美丽、湛蓝、阳光明媚的日子里飞行，突然一阵狂风不知从何处刮来。在这些情况下，无人机的正确控制指令发生了变化，而且变化得非常快。


  当智能系统的正确行动方案变化迅速且剧烈时，执行情报的延迟可能导致严重故障。


  ### 运营成本


  决定情报应置于何处的另一个考量因素是智能系统的运营成本。


  分发和执行情报需要消耗 CPU、RAM 和网络带宽。这些都需要花钱。一些可能推高智能系统成本的关键因素包括：


  *   分发情报的成本。

  *   执行情报的成本。


  #### 分发情报的成本


  分发情报通常以带宽费用的形式，既让服务方也让用户方花钱。每一份新的情报都需要托管（例如在 Web 服务上），并且运行时必须定期检查新情报，然后下载找到的任何情报。此成本与情报必须到达的运行时数量（托管它的客户端或服务的数量）、情报更新的大小以及更新频率成正比。对于互联网规模的智能系统，分发情报的成本可能非常巨大。


  考虑用户的成本也很重要。如果主要使用场景是宽带用户，分发模型可能不是问题——对他们来说成本可能不高。但当用户使用移动设备，或者处于网络使用被更仔细计量和收费的地区时，用于情报分发的带宽就可能成为一个重要的考量因素。


  #### 执行情报的成本


  当情报位于服务端，而客户端必须将上下文（或特征）发送到服务端并等待响应时，执行情报也会产生带宽成本。根据上下文的大小和调用的频率，将上下文发送到服务端的成本可能高于将情报发送到客户端的成本。请记住，遥测和监控也需要从客户端收集一些上下文和特征信息；有机会将工作合并以降低成本。


  执行情报还会消耗 CPU 周期和 RAM。将智能运行时放在客户端的好处是用户承担这些成本。但某些类型的情报执行起来可能非常昂贵，而某些客户端（如移动设备）存在资源限制，使得重量级的智能运行时变得不切实际。在这些情况下，在服务端使用智能运行时（可能配备定制硬件，如
  GPU 或 FPGA）可以实现更高效的情报。


  在考虑运营成本时，应力求实现以下目标：


  1.  对用户敏感，不要求他们承担对他们来说重要的成本（包括带宽，还有移动设备的电量等）。

  2.  让用户承担他们不会注意到的部分成本（这样你就不必购买大量服务器）。

  3.  平衡运行智能系统的所有成本，并随着用户数量和情报质量的增长而良好地扩展。




  ### 离线运行


  在决定智能应部署在何处时，另一个需要考虑的因素是：智能系统是否需要在离线（且无法联系任何服务）状态下运行。


  并非所有智能系统都需要在离线时工作。例如，交通预测系统无需在用户乘坐飞机飞越太平洋时工作。但有时智能系统确实需要离线运行——例如，当智能运行在受限环境（如军用车辆）或生命攸关的系统中时。


  当离线运行至关重要时，智能的某个版本必须驻留在客户端。这可以是完整的智能系统，也可以更像是一个备份——整体智能的精简版本，用于在服务恢复在线期间维持用户的基本使用。


  ## 智能的部署位置


  本节将更详细地探讨智能部署的一些选项。它介绍了一些常见模式，包括：


  *   产品中的静态智能

  *   客户端智能

  *   以服务器为中心的智能

  *   后端（缓存）智能

  *   混合智能


  本节将讨论每种方法，并探讨它们在应对智能部署位置的四个考量因素方面的表现：更新延迟、执行延迟、运营成本以及离线运行。


  ### 产品中的静态智能


  无需借助任何智能系统组件，也可以实现智能。只需收集一批训练数据，生成一个模型，将其与软件捆绑在一起，然后发布即可。


  这与发布传统程序非常相似。你构建它，尽你所能进行测试——在实验室里，或者通过焦点小组和 Beta 测试与客户一起——不断调整直到满意，然后将其发布到世界。


  这种方法的优点是系统工程成本更低。对于许多问题来说，它可能已经足够好了。它可以在无法建立用户与智能创建之间闭环的情况下工作。并且仍然存在获取反馈（通过评论和客户支持电话）以及通过传统软件更新来更新智能的可能性。


  缺点是智能更新将更加困难，使得这种方法不太适合开放式、随时间变化或困难的问题。


  更新智能的延迟：差

  执行延迟：极好

  运营成本：低廉

  离线运行：是


  *   缺点总结：难以更新智能。存在无法衡量的智能错误风险。没有数据可用于改进智能。


  ### 客户端智能


  客户端智能完全在客户端上执行。也就是说，智能运行时完全驻留在客户端，客户端会定期下载新的智能。


  下载内容通常包括新模型、解释模型输出的新阈值（如果智能封装在 API 中——理应如此），以及（有时）新的特征提取代码。


  客户端智能通常允许将相对更多的资源用于执行智能。原因之一是智能可以以相对较低的成本消耗客户端的空闲资源（移动设备上可能除了电量消耗外）。另一个原因是运行时延迟不会增加任何服务调用的延迟，因此在影响用户体验（用户可感知的层面）之前，有相对更多的时间进行处理。


  客户端智能的主要挑战在于决定何时以及如何向客户端推送新的智能。例如，如果智能大小为 10 兆字节，并且有十万个客户端，那么每次智能更新大约需要消耗 1TB 的带宽。此外，模型通常不易压缩，也不适合增量更新，因此通常需要全额支付这笔成本。


  客户端智能的另一个潜在复杂性是处理不同版本的智能。一些用户会处于离线状态，无法收到你希望发送的每一次智能更新。一些用户可能会选择退出更新（可能通过防火墙），因为他们不喜欢有东西下载到他们的机器上。这些情况将使解读用户问题变得更加困难。


  客户端模型的另一个缺点是，它们将你的智能置于任何想要窥探的人手中：可能是竞争对手，可能是想滥用你的服务或用户的人——比如垃圾邮件发送者。一旦有人获得了你的模型，他们就可以对其进行测试。他们可以自动化这些测试。他们可以找出什么样的输入能让模型给出一个答案，什么样的输入能让它给出另一个答案。他们可以找到对其上下文（电子邮件、网页、产品等）的修改方式，从而诱使你的模型犯下他们想要的那种错误。


  更新智能的延迟：可变

  执行延迟：极好

  运营成本：基于更新频率

  离线运行：是


  *   缺点总结：向客户端推送复杂智能的成本可能很高。难以让所有客户端与更新保持同步。客户端资源可能受限。将智能暴露于外界。


  ### 以服务器为中心的智能


  以服务器为中心的智能在服务端实时运行。也就是说，客户端获取上下文（或特征）并将其发送到服务器，服务器根据这些特征执行智能，并将结果返回给客户端。


  使用以服务器为中心的智能，可以通过向运行智能的服务器（或服务器集群）推送新模型，快速且可控地更新模型。这也使得遥测和监控更加容易，因为需要记录的大部分数据已经作为智能调用的一部分存在于服务中。


  但是，以服务器为中心的智能需要随着用户群的扩大而进行扩展。例如，如果每秒有一百个智能请求，服务必须能够非常快速地执行智能，并且很可能是并行执行。


  更新智能的延迟：好

  执行延迟：可变，但包含互联网往返时间

  运营成本：服务基础设施和带宽可能产生显著成本；可能消耗用户的带宽

  离线运行：否


  *   缺点总结：智能调用存在延迟。服务基础设施和带宽成本。用户带宽成本。运行能够实时执行智能的服务器的成本。




  ### 后端（缓存）智能


  后端智能涉及离线运行智能、缓存结果，并将这些缓存结果投递到需要的地方。当分析有限数量的事物时，缓存智能非常有效，例如图书馆中的所有电子书、服务可推荐的所有歌曲，或智能洒水器销售区域的所有邮政编码。但即使事物数量无限，只要上下文变化缓慢，后端智能也同样适用。


  例如，一个洒水器被销售到一个新的邮政编码区域。该服务之前从未考虑过这个邮政编码，因此它会返回一个关于最佳浇水时间的默认猜测。但随后后端启动，检查它能找到的关于该邮政编码的所有信息，以生成一个良好的浇水计划，并将此计划添加到其缓存中。下次再有洒水器在该邮政编码区域售出时，服务就知道如何精确浇水了（也许系统甚至会为那个触发整个流程的“倒霉蛋”更新浇水计划）。


  与其他方案相比，后端智能系统可以在每个智能决策上投入更多的资源和时间。例如，设想一个极其复杂的浇水计划模型，它需要在一台高端服务器上运行一小时，来决定每个邮政编码区域应如何浇水。它会分析卫星图像、交通模式、该地区鸟类和青蛙的迁徙情况——无所不包。这样的模型如果放在洒水器的嵌入式计算机上运行，可能需要数月时间——这根本不现实。它也无法在需要每秒响应数百次调用的服务器上运行——绝无可能。但它可以在后端“时不时地”运行，其分析结果可以被缓存。


  智能缓存可以存在于服务中；其部分内容也可以分发到客户端。


  后端智能的一个缺点是，更换模型的成本可能更高，因为所有先前缓存的结果可能都需要重新计算。


  另一个缺点是，它仅在能够利用智能调用的上下文来“查找”相关智能时才有效。当上下文描述的是一个实体（如一个网页、一个地点或一部电影）时，这种方法有效。但当上下文描述的是不太具体的事物时，比如用户生成的文本块、传感器阵列的一系列输出或一段视频剪辑，这种方法就失效了。


  智能更新延迟：可变


  执行延迟：可变


  运营成本：基于使用量


  离线运行：部分支持


  *   缺点总结：当上下文快速变化，或上下文的正确答案快速变化时，效率不高。更换模型和重建智能缓存的成本可能很高。将智能限制在可被查找的事物上。


  ### 混合智能


  在实践中，建立结合了上述几种方法的混合智能系统是非常有用的。


  例如，一个系统可能使用后端智能来深度分析热门项目，而使用客户端智能来评估其他所有内容。


  或者，一个系统可能在大多数情况下使用客户端智能，但当决策后果严重时，会与服务进行双重校验。


  混合智能可以掩盖其各个组件的弱点。


  但是，混合智能的构建和编排可能更为复杂。试想，如果系统给出了错误答案，错误来自智能的哪个部分？是客户端模型？还是缓存在服务中的智能？或者是两者之间某种微妙的交互？


  有时，甚至很难确切知道在错误发生时，所有这些组件处于何种状态。


  尽管如此，大多数大型智能系统在决定其智能应驻留何处时，都会采用某种形式的混合方法。


  ## 总结


  选择智能的驻留位置是创建成功智能系统的重要一环。智能的位置会影响：


  *   **更新智能的延迟**：这取决于智能从创建环境移动到运行时环境需要走多远，以及运行时环境在线接收更新的频率。

  *   **执行智能的延迟**：这取决于将上下文和特征从智能体验移动到智能运行时，再将答案移回所需的时间。

  *   **运营智能系统的成本**：这取决于移动智能、上下文和特征所需支付的带宽费用，以及执行智能所需支付的 CPU 费用。

  *   **系统离线工作的能力**：这取决于当客户端无法与你的服务组件通信时，智能能在多大程度上在客户端运行。


  平衡这些属性有多种选择。以下是一些常见模式：


  *   **静态智能**：将智能完全置于客户端，完全不连接服务。

  *   **客户端智能**：将智能完全置于客户端，但连接服务以进行智能更新和遥测。

  *   **服务端中心智能**：将智能完全置于服务中，每次需要在某个上下文上执行智能时，都需要调用服务。

  *   **后端（缓存）智能**：在常见上下文上离线执行智能，并通过缓存提供答案。

  *   **混合智能**：这是大多数大规模智能系统的现实情况，它结合了多种其他方法来实现系统目标。


  ## 思考题…


  阅读本章后，你应该：


  *   了解智能可以驻留的所有位置，从客户端到服务后端，以及每种方式的优缺点。

  *   理解智能放置的影响，并能够为你的系统设计出最佳的实现方案。


  你应该能够回答如下问题：


  *   设想一个系统，其智能模型大小为 1MB，每次智能调用的上下文为 10KB。如果模型需要每天更新，那么当用户数量/智能调用量达到多少时，将智能放在服务中比放在客户端更有意义？

  *   如果你的应用程序需要在飞越太平洋的飞机上（无互联网）工作，智能放置有哪些选择？

  *   如果你的应用程序需要在飞机上运行，但主要使用场景是在用户家中，该怎么办？有哪些选项可以使系统在这两种环境下都能表现出色？


  '
- '# 14. 智能管理


  智能系统中的智能经历了一个从创建、验证、部署、面向用户启用，到最终持续监控的过程。智能管理通过使部署新智能并面向用户启用变得更安全、更容易，从而弥合了智能创建（本书第四部分讨论）与智能编排（本书第五部分讨论）之间的鸿沟。


  在最简单的情况下，智能管理可能涉及手动将模型文件复制到部署目录，运行时环境会从该目录获取模型并将其暴露给用户。但在大型、复杂的智能系统中，管理智能的过程可能（并且很可能应该）要复杂得多。


  本章将讨论智能管理面临的一些挑战。然后，它将概述智能管理如何在验证智能并面向用户启用智能的同时，支持你智能系统的敏捷性。




  ## 智能管理概述


  智能管理涉及将所有工作从智能的创建之处，转移到其将影响用户的地方。这包括：


  *   对智能进行**健全性检查**，以确保其能正常运行。

  *   将智能部署到其需要执行的运行时环境中。

  *   以受控的方式**启用**智能。

  *   关闭不再有用的智能。


  一个智能管理系统可以很简单（比如一套智能操作员必须为上述每个步骤手动执行的指令集）；也可以部分自动化（比如一套完成这些工作的命令行工具）；或者可以非常先进（比如一个图形控制台，让智能编排者只需点击一下即可注入、移动、启用或禁用智能）。一个好的智能管理系统应做到以下几点：


  *   提供足够的支持，以匹配您环境中智能管理的技能和场景。

  *   降低出错的可能性。

  *   不引入过多的延迟。

  *   在人工参与和实施成本之间取得良好的平衡。


  智能管理之所以具有挑战性，是因为其复杂性、更新频率以及涉及的人为系统。我们将依次讨论这些方面。


  ### 智能管理中的复杂性


  智能系统可能相当复杂。例如：


  *   智能可能需要存在于客户端和服务器之间的多个位置，包括客户端智能、一个或多个服务器端智能以及缓存智能。

  *   智能可能来自数十个不同的来源——有些是机器学习的，有些是人工创建的，还有一些是由组织外部的流程创建的。

  *   智能的各个部分可能相互依赖，并且可能由不同的人以不同的频率进行更新。


  随着智能系统不断发展，仅仅将一个新的智能正确部署给用户就可能变得困难且容易出错。


  ### 智能管理中的更新频率


  智能系统在其生命周期内会多次更新其智能，请考虑以下情况：


  *   每周更新一次智能，持续三年，大约需要一百六十次。

  *   每天更新一次智能，持续三年，大约需要一千次。

  *   每小时更新一次智能，持续三年，大约需要两万六千次。

  *   每分钟更新一次智能，持续三年，大约需要一百五十万次。


  这些都是相当大的数字。它们意味着智能管理流程需要可靠（错误率低），并且可能无法投入太多人力。


  ### 人为系统


  智能可能由具有各种技能水平和背景的用户部署：


  *   非常了解智能系统实现的专家。

  *   不擅长工程开发的机器学习从业者。

  *   正在手动纠正系统所犯代价高昂错误的非技术人员。

  *   新员工。

  *   心怀不满的员工。


  让智能管理更简单、更不易出错，可以为您的智能系统随着时间的推移而发展的敏捷性带来巨大回报。


  ## 智能的健全性检查


  一个快速、自动化的健全性检查系统是智能创建者的安全网，使他们能够自信地进行创新，并将精力集中在构建更好的智能上（而不是反复核对一堆细节，并记住如何运行所有应该运行的测试）。一个有效的安全网将验证新的智能：


  *   是否与智能系统兼容。

  *   是否能够执行并满足所有运行时要求。

  *   是否没有犯明显的错误。


  一个好的智能管理系统，会使得不进行这些检查就部署智能，比通过自动化这些检查的系统部署智能更加困难。


  我们现在将依次探讨这些检查类别。


  ### 兼容性检查


  错误时有发生。有时智能创建者会搞错格式，或者忘记对其模型文件运行转换器，或者使用损坏的遥测文件训练模型，或者训练环境以奇怪的方式崩溃，输出了损坏的模型。智能管理是一个很好的检查点，许多简单、常见的错误可以在变成破坏性问题之前被捕获。以下是一些需要检查以确保智能兼容的事项：


  *   智能数据文件格式是否正确，并且能否在智能运行时中加载。

  *   新智能是否与当前部署的特征提取器同步。

  *   新智能是否与系统中的其他智能同步，或者依赖的智能是否正在同时部署。

  *   新智能部署是否包含所有必需的元数据（例如，将其连接到智能体验所需的任何阈值）。

  *   部署新智能的成本是否合理（就带宽成本等而言）。


  这些都是静态测试，应该易于自动化，不会引入太多延迟，并且不需要太多人工监督（除非出现问题）——自动判断它们是成功还是失败很容易。


  ### 运行时约束检查


  检查新智能是否满足其执行环境的任何约束也很重要，包括：


  *   新智能在运行时加载到内存中时，不会占用太多 RAM。

  *   新智能是否满足执行环境的运行时性能目标（在广泛的上下文范围内）。

  *   当用户与新智能交互时，其运行方式是否与在智能创建环境中的运行方式完全相同（上下文处理、特征创建、智能执行等）。


  这些测试需要：


  *   在一个模拟用户将与智能交互的环境的测试环境中执行智能。

  *   一个能够加载上下文、对其执行智能、测量资源消耗并将结果与已知正确答案进行比较的设施。

  *   一组能够良好覆盖用户所遇到的各种情况的测试上下文。


  这些是可以自动化的动态测试。它们会引入一些延迟（取决于您使用的测试上下文数量）。它们不需要太多人工监督（除非出现问题）——自动判断它们是成功还是失败很容易。


  ### 明显错误检查


  智能创建者不应创建会犯明显错误的智能。您可以告诉他们这一点（我将在本书后面告诉他们）——但进行检查总没有坏处。智能管理应验证：


  *   新智能在验证集（智能创建者从未见过的上下文——不许作弊）上具有“合理的”准确率。

  *   新智能在一组业务关键型上下文（这些上下文绝不应出错）上没有犯任何错误。

  *   新智能犯下的代价高昂的错误，不会显著多于之前的智能。

  *   新智能不会将其新错误集中在任何关键的用户子群体或上下文上。


  如果这些测试中有任何一项失败，则应暂停智能部署，等待人工进一步审查。


  这些是可以自动化的动态测试。它们会引入一些延迟（取决于您使用的测试上下文数量）。它们具有一定的主观性，因为人类可能需要考虑准确率随时间波动的含义。




  ## 点亮智能


  在智能通过一系列离线检查的合理性验证后，就可以面向真实用户进行检验。实现方式包括以下几种：


  *   单次部署

  *   静默智能

  *   受控发布

  *   分组实验

  *   回滚


  本节将讨论这些方法及其优缺点，以便您决定哪种方式最适合您的智能系统。


  ### 单次部署


  在最简单的情况下，可以通过以下几种方式之一，将智能一次性同时部署给所有用户：


  *   将新智能打包成一个文件，推送到客户端的运行时环境中，并覆盖旧智能。

  *   将新智能复制到托管运行时环境的服务器上，并重启运行时进程。

  *   将智能划分为客户端运行部分、服务端运行部分和后端运行部分，并将正确的组件部署到正确的位置。


  一次性推送智能管理简单，实现也相对容易。但它的容错性很差。如果出现问题，所有用户会同时遇到问题。


  例如，假设您制造了一台智能洗衣机。放入衣物，关上门，这台机器就能自动清洗——无需再操作旋钮和设置。假设系统运行良好，但您决定通过单次部署来改进智能。您将新智能推送到数万台智能洗衣机上——然后开始收到报告，说洗衣机损坏了用户的衣物。这是怎么发生的？您不确定。但问题影响了所有用户，而您又没有好的解决方案。


  单次部署在以下情况下有效：


  *   您希望保持简单。

  *   您拥有出色的离线测试来捕捉问题。


  单次部署在以下情况下可能存在问题：


  *   您的系统会犯下代价高昂的错误。

  *   您识别和纠正问题的能力有限/速度较慢。


  ### 静默智能


  静默智能将新智能与现有智能并行部署，并对每次交互同时运行两者。现有智能用于控制智能体验（用户看到的内容）。静默智能不影响用户；其预测结果仅记录在遥测数据中，以便您检查并判断新智能是否表现良好。


  一种有用的技术是检查现有智能与静默智能做出不同决策的场景。这些场景正是新智能比旧智能更好或更差的地方。手动检查几百个这样的场景，可以极大地增强您对新智能是否安全可切换（或不可切换）的信心。


  智能可以以静默模式运行任意时长：一千次执行、几小时、几天或几周；只要您需要时间来建立信心即可。


  如果新智能在静默评估中证明了自己，它就可以取代之前的智能。但如果新智能表现更差，它可以直接被删除，而不会对任何用户造成影响——毫无问题！


  静默智能在以下情况下有效：


  *   您希望对智能质量进行额外检查。

  *   您想确认智能在运行时给出的答案与创建时一致。

  *   您面临一个非常大或开放性的问题，并且希望确信您的智能能在新的、罕见的场景（可能不会出现在智能创建环境中）中表现良好。


  静默智能在以下情况下可能存在问题：


  *   您不希望同时运行多个智能带来的复杂性（或资源成本）。

  *   延迟至关重要，您无法承受等待在静默模式下验证新智能的时间。

  *   在不将静默智能暴露给用户的情况下，很难评估其效果——您能看到它会做什么，但看不到用户实际会得到什么结果。


  ### 受控发布


  受控发布将新智能开放给一小部分用户，而其余用户则继续使用旧智能。它从新用户那里收集遥测数据，用于验证新智能是否按预期运行。如果新智能表现良好，则向更多用户发布；如果新智能存在问题，则可以回滚，而不会造成太大损害。


  这与静默智能有两个重要区别：


  1.  受控发布的遥测数据包含了智能对用户行为的影响。您既能知道智能做了什么，也能知道用户如何回应。

  2.  受控发布在每个客户端上只运行一个智能；但在整个用户群中运行多个智能——它每个客户端消耗的资源更少，但管理可能更复杂。


  可以使用各种策略来平衡延迟和安全性，从而发布智能，包括：


  *   只要遥测数据显示一切顺利，每隔几小时就向额外一小部分用户发布。

  *   先向一个小型测试组发布几天，如果没有发现问题，再向所有用户发布。

  *   先向 Alpha 测试者发布一段时间，然后向 Beta 测试者，再向早期采用者，最后向所有用户发布。


  受控发布在以下情况下有效：


  *   您希望了解用户对新智能的反应，同时控制新智能可能造成的损害程度。

  *   您愿意让部分用户遇到问题，以帮助您验证智能。


  受控发布在以下情况下可能存在问题：


  *   您不想处理同时部署多个版本智能所带来的复杂性。

  *   您担心罕见事件。例如，向 1% 的用户进行受控发布，不太可能发现仅影响 1% 用户的问题。


  ### 分组实验


  分组实验是一种特殊类型的受控发布，它将智能的不同版本提供给不同的用户群体，以回答关于智能的统计问题。


  假设两位智能创建者找到您，说他们为您的智能系统开发了一个好得多的智能。其中一个智能速度快，但准确性一般。另一个非常慢，但准确性高得多。


  哪一个能更好地实现您智能系统的目标？用户会更喜欢哪一个？哪一个能提高用户参与度？哪一个能带来更好的结果？


  您可以进行焦点小组讨论。您可以让智能创建者争论不休。见鬼，您甚至可以给他们战斧，把他们放进竞技场，让胜者选择发布哪个智能……


  或者，您可以将每个版本部署给 1,000 名客户，并在接下来的一个月里跟踪他们的结果。


  *   其中一个试验群体使用该应用的频率是否高于另一个？

  *   其中一个试验群体是否比另一个获得了更好的结果？

  *   其中一个试验群体对您的应用是否有更高的好感度？


  分组实验可以帮助您理解智能如何与智能系统的其他部分交互，以实现目标。


  分组实验在以下情况下有效：


  *   您正在考虑少量重大变更，并且想知道其中哪一个最好。

  *   您需要长时间跟踪变更，以便对变更如何影响结果、领先指标和组织目标做出具有统计意义的陈述。


  分组实验在以下情况下可能存在问题：


  *   您需要快速迭代并在短时间内进行大量更改。

  *   您正在考虑的选项之间的差异很小（例如，一种算法比另一种准确率高半个百分点）。分组实验可能需要很长时间才能确定哪个微小的变化是最好的。




  ## 关闭智能


  无论你认为自己多么安全，有时事情总会出错，你可能需要快速撤销一项智能变更！


  一种方法是用旧的智能重新部署，覆盖行为异常的新智能。


  另一种方法是在运行时附近保留多个版本的智能——新版本和几个旧版本。如果出现问题，运行时可以加载之前的智能，而无需任何分发延迟（或成本）。


  在以下情况下，支持快速回滚是有效的：


  *   你是人类（因此会犯错）。

  *   部署智能的成本很高。


  在以下情况下，支持快速回滚可能会带来问题：


  *   你试图给某人留下深刻印象，不想让他们觉得你是个懦夫。

  *   你的智能体积庞大，且没有能力在运行时附近存储它的多个副本。


  ## 总结


  智能管理将智能从其创建之处带到其影响用户之处。一个好的管理系统应能非常轻松地部署智能，并使其难以出错。它必须做到以下两点：


  *   对智能进行健全性检查；即执行基本检查以确保智能可用。这些检查包括确保它能在运行时中运行、性能足够好，并且不会犯明显的严重错误。

  *   点亮智能，包括提供控制手段，以便以可控的方式向用户展示智能，观察智能可能的行为，让一小部分用户与之交互——并在出现问题时快速回滚。


  一个成功的智能管理系统将使自信地部署智能变得容易。


  它将通过防止常见错误来帮助智能创建者，同时也让他们能够以可控的方式，根据真实用户的行为来验证其智能的表现。


  一个好的智能管理系统将在其整个生命周期内支持智能服务的运营。


  ## 思考题…


  阅读本章后，你应该能够：


  *   设计一个系统来管理智能系统中的智能。

  *   了解验证智能的方法，以确保其兼容性、在约束条件下工作，并且不会犯明显错误。

  *   准备一系列安全推出智能变更的方法，确保智能按预期工作。


  你应该能够回答如下问题：


  *   为一个智能服务设计一个智能管理系统，该服务的智能每月变更一次。你会构建哪些工具？你会创建哪些设施来向用户推出智能？

  *   现在假设智能需要每天变更两次。你会采取哪些不同的做法？


  '
- '# 15. 智能遥测


  遥测系统负责收集关于用户如何与你的智能系统交互的观察数据，并将部分或全部这些观察数据发送回给你。


  例如，每当发生以下任何情况时，遥测系统可能会收集信息：


  *   用户访问应用程序的特定部分。

  *   用户点击特定按钮。

  *   出现不可接受的长时间加载。

  *   客户端连接到服务器。

  *   服务器检测到格式错误的查询。

  *   服务器内存不足。


  遥测用于验证系统是否按预期工作。在智能系统中，遥测还包含关于用户与智能的交互以及他们所取得结果的信息。这些是智能创建者改进智能所需的信号。


  ## 为何需要遥测


  智能系统中的遥测有三个主要任务：


  1.  确保系统按预期工作。

  2.  确保用户获得预期的结果。

  3.  收集数据以创建更新、更好的智能。


  我们将更详细地探讨每一点。


  ### 确保一切正常


  遥测应包含足够的数据，以确定智能实现是否（或未）正常工作。这应包括：


  *   智能是否在正确的时间流向正确的位置。

  *   运行时是否正确加载和解释智能。

  *   上下文是否在运行时被正确收集。

  *   上下文是否被正确转换为特征。

  *   运行时是否合理且无错误地执行模型。

  *   各种智能源的预测是否按预期组合。

  *   智能的输出是否被正确解释并显示正确的用户体验。

  *   等等。


  这些是你在几乎任何服务或应用程序的遥测中都会包含的内容（并且大多数服务还会希望遥测涵盖更多内容，例如：延迟、正常运行时间、成本和利用率）。


  在智能系统中，这类遥测的一个重要用途是确保智能运行时环境的行为与智能创建环境的行为一致；也就是说，智能是在与其创建时相同的条件下被使用的。这类错误非常难以发现：整个系统在运行，用户在交互，没有输出错误，没有崩溃，但用户的结果却不如预期，因为有时智能只是犯了一些本可避免的额外错误。




  ### 理解成果


  遥测数据应包含足够的信息，用以判断用户是否获得了正面或负面的成果，以及智能系统是否实现了其目标。它应能回答以下问题：


  *   用户会接收到哪些体验，以及他们接收这些体验的频率如何？

  *   用户在每种体验中采取了哪些操作？

  *   哪些体验容易导致用户寻求帮助，或撤销/回退他们的操作？

  *   从用户遇到特定体验到离开应用程序的平均时间是多少？

  *   与系统智能部分交互更多的用户，长期来看是更投入（或更具价值）还是相反？


  这类遥测数据应足以确保：系统的体验能有效将用户与智能连接起来；用户被引导至能获得更好交互的地方；并且用户的行为方式表明他们正在获得良好的成果。


  例如，设想一个帮助医生识别 X 光片中骨折部位的系统。为了帮助理解成果，遥测数据应捕获以下信息：


  *   医生查看系统认为有骨折的 X 光片所花费的时间。

  *   医生查看系统认为没有骨折的 X 光片所花费的时间。

  *   当系统认为有骨折时，医生开具治疗方案的次数。

  *   当系统认为没有骨折时，医生开具治疗方案的次数。

  *   患者因系统标记但医生决定不予治疗的骨折而再次入院接受治疗的次数。


  这类遥测数据应能帮助你了解患者是否因智能系统而获得了更好的治疗效果，并帮助你诊断原因。


  例如，如果智能系统能正确识别非常细微的骨折，但医生并未进行治疗——这是为什么？


  也许患者获得糟糕结果是因为智能系统在细微骨折上频繁出错，导致医生不信任系统的这一部分并忽略了它。


  又或者，患者获得糟糕结果仅仅是因为医生没有注意到试图向他们指出骨折的用户体验——需要让这种提示更醒目。


  关于用户成果的遥测数据应能帮助你识别和调试智能与体验在与用户交互时出现的问题，并采取正确的纠正措施。


  ### 收集数据以增强智能


  遥测数据还应包含增强智能所需的所有隐式和显式用户反馈。


  这包括：


  *   用户针对他们所看到的智能体验而采取的操作。

  *   用户对他们交互过的内容给出的评分。

  *   用户提供的报告。

  *   用户上报的问题。

  *   用户给出的分类。

  *   以及所有表明用户获得良好或糟糕结果的隐式指示。


  更多详情请参阅第 9 章“从体验中获取数据”。


  为了使这类遥测数据有用，它必须包含以下所有内容：


  1.  用户交互发生时的上下文环境。

  2.  智能系统产生的预测以及由此引发的体验。

  3.  用户采取的操作。

  4.  用户获得的结果（无论是隐式还是通过显式反馈）。


  并且，在智能创建环境中，必须能够将单次交互的这四个组成部分相互关联起来。也就是说，必须能够同时找到：特定的交互、用户所处的上下文环境、智能系统做出的预测、用户采取的操作以及用户从交互中获得的结果。


  这类遥测数据是构建一个能够闭环连接使用与智能的系统的关键，它使用户能从与智能的交互中受益，也让智能系统随着用户的交互而不断改进。


  ## 有效遥测系统的特性


  当然，遥测是好的。你想要更多——说真的，智能系统的创建者会想要全部数据。他们会想要每一次交互的每一个细节（无论代价如何）。如果你不给他们，他们很可能会抱怨。他们会问你为什么试图毁掉他们。他们会想知道你为什么试图摧毁他们美丽的智能系统。


  （不是说我就这么干过。我只是说。这有可能发生……）


  本节讨论平衡遥测成本与价值的方法。这些方法包括：


  *   采样

  *   汇总

  *   灵活定位


  ### 采样


  采样是指随机丢弃部分数据的过程。也就是说，如果一天内有 10,000 次用户与系统的交互，一个采样率为 1%的遥测系统将只收集其中 100 次交互的遥测数据（而对其余
  9,900 次交互不收集任何数据）。


  这些采样数据收集成本更低，更易于存储，处理速度更快，并且通常能“足够好地”回答关于系统的关键问题。


  最简单的采样形式是均匀采样。也就是说，无论发生何种类型的事件，都对其中的 1%进行采样。但采样通常针对不同类型的事件采用不同的策略。例如，一种策略可能是：对与验证实现相关的遥测数据采样
  0.01%，对与增强智能相关的遥测数据采样 10%，但来自法国的遥测数据（该地区的智能系统表现不佳）则应以 100%的比例采样。


  定义采样群体的常见方法包括：


  *   按地理区域划分——例如，对欧洲 20%的事件进行采样，对亚洲 1%的事件进行采样。

  *   按用户身份划分——例如，对大多数用户 0.01%的事件进行采样，但对遇到问题的这 10 个用户 100%的事件进行采样。

  *   按结果划分（用户在看到智能体验后做了什么）——例如，对获得正常结果的用户采样 2%，对遇到问题的用户采样 100%。

  *   按上下文环境划分（智能系统触发前用户正在看什么）——例如，对夜间发生的事件采样 10%，对白天发生的事件采样 0.1%。

  *   按用户属性划分（性别、年龄、种族等）——例如，对新用户采样 80%，对长期用户采样 1%。


  一个特别有用的做法是：对 0.1%的用户采样 100%的数据，以便追踪在单个会话过程中出现的问题；同时对 100%的用户采样 1%的事件，以便追踪整体上出现的问题。


  请注意：遥测系统必须记录收集每条遥测数据时所使用的采样策略，以便智能创建者能够针对采样方法进行校正，并在使用遥测数据时产生准确的结果。




  ### 汇总


  另一种减少遥测数据的方法是汇总。即，获取原始遥测数据，对其进行一些聚合和过滤，然后存储一个规模小得多的数据摘要。


  例如，假设你想知道每天有多少用户撤销了一个自动化操作。你可以保留原始遥测数据，并在需要时计算这个数量。或者，你也可以每天计算一次这个数量，保存结果，然后删除原始遥测数据。原始遥测数据的大小会随着使用量增长（并且可能变得非常庞大）；而一个计数的大小是恒定的，无论你有多少用户。


  汇总对于理解系统的工作方式以及是否达成目标非常有效。随着你对系统的了解加深，并识别出关键的汇总指标，你可以随着时间的推移传输和保留越来越少的原始遥测数据。


  汇总可以在客户端或服务端进行。


  要执行**客户端汇总**，客户端只需在一段时间内收集遥测数据，在数据到达时进行聚合，并定期将汇总结果报告给遥测服务器（在那里可能会与其他客户端的聚合结果合并）。


  当带宽是成本的主要驱动因素时，客户端汇总非常有用。


  当遥测数据的带宽是免费的（它是客户端访问服务端智能的副产品）或者存储是主要的成本驱动因素时，服务端汇总非常有用。在这种情况下，可以定期运行一个汇总任务来提取所有相关的测量值。完成后，原始数据将被清除以节省空间。


  ### 灵活的目标定位


  一个系统中存在多种类型的遥测数据；有些类型的价值高于其他类型，并且特定类型遥测数据的价值会随时间变化。


  例如，在系统开发的早期，在所有代码都能正常工作之前，关于实现细节（如功能、模型部署等）的遥测数据可能极其有用。但一旦系统经过验证并部署给用户，且成功运行数月后，这类遥测数据就变得不那么有用了。


  而一旦系统开始吸引大量用户，有助于提升智能的遥测数据就变得更加重要：它捕捉了用户交互、判断和偏好的全部价值。在智能提升的过程中，这类遥测数据是系统的核心价值，是取得成功的关键。


  一旦智能水平达到平台期（如果确实如此），额外的训练数据可能变得不那么有价值，而关于用户结果或罕见问题的遥测数据可能变得相对更重要。


  但当出现问题时，所有常规情况都不再适用，来自系统各处的遥测数据对于发现和纠正问题可能至关重要。


  一个智能遥测系统应支持针对不同类型遥测数据的不同采集策略，并且这些策略应该能够相对快速和容易地更改——以便编排者和智能创建者能够完成他们的工作。


  ## 常见挑战


  本节讨论一些常见的数据陷阱，以及遥测系统在处理这些问题时可以发挥的作用。这些包括：


  *   偏差

  *   罕见事件

  *   遥测数据的间接价值

  *   隐私


  ### 偏差


  当某种类型的事件在遥测数据中出现的频率高于其应有频率时，就会产生偏差。例如，假设你获得了 10,000 个用户与你的智能系统内容交互的样本。一万是个不错的数字。这应该足以理解发生了什么，并创建一些良好的智能。


  但如果你发现这 10,000 次交互都是针对同一份内容呢？比如 10,000 个不同的用户与同一篇新闻报道进行交互？


  嗯，那就不太好了。


  或者，如果你发现这 10,000 个样本都来自同一个与系统交互的用户呢？由于某种原因，遥测系统决定反复只采样这一个用户。


  那同样也不好。


  以下是可能产生偏差的一些原因：


  1.  世界在变化，但采样策略没有。你设定了一个采样策略，选择 1,000 个用户进行 100% 的采样（以便你能看到端到端的交互）。然后你的用户群增长了 10
  倍，并且发生了显著变化，包括了更多非技术用户、其他国家的用户等等。最初选择的 1,000 个用户在你选择他们时可能是合适的，但他们已不再能代表你的用户群体——这导致了偏差。

  2.  用户的行为方式出乎你的意料。例如，一个体验不佳的用户可能直接关闭了电脑。如果你的遥测系统期望他们在发送遥测数据之前先关闭应用程序，你可能会错过他们的数据。


  处理偏差的一种方法是始终在所有使用情况中收集一个原始样本——例如，所有交互的 0.01%——并交叉检查你的其他样本，以确保它们与这个基线样本没有显著差异。


  ### 罕见事件


  在某些情况下，许多事件都是罕见事件；少数情境很突出，但你的用户遇到的大多数情境都不常见。


  例如，在一个图书馆里，最受欢迎的 100 本书可能占了借阅量的 50%，但在这 100 本书之后，使用情况变得高度分散，有成千上万本书每月只有一两次借阅。当一本书被拿到借阅台时，有
  50% 的几率是热门书之一，也有 50% 的几率是其他两万本书中的一本。


  想象一个帮助推荐这个图书馆书籍的系统。


  为了推荐一本书，系统需要了解它通常与哪些书一起被借出。但任何一对很少被使用的书同时被借出的几率非常非常低。


  例如，如果遥测数据是通过对 10% 的借阅事件进行采样生成的，那么一个月后你可能得到：


  *   10,000 个关于前 100 本热门书被借出的样本。

  *   5,000 本书只有一两次借阅事件。

  *   15,000 本书完全没有借阅事件。


  这不太理想。这类数据可能帮助你为热门书籍构建推荐（这很简单，而且你手动做可能便宜得多），但它不会给你任何关于冷门书籍的信息。


  一种选择是分层抽样。也许前 100 本热门书以 1% 的比例采样，而其余（冷门）书籍以 100% 的比例采样。数据量可能与对所有书籍使用统一的 10% 采样率相似，但对于生成该系统需要产生的智能类型而言，数据的价值可能要大得多。


  ### 间接价值


  通常很难量化遥测数据的价值，但很容易量化其成本。理性的人会提出这样的问题：


  *   我们能否将这类特定数据的采样率从 10% 降低到 1%？

  *   我们能否停止收集那些我们从未计划为其添加任何智能的用例的遥测数据？

  *   我们真的需要存储 90 天的历史数据吗？30 天够不够？


  这些都是合理的问题，而且很难回答。以下是一些可能有帮助的方法：


  1.  保留所有活动的一个非常小的原始样本，足以用来进行研究以估算其他遥测数据的价值。

  2.  使遥测数据的开启和关闭变得容易，这样智能编排者可以快速提高遥测数据量来追踪特定问题，智能创建者可以短期尝试新方法，看看它们是否值得投入成本。

  3.  为创新设定一个合理的预算，并愿意为潜在价值买单，而无需微观管理每一个具体细节和成本。




  ### 隐私


  隐私，啊，隐私。


  在使用客户数据时，重要的是“做正确的事”，并以你希望他人对待你数据的方式来对待用户的数据。请牢记以下最佳实践：


  *   确保客户理解他们从你的产品中获得的价值，并感到物有所值。

  *   尽可能清除你存储的遥测数据中的任何个人信息（如姓名、信用卡、社保号、地址、用户生成内容等）。

  *   对于你打算长期存储的数据，考虑采用聚合策略，将多个用户的信息合并，以增加识别单个用户数据的难度（例如，存储每篇内容的聚合访问量，而不是存储每个用户浏览了哪些内容）。

  *   制定合理的保留策略，不要将数据保留过长时间。

  *   确保遥测数据得到最高级别的保护，防止黑客攻击和意外泄露。

  *   确保客户知道你存储了哪些数据，以及如何选择退出。

  *   仅将数据用于收集时的目的，不要试图将其重新用于截然不同的活动。

  *   确保你了解服务运营所在国家的适用法律。


  但请记住：你需要数据——没有数据，你无法创造智能……


  ## 总结


  良好的遥测技术对于构建有效的智能系统至关重要。这是无法绕开的：没有遥测技术，你就无法拥有智能系统。


  遥测技术主要用于三个目的：


  1.  确保系统按预期方式运行——不存在任何错误或问题。

  2.  确保用户获得你期望他们获得的结果——一切协同作用，走向成功。

  3.  随着时间的推移增长智能——以可用于创造智能的方式记录上下文和结果。


  这些类型遥测技术的价值会随时间变化，系统应能够适应。一个好的遥测系统应具备以下特点：


  *   支持采样，既能追踪特定的重点问题，也能查看聚合效果。

  *   允许对事件进行汇总。

  *   在测量内容（以及不测量什么）上保持灵活。


  遥测技术的一些常见陷阱包括：


  *   偏差导致遥测数据无法代表用户的真实体验。

  *   重要但极难在采样遥测中捕获的罕见事件。

  *   在面对关于相关成本的合理质疑时，证明遥测技术的价值。

  *   在保护用户隐私的同时，仍允许智能增长。


  ## 思考题……


  阅读本章后，你应该能够：


  *   理解遥测技术如何通过确保系统正常运行、实现其目标，并允许其在被使用过程中不断改进，从而赋能智能系统。

  *   能够设计满足应用程序需求的遥测系统。


  你应该能够回答如下问题：


  设想一个你认为你的朋友会喜欢使用的智能系统。


  *   如果收集所有可能的遥测数据成本过高，你将如何限制实际收集的遥测数据？

  *   当出现特定问题时，你需要哪些工具来进行深入分析？


