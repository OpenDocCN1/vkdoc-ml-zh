- "# 9. 从体验中获取数据\n\n智能创造者可以处理各种数据，甚至包括糟糕的数据。但当他们拥有优质数据时，工作会轻松得多——他们所能创造的智能潜力也更大。理想的智能体验应能控制用户与智能系统之间的交互，使得这些交互记录易于生成高质量的智能。\n\
  \n在探讨如何设计智能体验以从用户处获取数据之前，我们先考虑另一种选择：你可以自行收集数据。传统上，机器学习系统有一个数据收集阶段。也就是说，如果你想构建一个用于统计图片中奶牛数量的智能系统，你需要外出拍摄大量奶牛照片。你要从一个农场奔波到另一个农场，在不同场景下拍摄奶牛。你要摆弄奶牛姿势，拍到它们好看的一面和不好看的一面；拍到它们的脸和……其他部位。你要拍摄灌木丛后的奶牛。你要拍摄躺着的、奔跑的、吃草的、睡觉的、打哈欠的奶牛，在晴天、阴天、夜晚……一个传统的计算机视觉系统可能需要数万张不同的奶牛照片。而且照片越多，效果越好——数十万甚至数百万张可能更有帮助。一旦你收集了所有这些数据，还需要进行标注。也就是说，你要花钱请很多人查看所有奶牛照片，并在所有奶牛周围画圈——这很有趣！\n\
  \n这种做法可能非常昂贵。数据收集和标注可能是传统机器学习系统的主要成本。因此，设计能够利用用户及其与智能系统的交互来生成具有正确属性的数据以创造智能的体验，具有巨大价值。做好这一点，就能在许多原本因手动数据收集成本过高而无法使用智能和机器学习的场景中应用它们。\n\
  \n本章首先通过一个例子说明从体验中收集数据的含义，以及不同方法如何影响最终数据的质量。接着，我们将探讨使数据适合智能创造的属性，以及一些用于捕获用户对数据的结果（或意见）的选项。\n\
  \n## 示例：TeamMaker\n\n让我们考虑一个例子：一个旨在为篮球联赛创建队伍的智能系统——我们称之为 TeamMaker。每个球员都被录入系统，并附带一些基本统计数据：身高、经验、擅长的位置，也许还有投篮水平的信息。然后系统将球员分成若干队伍。如果队伍实力均衡，联赛就会充满乐趣。如果队伍实力失衡，联赛可能会变得乏味。一支队伍总是赢，其他所有人都会觉得自己是失败者。纷争开始，街头暴乱，歇斯底里……\n\
  \n所以我们最好把它做对。\n\n我们需要构建一种体验，收集关于系统所创建队伍的有用反馈，以便智能系统能够随着时间的推移不断改进（并推荐更好的队伍）。\n\n\
  ### 简单的交互\n\n一种方法是让用户纠正队伍分配，并利用这些纠正来改进智能系统。\n\n例如，TeamMaker 可能会生成“建议队伍”作为起点。这些建议可以呈现给一个人——联赛专员——来纠正任何问题。也许智能系统搞错了，把所有最好的球员都放在了一支队伍里。那么专员可以介入，将一些球员调换位置。每次专员调换一名球员，TeamMaker\
  \ 就获得一次训练数据，使智能系统变得更好。经过几个赛季，智能系统可能会变得非常好，以至于专员不再需要做任何调整。\n\n但说实话，这个篮球队伍创建系统听起来相当糟糕。谁想用一个工具来组队，结果还得手动调整呢？如果专员不提供任何对队伍的纠正，这种方法可能会失败，因为：\n\
  \n*   这听起来很无聊。\n*   他们没有信心能战胜机器。\n*   他们实际上不懂如何打篮球，所以做出的纠正反而让情况更糟。\n*   他们离线进行纠正，懒得将其输入到\
  \ TeamMaker 中。\n\n缓慢或不规律的交互会限制智能系统成长的速度，并限制其最终潜力。一个好的体验会设置那些能为用户提供明显价值、并且用户能够很好地完成正确的交互。\n\
  \n### 让它变得有趣\n\n另一种方法是让使用与智能之间的联系变得更有趣。让用户真正想去做，并且有动力去做对的事情。\n\n例如，TeamMaker 可以创建队伍，同时也可以支持投注。大多数下注的人都想赢（因为大多数人关心钱），所以他们会试图押注最好的队伍——并避免押注明显的输家。因此，TeamMaker\
  \ 可以利用投注的分布情况来判断自己构建队伍的工作是否做得好。如果投注严重偏向（或远离）某支队伍，TeamMaker 就能了解到自己使用了错误的因素来平衡队伍。下次它可以做得更好。\n\
  \n这种基于投注的交互是对基于队伍调整的交互系统的改进，应该能带来每个赛季更多的数据、更多改进智能系统的机会，并且应该能更快地产生一个更好的智能系统。\n\n\
  但基于投注的交互产生的数据并不完美。例如，有些人可能只为自己支持的队伍下注，即使他们明显赢不了。或者下注者根本不懂篮球，只是为了在办公室里友好地竞争而投注。（或者投注是非法的或违背你的道德准则，因此作为开发者你根本不想在\
  \ TeamMaker 中使用基于投注的交互……）这类问题可能导致偏差，而偏差会使智能系统误入歧途。当智能系统从有偏差的投注数据中学习时，最终生成的队伍将不会针对创建竞争性联赛进行优化，而是针对……其他东西进行优化。\n\
  \n当用户的目标与智能系统的目标不同时，他们交互产生的数据可能会产生误导。一个好的体验会将用户的使用与智能系统的目标对齐，以获得对成功的无偏观察。\n\n###\
  \ 连接结果\n\n另一种方法是将智能系统直接与结果挂钩。不需要人为判断，只需要事实。当一支队伍赢得每一场比赛时，智能系统就知道自己做错了。当所有比赛都比分接近时，智能系统就能了解到自己做对了。\n\
  \n要使这种方法奏效，必须有人有动力将所有比分输入 TeamMaker。所以也许 TeamMaker 围绕这一点创建一些有趣的功能，比如与投注系统集成、排行榜或赛程安排。人们可能会在每场比赛结束后挤在电脑前，只是为了看看排名如何变化，谁赢了钱，谁丢了面子。\n\
  \n随着比赛的进行，用户输入关于哪些队伍赢了、哪些比赛比分接近、哪些是一边倒的数据，TeamMaker 就拥有了改进智能系统所需的一切。如果有一支队伍从未输过，它可以了解那支队伍的特殊之处，并在未来避免这种情况。下个赛季，TeamMaker\
  \ 会做得更好，创建出更可能实力均衡、更不可能出现无敌（或毫无希望）队伍的比赛。\n\n当体验能够直接追踪期望的结果时，它就能产生最有用的智能。\n\n\n\n\
  ## 优质数据的特性\n\n为了解决困难、庞大、开放且随时间变化的问题，你需要数据——大量的数据。但并非任何数据都适用。要构建智能，你需要具备特定属性的数据。最佳数据应具备以下特点：\n\
  \n*   包含交互的上下文、所采取的任何行动以及结果。\n*   能够充分覆盖用户希望使用智能系统完成的操作。\n*   反映与系统的真实交互（而非关于用户可能如何互动的猜测或调查）。\n\
  *   偏差极少（或没有偏差）。\n*   避免反馈循环，即智能影响数据，数据又影响智能，进而再次影响数据……\n*   数据量足够大，与问题相关。（为困难问题创建智能可能需要海量数据。）\n\
  \n要同时实现所有这些特性并非易事。事实上，除非你在设计中明确处理每一个特性，否则你不太可能获得有效创建智能所需的数据。\n\n### 上下文、行动与结果\n\n\
  从数据中创建智能的基本要求是了解：\n\n1.  智能被调用时正在发生的上下文。\n2.  由此采取的任何行动。\n3.  交互的结果，特别是结果是积极的还是消极的。\n\
  \n例如：\n\n*   自动驾驶汽车需要知道车上所有传感器看到的内容（上下文）、人类驾驶员在该情况下可能采取的行动（行动），以及汽车最终是发生碰撞还是被鸣笛（结果）。\n\
  *   图书推荐系统需要知道用户已读过哪些书以及他们有多喜欢这些书（上下文）、可能向该用户推荐哪些书、用户是否购买了其中任何一本（行动），以及用户最终喜欢哪些书（结果）。\n\
  *   反恶意软件系统需要知道用户下载了哪个文件以及从何处获取（上下文）、用户是否安装了该文件（行动），以及用户的机器最终是否被感染（结果）。\n\n理想的智能体验会创造具有足够上下文的情境，以便为用户和智能系统做出良好决策。例如：如果自动驾驶汽车除了速度计之外没有任何传感器，那么了解用户对方向盘的操作也无济于事——仅凭速度，任何智能都无法学会如何转向。\n\
  \n### 良好的覆盖范围\n\n数据应包含智能系统需要运行的所有情况的观测记录。例如：\n\n*   如果系统需要自动控制灯光，数据应包含控制灯光的上下文、行动和结果：\n\
  \    *   白天。\n    *   夜晚。\n    *   冬季。\n    *   夏季。\n    *   夏令时期间。\n    *   对于频繁使用的灯光。\n\
  \    *   对于很少使用的灯光。\n    *   等等。\n*   如果灯光需要在全球 50 个不同国家正常工作，数据应包含来自这 50 个国家在所有上述情况下的观测记录。\n\
  *   如果系统需要在矿井中工作，数据应包含矿井中使用灯光的观测记录。\n*   如果系统需要在空间站上工作，数据应包含空间站中使用灯光的观测记录。\n\n在未经训练（或评估）的情境中运行的智能系统很可能会犯错，而且是严重的错误。\n\
  \n智能系统在其生命周期内将被期望在新的上下文中工作。总会有新的书籍、电影、歌曲、网页、文档、程序、帖子、用户等等。一个有效的智能体验应能自信地将用户置于这些新情境中，同时确保在收集数据过程中所犯的错误成本较低，且所收集数据的价值较高。\n\
  \n### 真实使用\n\n最佳数据来自用户执行他们真正关心的事情。例如：\n\n*   在汽车模拟器中驾驶的用户可能会做出他们在真实驾驶时（当生命受到威胁时）不会做出的决定。\n\
  *   告诉你他们喜欢什么书的用户可能会谈论文学经典（因为他们想给你留下好印象），但他们可能从未真正读过那些书。\n*   当被问及某个文件安装在实验室电脑上还是母亲电脑上是否安全时，用户可能会给出截然不同的答案。\n\
  \n将真实用户与他们关心的交互联系起来，可以确保所得数据是诚实的，并且基于这些数据构建的智能最有可能为用户提供他们真正想要的东西。\n\n### 无偏差\n\n\
  当体验影响用户交互的类型，或影响用户提供反馈的类型时，就会产生偏差。\n\n偏差的一个常见来源是不同类型的结果被报告的频率不同。\n\n以垃圾邮件过滤程序为例。如果一封垃圾邮件进入了用户的收件箱，它就直接呈现在用户眼前。用户很可能会注意到它，并可能按下“这是垃圾邮件”按钮，从而为不良结果生成有用数据。另一方面，如果过滤器删除了个人邮件，用户可能永远不会注意到。\n\
  \n在这种情况下，设计体验时所做的选择引入了偏差，使得所得数据对构建智能的用处大大降低。\n\n偏差的另一个潜在来源是，对交互有强烈情绪（无论是好是坏）的用户比持中立意见的用户更有可能提供反馈。\n\
  \n偏差的另一个来源是体验鼓励用户选择某些选项而非其他选项。例如，当体验以列表形式呈现选项时，用户更有可能选择列表中的第一项（并且极不可能选择列表中根本没有的选项）。\n\
  \n### 不包含反馈循环\n\n体验和智能会相互影响，有时会产生负面影响。\n\n例如，如果用户体验的某个部分变得更加突出，用户就会更多地与之交互。如果智能从这些交互中学习，它可能会认为用户更喜欢这个行动（而实际上用户并非更喜欢，只是由于用户体验的改变而更多地注意到了它）。\n\
  \n相反，如果智能犯了一个错误，开始抑制用户喜欢的某个行动，用户将不再看到该选项。他们将停止选择该行动（因为他们无法选择）。该行动将从数据中消失。智能会认为用户不再喜欢这个选项。但这是错误的……\n\
  \n以下是处理反馈的一些方法：\n\n*   在记录的数据上下文中包含用户所看到的内容。如果一个选项的字体比另一个大，请在上下文中记录下来。如果某些选项被抑制，请在上下文中记录下来。\n\
  *   在用户看到的内容中加入一些随机化，例如切换某些选项的顺序。这有助于在更广泛的情境中收集数据，并有助于识别可能发生的反馈。\n*   在上下文中记录用户选择该选项所付出的努力。例如，如果用户不得不手动发出命令（因为该命令在智能体验中被抑制了），智能应该知道它犯了一个代价高昂的错误。如果用户不得不浏览许多页面内容才能找到他们想要的选项，智能也应该知道。\n\
  \n\n\n### 规模\n\n为了取得进步，必须使用智能系统。这意味着智能体验必须突出、使用起来有趣、易于找到，并且是用户经常做的事情。\n\n考虑两种选择：一个新的智能系统和一个成熟的智能系统。\n\
  \n新的智能系统可能不会有太多用户。这意味着智能体验必须成为用户所做事情的核心，这样他们才会定期与之互动。在这种情况下，智能体验需要鼓励互动，使其变得有趣，甚至可能彻底改变整个产品，将智能交互置于最前沿和中心位置。\n\
  \n成熟的智能系统会有更多的使用量。这意味着智能体验可以更加微妙。它们可以放在用户较少看到的地方。这并不意味着它们价值更低——它们可能正在解决非常重要的问题，但这些问题用户是每周或每月遇到一次，而不是每天。\n\
  \n作为背景参考，一个系统：\n\n*   每天产生数十次交互，对于验证或改进智能基本无用。\n*   每天产生数百次交互，可能可以验证智能并产生一些简单的智能。\n\
  *   每天产生数千或数万次交互，肯定可以验证智能系统，并为许多困难的、开放性的问题产生智能。\n*   每天产生数十万或数百万次交互，可能拥有大多数任务所需的所有数据。\n\
  \n一个有效的智能体验会吸引用户并让他们参与其中，为收集数据和产生有趣的智能奠定基础。\n\n## 理解结果的方法\n\n当用户与智能之间发生交互时，通常不容易理解结果是积极的还是消极的。例如，在音乐推荐系统中——用户按下“下一首”按钮是因为他们讨厌这首歌（智能判断错误），还是因为他们看到下一首歌即将播放并且非常喜欢那首歌（智能判断正确）？\n\
  \n最好的智能体验被设计成能够隐式地明确结果——也就是说，不依赖于用户除了使用产品之外的任何操作。但这并不总是可能的。即使可能，设置一个备用方案来确保隐式数据具有创建智能所需的所有正确属性也是有用的。理解结果的方法包括：\n\
  \n*   隐式观察\n*   用户评分\n*   问题报告\n*   升级投诉\n*   用户分类\n\n许多大型智能系统会使用所有这些方法来尽可能多地了解用户所获得的结果。\n\
  \n### 隐式结果\n\n理想的体验会在不需要用户任何特殊操作的情况下产生良好、有用的数据。用户只需使用系统就能产生数据，而这些数据将具备增长智能所需的所有属性。\n\
  \n例如，当用户将恒温器设置为 72 度时，他们希望智能做什么就非常清楚了。或者当用户购买一件产品或一些内容时，很明显他们对此感兴趣。\n\n通常很难确切知道如何解读用户的操作。用户可能不会花时间做出完美的决定，因此数据呈现给他们的方式可能会使结果产生偏差。例如，他们可能选择了五部推荐电影中的一部，因为那部电影在当时对他们来说是绝对最好的——或者因为他们不想再看更多选项了。\n\
  \n正因为如此，实现一个完全隐式的数据收集系统相当困难，需要仔细协调和限制体验，以便能够有效地解读使用情况。\n\n### 评分\n\n用户评分和评论可以是非常好的数据来源。例如，设计允许用户进行以下操作的体验：\n\
  \n*   用 1-5 星评价他们消费的内容。\n*   对特定交互给予“赞”或“踩”。\n*   留下一些关于他们体验的简短文字描述。\n\n用户习惯于留下评分，许多用户也喜欢这样做，感觉自己在帮助他人或个性化自己的体验。\n\
  \n但评分也存在一些挑战：\n\n1.  用户并不总是对所有内容进行评分。他们可能觉得不想费这个力气。\n2.  交互和评分之间可能存在时间差。用户可能不记得确切发生了什么，或者他们可能没有将结果归因于那次交互。\n\
  3.  评分可能无法捕捉到智能正在优化的目标。例如，考虑这两个问题：这本书有多好？昨天向你推荐这本书是正确的吗？\n4.  评分在不同用户群体之间存在差异——一个国家的五星与另一个国家的五星含义不同。\n\
  5.  不频繁的交互不会获得很多评分，并且难以从中学习。\n\n### 报告\n\n体验可以允许用户报告出现了问题。例如，许多电子邮件系统都有一个“报告为垃圾邮件”按钮，用于处理进入收件箱的垃圾邮件。\n\
  \n通过报告收集的数据存在明显的偏差，因为它只捕捉到了不好的结果（当智能犯错时），而且用户不会报告每一个问题。例如，用户可能只对他们看到的 10%的垃圾邮件点击“报告为垃圾邮件”，而忽略或删除其余的垃圾邮件。\n\
  \n正因为如此，来自报告的数据很难作为创建智能的唯一来源。然而，报告在验证智能和调整体验以控制不良智能的负面影响方面可能非常有效。\n\n### 升级投诉\n\n\
  升级投诉是一种成本高昂的报告形式，发生在用户感到非常不满并联系客户支持（或访问支持论坛等）时。升级投诉类似于报告，但超出了主要产品体验的范围。它们通常代表着非常不满的用户和重要的错误。\n\
  \n升级投诉往往杂乱无章且缺乏重点。遇到问题的用户并不总是知道系统的哪个部分导致了问题。他们不会像其他报告问题的用户那样用相同的术语来表达问题。\n\n正因为如此，梳理升级投诉并利用它们来改进智能可能既困难又昂贵——它们更适合于识别重大问题，而不是用于优化系统。\n\
  \n总的来说，最好允许用户在上下文中报告问题（在问题发生时提供内联报告体验），这样系统就能捕获导致不良结果的相关上下文和操作。\n\n### 用户分类\n\n\
  你可以简单地通过特定的（精心控制的）问题，在用户与系统交互的上下文中询问他们的结果。有点像调查。想象一下：\n\n*   使用一个灯光自动化系统，每三个月它会说：为了改进我们的产品，我们想知道——现在你希望灯是开着还是关着？\n\
  *   使用一个照片编辑程序，在修饰了一百张照片后，它说：请帮助改进这个程序。你正在处理的图像中有人脸吗？\n\n分类可以产生非常聚焦的数据来改进智能。它也可以做到不引人注目，例如通过限制问题：\n\
  \n*   每千次交互只问一个问题。\n*   只问那些自愿提供帮助的用户。\n*   只问那些没有注册高级服务的用户。\n*   等等。\n\n\n\n##\
  \ 摘要\n\n智能体验在获取数据以促进智能增长方面扮演着关键角色。如果一项智能体验没有明确设计为能产出优质数据以构建智能，那么它几乎必然会产出低质量（甚至无用）的数据。\n\
  \n当用户频繁与智能交互、在交互中感知到价值，并且拥有足够信息做出正确决策时，体验便能产出更优质的数据。\n\n数据在满足以下条件时最为有用：\n\n*   包含交互的上下文、所采取的行动以及结果。\n\
  *   充分覆盖智能系统可能被使用的所有场景。\n*   代表真实使用情况，即用户真正关心的交互。\n*   包含无偏差的数据。\n*   包含足够的信息来识别并打破反馈循环。\n\
  *   针对问题的复杂程度，能产出有意义的足够数据量。\n\n最有效的数据来源于隐式交互，即用户通过使用产品自然地表达其意图和对结果的看法。\n\n当隐式交互不足以获取数据时，理解结果的其他方法包括：\n\
  \n*   允许用户对内容或交互进行明确评分。\n*   允许用户直接从用户体验中报告问题。\n*   为用户提供支持渠道，以报告重大、代价高昂的问题。\n*\
  \   要求用户回答特定精简的问题（不频繁进行）。\n\n许多智能系统会综合使用所有这些方法。它们的大部分数据可能来自隐式交互，但也会利用其他技术进行监控，以确保隐式数据的高质量（尚未开始产生偏差或反馈循环）。\n\
  \n打造一种既能产出优质数据又不给用户带来负担的体验是困难的——而这对于构建优秀的智能系统至关重要。\n\n## 思考题…\n\n阅读本章后，你应该能够：\n\n\
  *   知道如何设计体验，以收集评估和提升智能所需的数据。\n*   理解从用户处收集这些数据的各种选项，范围从无需用户明确操作到需要用户深度参与。\n\n你应该能够回答如下问题：\n\
  \n*   想一个你经常使用、似乎完全通过隐式方式收集数据的智能服务。如何改变它，以利用用户的分类信息？\n*   设想一个能辅助你最爱爱好的智能系统。当它出错时，想出一种隐式收集“优质数据”的方法。再想另一种方法，在相同情境下收集数据，但能表达用户对错误的不同解读（例如，可能智能本身是正确的，但用户出于其他原因不想执行建议的操作）。\n\
  \n"
- '# 10. 验证智能体验


  智能体验失败主要有两个原因：


  1.  因为实现方式有误：体验存在缺陷、令人困惑，或无法帮助用户达成目标。

  2.  因为智能判断有误：推荐了错误的自动化操作，对不真实的事情过于确信，或提出了错误的信息排序。


  例如，一个智能体验可能：


  *   展示一张包含人脸的照片列表，但遗漏了用户婚礼上最喜爱的那张照片。照片被排除是因为体验有缺陷？还是因为智能未能识别出该照片中有人脸？

  *   在房间已经有些暗的时候关灯。关灯是因为智能知道太阳即将升起（尽管它知道房间太暗）？还是因为智能认为房间内无人？

  *   用户讨厌恐怖片，但系统却推荐了大量恐怖片。这是因为用户的丈夫在某个隐藏菜单中设置了偏好，要永远、无论如何都隐藏所有浪漫喜剧片？还是因为智能分析了影片后，认为它们是冒险片而非恐怖片？


  将智能体验的功能是否正常与智能本身的质量分开验证，对于打造有效的智能体验至关重要。


  ## 获取预期体验


  所以，智能可能正确，也可能错误；这没问题。但系统的其余部分表现如何？


  *   当智能正确时，用户是否获得了预期的体验？

  *   体验是否确实有助于实现用户（以及系统）的目标？

  *   随着系统和智能的演进，体验是否仍能保持有效？


  本节将讨论如何将体验与智能系统中可能发生的其他变化隔离开来，以便为验证提供基础。




  ### 处理上下文


  上下文代表了智能体验被触发时智能系统的状态。它可以包含智能体在做出决策时可能考虑的所有变量。同时，也应包含那些影响用户如何解读系统输出以及如何做出反应的变量。例如：


  *   计算机视觉系统中的上下文可能包括环境光照、摄像头属性、用户及其特征（种族、性别、衣着）等。

  *   音乐播放系统中的上下文可能包括用户对歌曲的评分、用户拥有的歌曲列表、近期播放历史等。

  *   家庭自动化系统中的上下文可能包括传感器的数量和类型、它们所在的房间、彼此之间的距离等。


  当你想要验证某个智能体验在特定上下文中是否正常工作时，你需要创建该上下文并进行尝试。例如，你需要以完全正确的方式设置计算机视觉系统来重现该上下文，调整好光照，找来同样的用户，让他们站在摄像头前，并让他们以完全正确的方式微笑，等等。


  这可能会带来问题。尤其是对于那些庞大、开放且拥有无数种可能上下文（数量无限）的问题。


  在验证智能体验时，借助一些工具来生成（或捕获）重要的上下文、探索它们，并在智能体验中重放它们，以便在智能系统演进过程中反复测试，会非常有帮助。一些处理上下文的方法包括：


  *   手动生成上下文，方式与用户相同：使用系统、创建账户、建立交互历史、浏览到正确位置等。这可能极具挑战性且容易出错，因为上下文可能非常微妙；例如，与计算机对话时语调的变化会影响语音识别系统的性能。上下文也可能非常庞大——例如，长时间的使用历史。

  *   通过编辑器或其他工具来构建上下文，这些工具允许创建、编辑、捕获上下文，并将其回放给系统。例如，一个工具可以指定房屋布局、传感器位置以及特定时间传感器上的各种读数。这些工具的复杂程度和自动化水平各不相同，但这类工具对于建立基线验证非常有帮助。

  *   通过实验室环境或实际用户的使用来记录上下文。例如，允许系统随时转储上下文，并创建工具来加载这些转储文件，并针对智能体验和智能体的更新版本进行评估。这类方法有助于将实际使用情况和大量多样性引入验证过程。


  在验证智能体时，最好能拥有所有这些选项。一个典型的工作流程可能如下所示：


  *   重现用户报告的问题。

  *   捕获导致该报告的确切上下文。

  *   在某种工具中查看上下文，以了解真实情况（而不仅仅是用户抱怨的部分）。

  *   对体验进行修改。

  *   再次执行该上下文，以查看修改是否能解决问题。

  *   将问题传达给智能体创建者（但他们可能能够提供帮助，也可能无法提供帮助）。


  请注意，用于验证体验的上下文与创建智能体所需的数据相似，但有所不同。要创建智能体，你还需要捕获关于结果的信息。但仅凭上下文本身就能帮助验证（并改进）体验。


  ### 处理智能体


  追踪和重放上下文的工作流程，与追踪和修复其他复杂软件产品中的错误类似。但智能体的变化会使这一过程变得困难。这是因为用户看到的体验是特定上下文与特定智能体相结合的结果——而智能体是会变化的。


  因此，拥有一个已知智能体的集合也很有帮助，可以将它们与已知上下文结合以查看结果。一些有助于验证的智能体获取方法包括：


  *   **实时智能体**：即用户将看到的智能体。如果一切顺利，这将是最准确的可用智能体，也是验证用户实际所见的最佳方式。但它也可能变化得非常快（随着智能体的演进），这就需要一些工作来区分智能体变化与体验变化。这可能导致的一个问题是：你正在努力修复一个体验问题，然后……它消失了。你还没有做任何修改，但也许底层的智能体发生了变化，导致你无法再重现该问题。

  *   **固定智能体**：每次执行时都保持不变的智能体。例如，对实时系统智能体的某个检查点（比如 Alpha 测试的第一天，或每个月的第一天）。这种智能体与实时智能体类似，但提供了一个稳定的基线，可用于在较长时间内处理体验问题。

  *   **简单智能体**：具有一定可解释性的智能体。例如，不使用机器学习产生的模型，而是使用一小套启发式规则。这在调试问题时很有用——智能体足够智能以引发有趣的问题，但又不会复杂到让智能体自身的错误掩盖了体验问题。

  *   **傻瓜智能体**：无论提供什么上下文，都始终给出相同答案的智能体。例如，无论用户喜欢什么乐队，智能体都推荐“恐怖海峡”乐队。傻瓜智能体有助于排除明显的体验问题。


  在验证智能体时，最好能拥有所有这些选项。


  ### 整合起来


  需要寻找的常见错误类型包括：


  *   智能体错误地解读了上下文，导致意外的输出。

  *   体验错误地解读了智能体，导致系统性的错误体验。

  *   对于某些上下文和智能体的组合，用户界面的渲染不正确，导致结果难以理解、不美观或无法辨认。




  ## 实现目标


  体验在实现系统目标中扮演着至关重要的角色。


  通过呈现智能、决定用户看到它的方式和频率、决定它的颜色、显示位置、出现频率，以及描述它所使用的文字或图标，体验可以将低质量的智能转化为有用的工具；体验也可能让高质量的智能变得毫无用处。


  考虑一个旨在保护用户免受网络诈骗的系统。如果用户访问了一个被智能判定为诈骗页面的网站，体验会以某种方式向用户发出警告。


  如果智能是完美的，警告可以非常强硬（例如阻止访问该页面，且不给用户任何申诉途径），但智能永远不完美，因此警告需要平衡用户被骗的风险与用户被吓跑、不敢访问他们实际想去的网站的风险。


  那么，我们如何验证特定体验的有效性呢？


  这可以通过将智能的任务与体验的任务分离开来实现。


  智能的任务是标记诈骗网站。它可能正确，也可能错误。


  体验的任务是：


  1.  当智能正确标记出诈骗时，成功阻止用户被骗。

  2.  当智能错误地将非诈骗网站标记为诈骗时，最小化对用户造成的损失。


  因此，这些是需要衡量的属性，以验证体验是否在履行职责：


  *   正确收到警告的用户中，仍然被骗的比例是多少？

  *   错误收到警告的用户中，因此放弃访问合法网站的比例是多少？


  更一般地说，对于智能的每一种可能结果——所有它可能正确的方式和所有它可能错误的方式——都要考虑在该情境下体验的角色是什么，并对其进行衡量。


  请注意：这类事情在开发环境中很难衡量——准确衡量它们通常需要真实用户做出真实的决策。


  ## 持续验证


  智能会随时间变化。用户行为也会随时间变化。这些变化可能导致体验在系统生命周期内效果下降。或者，这些变化可能带来机会，使体验变得更加强效，从而获得更多收益。


  一些可能影响体验的变化包括：


  1.  智能的质量可能变好或变差。

  2.  智能的质量可能保持不变，但它所犯的错误类型可能会改变。

  3.  用户可能对体验变得习以为常（或感到疲劳），并开始忽略它。

  4.  新用户可能采用该系统，并表现出与原始用户不同的行为。


  在智能系统中，变化的来源有很多。大多数变化都提供了机会（至少，如果你是个乐观主义者，你会把它们视为机会）来重新平衡系统的各个部分，以获得更好的结果——前提是你知道变化发生了，并且知道变化如何影响了系统。


  调整体验并不总是正确的答案——但它可能是。


  ## 总结


  验证智能体验是否有效可能很复杂，因为错误可能由体验、智能、用户处于你未曾预料到的情境，或者某些因素发生了变化所导致。


  当错误很多时，它们可能会变得难以应对，因此拥有一些简化问题并隔离问题根源的方法会很有用。这也有助于防止大量的相互指责：“这是智能的错误！”“不，这是体验的问题。”“不，这是智能的问题。”……诸如此类。


  拥有捕获、检查和操作情境的方法是有益的。这可以通过以下方式实现：


  *   手动生成它们。

  *   拥有检查和修改它们的工具。

  *   拥有从真实用户和真实场景中记录它们的方法。


  同样有益的是，拥有将情境回放给不同版本的智能，并观察体验会产生什么结果的方法。验证中常用的智能包括：


  *   用户正在使用的实时智能。

  *   实时智能的一个检查点，可以在较长时间内使用而无需更改。

  *   一个易于解释的简单智能（可能是一些手工制定的规则）。

  *   一个总是输出相同结果的“傻瓜式”智能。


  同样重要的是，验证智能体验是否在帮助用户实现他们的目标。这通常通过观察智能正确时的实时交互，并确保用户最终获得良好结果（而不是被体验迷惑或误导）来完成。


  智能系统总是在变化。智能体验的有效性需要不断重新验证。变化也创造了重新平衡和提供更多用户价值的机会——前提是你正在追踪变化，并拥有识别变化影响的工具。


  ## 思考题……


  阅读本章后，你应该能够：


  *   将体验问题（与智能问题）分离开，并独立验证体验是否按预期工作。

  *   为智能体验制定有效的测试计划。

  *   理解随着智能和用户群体的变化而重新验证的重要性。


  你应该能够回答如下问题：


  考虑一个你经常使用的智能系统。


  *   草拟一个计划，以验证其体验是否正常运行。

  *   设计一个简单的智能来帮助进行此验证。描述你会手动创建的三个情境，以在验证过程中执行这个简单智能。你为什么选择这三个？

  *   你将如何监控系统以检测体验是否正在失去效力？


