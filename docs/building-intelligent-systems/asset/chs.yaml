- "# 3. 数据处理基础速览\n\n数据是每个智能系统的核心。本章从概念层面概述数据处理，介绍数据科学、统计学和机器学习中的关键概念。目标是建立共同的理解基础，以促进智能系统项目所有参与者之间的讨论和决策。\n\
  \n本章将涵盖：\n\n*   结构化数据。\n*   向数据提问。\n*   数据模型。\n*   概念性机器学习。\n*   数据处理中的一些常见陷阱。\n\
  \n\n\n## 结构化数据\n\n数据正在改变世界，这一点毋庸置疑。\n\n但数据究竟是什么？是磁盘上的一堆图片？是你高中时写的所有学期论文？还是每一位棒球运动员的击球率？\n\
  \n没错，所有这些都是数据。数据浩如烟海——无数数字以 0 和 1 的形式填满了全球各地的硬盘驱动器。原始形式的数据通常被称为非结构化数据，处理起来可能相当困难。\n\
  \n当我们把数据转化为智能时，通常处理的是具有一定结构的数据。也就是说，数据被分解成描述实体或事件的单元。\n\n例如，想象一下处理关于人的数据。每个数据单元通过以下属性描述一个人：体重、身高、性别、眼睛颜色等等。\n\
  \n一种便捷的思考方式是将其视为电子表格中的表格（图 3-1）。每个人对应一行，每个人的每个属性对应一列。也许每行的第一列包含一个数字，代表对应人的体重。而每行的第三列包含一个数字，代表这个人的身高。以此类推。\n\
  \n![A455442_1_En_3_Fig1_HTML.gif](img/A455442_1_En_3_Fig1_HTML.gif)\n\n图 3-1\n\n\
  结构化数据示例\n\n这些列通常包含数字（如身高和体重），或者从少量类别中选择（如眼睛颜色为棕色或蓝色），或者是像姓名这样的短文本字符串。当然，还有更高级的选项，但这种简单的方案已经相当强大，可以用来表示各种事物（并解锁我们对它们进行统计和机器学习的能力）。\n\
  \n例如：\n\n*   你可以通过以下方式表示一个网页：它包含的单词数量、图片数量、链接数量，以及它包含 1000 个常见关键词中每个关键词的次数。\n* \
  \  你可以通过以下方式表示一次搜索引擎访问：用户输入的查询词、用户在结果页面上停留的时间、用户点击的搜索结果数量，以及他们最终点击结果的 URL。\n*  \
  \ 你可以通过以下方式表示我们联网烤面包机上的一次烘烤事件：放入烤面包机的物品温度、用户选择的强度设置、用户在取出物品前停止和启动烤面包机的次数，以及物品从放入到取出之间的总时间。\n\
  \n这些是简单的例子。在实践中，即使是简单的概念，其表示形式也往往包含数十甚至数百个元素（每行有数十或数百列）。选择正确的数据集进行收集，并赋予它们正确的表示形式，对于从数据中获得良好结果至关重要。而且，在成功之前，你可能会失败几次——要做好不断演进的准备。\n\
  \n## 向数据提出简单问题\n\n那么，你能用数据做什么呢？你可以向它提问。例如，在一个关于人的数据集中，你可能想知道：\n\n*   平均身高是多少？\n\
  *   谁最高？\n*   有多少人身高低于 5 英尺 5 英寸？\n\n这些问题很容易回答；只需查看数据并计算数值即可（求和，或统计符合条件的行数）。\n\n\
  在智能系统中，你会提出大量类似的问题。例如：\n\n*   用户每天执行某个特定操作的次数是多少？\n*   用户在参与智能体验后点击广告的百分比是多少？\n\
  *   每位客户每月的平均收入是多少？\n\n回答这类问题对于理解系统是否达到目标（并确保它没有失控）至关重要。\n\n你还可以用数据做另一件事：进行预测。想象一个包含一百个人的数据集。想知道平均身高？没问题，直接计算即可。但如果你想知道下一个将被添加到数据集的人的身高呢？或者下一个被添加的人身高是低于还是高于\
  \ 5 英尺？\n\n你能做到这些吗？当然可以！嗯，某种程度上可以，借助基础统计学。\n\n通过一些简单的假设，统计学可以估算出下一个被添加到数据集的人最可能的身高。但统计学能做的远不止于此。它可以精确地表达估算的准确度；例如：\n\
  \n> 下一个人的最可能身高是 5 英尺 10 英寸，并且有 95%的置信度认为下一个人的身高将在 5 英尺 8 英寸到 6 英尺之间。\n\n这被称为置信区间。置信区间的宽度取决于你拥有的数据量以及数据的“规整程度”。数据越多，区间越窄（例如，下一个人有\
  \ 95%的可能性身高在 5 英尺 9 英寸到 5 英尺 11 英寸之间）。数据越少，区间越宽（例如 5 英尺 5 英寸到 6 英尺 3 英寸）。这为什么重要呢？\n\
  \n让我们想象一下，通过减少客户支持能力来优化互联网业务以节省成本。假设当前系统每周有能力处理 200 个客户支持电话。查看历史遥测数据，你可以计算出平均每周有\
  \ 75 个支持电话，并且任何一周的最高电话数量是 98 个。直观上，200 远高于 75——系统肯定浪费了很多钱。将能力减半（降至 100）似乎是安全的，特别是因为你没有任何一周的电话量记录超过这个数字。\n\
  \n但请检查置信区间。如果结果显示最可能的电话量是每周 75 个，并且有 95%的置信度认为下周的电话量将在 40 到 110 个之间呢？那么，100 似乎就不是一个明显的好答案了。在一个数据密集型项目中，你应该总是寻求答案。但你也应该询问这些答案的确定程度。并且你应该确保所做的决策同时考虑了答案和确定程度。\n\
  \n\n\n## 使用数据模型\n\n模型能够捕捉数据中的答案，并将其转换为更便捷或更有用的格式。\n\n从技术上讲，我们之前讨论的投影就是一种模型。回想一下，呼叫中心通话量的数据集被转换为平均每周通话量\
  \ 75 次，以及 95%置信区间 40-110 次。原始数据可能非常庞大，可能包含十年间十 TB 的遥测数据。但模型只包含了四个数字：75、95%、40 和\
  \ 110。\n\n这个简单的模型对于制定容量规划决策更为有用，因为它恰好包含了相关信息，并以一种直观的方式捕捉了当前任务所需的内容。\n\n模型还可以填补数据中的空白，并估算数据中未包含的问题的答案。\n\
  \n考虑一个包含人们身高和体重的数据集。假设数据集中有一个身高 5 英尺 8 英寸的人和一个身高 5 英尺 10 英寸的人，但没有身高 5 英尺 9 英寸的人。\n\
  \n如果你需要预测一个身高 5 英尺 9 英寸的人的体重，该怎么办？\n\n你可以构建一个简单的模型。查看数据，你可能会注意到数据集中的人每英寸身高大约重 2.5\
  \ 磅。使用这个模型，一个身高 5 英尺 9 英寸的人体重将是 172.5 磅。很好。但真的如此吗？\n\n评估模型质量的一种常见方法是**泛化误差**。具体做法是保留一部分数据集，对建模者隐藏这部分数据，然后在保留的数据上测试模型，看看模型的表现如何——即它对未见数据的泛化能力。\n\
  \n例如，数据集中可能确实有一个身高 5 英尺 9 英寸的人，但有人将其从建模过程中隐藏了。也许这个被隐藏的 5 英尺 9 英寸的人体重是 150 磅。但模型预测的是\
  \ 172.5 磅。这差了 22.5 磅。\n\n好还是不好？这取决于你需要模型做什么。\n\n如果你将数十或数百个从建模过程中保留的人的这种误差累加起来，就能对模型的好坏有所了解。有很多技术方法可以汇总误差并传达模型的质量，其中两个重要的方法是：\n\
  \n*   **回归误差**：数值与预测值之间的差异，如体重示例所示。在前面的例子中，模型的回归误差是 22.5。\n*   **分类误差**：用于预测类别的模型，例如一个试图根据身高和体重预测一个人是男性还是女性的模型（是的，我同意这个模型不会有很多朋友）。衡量分类误差的一种方法涉及准确率：模型在区分男性和女性方面的准确率为\
  \ 85%。\n\n## 概念性机器学习\n\n简单的模型可能很有用。身高-体重模型非常简单，但也很容易发现其缺陷。例如，它没有考虑性别、体脂率、腰围或人的籍贯。统计对于进行预测很有用。创建一个简单的模型，用它来回答问题。但模型也可以很复杂——非常、非常、非常复杂。\n\
  \n机器学习利用计算机来改进从数据中生成（复杂）模型的过程。这些模型可以从数据中进行预测，有时准确得惊人，有时也错误得惊人。\n\n机器学习算法会探索数据，以确定最佳方式将表示（数据集中的列）中包含的信息组合成一个模型，该模型能准确地对未见数据进行泛化。\n\
  \n例如，机器学习算法可能会预测以下任何一项：\n\n*   通过身高、体重、年龄和姓名预测性别。\n*   使用性别、身高、年龄和姓名预测体重。\n*   根据性别和体重预测身高。\n\
  *   等等……\n\n模型的工作方式可能非常复杂，以对人类来说毫无意义但能产生准确结果的方式对各个输入进行乘法和缩放。\n\n可能有数千种机器学习算法可以生成数据模型。有些速度很快；有些则需要运行数天或数周才能生成模型。有些生成非常简单的模型；有些生成的模型需要数兆字节或千兆字节的磁盘空间。有些生成的模型可以在新数据上非常快速地做出预测，只需一毫秒或更短时间；有些生成的模型执行起来计算量很大。有些模型在某些类型的数据上表现良好，但在其他类型的问题上却会失败。\n\
  \n似乎没有一种普遍适用于所有情况的最佳机器学习算法——大多数算法在某些情况下表现良好，但在其他情况下表现不佳。每隔几年就会出现一种新技术，在解决重要问题方面表现出色，并引起广泛关注。\n\
  \n而且，一些机器学习从业者非常喜欢他们最熟悉的算法，即使有相反的证据，也会誓死捍卫它。你已经被警告过了。\n\n机器学习过程通常分为以下几个阶段，所有这些阶段都很困难，需要专家付出相当大的努力：\n\
  \n*   **获取要建模的数据**：这涉及处理噪声，并准确确定要预测什么以及如何为建模算法获取训练样本。\n*   **特征工程**：这涉及将数据处理成具有正确表示（电子表格中的列）的数据集，以供机器学习算法使用。\n\
  *   **建模**：这涉及在数据集上运行一个或多个机器学习算法，查看它们所犯的错误，进行调整和优化，并重复此过程，直到模型足够准确。\n*   **部署**：这涉及选择运行哪个模型，以及如何将其连接到系统中，以产生积极影响并将错误造成的损害降至最低。\n\
  *   **维护**：这涉及监控模型是否按预期运行，并在模型开始失控时进行修复。例如，在新数据上重新运行训练算法。\n\n本书将介绍如何针对大型复杂系统执行这些步骤。\n\
  \n\n\n## 处理数据时的常见陷阱\n\n数据可能很复杂，而且有很多地方可能出错。以下是处理数据密集型系统（如智能系统）时需要牢记的几个常见陷阱。\n\n\
  **置信区间可能失效。** 置信区间非常有用。知道某件事有 95%的可能性介于两个值之间，这很棒。但 95%的概率落在区间内，也意味着有 5%的概率落在区间外。而且一旦落在区间外，偏差可能非常大。这意味着什么？5%就是二十分之一。因此，如果你每周进行一次估算（例如调整呼叫中心容量），那么每二十周中就有一周会超出区间——这意味着每年会有\
  \ 2.6 次容量过剩或不足。5%听起来很小，好像永远不会发生，但请记住，如果你一直碰运气，即使是低概率事件最终也会发生。\n\n**你的数据中存在噪声。**\
  \ 噪声是误差的另一种说法。比如，数据集中可能有一个身高为 1 英寸或 15 英尺 7 英寸的人。这是真实的吗？很可能不是。噪声从何而来？来源多种多样。例如，软件有漏洞；数据也有缺陷。遥测系统记录了错误的值。数据在处理过程中被损坏。实现统计查询的代码存在错误。用户在奇怪的时间关闭电脑，导致奇怪的客户端状态和疯狂的遥测数据。有时，当客户端出现错误时，它不会生成数据元素。有时它会生成部分数据。有时这种噪声是由计算机以不应有的方式运行引起的。有时是由人与人之间的沟通不畅造成的。每个大型数据集都会有噪声，这会给基于数据创建的内容注入一些误差。\n\
  \n**你的数据存在偏差。** 当数据收集方式与数据使用方式存在系统性差异时，就会产生偏差。例如，我们用来估算身高的人群数据集可能是通过在纽约街头随机采访路人创建的。这个数据的模型对于估算日本、危地马拉或廷巴克图人的身高准确吗？\n\
  \n偏差会降低数据的实用性，而且偏差可能源于各种看似无害的地方，比如对数据收集地点或数据收集背景的简单疏忽。例如，与非常喜欢或非常讨厌某物的用户相比，那些“有点喜欢”某物的用户回复调查的可能性更低。请确保数据被用于其原本的用途，或者确保你花时间理解数据偏差所带来的影响。\n\
  \n**你的数据已经过时。** 大多数（简单的）统计和机器学习技术都有一个重要的基本假设——即事物不会改变。但事物确实会改变。想象一下，你建立了一个支持呼叫量的模型，然后试图用它来估算一个重大新功能发布后一周的支持呼叫量。或者一场大风暴后一周的呼叫量。实现智能系统所有部分的主要原因之一，就是使系统能够稳健地应对变化。\n\
  \n**你希望数据说出它没有说出的内容。** 有时数据是不确定的，但人们喜欢得到答案。这是人的天性。人们可能会淡化不确定性程度，说“答案是 42”，而不是说“我们无法回答这个问题”或“答案介于\
  \ 12 和 72 之间”。给出精确的答案会让人感觉自己更聪明。给人们提供他们可以使用的答案（而不是给出一个冗长、不完整的答案）几乎显得更礼貌。在数据中发现故事很有趣，比如“我们最好的产品是牙膏，因为我们上个月重新布置了展示柜。”这些故事非常诱人，以至于人们即使不存在也会发现它们。\n\
  \n> 提示\n> \n> 在处理数据时，始终要问几个问题：这是正确的吗？我们有多确定？是否有其他解释？我们如何知道哪个是正确的？\n\n**你的数据模型会犯错。**\
  \ 智能系统，尤其是那些通过数据建模构建的系统，是错误的。而且经常出错。有时这些错误是有道理的。但有时它们完全是反直觉的胡言乱语。而且有时在不引入新错误的情况下修复一个错误非常困难。但这没关系。不要害怕错误。只需记住：任何基于模型的系统都需要一个处理错误的计划。\n\
  \n## 总结\n\n数据正在改变世界。当数据以符合其用途的方式结构化时，它最为有用。结构化数据就像电子表格，每一行代表一个事物（人、事件、网页等），每一列代表该事物的一个属性（身高、体重、性别）。\n\
  \n数据可用于回答问题并做出预测。统计学可以回答简单的问题，并指导你了解答案的准确程度。机器学习可以创建非常复杂的模型，以做出非常复杂的预测。机器学习拥有许多非常有用的工具，可以帮助创建准确的数据模型。而且新的工具正在不断被开发出来。\n\
  \n数据也可能被严重误用——你必须小心谨慎。\n\n## 思考题\n\n阅读本章后，你应该：\n\n*   理解数据用于哪些类型的事情。\n*   对如何应用数据所能做的事情有一些直觉。\n\
  *   对数据如何出错并导致不良结果有一些直觉。\n\n你应该能够回答如下问题：\n\n*   你所知道的、可能因某人误用数据而造成的最大错误是什么？\n\n"
- '# 4. 定义智能系统的目标


  智能系统将智能与经验相结合，以实现期望的结果。当所有这些要素协调一致时，成功就会到来：结果是可实现的；智能针对的是正确的问题；经验鼓励了正确的用户行为。


  一个好的成功标准将这些要素联系起来。它用通俗的语言表达期望的结果。它指明了智能和经验需要解决的子问题，并将这些解决方案与期望的更大规模（组织）结果联系起来。好的成功标准隐含着一个框架，允许所有参与者看到他们的工作如何为整体目标做出贡献。这有助于防止他们误入歧途，即使数据和他们的经验正在合谋误导他们。


  本章讨论为智能系统设定目标，包括：


  *   什么是好的目标。

  *   为什么找到好的目标很困难。

  *   系统可能拥有的各种类型的目标。

  *   衡量目标的一些方法。




  ## 优秀目标的标准


  一个成功的目标应满足以下所有条件：


  1.  向所有参与者清晰传达期望的成果。无论其背景或技术经验如何，每个人都应能理解成功的标准及其重要性。

  2.  具有可实现性。团队中的每个人都应相信自己具备成功的条件。目标可以具有挑战性，但团队成员应能大致说明他们将如何接近成功，以及为何成功概率较高。

  3.  具有可衡量性。智能系统关乎优化，而优化离不开衡量。因为如果无法衡量某件事，你就无法真正对其进行优化。


  判断一个目标是否正确并非易事。事实上，弥合高层目标与实现细节之间的鸿沟，往往是创建成功智能系统的关键挑战。有些目标对部分参与者来说看似完美，但对其他人却毫无意义。有些目标显然能带来积极影响，却难以衡量或实现。权衡取舍总是存在的，花费大量时间打磨成功的定义也是常态。


  但这没关系。这种努力绝对值得，因为在项目启动前未能定义成功，是浪费时间和金钱最简单、最确定的方式。


  ## 为何目标设定如此困难：一个示例


  设想一个由智能系统支持的反钓鱼功能。


  一种钓鱼形式是：网站看起来像合法的银行网站，但实际上是受滥用者控制的虚假网站。用户被引诱至这些钓鱼网站，并上当将银行密码交给犯罪分子。这显然不妙。


  那么，智能系统应该做什么？


  与机器学习专家交谈，他们很快就会兴奋起来。他们会迅速想到如何构建一个模型，用于检查网页并预测其是否为钓鱼网站。这些模型会考虑网页上的文本和图像等因素来进行预测。如果模型认为某个页面是钓鱼网站，就将其屏蔽。页面被屏蔽后，用户就不会浏览它，也不会输入银行密码。问题解决，简单明了。每个人都知道该做什么。


  因此，屏蔽数量似乎是一个很好的衡量指标——屏蔽的网站越多，系统表现越好。


  真的是这样吗？


  如果系统高效到让钓鱼者放弃呢？世界上每一个钓鱼者都金盆洗手，另寻出路？


  完美！


  但这样一来，就不会再有新的钓鱼网站，屏蔽数量将降至零。系统取得了全面成功，但指标却显示彻底失败。


  这并不理想。


  或者，如果系统每天屏蔽一百万个钓鱼网站，但钓鱼者毫不在意呢？每次系统屏蔽一个网站，钓鱼者就简单地再建一个。智能系统屏蔽了海量内容，团队每个人都欢欣鼓舞，觉得自己在帮助他人——但系统建成后，与建成前相比，同样数量的用户仍在向滥用者泄露自己的凭证。


  这也不理想。


  在智能系统中定义成功的一个陷阱是，有太多东西可以被衡量和优化。人们很容易找到自己熟悉的东西，将其选为目标，从而偏离真正的成功。


  回顾优秀成功标准的三个特性：


  1.  传达期望的成果

  2.  具有可实现性

  3.  具有可衡量性


  将屏蔽钓鱼页面的数量作为成功指标，完美满足了第 2 和第 3 点，但在第 1 点上失败了。


  这个系统的期望成果不是屏蔽钓鱼网站——而是阻止滥用者获取用户的银行密码。


  ## 目标的类型


  系统可以尝试优化的目标有很多种，从非常具体到非常抽象。


  系统的真实目标往往非常抽象（比如下个季度盈利），但它能直接影响的事物却非常具体（比如决定烤面包机应该运行 45 秒还是 55 秒）。在设定有效目标时，找到抽象与具体之间的清晰联系是压力的主要来源。而且这真的非常、非常困难。


  困难的原因之一是，不同的参与者会关注不同类型的目标。例如：


  *   一些参与者会关注盈利、吸引和留住客户。

  *   一些参与者会关注帮助用户完成他们想做的事。

  *   一些参与者会关注系统智能的准确性。


  这些都是重要的目标，并且相互关联，但它们之间的联系是间接的。例如，如果系统总是做错事，你很难赚到钱；但将智能水平提升 1%，并不会直接转化为 1%的利润增长。


  本节讨论衡量智能系统成功的不同方式，包括：


  *   组织目标

  *   领先指标

  *   用户成果

  *   模型属性


  大多数智能系统会定期使用其中几种方式，但在日常优化中主要关注用户成果和模型属性。


  ### 组织目标


  组织目标是智能系统的真正原因。在商业环境中，这些可能是收入、利润或销售数量。在非营利组织中，这些可能是拯救的树木、改善的生活或对社会带来的其他益处。


  组织目标显然对优化至关重要。但它们作为智能系统的直接目标至少存在三个问题：


  1.  它们与技术所能影响的范围相距甚远。例如，一个负责联网烤面包机的人可以改变一片冷面包的烘烤时间——这与销售数量有何关系？

  2.  它们受到许多系统无法控制的因素影响。例如，市场状况、营销策略、竞争压力、用户行为随时间的变化等等。

  3.  它们是非常缓慢的指标。可能需要数周或数月才能知道某个特定行动是否影响了组织目标。这使得它们难以直接优化。


  每个智能系统都应服务于一个组织目标，但智能系统的日常编排通常会聚焦于更直接的衡量指标——比如我们将在接下来几节中讨论的（特别是用户成果和模型属性）。




  ### 领先指标


  领先指标是与未来成功相关的衡量标准。例如：


  *   当客户喜欢你的产品时，你比他们讨厌它时更有可能盈利。

  *   当客户向朋友推荐你的产品时，你比客户告诉朋友远离它时更有可能扩大客户群。

  *   当客户每天使用你的产品时，你比他们每隔几个月才使用一次时更有可能留住客户。


  领先指标是在组织目标与智能系统更具体的属性（如用户成果和模型属性）之间搭建桥梁的一种方式。如果智能系统变得更好，客户可能会更喜欢它。这可能会带来更多销售，也可能不会，因为其他因素——如竞争对手、营销活动、趋势等——会影响销售。领先指标将其中一些外部因素排除在外，并可以帮助你在更改智能系统时获得更快的反馈。


  领先指标主要有两种类型：客户情感和客户参与度。


  客户情感是衡量客户对产品感受的指标。他们喜欢使用它吗？它让他们开心吗？他们会向朋友推荐它吗（或者他们更愿意向敌人推荐它）？


  如果每个使用你产品的人都喜欢它，这表明你走在正确的轨道上。继续前进，不断扩展你的用户群，最终你将取得商业成功（获得收入、销售大量产品等）。


  另一方面，如果每个使用你产品的人都讨厌它，你可能会遇到麻烦。你可能有一些客户，他们可能会使用你的产品，但他们并不满意。他们在寻找出路。如果你遇到一个强大的竞争对手，你的客户随时准备跳槽。


  情感是一个模糊的衡量标准，因为用户的感受可能反复无常。准确衡量情感也可能非常困难——用户并不总是愿意准确告诉你你要求他们告诉你的事情。尽管如此，情感的波动可以作为未来业务成果的有用指标，而智能系统肯定会影响遇到它们的用户的情感。


  客户参与度是衡量客户使用产品程度的指标。这可能意味着使用频率。也可能意味着使用深度，比如使用产品提供的所有各种功能。


  参与度高的客户表明他们在你的产品中发现了价值。他们已经养成了使用你产品的习惯，并且一次又一次地回来。随着时间的推移，他们对你和你的业务将很有价值。


  参与度低的客户很少使用产品。这些客户可能从你的产品中获得了价值，但他们心里有其他事情。他们可能会逐渐流失，再也不会想起你或你的产品。


  作为智能系统的目标，领先指标有一些缺点，类似于组织目标所遭受的缺点：


  *   它们是间接的。

  *   它们受到智能系统无法控制的因素的影响。

  *   它们不擅长检测微小的变化。

  *   它们提供缓慢的反馈，因此难以直接优化。

  *   而且它们通常比组织目标更难衡量（你喜欢回答多少份调查问卷？）。


  尽管如此，领先指标仍然有用，特别是作为问题的早期指标——无论你认为你的智能系统应该做什么，如果客户在更新后的情感比更新前差得多，那么你可能做错了什么。


  ### 用户成果


  为智能系统设定目标的另一种方法是关注用户获得的成果。例如：


  *   如果你的系统是关于帮助用户查找信息，他们是否高效地找到了有用的信息？

  *   如果你的系统是关于帮助用户做出更好的决策，他们是否做出了更好的决策？

  *   如果你的系统是关于帮助用户找到他们会喜欢的内容，他们是否找到了最终喜欢的内容？

  *   如果你的系统是关于优化计算机上的设置，它所优化的计算机是否更快？

  *   如果你的系统是关于帮助用户避免诈骗，他们是否避免了诈骗？


  智能系统可以围绕诸如此类的问题和决策设定目标，并尝试优化用户获得的成果。


  这特别有用，因为成果依赖于智能系统的智能和体验的结合。为了让用户获得良好的成果，智能必须正确，并且体验必须帮助用户受益。


  例如，在反钓鱼示例中，想象一个能够 100%准确识别诈骗的智能系统。如果体验基于这种智能阻止诈骗页面，用户将获得良好的成果。但如果体验更微妙呢？也许当用户访问诈骗网站时，它会在用户的浏览器上显示一个小警告——地址栏中一个小小的红色
  X。一些用户不会注意到这个警告。一些用户不会正确理解它。一些用户会忽略它。在这种情况下，即使智能系统正确识别了诈骗，一些用户也会获得糟糕的成果（并将他们的密码交给诈骗者）。


  用户成果可以成为智能系统的非常好的目标，因为它们衡量了智能和体验如何协同工作以影响用户行为。




  ### 模型属性


  在每个智能系统中，都存在一些具体且直接的可优化项，例如：


  *   识别诈骗的模型的错误率。

  *   用户需要重新烤面包的概率。

  *   用户接受首次内容推荐的比例。

  *   系统决定展示的广告的点击率。


  这类属性并不总是与用户成果、领先指标或组织目标完全一致，但它们确实为致力于改进智能系统的人员提供了非常好的目标。


  例如，一个在实验室测试数据中准确率达到 85%的模型，显然比准确率 75%的模型更好。清晰且具体。易于获得快速反馈。易于取得进展。


  但作为智能系统的目标，模型属性也存在一些缺点：


  1.  它们与实际用户现实脱节。例如，如果联网烤面包机总能将烤面包时间控制在最佳时间的 10 秒以内，用户会喜欢吗？误差 5 秒会更好吗？当然，显然如此。但好多少呢？减少误差能让面包更美味吗？目标应该是什么？如果我们能将模型误差降到
  4 秒，这足够了吗？我们应该就此止步，还是继续追求 3 秒的误差？每额外减少一秒的误差，值得投入多少资源？

  2.  它们未能充分利用整个系统。模型可能会犯错，但用户会在整个系统的上下文中感知到这个错误。也许用户体验让这个错误显得微不足道，以至于没人关心。或者，也许有一种非常好的方式让用户提供反馈，从而快速纠正错误——这比投资优化模型最后几个百分点的性能要便宜得多。

  3.  它们对机器学习从业者来说过于熟悉。构建智能系统来优化模型属性很容易——这恰恰是机器学习从业者毕生所做的事情，因此在任何关于目标的讨论中，它自然会浮现出来。请谨慎对待它们。它们如此强大且熟悉，以至于可能会扼杀并劫持系统的实际目标。


  优化模型属性是智能的核心，但它很少是最终目标。一个好的目标会展示优化模型属性如何有助于对用户和业务产生预期影响。一个好的目标会指导模型属性优化值得投入多少。


  ## 分层目标


  用一个单一指标来定义智能系统项目的成功是困难的，而定义成功的指标本身往往也难以衡量。一个好的实践是在不同的抽象层次上定义成功，并阐述一个层次的成功如何促进其他层次。这不必像数学公式那样精确的技术性工作，但应该是一次诚实的尝试，讲述一个所有参与者都能认同的故事。


  例如，智能系统的参与者可能会：


  *   按小时或按天优化模型属性。

  *   按周审查用户成果，确保模型属性的变化按预期影响了用户成果。

  *   按月审查领先指标，确保一切没有偏离轨道。

  *   按季度审视组织目标，确保智能系统正朝着影响这些目标的正确方向前进。


  在项目过程中，要经常重新审视智能系统的目标。


  因为情况会变。


  ## 衡量目标的方法


  定义成功如此困难的一个原因是，衡量成功更加困难。


  我们到底该如何知道攻击者通过他们的钓鱼页面窃取了多少密码？


  在本书第二部分讨论智能体验时，我们将讨论设计智能体验以帮助衡量目标并获取数据来改进智能的方法。本节介绍一些基本方法。使用这些技术，可以在定义成功时获得更大的灵活性。


  ### 等待更多信息


  有时，在某个行为发生时无法判断其对错，但几小时、几天或几周后，判断就变得容易得多。随着时间的推移，你通常会有更多信息来解释这次交互。以下是一些等待如何提供帮助的例子：


  *   系统向用户推荐内容，用户完整地消费了它——通过等待观察用户是否消费了内容，你可以获得一些证据来判断推荐是好是坏。

  *   系统允许用户在网页上输入密码——通过等待观察用户是否从东欧登录并试图让所有朋友安装恶意软件，你可以获得一些证据来判断密码是否被盗。


  等待可以是一种非常廉价且有效的方式，使成功标准更容易衡量，特别是当用户的行为隐式地指示成功或失败时。


  这有几个缺点。


  首先，等待会增加延迟。这意味着等待可能无助于优化或进行细粒度的测量。


  其次，等待会增加不确定性。用户改变其行为的原因有很多。等待会为其他因素影响测量结果提供更多时间。


  ### A/B 测试


  向不同用户展示功能/智能的不同版本，可以非常有效地量化该功能的效果。


  想象一下，给一半用户提供智能体验，给另一半用户提供简化版（简单、默认）体验。也许联网烤面包机的一半用户，无论他们使用什么设置或放入什么面包，烤面包时间都是一分钟。另一半用户则得到由你能找到的所有最先进智能决定的烤面包时间。


  如果获得简化版体验的用户与获得完整体验的用户在烤面包时的满意度/参与度/效率一样高——那你就遇到问题了。


  A/B 测试可能难以管理，因为它需要同时维护产品的多个版本。


  它也可能难以区分微小的影响。想象一下测试智能烤面包机的两个版本，一个无论怎样都烤一分钟，另一个无论怎样都烤 61 秒。其中一个比另一个更好吗？也许，但可能需要很长时间（以及大量用户交互观察）才能弄清楚。


  A/B 测试是确保系统重大变更带来积极效果的好方法，但对于日常优化来说则比较麻烦。


  ### 人工标注


  有时计算机无法判断某个行为是否与成功一致，但人可以。你可以雇佣一些人来定期检查少量事件/交互，并告诉你它们是否成功。在许多情况下，这种人工标注很容易完成，不需要任何特殊技能或培训。


  为了进行交互的人工标注，智能系统需要有足够的遥测数据来捕获和重放交互。这些遥测数据必须包含足够的细节，以便人类能够可靠地判断发生了什么以及结果是好是坏（同时保护用户隐私）。这并非总是可行，尤其是在需要猜测用户试图做什么，或者他们在做这件事时的感受时。


  但审视你的系统正在做什么以及它如何影响用户，总是有益的。规模可以很小。成本可以很低。但它也可能非常有用。




  ### 询问用户


  判断某件事是否成功，最直接的方法或许就是询问用户。例如，直接在产品中构建反馈机制：


  *   向用户展示多条内容，用户选择其中一条。系统弹出一个对话框，询问用户对提供的选项是否满意。

  *   自动驾驶汽车将用户送达目的地，在用户下车时，它会询问用户在旅途中是否感到安全舒适。

  *   烤面包机定期询问：“烤成这样是你喜欢的程度吗？”（是的，这可能相当令人毛骨悚然，尤其是在天黑后你独自在家且没开灯的时候。）


  需要牢记几点：


  用户并不总是知道答案。例如，问某人“你刚才是不是把密码给了罪犯？”可能效果不佳——而且可能会无缘无故地吓到很多人。


  用户可能并不总是愿意回答你的所有问题。这会导致偏差。例如，那些非常专注于手头任务的用户，即使他们获得了良好的结果，也可能不会停下来考虑填写调查问卷。


  用户会厌倦被反复提问。这种类型的反馈应谨慎使用。


  但有时，每月仅向 0.1% 的用户提出一个简单问题，就能释放巨大潜力，帮助你了解你的智能系统是否成功。


  ### 分解目标


  有些事情很难直接衡量，但可以分解成更简单的部分，对这些部分进行衡量（或许可以使用本节中的一些技术），然后将它们整合起来，形成对整体的评估。


  例如，考虑网络钓鱼的例子。被钓鱼者窃取的凭证数量可以分解为以下部分：


  *   访问钓鱼网站的用户数量（通过等待用户报告来识别钓鱼网站，并结合流量遥测数据来估算访问次数）。

  *   在系统未发出警告时，在钓鱼网站上输入密码的用户百分比（通过用户研究来估算）。

  *   在系统发出警告时，仍然在钓鱼网站上输入密码的用户百分比（通过遥测数据估算有多少用户忽略警告，并在已知的钓鱼网站密码框中输入密码）。


  将这些数字相乘，你就能得到一个相当不错的、针对智能系统的潜在目标评估。


  当分解目标能够识别出关键的、可衡量的子问题，并展示它们如何与其他清晰的子问题串联起来，最终实现整体成功时，这种方法尤其有用。


  ## 保持目标健康


  有时目标需要改变。但改变目标很困难，尤其是当人们已经围绕目标组织起来时。可能存在很大的惯性、许多不同的意见，并且没有好的答案。建立一个审查和调整目标的流程是一个非常好的主意。如果发生以下任何情况，目标可能需要改变：


  *   新的数据源上线，表明某些假设是错误的。

  *   系统的某个部分运行得非常好，那么围绕其进一步改进的目标应该改变（以免这些目标变得僵化，导致投资方向错误）。

  *   有人提出了更好的方法，将智能系统的工作与实际客户影响联系起来。

  *   世界发生了变化，先前的目标不再能反映成功。


  即使目标不必改变，偶尔让大家聚在一起，提醒自己大家共同致力于实现的目标是什么，也是件好事。


  ## 总结


  拥有目标对于智能系统的成功至关重要。但设定正确的目标很困难。有效的目标应该：


  1.  传达期望的结果

  2.  是可实现的

  3.  是可衡量的


  目标可以非常抽象（如组织目标）。它们可以不那么抽象（如领先指标）。它们可以比较具体（如用户成果）。或者它们可以非常具体（如模型属性）。


  一套有效的目标通常会将这些不同类型的目标串联成一个清晰指向成功的故事。


  大多数智能系统都会为组织目标和领先指标做出贡献，但日常改进的核心工作将集中在用户成果和模型属性上。


  目标可以通过遥测、等待结果变得清晰、使用人工判断以及询问用户他们的体验来衡量。


  我有没有提到——设定正确的目标很困难。它们可能需要反复迭代。


  但如果没有有效的目标，智能系统几乎注定会浪费时间和金钱——最终失败。


  ## 思考题


  阅读本章后，你应该能够：


  *   理解可以为智能系统定义成功的各种方式，以及如何衡量是否实现了成功。

  *   能够在多个抽象层次上定义成功，并讲述不同类型的成功如何相互促进。


  你还应该能够回答如下问题：


  思考一个你最喜欢的、可能受益于智能系统的爱好。


  *   这个智能系统会为其开发者贡献什么样的组织目标？

  *   对它来说，最合理的领先成果是什么？

  *   这个智能系统将被追踪的具体用户成果是什么？

  *   你会如何衡量这些成果？为什么？


