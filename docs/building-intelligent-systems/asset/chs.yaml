- "# 23. 智能编排环境\n\n本章讨论了一些有助于成功实现智能编排的常见活动。这些示例展示了如何充分利用智能系统，包括以下内容：\n\n*   **监控成功标准**：了解系统是否在实现其目标，以及其表现是变好还是变差。\n\
  *   **检查交互过程**：像用户一样体验上下文，并查看用户所获得的结果。\n*   **平衡体验**：使体验的力度更强或更弱，可能改变交互类型，或调整交互的显著性和频率。\n\
  *   **覆盖智能决策**：纠正偶发的严重错误，或帮助优化常见上下文。\n*   **创建新智能**：管理智能并生成新模型，以应对问题、用户或数据范围变化时出现的新问题。\n\
  \n智能系统可以从所有这些活动以及更多活动中受益。其中一些活动可以作为实现的一部分来构建——例如，一个显示总体目标进展的指标仪表板。另一些活动则可以以更临时的方式处理——例如，查询原始遥测数据源，以拼凑出导致问题的交互过程。\n\
  \n本章将依次讨论编排活动，并提供一些关于如何（如果你选择这样做的话）在每个领域进行投入的想法，以及决定投入多少的一些标准。\n\n## 监控成功标准\n\n\
  你必须能够判断系统是否在实现其目标。这涉及获取遥测数据，纠正任何采样和中断问题，并生成所有参与者都能理解的答案——可能是一些数字，也可能是一张图表。回想一下，这可能涉及以下任何一项：\n\
  \n*   **业务目标和领先指标**，特别是展示重度使用系统智能部分的用户与不使用该部分的用户之间的差异。\n*   **用户成果**，表明智能系统在帮助用户实现你期望的成果方面的有效性。\n\
  *   **模型属性**，表明智能判断正确或错误的频率（无论用户最终取得了什么成果）。\n\n监控成功标准至关重要。每个功能正常的智能系统都必须有人每天了解其运行状况，并关心它是否在实现其目标。\n\
  \n监控成功标准的投入级别包括：\n\n*   **临时性**：少数人具备衡量系统目标并生成答案的技能，可能通过交叉检查当前的遥测设置、调整脚本、运行脚本、将结果复制到演示形式（如图表）并进行分发。\n\
  *   **基于工具**：团队中的任何人都可以运行一个工具，该工具创建并执行正确的查询，然后以合适的演示格式输出答案。\n*   **自动化**：系统定期自动运行查询，并将结果存档在所有参与者都能找到的地方。\n\
  *   **基于警报**：系统不仅自动化指标，还对其进行监控，并在发生某些情况时向参与者发出警报，包括：\n    *   **重大退化**：指标远低于上次测量值。例如，自昨天以来错误数量增加了\
  \ 10%。\n    *   **显著、持续的侵蚀**：指标逐渐下降的时间足够长，以至于超过了某个阈值。例如，在过去一个月中，获得良好结果的用户比例下降了 10%。\n\
  *   **群体追踪**：系统追踪重要子群体以及整体群体的指标。这可能包括来自特定地点、具有特定使用模式、特定人口统计特征等的用户。\n\n投入监控成功标准的判断标准：\n\
  \n*   几乎每个智能系统都应该为成功标准以及促成成功标准的关键因素实施基于警报的监控。\n\n## 检查交互过程\n\n检查交互过程涉及收集与特定用户交互相关的所有遥测数据，并能够端到端地查看该交互过程。这包括用户交互时的上下文、正在运行的智能版本、智能给出的答案、由此智能答案产生的体验、用户如何与该体验进行交互，以及用户最终获得了什么结果。\n\
  \n这对于调试问题、追踪错误、了解用户如何看待智能系统，以及获得关于用户体验选项的直觉至关重要。\n\n检查交互过程的投入级别包括：\n\n*   **临时性**：少数人具备找到交互过程所有部分并理解它们之间关系的技能。他们可能需要进行一些侦探工作来识别特定的交互（或具有特定属性的交互），并且基于采样，可能能找到也可能找不到任何特定的交互。\n\
  *   **基于工具**：团队中的任何人都可以识别一个交互（可能通过用户和时间），并查看相关的遥测数据。该工具还可以支持查询特定类型的交互（例如，智能给出了特定答案而用户获得了特定结果的情况），并检查其中的样本。\n\
  *   **基于浏览器**：团队中的任何人都可以像使用工具一样找到交互，然后像用户一样体验该交互过程，看到用户看到的体验、他们点击的按钮、他们获得的结果等等。\n\
  *   **从用户获取数据**：编排者有机会标记特定类型的交互，并向用户询问有关其体验的问题。例如，可以通过指定一些上下文，然后对遇到该上下文的一小部分用户进行调查来实现。这些调查可能会要求用户评价他们的体验，回答一两个问题，或表明他们获得了好的还是坏的结果。\n\
  \n投入检查交互过程的判断标准：\n\n*   如果你需要广泛的人员能够理解交互过程。例如，让体验创建者和业务利益相关者了解用户是如何体验智能系统的。\n* \
  \  如果你需要建立支持能力来帮助处理错误。工具可以让非实现专家的普通人参与进来。\n*   如果你的系统存在高成本错误，并且你预计编排的主要部分将涉及定期缓解，那么你将需要投入检查交互过程。\n\
  \n\n\n## 平衡体验\n\n随着问题、用户群体和智能的变化，会带来优化体验的机会。例如，当智能是全新的且质量较差时，体验可能会非常被动。也许它不会频繁出现，也许它以用户容易忽略的方式呈现。但随着时间的推移，智能会变得更好，用户可能会通过更具强制性的体验获得更积极的结果。\n\
  \n用于平衡体验的投入层级包括：\n\n*   **临时方案**：通过修改代码并重新部署软件来改变体验。\n*   **参数更新**：编排者可以更改影响体验的参数，并以相对较低的成本（例如在智能更新时）推送这些参数。参数可能包括：\n\
  \    *   交互频率。\n    *   提示的颜色或大小。\n    *   体验中使用的文本。\n    *   自动化操作的阈值。\n    * \
  \  等等。\n*   **体验备选方案**：创建多种体验，编排者能够（使用类似于参数的方式）在它们之间切换。例如，你可以创建一个带有微妙提示的体验版本、一个带有醒目提示的版本，以及一个自动化操作的版本。然后编排者可以在这些版本之间切换，以随时间推移实现目标。\n\
  *   **体验语言**：编排者可以脱离代码变更来编写和部署体验，类似于将智能与实现分离。这可以通过在客户端下载并执行的脚本中指定体验来实现。或者，它可能受到更多限制，以便非工程师也能安全地进行更改；例如，一种具有受限运行时的体验标记语言。\n\
  \n投入平衡体验的评判标准：\n\n*   如果你的编排团队没有工程资源，那么你可能希望为体验创建一些非工程性的控制手段。\n*   如果向客户部署新的客户端代码需要很长时间，你可能希望投入资源，通过参数和数据文件更新来控制体验。\n\
  *   如果你认为在智能系统的生命周期内会多次更改体验，你可以选择投入资源使其易于更改。\n*   如果以上情况都不符合——你确实有工程资源，可以轻松部署代码，并且预计不会有太多更改——那么采用临时方案进行体验更新几乎肯定更便宜。\n\
  \n## 覆盖智能\n\n覆盖智能涉及识别少数上下文，并手动编写智能应为这些上下文提供的答案。你可能希望这样做是为了纠正代价高昂（或令人尴尬）的错误。你可能希望这样做是为了优化一些常见的上下文。你可能希望这样做是为了支持某些业务目标（例如推广系统中的某个内容）。你可能不想过多地覆盖智能——但当你需要时，你会非常需要它。\n\
  \n用于覆盖智能的投入层级包括：\n\n*   **临时方案**：依赖智能创建者破解学习过程以尝试实现特定结果（这非常困难），或者依赖工程师将所需的覆盖硬编码到代码中并部署给客户。\n\
  *   **作为智能源**：将覆盖视为一个非常简单的智能源，与系统的其他智能一起部署，并在运行时具有最高优先级。也许使用某种简单格式的数据文件来表示，该文件将上下文映射到结果。\n\
  *   **基于工具**：将覆盖视为一个智能源，但创建工具来支持编排者。工具应包括以下功能：\n    *   确保要覆盖的上下文被正确指定。\n    * \
  \  提供关于指定上下文的普遍性以及这些上下文的当前智能响应的反馈。\n    *   提供关于现有覆盖的反馈，包括覆盖的数量以及它们影响的用户数量。\n  \
  \  *   跟踪谁在进行覆盖以及覆盖结果的好坏。\n    *   管理覆盖的过期。\n*   **基于浏览器**：将工具集成到一个支持套件中，包括在一个地方查找交互、查看交互和覆盖交互的方法。\n\
  \n投入覆盖智能的评判标准：\n\n*   如果你的系统可能犯下代价非常高昂的错误，你几乎肯定希望投入资源进行智能覆盖，可能还需要围绕这里讨论的工具添加跟踪和工作流管理。我们将在下一章关于处理错误的内容中更详细地讨论这一点。\n\
  *   覆盖智能对于智能创建者来说也是一个非常有用的缓冲。你最不希望看到的是，智能系统中的大量参与者使用产品，发现无数小问题，并将其作为针对智能创建过程的缺陷提交。智能会犯错误。因为每个缺陷而责备创建者无济于事。拥有覆盖一些更重要问题的能力可以让每个人都感觉更好。\n\
  \n## 创建智能\n\n编排的一个重要部分是控制和创建驱动智能系统的智能。本节回顾并总结了一些有助于智能成长和产生影响的投入。\n\n创建智能的投入可能包括：\n\
  \n*   **智能管理**：这将包括以下内容：\n    *   控制智能更新和部署的时间与方式。\n    *   控制智能存在于何处。\n    *  \
  \ 向系统添加新的智能源。\n    *   控制智能如何组合。\n*   **自动化机器学习实现**：这些系统定期生成新的智能，几乎不需要或完全不需要监督。这些系统可能提供控制手段来改变智能生成的方式，包括以下内容：\n\
  \    *   使用多少数据。\n    *   使用哪些数据。\n    *   运行的频率。\n    *   花费多少时间搜索好的模型。\n    *\
  \   建模过程中任何其他可调参数。\n*   **智能创建环境**：收集捕获上下文和结果的遥测数据，并使其可用于机器学习，包括尝试新的机器学习算法、新的特征工程以及整合新的见解。这些可以产生临时的新的智能，或找到改进现有自动化学习系统的方法。\n\
  *   **特征工程支持**：智能创建者能够非常轻松地尝试新特征，如果发现有效的特征，能够快速安全地将其部署给客户。\n*   **遥测系统**：编排者可以指定要收集哪些数据以及收集多少数据。\n\
  \n投入创建智能的评判标准：\n\n智能创建对于智能系统来说相当重要（名字里就写着呢）。你最终可能会投入多个系统来支持这个过程。\n\n最有效的工具往往能够：\n\
  \n*   帮助防止错误。\n*   自动化繁琐的任务。\n*   简化多步骤流程。\n*   留下一些简单的审计追踪。\n\n在构建支持智能创建的工具时，避免试图干扰核心的智能创建工具（如机器学习系统或运行时）。这些通常是标准的，对其进行创新不太可能成为你价值主张的核心。\n\
  \n\n\n## 总结\n\n本书介绍了许多对运行智能系统至关重要的工具。本章总结了一些关键工具，包括投资这些工具时需遵循的标准和方法。这些工具包括：\n\n\
  *   监控成功标准\n*   检查交互\n*   平衡体验\n*   覆盖智能\n*   创造智能\n\n在实施过程中，即使不在这方面投入太多，你也可以构建一个成功的智能系统。但在系统的整个生命周期中，你很可能需要完成所有这些活动。你可以自行决定投入多少人力，以及愿意在工具上投入多少资源。\n\
  \n请记住，拥有良好的工具可以让你随着时间的推移，将人员配置从系统的创建者（他们通常喜欢从事令人兴奋的新事物）转变为熟练的编排者（他们需要成为追求持续卓越的通才）。这两种技能组合截然不同。\n\
  \n通常，编排环境会随着智能系统的发展而演变，在长期内，资金会投入到那些能带来最大价值的领域，直到进一步的投资不再有意义。\n\n## 思考题…\n\n阅读本章后，你应该能够：\n\
  \n*   了解保持智能系统健康所需的常用工具。\n*   理解如何以低投入起步，并随时间推移逐步扩大投入。\n*   对各类工具何时发挥作用，以及哪些工具对你的智能系统最为重要有所了解。\n\
  \n你应该能够回答如下问题：\n\n设想一个当今存在的重要智能系统。\n\n*   你认为它在哪个领域花费的编排时间最多：监控成功、检查交互、平衡体验、覆盖智能，还是创造智能？\n\
  *   你会提出什么建议来降低该领域的成本？\n\n"
- '# 24. 处理错误


  错误在所难免。人类会犯错。人工智能也会犯错——而且可能错得很离谱。错误可能令人恼火，也可能带来灾难性后果。


  每个智能系统都应有一套识别错误的策略；例如，通过监控关键指标，并为用户提供便捷的反馈问题途径。


  每个智能系统也应有一套处理错误的策略。或许是通过更新智能；或许是通过人工手动覆盖某些行为；或许是为受影响的用户提供变通方案或退款。


  有些错误极难发现。有些错误极难修复（且不引入新错误）。还有些错误需要很长时间才能修复（部署新模型需要数小时，或提出新智能策略需要数月）。


  本章将讨论处理错误的方法，包括以下主题：


  *   系统可能犯的错误类型（尤其是严重错误）。

  *   智能可能犯错的原因。

  *   减轻错误影响的方法。


  每位智能系统的编排者都应正视错误存在的现实。


  ## 可能发生的最坏情况


  问问自己：我的智能系统可能做的最坏的事情是什么？


  *   也许你的智能系统会犯一些小错误，比如闪烁一个用户不关心的指示灯，或播放一首他们不喜欢的歌曲。

  *   也许它会浪费时间和精力，自动化完成一些用户不得不撤销的操作，或导致用户将注意力从真正关心的事情上移开，转而关注智能系统正在犯错的地方。

  *   也许它会因决定消耗大量 CPU 或带宽，或意外隐藏了你最好（也最赚钱）的内容，而让你的业务蒙受经济损失。

  *   也许它会因在某个地方采取违法行为，或因中断客户或竞争对手的运营能力，导致你最终可能需要承担赔偿责任，从而让你面临法律风险。

  *   也许它会因删除重要内容、熔化熔炉，或在用户之间发送攻击性信息，而造成无法挽回的损害。

  *   也许它会伤害到人——甚至导致人员死亡。


  大多数时候，当你思考你的系统时，你会想到它将多么出色，会带来多少好处，会有多少人喜爱它。你会想要忽略它的缺陷；你甚至会试图无视它们。


  不要这样做。


  找出你的系统可能做的最坏的事情。


  然后找出第二坏的事情。


  接着找出第三坏的事情。


  然后让另外五个人也做同样的事情。接纳他们的想法并予以认可。


  然后，当你列出了十五件你的智能系统可能做的真正糟糕的事情后，问问自己：这能接受吗？


  因为这些类型的错误终将发生，它们会很难发现，也很难纠正。


  如果你系统可能做的最坏的事情糟糕到无法想象，你可能需要设计一个不同的系统——一个无论智能系统如何指示，都永远、绝对不会做出那种坏事的系统。也许你确保人类参与决策过程。也许你采用一种不那么强硬的体验方式。也许你找到一件完全不同的事情来做……


  因为智能系统会犯错，最终，最坏的情况会发生。


  ## 智能可能出问题的方式


  智能系统会因多种不同原因而犯错。其中一些是实施或管理问题；另一些则是智能本身的问题。本节将讨论这些潜在的问题来源，包括以下内容：


  *   系统宕机

  *   模型宕机

  *   智能错误

  *   智能退化


  修复错误的第一步是理解其成因。


  ### 系统宕机


  有时计算机会崩溃。有时网络会很慢。有时网线会被切断。有时系统在交互方式上存在微妙的缺陷。这些都是智能系统实施或运维方面的问题，但它们可能以与智能错误相同的方式显现出来，例如在用户报告、问题升级和指标恶化中。


  在大型系统中，隔离这类问题可能很困难，尤其是当智能分布在处于不同升级状态的客户端和位于不同数据中心的多个服务器之间时。


  灾难性宕机通常很容易发现——因为所有指标都会崩溃。但部分宕机可能更隐蔽。例如，假设你 1%的流量被导向某个特定服务器，而该服务器以某种疯狂的方式崩溃了。你 1%的用户体验很差，也许他们正在反复报告这个问题……但这只是你用户群的
  1%。99%的用户并未受到影响。你会注意到吗？


  系统宕机应该很少发生，并且应立即修复。如果它们变得普遍，将会瘫痪智能工作——并且对团队士气也极为不利。




  ### 模型故障


  与系统故障相关，模型故障更多是一个实现问题而非智能问题——但它会表现出类似的症状。


  模型故障可能发生在以下情况：


  *   模型文件在部署时损坏。

  *   模型文件与将上下文转换为特征的代码不同步。

  *   智能创建环境与智能运行时环境不同步。

  *   智能与经验不同步。


  这些问题可能非常难以发现——想象一下，如果某些特征代码在智能创建环境中更新了，但在智能运行时环境中却没有更新。那么，当使用更新后特征代码的新模型被推送到使用过时特征代码的运行时环境时，它就会感到困惑。它会得到它不期望的特征值，会犯错误。因此，运行时环境的准确率可能比实验室环境低
  5%。实验室中的所有测试都表明智能运行良好，但用户却体验到了稍差的效果。


  由于这些问题极难发现，每个智能实现都应该有反复的检查，以确保智能创建环境与运行时环境同步，所有内容都正确部署，并且所有组件都保持同步。


  ### 智能错误


  当构成智能的模型与真实世界不完全匹配时（它们确实不匹配），就会产生错误。回想一下，创建智能是在学习一个能够表征问题的非常复杂的模型与学习一个能够很好地泛化到新上下文的模型之间进行平衡。总会存在差距——即模型不完全正确的地方。


  而这些差距会导致错误，这些错误很难通过智能创建来纠正。你可以尝试另一种类型的模型，但它会产生自己（新的）类型的错误。你可以获取更多数据，但这会带来收益递减。你可以尝试更多特征工程——这通常会有帮助。但这类错误将始终存在。


  它们会显得有点随机。它们会随时间变化（随着训练数据的变化）。它们不容易纠正——这需要持续的努力，并且越到后面会越困难。


  智能错误的一个额外挑战是确定智能的哪个部分负有责任。当模型是松散耦合时（例如，当它们有执行顺序，并且第一个对某个上下文做出判断的模型获胜时），很容易确定是哪个模型给出了错误答案。但当模型是紧密耦合时（例如，当多个模型的输出通过复杂的启发式规则或元模型组合时），错误将更难追踪。如果六个模型各自对某个错误负有部分责任，你该从哪里开始？


  ### 智能退化


  当一个开放的、随时间变化的问题发生变化时，你昨天拥有的智能今天就不会那么好了。变化的问题会加剧一般的智能错误，因为即使你什么都不改变，新的错误也会出现。此外，为“新”问题积累训练数据需要时间，这意味着你可能需要等待才能做出响应，并且你可能永远无法获得足够的训练数据来很好地学习问题的任何特定版本（等你学会时，它已经不再相关了）。


  变化主要有两类：


  1.  新上下文随时间出现（或旧上下文消失），在这种情况下，你需要创建新的智能来处理新上下文，但现有的训练数据仍可用于旧上下文。

  2.  上下文的含义随时间变化，在这种情况下，现有的训练数据可能具有误导性，你需要专注于新的遥测数据来创建有效的智能。


  理解你的智能系统退化的一种方法是保留旧版本的智能，并在当前数据上运行一系列先前的智能——昨天的智能、五天前的智能、十天前的智能，等等。通过观察错误如何变化，你可以直观地了解你的问题是如何演变的，并在选择如何适应时利用这种直觉。


  ## 缓解错误


  随机、低成本的错误是可以预期的。但是当错误激增、变得系统化、或者变得有风险或代价高昂时，你可以考虑采取缓解措施。


  本节讨论以下缓解错误的方法：


  *   投资于智能

  *   平衡体验

  *   调整智能管理参数

  *   实施护栏

  *   覆盖错误


  ### 投资于智能


  在一个健康的智能系统中，智能会不断改进。处理错误的一种方法是等待智能赶上。


  事实上，几乎所有其他缓解错误的方法都会降低智能系统对没有遇到问题的用户的价值（通过稀释体验）；或者从长远来看会增加复杂性和维护成本（通过添加必须维护的手动调整）。因此，在可能的情况下，改进智能是处理错误的一个好方法。在针对错误方面，投资改进智能的最佳方式如下：


  1.  获取更多相关的遥测数据或包含错误发生上下文的训练数据。这可能让智能创建几乎无需太多工作就开始解决问题。

  2.  通过将错误分类（按地区、年龄、用户属性等）并对类别进行优先级排序，帮助智能创建者优先处理他们花费时间的系统部分。然后，智能创建者可以致力于有助于这些特定领域的特征和建模，可能通过分区和聚焦建模来实现。

  3.  在人员和工具方面为智能创建提供更多资源。


  这些投资将提高智能的整体质量，随着时间的推移，水涨船高。


  而投资于智能最糟糕的方式，可能就是像对待软件缺陷一样追踪智能错误，并要求智能创建者按顺序一个接一个地修复它们，直到一个不剩。这不是它的运作方式。如果存在你必须修复的错误，那么你应该考虑本节讨论的其他缓解方法之一。


  ### 平衡体验


  如果错误是低级别的、随机的智能错误，或者是由智能退化引起的，那么它们将很难解决。在这些情况下，你可能希望重新平衡体验，使其不那么强硬，并降低错误的代价。


  如果问题足够严重，你可以考虑基本上关闭某个智能体验，直到你能够掌控问题为止。


  有很多章节讨论了平衡智能和体验的方法，因此我在此不再赘述。


  ### 调整智能管理参数


  如果错误是由于退化引起的——也就是说，新上下文快速出现或旧上下文的含义发生变化——你可能能够通过更快地训练和部署新模型来解决它们。


  你也可以更改所使用的训练数据，例如，更快地淘汰旧训练数据（当上下文含义发生变化时），或者在遥测数据或训练中对新上下文进行过采样（这有助于处理含义变化以及新上下文快速出现的情况）。


  这些方法类似于投资于智能，但它们可以更具反应性。例如，当节假日来临、恶劣天气事件发生或新产品推出时，你的问题可能比平时变化得更快。编排器可能知道这一点，并调整一些参数，而不是等待智能创建者学习如何预测这些类型的事件。




  ### 实施护栏


  有时你会遇到一些愚蠢的错误。任何正常人看到这些错误都会知道它们不可能是对的。例如：


  *   当颗粒烤炉温度达到 800 度时，你绝不应该再往火里添加燃料。

  *   当用户只有 10 岁时，你绝不应该向他们展示恐怖电影。


  在这些情况下，你可以尝试让智能创建算法学会这些规则。你可以收集针对性的训练数据。你可以不断催促智能创建者。你可以投入数月的工作……


  或者，你可以实施一个简单的启发式规则，在智能即将做出明显荒谬的行为时进行干预——这就是护栏。


  使用护栏时，请确保：


  1.  保持保守——只覆盖明显的问题，不要被引诱去手动创建复杂的智能。

  2.  重新审视你的决策——通过跟踪护栏的性能（和成本），并随着智能的提升或问题的变化，移除或放宽那些变得不那么重要的护栏。


  ### 覆盖错误


  有时别无选择；你的系统会犯下代价高昂的错误，而这些错误无法通过其他方式缓解，你只能手动覆盖这些错误。例如：


  *   你运营一个搜索引擎，而针对“游戏”这个查询的顶级结果与游戏无关。

  *   你运营一个反垃圾邮件服务，而它正在删除来自合法企业的所有邮件。

  *   你运营一个电子商务网站，而它因“违反政策”下架了一款产品，但该产品并未违反政策。

  *   你运营一个趣味网页查找器，而它正在将互联网上最受欢迎的笑话网站标记为“不有趣”。


  当这些错误足够重要时，你可能需要设计特殊的用户体验，让用户能够报告问题。你可能还需要围绕这些报告的响应建立一些流程。例如，你可以创建一个支持小组，配备合适的工具和工作流程，每周
  7 天、每天 24 小时，在一小时内检查每一个报告的错误。


  与护栏一样，请确保谨慎使用覆盖功能，并持续跟踪覆盖的质量和成本随时间的变化。


  ## 总结


  错误是智能系统的一部分，你应该制定一个计划来衡量错误并处理它们。这个计划的一部分是理解你的系统可能做出哪些类型的坏事。对自己诚实。在想象问题时要有创意。


  为了解决问题，了解问题的原因会很有帮助。错误可能发生在以下情况：


  *   你的智能系统的某个部分发生故障。

  *   你的模型被错误地创建、部署或解释。

  *   你的智能与问题并非完美匹配（而且它确实不是）。

  *   问题或用户群体发生了变化。


  一旦你发现了问题，可以通过多种方式缓解它：


  *   在智能方面投入更多。

  *   重新平衡用户体验。

  *   更改智能管理参数。

  *   实施护栏。

  *   覆盖错误。


  一个主动的错误缓解计划可以让你的智能系统的其他部分更加激进——并产生更大的影响力。接受错误，并明智而高效地缓解它们，是编排智能系统的重要组成部分。


  ## 思考题…


  阅读本章后，你应该：


  *   理解错误何时以及如何使智能系统面临风险。

  *   理解如何判断智能系统是否正常工作，并识别其可能失败的常见方式。

  *   能够使用一系列常见方法来缓解错误，并知道何时使用各种方法。


  你应该能够回答如下问题：


  *   你所知道的最普遍的智能系统错误是什么？

  *   代价最高的错误是什么？

  *   设计一个系统来处理这两个错误之一（普遍的或代价高的）。

  *   它是否适用于另一个错误？为什么适用或不适用？


  '
- '# 25. 对手与滥用


  每当你创造出有价值的东西时，总会有人想从中牟利。智能系统也不例外。如果你投入精力、金钱和时间来吸引用户，就会有人试图从这些用户身上赚钱。如果你建立了一个给竞争对手带来压力的业务，就会有人试图让你的业务更难运营。


  以下是滥用行为可能影响智能系统的一些常见方式：


  *   滥用者试图从你的用户身上获利，例如向他们发送垃圾邮件。

  *   滥用者试图窃取有关你的系统或用户的信息，以便复制或出售。

  *   滥用者试图利用你的平台来托管对其他系统的攻击。

  *   滥用者试图毒化你的系统，使其无法按你期望的方式运行。


  其中一些活动是非法的，但也有一些并非如此。而且，即使这些活动是非法的，互联网的全球性也使得找到攻击者非常困难，更不用说将他们绳之以法了。


  正因如此，所有成功的智能系统都需要准备好防御滥用行为。


  本章解释了滥用行为的基础知识，以便你理解这一挑战，准备好在你遇到滥用时识别它，并掌握一些工具来帮助你的智能系统更难被滥用。


  ## 滥用是一门生意


  关于滥用，首先要了解的是它是一门生意——一门大生意。绝大多数实施滥用行为的人都是为了赚钱（尽管也有一小部分滥用是为了好玩、社会正义或支持间谍活动）。滥用者赚钱的方式包括以下几种：


  *   引流：通过欺骗你的智能系统向用户展示滥用者希望他们看到的内容。这本质上是广告。滥用者与某个网站达成协议，每将一名用户从你的网站引导到目标网站，就能获得报酬。这通常被称为“垃圾邮件”。

  *   窃取个人信息：包括社会安全号码、联系方式、密码、银行信息等。滥用者可以直接使用这些信息，或者将其转售给其他滥用者以快速获利。

  *   入侵计算机：通过诱骗用户在计算机上安装恶意软件。一旦用户在计算机上安装了恶意软件，他们就可以窃取个人信息或利用用户的计算机发起进一步攻击。当滥用者能够利用你的智能系统与用户沟通时，他们可以诱骗用户做出各种疯狂的事情。

  *   提升内容：通过欺骗你的智能系统按他们想要的方式运行。例如，滥用者可能在电子商务网站上对某产品发布虚假评论，以使该产品更突出并增加销量。

  *   压制内容：通过试图损害你的智能系统或伤害你系统的其他用户。例如，滥用者可能将竞争对手的内容举报为违规内容。

  *   直接盗窃：盗窃内容，可能用于转售，例如在在线游戏中窃取数字内容。


  滥用者已经为所有这些（以及更多）行为创造了市场，因此任何找到方法在你的智能系统上实施此类行为的滥用者，都很容易将这些活动转化为金钱。




  ## 滥用规模


  想象一下，你找到一项活动，每做一次能赚到十分之一美分。点击一个按钮，选择一个选项，再点击另一个按钮——砰！你的银行账户里就多了十分之一美分。


  这听起来毫无意义。你得重复做一千次才能赚到一美元，做十万次才能赚到一百美元。真是浪费时间！


  但现在想象一下，你可以编写程序让计算机替你完成，而计算机可以每小时重复一百万次，并且永不停歇。这就是互联网滥用。通常，互联网滥用涉及那些极难成功（比如诱骗他人交出密码）或每次成功价值极低（比如为网站引流）的活动——但滥用者会一遍又一遍地重复这些低价值活动。而且他们能从中赚到可观的收入。


  这意味着，你可能某天突然就面临滥用问题。你以为一切安好，但滥用者可能正在尝试不同的活动，衡量用户上当的频率，或者他们能从你的用户身上获取多少流量，计算着收益——一旦发现有利可图，他们就能迅速扩大规模。


  滥用问题很容易在一夜之间从零演变成灾难。


  ### 评估你的风险


  如果满足以下任何条件，你的智能系统就会引起滥用者的兴趣：


  *   **拥有大量用户**：随着你的智能系统越来越受欢迎，用户数量也会增加。这意味着滥用者可以扩大攻击规模，每次攻击赚取更多收益。他们值得花时间在你的智能系统上做实验，因为一旦找到赚取十分之一美分的方法，他们就能大量获利。

  *   **滥用者可以利用你的系统与用户沟通**：特别是当他们能在沟通内容中嵌入网址时。沟通形式可以是消息、电子邮件、网站、图片、评论、留言——任何形式都可以。滥用者会通过欺骗和垃圾信息，从与用户的沟通中牟利。

  *   **系统与用户生成内容交互**：并且智能系统在决定展示哪些内容、如何注释或显示内容、以及如何排序展示内容时扮演任何角色。影响用户看到的内容，就会影响他们与哪些内容互动——以及相关的资金流向。滥用者会试图介入这种循环。

  *   **系统犯的错误会让某些人蒙受经济损失**：特别是当损失可以指向特定对象时。例如，智能烤面包机烤焦了某个特定品牌的冷冻馅饼；或者你的智能系统正在让非智能的竞争对手破产。

  *   **系统能提供任何其他能让有心人牟利的功能**：把滥用者想象成聪明、道德可疑且时间充裕的黑客。准备好对他们的创造力感到惊讶吧。


  ## 滥用问题的表现


  当滥用者针对你的智能系统扩大攻击规模时，他们会制造出异常的使用模式。你通常可以通过遥测数据发现这些模式，寻找以下迹象：


  *   大量用户以退化方式使用你的智能系统（极度专注于能让他们赚钱的部分）。

  *   与正常使用相比，某些场景的活动量出现激增。

  *   某些场景的结果分布发生剧烈变化（因为滥用者向你发送了错误信息）。

  *   用户投诉和问题报告中的模式。


  滥用者可能会试图伪装自己，但他们很难完全模仿合法用户的活动，因此只要你花时间寻找，通常就能发现他们的攻击。你也可以通过设置剧烈变化的警报，事后发现他们的攻击。系统某部分的流量突然大幅增加？应该有人知晓。投诉量翻倍？应该有人去查看。


  ## 对抗滥用的方法


  如果滥用真的成为问题，以下是一些应对方法：


  *   为你的产品增加成本。

  *   降低对滥用者的吸引力。

  *   与对手进行机器学习对抗。

  *   将对手排除在循环之外。


  ### 增加成本


  你可以阻止滥用并赚更多钱！呜呼！


  不过，提高收费也可能吓跑你的合法客户，所以这可能不是一个选项。但请记住，滥用是一门生意，阻止滥用的最佳方法是让滥用者更难获利。


  例如，如果滥用者需要满足以下条件，那么从滥用中获利就会变得更难：


  *   为你的智能系统上的每个账户支付 10 美分。

  *   每发布一条评论都要输入一些歪歪扭扭的验证码字符。

  *   每次发起攻击都要购买一台智能烤面包机。


  当这些成本对滥用者的影响大于对合法用户的影响时，效果最佳。例如，每个好用户只需输入一次验证码，而滥用者每次活动都需要输入。如果操作得当，增加成本可能会让滥用者无利可图，而合法用户甚至察觉不到。


  ### 降低对滥用者的吸引力


  你可以修改产品，减少那些吸引滥用者的功能，例如：


  *   移除或限制沟通渠道。

  *   在网站上存储更少的用户个人信息，并谨慎选择展示位置。

  *   减少用户反馈对内容呈现方式的影响。


  这些措施也可能降低产品对真实用户的实用性，但有时一两个小小的调整就能彻底打破滥用者获利的能力。


  ### 与对手进行机器学习对抗


  你可以使用机器学习来识别滥用行为，然后将其删除。我的意思是，看到这里你可能会想：“这本书通篇都在讲机器学习，所以机器学习一定是阻止滥用的正确方法，对吧？”


  不幸的是，并不完全如此。机器学习是一个好工具，但滥用者非常擅长改变攻击模式来欺骗机器学习。而且，滥用者改变攻击的成本通常远低于你追赶他们并调整机器学习模型的成本。


  你可以用机器学习来对抗滥用，它可能会有所帮助，但我建议你首先考虑其他选项，并在投入过多之前，确保你理解机器学习究竟如何影响滥用者的商业模式。


  ### 将对手排除在循环之外


  一旦发现滥用行为，你应该封禁滥用者用于发起攻击的一切，包括账户、烤面包机、颗粒烤架、搞怪网站、洒水系统——所有的一切。这将确保滥用者在扩大攻击规模时付出尽可能高的成本。他们昨天用来攻击你的基础设施已经报废，所以他们今天需要重新构建基础设施。


  另一个选择是，只从可信用户那里创建智能。想象一下，你有 10 万名用户，他们多年来一直使用你的智能服务，产生遥测数据和带有结果反馈的场景用于训练。这些用户相当安全——他们不是滥用者为发起新攻击而创建的账户。他们是你的客户。通过将智能创建限制在“已知良好”的用户范围内，你通常可以完全避免滥用问题。




  ## 摘要


  每当你创造出有价值的东西时，滥用者就会出现，试图从你的辛勤工作中获利，从而将你的用户和智能系统置于风险之中。


  绝大多数滥用行为都是为了赚钱。通过理解滥用者如何获利，你可以控制你的智能系统对他们的吸引力。通常，对抗滥用最廉价的方式是对系统的工作方式进行一些微调，让滥用者无法找到稳定盈利的方法。


  滥用行为通常针对那些可以大规模复制的低价值活动——比如每天进行一百万次、每次获利十分之一美分的操作。你通常可以在遥测数据中看到滥用行为，表现为与常规使用模式不符的活动峰值。虽然你可能无法实时阻止它，但通常可以判断自己是否正在遭受攻击。


  以下是一些可以抑制滥用行为的做法：


  *   提高实施滥用行为的成本。

  *   调整你的智能系统，使其对滥用者的价值降低。

  *   使用一些机器学习方法（但要小心——滥用者在这方面占优势）。

  *   对新用户保持警惕，更多地信任你的老用户，并删除所有涉及已确认滥用行为的用户。


  ## 思考题…


  阅读本章后，你应该能够：


  *   了解什么是滥用者以及他们的行为。

  *   能够识别出那些能让你的智能系统对滥用者失去吸引力的简单调整。


  你应该能够回答以下问题：


  思考你最喜欢的智能系统。


  *   哪一项简单的改动会使其对滥用者更具吸引力？

  *   哪一项简单的改动会使其对滥用者失去吸引力？


