  ## 要点总结


  1.  擦除操作有多种解释。在空间分析中，其定义是基于与指定擦除要素的空间叠加来擦除要素或要素的部分。


  2.  根据具体实现方式，擦除基本上等同于叠加分析中的差异操作，后者是集合论操作之一。


  3.  您可以使用差异叠加来擦除矢量数据集（点、线或多边形）中的数据。


  4.  擦除点时，您最终会擦除或保留整个点，因为无法将点切割成多个部分。


  5.  擦除线或多边形时，如果要素完全与擦除要素重叠，则可以擦除整个要素；但如果要素仅部分重叠，则该要素将被修改而非移除。


  # 第三部分机器学习和数学


  # 9. 插值


  在本书前四章介绍了空间数据的基础知识，并在过去四章介绍了一些基本的 GIS 操作之后，现在是时候进入最后四章了，您将在此看到一系列应用于空间数据的统计和机器学习技术。


  本章将介绍插值，这是进入机器学习领域的一个良好切入点。本章首先介绍插值的定义和直观解释，然后介绍一些在 Python 中的示例用例。




  ## 什么是插值？


  插值是一项对大多数人来说相对直观的任务。从高层次来看，插值意味着填补数字序列中的缺失值。例如，我们来看下面这个数字列表：


  *   1, 2, 3, 4, ???, 6, 7, 8, 9, 10


  许多人很容易就能发现，数字 5 应该放在写有 ??? 的位置。让我们试着理解为什么这如此简单。如果我们想用图形表示这个列表，可以将数值与列表中的位置（索引）对应绘制，如图
  9-1 所示。


  ![](img/526781_1_En_9_Fig1_HTML.jpg)


  一张图表展示了在数值列表中进行插值。纵轴标记为“数值”，取值范围从 10 到 0，间隔为 2；横轴标记为“列表中的位置”，取值范围从 0 到 10，间隔为 2。共有九个数值（1,
  2, 3, 4, 6, 7, 8, 9, 10）以星号形式绘制。


  图 9-1


  在数值列表中进行插值。图片由作者提供


  看到这个，我们很容易倾向于认为这些数据遵循一条直线，如图 9-2 所示。


  ![](img/526781_1_En_9_Fig2_HTML.jpg)


