  本章这一部分需要掌握的重点是，地理数据“只是数据”，但带有地理参考。这些数据可以存储为不同格式或不同坐标系，从而使事情变得复杂，但最终，您只需确保对数据内容有一定程度的理解即可。


  您可以使用许多不同的工具来处理地理数据。这些工具的目标通常是让您的工作更轻松。作为本介绍的最后一个步骤，让我们简要介绍一下您在地理数据之旅中可能遇到的各种 Python
  工具。


  ## Python 地理数据处理工具概览


  以下是您在使用 Python 处理地理数据之旅中可能需要了解的 Python 包列表：


  **Geopandas**


  通用的 GIS 工具，采用类似 pandas 的代码语法，使其对数据科学领域非常友好。


  **Fiona**


  用于读写地理空间数据。


  **Rasterio**


  用于读写栅格数据的 Python 包。


  **GDAL/OGR**


  一个可用于在不同 GIS 文件格式之间进行转换的 Python 包。


  **RSGISLIB**


  一个包含遥感工具以及栅格处理和分析功能的包。


  **PyProj**


  一个可在多个地理参考系之间转换坐标的包。


  **Geopy**


  使用坐标查找邮政地址，或反向查找。


  **Shapely**


  用于操作平面几何对象。


  **PySAL**


  Python 中的空间分析包。


  **Scipy.spatial**


  基于著名的 scipy 数据科学包的空间算法。


  **Cartopy**


  用于绘制地图的包。


  **GeoViews**


  用于交互式地图的包。


  一个小提醒：由于 Python 是一个开源环境，并且这些库主要由无偿的开源开发者开发和维护，因此总有可能发生某些更改或变得不可用。这是使用开源软件的风险。大多数情况下，不会出现如此严重的问题，但问题确实可能发生，并且偶尔会发生。


  ## 关键要点


  1.  笛卡尔坐标系和极坐标系是两种可选的坐标系，用于在二维欧几里得空间中指示点。


  2.  地球是一个椭球体，这使得二维欧几里得空间成为一个糟糕的表示方式。针对这种现实世界场景，存在其他坐标系。


  3.  地理数据是包含地理空间参考的数据。地理数据可以有多种不同的形式和大小。只要您有软件实现（或构建它的技能），您就能在不同数据格式之间进行转换。


  4.  存在许多 Python 包，它们为您完成了大量繁重的工作。


  5.  使用 Python 的优势在于，您可以在地理数据处理方面拥有很大的自主权，并且可以受益于生态系统中大量的地理数据以及其他数据科学和人工智能包。


  6.  Python 的一个潜在缺点是软件是开源的，这意味着您无法保证您偏好的库在未来仍然存在。Python 也不适合长期数据存储，需要辅以相应的数据存储解决方案（例如，数据库或文件存储）。


  '
- '# 2. 坐标系与投影


  在上一章中，您已经了解了坐标系的介绍。您看到了一个示例，说明如何使用笛卡尔坐标系和极坐标系在平坦的二维欧几里得空间中标识点。当时已经提到，现实世界的场景要复杂得多。


  当您制作地图时，您展示的是位于地球上的事物（物体、图像等）。地球并不遵循欧几里得示例中展示的规则，因为地球是一个椭球体：一个并非完美圆形的球体。这使得地图和坐标系的计算比高中数学教给我们的坐标知识要复杂得多。


  为了更清楚地说明问题，让我们看一个飞机导航的例子。飞机航班是说明这个问题的绝佳例子，因为它们通常覆盖很长的距离。在测量您露台的大小时，考虑地球曲率确实无关紧要，但在跨越大陆移动时，它会产生巨大影响。


  想象一下，您正使用这张世界地理的简图从巴黎飞往纽约。您可能非常熟悉这种在二维图像上展示世界地图的方式。


  一个合乎逻辑的第一印象是，从马德里到纽约的最快路线，我们应该沿着一条与纬线平行的线飞行。然而（起初可能令人惊讶），这**并非**最短路径。飞机最好经由北方弯曲飞行！


  原因是，越往北移动，纬线实际上越短。纬线环绕地球，因此在北极点，其长度为零，而在赤道，中间那条线是最长的。越靠近两极，环绕地球的距离越短。


  由于这个例子发生在北半球，最近的地极是北极。在北半球向北（朝向地极）弯曲飞行，飞机可以以更少的公里数到达目的地。图 2-1 说明了这一点。


  ![](img/526781_1_En_2_Fig1_HTML.jpg)


  一张参考地图显示，飞机航线在地图上并非直线。该图展示了纽约和马德里之间的距离，其上方路线比下方路线更短。


  图 2-1


  飞机航线在地图上并非直线。图片改编自 [*https://en.wikipedia.org/wiki/World_map#/media/File:Blue_Marble_2002.png*](https://en.wikipedia.org/wiki/World_map%2523/media/File:Blue_Marble_2002.png)（公共领域图片。2002
  年 2 月 10 日）


  现在让我们考虑一个例子，您正拿着一个圆形的足球。当从球上的一点到另一点时，您凭直觉就能说出哪条路径最快。如果您直视这个球，当您的手指从一点移动到另一点时，您会看到您的手划出一个类似图
  2-2 中的形状。


  ![](img/526781_1_En_2_Fig2_HTML.jpg)


  一张在二维视图中球体上最短路径并非直线的示意图。在中间两侧各有一个 X 标记，从一个 X 有一条曲线连接到另一个 X。


  图 2-2


  在二维视图中，球体上的最短路径并非直线。图片来源：作者


  在制作地图时，我们无法在三维空间中绘图，因此，我们需要找到某种方法将三维路径放到二维图像上。


  许多地图制作者提出了各种方法来解决这个无法解决的问题，本章的目标是帮助您理解如何有效处理这些从 3D 到 2D 的地图投影变形，这些变形将不断试图使您的地理数据处理工作复杂化。




  ## 坐标系


  虽然之前的讨论仅仅是直观上的，现在是时候逐步了解你所见概念的更正式定义了。由于我们暂时忽略点的高度（例如，相对于海平面），我们可以识别出三种类型的坐标系：


  *   地理坐标系

  *   投影坐标系

  *   局部坐标系


  让我们逐一介绍它们。


  ### 地理坐标系


  地理坐标系是我们在上一部分中一直在讨论的坐标系。它们尊重世界是一个椭球体的事实，因此使用经纬度的度数或弧度来表示点。


  由于它们尊重地球的椭球体特性，因此很难用此类坐标系制作地图或图表。


  #### 纬度和经度


  在地理坐标系中，我们谈论纬度和经度。通常，度数要么与北（赤道以北）和南（赤道以南）、东（格林威治子午线以东）或西（格林威治子午线以西）的说明一起表示。东/西和北/南也可以写成负坐标和正坐标。东和北取正值，而南和西取负值。


  尽管这是标准做法，但这可能会根据你所使用的地理坐标系的具体定义而改变。理论上，任何人都可以发明一个新的坐标系，并使其完全不同。实际上，有一些大家都习惯使用的标准，因此最好使用这些标准。


  #### WGS 1984 地理坐标系


  WGS 1984，也称为 WGS 84 或 EPSG:4326，是最常用的地理坐标系之一。它也是全球定位系统（GPS）的参考坐标系，广泛应用于众多应用中。让我们深入了解
  WGS 84 是如何设计的。


  WGS 1984 的设计目标是使坐标原点位于地球的质心。参考子午线或零子午线是 IERS 参考子午线。它非常接近格林威治子午线：仅向东偏移 5.3 角秒或 102
  米。


  还有更多具体的定义来界定 WGS 84，但到了这一点，信息变得非常技术性。引用 WGS 84 的维基百科页面：


  > *WGS 84 基准面是一个扁球体，赤道半径 a = 6378137 m，扁率 f = 1/298.257223563。WGS 84 引力常数（包括地球大气质量）的精确值为
  GM = 3986004.418×108 m3/s2。地球的角速度定义为 ω = 72.92115×10−6 rad/s。*


  你绝对不需要记住任何这些细节。但我确实希望它能让你了解地理坐标系定义必须有多详细。这解释了为什么其他人和组织能够提出替代定义。这就是为什么存在许多坐标系，也是为什么处理地理空间数据在开始时可能难以掌握的原因之一。


  #### 其他地理坐标系


  例如，ETRS89 是欧盟推荐用于欧洲地理数据的坐标系。它与 WGS 84 非常接近，但有一些细微差别，使得 ETRS89 不会因大陆漂移而改变。正如你将理解的，大陆漂移非常缓慢，考虑此类因素部分基于理论而非实际重要性。


  另一个例子是 NAD-83 系统，主要用于北美。由于地球是一个不完美的椭球体，该系统的创建者希望考虑北美与椭球体的偏差程度，以便在北美地区表现更好。


  ### 投影坐标系


  在制作地图时，我们需要将三维地球转换为二维形式。这个任务不可能完美完成：想象一下拿一个圆形的塑料足球，把它切开弄平。你永远无法将这个圆球粘贴成一个平坦的矩形，而不经历巨大的挣扎去寻找一种切割方式，使其看起来或多或少连贯。


  幸运的是，许多伟大的思想家在我们之前接受了这个挑战，并找到了“切割椭球地球并将其粘贴到矩形上”的绝妙方法。我们称之为投影，你可以想象三维地理坐标与正方形上的某个位置相匹配。这将中间的所有内容投影到其对应的位置。


  #### X 和 Y 坐标


  当使用投影坐标系时，我们不再谈论纬度和经度。因为纬度和经度仅适用于地球（椭球体）上的测量，但在平面上，我们可以放弃这种复杂性。一旦三维的经纬度坐标被转换为其投影的坐标，我们只需谈论
  x 和 y 坐标。


  X 通常是从原点向东的距离，y 是从原点向北的距离。原点的位置取决于你使用的投影。测量单位也因投影坐标系而异。


  #### 四种类型的投影坐标系


  正如你所理解的，所有投影坐标系都会存在变形。由于投影将三维球状形式上的位置放置到二维平坦矩形上，现实的一些特征得以保留，而其他特征则会丢失。


  没有一种投影比另一种更好。这里的问题在于你想要保留哪些类型的特征，并接受失去哪些特征。投影坐标系有四种类别，它们都确保现实的一个方面在投影上得到完美保留。


  在为你的项目选择地图投影时，关键选择是决定哪种变形最合适，以及你绝对想要保留哪些特征。


  ##### 等面积投影


  第一种投影类型是保留特定特征面积的投影。你可能没有意识到，但你看到的许多地图并不尊重等面积。例如，如果你在谷歌地图上缩小一点，你会看到格陵兰岛在谷歌地图选择的投影中显得巨大。


  对于某些用例来说，这可能是一个大问题。等面积投影旨在确保特定特征（例如国家或其他）的表面积保持不变。这样做的代价是，形状和角度等其他特征可能会变形。你最终可能会得到一个投影，其中格陵兰岛保持了其真实面积，但形状因此未能完美呈现。


  ###### 示例 1：摩尔维特投影


  摩尔维特投影是等面积投影的一个例子。它也被称为巴宾内投影、同积投影和椭圆投影。使用摩尔维特投影时，世界看起来如图 2-3 所示。


