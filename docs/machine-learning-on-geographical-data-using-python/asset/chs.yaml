  ### 在 Python 中为线要素创建缓冲区


  在本练习的第二部分，你将学习如何为线要素创建缓冲区。我们将使用一条代表地铁线路的线要素，并创建一个我们认为距离地铁线路过近的缓冲区。想象一下，地铁会产生相当大的噪音。需要说明的是，该线路的大部分实际上位于地下，但为了简化练习，我们在此不考虑这一点。


  与其导入一个线数据集，不如使用之前的点数据集，并将这八个点转换为一个单一的线要素。为此，我们首先需要确保这些点按正确的顺序排列，然后将它们传递给 shapely
  包中的 `LineString` 函数。所有这些操作都在代码块 6-6 的代码中完成。


  ```

  from shapely.geometry.linestring import LineString

  LineString(data.loc[[7,6,5,4,0,1,2,3], ''geometry''].reset_index(drop=True))

