  你可以想象，这可以应用于高速公路、铁路线、其他河流以及你想在巴黎地图上使用的其他线状数据，但这些数据可能仅适用于更大的范围。裁剪操作相当简单，但对此非常有用，它允许你从工作环境中移除无用的数据。




  ## 什么是相交？


  我们将要探讨的第二个操作是相交。如果你了解集合论，这部分内容会相对简单。如果不了解，我们先来介绍一下集合论。


  在数学中，集合是独特对象的集合。集合定义了许多标准操作，这些操作在解决各种不同问题时通常很有用，地理数据问题就是其中之一。


  举个例子，我们可以想象两个集合，A 和 B：


  *   集合 A 包含三个城市：纽约、拉斯维加斯和墨西哥城。

  *   集合 B 也包含三个城市：阿姆斯特丹、纽约和巴黎。


  通常应用于集合的标准操作有几种：


  *   并集：两个集合中的所有元素

  *   交集：两个集合中都存在的元素

  *   差集：存在于一个集合但不存在于另一个集合中的元素（非对称）

  *   对称差集：存在于 A 但不存在于 B，或存在于 B 但不存在于 A 中的元素


  使用前面给出的示例集合，我们会得到以下结果：


  *   A 和 B 的并集：纽约、拉斯维加斯、墨西哥城、阿姆斯特丹、巴黎

  *   A 和 B 的交集：纽约

  *   A 与 B 的差集：拉斯维加斯、墨西哥城

  *   B 与 A 的差集：阿姆斯特丹、巴黎

  *   对称差集：拉斯维加斯、墨西哥城、阿姆斯特丹、巴黎


  图 5-10 中的图表展示了这些结果是如何产生的。


  ![](img/526781_1_En_5_Fig11_HTML.jpg)


  更多集合操作的三个维恩图。从上到下，第一个维恩图表示 A 与 B 的差集。第二个维恩图表示 B 与 A 的差集。第三个图表示 A 和 B 的对称差集。


  图 5-10

  第二部分：更多集合操作。图片由作者提供


  ![](img/526781_1_En_5_Fig10_HTML.jpg)


  集合操作的两个维恩图。上方，表示 A 和 B 的并集。下方，表示 A 和 B 的交集。


  图 5-10

  第一部分：集合操作。图片由作者提供


  在本章的第一部分，你已经了解到过滤是地理数据中一项重要的基本操作。集合论对地理数据很有用，因为它为所有这些过滤操作提供了一种通用语言。


  我们将相交与裁剪放在同一章中介绍，是因为它们相对相似且经常被混淆。这使我们能够看清它们确切的异同点。


  ### 实际执行相交操作时会发生什么？


  集合论中的相交操作接收两个输入集合，并只保留两个集合中都存在的那些元素。在地理数据处理中也是如此。假设你的集合现在是地理数据集，我们使用地理位置数据作为对象的标识符。两个对象的相交将保留两个数据集的所有要素（列），但只保留两个数据集中都存在的那些数据点。


  举个例子，假设我们再次使用塞纳河数据，这次我们使用巴黎周边的主干道（环城大道）来识别应该能找到桥梁或隧道的地点。例如，如果我们还没有关于桥梁和隧道的数据，并且想要自动识别所有应该能找到桥梁或隧道的位置，这可能会很有用。


  两者的相交将使我们能够同时保留道路数据和河流数据集的信息，同时将数据缩减到存在交叉点的位置。


  当然，这可以推广到许多需要两个数据集相交的问题中。


  ### 地理数据相交的概念性示例


  现在让我们看一些相交操作如何应用于地理数据的例子。请记住，在栅格数据中，没有对象，只有像素，因此使用集合论仅对矢量数据有用。你现在将看到一些不同矢量数据类型的示例，以及相交操作如何应用于它们。


  让我们从考虑点与点相交时会发生什么开始。由于点没有宽度和长度，只有一个位置，我们能做的唯一相交就是识别一个数据集中的点是否与另一个数据集中的点重叠。如果重叠，我们可以认为这些重叠的点属于交集。图
  5-11 中的示意图展示了这一点。


  ![](img/526781_1_En_5_Fig12_HTML.jpg)


  相交的示意图。从左到右，一个矩形内嵌有五个星号在上方，另一个矩形内嵌有四个星号在下方。一个箭头连接到右侧的矩形，该矩形内嵌有三个对齐的星号。


  图 5-11

  相交的示意图。图片由作者提供


  这基本上只是过滤掉了一些点，结果形状仍然是点。现在让我们看看将其应用于两个线数据集时会发生什么。


  线数据集的工作方式不同。当两条线在完全相同的位置有一部分时，两条线相交的结果可能是一条线。通常，两条线更可能在交叉点相交或在某点接触。在这种情况下，两条线的相交结果是一个点。因此，结果通常是与输入不同的形状。这在图
  5-12 的示意图中展示。


  ![](img/526781_1_En_5_Fig13_HTML.jpg)


  线相交的示意图。从左到右，上方是一个矩形，内嵌一条从一个角到另一个角的斜线。下方是一个矩形，内嵌三条水平线。一个箭头连接到右侧的矩形，该矩形内嵌三个沿对角线排列的星号。


  图 5-12

  线相交的示意图。图片由作者提供


  这些线相交于三个点，结果数据集只显示这三个点。现在让我们看看多边形相交时会发生什么。


  从概念上讲，由于多边形有表面，我们认为两个多边形的交集是它们共有的表面。因此，结果将是它们共享的表面，这是一个表面，因此也必须是多边形。图 5-13 中的示意图展示了这是如何工作的。


  ![](img/526781_1_En_5_Fig14_HTML.jpg)


  多边形相交的示意图。从左到右，上方是一个矩形，内嵌一个小的水平矩形。下方是一个矩形，内嵌一个垂直矩形。一个箭头连接到右侧的矩形，该矩形内嵌一个正方形。


  图 5-13

  多边形相交。图片由作者提供


  结果基本上就是一个或多个较小的多边形。在下一节中，你将看到如何在 Python 中应用此操作。




