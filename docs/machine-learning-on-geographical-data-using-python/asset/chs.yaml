  ##### 真方向或方位投影


  最后，方位投影旨在保持从一个点到另一个点的方向准确。例如，如果你正在制作导航地图，那么保持方向准确的方位地图可能至关重要。地图上任何一点的方向都将保证从中心点出发以正确的方向描绘。


  这类投影还有一个有趣的额外优势，即它们可以与前面三种类型的地图结合使用，因此并非非此即彼的选择。


  ###### 兰勃特等积方位投影


  方位投影的一个例子是兰勃特等积方位投影。顾名思义，它不仅是方位投影，同时也是等积投影。根据这种投影绘制的世界如图 2-9 所示。


  ![](img/526781_1_En_2_Fig9_HTML.jpg)


  一幅采用兰勃特等积方位投影的世界图像。一种地图投影，假设地球仪放置在一个平面上，其上的特征被投影到该平面上。在保持陆地特征真实相对大小的同时，也保持了从中心点出发的真实方向感。


