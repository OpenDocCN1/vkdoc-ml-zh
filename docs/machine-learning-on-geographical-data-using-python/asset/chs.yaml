  ## 融合操作


  在合并许多不同数据集时，经常会得到大量重叠的要素，例如不同粒度的多边形都保留在数据中，或者相同的要素出现在每个数据集中并造成信息重复。融合操作可以解决此类问题。


  ### 什么是融合操作？


  融合操作是更广泛的概化工具家族中的一个工具。它允许你将过于详细或粒度过细的数据合并成更大的要素。你可以将融合工具视为一种分组操作。它的工作方式类似于 SQL 或
  pandas 中的 groupby 操作。


  ### 融合操作示意图


  你可以在图 7-18 中看到融合操作的示意图。在此图中，你可以看到多个多边形根据其数值特征被分组为一个，如图 7-18 所示。


  ![](img/526781_1_En_7_Fig18_HTML.jpg)


  融合操作的示意图。第一个数据集展示了一个包含三个区域的数据集，分别标记为 A（1）、B（1）和 C（2）。该数据集根据其数值特征被分组为一个，现在标记为 1 和
  2。


  图 7-18


  融合操作。作者提供的图片


  多边形 A 和 B 的值都是 1，因此按值分组会将这两个多边形合并为一个多边形。当你的数据过于粒化时，此操作会很有用，这可能是由于你执行了大量地理空间操作，或者合并了大量数据文件所致。


