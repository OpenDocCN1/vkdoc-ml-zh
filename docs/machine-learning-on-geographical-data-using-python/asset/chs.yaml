  ###### 示例 2：阿尔伯斯等积圆锥投影


  阿尔伯斯等积圆锥投影采用了一种截然不同的方法，因为它是一种圆锥投影。制作圆锥地图通常是为了更好地表现某些区域。阿尔伯斯等积圆锥投影，也称为阿尔伯特投影，将世界投影到二维地图上，同时保持面积不变，如图
  2-4 所示。


  ![](img/526781_1_En_2_Fig4_HTML.jpg)


  一幅采用阿尔伯斯等积圆锥投影的世界图像。它使用两条标准纬线来减少仅使用一条标准纬线的投影中出现的某些变形。


