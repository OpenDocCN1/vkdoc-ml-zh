- '# 3. 地理数据数据类型


  在前面的章节中，你（不知不觉地）接触到了多种不同的地理数据数据类型。在第 1 章中，我们讨论了在坐标系中识别点。在上一章中，你看到了如何创建一个法国国家形状的多边形。你还看到了将
  TIFF 数据文件导入 Python 的示例。


  理解地理数据数据类型是高效处理地理数据的关键。在常规的表格数据集中，在不同数据类型之间进行转换通常成本不高。而且，通常很容易判断哪种数据类型是给定变量或给定数据点的“最佳”数据类型。


  在地理数据中，数据类型的选择影响要大得多。将国家形状的多边形转换为点并非易事，因为这需要（人为地）定义每个点应放置的位置。这通常位于“中心”，往往需要相当昂贵的计算。


  然而，反过来则不再可能。一旦你拥有了包含国家中心的点数据集，你就再也无法找到这些国家的精确边界了。


