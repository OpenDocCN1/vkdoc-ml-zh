  ### 用于特征工程的空间操作


  现在我们已经对这个数据集有了很好的了解，是时候开始执行空间操作，以添加参与者在每个地点出现的信息了。为此，我们需要某种空间叠加操作，正如你在本书前面部分所看到的那样。


  要进行叠加部分，逐点操作会更容易，因为我们的线路会穿过许多兴趣区域。如果我们使用线路进行操作，最终将需要根据多边形的边界切割线路，并使用线路长度来估算在商店区域停留的时间。


  如果我们将线路切割成点，就可以执行空间操作来查找每个点的存在情况，然后简单地统计每个参与者在每个商店区域中的点数。如果这些点是在等频率的基础上收集的，那么点的数量就是时间的精确表示。


  我们可以不使用线路的原因是，我们在这里不关心方向或顺序。毕竟，如果我们想研究访问每个商店区域的顺序，就需要保留关于序列的信息。线路能够做到这一点，而点数据类型则不能。


  在本节中，你将看到掌握 Python 处理地理数据用例的巨大优势。确实，Python 的一大优势在于，我们可以自由地将几何对象转换为字符串，并对它们进行循环，这在更多依赖点击按钮、预编码的
  GIS 工具中可能会复杂得多。


  缺点可能是有时理解起来有点困难，但代码块 10-5 中的代码将引导你使用一种方法，将数据从宽格式（每行一个客户）转换为长格式（每行一个数据点/坐标）。


  ```

  import pandas as pd

  from shapely.geometry.point import Point

  results = []

  '
- '# split the lines into points

  for i, row in itineraries.iterrows():

  '
- '# making the line string into a list of the coordinates as strings and removing
  redundant information

  list_of_points_extracted = str(row[''geometry'']).strip(''LINESTRING Z ('').strip('')'').split('','')

  list_of_points_extracted = [point[:-2] for point in list_of_points_extracted]

  '
- '# convert lat and long into floats

  list_of_points_extracted = [Point([ float(y) for y in x.strip('' '').split('' '')])
  for x in list_of_points_extracted]

  list_of_points_extracted = [[i, row.Name] + [x] for x in list_of_points_extracted]

  results += list_of_points_extracted

  results_df = pd.DataFrame(results)

  results_df.columns = [''client_id'', ''target'', ''point'']

  results_df

  代码块 10-5

  将数据从宽格式转换为长格式

  ```


