  有了这个车站和公园的交集，我们现在需要移除所有离地铁线路太近的位置，因为正如引言中所述，这些地方预计会过于嘈杂。


  为此，我们也可以使用叠加方法，但这次我们不需要集合论中的交集运算，因为交集运算会保留所有同时靠近车站、公园和铁路的位置。然而，我们想要的是靠近车站和公园，但不靠近铁路的位置。为此，我们需要使用集合论中的差集运算。代码块
  6-17 中的代码展示了如何实现这一点。


  ```

  A_and_B_not_C = A_and_B.overlay(C, how=''difference'')

  A_and_B_not_C

