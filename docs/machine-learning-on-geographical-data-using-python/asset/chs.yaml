  第一个标准操作——裁剪与相交，将在本章中介绍。让我们先给出裁剪操作的一般定义，并在 Python 中做一个示例。然后，我们将对相交操作进行同样的操作。


  ## 什么是裁剪？


  在地理处理中，裁剪操作使用一个输入图层和一个指定的边界图层，来切出输入图层的一部分。被切出的部分会被保留以供后续使用，其余部分通常会被丢弃。


  裁剪操作就像一个饼干模具，你的饼干面团就是输入图层，而饼干形状的部分被切出来。


  ### 裁剪的示意图示例


  让我们用一个更直观的例子来阐明这个定义。想象一下，你正在处理一个公共公园的地理数据。你可以从互联网上获取大量公共数据，但当然，任何公共数据都不太可能恰好符合你公园的大小：它通常规模要大得多。


  为了更方便地处理数据，你可以使用裁剪操作将所有数据缩小到更小的范围，只保留与你的公园相关的数据。图 5-1 中的示意图展示了这是如何工作的。


  ![](img/526781_1_En_5_Fig1_HTML.jpg)


  裁剪操作概览的示意图。左上角的一个矩形被标记为“数据范围”，右上角的一个八边形被标记为“公园边界”，在上述图形下方，有一个标有“裁剪”的箭头，连接到另一个标有“裁剪到公园边界的数据”的八边形。


  图 5-1


  裁剪操作示意图。图片由作者提供


  ### 裁剪在实践中会发生什么？


  正如你现在所理解的，任何地图信息都只是数据。让我们试着理解在执行裁剪操作时数据会发生什么变化。


  在实践中，裁剪操作可能产生多种效果，具体取决于输入数据。如果你处理的是栅格数据，裁剪操作将简单地移除栅格中未被选中的像素，并保留仍然相关的像素。前面的示意图展示了栅格数据会发生的情况。你可以认为输入数据由大量像素组成。在输出中，不相关的像素已被删除。


  对于点数据也是如此：一些点会被选中，另一些则不会。就数据而言，这意味着删除那些不被保留的数据行。图 5-2 中的示意图展示了这种情况。


  ![](img/526781_1_En_5_Fig2_HTML.jpg)


  裁剪点的示意图。左上角是一个由小圆圈连接而成的大 Z 形图形，右上角是一个标有“公园边界”的八边形，在上述图形下方是一个标有“裁剪”的箭头，再下方是另一个八边形，内部有一个由连接圆圈构成的大
  Z 形图形。


  图 5-2


  裁剪点的示意图。图片由作者提供


  当裁剪线数据集时，情况会变得更加复杂，因为线可能从裁剪边界内部开始，并在边界外部结束。在这种情况下，必须保留边界内的线段部分，但必须移除边界外的部分。结果是，一些数据行将被完全移除（完全在范围外的线），而另一些数据行将被修改（部分在范围外的线）。通过图
  5-3 中更详细的示意图，这一点会更清晰。在这个示意图中，数据是线数据；例如，想象一个道路网络。裁剪区域是一个多边形。


  ![](img/526781_1_En_5_Fig3_HTML.jpg)


  裁剪线的示意图。左上角是向不同方向移动的重叠线条，右上角是一个标有“公园边界”的八边形，下方是一个标有“裁剪”的箭头，再下方是一个内部有相交线条的八边形。


  图 5-3


  裁剪线的示意图。图片由作者提供


