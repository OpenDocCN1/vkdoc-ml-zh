  ### Google KML 文件


  你可能对 Google 地球很熟悉：它是当今主流的基于地图的应用程序之一。谷歌推广了用于地理数据的 KML 文件。它是一种基于 XML 的文本文件，可以包含几何数据。


  .KMZ 文件是 KML 文件的压缩版本。你可以使用任何解压工具解压它，从而获得一个 KML 文件。


