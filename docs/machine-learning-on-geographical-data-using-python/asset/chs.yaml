  **图 3-3**

  矢量数据示例。作者提供图片


  对于栅格数据，存储方式通常类似于图像。如前所述，每个像素都有一个值。因此，通常将数据存储为二维表格，其中每一行代表一行像素，每一列代表一列像素。数据表中的值代表且仅代表一个变量的值。处理栅格数据可能有点难以入门，因为这种类似图像的数据格式不太便于添加附加数据。图
