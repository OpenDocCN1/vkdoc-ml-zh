  ## 矢量数据 vs. 栅格数据


  地理数据数据类型的主要划分在于矢量数据和栅格数据。这两种数据的组织方式存在根本性差异。


  矢量数据是包含对象及其特定坐标的数据。这些对象是点、线和多边形。在前面介绍的两张图片中，你看到的就是矢量数据。第一个数据集是一个多边形数据集，其中包含这些多边形在给定坐标系中的空间位置数据。第二张地图显示了一个点数据集：它包含点及其坐标。


  栅格数据集的工作方式不同。栅格数据类似于数字图像。就像图像一样，栅格数据集被分割成大量非常小的正方形：这些就是像素。每个像素都存储一个值。


  你会看到矢量数据和栅格数据之间的主要区别在于，矢量数据只存储对象及其坐标。地图的其余部分实际上是空的，这在矢量数据中不是问题。在现实世界中，许多对象都是这样工作的。如果你考虑一个包含高速公路和铁路的交通数据集，你可以理解地球上的大部分区域**并没有**被它们覆盖。只说明对象所在的位置（矢量方法）比说明世界上每个像素是否存在道路（栅格方法）要高效得多。


  栅格数据必须在每个像素中都有一个值，这使得它特别适用于表示不局限于特定空间的现实世界现象。一个很好的例子是高程图：地球上的每个位置都有特定的高度。通过将世界切割成像素，你可以为每个位置分配高度（相对于海平面）。这将为你提供一张极好的地形图。其他连续型用例也存在，例如绘制地球上的温度分布、污染值分布等等。




  ### 处理矢量和栅格中的属性


  坐标通常不是您想了解的关于多边形或栅格的唯一信息。在收集地理数据时，您通常希望了解有关位置的更多信息，而不仅仅是它们的位置。附加信息存储在我们称之为数据集属性的内容中。


  由于处理矢量和栅格数据存在根本性差异，了解通常如何解决此类数据存储问题会很有趣。


  对于矢量数据，您通常会看到一个表格，其中每个对象（点、线或多边形）对应一行。在表格的列中，您会看到一个 ID 以及包含形状和坐标的地理信息。您可以轻松地想象，在此表格中添加您选择的任何列，以包含关于该对象的附加信息，例如名称或您可能拥有的任何其他数据：国家人口规模、创建日期等等。图
  3-3 展示了一个示例。


