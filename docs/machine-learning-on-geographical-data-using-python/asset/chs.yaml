  ###### 两点等距投影


  另一种方位投影是两点等距投影，也称为双等距投影。使用这种投影制作地图时，必须在地图上选择两个点，从这两个点到地图上任何其他点的距离都保证与地图比例尺所对应的距离一致。例如，在图
