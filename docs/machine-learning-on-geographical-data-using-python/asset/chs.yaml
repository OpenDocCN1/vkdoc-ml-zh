  ##### 等角投影


  如果形状对你的用例很重要，你可能需要使用等角投影。等角投影旨在保持形状不变。这类投影以扭曲地图上的面积为代价，保证所有角度都得以保留，从而确保你在地图上看到的是“真实”的形状。


  ###### 墨卡托投影


  墨卡托地图非常著名，是许多项目的标准地图投影。它的优点是上北下南，同时保持局部方向和形状不变。


  不幸的是，远离赤道的地区（例如格陵兰岛和南极洲）被严重放大，而赤道附近的区域（例如非洲）相比之下则显得过小。


  该地图的外观如图 2-5 所示。


  ![](img/526781_1_En_2_Fig5_HTML.jpg)


  一幅采用墨卡托投影的世界地图。经线是等间距的平行竖直线，纬线是平行的水平直线，随着距离赤道越远，它们之间的间距越大。


  图 2-5


  墨卡托投影下的世界 来源：[*https://commons.wikimedia.org/wiki/File:Mercator_projection_of_world_with_grid.png*](https://commons.wikimedia.org/wiki/File:Mercator_projection_of_world_with_grid.png)。公共领域


  ###### 兰勃特等角圆锥投影


  兰勃特等角圆锥投影是另一种等角投影，意味着它也能保持局部形状不变。这种投影不太普及，因为它是一种圆锥地图，而圆锥地图从未像矩形地图那样流行。然而，它在绘制地球并保持形状方面同样出色，并且在尺寸变形方面问题更少。其外观如图
  2-6 所示。


  ![](img/526781_1_En_2_Fig6_HTML.jpg)


  一幅采用兰勃特等角圆锥投影的世界地图。在这种地图投影中，所有经线都由从映射区域外一个公共点辐射出的直线表示，纬线则由以该公共点为圆心的圆弧或圆表示。


  图 2-6


  兰勃特等角圆锥投影下的世界 来源：[*https://commons.wikimedia.org/wiki/File:Lambert_conformal_conical_projection_of_world_with_grid.png*](https://commons.wikimedia.org/wiki/File:Lambert_conformal_conical_projection_of_world_with_grid.png)。公共领域


  ##### 等距投影


  顾名思义，如果你想要一张保持距离准确的地图，就应该使用等距投影。在前面讨论的两种投影类型中，无法保证两点之间的距离保持不变。可以想象，这对许多用例来说将是一个问题。如果距离是你的解决方案的关键，等距投影可以帮你解决这个问题。


  ###### 方位等距投影


  等距投影的一个例子是方位等距投影，也称为波斯特尔投影或天顶等距投影。它保持从中心点出发的距离不变，其外观如图 2-7 所示。


  ![](img/526781_1_En_2_Fig7_HTML.jpg)


  一幅采用方位等距投影的世界地图。世界被从地球上的任意一点投影到一个平面上。


  图 2-7


  方位等距投影下的世界 来源：[*https://commons.wikimedia.org/wiki/File:Azimuthal_equidistant_projection_of_world_with_grid.png*](https://commons.wikimedia.org/wiki/File:Azimuthal_equidistant_projection_of_world_with_grid.png)。公共领域


  ###### 等距圆锥投影


  等距圆锥投影是另一种圆锥投影，但这次它保持距离不变。它也被称为简单圆锥投影，其外观如图 2-8 所示。


  ![](img/526781_1_En_2_Fig8_HTML.jpg)


  一幅采用等距圆锥投影的世界图像。它保持所有经线和两条标准纬线上的距离不变。形状、面积、距离、方向和角度通常都会发生变形。在标准纬线上没有变形。变形值随着远离标准纬线而增大。


