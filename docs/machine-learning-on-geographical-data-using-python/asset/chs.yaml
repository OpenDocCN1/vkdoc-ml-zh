  ## 关键要点


  1.  大多数地理数据工具都标准实现了大量基础地理数据操作。这些操作乍看简单，但应用于地理数据时可能会遇到一些困难。


  2.  合并操作通常指按行合并，即将多个对象拼接成一个数据集。


  3.  属性连接（在 geopandas 中令人困惑地被称为 merge）是一种按列进行的、类似 SQL 的连接操作，它利用两个输入数据集之间的共同属性进行连接。


  4.  空间连接是另一种按列连接的方式，它允许在没有共同标识符的情况下合并两个数据集。两个数据集行之间的对应关系完全由空间信息决定。


  5.  在空间连接中，有多种方式可以指定你想要用于连接的空间关系类型。例如，两个对象之间存在交集、一个对象完全包含在另一个对象内、一个对象部分包含在另一个对象内，甚至仅仅是两个对象相对接近。


  6.  融合工具允许你根据指定的列，将对象分组为更大的对象，从而对数据集进行概括。此操作类似于空间要素的分组操作，当你拥有过多或过于细碎的对象，需要将其概括为更大的区块时，该工具非常有用。


  # 8. 擦除


  在本章中，你将学习擦除操作。前三章介绍了一些标准的 GIS 操作。裁剪和相交在第 5 章中介绍，缓冲区分析在第 6 章中介绍，合并和融合在第 7 章中介绍。


  本章将是这四章中介绍地理空间分析常用工具的最后一章。尽管标准的 GIS 工具箱中还有更多工具可用，但本章的目标是让你扎实掌握基础知识，并能够自主学习 Python
  中的其他 GIS 操作。


  本章将从擦除操作的理论介绍开始，然后通过多个 Python 示例实现，演示如何将擦除应用于不同的地理数据类型。


  ## 擦除操作


  擦除不仅仅是 GIS 分析中的一种操作，也是删除的常见同义词。为了澄清，让我们先看看“标准”的要素删除，这不是空间擦除，而是基于要素 ID（而非空间信息）完全删除一个要素。


  无论你处理的是点、线还是面，都可以想象你只是想删除其中一个。图 8-1 中的示意图展示了这意味什么。


  ![](img/526781_1_En_8_Fig1_HTML.jpg)


  擦除操作的示意图，包含输入图层和结果。两者都有编号为 1 到 3 的五边形，其中标记为 1 的多边形位于顶部，标记为 2 的多边形位于左侧，标记为 3 的多边形位于右侧。结果面板显示标记为
  2 的多边形缺失。


  图 8-1


  擦除操作示意图。图片由作者提供


  在此示意图中，你可以看到左侧有三个多边形（编号为 1、2 和 3）。删除操作删除了多边形 2，因此右侧输出中只剩下两个多边形。多边形 2 被删除，或者用同义词说，被擦除了。包含数据的表格将受到影响，如图
  8-2 所示。


  ![](img/526781_1_En_8_Fig2_HTML.jpg)


  表格格式的擦除操作示意图。两个表格都有两列，分别标记为 I D 和 Value。左侧表格有三行，右侧表格有两行。两个表格行的相应标签分别是 1、2、3 和 1、3。一个右箭头连接两个表格。


  图 8-2


  此操作的表格视图。图片由作者提供


  这个操作相对容易理解，不需要深入探讨。然而，在 GIS 中，通常所说的擦除操作并非指此操作。


  GIS 中的擦除功能实际上更接近我们之前介绍过的其他空间操作。擦除操作需要两个输入：一个输入图层（我们要对其应用擦除操作的图层）和擦除要素。


  输入图层可以是任何类型的矢量图层：面、线、点，甚至混合类型。擦除要素通常必须是面，尽管某些实现可能允许你使用其他类型。


  该操作的作用是擦除输入图层中位于擦除多边形内部的所有数据。这将删除部分输入数据，通常是因为你不需要它。


  接下来，让我们看看在不同输入数据类型上执行擦除的一些示意图概览。


  ### 空间擦除点的示意图概览


  空间擦除点实际上与标准删除操作非常相似。执行空间擦除时，你将删除输入要素中与擦除要素在空间上重合的所有部分。然而，由于点没有大小，它们要么完全位于擦除要素内部，要么完全位于外部，这导致每个点要么被完全删除，要么被保留。图
  8-3 中的示意图展示了其工作原理。


  ![](img/526781_1_En_8_Fig3_HTML.jpg)


  空间擦除点的示意图。它有四个带标签的矩形。输入有 5 个带编号的星形，而擦除要素是一个位于中下部的水平矩形。它们之间的向下箭头连接到空间叠加和输出，输出包含相同的
  1、3 和 4 号星形，但后者中没有水平矩形。


  图 8-3


  空间擦除点的示意图。图片由作者提供


  你可以在图 8-4 的示意图中看到数据表在操作前后的变化。


  ![](img/526781_1_En_8_Fig4_HTML.jpg)


  表格格式的空间擦除示意图。两个表格都有两列，分别标记为 I D 和 Value。左侧表格有五列，右侧表格有三列。两个表格行的相应标签分别是 1、2、3、4、5
  和 1、3、4。一个右箭头连接两个表格。


  图 8-4


  空间擦除背后的表格视图。图片由作者提供


  你可以看到要素 2 和 5 已被擦除操作简单地移除。这也可以通过删除 ID 为 2 和 5 的要素来实现。尽管使用空间擦除而不是按 ID 擦除来删除一些点在功能上结果相同，但在这里使用空间擦除可能非常有用，甚至是必要的。


  当你有一个擦除要素时，你还没有要删除的点的确切 ID。这样，自动获取 ID 列表的唯一方法是进行空间连接或叠加，这正是空间擦除中所发生的。


  正如你接下来将看到的，当使用更复杂的要素（如线和面）时，空间擦除的重要性甚至更大。




  ### 空间擦除线的示意图


  现在让我们看看在线数据上执行空间擦除时是如何工作的。在图 8-5 中，您可以看到有两个线要素和一个多边形擦除要素。


  ![](img/526781_1_En_8_Fig5_HTML.jpg)


  擦除线的示意图。图中包含四个带标签的矩形。输入部分有两条分别标记为 1 和 2 的对角线，而擦除要素则是一个位于右下角附近的水平矩形。两者之间的向下箭头连接到空间叠加和输出部分，输出部分中相同的标记对角线被截短。


  图 8-5


  擦除线。作者自绘


  这里发生的情况与点示例中的情况截然不同。空间擦除并非删除或保留整个要素，而是对要素进行了修改。前后对比，数据仍然由两条线组成，但它们已不再是完全相同的线。每个要素只有一部分被擦除，因此要素的数量没有改变，改变的只是几何形状。在数据表中，这看起来会像图
