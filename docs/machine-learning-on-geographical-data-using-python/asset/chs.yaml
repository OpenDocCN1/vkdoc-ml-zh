  ## 克里金法


  在本章的第一部分，你已经了解了一些基本的、基础的插值方法。插值的特点在于，你可以根据需要将其做得非常简单，也可以非常复杂。


  尽管前面讨论的基础方法在实际结果和用例中通常令人满意，但我们还需要介绍一些更高级的技术。


  在本章的第二部分，我们将探讨一种名为克里金法的插值方法。克里金法是一种更为高级的插值数学定义。虽然深入探讨其数学细节会超出本书的范畴，但对于那些不介意更多数学细节的读者，欢迎查阅一些在线资源，例如
  [`https://en.wikipedia.org/wiki/Kriging`](https://en.wikipedia.org/wiki/Kriging)
  和 [`www.publichealth.columbia.edu/research/population-health-methods/kriging-interpolation`](https://www.publichealth.columbia.edu/research/population-health-methods/kriging-interpolation)。




  ### 线性普通克里金法


  克里金法有多种形式。与许多数学方法一样，方法越复杂，需要调整和设置的参数就越多。在接下来的章节中，我们将探讨几种克里金法解决方案，它们将与之前给出的线性插值方案形成对比。最后，我们将通过练习进行比较并得出结论。


  首先，你可以使用带有普通克里金功能的 `pykrige` 库，如代码块 9-8 所示。和之前一样，先估算函数，然后在 `new_df` 上进行估算。具体操作见代码块
  9-8。


  ```

  from pykrige.ok import OrdinaryKriging

  my_ok = OrdinaryKriging(df[''long''], df[''lat''], df[''temp''])

  zvalues, sigmasq = my_ok.execute(''points'', new_df[''long''].map(float).values,
  new_df[''lat''].map(float).values)

  new_df[''temp''] = zvalues.data

  new_df

