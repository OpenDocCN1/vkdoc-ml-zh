  ### 裁剪与相交的区别


  现在你已经了解了裁剪和相交工具，应该明白两者通常都会减少数据量。两者之间存在根本区别，你对工具的选择应取决于你想要实现的目标。


  裁剪通过获取一个输入数据集和一个边界数据集来减少数据。生成的输出数据具有输入数据的精确形状，仅受边界数据集施加的地理范围限制。唯一保留的数据是输入图层的数据。你在裁剪示例中已经看到，输出中不存在巴黎多边形：只有塞纳河存在，但其地理范围被缩减了。


  对于相交，两个数据集可以被视为同等重要。不存在一个输入数据集和一个边界数据集，而是有两个输入数据集。生成的输出是一个组合，它保留了来自两个输入数据集的所有信息，同时仅保留地理上重合的点。


  在稍后将要进行的相交示例中，你将看到输出包含来自两个输入数据集的数据，因此它与裁剪操作不同。


  ## 关键要点


  1.  有许多基本的地理数据操作，它们通常已在大多数地理数据工具中标准实现。乍看之下可能很简单，但将其应用于地理数据可能会带来一些困难。


  2.  裁剪操作获取一个输入数据集，并将其大小缩减到由边界数据集给定的范围。这适用于所有地理数据类型。


  3.  对栅格数据或点使用裁剪，相当于删除范围外的像素点。


  4.  对线或多边形使用裁剪，将完全删除那些完全在范围外的线和多边形，但对于那些部分在边界内、部分在边界外的部分，则会创建一个新的缩减形式。


  5.  相交操作基于集合论，允许找到两个输入数据集之间共享的要素。它与裁剪不同，因为它将两个数据集都视为输入，因此保留了两者的要素。在裁剪中则不是这样，因为只有输入数据集的要素被认为是相关的。


  6.  对点进行相交，基本上相当于根据点是否同时存在于两个数据集中来进行过滤。


  7.  对线进行相交通常会产生点（两条线的交叉点或两条曲线之间的接触点），但如果两条线在其轨迹的某一部分完全重合，它们也可能产生线。


  8.  对多边形进行相交将产生一个或多个较小的多边形，因为相交被认为是两个多边形共有的区域。


  9.  你已经了解了如何使用 geopandas 作为裁剪和相交操作的便捷工具。




  '
- '# 6. 缓冲区


  在上一章中，我们开始探讨一些常见的地理空间操作：这些操作在常规数据上无法实现，或至少不常见，但在地理空间数据中却非常普遍。


  我们将介绍的标准操作包括：


  *   裁剪与相交

  *   缓冲区

  *   合并与融合

  *   擦除


  在上一章中，你已经了解了两个主要操作。首先，你学会了如何将数据裁剪到特定范围，主要用于基于空间范围丢弃数据。其次，你还学会了如何使用相交操作，基于集合论对地理空间数据集创建新数据。当时也提到，在该范畴内还可以找到其他集合论操作。


  在本章中，我们将探讨一种截然不同的地理空间操作。你将了解缓冲区（或称创建缓冲区）这一地理空间操作。它是地理空间操作中的标准操作之一，掌握这一工具非常有用。


  与相交操作类似，缓冲区既可以作为独立工具使用，也可以作为进一步分析的工具。之前没有提及的是，在相交操作的示例中，正是使用了缓冲区操作来创建桥梁和河流的多边形数据。


  这清楚地表明，所有这些空间操作都应被视为工具箱中的工具。当你想要实现特定目标时，需要选择不同的工具来达成目的。这通常意味着要以智能的方式组合使用不同的工具。你了解的工具越多，能实现的目标就越多。


  本章将首先介绍缓冲区背后的理论，然后通过 Python 进行若干示例，你将看到如何使用不同的地理数据类型创建缓冲区。


  ## 什么是缓冲区？


  缓冲区是围绕其他现有形状新创建的多边形。“缓冲区”这个术语很贴切，因为它实际上就是在现有对象周围创建一个缓冲区域。


  你可以围绕所有矢量数据对象创建缓冲区，并且它们始终会变成多边形。例如，根据数据类型，会得到以下结果：


  *   当你在一个点周围创建缓冲区时，最终会得到一个包含该点周围区域的新缓冲区多边形。

  *   通过为一条线添加缓冲区，你会得到一个包含该线周围区域的新要素。

  *   多边形周围的缓冲区也会包含该多边形外部的区域。


  缓冲区是新创建的对象。计算缓冲区多边形后，你的原始数据仍然存在。你只是创建了一个新的要素，即缓冲区。


  ### 缓冲区示意图


  让我们用一个更直观的例子来阐明这个定义。我们将沿用上一章中使用的例子：我们有一个道路线数据集，但需要将这些线转换为多边形，以考虑道路的宽度。在图 6-1 中，你看到一条道路首先以多边形形式呈现，然后以线形式呈现。


  ![](img/526781_1_En_6_Fig1_HTML.jpg)


  一张示意图，道路首先以多边形形式呈现，然后以线形式呈现。左侧，一条弯曲的道路以多边形表示。右侧，一条弯曲的道路以线表示。两者都在正方形内。


  图 6-1

  展示道路首先以多边形形式呈现，然后以线形式呈现。图片由作者提供


  将道路表示为线可以让你做很多事情，比如计算道路长度、查找与其他道路的交叉点并构建道路网络等。然而，在现实生活中，道路也有宽度。对于道路周边的城市规划、修建桥梁等情况，你始终需要知道每个位置的道路宽度。


  正如你在第 3 章介绍数据类型时所看到的，线有长度但没有宽度。无法表示线的宽度。不过，你可以在线周围创建一个缓冲区，并为缓冲区指定一个宽度。这将生成一个包含道路的多边形，然后你就可以生成类似多边形的数据。


  ### 缓冲区操作在实践中是如何进行的？


  现在让我们看一些关于相交操作如何应用于地理数据的示例。请记住，在栅格数据中，没有要素，只有像素，因此使用集合论仅对矢量数据有用。你将看到一些不同矢量数据类型的示例，以及相交操作如何应用于它们。


  #### 点数据的缓冲区


  首先，我们来考虑在点周围构建缓冲区时会发生什么。点没有宽度或长度，只有位置。如果我们创建缓冲区，通常会使缓冲区的边界与被缓冲对象保持等距。因此，点周围的缓冲区通常是圆形。缓冲区的大小决定了这些圆的大小。你可以在图
  6-2 的示意图中看到一个示例。


  ![](img/526781_1_En_6_Fig2_HTML.jpg)


  点数据缓冲区的示意图。从左到右，一个矩形内嵌有五颗星，然后一个箭头连接到另一个矩形，该矩形内嵌有五个圆，每个圆内都有一颗星。


  图 6-2

  点数据的缓冲区。图片由作者提供


  在这张示意图中，你看到左侧图像包含点，这里用星形表示。在右侧图像中，你看到缓冲区是如何精确围绕点形成的圆形多边形。


  尽管这可能看起来难以找到用例，但确实存在一些有用的场景。想象一下，你的点数据是噪音污染源，并且已知噪音可以从源头传播一定米数。在点周围创建缓冲区有助于确定噪音问题发生的区域。


  另一个截然不同的用例是，你收集的数据点不太可靠。例如，假设它们是手机提供的 GPS 位置。如果你知道数据点存在多少不确定性，你可以在数据点周围创建缓冲区，表明缓冲区内的所有位置都可能是该特定手机用户访问过的。这对于营销或广告推荐等场景非常有用。





  #### 线数据的缓冲区


  现在我们来考虑将缓冲区应用于线数据的情况。前面已经给出了第一个示意图示例。在该示例中，存在一个线数据集，但需要将其转换为多边形，以便用于相交分析。


  让我们再看另一个例子。假设你正在某处规划一条铁路线，需要研究将会产生的噪音问题程度，以及这将影响多少人。这是一个有趣的例子，因为它是对之前介绍的声音污染问题的进一步深化。


  我们可以设想在铁路周围建立不同的缓冲区（一个用于受强烈影响的地点，另一个用于受中等影响的房屋）。图 6-3 中的示意图展示了如何在铁路周围建立不同的缓冲区来帮助你解决这个问题。


  ![](img/526781_1_En_6_Fig3_HTML.jpg)


  线数据缓冲区示意图。从左到右，一个带有斜线的矩形，其上下各嵌入三颗星，然后一个箭头连接到右侧上方的矩形，该矩形内嵌一个带有斜线的椭圆，内部有三颗星，矩形内也有三颗星。右下方是一个矩形，内嵌一个带有斜线的大椭圆，内部有六颗星，标注为“中等影响”。


  图 6-3


  线数据的缓冲区。作者自绘


  你可以看到，左侧图像包含一条线（规划的铁路）和若干房屋（用星形表示）。在右上方，可以看到线周围有一个狭窄的缓冲区，表示强影响区域。你可以筛选出位于这个强影响缓冲区内的点，以便更详细地识别它们。左下方的图表包含受中等影响的房屋。你可以考虑使用前一章中的集合运算，来选择所有不在强影响缓冲区内的中等影响房屋（例如，对缓冲区使用差集运算，但其他方法也是可行的）。


  #### 面数据的缓冲区


  我们将讨论的第三种也是最后一种数据类型是面数据。假设你有一个城市某区域的地理数据集，其中包含一个湖泊要素。众所周知，这个湖泊周围有一条小路，但在地图上却看不到。你可以决定在湖泊周围使用缓冲区来快速估算小路的位置。图
  6-4 中的示意图展示了这一思路。


  ![](img/526781_1_En_6_Fig4_HTML.jpg)


  面数据缓冲区示意图。从左到右，一个矩形内嵌一个椭圆，然后一个箭头连接到右侧的矩形，该矩形内嵌一个合并后的椭圆。


  图 6-4


  面数据的缓冲区。作者自绘


  在示意图的左侧，你可以看到湖泊面要素，一个椭圆形。在右侧，可以看到湖泊周围创建了一个灰色缓冲区——这或许不是估算小路精确位置的最佳方法，但绝对是在数据集中快速创建新要素的简便方法。


  现在你已经了解了缓冲区在理论上的工作原理，是时候进行一些实践了。在下一节中，我们将开始用 Python 应用这些操作。


  ## 在 Python 中创建缓冲区


  在接下来的示例中，我们将看一个非常简单直观的例子：搜索出租房屋。假设你有一个包含房屋地理点数据的数据库，并且你想进行地理数据查询以检验若干条件。在本例中，我们将通过几个使用缓冲区的示例来学习。你将发现如何利用缓冲区来满足你的房屋搜索条件：


  *   你将看到如何使用点周围的缓冲区来调查每栋房屋是否在步行可达地铁站的范围内（这是一个真正的附加值）。


  *   然后你将看到如何使用地铁线周围的缓冲区来确保房屋不受地铁线噪音的干扰（这可能是一个真正的问题）。


  *   最后你将看到如何使用公园周围的缓冲区来查看每栋房屋是否至少步行可达一个公园。


  让我们从第一个条件开始，在一些地铁站周围创建缓冲区。




  ### 在 Python 中为点创建缓冲区


