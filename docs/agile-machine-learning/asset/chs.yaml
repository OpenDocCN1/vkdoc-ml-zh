  \n图 2-2\n\n2014 年必应数据中的一个“欠匹配”或重复错误\n\n### 不良数据蔓延\n\n你可能想知道，为什么在上述例子中的 11 个提供商中，有多个提供商拥有完全相同的错误数据。这个问题在我们的领域频繁发生，原因是该领域存在数据集的买卖。单个数据提供商可能获取了错误的电话号码或名称（更可能是过时的旧号码）。该数据提供商可能将数据出售给其他数据提供商。这些数据提供商通常会在基础数据之上添加评论或其他价值。他们反过来转售数据，同时传递了错误的电话号码或名称。作为这些购买数据集的消费者，必应经常遇到多个提供商似乎“确认”某个实体存在的情况，因为他们的数据一致，但实际上，这种看似“确认”（即多个提供商以相同方式描述，因此必定是真实实体）的情况，实际上是数据提供商之间共享的错误数据。\n\
  \n\n\n### 现实世界的数据充满噪声\n\n当你研究表 2-1（该表展示了来自 11 家数据提供商的真实名称、地址、营业状态、电话号码和网站信息）时，你会发现每个字段都存在大量差异。对于同一实体，名称有三种选择，地址有四种不同写法，电话号码经过标准化后有四种形式，并且每家提供商掌握的信息都存在多处空白。例如，在本例中，网站信息仅在\
  \ 18 次记录中被提及 11 次，且只有一家提供商有足够把握断言该实体处于营业状态。\n\n此外，你还会注意到某些提供商提供了大量重复数据——例如，提供商 D\
  \ 有四条记录，均声称指向“Village Theatre”。\n\n随着用户开始报告并投诉我们系统中这些重复的实体，我们开始开发一项名为“重复率”的衡量指标来量化该问题。我们会请人工评审员运行一组能够代表用户在网站上实际查询的语料，然后评判每次查询的结果，以查看产生了多少重复项。可以想象，评判过程十分复杂，因为两个返回结果是否为重复项往往并不明显。评审员必须更深入地查看我们关联在一起的记录，致电相关企业，或尝试查找主要网站来验证某个特定实体是否属于重复项。\n\
  \n在开发出重复率指标并定期进行测量后（我们大约每两周更新一次，当工程团队需要更频繁的更新时，更新周期会更短），我们开始了改进该指标的进程。团队还创建了广泛的记录标签，用以标明哪些记录对应现实世界中的实体。这实际上相当于人工完成了我们最终希望系统自动完成的工作。我们的做法是，收集某个特定邮政编码下的所有记录——这些记录通常包含来自不同提供商、代表同一企业的数十条记录——然后手动将这些记录聚类，以生成系统所需的训练数据。\n\
  \n随后，团队利用这些训练数据，采用更复杂的技术进行记录链接，并超越了基于规则的系统。团队必须对来自不同数据提供商的多条数据源中关于同一企业的多条信息进行匹配、聚类，然后合并。团队创建了一个基于机器学习的匹配函数，用于匹配过程，同时还使用了机器学习模型来合并数据，以及复杂的算法将相关数据聚类到同一簇中。代表记录聚类的人工标注训练数据语料，被用于确定可以添加到匹配模型或聚类与合并模型中的新特征，以确保我们的重复率下降。\n\
  \n随着匹配模型的改进和重复率的下降，用户开始抱怨一个新问题。该问题通常表现为：某个特定实体存在错误的电话号码、地址或关联评论。在调查该问题时，我们发现系统在减少重复记录方面变得过于激进，从而产生了我们称之为“过度匹配”的情况——即原本不同的企业（例如西雅图常见的、相隔一个街区的两家星巴克）或一家包含在另一家企业内的业务（如超市内的咖啡店）被关联在了一起。\n\
  \n图 2-3 展示了一个过度匹配的示例。在此例中，一条关于“Levi Store”的记录与一条名为“Seattle Premium Outlets”的购物中心记录被关联在一起。随后，合并系统会确定所有关联记录中的哪些数据被认为代表同一个实体。基于该判断，系统会从一家数据提供商提供的记录中提取名称（该记录被预测拥有最佳名称），并从另一家数据提供商提供的记录中提取网站（该记录被预测拥有最高质量的网站），从而构建出最终实体。不幸的是，第一家数据提供商提供的记录实际上代表的是现实世界中的实体“Seattle\
  \ Premium Outlets”，而第二家数据提供商提供的记录实际上代表的是现实世界中的实体“The Levi’s Outlet”。\n\n![../images/473932_1_En_2_Chapter/473932_1_En_2_Fig3_HTML.jpg](img/473932_1_En_2_Fig3_HTML.jpg)\n\
  \n图 2-3\n\n数据中的过度匹配示例——来自 2014 年的必应\n\n针对过度匹配问题，我们开发了第二个“过度匹配”指标，并开始定期测量该指标，与重复率一同监控。现在，我们要求评审员运行一组查询，并检查系统为创建每个实体而选取的记录。随着时间的推移，我们认识到必须对系统进行微调，以同时优化重复率和过度匹配指标。通常，为降低重复率所做的工作可能会导致过度匹配指标恶化。有时，需要专门进行一些工作来减少过度匹配，而这些工作并不会直接影响过度匹配率。例如，过度匹配的一个常见原因就是前面提到的父实体“Seattle\
  \ Premium Outlets”与子实体（即该奥特莱斯购物中心内的“Levi Store”）被混淆。为减少此类过度匹配所做的工作，通常最终会在目录中创建出之前被淹没在过度匹配实体中的新实体，而不会改变重复率。\n\
  \n\n\n#### 合并系统\n\n我们将简要介绍合并系统用于关联记录并最终合并这些记录，以在系统中创建每个本地商业实体所采取的步骤，如图 2-4 所示。该系统消费了由多个数据提供商提供的、已经过标准化的数据。\n\
  \n![../images/473932_1_En_2_Chapter/473932_1_En_2_Fig4_HTML.png](img/473932_1_En_2_Fig4_HTML.png)\n\
  \n图 2-4\n\n合并系统\n\n1.  **候选集生成**：在合并过程中，基本操作是查看系统中的两条记录，并判断它们的相似或相异程度。这是通过一个我们称之为“匹配函数”的机器学习函数来完成的，该函数将每个实体的所有属性以及基于每个实体属性计算的许多特征作为输入，并输出一个从\
  \ 0 到 1 的相似度分数。匹配函数的运行成本很高——因此，当系统中的记录数量达到数亿条时，你不可能对整个 n x n 的记录矩阵运行该函数。这样做也没有意义——将堪萨斯州托皮卡市一家麦当劳的记录与爱达荷州博伊西市一家麦当劳的记录进行比较，纯粹是浪费计算时间。\n\
  \n因此，我们合并系统的第一阶段会遍历系统中的记录，并生成较小的记录集（我们称之为候选集），这些记录极有可能位于同一物理位置。例如，一个简单的实现方式是选择特定邮政编码内的所有记录集，然后对这些记录两两运行匹配函数。\n\
  \n实际上，我们将地图划分为更小的区块，称为四叉键（quadkeys，大约相当于一个城市街区的面积）。给定四叉键中的任何实体，都会与同一四叉键以及该四叉键周围其他八个四叉键中的所有商业实体进行比较，如图\
  \ 2-5 所示。\n\n![../images/473932_1_En_2_Chapter/473932_1_En_2_Fig5_HTML.png](img/473932_1_En_2_Fig5_HTML.png)\n\
  \n图 2-5\n\n四叉键——一个实体（E1）与同一四叉键及八个相邻四叉键中的所有实体进行比较。除 E7 之外的所有实体都将通过此算法进行比较。\n\n2.\
  \  **匹配**：在此阶段，匹配函数会接收为实体对推断和计算出的数百个特征作为输入，并对候选集内的所有实体进行 n x n 的比较。作为进一步的优化，我们有一个成本较低的匹配函数，可以首先运行以排除明显不匹配的实体，然后对低成本匹配函数无法判定为相似或相异的实体运行成本较高的匹配函数。\n\
  \n例如，我们投入开发了一组自然语言处理（NLP）特征，它会接收实体的输入名称，并对实体名称中的每个单词进行标记，标记为判定为人物姓名 [P]、企业名称 [B]、企业类别\
  \ [C]、企业部门 [D] 等。对于名为“State Farm Insurance – John Smith”的企业，标记器会将其标记为“State[B] Farm[B]\
  \ Insurance[C] – John[P] Smith[P]”。根据这些额外的推断标签，我们创建了匹配函数学习到的特征，例如“两个实体均包含人物姓名”或“人物姓名相似度分数”，这些特征将接收被比较的两个实体的标记数据作为输入，并输出一个\
  \ 0-1 的分数。\n\n然后，匹配函数会根据由评审员标注的数据进行训练，评审员会判断来自数据提供商的两条记录是否指向同一实体（参见表 2-1 了解来自数据提供商的数据示例）。匹配函数将学习在比较不同类型的实体时，其关注的数百个特征（例如“两个实体均包含人物姓名”或“两个实体拥有相同电话号码”）中哪些应该被赋予最高权重。\n\
  \n3.  **连接与聚类**：在此管道阶段，匹配函数现在已为所有彼此邻近的实体对输出了相似度分数。这产生了我们称之为“连通分量”的结果，其中所有运行了匹配函数的实体之间现在都有一条边相连。实体连接后，我们面临一个新问题，我们称之为“聚类”——即如何确定哪些记录应该被组合起来以创建一个特定的聚类，而该聚类最终将产生一个本地商业实体。\n\
  \n聚类决定了从该连通图中创建多少个实体。例如，图 2-6 展示了聚类如何在简单的连通图上运行。记录由节点 a 到 f 表示。匹配分数位于记录之间的边上。该图并非完全连通，因为记录\
  \ a、b、c 与 d、e、f 位于不同的候选集中（很可能是因为这些记录彼此距离太远）。在此示例中，从聚类中创建了三个实体：abc、e 和 df。记录之间边上大于\
  \ 0.5 的匹配分数被视为匹配，而低于 0.5 的匹配分数则被视为不匹配。\n\n![../images/473932_1_En_2_Chapter/473932_1_En_2_Fig6_HTML.png](img/473932_1_En_2_Fig6_HTML.png)\n\
  \n图 2-6\n\n从连通图创建聚类\n\n4.  **聚类修正**：在此阶段，我们维护了系统中由用户报告的已知重复或过度匹配的列表，这些是合并系统仍未正确处理的。因此，我们会进行“强制匹配”以合并系统未能处理的重复项，并进行“强制取消匹配”以拆分过度匹配的实体。随着时间的推移，随着我们系统的改进，这些手动修正的需求越来越少。\n\
  \n5.  **ID 丰富化**：我们将在本章后面讨论 ID 稳定性问题时再对此进行阐述。\n\n6.  **合并**：在合并时，我们会获取聚类中所有关联在一起的记录，并决定从聚类中的所有记录中选用哪些数据来创建最终实体。在此，我们也使用机器学习来确定哪个数据提供商拥有最正确或最可信的数据以供选择。例如，在一个包含餐厅数据的聚类中，机器学习合并函数可能会学会信任某个专注于餐厅的数据提供商来获取实体名称，但信任某个扫描电话簿的数据提供商来获取实体的电话号码。\n\
  \n7.  **合并修正**：在此阶段，我们维护了由用户报告的已知合并失败列表（例如，当我们从某个特定提供商选取了某个属性值但该数据是错误数据，而另一个提供商为该属性提供了正确值的情况）。然后，我们会强制从已知正确的提供商那里选取数据。如果所有提供商的数据都不正确，我们还有自己提供的微软数据源，这些数据会聚合成一个我们已手动整理并确认为正确的实体。\n\
  \n\n\n#### 构建支持变更的融合系统\n\n该团队设计支持变更的融合系统时，最重要的方式或许是预见到单一的匹配函数无法同样适用于全球所有市场。例如，美国市场的匹配函数高度依赖精确的地址以及企业的经纬度信息。但在巴西这样的市场，地址结构远不如美国规范且模糊不清——例如，巴西的地址通常只标明社区，并附带该地点相对于社区内某个地标的方位。通过预判需要多种匹配函数，团队在构建融合系统时采用了可替换架构，使许多组件能够被更具市场针对性的元素替代——例如，在美国高度依赖地址的候选生成系统，可以替换为像巴西这类国家对地址敏感度较低的候选生成系统。\n\
  \n此外，意识到需要构建多种不同的匹配函数后，团队建立了一个可复用特征库，供各个市场专属模型调用。这个支持计算名称相似度、地址相似度、类别相似度、电话号码相似度、字符串空格数、标点符号以及命名实体识别器的可复用特征库，能够被后续创建的多个融合模型所利用，从而使团队能够稳健应对不断变化的需求。同时，该可复用特征库中还包含了用于生成和处理各特征训练数据的可复用工具。\n\
  \n### 支持变更的架构\n\n团队早期做出的一个艰难决定，是根本性地为数据管道和数据目录选择一种支持变更的架构。这个架构决策被称为\"每日从零重建世界\"\
  决策。这一决策有利有弊。我们将阐述这个决策是什么、为何做出、如何帮助我们以及带来了哪些弊端。\n\n在创建必应本地数据管道的早期阶段，我们清楚地认识到融合模型仍不成熟，距离实现期望的去重率和过度匹配率还有很长的路要走。与谷歌不同，我们无法随时调动大量人力——无论是付费还是无偿——来修正目录中的所有错误。我们决定将重心押注在机器学习和从网络提取商业实体上，而非人工整理和修正。因此，我们决定每晚彻底丢弃目录，次日从零重建。我们的本地数据目录从根本上围绕\
  \ MapReduce 原则而非数据库原则构建——每天由数百台机器并行运行管道及所有算法和模型，从零开始创建。\n\n我们确实建立了存储历史修正记录的机制——这些记录作为另一个数据源输入管道。但通过每晚从零重建目录，我们可以充分利用机器学习模型的任何改进。举例来说，如果匹配函数得到改进，显著提升了去重率，那么次日我们就能立即受益——只需用新匹配函数重新运行所有现有数据。同时，这也降低了因错误导致目录长期损坏或质量下降的风险，因为我们每晚都会丢弃旧目录。糟糕的模型或错误最多影响目录一两天，直到我们发现并修复问题。此外，如果模型或管道出现错误，我们还能轻松回滚到之前的目录。\n\
  \n### 一次性修正\n\n当生产环境中出现融合错误时（例如需要合并的重复商家），手动修正系统能让我们快速解决问题。但实践证明，存储历史修正记录的系统难以管理。随着时间推移，对融合系统的手动修正往往会导致严重的质量问题。当融合系统不断改进且输入数据发生变化时，手动修正常常会适得其反——修正从纠正数据变成了制造数据错误。我们花费大量时间试图找出如何淘汰或移除错误的修正记录。最终，我们依靠人工评审定期审核哪些修正仍然有效、哪些已不再适用。\n\
  \n正如预期，采用每晚从零重建目录的方法确实带来了巨大收益。随着我们改进融合模型、提取模型、属性选择模型等，这些变更部署后，我们立即看到整个目录质量的大幅提升。同时，我们避免了在数据库中追踪这些变更的复杂性，并减少了对人工编辑数据的依赖。\n\
  \n然而，这种方法也存在一些显著弊端。首先，我们在构建数据管道时目光短浅地采用了根本性的\"构建整个世界\"方法，而非以有意义的方式支持增量更新。例如，即使某一天\
  \ Yelp 可能只提供了与前一天不同的几千个本地商业实体，我们的管道仍然会摄取、处理、融合并发布所有数据——无论特定实体的源数据是否发生任何变化。随着数据源数量的增加，管道性能逐渐下降。随着模型数量的增加，管道性能进一步恶化，最终需要数天时间才能构建新目录。这降低了本地数据目录的新鲜度。\n\
  \n第二个显著弊端与所谓的\"ID 变更\"有关。数据库系统能提供的基本优势之一是稳定的 ID。在我们这样的大型 MapReduce 系统中，数据每天重新聚类，这些聚类会因匹配分数的变化而每日变动——而匹配分数也会随匹配函数的改进而变化——ID\
  \ 稳定性成了我们的难题。我们在图 2-4 的\"ID 丰富\"阶段采用了多种 ID 稳定技术，但始终无法达到数据库系统所能提供的 ID 稳定水平。\n\n采用\"\
  每日从零重建世界\"的系统最终成为了我们的竞争优势——与采用数据库式架构相比，它使我们能够更快速地变更目录、算法和模型。\n\n## 支持变更的测试与监控\n\n\
  由于我们采用\"每日从零重建世界\"的系统，必须创新性地检测今日目录与昨日目录是否存在灾难性差异。我们通过三种方式实现：监控目录的增量变化、监控\"哨兵\"实体，以及计算数据的快速质量评分。\n\
  \n\n\n### 监控增量变化：数据 DRI\n\n我们首先开发了一个广泛且可配置的系统，用于监控和警报每次运行之间数据的重大变化。例如，我们可以监控周一发布的电话号码数量，并与周二从头重建目录时发布的电话号码数量进行比较。可以在系统中配置阈值，以确定随着时间的推移，电话号码数量的变化达到何种程度才值得警惕并需要调查。由于我们每天都会重新获取所有数据源，并使用机器学习模型从众多不同来源中挑选最佳电话号码，因此目录中每天有数千个电话号码发生变化并非不合理。因此，我们通过数周的观察，为目录中可接受的变化建立了基线阈值，然后设置了警报，当这些数字超出阈值时就会触发。\n\
  \n当其中一个监控器被触发时——例如，“今天电话号码变化数量惊人”——数据 DRI 就会开始调查。DRI 代表“指定负责人”，每周会指派一名团队成员担任 DRI。DRI\
  \ 拥有一套工具可供其调查数据变化，在调查自上次流水线运行以来对系统所做的更改，并对一些发生变化的电话号码进行手动验证后，数据 DRI 将决定是继续发布目录，还是触发团队进行额外调查。\n\
  \n有了这个系统，投资于工具以加快数据 DRI 做出目录“发布/不发布”决策的能力就变得非常重要。此外，这些警报可能在目录创建运行的早期阶段触发——因此，当数据\
  \ DRI 正在调查是否让运行继续时，宝贵的时间正在流逝，这会延迟我们下一批目录更新的发布。因此，除了在工具方面进行大量投资，以便 DRI 能够探索流水线出了什么问题之外，我们还投入了大量精力来调整警报并减少系统中的误报数量。\n\
  \n### 哨兵实体\n\n第二种比我们预期更频繁发生的尴尬情况是，一个非常重要的实体在新一轮运行中突然从目录中消失——例如，有几次拉斯维加斯的大型赌场神秘地从目录中消失，而这与拉斯维加斯的魔术师无关。\n\
  \n为了解决这个问题，我们创建了一个包含数百个“重要到绝不能丢失”的实体列表，每天都会明确确保这些实体存在于目录中。丢失这些哨兵实体（有时也称为“英雄”实体）中的任何一个都是严重事件，我们总会停止目录的发布并调查发生了什么。\n\
  \n### 每日人工评判指标\n\n我们监控这个“每天从头构建”系统的第三种方法是进行每日人工评判指标。进行人工评判指标成本高昂且耗时，因此我们做了大量工作，以减少在新目录发布时必须进行的实际评判次数，这得益于我们本地数据问题空间中极低的变化率。该指标的显著变化通常是由工程错误引起的，而非数据的真实变化。\n\
  \n我们的每日指标基于一组约 1500 个实体，这些实体是在一个 6 个月周期开始时根据实体热度从目录中随机抽样的。因此，展示频率较高的实体比展示频率较低的实体更有可能出现在这\
  \ 1500 个实体集合中。在该 6 个月周期开始时，这些实体在名称、电话、地址、类别、经纬度、网站等方面都经过了详尽的人工评判。然后，每当新目录发布时，我们使用多种技术尝试在新目录中找到这\
  \ 1500 个实体（由于无法保证 ID 相同，我们会先尝试通过 ID 查找，然后回退到其他匹配方法）。接着，我们会计算上次发布与当前发布之间哪些属性发生了变化，并立即将这些属性发送给评判员进行评判，然后通常在\
  \ 1 小时内就能返回一个重新计算的指标，用于评估这些变化的整体准确性。\n\n这个指标是检测数据库中非预期变化的另一个绝佳工具，也为我们深入了解算法和模型如何影响\
  \ 1500 个关键实体提供了宝贵的见解。我们能够构建各种工具来追踪这 1500 个实体在每次流水线运行时是如何被创建的，从而更好地理解我们系统的性能。\n\n\
  ### 指标有时可兼作集成测试\n\n如果你能开发出可以频繁重新计算的指标——理想情况下是每天，甚至更好的是在每次系统构建和运行时——那么这些指标也可以用作集成测试。我们有专门的集成测试，但通常我们的每日指标能够捕获集成测试无法发现的系统回归问题。\n\
  \n\n\n### 测试特征\n\n许多机器学习项目的基本构建模块是从数据中提取的特征。在我们的系统中，我们广泛实现了两种类型的特征。第一种是实体属性相似度特征，它接收两个实体作为输入，并计算出一个相似度分数。第二种是实体附加数据特征，它接收单个实体以及一些额外的信息语料库或算法，通过推理为实体添加附加数据。\n\
  \n例如，从本地商业实体中提取并可用于匹配的实体属性相似度特征，可能包括一个计算系统所摄入的两个商业实体属性之间相似度分数的特征。可进行比较的属性包括商业名称、位置、类别、电话号码等。可用于计算相似度分数的算法可能包括两点之间的欧几里得距离，或两个名称之间的编辑距离，例如莱文斯坦距离。\n\
  \n实体附加数据特征的一些示例包括：将实体的电话号码与已知的有效电话号码目录进行比较，并为该实体添加一个名为“KnownToBeGoodNumber”的属性。另一个例子是对名称进行拼写纠正，为实体生成一个名为“SpellCheckedName”的新属性，或者使用地址验证组件添加一个名为“ValidatedAddress”的属性。这些额外的实体属性一旦创建，也可以与实体属性相似度特征结合使用。\n\
  \n随着新的推理技术和算法被不断探索，我们实现的特征集也在持续增长，最终发展到包含数千个特征。为了能够对特征集进行变更，有两种技术非常有用。首先，我们确保所有新特征都有良好的单元测试覆盖率。其次，我们将特征开发中常用的许多构建模块构建成一个共享公共库，特征编写者可以使用该库快速开发和创建新特征。\n\
  \n有一段时间，团队内部就我们需要多少单元测试展开了辩论。由于特征最终会被组合成对数据的更大规模的推理，并且生成数据的质量是通过指标来衡量的，因此特征中的错误通常可以通过指标下降来检测到——例如，目录中电话号码准确性的总体质量分数通常会反映出在“KnownToBeGoodNumber”特征中添加错误所造成的影响。最终，指标回归是测试系统的一种有用方法，但我们发现，通过在系统中尽早检测到故障，我们受益匪浅——一套健壮的单元测试以及高质量的共享公共库确保我们能够快速更改特征，并尽早发现故障，且故障点更接近问题根源，从而提高了我们开发额外特征的速度。\n\
  \n### 测试学习模型\n\n我们开发的所有特征随后都会被额外的机器学习模型（通常是提升决策树）所利用，这些模型会学习数百个特征中哪些对当前的数据问题重要，哪些不重要。这个过程在机器学习中被称为“特征选择”。\n\
  \n例如，我们有一个模型用于预测目录中的某个商业实体是否已关闭。它消耗了许多特征，并在经过现实世界验证为已关闭的实体标记数据上进行训练。模型训练完成后，它会确定每个特征对于判断商业实体是否关闭的重要性。表\
  \ 2-2 展示了由学习模型确定的一些最重要的特征。提供商 A 在提供商业数据时，其关闭数据看起来相当准确。此外，集群中一致认为实体已关闭的记录数量也是一个重要特征（再次提醒，可以将集群理解为表\
  \ 2-1 中所示的内容）。\n\n表 2-2\n\n由机器学习关闭模型确定的各种特征的重要性\n\n| 特征 | 相对重要性 |\n| --- | --- |\n\
  | *提供商 A 表示该商家已搬迁或翻新* | 4.5 |\n| *集群中已关闭实体的比例* | 4.3 |\n| *提供商 A 表示该商家已关闭* | 2.5\
  \ |\n| *集群中的实体数量* | 1.4 |\n| *提供商 B 在集群中有一个实体* | 1.1 |\n| *提供商 C 表示该商家已关闭* | 1.0\
  \ |\n| *提供商 D 在集群中有一个实体* |   .9 |\n\n### 标记训练数据\n\n系统中另一个需要正确处理的要点是标记训练数据的质量和时效性。我们在系统中使用了大量的标签。例如，在我们的融合系统中，我们使用数千个匹配和不匹配的实体示例来训练我们的匹配函数。\n\
  \n这里的挑战在于：拥有大量多样且新鲜的标记训练示例；提供关于哪两个实体是匹配、哪两个不匹配的清晰判断指南；并监控判断团队提供的判断质量。\n\n拥有高质量的标记训练数据确实是打造强大产品的秘诀。我们非常重视判断员的管理和教育，以及对训练数据的审计。对我们来说，理想的设置是雇佣那些与开发团队坐在一起（最好是在同一楼层）的判断员。开发团队会与判断员合作，为标签编写非常详细的判断指南。例如，我们为商家主网站编写的判断指南长达\
  \ 48 页，完全由开发团队创建，以确保我们为网站（我们有六个）获得的标签是正确的。这份 48 页的指南并非一蹴而就——最初，我们认为判断主网站的正确性会更容易。但随着时间的推移，判断团队在判断网站的过程中会发现新的场景，所需的标签也会发生变化，开发团队会发现他们需要为某个或某些特征提供更多数据，因此给判断员的指导也会随之改变。判断员也经常就特别棘手的问题向开发团队寻求判断建议，这反过来又会导致系统中出现新特征或更清晰的判断指南。\n\
  \n\n\n### 向评估员学习\n\n评估员每天都会查看数百个数据示例，最终在某些情况下比开发团队自身更了解数据。请与评估员保持密切联系并经常与他们开会。将他们遇到的所有异常案例记录在评估指南中。评估员在定期向团队描述他们遇到的真实世界异常案例时，常常能激发开发团队创造新功能。开发团队与评估员每周举行一次会议，了解数据中的真实情况以及评估员遇到的问题类型，这是一个很好的做法。\n\
  \n例如，在最初的标注工作中，我们要求评估员回答这样一个问题：“该网站是否为该企业的官方网站——比如[`http://www.walmart.com`](http://www.walmart.com)？”最初的标签选项是“是”、“不确定”或“否”。起初，Walmart.com\
  \ 这个网站是可以接受的。但随着时间的推移，我们意识到用户想要的是特定门店的网址，因此[`https://www.walmart.com/store/3098/bellevue-wa`](https://www.walmart.com/store/3098/bellevue-wa)\
  \ 比根域名 Walmart.com 更受欢迎，于是我们增加了“否——存在更合适的主网站”这个标签，用于标注像“[`www.walmart.com`](http://www.walmart.com)”这样的网站。\n\
  \n我们用于确保标签质量的其他技术包括：让多位评估员对同一实体执行相同的标注任务，然后检测多位评估员在特定实体的标签上出现分歧的情况。我们会定期审查提供错误标签的评估员的表现，并努力进一步培训这些评估员，同时更新评估指南，确保标注挑战被清晰记录和解释，以便未来的标签正确无误。\n\
  \n我们强烈建议开发团队与提供标签的评估员保持充分互动，并致力于创建越来越好的评估标准。特别是，我们不会使用类似“土耳其机器人”式的评估方式，除非任务极其简单——当你的评估指南（仅用于判断网站准确性）长达\
  \ 48 页时，很难从众包中获得你想要的标签质量。\n\n## 应对客户 DSAT\n\n在必应中，我们使用“客户 DSAT”这个短语来指代数据或用户体验中导致客户不满的特定问题——“**D**is**SAT**isfaction”（不满意）。例如，一个常见的客户\
  \ DSAT 可能是：我们列出的某家企业在周末营业时间为上午 9 点到下午 5 点，但它在周日却关门了。更糟糕的 DSAT 是：我们列出的某家企业在周末营业时间为上午\
  \ 9 点到下午 5 点，但它已经停业或搬到了不同的地址。\n\n客户 DSAT 带来的最大挑战之一是判断它是否是一个需要大型团队投入和新策略来解决的重大问题，还是我们只需对当前的具体问题进行“热修复”并继续当前工作。这个困境的最佳例子是当团队收到一个令人非常头疼的“副总裁”级别的\
  \ DSAT。团队中的一个例子是：一位副总裁前往温哥华附近的一个城市，打算去一家服装店。这位副总裁在必应上搜索了这家服装店——显示为营业中。于是副总裁步行了几个街区到达该服装店，却发现这家店已经停业了。\n\
  \n在我们负责的地图和本地数据领域，出现这样的 DSAT 会产生现实世界的影响。在这个案例中，某人（也就是我们的副总裁）进行了一次原本可能愉快的散步，但当发现这显然是一次徒劳的步行时，这次散步就变得不愉快了。随后团队被问到的问题是：第一，我们做错了什么才提供了错误的商家信息？第二，这代表了一类新的问题，还是一个异常值——鉴于我们对该商家所掌握的数据，我们确实无法检测到这种情况？\n\
  \n总体而言，我们所谓的“歇业准确率”相当高——准确率高达 90% 以上。我们的竞争对手也拥有同样高的数字。但在一个拥有 1000 万个本地实体的目录中，假设歇业准确率为\
  \ 98%，你仍然会得到 20 万个显示错误歇业状态的实体。如果准确率提高到 99%，你仍然有 10 万个实体显示错误的歇业状态。在像企业是否停业这样瞬息万变的事情上，要实现\
  \ 100% 的准确率基本上是不可能的——尤其是当经营失败的企业主几乎没有动力让全世界知道这件事的时候。\n\n以那家停业的服装店为例，当我们查看系统中关于该服装店的所有已知信息时，没有任何信号能告诉我们这家店已经关门了。我们所有提供该服装店信息的数据提供商都一致认为这家店仍在营业。我们的竞争对手也显示这家服装店在营业。因此，为了解决这个特定的\
  \ DSAT，我们只是根据副总裁在步行多个街区到达该服装店后获得的新信息，手动更正了该实体的状态。\n\n\n\n### 识别 DSAT 的类别\n\n不过，有时客户\
  \ DSAT 中确实会出现一些模式，这些模式可以催生出一类 DSAT，它们可以作为一个整体来解决，而不是作为一次性修复。当团队对每个客户 DSAT 进行认真的事后剖析，以确定发生了什么，以及系统中是否存在本可以预防该\
  \ DSAT 的数据时，这些模式就会显现出来。\n\n当我们首次为 iPhone 和 Android 推出必应应用时，我们有一个功能，可以列出用户附近区域的所有餐厅。虽然我们的目录中一直都有这些数据，但必应通常呈现餐厅的方式是展示几个街区范围内最受欢迎的十家餐厅。相比之下，移动应用的工作方式是展示特定区域内的所有已知餐厅。于是，我们突然发现，该应用展示了更多的“长尾”或不太受欢迎的实体，这些实体的质量低于我们的“头部”或更受欢迎的实体。移动应用基本上暴露了一个数据问题，而之前我们目录的呈现方式，由于缺乏有效机制来展示超过十个左右的结果，这个问题一直被隐藏着。\n\
  \n这个新应用引发了一场数据危机，我们开始意识到，在不太受欢迎的实体长尾中，我们确实存在严重问题。这个问题之前从未在我们的数据指标中显现出来，因为我们根据受欢迎程度（即用户点击搜索结果的频率）来抽样评估实体——我们称之为“印象加权”指标。基本上，每次一个实体被点击，它就会被放入一个“袋子”中，我们在生成测量集以评估数据目录质量时，会从这个袋子中抽取样本。因此，像加州扬特维尔的*托马斯·凯勒的法式洗衣房*这样受欢迎的餐厅，被测量的可能性远高于同一地区不太受欢迎的餐厅，或者更糟的是，一家已关闭但仍在数据目录中显示为营业的餐厅。我们将这些明显糟糕、陈旧、已关闭的“长尾”实体称为“垃圾实体”。\n\
  \n当我们深入探究这个新的“垃圾实体”危机时，我们发现数据中存在一些特定的信号，我们可以利用这些信号来减少垃圾实体的数量。具体来说，我们发现这些垃圾实体通常来自那些数据源于扫描电话簿的数据提供商，他们的语料库更倾向于生成批量邮件，在这种情况下，一个糟糕的实体最坏的结果就是信封被退回给发件人——而不是让顾客走到一家已不存在的店铺前。\n\
  \n于是，我们能够专注于这一类 DSAT，并设计了一系列项目和模型变更，以从我们的目录中移除这些垃圾实体。举个例子，对于餐厅，我们训练了一些模型，这些模型会赋予来自数据优势在于餐厅而非电话簿扫描的提供商的“营业或关闭”信号更高的权重。我们还生成了一套新的指标，这些指标不是“印象加权”的，目录中的任何实体被选中进行测量的概率与其他实体相同。这为我们生成了一套不同的质量指标，这些指标更清晰地衡量了我们的垃圾实体问题以及整个目录中糟糕实体的数量。\n\
  \n### 垃圾必胜客实体\n\n关于垃圾实体问题的一个有趣例子是，一个合作团队详尽地列出了我们在某个特定大都市区记录在案的所有必胜客。其中许多已经不再营业，因为它们倒闭了。这促使作者们发现了一个特别有趣的世界：所有那些在\
  \ 20 世纪 70 年代和 80 年代大规模建造的红屋顶式必胜客建筑后来都怎么样了。书籍《必胜客狩猎》（[`www.pizzahunting.com`](http://www.pizzahunting.com)）展示了这些已倒闭的必胜客建筑中有多少至今仍被用作花店、医生办公室等各种场所。\n\
  \n### 定期自我评估：数据沉浸与质量评审\n\n有时，数据危机对每个人来说都是显而易见的，就像我们在新的移动搜索结果处理方式中看到的垃圾实体问题一样。其他时候，它则不那么明显，因为团队正忙于构建新功能，而数据危机未能被正确识别。\n\
  \n我们发现有两种技术对于确保我们定期了解自身的数据问题非常有用，即“数据沉浸”和“质量评审”。\n\n数据沉浸是指团队中的一小部分人（大约四到六人）会面一小时，深入查看数据的某个切片，以理解特定的数据问题。例如，当我们努力寻找解决数据语料库中垃圾实体问题的方法时，我们花了大量时间查看长尾实体，探究这些实体的来源，以及网络上或其他提供商或来源是否有额外的信号可用于将特定实体分类为垃圾实体。由于垃圾实体主要是过去某个时间点有效的实体，我们通过数据沉浸发现的一个来源是，对于某些垃圾实体，我们可以在网络上找到诸如“这家餐厅很棒，可惜已经关门了”之类的评论。因此，我们投资了网页提取和自然语言处理技术，以在我们能找到的特定实体评论中检测这些信号。数据沉浸将在第\
  \ 6 章：有效沟通中更详细地描述。\n\n数据沉浸会与另一种在必应被称为“搜索质量评审”的常规实践相结合。在这种通常每隔几个月举行一次的评审会议中，我们会汇总过去几个月报告的所有\
  \ DSAT，并尝试识别是否存在任何 DSAT 模式表明我们遇到了数据危机，如图 2-7 所示。\n\n![../images/473932_1_En_2_Chapter/473932_1_En_2_Fig7_HTML.png](img/473932_1_En_2_Fig7_HTML.png)\n\
  \n图 2-7\n\n三个月内排名靠前的 DSAT 汇总示例——数字为虚构\n\n我们还利用这些定期的质量评审会议来查看我们顶层指标的记分卡。图 2-8 显示了一份示例报告，其中列出了自上次质量评审以来哪些数字有所改善，哪些数字有所恶化。我们还将这些指标与主要竞争对手的测量结果进行比较，以了解我们相对于主要竞争对手的位置。\n\
  \n![../images/473932_1_En_2_Chapter/473932_1_En_2_Fig8_HTML.png](img/473932_1_En_2_Fig8_HTML.png)\n\
  \n图 2-8\n\n本地数据记分卡示例——数字为虚构。Q 是根据其他分数计算得出的综合加权分数。\n\n基于这些作为我们关注重点的指导原则，我们会制定一个按优先级排序的技术和项目列表，以改进关键的\
  \ DSAT 领域，并在我们质量下降或竞争对手遥遥领先的指标上提升分数，如图 2-9 所示。\n\n![../images/473932_1_En_2_Chapter/473932_1_En_2_Fig9_HTML.png](img/473932_1_En_2_Fig9_HTML.png)\n\
  \n图 2-9\n\n质量评审后解决关键 DSAT 的技术\n\n\n\n### 成功质量评审的要素\n\n遵循以下步骤，即可成功完成质量评审：\n\n1. \
  \ 自上次评审以来，尽可能多地查看并分析差评（DSAT）的根本原因。\n2.  对差评进行分类，并按关注程度排序。\n3.  确定关键顶层指标，并创建记分卡。\n\
  4.  结合排序后的差评与顶层指标，制定优先关注的领域清单。\n5.  利用从差评根本原因分析中学到的经验，提出改进领域，并为下一阶段的工作确定优先级。\n6.\
  \  定期重复上述步骤。\n\n### 衡量竞争对手\n\n我们在所处领域的一个优势是，拥有非常强大的竞争对手，我们可以定期衡量他们的质量，同时也衡量我们自己的质量。这常常帮助我们识别出竞争对手做得比我们好的领域，并给予我们信心和动力，去改进产品的特定方面。尽管我们会定期衡量竞争对手，但我们确保竞争对手的数据不会进入我们自己的目录。判断某个商家信息是否正确的“事实依据”，通常是通过直接致电该商家来确定的。如果无法做到这一点，我们会依赖该商家的官方网站或商家直接提供给我们的数据。我们不会将任何竞争对手的数据视为事实依据。\n\
  \n通过衡量，我们学到了几件事。首先，我们学会了对自己衡量的结果持怀疑态度，并随着时间的推移不断调整和完善我们的衡量方法。例如，我们开发了一个名为“Q”的质量指标。这个指标旨在成为一个复合指标，代表我们目录的整体质量。作为一个复合指标，它可以方便地作为多个其他指标的简略表达，这些指标包括名称准确率、电话准确率、电话覆盖率、停业准确率等等。对我们来说，Q\
  \ 是一个很好的目标设定指标——例如，我们曾计划在 6 个月内，在 Q 指标上比竞争对手提升几个百分点。\n\n但是，随着我们与竞争对手之间的 Q 值差距逐渐缩小，我们清楚地认识到，Q\
  \ 指标并未正确捕捉我们与竞争对手之间的质量差距。我们还通过询问最终用户，他们更偏好“左侧”还是“右侧”的结果（其中一侧由我们提供，另一侧由竞争对手提供），来衡量我们捕捉质量差距的效果。\n\
  \n在这些用户“偏好投票”中，我们学到了几件事。首先，我们观察到某些品牌存在品牌通胀现象。例如，当在我们的目录和 Yelp 之间进行左右对比时，即使事实依据表明我们是对的，人们也倾向于认为\
  \ Yelp 是正确的。人们已经逐渐信任 Yelp，尤其是在餐厅数据方面。\n\n我们学到的另一件事是，随着时间的推移，我们的复合“Q”指标过于简单，无法真实反映我们与竞争对手之间的质量差距。例如，人们更看重\
  \ Yelp 的数据而非我们的数据，是因为 Yelp 提供的餐厅评论数量和质量更高。我们注意到，人们更看重 Google 的数据而非我们的数据，是因为我们所谓的“屋顶经纬度”（即地图上图钉落点的位置）的准确性不如\
  \ Google。我们的图钉最初基本上是基于对商家地址进行地理编码生成的，对于提供驾车路线来说效果不错。但是，当人们在地图上搜索时，他们希望图钉能准确地落在建筑物上或建筑物入口处，而不是路边。因此，我们将“屋顶经纬度”加入到了我们的复合\
  \ Q 指标中。这虽然拉大了我们与 Google 之间的测量差距，但更准确地反映了我们相对于竞争对手的真实状况，并激励我们寻找新的数据源和技术来改进屋顶经纬度。\n\
  \n### 对自身指标保持怀疑\n\n尤其是当指标显示你在某个领域领先于竞争对手，但真实客户却不这么认为时。持续改进你的指标，并随着时间的推移对其进行微调和优化，这一点至关重要。这样，指标才能激励团队并告知他们当前与竞争对手的差距所在，从而产生持续缩小差距的前进动力。\n\
  \n同样重要的是，将这些指标保留在内部，尤其不要与市场部门或团队外不了解这些指标是不断演进的衡量方式的人分享——否则，可能会有人宣称你比竞争对手好多少，而实际上并不存在真正的优势。要帮助人们理解指标的误差范围。例如，在图\
  \ 2-8 中，幻灯片显示必应的名称准确率为 97.7，谷歌的名称准确率为 98.8。随着时间的推移，我们认识到，以这种精确度（精确到小数点后一位）报告数字是具有误导性的，因为这些数字的误差范围每次测量可能相差多达两个百分点。因此，谷歌的名称准确率实际上可能在\
  \ 99% 的误差范围内，而我们的名称准确率则在 95% 的误差范围内。此外，正如本章前面所讨论的，我们的指标是按展示量加权的，这意味着热门实体比长尾实体更有可能被测量到。当我们发现“垃圾实体”问题时，当我们开始衡量长尾实体的质量时，我们的名称准确率测量值要低得多。最终，我们开始同时报告展示量加权结果和未加权结果，以更准确地反映我们目录的质量。\n\
  \n## 结论\n\n在第二章“不断变化的需求”中，我们讨论了如何构建和开发能够预见变化的系统；如何通过测试、监控和衡量来预测和衡量变化；以及如何应对系统中的差评和已测量问题的策略。\n\
  \n在第三章“持续交付”中，我们将讨论如何确保团队持续构建、交付和验证软件与数据。\n\n"
- "# 3. 持续交付\n\n> *频繁地交付* ***可工作的软件*** *，交付的间隔可以从几周到几个月，倾向于更短的时间尺度。*\n> \n> *——agilemanifesto.org/principles*\n\
  \n本章所依据的敏捷原则描述了团队交付可工作软件的频率。我们将其扩展为包括频繁地交付数据，因为数据工程团队交付的很多内容都是高质量的数据。我们进一步扩展了这一原则，将“频繁”一词替换为“持续”——我们认为持续交付可工作的软件和准确的数据至关重要。我们对这一原则的改写是：“持续交付可工作的软件和准确的数据。”在任何一天，团队都应该拥有能够有效代表前一天增量工作的软件和数据。\n\
  \n如何从频繁交付转向持续交付？我们将分别考虑软件和数据如何实现这一点。对于软件，现代工程团队实践着称为“持续集成”和“持续部署”的技术。持续集成通过开发者在提交代码更改前进行验证，然后运行自动化系统来实现，这些系统会获取开发者最新的代码更改、构建这些更改、对这些更改运行测试，并最终部署这些更改——通常随着时间的推移，部署到一系列包含越来越多客户的环境中。\n\
  \n\n\n## 验证代码变更\n\n对于持续构建产品的自动化系统而言，在代码变更检入代码库之前，必须有一套机制来验证这些变更。系统的这一部分必须精心设计，并得到所有开发人员的尊重，以确保只提交高质量的代码变更。为确保代码变更具有最高质量，通常采取的措施包括：\n\
  \n*   编码规范和首选模式在团队中有完善的文档记录并被理解，并且在可能的情况下，由开发人员在提交代码变更前可在本地机器上运行的自动化工具进行检查。\n\n\
  *   在本地机器上，开发人员可以构建他们正在处理的系统以及所有其他依赖或可能受影响的系统，以验证没有发生构建中断。\n\n*   开发人员可以在本地机器或代表代码最终运行环境的在线开发环境中快速运行并验证修改后的系统。\n\
  \n*   开发人员可以快速运行一组单元测试，以验证开发系统时所做的假设——这些单元测试足够广泛，能够覆盖系统的大部分（我们通常力求达到 80% 的覆盖率），并且测试的编写方式使其能够极快地运行——通常通过使用模式来模拟启动成本高昂的系统部分。\n\
  \n*   新的代码变更会附带适当的单元测试或集成测试一起检入，以确保测试覆盖率保持在高水平。\n\n*   遵循代码审查流程，代码的任何变更都会由团队中的另一位开发人员（通常是在可能的情况下对该系统更有经验的人）进行检查和复核。审查中提出的任何修改建议都会被采纳并重新验证。\n\
  \n*   开发人员可以快速运行一小套集成测试，以端到端地测试系统——这些测试会在本地机器环境或在线开发环境中启动整个系统，并测试必须始终正常工作的系统关键功能。\n\
  \n*   开发人员同步源代码库中的最新变更，如果其他开发人员检入了与正在处理的系统相同区域的冲突变更，则重新合并变更。在此过程中每当发生变更时，都会重新构建并通过再次运行测试来重新验证。\n\
  \n*   一旦所有步骤完成，开发人员提交最终的代码变更。\n\n### 关注内循环\n\n请注意，对于这些步骤，应尽一切努力使开发人员运行的测试和验证数量尽可能快。有时这个验证阶段被称为开发人员的“内循环”，我们将在第\
  \ 5 章“积极主动的个体”中进一步讨论如何衡量这个内循环的健康状况。运行时间更长的更广泛测试可以放在持续集成“管道”的后面，这被称为开发人员的“外循环”。如果在管道后期发现开发人员检入的变更存在问题，系统可以自动拒绝该变更并将其发回，让开发人员找出问题所在。但是，在后期被外循环拒绝的变更代价也可能很高，因此必须在初始代码提交到持续集成系统之前在内循环中发现问题，与在后期外循环中发现问题的策略之间取得平衡。\n\
  \n## 持续集成系统\n\n一旦经过验证的变更被检入，持续集成系统就会接管。像 Azure DevOps 或 Jenkins 构建系统这样的系统可以自动化代码变更的集成系统。这些系统通常会监视新的检入以进行验证，并运行与开发人员在本地执行的一系列类似的验证步骤，但现在是在团队关心的所有构建目标和设备上运行，同时运行团队拥有的所有单元测试和集成测试。如果任何步骤失败，系统会拒绝该检入，并通知开发人员并提供日志，以便调查问题所在。典型的持续集成系统会运行如下步骤：\n\
  \n*   将团队仓库中的所有代码排队进行完整的干净重建，目标是团队关心的所有构建目标。例如，持续集成系统可能会构建针对 AMD-64 处理器的代码，包括调试版和发布版，以及针对\
  \ iPhone 或 Android 设备等设备的代码。\n\n*   在所有构建目标上运行更广泛的单元测试集。\n\n*   将系统部署到模拟生产环境的在线开发环境中，并在该环境中运行更广泛的集成测试集。\n\
  \n*   将编译后的代码部署到设备上，并在这些设备上运行测试（如果适用）。\n\n有时这个阶段会变得过于繁重，验证时间过长——一个好的经验法则是这个验证阶段应该在一小时左右完成。如果验证时间过长，则应减少对单个变更运行的测试数量，以缩短验证时间。那些不再对每个单独变更运行的测试仍应运行，但应以较低的频率对变更批次运行。例如，过去\
  \ 12 小时内提交的所有变更可以合并为一个批次，然后将从单个变更验证过程中移出的测试应用于这个更大的变更批次。如果在此阶段检测到故障，则需要更多工作来确定批次中的哪个变更导致了故障，但这通常值得以提升单个变更验证速度作为代价。\n\
  \n\n\n## 持续部署系统\n\n如果在持续集成系统中所有验证步骤均成功，该系统的最后一步有时被称为持续部署系统。持续部署系统的作用正如你所预期——它获取一组已验证的变更，并将其自动部署。通常，部署不会直接面向所有用户，因为即使是最优秀的单元测试和集成测试，也可能无法捕捉到代码变更中潜藏的某些额外问题。因此，持续部署系统通常会随时间推移，依次部署到一系列被称为“环”的部署环境中，这些环境代表着一组不断扩大的用户群体。\n\
  \n通常，新验证的代码变更所部署的第一个环境被称为“环 0”或内部环，如图 3-1 所示。这个环是开发团队日常使用的部署环境，可能还包括系统的一些早期采用者。每个环的构建方式都确保：如果某个变更部署到该环后导致该环用户遇到线上问题，可以快速回滚该变更，并将该环恢复到之前的状态。正如你所料，细节决定成败，处于持续部署下的软件系统必须精心设计，以确保能够回滚到之前的状态。例如，考虑一个部署到某个环境的变更，它修改了系统所用数据库的架构。如果此变更在一个环中失败，就必须有一种机制，不仅能回滚软件，还能将数据库恢复到之前的架构。有许多技术可以使系统在持续部署下良好运行，但这些超出了本书的讨论范围。\n\
  \n![../images/473932_1_En_3_Chapter/473932_1_En_3_Fig1_HTML.png](img/473932_1_En_3_Fig1_HTML.png)\n\
  \n图 3-1\n部署环\n\n如果团队和早期采用者在内部环中没有遇到任何问题，持续部署系统就会将同一组变更推送到一个更大的环境，从而影响更多用户。有时，在经历一定时间后，部署到下一个环是自动进行的；有时，团队会手动控制这个决策。如果变更在下一个环中成功，它就会被部署到更多用户，直到该变更对所有系统用户可见。创建持续部署系统的一部分工作，就是决定要支持多少个用户环，以及哪些用户属于哪个环。我们通常看到的系统包括：一个主要由团队成员参与的内部环，一个包含公司全体成员的公司环，一个开始包含那些选择使用系统最新、最棒功能的早期采用者环，以及最终包含所有系统用户的“全员”环。\n\
  \n### 吃自己的狗粮\n\n微软有一个悠久的传统，称为“吃自己的狗粮”（dogfooding），指的是使用仍在开发中的产品。这源于一位微软经理发送的一封标题为“Eating\
  \ our own Dogfood”的电子邮件，该邮件倡导增加对一款正在开发中的软件产品的内部使用。微软 Windows 系统已稳步将“吃狗粮”的范围扩展到公司外部的参与者，通过一个非常活跃的“Insider”测试计划，外部用户可以选择提前测试\
  \ Windows 中的早期功能。这类计划对微软来说非常成功，因为它们既能让那些过去需要数年才能交到真实用户手中的功能获得早期反馈，也能在微软内部并不总是可用的各种系统配置上进行早期测试。\n\
  \n当持续部署系统中出现问题时，我们提到回滚是理想的解决方案。为了更灵活地修复有问题的功能，有时也会使用其他技术。有时会采用“热修复”——这是一种一次性修复，直接部署到某个环中，以修复该环中出现的问题。理想情况下，热修复可以是对配置文件的更改，因此，只要可能，功能实现的方式应使其能够通过配置文件轻松修改。但配置文件的热修复虽然比更改随系统部署的二进制文件更容易，却同样危险，必须经过充分测试。热修复也可以通过应用少量代码更改、重新编译受影响的二进制文件、并用这些新更新的二进制文件修补该环来实现。如果可能，热修复应通过持续集成系统中相同的一套自动化验证步骤。\n\
  \n另一种用于确保行为不佳的功能可以被禁用的技术，是确保新发布的功能是“可飞行”（flight-able）的，并且可以通过配置设置轻松开启和关闭。飞行（Flighting）实际上与使环能够运作的系统非常相似——它能够将新功能提供给一部分用户，并通过指标收集，将他们的体验与未获得该功能的用户进行比较。你可以让一小部分用户参与一次飞行，尝试你的团队刚刚开发的新搜索体验，而其余用户则使用旧的搜索体验。然后，你可以监控新搜索体验用户与旧搜索体验用户之间的系统稳定性等指标。如果你发现新搜索体验的数据明显更差，你可以立即为所有用户关闭新搜索体验，同时通过查看日志来调查新系统中出现的问题。我们将在第\
  \ 7 章：监控中对此进行更多讨论。\n\n\n\n## 验证数据变更\n\n之前讨论的所有用于持续集成和部署代码变更的技术，同样可以用于持续集成和部署数据变更。这些技术包括：\n\
  \n*   数据工程团队的开发人员通常编写的是会改变数据的代码。正如修改数据的代码必须经过审查一样，当数据被代码修改时，数据本身也应接受审查。通常，当修改数据的代码发生变更时，不可能详尽地审查系统中发生的所有数据变更，但可以对代码对数据所做的变更进行抽样，并仔细检查，以确保没有发生意外的变更。\n\
  \n*   在检查已变更的数据时，应采取特定的抽样方法。应从完全没有变化的数据中抽样，以验证“未变更”是正确的。应从系统中删除的数据中抽样检查，以确保删除该数据是正确的。应检查添加到系统中的数据，以确保添加该数据是正确的。应抽样检查仅被轻微修改的数据。同时，也应抽样检查被大幅修改的数据。\n\
  \n*   团队应充分记录并理解数据标准和首选的数据模式，并在可能的情况下，通过开发人员在提交数据变更或导致数据变更的代码之前，可以在本地机器上运行的自动化工具进行检查。\n\
  \n*   如果因变更而需要重新处理的数据量足够小，可以在本地机器或能代表最终环境的在线开发环境中运行，那么应重新生成并验证所有受变更影响的数据。在许多大数据项目中，这并不可行，因此应重新生成并验证一部分具有代表性的数据切片。这个切片应尽可能广泛地抽样，以确保该切片包含较大数据集中所有类型模式的可能性很高。\n\
  \n*   遵循数据审查流程，对数据的任何变更进行检查，并由团队中的另一位开发人员（在可能的情况下，通常是系统中更有经验的人员）进行复核。审查中提出的任何修改建议都应被采纳并重新验证。\n\
  \n除了手动检查抽样的数据部分外，我们在第 2 章：变更需求中讨论了几种可用于自动化检查数据的技术。这些技术可以在开发人员的机器上使用，也可以作为持续集成系统的一部分，以及作为持续部署和环状系统的一部分：\n\
  \n*   数据“门禁”可以衡量数据中模式在变更前后的频率，以检查数据是否发生了可能是缺陷的极端变化。这些门禁由团队通过长期手动检查和学习其处理的数据所获得的经验来确定。例如，在必应的本地数据团队中，我们观察到，语料库中电话号码等内容的变动超过\
  \ 1%，更可能是由我们系统中的缺陷引起的，而不是由数据提供者提供的实际电话号码的现实世界变化和变更导致的。可以学习到许多关于团队处理数据的此类经验法则，并将其编码到数据门禁系统中，该系统可以在每次数据变更后运行。\n\
  \n*   哨兵实体是数据中已知代表绝对真理的实体。这些实体可以在每次系统变更后进行监控和重新验证，以确保它们保持不变。\n\n*   可以每天根据数据重新计算人工评判指标，以确保系统中某些已知实体集的质量持续提升。\n\
  \n### 关注变更\n\n在必应，我们每天都会评判一组包含 1500 个实体的集合。实际上，我们每天只评判该实体集中发生的变更，这些变更通常数量很少，人工评判员可以在不到一小时内完成审查。我们可以持续监控，由于系统中的代码变更，这组实体是变好了还是变差了。被评判为变差的具体评判结果可以由开发人员查看，以确定他们是否在系统中引入了缺陷，或者这仅仅是学习模型中的一次波动。\n\
  \n## 数据的持续部署\n\n与代码变更一样，当数据变更从一个环滚动到另一个环，再到下一个环时，应通过持续集成系统和持续部署系统自动验证。验证通过数据门禁、哨兵实体以及在新环中上线新数据时计算的评判指标来进行。数据变更通常比代码变更影响范围更广，因此对数据变更进行“热修复”要困难得多——尽管导致数据变更的代码变更有时可以进行热修复。数据的回滚系统通常代价高昂，尤其是在涉及大量数据时。\n\
  \n在必应，我们维护了两个数据存储系统，一个支持回滚，另一个不支持。我们能够将一组较小的实体保存在一个变更和回滚速度更快的系统中，即我们的“快速”存储。我们还有一组大得多的实体保存在“慢速”存储中，该存储的变更和回滚速度要慢得多。事实证明，通过在快速存储中保留大约\
  \ 200 万个实体，我们能够覆盖 80%的页面浏览量——也就是说，本地数据空间中 80%的本地查询是针对最热门的 200 万个本地商业实体的。其余 20%的查询则针对我们长尾的本地商业实体——大约\
  \ 1800 万个额外的实体。因此，我们在快速存储中保留了 200 万个实体，在慢速存储中保留了 1800 万个实体。这样，如果我们遇到灾难性的数据错误，我们可以在几分钟内回滚这\
  \ 200 万个实体，修复 80%的流量，但其余 20%的流量将受到影响，直到我们能够重建较慢的、包含 1800 万个实体的索引，而这通常需要数小时。\n\n\
  ## 决定发布什么\n\n能够持续部署数据和代码，并不总是意味着你应该这样做。决定不发布什么与决定发布什么同样重要。对于纯代码功能、不影响数据的功能，你应该为该功能配备足够的遥测技术，以便能够确定用户是否真的在使用该功能，以及它是否真正满足了业务需求。我们将在第\
  \ 7 章：监控中进一步讨论遥测技术。功能的实现方式应使其能够进行飞行实验，并且可以比较功能开启和关闭时的指标。同样重要的是，开发功能的方式应使其能够轻松关闭并从系统中移除。如果遥测数据显示某个功能未被使用或未满足业务需求，则应将其移除。\n\
  \n\n\n### 果断舍弃\n\n你花了数周时间开发某个功能，上线后发现用户根本不使用它。尽管你可能会尝试几轮调整，看看能否让它起死回生，但你不应过于执着于某个功能而舍不得放弃。不发布这个功能，看似那几周的努力就白费了。然而，未来维护的噩梦远比功能的初始开发成本要高昂得多。一个精准满足客户需求的简洁产品，远胜于一个复杂但用户只用到一小部分功能的产品。\n\
  \n关于哪些数据变更应该发布，决策起来更为棘手，通常需要在项目早期就做出判断。项目中经常出现这样的情况：团队中的某位数据科学家对模型进行了改进，准备发布。你如何决定是否发布它？有许多指标可以用来评估学习模型的“优良程度”。这些指标很有用，应该被测量并作为评估是否发布新模型的一部分。\n\
  \n另一种评估模型的实用方法是查看模型的“胜出”和“失败”案例，并基于此分析判断模型是否值得发布。当数据科学家想要发布一个改进后的模型时，我们会从模型对数据所做的所有变更中抽样，并判断哪些是好的变更、哪些是中性的、哪些是坏的变更。修订后的模型很少会不引入少量“坏”变更而只有好变更。有时，坏变更和好变更的数量相近，但坏变更的严重程度更高。在这种情况下，就需要进行额外的工作，看看能否进一步优化模型，在保留足够多好变更的同时，去除足够多的坏变更，使模型值得发布。\n\
  \n新模型也可能引入一些并非更好、只是不同的变更。不发布这些模型很重要，因为它们带来的随机变更量根本不值得。发布那些会交换两个正确属性的数据变更，会使用户感到困惑。例如，企业通常有多个电话号码，这些号码都能接通到同一位联系人。我们可能会有一个新模型来更改主要电话号码，但这只会让用户困惑，因为企业的号码变了，但他们仍然能接通前台同一个人。只要可能，我们就会避免发布此类模型。\n\
  \n### 更好的模型可能成本过高\n\n尽管我们通常会发布那些好变更的数量和影响超过坏变更的模型，但我们还会考虑另一个因素：新模型的成本和复杂性。有时，新模型能产生更好的数据，但其运行成本会显著增加。例如，模型可能需要多花数倍的时间才能产生结果，从而拖慢产品速度，或增加高效运行所需的硬件数量。有时，新模型能产生更好的数据，但其复杂性意味着维护其持续健康运行将是一场噩梦。这些不那么明显的方面，对于一个在其他方面胜出的模型来说，应该被考虑，有时甚至会导致新模型被否决。\n\
  \n## 结论\n\n在第 4 章“与业务对齐”中，我们将讨论与业务协调工作的重要性及技巧。\n\n"
- "# 4. 与业务对齐\n\n> ***业务人员与开发者*** 必须在整个项目中 ***每天*** 都一起工作。——agilemanifesto.org/principles\n\
  \n*Ciao* 是一个成立于德国的价格比较和产品评论网站，后来成为许多欧洲市场的顶级购物网站（如图 4-1 所示），到 2008 年，它在欧洲每月吸引 1960\
  \ 万独立访客。微软于 2008 年收购了 Ciao，以增强其在欧洲的必应搜索引擎。在微软收购后，Eric 有机会作为新的工程经理与 Ciao 团队合作。Eric\
  \ 观察到的是一个与业务高度对齐的开发团队——比他之前在微软工作时观察到的大多数团队都要对齐。促成这种高度对齐的因素有很多。在本章中，我们将探讨使 Ciao 成功的几个关键因素。\n\
  \n![../images/473932_1_En_4_Chapter/473932_1_En_4_Fig1_HTML.jpg](img/473932_1_En_4_Fig1_HTML.jpg)\n\
  \n图 4-1\n\n2012 年 Ciao 网站的英文版本\n\n\n\n## 每日更新的重要性\n\n对埃里克来说，在微软工作 10 年后加入 Ciao，最令人震惊的部分或许是，业务人员和工程人员都同在一栋大楼里，甚至经常在同一层楼。软件开发人员会去厨房用微波炉热午餐；就在同一个厨房里，他们会遇到为网站销售广告的人、为网站创作内容的人、为网站做营销的人，以及维护网站托管服务器的人。推动业务发展的人与编写业务运行代码的人，实际上就并肩工作。相比之下，在埃里克任职微软期间，他从未见过营销人员、为产品撰写内容的人，或负责产品托管的人。\n\
  \n这种并肩工作的模式在 Ciao 并不止于午餐室。在网站广告系统上遇到问题的业务人员，会直接参加工程团队的每日站会，解释他们的问题或提出改进建议。软件开发人员可以走到某个在使用内容标签系统时遇到困难的人桌前，观察问题所在，然后常常带着一个具体的改进或修复想法回到自己的座位。\n\
  \n为了本章的目的，让我们进一步思考谁是 Ciao 网站的“客户”，谁是“业务人员”。客户有三种类型。首先，最大数量的客户是那些来到网站研究想购买的商品并寻找最低价格的人。第二个客户群体是评论社区：那些来到网站发表评论的人，他们受到声誉和有用评论的金钱奖励的进一步激励。最后一个客户群体是商家——那些有产品要销售的第三方卖家，他们希望自己的价格能列在网站上，并附上指向其网站的链接，客户最终会在那里购买他们正在选购的商品。\n\
  \nCiao 的业务人员是所有非工程岗位的员工，他们支持三个客户群体的需求，维持网站运行，确保资金流入，并推动业务向前发展。在 Ciao，这包括以下人员：\n\n\
  *   销售人员，他们说服商家在网站上列出价格，然后为商家提供工具支持，以便他们定期轻松上传价格数据\n*   内容人员，他们编辑和修正所有可购买商品的目录\n\
  *   社区人员，他们管理评论社区，确保其充满活力和繁荣\n*   营销人员，他们与其他公司组织特别活动——例如，他们与某些汽车制造商开展活动，让 Ciao 会员试驾并评论特定年份推出的新车型\n\
  *   计费和财务人员，他们确保在网站上列出价格的商家，因其网站获得的流量而被计费并支付费用\n*   SEO（搜索引擎优化）人员，他们确保网站从主流搜索引擎获得持续增长的流量\n\
  *   运维人员，他们确保数据中心健康运行\n\n相比之下，埃里克在微软的经历中，与他所参与产品的业务人员之间的分离程度要大得多，这些业务人员在微软扮演着类似的角色。在微软，“项目经理”角色与业务人员互动，然后将他们的需求转化为工程团队的需求。通过项目管理（PM）团队，埃里克间接地获得了代表许多业务人员希望在\
  \ Visual Studio 产品中实现的功能的指导。这种间接层级对业务和开发双方都很方便，但也让业务人员与他这位工程经理之间又多了一层隔阂。\n\n###\
  \ 每日更新的力量\n\n埃里克在 Ciao 经历的与业务同事日常互动的冲击，还因另一个事实而加剧：他正从开发世界上最大的 Windows C++应用程序之一（Visual\
  \ Studio，每隔几年才发布一次）转向一个通过 Web 交付、每隔几天就更新一次的应用程序。能够为 Web 构建一个功能并在第二天就发布，以观察用户是否喜欢该功能，这种即时性对于理解业务及其客户有着惊人的意义。在\
  \ Visual Studio 中，一个功能要开发数年才能最终发布；尽管在整个年度中会频繁咨询客户并进行演示，但 Visual Studio 经常发布客户不喜欢或不使用的功能。然而在\
  \ Web 上，这个周期急剧缩短，功能可以在数周而非数年内增量发布，并且一个功能的业务影响可以立即被衡量和量化。在必应（Bing），我们甚至更进一步——得益于将新变更小范围发布给少量用户，以及一个能对系统任何变更运行广泛测试的系统，我们每天都会发布更新。\n\
  \n\n\n## 同地办公的优势\n\n让我们列举一些在 Ciao 公司，业务人员与工程人员在同一楼层办公的优势，以及即使办公空间和人员位置不允许真正同地办公时，也能复制这些优势的一些方法。\n\
  \n首要优势之一是，当某个特定月份业务进展顺利、销售业绩良好、流量上升时，让工程团队感受到业务人员中的积极氛围和兴奋情绪，会对士气产生明确的影响。一个成功的月份对工程团队来说可能非常鼓舞人心，尤其是当他们看到自己所做的工作与业务取得的成果之间存在直接联系时。同样，在业务进展不顺利的月份，让开发人员也能感受到这种氛围也是有益的。通常在这些低迷的月份里，业务人员和工程人员之间会自发产生对话，从而催生新的功能创意或网站改进方案，以应对销售下滑、流量下降或客户投诉等问题。\n\
  \n找到方法让工程师感受到他们的工作与对业务产生的影响之间的关联性至关重要。一个好的做法是每月召开业务回顾会议，审查业务的关键数据。可以汇报的一些数据（包括环比变化）如下：\n\
  \n*   网站的总访问量、页面浏览量和独立访客数\n*   自然访问量 vs. 搜索引擎营销访问量\n*   用户参与度（用户在离开网站前浏览的页面数量）\n\
  *   网站停留时间/每次访问时长\n*   应用程序下载次数（如果属于业务范畴）\n*   月活跃用户数（MAU，过去 30 天内与网站有过有意义互动的独立用户）\n\
  *   月深度参与用户数（MEU，参与度远高于月活跃用户的独立用户——这些是你的忠实粉丝，通常是活跃用户中的一小部分）\n*   留存率数据（持续每月回访的独立用户数，以及相反地，每月流失的独立用户数）\n\
  *   每月总收入\n*   运营指标——在 Ciao 公司，这包括网站上列出的商家数量、提供的优惠数量（某个特定产品的商家专属价格）、网站上的产品数量以及评论数量\n\
  *   可用性指标——过去一个月网站经历了多少宕机时间以及发生在何处\n*   竞争对手对比指标——网站与主要竞争对手相比表现更好/差多少\n*   Comscore\
  \ 指标（Comscore 是一个衡量网站受欢迎程度和流量的网站）\n*   任何其他与当前正在推动的业务目标高度相关的指标\n\n有多种方式可以将这些业务指标和内容传递给开发人员。我们看到一些成功的方法包括：将月度业务回顾作为开发团队的可选会议；通过月度邮件发送业务信息；在始终保持更新的自助服务仪表板中提供；或在全体会议中展示。由于开发团队通常更喜欢构建产品，而不是阅读邮件或参加冗长的会议，我们也建议在冲刺演示会议结束时加入业务指标的简要总结。采用多种方式向团队传达这些信息以确保信息被接收，是非常值得的。\n\
  \n### 物理同地并非必需\n\n当然，物理同地办公并不总是可行的。第 6 章《有效沟通》讨论了敏捷原则中重视面对面互动，并提供了一些当真正的物理同地办公不可行时的思路。\n\
  \n## 业务驱动的 Scrum 团队\n\nCiao 公司非常擅长的一点是将 Scrum 团队直接映射到关键业务目标上。从高层来看，业务目标如下：\n\n*\
  \   增加网站的流量。\n*   通过提高网站转化率（即离开网站前往商家网站的流量百分比，这为 Ciao 带来收入），尽可能多地将流量变现。\n\nCiao\
  \ 公司的关键业务目标如下：\n\n*   增加产品目录的规模和品质。\n*   增加商家在网站上提供的优惠数量，并将这些优惠与我们的目录中的商品进行匹配。\n\
  *   增加用户在网站上撰写的高质量评论数量。\n\n这五个业务目标直接映射到了五个 Scrum 团队。“流量”团队持续监控进入网站的流量，并进行开发工作以尝试增加网站流量。“转化率”团队持续监控网站的转化率，并致力于提高该比率。“产品”团队负责提升目录的质量和规模。“优惠”团队负责提高网站上产品优惠的数量和匹配率。“评论”团队则寻找新的方法来激励和提高评论质量，以及我们网站上评论撰写者社区的参与度。\n\
  \n有时，一个团队追求的目标和指标会与另一个团队追求的目标和指标从根本上产生冲突。例如，产品团队有时发布的功能会增加用户在网站上的停留时间，但会减少离开网站前往我们商家网站的点击次数。产品团队实现了他们提高目录质量和丰富度的目标，因此用户更多地与这些内容互动，但他们没有像以前那样快速（有时甚至根本不）前往商家网站购买商品，这影响了转化率团队。当一个团队发布的工作影响到其他团队的目标和指标时，会咨询业务领导者来决定哪个优先级更高。\n\
  \n在创建 Scrum 团队时，需要牢记几点。首先，尝试找到方法，让 Scrum 团队尽可能紧密地与业务目标以及易于定期衡量的业务指标联系起来。如果像“转化率”这样直接的日常业务指标无法为某个特定\
  \ Scrum 团队的指标驱动目标进行计算，那么尝试找出一种方法来量化和评分该团队正在推动的目标。让一个 Scrum 团队拥有一套他们可以持续监控的指标，检查他们的工作是否推动了指标变化，如果没有，则重新评估他们的工作直到指标发生变化，这是极其有效的。团队应该为每个冲刺设定目标，即他们认为自己能在每个冲刺中将所推动的业务指标提升多少。\n\
  \n表 4-1 展示了一些具体的业务指标示例，这些指标我们曾与本书中讨论过的一些团队一起使用过。你可以在此列表中看到计算型指标和评判型指标。计算型指标可以很容易地从系统数据中计算得出。评判型指标的成本更高，因为它们需要人工评判员查看数据来计算——这也意味着它们无法像计算型指标那样频繁地被计算。\n\
  \n表 4-1\n\n具体的业务指标\n\n\n\n| 团队 | 指标 | 指标类型 |\n| --- | --- | --- |\n| 本地数据融合团队 |\
  \ 过度匹配率/不足匹配率 | 人工判定（每周）/人工判定（每周） |\n| 本地数据网页提取团队 | 从网页提取的前 1000 家连锁企业占比/展示已提取数据的网站流量占比/从网页提取的电话号码准确率/已提取电话号码的企业占比\
  \ | 根据目录计算 |\n| 本地数据管道团队 | 新数据出现在数据源到在网站上可见的秒数 | 根据目录和网站计算 |\n| Ciao 流量团队 | 每月独立用户数\
  \ | 根据网站计算 |\n| Ciao 产品团队 | 带图片的产品数量/带评论的产品数量/产品-图片匹配准确率/产品-评论匹配准确率 | 根据目录计算 |\n\
  | Ciao 优惠团队 | 跳转至商家网站的点击次数/关联商家价格的产品数量 | 根据网站计算 |\n| Ciao 社区与评论团队 | 过去一个月内发布过被其他社区成员认为有帮助的评论的社区成员数量\
  \ | 根据网站计算 |\n\n由于指标由各团队自行决定，请设法实现指标的自动化。尽可能每日追踪，并维护一个仪表板，让团队成员能够观察指标是否朝着正确方向变化。\n\
  \n### 团队命名的影响力\n\n另一个对团队非常有效的工具是团队的命名方式。Eric 曾合作的一个团队，其产品存在两大问题：首先，它无法`扩展`以支持大量用户和海量数据；其次，为产品开发新功能的开发人员需要费力地处理现有代码和复杂的\
  \ API，从而拖慢了新功能发布的速度。该团队最初的名称反映了他们在产品中负责的子系统。例如，“图形”团队负责产品的图形引擎，“布局”团队负责产品的布局引擎。不出所料，名为“图形”的团队将大量工作投入到调整和持续改进图形引擎上，而布局团队也对其布局引擎做着同样的事。通过将团队重新命名为“扩展”团队和“速度”团队，团队的工作产出自然发生了变化，开始与团队整体面临的最重要问题保持一致，而非架构图中的模块划分。\n\
  \n在可能的情况下，最好能有一个统一的指标，让整个团队最终都明白自己正在朝着这个目标努力。对于网络产品，我们经常看到这个数字是月活跃用户数——这个数字是否在持续增长？对于一个移动应用团队，App\
  \ Store 评分和月活跃用户数被视为最重要的驱动指标。对于必应的本地数据团队，我们最关注的数字是“Q”——本地企业目录的综合质量评分。但这个数字存在一定缺陷，因为它假设仅凭高度准确的目录就能推动产品使用——随着时间的推移，我们发现这个指标并不十分可靠，因为它与必应上的真实用户体验之间隔了太多层级。即使拥有高质量的目录，该目录如何以及何时呈现给用户仍存在许多问题，这使得\
  \ Q 无法完美反映网站上本地企业数据的用户体验。\n\n## 与业务方合作理解数据\n\n我们在开发必应本地搜索时最富有成效的经历之一，就是拜访一些为我们提供数据源的数据提供商，我们将这些数据源整合起来创建企业目录。通过与为我们收集数据的业务人员交流，我们获得了重要的见解，从而能够理解我们所依赖的数据源，并构建更好的机器学习模型来处理和优先排序数据。\n\
  \n在必应本地搜索的早期，我们曾前往一家主要数据提供商的总部，该提供商的数据源被用于创建我们的目录。我们研究了他们的数据，感觉这导致了大量质量问题——尤其是产生了大量重复的企业。我们与他们的工程团队讨论了去重系统，很快就发现他们使用的系统非常原始。此外，一位工程负责人指出，由于他们数据的主要客户是通过美国邮政系统向其他企业发送邮件的公司，因此“有重复数据往往是好事”，因为向一家热门企业多寄几份邮件（目录中越热门的企业越容易出现重复）并非坏事，这反而会增加你的营销邮件被热门企业打开的机会。\n\
  \n另一家数据提供商向我们提供了大量已关闭的企业信息。通过与该提供商更密切地沟通，并了解他们如何获取记录，我们得知他们数据的主要来源之一是通过 OCR 扫描电话簿。在某些市场，他们的扫描数据不如其他市场更新。在他们的后端系统中，他们保留了每条记录的扫描日期，但并未在数据源中提供该信息。通过与业务人员和工程师交流，我们很快发现，他们可以相对简单地为我们提供系统中每条通过\
  \ OCR 获取的记录的扫描日期。这为我们提供了一个宝贵的额外信号，我们的机器学习模型可以利用它来判断某家企业关闭的可能性。\n\n### 数据提供商\n\n\
  与为你提供数据的第三方进行沟通，确保你了解他们收集数据的方式及其商业模式。数据提供商通常愿意为你提供他们后端系统中可能拥有但未在数据源中提供的额外信号。\n\n\
  \n## 帮助业务部门理解机器学习的局限性\n\n刚开始采用基于机器学习的解决方案时，业务部门往往期望开发团队能创造奇迹。尽管机器学习能产生惊人的成果，但确保业务部门理解其局限性也很有帮助。我们与业务人员打交道时面临的最大挑战之一，就是帮助他们理解特定机器学习模型的功能特性。\n\
  \n虽然有许多指标可用于评估特定机器学习模型（例如 F1 分数），但我们通常使用精确率和召回率作为向业务部门传达机器学习模型性能的指标。以下是对精确率和召回率的快速回顾，希望能消除其神秘感。\n\
  \n设想一个场景：一名捕狗员受命外出抓捕城市里所有的狗。但捕狗员未能完美完成任务，不仅没有抓到城里所有的狗，还意外地抓了一些猫。图 4-2 展示了这个例子如何映射到机器学习的精确率和召回率概念上。如果每个狗或猫的图标代表\
  \ 1000 只狗或猫，那么捕狗员抓到了 2000 只狗和 3000 只猫——但城里实际上有 7000 只狗。捕狗员抓到了 3000 个假正例（猫）和 2000\
  \ 个真正例（狗）。因此，这次抓捕的精确率是抓到的狗的数量除以错误抓到的猫的数量加上抓到的狗的数量，即 2000/(3000+2000)，也就是 40%。召回率是抓到的狗的数量除以抓到的狗的数量加上未被抓到的剩余狗的数量，即\
  \ 2000/(2000+5000)，大约是 29%。\n\n![../images/473932_1_En_4_Chapter/473932_1_En_4_Fig2_HTML.png](img/473932_1_En_4_Fig2_HTML.png)\n\
  \n图 4-2\n\n捕狗员的精确率和召回率\n\n当业务部门开始理解这些“虚拟捕狗员”模型的精确率和召回率，并熟悉如何用这些术语进行讨论后，你就可以开始与他们进行更细致的对话，探讨特定模型的表现如何。例如，业务人员会逐渐认识到，通常不可能让模型的精确率或召回率达到\
  \ 100%。一个精确率和召回率都达到 95% 的模型，往往需要付出巨大的努力才能实现。即使一个精确率达到 99% 的模型听起来很棒，但这意味着每 100 次中就有\
  \ 1 次会得到错误答案。此外，如果该模型的召回率只有 1%，那它可能毫无用处。现实与完美之间的差距是机器学习团队持续面临的挑战——业务部门必须制定计划来应对算法出错的情况。\n\
  \n在本地数据领域，我们通过几种方式应对模型达到高精确率和高召回率但并非 100% 的现实。首先，我们构建了一个系统，可以非常方便地手动快速纠正网站上发现的任何错误，这样当机器学习模型出错时，可以对其进行覆盖。其次，我们引入了人工审核环节，特别是针对最有可能展示给用户的数据。我们发现，尽管我们的本地商家目录中包含了美国市场的数百万家商家，但人们在网站上实际搜索的内容中，有\
  \ 20% 集中在 5 万个实体上——即网站上最热门的本地商家。对于这 5 万个实体，我们使用机器学习算法来创建它们，但也通过人工进行反复检查和双重确认，以确保它们\
  \ 100% 正确，而不是 98% 正确，因为这对整体用户体验有重大影响，毕竟它影响了我们 20% 的流量。\n\n我们发现的另一件事是，经常与业务部门讨论诸如“已关闭商家分类器的精确率现在是\
  \ 97%，召回率是 85%”之类的话题很有用，因为随着时间的推移，业务部门会了解在给定几个月的开发周期内，期望精确率和召回率提升到何种程度是合理的。业务部门会明白，提高精确率所需的工作类型通常与提高召回率所需的不同。他们会了解到精确率和召回率之间存在权衡——例如，以牺牲精确率为代价来提高召回率是相当可行的。他们还会认识到，当模型的精确率和召回率都达到\
  \ 90% 以上时，后续的进步将更加昂贵。\n\n### 强大竞争对手的好处\n\n在必应本地搜索领域，我们有一个优势：除了报告我们自身模型的精确率和召回率，我们还可以评估竞争对手的精确率和召回率。在设定为期\
  \ 6 个月的目标时，我们经常采用“缩小一半差距”的规则，事实证明这是一个有用的经验法则。在我们落后于竞争对手的领域——例如，我们可能测量到谷歌在电话号码上的精确率是\
  \ 98%，而必应的是 94%——我们发现，计划在 6 个月内将差距缩小一半是合理的，这意味着如果我们有“存在性证明”，即测量到另一个竞争对手达到了比我们更高的精确率，那么设定从\
  \ 94% 提升到 96% 的目标是可行的。在没有先例的情况下，这更难做到，因为如果没有先例表明在某个特定数据属性上可以达到如此高的精确率，你很难真正知道达到\
  \ 98% 的精确率有多大可能。\n\n## 向业务部门传达工程节奏：我们如何实施 Scrum\n\n正如工程团队需要了解业务动态一样，业务部门也需要了解工程团队的进展。如果做不到这一点，可能会导致业务部门对工程团队及时解决关键业务问题的能力失去信心。我们使用\
  \ Scrum 和 Scrum 工件来与业务部门进行有效沟通。在本节中，我们将更详细地描述我们对 Scrum 所做的定制化调整。本节假设读者对 Scrum 的一般原则有基本了解。如果你不熟悉\
  \ Scrum，我们推荐 Ken Schwaber 和 Jeff Sutherland 编写的《Scrum 指南》（可在 [`www.scrum.org/scrum-guides/`](http://www.scrum.org/scrum-guides/)\
  \ 找到），以及 Henrik Knibert 编写的《来自前线的 Scrum 和 XP》（可在 [`www.infoq.com/minibooks/scrum-xp-from-the-trenches`](http://www.infoq.com/minibooks/scrum-xp-from-the-trenches)\
  \ 找到）。\n\n### Scrum 团队\n\n在微软的团队中，产品负责人通常是项目经理或架构师。Scrum Master 是开发经理、技术负责人，或者是开发团队中对推动\
  \ Scrum 和帮助团队成功充满热情的人。无论谁担任 Scrum Master，他们都不应期望自己能满负荷地安排编码工作——他们每天需要额外花一些时间来帮助团队成员扫清障碍，并维护待办事项列表。\n\
  \n\n\n### 组合待办事项与产品待办事项\n\nAzure DevOps 支持 Scrum 概念中的史诗和特性。这些主要是业务概念，用于帮助业务团队或产品负责人管理产品计划。史诗和特性有时被称为“组合待办事项”。特性的规模应足够大，以便能够关联多个用户故事——用户故事是开发团队在所谓的“产品待办事项”中使用的主要概念。这些关系如图\
  \ 4-3 所示。\n\n通常，史诗会跨越多个发布版本，团队可能需要多个季度（一年中的四分之一时段）来完成。特性通常无法在一个冲刺中交付，但可以在一个产品发布周期内交付。一个由五到七人组成的团队可以在一个冲刺中完成多个用户故事，但有时一个用户故事也可能跨越多个冲刺。特性与用户故事之间的连接，正是业务驱动的“组合待办事项”与开发驱动的“产品待办事项”之间的桥梁。\n\
  \nScrum 团队通常只在冲刺规划会议或冲刺评审会议中讨论特性，此时他们需要判断某个特性是否已完成，以及还需要规划哪些额外的用户故事才能完成该特性。\n\n\
  ![../images/473932_1_En_4_Chapter/473932_1_En_4_Fig3_HTML.jpg](img/473932_1_En_4_Fig3_HTML.jpg)\n\
  \n图 4-3\n组合待办事项与产品待办事项之间的关系。来源：[*https://docs.microsoft.com/en-us/azure/devops/boards/work-items/guidance/agile-process-workflow*](https://docs.microsoft.com/en-us/azure/devops/boards/work-items/guidance/agile-process-workflow)\n\
  \n表 4-2 展示了史诗、特性、用户故事和任务的一些具体示例，并针对一个假设的团队（该团队致力于让用户能够在 Bing 中搜索 Office 365 内容，如文档、联系人、电子邮件、日历）给出了关于典型持续时间和每个父类型下典型数量的经验法则。\n\
  \n表 4-2\n史诗、特性、用户故事和任务\n\n| 概念 | 示例 | 典型持续时间 | 每个父类型下的典型数量 |\n| --- | --- | ---\
  \ | --- |\n| 史诗 | 允许用户在 Bing 中搜索其 Office 365 数据 | 多个发布版本（季度） | 主要版本中总共五到十个史诗 |\n\
  | 特性 | 允许用户在 Bing 中搜索其 Office 365 联系人 | 发布版本（月） | 一个史诗中包含数十到数百个特性 |\n| 用户故事 | 构建体验，允许用户浏览其\
  \ Office 365 联系人 | 冲刺（一到三个冲刺） | 完成一个特性需要数十个用户故事 |\n| 任务 | 编写代码，从 Office 365 图表中获取联系人\
  \ XML | 天数（大约一到五天） | 每个用户故事包含数十个任务 |\n\n我们的产品待办事项由 Azure DevOps 中的“用户故事”组成，如图 4-4\
  \ 所示，这些用户故事又进一步分解为任务。产品待办事项记录了团队想要完成的所有工作。冲刺待办事项（在 Azure DevOps 中位于“冲刺”下的“待办事项”中）显示了冲刺待办事项。冲刺待办事项是在冲刺规划会议中创建的，理想情况下，只需查看产品待办事项（在\
  \ Azure DevOps 中位于“工作”下的“待办事项”中）中优先级最高的用户故事，并按优先级顺序将其添加到下一个冲刺中，直到冲刺排满为止。\n\n![../images/473932_1_En_4_Chapter/473932_1_En_4_Fig4_HTML.jpg](img/473932_1_En_4_Fig4_HTML.jpg)\n\
  \n图 4-4\nAzure DevOps 用户故事待办事项示例\n\n产品待办事项中的用户故事不应过于庞大。根据经验法则，它们应能在一个冲刺内完成，最多不超过三个为期两周的冲刺。要判断用户故事的粒度是否合适，一个典型的五到六人\
  \ Scrum 团队应该能够在一个冲刺中承担大约七个用户故事。当然，这可能会有所变化，但目标是让用户故事既不过大也不过小。\n\n### Jira 及其他驱动\
  \ Scrum 的模式\n\n尽管本节将 Azure DevOps 描述为驱动 Scrum 的环境，但所有这些原则同样适用于 Jira——Eric 在 Ciao\
  \ 工作时曾广泛使用 Jira。同样值得一提的是，这些方法中的大部分也可以在基于物理看板的纸质系统中实现。前述的《Scrum 与 XP 实战》一书描述了纸质系统。我们也曾这样做过，不过，根据业务人员所在的位置，你可能需要每天拍摄物理看板的照片，或者定期转录关键信息并通过电子邮件发送出去，以便让业务方了解你的进展。\n\
  \n用户故事可以在冲刺之间延续——但如果可能的话，它们应能在少数几个冲刺内完成，理想情况下是一个冲刺。如果用户故事太大，无法在少数几个冲刺内完成，这通常是一个很好的信号，表明它们应该进一步分解。留意那些名称中包含“和”字的用户故事——这通常表明该用户故事应拆分为两个条目。\n\
  \n### 待办事项梳理\n\n管理产品待办事项的一个最佳实践是频繁地“梳理”待办事项。梳理涉及持续审视产品待办事项中优先级最高的“数十个”用户故事，确保它们被正确排序并得到良好描述。有些团队会安排每周或每两周的会议来梳理待办事项——这有助于加快冲刺规划会议的速度。\n\
  \n### 用户故事\n\n图 4-5 展示了 Azure DevOps 中的一个用户故事示例。\n\n![../images/473932_1_En_4_Chapter/473932_1_En_4_Fig5_HTML.jpg](img/473932_1_En_4_Fig5_HTML.jpg)\n\
  \n图 4-5\nAzure DevOps 中的用户故事示例\n\n用户故事可以选择性地与某个特性关联——这会将“产品待办事项”与“组合待办事项”联系起来，并帮助\
  \ PM 团队跟踪他们在组合待办事项这一领域中的进展。任何人都可以创建用户故事，但只有产品负责人可以设置优先级，也只有开发团队可以估算规模并将用户故事添加到冲刺中。\n\
  \n一个用户故事包含许多字段，包括以下内容：\n\n*   **特性反向链接**：指示此故事是为组合待办事项中的哪个特性而实现的。如果用户故事与某个特性无关，则此字段非必填——例如，Scrum\
  \ 团队可能决定自行开展一些开发工具或 DRI 工具方面的工作，如果 PM 团队对此并不关心，则无需将其关联到某个特性。\n\n*   **ID**：唯一标识符，只是一个自动递增的数字。这是为了避免在重命名故事时丢失对它们的追踪。\n\
  \n*   **名称**：故事的简短描述性名称。名称应足够具体，以便开发人员和产品负责人能够大致理解我们在讨论什么，并且足够清晰，以便与其他故事区分开来。\n\n\
  \n\n### 命名用户故事\n\n由于我们鼓励业务团队查看 Scrum 看板，因此至少要以业务人员能理解的方式编写用户故事名称和描述，避免使用专业术语，并描述我们试图实现的业务成果，这一点非常重要。因此，与其使用“生成更好的\
  \ n-gram 以更改匹配函数来提高匹配率”这样的用户故事，不如将其写成“通过更好的分词减少重复商家数量”。用户故事下的任务可以且应该使用技术性语言和专业术语，因为它们是为\
  \ Scrum 团队内部跟踪而设的——业务团队从任务中获取的唯一重要信息是：谁在处理某个用户故事、剩余工作量以及已完成的工作量。\n\n*   **描述**：在很多情况下，可以只是重复名称，或者对用户故事进行更详细的解释。同样，这需要用团队外人员也能理解的语言来编写。\n\
  \n*   **业务价值**：产品负责人对该故事的重要性评级。在 Azure DevOps 中，你可以通过垂直拖拽用户故事在待办事项列表中上下移动来指示这一点。\n\
  \n*   **故事点**：单位是故事点，对于我们的团队来说，这大致相当于“典型人天”。问问团队：“如果为这个故事安排最佳人数（既不太少也不太多，通常是两人），并且他们在一个典型的工作日里，有中断和会议，大约有\
  \ 5 小时处于编码心流状态，那么需要多少天才能完成一个可交付、可演示、经过测试、可发布的实现？”如果答案是“三个人大约需要 4 天”，那么初始估算就是 12\
  \ 个故事点。\n\n*   一旦你对一个用户故事有了初始的故事点估算，就无需再过多纠结。这是你的初始“最佳猜测”，主要用于在冲刺规划期间估算一个给定冲刺能承载多少个用户故事。一旦冲刺开始，对用户故事成本的跟踪就从故事点转移到将用户故事分解为任务，这些任务以理想的开发小时数来估算成本（我们假设在团队中，考虑到中断、会议、分心等因素，一名开发人员每天可以完成\
  \ 5 小时的工作）。\n\n### 故事点\n\n对于 Scrum 纯粹主义者来说，我们对故事点的这种“篡改”可能令人反感。故事点本应是这样运作的：团队随着时间的推移学会在一个迭代中能完成多少个故事点，这个单位是灵活的，并且团队能很好地感知一个十个故事点的工作项有多少工作量。但我们发现，在拥有多个不同\
  \ Scrum 团队的大型团队中，这在实际中很难应用——也很难向业务方解释“A 团队的故事点大小与 B 团队的故事点大小不同”。因此，我们无法在实践中将故事点作为灵活的单位，而是退而求其次，采用“一个故事点等于一个典型人天的工作量”以及“当进行任务分解时，一天可以完成\
  \ 5 小时的工作”。\n\n*   **验收标准或“如何演示 (HTD)”**：这是关于如何在冲刺演示会议上演示该故事的高级描述。这本质上是一个简单的测试规范。“执行此操作，然后执行彼操作，接着应该出现此结果。”使用\
  \ TDD（测试驱动开发），此描述可用作验收测试代码的伪代码。这通常放在“验收标准”字段中，但也可以放在描述中——只需用“HTD”标记即可。\n\n*   用户故事可以分配给某人——通常是该故事最了解的人，能够回答外部人员提出的问题。但在实践中，很多用户故事从未分配给任何人。这没问题，因为用户故事真正的“工作”是通过任务来跟踪的，而任务总是分配给具体的开发人员。因此，如果用户故事未被分配，你可以在任务板上看到迄今为止所有处理过它的开发人员，因为通常会有多个任务分配给不同的开发人员。\n\
  \n### 任务\n\n图 4-6 展示了一个与用户故事关联的任务。任务可以非常轻量，通常只包含这些元素：标题、分配给谁、剩余时间、状态（新建/进行中/完成）以及“关联哪个用户故事”。任务用于协调谁在用户故事中做什么，并将用户故事分解为完成该故事所需的逻辑任务。我们不使用“估算”字段。描述可用于捕获额外的细节——但仅当这对处理任务的开发人员有用时才这样做。大多数情况下，开发人员只是将任务用作一个简单的“待办事项”，用于他们需要编码的工作，并且他们通常从任务描述中就能理解工作内容。在这里，我们不关心业务人员是否能读懂任务——任务的客户是处理该任务的开发人员。\n\
  \n我们这样使用“剩余时间”字段：当一个任务首次分配给某个开发人员处理时（这通常在每日站会或冲刺规划会议上完成），开发人员会快速估算该任务需要多少小时的工作量——例如，开发人员可能会说：“这大概需要\
  \ 10 个小时”（即 2 个开发日）。这个初始估算应填入“剩余时间”字段，而不是“估算”字段。然后，在随后的每次每日站会上，每个有进行中任务的开发人员都会重新估算每个进行中任务还剩多少小时——例如，“这个任务看起来还有\
  \ 10 个小时，它比我想象的要大”或“这个任务只剩 3 个小时了，它比我想象的要容易”，或者“这个任务完成了”，在这种情况下，只需将任务移至“完成”列。\n\n\
  下面的示例任务说明，用户故事中的第一个任务通常是分配该领域的专家来“制定如何交付此用户故事的计划”。\n\n![../images/473932_1_En_4_Chapter/473932_1_En_4_Fig6_HTML.jpg](img/473932_1_En_4_Fig6_HTML.jpg)\n\
  \n图 4-6\n\n一个简单的任务\n\n#### 任务链接到 Git 中的拉取请求\n\n在微软，我们使用 Git 作为版本控制系统。跟踪导致任务完成的拉取请求非常有价值。当开发人员发起拉取请求时，他或她可以在该拉取请求中指定一旦该拉取请求被合并，哪些任务将被完成。这使得未来的审计人员能够将我们的待办事项列表与开发工作联系起来。\n\
  \n\n\n#### 缺陷\n\n任何用户故事都可能记录与之相关的缺陷，如图 4-7 所示。当针对某个用户故事创建缺陷时，该缺陷几乎总是优先于该用户故事中的其他任务。原则是：在推进用户故事状态之前，先修复现有缺陷。\n\
  \n![../images/473932_1_En_4_Chapter/473932_1_En_4_Fig7_HTML.jpg](img/473932_1_En_4_Fig7_HTML.jpg)\n\
  \n图 4-7\n\n用户故事可以与任务和缺陷相关联\n\n如果针对已交付的用户故事提交了 P0（优先级 0）级别的缺陷，则应立即将其纳入冲刺——它们被视为冲刺破坏者。在可能的情况下，应为已交付的用户故事添加一个缺陷，然后将其移入当前冲刺的迭代路径中——但在实践中，这种情况大多不会发生。我们将在下文描述一种似乎更有效的方法。当\
  \ Scrum 团队举行每日站会时，他们应查找这些新的高优先级缺陷，并立即将修复工作安排到冲刺中。\n\n低优先级的缺陷应在下一次冲刺计划会议中考虑，如果认为在后续冲刺中修复至关重要，则将其纳入冲刺。\n\
  \n一旦项目启动，将缺陷附加到已交付的用户故事上是很困难的。因此，我们观察到团队通常采用的方法是，在冲刺中创建“高优先级缺陷”、“中优先级缺陷”和“低优先级缺陷”这三个用户故事，如图\
  \ 4-8 所示。然后，他们将新出现的缺陷与这三个用户故事之一关联，并合理安排工作的优先级——例如，他们首先尝试完成高优先级缺陷，然后是高优先级用户故事，接着是中优先级缺陷，再是中优先级用户故事，以此类推。\n\
  \n![../images/473932_1_En_4_Chapter/473932_1_En_4_Fig8_HTML.jpg](img/473932_1_En_4_Fig8_HTML.jpg)\n\
  \n图 4-8\n\n在 Azure DevOps 任务板上跟踪缺陷与工作\n\n### 不属于故事的任务\n\n有时，团队所做的工作并不适合归入现有的用户故事。这没问题——这些工作仍然应该被跟踪（你可以创建一个包罗万象的“其他”用户故事来记录它）。通过记录团队所做的所有工作，团队可以更清楚地了解“这个冲刺的时间都花在了哪里”；在后续的冲刺计划会议中，他们可能会从“其他”工作中识别出一个主题，从而创建一个新的用户故事来跟踪它。例如，一个团队可能发现他们花了大量额外时间来修复构建。在观察到每个冲刺都花费了时间后，他们可能会决定深入探究并修复问题所在。或者，他们也可以持续安排一个占用五个故事点的“其他”项（如果“其他”项通常占用一个开发周的时间），这样他们就能更现实地评估在给定冲刺中能完成多少工作。\n\
  \n#### Scrum 任务板\n\nAzure DevOps 中的 Scrum 任务板（位于冲刺下的任务板，而非“面板”下的“面板”）是团队查看所有正在进行工作状态的地方。你可以配置任务板，按分配给开发者的任务进行筛选。在冲刺计划会议期间，产品待办事项列表顶部的用户故事会被分配故事点；基于团队已知在冲刺中能承诺完成的故事点数量，团队将产品待办事项列表中优先级最高的故事纳入新的冲刺待办事项列表。一旦故事进入冲刺，团队会通过将每个故事分解为任务来进一步细化（初始的故事点估算在后续会被忽略，但可以在之后观察，以了解团队在初始估算方面的能力提升情况）。\n\
  \n在任务板上，通过点击用户故事右侧的“+”按钮，可以轻松地向用户故事添加任务。当任务从“新建”列水平拖拽到“进行中”列时，任务开始流转。任务在移至“进行中”列时，始终会分配给一位开发者，并始终分配一个以小时为单位的“剩余时间”（其中\
  \ 5 小时 = 1 个开发日）。“新建”列中的任务可以预先分配给将要执行的开发者并预先估算成本，但这并非必需，并且受冲刺计划会议和冲刺站会可用时间的限制。\n\
  \n当任务完成时，在验证任务“完成”后，将其水平拖拽到“已关闭”列。我们不对用户故事使用“已解决”列；该列用于缺陷。Scrum 任务板如图 4-9 所示。\n\n\
  请注意，当冲刺待办事项列表中的缺陷修复完成时，使用“已解决”列代替“已关闭”列。当开发者开始处理缺陷时，将其移至“进行中”列。当缺陷被修复、测试、签入并部署到生产环境后，将其移至“已解决”列。最初提交该缺陷的人应验证其是否已修复，然后将其移至“已关闭”列。\n\
  \n![../images/473932_1_En_4_Chapter/473932_1_En_4_Fig9_HTML.jpg](img/473932_1_En_4_Fig9_HTML.jpg)\n\
  \n图 4-9\n\nScrum 任务板\n\n我们使用 Azure DevOps 的任务板作为每个团队的单一状态页面。此页面包含一个燃尽图（位于右上角），当团队定期移动和更新任务时，该图会自动保持更新：在任务首次移至“进行中”列时更新其剩余时间，此后每天更新进行中任务的剩余时间，直到任务完成并移至“已关闭”列。\n\
  \n所有这些操作都限定在站会时间内（这是一个敏捷术语，意思是在固定时间段内完成）——无需在站会之外进行任务更新。Scrum Master 是团队的服务者，帮助团队保持任务板更新，以免影响站会之外的工作。在每日冲刺会议期间，Scrum\
  \ Master 会投影 Scrum 仪表板；每位参与者可以报告其进行中工作项的剩余时间，Scrum Master 在投影时更新所有进行中任务（更新右下角的剩余时间，通过垂直拖拽分配新任务，通过水平拖拽标记任务完成）。\n\
  \n### 冲刺\n\n对于我们的团队，我们通常进行为期两周的冲刺。对于任何采用 Scrum 的团队来说，冲刺长度都是一个有争议的话题，我们发现我们经常在两周和三周冲刺之间争论。采用两周冲刺可以确保计划过程不会变得过于繁重，并且冲刺不会在没有新一轮计划的情况下偏离轨道太远。\n\
  \n#### 两周节奏\n\n在我们的团队中，我们按照图 4-10 中的日历安排 Scrum 会议。这个具体示例是针对一个五到七人的团队——我们喜欢确保其他兄弟团队的每日站会时间不重叠，这样在任何特定的一天，业务方的相关人员都有可能参加所有团队的站会，以快速了解开发工作的进展。\n\
  \n![../images/473932_1_En_4_Chapter/473932_1_En_4_Fig10_HTML.png](img/473932_1_En_4_Fig10_HTML.png)\n\
  \n图 4-10\n\nScrum 日历\n\n\n\n#### 每日站会\n\n每日站会将根据此时间表进行安排，确保两个站会不会同时进行。站会时间限制在 15\
  \ 分钟以内。\n\n每日站会在配备投影仪、电视或 Surface Hub 的会议室中进行，由 Scrum Master 投影显示 Azure DevOps 任务板。会议中，任务板会依次按每位开发者的筛选条件进行展示。会议室中的每位开发者可以参照自己的活跃任务，回答\
  \ Scrum 的三个问题：“我昨天做了什么？”“我今天要做什么？”以及“我遇到了什么阻碍？”随后，开发者会针对每个任务说明“该任务已完成”，此时 Scrum\
  \ Master 会立即将该任务拖拽至“已关闭”列；或者，开发者会估算活跃任务的剩余工时（如果自上次站会后有变化），Scrum Master 会立即更新任务的“剩余时间”（显示在任务右下角）。\n\
  \n如果某位开发者已完成所有活跃任务，则会将之前分配给该开发者但尚未开始的任务从“新建”列拖拽至“活跃”列，并由开发者估算剩余工时。Scrum Master 将剩余工时填入任务右下角。\n\
  \n或者，如果某位开发者没有未开始（即“新建”）的任务分配，则可以从“新建”行或其他需要帮助的开发者处领取任务。每当任务被移入“活跃”列时，必须填写初始剩余工时。\n\
  \n### 站会之外更新任务板\n\n实际上，我们要求开发者在每日站会之外不要更新任务板，因为任务板的更新（此任务已完成、此任务剩余工时减少、我接手了这个新任务）是向团队其他成员传达基本信息的关键。如果这种沟通发生在站会之外，那么每位开发者的进度信息就会在团队中丢失。\n\
  \n站会还应用于对团队遇到的阻碍问题进行分类处理。站会不应在这些问题上花费过多时间，除非问题能迅速解决——请记住 15 分钟的时间限制。如果某个问题需要更多讨论，Scrum\
  \ Master 会在当天晚些时候安排另一个会议，与相关方进行讨论。\n\n#### 迭代结束会议\n\n我们喜欢让所有兄弟团队在同一天开始和结束他们的冲刺，并将我们各个五到七人兄弟团队的一些会议合并，举办更大规模的演示会议。因此，对于一个典型的由大约\
  \ 50 名开发者组成的、共同参与同一项目的团队（例如，必应的本地数据团队），我们会有大约六个 Scrum 团队共同参与一个合并的全员冲刺演示。\n\n#####\
  \ 全员冲刺演示\n\n在冲刺的最后一个星期五，全员冲刺演示会作为一个合并的 1.5 小时会议举行。我们进行面对面会议，但同时也会录制会议，使其成为 Scrum\
  \ 的另一个产物。全员冲刺演示的格式如下。\n\n每个团队的时间限制根据其开发者人数确定——每位开发者分配 2 分钟。因此，如果一个团队有 7 名开发者，他们就有\
  \ 14 分钟进行演示；另一个有 5 名开发者的团队则有 10 分钟，以此类推。演示时间由 Eric 那令人畏惧的倒计时时钟严格限制，如图 4-11 所示。当时钟响起时，正在发言的人必须完成当前句子，然后将会议交给下一个团队。我们发现，使用计时器对于确保演示会议不拖延是必要的——计时器能确保每个人都准时、快速地展示自己的工作。\n\
  \n然而，如果在演示过程中有人提问、发表疑问或评论，我们会将时间返还给倒计时，因为我们不想打击好的评论、问题或建议。Scrum Master 有权在倒计时中返还时间，并建议将失控的讨论转为线下进行。\n\
  \n![../images/473932_1_En_4_Chapter/473932_1_En_4_Fig11_HTML.jpg](img/473932_1_En_4_Fig11_HTML.jpg)\n\
  \n图 4-11\n\n倒计时时钟——用于限定冲刺演示会议的时间\n\n关于如何实现这一点的后勤说明——我们已将此流程应用于多达 50 名开发者的团队（会议持续约\
  \ 1.5 小时，有六个不同的团队进行演示）。为确保会议顺利进行，我们采取了以下措施。\n\n一个全员冲刺演示文稿会在会议前准备好，由所有 Scrum 团队共享。每个\
  \ Scrum 团队都有一张“封面幻灯片”，展示其冲刺目标、是否达成目标、团队的关键指标，以及他们在冲刺期间对这些指标所做的改进。团队可以在其封面幻灯片之后添加自己的幻灯片，用于展示他们将要演示的具体工作。\n\
  \n### 冲刺目标\n\n我们对冲刺目标是什么以及是否达成目标保持高度透明。正如你将在本章后面看到的，冲刺目标及其达成情况会向业务团队和其他利益相关者通报。一次又一次地传达你未能达成冲刺目标，可能向其他团队发出一个信号：他们不能相信你会完成你声称要完成的工作——因此，你需要不断强调，团队不应将冲刺目标视为过于理想化，而应是可实现的。Eric\
  \ 已开始将冲刺目标称为“冲刺承诺”，以进一步向其团队强调，这些目标需要经过深思熟虑和成本核算，以确保能够达成。\n\n在可能的情况下，演示会预先录制好，并可直接从幻灯片中链接。然而，我们鼓励团队不要在准备演示会议上花费大量时间，因此临时演示也很常见。\n\
  \n我们使用 Skype 或 Microsoft Teams 等会议软件来投影演示文稿；进行临时演示、视频演示或基于幻灯片的演示的用户可以连接到正在进行的会议，并在演示时共享自己的屏幕。\n\
  \n##### 冲刺回顾\n\n冲刺回顾会议通常安排在冲刺的最后一个星期五，并且不是合并会议——它仅针对每个较小的五到七人团队单独进行。该会议也作为冲刺的最终“站会”，在此会议中，任务被关闭，尚未完成的用户故事被移至下一个冲刺，并对产品待办列表进行审查和重新排序优先级。\n\
  \n我们尝试在会议回顾环节中，至少将一个直接源于改进建议的用户故事添加到新冲刺中。\n\n我们还喜欢通过电子邮件向所有其他团队汇总一份关于各自回顾会议的简报，以便团队其他成员至少能了解到其他团队对其冲刺的感受。\n\
  \n#### 冲刺计划会议\n\n根据此时间表，冲刺计划会议安排在冲刺的第一个星期一。此会议在可能的情况下会错开时间，以便外部的“旁观者”可以观察——但请记住\
  \ Scrum 的[猪和鸡原则](https://www.implementingscrum.com/2006/09/11/the-classic-story-of-the-pig-and-chicken/)。\n\
  \n\n\n### Scrum 中的鸡和猪\n\n鸡和猪的故事讲的是，一只鸡和一头猪想合伙开一家火腿蛋早餐店。猪拒绝了，因为它会**全身投入**这家店，而鸡只是**参与其中**。\n\
  \n我们不会把冲刺演示会议当作提出产品待办列表建议的场合，而是使用冲刺计划会议，尽管在冲刺演示会议期间也可能产生一些关于待办列表的讨论。\n\n冲刺计划会议通常在配有投影仪的会议室举行，时间限制为\
  \ 1.5 小时。所有开发团队成员都必须出席。也欢迎非开发团队成员旁听，但他们的参与应受到限制。如果座位不够，猪坐在桌旁，鸡则靠墙坐。\n\n理想情况下，产品待办列表在本次会议之前已经过梳理——如果产品待办列表已经排好优先级、定义明确并准备就绪，那么这次会议就能进行得更快。\n\
  \n在冲刺计划会议中，首先要结束上一个冲刺，并将任何未完成的用户故事从旧冲刺移至新创建的冲刺中。\n\n如果产品待办列表尚未梳理，团队会花一些时间查看产品待办列表，确保所有想到的高优先级用户故事都已列入待办列表并正确排好优先级。这时，“鸡”可以插话，提出团队可能没想到但需要完成的用户故事。产品负责人在此讨论中影响力很大，能帮助团队理解下一步需要完成什么。\n\
  \n在会议期间的某个时刻，团队还应花些时间尝试确定本次冲刺的一个或多个冲刺目标。关于冲刺目标为何重要，请参阅本文档中的“冲刺目标”一节。\n\n然后，团队会填写\
  \ Azure DevOps 中“冲刺”板块的“容量”选项卡。此时，团队需要确定休假情况、Scrum 团队中的每个人是否全职投入本次冲刺，或者是否有人部分时间投入本次冲刺、部分时间投入另一个\
  \ Scrum 团队（这种情况虽不理想，但有时会发生）。团队成员还可以记录他们在本次冲刺中的休假时间。图 4-12 展示了一个填写完毕的容量页面。任何开发人员的每日最大容量始终上限为\
  \ 5。查看本次冲刺的“容量”选项卡，你可以一目了然地看到：\n\n*   Azar 将在冲刺期间休假一周。\n*   Michael 和 Michael 不参与本次冲刺——他们的容量设置为\
  \ 0（也许他们出现在列表中是因为他们参与过之前的冲刺）。\n*   Nick 在冲刺期间只能以大约一半的时间参与（在本例中，因为他是一名主管）。\n*   团队有\
  \ 1 天休息日——也许是某个提升士气的活动！\n\n    ![../images/473932_1_En_4_Chapter/473932_1_En_4_Fig12_HTML.jpg](img/473932_1_En_4_Fig12_HTML.jpg)\n\
  \n    图 4-12\n\n    Azure DevOps 容量选项卡\n\n一旦容量确定，团队就能立即知道他们在本次冲刺中可以承担多少故事点（总容量（小时）除以\
  \ 5）。然后，团队会查看最顶部的用户故事，并估算其故事点大小（一个故事点等于 1 个开发日或 5 小时）。\n\n### 计划扑克\n\n一种估算用户故事大小的有用技术叫做计划扑克。计划扑克的主要思想是让多个团队成员同时估算一个用户故事的成本，然后找出团队中估算偏高和偏低的人，并确定导致高低估算的假设是什么。通常，估算偏高的人会想到团队其他成员没想到但需要考虑的事情。同样，估算偏低的人可能有一个比其他人认为必须做的更简洁、更简单的工作思路。有关计划扑克的更多信息，请参阅这篇博客文章：[`www.mountaingoatsoftware.com/agile/planning-poker`](http://www.mountaingoatsoftware.com/agile/planning-poker)。\n\
  \n一旦确定了团队的容量，并从新冲刺的容量中扣除了上一个冲刺中未完成的现有故事，就会按照产品待办列表中列出的优先级顺序，添加额外的故事来填满冲刺的容量。团队不需要估算产品待办列表中每个用户故事的故事点，只需估算那些将放入冲刺待办列表的故事，可能再加上几个作为缓冲，以防某些故事提前完成，需要在冲刺后期从产品待办列表向冲刺待办列表添加新故事。冲刺待办列表中的所有用户故事都必须有一个初始的故事点估算。\n\
  \n当冲刺待办列表填满了足以覆盖团队容量的故事点后，如果还有剩余时间，团队就会着手将每个用户故事分解成更细粒度的任务。他们通过向用户故事添加 Azure DevOps\
  \ 子任务来实现这一点。有些用户故事可能已经足够小，以至于只是一个单一任务——这没问题，只需为该用户故事创建一个与用户故事同名的子任务即可。当冲刺计划会议的时间盒结束时，任何尚未分解的剩余用户故事可以分配给各个团队成员，让他们在之后自己的时间里分解成任务。\n\
  \n### 通过电子邮件向业务方沟通 Scrum 状态\n\n我们会向业务方发送两封定期邮件：一封是在周五冲刺结束后的全员冲刺演示会议之后，总结上一个冲刺完成的工作；另一封是在周一为新冲刺举行的冲刺计划会议之后，总结新冲刺中将要做的工作。\n\
  \n\n\n#### 冲刺结束邮件\n\n冲刺结束的演示会议邮件包含以下内容：\n\n*   全体冲刺演示会议的视频链接\n*   全体冲刺演示会议中使用的幻灯片链接\n\
  *   会议的简要“速查笔记”版本，以书面形式说明哪些目标已完成、哪些未完成，以及会议中演示的内容，并附有演示发生时的视频时间标记。\n\n冲刺结束的演示会议邮件示例如下：\n\
  \n| 大家好——这是本地数据团队第 8 个冲刺的总结，该冲刺于 10 月 25 日结束。我们的演示会议视频在此，幻灯片在此。以下是我们的各个团队在本冲刺中完成的工作：**管道团队**完成的冲刺目标    •    本地探针\
  \ V.Next 已部署，支持在最近 5 次完整运行之间切换以及搜索标识符    •    发布管道优化（合并作业并迁移至通用数据访问层）将运行时间减少了 1.5\
  \ 小时    •    市场现在可以使用其特定市场的逻辑来配置非结构化地址的地理编码。韩语团队利用此功能修复了 88%的错误地理编码韩国地址。未完成    •    刷新邻域缓存，为\
  \ 210 万以上实体补充邻域信息（针对美式英语） |\n| **演示：****本地探针 v.Next 演示 (5:15)**本地探针 v.4 已部署至自动驾驶模式。旧的本地探针现已废弃。您现在可以在最近\
  \ 5 次完整运行之间切换。您还可以通过标识符进行搜索。例如，“1x1”可让您在标识符列表中搜索哨兵实体。**发布管道优化演示 (8:30)**我们将另外两个作业集成到了发布作业中。我们将\
  \ LesGeoOntoloty 和邻域作业合并到了 PublishIndex 作业中。我们还迁移了 PublishIndex 作业中的内容生成，以使用通用数据访问层。这项工作使发布管道的运行时间减少了约\
  \ 1.5 小时。新的发布管道运行时间约为 5 小时。**合并团队**完成的冲刺目标    •    权威数据源设计方案    •    修正仪表板已发布，支持多种修正视图，包括正在修正的数据源、正在修正的属性，以及验证实体修正是否已应用的方法未完成    •    标识符变更仪表板**演示：****TCL\
  \ 模型二进制文件自动化 (11:15)**我们现在可以在构建过程中自动准备 TCL 二进制文件。**权威数据源设计方案 (14:29)**我们提出了一项名为“权威数据源”的新功能方案。动机：考虑一个查询，例如“贝尔维尤的星巴克”。由于陈旧/错误的数据，我们显示的星巴克数量远多于实际数量。然而，我们可以抓取星巴克网站，准确了解当前星巴克门店的集合。我们需要的是一个功能，能够从星巴克网站拉取权威数据源并发布这些数据，同时删除所有其他与权威数据源不匹配的星巴克门店。\
  \ |\n\n#### 冲刺开始邮件\n\n冲刺开始邮件包含以下内容：\n\n*   每个团队的任务板链接\n*   每个团队的成员名单及其在冲刺中的产能（通过团队在\
  \ Azure DevOps 中该冲刺的产能页面链接）\n*   面向业务的“通俗语言”产能说明——告知团队在下个冲刺中可用的开发人天数\n*   新冲刺的高层级目标\n\
  \n冲刺开始邮件示例如下：\n\n| 大家好。平台团队已完成 1812.1 冲刺（12 月 3 日至 12 月 14 日）的规划会议。以下是规划结果、各团队的冲刺任务板链接和冲刺目标。**管道团队**冲刺任务板链接在此\
  \ Scrum 主管：Taylor 团队成员：Abram, Joan, Dave, Emma, Patrick, Shahar, Stan（65 个开发人日产能）**冲刺目标：**让墨西哥市场上线并运行刷新邻域缓存减少缓存文件的总体大小**合并团队**冲刺任务板链接在此\
  \ Scrum 主管：Matt 团队成员：Ade, Max, Linus, Amy, Leah, Mike（45 个开发人日产能）**冲刺目标：**发布标识符变更仪表板发布墨西哥合并模型将强制匹配移至管道后期运行\
  \ |\n\n#### 回顾邮件\n\n我们偶尔会向业务方发送的另一封邮件是回顾报告。在我们的回顾中，我们会逐字收集“好”、“差”和“一般”的评论，以及回顾后确定要安排的具体用户故事。以下是一个冲刺后仅针对本地数据团队之一的回顾报告示例：\n\
  \n| 大家好，管道团队刚刚完成了本冲刺的回顾，以下是结果：**管道团队回顾****好****假期****对代码生成感到兴奋****收集了更多团队目标/指标****删除了拉取请求****与合并团队的良好沟通促成了两个功能添加到平台****代码审查提供了有用的反馈，并且处理迅速****感觉富有成效****无效批处理设计取得重大进展****收尾管道事件工作，期待转向工具开发****管道解引用有了新客户****富有成效的会议****一般****遗留的构建/基础设施问题****来自之前团队的大量长尾工作尚未完成****差****常见工作流错误无人报告，因为没人直接抱怨****我们仍需改进构建“团队”工作流/职责委派****忘记了使用测试驱动开发，导致浪费时间****没有好的流程来处理大型拉取请求，且不断出现合并冲突****构建经常失败，有时完全莫名其妙****“挂起错误”**\
  \ |\n| **后续行动**让我们的性能测试在 CI 服务器上运行更好/更频繁地进行错误分类（至少每周一次）找出如何防止断言挂起 CI 服务器发布一个维基页面，列出哪些配置是受支持的/可行的制定减少短期内存使用的计划\
  \ |\n\n## 结论\n\n在第 4 章“与业务对齐”中，我们讨论了与业务团队沟通的重要性。我们阐述了让团队尽可能直接地与业务指标和业务目标对齐是多么重要。我们分享了一些关于如何与业务方合作，帮助他们理解机器学习局限性的想法。我们还描述了我们是怎样开展\
  \ Scrum 的，以及如何通过 Scrum 会议、Scrum 工件和围绕 Scrum 节奏发送的邮件来让业务团队参与并与之沟通。\n\n在第 5 章“激励个体”中，我们将探讨围绕激励个体构建项目的重要性，以及如何增加团队中激励个体的数量。\n\
  \n\n\n"
- "# 5. 积极主动的个体\n\n> *围绕* ***积极主动的个体*** *构建项目。给予他们所需的* ***环境*** *和* ***支持***，并* ***信任***\
  \ *他们能够完成任务。* `—agilemanifesto.org/principles`\n\n在必应本地搜索产品的早期，我们有一个相当原始的合并/融合引擎，维护成本高昂且效果平庸。几位日复一日与该融合引擎打交道的同事认为，存在更好的融合方法。现有的融合系统已成为一个“bug\
  \ 农场”，需要大量工作才能维持其运行。新提出的方法看起来很有前景，但挑战在于如何在继续“维持旧系统运转”的同时，找到时间构建新系统。\n\n幸运的是，整个数据管道采用了组件化和模块化的方式设计，融合引擎具有明确的输入边界（融合引擎读取的一组\
  \ XML 文件）和清晰的输出边界（融合引擎写入的另一组 XML 文件）。这使得替换融合引擎成为可能，而不会干扰系统的其余部分。\n\n两位积极主动的个体被授权放下当前系统中的所有工作，自行开发一个新的融合引擎。他们被“隔离保护”——这是一个源自金融领域的术语，在微软用于指代确保被隔离的团队与主团队分离，这样他们在开发时间内无需为支持当前活跃的生产项目而“缴税”。管理层被告知，在新融合引擎开发的\
  \ 6 个月内，预期进度会放缓。尽管最初的预估比实际所需的 6 个月开发时间更为乐观，但对新项目进度的定期审查表明，一切都在按计划进行。管理层提供了必要的“空中掩护”，为新融合引擎的完成争取了所需的时间。当这两位积极主动的个体接近终点线时，更多团队成员被加入，以协助围绕新融合引擎进行额外的集成工作，使其能够投入生产使用。\n\
  \n旧融合引擎和新融合引擎并行了数周，这暴露了新代码中的错误和问题，并得到了迅速修复。随着新融合引擎输出质量开始超越旧引擎，向新融合引擎的切换顺利完成，本地数据系统中的融合质量得到了显著提升。\n\
  \n但该项目成功的关键因素在于这两位积极主动的个体。他们投入了大量的精力和努力来确保项目成功。他们感到被授权去修复系统中存在的重大问题。这激发了他们的工作热情和动力，并最终带来了成功的项目成果。\n\
  \n## 频繁重写\n\n在必应，我们致力于设计允许频繁重写的系统。这是敏捷团队的一项关键能力——完全有可能抛弃现有的融合系统并编写一个新的，因为它与数据管道的其他部分松散耦合。此外，重写一个新系统并与旧系统并行运行（即所谓的\
  \ A/B 测试）也很容易，以确保新系统能够像旧系统一样成功运行，并达到相同或更高的质量水平。\n\nFergus Henderson 在其论文《谷歌的软件工程》中指出，出于类似原因，谷歌试图每隔几年重写其大部分软件：\n\
  \n*这看起来可能成本高得惊人。确实，它消耗了谷歌很大一部分资源。然而，它也具有一些关键优势，这些优势是谷歌敏捷性和长期成功的关键。在几年的时间里，产品的需求通常会显著变化，因为其周围的软件环境和其他技术会发生变化，同时技术或市场的改变也会影响用户的需求、愿望和期望。几年前编写的软件是基于一套较旧的需求设计的，通常无法以最优方式满足当前需求。此外，它通常已经积累了大量的复杂性。重写代码可以削减所有不必要的、针对已不再重要需求的复杂性积累。此外，重写代码是将知识和对代码的“主人翁感”传递给新团队成员的一种方式。这种主人翁感对生产力至关重要：工程师自然会在他们认为“属于自己”的代码上投入更多精力来开发功能和修复问题。频繁重写还能鼓励工程师在不同项目之间流动，这有助于促进思想的交叉融合。频繁重写也有助于确保代码使用现代技术和方法编写。（*\
  \ [`https://arxiv.org/ftp/arxiv/papers/1702/1702.01715.pdf`](https://arxiv.org/ftp/arxiv/papers/1702/1702.01715.pdf)\
  \ *）。*\n\n频繁重写能够激励个体，并向他们表明你信任他们。个体在维护那些他们不理解、不是自己编写、也感觉毫无关联的旧代码时，是不会受到激励的。力求频繁重写，以便在你的组织中培养出更多积极主动的个体。\n\
  \n\n\n## 寻找并培养积极主动的成员\n\n组织不仅要寻找，更要培养积极主动的成员。首要的人才来源应是组织内部。我们常看到一些组织似乎在系统性地打击员工的积极性。那么，如何确保在现有组织内持续培养出积极主动的成员呢？\n\
  \n培养积极主动成员最关键的一点，或许是设定令人信服的目标、衡量标准和指标——清晰传达团队需要达成的愿景，并提供一套衡量进展的指标——但将\"如何实现\"的决策权交给团队，更重要的是，要传达出你相信团队能自行找到解决方案。这正对应了宣言中\"\
  信任他们能完成任务\"的部分。\n\n举个例子，我们曾与一个兄弟团队共事过一段时间。在那个团队中，有一两个人几乎包揽了所有决策权，其他成员只需遵循少数人制定的计划。相比之下，我们的团队鼓励更多人参与讨论，分享最佳想法和策略。我们将\"\
  如何做\"交给多数人，并信任团队。而另一个团队将\"如何做\"交给少数人，这并未向其他成员传递信任。由于那个专制团队的领导者非常出色，我们不能说他们不成功——他们确实实施了许多好想法和策略。但我们相信，我们团队的成员感受到更多信任和授权，自然也更有积极性。\n\
  \n对于团队的管理者或领导者而言，一个很好的思考方式是我们称之为\"彼得·杰克逊项目管理法\"的方法。在拍摄《指环王》系列电影时，彼得·杰克逊对影片的最终效果有清晰的愿景。为了向团队传达这一愿景，他与分镜师合作，制作了覆盖整部电影的分镜图。他说：\n\
  \n> *[分镜图]是电影的低成本预演。我可以用极低的成本——几支铅笔和几张纸——来制作电影，但这实际上让我经历了整个电影制作过程。作为导演，我尝试了，完成了第一版，并能看到完整的电影效果。*\n\
  \n他的制片人巴里·奥斯本补充道：\n\n> *[分镜图]是一个很棒的工具。它从未被当作电影的最终版本。我曾与一些导演合作，他们会绘制分镜图，而你真的会在屏幕上看到那些分镜。彼得不是那种导演。他用分镜图来激发灵感，与各部门沟通，但你知道那些分镜图会改变，对彼得来说，它们是起点，而非终点。*\n\
  \n彼得·杰克逊制作的分镜图帮助团队清晰理解\"要创造什么\"。但这个\"什么\"是以低成本方式——简单的铅笔画——呈现的。这个\"什么\"也被用来让所有人达成共识，但分镜图本质上是低成本、易修改的简单铅笔画，如果行不通或想到更好的主意，可以轻松丢弃。分镜图所代表的轻量级愿景鼓励了团队成员的创造力，计划可以修改，也确实被修改了。但拥有初始计划至关重要。\n\
  \n要将彼得·杰克逊的项目管理方法应用于数据工程项目，就要找到创建\"分镜图级别\"愿景文档的方法，这些文档易于丢弃、修改，主要用于向团队传达愿景。这些文档通常可以围绕未来的客户体验来构建。例如，你可以描绘客户一年后使用你产品的体验。当团队清晰了解产品一年后的愿景时，他们就能围绕\"\
  如何实现\"产品愿景而团结起来。通过不向团队强加\"如何做\"，积极主动的成员自然会涌现，他们不仅能提出创新的\"如何做\"，还会在发现愿景轻量且开放创新时，感到有权改变\"\
  什么\"。只需注意将分镜图视为\"起点而非终点\"。\n\n### 别忘了衡量标准\n\n始终将\"分镜图级别\"的愿景文档与衡量产品目标的指标相结合。如果本书有一条最重要的信息，那便是\"\
  关键在于指标，笨蛋！\"指标还能抵消团队在规划文档和愿景中过度关注\"如何做\"的倾向。例如，亚马逊用无人机送货到家的项目，可能有一个指标是\"最小化从下单到送达的时间\"\
  ，另一个指标是\"最小化每单配送成本\"。如果团队中有人提出替代\"如何做\"的方案，能在这些指标上超越无人机配送——比如家庭 3D 打印？瞬间传送？——那么指标将胜过无人机配送的愿景，新的\"\
  如何做\"就可以被采纳。\n\n### 面试与招聘\n\n在向团队传达愿景和指标的同时，将\"如何做\"和部分\"什么\"的决策权交给团队，这将在很大程度上帮助你在组织内培养积极主动的成员。但现实是，你无法让积极主动的成员在整个职业生涯中都留在同一个团队。人们需要成长和学习，这意味着他们通常会在某个团队和特定技术栈上工作一段时间，然后转向其他团队。这是健康的，应尽可能鼓励。为了在人员流动时保持团队的新鲜血液，团队需要从外部招聘新的积极主动成员。招聘新成员分为三个阶段——首先吸引，然后筛选，最后面试。\n\
  \n\n\n#### 吸引有自驱力的人才\n\n为了吸引有自驱力的人才，你需要能够以恰当的方式向团队以外的人讲述你的故事，从而吸引那些愿意为你的项目投入工作的人。通常，你会通过职位描述来传达你的故事。在撰写职位描述时，非常重要的一点是，不仅要传达团队试图实现的愿景，还要极其诚实地说明你对加入团队的个人有何期望。最糟糕的情况莫过于，你撰写了一份旨在吸引候选人，但实际工作内容却与描述不符的职位描述。有时，数据工程团队会倾向于“过度强调”岗位中的机器学习部分，而“弱化”工程部分。更糟糕的是，我们偶尔会看到有人将机器学习机会作为诱饵，吸引候选人应聘那些实际上\
  \ 95%都是传统工程工作的岗位。一个基于虚假职位描述而被吸引来的候选人，绝不会是一个有自驱力的人。\n\n同样重要的是，要仔细斟酌职位描述中使用的语言，确保其具有包容性，并能吸引最广泛的候选人群体。在撰写职位描述时，有很多潜在的陷阱可能会吓跑候选人。以下是一些建议：\n\
  \n*   避免列出冗长的、期望候选人掌握的技术清单。一个优秀的候选人，如果熟悉某个特定的机器学习工具包，就能很快掌握另一个。相反，应侧重于你确信在问题领域会用到的更广泛的机器学习技术——使用诸如\
  \ NLP 或 RNN 这类更宽泛的术语，而不是 TensorFlow 或 PyTorch。\n\n*   简要说明你正在使用的敏捷流程和方法。候选人喜欢听到这样的细节：“你将与一个由其他五名工程师组成的团队一起工作，遵循敏捷原则，以两周为规划周期推进问题解决。我们相信每个人都应参与塑造我们的方向并规划我们的工作。”\n\
  \n在职位描述中也很容易引入性别偏见。美国国家妇女与信息技术中心（ncwit.org）提供了七条有用的建议，用于撰写能吸引最广泛候选人的职位描述：\n\n1.\
  \  避免使用最高级或极端修饰词，例如“摇滚明星”或“世界级”之类的短语。可以尝试使用“真正创新”或“致力于创造性解决问题”。\n\n2.  避免使用特定性别的代词（他或她）。\n\
  \n3.  确保所有“必需”的资格条件确实是必需的，并尽可能多地建立灵活性。\n\n4.  在职位描述的开头，包含一个简短但引人入胜的工作概述。\n\n5. \
  \ 避免使用冗长的职责或资格条件列表。\n\n6.  确保所有图片和图形都包含多样化的人群。\n\n7.  检查职位描述中是否存在与“男性化/女性化”相关语言的微妙偏见。\n\
  \n更多示例，请参见 [`www.ncwit.org/jobdescriptionchecklist`](http://www.ncwit.org/jobdescriptionchecklist)\
  \ 。\n\n#### 筛选\n\n现在，人们开始申请你的职位，你将收到简历和申请。在这个阶段，同样重要的是，不要让你的偏见妨碍你筛选出优秀的候选人。我们很容易在浏览一堆简历时，偏向于那些与你有相似背景的候选人。与其立刻关注候选人就读的学校或上一家工作的公司，不如看看他们参与过的项目，并思考这些项目如何能为你要招聘的职位做好准备，甚至带来新的视角。\n\
  \n在这个阶段，开始与候选人进行面对面交谈也很重要——我们通常喜欢通过 Skype 进行 50 分钟的面试，在面试中，我们可以要求候选人解决某种技术问题，这有助于我们了解候选人如何思考并解决难题。这个问题越接近你正在处理的实际问题越好。尝试在这次电话面试中让候选人编写实际代码。不要对候选人使用的编程语言抱有执念。候选人应该能够使用他们最熟悉的语言编写代码，而作为面试官，这也是一个机会，让你可以重温一下其他你不太喜欢的编程语言的技能。总的来说，我们不赞成将伪代码作为面试的“唯一语言”——伪代码可以作为候选人开始解释他们将使用的算法的好起点，但我们认为，看到候选人能否用他们最喜欢的编程语言清晰地表达自己的想法也很重要。\n\
  \n### 面试中的结对编程\n\n我们在电话面试中使用过的一个成功技巧是结对编程方法。作为面试官，你可以在一个共享的编码窗口中编写一个单元测试（关于如何提供共享窗口的一些想法见下文）。然后，面试者可以“接管键盘”，编写代码使单元测试通过。接着，面试者可以编写下一个所需的单元测试，以解决问题的下一阶段。然后，你可以编写代码使面试者的单元测试通过——如此循环。Skype\
  \ 提供了一个很好的共享编码窗口，可以通过浏览器在此处共享：[`www.skype.com/en/interviews/`](http://www.skype.com/en/interviews/)\
  \ 。我们也曾打开一个 Visual Studio Code 实例，并在面试中使用屏幕共享来共享 IDE。Visual Studio 还有一个名为“Live Share”的功能，可以轻松实现这一点。\n\
  \n\n\n#### 面试\n\n理想情况下，你还有最后一次机会，让其他团队成员对候选人进行补充面试。最理想的情况是，在最多一天的时间内，多位员工现场面试候选人，以判断他们是否能成为团队中的得力成员。判断一位候选人会成为团队中积极进取、充满干劲的成员，还是会成为消极怠工、缺乏动力的成员，是一项极具挑战性的任务。如果你回顾一下与现有团队共事的经历，你会发现，有些你最初认为水平不达标的人，最终却成为了坚实的贡献者。反之，你也可能遇到过在面试中表现惊艳，但实际工作中却“毒性”十足的人。那么，如何在一天之内完美地判断你的候选人处于这个光谱的哪个位置呢？事实是，你做不到，所以你需要对整个流程抱持一种更超然的心态。^(¹¹)\n\
  \n首先，将面试过程视为一个分类器。你需要在面试中设定高精度的阈值。这可能意味着你会拒绝一些本可以很优秀的候选人——但别太在意。但要非常小心，确保你的分类器用于评估匹配度的“特征”被无情地修剪掉那些反映你自身偏见的特征。拒绝任何基于相似度得分的特征——例如，这个人长得像我、想法像我、和我上同一所学校，或者和我喜欢同样的东西。\n\
  \n其次，请记住，除了非常小的团队，招聘是一个流动的、持续的过程。如果在所有阶段，团队的目标和期望都清晰明确，你就可以随着时间的推移优化团队。换句话说，你是在经营一项业务，所以你可以鼓励那些“误报”（即被错误拒绝的候选人）去其他岗位寻找机会。\n\
  \n言归正传，让我们探讨一下在面试中应该关注什么。我们通常从*能力*（已经具备的技能）和*潜力*（候选人可以发展的、团队所需的技能）这两个方面来考量。前者可以通过直接提问来确定，而后者则需要面试官具备更多的迂回技巧。能力和潜力涵盖了候选人当前和未来的技能；它们也体现了对团队整体工具箱的补充，以及候选人是否会放大、补充团队能力，或两者兼而有之。\n\
  \n我们收到过最好的职业建议是追随你的热情——工作自然会水到渠成。充满热情的人往往会自我选择与团队匹配，因为如果他们的工作与热情不符，他们会寻找其他机会。考虑到这一点，我们发现在面试过程的早期阶段，了解候选人的热情所在非常有用。虽然这看起来是一件很简单的事情——只需问“你对什么充满热情？”——但我们发现，即使不是大多数，也有很多候选人认为自己实际上对任何事情都没有热情。别信他们。虽然许多人不会给出一个高度明确的热情定义（比如“我想构建终极人工智能”），但很多人都有隐藏的热情，这些热情会体现在非应用领域。例如，我们面试并共事过的人中，有对工程实践充满热情的，有对服务架构充满热情的，有对团队和协作充满热情的，有对应用于其领域的特定新兴科学充满热情的，或者是对公司本身充满热情的。作为管理者，你的工作是发现热情并利用它为你的团队服务。作为招聘经理，你的工作是评估为你正在面试的候选人找到热情是容易还是困难。在试图引导理解其热情领域时，你必须表现得像一位优秀的电台主持人，从一位不情愿的明星那里引出故事。假设热情是存在的，而找到它所需要付出的努力，就是衡量将来利用这种热情难易程度的标尺。\n\
  \n在测试机器学习或数据科学能力时，我们通常喜欢采用一种递进式提问模型，将直接测试和要求从经验中举例结合起来。例如，根据我们“指标是开发核心”的观点，我们喜欢就一个简单问题的评估提问。例如：“你会如何评估一个用于判断网页是否为商业主页的分类器？”这让你和候选人可以触及以下几点：\n\
  \n*   分类的基础知识，包括真正例、真负例、假正例、假负例、精确率、召回率、准确率等\n*   一些基础统计学知识，特别是抽样\n*   处理海量数据集（如万维网）的实用方法\n\
  \n由此，你可以将提问线索扩展到架构细节，特别是与规模相关的方面，如果候选人具备现有能力，还可以深入到机器学习的具体细节。在考察能力时，你要看他们是否是一个真正的实践者，而不是仅仅下载了最新的开源模型并根据博客上的配方运行它的人。在考察潜力时，你要看候选人是否能识别常见的陷阱——他们是否认识到关于数据所做的假设？\n\
  \n在面试更高级别的职位时，我们倾向于寻找那些能在敏捷开发框架内发挥作用的特质。同样，在测试能力时，这可以通过直接提问来完成。事实上，敏捷宣言的原则提供了许多不错的讨论方向：你是如何处理需求变更的？在项目开发过程中，你是如何与客户合作的？你在哪些方面投入了技术卓越性来支持项目？是什么激励着你？\n\
  \n### 积极进取者的职业管理\n\n一旦一个组织成功培养出积极进取的员工，并从外部招募到新的积极进取者，下一步就是留住并培养这些积极进取的员工。你该怎么做？\n\
  \n\n\n#### 心树星椅\n\n一个重要的第一步是，将定期讨论个人在工作和职业中的追求作为优先事项。进行此类对话的一种方式是芭芭拉·格兰特为微软员工管理者开发的模型，称为“心树星椅”。\n\
  \n与员工对话的“心”部分，重点在于讨论他们热爱当前工作的哪些方面，以及总体上他们喜欢做什么。你可以提出以下问题：\n\n*   你喜欢做什么？\n*   目前工作中，哪部分最让你感到满足？\n\
  *   在你过往的所有工作中，你最喜欢从事哪项工作？\n*   你工作中最不喜欢的事情是什么？\n\n对话的“树”部分，是关于员工希望如何在当前职位上成长和发展。你可以提出以下问题：\n\
  \n*   你设想自己一年后、两年后、四年后在做什么？\n*   当你观察组织中的其他人时，你希望成为组织中的谁？\n*   你接下来想学习什么？\n*   你接下来想发展或提升哪些技能？\n\
  *   你计划如何在接下来的一年中挑战自己？\n\n最后，对话的“星”部分包括关于员工认为工作中什么最有价值的问题。你应该明确表示，假设每个人都希望自己的工作得到公平的报酬——这当然是“星”对话的一部分，如果有人觉得自己的经济回报不足，你应该优先处理这个问题。但理解激励员工的其他方面也同样重要。对一些人来说，他们可能受到认可的激励；另一些人则可能因承担组织中最困难的问题而受到激励；还有一些人可能因能够影响最多人而受到激励；另一些人则可能因能与他们认为最能学到东西的人共事而受到激励。你可以提出以下问题：\n\
  \n*   是什么让你觉得继续从事这份工作是值得的？\n*   除了金钱报酬，在这里工作最有价值的是什么？\n\n你可以选择性地为这个讨论添加第四个元素，称为“椅”。“椅”的问题是为了确定是什么让他们留在当前职位，以及什么会导致他们离开。你可以在这里提出以下问题：\n\
  \n*   你为什么仍然留在当前职位？\n*   什么最可能导致你决定离开当前职位？\n*   当你考虑下一个职位时，它会是什么？\n*   你长期的理想职位是什么？\n\
  \n### 换椅子可能是好事\n\n请记住，某人更换他们的“椅子”不一定是坏事。通常，一个人成长和进步最快的方式是去做不同的事情，即使他们非常擅长当前的工作。我们有过许多经历，一个项目似乎完全依赖于某个人在某个特定角色上，结果却发现当那个人离开后，新人能够更好地填补这个角色——或者至少以一种不同的方式，最终使组织变得更强大。\n\
  \n#### 从个人贡献者到技术负责人/架构师/管理者\n\n大多数理性的人期望在职业目标上取得一定的、可衡量的进展。老板和员工之间明确彼此对职业目标以及实现这些目标的时间框架的期望是件好事。首先了解员工走的是哪条路径是很好的。员工未来是想成为管理者，还是想走“IC”路径？——这是微软的说法，指没有管理职责的个人贡献者。\n\
  \n最常见的职业路径如下：\n\n*   **初级到专家级开发者**：这条路径适合那些希望在职业生涯中始终亲力亲为从事开发的人。走这条路径的人会随着时间的推移承担越来越有挑战性的项目。他们可能会选择在某个特定领域变得非常深入，这很有价值——有些开发者整个职业生涯都在一个特定领域和类似的应用集上工作——而另一些人则选择在多个领域广泛了解各种技术。这两种类型的开发者——专家型专才和专家型通才——对团队都很有价值。走这条路径的人需要被分配能够持续增长和拓展其技术能力的任务。\n\
  \n*   **技术领导力路径**：这条路径适合那些天生在技术上负责，但不一定想管理人的人。走这条路径的人擅长沟通和完善技术想法，并自然地为他们参与的项目提供技术领导。这条路径最终可以发展为团队架构师，为越来越大的项目提供技术方向。走这条路径的人需要有机会领导项目，最初是小项目和小团队，但随着时间的推移，要扩展到更大的项目和更大的团队。走这条路径的人需要学会通过影响力而非权威来领导。\n\
  \n*   **人员管理路径**：这条路径适合那些希望培养和发展高绩效团队，并积极影响和改变他人职业与生活的人。走这条路径的人应该对为有动力的个人创造蓬勃发展的环境充满热情。他们应该有机会承担人员管理职责，并领导组织变革计划，以成长为这些角色。\n\
  \n*   **专业转换路径**：偶尔你会看到有人想在团队中转换专业。例如，我们见过开发者转岗为项目经理、技术文档撰写人等。在数据工程团队中，一个常见的挑战是，当某个主要拥有经典计算机科学背景、很少接触机器学习的人，想要完全转向通常由拥有更多机器学习经验的人担任的数据科学角色时。我们处理这个问题的方式如下：\n\
  \    *   **谨慎配对**：通常，在数据工程团队中，会有一些拥有强大机器学习背景的人，他们推动着团队中最重要的任务。通过将他们与有兴趣学习和建立相同技能组合的其他人配对，来传播他们的知识是很有用的。但同时，你也不想用太多“帮手”来压垮你强大的机器学习专家。找到一个平衡点，你可以将想学习更多机器学习知识的人分配到团队中，让他们与你的机器学习专家密切合作，同时又不至于过度拖慢这些专家的进度。\n\
  \    *   **优先安排机会**：通常，团队中的每个人，从最资浅的开发者到最资深的开发者，都想更多地参与机器学习问题。但并非所有人都能参与其中。团队中通常仍然有大量“非机器学习”的工程工作需要完成。机器学习机会可以用来激励和留住想学习的人。交替安排传统的工程工作与更多的机器学习任务，这样你既能继续推进非机器学习工作，又能定期为开发者提供学习更多机器学习知识的机会。\n\
  \n\n\n## 为积极主动的个体创造高效环境\n\n监控团队的工程环境至关重要，以确保你提供的环境能持续激励并赋能积极主动的个体。团队必须关注所谓的“开发者日常”。这涉及提出关于开发者一天工作的如下问题：\n\
  \n*   你今天浪费了多少时间？\n\n*   修改模型、重新训练并测试它花了多长时间？\n\n*   对某个功能进行代码修改并完成签入花了多长时间？\n\n\
  *   验证一项修改不会破坏现有产品需要多长时间？\n\n*   构建产品需要多长时间？\n\n*   调查并修复产品中的缺陷需要多长时间？\n\n### 内循环与外循环\n\
  \n如你所见，这些问题大多关乎开发者的时间利用效率以及浪费了多少时间。在微软，团队会讨论“内循环”和“外循环”。内循环是指开发者在自己的机器上以某种方式修改产品并测试其修改所需的时间。外循环则是指修改在开发者自己的机器上验证通过后，实际将该修改发布到生产环境供客户使用所需的时间。团队最好能识别出在内循环和外循环中最常做的事情——例如，重新训练模型、修复功能代码中的缺陷或修改\
  \ Web 服务——并测量所需时间。然后，团队可以持续不懈地缩短完成这些任务的时间。\n\n当你开始衡量产品的内循环和外循环时，会发现许多改进机会。以下是我们看到的一些内循环改进示例：\n\
  \n*   一个内循环的构建时间原本长达 20 分钟，通过重构和组件化构建进行了优化，将构建时间缩短至 2 分钟，这样每个人只需构建他们正在处理的产品部分，一年内节省了数千工时。\n\
  \n*   一个数据管道的内循环原本只能通过耗时数小时的服务器流程进行验证，通过提供一种新的数据管道变体进行了优化，该变体可在本地开发者机器上数分钟内完成验证。\n\
  \n*   一个用于部署网站更改的外循环原本需要数小时的测试，通过并行化测试（同时在多台机器上运行）提高了测试速度，从而进行了优化。\n\n### 如何成为英雄\n\
  \n如果你真的想赢得团队的敬仰，那就做点事来改进内循环或外循环。在埃里克的一个团队中，持续集成系统随着时间的推移，从原本 1 小时完成一次签入验证，逐渐退化到需要超过\
  \ 2 小时。当一位开发者暂停“日常工作”，决心深入调查时，他发现了一个影响所有运行测试的内存泄漏。修复后，集成系统恢复到了 1 小时。团队为此专门放了一天假来表彰他。\n\
  \n### 工具、监控与文档\n\n除了持续优化团队的内循环和外循环，你还应考虑工具、监控和文档。这三项投入能进一步改善开发环境，从而保持团队的积极性。\n\n\
  工具：没有什么比能让开发者工作更轻松的工具更好了。你的团队会告诉你“开发者日常”中困难的部分，并常常会提出让这些部分变得更简单的工具创意。这些工具可能范围很广，从自动化重复操作的简单脚本，到需要更多时间开发的复杂工具。虽然你可能在工具上过度投入，但我们更常见的是，由于急于发布产品，好的工具被忽视了。为工具留出时间。以某种方式将其纳入你的常规开发流程。例如，你可以选择定期进行工具冲刺，或者选择让开发者轮流进入专注于工具开发的冲刺，或者像第\
  \ 8 章“可持续开发”中描述的那样，每年安排固定的几周暂停常规产品节奏来构建工具。\n\n监控：没有什么比无法找出产品在线上为何失败更糟糕的了。通常，良好的日志记录以及用于搜索和查询这些日志的优秀工具，能决定一个功能或网站故障是持续几分钟还是几小时。这将在第\
  \ 7 章“监控”中进一步讨论。一个好的做法是每周召开一次关于上周产品任何故障的事后复盘会议。让了解故障的人参与进来。不要将其视为指责导致产品故障的开发者的机会。相反，应将其视为一个有用的学习机会，以找出可以采取哪些缓解措施来确保未来不再发生同类问题。同时讨论“检测时间”和“解决时间”。对于重大问题，应跟踪检测时间，以促使团队诚实地面对他们发现影响客户问题的速度。通常，通过更有效的监控可以缩短检测时间。通过更好的产品就地更新策略来修复问题，可以缩短解决时间。每周事后复盘会议的产出应该是工作项，并在后续的复盘会议中跟踪这些工作项，以确保它们得以完成。这将在第\
  \ 8 章“可持续开发”中进一步讨论。\n\n文档：团队中常常缺乏的、用于支持积极主动个体的最后一项是良好的文档。这里你应该问的一些问题包括：\n\n*   团队是否有足够的文档，使得新员工加入后仅通过阅读这些文档就能快速上手？\n\
  \n*   团队中最常见的开发者任务（训练模型、更新功能、部署功能）是否以逐步操作的方式记录在某个地方，以便新员工能够完成这些任务？\n\n*   开发者能否查看你的源代码仓库，并在关键目录中找到解释这些目录内容的相应自述文件？\n\
  \n在微软的开发者调查中，投资文档是最常出现的任务之一。通常，你的团队中会有积极主动、擅长写作并愿意投入文档工作的个体。在你的日程中为他们留出时间，并授权这些人编写文档。\n\
  \n### DocFX + Git\n\n我们成功用于文档的一个系统是 DocFX 和 Git 的组合。DocFX 是一个系统，它可以处理 Markdown 文档，并提供良好的导航和搜索体验。它被用于驱动\
  \ docs.microsoft.com。当与 Git 结合使用时，你可以保留对文档所做修改的变更历史，并利用 Git 的全部功能来管理和维护文档。有关 DocFX\
  \ 的更多信息，请参阅[`http://dotnet.github.io/docfx`](http://dotnet.github.io/docfx)。\n\n\
  \n\n### 开发者净满意度（NSAT）\n\n我们已经提出了几个量化指标来衡量你的开发环境的生产力：\n\n*   内循环中常见开发任务的“内循环”时间是多少\n\
  *   外循环中常见开发任务的“外循环”时间是多少\n*   检测产品中问题的时间是多少\n*   解决产品中问题的时间是多少\n\n除了这些量化指标，收集一个定性指标也很有用。我们在微软使用过的一个特别有用的跟踪指标被称为开发者\
  \ NSAT（净用户满意度）。跟踪你团队的开发者 NSAT 非常容易。定期（我们每月做一次）向你团队中的每个人提出这个问题：\n\n> *你对我们在团队中的整体开发者体验和生产力有多满意？*\n\
  \n1.  *非常不满意*\n2.  *不满意*\n3.  *既不满意也不满意*\n4.  *满意*\n5.  *非常满意*\n\n你还应该问一个额外的“填空”问题：\n\
  \n> *哪项投入或改变能最直接地提升你的整体开发者体验和生产力？*\n\n以匿名调查的方式提出这两个问题，并确保团队知道这是匿名的。这将鼓励诚实的回答。然后，根据该调查，你可以通过以下公式计算\
  \ NSAT 分数：\n\nNSAT = 100 + 非常满意的百分比 – (非常不满意的百分比 + 不满意的百分比)\n\n因此，如果你的调查得到以下结果：\n\
  \n*   *非常不满意：10% 的受访者*\n*   *不满意：18% 的受访者*\n*   *既不满意也不满意：31% 的受访者*\n*   *满意：40%\
  \ 的受访者*\n*   *非常满意：1% 的受访者*\n\n你的 NSAT 分数将是：\n\nNSAT = 100 + 1 – (10 + 18) = 73\n\
  \n定期跟踪 NSAT，并确保它呈上升趋势而非下降趋势。投入资源到调查中“填空”部分所建议的工作上，以保持你团队的 NSAT 持续上升。\n\n## 支持组织外部的积极个体\n\
  \n团队有时会忽略的一个领域是思考如何激励在团队之外甚至公司之外工作的个体。有几种主要方式可以利用这些外部个体。它们包括与开源社区互动、发表论文，以及为你的项目提供可扩展性方案，以便积极个体能够在此基础上进行构建和扩展。\n\
  \n开源：利用开源并为其做出贡献，是激励公司外部人员以及激励团队内部成员的好方法。开发者通常对为开源项目做出贡献感觉良好，因为其影响可能比内部项目更持久。它也能影响到比仅为一个小项目编写代码更多的人。在可能的情况下，寻找为开源项目做贡献的方法。此外，通过使用开源项目，你可以受益于公司外部那些持续改进你所使用的开源项目的积极个体。\n\
  \n发表论文：发表并传播你的团队在机器学习领域进行创新的方向。尽可能参加机器学习会议，并与你团队关注领域重叠的研究人员建立关系。保持参与机器学习社区对你的团队非常有激励作用，同时也为你提供了机会，去利用组织外部那些正在机器学习领域取得下一个突破的积极个体。通常，你想在团队中解决的问题，可能已经有多个已发表的论文可以参考，以获得解决思路。查阅文献，利用你问题领域中已有的研究成果。及时了解影响你感兴趣领域的最新出版物。\n\
  \n可扩展性：激励团队和公司外部个体的最后一种方式，是为你的产品提供一个优秀的第三方可扩展性模型。这可能简单到提供一个 REST API，允许其他方调用你产品的关键子系统，并在他们的应用程序中利用你的成果。思考一下你在产品中想解决但受限于开发资源和时间而无法解决的所有问题。然后考虑你是否可以公开一些\
  \ API，让第三方能够利用你的产品来解决这些问题。\n\n## 结论\n\n在第 5 章“积极个体”中，我们讨论了如何围绕积极个体构建项目。我们讨论了频繁重写的重要性。我们描述了一些关于如何设定愿景和指标目标的领导力理念，同时信任积极个体去找到实现愿景和指标的最佳方法。我们讨论了如何寻找和雇佣积极个体，以及一旦他们加入后如何留住他们并发展他们的事业。我们讨论了拥有高效开发环境的重要性，以及衡量常见任务的内循环和外循环时间以及开发者\
  \ NSAT。最后，我们谈到了如何利用团队外部的积极个体（这也会激励团队内部的人员）。\n\n在第 6 章“有效沟通”中，我们将描述促进围绕数据进行沟通的技巧和策略。\n\
  \n脚注 1\n\n\n\n"
- "# 6. 有效沟通\n\n> *向开发团队内部及团队之间传递信息最* ***高效*** *且* ***有效*** *的方法是* ***面对面交流***。\n\
  > \n> *——agilemanifesto.org/principles*\n\n数据工程团队中从不缺少讨论的话题：*我们查看了一部分输入数据样本，以下是我们的发现。这令人惊讶吗？目前，分类器对这些示例产生了误报。客户在意吗？我们将最新结果与月初的结果进行了比较，发现了一个奇怪的偏差。你怎么看？这些示例符合当前的定义吗，还是我们应该更新判断准则？我们的标注团队似乎在这些案例上一直存在分歧。它们重要吗？我们认为在这些案例中预测错误是可以接受的。你怎么看？我们相信这是衡量整体进展的正确指标。你同意吗？我们审查了一部分数据，看起来用于捕获所有案例的对象模型是这样的。它是不是太复杂了？*\n\
  \n如果你试图对庞大且多样化的数据集进行任何有意义的推断，那么几乎会持续不断地出现需要解决的问题、洞察、部分结果、歧义以及需要做出的决策。回答这些问题的最佳方式是什么？如何解读中间结果的蛛丝马迹，以便继续取得进展？如何让团队对你正在构建的世界模型的当前思考保持一致？如何为在数据科学探索空间中导航的个体开发者扫清障碍？现代开发工作场所提供了多种沟通模式，既有数字化的（电子邮件、即时消息、视频聊天、群聊、代码审查、数字看板），也有实体化的（面对面交流）——在敏捷数据工程项目中，哪些是最佳的沟通选择？\n\
  \n敏捷宣言的第六条原则提倡面对面交流。在它被撰写之时（2001 年），与互联网催生的多样化沟通平台相比，开发团队可用的替代方案非常有限。你可以将第六条原则理解为：面对面交谈比发起电子邮件线程要好得多。那么，面对面交流相比电子邮件，究竟提供了什么？\n\
  \n*   面对面交流是**即时的**——面对面交谈时，歧义、误解和困惑可以实时识别并立即纠正。异步沟通（电子邮件、即时消息等）是随意的，其延迟取决于相关个人的优先级。通常这些优先级是不匹配的——对于某个人来说，沟通主题的优先级高于其他人。\n\
  \n*   面对面交流是**人性化的**——我们可以充分利用人类交流的丰富性，包括非语言沟通（我能看出你似乎没理解我的意思）。所有其他形式，包括语音和视频聊天，都不具备这种特质——而且，表情符号并不能弥补这一缺陷\
  \ :-(\n\n*   面对面交流是一种**共享体验**——我们都在场，看到了同样的事情，并就某些结果达成一致。由团队见证的契约对于确保问责制非常有价值（尽管我们稍后会看到，这并不总是足够的）。\n\
  \n*   面对面交流是**丰富且互动的**——我可以以丰富的方式讨论一个数据集，既可以通过物理方式（指向投影的数据图形）与数据内容互动，也可以通过计算方式（使用应用程序转换和查询数据）进行互动。我还可以在白板上画图，并在从他人那里了解到新出现的画面中哪些不清楚时，修改我的图画。\n\
  \n所有这些都表明，在工程项目的背景下，面对面交流是最*高效*的沟通形式。考虑到这些因素，我们可以从*即时性*、*丰富性*和*共享体验*的角度，审视现代工程工作空间中的数字化沟通选项：\n\
  \n*   像 Slack 和 Microsoft Teams 这样的群组消息系统提供了*潜在的*即时性（实时聊天——尽管平台并不强制要求立即回复）。如果发起者因正在讨论的问题而受阻，这可能会让他们感到沮丧。他们还会额外承担思考“再发消息会不会不礼貌？”“我是不是还是该去他们办公室一趟？”或“他们到底在不在办公室？”的负担——其丰富程度与电子邮件相当，也就是说非常有限——并且缺乏面对面讨论那种本质上的互动性。你无法真正以共享的方式与内容互动。此外，许多此类系统都存在线程或交织问题。沟通渠道可能会混合并交织不同个体组合之间的不同讨论线程。Teams\
  \ 和 Slack 等系统最近的改进试图通过引入回复特定消息的功能来解决这个具体问题，但尚未达到理想的解决方案。在撰写本文时，这两个平台上的解决方案都引入了一些认知负担，并且容易因用户错误而导致线程碎片化。\n\
  \n*   视频聊天系统提供了面对面交流的大部分丰富性（参与者可以从参与者的视频中读取许多线索，尽管不是全部，使其更像一种人际互动），并且通过内容共享机制，提供了与数据的丰富交互。视频会议的局限性——读取参与者所有非语言线索的能力略有下降，尤其是在对话中轮流发言方面——可能导致互动略显生硬，但因此也更有条理。我们认识一些高管，他们要求那些本可以面对面进行的会议（对团队大部分成员而言），但由于某些必需参会者远程，而改为在线进行，以便所有参与者都能公平互动（而不是偏向那些能亲自到场的人）。\n\
  \n*   现代代码审查系统（例如微软的 Azure DevOps）围绕代码提供了异步、共享且适当丰富的体验。审查代码可以追踪作者、审查者和系统自动化组件（构建流水线、测试流水线等）之间相当复杂的交互。平台已经变得足够复杂，可以将聊天频道集成到任何可以使用身份标识的内容系统中。同样，数字看板也促进了多种形式的互动。它们本质上是围绕规划进行互动讨论的对象。\n\
  \n数字化中介互动的一大优势是其内置的捕获内容并为其增值的能力。例如，使用视频会议平台举办内部研讨会、Scrum 团队演示会议等，意味着活动可以被录制下来。录制的内容可以成为团队可共享的资产。此外，无论是实时还是离线，都可以增加一些价值——例如，机器翻译的最新进展意味着会议期间可以实时翻译口语。此外，数字平台意味着可以开放\
  \ API，允许机器人（能够与人和内容进行多步骤交互的智能代理）为任何流程做出贡献。例如，可以构建一个机器人来监控代码库，查找特定条件，向相关工程师报告，并与这些个体协调多步骤的解决方案。\n\
  \n\n\n传统工程项目涉及围绕系统（架构、平台、数据库模式）、流程（规划、执行）、运维（部署、监控）以及体验（用户界面和信息架构）的讨论。第六条原则提倡通过面对面沟通来解决这些议题。数据工程项目在此基础上增加了围绕数据和推理算法的交互。正如我们将看到的，需要进行的讨论类型以及以交互方式有效支持这些讨论的工具，在许多方面都与传统工程背景截然不同。我们将讨论数据项目所需的一些具体活动，以及如何在面对面会议中促进这些活动，同时探讨如何最好地支持传统敏捷工作流会议中围绕数据的讨论。\n\
  \n### 面对面沟通的短暂性\n\n尽管面对面沟通有许多好处，团队在日常互动中应尽可能多地使用它，但它有一个基本问题，即使在规模适中的组织中也必须面对。面对面沟通是短暂的——没有内置的记录来保存决策、协议、设计、备选方案、假设等内容。根据我们的经验，面对面沟通的即时性和实用性需要通过一系列最佳实践来支持和增强，这些实践应产生某种形式的数字制品。这在大型组织中尤为重要。\n\
  \n建立一种能够高效地将面对面沟通与适时创建支持性数字制品（包括代码和非代码）相结合的文化，是一项不容低估的挑战。许多开发者认为编写代码是他们唯一应承担的“工作”，而任何涉及文档、规划等的额外任务都是不必要的开销。除此之外，如果内容平台和团队流程的选择未经深思熟虑，团队可能会经历在内容平台内部及跨平台重构文档的实际开销。\n\
  \n让我们用内容管理系统的特性来补充我们对面对面沟通优势的描述。\n\n*   **创建和编辑内容的成本**：如果内容管理系统使创建和修改内容变得容易，这意味着团队可以非常迅速地开始工作。像\
  \ Microsoft OneNote 这样的系统允许用户在几分钟内上手并运行。缺点是，不受约束的内容创建会很快导致内容混乱、缺乏组织。页面和章节被遗忘并变得过时。随着内容创建成本的增加，团队可能会在如何组织和创建内容方面做出更周全、更好的决策。缺点是，高昂的维护成本可能导致团队推迟并最终放弃文档的创建和维护。\n\
  \n*   **搜索功能**：内容系统越不受约束、越开放，搜索就越成为一项重要功能。结构混乱且无法搜索的内容几乎变得毫无用处。例如，微软的 OneNote 虽然创建成本低，但据我们看来，其搜索功能平庸。\n\
  \n常用于管理团队内容的平台包括以下这些：\n\n*   **OneNote**：微软的所见即所得类 Wiki 系统。它的入门门槛非常低——只需开始打字即可——但可能导致内容庞大、结构混乱且难以搜索。\n\
  \n*   **签入代码管理系统的文档**（例如 Azure DevOps、GitHub）：签入内容使团队能够将代码审查甚至测试的纪律引入文档领域。应选择一种人类可读的文本格式（Markdown\
  \ 好，PDF 不好），以便与用于代码的内置比较工具良好配合。如果你能建立这种文化，那么维护工作就不会太繁琐——你需要在审查代码时，将“审查文档变更”添加到工作流程中。\n\
  \n*   **独立 Wiki**：像广受欢迎的 MediaWiki 平台这样的系统，你的团队应该熟悉（或易于采用）。它们比 OneNote 提供更多约束，编辑需要更多意图（这可能是件好事）。如果你需要更接近代码工作流程的工作流，还可以考虑\
  \ DocFX 和 Git（参见 github.com/dotnet/docfx）。Atlassian 的 Confluence 是另一个不错的选择。\n\n\
  *   **Word + 文件系统或 SharePoint**：对于内容不频繁变更的重要定义性内容（如规范或需求），功能完备的文字处理器的正式性可以成为有用的工具。这类文档在结构良好的文档空间中表现最佳。\n\
  \n\n\n非代码工件的挑战非常人性化——它们与纪律、行为习惯息息相关。为构建和测试文档寻找类比是极其困难的。在这一领域取得成功的一个通用方法是限制可创建的文档类型。有了这些范围明确、定义清晰的工件集，就更容易要求每次签入都必须包含公共方法的注释，或者演示会议必须直接从实验日志中运行。我们曾处理过的一些工件类型包括：\n\
  \n*   **实验日志**：我们工作中涉及数据科学的部分，嗯，是一门科学。与大多数科学探索一样，数据科学家会探索各种空间以发现有价值的东西。探索这些空间通常涉及数据集、算法、一些参数、一些输出以及分析。如果这些实验记录被创建、可访问且可搜索，对整个团队来说价值巨大。更好的是，如果这种形式的文档能够链接到所涉及数据的持久（且不可变）版本——更进一步，如果能够引用某种序列化版本的实验，以便其他人甚至可以重新运行该实验或检查其所有方面（代码版本、参数等）。作为该领域团队的经理，对这些能力进行深度投入（无论是研究第三方系统还是内部构建工具链）是一项重要的承诺。正如我们利用强大的系统来启用和集成代码的单元测试一样，持久的实验描述和重现将为团队带来回报。一个非常流行的平台是\
  \ Jupyter Notebook。^(¹²) Jupyter 文档将供人阅读的文本单元格与共享整个文档上下文的代码单元格交织在一起，任何有权限的人都可以交互式地运行、操作和扩展这些代码。\n\
  \n*   **模式文档**：为任何非最琐碎的情况推导模式都需要对该领域进行相当深入的研究。我们在对网站上企业用于描述本地实体营业时间的表达式进行建模时，以及在设计一种可用于描述网页、PDF\
  \ 文档、SharePoint 页面和 PowerPoint 文档的抽象文档表示时，都经历了这一点。捕捉那些驱动从高层结构到包含或故意排除某些案例等一切决策的示例，将有助于团队决定实现什么以及如何实现。\n\
  \n*   **判断准则**：与模式文档密切相关，判断准则在某种意义上对团队来说是最具体的“真理”，因为它们被用来推导指导团队工作以及影响（和奖励！）的指标。判断准则是你试图从原始数据中推断出的丰富世界模型与你可能雇佣来生成训练和评估数据的大规模数据标注者之间的接口。可以想象，正确制定这些准则非常重要。我们围绕判断准则制定了许多最佳实践。它们应包括对如何使用特定工具完成任务的标准化描述。许多任务会涉及某种形式的标注，这些标注应由一个通用平台驱动。它们应包括对所捕获概念的直观描述。它们应描述包含和排除的具体案例。它们都应得到具体示例的支持，精确展示这些示例在工具中的样子以及标注应用前后工具的状态。最后，文档应进行严格的版本管理——既引用先前版本，也描述自上一版本以来所做的更改。\n\
  \n正如前文所述，在内容方面没有灵丹妙药。这正是人为因素发挥重要作用的地方。作为管理者，你能鼓励或要求团队紧跟内容任务吗？\n\n## 围绕数据的讨论必然是交互式的\n\
  \n不同的团队成员以及其他团队的成员，对项目中涉及的数据集会有不同的看法。他们会看到数据中被建模对象的不同方面；他们对如何评估表示或推理结果的质量会有不同看法；他们对风险所在之处也会有不同看法。你还会遇到一些团队成员，他们对与机器学习工具链和生产架构相关的数据感兴趣。将这些不同的视角带入围绕数据的讨论中，只会让团队受益。\n\
  \n在最近一个改进从网站提取地址的项目中，尽管我们的新提取器在我们精心构建的评估集上表现更好，但负责连锁企业以及博物馆、医院等大型复杂实体的团队成员观察到，在他们负责的数据子集上实际上出现了性能倒退。如果我们仅仅使用现有的指标而不进行跨团队协作，我们就会错过这个洞见。在另一个场景中，一个合作团队质疑我们使用每文档平均精确率和召回率，建议我们改用全局精确率和召回率来评估我们正在开发的分类器。这些不同的方法得出了截然不同的数字，并帮助我们以不同的方式审视数据。\n\
  \n在构建一个新的模式来表示本地实体的营业时间时，对表达式广度的深入研究揭示出该模式必须相当复杂，必须能够表示关于节假日的规则、重复的开门和关门模式，以及像“日落”和“最后一位顾客离开时”这样的非特定时间。负责实现该模式的团队提出了一个需要工具来检查和理解实例化的解决方案。然而，当这项关于表示的研究成果与下游消费团队分享时，他们对复杂性（可能导致推理中的额外错误）和表示形式（更倾向于简单的文本序列化，以便数据工程师在调试和评估数据质量时能非常快速地阅读和理解数据实例）提出了相当大的反对意见。\n\
  \n在另一个旨在从网页中提取主要内容（剥离导航、横幅和其他非主要文本）的项目中，我们发现我们的指标偏向于小文档（在识别构成渲染页面的特定组件时，小文档出错的空间更小）。这引发了与数据消费者的重要对话，最终确定这些小文档实际上并没有特别的价值，因此构建一个分类器来识别并移除它们才是正确的方向。\n\
  \n个人也会带来不同的假设和偏见。同样，通过结合团队成员的观点，团队可以不断纠正并提升自身能力。讨论数据、推理系统设计以及实现结果，也将为经验丰富的数据工程师指导初级团队成员提供机会。\n\
  \n我们发现，在实践中，要围绕不同且常常相互冲突的观点和理论进行对话，唯一的方法就是手头有数据集，并且能够交互式地回答问题。任何未经分析支持的数据陈述都只是一个假设，数据要么支持它，要么反驳它。通过安排一个工作项然后进行讨论来回答每个问题是非常低效的。相反，应尽可能让交互式工具成为讨论的一部分，并直接用于选择、过滤和转换数据集（或样本）。\n\
  \n\n\n## 数据工具基础\n\n为了支持围绕数据集交互的讨论，思考最佳实践至关重要，包括对工具、抽样方法和数据呈现的要求。请记住，当我们能够为流程的任何部分带来效率（即使是微小的效率）时，敏捷实践就会得到改进。然而，重要的是要记住，效率必须体现在团队层面，而不能贪婪地应用于个人。例如，如果你要向团队展示数据，在讨论前多花些精力，以便会议尽可能高效，这就是一种胜利。演示者个人花费了更多时间，从而在团队层面产生了净收益。\n\
  \n### 数据讨论工具的要求\n\n有许多工具可以支持数据讨论。也许最显而易见的就是普通的电子表格（Excel、Google Sheets 等）。当你遇到这些工具的通用性对你的分析场景造成的限制时，你肯定会考虑实施内部工具。这些工具的基本要求如下：\n\
  \n*   **加载**\n    *   这是一个显而易见的要求，但要注意工具在加载大型数据集时的性能。此外，有些工具虽然允许加载大型数据集，但在以任何有意义的方式处理这些数据时却无法执行。好的工具至少会实现数据和\
  \ UI 虚拟化；更好的工具能够即时对数据进行子采样，为用户提供更大数据集的代表性视图。\n\n*   **转换**\n    *   通过过滤和应用附加谓词来对数据进行子集化。一旦你加载了数据，你将需要对其进行过滤，以便按需查看不同的子集，并可能应用需要某种方法调用的任意过滤器。\n\
  \    *   交互式生成数据样本，以便快速进行就地评估。在某些情况下，比如电子表格，可以通过一个相对简单的工作流程进行抽样，该流程涉及添加一列随机数，然后对这些随机数进行排序以打乱数据中的行。更复杂的系统会以内置方式提供此功能。\n\
  \    *   计算从源数据派生的附加数据。例如，你可能想要在表格中添加一列，指示另一列中的值是否高于或低于某个阈值。这种通过派生数据构建分析的模式非常强大，也是标准电子表格应用程序的基本功能。\n\
  \n*   **聚合**\n    *   执行各种聚合函数，例如求和、求平均值、计算分布等。同样，基本的电子表格支持此类操作，但只能通过一系列子步骤的工作流程来实现。\n\
  \n*   **可视化**\n    *   可视化系统中各个阶段（包括输入和输出）存在的对象数据。\n    *   对数据中的因子进行子集化，以便于查看，例如，从表格中移除不需要的列。\n\
  \    *   绘制图表以显示趋势、分布和关系。\n\n### 进行快速评估\n\n使用电子表格或类似的面向表格的数据工具进行快速临时评估的方法如下：首先，为每个数据项关联一个随机数；然后，按此随机数对数据进行排序。从某种意义上说，数据的任何连续子序列都可以被视为随机样本。然而，在浏览数据做出判断时，提前确定你要查看多少数据至关重要。如果不这样做，你可能会在结果看起来对你有利的时候结束评估。这也意味着，如果你看到同事的数据摘要声称他们查看了某个任意数量的样本，你应该质疑为什么是那个数字。他们可能是在数据中看到了一个不错的结果时就停止了，从而陷入了确认偏误——在数据中寻找支持预先得出的结论的证据。请记住，随机数据可能是成簇的——这就是为什么当你抛硬币时，你不会得到\
  \ HTHTHT 这样的序列，而是会得到一串 H 簇和 T 簇。另一件要记住的事情是，如果你的数据中存在较大的效应，那么它很可能会通过一个相对较小（因此计算成本较低）的样本暴露出来。例如，如果某件事在你的数据中发生的概率是\
  \ 10%，那么在 50 个样本中未观察到它的概率约为 0.5%。\n\n有了样本，我们通常希望随后对数据中发现的因子进行快速分析。例如，假设我们正在评估一个针对特定命名实体、在网页上运行的提取器。我们可能会列出以下错误原因：\n\
  \n*   数据在图像中（我们的方法是基于文本的，因此如果内容以图像形式存在，则无法访问）。\n*   数据不在文本节点中（实体可能被引用在元素的属性节点中，而不是元素的文本节点子节点中）。\n\
  *   HTML 中缺少内容（页面可能使用某种渲染时的动态过程从服务器拉取内容并修改 DOM，以允许用户看到所需信息）。\n\n然而，我们经常看到的是，几乎不可能事先确定这样一个列表——只有通过检查样本，我们才能真正发现所涉及的因子。因此，最常采用的过程是使用电子表格，每行一个示例，并在我们分析时创建列来捕获分析的因子。在分析几个示例后，你将开始看到重复的因子。如果你遵循在每个因子列中根据因子的存在与否放置\
  \ 1 或 0 的做法，那么在审查完示例后，就可以轻松地读出分析中因子的频率。图 6-1 展示了对一些 URL 进行因子分析的示例。\n\n![../images/473932_1_En_6_Chapter/473932_1_En_6_Fig1_HTML.jpg](img/473932_1_En_6_Fig1_HTML.jpg)\n\
  \n图 6-1\n\n因子分析示例。请注意，在按随机数对行进行排序后，随机数看起来是无序的，因为 Excel 会在每次查看工作表时重新生成它们。\n\n###\
  \ 挖掘实例\n\n对小样本进行快速评估有助于揭示数据中事物的*类型*。一旦你有了几个这样的类型，能够显式地挖掘该类型以更好地了解其频率和构成就非常有用了。例如，通过查看\
  \ 50 个示例，我们可以相当确信会观察到频率在 10% 或以上的情况。然而，我们仍然对这个现象的真实规模有些模糊。通过查看几个案例，我们可以构建某种谓词（或启发式规则），使我们能够直接从集合中提取这些示例（因此需要一种能够支持某种任意谓词执行的工具）。\n\
  \n\n\n### 采样策略\n\n随着你从数据经验中学习到的采样策略越多，你就越能期待针对特定数据集和特定场景，就哪种采样方式更合适展开长时间的讨论。其原因，以及关于正确采样方式所有问题的答案，在于没有所谓的最佳采样方式，而审视多个样本则有许多好处。尽管可能没有唯一的最佳采样方式，但确实存在许多糟糕的采样方式，因此了解一些基本选项是很有用的：\n\
  \n*   **简单均匀采样**：这也被称为随机样本。在电子表格应用中，可以通过为数据中的每一行分配一个随机数，然后按该数字对数据进行排序来生成。当以编程方式处理数据集时，可以应用\
  \ Fisher-Yates^(¹³) 洗牌算法；或者对于更大的数据集，甚至是潜在无限的数据流，可以使用蓄水池采样^(¹⁴)。\n\n*   **加权采样**：简单均匀采样回答的问题是“如果我从数据中随机选取一行，我看到某个特定效果的概率是多少？”。然而，你的数据很少会以这种方式被体验。例如，在网页搜索中，浏览网站的人并不会从数万亿的页面中进行均匀采样。相反，他们有意或无意地只消费了网络的一小部分。在这一小部分中，某些页面被浏览的次数多于其他页面。因此，如果你想问的问题是“如果我从所有用户和所有网页的空间中，对单个浏览事件的人群进行采样，观察到我所感兴趣的特定分析效果的概率是多少？”——例如，如果你感兴趣的有趣事情是与搜索引擎上商家列表相关联的地址的正确性——那么知道用户查看连锁商家列表的次数多于非连锁商家，意味着你应该更关注那些在连锁商家列表中发现错误的情况，而不是整个商家群体。加权采样可以通过根据权重有效重复数据中的行来实现。因此，如果我们给商家\
  \ A 分配权重 2，给商家 B 分配权重 1，那么我们的采样将着眼于一个包含三个数据点的人群。显然，在随机采样这个数据视图时，抽到商家 A 实例的概率比我们数据中只有两行时要高。\n\
  \n*   **分层采样**：通常情况下，你的数据可以按照有意义的、高层次的方式进行细分。同样常见的是，这些细分可能与预期（或怀疑）的偏差相关联。让我们考虑从提供商品销售的网站中提取价格的例子。由于在撰写本文时，亚马逊主导了这个领域，我们可以想象，这些网页的样本（无论是均匀采样还是加权采样）中会有大量来自亚马逊网站的页面。事实上，你最终可能只得到来自亚马逊网站的页面。由于亚马逊网站上的所有页面都使用相同的方式来呈现价格，那么价格提取器很可能要么在所有页面上成功，要么全部失败。虽然这能让我们对提取器的性能有一定的了解，但它无助于理解提取器在价格可能呈现的多种方式上的表现。当然，如果亚马逊的例子表现不佳，你会去修复它，但这实际上会使你对非亚马逊的价格呈现方式视而不见。分层采样使用某种形式的分层来提供一组子样本，然后将这些子样本组合成完整的样本。在这种情况下，我们可能每个域名最多采样十个页面。那么，采样算法首先会从域名空间中进行采样（我们可能会得到\
  \ amazon.com、bestbuy.com、target.com），然后对于每个域名，进行均匀采样以获取十个页面。\n\n### 迭代差异分析\n\n跟踪和改进质量的最佳方法是投资于一个度量标准——这包括所有必要的数据收集、指南编写、工具构建和维护。然而，有时开销过高，但仍需要进行某种评估。我们发现一种行之有效的方法是迭代地对系统的输出进行差异分析，并对差异部分进行采样。没有变化的数据对最新实验所产生的改进（或退化）的评估没有影响。通过对已发生变化的示例进行少量均匀采样，可以构建一个观察到的变化类型表：从好到好（两个结果都可接受）、从好到坏（我们过去能得到正确的推断，但现在不能了）、从坏到好（一个胜利——过去是错误的地方现在得到了改进），以及从坏到坏（结果仍然糟糕，只是不同了）。如果采用这种方法，那么一个副产品实际上是已标注的数据，这些数据的积累可以发展成一个度量标准，或者至少是一个用于测试的回归测试集。\n\
  \n## 审视数据\n\n本书无意提供关于数据可视化呈现的深入回顾或详细指导。然而，我们确实希望就如何处理这一领域提供一些指导。就像我们在本书中涉及的所有非编码领域一样，数据可视化是另一个意图至关重要的领域——作为一名数据科学家、机器学习专家或数据工程师，你需要能够沟通和传达关于数据的叙事。因此，需要认识到数据可视化是一个可以不断学习、改进和创新的领域。请记住，敏捷性要求注重细节并投资于效率。清晰、令人难忘且真实的数据呈现有助于提升这种能力。同时也要注意，在这个领域很容易失去意图，因为已经有太多可用的工具。然而，许多这些工具提供的都是些常用的可视化方法，这些方法在当前数据项目时代之前，以及针对大规模和高维数据图形摘要呈现特定方法有效性的研究不断增多之前，就已经流行起来了。\n\
  \n也许最能说明数据可视化复杂性的著名例子是饼图。饼图的问题在于感知和一大堆神经科学方面。事实证明，我们在比较面积（二维）方面不如比较线段长度（一维）那么擅长。事实上，你可以将此视为数据可视化的第一条规则——不要在可视化中引入数据中不存在的维度。这一原则也否定了\
  \ 3D 条形图、蜘蛛图或雷达图等。此外，饼图往往需要使用颜色——这给我们的大脑带来了额外的复杂性和负担。因此，与其这样\n\n![../images/473932_1_En_6_Chapter/473932_1_En_6_Figa_HTML.jpg](img/473932_1_En_6_Figa_HTML.jpg)\n\
  \n不如考虑这样做\n\n![../images/473932_1_En_6_Chapter/473932_1_En_6_Figb_HTML.jpg](img/473932_1_En_6_Figb_HTML.jpg)\n\
  \n但绝对不要这样做\n\n![../images/473932_1_En_6_Chapter/473932_1_En_6_Figc_HTML.jpg](img/473932_1_En_6_Figc_HTML.jpg)\n\
  \n因此，我们的建议是，将数据可视化视为你工具箱中不可或缺的一部分。就像你已经投入精力去理解如何优化代码、如何确保线程安全、如何为测试进行设计以及所有其他工程深奥技艺一样，你也应该深入研读数据可视化的文献，并理解如何帮助你的数据分析消费者准确、客观地理解它。\n\
  \n\n\n### 延伸阅读\n\n关于数据可视化的著作颇丰。两本优秀的延伸阅读资料是爱德华·塔夫特的《*Envisioning Information*》和斯蒂芬·菲的《*Information\
  \ Dashboard Design*》。此外，如果你想从精湛的数据可视化案例中汲取灵感，可参阅 aka.ms/dataviz2018。\n\n## 高效主持会议是一门技能\n\
  \n面对面会议并非简单地确定时间和地点那么简单。作为开发者，我们应当非常珍惜专注于任务的专属时间；而作为管理者，我们应当意识到召集人员开会的成本（一场中等规模的\
  \ 1 小时会议，其成本大致相当于一个人天的工作量）。会议至少应具备一个明确的目标，以及为实现该目标而设定的既定流程。通常，对与会者的个人准备（例如阅读需求文档、对数据集进行独立分析等）设定一些期望也很有帮助。负责主持会议的人还应对会议的技术成功负责——会议时间越短，因技术失误（如投影仪无法工作、笔记本电脑电池需要充电、视频会议集成出现故障）带来的风险就越大。此外，会议的社会性方面也总能加以优化——确保关键利益相关者能准时出席，了解谁在会议前后还有其他会议，以及这些会议在组织层面是否比你的会议优先级更高。最后，仔细思考回答关键问题所需的数据，并确保这些数据随时可用，这始终是很有价值的。\n\
  \n### 是否允许使用笔记本电脑\n\n为会议参与度设定一些期望也很有用。你是否期望整个会议期间每个人都全神贯注？如果是这样，那么确保笔记本电脑合上，没有人随意浏览新闻推送，是个好主意。\n\
  \n### 有主持人的会议\n\n对于大型会议，一个值得考虑的有用技巧是采用有主持人的会议形式。这种形式为会议增加了更多规范性，并有助于每个人更公平地参与会议。指定一人担任主持人。主持人拥有一份会议将要涵盖的主题列表，以及每个主题的时间限制。每个主题会指定一位主要发言人首先发言。但为了避免发言人被随意打断，有评论或问题的人需要举手。主持人将这些人的名字按“先进先出”的顺序列入一个列表，该列表要么投影到屏幕上，要么保留在房间的白板上，以便每个人都能看到队列顺序。当主要发言人准备让出发言权时，人们按顺序轮流发言，直到发言完毕。任何时候，其他人可以举手要求加入队列。主持人会留意时间，并在主题时间即将耗尽时给出时间提醒。\n\
  \n有主持人的会议形式有许多优点，包括：\n\n*   它使远程参与的人处于平等的地位。\n*   它让那些不习惯从正在发言的人那里抢过话头的人更容易做出贡献。\n\
  *   它有助于那些倾向于说得太多的人更多地倾听他人的意见。\n\n关于如何高效主持有主持人会议的更多想法，请参阅 Chelsea Troy 的博客文章，网址为\
  \ [`https://aka.ms/moderatedmeetings`](https://aka.ms/moderatedmeetings)。\n\n##\
  \ 结对与并行标注\n\n结对编程是一种编程方法，两名开发者以流畅互动的方式共同编写和测试代码。其中一名开发者主导，敲击键盘，通过讨论和迭代生成代码。由于过程中有第二双眼睛的存在，许多错误几乎可以立即避免，代码审查实际上在编写代码和测试时就已经同步进行。一旦被采纳，这个过程会非常有成效——这是一种编写高质量代码的高效方式，也是两位开发者相互学习的绝佳途径。\n\
  \n我们在成对标注训练数据和评估数据时也发现了类似的效率提升。在为新的地址提取器标注网页数据时，我们发现结对标注具有以下好处：\n\n1.  在页面上定位标注目标：页面可能很复杂，有时地址并不容易快速定位。\n\
  2.  完善地址模型：由于我们不仅要标注地址的完整范围，还要标注其子部分，标注过程中的讨论促使我们改进了在标注中表达整体地址模型的方式。\n3.  捕获问题：当其中一人进行标注时，作为一对搭档，我们可以发现并讨论我们看到的问题模式，并想出描述和记录它们的方法。\n\
  4.  共同承担责任：单独工作的一个风险，尤其是当你负责交付提取器或分类器时，是你在标注评估数据时可能会过于宽松。有另一个人在场，通过互动可以产生一定程度的平衡。\n\
  \n我们经常遇到这样的情况：我们在某个概念的较高层次定义和作用上大体达成一致，但发现精确定义它却很棘手。例如，在最近的一个项目中，我们希望为一组新闻文章提供一个主要主题，以便它们可以在内容推荐系统中呈现给用户。我们通过挖掘热门社区网站上的标签生成了大量主题，并着手构建一个数据集，以便在类似亚马逊土耳其机器人的系统中进行标注。然而，当我们开始详细审视这些主题时，我们开始怀疑自己对标签的直觉判断。\n\
  \n为了更好地理解问题所在以及如何解决它们，我们进行了一系列小组标注会议。负责交付主题分类系统的开发团队坐在一起完成一项标注任务。小组被分成两人一组，每组负责十个主题，并各自标注一份共享的文档集。每当出现一个有问题的示例时，小组就会讨论这篇文章，找出解决方案（利用到目前为止标注过程中共享的上下文），并在适当时更新判断指南，添加更多细节并重构现有文本，以反映最新的思考。\n\
  \n在适当的时候，各小组会跨主题讨论问题。这种方法意味着许多定义性问题可以实时解决。另一种方法是让一个人或一个小组完成一轮标注，总结问题，向团队汇报，然后再进行下一轮迭代。\n\
  \n\n\n## 数据沉浸会\n\n我们在本书中多次谈到指标在数据项目执行中的核心作用。它们充当了开发者在项目的每次实验和迭代中都能使用的客户代理，同时也成为许多设计决策的强制驱动因素，其中最重要的是用于捕获系统输出的模式或数据结构。然而，在项目的生命周期中，有许多时刻需要做出决策，但要么没有指标，要么指标过于笼统或不足以提供清晰的黑白答案。在这种情况下，团队需要做出某种判断。具体如何决策取决于团队，但我们希望引入一个通用的团队流程，它提供了一个高效且信息充分的框架：数据沉浸会。\n\
  \n除了数据猪在数据泥里打滚、享受欢乐时光的迷人画面外，数据沉浸会是一种会议，团队通过亲手接触数据、与之互动并提问来做出决策。基本工作流程如下。\n\n首先，主持数据沉浸会的开发者（主要负责引导团队达成决策）向团队提供他们试图达成的决策描述、所涉及的必要数据集、与数据交互的工具，以及（如果需要）对数据进行推断的工具。\n\
  \n其次，团队成员花一些时间单独审查数据，形成自己对数据和待决策事项的看法，并提出任何想要讨论的问题。\n\n第三，召开数据沉浸会。主持人提供背景信息、数据回顾，团队成员贡献他们的想法和问题。会议期间，通过检查数据来回答问题——因此交互式工具、运行推断等环节至关重要。\n\
  \n让我们考虑一个具体的端到端示例，然后探讨通常通过数据沉浸会做出的决策类型。\n\n团队一直在从事一个从网页中提取营业时间的项目。该项目注重精确度，这意味着提取技术实现了仅在满足特定约束条件时才生成结果的规则。具体来说，只有当系统找到一周中每一天的营业时间描述时，才会输出营业时间。这种数据交付方式的结果是数据质量非常高，但召回率有限。我们希望提高召回率，因此使用不同、更宽松的约束条件进行了一系列实验。\n\
  \n为了就数据发布做出决策，开发者组织了一次数据沉浸会。为准备这次沉浸会，他对结果进行了一些评估，并准备了一份包含评估内容的演示文稿。此外，他还开发了一个交互式工具，使团队能够在会议期间实时查看提取结果，并以显示提取结果在原始文档中确切位置的形式呈现。\n\
  \n会议从回顾评估方法开始。首先，进行了差异分析，将新约束条件下提取的数据与当前生产环境中测试站点提取的数据进行比较。在 57,000 个站点中，净增 3,300\
  \ 个站点提取到了营业时间，其中 3,500 个是新提取的，200 个是回归（意味着我们之前能提取，但新系统现在无法提取），还有 200 个是修改（意味着我们仍然能提取，但结果不同）。开发者预测，在整个语料库中，提取量预计将增加约\
  \ 50,000 个，并且根据手动评估的 100 个样本，精确度约为 90%——略低于当前生产环境的性能。\n\n第一张幻灯片让团队了解了工作的影响和评估细节。任何对评估的批评都可以直接在会议上提出，并且可以集体决定评估方法是否合适，以及结果是否支持发布决策。\n\
  \n由于团队认为评估看起来合理，会议随后转向交互式查看特定站点的提取结果。除了为确定提取精确度而进行的随机抽样外，团队成员还可以立即了解系统在他们各自负责的问题领域上的表现。会议中提到了一些回归情况——是否存在对特定领域的偏向？有些站点既没有成功也没有失败，但提取结果发生了变化——这些变化看起来如何，是积极的、消极的还是中性的？由于开发者准备了每种结果类型（成功、失败、变化）的示例，团队可以查看并讨论这些案例。由于开发者手头有交互式工具来运行提取，团队可以查看他们感兴趣的站点的结果。\n\
  \n会议的结果是，团队支持发布这些更改。\n\n\n\n## 演示会议\n\n在每个冲刺结束时，我们会按照第 4 章“与业务对齐”中介绍的方式召开演示会议。开发团队，或者如果是在一个更大的多团队\
  \ Scrum 项目中，则是多个团队，会聚在一起展示他们的工作成果。在正式的 Scrum 流程中，团队会向客户演示可运行的软件。对于单个 Scrum 团队进行演示会议的标准\
  \ Scrum 流程，我们做了一点修改：我们发现，让多个在同一整体项目上以模块化方式协作的团队共同参加一个演示会议，是一种有用的方法。虽然这会增加会议时长方面的成本，但通过让那些相互依赖、共同工作的团队一起展示，工作成果、结果和规划会在某种程度上，根据合并后团队项目的更广泛目标进行自我调节。\n\
  \n在数据项目中，除了演示可运行的软件，展示数据分析、重要洞察以及重大规划和发布决策背后的理由，也是有效利用这段时间的方式。无论是否有正式客户在场，这个会议都是团队标记一个冲刺工作成果（可以说是一种庆祝活动，可能还会涉及食物和饮料），并向直属经理汇报、向同级经理通报的绝佳机会。\n\
  \n与 Scrum 中的许多活动一样，这个会议是有时间盒限制的。每个 Scrum 团队都会被分配一个特定的时间（通常与其规模成正比——一个五人团队可能会被分配\
  \ 10 到 15 分钟）。我们发现，让每个团队采用一个模板来制作第一张总结幻灯片，是保持团队使命始终突出、并定期检查团队关键指标的有效方法。总结幻灯片包含一个表格，列出冲刺中计划的故事以及这些故事是否完成，还有一个表格显示关键指标，包括目标值、当前值以及随时间改善的情况。图\
  \ 6-2 展示了一个冲刺总结幻灯片的示例。\n\n![../images/473932_1_En_6_Chapter/473932_1_En_6_Fig2_HTML.jpg](img/473932_1_En_6_Fig2_HTML.jpg)\n\
  \n图 6-2\n\n冲刺总结幻灯片示例\n\n与数据深潜和小组标注等活动相比，冲刺演示会议往往更受约束。没有那么多时间进行开放式讨论，因为每个团队的时间段有限，而且正如我们观察到的，团队会保护自己的时间（这很合理）。但这种约束是件好事——演示的关键技能之一是在尽可能透明和客观的同时，力求清晰并消除误解的机会。在演示中，把时间浪费在回答因图表坐标轴含义不清或数据可视化旨在传达的洞察的意义和重要性不明而引发的观众提问上，可不是什么好事。换句话说，在这个会议上聚在一起的价值在于，不同人对结果的不同看法能带来意想不到的洞察，而演示者越能通过有原则、清晰的数据展示来促进这一点，效果就越好。每当出现意外发现或困惑时，考虑到会议的时间盒限制，我们发现让相关的\
  \ Scrum Master 安排一个后续会议是个好做法——这样既能从互动中获取价值，又能保持演示会议的整体流程继续进行。\n\n以下是一些关于演示最佳实践的说明：\n\
  \n*   **观众会阅读**^(¹⁵)：一旦你把内容放到屏幕上，不管你喜欢与否，人们都会去读它。他们阅读的速度会比你演示的速度快。你应该预料到他们会读得很快，以至于不会听你解释为什么它看起来不是那个意思。你唯一能控制的是演示的顺序——何时以及在屏幕上显示多少文字——以及内容的清晰度。如果无法在幻灯片中合理地实现清晰度，那么就要通过按顺序揭示信息来迫使观众集中注意力，以便你能为他们做好准备。\n\
  \n*   **标注坐标轴**：我们在小学就学过这一点，但并没有坚持做到。我们在这方面变得马虎的一个原因是，一些流行的数据处理和演示应用程序并不总是让这件事变得简单或显而易见。\n\
  \n*   **先展示成果，再说明过程**：演示的结构应该设计成随时可能被火警打断（同样，文档的结构应该设计成读者随时可能分心）。如果你只来得及讲完第一张幻灯片，那就要让它有价值——它应该把高层总结放在最突出的位置。一旦你让人们清楚了你所声称的内容，你就可以带他们踏上你如何得出这个结论的旅程。另一种情况是，你漫无目的地讲述一些过程，然后因为意识到时间不够而被打断，要求直接跳到结果。\n\
  \n*   **准备多用途使用**：你精心制作了一套带有精美动画和屏幕上诱人内容组合的演示文稿，并设计了演讲者的表演环节，结果却发现这套演示文稿在会议前就被打印在纸上分发给了副总裁们。现在他们感到困惑。至少，要意识到演示文稿是否会被当作文档来阅读，并据此进行设计——我们的演示会议文稿之后会被重新阅读，以便团队领导能够创建一份月度更新报告，向上级汇报团队进展。\n\
  \n### 别忘了测试颜色\n\n当 Matt 调出他精心设计、配色绝佳的幻灯片时，他的心沉了下去，因为他发现，在他笔记本电脑屏幕上看起来对比度均衡的内容，在演示时却显得褪色且几乎难以辨认。还要记住，很多人（每\
  \ 12 名男性中有 1 人，每 200 名女性中有 1 人）患有红绿色盲。色盲人士可以感知亮度的变化，所以请确保为不同的数值改变颜色和纹理的亮度，以使你的演示对他们可用。Wearecolorblind.com\
  \ 提供了更多让演示对色盲用户可访问的技巧。\n\n## 结论\n\n在第 6 章“有效沟通”中，我们通过深入探讨你作为敏捷数据工程团队会遇到的各种互动类型，阐述并对比了这一原则。这里的主要信息是，所有这些沟通都是一种技能——就像编写代码和深入研究特定的机器学习方法一样。与任何技能一样，除非它被承认并成为你个人工作和团队文化中有意为之的一部分，否则它无法被学习、维持或提高。\n\
  \n第 7 章“监控”将讨论遥测技术以及对遥测日志的挖掘如何能提供重要数据，这些数据关乎你的产品是否真的按预期工作、产品为何以及何时出现故障，以及你是否真正为客户提供了良好的体验。\n\
