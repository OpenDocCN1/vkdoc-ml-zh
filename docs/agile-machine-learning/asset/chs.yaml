  现在我们有了一个更有用的企业表示。我们正在更详细地思考所表示概念的*分解*。比较一下用字符串表示地址与用结构化对象分解构成地址的概念。字符串简单且通用，但不透明。结构化地址为客户带来了价值，但需要更多工作。当然，数据是混乱的。对地址世界的更深入审视揭示，并非所有地区都遵循欧洲和英联邦国家常见的以街道为中心的层级结构。例如，在日本，地址结构是基于街区的（地块编号、街区、城区）；在许多国家的农村地区，地址更像是供邮局解读的位置描述。这导致了一个两难境地——您是尝试为所有地址创建一个通用数据模型？还是采用一种回退策略，当您的结构化对象不足时，至少允许包含某种形式的表示？


  一种回退表示的方法是在数据结构中为层级中的任何节点允许文本表示。例如，在我们的地址中，更深一层的结构是将建筑编号、街道名称和街道类型捆绑到一个街道节点中。该节点可以有一个额外的属性来存储分解后的字符串版本。这将允许处理街道未被分解或不符合模型的情况，至少能有一些记录。类似地，模型中的顶层节点（整个地址）将有一个文本节点，可以保存整个地址的字符串形式。表
