- '# 7. 监控


  > *可工作的软件是衡量进度的首要标准。—— agilemanifesto.org/principles*


  在第 3 章：持续交付中，我们讨论了持续集成和持续部署等技术，这些技术确保新的可工作软件不仅频繁交付，而且持续交付。敏捷宣言的作者们在这条原则中明确指出，拥有实际可工作的软件远比拥有大量描述某个尚未充分集成到可运行状态的软件系统的文档更有价值。因此，在任何软件项目中，快速让软件运行起来，然后在增量添加功能的同时保持其运行至关重要。第
  1 章：早期交付中描述了一些实现此目标的技术。


  但我们认为，拥有可工作的软件虽然至关重要，却不足以衡量你的进度。如果你并不真正了解你的可工作软件在运行时在做什么——如果你没有将度量机制构建到你的可工作软件中——那么拥有可工作软件可能等同于那句谚语：森林里一棵树倒下，却无人听见。很可能软件正在以无人察觉的方式“倒下”。


  ## 监控可工作软件


  作为交付可工作软件开发流程的一部分，你应该制定一个计划，收集作为该可工作软件一部分的遥测数据。这些遥测数据不仅可以用来确保软件按承诺为用户正常工作，还可以指导未来功能的开发，并衡量你交付的产品是否真正满足了业务和客户的需求。你应该努力通过遥测数据回答四个问题。首先，软件是否真的按设计正确运行，还是出现了意外故障？其次，你向用户展示的数据有多准确？第三，你试图达成的业务目标是什么，能否衡量这些目标是否真的实现了？最后，你的用户有什么需求，你是否在衡量这些需求的满足情况？


  ### 监控与隐私


  我们建议，可工作软件的监控方式应能保护用户隐私。用户对此的需求日益增长，这反映在全球各地通过的法律法规中，例如《通用数据保护条例》（GDPR）。我们将在本章讨论一些可用于在尊重用户隐私的同时进行监控的机制。然而，未来在某些司法管辖区，即使是这种“隐私感知”的监控，也可能需要征得用户的同意。


  ### 示例系统：出发时间


  作为本章讨论的引子，我们简要描述一个埃里克在 Cortana 团队工作时开发的系统。该功能名为“出发时间”（TTL），集成在 iPhone 上的 Outlook
  移动客户端中。Apple Mail 和 Google Inbox 中也有类似功能。该功能的工作原理如下：如果你在日历上安排了一个会议，并为会议添加了可在地图上定位的地点，同时你与
  Outlook 移动客户端共享了位置数据，那么 TTL 会计算你当前位置与下一个会议地点之间的驾驶路线和驾驶时长，并在正确的出发时间通过手机提醒你，以便你能准时赴约。TTL
  会根据当前交通状况以及你当前位置与下一个会议地点之间的预计驾驶时间来完成此操作。因此，如果你在 3 点有一个会议，在当前交通状况下需要 20 分钟车程，TTL
  会在 2:30 提醒你最好出发前往下一个会议地点以准时到达，并向你显示前往会议地点的当前交通地图。如果会议地点很近，不需要很长的通勤时间，TTL 只会给你标准的即将开始的会议提醒，而不包含交通信息。


  该系统在 Outlook 移动客户端中有一些代码，但大部分业务逻辑和代码作为一组微服务在服务器上运行。它与存储在服务器上的日历数据交互，以获取可能包含需要跟踪地点的日历变更信息。它与必应的交通和路线规划系统交互，以获取即将召开的会议的当前交通状况信息。它与
  iPhone 上的通知服务交互，以便在正确的时间触发提醒。当用户在 Outlook 移动客户端中激活或停用该功能时，iPhone 应用还会与微服务交互，以开启或关闭该功能。


  对于任何应用程序来说，监控对于全面了解其是否按预期运行都至关重要，而在该项目中，由于系统涉及众多移动部件，监控尤其关键。此外，许多逻辑操作跨越多个执行层面——例如，要成功开启该功能，需要成功完成以下步骤：代码必须在手机上的
  Outlook 移动客户端中运行，用户必须同意向应用程序共享位置数据，服务器上的代码必须运行以开启该功能，服务器上必须启动额外的代码来扫描即将到来的日历事件以获取地点，并且必须开始运行代码来监听未来对会议的更改。




  ### 基于活动的监控


  “该出发了”系统包含数万行代码和数千个方法，分布在客户端代码和多个微服务中。我们是如何监控它的呢？


  我们采用了一种名为“基于活动的监控”的技术。首先，我们定义了大约 50 个活动类，它们代表了系统中重要的功能模块。以下是一些活动示例：


  *   `RegisterForTTL`：追踪用户注册以开始接收“该出发了”通知的行为。

  *   `UnregisterForTTL`：追踪用户关闭“该出发了”功能的行为。

  *   `StartTrackingEvent`：追踪系统开始监控一个带有地点的即将发生的事件，并计算其行程时间的行为。

  *   `StopTrackingEvent`：追踪一个正在被监控的、带有地点的事件被删除或不再具有可导航地点时的行为。

  *   `ProcessMeetingWhenUserLocationChanged`：追踪一个带有地点的事件其地点发生变更时的行为。

  *   `ChangeTransportationMode`：追踪 Outlook 移动端用户更改其常用出行方式偏好的行为——用户可以选择驾车路线，或者如果乘坐公交/火车则选择公共交通路线。

  *   `SendTTLNotification`：追踪“该出发了”通知被触发并发送给用户的行为。


  活动封装了系统中这些逻辑功能单元的执行过程。例如，一个名为“RegisterForTTL”的活动会从 iPhone 端发起，经过多个微服务处理，最后在微服务成功完成后回到
  iPhone 端。系统使用一个 TraceID 来追踪用户请求从手机出发，经过各个后端系统，再返回手机的完整路径——这个 TraceID 就是一个 GUID（全局唯一标识符，每个用户请求对应一个唯一字符串，看起来像“360C4783-E414-4CEC-A114-8513AA6A8CCE”），用于在整个系统中追踪该特定操作。在
  C#中，通过活动来封装一个操作看起来是这样的：


  ```

  Activities.RegisterForTTL.ExecuteAsync(async () =>

  {

  // 执行操作

  //

  return ...;

  });

  ```


  每个活动类都有其唯一的标识符，一个长名称（如`ChangeTransportationMode`）和一个较短的缩写名称（如`ChgTranMode`）。活动还可以嵌套。例如，`RegisterForTTL`（`RegForTTL`）活动内部可能嵌套了其他几个相关活动，这些活动在首次开启该功能时发生——`StartTrackingEvent`（`StTrkEvnt`）活动就是一个可能被嵌套的活动示例：当“该出发了”功能开启时，如果发现一个即将开始的会议带有地点，且时间临近、距离用户当前位置足够远，就需要开始追踪以确定何时提醒用户。当活动嵌套时，系统会使用较短的缩写名称来创建一个“活动向量”，用以表示活动的嵌套关系。例如，“RegForTTL
  > StTrkEvnt”表示`StartTrackingEvent`活动（`StTrkEvnt`）是在`RegisterForTTL`活动（`RegForTTL`）内部被调用的。这些活动向量会随着活动类记录的每条追踪信息一起输出。


  此外，我们微服务 API 中的每个 REST 入口点也都用活动进行了封装。这使得你可以追踪从服务器上调用 REST API 开始，到其成功（或失败）执行的整个过程。系统中大约还有另外
  25 个左右的入口点也使用了活动进行封装。


  随后，活动会将每个活动所封装的操作在执行过程中发生的事件记录到一个基于文本的日志系统中。活动会追踪以下事件：


  *   `ActivityStarted`：活动开始时，会输出一行日志，包含 TraceID、活动所在的微服务名称、活动缩写名称、当前的“活动向量”以及事件消息文本。例如，如果`StartTrackingEvent`发生，可能会输出如下一行日志：


  `16f25a17d5d13aa0ba726a19a0d9801a4 | CortanaTimeToLeaveService | StTrkEvnt | RegForTTL>StTrkEvnt
  | ActivityStarted: Attempt=1`


  活动向量使用活动缩写名称，提供了一个紧凑的逻辑调用栈，展示了端点活动内各种活动的嵌套关系。这有助于理解系统流程，并允许进行强大的分析，我们稍后会看到。正如你在消息文本中看到的，某些活动内置了重试机制，如果某次尝试因故失败，系统会自动尝试重新执行代码，重试次数也会记录在消息中。


  *   `ActivitySucceeded`：活动成功完成时，会输出一行日志，包含 TraceID、活动所在的微服务名称、活动缩写名称、当前的“活动向量”以及事件消息文本。例如，如果`StartTrackingEvent`成功完成，可能会输出如下一行日志：


  `16f25a17d5d13aa0ba726a19a0d9801a4 | CortanaTimeToLeaveService | StTrkEvnt | RegForTTL>StTrkEvnt
  | ActivitySucceeded: duration=330, Attempt=1`


  *   在此事件中，请注意活动的端到端持续时间被记录下来，从开始到完成，本例中耗时 330 微秒。


  *   `ActivityFailed`：如果活动因故失败，会输出一行日志，包含 TraceID、活动所在的微服务名称、活动缩写名称、当前的“活动向量”以及包含异常详情和错误信息的事件消息文本。例如，如果`StartTrackingEvent`在执行过程中抛出异常，可能会输出如下一行日志：


  `16f25a17d5d13aa0ba726a19a0d9801a4 | CortanaTimeToLeaveService | StTrkEvnt | RegForTTL>StTrkEvnt
  | ActivityFailed: duration=320, Attempt=1, Exception=Null Reference Exception in
  ‘register.cs’ line 239`


  在此事件中，请注意报告了错误详情，这有助于开发者理解系统中发生了什么问题以及问题发生的位置。


  *   除了上述三个基本事件（“ActivityStarted”、“ActivitySucceeded”和“ActivityFailed”）之外，还可以向追踪信息中输出自定义消息。这些消息将以相同的基本格式存储，包含关联
  ID、活动名称、活动向量和消息；但在此情况下，消息内容将是开发者定义的自定义日志消息。




  ### 用于分析追踪的 Azure Data Explorer


  真正让这个系统强大的是加入了 Azure Data Explorer。Azure Data Explorer 是一个日志分析云平台，针对半结构化文本日志的临时大数据查询进行了优化。系统中活动日志记录产生的所有日志都会被输入到
  Azure Data Explorer。借助 Azure Data Explorer，你可以对活动发出的整个日志集执行复杂的临时查询。例如，你可以通过如下查询，仅查看任意一组至少包含一层嵌套的活动日志：


  ![../images/473932_1_En_7_Chapter/473932_1_En_7_Figa_HTML.jpg](img/473932_1_En_7_Figa_HTML.jpg)


  你还可以使用 Azure Data Explorer 执行更复杂的聚合查询。在此示例中，我们使用 Azure Data Explorer 来确定系统中常见活动向量（GetStiCrts
  > UpdStiCrts）的性能特征。在这种情况下，Azure Data Explorer 利用我们在每个 ActivitySucceeded 事件的消息中一致地发出“duration=”这一事实，并使用其“summarize”功能来计算整个系统中该特定活动序列的性能百分位数（GetStiCrts
  与获取系统中某些所需证书有关）。


  ![../images/473932_1_En_7_Chapter/473932_1_En_7_Figb_HTML.jpg](img/473932_1_En_7_Figb_HTML.jpg)


  将基于活动的日志记录全面覆盖你的代码，并使用 Azure Data Explorer 分析这些日志，这两者结合是一个强大的组合，真正让你能够从多个维度衡量工作软件的进展。如果你还没有使用过
  Azure Data Explorer，请准备好迎接惊喜——它是一个极其强大的工具，当你开始意识到对监控数据进行特定查询和聚合查询的强大功能时，它将彻底重塑你衡量产品的方式。更多关于
  Azure Data Explorer 的信息，请访问 aka.ms/kdocs。


  ### Azure Data Explorer 与数据库的对比


  你可能想知道为什么要使用 Azure Data Explorer 而不是其他数据库。Azure Data Explorer 的优势在于对数 TB 的半结构化文本数据执行快速查询。你也可以考虑的其他类似产品包括
  Splunk、Logstash、InfluxDB 或 Elasticsearch。


  ## 监控能告诉你什么


  有了基于活动的监控和像 Azure Data Explorer 这样的系统来查询生成的日志数据，你现在可以真正地衡量你的产品了。以下是一些你应该深入探索并开始创建
  Azure Data Explorer 查询以分析产品的领域。


  ### 工作软件真的在工作吗？


  基于活动监控的一个直接好处是，你现在可以量化系统成功和失败的频率。当然，这取决于你的活动监控中是否存在错误或缺口，因此，请将其作为常规优先事项和持续集成流程的一部分，以确保基于活动的监控不会出现缺口，并且当系统添加新功能时，会定义新的活动来跟踪该功能。评估系统健康状况只需一个
  Azure Data Explorer 查询。你可以创建一个 Azure Data Explorer 查询，告诉你过去一天内活动失败的次数——类似这样：在此示例中，我们的基于活动的事件存储在一个名为“traceevent”的
  Azure Data Explorer 表中：


  ```

  traceevent

  | where EventInfo_Time > ago(1d)

  | where Message startswith "ActivityFailed"

  | count

  ```


  你可以通过类似的查询将其与成功活动的数量进行对比：


  ```

  traceevent

  | where EventInfo_Time > ago(1d)

  | where Message startswith "ActivitySucceeded"

  | count

  ```


  你可以通过如下查询深入分析单个失败及其原因：


  ```

  traceevent

  | where EventInfo_Time > ago(1d)

  | where Message startswith "ActivityFailed"

  | take 5

  ```


  ### 出了什么问题？


  你可以通过如下查询深入分析单个失败及其原因：


  ```

  traceevent

  | where EventInfo_Time > ago(1d)

  | where Message startswith "ActivityFailed"

  | take 5

  ```


  这将显示最近的五个失败。你可以从失败中获取 TraceID，并通过如下 Azure Data Explorer 查询查看会话期间发生的整个活动集：


  ```

  traceevent

  | where TraceID == "在此处粘贴失败的完整 TraceID"

  | project TraceID, ServiceID, ActivityName, ActivityVector, Message

  ```


  这将输出一整套带有活动向量的活动追踪信息，以便你可以探索失败发生之前的确切事件序列。


  ### 速度有多快？


  正如我们之前所见，你可以通过如下查询检查特定的活动向量或入口点，并查看大多数用户花费的时间：


  ```

  traceevent

  | where EventInfo_Time > ago(7d)

  | where ActivityVector == "RegForTTL > StTrkEvnt"

  | where message startswith "ActivitySucceeded"

  | extend duration = extract("ActivitySucceeded: Duration=(.*?),", 1, Message, typeof(int))

  | summarize percentiles(duration, 50, 75, 90, 95, 99) by bin(EventInfo_Time, 5m)

  ```


  你可以通过如下查询查看一组相对于其他活动花费时间特别长的活动（该查询观察到前一个查询中的最高时间在 500 毫秒范围内）：


  ```

  traceevent

  | where EventInfo_Time > ago(7d)

  | where ActivityVector == "RegForTTL > StTrkEvnt"

  | where message startswith "ActivitySucceeded"

  | extend duration = extract("ActivitySucceeded: Duration=(.*?),", 1, Message, typeof(int))

  | where duration > 500

  ```


  如果你怀疑较慢的时间是由特定问题引起的——例如，如果某个事件是重复事件，追踪该事件可能会更慢——你可以在日志记录中添加一条自定义消息，例如“RecurringEvent”，然后构建一个新的查询来查找它。请注意，这假设你的基于活动的日志记录实现在记录自定义事件时也会发出
  duration：


  ```

  traceevent

  | where EventInfo_Time > ago(7d)

  | where ActivityVector == "RegForTTL > StTrkEvnt"

  | where message startswith "RecurringEvent"

  | extend duration = extract("RecurringEvent: Duration=(.*?),", 1, Message, typeof(int))

  | where duration > 500

  ```




  ### 业务目标真的实现了吗？


  作为监控设计的一部分，你应该评估将追踪哪些业务指标来评估项目的成功。一个常用的业务指标是 MAU（月活跃用户）。在“Time To Leave”系统中，我们对
  MAU 的定义是：积极注册以接收通知的用户数量。事实证明，这个数字对业务来说意义不大，因为通过监控系统很快发现，开启该功能的用户数量远多于实际收到“Time To
  Leave”通知的用户。用户未收到通知的常见原因包括：他们在日历中为足够多的会议输入了地点、日历上的会议数量不多，或者所有会议都在他们当前所在位置附近。


  因此，定义第二个指标是一种良好的业务实践——即 MEU（发音像猫叫一样）。MEU 指的是月度活跃用户。定义这个指标的方法有很多，但在“Time To Leave”系统中，我们将活跃用户定义为在过去一个月内至少收到过一次系统会议提醒的用户。记录发送通知行为的活动被称为“SendTTLNotification”或“SendTTLNot”。查询上个月发送了多少条
  TTL 通知的语句如下：


  ```

  traceevent

  | where EventInfo_Time > ago(30d)

  | where ActivityVector == "SendTTLNotification"

  | where message startswith "ActivitySucceeded"

  | count

  ```


  当然，这个查询并不能衡量月度活跃用户，因为一个用户在一个月内可能收到多条通知。我们需要一个更高级的查询来确定收到通知的唯一用户数量。


  确定唯一用户数量开始涉及隐私领域——系统显然知道用户的唯一身份，但我们不希望将这些信息暴露在日志中，因为这可能向开发者泄露用户信息，而他们本不应能够通过 Azure
  Data Explorer 查询来确定任何单个用户的唯一或私人信息，例如电子邮件地址、会议名称或地点等。因此，为了识别用户，我们会使用一种单向哈希算法，根据系统可访问的用户唯一标识信息计算出一个唯一的用户
  ID 并存储。然后，这个身份哈希值可用于创建 Azure Data Explorer 查询，以确定一个月内的唯一用户数量，同时避免将任何个人身份信息泄露到日志系统中。


  ### 聚合与匿名化


  没有必要永久存储用户信息。在我们的系统中，我们会在大约 30 天后清除系统中关于用户的所有日志数据。我们会定期运行 Azure Data Explorer 查询，从当前可用的日志数据中存储关于关键业务指标和其他我们想追踪的用户指标的月度聚合数据，并长期保存这些聚合信息。


  ### 客户的需求真的被满足了吗？


  监控也是判断客户需求是否真正得到满足，以及如果未满足，原因何在的有效方法。通过监控和日志记录，我们能够确定许多用户使用“Time To Leave”功能的场景之一是他们有航班从机场出发。这让我们感到惊讶，因为我们从未特意为此做过任何优化。但我们发现，前往机场的提醒频繁触发，且对用户毫无用处——这些机场提醒的设置方式，导致用户在航班起飞前
  10 分钟才到达机场。


  当我们调查这类提醒为何如此频繁时，我们发现在一个相关系统中存在一个意想不到的倍增因素。Cortana 有一个系统，当检测到收件箱中有航班确认邮件时，会自动将航班会议添加到你的日历中。Cortana
  创建的航班会议会包含机场地址。于是我们明白了为什么人们日历上会有这么多这类会议，从而导致“Time To Leave”通知被触发。


  随后，我们与构建自动创建这些会议的推理系统的团队合作，以便我们能够识别这些会议为航班。然后，我们修改了系统，针对航班触发提醒，使用户能在航班起飞前 2 小时到达机场。


  ### 数据和模型是如何被使用的？


  考虑监控系统生成并呈现给客户的数据，以及在生产环境中运行的模型，也是很有用的。通过有效的监控，可以学到重要的东西。


  我们在必应本地数据团队收集到的一个出奇有用的数据是：我们记录了某个特定商家实际向用户展示的频率。我们会记录每次本地数据实体在搜索结果页面上显示、每次作为页面顶部答案显示、每次在地图中显示、每次显示本地数据实体的详细描述等情况。这让我们非常清楚地了解哪些商家实际上被我们的搜索引擎展示和呈现出来。密切监控商家被展示的频率，帮助我们追踪用户最关心的商家类型。我们能够确定哪些类型的商家被搜索得最多，并投资于这些类别。例如，我们有一个内部列表，列出了浏览次数最多的类别，并根据被搜索和展示最频繁的类别来决定我们的工作重点。我们还会追踪那些月度增长最快的类别。举个例子，这促使我们在某一年将“餐车”类别作为重点，当时该类别正在快速增长。


  监控哪些商家被展示以及展示频率，也帮助我们检测网站中的问题。我们可以逐月追踪系统中哪些实体获得了大量浏览，突然的变化会被标记出来进行审查。通过监控实体的展示次数，我们发现一个经常被浏览的实体——拉斯维加斯的一家赌场——突然从每月数万次浏览降为零。经过调查，我们发现我们的合并系统错误地将该赌场与一个名称相似的餐厅匹配，导致该赌场完全从系统中消失。我们还可以通过追踪可疑实体来检测系统滥用行为，这些实体从零浏览开始，然后每月积累数千次浏览。这些有时是提交给我们的欺诈性商家，它们通过了验证流程。


  通常，机器学习模型会在生产环境中运行，必须仔细监控其性能变化。典型的例子是用于检测欺诈的模型，其问题空间本身就内置了与外部恶意行为者的对抗关系。恶意行为者想要找到绕过欺诈检测模型并欺骗系统的方法。长期监控模型检测到的欺诈交易数量以及判定为无欺诈的交易数量非常重要。如果正常交易与欺诈交易的比例在几个月内发生显著变化，这不太可能是世界上的邪恶减少、欺诈消失的结果。更可能的是，恶意行为者找到了击败系统的新方法。受对抗性影响的模型需要被监控，并经常重新训练和增强。




  ## 结论


  在第七章“监控”中，我们讨论了如何利用基于活动的监控来真正衡量你的工作软件。我们会将这条敏捷原则改写为：“工作软件和数据的监控提供了衡量进展的主要标准。”我们探讨了基于活动的监控系统如何运作，以及它记录和追踪的内容。我们还介绍了
  Azure Data Explorer，它允许你对大量日志数据进行复杂的临时查询。我们审视了良好的监控能够揭示的各种信息：你的软件是否真的按预期运行、软件出现故障的原因和时间、用户实际体验到的系统性能、业务目标是否达成、客户需求是否得到满足，以及如何在生产环境中监控数据和机器学习模型。


  在第八章“可持续发展”中，我们将讨论如何判断你的工作节奏是过快还是过慢，以及如何调整节奏。我们还会探讨目标设定以及如何保持团队的高度参与感。


  '
- "# 8. 可持续发展\n\n> *敏捷流程倡导**可持续发展**。赞助方、开发者和用户应能无限期地保持恒定的节奏。*\n> \n> *——agilemanifesto.org/principles*\n\
  \nVentureBeat.com 记者 Alex Banayan 描述了微软必应执行副总裁陆奇：\n\n*陆奇（发音：chee loo）在上海郊区的一个村庄长大，那里没有自来水也没有电，他从未想过有一天自己会在全球最大的科技公司之一拥有一间角落办公室。作为微软在线服务部门的总裁，陆奇凭借同事们所称的“奇时间”实现了惊人的晋升之路。*\n\
  \n*“大学期间，我花在睡觉上的时间真的开始让我感到困扰，”陆奇向我解释道。“有那么多书可以读，有那么多东西可以学。感觉对人类来说，我们 20% 的时间（在睡眠中）被浪费了，因为你没有把这些时间投入到你关心的事情上。”*\n\
  \n*尽管他承认这并不容易，但陆奇通过一套不寻常的养生法——从定时冷水澡到每天跑三英里——将自己的身体调整到每晚只睡四小时也能正常运转的状态。*\n\n*受一种非同寻常的渴望驱使，陆奇的睡眠时间表每周额外增加了一天的工作时间，这相当于每年多出了近两个月的生产力。而他在大学期间就做到了这一点。*\n\
  \n作为必应本地化团队的一员，我们在陆奇的组织中工作，亲眼目睹了他长时间工作的惊人能力。同事们经常看到陆奇清晨、周末或节假日在大楼里跑步。最终，陆奇惊人的工作能力无疑给必应组织带来了一定的紧迫感和更长的工作日。组织上并没有期望任何人像陆奇那样长时间工作，但他长时间工作的能力确实催生了一种文化，即人们渴望工作超过基本的朝九晚五。\n\
  \n但比陆奇长时间工作更重要的，是试图“击败谷歌”的战斗口号，这可能是更主要的激励因素，自然驱使人们——尤其是那些有竞争心的人——工作更长时间。对技术的热爱和对所解决问题的着迷，也共同激发了恰到好处的参与感和紧迫感。\n\
  \n在我们工作过的其他团队中，我们目睹了相反的问题——缺乏紧迫感，人们似乎工作时间更短。在一个远程办公和 VPN 盛行的世界里，任何人都可以在一天中的任何时间工作，仅仅通过人们在办公室的时间来衡量工作的强度和数量是很困难的。但在紧迫感不高的团队中，导致这种可持续发展另一极端问题的常见原因包括：缺乏愿景、关于时间表和完成任务的期望沟通不畅，以及令人沮丧且缺乏回报的编程环境和开发者体验。\n\
  \n## 我们处于正确的可持续节奏吗？\n\n那么，如何判断团队的节奏是过快且不可持续，还是过慢但可持续呢？通常，判断团队处于不可持续节奏要容易得多。常见迹象不仅包括持续的长工作日和长工作周，还包括脾气暴躁、团队成员生病、决策质量下降、士气低落，以及宿命论与黑色幽默交织。\n\
  \n判断团队节奏过慢则更为棘手。常见迹象不仅包括持续的短工作日和短工作周，还包括脾气暴躁、团队成员生病、决策质量下降、士气低落，以及宿命论与黑色幽默交织。\n\n\
  是的，这不是笔误——可持续节奏和不可持续节奏的迹象往往相同。衡量你是否处于正确的可持续节奏的更好方法是，判断人们是否对工作充满投入和热情。投入和热情自然会催生相应的工作量。\n\
  \n微软每年进行一次民意调查，其中衡量的一项指标被称为“敬业度指数”。敬业度指数由几个部分组成，但热情程度是通过以下问题来衡量的：\n\n*   人们是否会超越日常的工作职责来帮助团队成功？\n\
  *   你是否在大多数日子里都兴奋地来上班？\n*   你是否将大部分时间花在真正喜欢的工作上？\n\n当团队从事他们感到兴奋和喜欢的工作时，他们保持的节奏将是可持续的。\n\
  \n\n\n### 适当放慢节奏\n\n不可持续的节奏往往源于强制命令或业务要求，这些要求只能通过长时间加班来达成。显然，你无法完全避免这类情况发生——但你可以努力消除强制命令和不合理要求。通常的做法是，更有效地向业务方沟通：在特定时间段内，哪些目标是合理且具有挑战性的，哪些则是无法实现的。真正理解软件增量开发的团队，会努力建立既有挑战性又可实现的、有意义的常规目标。\n\
  \n在机器学习项目中，整个团队（包括业务方）必须理解的一个难点是模型改进的速度。通常，在开发初期，模型会快速提升到某个特定水平。但一旦模型达到较高性能，后续的进步就会更加困难。将模型准确率从\
  \ 90%提升到 95%所需的成本，往往是将其从 70%提升到 90%的两倍。\n\n帮助业务方理解这一点的一个方法是，定期与他们一起回顾已发布模型测量指标的改进情况，并将这些改进绘制在时间线上。随着时间的推移，通过反复接触特定领域的进步速度，团队和业务方将对在给定时间内能期待多少改进建立信心。或许还会形成一些经验法则。\n\
  \n在必应（Bing）中，当我们在模型的精确率和召回率方面落后于谷歌时，我们逐渐形成了一条经验法则：通常可以在 6 个月内将差距缩小一半。如果改进模型的目标低于这个水平，我们就会努力提升目标。不幸的是，这条法则反过来也适用——在我们领先于谷歌的领域，他们通常也能在\
  \ 6 个月内将差距缩小一半。因此，在领先的领域，继续取得进步同样重要。\n\n另一条经验法则是：越接近 100%的精确率和 100%的召回率（显然不可能达到），就越要对在短时间内实现多点提升持怀疑态度。从\
  \ 97%精确率和 97%召回率提升到 98%精确率和 98%召回率并非不可能，但每个人都清醒地认识到，面对我们嘈杂的数据源，要获得这样一个百分点是多么具有挑战性。\n\
  \n### 演示可能很危险\n\n团队常犯的一个错误是，向业务方展示华丽但最终无法实现的演示，暗示原本需要数月才能完成的事情可以在数周内达成。在演示那些需要大量工作才能普遍适用于所有可能输入、或者需要很长时间才能达到性能、可扩展性、合规性或架构足够完善以转化为真正产品的功能时，务必非常小心。我们经常遇到这样的情况：一个半生不熟的演示向业务方传达了一个看似即将实现的功能，结果却发现需要数月甚至数年才能兑现演示中展示的承诺。\n\
  \n### 适当加快节奏\n\n我们在上一节中提到的所有内容同样适用于加快节奏。指标目标也可能不够激进。在某个目标明显低于经验法则的领域，团队会自我鞭策以提高目标。如果发现某个目标将在比预期更短的时间内实现，那么该目标就会在\
  \ 6 个月周期内向上调整。\n\n解决缺乏投入感的根本原因也很重要，这是节奏缓慢的核心问题。要深入探究为什么人们不愿意超越日常工作的职责来帮助团队取得成功。常见的原因可能是，人们觉得没有自主决策权，或者感觉自己被排除在团队决策和设计讨论之外。团队成员可能觉得他们没有参与目标设定过程。将自上而下的目标与自下而上的目标相结合，有助于提高团队的投入感。\n\
  \n如果团队中有相当一部分人报告说，他们大多数日子对上班并不感到兴奋，那么团队应该反思是什么导致了这种缺乏热情。是开发者体验吗？那就分配一些开发时间，专注于解决开发者体验中的问题，改进工具和流程。是人们不看好愿景吗？那就努力澄清并帮助人们看到团队试图实现的目标，以及它为何能对世界产生重大影响。有时你可能会发现，人们感兴趣的工作类型在你的领域内根本不存在——这是一个机会，可以鼓励人们去寻找他们能从事自己感兴趣工作的职位，同时招募那些对你的问题领域有天然亲和力和热情的新人。\n\
  \n偶尔的强制命令和更严格的要求也并非全是坏事。有时，一个艰难的最后期限，或者一项“必须完成否则业务将面临风险”的强制命令，可以帮助团队凝聚起来，形成一种“我们同舟共济”的心态。例如，微软和整个计算机行业在\
  \ 2018 年 5 月 25 日面临一个硬性截止日期，必须确保所有服务符合 GDPR（通用数据保护条例）要求。随着截止日期的临近，团队意识到要满足 GDPR\
  \ 指南还有多少工作要做，我们目睹了微软内部各个团队团结一致，迎接挑战。在那段时间里，尽管工作时间更长，但投入感反而增加了，因为人们真切地看到自己参与了一件有价值且值得自豪的事情——确保个人隐私免受大型科技公司的侵犯。\n\
  \n\n\n## 节奏变化的重要性\n\n即使是一支以可持续节奏运行的高绩效团队，也需要定期进行节奏变化。我们推荐两种做法来打破常规节奏，并频繁地做出改变。\n\
  \n第一种打破节奏的做法在敏捷开发中被称为“松弛周”。松弛周提供了一个机会，可以花上一周，也许两周的时间，让人们有机会去实现那些似乎总是为了达成里程碑和进度而被不断搁置的次要目标。松弛周期间的常见活动包括：投入更多时间改进开发流程和工具、减少产品中的技术债务、重构或重写产品中拖慢进度的有问题的部分，以及针对团队正在考虑使用的新技术进行培训和构建应用。我们通常会在团队本身就不满负荷的假期期间（七月和十二月）安排松弛周，然后在一年中再找几次时间，将松弛周插入到日程中。\n\
  \n当团队知道松弛周会定期到来时，他们就可以在待办事项列表中积攒一些专门为那个松弛周准备的工作项——这些工作似乎总是无法获得足够高的优先级被排入常规日程，但团队仍然认为值得去做。\n\
  \n在松弛周期间，我们通常会暂停第 4 章“与业务对齐”中描述的许多 Scrum 流程。我们仍然会举行每日站会，但其目的是为了改变节奏，让人们从“常规业务”中解脱出来。只要确保在开始下一个冲刺时，你能回到常规业务状态即可。\n\
  \n第二种改变节奏的做法是定期举办黑客马拉松。这些通常是持续时间较短的节奏变化——可能两到三天，每年重复三到四次。它们以另一种方式打破节奏——在黑客马拉松期间，鼓励团队去研究某个不同的问题领域或想法，但工作强度要比平时大得多。因此，如果说松弛周是放慢脚步的时间，那么黑客马拉松的重点则是加速，在短时间内对需要进行架构探索的领域取得大量进展，以判断团队是否应该在该方向上进一步投入。在黑客马拉松期间，团队通过设定更激进的目标来鼓励延长工作时间，但同时也有一个额外的期望：黑客马拉松期间完成的任何工作都是探索性的、低质量的、“黑客式的”，并且会在黑客马拉松结束后被丢弃（尽管黑客马拉松可能会产生一个新的产品创意或方向，之后会以更高质量的方式重新实现）。黑客马拉松是进行快速而粗糙的改变的绝佳机会，也许在这个过程中能发现重要的新产品方向，日后可以以更高质量的方式去追求。\n\
  \n对于黑客马拉松，团队基本上会在常规冲刺规划中思考他们感兴趣但认为风险较高的某个领域或功能。他们希望花一些高强度的时间来研究这个新方向。然后，他们会安排一个\
  \ 2 到 3 天的时间段，完全切换上下文到这个新方向，看看在这段时间内能以快速而粗糙的方式验证多少内容。\n\n一个团队半年的日程安排可能如下所示。这个日程交替安排了常规节奏的两周冲刺、节奏较慢的松弛周和节奏较快的黑客马拉松周：\n\
  \n*   松弛周\n*   四个两周冲刺\n*   半周黑客马拉松\n*   四个两周冲刺\n*   松弛周\n*   四个两周冲刺\n*   半周黑客马拉松\n\
  \n## 线上站点与可持续节奏\n\n最容易将团队从可持续节奏推向不可持续节奏，并最快导致倦怠的因素之一就是线上站点问题。当团队拼命试图找出产品在生产环境中无法正常工作的原因时，线上站点问题会扰乱睡眠和日程安排。\n\
  \n如果你有幸在一个没有线上站点组件的产品上工作，那么你可能无法理解这个话题。但在一个追求四个九可用性的 24 `×` 7 小时服务的世界里，线上站点问题可能导致团队崩溃。\n\
  \n我们将简要分享必应（Bing）在管理线上站点方面的一些最佳实践，以确保它不会导致团队节奏不可持续。\n\n在某些团队中，可能有一个较小的运维团队负责处理服务的所有线上站点问题。但在必应和许多其他在线工程组织中，让所有工程师亲眼目睹并排查线上站点可能出现的问题，是一个重要的学习机会，从长远来看，这有助于编写更好的代码和设计更好的架构。没有什么比凌晨\
  \ 2 点起床去修复由你签入的有缺陷代码或你曾认为可以扩展但在生产环境中却无法正常工作的架构所引起的问题，更能激励你下次找到更好的方法了。\n\n为此，工程师通常会参与一个轮值计划，他们在特定的一周内“待命”，并成为该周任何线上站点问题的第一响应人。通常，这个“待命”周之前会有一周作为“后备”支持当周待命的人。这使得待命开发者能够了解前一周发生的事情，这样当他们完全负责接下来一周的问题时，就能对网站上发生的事情有连续的了解，因为前一周的问题很容易再次发生或在接下来一周引发新的副作用。\n\
  \n待命开发者应该拥有大量可用的文档，说明如何排查、检测和解决系统各个部分的问题。诊断工具和使用它们的手册（playbooks）都已准备好，这样即使是团队中的新开发者也能遵循一套基本步骤来确定问题所在，如果不能找到根本原因，至少也能快速修复，使网站恢复到之前的功能状态。\n\
  \n在必应，我们还密切关注三个指标。第一个是**检测时间**。这衡量的是从线上站点出现问题到自动化系统或客户检测到它所需的时间。我们衡量的第二个指标是**介入时间**。这衡量的是从我们得知出现问题到有工程师开始介入排查问题所需的时间。我们衡量的最后一个指标是**缓解时间**。这衡量的是我们应用足够多的修复措施——有时是快速修复或回滚——以使问题得到解决所需的时间。\n\
  \n这三个指标——检测时间、介入时间和缓解时间——都会被监控并持续讨论，以找出缩短每个时间的新方法。每个季度都会设定目标来减少和改善这三个数字。为了缩短检测时间，我们通常会部署额外的监控，或者找到在潜在故障部署到线上站点之前就将其检测出来的新方法。在介入时间方面，我们通常会改进流程，确保正确的工程师能尽快接听电话。在缓解时间方面，我们设计了快速回滚或关闭生产环境中导致问题的新功能的新方法。\n\
  \n每周，对前一周发生的所有线上站点问题进行事后复盘，并尝试找出具体的对策以防止它们再次发生，这一点非常重要。这些措施可能包括架构变更、流程变更、更好的监控，以及为待命工程师提供更多文档等方方面面。\n\
  \n\n\n在事后复盘流程中，我们会根据客户影响以及检测/介入/缓解所需的高时长，优先按严重程度讨论线上事件。我们会进一步调查对客户的影响，以了解有多少用户受到该问题影响，以及该问题对网站用户体验的实际影响是什么。线上事件的根因将由工程团队确定。随后，需要修复的项目将被识别出来并进行跟踪，直至修复完成。\n\
  \n如果能够严格执行线上培训、工程师参与、文档编写、轮值、事后复盘以及修复项目的跟进，那么由持续线上事件带来的不可持续节奏就能大幅降低。这形成了一个良性循环，确保团队中的每个人都仔细思考他们所使用的代码和架构，从而最大限度地减少那些深夜电话。\n\
  \n## 可持续节奏与多地域开发\n\n可持续节奏面临的最后一个挑战领域是与多个地域的开发团队协作。如果设置得当，这可以是可持续的；但如果设置方式错误，则可能成为可持续性的噩梦。\n\
  \n在必应，我们与印度和中国的开发团队合作，这些团队所在的时区与西雅图的美国办公室截然不同。跨时区协作可能会让团队感到痛苦，并导致不可持续的快节奏和不健康的慢节奏。\n\
  \n不可持续的快节奏通常发生在存在“主团队”和“远程团队”概念的情况下，远程团队所做的一切都必须得到主团队的批准。这导致远程团队闲置等待他们想要开展的工作获得批准，而主团队则因需要在工作日的晚上或凌晨持续进行远程指导而感到不堪重负，陷入不可持续的节奏。\n\
  \n当然，解决方案是摒弃主团队和远程团队的概念。所有团队都应被授权完全拥有他们负责的领域，并能够在自己的工作时间做出所有决策。集成点可以通过接口设计来指定，并在不同团队所拥有的系统区域之间构建自然的信息和关注点传递点。\n\
  \n### 远程团队有助于实现更可持续的节奏\n\n位于多个地域的团队也有助于提高线上工程的可持续性。一个地域的团队可以在其白天时段负责线上运维，而另一个不同时区的团队则可以获得急需的休息。然后，团队可以交换职责，当太阳在他们所在的地域升起时，接手线上运维的责任。\n\
  \n## 结论\n\n在第 8 章“可持续开发”中，我们讨论了如何判断你的工作节奏是过快还是过慢，以及如何向下或向上调整节奏。我们会将这条敏捷原则重写为：“敏捷流程提倡**可持续开发**。赞助方、开发者和用户应能无限期地保持恒定的节奏，但偶尔上下调整节奏可以产生更好的结果。”我们讨论了如何设定目标，并确保目标既足够雄心勃勃又切实可行。我们讨论了团队参与度对于将节奏调整到合适水平的重要性。我们还讨论了在开发计划中内置节奏变化的重要性，例如通过宽松周来放慢节奏，以及通过黑客马拉松来加快节奏。我们还讨论了在管理线上问题和与多地域团队协作时，关于可持续节奏的特殊问题。\n\
  \n在第 9 章“技术卓越”中，我们将讨论对软件工程卓越性的投资如何能够优化开发人员生产力，同时最大化数据的价值。\n\n"
- '# 9. 技术卓越


  > ***持续关注*** *技术卓越和* ***良好设计能够增强敏捷性*** *。 — agilemanifesto.org/principles*


  当我们想到敏捷性时，我们想到的是高效移动的能力，以及在复杂多变的地形面前改变方向以追求特定目标的能力。尤塞恩·博尔特以 9.58 秒跑完 100 米令人印象深刻，但这并非敏捷性的体现。另一方面，莱昂内尔·梅西在防守球员的网格中穿梭，同时始终将足球控制在自己脚下，则更像是敏捷性的表现。^(¹⁶)
  敏捷性当然需要快速移动，但它也需要那些让我们能够不受干扰地做到这一点的行为（梅西不会鞋带松散地走上球场）；它需要灵活性或灵巧性，以便在保持稳定的同时操控环境或改变路线；它需要意识和清醒的头脑，能够实时解读变化的地形和环境，从而预见并调整，而不错过任何一步。


  许多开发者将追求快速进展与敏捷性的基本原则混为一谈。敏捷性是复合效率。它是低层级交互对流程和人员网络产生的影响。工程师所做的许多工作都应带来乘数效应。你编写一个测试，就能为每个使用你代码的开发者节省数小时调试下游系统中复杂错误的时间；你实现自动化部署，就能将发布更新的时间减少一个数量级；你启用持续集成，就能为每个克隆你代码的人省去调试构建过程的无数麻烦；你投资于设计，开发者就会将你的系统用于你未曾想象过的应用。


  当投资于效率并非直接通往发布代码的路径时，很难抽出时间和精力去做这件事。既然我们可以花几个小时复制粘贴数据，为什么还要构建一个标注工具？既然代码明显能工作，我为什么还要写测试，而不是直接进入下一个任务？我们认识到，这需要一点信念的飞跃——如果你既没有因为走捷径而吃过亏，也没有体验过将效率融入文化所带来的胜利，那么做出这种飞跃可能很难。


  在本章中，我们将探讨一系列场景，在这些场景中，关注技术卓越和良好设计将帮助你建立一种高效、持续开发和交付数据项目的文化。我们将首先说服你，对质量的投资有利于敏捷性，然后讨论对质量的投资对数据项目意味着什么。在此之前，先谈谈*持续关注*。这个术语实际上是一个信号，表明要让一个团队在这些行为上有所改进，需要付出努力、保持专注，并且少不了些许劝导。作为领导者，你必须不断寻找方法向你的团队证明，这些确实是值得去做的好事。作为开发者，你必须保持开放的心态，并愿意投资于那些前期需要付出成本，但日后会为你和你的团队带来回报的事情。




  ## 面向敏捷性的软件工程实践


  思考敏捷团队的一种方式是通过*开发者生产力*这一概念。你所采用的每一个工具、行为和流程，首要关注的都应是让每个人都能高效工作。当然，生产力本身并不足够——它需要聚焦和引导，但我们发现“以开发者生产力为优化目标”这句口号，作为通用指南既精炼又有效。如果你的团队从根本上无法高效地完成任务，那么，你永远也无法交付产品。如果你在管理一个团队，你需要持续思考，你是否在赋能并投资于团队完成任务的能力。


  当敏捷宣言的原则谈及技术卓越的作用时，它触及了工程学科的一个核心真理：所有的行动和决策都会通过团队和产品产生网络效应。好的行动是那些在通过网络级联传播时能产生正向乘数效应的行动。一个好的
  API 设计能让开发者更轻松、更安全地在其基础上进行构建；好的规划能让你更容易达成目标。


  让我们以单元测试为例来思考这些网络效应——这是通用软件工程中技术卓越的一个绝佳范例。单元测试不仅有助于提高个人的生产力，也有助于提升整个团队以及合作伙伴和协作者的生产力。在编写代码时，从测试开始（即实践测试驱动开发）能让开发者清晰地了解待计算函数的确切性质。在某个时刻，任何不清晰之处都可以反馈给团队其他成员或客户。开发者可以先思考成功的标准是什么。然后，编写代码就变成了满足测试要求的一项练习。这使工作模块化——测试成为了需求的体现。代码随后被提交进行某种形式的审查。审查者可以查看测试，了解函数应该做什么（他们也会审查测试，以确保其有意义且有用）。一旦代码被检入，它可能会被其他开发者使用、扩展或修改。由于测试已经就位，该开发者可以确信，其他使用这段代码的人得到了保护（如果他们的测试失败，则说明出了问题，函数的语义不再完整）。对测试的投入会为开发者、代码审查者、直属团队以及合作团队带来回报。


  乐趣不止于此——如果测试被广泛接受，那就意味着代码是*为测试而设计*的。如果代码是为测试而设计的，那么计算单元就会保持小巧和模块化——使其易于审查者和维护者理解；测试可以增强面向对象编程的抽象和封装；在进行重构时，一套完善的测试将有助于保证代码可能发生了变化，但功能得以保留。


  你有时会听到人们说：“是的，但你仍然可以写出糟糕的测试”或“测试会带来虚假的安全感。”这就像说，仅仅因为攀岩者系了安全带，他们仍然可能坠落。事实证明，攀岩者有充分的动力去确保他们的安全装备有效——那么软件工程师也应该有动力通过测试来确保他们的代码有效。编写好的测试，就像编写好的代码一样，是一项技能。那些拥抱它的人会发展这项技能，并帮助他们的同伴共同进步。


  我们可以通过技术卓越看到积极网络效应的其他领域包括：


  *   **持续集成**：当变更被提交审查时，它也应该触发一次构建。这次构建应包括运行仓库中的所有测试。这使得团队能够零成本地立即获得关于明显缺陷的反馈。持续集成是
  Azure DevOps 上的一项标准功能。


  *   **一键部署**：当你的代码被部署到多个目标（生产服务、测试工具、应用程序）时，如果每个步骤都是手动的，发布就会变得繁琐。每当团队面临需要执行的单调任务时，他们就会找其他事情做。结果是发布不一致且容易出错——你的测试工具中的代码版本与当前生产环境中运行的版本不同。为你的团队提供一个能自动化整个流程（包括验证测试）的按钮是一个巨大的胜利。


  *   **代码卫生**：实践良好代码卫生的团队会避免复制代码，投入于打包，避免检入二进制文件，避免检入自动生成的类，一致地遵循编码风格指南，编写注释等等。这些好处中的许多都需要前期成本——但一旦你开始受益于其结果，这笔首付就微不足道了。


  这些技术在第 3 章“持续交付”中有更详细的讨论。总之，通用软件开发中的技术卓越通过消除摩擦点，有助于最大化开发者的生产力。


  原则 9 的第二条涉及良好的设计。技术卓越或许很容易规定。但什么是良好的设计？关于这个主题已有大量著述，通常被提炼为不同的原则或原则组：SOLID 原则（归功于
  Robert C. Martin）、KISS 原则（归功于美国海军）和爱因斯坦原则（“一切都应尽可能简单，但不能过于简单”）。这些通常辅以流程指导原则，例如构建零特性发布或确立最小可行产品。根据我们的经验，确立团队对某些工程实践的态度确实能有所帮助。


  首先是关于编程语言的态度。一方面，你可以固定使用某种语言，以便所有开发者共享一个共同参考点。这使得代码审查、测试和协作更加容易。另一个极端是语言完全灵活。这允许为工作选择更合适的工具，但缺点是专业知识的集中度较低。在必应的本地数据团队中，我们通常决定坚持使用面向对象编程，特别是
  C#，同时利用其他系统进行脚本编写和一些非生产代码。面向对象编程提供了一个引人注目的框架，它足够灵活，可以对数据和流程进行建模，但通过一些纪律约束，它也可以被充分限制，以通过成熟的模式来指导设计。面向对象设计的核心原则是抽象、封装、继承和多态。每个设计和代码审查都可以根据这些原则进行检查，团队可以将其作为讨论的框架进行分享。还有其他选项需要考虑——函数式编程正在经历某种复兴，而像
  Python 所支持的那种结构化程度较低的编码风格也很流行。


  其次是团队对设计的态度。在我们的网络挖掘团队中，我们提出了一个说法：*除非是设计审查，否则代码审查就不是设计审查*。这意味着，如果你没有为你的功能进行设计审查，那么你就只能任由审查者摆布，他们可能会因为设计质量问题（而非代码质量问题）而阻碍代码审查。




  第三点是承诺采用特定的操作范式。这与团队对编程语言的态度类似，但涉及分布式计算和存储的选择，并且在很大程度上取决于你所处的系统环境。例如，如果你的公司围绕 MapReduce
  构建了庞大的专有基础设施，那么你很可能需要按照该范式进行设计。另一方面，如果你身处面向服务的文化中，那么你的解决方案将截然不同。虽然一种方法可能优于另一种，但有两件事需要牢记。首先，确保你的核心计算资产构建在不依赖于操作范式的库中；其次，将对操作范式的优化与对核心功能的优化分离开来。这样，当不可避免的范式切换发生时，你就能灵活应对，而无需承担任何重大的前期成本。


  ### 保持开放，但做出承诺


  关于编码和平台，几乎有数不清的选择，优秀的开发人员和管理者需要随着技术发展而了解这些领域。然而，如果团队希望有所交付，就必须做出决策和承诺。对这些选项视而不见是不可取的——事实上，技术负责人和管理者应该持续探索并保持与时俱进；但不断转向可能更好的方案也同样愚蠢。项目启动阶段是审视选项和进行实验的好时机，而架构模块化和决策延迟则是帮助团队保持开放的良好实践。


  ## 数据项目的技术卓越性


  考虑开发人员生产力以及优秀（和糟糕）贡献的网络效应，让我们大致了解了技术卓越性在通用软件工程中的作用。这如何转化为数据项目中的数据方面呢？我们对网络效应的讨论解释了技术卓越性为何重要。在数据项目方面，与“优化开发人员生产力”相对应的是“最大化数据资产的价值”。让我们来分解一下。


  随着数据项目的推进，我们会生成许多数据资产。这些资产包括模式、样本、标注数据、模型、分析结果（例如，模型在测试集上的性能）、比较结果等等。数据的价值可以从两个方面来考虑：即时价值和长期价值。即时价值是其被创建的原因——它解决问题、提供知识或以某种方式推动项目前进。例如，标注数据集通过允许我们训练模型来提供价值，如果模型可接受，则可以将其部署到生产环境。然而，长期价值是我们之后从数据中获取的价值。这可能是计划内的，也可能是计划外的。计划内的长期价值，例如，持续使用一个真实数据集作为某个指标的基准。计划外的长期价值描述了我们意外获得的价值。例如，当我们使用新的测试集（旧模型创建时不可用）与新方法进行比较时，可能会从旧模型中受益。我们可能希望应用一种新方法来清理旧标签集上的标签，看看它是否能改进最初生成的模型。价值也存在于我们用来处理和检查数据的系统和工具中，例如，采样脚本、自定义标注和数据浏览工具，以及数据清理工作流。


  也许令人惊讶的是，数据项目在确保数据的计划内长期价值方面投入不足，更不用说投资于计划外价值的潜力了。


  ### 你衡量什么，你就是什么


  如果你正在处理一个相当有趣的问题，你很可能有一个包含多个阶段的流水线或其他形式的工作流程。数据可以在流水线的多个点进行采集。在涉及指标时，明确你在衡量什么非常重要。如果你正在报告合作伙伴或客户团队将依赖的官方指标，这一点尤其重要。至关重要的是，你必须清楚你的*数据产品*是什么，并且只衡量它。


  离线数据流水线的一个常见模型，也是我们在必应本地搜索产品中采用的模型，是交付一个 XML 产品。使用 XML 是因为它的普遍性（任何平台都可以消费它）、它的标准（关于什么是正确的
  XML 几乎没有歧义）以及它相当好的人类可读性。^(¹⁷) 这种 XML 格式是我们采样的来源，也是我们测量系统中使用的格式。该系统的许多消费者需要不同格式的数据——尤其是那些对空间（XML
  很冗长）和计算性能有明确要求的消费者。对于这些客户，要么他们自己编写数据转换，要么我们提供转换。最终的序列化形式是可以经过严格测试的，以确保它不会以任何方式破坏你基于生产指标所做的声明。这意味着测量系统从系统中一个定义明确的瓶颈点拉取数据，你所有数据视图都源自该点。


  通过这种设置，你还可以构建验证流程，该流程获取任何输入的数据产品输出，并验证你可能为用户提供的其他版本的数据。例如，你可以获取 XML 文档的字段，并检查它们是否在你节省空间的二进制序列化形式中得到保留。


  有很多原因可能会诱使你采用数据的其他视图。由于你的架构，在数据写入瓶颈阶段之前采集数据可能更简单；用户消费数据的形式可能与现有的测量流水线配合不佳；或者输出格式已更改，而你的测量系统是为消费旧格式而构建的，并且缺乏重新定位到新格式的灵活性。无论原因是什么，你都应该不惜一切代价抵制这种诱惑。如果你不衡量一个定义明确的产品，而是做其他任何事情，你就有可能因为某个转换引入了变化，从而导致你的指标不正确。图
  9-1 说明了这些不同的测量场景。


  ![../images/473932_1_En_9_Chapter/473932_1_En_9_Fig1_HTML.png](img/473932_1_En_9_Fig1_HTML.png)


  图 9-1


  衡量这个，而不是那个——在上图中，系统产生一个单一的数据产品，这是衡量质量的可靠位置。不应在数据产品之前的阶段，也不应从不同的、特定于客户端的数据产品视图中衡量质量。在下图中，产生了两个不同的数据产品，没有单一的工件，因此无法进行可靠的测量。




  ### 避免无意的数据转换^(¹⁸)


  当数据在系统中流转时，会经历一次或多次转换。顾名思义，有意转换正是你希望系统执行的那些操作，它们能增加数据价值。而无意的转换则会对数据产生实质性影响，这些影响要么不为人知，要么与你原有的假设不符。这类问题可能出现在多个环节，但最常见的两个场景是数据序列化和数据标注。在序列化数据时，我们需要将其从内存格式转换为磁盘（或流）格式。若不加注意，错误就可能在此处悄然滋生——编码错误（针对文本数据）、数据结构丢失（例如将树形结构转换为线性形式）、图像色彩深度降低等。


  在标注数据时，我们需要以某种方式向用户展示数据。这可能涉及某种形式的序列化，但转换也可能发生在标注工具甚至标注员使用的显示设备中。网页数据标注因这类问题而臭名昭著。当浏览器从
  URL 下载字节、应用关联的 CSS 样式并执行页面上的 JavaScript 时，网页才会呈现给用户。所有这些操作都可能显著改变数据，因此当我们保存网页数据时，必须竭尽全力确保其以能够准确还原的格式持久化存储。


  另一种思考这个问题的方式是：你的数据产品主要应为你自己设计，而非你的客户。考虑到我们普遍对客户的重视，这听起来可能有些反直觉。客户消费的是数据产品的特定视图和序列化形式。你的数据产品需要兼顾开发团队的需求——将其转换为客户所需的形式应作为最后一步的简单且经过充分测试的环节。因此，卓越的度量意味着：度量你所产出的内容，并确保下游的最终序列化过程不会改变你的数据。


  我们已经讨论了系统输出的细节及其与度量过程的关系。现在让我们从度量的角度来谈谈输入。要求标注系统的输入与处理流程的输入完全一致，这似乎是直观的。这能为所有组件带来某种一致性。然而，当人类对数据进行评判或标注时，存在合理的原因使得他们看到的数据视图可能与系统输入不同。想象一个负责图像分类的推理管道。分类器需要判断图像中是否包含美洲狮。由于该系统将部署在众多低成本数码相机上，预算限制要求所有相机必须为黑白模式。在开发用于创建标注数据的评判工具时，你发现由于缺乏色彩，评判员难以对图像进行分类。为了改进标注数据的创建流程，向评判员展示更丰富的彩色图像是合理的。


  ### 在构建度量指标的同时开发模型


  恭喜！你提出的项目已获得资助，你即将与你的小团队开始交付工作。你们有 4 周时间从零开始实现首次上线部署。目前你们没有任何度量指标。你估算了定义指标、实现工具、培训评判员以及将开发集集成到内部循环所需的时间，发现大约需要
  3 周。这意味着你将没有时间以理想的指标驱动方式处理推理组件。你会怎么做？


  即使对于已建立某种度量框架的团队，开发新指标也可能需要时间。被度量的概念需要在为评判员编写指南、培训他们、审查他们的输出以及调整指南以应对新出现的歧义或困惑之间进行多次迭代。虽然应始终优先采用指标驱动的方法，但你会发现团队常常不得不在没有指标的情况下开始工作。


  应对项目这一阶段的诀窍在于依赖这样一个事实：主要问题（即推理问题中值得解决的挑战）应该能在小样本数据中被观察到。这意味着开发人员可以花一两个小时手动标注数据，以找到极有可能影响最终指标改进方向。如果系统输出中有
  20%存在特定问题，你应该有信心通过检查几百个样本就能观察到这一点。




  ### 为推理系统编写测试


  在开发机器学习模型以使用相同评估数据提供某种形式的推理时，我们会生成任意数量的候选模型。随着这些模型在精确率和召回率方面逐步达到可接受的性能，其输出也会出现变化。评估集中的许多示例会产生相同的结果（这些是模型已捕获的较简单案例）。然而，净改进也会导致一些边际退化，即原本正确的结果会变为错误。系统的不同版本也是如此——我们通常追求净改进，并对先前正确结果的退化做出判断。对于程序化系统，除非所实现函数的语义发生变化，否则我们不会预期在进展过程中看到测试失败，除非出现了真正的错误。但是，如果我们以相同的方式测试推理系统（给定输入，期望始终得到相同输出），我们将面临测试在通过和失败之间反复切换的问题。让我们来梳理一个典型的推理流程，并探讨如何为其编写测试。


  一个显而易见的起点是特征生成阶段。^(¹⁹) 为输入计算特征是编写测试的典型场景。每个被计算的特征都应被测试，包括输入中不存在该特征的情况。最糟糕的情况莫过于在已部署系统中发现特征计算错误，结果却发现修复特征——这只会影响运行时推理，而不会影响用于构建已部署模型的训练数据——反而导致了性能退化。


  你还应确保训练期间和运行时推理期间生成特征的代码路径完全相同。当然，这可以在代码层面强制执行——实际上应该使用完全相同的代码。无论能否强制执行，都可以通过测试来检查一致性。测试一致性虽然不能做到穷尽，但相对容易实现：只需获取文档，分别通过训练和测试中的特征化流程，然后简单测试它们是否相同。这种测试方法在测试其他形式的一致性（如序列化/反序列化一致性）时也非常有用。值得指出的是，要做到这一点，我们需要建立在基本的工程卓越实践之上——编写并测试对象之间的相等性。有了正确实现并维护的相等性实现，在任何场景下编写一致性测试都变得几乎微不足道——只需生成两个对象并测试它们是否相等。实现（并测试）特征的序列化对于流程的整体设计也至关重要，我们稍后会看到这一点。


  现在，我们面临为系统中的特定推理编写测试的挑战。正如我们上面讨论的，代码中部署的模型会随时间变化；虽然数据集中越来越大的核心部分会享有稳定的预测，但随着你持续交付净改进，边际部分会出现波动。例如，如果我们正在构建一个人名提取器，那么即使你之前版本的模型能够做到，当前最佳模型可能不再能找出文档
  A 中的所有十个人名。此外，你正在测试的组件可能构建在其他组件之上。例如，你的人名提取器可能在你开发的另一个子系统之后运行，该子系统用于识别网页中的主要内容（并丢弃导航、横幅、页脚及其他无关内容）。这个子系统也可能基于统计方法，表现出同样类型的净增益进展。


  针对这种情况，有几种测试策略。首先，构建一个独立的回归测试框架，允许你运行不同模型、比较输出并检查它们。这不应成为单元测试套件的一部分，因为它们不是单元测试，而是长时间运行的测试，应避免在内部循环中使用。其次，整个推理流程中的不同模块应被隔离。在测试中，不要将模块
  A 的输出作为模块 B 的输入，而应将模块 A 的理想输出作为模块 B 的输入。换句话说，你是在假设模块 A 提供了完美输出的前提下测试模块 B 的性能。第三，你应该为特定版本的模型编写测试。与其为人名提取器编写测试，不如为人名提取器的第
  3 版编写测试。这确保了测试是确定性的，并且始终以相同方式运行。如果推理系统的实现发生了根本性变化，测试会失败；但不会因为你通过净改进提升了产品而导致测试的特定案例出现退化而失败。


  我们将测试视为固定墙上那幅形状奇特的大图的图钉。钉入一个图钉，固定一个自由度。再钉入一个，确保形状的一个边角固定在墙上。钉入的图钉越多，图片受到的约束就越多，直到有足够多的图钉保证图片精确地停留在期望的位置。最好的测试是那些以完全出乎意料的方式失败，从而提醒你注意未曾预料到的代码路径和输入场景的测试。




  ### 自定义标注工具


  标注工具是人类用来创建训练和评估系统数据集的应用。它们提供数据的视图以及一些控件，允许用户输入或编辑某种元数据。一个简单的例子：如果你正在为图像构建一个二元分类器，那么该工具可能会显示图像，并提供一个按钮或设置一个按键来捕获正面或负面的判断。我们将标注工具纳入本章关于技术与设计卓越性的讨论中，因为理解这些工具的目的、呈现的保真度以及标注的创建方式，对于你整体产品的质量至关重要。让我们来详细分析一下。


  查看数据可能看起来是整个难题中简单的一部分。你处理的是图像，就需要查看图像；你处理的是网页，就需要查看网页。但深入思考向人类呈现数据时的考量因素是值得的。


  首先，你向评判者展示的内容是否与你的系统所“看到”的内容相同？当然，在处理网页数据时，很容易最终向评判者展示的内容与机器“看到”的内容大相径庭。如果你将网页的
  HTML 字节保存到磁盘，然后在稍后的日期打开它们，你的浏览器将开始拉取额外的信息流来渲染页面。这可能像决定页面上元素字体大小、颜色等的 CSS 样式信息一样简单。也可能是页面上使用的图像。也许你正在查看一个与新闻相关的页面，并且有一个横幅小部件在页面主要内容上方拉取最新头条。此外，每当使用额外数据来改变页面的外观和内容时，这些数据有可能不再存在，从而导致意外的布局、图像缺失等问题。


  其中一些呈现缺陷可能无关紧要。但假设你正在构建一个分类器来判断一个页面是否为“垃圾页面”。如果垃圾内容不再可供用户查看，那么它就不会被看到，因此就无法准确做出判断。


  在处理某种方式受限的 HTML 数据时，我们见过一些此类问题更极端的案例。例如，你的数据采集系统可能可以访问托管在特定环境中的服务器；但是当你在本地查看同一个
  URL 时，由于个人用户的权限不同，页面的内容可能会被完全或部分屏蔽。


  这些网页示例说明了潜在的陷阱，即向评判者展示的对象可能与系统所看到的对象不同。我们也可以找到人类和机器会看到数据转换的例子。图像处理系统非常常见的一种做法是，由于训练和推理系统的容量要求，将图像转换为通用的、较低分辨率的版本。在这些情况下，你可以选择向评判者展示原始源图像，还是机器将看到的缩小后的较小图像。


  ### 存储与版本化管理训练和评估数据


  有两种类型的标注数据——现有流程产生的丰富结果（例如，搜索引擎中导致点击——成功——或未点击——失败的查询）以及人工评判的类别。前者是免费可用的，但后者需要花费时间和金钱。当快速工作时（不要与敏捷混淆），很容易完成你的分类器，展示其有效性，满足客户需求，然后转向其他任务，从而避免了持久化数据的开销。当需要更新模型时，数据的位置和来源就丢失了。与敏捷世界中的许多流程一样，解决这个问题——这种价值损失——的方法在于建立正确的行为、流程和工具链，这些可以在*开发过程中*使用。这意味着在任务结束时——当你的模型在指标上显示出那些净收益时——没有额外的工作；一切都已经处理好了。


  管理数据集的主要考量如下：


  *   **总体**：总体是否是一个不可变的对象集合？任何替代方案都意味着你面临样本之间高变异性的风险。假设你有一个不断变化的商店——任何时候你抽取一个样本，该样本的性质都会改变。如果这是有意为之，那很好——也许你每个月都在构建一个新的指标集。但如果是无意的，那么你最终会对样本的等价性做出假设。


  *   **样本**：你可以通过引用来抽样——在这种情况下，你创建一个指向总体中对象的引用列表——或者通过值来抽样，在这种情况下，你复制对象数据。每种方法都有利弊。如果你通过引用抽样，那么你确保数据点只有一个唯一的版本——即总体集中的那个。如果你通过值抽样，那么你就创建了数据的副本，这使你免受总体数据集可能存在的任何持久性问题的影响。但现在你造成了一种情况，即两个对象可能由于某种原因而出现分歧。


  *   **标签的版本**：当为评估或训练和开发目的标注数据时，你会希望重新审视并修正标签。保留标注数据的版本非常重要。为什么？敏捷关乎进步，而进步的效率需要能够衡量实验之间的差异。任何跟踪项目的人都很自然地会要求进行可量化的比较，而且你肯定会基于最新一轮的标签为模型提出几个版本前未曾想到的新问题。


  有几种实用的方法来管理数据集。对于较大体量的数据，一个基本策略是拥有某种形式的存储来管理你的总体，然后在用于处理代码的同一基础设施中处理较小的数据覆盖层——代表样本的总体子集引用、与数据对象关联的标签。Git
  LFS（大文件存储）是遵循此模型的解决方案的一个例子。基本工作流程是将你的数据集存储在大文件仓库中。Git LFS 将数据的引用放在主仓库中，以便 Git 交互无缝进行。现在，一个样本可以通过对
  Git 中对象的引用和标签文件（例如，引用数据对象并序列化某些标签信息的文本文件）来定义，并以与代码完全相同的方式进行处理。




  ### 管理模型


  在开发过程中，以及随着产品的持续改进，团队会生成许多模型以及推断相同输出的多个模型版本。例如，当您发布产品时，可能已经确定了蒸汽机名称提取器的第 7 版。随着进展，您可能会创建第
  8、9、10 版，并在下一次发布时达到第 11 版。同样，您可能会意识到针对特定任务所采用的方法并不理想，并希望在下一轮实验和发布中使用不同类型的模型。


  在管理模型时，您有两种选择：可以覆盖它们，也可以检入可在代码中引用的模型显式实例。例如，如果您将名称提取器封装在类 `SteamEngineNameExtractor`
  中，覆盖方法会在每次模型迭代时简单地重构此类。另一方面，显式方法会为每个版本创建一个类：`SteamEngineNameExtractorV3`、`SteamEngineNameExtractorV4`，依此类推。后一种方法允许您随时在不同版本之间显式运行对比实验，从而实现持续的对比指标以及针对不同数据集的按需比较。


  ### 在工具链内尽可能多地计算


  我们在数据项目背景下所做的一切都可以概括为：


  `inputData + (process + parameters)` → `outputData.`


  训练是：


  `labeledData + (trainingAlgorithm + trainingParameters)` → `model.`


  推断是：


  `inputData + (modelRuntime + model)` → `prediction.`


  考虑到这一点，我们需要做出选择：流程中有多少部分在工具链之外运行，又有多少部分在工具链内部运行？例如，我们可以在构建框架之外训练模型并检入参数。如果我们的训练范式涉及大型数据集、大量机器和大量时间，那么这样做是非常合理的。然而，如果我们处理的是涉及相对较小数据集和较短训练时间的训练系统，那么在构建时训练模型则具有优势。从根本上说，这确保了我们的所有系统都是一致的。它保证了不存在只有个别开发人员知道、且完成模型训练所必需的代码片段。我们可以使用仅保存在本地机器上的脚本来汇总指标；或者，我们可以将该脚本检入、进行代码审查和测试。更好的是，我们可以让评估脚本在每次检入时执行，或者设置为每天自动运行。我们将越多的代码纳入流程，效率就越高；代码被执行的次数越多，就越有可能发现问题并加以纠正。


  ## 数据项目的良好设计


  我们已经讨论了数据项目的技术卓越性，现在让我们转向良好设计，特别是模式设计——如何表示系统的输入和输出。如果您正在构建一个用于分析 PDF 文档以提供逻辑文档结构的系统，输入是什么——仅仅是
  PDF 吗？输出又是什么——如何为您的文档设计合适的数据模型？如果您正在构建一个从网页中提取企业名称的系统，您如何表示 URL 末尾的数据，又如何传递页面上找到的企业名称？


  我们从终点开始——企业记录的正确模式是什么？表 9-1 显示了一个起点，即一组简单的基于字符串的属性。这最初看起来合理，但让我们考虑一下其中所做的一些假设。首先，我们将地址表示为字符串。这带来了许多问题。地址具有相当明确的结构。通过将其表示为字符串，我们将解析结构的任务转嫁给了消费者。我们对地址有三个不同的需求——向用户显示、为搜索场景建立索引、以及针对替代形式和整个数据集进行推理。显示地址似乎是一个字符串完全足够的场景。但是，当您的用户体验团队希望确保在显示组件中保证某些规范化时，您会意识到，即使对于这个简单的场景，一些内部结构也是更可取的。否则，您就是在要求用户体验团队开发规范化这些字符串所需的领域知识——而该领域知识恰恰定义了您团队的价值！


  表 9-1


  一个简单的企业模式


