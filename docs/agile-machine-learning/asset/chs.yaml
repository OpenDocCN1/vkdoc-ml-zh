  ### 开放图表示


  一种能够对结构化但未知模式进行建模的方法是采用开放图表示，其中关系（或组成部分）的名称最初未定义，仅以字符串形式表示。这种方法的缺点是无法在编译时进行类型检查，但优点在于能够表示没有先验已知模式的结构化数据。


  ### 数据模型中的指称与同一性


  讨论数据建模会引向同一性的概念。我们如何判断两条记录在现实世界中指代的是同一事物？要回答这个问题，我们首先需要明确定义所表示的概念。我们的示例记录指代的是什么？这类问题很容易陷入过度哲学化的讨论。因此，让我们从一个练习开始。思考一下，作为人类，我们是如何谈论商业实体的。我们可能会说：“你应该去埃里克和马特的游戏店看看。”你可能会回答：“它在哪？”此时，你已经暗示了这家店与其位置是独立的。它可以在任何地方（因此位置并不能定义它）。这让我们意识到，**企业**
  *运营* 于某个**地点**，或依托于某个地点。但这是否总是成立？如果我们说：“你去过我最喜欢的星巴克吗？”你可能会回答：“是哪一家？”答案显然会是一个具体位置。我们在这里偶然发现的，是像连锁店或特许经营这样的聚合概念，与像埃里克和马特的游戏店这样的“单一”企业之间的区别。


  事实证明，这种审视可以带来关于如何表示领域核心概念的根本性见解。我们的本地搜索系统，由于历史原因，采用了如表 9-2 所示的相对扁平的结构。随着项目变得越来越复杂，我们发现了各种概念：


  *   单一企业：只有一个地点的企业

  *   企业集团：由共同所有者拥有的、相互区分的业务集合——主要例子是餐饮集团，其中一家公司同时拥有寿司店、牛排馆、海鲜餐厅等

  *   连锁店：拥有多个地点，每个地点提供相同服务或体验的企业（你期望在任何一家麦当劳餐厅都能吃到同样的汉堡）

  *   特许经营店

  *   合作社

  *   复杂实体：大学、医院、机场、政府等


  我们面临的最大挑战，并非理解这些概念的结构，甚至也不是寻找能够以某种方式填充模型所需丰富结构的数据源。真正的挑战在于，能否将我们的模式从最初的简单格式，迁移到能够表示不断演化的模型丰富性的结构。


  在丰富模型时，我们最终采用的策略是，将底层的简单企业表示视为一种基础类型，然后通过两种方式增加复杂性：一是在模型中添加新属性，二是创建额外模型来捕获概念空间的新部分，这些新模型可以引用表示中的其他部分。例如，在之前展示的简单模式中添加一个新字段来表示企业类别，是相对直接的。在处理连锁店时，我们创建了一个新的概念空间——连锁品牌。其模式如表
  9-4 所示。


  表 9-4


  连锁品牌模式


  | 属性 |   | 示例 |

  | --- | --- | --- |

  | 名称 | 字符串 | 乔什的波奇碗店 |

  | 地点 | 引用数组 | [1, 88, 421] |

  | 公司电话 | 电话号码 | 206 555 9943 |


  ### 表示歧义


  当然，我们对数据唯一确定的事情就是它包含错误。你会遇到某些数据源的代理信誓旦旦地宣称他们的数据没有错误——不要相信他们。我们发现，即使是企业自身，也可能没有关于自己的准确信息。连锁店会在其活跃门店数据库中包含已关闭的地点，电话号码在变更后可能未被更新，等等。作为数据设计者，你可能需要考虑如何在数据中表示歧义或置信度。决定这样做是一个重要的决策。你传递给客户的歧义越多，就越需要他们运用某种推理来使你的产品适用于他们的场景。说“埃里克和马特的游戏店要么在地址
  A，要么在地址 B——我们就是不确定”有用吗？最终，必须有人、在某处做出决定。如果你把这个决定留给客户，他们将不可避免地被迫引入额外的推理层来解决你数据中的问题，从而导致令人不适的依赖关系，并且缺乏真正的交易信任。我们发现，确保你的系统拥有设计良好的补救路径，与数据质量本身同样重要。错误总会存在，但如果你能立即对这些错误做出响应，你将获得很多谅解。为补救而设计，使你能够对自己发布的数据中的陈述采取稍微更强硬的立场——本质上，你可以做出决定，但也可以修正它们。


  我们认为，某些类型的歧义是可以合理传递的。最显著的例子可能是企业名称。虽然某处可能有人清楚企业的唯一名称，但能够捕获两种类型的相关名称是有价值的。第一种是真实名称的变体。是“星巴克”还是“星巴克咖啡”？是“家得宝”还是“家得宝公司”？捕获诸如“马特和埃里克的游戏店”作为“埃里克和马特的游戏店”的替代名称也很有用。这种替代信息可以通过包含替代名称使用分布的某些指示来进一步增强。这类信息在搜索场景中尤为重要。在我们的企业列表场景中，第二种有用的相关信息是将先前经营者的名称与特定店铺关联起来。


  但让我们先打住。我们开始走上“属性填充”的道路了。我们正在向模型添加属性以支持特定的客户场景。这个场景的核心是什么？在认识到记录某个地点先前经营者的价值时，我们揭示了一些额外的关键概念。首先，企业是具有时间性的。准确地说，在日期
  1 和日期 2 之间，埃里克和马特的游戏店占据了一个特定地点。同样准确地说，在那段时间，可以联系到他们的电话号码是电话号码 1。该地点商业单元目前的经营者是乔什的波奇碗店。这里有一个机会来分解模型，并以这样一种方式链接陈述，使得消费者能够轻松地从你的分解模型中为其场景编译出合适的表示。这与我们在定义和衡量系统数据产品时讨论的原则相同。宁可偏向于你所描述世界的构成要素，也不要偏向于特定客户或场景的细节。这相当于数据世界中面向对象软件里良好类设计的原则。




  ### 表示输入


  到目前为止，我们已经讨论了系统输出的数据模型。推理系统通常处理不同表示层次之间的转换。对于我们的网页抽取项目，我们从一些对象数据（即文档）开始，最终得到该文档内容的语义模型。项目启动时，我们使用从企业网站下载的原始
  HTML 数据作为输入。对于从网页进行分类或实体抽取的应用来说，这是一种相当常见的方法。然而，随着项目的推进，我们观察到了一些问题。首先是下载时间。这一点很重要，因为如果没有它，我们就无法准确追踪抽取字段的更新时间。其次，我们注意到，有时我们会抽取页面上不可见的数据，而有时又无法抽取页面上可见的数据。在第一种情况下，问题在于我们平等对待所有文本节点——即使
  HTML 的设计初衷是向用户隐藏某些文本。在第二种情况下，用户在浏览器中访问页面时所看到的内容，不仅由导航到该页面时下载的 HTML 字节流构成，还包括用于页面样式设计的
  CSS、页面渲染过程中动态加载的内容，以及脚本对页面所做的修改。


  数据的时间维度是存储*上下文*（即数据采集条件）的一个例子。这些数据本身构成了整个系统的宝贵信息，并且对于管理数据集也很有用——想象一个图像数据集，其中包含了拍摄时间和地点的额外信息。导致内容过度抽取和抽取不足的渲染问题，本质上是能够描述系统需求的例子。虽然项目的总体思路是从网页中抽取业务数据，但最初的实现尝试仅从用于向用户呈现网页的部分且不完整的数据视图中抽取业务数据。当我们更深入地研究这个问题时，我们确定了两种略有不同的场景。第一种是通过模拟人查看页面的方式从网页中抽取业务数据。第二种是重建连锁店或其他大型、多地点企业网站上的列表页面背后的数据库。从这些角度思考，对我们系统中使用的抽象概念以及抽取器的设计和实现都产生了相当大的影响。


  ## 结论


  可以公平地说，关于敏捷工程实践最常见的困惑是，认为敏捷意味着偷工减料，避免那些看似不直接通往既定目标的任务。但就像任何努力一样，高效的执行力源于扎实的基础功底。这不仅适用于工程师个人的基础技能，也适用于团队运作的基础和项目运行的基础。早期并持续地对质量进行投入，将贯穿整个项目提升效率。


  在第 9 章“技术卓越”中，我们阐述了在软件工程中普遍投资卓越性的动机——*优化开发者生产力*——并讨论了数据项目中的相似之处——*最大化数据的价值*。


  在第 10 章“简单性”中，我们将描述如何每天敏锐地判断哪些工作应该做、哪些不应该做以推动项目前进，这如何能在项目中产生决定性的影响。


