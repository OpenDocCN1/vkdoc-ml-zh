- "# 13. 结论\n\n以下是敏捷宣言的原则（agilemanifesto.org/principles），其中我们针对敏捷机器学习团队的建议修改部分已加下划线。我们还为每一章附上了总结回顾。\n\
  \n1.  我们的最高优先级是通过**尽早**和**持续**交付**有价值的** **数据**来**满足客户**。\n\n    在第 1 章“尽早交付”中，我们探讨了团队如何启动并运行一个新的推理项目。我们谈到了指标的核心作用，以及一种偏向行动的文化，这种文化能够利用数据分析实现快速迭代，从而推动项目各个方面的演进。\n\
  \n2.  欢迎**需求变更**，即使在**开发后期**也是如此。敏捷过程利用变更来为客户创造**竞争优势**。\n\n    在第 2 章“需求变更”中，我们讨论了如何构建和开发能够预见变更的系统；如何通过测试、监控和度量来预测和衡量变更；以及应对系统中\
  \ DSAT 和已测量问题的策略。\n\n3.  *持续交付* **可工作的软件和准确的数据** *，周期从几周到几个月，倾向于更短的时间尺度。*\n\n  \
  \  在第 3 章“持续交付”中，我们描述的技术不仅旨在频繁交付可工作的软件，更在于持续交付可工作的软件和准确的数据。这些技术包括：在开发时应用足够的严谨性以确保代码和数据变更的正确性；使用持续集成系统进一步验证这些变更；持续向越来越多的用户部署以在生产环境中测试变更；以及建立系统以便在出现问题时快速回滚数据和代码变更。我们还讨论了如何使用功能开关结合遥测和“胜/负”分析等技术来决定发布什么。\n\
  \n4.  **业务人员和开发人员**必须在整个项目期间**每天**都在一起工作。\n\n    在第 4 章“与业务对齐”中，我们讨论了与业务团队沟通的重要性。我们描述了让团队尽可能直接地与业务指标和业务目标对齐是多么重要。我们分享了一些关于如何与业务部门合作，帮助他们理解机器学习局限性的想法。我们还描述了如何开展\
  \ Scrum，以及如何通过 Scrum 会议、Scrum 工件和围绕 Scrum 节奏发送的电子邮件来让业务团队参与并与之沟通。\n\n5.  围绕**有动力的个体**构建项目。给予他们所需的**环境**和**支持**，并**信任**他们能够完成工作。\n\
  \n    在第 5 章“有动力的个体”中，我们讨论了如何围绕有动力的个体来构建项目。我们讨论了频繁重写的重要性。我们描述了一些领导力理念，关于如何设定愿景和指标目标，同时信任有动力的个体去找到实现愿景和指标的最佳方法。我们讨论了如何寻找和雇佣有动力的个体，以及他们加入后如何留住并发展他们的职业生涯。我们讨论了拥有高效开发环境的重要性，以及衡量常见任务的内循环和外循环时间以及开发者净推荐值。最后，我们谈到了如何利用团队外部的有动力个体（这也会激励团队内部的成员）。\n\
  \n6.  向开发团队传递信息以及在团队内部传递信息，最**高效**且**有效**的方法是**面对面的交谈**。\n\n    在第 6 章“有效沟通”中，我们通过深入探讨一个敏捷数据工程团队会遇到的各种交互类型，来阐述并对比了这一原则。这里的主要信息是，所有这些沟通都是一种技能——就像编写代码和深入研究特定的机器学习方法一样。与任何技能一样，除非它被认可并成为你个人工作和团队文化中有意为之的一部分，否则就无法学习、维持或提高。\n\
  \n7.  **对**可工作的软件和数据的**监控**是衡量进展的主要标准。\n\n    在第 7 章“监控”中，我们讨论了如何利用基于活动的监控来真正衡量你的可工作软件。我们讨论了基于活动的监控系统如何工作，以及它记录和追踪的内容。我们谈到了\
  \ Azure Data Explorer，它允许你对大量日志数据进行复杂的临时查询。我们审视了良好的监控能够告诉你的各种信息：你的软件是否真的按预期工作；软件何时以及为何出现故障；用户实际体验到的系统性能如何；业务目标是否达成；客户需求是否得到满足；以及如何在生产环境中监控数据和机器学习模型。\n\
  \n8.  敏捷过程提倡**可持续的开发**。赞助人、开发者和用户应该能够无限期地保持恒定的节奏，但偶尔上下调整节奏可以产生更好的结果。\n\n    在第 8\
  \ 章“可持续发展”中，我们讨论了如何判断你的工作节奏是太快还是太慢，以及如何向下或向上调整节奏。我们讨论了如何设定目标，并确保目标既足够雄心勃勃又切实可行。我们讨论了团队参与度对于将节奏调整到合适水平的重要性。我们还讨论了在开发计划中内置一些节奏变化的重要性，例如通过宽松周来放慢节奏，通过黑客马拉松来加快节奏。我们还讨论了在管理线上站点问题和跨地域协作时，关于可持续节奏的特殊问题。\n\
  \n9.  **持续关注** **技术卓越**和**良好的设计能增强敏捷性**。\n\n    在第 9 章“技术卓越”中，我们阐述了在软件工程整体上进行卓越投资的动机——*优化开发者生产力*——并讨论了在数据项目中的相似之处——*最大化数据的价值*。可以公平地说，关于敏捷工程实践最常见的误解是，认为敏捷意味着偷工减料，避免那些看似不直接指向既定目标的任务。但就像任何努力一样，高效的执行力来自于扎实的基础。这不仅适用于个体工程师的基础技能，也适用于团队运行的基础和项目运作的基础。早期且持续地对质量进行投资，将在整个项目中驱动效率。\n\
  \n10. 简单性——**最大化未完成的工作量**的艺术——是至关重要的。\n\n    在第 10 章“简单性”中，我们描述了如何通过勤勉和专注来确保正在进行的工作清晰地推动项目前进，这是简单性的核心目标。你是一个由聪明数据开发者组成的团队的成员或管理者，他们渴望通过你的服务和数据产品对世界产生影响。你应该每天带着敏锐的眼光来工作，寻找那些旨在推动项目前进的相关工作。你应该挑战你的客户，让他们积极参与并关注工作的进展。在团队内部，你应该通过帮助界定问题范围、寻找知识空白以及阐述定义明确的实验，来引导团队穿越数据问题中未知且未探索的领域。\n\
  \n11. 最佳的架构、需求和设计出自自组织团队。\n\n    在第 11 章“自组织团队”中，我们描述了在许多从事数据项目的团队中可以找到的各种个性。我们强调了团队的多样性以及随之而来的动态变化，以及这如何有助于建立、迭代和改进团队产生的设计及其他声明性工件的流程。\n\
  \n12. 团队定期反思如何能变得更有效，然后相应地调整其行为。\n\n    在第 12 章“调整与调优”中，我们讨论了诸如回顾会议、数据复盘、质量评审、线上站点评审、工程评审和调查等工具。我们还讨论了如何使用“五个为什么”来正确找出团队问题的根本原因。指标只是用户体验的近似值，必须定期更新以更好地反映随时间变化的用户体验。最后，定期召开团队会议，强制团队更新书面的总体计划（包括愿景、指标、业务目标、工程系统目标、流程目标和线上站点目标），是保持团队清晰聚焦于下一步需要实现的目标的有效方法。\n\
