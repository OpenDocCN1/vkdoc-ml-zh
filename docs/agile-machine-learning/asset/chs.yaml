- "# 10. 简单性\n\n> *简单性——* ***最大化未完成的工作量*** *的艺术——至关重要。*\n> \n> *——agilemanifesto.org/principles*\n\
  \n敏捷开发的出现，部分是为了反对软件工程中自上而下、委员会驱动的方法。在敏捷宣言撰写之时，包括极限编程和 Scrum 在内的一些创新开始在开发社区中获得关注，而看板等各种现有方法也被应用于新的、节奏更快的软件开发世界。敏捷方法将问题解决的重点从上游的委员会讨论转移到流程中的工程活动。原则\
  \ 10 强调了对此种焦点转移的回应，主张保护工程能力免受瀑布模型的遥远影响，将决策权置于能够找到最相关上下文的那一刻。由于传统方法几乎已不复存在，该原则最初的动机已不那么成问题。然而，对于高效的生产者和团队来说，理解如何通过为了项目利益而选择性地工作来优化其贡献的效果，仍然是一项基本技能。此外，因被允许进行选择性工作而产生的对话，是磨练工作重点和界定项目范围的绝佳方式。\n\
  \n该原则中使用的术语有些过于开放，容易产生歧义。与其纠结于“简单性”在工程流程中的含义，不如让我们考虑一下该原则的精神。^(²⁰) 该原则并非关于避免工作，而是确保所进行的工作是有意为之且明确地推动项目前进的。这种专注是“做事”与“决定做什么”之间反馈循环的重要组成部分。\n\
  \n## 严谨对待任务描述\n\n在 Scrum 中，大部分规划和决策过程最终会归结为编写用户故事和任务描述。这些为持续的项目流程提供了一个有用的转折点，在此可以检查是否有可能着手进行不必要的工作。可以对描述计划工作的语言应用一些简单的测试，这将有助于避免一些明显效率较低的投资。\n\
  \n\n### 未明确界定的工作\n\n任务界定不清可能导致工作无法推动进展。我们在数据项目中经常发现的一个典型例子是*改进*类任务：“改进人名提取器”、“改进商业页面分类器”或“改进回归测试框架”。这个例子触及了管理数据项目的核心——在数据和模型中的未知因素与可估算工作的离散模块中的已知因素之间取得平衡。一个指标目标的实现，需要通过一系列探索模型开发可能性空间的任务来完成。例如，要让分类器的精确度提升十个百分点且召回率不下降，可能需要运行\
  \ 20 个实验，涉及清理训练数据、参数扫描、新增特征实现、在数据查看器中增加查看假阴性结果的功能等等。这些实验中只有少数会最终通向预期的指标目标。为工具链添加功能将带来新的洞察，从而允许你优化计划。设置和运行实验，或构建工具链功能所涉及的每一项任务，都可以用传统方式进行管理，并以合理的准确度估算成本。如果团队能够完美地规划出一条穿越数据和模型搜索空间的单一路径，那么实现目标就可以通过一系列可预测的步骤完成。然而，这显然是不可能的。因此，团队必须运用某种通用策略和直觉，在向目标推进的过程中修剪搜索空间。这通过项目的迭代规划——即冲刺（sprint）来实现。区分目标与任务，能让你达到一个可以实际规划工作并管理团队资源的境地。通过短周期迭代和频繁实验，将指标叠加在此类活动之上，你就能看到进展的趋势。这将在一定程度上让你能够估算出达成指标目标所需付出的努力。\n\
  \n“改进”一词暗示了两个条件：第一，该组件未达到理想状态；第二，不清楚它需要达到多好。任何接到此任务的开发者首先应该反问：“当前状态是什么？此任务完成后期望的状态是什么？”此外，即使有明确定义的指标目标，也可以编写更好的任务描述，准确说明要完成的具体工作——即策略的应用，而非工作的目标。任何无法估算的任务都应分解为可估算的任务，或旨在减少未知因素（这些未知因素会阻碍后续任务被正确估算）的任务。\n\
  \n如果改进旨在解决特定的错误案例，例如分类器在数据总体的某个区域表现系统性差于整体水平，那么任务描述可以重写。不要再说“改进”，而是开始讨论针对该明确定义的案例或子群体提升指标（精确度、召回率等），然后将其分解为离散的任务。这自然会引出子任务，包括针对该案例对总体进行抽样、测量和分析，以及在模型空间中进行实验——新的特征提取器、额外的数据标注、标签修正等等。\n\
  \n既然你知道了自己在做什么以及起点，那么目标呢？这里有几种方法可以明确目标。首先，考虑改进所扮演的角色。虽然最明显的情况是交付价值，但你也可能发现自己正处于项目的某个阶段，其目标是展示能力。在这种情况下，你感兴趣的是获取关于需要付出多少努力才能看到指标发生有意义变化的知识。因此，目标应该是能够展示潜力的东西。从错误率的角度来思考。你能将其降低\
  \ 10%吗？如果你的目标是向最终客户交付价值，那么你需要考虑对他们来说可见且有意义的指标变化。\n\n如果你在处理特别困难的问题，那么按照改进趋势来组织工作可能很重要。1%的指标提升可能不是客户关心的，但展示出指标随时间持续向有意义的目标增长，则是展示能力的绝佳方式。\n\
  \n在所有涉及使用指标来设定目标或跟踪进展的情况下，都要考虑指标的效力。考虑到样本量和判断质量，这种变化在统计上是否可能发生？我们见过一些案例，向指标目标推进的进程步履蹒跚。经过分析，我们发现测量数据中的噪声（由于判断任务的复杂性、工具的精密程度、指南的清晰度等）可能会淹没任何改进。\n\
  \n如果不深入探究“改进”任务的细节，你极有可能承担一项看不到完成节点的工作。你会漫无目的地游荡，不知道自己已经创造了价值，也无法将获得的洞察重新整合到规划中的优先级里。讽刺的是，由于客户更希望将资源投入到其他更高优先级的项目中，过度改进一个推理组件可能会因机会成本而造成浪费。\n\
  \n### 致命的连接词\n\n在上一节中，我们关注了任务描述中的“改进”一词。另一个有问题的词是“和”。如果你在任务描述中看到“和”，请立即亮起你的红旗。通过连接任务，比如“分析分类器错误并提升召回率”，你假设了从第一个任务中获得的洞察不会影响你执行第二个任务的决定。此外，这还阻碍了任务的完成——而完成任务是保持团队敏捷和积极性的重要行为。你还可能面临将不同任务的成本估算混为一谈的风险。例如，分析通常应该设定时间盒。而进行改进——如上所述——则带来了自身的复杂性和未知因素。完成一项任务对团队来说价值巨大。将连接的任务拆分为两个，会使你可以庆祝的完成时刻翻倍。\n\
  \n\n\n### 跨任务依赖与假设\n\n措辞不当的任务标题和描述可能导致团队内部沟通不畅，引发对谁在做什么以及各项任务如何衔接的困惑。如果你期望另一位开发者按照你对任务的理解交付成果，而实际上他们却基于另一种理解开展工作，那么你们双方或其中一方的工作就可能偏离正确方向。\n\
  \n在最近的一个项目中，一项关于为我们的预测结果生成并自动化指标计算的协议被拆分给了两个团队。当两项工作都完成后，我们发现指标自动化功能是针对另一个已有的指标实现的，而新指标的计算结果却未被处理。\n\
  \n在参与规划流程时，如果你意识到自己对某个特定任务存在假设，最好将其明确表达出来，这有助于减少后续可能出现的混淆和精力浪费。\n\n我们发现以下几种方法对消除危险假设大有裨益：\n\
  \n*   **规划扑克**：这是一种规划游戏，通过让两人或多人对任务成本进行估算，来揭示对任务实际内容的理解偏差。简而言之，每位参与者各自给出估算值（且不知道其他人的估算），然后比较这些数字。如果数值相近，则无需进一步讨论。如果差异较大（例如，一人的估算值是另一人的两倍），则进行新一轮深入讨论，更细致地探究任务的具体细节。这是一个发现理解偏差的绝佳工具，因为它只需片刻思考就能形成粗略估算，而假设恰恰会在此处发挥作用。例如，假设任务是构建一个简单的标注工具来为文本中的短语添加注释。你的估算值是\
  \ 2 天，但我的估算值是 5 天。我们的编码能力相差无几，那么差异从何而来？在讨论任务时发现，我假设需要实现不同标注者身份的管理功能，而你则假设只需将标签以简单格式写入磁盘。\n\
  \n*   **结对编程**：如果生产者和消费者能够坐在一起共同实现 API、组件或数据转换，就可以省去更正式的文档流程，并让交换双方快速迭代，最终得到一个双方假设都最小化的结果。\n\
  \n*   **合成数据**：即使在 API 创建或任何数据处理之前，手动（或通过简单的自动化流程）生成一些合成数据也是很有用的。这能让消费者不必等待设计和实现完成，就可以基于数据进行编码，并发现数据模型或交换格式中的问题。\n\
  \n### 措辞至关重要\n\n我们在本书的多个地方都提到沟通是一项核心技能。与优秀的代码一样，清晰阐述的工作描述对于团队在冲刺中完成实际工作至关重要。培养对项目相关语言质量的批判性态度，有助于你在数据项目的领域中游刃有余。\n\
  \n## 早期集成\n\n在包含多个机器学习组件的大型项目中，一种常见的分解方式是朝着集成点的指标目标努力。你的团队将产出精度为 90%、召回率为 80%的数据，而我的团队将开发一个搜索排序函数，其\
  \ DCG^(²¹)比当前排序器提升 10 个点。然而，实际上很难预测上游团队需要交付什么，下游团队才能在此基础上实现其目标。因此，下游团队倾向于提出一个对自己安全的指标目标——换句话说，这个目标很可能高于实际需求。\n\
  \n在理想情况下，你会确保两个系统尽快集成。此外，下游系统应设计为支持低成本实验。这样一来，集成点的指标目标就不再是主要关注点——你可以直接观察上游改进对最终产品的影响。与更松散的耦合方法相比，这提供了提前完成项目的机会。\n\
  \n## 基线与启发式方法\n\n面对一个新问题时，常见的情况是缺乏经验的团队直接投入最新的机器学习方法，急于展示自己的本领——他们问的是“当我们把这种方法应用于这些数据时会发生什么？”与确立指标的重要性相辅相成的是，提出某种基线系统可以用极小的投入带来有价值的见解。这可以简单到让一个二分类器始终输出正类。更有信息量的做法是，实现少量“显而易见”的规则，捕捉你对问题的直觉和假设。如果再多花一点精力，你可以训练一个简单的逻辑回归模型，作为更复杂机器学习方法的基线。通过编写这些代码并根据你的指标进行评估，你将了解到问题空间的复杂性。此外，通过观察你的简单启发式方法在指标集上产生的错误，你将感受到数据总体的方差。\n\
  \n在我们从网页中提取商业信息的系统中，我们为使用机器学习方法进行实体提取的多种方法做好了充分准备。我们同时支持序列模型和分类模型。然而，在需要实现电话号码提取器时，我们从一个简单的正则表达式开始。随着项目的推进，我们了解了不同国家合法电话号码的模式（例如，在美国，并非所有十位数字序列都是有效电话号码，这就是为什么电影中的号码总是包含\
  \ 555）。这些知识与基于模式的方法相结合，足以在所需的精度和召回率水平上提取电话号码，因此我们甚至没有投入精力去训练模型。\n\n相比之下，我们在地址提取上的投入始于一个基于有限状态转换器的遗留模式方法。虽然这种方法因其已存在而方便，但我们很快发现了它的局限性，并转向了完整的机器学习方法。\n\
  \n\n\n## 认识局限性\n\n作为数据科学家，我们热衷于提醒人们两个普遍真理：数据总是存在噪声，且没有完美的推理系统。对于后者，我们设定了预期，即输出中总会存在错误。我们在第\
  \ 9 章《技术卓越》中讨论过，要确保你的系统在设计时将缓解措施作为核心能力。这让你能够在发现错误时做出反应并进行修复。这对于处理那些高度可见、可能令人尴尬或危险的错误非常有效。然而，这是一种事后解决方案——错误已经暴露出来。\n\
  \n大多数大规模、基于机器学习的工程团队已经围绕众包数据构建了系统。这些系统涉及数据与作业管理系统，以及用于训练和管理远程或现场评审员池的工具与流程。这些评审员将选择或被分配工作，并以小额单价完成任务。这种人类智能池可以集成到你的数据处理工作流中——我们称之为“人在回路”模型。\n\
  \n在本地搜索领域，所有记录看起来都一样：企业或本地实体的名称、地址、电话号码等。然而，根据你的数据使用场景，这些实体的重要性可能差异巨大。事实上，在搜索中，很大比例的实体只向少数用户展示过几次，而有些实体则从未展示过。因此，你的系统质量对重要实体（即“英雄实体”^(²²)）中的错误更为敏感，远胜于那些从未露面的实体。考虑到这一点，我们希望确保系统对这些英雄实体推断出的变更不仅更可能准确，而且实际上经过了人工验证。白宫的地址发生变化的可能性极低，但如果真的变了，你肯定不希望因产品中未及时更新而陷入尴尬。\n\
  \n为了通过“人在回路”方法处理这一问题，我们确定了一组需要监控的实体。每当对这些实体计算出变更时，我们不会像对待其他实体那样让变更直接通过系统，而是让它们走一条“小弯路”。这些变更会被提交给人工评审员进行审核。如果变更得到验证，信息就会简单地流回系统。如果未通过验证，错误不仅会被丢弃，还会被记录下来，以便系统不会因同样的问题再次出错。只需付出一点延迟的代价，我们就能确保重要实体得到保护。\n\
  \n这种方法的好处在于，它能轻松地根据人工评审员的能力进行扩展。你可以简单地根据实体向用户展示的次数来对其重要性进行排序。每当有评审员空闲时，他们就可以审查列表中在当前周期内发生过变更的下一个实体。\n\
  \n通过设计“人在回路”机制，你可以避免寻找基于机器学习的方法来解决系统中最后几个质量点这一日益困难且昂贵的任务。此外，这也避免了为建立一套足够灵敏、能精确衡量该级别任何变化的度量系统而投入更多资金。\n\
  \n## 管理 HiPPO\n\n一个人离你的项目越远，他们对一线开发者所经历的考验与磨难就越缺乏了解，也越不清楚问题领域中哪些容易解决、哪些困难重重。我们都曾有过这样的经历：从外部审视另一个团队正在攻克的问题领域，心想——“这能有多难？”当持有这种观点的人恰好是你的上级管理者时，很容易就会选择立即响应他们的意见，打乱冲刺计划、将规划抛诸脑后，然后手忙脚乱。意识到这些人可能产生的影响至关重要——我们将他们的意见称为\
  \ HiPPO（最高薪人士的意见）。\n\n有两种通用方法值得考虑。第一种是我们可以称之为“决策转移”的策略。当有影响力的人要求你采取某项行动时，你应该反问他们，当前哪些优先级事项需要调整。这是处理这种情况的有效方式，因为它提供了教育的机会，同时也让任何形式的否决权所带来的后果变得清晰。当然，只有当你拥有管理良好的待办事项列表和冲刺计划时，这才能做好。如果你只是凭直觉、临时抱佛脚地采用“方法”，那么你就很容易受到他人随意的方向修正。\n\
  \n第二种方法是依赖数据。如果被要求做 X 而不是 Y，你可以通过引用现有数据或进行一些快速但有原则的分析来回应。如果 HiPPO 的见解是有效的，那很好——你被推动着更好地理解了你的数据。\n\
  \n在这两种方法中，关键的投资在于干预*之前*所做的事情。你的规划应该已经制定好（以 Scrum 的方式，而非瀑布模型的方式），你的指标和数据应该足够成熟，以便促成有依据的讨论。总的来说，我们发现，在潜在的数据和指标对话者面前领先一步是很有用的。如果你的指标将在任何交互或数据集分析中被使用，那么手头掌握下一层级的细节——子类型的分布、错误案例的细分等——将大大有助于确保高效地做出正确决策。\n\
  \n## 快速失败\n\n与传统工程项目相比，数据项目的敏捷开发从根本上改变了风险格局。选项空间因数据中的未知因素以及当前推理问题的挑战而变得更加复杂。考虑到数据的维度，合理的假设是通往成功的路径相当有限。因此，能够迅速地剪枝搜索空间至关重要。\n\
  \n快速失败^(²³)是一种策略，通过它你可以调整工作方向，以尽可能快地判断总体方法是否可行。你希望尽快证明该方法会失败，以避免在无法奏效的解决方案上投入更长时间。当然，其推论是：如果你未能证明其失败，那么所考虑的方法很可能是有潜力的。\n\
  \n关于快速失败的一般考虑包括以下几点：\n\n*   **理解并测试你对组件或问题的假设**：努力揭示你计划中的假设——哪些事情必须顺利运作才能让你交付成果。你有什么证据表明它们会顺利运作？你几乎肯定是在新的场景中或针对不同类型的数据应用该方法。\n\
  \n*   **扩展性**：当组件需要扩展时会发生什么？没有必要实现扩展，但你当然应该寻找机会弄清楚扩展策略的关键方面，并进行一些快速测试，可能使用合成数据或模拟工作负载。\n\
  \n*   **标注数据生成**：是否存在合成或以其他方式自动化收集或创建数据的途径？如果需要人工评审员，这项任务能否用你现有的工具完成？我们发现，如果你自己进行一些快速标注，你可能会意识到，你试图解决问题的核心概念实际上相当模糊，并且可能存在生成低质量标注数据的风险。\n\
  \n\n\n## 自研、采购还是开源\n\n针对团队在解决方案中拥有多少自主权所采取的策略，定义了团队的身份。一方面，完全自主的方法将团队确立为该问题领域的卓越中心。另一个极端是，致力于集成外部组件和数据源的策略，则将团队定位为平台与集成团队，可能对业务关系有相当大的需求。牢记这一点很重要，因为它会影响你想要吸引的团队成员类型。\n\
  \n当你的团队负责交付数据产品时，“采购”与“自研”的考量会通过以下几种方式发挥作用：\n\n*   购买或授权完整的数据集及其更新和维护服务\n*   购买将构成你解决方案一部分的数据集，你将对其进行改进和扩充\n\
  *   购买可直接应用于你自行获取的原始输入数据的推理组件\n*   购买工具链，以支持你的团队开发交付产品所需的模型\n\n在所有这些场景中，需要考虑的关键问题是，如何通过依赖关系来管理敏捷性。例如，如何应对\
  \ DSAT^(²⁴)？如何在提取软件中处理提取错误？如何对分类器中的大量误报进行优先级排序和改进？\n\n如果你完全依赖某个数据源，那么可以预期的是，优先级高的问题和个别错误将被报告给数据源方，得到处理，然后发布包含预期更改的新版本数据。第三方数据源之所以有吸引力，是因为提供商拥有更多资源投入到数据中。这种依赖关系在经济上是合理的，因为成本由多个客户分摊。然而，这会降低你影响问题处理优先级的能力。理想情况下，第三方提供商会有一个机制，允许你提交问题报告或实际的数据更正。验证和应用更正可能成为服务的一部分——你可能需要为每次更正付费。\n\
  \n另一种选择是在你这边对数据应用补丁。这本质上是一种合并场景——第三方数据作为一个信号，至少与你的更正数据以及可能的其他第三方数据集混合在一起。\n\n总之，数据依赖要么是一种完全依赖服务提供商的延迟和错误更正优先级的策略，要么是一种需要你在合并和更正数据管理方面进行投资的策略。\n\
  \n当涉及到对第三方推理组件的依赖时，也有类似的考量——如何管理系统改进以处理大量错误和特定的 DSAT。你这一方的改进可以通过封装第三方组件并应用适当的轻量级规则来纠正特定的推理错误来进行管理。\n\
  \n### 建立集成框架\n\n在经历了多个涉及第一方和第三方组件混合的项目后，我们意识到，与其将第三方选择和集成决策视为一次性的考量，并围绕集成该特定实现进行具体设计，不如将问题视为提供一个通用框架，用于集成该问题的任意数量的潜在解决方案。这种方法的好处是，它允许你根据需要随时替换解决方案，而且还允许你混合搭配适用于问题空间不同领域的解决方案。\n\
  \n例如，如果你正在评估文档理解的解决方案——即根据原始输入确定文档逻辑结构的推理组件——你可能会发现一个解决方案擅长处理通用的高级布局，而另一个则特别擅长识别和构建表格。你希望在利用前者通用价值的同时，也能获得后者的优势。为此，你可以构建一个框架，让两者都能在其中运行。然后，该框架会将结果组合成最终输出。\n\
  \n## 结论\n\n在第 10 章“简单性”中，我们介绍了确保个人和团队能够通过精心规划并执行深思熟虑的工作来集中精力、高效行动的方法。你是一个由聪明数据开发者组成的团队的成员或管理者，他们渴望通过你的服务和数据产品对世界产生影响。你应该每天带着敏锐的眼光来工作，寻找旨在推动项目前进的相关工作。你应该挑战你的客户，让他们积极参与并关注工作的进展。在团队内部，你应该通过帮助界定问题范围、寻找知识空白以及阐述定义明确的实验，来引导团队穿越数据问题这片未知且未经探索的领域。\n\
  \n在第 11 章“自组织团队”中，我们将描述许多从事数据项目的团队中常见的个性类型，以及如何利用团队的多样性来产出更好的产品。\n\n脚注 1   2   3\
  \   4   5\n\n\n\n"
- "# 11. 自组织团队\n\n> *最优的**架构**、**需求**和**设计**，源于**自组织团队**。*\n> \n> *——agilemanifesto.org/principles*\n\
  \n自上而下的规划流程和层级化的团队控制，会给管理层带来某种舒适感。然而，这种温暖的感觉实际上只存在于顶层，很少被底层执行实际工作的人所体会。这一原则并无太多神秘之处——在敏捷团队中，团队内部低延迟的沟通，加上允许实验、犯错和修正方向的自由，使得组件、API、数据结构等的设计能够恰好满足当前任务所需，并且恰到好处。有时，团队内部发生的事情对管理层来说并不那么显而易见，尽管第\
  \ 4 章《与业务对齐》中讨论的技术，在很大程度上帮助管理层找回了瀑布模型消失时失去的那种温暖感觉。\n\n在数据项目中，团队通常围绕数据领域组建，因此团队成员对该数据的细节最为熟悉和了解——远超任何外部人员或管理层链中更高层级的人。由于数据是团队能完成什么以及如何完成的关键因素，让数据专家在团队流程、规划和执行的各个方面拥有主要发言权，是很有道理的。\n\
  \n在《敏捷方法的实证发现》一书中，Lindvall 等人^(²⁵)将敏捷方法描述为：**迭代式**、**增量式**、**自组织**和**涌现式**。他们将*自组织*定义为：团队拥有自主权来组织自身，以最好地完成工作项；将*涌现*定义为：允许技术和需求在产品开发周期中自然涌现。这两个定义都指向了缺乏自上而下的规划、设计和执行方法；但它们并不意味着团队决定高层任务或目标。自组织团队并非拥有完全自主权的团队。在某种程度上，项目、目标和业务必然由某些外部机构决定。自组织固有的内涵是对*如何*执行任务拥有自主权。此外，没有流程，团队就无法运作。流程*能够提升*生产力。这对某些人来说可能难以理解，因为他们可能将流程视为一种阻碍——一种凌驾于编写代码和训练模型等更重要工作之上的不必要的管理层次。数据团队的经理必须弄清楚如何通过有效的流程来赋能团队。\n\
  \n## 团队构成\n\n在必应及其他地方的项目中，我们观察到几种团队构成类型，各有不同的优缺点。这些团队构成类型包括：**能力均衡型、能力混合型、能力分层型**和**主刀医生型**。\n\
  \n*能力均衡型*是指团队成员在各方面都可以互换。无论由成员 A 还是成员 B 接手任务，结果都没有实质差异。完全由这类个体组成的团队非常罕见，也不可取。鉴于你需要能够覆盖整个技术栈，你需要用传说中的全栈数据科学家来填充团队——这几乎是不可能完成的任务。在组建团队、规划冲刺以及团队日常运行时，认识到这一点非常重要。\n\
  \n*能力混合型*存在于由能力相当但互补的开发者组成的团队中。这可能是最有效的团队构成。团队中会有一些数据科学专业知识更深的成员，一些更专注于后端工程的成员，等等。如果团队成员对自己的领域充满热情并相互支持，自我学习和团队学习就会发生。能力混合型团队的关键在于，确保知识和技能不会被困在具有相似能力的个体孤岛中，而是在团队中不断交流，尤其是与不同能力的成员交流。例如，专注于数据科学的团队成员应定期与专注于后端的团队成员配对——要么并肩编码，要么至少相互分享设计和架构的见解与想法。专业化的能力可以在团队中产生出色的成果和良好的动态，但隐藏的技能和工具可能导致灾难和生产力低下，尤其是在有人离开时。而且，最好的想法往往来自不同能力的成员共同解决同一个问题——数据科学家常常能提出后端工程团队未曾考虑到的见解，反之亦然。\n\
  \n*能力分层型*通常出现在团队包含初级和高级成员的情况下。同样，这是一种非常正常且富有建设性的团队差异。高级成员可以得到初级成员的支持，而初级成员则从互动中获得经验。此外，在机器学习和数据科学这个快节奏的领域中，新毕业的大学生尤其善于传递解决特定问题的新规范。他们能够以积极的方式推动变革。\n\
  \n*主刀医生型*团队以一小群高绩效个体为核心。这些主刀医生就像手术室里的主刀医生——是取得进展的主要渠道，也是其他人关注和通常追随的对象。在数据工程项目中，这种团队极难有效落地成果。太多事情集中在一个人身上，而在典型的数据工程项目中，数据量过于庞大，一个人无法全面考虑。虽然主刀医生可能能力很强，但他们在团队流程中的核心地位可能会阻碍整个团队发挥其全部潜力。\n\
  \n\n\n## 团队由个体组成\n\n团队工作的乐趣之一，在于你将与各种能力和性格的人共事。我们现在来看一些例子——在某种程度上是夸张的描绘——这些是数据导向项目中经常出现的个体类型：**新员工**、**熟练工程师**、**哲学工程师**、**有原则的应用科学家**、**外科医生**、**极简主义者**和**越野者**。\n\
  \n*新员工*刚从研究生院毕业，拥有机器学习或人工智能相关领域的博士学位，他们是新方法、新视角和活力的重要来源。这位团队成员一直生活在尖端技术的世界里，不受行业实用摩擦的束缚，并且一直在为复杂问题的解决方案进行优化，而不是为交付产品所需的工程矩阵。他们带来新鲜的见解，并能挑战团队。他们通常在生产级代码方面经验不足，因此需要完全接受团队文化所要求的软件工程实践。在一个开放且欢迎新人的团队中，你应该会发现许多候选人愿意指导这样的新员工。\n\
  \n更资深的*熟练工程师*是一位可靠、值得信赖的贡献者。他们可能在机器学习方法方面经验较少，但在确保设计考虑生产问题（如扩展、测试和部署自动化）方面做出了巨大而重要的贡献。他们在协作方面经验丰富，尤其是与那些提供整体系统中超出熟练工程师职责范围能力的互补贡献者合作。他们可能对通过学习机器学习来实现一些重要的职业发展感兴趣，但即使不感兴趣，他们对团队来说也是无价的。\n\
  \n*哲学工程师*对交付速度和项目背后的业务动力稍显不足，但非常热衷于确保数据模型、架构、规划以及项目中任何其他声明性方面都做得“正确”。他们对问题自然且直观的分解有着强烈的感知（通常以独立于计算最优方法的方式进行）。他们会反对任何由组织结构而非问题本质所塑造的架构迹象。当他们看到语义过载的数据结构时，手心会出汗。他们可能会在设计上陷入困境，需要学会平衡自己的兴趣与团队所需的速度。他们很可能会对让自己感到不适的代码进行有原则但不受欢迎的重构投资，因此管理者需要考虑何时以及如何鼓励这种行为，或者将这种精力引导到别处。第\
  \ 8 章：可持续发展中关于可持续节奏的想法对此会有所帮助。\n\n有原则的*应用科学家*有点像哲学工程师——他们更关心把事情做对，而不是其他产品方面的考虑——但他们的痴迷在于机器学习的细节。他们在确保机器学习的所有小细节都得到妥善处理方面是无价的，这样团队就能从他们积累的智慧中获得最大收益。初级和经验不足的机器学习从业者最好听取他们的意见，以学习广泛的行内技巧：如何清理和平衡数据集，如何标准化特征值，如何分析异常值以寻找分类器改进的线索，等等。\n\
  \n*外科医生*是一位高产、富有魅力且有原则的开发者，他们对团队有着巨大的影响力，这主要源于他们的工作速度。^(（[26]（#fn26））) 由于高效，他们参与到产品的许多组件中。他们是福星，因为他们能推动事情向前发展（有时速度惊人），但他们也可能带来挑战，因为他们可能成为瓶颈，并在很大程度上决定其他人应该做什么。在最好的情况下，外科医生为团队带来了明显的净收益。在最坏的情况下，他们的负面影响大于其专业知识的益处，团队最终会被迫走上一条更多是依靠意志力而非原则的道路。\n\
  \n*极简主义者*发现自己身处一个机会激增、工作量超出团队有效承载能力的团队中。他们专注于确保分配给自己的工作完成，但不愿涉足未知领域或承担他们不“拥有”的问题。他们缺乏数据科学家天生的探索精神，也不觉得自己有能力去承担可能失败的未知任务。他们喜欢结构清晰、责任明确的工作。\n\
  \n*越野者*无法停止制作原型。他们经常在那些最初并非项目核心重点的领域拿出功能完整的原型，而这些原型仅仅因为存在，就影响了团队的方向。他们倾向于请求原谅，而不是请求许可。他们不觉得自己受到“官方”愿景或使命声明的限制，并通过他们的热情为这两者做出贡献。他们的原型可以给团队带来可能的方向感，但必须谨慎管理，因为对原型提出的要求通常不能代表产品的真实世界条件。越野者经常生成的原型，在真正面对真实数据时，往往无法很好地扩展。\n\
  \n\n\n## 团队中应鼓励的个人特质\n\n从这些个人特征的描绘中，我们可以提炼出一些应被鼓励的关键特质：**沟通能力**、**见微知著**、**保持开放心态**以及**公平参与**。\n\
  \n*沟通是关键*：优秀的沟通者懂得如何表达当前状态，如何参与建设性的团队讨论，以及如何从他人那里获取信息，无论对方的沟通能力如何。他们了解沟通在团队内部、跨团队以及向上管理链条中是如何运作的。优秀的沟通者明白清晰表达是一项关键的领导素质，并在个人层面践行这一点，同时期望他人（尤其是处于领导职位的人）也能做到。他们在自身和团队内部培养沟通这项技能。\n\
  \n*见微知著*：这一特质促使人们通过抽样数据来了解整体情况，为即使是看似微不足道的方法编写单元测试以确保代码基础稳固，在关注大局的同时注重细节，并帮助团队成员建立责任感。身居高位或担任领导角色，不应意味着只考虑高层级、大规模的概念。\n\
  \n*保持开放心态*：当首席执行官萨提亚·纳德拉开始着手改变微软的文化时，他引入了“成长型思维”这一理念。^(²⁷) 拥有成长型思维意味着你能够倾听，能够从他人的角度考虑问题，并且意识到假设如何影响你的思考和决策。没有这种关键态度，团队可能会变得功能失调。意见会变得僵化，信任会丧失，士气也会受挫。\n\
  \n*公平参与*：一个自组织团队在很大程度上应该能够自给自足。这意味着需要处理完整范围的工作。结合成长型思维，这带来了指导他人的机会（你可以帮助我理解系统中我不太熟悉的部分）、构建生产力工具以支持重复性任务的动力（你我都讨厌做某件事，因此我们可以一致认为，构建一个自动化工具是对我们时间的良好投资，并将使我们在未来更高效），以及更轻松的互动（我不必因为指出你在某个领域没有尽到责任而感到内疚）。管理者不希望不得不去提醒不情愿的团队成员参与，同事们也不希望经历那些同僚被当众羞辱的尴尬会议。\n\
  \n你的团队中总会有人在兴趣和热情方面与众不同。在某些情况下，这些差异会是互补的。例如，马特非常喜欢标注数据，并构建工具来让查看、交互和注释数据变得更容易，但他发现很多人对此并不那么热衷——这没关系。许多敏捷流程指南都假设所有团队成员是可互换的。实际上，情况并非如此（当然）。重要的是，团队不能让关键信息、代码和专有技术只掌握在单个工程师的头脑中。一个好的自主团队会确保这种情况不会发生。有助于防止这种知识孤岛的行为，通常会将相关的代码和工作流程社会化。这些行为包括：\n\
  \n*   公开审查和签入代码，以便其他人有机会查看代码，并理想地理解其设计。Azure DevOps 提供了出色的工具，用于对拉取请求进行代码审查，以便每个人都能对进入系统的代码进行评论和查看。\n\
  \n*   确保所有代码都在服务器上构建，这样就不会有个人的特殊配置或其他本地依赖项，从而妨碍其他人轻松使用代码。这在第 3 章“持续交付”中有更详细的讨论。\n\
  \n*   宣传、演示和支持代码、工具及流程，将经历实战考验。如果无法说服任何人使用某样东西，那么它可能尚未满足明确的需求。\n\n## 管理多个自组织团队\n\
  \n必应的本地搜索由多个团队组成，这些团队都遵循敏捷流程并以自组织的方式执行。我们发现，在某些领域，推行共享实践和工具，以及在合并后的团队中从更广泛的工程师池中分配特定任务是有利的。其中一些需求可以利用中心化工具，例如，如果要求单元测试达到一定的代码覆盖率，则无需为每个团队发明新的衡量方法。\n\
  \n由于这些团队共同对产品负责，所有团队成员至少都了解那些推动进展并支撑生产系统维护的基本生命周期要素。这些基础知识有助于在所有组件中保持对产品的普遍认知，但也意味着任何个人都可能造成各种故障。例如，任何团队成员都可以使用一个通用工具来立即处理数据中的错误，并允许他们纠正任何正式或非正式报告的数据。这类知识——包括部署、回滚、维护构建、确保代码库的完整性等——对于\
  \ DRI^(²⁸) 角色来说是必需的。\n\n编码最佳实践和风格要求主要通过使用特定工具来强制执行。在 IDE 中使用编码生产力工具（本例中为 ReSharper），同时部署其他代码策略检查系统，以防止不符合某些规则的代码被签入。当涉及跨团队共享和重用代码，以及支持在原始作者离开后长期维护系统的未来工程师时，这些风格策略非常重要。代码不仅应该功能正确，还应该是*可理解的*。代码本身可能写得晦涩难懂（抽象的变量名、无信息量的方法名、糟糕的格式、过长的行、缺乏命名空间结构等），更糟的是缺少注释和文档。最好的代码不需要文档，而是“自文档化”的。但这并不总是可能实现，因此关注风格细节将有助于后来的工程师理解。代码风格能增加未来的价值。\n\
  \n\n\n## 赋能团队驱动团队发展与产品演进\n\n我们在必应本地搜索团队的经验，让我们对团队内部自主权的价值，尤其是在数据密集型项目中的价值，获得了一些有益的见解。\n\
  \n数据项目会不断*揭示出*关于问题空间、数据以及实现目标特定方法有效性的新知识。将这些信息有效地传达给团队外部，以确保进展透明，这一点至关重要。应测试指标的可传达性——它们对你将要汇报的对象来说是否直观易懂？迭代周期应足够短，以便能够生成趋势——这是你表达进展的关键方式，也是帮助他人感知任务何时能完成的有效途径。\n\
  \n与正在处理的数据以及项目的特定目标相关的发现，可以为*新功能创意*提供丰富的来源。团队可以倡导这些数据驱动的洞察，并帮助在更高的产品层面推动创新。在致力于为本地商家提供营业时间信息时，我们了解到商家更改营业时间的频率（从其网站上营业时间的变化可以看出）。虽然单个商家不会频繁更改营业时间，但在任何特定时间点，一个国家内都会有相当数量的商家更改了营业时间。此外，在\
  \ DIY 和税务服务等特定消费领域，许多连锁商家会根据季节性时间表更改其所有门店的营业时间。当我们将从网络上提取的信息与从传统来源获得的替代信号进行比较时，发现了差异。有时，商家会在通过其他渠道更新数据之前，先更改其网站上的营业时间。在其他情况下，他们会先通过其\
  \ SEO 渠道更改营业时间，然后再更新网站。我们意识到，有机会将这些差异告知商家，并询问他们哪个版本的营业时间是准确的。这被提议作为一项功能，并与合作伙伴团队协作，将其交付给面向小型企业主的必应体验。\n\
  \n积极主动、充满热情的团队可以*自我教育*——组织论文阅读小组，*集体*参加在线课程，并就感兴趣的相关主题进行和参加数据导向的深度探讨或技术交流会。这种对学习的兴趣极其重要。这不仅仅是自我提升的问题，更是团队跟上新研究、开源模型等步伐的好方法。激发这类活动的热情通常来自个人，但开展这些活动的许可则源于自组织团队的文化。\n\
  \n团队会发展出自己的运作文化，这主要受团队成员及其价值观、经验，以及对支持敏捷工程的各种工具和流程的熟悉程度影响。三到五人的团队与五到十人的团队之间似乎存在非常显著的差异。在较小的团队中，担任管理角色的个人几乎肯定也同时作为一线工程师工作：像其他人一样编写代码、审查代码等。因此，尽可能去掉那些妨碍编码的流程“开销”可能很有吸引力。然而，在稍大的团队中，管理者作为开发者的角色可能不那么关键，而会将更多时间花在设计、架构、指标和团队职能等主题上。因此，较大团队的管理者可能更倾向于在那些能提升团队效率的流程上投入真正的努力。\n\
  \n那些运作方式不尽相同，但为同一项目协作贡献的团队之间的互动，凸显了良好沟通技巧的重要性，以及数据分析和洞察在推动达成共识方面的作用。\n\n## 优秀成果如何涌现\n\
  \n首先，让我们厘清语义。“涌现”通常指先前被遮蔽的事物进入视野。但这并非我们在此讨论过程的本质。相反，我们想表达的是，一个产物（计划、设计、架构）的形式是多个个体随时间推移互动和迭代的产物。^(²⁹)\
  \ 在敏捷开发领域，我们利用了以下两个关键理念：第一，自组织团队能够自行决定在特定领域变得重要时，由哪些最合适的个体来推动设计和其他概念性工作；第二，设计会通过陈述、批评和调整的迭代过程得到改进。\n\
  \n推动设计的合适个体组合会因情境以及组件和工作状态的相对重要性而变化。能够确定所讨论的设计是否关键（例如，面向客户、涉及未来难以修改的组件等），对流程大有裨益。最重要的设计不仅应从团队内部征求意见，还应从合作伙伴、客户、以及其他曾与拟议解决方案平台合作过的团队同事等处获取信息。\n\
  \n以涉及确定逻辑文档表示的底层序列化的项目为例。在开发推断逻辑文档结构的系统时，团队内部创建了一个初始实现。这个早期实现被证明在开发阶段极其有用，因为在该阶段，检查数据并将其与早期模型的结果进行比较是优先事项。它还与几个现有工具兼容，因此易于集成到现有实践中。然而，当需要将数据产品交付给合作伙伴时，很明显，该表示在反序列化和内容枚举方面的性能，远比我们在早期开发阶段所看重的设计特性重要得多。通过团队内部的讨论，设计了一种新的紧凑格式，而这最终成为了数据的交付载体。最终交付的设计包含一个与基本表示交互的\
  \ API，其范围有意地排除了我们预计会有用、但消费者尚未表达需求的功能。我们就确保总体方法在需要这些预期功能时能够进行扩展进行了大量讨论。\n\n我们经常发现，只有通过实现，最佳设计才会显现出来，因此探索性实现常常可以在边缘地带进行，最终至少形成一个初始设计思路。项目中使用的平台和编程语言等各种工程决策都会影响任何设计的细节，因此通过实现来进行设计不仅是一种探索设计空间的有效方式，还能在此过程中实时整合这些外部因素的约束和机遇。\n\
  \n我们经验的另一个关键部分是生态系统中各组件之间的关系。如果一种新型数据对团队频繁执行的工作流至关重要的内部工具提出了挑战，那么考虑改进这些工具，而不是扭曲设计以适应现有系统，这一点非常重要。从某种意义上说，这种灵活性正是敏捷的核心原则。\n\
  \n\n\n## 培养自组织团队\n\n团队的自主性并非仅凭一纸命令就能实现。你不能简单地让一个团队自行其是，然后宣称它现在是自组织的。这需要团队所有成员具备一定的态度，同时也需要团队内部任何担任管理角色的人员或团队外部任何层级领导角色的指引。作为自组织团队的经理，你应该密切关注完成工作的流程，以及如何开发和改进这些流程，从而从与你共事的各类人才中获取最大价值。\n\
  \n对于刚刚开始以敏捷方式运作的团队来说，最难传授的原则之一就是“我们同舟共济”。团队成员可能习惯于一种模式：被告知具体任务，然后高质量、按时完成这些任务。在敏捷中，重要的交付物不是某个特定任务，而是团队的目标或交付成果。个人需要从自己的具体任务中抬起头来，看到更宏观的图景，并思考自己的贡献如何能帮助实现更大的目标。他们需要愿意介入并处理其他任务以帮助团队达成目标，即使是那些不在自己专业领域或舒适区内的任务。他们需要在计划会议中充分开动脑筋，并始终牢记大局。他们需要对估算和达成冲刺目标承担更多责任。\n\
  \n团队通常会经历一个尴尬的时期，在此期间他们尚未完全开动脑筋，仍然以任务和个人成就为导向，而不是思考更大的交付成果以及团队如何实现它们。在这个时期，重要的是让团队在一定程度上自行摸索，并避免介入并微观管理团队所做的每一项任务的诱惑。\n\
  \n这种情况自然发生的一种方式是，当团队遵循第 4 章“与业务对齐”中描述的关于“冲刺目标”的流程时，团队在前几个冲刺中不可避免地无法达成许多目标。重要的是要透明地公开团队未能达成目标的事实，并鼓励团队更深入地思考如何设定在一个冲刺内可实现的目标。这种练习将帮助团队在估算、规划和自我组织方面更加努力，从而在一次次冲刺中开始达成更高比例的冲刺目标。\n\
  \n## 工程原则与概念完整性\n\n我们迄今为止描述的一般方法——即设计源于团队内部的交互式和迭代过程——似乎与*弗雷德·布鲁克斯的《人月神话》*中著名的不同观点相冲突。特别是，由首席架构师或首席程序员负责系统设计的理念似乎与敏捷开发相冲突。与所有敏捷事物一样，流程本身是灵活的，因此我们更倾向于考虑一系列团队类型。一个极端是自上而下的首席架构师模型。另一个极端是完全流动的涌现模型。现实情况是，团队总会受到内部或外部的监督，而这些职位上的人员（经理、技术负责人等）需要根据判断来决定何时以及如何进行以自我为中心的设计。某些类型的更复杂系统可能需要比其他系统多得多的监督。概念完整性当然很重要；因此，就像我们在本书中触及的许多主题一样，这是另一项非编码技能，每个人都至少应该意识到它，最好能弄清楚自己如何为其做出贡献。\n\
  \n在一个我们确实认为需要更多控制并且会得到回报的领域，是团队内部以及多团队产品组织中的跨团队所采用的工程原则。我们在第 9 章“技术卓越”中已经涵盖了许多这些原则。\n\
  \n## 结论\n\n在第 11 章“自组织团队”中，我们描述了在许多从事数据项目的团队中可以找到的各种个性。我们强调了团队的多样性及其随之而来的动态，以及这如何有助于建立、迭代和改进团队产生的设计及其他声明性工件的流程。\n\
  \n在第 12 章“调优与调整”中，我们将讨论回顾和反思过去进展的技巧，旨在提高效率。\n\n脚注 1   2   3   4   5\n\n"
- '# 12. 调优与调整


  > *团队定期* ***反思*** *如何能更有效，然后相应地* ***调优与调整*** *其行为。——agilemanifesto.org/principles*




  ## 回顾


  我们在本书中讨论了几种回顾和反思过往进展的机制，旨在帮助个人、管理者和团队提高效率。回顾这些机制，它们包括：**回顾会议**、**数据沉浸会**、**质量评审**、**线上服务评审**、**工程评审**以及**调查问卷**。


  正如第 4 章“与业务对齐”中所讨论的，*回顾会议*是一个定期反思团队中哪些方面进展顺利、哪些方面需要改进的机会。我们采用了一种包含三列看板的方法：“好”、“差”和“一般”。“一般”是一个很棒的现代词汇，用来表达无所谓或轻微失望的情绪。这是一个很好的中间类别，有时当人们还不愿意将某个问题直接标记为“差”时，可以在此处收集反馈。在回顾会议中，我们会给每人一叠便利贴，并给他们大约
  10 分钟时间，尽可能多地思考关于本次冲刺的“好”、“差”和“一般”的观察结果。团队成员随后将他们的便利贴贴在白板上。接着，团队中的某个人会浏览某一列中的所有便利贴，并将相似的便利贴归为一组。然后，团队讨论每一组便利贴，并集思广益，寻找解决“一般”和“差”列中反映的问题的方案，以及如何保持“好”列中体现的积极势头。团队会制定具体的用户故事，以便在下一个冲刺中加入，从而解决回顾会议中讨论的问题。


  当然，如果回顾会议之后没有采取任何行动，其作用就非常有限，因此团队必须优先处理并完成回顾会议确定的行动项，这一点至关重要。除了定期完成由回顾会议启发的用户故事之外，第
  8 章“可持续发展”中讨论的松弛周，也是处理通过回顾会议发现的用户故事的另一个机会。


  除了从具体故事或任务执行得如何的角度来审视上一个冲刺，我们还利用回顾会议来处理流程中的另外两个要素。第一个是中断。通过讨论那些计划外、但因各种原因团队不得不接手的工作，团队可以反思其运作的上下文环境，以及可以对计划或沟通做出哪些调整，以便更好地保护团队免受中断影响，从而减少冲刺中的不确定性。我们发现，有些额外工作之所以出现，是因为我们在冲刺开始时未能做好规划，或者是因为我们对线上服务的某些部分缺乏理想的自动化和工具支持。


  第二个是 Scrum 的核心部分——反思 Scrum 流程本身，以及团队可以做出哪些改变来更好地执行。例如，如果团队发现由于使用物理工件（如便利贴、用于记录状态的白板等）而导致了错误，他们可能会决定采取行动，改用数字看板系统。另一个例子可能是调整冲刺长度，如果由于项目的某些方面存在更多或更少的不确定性，而认为当前的长度太长或太短。团队成员还可能讨论影响整体绩效的问题，例如会议的数量和频率，这些问题他们和他们的经理可以立即采取行动。改进这部分工作的一个关键态度是，不要试图一次性解决所有问题，而是要做出一些清晰、切实的改变。让团队看到他们关心的流程问题正在持续改进，这是非常棒的。


  正如第 6 章“有效沟通”中所讨论的，*数据沉浸会*是发现提高效率机会的另一种绝佳方式。在这些积极的、以数据为中心的协作中，会用到多种技能。团队成员有机会练习并提升会议和演示准备、数据科学技能（这些技能将接受团队其他成员有益且建设性的质询）、基于数据做出决策并采取行动时追求清晰度、使用各种适用的数据展示和操作工具，当然，还有主持会议这一关键技能。


  正如第 2 章“需求变更”中所讨论的，*质量评审*应定期安排，以便团队审视并思考 DSAT（客户不满意）的模式，以及正在采取哪些措施来应对这些模式。这也是一个观察关键指标趋势、制定具体计划以持续改善这些趋势，或处理并修复任何呈下降趋势指标的机会。回顾你从监控系统中收到的信息（如第
  7 章“监控”所述），以确保你的产品行为符合预期。


  在第 8 章“可持续发展”中，我们讨论了*线上服务评审*。这是一个进一步深入探究线上服务问题，并确保这些问题得到理解和解决的机会。在此会议中，团队重点关注检测时间、介入时间和缓解时间，并寻找方法将这些数字降下来。


  *工程评审*在第 5 章“积极主动的个体”中进行了讨论。这是一个监控与开发者敏捷性相关的关键指标的机会，包括工程的内循环和外循环时间。这也是一个考虑定期开发者
  NSAT（净满意度）调查结果的好机会。


  总的来说，*匿名调查*是判断团队状况的另一个重要工具。有时，个人可能不愿在上述团队环境中提出某个问题，但他们会对关于特定问题或主题的快速匿名调查做出回应。利用调查来确保给每个人表达意见的机会，即使是那些不愿在集体场合发言的人。


  ## 五个为什么


  团队在确定问题原因时可以使用的一个有用技巧是“五个为什么”技术。这是丰田在开发其制造流程时使用的一种技术。该技术递归地追问问题的原因，直到找到一个可操作的根本原因。其洞见在于，对问题原因的初步解释往往过于肤浅，无法触及真正的根源。


  例如，在必应本地数据中，我们遇到了以下问题：


  问题：客户报告说他们无法通过电话联系到商家。


  五个为什么：


  1.  为什么他们联系不到商家？拨打网站上显示的电话号码，发现号码是错误的。


  2.  为什么电话号码是错误的？在找到商家正确的电话号码后，商家表示他们最近更改了电话号码。


  3.  为什么我们没有更新后的电话号码？在检查我们的数据源提供商后，我们发现其中两个提供商有新的号码，但它没有被选为最终的电话号码。


  4.  为什么我们没有选择正确的电话号码？在评估号码选择模型时，我们发现模型选对了号码，但系统中存在一个修正项覆盖了模型的结果。


  5.  为什么系统会覆盖模型的结果？系统本应使一个过时的修正项失效，该修正项比来自可信提供商的新正确值更旧。


  在这个案例中，通过深入运用“五个为什么”（有时你可能需要超过五个），我们能够确定错误电话号码的真正根源在于一个修正系统，该系统本应意识到，旧的修正项的价值低于来自可信数据提供商的新数据更新。




  ## 调整指标


  除了敏捷宣言中描述的“调整行为”之外，持续调整指标也同样重要。随着时间的推移，团队自然会在指标上变得越来越好。大多数指标充其量只是用户体验的数值近似值。这种近似值可以作为优化的有效衡量标准，但随着你在某个指标上越来越接近“完美”，这种近似值可能会开始失真。在某个时刻，值得调整指标，使其更能代表客户体验。


  例如，我们在本书中提到过，必应本地数据团队使用的指标之一是一个名为 Q 的复合指标。该指标聚合了几个内容指标：商家名称精确度、电话号码精确度与覆盖率、地址精确度与覆盖率以及营业时间精确度。我们根据自有数据和谷歌的数据计算了这个指标。随着时间的推移，我们的“Q”值开始接近谷歌的
  Q 值。但从用户体验的角度来看，这个数字并未反映必应与谷歌之间的实际体验差异——尽管我们在某些方面做得更好，但常常仍有不足。“Q”指标未能恰当地体现必应与谷歌之间的差距。


  我们进行了一系列分析，开发了一个名为 Qv2 的新指标。Qv2 纳入了我们意识到对衡量用户体验至关重要的许多额外因素，例如重复率、商家经纬度的精确度与覆盖率。Qv2
  还增加了更具体的评判指南，以进一步调整我们判断名称、电话号码或地址是否正确的方式。例如，对于像麦当劳这样的连锁企业，如果我们只能指向麦当劳的根域名（[`www.mcdonalds.com`](http://www.mcdonalds.com)），我们不再给予满分，只有当
  URL 指向所查询商家的具体门店页面时（例如 [`www.mcdonalds.com/us/en-us/location/wa/bellevue/`](http://www.mcdonalds.com/us/en-us/location/wa/bellevue/)
  ...），才给予满分。


  ## 展望未来


  除了定期回顾过去、评估进展和需要改进的领域之外，定期展望未来、设定新目标并收紧业务目标和指标也同样有用。


  在我们的团队中，我们发现季度“产品团队会议”是一个有用的推动机制，可以帮助我们定期展望未来并修订团队计划。这是一个定期修订以下内容的机会：


  *   产品愿景（如第 5 章所述：积极主动的个体）

  *   顶层指标

  *   业务目标与目的

  *   工程系统目标

  *   流程目标

  *   线上站点目标


  令人惊讶的是，在许多团队中，这些事情在三个月内就可能发生巨大变化。因此，为团队准备一份最新的“主计划”文档非常有价值，该文档总结这些领域，每季度定期更新，并可供新团队成员或外部利益相关者参考。这可以简单到只是一个维基页面、一份
  PowerPoint 演示文稿或任何方便的形式——重要的是要有一种商定的方式来记录最新的产品团队主计划。


  ## 结论


  至此，我们已经积累了大量工具，能够反思如何提高效率并推动敏捷数据工程团队的改进。我们讨论了诸如回顾会议、数据复盘、质量评审、线上站点评审、工程评审和调查等工具。我们还讨论了如何使用“五个为什么”来正确找出团队问题的根本原因。指标只是用户体验的近似值，必须定期更新，以便随着时间的推移更好地反映用户体验。最后，定期召开团队会议，强制团队更新关于愿景、指标、业务目标、工程系统目标、流程目标和线上站点目标的书面主计划，是保持清晰聚焦于团队下一步需要实现目标的有效方法。




