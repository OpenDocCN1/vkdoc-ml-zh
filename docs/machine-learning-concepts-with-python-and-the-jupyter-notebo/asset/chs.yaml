- '# 7. 在 Jupyter Notebook 中进行 Python 编程


  在之前的章节中，我们学习了关于 Python 编程语言的所有知识。我们研究了它的优势，将其与其他一些语言进行了比较，并了解了它的特性如何使其成为机器学习中一种可靠的语言。


  在上一章中，我们熟悉了 Jupyter Notebook，并了解了为什么它可以被视为构建和执行训练机器程序的合适环境。我们还了解了 Jupyter Notebook
  应用程序的布局。


  在本章中，我们将获得将 Python 与 Jupyter Notebook 界面结合使用的实践经验，以有效地创建、检查和运行我们的机器学习模型。然而，在开始硬核编码之前，我们将从一些小规模程序开始，只是为了复习我们通用的编程知识并理解
  Python 的编码语法。


