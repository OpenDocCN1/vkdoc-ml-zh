  好了，大功告成！我们构建了第一个多层神经网络，它可以对图像进行分类，准确率接近 90%。\n\n任务时间\n\n我们刚刚完成了两个能够进行多类图像分类的神经网络的构建。其中一个是单层神经网络，另一个是多层神经网络。你能尝试交换数据集，看看模型准确率如何根据层数变化吗？完成之后，再尝试改变层数和迭代次数。你能达到的最高准确率是多少？\n\
  \n接下来，我们将探讨一个在本书开头学过的非常有趣的概念——卷积神经网络。\n你可能还记得，CNN 使用卷积层和池化层来处理给定数据。它们的优点在于能够轻松处理二维图像并检测重要特征。这就是它们经常被用于图像分类问题的原因。\n\
  让我们看看一些卷积神经网络在图像分类中的表现。\n\n程序 4：使用卷积神经网络进行服装分类（多层、多类）\n该模型的结构与之前的类似。唯一的主要区别在于，神经网络现在将包含卷积层和池化层。\n\
  \n结构\n\n以下是 CNN 模型进行图像分类的工作原理：\n\n1.  加载给定的图像数据集。\n\n2.  将数据划分为训练集和测试集。\n\n3.  根据我们指定的层数以及提供的激活函数，创建卷积神经网络。\n\
  \n4.  使用我们提供的参数创建最后的全连接层和输出层。\n\n5.  然后开始使用训练数据进行训练，以识别每张图像之间的相似性和差异性，并据此进行分类。\n\
  \n6.  最后，使用测试数据测试其准确率，以评估模型学习每张图像之间差异的效果。\n\n数据集\n本程序将使用的数据集是 Fashion MNIST 数据集。\n\
  \nAPI\n我们将使用 TensorFlow 中的 Keras API。\n\n激活函数\n这里我们将使用两种激活函数：\n\n1.  ReLU\n\n2.\
  \  Softmax\n\n优化器\n本神经网络将使用 Adam 优化器。\n\n程序\n\n**第 1 步：导入 TensorFlow 库和 Keras 工具。**\n\
  \n```\nimport tensorflow as tf\nfrom tensorflow.keras import datasets, layers, models\n\
  ```\n\n**第 2 步：加载 Fashion MNIST 数据集。**\n\n```\ndata = datasets.fashion_mnist\n(ip_train,\
  \ op_train), (ip_test, op_test) = data.load_data()\n```\n\n**第 3 步：检查图像的形状。**\n\n\
  ```\nprint(ip_train.shape, ip_test.shape)\n```\n\n**第 4 步：重塑输入值。**\n\n```\nip_train\
  \ = ip_train.reshape((60000, 28, 28, 1))\nip_test = ip_test.reshape((10000, 28,\
  \ 28, 1))\nprint(ip_train.shape, ip_test.shape)\n```\n\n现在，当我们显示重塑后的数据时，它将显示四个维度。\n\
  **第 5 步：准备数据。**\n\n再次强调，我们必须通过除以 255 来对数据进行归一化。\n\n```\nip_train, ip_test = ip_train\
  \ / 255.0, ip_test / 255.0\n```\n\n**第 6 步：构建卷积神经网络。**\n\n这就是主要区别所在。由于我们正在构建一个 CNN\
  \ 模型，神经网络将需要卷积层和池化层。\n\n```\nmodel=models.Sequential()\nmodel.add(layers.Conv2D(32,(3,3),\
  \ activation=\"relu\", input_shape=(28,28,1)))\nmodel.add(layers.MaxPooling2D((2,2)))\n\
  model.add(layers.Conv2D(64,(3,3), activation=\"relu\"))\nmodel.add(layers.MaxPooling2D((2,2)))\n\
  model.add(layers.Conv2D(64,(3,3), activation=\"relu\"))\n```\n\n如你所见，我们使用了三个卷积层和两个最大池化层。我们对所有卷积层都使用\
  \ ReLU 激活函数。在将图像输入模型之前，也无需将其展平，因为 CNN 可以处理二维数据。这就是我们使用`Conv2D`而不是`Conv1D`的原因。\n\
  第一个卷积层包含 32 个滤波器或卷积核，每个大小为 3x3。该层的输出被传递到大小为 2x2 的滤波器池化层。同样，输出会依次传递到后续每一层，直到到达最后一个卷积层。\n\
  **第 7 步：添加最后的全连接层和输出层。**\n现在，我们必须添加最后的全连接层，然后是输出层。\n在这里，我们需要先将输入展平，然后再将其输入到全连接层。\n\
  全连接层将使用 ReLU 激活函数，并包含 64 个神经元。\n\n最后一层称为分类层。它使用 Softmax 激活函数，并将包含十个神经元，对应于我们将获得的输出或类别的数量。\n\
  \n```\nmodel.add(layers.Flatten())\nmodel.add(layers.Dense(64, activation=\"relu\"\
  ))\nmodel.add(layers.Dense(10, activation=\"softmax\"))\n```\n\n**第 8 步：编译模型。**\n\
  \n```\nmodel.compile(optimizer = 'adam',\nloss = 'sparse_categorical_crossentropy',\n\
  metrics = ['accuracy'])\n```\n\n**第 9 步：查看模型。**\n\n```\nmodel.summary()\n```\n\n\
  我们将获得 CNN 模型的摘要，如图 11-14 所示。\n\n![../images/491271_1_En_11_Chapter/491271_1_En_11_Fig14_HTML.jpg](img/491271_1_En_11_Fig14_HTML.jpg)\n\
  \n图 11-14\nCNN 模型摘要\n\n**第 10 步：训练模型。**\n\n```\nmodel.fit(ip_train, op_train, epochs\
  \ = 5)\n```\n\n这将开始训练模型，共进行五个迭代周期，如图 11-15 所示。\n\n![../images/491271_1_En_11_Chapter/491271_1_En_11_Fig15_HTML.jpg](img/491271_1_En_11_Fig15_HTML.jpg)\n\
  \n图 11-15\n训练模型\n\n**第 11 步：测试模型。**\n\n```\nmodel.evaluate(ip_test, op_test, verbose\
  \ = 1)\n```\n\n这将测试模型并显示其准确率，如图 11-16 所示。\n\n![../images/491271_1_En_11_Chapter/491271_1_En_11_Fig16_HTML.jpg](img/491271_1_En_11_Fig16_HTML.jpg)\n\
  \n图 11-16\n测试 CNN 模型\n\n大功告成！使用卷积神经网络的图像分类模型现已完成。你可以尝试添加或移除层，以及更改参数。\n让我们再看一个 CNN\
  \ 模型的例子。\n\n\n\n程序 5：使用卷积神经网络（多层、多类）进行手写识别  \n结构、API、激活函数和优化器将保持不变。不过，我们将尝试用另一个数据集来运行此程序。这次，我们还会添加推理代码。\n\
  \n数据集  \n本程序将使用的数据集是常规的 MNIST 数据集。\n\n程序  \n\n**第 1 步：导入 TensorFlow 库和 Keras 工具。**\
  \  \n\n```\nimport tensorflow as tf\nfrom tensorflow.keras import datasets, layers,\
  \ models\n```\n\n**第 2 步：加载 MNIST 数据集。**  \n\n```\ndata = datasets.mnist\n(ip_train,\
  \ op_train), (ip_test, op_test) = data.load_data()\n```\n\n**第 3 步：重塑输入值。**  \n\n\
  ```\nip_train = ip_train.reshape((60000, 28, 28, 1))\nip_test = ip_test.reshape((10000,\
  \ 28, 28, 1))\nprint(ip_train.shape, ip_test.shape)\n```\n\n**第 4 步：准备数据。**  \n\n\
  ```\nip_train, ip_test = ip_train / 255.0, ip_test / 255.0\n```\n\n**第 6 步：构建卷积神经网络。**\
  \  \n再次强调，我们必须添加卷积层和最大池化层。  \n\n```\nmodel=models.Sequential()\nmodel.add(layers.Conv2D(30,(3,3),\
  \ activation=\"relu\", input_shape=(28,28,1)))\nmodel.add(layers.MaxPooling2D((2,2)))\n\
  model.add(layers.Conv2D(60,(3,3), activation=\"relu\"))\nmodel.add(layers.MaxPooling2D((2,2)))\n\
  model.add(layers.Conv2D(90,(3,3), activation=\"relu\"))\n```\n\n**第 7 步：添加最终的密集层、丢弃层和输出层。**\
  \  \n\n```\nmodel.add(layers.Flatten())\nmodel.add(layers.Dense(64, activation=\"\
  relu\"))\nmodel.add(layers.Dropout(0.5))\nmodel.add(layers.Dense(10, activation=\"\
  softmax\"))\n```\n\n**第 8 步：编译模型。**  \n\n```\nmodel.compile(optimizer = 'adam',\n\
  loss = 'sparse_categorical_crossentropy',\nmetrics = ['accuracy'])\n```\n\n**第 9\
  \ 步：查看模型。**  \n\n```\nmodel.summary()\n```\n\n**第 10 步：训练模型。**  \n\n```\nmodel.fit(ip_train,\
  \ op_train, epochs = 5)\n```\n\n**第 11 步：测试模型。**  \n\n```\nmodel.evaluate(ip_test,\
  \ op_test, verbose = 1)\n```\n\n**第 12 步：进行推理。**  \n将 Matplotlib 库导入 Jupyter notebook，如下所示：\
  \  \n\n```\nimport matplotlib.pyplot as plt\n%matplotlib inline\n```\n\n选择测试图像：\
  \  \n\n```\ntest_image=ip_test[180]\n```\n\n绘制图像：  \n\n```\nplt.imshow(test_image.reshape(28,28))\n\
  ```\n\n我们将得到如图 11-17 所示的图像。  \n\n![../images/491271_1_En_11_Chapter/491271_1_En_11_Fig17_HTML.jpg](img/491271_1_En_11_Fig17_HTML.jpg)\
  \  \n\n图 11-17 绘制图像  \n\n导入 Numpy 库和 Keras 下的`image`函数：  \n\n```\nimport numpy as\
  \ np\nfrom tensorflow.keras.preprocessing import image\n```\n\n将测试图像转换为数组并重塑：  \n\
  \n```\ntest_image = image.img_to_array(test_image)\ntest_image = test_image.reshape(1,28,28,1)\n\
  ```\n\n让模型预测图像的类别：  \n\n```\nresult = model.predict(test_image)\nresult\n```\n\n\
  对结果进行四舍五入，并找出其中的最大值：  \n\n```\nnp.around(result)\n(np.around(result)).argmax()\n\
  ```\n\n我们将得到输出为 1。这表明模型正确预测了图像的类别。  \n大功告成！我们的第二个 CNN 模型现已完成。通过更改参数，我们可以对其进行调整，看看准确率能有多高。\
  \  \n现在，让我们尝试最后一个程序来挑战一下自己。这次，我们将使用一个全新的数据集，即 CIFAR-10。\n\n程序 6：使用卷积神经网络（多层、多类）对\
  \ CIFAR-10 进行图像分类  \n在开始此程序之前，我们先了解一下将要使用的数据集。\n\n数据集  \n本程序将使用的数据集是 CIFAR-10，其全称为加拿大高级研究院（Canadian\
  \ Institute For Advanced Research）。它包含 60,000 张彩色图像，每张图像大小为 32x32。共有十个不同的类别，每个类别有\
  \ 6,000 张图像。其中 50,000 张为训练图像，10,000 张为测试图像。  \n这十个不同的类别分别是：飞机、汽车、鸟、猫、鹿、狗、青蛙、马、船和卡车。研究人员可以借助该数据集快速训练机器学习和计算机视觉模型。\
  \  \n其他方面与之前的 CNN 程序类似，因此我们直接开始编写程序。既然现在创建模型所涉及的不同步骤应该已经清晰明了，我们就不必逐步讲解此程序了。我们将直接逐行输入代码。\n\
  \n程序  \n\n让我们从编写构建、训练和测试模型的代码开始，如下所示：  \n\n```\nimport tensorflow as tf\nfrom tensorflow.keras\
  \ import datasets, layers, models\nfrom tensorflow.keras.datasets import cifar10\n\
  (ip_train, op_train), (ip_test, op_test) = cifar10.load_data()\nprint(ip_train.shape,\
  \ ip_test.shape)\nip_train = ip_train.reshape(ip_train.shape[0], 32, 32, 3)\nip_test\
  \ = ip_test.reshape(ip_test.shape[0], 32, 32, 3)\nip_train, ip_test = ip_train /\
  \ 255.0, ip_test / 255.0\nmodel=models.Sequential()\nmodel.add(layers.Conv2D(32,(3,3),\
  \ activation=\"relu\", input_shape=(32,32,3)))\nmodel.add(layers.MaxPooling2D((2,2)))\n\
  model.add(layers.Conv2D(64,(3,3), activation=\"relu\"))\nmodel.add(layers.MaxPooling2D((2,2)))\n\
  model.add(layers.Conv2D(64,(3,3), activation=\"relu\"))\nmodel.add(layers.Flatten())\n\
  model.add(layers.Dense(64, activation=\"relu\"))\nmodel.add(layers.Dense(10, activation=\"\
  softmax\"))\nmodel.compile(optimizer = 'adam',\nloss = 'sparse_categorical_crossentropy',\n\
  metrics = ['accuracy'])\nmodel.summary()\nmodel.fit(ip_train, op_train, epochs =\
  \ 10)\nmodel.evaluate(ip_test, op_test, verbose = 2)\n```\n\n现在让我们编写推理代码：  \n\n\
  ```\nimport matplotlib.pyplot as plt\n%matplotlib inline\ntest_image=ip_test[20]\n\
  ```\n\n请记住，方括号内的数字可以根据需要更改，以选择不同的测试图像。  \n\n```\nplt.imshow(test_image.reshape(32,32,3))\n\
  import numpy as np\nfrom tensorflow.keras.preprocessing import image\nclasses =\
  \ [\"airplane\", \"automobile\", \"bird\", \"cat\", \"deer\", \"dog\", \"frog\"\
  , \"horse\", \"ship\", \"truck\"]\ntest_image = image.img_to_array(test_image)\n\
  test_image = test_image.reshape(1,32,32,3)\nresult = model.predict(test_image)\n\
  result\nnp.around(result)\nn=(np.around(result)).argmax()\nprint(classes[n])\n```\n\
  \n当我运行推理时，得到了两种不同的结果：\n\n*   第一张测试图像是一匹马，模型能够正确识别该图像。\n*   第二张图像是一只鸟，但模型将其分类为飞机。\n\
  \n尝试更改测试图像，然后进行推理。你能得到准确的预测吗？\n\n任务时间  \n\n你可以在网上找到一些很棒的开源数据集，这些数据集可以轻松下载并用于非商业目的。尝试获取一些新数据集，并将其加载到你的\
  \ Jupyter notebook 中。然后，创建一个深度学习 CNN 模型来对图像进行分类。不断调整参数，添加或删除层，看看你能让模型达到多高的准确率！\n\
  \n大多数深度学习模型用于多类分类。然而，如果需要进行二元分类（即只有两个类别）呢？通常，这类模型用于答案为“是”或“否”的问题。例如：\n\n*   摩托车手是否戴着头盔？\n\
  *   灯泡是否亮着？\n*   这封电子邮件是否是垃圾邮件？\n\n话虽如此，让我们来学习一个使用卷积神经网络进行二元分类的程序。我们将使用的数据集是 Kaggle\
  \ 上的“狗与猫”数据集。\n\n\n\n程序 7：使用卷积神经网络进行狗猫分类（多层，二分类）\n在本程序中，我们将训练模型来区分狗和猫。这对人脑来说似乎是一项简单的任务，但对机器而言可能并不容易。还记得在程序\
  \ 1 中，我们使用了两个预训练模型对一张小猫图片进行推理吗？对于第一张图片，它们正确识别为埃及猫。然而，对于第二张图片，一个模型预测该图片是吉娃娃，而另一个模型则说它是彭布罗克威尔士柯基犬。\n\
  造成这种情况的原因，可能是因为这三个品种都有尖耳朵和小五官。虽然这对我们来说差别不大，但对人工智能机器却影响巨大，因为每一个微小的特征对于深度学习模型的学习过程都至关重要。\n\
  让我们来看看我们的数据集。\n\n数据集\n“狗猫分类”数据集可以在 Kaggle 网站上找到。它总共包含 25,000 张狗和猫的图片。虽然我们不知道这些图片最初是如何划分的，但我们将在程序运行过程中找出答案。\n\
  \n程序\n\n**步骤 1：将所有必需的库和函数导入 Jupyter Notebook。**\n\n```\nimport tensorflow as tf\n\
  from tensorflow.keras.models import Sequential\nfrom tensorflow.keras.layers import\
  \ Conv2D\nfrom tensorflow.keras.layers import MaxPooling2D\nfrom tensorflow.keras.layers\
  \ import Flatten\nfrom tensorflow.keras.layers import Dense\nimport os\n```\n\n\
  `os`模块允许用户与操作系统进行交互。\n这次，我们将先创建模型，然后再下载数据集。\n**步骤 2：开发 CNN 模型并编译。**\n\n这里，我们将模型称为`classifier`。我们可以随意命名，只要阅读代码的人能轻松理解即可。\n\
  \n```\nclassifier = Sequential()\nclassifier.add(Conv2D(64,(3,3),input_shape = (64,64,3),\
  \ activation = 'relu'))\nclassifier.add(MaxPooling2D(pool_size = (2,2)))\nclassifier.add(Conv2D(64,(3,3),\
  \ activation = 'relu'))\nclassifier.add(MaxPooling2D(pool_size = (2,2)))\nclassifier.add(Conv2D(64,(3,3),\
  \ activation = 'relu'))\nclassifier.add(MaxPooling2D(pool_size = (2,2)))\nclassifier.add(Flatten())\n\
  classifier.add(Dense(units = 128, activation = 'relu'))\nclassifier.add(Dense(units\
  \ = 1, activation = 'sigmoid'))\nclassifier.compile(optimizer = 'adam', loss = 'binary_crossentropy',\
  \ metrics = ['accuracy'])\n```\n\n**步骤 3：转换导入的数据。**\n\n```\nfrom tensorflow.keras.preprocessing.image\
  \ import ImageDataGenerator\ntrain_datagen = ImageDataGenerator(\nrescale=1./255,\n\
  shear_range=0.2,\nzoom_range=0.2,\nhorizontal_flip=True)\ntest_datagen = ImageDataGenerator(rescale=1./255)\n\
  ```\n\n**步骤 4：下载数据集。**\n\n数据集需要从特定链接下载。在这段代码中，我们告诉程序从给定的 URL 下载数据，然后将其存储在我们的系统上。\n\
  \n```\n_URL = 'https://storage.googleapis.com/mledu-datasets/cats_and_dogs_filtered.zip'\n\
  path_to_zip = tf.keras.utils.get_file('cats_and_dogs.zip', origin=_URL, extract=True)\n\
  PATH = os.path.join(os.path.dirname(path_to_zip), 'cats_and_dogs_filtered')\n```\n\
  \n**步骤 5：设置目录。**\n\n我们需要为训练数据和测试数据设置不同的目录，然后相应地分离出猫和狗的图片。\n\n```\ntrainingdir =\
  \ os.path.join(data_path, 'train')\ntestingdir = os.path.join(data_path, 'validation')\n\
  # 存放训练猫图片的目录\ncats_train = os.path.join(trainingdir, 'cats')\n# 存放训练狗图片的目录\ndogs_train\
  \ = os.path.join(trainingdir, 'dogs')\n# 存放测试猫图片的目录\ncats_test = os.path.join(testingdir,\
  \ 'cats')\n# 存放测试狗图片的目录\ndogs_test = os.path.join(testingdir, 'dogs')\n```\n\n**步骤\
  \ 6：查找每个目录中的元素数量。**\n\n我们首先查找每个目录中的元素数量，然后显示这些数值。\n\n\n```markdown\n```\ncats_train_num\
  \ = len(os.listdir(cats_train))\ndogs_train_num = len(os.listdir(dogs_train))\n\
  cats_test_num = len(os.listdir(cats_test))\ndogs_test_num = len(os.listdir(dogs_test))\n\
  train_tot = cats_train_num + dogs_train_num\ntest_tot = cats_test_num + dogs_test_num\n\
  print(cats_train_num)\nprint(dogs_train_num)\nprint(cats_test_num)\nprint(dogs_test_num)\n\
  print(train_tot)\nprint(test_tot)\n```\n\n我们应该得到如下输出：\n\n*   1000\n\n*   1000\n\n\
  *   500\n\n*   500\n\n*   2000\n\n*   1000\n\n**步骤 7：加载训练数据和测试数据，并显示标签映射。**\n我们加载训练和测试图像目录，并根据需要添加批次大小、目标尺寸和类别模式。这里，我们将批次大小设置为\
  \ 128，目标尺寸设置为 64x64。\n\n对于训练数据：\n\n```\ntrain_data = train_datagen.flow_from_directory(batch_size=128,\n\
  directory=trainingdir,\ntarget_size=(64, 64),\nclass_mode='binary')\n```\n\n这将产生如下输出：\n\
  \n*   `Found 2000 images belonging to 2 classes.`\n\n对于测试数据：\n\n```\ntest_data =\
  \ test_datagen.flow_from_directory(batch_size=128,\ndirectory=testingdir,\ntarget_size=(64,\
  \ 64),\nclass_mode='binary')\n```\n\n这将产生如下输出：\n\n*   `Found 1000 images belonging\
  \ to 2 classes.`\n\n然后，我们显示这两个类别的数字标识，如下所示：\n\n```\nlabel_map = (train_data.class_indices)\n\
  print(label_map)\n```\n\n这将给我们如下输出：\n\n```\n{'cats': 0, 'dogs': 1}\n```\n\n因此，`0`\
  \ 指的是 `cats` 类别，而 `1` 指的是 `dogs` 类别。\n\n**步骤 8：训练模型。**\n\n我们现在可以开始训练模型了。这次我们将运行三十个周期：\n\
  \n```\nclassifier.fit(\ntrain_data,\nepochs=30,\nvalidation_data=test_data)\n```\n\
  \n三十个周期后，我得到了 77% 的验证准确率。你可以尝试改变周期数，看看这对你的模型是否有显著影响。\n\n模型训练完成后，我们可以进行推理，看看模型的效果如何。\n\
  \n**步骤 9：进行推理。**\n在此过程中，我们将使用两张自己的图片：一张是猫，一张是狗。\n\n我们将首先导入必要的包，如下所示：\n\n```\nimport\
  \ numpy as np\nfrom tensorflow.keras.preprocessing import image\n```\n\n现在，让我们将图像加载到程序中。这些图像已经保存在与程序相同的文件夹中，因此无需添加完整的文件路径。只需文件名即可。\n\
  \n```\ntest_image_1= image.load_img('Dog.jpeg', target_size = (64,64))\ntest_image_2=\
  \ image.load_img('Cat.jpeg', target_size = (64,64))\n```\n\n然后，我们可以分别显示测试图像，如图 11-18\
  \ 和图 11-19 所示。\n\n![../images/491271_1_En_11_Chapter/491271_1_En_11_Fig19_HTML.jpg](img/491271_1_En_11_Fig19_HTML.jpg)\n\
  \n图 11-19 一张猫的图像\n\n![../images/491271_1_En_11_Chapter/491271_1_En_11_Fig18_HTML.jpg](img/491271_1_En_11_Fig18_HTML.jpg)\n\
  \n图 11-18 一张狗的图像\n\n```\ntest_image_1\n```\n\n```\ntest_image_2\n```\n\n现在我们输入剩余的代码，如下所示：\n\
  \n```\ntest_image_1 = image.img_to_array(test_image_1)\ntest_image_2 = image.img_to_array(test_image_2)\n\
  test_image_1 = test_image_1.reshape(1,64,64,3)\ntest_image_2 = test_image_2.reshape(1,64,64,3)\n\
  result1 = model.predict(test_image_1)\nresult2 = model.predict(test_image_2)\nprint(result1,\
  \ result2)\n```\n\n现在，为了打印预测结果，我们为第一张图像输入以下代码：\n\n```\nif result1 == 1:\nprediction1\
  \ = 'dog'\nelse:\nprediction1 = 'cat'\nprint(prediction1)\n```\n\n这将给出以下输出：\n\n\
  ```\n'dog'\n```\n\n现在当我们运行以下代码时：\n\n```\nif result2 == 1:\nprediction2 = 'dog'\n\
  else:\nn2 = 'cat'\nprint(prediction2)\n```\n\n我们得到以下输出：\n\n```\n'cat'\n```\n\n就是这样！二元神经网络已经准备好了。我们可以不断修改代码的不同部分来提高准确率，直到获得满意的结果。\n\
  \n注意\n```\n\n\n在某些情况下，你可能还需要安装“pillow”库（Python 图像库，缩写为“PIL”），因为它为处理各种格式的图像提供了支持。使用\
  \ `pip` 可以轻松安装它：`pip install pillow`\n\n这些机器学习模型的一大优点是，对于所有类型的数据，其结构几乎保持不变。我们需要知道的是如何在将数据输入模型之前准备和处理数据。当我们自己尝试这些程序，使用不同的数据集并修改输入层和数值时，整个过程会变得容易得多。只要别忘了持续练习，这将帮助你提高技能并精通你所做的事情。\n\
