  图 7-34


  访问帮助菜单


  从这个菜单中，我们可以选择需要帮助的选项。如您所见，帮助选项包括与 Jupyter Notebook 应用程序相关的主题，以及与 Python 库相关的主题。


  ## 总结


  好了，就是这样！现在我们对 Jupyter Notebook 的用户界面熟悉多了。我们还快速了解了一些与编程相关的重要概念，并学习了如何使用 Python 编写基本函数，例如列表和循环。


  掌握了这些知识后，我们终于可以开始进入 Python 的机器学习库了。我们已经了解到 Python 拥有大量可以调用到程序中的库。接下来，我们将重点关注一个越来越受欢迎的库。多年来，它因其独特的功能而获得了众多开发者的认可，这些功能使得机器学习过程变得更加轻松。这个库就是
  TensorFlow，在接下来的章节中，我们将使用它来编写我们的深度学习模型。


