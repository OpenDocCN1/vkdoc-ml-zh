  2.0，了解其显著特性，以及如何将代码从旧版本迁移到新版本的快速指南。最后一章将引导我们完成几个深度学习程序，在这些程序中，我们将使用 Python 和 Jupyter
  Notebook 界面中的 TensorFlow。这将帮助我们实践本书中学到的所有知识。


