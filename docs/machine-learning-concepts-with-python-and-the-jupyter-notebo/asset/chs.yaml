  ### 监督学习算法的应用


  1.  **垃圾邮件检测：** 还记得我们之前读到的第一个电子邮件分类示例吗？这就是借助监督学习完成的。


  2.  **生物信息学：** 这是一种记录个人生物信息以备后续使用的方法。最常见的例子之一是我们手机上的安全系统，它可以扫描我们的指纹并据此授予我们访问权限。


  ## 无监督学习算法


  无监督学习算法的目标是发现所提供数据集中可能存在的模式。该算法事先不了解数据中存在的模式和标签。


  有多种算法可以借助无监督学习来解决机器学习问题。这些算法可以分为以下几类：


  *   **聚类分析：** 这种方法找出数据之间的相似性，然后将共同的数据分组到簇中。


  *   **降维：** 这种方法试图降低数据的复杂性，同时保持数据的相关性。


  现在让我们看看两种常用的无监督学习算法：K-均值聚类和主成分分析。


  ### K-均值聚类


  K-均值聚类方法从总共 *n* 个观测值中形成 *k* 个簇。每个观测值都将属于均值最近的簇。它看起来像图 2-4。


  ![../images/491271_1_En_2_Chapter/491271_1_En_2_Fig4_HTML.jpg](img/491271_1_En_2_Fig4_HTML.jpg)


  图 2-4


  K-均值聚类算法


  ### 主成分分析


  主成分分析使用正交变换，将一组可能相关的变量统计变换为一组线性不相关的变量，这些变量称为主成分。它用于降低数据的维度。它看起来像图 2-5。


  ![../images/491271_1_En_2_Chapter/491271_1_En_2_Fig5_HTML.jpg](img/491271_1_En_2_Fig5_HTML.jpg)


  图 2-5


  主成分分析算法


  ### 无监督机器学习算法的应用


  *异常检测* 是指识别某些与其他观测值不同的异常或观测值。这些异常也称为离群点。例如，通过检测信用卡的异常交易可以发现信用卡欺诈。


  *关联分析* 是指借助提供的数据识别不同观测值之间关联的过程。例如，在电子商务中，通过分析客户过去的购买记录，很容易判断出客户可能对哪种类型的产品感兴趣。


  任务时间


  对机器学习算法再多做一些研究。你甚至可以将它们相互比较，这将拓宽你对这些算法的理解，帮助你决定在未来的项目中应该使用哪一种。


  除了监督学习和无监督学习之外，还有两种不太为人所知的机器学习方法，如下所示：


  *   **半监督学习：** 这种方法使用一些有标签数据和大量无标签数据进行训练。


  *   **强化学习：** 这种方法类似于训练宠物。当机器给出期望的输出时，它会向机器发送正向信号，让它知道自己是正确的，并帮助它更好地学习。同样，如果机器提供了错误的输出，它会向机器发送负向信号。




  ## 机器学习的应用


  多年来，随着机器学习日益普及，爱好者们开始深入研究解决机器学习问题的不同方法。他们很快提出了不同类型的算法，这些算法被证明是最有效的，具体取决于你所使用的数据和参数。因此，这些算法得以在全球范围内应用。开发者可以轻松选择他们想要实现的方法，并相应地遵循算法。


  机器学习模型的结构根据其需求而有所不同。我们将在本书后面更深入地探讨机器学习模型的架构。


  现在，我们对机器学习有了基本了解，接下来看看它在现实世界中的一些应用，如下所示：


  *   **电子商务：** 机器学习可以通过推荐系统（向潜在客户推荐相关产品）、分析和预测（从过去的销售中学习并改善未来的销售）等来帮助提升在线销售额。


  *   **自动驾驶汽车：** 自动驾驶汽车将不再是未来的事物。它们已经存在，并且在几年内将面向所有人开放市场。


  *   **制造业：** 许多公司使用机器人以更快、更便捷的方式开发产品。这是因为机器人可以被编程为不知疲倦地工作，精度更高，成本更低。


  *   **医疗保健：** 人工智能技术已经取得了巨大进步，一个重要的证据就是它现在正被应用于医疗保健领域。一个非常有趣的应用是机械臂手术，顾名思义，就是使用机械臂进行手术。自
  1985 年首次使用 Arthrobot 机器人以来，这种手术已多次进行，以提高精度并减小切口。


  ## 总结


  我们现在知道了什么是机器学习，以及它如何借助数据科学技术来利用数据。我们了解了一些机器学习算法类型，并看到了它们目前在现实世界中的应用。随着我们技术的飞速发展，对机器学习的需求也在急剧增长。这呼唤着更好、更先进的机器学习方法。机器学习的一个此类分支是一种广泛使用的技术，称为深度学习。我们将在下一章中介绍它。


