  trans: "\n### 使用“pip install”安装 TensorFlow\n\n这种方法的好处在于我们几乎不需要做什么。我们只需输入一行代码，其余的一切都会自动完成。\n\
    \n要将 TensorFlow 安装到我们的环境中，请遵循以下步骤：\n\n![../images/491271_1_En_8_Chapter/491271_1_En_8_Fig4_HTML.jpg](img/491271_1_En_8_Fig4_HTML.jpg)\n\
    \n图 8-4\n\n进入正确的环境\n\n1.  打开 Anaconda 后，请确保你处于正确的环境中，而不是 base（根）环境。例如，这里我选择在 myenv\
    \ 环境中工作，如图 8-4 所示。\n\n![../images/491271_1_En_8_Chapter/491271_1_En_8_Fig5_HTML.jpg](img/491271_1_En_8_Fig5_HTML.jpg)\n\
    \n图 8-5\n\n启动 Jupyter Notebook\n\n1.  通过在工作环境中启动 Jupyter Notebook 应用程序来打开它，如图\
    \ 8-5 所示。\n\n![../images/491271_1_En_8_Chapter/491271_1_En_8_Fig6_HTML.jpg](img/491271_1_En_8_Fig6_HTML.jpg)\n\
    \n图 8-6\n\n打开一个 Python 3 Jupyter Notebook\n\n1.  在仪表盘中，点击“New”，然后选择打开一个新的 Python\
    \ 3 Notebook 的选项，如图 8-6 所示。\n\n1.  在出现的代码单元格中，输入以下代码行，以指示计算机开始使用 pip 安装 TensorFlow：\n\
    \n    ```\n    pip install tensorflow\n    ```\n\n    安装将开始。你会看到代码单元格下方出现一个框，显示大量内容，这些内容代表了我们单行代码背后正在发生的一切。代码单元格的左角会出现一个星号，表示代码仍在运行。一旦过程完成，星号就会消失，如图\
    \ 8-7 所示。\n\n    ![../images/491271_1_En_8_Chapter/491271_1_En_8_Fig7_HTML.jpg](img/491271_1_En_8_Fig7_HTML.jpg)\n\
    \n    图 8-7\n\n    安装 TensorFlow\n\n2.  安装完成后，我们可以检查并确认 TensorFlow 是否已正确安装。为此，首先重启内核。然后，输入以下内容：\n\
    \n    ```\n    import tensorflow as tf\n    ```\n\n这段简短的代码用于将 TensorFlow 库调用到\
    \ Jupyter Notebook 中。`tf` 被指定为该库的一个别名（我们将在下一章使用 TensorFlow 进行编码练习时看到更多相关内容）。\n\
    \n执行该单元格时不应出现任何错误，如图 8-8 所示。\n\n![../images/491271_1_En_8_Chapter/491271_1_En_8_Fig8_HTML.jpg](img/491271_1_En_8_Fig8_HTML.jpg)\n\
    \n图 8-8\n\nTensorFlow 已安装在系统上\n\n如果你的 notebook 在运行该命令时没有显示任何错误提示，那么恭喜你！你已成功在你的\
    \ Python 环境中安装了 TensorFlow。\n\nTensorFlow 还有一个功能，可以为用户提供轻松可视化数据所需的所有必要工具。这被称为\
    \ TensorBoard。\n\n## TensorBoard\n\n根据 TensorFlow 官方网站的说法，TensorBoard 是“TensorFlow\
    \ 的可视化工具包”。\n\n它是一个界面，可用于借助可视化技术更清晰地理解我们的数据和深度学习模型。\n\n它的一些应用包括以下内容：\n\n1.  可视化参数和指标\n\
    \n2.  可视化计算图\n\n3.  查看图表和图形\n\n4.  显示图片、文本或音频等媒体项目\n\n当你运行 TensorBoard 时，它看起来会像图\
    \ 8-9 所示。\n\n![../images/491271_1_En_8_Chapter/491271_1_En_8_Fig9_HTML.jpg](img/491271_1_En_8_Fig9_HTML.jpg)\n\
    \n图 8-9\n\nTensorBoard 示例\n\n图 8-9 展示了一个非常简单的图的 TensorBoard 面板。屏幕顶部的仪表盘选项卡因模型的组件而异。这里，我们只有一个仪表盘；即\
    \ Graph 仪表盘。现在，看一下图 8-10。\n\n![../images/491271_1_En_8_Chapter/491271_1_En_8_Fig10_HTML.jpg](img/491271_1_En_8_Fig10_HTML.jpg)\n\
    \n图 8-10\n\nTensorBoard 的各种选项卡\n\n这个导航栏显示了另外三个选项卡：Scalars、Distributions 和 Histograms。每个选项卡都指向相应的仪表盘视图，可用于研究和改进深度学习模型。\n\
    \n### 探索 TensorBoard 仪表盘\n\n有几种不同类型的仪表盘，我们可以访问并根据各自的目的使用它们。让我们来看一看。\n\n*   **Scalars：**\n\
    \n*   这向我们展示了训练过程中每个 epoch 内损失和准确率等指标发生的变化。它还允许我们跟踪不同的标量值。能够比较这些指标使我们能够找出模型中存在的任何问题，以便改进它。\n\
    \n*   **Graphs：**\n\n*   这向我们展示了模型的计算图。通过检查模型的图形表示，我们可以轻松检查其准确性和可靠性。这使得调试代码或更改其结构变得更加容易，从而提高模型的质量。\n\
    \n*   **Distributions：**\n\n*   这向我们展示了输入在模型训练过程中的分布情况。它帮助我们直观地检查权重和偏置值随时间的变化。这些参数在训练模型时极其重要，因此能够清晰理解它们是必要的。\n\
    \n*   **Histograms：**\n\n*   与 Distributions 仪表盘类似，这帮助我们直观地检查权重和偏置的值，但它是从三维角度出发，借助直方图来实现的。这些直方图表示与训练时间线相对应的变化数据，使我们能够决定是否需要对模型进行任何更改。\n\
    \n*   **Projector：**\n\n*   这用于可视化高维词嵌入。嵌入包括以数字形式表示单词，使得相似的单词具有相似的编码。\n\n*   **Text：**\n\
    \n*   这用于可视化文本数据。这些字符串可以是超链接、表格等形式。\n\n*   **Image：**\n\n*   这用于可视化图像数据。这些图像保存为\
    \ `.png` 文件。\n\n*   **Audio：**\n\n*   这用于可视化音频数据。它可以以可播放的音频小部件形式嵌入音频。\n\n因此，借助\
    \ TensorBoard，我们可以轻松地检查、修改和验证我们模型的工作情况。\n\nTensorBoard 还增加了一项主要服务于协作项目的新服务，允许人们免费分享他们的机器学习项目。这项服务称为\
    \ TensorBoard.dev。\n"
- fmt: "### TensorBoard.dev\n\n`TensorBoard.dev` allows users to host their projects\
    \ online, keep track of them, and share them with others. It is free, readily\
    \ available, and great for when different people from various parts of the world\
    \ need to work together online.\n\nIts benefits include the following:\n\n1. It\
    \ enables users to share their programs on a large scale.\n2. It allows users\
    \ to ask for help in case of any bugs or errors that they are unable to solve\
    \ on their own.\n3. It gives people the ability to share insights and research\
    \ with others.\n4. It is interactive, which helps others to have a better understanding\
    \ of the model.\n5. There is no requirement for any installation procedures. All\
    \ it needs is a sharable link.\n6. Free storage is provided, with a current limit\
    \ of 10 million data points per user.\n\n`TensorBoard.dev` thus makes it a less\
    \ tedious task to seek help from others or contribute to other people’s machine\
    \ learning projects.\n\n> **Note**  \n> All data that is uploaded to `TensorBoard.dev`\
    \ is publicly visible to anyone and everyone. Thus, we need to be cautious while\
    \ sharing information online. For example, personal information, user-specific\
    \ authentication codes, and so on must be avoided or hidden before releasing the\
    \ program.\n\n## Summary\n\nIn this chapter, we have learned about `TensorFlow`,\
    \ which is one of the top machine learning libraries used in `Python`. We have\
    \ seen what it is, how it was developed, why it is important to a programmer,\
    \ and how it works. We have recognized its competitors in the machine learning\
    \ world, its special features that make it stand out, as well as its disadvantages\
    \ so far.\n\nWe then got introduced to `pip`, and we learned how to install `TensorFlow`\
    \ with the help of this package managing tool and then verify that the installation\
    \ was done without any errors.\n\nWe finally had a brief overview of the `TensorBoard`\
    \ and its features, which comes in handy while visualizing our models. We also\
    \ had a look at the `TensorBoard.dev` tool, which allows us to share our machine\
    \ learning projects easily and free of cost.\n\nNow that we have some idea of\
    \ what we are going to be working with, we can begin exploring the various features\
    \ of the `TensorFlow` library to see how we can use it within `Python`, in `Jupyter\
    \ Notebook`, for our machine learning experiments.\n\n## Additional Information\n\
    \nFor more information on `TensorFlow`, check out the following information.\n\
    \n### TensorFlow Dev Summit\n\nThe `TensorFlow Dev Summit` is a huge event in\
    \ which developers from across the globe come together to discuss, learn, and\
    \ share with one another.\n\nThe developers spend time engaging in interactive\
