    method they want to implement and follow the algorithm accordingly.


    Machine learning models are structured differently, based on what is required
    of them. We will go a little deeper into the architecture of a machine learning
    model later on in this book.


    Now that we have some basic idea of what exactly machine learning is, let’s take
    a look at some of its present real-world uses, as follows:


    *   **E-Commerce:** Machine learning can help to boost online sales with the help
    of recommendation systems (that recommend relevant products to potential customers),
    analytics and predictions (to learn from past sales and improve future sales),
    etc.


    *   **Autonomous cars:** Cars that drive themselves will no longer be a thing
    of the future. They already exist, and in a few years will be available on the
    market for anyone and everyone to access.


    *   **Manufacturing:** Many companies use robots to develop their products in
    a quicker and more convenient manner. This is because robots can be programmed
    to work tirelessly, with more accuracy, and at less cost.


    *   **Healthcare** **:** AI technology has improved immensely, and a major piece
    of evidence of that is the fact that it is now being implemented in healthcare.
    One very interesting application is robotic arm surgery, where, as the name suggests,
    a robotic arm is used to conduct surgery. Starting with the use of the Arthrobot
    in 1985, this type of surgery has been conducted several times to facilitate increased
    precision and decreased incision.


    ## Summary


    We now know what machine learning is and how it makes use of data with the help
    of data science techniques. We have gone through some types of machine learning
    algorithms and have seen how they are applied in the world so far. With the rate
    at which our technology is advancing, the need for machine learning is growing
    immensely. This calls for better and more advanced methods of machine learning.
    One such part of machine learning is a widely used technique known as deep learning.
    We’ll cover that in the next chapter.


    # 3. Introduction to Deep Learning


    Machine learning for artificial intelligence sounds pretty interesting so far,
    doesn’t it? When I first heard about it, I thought it was something out of a science
    fiction movie. It’s so amazing how things used to be experienced only in *reel*
    life, and now they can be experienced in *real* life too!


    Oh, yes, that pun was definitely intended.


    Once machine learning took off in the world of technology, there was no stopping
    it. Every day, every minute, people began making new discoveries and developing
    newer models that worked better than the ones that came before. However, these
    machine learning models were still not good enough. They worked, don’t get me
    wrong. They were quite effective as well. But they just weren’t efficient enough.


    That was until people succeeded in developing a technique under machine learning
    that would help a machine to figure things out for itself, and thus solve extremely
    intricate problems with great accuracy. In fact, this technique became so popular
    it is now quite well known as an individual area under artificial intelligence
    (even though it is not separate from machine learning). It was soon given the
    name “deep learning.”


    In this chapter, we will see how this method of machine learning came about and
    why it is needed. We will also dive into the process involved in deep learning;
    that is, the working of neural networks. This will give us an understanding of
    why libraries like TensorFlow are important within a programming language, especially
    in the context of deep learning.


    ## Origins of Deep Learning


    *Deep learning is a branch of machine learning that uses artificial neural networks
    to help the machine to think about and respond to a particular problem*.


    The important thing to remember here is that, although it is very tempting to
    think of deep learning as an independent area under artificial intelligence, it
    is definitely not. It is very much a part of artificial intelligence, and is a
    subset of machine learning (Figure [3-1](#491271_1_En_3_Chapter.xhtml#Fig1)).


    ![../images/491271_1_En_3_Chapter/491271_1_En_3_Fig1_HTML.jpg](images/491271_1_En_3_Chapter/491271_1_En_3_Fig1_HTML.jpg)


    Figure 3-1


    Deep learning is a subset of machine learning within the artificial intelligence
    sphere


    Thus, we can say that deep learning is a subset of machine learning, which is
    a subset of artificial intelligence. Data science is like a common denominator
    here, as it is a necessary part of all three areas. The origins of deep learning
    can be credited to Walter Pitts and Warren McCulloch.


    Walter Pitts was a logician in computational neuroscience, while Warren McCulloch
    was a neurophysiologist and cybernetician.


    In the year 1943, they created a computer model that was inspired by the neural
    networks present in the human brain. They developed something called threshold
    logic, which was a combination of mathematics and algorithms that compared the
    total input with a certain threshold. This enabled them to recreate the process
    of thinking, just as it happens in the brain. This was a breakthrough that led
    to many more deep learning innovations.


    Let us now learn about a very important aspect of it known as neural networks.


    ## Neural Networks


    The neural network, or artificial neural network, was inspired by and modeled
    after the biological neural network. These networks, like the human brain, learn
    to perform specific tasks without being explicitly programmed.


    A neural network is composed of a series of neurons that are connected together
    to form a type of network, hence the name neural network. A neuron, or an artificial
    neuron, is the fundamental unit of a neural network. It is a mathematical function
    that replicates the neurons in the human brain, as you can see in Figure [3-2](#491271_1_En_3_Chapter.xhtml#Fig2).
    Table [3-1](#491271_1_En_3_Chapter.xhtml#Tab1) provides a comparison of biological
    and artificial neurons.


    Table 3-1


    Comparison of a Biological Neuron and an Artificial Neuron


    | Biological Neuron | Artificial Neuron |

    | --- | --- |

    | It receives information in the form of electrical signals. | It receives information
    in the form of numerical values. |

    | Literally speaking, the brain consists of about 86 billion biological neurons.
    | A neural network can consist of a maximum of about 1,000 artificial neurons.
    |

    | The general composition is a cell body, dendrites, and axon. | The general composition
    is the weights and bias, the net input function, and the activation function.
    |


    ![../images/491271_1_En_3_Chapter/491271_1_En_3_Fig2_HTML.jpg](images/491271_1_En_3_Chapter/491271_1_En_3_Fig2_HTML.jpg)


    Figure 3-2


    A biological neuron and an artificial neuron


    Note


    A perceptron is nothing but an artificial neuron. In deep learning, the terms
    *perceptron* and *neuron* are used interchangeably.


    ## Working of an Artificial Neuron (Perceptron)


    The perceptron follows a particular flow of steps in order to achieve its desired
    output. Let’s go through these steps one by one to understand how a perceptron
    works.


    ### Step 1: Accepting Inputs


    The perceptron accepts inputs from the user in the form of digital signals provided
    to it. These inputs are the “features” that will be used for training the model.
    They are represented by `x(n)`, where `n` is the number of the feature. These
    inputs are then fed to the first layer of the neural network through a process
    called forward propagation.'
