    In the previous chapter, we learned about Python. We also had a glance at how
    we can use Python in its REPL shell to write our code. This Python shell, however,
    is not the most recommended tool to use when it comes to massive machine learning
    programming. This is why we have developed applications like Jupyter Notebook,
    which aid in such programming requirements.


    Jupyter Notebook is the brainchild of Project Jupyter, which is a non-profit organization
    founded by Fernando Pérez. It was created with the objective of developing open
    source software and providing services that allow multiple languages to interact
    with one another for effective computing.


    Jupyter Notebook is an open source web-based application that allows users to
    create, edit, run, and share their code with ease. This application gets its name
    from the main languages that it supports: Julia, Python, and R.


    To fully appreciate Jupyter Notebook, let us first take a look at what a “notebook”
    is with regard to programming.


    ## Understanding the Notebook Interface


    A computational notebook or a notebook interface, or quite simply a notebook,
    is used for literate programming, where we add a comprehensive explanation along
    with our program. It is a virtual notebook; i.e., it has a notebook-style GUI
    that provides a word processing software’s functionality, along with a kernel
    and a shell.


    ### A Brief History of the Notebook


    The notebook interface was first introduced around 1988, when Wolfram Mathematica
    1.0 was released on the Macintosh. This system allowed users to create and edit
    notebook interfaces through its front-end GUI.


    Then came Maple, released for Macintosh with version 4.3\. It provided a GUI in
    the style of a notebook, which became a highly acclaimed interface for programming.


    As the notebook began to grow in demand, people soon began to adapt notebook-styled
    kernels and backends for other programming languages, such as Python, MATLAB,
    SQL, and so on. Thus, the computational notebook became quite popular among coders.


    ### Features of a Notebook


    The generic features of a notebook are as follows:


    1.  It allows us to add cells of code, which make debugging and programming easier.


    2.  It can be used to display visual representations of data.


    3.  It allows us to add text in between each cell, which makes it easier for the
    coder to explain the function of each line of code.


    4.  Items within a notebook can easily be rearranged for narrative purposes and
    better readability.


    5.  It can be used as a tool for live presentations.


    6.  It can be used to create interactive reports on collected data and analytical
    results.


    ### Commonly Used Notebooks


    Some commonly used open-source notebooks include the following:


    1.  Jupyter Notebook


    2.  IPython


    3.  Apache Spark Notebook


    4.  Apache Zeppelin


    5.  JupyterLab


    6.  R Markdown


    ## An Overview of Jupyter Notebook


    As mentioned before, Jupyter Notebook is a web-based application developed by
    Project Jupyter. Its aim is to enable users to, as stated on the official website,
    *“create and share documents that contain live code, equations, visualizations
    and narrative text.”*


    Jupyter Notebook was developed in 2014 as a spin-off of the original IPython,
    which is a command shell used to carry out interactive coding. With the release
    of Jupyter Notebook, IPython found itself competing with it, to an extent. It
    still remained as a kernel for Jupyter and as a shell for Python, but everything
    else came under Jupyter Notebook.


    Fun Fact


    Jupyter Notebook was originally known as IPython Notebook, since it was conceived
    from IPython.


    The official website of Project Jupyter states that Jupyter Notebook can support
    over forty programming languages. Each project is stored as a notebook consisting
    of several cells of code, graphs, texts, and equations, which can be altered easily.
    These notebooks can also be conveniently distributed to others.


    ### Features of Jupyter Notebook


    Apart from the generic characteristics of a computational notebook, Jupyter Notebook
    has the following key features:


    1.  Each Jupyter Notebook is a JSON document. JSON is a language-independent data
    format that is derived from JavaScript. It uses human-readable text to transmit
    data containing arrays or attribute–value pairs.


    2.  Each Jupyter Notebook is usually saved with a `.ipynb` extension.


    3.  Jupyter Notebook is similar in style to other interfaces that originated years
    before it, including Maple and Mathematica (from the 1980s) and SageMath (from
    the 2000s).


    4.  Jupyter Notebook was released under the modified BSD license, which provides
    users with minimum limitations in the usage and distribution of the software.


    5.  Jupyter Notebooks can easily be shared with others through email, Dropbox,
    GitHub, and the Jupyter Notebook Viewer.


    6.  Jupyter Notebook is, at present, completely free to use, and it is intended
    to remain free for anyone to use at any time.'
