  trans: '

    ### 数据分析


    原始数据可以通过分析来观察趋势，并基于这些趋势得出结论。因此，*数据分析是指对数据进行检验，以从中获取洞见，并据此进行推断和得出结论*。


    它遵循若干步骤，并包含多种方法，这些方法有助于提高流程效率并获得预期结果。它运用了多种统计和数学技术。


    数据分析主要有四种类型，如下所示：


    1.  **描述性分析**：用于解释已经发生的情况。例如，可用于描述公司当前的业绩表现。


    2.  **规范性分析**：用于预测未来会发生什么。例如，可根据公司过往业绩来预测其利润。


    3.  **诊断性分析**：用于确定某事发生的原因。例如，可用于理解公司为何可能出现亏损。


    4.  **预测性分析**：用于找出需要发生什么，即需要采取什么行动。例如，可用于制定更好的策略和想法，帮助公司重回正轨并再次盈利。


    数据分析可应用于以下领域：


    *   医疗保健


    *   能源管理


    *   旅行


    *   金融


    大数据和数据分析各自都是数据科学中非常复杂的部分，因此对它们的需求巨大，尤其是在就业方面。通过这些方法获得的数据随后可用于机器学习及相关领域。


    根据不同的用例，可以从多种来源获取数据。在下一节中，我们将介绍一些用于数据收集的重要方法。


    ## 数据收集


    数据无非就是事实和数字，当它们汇集在一起时，就能产生一些信息。这些数据可以来自多种来源，包括：


    1.  **调查**：用于从多位受访者那里收集数据，以得出可应用于更广泛范围的结论。例如，研究社交媒体对某所学校学生的影响，以了解社交媒体总体上如何影响在校学生。


    2.  **民意调查**：用于了解人们对特定话题的看法或情绪。例如，网店可以询问顾客对所购产品的意见，这些信息可用于制定更有效的销售策略。


    3.  **访谈**：这是一种结构化的对话，其中一方（或一组人）提问，另一方（或一组人）回答问题。例如，新闻记者在抗议活动中采访一群人，以了解他们抗议的对象以及如何改善局势。


    4.  **观察**：顾名思义，这是观察或观看研究对象的自然反应、回应或行为的过程，以便得出一些有用的推论。例如，在自然栖息地观察老虎可以帮助野生动物研究人员了解它们的需求，从而找出更好地保护该物种的方法。


    另一种收集数据的方法就是简单地观察人、行为或现象。例如，我们可以利用过去的天气模式来预测未来的天气模式，或者仅仅通过观察人们对某位候选人的反应来预测选举结果。


    数据也可以从在线来源收集，因为如今互联网上有大量的内容。一些例子包括从社交媒体网站收集数据、抓取网页，甚至只是从网上下载数据集。然而，需要记住的一点是，在使用这些数据之前，我们必须确保其使用是允许且合乎道德的。


    数据收集完成后，在用于任何进一步的应用之前，需要进行预处理。


    ### 数据预处理


    我们收集的数据可能包含错误、缺失值、多余信息等。这可能会给我们的机器学习过程带来问题。因此，数据需要经过一种清洗过程，这被称为预处理。


    #### 数据清洗


    数据通过以下方式进行清洗：


    *   删除不准确、不相关或不完整的数据。


    *   转换数据以确保它们具有相同的类型或格式。


    *   检查数据是否可接受使用。


    #### 填充缺失值


    值可能因以下原因而缺失：


    1.  随机误差


    2.  系统误差


    3.  人为错误


    4.  传感器读数错误


    这些值通过以下方式处理：


    1.  删除包含缺失数据的部分，前提是剩余数据足够用于机器学习过程。


    2.  删除包含问题数据或与另一属性一致或相关的属性。


    3.  对于因可接受原因而缺失的数据，分配一个特殊值，如“N/A”（例如，如果某人未能参加比赛，他们对比赛的看法无效）。


    4.  通过取该属性的平均值来估算缺失值。


    5.  根据其前序值预测该值。


    #### 移除异常值


    异常值是一组值中与其余值差异极大的不规则值。它可能严重影响对该组值进行的任何计算的结果。表 2-1 显示了一个非常简单的例子。


    表 2-1


    异常值计算


    |   | a | b | c | d | e | f | g | h | i | j |

    | X | 2 | 3 | 1 | 1 | 4 | 3 | 5 | 100 | 5 | 2 |


    正如我们所见，*h* 的值是 100。这远大于其余落在 1 到 5 范围内的值。


    同样，在为数据科学目的收集的数据中也可能出现此类不规则值。需要谨慎处理这些值，以防止结果中出现不准确或错误。


    处理异常值最常用的方法是使用数据可视化将数据绘制在图表上，然后检测不规则值并进行处理。


    #### 数据转换与降维


    数据转换也称为数据整理或数据清洗。它将数据转换为机器学习算法可读的格式。数据也变得更易于学习，并且可以获得更准确的输出。


    数据降维会移除那些对机器学习算法结果产生积极影响可能性较小的某些属性。例如，某些属性可能包含随机值、方差非常低的值或大量缺失值。在这种情况下，该属性可以从数据集中完全移除。

    '
- fmt: '### Types of Data


    The data that is collected and used can be either of the following:


    - **Labeled:** Each class/type is labeled based on certain characteristics so
    that the machine can easily identify and separate the data into its respective
    groups. For example, if you have a collection of pictures that are separated and
    tagged as “cat” or “fish” accordingly.

    - **Unlabeled:** Each class/type is not labeled, and so the machine needs to figure
    out how many classes are there and which item belongs where, and then it must
    separate the data on its own. For example, if you have a set of pictures, but
    they are not separated and tagged as “cat” or “fish” accordingly. In this case,
    the machine would need to identify some particular features that differentiate
    one animal from the other (like a cat’s whiskers or a fish’s fins).


    Based on the *kind* of data being used, there are two main types of machine learning
    methods:


    - **Supervised learning:** This method uses labeled data.

    - **Unsupervised learning:** This method uses unlabeled data.


    Table [2-2](#491271_1_En_2_Chapter.xhtml#Tab2) lists how they differ from each
    other.


    **Table 2-2** Supervised/Unsupervised Learning Differences


    | Supervised Learning | Unsupervised Learning |

    | --- | --- |

    | It uses data that is labeled. | It uses data that is unlabeled. |

    | It does not require excess data for accuracy. | It requires excess data for
    accuracy. |

    | Computational complexity is less, i.e., it is simpler. | Computational complexity
    is greater, i.e., it is less simple. |

    | It does not find patterns on its own from a dataset. | It finds patterns on
    its own from a given dataset. |


    Each type of learning method has various types of algorithms that can be used
    to solve a machine learning problem. Let’s take a look at some important ones.


    ## Supervised Learning Algorithms


    The goal of every supervised learning algorithm is to map the input to the output,
    as shown in the following equation:


    `y = f(x)`


    There are several algorithms that can be used to solve a machine learning problem
    with the help of supervised learning. These algorithms can be segregated into
    the following categories:


    1. **Regression algorithms:** These algorithms contain outputs that are real or
    countable. For example, height (4 feet, 5 feet, 6 feet), age (27, 31, 65), or
    price (100 rupees, 20 pounds, 10 dollars)

    2. **Classification algorithms:** These algorithms contain outputs that are abstract
    or categorical. For example, colors (orange, purple, turquoise), emotions (happy,
    sad, angry), or gender (girl, boy).


    To give you some idea of what these algorithms are, let’s go through three common
    types of algorithms that are used:


    - Linear regression

    - Logistic regression

    - K-Nearest neighbors


    ### Linear Regression


    As the name suggests, linear regression is a type of regression algorithm. It
    models the relationship between a dependent variable and an independent variable.
    Graphically, it looks something like Figure [2-1](#491271_1_En_2_Chapter.xhtml#Fig1).


    ![../images/491271_1_En_2_Chapter/491271_1_En_2_Fig1_HTML.jpg](images/491271_1_En_2_Chapter/491271_1_En_2_Fig1_HTML.jpg)


    **Figure 2-1** Linear regression algorithm


    ### Logistic Regression


    Although the name says *regression*, this is generally used as a classification
    algorithm. It is usually the first choice for programmers who wish to conduct
    binary classification. It looks something like Figure [2-2](#491271_1_En_2_Chapter.xhtml#Fig2).


    ![../images/491271_1_En_2_Chapter/491271_1_En_2_Fig2_HTML.jpg](images/491271_1_En_2_Chapter/491271_1_En_2_Fig2_HTML.jpg)


    **Figure 2-2** Classification algorithm


    ### K-Nearest Neighbors


    This algorithm can be used for both regression and classification. It assumes
    that similar units exist in close proximity to one another. It uses this idea
    to come up with a solution. It looks something like Figure [2-3](#491271_1_En_2_Chapter.xhtml#Fig3).


    ![../images/491271_1_En_2_Chapter/491271_1_En_2_Fig3_HTML.jpg](images/491271_1_En_2_Chapter/491271_1_En_2_Fig3_HTML.jpg)


    **Figure 2-3** K-nearest neighbor algorithm


    ### Applications of Supervised Learning Algorithms


    1. **Spam detection:** Remember the very first email segregation example that
    we read about? This is done with the help of supervised learning.

    2. **Bioinformatics:** This is the method of keeping a record of a person’s biological
    information for later use. One of the most common examples of this is the security
    system on our cell phones, which can scan our fingerprint and grant us access
    accordingly.


    ## Unsupervised Learning Algorithms


    The goal of unsupervised learning algorithms is to discover possible patterns
    from the set of data that is provided. The algorithm has no prior information
    about the patterns and labels present in the data.


    There are several algorithms that can be used to solve a machine learning problem
    with the help of unsupervised learning. These algorithms can be segregated into
    the following categories:


    - **Cluster analysis:** This approach finds similarities among the data and then
    groups the common data together in clusters.

    - **Dimensionality reduction:** This approach attempts to reduce the complexity
    of data while still keeping the data relevant.


    Let us now have a look at two common algorithms that are used for unsupervised
    learning: K-means clustering and principal component analysis.


    ### K-Means Clustering


    The K-means clustering method forms *k* clusters out of a total of *n* observations.
    Each observation will be a part of the cluster with the closest mean. It looks
    something like Figure [2-4](#491271_1_En_2_Chapter.xhtml#Fig4).


    ![../images/491271_1_En_2_Chapter/491271_1_En_2_Fig4_HTML.jpg](images/491271_1_En_2_Chapter/491271_1_En_2_Fig4_HTML.jpg)


    **Figure 2-4** K-means clustering algorithm


    ### Principal Component Analysis


    Principal component analysis uses orthogonal transformation to statistically transform
    a set of potentially correlated variables to a set of linearly uncorrelated variables,
    known as principal components. It is used to reduce the dimensionality of the
    data. It looks something like Figure [2-5](#491271_1_En_2_Chapter.xhtml#Fig5).


    ![../images/491271_1_En_2_Chapter/491271_1_En_2_Fig5_HTML.jpg](images/491271_1_En_2_Chapter/491271_1_En_2_Fig5_HTML.jpg)


    **Figure 2-5** Principal component analysis algorithm


    ### Applications of Unsupervised Machine Learning Algorithms


    *Anomaly detection* is the identification of certain anomalies or observations
    that are different from the rest of the observations. These anomalies are also
    called outliers. For example, credit card fraud can be discovered by detecting
    unusual transactions made with the credit card.


    *Association* is the process of identifying associations between different observations
    with the help of provided data. For example, in e-commerce it is easy to figure
    out the type of products a customer might be interested in by analyzing previous
    purchases.


    **Task Time**


    Do a little more research on machine learning algorithms. You can even compare
    them with each other, as this will broaden your understanding of these algorithms
    to help you decide which one to use for any future projects you might have.


    Apart from supervised and unsupervised machine learning, there are also two lesser-known
    methods of machine learning, as follows:


    - **Semi-supervised learning:** This method uses some labeled data and a larger
    proportion of unlabeled data for training.

    - **Reinforcement learning:** This method is similar to training a pet. It sends
    positive signals to the machine when it gives the desired output, to let it know
    that it is right and to help it learn better. Similarly, it sends negative signals
    to a machine if it provides an incorrect output.'
  raw: '### Types of Data


    The data that is collected and used can be either of the following:


    *   **Labeled:** Each class/type is labeled based on certain characteristics so
    that the machine can easily identify and separate the data into its respective
    groups. For example, if you have a collection of pictures that are separated and
    tagged as “cat” or “fish” accordingly.


    *   **Unlabeled:** Each class/type is not labeled, and so the machine needs to
    figure out how many classes are there and which item belongs where, and then it
    must separate the data on its own. For example, if you have a set of pictures,
    but they are not separated and tagged as “cat” or “fish” accordingly. In this
    case, the machine would need to identify some particular features that differentiate
    one animal from the other (like a cat’s whiskers or a fish’s fins).


    Based on the *kind* of data being used, there are two main types of machine learning
    methods:


    *   **Supervised learning:** This method uses labeled data.


    *   **Unsupervised learning:** This method uses unlabeled data.


    Table [2-2](#491271_1_En_2_Chapter.xhtml#Tab2) lists how they differ from each
    other.


    Table 2-2


    Supervised/Unsupervised Learning Differences


    | Supervised Learning | Unsupervised Learning |

    | --- | --- |

    | It uses data that is labeled. | It uses data that is unlabeled. |

    | It does not require excess data for accuracy. | It requires excess data for
    accuracy. |

    | Computational complexity is less, i.e., it is simpler. | Computational complexity
    is greater, i.e., it is less simple. |

    | It does not find patterns on its own from a dataset. | It finds patterns on
    its own from a given dataset. |


    Each type of learning method has various types of algorithms that can be used
    to solve a machine learning problem. Let’s take a look at some important ones.


    ## Supervised Learning Algorithms


    The goal of every supervised learning algorithm is to map the input to the output,
    as shown in the following equation:


    y = f(x)


    There are several algorithms that can be used to solve a machine learning problem
    with the help of supervised learning. These algorithms can be segregated into
    the following categories:


    1.  **Regression algorithms** **:** These algorithms contain outputs that are
    real or countable. For example, height (4 feet, 5 feet, 6 feet), age (27, 31,
    65), or price (100 rupees, 20 pounds, 10 dollars)


    2.  **Classification algorithms** **:** These algorithms contain outputs that
    are abstract or categorical. For example, colors (orange, purple, turquoise),
    emotions (happy, sad, angry), or gender (girl, boy).


    To give you some idea of what these algorithms are, let’s go through three common
    types of algorithms that are used:


    *   Linear regression


    *   Logistic regression


    *   K-Nearest neighbors


    ### Linear Regression


    As the name suggests, linear regression is a type of regression algorithm. It
    models the relationship between a dependent variable and an independent variable.
    Graphically, it looks something like Figure [2-1](#491271_1_En_2_Chapter.xhtml#Fig1).


    ![../images/491271_1_En_2_Chapter/491271_1_En_2_Fig1_HTML.jpg](images/491271_1_En_2_Chapter/491271_1_En_2_Fig1_HTML.jpg)


    Figure 2-1


    Linear regression algorithm


    ### Logistic Regression


    Although the name says *regression* , this is generally used as a classification
    algorithm. It is usually the first choice for programmers who wish to conduct
    binary classification. It looks something like Figure [2-2](#491271_1_En_2_Chapter.xhtml#Fig2).


    ![../images/491271_1_En_2_Chapter/491271_1_En_2_Fig2_HTML.jpg](images/491271_1_En_2_Chapter/491271_1_En_2_Fig2_HTML.jpg)


    Figure 2-2


    Classification algorithm


    ### K-Nearest Neighbors


    This algorithm can be used for both regression and classification. It assumes
    that similar units exist in close proximity to one another. It uses this idea
    to come up with a solution. It looks something like Figure [2-3](#491271_1_En_2_Chapter.xhtml#Fig3).


    ![../images/491271_1_En_2_Chapter/491271_1_En_2_Fig3_HTML.jpg](images/491271_1_En_2_Chapter/491271_1_En_2_Fig3_HTML.jpg)


    Figure 2-3


    K-nearest neighbor algorithm


    ### Applications of Supervised Learning Algorithms


    1.  **Spam detection** **:** Remember the very first email segregation example
    that we read about? This is done with the help of supervised learning.


    2.  **Bioinformatics** **:** This is the method of keeping a record of a person’s
    biological information for later use. One of the most common examples of this
    is the security system on our cell phones, which can scan our fingerprint and
    grant us access accordingly.


    ## Unsupervised Learning Algorithms


    The goal of unsupervised learning algorithms is to discover possible patterns
    from the set of data that is provided. The algorithm has no prior information
    about the patterns and labels present in the data.


    There are several algorithms that can be used to solve a machine learning problem
    with the help of unsupervised learning. These algorithms can be segregated into
    the following categories:


    *   **Cluster analysis:** This approach finds similarities among the data and
    then groups the common data together in clusters.


    *   **Dimensionality reduction** **:** This approach attempts to reduce the complexity
    of data while still keeping the data relevant.


    Let us now have a look at two common algorithms that are used for unsupervised
    learning: K-means clustering and principal component analysis.


    ### K-Means Clustering


    The K-means clustering method forms *k* clusters out of a total of *n* observations.
    Each observation will be a part of the cluster with the closest mean. It looks
    something like Figure [2-4](#491271_1_En_2_Chapter.xhtml#Fig4).


    ![../images/491271_1_En_2_Chapter/491271_1_En_2_Fig4_HTML.jpg](images/491271_1_En_2_Chapter/491271_1_En_2_Fig4_HTML.jpg)


    Figure 2-4


    K-means clustering algorithm


    ### Principal Component Analysis


    Principal component analysis uses orthogonal transformation to statistically transform
    a set of potentially correlated variables to a set of linearly uncorrelated variables,
    known as principal components. It is used to reduce the dimensionality of the
    data. It looks something like Figure [2-5](#491271_1_En_2_Chapter.xhtml#Fig5).


    ![../images/491271_1_En_2_Chapter/491271_1_En_2_Fig5_HTML.jpg](images/491271_1_En_2_Chapter/491271_1_En_2_Fig5_HTML.jpg)


    Figure 2-5


    Principal component analysis algorithm


    ### Applications of Unsupervised Machine Learning Algorithms


    *Anomaly detection* is the identification of certain anomalies or observations
    that are different from the rest of the observations. These anomalies are also
    called outliers. For example, credit card fraud can be discovered by detecting
    unusual transactions made with the credit card.


    *Association* is the process of identifying associations between different observations
    with the help of provided data. For example, in e-commerce it is easy to figure
    out the type of products a customer might be interested in by analyzing previous
    purchases.


    Task Time


    Do a little more research on machine learning algorithms. You can even compare
    them with each other, as this will broaden your understanding of these algorithms
    to help you decide which one to use for any future projects you might have.


    Apart from supervised and unsupervised machine learning, there are also two lesser-known
    methods of machine learning, as follows:


    *   **Semi-supervised learning** **:** This method uses some labeled data and
    a larger proportion of unlabeled data for training.


    *   **Reinforcement learning:** This method is similar to training a pet. It sends
    positive signals to the machine when it gives the desired output, to let it know
    that it is right and to help it learn better. Similarly, it sends negative signals
    to a machine if it provides an incorrect output.'
  trans: '

    ### 数据类型


    收集和使用的数据可分为以下两类：


    *   **有标签数据：** 每个类别/类型都根据特定特征进行了标记，以便机器能够轻松识别并将数据划分到各自的组中。例如，你有一组图片，它们被相应地分开并标记为“猫”或“鱼”。


    *   **无标签数据：** 每个类别/类型都没有标记，因此机器需要自行判断有多少个类别以及每个项目属于哪里，然后自行对数据进行分类。例如，你有一组图片，但它们没有被相应地分开并标记为“猫”或“鱼”。在这种情况下，机器需要识别出一些能将一种动物与另一种动物区分开来的特定特征（比如猫的胡须或鱼的鳍）。


    根据所使用的数据*类型*，机器学习方法主要分为两种：


    *   **监督学习：** 这种方法使用有标签数据。


    *   **无监督学习：** 这种方法使用无标签数据。


    表 2-2 列出了它们之间的区别。


    表 2-2


    监督学习/无监督学习差异


    | 监督学习 | 无监督学习 |

    | --- | --- |

    | 使用有标签的数据。 | 使用无标签的数据。 |

    | 不需要大量数据即可保证准确性。 | 需要大量数据才能保证准确性。 |

    | 计算复杂度较低，即更简单。 | 计算复杂度较高，即不那么简单。 |

    | 不会自行从数据集中发现模式。 | 会自行从给定的数据集中发现模式。 |


    每种学习方法都有多种可用于解决机器学习问题的算法。让我们来看一些重要的算法。


    ## 监督学习算法


    每个监督学习算法的目标都是将输入映射到输出，如下面的等式所示：


    y = f(x)


    有多种算法可以借助监督学习来解决机器学习问题。这些算法可以分为以下几类：


    1.  **回归算法：** 这些算法的输出是实数或可数的。例如，身高（4 英尺、5 英尺、6 英尺）、年龄（27、31、65）或价格（100 卢比、20 英镑、10
    美元）。


    2.  **分类算法：** 这些算法的输出是抽象的或分类的。例如，颜色（橙色、紫色、蓝绿色）、情绪（快乐、悲伤、愤怒）或性别（女孩、男孩）。


    为了让您对这些算法有所了解，我们来介绍三种常用的算法类型：


    *   线性回归


    *   逻辑回归


    *   K-近邻算法


    ### 线性回归


    顾名思义，线性回归是一种回归算法。它模拟了因变量和自变量之间的关系。在图形上，它看起来像图 2-1。


    ![../images/491271_1_En_2_Chapter/491271_1_En_2_Fig1_HTML.jpg](img/491271_1_En_2_Fig1_HTML.jpg)


    图 2-1


    线性回归算法


    ### 逻辑回归


    尽管名称中包含*回归*，但它通常被用作分类算法。它通常是希望进行二分类的程序员的首选。它看起来像图 2-2。


    ![../images/491271_1_En_2_Chapter/491271_1_En_2_Fig2_HTML.jpg](img/491271_1_En_2_Fig2_HTML.jpg)


    图 2-2


    分类算法


    ### K-近邻算法


    该算法可用于回归和分类。它假设相似的单元彼此邻近。它利用这一思想来得出解决方案。它看起来像图 2-3。


    ![../images/491271_1_En_2_Chapter/491271_1_En_2_Fig3_HTML.jpg](img/491271_1_En_2_Fig3_HTML.jpg)


    图 2-3


    K-近邻算法


    ### 监督学习算法的应用


    1.  **垃圾邮件检测：** 还记得我们之前读到的第一个电子邮件分类示例吗？这就是借助监督学习完成的。


    2.  **生物信息学：** 这是一种记录个人生物信息以备后续使用的方法。最常见的例子之一是我们手机上的安全系统，它可以扫描我们的指纹并据此授予我们访问权限。


    ## 无监督学习算法


    无监督学习算法的目标是发现所提供数据集中可能存在的模式。该算法事先不了解数据中存在的模式和标签。


    有多种算法可以借助无监督学习来解决机器学习问题。这些算法可以分为以下几类：


    *   **聚类分析：** 这种方法找出数据之间的相似性，然后将共同的数据分组到簇中。


    *   **降维：** 这种方法试图降低数据的复杂性，同时保持数据的相关性。


    现在让我们看看两种常用的无监督学习算法：K-均值聚类和主成分分析。


    ### K-均值聚类


    K-均值聚类方法从总共 *n* 个观测值中形成 *k* 个簇。每个观测值都将属于均值最近的簇。它看起来像图 2-4。


    ![../images/491271_1_En_2_Chapter/491271_1_En_2_Fig4_HTML.jpg](img/491271_1_En_2_Fig4_HTML.jpg)


    图 2-4


    K-均值聚类算法


    ### 主成分分析


    主成分分析使用正交变换，将一组可能相关的变量统计变换为一组线性不相关的变量，这些变量称为主成分。它用于降低数据的维度。它看起来像图 2-5。


    ![../images/491271_1_En_2_Chapter/491271_1_En_2_Fig5_HTML.jpg](img/491271_1_En_2_Fig5_HTML.jpg)


    图 2-5


    主成分分析算法


    ### 无监督机器学习算法的应用


    *异常检测* 是指识别某些与其他观测值不同的异常或观测值。这些异常也称为离群点。例如，通过检测信用卡的异常交易可以发现信用卡欺诈。


    *关联分析* 是指借助提供的数据识别不同观测值之间关联的过程。例如，在电子商务中，通过分析客户过去的购买记录，很容易判断出客户可能对哪种类型的产品感兴趣。


    任务时间


    对机器学习算法再多做一些研究。你甚至可以将它们相互比较，这将拓宽你对这些算法的理解，帮助你决定在未来的项目中应该使用哪一种。


    除了监督学习和无监督学习之外，还有两种不太为人所知的机器学习方法，如下所示：


    *   **半监督学习：** 这种方法使用一些有标签数据和大量无标签数据进行训练。


    *   **强化学习：** 这种方法类似于训练宠物。当机器给出期望的输出时，它会向机器发送正向信号，让它知道自己是正确的，并帮助它更好地学习。同样，如果机器提供了错误的输出，它会向机器发送负向信号。

