    n = (np.around(result)).argmax()\nprint(n)\n```\n\nThis gives us the following\
    \ output:\n\n```\n\n```\n\nThis output is very vague. All it tells us is the position\
    \ of the predicted class, but not what the actual item of clothing is. Thus, we\
    \ add an extra line of code:\n\n```\nprint(class_names[n])\n```\n\nThis will give\
    \ us the following output:\n\n```\nPullover\n```\n\nIn this way, we print the\
    \ value at the *n*th position of the list, which in this case is “Pullover.” So,\
    \ there we have it! We have built our very first multi-layer neural network that\
    \ can classify images with an accuracy of close to 90 percent.\n\n### Task Time\n\
    \nWe have just completed building two neural networks that can carry out multi-class\
    \ image classification. One of them is a single-layer neural network, while the\
    \ other is multi-layered. Can you try interchanging the datasets to see how the\
    \ model’s accuracy changes based on the number of layers? And, once you have done\
    \ that, try changing the number of layers, as well as the number of epochs. What’s\
    \ the highest accuracy you are able to achieve?\n\nWe will now move forward to\
    \ a very interesting concept that we learned about in the beginning of the book,\
    \ which is convolutional neural networks. As you might remember, CNNs use convolution\
    \ layers and pooling layers to process the given data. The great thing about them\
    \ is that they can process 2D images and detect important features very easily.\
    \ This is why they are frequently used with image classification problems.\n\n\
    Let’s have a look at some convolutional neural networks to see how well they work\
    \ for image classification.\n\n### Program 4: Clothing Classification Using Convolutional\
    \ Neural Networks (Multi-layer, Multi-class)\n\nThe structure for this model is\
    \ similar to the previous ones. The only major difference is that the neural network\
    \ will now have convolution layers and pooling layers.\n\n#### The Structure\n\
    \nHere is how the CNN model works for image classification:\n\n1.  It loads the\
    \ given dataset of images.\n2.  It divides the data into the training set and\
    \ the test set.\n3.  It creates the convolutional neural network with as many\
    \ layers as we specify, along with the activation function provided by us.\n4.\
    \  It also creates the last dense layer and the output layer with the parameters\
    \ provided by us.\n5.  It then begins training with the training data to recognize\
    \ the similarities and differences between each image and segregate them accordingly.\n\
    6.  Finally, it tests its accuracy with the test data to see how well it has learned\
    \ the differences between each image.\n\n#### Dataset\n\nThe dataset that we will\
    \ be using for this program is the Fashion MNIST dataset.\n\n#### API\n\nWe will\
    \ be using the Keras API within TensorFlow.\n\n#### The Activation Functions\n\
    \nWe will be using two activation functions here:\n\n1.  ReLU\n2.  Softmax\n\n\
    #### The Optimizer\n\nWe will be using the Adam optimizer in this neural network.\n\
    \n#### The Program\n\n**Step 1: Import the TensorFlow library and Keras utilities.**\n\
    \n```\nimport tensorflow as tf\nfrom tensorflow.keras import datasets, layers,\
    \ models\n```\n\n**Step 2: Load the Fashion MNIST dataset.**\n\n```\ndata = datasets.fashion_mnist\n\
    (ip_train, op_train), (ip_test, op_test) = data.load_data()\n```\n\n**Step 3:\
    \ Check the shape of the images.**\n\n```\nprint(ip_train.shape, ip_test.shape)\n\
    ```\n\n**Step 4: Reshape the input values.**\n\n```\nip_train = ip_train.reshape((60000,\
    \ 28, 28, 1))\nip_test = ip_test.reshape((10000, 28, 28, 1))\nprint(ip_train.shape,\
    \ ip_test.shape)\n```\n\nNow when we display the reshaped data, it will show four\
    \ dimensions.\n\n**Step 5: Prepare the data.**\n\nOnce again, we must normalize\
    \ the data by dividing it by 255.\n\n```\nip_train, ip_test = ip_train / 255.0,\
    \ ip_test / 255.0\n```\n\n**Step 6: Build the convolutional neural network.**\n\
    \nHere is where the main difference comes in. Since we are making a CNN model,\
    \ the neural network will require convolution layers and pooling layers.\n\n```\n\
    model = models.Sequential()\nmodel.add(layers.Conv2D(32, (3,3), activation=\"\
    relu\", input_shape=(28,28,1)))\nmodel.add(layers.MaxPooling2D((2,2)))\nmodel.add(layers.Conv2D(64,\
    \ (3,3), activation=\"relu\"))\nmodel.add(layers.MaxPooling2D((2,2)))\nmodel.add(layers.Conv2D(64,\
    \ (3,3), activation=\"relu\"))\n```\n\nAs you can see, we have three convolution\
    \ layers and two max pooling layers. We use the ReLU activation function for all\
    \ the convolution layers. There is also no need to flatten the images before feeding\
    \ them to the model, as CNNs can process two-dimensional data. This is why we\
    \ use `Conv2D` instead of `Conv1D`. The first convolution layer consists of 32\
    \ filters or kernels, each of size 3x3. The output from this layer gets passed\
    \ on to the pooling layer with a filter of size 2x2. Likewise, the output gets\
    \ transferred to each successive layer, until it reaches the last convolution\
    \ layer.\n\n**Step 7: Add the final dense layer and output layer.**\n\nWe must\
    \ now add the last fully connected layer, followed by the output layer. Here,\
    \ we need to flatten the input first before feeding it to the dense layer. The\
    \ dense layer will have the ReLU activation function and 64 neurons. The last\
    \ layer here is called the classification layer. It uses a Softmax activation\
    \ function and will have ten neurons, corresponding to the number of outputs or\
    \ classes that we will obtain.\n\n```\nmodel.add(layers.Flatten())\nmodel.add(layers.Dense(64,\
    \ activation=\"relu\"))\nmodel.add(layers.Dense(10, activation=\"softmax\"))\n\
    ```\n\n**Step 8: Compile the model.**\n\n```\nmodel.compile(optimizer = 'adam',\n\
    \              loss = 'sparse_categorical_crossentropy',\n              metrics\
    \ = ['accuracy'])\n```\n\n**Step 9: View the model.**\n\n```\nmodel.summary()\n\
    ```\n\nWe will get the summary of the CNN model, as shown in Figure [11-14](#491271_1_En_11_Chapter.xhtml#Fig14).\n\
    \n![../images/491271_1_En_11_Chapter/491271_1_En_11_Fig14_HTML.jpg](images/491271_1_En_11_Chapter/491271_1_En_11_Fig14_HTML.jpg)\n\
    \n**Figure 11-14** Summary of the CNN model\n\n**Step 10: Train the model.**\n\
    \n```\nmodel.fit(ip_train, op_train, epochs = 5)\n```\n\nThis will begin training\
    \ the model through five epochs, as shown in Figure [11-15](#491271_1_En_11_Chapter.xhtml#Fig15).\n\
    \n![../images/491271_1_En_11_Chapter/491271_1_En_11_Fig15_HTML.jpg](images/491271_1_En_11_Chapter/491271_1_En_11_Fig15_HTML.jpg)\n\
    \n**Figure 11-15** Training the model\n\n**Step 11: Test the model.**\n\n```\n\
    model.evaluate(ip_test, op_test, verbose = 1)\n```\n\nThis will test the model\
    \ to show its accuracy, as shown in Figure [11-16](#491271_1_En_11_Chapter.xhtml#Fig16).\n\
    \n![../images/491271_1_En_11_Chapter/491271_1_En_11_Fig16_HTML.jpg](images/491271_1_En_11_Chapter/491271_1_En_11_Fig16_HTML.jpg)\n\
    \n**Figure 11-16** Testing the CNN model\n\nThere you have it! The image classification\
    \ model using a convolutional neural network is now complete. You can play around\
    \ with it to add or remove layers, and to change the parameters as well.\n\nLet’s\
    \ take a look at another example of a CNN model."
