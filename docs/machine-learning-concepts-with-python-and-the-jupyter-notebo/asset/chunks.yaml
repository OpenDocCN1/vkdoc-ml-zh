    Figure 7-3


    Entering a program’s title within a “Heading” cell


    The hash symbol (`#`) indicates that it is a level-one title.


    Let’s execute the cell. We can do this by clicking on the “Run” icon in the tool
    bar. A faster way of doing this is by using the keyboard shortcut `Shift + Enter`.


    Now that our cell is executed, we will see the heading appear, as shown in Figure
    [7-4](#491271_1_En_7_Chapter.xhtml#Fig4).


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig4_HTML.jpg](images/491271_1_En_7_Chapter/491271_1_En_7_Fig4_HTML.jpg)


    Figure 7-4


    Executing the “Heading” cell to add the title to the notebook


    # Printing the Output of a Code Cell


    The next cell automatically appears as a “Code” cell. Let’s repeat the same code
    we used in the previous chapter by typing in the following:


    ```

    print("Hello World")

    ```


    Now when we execute the cell, we will get an output like this:


    ```

    Hello World

    ```


    # Taking an Input from a User in a “Code” Cell


    Let’s see what happens when we take an input from a user. Type in the following
    code:


    ```

    a = input("Enter your name: ")

    ```


    Now when we execute the cell, we get the output shown in Figure [7-5](#491271_1_En_7_Chapter.xhtml#Fig5).


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig5_HTML.jpg](images/491271_1_En_7_Chapter/491271_1_En_7_Fig5_HTML.jpg)


    Figure 7-5


    Waiting to accept an input from the user


    As you can see, the text that we have entered is displayed, followed by a text
    box where we can type in our input. This text box can accept any character that
    is typed in from the keyboard. The asterisk (`*`) at the left of the cell indicates
    that the program is still executing that cell. In this case, it is waiting for
    a command from the user before it can proceed. Once the user presses the `Enter`
    key, the program will continue executing.


    After we finish typing and press the `Enter` key, the output will be displayed,
    as shown in Figure [7-6](#491271_1_En_7_Chapter.xhtml#Fig6).


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig6_HTML.jpg](images/491271_1_En_7_Chapter/491271_1_En_7_Fig6_HTML.jpg)


    Figure 7-6


    Displaying the accepted input


    # Calling a Variable


    When we accepted an input from the user, we stored it under the variable `a`.
    In the next cell, we will call this variable and display its output by typing
    the following:


    ```

    a

    ```


    Now when we execute the cell, we will get the value of `a` displayed, as shown
    in Figure [7-7](#491271_1_En_7_Chapter.xhtml#Fig7).


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig7_HTML.jpg](images/491271_1_En_7_Chapter/491271_1_En_7_Fig7_HTML.jpg)


    Figure 7-7


    Displaying the value of a variable


    # Arithmetic Operations


    Let’s see what happens when we have some output to display, and also some input
    to take. We can explore this with the help of some simple arithmetic operations.
    Let’s try the following code:


    ```

    b=2

    c=int(input("Enter a number: "))

    sum=b+c

    print(sum)

    ```


    We will get a text box for the input, first, as shown in Figure [7-8](#491271_1_En_7_Chapter.xhtml#Fig8).


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig8_HTML.jpg](images/491271_1_En_7_Chapter/491271_1_En_7_Fig8_HTML.jpg)


    Figure 7-8


    Accepting a number from the user


    Once we provide the required value, the code performs the necessary calculation
    and displays the output, as shown in Figure [7-9](#491271_1_En_7_Chapter.xhtml#Fig9).


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig9_HTML.jpg](images/491271_1_En_7_Chapter/491271_1_En_7_Fig9_HTML.jpg)


    Figure 7-9


    Displaying the input as well as the result of the calculation


    We need to put `int` right before the `input` command to tell the program that
    we are expecting an integer from the user, which must then be used for the given
    arithmetic calculation. If we skip this step, there will be an error, because
    Python always inputs values as strings (including numbers and symbols), which
    prevents numbers from directly being used for the calculation.


    # Creating a Function


    Now, let’s create a function and see how that works. Type in the following code:


    ```

    def prod(a):

    b=int(input("Enter a value: "))

    c=5

    p=a*b*c

    return(p)

    ```


    When we execute this cell, we find that there is no output. There is, however,
    something happening behind the scenes. In the next cell, type this:


    ```

    prod(6)

    ```


    Remember, we can put any number that we want within the brackets. When we execute
    this cell, we will get a text box asking for a value. We can enter a value of
    our choice. When we press `Enter`, we will get the output shown in Figure [7-10](#491271_1_En_7_Chapter.xhtml#Fig10).


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig10_HTML.jpg](images/491271_1_En_7_Chapter/491271_1_En_7_Fig10_HTML.jpg)


    Figure 7-10


    Performing a calculation within a function, then calling the function to display
    the result


    # Creating Lists


    A list is an ordered set of items. We can create a list by entering all the required
    values between a pair of square brackets, as follows:


    ```

    list = [2, 4, 6, 8, 10]

    list

    ```


    When we execute this, we will get an output as shown in Figure [7-11](#491271_1_En_7_Chapter.xhtml#Fig11).


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig11_HTML.jpg](images/491271_1_En_7_Chapter/491271_1_En_7_Fig11_HTML.jpg)


    Figure 7-11


    Creating a list


    # Creating Dictionaries


    A dictionary is an unordered set of items. We can create a dictionary by entering
    our values between a pair of curly brackets, as follows:


    ```

    age = {"Henry":30, "Chiara":19, "Benedict":23, "Dominic":15, "Gertrude":24}

    age

    ```


    When we execute this cell, we will get an output as shown in Figure [7-12](#491271_1_En_7_Chapter.xhtml#Fig12).


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig12_HTML.jpg](images/491271_1_En_7_Chapter/491271_1_En_7_Fig12_HTML.jpg)


    Figure 7-12


    Creating a dictionary


    # Creating Loops


    In programming, a loop is a set of instructions or steps that is continuously
    repeated until a condition is satisfied.


    ## While Loop


    Try typing in this code:


    ```

    count=0

    while count<=5:

    count=count+1

    print("Love your neighbour as yourself")

    ```


    When we execute this cell, we will get an output as shown in Figure [7-13](#491271_1_En_7_Chapter.xhtml#Fig13).


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig13_HTML.jpg](images/491271_1_En_7_Chapter/491271_1_En_7_Fig13_HTML.jpg)


    Figure 7-13


    Running a while loop


    ## For Loop


    Type this code into the code cell:


    ```

    string=("Rejoice")

    for i in string:

    print(i)

    ```


    When we execute this cell, we will get an output as shown in Figure [7-14](#491271_1_En_7_Chapter.xhtml#Fig14).


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig14_HTML.jpg](images/491271_1_En_7_Chapter/491271_1_En_7_Fig14_HTML.jpg)


    Figure 7-14


    Running a for loop


    ## Nested Loops


    Nested loops consist of two or more loops used within a single code block.


    Enter the following code into the “Code” cell:


    ```

    i=0

    s=("Have a beautiful day")

    while i<=3:

    i=i+1

    for a in s:

    print(a)

    ```


    When we execute this code, we will get an output as shown in Figure [7-15](#491271_1_En_7_Chapter.xhtml#Fig15).


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig15_HTML.jpg](images/491271_1_En_7_Chapter/491271_1_En_7_Fig15_HTML.jpg)


    Figure 7-15


    Running nested loops


    Of course, for all practical purposes, I have not shown the full output. But it
    is easy to understand how the output will look, since the same sentence is printed
    out four times consecutively.


