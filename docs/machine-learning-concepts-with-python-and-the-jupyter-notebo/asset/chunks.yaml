    \ import VGG16, preprocess_input, decode_predictions\nfrom tensorflow.keras.applications.resnet50\
    \ import ResNet50, preprocess_input\n```\n\n**Step 3: Load the model into the\
    \ notebook.**\n\nWe need to load the pre-trained model into the notebook. In this\n\
    program, we will be trying out both VGG16 and ResNet50\\. To start with,\nlet’s\
    \ call VGG16 into our program. We can add it to our code like this:\n\n```\nmodel\
    \ = VGG16()\n```\n\nThis will load the pre-trained model into the Jupyter notebook.\n\
    **Step 4: Load an image into the notebook.**\nWe now need to load an image into\
    \ the notebook. The great thing about\nusing this pre-trained model is that we\
    \ can upload any picture that we\nwant and then test it to see if it works correctly.\n\
    \nThe image we will be using is that of a kitten. We can load it into our\nnotebook,\
    \ like this:\n\n```\nimage = load_img('Kitten1.jpg', target_size=(224, 224))\n\
    image\n```\n\nThe image will be displayed as shown in Figure [11-4](#491271_1_En_11_Chapter.xhtml#Fig4).\n\
    \n![../images/491271_1_En_11_Chapter/491271_1_En_11_Fig4_HTML.jpg](images/491271_1_En_11_Chapter/491271_1_En_11_Fig4_HTML.jpg)\n\
    \nFigure 11-4\nLoading the image file\n\nNote\n\nJust remember that when you are\
