    seasons of disinterest. This has happened twice so far, starting in around 1974\.
    It resulted in many AI developments’ being stalled, and people’s heading into
    other fields of work and research.


    ## The AI Winter


    As you have already read in an earlier section, there were times during the history
    of artificial intelligence when people’s overall interest in the area became cold.
    To a certain extent, people nearly gave up on the field. They restricted the quantity
    of resources and funding given for its research and growth. Such a period is known
    as an AI winter.


    ### The First AI Winter (1974–1980)


    The first AI winter can be traced back to around 1974\. It was not an abrupt break
    in the progress of artificial intelligence. Rather, it was an inevitable consequence
    of certain setbacks that occurred prior to it.


    1.  Around 1967, the “quiet decade of machine translation” began, where researchers
    found it difficult to correctly translate languages with the help of artificial
    intelligence. After spending enormous amounts of money in this area, the funding
    was finally stopped.


    2.  Approximately two years later, Minsky and Papert published their book, *Perceptrons*.
    This book explicitly critiqued perceptrons, which had a negative impact on connectionism.
    People soon abandoned the connectionism approach for years.


    3.  In 1969, the Mansfield Amendment was passed, as a result of which the Defense
    Advanced Research Projects Agency (DARPA) restricted their funding to projects
    that focused on military benefits only.


    4.  In 1973, the “Lighthill Report” was published, which evaluated the progress
    made and emphasized the downfall of artificial intelligence. Although this report
    faced plenty of public criticism, it eventually caused a feeling of pessimism
    to sweep over researchers and investors, who ultimately withdrew from the field.


    5.  In 1974, DARPA discontinued funding the Speech Understanding Research (SUR)
    program at Carnegie Mellon University, due to the latter’s production of an inefficient
    speech-recognition AI machine that did not fulfill their requirements.


    6.  Thus, by 1974, the first AI winter had begun, mainly due to the lack of funding,
    which stalled any further research. Thankfully, this period only lasted until
    about 1980.'
