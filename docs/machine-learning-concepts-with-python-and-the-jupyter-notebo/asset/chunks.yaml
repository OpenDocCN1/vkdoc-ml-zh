    This line will appear in green italics in the “Code” cell, as shown in Figure
    [7-19](#491271_1_En_7_Chapter.xhtml#Fig19).


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig19_HTML.jpg](images/491271_1_En_7_Chapter/491271_1_En_7_Fig19_HTML.jpg)


    Figure 7-19


    Adding a comment line within the code


    ## Deleting a Cell


    Sometimes, we may have cells that are unnecessary. We can easily get rid of them
    by clicking on the scissor icon.


    We can also do so by selecting the “Delete Cells” option from the “Edit” drop-down
    menu in the menu bar, as shown in Figure [7-20](#491271_1_En_7_Chapter.xhtml#Fig20).


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig20_HTML.jpg](images/491271_1_En_7_Chapter/491271_1_En_7_Fig20_HTML.jpg)


    Figure 7-20


    Deleting cells using the drop-down menu option


    ## Adding a New Cell


    We can even add a new cell beneath another cell by selecting that cell and then
    clicking on the “Insert Cell Below” icon or the plus sign.


    The other way to do this is by selecting the “Insert Cell Below” option from the
    “Insert” drop-down menu in the menu bar. If we want to add a cell above the selected
    cell, we can either click on the “Insert Cell Below” icon followed by the “Move
    Cell Up” icon, or directly click on the “Insert Cell Above” option from the “Insert”
    drop-down menu, as shown in Figure [7-21](#491271_1_En_7_Chapter.xhtml#Fig21).


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig21_HTML.jpg](images/491271_1_En_7_Chapter/491271_1_En_7_Fig21_HTML.jpg)


    Figure 7-21


    Adding a new cell using the drop-down menu option


    ## Copying a Cell


    We can also copy the contents of a cell and paste them in another cell with the
    help of the “Copy Selected Cells” and “Paste Selected Cells” options in the tool
    bar.


    We can also do this by selecting the required options from the menu bar, as shown
    in Figure [7-22](#491271_1_En_7_Chapter.xhtml#Fig22).


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig22_HTML.jpg](images/491271_1_En_7_Chapter/491271_1_En_7_Fig22_HTML.jpg)


    Figure 7-22


    Copying a cell using the drop-down menu option


    ## Moving a Cell


    We may even want to switch the cells around, depending on our preference. We can
    shift cells up or down accordingly, using the up and down arrow icons in the tool
    bar.


    We can also do this by going to the menu bar, clicking on “Edit,” and then selecting
    either “Move Cell Up” or “Move Cell Down,” as shown in Figure [7-23](#491271_1_En_7_Chapter.xhtml#Fig23).


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig23_HTML.jpg](images/491271_1_En_7_Chapter/491271_1_En_7_Fig23_HTML.jpg)


    Figure 7-23


    Moving a cell using the drop-down menu option


    ## Merging Cells


    Let us now go back to the previous few pieces of code, where we define a variable
    `a` as the input from a user, and then in the next “Code” cell print out the value
    of this variable.


    Instead of carrying this out in two separate cells, we can just put this together
    in a single cell. The great thing is, we don’t even have to retype or delete anything.
    All we need to do is go to the menu bar, select “Edit,” then click on “Merge Cell
    Below,” as shown in Figure [7-24](#491271_1_En_7_Chapter.xhtml#Fig24).


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig24_HTML.jpg](images/491271_1_En_7_Chapter/491271_1_En_7_Fig24_HTML.jpg)


    Figure 7-24


    Merging cells using the drop-down menu option


    Let’s try this on one of our previous bits of code. Consider the code in which
    we take an input from a user, store it as input `a`, and then display the value
    of `a`. This was done in two separate cells of code. However, when we merge the
    cells, it puts the code together into a single cell, as shown in Figure [7-25](#491271_1_En_7_Chapter.xhtml#Fig25).


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig25_HTML.jpg](images/491271_1_En_7_Chapter/491271_1_En_7_Fig25_HTML.jpg)


    Figure 7-25


    Two cells merged into a single cell


    ## Splitting a Cell


    We can even split a cell into two parts using the “Split Cell” option from the
    “Edit” drop-down menu in the menu bar, as shown in Figure [7-26](#491271_1_En_7_Chapter.xhtml#Fig26).


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig26_HTML.jpg](images/491271_1_En_7_Chapter/491271_1_En_7_Fig26_HTML.jpg)


    Figure 7-26


    Splitting a cell using the drop-down menu option


    First, click on the line from which point we want to split the code. Then click
    on the “Split Cell” option. The code will split, as shown in Figure [7-27](#491271_1_En_7_Chapter.xhtml#Fig27).


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig27_HTML.jpg](images/491271_1_En_7_Chapter/491271_1_En_7_Fig27_HTML.jpg)


    Figure 7-27


    Splitting a cell using the drop-down menu option


    ## Running All Cells


    Instead of executing each cell one by one, we can run them all at once. To do
    this, all we need to do is click on the “Run All” option from the “Cell” drop-down
    menu in the menu bar, as shown in Figure [7-28](#491271_1_En_7_Chapter.xhtml#Fig28).
    This executes the entire notebook.


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig28_HTML.jpg](images/491271_1_En_7_Chapter/491271_1_En_7_Fig28_HTML.jpg)


    Figure 7-28


    Running all the cells in the notebook using the drop-down menu option'
