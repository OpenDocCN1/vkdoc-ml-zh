    ### 内核下拉菜单


    图 6-18 展示了“单元格”下拉菜单中可用的不同选项。


    1.  **中断：** 此选项可在代码执行过程中中断正在运行的进程。


    2.  **重启：** 此选项会重启整个内核，但保留之前获得的输出。


    3.  **重启并清除输出：** 此选项会重启整个内核，并清除之前获得的输出。


    4.  **重启并全部运行：** 此选项会重启整个内核，并再次执行所有单元格。


    5.  **重新连接：** 此选项允许内核重新连接。


    6.  **关闭：** 此选项会关闭当前活动的内核。


    7.  **更改内核：** 此选项允许我们将内核更改为我们想要的任何版本或语言。


    ![../images/491271_1_En_6_Chapter/491271_1_En_6_Fig18_HTML.jpg](img/491271_1_En_6_Fig18_HTML.jpg)


    图 6-18


    内核下拉菜单


    就是这样！以上是对 Jupyter Notebook 一些最基本但重要功能的概述。


    现在你已经熟悉了 Jupyter Notebook 的工作环境，让我们继续，借助 Jupyter Notebook 来练习一些 Python 编程吧。


    ## 附加信息


    Jupyter 项目是一个非常有趣的倡议，尤其适合那些需要一个可靠且便捷的工作空间来处理项目的数据科学家和机器学习爱好者。让我们来看看 Project Jupyter
    下的另外两个非常有用的功能，它们在我们机器学习之旅中可能会对某些人有所帮助。


    ### JupyterHub


    JupyterHub 允许多个用户共享资源来进行编程。每个用户都有自己的工作空间，他们可以在其中编写代码，而无需担心安装和维护问题。


    它可以在用户的系统上运行，也可以在云端运行。它可定制、灵活、可移植且可扩展，是程序员的绝佳界面。它还有自己的社区，供用户讨论和贡献。


    ### Jupyter nbviewer


    Jupyter nbviewer 是 nbviewer 的一个免费且公开可用的实例，nbviewer 是一个基于 Web 的应用程序，允许我们将笔记本作为静态
    HTML 网页查看。它还为我们提供了一个链接，我们可以用它与他人共享笔记本。


    除了查看单个笔记本，我们还可以查看笔记本集合。这些笔记本甚至可以转换为其他格式。


    ### Voila


    Voila 用于将 Jupyter 笔记本转换为一个独立的 Web 应用程序，可以与他人共享。它包含一个可定制的交互式仪表板，允许用户在安全的环境中查看笔记本。


    它可以在任何 Jupyter 内核中工作，与所使用的编程语言类型无关。对于希望查看笔记本结果但无需看到代码单元格或执行代码的非技术用户来说，这是一个很好的选择。


    ### Google Colaboratory


    谷歌的 Colaboratory（或 Colab）是一个免费的在线 Jupyter 环境。它在云端运行，并将其笔记本存储到用户的 Google Drive
    中。


    截至 2019 年 10 月，Colab 主要支持 Python 2 和 Python 3 内核。


    不过，Colab 也有可能支持 R、Swift 和 Julia。


    ### 键盘快捷键


    首先，你需要知道使用 Jupyter Notebook 有两种模式，如下所示：


    *   **命令模式**，允许我们使用方向键在笔记本中导航。


    *   **编辑模式**，允许我们编辑选定的单元格。


    表 6-1 列出了在使用 Jupyter Notebook 时可以使用的一些最有用的键盘快捷键。


    表 6-1


    Jupyter Notebook 的键盘快捷键


    | Mac | Windows 和 Linux | 操作 |

    | --- | --- | --- |

    | Cmd + Shift + P | Ctrl + Shift + P | 访问键盘快捷键 |

    | Shift + Enter | Shift + Enter | 执行代码 |

    | Esc | Esc | 在编辑模式下进入命令模式 |

    | Enter | Enter | 在命令模式下进入编辑模式 |

    | A | A | 在命令模式下，在选定单元格上方插入一个新单元格 |

    | B | B | 在命令模式下，在选定单元格下方插入一个新单元格 |

    | D + D (按 D 两次) | D + D (按 D 两次) | 在命令模式下删除选定的单元格 |

    | Shift + Tab | Shift + Tab | 显示输入到单元格中的项目的可用文档 |

    | Ctrl + Shift + - | Ctrl + Shift + - | 在编辑模式下，将选定的单元格在光标所在位置拆分为两个 |

    | F | F | 在命令模式下查找并替换代码 |

    | Shift + J / Shift + Down | Shift + J / Shift + Down | 选择所选单元格及其下方的单元格 |

    | Shift + K / Shift + Up | Shift + K / Shift + Up | 选择所选单元格及其上方的单元格 |

    | Shift + M | Shift + M | 合并多个单元格 |


    ## 总结


    在本章中，我们了解了与 IDE 和文本编辑器相比，笔记本界面的重要性。然后，我们探索了 Jupyter Notebook 应用程序、其功能及其用户界面。


    Jupyter Notebook 的妙处在于，它看起来相当复杂和技术性，但实际上，一旦你掌握了窍门，使用起来并不太难。总的来说，它是一个适用于你所有编程目的的绝佳工具。不仅如此，它还可以用来以一种赏心悦目的方式展示你的结果和呈现你的输出。


    在接下来的几章中，我们将借助 Jupyter Notebook 开始一些实际的编程。我们将亲身体验如何有效地使用笔记本界面来输入、运行和调试我们的代码。最后，一旦我们对
    Jupyter Notebook 有了一定的熟悉度，我们将继续使用该界面来开发我们的机器学习模型。


