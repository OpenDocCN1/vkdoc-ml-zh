- fmt: '### The Second AI Winter (1987–1993)


    The second AI winter can be traced back to around 1987.


    1. In the 1980s, `LISP` machines were invented, which were special hardware systems
    that were used for AI programming in the `LISP` language. However, by 1987, better
    alternatives were introduced, which reduced the demand for exclusive `LISP` machines.
    Later, in the 1990s, expert systems such as the `LISP` machine were found to be
    difficult to maintain. This caused a fall in their production.


    2. In 1981, a project was started by the Japanese Ministry of International Trade
    and Industry to develop a high-tech reasoning machine. It was called the Fifth-Generation
    Project. In 1983, `DARPA` once again began to fund AI research. However, in 1987,
    the funding was again stopped. The team involved in the project soon found that
    their list of objectives for the project had not been achieved even after ten
    years. Decades passed with no results.


    3. By the end of 1993, more than 300 AI companies had either been acquired, shut
    down, or gone bankrupt, marking the occurrence of the second AI winter.


    **Quick Bite**


    Following the second AI winter, many researchers and businesses avoided the term
    `artificial intelligence`, as they felt it had a negative aura to it. They thus
    began to use other names instead, including the now popular `machine learning`.


    There is also plenty of research going on in the field of AI ethics, which is
    another important sector within the realm of artificial intelligence.


    ## AI Ethics


    The field of AI ethics is mainly concerned with the moral behavior and intentions
    involved in the development and implementation of an AI system. So, why are AI
    ethics important? To answer this question, let’s consider the following two scenarios.


    ### Scenario 1: Deepfakes


    With recent developments in AI technology, systems can now create exact virtual
    replicas of actual people. These are known as deepfakes, where, for example, a
    fake video of a person can be created with the help of AI.


    Now, obviously, this kind of technology can have various outcomes—some positive
    and some negative. This is where AI ethics come in to play.


    Suppose a group of AI developers want to design deepfake videos of the president
    of their country. AI ethics make each of these developers ask themselves the question:
    Why am I doing this?


    If the developer’s answer is not selfish, harmful, or fatal, then they can proceed
    with what they were doing. However, if their answer is any of the above, then
    they may have to reconsider the motives behind their project.


    Of course, in some cases, it is easy to decide whether an AI tool is alright or
    not. The problem is, sometimes it is not exactly possible to figure that out.


    ### Scenario 2: Making Decisions


    Most of us have already heard about self-driving cars, right? These cars are trained,
    with AI, to accelerate, maneuver, and brake, all while taking a rider to their
    destination.


    There have also been videos online about these cars safely avoiding animals on
    the road, thus saving the life of the animal as well as that of the person inside.


    But what if the car is in a situation where a crash is inevitable? And this time,
    it doesn’t involve an animal, but another human being? What should the car do?


    To have a better idea of this, let’s take the following example:


    A young father of four children is traveling in his self-driving car, returning
    home after a long day of work. The car is moving at a constant high velocity along
    a highway. Suddenly, out of nowhere, an old couple starts crossing the road, right
    in front of the car. The car now has two options:


    1. It can swerve away from the couple, crash into the low cement wall on the side
    of the highway, and thus likely result in the death of the passenger.


    2. It can save the passenger’s life by crashing into the old couple, thus likely
    taking their lives.


    *What should the car do in this situation?*


    Some may argue that the car should save the old couple because that would be two
    lives saved, which is greater than the one life that would be lost within the
    car. Others, however, may argue that the young man still has so much to do in
    this world, and on top of that, he has his wife and children depending on him,
    and so it would be better to save his life.


    This is quite a dilemma, isn’t it?


    Human beings themselves find it difficult to come up with a definite answer for
    this. However, we do have something that machines do not have, i.e., our natural
    instinct, which, in a way, helps us to make decisions in such situations. Machines
    need some kind of factual information to be able to differentiate between right
    and wrong. Thus, it would be difficult for the car to know what to do in such
    a case.


    That’s why AI ethics is a growing field in the world of artificial intelligence.
    Through discussions, research, and trials, ethical problems such as these can
    be tackled.


    Once a solution is developed, however, new inventions and ideas can be implemented
    into our daily lives. Self-driving cars will no longer be a potential hazard.
    Deepfakes can be created for beneficial purposes. More technologies will come
    up, and there will be less fear in the hearts of people regarding what kind of
    developments are being made in the artificial intelligence sector.


    ## Artificial Intelligence and IoT


    The Internet of Things (IoT) is the connection of various objects in order to
    form a network of devices that can interact with one another. It was developed
    in order to enable non-living, unrelated objects to work together, assess their
    surroundings, understand a situation, and react accordingly, without the need
    for human intervention. IoT devices are interconnected with the help of software,
    sensors, and other such technologies. They send signals to each other, receive
    signals from one another, and thus exchange data via the internet.


    Many researchers have begun integrating it with artificial intelligence. This
    has led to a variety of new technologies and devices that they soon hope to integrate
    into an average person’s day-to-day life.


    ### Applications of IoT


    IoT has been greatly accepted and highly demanded due to its great scope in terms
    of usability. Some of its applications are discussed in the following sections.


    #### Smart Homes


    Smart homes refer to the phenomenon of home automation, where the home does tasks
    on its own, without the need for anyone to control it. So far, smart homes have
    been able to do the following:


    1. Switch lights on or off.


    2. Keep a check on the overall temperature of the home.


    3. Make sure all electronic devices are turned off when not in use.


    4. Monitor the health of the inhabitants of the home.


    Smart homes aim to make life a little more convenient for people by reducing the
    amount of time or effort they need to put into little everyday tasks. They also
    aim to provide assistance to those who might be differently abled, and even to
    the elderly.


    #### Wearables


    Wearables, as the name suggests, are devices that can be worn and that collect
    data about the wearer for further processing. Some common wearables are as follows:


    1. Heart-rate monitors


    2. Fitness monitors


    3. Glucose monitors


    They also include smartwatches that can connect to a person’s phone and interact
    with it.


    #### Smart Greenhouse


    The greenhouse farming technique aims to enhance crop yield by moderating temperature
    parameters. The problem is, this becomes difficult when it is required to be done
    by people. Smart greenhouses, therefore, can be used to fix this.


    1. Its sensors can measure the various parameters.


    2. It sends this data to the cloud, which processes this information.


    3. An appropriate action is taken with regards to the plant/s involved.


    This concept helps to reduce the costs of salaries and maintenance, and to increase
    productivity.'
