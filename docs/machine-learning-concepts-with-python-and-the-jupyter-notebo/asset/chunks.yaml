    \n在介绍这种方法之前，让我们先看看什么是“pip”。\n\n### 了解“pip”\n\n在 Python 中，“pip”只是一个标准的包管理器。它用于从\
    \ Python 包的默认源——Python 包索引（PyPI）安装和管理 Python 中的包和软件。\n\n它于 2008 年首次发布，名称为 pyinstall，作为\
    \ easy_install 的替代品。后来，它被缩写为 pip，据称是“Pip Installs Packages”的首字母缩写。\n\n### “pip\
    \ install”方法\n\n使用 pip 安装包的一般命令如下：\n\n```\npip install \n```\n\n就是这样！只需一行。一旦使用\
    \ pip 安装了包，它就会保留在工作环境中，直到我们卸载它。这意味着我们不必每次在程序中使用该包时都重新安装它。\n\n### 其他有用的 pip 命令\n\
    \n除了安装包之外，pip 下还有几个命令，我们可以调用并执行它们以方便地管理我们的包。其中一些包括：\n\n1.  `pip list`：这为我们提供了所有已安装包的列表。\n\
    \n2.  `pip show <包名>`：这为我们提供了有关指定包的信息。\n\n3.  `pip list—outdates`：这显示了我们系统上所有过时包的列表。\n\
    \n4.  `pip search <包名>`：这会搜索指定的包。\n\n5.  `pip uninstall <包名>`：这会从环境中卸载一个包。\n"
- fmt: "### Using `pip install` to Install TensorFlow\n\nThe great thing about this\
    \ method is that we don’t need to do much. All we need to do is type in a single\
    \ line of code, and everything else happens on its own.\n\nTo install TensorFlow\
    \ into our environment, follow these steps:\n\n![../images/491271_1_En_8_Chapter/491271_1_En_8_Fig4_HTML.jpg](images/491271_1_En_8_Chapter/491271_1_En_8_Fig4_HTML.jpg)\n\
    \nFigure 8-4: Entering the correct environment\n\n1. After opening Anaconda, make\
    \ sure that you are in the correct environment, and not in the base (root) environment.\
    \ For example, here I have chosen to work in `myenv`, as shown in Figure [8-4](#491271_1_En_8_Chapter.xhtml#Fig4).\n\
    \n![../images/491271_1_En_8_Chapter/491271_1_En_8_Fig5_HTML.jpg](images/491271_1_En_8_Chapter/491271_1_En_8_Fig5_HTML.jpg)\n\
    \nFigure 8-5: Launching Jupyter Notebook\n\n2. Open the Jupyter Notebook application\
    \ by launching it from within the working environment, as shown in Figure [8-5](#491271_1_En_8_Chapter.xhtml#Fig5).\n\
    \n![../images/491271_1_En_8_Chapter/491271_1_En_8_Fig6_HTML.jpg](images/491271_1_En_8_Chapter/491271_1_En_8_Fig6_HTML.jpg)\n\
    \nFigure 8-6: Opening a Python 3 Jupyter Notebook\n\n3. From the dashboard, click\
    \ on “New,” and then select the option to open a new Python 3 Notebook, as shown\
    \ in Figure [8-6](#491271_1_En_8_Chapter.xhtml#Fig6).\n\n4. In the code cell that\
    \ appears, type in the following line of code to instruct the computer to begin\
    \ installing TensorFlow using `pip`:\n\n    ```\n    pip install tensorflow\n\
    \    ```\n\n    The installation will begin. You will see a box appear beneath\
    \ the code cell, displaying a plethora of content, representing all that is happening\
    \ behind the scenes of our single-line code. An asterisk will appear at the left\
    \ corner of the code cell, indicating that the code is still running. It will\
    \ disappear once the process is completed, as shown in Figure [8-7](#491271_1_En_8_Chapter.xhtml#Fig7).\n\
    \n    ![../images/491271_1_En_8_Chapter/491271_1_En_8_Fig7_HTML.jpg](images/491271_1_En_8_Chapter/491271_1_En_8_Fig7_HTML.jpg)\n\
    \n    Figure 8-7: Installing TensorFlow\n\n5. When the installation is complete,\
    \ we can check and see if TensorFlow is properly installed or not. To do this,\
    \ first restart the kernel. Then, type in the following:\n\n    ```\n    import\
    \ tensorflow as tf\n    ```\n\nThis small piece of code is used to call the TensorFlow\
    \ library into Jupyter Notebook. The `tf` is assigned as a type of nickname for\
    \ the library (we will see more of this in the next chapter when we practice coding\
    \ with TensorFlow).\n\nThe cell should be executed without any errors, as shown\
    \ in Figure [8-8](#491271_1_En_8_Chapter.xhtml#Fig8).\n\n![../images/491271_1_En_8_Chapter/491271_1_En_8_Fig8_HTML.jpg](images/491271_1_En_8_Chapter/491271_1_En_8_Fig8_HTML.jpg)\n\
    \nFigure 8-8: TensorFlow installed on the system\n\nIf your notebook doesn’t show\
    \ any indication of an error when running the command, then congratulations! You\
    \ have successfully installed TensorFlow in your Python environment.\n\nTensorFlow\
    \ also has a feature that provides users with all the necessary tools required\
    \ to visualize data easily. This is known as the TensorBoard.\n\n## TensorBoard\n\
    \nThe TensorBoard is, according to the official TensorFlow website, “TensorFlow’s\
    \ visualization toolkit.”\n\nIt is an interface that can be used to obtain a clearer\
    \ understanding of our data and our deep learning models with the help of visualization\
    \ techniques.\n\nSome of its applications include the following:\n\n1. Visualizing\
    \ parameters and metrics\n2. Visualizing the computational graph\n3. Viewing plots\
    \ and graphs\n4. Displaying media items like pictures, text, or audio\n\nWhen\
    \ you run TensorBoard, it will look something like Figure [8-9](#491271_1_En_8_Chapter.xhtml#Fig9).\n\
    \n![../images/491271_1_En_8_Chapter/491271_1_En_8_Fig9_HTML.jpg](images/491271_1_En_8_Chapter/491271_1_En_8_Fig9_HTML.jpg)\n\
    \nFigure 8-9: A sample of the TensorBoard\n\nFigure [8-9](#491271_1_En_8_Chapter.xhtml#Fig9)\
    \ shows the TensorBoard panel for a very simple graph. The dashboard tabs at the\
    \ top of the screen vary, depending on the components of the model. Here, we have\
    \ only a single dashboard; i.e., the Graph dashboard. Now, have a look at Figure\
    \ [8-10](#491271_1_En_8_Chapter.xhtml#Fig10).\n\n![../images/491271_1_En_8_Chapter/491271_1_En_8_Fig10_HTML.jpg](images/491271_1_En_8_Chapter/491271_1_En_8_Fig10_HTML.jpg)\n\
    \nFigure 8-10: TensorBoard’s various tabs\n\nThis navigation bar shows three other\
    \ tabs: Scalars, Distributions, and Histograms. Each of these leads to the corresponding\
    \ dashboard view, which can be used to study and improve the deep learning model.\n\
    \n### Exploring the TensorBoard Dashboards\n\nThere are several different types\
    \ of dashboards that we can access and use for their respective purposes. Let’s\
    \ have a look at them.\n\n- **Scalars:**\n  This shows us the changes occurring\
    \ to metrics like loss and accuracy during each epoch of the training. It also\
    \ allows us to keep track of the different scalar values. Being able to compare\
    \ these metrics allows us to figure out any issues present within the model in\
    \ order to improve it.\n\n- **Graphs:**\n  This shows us the computational graph\
    \ of our model. By inspecting the graphical representation of our model, we can\
    \ easily check its accuracy and reliability. This makes it easier to debug the\
    \ code or make changes in its structure, thus improving the quality of the model.\n\
    \n- **Distributions:**\n  This shows us how the inputs are distributed throughout\
    \ the training of a model. It helps us to keep a visual check on the values of\
    \ the weights and biases as they change over time. These parameters are extremely\
    \ important when training a model, so being able to get a clear understanding\
    \ of them is necessary.\n\n- **Histograms:**\n  Just like the Distributions dashboard,\
    \ this helps us to keep a visual check on the values of weights and biases, but\
    \ from a three-dimensional point of view, with the help of histograms. These histograms\
    \ represent the changing data corresponding to the timeline of the training, enabling\
    \ us to decide if any alterations need to be made to the model.\n\n- **Projector:**\n\
    \  This is used to visualize high-dimensional word embeddings. Embedding consists\
    \ of the representation of words in numerical form in such a way that similar\
    \ words have similar encodings.\n\n- **Text:**\n  This is used to visualize text\
    \ data. These strings can be in the form of hyperlinks, tables, and so on.\n\n\
    - **Image:**\n  This is used to visualize image data. These images are saved as\
    \ `.png` files.\n\n- **Audio:**\n  This is used to visualize audio data. It can\
    \ embed audio in the form of playable audio widgets.\n\nThus, with the help of\
    \ the TensorBoard, we can easily inspect, modify, and verify the working of our\
    \ model.\n\nTensorBoard has also added a new service that mainly aids collaborative\
    \ projects, allowing people to share their machine learning projects for free.\
    \ This service is called TensorBoard.dev."
