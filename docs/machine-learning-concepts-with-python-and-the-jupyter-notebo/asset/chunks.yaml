- fmt: '### Late 1990s: AI Reborn


    In the late 1990s, artificial intelligence once again became a topic of interest.
    Companies began to take up AI as their focus, and many AI technologies were being
    implemented. Funding for AI began once again, enabling AI researchers to move
    forward and develop newer and better inventions. A lot of goals were finally met,
    which motivated researchers to move forward in their work.


    In 1997, IBM finished development of `Deep Blue`, which was the first computer
    to defeat Garry Kasparov, the world famous chess champion, which it did on May
    11. The event was broadcast live over the internet, sparking the interest of millions
    of people. This was a huge milestone in the AI realm, as it demonstrated the vast
    potential that existed in training machines.


    The reason for this was said to be the increase in the capacity and speed of computer
    processing. In fact, `Deep Blue` was found to be 10 million times faster than
    the `Ferranti Mark 1`. Over the years, technology improved, thus paving the way
    for better AI machines.


    By 2000, there was still some skepticism toward AI. `HAL 9000`, a fictional AI
    character created in 1968, was based on the hope that similar AI technology would
    soon be possible by 2001. Unfortunately, this ended up being an unachieved dream,
    much to the disappointment of many researchers.


    This did not stop them, however, and they continued working hard and investing
    time, money, and effort into the field. In 2005, a Stanford Robot was developed
    that drove autonomously for close to 131 miles on an unfamiliar desert route.
    Around 2007, a team from CMU created a vehicle that autonomously navigated 55
    miles while following all traffic regulations. In February 2011, IBM debuted `Watson`,
    which defeated two *Jeopardy* champions, thus winning the quiz game.


    Artificial intelligence soon branched out into big data, Internet of Things (IoT),
    data science, machine learning, and deep learning. People realized the need to
    specialize in a particular sector so as to collectively contribute to the advancement
    of AI.


    As of 2020, artificial intelligence continues to be one of the most in-demand
    areas of employment and research, with people encouraging more and more innovative
    ideas to be developed and implemented, not just on a professional or specialized
    level, but also in our day-to-day lives.


    **Quick Bite**


    There are five Founding Fathers of artificial intelligence: John McCarthy, Alan
    Turing, Marvin Minsky, Allen Newell, and Herbert A. Simon.


    ## Pros and Cons of Artificial Intelligence


    Since its advent, artificial intelligence has been highly favored by some and
    highly criticized by others. It has its benefits, and it also has its drawbacks.
    Let’s go through some of them to get a better idea of how AI has affected the
    world so far.


    ### The Pros


    Artificial intelligence became vastly popular mainly for the following reasons:


    1. It allowed machines to replace manpower in performing certain tasks, especially
    mundane and tiring ones.

    2. It allowed machines to become much more efficient, giving them the ability
    to solve problems on their own and requiring less work on the part of developers.

    3. It can be accessed and utilized at any time.

    4. It can also perform tasks that would generally be difficult or dangerous for
    human beings to do.

    5. When developed well, there is less scope of errors on their part.


    ### The Cons


    Over the years, as artificial intelligence continued to garner people’s interest,
    it also began to display certain drawbacks, including the following:


    1. It was expensive to develop and maintain.

    2. It resulted in unemployment, since machines began to take over tasks that people
    used to do.

    3. Many people misused the technology for personal benefit and unethical gain.

    4. At times it was difficult to find people with enough experience to develop
    the programs needed for the problem.

    5. It took a lot of time and computational power to develop the various AI models.


    ### Challenges Faced by Artificial Intelligence


    Keeping the pros and cons in mind, we can now understand that although artificial
    intelligence has deeply interested many people, it also struggles in many ways
    to reach its full potential. At present, the challenges faced by AI include the
    following:


    1. The scope of artificial intelligence is somewhat limited. This is mainly because
    of the amount of resources, technology, funds, and manpower available for it.

    2. Real-world implementation is still not easy. Many AI machines exist only theoretically
    or as prototypes, but have not yet been put into practical applications.

    3. Security is a big issue when it comes to artificial intelligence. This is because
    AI requires loads of data in order to be trained, and this data can be taken either
    ethically or unethically from people. As mentioned before, AI ethics is a growing
    area of importance in the field of AI, but it still has a long way to go before
    it can really have any kind of significant impact.


    Apart from the challenges listed here, artificial intelligence has also undergone
    seasons of disinterest. This has happened twice so far, starting in around 1974.
    It resulted in many AI developments’ being stalled, and people’s heading into
    other fields of work and research.


    ## The AI Winter


    As you have already read in an earlier section, there were times during the history
    of artificial intelligence when people’s overall interest in the area became cold.
    To a certain extent, people nearly gave up on the field. They restricted the quantity
    of resources and funding given for its research and growth. Such a period is known
    as an AI winter.


    ### The First AI Winter (1974–1980)


    The first AI winter can be traced back to around 1974. It was not an abrupt break
    in the progress of artificial intelligence. Rather, it was an inevitable consequence
    of certain setbacks that occurred prior to it.


    1. Around 1967, the “quiet decade of machine translation” began, where researchers
    found it difficult to correctly translate languages with the help of artificial
    intelligence. After spending enormous amounts of money in this area, the funding
    was finally stopped.

    2. Approximately two years later, Minsky and Papert published their book, *Perceptrons*.
    This book explicitly critiqued perceptrons, which had a negative impact on connectionism.
    People soon abandoned the connectionism approach for years.

    3. In 1969, the Mansfield Amendment was passed, as a result of which the Defense
    Advanced Research Projects Agency (DARPA) restricted their funding to projects
    that focused on military benefits only.

    4. In 1973, the “Lighthill Report” was published, which evaluated the progress
    made and emphasized the downfall of artificial intelligence. Although this report
    faced plenty of public criticism, it eventually caused a feeling of pessimism
    to sweep over researchers and investors, who ultimately withdrew from the field.

    5. In 1974, DARPA discontinued funding the Speech Understanding Research (SUR)
    program at Carnegie Mellon University, due to the latter’s production of an inefficient
    speech-recognition AI machine that did not fulfill their requirements.

    6. Thus, by 1974, the first AI winter had begun, mainly due to the lack of funding,
    which stalled any further research. Thankfully, this period only lasted until
    about 1980.'
