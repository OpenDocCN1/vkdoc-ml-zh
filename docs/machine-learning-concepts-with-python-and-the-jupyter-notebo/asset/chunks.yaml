  trans: '

    ### Jupyter Notebook 的优势


    Jupyter Notebook 自发布以来，已被证明是一款强大的编程工具，尤其适合高级程序员。它拥有流畅且易于使用的界面，非常适合编程新手。它还允许用户直接在系统中创建新文件和文件夹，以便轻松存储代码。


    让我们更深入地了解 Jupyter Notebook 作为编程应用程序的突出之处。它具有以下特点：


    *   它提升了整体的编程体验。

    *   它是一个交互式应用程序。

    *   它是开源的；即，可以免费下载、安装和使用。

    *   它允许用户在笔记本中的代码行之间，以 Markdown 格式添加注释、说明和标题，这在与他人共享代码时特别有用。

    *   编辑代码非常方便，因为每行代码都可以添加到单独的单元格中，并且这个单元格可以被删除、修改、替换等。

    *   与他人共享和分发代码非常容易。

    *   每个笔记本都可以转换为不同的文件格式，如 HTML、Markdown、PDF 等。


    Jupyter Notebook 目前需求量很大，但它进入编程世界的时间相当晚。在其诞生之前，已经有其他应用程序，如文本编辑器和集成开发环境（IDE），供程序员使用，并且这些工具至今仍在使用。


    ## 文本编辑器与 IDE


    早期，程序员会将所有代码输入到像 Windows 记事本这样的文本编辑器中。这些文本编辑器允许他们输入代码，然后安装额外的插件来增加功能。之后，他们必须将所有代码转移到命令提示符下才能运行。


    后来，IDE 被创建出来，为程序员提供了一个包含开发代码所需所有功能的环境。他们无需在单独的应用程序中编写和运行代码，也无需每次都安装新插件。他们可以在一个工作区内轻松地创建、编辑、调试和运行代码。


    让我们先看看经典的文本编辑器，了解它们是如何用于编程的。


    ### 初识文本编辑器


    多年来，程序员使用了各种工具和环境来编写代码，包括最基本的文本编辑器。


    文本编辑器是一种计算机程序，顾名思义，用于编辑纯文本。


    它们通常随操作系统默认提供。它们允许用户编辑文档和源代码等文件。文本编辑器的一些例子包括 Mac OS 上的 TextEdit 应用程序、Linux 上的
    Vim，以及广为人知的 Windows 上的记事本。


    文本编辑器非常适合刚进入该领域、仍在熟悉编码的开发者。它们也随时可在系统上使用。这就是为什么大多数人更喜欢从文本编辑器开始。


    然而，随着高级程序复杂性的增加，特别是人工智能和机器学习的引入，程序员感到需要创建能够简化流程的工作空间。因此，他们提出了称为 IDE 的东西。


    ### 初识 IDE


    IDE，即集成开发环境，通过提供必要的工具和服务，使我们能够编写、编辑、测试和调试代码。


    例如，借助 IDE，我们可以非常轻松地管理资源、调试错误和补全代码。大多数 IDE 仅限于单一编程语言，但有些允许用户使用多种语言。


    ### IDE 的特点


    大多数 IDE 都具备以下特点：


    1.  **文本编辑器：** 允许用户编写和编辑代码，并根据所使用的语言提供语法高亮。

    2.  **代码自动补全：** 识别程序员可能的下一个输入，并相应地插入该组件。这减少了出错的机会，也显著减少了编程所花费的时间。

    3.  **调试工具：** 查找代码中的任何错误并进行修正，从而节省时间，使程序员的工作更轻松。

    4.  **编译器：** 用于将代码翻译成机器能够理解和处理的格式。


    ### IDE 的优势


    使用 IDE 进行编程被认为具有以下优势：


    1.  它是一个单一环境，程序员可以在其中访问所有必需的工具和实用程序。

    2.  它可以自动补全代码并自行调试错误，减少了程序员付出的精力和时间。

    3.  它还能自行管理语法，在处理缩进时尤其有用。

    4.  如果需要，可以轻松地回退代码，而不会造成大的不便。

    5.  项目协作变得更加容易。


    ### 一些流行的 IDE


    三种最常用的 IDE 如下：


    *   **IDLE：** IDLE，即集成开发与学习环境，会随 Python 自动安装。它轻量且简单，易于学习。它提供的工具与文本编辑器中的类似。它支持跨平台使用和多窗口文本编辑。对于
    IDE 新手来说，这是一个不错的起点。

    *   **Spyder：** Spyder，即科学 Python 开发环境，是一个开源的 IDE。它非常适合 IDE 的初学者。它具有文本编辑器的功能，但带有图形用户界面（GUI），使人们能够轻松地从简单的编程应用程序过渡到这个更高级的应用程序。它甚至允许安装额外的插件以获得更多好处。它在视觉上也与
    RStudio 相似，允许人们轻松地从 R 语言切换到 Python。

    *   **Pycharm：** Pycharm 是一个专业的 Python IDE。它由 JetBrains 公司开发。它提供代码编辑器、错误高亮和调试器，并且都带有
    GUI。它还可以通过允许用户更改其颜色、主题等进行个性化设置。它集成了 Numpy 和 Matplotlib，使得处理图形和数组查看器变得容易。


    注意


    尽管 IDE 一直被用来描述允许程序员编写和编辑代码、调试错误等工作环境，但 IDE 的主要定义正因 Jupyter Notebook 等其他工具的引入而慢慢改变，这些工具也允许用户轻松地开发代码。


    ### IDE 与文本编辑器对比


    文本编辑器一直非常易于使用。即使是编程世界的新手也能轻松地使用它们进行编码，而无需担心学习使用新的应用程序。在理解编程界面方面，它们需要的精力更少。


    另一方面，IDE 需要程序员先熟悉一下，才能自如地充分利用其功能。然而，它们拥有额外的功能和工具，可以简化编程体验。


    结论：这完全取决于我们的需求和偏好。如果我们不想花时间学习如何使用一个应用程序，而宁愿为我们的代码使用一个简单的界面，我们可以使用文本编辑器。如果我们愿意投入一点时间学习如何使用一个应用程序，而这将有助于我们后续满足其他编程需求，那么我们可以使用
    IDE。


    现在我们已经了解了文本编辑器和 IDE 是什么，我们可以看到笔记本界面，特别是 Jupyter Notebook，与同类应用程序相比，对程序员来说更具优势。

    '
- fmt: '### Jupyter Notebook vs. Other Programming Applications


    Why would we want to choose Jupyter Notebook over other programming applications?
    Well, let’s have a look at the following differences between Jupyter Notebook
    and other such applications:


    - **Tools:** Jupyter Notebook provides users with tools and utilities that make
    the programming experience much faster and easier. Compared to other IDEs, Jupyter
    Notebook has more services available.

    - **Graphical User Interface:** The GUI of Jupyter Notebook varies because it
    is meant to look like a notebook and not like a general IDE. This makes it easier
    on the eye and quite simple to understand.

    - **Usability:** It is easier to use Jupyter Notebook compared to other IDEs because
    of its easily accessible features.

    - **Learning:** Compared to other IDEs, Jupyter Notebook may take a little time
    to grasp, just because of how different it is from what we are used to. However,
    once we do learn it, it becomes extremely convenient to use.

    - **Web-based:** Jupyter Notebook runs on the browser, unlike other IDEs, which
    work on the local system.

    - **Visualization:** Although some IDEs provide users with a great platform for
    visualization, other IDEs don’t. Jupyter Notebook does, though, thus making it
    easier for a programmer to use plots and other such visualization techniques.


    In this way, Jupyter Notebook outdoes its competitors in the programming world.


    Jupyter Notebook sounds like a blast, doesn’t it? Well, it is! Once we get the
    hang of it, we can thoroughly enjoy programming with it. Let’s now learn how to
    set up our Jupyter Notebook environment on our machine.


    ### Installing Jupyter Notebook


    As mentioned in the previous chapter, one advantage of using Anaconda is that
    the installation of Jupyter Notebook becomes quite an easy task to achieve. There
    is no hassle of navigating through various applications just to download it. All
    we need to do is the following:


    1. Open the Anaconda Navigator.

    2. Select the working environment, as shown in Figure [6-1](#491271_1_En_6_Chapter.xhtml#Fig1).

    3. Click on the option to install Jupyter Notebook.


    ![../images/491271_1_En_6_Chapter/491271_1_En_6_Fig1_HTML.jpg](images/491271_1_En_6_Chapter/491271_1_En_6_Fig1_HTML.jpg)


    Figure 6-1 Installing Jupyter Notebook


    Et voila! Jupyter Notebook is now ready for use. In the next few sections, we
    will explore its interface so as to get ourselves comfortable with the layout
    and working of the application.


    **Note:** When installing, we must make sure that we install Jupyter Notebook
    and not JupyterLab. There’s a difference!


    ## Launching Jupyter Notebook


    The first thing we will need to do is select our working environment. Here, I
    have chosen `myenv`.


    Next, we need to open up the Jupyter Notebook window. We can do this by opening
    the Anaconda application and then clicking on "Launch" under the Jupyter Notebook
    icon.


    Since Jupyter Notebook is a web-based application, it opens in our browser. The
    first window that opens is a dashboard, which gives us a glimpse of our work so
    far, including files, folders, and notebooks. It will look like Figure [6-2](#491271_1_En_6_Chapter.xhtml#Fig2).


    ![../images/491271_1_En_6_Chapter/491271_1_En_6_Fig2_HTML.jpg](images/491271_1_En_6_Chapter/491271_1_En_6_Fig2_HTML.jpg)


    Figure 6-2 The Jupyter Notebook Dashboard


    The URL bar contains a link that represents the notebook server, and indicates
    that it is running from our local machine. The link will appear like this - `http://localhost:8888/tree`.


    The rest of the dashboard is quite self-explanatory, but we will run through it
    anyway. Here’s a breakdown of some of the basic but most important features of
    the Jupyter Notebook interface, as shown in Figure [6-3](#491271_1_En_6_Chapter.xhtml#Fig3):


    1. The Logout button allows us to log out of our Jupyter Notebook session.

    2. The Upload button allows us to upload a readily available Jupyter Notebook
    that we can use.

    3. The New button allows us to create a new Python notebook, file, folder, or
    terminal.

    4. The File tab shows us an ordered list of all our files and folders.

    5. The Running tab shows us any terminals or notebooks that are open and running.

    6. The Name button allows us to toggle the way our list of files and folders is
    displayed; i.e., in ascending or descending alphabetical order.

    7. We can even select the "Last Modified" option to display our items based on
    the last time that they were modified.

    8. The little check-box option with a "0" beside it allows us to select all folders,
    notebooks, files, and items that are open and running. We can even select all
    of the items at once.

    9. In our list of items, the ones with a folder icon next to them represent the
    folders that we have on our computer, as shown in Figure [6-4](#491271_1_En_6_Chapter.xhtml#Fig4).


    ![../images/491271_1_En_6_Chapter/491271_1_En_6_Fig4_HTML.jpg](images/491271_1_En_6_Chapter/491271_1_En_6_Fig4_HTML.jpg)


    Figure 6-4 List of folders


    10. Once we create Jupyter notebooks and text files, they will begin to appear
    on the dashboard. The items with a page icon next to them represent the documents
    that have a `.txt` extension, and the ones with a notebook icon next to them represent
    the Jupyter notebooks, which have a `.ipynb` extension, as shown in Figure [6-5](#491271_1_En_6_Chapter.xhtml#Fig5).


    ![../images/491271_1_En_6_Chapter/491271_1_En_6_Fig5_HTML.jpg](images/491271_1_En_6_Chapter/491271_1_En_6_Fig5_HTML.jpg)


    Figure 6-5 A notebook and a file


    ![../images/491271_1_En_6_Chapter/491271_1_En_6_Fig3_HTML.jpg](images/491271_1_En_6_Chapter/491271_1_En_6_Fig3_HTML.jpg)


    Figure 6-3 Some important features of the Jupyter Notebook dashboard


    Now that we are aware of the general features of the Jupyter Notebook interface,
    let’s see what happens when we select an item from our list by clicking on the
    check box next to it. When we select an item, we will have a number of available
    options, as shown in Figure [6-6](#491271_1_En_6_Chapter.xhtml#Fig6):


    ![../images/491271_1_En_6_Chapter/491271_1_En_6_Fig6_HTML.jpg](images/491271_1_En_6_Chapter/491271_1_En_6_Fig6_HTML.jpg)


    Figure 6-6 Controls available for each item


    1. We can Rename the item.

    2. We can Duplicate the item to make another copy of it.

    3. We can Move the item to another location.

    4. We can Download the item.

    5. We can View the item, which will open in a new tab in our browser window.

    6. We can Edit the item.

    7. We can Delete the item by clicking on the red trash can symbol.

    8. We can Shutdown a notebook that is open and running, as shown in Figure [6-7](#491271_1_En_6_Chapter.xhtml#Fig7).


    ![../images/491271_1_En_6_Chapter/491271_1_En_6_Fig7_HTML.jpg](images/491271_1_En_6_Chapter/491271_1_En_6_Fig7_HTML.jpg)


    Figure 6-7 Option to shut a notebook down


    9. We can even select several items at the same time and perform any available
    action on them.


    Let us now create a brand new Jupyter notebook and explore all the features within
    it.'
