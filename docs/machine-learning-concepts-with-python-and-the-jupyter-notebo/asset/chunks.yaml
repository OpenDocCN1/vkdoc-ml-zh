- fmt: '# Machine Learning Model Design


    ## Labels and Features


    - **Labels:** These are the components of the data that are to be predicted; i.e.,
    the dependent variable or output. They are determined based on the features provided
    to the system.

    - **Features:** These are the components of the data that are used for prediction;
    i.e., the independent variable or input. They determine the labels of the outputs.
    When choosing features, it is important to ensure that they are independent and
    distinct.


    ## Learning Methods


    When training a deep learning model, we can choose either of the following methods
    based on how we intend to input our features and labels:


    - **Supervised learning:** We feed the model with the features and the labels.

    - **Unsupervised learning:** We feed the model with the features only.

    - **Semi-supervised learning:** We feed the model with some labeled features and
    some unlabeled features.


    > **Note:** The quality of the labels is proportional to that of the features.
    In other words, better features result in more accurate labels.


    ## Data Splitting


    Once we have finished altering our data, we need to split it into two parts: the
    training data and the test data.


    - **Training data:** Training data is what is fed into the model to be used while
    it is training. This will generally be a greater proportion of the data, since
    the model requires a larger amount of data when training to get more accurate
    results.

    - **Test data:** Test data is what is fed into the model after it has finished
    training and settled on optimal parameters. This will generally be a lesser proportion
    because it is only meant to help the model determine how accurate or inaccurate
    its prediction is.


    ## Building the Model


    After we are done pre-processing the data, the next step is to build the model.
    We need to develop the architecture of our machine learning model. In this case,
    we will be using a neural network. Thus, we need to arrange the neural network
    by defining the following:


    - The number of hidden layers

    - The number of neurons in each layer

    - The weights and biases

    - The activation function


    In Chapter [3](#491271_1_En_3_Chapter.xhtml), we learned how neural networks work,
    and we studied their different types. For example, convolutional neural networks
    (CNNs) are best used for image classification and recognition, and recurrent neural
    networks (RNNs) are great for machine translation and speech recognition. We can
    choose our preferred neural network after careful consideration of our data, resources,
    and desired outcome, and accordingly build the model that we require.


    ## Training the Model


    Once the model is built, it is ready to be trained. This is where the programmer
    steps aside and gives way to the machine, which proceeds to do some intense work.
    All we need to do here is call the training data into the model and then start
    the process. During training, the model begins trying out different values and
    replacing the parameters, i.e., the weights and the biases, in order to come up
    with the most suitable equation that will give high accuracy and low error. It
    follows a trial-and-error manner, and keeps changing the values of the parameters
    until it gets a result that is satisfactory.


    We have already seen the following in Chapter [3](#491271_1_En_3_Chapter.xhtml):


    - The values of the weights and biases are constantly tweaked to make the output
    more suitable and to give stronger predictions. This is called training the model.

    - The output is predicted from the input data. This is known as forward propagation.

    - The weights and biases are modified in order to reduce the loss. This is known
    as back propagation.


    Although it seems like everything should end here, it’s not always a good idea
    to do so. Why? Well, there is always a possibility that the result still may not
    be the most optimal one. For example, overfitting can happen, resulting in inaccuracy.
    This is why, after training, the model must also be tested.


    ## Testing the Model


    Once we have our trained model, we need to feed the test data into it. We then
    allow the model to run this data through to see how accurate its predictions are.
    In this way, we validate the model. Depending on this accuracy, we can decide
    if we want to change certain aspects of the model and then retrain it, or leave
    it as it is. Of course, there are several other factors that can affect this decision
    as well, including time, computational power, and so on. For example, the programmer
    may not have enough resources to redesign and retrain the model. Or perhaps there
    isn’t enough time. So, before retraining the model, the programmer must take all
    of these factors into consideration.


    The machine continues to repeat this cycle of training and testing the model until
    it produces an acceptable outcome. The structure of a machine learning model can
    vary greatly with regard to more specific factors, depending on the type of problem
    that we are solving. Hence, as mentioned earlier, we need to correctly define
    our problem and the solution we hope to achieve, and then carefully plan out our
    model to minimize error.


    Now that we are aware of the general design of a machine learning model, the next
    thing we need to do is get familiar with the Keras API, which is integrated with
    the TensorFlow library and which we will be using to develop our code.


    # Keras


    Before we learn about Keras as a TensorFlow API, let’s have a look at Keras as
    an independent and popular machine learning library.


    Keras is an open source deep learning library. It was written in Python and can
    work on top of TensorFlow, as well as on Theano, R, PlaidML, and the Microsoft
    Cognitive Toolkit. It was developed within the project ONEIROS (Open-ended Neuro-Electronic
    Intelligent Robot Operating System). It was initially released on March 27, 2015,
    under the MIT license.


    According to the official website, Keras mainly focuses on “Deep Learning for
    Humans.” In other words, the developer is its priority, rather than the machine.
    It was created to make the programming process less burdensome for the user. It
    makes it easier for the user to write and debug code, and also provides sufficient
    guides and documentation.


    Keras was initially just an individual library that could be called and deployed
    within a program. In fact, its original backend was Theano. However, when Google
    introduced TensorFlow, programmers began to implement both together, until it
    became such that one could not have Keras without TensorFlow and vice versa. Seeing
    the growing popularity of this deadly combination, Keras soon made TensorFlow
    its default backend, which was a smart move on their part.


    In 2017, TensorFlow added the `tf.keras` sub-module into its package, which was
    separate from the Keras library that needed to be installed (using the `pip` function).
    This was the first step to support Keras within its package. Finally, with the
    release of TensorFlow 2.0 in 2019, Keras became the official high-level API for
    machine learning. This gave an added boost to both the libraries, as they could
    now be used together to develop and train powerful neural networks.


    ## Features of Keras


    Keras contains several features and tools that make deep learning much easier.
    Some of these include the following:


    1. It can function smoothly on CPU as well as on GPU.

    2. Models can easily be exported onto servers, browsers, embedded devices, and
    so on.

    3. It is flexible and consistent, making research and deployment less difficult
    for users.

    4. It supports several types of neural networks, like CNNs and RNNs.

    5. It has extensive documentation for further study, and a community for users
    to support one another.'
