- fmt: '# The Gender-Biased AI Recruiter


    In general, when a recruiter looks through a list of candidates for a job, what
    would be the factors that are considered? Some of them may include, in no particular
    order:


    1. Relevant Experience

    2. Area of Study

    3. Qualification

    4. Extra projects

    5. Background

    6. References


    The recruiter would go through the resume, check their information with regards
    to the job that they are applying for, and probably give them a call to verify
    the information. Throw in a few extra tests and assessments as well, depending
    on the company. And if the person ends up being a good fit, they are given the
    job.


    That’s pretty much how an ethical employment process works, right?


    Now when it comes to AI bots, they do not have the mind of a human being that
    enables them to understand the differences between relevant and irrelevant factors.
    All they have is data that they go through, find patterns in, and make decisions
    on.


    The bots at this highly reputed company were trained with at least ten years’
    worth of job applications. And as we know, there are usually more men in the work-place
    than women, right? So the machine, while learning from its data, thought that
    a person’s gender was an important factor to be considered when hiring. Its thought
    process was basically this:


    *Men = Good Fit,*


    *Women = Bad Fit.*


    Thus, it began rejecting applications that had any sort of reference to females
    on it. In this way, it was biased against the female applicants.


    Of course, the company made efforts to fix this. They altered their program so
    that it would remain neutral in such instances. However, many people are still
    quite critical towards it, as they feel that the machine can still come up with
    new ways to be discriminative.


    This was a great learning experience for AI enthusiasts, because they realised
    that while all AI machines don’t end up being prejudiced, it is still a possible
    outcome that needs to be tackled in the right way. It also shows that precaution
    must be taken while developing the AI machine itself. We must especially be careful
    about what kind of data we are using, since it is this data that the machine depends
    upon to learn.


    It’s quite interesting, isn’t it? It’s like raising a child. The child learns
    from all that she or he is taught. If she/he learns good things, and is given
    good experiences, it is more likely that the child will manifest it outwardly.
    However, if the child is raised with the wrong ideas, it will adversely affect
    her/him.


    There have even been times when certain areas of Artificial Intelligence proved
    to be disappointing to researchers, and people nearly stopped showing enthusiasm
    towards the field. Such a period is known as an ‘AI Winter’, which we will read
    about later on.


    One thing that almost everyone can agree on, though, is this: Artificial Intelligence
    and Machine Learning are progressing greatly, and are extremely important. If
    done in the right way, we can create systems that can truly revolutionise the
    world and the way we live.


    This is why there is so much demand for jobs in these fields. This is also why
    there is so much research going on, and several new ideas being introduced with
    regards to it. Capturing data, storing it, and then programming with it has become
    so much easier and faster.


    So as we begin our Artificial Intelligence and Machine Learning journey, let’s
    have a look at some of the important concepts that we will need to know in order
    to really understand what we are getting into, and how we can use it to create
    useful and efficient technology.


    ## Acknowledgments


    *“And whatever you do, in word or deed, do everything in the name of the Lord
    Jesus, giving thanks to God the Father through him.”*


    > —Colossians 3:17


    First and foremost, I would like to thank God Almighty for giving me this amazing
    opportunity, and for helping me to successfully complete this book.


    Next, I would like to thank my Dad, S. Mohan Kumar, my Mom, Agnes Shanthi Mohan,
    and my elder sister, Vinita, for being my constant support, help, and inspiration
    throughout this endeavour.


    I’m also extremely grateful for the entire Apress team, who worked tirelessly
    and patiently to review my chapters, put forward their suggestions, and provide
    the necessary guidance that I needed, with the aim to make the final product truly
    enriching to its readers. Working with them has taught me so much.


    Of course, I mustn’t forget my friends, acquaintances, peers, well-wishers, and
    other people in my life who contributed in their own way, by praying for me, motivating
    me, guiding me, and even tolerating me when I seemed to be too busy for them.


    Last, but not least, I’m grateful for the Internet, which played a major role
    in this entire process.


