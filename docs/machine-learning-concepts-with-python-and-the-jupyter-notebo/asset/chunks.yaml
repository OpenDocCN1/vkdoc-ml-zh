    Now, if we give it the eight images from Figure [11-2](#491271_1_En_11_Chapter.xhtml#Fig2),\
    \ it would\nsolve the problem effortlessly and classify the images according to\n\
    their type by studying each picture, finding its closest possible label\nmatch,\
    \ and placing it in that class. This is how image classification is\ndone using\
    \ a machine learning model.\nIn the programs that we will be going through, we\
    \ will focus on\ninstructing the computer to train and test similar image classification\n\
    models with the help of neural networks.\nLet’s start with our very first deep\
    \ learning program.\n\nProgram 1: Image Classification Using a Pre-Trained\nModel\n\
    Before we begin building models and training\nthem, we need to understand what\
    \ our main objective is. Many times, we\nfocus more on creating models that give\
    \ us high accuracy during\nvalidation, but we completely forget to carry out a\
    \ final inference to\nsee if the model has really been trained well.\nInference\
    \ is the process of using a trained machine learning model to\nmake a prediction.\n\
    During inference, we take a random element from the entire dataset\nand pass it\
    \ through the model to see if it can predict that element’s\nclass correctly.\
    \ The result of this prediction helps us to infer or\ndeduce whether the model\
    \ is accurate or not.\nTo make this clearer, let’s write a fun little image classification\n\
    program, in which we will take a pre-trained model and carry out\ninference to\
    \ validate its predictions.\n\nNote\n\nDon’t worry too much about understanding\
    \ each and every step of this\nprogram. As long as you get the basic idea of what\
    \ is happening, that\nshould be enough.\n\nThe Working\nSince this is a model\
    \ that has already been trained,\nwe need not worry about that part. All we need\
    \ to do is load an image\nfrom the file, prepare it, feed it to the model, and\
    \ retrieve its\noutcome.\n\nThe Structure\n\nThe structure of\nthis program is\
    \ short and sweet:\n\n1.  It loads the pre-trained model into the Jupyter notebook.\n\
    \n2.  It loads an image into the notebook.\n\n3.  It prepares the image for the\
    \ model.\n\n4.  It predicts the probability across all output classes.\n\n5. \
    \ It converts the probabilities into labels.\n\n6.  It identifies the highest\
    \ probability.\n\n7.  It displays\n    the result.\n\nThe API\nThis program will\
    \ be using the newly added high-level Keras API.\n\nThe Program\n**Step 1: Open\
    \ a new Jupyter notebook.**\nStart by launching the Anaconda application. Enter\
    \ the required\nvirtual environment, and then launch Jupyter Notebook within it.\
    \ From\nthe Jupyter Notebook dashboard, open up a new notebook for Python 3\n\
    programming. We can give this notebook a name, like “Inference for\nPre-Trained\
    \ Models.”\n**Step 2: Import TensorFlow and Keras utilities into the\nnotebook.**\n\
    \nImport TensorFlow, the Keras API, and all the extra functions into the\nJupyter\
    \ notebook, using the following code:\n\n```\nimport tensorflow as tf\nimport\
