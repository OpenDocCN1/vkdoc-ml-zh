- fmt: 'So far, we have learned about artificial intelligence, under which we have
    machine learning and its sub-set, deep learning. We have also learned about the
    `Python` programming language, which is popularly used for machine learning coding.
    We even got familiar with the `Jupyter Notebook` interface, in which we can write,
    edit, and debug our programs. We then saw how we can combine `Python` with `Jupyter
    Notebook` as an efficacious way to write our code. After this, we were introduced
    to the `TensorFlow` library as an important package within `Python`, and once
    we understood how the library was useful, we proceeded to learn about its recent
    upgrade—`TensorFlow 2.0`—which has additional features and abilities that make
    our machine learning models easier to build.


    Now, we have finally come to the most important topic in this book: learning how
    to build and execute machine learning models with the help of the `TensorFlow`
    library. As explained before, the main reason `TensorFlow` was created was to
    aid developers, not just with basic machine learning programming, but also with
    more advanced machine learning procedures. In other words, `TensorFlow` was created
    predominantly for deep learning that employs neural networks.


    In this chapter, we will learn a little more about how machine learning models
    are made, and we will also try out seven programs of our own. Each of these programs
    is an image classification problem that requires neural networks, all constructed
    using the `Keras` API, which we will go through later on.


    The seven programs are as follows:


    1.  Image Classification Using a Pre-Trained Model

    2.  Handwriting Recognition Using `Keras` in `TensorFlow` (Single Layer, Multi-class)

    3.  Clothing Classification Using `Keras` in `TensorFlow` (Multi-layer, Multi-class)

    4.  Clothing Classification Using Convolutional Neural Networks (Multi-layer,
    Multi-class)

    5.  Handwriting Recognition Using Convolutional Neural Networks (Multi-layer,
    Multi-class)

    6.  Image Classification for `CIFAR-10` Using Convolutional Networks (Multi-layer,
    Multi-class)

    7.  Dogs vs. Cats Classification Using Convolutional Neural Networks (Multi-layer,
    Binary)


    We will go through each of these programs step-by-step to get a thorough idea
    of all the processes and components involved in developing them, particularly
    the following:


    - The structure

    - The dataset

    - The API

    - The activation functions

    - The optimizer

    - The program


    By fully understanding these seven programs, we will be well equipped to create
    our own models for other similar problems.


    Before we begin programming, there are two things that we need to do to prep ourselves:


    1.  Understand the structure of a machine learning model.

    2.  Get acquainted with `Keras`, which we will be using under `TensorFlow` to
    build and train our deep learning models.


    In Chapter [2](#491271_1_En_2_Chapter.xhtml), we saw the steps that are to be
    followed when solving a machine learning problem. Here, we will go through the
    general structure of a machine learning model to obtain a clearer idea of how
    it is built.


    ## Structure of a Machine Learning Model


    Machine learning, as mentioned earlier, requires part of the work to be done by
    us. The rest of it is all done behind the scenes by the computer. In other words,
    it all happens in the backend of the code. This, in all honesty, saves us, as
    programmers, a lot of trouble. There are, however, still plenty of tasks that
    we need to carry out while creating our model in order to make sure that we get
    the output we desire.


    A machine learning developer’s task is mainly to build the model and then run
    it. There are several components to this model, depending on what exactly we are
    trying to accomplish, but the general architecture remains the same.


    Since we will be using neural networks to carry out our machine learning processes,
    we will study the structure of a deep learning model that uses a neural network.
    The overall idea for the structure of the model is as shown in Figure [11-1](#491271_1_En_11_Chapter.xhtml#Fig1).


    ![../images/491271_1_En_11_Chapter/491271_1_En_11_Fig1_HTML.jpg](images/491271_1_En_11_Chapter/491271_1_En_11_Fig1_HTML.jpg)


    **Figure 11-1** Flowchart of a machine learning model


    As we can see in the flowchart, there are four main steps involved in developing
    a working machine learning model, as follows:


    1.  **Data loading and pre-processing:** This part accepts data, manipulates it,
    then prepares it for training and testing.

    2.  **Building the model:** This is the part where the developer specifies the
    various components of the model.

    3.  **Training the model:** This part takes the training data and begins performing
    calculations on it to get an optimum result.

    4.  **Testing the model:** This part validates or checks the accuracy of the model.


    The first two steps require the time, effort, and skills of a programmer, since
    they involve the handling of data and the creation of a working model. For the
    last two steps, all the programmer has to do is set the model running and then
    kick back and relax while the machine does all the hard work.


    Let’s go through this structure in a little more detail to get a better idea of
    what it does, how it works, and what needs to be done.


    ## Data Loading and Pre-Processing


    In Chapter [2](#491271_1_En_2_Chapter.xhtml), we had a look at the different methods
    of collecting data. We also learned that this data requires some pre-processing
    before it can be used for any kind of analysis in order to ensure optimal results.
    This means that we might need to add, remove, or change some values.


    Now remember, *this does not mean that we are completely changing our data*, which
    can result in incorrect outputs. We are just making it more readable for our system
    to take and work with.


    Here are some examples of this:


    1.  Suppose we had data containing a list of 500 married women and the number
    of children each of them have. From this list, almost everyone has at least one
    child. Only five of them have no children. Now the problem is that we need to
    predict the number of hours of sleep these women get in a day, based on the number
    of children they have. Obviously, the details of these five women would not be
    required for this study since they do not have children. Thus, we would have to
    remove their data from the list.

    2.  Sometimes, apart from numerical values, our data may also contain terms like
    *None* or *No*, which could basically imply a zero, depending on the problem.
    Thus, we would need to either change those values to `0` or remove them from the
    dataset.

    3.  In some cases, we may want to round off our numerical values to the nearest
    whole number. This can be done either for the whole dataset or just for a section
    of it.


    Data can be altered manually. Applications like spreadsheets or visualization
    software come in handy when working with structured data. However, when the dataset
    is huge, it becomes quite tiring and monotonous to work with. Thus, most developers
    use a Python library called `Pandas`, which provides users with several tools
    and utilities to work on their data. With the help of `Pandas`, users can import
    a `.csv` file (csv: comma separated values) from their local system into a `Jupyter
    notebook`.


    In this book, we will be using image datasets that are already integrated within
    the `TensorFlow` library. They can easily be called with the help of a `TensorFlow`
    function, as we will see later on.


    The data that we use for training machine learning models is divided into two
    categories: labels and features.'
