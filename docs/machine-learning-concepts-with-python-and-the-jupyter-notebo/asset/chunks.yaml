  trans: "\n3.  `sparse_categorical_crossentropy`：\n    用于多类别分类，无需使用独热编码。\n\n**优化器：**\n\
    模型会根据数据和损失函数对自身进行调整，以产生最优结果。优化器用于改变权重的值，从而最小化损失函数。\n**评估指标：**\n该指标用于监控模型在训练和测试过程中的步骤。“准确率”选项会考虑正确识别和分类的图像数量。\n\
    \n要编译模型，我们输入如下代码：\n\n```\nmodel.compile(optimizer = 'adam',\nloss = 'sparse_categorical_crossentropy',\n\
    metrics = ['accuracy'])\n```\n\n这里，我们使用了`adam`优化器、`sparse_categorical_cross_entropy`损失函数和`accuracy`评估指标。\n\
