    ## TensorFlow 概览


    TensorFlow 由谷歌大脑团队开发，是对早期闭源深度神经网络机器学习系统 DistBelief 的升级。根据其官方网站的描述：


    > *“TensorFlow 是一个端到端的开源机器学习平台。它拥有一个全面而灵活的生态系统，包含工具、库和社区资源，让研究人员能够推动机器学习领域的前沿发展，并让开发者能够轻松构建和部署由机器学习驱动的应用程序。”*


    换句话说，TensorFlow 是一个利用机器学习和深度学习技术进行大规模计算的开源库。它涉及使用“张量”（tensors），这有助于简化我们的计算。我们将在下一节中深入探讨这一点。


    **趣闻**


    实际上，TensorFlow 最初并非面向公众开放。它仅用于谷歌大脑团队自己的研究。然而，它最终于 2015 年 11 月 9 日向公众发布。


    TensorFlow 在 Apache 2.0 许可证下发布。这意味着人们可以不受版税限制地使用、修改和分发该软件及其修改版本。其再分发仅需提供一份署名声明。这就是
    Apache 2.0 许可证被称为著佐权（copyleft）许可证的原因。它对软件再分发的条件要求最低，并允许为了公共利益而访问、修改和分发软件。


    TensorFlow 包含两个主要组件，如下所示：


    1.  *张量*（Tensors），用于存储数据

    2.  *流*（Flow），指计算图


    让我们看看这两者如何协同工作来创建大规模的深度学习模型。


    ### 张量


    张量可以定义为多维数组。


    我们可能还记得在学校学过的维度概念。维度大致定义为描述特定点所需的最小坐标数。简单来说，它是衡量一个物体占据空间大小的度量。例如，一条线只有一个维度（长度），而一个正方形有两个维度（长度和宽度）。在数学中，我们可以有一个数字或一组按不同维度排列的数字。


    在数学和物理学中，我们学过标量、向量和矩阵，它们是描述某些数值排列的三种结构。


    单个数字称为*标量*。多个数字按一维列表（数组）排列称为*向量*。多个数字按二维方式排列称为*矩阵*。从视觉上看，我们可以用图 8-1 来表示这三个概念。


    ![../images/491271_1_En_8_Chapter/491271_1_En_8_Fig1_HTML.jpg](img/491271_1_En_8_Fig1_HTML.jpg)


    图 8-1


    标量、向量和矩阵


    从技术上讲，标量、向量和矩阵都是张量。


    *   标量是零维张量。

    *   向量是一维张量。

    *   矩阵是二维张量。


    然而，一个普遍接受的做法是，当我们在三个或更多维度上排列多个数字时，我们将这种排列称为*张量*。


    我们可以将张量想象成魔方的形状，如图 8-2 所示。


    ![../images/491271_1_En_8_Chapter/491271_1_En_8_Fig2_HTML.jpg](img/491271_1_En_8_Fig2_HTML.jpg)


    图 8-2


    一个张量


    从图中可以看出，张量具有巨大的数据存储能力，因为它们有 *n* 个维度。这里的 *n* 代表实际维度的数量，其中 *n* >= 3。


    为了更好地理解标量、向量、矩阵和张量之间的关系，我们可以用图 8-3 来描绘它们。


    ![../images/491271_1_En_8_Chapter/491271_1_En_8_Fig3_HTML.jpg](img/491271_1_En_8_Fig3_HTML.jpg)


    图 8-3


    标量、向量、矩阵和张量的符号表示


    如您所见，这四种数据结构在符号表示上也非常相似，区别仅在于它们的容量。


    尽管张量通常保存数字，但它们也可以保存文本和字符串。张量能够以紧凑的形式包含大量数据。这使得处理我们程序的计算变得更加容易，即使我们需要使用海量数据来训练我们的模型。


    ### 流


    程序的输入以张量的形式接收，然后借助计算图以分布式模式执行。这些图用于设置整个程序的*流*。


    计算图是一个流程图，描述了需要对输入张量执行的操作和函数。张量从一端进入，经过一系列操作，然后从另一端作为代码的输出出来。


    这就是 TensorFlow 名称的由来——输入张量遵循一个系统化的流，从而产生所需的输出。


    现在我们已经了解了 TensorFlow 是什么，让我们来看看它对机器学习开发者有何用处。


    ## TensorFlow 的重要性


    TensorFlow 最初主要用于数学目的。由于其强大的计算能力，它很快被应用于机器学习。它使得构建神经网络的任务变得不那么繁琐。


    正如前面的定义所述，TensorFlow 在可操作性上极其灵活，并且适用于跨多种平台（如 Mac OS、Windows、Linux 和 Android）的机器学习算法。它使用
    Python、C 和 CUDA（统一计算设备架构）三种语言编写，虽然与 Python 配合最佳，但也支持 Java 和 C++ 等其他语言。


    它还不断进行改进，以跟上程序员不断变化的需求。其庞大的社区是一个主要优势，这使得使用 TensorFlow 的人们能够协同工作、互相帮助，并有效地使用该库。


    ## TensorFlow 的应用


    尽管相对较新，TensorFlow 已经在人工智能的多个领域发挥了作用，并且仍在继续。它的一些应用包括：


    *   **图像识别**：从照片或视频中识别物体或特征

    *   **图像分类**：识别物体并将其相互分离

    *   **文本摘要**：将内容压缩成几个可理解的词语

    *   **情感分析**：识别陈述是正面、负面还是中性

    *   **语音识别**：识别口语并将其转换为文本

    *   **其他深度学习项目**


    借助 TensorFlow，使用神经网络进行深度学习变得轻而易举。因此，该库的大部分应用都集中在人工智能的这个领域。


    ## TensorFlow 的竞争对手


    尽管 TensorFlow 在结构和用法上相当独特，但在机器学习领域确实有一些竞争对手。这些是人们用来执行与 TensorFlow 相同功能的替代框架。其中一些库包括：


    *   Theano

    *   OpenCV

    *   PyTorch

    *   Apache Spark

    *   Keras


    所有这些库，尽管在功能和能力上有所不同，但在机器学习中都有类似的用途。Keras 库可以在 TensorFlow 之上使用，以开发更有效的深度学习模型。我们将在本书后面有机会使用
    Keras 和 TensorFlow。


    现在，让我们来看看使用 TensorFlow 的一些优点和缺点。


    ## TensorFlow 的优点和缺点


    既然我们已经对这个机器学习库相当熟悉了，那么让我们来看看在程序中实现它时的一些优点和缺点。

    '
- fmt: '### Advantages


    Considering the number of competitors that `TensorFlow` has, one might wonder
    what the big deal is and why a lot of people regard it as their preferred deep
    learning library. There’s a reason it stands out compared to the other libraries.
    We will now have a look at some of its important features in order to understand
    how it is advantageous for us to use it in our code.


    1. It is open source. This means that it is free to access, download, use, and
    distribute, as per the Apache 2.0 License under which it was released. Users are
    not charged for implementing this library in their projects.

    2. It is constantly modified. This makes room for improvements in its source code
    and ensures stability in its performance.

    3. It can be used on multiple platforms, making it easily accessible to developers.

    4. It follows the manner of abstraction, which means that all the developer needs
    to take care of is the overall working of the program. `TensorFlow` handles everything
    else on its own.

    5. It makes data visualization much easier by providing programmers with something
    called a `TensorBoard`. This is a web-based interactive dashboard that allows
    us to view and observe our graphs.

    6. It has several APIs in various programming languages that enable a developer
    to create and execute programs and graphs with ease. An example of this is the
    `Keras` API, which, as mentioned earlier, we will be using later on in this book.

    7. It has a large community of enthusiastic developers, which allows `TensorFlow`
    users to connect, learn, share, and help one another.


    Now, I know, this all sounds great. It almost sounds like `TensorFlow` is one
    of the greatest inventions of all mankind, doesn’t it? Yet, it is quite astonishing
    to know that while `TensorFlow` gained a worldwide fan following, it also began
    to gain a considerable number of “haters”—developers who were mildly or greatly
    disappointed with the library due to some of its drawbacks.


    ### Disadvantages


    Nothing is perfect, and no matter how flawless this library might seem, it does
    have certain areas where it either fails or proves to be insufficient for developers.
    Let’s take a look at some of the disadvantages of `TensorFlow` that were discovered
    by its users over the years.


    1. It followed “lazy” execution. This means that the developer had to first initialize
    variables, and then run separate sessions for the program. This proved to be tedious
    for developers who had to keep opening and running sessions for even the smallest
    sections of their programs.

    2. The `TensorFlow` framework was such that codes that had a very minimalistic
    structure still required plenty of extra lines of code.

    3. The error messages were not always accurate and were sometimes faulty or incorrect,
    which made debugging quite a task.

    4. It was slightly more complex than necessary, which made it confusing for beginners
    to learn, especially if they were new to computer programming in general.


    Most programmers managed to work around these challenges in order to accomplish
    their machine learning goals, which is why `TensorFlow` retained a very large
    user base. However, the `TensorFlow` team soon understood that there was a lot
    of room for improvement in the library, in order to make it even more convenient
    for programmers to use.


    Thus, they came up with a newer, better version—`TensorFlow 2.0`. It was first
    released as a test version, which was available for users to install, work with,
    and provide feedback about. Later, in 2019, `TensorFlow 2.0` was officially released
    for people to use.


    That said, let us first get a little familiar with `TensorFlow 1.0`, and then
    we’ll dive into its upgraded version. We’ll start by learning how to install the
    `TensorFlow 1.0` library onto our systems.


    ## Installing TensorFlow


    One of the easiest methods of installing `TensorFlow` is by employing the `pip
    install` method. It is usually recommended because of how quick and simple it
    is.


    Before getting into this method, let us first have a look at what `pip` is.


    ### Getting to Know `pip`


    In Python, `pip` is nothing but a standard package manager. It is used for the
    installation and handling of packages and software in Python, from the default
    source of Python packages—the Python Package Index (`PyPI`).


    It was first released in 2008 under the name `pyinstall`, as an alternative to
    `easy_install`. Later, it was shortened to `pip`, which is supposed to be an acronym
    for “Pip Installs Packages.”


    ### The `pip install` Method


    The general command to install a package using `pip` is as follows:


    ```

    pip install

    ```


    That’s it! Just a single line. Once a package is installed using `pip`, it remains
    in the working environment until we uninstall it. This means that we don’t have
    to keep reinstalling the package every time we want to use it within our program.


    ### Other Useful `pip` Commands


    Apart from installing packages, there are several commands under `pip` that we
    can call and execute in order to manage our packages conveniently. Some of these
    include the following:


    1. `pip list`: This provides us with a list of all installed packages.

    2. `pip show <package name>`: This provides us with information about the specified
    package.

    3. `pip list—outdates`: This shows a list of all outdated packages on our system.

    4. `pip search <package name>`: This searches for the specified package.

    5. `pip uninstall <package name>`: This uninstalls a package from the environment.'
