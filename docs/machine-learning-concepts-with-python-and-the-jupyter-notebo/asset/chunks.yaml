    # Program 6: Image Classification for CIFAR-10 Using Convolutional Neural Networks
    (Multi-layer, Multi-class)


    Before we begin this program, let’s have a look at the dataset that we will be
    working with.


    ## The Dataset


    The dataset that we will be using in this program is CIFAR-10, which stands for
    Canadian Institute For Advanced Research. It is a collection of 60,000 color images,
    each of size 32x32. There are ten different classes, with 6,000 images within
    each class. There are 50,000 training images and 10,000 test images.


    The ten different classes are airplanes, cars, birds, cats, deer, dogs, frogs,
    horses, ships, and trucks. Researchers can quickly train machine learning and
    computer vision models with the help of this dataset.


    Everything else is similar to the previous CNN programs, so let’s just go ahead
    with the program. Since by now the different steps involved in creating the model
    should be clear, we need not go through this program step-by-step. We will directly
    type in each line of code.


    ## The Program


    Let’s start by writing the code to build, train, and test the model, as follows:


    ```python

    import tensorflow as tf

    from tensorflow.keras import datasets, layers, models

    from tensorflow.keras.datasets import cifar10

    (ip_train, op_train), (ip_test, op_test) = cifar10.load_data()

    print(ip_train.shape, ip_test.shape)

    ip_train = ip_train.reshape(ip_train.shape[0], 32, 32, 3)

    ip_test = ip_test.reshape(ip_test.shape[0], 32, 32, 3)

    ip_train, ip_test = ip_train / 255.0, ip_test / 255.0

    model=models.Sequential()

    model.add(layers.Conv2D(32,(3,3), activation="relu", input_shape=(32,32,3)))

    model.add(layers.MaxPooling2D((2,2)))

    model.add(layers.Conv2D(64,(3,3), activation="relu"))

    model.add(layers.MaxPooling2D((2,2)))

    model.add(layers.Conv2D(64,(3,3), activation="relu"))

    model.add(layers.Flatten())

    model.add(layers.Dense(64, activation="relu"))

    model.add(layers.Dense(10, activation="softmax"))

    model.compile(optimizer = ''adam'',

    loss = ''sparse_categorical_crossentropy'',

    metrics = [''accuracy''])

    model.summary()

    model.fit(ip_train, op_train, epochs = 10)

    model.evaluate(ip_test, op_test, verbose = 2)

    ```


    Now let’s write the code for inference:


    ```python

    import matplotlib.pyplot as plt

    %matplotlib inline

    test_image=ip_test[20]

    ```


    Remember, the number within the square brackets can be changed accordingly, to
    select different test images.


    ```python

    plt.imshow(test_image.reshape(32,32,3))

    import numpy as np

    from tensorflow.keras.preprocessing import image

    classes = ["airplane", "automobile", "bird", "cat", "deer", "dog", "frog", "horse",
    "ship", "truck"]

    test_image = image.img_to_array(test_image)

    test_image = test_image.reshape(1,32,32,3)

    result = model.predict(test_image)

    result

    np.around(result)

    n=(np.around(result)).argmax()

    print(classes[n])

    ```


    When I ran the inference, I got two different outcomes:


    - The first test image was that of a horse, and the model was able to correctly
    identify the image.

    - The second image was that of a bird, but the model classified it as an airplane
    instead.


    Try changing the test image and then carry out inference. Are you able to get
    an accurate prediction?


