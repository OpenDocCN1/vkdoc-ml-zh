    ## The Help Menu


    If we need any extra help regarding the general Jupyter Notebook UI, the keyboard
    shortcuts that we can use, and some of the machine learning libraries that are
    frequently used with Python, we can access the Help menu from the menu bar. A
    drop-down menu will open, as shown in Figure [7-34](#491271_1_En_7_Chapter.xhtml#Fig34).


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig34_HTML.jpg](images/491271_1_En_7_Chapter/491271_1_En_7_Fig34_HTML.jpg)


    Figure 7-34


    Accessing the Help menu


    From this menu, we can select the option that we need help with. As you can see,
    the help options include topics related to the Jupyter Notebook application, as
    well as to Python libraries.


    ## Summary


    Well, there we go! We are now a lot more familiar with the user interface of Jupyter
    Notebook. We have also had a run-through of some important concepts related to
    programming, and we have seen how to code basic functions, like lists and loops,
    using Python.


    With that under our belts, it’s finally time to get the ball rolling as we step
    into Python’s machine learning libraries. We have already read about how Python
    has a vast selection of libraries that can be called into a program. Moving ahead,
    we will be focusing our attention on one such library that has become increasingly
    sought after. Over the years, it has gained the approval of several developers
    due to its unique features, which make the process of machine learning much more
    effortless. This library is none other than TensorFlow, which, in the coming chapters,
    we will be using to program our deep learning models.


    # Part IIIThe TensorFlow Library


    The TensorFlow Library


    In Part III, we will dive into the TensorFlow library. Starting with an introduction
    to this widely used deep learning package, we will make our way towards its initial
    version that has been in use since its release. We will then get into TensorFlow
    2.0, its distinguishing features, and a quick guide on how to migrate code from
    the previous version to the new version. The final chapter will lead us through
    a couple of deep learning programs with which we will use TensorFlow in Python
    and the Jupyter Notebook interface. This will help us to put it into practice
    all that we have learned throughout the book.


    What to expect from this part:


    *   An introduction to the TensorFlow Library so far


    *   Program with the TensorFlow Library (version 1.0)


    *   An introduction to TensorFlow 2.0


    *   Migrating from TensorFlow 1.0 to TensorFlow 2.0


    *   Using TensorFlow to develop machine learning models (focusing on deep learning
    neural networks)


    # 8. The Tensorflow Machine Learning Library


    To recap what was stated in an earlier chapter, Python has a huge variety of machine
    learning libraries that can be implemented in a program. These libraries serve
    various purposes—mathematical, scientific, graphical, and so on. Depending on
    the nature and the need of the program we are developing, we can call these libraries
    into our program.


    We know that machine learning involves data science techniques (like cleaning,
    manipulating, and visualizing data), mathematical techniques, and statistical
    techniques. Keeping this in mind, some of the most commonly used Python libraries
    for machine learning include Matplotlib, Seaborn, Pandas, Scikit-learn, Numpy,
    Scipy, and so on.


    These libraries have been tried and tested and were found to be easy to work with.
    They have thus gained popularity over the years, with numerous applications in
    various machine learning programs.


    With the growing enthusiasm toward deep learning, there arose a need to create
    libraries that could assist with building multi-layered neural networks. Thus,
    libraries like Theano, Pytorch, Caffe, Keras, and TensorFlow were released. These
    libraries enable programmers to develop large, multi-layered neural networks with
    less time and effort, and more efficiency.


    In this chapter, we will explore the TensorFlow library to get an overview of
    what it is, why it was developed, and how it has proved useful in the realm of
    artificial intelligence. We will then see how to install it on our system.'
