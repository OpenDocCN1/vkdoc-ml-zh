  trans: "\n### Jupyter Notebook 与其他编程应用程序\n\n为什么我们要选择 Jupyter Notebook 而不是其他编程应用程序呢？让我们来看看\
    \ Jupyter Notebook 与其他此类应用程序之间的以下区别：\n\n*   **工具：** Jupyter Notebook 为用户提供了使编程体验更快速、更便捷的工具和实用程序。与其他\
    \ IDE 相比，Jupyter Notebook 拥有更多可用的服务。\n\n*   **图形用户界面：** Jupyter Notebook 的 GUI\
    \ 与众不同，因为它旨在看起来像一个笔记本，而不是通用的 IDE。这使得它在视觉上更舒适，并且非常易于理解。\n\n*   **可用性：** 由于其功能易于访问，Jupyter\
    \ Notebook 比其他 IDE 更容易使用。\n\n*   **学习曲线：** 与其他 IDE 相比，掌握 Jupyter Notebook 可能需要一点时间，仅仅因为它与我们习惯的工具有很大不同。然而，一旦我们学会了它，使用起来就会变得极其方便。\n\
    \n*   **基于 Web：** Jupyter Notebook 在浏览器中运行，而其他 IDE 则在本地系统上运行。\n\n*   **可视化：**\
    \ 尽管有些 IDE 为用户提供了出色的可视化平台，但其他 IDE 却没有。不过，Jupyter Notebook 提供了这一功能，从而使程序员更容易使用图表和其他此类可视化技术。\n\
    \n通过这种方式，Jupyter Notebook 在编程世界中超越了其竞争对手。\n\nJupyter Notebook 听起来很棒，不是吗？嗯，确实如此！一旦我们掌握了它的窍门，我们就能彻底享受用它编程的乐趣。现在，让我们学习如何在自己的机器上设置\
    \ Jupyter Notebook 环境。\n\n### 安装 Jupyter Notebook\n\n如前一章所述，使用 Anaconda 的一个优点是，安装\
    \ Jupyter Notebook 变成了一项非常容易的任务。无需为了下载它而在各种应用程序中导航。我们只需要执行以下操作：\n\n1.  打开 Anaconda\
    \ Navigator。\n\n2.  选择工作环境，如图 6-1 所示。\n\n3.  点击安装 Jupyter Notebook 的选项。\n\n  \
    \  ![../images/491271_1_En_6_Chapter/491271_1_En_6_Fig1_HTML.jpg](img/491271_1_En_6_Fig1_HTML.jpg)\n\
    \n    图 6-1\n\n    安装 Jupyter Notebook\n\n瞧！Jupyter Notebook 现在就可以使用了。在接下来的几节中，我们将探索其界面，以便熟悉该应用程序的布局和工作方式。\n\
    \n注意\n\n安装时，我们必须确保安装的是 Jupyter Notebook 而不是 JupyterLab。两者是有区别的！\n\n## 启动 Jupyter\
    \ Notebook\n\n我们需要做的第一件事是选择我们的工作环境。在这里，我选择了 `myenv`。\n\n接下来，我们需要打开 Jupyter Notebook\
    \ 窗口。我们可以通过打开 Anaconda 应用程序，然后点击 Jupyter Notebook 图标下的“启动”来完成此操作。\n\n由于 Jupyter\
    \ Notebook 是一个基于 Web 的应用程序，它会在我们的浏览器中打开。打开的第一个窗口是一个仪表板，它让我们可以概览到目前为止的工作，包括文件、文件夹和笔记本。它看起来像图\
    \ 6-2。\n\n![../images/491271_1_En_6_Chapter/491271_1_En_6_Fig2_HTML.jpg](img/491271_1_En_6_Fig2_HTML.jpg)\n\
    \n图 6-2\n\nJupyter Notebook 仪表板\n\nURL 栏包含一个代表笔记本服务器的链接，并指示它正在从我们的本地机器运行。该链接看起来像这样\
    \ - `http://localhost:8888/tree`。\n\n仪表板的其余部分不言自明，但我们还是快速过一遍。以下是 Jupyter Notebook\
    \ 界面一些基本但最重要的功能的分解说明，如图 6-3 所示：\n\n1.  注销按钮允许我们退出 Jupyter Notebook 会话。\n\n2. \
    \ 上传按钮允许我们上传一个现成的 Jupyter Notebook 以供使用。\n\n3.  新建按钮允许我们创建一个新的 Python 笔记本、文件、文件夹或终端。\n\
    \n4.  文件选项卡向我们显示所有文件和文件夹的有序列表。\n\n5.  运行选项卡向我们显示任何已打开并正在运行的终端或笔记本。\n\n6.  名称按钮允许我们切换文件和文件夹列表的显示方式；即按字母升序或降序排列。\n\
    \n7.  我们甚至可以选择“上次修改”选项，根据项目上次修改的时间来显示它们。\n\n8.  旁边带有“0”的小复选框选项允许我们选择所有已打开并正在运行的文件夹、笔记本、文件和项目。我们甚至可以一次选择所有项目。\n\
    \n9.  在我们的项目列表中，旁边带有文件夹图标的项目代表我们计算机上的文件夹，如图 6-4 所示。\n\n![../images/491271_1_En_6_Chapter/491271_1_En_6_Fig4_HTML.jpg](img/491271_1_En_6_Fig4_HTML.jpg)\n\
    \n图 6-4\n\n文件夹列表\n\n10.  一旦我们创建了 Jupyter 笔记本和文本文件，它们就会开始出现在仪表板上。旁边带有页面图标的项目代表具有\
    \ `.txt` 扩展名的文档，而旁边带有笔记本图标的项目代表 Jupyter 笔记本，它们具有 `.ipynb` 扩展名，如图 6-5 所示。\n\n![../images/491271_1_En_6_Chapter/491271_1_En_6_Fig5_HTML.jpg](img/491271_1_En_6_Fig5_HTML.jpg)\n\
    \n图 6-5\n\n一个笔记本和一个文件\n\n![../images/491271_1_En_6_Chapter/491271_1_En_6_Fig3_HTML.jpg](img/491271_1_En_6_Fig3_HTML.jpg)\n\
    \n图 6-3\n\nJupyter Notebook 仪表板的一些重要功能\n\n现在我们已经了解了 Jupyter Notebook 界面的一般功能，让我们看看当我们通过点击项目旁边的复选框从列表中选择一个项目时会发生什么。当我们选择一个项目时，我们将看到许多可用的选项，如图\
    \ 6-6 所示：\n\n![../images/491271_1_En_6_Chapter/491271_1_En_6_Fig6_HTML.jpg](img/491271_1_En_6_Fig6_HTML.jpg)\n\
    \n图 6-6\n\n每个项目可用的控件\n\n1.  我们可以重命名该项目。\n\n2.  我们可以复制该项目以制作另一个副本。\n\n3.  我们可以将项目移动到其他位置。\n\
    \n4.  我们可以下载该项目。\n\n5.  我们可以查看该项目，它将在浏览器窗口的新选项卡中打开。\n\n6.  我们可以编辑该项目。\n\n7.  我们可以通过点击红色的垃圾桶符号来删除该项目。\n\
    \n8.  我们可以关闭一个已打开并正在运行的笔记本，如图 6-7 所示。\n\n![../images/491271_1_En_6_Chapter/491271_1_En_6_Fig7_HTML.jpg](img/491271_1_En_6_Fig7_HTML.jpg)\n\
    \n图 6-7\n\n关闭笔记本的选项\n\n9.  我们甚至可以同时选择多个项目，并对它们执行任何可用的操作。\n\n现在，让我们创建一个全新的 Jupyter\
    \ 笔记本，并探索其中的所有功能。\n"
- fmt: "# Inside a Jupyter Notebook\n\nTo create a new Jupyter Notebook, all we have\
    \ to do is click on ‘New’ on the dashboard, and then select the kernel of our\
    \ choice. Here, we select the ‘Python 3’ kernel, as shown in Figure [6-8](#491271_1_En_6_Chapter.xhtml#Fig7).\n\
    \n![../images/491271_1_En_6_Chapter/491271_1_En_6_Fig8_HTML.jpg](images/491271_1_En_6_Chapter/491271_1_En_6_Fig8_HTML.jpg)\n\
    \nFigure 6-8\n\nOpening a new Jupyter Notebook with a Python 3 Kernel\n\nWe will\
    \ get a new tab with a notebook user interface (UI) that looks like Figure [6-9](#491271_1_En_6_Chapter.xhtml#Fig9).\n\
    \n![../images/491271_1_En_6_Chapter/491271_1_En_6_Fig9_HTML.jpg](images/491271_1_En_6_Chapter/491271_1_En_6_Fig9_HTML.jpg)\n\
    \nFigure 6-9\n\nA new notebook\n\nThe notebook UI is quite self-explanatory as\
    \ well. However, just like before, we will have a quick run-through of all its\
    \ main features.\n\n1. At the top, the title of the notebook is displayed. It\
    \ starts out as “Untitled,” and when we click on it, we can change the name based\
    \ on our preference, as shown in Figure [6-10](#491271_1_En_6_Chapter.xhtml#Fig10).\n\
    \n   ![../images/491271_1_En_6_Chapter/491271_1_En_6_Fig10_HTML.jpg](images/491271_1_En_6_Chapter/491271_1_En_6_Fig10_HTML.jpg)\n\
    \n   Figure 6-10\n\n   Renaming a notebook\n\n2. Next to the title of our notebook,\
    \ we will see “Last Checkpoint,” with a timing. That indicates the last time the\
    \ notebook was auto-saved.\n\n3. Below this is the menu bar, containing a series\
    \ of drop-down menus, as shown in Figure [6-11](#491271_1_En_6_Chapter.xhtml#Fig11).\n\
    \n   ![../images/491271_1_En_6_Chapter/491271_1_En_6_Fig11_HTML.jpg](images/491271_1_En_6_Chapter/491271_1_En_6_Fig11_HTML.jpg)\n\
    \n   Figure 6-11\n\n   The Menu Bar\n\n4. After this comes the tool bar, containing\
    \ tools that we will need as we use Jupyter Notebook, as shown in Figure [6-12](#491271_1_En_6_Chapter.xhtml#Fig11).\
    \ We can hover over each tool icon to know what it does.\n\n   ![../images/491271_1_En_6_Chapter/491271_1_En_6_Fig12_HTML.jpg](images/491271_1_En_6_Chapter/491271_1_En_6_Fig12_HTML.jpg)\n\
    \n   Figure 6-12\n\n   The Tool Bar\n\n5. Finally, we have the area where we type\
    \ in all of our input and view our output, as shown in Figure [6-13](#491271_1_En_6_Chapter.xhtml#Fig13).\n\
    \n   ![../images/491271_1_En_6_Chapter/491271_1_En_6_Fig13_HTML.jpg](images/491271_1_En_6_Chapter/491271_1_En_6_Fig13_HTML.jpg)\n\
    \n   Figure 6-13\n\n   This is where the different kinds of cells appear, allowing\
    \ us to enter our input\n\nYou might have noticed that the menu bar contains the\
    \ Cell menu and the Kernel menu. These are two terms that are very important in\
    \ the Jupyter Notebook environment.\n\n## Cell\n\n*A cell is nothing but the box\
    \ in which we type all our input, which can either be code, regular text, or headings.*\n\
    \nWhen we first open our Jupyter notebook, we will see that the first cell is\
    \ a “Code” cell. This cell allows us to enter the commands, functions, variables,\
    \ constants, and all other inputs that are a part of our program. When we execute\
    \ this cell, the output, if any, is displayed beneath it.\n\nLet’s try typing\
    \ the following in the “Code” cell:\n\n```\nprint(\"Hello World!\")\n```\n\nNow,\
    \ we can execute the cell by clicking on the Run button from the tool bar. We\
    \ can also just use the keyboard shortcut, which is `Shift+Return`. We will find\
    \ that the code line is executed and the output is printed out right below the\
    \ cell, as shown in Figure [6-14](#491271_1_En_6_Chapter.xhtml#Fig14).\n\n![../images/491271_1_En_6_Chapter/491271_1_En_6_Fig14_HTML.jpg](images/491271_1_En_6_Chapter/491271_1_En_6_Fig14_HTML.jpg)\n\
    \nFigure 6-14\n\nExecuting a code cell\n\nThe second type of cell is a “Markdown”\
    \ cell. Markdown is a formatting syntax that is used to style plain text. Thus,\
    \ this cell is used to enter any text that is not a part of the code. This could\
    \ be explanations or notes that are needed in between the code, either to make\
    \ it easier for us as we program, or to make it more comprehensive for someone\
    \ else who is going through it. Once we type in all the necessary text and execute\
    \ the cell, it becomes a regular text box that is visible in our program.\n\n\
    Let’s try this text in the “Markdown” cell:\n\n```\nHello World!\n```\n\nOur Markdown\
    \ cell will display an output as shown in Figure [6-15](#491271_1_En_6_Chapter.xhtml#Fig15).\n\
    \n![../images/491271_1_En_6_Chapter/491271_1_En_6_Fig15_HTML.jpg](images/491271_1_En_6_Chapter/491271_1_En_6_Fig15_HTML.jpg)\n\
    \nFigure 6-15\n\nEntering regular text\n\nThe third type of cell is the “Heading”\
    \ cell. This cell is used to add headings throughout our program. This allows\
    \ us to make our entire program look much more organized, especially if we have\
    \ more than one program running within the same notebook.\n\nLet’s try typing\
    \ this in the “Heading” cell:\n\n```\nMy Program\n```\n\nThe heading will appear\
    \ as shown in Figure [6-16](#491271_1_En_6_Chapter.xhtml#Fig17).\n\n![../images/491271_1_En_6_Chapter/491271_1_En_6_Fig16_HTML.jpg](images/491271_1_En_6_Chapter/491271_1_En_6_Fig16_HTML.jpg)\n\
    \nFigure 6-16\n\nEntering a heading\n\nWe can also just open a regular Markdown\
    \ cell and type the following in: `# My Program`. The ‘#’ symbol is used to convert\
    \ the sentence into a heading. The number of times we use the symbol indicates\
    \ the level of the heading. For example, a single hash is used to obtain a level\
    \ one heading. We can change the type of cell that we want to use by selecting\
    \ it from the list of options in the Tool Bar.\n\n## Kernel\n\n*A kernel runs\
    \ the code that is contained within the Jupyter notebook.*\n\nA kernel is not\
    \ limited to a single cell, but rather to the entire notebook. When we execute\
    \ code in a selected cell, the code runs within the kernel and sends any output\
    \ back to the cell to be displayed.\n\nThere are kernels for more than a hundred\
    \ languages, including Python, C, R, and Java. When we create a new notebook from\
    \ the Jupyter Notebook dashboard, we are basically selecting our kernel by choosing\
    \ the Python version that we desire to use. In this case, when we select “Python\
    \ 3,” we are telling our system to open a Python 3 kernel.\n\nNow that we have\
    \ some idea of what a cell and a kernel are, let’s come back to the menu bar and\
    \ explore what the Cell and Kernel drop-down menus allow us to do.\n\n## The Cell\
    \ Drop-Down Menu\n\nFigure [6-17](#491271_1_En_6_Chapter.xhtml#Fig17) shows the\
    \ different options available within the Cell drop-down menu.\n\n1. **Run Cells:**\
    \ This executes the code that is in the selected cell or cells, and gives an output,\
    \ if any.\n\n2. **Run Cells and Select Below:** This executes the selected cells\
    \ and then selects the cell below them.\n\n3. **Run Cells and Insert Below:**\
    \ This executes the selected cells and then inserts an extra cell just below them.\n\
    \n4. **Run All:** This executes all the cells in the notebook.\n\n5. **Run All\
    \ Above:** This runs all the cells that are above the selected cell.\n\n6. **Run\
    \ All Below:** This runs all the cells that are below the selected cell.\n\n7.\
    \ **Cell Type:** This allows us to select the type of cell you require.\n\n8.\
    \ **Current Outputs:** This gives us the option to either Toggle, Toggle Scrolling,\
    \ or Clear the selected output.\n\n9. **All Output:** This gives us the option\
    \ to either Toggle, Toggle Scrolling, or Clear all the output in the notebook.\n\
    \n![../images/491271_1_En_6_Chapter/491271_1_En_6_Fig17_HTML.jpg](images/491271_1_En_6_Chapter/491271_1_En_6_Fig17_HTML.jpg)\n\
    \nFigure 6-17\n\nCell drop-down menu"
