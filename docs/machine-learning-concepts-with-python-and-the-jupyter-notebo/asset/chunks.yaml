  raw: '## Summary


    We have seen six ways in which deep learning differs from machine learning. It
    is now easy to understand why many people consider both areas to be extremely
    important in the field of artificial intelligence. Depending on the kind of input
    and technology available, people can choose the type of machine learning method
    they want to employ.


    We can now move on to the process involved in setting up the system to help it
    learn. This is where the programming part comes in. Machine learning requires
    programmers to use data science techniques, followed by some specific machine
    learning algorithms, to enable the machine to think on its own. All this can be
    done within one single program.


    We can use several programming languages to carry out our machine learning tasks,
    like Python, Java, C++, Julia, and R. However, since Python has emerged as one
    of the most popular machine learning programming languages so far, we shall be
    having a look at it over the next few chapters in the context of machine learning
    and deep learning.


    # 5. Machine Learning With Python


    In previous chapters, we saw what artificial intelligence is and how machine learning
    and deep learning techniques are used to train machines to become smart. In these
    next few chapters, we will learn how machines are trained to take data, process
    it, analyze it, and develop inferences from it.


    Machines need to be programmed to carry out particular actions. There are about
    700 major and minor programming languages in the world to date. These languages
    have developed over the years according to the needs of the time. Many of the
    languages are just new and improved versions of older languages. As computers
    and computer-related businesses grew, the need for programming languages increased
    as well.


    As artificial intelligence evolved, the usefulness of a programming language for
    machine training became an added criteria for its popularity. As of 2019, the
    top three languages were Java, Python, and C/C++. Excluding C, the other languages
    are object oriented.


    Note


    Object-oriented programming (OOP) is a type of programming in which data is stored
    in objects as fields or attributes, and code is stored as methods or procedures.


    OOP is a common method of programming because it is scalable, reusable, and efficient.


    In this book, we will be learning how to program machines with the help of Python,
    which is, at present, one of the most widely used languages when it comes to machine
    learning. We will start by getting acquainted with this programming language.


    ## Introduction to Python


    Python was first developed and released in the year 1990 by Guido van Rossum,
    a Dutch mathematician, at the Centrum Wiskunde & Informatica in the Netherlands.
    One very interesting fact to note is that the name Python was, surprisingly, not
    taken from the notorious reptile, but rather from the equally notorious comedy
    group Monty Python that Guido was fond of.


    According to the official Python website, “Python is an interpreted, object-oriented,
    high-level programming language with dynamic semantics.”


    In simpler terms,


    *   it is an interpreted language, which means it allows instructions to be executed
    freely and directly, without any prior compilation required;


    *   it uses objects that contain data and code;


    *   it follows a language style that is easy for human beings to interpret; and


    *   it allows information to be updated according to time.


    Python’s popularity first peaked around 2003, and ever since then it has retained
    its position as a highly acclaimed programming language. Its popularity can mainly
    be attributed to its features, which are listed in the next section.


    ### Key Python Features


    Python was mainly developed to improve code readability and to reduce the amount
    of coding required to program a machine. Apart from this, it has a variety of
    unique features and provisions that make our overall programming experience smooth
    and easy.


    These features include the following:


    *   **Open source license:** This means it is free to download, modify, and redistribute
    under an OSI-approved license.


    *   **Readability:** It has a very easy-to-read syntax.


    *   **Cross-platform working:** It can run on any operating system, including
    Linux, Windows, Mac OS, etc.


    *   **Extensive standard library:** It consists of many useful libraries that
    can be used for a variety of applications.


    *   **Easily integrated:** It can easily be integrated with other languages like
    C, C++, Java, etc.


    *   **Supports object-oriented and procedure-oriented programming:** It primarily
    follows OOP, but it also makes room for POP, which is one of the most unique features
    of Python.


    *   **Allows GUI programming:** It has several libraries that allow users to develop
    graphic user interfaces quickly and easily.


    *   **Large community** **:** It has a huge community of coders, making it easier
    to make improvements, get help, solve issues, and develop new ideas.


    Fun Fact


    The community of Python users who support the language, and, more specifically,
    those who are experts in coding with help of Python, are known as Pythonistas.


    ### Python’s Competitors


    As mentioned earlier, there are multitudes of other programming languages that
    are used in various fields and for various purposes. In the area of machine learning
    for artificial intelligence, some common programming languages that people use,
    other than Python, include the following:


    *   **R:** It is mainly used for visual representations, as graphs can be created
    very easily with just a few lines of code. It thus allows for exploratory data
    analysis.


    *   **Java:** It is one of the oldest languages in the world of computer programming.
    It is great in terms of speed, reliability, and security.


    *   **Scala:** Its runtime is extremely fast, and it can be used to develop complex
    pieces of code. It is moderately easy for a beginner to pick up.


    *   **Julia:** It is high level, scalable, dynamic, and quick. It also provides
    some powerful native tools that can be implemented for machine learning.


    *   **C++:** It has a high speed, a sufficient set of libraries and tools, and
    is most efficient when it comes to using statistical techniques.


    ### Python as a Preferred Language for Machine Learning


    Machine learning can become quite a complex process, especially when the data
    is massive, the model is extensive, and the objective is challenging. That said,
    it requires a language that simplifies its process and makes it less tedious for
    the developer.


    When compared to other programming languages, Python stands out for the following
    reasons:


    *   It works seamlessly across different platforms. Thus, developers need not
    worry about using only one platform. They can easily distribute and use the Python
    code. A lot of other languages don’t offer this feature, or are limited in their
    cross-platform abilities, and hence need to be used only on a single platform.


    *   It consists of a vast list of machine learning–specific libraries, utilities,
    and frameworks, which can be used by developers to make their programming faster
    and easier. Other languages don’t have such an extensive selection.


    *   Its code is simple, readable, and concise. It is, therefore, easier for a
    developer to focus their attention on the machine learning problem at hand, rather
    than having to worry too much about writing the correct code and following the
    correct syntax, which most of the other languages require.


    *   It has a large community of developers who frequently use the language. This
    makes it less of a task for us to ask questions about any issues that arise while
    programming. It also allows Python developers to come together to discuss tips
    and ideas with one another. Other programming languages either have a smaller
    community or no community at all.'
  trans: '

    ## 总结


    我们已经了解了深度学习与机器学习的六点不同之处。现在很容易理解为什么许多人认为这两个领域在人工智能领域都极其重要。根据可用的输入类型和技术条件，人们可以选择想要采用的机器学习方法类型。


    接下来，我们可以继续探讨设置系统以帮助其学习的过程。这就是编程部分发挥作用的地方。机器学习要求程序员使用数据科学技术，随后应用一些特定的机器学习算法，使机器能够自主思考。所有这些都可以在单个程序中完成。


    我们可以使用多种编程语言来执行机器学习任务，例如 Python、Java、C++、Julia 和 R。然而，由于 Python 迄今为止已成为最流行的机器学习编程语言之一，我们将在接下来的几章中，结合机器学习和深度学习的背景来学习它。


    # 5. 使用 Python 进行机器学习


    在前面的章节中，我们了解了什么是人工智能，以及如何使用机器学习和深度学习技术来训练机器变得智能。在接下来的几章中，我们将学习如何训练机器来获取数据、处理数据、分析数据并从中得出推论。


    机器需要被编程才能执行特定操作。迄今为止，世界上大约有 700 种主要和次要的编程语言。这些语言随着时代的需求而不断发展。许多语言只是旧语言的新版本或改进版本。随着计算机及计算机相关业务的发展，对编程语言的需求也随之增加。


    随着人工智能的发展，编程语言在机器训练中的实用性成为其受欢迎程度的附加标准。截至 2019 年，排名前三的语言是 Java、Python 和 C/C++。除
    C 语言外，其他语言都是面向对象的。


    注意


    面向对象编程（OOP）是一种编程类型，其中数据以字段或属性的形式存储在对象中，而代码则以方法或过程的形式存储。


    OOP 是一种常见的编程方法，因为它具有可扩展性、可重用性和高效性。


    在本书中，我们将学习如何借助 Python 对机器进行编程。目前，在机器学习领域，Python 是使用最广泛的语言之一。我们将从熟悉这种编程语言开始。


    ## Python 简介


    Python 最初由荷兰数学家吉多·范罗苏姆于 1990 年在荷兰国家数学与计算机科学研究中心开发并发布。一个非常有趣的事实是，Python 这个名字出人意料地并非取自那种臭名昭著的爬行动物，而是取自吉多非常喜欢的同样臭名昭著的喜剧团体——蒙提·派森。


    根据 Python 官方网站的说法：“Python 是一种解释型、面向对象、高级编程语言，具有动态语义。”


    简单来说，


    *   它是一种解释型语言，这意味着指令可以自由、直接地执行，无需任何预先编译；

    *   它使用包含数据和代码的对象；

    *   它遵循一种易于人类理解的语言风格；

    *   它允许信息随时间更新。


    Python 的流行度首次达到顶峰是在 2003 年左右，从那时起，它一直保持着高度赞誉的编程语言地位。其流行度主要归功于它的特性，这些特性将在下一节中列出。


    ### Python 的主要特性


    Python 的开发主要是为了提高代码可读性，并减少编程机器所需的代码量。除此之外，它还具有各种独特的特性和功能，使我们的整体编程体验顺畅而简单。


    这些特性包括：


    *   **开源许可：** 这意味着它可以在 OSI 批准的许可下免费下载、修改和重新分发。

    *   **可读性：** 它具有非常易于阅读的语法。

    *   **跨平台运行：** 它可以在任何操作系统上运行，包括 Linux、Windows、Mac OS 等。

    *   **丰富的标准库：** 它包含许多可用于各种应用程序的有用库。

    *   **易于集成：** 它可以轻松地与 C、C++、Java 等其他语言集成。

    *   **支持面向对象和面向过程编程：** 它主要遵循 OOP，但也为 POP 留出了空间，这是 Python 最独特的特性之一。

    *   **支持 GUI 编程：** 它拥有多个库，允许用户快速轻松地开发图形用户界面。

    *   **庞大的社区：** 它拥有一个庞大的编码者社区，使得改进、获取帮助、解决问题和开发新想法变得更加容易。


    趣味知识


    支持 Python 语言的用户社区，更具体地说，那些借助 Python 进行编码的专家，被称为 Pythonistas。


    ### Python 的竞争对手


    如前所述，还有许多其他编程语言用于不同领域和不同目的。在人工智能的机器学习领域，除 Python 外，人们常用的一些编程语言包括：


    *   **R：** 它主要用于可视化表示，因为只需几行代码就能非常轻松地创建图表。因此，它允许进行探索性数据分析。

    *   **Java：** 它是计算机编程界最古老的语言之一。它在速度、可靠性和安全性方面表现出色。

    *   **Scala：** 它的运行时速度极快，可用于开发复杂的代码片段。对于初学者来说，掌握它难度适中。

    *   **Julia：** 它是高级、可扩展、动态且快速的。它还提供了一些可用于机器学习的强大原生工具。

    *   **C++：** 它具有高速、充足的库和工具集，并且在应用统计技术时效率最高。


    ### Python 作为机器学习的首选语言


    机器学习可能成为一个相当复杂的过程，尤其是在数据量庞大、模型复杂且目标具有挑战性时。也就是说，它需要一种能够简化其过程并减少开发人员繁琐工作的语言。


    与其他编程语言相比，Python 因以下原因而脱颖而出：


    *   它可以在不同平台上无缝运行。因此，开发人员无需担心只能使用单一平台。他们可以轻松地分发和使用 Python 代码。许多其他语言不提供此功能，或者其跨平台能力有限，因此只能在单一平台上使用。

    *   它包含大量机器学习专用的库、工具和框架，开发人员可以使用它们来使编程更快、更容易。其他语言没有如此广泛的选择。

    *   它的代码简单、可读且简洁。因此，开发人员更容易将注意力集中在手头的机器学习问题上，而不必像大多数其他语言那样过多担心编写正确的代码和遵循正确的语法。

    *   它拥有一个庞大的、经常使用该语言的开发者社区。这使得我们在编程过程中遇到任何问题时更容易提问。它还允许 Python 开发者聚在一起讨论技巧和想法。其他编程语言的社区要么较小，要么根本没有社区。

    '
- fmt: '### Python’s Machine Learning Libraries


    First, we will understand what a library is.


    *A library in the programming world is a collection of methods and functions that
    allow a user to perform various tasks without having to write the necessary code
    for it.*


    We use libraries to save time while we program. Python has a huge array of open
    source machine learning libraries, including, but not limited to, the following:


    - **Pandas:** The `Pandas` library provides users with the ability to handle large
    datasets. It provides tools for reading and writing data, cleaning and altering
    data, and so on.

    - **Numpy:** The `Numpy`, or Numerical Python, library provides users with a powerful
    array of computing abilities. It tackles the problem of slow mathematical computations
    and allows users to perform huge calculations with the help of multi-dimensional
    arrays.

    - **Scipy:** The `Scipy` library is used for scientific and technical computations.
    It works on `Numpy`’s multi-dimensional arrays.

    - **Scikit-Learn:** The `Scikit-Learn` library consists of various features and
    methods that have specially been made to assist users in their machine learning
    requirements. It makes use of the `Numpy` library, specifically when it comes
    to array operations.

    - **TensorFlow:** The `TensorFlow` library is an increasingly popular library
    that provides users with a large set of flexible and accessible tools for machine
    learning. You will be learning more about `TensorFlow` later on in this book.


    With the help of these libraries, we can develop our machine learning program
    quickly and easily.


    ### Other Applications of Python


    Due to the diverse functionality of Python as a programming language, its utility
    is not limited to artificial intelligence alone. It is used for a variety of other
    applications as well. Some of these applications include the following:


    - Web development

    - Data analysis

    - Educational purposes

    - Software testing

    - Computer graphics

    - Game development

    - Scientific and numeric computing

    - Desktop GUIs


    ## Installing Python


    As mentioned before, Python is free to download. There are several ways to download
    and install Python onto your system, based on your OS and your preference.


    One method of installing Python is from the official Python website, which provides
    an installer that users can download and run on their computers.


    Another method of installing Python is with the help of package installers like
    `Homebrew` that make installation more convenient.


    In this book, we will learn a very easy way to do it—with the help of an application
    known as `Anaconda`.


    *`Anaconda` is an open source distribution of the Python and R programming languages.
    It is free for us to download and use on our system.*


    It was created to make our machine learning process easier, mainly by making package
    installation simpler. It has an easy-to-use interface and comes with Python pre-installed
    on it. It also makes our task of installing the `Jupyter Notebook` application
    much easier, as we will see in the next chapter.


    Let us now learn how `Anaconda` can be installed onto our systems.


    ### Installing Python with Anaconda


    Before we begin, we must have a look at the system requirements given in the `Anaconda`
    documentation, just to make sure that our system will be able to support `Anaconda`
    without any trouble. To download `Anaconda`, we need to follow these steps:


    ![../images/491271_1_En_5_Chapter/491271_1_En_5_Fig1_HTML.jpg](images/491271_1_En_5_Chapter/491271_1_En_5_Fig1_HTML.jpg)


    Figure 5-1


    Choosing the right version to download and install


    1. Go to the `Anaconda` website ([`https://www.anaconda.com/distribution/`](https://www.anaconda.com/distribution/))
    and find the download option for your OS, as shown in Figure [5-1](#491271_1_En_5_Chapter.xhtml#Fig1).


    ![../images/491271_1_En_5_Chapter/491271_1_En_5_Fig2_HTML.jpg](images/491271_1_En_5_Chapter/491271_1_En_5_Fig2_HTML.jpg)


    Figure 5-2


    Creating a new Python environment


    2. Since `Anaconda` comes pre-installed with Python, it gives you the option to
    select the version of Python that you want to install when you download the `Anaconda`
    application. Select the latest Python version available and click on the Download
    button. Here, I have selected Python 3.7 for my Mac OS.


    3. Once `Anaconda` is downloaded, locate the file on the computer and double-click
    on it to begin the installation.


    4. Once the installation is completed, you will be able to see the `Anaconda Navigator`
    icon in your list of applications. Click on it.


    5. You will see a screen showing you a couple of useful programming-related applications.
    You will also see that, by default, a base (root) environment has been created
    that contains Python and its libraries.


    6. It is always good to create a new working environment, other than the base.
    To do so, click on the Create button. In the dialog box that appears, you can
    give your new environment a name, select your Python version, and then click the
    Create button, as shown in Figure [5-2](#491271_1_En_5_Chapter.xhtml#Fig2).


    ![../images/491271_1_En_5_Chapter/491271_1_En_5_Fig4_HTML.jpg](images/491271_1_En_5_Chapter/491271_1_En_5_Fig4_HTML.jpg)


    Figure 5-4


    List of uninstalled packages


    ![../images/491271_1_En_5_Chapter/491271_1_En_5_Fig3_HTML.jpg](images/491271_1_En_5_Chapter/491271_1_En_5_Fig3_HTML.jpg)


    Figure 5-3


    List of installed packages


    7. Once your environment is created, you need to select it as your working environment.
    Once you do that, you will be able to see a list of installed and uninstalled
    packages by clicking on “Environments,” then choosing the “Installed” or “Not
    installed” option accordingly from the drop-down menu at the top, as shown in
    Figure [5-3](#491271_1_En_5_Chapter.xhtml#Fig3) and Figure [5-4](#491271_1_En_5_Chapter.xhtml#Fig4).
    You can even search for a specific package by entering its name.


    ![../images/491271_1_En_5_Chapter/491271_1_En_5_Fig5_HTML.jpg](images/491271_1_En_5_Chapter/491271_1_En_5_Fig5_HTML.jpg)


    Figure 5-5


    List of selected packages to be installed


    8. You can now begin installing some of the necessary libraries that you will
    need for machine learning, including `Pandas`, `NumPy`, `SciPy`, `Scikit-learn`,
    `TensorFlow`, `Matplotlib`, and `Seaborn`. Search for these libraries, select
    them by clicking on the check box to their left, then click the Apply button,
    as shown in Figure [5-5](#491271_1_En_5_Chapter.xhtml#Fig5).


    There you have it! Your Python environment is now downloaded, installed, and ready
    for use!'
