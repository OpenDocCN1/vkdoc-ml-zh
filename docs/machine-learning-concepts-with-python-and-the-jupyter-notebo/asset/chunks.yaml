  trans: '

    在某些情况下，你可能还需要安装“pillow”库（Python 图像库，缩写为“PIL”），因为它为处理各种格式的图像提供了支持。使用 `pip` 可以轻松安装它：`pip
    install pillow`


    这些机器学习模型的一大优点是，对于所有类型的数据，其结构几乎保持不变。我们需要知道的是如何在将数据输入模型之前准备和处理数据。当我们自己尝试这些程序，使用不同的数据集并修改输入层和数值时，整个过程会变得容易得多。只要别忘了持续练习，这将帮助你提高技能并精通你所做的事情。


    总结

    在本章中，我们学习了如何使用 TensorFlow 和 Keras API，在 Jupyter Notebook 的帮助下构建、训练和验证我们的深度学习模型。我们理解了工作机器学习模型的一般结构，并且也更熟悉了
    Keras。然后，我们区分了分类问题的类型——二分类和多分类——并快速介绍了图像分类。最后，我们编写了七个不同的程序来巩固我们目前所学的内容，其中涉及一个预训练模型、一个二分类程序、一个单层程序，其余程序则执行多层多分类任务。

    对于刚接触 TensorFlow 2.0 世界的人来说，这些程序是一个很好的起点。如果你不能立即理解它们，请不要担心。随着你不断自己动手实践，它们会变得更有意义。你可以将这些模型作为起点，为不同的数据集开发你自己的神经网络。而且，一旦你对编程越来越熟练，你就可以开始对它们进行自己的修改，以创建更专业的模型。


