    请记住，有时当你执行包含模型的“代码”单元格时，可能不会出现任何错误。然而，当你尝试运行代码来训练模型时，可能会出现错误，这意味着你需要返回并检查你的模型和参数，然后才能训练它。


    好了，就是这样！我们刚刚借助 TensorFlow 2.0 创建了我们的第一个神经网络。

    就此打住并感到兴奋是很诱人的。但单层神经网络只是深度学习的第一步。在实际应用中，大多数神经网络需要不止一层才能获得真正出色的结果。让我们在下一个程序中看看如何构建这样的模型。


    程序 3：使用 TensorFlow 中的 Keras 进行服装分类（多层、多类）

    在现代社会，服装已成为大多数人的首要关注点之一。考虑到个人愿意在穿着上投入多少，时尚在商业中是一个非常重要的行业。现在想象一下，如果我们把人工智能与这个已经蓬勃发展的行业结合起来，整个行业将会发生翻天覆地的变化。

    这绝对是一个值得进入的有趣领域，因为它为新创新提供了巨大的空间。现在，我们将通过构建一个神经网络来对服装图像进行分类，从而初步体验一下。

    在这个程序中，我们将执行与之前几乎相同的操作，但使用不同的数据集并增加几个额外的层。我们还将添加几行代码，只是为了探索 TensorFlow 下的一些新函数。总体结构、API
    和优化器都保持不变或至少相似，因此我们将跳过这一部分，直接进入程序的其余部分。


    数据集

    我们将用于此程序的数据集是 Fashion MNIST 数据集。

    该数据集是 Zalando 研究图像的一部分，可用于替代原始 MNIST 数据集来训练图像分类模型。

    它包含 60,000 张训练图像和 10,000 张测试图像。每张都是 28x28 像素的服装物品灰度图像。数据集中总共有十个类别。


    激活函数


    在这个程序中，我们将使用两个激活函数：


    1.  ReLU


    2.  Softmax


    程序


    **步骤 1：在新的 Jupyter notebook 中，导入 TensorFlow 库和 Keras 工具。**


    ```

    import tensorflow as tf

    from tensorflow.keras import datasets, layers, models

    ```


    通过添加这个额外的 `import` 步骤，我们现在不再需要在调用每个函数之前都输入“tf.keras”。我们可以直接调用它，正如你将在下一步中看到的那样。

    **步骤 2：加载 Fashion MNIST 数据集。**


    我们可以像这样将 Fashion MNIST 数据集加载到我们的 Jupyter notebook 中：


    ```

    data = datasets.fashion_mnist

    (ip_train, op_train), (ip_test, op_test) = data.load_data()

    ```


    **步骤 3：检查图像的形状。**


    这将显示训练和测试输入数据的形状。


    ```

    print(ip_train.shape, ip_test.shape)

    ```


    正如我们所见，它有三个维度：集合中的图像数量、宽度和高度。

    **步骤 4：重塑输入值。**

    通常，我们使用的数据集包含彩色图像。这意味着所有三个 RGB（红绿蓝）通道都可用。在 TensorFlow 中，全彩色图像的深度为 3。然而，Fashion
    MNIST 数据集由灰度图像组成，这意味着它只是黑白的。因此，它的深度为 1。

    在此步骤中，我们将图像从维度 (n, width, height) 重塑为新的维度 (n, width, height, depth)，其中 *n* 是集合中的图像数量。


    代码如下所示：


    ```

    ip_train = ip_train.reshape((60000, 28, 28, 1))

    ip_test = ip_test.reshape((10000, 28, 28, 1))

    print(ip_train.shape, ip_train.shape)

    ```


    现在当我们显示重塑后的数据时，它将显示四个维度。

    **步骤 5：准备数据。**


    再次，我们需要对数据进行归一化，如下所示：


    ```

    ip_train, ip_test = ip_train / 255.0, ip_test / 255.0

    ```


    **步骤 6：构建神经网络。**


    这次，我们将向神经网络添加两个额外的密集层，分别包含 128 和 1000 个神经元，并且每个都使用激活函数 ReLu。我们还将添加一个额外的“dropout
    层”，放在最后一层之前，这有助于防止过拟合。


    ```

    model = models.Sequential([

    layers.Flatten(input_shape=(28, 28, 1)),

    layers.Dense(128, activation="relu"),

    layers.Dense(1000, activation="relu"),

    layers.Dropout(0.5),

    layers.Dense(10, activation="softmax")

    ])

    ```


    **步骤 7：编译模型。**


    在拟合模型之前，我们编译模型，如下所示：


    ```

    model.compile(optimizer = ''adam'',

    loss = ''sparse_categorical_crossentropy'',

    metrics = [''accuracy''])

    ```


    **步骤 8：查看模型。**


    ```

    model.summary()

    ```


    我们将得到模型的摘要，如图 11-10 所示。


    ![../images/491271_1_En_11_Chapter/491271_1_En_11_Fig10_HTML.jpg](img/491271_1_En_11_Fig10_HTML.jpg)


    图 11-10

    模型摘要


    **步骤 9：训练模型。**


    ```

    model.fit(ip_train, op_train, epochs = 5)

    ```


    模型将开始训练，共五个周期，如图 11-11 所示。


    ![../images/491271_1_En_11_Chapter/491271_1_En_11_Fig11_HTML.jpg](img/491271_1_En_11_Fig11_HTML.jpg)


    图 11-11

    通过五个周期训练模型


    **步骤 10：测试模型。**

    在此步骤中，我们将使用一个叫做 `verbose` 的东西。

    *`verbose` 命令用于提供有关特定任务的信息。*

    我们可以通过将 `verbose` 设置为 1 或 2 来改变我们获得的信息量。

    设置为 0 时，我们什么也得不到。

    设置为 1 时，我们会得到一个进度条和周期数，以及损失和准确率。


    设置为 2 时，我们只得到周期数以及损失和准确率，没有进度条。


    ```

    model.evaluate(ip_test, op_test, verbose = 2)

    ```


    我们将获得如图 11-12 所示的输出。


    ![../images/491271_1_En_11_Chapter/491271_1_En_11_Fig12_HTML.jpg](img/491271_1_En_11_Fig12_HTML.jpg)


    图 11-12

    评估模型

