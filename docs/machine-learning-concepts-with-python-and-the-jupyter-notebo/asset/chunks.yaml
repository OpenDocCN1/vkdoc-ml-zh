    \ There is also\na clear distinction when writing different characters. For example,\
    \ some\nmight just put a dot over their *i*’s, while others prefer to\ndraw a\
    \ small circle. We then have differences in slant, size, thickness,\nand so on.\n\
    It is this uniqueness that makes handwriting recognition quite a\nchallenge, especially\
    \ for artificially intelligent\nmachines. However, it is not impossible to train\
    \ a model to\nfigure out similarities, and thus differentiate between characters.\n\
    \nThe Working\nImages are basically grids made up of numbers. These numbers tell\
    \ us\nthe pixel value or intensity. Thus, these\nnumbers can be manipulated to\
    \ obtain the characteristics of the image.\nThis enables us to find similar features\
    \ in different images.\n\nThe Structure\n\nThe architecture\nof this model is\
    \ as follows:\n\n1.  It loads the given dataset of images.\n\n2.  It divides the\
    \ data into the training set and the test set.\n\n3.  It creates the neural network\
    \ with as many layers as we specify,\n    along with the activation function provided\
    \ by us.\n\n4.  It begins training with the training data to recognize the\n \
    \   similarities and differences between each image and segregate them\n    accordingly.\n\
    \n5.  It then tests its accuracy with the test data to see how well it has\n \
    \   learned the difference between each image.\n\n6.  It carries out inference\
    \ to make sure that its prediction is\n    correct.\n\nThe Dataset\nThe dataset\n\
    that we will be using in this program is the MNIST dataset. The full\nname of\
    \ MNIST is Modified National Institute of Standard Technology. It\nis a set of\
    \ handwritten digits (from 0 to 9). It is used to train models\nfor handwriting\
    \ recognition.\nIt is, as can be understood by the name, a modified version of\
    \ the\nprevious NIST datasets. The great part about it is that it is\npre-divided\
    \ into training data and test data. The training dataset\nconsists of 60,000 images,\
    \ while the test dataset consists of 10,000\nimages. They are all of size 28x28\
    \ pixels.\nIt has become a standard database that is used to practice image\n\
    classification. It is tightly integrated with Keras and TensorFlow,\nmaking it\
    \ readily available and easy to call into the model. It is great\nfor teaching\
    \ machine learning to beginners as the data is already\nmanipulated and divided,\
    \ making the rest of the program easy to do.\n\nThe API\nWe will be using the\
    \ Keras API within\nTensorFlow, as it makes our work easier by providing us with\
    \ the\nnecessary utilities for creating our neural network.\n\nThe Activation\
    \ Functions\nWe will be using the Softmax activation\nfunction only, since we\
    \ have just a single layer.\n\nThe Optimizer\nWe will be using the Adam optimizer\
    \ in this\nneural network.\n\nThe Program\n**Step 1: Open a new Python 3 Jupyter\
    \ notebook.**\nWe will start by opening a brand new Python 3 Jupyter\nnotebook.\
    \ We need to make sure that it is in the correct\nenvironment. We can also give\
    \ it a name if we want to. Something like\n“My First Neural Network” or “Programming\
    \ with TensorFlow 2.0” would\nsuffice.\n**Step 2: Import TensorFlow into your\
    \ kernel.**\n\nIn the first “Code” cell that appears, we type in the following:\n\
    \n```\nimport tensorflow as tf\n```\n\nThis will call the TensorFlow library into\
    \ our kernel, allowing us to\nuse it.\n**Step 3: Load the MNIST dataset.**\n\n\
    We now need to call the dataset into our\nJupyter notebook. We do this by typing\
    \ the following:\n\n```\ndata = tf.keras.datasets.mnist\n(ip_train, op_train),\
    \ (ip_test, op_test) = data.load_data()\n```\n\nThis tells the program to call\
    \ the dataset from within the library,\nand to load it into the kernel. As you\
    \ can see, we have begun making use\nof the Keras API as well. `ip_train` and\
    \ `ip_test` are nothing\nbut the training and test data for the inputs. Similarly,\
    \ `op_train` and `op_test` are the\ntraining and test data for the outputs.\n\
    **Step 4: Prepare the data.**\n\nNow, as mentioned earlier, we need not manipulate\
    \ our data too much,\nsince that has already been done for us. However, we do\
    \ need to\nnormalize our data. This makes sure that the pixel values of the images\n\
    range between 0 and 1\\. We do this by dividing each element of the\ndataset by\
    \ 255, as shown here:\n\n```\nip_train, ip_test = ip_train / 255.0, ip_test /\
    \ 255.0\n```\n\n**Step 5: Build the neural network.**\n\nWe will now begin creating\
    \ the architecture of our neural network. We\nstart by flattening the input images\
    \ (making them one-dimensional),\nafter which we add one dense layer. This layer\
    \ uses the Softmax\nactivation function. See the following:\n\n```\nmodel = tf.keras.models.Sequential([\n\
    tf.keras.layers.Flatten(input_shape = (28,28)),\ntf.keras.layers.Dense(10, activation\
    \ = 'softmax')\n])\n```\n\nThe number of neurons in the last dense layer depends\
    \ on the number\nof outputs (labels) that we are expecting. In this case, we expect\
    \ ten\noutputs (the number of digits ranging from 0 to 9), and hence, the\nnumber\
    \ of neurons is ten.\n**Step 6: Compile the model.**\nWe compile our model by\
    \ selecting the loss function, optimizer, and\nthe metrics.\n**Loss function:**\n\
    This measures the accuracy of the model during training. We need to\nminimize\
    \ this function to ensure that the model is on the right\npath.\n\nThere are three\
    \ main loss functions that we will be using:\n\n1.  `binary_crossentropy`:\n \
    \   This is the default loss function that is used for binary\n    classification.\n\
    \n2.  `categorical_crossentropy`:\n    This is the default loss function that\
    \ is used for multi-class\n    classification."
  trans: "\n我们可以看到，VGG16 模型不仅预测出图像是猫，还预测了其品种，即埃及猫。同时，它给出了答案正确的概率为 87%。\n\n不错吧？\n让我们再试一次，这次使用\
    \ ResNet50 模型。\n\n只需将步骤 3 中的代码改为：\n\n```\nmodel = ResNet50()\n```\n\n现在重复剩余步骤，保持相同的图像文件，运行预测。看看结果如何？\n\
    \n*   Egyptian_cat (71.94%)\n\nResNet50 模型也给出了相同的预测，但其答案的确信度仅为 71.94%。\n\n那么，我们能否说这些模型是完美的，因为它们能够正确识别小猫的图像？嗯，这里还有另一个例子，我将图像换成了另一只小猫，如图\
    \ 11-5 所示。\n\n![../images/491271_1_En_11_Chapter/491271_1_En_11_Fig5_HTML.jpg](img/491271_1_En_11_Fig5_HTML.jpg)\n\
    \n图 11-5\n加载另一张图像文件\n\n以下是模型的预测结果：\n\nVGG16:\n\n*   Chihuahua (21.55%)\n\nResNet50:\n\
    \n*   Pembroke (17.49%)\n\n正如我们所见，一个模型将我的小猫识别为吉娃娃，而另一个模型则将其识别为彭布罗克（经过一番搜索，我发现这指的是彭布罗克威尔士柯基犬）。简而言之，两个模型都认为我的小猫是狗。\n\
    \n因此，当我们学习创建、训练和验证深度学习模型时，我们还需要对它们进行推理，以确保它们确实被正确训练。由于它们只是机器，不可能得到一个完全无误的模型。然而，我们的目标是获得最高的准确率，同时错误数量最少。一旦这样的模型被开发并批准，它们就可以被应用到实际应用中。\n\
    \n现在是时候学习如何构建我们自己的深度学习神经网络了。在接下来的几个程序中，我们将学习各种类型的图像分类器，并了解如何以不同方式设置它们来对多个图像进行分类。\n\
    \n**程序 2：使用 TensorFlow 中的 Keras 进行手写识别（单层，多分类）**\n\n手写体是特定个体独有的。你可能已经注意到，有些人的字迹极其整洁美观，而另一些人的字迹则几乎难以辨认。书写不同字符时也存在明显差异。例如，有些人可能只在字母*i*上点一个点，而另一些人则喜欢画一个小圆圈。此外，在倾斜度、大小、粗细等方面也存在差异。\n\
    \n正是这种独特性使得手写识别颇具挑战性，尤其是对于人工智能机器而言。然而，训练一个模型来找出相似性，从而区分不同字符，并非不可能。\n\n**工作原理**\n\
    \n图像本质上是数字组成的网格。这些数字告诉我们像素值或强度。因此，可以通过操作这些数字来获取图像的特征。这使我们能够在不同图像中找到相似的特征。\n\n\
    **结构**\n\n该模型的架构如下：\n\n1.  加载给定的图像数据集。\n2.  将数据分为训练集和测试集。\n3.  按照我们指定的层数创建神经网络，并使用我们提供的激活函数。\n\
    4.  开始使用训练数据进行训练，以识别每张图像之间的相似性和差异性，并据此进行分类。\n5.  然后使用测试数据测试其准确率，以评估它学习每张图像之间差异的效果。\n\
    6.  进行推理以确保其预测正确。\n\n**数据集**\n\n我们在这个程序中使用的数据集是 MNIST 数据集。MNIST 的全称是 Modified\
    \ National Institute of Standard Technology（改进版国家标准与技术研究所数据集）。它是一组手写数字（从 0 到 9），用于训练手写识别模型。\n\
    \n顾名思义，它是之前 NIST 数据集的改进版本。它的优点在于已经预先划分为训练数据和测试数据。训练数据集包含 60,000 张图像，而测试数据集包含 10,000\
    \ 张图像。它们的大小都是 28x28 像素。\n\n它已成为用于练习图像分类的标准数据库。它与 Keras 和 TensorFlow 紧密集成，使其易于获取并方便地调用到模型中。由于数据已经过处理和划分，使得程序的其余部分易于操作，因此它非常适合向初学者教授机器学习。\n\
    \n**API**\n\n我们将使用 TensorFlow 中的 Keras API，因为它为我们提供了创建神经网络所需的实用工具，使我们的工作更加轻松。\n\
    \n**激活函数**\n\n由于我们只有一个单层，因此我们将仅使用 Softmax 激活函数。\n\n**优化器**\n\n我们将在此神经网络中使用 Adam\
    \ 优化器。\n\n**程序**\n\n**步骤 1：打开一个新的 Python 3 Jupyter notebook。**\n\n我们将从打开一个全新的\
    \ Python 3 Jupyter notebook 开始。我们需要确保它处于正确的环境中。如果需要，我们也可以给它命名。像“我的第一个神经网络”或“使用\
    \ TensorFlow 2.0 编程”这样的名称就足够了。\n\n**步骤 2：将 TensorFlow 导入到你的内核中。**\n\n在出现的第一个“代码”单元格中，我们输入以下内容：\n\
    \n```\nimport tensorflow as tf\n```\n\n这会将 TensorFlow 库调用到我们的内核中，使我们能够使用它。\n\n\
    **步骤 3：加载 MNIST 数据集。**\n\n我们现在需要将数据集调用到我们的 Jupyter notebook 中。我们通过输入以下内容来实现：\n\
    \n```\ndata = tf.keras.datasets.mnist\n(ip_train, op_train), (ip_test, op_test)\
    \ = data.load_data()\n```\n\n这告诉程序从库中调用数据集，并将其加载到内核中。如你所见，我们也开始使用 Keras API。`ip_train`和`ip_test`分别是输入的训练数据和测试数据。类似地，`op_train`和`op_test`是输出的训练数据和测试数据。\n\
    \n**步骤 4：准备数据。**\n\n现在，如前所述，我们不需要对数据进行太多处理，因为这部分工作已经为我们完成了。然而，我们确实需要对数据进行归一化。这确保了图像的像素值范围在\
    \ 0 到 1 之间。我们通过将数据集的每个元素除以 255 来实现，如下所示：\n\n```\nip_train, ip_test = ip_train\
    \ / 255.0, ip_test / 255.0\n```\n\n**步骤 5：构建神经网络。**\n\n我们现在将开始创建神经网络的架构。我们首先将输入图像展平（使其成为一维），然后添加一个全连接层。该层使用\
    \ Softmax 激活函数。请参见以下内容：\n\n```\nmodel = tf.keras.models.Sequential([\ntf.keras.layers.Flatten(input_shape\
    \ = (28,28)),\ntf.keras.layers.Dense(10, activation = 'softmax')\n])\n```\n\n\
    最后一个全连接层中的神经元数量取决于我们期望的输出（标签）数量。在这种情况下，我们期望有十个输出（从 0 到 9 的数字），因此神经元数量为十。\n\n**步骤\
    \ 6：编译模型。**\n\n我们通过选择损失函数、优化器和评估指标来编译模型。\n\n**损失函数：**\n它衡量模型在训练期间的准确率。我们需要最小化这个函数，以确保模型沿着正确的路径前进。\n\
    \n我们将使用三种主要的损失函数：\n\n1.  `binary_crossentropy`：\n    这是用于二分类的默认损失函数。\n\n2.  `categorical_crossentropy`：\n\
    \    这是用于多分类的默认损失函数。\n"
- fmt: '### 3. `sparse_categorical_crossentropy`

    This is used for multi-class classification, without the need of using one hot
    encoding.


    **Optimizer:**

    Depending on the data and the loss function, the model makes changes to itself
    to produce the most optimal results. The optimizer is used to alter the value
    of the weights in order to minimize the loss function.


    **Metrics:**

    This keeps a check on the steps that the model takes during training and testing.
    The `accuracy` option considers the number of images that are correctly recognized
    and classified.


    To compile the model, we type in the code as follows:


    ```

    model.compile(optimizer = ''adam'',

    loss = ''sparse_categorical_crossentropy'',

    metrics = [''accuracy''])

    ```


    Here, we use the `adam` optimizer, the `sparse_categorical_crossentropy` loss
    function, and `accuracy` metrics.


    **Step 7: View the model.**

    This is more of an optional step. We can use it to view a summary of the model’s
    structure.


    ```

    model.summary()

    ```


    We will get a mini report, like in Figure [11-6](#491271_1_En_11_Chapter.xhtml#Fig6).


    ![../images/491271_1_En_11_Chapter/491271_1_En_11_Fig6_HTML.jpg](images/491271_1_En_11_Chapter/491271_1_En_11_Fig6_HTML.jpg)


    Figure 11-6 A summary of the model


    This report shows us the type of layers, the output and shape, and the number
    of parameters in each layer. We also get a count of the total parameters, along
    with the number of trainable and non-trainable parameters.


    **Step 8: Train the model.**

    We can now “fit” our model with the help of this line of code:


    ```

    model.fit(ip_train, op_train, epochs = 6)

    ```


    Fitting the model is the process of helping the model understand the relationship
    between its inputs, parameters, and predicted outputs so that it can make better
    predictions in the future. This step begins the training. The model takes the
    input data and fits it through its neural network for a total of six epochs, as
    specified.


    *An epoch is one full cycle of passing the entire data through the model.*


    While training, the code displays the loss, as well as the accuracy (out of 1.0),
    as shown in Figure [11-7](#491271_1_En_11_Chapter.xhtml#Fig7).


    ![../images/491271_1_En_11_Chapter/491271_1_En_11_Fig7_HTML.jpg](images/491271_1_En_11_Chapter/491271_1_En_11_Fig7_HTML.jpg)


    Figure 11-7 Training the model through six epochs


    **Step 9: Test the model.**

    To evaluate how good our model is, we need to test it. We use the test data this
    time and run it through the newly obtained parameters, using the following code:


    ```

    model.evaluate(ip_test, op_test)

    ```


    This runs the data through a single epoch and gives an output displaying the loss,
    as well as the accuracy, as shown in Figure [11-8](#491271_1_En_11_Chapter.xhtml#Fig8).


    ![../images/491271_1_En_11_Chapter/491271_1_En_11_Fig8_HTML.jpg](images/491271_1_En_11_Chapter/491271_1_En_11_Fig8_HTML.jpg)


    Figure 11-8 Testing the model


    As we can see, the accuracy here is above 90 percent, which is quite good for
    a single-layer model, even if it’s not 100 percent accurate. Let’s carry out inference
    now to see how well our model can recognize handwritten digits that are fed to
    it.


    **Step 10: Carry out inference.**

    To do this, we will be using two extra libraries: Matplotlib and Numpy. We won’t
    be getting into the details of these libraries, but will just utilize a few of
    their functions.


    Start by importing the Matplotlib library into the Jupyter notebook, like this:


    ```

    import matplotlib.pyplot as plt

    %matplotlib inline

    ```


    Next, call the image to be tested from the MNIST dataset and save it under a variable,
    like this:


    ```

    test_image=ip_test[9999]

    ```


    The number within the square brackets can be any value from 0 to 9,999 (The total
    number of test images is 10,000, remember?).


    Now plot the image of the selected element by entering the code, like this:


    ```

    plt.imshow(test_image.reshape(28,28))

    ```


    This will display the output shown in Figure [11-9](#491271_1_En_11_Chapter.xhtml#Fig9).'
