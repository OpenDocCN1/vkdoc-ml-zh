    Summary

    In this chapter, we learned all about how we can build, train, and

    validate our deep learning models using TensorFlow and the Keras API,

    all with the help of Jupyter Notebook. We understood the general

    structure of a working machine learning model, and we also got better

    acquainted with Keras. We then differentiated between the types of

    classification problems—binary and multi-class—and had a quick

    introduction to image classification. Finally, we wrote seven different

    programs to enhance what we have learned so far, of which one program

    involved a pre-trained model, one program included binary

    classification, one program was single layered, and the rest of the

    programs carried out multi-layer multi-class classification.

    These programs are a great start for anyone who is new to the world

    of TensorFlow 2.0\. Don’t worry if you aren’t able to understand them

    immediately. As you keep playing around with them on your own, they will

    make much more sense to you. You can use these models as a starting

    point to develop your own neural networks for different datasets. And,

    once you get more and more comfortable with programming, you can begin

    adding your own changes to them to create even more professional

    models.


