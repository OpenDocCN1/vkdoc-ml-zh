- fmt: "# 9. Programming with Tensorflow\n\nSo far, we’ve learned how Python can be\
    \ used for lucrative machine learning with the help of its numerous libraries,\
    \ which were created for just that purpose. We also know that Jupyter Notebook\
    \ is a solid development environment that can be used to build and run large programs.\n\
    \nIn this chapter, we will take a look at how to program with the help of the\
    \ TensorFlow library. This chapter deals with the initial TensorFlow release (TensorFlow\
    \ 1.0), just to get us familiar with how the library used to work before the major\
    \ 2.0 evolution.\n\nNow, don’t fret about having to try out these programs on\
    \ your own. If you are a beginner to TensorFlow, you can begin coding with the\
    \ newer version, which you will learn how to do later on. The main aim of this\
    \ chapter is to give you an idea of how the original TensorFlow differs from its\
    \ upgrade in terms of programming ease.\n\nWe will do this with the help of four\
    \ different programs that handle some important programming concepts. They are\
    \ divided as follows:\n\n- **Program 1: Hello World**  \n  This is the universally\
    \ accepted introductory-type program that is used in the programming world. It\
    \ will teach us how to program the machine to print a statement.\n\n- **Program\
    \ 2: Constants, Variables, and Placeholders**  \n  This will help us understand\
    \ the significance of constants, variables, and placeholders. It is further divided\
    \ into two sub-sections:\n  - Part A: Constants and Variables\n  - Part B: Placeholders\n\
    \n- **Program 3: Operations in a Computational Graph**  \n  This will give us\
    \ a better understanding of how the computational graph works in a TensorFlow\
    \ program.\n\n- **Program 4: Taking Inputs from a User for a Placeholder**  \n\
    \  This will show us how to take inputs from a user, store it in a placeholder,\
    \ and then use the entered value to display some required result.\n\nSo, without\
    \ further delay, let’s get right into it!\n\n## Importing the TensorFlow Library\n\
    \nThe first thing we need to do is import the TensorFlow library into Jupyter\
    \ Notebook. The command is as follows:\n\n```\nimport tensorflow as tf\n```\n\n\
    The `tf` is kind of like a nickname given to the library. This is because, as\
    \ we proceed further into the program, we will need to keep referring to the library\
    \ while calling its various utilities, and typing in the full name again and again\
    \ can be quite tedious. We can replace `tf` with any other name as well, like\
    \ `joe` or `jane`, but `tf` is the universally accepted name, so it is advisable\
    \ to use that. This also makes it easier for other people who are going through\
    \ the code to understand which library is being referred to.\n\nOnce we type this\
    \ command into the “Code” cell and execute it, TensorFlow will be imported into\
    \ Jupyter Notebook. We can now begin programming with it.\n\n## Program 1: Hello\
    \ World\n\nWe all know that the most basic program we can ever learn is the “Hello\
    \ World” program. We have done this before with regular Python. Let us now do\
    \ it using TensorFlow in Python.\n\nThe difference between using regular Python\
    \ and using TensorFlow with Python is that the code structure varies, as you will\
    \ see. In regular Python, the program would be as follows:\n\n```\nh = print(\"\
    Hello World\")\nh\n```\n\nHowever, in TensorFlow it gets a little more complicated\
    \ because of the internal structure of the library. Here is how the program would\
    \ look:\n\n```\nh = tf.constant(\"Hello World\")\nsess = tf.Session()\nsess.run(h)\n\
    ```\n\nIn this case, we first create a TensorFlow constant `h` and assign it the\
    \ value `Hello World`. The concept of constants will be touched upon in the next\
    \ program, as mentioned before.\n\nNext, we need to create a session, which can\
    \ execute an entire graph or a part of the graph. Accordingly, it will allocate\
    \ resources and accommodate values and results.\n\nWe use `sess` as a shorter,\
    \ easier version of the command `tf.Session`, because in larger programs we will\
    \ need to keep running and closing several sessions, and it would be cumbersome\
    \ to have to write the full command every time.\n\nNow, when we execute the program,\
    \ our output will appear as follows:\n\n```\nHello World\n```\n\nIf we don’t create\
    \ a session and try to call the variable `h` to print the output, we will still\
    \ obtain an output, but not quite in the way that we were hoping. Instead of giving\
    \ us the value of `h`, it will show us that `h` is a tensor, and it will give\
    \ us a quick summary of this tensor. And that’s about it. The output will be displayed\
    \ as follows:\n\n```\nTensor(\"Const:0\", shape=(), dtype=string)\n```\n\nNow,\
    \ as you’ve seen, we have used the `tf.constant()` function in our program, which\
    \ defines `h` as a constant (rather than a variable or a placeholder). To understand\
    \ the difference between constants, variables, and placeholders better, we will\
    \ have a look at another program.\n\n## Program 2: Constants, Variables, and Placeholders\n\
    \nMany of us have heard the terms *constants*, *variables*, and *placeholders*\
    \ thrown around quite often, especially in the programming world. That is because\
    \ they play a huge role in the development of a considerable number of programs.\n\
    \nBefore we begin using them to code, we need to know what exactly they are. They\
    \ can generally be defined in the following ways:\n\n- **Constants:** These are\
    \ values that *never change*.\n- **Variables:** These are values that *can change*\
    \ throughout the program.\n- **Placeholders:** These are empty variables that\
    \ are *assigned values at a later stage* in the program.\n\nTable 9-1 lists a\
    \ few ways in which they vary from one another.\n\n**Table 9-1** The Differences\
    \ Between Constants, Variables, and Placeholders\n\n| Constants | Variables |\
    \ Placeholders |\n| --- | --- | --- |\n| They have an initial value. | They have\
    \ an initial value. | They do not have an initial value. |\n| These values never\
    \ change. | These values can change. | These values can change. |\n| The type\
    \ of value does not need to be specified. | The type of value does not need to\
    \ be specified. | The type of value needs to be specified. |\n| Example: `a =\
    \ tf.constant(4)` | Example: `b = tf.Variable(5)` | Example: `c = tf.placeholder(tf.float32)`\
    \ |\n\n**Note:** When we say that the “type” of value does or does not need to\
    \ be specified, we mean that we need not tell the program if the constant or variable\
    \ is a string, a float, an integer, etc., while for a placeholder, we need to\
    \ specify this.\n\nNow that we know what constants, variables, and placeholders\
    \ are, let’s go ahead and use them to create a program."
