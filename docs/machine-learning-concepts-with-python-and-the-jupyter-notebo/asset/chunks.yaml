    ## Program 3: Clothing Classification Using Keras in TensorFlow (Multi-layer,
    Multi-class)


    In this modern generation, clothing has become one of the top priorities for most
    people. When it comes to business, fashion is one very important industry, considering
    how much individuals are willing to invest on the kind of clothes they wear. Now
    just imagine what would happen if we integrated artificial intelligence with this
    already booming industry—the entire sector would be transformed.


    It’s definitely an interesting area to get into, since it has so much scope for
    new innovations. For now, we will get a little taste of it by building a neural
    network to classify images of clothing.


    In this program, we will be doing pretty much the same things we did previously,
    but with a different dataset and a few extra layers. We will also add a few more
    lines of code, just to explore some new functions under `TensorFlow`. The general
    structure, API, and optimizer all remain the same or at least are similar here,
    so we will skip that part and go ahead to the rest of the program.


    ### The Dataset


    The dataset that we will be using for this program is the `Fashion MNIST` dataset.
    This dataset is a part of Zalando’s research images and can be used instead of
    the original `MNIST` dataset to train an image classification model. It is a set
    of 60,000 training images and 10,000 test images. Each is a 28x28 greyscale image
    of an item of clothing. Altogether, there are ten classes in the dataset.


    ### The Activation Functions


    In this program, we will use two activation functions:


    1. `ReLU`

    2. `Softmax`


    ### The Program


    **Step 1: In a new Jupyter notebook, import the TensorFlow library and Keras utilities.**


    ```python

    import tensorflow as tf

    from tensorflow.keras import datasets, layers, models

    ```


    By adding this extra `import` step, we now no longer have to keep typing `tf.keras`
    before calling each function. We can just call it directly, as you will see in
    the next step.


    **Step 2: Load the Fashion MNIST dataset.**


    We can load the `Fashion MNIST` dataset into our Jupyter notebook like this:


    ```python

    data = datasets.fashion_mnist

    (ip_train, op_train), (ip_test, op_test) = data.load_data()

    ```


    **Step 3: Check the shape of the images.**


    This displays the shape of the training and test input data.


    ```python

    print(ip_train.shape, ip_test.shape)

    ```


    As we can see, it has three dimensions here: the number of images in the set,
    the width, and the height.


    **Step 4: Reshape the input values.**


    Usually, we have datasets with images that are colored. This means that all three
    RGB (Red Green Blue) channels are available. Now in `TensorFlow`, an image that
    is fully colored has a depth of 3. However, the `Fashion MNIST` dataset consists
    of greyscale images, which means it is just black and white. Thus, it has a depth
    of 1.


    In this step, we reshape the images from having a dimension of (n, width, height)
    to having a new dimension of (n, width, height, depth), where *n* is the number
    of images in the set.


    The code will look like this:


    ```python

    ip_train = ip_train.reshape((60000, 28, 28, 1))

    ip_test = ip_test.reshape((10000, 28, 28, 1))

    print(ip_train.shape, ip_train.shape)

    ```


    Now when we display the reshaped data, it will show four dimensions.


    **Step 5: Prepare the data.**


    Once again, we need to normalize the data, as shown here:


    ```python

    ip_train, ip_test = ip_train / 255.0, ip_test / 255.0

    ```


    **Step 6: Build the neural network.**


    This time, we will add two extra dense layers to our neural network, with 128
    and 1,000 neurons in them respectively, and each having the activation function
    `ReLu`. We will also add an extra “dropout layer” before the final layer, which
    helps to prevent overfitting.


    ```python

    model = models.Sequential([

    layers.Flatten(input_shape=(28, 28, 1)),

    layers.Dense(128, activation="relu"),

    layers.Dense(1000, activation="relu"),

    layers.Dropout(0.5),

    layers.Dense(10, activation="softmax")

    ])

    ```


    **Step 7: Compile the model.**


    Before fitting the model, we compile the model, like this:


    ```python

    model.compile(optimizer = ''adam'',

    loss = ''sparse_categorical_crossentropy'',

    metrics = [''accuracy''])

    ```


    **Step 8: View the model.**


    ```python

    model.summary()

    ```


    We will get the summary of the model, like in Figure 11-10.


    ![../images/491271_1_En_11_Chapter/491271_1_En_11_Fig10_HTML.jpg](images/491271_1_En_11_Chapter/491271_1_En_11_Fig10_HTML.jpg)


    **Figure 11-10** Summary of the model


    **Step 9: Train the model.**


    ```python

    model.fit(ip_train, op_train, epochs = 5)

    ```


    The model will begin training through five epochs, as shown in Figure 11-11.


    ![../images/491271_1_En_11_Chapter/491271_1_En_11_Fig11_HTML.jpg](images/491271_1_En_11_Chapter/491271_1_En_11_Fig11_HTML.jpg)


    **Figure 11-11** Training the model through five epochs


    **Step 10: Test the model.**


    In this step, we will use something called `verbose`. The `verbose` command is
    used to provide information about a particular task. We can alter the amount of
    information that we get by setting `verbose` at either 1 or 2.


    - At 0, we get nothing.

    - At 1, we get a progress bar and the number of epochs, along with the loss and
    accuracy.

    - At 2, we get only the number of epochs along with the loss and accuracy, without
    the progress bar.


    ```python

    model.evaluate(ip_test, op_test, verbose = 2)

    ```


    We will obtain an output as shown in Figure 11-12.


    ![../images/491271_1_En_11_Chapter/491271_1_En_11_Fig12_HTML.jpg](images/491271_1_En_11_Chapter/491271_1_En_11_Fig12_HTML.jpg)


    **Figure 11-12** Evaluating the model'
