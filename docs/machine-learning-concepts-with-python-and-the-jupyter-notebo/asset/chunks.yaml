    # Part I: Artificial Intelligence, Machine Learning, and Deep Learning


    Artificial Intelligence, Machine Learning, and Deep Learning


    In Part I, you will be introduced to the fundamental concepts of artificial intelligence,
    machine learning, and deep learning. If you are a beginner, this will be a good
    way for you to get familiar with the terms and basics that are commonly used and
    good to know while working in this field. If you are a little more experienced,
    this will help you to recap all that you have learned so far. You might even come
    across something new!


    What to expect from this part:


    * An introduction to artificial intelligence

    * An introduction to machine learning

    * An overview of machine learning concepts

    * An introduction to deep learning

    * An overview of deep learning concepts

    * A comparison between machine learning and deep learning


    # 1. An Overview of Artificial Intelligence


    In this chapter, we will take our first steps into the world of artificial intelligence.
    Although it is a vast field, and we would probably require a whole other book
    to really dive deeply into it, we will go through a summary of important AI facts
    and concepts—what it is, how it came about, its benefits and drawbacks, and how
    it is being implemented in our present lives.


    ## Artificial Intelligence Primer


    We have all heard about intelligence. From experience, we have found that students
    who score higher grades supposedly have more intelligence than those who score
    lower. This may not always be the case, but it is what we tend to conclude.


    We also know that Einstein had an IQ of about 160. What is astonishing is that
    a twelve-year-old girl in England ended up scoring 162, thus beating the world-renowned
    genius in this measure of intelligence.


    So, what exactly is intelligence?


    *Intelligence can be defined as the ability to acquire and apply knowledge and
    skills.*


    This is why we are given an education from childhood. Over the years, we are fed
    with knowledge that is meant to help us become more intelligent.


    Over the years, people worked hard and expanded their research and scientific
    advancements. They used their “natural intelligence” to come up with bigger and
    better innovations. Eventually, they were able to program machines to work and
    think like them, which they soon began to refer to as “artificial intelligence.”


    *Artificial intelligence can be defined as the ability of a machine to think like
    a human being, in order to perform a particular task, without being explicitly
    programmed.*


    It is also sometimes referred to as “machine intelligence” and can be compared
    to “human intelligence.” It is, as a matter of fact, inspired by a human being’s
    natural intelligence. It aims to replicate the cognitive abilities of the human
    brain, like learning, understanding, and solving problems.'
