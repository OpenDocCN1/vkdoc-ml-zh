    ## 机器学习的应用


    多年来，随着机器学习日益普及，爱好者们开始深入研究解决机器学习问题的不同方法。他们很快提出了不同类型的算法，这些算法被证明是最有效的，具体取决于你所使用的数据和参数。因此，这些算法得以在全球范围内应用。开发者可以轻松选择他们想要实现的方法，并相应地遵循算法。


    机器学习模型的结构根据其需求而有所不同。我们将在本书后面更深入地探讨机器学习模型的架构。


    现在，我们对机器学习有了基本了解，接下来看看它在现实世界中的一些应用，如下所示：


    *   **电子商务：** 机器学习可以通过推荐系统（向潜在客户推荐相关产品）、分析和预测（从过去的销售中学习并改善未来的销售）等来帮助提升在线销售额。


    *   **自动驾驶汽车：** 自动驾驶汽车将不再是未来的事物。它们已经存在，并且在几年内将面向所有人开放市场。


    *   **制造业：** 许多公司使用机器人以更快、更便捷的方式开发产品。这是因为机器人可以被编程为不知疲倦地工作，精度更高，成本更低。


    *   **医疗保健：** 人工智能技术已经取得了巨大进步，一个重要的证据就是它现在正被应用于医疗保健领域。一个非常有趣的应用是机械臂手术，顾名思义，就是使用机械臂进行手术。自
    1985 年首次使用 Arthrobot 机器人以来，这种手术已多次进行，以提高精度并减小切口。


    ## 总结


    我们现在知道了什么是机器学习，以及它如何借助数据科学技术来利用数据。我们了解了一些机器学习算法类型，并看到了它们目前在现实世界中的应用。随着我们技术的飞速发展，对机器学习的需求也在急剧增长。这呼唤着更好、更先进的机器学习方法。机器学习的一个此类分支是一种广泛使用的技术，称为深度学习。我们将在下一章中介绍它。


    # 3. 深度学习简介


    用于人工智能的机器学习到目前为止听起来相当有趣，不是吗？当我第一次听说它时，我觉得这像是科幻电影里的东西。过去只能在*银幕*生活中体验的事物，现在也能在*现实*生活中体验到了，这真是太神奇了！


    哦，是的，这个双关语绝对是故意的。


    一旦机器学习在技术领域腾飞，便势不可挡。每一天，每一分钟，人们都开始有新的发现，并开发出比以往模型性能更优的新模型。然而，这些机器学习模型仍然不够好。它们确实能工作，别误会我的意思。它们也相当有效。但它们就是不够高效。


    直到人们成功开发出一种机器学习技术，它能够帮助机器自行解决问题，从而以极高的精度解决极其复杂的问题。事实上，这项技术变得非常流行，现在它作为人工智能下的一个独立领域而广为人知（尽管它并未与机器学习分离）。它很快被命名为“深度学习”。


    在本章中，我们将了解这种机器学习方法是如何产生的，以及为什么需要它。我们还将深入探讨深度学习所涉及的过程；即神经网络的工作原理。这将使我们理解像 TensorFlow
    这样的库在编程语言中为何重要，尤其是在深度学习的背景下。


    ## 深度学习的起源


    *深度学习是机器学习的一个分支，它使用人工神经网络来帮助机器思考并响应特定问题*。


    这里需要记住的重要一点是，尽管很容易将深度学习视为人工智能下的一个独立领域，但它绝对不是。它仍然是人工智能的一部分，并且是机器学习的一个子集（图 3-1）。


    ![../images/491271_1_En_3_Chapter/491271_1_En_3_Fig1_HTML.jpg](img/491271_1_En_3_Fig1_HTML.jpg)


    图 3-1


    深度学习是人工智能领域中机器学习的一个子集


    因此，我们可以说深度学习是机器学习的子集，而机器学习又是人工智能的子集。数据科学在这里就像一个公分母，因为它是这三个领域都不可或缺的一部分。深度学习的起源归功于沃尔特·皮茨和沃伦·麦卡洛克。


    沃尔特·皮茨是一位计算神经科学领域的逻辑学家，而沃伦·麦卡洛克则是一位神经生理学家和控制论专家。


    1943 年，他们创建了一个受人类大脑中神经网络启发的计算机模型。他们开发了一种称为阈值逻辑的东西，这是一种数学和算法的结合，将总输入与某个阈值进行比较。这使他们能够像大脑中发生的那样，重现思考过程。这是一项突破，引领了更多深度学习的创新。


    现在，让我们来了解其中一个非常重要的方面——神经网络。


    ## 神经网络


    神经网络，或称人工神经网络，其灵感来源于生物神经网络并以其为模型。这些网络就像人脑一样，无需显式编程就能学会执行特定任务。


    神经网络由一系列相互连接形成网络的神经元组成，因此得名神经网络。神经元，或人工神经元，是神经网络的基本单元。它是一个数学函数，模拟了人脑中的神经元，如图 3-2
    所示。表 3-1 提供了生物神经元和人工神经元的比较。


    表 3-1


    生物神经元与人工神经元的比较


    | 生物神经元 | 人工神经元 |

    | --- | --- |

    | 它以电信号的形式接收信息。 | 它以数值的形式接收信息。 |

    | 从字面上讲，人脑大约由 860 亿个生物神经元组成。 | 一个神经网络最多可以包含大约 1000 个人工神经元。 |

    | 一般结构包括细胞体、树突和轴突。 | 一般结构包括权重和偏置、净输入函数以及激活函数。 |


    ![../images/491271_1_En_3_Chapter/491271_1_En_3_Fig2_HTML.jpg](img/491271_1_En_3_Fig2_HTML.jpg)


    图 3-2


    一个生物神经元和一个人工神经元


    注意


    感知机就是一个人工神经元。在深度学习中，术语*感知机*和*神经元*可以互换使用。


    ## 人工神经元（感知机）的工作原理


    感知机遵循特定的步骤流程来实现其期望的输出。让我们一步步了解感知机的工作原理。


    ### 第 1 步：接收输入


    感知机以向其提供的数字信号形式接收来自用户的输入。这些输入是用于训练模型的“特征”。它们用`x(n)`表示，其中`n`是特征的编号。然后，这些输入通过一个称为前向传播的过程被馈送到神经网络的第一层。

    '
- fmt: '### Step 2: Setting the Weights and Bias


    - **Weights:** The weights are calculated and set while training the model. They
    are represented by `w(n)`, where `n` is the number of the weight. For example,
    the first weight will be `w1`, the second weight will be `w2`, and so on.

    - **Bias:** The bias is used to train a model with higher speed and accuracy.
    We generally represent it with `w0`.


    ### Step 3: Calculating the Net Input Function


    The equation for the net input function is as follows:


    `I = Sum(x(n).w(n) + w0)`


    Thus, each input feature is multiplied by its corresponding weight, and the sum
    of all these products is taken. Then, the bias is added to this result.


    - **The Perceptron Learning Rule:** According to this rule, the algorithm automatically
    determines the optimum values for the weights. The input features are then multiplied
    by these weights in order to determine if the perceptron should forward the signal
    or not. The perceptron is fed with several signals, and if the resultant sum of
    these signals exceeds a particular threshold, it either returns an output signal
    or doesn’t.


    ### Step 4: Passing the Values Through the Activation Function


    The activation function helps with providing nonlinearity to the perceptron. There
    are three types of activation functions that can be used: ReLU, Sigmoid, and Softmax.


    #### ReLU


    The Rectified Linear Unit is used to eliminate negative values from our outputs.


    - If the output is positive, it will leave it as it is.

    - If the output is negative, it will display a zero.


    **Pros:**


    1. It is scalable.

    2. It provides efficient computation.

    3. It works well for neural networks with complex datasets.


    **Cons:**


    1. The output value is not restricted, which means it can cause issues if large
    values are passed through it.

    2. The neurons can become inactive and “die” when the learning rate is large.

    3. There is asymmetric handling of data, and results can end up inconsistent.


    #### Sigmoid


    It is a special mathematical function that produces an output with a probability
    of either 1 or 0.


    **Pros:**


    1. It is differentiable and monotonic.

    2. It can be used for binary classification.

    3. It is useful when we need to find only the probability.


    **Cons:**


    1. It does not give precise values.

    2. There is the issue of a vanishing gradient, which prevents the sigmoid function
    from being used in multi-layered networks.

    3. The model can get stuck in a local minima during its training.


    #### Softmax


    It is generally used in the final layer of a neural network. It is generally used
    to convert the outputs to values that, when summed up, result in 1. Thus, these
    values will lie between 0 and 1.


    **Pros:**


    1. It can be used for multi-class classification.

    2. The range is only between 0 and 1, thus simplifying our work.


    **Cons:**


    1. It does not support a null class.

    2. It does not work for linearly separable data.


    #### One Hot Encoding


    One Hot Encoding is a tweak that can be used while producing the outputs. It is
    used to round off the highest value to 1, while making the other values 0. This
    makes it easier to figure out which is the necessary class, as it is easier to
    spot a 1 from a list of 0s, rather than finding the highest value from a random
    list of numbers.


    For example, say we have a set of inputs like `0.11`, `0.71`, `0.03`, `0.15`.
    Here, it is obviously not too difficult to identify the highest value since there
    are only four values.


    Now imagine if the list had about 1,000 values. That would be difficult, wouldn’t
    it?


    But, with the help of One Hot Encoding, we can easily identify the one from the
    zeroes. That is why it is a popular technique used in neural networks.


    **Pro Tip**


    The most common practice is to use a ReLU activation function in all the hidden
    layers, and then to use either a Softmax activation function (for multi-class
    classification) or Sigmoid activation function (for binary classification).


    ### Step 5: Producing the Output


    The final output is then passed from the last hidden layer to the output layer,
    which is then displayed to the user.


    Now that we know how a perceptron works, let’s go a little more in depth as to
    how a neural network performs a deep learning task.


    ## Digging Deeper into Neural Networks


    Deep learning goes a step further in machine learning. It allows the machine to
    begin thinking on its own in order to make decisions and carry out certain tasks.
    Neural networks are used to develop and train deep learning models. For example,
    consider a very simple neural network, which consists of an input layer, an output
    layer, and one layer of neurons, known as the hidden layer (as shown in Figure
    [3-3](#491271_1_En_3_Chapter.xhtml#Fig3)). The basic function of these three sections
    is as follows:


    ![../images/491271_1_En_3_Chapter/491271_1_En_3_Fig3_HTML.jpg](images/491271_1_En_3_Chapter/491271_1_En_3_Fig3_HTML.jpg)


    Figure 3-3


    Basic neural network


    1. The **input layer**, as the name implies, is made of the input signals that
    will be further transmitted into the neural network.

    2. The **hidden layer** is where all the important computations occur. The input
    that is fed to it is taken, calculations are performed on it, and then this input
    is sent to the next layer, which is the output layer. The hidden layer can have
    any number of neurons within it. There can also be more than one hidden layer,
    depending on our requirements and arrangement.

    3. The **output layer**, as the name suggests, contains the output signals. These
    are nothing but the final results of all the calculations performed by the hidden
    layer/s.


    ### The Process


    There are four main steps to the neural network process that allow it to come
    up with the most optimal solution for any problem that is given to it.


    - **Step 1:** The numerical input signals are passed into the neural network’s
    hidden layers.

    - **Step 2:** The net input function is calculated with the weights and the bias
    that are generated during the training.

    - **Step 3:** The activation function is applied to the net input function.

    - **Step 4:** The result is then produced as the output of the neural network.


    Thus, deep learning, as a part of machine learning, stands out as an extremely
    useful technique in the area of artificial intelligence.


    ### Additional Concepts


    In the following sections, we will review some key concepts that are important
    to know when it comes to neural networks.


    #### Gradient Descent


    Gradient descent is a deep learning algorithm that is used for optimization. It
    determines the values of the parameters of a function in order to ensure that
    the value of the cost function is minimized.


    It minimizes the function by iteratively moving in such a way that it follows
    the path of steepest descent, depending on the negative of the gradient.


    The gradient of the error function with respect to the weights of the neural network
    is calculated. Afterward, the output is compared with the labels in order to calculate
    the error.


    #### Forward Propagation


    A perceptron accepts inputs or “features,” processes them, and then predicts the
    output. This output is then compared with the labels to measure the error. This
    is known as the forward propagation.


    The data is fed into a layer of the neural network, passed through the activation
    function, and then fed to the next layer. The data must move forward to ensure
    that an output is achieved.


    Thus, for any hidden layer in a neural network, after the first layer, the input
    is nothing but the output that is generated from the previous layer.'
