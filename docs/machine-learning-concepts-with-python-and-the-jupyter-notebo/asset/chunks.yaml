  raw: '### TensorBoard.dev


    TensorBoard.dev allows users to host their projects online, keep track of them,
    and share them with others. It is free, readily available, and great for when
    different people from various parts of the world need to work together online.


    Its benefits include the following:


    1.  It enables users to share their programs on a large scale.


    2.  It allows users to ask for help in case of any bugs or errors that they are
    unable to solve on their own.


    3.  It gives people the ability to share insights and research with others.


    4.  It is interactive, which helps others to have a better understanding of the
    model.


    5.  There is no requirement for any installation procedures. All it needs is a
    sharable link.


    6.  Free storage is provided, with a current limit of 10 million data points per
    user.


    TensorBoard.dev thus makes it a less tedious task to seek help from others or
    contribute to other people’s machine learning projects.


    Note


    All data that is uploaded to TensorBoard.dev is publicly visible to anyone and
    everyone. Thus, we need to **be cautious while sharing information online**. For
    example, personal information, user-specific authentication codes, and so on must
    be avoided or hidden before releasing the program.


    ## Summary


    In this chapter, we have learned about TensorFlow, which is one of the top machine
    learning libraries used in Python. We have seen what it is, how it was developed,
    why it is important to a programmer, and how it works. We have recognized its
    competitors in the machine learning world, its special features that make it stand
    out, as well as its disadvantages so far.


    We then got introduced to pip, and we learned how to install TensorFlow with the
    help of this package managing tool and then verify that the installation was done
    without any errors.


    We finally had a brief overview of the TensorBoard and its features, which comes
    in handy while visualizing our models. We also had a look at the TensorBoard.dev
    tool, which allows us to share our machine learning projects easily and free of
    cost.


    Now that we have some idea of what we are going to be working with, we can begin
    exploring the various features of the TensorFlow library to see how we can use
    it within Python, in Jupyter Notebook, for our machine learning experiments.


    ## Additional Information


    For more information on TensorFlow, check out the following information.


    ### TensorFlow Dev Summit


    The TensorFlow Dev Summit is a huge event in which developers from across the
    globe come together to discuss, learn, and share with one another.


    The developers spend time engaging in interactive demos, technical talks, conversations
    with the TensorFlow team, and discussions with the TensorFlow community.


    It happens every year at a location specified on the official website. Those who
    cannot attend the on-site summit can view it online as it is live-streamed.


    The registration is free of charge. The attendee will have to bear any expenses
    (such as travel and stay) on their own.


    More details are available on the official TensorFlow website for anyone who is
    interested.


    ### TensorFlow Blogs


    The TensorFlow team maintains a blog that provides users with useful updates,
    important changes, new additions, and so on. It also has a wide range of tutorials
    on various kinds of programs that machine learning enthusiasts can try on their
    own, or even use as a base reference to develop something new.


    The articles that are published fall under the following main topics:


    *   **TensorFlow Core:** It deals with Python coding using Keras APIs. It is useful
    for beginners as well as experts.


    *   **TensorFlow.js:** It deals with coding using JavaScript.


    *   **TensorFlow Lite:** It deals with using machine learning models on IoT devices
    and mobile phones.


    *   **TFX (TensorFlow Extended):** It deals with moving models from the research
    phase to the production phase.


    *   **Swift:** It deals with developments and tutorials in Swift, which is a next-gen
    deep learning platform.


    *   **Community:** It deals with projects and experiments done by the TensorFlow
    community on a global scale.


    Apart from their blogs, they also have a monthly newsletter that brings all the
    important announcements right to our inbox.


    ### The TensorFlow Developer Certificate


    The TensorFlow Developer Certificate is a great resume-boosting asset to have.
    It indicates the level proficiency a person has in the area of machine learning
    for artificial intelligence using TensorFlow.


    When a person passes the assessment, they get an official certificate, as well
    as badges, which they can add to their professional social networking profiles.
    They are also added to TensorFlow’s Certificate Network. This increases visibility
    within the TensorFlow community.


    It is a great way to improve our knowledge of the library, develop our machine
    learning skills, and establish ourselves as experts in the field. Considering
    that TensorFlow is a product of Google, obtaining this certificate can undoubtedly
    make a data scientist''s resume stand out.


    More information detailing the registration, cost, preparation, and so on can
    be found on the main website.


    ### Quick Links


    *   Learn more about the TensorFlow library: [`https://www.TensorFlow.org/learn`](https://www.tensorflow.org/learn)


    *   Take a look the TensorFlow Guide: [`https://www.TensorFlow.org/guide/`](https://www.tensorflow.org/guide/)


    *   Explore the models and datasets developed by the TensorFlow Community: [`https://www.TensorFlow.org/resources/models-datasets`](https://www.tensorflow.org/resources/models-datasets)


    *   Check out the tools that are supported by TensorFlow: [`https://www.TensorFlow.org/resources/tools`](https://www.tensorflow.org/resources/tools)


    *   Learn more about the libraries and extensions used in TensorFlow: [`https://www.TensorFlow.org/resources/libraries-extensions`](https://www.tensorflow.org/resources/libraries-extensions)


    *   TensorBoard: [`https://www.TensorFlow.org/tensorboard/get_started`](https://www.tensorflow.org/tensorboard/get_started)


    *   TensorFlow Dev Summit: [`https://www.TensorFlow.org/dev-summit`](https://www.tensorflow.org/dev-summit)


    *   TensorFlow Developer Certificate: [`https://www.tensorflow.org/certificate`](https://www.tensorflow.org/certificate)'
  trans: '

    ### TensorBoard.dev


    TensorBoard.dev 允许用户在线托管、跟踪并与他人分享他们的项目。它是免费的，随时可用，非常适合来自世界各地的不同人员需要在线协作的场景。


    其优势包括以下几点：


    1.  它使用户能够大规模地分享他们的程序。


    2.  它允许用户在遇到无法自行解决的错误或故障时寻求帮助。


    3.  它让人们能够与他人分享见解和研究成果。


    4.  它具有交互性，有助于他人更好地理解模型。


    5.  无需任何安装步骤。只需要一个可分享的链接。


    6.  提供免费存储空间，目前每个用户的数据点限制为 1000 万个。


    因此，TensorBoard.dev 使得向他人寻求帮助或为其他人的机器学习项目做出贡献变得不那么繁琐。


    注意


    所有上传到 TensorBoard.dev 的数据对任何人都公开可见。因此，我们需要**在在线分享信息时保持谨慎**。例如，在发布程序之前，必须避免或隐藏个人信息、用户特定的身份验证代码等。


    ## 总结


    在本章中，我们学习了 TensorFlow，它是 Python 中使用的顶级机器学习库之一。我们了解了它是什么、它是如何开发的、为什么它对程序员很重要，以及它是如何工作的。我们认识了它在机器学习领域的竞争对手、使其脱颖而出的特殊功能，以及它目前的缺点。


    然后，我们介绍了 pip，并学习了如何借助这个包管理工具安装 TensorFlow，然后验证安装是否成功且无错误。


    最后，我们简要概述了 TensorBoard 及其功能，这些功能在可视化我们的模型时会派上用场。我们还了解了 TensorBoard.dev 工具，它允许我们轻松且免费地分享我们的机器学习项目。


    既然我们已经对将要使用的内容有了一些了解，我们就可以开始探索 TensorFlow 库的各种功能，看看如何在 Python 和 Jupyter Notebook
    中使用它来进行机器学习实验。


    ## 附加信息


    有关 TensorFlow 的更多信息，请查看以下内容。


    ### TensorFlow 开发者峰会


    TensorFlow 开发者峰会是一个大型活动，来自全球各地的开发者齐聚一堂，相互讨论、学习和分享。


    开发者们会花时间参与互动演示、技术讲座、与 TensorFlow 团队的对话以及与 TensorFlow 社区的讨论。


    该峰会每年在官方网站指定的地点举行。无法参加现场峰会的人可以通过在线直播观看。


    注册是免费的。参会者需自行承担任何费用（例如差旅和住宿）。


    感兴趣的人可以在 TensorFlow 官方网站上找到更多详细信息。


    ### TensorFlow 博客


    TensorFlow 团队维护着一个博客，为用户提供有用的更新、重要的变更、新增功能等。它还包含各种类型的程序教程，机器学习爱好者可以自行尝试，甚至可以作为开发新内容的基础参考。


    发布的文章主要涵盖以下主题：


    *   **TensorFlow Core：** 涉及使用 Keras API 进行 Python 编码。对初学者和专家都很有用。


    *   **TensorFlow.js：** 涉及使用 JavaScript 进行编码。


    *   **TensorFlow Lite：** 涉及在物联网设备和手机上使用机器学习模型。


    *   **TFX（TensorFlow Extended）：** 涉及将模型从研究阶段转移到生产阶段。


    *   **Swift：** 涉及 Swift（一个下一代深度学习平台）的开发进展和教程。


    *   **社区：** 涉及 TensorFlow 社区在全球范围内进行的项目和实验。


    除了他们的博客，他们还有一份月度通讯，将所有重要的公告直接发送到我们的收件箱。


    ### TensorFlow 开发者证书


    TensorFlow 开发者证书是一项极佳的简历加分项。它表明一个人在使用 TensorFlow 进行人工智能机器学习方面的熟练程度。


    当一个人通过评估后，他们将获得官方证书以及徽章，可以添加到他们的专业社交网络资料中。他们也会被添加到 TensorFlow 的证书网络中。这提高了在 TensorFlow
    社区中的可见度。


    这是提升我们对库的了解、发展机器学习技能、并将自己确立为该领域专家的好方法。考虑到 TensorFlow 是谷歌的产品，获得此证书无疑能让数据科学家的简历脱颖而出。


    有关注册、费用、准备等更多详细信息，请访问主网站。


    ### 快速链接


    *   了解更多关于 TensorFlow 库的信息：[`https://www.TensorFlow.org/learn`](https://www.tensorflow.org/learn)


    *   查看 TensorFlow 指南：[`https://www.TensorFlow.org/guide/`](https://www.tensorflow.org/guide/)


    *   探索 TensorFlow 社区开发的模型和数据集：[`https://www.TensorFlow.org/resources/models-datasets`](https://www.tensorflow.org/resources/models-datasets)


    *   查看 TensorFlow 支持的工具：[`https://www.TensorFlow.org/resources/tools`](https://www.tensorflow.org/resources/tools)


    *   了解更多关于 TensorFlow 中使用的库和扩展：[`https://www.TensorFlow.org/resources/libraries-extensions`](https://www.tensorflow.org/resources/libraries-extensions)


    *   TensorBoard：[`https://www.TensorFlow.org/tensorboard/get_started`](https://www.tensorflow.org/tensorboard/get_started)


    *   TensorFlow 开发者峰会：[`https://www.TensorFlow.org/dev-summit`](https://www.tensorflow.org/dev-summit)


    *   TensorFlow 开发者证书：[`https://www.tensorflow.org/certificate`](https://www.tensorflow.org/certificate)

