    没错！就是这样。

    双连字符后跟 `infile` 用于调用包含旧版 TensorFlow 代码的文件。在本例中，它将是包含该代码的 Jupyter Notebook 的名称。

    双连字符后跟 `outfile` 用于重命名 TensorFlow 将代码升级到新版本时创建的文件。

    现在，在开始输入之前，我们需要将 TensorFlow 导入到 Jupyter notebook 中。之后，我们可以输入这段代码并相应地添加我们的文件名。


    当我们执行该单元格时，更新需要一些时间，之后它会显示输出。它还会创建两个新文件：


    1.  一份关于其操作内容的**报告**，我们可以检查该报告以查看更新中是否有任何重大错误。它会提及已添加的任何关键字和已重命名的参数。它还建议了更适合手动检查的地方。所有这些都存储在
    `report.txt` 文件中。


    2.  包含 TensorFlow 2.0 更新的**新文件**，我们在代码行中为其提供了名称。可以测试这个新模型，以确保它仍然能产生所需的结果。


    现在我们对这个脚本的工作原理有了一些了解，让我们通过一个小程序来尝试一下。为此，我们将使用非常基础的“Hello World”程序。我相信，到现在为止，我们都还记得这段代码，它看起来像这样：


    ```

    import tensorflow as tf

    h = tf.constant("Hello World")

    sess = tf.Session()

    sess.run(h)

    sess.close()

    ```


    假设这段代码在一个 Jupyter notebook 中，并且这个 notebook 以“Hello World 1.0”的名称保存。要进行升级，首先打开一个新的
    Jupyter notebook。在 notebook 中，导入 TensorFlow 2.0，然后输入升级脚本。代码将如下所示：


    ```

    import tensorflow as tf

    tf_upgrade_v2 —infile "Hello World 1.0.ipynb"  —outfile "Hello World 2.0.ipynb"

    ```


    当我们执行这个单元格时，我们会找到名为“Hello World 2.0”的新 Jupyter notebook。我们还会找到一个名为 `report.txt`
    的文本文档形式的详细升级报告。


    点击新创建的 Jupyter notebook。我们会看到一些更改已经完成。然而，由于这不是一个非常大的程序，所以不需要太多修改。唯一重要的变化是对 `tf.Session()`
    这一行所做的修改。它变成了以下内容：


    ```

    sess = tf.compat.v1.Session()

    ```


    当我们打开报告时，它会显示它所做的更改。例如，在这种情况下，它会显示以下内容：


    ```

    INFO: Renamed ''tf.Session'' to ''tf.compat.v1.Session''

    ```


    注意


    `tf.compat.v1` 模块用于允许程序获取 TensorFlow 1.0 相关的功能，包括会话和占位符。


    当然，当我们对更高级的程序使用升级脚本时，脚本会进行更多的修改，这些修改在生成的新 notebook 以及它创建的报告中都可见。我们还需要自己做一些额外的更改，因为程序无法做到这一点。总的来说，升级脚本能够完成大约
    80% 的工作；剩下的需要由我们完成。


    使用升级脚本时，有一些重要的点需要我们牢记，如下所示：


    1.  不要以任何方式手动将代码从 TensorFlow 1.0 更改为 TensorFlow 2.0。这可能会导致升级过程中出错。


    2.  升级脚本不会重新排列参数。但是，可以向参数被重新排序的函数中添加关键字参数。


    3.  该脚本遵循将 TensorFlow 库导入为 `tf` 的常规做法，因此会相应地工作。


    4.  兼容性模块（`tf.compat.v1`）将某些 TensorFlow 1.0 引用替换为 2.0 的引用。无论如何，建议移除兼容性模块并替换为新的
    API。


    总结

    TensorFlow 2.0 看起来相当酷，不是吗？正如我们在本章中所读到的，它有一些有趣的新特性，使其比其父版本更强大、更有能力。它确实有缺点，但这些缺点很容易解决，使程序员能够轻松适应它。

    我们甚至基于代码相关的差异将其与 TensorFlow 1.0 进行了比较，并且我们看到了编码变得多么容易。最后，我们学习了如何借助升级脚本将旧的 TensorFlow
    代码迁移到新版本，这使得过程既顺畅又快速。

    TensorFlow 2.0 的构建主要是为了使我们的深度学习实验、研究、模型构建等更加高效。在下一章中，我们将看到如何使用 Python 实现这个库来创建一些令人兴奋的（且功能齐全的）深度学习模型。


    快速链接


    *   在此处阅读更多关于 TensorFlow 2.0 的信息：[`https://www.tensorflow.org/guide/effective_tf2`](https://www.tensorflow.org/guide/effective_tf2)


    *   在此处查看迁移指南：[`https://www.tensorflow.org/guide/migrate`](https://www.tensorflow.org/guide/migrate)


    *   在此处了解更多关于升级脚本的信息：[`https://www.tensorflow.org/guide/upgrade`](https://www.tensorflow.org/guide/upgrade)


    附加信息


    通过禁用 TensorFlow 2.0 运行 TensorFlow 1.0


    尽管 TensorFlow 2.0 目前是该库的默认版本，但仍然可以访问 TensorFlow 1.0 的功能。我们所要做的就是通过调用以下函数来禁用 TensorFlow
    2.0：


    ```

    tf.compat.v1.disable_v2_behavior()

    ```


    这需要在编程之前完成；即，在创建图、添加张量等之前。


    不规则张量


    TensorFlow 引入了“不规则”张量来解决非均匀形状数据数组的问题。例如，让我们考虑一组单词中字母数量的列表，这样每个单词的长度与其他单词差异很大，如下所示：


    ```

    animals = tf.ragged.constant( [ [''c'', ''a'', ''t''],

    [''h'', ''i'', ''p'', ''p'', ''o'', ''p'', ''o'', ''t'', ''a'', ''m'', ''u'',
    ''s''],

    [''b'', ''u'', ''f'', ''f'', ''a'', ''l'', ''o''] ] )

    ```


    然后会像这样显示：


    ```

    这里，第一个单词有三个字母，第二个单词有十二个字母，第三个单词有七个字母。


    我们甚至可以像在常规张量中切片数据一样切片不规则张量。如下所示：


    ```

    print( animals [ 2 ] )

    ```


    这行代码的结果如下：


    ```

    tf.Tensor([''b'', ''u'', ''f'', ''f'', ''a'', ''l'', ''o''], shape=(7,), dtype=string)

    ```


    不规则张量可以执行各种 TensorFlow 操作，包括字符串操作、数学运算、数组操作等。它们也受到许多 TensorFlow API 的支持，如 Keras、tf.function
    等。

    非均匀形状的数据是许多程序员在执行机器学习时面临的常见挑战。不规则张量通过使此类数据的存储和处理更加容易，在这种情况下为我们提供帮助。


    TensorFlow Addons

    TensorFlow Addons 是一个特殊兴趣小组，旨在允许用户贡献具有核心库中不包含功能的新扩展。它拥有由专门团队维护的子包和子模块。


    其中一些子包包括以下内容：


    *   `tfa.text`


    *   `tfa.image`


    *   `tfa.optimizers`


    *   `tfa.metrics`


    *   `tfa.callbacks`


    *   `tfa.rnn`


    11. 使用 TensorFlow 2.0 进行机器学习编程

