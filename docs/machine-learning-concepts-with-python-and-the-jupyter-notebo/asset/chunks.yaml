- fmt: '# Python Interpreters


    One of the key features of Python is that it is an interpreted language, while
    other programming languages like Java, C, and C++ are all compiled languages.


    Let’s understand the difference between the two.


    A compiled language takes the entire program and translates it from machine code
    to source code in order to obtain the required output. These languages therefore
    have a faster runtime, but are not cross-platform.


    An interpreted language executes the code directly by reading each line one by
    one and then running it to obtain the required output. These languages therefore
    have a slightly slower runtime, but are cross-platform.


    There are newer technologies being developed to tackle this issue of slow runtime,
    like the “just-in-time” compiler, which compiles the program during its execution
    instead of before it.


    Now, when we say that Python is an interpreted language, it does not mean that
    it is not compiled at all. Compilation happens for a Python program, but it is
    not explicitly shown to the programmer. The code is compiled into bytecode, which
    is a low-level form of the original code. This bytecode is then executed by the
    Python virtual machine.


    In this way, Python runs the code directly, is not restricted to a particular
    platform, and is not too slow with regard to execution speed.


    There are several types of interpreters that Python can use to run a program.
    Let’s have a brief look some of the most common ones:


    1. **CPython:** This is the default implementation of Python. It is most popularly
    used as it is most compatible with Python packages and with extension modules
    that are written in C. It is the reference implementation of Python, which means
    that all the different versions of Python are implemented in C.


    2. **Jython** (formerly JPython): This is an implementation of Python that is
    written in Java and Python. It translates Python code into Java bytecode, and
    then executes it on a Java virtual machine. This allows Python code to run on
    Java platforms. It also allows users to use a Java class like a Python module.


    3. **IronPython:** This is an implementation of Python that was developed for
    Microsoft’s .NET framework. It uses Python libraries as well as .NET framework
    libraries. It also provides an interactive console and dynamic compilation support
    for improved performance.


    4. **PyPy:** This Python implementation was written in RPython, which is a subset
    of the Python programming language. It uses a just-in-time compiler, which gives
    it a quick runtime speed. It is meant to provide maximum compatibility with CPython,
    while strengthening performance.


    5. **Stackless Python:** This implementation was, like CPython, written with Python
    and C. It gets its name from the fact that it does not depend on the C call for
    its stack. It uses the C stack between function calls, and then clears it out.
    It makes use of microthreads, and supports task serialization, tasklets, communication
    channels, and more.


    6. **MicroPython:** This is a small, open source Python implementation that was
    written in C and is compatible with Python 3. It allows us to write simple Python
    code instead of complex low-level language code, and it can be run on microcontroller
    hardware. It has a range of modules from Python’s standard library, as well as
    some extra libraries that are specific to MicroPython, which can be used to program
    the board.


    Now that we know what interpreters are, we need to know how to interact with them.
    One of the most generic ways to do so is by using something known as a Python
    shell.


    ## The Python Shell


    In computing, a shell acts as a medium between the user and the interpreter. With
    the help of the shell, the programmer can input some code and receive the necessary
    output. The shell waits for the user to enter a command or a line of code. It
    then executes this code and displays the obtained result.


    It is called a shell because it is the outermost layer of the operating system.
    It can provide users with either a command-line interface (CLI) or a graphical
    user interface (GUI), depending on what is required for that particular operation.


    The Python shell, or the Python interactive shell, also called the Python REPL
    shell, takes a Python command and executes it, displaying the required outcome.
    The term *REPL* is an acronym for the systematic flow of events that occurs during
    this process, as follows:


    - **Read:** It reads or takes in an input from the user.

    - **Eval:** It evaluates the input.

    - **Print:** It prints or displays the output to the user.

    - **Loop:** It loops or repeats the process.


    This shell interface is meant to be simple, easy, and great for beginners to get
    the hang of programming on a computer.


    ### Opening the Python Shell


    This task is much easier than it sounds. It is basically a two-step process that
    can be accomplished in a flash.


    ![../images/491271_1_En_5_Chapter/491271_1_En_5_Fig6_HTML.jpg](images/491271_1_En_5_Chapter/491271_1_En_5_Fig6_HTML.jpg)


    Figure 5-6


    The Mac OS Terminal


    1. First, you need to open the command-line interface of your operating system.
    For example, on Mac OS and Linux, it would be the Terminal, while on Windows,
    it would be the command prompt. See Figure [5-6](#491271_1_En_5_Chapter.xhtml#Fig6).


    2. Next, in this interface, type the following:


    ```

    python

    ```


    Hit the Enter key. This should give the output shown in Figure [5-7](#491271_1_En_5_Chapter.xhtml#Fig7).


    ![../images/491271_1_En_5_Chapter/491271_1_En_5_Fig7_HTML.jpg](images/491271_1_En_5_Chapter/491271_1_En_5_Fig7_HTML.jpg)


    Figure 5-7


    The Python shell


    We are now in the Python REPL shell! This is one of the simplest interfaces that
    we can use to program with Python. This Python shell can now accept input as a
    Python command and execute it to display the necessary output. Some simple examples
    are shown in Figure [5-8](#491271_1_En_5_Chapter.xhtml#Fig8), where I have performed
    some single-digit arithmetic operations (addition and subtraction).


    ![../images/491271_1_En_5_Chapter/491271_1_En_5_Fig8_HTML.jpg](images/491271_1_En_5_Chapter/491271_1_En_5_Fig8_HTML.jpg)


    Figure 5-8


    Arithmetic operations in the Python shell


    We can use the `help()` command to explore different features within Python. To
    exit the Help window and return to the Python shell, press q and then Enter. See
    Figure [5-9](#491271_1_En_5_Chapter.xhtml#Fig9).


    ![../images/491271_1_En_5_Chapter/491271_1_En_5_Fig9_HTML.jpg](images/491271_1_En_5_Chapter/491271_1_En_5_Fig9_HTML.jpg)


    Figure 5-9


    The Help window in Python


    ### Exiting the Python Shell


    Once we are done programming with Python, we will need to exit the Python programming
    environment by closing the shell. We can do this by typing in the following command:


    ```

    exit()

    ```


    This exits the Python interactive shell and returns back to the main command-line
    interface of the OS. The reason we use the brackets at the end of the command
    is because we are calling the `exit` function in order to exit from the shell.
    See Figure [5-10](#491271_1_En_5_Chapter.xhtml#Fig10).


    ![../images/491271_1_En_5_Chapter/491271_1_En_5_Fig10_HTML.jpg](images/491271_1_En_5_Chapter/491271_1_En_5_Fig10_HTML.jpg)


    Figure 5-10


    Exiting the Python shell


    The keyboard shortcut for this step is `ctrl+D` on Mac OS and Linux, and `ctrl+Z+Enter`
    on Windows.'
  raw: "## Python Interpreters\n\nOne of the key features of Python is that it is\
    \ an interpreted language, while other programming languages like Java, C, and\
    \ C++ are all compiled languages.\n\nLet’s understand the difference between the\
    \ two.\n\nA compiled language takes the entire program and translates it from\
    \ machine code to source code in order to obtain the required output. These languages\
    \ therefore have a faster runtime, but are not cross-platform.\n\nAn interpreted\
    \ language executes the code directly by reading each line one by one and then\
    \ running it to obtain the required output. These languages therefore have a slightly\
    \ slower runtime, but are cross-platform.\n\nThere are newer technologies being\
    \ developed to tackle this issue of slow runtime, like the “just-in-time” compiler,\
    \ which compiles the program during its execution instead of before it.\n\nNow,\
    \ when we say that Python is an interpreted language, it does not mean that it\
    \ is not compiled at all. Compilation happens for a Python program, but it is\
    \ not explicitly shown to the programmer. The code is compiled into bytecode,\
    \ which is a low-level form of the original code. This bytecode is then executed\
    \ by the Python virtual machine.\n\nIn this way, Python runs the code directly,\
    \ is not restricted to a particular platform, and is not too slow with regard\
    \ to execution speed.\n\nThere are several types of interpreters that Python can\
    \ use to run a program. Let’s have a brief look some of the most common ones:\n\
    \n1.  **CPython** **:** This is the default implementation of Python. It is most\
    \ popularly used as it is most compatible with Python packages and with extension\
    \ modules that are written in C. It is the reference implementation of Python,\
    \ which means that all the different versions of Python are implemented in C.\n\
    \n2.  **Jython** (formerly JPython) **:** This is an implementation of Python\
    \ that is written in Java and Python. It translates Python code into Java bytecode,\
    \ and then executes it on a Java virtual machine. This allows Python code to run\
    \ on Java platforms. It also allows users to use a Java class like a Python module.\n\
    \n3.  **IronPython** **:** This is an implementation of Python that was developed\
    \ for Microsoft’s .NET framework. It uses Python libraries as well as .NET framework\
    \ libraries. It also provides an interactive console and dynamic compilation support\
    \ for improved performance.\n\n4.  **PyPy:** This Python implementation was written\
    \ in RPython, which is a subset of the Python programming language. It uses a\
    \ just-in-time compiler, which gives it a quick runtime speed. It is meant to\
    \ provide maximum compatibility with CPython, while strengthening performance.\n\
    \n5.  **Stackless Python** **:** This implementation was, like CPython, written\
    \ with Python and C. It gets its name from the fact that it does not depend on\
    \ the C call for its stack. It uses the C stack between function calls, and then\
    \ clears it out. It makes use of microthreads, and supports task serialization,\
    \ tasklets, communication channels, and more.\n\n6.  **MicroPython** **:** This\
    \ is a small, open source Python implementation that was written in C and is compatible\
    \ with Python 3\\. It allows us to write simple Python code instead of complex\
    \ low-level language code, and it can be run on microcontroller hardware. It has\
    \ a range of modules from Python’s standard library, as well as some extra libraries\
    \ that are specific to MicroPython, which can be used to program the board.\n\n\
    Now that we know what interpreters are, we need to know how to interact with them.\
    \ One of the most generic ways to do so is by using something known as a Python\
    \ shell.\n\n## The Python Shell\n\nIn computing, a shell acts as a medium between\
    \ the user and the interpreter. With the help of the shell, the programmer can\
    \ input some code and receive the necessary output. The shell waits for the user\
    \ to enter a command or a line of code. It then executes this code and displays\
    \ the obtained result.\n\nIt is called a shell because it is the outermost layer\
    \ of the operating system. It can provide users with either a command-line interface\
    \ (CLI) or a graphical user interface (GUI), depending on what is required for\
    \ that particular operation.\n\nThe Python shell, or the Python interactive shell,\
    \ also called the Python REPL shell, takes a Python command and executes it, displaying\
    \ the required outcome. The term *REPL* is an acronym for the systematic flow\
    \ of events that occurs during this process, as follows:\n\n*   **Read:** It reads\
    \ or takes in an input from the user.\n\n*   **Eval:** It evaluates the input.\n\
    \n*   **Print:** It prints or displays the output to the user.\n\n*   **Loop:**\
    \ It loops or repeats the process.\n\nThis shell interface is meant to be simple,\
    \ easy, and great for beginners to get the hang of programming on a computer.\n\
    \n### Opening the Python Shell\n\nThis task is much easier than it sounds. It\
    \ is basically a two-step process that can be accomplished in a flash.\n\n![../images/491271_1_En_5_Chapter/491271_1_En_5_Fig6_HTML.jpg](images/491271_1_En_5_Chapter/491271_1_En_5_Fig6_HTML.jpg)\n\
    \nFigure 5-6\n\nThe Mac OS Terminal\n\n1.  First, you need to open the command-line\
    \ interface of your operating system. For example, on Mac OS and Linux, it would\
    \ be the Terminal, while on Windows, it would be the command prompt. See Figure\
    \ [5-6](#491271_1_En_5_Chapter.xhtml#Fig6).\n\n1.  Next, in this interface, type\
    \ the following:\n\n    ```\n    python\n    ```\n\nHit the Enter key. This should\
    \ give the output shown in Figure [5-7](#491271_1_En_5_Chapter.xhtml#Fig7).\n\n\
    ![../images/491271_1_En_5_Chapter/491271_1_En_5_Fig7_HTML.jpg](images/491271_1_En_5_Chapter/491271_1_En_5_Fig7_HTML.jpg)\n\
    \nFigure 5-7\n\nThe Python shell\n\nWe are now in the Python REPL shell! This\
    \ is one of the simplest interfaces that we can use to program with Python. This\
    \ Python shell can now accept input as a Python command and execute it to display\
    \ the necessary output. Some simple examples are shown in Figure [5-8](#491271_1_En_5_Chapter.xhtml#Fig8),\
    \ where I have performed some single-digit arithmetic operations (addition and\
    \ subtraction).\n\n![../images/491271_1_En_5_Chapter/491271_1_En_5_Fig8_HTML.jpg](images/491271_1_En_5_Chapter/491271_1_En_5_Fig8_HTML.jpg)\n\
    \nFigure 5-8\n\nArithmetic operations in the Python shell\n\nWe can use the `help()`\
    \ command to explore different features within Python. To exit the Help window\
    \ and return to the Python shell, press q and then Enter. See Figure [5-9](#491271_1_En_5_Chapter.xhtml#Fig9).\n\
    \n![../images/491271_1_En_5_Chapter/491271_1_En_5_Fig9_HTML.jpg](images/491271_1_En_5_Chapter/491271_1_En_5_Fig9_HTML.jpg)\n\
    \nFigure 5-9\n\nThe Help window in Python\n\n### Exiting the Python Shell\n\n\
    Once we are done programming with Python, we will need to exit the Python programming\
    \ environment by closing the shell. We can do this by typing in the following\
    \ command:\n\n```\nexit()\n```\n\nThis exits the Python interactive shell and\
    \ returns back to the main command-line interface of the OS. The reason we use\
    \ the brackets at the end of the command is because we are calling the `exit`\
    \ function in order to exit from the shell. See Figure [5-10](#491271_1_En_5_Chapter.xhtml#Fig10).\n\
    \n![../images/491271_1_En_5_Chapter/491271_1_En_5_Fig10_HTML.jpg](images/491271_1_En_5_Chapter/491271_1_En_5_Fig10_HTML.jpg)\n\
    \nFigure 5-10\n\nExiting the Python shell\n\nThe keyboard shortcut for this step\
    \ is `ctrl+D` on Mac OS and Linux, and `ctrl+Z+Enter` on Windows."
  trans: "\n## Python 解释器\n\nPython 的一个关键特性在于它是一种解释型语言，而其他编程语言如 Java、C 和 C++ 都是编译型语言。\n\
    \n让我们来理解一下两者的区别。\n\n编译型语言会获取整个程序，并将其从机器码翻译成源代码，以获得所需的输出。因此，这类语言运行时速度更快，但无法跨平台。\n\
    \n解释型语言则通过逐行读取代码并直接执行来获得所需输出。因此，这类语言运行时速度稍慢，但可以跨平台。\n\n目前正在开发一些新技术来解决运行时速度慢的问题，例如“即时”编译器，它在程序执行期间进行编译，而不是在执行之前。\n\
    \n现在，当我们说 Python 是一种解释型语言时，并不意味着它完全不编译。Python 程序确实会经历编译过程，只是这个过程不会明确地展示给程序员。代码会被编译成字节码，这是原始代码的一种低级形式。然后，这个字节码由\
    \ Python 虚拟机执行。\n\n通过这种方式，Python 可以直接运行代码，不受特定平台的限制，并且在执行速度方面也不会太慢。\n\nPython\
    \ 可以使用多种类型的解释器来运行程序。让我们简要了解一下其中最常见的几种：\n\n1.  **CPython**：这是 Python 的默认实现。它是最常用的实现，因为它与\
    \ Python 包以及用 C 编写的扩展模块兼容性最好。它是 Python 的参考实现，这意味着所有不同版本的 Python 都是用 C 语言实现的。\n\
    \n2.  **Jython**（原名 JPython）：这是一种用 Java 和 Python 编写的 Python 实现。它将 Python 代码翻译成\
    \ Java 字节码，然后在 Java 虚拟机上执行。这使得 Python 代码能够在 Java 平台上运行。它还允许用户像使用 Python 模块一样使用\
    \ Java 类。\n\n3.  **IronPython**：这是一种为微软的 .NET 框架开发的 Python 实现。它既使用 Python 库，也使用\
    \ .NET 框架库。它还提供了一个交互式控制台和动态编译支持，以提高性能。\n\n4.  **PyPy**：这个 Python 实现是用 RPython\
    \ 编写的，RPython 是 Python 编程语言的一个子集。它使用即时编译器，因此运行时速度很快。它的目标是在增强性能的同时，最大限度地保持与 CPython\
    \ 的兼容性。\n\n5.  **Stackless Python**：与 CPython 一样，这个实现也是用 Python 和 C 编写的。它之所以得名，是因为它不依赖\
    \ C 调用来管理其栈。它在函数调用之间使用 C 栈，然后将其清除。它利用微线程，并支持任务序列化、微进程、通信通道等功能。\n\n6.  **MicroPython**：这是一个小巧、开源的\
    \ Python 实现，用 C 语言编写，兼容 Python 3。它允许我们编写简单的 Python 代码，而不是复杂的低级语言代码，并且可以在微控制器硬件上运行。它包含\
    \ Python 标准库中的一系列模块，以及一些 MicroPython 特有的额外库，可用于对电路板进行编程。\n\n现在我们已经了解了什么是解释器，接下来需要知道如何与它们交互。最通用的方法之一是使用所谓的\
    \ Python shell。\n\n## Python Shell\n\n在计算领域，shell 充当用户和解释器之间的媒介。借助 shell，程序员可以输入一些代码并接收必要的输出。Shell\
    \ 等待用户输入命令或一行代码，然后执行这段代码并显示获得的结果。\n\n它之所以被称为 shell，是因为它是操作系统的最外层。它可以根据特定操作的需求，为用户提供命令行界面（CLI）或图形用户界面（GUI）。\n\
    \nPython shell，或称 Python 交互式 shell，也叫做 Python REPL shell，它接收 Python 命令并执行，显示所需的结果。术语\
    \ *REPL* 是此过程中事件系统流程的首字母缩写，如下所示：\n\n*   **读取：** 它从用户那里读取或接收输入。\n*   **求值：** 它对输入进行求值。\n\
    *   **打印：** 它将输出打印或显示给用户。\n*   **循环：** 它循环或重复此过程。\n\n这个 shell 界面旨在简单、易用，非常适合初学者掌握计算机编程。\n\
    \n### 打开 Python Shell\n\n这个任务比听起来要容易得多。基本上是一个两步过程，可以瞬间完成。\n\n![../images/491271_1_En_5_Chapter/491271_1_En_5_Fig6_HTML.jpg](img/491271_1_En_5_Fig6_HTML.jpg)\n\
    \n图 5-6\n\nMac OS 终端\n\n1.  首先，你需要打开操作系统的命令行界面。例如，在 Mac OS 和 Linux 上是终端，而在 Windows\
    \ 上是命令提示符。参见图 5-6。\n\n2.  接下来，在此界面中，输入以下内容：\n\n    ```\n    python\n    ```\n\n\
    按下回车键。这应该会给出如图 5-7 所示的输出。\n\n![../images/491271_1_En_5_Chapter/491271_1_En_5_Fig7_HTML.jpg](img/491271_1_En_5_Fig7_HTML.jpg)\n\
    \n图 5-7\n\nPython shell\n\n我们现在进入了 Python REPL shell！这是我们可以用来进行 Python 编程的最简单的界面之一。这个\
    \ Python shell 现在可以接受 Python 命令作为输入，并执行它以显示必要的输出。图 5-8 展示了一些简单的例子，其中我执行了一些个位数的算术运算（加法和减法）。\n\
    \n![../images/491271_1_En_5_Chapter/491271_1_En_5_Fig8_HTML.jpg](img/491271_1_En_5_Fig8_HTML.jpg)\n\
    \n图 5-8\n\nPython shell 中的算术运算\n\n我们可以使用 `help()` 命令来探索 Python 中的不同功能。要退出帮助窗口并返回\
    \ Python shell，请按 q 键，然后按回车键。参见图 5-9。\n\n![../images/491271_1_En_5_Chapter/491271_1_En_5_Fig9_HTML.jpg](img/491271_1_En_5_Fig9_HTML.jpg)\n\
    \n图 5-9\n\nPython 中的帮助窗口\n\n### 退出 Python Shell\n\n完成 Python 编程后，我们需要通过关闭 shell\
    \ 来退出 Python 编程环境。我们可以通过输入以下命令来实现：\n\n```\nexit()\n```\n\n这会退出 Python 交互式 shell，并返回到操作系统的主命令行界面。我们在命令末尾使用括号的原因是我们正在调用\
    \ `exit` 函数以退出 shell。参见图 5-10。\n\n![../images/491271_1_En_5_Chapter/491271_1_En_5_Fig10_HTML.jpg](img/491271_1_En_5_Fig10_HTML.jpg)\n\
    \n图 5-10\n\n退出 Python shell\n\n此步骤的键盘快捷键在 Mac OS 和 Linux 上是 `ctrl+D`，在 Windows\
    \ 上是 `ctrl+Z+Enter`。\n"
- fmt: '# Summary


    In this chapter, we covered the fundamentals of Python as a programming language.
    We read about its origins, its characteristics, its importance in the machine
    learning world, and its competitors. We skimmed through some of its machine learning
    libraries, as well as its other non-ML applications, just to get a better idea
    of what it can do. We then learned how to install it onto our systems and set
    it up. We also had a look at some common Python interpreters that are used for
    programming, and we had a peek at the Python REPL shell.


    We must realize, however, that in order to use Python effectively for machine
    learning programming, the Python shell will not be of much use, since it is mainly
    meant for short commands and simple coding.


    We will thus need to set up a lucrative working environment in which we can enter
    and execute our Python code. Some popular applications that we can use for this
    are the Jupyter Notebook, PyCharm, Spyder, and IDLE. In this book, we will be
    using Jupyter Notebook for all our programming purposes.


    Jupyter Notebook has begun to gain more and more popularity due to its simplicity,
    ease of use, and accessibility. It makes large-scale programming and code distribution
    so much easier and quicker. It is also very easy to install, especially with the
    help of Anaconda.


    That said, let’s take a look at what Jupyter Notebook is and how it makes our
    coding experience better, especially when it comes to Python programming for data
    science and machine learning.


    ## Quick Links


    *   Learn more about Python: [`https://www.python.org/about/`](https://www.python.org/about/)

    *   Python vs. Other Programming Languages: [`https://www.python.org/doc/essays/comparisons/`](https://www.python.org/doc/essays/comparisons/)

    *   Python Documentation: [`https://www.python.org/doc/`](https://www.python.org/doc/)

    *   Python Events: [`https://www.python.org/events/python-events`](https://www.python.org/events/python-events)

    *   Learn more about Anaconda: [`anaconda.com/why-anaconda/`](http://anaconda.com/why-anaconda/)


    # Part II: The Jupyter Notebook


    In Part II, we will get ourselves acquainted with the Jupyter Notebook application.
    We will go through its setup, take a look at its features, and get hands-on experience
    in using this interface for Python programming.


    What to expect from this part:


    *   An introduction to the Jupyter Notebook application

    *   How to install and set up Jupyter Notebook

    *   Explore the features of Jupyter Notebook

    *   Learn how to use Jupyter Notebook

    *   Use Python programs with the help of Jupyter Notebook


    # 6. Introduction to Jupyter Notebook


    In the previous chapter, we learned about Python. We also had a glance at how
    we can use Python in its REPL shell to write our code. This Python shell, however,
    is not the most recommended tool to use when it comes to massive machine learning
    programming. This is why we have developed applications like Jupyter Notebook,
    which aid in such programming requirements.


    Jupyter Notebook is the brainchild of Project Jupyter, which is a non-profit organization
    founded by Fernando Pérez. It was created with the objective of developing open
    source software and providing services that allow multiple languages to interact
    with one another for effective computing.


    Jupyter Notebook is an open source web-based application that allows users to
    create, edit, run, and share their code with ease. This application gets its name
    from the main languages that it supports: Julia, Python, and R.


    To fully appreciate Jupyter Notebook, let us first take a look at what a “notebook”
    is with regard to programming.


    ## Understanding the Notebook Interface


    A computational notebook or a notebook interface, or quite simply a notebook,
    is used for literate programming, where we add a comprehensive explanation along
    with our program. It is a virtual notebook; i.e., it has a notebook-style GUI
    that provides a word processing software’s functionality, along with a kernel
    and a shell.


    ### A Brief History of the Notebook


    The notebook interface was first introduced around 1988, when Wolfram Mathematica
    1.0 was released on the Macintosh. This system allowed users to create and edit
    notebook interfaces through its front-end GUI.


    Then came Maple, released for Macintosh with version 4.3. It provided a GUI in
    the style of a notebook, which became a highly acclaimed interface for programming.


    As the notebook began to grow in demand, people soon began to adapt notebook-styled
    kernels and backends for other programming languages, such as Python, MATLAB,
    SQL, and so on. Thus, the computational notebook became quite popular among coders.


    ### Features of a Notebook


    The generic features of a notebook are as follows:


    1.  It allows us to add cells of code, which make debugging and programming easier.

    2.  It can be used to display visual representations of data.

    3.  It allows us to add text in between each cell, which makes it easier for the
    coder to explain the function of each line of code.

    4.  Items within a notebook can easily be rearranged for narrative purposes and
    better readability.

    5.  It can be used as a tool for live presentations.

    6.  It can be used to create interactive reports on collected data and analytical
    results.


    ### Commonly Used Notebooks


    Some commonly used open-source notebooks include the following:


    1.  Jupyter Notebook

    2.  IPython

    3.  Apache Spark Notebook

    4.  Apache Zeppelin

    5.  JupyterLab

    6.  R Markdown


    ## An Overview of Jupyter Notebook


    As mentioned before, Jupyter Notebook is a web-based application developed by
    Project Jupyter. Its aim is to enable users to, as stated on the official website,
    “create and share documents that contain live code, equations, visualizations
    and narrative text.”


    Jupyter Notebook was developed in 2014 as a spin-off of the original IPython,
    which is a command shell used to carry out interactive coding. With the release
    of Jupyter Notebook, IPython found itself competing with it, to an extent. It
    still remained as a kernel for Jupyter and as a shell for Python, but everything
    else came under Jupyter Notebook.


    **Fun Fact:** Jupyter Notebook was originally known as IPython Notebook, since
    it was conceived from IPython.


    The official website of Project Jupyter states that Jupyter Notebook can support
    over forty programming languages. Each project is stored as a notebook consisting
    of several cells of code, graphs, texts, and equations, which can be altered easily.
    These notebooks can also be conveniently distributed to others.


    ### Features of Jupyter Notebook


    Apart from the generic characteristics of a computational notebook, Jupyter Notebook
    has the following key features:


    1.  Each Jupyter Notebook is a JSON document. JSON is a language-independent data
    format that is derived from JavaScript. It uses human-readable text to transmit
    data containing arrays or attribute–value pairs.

    2.  Each Jupyter Notebook is usually saved with a `.ipynb` extension.

    3.  Jupyter Notebook is similar in style to other interfaces that originated years
    before it, including Maple and Mathematica (from the 1980s) and SageMath (from
    the 2000s).

    4.  Jupyter Notebook was released under the modified BSD license, which provides
    users with minimum limitations in the usage and distribution of the software.

    5.  Jupyter Notebooks can easily be shared with others through email, Dropbox,
    GitHub, and the Jupyter Notebook Viewer.

    6.  Jupyter Notebook is, at present, completely free to use, and it is intended
    to remain free for anyone to use at any time.'
