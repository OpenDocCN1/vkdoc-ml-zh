- fmt: '# Placeholders in TensorFlow


    That’s about it for placeholders! In this way, placeholders can be used to allocate
    an area of the graph to some value that will be fed into the program later on.
    It is mainly useful for when certain characteristics of the data are unknown to
    the programmer at the beginning of the program. For example, the programmer may
    not know the quantity of data that she or he will be using.


    That was quite interesting, wasn’t it? You can play around with variables, constants,
    and placeholders as well. Have a go at using them to write some small pieces of
    code, and see what you come up with.


    In the next program, we will have a look at the architecture of computational
    graphs in TensorFlow.


    ## Program 3: Operations in a Computational Graph


    So far, we’ve learned that TensorFlow works with the help of a computational graph.
    This graph consists of all the variables that we declare, all the operations that
    we carry out, and so on. It basically works behind the scenes of a program. In
    TensorFlow, every node of the graph is known as an operation, even if it is just
    a command that initializes a variable.


    We will begin by acquiring the “default graph,” like this:


    ```

    graph = tf.get_default_graph()

    ```


    Now, let’s try to retrieve the operations from within this graph:


    ```

    graph.get_operations()

    ```


    We will get an output like this:


    ```

    [ ]

    ```


    This is because we’ve not carried out any operations yet, so the graph has nothing
    to display.


    We will now begin adding some nodes to this graph. Let us use some of the simple
    commands we have learned so far, like the following:


    * Creating a constant `a`

    * Creating another constant `b`

    * Finding the sum of `a` and `b` as `c`

    * Finding the product of `c` and a constant as `d`


    We can do this as shown:


    ```

    a = tf.constant(300, name = "a")

    b = tf.constant(65, name = "b")

    c = tf.add(a, b, name = "c")

    d = tf.multiply(c, 10, name = "d")

    ```


    In each line, `name` is used just for visualization to help us understand the
    concept of the computational graph. We can give each node any other name as well,
    but we have assigned our names to avoid confusion and to facilitate better understanding.


    Let us now see how our graph looks by entering the following two lines to get
    the operations from it:


    ```

    operations = graph.get_operations()

    operations

    ```


    Executing this gives us the result shown in Figure [9-1](#491271_1_En_9_Chapter.xhtml#Fig1).


    ![../images/491271_1_En_9_Chapter/491271_1_En_9_Fig1_HTML.jpg](images/491271_1_En_9_Chapter/491271_1_En_9_Fig1_HTML.jpg)


    **Figure 9-1** Operations within a computational graph


    This shows us the number of nodes present in our graph. We had entered four different
    nodes, which are displayed here along with their names (`a`, `b`, `c`, and `d`)
    and their types (constant, constant, addition, multiplication, respectively).
    Let’s add another node `e` to this:


    ```

    e = tf.multiply(a, 8, name = "e")

    operations = graph.get_operations()

    operations

    ```


    If we execute `operations`, we find that the number of nodes has increased by
    one, and this extra node is shown along with its name `e`, and its type `Mul`,
    as shown in Figure [9-2](#491271_1_En_9_Chapter.xhtml#Fig2).


    ![../images/491271_1_En_9_Chapter/491271_1_En_9_Fig2_HTML.jpg](images/491271_1_En_9_Chapter/491271_1_En_9_Fig2_HTML.jpg)


    **Figure 9-2** Added Operation within the computational graph


    We can now run any or all of these nodes in a session, as shown below. As you
    can see, we have executed node `a` and node `e`:


    ```

    sess = tf.Session()

    with tf.Session() as sess:

    result = sess.run(a, e)

    print result

    ```


    Here, we have run the session within a `with` block. This is a method that is
    used quite often, especially when multiple sessions are required. Instead of declaring
    the `sess` variable separately, and then typing the `sess.run()` command several
    times, we can just complete the entire process within a single loop.


    Thus, we can see how the computational graph works. Of course, we won’t necessarily
    need to develop this kind of program, especially in machine learning. However,
    in order to grasp the concept of graphs in TensorFlow, it is good to go through
    this.


    ## Program 4: Taking Inputs from a User for a Placeholder


    This type of program is especially good to know when it comes to creating a model
    to analyze data. This is because when we, as the developers, are creating our
    program, we don’t really know what kind of data is going to be submitted by the
    user. However, we need to make sure that our program can take the user’s input,
    perform the necessary calculations on it, and then produce the required output.


    In this program, we first create two placeholders, `a` and `b`. We then declare
    that `c` is equal to some value in the form of an equation that requires `a` and
    `b`. After that, we say that `A` will be the variable name of the input that is
    to be assigned to `a`, and `B` will be the variable name of the input that is
    to be assigned to `b`. Finally, we create a dictionary `d` in which `a` acquires
    its value from `A` and `b` acquires its value from `B`. We then run the session
    to find the value of `c`.


    This will all make a lot more sense once we actually type in and execute the code.
    That said, let us begin with the program:


    ```

    a = tf.placeholder(tf.float32)

    b = tf.placeholder(tf.float32)

    c = (a*2) + b + 10

    A = input("Enter a value for a: ")

    B = input("Enter a value for b: ")

    d = {a:A, b:B}

    with tf.Session() as sess:

    result = sess.run(c, feed_dict = d)

    print result

    ```


    Now when we execute this entire program, we will get the option to submit a value
    for `A` and `B`. These values are fed into the program and computed, and then
    the result of the equation is displayed.


    ### Task Time


    Keep executing this program to change the values of `a` and `b`, and see how the
    value of `c` changes accordingly. Try altering the equation for `c` as well, and
    see what happens.


    ## Closing the Session


    When I was new to using the TensorFlow library, I would practice running different
    kinds of code, just to get more comfortable with it. This meant that I would open
    several sessions in a day to execute the various commands. It was only later,
    however, that I learned the importance of closing a session.


    We close sessions in TensorFlow mainly to free up resources and to reduce the
    unnecessary use of computational power. We use the following command to do so:


    ```

    sess.close()

    ```


    This tells the system that our session is over, so it no longer needs to compute
    anything. If we run our session inside a `with` block, however, we need not worry
    about having to add this extra line, as the session closes on its own once it
    reaches the end of the block.


    And with that, we have covered some of the basics of programming with TensorFlow
    1.0!


    ## Summary


    As we programmed, we perhaps noticed that some parts of the code seemed a little,
    well, unnecessary, right? For example, we need to keep opening (and then closing)
    sessions. Or, we need to initialize our variables before we can use them. Well,
    we can’t blame the developers of TensorFlow—they did a pretty good job with creating
    the library in the first place. But soon even they realized that the library can
    be improved a little more to make the task of coding with TensorFlow even more
    simple for programmers.


    So, what did they do? They came up with TensorFlow 2.0. This new version consists
    of updates and changes that took all the issues and inconveniences of the parent
    version into account. Let’s dive a little deeper into this version of the library
    and see how TensorFlow 2.0 makes machine learning faster and easier.'
