    程序员必须构建一个图并在会话中运行他们的代码行。\n\nKeras 的引入\nTensorFlow 将 Keras API 实现为一个强大的\n工具，可用于模型构建。它支持即时执行\n\
    以及 TensorFlow 的其他几项功能。它用途广泛、\n可靠且高效。正是因为这个原因，它被添加到了 TensorFlow 2.0 中。\nKeras 曾经是一个独立的包，用户需要\n\
    单独下载并在他们的模型中使用。慢慢地，\nTensorFlow 将其作为 `tf.keras` 添加到了其框架中。这个 `tf.keras` 子包\n与主\
    \ Keras 包不同，以确保兼容性和\n稳定性。后来，随着 TensorFlow 2.0 的发布，\nTensorFlow 团队表示 Keras 将成为该版本的\n\
    主要高级 API。\n\nAPI 清理\nTensorFlow 拥有大量适用于多种不同编程语言的 API（应用程序\n编程接口），可以在代码中使用。这些 API\
    \ 是一组工具、\n实用程序和系统化程序，当在程序中调用时会执行特定操作。\n其中一些 API 被认为已弃用——它们对程序员来说似乎\n不太有用。其他 API\
    \ 似乎具有相似的功能和特性。因此，在开发 TensorFlow\n2.0 时，团队决定对这一部分进行一些清理。\n许多 API 因此要么被移除、替换，要么被归并到\n\
    一个子包下。\n\n移除全局变量\n在 TensorFlow 的先前版本中，变量需要在会话中使用之前\n进行初始化。这是通过\n`tf.global_variables_initializer()`\n\
    函数完成的，该函数会设置一个操作来并行初始化代码中声明的所有变量。\n\n你可能还记得在上一章中做过这个，我们输入了\n这样一行代码：\n\n```\ninit_ops\
    \ = tf.global_variables_initializer\n```\n\n之后，我们打开了一个新会话，`运行了 init_ops`，然后\n\
    继续运行其余的变量。\n在 TensorFlow 2.0 中，所有用于跟踪变量的命名空间和机制\n都已被移除。变量在运行之前\n不再需要初始化。它们可以在需要时直接使用。\n\
    \n更好的部署能力\nTensorFlow 一直为用户提供跨多个平台和语言工作的能力，\n以便轻松开发和训练模型。TensorFlow 2.0 为此带来了更好的兼容性和稳定性。\n\
    \n一个经过充分训练和保存的模型可以直接集成到\n我们正在开发的应用程序中，或者借助一些重要的库进行部署，\n包括以下内容：\n\n*   **TensorFlow\
    \ Serving**，它使我们能够\n    通过 HTTP/REST 或 gRPC/Protocol Buffers 实现模型。\n\n*   **TensorFlow\
    \ Lite**，它使我们能够\n    为移动设备（如 Android 或 iOS）和嵌入式系统（如\n    Raspberry Pi）实现模型。\n\n\
    *   **TensorFlow.js**，它使我们能够\n    为 JavaScript 环境实现模型。\n\n*   **此外**，TensorFlow\
    \ 还支持\n    其他编程语言，如 C、Java、Julia 等。\n\n强大的实验工具\n研究人员可以借助 TensorFlow 2.0 轻松进行实验，\n\
    它允许他们在不牺牲速度和效率的情况下实现自己的想法。\n我们已经了解到 Keras 已被添加为 TensorFlow 的核心高级\nAPI。添加 Keras\
    \ 和类似的 API 是为了使模型构建、改进和训练的过程\n更快、更好。实际上，低级 API 和高级 API 协同工作以实现\n更高的效率。\n控制梯度操作也更容易。还添加了一些扩展\n\
    来增强该库的研究能力。\n\n提高生产力\nTensorFlow 最初之所以声名鹊起，是因为它有效地帮助了机器学习开发者\n并提高了他们的生产力。它的特性和功能极大地\n\
    造福了程序员。它节省了他们的时间，减少了他们的精力，\n同时帮助他们取得更多成就。\nTensorFlow 2.0 在此基础上进行了升级，进一步提高了生产力。它提供了直观的调试、即时\n\
    计算、可扩展性和简洁性。它相对也更容易\n学习，尤其是对于初学者来说。\nTensorFlow 2.0 无疑是对其前身的一次强大、实质性且稳健的\n升级。然而，考虑到经验丰富的人工智能爱好者\n\
    已经使用 TensorFlow 1.0 很长时间了，过渡到\n新版本确实带来了许多挑战。\n一些人一直在争论 TensorFlow 2.0 究竟是福还是\n\
    祸。虽然他们同意升级有其好处，但他们也\n承认人们适应它并不那么容易，\n特别是如果他们已经构建了可用的机器学习模型。\n此外，适应新的语法可能会成为一个轻微的障碍，\n\
    人们可能会觉得这没有必要。\n\n让我们看看表 10-1，其中列出了\n一些被认为是 TensorFlow 2.0 优缺点的论点。\n\n表 10-1\n\
    TensorFlow 2.0 优缺点\n\n优点 |\n 缺点 |\n\n| --- | --- | --- | --- | --- |\n"
- fmt: '# TensorFlow 2.0 与 1.0 对比


    ## 概述


    与 TensorFlow 1.0 相比，TensorFlow 2.0 因其流畅的流程和简化的结构而更容易学习。因此，对 TensorFlow 库完全陌生的人会发现自己很快就能学会它。而已掌握
    TensorFlow 1.0 的用户则需要先“遗忘”旧知识，才能理解并有效使用 TensorFlow 2.0。


    TensorFlow 2.0 与常规 Python 编程语言非常相似。这意味着 Python 开发者无需担心学习太多额外的命令就能使用 TensorFlow
    进行编程。任何使用 TensorFlow 1.0 编写的包含会话（session）的代码，在 TensorFlow 2.0 中都无法顺利运行，只能在旧版本中执行。


    由于许多 API 已被整合，大部分使用高级 API（如 Keras）的代码无需修改即可继续工作。如果代码需要在 2.0 中运行，则必须手动重写，或使用库提供的升级工具进行转换。


    尽管存在这些争议，但我们知道需要为变革留出空间，尤其是当变革是为了更好的发展时。缺点虽然存在，但对程序员来说并不构成显著的不利因素，它们只是可以轻松解决的小麻烦。


    ## 代码对比


    到目前为止，我们只阅读了关于 TensorFlow 2.0 各种特性的介绍。一旦我们开始实际编程，其功能将更有意义。如前所述，这两个版本在代码编写方式上有所不同。在本节中，我们将比较这两个版本，看看代码有何不同。


    我们主要讨论五个存在显著差异的方面：


    1.  `tf.print()` 函数

    2.  惰性执行 vs. 即时执行

    3.  移除 `tf.global_variables_initializer()`

    4.  无占位符

    5.  `@tf.function` 装饰器


    针对每个方面，我们还将看一些小例子。通过这种方式，我们应该能够清楚地了解每个版本的编程风格有何不同。


    ## `tf.print()` 函数


    TensorFlow 2.0 引入了一个与常规 Python 中 `print` 命令非常相似的命令。在 TensorFlow 2.0 中，我们可以使用 `tf.print()`
    函数在一行代码中显示我们选择的任何语句或字符。


    其用法如下：


    ```

    tf.print(  )

    ```


    ### TensorFlow 1.0


    在 TensorFlow 1.0 中，打印任何内容都不那么容易。它需要一些额外的步骤，如下所示：


    ```

    import tensorflow as tf

    h = tf.constant("This is a TensorFlow 1.0 program")

    sess = tf.Session()

    print(sess.run(h))

    sess.close()

    ```


    看到了吗？我们必须声明 `h`，说明它等于给定的常量（即我们要打印的句子），打开一个会话，在该会话中运行 `h`，打印它，然后关闭会话。那么 TensorFlow
    2.0 呢？


    ### TensorFlow 2.0


    ```

    import tensorflow as tf

    h = tf.constant("This is a TensorFlow 2.0 program")

    tf.print(h)

    ```


    事实上，让我们更进一步，让它更简单：


    ```

    import tensorflow as tf

    tf.print("This is a TensorFlow 2.0 program")

    ```


    看到了吗？多么快捷！因此，在 TensorFlow 1.0 中，程序要求我们将字符串声明为常量，创建会话，然后在会话中执行它以打印出字符串。然而，在 TensorFlow
    2.0 中，我们只需要为字符串定义一个变量，然后输入 `tf.print()` 命令，它就会显示输出。我们甚至可以直接打印出我们想要的内容，而无需为其分配变量名。


    这就是 TensorFlow 2.0 的即时执行与 TensorFlow 1.0 的惰性执行的不同之处。接下来我们将更详细地观察这一点。


    ## 惰性执行 vs. 即时执行


    TensorFlow 1.0 采用惰性执行。它不会立即执行代码。相反，它会等待图的特定节点在会话内被执行，然后才会运行。


    下面是一个示例，其中我们有一段代码用于打印“Hello There”，计算 90 和 7 的和，并显示一个声明为 300 的变量的值。


    ### TensorFlow 1.0


    ```

    import tensorflow as tf

    a = tf.constant("Hello There")

    b = 9+70

    c = tf.Variable(300)

    init_op = tf.global_variables_initializer()

    sess = tf.Session()

    print(sess.run(init_op))

    print(sess.run(a))

    print(sess.run(b))

    print(sess.run(c))

    ```


    ### TensorFlow 2.0


    在 TensorFlow 2.0 中，惰性执行被即时执行所取代。这意味着代码现在直接执行。无需先构建计算图，然后在会话中运行每个节点。每一行代码都会立即执行。


    我们可以在这里看到，使用 TensorFlow 2.0 编写相同的代码：


    ```

    import tensorflow as tf

    a = tf.constant("Hello There")

    b = 9+70

    c = tf.Variable(300)

    tf.print(a)

    tf.print(b)

    tf.print(c)

    ```


    如您所见，第一组代码采用惰性执行方式，使用了分布式图，而第二组代码则没有。它采用了即时执行方式。第二段代码也比第一段代码更短，因为它没有那么多步骤。


    ## 移除 `tf.global_variables_initializer()`


    仔细看看我们刚才看到的程序。我提到我们跳过了一些步骤，对吗？其中一个步骤是添加 `tf.global_variables_initializer()` 函数，我们根本没有使用它。


    原因在于，如前所述，在 TensorFlow 2.0 中我们不需要初始化变量。定义变量后，我们可以直接在程序中使用它们。


    为了更清楚地了解，让我们看一段在 TensorFlow 1.0 中声明变量并显示它的代码。


    ### TensorFlow 1.0


    ```

    import tensorflow as tf

    v = tf.Variable(8)

    init_op = tf.global_variables_initializer()

    sess = tf.Session()

    sess.run(init_op)

    print(sess.run(v))

    ```


    很简单，对吧？现在，让我们看看用 TensorFlow 2.0 编写的相同代码。


    ### TensorFlow 2.0


    ```

    import tensorflow as tf

    v = tf.Variable(8)

    tf.print(v)

    ```


    输出相同，但过程短得多。事实上，代码行数减少了一半。而且，在这里，我们不必初始化变量 `v`。我们能够直接为其赋值。


    说到变量，还记得在之前的章节中，我们学习了另一个叫做占位符的概念吗？TensorFlow 团队决定在升级中不再保留占位符，因此他们移除了它们。我们将在下一节中阅读更多相关内容。


    ## 无占位符


    我们已经知道，占位符只不过是一个变量，我们可以在程序的后期阶段为其赋值。这意味着，与变量不同，占位符不需要初始值。在 TensorFlow 1.0 中，占位符的使用是该版本惰性执行风格的结果，正如我们可能从上一章的程序中记得的那样。然而，随着
    TensorFlow 2.0 的即时执行，不再需要占位符。这是因为操作被创建后立即被评估。


    作为对 TensorFlow 1.0 中如何使用占位符的快速回顾，我们将通过一个小例子来了解。让我们考虑一个程序，其中我们声明一个常量 `a`，一个占位符
    `b`，以及一个由 `a` 和 `b` 组成的方程 `c`。然后我们使用 `feed_dict` 命令将数字 3 赋值给占位符 `b`。最后，将 `a` 和
    `b` 的值输入 `c` 以获得方程的结果。


    ### TensorFlow 1.0


    ```

    import tensorflow as tf

    a = tf.constant(5)

    b = tf.placeholder(tf.float32)

    c = a*b

    sess = tf.Session()

    sess.run(print(c, feed_dict = {b : 3})

    sess.close()

    ```'
