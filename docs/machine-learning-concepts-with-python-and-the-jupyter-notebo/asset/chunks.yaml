- fmt: '# Clearing the Current Output


    To clear the output of the selected cell, click on the `Cell` option from the
    menu bar. Then, hover your cursor over `Current Outputs` in the drop-down menu,
    and in the sub-menu click on `Clear`, as shown in Figure [7-29](#491271_1_En_7_Chapter.xhtml#Fig29).


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig29_HTML.jpg](images/491271_1_En_7_Chapter/491271_1_En_7_Fig29_HTML.jpg)


    Figure 7-29


    Clearing the current output using the drop-down menu option


    # Clearing All Outputs


    To clear all the outputs in the notebook, click on the `Cell` option from the
    menu bar. Then, just like before, hover the cursor over the `All Output` option
    from the drop-down menu, and in the sub-menu click on `Clear`, as shown in Figure
    [7-30](#491271_1_En_7_Chapter.xhtml#Fig30).


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig30_HTML.jpg](images/491271_1_En_7_Chapter/491271_1_En_7_Fig30_HTML.jpg)


    Figure 7-30


    Clearing all outputs using the drop-down menu option


    # Restarting the Kernel


    Sometimes, our program requires us to restart the kernel in order to get the desired
    output. It is similar to refreshing a page on our web browser. When we restart
    a kernel, we lose all the data stored in the variables.


    To do this, first click on `Kernel` from the menu bar, then click on `Restart`,
    as shown in Figure [7-31](#491271_1_En_7_Chapter.xhtml#Fig31).


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig31_HTML.jpg](images/491271_1_En_7_Chapter/491271_1_En_7_Fig31_HTML.jpg)


    Figure 7-31


    Restarting the kernel using the drop-down menu option


    Here, we find that the kernel restarts, but the previous outputs of each cell
    execution are still displayed. If we don’t want the outputs to remain, we will
    need to restart the kernel and also clear the outputs. We have the option of doing
    this in a single step, rather than in two steps.


    # Restarting the Kernel and Clearing the Output


    To simultaneously restart the kernel and clear the output, click on `Kernel` from
    the menu bar, followed by `Restart & Clear Output`, as shown in Figure [7-32](#491271_1_En_7_Chapter.xhtml#Fig32).


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig32_HTML.jpg](images/491271_1_En_7_Chapter/491271_1_En_7_Fig32_HTML.jpg)


    Figure 7-32


    Restarting the kernel and clearing the output using the drop-down menu option


    # Interrupting the Kernel


    I have found this feature to be extremely useful, mainly for machine learning.
    Sometimes, while our machine learning program is running, we may suddenly decide
    that we want to stop the process and start over. This could be due to an error
    that we suddenly find in the code, a decision to change certain variables, and
    so on. In such cases, all we need to do is interrupt the kernel by clicking on
    the `Kernel` option in the menu bar, followed by `Interrupt` in the drop-down
    menu, as shown in Figure [7-33](#491271_1_En_7_Chapter.xhtml#Fig33).


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig33_HTML.jpg](images/491271_1_En_7_Chapter/491271_1_En_7_Fig33_HTML.jpg)


    Figure 7-33


    Interrupting the kernel using the option from the drop-down menu


    # The Help Menu


    If we need any extra help regarding the general Jupyter Notebook UI, the keyboard
    shortcuts that we can use, and some of the machine learning libraries that are
    frequently used with Python, we can access the Help menu from the menu bar. A
    drop-down menu will open, as shown in Figure [7-34](#491271_1_En_7_Chapter.xhtml#Fig34).


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig34_HTML.jpg](images/491271_1_En_7_Chapter/491271_1_En_7_Fig34_HTML.jpg)


    Figure 7-34


    Accessing the Help menu


    From this menu, we can select the option that we need help with. As you can see,
    the help options include topics related to the Jupyter Notebook application, as
    well as to Python libraries.


    # Summary


    Well, there we go! We are now a lot more familiar with the user interface of Jupyter
    Notebook. We have also had a run-through of some important concepts related to
    programming, and we have seen how to code basic functions, like lists and loops,
    using Python.


    With that under our belts, it’s finally time to get the ball rolling as we step
    into Python’s machine learning libraries. We have already read about how Python
    has a vast selection of libraries that can be called into a program. Moving ahead,
    we will be focusing our attention on one such library that has become increasingly
    sought after. Over the years, it has gained the approval of several developers
    due to its unique features, which make the process of machine learning much more
    effortless. This library is none other than TensorFlow, which, in the coming chapters,
    we will be using to program our deep learning models.


    # Part III: The TensorFlow Library


    In Part III, we will dive into the TensorFlow library. Starting with an introduction
    to this widely used deep learning package, we will make our way towards its initial
    version that has been in use since its release. We will then get into TensorFlow
    2.0, its distinguishing features, and a quick guide on how to migrate code from
    the previous version to the new version. The final chapter will lead us through
    a couple of deep learning programs with which we will use TensorFlow in Python
    and the Jupyter Notebook interface. This will help us to put into practice all
    that we have learned throughout the book.


    What to expect from this part:


    - An introduction to the TensorFlow Library so far

    - Program with the TensorFlow Library (version 1.0)

    - An introduction to TensorFlow 2.0

    - Migrating from TensorFlow 1.0 to TensorFlow 2.0

    - Using TensorFlow to develop machine learning models (focusing on deep learning
    neural networks)


    # 8. The TensorFlow Machine Learning Library


    To recap what was stated in an earlier chapter, Python has a huge variety of machine
    learning libraries that can be implemented in a program. These libraries serve
    various purposes—mathematical, scientific, graphical, and so on. Depending on
    the nature and the need of the program we are developing, we can call these libraries
    into our program.


    We know that machine learning involves data science techniques (like cleaning,
    manipulating, and visualizing data), mathematical techniques, and statistical
    techniques. Keeping this in mind, some of the most commonly used Python libraries
    for machine learning include `Matplotlib`, `Seaborn`, `Pandas`, `Scikit-learn`,
    `Numpy`, `Scipy`, and so on.


    These libraries have been tried and tested and were found to be easy to work with.
    They have thus gained popularity over the years, with numerous applications in
    various machine learning programs.


    With the growing enthusiasm toward deep learning, there arose a need to create
    libraries that could assist with building multi-layered neural networks. Thus,
    libraries like `Theano`, `Pytorch`, `Caffe`, `Keras`, and `TensorFlow` were released.
    These libraries enable programmers to develop large, multi-layered neural networks
    with less time and effort, and more efficiency.


    In this chapter, we will explore the TensorFlow library to get an overview of
    what it is, why it was developed, and how it has proved useful in the realm of
    artificial intelligence. We will then see how to install it on our system.'
