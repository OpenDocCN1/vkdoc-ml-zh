    ## 清除当前输出


    要清除所选单元格的输出，请点击菜单栏中的“Cell”选项。然后，将光标悬停在下拉菜单中的“Current Outputs”上，并在子菜单中点击“Clear”，如图
    7-29 所示。


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig29_HTML.jpg](img/491271_1_En_7_Fig29_HTML.jpg)


    图 7-29


    使用下拉菜单选项清除当前输出


    ## 清除所有输出


    要清除笔记本中的所有输出，请点击菜单栏中的“Cell”选项。然后，与之前类似，将光标悬停在下拉菜单中的“All Output”选项上，并在子菜单中点击“Clear”，如图
    7-30 所示。


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig30_HTML.jpg](img/491271_1_En_7_Fig30_HTML.jpg)


    图 7-30


    使用下拉菜单选项清除所有输出


    ## 重启内核


    有时，我们的程序需要重启内核才能获得期望的输出。这类似于在网页浏览器中刷新页面。当我们重启内核时，会丢失所有存储在变量中的数据。


    要执行此操作，首先点击菜单栏中的“Kernel”，然后点击“Restart”，如图 7-31 所示。


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig31_HTML.jpg](img/491271_1_En_7_Fig31_HTML.jpg)


    图 7-31


    使用下拉菜单选项重启内核


    这里我们发现内核重启了，但之前每个单元格执行的输出仍然显示。如果我们不希望保留这些输出，就需要重启内核并同时清除输出。我们可以一步完成此操作，而不是分两步进行。


    ## 重启内核并清除输出


    要同时重启内核并清除输出，请点击菜单栏中的“Kernel”，然后点击“Restart & Clear Output”，如图 7-32 所示。


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig32_HTML.jpg](img/491271_1_En_7_Fig32_HTML.jpg)


    图 7-32


    使用下拉菜单选项重启内核并清除输出


    ## 中断内核


    我发现这个功能非常有用，尤其是在机器学习中。有时，当我们的机器学习程序正在运行时，我们可能突然决定要停止进程并重新开始。这可能是由于我们突然在代码中发现错误、决定更改某些变量等原因。在这种情况下，我们只需通过点击菜单栏中的“Kernel”选项，然后在下拉菜单中点击“Interrupt”来中断内核，如图
    7-33 所示。


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig33_HTML.jpg](img/491271_1_En_7_Fig33_HTML.jpg)


    图 7-33


    使用下拉菜单中的选项中断内核


    ## 帮助菜单


    如果我们需要关于常规 Jupyter Notebook 用户界面、可用的键盘快捷键以及一些经常与 Python 一起使用的机器学习库的额外帮助，我们可以从菜单栏访问“Help”菜单。此时会打开一个下拉菜单，如图
    7-34 所示。


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig34_HTML.jpg](img/491271_1_En_7_Fig34_HTML.jpg)


    图 7-34


    访问帮助菜单


    从这个菜单中，我们可以选择需要帮助的选项。如您所见，帮助选项包括与 Jupyter Notebook 应用程序相关的主题，以及与 Python 库相关的主题。


    ## 总结


    好了，就是这样！现在我们对 Jupyter Notebook 的用户界面熟悉多了。我们还快速了解了一些与编程相关的重要概念，并学习了如何使用 Python
    编写基本函数，例如列表和循环。


    掌握了这些知识后，我们终于可以开始进入 Python 的机器学习库了。我们已经了解到 Python 拥有大量可以调用到程序中的库。接下来，我们将重点关注一个越来越受欢迎的库。多年来，它因其独特的功能而获得了众多开发者的认可，这些功能使得机器学习过程变得更加轻松。这个库就是
    TensorFlow，在接下来的章节中，我们将使用它来编写我们的深度学习模型。


    # 第三部分 TensorFlow 库


    TensorFlow 库


    在第三部分中，我们将深入探讨 TensorFlow 库。从介绍这个广泛使用的深度学习包开始，我们将逐步了解自发布以来一直在使用的初始版本。然后，我们将进入
    TensorFlow 2.0，了解其显著特性，以及如何将代码从旧版本迁移到新版本的快速指南。最后一章将引导我们完成几个深度学习程序，在这些程序中，我们将使用
    Python 和 Jupyter Notebook 界面中的 TensorFlow。这将帮助我们实践本书中学到的所有知识。


    本部分内容预览：


    *   迄今为止对 TensorFlow 库的介绍


    *   使用 TensorFlow 库（1.0 版本）编程


    *   TensorFlow 2.0 简介


    *   从 TensorFlow 1.0 迁移到 TensorFlow 2.0


    *   使用 TensorFlow 开发机器学习模型（重点在于深度学习神经网络）


    # 8. TensorFlow 机器学习库


    回顾前面章节所述，Python 拥有大量可以在程序中实现的机器学习库。这些库服务于各种目的——数学、科学、图形等。根据我们正在开发的程序的性质和需求，我们可以将这些库调用到我们的程序中。


    我们知道机器学习涉及数据科学技术（如数据清洗、处理和可视化）、数学技术和统计技术。考虑到这一点，一些最常用的 Python 机器学习库包括 Matplotlib、Seaborn、Pandas、Scikit-learn、Numpy、Scipy
    等。


    这些库已经过反复测试和验证，并且易于使用。因此，它们多年来广受欢迎，在各种机器学习程序中有着众多应用。


    随着对深度学习的热情日益高涨，人们需要创建能够帮助构建多层神经网络的库。因此，Theano、Pytorch、Caffe、Keras 和 TensorFlow
    等库相继发布。这些库使程序员能够以更少的时间和精力、更高的效率开发大型多层神经网络。


    在本章中，我们将探索 TensorFlow 库，以全面了解它是什么、为什么被开发，以及它如何在人工智能领域证明其价值。然后，我们将了解如何在我们的系统上安装它。

