    \n5.  **Run All Above:** This runs all the cells that are above the selected cell.\n\
    \n6.  **Run All Below:** This runs all the cells that are below the selected cell.\n\
    \n7.  **Cell Type:** This allows us to select the type of cell you require.\n\n\
    8.  **Current Outputs:** This gives us the option to either Toggle, Toggle Scrolling,\
    \ or Clear the selected output.\n\n9.  **All Output** **:** This gives us the\
    \ option to either Toggle, Toggle Scrolling, or Clear all the output in the notebook.\n\
    \n![../images/491271_1_En_6_Chapter/491271_1_En_6_Fig17_HTML.jpg](images/491271_1_En_6_Chapter/491271_1_En_6_Fig17_HTML.jpg)\n\
    \nFigure 6-17\n\nCell drop-down menu"
  trans: "\n## Jupyter Notebook 内部\n\n要创建一个新的 Jupyter Notebook，我们只需在仪表板上点击“新建”，然后选择我们想要的内核。这里，我们选择“Python\
    \ 3”内核，如图 6-8 所示。\n\n![../images/491271_1_En_6_Chapter/491271_1_En_6_Fig8_HTML.jpg](img/491271_1_En_6_Fig8_HTML.jpg)\n\
    \n图 6-8\n\n使用 Python 3 内核打开一个新的 Jupyter Notebook\n\n我们将获得一个带有笔记本用户界面的新标签页，如图 6-9\
    \ 所示。\n\n![../images/491271_1_En_6_Chapter/491271_1_En_6_Fig9_HTML.jpg](img/491271_1_En_6_Fig9_HTML.jpg)\n\
    \n图 6-9\n\n一个新的笔记本\n\n笔记本的用户界面也相当直观。不过，和之前一样，我们将快速浏览一下它的所有主要功能。\n\n1.  顶部显示的是笔记本的标题。它最初显示为“无标题”，当我们点击它时，可以根据自己的偏好更改名称，如图\
    \ 6-10 所示。\n\n    ![../images/491271_1_En_6_Chapter/491271_1_En_6_Fig10_HTML.jpg](img/491271_1_En_6_Fig10_HTML.jpg)\n\
    \n    图 6-10\n\n    重命名笔记本\n\n2.  在笔记本标题旁边，我们会看到“最后检查点”及其时间。这表示笔记本上次自动保存的时间。\n\
    \n3.  下方是菜单栏，包含一系列下拉菜单，如图 6-11 所示。\n\n    ![../images/491271_1_En_6_Chapter/491271_1_En_6_Fig11_HTML.jpg](img/491271_1_En_6_Fig11_HTML.jpg)\n\
    \n    图 6-11\n\n    菜单栏\n\n4.  接着是工具栏，包含我们使用 Jupyter Notebook 时所需的工具，如图 6-12 所示。我们可以将鼠标悬停在每个工具图标上，了解其功能。\n\
    \n    ![../images/491271_1_En_6_Chapter/491271_1_En_6_Fig12_HTML.jpg](img/491271_1_En_6_Fig12_HTML.jpg)\n\
    \n    图 6-12\n\n    工具栏\n\n5.  最后，是我们输入所有内容并查看输出的区域，如图 6-13 所示。\n\n    ![../images/491271_1_En_6_Chapter/491271_1_En_6_Fig13_HTML.jpg](img/491271_1_En_6_Fig13_HTML.jpg)\n\
    \n    图 6-13\n\n    这里是各种单元格出现的地方，允许我们输入内容\n\n你可能已经注意到，菜单栏包含“单元格”菜单和“内核”菜单。这两个术语在\
    \ Jupyter Notebook 环境中非常重要。\n\n### 单元格\n\n*单元格不过是我们输入所有内容的框，可以是代码、普通文本或标题*。\n\n\
    当我们第一次打开 Jupyter 笔记本时，会看到第一个单元格是“代码”单元格。这个单元格允许我们输入命令、函数、变量、常量以及程序中所有其他输入。当我们执行这个单元格时，输出（如果有的话）会显示在它下方。\n\
    \n让我们尝试在“代码”单元格中输入以下内容：\n\n```\nprint(\"Hello World!\")\n```\n\n现在，我们可以通过点击工具栏上的“运行”按钮来执行该单元格。我们也可以直接使用键盘快捷键\
    \ `Shift+Return`。我们会发现代码行被执行，输出结果会打印在单元格正下方，如图 6-14 所示。\n\n![../images/491271_1_En_6_Chapter/491271_1_En_6_Fig14_HTML.jpg](img/491271_1_En_6_Fig14_HTML.jpg)\n\
    \n图 6-14\n\n执行一个代码单元格\n\n第二种类型的单元格是“Markdown”单元格。Markdown 是一种用于格式化纯文本的语法。因此，这个单元格用于输入不属于代码的任何文本。这可以是代码之间需要的解释或注释，既是为了让我们在编程时更容易理解，也是为了让其他人阅读时更全面。一旦我们输入所有必要的文本并执行该单元格，它就会变成一个在程序中可见的普通文本框。\n\
    \n让我们在“Markdown”单元格中尝试这段文本：\n\n```\nHello World!\n```\n\n我们的 Markdown 单元格将显示如图\
    \ 6-15 所示的输出。\n\n![../images/491271_1_En_6_Chapter/491271_1_En_6_Fig15_HTML.jpg](img/491271_1_En_6_Fig15_HTML.jpg)\n\
    \n图 6-15\n\n输入普通文本\n\n第三种类型的单元格是“标题”单元格。这个单元格用于在整个程序中添加标题。这可以使整个程序看起来更有条理，特别是当同一个笔记本中运行多个程序时。\n\
    \n让我们在“标题”单元格中尝试输入：\n\n```\nMy Program\n```\n\n标题将如图 6-16 所示显示。\n\n![../images/491271_1_En_6_Chapter/491271_1_En_6_Fig16_HTML.jpg](img/491271_1_En_6_Fig16_HTML.jpg)\n\
    \n图 6-16\n\n输入一个标题\n\n我们也可以直接打开一个普通的 Markdown 单元格，输入以下内容：`# My Program`。`#` 符号用于将句子转换为标题。使用该符号的次数表示标题的级别。例如，使用一个井号可以获得一级标题。我们可以通过从工具栏的选项列表中选择来更改要使用的单元格类型。\n\
    \n### 内核\n\n*内核运行 Jupyter 笔记本中包含的代码。*\n\n内核不限于单个单元格，而是针对整个笔记本。当我们在选定的单元格中执行代码时，代码在内核中运行，并将任何输出发送回单元格进行显示。\n\
    \n有超过一百种语言的内核，包括 Python、C、R 和 Java。当我们从 Jupyter Notebook 仪表板创建新笔记本时，我们基本上是通过选择想要使用的\
    \ Python 版本来选择内核。在这种情况下，当我们选择“Python 3”时，我们是在告诉系统打开一个 Python 3 内核。\n\n现在我们对单元格和内核有了一些了解，让我们回到菜单栏，探索“单元格”和“内核”下拉菜单允许我们做什么。\n\
    \n### 单元格下拉菜单\n\n图 6-17 显示了“单元格”下拉菜单中可用的不同选项。\n\n1.  **运行单元格：** 执行所选单元格中的代码，并给出输出（如果有的话）。\n\
    \n2.  **运行单元格并选择下方：** 执行所选单元格，然后选择它们下方的单元格。\n\n3.  **运行单元格并在下方插入：** 执行所选单元格，然后在它们下方插入一个额外的单元格。\n\
    \n4.  **全部运行：** 执行笔记本中的所有单元格。\n\n5.  **运行上方所有：** 运行所选单元格上方的所有单元格。\n\n6.  **运行下方所有：**\
    \ 运行所选单元格下方的所有单元格。\n\n7.  **单元格类型：** 允许我们选择所需的单元格类型。\n\n8.  **当前输出：** 允许我们切换、切换滚动或清除所选输出。\n\
    \n9.  **所有输出：** 允许我们切换、切换滚动或清除笔记本中的所有输出。\n\n![../images/491271_1_En_6_Chapter/491271_1_En_6_Fig17_HTML.jpg](img/491271_1_En_6_Fig17_HTML.jpg)\n\
    \n图 6-17\n\n单元格下拉菜单\n"
- fmt: '### The Kernel Drop-Down Menu


    Figure [6-18](#491271_1_En_6_Chapter.xhtml#Fig18) shows the different options
    available within the `Cell` drop-down menu.


    1.  **Interrupt:** This interrupts the running process as the code is being executed.

    2.  **Restart:** This restarts the entire kernel, retaining the previously obtained
    outputs.

    3.  **Restart and Clear Output:** This restarts the entire kernel, clearing the
    previously obtained outputs.

    4.  **Restart and Run All:** This restarts the entire kernel and once again proceeds
    to execute all the cells.

    5.  **Reconnect:** This allows the kernel to reconnect.

    6.  **Shutdown:** This shuts the active kernel down.

    7.  **Change Kernel:** This allows us to change our kernel to any version or language
    that we want.


    ![../images/491271_1_En_6_Chapter/491271_1_En_6_Fig18_HTML.jpg](images/491271_1_En_6_Chapter/491271_1_En_6_Fig18_HTML.jpg)


    Figure 6-18


    Kernel drop-down menu


    There you have it! This was an overview of some of the most basic but important
    features of Jupyter Notebook.


    Now that you are familiar with the working environment of Jupyter Notebook, let’s
    go ahead and practice some Python programming with the help of Jupyter Notebook.


    ## Additional Information


    The Jupyter Project is a very interesting initiative, especially for data scientists
    and machine learning enthusiasts who need a reliable and convenient space to work
    on their projects. Let’s have a look at two more very useful features that come
    under Project Jupyter, and that can be useful to some of us in our machine learning
    journey.


    ### JupyterHub


    `JupyterHub` allows multiple users to share resources in order to program. Each
    user has their own workspace where they can code without worrying about installations
    and maintenance.


    It can run either on a user’s system or on the cloud. It is customizable, flexible,
    portable, and scalable, making it a great interface for programmers. It also has
    its own community for users to discuss and contribute.


    ### Jupyter nbviewer


    `Jupyter nbviewer` is a free and publicly available instance of `nbviewer`, which
    is a web-based application that allows us to view a notebook as a static HTML
    web page. It also provides us with a link that we can use to share the notebook
    with others.


    Apart from viewing a single notebook, we can also view notebook collections. These
    notebooks can even be converted into other formats.


    ### Voila


    `Voila` is used to convert a Jupyter notebook into a stand-alone web application
    that can be shared with others. It consists of an interactive dashboard that is
    customizable and allows users to view the notebook in a secure environment.


    It can work in any Jupyter kernel, independent of the type of programming language
    used. It is a great choice for non-technical users who desire to view the results
    of the notebook without having to see the code cells or execute the code.


    ### Google Colaboratory


    Google’s `Colaboratory` or `Colab` is a free online Jupyter environment. It runs
    in the cloud and stores its notebooks to the user’s Google Drive.


    As of October 2019, `Colab` mainly supports Python 2 and Python 3 kernels.


    However, it is also possible for `Colab` to support R, Swift, and Julia.


    ### Keyboard Shortcuts


    First of all, you need to know that there are two modes of working with Jupyter
    Notebook, as follows:


    *   **Command Mode**, which allows us to navigate around the notebook with our
    arrow keys.

    *   **Edit Mode**, which allows us to edit the selected cell.


    Table [6-1](#491271_1_En_6_Chapter.xhtml#Tab1) lists some of the most useful keyboard
    shortcuts that we can use while working with Jupyter Notebook.


    Table 6-1


    Keyboard Shortcuts for Jupyter Notebook


    | Mac | Windows and Linux | Action |

    | --- | --- | --- |

    | `Cmd + Shift + P` | `Ctrl + Shift + P` | Access keyboard shortcuts |

    | `Shift + Enter` | `Shift + Enter` | Executes the code |

    | `Esc` | `Esc` | Enters Command Mode when in Edit Mode |

    | `Enter` | `Enter` | Enters Edit Mode when in Command Mode |

    | `A` | `A` | Inserts a new cell above the selected cell while in Command Mode
    |

    | `B` | `B` | Inserts a new cell below the selected cell while in Command Mode
    |

    | `D + D` (Press D twice) | `D + D` (Press D twice) | Deletes the selected cell
    while in Command Mode |

    | `Shift + Tab` | `Shift + Tab` | Displays the available documentation for the
    item entered into the cell |

    | `Ctrl + Shift + -` | `Ctrl + Shift + -` | Splits the selected cell into two
    at the point where the cursor rests while in Edit Mode |

    | `F` | `F` | Finds and replaces code while in Command Mode |

    | `Shift + J` / `Shift + Down` | `Shift + J` / `Shift + Down` | Selects the chosen
    cell as well the cell below it |

    | `Shift + K` / `Shift + Up` | `Shift + K` / `Shift + Up` | Selects the chosen
    cell as well as the one above it |

    | `Shift + M` | `Shift + M` | Merges multiple cells |


    ## Summary


    In this chapter, we have gained an understanding of the importance of the notebook
    interface, when compared to IDEs and text editors. We then explored the Jupyter
    Notebook application, its features, and its user interface.


    The great thing about Jupyter Notebook is that it looks quite complex and technical,
    but in reality it is not too difficult to use, once you get the hang of it. Overall,
    it is a great tool to use for all your programming purposes. Not just that, it
    can also be used to display your results and present your output in a manner that
    is not too hard on the eyes.


    In the next few chapters, we will begin some actual programming with the help
    of Jupyter Notebook. We will get a feel of how we can use the notebook interface
    effectively to enter, run, and debug our code. And, finally, once we have gained
    some familiarity with Jupyter Notebook, we will proceed with using the interface
    to develop our machine learning models.


