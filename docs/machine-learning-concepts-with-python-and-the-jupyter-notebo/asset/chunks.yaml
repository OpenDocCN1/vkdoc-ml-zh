- fmt: '# Back Propagation


    Back propagation of the error is a deep learning algorithm that is used in training
    a supervised learning model. It calculates the [gradient](https://en.wikipedia.org/wiki/Gradient)
    of the [loss function](https://en.wikipedia.org/wiki/Loss_function) corresponding
    to the weights generated by the network for a single input and output pair. It
    modifies the values of the weights in order to minimize the loss. It is an efficient
    method of calculation, and thus makes it feasible to use [gradient methods](https://en.wikipedia.org/wiki/Gradient_method)
    to train multi-layer networks.


    The algorithm computes the gradient of the loss function with respect to each
    weight by the [chain rule](https://en.wikipedia.org/wiki/Chain_rule), by proceeding
    one layer at a time. It iterates backward from the final layer. This is done to
    avoid redundant calculations during the process.


    # Overfitting


    Overfitting is a statistical concept. It occurs when an analysis is said to be
    too accurate with respect to the data provided to it, and thus it can result in
    an improperly trained model. When we train our model, we may get very high accuracy.
    However, when testing the model, we may find a drastic difference in the accuracy.
    This is the result of overfitting.


    It can happen when we train a model too many times, or with too little data. The
    model ends up getting very familiar with the training data and can thus achieve
    a very high accuracy with it. However, it messes up anyway when it comes to making
    predictions on new data, because it has still not been trained in the right way.


    # Types of Neural Networks


    There are several types of neural networks, all based on their structure, composition,
    and flow. Let’s go ahead and discuss a few of the common and most important ones
    that are used by deep learning developers.


    ## Single-Layer Neural Networks: A Perceptron


    The perceptron is the oldest single-layer neural network. As you have seen before,
    it takes the input from the user, multiplies it by the corresponding weight, adds
    that to the bias to get the net input function, and then passes the result through
    the activation function to get the final output. Every perceptron produces only
    a single output.


    This type of neural network is not very efficient due to its extremely limited
    complexity. Thus, researchers came up with a model that contained more than one
    layer of perceptrons.


    ## Multi-Layer Neural Networks


    This type of neural network is used mainly for natural language processing, speech
    recognition, image recognition, etc. It consists of two or more layers of perceptrons,
    as follows:


    - **Input layer:** This is all the available numerical data that is fed into the
    system and then transferred to the rest of the neural network.

    - **Hidden layers:** This is where all the neurons are located. Every layer can
    have any amount of neurons. They are known as “hidden” layers because they remain
    hidden within the neural network as they perform the necessary computations.

    - **Output layer:** This is the final result of all the calculations that happened
    in the hidden layers.


    ## Convolutional Neural Networks


    Convolutional neural networks follow the same principle as multi-layer neural
    networks, the only difference being that they include “convolutional layers,”
    which make use of filters.


    A filter is a grid of size `AxB` that is moved across the image and gets multiplied
    several times by it to produce a new value. Each value represents a line or an
    edge in the image.


    Once the filters have been used on the image, its important characteristics can
    be extracted. This is done with the help of a pooling layer. These layers pool
    or collect the main features of each image. One popular technique of doing this
    is known as max pooling, which takes the largest number of each image and stores
    it in a separate grid. It thus compresses the main features into a single image
    and then passes it on to a regular multi-layer neural network for further processing.


    These neural networks are mainly used for image classification. They can also
    be used in search engines and recommender systems.


    ## Recurrent Neural Networks


    Recurrent neural networks (RNNs) are used for temporal data; i.e., data that requires
    past experiences to predict future outcomes. State matrices remember previous
    states of data by storing the last output, and then use this data to calculate
    the new output.


    Long short-term memory (LSTM) networks save the state matrices in two states:
    long term and short term. RNNs begin in the layers after the first layer. Here,
    each node acts as a memory cell during the computation, which allows it to compare
    previous values with new values during back propagation. These neural networks
    can be used for stock market predictions, natural language processing, and price
    determination.


    ## Sequence-to-Sequence Models


    A sequence-to-sequence model is mainly used when the lengths of the input data
    and output data are unequal.


    It makes use of two recurrent neural networks, along with an encoder and a decoder.
    The encoder processes the input data, while the decoder processes the output data.


    These models are usually used for chatbots and machine translation.


    ## Modular Neural Networks


    Modular neural networks have several different networks that each work independently
    to complete a part of the entire task. These networks are not connected to each
    other, and so do not interact with each other during this process.


    This helps in reducing the amount of time taken to perform the computation by
    distributing the work done by each network. Each sub-task would require only a
    portion of the total time, power, and resources needed to complete the work.


    **Task Time**


    Have a look at the other types of neural networks. How do they differ from one
    another? How would a machine learning developer choose between these models?


    # Summary


    Deep learning is a vast topic, and it is not possible to cover everything in detail
    within a single chapter. It suffices, however, to at least learn the basics of
    it, which is what we have done.


    We learned what a deep learning neural network is and how it works. In addition,
    we discussed a few extra concepts that are important to know with regard to the
    functioning of neural networks. Finally, we went through several types of neural
    networks, which gave us a clearer understanding of how they can be developed and
    used for various purposes. Despite the fact that deep learning is a part of machine
    learning, these two terms are often used as if they are completely different entities.
    This can be quite confusing, especially for beginners. Thus, in the next chapter,
    we will see how they can be compared to one another.


    # 4. Machine Learning vs. Deep Learning


    In the previous chapters, we learned that artificial intelligence involves the
    phenomenon of thinking machines. Machine learning is the technique of helping
    a machine to think so it is able to perform actions on its own. We also learned
    that deep learning is a type of machine learning that uses neural networks to
    help a machine learn. These neural networks are modeled after the human brain.


    That said, you now may be wondering: Why would we compare machine learning and
    deep learning when they are not independent, but rather the latter is a subset
    of the former?


    Well, as you’ve seen, traditional machine learning has several methods. Deep learning
    is one such method that is much more advanced in the way it works, and thus the
    procedure and results may vary. In this short chapter, we will discuss the differences
    between traditional machine learning and deep learning, which will help us understand
    when to use each method, as per our requirements.'
