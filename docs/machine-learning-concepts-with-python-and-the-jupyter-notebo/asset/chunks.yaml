    我们也可以通过选择菜单栏“编辑”下拉菜单中的“删除单元格”选项来执行此操作，如图 7-20 所示。


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig20_HTML.jpg](img/491271_1_En_7_Fig20_HTML.jpg)


    图 7-20


