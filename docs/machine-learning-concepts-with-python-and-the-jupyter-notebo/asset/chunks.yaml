    # 第一部分 人工智能、机器学习与深度学习


    人工智能、机器学习与深度学习


    在第一部分中，你将了解人工智能、机器学习和深度学习的基本概念。如果你是初学者，这将是一个熟悉该领域常用术语和基础知识的好方法。如果你有一定经验，这将帮助你回顾迄今为止所学的内容。你甚至可能遇到一些新知识！


    本部分内容预览：


    *   人工智能简介


    *   机器学习简介


    *   机器学习概念概述


    *   深度学习简介


    *   深度学习概念概述


    *   机器学习与深度学习的比较


    # 1. 人工智能概述


    在本章中，我们将迈出进入人工智能世界的第一步。尽管这是一个广阔的领域，我们可能需要另一本书来深入探讨，但我们将概述重要的人工智能事实和概念——它是什么、如何产生、优缺点，以及如何在当今生活中应用。


    ## 人工智能入门


    我们都听说过“智能”。根据经验，我们发现成绩较高的学生通常被认为比成绩较低的学生更聪明。这并非总是如此，但这是我们倾向于得出的结论。


    我们也知道爱因斯坦的智商约为 160。令人惊讶的是，英国一名 12 岁女孩的智商得分高达 162，从而在这一智力衡量标准上击败了这位举世闻名的天才。


    那么，究竟什么是智能？


    *智能可以定义为获取和应用知识与技能的能力。*


    这就是我们从小接受教育的原因。多年来，我们被灌输旨在帮助我们变得更聪明的知识。


    多年来，人们努力工作，拓展研究并推动科学进步。他们运用“自然智能”创造出更大、更好的创新。最终，他们能够对机器进行编程，使其像人类一样工作和思考，并很快将其称为“人工智能”。


    *人工智能可以定义为机器无需明确编程，就能像人类一样思考以执行特定任务的能力。*


    它有时也被称为“机器智能”，可与“人类智能”相提并论。事实上，它受到人类自然智能的启发，旨在复制人脑的认知能力，如学习、理解和解决问题。

    '
- fmt: '# The Inception of Artificial Intelligence


    Artificial intelligence did not always exist. It was probably only something that
    existed in people’s imaginations, and maybe just an exciting part of a science
    fiction novel. However, around the late 1930s, people slowly began considering
    the possibility of machines’ being able to think in the way that human beings
    do, which is what inspired researchers to go about making this a reality.


    ## 1930s–1940s: Over the Years


    A few scientists from different fields came together to discuss the possibility
    and practicality of creating machines that could think and respond and act like
    human beings.


    One of the early works that inspired machine learning was the `Bombe` machine
    made by Alan Turing and his team during World War II. This machine could crack
    the `Enigma` code used by the Germans to send encrypted messages. This was a major
    milestone in the field of machine learning.


    ## 1950s: Discoveries and Breakthroughs


    In 1950, Alan Turing published a paper, “Computing Machinery and Intelligence,”
    while he worked at the University of Manchester. In this paper, he introduced
    what is known as the `Turing Test`. In this test, he proposed that if a person
    is allowed to talk to another person and a machine, and if the first person is
    not able to differentiate between his two conversation partners, then the machine
    exhibits intelligent behavior. The conversation would be text-based only. This
    test proved to be a way to convince many people that a thinking machine was at
    least possible.


    In 1951, Christopher Strachey developed a checkers program with the help of the
    `Ferranti Mark 1` machine. Dietrich Prinz wrote one for chess as well. These technologies
    come under the “Game AI” umbrella, which is used even to this day to understand
    how far AI has come.


    Around 1955, Allen Newell and Herbert A. Simon came up with the “Logic Theorist.”
    It was the first program that was made for automated reasoning, and is thus known
    as the first artificial intelligence program. It ended up proving thirty-eight
    out of fifty-two theorems in *Principia Mathematica* by Alfred North Whitehead
    and Bertrand Russell, and thus opened the eyes of researchers to the possibilities
    of manipulating symbols, which could help with human thought.


    In 1956, Marvin Minsky, John McCarthy, Claude Shannon, and Nathan Rochester organized
    the Dartmouth Conference. It was here that the term *artificial intelligence*
    was first coined by John McCarthy and accepted by researchers in the field. AI
    also gained a proper identity in the field of science during this conference.


    ## 1960s–1970s: Advanced AI


    After this, interest in artificial intelligence began to grow rapidly. It was
    the hot topic at the time, and people were coming up with newer ideas and better
    techniques to help machines think. In the 1960s, researchers began developing
    robots as well. The `WABOT` project began in Japan in 1967, with an objective
    to create the first “intelligent” humanoid robot.


    ## 1970s–1980s: The First AI Winter


    The 1970s started out pretty well for AI. The `WABOT-1` was finally completed
    in 1972. It had limbs that could move either to move around or to grasp onto objects.
    It had artificial eyes and ears that helped it measure depth and direction. It
    also had an artificial mouth with which it could communicate with people in Japanese.


    However, AI had still not reached the extent that people had hoped it would. Development
    seemed to go at a snail’s pace, and investors were not satisfied with the situation.
    Eventually, they began to halt all funding for undirected AI research.


    Some of the reasons for the slow rate at which AI was moving forward include the
    following:


    1. **Need for massive data and storage:** Machines did not have the capacity to
    gather and store information about the world. This was a huge obstacle because
    machines require immense quantities of information in order to become intelligent.


    2. **Need for greater computational power:** Machines still did not have the power
    to carry out any substantial computations.


    3. **Need for more computational time:** Many real-world problems can only be
    solved with the availability of time, which is what was missing then. So, people
    felt that AI would perhaps not be able to provide any solutions for realistic
    issues.


    Many critics also began stepping up against the field. They pointed out the lack
    of resources, unfulfilled objectives, and the unknown future of AI. By 1974, it
    had become extremely difficult to obtain funding for AI-related studies.


    This resulted in many people feeling that artificial intelligence was not only
    a futuristic fantasy, but also an unattainable goal. The overall coldness in the
    attitude of people toward AI led to the first “AI winter,” which lasted from 1974
    to 1980.


    ## 1980s–early 1990s: The Revival and the Second AI Winter


    In the 1980s, things started looking brighter for AI. People started implementing
    expert systems in their businesses, which is a form of AI programming that answers
    questions and solves problems within a particular area of knowledge. This led
    to a shift in focus in AI research toward knowledge engineering and knowledge-based
    research (KBR).


    It was at this time that the Japanese Ministry of International Trade and Industry
    made the decision to invest $850 million in the fifth-generation computer project.
    Through this project, they wanted to create machines that could reason, converse,
    translate languages, and comprehend images.


    Connectionism made a comeback as a result of the `Hopfield Net`, which is a type
    of neural network that worked differently but provided appreciable results.


    In 1987, however, all enthusiasm toward AI abruptly decreased because of the introduction
    of desktop computers by Apple and IBM, which were less expensive and much more
    powerful. This resulted in a collapse in the demand for AI hardware. Expert systems
    were also found to be too expensive to maintain and improve.


    Funding was stopped, and research was dropped. This led to the second AI winter,
    which went on from 1987 to 1993.'
