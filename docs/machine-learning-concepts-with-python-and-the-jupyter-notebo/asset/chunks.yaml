    另一种方法是通过选择菜单栏“插入”下拉菜单中的“在下方插入单元格”选项。如果我们想在所选单元格上方添加一个单元格，可以点击“在下方插入单元格”图标，然后点击“上移单元格”图标，或者直接从“插入”下拉菜单中选择“在上方插入单元格”选项，如图
    7-21 所示。


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig21_HTML.jpg](img/491271_1_En_7_Fig21_HTML.jpg)


    图 7-21


    使用下拉菜单选项添加新单元格


    ## 复制单元格


    我们还可以借助工具栏中的“复制所选单元格”和“粘贴所选单元格”选项，复制一个单元格的内容并粘贴到另一个单元格中。


    我们也可以通过从菜单栏中选择所需选项来执行此操作，如图 7-22 所示。


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig22_HTML.jpg](img/491271_1_En_7_Fig22_HTML.jpg)


    图 7-22


    使用下拉菜单选项复制单元格


    ## 移动单元格


    我们甚至可能希望根据自己的偏好来调整单元格的顺序。我们可以使用工具栏中的向上和向下箭头图标，相应地向上或向下移动单元格。


    我们也可以通过转到菜单栏，点击“编辑”，然后选择“上移单元格”或“下移单元格”来执行此操作，如图 7-23 所示。


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig23_HTML.jpg](img/491271_1_En_7_Fig23_HTML.jpg)


    图 7-23


    使用下拉菜单选项移动单元格


    ## 合并单元格


    现在让我们回到之前的一些代码片段，我们定义了一个变量 `a` 作为用户的输入，然后在下一个“代码”单元格中打印出这个变量的值。


    与其在两个单独的单元格中执行此操作，不如将它们放在一个单元格中。好处是，我们甚至不需要重新输入或删除任何内容。我们只需要转到菜单栏，选择“编辑”，然后点击“向下合并单元格”，如图
    7-24 所示。


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig24_HTML.jpg](img/491271_1_En_7_Fig24_HTML.jpg)


    图 7-24


    使用下拉菜单选项合并单元格


    让我们在我们之前的一段代码上试试这个。考虑这样一段代码：我们从用户那里获取输入，将其存储为输入 `a`，然后显示 `a` 的值。这原本是在两个独立的代码单元格中完成的。然而，当我们合并单元格时，它会将代码合并到一个单元格中，如图
    7-25 所示。


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig25_HTML.jpg](img/491271_1_En_7_Fig25_HTML.jpg)


    图 7-25


    两个单元格合并为一个单元格


    ## 拆分单元格


    我们甚至可以使用菜单栏“编辑”下拉菜单中的“拆分单元格”选项将一个单元格拆分为两部分，如图 7-26 所示。


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig26_HTML.jpg](img/491271_1_En_7_Fig26_HTML.jpg)


    图 7-26


    使用下拉菜单选项拆分单元格


    首先，点击我们想要拆分代码的起始行。然后点击“拆分单元格”选项。代码将被拆分，如图 7-27 所示。


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig27_HTML.jpg](img/491271_1_En_7_Fig27_HTML.jpg)


    图 7-27


    使用下拉菜单选项拆分单元格


    ## 运行所有单元格


    无需逐个执行每个单元格，我们可以一次性运行所有单元格。为此，我们只需点击菜单栏“单元格”下拉菜单中的“全部运行”选项，如图 7-28 所示。这将执行整个笔记本。


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig28_HTML.jpg](img/491271_1_En_7_Fig28_HTML.jpg)


    图 7-28


    使用下拉菜单选项运行笔记本中的所有单元格

