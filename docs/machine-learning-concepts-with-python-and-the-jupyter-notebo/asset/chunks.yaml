    ### If-Else Statement


    We can use the same code as before, but with a minor addition to include the `else`
    condition, as follows:


    ```

    x=3*3

    if x%2== 0:

    print("It is even")

    else:

    print("It is odd")

    ```


    When we run this code, we will get an output as shown in Figure [7-17](#491271_1_En_7_Chapter.xhtml#Fig17).


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig17_HTML.jpg](images/491271_1_En_7_Chapter/491271_1_En_7_Fig17_HTML.jpg)


    Figure 7-17


    Executing an if-else condition


    In this case, we add an extra condition, where we tell the program what to do
    if the first condition is not satisfied.


    ### Elif Statement


    This time we will use a slightly different code, as follows:


    ```

    x=7

    if x%2==0:

    print("It divisible by 2")

    elif x%3==0:

    print("It is divisible by 3")

    else:

    print("It is neither divisible by 2 nor 3")

    ```


    When we run this program, we will get an output as shown in Figure [7-18](#491271_1_En_7_Chapter.xhtml#Fig18).


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig18_HTML.jpg](images/491271_1_En_7_Chapter/491271_1_En_7_Fig18_HTML.jpg)


    Figure 7-18


    Executing an elif condition


    Thus, `elif` allows us to supply our code with more than one condition. We can
    put `elif` several times throughout our code, depending on the number of conditions
    we have.


    ## Adding Notes Within the Program


    Sometimes, we may want to add some extra notes in between lines in our program,
    either for our own reference or to make sure that people who have access to it
    understand what they are going through. This is not the same as adding a regular
    "Markdown" cell. This is different because we are adding our notes within a "Code"
    cell. To do this, we need to add a hash (`#`) symbol before the code line. Here
    is an example:


    ```

    # This is a comment line in between my code.

    ```


    This line will appear in green italics in the "Code" cell, as shown in Figure
    [7-19](#491271_1_En_7_Chapter.xhtml#Fig19).


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig19_HTML.jpg](images/491271_1_En_7_Chapter/491271_1_En_7_Fig19_HTML.jpg)


    Figure 7-19


    Adding a comment line within the code


    ## Deleting a Cell


    Sometimes, we may have cells that are unnecessary. We can easily get rid of them
    by clicking on the scissor icon.


    We can also do so by selecting the "Delete Cells" option from the "Edit" drop-down
    menu in the menu bar, as shown in Figure [7-20](#491271_1_En_7_Chapter.xhtml#Fig20).


    ![../images/491271_1_En_7_Chapter/491271_1_En_7_Fig20_HTML.jpg](images/491271_1_En_7_Chapter/491271_1_En_7_Fig20_HTML.jpg)


    Figure 7-20


    Deleting cells using the drop-down menu option


    ## Adding a New Cell


    We can even add a new cell beneath another cell by selecting that cell and then
    clicking on the "Insert Cell Below" icon or the plus sign.


    The other way to do this is by selecting the "Insert Cell Below" option from the
    "Insert" drop-down menu in the menu bar. If we want to add a cell above the selected
    cell, we can either click on the "Insert Cell Below" icon followed by the "Move
    Cell Up" icon, or directly click on the "Insert Cell Above" option from the "Insert"
    drop-down menu, as shown in Figure [7-21](#491271_1_En_7_Chapter.xhtml#Fig21).


