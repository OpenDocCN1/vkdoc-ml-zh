  trans: '

    到目前为止，我们已经了解了人工智能，在其之下有机器学习及其子集深度学习。我们还学习了常用于机器学习编码的 Python 编程语言。我们甚至熟悉了 Jupyter
    Notebook 界面，可以在其中编写、编辑和调试程序。接着，我们看到了如何将 Python 与 Jupyter Notebook 结合，作为一种编写代码的有效方式。之后，我们介绍了
    TensorFlow 库，它是 Python 中的一个重要包，在理解了该库的用途后，我们继续学习了它的最新升级版本——TensorFlow 2.0——它拥有额外的特性和能力，使得构建机器学习模型更加容易。


    现在，我们终于来到了本书最重要的主题：学习如何借助 TensorFlow 库构建和运行机器学习模型。如前所述，创建 TensorFlow 的主要原因是为了帮助开发者，不仅处理基本的机器学习编程，还能应对更高级的机器学习流程。换句话说，TensorFlow
    主要是为采用神经网络的深度学习而创建的。


    在本章中，我们将进一步了解机器学习模型是如何构建的，并且还将亲自尝试七个程序。每个程序都是一个需要神经网络的图像分类问题，所有程序均使用 Keras API
    构建，我们稍后会详细介绍。


    这七个程序如下：


    1.  使用预训练模型进行图像分类

    2.  在 TensorFlow 中使用 Keras 进行手写识别（单层，多分类）

    3.  在 TensorFlow 中使用 Keras 进行服装分类（多层，多分类）

    4.  使用卷积神经网络进行服装分类（多层，多分类）

    5.  使用卷积神经网络进行手写识别（多层，多分类）

    6.  使用卷积网络对 CIFAR-10 进行图像分类（多层，多分类）

    7.  使用卷积神经网络进行猫狗分类（多层，二分类）


    我们将逐步讲解每个程序，以全面了解开发过程中涉及的所有流程和组件，特别是以下内容：


    *   结构

    *   数据集

    *   API

    *   激活函数

    *   优化器

    *   程序


    通过充分理解这七个程序，我们将能够为其他类似问题创建自己的模型。


    在开始编程之前，我们需要做两件事来做好准备：


    1.  理解机器学习模型的结构。

    2.  熟悉 Keras，我们将在 TensorFlow 中使用它来构建和训练深度学习模型。


    在第 2 章中，我们看到了解决机器学习问题时需要遵循的步骤。在这里，我们将深入了解机器学习模型的一般结构，以便更清晰地了解它是如何构建的。


    机器学习模型的结构

    如前所述，机器学习需要我们自己完成部分工作。其余部分则由计算机在后台完成。换句话说，这一切都发生在代码的后端。老实说，这为我们程序员省去了很多麻烦。然而，在创建模型时，我们仍然需要执行大量任务，以确保获得我们期望的输出。


    机器学习开发者的任务主要是构建模型，然后运行它。根据我们具体要完成的任务，模型包含多个组件，但总体架构保持不变。


    由于我们将使用神经网络来执行机器学习流程，因此我们将研究使用神经网络的深度学习模型的结构。模型的整体结构思路如图 11-1 所示。


    ![../images/491271_1_En_11_Chapter/491271_1_En_11_Fig1_HTML.jpg](img/491271_1_En_11_Fig1_HTML.jpg)


    图 11-1

    机器学习模型流程图


    如图所示，开发一个可用的机器学习模型涉及四个主要步骤，如下所示：


    1.  **数据加载与预处理：** 这部分接收数据，对其进行处理，然后为训练和测试做好准备。

    2.  **构建模型：** 这是开发者指定模型各个组件的部分。

    3.  **训练模型：** 这部分接收训练数据，并开始对其执行计算以获得最优结果。

    4.  **测试模型：** 这部分验证或检查模型的准确性。


    前两个步骤需要程序员投入时间、精力和技能，因为它们涉及数据处理和创建可工作的模型。对于后两个步骤，程序员只需启动模型运行，然后就可以放松休息，让机器完成所有繁重的工作。


    让我们更详细地了解一下这个结构，以便更好地理解它的作用、工作原理以及需要做什么。


    数据加载与预处理

    在第 2 章中，我们了解了收集数据的不同方法。我们还了解到，这些数据在使用前需要经过一些预处理，才能用于任何类型的分析，以确保获得最佳结果。这意味着我们可能需要添加、删除或更改一些值。


    请记住，*这并不意味着我们完全改变了数据*，那样可能导致错误的输出。我们只是让数据更易于系统读取和处理。


    以下是一些示例：


    1.  假设我们有一个包含 500 名已婚女性及其各自子女数量的数据列表。在这个列表中，几乎每个人都有至少一个孩子。只有五个人没有孩子。现在的问题是，我们需要根据这些女性拥有的孩子数量来预测她们每天的睡眠小时数。显然，这五位女性的详细信息对于这项研究来说是不需要的，因为她们没有孩子。因此，我们必须从列表中删除她们的数据。

    2.  有时，除了数值之外，我们的数据还可能包含诸如 *None* 或 *No* 之类的术语，根据具体问题，这些基本上可以表示零。因此，我们需要将这些值更改为
    0，或者将它们从数据集中删除。

    3.  在某些情况下，我们可能希望将数值四舍五入到最接近的整数。这可以对整个数据集进行，也可以仅对其中一部分进行。


    数据可以手动修改。在处理结构化数据时，电子表格或可视化软件等应用程序会派上用场。然而，当数据集很大时，处理起来会变得相当繁琐和单调。因此，大多数开发者使用一个名为
    Pandas 的 Python 库，它为用户提供了多种处理数据的工具和实用程序。借助 Pandas，用户可以从本地系统将 `.csv` 文件（csv：逗号分隔值）导入到
    Jupyter notebook 中。


    在本书中，我们将使用已集成在 TensorFlow 库中的图像数据集。借助 TensorFlow 函数可以轻松调用它们，我们稍后会看到。


    我们用于训练机器学习模型的数据分为两类：标签和特征。

