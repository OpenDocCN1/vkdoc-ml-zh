    我记得有一天，大约在我 15 岁的时候，我的小表妹来家里做客。作为一位称职的好姐姐，当所有大人在屋内热烈交谈时，我陪她在外面的花园里玩耍。很快，我就开始追着这个活泼的
    4 岁小家伙跑，她忙忙碌碌地到处转，摸摸每一朵小花，观察每一个小生物。


    起初，她默默地做着这些事，唯一的声音是她跑过草地时的脚步声。然而，过了一会儿，她再也忍不住了，开始向我询问她视线范围内的每一个物体和现象。有一阵子，我很兴奋，觉得自己已经足够大，能够满意地回答这些问题。但这种兴奋很短暂，因为她开始深入探究，渴望了解更多。


    这种情况一直持续到妈妈出来叫我们吃晚饭。当我感激地走回屋里时，我得出了两个结论：


    1.  人类的大脑具有非凡的好奇心

    2.  我并没有自己想象的那么聪明


    现在想想，很有意思的是，我们所知道做的一切——从数脚趾头，到唱准国歌，再到说出太阳系的行星名称——都是我们随着时间推移而发展出的技能。


    我们生来就具备这些能力吗？


    不，当然不是。


    但我们确实有能力学习如何做所有这些事情，这要归功于我们不断学习和处理信息的大脑。我们学得越多，知识就越丰富。知识越丰富，我们就越聪明。


    不仅仅是人类，动物也是如此。通过教导狗，当它正确完成坐下、打滚和装死这些任务时，就能获得美味零食作为奖励，狗就能学会这些动作。通过知道如何执行这些任务，它就被认为是一只“聪明的狗”。


    那么，我们是如何学习新事物的呢？


    学习的一种方式是通过询问。当我的表妹问她看到的一切问题时，她是在试图从她认为可靠的来源那里获得答案。她知道我已经了解了所有这些事情，所以我可以给她所需的答案。


    另一种学习方式是通过观察。在我的表妹开始问我问题之前，她一直在观察一切。她注意到天空是蓝色的，而草是绿色的；蚱蜢跳来跳去，而蚂蚁沿着地面爬行。她能够自己学习新事物，而无需向任何人求助。


    她问的问题越多，观察得越多，她的知识就增长得越多。


    想想看，仅仅通过学习，一个生命就能变得聪明，这真的很令人着迷。


    正是这种智慧造就了今天的世界。人们增长了知识，有了新的发现，使日常生活变得更快捷、更高效。这导致了可用工作的数量和种类以及所需技能的增加。


    很快，人们开始开发新的想法和方法来执行各种任务。他们设法创造出能够自动完成某些事情的物体，比如钉钉子、拧螺丝等等。换句话说，人们创造出了我们现在称之为“机器”的东西，它们被制造出来模拟人的动作。这些机器减少了所需的体力劳动，尤其是在制造过程中。我们现在有机器接管了我们很多工作——让我们有更多的时间和精力去处理稍微更复杂的智力任务，而这些任务是这些机器无法完成的，因为尽管我们可以让机器执行特定的动作，但我们无法让它们像人类那样思考。


    现在考虑一下……如果机器*能够*思考，从而也能执行这些智力任务，那会怎样呢？

    '
- fmt: '# A Simple Example of Artificial Intelligence


    Consider an email inbox. Earlier, it was just a regular interface through which
    we could carry out trivial tasks like reading, replying to, and deleting emails.
    Nowadays, we have much more advanced inboxes, with folders for `Spam`, `Important`,
    `Other`, etc. Our inboxes automatically detect if something is spam, and send
    it to the respective folder. They even detect if something is comparatively important,
    and send it to the `Important` folder. All other emails go under the `Other` folder.


    ![../images/491271_1_En_BookFrontmatter_Fig1_HTML.jpg](images/491271_1_En_BookFrontmatter_Fig1_HTML.jpg)


    Figure I-1


    Email Classification


    But how does the inbox know the difference between these categories?


    The answer is simple - It learned.


    It learned how to detect if a message is spam, the same way we learned to do so
    - By looking for certain characteristics in the message. These characteristics
    include:


    1. Irrelevant advertising

    2. Request for sensitive information like an account number, contact information,
    etc.

    3. Use of a general term to address the recipient, rather than using the actual
    name

    4. Suspicious attachments


    Once the inbox identifies such a message, it marks it as a possible spam email.
    It then sends that message to the `Spam` folder. Thus, it saves us the trouble
    of dealing with numerous unnecessary emails everyday. All we need to do is go
    to our `Spam` folder, select all the messages, and delete them. We don’t even
    need to open the messages and read through them.


    The ability of a machine to think and perform tasks like this is known as `Artificial
    Intelligence` (AI), and the process by which it gains this Artificial Intelligence
    is known as `Machine Learning` (ML).


    This example of email segregation is just a simple application of Artificial Intelligence
    and Machine Learning. In fact, there is room for mistakes in this technology as
    well. However, these fields actually have massive potential. Just think about
    it - With the help of Artificial Intelligence and Machine Learning, we can create
    machines that think, infer, and then perform tasks. This would result in a quicker,
    more convenient lifestyle for people.


    How?


    Well, imagine a world where everything was automated, from picking our outfit
    in the morning based on the weather and the occasion, to driving to office through
    the busy traffic, to watering the garden at the right time. Our daily chores would
    no longer be ours to do. And, on a broader level, there would be even more applications,
    in the areas of business, medicine, education, and more. For example, there would
    be AI Recruiters, AI Doctors, AI Teachers, and so on. Long story short - People
    would be replaced by Robots that can do their work with greater efficiency.


    ## Replacing Mankind with Machines


    I think before we can consider replacing women and men with machines that can
    perform their work, we need to seriously ask ourselves the following question
    -


    Would that be a good idea?


    Well, at present, that’s an inconclusive topic for debate. But it’s definitely
    an interesting area to have a look at.


    Some of the first AI bots started out as unbeatable champions in games like Checkers
    and Chess. These bots could replace a human player in games that require technique
    and strategy. This was not just an entertaining phenomenon to spectate, but also
    a measure of how advanced the AI technologies were. Seems pretty harmless, right?
    All the AI did was play a game really well.


    Later, however, people realised that if AI bots could replace world class champions
    in games, then they can definitely be used in more cardinal situations. However,
    this did have its own drawbacks.


    A very popular example of this is when `amazon.com Inc`. attempted to replace
    their human recruiters with AI recruiters. The results were not what was expected,
    as the machines became gender-biased and began rejecting applicants that were
    female. This caused quite a stir, as is expected, but also taught AI developers
    a valuable lesson when it comes to building self-learning machines.


    Let’s have a brief look at what happened.'
