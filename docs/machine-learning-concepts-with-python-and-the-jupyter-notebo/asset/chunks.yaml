- fmt: '# TensorFlow at a Glance


    TensorFlow was developed by the Google Brain Team as a step up from the original
    DistBelief system, which was a closed-sourced software used for machine learning
    with deep neural networks. According to the official website:


    > “TensorFlow is an end-to-end open source platform for machine learning. It has
    a comprehensive, flexible ecosystem of tools, libraries and community resources
    that lets researchers push the state-of-the-art in ML and developers easily build
    and deploy ML-powered applications.”


    In other words, TensorFlow is an open source library that employs machine learning
    and deep learning techniques for large-scale computations. It involves the use
    of “tensors,” which help in making our calculations simpler. We will delve deeper
    into that in the next section.


    **Fun Fact**


    TensorFlow was not, in actuality, meant for public access. It was only meant to
    be used by the Google Brain Team for their own research. It was, however, finally
    released to the public on November 9, 2015.


    TensorFlow was released under Apache License 2.0. This means that people can use,
    modify, and distribute the software, as well as its modified versions, without
    worrying about royalties. All it requires for redistributions is an attribution
    notice. This is why the Apache License 2.0 is known as a copyleft license. It
    has minimum conditions for software redistribution and allows the software to
    be accessed, modified, and distributed, all for a common good.


    TensorFlow consists of two main components, as follows:


    1. *Tensors*, in which the data is held

    2. *Flow*, referring to the computational graph


    Let’s see how the two work together to create large-scale deep learning models.


    ## Tensors


    Tensors can be defined as multi-dimensional arrays.


    We might remember learning about dimensions in school. A dimension is roughly
    defined as the minimum number of coordinates that are needed to describe a particular
    point. In simpler words, it is the measure of the amount of space that an object
    occupies. For example, a line has only one dimension (length), while a square
    has two dimensions (length and width). In mathematics, we can have a number or
    a set of numbers arranged in various dimensions.


    In mathematics and physics, we have learned about scalars, vectors, and matrices,
    which are three constructs that describe the arrangement of some values.


    A single number is known as a *scalar*. More than one number arranged in a one-dimensional
    list (array) is known as a *vector*. More than one number arranged in a two-dimensional
    manner is known as a *matrix*. Visually, we can represent these three concepts
    as shown in Figure 8-1.


    ![../images/491271_1_En_8_Chapter/491271_1_En_8_Fig1_HTML.jpg](images/491271_1_En_8_Chapter/491271_1_En_8_Fig1_HTML.jpg)


    **Figure 8-1** – A scalar, vector, and matrix


    Technically speaking, scalars, vectors, and matrices are all tensors.


    * Scalars are zero-dimensional tensors.

    * Vectors are one-dimensional tensors.

    * Matrices are two-dimensional tensors.


    However, it is a universally accepted practice that when we have more than one
    number arranged in three or more dimensions, we refer to such an arrangement as
    a *tensor*.


    We can picture a tensor in the shape of a Rubik’s cube, as shown in Figure 8-2.


    ![../images/491271_1_En_8_Chapter/491271_1_En_8_Fig2_HTML.jpg](images/491271_1_En_8_Chapter/491271_1_En_8_Fig2_HTML.jpg)


    **Figure 8-2** – A tensor


    From the picture, we can see that tensors have a great capacity for data storage,
    as they have *n* dimensions. The *n* here is used as a proxy for the actual number
    of dimensions, where *n* >= 3.


    To better understand the relationship between scalars, vectors, matrices, and
    tensors, we can depict them as shown in Figure 8-3.


    ![../images/491271_1_En_8_Chapter/491271_1_En_8_Fig3_HTML.jpg](images/491271_1_En_8_Chapter/491271_1_En_8_Fig3_HTML.jpg)


    **Figure 8-3** – Notational representations of a scalar, vector, matrix, and tensor


    As you can see, the four data structures are quite similar to each other notation-wise
    as well, differing with respect to their capacity.


    Although tensors usually hold numbers, they can also hold text and strings. Tensors
    are capable of containing large amounts of data in a compact form. This makes
    it easier to handle the computation of our program, even when we have enormous
    amounts of data that we need to use to train our machine.


    ## Flow


    The input of the program is taken in the form of tensors, which are then executed
    in distributed mode with the help of computational graphs. These graphs are used
    to set the *flow* of the entire program.


    A computational graph is a flowchart of operations and functions that are needed
    to be carried out on the input tensor. The tensor enters on one side, goes through
    a list of operations, then comes out the other side as the output of the code.


    This is how TensorFlow got its name—the input tensor follows a systematic flow,
    thus producing the necessary output.


    Now that we know what TensorFlow is, let’s examine how it is useful to machine
    learning developers.


    ## Importance of TensorFlow


    TensorFlow was mainly used for mathematical purposes. It was soon implemented
    in machine learning due to its high-powered computational capabilities. It made
    the construction of neural networks a less cumbersome task to achieve.


    As the earlier definition states, TensorFlow is extremely flexible in operability
    and works well for machine learning algorithms across a range of platforms, like
    Mac OS, Windows, Linux, and Android. It was written in three languages, Python,
    C, and CUDA (Compute Unified Device Architecture), and although it works best
    with Python, it supports other languages like Java and C++.


    It is also consistently revamped to keep it up to date with the constantly changing
    needs of programmers. Its large community is a major plus point, as this allows
    people who use TensorFlow to work together, help each other, and use the library
    effectively.


    ## Applications of TensorFlow


    Despite being relatively new, TensorFlow has already served its purpose in several
    areas of artificial intelligence, and continues to do so. Some of its applications
    include the following:


    * **Image recognition:** Identifying objects or features from a photo or a video

    * **Image classification:** Identifying and segregating objects from each other

    * **Text summarization:** Condensing content into a few comprehensible words

    * **Sentiment analysis:** Identifying whether a statement is positive, negative,
    or neutral

    * **Speech recognition:** Recognizing and translating the spoken word into text

    * **Other deep learning projects**


    With TensorFlow, deep learning using neural networks becomes a piece of cake.
    Hence, most of the library’s applications are focused on this area of artificial
    intelligence.


    ## TensorFlow’s Competitors


    TensorFlow, although quite unique in its structure and usage, does have some competitors
    in the machine learning world. These are alternative frameworks that people use
    to perform the same functions that TensorFlow does. Some of these libraries include
    the following:


    * Theano

    * OpenCV

    * PyTorch

    * Apache Spark

    * Keras


    All these libraries, although varying in functionality and capability, have similar
    uses in machine learning. The Keras library can be used on top of TensorFlow to
    develop even more effective deep learning models. We will have the opportunity
    to work with Keras and TensorFlow later on in this book.


    Let’s now have a look at some of the advantages and disadvantages of using TensorFlow.


    ## Advantages and Disadvantages of TensorFlow


    Now that we are quite acquainted with this machine learning library, let us have
    a look at some of its advantages, as well as its disadvantages, when implementing
    it in our programs.'
