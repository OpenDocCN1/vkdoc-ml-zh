    ```\n\nThis will give us the test image shown in Figure [11-13](#491271_1_En_11_Chapter.xhtml#Fig13).\n\
    \n![../images/491271_1_En_11_Chapter/491271_1_En_11_Fig13_HTML.jpg](images/491271_1_En_11_Chapter/491271_1_En_11_Fig13_HTML.jpg)\n\
    \n**Figure 11-13** The test image\n\nWe can now proceed to convert the image into\
