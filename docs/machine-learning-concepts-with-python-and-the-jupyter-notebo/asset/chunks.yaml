    # 9. 使用 TensorFlow 编程


    到目前为止，我们已经了解了 Python 如何借助其众多专为机器学习而创建的库来实现这一有利可图的目标。我们还知道 Jupyter Notebook 是一个可靠的开发环境，可用于构建和运行大型程序。


    在本章中，我们将了解如何借助 TensorFlow 库进行编程。本章将介绍最初的 TensorFlow 版本（TensorFlow 1.0），目的是让我们熟悉该库在
    2.0 重大演进之前的工作方式。


    现在，不必担心需要亲自尝试这些程序。如果你是 TensorFlow 的初学者，可以从较新的版本开始编码，稍后你将学习如何操作。本章的主要目的是让你了解原始
    TensorFlow 在编程便捷性方面与其升级版本有何不同。


    我们将通过四个处理一些重要编程概念的程序来实现这一目标。它们划分如下：


    *   **程序 1：Hello World**


    *   这是编程界普遍采用的入门级程序。它将教会我们如何编程让机器打印一条语句。


    *   **程序 2：常量、变量和占位符**


    *   这将帮助我们理解常量、变量和占位符的重要性。它进一步分为两个子部分：


    *   部分 A：常量和变量


    *   部分 B：占位符


    *   **程序 3：计算图中的操作**


    *   这将让我们更好地理解计算图在 TensorFlow 程序中是如何工作的。


    *   **程序 4：从用户处获取占位符的输入**


    *   这将向我们展示如何从用户处获取输入，将其存储在占位符中，然后使用输入的值来显示所需的某些结果。


    那么，事不宜迟，让我们直接开始吧！


    ## 导入 TensorFlow 库


    我们需要做的第一件事是将 TensorFlow 库导入到 Jupyter Notebook 中。命令如下：


    ```

    import tensorflow as tf

    ```


    `tf` 有点像给这个库起的昵称。这是因为，随着我们深入程序，我们需要在调用其各种实用程序时不断引用该库，而每次都输入全名会相当繁琐。我们也可以将 `tf`
    替换为任何其他名称，比如 `joe` 或 `jane`，但 `tf` 是普遍接受的名称，因此建议使用它。这也使得其他阅读代码的人更容易理解正在引用的是哪个库。


    一旦我们将此命令输入到“代码”单元格并执行，TensorFlow 就会被导入到 Jupyter Notebook 中。我们现在就可以开始用它编程了。


    ## 程序 1：Hello World


    我们都知道我们能学到的最基本的程序是“Hello World”程序。我们之前用常规的 Python 做过这个。现在让我们使用 Python 中的 TensorFlow
    来做这件事。


    使用常规 Python 和使用 Python 的 TensorFlow 之间的区别在于代码结构不同，正如你将看到的。在常规 Python 中，程序如下：


    ```

    h = print("Hello World")

    h

    ```


    然而，在 TensorFlow 中，由于库的内部结构，它会变得稍微复杂一些。程序看起来是这样的：


    ```

    h = tf.constant("Hello World")

    sess = tf.Session()

    sess.run(h)

    ```


    在这种情况下，我们首先创建一个 TensorFlow 常量 `h`，并为其赋值 `Hello World`。如前所述，常量的概念将在下一个程序中涉及。


    接下来，我们需要创建一个会话，它可以执行整个图或图的一部分。相应地，它会分配资源并容纳值和结果。


    我们使用 `sess` 作为命令 `tf.Session` 的更简短、更易用的版本，因为在较大的程序中，我们需要不断运行和关闭多个会话，每次都写完整命令会很麻烦。


    现在，当我们执行程序时，输出将如下所示：


    ```

    Hello World

    ```


    如果我们不创建会话并尝试调用变量 `h` 来打印输出，我们仍然会得到一个输出，但并非我们所期望的方式。它不会给我们 `h` 的值，而是会显示 `h` 是一个张量，并给出这个张量的简要摘要。仅此而已。输出将显示如下：


    ```

    现在，正如你所看到的，我们在程序中使用了 `tf.constant()`

    函数，它将 `h` 定义为一个常量（而不是变量或占位符）。为了更好地理解常量、变量和占位符之间的区别，我们将看看另一个程序。


    程序 2：常量、变量和占位符

    我们很多人都经常听到*常量*、*变量*和*占位符*这些术语，尤其是在编程领域。这是因为它们在大量程序的开发中扮演着重要角色。


    在我们开始使用它们进行编码之前，我们需要确切地知道它们是什么。它们通常可以定义如下：


    *   **常量：** 这些是*从不改变*的值。

    *   **变量：** 这些是在整个程序中*可以改变*的值。

    *   **占位符：** 这些是在程序的*后期阶段被赋值*的空变量。


    表 9-1 列出了它们之间的一些不同之处。


    表 9-1

    常量、变量和占位符之间的区别


    常量 | 变量 | 占位符


    | --- | --- | --- | --- | --- | --- | --- |


    它们有初始值。 | 它们有初始值。 | 它们没有初始值。 |


    这些值从不改变。 | 这些值可以改变。 | 这些值可以改变。 |


    不需要指定值的类型。 | 不需要指定值的类型。 | 需要指定值的类型。 |


    示例：`a=tf.constant(4)` | 示例：`b=tf.Variable(5)` | 示例：`c=tf.placeholder(tf.float32)`
    |


    注意


    当我们说是否需要指定值的“类型”时，我们的意思是，我们不需要告诉程序常量或变量是字符串、浮点数、整数等，而对于占位符，我们需要指定这一点。


    现在我们已经了解了什么是常量、变量和占位符，让我们继续使用它们来创建一个程序。

