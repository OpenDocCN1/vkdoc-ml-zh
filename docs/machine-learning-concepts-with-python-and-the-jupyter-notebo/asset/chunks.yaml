  trans: '

    ### Python 的机器学习库


    首先，我们来理解什么是库。


    *编程世界中的库是方法和函数的集合，它允许用户执行各种任务，而无需为此编写必要的代码。*


    我们使用库是为了在编程时节省时间。Python 拥有大量开源的机器学习库，包括但不限于以下几种：


    *   **Pandas：** Pandas 库为用户提供了处理大型数据集的能力。它提供了用于读写数据、清洗和修改数据等功能的工具。


    *   **Numpy：** Numpy（即 Numerical Python）库为用户提供了强大的数组计算能力。它解决了数学计算速度慢的问题，并允许用户借助多维数组执行大规模计算。


    *   **Scipy：** Scipy 库用于科学和技术计算。它基于 Numpy 的多维数组进行工作。


    *   **Scikit-Learn：** Scikit-Learn 库包含各种专门为满足用户机器学习需求而设计的功能和方法。它利用了 Numpy 库，尤其是在数组操作方面。


    *   **TensorFlow：** TensorFlow 库是一个日益流行的库，它为用户提供了一套庞大且灵活易用的机器学习工具。你将在本书的后续部分了解更多关于
    TensorFlow 的内容。


    借助这些库，我们可以快速轻松地开发机器学习程序。


    ### Python 的其他应用


    由于 Python 作为一种编程语言具有多样化的功能，它的用途并不仅限于人工智能。它还用于各种其他应用。其中一些应用包括：


    *   网页开发


    *   数据分析


    *   教育目的


    *   软件测试


    *   计算机图形学


    *   游戏开发


    *   科学与数值计算


    *   桌面图形用户界面


    ## 安装 Python


    如前所述，Python 是免费下载的。根据你的操作系统和个人偏好，有几种方法可以将 Python 下载并安装到你的系统上。


    一种方法是从 Python 官方网站安装，该网站提供了一个安装程序，用户可以下载并在其计算机上运行。


    另一种方法是借助像 Homebrew 这样的包管理器来安装，这会使安装过程更加便捷。


    在本书中，我们将学习一种非常简单的方法——借助一个名为 Anaconda 的应用程序。


    *Anaconda 是 Python 和 R 编程语言的一个开源发行版。我们可以免费下载并在系统上使用它。*


    它的创建主要是通过简化包安装过程，使我们的机器学习流程更加容易。它拥有易于使用的界面，并且预装了 Python。它还能让安装 Jupyter Notebook
    应用程序的任务变得更加简单，我们将在下一章中看到这一点。


    现在让我们学习如何将 Anaconda 安装到我们的系统上。


    ### 使用 Anaconda 安装 Python


    在开始之前，我们必须查看 Anaconda 文档中给出的系统要求，以确保我们的系统能够毫无问题地支持 Anaconda。要下载 Anaconda，我们需要遵循以下步骤：


    ![../images/491271_1_En_5_Chapter/491271_1_En_5_Fig1_HTML.jpg](img/491271_1_En_5_Fig1_HTML.jpg)


    图 5-1


    选择要下载和安装的正确版本


    1.  访问 Anaconda 网站（[`https://www.anaconda.com/distribution/`](https://www.anaconda.com/distribution/)），找到适用于你操作系统的下载选项，如图
    5-1 所示。


    ![../images/491271_1_En_5_Chapter/491271_1_En_5_Fig2_HTML.jpg](img/491271_1_En_5_Fig2_HTML.jpg)


    图 5-2


    创建一个新的 Python 环境


    1.  由于 Anaconda 预装了 Python，当你下载 Anaconda 应用程序时，它允许你选择要安装的 Python 版本。选择可用的最新 Python
    版本，然后点击下载按钮。这里，我为我的 Mac OS 选择了 Python 3.7。


    2.  Anaconda 下载完成后，在计算机上找到该文件，然后双击它开始安装。


    3.  安装完成后，你将能够在应用程序列表中看到 Anaconda Navigator 图标。点击它。


    4.  你将看到一个显示一些有用的编程相关应用程序的屏幕。你还会看到，默认情况下，已经创建了一个包含 Python 及其库的 base（根）环境。


    5.  除了 base 环境之外，创建一个新的工作环境总是好的。为此，点击创建按钮。在出现的对话框中，你可以为新环境命名，选择你的 Python 版本，然后点击创建按钮，如图
    5-2 所示。


    ![../images/491271_1_En_5_Chapter/491271_1_En_5_Fig4_HTML.jpg](img/491271_1_En_5_Fig4_HTML.jpg)


    图 5-4


    未安装的包列表


    ![../images/491271_1_En_5_Chapter/491271_1_En_5_Fig3_HTML.jpg](img/491271_1_En_5_Fig3_HTML.jpg)


    图 5-3


    已安装的包列表


    1.  环境创建完成后，你需要将其选为工作环境。完成此操作后，你可以通过点击“环境”，然后从顶部的下拉菜单中相应选择“已安装”或“未安装”选项，来查看已安装和未安装的包列表，如图
    5-3 和图 5-4 所示。你甚至可以通过输入包名称来搜索特定的包。


    ![../images/491271_1_En_5_Chapter/491271_1_En_5_Fig5_HTML.jpg](img/491271_1_En_5_Fig5_HTML.jpg)


    图 5-5


    已选择要安装的包列表


    1.  现在，你可以开始安装一些机器学习所需的必要库，包括 Pandas、NumPy、SciPy、Scikit-learn、TensorFlow、Matplotlib
    和 Seaborn。搜索这些库，通过点击它们左侧的复选框进行选择，然后点击应用按钮，如图 5-5 所示。


    大功告成！你的 Python 环境现已下载、安装完毕，可以开始使用了！

