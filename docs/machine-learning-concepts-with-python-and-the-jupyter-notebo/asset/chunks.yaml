    \ deeper into this version of the library and see how TensorFlow\n2.0 makes machine\
    \ learning faster and easier."
  trans: '

    关于占位符（placeholder）的介绍就到这里了！通过这种方式，我们可以使用占位符将图的某个区域分配给某个值，该值将在后续程序中输入。当程序员在程序开始时不知道数据的某些特征时，这种方法尤其有用。例如，程序员可能不知道她/他将要使用的数据量。


    这很有趣，不是吗？你也可以尝试使用变量、常量和占位符。试着用它们编写一些小代码片段，看看你能得到什么结果。


    在下一个程序中，我们将了解 TensorFlow 中计算图的架构。


    **程序 3：计算图中的操作**


    到目前为止，我们已经了解到 TensorFlow 是借助计算图来工作的。这个图包含了我们声明的所有变量、执行的所有操作等等。它基本上在程序的幕后工作。在 TensorFlow
    中，图的每个节点都被称为一个操作，即使它只是一个初始化变量的命令。


    我们将从获取“默认图”开始，如下所示：


    ```

    graph = tf.get_default_graph()

    ```


    现在，让我们尝试从这个图中检索操作：


    ```

    graph.get_operations()

    ```


    我们会得到如下输出：


    ```

    [ ]

    ```


    这是因为我们还没有执行任何操作，所以图没有任何内容可以显示。


    现在，我们将开始向这个图添加一些节点。让我们使用一些我们已经学过的简单命令，如下所示：


    *   创建一个常量 `a`

    *   创建另一个常量 `b`

    *   求 `a` 和 `b` 的和，记为 `c`

    *   求 `c` 与一个常量的乘积，记为 `d`


    我们可以按如下方式操作：


    ```

    a = tf.constant(300, name = "a")

    b = tf.constant(65, name = "b")

    c = tf.add(a, b, name = "c")

    d = tf.multiply(c, 10, name = "d")

    ```


    在每一行中，`name` 仅用于可视化，以帮助我们理解计算图的概念。我们也可以给每个节点起任何其他名字，但我们分配了这些名字以避免混淆并促进更好的理解。


    现在，让我们通过输入以下两行代码来查看我们的图是什么样子，以便从中获取操作：


    ```

    operations = graph.get_operations()

    operations

    ```


    执行此操作将得到如图 9-1 所示的结果。


    ![../images/491271_1_En_9_Chapter/491271_1_En_9_Fig1_HTML.jpg](img/491271_1_En_9_Fig1_HTML.jpg)


    **图 9-1**

    计算图中的操作


    这向我们展示了图中存在的节点数量。我们输入了四个不同的节点，它们在这里连同它们的名字（`a`、`b`、`c` 和 `d`）和类型（分别是常量、常量、加法、乘法）一起显示。让我们再添加一个节点
    `e`：


    ```

    e = tf.multiply(a, 8, name = "e")

    operations = graph.get_operations()

    operations

    ```


    如果我们执行 `operations`，我们会发现节点数量增加了一个，这个额外的节点连同它的名字 `e` 和类型 `Mul` 一起显示，如图 9-2 所示。


    ![../images/491271_1_En_9_Chapter/491271_1_En_9_Fig2_HTML.jpg](img/491271_1_En_9_Fig2_HTML.jpg)


    **图 9-2**

    计算图中添加的操作


    我们现在可以在一个会话中运行这些节点中的任何一个或全部，如下所示。如你所见，我们执行了节点 `a` 和节点 `e`：


    ```

    sess = tf.Session()

    with tf.Session() as sess:

    result = sess.run(a, e)

    print result

    ```


    在这里，我们在一个 `with` 块内运行了会话。这是一种经常使用的方法，尤其是在需要多个会话时。与其单独声明 `sess` 变量，然后多次输入 `sess.run()`
    命令，我们不如在一个循环内完成整个过程。


    因此，我们可以看到计算图是如何工作的。当然，我们不一定需要开发这种程序，尤其是在机器学习中。然而，为了掌握 TensorFlow 中图的概念，仔细学习这部分内容是有好处的。


    **程序 4：从用户处获取占位符的输入**


    当涉及到创建模型来分析数据时，了解这类程序尤其有用。这是因为，作为开发人员，我们在创建程序时，实际上并不知道用户将提交什么样的数据。但是，我们需要确保我们的程序能够接收用户的输入，对其执行必要的计算，然后产生所需的输出。


    在这个程序中，我们首先创建两个占位符 `a` 和 `b`。然后我们声明 `c` 等于某个值，该值以需要 `a` 和 `b` 的方程形式给出。之后，我们规定
    `A` 是将要赋值给 `a` 的输入的变量名，`B` 是将要赋值给 `b` 的输入的变量名。最后，我们创建一个字典 `d`，其中 `a` 从 `A` 获取其值，`b`
    从 `B` 获取其值。然后我们运行会话来找到 `c` 的值。


    一旦我们实际输入并执行代码，这一切都会变得清晰得多。话不多说，让我们开始编写程序：


    ```

    a = tf.placeholder(tf.float32)

    b = tf.placeholder(tf.float32)

    c = (a*2) + b + 10

    A = input("Enter a value for a: ")

    B = input("Enter a value for b: ")

    d = {a:A, b:B}

    with tf.Session() as sess:

    result = sess.run(c, feed_dict = d)

    print result

    ```


    现在，当我们执行整个程序时，我们将有机会为 `A` 和 `B` 提交一个值。这些值被输入到程序中并进行计算，然后显示方程的结果。


    **任务时间**


    持续执行此程序以更改 `a` 和 `b` 的值，并观察 `c` 的值如何相应变化。也尝试更改 `c` 的方程，看看会发生什么。


    **关闭会话**


    当我刚开始使用 TensorFlow 库时，我会练习运行不同类型的代码，只是为了让自己更熟悉它。这意味着我一天内会打开多个会话来执行各种命令。然而，直到后来，我才了解到关闭会话的重要性。


    我们在 TensorFlow 中关闭会话主要是为了释放资源并减少对计算能力的不必要使用。我们使用以下命令来执行此操作：


    ```

    sess.close()

    ```


    这告诉系统我们的会话结束了，因此它不再需要计算任何东西。但是，如果我们在 `with` 块内运行会话，则无需担心添加这额外的一行代码，因为一旦到达块的末尾，会话会自动关闭。


    至此，我们已经介绍了使用 TensorFlow 1.0 进行编程的一些基础知识！


    **总结**


    在我们编程时，也许注意到代码的某些部分看起来有点……嗯，不必要，对吧？例如，我们需要不断地打开（然后关闭）会话。或者，我们需要在使用变量之前初始化它们。好吧，我们不能责怪
    TensorFlow 的开发者——他们最初在创建这个库方面做得相当不错。但很快连他们也意识到，这个库可以进一步改进，以使程序员使用 TensorFlow 编码的任务更加简单。


    那么，他们做了什么？

    他们推出了 TensorFlow 2.0。

    这个新版本包含了一些更新和更改，这些更新和更改考虑了原始版本的所有问题和不便之处。让我们更深入地了解一下这个版本的库，看看 TensorFlow 2.0 如何使机器学习更快、更容易。

    '
- fmt: '# 10. Introducing TensorFlow 2.0


    TensorFlow 2.0 came as a huge blessing to the machine learning world. It was announced
    during the TensorFlow Dev Summit of 2019. At the time, it was still in its alpha
    version. Despite its being an unofficial release, it had already gathered quite
    a bit of attention from programmers, who soon realized that it was definitely
    a significant improvement from what it used to be.


    This new version was developed so as to provide programmers with a machine learning
    library that is powerful, easy to implement, and convenient to use on any platform.
    It is meant to challenge its parent version by making programming even easier
    than before. It is also relatively less challenging for machine learning enthusiasts
    to pick up, especially if they are new to the TensorFlow library.


    The newest release of TensorFlow specifically kept the challenges of the former
    release in mind. Some irksome features were removed, and some useful features
    were added. Of course, TensorFlow 2.0 is not the ultimate package—there is still
    plenty of room for improvement. But so far, it seems to have garnered a good amount
    of approval from programmers worldwide.


    ## Features of TensorFlow 2.0


    Since TensorFlow 2.0 was developed as a finer version of the original and not
    as a separate library of its own, many of its features are similar to those of
    TensorFlow 1.0. The two differ mainly with regard to a few areas where programmers
    noted certain avoidable attributes. That said, here are some key features of TensorFlow
    2.0.


    ### Eager Execution


    According to the official website:


    > TensorFlow’s eager execution is an imperative programming environment that evaluates
    operations immediately, without building graphs: operations return concrete values
    instead of constructing a computational graph to run later.


    In other words, iteration occurs at once, and we need not create a computational
    graph or run separate sessions for each command. It has a natural and steady flow,
    and does not need to be controlled by a graph. It is intuitive because it ensures
    that the code follows the correct layout and structure. It also allows us to use
    regular Python debugging tools to identify and rectify any errors that may exist
    within the code.


    This is different from TensorFlow’s original “lazy” execution, where the programmer
    had to build a graph and run their lines of code within a session.


    ### Introduction of Keras


    TensorFlow implemented the Keras API as a powerful tool that can be used for model
    building. It supports eager execution and several other functionalities of TensorFlow.
    It is versatile, reliable, and effective in its working. It has been added to
    TensorFlow 2.0 for this very reason.


    Keras used to be an independent package on its own, which users would download
    separately and use within their models. Slowly, TensorFlow added it to its framework,
    as `tf.keras`. This `tf.keras` sub-package was different from the main Keras package,
    so as to ensure compatibility and stability. Later, with the announcement of TensorFlow
    2.0, the TensorFlow team stated that Keras would be the main high-level API of
    this version.


    ### API Cleanup


    TensorFlow has a multitude of APIs (Application Program Interface) for several
    different programming languages that can be used within a piece of code. These
    APIs are sets of tools, utilities, and systematic procedures that perform a particular
    action when called within a program.


    Some of these APIs were considered to be deprecated—they did not seem to be very
    useful to programmers. Other APIs seemed to have similar functionalities and characteristics.
    Thus, while developing TensorFlow 2.0, the team decided to do some spring cleaning
    in this section. Many of the APIs have therefore either been removed, replaced,
    or collected under a single sub-package.


    ### Removal of Global Variables


    In the previous version of TensorFlow, variables needed to be initialized before
    they could be used in a session. This was done with the help of the `tf.global_variables_initializer()`
    function, which would set up an operation to initialize all the variables declared
    in the code parallelly.


    You might remember doing this in the previous chapter, where we entered a line
    of code like this:


    ```

    init_ops = tf.global_variables_initializer

    ```


    After this, we opened a new session, ran `init_ops`, and then proceeded to run
    the rest of our variables.


    In TensorFlow 2.0, all the namespaces and mechanisms that were used to keep track
    of variables have been removed. Variables no longer need to be initialized before
    running them. They can be used directly as and when required.


    ### Better Deployment Capabilities


    TensorFlow has always provided users with the ability to work across several platforms
    and languages in order to develop and train models easily. TensorFlow 2.0 brings
    better compatibility and stability for this.


    A fully trained and saved model can either be integrated directly into the application
    that we are working on, or deployed with the help of some important libraries,
    including the following:


    - **TensorFlow Serving**, which enables us to implement models over HTTP/REST
    or gRPC/Protocol buffers.

    - **TensorFlow Lite**, which enables us to implement models for mobile devices
    like Android or iOS, and embedded systems like the Raspberry Pi.

    - **TensorFlow.js**, which enables us to implement models for JavaScript environments.

    - **Additionally**, TensorFlow provides support for other programming languages
    like C, Java, Julia, and so on.


    ### Powerful Experimentation Tools


    Researchers can easily carry out their experiments with the help of TensorFlow
    2.0, which allows them to actualize their ideas without having to compromise on
    speed and effectiveness.


    We already learned that Keras has been added as a central high-level API to TensorFlow.
    Keras and similar APIs have been added to make the process of model building,
    improving, and training even faster and better. In fact, low-level APIs and high-level
    APIs work together for extra efficiency.


    It is also easier to control gradient operations. Some extensions have been added
    as well to boost the research capabilities of the library.


    ### Increase in Productivity


    TensorFlow initially gained its fame because it effectively assisted machine learning
    developers and escalated their productivity. Its features and provisions greatly
    benefitted programmers. It saved them time and reduced their effort, while simultaneously
    helping them to achieve more.


    TensorFlow 2.0, having upgraded from that, further increases productivity. It
    provides for intuitive debugging, immediate computation, scalability, and simplicity.
    It is also relatively easier to learn, especially for beginners.


    TensorFlow 2.0 is most certainly a powerful, substantial, and robust upgrade to
    its predecessor. However, considering the fact that experienced artificial intelligence
    enthusiasts have been using TensorFlow 1.0 for a long time now, transitioning
    over to the newer version does provide many challenges.


    Some have been debating whether TensorFlow 2.0 is really a boon or a bane. While
    they agree that the upgrade has its benefits, they also acknowledge that it will
    not be so easy for people to adapt to it, especially if they have already built
    working machine learning models. Also, adjusting to the new syntax can prove to
    be a slight obstacle, which people might feel to be unnecessary.


    Let’s have a look at Table 10-1, which lists some of the arguments that have been
    put forward as the advantages and disadvantages of TensorFlow 2.0.


    **Table 10-1** TensorFlow 2.0 Pros and Cons


    | Pros | Cons |

    |------|------|

    |      |      |'
