    \ same folder as the Jupyter\nnotebook that you are working in. For example, if\
    \ your notebook is saved\nunder Desktop/My Programs, you can move the image to\
    \ Desktop/My Programs\nas well. This makes it easier for you to access it later\
    \ on in your\ncode, without the need for typing in the entire file path.\n\n**Step\
    \ 5: Prepare the image for the model.**\n\nWe first need to convert the image’s\
    \ pixels into a Numpy array, like\nthis:\n\n```\nimage = img_to_array(image)\n\
    ```\n\nWe then need to reshape the array, like this:\n\n```\nimage = image.reshape((1,\
    \ image.shape[0], image.shape[1], image.shape[2]))\n```\n\nFinally, we will preprocess\
