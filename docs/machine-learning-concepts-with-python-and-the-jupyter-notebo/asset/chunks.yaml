  trans: "\n与 TensorFlow 1.0 相比，学习起来要容易得多，这得益于其流畅的流程和简化的结构。因此，对于完全不了解 TensorFlow 库的新手来说，他们很快就能学会。\
    \  \n而那些已经掌握 TensorFlow 1.0 的人，则必须摒弃旧知识，才能理解并高效使用 TensorFlow 2.0。  \n\n它与常规的 Python\
    \ 编程语言非常相似。这意味着 Python 开发者无需担心为了用 TensorFlow 编程而学习太多额外的命令。  \n任何包含会话（session）的\
    \ TensorFlow 1.0 代码都无法在 TensorFlow 2.0 中顺利运行，只能在旧版本中执行。  \n\n由于许多 API 已被整合，大部分使用高级\
    \ API（如 Keras）的代码无需修改仍可继续使用。  \n如果代码需要在 2.0 中运行，则必须手动重写，或使用库提供的升级工具进行转换。  \n\n\
    尽管存在这些争议，但我们知道需要为变革留出空间，尤其是当变革是为了变得更好时。缺点虽然存在，但对程序员来说并非显著不利。它们只是一些可以轻松解决的小麻烦。\
    \  \n\n**代码对比**  \n到目前为止，我们只了解了 TensorFlow 2.0 的各种特性。一旦我们开始实际用它编程，其功能就会更有意义。如前所述，这两个版本在编写代码方面有所不同。在本节中，我们将对比两个版本，看看代码有何不同。\
    \  \n\n我们主要讨论五个存在显著差异的方面：  \n\n1.  `tf.print()` 函数  \n2.  惰性执行 vs. 即时执行  \n3.\
    \  移除 `tf.global_variables_initializer()`  \n4.  无占位符  \n5.  `@tf.function` 装饰器\
    \  \n\n针对每个方面，我们还会看一些小例子。这样，我们就能清楚地了解每个版本的编程风格有何不同。  \n\n**tf.print() 函数**  \n\
    TensorFlow 2.0 引入了一个与常规 Python 中 `print` 命令非常相似的命令。在 TensorFlow 2.0 中，我们可以用一行代码使用\
    \ `tf.print()` 函数来显示我们选择的任何语句或字符。  \n\n其用法如下：  \n\n```\ntf.print(  )\n```\n\n\
    **TensorFlow 1.0**  \n\n在 TensorFlow 1.0 中，打印内容并不这么简单。它需要一些额外的步骤，如下所示：  \n\n```\n\
    import tensorflow as tf\nh = tf.constant(\"这是一个 TensorFlow 1.0 程序\")\nsess = tf.Session()\n\
    print(sess.run(h))\nsess.close()\n```\n\n看到了吗？我们必须声明 `h`，说明它等于给定的常量（即我们要打印的句子），打开一个会话，在该会话中运行\
    \ `h`，打印它，然后关闭会话。  \n那么 TensorFlow 2.0 呢？  \n\n**TensorFlow 2.0**  \n\n```\nimport\
    \ tensorflow as tf\nh = tf.constant(\"这是一个 TensorFlow 2.0 程序\")\ntf.print(h)\n\
    ```\n\n事实上，我们还可以更进一步，让它更简单：  \n\n```\nimport tensorflow as tf\ntf.print(\"这是一个\
    \ TensorFlow 2.0 程序\")\n```\n\n看到了吗？多么快捷！  \n因此，在 TensorFlow 1.0 中，程序要求我们将字符串声明为常量，创建会话，然后在会话中执行它才能打印出字符串。而在\
    \ TensorFlow 2.0 中，我们只需为字符串定义一个变量，然后输入命令 `tf.print()`，它就会显示输出。我们甚至可以直接打印出想要的内容，而无需为其分配变量名。\
    \  \n这就是 TensorFlow 2.0 的即时执行与 TensorFlow 1.0 的惰性执行的不同之处。接下来我们将更详细地观察这一点。  \n\n\
    **惰性执行 vs. 即时执行**  \nTensorFlow 1.0 采用惰性执行。它不会立即执行代码。相反，它会等待图中的特定节点在会话中被执行，然后才会运行。\
    \  \n下面是一个例子，其中有一段代码用于打印“Hello There”，计算 90 和 7 的和，并显示一个声明为 300 的变量的值。  \n\n**TensorFlow\
    \ 1.0**  \n\n```\nimport tensorflow as tf\na = tf.constant(\"Hello There\")\n\
    b = 9+70\nc = tf.Variable(300)\ninit_op = tf.global_variables_initializer()\n\
    sess = tf.Session()\nprint(sess.run(init_op))\nprint(sess.run(a))\nprint(sess.run(b))\n\
    print(sess.run(c))\n```\n\n**TensorFlow 2.0**  \n在 TensorFlow 2.0 中，惰性执行被即时执行取代。这意味着代码现在可以直接执行。无需先构建计算图，然后在会话中运行每个节点。每一行代码都会立即执行。\
    \  \n\n我们可以在这里看到，我们编写了与之前相同的代码，但使用的是 TensorFlow 2.0：  \n\n```\nimport tensorflow\
    \ as tf\na = tf.constant(\"Hello There\")\nb = 9+70\nc = tf.Variable(300)\ntf.print(a)\n\
    tf.print(b)\ntf.print(c)\n```\n\n如你所见，第一组代码采用惰性执行方式，使用了分布式图，而第二组代码则没有。它采用了即时执行方式。第二段代码也比第一段更短，因为它没有那么多步骤。\
    \  \n\n**移除 tf.global_variables_initializer()**  \n仔细看看我们刚才看到的程序。我提到我们跳过了一些步骤，对吧？其中一个步骤就是添加\
    \ `tf.global_variables_initializer()` 函数，我们根本没有使用它。  \n原因在于，如前所述，在 TensorFlow\
    \ 2.0 中我们不需要初始化变量。定义变量后，我们可以直接在程序中使用它们。  \n为了更清楚地了解，我们来看一段在 TensorFlow 1.0 中声明变量并显示它的代码。\
    \  \n\n**TensorFlow 1.0**  \n\n```\nimport tensorflow as tf\nv = tf.Variable(8)\n\
    init_op = tf.global_variables_initializer()\nsess = tf.Session()\nsess.run(init_op)\n\
    print(sess.run(v))\n```\n\n很简单，对吧？现在，我们来看看用 TensorFlow 2.0 编写的相同代码。  \n\n**TensorFlow\
    \ 2.0**  \n\n```\nimport tensorflow as tf\nv = tf.Variable(8)\ntf.print(v)\n```\n\
    \n输出结果相同，但过程简短得多。事实上，代码行数减少了一半。而且，这里我们不必初始化变量 `v`，可以直接给它赋值。  \n说到变量，还记得在之前的一章中，我们学习了另一个叫做占位符的概念吗？嗯，TensorFlow\
    \ 团队决定在升级版中不再保留占位符，因此他们将其去掉了。我们将在下一节中进一步了解这一点。  \n\n**无占位符**  \n我们已经知道，占位符不过是一个可以在程序后期阶段赋值的变量。这意味着，与变量不同，占位符不需要初始值。在\
    \ TensorFlow 1.0 中，占位符的使用是该版本惰性执行风格的结果，我们可能还记得前一章中的程序。然而，随着 TensorFlow 2.0 的即时执行，占位符不再需要。这是因为操作被创建后会立即被评估。\
    \  \n为了快速回顾占位符在 TensorFlow 1.0 中的使用方式，我们将看一个小例子。让我们考虑一个程序，其中我们声明一个常量 `a`，一个占位符\
    \ `b`，以及一个由 `a` 和 `b` 组成的方程 `c`。然后我们使用 `feed_dict` 命令将数字 3 赋值给占位符 `b`。最后，将 `a`\
    \ 和 `b` 的值输入 `c` 以获得方程的结果。  \n\n**TensorFlow 1.0**  \n\n```\nimport tensorflow\
    \ as tf\na = tf.constant(5)\nb = tf.placeholder(tf.float32)\nc = a*b\nsess = tf.Session()\n\
    sess.run(print(c, feed_dict = {b : 3})\nsess.close()\n```\n"
- fmt: "# TensorFlow 2.0 中的变化\n\n现在，当我们使用 TensorFlow 2.0 时，我们不必创建任何占位符。我们可以直接定义常量\
    \ `a`、变量 `b` 和方程 `c`，然后打印 `c` 的值。\n\n当我们定义 `c` 为 `a` 和 `b` 的乘积时，代码会自动计算 `a` 和\
    \ `b` 的值，然后将其存储在 `c` 中。接下来，当我们打印 `c` 时，它会显示计算结果。因此，程序的执行速度变得更快，如下所示。\n\n## TensorFlow\
    \ 2.0\n\n```python\nimport tensorflow as tf\na = tf.constant(6)\nb = tf.Variable(2)\n\
    c = a*b\ntf.print(c)\n```\n\n看看程序变得多么简单？它几乎与常规的 Python 程序相似。我们无需担心先设置占位符，然后向其中输入数据，最后执行某些代码。一切都能快速且即时地完成。\n\
    \n# `@tf.function` 装饰器\n\n我们知道，由于 TensorFlow 2.0 遵循即时执行模式，因此无需先创建计算图，再通过会话运行程序。这是否意味着我们无法再以分布式方式运行程序？完全不是。我们仍然可以以分布式方式执行程序。我们只需将那段代码写成函数形式，然后在代码前加上\
    \ `@tf.function` 装饰器即可。TensorFlow 会理解该代码旨在以分布式方式执行，并据此进行处理。\n\n让我们通过一个示例来看。在这里，我们首先初始化\
    \ `x`、`y` 和 `z` 的值。然后创建一个函数 `result`，在其中计算 `a`（即三个值的和），并将 `a` 的值作为函数输出返回。之后，我们声明\
    \ `b`，它调用函数 `result`，并将给定的 `x`、`y` 和 `z` 值作为输入提供给它，然后将计算结果赋值给 `b` 进行显示。最后，我们再次声明\
    \ `b`，但这次调用函数 `result` 时，我们为 `x`、`y` 和 `z` 提供新值，让函数计算结果，然后将其传递给 `b` 进行显示。\n\n\
    如果这些内容让你感到困惑，不必担心。代码比听起来要简单得多，如下所示。\n\n## TensorFlow 2.0\n\n```python\nimport\
    \ tensorflow as tf\nx = 7\ny = 8\nz = 9\n@tf.function\ndef result(x,y,z):\n  \
    \  a = x+y-z\n    return a\nb = result(x,y,x)\ntf.print(b)\nb = result(1,7,3)\n\
    tf.print(b)\n```\n\n你可能已经注意到，这里的函数使用了 `tf.function` 装饰器，这使其能够像图一样执行。\n\n> **注意**\n\
    > \n> 我们在此没有展示任何 TensorFlow 1.0 代码，因为该版本中不需要此装饰器。它仅在 2.0 版本中需要。\n\n因此，从我们刚刚看到的内容可以很容易地理解，TensorFlow\
    \ 相比以前有了相当大的升级。虽然需要一些时间来适应，但一旦开发者成功从 TensorFlow 1.0 过渡到 TensorFlow 2.0，他们将能够更快、更高效地实现机器学习需求。\n\
    \n对于那些在机器学习领域深耕已久的人来说，他们很可能在过去几年中一直使用 TensorFlow 1.0，这意味着他们可能已经借助该库辛苦开发了多个代码。因此，迁移到\
    \ TensorFlow 2.0 可能听起来不太有吸引力，因为他们需要弄清楚如何在新版本中重新创建所有代码。\n\n不用担心！TensorFlow 团队已经考虑到了这一点，并开发了一个相当可行的解决方案。他们提供了完整的迁移指南，帮助程序员从\
    \ 1.0 平滑过渡到 2.0。\n\n他们还推出了 `tf_upgrade_v2` 升级脚本，该脚本有助于自动进行必要的更改。这减少了程序员将代码转换为\
    \ TensorFlow 2.0 所需的时间和精力。\n\n在下一节中，我们将了解这个升级工具，看看它是如何工作的，以及如何在我们的代码中使用它。\n\n\
    # 从 TensorFlow 1.0 升级到 2.0\n\n开发 TensorFlow 的 Google Brain 团队知道，许多机器学习程序员已经使用\
    \ TensorFlow 1.0 开发了多个程序。如果必须用 TensorFlow 2.0 重写这些程序，那将是一件非常痛苦的事情，尤其是因为升级版本与其父版本截然不同。在此过程中还可能出现大量错误。\n\
    \n这就是他们提出一种方法来帮助开发者从 TensorFlow 1.0 迁移到 TensorFlow 2.0 的原因。该方法使用了 `tf_upgrade_v2`\
    \ 函数。\n\n> **注意**\n> \n> 如果你是 TensorFlow 的初学者，可能没有任何代码需要升级，在这种情况下，你可以跳过本节，直接进入下一章，在那里你将学习如何使用\
    \ TensorFlow 2.0 进行编程。\n\n## `tf_upgrade_v2` 升级脚本\n\n此工具旨在帮助开发者从 TensorFlow 1.0\
    \ 过渡到 TensorFlow 2.0，使过渡过程更简单、可能无缝衔接，并且比手动将代码从一个版本转换到另一个版本更加方便。它自动安装在 TensorFlow\
    \ 1.13 及更高版本中，使开发者能够轻松开始过渡。\n\n升级脚本具有以下优点：\n\n1.  它只有一行代码。\n2.  它耗时更少。\n3.  它为我们完成了大部分工作。\n\
    4.  它将升级后的代码保存在单独的文件中，而不是覆盖原始文件。\n5.  它在升级过程结束时生成一份报告，告知用户已完成的操作以及需要完成的操作。\n\n\
    因此，虽然手动更改代码并非完全禁止，但升级脚本似乎是达到最终目标的更短、更简单的路径，如图 10-1 所示。\n\n![../images/491271_1_En_10_Chapter/491271_1_En_10_Fig1_HTML.jpg](images/491271_1_En_10_Chapter/491271_1_En_10_Fig1_HTML.jpg)\n\
    \n**图 10-1** 手动升级与升级脚本对比\n\n现在，让我们看看如何使用此工具来过渡我们的代码。\n\n## 使用升级脚本\n\n尽管名称听起来像是只有专业人士才能尝试的高级操作，但实际上并非如此。事实上，一旦我们了解了这个脚本是什么，我们就会松一口气，因为它非常简单易用且易于实现。\n\
    \n该脚本的结构基本如下：\n\n```\ntf_upgrade_v2 --infile <input_file> --outfile <output_file>\n\
    ```"
  raw: "Now, when we use TensorFlow 2.0, we don’t have to\ncreate any placeholders.\
    \ We can directly define the constant `a`, variable `b`, and equation `c`, and\
    \ then print the\nvalue of `c`.\nWhen we define `c` as the product of\n`a` and\
    \ `b`, the code\nautomatically computes the values of `a` and `b` and then stores\
    \ it\nin `c`. Next,\nwhen we print `c`, it displays the\nresult of the computation.\
    \ The execution of the program thus becomes\nmuch faster, as we can see next.\n\
    \nTensorFlow 2.0\n\n```\nimport tensorflow as tf\na = tf.constant(6)\nb = tf.Variable(2)\n\
    c = a*b\ntf.print(c)\n```\n\nSee how easy the program has become? It’s almost\
    \ similar to a regular\nPython program. And we need not worry about first\nsetting\
    \ up a placeholder, then feeding data into it, and finally\nexecuting some code\
    \ with it. Everything is done quickly and\ninstantly.\n\n@tf.function Decorator\n\
    We know that, since TensorFlow 2.0 follows eager execution, there is\nno need\
    \ to create a computational graph first, followed by a session to\nrun our program.\
    \ Does this mean that we can no longer run a program in a\ndistributed manner?\n\
    Not at all. We can still carry out a distributed execution for our\nprogram. All\
    \ we need to do is write that piece of code in the form of a\nfunction, and then\
    \ use the `@tf.function`\ndecorator  as a\nprefix to the code. TensorFlow will\
    \ then understand that the code is\nmeant to be executed in a distributed manner,\
    \ and it will proceed to do\nso.\nLet’s see this in an example. Here, we first\
    \ initialize values for\n`x`, `y`, and `z`. We then create a\nfunction `result`\n\
    in which we find `a`, which is the sum\nof the three values, and we return the\
    \ value of `a` as the output of\nthe function. After this, we declare `b`, which\
    \ calls the\nfunction `result`, supplies it\nwith inputs as the given values of\
    \ `x`, `y`, and `z`, and assigns the\noutcome of this computation as the value\
    \ of `b` to be displayed.\nFinally, we once again declare `b`, but this time,\n\
    when we call the function `result`, we supply it\nwith new values for `x`, `y`,\
    \ and `z`, allow the function\nto compute this result, and then feed it to `b`\
    \ to be\ndisplayed.\nDon’t worry if none of that made sense to you. The code is\
    \ much\neasier than it sounds, as you will see next.\n\nTensorFlow 2.0\n\n```\n\
    import tensorflow as tf\nx = 7\ny = 8\nz = 9\n@tf.function\ndef result(x,y,z):\n\
    a = x+y-z\nreturn a\nb = result(x,y,x)\ntf.print(b)\nb = result(1,7,3)\ntf.print(b)\n\
    ```\n\nAs you may have already noticed, the function here is\ndecorated with `tf.function`,\
    \ which\nallows it to be executed like a graph.\n\nNote\n\nWe are not showing\
    \ any TensorFlow 1.0 code here because we do not\nneed this decorator in it. It\
    \ is only required in version 2.0.\n\nSo, from what we have just seen, it is easy\
    \ to understand that there\nhas been quite an upgrade from what TensorFlow used\
    \ to be. Although it\nwill take a little getting used to, once developers succeed\
    \ in making\nthe transition from TensorFlow 1.0 to TensorFlow 2.0, they will be\
    \ able\nto achieve their machine learning requirements faster and more\nefficiently.\n\
    Now, for those who have been in the machine learning field for a\nconsiderable\
    \ amount of time, it is highly likely that they have been\nusing TensorFlow 1.0\
    \ over the past few years, which means that they\nmight have even painstakingly\
    \ developed several codes with the help of\nthis library. Therefore, moving over\
    \ to TensorFlow 2.0 may not sound\nvery appealing, because they would have to\
    \ figure out how to recreate\nall their code in the newer version.\nNot to worry!\
    \ The TensorFlow team has already thought about this and\ndeveloped a pretty feasible\
    \ solution. They have provided a full\nmigration guide to help programmers make\
    \ a smooth transition from 1.0 to\n2.0.\nThey have also come up with the `tf_upgrade_v2`\
    \ upgrade\nscript, which helps in automatically making the necessary changes.\
    \ This reduces\nthe amount of time and effort required by the programmer to convert\n\
    their code to TensorFlow 2.0.\nIn the next section, we will have a look at this\
    \ upgrade tool to see\nhow it works and how it can be used in our code.\n\nUpgrading\
    \ from TensorFlow 1.0 to 2.0\nThe Google Brain team that developed TensorFlow\
    \ knew that many\nmachine learning programmers would have already developed several\n\
    programs using TensorFlow 1.0\\. It would be a huge pain to have to\nrewrite these\
    \ programs in TensorFlow 2.0, especially because the\nupgraded version is immensely\
    \ different from its parent version. There\nis also scope for plenty of errors\
    \ in such a process.\nThis is why they came up with a way to help developers migrate\
    \ from\nTensorFlow 1.0 to TensorFlow 2.0\\. It makes use of the `tf_upgrade_v2`\n\
    function.\n\nNote\n\nIf you are a beginner in TensorFlow, you may not have any\
    \ code to\nupgrade, in which case you can skip this section and move ahead to\
    \ the\nnext chapter, where you will learn how to program with TensorFlow\n2.0.\n\
    \nThe tf_upgrade_v2 Upgrade Script\nThis utility was created to help developers\
    \ in their transition from\nTensorFlow 1.0 to TensorFlow 2.0 by making it easier,\
    \ potentially\nseamless, and much more convenient than\nmanually converting the\
    \ code from one version to another. It is\nautomatically installed in TensorFlow\
    \ 1.13 and higher, allowing\ndevelopers to easily begin their transition.\n\n\
    The upgrade script has the following benefits:\n\n1.  It is just one line of code.\n\
    \n2.  It is less time consuming.\n\n3.  It does most of the work for us.\n\n4.\
    \  It saves the upgraded code in a separate file, instead of overwriting\n   \
    \ the original file\n\n5.  It produces a report at the end of the upgrade process\
    \ that tells the\n    user what was done and what needs to be done.\n\nThus, although\
    \ manually changing the code is not exactly prohibited, the\nupgrade script just\
    \ seems like a shorter and easier path to take to\nreach the final goal, as we\
    \ can see in Figure [10-1](#491271_1_En_10_Chapter.xhtml#Fig1).\n\n![../images/491271_1_En_10_Chapter/491271_1_En_10_Fig1_HTML.jpg](images/491271_1_En_10_Chapter/491271_1_En_10_Fig1_HTML.jpg)\n\
    \nFigure 10-1\nManual upgrade vs. the upgrade script\n\nLet’s now have a look\
    \ at how we can use this utility to transition\nour code.\n\nUsing the Upgrade\
    \ Script\nAlthough the name makes it sound like something very advanced that\n\
    can only be attempted by professionals, it\nreally isn’t so. In fact, once we\
    \ take a look at what the script is, we\nwill be able to sigh with relief at how\
    \ simple it is to follow and\nimplement.\n\nThe structure of the script is basically\
    \ like this:\n\n```\ntf_upgrade_v2 —infile  —outfile \n```"
  trans: "\n现在，当我们使用 TensorFlow 2.0 时，无需再创建任何占位符。我们可以直接定义常量 `a`、变量 `b` 和等式 `c`，然后打印\
    \ `c` 的值。\n当我们把 `c` 定义为 `a` 和 `b` 的乘积时，代码会自动计算 `a` 和 `b` 的值，并将其存储在 `c` 中。接着，当我们打印\
    \ `c` 时，它会显示计算结果。因此，程序的执行速度会快得多，如下所示。\n\nTensorFlow 2.0\n\n```\nimport tensorflow\
    \ as tf\na = tf.constant(6)\nb = tf.Variable(2)\nc = a*b\ntf.print(c)\n```\n\n\
    看看程序变得多简单了？它几乎和普通的 Python 程序一样。我们无需担心先设置占位符，再向其中输入数据，最后执行代码。一切都能快速即时地完成。\n\n@tf.function\
    \ 装饰器\n我们知道，由于 TensorFlow 2.0 采用即时执行模式，因此无需先创建计算图，再通过会话来运行程序。这是否意味着我们无法再以分布式方式运行程序了？\n\
    完全不是。我们仍然可以对程序进行分布式执行。我们只需将那段代码写成函数形式，然后在代码前加上 `@tf.function` 装饰器作为前缀。TensorFlow\
    \ 就会理解该代码旨在以分布式方式执行，并会照此运行。\n让我们通过一个示例来看一下。这里，我们首先为 `x`、`y` 和 `z` 初始化值。然后创建一个函数\
    \ `result`，在其中计算 `a`（即这三个值的和），并将 `a` 的值作为函数的输出返回。之后，我们声明 `b`，它调用函数 `result`，将给定的\
    \ `x`、`y` 和 `z` 值作为输入提供给它，并将此计算的结果赋给 `b` 进行显示。最后，我们再次声明 `b`，但这次调用函数 `result` 时，我们为\
    \ `x`、`y` 和 `z` 提供新值，让函数计算结果，然后将其输入到 `b` 中进行显示。\n如果你对此感到困惑，不必担心。代码比听起来要简单得多，你接下来就会看到。\n\
    \nTensorFlow 2.0\n\n```\nimport tensorflow as tf\nx = 7\ny = 8\nz = 9\n@tf.function\n\
    def result(x,y,z):\na = x+y-z\nreturn a\nb = result(x,y,x)\ntf.print(b)\nb = result(1,7,3)\n\
    tf.print(b)\n```\n\n你可能已经注意到，这里的函数使用了 `tf.function` 进行装饰，这使得它可以像计算图一样执行。\n\n注意\n\
    \n我们在此没有展示任何 TensorFlow 1.0 代码，因为其中不需要这个装饰器。它仅在 2.0 版本中需要。\n\n因此，从我们刚才看到的内容来看，很容易理解\
    \ TensorFlow 相比过去有了相当大的升级。虽然需要一点时间来适应，但一旦开发者成功地从 TensorFlow 1.0 过渡到 TensorFlow\
    \ 2.0，他们将能够更快、更高效地实现机器学习需求。\n现在，对于那些在机器学习领域深耕已久的人来说，他们很可能在过去几年中一直使用 TensorFlow\
    \ 1.0，这意味着他们可能已经借助这个库辛苦地开发了多个代码。因此，迁移到 TensorFlow 2.0 可能听起来并不那么吸引人，因为他们必须弄清楚如何在新版本中重新创建所有代码。\n\
    别担心！TensorFlow 团队已经考虑到了这一点，并开发了一个相当可行的解决方案。他们提供了一份完整的迁移指南，帮助程序员从 1.0 平滑过渡到 2.0。\n\
    他们还推出了 `tf_upgrade_v2` 升级脚本，该脚本有助于自动进行必要的更改。这减少了程序员将代码转换到 TensorFlow 2.0 所需的时间和精力。\n\
    在下一节中，我们将看看这个升级工具，了解它是如何工作的，以及如何在我们的代码中使用它。\n\n从 TensorFlow 1.0 升级到 2.0\n开发 TensorFlow\
    \ 的 Google Brain 团队知道，许多机器学习程序员已经使用 TensorFlow 1.0 开发了多个程序。用 TensorFlow 2.0 重写这些程序将非常痛苦，尤其是因为升级版本与其父版本截然不同。在这个过程中也容易出现大量错误。\n\
    这就是他们提出一种方法来帮助开发者从 TensorFlow 1.0 迁移到 TensorFlow 2.0 的原因。该方法使用了 `tf_upgrade_v2`\
    \ 函数。\n\n注意\n\n如果你是 TensorFlow 的初学者，可能没有任何代码需要升级，在这种情况下，你可以跳过本节，直接进入下一章，在那里你将学习如何使用\
    \ TensorFlow 2.0 进行编程。\n\ntf_upgrade_v2 升级脚本\n创建此实用程序是为了帮助开发者更轻松、更无缝、更方便地从 TensorFlow\
    \ 1.0 过渡到 TensorFlow 2.0，而不是手动将代码从一个版本转换到另一个版本。它会自动安装在 TensorFlow 1.13 及更高版本中，使开发者能够轻松开始他们的过渡。\n\
    \n升级脚本具有以下优点：\n\n1.  只需一行代码。\n\n2.  更省时。\n\n3.  替我们完成了大部分工作。\n\n4.  将升级后的代码保存在单独的文件中，而不是覆盖原始文件。\n\
    \n5.  在升级过程结束时生成一份报告，告知用户已完成的操作以及需要完成的操作。\n\n因此，虽然手动更改代码并非完全禁止，但升级脚本似乎是达到最终目标的一条更短、更简单的路径，如图\
    \ 10-1 所示。\n\n![../images/491271_1_En_10_Chapter/491271_1_En_10_Fig1_HTML.jpg](img/491271_1_En_10_Fig1_HTML.jpg)\n\
    \n图 10-1\n手动升级与升级脚本对比\n\n现在，让我们看看如何使用这个实用程序来过渡我们的代码。\n\n使用升级脚本\n虽然这个名字听起来像是非常高级、只有专业人士才能尝试的东西，但实际上并非如此。事实上，一旦我们看看这个脚本是什么，我们就能松一口气，因为它非常简单易用。\n\
    \n该脚本的结构基本上是这样的：\n\n```\ntf_upgrade_v2 —infile  —outfile \n```\n"
- fmt: '好的，这是根据您的要求排版后的 Markdown 文档。


    Yup! That’s all it is.

    The double hyphen followed by `infile` is used to call the file that contains
    the old TensorFlow code. In this case, it would be the name of the Jupyter Notebook
    that contains the code. The double hyphen followed by `outfile` is used to rename
    the file that will be created when TensorFlow upgrades the code to its newer version.

    Now, before we begin typing this in, we need to import TensorFlow into our Jupyter
    notebook. After that, we can enter this code and add our file names accordingly.


    When we execute the cell, it will take a little time to perform its update, after
    which it will display the output. It also creates two new files:


    1.  A **report** about what it has done, which we can examine to check for any
    significant errors in the update. It mentions any keywords that have been added
    and arguments that have been renamed. It also recommends places where manual inspection
    would be preferable. All this is stored in the `report.txt` file.


    2.  The **new file** containing the TensorFlow 2.0 updates for which we had provided
    a name in the code line. This new model can be tested to ensure that it still
    produces the required result.


    Now that we’ve got some idea about how this script works, let’s try it out with
    the help of a small program. We will use the very basic “Hello World” program
    for this. I’m sure, by now, we all remember the code, which looks like this:


    ```

    import tensorflow as tf

    h = tf.constant("Hello World")

    sess = tf.Session()

    sess.run(h)

    sess.close()

    ```


    Let’s say this code is in a Jupyter notebook, and this notebook is saved under
    the name “Hello World 1.0.” To upgrade, first open a new Jupyter notebook. In
    the notebook, import TensorFlow 2.0, and then type in the upgrade script. The
    code will look like this:


    ```

    import tensorflow as tf

    tf_upgrade_v2 —infile "Hello World 1.0.ipynb"  —outfile "Hello World 2.0.ipynb"

    ```


    When we execute this cell, we will find the new Jupyter notebook titled “Hello
    World 2.0.” We will also find a detailed report of the upgrade in the form of
    a text document called `report.txt`.


    Click on the newly created Jupyter notebook. We will see that a few changes have
    been made. However, since this is not a very large program, not many alterations
    are required. The only significant change would be the modification that it makes
    to the `tf.Session()` line. It changes into the following:


    ```

    sess = tf.compat.v1.Session()

    ```


    When we open the report, it will show us the changes that it has made. For example,
    in this case, it will say the following:


    ```

    INFO: Renamed ''tf.Session'' to ''tf.compat.v1.Session''

    ```


    Note


    The `tf.compat.v1` module is used to allow the program to acquire TensorFlow 1.0–related
    functionalities, including sessions and placeholders.


    Of course, when we use the upgrade script for more advanced programs, there will
    be many more modifications made by the script, which will all be visible in the
    new notebook that will be generated, as well as in the report that it creates.
    We would also need to make a few extra changes ourselves, since the program will
    not be able to do so. Overall, the upgrade script manages to do about 80 percent
    of the work; the rest needs to be done by us.


    When using the upgrade script, there are some important points that we need to
    keep in mind, as follows:


    1.  Do not manually change the code in any way from TensorFlow 1.0 to TensorFlow
    2.0. This can cause errors during the upgrade.


    2.  Arguments are not reordered by the upgrade script. However, keyword arguments
    can be added to functions in which arguments are reordered.


    3.  The script follows the conventional practice of importing the TensorFlow library
    as `tf`, and thus works accordingly.


    4.  The compatibility module (`tf.compat.v1`) replaces certain TensorFlow 1.0
    references with those of 2.0. In any case, it is recommended that compatibility
    modules be removed and replaced with new APIs.


    ## Summary


    TensorFlow 2.0 seems pretty cool, doesn’t it? As we have read in this chapter,
    it has some interesting new features that make it much more powerful and capable
    compared to its parent version. It does have its disadvantages, but those can
    easily be worked around to allow programmers to easily adapt to it.

    We even compared it to TensorFlow 1.0 based on code-related differences, and we
    saw how much easier coding has become. Finally, we learned how we can migrate
    our old TensorFlow code to the newer version with the help of the upgrade script,
    which makes the process both smooth and quick.

    TensorFlow 2.0 was mainly built to make our deep learning experiments, research,
    model building, and so on much more productive. In the next chapter, we will see
    how we can implement this library with Python to create some exciting (and fully
    functioning) deep learning models.


    ## Quick Links


    *   Read more about TensorFlow 2.0 here: [`https://www.tensorflow.org/guide/effective_tf2`](https://www.tensorflow.org/guide/effective_tf2)


    *   Check out the Migration Guide here: [`https://www.tensorflow.org/guide/migrate`](https://www.tensorflow.org/guide/migrate)


    *   Learn more about the upgrade script here: [`https://www.tensorflow.org/guide/upgrade`](https://www.tensorflow.org/guide/upgrade)


    ## Additional Information


    ### Running TensorFlow 1.0 by Disabling TensorFlow 2.0


    Although TensorFlow 2.0 is currently the default version of the library, it is
    still possible to access the features of TensorFlow 1.0. All we need to do is
    disable TensorFlow 2.0 by calling the following function:


    ```

    tf.compat.v1.disable_v2_behavior()

    ```


    This needs to be done before programming; i.e., before creating graphs, adding
    tensors, and so on.


    ### Ragged Tensors


    TensorFlow introduced “ragged” tensors to solve the issue of non-uniformly shaped
    arrays of data. For example, let’s consider a set of lists of the number of letters
    in some words, such that each word’s length varies immensely from the other, as
    shown here:


    ```

    animals = tf.ragged.constant( [ [''c'', ''a'', ''t''],

    [''h'', ''i'', ''p'', ''p'', ''o'', ''p'', ''o'', ''t'', ''a'', ''m'', ''u'',
    ''s''],

    [''b'', ''u'', ''f'', ''f'', ''a'', ''l'', ''o''] ] )

    ```


    This will then be displayed like this:


    Here, the first word has three letters, the second word has twelve letters, and
    the third word has seven letters.


    We can even slice ragged tensors, the same way we would slice data in regular
    tensors. This is shown here:


    ```

    print( animals [ 2 ] )

    ```


    The outcome of this line of code would be as follows:


    ```

    tf.Tensor([''b'', ''u'', ''f'', ''f'', ''a'', ''l'', ''o''], shape=(7,), dtype=string)

    ```


    Ragged tensors can carry out a variety of TensorFlow operations, including string
    operations, mathematical operations, array operations, and so on. They are also
    supported by many of TensorFlow’s APIs, like Keras, `tf.function`, etc.

    Non-uniformly shaped data is a common challenge that many programmers face while
    carrying out machine learning. Ragged tensors assist us in such situations by
    making the storing and processing of such data much easier.


    ### TensorFlow Addons


    TensorFlow Addons is a special-interest group created to allow users to contribute
    new extensions with functionalities that are not a part of the core library. It
    has sub-packages and sub-modules that are maintained by a dedicated team.


    Some of these sub-packages include the following:


    *   `tfa.text`

    *   `tfa.image`

    *   `tfa.optimizers`

    *   `tfa.metrics`

    *   `tfa.callbacks`

    *   `tfa.rnn`


    ## 11. Machine Learning Programming with Tensorflow 2.0'
