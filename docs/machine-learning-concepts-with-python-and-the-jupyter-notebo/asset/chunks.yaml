    # Introduction


    I remember one day, when I was about 15, my little cousin had come over. Being
    the good elder sister that I was, I spent time with her outside in the garden,
    while all the adults were inside having a hearty conversation. I soon found myself
    chasing after this active little 4 year old as she bustled around, touching every
    little flower and inspecting every little creature.


    At first, she carried this out as a silent activity, the only noise being her
    feet as she ran across the grass. After a while, however, she could no longer
    contain herself, and she began questioning me about each and every object and
    phenomenon within her radius of sight. For a while, I felt thrilled that I was
    old enough to answer these questions satisfactorily. This thrill was short-lived,
    however, as she began delving deeper in her thirst to know more.


    This lasted until my mom came outside and called us for dinner. As I gratefully
    made my way back into the house, I came to two conclusions:


    1. The human mind is brilliantly inquisitive

    2. I’m not as smart as I thought I was


    Now when we think about it, it’s quite interesting to note that all that we know
    to do, from counting the number of toes we have, to singing the national anthem
    on key, to naming the planets in the Solar System, are all skills that we have
    developed over time.


    Were we born with these abilities?


    No, of course not.


    But we do have the ability to learn how to do all these things, with the help
    of our brain which continuously learns and processes information. The more we
    learn, the greater our knowledge. The greater our knowledge, the more intelligent
    we are.


    Not just human beings, but animals too. A dog can be trained to sit, roll over,
    and play dead, by teaching it that when it does these tasks correctly, it can
    earn a reward in the form of a tasty treat. By knowing how to perform these tasks,
    it is deemed to be an ‘intelligent dog’.


    So how do we learn new things?


    One way of learning is through enquiring. When my cousin was asking questions
    about everything she saw, she was trying to obtain answers from what she saw as
    a reliable source. She knew that I already learned about all these things, and
    so I could give her the answers she needed.


    Another way of learning is by observation. Before my cousin began asking me questions,
    she was observing everything. She noticed that the sky is blue while the grass
    is green, and the grasshopper hops about while the ant crawls alongs the ground.
    She was able to learn new things on her own, without having to ask anyone for
    help.


    The more questions she asked and the more she observed, the more her knowledge
    increased.


    It’s quite fascinating, really, to think that just by learning, a being can become
    intelligent.


    It is this intelligence that made the world what it is today. People grew in knowledge
    and made new discoveries which made daily life quicker and more efficient. This
    resulted in an increase in the number and variety of jobs available and skills
    required.


    Soon, people began to develop new ideas and methods to perform various tasks.
    They managed to create objects that could automatically do certain things, like
    hammer a nail, tighten a screw, and so on. In other words, people created what
    we now call ‘machines’, which were made to simulate the actions of a person. These
    machines reduced the amount of manual labour needed, especially in the process
    of manufacturing. We now have machines that have taken over a lot of our work
    - Leaving us with more time and energy for the slightly more intellectual tasks,
    which these machines could not do, because even though we could make the machines
    perform specific actions, we could not get them to think in the way human beings
    do.


    Now consider this… What if machines *could* think, and therefore, perform these
    intellectual tasks as well?'
