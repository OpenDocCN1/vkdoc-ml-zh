  trans: '

    因此，Keras 为用户提供了可靠的**支持**和强大的**资源**，这些资源可以集成到程序中，用于设计、训练、测试和部署深度学习模型。


    我们现在了解了机器学习模型的结构。我们还学习了 Keras，它是 TensorFlow 下的一个重要 API，极大地改善了我们的编码体验。有了它，我们就可以继续前进，开始使用
    TensorFlow 构建我们的第一个深度学习模型！


    我们将开发深度学习程序，根据某些相似性将数据分成若干组。换句话说，我们将解决分类问题。


    我们已经听说过这类问题。在分类问题下，主要有两种类型：**二分类**和**多分类**。


    ### 二分类


    这是一种非常简单的分类问题。在这里，要预测的变量只能取两个可能值中的一个。换句话说，数据需要被分成两组。


    让我们看一个非常简单的例子。假设我们有一组九个随机数：2, 5, 700, 75654, 8273, 9, 23, 563 和 0。


    我们可以将这些数字分成两组：


    *   *奇数* (5, 8273, 9, 23, 563)

    *   *偶数* (2, 700, 75654, 0)


    如你所见，根据数字的类型，我们这里有两个组或“类别”。给定的数字中有五个是奇数，四个是偶数。


    让我们再看一个例子。假设我们有这样一组词：“doe”，“ram”，“stag”，“ewe”，“rooster”，“chicken”。


    这可以分成以下几类：


    *   雄性 (“ram”, “stag”, “rooster”)

    *   雌性 (“doe”, “ewe”, “chicken”)


    同样，这里我们根据性别（雄性和雌性）分为两个类别，每个类别有三个变量。数据集中的每个变量都相应地进行了划分。


    二分类的其他更高级的应用包括癌症检测（存在癌症/无癌症）、垃圾邮件检测（垃圾邮件/非垃圾邮件）等。


    ### 多分类


    这也被称为多项分类。在这里，要预测的变量可以取多个可能值中的一个。换句话说，数据需要被分成两个以上的组。


    例如，假设我们有这样一组词：“rose”，“cucumber”，“tulip”，“lily”，“apple”，“carrot”，“potato”，“orange”，“sunflower”。


    我们可以将它们分成以下几组：


    *   *花卉* (“rose”, “tulip”, “lily”, “sunflower”)

    *   *水果* (“cucumber”, “apple”, “orange”)

    *   *蔬菜* (“carrot”, “potato”)


    如你所见，根据类型，数据被分成了三组：四个变量是花卉，三个是水果，两个是蔬菜。


    让我们考虑另一个例子。看看这组十一个随机数：9, 55, 8, 22, 27, 16, 205, 93, 4, 49, 81。


    猜猜我们如何划分它们？


    是的，没错！我们可以将它们分成以下几组：


    *   2 的倍数 (8, 22, 16, 4)

    *   3 的倍数 (9, 27, 93, 81)

    *   5 的倍数 (55, 205)

    *   7 的倍数 (49)


    这里我们根据最大公因数（2、3、5 或 7）分成了四组：2 的倍数包含四个变量，3 的倍数包含四个变量，5 的倍数包含两个变量，7 的倍数包含一个变量。


    多分类的其他更高级的应用包括眼睛颜色识别（蓝色、绿色、浅棕色、深棕色、灰色）、猫品种识别（波斯猫、曼赤肯猫、孟加拉猫、暹罗猫、斯芬克斯猫）等。


    正如我们所见，在所有这些分类示例中，变量都是根据它们共享的特征进行分组的。通过这种方式，数据可以根据特定特征或属性的相似性进行分类或分组。


    现在，我们将进入本章开头提到的七个程序。这将有助于说明我们到目前为止讨论的所有内容，并让你在 Jupyter Notebook 中借助 Python 和 TensorFlow
    对整个机器学习概念有一个更清晰的认识。

    '
- fmt: "# Programming with TensorFlow 2.0\n\nThe programs that we will be learning\
    \ comprise image classification problems. Before we get into them, let’s have\
    \ a quick look at how such problems need to be dealt with in order to solve them.\n\
    \n## Image Classification: An Overview\n\nImage classification is one of the most\
    \ popular areas of deep learning due to its vast usability in practical purposes.\
    \ It is the process of separating images within a dataset into groups, based on\
    \ their similar features.\n\nFor example, suppose we had images of a goldfish,\
    \ a grasshopper, a sparrow, a rabbit, a penguin, a cat, a vulture, and a shark,\
    \ as shown in Figure [11-2](#491271_1_En_11_Chapter.xhtml#Fig2).\n\n![../images/491271_1_En_11_Chapter/491271_1_En_11_Fig2_HTML.jpg](images/491271_1_En_11_Chapter/491271_1_En_11_Fig2_HTML.jpg)\n\
    \nFigure 11-2\nEight images of different creatures\n\nWe can separate them into\
    \ different groups, based on which class they belong to, as shown in Figure [11-3](#491271_1_En_11_Chapter.xhtml#Fig3).\n\
    \n![../images/491271_1_En_11_Chapter/491271_1_En_11_Fig3_HTML.jpg](images/491271_1_En_11_Chapter/491271_1_En_11_Fig3_HTML.jpg)\n\
    \nFigure 11-3\nClassifying the images\n\nWe thus have the following four classes:\n\
    \n* Insect (grasshopper)\n* Fish (goldfish, shark)\n* Mammal (cat, rabbit)\n*\
    \ Bird (vulture, penguin, sparrow)\n\nHaving studied these subjects in school,\
    \ we already know which of these creatures falls under which category. We can\
    \ use our natural intelligence to distribute the images easily. But how would\
    \ an artificially intelligent computer figure this out? We would have to train\
    \ it to understand the ways in which some of the creatures relate to each other,\
    \ while others don’t.\n\nThe model can be trained by feeding it with labeled pictures\
    \ of different kinds of creatures. The labels would inform the machine if the\
    \ image is that of an animal, a bird, a fish, or an insect. The machine would\
    \ then begin to observe all the images under a single class to gather information\
    \ on any kind of common features among them.\n\nFor example:\n\n* The insects\
    \ have six legs and antennae.\n* The fish have streamlined bodies and fins.\n\
    * The mammals have four legs and furry bodies.\n* The birds have wings and two\
    \ legs each.\n\nOnce it has gathered its observations and made predictions that\
    \ are verified to be accurate, it can be used for further problem solving. Now,\
    \ if we give it the eight images from Figure [11-2](#491271_1_En_11_Chapter.xhtml#Fig2),\
    \ it would solve the problem effortlessly and classify the images according to\
    \ their type by studying each picture, finding its closest possible label match,\
    \ and placing it in that class. This is how image classification is done using\
    \ a machine learning model.\n\nIn the programs that we will be going through,\
    \ we will focus on instructing the computer to train and test similar image classification\
    \ models with the help of neural networks.\n\nLet’s start with our very first\
    \ deep learning program.\n\n## Program 1: Image Classification Using a Pre-Trained\
    \ Model\n\nBefore we begin building models and training them, we need to understand\
    \ what our main objective is. Many times, we focus more on creating models that\
    \ give us high accuracy during validation, but we completely forget to carry out\
    \ a final inference to see if the model has really been trained well.\n\nInference\
    \ is the process of using a trained machine learning model to make a prediction.\
    \ During inference, we take a random element from the entire dataset and pass\
    \ it through the model to see if it can predict that element’s class correctly.\
    \ The result of this prediction helps us to infer or deduce whether the model\
    \ is accurate or not.\n\nTo make this clearer, let’s write a fun little image\
    \ classification program, in which we will take a pre-trained model and carry\
    \ out inference to validate its predictions.\n\n> **Note**  \n> Don’t worry too\
    \ much about understanding each and every step of this program. As long as you\
    \ get the basic idea of what is happening, that should be enough.\n\n### The Working\n\
    \nSince this is a model that has already been trained, we need not worry about\
    \ that part. All we need to do is load an image from the file, prepare it, feed\
    \ it to the model, and retrieve its outcome.\n\n### The Structure\n\nThe structure\
    \ of this program is short and sweet:\n\n1. It loads the pre-trained model into\
    \ the Jupyter notebook.\n2. It loads an image into the notebook.\n3. It prepares\
    \ the image for the model.\n4. It predicts the probability across all output classes.\n\
    5. It converts the probabilities into labels.\n6. It identifies the highest probability.\n\
    7. It displays the result.\n\n### The API\n\nThis program will be using the newly\
    \ added high-level Keras API.\n\n### The Program\n\n**Step 1: Open a new Jupyter\
    \ notebook.**  \nStart by launching the Anaconda application. Enter the required\
    \ virtual environment, and then launch Jupyter Notebook within it. From the Jupyter\
    \ Notebook dashboard, open up a new notebook for Python 3 programming. We can\
    \ give this notebook a name, like “Inference for Pre-Trained Models.”\n\n**Step\
    \ 2: Import TensorFlow and Keras utilities into the notebook.**  \nImport TensorFlow,\
    \ the Keras API, and all the extra functions into the Jupyter notebook, using\
    \ the following code:\n\n```python\nimport tensorflow as tf\nimport tensorflow.keras\n\
    from tensorflow.keras.preprocessing.image import load_img, img_to_array\nfrom\
    \ tensorflow.keras.preprocessing import image\nfrom tensorflow.keras.applications.vgg16\
    \ import VGG16, preprocess_input, decode_predictions\nfrom tensorflow.keras.applications.resnet50\
    \ import ResNet50, preprocess_input\n```\n\n**Step 3: Load the model into the\
    \ notebook.**  \nWe need to load the pre-trained model into the notebook. In this\
    \ program, we will be trying out both `VGG16` and `ResNet50`. To start with, let’s\
    \ call `VGG16` into our program. We can add it to our code like this:\n\n```python\n\
    model = VGG16()\n```\n\nThis will load the pre-trained model into the Jupyter\
    \ notebook.\n\n**Step 4: Load an image into the notebook.**  \nWe now need to\
    \ load an image into the notebook. The great thing about using this pre-trained\
    \ model is that we can upload any picture that we want and then test it to see\
    \ if it works correctly.\n\nThe image we will be using is that of a kitten. We\
    \ can load it into our notebook, like this:\n\n```python\nimage = load_img('Kitten1.jpg',\
    \ target_size=(224, 224))\nimage\n```\n\nThe image will be displayed as shown\
    \ in Figure [11-4](#491271_1_En_11_Chapter.xhtml#Fig4).\n\n![../images/491271_1_En_11_Chapter/491271_1_En_11_Fig4_HTML.jpg](images/491271_1_En_11_Chapter/491271_1_En_11_Fig4_HTML.jpg)\n\
    \nFigure 11-4\nLoading the image file\n\n> **Note**  \n> Just remember that when\
    \ you are saving an image onto your computer, it’s always a good idea to save\
    \ it in the same folder as the Jupyter notebook that you are working in. For example,\
    \ if your notebook is saved under `Desktop/My Programs`, you can move the image\
    \ to `Desktop/My Programs` as well. This makes it easier for you to access it\
    \ later on in your code, without the need for typing in the entire file path.\n\
    \n**Step 5: Prepare the image for the model.**  \nWe first need to convert the\
    \ image’s pixels into a Numpy array, like this:\n\n```python\nimage = img_to_array(image)\n\
    ```\n\nWe then need to reshape the array, like this:\n\n```python\nimage = image.reshape((1,\
    \ image.shape[0], image.shape[1], image.shape[2]))\n```\n\nFinally, we will preprocess\
    \ the input, like this:\n\n```python\nimage = preprocess_input(image)\n```\n\n\
    **Step 6: Make the prediction.**  \nWe can now predict the probability of the\
    \ image’s belonging to each class. After this, we convert these probabilities\
    \ into the class labels, and then retrieve the result that seems the most probable.\
    \ The code for this is shown here:\n\n```python\nresult = model.predict(image)\n\
    label = decode_predictions(result)\nlabel = label[0][0]\n```\n\n**Step 7: Display\
    \ the classification.**  \nThe model’s prediction can be displayed along with\
    \ its percentage probability with the help of the following code:\n\n```python\n\
    print('%s (%.2f%%)' % (label[1], label[2]*100))\n```\n\nThe output will come like\
    \ this:\n\n* Egyptian_cat (87.00%)"
