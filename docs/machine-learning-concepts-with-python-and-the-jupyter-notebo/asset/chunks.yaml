  trans: '

    *   **标签：** 这些是数据中需要被预测的组成部分；即因变量或输出。它们基于提供给系统的特征来确定。


    *   **特征：** 这些是数据中用于预测的组成部分；即自变量或输入。它们决定了输出的标签。在选择特征时，确保它们相互独立且互不相同非常重要。


    在训练深度学习模型时，我们可以根据输入特征和标签的方式，选择以下任一方法：


    *   **监督学习：** 我们将特征和标签一起输入模型。


    *   **无监督学习：** 我们仅将特征输入模型。


    *   **半监督学习：** 我们将部分已标记特征和部分未标记特征输入模型。


    注意


    标签的质量与特征的质量成正比。换句话说，更好的特征会带来更准确的标签。


    完成数据修改后，我们需要将其分成两部分：训练数据和测试数据。


    *   **训练数据：** 训练数据是在模型训练过程中输入给模型使用的数据。这部分数据通常占比较大，因为模型在训练时需要更多数据才能获得更准确的结果。


    *   **测试数据：** 测试数据是在模型完成训练并确定最优参数后输入给模型的数据。这部分数据通常占比较小，因为它仅用于帮助模型判断其预测的准确程度。


    完成数据预处理后，下一步就是构建模型。


    构建模型


    我们需要设计机器学习模型的架构。在本例中，我们将使用神经网络。因此，我们需要通过定义以下内容来搭建神经网络：


    *   隐藏层的数量


    *   每层神经元的数量


    *   权重和偏置


    *   激活函数


    在第 3 章中，我们学习了神经网络的工作原理，并研究了它们的不同类型。例如，卷积神经网络（CNN）最适合用于图像分类和识别，而循环神经网络（RNN）则非常适合机器翻译和语音识别。我们可以根据数据、资源和期望结果仔细考虑后，选择我们偏好的神经网络，并据此构建所需的模型。


    训练模型

    模型构建完成后，就可以开始训练了。这时，程序员退居幕后，让机器接手，开始进行高强度的工作。我们在这里需要做的只是将训练数据输入模型，然后启动训练过程。

    在训练过程中，模型开始尝试不同的值并替换参数（即权重和偏置），以得出最合适的方程，从而实现高精度和低误差。它遵循试错法，不断改变参数的值，直到获得满意的结果。


    我们在第 3 章中已经看到：


    *   权重和偏置的值会被不断调整，以使输出更合适，并给出更强的预测能力。这被称为训练模型。


    *   从输入数据预测输出。这被称为前向传播。


    *   修改权重和偏置以减少损失。这被称为反向传播。


    虽然看起来一切到此应该结束了，但这样做并不总是一个好主意。

    为什么？

    嗯，因为结果总有可能不是最优的。例如，可能会发生过拟合，导致不准确。这就是为什么训练之后，模型还必须进行测试。


    测试模型

    当我们有了训练好的模型后，需要将测试数据输入其中。然后，我们让模型运行这些数据，以查看其预测的准确程度。通过这种方式，我们验证模型。

    根据这个准确度，我们可以决定是想要更改模型的某些方面然后重新训练，还是保持原样。当然，还有其他几个因素也会影响这个决定，包括时间、计算能力等。例如，程序员可能没有足够的资源来重新设计和训练模型。或者可能没有足够的时间。因此，在重新训练模型之前，程序员必须考虑所有这些因素。

    机器会不断重复训练和测试模型的循环，直到产生可接受的结果。


    机器学习模型的结构在更具体的因素上可能会有很大差异，这取决于我们正在解决的问题类型。因此，如前所述，我们需要正确定义我们的问题以及我们希望实现的解决方案，然后仔细规划我们的模型以最小化误差。


    既然我们已经了解了机器学习模型的一般设计，接下来需要熟悉 Keras API，它与 TensorFlow 库集成，我们将使用它来开发代码。


    Keras

    在我们学习作为 TensorFlow API 的 Keras 之前，先来看看作为一个独立且流行的机器学习库的 Keras。

    Keras 是一个开源深度学习库。它用 Python 编写，可以在 TensorFlow 之上运行，也可以在 Theano、R、PlaidML 和 Microsoft
    Cognitive Toolkit 上运行。它是在 ONEIROS（开放式神经电子智能机器人操作系统）项目内开发的。

    它最初于 2015 年 3 月 27 日以 MIT 许可证发布。

    根据官方网站，Keras 主要专注于“面向人类的深度学习”。

    换句话说，开发者是其优先考虑的对象，而不是机器。它的创建是为了减轻用户的编程负担。它使用户更容易编写和调试代码，并且还提供了充足的指南和文档。

    Keras 最初只是一个独立的库，可以在程序中调用和部署。事实上，它的原始后端是 Theano。然而，当 Google 推出 TensorFlow 后，程序员们开始将两者结合使用，以至于发展到没有
    TensorFlow 就没有 Keras，反之亦然。看到这种强大组合日益流行，Keras 很快将 TensorFlow 作为其默认后端，这对他们来说是一个明智之举。

    2017 年，TensorFlow 在其包中添加了 `tf.keras` 子模块，这与需要使用 `pip` 函数安装的 Keras 库是分开的。这是在其包内支持
    Keras 的第一步。最终，随着 2019 年 TensorFlow 2.0 的发布，Keras 成为了机器学习的官方高级 API。这给这两个库都带来了额外的推动力，因为它们现在可以一起用于开发和训练强大的神经网络。


    Keras 的特性


    Keras 包含几个使深度学习变得更加容易的特性和工具。其中一些包括：


    1.  它可以在 CPU 和 GPU 上流畅运行。


    2.  模型可以轻松导出到服务器、浏览器、嵌入式设备等。


    3.  它灵活且一致，使用户的研究和部署不那么困难。


    4.  它支持多种类型的神经网络，如 CNN 和 RNN。


    5.  它有丰富的文档供进一步学习，并且有一个社区供用户相互支持。

    '
- fmt: 'Thus, Keras provides the user with reliable support and powerful resources
    that can be implemented into a program to design, train, test, and deploy deep
    learning models.


    We now know how a machine learning model is structured. We also learned about
    Keras, an important API under TensorFlow that makes our coding experience much
    better. With this, we can go ahead and start building our very first deep learning
    model with TensorFlow!


    We will be developing deep learning programs to segregate our data into several
    groups based on certain similarities. In other words, we will be solving classification
    problems.


    We have already heard about such problems. Under classification, we have two main
    types: binary classification and multi-class classification.


    ## Binary Classification


    This is a very simple type of classification problem. Here, the variable to be
    predicted can take either one of two possible values. In other words, the data
    needs to be split into two groups.


    Let’s take a very simple example. Suppose we have a set of nine random numbers
    available to us: 2, 5, 700, 75654, 8273, 9, 23, 563, and 0.


    We can separate these numbers into two groups:


    *   Odd Numbers (5, 8273, 9, 23, 563)

    *   Even Numbers (2, 700, 75654, 0)


    As you can see, we have two groups or “classes” here based on the type of number.
    Five of the given numbers are odd, and four of them are even.


    Let’s take another example. Suppose we have a set like this: “doe,” “ram,” “stag,”
    “ewe,” “rooster,” “chicken.”


    This can be separated out into the following:


    *   Male (“ram,” “stag,” “rooster”)

    *   Female (“doe,” “ewe,” “chicken”)


    Once again, here we have two categories based on their gender, male and female,
    each having three variables. Each variable within the set of data is divided accordingly.


    Other more advanced applications of binary classification include cancer detection
    (cancer present/cancer absent), spam detection (spam/not spam), etc.


    ## Multi-class Classification


    This is also called multinomial classification. Here, the variable to be predicted
    can take one of many possible values. In other words, the data needs to be separated
    into more than two groups.


    For example, suppose we have a set like this: “rose,” “cucumber,” “tulip,” “lily,”
    “apple,” “carrot,” “potato,” “orange,” “sunflower.”


    We can separate them into these groups:


    *   Flowers (“rose,” “tulip,” “lily,” “sunflower”)

    *   Fruits (“cucumber,” “apple,” “orange”)

    *   Vegetables (“carrot,” “potato”)


    As you can see, we have three groups into which the data is divided based on type:
    four of the variables are flowers, three of them are fruits, and two of them are
    vegetables.


    Let’s consider another example. Take a look at this set of eleven random numbers:
    9, 55, 8, 22, 27, 16, 205, 93, 4, 49, 81.


    Any guesses on how we can divide them?


    Yes, that’s right! We can divide them into the following groups:


    *   Multiples of 2 (8, 22, 16, 4)

    *   Multiples of 3 (9, 27, 93, 81)

    *   Multiples of 5 (55, 205)

    *   Multiples of 7 (49)


    We have four groups here based on the highest common factor (2, 3, 5, or 7): the
    multiples of 2 consisting of four variables, multiples of 3 consisting of four
    variables, multiples of 5 consisting of two variables, and multiples of 7 consisting
    of one variable.


    Other more advanced applications of multi-class classification include eye-color
    recognition (blue, green, light brown, dark brown, grey), cat-breed identification
    (Persian, Munchkin, Bengal, Siamese, Sphynx), etc.


    As we can see, in all these classification examples, the variables were grouped
    together depending on the characteristics that they shared. In this way, data
    can be classified or grouped based on similarities in particular characteristics
    or features.


    We will now get into the seven programs that we spoke about at the beginning of
    this chapter. This will help illustrate all that we have discussed till now, and
    will give you a clearer picture of the entire concept of machine learning with
    the help of Python and TensorFlow, within Jupyter Notebook.'
