    程序 7：使用卷积神经网络进行狗猫分类（多层，二分类）

    在本程序中，我们将训练模型来区分狗和猫。这对人脑来说似乎是一项简单的任务，但对机器而言可能并不容易。还记得在程序 1 中，我们使用了两个预训练模型对一张小猫图片进行推理吗？对于第一张图片，它们正确识别为埃及猫。然而，对于第二张图片，一个模型预测该图片是吉娃娃，而另一个模型则说它是彭布罗克威尔士柯基犬。

    造成这种情况的原因，可能是因为这三个品种都有尖耳朵和小五官。虽然这对我们来说差别不大，但对人工智能机器却影响巨大，因为每一个微小的特征对于深度学习模型的学习过程都至关重要。

    让我们来看看我们的数据集。


    数据集

    “狗猫分类”数据集可以在 Kaggle 网站上找到。它总共包含 25,000 张狗和猫的图片。虽然我们不知道这些图片最初是如何划分的，但我们将在程序运行过程中找出答案。


    程序


    **步骤 1：将所有必需的库和函数导入 Jupyter Notebook。**


    ```

    import tensorflow as tf

    from tensorflow.keras.models import Sequential

    from tensorflow.keras.layers import Conv2D

    from tensorflow.keras.layers import MaxPooling2D

    from tensorflow.keras.layers import Flatten

    from tensorflow.keras.layers import Dense

    import os

    ```


    `os`模块允许用户与操作系统进行交互。

    这次，我们将先创建模型，然后再下载数据集。

    **步骤 2：开发 CNN 模型并编译。**


    这里，我们将模型称为`classifier`。我们可以随意命名，只要阅读代码的人能轻松理解即可。


    ```

    classifier = Sequential()

    classifier.add(Conv2D(64,(3,3),input_shape = (64,64,3), activation = ''relu''))

    classifier.add(MaxPooling2D(pool_size = (2,2)))

    classifier.add(Conv2D(64,(3,3), activation = ''relu''))

    classifier.add(MaxPooling2D(pool_size = (2,2)))

    classifier.add(Conv2D(64,(3,3), activation = ''relu''))

    classifier.add(MaxPooling2D(pool_size = (2,2)))

    classifier.add(Flatten())

    classifier.add(Dense(units = 128, activation = ''relu''))

    classifier.add(Dense(units = 1, activation = ''sigmoid''))

