- fmt: '# Part A: Constants and Variables


    In this part, we will only be incorporating variables and constants into our code.
    In Part B, we will learn how to use placeholders in our program. This is because
    the latter requires a little more explanation than the former two.


    To understand the working of variables and constants in a program, we will do
    some simple arithmetic, as we’ve already seen, since it is an easy way to demonstrate
    these two features. It will also give us the opportunity to explore some of the
    arithmetic operations that are allowed in TensorFlow.


    Start by defining the constant `a`, as follows:


    ```

    a = tf.constant(5)

    ```


    Next, define the variable `b`:


    ```

    b = tf.Variable(6)

    ```


    One very important thing to note here is that the `tf.constant()` function is
    spelled entirely in lowercase, while the `tf.Variable()` function is spelled with
    a capitalised `V`. This is a minute detail which can cause errors in our program
    if not followed correctly.


    Now that we have defined the constant and the variable, let’s perform some calculations
    on them! We will begin by finding the sum of the two values. To do so, we will
    use the following command:


    ```

    sum = tf.add(a,b)

    ```


    This is the same as typing the following:


    ```

    sum = a + b

    ```


    When we execute both, we will get the same output.


    Now, let’s say we want to change the value of our variable `b`. We can do so as
    follows:


    ```

    new = tf.assign(b,4)

    ```


    The `tf.assign()` function allows us to assign a new value to a variable. If we
    try to use this on a constant, it will give us an error. Here, within the brackets,
    we first enter the variable that we would like to change, followed by the value
    that we would like to change it to. We save this entire update under the variable
    `new`. The reason for saving it under the variable `new` is that it cannot just
    get executed on its own. We need to run this code line within a session, and only
    then will it be executed. Thus, we store it under a variable and then call it
    within a session.


    One very important point to be noted is that, when we are using variables, *we
    need to initialize them before we can begin using them in sessions*. This seems
    like an unnecessary step at first, but when we try to work with our variables
    without initializing them, our program gives us an error. We initialize the variables
    as follows:


    ```

    init_op = tf.global_variables_initializer()

    ```


    This `init_op` is a node, or an operation, that needs to be executed in order
    to initialize the variables. We can give it any name, of course, but for the sake
    of readability, we will use one of the conventional names for it.


    Now that we have declared this, we will need to run this within a session. Let’s
    create our session, like we did in the previous section:


    ```

    sess = tf.Session()

    ```


    Let’s now run our `init_op` within the session, like so:


    ```

    sess.run(init_op)

    ```


    Great! Our variables have been initialized. We can now proceed with the rest of
    our program. Let’s first find out the result of adding `a` and `b`:


    ```

    print(sess.run(sum))

    ```


    We add `print` before `sess.run(sum)` so that the program directly prints the
    result of the addition. This reduces the commands to find the sum of the two numbers
    and then print it into a single line of code.


    We will get the sum of `a` and `b`, like this:


    ```


    ```


    Now, let’s assign the new value to `b` and see how our output varies:


    ```

    sess.run(new)

    print(sess.run(sum))

    ```


    You see the difference in output? The program has changed the value of `b` according
    to the instructions given to it, and has printed the new sum of `a` and `b`. It
    was possible to assign a new value to `b` since it was a variable, but it was
    not possible to do so for `a`, as it was a constant.


    Constants and variables are of great use when we have plenty of data that needs
    to be received, declared, stored, and called later on in the code. As we get into
    hardcore machine learning, we will see how they are used in a program to effectively
    develop and train models.


    Placeholders, as mentioned earlier, require a little more explanation as to how
    they are implemented into a piece of code. We will see this in the next part.


    # Part B: Placeholders


    The main idea behind placeholders is to help programmers who need to train huge
    models with massive amounts of data. The reason is, all this data cannot be accessed
    at once (unless the programmer is willing to risk having their computer crash).
    Thus, with the help of placeholders, this data can be accessed little by little,
    until it is entirely processed.


    Placeholders don’t need to be given an initial value, unlike constants and variables.
    All we need to do is specify what *type* of value we want to store in it.


    Let’s try initializing our first placeholder:


    ```

    p = tf.placeholder(tf.float32)

    ```


    Here, we are specifying that the placeholder will be holding a value that is of
    type `float`. This prepares the program so that at runtime it will accept a floating
    point number into the placeholder.


    Now, let’s enter our equation. This time, we will go for basic multiplication.
    We will enter the code as follows:


    ```

    prod = p*2

    ```


    Now, if we try to execute this by running it in a session, we will not get any
    output, because `p` has no value in it. We need to assign some value to `p` first.
    Here, unlike for variables, we cannot just use `tf.assign()` to give the placeholder
    a value. We need to follow a different method. This involves the use of a dictionary,
    which we will be using to feed a value into our placeholder `p`.


    We will first assign a single value to `p`, like this:


    ```

    sess.run(prod, feed_dict={p:4.0})

    ```


    When we execute this line of code, we will get an output like this:


    ```


    ```


    By running this code, two things happen:


    1. First, the value that we have provided (in this case, `4.0`) is assigned to
    the placeholder `p`.

    2. Second, the operation `prod` is carried out, which uses this placeholder `p`
    and its newly assigned value to produce a result.


    Let’s try feeding more values into our placeholder.


    ```

    sess.run(prod, feed_dict={p:[6,7,8,9]})

    ```


    This gives us an output for each value assigned.


    We can even create a dictionary first and then feed that into our placeholder.
    We will demonstrate this with the help of a multi-dimensional array. First, let’s
    define our dictionary `d` with some values, like this:


    ```

    d = {p:[[0,2,4,6,8], [1,3,5,7,9], [11,15,17,19,25]]}

    ```


    Now, we can feed these values into the placeholder `p`, like this:


    ```

    sess.run(prod,feed_dict=d)

    ```


    When we execute this line of code, we will get the product of each element of
    the dictionary when multiplied by 2.


    Now, take a look at the next program:


    ```

    g = tf.placeholder(tf.float32)

    h = tf.placeholder(tf.float32)

    sum = g+h

    prod = sum*5

    sess = tf.Session()

    sess.run(prod, feed_dict={g:[2], h:[3]})

    ```


    Interesting, right? Here’s what happened in this program:


    1. We declared two placeholders, `g` and `h`.

    2. We then declared a variable `sum` that adds the values of `g` and `h`.

    3. After that, we declared a variable `prod` that takes the value of `sum` and
    multiplies it by 5.

    4. Finally, we ran `prod` in a session and fed values to `g` and `h` because `sum`,
    which is the only variable declared under `prod`, requires values for `g` and
    `h` in order to obtain a value of its own.'
