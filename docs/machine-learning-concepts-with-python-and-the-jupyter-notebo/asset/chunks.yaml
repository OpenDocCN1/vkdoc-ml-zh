- fmt: '# Program 7: Dogs vs. Cats Classification Using Convolutional Neural Networks
    (Multi-layer, Binary)


    In this program, we will train the model to differentiate between a dog and a
    cat. This seems like a trivial task for the human brain, but for the machine,
    it may not be so easy. Remember in Program 1, where we used two pre-trained models
    and carried out inference on the image of a kitten? For the first image, they
    identified it correctly as an Egyptian Cat. For the second image, however, one
    predicted that the image was that of a Chihuahua, while the other said that it
    was a Pembroke Welsh Corgi.


    The reason for this is probably because all three breeds have pointed ears and
    small features. Although this doesn’t make much of a difference to us, it does
    make a huge impact on an artificially intelligent machine, because every little
    feature is important for a deep learning model’s learning process.


    Let’s have a look at our dataset.


    ## The Dataset


    The “Dogs vs. Cats” dataset can be found on the Kaggle website. It consists of
    a total of 25,000 images of dogs and cats. Although we do not know how the images
    are separated out initially, we will find this out during the program.


    ## The Program


    ### Step 1: Import all the required libraries and functions into Jupyter Notebook.


    ```python

    import tensorflow as tf

    from tensorflow.keras.models import Sequential

    from tensorflow.keras.layers import Conv2D

    from tensorflow.keras.layers import MaxPooling2D

    from tensorflow.keras.layers import Flatten

    from tensorflow.keras.layers import Dense

    import os

    ```


    The `os` module allows users to interact with the operating system. This time,
    we will create our model first, after which we will download the dataset.


    ### Step 2: Develop the CNN model and compile it.


    Here, we refer to our model as `classifier`. We can put any name we want, provided
    it is easily understood by anyone who reads it.


    ```python

    classifier = Sequential()

    classifier.add(Conv2D(64,(3,3),input_shape = (64,64,3), activation = ''relu''))

    classifier.add(MaxPooling2D(pool_size = (2,2)))

    classifier.add(Conv2D(64,(3,3), activation = ''relu''))

    classifier.add(MaxPooling2D(pool_size = (2,2)))

    classifier.add(Conv2D(64,(3,3), activation = ''relu''))

    classifier.add(MaxPooling2D(pool_size = (2,2)))

    classifier.add(Flatten())

    classifier.add(Dense(units = 128, activation = ''relu''))

    classifier.add(Dense(units = 1, activation = ''sigmoid''))

    classifier.compile(optimizer = ''adam'', loss = ''binary_crossentropy'', metrics
    = [''accuracy''])

    ```


    ### Step 3: Transform the imported data.


    ```python

    from tensorflow.keras.preprocessing.image import ImageDataGenerator

    train_datagen = ImageDataGenerator(

    rescale=1./255,

    shear_range=0.2,

    zoom_range=0.2,

    horizontal_flip=True)

    test_datagen = ImageDataGenerator(rescale=1./255)

    ```


    ### Step 4: Download the dataset.


    The dataset needs to be downloaded from a specific link. In this section of code,
    we tell our program to download the data from the given url, and then we store
    it on our system.


    ```python

    _URL = ''https://storage.googleapis.com/mledu-datasets/cats_and_dogs_filtered.zip''

    path_to_zip = tf.keras.utils.get_file(''cats_and_dogs.zip'', origin=_URL, extract=True)

    PATH = os.path.join(os.path.dirname(path_to_zip), ''cats_and_dogs_filtered'')

    ```


    ### Step 5: Set up the directories.


    We need to set up different directories for the training and testing data, and
    then separate out the cat and dog images accordingly.


    ```python

    trainingdir = os.path.join(data_path, ''train'')

    testingdir = os.path.join(data_path, ''validation'')

    # directory with the training cat pictures

    cats_train = os.path.join(trainingdir, ''cats'')

    # directory with the training dog pictures

    dogs_train = os.path.join(trainingdir, ''dogs'')

    # directory with the testing cat pictures

    cats_test = os.path.join(testingdir, ''cats'')

    # directory with the testing dog pictures

    dogs_test = os.path.join(testingdir, ''dogs'')

    ```


    ### Step 6: Find the number of elements in each directory.


    We first find the number of elements directories in each directory, and then we
    display the values.'
