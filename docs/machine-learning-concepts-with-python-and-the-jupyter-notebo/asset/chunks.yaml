  trans: '

    使用 TensorFlow 2.0 进行编程

    我们将要学习的程序涉及图像分类问题。在深入探讨之前，让我们先快速了解一下如何处理这类问题以解决它们。


    图像分类：概述

    图像分类是深度学习中最热门的领域之一，因为它在实际应用中非常广泛。它是根据数据集中图像的相似特征，将其分组的过程。


    例如，假设我们有金鱼、蚱蜢、麻雀、兔子、企鹅、猫、秃鹫和鲨鱼的图像，如图 11-2 所示。


    ![../images/491271_1_En_11_Chapter/491271_1_En_11_Fig2_HTML.jpg](img/491271_1_En_11_Fig2_HTML.jpg)


    图 11-2

    八种不同生物的图像


    我们可以根据它们所属的类别将它们分成不同的组，如图 11-3 所示。


    ![../images/491271_1_En_11_Chapter/491271_1_En_11_Fig3_HTML.jpg](img/491271_1_En_11_Fig3_HTML.jpg)


    图 11-3

    对图像进行分类


    因此，我们有以下四个类别：


    *   昆虫（蚱蜢）

    *   鱼类（金鱼、鲨鱼）

    *   哺乳动物（猫、兔子）

    *   鸟类（秃鹫、企鹅、麻雀）


    在学校学过这些科目后，我们已经知道这些生物中哪些属于哪个类别。我们可以利用我们的自然智能轻松地分配图像。但是，一台人工智能计算机如何解决这个问题呢？

    我们必须训练它理解某些生物之间的关联方式，而其他生物则没有关联。

    可以通过向模型输入带有标签的不同种类生物图片来训练它。标签会告知机器该图像是动物、鸟类、鱼类还是昆虫。然后，机器将开始观察同一类别下的所有图像，以收集关于它们之间任何共同特征的信息。


    例如：


    *   昆虫有六条腿和触角。

    *   鱼类有流线型的身体和鳍。

    *   哺乳动物有四条腿和毛茸茸的身体。

    *   鸟类有翅膀和两条腿。


    一旦它收集了观察结果并做出了经过验证准确的预测，就可以用于进一步的问题解决。

    现在，如果我们给它图 11-2 中的八张图像，它将通过研究每张图片、找到最接近的可能标签匹配并将其放入该类别中，毫不费力地解决问题并根据类型对图像进行分类。这就是使用机器学习模型进行图像分类的方法。

    在我们将要学习的程序中，我们将专注于指导计算机借助神经网络来训练和测试类似的图像分类模型。

    让我们开始我们的第一个深度学习程序。


    程序 1：使用预训练模型进行图像分类

    在开始构建模型并训练它们之前，我们需要了解我们的主要目标是什么。很多时候，我们更专注于创建在验证期间能给我们带来高准确率的模型，但完全忘记了进行最终推理以查看模型是否真的训练得很好。

    推理是使用训练好的机器学习模型进行预测的过程。

    在推理过程中，我们从整个数据集中随机抽取一个元素，并将其传递给模型，以查看它是否能正确预测该元素的类别。这个预测的结果有助于我们推断或演绎模型是否准确。

    为了更清楚地说明这一点，让我们编写一个有趣的图像分类小程序，其中我们将使用一个预训练模型并进行推理以验证其预测。


    注意


    不必过于担心理解这个程序的每一步。只要你对正在发生的事情有一个基本概念，那就足够了。


    工作原理

    由于这是一个已经训练好的模型，我们无需担心那部分。我们只需要从文件中加载图像，对其进行预处理，将其输入模型，并获取其结果。


    结构

    这个程序的结构简短而精炼：


    1.  将预训练模型加载到 Jupyter notebook 中。

    2.  将图像加载到 notebook 中。

    3.  为模型准备图像。

    4.  预测所有输出类别的概率。

    5.  将概率转换为标签。

    6.  识别最高概率。

    7.  显示结果。


    API

    此程序将使用新添加的高级 Keras API。


    程序

    **第 1 步：打开一个新的 Jupyter notebook。**

    首先启动 Anaconda 应用程序。进入所需的虚拟环境，然后在该环境中启动 Jupyter Notebook。从 Jupyter Notebook 仪表板中，为
    Python 3 编程打开一个新的 notebook。我们可以给这个 notebook 起一个名字，比如“预训练模型的推理”。

    **第 2 步：将 TensorFlow 和 Keras 工具导入 notebook。**


    使用以下代码将 TensorFlow、Keras API 以及所有额外的函数导入 Jupyter notebook：


    ```

    import tensorflow as tf

    import tensorflow.keras

    from tensorflow.keras.preprocessing.image import load_img, img_to_array

    from tensorflow.keras.preprocessing import image

    from tensorflow.keras.applications.vgg16 import VGG16, preprocess_input, decode_predictions

    from tensorflow.keras.applications.resnet50 import ResNet50, preprocess_input

    ```


    **第 3 步：将模型加载到 notebook 中。**


    我们需要将预训练模型加载到 notebook 中。在这个程序中，我们将尝试使用 VGG16 和 ResNet50。首先，让我们在程序中调用 VGG16。我们可以像这样将其添加到代码中：


    ```

    model = VGG16()

    ```


    这会将预训练模型加载到 Jupyter notebook 中。

    **第 4 步：将图像加载到 notebook 中。**

    我们现在需要将一张图像加载到 notebook 中。使用这个预训练模型的好处是，我们可以上传任何我们想要的图片，然后测试它是否能正确工作。


    我们将使用的图像是一只小猫的图片。我们可以像这样将其加载到 notebook 中：


    ```

    image = load_img(''Kitten1.jpg'', target_size=(224, 224))

    image

    ```


    图像将如图 11-4 所示显示。


    ![../images/491271_1_En_11_Chapter/491271_1_En_11_Fig4_HTML.jpg](img/491271_1_En_11_Fig4_HTML.jpg)


    图 11-4

    加载图像文件


    注意


    请记住，当你在计算机上保存图像时，最好将其保存在与你正在使用的 Jupyter notebook 相同的文件夹中。例如，如果你的 notebook 保存在
    Desktop/My Programs 下，你也可以将图像移动到 Desktop/My Programs。这样，稍后在代码中访问它时会更方便，无需输入完整的文件路径。


    **第 5 步：为模型准备图像。**


    我们首先需要将图像的像素转换为 Numpy 数组，如下所示：


    ```

    image = img_to_array(image)

    ```


    然后，我们需要重塑数组，如下所示：


    ```

    image = image.reshape((1, image.shape[0], image.shape[1], image.shape[2]))

    ```


    最后，我们将对输入进行预处理，如下所示：


    ```

    image = preprocess_input(image)

    ```


    **第 6 步：进行预测。**


    我们现在可以预测图像属于每个类别的概率。之后，我们将这些概率转换为类别标签，然后检索看起来最有可能的结果。相关代码如下所示：


    ```

    result = model.predict(image)

    label = decode_predictions(result)

    label = label[0][0]

    ```


    **第 7 步：显示分类结果。**


    可以使用以下代码显示模型的预测结果及其百分比概率：


    ```

    print(''%s (%.2f%%)'' % (label[1], label[2]*100))

    ```


    输出将如下所示：


    *   Egyptian_cat (87.00%)

    '
- fmt: 'We can see that the `VGG16` model has not only predicted that the image is
    that of a cat, but also predicted its species; i.e., an Egyptian cat. Along with
    this, it has given the probability of its answer’s being correct as 87 percent.
    Nice, right? Let’s try this again, and this time, with a `ResNet50` model.


    Just change the code in Step 3 to this:


    ```

    model = ResNet50()

    ```


    Now repeat the remaining steps, leaving the same image file, and run the prediction.
    See what we get?


    - Egyptian_cat (71.94%)


    The `ResNet50` model also gives the same prediction, but it is only 71.94 percent
    sure of its answer.


    So, can we say that these models are perfect, because they were able to identify
    the image of a kitten correctly? Well, here’s another example, in which I have
    changed my image to that of another kitten, as shown in Figure [11-5](#491271_1_En_11_Chapter.xhtml#Fig5).


    ![../images/491271_1_En_11_Chapter/491271_1_En_11_Fig5_HTML.jpg](images/491271_1_En_11_Chapter/491271_1_En_11_Fig5_HTML.jpg)


    Figure 11-5 Loading another image file


    Here is what the models predicted:


    VGG16:


    - Chihuahua (21.55%)


    ResNet50:


    - Pembroke (17.49%)


    As we can see, one model identified my kitten as a Chihuahua, while the other
    model identified him as a Pembroke (which, after a bit of searching, I found out
    refers to the Pembroke Welsh Corgi). In short, both the models thought that my
    kitten was a dog. Thus, as we learn to create, train, and validate deep learning
    models, we will also be required to carry out an inference on them to ensure that
    they have actually been trained correctly. Since they are just machines, it is
    not possible to get a model that is completely infallible. Our aim, however, is
    to get the highest accuracy with the least number of errors. Once such models
    are developed and approved, they can be implemented into real-world applications.


    It is now time to learn how to build our very own neural networks for deep learning.
    In the next few programs, we will go through various types of image classifiers,
    and we will see how we can set them up in different ways to classify several images.


    ## Program 2: Handwriting Recognition Using Keras in TensorFlow (Single Layer,
    Multi-class)


    Handwriting is unique to a particular individual. You might have observed that
    some people have extremely neat and aesthetic handwriting, whereas others have
    handwriting that is almost illegible. There is also a clear distinction when writing
    different characters. For example, some might just put a dot over their *i*’s,
    while others prefer to draw a small circle. We then have differences in slant,
    size, thickness, and so on. It is this uniqueness that makes handwriting recognition
    quite a challenge, especially for artificially intelligent machines. However,
    it is not impossible to train a model to figure out similarities, and thus differentiate
    between characters.


    ### The Working


    Images are basically grids made up of numbers. These numbers tell us the pixel
    value or intensity. Thus, these numbers can be manipulated to obtain the characteristics
    of the image. This enables us to find similar features in different images.


    ### The Structure


    The architecture of this model is as follows:


    1.  It loads the given dataset of images.

    2.  It divides the data into the training set and the test set.

    3.  It creates the neural network with as many layers as we specify, along with
    the activation function provided by us.

    4.  It begins training with the training data to recognize the similarities and
    differences between each image and segregate them accordingly.

    5.  It then tests its accuracy with the test data to see how well it has learned
    the difference between each image.

    6.  It carries out inference to make sure that its prediction is correct.


    ### The Dataset


    The dataset that we will be using in this program is the MNIST dataset. The full
    name of MNIST is Modified National Institute of Standard Technology. It is a set
    of handwritten digits (from 0 to 9). It is used to train models for handwriting
    recognition. It is, as can be understood by the name, a modified version of the
    previous NIST datasets. The great part about it is that it is pre-divided into
    training data and test data. The training dataset consists of 60,000 images, while
    the test dataset consists of 10,000 images. They are all of size 28x28 pixels.
    It has become a standard database that is used to practice image classification.
    It is tightly integrated with Keras and TensorFlow, making it readily available
    and easy to call into the model. It is great for teaching machine learning to
    beginners as the data is already manipulated and divided, making the rest of the
    program easy to do.


    ### The API


    We will be using the Keras API within TensorFlow, as it makes our work easier
    by providing us with the necessary utilities for creating our neural network.


    ### The Activation Functions


    We will be using the Softmax activation function only, since we have just a single
    layer.


    ### The Optimizer


    We will be using the Adam optimizer in this neural network.


    ### The Program


    **Step 1: Open a new Python 3 Jupyter notebook.** We will start by opening a brand
    new Python 3 Jupyter notebook. We need to make sure that it is in the correct
    environment. We can also give it a name if we want to. Something like “My First
    Neural Network” or “Programming with TensorFlow 2.0” would suffice.


    **Step 2: Import TensorFlow into your kernel.** In the first “Code” cell that
    appears, we type in the following:


    ```

    import tensorflow as tf

    ```


    This will call the TensorFlow library into our kernel, allowing us to use it.


    **Step 3: Load the MNIST dataset.** We now need to call the dataset into our Jupyter
    notebook. We do this by typing the following:


    ```

    data = tf.keras.datasets.mnist

    (ip_train, op_train), (ip_test, op_test) = data.load_data()

    ```


    This tells the program to call the dataset from within the library, and to load
    it into the kernel. As you can see, we have begun making use of the Keras API
    as well. `ip_train` and `ip_test` are nothing but the training and test data for
    the inputs. Similarly, `op_train` and `op_test` are the training and test data
    for the outputs.


    **Step 4: Prepare the data.** Now, as mentioned earlier, we need not manipulate
    our data too much, since that has already been done for us. However, we do need
    to normalize our data. This makes sure that the pixel values of the images range
    between 0 and 1. We do this by dividing each element of the dataset by 255, as
    shown here:


    ```

    ip_train, ip_test = ip_train / 255.0, ip_test / 255.0

    ```


    **Step 5: Build the neural network.** We will now begin creating the architecture
    of our neural network. We start by flattening the input images (making them one-dimensional),
    after which we add one dense layer. This layer uses the Softmax activation function.
    See the following:


    ```

    model = tf.keras.models.Sequential([

    tf.keras.layers.Flatten(input_shape = (28,28)),

    tf.keras.layers.Dense(10, activation = ''softmax'')

    ])

    ```


    The number of neurons in the last dense layer depends on the number of outputs
    (labels) that we are expecting. In this case, we expect ten outputs (the number
    of digits ranging from 0 to 9), and hence, the number of neurons is ten.


    **Step 6: Compile the model.** We compile our model by selecting the loss function,
    optimizer, and the metrics.


    **Loss function:** This measures the accuracy of the model during training. We
    need to minimize this function to ensure that the model is on the right path.


    There are three main loss functions that we will be using:


    1.  `binary_crossentropy`: This is the default loss function that is used for
    binary classification.

    2.  `categorical_crossentropy`: This is the default loss function that is used
    for multi-class classification.'
