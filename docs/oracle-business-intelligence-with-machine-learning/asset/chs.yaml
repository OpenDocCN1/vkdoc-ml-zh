  \n图 3-12.\n\n清单 3-16 中 IMAGE 列的 PNG 输出\n\n### 将 PNG 图与 OBIEE 集成\n\n将 R PNG 图输出与\
  \ OBIEE 12c 集成需要下载现有存储库，或创建一个新存储库并将其与 OBIEE 12c 存储库集成。在本节中，我们将下载现有的 `SampleAppLite`\
  \ 存储库并对其进行修改，以反映我们的葡萄酒产地预测图。\n\n#### OBIEE 12c 集成所需的预备步骤\n\n在从 OBIEE 12c 服务器下载 SampleAppLite\
  \ 存储库之前，必须完成一些预备步骤，以便 OBIEE 12c 能够与测试数据库和模式通信：\n\n1.  在位于 `<FusionMiddlewareHome>\\\
  user_projects\\domains\\bi\\config\\fmwconfig\\biconfig\\OBIS` 文件夹中的 `NQSConfig.INI`\
  \ 文件中，进行以下更改：\n    1.  在 `[ADVANCE_ANALYTICS_SCRIPT]` 部分，将 `TARGET = \"ORE\";` 的值设置为\
  \ `TARGET = \"ORE\";`，并将连接池的值设置为 `CONNECTION_POOL = \"ORCL\".\"testr/testr:1521\"\
  ;`  \n    2.  确保在 Oracle DB 12c 服务器的 `tnsnames.ora` 文件中定义了 ORCL 别名。   \n2.  通过发出\
  \ `stop.cmd` 命令，然后发出 `start.cmd` 命令，重新启动 WebLogic Server 和相关服务。这些命令位于 `<FusionMiddlewareHome>\\\
  user_projects\\domains\\bi\\bitools\\bin` 文件夹中。  \n3.  重新启动 Oracle Business Intelligence\
  \ 服务（如果在 Windows 上，则通过任务管理器 ➤ 服务进行）。  \n4.  使用以下命令下载对应于 SampleAppLite 的服务器 RPD 文件：\n\
  \n    ```\n    \\user_projects\\domains\\bi\\bitools\\bin\\datamodel.cmd downloadrpd\
  \ -O obieenew.rpd -W Admin123 -U weblogic -P  -SI ssi\n    ```\n\n    RPD 被下载为 `obieenew.rpd`\
  \ 文件。\n\n\n\n#### 自定义下载的 SampleAppLite RPD 以集成 ORE 返回的 PNG 图形\n\n将葡萄酒原产地预测图与 `obieenew.rpd`\
  \ 文件集成的完整步骤包括对 `obieenew.rpd` 的自定义，该操作在客户端的 OBIEE 管理工具中完成。\n\n这主要包括以下步骤：\n\n1. \
  \ 创建 Oracle 连接池\n2.  创建物理层\n3.  创建业务模型和映射层\n4.  创建表示层\n\n这些步骤将在后续小节中描述。\n\n#####\
  \ 创建 Oracle 连接池\n\n具体步骤如下：\n\n1.  在 OBIEE 管理工具中以离线模式打开 `obieenew.rpd`。在物理层中，选择新建数据库。按图\
  \ 3-13 所示对话框填写详细信息。\n\n    ![A439668_1_En_3_Fig13_HTML.jpg](img/A439668_1_En_3_Fig13_HTML.jpg)\n\
  \n    图 3-13.\n\n    OBIEE 管理工具中的新建数据库对话框\n2.  单击连接池选项卡，创建一个具有图 3-14 所示属性的新连接池。数据源名称必须指定为\
