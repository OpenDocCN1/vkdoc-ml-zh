  \ 和 `Origin3`。相比之下，此处的输出是介于 0 和 1（含）之间的数值分数。\n\n注意\n\n通过在 OBIEE 分析和仪表板中使用葡萄酒产地预测模型和购买倾向模型的输出，业务分析师或\
  \ BI 用户可以做出支持采取适当行动以加速业务流程的决策。通过这种方式，BI 可以扩展到由 Oracle 12c 和 OBIEE 中的 R/ORE 驱动的机器学习支持的预测分析领域。\n\
  \n\n\n### 使用 BI 仪表盘进行可操作决策\n\n在 OBIEE 中，利用葡萄酒产地预测来构建决策支持解决方案的用例有很多。主要用例列举如下：\n\n\
  *   影响购买倾向（如前一小节所述）\n*   根据产地预测产量\n*   预测葡萄酒品质\n*   推荐用途\n\n你可以使用与 OBIEE 集成的基于 R\
  \ 语言的机器学习模型，或者直接使用 OBIEE，具体操作如下：\n\n*   购买倾向可以通过名为逻辑回归或广义线性模型（GLM）的机器学习算法进行预测。在\
  \ OBIEE 中，这可以通过使用内置的回归分析函数，或者使用基于 R 或 ORE 的逻辑回归模型，然后利用概率值来确定结果。\n*   产量预测也可以在 OBIEE\
  \ 中直接完成，方法是结合过去的购买趋势与时间序列分析，或者使用 `Evaluate_Script` 分析函数配合基于 SQL 的模型对模型进行评分。也可以使用类似于预测葡萄酒产地的\
  \ R 或 ORE 函数。\n*   品质预测可以通过使用相同的、基于产地或来源预测变量的随机森林机器学习模型来完成。\n*   用途推荐可以通过使用推荐引擎常用的机器学习算法，并将其集成到\
  \ OBIEE 仪表盘中来实现。\n\n注意\n\n预测购买倾向可以通过以下方式辅助决策支持：\n\n1.  葡萄酒的需求量\n2.  每位消费者带来的收入和利润\n\
  3.  提升葡萄酒品质\n\n## 用例的技术与功能分析\n\n无论业务用例和所使用的机器学习模型是什么，使用基于 AI 的机器学习模型（OBIEE 可利用这些模型构建可操作的决策支持解决方案）都可以分解为以下步骤：\n\
  \n1.  在 Oracle 中使用 R 语言构建基于 AI 的机器学习模型。\n2.  在业务数据集上对模型进行评分，以生成图形输出或进行预测分析。\n3.\
  \  将前述输出与 OBIEE 集成，用于可视化和决策支持。这可以是一个可在 OBIEE 中利用的基于 SQL 的脚本，也可以是 PNG 格式的输出。\n  \
  \  1.  交互式图表可以根据用户输入的参数或控件动态驱动。\n    2.  SQL 和基于图表的输出可以组合起来与 OBIEE 集成。前者可供技术用户调整关键绩效指标（KPI），后者可供技术/业务用户创建更详细的可视化内容，以支持面向最终用户的分析。\n\
  \n图 5-1 展示了 OBIEE 仪表盘的可视化效果，该效果结合了葡萄酒产地预测的初始用例与购买倾向预测用例。这些看起来可能过于简单，但重要的是要知道，当它们被启用为交互式或基于\
  \ SQL 的控件时，它们能够驱动用户操作，如前文步骤所述。\n\n![A439668_1_En_5_Fig1_HTML.jpg](img/A439668_1_En_5_Fig1_HTML.jpg)\n\
  \n图 5-1.\n\n仪表盘展示了预测葡萄酒产地的配对图，并利用该结果基于葡萄酒产地（来源）预测购买倾向\n\n### 图形输出分析：使用随机森林预测葡萄酒产地的配对图\n\
  \n该配对图展示了 `table(origin_pred, test_set$origin)` 的图形。以下是 `table(origin_pred, test_data$origin)`\
  \ 的输出：\n\n```\n> table(origin_pred, test_data$origin)\norigin_pred Origin1 Origin2\
  \ Origin3\nOrigin1     140       0       0\nOrigin2       0     162       0\nOrigin3\
  \       0       0     111\n```\n\n以下是 R 语言中调用配对图的代码：\n\n```\npairs(table(origin_pred,\
  \ test_set$origin), main=\"Wine Origin Predictors\")\n```\n\n响应变量以对角线形式呈现，从左上到右下。这些是结果\
  \ `Origin1`、`Origin2` 和 `Origin3`。然后每个变量与其他变量进行绘图。这里，我们使用 `table`（或矩阵）输出，将 `origin_pred`\
  \ 的值与 `test_data$origin` 的值进行绘图。第一列中间的图是 `Origin1` 与 `Origin2` 的单个配对图——同样以 `table`\
  \ 输出形式呈现。这对应于前面表格输出中的第一行。\n\n同样的图形在顶部中间行重复出现。如您所见，这对应于前面表格中的第二行。左上角没有数据，因为那将是一条绘制产地与产地关系的直线对角线，而不是\
  \ `origin_pred` 与 `origin` 的关系。\n\n其他单个图形可以类似地进行分析，以对应前面表格输出中的相应行。\n\n\n\n### 图表输出分析：基于葡萄酒来源预测购买倾向\n\
  \n`ggplot` 是一个属于 `ggplot2` R 库的图形可视化函数。使用 `ggplot`，图表或图形由以下部分组成：\n\n数据 + 美学映射 +\
  \ 几何对象\n\n其中，数据是一个 R 数据框。美学映射表示 x 和 y 变量，以及/或者图表元素（点、线、带状区域、条形等）的类型、颜色和大小。几何对象是图表的类型；例如点图、线图、条形图、带状图、箱线图和密度图。创建自定义图表的主要函数是\
  \ `ggplot()`，它允许组合点、线、带状等元素。参数 `group` 在这里很重要。`ggplot` 调用的规范设置了图表画布，并将响应变量放在 y 轴上。\n\
  \n注意\n\n关于 `ggplot` 及其函数调用、签名和示例的详细介绍，请访问 [`www.r-bloggers.com/part-3a-plotting-with-ggplot2/`](https://www.r-bloggers.com/part-3a-plotting-with-ggplot2/)\
  \ 。\n\n以下是我们示例用例中用于绘制基于葡萄酒来源预测购买倾向的 `ggplot()` 函数调用：\n\n```\nlibrary(ggplot2)\n\
  gg_plot <- ggplot(data=test_set, aes(x=Source, y=p_to_buyPred, group=1)) +\ngeom_line(aes(colour\
  \ = p_to_buyPred), size = 1) + geom_point() +\nstat_smooth(method=\"glm\", family=\"\
  binomial\", se=FALSE) +\nggtitle(\"Predicting Propensity to buy based on Wine Source\"\
  ) +\nlabs(x=\"Source\", y=\"Predicted Probability - p_to_buyPred\")\nplot(gg_plot)\n\
  ```\n\n注意\n\n`geom_line` 和 `stat_smooth` 连接属于同一组的数据点。通过指定 `group=1`，我们告诉 `ggplot`\
  \ 所有数据点都属于组 1。因此，我们得到一条单一的（V 形）线，它将 `geom_point()` 绘制的三个数据点连接在一起。此外，如下所述，回归线也会出现在图表中。\n\
  \n对 `geom_line()` 的调用包含 `colour=p_to_buyPred`，这意味着线条颜色由 `p_to_buyPred` 变量的水平（预测概率）自动控制；`size\
  \ = 1` 表示线条大小为 1 个单位。如前所述，`aes` 表示线条的美学映射。`stat_smooth()` 函数基于原始数据通过 `link = \"\
  binomial\"` 的 GLM 模型转换，在 `geom_line` 和 `geom_point` 几何对象上生成并拟合一条平滑线（回归线或最佳拟合线）作为图层。这也被称为绘制回归斜率。这通过参数\
  \ `method = \"glm\"`、`family=\"binomial\"` 传递。参数 `se` 指示是否显示要使用的置信区间（默认为 0.95）。`method`\
  \ 参数是要使用的平滑方法（在此代码中指定为 `glm`，因为我们使用了逻辑回归模型），`formula` 是平滑函数中要使用的公式。平滑函数有助于识别何时发生过绘制。在图\
  \ 5-1 中，这显示为图表中间分割 V 形线的线。\n\n对 `geom_point()` 的调用不带任何参数意味着使用默认的点形状（即圆点）和颜色（即黑色）。此函数调用绘制实际数据点。\n\
  \n`ggtitle` 打印其参数中给出的图表标题。`labs` 指示图表的 x 轴和 y 轴标签，分别为 `\"Source\"` 和 `\"Predicted\
  \ Probability - p_to_buyPred\"`。可以通过更改与透明度、颜色、线型和大小相对应的参数来自定义 ggplot。\n\n### 更详细层面的分析\n\
  \n在更详细的层面上，可以通过使用 `geom_ribbon()` 几何对象的带状图进一步分析购买倾向的用例。我们首先通过从 `Wineptobuy.csv`\
  \ 文件中采样原始数据获得的 tsetse 数据集中省略 `propensity_to_buy` 列来推导测试数据。我们将此数据加载到一个名为 `test_set2`\
  \ 的数据框中。然后，我们使用 `test_set2` 推导出 `test_set3`。清单 5-1 显示了此分析的完整代码。\n\n\n```markdown\n\
  \n```\nlibrary(ORE)\nore.connect(\"testr\",\"orcl\",\"localhost\",\"testr\")\nlibrary(OREmodels)\n"
- '# 假设 Wineptobuy.csv 文件位于调用 ORE CLI 时的工作目录中

  winedata <- read.csv("Wineptobuy.csv", header = TRUE)

  head(winedata)

  '
- '# 将数据拆分为训练集和测试集

  ind <- sample(2, nrow(winedata), replace = TRUE, prob = c(0.7, 0.3))

  train_set <- winedata[ind == 1, ]

  test_set <- winedata[ind == 2, ]

  '
- '# 使用训练集拟合逻辑回归模型

  logitM <- glm(formula = propensity_to_buy ~ Source, family = binomial, data = train_set)

  summary(logitM)

  '
- '# 使用测试集进行预测

  logitPredict <- predict(logitM, newdata = test_set, type = "response")

  head(logitPredict)

  '
- '# 将预测概率转换为类别（1 或 0）

  p_to_buyPred <- ifelse(logitPredict > 0.5, 1, 0) # 将概率量化为值 1 和 0

  misClasificError <- mean(p_to_buyPred != test_set$propensity_to_buy)

  print(paste(''准确率'', 1 - misClasificError))

  '
- '# 对于 p>0.5，ROC 总结了所有可能值的预测情况

  '
- '# 曲线下面积（AUC）是 ROC 的最佳性能指标，AUC 值越高越好

  '
- '# 该模型（glm）的预测效果也越好。

  '
- '# 该包能够使用 prediction、performance 和 plot 函数可视化评分分类器的性能。

  '
- '# 其定义可在 http://rocr.bioinf.mpi-sb.mpg.de/ 找到

  library(ROCR)

  class(test_set$p_to_buyPred) # 显示 test_set 中预测值 p_to_buyPred 的 R 类

  '
- '# 使用 GLM 的 R 语言 prediction() 函数将包含预测的输入数据转换为标准格式

  '
- '# 此处转换由 p_to_buyPred（预测值）和 propensity_to_buy 给出的两列数据为标准格式

  '
- '# 并返回一个类为 prediction 的对象。

  pr1 <- prediction(test_set$p_to_buyPred, test_set$propensity_to_buy)

  class(pr1) # 这会将类显示为 "prediction"

  '
- '# performance 函数用于执行预测器评估。其签名为

  '
- '# performance(prediction.obj, measure, x.measure)。它作用于一个 prediction 对象（本例中为 pr1），

  '
- '# measure 是用于评估的性能度量（本例中为 "tpr" 或真阳性率），

  '
- '# x.measure 是第二个性能度量（"fpr" 或假阳性率）。measure 绘制在 y 轴，

  '
- '# x.measure 绘制在 x 轴，从而形成一条二维曲线。也可以传递其他度量，例如 "auc"（ROC 曲线下面积）、

  '
- '# "acc"（准确率）、"err"（错误率）等。

  prf1 <- performance(pr1, measure = "tpr", x.measure = "fpr")

  class(prf1) # 这会将类显示为 "performance"

  pdf("plot_prf1.pdf") # 这会将绘制的图形保存为工作目录中的 PDF 文件

  '
- '# 这会绘制一个类为 performance 的对象，本例中为 prf1。colorize 指定曲线是否

  '
- '# 根据截止点进行着色。

  plot(prf1, colorize = TRUE) # , text.adj = c(-0.2,1.7)

  dev.off()

  '
- '# 这会对 performance() 函数进行不同的调用，要评估的度量设为 "auc" 或 ROC 曲线下面积。

  '
- '# 这会返回上述预测以 "auc" 作为评估度量的性能。Auc 是 ROC 曲线下的面积。

  auc1 <- performance(pr1, measure = "auc")

  auc1 <- auc1@y.values[[1]]

  auc1 # "auc" 越接近 1 或等于 1 表示模型拟合优度好，预测性能更佳

  library(ROCR)

  p <- predict(logitM, newdata= data.frame(test_set[,c(1:19)]), type="response")

  class(p)

  pr <- prediction(p, test_set$propensity_to_buy)

  class(pr)

  prf <- performance(pr, measure = "tpr", x.measure = "fpr")

  class(prf)

  plot(prf, colorize = TRUE) # , text.adj = c(-0.2,1.7)

  auc <- performance(pr, measure = "auc")

  auc <- auc@y.values[[1]]

  auc

  test_set2 <- data.frame(test_set[,c(1:19)])

  head(test_set2)

  '
- '# R 语言内部的 within 函数使用 test_set3 数据集作为其参数，并生成一个用于

  '
- '# 带状图层数据的 data.frame。within 内部的第一行生成预测概率以及

  '
- '# 有助于绘制置信区间的标准误差。参数 se 用于指定是否

  '
- '# 显示要使用的置信区间（默认为 0.95），并且还可以绘制置信区间。

  '
- '# type="link" 给出链接尺度上的估计值。

  '
- '# 剩余的行将预测值和置信区间都反向转换为概率。

  '
- '# cbind 对数据框 test_set2 与 predict 函数评分的预测结果列进行按列绑定，

  '
- '# 该预测结果列作为第二个参数传递给 cbind。对于逻辑回归模型，置信区间

  '
- '# 基于剖面似然函数。lower 和 upper 表示置信下限和上限。

  test_set3 <- cbind(test_set2, predict(logitM, newdata=test_set2, type = "link",
  se = TRUE))

  test_set3 <- within(test_set3, {

  PredictedProb <- plogis(fit)

  lower <- plogis(fit - (1.96 * se.fit))

  upper <- plogis(fit + (1.96 * se.fit))

  })

  head(test_set3)

  library(ggplot2)

  pdf("test_set3_ribbon.pdf") # 下面一行设置图形画布，y 轴为响应变量

  ggplot(test_set3, aes(x = Source, y = PredictedProb, group=PredictedProb)) +

  geom_line(aes(colour = PredictedProb), size = 1) + geom_point() + # 绘制实际数据点

  geom_ribbon(aes(ymin = lower, ymax = upper, fill = PredictedProb), alpha = 0.25)
  + # alpha 淡化连接线

  scale_fill_gradient(low="red", high="green") + # 为带状图层定义连续颜色标度

  ggtitle("基于葡萄酒来源预测购买倾向") + # 最终图形的标题

  ylab("预测概率 - p_to_buyPred") # 指定 y 轴标签。这也作为图形图例

  dev.off()

  清单 5-1.

