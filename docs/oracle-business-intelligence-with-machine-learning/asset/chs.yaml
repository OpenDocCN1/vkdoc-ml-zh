  \ 6-12 和图 6-13 所示。\n\n图 6-14 显示了最终的仪表盘，其中展示了预测葡萄酒产地，然后利用该产地预测购买倾向的配对图。\n\n## 总结\n\
  \n本章介绍了在 OBIEE 12c 中实现机器学习的内容。从简要描述业务问题和解决方案开始，详细说明了如何利用基于 GLM 模型的逻辑回归机器学习算法，根据葡萄酒产地预测购买倾向。然后，本章展示了模型输出的各种形式，包括\
  \ XML、结构化表格结果和 PNG 图形。最后，概述了如何将 PNG 图像与 OBIEE 仪表盘集成，并与葡萄酒产地预测图合并，最终形成一个并排显示两者的仪表盘。在必要之处提供了可执行代码及其执行输出。\n\
