  \ `SELECT` 语句被保存为一个名为 `rTestRF.sql` 的 SQL 文件。图像 `rTestRF.png` 创建在设置为工作目录的文件夹中，如代码第\
  \ 6 行所示。\n\n要执行清单 3-8 到 3-13 中的代码，可以使用 SQL*Plus。也可以使用基于 GUI 的界面，例如 Oracle SQL Developer。打开\
