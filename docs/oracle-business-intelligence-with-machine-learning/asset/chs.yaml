  使用嵌入式 R 执行的 SQL 接口构建和测试 randomForest() 模型\n```\n\n要验证脚本是否已存储在 Oracle 数据库 R 脚本仓库中，请从\
  \ ORE 数据库用户帐户发出查询，如清单 3-9 所示。\n\n```\nSQL> select * from user_rq_scripts where name\
  \ = 'rTestRF';\nNAME\n\nSCRIPT\n\nrTestRF\nfunction () {\nlibrary(randomForest)\n\
  setwd(\"F:/testr/\")\nwinedata \n清单 3-9.\n用于验证脚本 rTestRF 已在 Oracle RB 中创建的 SQL 查询\n\
  ```\n\n请注意，`NAME` 列的值是 `rTestRF`，而 `SCRIPT` clob 列显示了 R 函数的定义，如清单 3-8 中所定义。\n\n\
