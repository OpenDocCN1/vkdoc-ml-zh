  \ # 显示上述矩阵\n0   1\nOrigin1   0 104\nOrigin2 122   0\nOrigin3   0  84\n> train_set$Source\
  \ <- factor(train_set$Source) # 将 Source 视为分类变量\n```\n\n\n我们使用 R 语言中的 `glm` 机器学习算法构建了一个逻辑回归模型，其中响应变量为\
  \ `propensity_to_buy`，预测变量为 `Source`，使用的数据集是 `train_set`。glm 模型的族函数为 `\"binomial\"\
  `（表明该模型是二项式模型），链接函数为 `logit`，最大迭代次数设置为 100：\n\n```\n> logitM <- glm(propensity_to_buy\
  \ ∼ Source, data = train_set, family=\"binomial$\n```\n\n我们展示刚构建的 `logitM` 模型的摘要，内容包括：`glm`\
  \ 的函数调用；偏差残差（最小值、第一四分位数、中位数、第三四分位数和最大值），这些是模型拟合程度的度量，换句话说，即模型中观测值所用偏差残差的分布；系数表，其中包含系数、标准误差、z\
  \ 统计量或 Wald Z 统计量以及相应的 p 值（横向排列），截距和预测变量（纵向排列）；拟合指数，包括零偏差、残差偏差以及赤池信息准则（AIC）。AIC\
  \ 值最小的模型被认为在模型系数方面拟合良好且无惩罚。\n\n```\n> summary(logitM)\nCall:\nglm(formula = propensity_to_buy\
  \ ∼ Source, family = \"binomial\",\ndata = train_set, control = glm.control(maxit\
  \ = 100))\nDeviance Residuals:\nMin          1Q      Median          3Q        \
