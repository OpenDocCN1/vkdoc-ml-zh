  \ # 显示所构建和评分模型的准确率\n[1] \"Accuracy 1\"\n> ####\n```\n\n准确率接近 1 被认为是最优的。使用 `ROCR`\
  \ 库加载用于绘制接收者操作特征（ROC）曲线的 R 函数。ROC 通过评估真正率（或灵敏度）与假负率（或 1-特异度）之间的交叉相关性来总结模型的性能。保持\
  \ p > 0.5，ROC 总结了所有 p > 0.5 可能值的预测结果。曲线下面积（AUC）是 ROC 的一个最优性能指标；AUC 值越高，`glm` 模型的预测效果越好。该包通过使用\
  \ `prediction`、`performance` 和 `plot` 函数来实现评分分类器性能的可视化。其定义可在 [`http://rocr.bioinf.mpi-sb.mpg.de/`](http://rocr.bioinf.mpi-sb.mpg.de/)\
  \ 找到。\n\n```\n> library(ROCR)\nLoading required package: gplots\nAttaching package:\
  \ 'gplots'\nThe following object is masked from 'package:stats':\nlowess\nWarning\
  \ messages:\n1: package 'ROCR' was built under R version 3.2.5\n2: package 'gplots'\
  \ was built under R version 3.2.5\n> class(test_set$p_to_buyPred) # 显示 test_set\
  \ 的预测值 p_to_buyPred 的 R 类\n[1] \"numeric\"\n```\n\n我们使用 GLM 的 R `prediction()` 函数将包含预测结果的输入数据转换为标准格式。此处，它将\
  \ `p_to_buyPred`（预测值）和 `propensity_to_buy` 这两列数据转换为标准格式，并返回一个类为 `prediction` 的对象。\n\
  \n```\n> pr1  class(pr1) # 这给出类为 \"prediction\"\n[1] \"prediction\"\nattr(,\"package\"\
  )\n[1] \"ROCR\"\n```\n\n`performance` 函数用于进行预测器评估。其签名为 `performance(prediction.obj,\
  \ measure, x.measure)`。它作用于一个预测对象（本例中为 `pr1`），`measure` 是用于评估的性能度量（本例中为 `\"tpr\"\
  `，即真正率），而 `x.measure` 是第二个性能度量（`\"fpr\"`，即假正率）。`measure` 绘制在 y 轴上，`x.measure` 绘制在\
  \ x 轴上，从而形成一条二维曲线。也可以传入其他度量，例如 `\"auc\"`（ROC 曲线下面积）、`\"acc\"`（准确率）和 `\"err\"`（错误率）。\n\
  \n```\n> prf1  class(prf1) # 这给出类为 \"performance\"\n[1] \"performance\"\nattr(,\"\
  package\")\n[1] \"ROCR\"\n> pdf(\"plot_prf1.pdf\") # 将绘制的图形保存为工作目录中的 PDF 文件\n```\n\
  \n以下代码绘制一个类为 performance 的对象，在本例中为 `prf1`。`colorize` 指定是否根据截止点对曲线进行着色。\n\n```\n\
  > plot(prf1, colorize = TRUE) # , text.adj = c(-0.2,1.7)\n> dev.off()\nnull device\n\
  \n```\n\n这会对 `performance()` 函数进行不同的调用，其中要评估的度量是 `\"auc\"`，即 ROC 曲线下面积。这将返回之前预测的性能，以\
  \ `\"auc\"` 作为评估度量，即 ROC 曲线下面积。\n\n```\n> auc1  auc1  auc1 # \"auc\" 接近 1 或等于 1\
  \ 表示模型拟合良好且预测性能更佳\n[1] 1\n> ####\n> library(ROCR)\n> p  class(p)\n[1] \"numeric\"\
  \n> pr  class(pr)\n[1] \"prediction\"\nattr(,\"package\")\n[1] \"ROCR\"\n> prf \
  \ class(prf)\n[1] \"performance\"\nattr(,\"package\")\n[1] \"ROCR\"\n> plot(prf,\
  \ colorize = TRUE) # , text.adj = c(-0.2,1.7)\n> auc  auc  auc\n[1] 1\n> test_set2\
