  \ R 开源语言。其广泛的算法集，加上对丰富图形和数据可视化的支持，使其成为数据分析和数据科学的首选语言。\n\n本章重点介绍面向企业的 R 技术。它还概述了如何使用一些广泛的\
  \ R 开源包，以及如何从机器学习的角度在 Oracle 数据库中使用 R 脚本和 Oracle R Enterprise。本章解释了如何将 Oracle R\
  \ Enterprise 与 OBIEE 结合使用。最后，它解释了如何通过使用 R 生态系统中的机器学习来执行大数据高级分析。\n\n## 面向企业的 R 技术\n\
