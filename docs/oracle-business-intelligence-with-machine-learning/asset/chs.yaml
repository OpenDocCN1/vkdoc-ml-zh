  \ link: logit\nResponse: propensity_to_buy\nTerms added sequentially (first to last)\n\
  Df Deviance Resid. Df Resid. Dev\nNULL                     309     415.59\nSource\
  \  2   415.59       307       0.00\n> # install.packages(\"aod\")\n```\n\n`wald.test`\
  \ 函数基于 `logitM` 模型的系数进行卡方检验统计量测试。在我们的案例中，我们可以使用 R 语言 `aod` 库中的这个函数来测试 `Source` 预测变量的显著性。系数表中模型系数的顺序与模型中项的顺序相同。这一点很重要，因为\
  \ `wald.test` 函数通过系数在模型中的顺序来引用它们。在以下三个 `wald.test` 调用中，参数 `b` 传递系数，`Sigma` 给出误差项的方差-协方差矩阵，`Terms`\
  \ 指示模型中需要测试的项。在我们的用例中，这些项是第 2 项和第 3 项。此外，对第 1 项和第 2 项、第 1、2 和 3 项以及第 2 和第 3 项运行\
  \ `wald.test` 函数，分别得到自由度为 2、3 和 2 的卡方检验统计量，且三种情况的 p 值均为 1.0，从而表明 `Source` 具有统计显著性。\n\
  \n```\n> library(aod)\nWarning message:\npackage 'aod' was built under R version\
