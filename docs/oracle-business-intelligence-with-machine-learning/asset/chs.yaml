  ```\n\n#### Oracle R Advanced Analytics for Hadoop\n\nOracle R Advanced Analytics\
  \ for Hadoop (ORAAH) 是 Oracle Big Data Connectors 软件套件的一个组件。ORAAH 的最新版本是 2.7.0。它将\
  \ Hadoop 集群内的 Hadoop 和 Apache Hive 与 Oracle 数据库（需具备 Advanced Analytics 选项）以及 R（通过包含\
  \ R 引擎和开源 R 包的 R 接口）集成在一起。可以使用基于 Hive 的 Hibernate 查询语言 (HQL) 以及通过将 HDFS 数据映射直接作为机器学习例程的输入，来处理\
  \ Hadoop 分布式文件系统 (HDFS) 中的数据。后者随后可以作为调用自定义 R 映射器和/或归约器的 MapReduce 作业来执行，或者通过使用 Apache\
  \ Spark 来执行。基于 Hive 的 HQL 支持数据准备、连接和视图创建。源数据可以是 HDFS 逗号分隔值 (CSV) 数据集、Hive 表，或者缓存到\
  \ Apache Spark 中作为弹性分布式数据集 (RDD) 的 HDFS CSV 数据集。与基于 Spark MLlib 的算法相比，ORAAH 基于 Spark\
