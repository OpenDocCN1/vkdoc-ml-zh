  \n图 3-45.\n\nTRENDLINE 的格状图、3D 图形和表格输出仪表盘\n\n## 总结\n\n本章涵盖了 Oracle R 技术。首先简要描述了开源\
  \ R，然后概述了 Oracle 的 R 技术，例如 Oracle R Distribution、ROracle、Oracle R Advanced Analytics\
  \ for Hadoop (ORAAH) 和 Oracle R Enterprise (ORE)。接着详细解释了使用 ORE 进行机器学习以及与 OBIEE 集成的端到端流程。我们介绍了以多种方式使用机器学习的随机森林分类算法，即使用\
  \ ORD、通过 R 接口和 SQL 接口执行嵌入式 R、生成相应的 PNG 图形，并将其与 OBIEE 集成以创建分析和仪表盘。最后，我们简要介绍了 EDW\
