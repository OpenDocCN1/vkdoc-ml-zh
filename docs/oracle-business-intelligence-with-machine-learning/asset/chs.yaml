  \ Hadoop 集群中的主要算法。这些算法用于机器学习和统计学习，并支持并行化和分布式执行。此外，GLM 和 LM 算法能够处理大数据并在企业范围内扩展，且比相应的\
  \ Apache Spark MLlib 模型更快。\n\n表 3-2.\n\nORAAH 支持的主要机器学习算法\n\n| 算法名称 | 描述 |\n| ---\
  \ | --- |\n| 线性回归 | 用于回归——基于 Spark 和 MapReduce |\n| 逻辑回归 LM 启用 Spark 缓存的多层感知前馈神经网络\
  \ (MLP NN) 启用 Spark 缓存的广义线性模型 (GLM) | 用于分类，基于 Apache Spark MLlib 用于回归，基于 Apache\
  \ Spark MLlib 和 MapReduce 用于分类，自 2.7.0 版本起基于 MapReduce 和 Spark |\n| 主成分分析 (PCA)\
  \ | 用于属性重要性，基于 Spark 和 MapReduce |\n| k-means | 用于聚类，基于 Spark 和 MapReduce |\n| 非负矩阵分解\
  \ (NMF) 低秩矩阵分解 (LMF) 高斯混合模型 相关性和协方差矩阵计算 最小绝对收缩和选择算子 (LASSO) 决策树 随机森林 支持向量机 | 用于特征提取，基于\
  \ MapReduce 用于特征提取，基于 MapReduce 2.7.0 版本新增，基于 Apache Spark MLlib 用于统计计算和学习，基于 MapReduce\
  \ 基于 Spark 基于 Spark 基于 Spark 基于 Spark |\n\n注意\n\n关于 ORAAH 的更多信息，包括支持的各种算法和基准测试，可在\
  \ Oracle 网站上找到：[`www.oracle.com/technetwork/database/database-technologies/bdc/r-advanalytics-for-hadoop/overview/index.html`](http://www.oracle.com/technetwork/database/database-technologies/bdc/r-advanalytics-for-hadoop/overview/index.html)。\n\
  \n使用 Hive 和 ORAAH 实现其中一些算法的实际用例示例，可在 [`https://blogs.oracle.com/R/entry/oracle_r_advanced_analytics_for`](https://blogs.oracle.com/R/entry/oracle_r_advanced_analytics_for)\
  \ 找到。\n\n\n\n#### Oracle R Enterprise\n\nOracle R Enterprise（ORE）是迄今为止最重要的 Oracle\
  \ R 技术，它随 Oracle 数据库的 Oracle Advanced Analytics 选件一同提供。ORE 通过直接利用 Oracle 数据库内计算来处理存储的数据，从而增强并扩展了开源\
  \ R 的执行能力，进而实现了更低的延迟、高性能计算、数据和任务的多线程并行执行、可扩展性以及更低或最小的内存使用。\n\n从架构角度来看，ORE 包含以下组件：\n\
  \n*   安装了 Oracle 数据库的数据库服务器机器，其中包含支持 ORE 客户端的库和 PL/SQL 程序\n*   安装在 Oracle 数据库上的\
  \ R 引擎，支持嵌入式 R 执行，并执行数据库内统计和机器学习功能。每个数据库 R 引擎、ORE 服务器和 ORE 客户端包。Oracle 数据库会生成多个\
  \ R 引擎以实现数据并行。数据库内 R 引擎具有原生 Oracle 数据库功能集，能够实现紧密的 SQL 集成和基于 DBMS 包的功能\n*   Oracle\
  \ R 发行版\n*   用于数据库连接的 R Oracle\n*   包含客户端 ORE 包、开源 R（或 Oracle R 发行版）和 ROracle 的客户端\
  \ R 引擎\n*   数据库 R 脚本仓库，用于在 Oracle 数据库内存储 R 脚本，这些脚本可以直接从 SQL 中按名称调用\n*   数据库 R 数据存储，用于在\
  \ Oracle 数据库内存储 R 对象\n\n图 3-1 概述了 ORE 架构。\n\n![A439668_1_En_3_Fig1_HTML.jpg](img/A439668_1_En_3_Fig1_HTML.jpg)\n\
  \n图 3-1.\n\nOracle R Enterprise 架构概览\n\n从增强功能的角度来看，ORE 通过以下方式扩展了开源 R：\n\n*   ORE\
  \ 透明层\n*   嵌入式 R 执行（通过嵌入式 R 引擎）——包括 R 接口和 SQL 接口\n*   预测分析\n\n在撰写本文时，Oracle R Enterprise\
  \ 的最新版本是 1.5.0。\n\n注意\n\n有关 ORE 的更多信息，包括 ORE 1.5.0 中的增强功能，请访问 [`www.oracle.com/technetwork/database/database-technologies/r/r-enterprise/overview/index.html`](http://www.oracle.com/technetwork/database/database-technologies/r/r-enterprise/overview/index.html)。\n\
  \n从企业角度来看，ORE 具有以下特性：\n\n表 3-3.\n\nORE 嵌入式执行 API（适用于 R 接口和 SQL 接口）\n\n| API R 接口\
  \ | API SQL 接口 | 描述 |\n| --- | --- | --- |\n| `ore.doEval` | `rqEval` | 执行函数 `f`，不带输入数据参数。\
  \ |\n| `ore.tableApply` | `rqTableApply` | 执行函数 `f`，通过 `f` 的第一个参数（作为 `data.frame`）提供\
  \ `ore.frame` 输入数据参数。 |\n| `ore.groupApply` | `rqGroupApply` | 根据索引列中的值对数据进行分区，然后执行函数\
  \ `f`。每个数据分区作为 `data.frame` 参数提供给 `f` 的第一个参数。支持对 `f` 的每次调用进行并行执行。 |\n| `ore.rowApply`\
  \ | `rqRowEval` | 通过传递所提供输入数据的行块来执行函数 `f`。每个输入数据块作为 `data.frame` 传递给 `f` 的第一个参数。支持对\
  \ `f` 的每次调用进行并行执行。 |\n| `ore.indexApply` | 不适用 | 执行函数 `f`，不带输入数据参数，但带有执行调用的索引 1\
  \ 到 n，其中 n 是函数调用的次数。支持对 `f` 的每次调用进行并行执行。 |\n| `ore.scriptCreate` | `sys.rqScriptCreate`\
  \ | 将 R 脚本以给定的名称和关联函数存储到 ORE R 脚本仓库中。 |\n| `ore.scriptDrop` | `sys.rqScriptDrop`\
  \ | 从 ORE R 脚本仓库中删除具有给定名称的 R 脚本。 |\n| `ore.scriptLoad` |   | 从 ORE R 脚本仓库加载具有给定名称的\
  \ R 脚本，以便后续执行与该 R 脚本关联的函数。 |\n\n在“描述”列中，函数 f 指的是与每个 API 关联的 R 函数。\n\n*   ORE 在内存分配和多线程执行方面提供了所需的优化，无需额外的补充包，因为它能够直接在\
  \ Oracle 数据库中的数据上执行数据库内的 R 脚本和模型。大型数据集可以加载到内存中，并通过函数调用运行，而无需创建数据的副本，从而消除了 R 的按值调用语义。这在执行来自\
  \ CRAN 集合的开源 R 包时也同样适用。\n*   通过 R 进行的数据库内数据计算和分析是透明完成的。基本的 R 操作可以编码为 R data.frame。相应的\
  \ R 函数以重载的函数定义形式暴露，其执行被推送到 Oracle 数据库。统计和机器学习操作在 Oracle 表的数据上执行。ORE 提供了 `ore.frame`\
  \ 对象（`data.frame` 的子类），这些对象会替代数据库表，从而生成 SQL，用于对存储在 Oracle 中的数据进行数据库内执行。这种透明层在操作效率和大数据集规模下提供了更低的延迟和最佳性能。\n\
  *   通过使用 Oracle 数据库生成的嵌入式 R 引擎，ORE 通过其嵌入式 R 执行支持实现了数据和任务的并行性。利用更多的内存可用性和数据库启用的数据并行性，嵌入式\
  \ R 执行能够执行嵌入在 SQL 和 PL/SQL 例程中的 R 脚本（包括基于开源 CRAN 包的脚本）。这种处理方式称为无人值守处理。R 脚本可以存储在数据库\
  \ R 脚本仓库中，并在调用 SQL 语句时按名称调用。这也可以动态完成。嵌入式 R 执行通过 R 和 SQL API 暴露。此类执行的输出可以是结构化数据、R\
  \ 对象和图形的 XML 表示，或者通过 Oracle 表中的 BLOB 列生成的 PNG 图形。后者通过将 R 的结果传递给商业智能和高级分析，实现了与其他应用程序（如\
  \ OBIEE RPD 和仪表板）的无缝集成。表 3-3 列出了 ORE v1.5.0 的这些 API（包括 R 接口和 SQL 接口）。\n*   ORE 还允许通过\
  \ R 与数据库内预测分析算法进行交互。示例包括 OREeda（探索性数据分析）、OREdm（数据挖掘）和 OREpredict。OREeda 可以实现线性模型、逐步回归、广义线性模型、神经网络和随机森林算法，以及基础\
  \ SAS 等效功能。\n\nOREeda 包含数据库启用的 ORE 版本的 R 模型，用于并行执行线性回归和逐步回归、广义线性模型、神经网络和随机森林分类。它通过以下函数暴露这些功能：`ore.lm()`\
  \ 用于线性回归和最小二乘回归，`ore.stepwise()` 用于逐步最小二乘回归，`ore.glm` 用于广义线性模型和逻辑回归，`ore.neural()`\
  \ 用于模式识别的神经网络模型，以及 `ore.randomForest()` 用于分类。所有这些都基于 `ore.frame` 中的数据工作，并可用于基于 Oracle\
  \ 数据库中的数据创建 R 模型。\n\nOREdm 拥有与实现分类、回归、聚类、属性重要性、关联规则、特征提取和异常检测等效的 Oracle 数据挖掘算法。这些算法可用于使用\
  \ Oracle 表中的数据构建模型。以下是算法列表：\n\n\n\n*   分类\n    *   决策树\n    *   GLM 分类——二元逻辑回归\n\
  \    *   朴素贝叶斯\n    *   支持向量机\n    *   随机森林——ORE V1.5.0 新增\n*   回归\n    *   GLM\
  \ 回归（线性回归和岭回归）\n    *   支持向量机\n*   聚类\n    *   k-means（一种基于距离的聚类算法）\n    *   正交划分聚类，或\
  \ O-Cluster（`ore.odmOC`）\n*   属性重要性（最小描述长度——`ore.odmAI`）\n*   关联规则\n    *   Apriori（`ore.odmAssocRules`）\n\
  *   特征提取\n    *   非负矩阵分解（`ore.odmNMF`）\n    *   主成分分析——V1.5.0 新增\n    *   奇异值分解——V1.5.0\
  \ 新增\n*   异常检测\n    *   支持向量机\n\nOREpredict 提供了使用选定的 R 模型对 `ore.frame` 对象中的数据库内数据进行评分的能力。通常，使用\
  \ R 模型进行评分的数据必须位于 R 的 `data.frame` 中。ORE 允许在评分操作期间将这些原生 R 模型透明地转换为 SQL。示例包括用于行为分析的数据库内\
  \ SQL 和 R 预测模型。OREpredict 包含以下算法：\n\n*   线性模型\n*   广义线性模型\n*   负二项广义线性模型\n*   多项对数线性模型\n\
  *   k-means 聚类\n*   层次聚类\n*   神经网络\n*   递归划分与回归树\n\nORE 提供了在企业级分析所需数据的备份、恢复和安全性。\n\
  \nORE 会自动处理从 Oracle 表到 R 的 `data.frame` 的语义数据映射，反之亦然。否则，在使用 RODBC、RJDBC 和 ROracle\
  \ 包直接访问数据库时，或在涉及 R 的分析模型创建过程中，这些映射是必需的。\n\n表 3-4 列出了主要的 Oracle R Enterprise 包。\n\
  \n表 3-4.\n\n主要的 ORE 包\n\n| 包 | 功能 |\n| --- | --- |\n| DBI | R 数据库接口的补充包 |\n| ORE\
  \ | Oracle R Enterprise |\n| OREbase | 与 R 基础包相关的功能 |\n| OREgraphics | 与 R 图形包相关的功能\
  \ |\n| OREstats | 与 R 统计包相关的功能 |\n| OREeda | 探索性数据分析包 |\n| OREdm | 数据挖掘包（Oracle\
  \ 数据挖掘） |\n| OREpredict | 使用 R 模型预测对 Oracle 数据库中的数据进行评分的包 |\n| ORExml | 在 R 内生成\
  \ XML 的功能 |\n| bitops | 位运算函数 |\n| png | 在 R 和 Oracle DB 之间读写 PNG 图像的补充包 |\n| OBIEEAdvancedAnalytics\
  \ | ORE 中支持的、用于与 OBIEE 集成的先进分析和机器学习 R 函数 |\n\nOBIEE 与 R 图形的集成还包括参数控件，可用于自定义图形，例如图形绘图和图表。\n\
  \n## 使用 ORE 与 OBIEE 进行机器学习和商业智能：端到端实践\n\n本节详细介绍了使用 ORE 进行机器学习算法的端到端实践，以及随后通过 OBIEE\
  \ 仪表板将其输出整合到商业智能中的过程。我们将首先展示一个使用 `randomForest()` 算法预测葡萄酒产地的 R 程序示例。接下来，我们将展示如何修改此程序，以使用\
  \ ORE R 接口在 Oracle DB 中展示嵌入式 R 执行。然后，我们将演示一个使用相同程序通过 SQL 接口展示嵌入式 R 执行的示例。此示例说明了如何从\
  \ ORE 获取输出，包括结构化表、XML 和图形（PNG）。最后，我们将详细介绍如何将 ORE 执行的输出集成到 OBIEE 仪表板中，用于预测分析。\n\n\
  ### 使用 ORD randomForest 算法预测葡萄酒产地\n\n这是通过随机森林 R 模型完成的，该模型是决策树模型的扩展。\n\n注意\n\n关于决策树和随机森林的详细解释，请参见\
  \ [`https://medium.com/towards-data-science/decision-trees-and-random-forests-df0c3123f991`](https://medium.com/towards-data-science/decision-trees-and-random-forests-df0c3123f991)\
  \ 和 [`https://medium.com/towards-data-science/decision-trees-and-random-forests-for-classification-and-regression-pt-1-dbb65a458df`](https://medium.com/towards-data-science/decision-trees-and-random-forests-for-classification-and-regression-pt-1-dbb65a458df)\
  \ 。决策树和随机森林的比较使用，请参见 [`http://whrc.org/wp-content/uploads/2016/02/DecisionTrees_RandomForest_v2.pdf`](http://whrc.org/wp-content/uploads/2016/02/DecisionTrees_RandomForest_v2.pdf)\
  \ 。\n\n清单 3-4 给出了示例代码。它构建了 R 模型，随后在测试数据上测试构建的模型，以根据 `Wine` 类别预测葡萄酒的产地。它输出一个预测结果表，以及一个显示预测葡萄酒产地输出与输出表对比的\
  \ PNG 图形。其源数据包括修改从 [`https://archive.ics.uci.edu/ml/machine-learning-databases/wine/wine.data`](https://archive.ics.uci.edu/ml/machine-learning-databases/wine/wine.data)\
  \ 获取的葡萄酒数据集。此外，还参考了 [`https://datascienceplus.com/predicting-wine-quality-using-random-forests/`](https://datascienceplus.com/predicting-wine-quality-using-random-forests/)\
  \ 上的文章作为示例。\n\n\n\n```\n> library(randomForest)\nrandomForest 4.6-12\n输入 rfNews()\
  \ 可查看新功能/变更/错误修复。\n警告信息：\n包 'randomForest' 是在 R 版本 3.2.5 下构建的\n> winedata  head(winedata)\n\
