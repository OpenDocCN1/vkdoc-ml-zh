  \ R 脚本存储库中的 R 函数。\n\n至此，完成了将从执行 ORE R 脚本获得的 PNG 图形输出与 OBIEE12c 分析和仪表盘的集成。此外，基于从\
  \ ORE R 函数生成的多个图像，可以将与同一分析相关的多个图形与 OBIEE 集成。同时，可以通过定义与 R 脚本对应的参数化 R 函数，并定义可在运行时交互选择的\
  \ OBIEE 变量和提示，来实现动态仪表盘。\n\n## 机器学习趋势分析与企业数据仓库的契合\n\nOBIEE 12c 提供了五种有助于机器学习的分析算法：聚类、异常值、回归、趋势线和评估脚本。此外，OBIEE\
  \ 12 还提供了时间序列预测算法。其中，与企业数据仓库（EDW）需求最匹配的主要是趋势线。本节重点介绍如何在 EDW 环境中使用趋势线进行机器学习趋势分析。\n\
  \n已有大量算法被编写出来，机器学习也已成功应用于众多应用。从农业和制造业等行业的任务自动化，我们已进入一个为知识工作者寻求任务自动化新应用的时代。\n\n决策支持系统（DSS），或者更具体地说，企业数据仓库（EDW），就是这样一个自动化领域。在这里，计算能力和处理海量数据的能力正通过由人工智能驱动的新应用接受考验。使用\
  \ EDW 的基本目标是能够从已集成和存储的数据中发现趋势。通常，只有在 EDW 中，组织才能拥有完全收集、集成并进一步清洗的数据，从而用于提供对企业的历史洞察并揭示趋势。\n\
  \n以发现趋势为目标，与趋势线和基本模式发现相关的机器学习应用算法恰好符合 EDW 的精确目的，因此，对于商业企业而言，这无疑是未来完美的人工智能驱动技术。\n\
  \n以下边栏提供了定义趋势线的 OBIEE 12c 文档。\n\n趋势线定义\n\n`TRENDLINE` 函数衡量随时间变化的数据，并显示按有序记录排列的指标折线图。\n\
  \n目前，`TRENDLINE` 函数可以将数据建模为线性回归和指数回归。\n\n```\nTRENDLINE( , ( [] ) BY ( [] ),\n,\
  \ , [number_of_degrees] )\n```\n\n其中：\n\n`numeric_expr` 表示要进行趋势分析的数据。这通常是一个度量列。请注意，这是\
  \ y 轴。\n\n`series` 表示 x 轴。这是一个 `<valueExp> <orderByDirection>` 列表，其中 `<valueExp>`\
  \ 是一个维度列，`<orderByDirection>` 是 `ASC` 或 `DES`。默认值为 `ASC`。请注意，这不能是数字列的任意组合。\n\n`partitionBy`\
  \ 表示趋势线的控制中断。\n\n`model_type` 表示要使用的模型类型。目前，您只能指定 `LINEAR`。\n\n`result_type` 表示输出的类型。您可以指定\
  \ `VALUE` 或 `MODEL`。`VALUE` 返回拟合中给定 X 的回归 Y 值。`MODEL` 以 JSON 格式字符串返回参数。\n\n`number_of_degrees`\
  \ 仅用于多项式模型。此参数是可选的。\n\n请考虑以下 `TRENDLINE` 示例。它定义了按订单类型划分的“每名称季度总收入”的趋势线，这意味着结果是针对每种订单类型特定的趋势线。\n\
  \n```\nTRENDLINE(\"Calculated Facts\".\"Full Quarter Revenue\", (\"Time\".\"Per\
  \ Name Qtr\") BY (\"Orders\".\"Order Type\"), 'LINEAR', 'VALUE')\n```\n\n图 3-32\
  \ 到 3-35 展示了使用上述函数为 `TRENDLINE` 创建的分析以及获得的输出。图 3-36 显示了相应的仪表盘视图。\n\n以下是所需的步骤：\n\n\
  \n\n1.  登录 OBIEE 演示服务，在 SampleSales 主题区域下选择“分析”。\n2.  选择“订单”，然后选择“订单类型”。将其拖放到右侧的空白区域。\n\
