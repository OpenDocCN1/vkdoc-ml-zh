  \n图 6-1.\n\n已执行 GLM 模型的 AUC 图\n\n让我们看看`train_set and test_set`中产地与购买倾向的矩阵（或表格）：\n\
  \n```\n> table(train_set$Source, train_set$propensity_to_buy)\n0   1\nOrigin1  \
  \ 0  99\nOrigin2 122   0\nOrigin3   0  89\n> table(test_set$Source, test_set$p_to_buyPred)\n\
  0  1\nOrigin1  0 34\nOrigin2 40  0\nOrigin3  0 29\n>\n```\n\n这些表格输出表明，两个表格中都有一些单元格的值为\
  \ 0。这可能导致`glm`模型的摘要中不显示显著性代码，如下所示。\n\n`type='response'` 简单地对预测的对数几率分数应用逻辑变换，因此预测值处于概率尺度上。\n\
  \n系数是模型的估计值，其值处于对数几率尺度上。\n\n\n\n### Logit 模型概要\n\n上述 `summary(logitM)` 命令的输出如下：\n\
  \n```\n> summary(logitM)\nCall:\nglm(formula = propensity_to_buy ∼ Source, family\
  \ = \"binomial\",\ndata = train_set, control = glm.control(maxit = 100))\nDeviance\
  \ Residuals:\nMin          1Q      Median          3Q         Max\n-8.861e-07  -8.861e-07\
  \   8.861e-07   8.861e-07   8.861e-07\nCoefficients:\nEstimate Std. Error z value\
  \ Pr(>|z|)\n(Intercept)    2.857e+01  9.493e+04       0        1\nSourceOrigin2\
  \ -5.713e+01  1.292e+05       0        1\nSourceOrigin3 -1.927e-05  1.420e+05  \
  \     0        1\n(Dispersion parameter for binomial family taken to be 1)\nNull\
  \ deviance: 4.1559e+02  on 309  degrees of freedom\nResidual deviance: 2.4340e-10\
  \  on 307  degrees of freedom\nAIC: 6\nNumber of Fisher Scoring iterations: 27\n\
  ```\n\n该概要提供了模型及其收敛性的信息。\n\n对 GLM 模型输出的分析可按如下方式进行：\n\n*   `summary(logitM)`\n  \
  \  *   模型信息与模型收敛状态\n        *   调用 (Call)\n        *   离散参数 (Dispersion parameter)\n\
  \        *   Fisher 评分迭代次数 (Number of Fisher scoring iterations)\n    *   系数表 (Table\
  \ of coefficients)\n        *   系数 (Coefficients)\n        *   显著性标记 (Significant\
  \ codes)\n    *   单个参数检验 (Testing individual parameters)\n        *   Wald 卡方统计量\
  \ (Wald chi-squared statistics)\n    *   单个参数的置信区间 (Confidence intervals of individual\
  \ parameters)\n        *   整体拟合优度 (Overall goodness-of-fit)\n            *   零偏差\
  \ (Null deviance)\n            *   残差偏差 (Residual deviance)\n            *   赤池信息准则\
  \ (AIC)\n*   `anova(logitM)`\n    *   偏差分析表 (Analysis of deviance table)\n\n在这些指标中，AIC、零偏差和残差偏差，连同混淆矩阵和\
  \ ROC 曲线，共同反映了 `glm` 模型的性能。具体说明如下：\n\nAIC，如前所述，代表赤池信息准则，它衡量模型拟合度，并对模型中涉及的系数数量进行惩罚。建议选择\
  \ AIC 值较低的模型。在我们的示例用例中，`summary(logitM)` 输出显示 AIC 为 6，表明该模型拟合良好。\n\n零偏差表示仅包含截距的模型所预测的响应。该值越低，模型越好。\n\
  \n残差偏差表示使用自变量后的模型所预测的响应。该值越低，模型越好。\n\n混淆矩阵定义了一个实际值与预测值的对照表。这对于确定模型的准确性非常有用，并有助于避免过拟合。实际值和预测值被分为“好”和“坏”，单元格值由真正例、真负例、假正例和假负例表示。其形式如表\
  \ 6-1 所示。\n\n表 6-1.\n\n逻辑回归的样本混淆矩阵\n\n|   |   | 预测值 |   |\n| --- | --- | --- | ---\
  \ |\n|   |   | 好 | 坏 |\n| 实际值 | 好 | 真正例 (d) | 假负例 (c) |\n|   | 坏 | 假正例 (b) | 真负例\
  \ (a) |\n\n(来源：[`www.analyticsvidhya.com`](http://www.analyticsvidhya.com) )\n\n\
  关于 ROC 曲线的详细信息将在后续小节中介绍。\n\n粗体行提供了关于用作训练数据集的数据集（即 `train_set`）、响应变量和预测变量的标签（分别为\
  \ `propensity_to_buy` 和 `Source`）以及用于拟合的逻辑回归算法类型（`glm`，即 `binary(logit)` 族的广义线性模型）的信息。它还提供了用于参数估计的评分模型类型。\n\
  \n此处，模型使用 Fisher 评分算法进行最大似然估计。`glm` 模型的 `maxit` 参数给出了拟合模型的迭代次数，这使我们能够确定最大似然估计值。\n\
  \n注意\n\nFisher 评分是一种用于获取结果的逐步上升算法；它通过逐步接近最大值（顶部）来最大化似然，每步也称为一次迭代。该算法能够识别是否已达到顶部，并且后续步骤不会增加似然值。它被认为是一种高效的算法——通常不需要很多次迭代——并且通常能收敛到一个答案。如果\
  \ Fisher 评分迭代次数很大，则意味着 `glm` 模型在收敛性方面并非最优。如果样本数据集较小或预测变量之间的相关性不是共线性的，则可能发生这种情况。这是一种数值分析算法，是\
  \ Newton-Raphson 方法的替代方案。\n\n在 `glm` 模型中，二项式链接使用 logit 链接。这表明我们正在拟合一个 logit 模型，并且响应变量是\
  \ log 几率，数学表示如下：\n\n```\nlogit(p) = l0g(p/(1-p))\n```\n\n`logit(p)` 在闭区间 `[0,1]`\
  \ 内取值，并在 y 轴上输出实数值。逆 logit 函数接收 x 轴上的数据点，并在 y 轴上输出闭区间 `[0,1]` 内的值。当所涉及的数据是离散的时，如果观测响应与其预测值之间存在差异，并且这些值大于\
  \ `binomial(link=logit)` 模型所预测的值，则可能发生过度离散。\n\n注意\n\n您可以参考 `glm` 算法背后的数学原理，详见 [`https://onlinecourses.science.psu.edu/stat504/node/225`](https://onlinecourses.science.psu.edu/stat504/node/225)\
  \ 。其他网站也解释了逻辑回归模型背后的概念，例如 [`https://datascienceplus.com/perform-logistic-regression-in-r/`](https://datascienceplus.com/perform-logistic-regression-in-r/)\
  \ `和` [`www.r-bloggers.com/how-to-perform-a-logistic-regression-in-r/`](http://www.r-bloggers.com/how-to-perform-a-logistic-regression-in-r/)\
  \ `等`。\n\n以下是 `glm` 模型概要输出的详细解析：\n\n```\n=>模型信息与模型收敛状态\n->调用 (Call):\n```\n\n调用下方的两行提供了关于用作训练数据集的数据集（即\
  \ `train_set`）、响应变量和预测变量的标签（分别为 `propensity_to_buy` 和 `Source`）以及用于拟合的逻辑回归算法类型（`glm`，即\
  \ `binary(logit)` 族的广义线性模型）的信息。`glm` 模型的 `maxit` 参数给出了拟合模型的迭代次数，这使我们能够确定最大似然估计值。\n\
  \n```\n->偏差残差 (Deviance residuals)\n```\n\n偏差残差输出是对 `glm` 模型中每个数据点相关计算偏差分布的描述。它以非参数形式输出。偏差残差是\
  \ `glm` 模型输出的标准残差。\n\n```\n->二项式族的离散参数假定为 1。\n```\n\n离散参数默认由 GLM 打印输出，但在计数模型中更有价值。这仅表示二项式族的离散参数被假定为\
  \ 1。\n\n```\n-> Fisher 评分迭代次数\n```\n\n它给出了用于参数估计的评分模型类型，即模型是如何估计的。线性模型通常使用可解的方程进行估计，并以封闭形式输出，但\
  \ GLM 使用迭代方法进行估计。默认使用 Newton-Raphson 方法。此处，模型使用 Fisher 评分算法进行最大似然估计。\n\n注意\n\n\n\
  \n在数值分析中，牛顿法（也称为牛顿-拉夫逊法，以艾萨克·牛顿和约瑟夫·拉夫逊命名）是一种用于寻找实值函数根（或零点）的逐次逼近方法。它是求根算法的一个例子，也是之前描述的费舍尔评分法的一种替代方案。关于此方法的进一步讨论，可参见[`www.math.ubc.ca/∼anstee/math104/104newtonmethod.pdf`](http://www.math.ubc.ca/%E2%88%BCanstee/math104/104newtonmethod.pdf)。\n\
  \n```\n=> 系数表\n```\n\n系数和显著性代码提供了关于协变量的详细信息。\n\n```\n-> 系数\n系数：\n              估计值\
  \     标准误差    z 值    Pr(>|z|)\n(截距)        2.857e+01  9.493e+04       0        1\n\
  来源 Origin2 -5.713e+01  1.292e+05       0        1\n来源 Origin3 -1.927e-05  1.420e+05\
  \       0        1\n零偏差：4.1559e+02  自由度：309\n残差偏差：2.4340e-10  自由度：307\nAIC：6\n```\n\
  \n我们的模型有一个预测变量 `Source` 和一个截距（称为常数）。以下概述了如何分析输出结果：\n\n在第二行的 `Estimate` 列中，该值给出了左侧所列变量对应的系数。它表示如果\
  \ `Source` 增加一个单位（`Source` 取值为 `Origin2`），`propensity_to_buy` 的对数几率估计会增加的量。类似地，第三行中\
  \ `Source` 取值为 `Origin3` 的情况也是如此。\n\n当 `Source` 为 00 时，`propensity_to_buy` 的对数几率由第一行（第二行上方）给出。对数几率是对\
  \ `glm` 模型中简单预测值到优势比的一种解释。\n\n下一列 `Std. Error` 给出了与这些估计值相关的标准误差（如第二行所述）。它估计了如果使用新数据反复重新运行相同模型，这些估计值平均会分散多少。将估计值除以标准误差，得到的商在样本量足够大时被认为服从正态分布。该值列在\
  \ `z value` 列中。最后一列 `Pr(>|z|)` 列出了在标准正态分布中与这些 z 值相对应的双尾 p 值。\n\n```\n-> 显著性代码\n\
  ```\n\n额外的显著性代码信息以星号形式出现在最后一列的右侧。这些信息遵循系数表正下方显示的键值。在我们的案例中，我们没有看到这些星号，因为 `table(train_set$Source`,\
  \ `train_set$propensity_to_buy` 和 `table(test_set$Source`, `test_set$p_to_buyPred)`\
  \ 表中的值均为零。\n\n```\n=> 检验单个参数\n-> 瓦尔德卡方统计量\n> library(aod)\n警告信息：\n程序包 'aod' 是在 R\
  \ 版本 3.2.5 下构建的\n> wald.test(b = coef(logitM), Sigma = vcov(logitM), Terms =  1:2)\n\
  瓦尔德检验：\n\n卡方检验：\nX2 = 2e-07, df = 2, P(> X2) = 1.0\n> wald.test(b = coef(logitM),\
  \ Sigma = vcov(logitM), Terms =  1:3)\n瓦尔德检验：\n\n卡方检验：\nX2 = 2.7e-07, df = 3, P(>\
  \ X2) = 1.0\n> wald.test(b = coef(logitM), Sigma = vcov(logitM), Terms =  2:3)\n\
  瓦尔德检验：\n\n卡方检验：\nX2 = 2.6e-07, df = 2, P(> X2) = 1.0\n=> 单个参数的置信区间\n-> 整体拟合优度\n\
  ```\n\n整体拟合优度由三个指标决定：零偏差、残差偏差和 AIC。\n\n零偏差衡量的是仅包含截距的模型（无预测变量的简化模型）所预测的响应。这属于简化模型的情况。\n\
  \n残差偏差衡量的是包含预测变量的模型所预测的响应。换句话说，这两个指标反映了 `glm` 模型的拟合不足程度；值越低，模型越好。因此，它是拟合优度的一个度量。\n\
  \n与这两个偏差相关的自由度之差仅为 2。在我们的案例中，我们有一个预测变量 `Source`；但为其值 Origin2 和 Origin3 估计了两个值，因此使用了两个额外的自由度。\n\
  \n```\n-> AIC\n```\n\nAIC 是另一个衡量拟合优度的指标，用于评估模型对数据的拟合程度。换句话说，它根据模型需要估计的系数数量来反映模型的“成本”。推荐选择\
  \ AIC 值较低的模型。在我们的案例中，该值为 6，可以视为一个拟合良好的模型。\n\n### AUC 曲线\n\n这涉及 GLM 模型的 ROC 曲线。它通过评估真阳性率（也称为灵敏度）和假阴性率（也推导为\
  \ 1-特异度）来提供模型的性能特征。考虑 p > 0.5 的情况，ROC 图通过预测所有可能的 p > 0.5 的值，给出了成功率的最佳拟合场景。曲线下面积（也称为\
  \ AUC）是 ROC 曲线的性能指标。AUC 提供了准确度指数或一致性指数。\n\n注意\n\nAUC 越高，模型的预测能力越好。\n\n图 6-1 描绘了我们用于预测购买倾向的逻辑回归模型的\
  \ AUC 曲线。根据我们的 `Source` 数据值以及相应的购买倾向，我们看到 AUC 是一条完美的、翻转的 L 形直角曲线，从 x 轴上的 0 开始，延伸到\
  \ y 轴上的 1，然后以直角方式向右弯曲，最终在 x = 1 处结束。\n\n这是因为我们起始的数据中，`Origin1` 和 `Origin3` 的值为 1，`Origin2`\
  \ 的值为 0，而 `propensity_to_buy` 列中的对应值分别为 1 和 0。并且对于相应的 `Source` 值，预测概率也是 1 和 0。\n\
  \n```\n=> anova(logitM)\n-> 偏差分析表\n```\n\nR 中的 `anova` 函数使我们能够通过分析 `pf` 偏差表来检验因子的效应。在我们的逻辑回归模型中，有一个解释变量及其对应的因子\
  \ `Source`。`glm` 模型拟合了仅含截距的模型，输出了与针对零偏差（系数下方）相同的统计量：偏差 = 415.59。这由以下 `anova` 输出显示：\n\
  \n```\n偏差分析表\n模型：二项分布，链接函数：logit\n响应变量：propensity_to_buy\n项按顺序添加（从前到后）\n    自由度\
  \ 偏差 残差自由度 残差偏差\nNULL                     309     415.59\nSource  2   415.59   \
  \    307       0.00\n```\n\n\n\n### 使用 ORE SQL 接口实现解决方案\n\n现在我们有了初步的解决方案，接下来通过 ORE\
  \ SQL 接口将其实现，以便与 OBIEE 12c 集成。实现步骤如下：\n\n1.  使用 `sys.rqScriptCreate` 在 R 脚本仓库中创建一个\
  \ R 函数作为脚本，该函数在 Oracle 数据库中创建一个输入表，用于存储葡萄酒源数据，并根据 `Source` 列添加一个 `propensity_to_buy`\
  \ 列。代码如清单 6-3 所示。\n\n```\n    begin\n    sys.rqScriptDrop('CreateInputTable');\n\
  \    sys.rqScriptCreate('CreateInputTable',\n    'function(dat) {\n    library(ORE)\n\
  \    ore.connect(\"testr\",\"orcl\",\"localhost\",\"testr\")\n    setwd(\"F:/testr\"\
  )\n    dat <- read.csv(\"Wineptobuy.csv\")\n    ore.drop(table=\"WINE_SOURCE_DATA\"\
  )\n    ore.create(dat, table=\"WINE_SOURCE_DATA\")\n    }');\n    end;\n    /\n\
  \    清单 6-3.\n    基于输入的 .csv 文件创建 Oracle 表的 R 脚本\n    ```\n\n2.  执行上述代码，在 `testr`\
  \ 模式下创建 `WINE_SOURCE_DATA` 表。这通过以下 `select` 语句完成：\n\n```\n    select * from table\
  \ (rqEval(NULL, 'XML', 'CreateInputTable'));\n    ```\n\n执行此 `select` 语句的输出如下：\n\
  \n```\n    ----------------------------------------------------------------------------\n\
  \    SQL> select * from table (rqEval(NULL, 'XML', 'CreateInputTable'));\n    NAME\n\
  \    ----------------------------------------------------------------------------\n\
  \    VALUE\n    ----------------------------------------------------------------------------\n\
  \nSQL>\n    ```\n\n3.  创建一个 R 函数，用于构建逻辑回归模型，以根据葡萄酒源预测购买倾向，然后在测试数据上对模型进行评分。此处使用 GLM\
  \ 的机器学习算法。此函数与一个 R 脚本关联，该脚本将保存在 ORE 的 R 脚本仓库中。清单 6-4 展示了代码。\n\n```\n    begin\n\
  \    sys.rqscriptDrop('BuildandScoreptobuy');\n    sys.rqScriptcreate('BuildandScoreptobuy',\n\
  \    'function(table_name) {\n    ore.sync(table=table_name)\n    ore.attach()\n\
  \    winedata  0.5,1,0)\n    misClasificError <- mean(p_to_buyPred != test_set$propensity_to_buy)\n\
  \    p_to_buyPred[as.integer(rownames(p_to_buyPred))] <- p_to_buyPred\n    res <-\
  \ cbind(data.frame(test_set[,c(1:19)]), PRED = p_to_buyPred)\n    res1.df <- data.frame(res[,c(1,2,19,20)])\n\
  \    library(ggplot2)\n    gg_plot <- ggplot(data=test_set, aes(x=Source, y=p_to_buyPred,\
  \ group=1)) +\n    geom_line(aes(colour = p_to_buyPred), size = 1) + geom_point()\
  \ +\n    stat_smooth(method=\"glm\", family=\"binomial\", se=FALSE) +\n    ggtitle(\"\
  根据葡萄酒源预测购买倾向\") +\n    labs(x=\"源\", y=\"预测概率 - p_to_buyPred\")\n    plot(gg_plot)\n\
  \    res1.df\n    }');\n    end;\n    /\n    清单 6-4.\n    基于 GLM 的逻辑回归模型，用于根据葡萄酒源构建和评分购买倾向\n\
  \    ```\n\n4.  创建一个 R 函数，调用上述 `BuildandScoreptobuy` 函数，使其在由 Oracle 12c 数据库清单生成的\
  \ ORE 引擎中执行，以输出根据葡萄酒源预测的购买倾向概率。清单 6-5 展示了代码。\n\n```\n    begin\n    sys.rqScriptDrop('CallPtoBuy');\n\
  \    sys.rqScriptCreate('CallPtoBuy',\n    'function(dat, input_table_name) {\n\
  \    input_table_name <- \"WINE_SOURCE_DATA\"\n    ore.scriptLoad(name = \"BuildandScoreptobuy\"\
  )\n    res1 <- BuildandScoreptobuy(input_table_name)\n    res1.df <- data.frame(res1)\n\
  \    res1.df\n    }');\n    end;\n    /\n    清单 6-5.\n    调用 BuildandScoreptobuy\
  \ 函数以输出基于源预测购买倾向概率的 R 函数\n    ```\n\n清单 6-5 中的代码可以通过 ORE SQL 接口以多种方式执行，以输出 XML、单个列或\
  \ PNG 图像图形。以下 `SELECT` 语句展示了如何实现：\n    1.  输出 XML：用于获取集成图形 XML 输出的初始 SQL `SELECT`\
  \ 如下：\n\n```\n        select * from table(rqTableEval(cursor(select * from WINE_SOURCE_DATA),\n\
  \        cursor(select 1 as \"ore.connect\", 'WINE_SOURCE_DATA' as \"input_table_name\"\
  \ from dual),\n        'XML',\n        'CallPtoBuy'));\n        ```\n\n输出可以改进，以便在\
  \ Internet Explorer 或其他 XML 显示软件中打开时显示为 XML。以下查询可实现此目的：\n\n```\n        select xmltype(a.value).getClobVal()\
  \ as \"包含图像的 XML 输出\"\n        from table(rqTableEval(cursor(select * from WINE_SOURCE_DATA),\n\
  \        cursor(select 1 as \"ore.connect\", 'WINE_SOURCE_DATA' as \"input_table_name\"\
  \ from dual),\n        'XML',\n        'CallPtoBuy')) a;\n        ```\n\n![A439668_1_En_6_Figa_HTML.jpg](img/A439668_1_En_6_Figa_HTML.jpg)\
