  随着我们迎来人工智能和机器学习，商业智能进入了一个激动人心的新时代。想象一下。如果这项新技术真的能帮助我们增强思维，并提供通常人类无法实现的能力，那会怎样？我们是否应该冒险押注这项新技术？它真的能帮助我们在数据方面获得竞争优势吗？它能做出正确的推荐吗？我们准备好了吗？


  几十年来，我们一直在开发和实施以数据为中心的解决方案。我想说“我们什么都见过了”，但业界从未停止让我惊叹，因为新的进步不断涌现，令人兴奋的新技术不断开辟新天地——比如人工智能和机器学习。这项技术有望改变游戏规则，我迫不及待想要掌握它。但是等等！我该如何成功地将它融入我繁忙的日程？我该如何成功实施它？我们总有同样的老借口。


  随着技术的每一次进步，我们在采用它之前似乎总是要经历一个仪式。首先是怀疑和否认。我们问：“这可能是真的吗？”或者“这是我们一直等待的圣杯吗？”这引发了无休止的讨论和辩论。界限被划出，分歧产生，人们相互对立。有时，一个勇敢的灵魂会站出来，经历反复试验的过程，经验（通过一些成功）缓解了怀疑和反对的痛苦。当尘埃落定，自信的参与者最终开始尝试将新技术纳入他们的计划。这些仪式与每个技术专家和开发人员都争相成为新软件测试者的日子相去甚远。


  所以，情况就变成了这样——无论新技术看起来多么迷人。“一朝被蛇咬，十年怕井绳，”他们在我们努力掌握新技术时这样说。所以我们一直等到看到经过验证的成功，并且能够成功复制它。然后它成为一种经过实践检验的可靠方法，从业者可以在他们的项目中信任和使用。最后，知道别人已经铺平了道路，信心就会占据上风。


  规避这种经验的一种方法是让一位导师一步步带你完成实施过程，并向你展示如何操作。作为顾问，我们当然提供这种服务，并且我们很乐意始终与您并肩作战，随时准备行动。但由于这可能不可行，我们为您提供了次优选择：我们的书作为指南。在这里，我们记录了我们经过验证的成功经验，并展示了我们的代码。


  鉴于这个主题如此新颖，我们撰写本书的目的是提供一个战略和战术视角，将机器学习纳入您的 Oracle 商业智能安装中。对于从业者和实施者，我们希望本书能让您直接找到所需的部分，以便快速启动和运行您的系统。


  如果您对商业智能和机器学习不熟悉，您可能希望通读全书（但可以略过实际代码），以了解这项新技术如何在您的特定环境中提供最佳优势。这样做将为您提供良好的概述和基础知识，帮助您入门商业智能和机器学习。因此，如果您是负责分析的项目经理或总监，我们建议您采用这种方法。然后，您或许可以将其传递给您的开发团队，让他们整合
  R 代码，以充分利用本书。出于我们描述的目的，我们有意识地编写了一些纯粹围绕代码的章节，而其他章节则有助于围绕该主题展开讨论。


  此外，如果整体来看，每一章都建立在前一章的基础上。本书首先介绍人工智能和机器学习的一般概念。然后介绍 Oracle 商业智能。最后，逐步深入到一些编码和编程，并以一个实际用例来应用代码作为结尾。本书的这种渐进式结构是有意为之，模仿了软件开发生命周期的方法，我们从规划和分析一直走到实施。


