  \n按照第 3 章“将 PNG 图形与 OBIEE 集成”小节中概述的步骤，可以将图 6-7 所示的 PNG 图像与 OBIEE 集成。图像集成后，即可在 OBIEE\
  \ 中创建分析及后续的仪表盘。此处列出了所涉及的主要步骤；其中部分步骤已在第 3 章中提供：\n\n1.  在物理层创建一个类型为 `SELECT` 的新物理表（使用从\
  \ WebLogic 服务器下载的 OBIEE RPD，并在 BI 管理工具中离线打开）。我们已拥有第 3 章中创建的连接池。用于生成逻辑回归机器学习算法 PNG\
