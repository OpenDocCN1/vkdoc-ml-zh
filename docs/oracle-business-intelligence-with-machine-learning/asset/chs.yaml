  \ pairs(table(origin_pred, test_data$origin), main=\"葡萄酒产地预测器\")\n>\n清单 3-4.\n使用\
  \ R 的 randomForest 模型预测葡萄酒产地（R 代码及其输出）\n```\n\n图 3-2 展示了清单 3-4 生成的图形。\n\n![A439668_1_En_3_Fig2_HTML.jpg](img/A439668_1_En_3_Fig2_HTML.jpg)\n\
  \n图 3-2.\n\n葡萄酒产地预测器表格数据的散点图矩阵的 PNG 图形输出\n\n### 在 Oracle DB 中使用嵌入式 R 执行及 ORE R 接口预测葡萄酒产地\n\
  \n在本节中，我们将修改清单 3-4，使用 ORE 嵌入式 R 执行函数作为 R 接口。它使用 `ore.doEval()` 函数实现相同的功能。修改后的代码见清单\
  \ 3-5，对应的 PNG 图形如图 3-3 所示。如您所见，使用 `ore.doEval()` 和原始 R 程序的输出是相同的。区别在于 `ore.doEval()`\
  \ ORE 函数在数据库内部执行，并将结果传递到用户控制台上的 R 终端。\n\n```\nlibrary(ORE)\nore.connect(user=\"\
  testr\", sid=\"orcl\", host=\"localhost\", password=\"testr\")\nore.doEval(function\
  \ () {\nlibrary(randomForest)\n# 文件 winedata.csv 位于调用 ORE 接口时的工作目录中\nwinedata <-\
  \ read.csv(\"winedata.csv\", header=TRUE, sep=',')\nhead(winedata)\nwinedata$origin\
  \ <- ifelse(winedata$class == 1, 'Origin1',\nifelse(winedata$class == 2, 'Origin2',\n\
  ifelse(winedata$class == 3, 'Origin3', '')))\nwinedata$origin <- as.factor(winedata$origin)\n\
  head(winedata$origin)\nset.seed(123)\nsample_size <- 0.70 * nrow(winedata)\nsampledata\
  \ <-sample(seq_len(nrow(winedata)), sample_size)\ntraining_data <- winedata[sampledata,\
  \ ]\ntest_data <- winedata[-sampledata, ]\nwine.rf <- randomForest(origin ∼ . -\
  \ class, data = training_data)\norigin_pred <- predict(wine.rf, newdata = test_data)\n\
  table(origin_pred, test_data$origin)\nlibrary(AppliedPredictiveModeling)\ntransparentTheme(trans\
  \ = .4)\npairs(table(origin_pred, test_data$origin), main=\"葡萄酒产地预测器\")\n}, ore.graphics=TRUE,\
  \ ore.png.height=600, ore.png.width=500)\n清单 3-5.\n使用 ORE 构建并测试 randomForest() 模型\n\
  ```\n\n以下是需要遵循的步骤：\n\n1.  使用 ORE 打开一个 R 终端。  \n2.  连接到数据库。即使未使用任何与数据库相关的函数，此步骤也是使用\
  \ ORE 所必需的。  \n3.  加载 ORE 库。  \n4.  编写一个 `ore.doEVal` 函数，该函数执行以下操作：\n    1.  加载\
  \ randomForest 库。  \n    2.  从源 CSV 文件中检索葡萄酒数据集，并将其存入名为 `winedata` 的数据框。  \n   \
  \ 3.  显示前几行，以验证数据框包含已加载的数据。  \n    4.  基于 `winedata` 数据集中的第一列 class，创建一个葡萄酒产地分类器变量\
