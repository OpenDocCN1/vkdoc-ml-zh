  16  sampledata <-sample(seq_len(nrow(winedata)), sample_size)\n17  training_data\
  \ <- winedata[sampledata, ]\n18  test_data <- winedata[-sampledata, ]\n19  wine.rf\
  \ <- randomForest(origin ∼ . - class, data = training_data)\n20  origin_pred <-\
  \ predict(wine.rf, newdata = test_data)\n21  res <- table(origin_pred, test_data$origin)\n\
  22  res.df <- as.matrix(res)\n23  head(res.df)\n24  png(\"rTestRF.png\")\n25  pairs(table(origin_pred,\
