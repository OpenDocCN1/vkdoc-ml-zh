  \n图 3-11.\n\n清单 3-13 中修改后的 VALUE 列的 XML 输出\n\n\n\n### 使用 ORE SQL 接口生成 PNG 图并集成到\
  \ OBIEE 仪表盘\n\n在本节中，我们将演示如何通过 ORE SQL 接口，利用 `randomForest` R 算法为葡萄酒产地预测问题获取 PNG\
  \ 图。如之前的示例所述，我们首先创建两个存储在 Oracle DB R 脚本存储库中的脚本。这两个脚本分别命名为 `BuildandScoreRF` 和 `validateRF`。第一个脚本\
  \ `BuildandScoreRF` 关联一个 R 函数，该函数将输入数据作为参数，并基于随机抽样将其划分为两个数据集——70% 作为训练数据集，30% 作为测试数据集。它基于训练数据集构建一个随机森林模型，然后使用\
  \ `predict` R 函数基于测试数据集对模型进行评分。\n\n`validaterF` 脚本根据葡萄酒数据的 CSV 文件，基于 `Wine` 类别和其他相关属性，准备\
  \ `BuildandScoreRF` 脚本所需的输入数据。它将此输入数据存储在一个名为 `WINE_DATA` 的数据库表中，然后调用第一个脚本，并将准备好的数据作为输入传递给其对应的\
  \ R 函数。\n\n清单 3-14 和 3-15 展示了这两个 R 脚本的代码。\n\n要执行清单 3-14 到 3-16 中的代码以及任何 `SELECT`\
  \ 语句，请打开 SQL*Plus 或 Oracle SQL Developer。登录后，复制并粘贴代码。对于 SQL*Plus，按 Enter 键；对于 Oracle\
  \ SQL Developer，单击“运行脚本”图标。\n\n```\nbegin\nsys.rqscriptDrop('BuildandScoreRF');\n\
  sys.rqScriptcreate('BuildandScoreRF',\n'function(winedata) {\nlibrary(randomForest)\n\
  winedata$origin <- ifelse(winedata$class == 1, ''Origin1'',\nifelse(winedata$class\
  \ == 2, ''Origin2'',\nifelse(winedata$class == 3, ''Origin3'', '''')))\nwinedata$origin\
  \ <- as.factor(winedata$origin)\nset.seed(123)\nsample_size <- 0.70 * nrow(winedata)\n\
  sampledata <-sample(seq_len(nrow(winedata)), sample_size)\ntraining_data <- winedata[sampledata,\
  \ ]\ntest_data <- winedata[-sampledata, ]\nwine.rf <- randomForest(origin ∼ . -\
  \ class, data = training_data)\norigin_pred <- predict(wine.rf, newdata = test_data)\n\
  res <- table(origin_pred, test_data$origin)\npairs(table(origin_pred, test_data$origin),\
  \ main=\"Wine Origin Predictors\")\nres\n}');\nend;\n/\n清单 3-14.\n使用 SQL 接口的 BuildandScoreRF\
  \ 脚本，该脚本使用 randomForest R 函数构建并评分葡萄酒类别数据\n```\n\n```\nbegin\nsys.rqScriptDrop('validateRF');\n\
  sys.rqScriptCreate('validateRF',\n'function() {\nlibrary(ORE)\nore.connect(\"testr\"\
  ,\"orcl\",\"localhost\",\"testr\")\nsetwd(\"F:/testr/\")\ninputdata <- read.csv(\"\
  winedata.csv\", header=TRUE, sep='','')\nore.drop(table=\"WINE_DATA\")\nore.create(inputdata,\
  \ table=\"WINE_DATA\")\nore.scriptLoad(name = \"BuildandScoreRF\")\nres1 <- BuildandScoreRF(inputdata)\n\
  res1.df <- data.frame(res1)\nres1.df\n}');\nend;\n/\n清单 3-15.\n使用 SQL 接口的 validateRF\
  \ 脚本，该脚本准备输入数据并调用基于 BuildandScoreRF 脚本的 R 函数\n```\n\n为了验证 `validateRF` 的输出是否准确，我们首先通过执行以下查询来查询其\
  \ SQL 表格输出：\n\n```\nSQL> select *\n2  from table(rqEval(\n3      NULL,\n4      \
  \ 'select CAST(''a'' as VARCHAR2(50)) \"origin_pred\", CAST(''b'' AS VARCHAR2(50))\
  \ \"Var2\", 1 as \"Freq\" from dual',\n5      'validateRF'));\norigin_pred\n\nVar2\
  \                                                     Freq\n--------------------------------------------------\
  \ ----------\nOrigin1\nOrigin1                                                 \
  \  140\nOrigin2\nOrigin1                                                     0\n\
  Origin3\nOrigin1                                                     0\nOrigin1\n\
  Origin2                                                     0\nOrigin2\nOrigin2\
  \                                                   162\nOrigin3\nOrigin2      \
  \                                               0\nOrigin1\nOrigin3            \
  \                                         0\nOrigin2\nOrigin3                  \
  \                                   0\nOrigin3\nOrigin3                        \
  \                           111\n已选择 9 行。\n```\n\n该输出与从清单 3-11 获得的输出类似。接下来，我们执行清单\
