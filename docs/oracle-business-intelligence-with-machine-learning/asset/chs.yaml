  ### Oracle 的 R 技术\n\nOracle 的 R 技术包含以下组件：\n\n*   Oracle R 发行版\n*   ROracle\n*  \
  \ Oracle R Enterprise (ORE)\n*   Oracle R Advanced Analytics for Hadoop\n\n以下各小节将对每个组件进行说明。\n\
  \n#### Oracle R 发行版\n\nOracle R 发行版是开源 R 的免费 R 软件再发行版。它包含动态加载数学库以进行高性能计算和学习的功能，包括多线程执行。主要的数学库包括\
  \ Intel 数学核心函数库、AMD 核心数学库和 Solaris Sun 性能库。矩阵函数、成分分析、快速傅里叶级数变换和向量分析等数学函数可以使用这些库透明地完成。Oracle\
  \ R 发行版还对开源 R 进行了增强，并可在 Oracle Enterprise Linux、Solaris、AIX 和 Windows 上使用。Oracle\
  \ 高级分析选项和大数据设备以及 Oracle R Enterprise 的客户均可享受 Oracle 支持。使用 Oracle R 发行版还可以在客户端和数据库之间实现嵌入式\
  \ R 执行的扩展性。在撰写本文时，Oracle R 发行版的最新版本是 3.3.0。\n\n#### ROracle\n\nROracle 是一个符合数据库接口规范的\
  \ Oracle 驱动程序，用于 R，它使用 Oracle 调用接口 (OCI) 库。ROracle 经过重新设计和优化，用于 R 与 Oracle DB 之间的连接，是由\
  \ Oracle 管理的开源 R CRAN 包。它主要支持从 R 接口执行 SQL 语句，并为数据操作语言 (DML) 操作提供事务支持。Oracle R Enterprise\
  \ 也使用 ROracle 来连接 R 和 Oracle DB。与 RODBC 和 RJDBC 相比，ROracle 在从 Oracle 表读取到 R data.frame\
  \ 以及从 R data.frame 写入到 Oracle 表时，连接速度更快。ROracle 还可跨所有数据类型（主要是 Oracle `NUMBER`、`VARCHAR2`、`TIMESTAMP`\
  \ 和 `RAW` 数据类型）以及大型结果集进行扩展。在撰写本文时，ROracle 3-1.11 是 ROracle 的最新版本。\n\n注意\n\nROracle\
  \ 可用于从 Oracle R 发行版连接到 Oracle DB。要使用 ROracle，必须安装 Oracle Instant Client 或 Oracle\
  \ 标准数据库客户端。使用 ROracle 连接时，SQL*Plus SQL 接口也可以与 Oracle Instant Client 一起使用。使用 Oracle\
