  link\"` 给出链接尺度上的估计值。其余行将预测值和置信区间都反变换为概率。`cbind` 将数据框 `test_set2` 与由 `predict` 函数评分的预测结果列按列绑定，该函数作为第二个参数传递给\
  \ `cbind`。对于逻辑回归模型，置信区间基于剖析的`对数似然`函数。`lower` 和 `upper` 分别表示置信下限和置信上限。\n\n\n\n```\n\
