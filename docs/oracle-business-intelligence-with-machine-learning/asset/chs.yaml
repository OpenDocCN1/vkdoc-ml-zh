  \ Oracle DB 和 Oracle R 之间建立连接。完成后，可以执行标准的 DDL、DML 和/或提交/回滚操作。完成数据库操作后，需要关闭数据库连接并卸载数据库驱动程序。清单\
  \ 3-1 给出了使用 ROracle 的示例；该代码加载 ROracle 包，然后从 Oracle 模式表中检索结果。可以使用内置的 RConsole 来运行\
  \ ROracle 方法。\n\n```\nSQL> alter user testr quota unlimited on users;\n用户已更改。\n\
