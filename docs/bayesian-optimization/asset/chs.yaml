  ## 卷积神经网络的超参数优化


  卷积神经网络（CNN）是一种特殊的神经网络架构，已被证明在涉及图像数据的计算机视觉任务（如物体识别）中是一种极其强大的学习器。它是由多个层堆叠而成的序列，每一层由不同大小的节点组成，并通过多种操作之一与其他层连接：直接线性连接或非线性变换（如
  ReLU）。CNN 利用卷积层来学习图像数据的图形结构（例如，在识别人脸时，鼻子位于眼睛下方），与普通的全连接网络（FCN）相比，它仅使用一小部分权重/参数，却能提供更高的预测精度。


  请注意，这些参数是 CNN 模型的一部分，并且在训练 CNN 时是优化的对象。具体来说，当前的参数将用于为当前批次的数据生成一组预测，并获得相应的损失，这是拟合质量的一种度量。这完成了前向传播。在反向传播中，损失将通过计算每个参数的偏导数，流回之前的每一层。这些偏导数将用于使用著名的随机梯度下降（SGD）算法来更新参数。这完成了一次迭代。


  理解 CNN 的内部工作原理并非本书的主要焦点。相反，我们将以 CNN 为例，演示如何使用贝叶斯优化（BO）来对众多超参数做出良好选择。超参数与参数不同，它们必须在每轮网络训练开始之前被选定并固定下来。超参数的示例包括
  SGD 更新中使用的学习率、层中的节点数以及神经网络中的层数。由于在训练现代神经网络时，学习率通常是需要调整的首要超参数，我们将在下一节中专注于优化这个超参数。也就是说，我们希望为当前的网络架构找到最佳的学习率，使其对测试集具有最高的预测精度。


  让我们首先熟悉一下我们将要使用的图像数据。


