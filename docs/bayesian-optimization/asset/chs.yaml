  然后，我们可以绘制这五个样本，以及均值函数和基于协方差矩阵对角线元素（包含在 `uncertainty` 变量中）形成的 95% 置信区间（构成不确定性区域）。在下面的代码清单中，我们定义了一个实用函数，用于在预定义的网格值上绘制样本。该函数还有两个输入参数（`X_train`
  和 `Y_train`），作为实际观测数据出现时的占位符。


  ```

  def plot_gp(mu, cov, X, X_train=None, Y_train=None, samples=[]):

  X = X.ravel()

  mu = mu.ravel()

  # 95% 置信区间

  uncertainty = 1.96 * np.sqrt(np.diag(cov))

  plt.fill_between(X, mu + uncertainty, mu - uncertainty, alpha=0.1)

  plt.plot(X, mu, label=''均值'')

  for i, sample in enumerate(samples):

  plt.plot(X, sample, lw=1, ls=''--'', label=f''样本 {i+1}'')

  # 如果观测数据可用则绘制

  if X_train is not None:

  plt.plot(X_train, Y_train, ''rx'')

  plt.legend()

