  请注意，随着问题规模的扩大，直接基于给定公式计算负对数边缘似然可能在数值上不稳定且计算成本高昂。特别是，计算 ![$$ {\textbf{K}}_y^{-\textbf{1}}
  $$](img/527334_1_En_2_Chapter_TeX_IEq29.png) 涉及矩阵求逆，当矩阵增大时，计算开销会变得很大。在实践中，一个巧妙的技巧是将矩阵求逆转换为另一种更易于计算的操作，从而间接获得相同的结果。




  为了更全面地看待问题，我们首先来看对数概率 log*p*(**y**| **x,***θ*) 中的第一项 ![$$ -\frac{1}{2}{\textbf{y}}^T{\textbf{K}}_y^{-\textbf{1}}\textbf{y}
  $$](img/527334_1_En_2_Chapter_TeX_IEq30.png)。使用 `inv(K)` 计算 ![$$ {\textbf{K}}_y^{-\textbf{1}}
  $$](img/527334_1_En_2_Chapter_TeX_IEq31.png) 可能会导致数值不稳定，正如之前的代码所示。为了避免直接计算，我们可以将
  ![$$ {\textbf{K}}_y^{-\textbf{1}}\textbf{y} $$](img/527334_1_En_2_Chapter_TeX_IEq32.png)
  的计算视为一个整体，并利用 Cholesky 分解技巧来求解方程组，从而避免直接矩阵求逆。具体来说，我们注意到 ![$$ {\textbf{K}}_y^{-\textbf{1}}\textbf{y}={\textbf{L}}^{-\boldsymbol{T}}{\textbf{L}}^{-\textbf{1}}\textbf{y}
  $$](img/527334_1_En_2_Chapter_TeX_IEq33.png)，这里我们使用了 Cholesky 分解将 **K**[*y*] 转换为三角因子矩阵
  **L** 与其转置 **L**^(***T***) 的乘积，即 **K**[*y*] ***=*** **LL**^(***T***)。在执行数学运算时，三角矩阵的内存效率要高得多，并且只需要计算和存储一个三角矩阵。


  假设 **Lm = y**，那么我们可以使用 `scipy` 包中的 `solve_triangular` 函数轻松求解 **m** ***=*** **L**^(**−1**)**y**。类似地，假设
  **L**^(***T***)**α=**，我们可以使用相同的函数求解 **α = L**^(***−T***)**m = L**^(***−T***)**L**^(**−1**)**y**。因此，我们可以通过基于
  Cholesky 分解的结果求解两个方程组来计算 ![$$ {\textbf{K}}_y^{-\textbf{1}}\textbf{y} $$](img/527334_1_En_2_Chapter_TeX_IEq34.png)。


  此外，我们还可以利用以下事实进一步加速计算：![$$ \log \mid {\textbf{K}}_y\mid =2\sum \limits_{i=1}^n\log
  {L}_{ii} $$](img/527334_1_En_2_Chapter_TeX_IEq35.png)，其中 *L*[*ii*] 是因子矩阵 **L** 的第
  *i*^(*th*) 个对角线元素。上述重构在以下代码清单中实现。


  ```

  from numpy.linalg import cholesky

  from scipy.linalg import solve_triangular

  # 间接实现，数值稳定性更高

  def nll_stable(X_train, Y_train, noise):

  Y_train = Y_train.ravel()

  def nll(theta):

  K = ise_kernel(X_train, X_train, l=theta[0], sigma_f=theta[1]) + \

  noise**2 * np.eye(len(X_train))

  L = cholesky(K)

  # 求解第一个方程组

  m = solve_triangular(L, Y_train, lower=True)

  # 求解第二个方程组

  alpha = solve_triangular(L.T, m, lower=False)

  return 0.5 * Y_train.dot(alpha) + \

  0.5 * len(X_train) * np.log(2*np.pi) + \

  np.sum(np.log(np.diagonal(L)))

  return nll

