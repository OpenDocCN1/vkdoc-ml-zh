  ### 定义 CNN 架构


  我们的预测模型是一个函数，它接收输入数据，通过一系列矩阵向量乘法和非线性变换与模型参数交互，并输出模型预测结果。该预测函数一次性实现了两个目标：定义模型参数和指定模型架构（即权重与输入之间的交互机制）。当问题规模较小且模型相对简单时，在一个函数中实现这两个目标尚可接受。然而，随着数据、模型、成本或整个模型训练过程的优化流程复杂度增加，明智的做法是将模型参数与模型架构分离，并根据具体用途将相应代码模块化。换句话说，模型参数和指定数据与参数之间交互方式的模型架构将各自拥有专用的函数。


  常见的做法是使用一个类将所有不同的实用函数封装在一起。具体来说，我们可以将模型参数安排在一个函数中，这通常表现为类的默认`__init__`函数。`__init__`函数包含类首次实例化时的初始化属性，这意味着抽象类被转换为一个物理的、有形的对象。这些属性包括类的基本构建块，即神经网络的层以及由这些层隐含产生的参数。实例化类似于购买一套乐高玩具，所有零件都根据其图纸规格提供。这些零件也可以有不同的尺寸和结构；一个大组件可以由几个小组件组成。


  此外，定义模型架构并规范数据流的函数则进入`forward`函数，它充当了组装零件的说明书。当类的对象被调用时，这个特殊函数会在底层自动执行。因此，它充当了默认的信息路线图，将`__init__`函数定义的各种组件串联起来，与输入数据结合，指定它们如何通过网络，并返回模型预测结果。


  让我们通过创建一个名为`CNN`的模型类来看一个具体示例，这表明它是一个卷积神经网络。卷积是一种特殊类型的神经网络层，能有效处理图像数据。它采用小方形滤波器（也称为*卷积核*）的形式，通过反复扫描输入数据的局部区域来操作。以
  MNIST 中的灰度图像数据为例，每个图像条目将表现为一个二维矩阵，其中每个单元格存储一个介于 0 到 255 之间的像素值。


  常见的做法是在卷积层之后紧跟一个 ReLU 层（仅保留正元素）和一个池化层（用于减少参数）。池化操作与卷积类似，都涉及一个卷积核与输入的不同区域进行交互。然而，卷积核中没有权重。池化操作使用卷积核聚焦于特定的输入区域，选择一个代表值，如均值（平均池化）或最大值（最大池化），并将其存储在输出特征图中。这种操作降低了输入数据的维度，并仅保留（希望是）有意义的特征。


  我们现在创建的 CNN 类将使用前面介绍的所有三种类型的层。如下面的代码清单所示，它继承自预定义的基类`torch.nn.Module`，该类管理神经网络模块的其他后端逻辑，而无需从头创建。CNN
  类将有两个基本函数：`__init__`和`forward`。当将这个类实例化为一个对象时，例如`model = CNN()`，实际发生的是使用 CNN 的`__init__`方法创建模型对象。当使用模型对某些新数据进行预测时，例如`model(new_data)`，我们在底层将`new_data`输入传递给`forward`函数。这两个函数都是隐式调用的。


  以下代码片段展示了模型类。从高层次来看，我们在`__init__`函数中初始化时定义了两个卷积块`conv1`和`conv2`。每个块依次应用三个层：通过`nn.Conv2d()`进行卷积，通过`nn.ReLU()`进行
  ReLU 激活，以及通过`nn.MaxPool2d()`进行最大池化。请注意，在`nn.Conv2d()`中，`in_channels`指的是图像数据中的颜色通道数。由于我们处理的是灰度图像，因此将其设置为
  1。`out_channels`参数指的是要创建的卷积核数量；这将决定最终特征图的深度。换句话说，将其设置为 16 意味着我们将创建 16 个不同的卷积核与输入数据进行卷积，每个卷积核从不同角度学习，并共同在输出中形成一个
  16 层的特征图。`kernel_size`参数决定了方形卷积核的大小。较大的卷积核会促进更多特征共享，但包含更多需要调整的权重，而较小的卷积核则需要更多卷积操作，但能更好地关注输入中的局部特征。最后，我们有步长参数来控制移动卷积核与下一个区域进行卷积时的步长，以及填充参数，通过向输入的外围添加或填充零来调整输出的形状。


  ```

  # 定义卷积神经网络模型类

  import torch.nn as nn

  class CNN(nn.Module):

  # 指定实例化时自动创建的组件

  def __init__(self):

  super(CNN, self).__init__()

  # 第一个卷积块

  self.conv1 = nn.Sequential(

  nn.Conv2d(

  in_channels=1,

  out_channels=16,

  kernel_size=5,

  stride=1,

  padding=2,

  ),

  nn.ReLU(),

  nn.MaxPool2d(kernel_size=2),

  )

  # 第二个卷积块

  self.conv2 = nn.Sequential(

  nn.Conv2d(16, 32, 5, 1, 2),

  nn.ReLU(),

  nn.MaxPool2d(2),

  )

  # 最终的全连接层，输出 10 个类别

  self.out = nn.Linear(32 * 7 * 7, 10)

  # 指定信息流

  def forward(self, x):

  x = self.conv1(x)

  x = self.conv2(x)

  # 将输出展平为形状 (batch_size, 32 * 7 * 7)

  x = x.view(x.size(0), -1)

  output = self.out(x)

  return output

  代码清单 7-7

  定义 CNN 模型架构

  ```


  将多个简单层合并到一个块中，并以不同配置多次重复这样的块，是定义相对复杂神经网络的常见方法。卷积神经网络中的这种结构也有助于学习图像数据的组合性。一个经过充分训练的神经网络可以提取低级特征，例如早期层中的边缘，以及高级模式，例如底层中的物体。


  此外，我们还在初始化函数中通过`nn.Linear()`定义了一个全连接层作为网络的最后一层。请注意，我们需要在第一个参数中传入正确的输入节点数，在第二个参数中传入正确的输出节点数。输入大小根据前面各层的网络配置确定，输出设置为
  10，因为我们要对十类数字进行分类。




  最后，`forward`函数将这些组件按顺序串联起来。在将卷积层与全连接层拼接时需特别注意：必须将每个图像条目对应的多维立方体特征图展平为一维向量。此处我们使用`view()`函数将数据重塑为单列形式（由`-1`参数指定），同时保持批次大小（通过`x.size(0)`获取的第一个维度）不变。


  此外，使用 GPU 能显著加速训练过程。在 Colab（一个便捷的在线 Jupyter 笔记本平台）中运行配套笔记本时，只需将运行时类型中的硬件加速器选项改为
  GPU，即可免费启用 GPU 资源（当然，有一定使用上限）。


  在以下代码片段中，我们通过`model = CNN().to(device)`将类实例化为对象来创建模型，其中使用`device`变量判断是否可用 GPU。打印模型对象可得到由`__init__`函数定义的不同组件的规格说明，如下所示：


  ```

  >>> device = "cuda" if torch.cuda.is_available() else "cpu"

  >>> print(f"Using {device} device")

  >>> model = CNN().to(device)

  >>> print(model)

  Using cuda device

  CNN(

  (conv1): Sequential(

  (0): Conv2d(1, 16, kernel_size=(5, 5), stride=(1, 1), padding=(2, 2))

  (1): ReLU()

  (2): MaxPool2d(kernel_size=2, stride=2, padding=0, dilation=1, ceil_mode=False)

  )

  (conv2): Sequential(

  (0): Conv2d(16, 32, kernel_size=(5, 5), stride=(1, 1), padding=(2, 2))

  (1): ReLU()

  (2): MaxPool2d(kernel_size=2, stride=2, padding=0, dilation=1, ceil_mode=False)

  )

  (out): Linear(in_features=1568, out_features=10, bias=True)

  )

  ```


  当神经网络架构开始扩展并变得复杂时，打印架构有助于更清晰地理解其组成。在以下代码片段中，我们借助`torchsummary`包，通过传入输入条目的大小来简化可视化任务。输出结果自上而下展示了模型架构，每层后依次带有整数后缀，同时提供了每层的输出形状和参数数量。模型共使用了
