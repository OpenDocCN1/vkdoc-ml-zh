  ### 基于无噪声观测获取 GP 后验


  在观测到一些输入位置和输出函数值对形式的样本后，我们可以将它们视为训练数据，用于更新 GP 先验，并获得由其均值函数和协方差函数指定的更新后后验。由于我们使用密集网格中包含的离散位置来近似连续域，因此
  GP 的后验参数将通过均值向量和协方差矩阵来表示。


  在下面的代码清单中，我们定义了一个函数，使用训练数据 `X_train` 和 `Y_train`、新的输入位置 `X_s`、核相关参数 `l` 和 `sigma_f`，以及加性高斯噪声的标准差
  `sigma_y` 来计算后验 GP 的参数。首先计算现有输入 `X_train` 和新输入 `X_s` 之间联合多元高斯分布的协方差矩阵中的相应条目，并分别存储在
  `K`、`K_s` 和 `K_ss` 中，然后将它们代入闭式公式，以获得新输入的**后验均值向量** `mu_s` 和**协方差矩阵** `cov_s`。


  ```

  from numpy.linalg import inv

  def update_posterior(X_s, X_train, Y_train, l=1.0, sigma_f=1.0, sigma_y=1e-8):

  """

  根据 m 个训练数据 X_train 和 Y_train 以及 n 个新输入 X_s，

  计算后验分布的均值向量和协方差矩阵。

  Args:

  X_s: 新的输入位置 (n x d)。

  X_train: 训练位置 (m x d)。

  Y_train: 训练目标 (m x 1)。

  l: 核长度参数。

  sigma_f: 核垂直变化参数。

  sigma_y: 观测噪声参数。

  Returns:

  后验均值向量 (n x d) 和协方差矩阵 (n x n)。

  """

  # 观测输入的协方差矩阵

  K = ise_kernel(X_train, X_train, l, sigma_f) + sigma_y**2 * np.eye(len(X_train))

  # 观测输入与新输入之间的交叉协方差

  K_s = ise_kernel(X_train, X_s, l, sigma_f)

  # 新输入的协方差矩阵

  K_ss = ise_kernel(X_s, X_s, l, sigma_f) + 1e-8 * np.eye(len(X_s))

  # 计算协方差矩阵的逆

  K_inv = inv(K)

  # 基于推导的闭式公式的后验均值向量

  mu_s = K_s.T.dot(K_inv).dot(Y_train)

  # 基于推导的闭式公式的后验协方差矩阵

  cov_s = K_ss - K_s.T.dot(K_inv).dot(K_s)

  return mu_s, cov_s

  代码清单 2-7

  计算新输入的 GP 后验均值向量和协方差矩阵

  ```


