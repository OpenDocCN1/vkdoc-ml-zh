  全局优化上的完整贝叶斯优化循环

  ```


  请注意，在这个看似冗长的代码清单中，基本的贝叶斯优化流程保持不变。对于每次试验，我们都会使用 `generate_initial_data()` 生成一组初始条件，使用
  `initialize_model()` 初始化高斯过程模型，使用 `fit_gpytorch_mll()` 优化其超参数，使用 `optimize_acqf_and_get_observation()`
  为相应的搜索策略获取下一批采样位置和含噪观测值，最后在主列表中更新结果。


  随机搜索策略是一种特殊且简单的策略；我们选择一组随机位置，收集含噪观测值，并记录当前的最佳候选点。以下函数提供了更新规则：


  ```

  def update_random_observations(best_random):

  """通过抽取 BATCH_SIZE 个新的随机点来模拟随机策略，

  观察它们的值，并将当前最佳候选点更新到运行列表中。

  """

  rand_x = torch.rand(BATCH_SIZE, 6)

  next_random_best = neg_hartmann6(rand_x).max().item()

  best_random.append(max(best_random[-1], next_random_best))

  return best_random

