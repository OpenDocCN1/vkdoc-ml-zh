  在使用 Sobol 序列生成良好的覆盖后，下一步是获取采集函数的相应评估值。由于我们可以访问 EI 的解析解，计算这些评估值既廉价又直接。在 `Botorch`
  中，Sobol 序列和相应的采集函数值分别存储在 `gen_batch_initial_conditions()` 函数内部的 `X_rnb` 和 `Y_rnb`
  中。


  最后一步是使用 `initialize_q_batch()` 函数生成一组初始条件，其输入参数包括 `X`（Sobol 序列集）、`Y`（相应的 EI 值）和
  `n`（初始起点数量）。这里使用一种启发式方法，从 `X` Sobol 序列中无放回地选择 `n` 个初始条件，其中被选中的概率与 *e*^(*ηZ*) 成正比，*η*
  是一个可选的输入温度参数，而 ![$$ Z=\frac{Y-\mu (Y)}{\sigma (Y)} $$](img/527334_1_En_5_Chapter_TeX_IEq1.png)
  表示标准化后的 EI 值。换句话说，使用多项分布来选择 `n` 个初始条件，其中 EI 值高的位置更有可能被选中，从而为多起点优化过程提供良好的初始起点。


  回到我们的运行示例。在以下代码片段中，我们使用 `gen_batch_initial_conditions()` 在一个六维单位超立方体中生成 20 个初始条件，其中通过
  Sobol 序列创建了 100 个原始样本。打印返回结果 `Xinit` 的维度显示，它是一个 20x1x6 的张量，其中 20 表示初始条件的数量，1 表示每次
  BO 外部迭代（即标准顺序 BO）中提议的采样位置数量，6 表示状态空间中的特征数量。


  ```

  from botorch.optim.optimize import gen_batch_initial_conditions

  Xinit = gen_batch_initial_conditions(acq_function=EI,

  bounds=torch.tensor([[0.0] * 6, [1.0] * 6]),

  q=1,

  num_restarts=20,

  raw_samples=100)

