  接下来，我们将定义一个采集函数来执行序贯搜索。


  ### 创建蒙特卡洛采集函数


  我们使用 qEI 采集函数演示单步序贯搜索，该函数在`botorch.acquisition`模块的`qExpectedImprovement`类中实现。由于
  qEI 同时提出多个候选点且其闭式表达式不可用，我们需要调用蒙特卡洛技术来近似 qEI 定义所需的期望算子。


  为此，我们使用`SobolQMCNormalSampler`类创建一个采样器实例，该实例通过采样 Sobol 序列实现更稳定的近似，每次蒙特卡洛估计采样 256
  个点，如下代码片段所示：


  ```

  # 定义 QMC 采样器以采样采集函数

  from botorch.sampling.normal import SobolQMCNormalSampler

  MC_SAMPLES = 256

  qmc_sampler = SobolQMCNormalSampler(sample_shape=torch.Size([MC_SAMPLES]))

  ```


  qEI 采集函数需要三个输入参数：GP 模型对象、当前最佳观测值以及准蒙特卡洛采样器：


  ```

  # 使用 qEI 作为 MC 采集函数

  from botorch.acquisition import qExpectedImprovement

  qEI = qExpectedImprovement(model, best_observed_value, qmc_sampler)

  ```


  现在让我们定义一个函数，该函数以指定的采集函数为输入，使用`optimize_acqf()`执行内部优化以获取采集函数的最大化点，并返回建议位置和含噪声观测值作为输出。


  在以下代码片段中，我们定义边界变量，将上下界设置为单位超立方体，并预先指定计算设备和数据类型。我们还使用`BATCH_SIZE`表示每次贝叶斯优化迭代中生成的并行候选位置数量，`NUM_RESTARTS`表示多起点优化过程中使用的起始点数量，`RAW_SAMPLES`表示优化
  MC 采集函数时用于初始化的样本数量：


  ```

  # 优化并获取新观测值

  from botorch.optim import optimize_acqf

  # 6 维单位超立方体

  bounds = torch.tensor([[0.0] * 6, [1.0] * 6], device=device, dtype=dtype)

  # 每次迭代生成的并行候选位置

  BATCH_SIZE = 3

  # 多起点优化的起始点数量

  NUM_RESTARTS = 10

  # 用于初始化的样本数量

  RAW_SAMPLES = 512

  def optimize_acqf_and_get_observation(acq_func):

  """优化采集函数，并返回新候选点及含噪声观测值。"""

  # 优化

  candidates, _ = optimize_acqf(

  acq_function=acq_func,

  bounds=bounds,

  q=BATCH_SIZE,

  num_restarts=NUM_RESTARTS,

  raw_samples=RAW_SAMPLES,  # 用于初始化启发式算法

  options={"batch_limit": 5, "maxiter": 200},

  )

  # 观测新值

  new_x = candidates.detach()

  exact_obj = neg_hartmann6(new_x).unsqueeze(-1)  # 添加输出维度

  new_y = exact_obj + NOISE_SE * torch.randn_like(exact_obj)

  return new_x, new_y

