  NUM_RESTARTS = 20

  RAW_SAMPLES = 2048

  argmax_pmean, max_pmean = optimize_acqf(

  acq_function=PosteriorMean(model),

  bounds=bounds,

  q=1,

  num_restarts=NUM_RESTARTS,

  raw_samples=RAW_SAMPLES

  )

  ```


  我们可以如下观察最大后验均值的值。当前最大后验均值 1.9548 确实低于基于幻想模型的新最大后验均值 2.0358：


  ```

