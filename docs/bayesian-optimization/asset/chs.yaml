  (''mean_module.constant'', Parameter containing:

  tensor([0.2433], requires_grad=True)),

  (''covar_module.raw_outputscale'', Parameter containing:

  tensor(-2.1142, requires_grad=True)),

  (''covar_module.base_kernel.raw_lengthscale'', Parameter containing:

  tensor([[-0.7155, -0.7190, -0.7218, -0.8089, -1.1630, -0.5477]],

  requires_grad=True))]

  ```


  在下一节中，我们将使用期望改进采集函数的解析形式，并求解外部贝叶斯优化循环的解。




  ### 解析解析期望改进（Analytic EI）


  `BoTorch` 提供了 `ExpectedImprovement` 类，它基于我们之前推导的解析公式，计算相对于当前最佳观测值的期望改进。它需要两个输入参数：一个具有单一输出且超参数已优化的
  GP 模型，以及一个被视为无噪声的最佳观测标量值。该计算基于 GP 代理模型在单个特定采样位置的后验均值和方差。


  让我们创建一个 `ExpectedImprovement` 实例，以计算任意给定位置的 EI。首先，我们将使用 `max()` 函数定位最佳观测值，并将结果存储在
  `best_value` 中。如下代码片段所示，最高观测值为 0.875：


  ```

  >>> best_value = train_obj.max()

  >>> best_value

  tensor(0.8750)

  ```


  接下来，我们将基于 `best_value` 和后验 GP 模型对象实例化 EI 对象。在下面的代码片段中，我们将第一个观测值传递给 EI 对象，并得到一个几乎为零的结果
  2.8202e-24。直观上看，这是合理的，因为从已采样位置获得的边际效用应该极小。


  ```

  >>> from botorch.acquisition import ExpectedImprovement

  >>> EI = ExpectedImprovement(model=model, best_f=best_value)

  >>> EI(train_x[0].view(1,-1))

  tensor([2.8202e-24], grad_fn=<AddBackward0>)

  ```


  我们可以进一步检查 `BoTorch` 中 `ExpectedImprovement` 类的实现。下面，我们展示了该类 `forward()` 方法的定义，该定义来自
  `BoTorch` 版本 0.6.5 的官方 GitHub 页面：


  ```

  from torch import Tensor

  from torch.distributions import Normal

  def forward(self, X: Tensor) -> Tensor:

  0# 将最佳观测值 best_f 的数据类型转换为候选点 X 的数据类型

  self.best_f = self.best_f.to(X)

  # 获取候选位置 X 处的后验实例

  posterior = self.model.posterior(

  X=X, posterior_transform=self.posterior_transform

  )

  # 获取后验均值

  mean = posterior.mean

  # 处理批量评估和广播

  view_shape = mean.shape[:-2] if mean.shape[-2] == 1 else mean.shape[:-1]

  mean = mean.view(view_shape)

  # 获取后验标准差，并设置下限以避免除以零

  sigma = posterior.variance.clamp_min(1e-9).sqrt().view(view_shape)

  # 计算标准化单位改进，必要时广播 best_f

  u = (mean - self.best_f.expand_as(mean)) / sigma

  # 在最小化情况下切换符号

  if not self.maximize:

  u = -u

  # 基于解析形式计算 ei

  normal = Normal(torch.zeros_like(u), torch.ones_like(u))

  ucdf = normal.cdf(u)

  updf = torch.exp(normal.log_prob(u))

  ei = sigma * (updf + u * ucdf)

  return ei

  代码清单 5-3

  评估 EI 采集函数

  ```


  在此函数中，我们首先使用张量对象的 `to()` 方法，将 `best_f` 的数据类型与候选位置 `X` 的数据类型对齐。然后，我们访问候选位置的后验均值和方差，其形状根据批量评估和广播需求进行调整，并且标准差设置了下限以避免除以零。通过计算出的单位改进
  `u`，我们可以将其代入 EI 的解析形式（如下所示，便于参考）并执行相应计算：


  ![$$ {\alpha}_{EI}=\left(\mu -{f}^{\ast}\right)\Phi \left(\frac{\mu -{f}^{\ast }}{\sigma}\right)+\sigma
  \phi \left(\frac{\mu -{f}^{\ast }}{\sigma}\right) $$](img/527334_1_En_5_Chapter_TeX_Equb.png)


  其中 *f* ^∗ 是迄今为止的最佳观测值，*ϕ* 和 Φ 分别表示标准正态分布的概率密度函数和累积分布函数。请注意，代码提取出了公因子 *σ*，这使得实现更加容易。


  接下来，我们将探讨如何使用 EI 优化黑箱 Hartmann 函数。


  ### 使用解析期望改进进行优化


  由于大多数采集函数（如 EI）是非凸的且通常是平坦的，因此优化这些函数是一项不小的挑战。在这种情况下，设计一个能够在搜索全局最优值时跳出次优候选位置（如局部最优点或鞍点）的优化器至关重要。


  优化能力主要由 `BoTorch` 中的 `optimize_acqf()` 函数提供，该函数使用基于随机梯度下降的多起点优化生成一组候选最优位置。特别地，多起点随机梯度下降方法被广泛用于许多机器学习和深度学习模型中的基于梯度的随机全局优化。让我们简要讨论一下这种优化方法。


  随机梯度下降（SGD）是一种优化算法，它基于一个或一小批训练样本对变量执行基于梯度的更新。然而，当目标函数非凸时，基于 SGD 的方法难以定位全局最优点，反而容易收敛到鞍点或局部最优点。即使目标函数是凸的，当起始位置不利时，基于
  SGD 的方法也难以收敛到全局最优点。


  解决这些挑战的一个常见方法是，从多个起始位置（随机选择或根据某种自适应过程选择）执行 SGD。当起始位置的数量足够多样化时，我们可以并行运行多个 SGD 优化，并生成多条搜索路径。收敛后，我们将报告最有希望的候选位置（可被识别为具有最高采集函数值的位置）作为优化结果。通过这种方式，我们的基于
  SGD 的方法更有可能跳出鞍点或局部最优点，并找到全局最优点。图 5-1 展示了多起点随机梯度下降算法。


  ![](img/527334_1_En_5_Fig1_HTML.jpg)


  该图展示了一个由二维动作空间组成的多起点随机梯度下降算法，使用多起点 SGD，每次重启可被视为一个独立的优化例程，在局部邻域内旨在定位一个局部最优点。


  图 5-1


  在二维动作空间中说明多起点随机梯度下降算法，其中选择多个起点以并行生成不同路径。最终解是通过收敛后聚合所有端点并取最佳候选点获得的。注意，在离散动作空间的情况下，需要额外投影到最近的采样位置


  使用多起点 SGD，每次重启可被视为一个独立的优化例程，在局部邻域内旨在定位一个局部最优点。当聚合多次重启并取最佳解时，我们更有可能达到全局最优点。


  当使用 `optimize_acqf()` 函数执行多起点优化时，起点数量通过 `num_restarts` 参数指定。此外，我们还需要通过 `bounds`
  参数传递搜索空间的边界（一个六维单位超立方体），并通过 `raw_samples` 参数传递用于初始化的原始样本数量。由于我们在每次迭代中只提议一个采样位置，我们还需要设置
  `q=1`。在每次迭代中提议多个位置涉及并行贝叶斯优化，这将在后续章节中讨论。


  设置完所有这些输入参数后，我们可以运行以下代码片段来生成全局最优的最终解：




  ```

  from botorch.optim import optimize_acqf

  new_point_analytic, _ = optimize_acqf(

  acq_function=EI, # 用于指导搜索的采集函数

  bounds=torch.tensor([[0.0] * 6, [1.0] * 6]), # 六维单位超立方体

  q=1, # 每次迭代生成一个候选位置

  num_restarts=20, # 多起点优化的起始点数量

  raw_samples=100, # 初始化的样本数量

  options={}, # 其他选项（如有）

  )

  代码清单 5-4

  获取使 EI 最大化的最佳采样位置

  ```


