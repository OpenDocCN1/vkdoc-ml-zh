  通过此函数生成的初始条件将存储在 `batch_initial_conditions` 变量中。按照惯例，仅在高级函数内部使用的函数以下划线开头，如 `_gen_initial_conditions()`
  的情况。


  基于上述启发式方法生成初始条件后，我们现在将进入核心优化阶段，使用基于梯度的方法和随机重启，这通过 `_gen_initial_conditions()` 函数中的另一个内置函数
  `_optimize_batch_candidates()` 完成。


  如前所述，实际的优化发生在 `gen_candidates_scipy()` 中，它基于 SciPy 提供的广泛使用的 `scipy.optimize.minimize()`
  函数生成一组最优候选点。它从一组初始候选点开始，这些候选点作为优化的起点，并通过 `initial_conditions` 输入参数传入。它还将接受其他核心输入参数，例如采集函数
  `acquisition_function`、`lower_bounds` 中的下界和 `upper_bounds` 中的上界。


  让我们仔细检查核心优化例程。在以下代码中，我们演示了如何使用 `gen_candidates_scipy()` 生成一组最优候选点，并返回其中 EI 值最高的候选点：


  ```

  from botorch.generation.gen import gen_candidates_scipy

  batch_candidates, batch_acq_values = gen_candidates_scipy(

  initial_conditions=Xinit,

  acquisition_function=EI,

  lower_bounds=torch.tensor([[0.0] * 6]),

  upper_bounds=torch.tensor([[1.0] * 6]),

  )

  # 提取最佳候选点的索引

  best = torch.argmax(batch_acq_values.view(-1), dim=0)

  batch_candidates = batch_candidates[best]

  ```


