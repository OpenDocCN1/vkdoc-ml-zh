  使用高斯过程获取新输入位置的预测分布。我们首先定义并可选地优化一个核函数，以编码从实际样本中观测到的信息以及基于先验所相信的信息。然后，我们将所有变量建模为联合高斯分布，并获取新变量的条件分布。




  ### 从含噪观测中学习


  在我们的运行示例中，我们假设样本观测是无噪声的。但在实践中，这类观测常常受到噪声污染，这给建模增加了另一层不确定性。一种常见的处理方式是将每个观测的噪声建模为条件独立的随机变量，并作为加性噪声叠加到无噪声观测上。换句话说，我们可以用
  **y** = **f** + **ε** 来表示实际观测，其中 ![$$ \boldsymbol{\upvarepsilon} \sim N\left(\textbf{0},{\upsigma}_y²\textbf{I}\right)
  $$](img/527334_1_En_2_Chapter_TeX_IEq23.png) 具有齐次方差。然而，我们也可以针对每个输入位置建模具有异质方差的情况。


  使用加性高斯噪声的最大好处是，我们可以精确地执行相同的推理，为更新后的后验高斯过程的参数获得一个闭式解。遵循相同的推导过程，无噪声预测 **f**[∗] 的预测分布现在变为


  ![$$ p\left({\textbf{f}}_{\ast }|{\textbf{x}}_{\ast },\textbf{x},\textbf{y}\right)=N\left({\textbf{f}}_{\ast
  }|{\boldsymbol{\mu}}_{\ast},{\boldsymbol{\Sigma}}_{\ast}\right) $$](img/527334_1_En_2_Chapter_TeX_Equz.png)


  ![$$ {\boldsymbol{\mu}}_{\ast }={\textbf{K}}_{\ast}^T{\textbf{K}}_y^{-1}\textbf{y}
  $$](img/527334_1_En_2_Chapter_TeX_Equaa.png)


  ![$$ {\boldsymbol{\Sigma}}_{\ast }={\textbf{K}}_{\ast \ast }-{\textbf{K}}_{\ast}^T{\textbf{K}}_y^{-1}{\textbf{K}}_{\ast
  } $$](img/527334_1_En_2_Chapter_TeX_Equab.png)


  其中 ![$$ {\textbf{K}}_y=\textbf{K}+{\upsigma}_y²\textbf{I} $$](img/527334_1_En_2_Chapter_TeX_IEq24.png)
  是实际含噪样本的方差，它吸收了真实无噪声观测和噪声各自的方差。由于噪声也会附着在 **f**[∗] 中的每个随机变量上，我们还可以通过将 ![$$ {\upsigma}_y²\textbf{I}
  $$](img/527334_1_En_2_Chapter_TeX_IEq25.png) 加到 **Σ**[∗] 上，将噪声 **ε** 纳入含噪预测 **y**[**∗**]
  中：


  ![$$ p\left({\textbf{y}}_{\ast }|{\textbf{x}}_{\ast },\textbf{x},\textbf{y}\right)=N\left({\textbf{y}}_{\ast
  }|{\boldsymbol{\mu}}_{\ast},{\boldsymbol{\Sigma}}_{\ast}+{\upsigma}_y²\textbf{I}\right)
  $$](img/527334_1_En_2_Chapter_TeX_Equac.png)


  然后，我们可以使用这个预测分布在域内的任何输入位置进行采样。当样本数量增长到无穷大时，连接这些样本将形成一条函数曲线，这是高斯过程的一个样本。我们还可以通过连接逐点标准差来绘制置信区间。将函数曲线视为无限多个逐点样本的组成，这与从二元高斯分布中采样的情形遵循相同的论证。


  ## 高斯过程的实践


  在本节中，我们将通过一个具体示例，演示如何利用高斯过程的先验分布绘制函数曲线作为样本，更新参数，并利用其后验分布获取更新后的样本。我们将使用 Python 来说明实现步骤。


  ### 从 GP 先验中采样


  让我们看看在揭示任何观测之前，如何从高斯过程的先验中采样函数曲线。我们将遵循以下步骤，这与从任意高斯分布中采样类似：


  *   创建一个包含 *n* 个候选输入位置的列表 {*x*[*i*], *i* = 1, …, *n*}。我们使用离散位置 `X_test` 来近似一个连续域。当
  *n* → ∞ 时，我们将获得一条覆盖无限多个输入位置的函数曲线。


  *   初始化均值向量 **μ**（包含 *n* 个元素）和协方差矩阵 **K**（包含 *n* x *n* 个元素）。我们假设数据已中心化，因此 **μ =
  0**，并且 **K** 是一个平方指数核函数，计算后存储在变量 `K` 中。


  *   执行 Cholesky 分解 **K = LL**^(*T*) 以获得 **L**，存储在变量 `L` 中。


  *   通过 **L***N*(**0**, **I**) 从 *N*(**0**, **K**) 中获得一个样本，并存储在 `f_prior` 中。


  有关从 GP 先验生成样本的完整代码，请参见清单 2-2。


  ```

  # 导入必要的包

  import numpy as np

  from matplotlib import pyplot as plt

  %matplotlib inline

  # 设置随机种子以确保可重复性

  np.random.seed(8)

  # 定义一个核函数，返回两个输入位置之间的平方指数距离

  def kernel(a, b):

  # 将平方运算分解为三部分

  # 每个输入位置可能是多维的，因此对所有维度求和

  sq_dist = np.sum(a**2,1).reshape(-1,1) + np.sum(b**2,1) - 2*np.dot(a,b.T)

  return np.exp(-sq_dist)

  # 设置输入位置的数量，当增长到无穷大时近似于一个函数

  n = 100

  X_test = np.linspace(-5,5,n).reshape(-1,1)

  # 计算成对距离，得到一个 nxn 矩阵

  K = kernel(X_test, X_test)

  # 沿对角线元素添加一个小数，以确保 Cholesky 分解有效

  L = np.linalg.cholesky(K + 1e-10*np.eye(n))

  # 通过将标准差与标准正态样本相乘来计算函数样本

  samples = np.dot(L,np.random.normal(size=(n,5)))

  plt.plot(X_test, samples)

  清单 2-2

  从 GP 先验中绘制样本

  ```


  运行上述代码将生成五条随机曲线，每条曲线由 100 个离散点连接而成，以近似整个域上的一个函数。输出结果见图 2-10。


  ![](img/527334_1_En_2_Fig10_HTML.png)


  一个折线图显示了 5 条曲线穿过多个波峰和波谷的趋势。y 轴范围从负 2 到正 3，而 x 轴范围从负值到正 4。


  图 2-10


  从 GP 先验中绘制五个随机样本


  我们可以通过引入额外参数使核函数更加灵活。例如，广泛使用的*高斯核*或*RBF 核*使用两个参数：长度参数 *l* 控制函数的平滑度，*σ*[*f*] 控制垂直变化：


  ![$$ \kappa \left({x}_i,{x}_j\right)={\sigma}_f²\exp \left(-\frac{1}{2{l}²}{\left\Vert
  {x}_i-{x}_j\right\Vert}²\right) $$](img/527334_1_En_2_Chapter_TeX_Equad.png)


  出于演示目的，我们将对每个输入位置/维度使用相同的参数，这也会产生所谓的*各向同性核*，其定义如下。两个输入参数都可以包含多个元素/位置，每个元素/位置由一个或多个维度组成。例如，如果
  **X1** 是一个 (*m* x *d*) 矩阵，包含 *m* 个位置，每个位置有 *d* 个维度，而 **X2** 是一个 (*n* x *d*) 矩阵，应用核函数将得到一个
  (*m* x *n*) 矩阵，其中包含成对的相似性条目。




  ```

  # Args:

  #     X1: m 个点的数组 (m x d)。

  #     X2: n 个点的数组 (n x d)。

  # Returns:

  #     (m x n) 矩阵。

  def ise_kernel(X1, X2, l=1.0, sigma_f=1.0):

  sq_dist = np.sum(X1**2,1).reshape(-1,1) + np.sum(X2**2,1) - 2*np.dot(X1,X2.T)

  return sigma_f**2 * np.exp(-0.5/l**2 * sq_dist)

  代码清单 2-3

  定义各向同性平方指数核

  ```


  我们可以根据之前在 `X_test` 中定义的输入位置列表，获得均值向量（假设为零）和协方差矩阵（使用 *l* = 1 和 *σ*[*f*] = 1）。


  ```

  # 先验的均值和协方差

  mu = np.zeros(X_test.shape)

  K = ise_kernel(X_test, X_test)

  代码清单 2-4

  计算均值向量和协方差矩阵

  ```


  之前，我们通过对标准正态分布的样本进行缩放，从多元高斯分布中采样。实际上，`numpy` 中有一个 `multivariate_normal` 函数可以帮助我们实现这一点。我们按如下方式抽取五个样本。


