  ### 尝试不同的核参数


  此前，我们在所有观测位置采用了一个各向同性核，其中 *l* = 1 且 *σ*[*f*] = 1。*l* 控制着高斯过程拟合的平滑度。较高的 *l* 会导致拟合更平滑、曲率更小，而较低的
  *l* 则会产生更灵活、不确定性区间更宽的拟合。*σ*[*f*] 控制着从高斯过程中抽取的函数样本的垂直变化。当我们远离观测位置时，较高的 *σ*[*f*] 会导致整个域上的不确定性区域更宽。


  在以下代码清单中，选择了 *l* 和 *σ*[*f*] 的四种组合，以演示不同参数设置对拟合结果的影响。这些组合以元组列表的形式存储在 `params` 中，并在循环中迭代，以生成排列成两行的四个图形。


  ```

  params = [

  (0.1, 1.0),

  (2.0, 1.0),

  (1.0, 0.1),

  (1.0, 2.0)

  ]

  plt.figure(figsize=(12, 5))

  for i, (l, sigma_f) in enumerate(params):

  mu_s, cov_s = update_posterior(X_test, X_train, Y_train, l=l,

  sigma_f=sigma_f)

  plt.subplot(2, 2, i + 1)

  plt.subplots_adjust(top=2)

  plt.title(f''l = {l}, sigma_f = {sigma_f}'')

  plot_gp(mu_s, cov_s, X_test, X_train=X_train, Y_train=Y_train)

