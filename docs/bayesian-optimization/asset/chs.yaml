  引言


  贝叶斯优化提供了一个统一的框架，用于解决不确定性下的序贯决策问题。它包含两个关键组成部分：一个代理模型，用于近似未知的黑箱函数并提供不确定性估计；以及一个采集函数，用于指导序贯搜索。本书回顾了这两个组成部分，涵盖了理论介绍和在
  Python 中的实践实现，并基于 GPyTorch 和 BoTorch 等流行库进行构建。此外，本书还提供了案例研究，展示了如何使用贝叶斯优化来寻找模拟函数的全局最优值，或在训练深度神经网络时定位最佳超参数（例如学习率）。本书假设读者对模型开发和机器学习有基本的了解，并面向以下读者群体：


  *   数据科学、机器学习或优化相关领域的学生

  *   处于职业生涯早期和中期、需要构建具有良好性能超参数的机器学习模型的从业者，例如数据科学家

  *   对贝叶斯优化作为一种全局优化技术感兴趣，希望尽可能快地寻求最优解的爱好者


  本书中使用的所有源代码均可从 `github.com/apress/Bayesian-optimization` 下载。


