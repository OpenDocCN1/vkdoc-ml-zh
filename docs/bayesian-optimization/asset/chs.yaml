  ## 总结


  高斯过程是许多建模问题中的重要工具。在本章中，我们涵盖了以下内容：


  *   高斯过程由均值函数和协方差函数刻画。它将有限多元高斯分布的情况扩展到无限情况。


  *   核/协方差函数控制拟合曲线的形状，例如平滑度，它作为一种归纳偏置被引入。


  *   从任意（独立）多元高斯分布中采样，可以通过从正态分布中采样，然后进行尺度-位置变换来实现。


  *   高斯过程回归将观测到的随机变量视为联合多元高斯分布，并利用多元高斯定理为新输入位置提供封闭形式的预测边际分布。


  *   带有加性正态分布噪声的含噪观测可以无缝地融入高斯过程框架中。


  *   实现高斯过程学习过程，首先计算高斯过程先验的参数，然后使用观测样本更新这些参数以获得高斯过程后验，其中高斯过程后验的均值函数会对无噪声观测进行插值。


  *   可以使用最大似然估计过程来优化核参数，通过使用 Cholesky 分解可以使实现过程在数值上更稳定、速度更快。


  在下一章中，我们将研究期望提升（EI），这是贝叶斯优化中使用最广泛的采集函数。


  '
- "# 3. 贝叶斯决策理论与期望提升\n\n前一章使用高斯过程（GP）作为代理模型来逼近底层目标函数。GP 是一个灵活的框架，它以整个域上合理函数的概率分布形式提供不确定性估计。然后，我们可以利用在提议位置处的封闭形式后验预测分布，来获得对潜在观测值的合理估计。\n\
  \n然而，它并非贝叶斯优化中代理模型的唯一选择。尽管默认和主流选择仍然是 GP，但近年来，许多其他模型（如随机森林）的使用也日益增多。尽管如此，规范的贝叶斯优化框架允许使用任何代理模型，只要它能提供函数的后验估计，然后采集函数会利用该估计来生成采样提议。\n\
  \n采集函数则有更多的选择，并且是一个日益拥挤的研究领域。标准的采集函数，如期望提升和上置信界，已在许多应用中得到广泛使用，而结合了领域知识（如安全约束）的特定问题采集函数也在不断被提出。采集函数在贝叶斯优化框架中扮演着更重要的角色，因为它直接决定了后续数据采集的采样决策。因此，一个好的采集函数能使优化器尽可能快地定位到（全局）最优值，这里的最优值是从持有最优值的位置或整个域上的最优值角度来衡量的。\n\
  \n本章将深入探讨使用期望提升的贝叶斯优化流程，期望提升是用于采样决策的最广泛使用的采集函数。我们首先将贝叶斯优化描述为一个在不确定性下的序贯决策过程，然后详细介绍期望提升。智能地选择涉及不确定性估计的下一个采样位置，是实现样本高效的全局优化的关键。最后，我们将通过一个案例研究，展示如何使用期望提升来指导超参数调优。\n\
  \n\n\n## 通过序贯决策进行优化\n\n贝叶斯优化框架会序贯地确定下一个采样位置，以搜索全局最优解（在最大化设定中通常假设为最大值）。基于特定策略，优化器会收集观测数据点，更新关于底层函数概率分布的后验信念，提出下一个待探测的采样点，最终在提议位置收集额外数据点并重复此过程。这便完成了迭代序贯过程中的一次循环。我们对底层函数的认知会随着每次在现有观测集合指导下纳入新数据点而不断演进和更新。\n\
  \n在过程结束时，策略将返回最优值的位置或最优值本身，尽管我们通常更关心最优位置。这通常被称为贝叶斯优化框架中的*外循环*。此外，最大化采集函数以生成下一个采样位置构成了贝叶斯优化的*内循环*。采集函数作为内循环中的辅助计算，用于支持后续的采样决策。由于采集函数评估成本低且具有解析可微性，优化该函数通常被认为是快速且廉价的。我们可以获得某些采集函数的闭式表达式，并通过使用现成的优化程序访问其梯度。对于没有闭式表达式的更复杂采集函数，我们也可以借助蒙特卡洛估计等近似方法。\n\
  \n此外，策略还需要考虑*何时*终止探测过程，尤其是在探测预算有限的情况下。终止时，优化器将返回最优函数值或位置，该值或位置可能存在于观测位置中，也可能不存在，而可能位于域内的任何位置。因此，优化器需要在停止查询与执行额外采样之间进行权衡，后者会产生额外成本。因此，优化器的动作空间不仅包含采样位置，还包含一个关于终止的二元决策。\n\
  \n图 3-1 描述了支撑贝叶斯优化的序贯决策过程。策略会在每次外循环迭代中提议下一个采样位置，或终止循环。假设它决定提议一个额外的采样动作。在这种情况下，我们将进入内循环，以寻找具有预设采集函数最高值的最有前景位置。然后，我们将探测该最有利位置，并将额外观测值追加到数据集中，随后通过高斯过程利用该数据集更新关于底层目标函数的后验信念。另一方面，如果策略认为额外查询不值得付出相应成本来改进我们对全局最优解的信念，它将决定终止外循环，并返回当前对全局最优解或其位置的最佳估计。这也构成了策略的*停止规则*，该规则可在耗尽有限预算时触发，或基于当前进展采用自适应机制触发。\n\
  \n![](img/527334_1_En_3_Fig1_HTML.jpg)\n\n一个框图展示了从观测数据集合开始，经过策略和环境，再循环回数据集合以扩充训练集的序列过程。策略发送最优值的推荐，该推荐被标记为优化的终点。\n\
  \n图 3-1\n\n贝叶斯优化中的序贯决策过程。外循环通过在整个域内进行序贯采样来执行优化，以搜索全局最优解。每次迭代都基于内循环的输出，而内循环则涉及另一个独立的优化过程\n\
  \n量化对全局最优解信念的改进，体现在观测数据*效用*的*期望边际增益*上，这是贝叶斯优化中所用贝叶斯决策理论的核心概念。我们将在后续章节中讨论这一主题。\n\n\
  \n\n### 寻求最优策略\n\n贝叶斯优化的最终目标是开发一种智能策略，能够以原则性的方式在不确定性下执行序贯决策。当根据所收集数据的质量来衡量策略时，贝叶斯优化会寻求*最优策略*，以最大化所收集数据的期望质量。换句话说，最优策略平均而言能提供信息量最大的数据集，以协助定位全局最优解的任务，同时考虑对底层目标函数的后验信念。\n\
  \n在这方面，采集函数用于衡量在考虑整个域内下一个采样决策时的数据质量。采集函数将每个候选位置映射为一个数值分数，这本质上编码了对不同候选位置的偏好。它充当了连接更新后验信念与寻求最优策略之间的中间计算环节。具体来说，基于最新后验信念的最优决策是通过选择使用指定采集函数计算出的分数最高的位置来做出的，这完成了一轮内部优化。\n\
  \n数学上，对于域 *A* 中的每个候选位置 *x*，自定义的采集函数 *α*(*x*) 将每个 *x* 映射为一个标量值，即 *α* : *A* → *ℝ*。这里，我们假设\
  \ *x* 是单维度的，这无损一般性且为了方便符号表示，尽管它可以具有多个特征，即 **x** ∈ ℝ^(*d*)。此外，采集函数是一个不断演变的评分函数，它也依赖于当前收集到的包含\
  \ *n* 个观测值的数据集 ![$$ {\\mathcal{D}}_n $$](img/527334_1_En_3_Chapter_TeX_IEq1.png)，因此写作\
  \ ![$$ \\alpha \\left(x;{\\mathcal{D}}_n\\right) $$](img/527334_1_En_3_Chapter_TeX_IEq2.png)\
  \ 以表明这种依赖关系。\n\n因此，对于 *A* 内的任意两个位置 *x*[1] 和 *x*[2]，如果 ![$$ \\alpha \\left({x}_1;{\\\
  mathcal{D}}_n\\right)&gt;\\alpha \\left({x}_2;{\\mathcal{D}}_n\\right) $$](img/527334_1_En_3_Chapter_TeX_IEq3.png)，我们会偏好\
  \ *x*[1] 胜过 *x*[2]，反之亦然。在连续搜索域中存在无限多个候选位置的情况下，最优策略会贪婪地选择具有最高采集值的单个位置 ![$$ {x}_{n+1}^{\\\
  ast } $$](img/527334_1_En_3_Chapter_TeX_IEq4.png) 作为下一个采样动作。我们使用上标 ∗ 表示最优动作，下标 *n*\
  \ + 1 表示在现有 *n* 个观测值基础上增加的第一个未来采样位置。因此，加一意味着向未来的前瞻步长或时间步。符号 *x*[*n* + 1] 表示所有可能的候选位置，包括已观测到的位置，并被视为一个随机变量。最优决策定义如下：\n\
  \n![$$ {x}_{n+1}^{\\ast }={\\textrm{argmax}}_{x_{n+1}\\in A}\\alpha \\left({x}_{n+1};{\\\
  mathcal{D}}_n\\right) $$](img/527334_1_En_3_Chapter_TeX_Equa.png)\n\n常见的采集函数，如期望提升（将在后面介绍），由于具有闭式解析表达式及其对应的梯度，因此支持快速的基于梯度的优化。这意味着我们将原本对困难且未知的目标函数进行全局优化的任务，转化为一系列对已知采集函数的快速优化。然而，正如我们稍后将了解到的，某些采集函数，特别是那些具有多步前瞻特性的函数，可能无法解析求导，这使得内部优化成为一个非平凡的问题。在这种情况下，通常使用蒙特卡洛近似来近似计算。\n\
  \n我们现在可以呈现贝叶斯优化高层次上的数学细节，暂时忽略关于终止的决策。如图 3-2 所示，整个贝叶斯优化（外）循环包含三个主要步骤：基于当前数据集 ![$$\
  \ {\\mathcal{D}}_n $$](img/527334_1_En_3_Chapter_TeX_IEq7.png) 提出下一个采样位置 ![$$ {x}_{n+1}^{\\\
  ast } $$](img/527334_1_En_3_Chapter_TeX_IEq5.png) 作为采集函数 ![$$ \\alpha \\left({x}_{n+1};{\\\
  mathcal{D}}_n\\right) $$](img/527334_1_En_3_Chapter_TeX_IEq6.png) 的最大化位置；探测所提出的位置并将额外的观测值追加到当前数据集\
  \ ![$$ {\\mathcal{D}}_{n+1}={\\mathcal{D}}_n\\cup \\left\\{\\left({x}_{n+1}^{\\\
  ast },{y}_{n+1}^{\\ast}\\right)\\right\\} $$](img/527334_1_En_3_Chapter_TeX_IEq8.png)\
  \ 中；最后，假设一个高斯过程代理模型 ![$$ p\\left(f|{\\mathcal{D}}_{n+1}\\right) $$](img/527334_1_En_3_Chapter_TeX_IEq9.png)\
  \ 来更新后验信念。这里，![$$ {y}_{n+1}^{\\ast } $$](img/527334_1_En_3_Chapter_TeX_IEq10.png)\
  \ 表示在最优下一个采样位置 ![$$ {x}_{n+1}^{\\ast } $$](img/527334_1_En_3_Chapter_TeX_IEq11.png)\
  \ 处的观测值。因此，选择合适的采集函数对于确定序贯优化过程的质量起着至关重要的作用。\n\n![](img/527334_1_En_3_Fig2_HTML.png)\n\
  \n一个三角形图表示一组过程，从收集观测数据开始，通过策略更新高斯过程后验，向环境提出下一个采样位置，并通过查询和添加额外数据循环回到数据收集。每个阶段都标有一个方程。\n\
  \n图 3-2\n\n通过迭代最大化当前采集函数、探测额外数据并更新后验信念来说明整个贝叶斯优化循环\n\n尽管贝叶斯优化循环可以从空数据集开始，但实际训练通常依赖于一个由少量均匀采样观测值组成的小型数据集。这加速了优化过程，因为它起到了热启动的作用，并且比均匀先验提供了更具信息量的先验信念。当初始数据集对域中不同位置具有良好的覆盖时，这种效果更为明显。\n\
  \n\n\n### 效用驱动优化\n\n贝叶斯优化的最终目标是收集一组有价值的观测数据，这些数据能提供关于全局最优解的最丰富信息。数据集的价值通过*效用*来量化，这一概念最初用于贝叶斯决策理论，此处借助采集函数辅助贝叶斯优化中的序贯优化过程。在评估候选位置的价值时，采集函数建立在当前数据集效用的基础之上。\n\
  \n由于我们的目标是定位全局最大值，效用函数的一个自然选择是当前数据集的最大值，即假设无噪声观测的情况下，![$$ u\\left({\\mathcal{D}}_n\\\
  right)=\\max \\left\\{{y}_{1:n}\\right\\}={y}_n^{\\ast } $$](img/527334_1_En_3_Chapter_TeX_IEq12.png)。这也被称为当前数据集的**当前最优值**，并作为评估所有未来候选观测的基准。作为实际应用中最广泛使用的采集函数，期望改进函数利用这个当前最优值来奖励那些推测观测值可能更高的候选位置。\n\
  \n在评估候选位置 *x*[*n* + 1] 时，我们需要一个虚构的观测值 *y*，以便能够计算*如果*我们在此位置获取额外观测值时的效用。考虑到目标函数的随机性，我们最好的估计是\
  \ *y*[*n* + 1] 将遵循根据更新后的高斯过程后验得到的后验正态分布。由于 *y*[*n* + 1] 是一个随机变量，标准方法是通过计算特定位置的*期望效用*来积分消除其随机性，即给定特定评估位置\
  \ *x*[*n* + 1] 和当前观测集 ![$$ {\\mathcal{D}}_n $$](img/527334_1_En_3_Chapter_TeX_IEq14.png)\
  \ 的条件下，计算 ![$$ {\\mathbbm{E}}_{y_{n+1}}\\left[u\\left({x}_{n+1},{y}_{n+1},{\\mathcal{D}}_n\\\
  right)|{x}_{n+1},{\\mathcal{D}}_n\\right] $$](images/527334_1_En_3_Chapter/527334_1_En_3_Chapter_TeX_IEq13.png)。这也对应于假设我们有一个额外的未知观测值\
  \ (*x*[*n* + 1], *y*[*n* + 1]) 时的期望效用，从而得到 ![$$ {\\mathbbm{E}}_{y_{n+1}}\\left[u\\\
  left({\\mathcal{D}}_{n+1}\\right)|{x}_{n+1},{\\mathcal{D}}_n\\right]={\\mathbbm{E}}_{y_{n+1}}\\\
  left[u\\left({\\mathcal{D}}_n\\cup \\left({x}_{n+1},{y}_{n+1}\\right)\\right)|{x}_{n+1},{\\\
  mathcal{D}}_n\\right]={\\mathbbm{E}}_{y_{n+1}}\\left[u\\left({x}_{n+1},{y}_{n+1},{\\\
  mathcal{D}}_n\\right)|{x}_{n+1},{\\mathcal{D}}_n\\right] $$](images/527334_1_En_3_Chapter/527334_1_En_3_Chapter_TeX_IEq15.png)。然后我们可以利用后验预测分布\
  \ ![$$ p\\left({y}_{n+1}|{\\mathcal{D}}_n\\right) $$](img/527334_1_En_3_Chapter_TeX_IEq16.png)，在连续情况下将期望效用表示为如下积分运算：\n\
  \n![$$ {\\mathbbm{E}}_{y_{n+1}}\\left[u\\left({x}_{n+1},{y}_{n+1},{\\mathcal{D}}_n\\\
  right)|{x}_{n+1},{\\mathcal{D}}_n\\right]=\\int u\\left({x}_{n+1},{y}_{n+1},{\\\
  mathcal{D}}_n\\right)p\\left({y}_{n+1}|{x}_{n+1},{\\mathcal{D}}_n\\right)d{y}_{n+1}\
  \ $$](images/527334_1_En_3_Chapter/527334_1_En_3_Chapter_TeX_Equb.png)\n\n该表达式考虑了位置\
  \ *x*[*n* + 1] 处 *y*[*n* + 1] 的所有可能值。它根据发生的概率对相应的效用进行加权。通过获取每个候选位置的期望效用，可以通过选择期望效用最大的位置来确定下一个采样位置：\n\
  \n![$$ {x}_{n+1}^{\\ast }={\\textrm{argmax}}_{x_{n+1}\\in A}{\\mathbbm{E}}_{y_{n+1}}\\\
  left[u\\left({x}_{n+1},{y}_{n+1},{\\mathcal{D}}_n\\right)|{x}_{n+1},{\\mathcal{D}}_n\\\
  right] $$](images/527334_1_En_3_Chapter/527334_1_En_3_Chapter_TeX_Equc.png)\n\n\
  因此，在通过最大化期望效用确定下一个最优位置时，我们需要一个设计得当的效用函数。等价地，策略采取的每个动作都是为了最大化期望效用的改进。此过程持续进行，直到触发停止规则，此时使用\
  \ ![$$ u\\left({\\mathcal{D}}_N\\right) $$](img/527334_1_En_3_Chapter_TeX_IEq18.png)\
  \ 来评估最终返回数据集 ![$$ {\\mathcal{D}}_N $$](img/527334_1_En_3_Chapter_TeX_IEq17.png)\
  \ 的质量。\n\n由于我们关注的是最优的单步前瞻动作，上述问题可以表述为最大化效用的*期望边际增益*，该增益作为采集函数来指导搜索。因此，使用期望边际增益的单步前瞻策略定义如下：\n\
  \n![$$ {\\alpha}_1\\left({x}_{n+1};{\\mathcal{D}}_n\\right)={\\mathbbm{E}}_{y_{n+1}}\\\
  left[u\\left({\\mathcal{D}}_{n+1}\\right)|{x}_{n+1},{\\mathcal{D}}_n\\right]-\\\
  mathbbm{E}\\left[u\\left({\\mathcal{D}}_n\\right)\\right] $$](images/527334_1_En_3_Chapter/527334_1_En_3_Chapter_TeX_Equd.png)\n\
  \n![$$ ={\\mathbbm{E}}_{y_{n+1}}\\left[u\\left({x}_{n+1},{y}_{n+1},{\\mathcal{D}}_n\\\
  right)|{x}_{n+1},{\\mathcal{D}}_n\\right]-u\\left({\\mathcal{D}}_n\\right) $$](images/527334_1_En_3_Chapter/527334_1_En_3_Chapter_TeX_Eque.png)\n\
  \n其中 ![$$ {\\alpha}_1\\left({x}_{n+1};{\\mathcal{D}}_n\\right) $$](img/527334_1_En_3_Chapter_TeX_IEq19.png)\
  \ 中的下标 1 表示向未来前瞻的步数。第二步成立是因为现有观测值的效用 ![$$ u\\left({\\mathcal{D}}_n\\right) $$](img/527334_1_En_3_Chapter_TeX_IEq20.png)\
  \ 不存在随机性。\n\n使用单步前瞻策略的最优动作随后被定义为期望边际增益的最大化者：\n\n![$$ {x}_{n+1}^{\\ast }={\\textrm{argmax}}_{x_{n+1}\\\
  in A}{\\alpha}_1\\left({x}_{n+1};{\\mathcal{D}}_n\\right) $$](img/527334_1_En_3_Chapter_TeX_Equf.png)\n\
  \n图 3-3 说明了这一过程。我们以已收集观测值的效用 ![$$ u\\left({\\mathcal{D}}_n\\right) $$](img/527334_1_En_3_Chapter_TeX_IEq21.png)\
  \ 作为基准，用于比较评估新候选位置处的期望边际增益。该评估需要基于更新后的高斯过程后验考虑下一次观测的所有可能值，从而得到期望效用项 ![$$ {\\mathbbm{E}}_{y_{n+1}}\\\
  left[u\\left({x}_{n+1},{y}_{n+1},{\\mathcal{D}}_n\\right)|{x}_{n+1},{\\mathcal{D}}_n\\\
  right] $$](images/527334_1_En_3_Chapter/527334_1_En_3_Chapter_TeX_IEq22.png)。由于我们考虑的是未来的一步，采集函数\
  \ ![$$ {\\alpha}_1\\left({x}_{n+1};{\\mathcal{D}}_n\\right) $$](img/527334_1_En_3_Chapter_TeX_IEq23.png)\
  \ 就变成了单步前瞻策略，我们的目标是选择能够最大化已收集数据集效用期望边际增益的位置。\n\n![](img/527334_1_En_3_Fig3_HTML.jpg)\n\
  \n一组方程指示了其周围的以下步骤：评估任意候选采样位置；基于高斯过程后验信念的推测观测值；构建一个更大的虚构数据集；计算如果我们在候选位置采样时的期望效用；现有效用和现有数据集；效用的期望边际增益；通过最大化特定的单步前瞻采集函数来选择最优动作。\n\
  \n图 3-3\n通过最大化已获取观测值效用的期望边际增益来推导单步前瞻策略\n\n\n\n### 多步前瞻策略\n\n采用单步前瞻策略的序贯决策过程是一种强大且应用广泛的技术。通过模拟如果我们收集另一个观测值可能产生的未来路径，该策略因最大化扩增人工数据集中效用的单步期望边际增益而成为贝叶斯最优策略。然而，优化过程将持续进行，直到搜索预算耗尽时达到终止点。后续采样位置的选择，即\
  \ ![$$ {x}_{n+1}^{\\ast }={\\textrm{argmax}}_{x_{n+1}\\in A}{\\alpha}_1\\left({x}_{n+1};{\\\
  mathcal{D}}_n\\right) $$](img/527334_1_En_3_Chapter_TeX_IEq24.png)，因此会影响所有剩余的优化决策。也就是说，我们需要考虑直到停止规则触发为止的所有未来采样步骤，而不仅仅是未来的一步。\n\
  \n为了更清晰地阐述，我们假设*前瞻范围*，即未来需要考虑的步数，为 *τ*。换句话说，我们考虑一个假设的数据集 ![$$ {\\mathcal{D}}_{n+\\\
  tau } $$](img/527334_1_En_3_Chapter_TeX_IEq25.png)，该数据集在现有数据集 ![$$ {\\mathcal{D}}_n\
  \ $$](img/527334_1_En_3_Chapter_TeX_IEq26.png) 的基础上增加了 *τ* 个人工观测值。每个观测值都涉及选择一个候选搜索位置\
  \ *x* 并获取相应的观测值 *y*，该观测值被建模为一个随机变量，其后验分布基于先前的观测值（包括现有的和假设的）进行更新。通过将每次添加的位置和观测值表示为一个对\
  \ (*x*, *y*)，*τ* 步前瞻数据集 ![$$ {\\mathcal{D}}_{n+\\tau } $$](img/527334_1_En_3_Chapter_TeX_IEq27.png)\
  \ 可以写为：\n\n![$$ {\\mathcal{D}}_{n+\\tau }={\\mathcal{D}}_n\\cup \\left\\{\\left({x}_{n+1},{y}_{n+1}\\\
  right)\\right\\}\\cup \\left\\{\\left({x}_{n+2},{y}_{n+2}\\right)\\right\\}\\cup\
  \ \\dots \\cup \\left\\{\\left({x}_{n+\\tau },{y}_{n+\\tau}\\right)\\right\\} $$](img/527334_1_En_3_Chapter_TeX_Equg.png)\n\
  \n遵循与之前相同的机制，多步前瞻策略将通过最大化期望的长期终端效用 ![$$ \\mathbbm{E}\\left[u\\left({\\mathcal{D}}_{n+\\\
  tau}\\right)\\right] $$](images/527334_1_En_3_Chapter/527334_1_En_3_Chapter_TeX_IEq29.png)\
  \ 来对 ![$$ {x}_{n+1}^{\\ast } $$](img/527334_1_En_3_Chapter_TeX_IEq28.png) 做出最优采样决策：\n\
  \n![$$ {x}_{n+1}^{\\ast }={\\textrm{argmax}}_{x\\in A}\\mathbbm{E}\\left[u\\left({\\\
  mathcal{D}}_{n+\\tau}\\right)|{x}_{n+1},{\\mathcal{D}}_n\\right] $$](images/527334_1_En_3_Chapter/527334_1_En_3_Chapter_TeX_Equh.png)\n\
  \n其中，期望是针对未来位置和观测值的随机性而取的。等价地，我们可以依赖于如下定义的终端期望边际增益：\n\n![$$ {\\alpha}_{\\tau}\\\
  left({x}_{n+1};{\\mathcal{D}}_n\\right)=\\mathbbm{E}\\left[u\\left({\\mathcal{D}}_{n+\\\
  tau}\\right)|{x}_{n+1},{\\mathcal{D}}_n\\right]-u\\left({\\mathcal{D}}_n\\right)\
  \ $$](images/527334_1_En_3_Chapter/527334_1_En_3_Chapter_TeX_Equi.png)\n\n该函数作为多步前瞻采集函数，用于支持最优序贯优化：\n\
  \n![$$ {x}_{n+1}^{\\ast }={\\textrm{argmax}}_{x_{n+1}\\in A}{\\alpha}_{\\tau}\\\
  left({x}_{n+1};{\\mathcal{D}}_n\\right) $$](img/527334_1_En_3_Chapter_TeX_Equj.png)\n\
  \n与单独最大化期望终端效用 ![$$ \\mathbbm{E}\\left[u\\left({\\mathcal{D}}_{n+\\tau}\\right)|x,{\\\
  mathcal{D}}_n\\right] $$](images/527334_1_En_3_Chapter/527334_1_En_3_Chapter_TeX_IEq31.png)\
  \ 相比，该定义仅向下平移了一个常数值 ![$$ u\\left({\\mathcal{D}}_n\\right) $$](img/527334_1_En_3_Chapter_TeX_IEq30.png)。\n\
  \n现在，如果我们展开 ![$$ {\\alpha}_{\\tau}\\left({x}_{n+1};{\\mathcal{D}}_n\\right) $$](img/527334_1_En_3_Chapter_TeX_IEq32.png)\
  \ 定义中的期望，我们需要考虑未来 *τ* 步中关于位置 {*x*[*n* + *i*], *i* = 2, …, *τ*} 的所有可能演化决策，以及随机变量\
  \ {*y*[*n* + *i*], *i* = 1, …, *τ*} 的相关实现。这里，关于位置 {*x*[*n* + *i*], *i* = 2, …, *τ*}\
  \ 的决策从 *i* = 2 开始，是因为我们正在评估位置 *x*[*n* + 1]。我们可以将终端期望边际增益的展开形式写为：\n\n![$$ {\\alpha}_{\\\
  tau}\\left({x}_{n+1};{\\mathcal{D}}_n\\right)=\\int \\dots \\int u\\left({\\mathcal{D}}_{n+\\\
  tau}\\right)p\\left({y}_{n+1}|{x}_{n+1},{\\mathcal{D}}_n\\right)\\prod \\limits_{i=2}^{\\\
  tau }p\\left({x}_{n+i},{y}_{n+i}|{\\mathcal{D}}_{n+i-1}\\right)d{y}_{n+1}d\\left\\\
  {\\left({x}_{n+i},{y}_{n+i}\\right)\\right\\}-u\\left({\\mathcal{D}}_n\\right) $$](img/527334_1_En_3_Chapter_TeX_Equk.png)\n\
  \n其中，我们明确地将 *y*[*n* + 1] 的后验概率分布写为 ![$$ p\\left({y}_{n+1}|{x}_{n+1},{\\mathcal{D}}_n\\\
  right) $$](img/527334_1_En_3_Chapter_TeX_IEq33.png，并将 {(*x*[*n* + *i*], *y*[*n* + *i*]),\
  \ *i* = 2, …, *τ*} 的后续联合概率分布写为 ![$$ {\\prod}_{i=2}^{\\tau }p\\left({x}_{n+i},{y}_{n+i}|{\\\
  mathcal{D}}_{n+i-1}\\right) $$](img/527334_1_En_3_Chapter_TeX_IEq34.png)。对这些随机变量进行积分，将得到返回数据集的期望效用中最终的多步前瞻边际增益。\n\
  \n图 3-4 总结了推导多步前瞻采集函数的过程。请注意，{(*x*[*n* + *i*], *y*[*n* + *i*]), *i* = 2, …, *τ*}\
  \ 中下一轮候选位置和观测值的模拟，依赖于所有先前累积的数据集 ![$$ {\\mathcal{D}}_{n+i-1} $$](img/527334_1_En_3_Chapter_TeX_IEq35.png)，该数据集用于基于观测值和假设值构建更新的后验信念。\n\
  \n![](img/527334_1_En_3_Fig4_HTML.jpg)\n\n一个方程表示多个步骤，从终端数据集开始，经过假设收集到的数据集是无噪声的、被建模为随机变量的人工位置和观测值集合、多步前瞻采集函数，以及对未来位置和观测值的随机性进行积分，最终做出最优行动以最大化多步前瞻采集函数。\n\
  \n图 3-4\n\n多步前瞻最优策略，通过最大化终端数据集的边际期望效用来选择最佳采样位置\n\n通过梳理嵌套的期望和最大化操作序列，我们可以更深入地了解计算该表达式的过程。如图\
  \ 3-5 所示，我们从最大化算子中的下一个采样位置 *x*[*n* + 1] 开始，然后是期望算子中的 *y*[*n* + 1]。相同的模式在后续阶段继续，在\
  \ *x*[*n* + 2] 处有一个最大化算子，在 *y*[*n* + 2] 处有一个期望算子，依此类推，直到最后阶段到达假设的观测值 *y*[*n* + *τ*]。每个算子，无论是最大化还是期望，都涉及多个分支。常见的策略是通过标准程序（如\
  \ L-BFGS）求解最大化操作，并通过高斯求积法近似期望操作。\n\n![](img/527334_1_En_3_Fig5_HTML.jpg)\n\n\n\n\
  一个方程表示变量 x 的上标星号、下标 n+1 的值，该值等于多个变量的积分。底部的图表在方框中表示 x 下标 n+1、x 下标 n+2，直至 x 下标 n+τ，并在圆形中表示\
  \ y 下标 n+1、y 下标 n+2，直至 y 下标 n+τ。该值返回 u，括号内为 D 下标 n+τ。\n\n图 3-5\n\n可视化嵌套的最大化与期望算子\n\
  \n显然，计算一个考虑所有可能未来路径的嵌套期望形式在计算上具有挑战性。此外，由于我们的目标是通过最大化采集函数来选择最优采样动作，我们将添加一个合理的假设：在给定当前数据集的情况下，所有未来的动作也将是最优的，该数据集可能包含目标值上随机变量的假定实现。添加最优性条件意味着，我们不再考虑\
  \ {(*x*[*n* + *i*], *y*[*n* + *i*]), *i* = 1, …, *τ*} 的所有可能未来路径，而只关注最优路径 ![$$ \\\
  left\\{\\left({x}_{n+i}^{\\ast },{y}_{n+i}\\right),i=1,\\dots, \\tau \\right\\}\
  \ $$](img/527334_1_En_3_Chapter_TeX_IEq36.png)，这实质上通过选择最大化位置来消除对候选位置的依赖。通过最大化长期期望效用增益来选择最优动作的论点遵循**贝尔曼最优性原理**，如下一节所述。\n\
  \n### 贝尔曼最优性原理\n\n贝尔曼最优性原理指出，一系列最优决策始于做出第一个最优决策，随后是一系列基于先前结果的最优决策。这是一个递归表达式，为了在当前时间点做出最优动作，我们需要在未来也做出最优动作。\n\
  \n让我们从之前的多步前瞻采集函数开始构建。回顾一下，在候选位置 *x*[*n* + 1] 处的 *τ* 步期望边际效用增益定义为\n\n![$$ {\\alpha}_{\\\
  tau}\\left({x}_{n+1};{\\mathcal{D}}_n\\right)=\\mathbbm{E}\\left[u\\left({\\mathcal{D}}_{n+\\\
  tau}\\right)|{x}_{n+1},{\\mathcal{D}}_n\\right]-u\\left({\\mathcal{D}}_n\\right)\
  \ $$](images/527334_1_En_3_Chapter/527334_1_En_3_Chapter_TeX_Equl.png)\n\n这是我们寻求最大化的目标。为了明确地将一步前瞻采集函数与未来剩余的\
  \ *τ* − 1 步模拟联系起来，我们可以通过在期望中加减这一项来引入一步效用 ![$$ u\\left({\\mathcal{D}}_{n+1}\\right)\
  \ $$](img/527334_1_En_3_Chapter_TeX_IEq37.png)，如下所示：\n\n![$$ {\\alpha}_{\\tau}\\\
  left({x}_{n+1};{\\mathcal{D}}_n\\right)=\\mathbbm{E}\\left[u\\left({\\mathcal{D}}_{n+\\\
  tau}\\right)|{x}_{n+1},{\\mathcal{D}}_n\\right]-u\\left({\\mathcal{D}}_n\\right)=\\\
  mathbbm{E}\\left[u\\left({\\mathcal{D}}_{n+\\tau}\\right)-u\\left({\\mathcal{D}}_{n+1}\\\
  right)+u\\left({\\mathcal{D}}_{n+1}\\right)|{x}_{n+1},{\\mathcal{D}}_n\\right]-u\\\
  left({\\mathcal{D}}_n\\right)=\\left(\\mathbbm{E}\\left[u\\left({\\mathcal{D}}_{n+1}\\\
  right)|{x}_{n+1},{\\mathcal{D}}_n\\right]-u\\left({\\mathcal{D}}_n\\right)\\right)+\\\
  mathbbm{E}\\left[u\\left({\\mathcal{D}}_{n+\\tau}\\right)-u\\left({\\mathcal{D}}_{n+1}\\\
  right)|{x}_{n+1},{\\mathcal{D}}_n\\right]={\\alpha}_1\\left({x}_{n+1};{\\mathcal{D}}_n\\\
  right)+\\mathbbm{E}\\left[{\\alpha}_{\\tau -1}\\left({x}_{n+2};{\\mathcal{D}}_{n+1}\\\
  right)|{x}_{n+1},{\\mathcal{D}}_n\\right] $$](images/527334_1_En_3_Chapter/527334_1_En_3_Chapter_TeX_Equm.png)\n\
  \n在这里，我们将长期期望边际效用增益分解为即时的一步前瞻效用增益与剩余 *τ* − 1 步的期望前瞻增益之和。\n\n现在，根据贝尔曼最优性原理，所有剩余的\
  \ *τ* − 1 个动作都将被最优地执行。这意味着在计算 ![$$ {\\alpha}_{\\tau -1}\\left({x}_{n+2};{\\mathcal{D}}_{n+1}\\\
  right) $$](img/527334_1_En_3_Chapter_TeX_IEq38.png) 时，我们不再评估 *x*[*n* + 2] 的每个候选位置，而只关注具有最大值的那个位置，即\
  \ ![$$ {\\alpha}_{\\tau -1}\\left({x}_{n+2}^{\\ast };{\\mathcal{D}}_{n+1}\\right)\
  \ $$](img/527334_1_En_3_Chapter_TeX_IEq39.png)，或者等价地 ![$$ {\\alpha}_{\\tau -1}^{\\\
  ast}\\left({\\mathcal{D}}_{n+1}\\right) $$](img/527334_1_En_3_Chapter_TeX_IEq40.png)，从而消除对位置\
  \ *x*[*n* + 2] 的依赖。因此，在最优性假设下的多步前瞻采集函数变为\n\n![$$ {\\alpha}_{\\tau}\\left({x}_{n+1};{\\\
  mathcal{D}}_n\\right)={\\alpha}_1\\left({x}_{n+1};{\\mathcal{D}}_n\\right)+\\mathbbm{E}\\\
  left[{\\alpha}_{\\tau -1}^{\\ast}\\left({\\mathcal{D}}_{n+1}\\right)|{x}_{n+1},{\\\
  mathcal{D}}_n\\right] $$](images/527334_1_En_3_Chapter/527334_1_En_3_Chapter_TeX_Equn.png)\n\
  \n如前一节所示，使用多步前瞻采集函数的最优下一个采样位置 ![$$ {x}_{n+1}^{\\ast } $$](img/527334_1_En_3_Chapter_TeX_IEq41.png)\
  \ 因此通过最大化 ![$$ {\\alpha}_{\\tau}\\left({x}_{n+1};{\\mathcal{D}}_n\\right) $$](img/527334_1_En_3_Chapter_TeX_IEq42.png)\
  \ 来确定。因此，最优多步前瞻采集函数 ![$$ {\\alpha}_{\\tau}^{\\ast}\\left({x}_{n+1};{\\mathcal{D}}_n\\\
  right) $$](img/527334_1_En_3_Chapter_TeX_IEq43.png) 定义为\n\n\n\n![$$ {\\alpha}_{\\\
  tau}^{\\ast}\\left({x}_{n+1};{\\mathcal{D}}_n\\right)=\\underset{x_{\\textrm{n}+1}\\\
  in A}{\\max }{\\alpha}_{\\tau}\\left({x}_{n+1};{\\mathcal{D}}_n\\right) $$](img/527334_1_En_3_Chapter_TeX_Equo.png)\n\
  \n代入 ![$$ {\\alpha}_{\\tau}\\left({x}_{n+1};{\\mathcal{D}}_n\\right) $$](img/527334_1_En_3_Chapter_TeX_IEq44.png)\
  \ 的定义可得\n\n![$$ {\\alpha}_{\\tau}^{\\ast}\\left({x}_{n+1};{\\mathcal{D}}_n\\right)=\\\
  underset{x_{n+1}\\in A}{\\max}\\left\\{{\\alpha}_1\\left({x}_{n+1};{\\mathcal{D}}_n\\\
  right)+\\mathbbm{E}\\left[{\\alpha}_{\\tau -1}^{\\ast}\\left({\\mathcal{D}}_{n+1}\\\
  right)|{x}_{n+1},{\\mathcal{D}}_n\\right]\\right\\}=\\underset{x_{n+1}\\in A}{\\\
  max}\\left\\{{\\alpha}_1\\left({x}_{n+1};{\\mathcal{D}}_n\\right)+\\mathbbm{E}\\\
  left[\\underset{x_{n+2}\\in A}{\\max }{\\alpha}_{\\tau -1}\\left({x}_{n+2};{\\mathcal{D}}_{n+1}\\\
  right)|{x}_{n+1},{\\mathcal{D}}_n\\right]\\right\\} $$](images/527334_1_En_3_Chapter/527334_1_En_3_Chapter_TeX_Equp.png)\n\
  \n其中，我们也代入了 ![$$ {\\alpha}_{\\tau -1}^{\\ast}\\left({\\mathcal{D}}_{n+1}\\right)\
  \ $$](img/527334_1_En_3_Chapter_TeX_IEq45.png) 的定义，以将最优策略值 ![$$ {\\alpha}_{\\tau}^{\\\
  ast}\\left({x}_{n+1};{\\mathcal{D}}_n\\right) $$](img/527334_1_En_3_Chapter_TeX_IEq46.png)\
  \ 明确表示为一连串嵌套的最大化和期望运算。这种递归定义被称为*贝尔曼方程*，它明确反映了做出最优行动的前提是所有后续行动也必须最优。\n\n图 3-6 总结了多步前瞻策略的贝尔曼方程推导过程。同样，计算最优策略值需要计算未来子策略的期望最优值。由于该过程本质上是递归的，计算当前采集函数可以通过反向计算来实现，即从最终步骤开始，逆向执行计算。然而，随着前瞻范围的扩大，这仍然会带来指数级增长的计算负担。\n\
  \n![](img/527334_1_En_3_Fig6_HTML.jpg)\n\n一组方程的多步示意图。图中标注了 3 个要点，分别表示：将多步前瞻策略表示为即时采集函数之和、利用贝尔曼最优性原理切换到最大后续行动、以及将最优多步前瞻策略表示为遵循贝尔曼方程的一系列嵌套最大化和期望运算。\n\
  \n图 3-6\n\n说明多步前瞻策略的贝尔曼方程推导过程，其中最优策略被表示为一连串最大化和期望运算，假设所有后续行动都必须最优，以便在当前步骤做出最优行动。\n\
  \n我们将在本书后面介绍加速计算这个*动态规划*问题的几种技巧，这里仅重点介绍两种常见方法。一种方法称为有限前瞻，它限制了未来的前瞻步数。另一种方法是使用基于基础策略的展开方法，它将最大化算子简化为一种快速的启发式计算。这两种方法都称为近似动态规划方法，如图\
  \ 3-7 所示。关于此主题的更多讨论，请参阅 Roman Garnett 近期出版的著作《贝叶斯优化》。\n\n![](img/527334_1_En_3_Fig7_HTML.jpg)\n\
  \n一组两幅插图。上方一幅表示有限前瞻，下方一幅表示基于基础策略或启发式策略的展开。\n\n图 3-7\n\n两种常用于计算多步前瞻贝叶斯优化策略的近似动态规划方法\n\
  \n在下一节中，我们将介绍期望改进采集函数，这是实际贝叶斯优化应用中使用最广泛且经验表现最佳的采集函数。\n\n\n\n## 期望提升\n\n采集函数在多个方面有所不同，包括效用函数的选择、前瞻步数、风险厌恶或偏好程度等。引入风险偏好直接受益于对潜在目标函数的后验信念。在以高斯过程回归作为代理模型的情况下，风险通过协方差函数进行量化，其置信区间表达了目标函数可能取值的不确定性程度。\n\
  \n关于已收集观测值的效用，期望提升在选择额外采样点时，将已观测到的最大值作为比较基准。它还隐含地假设在优化过程终止前只剩一次采样。效用的期望边际增益（即采集函数）就变成了最大观测值的期望提升，其计算方式为：在任意采样点进行额外采样后，观测到的最大值与新观测值之间的期望差值。\n\
  \n这些假设使得期望提升成为一种单步前瞻的采集函数，由于其前瞻视野较短，也被称为*短视*。此外，由于使用了后验分布的期望，期望提升也被认为是*风险中性*的，忽略了整个域上的不确定性估计。\n\
  \n具体来说，令 *y*[1 : *n*] = {*y*[1], …, *y*[*n*]} 为在对应位置 *x*[1 : *n*] = {*x*[1], …,\
  \ *x*[*n*]} 处收集到的观测值集合。在无噪声设定下，实际观测值是精确的，即 *y*[1 : *n*] = *f*[1 : *n*]。给定已收集的数据集\
  \ ![$$ {\\mathcal{D}}_n=\\left\\{{x}_{1:n},{y}_{1:n}\\right\\} $$](img/527334_1_En_3_Chapter_TeX_IEq47.png)，相应的效用为\
  \ ![$$ u\\left({\\mathcal{D}}_n\\right)=\\max \\left\\{{f}_{1:n}\\right\\}={f}_n^{\\\
  ast } $$](img/527334_1_En_3_Chapter_TeX_IEq48.png)，其中 ![$$ {f}_n^{\\ast } $$](img/527334_1_En_3_Chapter_TeX_IEq49.png)\
  \ 是迄今为止观测到的当前最优值。类似地，假设我们在新位置 *x*[*n* + 1] 处获得另一个观测值 *y*[*n* + 1] = *f*[*n* + 1]，则由此产生的效用为\
  \ ![$$ u\\left({\\mathcal{D}}_{n+1}\\right)=u\\left({\\mathcal{D}}_n\\cup \\left\\\
  {{x}_{n+1},{f}_{n+1}\\right\\}\\right)=\\max \\left\\{{f}_{n+1},{f}_n^{\\ast}\\\
  right\\} $$](img/527334_1_En_3_Chapter_TeX_IEq50.png)。取这两个效用的差值，即可得到因增加一个观测值而带来的效用增量：\n\
  \n![$$ u\\left({\\mathcal{D}}_{n+1}\\right)-u\\left({\\mathcal{D}}_n\\right)=\\\
  max \\left\\{{f}_{n+1},{f}_n^{\\ast}\\right\\}-{f}_n^{\\ast }=\\max \\left\\{{f}_{n+1}-{f}_n^{\\\
  ast },0\\right\\} $$](img/527334_1_En_3_Chapter_TeX_Equq.png)\n\n上式返回了当 ![$$ {f}_{n+1}\\\
  ge {f}_n^{\\ast } $$](img/527334_1_En_3_Chapter_TeX_IEq51.png) 时当前最优值的边际增量，否则为零，这是观测到\
  \ *f*[*n* + 1] 的结果。熟悉神经网络中激活函数的读者会立刻将这种形式与 ReLU（修正线性单元）函数联系起来，该函数保留正信号，抑制负信号。\n\n\
  由于 *y*[*n* + 1] 具有随机性，我们可以引入期望算子对其进行积分，从而得到效用的期望边际增益，即期望提升采集函数：\n\n![$$ {\\alpha}_{EI}\\\
  left({x}_{n+1};{\\mathcal{D}}_n\\right)=\\mathbbm{E}\\left[u\\left({\\mathcal{D}}_{n+1}\\\
  right)-u\\left({\\mathcal{D}}_n\\right)|{x}_{n+1},{\\mathcal{D}}_n\\right]\\kern7em\
  \ =\\int \\max \\left\\{{f}_{n+1}-{f}_n^{\\ast },0\\right\\}p\\left({f}_{n+1}|{x}_{n+1},{\\\
  mathcal{D}}_n\\right)d{f}_{n+1} $$](images/527334_1_En_3_Chapter/527334_1_En_3_Chapter_TeX_Equr.png)\n\
  \n在高斯过程回归的框架下，我们可以得到期望提升采集函数的闭式表达式，如下一节所示。\n\n### 推导闭式表达式\n\n期望提升采集函数具有一个方便的闭式表达式，这可以显著加速其计算。推导闭式表达式需要用到从标准正态变量到任意正态变量的尺度-位置变换，这在之前的章节中已经介绍过。这也被称为*重参数化技巧*，因为我们可以将感兴趣的对象转换为标准正态变量，以简化数学分析和实际计算。\n\
  \n精确地说，由于候选位置 *x*[*n* + 1] 处的观测值 *f*[*n* + 1] 服从均值为 *μ*[*n* + 1]、方差为 ![$$ {\\sigma}_{n+1}²\
  \ $$](img/527334_1_En_3_Chapter_TeX_IEq52.png) 的正态分布，记作 ![$$ {f}_{n+1}\\sim N\\\
  left({f}_{n+1};{\\mu}_{n+1},{\\sigma}_{n+1}²\\right) $$](img/527334_1_En_3_Chapter_TeX_IEq53.png)，我们可以将其重参数化为\
  \ *f*[*n* + 1] = *μ*[*n* + 1] + *σ*[*n* + 1]*ε*，其中 *ε*~*N*(*ε*; 0, 1)。\n\n图 3-8\
  \ 给出了完整的推导过程，其中涉及一些技术细节，例如期望的线性性质、分部积分、标准正态分布和累积标准正态分布，以及微分中的变量替换。假设 ![$$ {\\sigma}_{n+1}²&gt;0\
  \ $$](img/527334_1_En_3_Chapter_TeX_IEq54.png)，该过程首先将 max 算子转换为积分，然后将其分离为两个不同且易于计算的部分。这两个部分分别对应于利用和探索。利用意味着继续在具有高后验均值的已观测区域附近采样，而探索则鼓励在未访问的、后验不确定性高的区域采样。因此，期望提升采集函数隐式地平衡了这两种相反的力量。\n\
  \n![](img/527334_1_En_3_Fig8_HTML.jpg)\n\n一幅插图展示了一组方程，并指出了名为期望提升采集函数的点，通过引入后验分布展开期望算子，应用重参数化技巧，拆分为两部分，以及改变积分计算的基础，以及其他要点。\n\
  \n图 3-8\n\n推导期望提升的闭式表达式，该表达式自动平衡了基于现有知识对有希望区域的利用和对不确定区域的探索\n\n为了进一步建立后验参数（*μ*[*n* + 1]\
  \ 和 ![$$ {\\sigma}_{n+1}² $$](img/527334_1_En_3_Chapter_TeX_IEq55.png)）与期望提升值之间的单调关系，我们可以检查各自的偏导数。具体来说，我们有：\n\
  \n![$$ \\frac{\\partial }{\\partial {\\mu}_{n+1}}{\\alpha}_{EI}\\left({x}_{n+1};{\\\
  mathcal{D}}_n\\right)=\\Phi \\left(\\frac{\\mu_{n+1}-{f}^{\\ast }}{\\sigma_{n+1}}\\\
  right)&gt;0 $$](img/527334_1_En_3_Chapter_TeX_Equs.png)\n\n![$$ \\frac{\\partial\
  \ }{\\partial {\\sigma}_{n+1}}{\\alpha}_{EI}\\left({x}_{n+1};{\\mathcal{D}}_n\\\
  right)=\\phi \\left(\\frac{\\mu_{n+1}-{f}^{\\ast }}{\\sigma_{n+1}}\\right)&gt;0\
  \ $$](img/527334_1_En_3_Chapter_TeX_Equt.png)\n\n由于期望提升关于 *μ*[*n* + 1] 和 *σ*[*n* + 1]\
  \ 的偏导数均为正，任一参数的增加都会导致期望提升值更高，从而在高斯过程回归框架下完成了利用与探索之间的自动权衡。\n\n\n\n同样值得注意的是，当后验均值函数经过观测点时，*σ*[*n*\
  \ + 1] = 0 成立。在这种情况下，我们有 ![$$ {\\alpha}_{EI}\\left({x}_{n+1};{\\mathcal{D}}_n\\\
  right)=0 $$](img/527334_1_En_3_Chapter_TeX_IEq56.png)。此外，在实际实现中，通常会引入一个超参数 *ξ* 来控制探索程度。通过从上述闭式表达式的\
  \ ![$$ {\\mu}_{n+1}-{f}_n^{\\ast } $$](img/527334_1_En_3_Chapter_TeX_IEq57.png)\
  \ 中减去 *ξ*，后验均值 *μ*[*n* + 1] 对整体改进的影响将小于后验标准差 *σ*[*n* + 1]。因此，期望改进采集函数的闭式表达式变为：\n\
  \n![$$ {\\alpha}_{EI}\\left({x}_{n+1};{\\mathcal{D}}_n\\right)=\\left\\{\\begin{array}{c}\\\
  left({\\mu}_{n+1}-{f}_n^{\\ast }-\\xi \\right)\\Phi \\left({z}_{n+1}\\right)+{\\\
  sigma}_{n+1}\\phi \\left({z}_{n+1}\\right);\\kern0.5em {\\sigma}_{n+1}&gt;0\\\\\
  \ {}0;\\kern0.5em {\\sigma}_{n+1}=0\\end{array}\\right. $$](img/527334_1_En_3_Chapter_TeX_Equu.png)\n\
  \n其中\n\n![$$ {z}_{n+1}=\\left\\{\\begin{array}{c}\\frac{\\mu_{n+1}-{f}^{\\ast }-\\\
  xi }{\\sigma_{n+1}};{\\sigma}_{n+1}&gt;0\\\\ {}0;{\\sigma}_{n+1}=0\\end{array}\\\
  right. $$](img/527334_1_En_3_Chapter_TeX_Equv.png)\n\n下一节将实现期望改进采集函数，并用它来寻找合成测试函数的全局最优解。\n\
  \n### 实现期望改进\n\n在本节中，我们将首先基于纯 NumPy 和 SciPy 包从头实现期望改进采集函数，然后使用现成的 BO 包完成相同任务。真实的底层目标函数会提供给我们用于比较，但对优化器不可见，优化器的目标是从可能带有噪声的样本中逼近该目标函数。代码改编自\
  \ Martin Krasser 的教程博客（[`http://krasserm.github.io/2018/03/21/bayesian-optimization/#Optimization-algorithm`](http://krasserm.github.io/2018/03/21/bayesian-optimization/%2523Optimization-algorithm)）。\n\
  \n首先，我们将导入一些包来搭建环境：从 scikit-learn 导入高斯过程回归包，从 SciPy 导入数值优化包，以及其他用于绘图的工具函数。我们还设置了随机种子以确保结果可复现。\n\
  \n```\nimport numpy as np\nimport random\nimport matplotlib.pyplot as plt\nfrom\
  \ scipy.stats import norm\nfrom scipy.optimize import minimize\nfrom sklearn.gaussian_process\
  \ import GaussianProcessRegressor\nfrom sklearn.gaussian_process.kernels import\
  \ ConstantKernel, Matern\nSEED = 8\nrandom.seed(SEED)\nnp.random.seed(SEED)\n%matplotlib\
  \ inline\n代码清单 3-1\n搭建编码环境\n```\n\n接下来，我们将定义目标函数和搜索域。目标函数在搜索域内任意位置采样时，会提供带有噪声扰动的观测值。它还将用于生成无噪声的观测值，以便在绘图时作为参考。\n\
  \n如下列代码所示，我们根据域的维度从标准正态分布中生成一个随机数，通过 `*` 符号将元组解包为可接受的格式。然后将该值乘以观测模型的预设噪声水平。搜索域在\
  \ `bounds` 中指定为一个嵌套列表，其中内层列表包含每个维度的上下界；在本例中，我们处理的是一个一维搜索域。\n\n```\n# 搜索域的边界\n# 内层列表中的每个元素对应一个维度\n\
  bounds = np.array([[-1.0, 2.0]])\n# 观测噪声\nnoise = 0.2\n# 用于在采样时提供观测值的目标函数，可选地添加噪声\n\
  def f(x, noise=0):\n    # 使用 * 将 x.shape 的元组解包后传入 np.random.randn\n    return -np.sin(3*x)\
  \ - x**2 + 0.7*x + noise*np.random.randn(*x.shape)\n代码清单 3-2\n定义搜索域和目标函数\n```\n\n\
  现在我们可以可视化目标函数，并在 `X_init` 和 `Y_init` 中生成两个随机带噪声的样本，以启动优化过程。请注意，绘制函数是通过在搜索边界内生成密集的网格点/位置\
  \ `X_plot`，计算每个位置对应的无噪声函数值 `Y_plot`，并将这些值平滑连接来完成的，如下列代码所示。\n\n```\n# 初始化时的观测值\n\
  X_init = np.array([[-0.7], [1.6]])\nY_init = f(X_init, noise=noise)\n# 用于绘图的边界内密集网格点\n\
  X_plot = np.arange(bounds[:, 0], bounds[:, 1], 0.01).reshape(-1, 1)\n# 用于绘图的无噪声目标函数值\n\
  Y_plot = f(X_plot, noise=0)\n# 绘制带有噪声观测值的目标函数\nplt.plot(X_plot, Y_plot, 'y--', lw=2,\
  \ label='目标函数')\nplt.plot(X_init, Y_init, 'kx', mew=3, label='初始带噪声样本')\nplt.legend()\n\
  代码清单 3-3\n可视化底层目标函数和初始带噪声样本\n```\n\n结果如图 3-9 所示。请注意，这两个样本被选择为彼此距离足够远。在实践中，良好的初始设计应充分覆盖整个搜索域，以确保在优化开始前有一个良好的高斯过程先验。\n\
  \n![](img/527334_1_En_3_Fig9_HTML.jpg)\n\n\n\n折线图展示了目标函数的变化趋势，并在线上标出了两个初始噪声样本点。y\
  \ 轴范围从-2 到 0.5，x 轴范围从-1 到 2。\n\n图 3-9\n\n可视化底层目标函数与两个初始随机噪声样本\n\n现在，我们将期望提升采集函数定义为采样策略。该函数将每个采样位置输入映射为一个数值标量输出，即效用的预期边际增益。在以下代码清单中，除了`X`中的评估点外，输入还包括先前观测到的位置`X_sample`和值`Y_sample`，以及一个拟合于训练样本的高斯过程回归器`gpr`。此外，我们还引入了超参数`xi`来控制探索程度，其默认值为\
  \ 0.01。\n\n```\ndef expected_improvement(X, X_sample, Y_sample, gpr, xi=0.01):\n\
  # 在提议位置的后验均值和标准差\nmu, sigma = gpr.predict(X, return_std=True)\n# 在观测位置的后验均值\nmu_sample\
  \ = gpr.predict(X_sample)\n# 重塑形状，使每个提议位置对应一个标准差\nsigma = sigma.reshape(-1, 1)\n\
  # 由于噪声存在，使用最大后验均值而非实际观测值\nmu_sample_opt = np.max(mu_sample)\n# 忽略可能出现的除零警告\nwith\
  \ np.errstate(divide='warn'):\n# 若标准差大于 0，计算期望提升\nimp = mu - mu_sample_opt - xi\n\
  Z = imp / sigma\nei = imp * norm.cdf(Z) + sigma * norm.pdf(Z)\n# 若标准差为 0，则设为零\n\
  ei[sigma == 0.0] = 0.0\nreturn ei\n代码清单 3-4\n定义期望提升采集函数\n```\n\n请注意，我们首先代入期望提升的定义，假设提议位置的后验分布标准差非零，然后将标准差为零的条目设为零。由于直接除以零会报错（如在计算`Z\
  \ = imp / sigma`时所需），该计算被移入`np.errstate(divide='warn')`的上下文中。这是一种特殊安排，用于告知 Python\
  \ 暂时忽略此类错误，因为后续会通过`ei[sigma == 0.0] = 0.0`进行处理。\n\n至此，我们可以计算任意候选位置的期望提升值，而我们的目标是找到期望提升值最大的最优位置。为此，我们将使用`SciPy`中`minimize`函数提供的现成优化器“L-BFGS-B”，该优化器利用近似二阶导数来求解给定函数（即期望提升）的最优值。优化过程结束时即可获取最优位置。\n\
  \n以下代码清单定义了一个名为`propose_location()`的函数，该函数总共执行`n_restarts`轮优化以避免局部最优。通过维护一个运行中的最小值`min_val`及其位置`min_x`，每轮优化通过`min_obj()`函数最小化采集函数值的负值来返回一个最优解；最大化正值等价于最小化其负值。最后，我们通过比较优化解来决定是否替换当前的运行最小值及其位置。该函数也完成了贝叶斯优化的*内循环*，如前所述。\n\
  \n```\ndef propose_location(acquisition, X_sample, Y_sample, gpr, bounds, n_restarts=25):\n\
  # 搜索域的维度\ndim = X_sample.shape[1]\n# 临时运行中的最佳最小值\nmin_val = 1\n# 最佳最小值的临时位置\nmin_x\
  \ = None\n# 将任意位置映射到采集函数的负值\ndef min_obj(X):\n# 最小化目标为采集函数的负值\nreturn -acquisition(X.reshape(-1,\
  \ dim), X_sample, Y_sample, gpr)\n# 遍历 n_restart 个不同的随机点，返回最有希望的结果\nfor x0 in np.random.uniform(bounds[:,\
  \ 0], bounds[:, 1], size=(n_restarts, dim)):\n# 使用基于近似二阶导数的现成求解器\nres = minimize(min_obj,\
  \ x0=x0, bounds=bounds, method='L-BFGS-B')\n# 若存在更优解，则替换运行中的最优值\nif res.fun < min_val:\n\
  min_val = res.fun[0]\nmin_x = res.x\nreturn min_x.reshape(-1, 1)\n代码清单 3-5\n通过优化采集函数提议下一个采样点\n\
  ```\n\n在进入贝叶斯优化的外循环以寻求全局最优之前，我们将定义几个实用函数，用于绘制各迭代轮次的策略表现。这包括：`plot_approximation()`函数，用于绘制高斯过程后验均值及\
  \ 95%置信区间，同时展示已收集的样本和目标函数；`plot_acquisition()`函数，用于绘制整个域上的期望提升值及最大值位置；以及`plot_convergence()`函数，用于绘制随优化进行，连续采样点之间的距离和运行中的最优值变化。这三个函数均在以下代码清单中定义。\n\
  \n```\ndef plot_approximation(gpr, X_plot, Y_plot, X_sample, Y_sample,X_next=None,\
  \ show_legend=False):\n# 获取密集网格上的后验均值和标准差\nmu, std = gpr.predict(X_plot, return_std=True)\n\
  # 绘制均值及 95%置信区间\nplt.fill_between(X_plot.ravel(),\nmu.ravel() + 1.96 * std,\nmu.ravel()\
  \ - 1.96 * std,\nalpha=0.1)\nplt.plot(X_plot, Y_plot, 'y--', lw=1, label='无噪声目标函数')\n\
  plt.plot(X_plot, mu, 'b-', lw=1, label='代理函数')\nplt.plot(X_sample, Y_sample, 'kx',\
  \ mew=3, label='含噪声样本')\n# 用垂直线绘制下一个采样位置\nif X_next:\nplt.axvline(x=X_next, ls='--',\
  \ c='k', lw=1)\nif show_legend:\nplt.legend()\ndef plot_acquisition(X_plot, acq_value,\
  \ X_next, show_legend=False):\n# 绘制密集网格上的采集函数值\nplt.plot(X_plot, acq_value, 'r-',\
  \ lw=1, label='采集函数')\n# 用垂直线绘制下一个采样位置\nplt.axvline(x=X_next, ls='--', c='k', lw=1,\
  \ label='下一个采样位置')\nif show_legend:\nplt.legend()\ndef plot_convergence(X_sample,\
  \ Y_sample, n_init=2):\nplt.figure(figsize=(12, 3))\n# 聚焦于优化策略查询的样本\nx = X_sample[n_init:].ravel()\n\
  y = Y_sample[n_init:].ravel()\nr = range(1, len(x)+1)\n# 连续采样位置之间的距离\nx_neighbor_dist\
  \ = [np.abs(a-b) for a, b in zip(x, x[1:])]\n# 截至当前时间点的最佳观测值\ny_max = np.maximum.accumulate(y)\n\
  # 绘制连续采样位置之间的距离\nplt.subplot(1, 2, 1)\nplt.plot(r[1:], x_neighbor_dist, 'bo-')\n\
  plt.xlabel('迭代次数')\nplt.ylabel('距离')\nplt.title('连续 x 值之间的距离')\n# 绘制当前观测最大值的演变过程\n\
  plt.subplot(1, 2, 2)\nplt.plot(r, y_max, 'ro-')\nplt.xlabel('迭代次数')\nplt.ylabel('最佳\
  \ Y 值')\nplt.title('最佳选定样本的值')\n代码清单 3-6\n通过优化采集函数提议下一个采样点\n```\n\n\n\n现在我们可以进入主外循环，通过在每个阶段最大化期望提升来寻找全局最优解。在下面的代码清单中，我们首先实例化一个带有\
  \ Matérn 核的高斯过程回归器，该核接受两个超参数，可以通过最大化观测样本的边际似然来估计。这里我们固定这些超参数以简化流程。该高斯过程回归器还通过 `alpha`\
  \ 参数接受未知的噪声水平，以将噪声纳入观测中。\n\n```\n# 使用 Matern 核的高斯过程作为代理模型\n# 核参数可通过最大似然估计进行优化\n\
  m52 = ConstantKernel(1.0) * Matern(length_scale=1.0, nu=2.5)\n# 指定观测噪声项，假设事先已知\n\
  gpr = GaussianProcessRegressor(kernel=m52, alpha=noise**2)\n# 优化开始前的初始样本\nX_sample\
  \ = X_init\nY_sample = Y_init\n# 优化迭代次数\nn_iter = 20\n# 指定图形尺寸\nplt.figure(figsize=(12,\
  \ n_iter * 3))\nplt.subplots_adjust(hspace=0.4)\n# 优化开始\nfor i in range(n_iter):\n\
  # 根据现有样本更新高斯过程后验\ngpr.fit(X_sample, Y_sample)\n# 从采集函数（期望提升）获取下一个采样点\nX_next = propose_location(expected_improvement,\
  \ X_sample, Y_sample, gpr, bounds)\n# 从目标函数获取下一个带噪声的样本\nY_next = f(X_next, noise)\n\
  # 绘制样本、代理函数、无噪声目标函数及下一个采样位置\nplt.subplot(n_iter, 2, 2 * i + 1)\nplot_approximation(gpr,\
  \ X_plot, Y_plot, X_sample, Y_sample, X_next, show_legend=i==0)\nplt.title(f'迭代\
  \ {i+1}')\nplt.subplot(n_iter, 2, 2 * i + 2)\nplot_acquisition(X_plot, expected_improvement(X_plot,\
  \ X_sample, Y_sample, gpr), X_next, show_legend=i==0)\n# 将新增样本追加到之前的样本中\nX_sample\
  \ = np.vstack((X_sample, X_next))\nY_sample = np.vstack((Y_sample, Y_next))\n代码清单\
  \ 3-7\n主贝叶斯优化循环\n```\n\n这里，我们使用 `X_sample` 和 `Y_sample` 作为运行中的数据集，随着优化持续进行总共 20\
  \ 次迭代，不断加入新增样本。每次迭代包括更新高斯过程后验、定位最大期望提升点、在提议位置进行观测，以及将新增样本纳入训练集。\n\n代码还使用 `plot_approximation()`\
  \ 和 `plot_acquisition()` 生成图表，以展示每次迭代中优化的更多细节。图 3-10 显示了前三次迭代，优化器表现出探索性特征，提议的样本彼此相距较远。换句话说，在使用期望提升采集函数的优化初始阶段，高不确定性的区域会受到鼓励。\n\
  \n![](img/527334_1_En_3_Fig10_HTML.jpg)\n\n一组 6 个折线图，排列成 2 列。左列的图代表 3 次迭代，线条和点分别表示无噪声目标函数、代理函数和带噪声样本。右列的图表示采集函数和下一个采样函数的线条。\n\
  \n图 3-10\n\n绘制前三次迭代，其中基于期望提升的贝叶斯优化在高不确定性区域进行了更多探索\n\n随着优化进行，优化器逐渐解决了远处位置的不确定性，并开始更多地依赖基于现有知识对有希望的区域进行利用。这体现在采样位置集中在目标函数的左侧峰值附近，如图\
  \ 3-11 中最后三次迭代所示。鉴于最后三次采样提议发生在相似位置，我们可以大致感觉到优化过程已经收敛，并且定位全局最大值的任务已成功完成。\n\n![](img/527334_1_En_3_Fig11_HTML.jpg)\n\
  \n一组 6 个折线图，排列成 2 列。左列的图代表第 18、19 和 20 次迭代。右列的图代表在 x 轴上 -0.5 到 0 之间几乎相同点处带有尖峰的平坦线条。\n\
  \n图 3-11\n\n采样位置集中在目标函数左侧峰值，这是优化过程收敛时利用行为的标志\n\n如需查看所有迭代的中间图完整列表，请访问本章附带的笔记本，网址为\
  \ [`https://github.com/jackliu333/bayesian_optimization_theory_and_practice_with_python/blob/main/Chapter_3.ipynb`](https://github.com/jackliu333/bayesian_optimization_theory_and_practice_with_python/blob/main/Chapter_3.ipynb)。\n\
  \n优化完成后，我们可以使用 `plot_convergence()` 函数检查其收敛情况。如图 3-12 左侧图所示，距离越大对应探索越多，这主要发生在优化初始阶段，以及即使优化看似收敛时的第\
  \ 17 和 18 次迭代。这种探索特性由期望提升自动启用，有助于跳出局部最优，以寻找可能更高的全局最优值。这也反映在右侧图中，由于探索，第 17 次迭代获得了更高的值。\n\
  \n![](img/527334_1_En_3_Fig12_HTML.jpg)\n\n一组 2 个图。左侧图表示连续 x 之间的距离，以距离与迭代次数的关系图呈现。线条有多个波峰和波谷。右侧图表示最佳选定样本的值，以最佳\
  \ y 值与迭代次数的关系图呈现。线条呈上升趋势。\n\n图 3-12\n\n绘制优化过程中连续提议位置之间的距离以及最佳选定样本的值\n\n至此，我们已经成功从头实现了使用期望提升的完整贝叶斯优化循环。接下来，我们将介绍几个有助于完成相同任务的贝叶斯优化库。\n\
  \n\n\n### 使用贝叶斯优化库\n\n在本节中，我们将使用两个支持贝叶斯优化的公开 Python 库：`scikit-optimize` 和 `GPyOpt`。这两个包都提供了在指定相关输入参数后执行贝叶斯优化的实用函数。让我们看看如何使用\
  \ `gp_minimize`（`scikit-optimize` 中的一个函数，用于通过高斯过程执行贝叶斯优化）来优化与之前相同的函数。\n\n在下面的代码清单中，我们为高斯过程实例\
  \ `gpr` 指定了相同的核函数和超参数设置，以及提供带噪声样本的函数 `f`、搜索边界 `dimensions`、采集函数 `acq_func`、初始样本、探索与利用权衡参数\
  \ `xi`、迭代次数 `n_calls`，以及 `x0` 和 `y0` 中的初始样本。在优化结束时，我们展示了近似图，以观察所提议样本的位置。\n\n```\n\
  from sklearn.base import clone\nfrom skopt import gp_minimize\nfrom skopt.learning\
  \ import GaussianProcessRegressor\nfrom skopt.learning.gaussian_process.kernels\
  \ import ConstantKernel, Matern\n# 使用自定义核函数和估计器以匹配之前的示例\nm52 = ConstantKernel(1.0)\
  \ * Matern(length_scale=1.0, nu=2.5)\ng = GaussianProcessRegressor(kernel=m52, alpha=noise**2)\n\
  # 开始贝叶斯优化\nr = gp_minimize(func=lambda x: -f(np.array(x), noise=noise)[0], # 要最小化的函数\n\
  dimensions=bounds.tolist(),    # 搜索边界\nbase_estimator=gpr, # 高斯过程先验\nacq_func='EI',\
  \      # 期望改进\nxi=0.01,            # 探索-利用权衡\nn_calls=n_iter,     # 迭代次数\nn_initial_points=0,\
  \ # 提供了初始样本\nx0=X_init.tolist(), # 初始样本\ny0=-Y_init.ravel())\n# 为绘图拟合高斯过程模型到样本\n\
  gpr.fit(r.x_iters, -r.func_vals)\n# 绘制拟合模型和带噪声的样本\nplot_approximation(gpr, X_plot,\
  \ Y_plot, r.x_iters, -r.func_vals, show_legend=True)\n代码清单 3-8\n使用 scikit-optimize\
  \ 进行贝叶斯优化\n```\n\n运行上述代码将生成图 3-13，该图显示了样本集中在左侧峰值的全局最大值附近。请注意，由于优化过程的非确定性以及观测模型中的随机性，样本与我们之前示例中的并不完全相同。\n\
  \n![](img/527334_1_En_3_Fig13_HTML.jpg)\n\n一幅折线图，表示两条曲线的趋势，并在曲线上标记了一些点。实线表示代理函数，虚线表示无噪声目标函数。点表示带噪声的样本。\n\
  \n图 3-13\n\n使用 `gp_minimize()` 函数可视化提议的样本\n\n我们还可以展示连续提议点之间的距离图和最佳观测值图。如图 3-14 所示，尽管优化器在第二次迭代时就获得了较高的值，但它仍继续探索具有高不确定性的有希望区域，距离图中的两个峰值表明了这一点。\n\
  \n![](img/527334_1_En_3_Fig14_HTML.jpg)\n\n一组两个图表。左侧图表表示连续 x 之间的距离，绘制了距离与迭代次数的关系。线条有多个波峰和波谷。右侧图表表示最佳选定样本的值，绘制了最佳\
  \ y 与迭代次数的关系。线条呈上升趋势，变化幅度较小。\n\n图 3-14\n\n可视化收敛图\n\n## 总结\n\n贝叶斯优化是经典贝叶斯决策理论的扩展。该扩展体现在其使用以及代理函数和采集函数的选择上。在本章中，我们涵盖了以下内容：\n\
  \n*   贝叶斯优化需要定义一个效用函数，用于衡量返回数据集在寻找全局最优解时的价值。\n\n*   贝叶斯优化内层循环涉及寻找最大化采集函数的位置，而外层循环则寻找全局最优解的位置。\n\
  \n*   采集函数定义为效用的期望边际增益，可以是短视的（单步前瞻）或非短视的（多步前瞻）。\n\n*   优化多步前瞻的期望边际效用增益遵循贝尔曼最优性原理，可以表示为递归形式，即当前期望边际效用增益与所有未来演化中最大期望边际增益之和。\n\
  \n*   期望改进是一种广泛使用的单步前瞻采集函数，当优化终止时推荐最佳观测值，并具有友好的闭式表达式以支持快速计算。\n\n在下一章中，我们将重新审视高斯过程，并使用一个广泛使用的框架\
  \ GPyTorch 讨论高斯过程回归。\n\n"
- "# 4. 使用 GPyTorch 进行高斯过程回归\n\n到目前为止，我们已经掌握了贝叶斯优化过程的主要组成部分：一个提供底层目标函数均值和不确定性后验估计的代理模型，以及一个根据其期望边际效用增益指导搜索下一个采样位置的采集函数。在并行贝叶斯优化和蒙特卡洛采集函数的情况下，高效计算后验分布变得至关重要。这一分支涉及同时评估多个点，将在后续章节中讨论。\n\
  \n在本章中，我们将重点讨论构建和更新代理模型的第一个组成部分，以及其基于一个名为 GPyTorch 的高效、最先进包的具体实现。GPyTorch 包构建在 PyTorch\
  \ 之上，并继承了其所有内置优势，例如 GPU 加速和自动微分。它是 BoTorch 的支柱，BoTorch 是研究和实践中广泛使用的最先进的贝叶斯优化包，将在下一章中介绍。\n\
  \n## 介绍 GPyTorch\n\n高斯过程将底层目标函数建模为函数分布中的一个样本，该分布采用先验形式，并在揭示函数观测值后更新为后验分布。作为一种非参数模型，它具有无限的表现能力，可以从训练数据中学习，并以量化的不确定性水平进行预测。在选择核函数来编码我们对目标函数平滑性的先验假设后，我们可以拟合一个高斯过程模型，并将其应用于回归设置中，以获得任何新点的后验均值和方差，这是第\
  \ 2 章涵盖的主题。\n\n当我们关心估计新位置的值及其相关方差，进行插值或外推时，我们就是在进行高斯过程回归。根据结果的性质，该模型也可以扩展到分类设置。在下一节中，我们将简要介绍支撑\
  \ GPyTorch 库的 PyTorch 基础知识，然后简要回顾高斯过程回归的基础知识，并给出一个使用 GPyTorch 的实现案例。\n\n\n\n###\
  \ PyTorch 基础\n\nPyTorch 依托 Torch 库，已成为深度学习任务中最流行的框架之一。它在机器学习研究人员和从业者中被广泛使用，这得益于其易用性、动态计算图以及比\
  \ TensorFlow 等其他替代框架更“Pythonic”的特性。也就是说，如果你习惯在继续之前编写一些 Python 代码并检查即时输出，那么用 PyTorch\
  \ 编码的工作方式也大致相同。PyTorch 中的代码块是可检查和可中断的，这使得调试和打包非常方便。\n\nPyTorch 的核心组件是其 *tensor*\
  \ 数据结构，它在 CPU 中的行为类似于 NumPy 的 `ndarray`（多维数组），但在计算时驻留在 GPU 实例中，这使得它对于受益于图形处理的特定任务来说速度更快。它还支持*自动微分*，这使得在使用神经网络中的反向传播执行梯度下降优化时能够自动计算梯度。这种高效且精确的微分（假设目标函数是可微的）使得构建和训练现代神经网络模型变得更加容易和快速，并且可以通过并行计算进一步加速。\n\
  \n让我们看一个简单的例子来说明自动微分特性，即 *autograd*。首先，我们按如下方式从一个列表创建一个张量对象：\n\n```\n>>> import\
  \ torch\n>>> a = torch.tensor([1,2,3])\n>>> print(a)\ntensor([1, 2, 3])\n```\n\n\
  请注意，输出中的数据类型可能因环境规范而异。输出表明变量 `a` 是一个张量对象。或者，我们也可以通过转换 NumPy 数组来创建一个张量：\n\n```\n\
  >>> b = np.array([2,3,4])\n>>> b = torch.from_numpy(b)\n>>> print(b)\ntensor([2,\
  \ 3, 4])\n```\n\n常见的 NumPy 操作（如加法和乘法）在 PyTorch 中也有对应的函数，通常遵循相同的命名约定。例如，我们可以使用 `torch.add`\
  \ 将 `a` 和 `b` 相加，如下所示：\n\n```\n>>> c = torch.add(a, b)\n>>> print(c)\ntensor([3,\
  \ 5, 7])\n```\n\n在创建张量对象时，我们可以指定 `requires_grad=True` 来启用 autograd 功能。这意味着在从此变量开始的所有后续计算中，所有结果输出的计算历史都将被累积。让我们创建另一个变量\
  \ `a_grad`，这里我们使用浮点数，因为 autograd 不适用于整数：\n\n```\n>>> a_grad = torch.tensor([1.0,2.0,3.0],\
  \ requires_grad=True)\n>>> print(a_grad)\ntensor([1., 2., 3.], requires_grad=True)\n\
  ```\n\n接下来，我们将通过对 `a_grad` 进行平方运算来创建另一个变量：\n\n```\n>>> c = a_grad**2\n>>> print(c)\n\
  tensor([1., 4., 9.], grad_fn=<PowBackward0>)\n```\n\n这里，`grad_fn` 属性表明这是一个幂函数，用于执行反向传播和计算梯度。回想一下基础微积分，对于幂函数\
  \ *y* = *x*²，梯度（或一阶导数）是 *y*^′ = 2*x*。让我们对所有元素求和，将输入聚合为单个输出：\n\n```\n>>> out = c.sum()\n\
  >>> print(out)\ntensor(14., grad_fn=<SumBackward0>)\n```\n\n除了求和结果为 14 之外，输出还表明此结果来自求和操作。在计算图中指定并配置了所有基本操作后，我们可以通过调用\
  \ `backward()` 函数，使用 autograd 功能执行反向传播：\n\n```\n>>> out.backward()\n>>> print(a_grad.grad)\n\
  tensor([2., 4., 6.])\n```\n\n现在梯度已自动计算，并可通过 `grad` 属性访问，这与我们的预期输出相符。\n\n在 BO 循环中执行内部优化时，即定位采集函数的最大值，通常使用基于梯度的方法。当这些梯度可以轻松计算时，优化就可以高效地进行管理。诸如多起点随机梯度上升（因为我们想要最大化采集函数）之类的方法严重依赖于\
  \ PyTorch 中的 autograd 功能，特别是 GPyTorch 和 BoTorch。我们将在后面的章节中讨论此算法。\n\n接下来，让我们重新审视\
  \ GP 回归的基础知识。\n\n### 重温 GP 回归\n\nGP 回归依赖于在任何新采样位置 **x**[∗] 处随机变量 *y*[∗] 的预测均值和方差的闭式解。假设我们已经收集了一个包含\
  \ *n* 个观测值的训练集 ![$$ {\\mathcal{D}}_n={\\left\\{\\left({\\textbf{x}}_i,{y}_i\\right)\\\
  right\\}}_{i=1}^n $$](img/527334_1_En_4_Chapter_TeX_IEq1.png)，其中每个采样位置 **x**[*i*]\
  \ ∈ ℝ^(*d*) 是紧集 ![$$ \\mathcal{X}\\subset {\\mathbb{R}}^d $$](img/527334_1_En_4_Chapter_TeX_IEq2.png)\
  \ 中的一个 *d* 维特征向量，而 *y*[*i*] ∈ ℝ 是一个受噪声扰动的标量观测值，满足 *y*[*i*] = *f* (**x**[*i*]) +\
  \ *ϵ*[*i*]。我们通常假设在整个域内具有同质方差的标准高斯噪声，即 ![$$ {\\epsilon}_i\\sim \\mathcal{N}\\left(0,{\\\
  sigma}²\\right) $$](img/527334_1_En_4_Chapter_TeX_IEq3.png)。\n\n在 GP 框架下，估计的目标函数由一个均值函数\
  \ ![$$ \\mu :\\mathcal{X}\\longrightarrow \\mathbb{R} $$](img/527334_1_En_4_Chapter_TeX_IEq4.png)\
  \ 和一个协方差函数 ![$$ k:\\mathcal{X}\\times \\mathcal{X}\\longrightarrow \\mathbb{R} $$](img/527334_1_En_4_Chapter_TeX_IEq5.png)\
  \ 来表征，其中 ![$$ \\mu \\left(\\textbf{x}\\right)=\\mathbbm{E}\\left[\\textrm{f}\\left(\\\
  textbf{x}\\right)\\right] $$](images/527334_1_En_4_Chapter/527334_1_En_4_Chapter_TeX_IEq6.png)\
  \ 且 ![$$ k\\left(\\textbf{x},{\\textbf{x}}^{\\prime}\\right)=\\mathbbm{E}\\left[\\\
  left(\\textrm{f}\\left(\\textbf{x}\\right)-\\mathbbm{E}\\left[\\textrm{f}\\left(\\\
  textbf{x}\\right)\\right]\\right)\\left(\\textrm{f}\\left({\\textbf{x}}^{\\prime}\\\
  right)-\\mathbbm{E}\\left[\\textrm{f}\\left({\\textbf{x}}^{\\prime}\\right)\\right]\\\
  right)\\right] $$](images/527334_1_En_4_Chapter/527334_1_En_4_Chapter_TeX_IEq7.png)。对于域内的任何有限随机变量集合，它们的联合分布遵循多元高斯分布，从而得到\
  \ ![$$ {y}_{1:n}\\sim \\mathcal{N}\\left(\\textbf{0},{\\textbf{K}}_n\\right) $$](img/527334_1_En_4_Chapter_TeX_IEq8.png)，这里我们假设一个恒定的零均值函数\
  \ *μ* = 0，并且 **K**[*n*] = **K***n* 表示协方差矩阵，注意 **K***n*[*i*, *j*] = *k*(**x**[*i*],\
  \ **x**[*j*])。\n\n在新位置 **x**[∗] 处 *y*[∗] 的预测分布同样是正态分布的，即 ![$$ p\\left({y}_{\\ast\
  \ };{\\textbf{x}}_{\\ast },{\\mathcal{D}}_n\\right)=\\mathcal{N}\\left({y}_{\\ast\
  \ }|{\\mu}_{\\ast },{\\sigma}_{\\ast}²\\right) $$](img/527334_1_En_4_Chapter_TeX_IEq9.png)，其中\
  \ *μ*[∗] = **k**(**x**[∗], **x**[1 : *n*])^(*T*)(**K**[*n*] + *σ*²**I**)^(−1)*y*[1\
  \ : *n*] 且 ![$$ {\\sigma}_{\\ast}²=k\\left({\\textbf{x}}_{\\ast },{\\textbf{x}}_{\\\
  ast}\\right)-\\textbf{k}{\\left({\\textbf{x}}_{\\ast },{\\textbf{x}}_{1:n}\\right)}^T{\\\
  left({\\textbf{K}}_n+{\\sigma}²\\textbf{I}\\right)}^{-1}\\textbf{k}\\left({\\textbf{x}}_{\\\
  ast },{\\textbf{x}}_{1:n}\\right) $$](img/527334_1_En_4_Chapter_TeX_IEq10.png)，并且\
  \ **k**(**x**[∗], **x**[1 : *n*]) = [*k*(**x**[∗], **x**[∗]), …, *k*(**x**[∗], **x**[∗])]^(*T*)。\n\
  \n现在，我们将看看如何使用 GPyTorch 构建一个 GP 回归模型。\n\n\n\n### 构建高斯过程回归模型\n\n高斯过程为我们提供了一种对未观测随机变量进行推断的工具。当后验概率分布具有闭式表达式时，推断是精确的。然而，当精确推断在计算上难以处理时（例如计算高维积分），通常会使用近似推断作为精度与速度之间的权衡。当后验分布难以计算、难以采样或两者兼具时，我们可以使用有偏但更简单的近似来进行推断。\n\
  \n图 4-1 展示了在对新输入点集进行推断或预测时的这两种方法。\n\n![](img/527334_1_En_4_Fig1_HTML.jpg)\n\n一个框图展示了精确推断应用的\
  \ 2 个点和近似推断应用的 3 个点。\n\n图 4-1\n在 GPyTorch 中比较精确推断与近似推断\n\n由于目标函数，例如 *f* (*x*) =\
  \ −cos (*πx*) + sin (4*πx*)，是一个相对简单的一维函数，因此通过继承 `gpytorch.models.ExactGP` 进行精确 GP\
  \ 推断足以满足本工作示例的需求。\n\n在下面的代码清单中，我们首先定义了目标函数，然后用它在 0 到 1 的范围内生成十个带噪声的观测值。请注意，我们使用了\
  \ torch 函数，例如 `cos()`、`sin()`、`randn()` 和 `linspace()`，所有这些函数都与同名的 NumPy 函数对应。我们将噪声水平设置为\
  \ 0.1。在绘制这十个带噪声的观测值时，变量 `X_init` 和 `y_init` 都通过内置的 `numpy()` 函数转换为 NumPy 格式。\n\n\
  ```\n# 定义目标函数\ndef f(x, noise=0):\n    return -torch.cos(np.pi*x) + torch.sin(4*np.pi*x)\
  \ + noise*torch.randn(*x.shape)\n# 观测噪声\nnoise = 0.1\n# 观测数量\nN = 10\n# 初始观测值\n\
  X_init = torch.linspace(0.05, 0.95, N)\ny_init = f(X_init, noise=noise)\n# 绘制带噪声的观测值\n\
  plt.figure(figsize=(8, 6))\nplt.plot(X_init.numpy(), y_init.numpy(), 'o');\n代码清单\
  \ 4-1\n生成带噪声的观测值\n```\n\n运行代码将生成图 4-2。\n\n![](img/527334_1_En_4_Fig2_HTML.png)\n\
  \n一个图表显示了散布在各处的多个点。y 轴范围从负 1 到正 1，而 x 轴范围在 0.2 到 0.8 之间。最高值出现在 0.6 到 0.8 之间。\n\n\
  图 4-2\n可视化初始的十个带噪声观测值\n\n在拟合 GP 模型之前，我们必须为先验 GP 定义均值函数和协方差（核）函数。GPyTorch 提供了多种均值函数，包括零均值函数\
  \ `gpytorch.means.ZeroMean()`、常数均值函数 `gpytorch.means.ConstantMean()` 和线性均值函数 `gpytorch.means.LinearMean()`。在此例中，我们使用常数均值函数，假设数据中没有系统性趋势。\n\
  \n至于核函数，我们选择最广泛使用的核之一：RBF 核，或称平方指数核 ![$$ k\\left({x}_1,{x}_2\\right)=\\exp \\left(-\\\
  frac{{\\left|\\left|{x}_1-{x}_2\\right|\\right|}²}{2{l}²}\\right) $$](img/527334_1_En_4_Chapter_TeX_IEq11.png)，其中\
  \ *l* 是长度尺度参数，可以通过最大似然过程进行优化。RBF 核可以通过调用类 `gpytorch.kernels.RBFKernel()` 来实例化。我们还会为核函数的输出添加一个缩放系数，只需用\
  \ `kernels.ScaleKernel()` 将其包装起来即可。事实上，正如 GPyTorch 官方文档所建议的：如果你不知道使用什么核，我们建议你从 `gpytorch.kernels.ScaleKernel(gpytorch.kernels.RBFKernel)`\
  \ 开始。下面的代码清单定义了均值函数和核函数。\n\n```\nmean_fn = gpytorch.means.ConstantMean()\nkernel_fn\
  \ = gpytorch.kernels.ScaleKernel(gpytorch.kernels.RBFKernel())\n代码清单 4-2\n定义均值函数和核函数\n\
  ```\n\n接下来，我们将定义一个类，基于精确 GP 推断类 `gpytorch.models.ExactGP` 来执行 GP 回归。如下面的代码清单所示，我们定义了一个名为\
  \ `GPRegressor` 的类，它继承自 `gpytorch.models.ExactGP`，用于执行简单的 GP 推断。该类包含三个函数：`__init__()`、`forward()`\
  \ 和 `predict()`。`__init__()` 函数在实例化该类时被触发，并存储三个输入属性：先验均值函数、先验核函数以及似然函数。在 GP 回归的情况下，由于我们假设一个受噪声扰动的观测模型，高斯似然函数将底层函数分布\
  \ *p*(*f* | **x**) 映射到边缘分布 *p*(*y*| **x**)，其中 *y* = *f* (**x**) + *ϵ* 是任意位置 **x**\
  \ 的带噪声观测值，且 ![$$ \\epsilon \\sim \\mathcal{N}\\left(0,{\\sigma}²\\right) $$](img/527334_1_En_4_Chapter_TeX_IEq12.png)。\n\
  \n```\nclass GPRegressor(gpytorch.models.ExactGP):\n    def __init__(self, X, y,\
  \ mean, kernel, likelihood=None):\n        # 选择精确 GP 推断所需的标准观测模型\n        if likelihood\
  \ is None:\n            likelihood = gpytorch.likelihoods.GaussianLikelihood()\n\
  \        # 初始化超类 ExactGP 以刷新后验\n        super().__init__(X, y, likelihood)\n   \
  \     # 存储属性\n        self.mean = mean\n        self.kernel = kernel\n        self.likelihood\
  \ = likelihood\n\n    # 在训练数据条件下计算后验分布\n    def forward(self, x):\n        mean_x\
  \ = self.mean(x)\n        covar_x = self.kernel(x)\n        # 返回后验多元正态分布\n     \
  \   return gpytorch.distributions.MultivariateNormal(mean_x, covar_x)\n\n    # 计算给定\
  \ x 时 y 的边缘预测分布\n    def predict(self, x):\n        # 设置为评估模式\n        self.eval()\n\
  \        # 在不进行梯度传播的情况下执行推断\n        with torch.no_grad():\n            # 获取后验分布\
  \ p(f|x)\n            pred = self(x)\n            # 将后验分布 p(f|x) 转换为 p(y|x)\n  \
  \          return self.likelihood(pred)\n代码清单 4-3\n为 GP 推断定义自定义类\n```\n\n接下来，`forward()`\
  \ 函数计算任意输入位置的后验分布，并返回一个由该特定位置的后验均值函数和核函数实现参数化的多元正态分布。当使用 `GPRegressor` 类的实例进行预测时，此函数会被自动调用。请注意，在\
  \ GPyTorch 的精确 GP 推断中，`MultivariateNormal` 是唯一允许的分布。\n\n最后，`predict()` 函数接收来自 `forward()`\
  \ 的输出 *p*(*f* | **x**)，并叠加一个观测模型以生成 *p*(*y*| **x**)。请注意，我们需要通过 `eval()` 函数将 GP 模型设置为推断模式，并在不计算梯度的情况下执行推断，如\
  \ `torch.no_grad()` 上下文管理器所示。\n\n然后，我们可以通过向自定义类传递所需参数来创建模型，如下所示，这将基于提供的训练集以及均值函数和核函数的模型配置来训练一个\
  \ GP 模型：\n\n```\n>>> model = GPRegressor(X_init, y_init, mean_fn, kernel_fn)\n```\n\
  \n\n\n现在，让我们将模型拟合到十个带噪声的观测值后，可视化后验高斯过程。如下列代码清单所示，我们创建了一个函数，该函数接受训练好的 GP 模型实例，并可选择性地接受存储在`xlim`中的\
  \ x 轴范围用于绘图。我们首先通过分别访问`train_inputs`和`train_targets`属性来提取训练数据，两者均转换为 NumPy 格式。当未提供`xlim`时，我们使用`X_train`的上下限并稍作扩展。接着，我们在`X_plot`中创建一组等间距的输入位置，并对它们进行评分以获得相应的后验预测分布，其均值、上界和下界用于绘图。\n\
  \n```\ndef plot_model(model, xlim=None):\n\"\"\"\n绘制一维 GP 模型\n输入:\nmodel : gpytorch.models.GP\n\
  xlim : x 轴范围，元组(float, float) 或 None\n\"\"\"\n# 以 NumPy 格式提取训练数据\nX_train = model.train_inputs[0].cpu().numpy()\n\
  y_train = model.train_targets.cpu().numpy()\n# 获取 x 轴范围\nif xlim is None:\nxmin\
  \ = float(X_train.min())\nxmax = float(X_train.max())\nx_range = xmax - xmin\nxlim\
  \ = [xmin - 0.05 * x_range,\nxmax + 0.05 * x_range]\n# 创建等间距输入位置列表，数据类型与参数一致\nmodel_tensor_example\
  \ = list(model.parameters())[0]\nX_plot = torch.linspace(xlim[0], xlim[1], 200).to(model_tensor_example)\n\
  # 生成后验预测分布\nmodel.eval()\npredictive_distribution = model.predict(X_plot)\n# 获取均值、上界和下界\n\
  lower, upper = predictive_distribution.confidence_region()\nprediction = predictive_distribution.mean.cpu().numpy()\n\
  X_plot = X_plot.numpy()\nplt.scatter(X_train, y_train, marker='x', c='k')\nplt.plot(X_plot,\
  \ prediction)\nplt.fill_between(X_plot, lower, upper, alpha=0.1)\nplt.xlabel('x',\
  \ fontsize=14)\nplt.ylabel('y', fontsize=14)\n代码清单 4-4\n绘制拟合后的 GP 回归模型\n```\n\n\
  将此函数应用于模型实例，生成图 4-3。\n\n![](img/527334_1_En_4_Fig3_HTML.jpg)\n\ny 对 x 的散点图表示一组点，散布在\
  \ x 轴从 0 到 1 的线段上。该线段从 y 轴负 1 到 0 之间的点开始，y 轴范围在负 2 到正 2 之间。\n\n图 4-3\n可视化拟合后的 GP\
  \ 回归模型\n\n我们可以看到，GP 回归模型是一个粗略的拟合，在整个域内具有较宽的置信区间。由于核函数的长度尺度参数直接影响最终模型拟合的形状，我们将在下一节讨论如何微调此参数以提高预测性能。\n\
  \n### 微调核函数的长度尺度\n\n回想一下，在前面的示例中，我们直接使用了核函数`kernel_fn`，而没有调整其长度尺度参数。该参数可以通过`lengthscale`属性访问，可以在进入主\
  \ GP 循环之前手动设置或通过最大似然过程进行优化。\n\n在下面的代码清单中，我们更改核函数`lengthscale`参数的值，并观察所得核函数形状（更具体地说是平滑度）的变化。我们总共创建了六个长度尺度参数，存储在`all_lengthscale`中，其元素被依次迭代并传递给\
  \ RBF 核函数的`lengthscale`属性。我们还创建了一个`plot_kernel()`函数，通过将密集的输入位置列表（存储在`x`中）与值为 1 的输入位置（`torch.ones((1))`）进行比较来评估核函数。请注意，我们需要触发核函数的`evaluate()`函数来执行成对距离的实际评估。\n\
  \n```\ndef plot_kernel(kernel, xlim=None, ax=None):\nif xlim is None:\nxlim = [-3,\
  \ 3]\nx = torch.linspace(xlim[0], xlim[1], 100)\n# 调用 evaluate() 函数执行实际评估\nwith\
  \ torch.no_grad():\nK = kernel(x, torch.ones((1))).evaluate().reshape(-1, 1)\nif\
  \ ax is None:\nfig = plt.figure()\nax = fig.add_subplot(111)\nax.plot(x.numpy(),\
  \ K.cpu().numpy())\nk = gpytorch.kernels.RBFKernel()\nall_lengthscale = np.asarray([0.2,\
  \ 0.5, 1, 2, 4, 8])\nfigure, axes = plt.subplots(2, 3, figsize=(12, 8))\nfor tmp_lengthscale,\
  \ ax in zip(all_lengthscale, axes.ravel()):\nk.lengthscale = tmp_lengthscale\nplot_kernel(k,\
  \ ax=ax)\nax.set_ylim([0, 1])\nax.legend([tmp_lengthscale])\n代码清单 4-5\n使用不同长度尺度参数绘制核函数\n\
  ```\n\n运行此代码片段生成图 4-4。当长度尺度较小时，核函数对附近的点赋予更多权重，并通过将相似度值设为零来丢弃远处的点，从而显示出不太平滑的曲线。随着长度尺度的增加，核函数变得更加平滑。\n\
  \n![](img/527334_1_En_4_Fig4_HTML.jpg)\n\n一组排列成 2 行的 6 个折线图表示一组线的趋势。上排图中的线表示值 0.2、0.5\
  \ 和 1.0。下排图中的线表示值 2.0、4.0 和 8.0。上排的线保持平坦并具有单个尖峰，而下排的线则呈现上升趋势。\n\n图 4-4\n在不同长度尺度参数设置下可视化核函数\n\
  \n回到我们之前的示例。在`kernel_fn`中初始化核函数后，我们可以通过`base_kernel.lengthscale`属性访问其长度尺度参数，其中`base_kernel`指的是包装在缩放操作中的\
  \ RBF 核。如下所示，默认值为 0.6931，并且核对象具有一个梯度属性，该属性将用于从损失（负最大似然，稍后讨论）到长度尺度参数的梯度计算：\n\n```\n\
  >>> kernel_fn.base_kernel.lengthscale\ntensor([[0.6931]], grad_fn=)\n```\n\n更改此参数将导致不同的\
  \ GP 模型拟合。例如，我们可以通过以下代码片段手动将长度尺度参数设置为 0.1：\n\n```\n>>> kernel_fn.base_kernel.lengthscale\
  \ = 0.1\n>>> model = GPRegressor(X_init, y_init, mean_fn, kernel_fn)\n>>> plot_model(model)\n\
  ```\n\n运行此代码片段生成图 4-5，其中模型拟合在沿观测数据点改变整体置信区间方面看起来更好。\n\n![](img/527334_1_En_4_Fig5_HTML.jpg)\n\
  \n\n\n一张 y 对 x 的图表展示了曲线随波峰和波谷起伏的走势。y 轴范围从负值到正 3，x 轴范围从 0 到 1。曲线大致从 y 轴上的 0 点开始。\n\
  \n图 4-5\n\n手动设置长度尺度参数后的 GP 回归模型\n\n然而，手动设置长度尺度参数并观察拟合质量既耗时又低效。我们需要借助一种自动化的程序，通过优化特定指标（例如观测数据的似然）来寻找最优参数。\n\
  \n给定一个 GP 模型 ![$$ f\\sim \\mathcal{GP}\\left(\\mu, k\\right) $$](img/527334_1_En_4_Chapter_TeX_IEq13.png)\
  \ 和一个训练集 (**X**, **y**)，观测到结果 **y** 的似然可以表示为\n\n![$$ \\mathcal{L}={p}_f\\left(\\\
  textbf{y}|\\textbf{X}\\right)=\\int p\\left(\\textbf{y}|f\\left(\\textbf{X}\\right)\\\
  right)p\\left(f\\left(\\textbf{X}\\right)|\\textbf{X}\\right) df $$](img/527334_1_En_4_Chapter_TeX_Equa.png)\n\
  \n在精确 GP 推断设置中，即使用高斯似然模型的 GP 回归，这个似然可以被精确计算。对联合似然取负，就得到了优化过程中需要最小化的损失。在 GPyTorch\
  \ 中，可以通过首先创建一个 `gpytorch.mlls.ExactMarginalLogLikelihood()` 实例来计算这个联合边际似然，该实例以高斯似然和精确\
  \ GP 模型作为输入，并基于后验分布 *p*(*f* | **X**) 和目标观测值 **y** 输出精确边际对数似然 (MLL)。\n\n现在，让我们看看如何基于类似于最大似然估计\
  \ (MLE) 的优化过程来自动优化长度尺度，其中似然被取负并最小化。在下面的代码清单中，我们定义了一个函数，基于现有的训练数据集（`X` 和 `y`）、迭代轮数（`n_epochs`，每轮是训练集的一次完整遍历）、学习率（`lr`，由所选优化器使用）以及可选的训练日志指示器（`verbose`）来执行训练过程。请注意，高斯似然模型中用到的高斯噪声项的方差\
  \ *σ*² 也是另一个需要微调的超参数。*σ*² 和 `lengthscale` 都可以通过 `model.parameters()` 函数访问。\n\n```\n\
  def train(model, X, y, n_epochs=100, lr=0.3, verbose=True):\n# 切换到模型训练模式\nmodel.train()\n\
  # 使用 Adam 优化器\ntraining_parameters = model.parameters()\noptimizer = torch.optim.Adamax(training_parameters,\
  \ lr=lr)\n# 初始化一个带有高斯似然的 GP 模型用于 MLL 计算\nmll = gpytorch.mlls.ExactMarginalLogLikelihood(model.likelihood,\
  \ model)\n# 开始训练循环\nfor e in range(n_epochs):\n# 清除梯度以防止梯度累积\noptimizer.zero_grad()\n\
  # 获取后验分布 p(f|x)\nout = model(X)\n# 获取取负后的精确边际对数似然 p(y|x)\nloss = -mll(out, y)n\n\
  # 使用 autograd 计算梯度\nloss.backward()\n# 执行梯度更新\noptimizer.step()\n# 打印优化日志\nif verbose:\n\
  if e % 5 == 0:\nlengthscale = model.kernel.base_kernel.lengthscale.squeeze(0).detach().cpu().numpy()\n\
  print(f\"Epoch: {e}, loss: {loss.item():.3f}, lengthscale: {lengthscale[0]:.3f},\
  \ noise: {model.likelihood.noise.item():.3f}\")\n# print(f\"Loss: {loss.item():.3f},\
  \ lengthscale: {lengthscale}\")\n代码清单 4-6\n优化超参数\n```\n\n该函数首先将模型切换到训练模式。至于超参数的优化器，我们使用\
  \ Adam 优化器，这是一种因其稳定的更新和快速收敛而广受欢迎的选择。我们还创建了一个精确 GP 似然实例，用于计算联合边际似然，这是每次训练迭代中拟合优度的一个指标。梯度下降更新的每一步都包括清除现有梯度、计算损失函数、反向传播梯度以及执行权重更新。\n\
  \n如图 4-6 所示，在对模型总共训练 100 轮后，得到的 GP 拟合结果看起来好多了，置信区间比以前窄得多。训练完成后检查长度尺度，其值为 0.1279，如下面的代码片段所示。\n\
  \n![](img/527334_1_En_4_Fig6_HTML.jpg)\n\n一张 y 对 x 的图表展示了曲线随波峰和波谷起伏的走势。y 轴范围从负值到正\
  \ 1.5，x 轴范围从 0 到 1。曲线大致从 y 轴上的负 0.5 点开始。\n\n图 4-6\n\n优化模型超参数（即长度尺度和噪声方差）后的 GP 拟合可视化\n\
  \n```\n>>> kernel_fn.base_kernel.lengthscale\ntensor([[0.1279]], grad_fn=)\n```\n\
  \n接下来，我们将研究噪声方差项，它是影响拟合 GP 回归模型平滑度的另一个超参数。\n\n\n\n### 微调噪声方差\n\n随机噪声的方差可以通过 `likelihood.noise`\
  \ 属性访问。例如，上一示例优化后的最优方差为 0.0183：\n\n```\n>>> model.likelihood.noise\ntensor([0.0183],\
  \ grad_fn=)\n```\n\n我们也可以覆盖噪声方差，这会直接影响拟合后的 GP 回归模型的平滑度和置信区间。例如，图 4-7 展示了将噪声方差设置为\
  \ 0.1 后拟合的 GP 模型，其置信区间比之前大得多。\n\n![](img/527334_1_En_4_Fig7_HTML.jpg)\n\n一张 y 对\
  \ x 的图表，表示一条曲线，有波峰和波谷。y 轴范围从负值到正值 2，x 轴范围从 0 到 1。曲线起始于 y 轴上接近负 1 的点。\n\n图 4-7\n\n\
  覆盖噪声方差后拟合的 GP 模型可视化\n\n```\n>>> model.likelihood.noise = 0.1\n>>> plot_model(model)\n\
  ```\n\n在前一个示例中，当噪声水平增加时，自动超参数调优过程也表现良好。在下面的代码清单中，我们将生成带噪声观测值时的噪声方差从之前的 0.1 增加到 0.5。其余代码保持不变。\n\
  \n```\ny_init = f(X_init, noise=0.5)\nmodel = GPRegressor(X_init, y_init, mean_fn,\
  \ kernel_fn)\ntrain(model, X_init, y_init)\nplot_model(model)\n代码清单 4-7\n使用增加的噪声方差生成观测值\n\
  ```\n\n运行上述代码将生成图 4-8。置信区间比以前更窄且更具适应性。优化后的噪声现在为 0.0114，如下面的代码片段所示。\n\n![](img/527334_1_En_4_Fig8_HTML.jpg)\n\
  \n一张 y 对 x 的图表，表示一条曲线，有波峰和波谷。y 轴范围在负 2 到正 1.5 之间，x 轴范围从 0 到 1。曲线起始于 y 轴上大约负 1 的位置。\n\
  \n图 4-8\n\n使用增加的噪声方差拟合的 GP 模型可视化\n\n```\n>>> model.likelihood.noise\ntensor([0.0114],\
  \ grad_fn=)\n```\n\n在某些情况下，我们希望在整个优化过程中保持噪声方差固定不变。当我们对噪声方差有一些先验知识时，就会出现这种情况。在这种情况下，我们可以将其排除在之前\
  \ `train()` 函数中 `training_parameters` 的可训练参数之外，只优化长度尺度。为此，我们可以添加一个额外的输入参数 `fixed_noise_variance`\
  \ 来接收预期的噪声方差（如果有的话）。接下来，使用以下代码片段替换 `training_parameters` 的赋值：\n\n```\nif fixed_noise_variance\
  \ is not None:\nmodel.likelihood.noise = fixed_noise_variance\ntraining_parameters\
  \ = [p for name, p in model.named_parameters() if not name.startswith('likelihood')]\n\
  else:\ntraining_parameters = model.parameters()\n```\n\n这里，我们使用了 `named_parameters()`\
  \ 函数来提取参数及其名称，用于过滤掉那些以关键字“likelihood”开头的参数。然后，我们使用新的训练过程重新训练模型，并在图 4-9 中获得了固定噪声方差为\
  \ 0.1 的结果。\n\n![](img/527334_1_En_4_Fig9_HTML.jpg)\n\n一张 y 对 x 的图表，表示一条曲线，有波峰和波谷。y\
  \ 轴范围从负值到正值 2，x 轴范围从 0 到 1。曲线起始于 y 轴上略高于负 1 的点。\n\n图 4-9\n\n使用固定噪声方差和优化后的长度尺度拟合\
  \ GP 回归模型\n\n欢迎查看随附笔记本中的完整训练代码，地址为 [`https://github.com/jackliu333/bayesian_optimization_theory_and_practice_with_python/blob/main/Chapter_4.ipynb`](https://github.com/jackliu333/bayesian_optimization_theory_and_practice_with_python/blob/main/Chapter_4.ipynb)。\n\
  \n前面的例子展示了选择合适的核函数并优化超参数以获得良好 GP 拟合的重要性。在下一节中，我们将了解 GPyTorch 中可用的不同核函数，以及它们如何组合使用以提升模型拟合性能。\n\
  \n## 深入探讨核函数\n\nGPyTorch 中有多种核函数可用。常用的选择包括 RBF（径向基函数）核、有理二次核、Matern52 核、线性核、多项式核和周期核。每个核函数的定义如下所示，其中我们将噪声方差\
  \ *σ*² 作为缩放因子相乘，以确定函数偏离其均值的平均距离：\n\n*   RBF 核\n\n    ![$$ k\\left({x}_1,{x}_2\\\
  right)={\\sigma}²\\exp \\left(-\\frac{r²}{2{l}²}\\right) $$](img/527334_1_En_4_Chapter_TeX_Equb.png)\n\
  \n其中 *r* = ‖*x*[1] − *x*[2]‖。\n\n*   有理二次核\n\n    ![$$ k\\left({x}_1,{x}_2\\right)={\\\
  sigma}²\\exp {\\left(1+\\frac{r²}{2a{l}²}\\right)}^{-a} $$](img/527334_1_En_4_Chapter_TeX_Equc.png)\n\
  \n其中额外的超参数 *a* 决定了大规模和小规模变化的相对权重。\n\n*   Matern52 核\n\n    ![$$ k\\left({x}_1,{x}_2\\\
  right)={\\sigma}²\\left(1+\\sqrt{5}\\frac{r}{l}+\\frac{5}{3}\\frac{r²}{l²}\\right)\\\
  exp \\left(-\\sqrt{5}\\frac{r}{l}\\right) $$](img/527334_1_En_4_Chapter_TeX_Equd.png)\n\
  \n*   线性核\n\n    ![$$ k\\left({x}_1,{x}_2\\right)=\\sum \\limits_i{\\sigma}_i²{x}_{1,i}{x}_{2,i}\
  \ $$](img/527334_1_En_4_Chapter_TeX_Eque.png)\n\n*   多项式核\n\n    ![$$ k\\left({x}_1,{x}_2\\\
  right)={\\sigma}²{\\left({x}_1{x}_2+c\\right)}^d $$](img/527334_1_En_4_Chapter_TeX_Equf.png)\n\
  \n*   周期核\n\n    ![$$ k\\left({x}_1,{x}_2\\right)={\\sigma}²\\exp \\left(-2\\frac{\\\
  sin²\\left(\\pi r\\right)}{l²}\\right) $$](img/527334_1_En_4_Chapter_TeX_Equg.png)\n\
  \n在下面的代码清单中，我们使用之前定义的 `plot_kernel()` 函数绘制每个核函数。请注意，我们使用了字符串匹配函数 `split()` 来提取核函数名称作为每个子图的标题。\n\
  \n```\ncovariance_functions = [gpytorch.kernels.RBFKernel(),\ngpytorch.kernels.RQKernel(),\n\
  gpytorch.kernels.MaternKernel(nu=5/2),\ngpytorch.kernels.LinearKernel(power=1),\n\
  gpytorch.kernels.PolynomialKernel(power=2),\ngpytorch.kernels.PeriodicKernel()\n\
  ]\nfigure, axes = plt.subplots(2, 3, figsize=(9, 6))\naxes = axes.ravel()\nfor i,\
  \ k in enumerate(covariance_functions):\nplot_kernel(k, ax=axes[i])\naxes[i].set_title(str(k).split('(')[0])\n\
  figure.tight_layout()\n代码清单 4-8\n可视化不同的核函数\n```\n\n运行上述代码将生成图 4-10。虽然每种类型的核显示出不同的特征，但我们还可以通过加法和乘法运算进一步组合它们，以创建更灵活的表示形式，我们将在下一节中展示这一点。\n\
  \n![](img/527334_1_En_4_Fig10_HTML.jpg)\n\n一组 6 个折线图，排列成 2 行。上面一行表示 RBF 核、RQ 核和\
  \ Matern 核，线条在中间有单个尖峰。下面一行表示线性核、多项式核和周期核。线性核和多项式核呈上升趋势，而周期核有多个尖峰。\n\n图 4-10\n\n\
  可视化不同的核函数\n\n\n\n### 组合核函数\n\n在 GPyTorch 中，可以使用加法运算符 `+` 或乘法运算符 `*` 来组合核函数。这两种操作如下所示：\n\
  \n*   通过将两个核函数相加，推导出一个复合核函数\n\n    ![$$ k\\left({x}_1,{x}_2\\right)={k}_1\\left({x}_1,{x}_2\\\
  right)+{k}_2\\left({x}_1,{x}_2\\right) $$](img/527334_1_En_4_Chapter_TeX_Equh.png)\n\
  \n*   通过将两个核函数相乘，推导出一个复合核函数\n\n    ![$$ k\\left({x}_1,{x}_2\\right)={k}_1\\left({x}_1,{x}_2\\\
  right){k}_2\\left({x}_1,{x}_2\\right) $$](img/527334_1_En_4_Chapter_TeX_Equi.png)\n\
  \n现在，让我们看看如何组合不同的核函数。我们首先创建一个列表 `kernel_functions` 来存储三个核函数：线性核、周期核和 RBF 核。我们还将\
  \ `+` 和 `*` 运算符重载为 lambda 函数，这样 `+(a,b)` 就变成了 `a+b`，而 `*(a,b)` 等价于 `a*b`。由于我们希望将这两个运算符应用于任意两个核函数的每一种唯一组合，因此使用\
  \ `itertools` 包中的 `combinations()` 函数来生成需要迭代的唯一组合。完整的实现细节请参见下面的代码清单。\n\n```\nkernel_functions\
  \ = [gpytorch.kernels.LinearKernel(power=1),\ngpytorch.kernels.PeriodicKernel(),\n\
  gpytorch.kernels.RBFKernel()]\n# 重载 + 和 * 运算符\noperations = {'+': lambda x, y: x\
  \ + y,\n'*': lambda x, y: x * y}\nfigure, axes = plt.subplots(len(operations), len(kernel_functions),\
  \ figsize=(9, 6))\nimport itertools\naxes = axes.ravel()\ncount = 0\n# 遍历核函数和运算符的每一种唯一组合\n\
  for j, base_kernels in enumerate(itertools.combinations(kernel_functions, 2)):\n\
  for k, (op_name, op) in enumerate(operations.items()):\nkernel = op(base_kernels[0],\
  \ base_kernels[1])\nplot_kernel(kernel, ax=axes[count])\nkernel_names = [\nstr(base_kernels[i]).split('(')[0]\
  \ for i in [0, 1]\n]\naxes[count].set_title('{} {} {}'.format(kernel_names[0], op_name,\n\
  kernel_names[1]), fontsize=12)\ncount += 1\nfigure.tight_layout()\n代码清单 4-9\n组合不同的核函数\n\
  ```\n\n运行上述代码将生成图 4-11。请注意，当将线性核与周期核相加时，生成的组合核同时显示出线性趋势和周期性。\n\n![](img/527334_1_En_4_Fig11_HTML.jpg)\n\
