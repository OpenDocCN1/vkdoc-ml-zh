- '# 5. 使用 Sobol 序列和随机重启的蒙特卡洛采集函数


  在上一章中，我们介绍了 GPyTorch，这是 BoTorch 用于使用 PyTorch 获取高斯过程后验的核心动力。这为我们介绍本章的主题 BoTorch 铺平了道路。具体来说，我们将重点介绍它如何实现第
  3 章中介绍的期望提升采集函数，并执行内部优化以寻找下一个最佳采样位置候选。


  此外，我们还将介绍另一种类型的采集函数，它没有解析解，只能通过蒙特卡洛方法计算。例子包括并行贝叶斯优化（其中每次外部优化会提出多个采样位置）以及非短视采集函数（如多步前瞻变体）。理解使用蒙特卡洛方法（包括准蒙特卡洛方法）在特定位置评估采集函数函数值的过程，是我们从本章开始研究
  BoTorch 核心工作机制的基础。


  ## 使用 BoTorch 的解析期望提升


  BoTorch 提供了多种类型的采集函数。虽然少数采集函数（如期望提升）具有解析形式，但大多数不具备此特性。我们将在本节中研究 BoTorch 中的解析期望提升，并在下一节切换到相应的基于蒙特卡洛的期望提升，后者需要蒙特卡洛估计来评估采集函数的函数值。


  在下一节中，我们将介绍 Hartmann 函数，这是一个广泛使用的、用于基准测试优化算法性能的合成函数。




  ### 哈特曼函数简介


  哈特曼函数是一个六维函数，包含六个局部极小值和一个全局极小值。有两件事值得我们立即关注。首先，该函数的定义域有六个维度，这比我们在第 3 章遇到的一维情况更复杂，并为搜索问题呈现了一个更具挑战性的状态空间。其次，函数形状是多模态的，具有多个局部极小值，这要求搜索算法能够高效探索，并避免陷入此类局部极小值。


  哈特曼函数的形式如下：


  ![$$ f\left(\textbf{x}\right)=-{\sum}_{i=1}⁴{\alpha}_i\exp \left(-{\sum}_{j=1}⁶{A}_{ij}{\left({x}_j-{P}_{ij}\right)}²\right)
  $$](img/527334_1_En_5_Chapter_TeX_Equa.png)


  其中 *α*[*i*]、*A*[*ij*] 和 *P*[*ij*] 均为常数。该函数通常在六维单位超立方体上进行评估，即对于所有 *j* = 1, …, 6，*x*[*j*]
  ∈ (0, 1)。全局极小值在 **x**^∗ = (0.20169, 0.150011, 0.476874, 0.275332, 0.311652, 0.6573)
  处取得，此时 *f* (**x**^(**∗**)) = −3.32237。


  让我们看看如何操作 BoTorch 中提供的哈特曼函数。首先，我们需要通过以下命令安装该包：


  ```

  >>> !pip install botorch

  ```


  接下来，我们将从 BoTorch 的 `test_function` 模块中导入它。此外，为了结果的可复现性，我们固定随机种子：


  ```

  from botorch.test_functions import Hartmann

  import numpy as np

  import torch

  import random

  SEED = 8

  random.seed(SEED)

  np.random.seed(SEED)

  torch.manual_seed(SEED)

  ```


  我们可以在最大化设置中创建一个取反后的六维哈特曼函数实例。检查最优值返回 3.32237。


  ```

  >>> neg_hartmann6 = Hartmann(dim=6, negate=True)

  >>> neg_hartmann6.optimal_value

  3.32237

  代码清单 5-1

  生成哈特曼实例

  ```


  该实例将用于提供无噪声的函数评估。接下来，我们将在 `train_x` 中按照均匀分布创建十个随机采样位置，并在 `train_obj` 中获取相应的观测值，这里我们使用
  `unsqueeze()` 函数将其转换为列向量：


  ```

  # 从均匀分布创建 10x6 的随机数

  train_x = torch.rand(10, 6)

  # 获取相应的函数评估值作为列向量

  train_obj = neg_hartmann6(train_x).unsqueeze(-1)

  ```


  打印 `train_obj` 会得到包含在张量中的以下结果：


  ```

  >>> train_obj

  tensor([[0.1066],

  [0.0032],

  [0.0027],

  [0.7279],

  [0.0881],

  [0.8750],

  [0.0038],

  [0.1098],

  [0.0103],

  [0.7158]])

  ```


  接下来，我们将构建一个基于高斯过程的代理模型，并使用 GPyTorch 提供的工具优化相关的超参数，这是前一章讨论的主题。


  ### 具有优化超参数的 GP 代理模型


  当底层代理模型是高斯过程，并且只有一个需要优化的目标值时，BoTorch 提供了 `SingleTaskGP` 类，用于在单任务设置下执行精确的 GP 推断。默认情况下，它使用带有
  Matérn 核和常数均值函数的 GP 先验。下面，我们使用之前生成的初始训练数据实例化一个 GP 模型：


  ```

  from botorch.models import SingleTaskGP

  model = SingleTaskGP(train_X=train_x, train_Y=train_obj)

  ```


  `model` 对象现在充当代理模型，并为单位超立方体内的任何采样位置提供后验均值和方差估计。


  超参数可以通过 `named_hyperparameters()` 方法访问，如下所示，输出被包装在一个列表中以便打印生成器对象：


  ```

  >>> list(model.named_hyperparameters())

  [(''likelihood.noise_covar.raw_noise'', Parameter containing:

  tensor([2.0000], requires_grad=True)),

  (''mean_module.constant'', Parameter containing:

  tensor([0.], requires_grad=True)),

  (''covar_module.raw_outputscale'', Parameter containing:

  tensor(0., requires_grad=True)),

  (''covar_module.base_kernel.raw_lengthscale'', Parameter containing:

  tensor([[0., 0., 0., 0., 0., 0.]], requires_grad=True))]

  ```


  根据输出，长度尺度的默认值在所有六个维度上均为零，噪声方差为二。为了使用最大似然原理优化这些超参数，我们首先获取一个包含精确边际对数似然（存储在 `mll` 中）的实例，然后使用
  `fit_gpytorch_model` 函数来优化 `GPyTorch` 模型实例的这些超参数。核心优化通过 `scipy.optimize.minimize()`
  函数使用 L-BFGS-B 过程。以下代码片段执行了超参数的优化：


  ```

  from gpytorch.mlls import ExactMarginalLogLikelihood

  mll = ExactMarginalLogLikelihood(model.likelihood, model)

  from botorch.fit import fit_gpytorch_model

  fit_gpytorch_model(mll);

  代码清单 5-2

  优化 GP 模型的超参数

  ```


  我们现在可以验证超参数，并检查这些值是否已更改。如下所示，超参数现在呈现不同的值，所有这些值都是通过最大化观测训练数据的边际对数似然而优化的：


  ```

