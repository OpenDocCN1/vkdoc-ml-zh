  ### 更新高斯过程后验


  在 BoTorch 框架中，我们关注与 GP 代理模型相关的两个对象：GP 模型本身，以及基于已收集观测数据集的对数边际似然。我们定义以下函数来处理初始条件数据集，并返回这两个对象：


  ```

  # 初始化 GP 模型

  from botorch.models import SingleTaskGP

  from gpytorch.mlls import ExactMarginalLogLikelihood

  def initialize_model(train_x, train_y):

  # 创建一个单任务精确 GP 模型实例

  # 默认使用 Matern 核函数和常数均值函数作为 GP 先验

  model = SingleTaskGP(train_X=train_x, train_Y=train_y)

  mll = ExactMarginalLogLikelihood(model.likelihood, model)

  return mll, model

  ```


  这里，我们使用`SingleTaskGP`类构建单输出 GP 模型，并通过`ExactMarginalLogLikelihood()`函数基于闭式表达式获取对数边际似然。随后，我们可以利用该函数创建两个变量，分别存储
  GP 模型及其对数边际似然，同时打印 GP 模型的超参数值：


