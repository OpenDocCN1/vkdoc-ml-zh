  ### 超参数调优


  核参数 *l* 和 *σ*[*f*] 在拟合高斯过程之前是固定的，通常被称为超参数。在上一节中，我们展示了不同*手动*设置的超参数对拟合结果的影响。与其逐一测试多种不同的组合，更好的方法是在高斯过程框架下，根据观测数据的特征自动确定超参数的值。由于我们已经可以获取这些观测值的边缘似然，一种常见的方法是选择能够最大化这些边缘分布联合对数似然的那组超参数。


  假设在位置 **x** 处共观测到 *n* 个含噪声的样本 **y**，它们服从均值为向量 **μ**、协方差矩阵为 **K**[*y*] 的联合高斯分布。我们使用
  *θ* = {*l*, *σ*[*f*]} 来表示所有超参数。边缘高斯分布的联合似然可以表示为：


  ![$$ p\left(\textbf{y}|\textbf{x},\theta \right)=N\left(\textbf{y}|\boldsymbol{\upmu},
  {\textbf{K}}_y\right) $$](img/527334_1_En_2_Chapter_TeX_Equae.png)


  然后，我们可以通过最大化联合似然来获得最优超参数 ![$$ \hat{\theta} $$](img/527334_1_En_2_Chapter_TeX_IEq27.png)：


  ![$$ \hat{\theta}={\textrm{argmax}}_{\theta }p\left(\textbf{y}|\textbf{x},\theta
  \right) $$](img/527334_1_En_2_Chapter_TeX_Equaf.png)


  代入多元高斯分布的定义，得到下式：


  ![$$ p\left(\textbf{y}|\textbf{x},\theta \right)=\frac{1}{\sqrt{{\left(2\pi \right)}^n\mid
  {\textbf{K}}_y\mid }}\exp \left(-\frac{1}{2}{\left(\textbf{y}-\boldsymbol{\upmu}
  \right)}^T{\textbf{K}}_y^{-\textbf{1}}\left(\textbf{y}-\boldsymbol{\upmu} \right)\right)
  $$](img/527334_1_En_2_Chapter_TeX_Equag.png)


  其中 ∣**K**[*y*]∣ 表示 **K**[*y*] 的行列式。然后，我们可以对联合似然取对数以消除指数项，转而最大化对数似然：


  ![$$ \log p\left(\textbf{y}|\textbf{x},\theta \right)=-\frac{1}{2}{\left(\textbf{y}-\boldsymbol{\upmu}
  \right)}^T{\textbf{K}}_y^{-\textbf{1}}\left(\textbf{y}-\boldsymbol{\upmu} \right)-\frac{n}{2}\log
  2\pi -\frac{1}{2}\log \mid {\textbf{K}}_y\mid $$](img/527334_1_En_2_Chapter_TeX_Equah.png)


  其中第一项衡量拟合优度，后两项则作为一种基于熵的惩罚项。我们可以通过假设 **μ = 0** 来进一步简化公式，得到：


  ![$$ \log p\left(\textbf{y}|\textbf{x},\theta \right)==-\frac{1}{2}{\textbf{y}}^T{\textbf{K}}_y^{-\textbf{1}}\textbf{y}-\frac{n}{2}\log
  2\pi -\frac{1}{2}\log \mid {\textbf{K}}_y\mid $$](img/527334_1_En_2_Chapter_TeX_Equai.png)


  在实践中，最优超参数 ![$$ \hat{\theta} $$](img/527334_1_En_2_Chapter_TeX_IEq28.png) 是通过最小化边缘分布的*负对数似然*（NLL）来找到的：


  ![$$ \hat{\theta}={\textrm{argmin}}_{\theta }-\log p\left(\textbf{y}|\textbf{x},\theta
  \right) $$](img/527334_1_En_2_Chapter_TeX_Equaj.png)


  让我们看看如何实现这一点。在下面的代码清单中，我们定义了一个函数，该函数接收训练数据和噪声水平，并返回一个基于指定参数（*l* 和 *σ*[*f*]）计算负对数边缘似然的函数。这是基于前面负对数似然定义的直接实现。


  ```

  from numpy.linalg import det

  from scipy.optimize import minimize

  # 直接实现，可能存在数值不稳定性

  def nll_direct(X_train, Y_train, noise) :

  """

  返回一个函数，用于计算给定训练数据 X_train 和 Y_train

  以及噪声水平的负对数边缘似然。

  参数:

  X_train: 训练位置 (m x d)。

  Y_train: 训练目标值 (m x 1)。

  Noise: Y_train 的已知噪声水平。

  返回:

  最小化目标函数。

  """

  Y_train = Y_train.ravel()

  def nll(theta):

  K = ise_kernel(X_train, X_train, l=theta[0], sigma_f=theta[1]) + \

  noise**2 * np.eye(len(X_train))

  return 0.5 * Y_train.dot(inv(K).dot(Y_train)) + \

  0.5 * len(X_train) * np.log(2*np.pi) + \

  0.5 * np.log(det(K))

  return nll

  代码清单 2-11

  计算负对数边缘似然

  ```


  我们可以调用 `numpy` 中的 `minimize` 函数，使用广泛使用的优化算法 `L-BFGS-B` 来执行最小化。优化过程从 *l* 和 *σ*[*f*]
  都等于 1 开始，并搜索最优参数。在实践中，通常会进行多轮不同起始点的搜索，以避免陷入相同的局部最小值。


  ```

  # 从 [1,1] 初始化，在 1e-5 到无穷大范围内搜索最优值

  res = minimize(nll_direct(X_train, Y_train, noise), [1, 1],

  bounds=((1e-5, None), (1e-5, None)),

  method=''L-BFGS-B'')

  l_opt, sigma_f_opt = res.x

  # 使用优化后的核参数计算后验均值和协方差，并绘制结果

  mu_s, cov_s = update_posterior(X_test, X_train, Y_train, l=l_opt,

  sigma_f=sigma_f_opt, sigma_y=noise)

  plot_gp(mu_s, cov_s, X_test, X_train=X_train, Y_train=Y_train)

