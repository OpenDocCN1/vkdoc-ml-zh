  ## 总结


  在本章中，我们深入探讨了单次知识梯度公式的内部工作原理及其在 BoTorch 中的实现细节。这种最近提出的采集函数具有吸引人的理论和实践特性。具体来说，我们涵盖了以下内容：


  *   原始的 KG 公式及其嵌套优化过程

  *   用于估计蒙特卡洛采集函数的重参数化技巧

  *   用于近似计算 KG 采集函数中期望运算的蒙特卡洛估计技术

  *   使用近似 KG 梯度估计器的多起点随机梯度上升算法来定位最大 KG 值

  *   通过样本平均近似推导单次 KG 采集函数

  *   BoTorch 中 OKG 优化过程的实现


