  def update_random_observations_cnn(best_random):

  """通过抽取一批新随机点来模拟随机策略，

  观察它们的值，并将当前最佳候选更新到运行列表中。

  """

  rand_x = torch.distributions.uniform.Uniform(0.0001,10).sample([BATCH_SIZE,1]).type(torch.DoubleTensor).cuda()

  rand_y = []

