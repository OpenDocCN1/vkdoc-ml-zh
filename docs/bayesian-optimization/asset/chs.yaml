  `BoTorch` 的特点在于其优化不同采集函数时的计算效率。在下一节中，我们将深入探究 `optimize_acqf()` 函数的内部核心，并进一步了解其基于自动微分的优化流程。


  ### 深入理解内部优化流程


  `BoTorch` 使用的默认优化器基于 `SciPy` 包中的 `scipy.optimize.minimize()` 函数，并采用了 `L-BFGS-B`
  算法。该功能封装在 `gen_candidates_scipy()` 函数中，该函数从一组初始候选点出发，对预设的采集函数进行优化。但首先，让我们看看如何设置多起点优化流程的起始条件。由于底层实现封装得相当完善，且有多层函数相互调用，我们仅重点介绍与当前上下文相关的主要部分：优化解析
  EI 并顺序提出候选搜索位置。


  任何优化流程都始于初始条件，即优化器的起始点，该点可以随机设置，也可以遵循某种启发式方法设置。初始条件由 `optimize_acqf()` 中的可选参数 `batch_initial_conditions`
  设定。由于该参数默认为 `None`，并且假设我们对生成初始优化条件没有先验偏好，`optimize_acqf()` 将使用 `gen_batch_initial_conditions()`
  函数选择一组起始点，以运行基于梯度的多起点算法。


  这组起始点（在 `BoTorch` 中也称为初始条件）是基于多项概率分布选择的，该分布的概率由采集函数的值决定，并额外通过一个温度超参数进行加权。选择初始条件涉及两个步骤：首先确定一个更大的随机位置集合（由
  `raw_samples` 参数指定），以尽可能覆盖整个动作空间；然后从中选出一个有潜力的候选位置子集作为初始起点（由 `num_restarts` 指定）。让我们详细看看这两个步骤。


  直观来说，一个好的初始条件在使用当前采集函数进行评估时，应具有相对较高的值。这需要构建一组空间填充点，以覆盖搜索空间的所有区域，避免遗漏任何大块搜索空间。尽管这些初始点是随机选择的，但直接遵循均匀分布并不能保证通过所提议的随机点集均匀覆盖整个搜索空间。相反，我们更希望得到一组彼此之间距离差异较小的拟随机序列点。


  为此，`BoTorch` 使用 Sobol 序列沿每个维度对单位超立方体进行均匀划分。换句话说，使用 Sobol 序列生成的拟蒙特卡洛样本可以更均匀地填充空间，从而实现更快的收敛和更稳定的估计。Sobol
  序列通过 `torch.quasirandom.SobolEngine` 类生成，该类接受三个输入参数：`dimension` 用于指定特征维度，`scramble`
  用于指定序列是否进行加扰，`seed` 用于指定随机数生成器的种子。


  在下面的代码片段中，我们在二维单位超立方体内生成了 200 个 Sobol 序列随机点。首先，通过指定相应的输入参数创建一个 `SobolEngine` 实例，并将其存储在
  `sobol_engine` 中。然后调用 `draw()` 方法在 `sobol_samples` 中生成 200 个随机点，这些点进一步分解为 `xs_sobol`
  和 `ys_sobol`，用于创建二维图：


  ```

  from torch.quasirandom import SobolEngine

  from matplotlib import pyplot as plt

  plt.figure(figsize=(6,6))

  sobol_engine = SobolEngine(dimension=2, scramble=True, seed=SEED)

  sobol_samples = sobol_engine.draw(200)

  xs_sobol = [x[0] for x in sobol_samples]

  ys_sobol = [x[1] for x in sobol_samples]

  plt.scatter(xs_sobol, ys_sobol)

