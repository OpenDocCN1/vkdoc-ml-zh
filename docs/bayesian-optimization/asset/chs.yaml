- '# 7. 案例研究：使用 BoTorch 调优 CNN 学习率


  至此，我们已经为典型的贝叶斯优化过程的理论内部机制奠定了良好基础：一个近似底层真实函数并在新数据到达时更新的代理函数，以及一个在不确定性下指导序贯搜索的采集函数。我们已经介绍了流行的采集函数选择，包括期望提升（EI，其闭式表达式在第
  3 章中推导得出）、更通用的蒙特卡洛采集函数（如知识梯度（KG，在第 6 章中通过多起点随机上升计算）），以及它们的并行版本（qEI 和 qKG）和多步前瞻扩展（均通过单次优化加速，同样在第
  6 章中介绍）。这一基础使我们受益匪浅，我们将通过两个案例研究来证明：一个模拟案例，旨在寻找六维 Hartmann 函数的全局最大值；一个实证案例，旨在寻找用于分类广泛使用的
  MNIST 数据集的卷积神经网络（CNN）的最优学习率。


  我们希望强调本章的另一个重要目的：使用 BoTorch 展示完整的贝叶斯优化生态系统，并为有兴趣在其各自问题领域应用这种原则性搜索策略的用户提供一个模板。尽管存在更集成、更用户友好的选项（例如
  Ax 平台），但我们仍将坚持本书“从头构建”的风格，这也让用户能够最大程度地掌控（并理解）其来龙去脉。


  ## 寻找 Hartmann 函数的全局最优解


  我们在第 5 章中遇到过 Hartmann 函数。在那里，我们演示了使用 qEI 进行单步搜索。现在，我们将扩展到多步搜索，比较和对比多种采集函数，并随着优化过程的进行来衡量搜索质量。


  为了唤起记忆，回想一下 Hartmann 函数是一个六维函数，有六个局部最小值和一个全局最小值。两个特点使其成为寻找该函数全局最小值的一项具有挑战性的任务：高维搜索空间和高度非凸的函数曲面。该函数形式如下：


  ![$$ f\left(\textbf{x}\right)=-{\sum}_{i=1}⁴{\alpha}_i\exp \left(-{\sum}_{j=1}⁶{A}_{ij}{\left({x}_j-{P}_{ij}\right)}²\right)
  $$](img/527334_1_En_7_Chapter_TeX_Equa.png)


  其中 *α*[*i*]、*A*[*ij*] 和 *P*[*ij*] 均为常数。搜索空间是一个六维单位超立方体，每个动作 *x*[*j*] ∈ (0, 1)，其中
  *j* = 1, …, 6。全局最小值在 **x**^∗ = (0.20169, 0.150011, 0.476874, 0.275332, 0.311652,
  0.6573) 处获得，此时 *f* (**x**^(**∗**)) =  − 3.32237。


