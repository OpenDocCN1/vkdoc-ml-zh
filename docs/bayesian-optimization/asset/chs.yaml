  ### 处理含噪声观测


  当观测值含有噪声时，观测输入的总方差将同时源于输入位置随机变量的不确定性以及噪声的方差。如前所述，噪声通常由测量误差或不精确的统计近似引起。我们可以照常估计观测输入处的无噪声协方差矩阵
  **K**，并将噪声方差添加到对角线元素（自协方差）上，从而得到含噪声协方差矩阵 ![$$ {\textbf{K}}_y=\textbf{K}+{\upsigma}_y²\textbf{I}
  $$](img/527334_1_En_2_Chapter_TeX_IEq26.png)。请参阅以下代码清单进行说明。


  ```

  # 设置噪声的标准差

  noise = 0.5

  # 创建含噪声的训练数据

  Y_train = np.cos(X_train) + noise * np.random.randn(*X_train.shape)

  # 计算后验分布的均值和协方差

  mu_s, cov_s = update_posterior(X_test, X_train, Y_train, sigma_y=noise)

  # 生成五个样本

  samples = np.random.multivariate_normal(mu_s.ravel(), cov_s, 5)

