  接下来的 `Video-script.js` 文件包含以下函数：


  *   `async function main()`：此函数仅执行并运行一次。当用户通过点击按钮从视频文件中读取相应数值进行交互时，初始设置在此处完成。视频文件的宽度和高度在此初始化。`ml5.poseNet()`
  创建一个新的 PoseNet 模型，以视频文件作为输入。


  *   `function modelReady()`：在视频文件被读取后，调用 `draw()` 函数来识别关键点。`video.play()` 函数会重复播放视频文件。


  *   `function draw()`：此函数无限循环调用 `drawImage()` 函数，以逐帧图像的方式显示视频，并指定宽度、高度、x 位置、y 位置以及要显示的视频。关键点和骨架用于在当前图像上绘制点和线。由于
  `draw()` 在无限循环中执行此操作，它会向用户显示连续输出，使其看起来像视频一样。


  *   针对行走特定距离所识别的测量值（针对关键点），是借助视频关键点的位置来测量的。


  *   `function document.addEventListener()`：为事件类型属性值为 `type` 的事件添加一个事件监听器。`callback`
  参数设置了在事件触发时将调用的回调函数。该回调函数是 `main()` 函数。


