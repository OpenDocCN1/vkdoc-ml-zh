  }\n清单 1-7\nMessage.js\n```\n\n### 用于事件驱动过程的 JavaScript\n\n通过利用 JS 进行事件驱动编程，可以实现动态网站开发。通常，在网站页面加载完成后，JS\
  \ 程序会持续运行（并等待事件发生）。如果你与网页进行交互，JS 脚本会执行与该交互（事件）对应的代码，并且页面的行为会根据事件而改变。图 1-10 借助 JS\
