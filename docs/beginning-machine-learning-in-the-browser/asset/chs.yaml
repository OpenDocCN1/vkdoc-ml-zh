  本章介绍两个在 TensorFlow.js 框架帮助下运行的新 JavaScript (JS) 库：face-api.js 和 handpose。不断发展的 JS
  库展示了一条探索可在浏览器和计算资源设备（计算能力较低的电子设备）上运行的实时响应式应用程序的路径。




  ## 引言


  如前面章节所述，人体姿态评估与其他基础计算机视觉任务存在显著差异。物体识别是在图像中定位物体，但这通常是粗粒度的，仅包含一个包围物体的边界框。而姿态评估更进一步，能够预测与人体相关的关键点的精确位置。


  本质上，二维（2D）评估测量的是关键点在二维空间中相对于图像或视频帧的位置。该模型会为人体每个关键点估算一个 x 和 y 坐标。三维（3D）评估则试图通过为预测结果添加
  z 坐标，将二维图像中的物体转换为三维物体。


  3D 评估使我们能够预测个人或物体的真实空间位置。正如你所料，考虑到制作数据集和算法时需要考虑图像或视频背景场景或光照条件的多种变量，3D 评估目前对机器学习（ML）研究者来说仍是一个具有挑战性的问题。


  在识别图像或视频中的一个或多个区域时存在区别。2D 和 3D 方法可分别称为单人评估和多人评估。单人评估方法用于识别和追踪一个人或物体，而多人评估方法则用于识别和追踪多个人或物体。


  通过思考姿态评估在各个方面的应用，我们可以清晰地想象其强大之处：从虚拟游戏教练和人工智能（AI）驱动的健身教练，到追踪工厂车间动态以确保工人安全。当前的 PoseNet
  评估方法可能会催生大量旨在测量人体运动精度的自动化工具。


  PoseNet 评估方法在多个领域（例如增强现实、动画、游戏和机器人技术）开辟了应用前景。这并非详尽无遗的列表，但涵盖了当前评估技术塑造我们未来的一些主要方式。


  TensorFlow.js 使机器学习研究者能够更轻松地让其他人使用他们的算法。例如，Magenta.js 库（Roberts 等人，2018）提供了对 Magenta
  团队创建并借助 TensorFlow.js 移植到网页的生成式音乐模型的应用内访问。Magenta.js 提高了其作品在目标受众（特别是音乐人）中的可见度。这催生了由社区构建的多种基于机器学习的音乐应用。示例包括
  Latent Cycles Parviainen (2018a) 和 Neural Drum Machine Parviainen (2018b)。你可以在 [`https://magenta.tensorflow.org/demos`](https://magenta.tensorflow.org/demos)
  找到这些及更多模型。


  TensorFlow.js 的一项基本技术贡献在于，它提供了一套方法，用于重新利用 Web 平台架构应用程序编程接口（API）以实现高性能数值计算，同时保持与大量设备和执行环境的兼容性。


  我们认为，扩展和增强 TensorFlow.js 存在诸多机会。鉴于浏览器技术的快速发展，很可能会有额外的 GPU 编程模型出现。具体来说，浏览器开发者正在讨论实现通用的
  GPU 编程 API（Apple 2017, W3C 2017），这将使这类工具箱性能更高、更易于维护。未来的工作将专注于提升性能、推进设备兼容性（尤其是手机），并扩大与
  Python TensorFlow 实现的等价性。我们还注意到，需要为完整的 AI 工作流程提供支持，包括数据输入、输出和转换。


  ## 使用 TensorFlow 的其他机器学习应用


  接下来的部分将讨论借助各种 JS 库在浏览器中运行的 AI 应用。


  ### 使用 face-api.js 进行人脸识别


  在浏览器中使用 TensorFlow 进行机器学习的面部检测和识别。face-api.js JS 模块执行卷积神经网络（CNN）来检测面部并识别人脸标记（关键点）。face-api.js
  使用 TensorFlow.js，并针对桌面端和移动端网页进行了优化。


  除了面部检测和识别，face-api.js 还提供了一些模型，可用于面部表情识别、个人年龄评估和性别判断。


  要开始使用 face-api.js，Web 开发者需要引入 face-api.js 的最新 JS 库，或使用 npm 进行安装。face-api.js 是根据
  MIT 许可证提供的开源软件。


