  \n\n\n## 使用 IDE/编辑器进行 Web 开发\n\n集成开发环境（IDE）与文本编辑器在 Web 开发中的区别在于，IDE 能够完成从基础内容管理到高级开发的所有工作，而这些是文本编辑器无法做到的。\n\
