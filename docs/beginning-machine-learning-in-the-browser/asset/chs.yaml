  \n图 4-4\n\n与回归问题相关的源代码及对应输出的截图\n\n\n\n### 将平面文件数据转换为 TensorFlow.js 格式\n\n以鸢尾花数据集为例，该数据集包含与多种花卉相关的\
  \ 15 个样本（行）的数据项。鸢尾花数据集采用 JSON 格式，如图 4-5 所示。为了将数据（即一个扁平的 `file(Array`）转换为 TensorFlow.js\
  \ 格式，`tf.tensor2D()` 函数有助于创建 TensorFlow.js 能够理解的数据。`setup()` 函数中的 `loadJSON()` 函数会将\
  \ iris.json 数据读取到浏览器应用的模型中。浏览器图形用户界面（GUI）可以自定义，以便与用户交互，接收诸如训练轮次和其他参数值等输入。\n\n![../images/503949_1_En_4_Chapter/503949_1_En_4_Fig5_HTML.jpg](img/503949_1_En_4_Fig5_HTML.jpg)\n\
  \n图 4-5\n\nJSON 格式的鸢尾花数据集\n\n基本上，JSON 文件包含了鸢尾花各种实例的属性-值对。清单 4-2a 是主文件，它调用了包含操作功能的相应脚本文件，这些功能在清单\
  \ 4-2b 中给出。\n\n脚本文件中的 `setup()` 函数负责设置画布窗口的大小以进行用户交互操作，加载 JSON 数据文件进行处理，并提供用户交互按钮来启动模型。\n\
  \n将 JSON 数据文件内容加载到用户定义的临时变量中，由 `loaddata()` 函数完成。存储在用户定义变量中的临时数据，由 `convertToTensor()`\
  \ 函数转换为张量数据结构。\n\n神经网络学习过程完成后（即执行 `trainModel()` 和 `nn_model()` 函数之后），模型数据存储在张量数据结构中。模型通过学习张量中存在的相应数据而得到训练，该过程由神经网络配置借助\
  \ `trainModel()` 和 `nn_model()` 函数执行。\n\n**注意** 你可以从 [`https://www.kaggle.com/rtatman/iris-dataset-json-versio`](https://www.kaggle.com/rtatman/iris-dataset-json-versio)\
  \ 下载 iris.json 数据集。\n\n```\nlet input, button\nlet IRIS_NUM_CLASSES =3\nlet nn_model;\n\
  let train_x;\nlet train_y;\nlet epoch_val;\nfunction setup()\n{\ncreateCanvas(710,\
  \ 400);\n// Loading Data\nloadJSON('iris.json',loadData)\n// GUI Form Elements\n\
  fill(0);\ntextSize(30)\ntext('Train Model',10,50)\ntextSize(18)\ntext('Train Epochs:',10,90)\n\
  input = createInput();\ninput.position(140, 80);\nbutton = createButton('Train Model\
  \ From Scratch');\nbutton.position(20,110, 200);\nlet col = color(255,127,80)\n\
  button.style('background-color', col);\nbutton.size(200,40)\nbutton.mousePressed(greet);\n\
  }\n//The functions loaddata() and converttoTensor()to //convert the data into tensorflow\
  \ objects(tensor2D() //objects):\nfunction loadData(data)\n{\nconst values = data.map(item\
  \ => ({\na: item.sepalLength,\nb: item.sepalWidth,\nc: item.petalLength,\nd: item.petalWidth,\n\
  label: item.species\n}));\nconst dataset = values.filter(item => (\nitem.a != null\
  \ && item.b != null && item.c != null && item.d != null && item.label != null\n\
  ));\nconst {inputs, labels} = convertToTensor(dataset);\ntrain_x = inputs\ntrain_y\
  \ = labels\nconsole.log(train_x.shape[0])\n}\nfunction convertToTensor(dataset)\n\
  {\nreturn tf.tidy(() => {\ntf.util.shuffle(dataset);\nconst inputs = dataset.map(item\
  \ => [item.a, item.b, item.c, item.d])\nconst labels=[];\nfor(i=0;i0)\n{\nnn_model\
  \ = createModel()\ntfvis.show.modelSummary({name: 'Model Summary'}, nn_model);\n\
  if(train_x.shape[0] >0 && train_y.shape[0] >0 )\ntrainModel(nn_model)\n}\n}\n//\
  \ Function createModel() tf.sequential(),adding //input layers through tf.layers.dense\
  \ and //trainModel() with the model.fit() methods\nfunction createModel()\n{\nconst\
  \ model = tf.sequential();\nmodel.add(tf.layers.dense({inputShape: [4], units: 50,\
  \ useBias: true, activation:'relu'}));\nmodel.add(tf.layers.dense({units: 20, activation:\
  \ 'relu'}));\n//model.add(tf.layers.dense({units: 10, activation: 'relu'}));\nmodel.add(tf.layers.dense({units:\
  \ 3, activation: 'softmax'}));\nreturn model;\n}\nasync function trainModel(model)\n\
  {\nmodel.compile({\noptimizer: tf.train.adam(),\nloss: tf.losses.softmaxCrossEntropy,\n\
  metrics: ['accuracy'],\n});\nconst batchSize = 32;\nconst epochs = epoch_val;\n\
  const validationSplit =0.3;\nreturn await model.fit(train_x, train_y, {\nbatchSize,\n\
  epochs,\nvalidationSplit,\nshuffle: true,\ncallbacks: tfvis.show.fitCallbacks(\n\
  { name: 'Training Performance' },\n['loss', 'val_loss','acc','val_acc'],\n{ height:\
  \ 200, callbacks: ['onEpochEnd'] })\n});\n}\nListing 4-2b\nscript10.js\n```\n\n\
  ```\n\nIris Dataset Classification\n\nListing 4-2a\nTensorFlow.js. index.html function\
  \ setup() to Load the .json Data\n```\n\n图 4-6 展示了使用 TensorFlow.js 可视化工具得到的训练过程及轮次准确率的相关输出。\n\
