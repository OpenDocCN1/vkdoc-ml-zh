  \n## PoseNet 模型的输入、输出和数据结构\n\n本节涵盖当输入为视频数据时程序中可用的各种函数。这将帮助你理解可用于在浏览器上渲染（加载）视频并在发生任何移动（变化）时识别各种姿态的各种函数（方法）。\n\
  \nPoseNet 使你能够评估图片或视频中的单一姿态（即一个人的单个姿态）或多人的多种姿态，这意味着该算法的一种版本只能识别图片/视频中的一个人，而另一种版本则可以识别图片/视频中的多个人。\n\
  \n### 输入\n\n在这种情况下，输入是 HTML 视频或图像元素（图片），或页面的 p5 图像/视频元素。如果未提供特定输入，PoseNet 默认使用浏览器的网络摄像头作为输入。以下代码片段展示了如何读取一个人的输入（姿态）：\n\
  \n```\nconst video = document.getElementById(\"video\");\n// 创建一个新的 myposeNet 方法\n\
  const myposeNet = ml5.poseNet(video, modelLoaded);\n// 当模型在浏览器中加载完成时\nfunction modelLoaded()\
  \ {\nconsole.log(\"模型已加载！\");\n}\n```\n\nPoseNet 方法的各种参数如下：\n\n*   `ml5.poseNet(video[可选],\
  \ type[可选], callback[可选])`\n\n*   `ml5.poseNet(video[可选], options[可选], callback[可选])`\n\
  \n*   `ml5.poseNet(callback[可选], options[可选])`\n\n表 3-1 描述了 `ml5.poseNet` 方法的参数。\n\
  \n表 3-1\n\nml5.poseNet 参数\n\n![../images/503949_1_En_3_Chapter/503949_1_En_3_Figa_HTML.png](img/503949_1_En_3_Figa_HTML.png)\n\
  \n### 输出\n\n当一个人的姿态在浏览器上加载时（即浏览器网络摄像头读取视频流数据），相应的姿态（关键点）会由 `poseNet()` 函数作为结果（输出）给出。这些结果（输出）随后被传递给临时程序变量\
  \ `myposes`，如下所示：\n\n```\n// 当姿态方向发生变化时，监听新的 'pose' 事件。\nmyposeNet.on(\"pose\",\
  \ function(results) {\nmyposes = results;\n});\n```\n\n### .on() 函数\n\n`.on ('pose',\
  \ function(results))` 方法在检测到新姿态时触发一个事件。该方法持续监听视频帧中姿态的变化。函数（results）以包含姿态识别结果的对象数组形式返回结果。\n\
  \n### 总结\n\n本章逐步向你展示了如何使用 Dan Oved 的 PoseNet 模型在浏览器中实时描绘人体姿态估计。\n\n你学习了 PoseNet\
  \ 模型的细节，例如姿态包含的内容：姿态置信度分数、一个包含 17 个关键点的数组，以及每个关键点又包含关键点位置、关键点置信度分数以及输入图像空间。\n\n\
  本章还涵盖了处理收集到的关键点数据所需的编程结构。在接下来的章节中，你将学习开发多种应用（如人体姿态分类和步态分析）所需的编程技能。\n\n\n\n"
- "# 4. 人体姿态分类\n\n本章涵盖各种人体姿态估计实验。在前一章中，你已经学习了在浏览器中进行人体姿态估计的基础知识。\n\n本章首先探讨为何需要在浏览器中进行人体姿态估计，随后将讨论各种可以在浏览器中执行的人工智能（AI）和机器学习（ML）分类技术。\n\
  \n本章还提供了对开源 JavaScript（JS）库 TensorFlow.js 的高级概述。你将学习如何使用它在浏览器中实现和部署深度学习（DL）系统。讨论涵盖了\
  \ TensorFlow.js 框架的架构及其构建模块张量，并包含两个使用该库在浏览器上运行神经网络程序的实践示例。请注意，TensorFlow.js 是一个用于\
  \ JS 中 ML 的库，它使你能够用 JS 开发 ML 模型，并直接在浏览器或 Node.js 中使用 ML。\n\n本章还包含实践示例，涵盖通过浏览器摄像头和本地存储的图片（图像）检测个体关键点。\n\
  \n## 在浏览器中进行人体姿态估计的必要性\n\n人体姿态估计是评估人体姿态分类以预测可能出现的异常所需的一项任务。人体姿态评估将指示个体在进行日常活动时的分类水平。人们希望在不泄露隐私的情况下计算自己的姿态；因此，人体姿态计算更倾向于在客户端而非数据收集的服务器端进行。所以，借助\
  \ AI 方法进行的人体姿态分类（判定）应在客户端（即浏览器应用程序）执行。\n\n在浏览器中应用 ML 技术进行人体姿态估计并评估分类性能的必要性如下：\n\n\
  *   **隐私**：在浏览器中执行 ML 方法和用户数据的规定将确保数据不会传输到服务器。与敏感文档、医疗应用数据（如用户身份识别）以及特定领域的用户文本相关的数据将仅在客户端（用户端）处理。因此，通过在客户端应用程序（即浏览器）本身实现\
  \ ML 方法，可以维护用户隐私。\n\n*   **无需跨多个软件共享数据（分发）**：可以避免依赖多个软件/工具来执行数据。无需安装额外的软件/工具。应用程序将在用户端执行，因此导航到多种方法将变得容易。\n\
  \n*   **低延迟**：ML 模型可以进行优化，以实现高效的存储和速度，从而在资源受限的设备上非常高效地运行。因此，可以减少/避免等待服务器响应的时间（客户端/服务器模型\
  \ Web 应用程序中的往返时间）。如果应用程序仅在客户端执行，运行速度会更快。\n\n*   **可靠性**：由于不存在间歇性的连接步骤，可以避免可靠性问题。数据不会传输到另一个位置（服务器）。因此，在客户端处理的数据非常可靠。\n\
  \n*   **用户交互性**：当今的技术浏览器与摄像头和屏幕等输入输出设备集成。这种集成支持丰富的用户交互体验。ML 可以轻松增强用户交互性，尤其是在实时操作中。\n\
  \n此外，在浏览器（客户端）上执行 ML 方法（模型）适用于迁移学习、现有模型的参数调整以及输出解释等任务。\n\n## 浏览器中的 ML 分类技术\n\n神经网络概念是一组\
  \ ML 方法/算法，其行为方式类似于大脑的工作方式，使用人工神经元结构。神经网络是多种有助于解决分类问题的 ML 方法之一。其新颖之处在于能够强有力地做出详细预测，并在合理执行时间内模仿人类思考。本章不会深入探讨神经网络的细节，但你将学习神经网络的基础知识，以便更好地理解所呈现的问题。\n\
  \n有许多强大的方法可以自动分类实体。应用需求决定了解决分类问题的理想选择，以及应用神经系统的努力是否值得。人工神经网络（ANN）和深度神经网络（DNN）在解决复杂维度问题方面是成功的；然而，它们本身在理论上也很复杂。一些深度学习系统，即\
  \ DL 框架，如 TensorFlow，可以帮助你更快地设置深度神经系统，只需几行代码。\n\n分类模型预测类标签，使其属于特定实体。一些分类器是成对的，产生是/否的选择。其他的是多类分类器，能够将事物分类到几个类别之一。特征化是\
  \ AI 的另一个常见用例。例如，分类算法用于解决电子邮件垃圾邮件过滤、文档分类、语音识别、图像识别和手写识别。在这种特定情况下，神经系统是一些可以帮助解决分组问题的\
  \ AI 计算。其独特品质在于能够逐步做出详细预测并模仿人类推理，这是其他算法无法做到的。在与分类问题相关的许多案例中，神经系统已经产生了最佳结果。\n\n要理解使用神经系统的分类问题，有必要弄清楚其他顺序计算的工作原理，并理解它们的独特品质。对于某些问题，神经系统可能是不合适或无意义的练习。对于其他问题，它可能是核心解决方案。ANN\
  \ 由称为神经元的基本组件构成，这些神经元接收值，乘以权重，然后通过一个非线性激活函数运行。只要存在足够的计算能力，神经网络就能高效地学习非线性属性。该系统可以学习极其复杂的能力。理论上，只要有足够的计算能力，神经系统就能学习几乎任何能力的状态。\n\
  \n*   **ANN 优点**：对于解决大维度问题极其强大，能够处理因素之间的复杂关系、非彻底分类集以及与产出因素相关的复杂能力。有出色的调整选项来防止过拟合和欠拟合。\n\
  \n*   **ANN 缺点**：理论上复杂，难以实现，并且需要专业知识来调整参数以获得更好的分类。有时，需要大量的训练样本集才能更好地实现（获得更好的输出）。\n\
  \n注意\n\n使用 TensorFlow.js 库在程序中制作你的神经网络并训练它。收集数据并准备你的神经组织，或利用现有信息逐步准备你的神经组织。当它准备好时，你的神经网络将相应地执行分类或回归任务。\n\
  \n通过浏览器完全在客户端运行 AI/ML 程序是一个交互式应用程序，这很智能。诸如人体姿态估计之类的应用程序可以使用开源 JS 库 TensorFlow.js\
  \ 来实现。\n\n\n\n## 使用 TensorFlow.js 进行机器学习\n\nTensorFlow.js 用于完全在浏览器中，通过 JavaScript\
  \ 和应用程序编程接口（API）方法来描述、训练和运行 AI 模型。如果你是一名 JavaScript 网页开发者，并且是机器学习新手，那么 TensorFlow.js\
  \ 是开始学习和开发在浏览器中融入智能的应用程序的绝佳方式。然而，如果你是一名机器学习设计师，并且是 JavaScript 新手，本书中的材料将为你提供一个快速入门指南，介绍\
  \ TensorFlow.js 资源如何帮助你开发智能应用程序。\n\n在使用 TensorFlow.js 开发应用程序时，你可能会倾向于以下方法之一：\n\n\
  *   你可以导入一个预训练模型用于推导（推理）。如果你有一个 TensorFlow 或 Keras 的现有模型，并且该模型是在离线模式下准备的，你可以将其转换为\
  \ TensorFlow.js 格式，并加载到浏览器中进行推理。\n\n*   对于快速开发应用程序，迁移学习方法可能很合适。这种方法允许你使用 TensorFlow.js，通过\
  \ JavaScript 和 API 层，完全在浏览器中描述、训练和运行模型。如果你熟悉 Keras，那么 API 层应该会让你感到熟悉，可以轻松地将其转换为新模型。\n\
  \n*   网页开发者可以使用 TensorFlow.js，利用 JavaScript 特性，完全在浏览器中描述、训练和执行模型。\n\nTensorFlow.js\
  \ 是一个用于 AI 的 JavaScript 库系统，它取代了 deeplearn.js，后者现在被称为 TensorFlow.js Core。TensorFlow.js\
  \ 还包含一个 Layers API，这是一个用于构建利用 Core（例如，用于移植 TensorFlow 和 Keras 模型的设备）的 AI 模型的高级库。图\
  \ 4-1 展示了 TensorFlow.js 的概览。\n\n![../images/503949_1_En_4_Chapter/503949_1_En_4_Fig1_HTML.jpg](img/503949_1_En_4_Fig1_HTML.jpg)\n\
  \n图 4-1\n\nTensorFlow.js 概览\n\n你可以直接在浏览器中创建/构建模型。此外，你还可以从 Python 导入现有的、先前准备好的模型，并对其进行重新训练。如果你已经在使用\
  \ JavaScript 技术栈，并涉及非关系型数据库（NoSQL）和 JavaScript 对象表示法（JSON），那么你应该考虑的一个用例是利用 TensorFlow.js\
  \ 在浏览器中构建模型。TensorFlow.js 包含了 Keras API，这是一个用于构建 AI/ML 学习模型的简单软件工具。它同样包含一个较低级别的\
  \ API，以前称为 deeplearn.js，可用于直接的基于变量的数学运算和编程式微分。Ops API 支持即时执行模式。在底层，TensorFlow.js\
  \ 由 WebGL 驱动，WebGL 是一个 JavaScript API，用于在任何互联网浏览器中渲染 2D 和 3D 图形，而无需插件模块。\n\n注意\n\
  \nTensorFlow 即时执行模式是一种命令式编程环境，它会立即评估操作，而无需构建计算图。相反，操作会返回具体的值，而不是构建一个稍后运行的计算图。这使得入门\
  \ TensorFlow 和调试模型变得容易。TF CPU（中央处理器）、TF GPU（图形处理器）和 TF TPU（张量处理器）是分布式策略，模型可以在相应的设备上执行。\n\
  \n如果神经网络学习过程的信息有限，那么像 Tensorflow 这样的工具在计算上是高效的，可以实现更好的实现。假设需要处理大型数据集，那么像 NVIDIA\
  \ GPU/Google TPU 或现场可编程门阵列（FPGA）这样的统一计算设备架构（CUDA）系统就非常必要。基本上，Tensorflow 工具基于 JavaScript（JS）编程执行。它将通过\
  \ WebGL API 支持 GPU 进行高效的数据处理，这比 CUDA 系统更好。\n\nTensorFlow.js 是一个用于在 JavaScript 中创建和准备\
  \ AI 模型，并将其发送到程序或 Node.js 上的库。你可以利用现有模型，转换 Python TensorFlow 模型，使用迁移学习用你的信息重新训练现有模型，以及从头开始创建模型。TensorFlow.js\
  \ Node.js 环境支持使用 Python/C TensorFlow 的引入工作作为后端，这可能会利用机器的可用设备加速，例如 CUDA。Node.js 也有一个基于\
  \ JS 的后端。然而，其能力是有限的。TensorFlow.js 有多个具有不同特性的后端。WebGL 后端利用 WebGL 表面进行存储，利用 WebGL\
  \ 着色器进行执行，从而提供 GPU 支持，并且其速度可比直接的 CPU 后端快 100 倍。WebGL 不需要 CUDA，因此它可以利用任何可用的 GPU。\n\
  \n用于程序的 WebAssembly（WASM）TensorFlow.js 后端利用 XNNPACK 库来提升神经网络管理器的 CPU 执行性能。WASM 后端通常比\
  \ JS CPU 后端快得多（10 倍到 30 倍），但通常比 WebGL 后端慢（除了小型模型）。你的实际效果可能会有所不同，因此请在你的设备上为你的模型测试\
  \ WASM 和 WebGL 两种后端。\n\n示例：TensorFlow.js 的基本用法，考虑一个关于薪资和经验属性关系的线性回归问题，如图 4-2 所示。\n\
  \n![../images/503949_1_En_4_Chapter/503949_1_En_4_Fig2_HTML.jpg](img/503949_1_En_4_Fig2_HTML.jpg)\n\
  \n图 4-2\n\n线性回归问题（工作年限 vs. 薪资）\n\n即使我们没有确切的数据，我们也可以从图 4-2 推断出特定 x 值对应的 y 值。在机器学习中，我们可以基于输入数据训练一个模型，我们在浏览器中借助\
  \ JavaScript 特性来完成这项工作。图 4-3 显示了趋势线以及 x 和 y 之间的关系。\n\n![../images/503949_1_En_4_Chapter/503949_1_En_4_Fig3_HTML.jpg](img/503949_1_En_4_Fig3_HTML.jpg)\n\
  \n图 4-3\n\nx 和 y 之间的关系（工作年限 vs. 薪资）\n\n清单 4-1a 和 4-1b 提供了使用 TensorFlow.js 来说明前述回归问题的相应代码。主文件包含了\
  \ TensorFlow.js 并调用了相应的脚本文件。\n\n```\nasync function learnLinear() {\nconst model=\
  \ tf.sequential();\nmodel.add(tf.layers.dense({units: 1,inputShape: [1]}));\nmodel.compile({\n\
  loss: 'meanSquaredError',\noptimizer: 'sgd'\n});\nconst\n清单 4-1b\nTF_JS_1.js\n```\n\
