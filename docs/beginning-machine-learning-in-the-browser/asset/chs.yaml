  \n*   *统一资源定位符*：用于定位网络上特定资源的唯一标识符。\n\n*   *标记语言*：定义超文本文档的结构和内容。\n\n### 使用 HTML 组织网页\n\
  \n要设计和开发网页，你需要彻底熟悉超文本标记语言。HTML 使你能够定义网页的结构，包括章节、列表、标题、连接点、图片、混合媒体播放器等。\n\nHTML 不是一种编程语言。它是一种标记语言，告诉互联网浏览器如何构建用户访问的网页。HTML\
