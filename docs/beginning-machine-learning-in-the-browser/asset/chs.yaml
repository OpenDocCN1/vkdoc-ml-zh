  ## 总结


  TensorFlow.js 使 Web 开发者能够完全在浏览器或资源受限的设备中准备和运行 AI 模型。对于 JS 开发者来说，这是探索 AI 世界进步的一个绝佳方式。最棒的是，它不像
  CoreML 那样只能在 Apple 环境中运行。TensorFlow.js 可以运行在 iOS、macOS、Linux、Android 以及任何支持浏览器的平台上。


  我相信本章中提到的库会激励你开始构建令人惊叹的 AI 驱动的 Web 应用程序。

