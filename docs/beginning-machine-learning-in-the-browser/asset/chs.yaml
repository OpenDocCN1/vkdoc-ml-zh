- "# 3. 浏览器中的人体姿态估计\n\n本章介绍人体姿态估计，这是一项旨在通过图片和视频理解人体运动的计算机视觉技术。本章讨论了通过机器学习方法估计人体姿态的各种方式，重点介绍了\
  \ Dan Oved 的 PoseNet 方法。\n\nPoseNet 是一个机器学习模型，通过识别人体和面部的不同关键点，实现实时人体姿态估计。本章将逐步指导你编写代码，以识别人脸的各种姿态（关键点）。编程指令将教你如何收集和管理与这些关键点相关的数据。此过程将帮助你估计其他重要的人体姿态关键点，并理解其分类模式，后续章节将对此进行讨论。\n\
  \n## 人体姿态概览\n\n人体姿态评估是计算机视觉领域在过去几十年中一直努力攻克的重要课题。它是理解图片和视频中个体的关键性进步。\n\n人体姿态估计是通过在静态图像或视频中定义人体关节（也称为*关键点*：如肘部、手腕等）来完成的。它也被描述为在所有姿态空间中寻找特定姿态的过程。\n\
  \n人体二维姿态的基础是从 RGB（红、绿、蓝）图像中为人体姿态的每个关节估计一个二维坐标 (x, y)。人体二维姿态估计可用于评估（并分析，有望改进）足球运动员（或其他运动员）在比赛中的特定动作。步态分析可用于监测并早期诊断与此相关的潜在问题。\n\
  \n### PoseNet 与 OpenPose 对比\n\n你可以利用各种库在计算设备上实现人体姿态估计，例如由 Ross Wightman 开发以及来自卡内基梅隆大学的\
  \ PoseNet。PoseNet 专为在浏览器和手机等轻量级计算设备上运行而构建，而 OpenPose 则精确得多，旨在图形处理单元（GPU）驱动的系统上运行。\n\
  \n注意\n\n与在非 GPU 电子设备上运行相比，在 GPU 驱动的系统上运行 AI/ML 程序成本更高、更复杂（且灵活性更低）。\n\nPoseNet 对二维系统的输出处理速度很快，但可能会在视频中遗漏一些姿态，你可以通过骨架的闪烁和消失来判断这一点。尽管如此，如果你确实需要在资源受限的设备上（例如手机或计算资源较少的嵌入式系统，如处理能力有限、存储空间小、通信负载少且需要快速响应）使用\
  \ PoseNet，那么 PoseNet 是正确的选择。当 AI 方法在浏览器或轻量级计算资源上执行时，使用 PoseNet 进行人体姿态估计将使用户能够近乎实时地做出智能决策。\n\
  \n你可以通过在 Web 应用程序中采用更好的数据处理流程来提高 PoseNet 的估计精度，从而生成更优的推理结果。\n\n## 使用神经网络进行人体姿态估计\n\
  \n在文献中，许多人体姿态估计方法都采用了不同研究团队提出的神经网络原理。以下各节简要描述了人体姿态估计方法的演变。\n\n### DeepPose：通过深度神经网络进行人体姿态估计\n\
  \nDeepPose 是将深度学习应用于人体姿态评估的主要开创性论文。它实现了最先进的性能，并超越了现有模型。在该方法中，姿态评估被详细描述为一种基于卷积神经网络（CNN）的针对身体关节的回归问题。此外，该方法利用一系列回归器来细化姿态评估并改进估计值。该方法的一个重要之处在于，它从整体设计上解释姿态（即，某些关节是否被遮挡；如果从整体上考虑姿态，这些关节也可以被评估）。该论文认为，CNN\
  \ 通常能提供可行的姿态并显示可靠的结果。作者指定的方法生成的 xy 坐标值并不精确，因为它显示的多方面（多组值）不足以描述人体的特定关节。\n\n### 使用卷积网络进行高效目标定位\n\
  \n该方法通过以多种分辨率处理图像来生成热力图，从而在不同尺度上捕捉关节。其输出是离散的热力图，而非连续的回归值。热力图预测每个像素处关节出现的概率。这种输出模型很有用，后续许多论文都采用了预测热力图而非直接回归的方法。作者考虑了\
  \ CNN 与图形模型的联合使用。\n\n### 卷积姿态机\n\n卷积姿态机是可微分的，其多阶段架构可以端到端地进行训练。它们为学习丰富的特定空间模型提供了一个顺序预测框架，并且在人体姿态方面表现非常出色。该论文的主要动机之一是学习长距离的空间关系，并且他们表明这可以通过使用深度多阶段网络来实现。论文在每个阶段之后使用了中间监督，以避免梯度消失问题，这是深度多阶段组织中的一个常见问题。\n\
  \n### 基于迭代误差反馈的人体姿态估计\n\n该方法一次性直接预测结果。它利用一个自调整模型，通过处理反馈数据逐步修正初始排列，这个过程被称为*迭代误差反馈*。\n\
  \n### 用于人体姿态估计的堆叠沙漏网络\n\n堆叠沙漏网络是一种新颖且直观的设计，它超越了以往所有技术。之所以称为堆叠沙漏网络，是因为该组织由池化和上采样层（形似沙漏）的步骤组成，并且这些步骤被堆叠在一起。沙漏的设计源于捕捉每个尺度上信息的需求。\n\
  \n### 人体姿态估计与跟踪的简单基线\n\n早期方法整体表现良好，但较为复杂。在 COCO 数据集上实现了 73.7% 的平均精度（mAP）的最优结果。该网络结构简单，由残差神经网络（ResNet）和末尾的几个反卷积层组成。\n\
  \n### 用于人体姿态估计的深度高分辨率表示学习\n\n在使用特定数据集进行单人关键点检测和多人姿态估计方面，高分辨率网络模型优于之前的方法。与前述方法相比，该方法表现良好。\n\
  \n本节简要描述了人体姿态估计领域中最突出和最具影响力的模型。这些方法基于深度学习技术，具有不同的准确率百分比。\n\n\n\n## 使用 ml5.js:posenet()\
  \ 方法\n\n尽管有多种方法可以估算人体姿态关键点，但 Dan Oved 的 PoseNet 模型能够在浏览器和资源受限的计算设备上进行[实时人体姿态估计](https://medium.com/tensorflow/real-time-human-pose-estimation-in-the-browser-with-tensorflow-js-7dd0bc881cd5)。本节概述了使用\
  \ `ml5.posenet` 方法收集人体姿态估计的步骤。\n\n注意\n\n我们将逐步在 `1.js` 脚本文件中添加指令（代码），以捕获视频并识别人体姿态关键点，以便您更好地理解浏览器应用程序的开发过程。\n\
