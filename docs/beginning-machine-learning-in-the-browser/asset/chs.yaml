  \n图 4-6\n\n从 JSON 文件读取输入的截图（输出）\n\n## 在浏览器中使用 TensorFlow.js 的人工神经网络模型\n\n1.  加载或准备数据。\n\
  2.  设置你的神经网络结构。\n3.  向神经网络添加配置信息。\n4.  训练你的神经网络。\n5.  利用训练好的模型进行预测。\n6.  利用获得的结果完成某些任务（分类/预测）。\n\
  \n下一节将简要描述一个简单的神经网络，然后介绍通过 TensorFlow.js 编程原理开发人工神经网络的复杂性。\n\n### 简单神经网络\n\n考虑一个神经网络结构，它包含一个隐藏层，用于实现函数\
  \ y(output)=x'（x 的逆函数），隐藏层有四个神经元，输入层有两个神经元，输出层有一个神经元，其中 x 是输入集（见图 4-7）。\n\n![../images/503949_1_En_4_Chapter/503949_1_En_4_Fig7_HTML.png](img/503949_1_En_4_Fig7_HTML.png)\n\
  \n图 4-7\n\n人工神经网络的基本结构\n\n构建神经网络通常是通过堆叠层来完成的。TensorFlow.js 提供了一个 API 来堆叠各种类型的层。需要考虑配置的各种参数数量比你预期的要多。原因之一是此模型包含了权重和偏置值。目前，你可以通过那些有助于改进模型的参数，来考虑从一层到另一层的倾向。在整个训练过程中，误差会不断减小；这意味着我们的模型正在学习。\n\
  \n\n\n### 示例 1：TensorFlow.js 中的神经网络模型\n\n清单 4-3a 位于主索引文件中，清单 4-3b 是脚本文件，其中包含用于在张量中保存数据的数据结构，以及用于实现逆运算功能的神经网络模型的设置和配置。\n\
  \n```\n//Step 1:load data, xs=Input and ys=Output\nconst xs=tf.tensor2d([[0,0],[0.5,0.5],[1,1]]);\n\
  const ys=tf.tensor2d([[1],[0.5],[0]]);\n//Step 2: Set your neural network structure\n\
  const model =tf.sequential();\nconst confighidden={\ninputShape:[2],\nunits:4,\n\
  activation:'sigmoid'\n}\nconst configoutput={\nunits:1,\nactivation:'sigmoid'\n\
  }\nconst hidden =tf.layers.dense(confighidden);\nconst output=tf.layers.dense(configoutput);\n\
  model.add(hidden);\nmodel.add(output);\n//Step 3: add configuration information\n\
  const sgdopt=tf.train.sgd(0.1);\nconst config={\noptimizer:sgdopt,\nloss:'meanSquaredError'\n\
  }\n//Step 4: Train your neural organization\nmodel.compile(config);\nasync function\
  \ train()\n{\nfor(let i=0;i<100;i++){\nconst res=await model.fit(xs,ys);\n}\nconsole.log('training\
  \ complete');\n}\ntrain();\n//Step 5: Predict the output for the given input\nmodel.predict(xs).print();\n\
  ```\n\n清单 4-3b\nScript.js（脚本文件）\n\n```\n\n一个简单的神经网络模型\n\n用于演示 y=x'（Y 等于 X 的逆）的神经网络\n\
  \n清单 4-3a\nDemo1.html（主文件）\n```\n\n图 4-8 显示了上述代码在浏览器控制台中的输出。\n\n![../images/503949_1_En_4_Chapter/503949_1_En_4_Fig8_HTML.jpg](img/503949_1_En_4_Fig8_HTML.jpg)\n\
  \n图 4-8\n\n使用 TensorFlow.js 通过人工神经网络实现 y=x' 的截图（输出）\n\n### 示例 2：一个实现“与非”（NAND）布尔运算的简单人工神经网络\n\
  \n“与非”（NAND）布尔运算规则很简单：给定两个布尔值（真/假），如果两者都为真，则返回假；否则返回真。基于输入值实现此运算的神经网络可以通过应用 TensorFlow.js\
  \ 脚本库中的顺序模型来演示。\n\n图 4-9 显示了基本的逻辑与非运算，其对应的功能如真值表所示。\n\n![../images/503949_1_En_4_Chapter/503949_1_En_4_Fig9_HTML.jpg](img/503949_1_En_4_Fig9_HTML.jpg)\n\
  \n图 4-9\n\n基本逻辑与非门及其真值表\n\n用于实现 NAND 布尔运算的训练数据使用两个数组，一个用于输入（X0 和 X1），另一个用于输出（Y）。这两个数组是可在神经网络结构中使用的张量：\n\
  \n```\n//Step 1: Load or prepare the data\nconst xs=tf.tensor2d([[0,0],[0,1],[1,0],[1,1]],[4,2]);\n\
  const ys=tf.oneHot(tf.tensor1d([1,1,1,0]).toInt(),2);\n```\n\n因此，输入数组的形状是 [4,2]，因为有一个包含\
  \ 4 个值的数组，并且每个数组有 2 个值。最好使用适当的 TensorFlow.js 函数来提及这些数组（输入和输出）。\n\n一旦定义了输入和输出，就可以以层的形式构建神经系统。由于数据从输入层到输出层沿一个方向向前移动，我们可以考虑为神经系统结构使用一个*顺序模型*，如前面的示例所示。由\
  \ X0 和 X1 组成的输入被传递到下一层（隐藏层），该层由 5 个神经元组成。然后它们被传递到由 2 个神经元组成的输出层，这向我们显示了相关输出（真或假）的确定性百分比（介于\
  \ 1 和 0 之间的值）：\n\n```\n//Step 2: Set up the NN structure\nconst model =tf.sequential();\n\
  const confighidden={\ninputShape:[2],\nunits:5,\nactivation:'sigmoid'\n}\nconst\
  \ configoutput={\nunits:2,\nactivation:'sigmoid'\n}\nconst hidden =tf.layers.dense(confighidden);\n\
  const output=tf.layers.dense(configoutput);\nmodel.add(hidden);\nmodel.add(output);\n\
  ```\n\n神经网络模型可以使用优化器函数 `Adam` 以及损失函数 `categoricalCrossentropy` 进行训练。这将使模型能够通过将给定的输入值与相应的输出值相关联来进行训练：\n\
  \n```\n//Step 3: Add configuration parameters to the NN //structure\nconst admopt=tf.train.adam(0.1);\n\
  const config={\noptimizer:admopt,\nloss:'categoricalCrossentropy' }\n//Step 4: Train\
  \ the NN organization\nmodel.compile(config);\n```\n\n训练通过模型对象的 `.fit()` 函数执行。此方法接收\
  \ XS 和 YS 训练数据以及配置对象。配置包括 epochs。当模型开始训练时，`.fit()` 方法返回一个 promise 函数。通过调用对训练方法的异步调用来检索输出数据：\n\
  \n```\nasync function train()\n{\nfor(let i=0;i<100;i++){\nconst res=await model.fit(xs,ys);\n\
  }\nconsole.log('training complete');\n}\ntrain();\n//Step 5: Predict the output\
  \ for the given input\nlet outputs=model.predict(xs);\noutputs.print();\n```\n\n\
  输出：\n```\nTensor\n[[0, 1],\n[0.0004133, 0.9995866],\n[0.0004822 , 0.9995178],\n\
  [0.9984748, 0.0015252]]\n```\n\n在此示例中，对于输入 [0,0]、[0,1] 和 [1,0]，预测输出分别为 [0, 1]、[0.0004153,\
  \ 0.9995866] 和 [0.0004822, 0.9995178]，这意味着 FALSE 的确定性为 0.0%，TRUE 的确定性为 99.9%；而对于输入\
  \ [1,1]，输出为 [0.9984748, 0.0015252]，意味着 FALSE 的确定性为 99%，TRUE 的确定性为 0.0%。\n\n图 4-10\
  \ 显示了上述代码在浏览器控制台中的输出。\n\n![../images/503949_1_En_4_Chapter/503949_1_En_4_Fig10_HTML.jpg](img/503949_1_En_4_Fig10_HTML.jpg)\n\
  \n图 4-10\n\n使用 TensorFlow.js 通过人工神经网络实现 NAND 布尔运算的截图（输出）\n\n## 使用 PoseNet 进行人体姿态分类\n\
  \n“PoseNet 是一种视觉模型”，可用于通过评估关键身体关节的位置来测量图片或视频中个体的姿势。模型术语见图 4-11。\n\n![../images/503949_1_En_4_Chapter/503949_1_En_4_Fig11_HTML.jpg](img/503949_1_En_4_Fig11_HTML.jpg)\n\
  \n图 4-11\n\n与 PoseNet 模型相关的术语\n\nPoseNet 无法感知图片/视频中的人是谁。该估计实际上是评估人体关键关节的位置。PoseNet\
  \ 可用于评估图片/视频中单个人的姿势或众多人的姿态。PoseNet 的估计可以区分图片/视频中的单个个体，也可以识别图片/视频中的不同人。单人姿势识别器更快、更直接，但要求图片中只存在一个主体。姿势评估分两个阶段进行：\n\
  \n1.  一个信息 RGB 图片通过一个卷积神经系统进行处理。\n\n2.  利用姿势估计从模型输出中解释关键点位置和关键点置信度分数。\n\n## 设置 PoseNet\
  \ 项目\n\n### 步骤 1：在 HTML 程序（主文件）中包含 TensorFlow.js 和 PoseNet 库\n\n```\n\nposenet.load().then(function(net)\
  \ {\n// posenet model loaded\n});\n\n```\n\n图 4-12 显示了主文件中库文件的包含情况以及浏览器中的相应输出。ml5.js\
  \ 与 TensorFlow.js 一起提供了 PoseNet 模型。一个即用型模型，内部包含一个预先准备好的卷积神经网络（CNN），它接受一张图片作为信息，并输出一个关键点热图和相应的向量。\n\
  \n![../images/503949_1_En_4_Chapter/503949_1_En_4_Fig12_HTML.jpg](img/503949_1_En_4_Fig12_HTML.jpg)\n\
  \n图 4-12\n\n库加载到浏览器后，浏览器及其控制台窗口中呈现的输出文本\n\n\n\n### 步骤 2：使用浏览器摄像头进行单人姿态估计\n\n完整代码包含两个文件：`Demo_3.html`（显示输出的主网页）和\
  \ `Demo_3script.js`（用于捕获用户视频的 JS 代码）。`Demo_3.html` 是显示带关键点输出的主页面，因此库文件被添加在该文件中：\n\
  \n```\n\nDemo on Posenet Model\n\nDemo of PoseNet ML model in the browser\n Loading\
  \ Model....\n\n```\n\n`Demo3_script.js` 包含三个方法（函数）：\n\n![../images/503949_1_En_4_Chapter/503949_1_En_4_Fig13_HTML.jpg](img/503949_1_En_4_Fig13_HTML.jpg)\n\
  \n**图 4-13**\n\n使用浏览器摄像头进行单人姿态估计\n\n1.  `function setup()`：初始设置，用于通过浏览器摄像头捕获视频，并通过调用\
  \ PoseNet 模型将用户视频放置在指定位置。此第一个函数执行且仅运行一次。\n\n```\n    function setup() {\n    createCanvas(640,480);\n\
  \    webcam_output=createCapture(VIDEO);\n    webcam_output.size=(width,height);\n\
  \    myposenet=ml5.poseNet(webcam_output,function(){\n    select('#uservideo').html('User\
  \ Video Loaded')});\n    myposenet.on('pose',function(results) {\n    poses=results;\
  \ });\n    webcam_output.hide();\n    }\n    ```\n\np5.js 库的 `createCanvas(width,\
  \ height)` 用于在浏览器中创建一个窗口（框）来显示输出。窗口（画布）的大小设置为 `width:640px` 和 `height:480px`。\n\n\
  `createCapture(VIDEO)` 用于捕获摄像头视频流并返回一个 p5 对象，该对象存储在用户定义的变量 `webcam_output` 中。摄像头视频的高度和宽度与画布相同。\n\
  \n`poseNet()` 方法创建一个新的 PoseNet 模型，该模型以 `webcam_output` 作为输入，并加载到主 .html 页面中以显示用户视频。\n\
  \n`poseNet.on()` 方法是一个事件监听器。每当用户位置/视频发生变化时，就会向 `myposenet` 模型提供一张新图像。`poseNet` 函数进而调用\
  \ `function(results)`，模型在该函数中给出关键点及其对应的置信度分数。结果存储在名为 `poses` 的数组中。\n\n函数 `webcam_output.hide()`\
  \ 隐藏实际的摄像头输出，浏览器上仅显示带有关键点作为输出的画布。\n\n2.  `function draw ()`：该函数被调用并无限重复，直到浏览器关闭。此方法进而调用以识别关键点：\n\
  \n```\n    function draw() {\n    image(webcam_output,0,0,width,height);\n    displayKeypoints();\n\
  \    }\n    ```\n\n`draw ()` 函数持续运行以在画布中显示图像。它有五个参数：`webcam_output`（要显示的视频）、相对于画布左上角的\
  \ xy 坐标，以及用于绘制视频的 `width,height`。此函数调用 `displayKeypoints()` 以将识别出的关键点显示为点（椭圆）。\n\
  \n3.  `function displayKeypoints()`：此方法显示来自数组 `poses` 的已识别关键点。识别出的点以圆圈形式显示，以表明存在关键点：\n\
  \n```\n    function displayKeypoints() {\n    for(let i=0;i<poses.length;i++) {\n\
  \    let pose=poses[i].pose;\n    for(let j=0;j<pose.keypoints.length;j++) {\n \
  \   let point=pose.keypoints[j];\n    fill(0,0,255);\n    noStroke();\n    ellipse(point.position.x,point.position.y,10,10);\n\
  \    }\n    }\n    }\n    ```\n\n图 4-13 显示了相应的输出。\n\n**使用图片进行单人姿态估计：** `function\
  \ setup()` 包含一个 `createImg` 方法，用于从本地硬盘加载图片（图像）到浏览器，以识别图像上的关键点。图 4-14 显示了相应的输出。\n\
  \n![../images/503949_1_En_4_Chapter/503949_1_En_4_Fig14_HTML.jpg](img/503949_1_En_4_Fig14_HTML.jpg)\n\
  \n**图 4-14**\n\n从图片显示关键点\n\n函数中的以下指令集需要写入 `Demo_4script.js`。主文件 `Demo_4.html` 保持不变：\n\
  \n```\nfunction setup() {\ncreateCanvas(640, 360);\nimg= createImg('pics/pexels-derick-santos-2773934.jpg');\n\
  img.size(width, height);\nmyposenet = ml5.poseNet(img, function(){\nselect('#userpic').html('Image\
  \ Loaded');\nmyposenet.singlePose(img);});\nmyposenet.on('pose', function (results)\
  \ {\nposes = results; });\n}\n```\n\n`function draw()` 包含基于 `poses` 数组显示关键点以及显示骨架（与关键点连接相关的草图）的方法：\n\
  \n```\nfunction draw() {\nif (poses.length > 0) {\nimage(img, 0, 0, width, height);\n\
  displayKeypoints(poses);\ndisplaySkeleton(poses);\n}\n}\n```\n\n`displayKeypoints`\
  \ 的逻辑与前面示例中讨论的相同。函数 `displaySkeleton()` 用于在当前图像上绘制*线条*。`draw()` 在一个无限循环中执行此操作，因此向用户显示连续输出。\n\
  \n## PoseNet 模型置信度值\n\n`draw` 函数执行并遍历属于身体的每个关键点，关键点数组 `poses` 包含以下信息：\n\n*   `\"\
  part\"`：识别出的身体部位名称。\n\n*   `\"position.x\"` 和 `\"position.y\"`：图像中某个点的值。\n\n*  \
  \ `\"score\"`：置信度值，表示检测的准确性。\n\n图 4-15 显示了浏览器控制台上的输出。\n\n![../images/503949_1_En_4_Chapter/503949_1_En_4_Fig15_HTML.jpg](img/503949_1_En_4_Fig15_HTML.jpg)\n\
  \n**图 4-15**\n\n从浏览器控制台中的 `poses` 看到的置信度值\n\n如果检测准确性大于某个值（例如，当您关注某些点时，`0.2 或 0.3，或\
  \ 0.7 及以上`），我们可以绘制一个 `point`。图 4-16 显示了与绘制的骨架相关的分数。\n\n![../images/503949_1_En_4_Chapter/503949_1_En_4_Fig16_HTML.jpg](img/503949_1_En_4_Fig16_HTML.jpg)\n\
  \n**图 4-16**\n\n在浏览器控制台的 `poses` 对象中看到的特定阈值分数\n\n注意\n\n当使用与 PoseNet 模型输出相关的 JSON\
  \ 格式存储数据时，步骤需要写入 `Demo_4script.js`。主文件 `Demo_4.html` 保持不变\n\n要以 JSON 格式将关键点捕获到单独的文件中，您可以按如下方式使用\
  \ p5 库函数：\n\n步骤 1\\. 声明一个全局变量：\n\n```\nlet writer;\n```\n\n步骤 2\\. 在 `setup` 函数中，使用\
  \ `createWriter` 以及用于以 JSON 格式存储数据的文件名来初始化 `writer` 变量：\n\n```\n// writer 对象通过 createWriter\
  \ 函数初始化\nwriter=createWriter('data_keypoints.json');\n```\n\n步骤 3\\. 在 `displayKeypoints`\
  \ 方法中，通过使用 `writer` 对象调用 `print` 函数：\n\n```\nwriter.print(\"keypoint: \"+keypoint.part+\"\
  \ x:\"+keypoint.position.x+\" y:\"+keypoint.position.y);\n```\n\n步骤 4\\. 定义一个函数用于触发事件，例如\
  \ `mouseclick`，以便该事件将触发 `print` 方法来存储连续 `draw()` 方法的值：\n\n```\nfunction mouseClicked()\
  \ {\nwriter.close();\n}\n```\n\n输出存储在一个 .json 文件中，如图 4-17 所示。\n\n![../images/503949_1_En_4_Chapter/503949_1_En_4_Fig17_HTML.jpg](img/503949_1_En_4_Fig17_HTML.jpg)\n\
  \n**图 4-17**\n\n在 .json 文件中存储关键点数据\n\n\n\n## 总结\n\n本章涵盖了人工神经网络（ANN）在人体姿态估计的机器学习建模中的重要性及其策略。通过本章的理论和示例，您学习了\
  \ ANN 的基础知识，以及如何通过 TensorFlow.js 编程在浏览器中实现它。这种理解无疑将帮助您在浏览器中实现诸如 PoseNet 之类的各种机器学习模型。\n\
  \n本章介绍的 PoseNet 模型是一种机器学习模型，可在浏览器中实时估计人体姿态关键点。本章还介绍了相应的实现细节。\n\n这些信息将作为在浏览器中执行复杂数据分析的基础（您将在后续章节中学习）。\n\
  \n"
- '# 5. 步态分析


  步态分析是指利用观察者的眼睛和大脑，辅以测量身体运动、身体力学和肌肉活动的仪器，对动物运动（更具体地说是人类运动）进行系统研究。步态分析用于评估和治疗影响行走能力的医疗状况患者。


  步态分析涵盖了测量（步态可量化边界的呈现与探究）以及基于个人步态模式的解读。


  ## 步态测量技术


  步态分析涉及测量，其中引入、分析并解释可测量的参数，以得出受试者的步行风格（模式）。表 5-1 描述了压力测量，表 5-2 列出了运动测量。


  **表 5-2**


  **运动测量**


  | **设备类型** | **测量类型** |

