  \n图 1-10\n\n借助 JS 代码在网页上实现的事件驱动过程\n\n\n\n## 文档对象模型操作\n\n当网页加载时，浏览器（程序）会创建该页面的文档对象模型（DOM）。HTML\
  \ DOM 被构建成一个*对象树*。通过 DOM，可以操作 HTML 的元素（组件），在网页中移动它们并进行高效处理。\n\nHTML DOM 是 HTML 的对象模型：\n\
  \n*   HTML 组件作为项目（元素）\n*   所有 HTML 组件的属性\n*   所有 HTML 组件的技术\n*   所有 HTML 组件的事件\n\
  \nHTML DOM 是 JavaScript 的应用程序编程接口（API）：\n\n*   JS 可以添加/更改/删除 HTML 组件。\n*   JS 可以添加/更改/删除\
  \ HTML 特性。\n*   JS 可以添加/更改/删除 CSS 样式。\n*   JS 可以响应 HTML 事件。\n*   JS 可以添加/更改/删除 HTML\
  \ 事件。\n\n在创建网站页面和应用程序时，你必须做的主要事情之一就是控制文档结构。开发人员通常通过使用 DOM 来实现，DOM 包含大量用于控制 HTML\
  \ 的 API，以及使用文档对象来设置样式数据。\n\n`发现 HTML 元素`：当你需要使用 JS 访问 HTML 元素时，首先需要发现这些元素。你可以通过以下几种不同的方式来实现：\n\
  \n*   通过 ID 发现 HTML 元素\n*   通过标签名发现 HTML 元素\n*   通过类名发现 HTML 元素\n*   通过 CSS 选择器发现\
  \ HTML 元素\n*   通过 HTML 对象集合发现 HTML 元素\n\n在 JS 中使用的网页是一个文档，JS 提供了一个名为 `document`\
  \ 的对象，它被视为一个完整的网页。`document` 对象提供了各种属性和方法，用于在浏览器加载网页时识别、访问和修改网页组件/元素。为了识别和访问 DOM\
  \ 元素，JS 使用了前面描述的发现能力。\n\n以下 HTML 源代码展示了这种发现机制的实际应用：\n\n```\n\n通过 Id 查找 HTML 元素\n\
  Hello World!\n此示例演示了 getElementsById 方法。\n\nDOM 非常有用。\n此示例演示了 getElementsByClassName\
  \ 方法。\n\nvar myElement = document.getElementById(\"intro\");\ndocument.getElementById(\"\
  demo1\").innerHTML =\n\"intro 段落中的文本是 \" + myElement.innerHTML;\nvar x = document.getElementsByTagName(\"\
  p\");\ndocument.getElementById(\"demo2\").innerHTML =\n'第一个段落（索引 0）中的文本是：' + x[0].innerHTML;\n\
  var x1 = document.getElementsByClassName(\"intro\");\ndocument.getElementById(\"\
  demo\").innerHTML =\n'第一个 class=\"intro\" 的段落（索引 0）：' + x1[0].innerHTML;\n\n```\n\
  \n## jQuery 简介\n\njQuery 是一个轻量级的 JS 库，它使开发人员能够编写更少的代码，但完成更多的工作。jQuery 库使 Web 程序员能够轻松地完成以下任务：\n\
