  \ }\n```\n\n## JavaScript 基础\n\nJavaScript 是一种脚本语言（一种轻量级编程语言）和一种解释型语言（无需预先编译即可执行）。它通常直接嵌入到\
  \ HTML 页面中，旨在为页面增加交互性。Java 和 JS 是不同的。\n\nJS 属性包括以下内容：\n\n*   JS 为 HTML 设计者提供了一种编程工具。\n\
  *   JS 可以将动态文本放入 HTML 页面。\n*   JS 可以对事件做出反应。\n*   JS 可以读取和写入 HTML 元素。\n*   JS 可用于验证数据。\n\
  *   JavaScript 可用于在浏览器中应用 AI、ML 和 DL 技术。\n*   JavaScript 可用于创建 Cookie（在访问者的计算机上存储和检索信息）。\n\
  \n### 包含 JavaScript\n\nHTML `<script>` 标签用于将脚本（JS）插入到 HTML 页面中：\n\n```\ndocument.write(\"\
