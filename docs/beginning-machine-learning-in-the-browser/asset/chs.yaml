  前言


  近年来，人工智能（AI）和机器学习（ML）技术已广泛应用于众多领域，例如环境参数监测、工业场景监控与控制、智能交通、结构健康监测、医疗保健等。电子技术、嵌入式控制、智能传感、网络和通信的进步使得开发低成本智能系统成为可能。尽管存在智能系统，但其计算能力非常有限，因此被视为资源受限的计算设备（例如手机、智能手表和小型电子设备）。


  在资源受限的计算设备和浏览器上应用涉及 AI 和 ML 方法复杂数学运算的智能策略颇具挑战性。互联网技术，尤其是 JavaScript 技能的进步，使得在浏览器和资源计算设备上执行
  AI/ML 模型成为可能。市面上已有许多关于 AI、ML 和 JavaScript 的出版物，但本书提供了有益的信息和实践知识，帮助读者从零开始开发智能方法/模型，并将其部署到浏览器和资源受限的计算设备上。


  全书共分为六章：


  第 1 章描述了 Web 开发的基础知识。本章简要介绍了使用 Web 构建块设计和开发 Web 应用程序的方法。对于开发 AI/ML 模型并在浏览器或资源受限计算设备上运行而言，本章的实践知识至关重要。对于任何研究领域的初学者以及有兴趣开发
  Web 应用程序的人来说，本章提供了必要的实践技能，以便更好地实现 Web 应用程序。


  第 2 章介绍了在计算机浏览器应用程序层面处理数据所需执行的步骤以及需要考虑的必要 JavaScript 库。本章涵盖了最新的 JavaScript 库（p5.js
  和 ml5.js），这些库有助于通过实践步骤构建 AI/ML 模型。


  第 3 章以人体姿态估计应用程序为例，帮助读者理解如何让涉及复杂数学运算的 AI/ML 模型在浏览器中运行。分步流程将教您如何实现 ML 方法来估计个体的姿态。


  第 4 章介绍了开源 JavaScript 库 TensorFlow.js，该库有助于在浏览器中构建和部署 AI/ML 模型。本章解释了 TensorFlow.js
  的架构，包括其支持在浏览器中进行大规模数据处理的加速器。通过 TensorFlow.js 库，本章阐明了执行神经网络模型以完成有用分类任务的实践示例。


  第 5 章探讨了如何在 Web 浏览器应用程序中结合 JavaScript 库应用 AI/ML 方法来确定步态参数。本章将引导您了解步态分析的基础知识，并详细阐述在浏览器中使用
  AI 确定分析关键参数时所考虑的观察方法。


  第 6 章提供了更多在浏览器上应用 AI/ML 方法运行的高级应用程序。本章鼓励读者思考在浏览器中运行 AI/ML 模型时可能实现的进步。


  希望您喜欢阅读本书。如果您在实践方面需要任何帮助，请随时与我联系。


