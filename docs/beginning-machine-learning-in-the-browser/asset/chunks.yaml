    # 1. Web 开发


    本章向您介绍机器学习（ML）的基础知识，并为完全初学者提供 Web 设计与开发的实用入门指南。本章涵盖的主题包括：


    *   超文本标记语言（HTML）


    *   层叠样式表（CSS）


    *   JavaScript（JS）


    *   文档对象模型（DOM）


    *   jQuery


    这些 Web 开发的构建块使您能够在 Web 设计中实现丰富的用户功能。

