    The `ml5.js` library’s methods and functions are asynchronous (because ML models
    can take significant amounts of time to process input and generate output).


    **Using Promises** The [ml5.js](https://ml5js.org/) library also supports [promises](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise).
    If no callback is provided to any asynchronous function, a promise is returned.
    With promises, the image classification example can be used in the following way.


    > **Note** In the preceding example, a `MobileNet` library is used for illustration.
    `MobileNet` is a convolutional neural network (CNN) architecture model for image
    classification and mobile vision. It is best suited for web browsers because browsers
    have limitations related to computation, graphic processing, and storage.


    ## Summary


    AI/ML researchers have provided us a huge number of functionalities in the form
    of libraries, making the implementation of AI/ML as easy as including the various
    libraries in our solution space.


    In this chapter, you learned how to use two JS libraries (`p5.js` and `ml5.js`)
    that enable you to build and deploy interactive graphics and ML applications on
    the browser. These new and improved libraries have proven themselves effective
    in numerous utilization cases.


    By using these libraries, you can compose code for various real-time applications
    on the browser in a simpler and more naturally intuitive way.'
