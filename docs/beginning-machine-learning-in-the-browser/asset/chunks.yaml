    \ and [1,0], the predicted outputs are [0, 1] , [0.0004153, 0.9995866] and [0.0004822 ,\
    \ 0.9995178] implies that 0.0% certainty of FALSE and a 99.9% certainty of TRUE;\
    \ whereas for the input [1,1], the output is [0.9984748, 0.0015252 implies 99%\
    \ FALSE and 0.0% TRUE.\n\nFigure [4-10](#503949_1_En_4_Chapter.xhtml#Fig10) shows\
    \ the output in the browser console for the preceding code.\n\n![../images/503949_1_En_4_Chapter/503949_1_En_4_Fig10_HTML.jpg](images/503949_1_En_4_Chapter/503949_1_En_4_Fig10_HTML.jpg)\n\
    \nFigure 4-10\n\nScreenshot (output) for the NAND Boolean operation through ANN\
    \ using TensorFlow.js\n\n## Human Pose Classification Using PoseNet\n\n“PoseNet\
    \ is a vision model” that can be used to gauge the posture of an individual in\
    \ a picture or video by assessing where key body joints are located. See Figure\
    \ [4-11](#503949_1_En_4_Chapter.xhtml#Fig11) for model terminology.\n\n![../images/503949_1_En_4_Chapter/503949_1_En_4_Fig11_HTML.jpg](images/503949_1_En_4_Chapter/503949_1_En_4_Fig11_HTML.jpg)\n\
    \nFigure 4-11\n\nTerminology related to PoseNet model\n\nPoseNet does not perceive\
    \ who is in a picture/video. The estimation is virtually assessing where human\
    \ key body joints are located. PoseNet can be used to assess either a single person’s\
    \ posture or numerous stances of people present in a picture/video. The estimation\
    \ of PoseNet can distinguish just a single individual in a picture/video and can\
    \ also recognize different people in a picture/video. The single-person posture\
