    ## 总结


    本章介绍了机器学习，并提供了网页设计和开发的实用概述。以下是一些关键要点：


    *   HTML 是我们用来构建内容各个部分并定义其重要性的语言。

    *   CSS 是我们用来为网页内容设置样式和设计，使其更生动的语言。

    *   JS 是我们用来为网站页面添加动态实用性的脚本语言。

    *   DOM 描述了文档（网页）的逻辑结构，以及使用组件（网页元素）访问和操作文档的方式。

    *   jQuery 是一个小型 JavaScript 库，它简化了 HTML 文档（网页）的遍历、操作、事件处理和动画。


    现在，你应该能够开始设计和开发在其网页组件中集成 AI/ML 的应用程序了。


    # 2. 基于浏览器的数据处理


    既然你已经了解了 Web 开发的基础知识，本章将介绍两个 JavaScript (JS) 库：p5.js 和 ml5.js。本章还将深入探讨与各种问题解决和应用程序开发实现相关的
    JS 特性和语法。然后，讨论使用图形和机器学习 (ML) 应用程序处理接口方法在浏览器中实现人工智能 (AI) 的各种方式。


    还将讨论与 JS 编程相关的浏览器计算机视觉技术，例如图像分类。在本章中，你还将通过使用 Node.js 和 Python 超文本传输协议 (HTTP) 服务器程序运行
    Web 应用程序的实践示例进行学习。


    ## 用于 Web 上 ML 的 JavaScript 库和 API


    AI 和 ML 处于现代计算的前沿，并且是当前的热门话题。你的计算框架的“智能”程度可以影响应用程序数据处理的成功或失败（或优化）。


    ML 通过软计算接口比通过硬连线接口更好。尽管 AI/ML 正变得无处不在，但大多数 Web 开发人员尚未掌握它。然而，ML 是人机交互发展中不可避免的进步。我对此唯一的问题与某些软件供应商有关。任何人都可以开始在
    Web 上开发应用程序（这个无与伦比、真正开放且分散的阶段），并且目前开源技术在很大程度上支持 Web 应用程序的设计和开发。然而，现在关键的事情是将智能概念应用到
    ML 接口上的能力。


    目前，Web 上的 ML 看起来比我期望的要开放得多，并且不那么以标准为中心。要训练模型或尝试从模型中获取数据片段，你必须使用 API 库。

