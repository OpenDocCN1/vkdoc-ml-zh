    \ with variables\n\n body {padding: 0; margin: 0;} canvas {vertical-align: top;}\n\
    ```\n\n**Listing 2-8a** — `p5ex8_index.html`\n\n## Graphics and Interactive Processing\
    \ in the Browser Using p5.js\n\nThis section provides examples that show how to\
    \ use `p5.js` libraries to implement a browser’s interactive and graphics features.\
    \ Listings [2-9a](#503949_1_En_2_Chapter.xhtml#PC18) and [2-9b](#503949_1_En_2_Chapter.xhtml#PC19)\
    \ show how to use the `p5.js` library to implement graphics functions to illustrate\
    \ mouse press events. Figure [2-9](#503949_1_En_2_Chapter.xhtml#Fig9) shows the\
    \ corresponding output.\n\n![../images/503949_1_En_2_Chapter/503949_1_En_2_Fig9_HTML.jpg](images/503949_1_En_2_Chapter/503949_1_En_2_Fig9_HTML.jpg)\n\
    \n**Figure 2-9** — Graphics functions with mouse press event using `p5.js` library\n\
    \n```\nlet x = 100;\nlet y = 100;\nlet extraCanvas1;\nfunction setup()\n{\ncreateCanvas(300,\
    \ 300);\nextraCanvas1 = createGraphics(300, 300);\nextraCanvas1.clear();\n}\n\
    function draw()\n{\nbackground(255,204,0);\nx += random(-5, 5);\ny += random(-5,\
    \ 5);\nif (mouseIsPressed) {\nextraCanvas1.fill(255, 150);\nextraCanvas1.noStroke();\n\
    extraCanvas1.ellipse(mouseX, mouseY, 60, 60);\n}\nimage(extraCanvas1, 0, 0);\n\
    fill('blue');  stroke(255);\nrectMode(CENTER);  rect(x, y, 20, 20);\n}\n```\n\n\
    **Listing 2-9b** — `p5_graphics_ex1_user_code1.js`\n\n```\nListing 2-9a\np5_graphics_ex_index.html\n\
    ```\n\n### Interactive Graphics Application\n\nListings [2-10a](#503949_1_En_2_Chapter.xhtml#PC20)\
    \ and [2-10b](#503949_1_En_2_Chapter.xhtml#PC21) show a graphics script for a\
    \ bouncing ball illustration using the `p5.js` library. Figure [2-10](#503949_1_En_2_Chapter.xhtml#Fig10)\
    \ shows the corresponding output.\n\n![../images/503949_1_En_2_Chapter/503949_1_En_2_Fig10_HTML.jpg](images/503949_1_En_2_Chapter/503949_1_En_2_Fig10_HTML.jpg)\n\
    \n**Figure 2-10** — `p5.js` graphics script for bouncing ball\n\n```\nvar ball\
    \ = {\nx: 300,\ny: 200,\nxspeed: 4,\nyspeed: -3\n};\nfunction setup() {\ncreateCanvas(600,\
    \ 400);\n}\nfunction draw() {\nbackground('blue');\nmove();\nbounce();\ndisplay();\n\
    }\nfunction bounce() {\nif (ball.x > width || ball.x  height || ball.y < 0) {\n\
    ball.yspeed = ball.yspeed * -1;\n}\n}\nfunction display() {\nstroke(255);\nstrokeWeight(4);\n\
    fill(200, 0, 200);\nellipse(ball.x, ball.y, 36, 36);\n}\nfunction move() {\nball.x\
    \ = ball.x + ball.xspeed;\nball.y = ball.y + ball.yspeed;\n}\n```\n\n**Listing\
    \ 2-10b** — `p5_graphics_ex2_user_code2.js`\n\n```\nListing 2-10a\np5_graphics_ex2_index.html\n\
    ```"
