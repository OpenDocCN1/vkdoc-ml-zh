    alert(\"Hello I am Outside your program\");\n}\nListing 1-7\nMessage.js\n```\n\
    \n### JavaScript for an Event-Driven Process\n\nDynamic website development is\
    \ possible by leveraging event-driven programming with JS. Commonly, after a website\
    \ page has stacked, the JS program keeps running (and waiting for an event to\
    \ occur). If you interact with the web page, a JS script executes the code that\
