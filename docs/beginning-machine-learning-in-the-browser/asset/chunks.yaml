  trans: '

    # 4. 人体姿态分类


    本章涵盖各种人体姿态估计实验。在前一章中，你已经学习了在浏览器中进行人体姿态估计的基础知识。


    本章首先探讨为何需要在浏览器中进行人体姿态估计，随后将讨论各种可以在浏览器中执行的人工智能（AI）和机器学习（ML）分类技术。


    本章还提供了对开源 JavaScript（JS）库 TensorFlow.js 的高级概述。你将学习如何使用它在浏览器中实现和部署深度学习（DL）系统。讨论涵盖了
    TensorFlow.js 框架的架构及其构建模块张量，并包含两个使用该库在浏览器上运行神经网络程序的实践示例。请注意，TensorFlow.js 是一个用于
    JS 中 ML 的库，它使你能够用 JS 开发 ML 模型，并直接在浏览器或 Node.js 中使用 ML。


    本章还包含实践示例，涵盖通过浏览器摄像头和本地存储的图片（图像）检测个体关键点。


    ## 在浏览器中进行人体姿态估计的必要性


    人体姿态估计是评估人体姿态分类以预测可能出现的异常所需的一项任务。人体姿态评估将指示个体在进行日常活动时的分类水平。人们希望在不泄露隐私的情况下计算自己的姿态；因此，人体姿态计算更倾向于在客户端而非数据收集的服务器端进行。所以，借助
    AI 方法进行的人体姿态分类（判定）应在客户端（即浏览器应用程序）执行。


    在浏览器中应用 ML 技术进行人体姿态估计并评估分类性能的必要性如下：


    *   **隐私**：在浏览器中执行 ML 方法和用户数据的规定将确保数据不会传输到服务器。与敏感文档、医疗应用数据（如用户身份识别）以及特定领域的用户文本相关的数据将仅在客户端（用户端）处理。因此，通过在客户端应用程序（即浏览器）本身实现
    ML 方法，可以维护用户隐私。


    *   **无需跨多个软件共享数据（分发）**：可以避免依赖多个软件/工具来执行数据。无需安装额外的软件/工具。应用程序将在用户端执行，因此导航到多种方法将变得容易。


    *   **低延迟**：ML 模型可以进行优化，以实现高效的存储和速度，从而在资源受限的设备上非常高效地运行。因此，可以减少/避免等待服务器响应的时间（客户端/服务器模型
    Web 应用程序中的往返时间）。如果应用程序仅在客户端执行，运行速度会更快。


    *   **可靠性**：由于不存在间歇性的连接步骤，可以避免可靠性问题。数据不会传输到另一个位置（服务器）。因此，在客户端处理的数据非常可靠。


    *   **用户交互性**：当今的技术浏览器与摄像头和屏幕等输入输出设备集成。这种集成支持丰富的用户交互体验。ML 可以轻松增强用户交互性，尤其是在实时操作中。


    此外，在浏览器（客户端）上执行 ML 方法（模型）适用于迁移学习、现有模型的参数调整以及输出解释等任务。


    ## 浏览器中的 ML 分类技术


    神经网络概念是一组 ML 方法/算法，其行为方式类似于大脑的工作方式，使用人工神经元结构。神经网络是多种有助于解决分类问题的 ML 方法之一。其新颖之处在于能够强有力地做出详细预测，并在合理执行时间内模仿人类思考。本章不会深入探讨神经网络的细节，但你将学习神经网络的基础知识，以便更好地理解所呈现的问题。


    有许多强大的方法可以自动分类实体。应用需求决定了解决分类问题的理想选择，以及应用神经系统的努力是否值得。人工神经网络（ANN）和深度神经网络（DNN）在解决复杂维度问题方面是成功的；然而，它们本身在理论上也很复杂。一些深度学习系统，即
    DL 框架，如 TensorFlow，可以帮助你更快地设置深度神经系统，只需几行代码。


    分类模型预测类标签，使其属于特定实体。一些分类器是成对的，产生是/否的选择。其他的是多类分类器，能够将事物分类到几个类别之一。特征化是 AI 的另一个常见用例。例如，分类算法用于解决电子邮件垃圾邮件过滤、文档分类、语音识别、图像识别和手写识别。在这种特定情况下，神经系统是一些可以帮助解决分组问题的
    AI 计算。其独特品质在于能够逐步做出详细预测并模仿人类推理，这是其他算法无法做到的。在与分类问题相关的许多案例中，神经系统已经产生了最佳结果。


    要理解使用神经系统的分类问题，有必要弄清楚其他顺序计算的工作原理，并理解它们的独特品质。对于某些问题，神经系统可能是不合适或无意义的练习。对于其他问题，它可能是核心解决方案。ANN
    由称为神经元的基本组件构成，这些神经元接收值，乘以权重，然后通过一个非线性激活函数运行。只要存在足够的计算能力，神经网络就能高效地学习非线性属性。该系统可以学习极其复杂的能力。理论上，只要有足够的计算能力，神经系统就能学习几乎任何能力的状态。


    *   **ANN 优点**：对于解决大维度问题极其强大，能够处理因素之间的复杂关系、非彻底分类集以及与产出因素相关的复杂能力。有出色的调整选项来防止过拟合和欠拟合。


    *   **ANN 缺点**：理论上复杂，难以实现，并且需要专业知识来调整参数以获得更好的分类。有时，需要大量的训练样本集才能更好地实现（获得更好的输出）。


    注意


    使用 TensorFlow.js 库在程序中制作你的神经网络并训练它。收集数据并准备你的神经组织，或利用现有信息逐步准备你的神经组织。当它准备好时，你的神经网络将相应地执行分类或回归任务。


    通过浏览器完全在客户端运行 AI/ML 程序是一个交互式应用程序，这很智能。诸如人体姿态估计之类的应用程序可以使用开源 JS 库 TensorFlow.js
    来实现。

