- fmt: "# Using the `ml5.js:posenet()` Method\n\nAlthough various methods enable us\
    \ to estimate human pose keypoints, Dan Oved's PoseNet model does the [real-time\
    \ human pose estimation](https://medium.com/tensorflow/real-time-human-pose-estimation-in-the-browser-with-tensorflow-js-7dd0bc881cd5)\
    \ on the browser and resource-constrained computing devices. This section outlines\
    \ his steps for collecting human pose estimation using the `ml5.posenet` method.\n\
    \n**Note:** We will add the instructions (code) step by step in the `1.js` script\
    \ file to capture the video and identify the human pose keypoints so that you\
    \ can better understand the development of the browser application.\n\n**Step\
    \ 1A.** Include `ml5.js` and `p5.js` libraries for the PoseNet model (Listing\
    \ [3-1a](#503949_1_En_3_Chapter.xhtml#PC1)).\n\n```\nDemo#1\n  Posenet using m15.posenet\
    \ \n  The standard ML5.JS and P5.JS libraries are included\n\nListing 3-1a\n1.html\n\
    ```\n\n**Step 1B.** See the `1.js` script (Listing [3-1b](#503949_1_En_3_Chapter.xhtml#PC2))\
    \ to capture the video. Main file (`1.html`) programming instructions remain the\
    \ same.\n\n```\nLet video;\nFunction setup() {\ncreateCanvas(640,480);\nvideo=createCapture(VIDEO);\n\
    }\nFunction draw() {\nImage(video,0,0);\n}\nListing 3-1b\n1.js\n```\n\nFigure\
    \ [3-1](#503949_1_En_3_Chapter.xhtml#Fig1) shows the corresponding output for\
    \ the code. You must click the **Allow** button to view the face.\n\n![../images/503949_1_En_3_Chapter/503949_1_En_3_Fig1_HTML.jpg](images/503949_1_En_3_Chapter/503949_1_En_3_Fig1_HTML.jpg)\n\
    \n**Figure 3-1** Screenshot (output) related to the `1.html` and `1.js` script\
    \ to capture the browser webcam video after clicking the **Allow** button. The\
    \ two videos depict i) the original video capture and ii) the captured video drawn\
    \ onto the canvas.\n\n**Step 2.** Add the `video.hide()` function to hide the\
    \ captured video and show only the canvas video in the `1.js` script (Listing\
    \ [3-2](#503949_1_En_3_Chapter.xhtml#PC3)). Figure [3-2](#503949_1_En_3_Chapter.xhtml#Fig2)\
    \ shows the corresponding output.\n\n![../images/503949_1_En_3_Chapter/503949_1_En_3_Fig2_HTML.jpg](images/503949_1_En_3_Chapter/503949_1_En_3_Fig2_HTML.jpg)\n\
    \n**Figure 3-2** Screenshot (output). Display only the captured video on the canvas;\
    \ the original video is hidden.\n\n```\nLet video;\nFunction setup() {\ncreateCanvas(640,480);\n\
    video=createCapture(VIDEO);\nvideo.hide();\n}\nFunction draw() {\nImage(video,0,0);\n\
    }\nListing 3-2\nAdding video.hide()\n```\n\n**Step 3.** Invoke the `ml5.poseNet()`\
    \ method in the `1.js` script (Listing [3-3](#503949_1_En_3_Chapter.xhtml#PC4)).\
    \ Figure [3-3](#503949_1_En_3_Chapter.xhtml#Fig3) shows the output.\n\n![../images/503949_1_En_3_Chapter/503949_1_En_3_Fig3_HTML.jpg](images/503949_1_En_3_Chapter/503949_1_En_3_Fig3_HTML.jpg)\n\
    \n**Figure 3-3** Screenshot (output) on calling the method `ml5.poseNet()`. The\
    \ model is loaded onto the browser application, as shown on the browser console.\n\
    \n```\nLet video;\nLet posenet;\nFunction setup() {\ncreateCanvas(640,480);\n\
    video=createCapture(VIDEO);\nvideo.hide();\nposenet=m15.poseNet(video.modelready);\n\
    }\nFunction modelready() {\nConsole.log('posenet model is ready');\n}\nFunction\
    \ draw() {\nImage(video,0,0);\n}\nListing 3-3\nInvoking ml5.poseNet( )\n```\n\n\
    **Step 4.** Real-time poses are estimated for this `poseNet.on()` method in the\
    \ `1.js`, (i.e., listening to the new poses) (Listing [3-4](#503949_1_En_3_Chapter.xhtml#PC5)).\
    \ Figure [3-4](#503949_1_En_3_Chapter.xhtml#Fig4) shows the corresponding output.\n\
    \n![../images/503949_1_En_3_Chapter/503949_1_En_3_Fig4_HTML.jpg](images/503949_1_En_3_Chapter/503949_1_En_3_Fig4_HTML.jpg)\n\
    \n**Figure 3-4** Screenshot (output) once the PoseNet model is loaded and `poseNet.on()`\
    \ listens to the new poses of the user.\n\n```\nLet video;\nLet posenet;\nFunction\
    \ setup() {\ncreateCanvas(640,480);\nvideo=createCapture(VIDEO);\nvideo.hide();\n\
    posenet=m15.poseNet(video.modelready);\nposenet.on('pose',showPoses);\n}\nFunction\
    \ showPoses(poses) {\nconsole.log(poses)\n}\nFunction modelready() {\nconsole.log('posenet\
    \ model is ready');\n}\nFunction draw() {\nImage(video,0,0);\n}\nListing 3-4\n\
    poseNet.on( )\n```\n\n**Step 5.** Add function `showPoses()` in the `1.js` script\
    \ file so that the data related to the poses is stored in the corresponding tensors,\
    \ which are shown in the browser console (Listing [3-5](#503949_1_En_3_Chapter.xhtml#PC6)).\
    \ Figure [3-5](#503949_1_En_3_Chapter.xhtml#Fig5) shows the corresponding output.\n\
    \n![../images/503949_1_En_3_Chapter/503949_1_En_3_Fig5_HTML.jpg](images/503949_1_En_3_Chapter/503949_1_En_3_Fig5_HTML.jpg)\n\
    \n**Figure 3-5** Screenshot (output). Data as collected in the tensors is shown\
    \ in the browser console.\n\n```\nLet video;\nLet posenet;\nFunction setup() {\n\
    createCanvas(640,480);\nvideo=createCapture(VIDEO);\nvideo.hide();\nposenet=m15.poseNet(video.modelready);\n\
    posenet.on('pose',showPoses);\n}\nFunction showPoses(poses) {\nconsole.log(poses)\n\
    }\nFunction modelready() {\nconsole.log('posenet model is ready');\n}\nFunction\
    \ draw() {\nImage(video,0,0);\n}\nListing 3-5\nAdding showPoses()\n```\n\n**Step\
    \ 6.** Add an array of poses collected in the object poses in `1.js` script file\
    \ (Listing [3-6](#503949_1_En_3_Chapter.xhtml#PC7)). Figure [3-6](#503949_1_En_3_Chapter.xhtml#Fig6)\
    \ shows the corresponding output.\n\n![../images/503949_1_En_3_Chapter/503949_1_En_3_Fig6_HTML.jpg](images/503949_1_En_3_Chapter/503949_1_En_3_Fig6_HTML.jpg)\n\
    \n**Figure 3-6** Screenshot (output). An array of poses as collected in the object\
    \ poses is shown in the browser console.\n\n```\nLet video;\nLet posenet;\nFunction\
    \ setup() {\ncreateCanvas(640,480);\nvideo=createCapture(VIDEO);\nvideo.hide();\n\
    posenet=m15.poseNet(video.modelready);\nposenet.on('pose',showPoses);\n}\nFunction\
    \ showPoses(poses) {\nconsole.log(poses)\n}\nFunction modelready() {\nconsole.log('posenet\
    \ model is ready');\n}\nFunction draw() {\nImage(video,0,0);\n}\nListing 3-6\n\
    Array of Poses Collected in the Object Poses\n```\n\n**Step 7.** `poseNet.on()`\
    \ returns an array with a single object of several poses (keypoints), and recognizes\
    \ the pose such as nose x and y coordinates by altering the function `draw()`\
    \ in `1.js` script file (Listing [3-7](#503949_1_En_3_Chapter.xhtml#PC8)). Figure\
    \ [3-7](#503949_1_En_3_Chapter.xhtml#Fig7) shows the corresponding output.\n\n\
    ![../images/503949_1_En_3_Chapter/503949_1_En_3_Fig7_HTML.jpg](images/503949_1_En_3_Chapter/503949_1_En_3_Fig7_HTML.jpg)\n\
    \n**Figure 3-7** Screenshot (output) showing a single object with several poses\
    \ and recognizing the specific pose (keypoint): nose x and y coordinates with\
    \ a red ellipse.\n\n```\nLet video;\nLet posenet;\nLet pose;\nFunction setup()\
    \ {\ncreateCanvas(640,480);\nvideo=createCapture(VIDEO);\nvideo.hide();\nposenet=m15.poseNet(video.modelready);\n\
    posenet.on('pose',showPoses);\n}\nFunction showPoses(numberofposes) {\nconsole.log(numberofposes);\n\
    if(numberofposes.length>0)\n{\nPose=numberofposes[0].pose;\n}\n}\nFunction modelready()\
    \ {\nconsole.log('posenet model is ready');\n}\nFunction draw() {\nImage(video,0,0);\n\
    If(pose) {\nfill(255,0,0);\nellipse(pose.nose.x,pose.y,64);}\n}\nListing 3-7\n\
    Altering the draw() Function by Adding the ellipse Method to Display the Specific\
    \ Keypoints\n```\n\n**Step 8.** Add instructions (code) in the `1.js` script file\
    \ `draw()` function to recognize two different human poses (keypoints): nose and\
    \ ear (Listing [3-8](#503949_1_En_3_Chapter.xhtml#PC9)). Figure [3-8](#503949_1_En_3_Chapter.xhtml#Fig8)\
    \ shows the corresponding output.\n\n![../images/503949_1_En_3_Chapter/503949_1_En_3_Fig8_HTML.jpg](images/503949_1_En_3_Chapter/503949_1_En_3_Fig8_HTML.jpg)\n\
    \n**Figure 3-8** Screenshot (output) to recognize two different poses (keypoints):\
    \ nose and ear."
