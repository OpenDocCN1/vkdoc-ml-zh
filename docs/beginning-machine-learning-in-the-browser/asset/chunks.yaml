  trans: "\n## 使用 ml5.js:posenet() 方法\n\n尽管有多种方法可以估算人体姿态关键点，但 Dan Oved 的 PoseNet 模型能够在浏览器和资源受限的计算设备上进行[实时人体姿态估计](https://medium.com/tensorflow/real-time-human-pose-estimation-in-the-browser-with-tensorflow-js-7dd0bc881cd5)。本节概述了使用\
    \ `ml5.posenet` 方法收集人体姿态估计的步骤。\n\n注意\n\n我们将逐步在 `1.js` 脚本文件中添加指令（代码），以捕获视频并识别人体姿态关键点，以便您更好地理解浏览器应用程序的开发过程。\n\
    \n**步骤 1A.** 为 PoseNet 模型引入 ml5.js 和 p5.js 库（列表 3-1a）。\n\n```\n\nDemo#1\n  使用\
    \ m15.posenet 的 Posenet\n  引入了标准的 ML5.JS 和 P5.JS 库\n\n列表 3-1a\n1.html\n```\n\n\
    **步骤 1B.** 查看用于捕获视频的 `1.js` 脚本（列表 3-1b）。主文件（`1.html`）的编程指令保持不变。\n\n```\nLet video;\n\
    Function setup() {\ncreateCanvas(640,480);\nvideo=createCapture(VIDEO);\n}\nFunction\
    \ draw() {\nImage(video,0,0);\n}\n列表 3-1b\n1.js\n```\n\n图 3-1 显示了代码对应的输出。您必须点击“允许”按钮才能查看面部。\n\
    \n![../images/503949_1_En_3_Chapter/503949_1_En_3_Fig1_HTML.jpg](img/503949_1_En_3_Fig1_HTML.jpg)\n\
    \n图 3-1\n\n与 `1.html` 和 `1.js` 脚本相关的截图（输出），展示了点击“允许”按钮后捕获的浏览器摄像头视频。两个视频分别显示了：i)\
    \ 原始视频捕获，以及 ii) 绘制到画布上的捕获视频。\n\n**步骤 2.** 在 `1.js` 脚本中添加 `video.hide()` 函数，以隐藏捕获的视频，仅显示画布上的视频（列表\
    \ 3-2）。图 3-2 显示了对应的输出。\n\n![../images/503949_1_En_3_Chapter/503949_1_En_3_Fig2_HTML.jpg](img/503949_1_En_3_Fig2_HTML.jpg)\n\
    \n图 3-2\n\n截图（输出）。仅在画布上显示捕获的视频；原始视频被隐藏。\n\n```\nLet video;\nFunction setup() {\n\
    createCanvas(640,480);\nvideo=createCapture(VIDEO);\nvideo.hide();\n}\nFunction\
    \ draw() {\nImage(video,0,0);\n}\n列表 3-2\n添加 video.hide()\n```\n\n**步骤 3.** 在\
    \ `1.js` 脚本中调用 `ml5.poseNet( )` 方法（列表 3-3）。图 3-3 显示了输出。\n\n![../images/503949_1_En_3_Chapter/503949_1_En_3_Fig3_HTML.jpg](img/503949_1_En_3_Fig3_HTML.jpg)\n\
    \n图 3-3\n\n调用 `ml5.poseNet()` 方法时的截图（输出）。模型已加载到浏览器应用程序中，如浏览器控制台所示。\n\n```\nLet\
    \ video;\nLet posenet;\nFunction setup() {\ncreateCanvas(640,480);\nvideo=createCapture(VIDEO);\n\
    video.hide();\nposenet=m15.poseNet(video.modelready);\n}\nFunction modelready()\
    \ {\nConsole.log('posenet model is ready');\n}\nFunction draw() {\nImage(video,0,0);\n\
    }\n列表 3-3\n调用 ml5.poseNet( )\n```\n\n**步骤 4.** 在 `1.js` 中，通过 `poseNet.on( )` 方法（即监听新的姿态）来估计实时姿态（列表\
    \ 3-4）。图 3-4 显示了对应的输出。\n\n![../images/503949_1_En_3_Chapter/503949_1_En_3_Fig4_HTML.jpg](img/503949_1_En_3_Fig4_HTML.jpg)\n\
    \n图 3-4\n\nPoseNet 模型加载后，`poseNet.on()` 监听用户新姿态时的截图（输出）。\n\n```\nLet video;\n\
    Let posenet;\nFunction setup() {\ncreateCanvas(640,480);\nvideo=createCapture(VIDEO);\n\
    video.hide();\nposenet=m15.poseNet(video.modelready);\nposenet.on('pose',showPoses);\n\
    }\nFunction showPoses(poses) {\nconsole.log(poses)\n}\nFunction modelready() {\n\
    console.log('posenet model is ready');\n}\nFunction draw() {\nImage(video,0,0);\n\
    }\n列表 3-4\nposeNet.on( )\n```\n\n**步骤 5.** 在 `1.js` 脚本文件中添加 `showPoses()` 函数，以便将与姿态相关的数据存储到相应的张量中，这些数据将显示在浏览器控制台中（列表\
    \ 3-5）。图 3-5 显示了对应的输出。\n\n![../images/503949_1_En_3_Chapter/503949_1_En_3_Fig5_HTML.jpg](img/503949_1_En_3_Fig5_HTML.jpg)\n\
    \n图 3-5\n\n截图（输出）。收集在张量中的数据显示在浏览器控制台中。\n\n```\nLet video;\nLet posenet;\nFunction\
    \ setup() {\ncreateCanvas(640,480);\nvideo=createCapture(VIDEO);\nvideo.hide();\n\
    posenet=m15.poseNet(video.modelready);\nposenet.on('pose',showPoses);\n}\nFunction\
    \ showPoses(poses) {\nconsole.log(poses)\n}\nFunction modelready() {\nconsole.log('posenet\
    \ model is ready');\n}\nFunction draw() {\nImage(video,0,0);\n}\n列表 3-5\n添加 showPoses()\n\
    ```\n\n**步骤 6.** 在 `1.js` 脚本文件中，向 `poses` 对象添加一个收集到的姿态数组（列表 3-6）。图 3-6 显示了对应的输出。\n\
    \n![../images/503949_1_En_3_Chapter/503949_1_En_3_Fig6_HTML.jpg](img/503949_1_En_3_Fig6_HTML.jpg)\n\
    \n图 3-6\n\n截图（输出）。收集在 `poses` 对象中的姿态数组显示在浏览器控制台中。\n\n```\nLet video;\nLet posenet;\n\
    Function setup() {\ncreateCanvas(640,480);\nvideo=createCapture(VIDEO);\nvideo.hide();\n\
    posenet=m15.poseNet(video.modelready);\nposenet.on('pose',showPoses);\n}\nFunction\
    \ showPoses(poses) {\nconsole.log(poses)\n}\nFunction modelready() {\nconsole.log('posenet\
    \ model is ready');\n}\nFunction draw() {\nImage(video,0,0);\n}\n列表 3-6\n收集在 poses\
    \ 对象中的姿态数组\n```\n\n**步骤 7.** `poseNet.on ()` 返回一个包含单个对象（包含多个姿态关键点）的数组，并通过修改 `1.js`\
    \ 脚本文件中的 `draw()` 函数来识别诸如鼻子 x 和 y 坐标等姿态（列表 3-7）。图 3-7 显示了对应的输出。\n\n![../images/503949_1_En_3_Chapter/503949_1_En_3_Fig7_HTML.jpg](img/503949_1_En_3_Fig7_HTML.jpg)\n\
    \n图 3-7\n\n截图（输出），显示一个包含多个姿态的单个对象，并识别出特定姿态（关键点）：用红色椭圆标记的鼻子 x 和 y 坐标。\n\n```\n\
    Let video;\nLet posenet;\nLet pose;\nFunction setup() {\ncreateCanvas(640,480);\n\
    video=createCapture(VIDEO);\nvideo.hide();\nposenet=m15.poseNet(video.modelready);\n\
    posenet.on('pose',showPoses);\n}\nFunction showPoses(numberofposes) {\nconsole.log(numberofposes);\n\
    if(numberofposes.length>0)\n{\nPose=numberofposes[0].pose;\n}\n}\nFunction modelready()\
    \ {\nconsole.log('posenet model is ready');\n}\nFunction draw() {\nImage(video,0,0);\n\
    If(pose) {\nfill(255,0,0);\nellipse(pose.nose.x,pose.y,64);}\n}\n列表 3-7\n通过添加\
    \ ellipse 方法修改 draw() 函数以显示特定关键点\n```\n\n**步骤 8.** 在 `1.js` 脚本文件的 `draw()` 函数中添加指令（代码），以识别两种不同的人体姿态（关键点）：鼻子和耳朵（列表\
    \ 3-8）。图 3-8 显示了对应的输出。\n\n![../images/503949_1_En_3_Chapter/503949_1_En_3_Fig8_HTML.jpg](img/503949_1_En_3_Fig8_HTML.jpg)\n\
    \n图 3-8\n\n截图（输出），用于识别两种不同的姿态（关键点）：鼻子和耳朵。\n"
