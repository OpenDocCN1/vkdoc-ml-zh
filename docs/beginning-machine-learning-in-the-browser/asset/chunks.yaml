  trans: "\n### W3C WebML CG（社区组）\n\nW3C 呼吁创建并整合针对机器学习优化的 API 到 Web 开发领域，这将最终使开发者能够在各种平台上创建可互操作的机器学习内容。英特尔和微软启动了这项工作，我很高兴一些\
    \ API 已经开发出来，但现在我们需要有效利用这些特性，使 Web 上的机器学习成为现实，从而实现以下目标：\n\n*   *更优的执行效率*：从准备好的模型中快速返回结果，系统不会出现卡顿。\n\
    \n*   *离线可用性*：在设备/小工具上运行的查询不依赖于与云计算管理的关联（从而避免了云计算中固有的延迟、吞吐量和连接性问题）。\n\n*   *更强的隐私保护*：令人难以置信的是，许多云服务提供已经准备好的模型来运行我们的请求。我们无需将隐私信息发送给他人。\n\
    \n尽管集成浏览器智能带来了令人兴奋的功能，但请务必记住，某些限制也同样适用，包括：\n\n*   *文件大小*：预先准备好的模型通常非常大（例如，通常有数兆字节）。客户端如此大的文件大小将导致\
    \ I/O 延迟，并受限于内存限制。\n\n*   *性能受限*：早期的浏览器程序仅限于单线程 JavaScript 执行实例，无法利用设备/小工具的核心计算功能。\n\
    \n目前，你可以使用 JS 库与现有的 AI/ML 模型进行交互，或者开发你自己的智能程序在浏览器或电子设备/小工具上运行。借助一个利用 JS 库软件的机器学习模型，稍加思考，再编写几行代码，你现在就可以开发出能在浏览器中引入智能的应用程序。\n\
    \n## 使用 JS 库操作 HTML 元素\n\n以下小节展示了如何使用两个最流行的 JS 库（p5.js 和 ml5.js）在浏览器上实现图形和机器学习等各种功能。\n\
    \nml5.js 库使机器学习对广大受众（包括艺术家、创意编码者和学生）变得平易近人。该库提供了在浏览器中访问机器学习算法和模型的途径。p5.js 库用于处理机器学习算法的图形处理单元（GPU）加速数学运算和内存管理。\n\
    \n## [p5.​js](https://p5js.org/)\n\np5.js 库是一个用于创意编码的 JavaScript 库，旨在为设计师、开发者、教师、学生等提供全面的编码能力。它是免费且开源的编程工具；每个人都可以获得学习\
    \ p5.js 的工具。p5.js 库将 [Processing](https://processing.org/) 的原则融入现代 Web。一个 p5.js\
    \ 库可以是任何扩展或补充现有 JS 代码的 JS 代码。\n\np5.js 库被分类为[核心库或贡献库](https://p5js.org/libraries/)。与程序员的\
    \ JS 代码一样，p5.js 拥有一个完整的绘图工具集，支持用于文本、输入、视频、网络摄像头和声音的 HTML5 对象。要将 p5.js 库包含在程序中，请将其链接到你的\
    \ HTML 文件。以下代码片段展示了链接了 p5.js 库的 HTML 文件的样子：\n\n注意\n\n你可以从此[链接](https://p5js.org/download/)下载\
    \ p5.js（单个文件，完整未压缩版本）或 p5.min.js（单个文件，压缩版本）库。你需要确保 p5.js/p5.min.js 库和 HTML 文件位于同一个文件夹（计算机系统路径）中。\n\
    \n要使用 p5.js 库功能开发和执行程序，你需要一个编辑器（Notepad++）和一个 Web 浏览器（Chrome 或 Firefox）。\n\n###\
    \ 绘制图形对象\n\n清单 2-1a 和 2-1b 展示了在用户代码 p5ex1_index.html 中包含 p5.js 库的情况。图 2-1 显示了相应的输出。\n\
    \n![../images/503949_1_En_2_Chapter/503949_1_En_2_Fig1_HTML.jpg](img/503949_1_En_2_Fig1_HTML.jpg)\n\
    \n图 2-1\n\n在用户 JS 代码中包含 p5.min.js 库\n\n```\nfunction setup() {\ncreateCanvas(720,\
    \ 400);\nbackground(200);\n}\nfunction draw() {\nrect(40, 120, 120, 40); // 一个矩形\n\
    ellipse(240, 240, 80, 80);  // 一个椭圆\ntriangle(300, 100, 320, 100, 310, 80); //一个三角形\n\
    }\n清单 2-1b\np5ex1_user_code1.js\n```\n\n```\n\n示例#1 p5.js \n\n 示例 #1：p5.js 和 user_code1.js\
    \ \n用于链接 p5.js 库和 user_code.js 的程序 \n\n清单 2-1a\np5ex1_index.html\n```\n\n### 操作\
    \ DOM 对象\n\n清单 2-2a 和 2-2b 展示了如何使用 JS 库（此处为 p5.js）创建 DOM 对象：p5ex2_index.html。图\
    \ 2-2 显示了相应的输出。\n\n![../images/503949_1_En_2_Chapter/503949_1_En_2_Fig2_HTML.jpg](img/503949_1_En_2_Fig2_HTML.jpg)\n\
    \n图 2-2\n\n使用 JS 库（此处为 p5.js）创建 DOM 对象\n\n```\nvar mycanvas,myh1;\nfunction setup()\
    \ {\nmycanvas = createCanvas(150, 150);\nmycanvas.position(200, 250);\nmyh1 =\
    \ createElement('h1', 'h1-新的 DOM 对象。');\nmyh1.position(100, 150);\ncreateP(\"\
    ****这是一个新的段落*****\");\n}\nfunction draw() {\nbackground(150, 150);\nfill(255,\
    \ 0, 0);\n}\n清单 2-2b\np5ex2_user_code2.js\n```\n\n```\n\n示例#2 p5.js \n\n 示例 #2：p5.js\
    \ 和 user_code2.js \n使用 p5.js 库操作 DOM 对象的程序 \n\n清单 2-2a\np5ex2_index.html\n```\n\
    \n### DOM 事件（mousePressed）处理\n\n清单 2-3a 和 2-3b 提供了使用 p5.js 库基于事件调用 DOM 对象的程序。图\
    \ 2-3 显示了相应的输出。\n\n![../images/503949_1_En_2_Chapter/503949_1_En_2_Fig3_HTML.jpg](img/503949_1_En_2_Fig3_HTML.jpg)\n\
    \n图 2-3\n\n使用 p5.js 库基于事件调用 DOM 对象\n\n```\nvar bgcolor,button;\nfunction setup()\
    \ {\ncanvas = createCanvas(200, 200);\nbgcolor = color(200);\nbutton = createButton('点击此按钮更改颜色');\n\
    button.position(250,150);\nbutton.mousePressed(changeColor);\n}\nfunction changeColor()\
    \ {\nbgcolor = color(random(255));\n}\nfunction draw() {\nbackground(bgcolor);\n\
    }\n清单 2-3b\np5ex3_user_code3.js\n```\n\n```\n\n示例#3 p5.js \n\n示例 #3：p5.js 和 user_code3.js\
    \ \n使用 p5.js 库基于事件调用 DOM 对象的程序 \n\n清单 2-3a\np5ex3_index.html\n```\n\n### 多个 DOM\
    \ 对象的事件处理\n\n清单 2-4a 和 2-4b 展示了使用 p5.js 库实现各种 HTML 元素之间的交互。图 2-4 显示了相应的输出。\n\n\
    ![../images/503949_1_En_2_Chapter/503949_1_En_2_Fig4_HTML.jpg](img/503949_1_En_2_Fig4_HTML.jpg)\n\
    \n图 2-4\n\n使用 p5.js 库创建各种 HTML 元素之间的交互性\n\n```\nvar mybgcolor,mybutton,myslider1,myinput1,myname;\n\
    function setup() {\nmycanvas = createCanvas(200, 200);\nmybgcolor = color(200);\n\
    myname = createP('你的名字！');\nmybutton = createButton('点击调整圆形大小');\nmybutton.mousePressed(changeColor);\n\
    myslider1 = createSlider(10, 100, 86);\nmyinput1 = createInput('输入你的名字::');\n\
    }\nfunction changeColor() {\nmybgcolor = color(random(255));\n}\nfunction draw()\
    \ {\nbackground(mybgcolor);\nfill(255, 0, 175);\nellipse(100, 100, myslider1.value(),\
    \ myslider1.value());\nmyname.html(myinput1.value());\ntext(myinput1.value(),\
    \ 10, 20);\n}\n清单 2-4b\np5ex4_user_code4.js\n```\n\n```\n\n示例#4 p5.js \n\n 示例\
    \ #4：p5.js 和 user_code4.js \n 使用 p5.js 库交互各种 HTML 元素的程序\n\n清单 2-4a\np5ex4_index.html\n\
    ```\n"
- fmt: "### HTML Interactive Elements\n\nListings [2-5a](#503949_1_En_2_Chapter.xhtml#PC10)\
