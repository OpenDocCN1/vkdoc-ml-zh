- fmt: '# ML Using TensorFlow.js


    `TensorFlow.js` is used to characterize, train, and run AI models totally in the
    browser by utilizing JS and application programming interface (API) methods. If
    you are a JS web developer and new to ML, `TensorFlow.js` is an extraordinary
    way to start learning and developing applications that incorporate intelligence
    in the browser. However, if you are an ML designer and new to JS, the material
    in this book will give you a speedy primer on how `TensorFlow.js` resources will
    help you develop smart applications.


    While developing applications using `TensorFlow.js`, you might prefer one the
    following methods:


    - You can import a pretrained model for derivation (inference). If you have a
    `TensorFlow` or `Keras` existing model and the model was prepared in the offline
    mode, you can change over into `TensorFlow.js` and load it into the browser for
    inference.

    - For rapidly developing applications, the transfer learning method can be appropriate.
    This method allows you to use `TensorFlow.js` to characterize, train, and run
    models totally in the browser via JS and layers of API. If you are acquainted
    with `Keras`, the layers of API should be familiar to transform into a new model.

    - Web developers can use `TensorFlow.js` to describe, train, and execute the models
    entirely in the browser using the JS features.


    `TensorFlow.js` is a JS library system for AI and replaces `deeplearn.js`, which
    is presently called `TensorFlow.js Core`. `TensorFlow.js` also incorporates a
    `Layers API`, a higher-level library for building AI models that utilize Core
    (e.g., devices for porting `TensorFlow` and `Keras` models). Figure [4-1](#503949_1_En_4_Chapter.xhtml#Fig1)
    shows an overview of `TensorFlow.js`.


    ![../images/503949_1_En_4_Chapter/503949_1_En_4_Fig1_HTML.jpg](images/503949_1_En_4_Chapter/503949_1_En_4_Fig1_HTML.jpg)


    Figure 4-1


    Overview of TensorFlow.js


    You can create/build models legitimately in a browser. In addition, you can import
    existing previously prepared models from Python and retrain them also. If you
    are already working under JS stack with Not only SQL (NoSQL) and JavaScript Object
    Notation (JSON), a use case that you should consider is utilizing `TensorFlow.js`
    to builds models using a browser. `TensorFlow.js` incudes `Keras API`, a simple
    software tool used to build AI/ML learning models. It likewise incorporates a
    lower-level API, previously called `deeplearn.js`, which can be used for direct
    variable-based math and programmed separation. The `Ops API` supports eager execution.
    Underneath everything, `TensorFlow.js` is fueled by `WebGL`, a JS API for delivering
    2D and 3D illustrations inside any Internet browser without the plug-in modules.


    **Note**


    `TensorFlow` eager execution is an imperative programming environment that evaluates
    operations immediately, without building graphs. Instead, operations return concrete
    values instead of constructing a computational graph to run later. This makes
    it easy to get started with `TensorFlow` and debug models. `TF CPU` (central processing
    unit), `TF GPU` (graphical processing unit), and `TF TPU` (tensor processing unit)
    are the distribution strategies wherein models can be executed on the respective
    devices.


    If there is limited information for the neural network learning process, tools
    such as `Tensorflow` are computationally efficient for better realization. Suppose
    there is a requirement for large data sets processing, then the Compute Unified
    Device Architecture (CUDA) systems such as NVIDIA GPUs/Google TPUs or Field Programmable
    Gate Arrays (FPGAs) are very much required. Basically, `Tensorflow` tools are
    based on JavaScript (JS) programming execution. It will support GPU for efficient
    data processing through `WebGL API` which is better than CUDA systems.


    `TensorFlow.js` is a library for creating and preparing AI models in JS and sending
    them to a program or on `Node.js`. You can utilize existing models, convert Python
    `TensorFlow` models, use move figuring out how to retrain existing models with
    your information, and create models without any preparation. The `TensorFlow.js
    Node.js` condition underpins utilizing an introduced work of Python/C `TensorFlow`
    as a back end, which may utilize the machine’s accessible equipment increasing
    speed, for instance, CUDA. There is likewise a JS-based back end for `Node.js`.
    However, its capacities are restricted. `TensorFlow.js` has a few back closures
    with various attributes. The `WebGL` back end provides GPU uphold utilizing `WebGL`
    surfaces for capacity and `WebGL` shaders for execution, and it can be up to 100x
    quicker than the direct CPU back end. `WebGL` does not need CUDA, so it can exploit
    whatever GPU is available.


    The WebAssembly (WASM) `TensorFlow.js` back end for the program utilizes the `XNNPACK`
    library for upgraded CPU execution of neural organization administrators. The
    WASM back end is commonly a lot quicker (10x to 30x) than the JS CPU back end,
    but it usually is slower than the `WebGL` back end (aside from tiny models). Your
    mileage may vary, so test both the WASM and `WebGL` back closures for your models
    on your equipment.


    **Example:** Basic usage of `TensorFlow.js`, consider a linear regression problem
    with salary and experience attributes relationship, as shown in Figure [4-2](#503949_1_En_4_Chapter.xhtml#Fig2).


    ![../images/503949_1_En_4_Chapter/503949_1_En_4_Fig2_HTML.jpg](images/503949_1_En_4_Chapter/503949_1_En_4_Fig2_HTML.jpg)


    Figure 4-2


    Linear regression problem (years of experience vs. salary)


    We can infer from Figure [4-2](#503949_1_En_4_Chapter.xhtml#Fig2) the `y` value
    for a particular `x` value even if we do not have the exact data. In ML, we can
    train a model based on the input data, and we do this in a browser with the help
    of JS features. Figure [4-3](#503949_1_En_4_Chapter.xhtml#Fig3) shows the trend
    line and the relationship between `x` and `y`.


    ![../images/503949_1_En_4_Chapter/503949_1_En_4_Fig3_HTML.jpg](images/503949_1_En_4_Chapter/503949_1_En_4_Fig3_HTML.jpg)


    Figure 4-3


    Relationship between x and y (years of experience vs. salary)


    Listings [4-1a](#503949_1_En_4_Chapter.xhtml#PC1) and [4-1b](#503949_1_En_4_Chapter.xhtml#PC2)
    provide the corresponding code using `TensorFlow.js` to illustrate the preceding
