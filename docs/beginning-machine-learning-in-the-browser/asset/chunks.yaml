    \n**Figure 3-11** Screenshot (output). Finding the distance between the recognized\
    \ poses and displaying them on the browser console\n\n```javascript\nlet video;\n\
    let posenet;\nlet pose;\nfunction setup() {\n  createCanvas(640, 480);\n  video\
    \ = createCapture(VIDEO);\n  video.hide();\n  posenet = ml5.poseNet(video, modelReady);\n\
    \  posenet.on('pose', showPoses);\n}\nfunction showPoses(numberofposes) {\n  console.log(numberofposes);\n\
