- fmt: '# Real-Time Data Visualization of the Gait Parameters (Patterns) on the Browser


    We have a function to draw detected points on the image. We saved all the results
    from the `PoseNet` output in the `poses` array. Here, we loop through every pose
    of the person in the image and get its keypoints:


    ```

    function gotPoses(poses)

    {

    if(poses.length > 0)

    {

    pose = poses[0]

    }

    }

    ```


    We loop through every point that is a body part in the `keypoints` array, which
    further has the following:


    *   *Part*: The name of the part that was detected

    *   *Position*: x and y values of a point on the image

    *   *Score*: Accuracy of detection


    We only draw a point with fill (red, green, blue), taking an RGB intensity value
    ranging from 0 to 255 to decide the color of a point:


    ```

    function drawPoint(x, y, radius, color)

    {

    ctx.beginPath();

    ctx.arc(x, y, radius, 0, 2 * Math.PI);

    ctx.fillStyle = color;

    ctx.fill();

    }

    function drawLine(x1,y1,x2,y2,color)

    {

    ctx.beginPath();

    ctx.moveTo(x1, y1);

    ctx.lineTo(x2, y2);

    ctx.strokeStyle = color;

    ctx.lineWidth = 2;

    ctx.stroke();

    }

    //Similarly, the function initializeParameters do //adjust the confidence values

    async function initializeParameters(button)

    {

    let eyeL = pose.pose.leftEye

    let eyeR = pose.pose.rightEye

    let ankleL = pose.pose.leftAnkle

    let ankleR = pose.pose.rightAnkle

    let count =0;

    let timeFrame = 1000

    let start = new Date().getTime();

    let end = start;

    while(end - start = cnfThreshold && eyeR.confidence >= cnfThreshold && ankleL.confidence
    >= cnfThreshold && ankleR.confidence>=cnfThreshold)

    {

    height_px = height_px+ (distance(0, eyeL.y, 0, ankleL.y) + distance(0, eyeR.y,
    0, ankleR.y))/2

    start_point = start_point+ (ankleL.y +ankleR.y)/2

    lr_step_threshold = lr_step_threshold + distance(0, ankleL.y, 0, ankleR.y)

    count = count +1;

    button.innerHTML = "Initializing ...."

    }

    end = new Date().getTime();

    }

    height_cm = document.getElementById("height").value;

    height_px  = (height_px / count).toFixed(2);

    lr_step_threshold = ((lr_step_threshold/count) * (height_cm / height_px)).toFixed(2)

    start_point = (start_point / count).toFixed(2)

    button.innerHTML = "Done"

    }

    function toggleDistance(button)

    {

    if (dflag)

    {

    dflag = false;

    button.innerHTML= "Start";

    }

    else

    {

    dflag = true;

    timer()

    button.innerHTML= "Stop";

    }

    }

    function timer()

    {

    let sec=0,min=0;

    var time = setInterval(function(){

    if (!dflag) {

    clearInterval(time);

    }

    document.getElementById(''time'').innerHTML=min+":"+sec;

    sec++;

    if(sec == 60)

    {

    sec=0;

    min++;

    }

    }, 1000);

    }

    function toggleKnee(button)

    {

    if (kflag)

    {

    kflag = false;

    button.innerHTML= "Detect";

    }

    else

    {

    kflag = true;

    button.innerHTML= "Pause";

    }

    }

    function toggleStrideLength(button)

    {

    if (strideflag)

    {

    strideflag = false;

    button.innerHTML= "Detect";

    }

    else {

    if(!rsflag){

    document.getElementById("stride").innerHTML= "Activate Right Step Length"

    }

    else if(!lsflag){

    document.getElementById("stride").innerHTML = "Activate Left Step Length"

    }

    else{

    strideflag = true;

    button.innerHTML= "Pause";

    }

    }

    }

    function toggleRightStep(button)

    {

    if (rsflag)

    {

    rsflag = false;

    button.innerHTML= "Detect";

    }

    else

    {

    rsflag = true;

    button.innerHTML= "Pause";

    }

    }

    function toggleLeftStep(button)

    {

    if (lsflag)

    {

    lsflag = false;

    button.innerHTML= "Detect";

    }

    else

    {

    lsflag = true;

    button.innerHTML= "Pause";

    }

    }

    function distance(x1,y1,x2,y2)

    {

    let a = x2-x1;

    let b = y2-y1;

    let result = Math.sqrt( a*a + b*b);

    return result;

    }

    ```


    Figure [5-4](#503949_1_En_5_Chapter.xhtml#Fig4) shows the initial parameters screen
    before entering the height of the person.


    ![../images/503949_1_En_5_Chapter/503949_1_En_5_Fig4_HTML.jpg](images/503949_1_En_5_Chapter/503949_1_En_5_Fig4_HTML.jpg)


    **Figure 5-4** Initial output as seen on the browser. The user has to provide
    the height manually (input) into the user interface and click the Detect buttons
    to measure the parameters.


    Figure [5-5](#503949_1_En_5_Chapter.xhtml#Fig5) shows the output after we enter
    the height of the user (in centimeters), click the Initialize Parameters button,
    and then click the Detect button for stride length.


    ![../images/503949_1_En_5_Chapter/503949_1_En_5_Fig5_HTML.jpg](images/503949_1_En_5_Chapter/503949_1_En_5_Fig5_HTML.jpg)


    **Figure 5-5** Stride length values display after the corresponding button is
    clicked.


    When the user clicks Right Step Length and Left Step Length buttons, the values
    display as shown in Figure [5-6](#503949_1_En_5_Chapter.xhtml#Fig6).


    ![../images/503949_1_En_5_Chapter/503949_1_En_5_Fig6_HTML.jpg](images/503949_1_En_5_Chapter/503949_1_En_5_Fig6_HTML.jpg)


    **Figure 5-6** Right step length and left step length values display after the
    user clicks the buttons.


    The total distance covered while walking displays upon click of the Distance button,
    as shown in Figure [5-7](#503949_1_En_5_Chapter.xhtml#Fig7).


    ![../images/503949_1_En_5_Chapter/503949_1_En_5_Fig7_HTML.jpg](images/503949_1_En_5_Chapter/503949_1_En_5_Fig7_HTML.jpg)


    **Figure 5-7** Gait parameters displayed on the web browser.


    ## Determining Gait Patterns Using Threshold Values


    The threshold score in the options variable can be set to a certain value so that
    the corresponding poses with the scores above the threshold values display:


    ```

    const options = {

    imageScaleFactor: 0.3,outputStride: 16,

    flipHorizontal: false,minConfidence: 0.5,

    maxPoseDetections: 2,scoreThreshold: 0.5,

    nmsRadius: 20,detectionType: ''multiple'',

    multiplier: 0.75,

    }

    while(end - start = cnfThreshold && eyeR.confidence >= cnfThreshold && ankleL.confidence
    >= cnfThreshold && ankleR.confidence>=cnfThreshold)

    {

    height_px = height_px+ (distance(0, eyeL.y, 0, ankleL.y) + distance(0, eyeR.y,
    0, ankleR.y))/2

    start_point = start_point+ (ankleL.y +ankleR.y)/2

    lr_step_threshold = lr_step_threshold + distance(0, ankleL.y, 0, ankleR.y)

    count = count +1;

    button.innerHTML = "Initializing ...."

    }

    end = new Date().getTime();

    }

    height_cm = document.getElementById("height").value;

    height_px  = (height_px / count).toFixed(2);

    lr_step_threshold = ((lr_step_threshold/count) * (height_cm / height_px)).toFixed(2)

    start_point = (start_point / count).toFixed(2)

    button.innerHTML = "Done"

    ```


    ## Summary


    Deep neural nets for stride and stance (gait) examination is a progressive thought.
    These measurements help assess stride irregularities, which may quantitatively
    indicate the proportion of medical condition seriousness that is influencing walk
    and stance. The measurements will help assess disturbances in gait, locomotion,
    balance, and risk for falls. The present methodology using AI in the browser will
    help with the following:


    *   Determining need for assistive, adaptive, orthotic, protective, supportive,
    or prosthetic devices or equipment

    *   Assessment of difficulty in integrating sensory, motor, and neural processes

    *   Establishing a diagnosis, prognosis, plan of care, referral to other services

    *   Foot Switch Stride Analysis

    *   Define temporal and distance factors, classify patient’s ability to walk

    *   Measure response to treatment programs, calculation of velocity, stride length,
    cadence, single stance, initial and terminal double stance, total stance, gait
    cycle duration.


    Readers of this book will develop applications such as gait analysis as described
    in this chapter by implementing the features learned from Chapters [1](#503949_1_En_1_Chapter.xhtml)
    through [4](#503949_1_En_4_Chapter.xhtml). The main features and tools to be considered
    in the gait analysis application’s design and development are `JS`, `DOM`, `jQuery`,
    `p5.js`, `ml5.js`, and `TensorFlow.js`.


    # 6. Future Possibilities for Running AI Methods in a Browser


    This chapter covers two new JavaScript (JS) libraries that run with the help of
    the `TensorFlow.js` framework: `face-api.js` and `handpose`. The evolving JS libraries
    show a path to explore real-time responsive applications that can run on browser
    and computational resource devices (electronic devices with less computing capability).'
