- fmt: '# Document Object Model Manipulation


    At the point when a web page is stacked, the browser (program) creates a Document
    Object Model (DOM) of the page. The HTML DOM is developed as a *tree of objects*.
    Through DOM, the elements (components) of the HTML can be manipulated, move across
    the web page and process efficiently.


    The HTML DOM is an object model for HTML:


    - HTML components as items (elements)

    - Properties (attributes) for all HTML components

    - Techniques for all HTML components

    - Events for all HTML components


    The HTML DOM is an application programming interface (API) for JavaScript:


    - JS can include/change/delete HTML components.

    - JS can include/change/delete HTML traits.

    - JS can include/change/delete CSS styles.

    - JS can respond to HTML events.

    - JS can include/change/delete HTML events.


    When creating site pages and applications, one of the main things you must do
    is control the archive structure. Developers typically do so by using the DOM,
    incorporating a lot of APIs to control HTML, and styling data that uses the `document`
    object.


    `Discovering HTML Elements`: When you need to get to HTML components with JS,
    you need to discover the components first. You can do so in a few different ways:


    - Discover HTML elements by ID

    - Discover HTML elements by label name

    - Discovering HTML elements by class name

    - Discover HTML elements by CSS selectors

    - Discover HTML elements by HTML object assortments


    A web page while used in JS is a document, and JS provides an object called `document`,
    which is considered a complete web page. The `document` object offers various
    properties and methods to identify, access, and modify the web components/elements
    when loaded on the browser. To identify and access the DOM elements, JS uses the
    previously described discovery capability.


    The following HTML source code shows such discovery at work:


    ```

    Finding HTML Elements by Id

    Hello World!

    This example demonstrates the getElementsById method.


    The DOM is very useful.

    This example demonstrates the getElementsByClassName method.


    var myElement = document.getElementById("intro");

    document.getElementById("demo1").innerHTML =

    "The text from the intro paragraph is " + myElement.innerHTML;

    var x = document.getElementsByTagName("p");

    document.getElementById("demo2").innerHTML =

    ''The text in first paragraph (index 0) is: '' + x[0].innerHTML;

    var x1 = document.getElementsByClassName("intro");

    document.getElementById("demo").innerHTML =

    ''The first paragraph (index 0) with class="intro": '' + x1[0].innerHTML;

    ```


    # Introduction to jQuery


    jQuery is a lightweight JS library that enables developers to compose less but
    accomplish more. The jQuery library enables the web programmers to do the following
    tasks easily:


    - HTML and DOM element manipulation

    - CSS management and control

    - Provides event-driven techniques to trigger and react to an event on a web page
    such as mouse click, button click, key press, and so on

    - Improves the functionality of Asynchronous JavaScript and XML (AJAX) calls for
    the exchange of information between two entities (such as client and server)


    There are two ways to use the jQuery library in your program:


    1. Download the jQuery library (`https://code.jquery.com/jquery-3.5.1.min.js`)
    from jQuery.com and store it in the same folder as that of the source code (HTML
    and CSS code) location and use it as follows:


    *Or*


    1. If you are connected to the Internet, use the following link from Google CDN
    to include jQuery features:


    Listing [1-9](#503949_1_En_1_Chapter.xhtml#PC15) shows how to use the jQuery library
    and its functionality, and Figures [1-11](#503949_1_En_1_Chapter.xhtml#Fig11)
    and [1-12](#503949_1_En_1_Chapter.xhtml#Fig12) show its corresponding output.


    ![../images/503949_1_En_1_Chapter/503949_1_En_1_Fig12_HTML.jpg](images/503949_1_En_1_Chapter/503949_1_En_1_Fig12_HTML.jpg)


    Figure 1-12


    Listing [1-9](#503949_1_En_1_Chapter.xhtml#PC15) output after the Hide button
    is clicked


    ![../images/503949_1_En_1_Chapter/503949_1_En_1_Fig11_HTML.jpg](images/503949_1_En_1_Chapter/503949_1_En_1_Fig11_HTML.jpg)


    Figure 1-11


    Listing [1-9](#503949_1_En_1_Chapter.xhtml#PC15) output before the Hide button
    is clicked


    ```

    $(document).ready(function(){

    $("button").click(function(){

    $("p").hide();

    });

    });


    jQuery Example

    first paragraph

    second paragraph

    hide


    Listing 1-9

    Using the jQuery Library

    ```


    # Summary


    This chapter introduced ML and provided a practical overview of web design and
    development. Following are some key takeaways:


    - HTML is the language that we use to structure the various pieces of our content
    and define their importance.

    - CSS is the language that we use to style and design our web content to make
    it more lively.

    - JS is the scripting language that we use to add dynamic usefulness to website
    pages.

    - DOM describes the logical structure of documents (web pages) and the way a document
    is accessed and manipulated using the components (elements of the web pages).

    - jQuery is a small JavaScript library that simplifies HTML document (web page)
    traversal and manipulation event handling, and animation.


    You should now be able to start designing and developing applications that incorporate
    AI/ML in their web components.


    # Browser-Based Data Processing


    Now that you understand the basics of web development, this chapter introduces
    two JavaScript (JS) libraries: `p5.js` and `ml5.js`. The chapter also delves deeper
    into JS features and syntax related to various problem-solving and application-development
    implementations. It then discusses various ways to use graphics and machine learning
    (ML) application processing interface methods to actualize artificial intelligence
    (AI) in the browser.


    Browser computer vision techniques, such as image classification, are also discussed
    relative to JS programming. In this chapter, you also work through practical examples
    of running web applications using the `Node.js` and Python Hypertext Transfer
    Protocol (HTTP) server programs.


    ## JavaScript Libraries and API for ML on the Web


    AI and ML are at the forefront of modern computing and are currently hot topics.
    How “smart” your computational frameworks are can factor into the success or failure
    (or optimization) of your applications’ data processing.


    ML is better via soft computing interfaces rather than via hard-wired ones. Although
    AI/ML is becoming ubiquitous, most web developers have yet to master it. However,
    ML is an inevitable advance in the development of human-machine interaction. The
    only issue I have with regard to this relates to certain software vendors. Anybody
    can begin developing applications on the web (this unrivaled, genuinely open,
    and dispersed stage), and at present open-source technologies support, to a large
    extent, the design and development of web applications. However, the key thing
    that matters now is the ability to apply the smart concepts onto ML interfaces.


    Presently, ML on the web looks significantly more open and less standard focused
    than I would like. To train models or try and get bits of data from models, you
    must use the API library.'
