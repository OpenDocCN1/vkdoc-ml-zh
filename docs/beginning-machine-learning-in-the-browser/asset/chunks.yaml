- fmt: '# 4. Human Pose Classification


    This chapter covers various human pose estimation experiments. In the preceding
    chapter, you learned the basics of human pose estimation in the browser.


    This discussion first answers why we need human pose estimation in the browser,
    and then the discussion turns to various artificial intelligence (AI) and machine
    learning (ML) classification techniques that can be executed in the browser.


    The chapter also provides a high-level overview of the open-source JavaScript
    (JS) library `TensorFlow.js`. You will learn how to use it to implement and deploy
    deep learning (DL) systems in browsers. The discussion covers the `TensorFlow.js`
    framework’s architecture and its building-block tensors and includes two practical
    examples of using the library to run neural network programs on the browser. Note
    that `TensorFlow.js` is a library for ML in JS that enables you to develop ML
    models in JS and use ML directly in the browser or `Node.js`.


    The chapter also includes practical examples that cover detecting the keypoints
    of an individual through browser webcams and locally stored pictures (images).


    ## Need for Human Pose Estimation in the Browser


    Human pose estimation is one task required for an individual to assess the human
    pose classifications to predict the abnormalities that may arise soon. The human
    poses evaluation will indicate an individual’s classification levels in performing
    his or her day-to-day activities. People prefer to have their poses computed without
    losing their privacy; hence, the human pose computations are preferred on the
    client side rather than on the server side of the data collection. So, the human
    pose classification (determination) with the help of AI methods is to be performed
    on the client side (i.e., at the browser application).


    The need for ML techniques for the estimation of human poses and to evaluate the
    performance of the classification in the browser is as follows:


    - **Privacy**: Provision for executing ML methods and the user data at the browser
    will ensure that data does not move to the servers. Data related to sensitive
    documents, medical application data such as user identification, and domain-specific
    user text will be processed at the client (users) end only. Thus, user privacy
    is maintained by implementing ML methods at the client application itself (i.e.,
    at the browser).


    - **Sharing of data (distribution) across several software not required**: The
    reliance of data to be executed on several software/tools can be avoided. There
    is no requirement to install additional software/tools. The application will be
    executed at the user end, and therefore navigation to several methods will be
    easy.


    - **Low latency**: ML models can be optimized for efficient storage and speed
    to run on resource-constrained devices very efficiently. Therefore, wait time
    (round-trip time in the client/server model web application) for server responses
    can be lessened/avoided. Applications run faster if they execute at the client
    side only.


    - **Reliability**: Reliability issues can be avoided because there would be no
    intermittent connectivity steps. The data is not transmitted to another location
    (server). Therefore, the data is very reliable to be processed at the client.


    - **User interactivity**: Today’s technological browser is integrated with the
    input and output devices such as cameras and screens. This integration supports
    rich user interactive experiences. ML can amplify user interactivity easily and,
    especially, in real-time operations.


    Also, executing ML methods (models) on the browsers (at the client side) is appropriate
    for tasks such as transfer learning, parameter tuning for existing models, and
    output interpretation.


    ## ML Classification Techniques in the Browser


    Neural network concepts are a set of ML methods/algorithms that behave similarly
    to how the brain works, using an artificial neurons structure. A neural network
    is one of several ML methods that can help to solve classification problems. Its
    novel quality is in its capacity to make detailed forecasts work powerfully and
    to imitate human speculation within a reasonable time of execution. This chapter
    does not go into neural networks in detail, but you will learn the basics of neural
    networks so that you have a better understanding of the problems presented.


    There are numerous powerful ways to classify entities automatically. Application
    requirements determine the ideal choice for solving classification problems and
    whether applying neural systems is worth the effort. Artificial neural networks
    (ANNs) and deep neural networks (DNNs) are successful for solving complex dimensionality
    issues; however, they are themselves also hypothetically complex. Some profound
    learning systems that are DL frameworks, such as `TensorFlow`, can help you set
    deep neural systems quicker, with just a couple of code lines.


