    ## Getting Started with Machine Learning in the Browser Using ml5.js and p5.js


    The ml5.js library makes AI accessible to creative coders. The library was created
    at New York University, and it was openly released in July 2018\. The library
    gives access to AI methods and models in the program, expanding on TensorFlow.js
    and with no other outside dependencies. The [ml5.​js](https://ml5js.org/) library
    makes life simpler for those who are new to the ML field. You can find more information
    at this [link](https://ml5js.org/).


    To develop and execute programs that incorporate p5.js and ml5.js libraries, you
    need the following:


    *   Editor: Visual Studio Code or Notepad++


    *   Web browser: Chrome or Firefox


    *   Sample images and datasets for developing ML applications


    ## Design, Develop, and Execute Programs Locally


    There are two methods for running a local web server on your computer to develop
    and execute your programs on the local computer.


