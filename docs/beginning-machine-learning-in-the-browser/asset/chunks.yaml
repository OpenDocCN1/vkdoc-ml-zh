- fmt: "### Step 2: Single-Person Pose Estimation Using a Browser Webcam\n\nThere\
    \ are two files for the complete code: `Demo_3.html` (the main web page to display\
    \ the output) and `Demo_3script.js` (the JS code to capture user video). `Demo_3.html`\
    \ is the main page to display the output with the keypoints. Because of this,\
    \ the libraries are added in this file:\n\n```html\nDemo on Posenet Model\n\n\
    Demo of PoseNet ML model in the browser\n Loading Model....\n```\n\nThe `Demo3_script.js`\
    \ consists of three methods (functions):\n\n![../images/503949_1_En_4_Chapter/503949_1_En_4_Fig13_HTML.jpg](images/503949_1_En_4_Chapter/503949_1_En_4_Fig13_HTML.jpg)\n\
    \n**Figure 4-13** Single-person pose estimation using a browser webcam\n\n1. \
    \ `function setup()`: The initial setup to capture video using browser webcam\
    \ and set the user video at the said location by calling the `PoseNet` model.\
    \ This first function is executed and runs exactly once.\n\n```javascript\nfunction\
    \ setup() {\n    createCanvas(640,480);\n    webcam_output=createCapture(VIDEO);\n\
    \    webcam_output.size=(width,height);\n    myposenet=ml5.poseNet(webcam_output,function(){\n\
    \    select('#uservideo').html('User Video Loaded')});\n    myposenet.on('pose',function(results)\
    \ {\n    poses=results; });\n    webcam_output.hide();\n}\n```\n\n`createCanvas(width,\
    \ height)` of the `p5.js` library is to create a window (box) in the browser to\
    \ display the output. The size of the window (canvas) is set with `width:640px`\
    \ and `height:480px`.\n\n`createCapture(VIDEO)` is used to capture a webcam feed\
    \ video and return a `p5` object, which is stored in the user-defined variable\
    \ `webcam_output`. The webcam video is also the same height and width as the canvas.\n\
    \n`poseNet()` method creates a new `PoseNet` model, taken as input from the `webcam_output`,\
    \ and loaded into the main `.html` page to display the user video.\n\n`poseNet.on()`\
    \ method is an event listener. Whenever a change occurs in the user position/video,\
    \ a new image is given to the `myposenet` model. The function `poseNet`, in turn,\
    \ calls the `function(results)` where the model gives the keypoints and their\
    \ corresponding scores. The results are stored in the array named `poses`.\n\n\
    The function `webcam_output.hide()`, hides the actual webcam output, and only\
    \ the canvas with the keypoints as output is displayed on the browser.\n\n2. \
    \ `function draw ()`: The function is called and repeats forever until the browser\
    \ is closed. This method in turn calls to identify the keypoints:\n\n```javascript\n\
    function draw() {\n    image(webcam_output,0,0,width,height);\n    displayKeypoints();\n\
    }\n```\n\nThe `draw()` function continuously runs to display the image in the\
    \ canvas. It has five parameters, the `webcam_output` (video to be displayed),\
    \ `x` and `y` coordinates of the upper-left corner in relation to the canvas,\
    \ and `width,height` to draw the video. This function calls the `displayKeypoints()`\
    \ to display the recognized keypoints as dots (ellipses).\n\n3.  `function displayKeypoints()`:\
    \ This method displays the recognized keypoints from the array `poses`. The identified\
    \ points are displayed in the form of circles to show that there is a keypoint:\n\
    \n```javascript\nfunction displayKeypoints() {\n    for(let i=0;i<poses.length;i++)\
    \ {\n        let pose=poses[i].pose;\n        for(let j=0;j<pose.keypoints.length;j++)\
    \ {\n            let point=pose.keypoints[j];\n            fill(0,0,255);\n  \
    \          noStroke();\n            ellipse(point.position.x,point.position.y,10,10);\n\
    \        }\n    }\n}\n```\n\nFigure [4-13](#503949_1_En_4_Chapter.xhtml#Fig13)\
    \ shows the corresponding output.\n\n**Single-person pose estimation using a picture**:\
    \ The `function setup()` consists of a `createImg` method to load the image (picture)\
    \ from the local hard disk onto the browser for recognizing the keypoints on the\
    \ image. Figure [4-14](#503949_1_En_4_Chapter.xhtml#Fig14) shows the corresponding\
    \ output.\n\n![../images/503949_1_En_4_Chapter/503949_1_En_4_Fig14_HTML.jpg](images/503949_1_En_4_Chapter/503949_1_En_4_Fig14_HTML.jpg)\n\
    \n**Figure 4-14** Display of keypoints from a picture\n\nThe following set of\
    \ instructions in the functions are to be written in `Demo_4script.js`. The main\
    \ file `Demo_4.html` remains the same:\n\n```javascript\nfunction setup() {\n\
    \    createCanvas(640, 360);\n    img= createImg('pics/pexels-derick-santos-2773934.jpg');\n\
    \    img.size(width, height);\n    myposenet = ml5.poseNet(img, function(){\n\
    \        select('#userpic').html('Image Loaded');\n        myposenet.singlePose(img);});\n\
    \    myposenet.on('pose', function (results) {\n        poses = results; });\n\
    }\n```\n\nThe `function draw()` contains the methods to display the keypoints\
    \ and also to display the skeleton (sketch related to the joining of keypoints)\
    \ based on the `poses` array:\n\n```javascript\nfunction draw() {\n    if (poses.length\
    \ > 0) {\n        image(img, 0, 0, width, height);\n        displayKeypoints(poses);\n\
    \        displaySkeleton(poses);\n    }\n}\n```\n\nThe logic of the `displayKeypoints`\
    \ remains the same as discussed in the previous example. The function `displaySkeleton()`\
    \ is to draw the lines on the current image. `draw()` does this in an infinite\
    \ loop, hence showing a continuous output to the user.\n\n### PoseNet Model Confidence\
    \ Values\n\nThe `draw` function executes and loops through every keypoint that\
    \ is part of the body, and the keypoints array `poses` contains the following\
    \ information:\n\n*   `\"part\"`: The name of the body part recognized.\n*   `\"\
    position.x\"` and `\"position.y\"`: Values of a point in the image.\n*   `\"score\"\
    `: Confidence value indicates the accuracy of detection.\n\nFigure [4-15](#503949_1_En_4_Chapter.xhtml#Fig15)\
    \ shows the output on the browser console.\n\n![../images/503949_1_En_4_Chapter/503949_1_En_4_Fig15_HTML.jpg](images/503949_1_En_4_Chapter/503949_1_En_4_Fig15_HTML.jpg)\n\
    \n**Figure 4-15** Confidence values as seen from the `poses` in the browser console\n\
    \nWe can draw a `point` if the detection accuracy is greater than a certain value\
    \ (e.g., `0.2` or `0.3`, or `0.7` and above when you are concerned about certain\
    \ points). Figure [4-16](#503949_1_En_4_Chapter.xhtml#Fig16) shows the scores\
    \ related to the drawn skeleton.\n\n![../images/503949_1_En_4_Chapter/503949_1_En_4_Fig16_HTML.jpg](images/503949_1_En_4_Chapter/503949_1_En_4_Fig16_HTML.jpg)\n\
    \n**Figure 4-16** Scores of certain threshold values as seen in the `poses` object\
    \ on the browser console\n\n> **Note**: When storing data using the JSON format\
    \ related to output of the `PoseNet` model, steps are to be written in `Demo_4script.js`.\
    \ The main file `Demo_4.html` remains the same.\n\nTo capture the keypoint onto\
    \ a separate file in terms of JSON format, you can use the `p5` library functions\
    \ as follows:\n\n**Step 1.** Declare a global variable:\n\n```javascript\nlet\
    \ writer;\n```\n\n**Step 2.** In the `setup` function, initialize the `writer`\
    \ variable with the `createWriter` along with the file name for storing the data\
    \ in the JSON format:\n\n```javascript\n// writer object is initialized with createWriter\
    \ function\nwriter=createWriter('data_keypoints.json');\n```\n\n**Step 3.** In\
    \ the `displayKeypoints` method, invoke the function `print` by using the `writer`\
    \ object:\n\n```javascript\nwriter.print(\"keypoint: \"+keypoint.part+\" x:\"\
    +keypoint.position.x+\" y:\"+keypoint.position.y);\n```\n\n**Step 4.** Define\
    \ a function for an event to occur such as `mouseclick`, so that the event will\
    \ trigger the `print` method to store the values of the continuous `draw()` method:\n\
    \n```javascript\nfunction mouseClicked() {\n    writer.close();\n}\n```\n\nThe\
    \ output is stored in a `.json` file, as shown in Figure [4-17](#503949_1_En_4_Chapter.xhtml#Fig17).\n\
    \n![../images/503949_1_En_4_Chapter/503949_1_En_4_Fig17_HTML.jpg](images/503949_1_En_4_Chapter/503949_1_En_4_Fig17_HTML.jpg)\n\
    \n**Figure 4-17** Storage of key points data in the `.json` file"
