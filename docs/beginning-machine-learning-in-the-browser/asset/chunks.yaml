    \nFigure 1-7\n\nJavaScript inside the head section\n\n```\n\nfunction msg(){\n\
    alert(\"Hello message\");\n}\n\nWelcome to JavaScript\n\nListing 1-5\nJavaScript\
    \ Inside the Head Section\n```\n\n```\n\nHello Java Script\n\ndocument.getElementById(\"\
    demo\").innerHTML = \"Java Script within the body!\";\n\nListing 1-6\nJavaScript\
    \ Inside the Body Section\n```\n\nListing [1-7](#503949_1_En_1_Chapter.xhtml#PC10)\
