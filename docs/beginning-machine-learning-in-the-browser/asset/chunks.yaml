    \n### Example 2: A Simple ANN to Realize the “Not AND” (NAND) Boolean Operation\n\
    \nNot AND (NAND) Boolean operation rules are simple: Given two Boolean values\
    \ (true/false), if only both are true, then return false; otherwise, return true.\
    \ The neural network to realize this operation based on the input values can be\
    \ demonstrated in applying a sequential model with the TensorFlow.js script library.\n\
    \nFigure [4-9](#503949_1_En_4_Chapter.xhtml#Fig9) shows the basic logical NAND\
    \ operation, and its corresponding functionality is shown in the truth table.\n\
    \n![../images/503949_1_En_4_Chapter/503949_1_En_4_Fig9_HTML.jpg](images/503949_1_En_4_Chapter/503949_1_En_4_Fig9_HTML.jpg)\n\
    \nFigure 4-9\n\nBasic logical NAND gate and its truth table\n\nThe training data\
    \ for the NAND Boolean operation realization is by using two arrays, one for the\
    \ inputs (X0 and X1) and the other for outputs (Y). The two arrays are the tensors\
    \ that can be used in the neural network structure:\n\n```\n//Step 1: Load or\
    \ prepare the data\nconst xs=tf.tensor2d([[0,0],[0,1],[1,0],[1,1]],[4,2]);\nconst\
    \ ys=tf.oneHot(tf.tensor1d([1,1,1,0]).toInt(),2);\n```\n\nSo, the shape of the\
    \ input array is `[4,2]` because there is an array of 4 values and each array\
    \ has 2 values. It would be better mentioning the arrays (input and output) with\
    \ the appropriate TensorFlow.js functions.\n\nOnce the inputs and outputs are\
    \ defined, the neural system can be structured in the form of layers. As the data\
    \ moves forward in one direction from the input layer to the output layer, we\
    \ can consider a *sequential model* for the neural system structure, as given\
    \ in the previous example. The input consisting of X0 and X1 is passed on to the\
    \ next layer (hidden), which consists of 5 neurons. They are then passed to the\
    \ output layer consisting of 2 neurons, which shows us the certainty percentage\
    \ (a value between 1 and 0) of the related outputs (true or false):\n\n```\n//Step\
    \ 2: Set up the NN structure\nconst model =tf.sequential();\nconst confighidden={\n\
    inputShape:[2],\nunits:5,\nactivation:'sigmoid'\n}\nconst configoutput={\nunits:2,\n\
    activation:'sigmoid'\n}\nconst hidden =tf.layers.dense(confighidden);\nconst output=tf.layers.dense(configoutput);\n\
    model.add(hidden);\nmodel.add(output);\n```\n\nThe neural network model can be\
    \ trained with the optimizer function `Adam` along with the loss function of `categoricalCrossentropy`.\
    \ This will enable the model to train by correlating the given input values with\
    \ the corresponding output values:\n\n```\n//Step 3: Add configuration parameters\
    \ to the NN //structure\nconst admopt=tf.train.adam(0.1);\nconst config={\noptimizer:admopt,\n\
    loss:'categoricalCrossentropy' }\n//Step 4: Train the NN organization\nmodel.compile(config);\n\
    ```\n\nThe training is performed by the `.fit()` function of the model object.\
    \ This method receives the XS and YS training data and the configuration object.\
    \ The config includes epochs. The `.fit()` method returns a promise function when\
    \ the model gets to train. The output data is retrieved by calling the async call\
    \ to the training method:\n\n```\nasync function train()\n{\nfor(let i=0;i<100;i++)\
    \ {\nlet outputs=model.predict(xs);\noutputs.print();\n}\nconsole.log('training\
    \ complete');\n});\n```\n\nThe output:\n```\nTensor\n[[0, 1],\n[0.0004133, 0.9995866],\n\
    [0.0004822 , 0.9995178],\n[0.9984748, 0.0015252]]\n```\n\nIn this example, for\
    \ the inputs of `[0,0]`, `[0,1]` and `[1,0]`, the predicted outputs are `[0, 1]`,\
    \ `[0.0004153, 0.9995866]` and `[0.0004822, 0.9995178]` implies that 0.0% certainty\
    \ of FALSE and a 99.9% certainty of TRUE; whereas for the input `[1,1]`, the output\
    \ is `[0.9984748, 0.0015252]` implies 99% FALSE and 0.0% TRUE.\n\nFigure [4-10](#503949_1_En_4_Chapter.xhtml#Fig10)\
    \ shows the output in the browser console for the preceding code.\n\n![../images/503949_1_En_4_Chapter/503949_1_En_4_Fig10_HTML.jpg](images/503949_1_En_4_Chapter/503949_1_En_4_Fig10_HTML.jpg)\n\
    \nFigure 4-10\n\nScreenshot (output) for the NAND Boolean operation through ANN\
    \ using TensorFlow.js\n\n## Human Pose Classification Using PoseNet\n\n“PoseNet\
    \ is a vision model” that can be used to gauge the posture of an individual in\
    \ a picture or video by assessing where key body joints are located. See Figure\
