- fmt: '# Machine Learning Overview


    Machine learning, a subset of artificial intelligence (AI), aims to enable computers
    to learn without interacting with specific programs. ML enables computers to develop
    programs that can access data and use it to learn for themselves (and thus perform
    like a human).


    Arthur Samuel, who believed that computers could learn without specific programs,
    popularized the term `machine learning` in 1959. In 1997, Tom Mitchell further
    clarified the concept of ML, stating that a computer could learn from some relative
    measure involving past performance while processing some task, thus giving some
    `experience` to the computer.


    Today, electronics of all kinds are outfitted with cutting-edge, high-sensitivity
    sensors. Further, Internet connectivity allows for communication among gadgets
    (things) for better environment-condition monitoring. Accordingly, the massive
    amount of data generated from these gadgets drives the Internet of Things (IoT)
    concept. Using AI and ML strategies, the broad information gathered can be processed,
    scaled, ordered, and used to predict events.


    In conventional ML approaches, data is sent to and handled through a central server,
    which experiences communication overhead, latency, protection loss, and security
    issues. To overcome these difficulties, inferences from the data collected in
    the IoT realm can be made by deploying better ML techniques near the data origin
    using, for instance, browser-environment capabilities. Exploiting ML strategies
    on resource-constrained computing devices through a browser helps respective entities
    to make better decisions in real time for enhanced functionality.


    The tremendous computational demands of current AI strategies and the development
    of ever-increasing numbers of AI-enhanced applications forecast more data-processing
    problems. After all, computer-based intelligence systems features are more demanding
    as they seek to reduce resource utilization, to quicken resource accessibility,
    and to exploit resource utilization for precision.


    Software developers and engineers can now more effectively leverage AI to conceptualize
    exceptionally responsive applications that respond to user-sourced information
    in real time, such as voice or facial recognition. They can also make smarter
    applications that can learn from user behavior. Computer-based intelligence enables
    us to automate applications to incorporate substantive proposals, to respond to
    voice requests or physical motions, to use mobile phone cameras to recognize items
    or places, and to figure out how to help users with day-by-day activities.


    In the past, many of the best ML and deep learning (DL) systems required familiarity
    with Python and its related library system. Production of ML models required unique
    reasoning equipment and programming tools, such as NVIDIA graphical processing
    units (GPUs) and CUDA. Now, however, incorporating ML into JavaScript (JS) applications
    often involves deploying the ML part on remote cloud systems, such as Amazon Web
    Services (AWS), and getting the model to run on the local system via application
    programming interface (API) calls. This nonlocal, back-end centered methodology
    has likely kept many web engineers from taking advantage of the abundant prospects
    AI offers to front-end improvement.


    The main advantage of running AI strategies on users’ local devices (i.e., near
    the data-origin source) is that the information never leaves the user’s device.
    This point is critically significant because users rightfully worry about their
    data privacy, especially in the wake of well-publicized and embarrassing information
    leaks and security breaches.


    With the help of `TensorFlow.js` software tools, developers/users can exploit
    AI without sending their information over a system that potentially makes it available
    to an outsider. These tools make it simpler to develop secure applications that
    comply with information security guidelines, such as healthcare applications that
    read wearable clinical sensors. The tools also make AI program augmentation possible,
    thus allowing upgrades while shielding user conduct/information.


    Integrating JS programming features with AI strategies in a simple interface can
    lead to more straightforward access to rich sensor information from IoT devices.
    User behavior can be modeled based on interactivity with device information sources
    such as voice or webcams. Because similar programming code can run on, for example,
    mobile phones utilizing accelerometers, gyroscopes, and Global Positioning System
    (GPS), integrating AI computational capabilities into user devices themselves
    can prove highly beneficial.


    # Web Communication


    Figure [1-1](#503949_1_En_1_Chapter.xhtml#Fig1) shows the big-picture web basics
    for AI applications that run on user devices.


    ![../images/503949_1_En_1_Chapter/503949_1_En_1_Fig1_HTML.jpg](images/503949_1_En_1_Chapter/503949_1_En_1_Fig1_HTML.jpg)


    Figure 1-1


    Web communication through the Internet and localhost


    The three web development essentials are as follows:


    * Client (web browsers, used to surf the web)

    * Server systems (used to supply information to the browsers)

    * Computer networks (used to support browser-server communication)


    The web activity shown in Figure [1-1(a)](#503949_1_En_1_Chapter.xhtml#Fig1) illustrates
    the internetworking principle, where communication between the client and server
    is done through protocols such as the Internet Protocol (IP), Transmission Control
    Protocol (TCP), Hypertext Transfer Protocol (HTTP), and the File Transfer Protocol
    (FTP). Figure [1-1(b)](#503949_1_En_1_Chapter.xhtml#Fig1) shows that communication
    between the client (browser/services/applications) and the server (localhost)
    happens locally and provides the required information to the respective applications
    (client/browser/services).


    The following terms relate to the communication:


    ![../images/503949_1_En_1_Chapter/503949_1_En_1_Fig2_HTML.jpg](images/503949_1_En_1_Chapter/503949_1_En_1_Fig2_HTML.jpg)


    Figure 1-2


    The communication between the web client (browser) and the web server


    * `World Wide Web` (WWW or web): A system of interlinked, hypertext documents
    that runs over the Internet. There are two types of software: client and server.
    A system that wants to access the information provided by servers must run client
    software (e.g., a web browser), and an Internet-connected computer that wants
    to provide information to others must run server software. The client and server
    applications communicate over the Internet by following a protocol built on TCP/IP
    (i.e., HTTP) (Figure [1-2](#503949_1_En_1_Chapter.xhtml#Fig2)).

    * `Hypertext`: An information format that enables one to move from one part of
    a document to another or from one document to another through hyperlinks.

    * `Uniform Resource Locator (URL)`: Unique identifiers used to locate a particular
    resource on the network.

    * `Markup language`: Defines the structure and content of hypertext documents.


    ## Organizing the Web with HTML


    To design and develop web pages, you want to be thoroughly familiar with Hypertext
    Markup Language (HTML). HTML enables you to define a web page’s structure, including
    sections, lists, headings, connection points, pictures, mixed-media players, and
    more.


    HTML is not a programming language. It is a markup language that tells Internet
    browsers how to structure web pages that a user visits. HTML consists of various
    components that you use to manipulate substantive page elements to show in a specific
    way. Encasing labels, for instance, can turn content into a hyperlink that associates
    with another page or can be used to emphasize words/terms.'
  raw: '## Machine Learning Overview


    Machine learning, a subset of artificial intelligence (AI), aims to enable computers
    to learn without interacting with specific programs. ML enables computers to develop
    programs that can access data and use it to learn for themselves (and thus perform
    like a human).


    Arthur Samuel, who believed that computers could learn without specific programs,
    popularized the term *machine learning* in 1959\. In 1997, Tom Mitchell further
    clarified the concept of ML, stating that a computer could learn from some relative
    measure involving past performance while processing some task, thus giving some
    *experience* to the computer.


    Today, electronics of all kinds are outfitted with cutting-edge, high-sensitivity
    sensors. Further, Internet connectivity allows for communication among gadgets
    (things) for better environment-condition monitoring. Accordingly, the massive
    amount of data generated from these gadgets drives the Internet of Things (IoT)
    concept. Using AI and ML strategies, the broad information gathered can be processed,
    scaled, ordered, and used to predict events.


    In conventional ML approaches, data is sent to and handled through a central server,
    which experiences communication overhead, latency, protection loss, and security
    issues. To overcome these difficulties, inferences from the data collected in
    the IoT realm can be made by deploying better ML techniques near the data origin
    using, for instance, browser-environment capabilities. Exploiting ML strategies
    on resource-constrained computing devices through a browser helps respective entities
    to make better decisions in real time for enhanced functionality.


    The tremendous computational demands of current AI strategies and the development
    of ever-increasing numbers of AI-enhanced applications forecast more data-processing
    problems. After all, computer-based intelligence systems features are more demanding
    as they seek to reduce resource utilization, to quicken resource accessibility,
    and to exploit resource utilization for precision.


    Software developers and engineers can now more effectively leverage AI to conceptualize
    exceptionally responsive applications that respond to user-sourced information
    in real time, such as voice or facial recognition. They can also make smarter
    applications that can learn from user behavior. Computer-based intelligence enables
    us to automate applications to incorporate substantive proposals, to respond to
    voice requests or physical motions, to use mobile phone cameras to recognize items
    or places, and to figure out how to help users with day-by-day activities.


    In the past, many of the best ML and deep learning (DL) systems required familiarity
    with Python and its related library system. Production of ML models required unique
    reasoning equipment and programming tools, such as NVIDIA graphical processing
    units (GPUs) and CUDA. Now, however, incorporating ML into JavaScript (JS) applications
    often involves deploying the ML part on remote cloud systems, such as Amazon Web
    Services (AWS), and getting the model to run on the local system via application
    programming interface (API) calls. This nonlocal, back-end centered methodology
    has likely kept many web engineers from taking advantage of the abundant prospects
    AI offers to front-end improvement.


    The main advantage of running AI strategies on users’ local devices (i.e., near
    the data-origin source) is that the information never leaves the user’s device.
    This point is critically significant because users rightfully worry about their
    data privacy, especially in the wake of well-publicized and embarrassing information
    leaks and security breaches.


    With the help of TensorFlow.js software tools, developers/users can exploit AI
    without sending their information over a system that potentially makes it available
    to an outsider. These tools make it simpler to develop secure applications that
    comply with information security guidelines, such as healthcare applications that
    read wearable clinical sensors. The tools also make AI program augmentation possible,
    thus allowing upgrades while shielding user conduct/information.


    Integrating JS programming features with AI strategies in a simple interface can
    lead to more straightforward access to rich sensor information from IoT devices.
    User behavior can be modeled based on interactivity with device information sources
    such as voice or webcams. Because similar programming code can run on, for example,
    mobile phones utilizing accelerometers, gyroscopes, and Global Positioning System
    (GPS), integrating AI computational capabilities into user devices themselves
    can prove highly beneficial.


    ## Web Communication


    Figure [1-1](#503949_1_En_1_Chapter.xhtml#Fig1) shows the big-picture web basics
    for AI applications that run on user devices.


    ![../images/503949_1_En_1_Chapter/503949_1_En_1_Fig1_HTML.jpg](images/503949_1_En_1_Chapter/503949_1_En_1_Fig1_HTML.jpg)


    Figure 1-1


    Web communication through the Internet and localhost


    The three web development essentials are as follows:


    *   Client (web browsers, used to surf the web)


    *   Server systems (used to supply information to the browsers)


    *   Computer networks (used to support browser-server communication)


    The web activity shown in Figure [1-1(a)](#503949_1_En_1_Chapter.xhtml#Fig1) illustrates
    the internetworking principle, where communication between the client and server
    is done through protocols such as the Internet Protocol (IP), Transmission Control
    Protocol (TCP), Hypertext Transfer Protocol (HTTP), and the File Transfer Protocol
    (FTP). Figure [1-1(b)](#503949_1_En_1_Chapter.xhtml#Fig1) shows that communication
    between the client (browser/services/applications) and the server (localhost)
    happens locally and provides the required information to the respective applications
    (client/browser/services).


    The following terms relate to the communication:


    ![../images/503949_1_En_1_Chapter/503949_1_En_1_Fig2_HTML.jpg](images/503949_1_En_1_Chapter/503949_1_En_1_Fig2_HTML.jpg)


    Figure 1-2


    The communication between the web client (browser) and the web server


    *   *World Wide Web* *(WWW or web)*: A system of interlinked, hypertext documents
    that runs over the Internet. There are two types of software: client and server.
    A system that wants to access the information provided by servers must run client
    software (e.g., a web browser), and an Internet-connected computer that wants
    to provide information to others must run server software. The client and server
    applications communicate over the Internet by following a protocol built on TCP/IP
    (i.e., HTTP) (Figure [1-2](#503949_1_En_1_Chapter.xhtml#Fig2)).


    *   *Hypertext* : An information format that enables one to move from one part
    of a document to another or from one document to another through hyperlinks.


    *   *Uniform Resource Locator (URL)* : Unique identifiers used to locate a particular
    resource on the network.


    *   *Markup language*: Defines the structure and content of hypertext documents.


    ### Organizing the Web with HTML


    To design and develop web pages, you want to be thoroughly familiar with Hypertext
    Markup Language (HTML). HTML enables you to define a web page’s structure, including
    sections, lists, headings, connection points, pictures, mixed-media players, and
    more.


    HTML is not a programming language. It is a markup language that tells Internet
    browsers how to structure web pages that a user visits. HTML consists of various
    components that you use to manipulate substantive page elements to show in a specific
    way. Encasing labels, for instance, can turn content into a hyperlink that associates
    with another page or can be used to emphasize words/terms.'
  trans: '

    ## 机器学习概述


    机器学习是人工智能的一个子集，旨在让计算机无需与特定程序交互即可学习。机器学习使计算机能够开发出可以访问数据并利用数据进行自我学习的程序（从而像人类一样执行任务）。


    阿瑟·塞缪尔认为计算机无需特定程序即可学习，他在 1959 年推广了*机器学习*这一术语。1997 年，汤姆·米切尔进一步阐明了机器学习的概念，指出计算机可以在处理某些任务时，根据涉及过往表现的某种相对度量进行学习，从而赋予计算机一些*经验*。


    如今，各类电子产品都配备了尖端的高灵敏度传感器。此外，互联网连接使得各种设备之间能够进行通信，以实现更好的环境状况监测。因此，这些设备产生的海量数据推动了物联网概念的发展。利用人工智能和机器学习策略，可以处理、缩放、排序所收集的广泛信息，并用于预测事件。


    在传统的机器学习方法中，数据被发送到中央服务器进行处理，这会导致通信开销、延迟、保护损失和安全问题。为了克服这些困难，可以通过在数据源附近部署更好的机器学习技术（例如，利用浏览器环境的能力）来对物联网领域收集的数据进行推断。在资源受限的计算设备上通过浏览器利用机器学习策略，有助于相关实体实时做出更好的决策，以增强功能。


    当前人工智能策略的巨大计算需求以及越来越多人工智能增强型应用的开发，预示着更多的数据处理问题。毕竟，基于计算机的智能系统功能要求更高，因为它们力求减少资源利用、加快资源可访问性，并利用资源利用来提高精度。


    软件开发者现在可以更有效地利用人工智能来构思高度响应式的应用程序，这些应用能够实时响应用户提供的信息，例如语音或面部识别。他们还可以制作能够从用户行为中学习的更智能的应用程序。基于计算机的智能使我们能够自动化应用程序，以纳入实质性建议、响应语音请求或身体动作、使用手机摄像头识别物品或地点，并找出如何帮助用户处理日常活动的方法。


    过去，许多最佳的机器学习和深度学习系统都需要熟悉 Python 及其相关的库系统。机器学习模型的生成需要独特的推理设备和编程工具，例如 NVIDIA 图形处理单元和
    CUDA。然而，现在将机器学习集成到 JavaScript 应用程序中，通常涉及将机器学习部分部署在远程云系统上（例如亚马逊云服务），并通过应用程序编程接口调用让模型在本地系统上运行。这种非本地的、以后端为中心的方法可能使许多网络工程师无法利用人工智能为前端改进提供的丰富前景。


    在用户本地设备（即数据源附近）运行人工智能策略的主要优势在于，信息永远不会离开用户的设备。这一点至关重要，因为用户理所当然地担心他们的数据隐私，尤其是在广为人知且令人尴尬的信息泄露和安全漏洞事件之后。


    借助 TensorFlow.js 软件工具，开发者/用户无需将信息发送到可能被外部人员获取的系统，就能利用人工智能。这些工具使得开发符合信息安全准则的安全应用程序变得更加简单，例如读取可穿戴临床传感器的医疗保健应用程序。这些工具还使得人工智能程序增强成为可能，从而允许在保护用户行为/信息的同时进行升级。


    在一个简单的界面中将 JavaScript 编程特性与人工智能策略相结合，可以更直接地访问来自物联网设备的丰富传感器信息。可以根据与设备信息源（如语音或网络摄像头）的交互性来对用户行为进行建模。由于类似的编程代码可以在例如利用加速度计、陀螺仪和全球定位系统的手机上运行，因此将人工智能计算能力集成到用户设备本身中可以证明是非常有益的。


    ## 网络通信


    图 1-1 展示了在用户设备上运行的人工智能应用的整体网络基础知识。


    ![../images/503949_1_En_1_Chapter/503949_1_En_1_Fig1_HTML.jpg](img/503949_1_En_1_Fig1_HTML.jpg)


    图 1-1


    通过互联网和本地主机的网络通信


    三个网络开发要点如下：


    *   客户端（用于浏览网页的网络浏览器）

    *   服务器系统（用于向浏览器提供信息）

    *   计算机网络（用于支持浏览器-服务器通信）


    图 1-1(a) 所示的网络活动说明了互联网互连原理，其中客户端和服务器之间的通信通过诸如互联网协议、传输控制协议、超文本传输协议和文件传输协议等协议完成。图
    1-1(b) 显示客户端（浏览器/服务/应用程序）和服务器（本地主机）之间的通信在本地进行，并向相应的应用程序（客户端/浏览器/服务）提供所需信息。


    以下术语与通信相关：


    ![../images/503949_1_En_1_Chapter/503949_1_En_1_Fig2_HTML.jpg](img/503949_1_En_1_Fig2_HTML.jpg)


    图 1-2


    网络客户端（浏览器）与网络服务器之间的通信


    *   *万维网*：一个运行在互联网上的、相互链接的超文本文档系统。有两种类型的软件：客户端和服务器。想要访问服务器提供信息的系统必须运行客户端软件（例如，网络浏览器），而想要向他人提供信息的联网计算机必须运行服务器软件。客户端和服务器应用程序通过遵循基于
    TCP/IP 的协议（即 HTTP）在互联网上进行通信（图 1-2）。


    *   *超文本*：一种信息格式，允许人们通过超链接从一个文档的一部分移动到另一部分，或从一个文档移动到另一个文档。


    *   *统一资源定位符*：用于定位网络上特定资源的唯一标识符。


    *   *标记语言*：定义超文本文档的结构和内容。


    ### 使用 HTML 组织网页


    要设计和开发网页，你需要彻底熟悉超文本标记语言。HTML 使你能够定义网页的结构，包括章节、列表、标题、连接点、图片、混合媒体播放器等。


    HTML 不是一种编程语言。它是一种标记语言，告诉互联网浏览器如何构建用户访问的网页。HTML 由各种组件组成，你可以使用这些组件来操作实质性页面元素，使其以特定方式显示。例如，封装标签可以将内容转换为链接到另一个页面的超链接，或者用于强调单词/术语。

