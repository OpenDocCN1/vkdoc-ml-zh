    ## 使用 TensorFlow.js 进行机器学习


    TensorFlow.js 用于完全在浏览器中，通过 JavaScript 和应用程序编程接口（API）方法来描述、训练和运行 AI 模型。如果你是一名 JavaScript
    网页开发者，并且是机器学习新手，那么 TensorFlow.js 是开始学习和开发在浏览器中融入智能的应用程序的绝佳方式。然而，如果你是一名机器学习设计师，并且是
    JavaScript 新手，本书中的材料将为你提供一个快速入门指南，介绍 TensorFlow.js 资源如何帮助你开发智能应用程序。


    在使用 TensorFlow.js 开发应用程序时，你可能会倾向于以下方法之一：


    *   你可以导入一个预训练模型用于推导（推理）。如果你有一个 TensorFlow 或 Keras 的现有模型，并且该模型是在离线模式下准备的，你可以将其转换为
    TensorFlow.js 格式，并加载到浏览器中进行推理。


    *   对于快速开发应用程序，迁移学习方法可能很合适。这种方法允许你使用 TensorFlow.js，通过 JavaScript 和 API 层，完全在浏览器中描述、训练和运行模型。如果你熟悉
    Keras，那么 API 层应该会让你感到熟悉，可以轻松地将其转换为新模型。


    *   网页开发者可以使用 TensorFlow.js，利用 JavaScript 特性，完全在浏览器中描述、训练和执行模型。


    TensorFlow.js 是一个用于 AI 的 JavaScript 库系统，它取代了 deeplearn.js，后者现在被称为 TensorFlow.js
    Core。TensorFlow.js 还包含一个 Layers API，这是一个用于构建利用 Core（例如，用于移植 TensorFlow 和 Keras
    模型的设备）的 AI 模型的高级库。图 4-1 展示了 TensorFlow.js 的概览。


    ![../images/503949_1_En_4_Chapter/503949_1_En_4_Fig1_HTML.jpg](img/503949_1_En_4_Fig1_HTML.jpg)


    图 4-1


    TensorFlow.js 概览


    你可以直接在浏览器中创建/构建模型。此外，你还可以从 Python 导入现有的、先前准备好的模型，并对其进行重新训练。如果你已经在使用 JavaScript
    技术栈，并涉及非关系型数据库（NoSQL）和 JavaScript 对象表示法（JSON），那么你应该考虑的一个用例是利用 TensorFlow.js 在浏览器中构建模型。TensorFlow.js
    包含了 Keras API，这是一个用于构建 AI/ML 学习模型的简单软件工具。它同样包含一个较低级别的 API，以前称为 deeplearn.js，可用于直接的基于变量的数学运算和编程式微分。Ops
    API 支持即时执行模式。在底层，TensorFlow.js 由 WebGL 驱动，WebGL 是一个 JavaScript API，用于在任何互联网浏览器中渲染
    2D 和 3D 图形，而无需插件模块。


    注意


    TensorFlow 即时执行模式是一种命令式编程环境，它会立即评估操作，而无需构建计算图。相反，操作会返回具体的值，而不是构建一个稍后运行的计算图。这使得入门
    TensorFlow 和调试模型变得容易。TF CPU（中央处理器）、TF GPU（图形处理器）和 TF TPU（张量处理器）是分布式策略，模型可以在相应的设备上执行。


    如果神经网络学习过程的信息有限，那么像 Tensorflow 这样的工具在计算上是高效的，可以实现更好的实现。假设需要处理大型数据集，那么像 NVIDIA
    GPU/Google TPU 或现场可编程门阵列（FPGA）这样的统一计算设备架构（CUDA）系统就非常必要。基本上，Tensorflow 工具基于 JavaScript（JS）编程执行。它将通过
    WebGL API 支持 GPU 进行高效的数据处理，这比 CUDA 系统更好。


    TensorFlow.js 是一个用于在 JavaScript 中创建和准备 AI 模型，并将其发送到程序或 Node.js 上的库。你可以利用现有模型，转换
    Python TensorFlow 模型，使用迁移学习用你的信息重新训练现有模型，以及从头开始创建模型。TensorFlow.js Node.js 环境支持使用
    Python/C TensorFlow 的引入工作作为后端，这可能会利用机器的可用设备加速，例如 CUDA。Node.js 也有一个基于 JS 的后端。然而，其能力是有限的。TensorFlow.js
    有多个具有不同特性的后端。WebGL 后端利用 WebGL 表面进行存储，利用 WebGL 着色器进行执行，从而提供 GPU 支持，并且其速度可比直接的 CPU
    后端快 100 倍。WebGL 不需要 CUDA，因此它可以利用任何可用的 GPU。


    用于程序的 WebAssembly（WASM）TensorFlow.js 后端利用 XNNPACK 库来提升神经网络管理器的 CPU 执行性能。WASM 后端通常比
    JS CPU 后端快得多（10 倍到 30 倍），但通常比 WebGL 后端慢（除了小型模型）。你的实际效果可能会有所不同，因此请在你的设备上为你的模型测试
    WASM 和 WebGL 两种后端。


