    \ IDE. A free version is available, but if you want all the JS features it offers,\
    \ consider the paid Ultimate Edition. IntelliJ IDEA can save you time and energy\
    \ in web development, and it is an excellent CSS IDE. Note, as well, that it supports\
    \ a wide range of programming dialects.\n\n### Building Blocks of Web Development\n\
    \nThe three building blocks of web development are as follows:\n\n*   *HTML*:\
    \ Via HTML5, computers can now understand what is on your website rather than\
    \ just display website content dynamically. Earlier HTML versions provide static\
    \ or dynamic information to the users. Website content is shown via HTML code.\n\
    \n*   *CSS*: CSS determines what the website/pages look like. HTML is for making\
    \ the content, whereas CSS is for showing the content in the way you want (i.e.,\
    \ the design; the different styles, colors, backgrounds, and layout). CSS makes\
    \ a website/page look interesting.\n\n*   *JavaScript*: JS is a programming language\
    \ used to manipulate HTML and CSS. Its main function is to provide interactive\
    \ features for the user. It is sturdy and can be used to create full web applications\
    \ (apps).\n\nNote\n\nTo develop and test the applications/code in this book, consider\
    \ using Google’s Chrome browser, which has versions for Mac, Windows, and Linux.\n\
    \n### HTML and CSS Programming\n\nA coherent web development process requires\
    \ that you first define *what* you want to say (HTML) and then define *how* you\
    \ want to say it (CSS). An HTML component (element) is the combination of a start\
    \ tag, its characteristics (attributes), an end tag, and everything in between.\
    \ An HTML tag—either opening (`< >`) or closing (`</ >`)—is used to identify the\
    \ beginning or end of a component (element). The following code shows the structure\
    \ of an HTML document and some of its basic elements:\n\nThe first line, `<!DOCTYPE\
    \ html>`, informs the browser that it is an HTML5 version web page. The entire\
    \ web page content is to be wrapped in `<html>` tags. The actual `<html>` text\
    \ is called an *opening tag*, and `</html>` is called a *closing tag* . Everything\
    \ inside of these tags is considered part of the `<html>` *element*, which is\
    \ the actual thing that gets created when a web browser parses your HTML tags.\
    \ Inside the `<html>` element are two more elements: `<head>` and `<body>`. A\
    \ web page `<head>` contains all of its metadata, such as the page title, any\
    \ CSS style sheets, and other things required to render the page but that you\
    \ do not necessarily want the user to see. The bulk of our HTML markup will live\
    \ in the `<body>` element, which represents the visible content of the page.\n\
    \nComments are given between the tags `<!--` and `-->`. Listing [1-1](#503949_1_En_1_Chapter.xhtml#PC2)\
    \ shows a more complete HTML example, and Figure [1-4](#503949_1_En_1_Chapter.xhtml#Fig4)\
    \ shows the corresponding output.\n\n![../images/503949_1_En_1_Chapter/503949_1_En_1_Fig4_HTML.jpg](images/503949_1_En_1_Chapter/503949_1_En_1_Fig4_HTML.jpg)\n\
    \nFigure 1-4\n\nScreenshot of the basic HTML code and its output\n\n```\n\nBasic\
    \ HTML Web Page\n\n Web Development is Easy! \n First, we need to learn some basic\
    \ HTML \n Headings \n Headings structure the outline of the website.\nThere are\
    \ six levels of headings \n Lists \n There are two types of Lists \n Unordered\
    \ List \n\nAdd a \"ul\" element (it stands for unordered list)\nAdd each item\
    \ in its own \"li\" element\nThey don't need to be in any particular order\n\n\
    \ Ordered List \n\nNotice the new \"ol\" element wrapping everything\nBut, the\
    \ list item elements are the same\nAlso note how the numbers increment on their\
    \ own\nYou should be noticing things is this precise order, because this is an\
    \ ordered list\n\nInline Elements\nSometimes, you need to draw attention to a\
    \ particular word or\nphrase.\nThis is some emphasized text\nOther times you need\
    \ to strongly emphasize the importance of a word or phrase.\nEmpty Elements and\
    \ Line break using br tag\nWeb Programming is easier.\nRegards,\nThe Authors\n\
    \ Horizontal Line \n\nP.S. This is a basic HTML Web page to understand how a web\
    \ page looks like. \n\nListing 1-1\nBasic HTML Content of a Web Page\n```\n\n\
    #### Dynamic HTML\n\nDynamic HTML (DHTML) enables developers to control the display\
    \ and position of HTML elements in a browser window. HTML is used to create static\
    \ web pages, and DHTML is used to create dynamic web pages. HTML consists of simple\
    \ HTML tags, whereas DHTML consists of HTML tags plus CSS plus JS.\n\n#### Cascading\
    \ Style Sheets\n\nCSS helps us to specify how elements on the web page should\
    \ be presented. With CSS, we can determine the style and layout of the web page.\
    \ There are three ways to use style sheets:\n\n*   Inline style sheets (Listing\
    \ [1-2](#503949_1_En_1_Chapter.xhtml#PC3))\n\n*   Embedded style sheets (Listing\
    \ [1-3](#503949_1_En_1_Chapter.xhtml#PC4))\n\n*   External style sheets (Listing\
    \ [1-4](#503949_1_En_1_Chapter.xhtml#PC5))"
  trans: "\n## 使用 IDE/编辑器进行 Web 开发\n\n集成开发环境（IDE）与文本编辑器在 Web 开发中的区别在于，IDE 能够完成从基础内容管理到高级开发的所有工作，而这些是文本编辑器无法做到的。\n\
    \n例如，[***Sublime***](https://www.sublimetext.com/)、[***Notepad++***](https://notepad-plus-plus.org/downloads/)\
    \ 和 [***Atom***](https://atom.io/) 等编辑器可用于编写网页设计代码中的 HTML 和层叠样式表（CSS）。这些编辑器包含许多优秀功能（例如，包含可适应界面的语言结构，以及为需要增强应用能力的\
    \ Web 开发者提供的全面导航工具）。例如，Web 开发者可能需要调试器和编译器来高效开发 Web 应用。图 1-3 展示了这三种编辑器的编程环境。\n\n\
    ![../images/503949_1_En_1_Chapter/503949_1_En_1_Fig3_HTML.jpg](img/503949_1_En_1_Fig3_HTML.jpg)\n\
    \n图 1-3\n\nNotepad++、Sublime 和 Atom 编辑器环境\n\n然而，使用最好的 IDE 时，你无需过多担忧。它们通常在一个应用程序中集成了全面的开发工具，包括自动化、测试和预测功能。主要而言，它们为\
    \ Web 开发者提供了将代码转化为可运行应用的必要支持。以下是一些较为流行的 IDE：\n\n*   [*Visual Studio Code*](https://code.visualstudio.com/)：Visual\
    \ Studio Code 或许是适用于 Windows、Mac 和 Linux 平台的最佳 JavaScript IDE。除了支持 JS 功能外，它还支持\
    \ Node.js 和 TypeScript 特性，并包含一个针对不同编程语言（包括 C++、C#、Python 和 PHP）的扩展系统。Visual Studio\
    \ Code 凭借出色的语法特性和 IntelliSense 自动补全功能（可响应多种因素、单词定义和导入模块），实现了对程序员友好的操作。\n\n*  \
    \ [*NetBeans*](https://netbeans.org/)：NetBeans 是最佳的 Web 开发 IDE 之一，因为它能让你创建一个整洁且多功能的工作区，并快速开发\
    \ Web 应用。它还能很好地与 JS、HTML5、PHP 和 C/C++ 配合使用。它是一款免费的 JS IDE，也是一款日常使用中出色的 HTML5 IDE。该\
    \ IDE 允许你审查代码中的错误，并在必要时自动修复语法（包括 Java 8 特性，如 lambda 表达式）。\n\n*   *PyCharm*：PyCharm\
    \ 并非最佳的免费 JS IDE。然而，如果你正在寻找一款用于 Python 的可靠 Web 开发 IDE，其付费的专业版值得考虑。\n\n*   *IntelliJ\
    \ IDEA*：IntelliJ IDEA 是一款出色的 Web 开发 IDE。它提供免费版本，但如果你想要其提供的所有 JS 功能，可以考虑付费的终极版。IntelliJ\
    \ IDEA 能在 Web 开发中为你节省时间和精力，并且它也是一款出色的 CSS IDE。此外，请注意它支持多种编程语言。\n\n### Web 开发的构建模块\n\
    \nWeb 开发的三大构建模块如下：\n\n*   *HTML*：通过 HTML5，计算机现在不仅能动态显示网站内容，还能理解网站上的内容。早期的 HTML\
    \ 版本向用户提供静态或动态信息。网站内容通过 HTML 代码显示。\n\n*   *CSS*：CSS 决定了网站/页面的外观。HTML 用于制作内容，而\
    \ CSS 用于以你想要的方式展示内容（即设计；不同的样式、颜色、背景和布局）。CSS 让网站/页面看起来更有趣。\n\n*   *JavaScript*：JS\
    \ 是一种用于操作 HTML 和 CSS 的编程语言。其主要功能是为用户提供交互特性。它很健壮，可用于创建完整的 Web 应用。\n\n注意\n\n要开发和测试本书中的应用/代码，建议使用\
    \ Google 的 Chrome 浏览器，该浏览器有适用于 Mac、Windows 和 Linux 的版本。\n\n### HTML 和 CSS 编程\n\
    \n一个连贯的 Web 开发过程要求你首先定义*要说什么*（HTML），然后定义*怎么说*（CSS）。一个 HTML 组件（元素）由开始标签、其特性（属性）、结束标签以及两者之间的所有内容组成。HTML\
    \ 标签——无论是开始标签（`< >`）还是结束标签（`</ >`）——用于标识组件（元素）的开始或结束。以下代码展示了 HTML 文档的结构及其一些基本元素：\n\
    \n第一行 `<!DOCTYPE html>` 告知浏览器这是一个 HTML5 版本的网页。整个网页内容需要包裹在 `<html>` 标签内。实际的 `<html>`\
    \ 文本称为*开始标签*，而 `</html>` 称为*结束标签*。这些标签内的所有内容都被视为 `<html>` *元素*的一部分，该元素是当 Web 浏览器解析你的\
    \ HTML 标签时实际创建的东西。在 `<html>` 元素内部，还有两个元素：`<head>` 和 `<body>`。网页的 `<head>` 包含其所有元数据，例如页面标题、任何\
    \ CSS 样式表以及渲染页面所需的其他内容，但这些内容你通常不希望用户看到。我们大部分的 HTML 标记将位于 `<body>` 元素中，该元素代表页面的可见内容。\n\
    \n注释写在标签 `<!--` 和 `-->` 之间。清单 1-1 展示了一个更完整的 HTML 示例，图 1-4 显示了相应的输出。\n\n![../images/503949_1_En_1_Chapter/503949_1_En_1_Fig4_HTML.jpg](img/503949_1_En_1_Fig4_HTML.jpg)\n\
    \n图 1-4\n\n基本 HTML 代码及其输出的截图\n\n```\n\nBasic HTML Web Page\n\n Web Development\
    \ is Easy! \n First, we need to learn some basic HTML \n Headings \n Headings\
    \ structure the outline of the website.\nThere are six levels of headings \n Lists\
    \ \n There are two types of Lists \n Unordered List \n\nAdd a \"ul\" element (it\
    \ stands for unordered list)\nAdd each item in its own \"li\" element\nThey don't\
    \ need to be in any particular order\n\n Ordered List \n\nNotice the new \"ol\"\
    \ element wrapping everything\nBut, the list item elements are the same\nAlso\
    \ note how the numbers increment on their own\nYou should be noticing things is\
    \ this precise order, because this is an ordered list\n\nInline Elements\nSometimes,\
    \ you need to draw attention to a particular word or\nphrase.\nThis is some emphasized\
    \ text\nOther times you need to strongly emphasize the importance of a word or\
    \ phrase.\nEmpty Elements and Line break using br tag\nWeb Programming is easier.\n\
    Regards,\nThe Authors\n Horizontal Line \n\nP.S. This is a basic HTML Web page\
    \ to understand how a web page looks like. \n\n清单 1-1\n网页的基本 HTML 内容\n```\n\n\
    #### 动态 HTML\n\n动态 HTML（DHTML）使开发者能够控制浏览器窗口中 HTML 元素的显示和位置。HTML 用于创建静态网页，而 DHTML\
    \ 用于创建动态网页。HTML 由简单的 HTML 标签组成，而 DHTML 由 HTML 标签加上 CSS 和 JS 组成。\n\n#### 层叠样式表\n\
    \nCSS 帮助我们指定网页上的元素应如何呈现。通过 CSS，我们可以确定网页的样式和布局。使用样式表有三种方式：\n\n*   内联样式表（清单 1-2）\n\
    \n*   嵌入式样式表（清单 1-3）\n\n*   外部样式表（清单 1-4）\n"
- fmt: "### Inline Style Sheets\n\nAn inline style sheet is used to apply various\
    \ unique styles to a single element. You can also use an inline style sheet to\
    \ define a style for a special type of element or add a class attribute to the\
    \ element. Listing [1-2](#503949_1_En_1_Chapter.xhtml#PC3) shows how inline styles\
    \ can be used along with HTML elements. Figure [1-5](#503949_1_En_1_Chapter.xhtml#Fig5)\
    \ shows the corresponding output.\n\n![../images/503949_1_En_1_Chapter/503949_1_En_1_Fig5_HTML.jpg](images/503949_1_En_1_Chapter/503949_1_En_1_Fig5_HTML.jpg)\n\
    \n**Figure 1-5** Output of the inline CSS style settings\n\n```\n Inline Style\
    \ sheets \n\n This is Simple Text \n This text is different \n This text is colored\
    \ \n\nListing 1-2\nInline Style Sheets Example\n```\n\n### Embedded Style Sheets\n\
    \nFor embedded style sheets, we write all desired selectors along with the properties\
    \ and values in the `head` section. Then, in the `body` section, newly defined\
    \ selector tags are used with the actual content. The DHTML script in Listing\
    \ [1-3](#503949_1_En_1_Chapter.xhtml#PC4) defines `h1`, `h2`, `h3`, and `p` selectors\
    \ with different properties and values. Figure [1-6](#503949_1_En_1_Chapter.xhtml#Fig6)\
    \ shows the corresponding output of the embedded style settings along with the\
    \ HTML code.\n\n![../images/503949_1_En_1_Chapter/503949_1_En_1_Fig6_HTML.jpg](images/503949_1_En_1_Chapter/503949_1_En_1_Fig6_HTML.jpg)\n\
    \n**Figure 1-6** Output of the embedded style settings\n\nNote that to define\
    \ embedded style sheets we have to mention `style type= \"test/css\"` in the `head`\
    \ section.\n\n```\n Embedded Style sheets \n\nh1,h2,h3{font-family:arial;}\nh2\
    \ {color:red;left:20px }\nh3 {color:blue;}\np {font-size:14pt;font-family:verdana;}\n\
    .special {color:green}\n\nThis page is created using Embedded style sheets  \n\
    \ This line is aligned left and red colored \n The embedded style sheet is the\
    \ most commonly used style sheet. This paragraph is written in Verdana font with\
    \ font size of 14pt\n This is blue\n colored  line\n\nListing 1-3\nEmbedded Style\
    \ Sheets Example\n```\n\n### External Style Sheets\n\nWhen we want to apply a\
    \ particular style to more than one web page, we can use external style sheets.\
    \ This type of style sheet is stored in one `.css` file, and we must mention the\
    \ name of that file in our relevant web pages. When we do so, the styles defined\
    \ in `.css` file are applied to these web pages. Listing [1-4](#503949_1_En_1_Chapter.xhtml#PC5)\
    \ is a simple program in which external style sheets are used.\n\n```\n External\
    \ Style sheets \n\nThis page is created using External style sheets  \n This line\
    \ is aligned left and red colored \n The embedded style sheet is the most commonly\
    \ used style sheet. This paragraph is written in Verdana font with font size of\
    \ 14pt\nThis is blue\n colored  line\n\nListing 1-4\nExternal Style Sheet Example\n\
    ```\n\nThe external style sheet is referenced in the `href` attribute as a value\
    \ linking to `ex1.css`. Create a file named `ex1.css` in the same folder:\n\n\
    ```\nh1 {font-family:arial;}\nh2 {\nfont-family:times new roman;\ncolor:red;\n\
    left:20px;\n}\nh3 {\nfont-family:arial;\ncolor:blue\n}\np {\nfont-size:14pt;\n\
    font-family:cambria;\n}\nspecial {color:green }\n```\n\n## JavaScript Basics\n\
    \nJavaScript is a scripting language (a lightweight programming language) and\
    \ an interpreted language (executing without preliminary compilation). It is usually\
    \ embedded directly into HTML pages and is designed to add interactivity to them.\
    \ Java and JS are different.\n\nJS attributes include the following:\n\n- JS gives\
    \ HTML designers a programming tool.\n- JS can put dynamic text into an HTML page.\n\
    - JS can react to events.\n- JS can read and write HTML elements.\n- JS can be\
    \ used to validate data.\n- JavaScript can be used to apply AI, ML and DL techniques\
    \ in the browser.\n- JavaScript can be used to create cookies (Store and retrieve\
    \ information on the visitor’s computer).\n\n### Including the JavaScript\n\n\
    The HTML `<script>` tag is used to insert a script (JS) into an HTML page:\n\n\
    ```\ndocument.write(\"Hello World!\");\n```\n\nThe `<script>` tag is used to embed\
    \ a client-side script. The `<script>` element either contains scripting statements\
    \ or points to an external script file through the `src` attribute.\n\n### Where\
    \ to Insert JS Scripts\n\nYou can include scripts in the `head`, `body`, or external\
    \ JavaScript file (`.js`). Scripts in the `head` section (Listing [1-5](#503949_1_En_1_Chapter.xhtml#PC8))\
    \ will be executed when the `head` section is invoked. Figure [1-7](#503949_1_En_1_Chapter.xhtml#Fig7)\
    \ shows the corresponding output. Scripts in the `body` section executes while\
    \ the page loads (Listing [1-6](#503949_1_En_1_Chapter.xhtml#PC9)), and Figure\
    \ [1-8](#503949_1_En_1_Chapter.xhtml#Fig8) shows the corresponding output.\n\n\
    ![../images/503949_1_En_1_Chapter/503949_1_En_1_Fig8_HTML.jpg](images/503949_1_En_1_Chapter/503949_1_En_1_Fig8_HTML.jpg)\n\
    \n**Figure 1-8** JavaScript inside the body section\n\n![../images/503949_1_En_1_Chapter/503949_1_En_1_Fig7_HTML.jpg](images/503949_1_En_1_Chapter/503949_1_En_1_Fig7_HTML.jpg)\n\
    \n**Figure 1-7** JavaScript inside the head section\n\n```\nfunction msg(){\n\
    alert(\"Hello message\");\n}\n\nWelcome to JavaScript\n\nListing 1-5\nJavaScript\
    \ Inside the Head Section\n```\n\n```\nHello Java Script\n\ndocument.getElementById(\"\
    demo\").innerHTML = \"Java Script within the body!\";\n\nListing 1-6\nJavaScript\
    \ Inside the Body Section\n```\n\nListing [1-7](#503949_1_En_1_Chapter.xhtml#PC10)\
    \ provides the JS function external to the program, and Listing [1-8](#503949_1_En_1_Chapter.xhtml#PC11)\
    \ shows the HTML for the corresponding output in Figure [1-9](#503949_1_En_1_Chapter.xhtml#Fig9).\n\
    \n![../images/503949_1_En_1_Chapter/503949_1_En_1_Fig9_HTML.jpg](images/503949_1_En_1_Chapter/503949_1_En_1_Fig9_HTML.jpg)\n\
    \n**Figure 1-9** JS external to the program\n\n```\nProgram call to external JavaScript\n\
    \nListing 1-8\nHTML for Click Button\n```\n\n```\nfunction msg(){\nalert(\"Hello\
    \ I am Outside your program\");\n}\nListing 1-7\nMessage.js\n```\n\n### JavaScript\
    \ for an Event-Driven Process\n\nDynamic website development is possible by leveraging\
    \ event-driven programming with JS. Commonly, after a website page has stacked,\
    \ the JS program keeps running (and waiting for an event to occur). If you interact\
    \ with the web page, a JS script executes the code that corresponds with that\
    \ interaction (event), and the behavior of the page changes based on the event.\
    \ Figure [1-10](#503949_1_En_1_Chapter.xhtml#Fig10) shows a typical event-driven\
    \ process with the help of JS features.\n\n![../images/503949_1_En_1_Chapter/503949_1_En_1_Fig10_HTML.png](images/503949_1_En_1_Chapter/503949_1_En_1_Fig10_HTML.png)\n\
    \n**Figure 1-10** Event-driven process on the web page with the help of JS code"
