- fmt: '# 3. Human Pose Estimation in the Browser


    This chapter describes human pose estimation, a computer vision advancement that
    seeks to understand human movement through pictures and videos. The chapter discusses
    the various ways to estimate human poses through machine learning (ML) methods,
    with a focus on Dan Oved’s `PoseNet` method.


    `PoseNet` is an ML model that allows for real-time human pose estimation by finding
    different points on the human body and face. This chapter shows you step by step
    how to write the code to recognize various poses (keypoints) of the human face.
    Programming instructions teach you how to collect and manage the data related
    to these keypoints. This procedure will help you estimate other vital human pose
    keypoints and understand their classification patterns, as discussed in the following
    chapters.


    ## Human Pose at a Glance


    Human pose assessment is an important topic that the computer vision community
    has been grappling with for the past few decades. It is a pivotal advancement
    toward understanding individuals in pictures and videos.


    Human pose estimation is done by defining joints of a human body (otherwise called
    *keypoints*: elbows, wrists, and so on) in still images or videos. It is also
    characterized as the quest for a specific pose in the space of all poses.


    The fundamentals of a human 2D pose is the estimate of a 2D coordinate (`x`, `y`)
    for each joint of the human pose from an RGB (red, green, blue) image. Human 2D
    pose estimation can be used to assess (and analyze and hopefully improve) the
    specific movements of a football player (or other sportsperson) during a game.
    A gait analysis can be monitored for early diagnosis of potential problems related
    to such.


    ### PoseNet vs. OpenPose


    You can enable human pose estimation on computing devices by utilizing various
    libraries such as `PoseNet` developed by Ross Wightman and from Carnegie Mellon
    University. `PoseNet` is built to run on lightweight computing devices such as
    browsers and mobile phones, whereas `OpenPose` is much more precise and intended
    to be run on graphical processing unit (GPU)-powered systems.


    > **Note**

    > It is more expensive and complex (including less flexibility) to run AI/ML programs
    on GPU-powered systems as compared to on non-GPU electronic devices.


    `PoseNet` output for a 2D system is processed fast, but it may miss a number poses
    throughout the video, which you can tell by the flickering and disappearing skeleton.
    Nevertheless, if you really need to use `PoseNet` on resource-constrained devices
    such as on a mobile phone or an embedded system with less computational resources
    (e.g., limited processing capability, less storage, and fewer communication workloads
    and fast response), `PoseNet` is the right choice. Human pose estimation using
    `PoseNet` will enable the user to make smart decisions in near real time when
    the AI methods are executed on the browser or the lightweight computational resources.


    You can improve `PoseNet` estimation accuracy with better data processing procedures
    at the web application to generate better inferences.


    ## Human Pose Estimation Using Neural Networks


    In the literature, numerous human pose estimation methods use neural network philosophy
    proposed by various research groups. The following sections briefly describe the
    evolution of the human pose estimation methods.


    ### DeepPose: Human Pose Estimation via Deep Neural Networks


    `DeepPose` was the main significant paper that applied deep learning (DL) to human
    pose assessment. It accomplished state-of-the-art (SOTA) execution and beat existing
    models. In this methodology, pose assessment is detailed, like a convolutional
    neural network (CNN)-based relapse issue toward body joints. In addition, the
    method utilizes a course of regressors to refine the posture appraisals and to
    improve gauges. One significant thing this methodology does is explain posture
    in comprehensive design (i.e., whether certain joints are covered up; they can
    be assessed if the posture is contemplated comprehensively). The paper contends
    that CNNs typically give possible poses and show reliable results. The `xy` coordinate
    values generated from the method specified by the authors are not accurate as
    it shows the multifaceted (multiple set of values) that are inadequate to specific
    joints of human body.


    ### Efficient Object Localization Using Convolutional Networks


    This approach creates heatmaps by running a picture through various resolutions
    to capture the joints at an assortment of scales. The yield is a discrete heatmap
    rather than a nonstop relapse. A heatmap predicts the likelihood of the common
    happening at every pixel. This yield model is useful, and a number of the papers
    that followed anticipated heatmaps rather than direct regression. The authors
    have considered the joint utilization of a CNN and graphical model.


    ### Convolutional Pose Machines


    Convolutional pose machines are differentiable, and their multistage engineering
    can be prepared start to finish. They give a successive forecast system to learning-rich
    specific spatial models and work very well for human posture. One real inspirations
    of this paper is to learn long-range spatial connections, and they show this can
    be accomplished by utilizing deep multistage networks. The paper utilized moderate
    management after each phase to avoid the issue of evaporating inclinations, which
    is a typical issue for profound multistage organizations.


    ### Human Pose Estimation with Iterative Error Feedback


    This method directly foresees the outcomes in one go. The method utilize a self-adjusting
    model that logically changes an underlying arrangement by taking care of feedback
    data, and this cycle is called *iterative error feedback*.


    ### Stacked Hourglass Networks for Human Pose Estimation


    A stacked hourglass network is a novel and intuitive design that beats every past
    technique. It is called a stacked hourglass network because the organization comprises
    steps of pooling and upsampling layers (resembling an hourglass), and these are
    stacked together. The plan of the hourglass is driven by the need to catch data
    at each scale.


    ### Simple Baselines for Human Pose Estimation and Tracking


    Earlier methodologies work well overall but are unpredictable. Accomplished the
    best in class at mean average precision (mAP) of 73.7% on Common Objects in Contest
    (COCO) dataset. The organization structure is straightforward and comprises a
    residual neural network (ResNet) and a few deconvolutional layers toward the end.


    ### Deep High-Resolution Representation Learning for Human Pose Estimation


    The high-resolution network model is better than the previous methods with respect
    to the single-person keypoint detection and multiperson pose estimation using
    the particular dataset. This method works well when compared to the previous mentioned
    methods.


    This section briefly described the most outstanding and influential models in
    human pose estimation. The approaches were based on the DL methodology with varying
    percentages of accuracy.'
