    color:blue\n}\np {\nfont-size:14pt;\nfont-family:cambria;\n}\nspecial {color:green\
    \ }\n```\n\n## JavaScript Basics\n\nJavaScript is a scripting language (a lightweight\
    \ programming language) and an interpreted language (executing without preliminary\
    \ compilation). It is usually embedded directly into HTML pages and is designed\
    \ to add interactivity to them. Java and JS are different.\n\nJS attributes include\
    \ the following:\n\n*   JS gives HTML designers a programming tool.\n\n*   JS\
    \ can put dynamic text into an HTML page.\n\n*   JS can react to events.\n\n*\
    \   JS can read and write HTML elements.\n\n*   JS can be used to validate data.\n\
    \n*   JavaScript can be used to apply AI,ML and DL techniques in the browser.\n\
    \n*   JavaScript can be used to create cookies (Store and retrieve information\
