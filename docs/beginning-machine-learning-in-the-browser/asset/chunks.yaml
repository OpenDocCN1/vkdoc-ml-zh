    function modelReady() {\n  console.log('posenet model is ready');\n}\nfunction\
    \ draw() {\n  image(video, 0, 0);\n  if (pose) {\n    fill(255, 0, 0);\n    ellipse(pose.nose.x,\
    \ pose.nose.y, 32);\n    fill(255, 255, 0);\n    ellipse(pose.leftEar.x, pose.leftEar.y,\
