    \n3.  `function displayKeypoints()` : This method displays the recognized keypoints\
    \ from the array `poses`. The identified points are displayed in the form of circles\
    \ to show that there is a keypoint:\n\n```\n    function displayKeypoints() {\n\
    \    for(let i=0;i<poses.length;i++) {\n    let pose=poses[i].pose;\n    for(let\
    \ j=0;j<pose.keypoints.length;j++) {\n    let point=pose.keypoints[j];\n    fill(0,0,255);\n\
    \    noStroke();\n    ellipse(point.position.x,point.position.y,10,10);\n    }\n\
    \    }\n    }\n    ```\n\nFigure [4-13](#503949_1_En_4_Chapter.xhtml#Fig13) shows\
    \ the corresponding output.\n\nSingle-person pose estimation using a picture:\
    \ The `function setup()` consists of a `createImg` method to load the image (picture)\
    \ from the local hard disk onto the browser for recognizing the keypoints on the\
    \ image. Figure [4-14](#503949_1_En_4_Chapter.xhtml#Fig14) shows the corresponding\
    \ output.\n\n![../images/503949_1_En_4_Chapter/503949_1_En_4_Fig14_HTML.jpg](images/503949_1_En_4_Chapter/503949_1_En_4_Fig14_HTML.jpg)\n\
    \nFigure 4-14\n\nDisplay of keypoints from a picture\n\nThe following set of instructions\
    \ in the functions are to be written in Demo_4script.js. The main file Demo_4.html\
    \ remains the same:\n\n```\nfunction setup() {\ncreateCanvas(640, 360);\nimg=\
    \ createImg('pics/pexels-derick-santos-2773934.jpg');\nimg.size(width, height);\n\
    myposenet = ml5.poseNet(img, function(){\nselect('#userpic').html('Image Loaded');\n\
    myposenet.singlePose(img);});\nmyposenet.on('pose', function (results) {\nposes\
    \ = results; });\n}\n```\n\nThe `function draw()` contains the methods to display\
    \ the keypoints and also to display the skeleton (sketch related to the joining\
    \ of keypoints) based on the `poses` array:\n\n```\nfunction draw() {\nif (poses.length\
    \ > 0) {\nimage(img, 0, 0, width, height);\ndisplayKeypoints(poses);\ndisplaySkeleton(poses);\n\
    }\n}\n```\n\nThe logic of the `displayKeypoints` remains the same as discussed\
    \ in the previous example. The function `displaySkeleton()` is to draw the *lines*\
    \ on the current image. `draw()` does this in an infinite loop, hence showing\
    \ a continuous output to the user.\n\n## PoseNet Model Confidence Values\n\nThe\
    \ draw function executes and loops through every keypoint that is part of the\
    \ body, and the keypoints array `poses` contains the following information:\n\n\
    *   `\"part\"`: The name of the body part recognized.\n\n*   `\"position.x\"`\
    \ and `\"position.y\"`: Values of a point in the image.\n\n*   `\"score\"`: Confidence\
    \ value indicates the accuracy of detection.\n\nFigure [4-15](#503949_1_En_4_Chapter.xhtml#Fig15)\
    \ shows the output on the browser console.\n\n![../images/503949_1_En_4_Chapter/503949_1_En_4_Fig15_HTML.jpg](images/503949_1_En_4_Chapter/503949_1_En_4_Fig15_HTML.jpg)\n\
    \nFigure 4-15\n\nConfidence values as seen from the poses in the browser console\n\
    \nWe can draw a `point` if the detection accuracy is greater than a certain value\
    \ (e.g., `0.2 or 0.3, or 0.7 and above when you are concerned about certain points).`\
    \ Figure [4-16](#503949_1_En_4_Chapter.xhtml#Fig16) shows the scores related to\
    \ the drawn skeleton.\n\n![../images/503949_1_En_4_Chapter/503949_1_En_4_Fig16_HTML.jpg](images/503949_1_En_4_Chapter/503949_1_En_4_Fig16_HTML.jpg)\n\
    \nFigure 4-16\n\nScores of certain threshold values as seen in the `poses` object\
    \ on the browser console\n\nNote\n\nWhen storing data using the JSON format related\
    \ to output of the PoseNet model, steps are to be written in Demo_4script.js.\
    \ The main file Demo_4.html remains the same\n\nTo capture the keypoint onto a\
    \ separate file in terms of JSON format, you can use the p5 library functions\
    \ as follows:\n\nStep 1\\. Declare a global variable:\n\n```\nlet writer;\n```\n\
    \nStep 2\\. In the setup function, initialize the writer variable with the `createWriter`\
    \ along with the file name for storing the data in the JSON format:\n\n```\n//\
    \ writer object is initialized with createWriter function\nwriter=createWriter('data_keypoints.json');\n\
    ```\n\nStep 3\\. In the displayKeypoints method, invoke the function `print` by\
    \ using the `writer` object:\n\n```\nwriter.print(\"keypoint: \"+keypoint.part+\"\
    \ x:\"+keypoint.position.x+\" y:\"+keypoint.position.y);\n```\n\nStep 4\\. Define\
    \ a function for an event to occur such as `mouseclick`, so that the event will\
    \ trigger the `print` method to store the values of the continuous `draw()` method:\n\
    \n```\nfunction mouseClicked() {\nwriter.close();\n}\n```\n\nThe output is stored\
    \ in a .json file, as shown in Figure [4-17](#503949_1_En_4_Chapter.xhtml#Fig17).\n\
    \n![../images/503949_1_En_4_Chapter/503949_1_En_4_Fig17_HTML.jpg](images/503949_1_En_4_Chapter/503949_1_En_4_Fig17_HTML.jpg)\n\
    \nFigure 4-17\n\nStorage of key points data in the .json file"
  trans: "\n### 步骤 2：使用浏览器摄像头进行单人姿态估计\n\n完整代码包含两个文件：`Demo_3.html`（显示输出的主网页）和 `Demo_3script.js`（用于捕获用户视频的\
    \ JS 代码）。`Demo_3.html` 是显示带关键点输出的主页面，因此库文件被添加在该文件中：\n\n```\n\nDemo on Posenet\
    \ Model\n\nDemo of PoseNet ML model in the browser\n Loading Model....\n\n```\n\
    \n`Demo3_script.js` 包含三个方法（函数）：\n\n![../images/503949_1_En_4_Chapter/503949_1_En_4_Fig13_HTML.jpg](img/503949_1_En_4_Fig13_HTML.jpg)\n\
    \n**图 4-13**\n\n使用浏览器摄像头进行单人姿态估计\n\n1.  `function setup()`：初始设置，用于通过浏览器摄像头捕获视频，并通过调用\
    \ PoseNet 模型将用户视频放置在指定位置。此第一个函数执行且仅运行一次。\n\n```\n    function setup() {\n    createCanvas(640,480);\n\
    \    webcam_output=createCapture(VIDEO);\n    webcam_output.size=(width,height);\n\
    \    myposenet=ml5.poseNet(webcam_output,function(){\n    select('#uservideo').html('User\
    \ Video Loaded')});\n    myposenet.on('pose',function(results) {\n    poses=results;\
    \ });\n    webcam_output.hide();\n    }\n    ```\n\np5.js 库的 `createCanvas(width,\
    \ height)` 用于在浏览器中创建一个窗口（框）来显示输出。窗口（画布）的大小设置为 `width:640px` 和 `height:480px`。\n\
    \n`createCapture(VIDEO)` 用于捕获摄像头视频流并返回一个 p5 对象，该对象存储在用户定义的变量 `webcam_output` 中。摄像头视频的高度和宽度与画布相同。\n\
    \n`poseNet()` 方法创建一个新的 PoseNet 模型，该模型以 `webcam_output` 作为输入，并加载到主 .html 页面中以显示用户视频。\n\
    \n`poseNet.on()` 方法是一个事件监听器。每当用户位置/视频发生变化时，就会向 `myposenet` 模型提供一张新图像。`poseNet`\
    \ 函数进而调用 `function(results)`，模型在该函数中给出关键点及其对应的置信度分数。结果存储在名为 `poses` 的数组中。\n\n\
    函数 `webcam_output.hide()` 隐藏实际的摄像头输出，浏览器上仅显示带有关键点作为输出的画布。\n\n2.  `function draw\
    \ ()`：该函数被调用并无限重复，直到浏览器关闭。此方法进而调用以识别关键点：\n\n```\n    function draw() {\n    image(webcam_output,0,0,width,height);\n\
    \    displayKeypoints();\n    }\n    ```\n\n`draw ()` 函数持续运行以在画布中显示图像。它有五个参数：`webcam_output`（要显示的视频）、相对于画布左上角的\
    \ xy 坐标，以及用于绘制视频的 `width,height`。此函数调用 `displayKeypoints()` 以将识别出的关键点显示为点（椭圆）。\n\
    \n3.  `function displayKeypoints()`：此方法显示来自数组 `poses` 的已识别关键点。识别出的点以圆圈形式显示，以表明存在关键点：\n\
    \n```\n    function displayKeypoints() {\n    for(let i=0;i<poses.length;i++)\
    \ {\n    let pose=poses[i].pose;\n    for(let j=0;j<pose.keypoints.length;j++)\
    \ {\n    let point=pose.keypoints[j];\n    fill(0,0,255);\n    noStroke();\n \
    \   ellipse(point.position.x,point.position.y,10,10);\n    }\n    }\n    }\n \
    \   ```\n\n图 4-13 显示了相应的输出。\n\n**使用图片进行单人姿态估计：** `function setup()` 包含一个 `createImg`\
    \ 方法，用于从本地硬盘加载图片（图像）到浏览器，以识别图像上的关键点。图 4-14 显示了相应的输出。\n\n![../images/503949_1_En_4_Chapter/503949_1_En_4_Fig14_HTML.jpg](img/503949_1_En_4_Fig14_HTML.jpg)\n\
    \n**图 4-14**\n\n从图片显示关键点\n\n函数中的以下指令集需要写入 `Demo_4script.js`。主文件 `Demo_4.html`\
    \ 保持不变：\n\n```\nfunction setup() {\ncreateCanvas(640, 360);\nimg= createImg('pics/pexels-derick-santos-2773934.jpg');\n\
    img.size(width, height);\nmyposenet = ml5.poseNet(img, function(){\nselect('#userpic').html('Image\
    \ Loaded');\nmyposenet.singlePose(img);});\nmyposenet.on('pose', function (results)\
    \ {\nposes = results; });\n}\n```\n\n`function draw()` 包含基于 `poses` 数组显示关键点以及显示骨架（与关键点连接相关的草图）的方法：\n\
    \n```\nfunction draw() {\nif (poses.length > 0) {\nimage(img, 0, 0, width, height);\n\
    displayKeypoints(poses);\ndisplaySkeleton(poses);\n}\n}\n```\n\n`displayKeypoints`\
    \ 的逻辑与前面示例中讨论的相同。函数 `displaySkeleton()` 用于在当前图像上绘制*线条*。`draw()` 在一个无限循环中执行此操作，因此向用户显示连续输出。\n\
    \n## PoseNet 模型置信度值\n\n`draw` 函数执行并遍历属于身体的每个关键点，关键点数组 `poses` 包含以下信息：\n\n*   `\"\
    part\"`：识别出的身体部位名称。\n\n*   `\"position.x\"` 和 `\"position.y\"`：图像中某个点的值。\n\n*\
    \   `\"score\"`：置信度值，表示检测的准确性。\n\n图 4-15 显示了浏览器控制台上的输出。\n\n![../images/503949_1_En_4_Chapter/503949_1_En_4_Fig15_HTML.jpg](img/503949_1_En_4_Fig15_HTML.jpg)\n\
    \n**图 4-15**\n\n从浏览器控制台中的 `poses` 看到的置信度值\n\n如果检测准确性大于某个值（例如，当您关注某些点时，`0.2 或 0.3，或\
    \ 0.7 及以上`），我们可以绘制一个 `point`。图 4-16 显示了与绘制的骨架相关的分数。\n\n![../images/503949_1_En_4_Chapter/503949_1_En_4_Fig16_HTML.jpg](img/503949_1_En_4_Fig16_HTML.jpg)\n\
    \n**图 4-16**\n\n在浏览器控制台的 `poses` 对象中看到的特定阈值分数\n\n注意\n\n当使用与 PoseNet 模型输出相关的 JSON\
    \ 格式存储数据时，步骤需要写入 `Demo_4script.js`。主文件 `Demo_4.html` 保持不变\n\n要以 JSON 格式将关键点捕获到单独的文件中，您可以按如下方式使用\
    \ p5 库函数：\n\n步骤 1\\. 声明一个全局变量：\n\n```\nlet writer;\n```\n\n步骤 2\\. 在 `setup` 函数中，使用\
    \ `createWriter` 以及用于以 JSON 格式存储数据的文件名来初始化 `writer` 变量：\n\n```\n// writer 对象通过\
    \ createWriter 函数初始化\nwriter=createWriter('data_keypoints.json');\n```\n\n步骤 3\\\
    . 在 `displayKeypoints` 方法中，通过使用 `writer` 对象调用 `print` 函数：\n\n```\nwriter.print(\"\
    keypoint: \"+keypoint.part+\" x:\"+keypoint.position.x+\" y:\"+keypoint.position.y);\n\
    ```\n\n步骤 4\\. 定义一个函数用于触发事件，例如 `mouseclick`，以便该事件将触发 `print` 方法来存储连续 `draw()`\
    \ 方法的值：\n\n```\nfunction mouseClicked() {\nwriter.close();\n}\n```\n\n输出存储在一个\
    \ .json 文件中，如图 4-17 所示。\n\n![../images/503949_1_En_4_Chapter/503949_1_En_4_Fig17_HTML.jpg](img/503949_1_En_4_Fig17_HTML.jpg)\n\
    \n**图 4-17**\n\n在 .json 文件中存储关键点数据\n"
- fmt: "# Summary\n\nThis chapter covered the importance of `ANN` and its strategies\
    \ in `ML` modeling for human pose estimation. Through theory and examples in this\
    \ chapter, you learned the basics of `ANN` and how to realize it in the browser\
    \ through `TensorFlow.js` programming. Such an understanding will certainly help\
    \ you to implement various `ML` models such as `PoseNet` in the browser.\n\n`PoseNet`\
    \ model as presented in the chapter is a Machine Learning model that estimates\
    \ human pose key-points in real-time on a browser. The corresponding implementation\
    \ details are presented in this chapter.\n\nThis information will serve as the\
    \ basis to perform complex data analysis on the browser (as you will learn in\
    \ the following chapters).\n\n# 5. Gait Analysis\n\nGait analysis refers to the\
    \ systematic study of animal locomotion, more specifically the study of human\
    \ motion, using the eye and the brain of observers augmented by instrumentation\
    \ to measure body movements, body mechanics, and muscle activity. Gait analysis\
    \ is used to assess and treat people with medical conditions that affect their\
    \ ability to walk.\n\nGait analysis envelopes the measurements (presentation and\
    \ investigation of quantifiable boundaries of walks) and interpretation from the\
    \ person’s gait patterns.\n\n## Gait Measurement Techniques\n\nGait analysis involves\
    \ measurement, where measurable parameters are introduced, analyzed, and interpreted\
    \ to conclude the subject’s walking styles (patterns). Table [5-1](#503949_1_En_5_Chapter.xhtml#Tab1)\
    \ describes pressure measurements, and Table [5-2](#503949_1_En_5_Chapter.xhtml#Tab2)\
    \ identifies motion measurements.\n\n**Table 5-2** Motion Measurements\n\n| Device\
    \ Type | Measurement Type |\n| --- | --- |\n| Goniometers | Range of motion |\n\
    | Electro goniometers | Joint angle at successive instants |\n| Observational\
    \ gait analysis: Conductive walkway using video cameras | Stride length, cadence,\
    \ velocity, and dynamic base |\n| High-speed video | Stop-motion measurements\
    \ |\n| Accelerometers | Accelerations |\n| Gyroscopes | Change in orientation\
    \ |\n| 3D marker systems | All possible kinematic measures using • Passive (reflectors)\
    \ and active (lights) • Markers on landmarks (joint angles by “connecting the\
    \ dots”) |\n| Electromagnetic field | All possible kinematic measures, noisy and\
    \ qualitative, indicator of when the muscle is active |\n| Surface Electromyography\
    \ (sEMG) (most common) | Cheap, easy, difficult to interpret because of crosstalk\
    \ and noise |\n| Fine-wire and needle EMG | Penetrate skin, isolate single muscle\
    \ |\n\n**Table 5-1** Using Force/Pressure Measurements\n\n![../images/503949_1_En_5_Chapter/503949_1_En_5_Figa_HTML.jpg](images/503949_1_En_5_Chapter/503949_1_En_5_Figa_HTML.jpg)\n\
    \n> **Note**  \n> With regard to the observational gait analysis, the conductive\
    \ walkway using video camera technique is considered in this book to analyze the\
    \ individual’s gait patterns using a low-cost resource-constrained computing device\
    \ such as Raspberry Pi or mobile device. For understanding, the programs can be\
    \ run using a laptop browser.\n\n## Gait Cycle Measurement Parameters and Terminology\n\
    \nTable [5-3](#503949_1_En_5_Chapter.xhtml#Tab3) provides the basic terminology\
    \ and the normal conditions of the gait cycle measurements. To understand an individual’s\
    \ walking patterns through the artificial intelligence (`AI`) in a browser, the\
    \ following conditions will be considered for the normal gait patterns.\n\n**Table\
    \ 5-3** Basic Gait Cycle Terminology\n\n![../images/503949_1_En_5_Chapter/503949_1_En_5_Figb_HTML.png](images/503949_1_En_5_Chapter/503949_1_En_5_Figb_HTML.png)\n\
    \nThe design and development of the graphical user interface (`GUI`) through a\
    \ browser in the following section will enable us to measure the gait parameters\
    \ of an individual.\n\n## Web User Interface for Monitoring Gait Parameters\n\n\
    Figure [5-1](#503949_1_En_5_Chapter.xhtml#Fig1) shows the initial output of the\
    \ keypoints, skeleton, and the gait parameter values using the `PoseNet` model\
    \ with the help of the `ml5.js` library.\n\n![../images/503949_1_En_5_Chapter/503949_1_En_5_Fig1_HTML.jpg](images/503949_1_En_5_Chapter/503949_1_En_5_Fig1_HTML.jpg)\n\
    \n**Figure 5-1** Monitoring of gait parameters on the browser\n\nThe source code\
    \ consists of the following two files:\n\n* `index.html`: The main page to show\
    \ output, as shown in Figure [5-1](#503949_1_En_5_Chapter.xhtml#Fig1)\n* `video-script.js`:\
    \ Our JavaScript (`JS`) code running using `ml5` library functions\n\nFigure [5-2](#503949_1_En_5_Chapter.xhtml#Fig2)\
    \ shows the corresponding source code screenshot in the Visual Studio Code.\n\n\
    ![../images/503949_1_En_5_Chapter/503949_1_En_5_Fig2_HTML.jpg](images/503949_1_En_5_Chapter/503949_1_En_5_Fig2_HTML.jpg)\n\
    \n**Figure 5-2** Screenshot of gait parameter monitoring source code"
  raw: '## Summary


    This chapter covered the importance of ANN and its strategies in ML modeling for
    human pose estimation. Through theory and examples in this chapter, you learned
    the basics of ANN and how to realize it in the browser through TensorFlow.js programming.
    Such an understanding will certainly help you to implement various ML models such
    as PoseNet in the browser.


    PoseNet model as presented in the chapter is an Machine Learning model that estimates
    human pose key-points in real-time on a browser. The corresponding implementation
    details are presented in this chapter.


    This information will serve as the basis to perform complex data analysis on the
    browser (as you will learn in the following chapters).


    # 5. Gait Analysis


    Gait analysis refers to the systematic study of animal locomotion, more specifically
    the study of human motion, using the eye and the brain of observers augmented
    by instrumentation to measure body movements, body mechanics, and muscle activity.
    Gait analysis is used to assess and treat people with medical conditions that
    affect their ability to walk.


    Gait analysis envelopes the measurements (presentation and investigation of quantifiable
    boundaries of walks) and interpretation from the person’s gait patterns.


    ## Gait Measurement Techniques


    Gait analysis involves measurement, where measurable parameters are introduced,
    analyzed, and interpreted to conclude the subject’s walking styles (patterns).
    Table [5-1](#503949_1_En_5_Chapter.xhtml#Tab1) describes pressure measurements,
    and Table [5-2](#503949_1_En_5_Chapter.xhtml#Tab2) identifies motion measurements.


    Table 5-2


    Motion Measurements


    | **Device Type** | **Measurement Type** |

    | --- | --- |

    | Goniometers | Range of motion |

    | Electro goniometers | Joint angle at successive instants |

    | Observational gait analysis: Conductive walkway using video cameras | Stride
    length, cadence, velocity, and dynamic base |

    | High-speed video | Stop-motion measurements |

    | Accelerometers | Accelerations |

    | Gyroscopes | Change in orientation |

    | 3D marker systems | All possible kinematic measures using• Passive (reflectors)
    and active (lights)• Markers on landmarks (joint angles by “connecting the dots”)
    |

    | Electromagnetic field | All possible kinematic measuresNoisy and qualitativeIndicator
    of when the muscle is activeSurface Electromyography (sEMG) (most common):Cheap,
    easyDifficult to interpret because of crosstalk and noiseFine-wire and needle
    EMG:Penetrate skinIsolate single muscle |


    Table 5-1


    Using Force/Pressure Measurements


    ![../images/503949_1_En_5_Chapter/503949_1_En_5_Figa_HTML.jpg](images/503949_1_En_5_Chapter/503949_1_En_5_Figa_HTML.jpg)


    Note


    With regard to the observational gait analysis, the conductive walkway using video
    camera technique is considered in this book to analyze the individual’s gait patterns
    using a low-cost resource-constrained computing device such as Raspberry Pi or
    mobile device. For understanding, the programs can be run using a laptop browser.


    ## Gait Cycle Measurement Parameters and Terminology


    Table [5-3](#503949_1_En_5_Chapter.xhtml#Tab3) provides the basic terminology
    and the normal conditions of the gait cycle measurements. To understand an individual’s
    walking patterns through the artificial intelligence (AI) in a browser, the following
    conditions will be considered for the normal gait patterns.


    Table 5-3


    Basic Gait Cycle Terminiology


    ![../images/503949_1_En_5_Chapter/503949_1_En_5_Figb_HTML.png](images/503949_1_En_5_Chapter/503949_1_En_5_Figb_HTML.png)


    The design and development of the graphical user interface (GUI) through a browser
    in the following section will enable us to measure the gait parameters of an individual.


    ## Web User Interface for Monitoring Gait Parameters


    Figure [5-1](#503949_1_En_5_Chapter.xhtml#Fig1) shows the initial output of the
    keypoints, skeleton, and the gait parameter values using the PoseNet model with
    the help of the ml5.js library.


    ![../images/503949_1_En_5_Chapter/503949_1_En_5_Fig1_HTML.jpg](images/503949_1_En_5_Chapter/503949_1_En_5_Fig1_HTML.jpg)


    Figure 5-1


    Monitoring of gait parameters on the browser


    The source code consists of the following two files:


    *   index.html: The main page to show output, as shown in Figure [5-1](#503949_1_En_5_Chapter.xhtml#Fig1)


    *   video-script.js: Our JavaScript (JS) code running using ml5 library functions


    Figure [5-2](#503949_1_En_5_Chapter.xhtml#Fig2) shows the corresponding source
    code screenshot in the Visual Studio Code.


    ![../images/503949_1_En_5_Chapter/503949_1_En_5_Fig2_HTML.jpg](images/503949_1_En_5_Chapter/503949_1_En_5_Fig2_HTML.jpg)


    Figure 5-2


    Screenshot of gait parameter monitoring source code'
  trans: '

    ## 总结


    本章涵盖了人工神经网络（ANN）在人体姿态估计的机器学习建模中的重要性及其策略。通过本章的理论和示例，您学习了 ANN 的基础知识，以及如何通过 TensorFlow.js
    编程在浏览器中实现它。这种理解无疑将帮助您在浏览器中实现诸如 PoseNet 之类的各种机器学习模型。


    本章介绍的 PoseNet 模型是一种机器学习模型，可在浏览器中实时估计人体姿态关键点。本章还介绍了相应的实现细节。


    这些信息将作为在浏览器中执行复杂数据分析的基础（您将在后续章节中学习）。


    # 5. 步态分析


    步态分析是指利用观察者的眼睛和大脑，辅以测量身体运动、身体力学和肌肉活动的仪器，对动物运动（更具体地说是人类运动）进行系统研究。步态分析用于评估和治疗影响行走能力的医疗状况患者。


    步态分析涵盖了测量（步态可量化边界的呈现与探究）以及基于个人步态模式的解读。


    ## 步态测量技术


    步态分析涉及测量，其中引入、分析并解释可测量的参数，以得出受试者的步行风格（模式）。表 5-1 描述了压力测量，表 5-2 列出了运动测量。


    **表 5-2**


    **运动测量**


    | **设备类型** | **测量类型** |

    | --- | --- |

    | 测角仪 | 关节活动范围 |

    | 电子测角仪 | 连续时刻的关节角度 |

    | 观察性步态分析：使用摄像机的导电走道 | 步幅、步频、速度和动态基底 |

    | 高速视频 | 定格运动测量 |

    | 加速度计 | 加速度 |

    | 陀螺仪 | 方向变化 |

    | 3D 标记系统 | 所有可能的运动学测量，使用• 被动（反射器）和主动（灯光）• 标记点位于身体标志点（通过“连接点”得到关节角度） |

    | 电磁场 | 所有可能的运动学测量，有噪声且为定性，指示肌肉何时活动的指标，表面肌电图（sEMG）（最常见）：便宜、简单，因串扰和噪声难以解释，细线和针式肌电图：穿透皮肤，隔离单块肌肉
    |


