    \n![../images/503949_1_En_3_Chapter/503949_1_En_3_Fig10_HTML.jpg](images/503949_1_En_3_Chapter/503949_1_En_3_Fig10_HTML.jpg)\n\
    \n**Figure 3-10** Screenshot (output). Changing the size and shape of the recognized\
    \ poses\n\n```javascript\nlet video;\nlet posenet;\nlet pose;\nfunction setup()\
