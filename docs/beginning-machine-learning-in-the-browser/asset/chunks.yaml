    \n**Step 11.** Find the distance between the recognized poses by modifying the\
    \ `1.js` script file `draw()` function (Listing [3-11](#503949_1_En_3_Chapter.xhtml#PC12)).\
    \ Figure [3-11](#503949_1_En_3_Chapter.xhtml#Fig11) shows the corresponding output.\n\
