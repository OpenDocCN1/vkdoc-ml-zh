- fmt: "### W3C WebML CG (Community Group)\n\nThe W3C calls for making and incorporating\
    \ APIs optimized for ML into the web development arena that will eventually allow\
    \ developers to create interoperable ML content on various platforms. Intel and\
    \ Microsoft began this work, and I am pleased that some APIs have been developed,\
    \ but now we need to utilize the features effectively to make ML on the web a\
    \ reality and thus achieve the following:\n\n- **Improved execution**: Results\
    \ from the prepared model return quickly, with no system slowdown.\n- **Disconnected\
    \ (offline) usefulness**: Queries running on devices/gadgets do not rely on an\
    \ association with a cloud computing administration (and so avoid the issues of\
    \ latency, throughput, and connectedness inherent in cloud computing).\n- **Upgraded\
    \ protection (privacy)**: Incredibly, many cloud administrations offer already\
    \ prepared models to run our solicitations. We need not send our privacy information\
    \ to others.\n\nAlthough incorporating browser intelligence promises exciting\
    \ functionality, it is important to remember that certain restrictions (limitations)\
    \ also apply, including the following:\n\n- **Record size**: Previously prepared\
    \ models will, in general, be extremely large (e.g., often several megabytes).\
    \ Such large record sizes on the client side will result in I/O delays and be\
    \ subject to RAM constraints.\n- **Restricted performance**: Earlier browser programs\
    \ are limited to single-thread JavaScript execution instances, with no provisions\
    \ to utilize the core computing features of the device/gadget.\n\nPresently, you\
    \ can use JS libraries to converse with existing AI/ML models, or you can develop\
    \ your intelligent program to run on a browser or electronic device/gadget. With\
    \ a scientific learning model that leverages JS library software, with some forethought,\
    \ and with a couple lines of code, you can now develop applications that induce\
    \ intelligence in the browser.\n\n## Manipulating HTML Elements Using JS Libraries\n\
    \nThe following subsections show how to use the two most popular JS libraries\
    \ (`p5.js` and `ml5.js`) to implement various functions such as graphics and ML\
    \ on the browser.\n\nThe `ml5.js` library makes ML approachable for a broad audience,\
    \ including artists, creative coders, and students. The library provides access\
    \ to ML algorithms and models in the browser. The `p5.js` library is for handling\
    \ graphical processing unit (GPU)-accelerated mathematical operations and memory\
    \ management for ML algorithms.\n\n## [p5.js](https://p5js.org/)\n\nThe `p5.js`\
    \ library is a JavaScript library for creative coding intended to make comprehensive\
    \ coding available for designers, developers, teachers, students, and more. It\
    \ is free and open-source programming; the tools to learn `p5.js` are available\
    \ to everybody. The `p5.js` library incorporates [Processing](https://processing.org/)\
    \ principles for the modern web. A `p5.js` library can be any JS code that extends\
    \ or adds to existing JS code.\n\nA `p5.js` library is classified as either a\
    \ [core library or a contributed library](https://p5js.org/libraries/). As with\
    \ programmer JS code, `p5.js` has a full toolbox of drawing utilities that support\
    \ HTML5 objects for text, input, video, webcam, and sound. To include a `p5.js`\
    \ library in the program, link it to your HTML file. The following code snippet\
    \ shows what an HTML file linked with a `p5.js` library looks like:\n\n> **Note**:\
    \ You can download the `p5.js` (single file, full uncompressed version) or `p5.min.js`\
    \ (single file, compressed version) library from this [link](https://p5js.org/download/).\
    \ You want to ensure that the `p5.js`/`p5.min.js` library and the HTML file are\
    \ in the same folder (computer system path).\n\nTo develop and execute programs\
    \ with `p5.js` library functionality, you need an editor (Notepad++) and a web\
    \ browser (Chrome or Firefox).\n\n### Drawing Graphical Objects\n\nListings [2-1a](#503949_1_En_2_Chapter.xhtml#PC2)\
    \ and [2-1b](#503949_1_En_2_Chapter.xhtml#PC3) show the inclusion of the `p5.js`\
    \ library with the user code `p5ex1_index.html`. Figure [2-1](#503949_1_En_2_Chapter.xhtml#Fig1)\
    \ shows the corresponding output.\n\n![../images/503949_1_En_2_Chapter/503949_1_En_2_Fig1_HTML.jpg](images/503949_1_En_2_Chapter/503949_1_En_2_Fig1_HTML.jpg)\n\
    \n**Figure 2-1** Inclusion of `p5.min.js` library with the user JS code\n\n```\n\
    function setup() {\ncreateCanvas(720, 400);\nbackground(200);\n}\nfunction draw()\
    \ {\nrect(40, 120, 120, 40); // A rectangle\nellipse(240, 240, 80, 80);  // An\
    \ ellipse\ntriangle(300, 100, 320, 100, 310, 80); //A triangle\n}\nListing 2-1b\n\
    p5ex1_user_code1.js\n```\n\n```\nExample#1 p5.js \n\n Example #1: p5.js and user_code1.js\
    \ \nProgram for linking p5.js library and user_code.js \n\nListing 2-1a\np5ex1_index.html\n\
    ```\n\n### Manipulating DOM Objects\n\nListings [2-2a](#503949_1_En_2_Chapter.xhtml#PC4)\
    \ and [2-2b](#503949_1_En_2_Chapter.xhtml#PC5) show how to create DOM objects\
    \ using JS libraries (in this case, `p5.js`): `p5ex2_index.html`. Figure [2-2](#503949_1_En_2_Chapter.xhtml#Fig2)\
    \ shows the corresponding output.\n\n![../images/503949_1_En_2_Chapter/503949_1_En_2_Fig2_HTML.jpg](images/503949_1_En_2_Chapter/503949_1_En_2_Fig2_HTML.jpg)\n\
    \n**Figure 2-2** Creating DOM objects using JS libraries (in this case, `p5.js`)\n\
    \n```\nvar mycanvas,myh1;\nfunction setup() {\nmycanvas = createCanvas(150, 150);\n\
    mycanvas.position(200, 250);\nmyh1 = createElement('h1', 'h1-New DOM Object .');\n\
    myh1.position(100, 150);\ncreateP(\"****This is a new Paragraph*****\");\n}\n\
    function draw() {\nbackground(150, 150);\nfill(255, 0, 0);\n}\nListing 2-2b\n\
    p5ex2_user_code2.js\n```\n\n```\nExample#2 p5.js \n\n Example #2: p5.js and user_code2.js\
    \ \nProgram for manipulating DOM objects using p5.js library \n\nListing 2-2a\n\
    p5ex2_index.html\n```\n\n### DOM onEvent(mousePressed) Handling\n\nListings [2-3a](#503949_1_En_2_Chapter.xhtml#PC6)\
    \ and [2-3b](#503949_1_En_2_Chapter.xhtml#PC7) provide the programs for calling\
    \ DOM objects based on events using the `p5.js` library. Figure [2-3](#503949_1_En_2_Chapter.xhtml#Fig3)\
    \ shows the corresponding output.\n\n![../images/503949_1_En_2_Chapter/503949_1_En_2_Fig3_HTML.jpg](images/503949_1_En_2_Chapter/503949_1_En_2_Fig3_HTML.jpg)\n\
    \n**Figure 2-3** Using the `p5.js` library to call DOM objects based on events\n\
    \n```\nvar bgcolor,button;\nfunction setup() {\ncanvas = createCanvas(200, 200);\n\
    bgcolor = color(200);\nbutton = createButton('Click this Button to change the\
    \ color');\nbutton.position(250,150);\nbutton.mousePressed(changeColor);\n}\n\
    function changeColor() {\nbgcolor = color(random(255));\n}\nfunction draw() {\n\
    background(bgcolor);\n}\nListing 2-3b\np5ex3_user_code3.js\n```\n\n```\nExample#3\
    \ p5.js \n\nExample #3: p5.js and user_code3.js \nProgram for calling DOM objects\
    \ based on events using p5.js   library \n\nListing 2-3a\np5ex3_index.html\n```\n\
    \n### Multiple DOM Objects onEvent Handling\n\nListings [2-4a](#503949_1_En_2_Chapter.xhtml#PC8)\
    \ and [2-4b](#503949_1_En_2_Chapter.xhtml#PC9) show interaction of various HTML\
    \ elements using the `p5.js` library. Figure [2-4](#503949_1_En_2_Chapter.xhtml#Fig4)\
    \ shows the corresponding output.\n\n![../images/503949_1_En_2_Chapter/503949_1_En_2_Fig4_HTML.jpg](images/503949_1_En_2_Chapter/503949_1_En_2_Fig4_HTML.jpg)\n\
    \n**Figure 2-4** Using the `p5.js` library to create interactivity between various\
    \ HTML elements\n\n```\nvar mybgcolor,mybutton,myslider1,myinput1,myname;\nfunction\
    \ setup() {\nmycanvas = createCanvas(200, 200);\nmybgcolor = color(200);\nmyname\
    \ = createP('Your name!');\nmybutton = createButton('Click to resize the circle');\n\
    mybutton.mousePressed(changeColor);\nmyslider1 = createSlider(10, 100, 86);\n\
    myinput1 = createInput('Enter your name::');\n}\nfunction changeColor() {\nmybgcolor\
    \ = color(random(255));\n}\nfunction draw() {\nbackground(mybgcolor);\nfill(255,\
    \ 0, 175);\nellipse(100, 100, myslider1.value(), myslider1.value());\nmyname.html(myinput1.value());\n\
    text(myinput1.value(), 10, 20);\n}\nListing 2-4b\np5ex4_user_code4.js\n```\n\n\
    ```\nExample#4 p5.js \n\n Example #4: p5.js and user_code4.js \n Program for interacting\
    \ various HTML elements using p5.js library\n\nListing 2-4a\np5ex4_index.html\n\
    ```"
