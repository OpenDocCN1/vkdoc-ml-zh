    带有关键点的手部姿态估计


    我们打算通过更稳定、更鲁棒的跟踪来扩展这项技术，并增加手部信号的数量。借助手部姿态估计，可以探索新颖的应用，我们渴望看到使用该方法能产生的最佳成果。


