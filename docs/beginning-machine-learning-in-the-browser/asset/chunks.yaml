    \ {\n      let x = pose.keypoints[i].position.x;\n      let y = pose.keypoints[i].position.y;\n\
    \      fill(0, 250, 0);\n      ellipse(x, y, 20, 20);\n    }\n    for (let i =\
    \ 0; i < line_connecting_points.length; i++) {\n      let m = line_connecting_points[i][0];\n\
    \      let n = line_connecting_points[i][1];\n      strokeWeight(2);\n      stroke(250);\n\
    \      line(m.position.x, m.position.y, n.position.x, n.position.y);\n    }\n\
    \  }\n}\n```\n\n**Listing 3-11** Finding the Distance Between the Recognized Poses\n\
    \nNow that you understand how to identify the keypoints using the PoseNet model,\
    \ the focus turns to how to collect and store the data for recognizing the patterns\
    \ of data through various programming structures for realizing multiple applications.\n\
    \n## Input, Output, and Data Structure of the PoseNet Model\n\nThis section covers\
    \ the various functions available in the program when the input is video data.\
    \ This will help you to understand various functions (methods) that are available\
    \ to render (load) the video on the browser and to identify the various poses\
    \ whenever any movement (change) occurs.\n\nPoseNet enables you to gauge either\
    \ a solitary posture (i.e., a single pose of an individual) or various stances\
    \ of multiple persons in a picture or video, which means that a rendition of the\
    \ calculation can distinguish just a single individual in a picture/video and\
    \ that one form can identify numerous people in a picture/video.\n\n### Input\n\
    \nAn input, in this case, is an HTML video or an image element (picture) or a\
    \ p5 image/video element of the page. If specific input is not provided, PoseNet\
    \ defaults to the browser’s webcam as the input. The following code snippet shows\
    \ how to read the input (poses) of an individual:\n\n```javascript\nconst video\
    \ = document.getElementById(\"video\");\n// Create a new myposeNet method\nconst\
    \ myposeNet = ml5.poseNet(video, modelLoaded);\n// When the model is loaded in\
    \ the browser\nfunction modelLoaded() {\n  console.log(\"Model Loaded!\");\n}\n\
    ```\n\nThe various parameters for the PoseNet method are as follows:\n\n- `ml5.poseNet(video[Optional],\
    \ type[Optional], callback[Optional])`\n- `ml5.poseNet(video[Optional], options[Optional],\
    \ callback[Optional])`\n- `ml5.poseNet(callback[Optional], options[Optional])`\n\
    \nTable [3-1](#503949_1_En_3_Chapter.xhtml#Tab1) describes the arguments (parameters)\
    \ for the `ml5.poseNet` method.\n\n**Table 3-1** ml5.poseNet Arguments\n\n![../images/503949_1_En_3_Chapter/503949_1_En_3_Figa_HTML.png](images/503949_1_En_3_Chapter/503949_1_En_3_Figa_HTML.png)\n\
    \n### Output\n\nWhen the pose of an individual is loaded on the browser (i.e.,\
    \ the browser webcam reads the video stream data), the corresponding poses (keypoints)\
    \ are given as the results (output) by the function `poseNet()`. The results (outputs)\
    \ are then passed to the temporary program variable `myposes`, as shown here:\n\
    \n```javascript\n// Listen to new 'pose' events when there are changes\n// in\
    \ the orientation of the poses.\nmyposeNet.on(\"pose\", function(results) {\n\
