    ## Getting Started with Machine Learning in the Browser Using ml5.js and p5.js


    The `ml5.js` library makes AI accessible to creative coders. The library was created
    at New York University, and it was openly released in July 2018. The library gives
    access to AI methods and models in the program, expanding on `TensorFlow.js` and
    with no other outside dependencies. The [ml5.js](https://ml5js.org/) library makes
    life simpler for those who are new to the ML field. You can find more information
    at this [link](https://ml5js.org/).


    To develop and execute programs that incorporate `p5.js` and `ml5.js` libraries,
    you need the following:


    - Editor: Visual Studio Code or Notepad++

    - Web browser: Chrome or Firefox

    - Sample images and datasets for developing ML applications


    ## Design, Develop, and Execute Programs Locally


    There are two methods for running a local web server on your computer to develop
    and execute your programs on the local computer.


    ### Method 1: Using Python – HTTP Server


    1. Install Python 3+ on your computer.

    2. `cd /path_to/ml5_p5-examples` (At the command prompt, go to the folder that
    holds your `ml5/p5` programs.)

    3. `python -m http.server 8081`

    4. In the browser URL, type the following: `localhost:8081/indexfilename`


    Listings [2-12a](#503949_1_En_2_Chapter.xhtml#PC24) and [2-12b](#503949_1_En_2_Chapter.xhtml#PC25)
    show the `ml5.js` library using a Python web server for image classification.
    Figure [2-12](#503949_1_En_2_Chapter.xhtml#Fig12) shows the corresponding output.


