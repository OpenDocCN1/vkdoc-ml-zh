- fmt: "# Web Development Using IDEs/Editors\n\nThe difference between an integrated\
    \ development environment (IDE) and an editor (text) for web development is that\
    \ an IDE does everything from fundamental content management to advanced development\
    \ that cannot be done with a text editor.\n\nFor example, editors such as [**Sublime**](https://www.sublimetext.com/),\
    \ [**Notepad++**](https://notepad-plus-plus.org/downloads/), and [**Atom**](https://atom.io/)\
    \ can be used with HTML and Cascading Style Sheets (CSS) when writing the code\
    \ for web page design. These editors include many good features (e.g., language\
    \ structures that include adaptable interfaces and comprehensive navigation tools\
    \ for web developers who want enhanced application capabilities). For instance,\
    \ a web developer may require a debugger and a compiler to develop web applications\
    \ effectively. Figure [1-3](#503949_1_En_1_Chapter.xhtml#Fig3) shows the programming\
    \ environments of these three editors.\n\n![../images/503949_1_En_1_Chapter/503949_1_En_1_Fig3_HTML.jpg](images/503949_1_En_1_Chapter/503949_1_En_1_Fig3_HTML.jpg)\n\
    \nFigure 1-3 Notepad++, Sublime, and Atom editor environments\n\nWith the best\
    \ IDEs, however, you have less to worry about. They often include comprehensive\
    \ development tools in one application, including for automation, testing, and\
    \ forecasting. Mainly, they provide web developers the necessary support to transform\
    \ code into a working application. Here are some of the more popular IDEs:\n\n\
    * [**Visual Studio Code**](https://code.visualstudio.com/): Visual Studio Code\
    \ is perhaps the best JavaScript IDE for Windows, Mac, and Linux platforms. In\
    \ addition to supporting JS functionality, it also supports Node.js and TypeScript\
    \ features, and it includes a system of extensions for different programming dialects,\
    \ including C++, C#, Python, and PHP. Visual Studio Code makes for programmer-friendly\
    \ operations with excellent syntax features and autocomplete with IntelliSense\
    \ that responds to myriad factors, word definitions, and imported modules.\n\n\
    * [**NetBeans**](https://netbeans.org/): NetBeans is one of the best web development\
    \ IDEs because it enables you to create a neat and versatile work area and develop\
    \ web applications quickly. It also works well with JS, HTML5, PHP, and C/C++.\
    \ It is a free JS IDE and a great HTML5 IDE for everyday use. This IDE allows\
    \ you to review code for errors and lets you automatically fix syntax if necessary\
    \ (including for Java 8 features such as lambda expressions).\n\n* **PyCharm**:\
    \ PyCharm is not the best free JS IDE. However, the paid Professional Edition\
    \ is worth considering if you are looking for a solid web development IDE for\
    \ Python.\n\n* **IntelliJ IDEA**: IntelliJ IDEA is an excellent web development\
    \ IDE. A free version is available, but if you want all the JS features it offers,\
    \ consider the paid Ultimate Edition. IntelliJ IDEA can save you time and energy\
    \ in web development, and it is an excellent CSS IDE. Note, as well, that it supports\
    \ a wide range of programming dialects.\n\n## Building Blocks of Web Development\n\
    \nThe three building blocks of web development are as follows:\n\n* **HTML**:\
    \ Via HTML5, computers can now understand what is on your website rather than\
    \ just display website content dynamically. Earlier HTML versions provide static\
    \ or dynamic information to the users. Website content is shown via HTML code.\n\
    \n* **CSS**: CSS determines what the website/pages look like. HTML is for making\
    \ the content, whereas CSS is for showing the content in the way you want (i.e.,\
    \ the design; the different styles, colors, backgrounds, and layout). CSS makes\
    \ a website/page look interesting.\n\n* **JavaScript**: JS is a programming language\
    \ used to manipulate HTML and CSS. Its main function is to provide interactive\
    \ features for the user. It is sturdy and can be used to create full web applications\
    \ (apps).\n\n> **Note**: To develop and test the applications/code in this book,\
    \ consider using Google’s Chrome browser, which has versions for Mac, Windows,\
    \ and Linux.\n\n## HTML and CSS Programming\n\nA coherent web development process\
    \ requires that you first define *what* you want to say (HTML) and then define\
    \ *how* you want to say it (CSS). An HTML component (element) is the combination\
    \ of a start tag, its characteristics (attributes), an end tag, and everything\
    \ in between. An HTML tag—either opening (`< >`) or closing (`</ >`)—is used to\
    \ identify the beginning or end of a component (element). The following code shows\
    \ the structure of an HTML document and some of its basic elements:\n\nThe first\
    \ line, `<!DOCTYPE html>`, informs the browser that it is an HTML5 version web\
    \ page. The entire web page content is to be wrapped in `<html>` tags. The actual\
    \ `<html>` text is called an *opening tag*, and `</html>` is called a *closing\
    \ tag*. Everything inside of these tags is considered part of the `<html>` *element*,\
    \ which is the actual thing that gets created when a web browser parses your HTML\
    \ tags. Inside the `<html>` element are two more elements: `<head>` and `<body>`.\
    \ A web page `<head>` contains all of its metadata, such as the page title, any\
    \ CSS style sheets, and other things required to render the page but that you\
    \ do not necessarily want the user to see. The bulk of our HTML markup will live\
    \ in the `<body>` element, which represents the visible content of the page.\n\
    \nComments are given between the tags `<!--` and `-->`. Listing [1-1](#503949_1_En_1_Chapter.xhtml#PC2)\
    \ shows a more complete HTML example, and Figure [1-4](#503949_1_En_1_Chapter.xhtml#Fig4)\
    \ shows the corresponding output.\n\n![../images/503949_1_En_1_Chapter/503949_1_En_1_Fig4_HTML.jpg](images/503949_1_En_1_Chapter/503949_1_En_1_Fig4_HTML.jpg)\n\
    \nFigure 1-4 Screenshot of the basic HTML code and its output\n\n```\nBasic HTML\
    \ Web Page\n\n Web Development is Easy! \n First, we need to learn some basic\
    \ HTML \n Headings \n Headings structure the outline of the website.\nThere are\
    \ six levels of headings \n Lists \n There are two types of Lists \n Unordered\
    \ List \n\nAdd a \"ul\" element (it stands for unordered list)\nAdd each item\
    \ in its own \"li\" element\nThey don't need to be in any particular order\n\n\
    \ Ordered List \n\nNotice the new \"ol\" element wrapping everything\nBut, the\
    \ list item elements are the same\nAlso note how the numbers increment on their\
    \ own\nYou should be noticing things is this precise order, because this is an\
    \ ordered list\n\nInline Elements\nSometimes, you need to draw attention to a\
    \ particular word or\nphrase.\nThis is some emphasized text\nOther times you need\
    \ to strongly emphasize the importance of a word or phrase.\nEmpty Elements and\
    \ Line break using br tag\nWeb Programming is easier.\nRegards,\nThe Authors\n\
    \ Horizontal Line \n\nP.S. This is a basic HTML Web page to understand how a web\
    \ page looks like. \n```\n\nListing 1-1 Basic HTML Content of a Web Page\n\n###\
    \ Dynamic HTML\n\nDynamic HTML (DHTML) enables developers to control the display\
    \ and position of HTML elements in a browser window. HTML is used to create static\
    \ web pages, and DHTML is used to create dynamic web pages. HTML consists of simple\
    \ HTML tags, whereas DHTML consists of HTML tags plus CSS plus JS.\n\n### Cascading\
    \ Style Sheets\n\nCSS helps us to specify how elements on the web page should\
    \ be presented. With CSS, we can determine the style and layout of the web page.\
    \ There are three ways to use style sheets:\n\n* Inline style sheets (Listing\
    \ [1-2](#503949_1_En_1_Chapter.xhtml#PC3))\n* Embedded style sheets (Listing [1-3](#503949_1_En_1_Chapter.xhtml#PC4))\n\
    * External style sheets (Listing [1-4](#503949_1_En_1_Chapter.xhtml#PC5))"
