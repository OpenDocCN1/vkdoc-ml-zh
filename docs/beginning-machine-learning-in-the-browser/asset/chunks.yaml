- fmt: '### Changing Flat File Data into TensorFlow.js Format


    Consider the iris dataset, which consists of data items with 15 samples (rows)
    related to various types of flowers. The iris dataset is of the JSON format, as
    shown in Figure [4-5](#503949_1_En_4_Chapter.xhtml#Fig5). To convert the data
    (i.e., a flat `file(Array`) into TensorFlow.js format), the `tf.tensor2D()` function
    helps in creating data that TensorFlow.js can understand. The function `loadJSON()`
    in the `setup()` function will read the `iris.json` data into the model of the
    browser application. The browser graphical user interface (GUI) can be customized
    to interact with the user to the inputs such as the epochs and other parameter
    values.


    ![../images/503949_1_En_4_Chapter/503949_1_En_4_Fig5_HTML.jpg](images/503949_1_En_4_Chapter/503949_1_En_4_Fig5_HTML.jpg)


    **Figure 4-5** Iris dataset in the JSON format


    Basically, the JSON file contains the attribute-value pair for various instances
    of the iris flowers. Listing [4-2a](#503949_1_En_4_Chapter.xhtml#PC4) is the main
    file that invokes the corresponding script file consisting of operational functionalities
    given in Listing [4-2b](#503949_1_En_4_Chapter.xhtml#PC5).


    The function `setup()` in the script file is responsible for setting the size
    of the canvas window for user interactive operations, loading the JSON data file
    for processing, and providing the user interactive buttons to start the model.


    Loading the JSON data file contents into the user-defined temporary variables
    is done by the function `loaddata()`. The temporary data held in the user-defined
    variable is converted into the tensor data structures by the function `convertToTensor()`.


    After the neural network learning process is completed (i.e. after the execution
    of `trainModel()` and `nn_model()` functions) the model data is stored in the
    tensors data structure. The model gets learned with the corresponding data present
    in the tensors that is executed by the neural network configuration with the help
    of `trainModel()` and `nn_model()` functions.


    **Note** You can download the `iris.json` dataset from [`https://www.kaggle.com/rtatman/iris-dataset-json-versio`](https://www.kaggle.com/rtatman/iris-dataset-json-versio).


    ```

    let input, button

    let IRIS_NUM_CLASSES =3

    let nn_model;

    let train_x;

    let train_y;

    let epoch_val;

    function setup()

    {

    createCanvas(710, 400);

    // Loading Data

    loadJSON(''iris.json'',loadData)

    // GUI Form Elements

    fill(0);

    textSize(30)

    text(''Train Model'',10,50)

    textSize(18)

    text(''Train Epochs:'',10,90)

    input = createInput();

    input.position(140, 80);

    button = createButton(''Train Model From Scratch'');

    button.position(20,110, 200);

    let col = color(255,127,80)

    button.style(''background-color'', col);

    button.size(200,40)

    button.mousePressed(greet);

    }

    //The functions loaddata() and converttoTensor()to //convert the data into tensorflow
    objects(tensor2D() //objects):

    function loadData(data)

    {

    const values = data.map(item => ({

    a: item.sepalLength,

    b: item.sepalWidth,

    c: item.petalLength,

    d: item.petalWidth,

    label: item.species

    }));

    const dataset = values.filter(item => (

    item.a != null && item.b != null && item.c != null && item.d != null && item.label
    != null

    ));

    const {inputs, labels} = convertToTensor(dataset);

    train_x = inputs

    train_y = labels

    console.log(train_x.shape[0])

    }

    function convertToTensor(dataset)

    {

    return tf.tidy(() => {

    tf.util.shuffle(dataset);

    const inputs = dataset.map(item => [item.a, item.b, item.c, item.d])

    const labels=[];

    for(i=0;i0)

    {

    nn_model = createModel()

    tfvis.show.modelSummary({name: ''Model Summary''}, nn_model);

    if(train_x.shape[0] >0 && train_y.shape[0] >0 )

    trainModel(nn_model)

    }

    }

    // Function createModel() tf.sequential(),adding //input layers through tf.layers.dense
    and //trainModel() with the model.fit() methods

    function createModel()

    {

    const model = tf.sequential();

    model.add(tf.layers.dense({inputShape: [4], units: 50, useBias: true, activation:''relu''}));

    model.add(tf.layers.dense({units: 20, activation: ''relu''}));

    //model.add(tf.layers.dense({units: 10, activation: ''relu''}));

    model.add(tf.layers.dense({units: 3, activation: ''softmax''}));

    return model;

    }

    async function trainModel(model)

    {

    model.compile({

    optimizer: tf.train.adam(),

    loss: tf.losses.softmaxCrossEntropy,

    metrics: [''accuracy''],

    });

    const batchSize = 32;

    const epochs = epoch_val;

    const validationSplit =0.3;

    return await model.fit(train_x, train_y, {

    batchSize,

    epochs,

    validationSplit,

    shuffle: true,

    callbacks: tfvis.show.fitCallbacks(

    { name: ''Training Performance'' },

    [''loss'', ''val_loss'',''acc'',''val_acc''],

    { height: 200, callbacks: [''onEpochEnd''] })

    });

    }

    ```


