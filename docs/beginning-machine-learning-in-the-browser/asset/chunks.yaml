    Now that you understand how to identify the keypoints using the PoseNet model,
    the focus turns to how to collect and store the data for recognizing the patterns
    of data through various programming structures for realizing multiple applications.


    ## Input, Output, and Data Structure of the PoseNet Model


    This section covers the various functions available in the program when the input
    is video data. This will help you to understand various functions (methods) that
    are available to render (load) the video on the browser and to identify the various
    poses whenever any movement (change) occurs.


    PoseNet enables you to gauge either a solitary posture (i.e., a single pose of
    an individual) or various stances of multiple persons in a picture or video, which
    means that a rendition of the calculation can distinguish just a single individual
    in a picture/video and that one form can identify numerous people in a picture/video.


    ### Input


    An input, in this case, is an HTML video or an image element (picture) or a p5
    image/video element of the page. If specific input is not provided, PoseNet defaults
    to the browser’s webcam as the input. The following code snippet shows how to
    read the input (poses) of an individual:


    ```

    const video = document.getElementById("video");

    // Create a new myposeNet method

    const myposeNet = ml5.poseNet(video, modelLoaded);

    // When the model is loaded in the browser

    function modelLoaded() {

    console.log("Model Loaded!");

    }

    ```


    The various parameters for the PoseNet method are as follows:


    *   `ml5.poseNet(video[Optional], type[Optional], callback[Optional])`


    *   `ml5.poseNet(video[Optional], options[Optional], callback[Optional])`


    *   `ml5.poseNet(callback[Optional], options[Optional])`


    Table [3-1](#503949_1_En_3_Chapter.xhtml#Tab1) describes the arguments (parameters)
    for the `ml5.poseNet` method.


    Table 3-1


    ml5.poseNet Arguments


    ![../images/503949_1_En_3_Chapter/503949_1_En_3_Figa_HTML.png](images/503949_1_En_3_Chapter/503949_1_En_3_Figa_HTML.png)


    ### Output


    When the pose of an individual is loaded on the browser (i.e., the browser webcam
    reads the video stream data), the corresponding poses (keypoints) are given as
    the results (output) by the function `poseNet()`. The results (outputs) are then
    passed to the temporary program variable `myposes`, as shown here:


    ```

    // Listen to new ''pose'' events when there are changes // in the orientation
    of the poses.

    myposeNet.on("pose", function(results) {

    myposes = results;

    });

    ```


    ### .on() Function


    The `.on (''pose'', function(results))` method triggers an event whenever a new
    pose is detected. The method continuously listens for a change in the poses over
    the video frames. The function (results) returns the results in an array of objects
    consisting of pose recognitions.


    ### Summary


    This chapter showed you step by step how to depict the real-time human pose estimation
    in the browser using Dan Oved’s PoseNet model.


    You learned about PoseNet model intricacies such as what a pose contains: pose
    confidence score, an array of 17 keypoints, and each keypoint in turn consisting
    of keypoint position and keypoint confidence score along with the input image
    space.


    This chapter also covered the programming constructs required to process the collected
    keypoints’ data. In the following chapters, you will learn about programming skills
    required to develop multiple applications such as human pose classifications and
    gait analysis.'
