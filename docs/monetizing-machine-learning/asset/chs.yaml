  ## 一个简单的本地 Flask 应用程序


  本节中的代码非常简单，你可以从头开始编写，也可以使用“**simple-local-flask-application**”文件夹中的文件。


  ### 步骤 1：基本的“Hello World!”示例


  让我们直接从 Flask 官方帮助文档中创建一个非常简单的 Flask 脚本（列表 1-1）。


  ```

  from flask import Flask

  app = Flask(__name__)

  @app.route("/")

  def hello():

