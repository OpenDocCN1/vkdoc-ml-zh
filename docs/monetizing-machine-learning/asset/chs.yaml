  ## 在新手写数字上进行测试


  这是我们流程（以及 Web 应用程序）的关键部分。我们需要能够将新的手写数字传递给模型进行预测。


  **处理真实图像**


  使用 MNIST 数据集进行测试与使用真实图像进行测试的区别在于，MNIST 数据已经为我们处理好了。因此，我们需要对新的图像应用相同的处理，使其与我们训练好的模型兼容。想象一下，你创建了一个包含数字的图像文件；这就是你将其传递给模型的方式。我们利用
  PIL 和 NumPy Python 库来执行大部分图像处理（清单 8-20）。


  ```

  from PIL import Image

  img = Image.open(''my-own-4.png'')

  清单 8-20

  导入图像

  ```


  我们将其调整为官方要求的 28x28 像素尺寸。由于我们将处理透明图像（只显示数字，不显示背景），我们需要添加一个白色背景以符合训练好的 MNIST 数据（清单
  8-21）。


  ```

  img = img.resize([28,28])

  # 添加白色背景

  corrected_img = Image.new("RGBA", (28, 28), "white")

  # 将两张图像合并

  corrected_img.paste(img, (0,0), img)

  清单 8-21

  处理新图像

  ```


  接下来，我们将图像转换为数组，移除此处不需要的额外颜色维度（因为我们处理的是黑白图像），最后反转整个图像，使空白像素变为零（清单 8-22）。


  ```

  # 移除颜色维度

  corrected_img = np.asarray(corrected_img)

  # 移除颜色层

  corrected_img = corrected_img[:, :, 0]

  # 反转颜色

  corrected_img = np.invert(corrected_img)

  清单 8-22

  处理新图像

  ```


  最后，我们将图像从 28x28 的矩阵展平为大小为 784 的扁平向量，并将数据居中在 0 到 1 之间，而不是 0 到 255。就是这样；现在它已准备好输入到我们的
  TensorFlow 模型中进行预测（清单 8-23 和图 8-6）。


  ![images/468330_1_En_8_Fig6_HTML.jpg](img/468330_1_En_8_Fig6_HTML.jpg)


  图 8-6


  转换后的图像数据准备建模的部分最终输出


  ```

  corrected_img = corrected_img.reshape([784])

  # 居中在 0-1 之间

  img = np.asarray(corrected_img, dtype=np.float32) / 255.

  清单 8-23

  展平数据

  ```


