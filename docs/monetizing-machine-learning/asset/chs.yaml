  ### 摘要认证示例


  为了获得经过身份验证的会话（即，允许用户在域内页面间导航而无需在每个页面都登录），你需要使用一种经过身份验证的 cookie。一旦会话的用户通过身份验证，你只需在任何
  Flask 函数前加上“**@auth.login_required**”，如果访问者已通过身份验证，会话才会继续；否则，将弹出登录框。相关代码可在脚本“**authentication-digest.py**”（清单
  15-3）中找到。


