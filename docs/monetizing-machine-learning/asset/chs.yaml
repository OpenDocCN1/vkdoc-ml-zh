  \  http://>.azurewebsites.net\n    ```\n\n1.  终止实例！\n\n    ```\n    $ az group delete\
  \ --name myResourceGroup\n    ```\n\n## 这里发生了什么？—— 我们 Web 应用中使用的脚本和技术概览\n\n让我们快速浏览一下我们\
  \ Web 应用的代码。有两个重要文件：“**main.py**”，它是 Web 服务的控制脚本；以及模板文件“**index.html**”，它是我们 Web\
  \ 应用的门面。由于大部分处理直接发生在“**index.html**”中，我们将把大部分时间花在那里，查看运行此 Web 应用的 HTML 和 JavaScript。\n\
  \n\n\n### main.py\n\n通常情况下，这是整个应用的后台核心。它可以完成独立 Python 脚本所能做的几乎所有事情，并且还能为网页生成内容。在本章中，除了将平均特征值以及模型的截距和系数传递给模板之外，这里并没有太多其他操作。在本书中，我们将同时使用“**main.py**”和“**application.py**”。为控制\
  \ Python Web 服务的文件命名没有绝对的对错之分——唯一的例外是一些保留字。如果你选择自定义名称，则需要更新 YAML 文件和/或 Web 服务器网关接口配置文件。此外，一些云服务提供商默认使用不同的应用程序名称；Google\
  \ Cloud 默认使用“**main**”，而 Azure 默认使用“**application**”。但无论哪种情况，都可以进行自定义和更改。\n\n“**main.py**”在这里做的一件有趣的事情是传输截距、系数和平均值的起始值。\n\
  \n装饰器 **“@app.route**” 会将所有访问根 URL 或文件名为“**index.html**”的流量路由到相应函数。然后，它只需将所有默认值传递给“**index.html**”模板（清单\
  \ 2-58）。\n\n```\n@app.route(\"/\", methods=['POST', 'GET'])\ndef index():\n"
