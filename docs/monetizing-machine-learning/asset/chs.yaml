  \n### 注意\n\n有关 Bootstrap 的更多信息与培训，请查看 GetBootstrap.com 上的官方文档。\n\n## 网页插件\n\n网页插件有一个巨大的优势：它们将大量的硬件、数据和/或安全管理推给其他人，最好是该领域的专业人士。没有必要重新发明轮子、浪费宝贵的时间或引入安全风险。让别人来处理这些，专注于你擅长的事情；这正是本书的核心所在！\n\
