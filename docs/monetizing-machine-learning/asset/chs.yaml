  ```


  这将使得处理这些数据以及将每个股票代码与指数进行比较的自动化工作变得容易得多。




  ## 缩放价格市场数据


  为了比较不同价格资产之间的变动，我们需要对数据进行归一化处理。本质上，我们要将所有价格重新调整到一个共同的尺度上。实现这一目标的方法有很多，在本网络应用中，我们将使用百分比变化和累积求和。


  ### 百分比变化与累积求和


  一个非常简单的方法是将我们的价格数据转换为百分比变化，然后应用滚动求和，即所谓的累积求和（列表 5-5 和图 5-6）。


  ![images/468330_1_En_5_Fig6_HTML.jpg](img/468330_1_En_5_Fig6_HTML.jpg)


  图 5-6


  价格、百分比变化及百分比变化累积求和


  ```

  pd.DataFrame({"Price":stock_data[''AAPL''], "PercentChange":stock_data[''AAPL''].pct_change().cumsum()}).head()

  列表 5-5

  对 AAPL 应用百分比变化和累积求和

  ```


  在转换过程中，日期为“**2017-11-22**”的第一个价格因没有前值可比较而丢失，变为非数值或“**NaN**”。第二个价格 174.259521 呈现正百分比变化，因为它相对于前一个价格
  174.249573 有所上涨。累积变化列按时间顺序对所有变化进行求和。“**PercentChangeCumSum**”列成为一组数据，我们可以将其与任何其他股票序列进行比较，无论它们的数值和范围如何——这对于比较分析来说是一个非常实用的转换。


  ## 绘制价差图


  现在我们有了百分比变化累积求和，就可以轻松绘制指数与其某只成分股之间的差异图。


  我们将从“**DJI**”与“**BA**”（波音）以及“**DJI**”与“**AAPL**”（苹果）之间的累积求和百分比差异开始。在所追踪的期间内（2017
  年 11 月 22 日至 2018 年 4 月 4 日之间的 90 个交易日），“**BA**”相对于“**DJI**”指数表现出强劲的正向走势。解读该图表的方法是，将绿色的“**0**”线视为稳定的指数，而蓝色的波浪线则代表该成分股的差异（图
  5-7）。


  ![images/468330_1_En_5_Fig7_HTML.jpg](img/468330_1_En_5_Fig7_HTML.jpg)


  图 5-7


  道琼斯指数与波音公司之间的累积价差，该股票相对于指数表现出强劲走势


  相反的情况发生在“**AAPL**”上；在同一时期，它相对于“**DJI**”指数表现出强烈的负向弱势（图 5-8）。


  ![images/468330_1_En_5_Fig8_HTML.jpg](img/468330_1_En_5_Fig8_HTML.jpg)


  图 5-8


  道琼斯指数与苹果公司之间的累积价差，该股票相对于指数表现出弱势


  现在，让我们设想一个虚构的交易。如果我们在 2017 年 12 月 29 日左右做空“**BA**”，并在同一时间做多“**AAPL**”会怎样？显然，这是事后挑选股票，但你在“**BA**”上会亏损，而在“**AAPL**”上会赚得更多，从而使这对交易盈利。当然，你必须确保在两边投入等值的美元金额才能实现这一点（稍后会详细说明）。


  ## 提供交易思路


  现在我们对自己追求的交易类型有了基本概念，让我们寻找一些活跃的布局来提供给读者。


  ### 寻找极端案例


  假设我们持有的金融数据是最新的。为了找到相对于“**DJI**”最强正向和最强负向的股票，我们只需创建一个数据框来容纳我们所需 90 天回溯期内所有股票的数据，对所有股票应用百分比变化和累积求和，然后寻找最后一个交易日中最大和最小的交易价格。让我们更详细地过一遍这个过程。


  让我们将此应用于我们所有的股票。由于我们只追踪过去 90 个交易日内的差异（可根据实验调整），我们将丢弃更早的数据（列表 5-6）。


  ```

  stock_data = stock_data.tail(90)

  列表 5-6

  仅使用最后 90 个交易日的数据

  ```


  让我们遍历每个股票代码，将最后一个百分比变化累积求和与 DJI 进行比较，并将结果存储在字典“**last_distance_from_index**”中以供比较（列表
  5-7）。


  ```

  stock1 = ''^DJI''

  last_distance_from_index = {}

  temp_series1 = stock_data[stock1].pct_change().cumsum()

  for stock2 in list(stock_data):

  # 无需处理自身

  if (stock2 != stock1):

  temp_series2 = stock_data[stock2].pct_change().cumsum()

  # 我们用股票减去指数，如果股票相对于指数表现强劲，结果将为正值

  diff = list(temp_series2 - temp_series1)

  last_distance_from_index[stock2] = diff[-1]

  列表 5-7

  获取股票与指数之间的距离

  ```


  让我们看看字典中捕获了什么（列表 5-8）。


  ```

  输入:

  print(last_distance_from_index)

  输出:

  {''AAPL'': -0.042309986580456815,

  ''BA'': 0.1960194615751124,

  ''CAT'': 0.03379845694757866,

  ''GS'': 0.047454711281622486,

  ''HD'': 0.014178592951754165,

  ''IBM'': -0.003376107031365594,

  ''MCD'': -0.06239853566933862,

  ''MMM'': -0.08366228603707737,

  ''TRV'': 0.04601871807501723,

  ''UNH'': 0.060732956928879145}

  列表 5-8

  分析我们的股票与指数之间的距离

  ```


  仅通过查看字典，我们发现“**BA**”的值最高，而“**MMM**”的值最低。


  ### 提出建议


  如果我们想自动化此过程或将其扩展到数千只股票，就需要以编程方式提取这些值。让我们使用方便的 lambda 函数。这是一种可以轻松嵌套到字典中并应用转换的函数风格，或者在我们的案例中，用于查找字典中的最小值和最大值（列表
  5-9 和 5-10）。


  ```

  输入:

  weakest_symbol = min(last_distance_from_index.items(), key=lambda x: x[1])

  print(''最弱股票代码: %s'' % weakest_symbol[0])

  输出:

  最弱股票代码: MMM

  列表 5-9

  应用 Lambda 函数查找字典中的最小值

  ```


  ```

  输入:

  strongest_symbol = max(last_distance_from_index.items(), key=lambda x: x[1])

  print(''最强股票代码: %s'' % strongest_symbol[0])

  输出:

  最强股票代码: BA

  列表 5-10

  应用 Lambda 函数查找字典中的最大值

  ```


  让我们将这两个极端案例可视化：“**BA**”和“**MMM**”（图 5-9 和 5-10）。


