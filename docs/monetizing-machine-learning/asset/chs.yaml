  ## Python 库：mysql.connector


  与数据库的大部分交互将通过 Python 和 Flask 使用便捷的“**mysql.connector**”库来完成。你可以参考第 14 章对应的 Jupyter
  notebook 进行学习（请安装“**requirements_jupyter.txt**”文件以获取所需的库）。请记住，在本章中我们不会创建本地 Flask
  版本，因此请先熟悉 notebook 中的命令，然后我们将直接跳转到云端。


  我们将使用“**SELECT**”、“**INSERT**”和“**UPDATE**”SQL 函数来编写三种类型的函数。如果你不熟悉这些经典的 SQL 函数，请查看
  w3schools 的优秀入门教程（我知道，我一直在推荐这个网站；它确实很好，我发誓我与它没有任何关系），网址是 [`https://www.w3schools.com/sql`](https://www.w3schools.com/sql)。


  ### SELECT SQL 语句


  “**SELECT**”是最常用的 SQL 命令，用于从表中读取数据。使用“**mysql.connector**”库可以轻松完成此操作。首先，通过调用“**connect()**”函数并传入数据库的授权凭据来创建与数据库的连接。该连接返回一个游标，用于与数据库通信并向其发送指令。这是通过一个包含“**SELECT**”语句的查询字符串完成的。我们将对所有
  SQL 语句使用这种方法。该语句与“**INSERT**”和“**UPDATE**”语句的区别在于，我们期望从数据库接收数据。通过“**execute()**”函数执行查询字符串后，我们可以通过循环访问返回的数据。每次循环代表一行数据。请注意，打开的游标和连接在调用结束时都会关闭，因为我们不想不必要地占用资源（清单
  14-14）。


  ```

  输入：

  cnx = mysql.connector.connect(user=''webuser'', password="thesecret", database="ABTesting")

  cursor = cnx.cursor()

  query = "SELECT * FROM ABTesting.tblFrontPageOptions"

  cursor.execute(query)

  for (uuid, liked, pageid, time_stamp) in cursor:

  print("uuid: {} liked:{} pageid: {} on {:%m/%d/%Y %H:%M:%S}".format(

  uuid, liked, pageid, time_stamp))

  cursor.close()

  cnx.close()

  输出（示例，你的输出将仅包含表中目前的数据）：

  uuid: 704a44d0-29f4-4a2d-bc6a-fe679017f7e9 liked:1 pageid: 2 on 05/19/2018 17:03:29

  清单 14-14

  使用游标的“select”语句

  ```


  ### INSERT SQL 语句


  “**INSERT**”语句允许我们将数据插入到数据库的 ABTesting 表中。当访问者首次访问网页时，我们会插入一行数据，包含以下字段：一个“**UUID**”、一个设置为
  false 的“**liked**”标志、代表用户正在查看两个背景图像中哪一个的“**pageid**”，以及一个“**timestamp**”。与“**SELECT**”语句一样，我们首先打开一个数据库连接，然后创建一个游标并将查询语句传递给它。在这种情况下，我们的查询语句不是“**SELECT**”，而是“**INSERT**”。我们还使用方便的“**%s**”语句作为变量占位符，随后将由“**args**”元组中保存的值填充。这里我们插入一个新的唯一
  ID，其中“**liked**”设置为 false（或“踩”），以及所查看的页面 ID。


  另外，每当插入或更新表时，不要忘记在关闭连接之前调用“**commit()**”函数来提交你的插入操作。如果不提交，你的更改将被忽略（清单 14-15）。


  ```

  cnx = mysql.connector.connect(user=''webuser'', password="thesecret", database="ABTesting")

  cursor = cnx.cursor()

  query = "INSERT INTO ABTesting.tblFrontPageOptions (uuid, liked, pageid) VALUES
  (%s, %s, %s);"

  args = ("704a44d0-29f4-4a2d-bc6a-fe679017f7e9", 0, 1)

  cursor.execute(query, args)

  cursor.close()

  cnx.commit()

  cnx.close()

  清单 14-15

  使用游标的 SQL “INSERT” 语句

  ```




  ### UPDATE SQL 语句


  “**UPDATE**”语句与“**INSERT**”语句类似，但区别在于，它不是向表末尾添加新行，而是更新现有行。为了更新特定行，你必须在更新之前能够找到正确的行。在这种情况下，由于我们拥有保证唯一性的“**UUID**”，因此可以轻松找到该特定行，而无需担心错误地更新其他行。为了正确构建“**UPDATE**”语句，我们必须向其传递两个值：“**704a44d0-29f4-4a2d-bc6a-fe679017f7e9**”的“**UUID**”以及设置为
  true 的“**liked**”标志（清单 14-16）。


  ```

  cnx = mysql.connector.connect(user=''webuser'', password="thesecret", database="ABTesting")

  cursor = cnx.cursor()

  query = "UPDATE ABTesting.tblFrontPageOptions SET liked = %s WHERE uuid = %s;"

  args = (1, "704a44d0-29f4-4a2d-bc6a-fe679017f7e9")

  cursor.execute(query, args)

  cursor.close()

  cnx.commit()

  cnx.close()

  Listing 14-16

  SQL “update” Statement with Cursor

  ```


  再次提醒，在关闭连接之前，不要忘记调用“**commit()**”函数来提交你的更改（如果不这样做，你的更改将被忽略）。


