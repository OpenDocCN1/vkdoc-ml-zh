  ### 使用外部文本文件的摘要认证示例


  这与之前的概念基本相同，但现在我们从外部文本文件读取数据，而不是 Flask 脚本内部的字典。这将允许管理员（或你）添加和删除用户名和密码，而无需影响源代码或重启
  Web 服务器，因为文件在每次认证时都会被读取。请注意，用户名/密码在文本文件中编写时不带引号或逗号，每行一个。相关代码可在脚本“**authentication-digest-external.py**”（清单
  15-5）中找到。


  ```

  from flask import Flask

  from flask_httpauth import HTTPDigestAuth

  app = Flask(__name__)

  app.config[''SECRET_KEY''] = ''secret key here''

  auth = HTTPDigestAuth()

  @auth.get_password

  def get_pw(username):

  for user in open("users-file.txt","r").readlines():

  if username in user:

  user={user.split('':'')[0]:user.split('':'')[1].rstrip()}

  return user.get(username)

  return None

  @app.route(''/'')

  @auth.login_required

  def index():

  return "Hello, %s!" % auth.username()

  @app.route(''/paywall'')

  @auth.login_required

  def paywall():

  return "%s, you are on page 2!" % auth.username()

  if __name__ == ''__main__'':

  app.run()

  清单 15-5

  使用外部文件的摘要认证

  ```


