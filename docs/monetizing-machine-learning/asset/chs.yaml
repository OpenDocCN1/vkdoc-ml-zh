  Flask 使用一种名为“**Jinja2**”的技术，将这些变量直接注入到 HTML 模板表单中。如果你查看 return 语句，它会调用 Flask 的“**render_template**”函数，并将预期的变量传递给“**index.html**”。


  模板要接收这些变量，只需使用双花括号命令即可。要查看所有这些内容，请参考 Web 应用程序“**index.htm**”的完整脚本（清单 2-59）。


