  ## 结论


  这就是我们的第一个项目！虽然这是一个简单的项目，Web 客户端和 Web 服务器之间的交互不多，但它符合真正 Web 应用程序的定义。在本章中，我们介绍了通过使用
  Flask 和 Web 控件将独立脚本扩展为交互式 Web 应用程序的概念。我们还看到了 Python 和 Python 库与 Flask Web 框架通信是多么容易，使得向
  Web 计算的跨越几乎无缝衔接。


  整个过程始于规划我们的 Web 应用程序应该是什么样子，以及什么内容能引起观众的兴趣。这一步再怎么强调也不为过：如果没有人感兴趣，那就没有必要费心去构建它。我们常常一开始就建模，然后试图改造它，使其适应一个
  Web 应用程序的故事。


  然后，我们探索了来自 Capital Bikeshare System 的自行车共享数据集，^(⁹) 尝试了不同的建模方法来预测环境因素下的租赁需求，并选择了最终的特征和模型系数用于我们的
  Web 应用程序。


  我们运行了 Flask 应用程序的本地版本，并最终将其部署到 Microsoft Azure 云上。如果你按照这个顺序执行这些步骤，应该不会有什么问题。始终从设计
  Web 应用程序的故事开始，尽可能在本地构建和运行它，然后再部署到云端。




