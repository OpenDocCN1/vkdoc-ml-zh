  哇，这是我们迄今为止看到的最低 RMSE 分数；我们将错误率降低了一半！




  ### 更复杂的特征工程——利用时间序列


  这是最后一个特征工程实验，其思路源自微软的数据科学家。^(⁸) 该数据集是自行车租赁随时间变化的台账，因此它是一个时间序列数据集。每当你的数据集记录了随时间变化的事件时，你都应将其作为附加特征纳入考量。例如，一小时前发生的事件可能比一年前发生的事件更重要。时间还可以捕捉趋势、不断变化的需求和认知等。我们要创建能够捕捉所有这些随时间演变要素的特征！


  对于每一行数据，我们将添加两个新特征：前一小时的自行车租赁总数，以及两小时前的自行车租赁总数。其直觉是，如果我们想了解当前的自行车租赁热度，可以从观察一小时前的情况入手。如果一小时前租赁量很大，那么现在很可能也不错。这个时间要素可以看作是繁荣或萧条时期、好或坏天气等的代理变量。


  为了按日期和小时计算自行车总数，我们使用 Pandas 极其强大的“**groupby()**”函数。我们提取“**dteday**”、“**hr**”和“**cnt**”三个字段，并按日期和小时对计数进行分组（清单
  2-20 和图 2-15）。


  ![images/468330_1_En_2_Fig15_HTML.jpg](img/468330_1_En_2_Fig15_HTML.jpg)


  图 2-15


  移动日期以创建新的回溯特征


  ```

  bikes_hour_df_shift = bikes_hour_df[[''dteday'',''hr'',''cnt'']].groupby([''dteday'',''hr'']).sum()

  bikes_hour_df_shift.head()

  清单 2-20

  查看前一时期的租赁计数

  ```


  此函数按小时和日期统计计数。接下来，我们创建两个新特征，一个向前移动 1 行，另一个移动 2 行，从而为当前行提供过去一小时和过去两小时的自行车租赁总数。最后，我们使用
  Pandas 的“**merge()**”命令将所有内容添加回主数据框（清单 2-21）。


  ```

  '
- '# 前几小时

  bikes_hour_df_shift = bikes_hour_df[[''dteday'',''hr'',''cnt'']].groupby([''dteday'',''hr'']).sum().reset_index()

  bikes_hour_df_shift.sort_values([''dteday'',''hr''])

  '
- '# 将最后两小时的计数向前移动，以便新计数能考虑过去两小时的情况

  bikes_hour_df_shift[''sum_hr_shift_1''] = bikes_hour_df_shift.cnt.shift(+1)

  bikes_hour_df_shift[''sum_hr_shift_2''] = bikes_hour_df_shift.cnt.shift(+2)

  '
- "# 将日期和小时计数合并回 bike_df_model_ready\nbike_df_model_ready =  pd.merge(bikes_hour_df,\
  \ bikes_hour_df_shift[['dteday', 'hr', 'sum_hr_shift_1', 'sum_hr_shift_2']], how=\"\
  inner\", on = ['dteday', 'hr'])\n清单 2-21\n时间偏移操作\n```\n\n在分割这些新数据并将其输入梯度提升模型（GBM）进行回归（使用\
  \ sklearn 的 GradientBoostingRegressor）后，我们计算测试数据集上的 RMSE 分数（清单 2-22）。\n\n```\n输入：\n\
  from sklearn.ensemble import GradientBoostingRegressor\nmodel_gbr = GradientBoostingRegressor()\n\
  model_gbr.fit(X_train, np.ravel(y_train))\npredictions = model_gbr.predict(X_test)\n\
  print(\"均方根误差: %.2f\" % sqrt(mean_squared_error(y_test, predictions)))\n输出：\n均方根误差:\
  \ 44.43\n清单 2-22\n时间偏移的 RMSE\n```\n\n哇，太棒了，RMSE 为 44.43，甚至更好了！！！\n\n## 简约模型\n\n\
  不幸的是，事情并不总是关乎最佳分数。在这里，我们需要一个简单的模型，以便使用回归方程进行预测。这并非复杂模型或过度工程化特征所能轻易实现的。GBM 不是线性模型，也无法为我们提供一个轻便的回归方程。此外，我们之前创建的时间偏移需要知道预测前两个小时的租赁总数，而我们的网站访问者无法从中受益，因为我们无法获取实时数据。\n\
  \n当你的目标是创建 Web 应用程序时，这是一个重要的教训：如果最准确的预测来自复杂的建模技术，那么它通常很难很好地转化为生产流水线。\n\n### 从简单模型中提取回归系数——无需服务器端计算即可轻松预测需求\n\
  \n线性回归模型并非最强大的模型，它本身也不以此自居，但它可以将相当复杂的数据提炼成极其简单清晰的线性表示。正是这种简单的表示将为我们的应用程序提供动力。\n\n\
  回归建模的一个强大产物是学习到的模型系数。这在 Web 应用程序的上下文中更为强大，因为我们可以仅依赖这些系数和一个简单的回归方程来估计未来的自行车租赁需求。这有可能使应用程序完全在客户端前端做出复杂决策——轻量、快速且实用！\n\
  \n为了最终得到一组简洁的系数和一个简单的回归方程，我们首先需要训练和测试一个回归模型。只有当我们对分数、使用的特征以及预测质量感到满意时，我们才提取系数。我们还将把输入模型的特征精简到必要且具有说明性的程度。以下是构建\
  \ Web 应用程序的教训之一：我们必须平衡最佳建模分数与生产现实。如果你构建了一个非凡的模型，但没有人能操作它，或者它无法在生产中及时运行，那它就是失败的。\n\
  \n为了 Web 应用程序的简洁性，我们将保持简单，仅使用四个特征：“**season**”、“**hr**”、“**holiday**”和“**temp**”。这些特征用户能够理解，易于获取，并且由于只有四个特征，我们的模型将运行得很快。让我们首先单独对这些特征进行建模，并检查它们的\
  \ R 平方分数。\n\n\n\n### R 平方\n\nR 平方是一种统计度量，用于衡量数据与拟合回归线的接近程度。它也被称为决定系数，或在多元回归中称为多重决定系数。R\
  \ 平方的定义相当直接：它是由线性模型解释的响应变量变异性的百分比（列表 2-23）。\n\n```\nR-squared = Expected variation\
  \ / Total variation\n列表 2-23\nR 平方公式\n```\n\n决定系数可以看作一个百分比。它让你了解有多少数据点落在回归方程所形成直线的结果范围内。系数越高，落在直线内的点就越多。如果系数为\
  \ 0.80，那么 80% 的点应该落在回归线内。\n\n我们希望看到 R 平方尽可能接近 1（或 100%），且没有负数。使用 sklearn 的“**r2_score**”函数可以轻松计算（列表\
  \ 2-24）。\n\n```\n输入：\nfrom sklearn.metrics import r2_score\nfor feat in features:\n\
  model_lr = linear_model.LinearRegression()\nmodel_lr.fit(X_train[[feat]], y_train)\n\
  predictions = model_lr.predict(X_test[[feat]])\nprint('R² for %s is %f' % (feat,\
  \ r2_score(y_test, predictions)))\n输出：\nR² for hr is 0.160161\nR² for season is\
  \ 0.034888\nR² for holiday is -0.001098\nR² for temp is 0.154656\n列表 2-24\n各特征的\
  \ R 平方得分\n```\n\n每个 R 平方都是正数，我们看到“**hr**”和“**temp**”比“**season**”和“**holiday**”解释了更多的方差。请记住，我们是在单独查看每个特征；一个很好的后续步骤（此处未涉及）是计算所有特征一起的\
  \ R 平方得分（或使用调整后的 R 平方来处理多个特征）。\n\n如前所述，我们还将对“**season**”变量进行“**虚拟化**”。如果我们在包含“**虚拟化**”变量的所有特征上重新运行\
  \ R 平方计算循环，我们会得到以下得分（列表 2-25）。\n\n```\nR² for hr is 0.156594\nR² for holiday is\
  \ 0.001258\nR² for temp is 0.154471\nR² for season_1 is 0.053717\nR² for season_2\
  \ is 0.003657\nR² for season_3 is 0.016976\nR² for season_4 is 0.001111\n列表 2-25\n\
  虚拟化特征上的 R 平方得分\n```\n\n所有值都是正数，因此我们可以在最终的 Web 应用程序中使用这组特征。\n\n### 使用提取的系数预测新数据\n\
  \n现在我们有了模型的系数，我们可以使用回归方程预测新的租赁数量。回归方程是我们回归模型中最优拟合线的方程。该公式很常见，可以在大多数涉及统计学的书籍中看到（图\
  \ 2-16）。\n\n![images/468330_1_En_2_Fig16_HTML.jpg](img/468330_1_En_2_Fig16_HTML.jpg)\n\
  \n图 2-16\n\n回归方程\n\n“**y**”是因变量，或者说是我们试图预测的值，在我们的例子中，是自行车租赁的数量，a 是截距，“**β**”是直线的斜率，“**x**”是自变量。在多元线性回归的情况下，你只需添加更多的自变量。\n\
  \n一个重要的注意事项是，这个公式及其系数代表了模型中使用的数据可能产生的最小误差。因此，当我们向其中注入新数据时，我们实际上无法同时更改所有自变量。这是一个需要记住的重点，尽管我们将允许用户调整各种环境设置来影响自行车租赁的数量，但我们也会提供一个“**重置**”按钮，将所有变量重置回其原始平均值。\n\
  \n在我们运行最终模型后，我们需要提取截距和系数。使用 sklearn 的“**linear_model**”函数很容易做到这一点，只需调用“**intercept_**”和“**coef_**”参数即可获取它们（列表\
  \ 2-26 和 2-27，以及图 2-17）。\n\n![images/468330_1_En_2_Fig17_HTML.jpg](img/468330_1_En_2_Fig17_HTML.jpg)\n\
  \n图 2-17\n\n查看线性回归模型的系数\n\n```\nfeature_coefficients = pd.DataFrame({'coefficients':model_lr.coef_[0],\n\
  'features':X_train.columns.values})\nfeature_coefficients.sort_values('coefficients')\n\
  列表 2-27\n获取系数\n```\n\n```\n输入：\nfrom sklearn import linear_model\nmodel_lr = linear_model.LinearRegression()\n\
  model_lr.fit(X_train, y_train)\nprint('Intercept: %f' % model_lr.intercept_)\n输出：\n\
  Intercept: -121.029547\n列表 2-26\n获取截距\n```\n\n然后，我们可以将这些常量分配给我们的 Web 应用程序，以便它能够预测自行车租赁需求（列表\
  \ 2-28）。\n\n```\nINTERCEPT = -121.029547\nCOEF_HOLIDAY = -23.426176   # 当天是否为节假日\n\
  COEF_HOUR = 8.631624        # 小时 (0 到 23)\nCOEF_SEASON_1 = 3.861149    # 1: 春季\n\
  COEF_SEASON_2 = -1.624812   # 2: 夏季\nCOEF_SEASON_3 = -41.245562  # 3: 秋季\nCOEF_SEASON_4\
  \ = 39.009224   # 4: 冬季\nCOEF_TEMP = 426.900259      # 归一化温度，摄氏度 -8 到 +39\n列表 2-28\n\
  从提取的系数创建常量\n```\n\n我们还需要获取历史平均值来构建我们的回归方程。如果值是分类的，那么我们选择最高的平均值并将其设为 1，其他设为 0（就像我们对节假日和季节所做的那样）（列表\
  \ 2-29）。\n\n```\nMEAN_HOLIDAY = 0   # 当天是否为节假日\nMEAN_HOUR = 11.6   # 小时 (0 到 23)\n\
  MEAN_SEASON_1 = 0  # 1: 春季\nMEAN_SEASON_2 = 0  # 2: 夏季\nMEAN_SEASON_3 = 1  # 3:\
  \ 秋季\nMEAN_SEASON_4 = 0  # 4: 冬季\nMEAN_TEMP = 0.4967 # 归一化温度，摄氏度 -8 到 +39\n列表 2-29\n\
  设置特征均值\n\n```\n\n我们现在拥有了预测新租赁数量所需的一切。让我们看看在上午 9 点，所有其他值保持在其平均值附近时，我们会得到多少租赁量（列表\
  \ 2-30）。\n\n```\n输入：\nrental_counts = INTERCEPT + (MEAN_HOLIDAY * COEF_HOLIDAY)\
  \ \\\n+ (9 * COEF_HOUR) \\\n+ (MEAN_SEASON_1 * COEF_SEASON_1)  + (MEAN_SEASON_2\
  \ * COEF_SEASON_2) \\\n+ (MEAN_SEASON_3 * COEF_SEASON_3)  + (MEAN_SEASON_4 * COEF_SEASON_4)\
  \ \\\n+ (MEAN_TEMP * COEF_TEMP)\nprint('Estimated bike rental count for selected\
  \ parameters: %i' % int(rental_counts))\n输出：\nEstimated bike rental count for selected\
  \ parameters: 171\n列表 2-30\n让我们使用提取的系数进行预测\n```\n\n结果是上午 9 点租出了 171 辆自行车（你的结果可能略有不同）。我们将允许用户一次更改多个特征，但请记住，对原始方程值进行过多更改可能会降低模型性能。\n\
  \n## 设计一个有趣且交互式的 Web 应用程序来展示自行车租赁需求\n\n现在到了有趣的部分，让我们设计我们的 Web 应用程序。我们始终需要牢记最终目标——我们想与他人分享什么，以及他人想看什么？\n\
  \n我们将设计一个交互式 Web 应用程序，允许用户自定义环境变量（时间、节假日、温度和季节），并获得自行车租赁数量的可视化反馈。\n\n这个应用程序需要在视觉上引人注目，以吸引用户并让他们在操作时保持兴趣。这意味着需要在信息传达、用户界面、视觉效果和交互控件上投入与数据收集和建模同样多的思考。\n\
  \n\n\n## 为提升可读性与可扩展性而抽象化代码\n\n与我的大多数 Web 应用程序一样，我尝试将代码抽象成逻辑模块。一个模块负责收集用户数据，另一个模块（即“**大脑**”）则负责构建回归方程、运行它并返回自行车租赁预测。将代码组织在逻辑单元中，将极大地简化你在构建和调试\
  \ Web 应用程序时的工作。这使你能够对每个模块进行单元测试，以确保一切正常运行，或者在出现问题时通过排除法来定位问题。\n\n就本章的 Web 应用程序而言，大部分“**大脑**”将直接驻留在主\
  \ HTML 页面中。Flask 是一个 Web 服务框架，主要用于检索、分析和返回定制化内容。在本章中，我们只需要回归方程来预测自行车租赁需求，因此实际上并不需要在用户和\
  \ Web 服务器之间进行大量来回交互（这也是本书中唯一这样做的章节；在其他所有章节中，“大脑”将明确驻留在服务器端，而非客户端的网页上）。\n\n## 构建本地\
  \ Flask 应用程序\n\n在将代码部署到云端之前，先在本地运行测试非常重要；这既能避免让你头疼，也能节省时间。首先，让我们在本地机器上执行一个简单的 Flask\
  \ 练习。如果你从未在本地运行过 Flask 应用程序，你需要使用“**pip3 install**”或你的操作系统和 Python 版本支持的任何工具来安装以下\
  \ Python 库。\n\n*   Flask\n\n安装好 Flask 后，打开一个文本编辑器，输入以下代码，并将其保存为“**hello.py**”（清单\
  \ 2-31）。\n\n```\nfrom flask import Flask\napp = Flask(__name__)\n@app.route('/')\n\
  def hello_world():\nreturn 'Hello, World!'\n清单 2-31\n简单的 Flask 脚本\n```\n\n然后打开一个终端/命令窗口，在\
  \ Mac 或 Windows 上输入以下命令（清单 2-32 和 2-33）。\n\n```\n$ export FLASK_APP= main.py\n$\
  \ python -m flask run\n清单 2-33\n在 Windows 上\n```\n\n```\n$ export FLASK_APP=main.py\n\
  $ flask run\n清单 2-32\n在 Mac 上\n```\n\n你应该会看到类似图 2-18 的内容。\n\n![images/468330_1_En_2_Fig18_HTML.jpg](img/468330_1_En_2_Fig18_HTML.jpg)\n\
  \n图 2-18\n\n显示 Flask 应用程序本地 URL 的终端/命令窗口\n\n然后，将 URL “`http://127.0.0.1:5000/`”（或终端窗口中显示的任何地址）复制到浏览器中，你应该就能看到\
  \ Web 应用程序出现了。更多示例和技巧可以在官方 Flask 快速入门指南中找到：“ [`http://flask.pocoo.org/docs/0.12/quickstart`](http://flask.pocoo.org/docs/0.12/quickstart)\
  \ ”。\n\n那么，刚才发生了什么？如果你对 Web 服务框架不熟悉，这可能看起来有点令人生畏（请记住，Flask 是目前最简单的框架之一）。让我们逐步分解这个过程。\n\
  \n在前面的“**Hello world**”示例中，一切都发生在假设的 Web 服务器端（实际上就是你的本地机器）。它的工作是处理命令，并将可消费的 HTML\
  \ 内容返回给发出请求的客户端网页。\n\n首先，我们将 Flask 库加载到内存中（清单 2-34）。\n\n```\nfrom flask import Flask\n\
  清单 2-34\n导入 Flask\n```\n\n然后，我们实例化 Flask 会话（清单 2-35）。\n\n```\napp = Flask(__name__)\n\
  清单 2-35\n实例化 Flask\n```\n\n最后，我们创建一个函数来执行某些操作，并用路由参数对其进行装饰，以便它知道将处理来自 Web 客户端的哪些命令。在本例中，‘/’\
  \ 仅表示根页面或根“**index.html**”页面会话（清单 2-36）。\n\n```\n@app.route('/')\ndef hello_world():\n\
  return 'Hello, World!'\n清单 2-36\n处理来自根 URL 流量的 Flask 函数\n```\n\n显然，函数很少会如此简单；它很可能会调用数据库或表述性状态转移（REST）API\
  \ 调用来收集定制信息，并通过 HTML 模板将其发送回客户端的网页。整个过程允许创建智能的、定制化的数据，然后将其封装到一个外观精美的网页中。无论从哪个角度看，它看起来都像一个手工制作的页面，尽管它是由\
  \ Flask 动态创建的。我们将在本书中全程使用 Flask，如果你能坚持学完每一章，你将对这个工具有深刻的理解。\n\n最后一段代码仅在本地模式（即从本地机器运行）下使用，它运行\
  \ Web 服务器代码，并在本例中打开调试标志（清单 2-37）。\n\n```\nif __name__=='__main__':\napp.run(debug=True)\n\
  清单 2-37\n在本地自动运行 Flask 应用程序\n```\n\n### 在本地下载并运行共享单车 GitHub 代码\n\n如果你还没有下载本章的文件，请下载它们并导航到“\
  \ **web-application** ”文件夹。你的文件夹应该看起来像清单 2-38。\n\n```\nweb-application\n├── appengine_config.py\n\
