  简单的 Flask 脚本

  ```


  就是这样！虽然这做不了太多事情，但它代表了让 Flask 网站启动并运行所需的最基本内容；这是一个真正的 Web 应用程序。将脚本保存为“**main.py**”，放在你本地机器上的任何位置（你可以随意命名）。


  ### 步骤 2：启动虚拟环境


  使用虚拟环境将你的开发工作与机器上的其他部分隔离开来总是一个好主意（这在构建“**requirements.txt**”文件时也很有用`—`请参阅引言中的“**创建‘requirements.txt’文件**”部分）。让我们启动一个虚拟环境（列表
  1-2）。


