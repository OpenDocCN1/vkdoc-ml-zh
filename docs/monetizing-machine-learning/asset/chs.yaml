  ### 将 OpenWeatherMap 转换为“高尔夫|天气数据”


  为了将“**OpenWeatherMap**”数据转换为正确的“**高尔夫|天气数据集**”格式，需要进行一些数据转换。接下来，我们将调整一些量纲，并修正一些分类数据。


  **天气状况**


  高尔夫数据集中的“**天气状况**”分类特征有三个可能的值：“**阴天**”、“**雨天**”和“**晴天**”。在“**OpenWeatherMap**”中，一个接近的对应项是“**weather.main**”变量，它提供了九个可能的值：^(³⁵)


  *   晴空

  *   少云

  *   散云

  *   多云

  *   阵雨

  *   雨

  *   雷暴

  *   雪

  *   薄雾


  虽然这带有主观性，但我们需要决定如何映射。让我们对这些值进行分组，并构建一个函数来处理等价关系（如果你不喜欢我的分组，可以自行更改）。


  **晴天**


  *   晴空

  *   少云


  **阴天**


  *   散云

  *   多云

  *   薄雾


  **雨天**


  *   阵雨

  *   雨

  *   雷暴

  *   雪


  我们将分组结果封装到一个简洁的函数中，该函数可以处理“**OpenWeatherMap**”和“**高尔夫|天气数据**”之间的等价关系（代码清单 7-10）。我们还利用了“**OpenWeatherMap**”提供的一个便捷功能，即获取天气的图形图标，这些图标将显示在我们的
  Web 应用程序上（请参阅 [`https://openweathermap.org/weather-conditions`](https://openweathermap.org/weather-conditions)
  上的完整图标列表）。


  ```

  def GetWeatherOutlookAndWeatherIcon(main_weather_icon):

  # 截取第三个字符 - 不需要白天或夜晚标识

  main_weather_icon = main_weather_icon[0:2]

  # 返回 "高尔夫|天气数据" 变量和白天图标

  if (main_weather_icon in ["01", "02"]):

  return("sunny", main_weather_icon + "d.png")

  elif (main_weather_icon in ["03", "04", 50]):

  return("overcast", main_weather_icon + "d.png")

  else:

  return("rain", main_weather_icon + "d.png")

  代码清单 7-10

  函数 “GetWeatherOutlookAndWeatherIcon”

  ```


  **数值型温度**


  你可能已经注意到，温度单位不是华氏度或摄氏度，而是开尔文。因此，我们需要通过以下公式将其转换为华氏度（虽然你可以让 API 为你完成此操作，但我们将自己动手）：


  ```

  华氏度 = T × 1.8 - 459.67

  ```


  以及摄氏度：


  ```

  摄氏度 = K - 273.15

  ```


  **名义温度**


  名义温度是一个分类变量，由三个值组成：“**凉爽**”、“**温和**”和“**炎热**”。由于这些是主观分组，我们将推断出范围，以便根据来自“**OpenWeatherMap**”的实时预报创建新的分组（代码清单
  7-11）。


  ```

  输入:

  golf_df[[''Temperature_Numeric'', ''Temperature_Nominal'']].groupby(''Temperature_Nominal'').agg({''Temperature_Numeric''
  : [np.min, np.max]})

  输出:

  Temperature_Numeric

  amin amax

  Temperature_Nominal

  cool                                 64   69

  hot                                  80   85

  mild                                 70   75

  代码清单 7-11

  名义温度

  ```


  “**凉爽**”的范围是 64 到 69 华氏度，而“**温和**”的范围是 70 到 75。这很简单，因为这两个值之间没有间隙。另一方面，“**炎热**”从
  80 开始。因此，我们需要处理 75 到 80 之间的间隙。为简单起见，我们将“**温和**”的范围扩展到 80。最终得到以下函数（代码清单 7-12）。


  ```

  def GetNominalTemparature(temp_fahrenheit):

  if (temp_fahrenheit < 70):

  return "cool"

  elif (temp_fahrenheit < 80):

  return "mild"

  else:

  return "hot"

  代码清单 7-12

  名义温度

  ```


  **数值型湿度**


  “**OpenWeatherMap**”上的湿度以百分比形式给出，因此我们将直接使用其精确的数值形式。^(³⁶)


  **名义湿度**


  就像我们对分类名义温度所做的那样，我们需要对名义湿度应用相同的逻辑。肯定有不同的方法来划分这个变量，但必须做出选择，将百分比转换为当前“**高尔夫|天气数据**”数据集中存在的类别（代码清单
  7-13）。


  ```

  输入:

  golf_df[[''Humidity_Numeric'', ''Humidity_Nominal'']].groupby(''Humidity_Nominal'').agg({''Humidity_Numeric''
  : [np.min, np.max]})

  输出:

  Humidity_Numeric

  amin amax

  Humidity_Nominal

  high                           85   96

  normal                         65   80

  代码清单 7-13

  湿度

  ```


  根据我们的历史数据，我们只有两个选择：“**高**”或“**正常**”。我们将采用简单的方法，将 81% 及以上的湿度视为高，其他情况视为正常（代码清单 7-14）。


  ```

  def GetNominalHumidity(humidity_percent):

  if (humidity_percent > 80):

  return "high"

  else:

  return "normal"

  代码清单 7-14

  函数 “GetNominalHumidity”

  ```


  **有风**


  “**OpenWeatherMap**”指出风速单位是米/秒。^(³⁷) 我们将使用蒲福风级（一种将风速与不同陆地和海洋状况联系起来的等级）及其对“**强风**”类别的定义来确定什么是有风、什么是无风（图
  7-5），并抽象出一个函数（代码清单 7-15）。该等级的中点位于风速超过 10.8 米/秒时，被视为“**强风**”。


  ![images/468330_1_En_7_Fig5_HTML.png](img/468330_1_En_7_Fig5_HTML.png)


  图 7-5


  蒲福风级（来源：维基百科）


  ```

  def GetWindyBoolean(wind_meter_second):

  if (wind_meter_second > 10.8):

  return(True)

  else:

  return(False)

  代码清单 7-15

  函数 “GetWindyBoolean”

  ```


  ## 设计一个 Web 应用程序“明天我会打高尔夫吗？”使用实时天气预报数据


  像往常一样，我们希望我们的应用程序直观、可视化且有趣。这将成为全世界所有高尔夫球手的首选应用程序（没错！）。它也是一个强大的应用程序，将使用来自世界任何地方的实时天气预报，同时保持极其简单的构建方式。这就是贝叶斯模型的魅力所在：它简单、快速，并且为
  Web 应用程序提供了一个出色的实时且可扩展的建模选项。


  我们的网页只需要两个输入框，以便用户可以输入他们想要打高尔夫的位置和明天的具体时间。该应用程序将尝试查找该位置和时间的天气预报，将“**OpenWeatherMap**”的
  JSON 数据转换为所需的“**高尔夫|天气数据集**”格式，并针对“**明天我会打高尔夫吗**”这个问题返回“**是**”或“**否**”。非常简单，对吧？




