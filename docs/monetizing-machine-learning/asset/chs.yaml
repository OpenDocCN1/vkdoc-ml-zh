  \ **requirements.txt** ”文件。使用虚拟环境时，你正在创建一个没有任何 Python 库的安全沙箱。这允许你只安装所需的内容，并运行“ **pip\
  \ freeze** ”命令来获取库和当前版本号的快照。请注意，如果你已经知道所需的库、依赖项和版本号，则无需执行此操作。事实上，你也可以直接使用本书附带的“\
  \ **requirements.txt** ”文件。\n\n### 步骤 1\n\n通过创建一个 Python 虚拟环境来从一张白纸开始，如列表 11 所示。\n\
  \n```\n$ python3 -m venv some_env_name\n$ source some_env_name/bin/activate\n列表\
  \ 11\n启动虚拟环境\n```\n\n### 步骤 2\n\n使用“ **pip3** ”安装运行本地 Web 应用程序所需的库，如列表 12 所示。\n\n\
  ```\n$ pip3 install flask\n$ pip3 install pandas\n$ pip3 install sklearn\n列表 12\n\
  安装一些库作为示例\n```\n\n### 步骤 3\n\n冻结环境并将所有已安装的 Python 库（包括版本号）通过管道输出到“ **requirements.txt**\
  \ ”文件中，如列表 13 所示。\n\n```\n$ pip3 freeze > requirements.txt\n列表 13\n安装所需的库\n```\n\
  \n### 步骤 4\n\n最后，停用你的虚拟环境，如列表 14 所示。\n\n```\n$ deactivate\n列表 14\n退出 venv\n```\n\
