- '# 14. 在 PythonAnywhere 和 MySQL 上进行 A/B 测试


  这是一个雄心勃勃的章节，因此我们将限定范围，以便提炼这个丰富主题的精髓，而不会过度深入。我们将从构建一个简单的 MySQL 数据库和表开始，用于跟踪访问者是否喜欢着陆页上的艺术作品。由于这是
  A/B 测试，我们将创建两个着陆页，并在用户访问网站时随机切换它们（图 14-1）。


  ![images/468330_1_En_14_Fig1_HTML.png](img/468330_1_En_14_Fig1_HTML.png)


  图 14-1


  本章的最终 Web 应用程序


  ### 注意


  通过访问 [`www.apress.com/9781484238721`](http://www.apress.com/9781484238721) 并点击源代码按钮，下载第
  14 章的文件。您需要在本地机器上安装 MySQL，才能跟随 Jupyter notebook “**chapter14.ipynb**” 进行操作。


  在分析学中，A/B 测试意味着使用某物的两个不同版本，并衡量人们对每个版本的反应。这在网站中常用于尝试新设计、新产品、新促销等。在我们的案例中，我们将向访问者展示着陆页的两个不同版本。这些版本将被随机分配，访问者将有机会在喜欢该页面时竖起大拇指。在后台，我们将跟踪此流量以及用户是否竖起大拇指。如果用户没有竖起大拇指，我们将假定这是一个反对票。


  这是一个重要的主题，可以为您带来关于您的业务和用户的宝贵知识。有一个著名的轶事：玛丽莎·梅耶在谷歌工作时，进行了一次 A/B 测试，以确定用户在 40 种蓝色中更喜欢哪一种。^(⁵⁸)
  显然，人们可能会在这些类型的测试中过度投入。


  ## A/B 测试


  A/B 测试的目标是向公众展示不同的产品并衡量他们的反应。在我们的 Web 应用程序中，我们将展示一个包含两张不同图片的网页：一张愤怒的脸和一张友好的脸。我们将在页面上添加一个简单的标签，要求访问者如果喜欢该图片就竖起大拇指。在后台，我们将统计每次访问和每次竖起大拇指。为简单起见，我们将初始访问计为反对票，如果访问者点击投票按钮，则将其更新为赞成票。请参见图
  14-2 和 14-3 以了解每张图片的版本。


  ![images/468330_1_En_14_Fig3_HTML.png](img/468330_1_En_14_Fig3_HTML.png)


  图 14-3


  图片二


  ![images/468330_1_En_14_Fig2_HTML.png](img/468330_1_En_14_Fig2_HTML.png)


  图 14-2


  图片一




  ### 追踪用户


  追踪匿名访客有多种方式。常见方法包括使用 Cookie 和数据库。每种方法都有其优势和用途。Cookie 的优势在于，无论用户是否关闭浏览器或关闭电脑，都能在较长时间内追踪用户。网页可以轻松检查访客电脑上之前的
  Cookie，并与数据库中的信息进行比对，以判断该访客是否为重复访客。


  我们不需要使用 Cookie，因为我们只考虑单次访问。相反，我们将使用 HTML 隐藏标签来追踪用户，并通过 POST 请求将该标签传回。当访客首次访问页面时，我们会在数据库中插入一行记录，包含页面背景图片、时间戳以及一个唯一标识符（一个对该用户唯一的超长字符串；生成两个相同字符串的概率微乎其微），该标识符称为
  UUID。如前所述，我们假设首次页面访问为“不喜欢”，并将其写入数据库。在构建页面时，我们会插入一个包含 UUID 的 HTML 隐藏标签，这样如果用户通过点击“喜欢”按钮与页面交互，我们就能将
  UUID 传回 Web 服务器，从而更新数据库中之前插入的那行记录。这种方法使我们能够同时服务大量访客，而无需担心谁拥有哪个页面。根据你的需求，有很多方法可以调整和改进这一流程。你甚至可以根据需要，多次在客户端和服务器之间传递该
  UUID，并始终清楚你正在处理的是哪个会话和用户。


  ### UUID


  通用唯一标识符（UUID）长度为 128 位，强度高，且保证唯一。我们将使用便捷的“**uuid**”Python 库来自动生成保证唯一的标识符（列表 14-1）。


  ```

  输入：

  import uuid

  str(uuid.uuid4())

  输出：

  ''e7b1b80e-1eca-43a7-90a3-f01927ace7c9''

  列表 14-1

  “uuid”库

  ```


  在“**uuid**”库中，“**uuid4()**”函数会生成一个新的随机 ID，而不依赖于计算机的标识符，因此它既唯一又私密。有关 UUID 的更多详细信息和选项，请查阅文档：[`https://docs.python.org/3/library/uuid.html`](https://docs.python.org/3/library/uuid.html)。


  ## MySQL


  我们将使用 MySQL Community Server，这是一款优秀且流行的免费数据库。它非常适合满足我们的 A/B 测试需求。它是一个开源的关系型数据库，能够支持广泛的需求，并被包括
  WordPress 以及 Google 和 Facebook 等大型媒体公司在内的众多大型企业所使用。


  请前往 [`https://dev.mysql.com/downloads`](https://dev.mysql.com/downloads) 下载适用于你操作系统的
  MySQL Community Server 版本。如果你有任何问题或疑问，还可以在那里找到针对你操作系统的安装说明。我们不会使用任何前端界面，不过如果你需要使用，也有不少可用的前端工具（图
  14-4）。


