  # 3. 在 GCP 上使用逻辑回归实现实时智能


  让我们通过在 Google Cloud 上构建一个交互式乘客档案生成器，来了解泰坦尼克号沉船事故中哪些人幸存了下来。


  在本章中，我们将重新审视全球建模教科书和教育博客所钟爱的经典且戏剧性的泰坦尼克号数据集。我们将分析乘客名单，并试图理解为什么有些人在这场悲剧事故中幸存，而另一些人却没有。我们将探索数据集，为建模做好准备，并将其扩展为一个交互式
  Web 应用程序，允许用户创建一个虚构的乘客，调整参数，并可视化该乘客在航行中的表现（图 3-1）。


