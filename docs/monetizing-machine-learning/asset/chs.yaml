  app.config[''SECRET_KEY''] = ''secret key here''

  auth = HTTPDigestAuth()

  users = {

  "john": "hello",

  "susan": "bye"

  }

  @auth.get_password

  def get_pw(username):

  if username in users:

  return users.get(username)

  return None

  @app.route(''/'')

  @auth.login_required

  def index():

  return "Hello, %s!" % auth.username()

  @app.route(''/paywall'')

  @auth.login_required

  def paywall():

  return "%s, you are on page 2!" % auth.username()

  if __name__ == ''__main__'':

  app.run()

