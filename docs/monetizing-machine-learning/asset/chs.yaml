  \n```\njupyter notebook\n列表 2\n运行 Notebook（查看官方文档了解启动 notebook 的其他方式）\n```\n\n此命令将打开一个网页，显示启动该命令所在文件夹的内容（图\
  \ 3）。你可以通过点击文件列表上方的文件夹图标来向下导航文件夹结构。\n\n![images/468330_1_En_BookFrontmatter_Fig3_HTML.jpg](img/468330_1_En_BookFrontmatter_Fig3_HTML.jpg)\n\
  \n图 3\n\nJupyter notebook 起始页\n\n要打开一个 Jupyter notebook，只需点击任何扩展名为“*. **ipynb**\
