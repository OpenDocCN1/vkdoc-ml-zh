  \ ha=\"center\", rotation=45, color=\"blue\", verticalalignment=\"bottom\", fontsize=10)\n\
  plt.show()\n代码清单 10-11\n按评论年份统计的热门类型\n```\n\n“**剧情片**”是最常见的类型，其中穿插着一些“**喜剧片**”，这并不令人意外。2000\
  \ 年似乎是“**剧情片**”电影表现不错的一年。\n\n\n\n## 获取推荐\n\n至此，您应该对我们所使用的数据有了清晰的理解，这将使后续关于建模的章节更易于理解。\n\
  \n为了简化过滤流程，我们将创建一个“**矩阵**”，该矩阵仅使用评分数据框中的三个字段：“**userId**”、“**movieId**”和“**ratings**”（列表\
  \ 10-12）。\n\n```\n输入:\nratings_df.set_index(['userId', 'movieId'], inplace=True)\n\
  ratings_matrix = sps.csr_matrix((ratings_df.rating,\n(ratings_df.index.labels[0],\
  \ ratings_df.index.labels[1]))).todense()\nprint('shape ratings_matrix:', ratings_matrix.shape)\n\
  输出:\nshape ratings_matrix: (671, 9066)\n列表 10-12\n创建用户-电影评分矩阵\n```\n\n这是通过将索引设置为“**userId**”和“**movieId**”，然后使用其中一个索引作为行、另一个作为列来创建矩阵完成的。由于许多评分将为零，我们使用“**scipy.sparse.csr_matrix()**”函数来创建一个高效的稀疏矩阵（更多信息，请参阅官方文档\
  \ [`https://docs.scipy.org/doc/scipy-0.15.1/reference/generated/scipy.sparse.csr_matrix.html`](https://docs.scipy.org/doc/scipy-0.15.1/reference/generated/scipy.sparse.csr_matrix.html)\
  \ ）。该矩阵将如图 10-10 所示。\n\n![images/468330_1_En_10_Fig10_HTML.jpg](img/468330_1_En_10_Fig10_HTML.jpg)\n\
  \n图 10-10\n\n非常重要的“**用户**”对“**已评分电影**”矩阵\n\n使用此矩阵将使我们的查询、相似度测量以及最终的 SVD 模型运行得更快。\n\
  \n我们还需要创建一个电影列表，其索引连续且排序顺序与电影数据框中原始电影 ID 的顺序相同。这可以通过删除原始“**movieId**”字段并将其替换为行索引来轻松实现。然后我们将其合并到评分表中，并为评分和电影都采用新的\
  \ ID（列表 10-13 和图 10-11）。\n\n![images/468330_1_En_10_Fig11_HTML.jpg](img/468330_1_En_10_Fig11_HTML.jpg)\n\
  \n图 10-11\n\n旧的间断“**movieId**”与新的增量“**movieId_new**”\n\n```\nmovies_df_raw = pd.read_csv('ml-latest-small/movies.csv')\n\
  movies_df_raw['movieId_new'] = movies_df_raw.index\nmovies_df_raw.tail()\n列表 10-13\n\
  修复电影 ID\n```\n\n我们将依赖此行索引来提取相似度。通过查看尾部，我们确认总共有 9,066 部独特的电影。我们需要将这个新的电影 ID 应用于评分和电影数据框，并将其重命名为“**movieId**”以保持一致性（列表\
  \ 10-14）。\n\n```\nratings_df_raw = ratings_df_raw.merge(movies_df_raw[['movieId',\
  \ 'movieId_new']], on=\"movieId\", how=\"inner\")\nratings_df_raw = ratings_df_raw[['userId',\
  \  'movieId_new', 'rating']]\nratings_df_raw.columns = ['userId',  'movieId', 'rating']\n\
  movies_df_raw = movies_df_raw[['movieId_new', 'title', 'genres']]\nmovies_df_raw.columns\
  \ = ['movieId', 'title', 'genres']\n列表 10-14\n应用修复后的电影 ID\n```\n\n在深入探讨相似度度量之前，我们最后需要做的一件事是提取一部基础电影，该电影将用于所有后续的相似度算法。我们将评分表中索引为“**0**”的评分数据取出；这代表了原始电影《玩具总动员》的所有评分（列表\
  \ 10-15）。\n\n```\n输入:\nmovie_toy_story = (mat[:,0])\nmovie_toy_story[0:20]\n输出:\n\
  matrix([[ 0\\. ],\n[ 0\\. ],\n[ 0\\. ],\n[ 0\\. ],\n[ 0\\. ],\n[ 0\\. ],\n[ 3\\\
  . ],\n[ 0\\. ],\n[ 4\\. ],\n[ 0\\. ],\n[ 0\\. ],\n[ 0\\. ],\n[ 5\\. ],\n[ 0\\. ],\n\
  [ 2\\. ],\n[ 0\\. ],\n[ 0\\. ],\n[ 0\\. ],\n[ 3\\. ],\n[ 3.5]])\n列表 10-15\n基于《玩具总动员》的评分基准\n\
  ```\n\n## 协同过滤\n\n协同过滤是一种流行的推荐系统类型，它基于利用其他具有相似品味的用户的偏好。\n\n## 相似度/距离度量工具\n\n有大量的距离度量公式可用于衡量两个数字列表之间的相似度或不相似度。当您想要比较多组数字时，这会非常方便。在这里，我们将通过使用欧几里得距离和余弦相似度度量来比较基于用户推荐的电影。\n\
  \n我们将再次利用强大的 Scipy 库，并在本章的大部分需求中使用其距离计算函数“**scipy.spatial.distance()**”。\n\n## 欧几里得距离\n\
  \n简单来说，欧几里得距离是两点之间的距离，可能是最流行的距离算法。这里我们将使用 Scipy 的“**spatial.distance.euclidean()**”函数来计算我们的种子行（《玩具总动员》）与所有其他行之间的欧几里得距离（列表\
  \ 10-16 和图 10-12）。\n\n![images/468330_1_En_10_Fig12_HTML.jpg](img/468330_1_En_10_Fig12_HTML.jpg)\n\
  \n图 10-12\n\n与《玩具总动员》（1995）欧几里得距离最短的电影\n\n```\ndistances_to_movie = []\nfor other_movies\
  \ in mat.T:\ndistances_to_movie.append(scipy.spatial.distance.euclidean(movie_toy_story,\
  \ other_movies.tolist()))\n# 创建包含电影及其与《玩具总动员》距离分数的数据框\ndistances_to_movie = pd.DataFrame({'movie':movies_df['title'],'distance':distances_to_movie})\n\
  # 按距离升序排序（即最接近 movie_toy_story）\ndistances_to_movie = distances_to_movie.sort_values('distance')\n\
  distances_to_movie.head(10)\n列表 10-16\n获取相似电影\n```\n\n欧几里得距离能够很好地将《玩具总动员》与“**玩具总动员\
  \ 2**”和“**虫虫危机**”关联起来；从直觉上看，这是有道理的。\n\n## 余弦相似度距离\n\n余弦相似度衡量两个向量之间的余弦角度。^(⁴⁶) 这是一种比欧几里得距离更复杂的度量形式，我们将在本章中一直使用它。\n\
  \n让我们重复之前的练习，使用 Scipy 的“**spatial.distance.cosine()**”函数来计算我们的种子行（《玩具总动员》）与所有其他行之间的余弦距离（列表\
  \ 10-17 和图 10-13）。\n\n![images/468330_1_En_10_Fig13_HTML.jpg](img/468330_1_En_10_Fig13_HTML.jpg)\n\
  \n图 10-13\n\n与《玩具总动员》（1995）余弦距离最短的电影\n\n```\ndistances_to_movie = []\nfor other_movies\
  \ in mat.T:\ndistances_to_movie.append(scipy.spatial.distance.cosine(movie_toy_story,\
  \ other_movies.tolist()))\n# 创建包含电影及其与《玩具总动员》距离分数的数据框\ndistances_to_movie = pd.DataFrame({'movie':movies_df['title'],'distance':distances_to_movie})\n\
  # 按距离升序排序（即最接近 movie_toy_story）\ndistances_to_movie = distances_to_movie.sort_values('distance')\n\
  distances_to_movie.head(10)\n列表 10-17\n获取相似电影\n```\n\n余弦距离将《玩具总动员》与“**玩具总动员 2**”以及其他家庭电影关联起来。有趣的是，余弦距离得出的列表与欧几里得距离不同。\n\
  \n\n\n## 奇异值分解\n\n你可以使用任何一种介绍过的距离方法轻松构建一个协同过滤系统，但它无法扩展到更大的数据集，无法处理稀疏数据，也无法应对冷启动问题（即用户/电影交叉数据很少或没有的情况）。像\
  \ SVD 这样的模型旨在通过使用低秩近似来缓解其中一些问题，并具备在压缩数据上估计匹配的能力。^(⁴⁷)\n\n这绝非简单的内容，但简而言之，它试图减少数据量，让重要的主题和关联浮现出来，同时让噪声或异常值沉到底部。它会移除嘈杂和不规则的信息，从而构建出一幅更清晰的图谱，显示哪些内容适合哪里，哪些相近，哪些相远。SVD\
  \ 会将我们按类型和用户排列的电影评分矩阵分解为三个部分：一个用户矩阵、一个电影矩阵，以及一个表示两者关系的向量。然后，我们可以利用这个关系向量来匹配彼此接近的不同用户和评论，并收集周围的信息作为潜在推荐。SVD\
  \ 会返回一个表示用户特征空间的矩阵和另一个表示电影特征空间的矩阵。接着，我们应用点积运算来寻找相似性和推荐。\n\n此外，这并非旨在成为一门关于 SVD 具体细节的课程，因为它可能会变得很复杂。关于这个主题已经有很多博士论文，网络上也有数百个教程供那些希望深入探究的人参考。我还推荐本代码所基于的博客文章（[`https://beckernick.github.io/matrix-factorization-recommender/`](https://beckernick.github.io/matrix-factorization-recommender/)），以及一篇关于\
  \ SVD 实际应用的清晰简单示例：《傻瓜推荐引擎》（[`http://zwmiller.com/projects/simple_recommender.html`](http://zwmiller.com/projects/simple_recommender.html)）。\n\
  \n## 将用户评分中心化至零值附近\n\n由于这个数据集已经被研究了好几年，一些有趣的技巧已被证明是有效的，我们也将在此应用它们。我们将从每个用户的评分中减去其平均评分。这确保了所有用户都按比例缩放并围绕零值分布。如果一个用户的最高评分是\
  \ 5 分，最低评分是 3 分，而其他用户使用了整个评分范围，那么计算每个用户的平均分并从其评分中减去，将使两者具有可比性（代码清单 10-18）。\n\n```\n\
  user_ratings_mean = np.mean(ratings_mat, axis = 1)\nratings_mat_centered = ratings_mat\
  \ - user_ratings_mean.reshape(-1, 1)\n代码清单 10-18\n将所有评论中心化至均值附近\n```\n\n## 观察 SVD\
  \ 的实际应用\n\n让我们完成对 Jupyter notebook 中 SVD 代码的分析（如需跟随操作，请参考“**奇异值分解**”部分）。这是一个重要的部分，因为它代表了推荐引擎背后的核心逻辑。\n\
  \n我们做的第一件事是构建一个用户与已评分电影的矩阵（图 10-14）。在我们的案例中，这需要清理一些东西，比如重建电影 ID 使其从零开始，确保它们是连续且无间隔的，并重置评分\
  \ ID 也使其从零开始。\n\n![images/468330_1_En_10_Fig14_HTML.jpg](img/468330_1_En_10_Fig14_HTML.jpg)\n\
  \n图 10-14\n\n非常重要的“**用户**”对“**已评分电影**”矩阵\n\n让我们的推荐器处理新数据的一种方法是将访问者的电影品味作为一个新的“**UserId**”添加到矩阵中。然后，我们使用“**压缩稀疏行矩阵**”函数“**sps.csr_matrix()**”重建矩阵，该函数会将矩阵转换为\
  \ SVD 友好的格式，同时考虑新访问者的信息（代码清单 10-19）。\n\n```\n# 创建一个新的用户 ID - 在当前最大 ID 上加 1\nnew_user_id\
  \ = np.max(ratings_df_cp['userId']) + 1\n# 将电影偏好添加到矩阵中，并为所有电影分配 5 星评分\nnew_user_movie_ids\
  \ = user_history_movie_ids\nnew_user_ratings = [5] * len(new_user_movie_ids)\n#\
  \ 将索引设置为以 userId 和 movieId 为多级索引\nratings_df_cp.set_index(['userId', 'movieId'],\
  \ inplace=True)\n# 将新的电影评分作为 pandas 序列添加，并在 ratings_df_cp 末尾插入新行\nfor idx in range(len(new_user_movie_ids)):\n\
  row_to_append = pd.Series([new_user_ratings[idx]])\ncols = ['rating']\nratings_df_cp.loc[(new_user_id,\
  \ new_user_movie_ids[idx]), cols] =         row_to_append.values\n# 创建新的评分矩阵\nratings_matrix_plus\
  \ = sps.csr_matrix((ratings_df_cp.rating,\n(ratings_df_cp.index.labels[0], ratings_df_cp.index.labels[1]))).todense()\n\
  代码清单 10-19\n为我们的新用户获取推荐\n```\n\n然后，我们将矩阵发送到“**GetSparseSVD**”函数，该函数执行矩阵分解，并返回三个矩阵，用于计算新用户与其他兴趣相似用户的点积。这使用了稀疏线性代数\
  \ SVDS 库“**scipy.sparse.linalg.svds**”，它在处理包含大量零值的大型矩阵方面表现出色（大多数人只看过少数电影，所以当你构建用户对电影的矩阵时，大多数单元格是空白的；代码清单\
  \ 10-20）。\n\n```\nUa, sigma, Vt = GetSparseSVD(ratings_matrix_centered, K=50)\n\
  all_user_predicted_ratings = np.dot(np.dot(Ua, sigma), Vt) + user_ratings_mean.reshape(-1,\
  \ 1)\n代码清单 10-20\n获取 SVD\n```\n\n我们对返回的矩阵（本例中为 Ua 和 sigma）运行点积运算，并将所有内容打包到一个名为“**predictions_df**”的数据框中。这些数据利用了\
  \ SVD 的魔力，将用户及其兴趣组织到不同的维度中（代码清单 10-21 和图 10-15）。\n\n![images/468330_1_En_10_Fig15_HTML.jpg](img/468330_1_En_10_Fig15_HTML.jpg)\n\
  \n图 10-15\n\n点积矩阵输出，在多个维度上按相似性组织用户\n\n```\npredictions_df = pd.DataFrame(all_user_predicted_ratings,\
  \ columns = movies_df.index)\npredictions_df.head()\n代码清单 10-21\n查看点积矩阵的“head()”\n\
  ```\n\n我当然不会假装理解这些分组背后的逻辑，但它确实有效，所以我会信任 SVD，并建议你也这样做。\n\n为新用户获取推荐的最后阶段是，仅从“**predictions_df**”中提取该用户的\
  \ SVD 点积数据，然后附加电影信息，并简单地挑选少量该用户尚未看过的新电影。例如，假设我们的新用户非常喜欢以下三部剧情/战争片（图 10-16）。\n\n\
  ![images/468330_1_En_10_Fig16_HTML.jpg](img/468330_1_En_10_Fig16_HTML.jpg)\n\n图\
  \ 10-16\n\n我们用户的偏好\n\n我们将这个新用户的选择作为一个新用户添加到我们的“**用户**”对“**已评分电影**”矩阵中，并为这三个选择赋予高评分。然后，我们运行\
  \ SVD 并提取这个新用户的预测结果（图 10-17）。\n\n![images/468330_1_En_10_Fig17_HTML.jpg](img/468330_1_En_10_Fig17_HTML.jpg)\n\
  \n图 10-17\n\n为新用户排序后的推荐结果\n\n显然，我们不会向这个用户推荐“**辛德勒的名单**”，因为这是他们已经看过的电影；相反，我们推荐“**阿甘正传**”、“**拯救大兵瑞恩**”和“**肖申克的救赎**”。好了，代码部分就到这里；让我们来构建这个系统吧！\n\
  \n\n\n## 在本地下载并运行“接下来看什么？”代码\n\n让我们下载第 10 章的文件夹，如果尚未解压，请在本地机器上解压。你需要将之前创建的 CSV 文件“**movies.csv**”和“**ratings.csv**”复制到\
  \ Web 应用文件的根目录中——即与 **main.py** 相同的文件夹内。你的“**web-application**”文件夹应包含如代码清单 10-22\
  \ 所示的文件。\n\n```\nweb-application\n├── appengine_config.py\n├── app.yaml\n├── main.py\n\
  ├── requirements.txt\n├── movies.csv\n├── ratings.csv\n├── static\n└──images\n├──\
  \ curtain-left.png\n└── curtain-right.png\n└──templates\n└── index.html\n代码清单 10-22\n\
  Web 应用文件\n```\n\n按照惯例，我们将启动一个虚拟环境来隔离 Python 库的安装（代码清单 10-23）。\n\n```\n$ python3\
  \ -m venv whattowatchnext\n$ source whattowatchnext/bin/activate\n代码清单 10-23\n启动虚拟环境\n\
  ```\n\n然后，通过运行“**pip install -r**”命令来安装所有必需的 Python 库（代码清单 10-24）。\n\n```\n$ pip3\
  \ install -r requirements.txt\n$ python3 main.py\n代码清单 10-24\n安装依赖并在本地运行网站\n```\n\
  \n你可以像在之前的练习中那样，在本地机器上运行该应用。打开一个命令行窗口，切换到“**web-application**”文件夹，然后运行之前执行过的相同命令（例如运行“**python3\
  \ main.py**”）。它应该会像图 10-18 中的截图所示。\n\n![images/468330_1_En_10_Fig18_HTML.jpg](img/468330_1_En_10_Fig18_HTML.jpg)\n\
  \n图 10-18\n\n“**接下来看什么？**”在本地运行\n\n## 这里发生了什么？\n\n让我们仔细看看 Flask Web 应用中一些有趣的地方。\n\
  \n## main.py\n\n我们来浏览一下“**main.py**”。在数据探索期间提取的电影类型被复制并硬编码为脚本中的一个常量列表。每次从数据中动态计算它并没有实际价值，因为它与历史数据绑定且不会改变（代码清单\
  \ 10-25）。\n\n```\nMOVIE_GENRES = [\"Action\", \"Adventure\", \"Animation\", \"Children\"\
  , \"Comedy\", \"Crime\",\n\"Documentary\", \"Drama\", \"Fantasy\", \"Film-Noir\"\
  , \"Horror\",\n\"IMAX\", \"Musical\", \"Mystery\", \"Romance\", \"Sci-Fi\", \"Thriller\"\
  ,\n\"War\", \"Western\"]\n代码清单 10-25\n硬编码电影类型\n```\n\n这个类型列表用于填充 Web 应用的第一个下拉框。该下拉框是页面上唯一预填充的字段，每当用户更改它时，它会自动用该类型的电影标题填充其他下拉框。这有助于聚焦应用并大幅减少可用选项的数量。\n\
  \n脚本包含四个便捷函数，它们在访问者与网站交互的不同阶段被调用。\n\n*   **GetMoviesByGenres (movies_df, genre)**\n\
  \    *   该函数会返回特定类型的所有电影及其 ID 的列表。每当用户更改“**Movie Genre**”下拉框时，它就会被调用。\n\n*   **GetSparseSVD\
  \ (ratings_centered_matrix, K)**\n    *   这是我们之前看过的 SVD 算法。它接收一个评分/电影 ID 矩阵和“**K**”（要计算的奇异值数量），并返回一个用户矩阵、一个表示两者关系的向量（对角矩阵）以及一个电影矩阵。\n\
  \n*   **GetRecommendedMovies (ratings_df, movies_df, user_history_movie_ids)**\n\
  \    *   这是一个关键函数，它接收评分和电影数据框，以及用户观看并喜欢的电影历史记录（用户从三个下拉框中选择的电影）。它会在评分数据框中追加几行新数据，这些数据包含访问者选择的电影以及最高评分（我们假设用户非常喜欢这些电影）。它会调用“**GetSparseSVD**”函数，并使用原始数据以及从访问者那里追加的新电影进行\
  \ SVD 分解。现在，既然我们知道了用户的电影品味，就可以通过点积从 SVD 中找到相似电影。该函数将返回前三名推荐电影。\n\n*   **GetWikipediaData\
  \ (title_name)**\n    *   该函数接收一个电影标题，将其传递给 Wikipedia API，并返回关于该电影的第一段文字以及与该电影关联的第一张图片（通常是电影海报）。\n\
  \n脚本还包含三个 Flask 特定的函数：\n\n*   **startup()**\n    *   “**startup()**”函数在 Flask 服务器启动时被调用——换句话说，它是一个构造函数。这是通过添加装饰器“**@app.before_first_request**”来实现的。它加载两个数据集：“**movies.csv**”和“**ratings.csv**”。然后，它像我们在探索性\
  \ Jupyter notebook 中所做的那样，通过移除未使用的“**movieId**”并重置所有索引从零开始来清理数据。\n\n*   **ready()**\n\
  \    *   “**ready()**”函数在页面首次加载、刷新或更改电影类型时被调用。该函数在首次调用时为“**index.html**”页面设置变量默认值。如果不是首次调用（即，通过类型值更改提交表单，并且“**request.method\
  \ == ‘POST’**”的“**if**”函数返回 true），该函数将保留用户设置的任何值，并通过调用“**GetMoviesByGenres()**”函数获取新的电影选择列表。它还会检查用户是否至少从三个下拉框中选择了至少一部电影，并将这些\
  \ ID 传递给“**GetRecommendedMovies()**”函数。这将返回三部新的电影推荐。排名第一的电影推荐会被传递给“**GetWikipediaData()**”函数，以获取该电影的描述片段和海报图片。\n\
  \n*   **background_process()**\n    *   此函数与“**index.html**”中的前端 AJAX 函数相关联。每当用户点击三部推荐电影链接之一时，它就会被调用。它获取电影名称并将其传递给“**GetWikipediaData()**”函数，就像“**ready()**”函数所做的那样。这会获取当前焦点电影的描述片段和海报图片。\n\
  \n\n\n## index.html\n\n让我们来看看“**index.html**”脚本（清单 10-26）中前端部分的一些有趣内容。\n\n```\n\
  $(document).on(\"click\", \"a\", function(){\nvar move_title = this.innerHTML;\n\
  $(this).text(move_title);\ndocument.getElementById(\"movie_poster\").innerHTML =\
  \ move_title;\nfetchdata(move_title);\n});\nfunction fetchdata(move_title)\n{\n\
  $.ajax({\ntype : \"GET\",\nurl:'{{ url_for('background_process') }}',\ndata:{ 'movie_title':\
  \ move_title},\nsuccess: function(data){\nupdate_dashboard(data.wiki_movie_description,\
  \ data.wiki_movie_poster);\n}\n});\n}\nfunction update_dashboard(wiki_movie_description,\
  \ wiki_movie_poster){\ndocument.getElementById('movie_description').innerHTML =\
  \ wiki_movie_description;\ndocument.getElementById('image_poster').src = wiki_movie_poster;\n\
  }\n\n清单 10-26\nJavaScript 端\n```\n\n我们有三个函数：\n\n*   **$(document).on(“click”, “a”…)**\n\
  \    *   该函数监听锚点标签，当被点击时，获取内部文本并将其传递给函数“**fetchdata()**”。\n*   **fetchdata(move_title)**\n\
  \    *   该函数使用 AJAX 向服务器发送 GET 请求，以获取来自维基百科的电影描述和电影海报，并将结果传递给函数“**update_dashboard()**”。\n\
  *   **update_dashboard(wiki_movie_description, wiki_movie_poster)**\n    *   该函数从函数“**fetchdata()**”获取结果，并用返回的内容替换\
  \ HTML 内容描述文本和电影海报。\n\n## 部署到 Google App Engine\n\n到目前为止，你应该对 Google Flexible App\
