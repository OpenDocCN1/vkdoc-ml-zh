  这将创建一个名为“**.ebextensions**”的新文件夹，并打开一个“**vi**”窗口，这是一个简单的文本编辑器。按“**i**”键从只读模式切换到“**插入**”模式，并在文档末尾粘贴以下行（本章文档文件夹中也包含此修复的文本文件）。读取此文件的过程非常挑剔；如果有多余的空格或制表符，它将失败。请密切关注部署过程中与该文件相关的任何错误，并相应处理。


