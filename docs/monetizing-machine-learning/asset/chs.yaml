  \ 。\n\n打开一个命令窗口，并在命令行上调用 Python 3 的“ **venv** ”函数来创建一个沙盒区域（列表 8 和 9 ）。\n\n```\n\
  $ python3 -m venv some_name\n列表 8\n创建 Python 虚拟环境\n```\n\n```\n$ source some_name/bin/activate\n\
  列表 9\n激活环境\n```\n\n完成后，你可以使用列表 10 中的命令停用你的虚拟环境。\n\n```\n$ deactivate\n列表 10\n停用虚拟环境\n\
  ```\n\n## 创建“requirements.txt”文件\n\n大多数云提供商使用“ **requirements.txt** ”文件来列出托管 Web\
