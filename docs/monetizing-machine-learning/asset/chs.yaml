  这个结果并不令人印象深刻，而且肯定不足以证明所有这些额外工作是值得的。让我们继续尝试其他技术。


  ### 尝试非线性模型


  作为最后的建模实验，让我们将虚拟化后的数据输入到 sklearn 的“**Gradient Boosting Regressor**”模型中。在 sklearn
  包中从一个模型切换到另一个模型非常简单，我们只需要在内存中加载相应的模型并更改两行代码即可（代码清单 2-19）。


