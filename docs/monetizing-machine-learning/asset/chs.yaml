  ### 从分类数据创建虚拟特征


  另一种值得尝试的方法是对分类数据进行虚拟化处理。这意味着为每个类别创建单独的列。以特征“**weathersit**”为例：它不是一个连续变量，而是一个任意类别。如果直接将其输入模型，模型会将其视为线性数值数据，但这在这种情况下并不合理；将“**雾与云**”加
  1 并不等于“**雪**”。通过创建四个新列：“**晴**”、“**雾**”、“**雪**”和“**雨**”，并为每个列分配一个二进制的真/假值，模型在处理“**weathersit**”时效果会更好。


  使用 Pandas 的“**get_dummies()**”函数可以轻松实现这一点。我们将代码抽象成一个函数，以便更容易地创建我们的 Web 应用程序（代码清单
  2-15）。


  ```

  def prepare_data_for_model(raw_dataframe,

  target_columns,

  drop_first = False,

  make_na_col = True):

  '
- '# 对所有分类字段进行虚拟化处理

  dataframe_dummy = pd.get_dummies(raw_dataframe, columns=target_columns, drop_first=drop_first,

  dummy_na=make_na_col)

  return (dataframe_dummy)

  代码清单 2-15

  抽象代码以创建虚拟数据

  ```


  这会将每个类别拆分到其自己的列中。在下面的代码片段中，我们要求对以下三列进行“**虚拟化**”处理：“**season**”、“**weekday**”和“**weathersit**”（代码清单
  2-16）。


  ```

  bike_df_model_ready = prepare_data_for_model(bike_df_model_ready,

  target_columns = [''season'', ''weekday'', ''weathersit''], drop_first = True)

