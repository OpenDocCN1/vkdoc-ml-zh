  \n## 处理不平衡类别\n\n参考葡萄酒质量直方图，我们看到大多数质量集中在 5、6 和 7 这几个桶中。这将使得预测边缘质量桶更具挑战性，因为模型无法从足够的案例中学习。对于关键的建模项目，您要么通过移除一些中间类别来平衡数据集，要么获取更多的边缘案例。在本章的\
  \ Jupyter notebook 中，您可以看到重新平衡的过程。\n\n另一种方法是移除较弱的特征。在某些情况下，弱特征会混淆模型，移除它们不仅可以提高分数，还能使模型运行更快。使用返回某种变量重要性的基于树的模型可以轻松实现这一点。您会得到一个按重要性降序排列的特征列表，然后尝试仅使用最佳特征来运行模型。您不断添加特征，直到分数不再提高，最终得到一组可以使用的良好特征（这被称为前向特征选择）。\n\
  \n让我们看看如果将所有类别的数据行数上限设为 500 会发生什么（清单 4-5 和图 4-3）。\n\n![images/468330_1_En_4_Fig3_HTML.jpg](img/468330_1_En_4_Fig3_HTML.jpg)\n\
  \n图 4-3\n\n设上限后的葡萄酒质量直方图\n\n```\nInput:\nwine_balanced_df['quality'].value_counts()\n\
  Output:\n7    500\n6    500\n5    500\n4    216\n8    193\n3     30\n9      5\n\
  Name: quality, dtype: int64\nListing 4-5\n设上限后葡萄酒质量的数值分布\n```\n\n这确实使中心类别变得平坦，但边缘类别仍然极度不平衡。更好的处理方法是重新分类质量类别。我们将它们归并为仅三个质量组。质量类别\
  \ 3、4、5 现在属于组 3，质量 6 保持不变，质量类别 7、8、9 属于组 9（图 4-4）。\n\n![images/468330_1_En_4_Fig4_HTML.png](img/468330_1_En_4_Fig4_HTML.png)\n\
  \n图 4-4\n\n简化的葡萄酒质量超级组\n\n本质上，我们创建了三个超级组：“**差**”、“**一般**”和“**好**”。应用这些新分组后，我们得到了一个更加平衡的分布（清单\
  \ 4-6 和图 4-5）。\n\n![images/468330_1_En_4_Fig5_HTML.jpg](img/468330_1_En_4_Fig5_HTML.jpg)\n\
  \n图 4-5\n\n较小桶集合中葡萄酒质量的直方图分布\n\n```\nInput:\nwine_df['quality'].value_counts()\n\
  Output:\n6    2836\n3    2384\n9    1277\nName: quality, dtype: int64\nListing 4-6\n\
  将葡萄酒质量聚合为三个组\n```\n\n当我们在直方图中绘制质量分组时，各个类别的平衡性要好得多，范围从 1200 到 2800。\n\n\n\n## 使用梯度提升分类器进行建模\n\
  \n改善不平衡数据集处理方式的另一种方法是使用能够应对此类数据的模型。一个非常流行的模型是 sklearn 中的“**梯度提升分类器**”，它是一种基于树的强大提升模型。该模型会创建多组树，并根据它们的预测能力进行优化。\n\
  \n要使用 sklearn 的 GradientBoostingClassifier 算法，如果你之前从未使用过“**scikit-learn**”和“**scipy**”，则需要先安装它们（请使用适合你操作系统和软件的安装工具）。为简化操作，你可以直接运行包含本章所有必要\
  \ Python 库的“**requirements_jupyter.txt**”文件。通过运行“**pip3**”命令即可快速安装（列表 4-7）。\n\n\
  ```\n$ pip3 install -r requirements_jupyter.txt\n列表 4-7\n安装运行笔记本所需的文件\n```\n\n我们使用\
  \ Pandas 的“**Categorical()**”函数将“**quality**”特征转换为分类类型。这样我们就可以使用该特征的“**cat.codes**”属性，而不是实际值。我们这样做是因为真实的品质类别是\
  \ 3-6-9，而通过使用“**cat.codes**”，我们将范围缩小到 0 到 2 之间。然后，我们使用 sklearn 的“**train_test_split**”函数（就像我们在上一章中所做的那样）将数据随机拆分为训练集和测试/验证集。如果你查看代码，我们会将“**test_size**”设置为\
  \ 0.2，这意味着我们将 20% 的数据分配用于测试，并使用“**random_state**”设置一个随机种子，以确保我们的数据拆分始终一致（列表 4-8）。\n\
  \n```\nfrom sklearn.model_selection import train_test_split\nwine_df['quality']\
  \ = pd.Categorical(wine_df['quality'])wine_df['quality_class'] = wine_df['quality'].cat.codes\n\
  outcome = 'quality_class'\noutcome_buckets = len(set(wine_df['quality_class']))\n\
  X_train, X_test, y_train, y_test = train_test_split(wine_df[features],\nwine_df[outcome],\
  \ test_size=0.2, random_state=42)\n列表 4-8\n准备我们的训练和测试数据集\n\n```\n\n现在，我们可以将训练数据输入到“**GradientBoostingClassifier**”中进行建模（列表\
  \ 4-9）。\n\n```\nfrom sklearn.ensemble import GradientBoostingClassifier\ngbm_model\
  \ = GradientBoostingClassifier(random_state=10, learning_rate=0.1, max_depth=10)\n\
  gbm_model.fit(X_train[features], y_train)\n列表 4-9\n使用 GBM 进行建模\n```\n\n从代码片段中可以看出，“**GradientBoostingClassifier**”接受各种参数，调整这些参数非常重要，这被称为超参数调优。\n\
  \n以下是调整 GBM 模型的一些关键参数（更多详细信息，请参阅 scikit-learn 帮助文档^(²⁰)）：\n\n*   **learning_rate：**\
  \ 学习率决定了每棵树的贡献程度。\n*   **n_estimators：** 要执行的提升阶段数量。\n*   **max_depth：** 回归估计器的最大深度。\n\
  *   **max_features：** 每次拆分时需要考虑的特征数量。\n*   **random_state：** 用于保证结果可复现的随机种子。\n\n\
  训练“**GradientBoostingClassifier**”模型的最佳方法是使用不同的参数设置多次运行。观察添加“**n_estimators**”参数是否会提高准确率，以及“**learning_rate**”或“**max_depth**”的增大或减小如何影响准确率。对于那些希望深入研究模型调优的人，还有许多额外的工具可以提供帮助，例如交叉验证、超参数调优器等。GradientBoostingClassifier\
  \ 最让我喜欢的一点是它速度非常快，并且能够处理相当大的数据集，因此你可以轻松编写自己的循环机制来尝试各种参数组合并比较准确率。\n\n有关更详细的 Python\
  \ API 参考，请参阅文档。^(²¹)\n\n### 评估模型\n\n如果你参考本章的 Jupyter 笔记本，你会看到在运行模型后，我们通过要求模型对样本外数据（即我们那\
  \ 20% 的测试数据块）预测葡萄酒品质来对其进行评估（列表 4-10）。这是一个需要记住的重要概念：模型从未见过测试数据，这使我们能够用一组全新的数据来评估模型的性能。\n\
  \n```\npreds = gbm_model.predict_proba(X_test)\n列表 4-10\n使用测试数据拆分进行预测\n```\n\n“**preds**”变量包含每行数据的三个概率列表，描述了该行属于每个葡萄酒品质类别的概率（这说起来有点拗口）。每行数据的概率之和为\
  \ 1。例如，让我们看看第一行数据的预测概率（列表 4-11）。\n\n```\n输入：\npreds[0]\n输出：\narray([0.50623207,\
  \ 0.48718144, 0.00658649])\n列表 4-11\n查看一种葡萄酒的预测结果\n```\n\n对于第 0 行的数据（即该特定葡萄酒的化学读数），模型预测索引号\
  \ 0 处的概率最高，为 0.56，因此属于品质类别“**3**”。这可以很容易地通过 NumPy 的“**argmax**”函数来实现，该函数用于获取列表中最大数字的索引，然后使用该索引位置获取类别编号（列表\
  \ 4-12）。\n\n```\n输入：\nprint('Argmax: %i' % np.argmax(preds[0]))\nprint('Quality\
  \ class: %i' % list(wine_df['quality'].cat.categories)[np.argmax(preds[0])])\n输出：\n\
  Argmax: 0\nQuality class: 3\n列表 4-12\n使用 NumPy 的“argmax()”函数获取数组中的最大值\n```\n\n我们可以对测试数据中的每一种葡萄酒都执行相同的操作，并使用\
  \ sklearn.metrics 的“**precision_score()**”函数将其与实际“**真实**”类别进行比较。该函数将返回一个介于 0 和 1\
  \ 之间的数字，其中 0 表示最差分数，1 表示最佳分数。在这种情况下，精确率比准确率更合适，因为我们讨论的不是一个平衡数据集的简单二元预测。相反，我们想知道模型在不平衡数据集上，针对特定葡萄酒在三个品质类别之间进行选择的准确程度——这绝非易事！（列表\
  \ 4-13）\n\n> *精确率是 tp / (tp + fp) 的比值，其中 tp 是真阳性数量，fp 是假阳性数量。直观上，精确率体现了分类器不将负样本标记为正样本的能力。*\
  \ ^(²²)\n\n```\n输入：\nfrom sklearn.metrics import precision_score\nbest_preds = np.asarray([np.argmax(line)\
  \ for line in preds])\nprint (\"Precision_score: %0.2f\" % precision_score(y_test,\
  \ best_preds, average=\"macro\"))\n输出：\nPrecision_score: 0.74\n列表 4-13\n获取每个预测品质类别的最高概率\n\
  ```\n\n另一种查看多类模型整体情况的有用方法是使用混淆矩阵。这将绘制一个大型方阵，显示模型的最佳预测结果与真实情况的对比（列表 4-14 和图 4-6）。在处理大量数据时，使用图形化的混淆矩阵而不是打印出来的矩阵会非常方便。生成这些图形矩阵的代码直接来自\
  \ scikit-learn.org 关于混淆矩阵的帮助文件。^(²³)\n\n![images/468330_1_En_4_Fig6_HTML.jpg](img/468330_1_En_4_Fig6_HTML.jpg)\n\
  \n图 4-6\n\n预测值与实际值的混淆矩阵\n\n```\nfrom sklearn.metrics import confusion_matrix\ncnf_matrix\
  \ = confusion_matrix(y_test, best_preds)\nplt.figure()\nplot_confusion_matrix(cnf_matrix,\
  \ classes=set(wine_df['quality']),\ntitle='Confusion matrix, without normalization')\n\
  plt.show()\n列表 4-14\n在混淆矩阵上显示的葡萄酒品质预测结果\n```\n\n\n\n花点时间分析这张图表是值得的。Y 轴代表真实值，X 轴代表来自\
  \ GradientBoostingClassifier 模型的最佳预测。\n\n在理想情况下，除了从图表左上角一直延伸到右下角的单条对角线外，所有数字都应为\
  \ 0。这意味着所有预测都是正确的（参见图 4-7 中虚构的图表）。\n\n![images/468330_1_En_4_Fig7_HTML.jpg](img/468330_1_En_4_Fig7_HTML.jpg)\n\
  \n图 4-7\n\n完美混淆矩阵的样子（如果你在真实模型中看到这种完美程度，请保持怀疑，因为建模永远不可能完美）\n\n我们模型的混淆矩阵告诉我们关于数据的一些有趣信息。首先，它的表现相当不错，因为从左上角到右下角的对角线确实包含了最大的数字。当数据偏离对角线（即预测错误）时，它仍然靠近其所属的组。这就是为什么模型预测为\
  \ 3 而实际是 9，或者模型预测为 9 而实际是 3 的边缘情况非常少。这可以看作是一种小小的安慰：每当预测错误时，错误可能不会太离谱，错误的预测最多只偏差到相邻的桶。\n\
  \n### 持久化模型\n\n在第 3 章中，我们 Web 应用程序的构造函数训练了模型（每当 Web 服务器重启时，它就会重新训练）。在这里，我们将预先训练模型，对其进行\
  \ pickle 序列化，并将其用作我们的建模引擎。你很少会遇到数据集和模型足够小，以至于可以直接在云端和 Web 服务器上训练的情况。大多数模型都很大，训练时间长，甚至需要特殊的硬件。通过保存一份完全训练好的模型副本，我们可以将其移动到任何需要的地方，并使其处于随时可预测的状态。如果你不熟悉\
  \ Python 术语“**Pickling**”，它是一种将对象以其当前状态保存到文件中的工具^(²⁴)。就像逗号分隔文件（CSV）用于移动数据一样，pickle\
  \ 文件用于移动 Python 对象。你可以 pickle 任何你想要的东西，包括训练好的模型。关于 Python 版本的说明：AWS Beanstalk 默认使用\
  \ Python 3.x，而 pickle 在 Python 2.x 和 3.x 版本之间存在兼容性问题，因此本章请坚持使用 Python 3.x。\n\n这被称为模型持久化，它应该在大多数生产场景中使用，我们也会在本书的大多数章节中使用这种方法（列表\
  \ 4-15）。\n\n```\nwith open('gbm_model_dump.p', 'wb') as f:\npickle.dump(gbm_model,\
  \ f, 2)\n列表 4-15\nPickle 序列化我们训练好的 GBM 模型\n```\n\n### 对新数据进行预测\n\n就像我们在上一章中所做的那样，我们需要确保能够运行模型并对新数据进行预测。这是构建交互式\
  \ Web 应用程序的重要一步，该应用程序的目标是基于用户输入的数据提供新的预测。\n\n首先，我们计算每个特征的平均值，并使用这些值来预测葡萄酒的质量（列表\
  \ 4-16）。\n\n```\nfixed_acidity = 7.215307\nvolatile_acidity = 0.339666\ncitric_acid\
  \ = 0.318633\nresidual_sugar = 5.443235\nchlorides = 0.056034\nfree_sulfur_dioxide\
  \ = 30.525319\ntotal_sulfur_dioxide = 115.744574\ndensity = 0.994697\npH = 3.218501\n\
  sulphates = 0.531268\nalcohol = 10.491801\ncolor = 0\n"
- '# 创建新数据集

  x_test_tmp = pd.DataFrame([[fixed_acidity,

  volatile_acidity,

  citric_acid,

  residual_sugar,

  chlorides,

  free_sulfur_dioxide,

  total_sulfur_dioxide,

  density,

  pH,

  sulphates,

  alcohol,

  color]], columns = X_test.columns.values)

  列表 4-16

  获取每个特征的平均值并存储在数据框中

  ```


  在创建了一个新的数据框来存储自定义的葡萄酒化学读数后，我们将其传递给模型的“**predict**”函数。我们可以添加任何结果变量，因为模型在进行预测时会忽略它（列表
  4-17）。


