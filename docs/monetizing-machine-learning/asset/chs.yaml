  1-42）。


  ```

  runtime: python27

  api_version: 1

  threadsafe: true

  handlers:

  - url: /static

  static_dir: static

  - url: /.*

  script: blank.app

  - url: /favicon.ico

  static_files: static/images/favicon.ico

  upload: static/images/favicon.ico

  libraries:

  - name: ssl

  version: latest

  列表 1-42

  将 Yaml 文件指向一个空白脚本

  ```


  按 Escape 键退出插入模式，然后输入“**wq**”保存并退出。然后重新部署你的 Web 应用程序（列表 1-43）。


