  \ Matplotlib 的最后一个实验，我们可以创建一个犯罪热力图（清单 6-16 和图 6-14）。\n\n![images/468330_1_En_6_Fig14_HTML.jpg](img/468330_1_En_6_Fig14_HTML.jpg)\n\
  \n图 6-14\n\n报告犯罪的热力图；显然，最亮的区域位于旧金山的东北部\n\n```\nfrom matplotlib.colors import LogNorm\n\
  x = np.round(crime_df['Longitude'].head(10000),rounding_factor)\ny = np.round(crime_df['Latitude'].head(10000),rounding_factor)\n\
  fig = plt.figure()\nplt.suptitle('报告犯罪热力图')\nplt.xlabel('纬度')\nplt.ylabel('经度')\n\
  H, xedges, yedges, img = plt.hist2d(x, y, norm=LogNorm())\nextent = [yedges[0],\
  \ yedges[-1], xedges[0], xedges[-1]]\n清单 6-16\n尝试热力图\n```\n\n## 用过去预测未来\n\n我们将把迄今为止创建的基本特征聚合到一个通用的、基于时间的表示中。让我们来看一下（清单\
  \ 6-17 和图 6-15）。\n\n![images/468330_1_En_6_Fig15_HTML.jpg](img/468330_1_En_6_Fig15_HTML.jpg)\n\
  \n图 6-15\n\n查看我们将输入到 Web 应用程序中的数据\n\n```\ncrime_df = crime_df[['CAT', 'Day_of_month','Month_of_year',\
  \ 'Day_Segment', 'Longitude', 'Latitude']]\ncrime_df.head()\n清单 6-17\n将数据缩减至仅保留基本特征\n\
  ```\n\n数据包含一个通用的位置部分（经度和纬度），以及一个通用的基于时间的部分（月份、日期、时段）。我们需要将这些信息聚合到时间和位置层面。这将使我们能够汇总报告，并根据某个时间段内的报告数量构建强度图。\n\
  \n我们首先添加一个“**Count**”特征，并应用方便的 Pandas “**groupby()**”函数（清单 6-18 和图 6-16）。\n\n![images/468330_1_En_6_Fig16_HTML.jpg](img/468330_1_En_6_Fig16_HTML.jpg)\n\
  \n图 6-16\n\n信息聚合到时间和位置层面\n\n```\ncrime_df['Count'] = 0\ncrime_df_agg = crime_df.groupby(['CAT',\
  \ 'Day_of_month', 'Month_of_year',  'Day_Segment', 'Longitude',  'Latitude',]).count().reset_index()\n\
  crime_df_agg.tail()\n清单 6-18\n按时间和位置聚合信息\n```\n\n现在，我们可以查询特定的日期特征，并获取每个位置的所有报告犯罪（清单\
  \ 6-19 和图 6-17）。\n\n![images/468330_1_En_6_Fig17_HTML.jpg](img/468330_1_En_6_Fig17_HTML.jpg)\n\
  \n图 6-17\n\n按日期特征聚合的信息\n\n```\nDay_of_month = 1\nMonth_of_year = 1\nDay_Segment\
  \ = 1\ncrime_df_agg_tmp = crime_df_agg[(crime_df_agg['Day_of_month'] == Day_of_month)\
  \ &\n(crime_df_agg['Month_of_year'] == Month_of_year) &\n(crime_df_agg['Day_Segment']\
  \ == Day_Segment)]\ncrime_df_agg_tmp.head()\n清单 6-19\n按日期特征聚合的信息\n```\n\n我们也可以绘制这些信息（图\
  \ 6-18）。\n\n![images/468330_1_En_6_Fig18_HTML.jpg](img/468330_1_En_6_Fig18_HTML.jpg)\n\
  \n图 6-18\n\n1 月 1 日夜间按经度和纬度估算的犯罪情况\n\n这张图表没有区分计数强度；让我们来改进一下。我们将从 Matplotlib 的“**plot()**”切换到“**scatter()**”，并使用“**s**”或大小参数（清单\
  \ 6-20 和图 6-19）。\n\n![images/468330_1_En_6_Fig19_HTML.jpg](img/468330_1_En_6_Fig19_HTML.jpg)\n\
  \n图 6-19\n\n使用 Matplotlib 的散点函数绘图，并传递“**Count**”特征来调整 1 月 1 日夜间点的尺寸\n\n```\nplt.scatter(crime_df_agg_tmp['Longitude'],\n\
  crime_df_agg_tmp['Latitude'], s=crime_df_agg_tmp['Count'])\nplt.suptitle(title)\n\
  plt.xlabel('经度')\nplt.ylabel('纬度')\nplt.show()\n清单 6-20\n使用点大小绘制的犯罪数据散点图\n```\n\n\
  为了更全面地展示，让我们再调出一个完全不同的时间点（图 6-20）。\n\n![images/468330_1_En_6_Fig20_HTML.jpg](img/468330_1_En_6_Fig20_HTML.jpg)\n\
  \n图 6-20\n\n查看 6 月 6 日上午报告犯罪的聚合数据\n\n总结一下我们的快速估算，1 月 1 日夜间报告的犯罪数量多于 6 月 6 日上午。\n\
  \n## Google Maps 简介\n\n如果说有一个强大且易于定制的可视化工具，那非 Google Maps 莫属！让我们换个思路，尝试使用 Google\
  \ Maps 而不是普通的 Matplotlib 来处理我们的数据。对于这部分内容以及让 Web 应用程序正常工作，你需要在 [`https://developers.google.com/maps/documentation/javascript/get-api-key`](https://developers.google.com/maps/documentation/javascript/get-api-key)\
  \ 创建一个免费的 Google Maps API 密钥。\n\n过去，没有 API 密钥也能使用 Google Maps，但现在你必须要有它。对于适度使用，免费层级就足够了。\n\
  \n所以，获取密钥并尝试这个简单的示例：输入一个地址和 API 密钥，以获取关于该位置的各种相关信息。在浏览器中输入以下地址和 URL 链接：“**1600 Amphitheatre\
  \ Parkway, Mountain View, CA**”（清单 6-21）。\n\n```\n输入:\nhttps://maps.googleapis.com/maps/api/geocode/xml?address=1600+Amphitheatre+Parkway,+Mountain+View,+CA&key=>\n\
  输出:\n\nOK\n\npremise\n\nGoogle Building 41, 1600 Amphitheatre Pkwy, Mountain View,\
  \ CA 94043, USA\n\n...\n\n37.4224082\n-122.0856086\n\n...\n清单 6-21\n如果你的 API 密钥有效且\
  \ URL 格式正确，你应该会看到包含类似数据的较长 XML 响应\n```\n\n\n\n### 热力图图层\n\n热力图是一种通过强度来可视化信息的方式。这是一种非常实用的工具，可以叠加在地图上，因为它能显示哪些地方事件发生频繁，哪些地方发生较少——非常适合用于报告犯罪情况！\n\
  \n关于在谷歌地图上创建热力图的一个绝佳示例（图 6-21），请查看谷歌官方文档中的谷歌地图 API 示例：[`https://developers.google.com/maps/documentation/javascript/examples/layer-heatmap`](https://developers.google.com/maps/documentation/javascript/examples/layer-heatmap)。\n\
  \n![images/468330_1_En_6_Fig21_HTML.jpg](img/468330_1_En_6_Fig21_HTML.jpg)\n\n图\
  \ 6-21\n\n来自谷歌地图 API 的示例脚本；你需要一个 API 密钥才能使用\n\n## 谷歌地图与犯罪数据\n\n让我们将犯罪数据注入到谷歌地图中。首先，我们需要了解\
  \ HTML 页面上的 JavaScript 中谷歌地图“**LatLng**”函数所期望的格式（列表 6-22）。\n\n```\nfunction getPoints()\
  \ {\nreturn [\nnew google.maps.LatLng(37.782551, -122.445368),\nnew google.maps.LatLng(37.782745,\
  \ -122.444586),\n...\n];}\n\n列表 6-22\n“getPoints()” JavaScript 函数\n```\n\n因此，我们需要从“**crime_df_agg_tmp**”中提取纬度和经度，并将其格式化为谷歌地图所期望的正确格式。然后，我们将每个坐标连接成一个长字符串，以便使用\
  \ Flask 将其传递到 HTML 脚本中（列表 6-23）。\n\n```\nLatLngString = \"\nfor index, row in crime_df_agg_tmp.iterrows():\n\
  LatLngString += \"new google.maps.LatLng(\" + str(row['Latitude']) + \",\" + str(row['Longitude'])\
  \ + \"),\"\n列表 6-23\n在循环中创建新的谷歌地图“LatLng()”对象\n```\n\n举个例子，我手动将“**LatLngString**”的输出粘贴到了一个示例\
  \ HTML 页面中，结果如下（图 6-22）。\n\n![images/468330_1_En_6_Fig22_HTML.jpg](img/468330_1_En_6_Fig22_HTML.jpg)\n\
  \n图 6-22\n\n绘制在谷歌地图上的一些旧金山犯罪数据\n\n## 抽象化我们的犯罪预估器\n\n像往常一样，我们需要以简洁明了的方式组织 Web 应用程序的引擎，以便将其放入我们的主\
  \ Flask 脚本中。我们将创建“**GetCrimeEstimates()**”函数，该函数将接收一个日期和“**time_segment**”（表示是早晨、下午还是晚上；列表\
  \ 6-24）。\n\n```\ndef GetCrimeEstimates(horizon_date, horizon_time_segment):\nDay_of_month\
  \ = int(horizon_date.split('/')[1])\nMonth_of_year = int(horizon_date.split('/')[0])\n\
  Day_Segment = int(horizon_time_segment) # 0,1,2\ncrime_horizon_df_tmp = crime_horizon_df[\n\
  (crime_horizon_df['Day_of_month'] == Day_of_month) &\n(crime_horizon_df['Month_of_year']\
  \ == Month_of_year) &\n(crime_horizon_df['Day_Segment'] == Day_Segment)]\n# 为谷歌地图构建\
  \ latlng 字符串\nLatLngString = \"\nfor index, row in crime_horizon_df_tmp.iterrows():\n\
  LatLngString += \"new google.maps.LatLng(\" + str(row['Latitude']) + \",\" + str(row['Longitude'])\
  \ + \"),\"\nreturn (LatLngString)\n列表 6-24\n“GetCrimeEstimates()” 函数\n```\n\n“`GetCrimeEstimates()`”是应用程序的核心。它接收用户通过\
  \ Web 应用程序上的滑块选择的日期以及时间段，并返回该日期所有聚合后的犯罪数据。\n\n例如，当调用“**GetCrimeEstimates()**”时，我们会得到一个由“**google.maps.LatLng**”坐标连接而成的字符串，这些坐标已准备好输入到谷歌地图中（列表\
  \ 6-25）。\n\n```\n输入:\nGetCrime('10/10/2018', 0)\n输出:\nnew google.maps.LatLng(37.764,-122.508),\n\
  new google.maps.LatLng(37.781,-122.49),\nnew google.maps.LatLng(37.711,-122.469),\n\
  new google.maps.LatLng(37.764,-122.46700000000001),\nnew google.maps.LatLng(37.763000000000005,-122.464),\n\
  ...\n列表 6-25\n调用“GetCrimeEstimates()”\n```\n\n## 设计一个 Web 应用程序，让用户能够输入未来日期并可视化犯罪热点\n\
  \n请继续下载本章 Web 应用程序的代码。打开一个命令行窗口，并将驱动器切换到“**web-application**”文件夹。它应包含以下文件（列表 6-26）。\n\
  \n```\nweb-application\n├── main.py\n├── ptvs_virtualenv_proxy.py\n├── requirements.txt\n\
  ├── web.3.4.config\n├── static\n├── sf-crime-horizon.csv\n└── images\n├── cop.jpg\n\
  ├── thief.jpg\n├── morning.jpg\n├── afternoon.jpg\n└── night.jpg\n└── templates\n\
  └── index.html\n列表 6-26\nWeb 应用程序文件\n```\n\n像往常一样，我们将启动一个虚拟环境来隔离我们的 Python 库安装（列表\
  \ 6-27）。\n\n```\n$ python3 -m venv predictingcrimeinsanfrancisco\n$ source predictingcrimeinsanfrancisco/bin/activate\n\
  列表 6-27\n启动虚拟环境\n```\n\n然后，通过运行“**pip3 install -r**”命令来安装所有必需的 Python 库（列表 6-28）。\n\
  \n```\n$ pip3 install -r requirements.txt\n列表 6-28\n代码输入\n```\n\n### 添加你的 Google\
  \ API 密钥\n\n在编辑器中，打开文件“**index.html**”，并在写着“**ADD_YOUR_API_KEY_HERE**”的地方添加你自己的\
  \ API 密钥。你需要更新代码才能看到谷歌地图，否则会收到错误消息。\n\n### 运行测试\n\n像往常一样，在本地 Flask 实例上运行该网站进行测试（列表\
  \ 6-29）。\n\n```\n$ python3 main.py\n列表 6-29\n代码输入\n```\n\n如果一切顺利，你应该会看到一个带有可用谷歌地图的\
  \ Web 应用程序。继续运行测试，查看未来日期的犯罪预测（图 6-23）。\n\n![images/468330_1_En_6_Fig23_HTML.jpg](img/468330_1_En_6_Fig23_HTML.jpg)\n\
  \n图 6-23\n\n运行我们 Web 应用程序的本地版本\n\n\n\n## 适用于 Azure 的 Git\n\n初始化一个 Git 会话（清单 6-30）。\n\
  \n```\n$ git init\n清单 6-30\n初始化 Git\n```\n\n在整个过程中多次运行“**git status**”是一个好主意，以确保你正在跟踪正确的文件（清单\
  \ 6-31）。\n\n```\n输入:\n$ git status\n输出:\n未跟踪的文件:\n  (使用 \"git add <文件>...\" 以包含要提交的内容)\n\
  \tmain.py\n\tpredictingcrimeinsanfrancisco/\n\tptvs_virtualenv_proxy.py\n\trequirements.txt\n\
  \tsf-crime-horizon.csv\n\tstatic/\n\ttemplates/\n\tweb.3.4.config\n清单 6-31\n运行 “git\
