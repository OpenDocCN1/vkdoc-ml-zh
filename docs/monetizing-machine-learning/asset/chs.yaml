  ### 创建表


  让我们使用“**CREATE TABLE**”语句创建一个新表。每当创建新表时，最好先将其删除，否则会收到错误提示（但请确保你真的想删除它，因为你会丢失其中包含的所有数据）。我们将创建一个名为“**tblFrontPageOptions**”的表，其中包含一个名为“**uuid**”的唯一标识符字段、一个名为“**liked**”的布尔标志（用于记录用户是否点击了“赞”）、一个用于标记页面是“**A**”还是“**B**”的
  page_id 字段，以及一个自动生成的时间戳字段（清单 14-8）。


  ```

  mysql> DROP TABLE ABTesting.tblFrontPageOptions;

  mysql> CREATE TABLE ABTesting.tblFrontPageOptions (

  uuid VARCHAR(40) NOT NULL,

  liked BOOLEAN NOT NULL DEFAULT 0,

  pageid INT NOT NULL,

  time_stamp  TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP);

