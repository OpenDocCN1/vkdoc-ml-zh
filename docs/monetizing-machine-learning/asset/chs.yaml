  ## 运行已保存的 TensorFlow 模型


  这种实例化已训练模型的能力是应用建模和构建商业流程的重要方面。我们在此开发的模型训练时间并不长（根据你使用的步数，大约 2 到 30 分钟），但如果每次请求都要重新训练，没有用户愿意在网页上等待那么久。好消息是，保存和重新加载已训练模型很容易。关键在于在退出
  TensorFlow 会话之前调用“**tf.train.Saver**”的“**save()**”函数（列表 8-17）。


  ```

  输入：

  saver = tf.train.Saver()

  save_path = saver.save(sess, save_file)

  print ("Model saved in file: ", save_path)

  输出：

  Model saved in file:  /Users/manuel/apress-book-repository/chapter-8/model.ckpt

  列表 8-17

  保存模型

  ```


  下次你想运行已训练模型时，只需设置所有图变量，并在 TensorFlow 会话中调用“**tf.train.Saver**”的“**restore()**”函数即可（列表
  8-18）。


  ```

  输入：

  saver = tf.train.Saver()

  with tf.Session() as sess:

  sess.run(tf.global_variables_initializer())

  saver.restore(sess, save_file)

  print("Model restored.")

  输出：

  INFO:tensorflow:Restoring parameters from /Users/manuel/apress-book-repository/chapter-8/model.ckpt

  Model restored.

  列表 8-18

  恢复已保存的模型

  ```


