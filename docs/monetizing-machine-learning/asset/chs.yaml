  ）。他们建议获取“**可发布密钥**”和“**秘密密钥**”，并将它们创建为操作系统变量，这样你就不必硬编码它们（这是一个很好的做法）。在 Mac 上使用终端中的“**export**”命令，在
  Windows 上使用控制面板，或者直接将变量添加到 Flask 中（清单 15-10）。


