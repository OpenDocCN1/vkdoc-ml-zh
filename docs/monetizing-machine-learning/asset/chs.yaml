  ## 计算交易股数


  您希望以等额美元的多头和空头头寸进入市场。换句话说，您希望实现美元中性（当然，在预算较小或股票交易价格较高的情况下，这会更难实现）。


  您需要设定一个预算值，即您愿意用于交易的总金额（虽然在此用例中我指的是美元，但可以替换为任何其他货币）。在本例中，我们使用 10,000 美元（清单 5-11）。


  ```

  trading_budget = 10000

  清单 5-11

  设定交易预算

  ```


  由于我们处理的是美元金额，我们需要使用实际的股票价格，而不是百分比变化和累计总和。我们将继续使用“**BA**”和“**MMM**”（清单 5-12）。


  ```

  输入：

  short_symbol = strongest_symbol[0]

  short_last_close = stock_data[strongest_symbol[0]][-1]

  print(''最强股票 %s，最新价格：$%f'' % (strongest_symbol[0], short_last_close))

  long_symbol = weakest_symbol[0]

  long_last_close = stock_data[weakest_symbol[0]][-1]

  print(''最弱股票 %s，最新价格：$%f'' % (weakest_symbol[0], long_last_close))

  输出：

  最强股票 BA，最新价格：$327.440002

  最弱股票 MMM，最新价格：$217.559998

  清单 5-12

  获取两只推荐股票的最新交易价格

  ```


  现在，我们应用交易预算，并计算出每种股票可以交易多少股。公式很简单，就是将预算的一半除以股票价格（清单 5-13 和清单 5-14）。


  ```

  输入：

  print(''对于 %s，价格为 $%f，您需要做空 %i 股'' %

  (short_symbol, short_last_close, (trading_budget * 0.5) / short_last_close ))

  输出：

  对于 BA，价格为 $327.440002，您需要做空 15 股

  清单 5-13

  获取第一只推荐股票的最新交易价格

  ```


  ```

  输入：

  print(''对于 %s，价格为 $%f，您需要买入 %i 股'' %

  (long_symbol, long_last_close, (trading_budget * 0.5) / long_last_clse ))

  输出：

  对于 MMM，价格为 $217.559998，您需要买入 22 股

  清单 5-14

  获取第二只推荐股票的最新交易价格

  ```


  因此，为了进行美元中性的配对交易，我们需要做空 15 股“**BA**”并买入 22 股“**MMM**”。这应该说得通，因为 327 乘以 15 大约是 5,000
  美元，而 217 乘以 22 也大约是 5,000 美元。


