  它会将文件（本例中名为“**Archive.zip**”）上传到根目录，因此你需要将其移动到“**GoogleCloudFlaskIntro**”文件夹中并解压（列表
  1-34）。


  ```

  $ mv ../Archive.zip Archive.zip

  $ unzip Archive.zip

  列表 1-34

  移动并解压 Web 应用程序文件

  ```


  运行“**pip install -t lib**”命令，安装“**requirements.txt**”文件中的所有库（列表 1-35）。这将创建必要的“**lib**”文件夹，其中包含所有需要的
  Python 库（如果不使用“**sudo**”获取 root 权限，可能会收到一些警告，但请勿滥用权限！）。


  ```

  $ sudo pip3 install -t lib -r requirements.txt

  列表 1-35

  用必要的 Python 库填充 lib 目录


  此时，如果你运行“**ls**”命令，云中的文件夹目录应如下所示（列表 1-36）。


  ```

  输入：

