  现在我们来到了本章有趣的部分；我们要设计自己的 Web 应用程序！我们将保持一切极其简单。这旨在有趣且直观，通过将按钮和选项保持在最少，让我们的访问者能够立即理解并与之交互。我们将在中间添加一个中央画布，以便访问者可以绘制一个介于“**0**”和“**9**”之间的数字，以及两个按钮：一个用于预测数字，另一个用于清除画布。最后，我们还将添加一个下拉菜单来控制画笔的粗细——仅此而已！


