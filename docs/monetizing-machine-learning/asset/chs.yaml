  ## TensorFlow


  TensorFlow 是一个由 Google 的友好人士提供的开源库，专为高性能数值计算而设计。它使用数据流图来表示数学运算，这些运算可以轻松地在本地或分布式设备上计算。它具有丰富的功能，可用于计算、数值处理以及从常规到深度的建模。它于
  2015 年 11 月在 Apache 2.0 开源许可证下发布。


  关于这个主题的资料非常多，我不会重复讨论，而是直接切入我们手头的任务：对手写数字进行建模！所以，如果你还没有做的话，请继续将本章的文件下载到一个名为“**chapter-8**”的文件夹中。打开
  Jupyter notebook 跟随操作。


  ## 使用 TensorFlow 和卷积网络进行建模


  MNIST 数据集可能已经被地球上所有的模型建模过^(⁴⁰)，但一个强大且相对易于使用的模型是卷积网络，称为“**CNN**”或“**Covnets**”。这是一种极其强大的方法，可以根据你的需求变得简单或复杂。它们最初是为图像建模而设计的，但后来被证明在自然语言处理和时间序列建模等其他许多领域也非常有用。我们将利用
  TensorFlow 教程套件中的代码，该教程名为：“**面向专家的深度 MNIST**”。^(⁴¹) 这不是他们提供的最简单的模型，但它仍然被认为是一个入门级的方法。


  该模型在手写数字分类上达到了惊人的 99% 的准确率。当我们将其与 Yann LeCun 在这个数据集上的历程进行对比时，这一点就更加有趣了。他是视觉建模和卷积神经网络之父之一，也是
  Facebook 的 AI 研究总监。他在几十年的时间里对这个数据进行了基准测试，并致力于将建模识别准确率从 12% 提高到仅剩百分之零点几的误差。更令人难以置信的是，如今我们可以打开一个关于这个主题的教程，用不到
  50 行代码就能获得这个惊人的分数。


  让我们简要了解一下我们将用于此 Web 应用程序的模型。以下是该教程的一些要点（更多详情请参阅完整教程，网址为 [`https://www.tensorflow.org/versions/r1.1/get_started/mnist/pros`](https://www.tensorflow.org/versions/r1.1/get_started/mnist/pros)）。


  ### 占位符 (tf.placeholder)


  这些是图像和标签数据流的通道。这是 TensorFlow 中的一个重要概念，即在向图中输入任何实际数据之前，先构建一个功能图（清单 8-6）。


  ```

  x = tf.placeholder(tf.float32, shape=[None, 784])

  y_ = tf.placeholder(tf.float32, shape=[None, 10])

  清单 8-6

  代码输入

  ```


  **变量 (tf.Variable)**


  变量用于保存值，你可以用实际值初始化它们（清单 8-7）。


  ```

  def weight_variable(shape):

  initial = tf.truncated_normal(shape, stddev=0.1)

  return tf.Variable(initial)

  清单 8-7

  函数 “weight_variable()”

  ```


  ### 构建建模层


  我们可以将专门的网络层定义为函数，并根据神经网络的复杂程度，根据需要多次重用它们（清单 8-8）。


  ```

  def conv2d(x, W):

  return tf.nn.conv2d(x, W, strides=[1, 1, 1, 1], padding="SAME")

  def max_pool_2x2(x):

  return tf.nn.max_pool(x, ksize=[1, 2, 2, 1],

  strides=[1, 2, 2, 1], padding="SAME")

  清单 8-8

  抽象函数 “conv2d()” 和 “max_pool_2x2()”。

  ```


  然后，我们可以通过调用 conv2d() 和 max_pool_2x2() 来创建任意数量的层（清单 8-9）。


  ```

  h_conv1 = tf.nn.relu(conv2d(x_image, W_conv1) + b_conv1)

  h_pool1 = max_pool_2x2(h_conv1)

  清单 8-9

  创建层

  ```


  ### 损失函数


  原始教程模型使用“**tf.nn.softmax_cross_entropy_with_logits()**”函数，这个名称有点长。Softmax 返回一个在
  *n* 个类别上的概率分布，其总和为 1，而交叉熵处理来自不同分布的数据（清单 8-10）。


  ```

  cross_entropy = tf.reduce_mean(tf.nn.softmax_cross_entropy_with_logits(labels=y_,
  logits=y))

  清单 8-10

  获取交叉熵

  ```


  文档指出该函数将在后续版本中被弃用（并且要习惯这一点——这在 TensorFlow 和 Python 的大多数库中都会发生），因此我们将使用一种更通用的类似方法（详情请参阅
  Jupyter notebook）。




  ### 实例化会话


  当我们准备好运行模型时，使用“**sess.run**”命令实例化会话。这会启动我们之前设置的所有计算图（列表 8-11）。


  ```

  sess.run(tf.global_variables_initializer())

  列表 8-11

  启动会话

  ```


  ### 训练


  我们设置一个任意的循环次数，此处为 1,000 次，并将数据以批次形式输入模型（列表 8-12）。


  ```

  for _ in range(1000):

  batch = mnist.train.next_batch(100)

  train_step.run(feed_dict={x: batch[0], y_: batch[1]})

  列表 8-12

  设置模型迭代次数

  ```


  ### 准确率


  为了避免盲目训练，我们添加一个准确率度量来监控模型的训练效果，该度量将每 100 步打印一次进度（列表 8-13）。


  ```

  print(step, sess.run(accuracy, feed_dict={x: mnist.test.images, y_: mnist.test.labels,
  keep_prob: 1.0}))

  列表 8-13

  在训练期间访问准确率

  ```


  这个脚本中还有更多内容，请前往实际的 TensorFlow 教程查看，如果你对深度学习感兴趣，这非常值得一看（[`https://www.tensorflow.org/versions/r1.2/get_started/mnist/pros`](https://www.tensorflow.org/versions/r1.2/get_started/mnist/pros)）。


