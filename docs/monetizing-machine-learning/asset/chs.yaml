  \n### Flask\n\nFlask 是一个轻量级但非常强大的服务器端 Web 框架。它是本书中所有应用程序背后的核心。它也是我们 Python 数据生成函数与网页之间的粘合剂。这是我热爱使用\
  \ Flask 的原因之一，因为它允许我们在不脱离 Python 语言的情况下，将独立的 Python 脚本链接到服务器端 Web 框架；这使得对象之间的数据传递变得容易得多！\n\
  \nFlask 提供了发布网页所需的最基本功能。如果你需要额外的支持，比如数据库、表单控件等，你将需要安装额外的库，这就是为什么它被称为轻量级微框架。这也正是它易于使用的原因，因为你只需学习少数几个额外技巧；其他一切都使用我们已经熟悉且久经考验的\
  \ Python 库。\n\n不幸的是，我们只能在 Python 中工作一段时间，最终你将需要涉足前端 Web 脚本。但别为此烦恼；网上有大量优秀的示例（Stackoverflow.com、w3schools.com）以及外观惊艳的\
  \ GetBootstrap.com 模板，可以让你尽快上手。\n\n### 注意\n\n有关 Flask 的更多信息，请查看 Flask 官方文档：[`http://flask.pocoo.org/`](http://flask.pocoo.org/)。\n\
  \n### HTML\n\nHTML，即超文本标记语言，无需过多介绍。就 Web 技术而言，这是最基本的标准。它已经存在多年，用于创建几乎所有现存的网页和 Web\
  \ 应用程序。\n\n对于那些想复习此主题的人，网上有海量的免费资料。我推荐 [w3schools.​com](http://w3schools.com) 上的任何内容。他们的资料组织良好、全面且通常是交互式的。\n\
  \n### CSS\n\n层叠样式表（CSS）让大多数网站看起来很棒！我们在这里使用两种类型的 CSS 文件：加载在大多数网页“< **HEAD** >”部分的\
  \ CSS 链接（最常见），以及如列表 3 代码片段中所示的自定义 CSS。\n\n```\n.btn-circle.btn-xl {\nwidth: 70px;\n\
  height: 70px;\npadding: 10px 2px;\nborder-radius: 35px;\nfont-size: 17px;\nline-height:\
  \ 1.33;\n}\n\n列表 3\n自定义 CSS 脚本块\n```\n\n托管在外部服务器上的 CSS 文件无法自定义，但通常是最优秀的。但有时你只需要自定义页面上的某个功能，这时你可以创建一个本地\
  \ CSS 文件或直接在 HTML 页面中添加一个样式标签。然后通过“ **class** ”参数将其应用于特定的标签或区域（列表 4）。\n\n```\nSpring\n\
  列表 4\n将 CSS 标签应用于 HTML 标签\n```\n\nCSS 非常详细地定义了大小、颜色、字体以及所有你能想到的外观样式。它还允许你通过 Web\
  \ 门户统一你的外观和感觉。你只需创建一次，就可以让所有页面调用它来继承该特定样式。\n\n### 注意\n\n有关 CSS 的更多信息和培训，请查看 w3schools.com。\n\
  \n### Jinja2\n\nJinja2 用于生成标记和 HTML 代码，并与 Flask 变量紧密配合。它由 Armin Ronacher 创建，被广泛用于直接在\
  \ HTML 模板中处理 Flask 生成的数据和 if/then 逻辑。\n\n在这个 HTML 模板示例中，一个名为“ **previous_slider_value**\
  \ ”的 Flask 生成值通过 Jinja2 被注入到滑块的“ **value** ”参数中。注意双花括号的使用（列表 5）。\n\n```\n列表 5\n\
  Jinja2 将数据传递给 HTML 输入控件\n```\n\n### 注意\n\n有关 Jinja2 的更多信息，请查看文档：[`http://jinja.pocoo.org/docs/2.10/`](http://jinja.pocoo.org/docs/2.10/)。\n\
  \n### JavaScript\n\nJavaScript 本身是一种真正的编程语言。它可以为你的任何前端控件添加极其强大的行为。JavaScript 为网页带来了高度的交互性，我们将在每一章中充分利用它。\n\
