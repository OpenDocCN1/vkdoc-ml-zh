  输出：

  $ appengine_config.py app.yaml Archive.zip lib main.py requirements.txt

  列表 1-36

  检查 GCP 上“GoogleCloudFlaskIntro”文件夹的内容

  ```


  ### 第 5 步：在 Google Cloud 上部署你的 Web 应用程序


