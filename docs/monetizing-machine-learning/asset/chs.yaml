  ## 为建模准备数据


  在大多数数据科学项目中，都有一个数据整理阶段，在此阶段对数据进行评估和清洗，使其达到“**模型就绪**”的状态。在本例中，我们已经删除了一些无用的特征，没有需要处理的空值，并且我们不必担心相关性或多重共线性，因为我们最终模型只打算使用四个简单的特征。


  ### 回归建模


  在统计分析中，回归模型试图预测变量之间的关系。它会分析自变量如何与因变量相关联。拟合后的模型可用于预测新的因变量。


  ### 简单线性回归


  线性回归可能是最简单的建模算法。它试图解释一个因变量与一个或多个自变量之间的关系。参见图 2-13 中的基本回归方程。


  ![images/468330_1_En_2_Fig13_HTML.jpg](img/468330_1_En_2_Fig13_HTML.jpg)


  图 2-13


  基本线性回归方程


  在方程中，y = 估计的因变量得分，β0 = 常数，β_1 = 回归系数，x = 自变量的得分。


  ### 一个简单模型


  让我们从一个简单的多元线性回归模型开始，我们将所有变量输入，并得到一个基础的均方根误差（RMSE）。RMSE 以与结果变量（也称为 y 标签）相同的单位来表示误差，因此很容易看出模型在学习/预测自行车租赁方面的表现如何，而误差则成为一种置信区间形式。我们希望获得尽可能低的
  RMSE 分数，因此目标是不断调整数据和模型，直到分数不再下降。本章中的所有建模工作都将基于 Python 的 scikit-learn/sklearn 库。^(⁷)
  这是一个出色的库，应该能够满足大多数 Python 用户的建模需求。


  尽管我们只打算运行一个简单的线性回归，但我们将利用 sklearn 库中的三个函数：“**train_test_split**”用于从原始数据中创建两个随机数据集，并将特征与结果分开；“**linear_model**”用于运行我们的模型；以及“**mean_squared_error**”用于评估模型的学习效果（代码清单
  2-8）。


  ```

  '
- '# 设置结果变量

  outcome = ''cnt''

  '
- '# 创建特征列表

  features = [feat for feat in list(bike_df_model_ready) if feat not in [outcome,
  ''instant'']]

  '
- '# 将数据拆分为训练集和测试集

  from sklearn.model_selection import train_test_split

  X_train, X_test, y_train, y_test = train_test_split(bike_df_model_ready[features],

  bike_df_model_ready[[''cnt'']], test_size=0.3, random_state=42)

  代码清单 2-8

  将数据集拆分为训练集和测试集的代码片段

  ```


  “**train_test_split()**”函数将使用一个种子将数据拆分为两个随机数据集。无论何时测试不同的方法，并希望确保始终使用相同的拆分以进行公平比较，设置“**random_state**”种子参数都是一个好主意。“**test_size**”参数设置测试集的大小。这里我们将其设置为
  0.3，即 30%，因此它将随机化数据，并将 70% 的数据分配给训练集，30% 分配给测试集（代码清单 2-9）。


  ```

  from sklearn import linear_model

  model_lr = linear_model.LinearRegression()

  '
- '# 在训练集上训练模型

  model_lr.fit(X_train, y_train)

  代码清单 2-9

  线性回归代码

  ```


  我们声明一个“**LinearRegression()**”模型，然后调用“**fit()**”函数，使用训练数据和训练标签来训练模型。模型“**model_lr**”现在已训练完毕，可以用于预测（代码清单
  2-10）。


  ```

  输入：

  predictions = model_lr.predict(X_test)

  from sklearn.metrics import mean_squared_error

  print("均方根误差: %.2f" % sqrt(mean_squared_error(y_test, predictions)))

  输出：

  均方根误差: 143.08

  代码清单 2-10

  预测并获取 RMSE 分数

  ```


  最后，我们使用预留用于测试的 30% 的数据调用“**predict()**”函数，并将预测的标签输入“**mean_squared_error()**”函数，以获取均方根误差分数。我们得到的
  RMSE 为 **143.08**，并将其作为我们的基础基准分数。这是我们在当前种子拆分（我们在 train_test_split 函数上应用的种子，以确保每次都能得到相同的拆分）以及到目前为止选择的所有特征下得到的结果。解释该分数的一种方式是，由于它与我们的结果变量处于同一量级，我们的模型预测偏差了
  143 辆自行车。考虑到每小时平均自行车租赁需求约为 190 辆，我们的模型比简单地选取自行车租赁的总体平均值表现更好。但让我们看看是否能够改进这一点。


  ## 特征工程实验


  让我们尝试几种不同的技术，包括多项式、非线性建模和利用时间序列，看看是否能获得更好的分数。




  ### 使用多项式进行建模


