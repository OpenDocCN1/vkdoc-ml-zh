  \n几十年前，当我还是个学习编程的孩子时，我有一本用于 Apple II 的 ASCII 游戏书（书名我记不清了），每章开头都有一张完成版游戏的图片。在一本除了计算机代码之外别无他物的书中，这既是诱饵，也是动力。那是在\
  \ GitHub 和互联网出现之前的年代。仿佛就在昨天，我仍记得那种兴奋感：飞速浏览代码，逐行抄写，修正拼写错误，擦干眼泪，只为玩到游戏。如今，很多事情都变了，但尽管代码可以下载，我们仍然在每章开头放一张最终产品的截图，这样你也能感受到学习这些概念时的动力和兴奋。\n\
  \n## 低门槛与快速上市\n\n本书将引导你完成多个项目，探索不同的 Python 机器学习理念，以及将其转化为 Web 应用的不同方法。每章结尾都会有一个无服务器\
  \ Web 应用，任何有互联网连接的人都可以访问。这些项目基于经典且流行的 Python 数据科学问题，难度会随着你的学习进度而增加。我们将研究并设计一个建模解决方案，然后将该方法中一个有趣的方面扩展成一个交互性强、引人入胜的\
  \ Web 应用。\n\n成为一名数据科学家是一份很棒的工作，但在学习成为数据科学家的过程中，教材存在一个令人困扰的空白。数据科学不仅仅是统计学和建模；它关乎满足人类需求和解决实际问题。很少有教材能涵盖全局。似乎每当你开始谈论全局时，就必须签署保密协议（NDA）。这是一个至关重要的学习领域，如果你和我一样，你需要理解自己为什么要做某件事，才能把它做好。这些并不是困难的话题，尤其是当你使用合适的工具来处理它们时。\n\
  \n我们不会把重点放在“**成为一名数据科学家**”这个最终目标上；关于这个主题的书已经很多了。相反，我们将专注于如何快速、简单地将机器学习产品推向市场，并且始终将用户/客户放在心上！这正是这个行业教育大纲中所缺失的。如果你先构建产品，然后再与客户沟通，你的流程就会有缺陷，你的解决方案也会偏离目标。我重新绘制了德鲁·康威的数据科学维恩图，将客户置于最高优先级（图\
  \ 1）。\n\n![images/468330_1_En_BookFrontmatter_Fig1_HTML.jpg](img/468330_1_En_BookFrontmatter_Fig1_HTML.jpg)\n\
  \n图 1\n\n经典的数据科学维恩图与我的更新版本并列\n\n^(¹) 我和 Mehdi 在本书的内容上付出了巨大努力。我们花时间精心构思这些概念，确保它们对我们的读者（即我们的客户——始终将客户放在心上）具有实用价值。我负责编写材料，Mehdi\
  \ 负责编辑。就所涵盖的范围和技术而言，这是一本雄心勃勃的书。为了专注于从材料中获得最快速的实用价值，我们不得不做出选择和取舍。工具在不断变化。当你阅读本书时，书中的某些内容可能已经过时，但这没关系（你可以访问\
  \ GitHub 仓库获取更新）。在这里，一切都在不断变化，但事物总是向着更好的方向变化！因此，学习新技巧通常意味着学习更好、更快、更强大的做事方法。本书不仅会教你如何构建\
  \ Web 应用，还会为你指明正确的方向，以深化你在特定兴趣领域的知识。\n\n如果这是一门课程，我会让你签署一份“**竞争协议**”：没错，与竞业禁止协议相反。我希望你通读本书，理解这些工具，然后复制它们，并将它们变成你自己的。这些旨在成为模板，帮助你快速搭建平台，从而专注于更重要的事情，为你的客户和朋友构建有影响力的工具。当你理解了这一点，就是你毕业的日子，你将获得被称为“**数据科学专业人士**”的所有权利和特权。\n\
  \n## 什么是无服务器云？\n\n云服务提供商在改进 Web 托管解决方案和降低成本方面付出了巨大努力。最近出现的“**无服务器**”选项，抽象了大部分配置过程，在本书涵盖的四家云提供商中有三家提供此选项。这意味着你可以在完全托管的平台上启动并运行你的项目，自动进行负载均衡、吞吐量扩展、快速部署等，而无需选择、配置或担心任何这些问题。你可以自行决定对这些架构和监控选项的参与程度。你可以选择自己控制什么，以及将什么委托给提供商。有一点是肯定的：网站将根据流量自动调整，并提供无与伦比的正常运行时间。\n\
  \n这使我们能够专注于重要的事情，而不会被实现目标所需的繁琐事务和支持所拖累。这些所谓的“**繁琐事务**”至关重要，必须认真对待。这就是为什么我们考察了四家信誉良好的云提供商，它们能让我们安心，从而完全专注于我们的\
  \ Web 应用，而不必担心网站崩溃或提供商倒闭。让我们专注于重要的事情，开始工作吧！\n\n\n\n## Web 应用开发的关键路径\n\n许多机器学习模型都停留在原始的编码状态：难以理解，也无法轻松地邀请他人从中获益。这些模型注定会被遗忘。即便是那些成功摆脱集成开发环境束缚的模型，当它们被简化为静态图表或晦涩的建模分数时，也无法充分发挥其潜力。本书旨在通过将机器学习模型扩展为通用\
  \ Web 应用的流程进行分解，来避免这一陷阱。每一章都遵循以下三个关键步骤：\n\n1.  **以正确的方式建模**。我们从终点出发，先理解用户希望看到什么，并在最终目标和用户体验上投入时间和思考。我们确保采用合适的建模方法，以便快速且毫无意外地达到\
  \ Web 应用状态（图 2）。\n\n    ![images/468330_1_En_BookFrontmatter_Fig2_HTML.jpg](img/468330_1_En_BookFrontmatter_Fig2_HTML.jpg)\n\
  \n    图 2\n\n    在构建之前，务必确认你的想法有受众（来源：Lucas Amunategui）\n\n2.  **设计与开发本地 Web 应用**。此步骤需要利用各种\
  \ Web 前端技术，以提供所需的交互性和动态效果，从而突出模型的洞察力并维持用户的兴趣。此阶段的最终产品与下一阶段的产品并无区别，唯一的区别在于它托管在你的本地机器上，而非云端。\n\
  \n3.  **部署到流行且可靠的无服务器云提供商**。每个提供商都有独特的要求、优势和劣势，需要理解并加以应对。这是最终阶段，世界将得以欣赏并从你的工作中学习。\n\
  \n我们从处理提供智能交互的简单方法开始，例如利用模型的系数或保存训练好的模型，然后转向复杂的方法，例如使用数据库来跟踪用户参与度，或依赖开源预训练模型进行图像识别。一个关于股票市场预测的虚构案例研究将在第一部分开始，并在后续部分中再次探讨。新的功能会不断添加，直到它最终演变成一个带有付费墙的复杂仪表板，为付费订阅用户提供定制化的智能服务。\n\
  \n通过专注于经典的数据科学问题，并结合流行的开源技术，如 Python、Flask、Ajax、Bootstrap、JavaScript 和 HTML，你会发现这些内容似曾相识；即使不熟悉，你的学习曲线也会大大降低。我们专注于使用简单的工具和简单的技术，以可靠且快速地将机器学习想法推向现实世界。这些工具和方法会在每一章中反复出现，所以如果某些方面一开始不清楚，不用担心；继续前进，事情会变得越来越清晰。\n\
  \n我们还会在每一章中轮换云提供商，因此你将接触到最流行的提供商。这将为你未来项目选择哪个提供商提供丰富的见解。我建议通读所有章节，因为每一章都会展示不同的做事方式，突出提供商的优势，并展示快速完成工作的独特技巧和窍门。\n\
  \n## 关于你，读者\n\n本书面向那些希望将统计模型、机器学习流程、数据驱动项目或任何独立的 Python 脚本，扩展为任何拥有 Web 浏览器的人都能访问的交互式仪表板的读者。互联网是最强大的媒介，其准入门槛极低`—`任何人都可以访问它，而本书正是为那些希望利用这一优势的人而编写。\n\
  \n本书假定你具备 Python 和编程经验。你应该拥有一个可正常运行的代码编辑器和解释器。你应该能够测试和排查问题、安装 Python 库，并熟悉诸如 NumPy、Pandas\
  \ 和 Scikit-learn 等流行包。本书不涵盖这些基本概念的介绍。此处提供的代码仅使用 Python 3.x，并未在更低版本上进行测试。此外，具备 Web\
  \ 脚本语言的基础知识也会很有帮助。\n\n本书面向那些有创业精神、希望在不花费太多成本的情况下将想法发布到 Web 上的人，没有 IT 人员的小公司，希望获得曝光和真实世界训练的学生，以及任何准备将工作提升到新水平的数据科学专业人士。\n\
  \n## 如何使用本书\n\n每一章都以最终 Web 应用的图片及其功能描述开始。这种方法有多个目的：\n\n*   它作为一种激励因素，诱使你投入工作。\n\n\
  *   它直观地解释了项目将要涉及的内容。\n\n*   更重要的是，它教导了在着手任何项目时，对最终目标有一个清晰的、以客户为中心的理解是多么关键。\n\n\
  本书仅展示源代码的要点，但完整版本附在相应的代码仓库中。这包括在涉及数据探索时的 Jupyter notebook，以及用于 Web 应用的压缩文件夹。\n\n\
  这里提供的实践项目简单、清晰，并且可以作为模板来快速启动许多其他类型的应用。无论你是想了解如何围绕数值或分类预测、文本分析、创建强大且交互式的演示文稿、提供对受限数据的访问，还是利用\
  \ Web 插件来接受订阅付款和捐赠来创建 Web 应用，本书都将帮助你快速将项目交到全世界用户手中。\n\n### 注意\n\n如需报告编辑错误/漏洞，请反馈至\
  \ [`www.apress.com/9781484238721`](http://www.apress.com/9781484238721)。\n\n## 行业工具与杂项技巧\n\
  \n以下简要介绍一些工具，它们将帮助我们快速、简单且美观地将机器学习想法转化为 Web 应用。这并非旨在成为一份全面或完整的清单，只是对所用不同技术的初步了解，以及如果你想了解更多（我希望你会）可以遵循的指引。\n\
  \n\n\n### Jupyter Notebooks\n\n本书仅展示代码片段，因此你需要下载并运行每章的 Jupyter notebook，以便亲自运行并尝试各种功能和不同参数。如果你不熟悉\
  \ Jupyter notebook，它是一种基于网页的交互式 Python 解释器，非常适合构建、调整和发布任何使用 Python 脚本的内容。它连接到一个功能完整的\
  \ Python 内核（请确保是 Python 3.x 版本），并且可以像其他解释器一样加载和运行库与脚本。要安装 Jupyter notebook，请遵循官方文档：[`http://jupyter.readthedocs.io/en/latest/install.html`](http://jupyter.readthedocs.io/en/latest/install.html)。\n\
  \n有多种安装方式，包括使用“ **pip3** ”命令；如果此方法对你无效，请查阅官方文档了解其他安装方式（列表 1）。\n\n```\nsudo pip3\
  \ install jupyter\n列表 1\n安装 Jupyter\n```\n\n使用 Jupyter notebook 既简单又强大。你只需将 notebook\
