  ### /static/ 文件夹


  静态文件夹，顾名思义，存放静态的、不变的文件。这里用于存储我们 Web 应用程序的图像、文件和其他可共享数据。


  ### /templates/index.html 文件夹和脚本


  templates 文件夹存放我们 Web 应用程序所需的所有模板。在后续章节中，通常会有两个 HTML 文件，一个“**index.html**”和一个响应
  HTML 文件。最好将这些文件分开，而不是试图将所有内容塞进一个带有复杂“**if then**”分支的单个 HTML 文件中。


  本章的大部分操作都发生在“**index.html**”内部，因此让我们深入了解一下。在你的编辑器中打开完整的“**index.html**”文件以便跟随学习。如前所述，本章的“**大脑**”不是
  Flask，而是“**index.html**”前端页面——并且几乎全部位于页面末尾的 JavaScript 代码片段中。JavaScript 为网页带来了极佳的交互性。


