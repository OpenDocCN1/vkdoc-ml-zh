  \ status**”（清单 6-32）。\n\n```\n输入:\n$ git add .\n$ git status\n输出:\n要提交的变更：\n  (使用\
  \ \"git rm --cached <文件>...\" 以取消暂存)\n\t新文件：   main.py\n\t新文件：   predictingcrimeinsanfrancisco/bin/activate\n\
  \t新文件：   predictingcrimeinsanfrancisco/bin/activate.csh\n\t新文件：   predictingcrimeinsanfrancisco/bin/activate.fish\n\
  \t新文件：   predictingcrimeinsanfrancisco/bin/easy_install\n\t新文件：   predictingcrimeinsanfrancisco/bin/easy_install-3.6\n\
  \t...\n清单 6-32\n添加到 Git\n```\n\n你可能已经注意到，我们在“**git add .**”命令中添加了大量文件。根据“**git status**”的提示，它告诉了我们如何使用“**rm**”命令移除那些我们不想提交到\
  \ Git 的文件。让我们移除虚拟环境“**predictingcrimeinsanfrancisco**”中项目不需要的所有文件和文件夹（清单 6-33）。\n\
  \n```\n输入:\n$ git rm -r --cached predictingcrimeinsanfrancisco\n$ git status\n输出:\n\
  要提交的变更：\n  (使用 \"git rm --cached <文件>...\" 以取消暂存)\n\t新文件：   main.py\n\t新文件：   ptvs_virtualenv_proxy.py\n\
  \t新文件：   requirements.txt\n\t新文件：   sf-crime-horizon.csv\n\t新文件：   static/images/afternoon.jpg\n\
  \t新文件：   static/images/cop.jpg\n\t新文件：   static/images/morning.jpg\n\t新文件：   static/images/night.jpg\n\
  \t新文件：   static/images/thief.jpg\n\t新文件：   templates/index.html\n\t新文件：   web.3.4.config\n\
  清单 6-33\n从 Git 中移除 “predictingcrimeinsanfrancisco”\n```\n\n现在我们只保留了需要的文件。因此，执行一次本地的“**git\
  \ commit**”，并添加一条有意义的注释，以便将来需要回顾过往操作时能派上用场（清单 6-34）。\n\n```\n输入:\n$ git commit -am\
  \ 'where crime happens'\n输出:\n[master (root-commit) 1b87606] where will crime happen\
  \ next\n 11 files changed, 120065 insertions(+)\n create mode 100644 main.py\n create\
  \ mode 100644 ptvs_virtualenv_proxy.py\n create mode 100644 requirements.txt\n create\
  \ mode 100644 sf-crime-horizon.csv\n create mode 100644 static/images/afternoon.jpg\n\
  \ create mode 100644 static/images/cop.jpg\n create mode 100644 static/images/morning.jpg\n\
  \ create mode 100644 static/images/night.jpg\n create mode 100644 static/images/thief.jpg\n\
  \ create mode 100644 templates/index.html\n create mode 100644 web.3.4.config\n\
  清单 6-34\nGit 提交\n```\n\n有关通过 Git 部署到 Azure 应用服务的更多信息，请参阅 [`https://docs.microsoft.com/en-us/azure/app-service/app-service-deploy-local-git`](https://docs.microsoft.com/en-us/azure/app-service/app-service-deploy-local-git)\
  \ 。\n\n## azure-cli 命令行界面工具\n\n我们将使用“**azure-cli**”工具将我们的 Web 应用程序部署到 Microsoft\
  \ Azure 上（如果你尚未安装它，请参考第 2 章）。\n\n### 第 1 步：登录\n\n创建一个“**az**”会话（清单 6-35 和图 6-24）。\n\
  \n![images/468330_1_En_6_Fig24_HTML.jpg](img/468330_1_En_6_Fig24_HTML.jpg)\n\n图\
  \ 6-24\n\n从 azure-cli 登录 Azure\n\n```\n$ az login\n清单 6-35\n代码输入\n```\n\n按照说明操作，将浏览器指向给定的\
  \ URL 地址，并相应地输入代码（图 6-25）。\n\n![images/468330_1_En_6_Fig25_HTML.jpg](img/468330_1_En_6_Fig25_HTML.jpg)\n\
  \n图 6-25\n\n验证会话\n\n如果一切顺利（即你拥有一个状态良好的 Azure 账户），它将把 azure-cli 终端连接到云服务器。此外，一旦你获得授权，就可以安全地关闭浏览器窗口。\n\
  \n确保你的命令行工具指向本章的“**web-application**”文件夹。\n\n### 第 2 步：为你的部署用户创建凭据\n\n该用户将拥有 FTP\
  \ 和本地 Git 使用的适当权限。这里我将用户名设置为“**flaskuser10**”，密码设置为“**flask123**”。你只需执行此操作一次，之后就可以重复使用同一个账户。如果遇到问题，只需创建一个不同的用户名（或者像我通常做的那样，在用户名末尾添加一个数字并不断递增；清单\
  \ 6-36）。\n\n```\n$ az webapp deployment user set --user-name flaskuser10 --password\
  \ flask123\n清单 6-36\n代码输入\n```\n\n当你逐步执行每个“**azure-cli**”步骤时，你会收到 JSON 回复来确认你的设置。对于“**az\
  \ webapp deployment**”命令，大多数回复应该包含空值且没有错误消息。如果你收到错误消息，则说明存在需要解决的权限问题（“**conflict**”表示该名称已被占用，请尝试其他名称；“**bad\
  \ requests**”表示密码强度太弱）。\n\n### 第 3 步：创建你的资源组\n\n这将是你的逻辑容器。在这里，你需要输入离你位置最近的区域（请参阅\
  \ [`https://azure.microsoft.com/en-us/regions/`](https://azure.microsoft.com/en-us/regions/)\
  \ ）。即使你身处地球的另一端，在本示例中选择“**West US**”也没什么大不了的，但在生产环境中，这会产生影响，因为你需要让服务器尽可能靠近你的用户群以获得最佳性能。\n\
  \n这里我将名称设置为“**myResourceGroup**”（清单 6-37）。\n\n```\n$ az group create --name myResourceGroup\
  \ --location \"West US\"\n清单 6-37\n代码输入\n```\n\n### 第 4 步：创建你的 Azure 应用服务计划\n\n\
  这里我将名称设置为“**myAppServicePlan**”，并选择一个免费实例（sku）（清单 6-38）。\n\n```\n$ az appservice\
  \ plan create --name myAppServicePlan --resource-group myResourceGroup --sku FREE\n\
  清单 6-38\n代码输入\n```\n\n### 第 5 步：创建你的 Web 应用\n\n你的“**webapp**”名称必须是唯一的，并确保你的“**resource-group**”和“**plan**”名称与你在前面步骤中设置的名称一致。在本例中，我将使用“**amunateguicrime**”。要获取支持的运行时的完整列表，请运行“**list-runtimes**”命令（清单\
  \ 6-39）。\n\n```\n$ az webapp list-runtimes\n清单 6-39\n代码输入\n```\n\n要创建 Web 应用程序，请使用“**create**”命令（清单\
  \ 6-40）。\n\n```\n$ az webapp create --resource-group myResourceGroup --plan myAppServicePlan\
  \ --name amunateguicrime --runtime \"python|3.4\" --deployment-local-git\n清单 6-40\n\
  代码输入\n```\n\n“**az webapp create**”命令的输出将包含一条重要信息，你将在后续步骤中用到它。查找“**deploymentLocalGitUrl**”这一行（图\
