  ## 绘制画布


  画布是应用程序的关键部分，它能让任何人以一种有趣的方式体验和理解 MNIST、字符识别以及卷积建模。这些通常是高级课程和工业建模工具中涉及的难点概念，但它们也可以很有趣！画布是
  HTML5 的一部分（有关此酷炫功能的更多信息，请参见 [`https://www.w3schools.com/html/html5_canvas.asp`](https://www.w3schools.com/html/html5_canvas.asp)），它允许创建一个空间，用户可以在网页上交互并绘制图形（图
  8-4）。


  ![images/468330_1_En_8_Fig4_HTML.jpg](img/468330_1_En_8_Fig4_HTML.jpg)


  图 8-4


  使用 HTML5 和 <canvas> 标签进行手指绘画


  通过这种方法，我们可以将用户在画布上绘制的内容转换为图像，供我们的 TensorFlow 模型接收并尝试预测。


  ### 从画布到 TensorFlow


  这部分并不复杂，但需要一些转换，请耐心阅读。当访问者点击“**Predict**”按钮时，它会调用画布 HTML5 控件的“**toDataURL()**”函数。这会将画布标签中包含的所有数据转换为
  PNG 格式图像的文本表示。


  这是我们之前见过、并且会在本书中再次遇到的概念。还记得第 3 章吗？我们依靠文本表示的图像数据来轻松地在服务器和客户端之间传递。在这里，我们反其道而行之——从客户端到服务器（图
