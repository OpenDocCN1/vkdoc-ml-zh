  ## 使用 Stripe 进行购买


  Stripe 是一个简单、强大且广泛使用的支付平台，拥有大量 Flask 支持。它也被广泛信任，如果你希望访客向你付款，这一点很重要。我们将遵循官方文档中的一个简单示例（
  [`https://stripe.com/docs/checkout/flask`](https://stripe.com/docs/checkout/flask)
  ）。


  首先注册一个免费账户，如果你只想使用开发者工具进行测试，则无需提供任何支付信息。


  注册一个免费的 Stripe 账户，导航到“**开发者**”部分，然后点击“**API 密钥**”（图 15-12）。


