  ## Amazon Web Services (AWS) Elastic Beanstalk


  对于本章基于云的部分，我们将把应用程序托管在 Amazon 的 Elastic Beanstalk 上。这是一个便捷的托管解决方案，可以自动打包你的网站、部署、扩展和负载均衡。它在一个便捷的基于
  Web 的仪表板中提供日志记录、流量和健康监控统计信息，让你随时了解运行状况。这应该能让你专注于应用程序，几乎完全无需操心网站管理。


  你需要一个 Amazon Web Service 账户并设置安全凭证。如果你已有 Amazon.com 账户，应该可以轻松将其迁移到 AWS。如果你是新手，可以创建一个免费套餐账户，该账户将允许你访问基本的
  Beanstalk 功能。请访问 AWS 免费套餐（[`https://portal.aws.amazon.com/gp/aws/developer/registration/index.html`](https://portal.aws.amazon.com/gp/aws/developer/registration/index.html)）。


