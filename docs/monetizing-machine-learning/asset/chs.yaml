  \n### azure-cli 命令行界面工具\n\n\n\n### 步骤 1：登录\n\n创建一个“**az**”会话（清单 11-29 和图 11-14）。\n\
  \n![images/468330_1_En_11_Fig14_HTML.jpg](img/468330_1_En_11_Fig14_HTML.jpg)\n\n\
  图 11-14\n\n从 azure-cli 登录 Azure\n\n```\n$ az login\n清单 11-29\n登录“az”\n```\n\n按照说明操作，将浏览器指向给定的\
  \ URL 地址，并相应输入代码（图 11-15）。\n\n![images/468330_1_En_11_Fig15_HTML.jpg](img/468330_1_En_11_Fig15_HTML.jpg)\n\
  \n图 11-15\n\n验证会话\n\n如果一切顺利（即，你拥有一个状态良好的 Azure 账户），它将把 azure-cli 终端连接到云服务器。此外，一旦你获得授权，就可以安全地关闭浏览器窗口。\n\
  \n确保你的命令行工具指向本章的“**web-application**”文件夹。\n\n### 步骤 2：为你的部署用户创建凭据\n\n该用户将拥有 FTP\
  \ 和本地 Git 使用的适当权限。这里我将用户名设置为“**flaskuserXX**”，密码设置为“**flask123**”。你只需执行此操作一次；之后可以重复使用同一账户。如果遇到问题，只需创建一个不同的用户名（或者在用户名末尾添加一个数字并像我一样递增；清单\
  \ 11-30）。\n\n```\n$ az webapp deployment user set --user-name flaskuser30 --password\
  \ flask123\n清单 11-30\n设置部署用户\n```\n\n当你逐步执行每个“**azure-cli**”步骤时，你将收到 JSON 回复以确认你的设置。对于“**az\
  \ webapp deployment**”，大多数回复应为空值且无错误消息。如果你收到错误消息，则说明存在需要解决的权限问题（“**conflict**”表示该名称已被占用，请尝试其他名称；“**bad\
  \ requests**”表示密码强度太弱）。\n\n### 步骤 3：创建你的资源组\n\n这将是你的逻辑容器。在此，你需要输入离你位置最近的区域（参见 [`https://azure.microsoft.com/en-us/regions/`](https://azure.microsoft.com/en-us/regions/)\
  \ ）。即使你身处地球另一端，本示例选择“**West US**”也没什么大问题，但在生产环境中，为了获得最佳性能，你希望服务器尽可能靠近你的观众，这就会产生影响。\n\
  \n这里我将名称设置为 [`https://azure.microsoft.com/en-us/regions/myResourceGroup`](https://azure.microsoft.com/en-us/regions/myResourceGroup)（清单\
  \ 11-31）。\n\n```\n$ az group create --name myResourceGroup --location \"West US\"\
  \n清单 11-31\n创建组\n```\n\n### 步骤 4：创建你的 Azure 应用服务计划\n\n这里我将名称设置为“**myAppServicePlan**”，并选择一个免费实例（sku）（清单\
  \ 11-32）。\n\n```\n$ az appservice plan create --name myAppServicePlan --resource-group\
