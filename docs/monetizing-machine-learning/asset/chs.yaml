  ## Memberful 身份验证


  Memberful 支持使用 OAuth 2.0 协议进行身份验证，但由于它要求您将应用程序直接绑定到您的 Memberful 账户，因此创建付费墙比您自己实现要容易得多。更多信息，请参考
  Memberful 官方文档：[`https://memberful.com/help/integrate/advanced/memberful-api/`](https://memberful.com/help/integrate/advanced/memberful-api/)。


  ### 两步流程与 Flask 会话机制


  Flask 会话是一个数据持有对象，可以使用 cookie 在页面之间维持状态。试想一下，有时您希望记住用户正在做什么、他们的购物车中有什么，或者即使用户在不同页面之间跳转，也能记住他们是谁。您可以使用表单变量来回传递数据，但这很快就会变得混乱和令人困惑（而且不太安全）。Flask
  会话通过使用 cookie 将数据存储在客户端计算机上来解决这个问题。为此，必须启用 cookie。


  得益于 Memberful 强大的会员功能和集成的用户界面，我们将要创建的用户身份验证系统很容易实现。当访客进入付费墙后面的页面时，我们的 Flask 应用程序会检查该用户是否确实是付费客户。我们只需要在会话期间检查一次，然后依赖会话变量来记住他/她有权查看付费墙后面的页面。


  ### 身份验证步骤 1


  第一步是从 Memberful 站点获取身份验证“**代码**”。此代码是一个临时密钥，允许您请求用户的信息。当用户点击 Web 应用程序的 Memberful
  身份验证“**sign_in**”链接时，此代码会自动返回（清单 16-4）。


  ```

  >.memberful.com/auth/sign_in">登录

  清单 16-4

  身份验证登录链接

  ```


  一旦 Memberful 将查询 URL 识别为有效的 Memberful 客户端站点，它就会返回一个附加到重定向 URL 的代码（清单 16-5）。


  ```

  https://manuelamunategui.pythonanywhere.com/member/?code=483294e65b5dd2e65862e3c1ba454dee&redirect_to=http%3A%2F%2Fmanuelamunategui.pythonanywhere.com%2Fmember%2F

  清单 16-5

  身份验证代码

  ```


  我们的应用程序将代码“**code=483294e65b5dd2e65862e3c1ba454dee**”读取为“**GET**”变量，并保留它以构建第二步身份验证。


  ### 身份验证步骤 2


  我们自定义的“**IsSubscriberLoggedIn()**”函数完成了大部分身份验证工作。它首先构建“**access_token_req**”字典，其中包含上一步的临时“**code**”、应用程序的
  Memberful ID 和密钥以及重定向 URL（所有这些都可以在您的 Memberful 账户的“**设置**” ➤ “**集成**” ➤ “**自定义应用**”下找到）。


  然后，它将访问令牌字典作为“**POST**”请求传递给“**oauth/token**”URL（清单 16-6）。


  ```

  https://>.memberful.com/oauth/token

  清单 16-6

  auth/token URL

  ```


  如果一切正确，它将返回“**access_token**”；这是真正的密钥，将解锁我们访客的个人数据，例如他们是否是我们 Web 应用程序的实际会员，以及他们的订阅当前是否处于活动状态（清单
  16-7）。


  ```

  https://>.memberful.com/api/graphql/member?access_token=999999999

  清单 16-7

  可以使用以下 URL 查询此数据

  ```


  身份验证过程步骤 2 中的所有操作都通过表单“**POST**”完成，以免将敏感信息显示为可读的 URL。这类工作很容易在我们的函数“**IsSubscriberLoggedIn()**”中抽象出来，这将使我们的
  Web 应用程序能够轻松检查每个访客的会员状态（清单 16-8）。


  ```

  def IsSubscriberLoggedIn(code):

  # 构建访问令牌字典

  access_token_req = {

  "code": code,

  "client_id": MEMBERFUL_KEY,

  "client_secret": MEMBERFUL_SECRET,

  "redirect_uri": redirect_uri,

  "grant_type": "authorization_code" }

  # 构建 oauth/token 以访问访客数据

  content_length=len(urlencode(access_token_req))

  access_token_req[''content-length''] = str(content_length)

  r = requests.post(MEMBERFUL_SITE + ''/oauth/token'', data=access_token_req)

  data = json.loads(r.text)

  # 构建 graphql 查询以查询所需的具体值

  r = requests.get(MEMBERFUL_SITE + ''/api/graphql/member?access_token='' +             data[''access_token'']
  +                                           ''&query={%20currentMember%20{%20fullName%20subscriptions%20{%20active%20expiresAt%20}%20}%20}'')

  清单 16-8

  函数“IsSubscriberLoggedIn()”

  ```


  一个值得提及的领域是 graphQL（更多详情请参阅 Memberful API 文档的“**查询和变更**”部分，网址为 [`https://memberful.com/help/integrate/advanced/memberful-api/#queries-and-mutations`](https://memberful.com/help/integrate/advanced/memberful-api/#queries-and-mutations)
  ）。该工具在成功进行身份验证后，允许查询特定的订阅者信息（清单 16-9）。


  ```

  输入：

  query {

  member(id: 1) {

  id

  fullName

  email

  subscriptions {

  id

  plan {

  id

  name

  }

  }

  }

  }

  输出：

  {

  "data": {

  "member": {

  "id": "1",

  "fullName": "John Doe",

  "email": "john.doe@example.com",

  "subscriptions": [

  {

  "id": "1",

  "plan": {

  "id": "1",

  "name": "Monthly"

  }

  }

  ]

  }

  }

  }

  清单 16-9

  来自官方帮助文档

  ```


  在我们的案例中，我们只关心两条信息：用户的姓名以及他们的订阅是否处于活动状态（清单 16-10）。


  ```

  query={%20currentMember%20{%20fullName%20subscriptions%20{%20active%20expiresAt%20}%20}%20}

  清单 16-10

  我们将以下变量附加到“GET”URL

  ```


  这翻译过来就是：提供此会员的全名，以及他们的订阅是否处于活动状态以及何时到期。这里我们只使用了订阅是否处于活动状态，但您可以通过检查到期日期并提醒会员尽快续订来轻松扩展此功能（清单
  16-11）。


  ```

  {"data":{"currentMember":{"fullName":"Manuel", "subscriptions":[{"active":true,

  "expiresAt":1529879538}]}}}

  清单 16-11

  如果我们运行它并查看 graphQL 响应，我们会得到

  ```




