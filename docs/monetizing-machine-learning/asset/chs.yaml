  $ deactivate\n清单 10-35\n停用虚拟环境\n```\n\n\n\n## 结论\n\n用于推荐系统的协同过滤技术非常出色，并且在许多商业应用中广受欢迎。这绝对不是一个简单的章节，因为奇异值分解（SVD）的内部工作原理相当模糊，但关键在于，我们可以构建一个背后拥有强大建模能力的网络应用程序。\n\
