  将该函数应用于数据集后，每个天气类别现在都位于单独的列中（减去第一列，该列是冗余的——如果它不是“**weathershit_2**”、“**weathershit_3**”或“**weathershit_4**”，那么我们可以推断它是“**weathershit_1**”；代码清单
  2-17 和图 2-14）。


