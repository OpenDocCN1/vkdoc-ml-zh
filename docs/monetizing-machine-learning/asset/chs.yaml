  ### 注意


  本章到目前为止看到的代码应谨慎使用，因为它没有使用安全功能来妥善存储用户凭据。这仅应用于原型、一次性项目或安全内网上的内部演示。下一节将介绍一种更健壮且推荐的方法。


  ## 简单的订阅插件系统


  在构建商业级付费墙或仅限订阅页面时，我推荐的方法是使用专业且由外部管理的插件。让专业人士处理加密、安全、敏感信息存储、信用卡支付等问题，这样你就可以专注于构建优质的内容和服务！这是我们这些“**周末战士**”应该走的路。


  ## Memberful


  Memberful 是我们将要使用和实现的插件。我个人喜欢 Memberful^(⁶⁰)，并认为对于任何寻求简单方法来管理网站付费墙部分的人来说，这是一个很好的选择。它通过
  Stripe^(⁶¹) 提供信用卡支付，提供用户管理功能，并且非常谨慎。Memberful 有一系列教学视频，帮助你更好地理解他们那边的运作方式，因为这可能成为你实现网站货币化目标的重要工具。


  让我们看一个从 Memberful 购买东西的简单示例。这里我们只关注购买商品；订阅和付费墙将在下一章讨论。要设置一个待售产品，你只需进入你的 Memberful
