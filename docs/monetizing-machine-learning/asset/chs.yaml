  \ 会将提交的信息通过邮件发送给你。如果你托管的是静态网站，或者不想处理自己管理数据库的麻烦，这是一个很好的选择。\n\n## Git\n\nGit 是一个出色的版本控制工具；它允许你将代码的创建、更改、更新以及任何删除操作都存储在一个仓库中。它与\
