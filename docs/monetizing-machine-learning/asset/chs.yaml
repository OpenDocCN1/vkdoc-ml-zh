  ## 规划我们的 Web 应用程序


  我们的第一步是充分构思泰坦尼克号概念，并使其作为 Web 应用程序在我们的本地机器上运行。


  我们应用程序的核心是来自“**sklearn Python 库**”^(¹¹)的一个简单逻辑回归模型。在通过移除无预测能力的特征、为分类数据创建虚拟列、以及对文本字段应用基本的自然语言处理来准备数据之后，我们训练模型以识别那些幸存者和遇难者周围的常见模式。


  我们通过遵循标准建模流程（将数据分成两部分，一部分用于训练模型，另一部分用于验证模型）来验证模型的准确性。一旦我们对模型的能力感到满意，我们就用它来预测一个虚构乘客的生存概率。这个概率是一个介于
  0 和 1 之间的数字，代表了该虚构乘客从沉船事故中生还的机会——数值越接近 1，生存的机会就越大。


  最后，我们将抽象并概括整个过程，使其在我们的 Web 应用程序的构造函数中运行。这意味着数据摄取、准备和建模的整个过程仅在模型部署期间（以及每当 Web 服务器重启时）发生一次。这确保了当用户想要与
  Web 应用程序交互时，由于训练好的模型已经加载到内存中，应用程序能够快速给出预测结果。不过我们有点操之过急了；让我们先完成项目的本地版本。




