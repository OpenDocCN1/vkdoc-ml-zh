  这张图表很重要，因为它展示了评论者偏好的评分类型。在 1 到 5 分的评分范围内，你可能会认为均匀分布会使“**3**”分成为最常用的评分。但我们明显看到事实并非如此，“**4**”分是最受欢迎的评分，其次是“**3**”分和“**5**”分。花些时间思考这一点至关重要。我们即将围绕用户评分构建模型，因此需要能够在同等条件下比较每位评论者。如何将每个用户的评分标准化，使其能与所有其他用户进行比较？一种方法是将每个用户的评论以其评分均值为中心进行归一化。这会创建一个中心“**0**”点，该点将与所有其他评论者的中心点对齐——即中性评论水平。当然，如果评论者只有一条评论，这个系统就无法生效。\n\
