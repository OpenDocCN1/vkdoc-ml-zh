  \ 10-1\n\n本章的最终 Web 应用\n\n### 注意\n\n通过访问 [`www.apress.com/9781484238721`](http://www.apress.com/9781484238721)\
  \ 并点击源代码按钮，下载第 10 章的文件。打开 Jupyter notebook “**chapter10.ipynb**” 以跟随本章内容。\n\n##\
  \ 规划我们的 Web 应用\n\n我们将专注于使用 MovieLens 数据集中的电影评分进行协同过滤。^(⁴⁴) 这可能是学习该主题最流行的数据集。我们基本上将利用群体的智慧来提出电影推荐。我们将构建一个\
  \ Web 应用，用户可以选择几部电影，应用将返回相关的电影推荐。为了使其更具信息性和趣味性，我们还将从 Wikipedia 中提取关于顶级电影推荐的相关信息和图片。\n\
  \n## 推荐系统简介\n\n推荐系统在 Web 和电子商务中非常重要。每当一个网站根据你正在查看的内容或你的偏好做出推荐时，它就在使用某种形式的推荐模型。推荐系统的类型根据所使用的工具以及定制化和智能数据的可用性而有很大差异。两个流行的领域是“**基于内容的**”和“**协同过滤**”。\n\
  \n在本章中，我们将专注于协同过滤，而不是基于内容的过滤。MovieLens 的数据包含不同电影的用户评分。使用这些数据应用 CF 的理由是，如果你和某个评论者喜欢同一部电影，那么你很可能也会喜欢该评论者评论过的其他电影。\n\
  \n## 探索 MovieLens 数据集\n\n让我们看看 MovieLens 数据。根据 MovieLens 关于 ml-latest-small 数据集的说明^(⁴⁵)，该数据集包含\
  \ 671 位用户在 1995 年至 2016 年间对 9,125 部电影创建的 100,004 条评分。\n\n\n\n### 更多来自 MovieLens\
  \ 数据集的内页注释\n\n**评分数据文件结构（“ratings.csv”）：**\n\n*   所有评分都包含在文件“**ratings.csv**”中。该文件标题行之后的每一行代表一个用户对一部电影的一次评分，格式如下：userId,\
  \ movieId, rating, timestamp。\n\n*   该文件中的行首先按 userId 排序，然后在同一用户内按 movieId 排序。\n\
  \n*   评分采用 5 星制，支持半星增量（0.5 星 – 5.0 星）。\n\n*   时间戳表示自协调世界时（UTC）1970 年 1 月 1 日午夜以来的秒数。\n\
  \n**电影数据文件结构（“movies.csv”）：**\n\n*   电影信息包含在文件“**movies.csv**”中。该文件标题行之后的每一行代表一部电影，格式如下：movieId,\
  \ title, genres。\n\n*   电影标题是手动输入或从 [`https://www.themoviedb.org/`](https://www.themoviedb.org/)\
  \ 导入的，并在括号中包含发行年份。这些标题中可能存在错误和不一致之处。\n\n*   类型是一个以竖线分隔的列表，选自以下类别：\n    *   动作\n\n\
