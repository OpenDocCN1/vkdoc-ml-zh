  ## 介绍 AJAX – 动态服务端 Web 渲染


  在本章中，我们将开始使用 Ajax，这是一项非常酷的技术，它允许我们无需重建整个页面即可更新 Web 内容。这对于执行大量微更新的高度交互式 Web 应用程序非常有效。Ajax
  也非常易于使用，由两部分组成：一个调用“**$.ajax**”的前端脚本函数，以及一个用于捕获和处理这些调用的后端 Flask 函数。我们将在第[10](https://doi.org/10.1007/978-1-4842-3873-8_10)章中更深入地探讨
  Ajax。




  ## 在虚拟环境中工作——一个用于实验、安全与清晰的沙盒


  使用虚拟环境有许多优点：


  *   创建一个未安装任何 Python 库的环境


  *   精确了解应用程序运行所需的 Python 库


  *   保护计算机系统的其余部分免受在此环境中安装的任何 Python 库的影响


  *   鼓励实验


  要启动虚拟环境，请使用“**venv**”命令。如果你的计算机上尚未安装该命令，建议你进行安装（可通过 pip3、conda、brew 等方式安装）。有关为你的操作系统安装虚拟环境的更多信息，请参阅“**venv
  - 虚拟环境的创建**”用户指南：[`https://docs.python.org/3/library/venv.html`](https://docs.python.org/3/library/venv.html)


  在命令行窗口中，如果尚未进入“**web-application**”文件夹，请先导航至此文件夹。在命令行中调用 Python 3 的“**venv**”函数，为我们的开发工作创建一个
  Python 3 沙盒区域，以及一个名为“**wineenv**”的文件夹（列表 4-21）。


  ```

  $ python3 -m venv wineenv

  $ source wineenv/bin/activate

  列表 4-21

  启动虚拟环境

  ```


