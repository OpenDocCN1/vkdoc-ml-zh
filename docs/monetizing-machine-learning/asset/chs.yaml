  ## Google Cloud Flexible App Engine


  现在，这是另一个有趣的部分，将我们的应用程序部署到无服务器云中，让全世界都能看到！在介绍章节中，我们了解了标准 App Engine，这次我们将不得不使用 Flexible
  App Engine 来运行更复杂的 Python 库。


  ### Google App Engine


  Google App Engine 是无服务器的，因此你无需考虑 Web 应用程序背后的任何硬件。你无需知道应用程序运行在什么操作系统下，它会自动扩展，Google
  会处理安全补丁，并且你只需为你消耗的资源付费。


  你可以选择两种类型的 App Engine：一种非常简单但可定制性较差，另一种则不然。我们在第 1 章中使用了标准环境；这里由于某些 Python 库的需求，我们需要使用
  Flexible 环境（图 3-16）。


