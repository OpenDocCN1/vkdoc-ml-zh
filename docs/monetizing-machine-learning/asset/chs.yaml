  ## 建模


  在我们的第二个项目中保持简单，将使我们能够专注于全局，并平等地投入到构建 Web 应用程序的每个环节。我们将使用来自“**sklearn**”库的逻辑回归模型。如果你还记得上一章，我们使用了线性回归，它试图预测一个连续变量。而逻辑回归则试图预测一个二元结果，例如真或假、高兴或悲伤等。这两种都是极其常见的模型，但你需要根据试图建模和预测的结果变量类型来选择正确的模型。




  ### 训练/测试集划分


  我们利用 sklearn 中的“**train_test_split()**”函数，通过指定随机种子将数据划分为两个随机数据集。在测试不同方法时，设置“**random_state**”参数是个好习惯，这能确保始终使用相同的划分方式，以便进行公平比较。“**test_size**”参数用于设置测试集的划分比例。此处我们将其设为
  0.5，即 50%，因此函数会随机打乱数据并将其对半分为训练集和测试集。我们将使用训练部分来建模，用测试部分来评估模型的表现。该函数使用起来非常简便（见代码清单
