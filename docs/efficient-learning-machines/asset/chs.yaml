  \n## 隐马尔可夫模型简介\n\n前面的章节讨论了一种以马尔可夫模型为特征的随机过程，其中状态对应于可观测的物理现象。在状态不能直接对应于物理事件的实际问题中，这种模型可能限制性太强，难以实际应用。为了提高其灵活性，你将模型扩展为一种观测输出是状态的概率函数的模型。每个状态可以根据一个独特的概率分布产生多个输出，并且每个不同的输出都可能在任何状态生成。由此产生的模型是双重嵌入的随机模型，称为**隐马尔可夫模型（HMM）**。HMM\
  \ 中的底层随机过程产生一个状态序列，该序列不能直接观测，只能通过另一组产生观测序列的随机过程来近似。\n\n图 5-2 展示了从离散马尔可夫过程扩展到双重随机的\
  \ HMM。新的 HMM 允许从每个状态以有限概率分布发射观测符号。这使得模型比简单的马尔可夫链更具表现力和灵活性。此外，如图 5-3 所示，你可以通过观测符号序列来对物理过程进行建模，这在大多数实际情况下是成立的。与传统马尔可夫链的关键区别在于，在分析观测状态序列时，你无法确切地说出是哪个状态序列产生了这些观测；然而，你可以计算某个特定状态序列产生这些观测的可能性。这表明状态序列是隐藏的，只能通过观测状态或符号的序列来间接观察。\n\
