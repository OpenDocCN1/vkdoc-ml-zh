  ## 应用于阿拉伯语口语数字的改进皮层算法：案例研究


  由于 CA 尚未在自动语音识别（特别是阿拉伯语）中得到广泛应用，以下章节展示了如何将最初在反馈过程中使用的 CA 增强和抑制规则，与添加到 CA 代价函数和权重更新规则中的加权熵概念相结合进行改进。




  ### 基于熵的权重更新规则


  在 CA 的反馈学习阶段，每一层的输出会与期望的激发状态进行比较，并不断更新权重，直到误差项降低到最小阈值。使用最小二乘准则时，较大的误差值对学习过程的影响远大于较小的误差值。对于一类问题，以
  MSE 作为权重更新准则的梯度下降算法可能会陷入局部最小值，从而无法找到最优解。相比之下，采用梯度下降算法的良好形式 CE 准则，能保证在学习过程中收敛到最优解（Wittner
  and Denker 1988）。


