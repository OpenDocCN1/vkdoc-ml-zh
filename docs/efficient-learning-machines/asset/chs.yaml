  \nSpikeProp 算法的弱点包括以下几点：\n\n*   神经元的膜电位是在固定的时间步长间隔内计算的。\n*   没有选择初始权重和阈值的方法。\n*\
  \   需要一个在 t=0 时放电的参考神经元。\n*   由于脉冲响应函数不足，收敛性受到影响。\n\n### SNN 变体与扩展\n\n以下各节将回顾 SNN\
  \ 的变体和扩展。\n\n#### 进化脉冲神经网络\n\n进化脉冲神经网络（eSNN）是一类具有动态架构的 SNN 变体（Schliebs 和 Kasabov\
  \ 2013）。eSNN 使用 Thorpe 模型和群体排名编码来编码信息。eSNN 结合了进化连接系统（ECoS）（Kasabov 2007）架构和 SNN。与\
  \ SNN 相比，eSNN 具有三个优势。首先，eSNN 的计算成本较低，因为它们依赖于一个轻量级的神经元模型，即 Thorpe 模型。其次，eSNN 中的学习算法比\
  \ SNN 中的更有效，后者有 20% 的情况无法收敛（Thiruvarudchelvan, Crane, 和 Bossomaier 2013）。第三，eSNN\
  \ 是在线学习模型，这使其相对于其他技术具有明显优势。\n\n#### 基于储层的进化脉冲神经网络\n\n储层计算（RC）是一个随机且稀疏连接的节点（神经元）框架，用于解决复杂的动态系统。RC\
  \ 分为回声状态机（ESM）（Jaeger 2007）和液体状态机（LSM）（Maass, Natschläger, 和 Markram 2002; Maass\
  \ 2010）两种类型。\n\nLSM 是一种实时计算模型，它接受连续的数据流，并生成高维的连续输出流。LSM 可以看作是一个动态的 SVM 核函数。LSM 的架构由一个液体和一个读出函数组成。液体可以被视为一个具有训练架构的滤波器，用于解决通用问题，例如从同一视频流中识别不同类型的物体。相比之下，读出函数是特定用途的，例如使用不同的读出函数从同一个液体中识别不同的物体。读出函数应该是一个线性判别且无记忆的函数。\n\
  \n#### 动态突触进化脉冲神经网络\n\n动态突触进化脉冲神经网络（deSNN）是一类 eSNN，它在整个学习过程中使用动态权重调整（Kasabov 等人\
  \ 2013）。权重的动态更新使模型能够更有效地捕捉问题的复杂模式。在 deSNN 中，权重会根据到达连接的脉冲而持续轻微变化，这与 eSNN 中权重只更新一次的情况相反。\n\
  \n#### 概率脉冲神经网络\n\n概率脉冲神经网络（pSNN）的神经模型（见图 9-6）使用了三种概率（Kasabov 2010）：\n\n![A978-1-4302-5990-9_9_Fig6_HTML.gif](img/A978-1-4302-5990-9_9_Fig6_HTML.gif)\n\
