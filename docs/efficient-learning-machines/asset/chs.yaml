  \n其中 ![A978-1-4302-5990-9_2_Figaq_HTML.jpg](img/A978-1-4302-5990-9_2_Figaq_HTML.jpg)\
  \ 和 ![A978-1-4302-5990-9_2_Figar_HTML.jpg](img/A978-1-4302-5990-9_2_Figar_HTML.jpg)\
  \ 分别表示用户 n 和用户 a 给出的平均评分。从公式 2-14 和 2-15 可以看出，处理 CF 是一项计算密集型任务，可能需要大量的资源池和更快的计算设备。因此，建议利用\
  \ Hadoop 平台以获得更好的性能和可扩展性。\n\n### 基于项目的协同过滤\n\n基于项目的 CF 计算项目之间的相似度并选择最佳匹配。其思路是找出对两个项目都进行过评分的用户，然后计算它们之间的相似度。用户-项目矩阵表示为：\n\
  \n![A978-1-4302-5990-9_2_Figas_HTML.jpg](img/A978-1-4302-5990-9_2_Figas_HTML.jpg)\n\
  \n![A978-1-4302-5990-9_2_Figat_HTML.jpg](img/A978-1-4302-5990-9_2_Figat_HTML.jpg)\n\
  \n其中 i [m] 对应于所有用户 m 对某个项目的评分，由此产生基于项目的推荐算法。\n\n基于项目的 CF 的第一步是评估项目之间的相似度，并根据最近邻关系对项目进行排列。例如，可以使用余弦相似度矩阵来评估两个项目\
  \ i [m] ,i [b] 之间的相似度。为了在计算相似度时消除用户之间评分尺度的差异，通过从每个共同评分对中减去用户的平均评分 ![A978-1-4302-5990-9_2_Figau_HTML.jpg](img/A978-1-4302-5990-9_2_Figau_HTML.jpg)（Sarwar\
  \ 2001）来调整余弦相似度：\n\n![A978-1-4302-5990-9_2_Figav_HTML.jpg](img/A978-1-4302-5990-9_2_Figav_HTML.jpg)\n\
  \n最后，测试用户 a 对测试项目 m 的预测评分 ![A978-1-4302-5990-9_2_Figaw_HTML.jpg](img/A978-1-4302-5990-9_2_Figaw_HTML.jpg)\
  \ 计算如下：\n\n![A978-1-4302-5990-9_2_Figax_HTML.jpg](img/A978-1-4302-5990-9_2_Figax_HTML.jpg)\n\
  \n用户对某个项目的评分可以通过对同一用户评价过的相似项目的评分取平均值来估计。\n\n### 带加权 λ 正则化的交替最小二乘法\n\n带加权 λ 正则化的交替最小二乘法（ALS-WR）算法将用户-项目矩阵分解为用户-因子矩阵和项目-因子矩阵。该算法致力于揭示能够合理解释观察到的用户-项目评分的潜在因子，并搜索最优的因子权重，以最小化预测评分与实际评分之间的最小二乘误差（Zhou\
  \ 2008）。\n\n如果有多个用户和项目，则需要学习在特征空间中表示每个项目和每个用户的特征向量。目标是揭示能够将每个用户 u 与一个用户-因子向量 ![A978-1-4302-5990-9_2_Figay_HTML.jpg](img/A978-1-4302-5990-9_2_Figay_HTML.jpg)\
  \ 关联起来，并将每个项目 i 与一个项目-因子向量 ![A978-1-4302-5990-9_2_Figaz_HTML.jpg](img/A978-1-4302-5990-9_2_Figaz_HTML.jpg)\
  \ 关联起来的特征。评分由用户-因子向量和项目-因子向量的内积 ![A978-1-4302-5990-9_2_Figba_HTML.jpg](img/A978-1-4302-5990-9_2_Figba_HTML.jpg)\
  \ 来描述。其思想是执行矩阵分解，以便用户和项目可以映射到共同的潜在因子中，从而可以直接进行比较。由于评分矩阵是稀疏的且未完全定义，因此分解必须仅使用已知评分进行。解决方案的质量不仅根据观察到的数据来衡量，还根据未观察数据的泛化能力来衡量。必须找到一组用户和项目特征向量，使得以下代价函数最小化：\n\
  \n![A978-1-4302-5990-9_2_Figbb_HTML.jpg](img/A978-1-4302-5990-9_2_Figbb_HTML.jpg)\n\
  \n其中 ![A978-1-4302-5990-9_2_Figbc_HTML.jpg](img/A978-1-4302-5990-9_2_Figbc_HTML.jpg)\
  \ 和 ![A978-1-4302-5990-9_2_Figbd_HTML.jpg](img/A978-1-4302-5990-9_2_Figbd_HTML.jpg)\
  \ 分别表示用户 u 和项目 i 的评分数量。正则化项 λ(...) 避免了在训练数据上的过拟合。参数 λ 取决于数据，并通过数据集中的交叉验证进行调整以获得更好的泛化能力。由于搜索空间非常大（多个用户和项目），这阻碍了传统直接优化技术（如随机梯度下降）的应用。\n\
  \n当用户-因子或项目-因子固定时，代价函数呈现二次形式，从而可以计算全局最小值。这进而允许进行 ALS 优化，其中通过相互固定对方来交替重新计算用户-因子和项目-因子。该算法专为大规模数据集上的大规模\
  \ CF 而设计。\n\n\n\n## 机器学习：相似度矩阵\n\n相似度矩阵用于衡量数据点之间的相似程度。相似度矩阵与其对应的距离矩阵和替换矩阵密切相关。以下各节将介绍一些常用的相似度计算方法。\n\
  \n### 皮尔逊相关系数\n\n皮尔逊相关衡量两个变量之间的线性依赖关系。皮尔逊相关系数是两个变量（X 和 Y）的协方差除以它们标准差的乘积：\n\n![A978-1-4302-5990-9_2_Figbe_HTML.jpg](img/A978-1-4302-5990-9_2_Figbe_HTML.jpg)\n\
  \n皮尔逊相关系数的取值范围为 −1 到 1。值为 1 表示 X 和 Y 之间存在完美的线性关系，即 X 的数据变异性与 Y 的变异性同步。值为 −1 表示 X\
  \ 和 Y 之间存在反向关系，即 Y 的数据变异性与 X 的变异性相反。值为 0 表示变量 X 和 Y 之间缺乏线性相关性。\n\n尽管皮尔逊系数反映了线性关系的强度，但它对极值和异常值高度敏感。如果两个变量之间存在强曲线关系而非强线性关系，则低关系强度可能会产生误导。如果\
  \ X 和 Y 未在其完整范围内进行分析，该系数也可能产生误导。\n\n### 斯皮尔曼秩相关系数\n\n斯皮尔曼相关系数用于对配对变量 X 和 Y 之间单调关系的强度进行统计分析。斯皮尔曼相关计算的是配对变量秩次值的皮尔逊相关。秩次（从低到高）通过将最低值分配为秩次\
  \ 1，次低值分配为秩次 2，依此类推获得，如下所示：\n\n![A978-1-4302-5990-9_2_Figbf_HTML.jpg](img/A978-1-4302-5990-9_2_Figbf_HTML.jpg)\n\
  \n其中 n 是样本量，d 是变量对统计秩次之间的距离，由下式给出：\n\n![A978-1-4302-5990-9_2_Figbg_HTML.jpg](img/A978-1-4302-5990-9_2_Figbg_HTML.jpg)\n\
  \n斯皮尔曼相关系数的符号表示因变量与自变量之间关联的方向。如果因变量 Y 与自变量 X 同向增加（或减少），则系数为正。如果因变量 Y 相对于自变量 X 反向增加（或减少），则系数为负。斯皮尔曼相关系数为\
  \ 0 表示变量 Y 相对于 X 没有增加或减少的倾向。当 X 和 Y 越接近完美的单调函数时，斯皮尔曼相关的绝对值越大。只有当数据未被截断时，才能计算斯皮尔曼相关。虽然它对极值不太敏感，但它仅依赖于秩次而非观测值。\n\
  \n### 欧几里得距离\n\n欧几里得距离是两个变量向量元素之间差值的平方和的平方根：\n\n![A978-1-4302-5990-9_2_Figbh_HTML.jpg](img/A978-1-4302-5990-9_2_Figbh_HTML.jpg)\n\
  \n只有当两个变量在同一尺度上测量时，欧几里得距离才有效。你可以将公式 2-21 中的距离转换为倒数形式（见公式 2-22），这样如果 X 和 Y（X – Y\
  \ = 0）相似，则返回值为 1；如果相似度降低，则趋向于 0：\n\n![A978-1-4302-5990-9_2_Figbi_HTML.jpg](img/A978-1-4302-5990-9_2_Figbi_HTML.jpg)\n\
  \n你可以验证，如果距离 d(X,Y) = 0（表示相似），则 ![A978-1-4302-5990-9_2_Figbj_HTML.jpg](img/A978-1-4302-5990-9_2_Figbj_HTML.jpg)\
  \ 计算结果为 1；如果 d(X,Y) 增加（表示不相似），则 ![A978-1-4302-5990-9_2_Figbk_HTML.jpg](img/A978-1-4302-5990-9_2_Figbk_HTML.jpg)\
  \ 减小至 0。\n\n### 杰卡德相似系数\n\n杰卡德相似系数通过衡量有限样本集 X 和 Y 之间的重叠程度来评估它们的相似性。集合 X 和 Y 不必大小相同。在数学上，该系数可以定义为样本集（X,\
  \ Y）交集与并集的比值：\n\n![A978-1-4302-5990-9_2_Figbl_HTML.jpg](img/A978-1-4302-5990-9_2_Figbl_HTML.jpg)\n\
  \n杰卡德距离衡量样本集之间的不相似性，通过 1 减去杰卡德系数得到：\n\n![A978-1-4302-5990-9_2_Figbm_HTML.jpg](img/A978-1-4302-5990-9_2_Figbm_HTML.jpg)\n\
  \n杰卡德系数常用于衡量关键词相似度、文档相似度、新闻文章分类、自然语言处理（NLP）等。\n\n## 总结\n\n复杂问题的解决方案依赖于对机器学习技术的智能运用。通过采用不仅能降低特征维度，还能针对特定行为训练模型的技术，可以提高解决方案的精度、速度和准确性。不同的行为属性可以使用诸如\
  \ k-means 之类的聚类技术聚类成多个阶段。对应于每个聚类标签的简化数据点被分离出来，并进行训练以解决回归或分类问题。在正常的训练后操作中，一旦识别出阶段，就会使用与该阶段关联的已训练模型来预测（或估计）反馈回路的输出。\n\
  \n图 2-5 总结了一个过程控制系统，该系统能够感知大量传感器，以控制环境过程（例如，数据中心的冷却）。第一步是降低数据的维度。新数据被输入到聚类方法中，这些方法根据相似的属性和独特的特征，从给定的集合中发现组内的项目。对应于每个聚类标签的数据被分离出来，并分别进行训练以进行分类。阶段识别允许应用一个模型函数，该函数与识别出的阶段相关联。特定阶段模型的输出触发过程控制功能，这些功能作用于环境并改变传感器的输出。此外，这个过程使我们能够主动预测当前阶段的持续时间和即将到来的阶段，并据此预测输出以实现主动控制。\n\
  \n![A978-1-4302-5990-9_2_Fig5_HTML.gif](img/A978-1-4302-5990-9_2_Fig5_HTML.gif)\n\
  \n图 2-5.\n\n基于机器学习的反馈控制系统：特征被转换并输入到阶段检测器；数据分类过程使用在检测到的阶段上训练的模型\n\n"
- "# 3. 用于分类的支持向量机\n\n科学是对经验的系统分类。 ——乔治·亨利·刘易斯\n\n本章详细介绍支持向量机（SVM）技术，这是一种稀疏核决策机器，在构建其学习模型时避免计算后验概率。SVM\
  \ 为机器学习问题提供了一种原则性的方法，因为它具有统计学习理论的数学基础。SVM 根据训练输入的一个子集来构建其解决方案。SVM 已广泛用于分类、回归、新颖性检测任务和特征降维。本章仅关注用于监督分类任务的\
  \ SVM，提供了当输入空间线性可分、线性不可分以及数据不平衡时的 SVM 公式，并附有示例。本章还介绍了对原始 SVM 公式的最新改进和扩展。最后以一个案例研究结束本章。\n\
  \n\n\n## 从几何视角看 SVM\n\n在分类任务中，判别式机器学习技术旨在基于独立同分布（iid）的训练数据集，寻找一个能够正确预测新实例标签的判别函数。与需要计算条件概率分布的生成式机器学习方法不同，判别式分类函数接收数据点\
  \ x 并将其分配到分类任务中的不同类别之一。生成式方法主要用于涉及异常值检测的预测，虽然其能力更强，但判别式方法所需的计算资源和训练数据更少，尤其是在处理多维特征空间或仅需后验概率时。从几何角度来看，学习一个分类器等价于寻找一个多维曲面的方程，该曲面能在特征空间中最优地分隔不同类别。\n\
  \nSVM 是一种判别式技术，由于它能解析地求解凸优化问题，因此总能返回相同的**最优超平面参数**——这与遗传算法（GA）或感知机形成对比，后两者在机器学习分类中也被广泛使用。对于感知机而言，其解高度依赖于初始化和终止条件。\n\
  \n对于将数据从输入空间转换到特征空间的特定核函数，训练过程会为给定的训练集返回唯一确定的 SVM 模型参数，而感知机和 GA 分类器模型在每次训练初始化时都会得到不同的结果。GA\
  \ 和感知机的目标仅是在训练期间最小化误差，这会导致多个超平面满足这一要求。如果在训练阶段可以学习到多个超平面，那么只有最优的那个会被保留，因为训练实际上是在总体的样本上进行的，尽管测试数据可能不呈现与训练集相同的分布。当使用不能代表整体数据总体的数据进行训练时，超平面容易产生较差的泛化能力。\n\
  \n图 3-1 展示了在二维、二类数据上，使用 SVM、感知机和 GA 分类器得到的不同超平面。被圆圈包围的点代表支持向量，而对应于不同分类器的超平面根据图例以不同颜色显示。\n\
  \n![A978-1-4302-5990-9_3_Fig1_HTML.gif](img/A978-1-4302-5990-9_3_Fig1_HTML.gif)\n\
  \n图 3-1.\n\nSVM、感知机和 GA 超平面的二维二类图 注：SVM 与 ANN 对比\n\n总的来说，SVM 源于一套稳健的实现理论，而人工神经网络（ANN）则是启发式地从应用走向理论。\n\
  \nSVM 与 ANN 的区别在于，它不受经典的多局部极小值问题——即维数灾难和过拟合的双重诅咒——的影响。当机器学习模型力求在所有训练数据上实现零误差时，就会发生过拟合。对于训练指标依赖于平方误差和变体的机器学习方法，过拟合更可能发生。与\
  \ ANN 通过最小化经验风险不同，SVM 通过最小化结构风险来避免过拟合。\n\nSVM 不像 ANN 那样通过限制特征集来控制模型复杂度；相反，它通过选择支持向量的数量来自动确定模型复杂度。\n\
  \n## SVM 的主要特性\n\nSVM 深深植根于统计学、优化和机器学习的原理，由 Boser、Guyon 和 Vapnik（1992）在第五届年度计算机协会计算学习理论研讨会上正式提出。[Bartlett（1998）正式揭示了硬间隔\
  \ SVM 泛化能力的统计界限。] SVM 依赖于假设空间的复杂度和经验误差（衡量模型拟合训练数据程度的指标）。Vapnik-Chervonenkis（VC）理论证明了风险存在\
  \ VC 界限。VC 是假设空间复杂度的一种度量。假设 H 的 VC 维度与 H 能够打散的最大点数相关。如果 H 能正确地将所有正实例与负实例分开，则 H 打散了\
  \ N 个点。换句话说，VC 容量等于模型能够将其分离成 2^N 种不同标签的训练点数 N。该容量与可用的训练数据量有关。VC 维度 h 影响泛化误差，其界限由下式给出：![A978-1-4302-5990-9_3_Figa_HTML.jpg](img/A978-1-4302-5990-9_3_Figa_HTML.jpg)，其中\
  \ w 是分离超平面的权重向量，R 是包含所有训练点的最小球体的半径。机器学习模型的总误差由 ε = ε[emp] + ε[g] 组成，其中 ε[emp] 是训练误差，ε[g]\
  \ 是泛化误差。模型 f 的经验风险为 ![A978-1-4302-5990-9_3_Figb_HTML.jpg](img/A978-1-4302-5990-9_3_Figb_HTML.jpg)。\n\
  \n风险的下界为 ![A978-1-4302-5990-9_3_Figc_HTML.jpg](img/A978-1-4302-5990-9_3_Figc_HTML.jpg)，其中\
  \ ![A978-1-4302-5990-9_3_Figd_HTML.jpg](img/A978-1-4302-5990-9_3_Figd_HTML.jpg)\
  \ 是该界限对于 VC 维度为 h 的函数类中任何函数成立的概率，且与数据分布无关。\n\n注\n\n可以定义 2^N 个不同的学习问题，因为 N 个点可以以\
  \ 2^N 种方式被标记为正或负。例如，对于三个点，有 24 种不同的标签和 8 种不同的可学习分类边界。因此，在 R² 中的 VC 维度是 3。\n\nSVM\
  \ 优雅地将 20 世纪 60 年代研究中已经提出的多个特征组合在一起，形成了所谓的最大间隔分类器。SVM 借鉴了大间隔超平面（Duda 1973；Cover\
  \ 1995；Vapnik 和 Lerner 1963；Vapnik 和 Chervonenkis 1964）、作为特征空间内积的核函数（Aizermann、Braverman\
  \ 和 Rozonoer 1964）、核函数的使用（Aizermann、Braverman 和 Rozonoer 1964；Wahba 1990；Poggio\
  \ 1990）以及稀疏性（Cover 1995）等概念。Mangasarian（1965）也提出了一种类似于 SVM 所采用的优化方法。用于处理数据中的噪声和不可分性的松弛变量概念最初由\
  \ Smith（1968）引入，并由 Bennett 和 Mangasarian（1992）进一步改进。Cortes（1995）将其纳入 SVM 公式，软间隔\
  \ SVM 通过采用松弛变量的概念来处理分离边界处的噪声数据，从而成为硬间隔 SVM 的一种改进。（对于有兴趣深入探究 SVM 基础的读者，可参阅 Vapnik\
  \ 1998、1999 年对 SVM 理论的详尽论述。）\n\nSVM 以其稳健性、良好的泛化能力和唯一的全局最优解而闻名，可能是监督学习中最流行的机器学习方法，但其原理却非常简单。Meyer、Leisch\
  \ 和 Hornik（2003）在 21 个数据集上将 SVM 与 16 种分类器进行比较，结果表明 SVM 是机器学习中最强大的分类器之一。自 1992 年问世以来，SVM\
  \ 已广泛应用于众多领域，例如天气预报、功率估算、股票预测、缺陷分类、说话人识别、笔迹识别、图像和音频处理、视频分析以及医学诊断。\n\nSVM 之所以成为一个有吸引力的机器学习框架，可归纳为以下特性：\n\
  \n\n\n*   SVM 是一种稀疏技术。与非参数方法类似，SVM 要求在训练阶段（即学习 SVM 模型参数时）所有训练数据都可用，并存储在内存中。然而，一旦模型参数确定，SVM\
  \ 仅依赖这些训练实例的一个子集（称为支持向量）来进行未来预测。支持向量定义了超平面的边界。支持向量是在一个优化步骤之后找到的，该步骤涉及一个由误差项和约束条件通过拉格朗日松弛法正则化的目标函数。¹\
  \ 使用 SVM 进行分类任务的复杂度取决于支持向量的数量，而非输入空间的维度。最终从原始数据集中保留的支持向量数量取决于数据本身，并会根据数据复杂度（由数据维度和类别可分性决定）而变化。支持向量数量的上限是训练数据集大小的一半，但在实践中很少达到这个上限。本章中数学描述的\
  \ SVM 模型被表示为支持向量的加权和，这使得 SVM 框架在测试计算时间和存储需求方面具有与参数化技术相同的优势。\n*   SVM 是一种核技术。SVM\
  \ 使用核技巧将数据映射到更高维的空间，然后将机器学习任务作为一个凸优化问题来解决，在该问题中，最优解是通过解析方式而非启发式方式找到的，这与其它机器学习技术不同。通常，现实生活中的数据在原始输入空间中并非线性可分。换句话说，具有不同标签的实例以某种方式共享输入空间，从而阻止线性超平面正确分离分类任务中涉及的不同类别。尝试在输入空间中学习非线性分离边界会增加优化阶段的计算需求，因为分离曲面至少是二阶的。相反，SVM\
  \ 使用预定义的核函数将数据映射到一个新的、更高维的空间，在该空间中，线性分类器将能够区分不同的类别。因此，SVM 的优化阶段将仅涉及在映射空间中学习一个线性判别曲面。当然，核函数的选择和设置对于\
  \ SVM 的最优性至关重要。\n*   SVM 是一种最大间隔分类器。除了基于训练数据集最小化误差或代价函数（类似于其他判别式机器学习技术）之外，SVM 还对优化问题施加了一个额外的约束：超平面需要被定位在距离不同类别最大距离的位置。这样的项迫使优化步骤找到最终能更好泛化的超平面，因为它位于与各类别等距且距离最大的位置。这一点至关重要，因为训练是在总体的一个样本上进行的，而预测则要在尚未见过的实例上进行，这些实例的分布可能与训练子集的分布略有不同。\n\
  \nSVM 使用结构风险最小化（SRM），并满足对偶性和凸性要求。SRM（Vapnik 1964）是一种归纳原则，用于从有限的训练数据集中选择模型进行学习。作为容量控制的指标，SRM\
  \ 提出了 VC 维度（即假设空间复杂度）与经验误差之间的权衡。SRM 的公式是一个凸优化问题，其代价函数中有 n 个变量需要最大化，并带有 m 个约束条件，可在多项式时间内求解。SRM\
  \ 使用一组按复杂度递增顺序排列的模型。图 3-2 展示了整体模型误差如何随机器学习模型的复杂度指标变化。对于非复杂模型，误差很高，因为简单模型无法捕捉数据的所有复杂性，导致欠拟合情况。随着复杂度指标的增加，误差在最优模型（索引为\
  \ h*）处达到最小值，之后又开始增加。对于高模型指标，结构开始使其学习模型适应训练数据，这会导致过拟合，从而降低训练误差值并增加模型的 VC 维度，但代价是测试误差的恶化。\n\
  \n![A978-1-4302-5990-9_3_Fig2_HTML.gif](img/A978-1-4302-5990-9_3_Fig2_HTML.gif)\n\
  \n图 3-2.\n\n误差趋势与模型指标之间的关系\n\n\n\n## 硬间隔支持向量机\n\nSVM 技术是一种分类器，它寻找一个超平面或函数 ![A978-1-4302-5990-9_3_Fige_HTML.jpg](img/A978-1-4302-5990-9_3_Fige_HTML.jpg)，以最大间隔正确分离两个类别。图\
  \ 3-3 展示了一个对应于硬间隔 SVM（也称为线性 SVM）的分离超平面。\n\n![A978-1-4302-5990-9_3_Fig3_HTML.gif](img/A978-1-4302-5990-9_3_Fig3_HTML.gif)\n\
  \n图 3-3.\n\n硬最大间隔分离超平面\n\n从数学上讲，给定一组属于两个线性可分类别 ω[1]、ω[2] 的点 x [i]，任何实例到超平面的距离等于\
  \ ![A978-1-4302-5990-9_3_Figf_HTML.jpg](img/A978-1-4302-5990-9_3_Figf_HTML.jpg)。SVM\
  \ 的目标是找到 w、b，使得对于属于类别 ω[1] 的最近数据点，g(x) 的值等于 1，而对于 ω[2] 的最近数据点，其值等于 –1。\n\n这可以看作具有一个间隔：\n\
  \n![A978-1-4302-5990-9_3_Figg_HTML.jpg](img/A978-1-4302-5990-9_3_Figg_HTML.jpg)\n\
  \n其中 ![A978-1-4302-5990-9_3_Figh_HTML.jpg](img/A978-1-4302-5990-9_3_Figh_HTML.jpg)\
  \ 且 ![A978-1-4302-5990-9_3_Figi_HTML.jpg](img/A978-1-4302-5990-9_3_Figi_HTML.jpg)。\n\
  \n这导致了一个优化问题，即最小化目标函数：\n\n![A978-1-4302-5990-9_3_Figj_HTML.jpg](img/A978-1-4302-5990-9_3_Figj_HTML.jpg)\n\
  \n并满足约束条件：\n\n![A978-1-4302-5990-9_3_Figk_HTML.jpg](img/A978-1-4302-5990-9_3_Figk_HTML.jpg)\n\
  \n当一个优化问题（无论是最小化还是最大化）在待优化的变量中存在约束时，代价函数或误差函数会通过添加乘以拉格朗日乘子的约束条件来进行增广。\n\n换句话说，SVM\
  \ 的拉格朗日函数是通过用约束条件的加权和来增广目标函数而形成的：\n\n![A978-1-4302-5990-9_3_Figl_HTML.jpg](img/A978-1-4302-5990-9_3_Figl_HTML.jpg)\n\
  \n其中 w 和 b 被称为原始变量，λ [i] 是拉格朗日乘子。\n\n因此，这些乘子将解的搜索空间限制在给定约束条件下的可行值集合内。在存在不等式约束的情况下，卡罗需-库恩-塔克（KKT）条件推广了拉格朗日乘子法。\n\
  \nKKT 条件如下：\n\n原始约束\n\n![A978-1-4302-5990-9_3_Figm_HTML.jpg](img/A978-1-4302-5990-9_3_Figm_HTML.jpg)\n\
  \n对偶约束\n\n![A978-1-4302-5990-9_3_Fign_HTML.jpg](img/A978-1-4302-5990-9_3_Fign_HTML.jpg)\n\
  \n互补松弛性\n\n![A978-1-4302-5990-9_3_Figo_HTML.jpg](img/A978-1-4302-5990-9_3_Figo_HTML.jpg)\n\
  \n拉格朗日函数的梯度（相对于原始变量为零）\n\n![A978-1-4302-5990-9_3_Figp_HTML.jpg](img/A978-1-4302-5990-9_3_Figp_HTML.jpg)\n\
  \n基于 KKT 条件：\n\n![A978-1-4302-5990-9_3_Figq_HTML.jpg](img/A978-1-4302-5990-9_3_Figq_HTML.jpg)\n\
  \n![A978-1-4302-5990-9_3_Figr_HTML.jpg](img/A978-1-4302-5990-9_3_Figr_HTML.jpg)\n\
  \n注意\n\n这些条件出现在 Kuhn 和 Tucker（1951）的一项研究中，也见于 Karush（1939）未发表的硕士论文。\n\n由于大多数线性规划问题成对出现，一个具有\
  \ n 个变量和 m 个约束的原始问题可以重写为具有 m 个变量和 n 个约束的 Wolfe 对偶形式，而原始和对偶形式适用相同的解。对偶定理对此进行了形式化，指出一种形式的变量数量等于互补形式的约束数量。互补松弛性是原始形式和对偶形式之间的关系：当将其添加到不等式中时，松弛变量会将它们转化为等式。\n\
  \nSVM 优化的对偶问题是寻找：\n\n![A978-1-4302-5990-9_3_Figs_HTML.jpg](img/A978-1-4302-5990-9_3_Figs_HTML.jpg)\n\
  \n并满足：\n\n![A978-1-4302-5990-9_3_Figt_HTML.jpg](img/A978-1-4302-5990-9_3_Figt_HTML.jpg)\n\
  \n![A978-1-4302-5990-9_3_Figu_HTML.jpg](img/A978-1-4302-5990-9_3_Figu_HTML.jpg)\n\
  \n注意\n\n最后一个约束对于解的最优性至关重要。在最优解处，对偶变量必须非负，因为对偶变量乘以一个正数。由于负的拉格朗日乘子会降低函数值，因此最优解不能有负的拉格朗日乘子。有效或起作用的约束具有相应的非零乘子，而不起作用的约束乘子为零，并且不影响问题的解。因此，SVM\
  \ 超平面参数由有效、起作用的约束定义，这些约束对应于非零的拉格朗日乘子，即支持向量。\n\n求解上述问题的对偶形式有若干好处。首先，即使原始问题不是凸的，对偶问题也总是具有唯一的最优解。其次，目标函数的值是原始问题最优函数值的下界。最后，对偶变量的数量可能远少于原始变量的数量；因此，以对偶形式表述的优化问题可以更快、更高效地求解。\n\
  \n## 软间隔支持向量机\n\n当数据不完全可分时，如图 3-4 中用 X 标记的点所示，松弛变量 ξ[i] 被引入 SVM 目标函数，以允许分类错误。在这种情况下，SVM\
  \ 不再寻找能够完美分类所有数据的硬间隔。相反，SVM 现在是一个软间隔分类器；也就是说，SVM 正确分类了大部分数据，同时允许模型在分离边界附近错误分类少数点。\n\
  \n![A978-1-4302-5990-9_3_Fig4_HTML.gif](img/A978-1-4302-5990-9_3_Fig4_HTML.gif)\n\
  \n图 3-4.\n\n作为软间隔 SVM 一部分的少量错误分类\n\n现在，原始形式的问题是最小化目标函数：\n\n![A978-1-4302-5990-9_3_Figv_HTML.jpg](img/A978-1-4302-5990-9_3_Figv_HTML.jpg)\n\
  \n并满足以下两个约束条件：\n\n![A978-1-4302-5990-9_3_Figw_HTML.jpg](img/A978-1-4302-5990-9_3_Figw_HTML.jpg)\n\
  \n![A978-1-4302-5990-9_3_Figx_HTML.jpg](img/A978-1-4302-5990-9_3_Figx_HTML.jpg)\n\
  \n正则化项或盒约束 C 是一个参数，其值根据优化目标而变化。随着 C 的增加，会得到更紧的间隔，并且更侧重于最小化错误分类的数量。随着 C 的减小，允许更多的违规，因为最大化两个类别之间的间隔成为\
  \ SVM 的目标。图 3-5 展示了正则化参数对间隔宽度和错误分类的影响。对于 ![A978-1-4302-5990-9_3_Figy_HTML.jpg](img/A978-1-4302-5990-9_3_Figy_HTML.jpg)，C\
  \ [2] 的间隔内训练点少于 C [1]，但后者具有更宽的间隔。\n\n![A978-1-4302-5990-9_3_Fig5_HTML.gif](img/A978-1-4302-5990-9_3_Fig5_HTML.gif)\n\
  \n图 3-5.\n\n盒约束对 SVM 性能的影响\n\n在对偶形式中，软间隔 SVM 的公式为：\n\n![A978-1-4302-5990-9_3_Figz_HTML.jpg](img/A978-1-4302-5990-9_3_Figz_HTML.jpg)\n\
  \n并满足：\n\n![A978-1-4302-5990-9_3_Figaa_HTML.jpg](img/A978-1-4302-5990-9_3_Figaa_HTML.jpg)\n\
  \n![A978-1-4302-5990-9_3_Figab_HTML.jpg](img/A978-1-4302-5990-9_3_Figab_HTML.jpg)\n\
  \n软间隔对偶问题与硬间隔对偶问题等价，只是对偶变量受正则化参数 C 的上界约束。\n\n\n\n## 核 SVM\n\n当问题在输入空间中线性不可分时，软间隔\
  \ SVM 无法找到一个既能最小化误分类数据点数量，又能具备良好泛化能力的鲁棒分离超平面。为此，可以使用核函数将数据转换到更高维的空间（称为核空间），在该空间中数据将变得线性可分。因此，可以在核空间中获取一个线性超平面来分离分类任务中涉及的不同类别，而无需在输入空间中求解高阶的分离超曲面。这是一种有吸引力的方法，因为与学习非线性曲面相比，进入核空间的开销微不足道。\n\
  \n核函数应是一个厄米且半正定的矩阵，并且需要满足 Mercer 定理，这转化为在所有数据点对上评估核矩阵或 Gram 矩阵，使其为正且半正定，形成\n\n![A978-1-4302-5990-9_3_Figac_HTML.jpg](img/A978-1-4302-5990-9_3_Figac_HTML.jpg)\n\
  \n其中 ϕ(x) 属于希尔伯特空间。\n\n换句话说，![A978-1-4302-5990-9_3_Figad_HTML.jpg](img/A978-1-4302-5990-9_3_Figad_HTML.jpg)\n\
  \n一些常用的核函数包括：\n\n*   线性核：![A978-1-4302-5990-9_3_Figae_HTML.jpg](img/A978-1-4302-5990-9_3_Figae_HTML.jpg)\n\
  *   多项式函数：![A978-1-4302-5990-9_3_Figaf_HTML.jpg](img/A978-1-4302-5990-9_3_Figaf_HTML.jpg)\n\
  *   双曲正切（Sigmoid）：![A978-1-4302-5990-9_3_Figag_HTML.jpg](img/A978-1-4302-5990-9_3_Figag_HTML.jpg)\n\
  *   高斯径向基函数（RBF）：![A978-1-4302-5990-9_3_Figah_HTML.jpg](img/A978-1-4302-5990-9_3_Figah_HTML.jpg)\n\
  *   拉普拉斯径向基函数：![A978-1-4302-5990-9_3_Figai_HTML.jpg](img/A978-1-4302-5990-9_3_Figai_HTML.jpg)\n\
  *   随机区组方差分析（ANOVA RB）核：![A978-1-4302-5990-9_3_Figaj_HTML.jpg](img/A978-1-4302-5990-9_3_Figaj_HTML.jpg)\n\
  *   一维线性样条核：![A978-1-4302-5990-9_3_Figak_HTML.jpg](img/A978-1-4302-5990-9_3_Figak_HTML.jpg)\n\
  \n核函数的选择在很大程度上取决于数据的具体情况。例如，线性核（所有核中最简单的一种）适用于大型稀疏数据向量。然而，它的性能不如多项式核，后者可以避免 Hessian\
  \ 矩阵归零。多项式核广泛应用于图像处理，而 ANOVA RB 核通常保留用于回归任务。高斯和拉普拉斯 RBF 是通用核，主要在没有先验知识的情况下使用。如果最终得到的核矩阵是对角矩阵，则表明特征空间是冗余的，应在特征降维后尝试其他核函数。\n\
  \n请注意，当使用核函数将特征向量从输入空间转换到核空间以处理线性不可分数据集时，对于大数据而言，核矩阵的计算需要大量的内存和计算资源。\n\n图 3-6 展示了二维异或（XOR）数据，这是一种在输入空间（左上）以及特征空间中均线性不可分的分布。在特征空间中，应用核函数后，为四个输入创建了\
  \ 16 个点（针对不同的集合）。高斯 RBF 核平滑参数 σ² 的选择会影响数据在核空间中的分布。由于参数值的选择对于将数据从线性不可分空间转换为线性可分空间至关重要，因此会执行网格搜索来寻找最合适的值。\n\
