  \ Ritz 值和 Ritz 向量。对于特征值，如果 Lanczos 迭代次数相对于 k 足够大，则可以计算 T [mm] 的 k 个最小或最大特征值。如此生成的\
  \ Lanczos 向量 v [i] 随后构成变换矩阵：\n\n![A978-1-4302-5990-9_2_Figak_HTML.jpg](img/A978-1-4302-5990-9_2_Figak_HTML.jpg)\n\
  \n该矩阵可用于生成 Ritz 特征向量 (V [m] ·u [m] )，即原始矩阵的近似特征向量。\n\n## 机器学习：协同过滤\n\n协同过滤（CF）被推荐系统所使用，其目标是根据集体用户经验（协作）来预测用户对给定项目的兴趣。主要目标是匹配具有相似兴趣的人，以生成个性化推荐。例如，假设有\
