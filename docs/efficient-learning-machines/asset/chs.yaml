  \ 且 ![A978-1-4302-5990-9_10_Figl_HTML.jpg](img/A978-1-4302-5990-9_10_Figl_HTML.jpg)，则\
  \ ![A978-1-4302-5990-9_10_Figm_HTML.jpg](img/A978-1-4302-5990-9_10_Figm_HTML.jpg)。这一性质使我们能够识别出哪些解不被解集\
  \ X 中的任何成员支配 ![A978-1-4302-5990-9_10_Fign_HTML.jpg](img/A978-1-4302-5990-9_10_Fign_HTML.jpg)\
  \ (X̂)。这些在整个可行搜索空间中的非支配集 ![A978-1-4302-5990-9_10_Figo_HTML.jpg](img/A978-1-4302-5990-9_10_Figo_HTML.jpg)\
  \ (X̂) 被称为全局帕累托最优集。\n\n生成帕累托集的计算成本可能很高。因此，你需要选择一种计算效率高的方法来确定多目标优化算法的帕累托最优集。尽管你可以采用许多不同的方法来解决多目标优化问题，但在进化多目标优化领域，关于帕累托集近似的研究已经做了大量工作。\n\
  \n### 性能度量\n\n为了评估解的性能，制定一个量化非支配帕累托前沿质量的度量方案至关重要。多目标优化算法的一般性能标准可总结如下：其中，\n\n收敛性\
  \ (γ)：估计候选非支配（帕累托）解与已知最佳预测或已知帕累托最优解集之间的接近程度。对于使用算法获得的每个解，你可以使用到帕累托最优前沿的最小欧几里得距离（Deb,\
  \ Pratap, and Agarwal 2002）。平均距离可用作收敛性度量。γ 值越小，表示收敛性越好。  \n多样性 (Δ)：为决策者提供高效的选择。由于你关注的是覆盖整个帕累托最优区域的解，因此需要评估所获得解之间的分布程度。\
  \  \n位移 (D)：在算法近似或存在不连续帕累托最优前沿的情况下，可能仅反映了真实最优前沿的一部分。位移用于克服这一局限性。位移衡量候选解集与已知帕累托最优解集之间的相对接近程度。数学上，位移可表示为\
  \ ![A978-1-4302-5990-9_10_Figp_HTML.jpg](img/A978-1-4302-5990-9_10_Figp_HTML.jpg)\
  \  \n\n其中，\n\nP* = 来自真实帕累托最优前沿的均匀分布解\n\nQ = 最终解\n\nd(I, j) = P* 的第 i 个解与 Q 的第 j\
  \ 个解之间的欧几里得距离\n\n较低的位移值表示更好的收敛性和覆盖度。\n\n每种算法可能会选择一个或多个性能标准来测试解的质量。在许多情况下，性能标准可能取决于已知帕累托最优集集合的可用性（或不可用性）。本章的其余部分将探讨基于进化学习方法的各种多目标优化解决方案。\n\
  \n## 机器学习：进化算法\n\n生成帕累托集的计算成本可能很高，因为多目标优化问题不再只有一个最优解，而是有一整套潜在解。经典优化器（Marler and\
  \ Arora 2004）包括加权和法、扰动法、切比雪夫法、目标规划法和最小-最大法。尽管这些方法可用于多准则优化，但每次模拟运行只能获得一个解；模拟需要多次执行，并期望其中某个解可能导向帕累托最优解。进化算法非常适合解决多目标优化问题，因为它们模仿了本质上就是多目标的自然过程；一次模拟运行就能捕获多个帕累托最优解。此外，进化算法对帕累托前沿的形状或连续性不太敏感。这些算法已成功应用于广泛的组合问题，在这些问题中，来自多个来源的信息被整合在一起以实现最优解。这类算法在涉及设计和优化的应用中尤其有用，这些应用通常变量众多，且过程算法要么不存在，要么极其复杂。通常，进化方法是基于种群的元启发式优化算法，模仿自然进化的原理。这些方法使用解的初始种群，并在每一代中更新，以收敛到单个最优解。尽管进化算法不能保证找到真正的最优解，但它们试图找到一个良好的近似解，代表一个接近帕累托最优的解。\n\
  \n进化算法通常分为四大类：(1) 遗传算法，(2) 遗传编程，(3) 进化编程，以及 (4) 进化策略。尽管这些算法采用不同的方法，但它们都从自然选择原理中汲取灵感。进化算法涉及的基本过程是选择、变异和交叉。进化算法的第一阶段涉及应用适应度因子来评估目标空间中的种群（代表解的质量）。接下来，通过使用随机选择或基于似然性的选择标准，从前一步骤的种群中选择个体，从而创建一个交配池。交配池组织好后，对其进行重组和变异，产生一个新的种群集。重组过程执行\
  \ n 点交叉，具有可配置的概率，允许一个亲本的片段与另一个亲本的片段结合，以创建全新的子代种群。交配选择是进化算法过程中的关键步骤，因为它试图选择有前景的解，其假设是，由于高质量选择而产生的未来交配池往往更优越。变异算子根据给定的变异率，通过对相关向量进行微小改变来修改个体。鉴于交配和变异过程的概率性质，某些种群可能不会发生任何变化，而只是复制到下一代。\n\
  \n类似于自然进化，个体代表可能的解，一组个体（或可能的解）称为一个种群。每个个体都使用特定于问题的编码方案进行编码，该方案可以被解码并由适应度函数评估。交配过程通过重组和变异修改现有种群以进化出新种群，并不断迭代。每次循环迭代称为一代，它代表了进化过程中的一个时间线。\n\
  \n\n\n多目标进化算法领域的早期工作归功于大卫·谢弗，他实现了向量评估遗传算法（VEGA）（Schaffer 1985）。Goldberg（1989）提出根据帕累托支配关系计算个体适应度。此后，人们提出了多种多目标进化算法的变体（本章将介绍其中一些较为流行的算法）。\n\
  \n### 遗传算法\n\n遗传算法遵循自然选择原理（见图 10-2），其中每个解被表示为二进制（或实数）编码的字符串（染色体），并附带一个相关的适应度度量。连续的解作为进化过程的一部分被构建，在该过程中，一组选定的个体解会产生另一组用于下一代的解。适应度高的个体更有可能被选入交配池，这是基于它们将在下一代中产生更优解的假设。适应度较弱的解则自然被淘汰。通常，你可以使用轮盘赌选择来模拟自然选择，在这种方法中，功能适应度更高的解被淘汰的可能性虽然存在，但较小。在该方法中，每个可能的选择在轮盘上被分配一个与其适应度值成比例的区域，然后进行随机选择，类似于旋转轮盘赌轮。同时，也存在较小的可能性，即一些较弱的解会在选择过程中幸存下来，因为它们可能包含在交叉过程后被证明有用的组件（基因）。从数学上讲，选择某个潜在解的可能性由下式给出：\n\
  \n![A978-1-4302-5990-9_10_Fig2_HTML.gif](img/A978-1-4302-5990-9_10_Fig2_HTML.gif)\n\
  \n图 10-2.\n\n遗传算法的基本流程\n\n![A978-1-4302-5990-9_10_Figq_HTML.jpg](img/A978-1-4302-5990-9_10_Figq_HTML.jpg)\n\
  \n其中 P [i] 表示第 i 个解被选入交配池的可能性，F [i] 表示第 i 个个体解的操作适应度，N 是种群中解元素的总数。遗传算法已被证明在解决具有大型搜索空间且因领域知识匮乏而难以理解的复杂问题方面非常有用。遗传算法的染色体代表了问题解的基本构建块（等位基因），这些构建块适用于遗传算子和适应度函数。候选解通过使用交叉和变异函数进行修改，并产生新的候选解，这些新候选解将接受评估，以确定其是否有资格进入新的交配池。\n\
  \n### 遗传编程\n\n遗传编程是一种进化技术，它将遗传学习范式扩展到计算机程序的自主合成中，这些程序在执行时会产生候选解。与遗传算法不同，在遗传算法中，种群是代表候选解的固定长度编码字符串；而在遗传编程中，种群是由语法树（也称为解析树）表示的程序。遗传编程通过迭代地进化程序种群，运用遗传操作（交叉和变异）将一组程序转换为另一组程序。交叉函数是通过在种群中两个父代个体（根据适应度标准选择）的随机交叉点处交换子树来实现的。交叉通过用第二个父代的子树替换第一个父代在交叉点处的子树来创建后代。在子树变异（最常用的变异形式）中，随机选择的变异点处的子树被随机生成的树的子树所替换。\n\
  \n图 10-3 展示了使用两个变量 x 和 y 以及前缀表示法来表达数学运算符的遗传编程方法的一般流程和交叉操作。父代 1 [+(*(x, y),2)] 与父代\
  \ 2 [*(+(x,1),/(y,2))] 交叉，产生一个由 [+(/(y,2)),2)] 表示的后代。在遗传编程中，通常使用这种前缀表示法来表示表达式。\n\
  \n![A978-1-4302-5990-9_10_Fig3_HTML.gif](img/A978-1-4302-5990-9_10_Fig3_HTML.gif)\n\
  \n图 10-3.\n\n带有交叉操作的遗传编程基本流程；在两个父代上选择随机交叉点后，父代 1 的一部分与父代 2 的一部分连接，以创建一个后代\n\n##\
  \ 多目标优化：一种进化方法\n\n在单目标优化中，为了评估解的质量，你只需测量目标函数的值。在多目标优化的情况下，可能无法评估解相对于最优帕累托近似的质量，因为你可能不掌握关于目标空间或覆盖范围的相关信息，因此可能无法根据与最优帕累托集的接近程度和覆盖范围的多样性来定义解的质量。即使一个解支配另一个解，你可能仍然无法量化相对改进，因为仅凭相对距离和多样性不足以量化帕累托集近似。这引出了定义实现多目标进化算法策略的基本要求。这些要求可以总结如下：\n\
  \n*   **适应度**：引导解更接近帕累托集。这需要构建一个满足多个优化标准的标量适应度函数。\n*   **多样性改进**：通过选择一组多样化的非支配解来提高覆盖范围。这避免了在目标空间和决策空间中出现相同解的情况。\n\
  *   **精英主义**：防止非支配解被淘汰。\n\n大多数进化算法在处理适应度、多样性和精英主义的方式上有所不同。以下列出了一些最流行的多目标进化算法方法：\n\
  \n*   加权求和法\n*   向量评估遗传算法（VEGA）（Schaffer 1985）\n*   多目标遗传算法（MOGA）（Fonseca and Fleming\
  \ 1993）\n*   小生境帕累托遗传算法（NPGA）（Horn, Nafpliotis, and Goldberg 1994）\n*   非支配排序遗传算法（NSGA）（Nidamarthi\
  \ and Deb 1994）\n*   强度帕累托进化算法（SPEA）（Zitzler and Thiele 1999）\n*   强度帕累托进化算法 II（SPEA-II）（Zitzler,\
  \ Laumanns, and Thiele 2001）\n*   帕累托存档进化策略（PAES）（Knowles and Corne 1999）\n*   基于帕累托包络的选择算法（PESA）（Corne,\
  \ Knowles, and Oates 2000）\n*   基于帕累托包络的选择算法 II（PESA-II）（Corne et al. 2001）\n* \
  \  精英非支配排序遗传算法（NSGA-II）（Deb, Pratap, and Agarwal 2002）\n\n这些方法将在以下各节中依次介绍。\n\n###\
  \ 加权求和法\n\n用于多目标优化的加权求和法通过一致地改变权重来提供多个解点。不同的目标被合并为一个单一目标，并使用可配置的权重来最小化复合函数。从数学上讲，加权求和法可以表示为：\n\
  \n![A978-1-4302-5990-9_10_Figr_HTML.jpg](img/A978-1-4302-5990-9_10_Figr_HTML.jpg)\n\
  \n对于正权重，最小化 F 可以得到一个帕累托最优解。尽管这种方法计算效率高，但主要缺点在于，对于一个信息很少或没有信息的问题，它无法确定能够最优缩放目标函数的权重。\n\
  \n\n\n### 向量评估遗传算法\n\nVEGA 是一种基于种群的算法，它扩展了简单遗传算法（SGA）的选择算子，使得每一代通过比例选择方案产生若干不相交的子种群，并由不同的目标函数控制。对于一个具有\
  \ m 个目标且总种群规模为 N 的问题，会生成 m 个规模为 N / m 的子种群，每个子种群由其各自的适应度函数生成。如图 10-4 所示，这些子种群被混合在一起，生成一个规模为\
  \ N 的新种群。该方案高效且易于实现，因为它仅修改了 SGA 的选择方法。\n\n![A978-1-4302-5990-9_10_Fig4_HTML.gif](img/A978-1-4302-5990-9_10_Fig4_HTML.gif)\n\
  \n图 10-4.\n\nVEGA 的基本流程\n\n由于比例选择，VEGA 中所有子种群的混合与合并操作导致了一种聚合方法。该方案的缺点是无法在帕累托最优前沿上找到大量点，因为每个解都执行其自身的适应度函数。由于目标空间中沿坐标轴的并行搜索方向或同时执行多个目标函数，VEGA\
  \ 容易找到极端解。\n\n### 多目标遗传算法\n\nMOGA 是 SGA 的另一种变体，其不同之处在于适应度分配给解的方式。在该方案中，使用以下表达式为每个解分配等级\
  \ R：\n\n![A978-1-4302-5990-9_10_Figs_HTML.jpg](img/A978-1-4302-5990-9_10_Figs_HTML.jpg)\n\
  \n其中 n [i] 是在第 t 代中支配第 i 个解 x [i] 的解的数量。一旦排序过程完成，个体的适应度通过用户定义的函数在最佳等级 (1) 和最差等级\
  \ ![A978-1-4302-5990-9_10_Figt_HTML.jpg](img/A978-1-4302-5990-9_10_Figt_HTML.jpg)\
  \ 之间插值来分配。相同等级个体的适应度被平均化，允许以相似的速率进行采样，同时保持选择压力。某些个体的适应度可能比其他个体下降得更多，这取决于排序后种群的规模。排序引导搜索仅收敛于全局最优解。在许多目标维度上表现良好的解更有可能参与交配过程。\n\
  \n尽管排序过程为帕累托非支配解分配了正确的适应度，但它并不总能保证在帕累托集合中采样的均匀性。在处理多个目标时，遗传漂变会引发次优行为，即由于不完美的选择过程，大量解倾向于收敛到较少的目标上。为了防止过早收敛并增加种群多样性，在目标空间中采用了一种小生境形成方法，将种群分布在帕累托区域上。如果两个个体的适应度接近到小于某个小生境距离，则它们被视为属于同一个小生境（即共享相同的适应度）。小生境形成通过在小生境之间引入竞争压力，降低此类局部最优解的适应度，从而阻止收敛到适应度函数的单一区域。小生境形成有助于发现适应度景观中的不同区域。在自然界中，小生境被视为生物体在环境中的任务，而物种是具有相同特征的生物体的集合。小生境技术将\
  \ GA 种群分割成不相交的集合，使得适应度函数的每个区域中至少有一个成员覆盖多个局部最优解。在一种此类方法中，你需要定义一个参数小生境半径（σ [radius]\
  \ ）。任何距离小于该半径的两个个体都被视为属于同一个小生境，共享相同的适应度值。小生境技术让 GA 基于新的共享适应度而非个体的原始适应度进行操作。小生境技术减少了种间竞争，并有助于在不同的小生境周围合成稳定的子种群。在多目标优化问题中，小生境通常由搜索空间中每个最优解的位置表示，适应度作为该小生境的资源。\n\
  \n### 小生境帕累托遗传算法\n\nNPGA 是一种基于帕累托支配的锦标赛选择方案，其中一组随机选择的个体组成的比较集参与决定两个候选解之间的胜者。每个候选解都会被测试以确定其支配关系。未被比较集支配的候选解被选入交配池。如果两个候选解都被比较集支配或都未被支配，则它们可能属于同一个等价类。如图\
  \ 10-5 所示，对于给定的小生境半径（σ [share] ），交配池的选择由小生境类计数决定。在等价类中个体数量最少（小生境计数最少）的候选解具有最佳适应度。在此示例中，由于两个候选解都未被支配，候选解\
  \ 1 基于较低的小生境类计数被选入交配池。\n\n![A978-1-4302-5990-9_10_Fig5_HTML.gif](img/A978-1-4302-5990-9_10_Fig5_HTML.gif)\n\
  \n图 10-5.\n\n等价类共享；候选解 1（小生境类计数 = 3）比候选解 2（小生境类计数 = 4）更优\n\nMOGA 和 NPGA 存在类似的缺点：两种方法都对小生境半径（σ\
  \ [share] ）的选择高度敏感。\n\n\n\n### 非支配排序遗传算法\n\nNSGA 是另一种基于帕累托的非精英主义方法，其与 SGA 的不同之处在于选择算子的使用方式。首先选择所有非支配解，并将其归类为种群中的第一非支配前沿。为了确定第二非支配前沿的成员，第一非支配前沿的成员将从评估过程中被剔除，然后对剩余种群继续搜索非支配解。这种在逐渐缩小的种群中进行层级剔除和非支配搜索的过程会持续进行，直到种群中的所有个体都被归类到某个非支配层级。非支配层级范围从\
  \ 1 到 p。每个子种群类别的适应度根据种群规模按比例分配。属于较低非支配层级的解比属于较高层级的解具有更高的适应度。这种机制维持了选择压力，使得具有更高适应度（较低非支配层级的成员）的个体被选入交配池，从而朝着帕累托最优前沿的方向进化。\n\
  \n第一步，将等于种群规模的初始虚拟适应度分配给第一非支配前沿的个体。基于共享同一前沿和同一层级的相邻解的数量（针对给定小生境半径 σ [share] 的小生境计数），个体的适应度值会按小生境计数的因子进行缩减，并为该层级的每个个体重新计算一个新的共享适应度值。对于第二非支配层级的个体，分配一个小于第一非支配层级最低共享适应度的虚拟适应度。类似地，属于第三层级及所有后续层级的个体，其分配的适应度相对于较低层级的最低适应度呈递减顺序。这保证了属于较高非支配层级的个体的适应度始终低于较低层级的个体。此过程持续进行，直到整个种群中的所有个体都被分配了其共享适应度。一旦所有适应度值分配完毕，就应用与选择、交叉和变异相关的传统遗传算法过程。从数学上讲，该过程可以解释如下：对于具有虚拟适应度\
  \ f [p] 和小生境计数 ![A978-1-4302-5990-9_10_Figu_HTML.jpg](img/A978-1-4302-5990-9_10_Figu_HTML.jpg)\
  \ 的 k 个个体，作为 p 个非支配层级的一部分，每个个体 i 的共享适应度可计算为\n\n![A978-1-4302-5990-9_10_Figv_HTML.jpg](img/A978-1-4302-5990-9_10_Figv_HTML.jpg)\n\
  \n后续非支配层级中个体的虚拟适应度由下式给出\n\n![A978-1-4302-5990-9_10_Figw_HTML.jpg](img/A978-1-4302-5990-9_10_Figw_HTML.jpg)\n\
  \n其中 ε 是一个小的正数。\n\nNSGA 与此类别的其他算法存在相同的缺点：对小生境半径 σ [share] 高度敏感。\n\n### 强度帕累托进化算法\n\
  \nSPEA 通过融合先前多目标进化算法实现的几个特征，实现了精英主义和非支配性。精英选择防止了优质解的质量在代际间退化。在其一种变体中，当前代的最佳个体会被不加修改地传递到下一代。\n\
  \nZitzler 等人（2001 年）通过引用以下属性定义了 SPEA 的特征：\n\n-   通过归档先前发现的非支配解，创建一个外部且持续更新的非支配种群集。在每一代，非支配解都会被复制到外部非支配集中。与其他进化算法不同，在\
  \ SPEA 中，种群内一个解相对于其他解的支配关系并不重要。\n-   通过评估个体的适应度（基于支配候选解的那些解的强度），将步骤 1 中的外部非支配解应用于选择过程。\n\
  -   使用帕累托支配关系保持种群多样性。该进化算法不需要距离参数（例如小生境半径）。\n-   结合聚类过程来修剪外部非支配集，同时不破坏其特征。\n\n如前所述，该算法通过维护一个外部非支配种群集\
  \ ![A978-1-4302-5990-9_10_Figx_HTML.jpg](img/A978-1-4302-5990-9_10_Figx_HTML.jpg)\
  \ 来显式地实现精英主义。算法流程包括以下步骤：\n\n1.  初始化大小为 n 的种群 P。\n2.  初始化一个空种群 ![A978-1-4302-5990-9_10_Figy_HTML.jpg](img/A978-1-4302-5990-9_10_Figy_HTML.jpg)，代表外部非支配解集档案。\n\
  3.  将 P 中的非支配解复制到 ![A978-1-4302-5990-9_10_Figzzz_HTML.jpg](img/A978-1-4302-5990-9_10_Figzzz_HTML.jpg)。\n\
  4.  移除 ![A978-1-4302-5990-9_10_Figz_HTML.jpg](img/A978-1-4302-5990-9_10_Figz_HTML.jpg)\
  \ 中被 ![A978-1-4302-5990-9_10_Figaa_HTML.jpg](img/A978-1-4302-5990-9_10_Figaa_HTML.jpg)\
  \ 的其他成员覆盖（或支配）的解。\n5.  如果 ![A978-1-4302-5990-9_10_Figbb_HTML.jpg](img/A978-1-4302-5990-9_10_Figbb_HTML.jpg)\
  \ 中的解数量超过给定阈值，则使用聚类方法修剪 ![A978-1-4302-5990-9_10_Figcc_HTML.jpg](img/A978-1-4302-5990-9_10_Figcc_HTML.jpg)。\n\
  6.  计算 P 中每个成员的适应度以及 ![A978-1-4302-5990-9_10_Figdd_HTML.jpg](img/A978-1-4302-5990-9_10_Figdd_HTML.jpg)\
  \ 中每个成员的强度。\n7.  从 P 和 ![A978-1-4302-5990-9_10_Figee_HTML.jpg](img/A978-1-4302-5990-9_10_Figee_HTML.jpg)（![A978-1-4302-5990-9_10_Figff_HTML.jpg](img/A978-1-4302-5990-9_10_Figff_HTML.jpg)）的多重集并集中，执行二元锦标赛选择（有放回）以选择个体进入交配池。锦标赛选择通过在从当前种群（![A978-1-4302-5990-9_10_Figgg_HTML.jpg](img/A978-1-4302-5990-9_10_Figgg_HTML.jpg)）中随机选择的个体之间举行“锦标赛”来产生选择压力。每场锦标赛的胜者（适应度最佳的个体）被选入交配池。与平均种群适应度相比，交配池具有更高的平均适应度，这有助于建立选择压力，从而提高后续世代的平均适应度。\n\
  8.  照常应用特定于问题的变异和交叉算子。\n9.  转到步骤 3，并重复（除非达到终止条件）。\n\n#### ![A978-1-4302-5990-9_10_Fighh_HTML.jpg](img/A978-1-4302-5990-9_10_Fighh_HTML.jpg)\
  \ 解的强度\n\n每个解被分配一个强度 ![A978-1-4302-5990-9_10_Figii_HTML.jpg](img/A978-1-4302-5990-9_10_Figii_HTML.jpg)\
  \ S [i] 与 i 支配的个体数量 ![A978-1-4302-5990-9_10_Figjj_HTML.jpg](img/A978-1-4302-5990-9_10_Figjj_HTML.jpg)\
  \ 成正比。外部非支配集 ![A978-1-4302-5990-9_10_Figkk_HTML.jpg](img/A978-1-4302-5990-9_10_Figkk_HTML.jpg)\
  \ 中解的适应度由下式给出\n\n![A978-1-4302-5990-9_10_Figll_HTML.jpg](img/A978-1-4302-5990-9_10_Figll_HTML.jpg)\n\
  \n其中 n 是 P 中被 i 支配的个体数量，N 是 P 的总种群规模。\n\n#### P 中解的适应度\n\n解 ![A978-1-4302-5990-9_10_Figmm_HTML.jpg](img/A978-1-4302-5990-9_10_Figmm_HTML.jpg)\
  \ 的适应度通过求和所有覆盖（或支配）j 的外部非支配解 ![A978-1-4302-5990-9_10_Fignn_HTML.jpg](img/A978-1-4302-5990-9_10_Fignn_HTML.jpg)\
  \ 的强度来计算。集合 P 中解的适应度由下式给出\n\n![A978-1-4302-5990-9_10_Figoo_HTML.jpg](img/A978-1-4302-5990-9_10_Figoo_HTML.jpg)\n\
  \n在适应度上加 1 是为了保持外部非支配解具有更好的适应度。由于适应度是求最小值，因此较低的适应度会导致被选入交配池的可能性更高。\n\n\n\n#### 聚类\n\
  \n在 SPEA 中，外部非支配解集的大小 ![A978-1-4302-5990-9_10_Figpp_HTML.jpg](img/A978-1-4302-5990-9_10_Figpp_HTML.jpg)\
  \ 是算法成功的关键。由于它参与了选择过程，一个极其庞大的非支配解集可能会降低选择压力并减缓搜索速度。然而，种群中不均衡的分布可能会使解偏向搜索空间的某些区域。因此，需要一个剪枝过程来剔除外部非支配种群中的个体，同时保持其多样性。Zitzler、Laumanns\
  \ 和 Thiele (2001) 使用了平均链接法 (Morse 1980) 来剪枝外部非支配解集。聚类步骤如下：\n\n1.  初始化一个聚类 C，使得外部非支配解集中的每个个体\
  \ ![A978-1-4302-5990-9_10_Figqq_HTML.jpg](img/A978-1-4302-5990-9_10_Figqq_HTML.jpg)\
  \ 都是一个独立聚类的成员。\n2.  计算所有可能聚类对之间的距离。设 d [m,n] 为两个聚类 c [m] 和 ![A978-1-4302-5990-9_10_Figrr_HTML.jpg](img/A978-1-4302-5990-9_10_Figrr_HTML.jpg)\
  \ 之间的距离，则 ![A978-1-4302-5990-9_10_Figss_HTML.jpg](img/A978-1-4302-5990-9_10_Figss_HTML.jpg)，其中\
  \ ![A978-1-4302-5990-9_10_Figtt_HTML.jpg](img/A978-1-4302-5990-9_10_Figtt_HTML.jpg)\
  \ 是两个个体在目标空间中的欧几里得距离，而 ![A978-1-4302-5990-9_10_Figuu_HTML.jpg](img/A978-1-4302-5990-9_10_Figuu_HTML.jpg)\
  \ 是聚类 c [k] 的种群。\n3.  将具有最小距离 d [m,n] 的两个聚类合并成一个更大的聚类。\n4.  在每个聚类集中，识别出与该聚类中所有其他个体平均距离最小的个体。\n\
  5.  循环步骤 2-4，直到达到允许的最大聚类数阈值 ![A978-1-4302-5990-9_10_Figvv_HTML.jpg](img/A978-1-4302-5990-9_10_Figvv_HTML.jpg)。\n\
  \nSPEA 将精英主义引入了进化多目标优化。一个突出的优点是，该算法不像 MOGA 或 NSGA 那样依赖于小生境距离 (σ [radius] )。SPEA\
  \ 的成功很大程度上取决于基于存档成员强度的适应度分配方法。在最坏的情况下，如果存档只包含一个成员，那么 P 中的每个成员都将具有相同的排名。聚类过程仍然是算法成功的关键考量。尽管该技术对于保持多样性至关重要，但它可能无法保留边界解，这可能导致非支配解分布不均匀。\n\
  \n### 强度帕累托进化算法 II\n\nSPEA-II 是 SPEA 的增强版本。在 SPEA-II 中，主种群和精英存档中的每个个体都被赋予一个强度值 (S\
  \ [i] )，表示它支配的解的数量，\n\n![A978-1-4302-5990-9_10_Figww_HTML.jpg](img/A978-1-4302-5990-9_10_Figww_HTML.jpg)\n\
  \n基于强度值 S [i] ，原始适应度值 R [i] 通过累加支配当前个体 i 的那些个体的强度来计算，\n\n![A978-1-4302-5990-9_10_Figxx_HTML.jpg](img/A978-1-4302-5990-9_10_Figxx_HTML.jpg)\n\
  \n其中 ![A978-1-4302-5990-9_10_Figyy_HTML.jpg](img/A978-1-4302-5990-9_10_Figyy_HTML.jpg)\n\
  \n与 SPEA（其中适应度仅由支配存档成员的累积强度决定）不同，在 SPEA-II 中，适应度由存档和种群中支配成员的累积强度共同决定。由于适应度是最小化的，较高的适应度值意味着候选个体被大量个体所支配。\n\
  \n为了区分具有相同原始适应度得分的个体，SPEA 使用 k-最近邻 (k-NN) 方法 (Silverman 1986) 来估计每个个体的额外密度信息。这里，k\
  \ 被计算为 P 和 ![A978-1-4302-5990-9_10_Figzz_HTML.jpg](img/A978-1-4302-5990-9_10_Figzz_HTML.jpg)\
  \ 合并样本大小的平方根。每个个体 i 测量、存储并排序其在目标空间中相对于存档和种群中所有其他个体 j 的距离。排序列表中的第 k 个元素（距离），按递增顺序排列，由\
  \ ![A978-1-4302-5990-9_10_Figaaa_HTML.jpg](img/A978-1-4302-5990-9_10_Figaaa_HTML.jpg)\
  \ 表示。密度 D [i] 由下式给出\n\n![A978-1-4302-5990-9_10_Figbbb_HTML.jpg](img/A978-1-4302-5990-9_10_Figbbb_HTML.jpg)\n\
  \n其中 ![A978-1-4302-5990-9_10_Figccc_HTML.jpg](img/A978-1-4302-5990-9_10_Figccc_HTML.jpg)\n\
  \n最后，将 R [i] (原始适应度) 和 D [i] 相加得到个体 i 的适应度，表示为\n\n![A978-1-4302-5990-9_10_Figddd_HTML.jpg](img/A978-1-4302-5990-9_10_Figddd_HTML.jpg)\n\
  \n与 SPEA 不同，SPEA-II 在存档中维持恒定数量的个体。适应度评估完成后，下一步是将来自存档 ![A978-1-4302-5990-9_10_Figeee_HTML.jpg](img/A978-1-4302-5990-9_10_Figeee_HTML.jpg)\
  \ 和种群 (P [t] ) 的所有非支配个体复制到下一代存档 ![A978-1-4302-5990-9_10_Figfff_HTML.jpg](img/A978-1-4302-5990-9_10_Figfff_HTML.jpg)\
  \ 中\n\n![A978-1-4302-5990-9_10_Figggg_HTML.jpg](img/A978-1-4302-5990-9_10_Figggg_HTML.jpg)\n\
  \n如果非支配解的数量小于阈值 N，则从先前存档 ![A978-1-4302-5990-9_10_Figjjj_HTML.jpg](img/A978-1-4302-5990-9_10_Figjjj_HTML.jpg)\
  \ 和种群 (P [t] ) 的排序列表中，将 ![A978-1-4302-5990-9_10_Fighhh_HTML.jpg](img/A978-1-4302-5990-9_10_Fighhh_HTML.jpg)\
  \ 个最优被支配解 ![A978-1-4302-5990-9_10_Figiii_HTML.jpg](img/A978-1-4302-5990-9_10_Figiii_HTML.jpg)\
  \ 移动到新存档 ![A978-1-4302-5990-9_10_Figkkk_HTML.jpg](img/A978-1-4302-5990-9_10_Figkkk_HTML.jpg)\
  \ 中。然而，如果非支配解的数量超过了阈值 N，则通过移除彼此之间距离最小的 ![A978-1-4302-5990-9_10_Figlll_HTML.jpg](img/A978-1-4302-5990-9_10_Figlll_HTML.jpg)\
  \ 个个体来进行截断过程。如果出现平局，则考虑第二小的距离，依此类推。\n\n同样与 SPEA（其中使用二元锦标赛选择（有放回）从 P [t] 和 ![A978-1-4302-5990-9_10_Figmmm_HTML.jpg](img/A978-1-4302-5990-9_10_Figmmm_HTML.jpg)\
  \ 的多重集种群中选择个体进入交配池）不同，SPEA-II 仅从存档种群 ![A978-1-4302-5990-9_10_Fignnn_HTML.jpg](img/A978-1-4302-5990-9_10_Fignnn_HTML.jpg)\
  \ 中选择个体。\n\n\n\n### 帕累托存档进化策略\n\nPAES 是一种简单的多目标进化算法，能够生成多样化的帕累托最优解。它是一种单亲、单子的进化算法，类似于\
  \ (1+1) 进化策略。PAES 使用二进制表示和位变异算子来实现局部搜索并产生子代。位变异算子以固定概率翻转二进制编码解（染色体）的位（基因），从而创建新解。一个参考存档存储并更新在前几代中找到的最佳非支配解。最佳解是指在参数空间中支配其他解或位于较不拥挤区域且保持非支配状态的解。该存档用于对所有结果解进行支配排序。\n\
  \n首先，创建一个子代，并计算其目标函数。接着，将子代与父代进行比较。如果子代支配父代，则子代被接受为下一代的父代，并将其副本添加到存档中。如果父代支配子代，则丢弃子代，并从父代生成一个新的变异解。\n\
  \n如果父代和子代互不支配，则将两者与最佳解存档进行比较，以做出适当的选择。如果存档中的任何成员支配子代，则丢弃子代，并从父代生成一个新的变异解。如果子代支配存档中的任何成员，则子代被接受为下一代的父代，并删除存档中所有被支配的解。如果子代不支配参考存档中的任何解，则检查子代与存档中解的接近程度。如果子代位于参数空间中较不拥挤的区域，则它被接受为下一代的父代。子代的副本也会被添加到存档中。\n\
  \nPAES 算法包含以下步骤：\n\n初始化一个父代，评估其目标函数，并将其添加到存档中。  \n变异父代，生成一个子代，并评估其目标函数。  \n比较父代和子代。\
  \  \n如果父代支配子代，则丢弃子代，并转到步骤 2。  \n如果子代支配父代，则接受子代为下一代的父代，并将其添加到存档中。  \n将子代与存档中的成员进行比较。\
  \  \n如果存档中的任何成员支配子代，则丢弃子代，并转到步骤 2。  \n如果子代支配存档中的任何成员，则接受子代为下一代的父代，将其添加到存档中，并移除存档中所有被支配的解。\
  \  \n如果子代不支配参考存档中的任何解，则检查子代与存档中解的接近程度；如果子代位于参数空间中较不拥挤的区域，则接受子代为下一代的父代。将子代复制到存档中。\
  \  \n转到步骤 2，并重复直到达到预定义的代数。\n\n### 基于帕累托包络的选择算法\n\nPESA 是一种多目标进化算法，它结合了 SPEA 和 PAES\
  \ 的特点。其区别在于算法中 PESA 使用基于超网格的拥挤方案来整合选择和多样性。与 SPEA 类似，PESA 使用较小的内部种群和较大的外部种群。外部种群存档现有的帕累托前沿近似解，而内部种群则包含竞争进入外部存档的新候选解。与\
  \ PAES 类似，为了保持多样性，PESA 使用目标空间的超网格划分来衡量外部存档中不同区域的拥挤程度。与 PAES 和 SPEA 一样，PESA 用于外部存档的解替换方案（存档最佳非支配解）基于拥挤度度量；然而，与\
  \ PAES（使用父代变异）和 SPEA（使用基于支配解强度的适应度度量）不同，PESA 中的选择方案也基于拥挤度度量。\n\nPESA 算法使用两个种群集合：P\
  \ [I] 代表内部种群，P [E] 代表外部种群（也称为存档种群）。PESA 的步骤如下：\n\n将外部种群 (P [E]) 初始化为空集。  \n初始化内部种群\
  \ ![A978-1-4302-5990-9_10_Figooo_HTML.jpg](img/A978-1-4302-5990-9_10_Figooo_HTML.jpg)。\
  \  \n评估内部种群中的每个个体。  \n更新外部种群存档 P [E]。  \n将 P [I] 中的非支配解（相对于 P [I] 和 P [E] 中的任何成员）复制到\
  \ P [E] 中。  \n移除 P [E] 中被新添加的 P [I] 非支配解所支配的解。  \n如果 P [I] 的解既不支配也不被 P [E] 支配，则将该解添加到\
  \ P [E] 中。  \n如果 |P [E]| 超过阈值，则从最拥挤的超网格中随机选择一个解进行移除。  \n检查终止条件。  \n如果达到终止条件，则停止；返回\
  \ P [E]。  \n否则，  \n删除内部种群 ![A978-1-4302-5990-9_10_Figppp_HTML.jpg](img/A978-1-4302-5990-9_10_Figppp_HTML.jpg)。\
  \  \n重复（直到生成新的 P [I]）。  \n从 P [E] 中较不拥挤的超网格（基于密度信息）中选择两个父代。  \n基于交叉和变异创建新的子代。  \n\
  转到步骤 3，并重复。\n\nPESA 中的拥挤方法形成一个超网格，将目标空间划分为超立方体。外部存档中的每个个体都与目标空间中的一个特定超立方体相关联。一个定义为挤压因子的属性表示位于同一超立方体中其他个体的总数。挤压因子通过从随机选择的解（来自外部存档）中挑选具有较低挤压因子的解来缩小解的选择范围。挤压因子通过选择代表性不足的种群成员，将搜索导向一个新兴的帕累托前沿。\n\
  \n挤压因子也用于调节外部存档的种群规模。当存档种群 |P [E]| 超过某个阈值时，从具有最大挤压因子的区域中随机选择一个个体进行移除。\n\n### 基于帕累托包络的选择算法\
  \ II\n\nPESA-II 是 PESA 的扩展，它采用了一种基于区域的选择方法，其中选择标准使用超立方体而非超立方体中的随机个体来满足。稀疏填充的超立方体比拥挤的超立方体更有可能被选中。一旦选择了单元格，该单元格内的个体将被随机选择参与交配和变异过程。尽管该算法计算效率高，但它需要关于目标空间的先验信息来调整网格大小。\n\
  \n\n\n### 精英非支配排序遗传算法\n\nNSGA-II 通过一种使用拥挤距离来促进选择的拥挤锦标赛选择方案，改进了 NSGA 的非精英特性。在 NSGA-II\
  \ 中，种群初始化后，种群中的个体会像在 NSGA 中一样进行非支配排序和排名。为了找到第一个非支配前沿，种群中的每个个体都会与种群中的其他所有个体进行比较，以确定该个体是否被支配。第一前沿中的非支配个体将从种群中移除，并放入临时（第\
  \ 1 层）存储中。为了找到下一个前沿，对剩余的种群重复此过程。该过程持续进行，直到种群中的所有成员都被分配到一个前沿。在最坏的情况下，每个前沿只包含一个解。每个前沿中的每个个体都会根据其所属的前沿获得一个适应度值（或排名）；例如，第\
  \ n 个前沿中的个体获得的适应度为 n。此外，还会为每个个体测量拥挤距离。拥挤距离表示个体与其邻居的接近程度，这促使种群向更好的多样性发展。父代通过二元锦标赛选择，基于排名和拥挤距离进入交配池。非支配排序完成后，每个个体都会被分配一个拥挤距离值。\n\
  \n如果在锦标赛选择过程中比较两个解，则根据以下标准选择获胜解：\n\n*   如果解属于两个不同的排名，则排名更好的解赢得选择。\n*   如果解属于同一排名，则拥挤距离更大（或拥挤区域更小）的解获胜。\n\
  \n交配池填充完毕后，应用交叉和变异算子生成子代种群。为了实现精英主义，将父代和子代种群合并，并将合并种群中的非支配个体传播到下一代。NSGA-II 算法总结如下：\n\
  \n初始化\n\n初始化一个大小为 N 的随机种群 P [0]。   通过创建非支配前沿对种群进行排序和排名。   根据种群的排名分配适应度。   使用交叉和变异算子创建大小为\
  \ N 的子代 Q [0]。\n\n选择\n\n每一代开始时都有一个大小为 2N 的合并种群 ![A978-1-4302-5990-9_10_Figqqq_HTML.jpg](img/A978-1-4302-5990-9_10_Figqqq_HTML.jpg)。\
  \   通过创建非支配前沿（F [1] (t), F [2] (t), F [3] (t),…,F [n] (t)）对种群进行排序和排名。   选择前沿 F [1]\
  \ (t) 到 F [n] (t)，直到所选前沿的合并种群总和超过 N。   将所选前沿 F [1] (t) 到 F [n-1] (t) 的整个种群复制到下一代的交配池中。\
  \   按拥挤距离降序对最后一个所选前沿 F [n] (t) 的种群进行排序。   从最后一个前沿 F [n] (t) 中选择填充交配池 N 个位置所需的*最佳*个体。\
  \   交配池现在由前沿 F [1] 到 F [n-1] 的整个种群和前沿 Fn 的部分种群（按拥挤距离排序）组成，以创建一个大小为 N 的父代种群（交配池）。\
  \   使用交叉和变异算子创建 N 个子代。   转到步骤 5，并重复。\n\n拥挤距离引导选择过程朝向均匀分布的帕累托最优前沿。第 i 个解 D[i] 的拥挤距离计算为对应于每个目标\
  \ m 的各个距离值的总和。在计算拥挤距离之前，每个目标函数都会被归一化。以下步骤总结了非支配集 I 中所有解的拥挤距离计算：\n\n![A978-1-4302-5990-9_10_Figrrr_HTML.jpg](img/A978-1-4302-5990-9_10_Figrrr_HTML.jpg)\
  \ 解的数量   I = {0}将所有解初始化为 0 ---------[对于所有目标 k = 1 到 k = m]----------   I = Sort\
