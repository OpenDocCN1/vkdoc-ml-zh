- "# 5. 隐马尔可夫模型\n\n未来的最好之处在于它一天天到来。 ——亚伯拉罕·林肯\n\n实时过程产生的观测值可以是离散的、连续的、平稳的、时变的或带有噪声的。基本挑战是将观测值表征为一个参数化的随机过程，其参数应使用定义明确的方法进行估计。这使我们能够构建一个底层过程的理论模型，从而能够预测过程输出，并区分观测值本身的统计特性。隐马尔可夫模型（HMM）就是这样一种统计模型。HMM\
  \ 通过分析观测符号序列的模式来解释（不可观测的）过程。HMM 由一个双重随机过程组成，其中底层（或隐藏的）随机过程可以通过分析另一组随机过程的观测符号序列来间接推断。HMM\
  \ 包含（隐藏的）状态，这些状态代表了被建模过程中不可观测或潜在的属性。基于 HMM 的方法被广泛用于分析特征或观测值，例如使用情况和活动概况以及过程不同状态之间的转换，以预测最可能的状态序列。HMM\
  \ 可以表示为离散事件的随机模型和马尔可夫链的一种变体，马尔可夫链是一个由链接状态或事件组成的链，其中下一个状态仅取决于系统的当前状态。HMM 的状态是隐藏的（或者只能从观测符号中推断出来）。对于给定的模型和观测序列，HMM\
  \ 用于分析与模型选择、状态序列确定和模型训练相关的问题的解决方案（更多细节，请参见“HMM 的三个基本问题”一节）。\n\n*   HMM 的基本理论是在 Baum\
  \ 及其同事的开创性工作基础上发展起来的（Baum 和 Petrie，1966；Baum 和 Eagon，1967；Baum 和 Sell，1968；Baum\
  \ 等人，1970；Baum，1972）。该领域的早期工作归功于 Stratonovich（1960），他基于条件马尔可夫过程理论提出了一种最优非线性滤波模型。Rabiner（1989）在表述语音表示的统计方法方面，对\
  \ HMM 的应用做出了近期贡献。作者基于离散或连续密度参数分布，成功实现了一个 HMM 系统。\n*   本章将介绍 HMM 技术及其在入侵检测、工作负载优化和故障预测等管理解决方案中的实际应用。\n\
  \n\n\n## 离散马尔可夫过程\n\n一个系统在任何时刻都可以被描述为处于状态 S[1]、S[2]、……、S[n] 中的某一个（见图 5-1）。当系统以固定的时间间隔，以特定概率\
  \ p[ij] 从状态 S[i] 转变为 S[j] 时，这可以通过一个简单的随机过程来描述。在该过程中，未来状态的分布仅取决于当前状态，而与系统如何到达当前状态无关。由元素\
  \ p[ij] 构成的矩阵 P 被称为马尔可夫链的**转移概率矩阵**。换句话说，我们可以将离散马尔可夫过程描述为一种在等间隔时间点上演化的现象，对于给定的当前状态，过去和未来在统计上是独立的。通常，这种仅由当前状态影响未来状态的时间演化现象被称为**动态系统**。未来状态对当前状态的唯一依赖性使我们能够使用随机变量而非确定性对象来对解进行建模。随机变量定义了一组可能的结果（样本空间\
  \ Ω）以及一个将每个结果与概率相关联的概率分布。\n\n![A978-1-4302-5990-9_5_Fig1_HTML.gif](img/A978-1-4302-5990-9_5_Fig1_HTML.gif)\n\
