- "# 9. 深度学习\n\n任何人都可以知道。关键在于理解。——阿尔伯特·爱因斯坦\n\n人工神经网络自诞生以来，其历史便充满了起伏。在节点层面，人工神经网络始于高度简化的神经模型，如\
  \ McCulloch-Pitts 神经元（McCulloch and Pitts 1943），随后演变为 Rosenblatt 的感知机（Rosenblatt\
  \ 1957）以及各种更复杂、更精密的计算单元。从单层和多层网络，到自递归的 Hopfield 网络（Tank and Hopfield 1986），再到自组织映射（也称为\
  \ Kohonen 网络）（Kohonen 1982）、自适应共振理论和时延神经网络等其他推荐结构，人工神经网络经历了多次结构迭代。这些迭代带来了渐进式的改进，旨在解决前代网络的局限性并实现更高水平的智能。尽管如此，这些“智能”网络的复合效应仍未能捕捉到真正的人类智能（Guerriere\
  \ and Detsky 1991; Becker and Hinton 1992）。因此，深度学习在机器学习领域正在兴起，因为传统的浅层学习架构已被证明无法胜任更具挑战性的机器学习任务和强人工智能。计算能力的激增和广泛可用性（Misra\
  \ and Saha 2010），加上高效训练算法的创建和神经科学的进步，使得此前不可能实现的深度学习原理得以实施。这些发展促成了深度架构算法的形成，这些算法借鉴认知神经科学，提出受生物学启发的学习解决方案。本章介绍脉冲神经网络和层级时间记忆的概念，其相关技术是本书涵盖的技术中成熟度最低的。\n\
  \n\n\n## 层级时间记忆概述\n\nHTM 旨在复制新皮层的功能和结构特性。它融合了霍金斯在《论智能》（2007）一书中的诸多洞见，该书提出智能的关键在于预测能力。其框架被设计为新皮层的一种仿生模型，试图以简化且面向功能的方式，复制大脑的结构和算法特性。因此，HTM\
  \ 采用层级化组织，如图 9-1 所示。层级结构中的所有层级及其子组件都执行一种通用的计算算法。\n\n![A978-1-4302-5990-9_9_Fig1_HTML.gif](img/A978-1-4302-5990-9_9_Fig1_HTML.gif)\n\
  \n图 9-1.\n\nHTM 网络的层级结构\n\n深度架构采用了人类新皮层的层级结构，因为大脑中显然存在一种普遍的计算算法，该算法遍布新皮层区域，使大脑能够以非常相似的方式处理感觉信息——视觉、听觉、嗅觉等。大脑的不同区域以层级方式连接，使得向上流动的信息不断聚合，在每一层级构建出对感官刺激更高、更复杂的抽象和表征。大脑的结构，特别是新皮层，进化出了对其所感知的世界结构进行建模的能力。在最简单的抽象层面，大脑可以被视为一个生物数据处理黑箱，它在一个向其输入（感官）施加海量数据的环境中，发现外部原因。这些持续信息流的原因在空间和时间上本质上是层级化的。这些原因构成了一组更小的构建块，它们组合起来形成对世界的更大图景。例如，语音可以分解为句子，句子分解为词语发音，词语发音分解为音素，依此类推。对于数字图像，像素组合成边缘，边缘组合成轮廓，轮廓组合成形状，最后形状组合成物体。世界上的每一个被感知的物体都展现出一种在不同粒度级别上被感知的类似结构。正是这种层级化组织的世界，是新皮层（以及通过模仿而建立的\
  \ HTM）旨在建模的对象。这种建模在 HTM 的每一层级中都会发生。\n\n在 HTM 中，网络最底层的节点接收感官信息。这些信息可以是原始数据，也可以是预处理后的数据，具体取决于网络正在执行的任务。节点通过识别可重复的模式以及这些模式出现的序列，来学习数据流中最基本的特征，并通过本地记忆结构或连接配置将其存储起来。这些基本的模式和序列随后被用作更高层级的构建块，以形成对感官原因更复杂的表征。随着信息在层级结构中向上传递，当输入模式形成越来越高的抽象时，会使用相同的学习机制。信息也可以向下流动。这使得网络能够充当一个生成模型，其中较高层级通过将其内部状态传达给较低层级来影响它们，以填补缺失的输入数据或解决歧义，或两者兼而有之（Hawkins\
  \ 2007）。\n\n## 层级时间记忆的世代\n\nHTM 在其发展过程中迄今已历经两代。第一代计算算法（称为 Zeta 1）的底层实现深深植根于贝叶斯信念传播（BBP），并从该理论中借鉴了许多计算和收敛规则。在这个现已停用的早期版本中，HTM\
  \ 使用了 BBP 的一种变体。BBP 用于贝叶斯网络，在特定的拓扑约束下，可以确保网络在消息沿最大路径长度遍历网络所需的时间内达到最优状态。因此，BBP 迫使网络中的所有节点达成相互一致的信念。这些节点的状态以概率术语进行编码，并使用贝叶斯理论来处理和融合信息。HTM\
  \ 可以被视为一个贝叶斯网络，并增加了一些用于处理时间、自我训练和发现原因的功能。\n\n第二代算法的创建是为了使框架在生物学上更可行。在功能上，不变性表征以及空间和时间池化的许多概念，通过参考稀疏分布式表征（SDR）和结构变化的原理得以延续。节点被替换为更接近皮层柱的类似物，并采用了生物学上真实的神经元模型，连接方式也进行了更改，以允许强烈的侧向抑制（Edelman\
  \ and Mountcastle 1978）。皮层柱是一组细胞，其特征是共同的前馈连接和强烈的抑制性互连（Edelman and Mountcastle, 1978）。\n\
  \n第二代算法——最初称为固定密度分布式表征（FDR），现在简称为 HTM 皮层学习算法（CLA）——取代了 Zeta 1。在更新后的框架中，每一级不再是具有清晰感受野的“桶状”层级结构，而是一个连续的细胞区域，这些细胞堆叠成柱状，充当\
  \ Edelman 和 Mountcastle（1978）皮层柱的简化模型。图 9-2 描绘了 HTM 的结构，其中细胞组织成柱，柱组织成层级，层级组织成皮层区域的层级结构。\n\
  \n![A978-1-4302-5990-9_9_Fig2_HTML.gif](img/A978-1-4302-5990-9_9_Fig2_HTML.gif)\n\
  \n图 9-2.\n\nHTM 结构\n\nZeta 1 深深植根于贝叶斯理论——特别是信念传播，而 CLA 则建立在 SDR 的原理之上。要理解 CLA 的底层实现，有必要讨论\
  \ SDR 及其对 HTM 理论的基础性作用。\n\n为第一代 HTM 模型提出的架构深受其所实现的贝叶斯规则的影响。它受益于新皮层的结构特征，即其层级化组织；然而，节点与其生物学对应物存在差异。简而言之，重点在于功能建模。在\
  \ CLA 中，HTM 放弃了这些根源，并更严格地遵循新皮层的结构准则。其结果是一个神经元模型，在此上下文中称为 HTM 细胞。图 9-3 描绘了 Hawkins、Ahmad\
  \ 和 Dubinsky（2011）提出的模型。这些细胞比传统人工神经网络中使用的细胞更真实，在生物学上更忠实。\n\n![A978-1-4302-5990-9_9_Fig3_HTML.gif](img/A978-1-4302-5990-9_9_Fig3_HTML.gif)\n\
  \n图 9-3.\n\nHTM 细胞/神经元模型\n\n\n\nHTM 细胞拥有两种类型的传入连接结构：近端树突和远端树突。这两种类型的树突节段上分布着突触，将它们与其他邻近细胞连接起来。由于真实神经元的随机性，这些突触连接是二元的。因为\
  \ Hawkins、Ahmad 和 Dubinsky（2011）认为，任何旨在模拟大脑的算法都不能依赖单个神经元的精度或保真度，所以 HTM 细胞被建模为具有二元、无权重的突触；也就是说，它们要么连接，要么不连接。为了模拟真实神经元回缩和伸展以形成连接的能力，HTM\
  \ 细胞的突触被赋予一个称为“持久性”的参数。持久性是一个介于 0 和 1 之间的标量值，根据突触对活动的贡献而递增或递减。当持久性高于预定义阈值时，突触就会变为连接状态。因此，CLA\
  \ 中的所有突触都是潜在突触。它们是连接性的动态元素。\n\n近端树突负责区域间的前馈连接。这些树突上分布着一组潜在突触，这些突触与 HTM 区域输入的一个子集相关联。这些树突由同一列的所有细胞共享（共享前馈连接），并充当线性求和单元。远端树突负责单个区域内的横向连接。一个远端树突关联着多个节段。这些节段充当一组阈值重合检测器，这意味着，当有足够多的连接同时被激活时，它们会在接收细胞中触发响应。只要有一个节段被激活，就足以在细胞中触发响应（或门）。每个节段将一个\
  \ HTM 细胞连接到一组不同的邻近细胞子集。这些细胞的活动被监测，并允许接收细胞进入预测状态。这本质上是 HTM 网络中预测的根源：每个细胞持续监测周围细胞的活动，以预测自身状态。\n\
  \n最后，HTM 细胞有两个二进制输出。第一个输出，由于近端连接，如果存在足够的激活，则迫使细胞进入活动状态。第二个输出，由于远端连接，如果存在足够的邻近活动，则迫使细胞进入预测状态；该细胞预计很快会被激活。这使得\
  \ HTM 能够以预测的方式运行，并对输入序列做出反应。最终，HTM 细胞的输出是这两个输出的或运算。这就是层级结构中更高层区域接收到的输入。图 9-4 展示了一组\
  \ HTM 列中细胞激活的示例：在任何时刻，一些细胞会因前馈输入而处于活动状态（深灰色），而另一些接收来自活动细胞横向输入的细胞则会处于预测状态（浅灰色）。\n\
  \n![A978-1-4302-5990-9_9_Fig4_HTML.gif](img/A978-1-4302-5990-9_9_Fig4_HTML.gif)\n\
  \n图 9-4.\n\nHTM 列\n\n### 稀疏分布式表示\n\nCLA 从其生物类似物中借鉴了许多操作原理。新皮层由超过 10¹¹ 个高度互联的神经元组成。然而，它仍然能够以相对稀疏的激活水平对刺激做出反应。这得益于大量的抑制性连接。抑制保证了在任何时刻只有少数神经元被激活。此外，CLA\
  \ 实现了与 SDR 相同的编码策略。通过使用横向突触连接，受到强烈刺激的神经列会抑制邻近的活动，从而减少活动列的数量，并产生输入模式或刺激的稀疏内部表示。这种内部表示也是分布式的，即分散在整个区域中。\n\
  \n由于活动位是稀疏的，与 ASCII 码等其他表示形式相比，了解其子集仍然能携带关于输入模式的信息。对于 ASCII 码，单个位是没有意义的；因此，SDR 为单个激活注入了表示质量。因为可能大量神经元中只有极小一部分是活动的，单个神经元获得的任何语义含义都变得特定于有限数量的相似模式。因此，即使是一个模式的活跃神经元的子集，也可以成为该模式的一个良好指示器。强制实施这种稀疏性所导致的理论上的信息丢失，实际上并没有实际影响（Hawkins,\
  \ Ahmad, and Dubinsky 2011）。\n\n### 算法实现\n\n与第一代算法不同，将学习阶段与推理阶段分离并不能为理解 HTM 的操作规则提供太多洞见。在\
  \ CLA 中，学习、推理以及最重要的预测是和谐地发生的。层级结构的每一层都在持续进行预测。当较低层节点稳定后，其学习可以关闭；当被激活时，学习会与预测同步在线进行。\n\
  \n因此，最好从池化功能的角度来考虑 CLA 的操作。接下来的两节将讨论第二代算法中空间池化和时间池化背后的理论，并展示它们如何按照 Hawkins、Ahmad\
  \ 和 Dubinsky（2011）的建议在皮层网络中实现。\n\n\n\n### 空间池化器\n\n空间池化器在 CLA 和 Zeta 1 中的作用相同。空间上相似的输入模式应具有共同的内部表示。这种表示不仅要对噪声具有鲁棒性，还要遵循\
  \ SDR 原则保持稀疏性。这些目标通过强制皮层柱之间的竞争来实现。当输入数据呈现时，HTM 区域中的所有柱都会计算其前馈激活值。被激活的柱会抑制相邻的柱。通过这种方式，只有一小部分强激活的柱能够代表一组相似的输入。为了让其他柱有公平的激活机会并确保所有柱都被使用，系统会添加一个增强因子。这使得弱柱能够更好地参与竞争。\n\
  \n对于每个激活的柱，所有潜在突触的持久值都会根据赫布学习规则进行调整。与激活输入位对齐的突触的持久值会增加，而与未激活输入位对齐的突触的持久值会减少。图 9-5\
  \ 展示了所涉及阶段的流程图。\n\n![A978-1-4302-5990-9_9_Fig5_HTML.gif](img/A978-1-4302-5990-9_9_Fig5_HTML.gif)\n\
  \n图 9-5.\n\n空间池化器流程图\n\n空间池化操作如下：\n\n*   阶段 0（对应初始化）：每个柱被随机分配一组随机输入（输入向量的 50%），这被称为该柱的潜在池。此池中的每个输入由一个潜在突触表示，并被分配一个随机的持久值。持久值的选择根据以下标准决定：\n\
  \    *   值从持久阈值附近的一个小范围内选取。这使得潜在突触在经过少量训练迭代后能够连接（或断开）。\n    *   每个柱在输入区域上都有一个自然中心，持久值偏向于这个中心，中心附近的值更高。\n\
  *   阶段 1（对应重叠）：每个柱的重叠度计算为具有激活输入的连接突触数量乘以其增强值。如果该值低于预定义阈值（“minOverlap”），则重叠分数设为 0。\n\
  *   阶段 2（对应抑制）：局部抑制区域（柱的邻域）内的获胜柱数量被设为预定义值 N。如果一个柱的重叠分数大于其抑制半径内第 N 高柱的分数，则该柱为获胜者。一种计算量显著降低的抑制策略变体是，为层级中的每一层选取重叠分数最高的柱。\n\
  *   阶段 3（对应学习）：在此阶段，根据需要更新所有突触的持久值以及参数，如增强值和抑制半径。对于获胜柱，如果突触处于激活状态，其持久值增加；如果处于未激活状态，则减少。存在两种独立的增强机制来帮助柱学习连接。如果一个柱获胜不够频繁，其整体增强值会增加；或者，如果一个柱的连接突触与任何输入的重叠不够频繁，其持久值会被增强。此阶段以更新抑制半径结束。\n\
  \n### 时间池化器\n\n通过空间池化器计算出的获胜柱，HTM 网络能够洞察其输入可能正在看到的模式。但它缺乏的是上下文。任何一个模式都可能作为大量序列的一部分出现，也就是说，出现在多个上下文中。HTM\
  \ 理论的核心在于通过学习序列进行预测的能力。在 CLA 中，序列学习是通过每列使用多个细胞来实现的。一列中的所有细胞共享前馈激活，但只允许一个子集（通常是一个细胞）被激活。这意味着，由同一组柱表示的相同模式，可以根据模式出现的上下文，由每列中的不同细胞来表示。在细胞层面上，每个细胞的树突远端片段都与同一区域内的其他细胞有一组连接，用于在某个时间点识别网络的状态。细胞可以通过观察其连接来预测它们何时会被激活。一个特定的细胞可能参与数十或数百个时间转换。因此，每个细胞都有多个树突片段，而不仅仅是一个。\n\
  \n时间池化涉及三个阶段。第一阶段计算每个细胞的激活状态。第二阶段计算每个细胞的预测状态。第三阶段，通过增加或减少突触的持久值来更新突触。以下是同时进行推理和学习的通用情况，需要注意的是，CLA\
  \ 中的学习阶段可以关闭。\n\n*   阶段 1：对于每个获胜柱，计算其每个细胞的激活状态。同时，指定一个细胞为学习细胞。如果任何细胞由于其侧向连接而处于预测状态，则将其置于激活状态。如果一个学习细胞对其侧向激活有贡献，该细胞也被选为学习细胞。相反，如果该列中没有细胞处于预测状态，则所有细胞都被激活，以表明上下文不明确——这一过程称为爆发。此外，最佳匹配细胞成为学习细胞，并且为该细胞添加一个新的远端片段。\n\
  *   阶段 2：一旦获胜列中的所有细胞更新完毕，它们的状态可用于其他列中细胞的预测。区域中的每个细胞计算其侧向/远端连接。如果细胞的任何片段因其他细胞的前馈激活而被激活，则该细胞被置于预测状态。然后，该细胞将以下更改加入队列：\n\
  \    *   通过增加激活突触的持久值并减少未激活突触的值来强化当前激活的片段\n    *   强化可能预测到此次激活的片段，即与上一时间步的活动有（可能较弱）匹配的片段\n\
  *   阶段 3：这是发生学习的阶段，通过决定哪些排队的更新将被提交。一旦你有了前馈输入并且一个细胞被选为学习细胞，临时片段更新就会被实施。因此，只有当突触正确预测了细胞的前馈激活时，你才更新其持久值；否则，如果细胞因任何原因停止预测，这些片段将受到负强化。\n\
  \n\n\n## 相关工作\n\nZhituo、Ruan 和 Wang (2012) 在一个基于内容的图像检索（CBIR）系统中使用了多个 HTM，该系统利用查询图像的类别语义（而非低级图像特征）进行图像索引和检索。通过使用十个独立的\
  \ HTM 网络，并采用各含 50 个样本的训练和测试数据集，在所涉及的五个类别中，有四个类别的召回率达到了 95% 以上，第五个类别的召回率也超过了 70%。\n\
  \nBobier (2007) 在美国邮政服务数据库上重现了 Numenta（霍金斯创立的公司）曾报告过的手写数字识别实验，该实验声称达到了 95% 的准确率。数字图像被二值化后，以不同参数输入网络，最终达到了\
  \ 96.26% 的最高准确率——但作者指出，与其他分类器（如支持向量机 SVM）相比，这一结果并不理想，因为 SVM 在更短的计算时间内就能获得更高的准确率。\n\
  \nKostavelis、Nalpantidis 和 Gasteratos (2012) 提出了一种受生物学启发的物体识别系统。该系统利用显著性图来模拟视觉注视，仅揭示图像中的相关部分，从而减少了输入到分类器的冗余信息量。作者选择用基于相关性的替代方案替换时间池化器，并在顶层节点使用\
  \ ETH-80 数据集和监督学习。该系统在将 SVM 和 k-NN 作为顶层监督器时，均优于其他基于 HTM 的实现方案。\n\nSinkevicius、Simutis\
  \ 和 Raudonis (2011) 探索了将 HTM 用于公共空间的人流分析。他们设计了两个 HTM 网络：一个用于行人检测，另一个用于运动方向检测。他们进行了一项实验，使用安装在门框上方的俯视摄像头，并在多种不同难度的场景下评估了检测性能。行人检测的平均准确率达到\
  \ 80.94%，方向检测的平均准确率为 73.44%。\n\nBoone 等人 (2010) 将 HTM 作为传统计算机视觉技术的替代方案，用于糖尿病视网膜病变的检测。HTM\
  \ 主要检测视网膜图像上的视神经。图像被分割成视神经大小的片段，并附上标签（0 或 1）输入 HTM。经过监督训练后，HTM 网络能够正确分类 77.44% 的视神经片段，这使得作者得出结论：尽管\
  \ HTM 前景广阔，但在该任务上与传统技术相比并无竞争优势。\n\nZhuo 等人 (2012) 将最新的图像分类技术与局部约束线性编码（LLC）、空间金字塔匹配（SPM）以及用于特征池化的\
  \ HTM 相结合。他们提取图像描述符并使用 LLC 进行编码，然后将 LLC 编码输入 HTM 和多尺度 SPM 以形成图像向量。该系统使用 Caltech\
  \ 101 数据集和 UIUC-Sport 数据集进行评估，并以线性 SVM 作为分类器。结果显示，与原始的 LLC 模型相比，两个数据集的准确率均有所提升（分别从\
  \ 71.2% 提升至 73.5%，以及从 84.2% 提升至 86.7%）。\n\nGabrielsson、Konig 和 Johansson (2012)\
  \ 旨在利用 HTM 创建一个用于金融市场的盈利性软件交易代理。他们对 HTM 采用了监督训练方案，训练数据为 E-mini 标准普尔 500 期货市场的日内逐笔数据。调整后的模型被用作市场趋势的预测器，在与人工神经网络（ANN）进行对比评估时，至少表现出了相当的结果。\n\
  \n注意\n\n大多数利用 HTM 的工作都是由 Numenta 建立的开发者社区完成的。年度“黑客马拉松”产生了多个演示项目，其中 CLA 被用于交通预测、人体运动预测、井字棋模拟、红外传感器预测等。其中一个更令人印象深刻的演示是关于音乐分析和预测的，展示了如何使用\
  \ MIDI 音符序列进行训练；一个旋律在 25 个训练周期后被学会（ [`http://numenta.org/blog/2013/06/25/hackathon-outcome.html#jin-danny-stan`](http://numenta.org/blog/2013/06/25/hackathon-outcome.html#jin-danny-stan)\
  \ ）。目前，正在研究将 CLA 模型用于自然语言处理（NLP）。GitHub 网站上有一个示例（ [`https://github.com/chetan51/linguist`](https://github.com/chetan51/linguist)\
  \ ）。然而，还需要更多的研究和验证来比较 HTM 的性能与那些该模型声称优于或类似于的最新机器学习方法。鉴于 HTM 所报告的性能，社区尚未看到 HTM 在哪些方面具有明显优势。\n\
  \n## 脉冲神经网络概述\n\nSNN 是受生物学启发的网络，属于第三代人工神经网络。对于 ANN 而言，性能的任何改进似乎都应基于神经元模型。第二代 ANN\
  \ 中的神经元模型基于实际神经元的简化模型，该模型忽略了神经元之间信息编码的实际方式以及信息的类型。SNN 与 ANN 的架构相似，都由一层或多层连接的神经元组成，但在神经元模型和激活函数类型上有所不同。与利用不包含时间信息的连续激活函数的第二代\
  \ ANN 相反，SNN 在其学习和激活阶段依赖于脉冲时序。SNN 力求模仿人类神经元，利用脉冲来传输和学习时空与频谱时间数据（SSTD），这些数据对于空间数据而言通过突触位置编码，对于时间数据而言则通过脉冲时间活动编码。\n\
  \nSNN 及其变体已被应用于许多领域，例如字符识别（Gupta and Long 2007）、手语识别（Schliebs, Hamed, and Kasabov\
  \ 2011）、视觉和听觉模式识别（Wysoski, Benuskova, and Kasabov 2006, 2007）、图像聚类（Meftah et al.\
  \ 2008）、车祸识别（Kasabov et al. 2013）、人类行为识别（Meng, Jin, and Yin 2011）、乳腺癌分类（O’Halloran\
  \ et al. 2011）、传感器网络中的人类定位（Obo et al. 2011）、入侵检测（Budjade 2014; Demertzis and Illiadis\
  \ 2014）、脑电图（EEG）时空/频谱时间模式识别（Kasabov et al. 2013）以及味觉识别（Soltic and Kasabov 2010）。总的来说，由于计算成本高昂，SNN\
  \ 并不像其他机器学习方法那样普及。\n\n要理解 SNN 与 ANN 的区别，有必要考察最常见的人类神经元模型：Hodgkin-Huxley 模型、integrate-and-fire\
  \ 模型、leaky integrate-and-fire 模型、Izhikevich 模型和 Thorpe 模型。以下各节将介绍这些模型。\n\n### Hodgkin-Huxley\
  \ 模型\n\nHodgkin-Huxley 模型描述了神经元中动作电位的传播，可被视为其他模型的基础。Hodgkin 和 Huxley 根据鱿鱼的巨大轴突，对自然神经元的电化学信息进行了建模。该模型由四个微分方程组成，描述了神经元膜电容部分电荷的变化，这些变化是电压（V\
  \ [m] ）和电流（I(t)）的函数。\n\n![A978-1-4302-5990-9_9_Figa_HTML.jpg](img/A978-1-4302-5990-9_9_Figa_HTML.jpg)\n\
  \n其中\n\nI(t) 是由突触前电位引起的输入电流\n\ng [Na] 、g [K] 、g [L] 分别是钠离子通道、钾离子通道和漏电通道的单位面积电导参数\n\
  \nE [Na] 、E [K] 、E [L] 是平衡电位\n\nm、n、h 是无量纲变量，由另外三个微分方程控制\n\n由于这些方程的非线性和四维数据特性导致的复杂性，为了实际应用，人们提出了几种更简单的形式。我们将在以下各节中讨论其中一些方案。\n\
