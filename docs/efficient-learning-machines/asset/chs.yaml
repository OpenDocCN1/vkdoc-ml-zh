  \n你可以通过以下步骤递归计算βt：\n\n定义βn = 1，其中 1 ≤ i ≤ N。  \n计算![A978-1-4302-5990-9_5_Figap_HTML.jpg](img/A978-1-4302-5990-9_5_Figap_HTML.jpg)\n\
  \n##### 缩放\n\n在建模长序列 HMM 时，一个实际障碍是条件概率的数值缩放。高效计算条件概率有助于估计给定模型下最可能的状态序列。对于足够长的序列，观测到长序列的概率往往极小，以至于出现数值不稳定。在大多数情况下，计算结果会超出任何机器（包括双精度）的精度范围。缓解这种情况的最常见方法是使用高效的缩放机制对条件概率进行重新缩放。\n\
  \n例如，让我们重新审视前向变量方程：\n\n![A978-1-4302-5990-9_5_Figaq_HTML.jpg](img/A978-1-4302-5990-9_5_Figaq_HTML.jpg)\n\
  \n对于前向变量αt，你通过乘以 p[ij]和 bj 得到新值αt+1。这些概率往往很小，可能发生下溢。对数可能没有帮助，因为你处理的是乘积之和。此外，对数需要对每次加法计算对数和指数。基本的缩放过程将αt\
  \ 乘以缩放系数，目的是使缩放后的αt 保持在机器的动态精度范围内。计算结束时，缩放系数会被抵消。缩放系数不必在每个 t 步都应用，可以在必要时使用。\n\n\n\
