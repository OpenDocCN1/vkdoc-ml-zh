  其中 ρ 是一个调优参数，ε 是经验选择的激发阈值，对所有周期和列都是常数。


  通过重复暴露，网络学会提取输入数据的某些特征，并且列学会针对特定模式激发。网络中的层以递增的复杂度提取输入的各个方面。因此，较低层检测简单的特征，而较高阶段则学习概念和更复杂的数据抽象。




  #### 监督式反馈


  前馈学习训练柱状结构以识别数据特征，从而使层级网络开始识别模式。当网络遇到与先前模式差异较大的变体时，本应对该模式激活的顶层柱状结构未能激活，层级中可能仅有部分柱状结构激活，从而导致分类错误。通过
  CA 反馈机制，顶层发生的错误会产生一个反馈信号，强制原本模式对应的柱状结构激活，同时抑制对变体模式激活的柱状结构。经过多次暴露后，顶层应达到预期的激活方案（也称为稳定激活）。更具体地说，顶层中指定的柱状结构学会针对特定模式激活。一旦柱状结构开始对模式变体产生稳定激活，反馈信号就会传播到前一层。随后每一层都会被训练，直到达到一个收敛标准，该标准表示为实际输出与期望输出（激活方案）之间函数的误差项。只有当相关层的误差收敛到低于某个预定义容差阈值时，反馈信号才会发送到前一层。兴奋和抑制信号遵循与前馈学习相同的更新规则。


