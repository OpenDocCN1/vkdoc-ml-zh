  \ v [j] 可以取集合中的值（Aleksandrovsky 等人，1996）：\n\n![A978-1-4302-5990-9_7_Figao_HTML.jpg](img/A978-1-4302-5990-9_7_Figao_HTML.jpg)\n\
  \n因此，联合概率分布使用公式 7-2 计算：\n\n![A978-1-4302-5990-9_7_Figap_HTML.jpg](img/A978-1-4302-5990-9_7_Figap_HTML.jpg)\n\
  \n## DNN 训练算法\n\n反向传播是用于训练人工神经网络（ANN）最流行的算法之一（Werbos 1974）。公式 7-3 展示了反向传播中使用的权重更新规则的简单形式：\n\
  \n![A978-1-4302-5990-9_7_Figaq_HTML.jpg](img/A978-1-4302-5990-9_7_Figaq_HTML.jpg)\n\
  \n然而，随着网络深度的增加，反向传播的性能退化也会加剧，使其不适合训练通用的深度架构。这是由于梯度消失问题（Horchreiter 1991；Horchreiter\
  \ 等人，2001；Hinton 2007；Bengio 2009），这是一个训练问题，其中在网络中反向传播的误差会随着逐层传递而缩小，在深度架构中变得可以忽略不计，使得早期层的权重几乎无法更新。因此，训练深度神经网络（DNN）并从中获得有意义的结果将过于缓慢。\n\
  \n由于反向传播的缺点，人们进行了许多尝试来开发用于深度网络的快速训练算法。Schmidhuber 的算法（Schmidhuber 1992）通过对每一层进行无监督预训练，然后通过反向传播微调所得权重，来训练递归神经网络的多级层次结构。\n\
  \n对 DNN 的兴趣在 2006 年重新燃起，当时 Hinton 和 Salakhutdinov（2006）为深度信念网络（DBN）提出了一种贪婪的逐层训练算法，该算法试图顺序学习更简单的模型，然后为整体模型微调结果。该算法利用互补先验来消除解释消除效应，包含两个主要步骤：\n\
  \n一种贪婪的逐层训练，通过绑定未学习层的权重来学习权重。  \n应用 CD 来学习当前层的权重。  \n一种用于微调权重的上下算法。\n\n这种训练方案不是一次性学习跨越多个隐藏层的数百万个连接的权重，而是每次为单层寻找最优解，这使其成为一种贪婪算法。这是通过绑定所有后续层的权重，并仅学习当前层的权重来实现的。权重绑定还有助于消除解释消除现象，如果采用其他训练算法，该现象会导致深度网络训练效果不佳。如图\
  \ 7-7 所示，学习第 1 层和第 2 层之间的权重 W [0]。所有后续层之间的权重都绑定到 W [0]。一旦 CD 学习收敛，通过将所有后续层的权重绑定到\
  \ W [1]，并固定在前一阶段学习到的第 1 层和第 2 层之间的权重为 W [0]，来学习第 2 层和第 3 层之间的权重 W [1]。类似地，当 CD 收敛到\
  \ W [1] 的最优值时，第三个 RBM 块的权重与第二个 RBM 块解绑，并使用 CD 来学习最终的权重集 W [2]。\n\n![A978-1-4302-5990-9_7_Fig7_HTML.gif](img/A978-1-4302-5990-9_7_Fig7_HTML.gif)\n\
  \n图 7-7.\n\n顺序训练\n\n这种绑定、学习和解绑权重的过程会重复进行，直到所有层都被处理完毕。具有绑定权重的 DBN 类似于 RBM。因此，如前所述，每个\
  \ RBM 都使用 CD 学习进行学习。然而，该算法仅在前两层形成无向图，且其余隐藏层形成有向无环图时才能应用。\n\n有向模型的能量使用公式 7-4 计算，该公式受公式\
  \ 7-5 约束。绑定权重使得公式 7-5 中的等式成立，并使 ![A978-1-4302-5990-9_7_Figar_HTML.jpg](img/A978-1-4302-5990-9_7_Figar_HTML.jpg)\
  \ 和 ![A978-1-4302-5990-9_7_Figas_HTML.jpg](img/A978-1-4302-5990-9_7_Figas_HTML.jpg)\
  \ 成为常数。公式 7-5 的导数被简化为等于公式 7-6。因此，绑定权重导致需要最大化的目标函数更简单。递归应用此规则可以训练 DBN（Hinton、Osindero\
  \ 和 Teh，2006）。\n\n\n\n![A978-1-4302-5990-9_7_Figat_HTML.jpg](img/A978-1-4302-5990-9_7_Figat_HTML.jpg)\n\
  \n一旦为每一层学习到权重，就会使用带有 CD 权重更新规则的**唤醒-睡眠算法**变体来微调已学习的参数。**上下算法**用于反向拟合所得到的解，以避免欠拟合——这是以无监督和贪婪方式训练时需要关注的一个重要问题。上下算法使较低层（其权重在训练早期学习）受到较高层（其权重在训练末期学习）的影响。在自下而上的传递中，通过计算正相概率、对状态进行采样、使用\
  \ CD 权重更新规则以及运行有限次数的吉布斯采样，来调整有向连接上的生成权重。自上而下的传递将利用自上而下的连接，随机激活每一个较低层。这是通过计算负相概率、对状态进行采样以及计算网络的预测来完成的。对生成参数和推理参数以及顶层权重的适当调整，是在**唤醒-睡眠算法**的对比形式中进行的，因为它解决了算法睡眠阶段的问题。该算法的工作流程如表\
  \ 7-2 所示。\n\n表 7-2.\n\n上下算法工作流程（Hinton 和 Salakhutdinov 2006）\n\n![A978-1-4302-5990-9_7_Figak_HTML.jpg](img/A978-1-4302-5990-9_7_Figak_HTML.jpg)\n\
  \n尽管反向传播算法在应用于深度神经网络时存在局限性，但由于图形处理单元（GPU）计算能力的激增，人们对它的兴趣重新燃起。Ciresan 等人（2010）研究了反向传播算法在深度网络上的性能。他们观察到，即使存在梯度消失问题，只要给予足够的训练轮次，反向传播也能取得与其他更复杂的训练算法相当的结果。\n\
  \n值得注意的是，有报告指出，使用深度架构进行监督学习在许多分类任务上表现良好。然而，当网络以无监督方式进行预训练时，其表现几乎总是优于省略预训练阶段的情况（Erhan\
  \ 等人，2010）。人们提出了几种理论来解释这一现象，例如预训练阶段充当了正则化器（Bengio，2009；Erhan 等人，2009），并且对监督优化问题起到了辅助作用（Bengio\
  \ 等人，2007）。\n\n## 深度神经网络相关研究\n\n自 Hinton 提出快速、贪婪的训练算法以来，深度信念网络在各种机器学习应用中的使用蓬勃发展。此外，人们还进行了许多尝试来加速深度信念网络并解决其弱点。以下各节简要概述了深度信念网络最新且最相关的应用，介绍了旨在加速训练的研究，并讨论了几种深度信念网络变体和深度神经网络架构。\n\
  \n### 深度神经网络应用\n\n深度神经网络已被应用于许多机器学习应用，包括特征提取、特征降维和分类问题等。\n\n特征提取涉及将原始输入数据转换为代表输入的特征向量；原始数据可以是音频、图像或文本。例如，深度信念网络已被应用于音乐音频的离散傅里叶变换（DFT）表示（Hamel\
  \ 和 Eck，2010），并且发现其性能优于梅尔频率倒谱系数（MFCC）——一种广泛使用的音乐音频特征提取方法。\n\n从原始数据中提取特征后，可能需要降低高维数据表示，以减轻分类任务的内存和计算需求，同时更好地实现数据可视化，并减少为将来使用而存储数据所需的内存。Hinton\
  \ 和 Salakhutdinov（Hinton 和 Salakhutdinov，2006；Salakhutdinov 和 Hinton，2007）使用一组受限玻尔兹曼机来预训练网络，然后采用自编码器网络来学习低维特征。\n\
  \n使用深度信念网络提取富有表现力的低维特征，被证明可以用于快速检索文档和图像，这一点已在一些不断增长的数据库上得到测试。Ranzato 和 Szummer（2008）能够生成文档的紧凑表示以加速搜索引擎，同时性能优于浅层机器学习算法。应用于大型数据库的图像检索时，深度信念网络取得了与最先进算法（包括潜在狄利克雷分配和概率潜在语义分析）相当的结果（Hörster\
  \ 和 Lienhart，2008）。\n\n将学习到的模型从一个领域迁移到另一个领域一直是机器学习算法的一个问题。然而，深度神经网络能够提取与领域无关的特征（Bengio\
  \ 和 Delalleau，2011），使得迁移学习在许多应用中成为可能（Collobert 和 Weston，2008；Glorot、Bordes 和 Bengio，2011；Bengio，2012；Ciresan、Meier\
  \ 和 Schmidhuber，2012；Mesnil 等人，2012）。深度神经网络也被用于课程学习，其中数据按特定顺序进行学习（Bengio 等人，2009）。\n\
  \n深度信念网络已被应用于许多分类任务，涉及视觉、语音、医疗疾病和自然语言处理（NLP）等领域。图像中的物体识别已被广泛研究，深度信念网络的性能超过了最先进的算法（Desjardins\
  \ 和 Bengio，2008；Uetz 和 Behnke，2009；Ciresan 等人，2010；Ciresan、Meier 和 Schmidhuber，2012）。例如，Ciresan\
  \ 等人（2010）在混合国家标准与技术研究院（MNIST）数据库上实现了 0.35%的错误率。Nair 和 Hinton（2009）在三维物体识别方面优于包括支持向量机在内的浅层架构，在纽约大学物体识别基准（NORB）数据集上实现了\
  \ 6.5%的错误率，而支持向量机的错误率为 11.6%。在语音识别任务方面，深度架构改进了声学建模（Mohamed 等人，2011；Hinton 等人，2012）、语音到文本转录（Seide、Li\
  \ 和 Yu，2011）以及大词汇量语音识别（Dahl 等人，2012；Jaitly 等人，2012；Sainath 等人，2011）。在音素识别任务中，深度信念网络在\
  \ TIMIT 数据库上实现了 23%的错误率——优于使用其他机器学习算法报告的 24.4%至 36%的错误率范围（Mohamed、Yu 和 Deng，2010）。\n\
  \n在使用脑电图（EEG）信号进行癫痫发作预测时，深度信念网络取得了与其他机器学习算法相当的分类结果，但达到这些结果的速度显著更快——快 1.7 到 103.7\
  \ 倍（Wulsin 等人，2011）。McAfee（2008）采用深度信念网络进行文档分类，并显示出在此类数据库上取得成功的潜力。\n\n\n从人类情感的高级描述生成合成图像——特别是面部表情——是深度信念网络（DBN）成功应用的另一个领域，能够生成各种逼真的面部表情（Susskind\
  \ 等人，2008 年）。\n\n总体而言，自然语言处理（NLP）也已借助深度架构进行研究，以改进现有最佳成果。此类应用包括机器音译（Deselaers 等人，2009\
  \ 年）、情感分析（Zhou, Chen, and Wang，2010 年；Glorot, Bordes, and Bengio，2011 年）以及语言建模（Collobert\
  \ and Weston，2008 年；Weston 等人，2012 年）——涵盖词性标注、相似词识别和组块分析。这些问题的复杂性要求机器学习算法具备更深层次（Bengio\
  \ and Delalleau，2011 年）才能产生有意义的结果。例如，机器音译对机器学习算法构成了挑战，因为单词之间不存在统一的映射关系，这导致了字典中不存在的多对多映射。此外，大量的源语言到目标语言字符符号对以及导致音素缺失的不同语音结构，只是使机器难以做好音译工作的几个特性。\n\
  \n### 加速深度神经网络训练的并行实现\n\n随着层数和网络规模的增加，逐层顺序训练深度信念网络（DBN）变得更加耗时。将各层堆叠形成网络（称为深度堆叠网络），并在\
  \ CPU 集群上训练该网络（而非使用一台超级计算机）（Deng, Hutchinson, and Yu，2012 年），利用了贪婪训练算法中固有的并行性，从而显著节省训练时间。\n\
  \n然而，这种方法并不能加快每层的训练速度。这可以通过使用 GPU 并行化单个受限玻尔兹曼机（RBM）层的训练算法来实现（Cai 等人，2012 年）。\n\n\
  然而，训练 RBM 时常用的庞大且稀疏的数据给该算法的并行化带来了挑战。将计算修改为基于矩阵的操作，并优化稀疏矩阵的矩阵-矩阵乘法代码，使得 GPU 实现比 CPU\
  \ 实现快得多。\n\n与通过软件加速训练不同，也有人尝试通过硬件（使用现场可编程门阵列，FPGA）来加速训练。Ly 和 Chow（2010 年）将 RBM 映射到\
  \ FPGA 上，并实现了对优化后软件代码的显著加速。Lo（2010 年）扩展了这项工作，研究了该方法的可扩展性。\n\n### 与深度信念网络相似的深度网络\n\
  \n深度信念网络（DBN）的一种变体，称为模块化深度信念网络（M-DBN），它分别训练网络的不同部分，同时随着训练的进行调整学习率（Pape 等人，2011 年），而不是为整个网络使用一个训练集。这使得\
  \ M-DBN 能够避免遗忘训练早期学到的特征，而这是 DBN 的一个弱点，可能会阻碍其在数据分布随时间动态变化的在线学习应用中的性能。\n\n稀疏深度信念网络（Sparse\
  \ DBN）学习稀疏特征——这与 Hinton 的 DBN 不同，后者学习非稀疏的数据表示——通过在目标函数中对偏离 RBM 公式中隐藏单元预期激活值的情况添加惩罚项来实现（Lee,\
  \ Ekanadham, and Ng，2007 年）。\n\n卷积深度信念网络（Convolutional DBN）通过共享图像中不同位置之间的权重，将平移不变性整合到图像表示中，从而允许在通过卷积放大图像时进行推理（Lee\
  \ 等人，2009 年）。因此，卷积 DBN 能更好地扩展到真实世界大小的图像，而不会因这些图像的高维度而陷入计算难题。\n\n深度信念网络（DBN）并非唯一可用的深度架构。求和-乘积网络（SPN）是一种深度架构，表示为具有有向加权边的图。SPN\
  \ 是无环的（不包含循环），变量位于图的叶节点上，其内部节点由求和与乘积运算组成（Poon and Domingo，2011 年）。SPN 使用反向传播和期望最大化（EM）算法进行训练。这些简单的运算使得该网络比\
  \ DBN 更准确、训练更快且更易于处理。\n\n深度玻尔兹曼机（DBM）与深度信念网络（DBN）相似，但具有更通用的深度架构。它们由堆叠在一起的玻尔兹曼机（BM）组成（Salakhutdinov\
  \ and Hinton，2009 年）。尽管由于 BM 网络中所有神经元之间的对称连接，DBM 比 DBN 更复杂且训练更慢，但双向边使得 DBM 能比 DBN\
  \ 更好地传播输入不确定性，从而使其生成模型更加鲁棒。更复杂的架构需要高效的训练算法才能使训练可行。通过使用近似推理算法，对 DBN 的贪婪训练算法进行了修改，为\
  \ DBM 实现了更高效的训练算法。然而，这使得 DBM 的训练速度比 DBN 慢大约三倍（Salakhutdinov and Larochelle，2010\
  \ 年）。\n\n"
- '# 8. 皮层算法


  如果你只有一个问题要解决，那没问题，尽管使用神经网络。但如果你想做科学研究，理解如何选择架构，或者如何应对一个新问题，你就必须理解不同架构能做什么和不能做什么。


  ——马文·明斯基¹


  自 20 世纪 80 年代中期以来，受人类大脑结构和功能特性启发的计算模型，由于神经科学的重大发现和计算技术的进步，取得了令人瞩目的进展。在这些模型中，皮层算法（CA）作为一种受生物启发的方法脱颖而出，它模仿人类视觉皮层，以不变形式存储模式序列，并能自动联想地回忆这些模式。本章详细介绍了
  CA 的结构和数学公式，然后通过一个案例研究，展示了 CA 在使用基于熵的权重更新识别孤立阿拉伯语音时的泛化准确性。


  ## 皮层算法入门


  皮层算法（CA）最初由 Edelman 和 Mountcastle（1978 年）开发，受人类视觉皮层启发，其定位优于早期几代人工神经网络（ANN），后者在构建机器学习模型时不使用数据中的时间和空间关系。


  CA 模型由一个多层网络组成，其基本结构是皮层柱。该网络以两阶段方式进行训练：第一阶段学习是无监督的，训练皮层柱从出现的模式中识别独立特征；第二阶段依赖于有监督的反馈学习来创建不变表示。




  ### 皮层算法结构


  人脑是一个六层结构，由大量通过前馈和反馈连接紧密相连的神经元组成。新皮层的一个重要特性是其结构和功能的统一性：网络中的所有单元看起来相似，并且执行相同的基本操作。与这种大脑结构类似，皮层算法（CA）架构具有不同厚度的微柱（Edelman
  和 Mountcastle，1978）。微柱是一组共享相同感受野的神经元：属于同一微柱的神经元与相同的感官输入区域相关联。与经典人工神经网络中的神经元不同，微柱是皮层网络中的基本结构。微柱的联合体被称为超柱或层（在下文中，术语“柱”和“微柱”可互换使用）。皮层算法网络中的连接发生在两个方向：水平方向，即同一层内的柱之间；以及垂直方向，即连续层之间的柱之间。尽管人脑皮层中存在非连续层之间的连接，但为了简化，皮层算法中省略了这些连接。


