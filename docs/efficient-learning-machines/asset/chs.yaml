  \n隐藏神经元数量越少，创建的子区域就越少，网络就越倾向于将点聚类并映射到相同的输出。每个神经元的输出是超平面的非线性变换。在分类的情况下，这种由来自前一层的加权输入形成的分离曲线，与该层中的其他神经元一起，共同定义了最终的分类边界。当神经元数量很大时，由于过度训练，过拟合的风险会增加，泛化性能会下降。必须用足够的数据点来训练网络，以确保在每个隐藏层获得的分区能够正确分离数据。\n\
  \n\n\n### ANN 训练与反向传播算法\n\n为了使人工神经网络能够识别属于不同类别的模式，基于现有数据集的训练旨在通过迭代方式获取能使网络性能达到最优的权重和偏置集合（Jain,\
  \ Mao, and Mohiuddin 1996）。\n\n在一个具有 M 个输入、N 个输出神经元和 L 个隐藏层的网络中，给定一组带标签的数据——即 P\
  \ 对 (X, T)，其中 X 是 M 维向量，T 是 N 维向量——学习问题简化为寻找最优权重，以优化代价函数。网络的输出应与目标 T [i] 匹配，并最小化均方误差：\n\
