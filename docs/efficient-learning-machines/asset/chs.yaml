  ## 受限玻尔兹曼机\n\n玻尔兹曼机（BM）是一种两层神经网络架构，其神经元以层间和层内方式连接。受限玻尔兹曼机（RBM）最初由 Smolensky（1986）以\
  \ Harmonium 之名提出，其结构被约束为二分图。二分图是一种两层图，其中两层的节点构成两个不相交的神经元集合。这是通过限制层内连接实现的，即不允许同一层内的节点之间存在连接。这一限制正是\
  \ BM 与 RBM 的区别所在，也使 RBM 更易于训练。具有不同层神经元之间无向连接的 RBM 形成了一种自联想记忆，类似于人脑中的神经元。自联想记忆的特点是存在反馈连接，允许信息在神经元之间双向交换（Hawkins\
  \ 2007）。\n\nRBM 可以通过监督学习和无监督学习两种方式进行训练。权重向量使用 Hinton 的对比散度（CD）算法进行更新（Hinton 2002）。CD\
  \ 是一种近似对数似然梯度的算法，所需的采样步数少于马尔可夫链蒙特卡洛（MCMC）算法（Hinton 2002）。CD 执行 k 步吉布斯采样和梯度下降，以找到使目标函数（即概率的乘积）最大化的权重向量（Hinton\
  \ 2010）。随着 k 的增加，学习模型的性能会提升，但代价是训练时间更长。该参数的典型值为 k = 1（Hinton 2010）。训练算法的工作流程如表 7-1\
  \ 所示。\n\n表 7-1.\n\n使用 CD 的 RBM 训练算法工作流程（Fischer 和 Igel，2012）\n\n![A978-1-4302-5990-9_7_Figaj_HTML.jpg](img/A978-1-4302-5990-9_7_Figaj_HTML.jpg)\n\
