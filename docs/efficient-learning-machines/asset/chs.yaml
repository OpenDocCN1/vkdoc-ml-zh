  \n前几节考虑的场景中，观测值是来自有限字母表的离散符号，从而可以对系统中的每个状态使用离散概率密度。然而，在许多实际应用中，观测值是连续向量。虽然可以通过码本等方式对连续向量进行量化，但量化可能会导致性能下降。因此，采用具有连续观测值的隐马尔可夫模型是有利的，其概率密度函数被评估为其他分布函数的凸组合——即一个混合分布，并带有相应的混合权重。分量的数量被限制为有限个。对于给定的观测池，使用混合分布来对子总体的属性进行统计推断，而无需知道标识观测值所属子总体的标签。分量数量\
  \ M（子总体）取决于对观测池进行分组的观测聚类数量（通过无监督算法学习，例如 k-means）。通常，每个混合分量代表一个 m 维分类分布，其中 M 个可能的结果中的每一个都指定了每个结果的概率。每个混合分量遵循相似的分布（正态分布、对数正态分布等），并代表一种独特的资格，用于将任意时刻的连续观测值集合分类为一个唯一的符号（类似于离散观测值）。使用\
  \ EM 算法训练的混合分量能够自组织以适应数据集。连续观测模型根据状态到聚类发射概率分布，在 HMM 状态转移的每个时间步生成隐藏聚类（或混合符号）序列。聚类（或混合符号）可以被视为嵌入在隐藏状态中的隐藏符号。例如，一个隐藏状态可能代表一个特定的工作负载，而一个符号可能代表该工作负载的某个特定属性，例如基于资源利用率。\n\
  \n首先从概率密度函数的表示开始，该表示允许其参数以一致的方式被重新估计。可用于重估过程的最通用的概率密度函数形式由多元正态分布或高斯混合分布给出：\n\n![A978-1-4302-5990-9_5_Figbs_HTML.jpg](img/A978-1-4302-5990-9_5_Figbs_HTML.jpg)\n\
  \n其中\n\nX = 观测向量 (![A978-1-4302-5990-9_5_Figbt_HTML.jpg](img/A978-1-4302-5990-9_5_Figbt_HTML.jpg))\n\
  \nM = 混合密度数量\n\nc [jm] = 第 j 个状态中第 m 个混合的权重\n\n![A978-1-4302-5990-9_5_Figbu_HTML.jpg](img/A978-1-4302-5990-9_5_Figbu_HTML.jpg)\
  \ = 任意椭圆对称密度函数（例如，高斯函数）\n\nμ [jm] = 第 j 个状态中第 m 个混合的均值向量\n\nU [jm] = 第 j 个状态中第 m\
  \ 个混合的协方差矩阵\n\n![A978-1-4302-5990-9_5_Figbv_HTML.jpg](img/A978-1-4302-5990-9_5_Figbv_HTML.jpg)\n\
  \n在统计学中，混合模型是一种概率模型，其中底层数据属于混合分布。在混合分布中，密度函数是其他概率密度函数的凸组合（即，所有系数或权重之和为 1 的线性组合）。可以证明（Liporace\
  \ 2006; Hwang 1986），混合密度系数 (c [jm] ,μ [jm] ,U [jm] ) 的重估可以表示为：\n\n![A978-1-4302-5990-9_5_Figbw_HTML.jpg](img/A978-1-4302-5990-9_5_Figbw_HTML.jpg)\n\
  \n其中 (X [t] –μ [jk] ) ^T 表示向量转置，而 ε [t] (j, k) 表示在时间 t 处于状态 j 且第 k 个混合分量解释了 X [t]\
  \ 的概率：\n\n![A978-1-4302-5990-9_5_Figbx_HTML.jpg](img/A978-1-4302-5990-9_5_Figbx_HTML.jpg)\n\
  \np [ij] 的重估公式与为离散观测密度定义的公式类似。c [jk] 的重估公式是系统处于状态 j 且使用第 k 个混合分量的期望次数与系统处于状态 j 的期望次数之比。\n\
  \n为了降低计算复杂度，另一种方法是半连续隐马尔可夫模型，它是连续观测隐马尔可夫模型的一种特殊形式。半连续隐马尔可夫模型使用与一组通用混合密度绑定的状态混合密度。所有状态共享相同的混合，只有混合密度分量权重\
  \ c [jk] 保持为状态特定。\n\n### 多元高斯混合模型\n\n在连续观测隐马尔可夫模型中，b [j] (X) 是一个连续概率密度函数，通常是 L 维观测值的多元高斯分布的混合。高斯混合模型密度被定义为高斯密度的加权和。在处理自然现象时，选择高斯分布是自然而然的，并且非常普遍。对于高斯混合，公式\
  \ 5-13 中的 ![A978-1-4302-5990-9_5_Figby_HTML.jpg](img/A978-1-4302-5990-9_5_Figby_HTML.jpg)\
  \ 可以用高斯分布替代，从而得到发射密度的数学形式：\n\n![A978-1-4302-5990-9_5_Figbz_HTML.jpg](img/A978-1-4302-5990-9_5_Figbz_HTML.jpg)\n\
  \n每个高斯混合由其参数集定义，包括混合分布 c [jk] 、均值向量 μ [jk] 和协方差矩阵 U [jk] 。注意，一个以有限高斯概率密度函数混合作为条件密度的连续观测隐马尔可夫模型，等价于一个以简单高斯概率密度函数作为条件密度的模型。使用高斯混合概率密度函数，您可以将一个具有混合密度的状态转换为一个由多个单密度状态组成的网络。图\
  \ 5-4 描绘了一个场景，其中对应于双分量混合概率密度函数的状态 S2 被扩展为两个状态 S2 [a] 和 S2 [b] ，它们具有单分量概率密度函数和调整后的转移概率。\n\
  \n![A978-1-4302-5990-9_5_Fig4_HTML.gif](img/A978-1-4302-5990-9_5_Fig4_HTML.gif)\n\
  \n图 5-4.\n\n状态 S2 的双分量高斯混合模型扩展为具有两个新状态 (S2[a], S2[b]) 的单分量高斯模型\n\n\n\n### 示例：工作负载阶段识别\n\
  \n近期计算机体系结构研究表明，程序执行会表现出可在最大尺度上进行表征的阶段行为（Perelman 等人，2002 年）。在大多数情况下，工作负载行为既非完全同质，也非完全随机；它结构良好，包含一系列阶段。当你在不同阶段之间转换时，可以通过重用重复出现阶段的配置信息来启动重新配置。\n\
  \n数据中心和云计算的发展趋势给服务器系统的功耗优化与功率控制带来了有趣的挑战。一个系统可以表示为一组组件的集合，这些组件通过协同交互产生有用功。这些组件在本质上可能是异构的，并且其功耗和功率控制机制也可能各不相同。一个包含多个中央处理器（CPU）、内存和输入/输出（I/O）组件的服务器系统，可以使用嵌入式控制器或专用硬件来协调功率控制操作。在主动性能调优中，控制操作的准确性和敏捷性至关重要。观察工作负载变化如何影响不同服务器组件的功耗，为分析以及构建将服务质量（QoS）预期与功耗关联起来的模型提供了关键数据。因此，你需要一个能够提取工作负载特征并根据运行阶段主动调优系统的自主系统。以下章节将介绍一种利用服务器平台性能数据来建模系统运行时行为的方法。我们将描述一个经过训练的模型，该模型分析工作负载的行为属性，识别当前阶段，并使用\
  \ CHMM 以合理的准确度预测工作负载特征的未来阶段。\n\n预测系统旨在识别工作负载模式并及早检测阶段以进行特征描述。知识库（模型）会推荐相应的操作。这些系统具有自我修正能力，并且需要持续训练，以适应已知行为以及随时间推移的演化行为。阶段检测模型有助于预测性能状态，并通过调整其参数来主动适应，以满足系统约束。\n\
  \n### 监控与观察\n\n监控和测量系统活动中的事件是表征系统阶段和预测未来的基础。现代处理器内置了性能监控计数器，用于测量处理器和内存事件的实时访问模式，并有助于为各种动态决策设计分析智能。可以对内存访问模式、指令执行速率和流水线停顿等趋势进行统计分析，以发现模式、隐藏相关性以及时间相关行为。测量到的事件（资源利用率、温度、能耗、性能）可以被视为观测输出的多个维度。基于最大化观测序列概率的动态模型，提取出的阶段可以被视为可预测的系统特征。一旦你识别出当前的工作负载运行阶段以及最可能的未来阶段，你就可以用充足的资源调优和配置系统，避免被动的资源分配。基于\
  \ CHMM 的阶段表征过程使用了内置的性能计数器和传感器。此外，还使用合成计数器来抽象工作负载随时间变化的行为。\n\n### 工作负载与阶段\n\n工作负载是具有特定目标（查询、搜索、分析等）的应用程序，它们在多种约束下运行时会经历不同的执行阶段。这些约束与功耗、热量产生和\
  \ QoS 要求相关。由于功耗和性能参数调优具有多种自由度，最佳系统运行涉及复杂的选择。该过程包括建模方法、实现选择和动态调优。工作负载中的阶段检测是一个关键要素，它捕获动态自适应系统随时间变化的行为。这种能力有助于在需求变化之前重新配置硬件和软件，并能够为重复出现的阶段重用训练好的模型。阶段识别还有助于在工作负载执行期间预测未来阶段，从而避免对工作负载行为变化做出被动响应。在此上下文中，阶段是指工作负载表现出相似功耗、温度和性能特征的一个执行阶段。\n\
  \nCHMM 辅助方法能够识别阶段的边界，这些边界由系统传感器和性能计数器存在下的高斯密度混合函数的潜在分量表示。状态变量可用作过程控制参数，并反馈到过程控制回路中。例如，你可以将工作负载阶段（或行为属性）反馈回来主动控制热行为，因为温度的物理动态可以表示为各种系统组件利用率的函数。通常，HMM\
  \ 特别有用，因为它可以利用事件序列中的潜在模式并执行状态空间分析。你可以使用高斯观测值作为在时变工作负载行为中正确识别阶段边界的指标。这些阶段边界可以进一步用于提取与物理现象各种状态（例如服务器需求预测和热变化预测）的关系。例如，图\
  \ 5-5 展示了 CPU 利用率与按固定时间间隔统计估计的工作负载阶段之间的测试关系。通过使用多个变量可以扩展此功能。\n\n![A978-1-4302-5990-9_5_Fig5_HTML.gif](img/A978-1-4302-5990-9_5_Fig5_HTML.gif)\n\
  \n图 5-5.\n\nCPU 利用率与阶段模型。该工作负载由八个阶段组成，每个阶段具有特定的功耗、热和性能特征。红线（底部图表）标识了与每个工作负载实例的运行平均功率限制（RAPL）（蓝线）相对应的阶段编号。例如，平均利用率为\
  \ 65–70% 会导致阶段 1\n\n与聚合工作负载分析相比，CHMM 辅助分析更加准确且信息量更大。通常，对系统硬件和软件进行有效调优有助于构建高效系统，从而在给定性能约束下最小化功耗和热耗散。系统的各种属性都可以从阶段识别中受益：\n\
  \n\n\n*   在给定的性能约束下，您可以调整系统组件（CPU、内存、I/O）以实现最低功耗。当识别到新的阶段时，会以最小化性能下降的方式分配（或解除分配）功率。\n\
  *   对预期性能变化进行主动补偿有助于避免被动状态变化及由此产生的被动延迟，从而提升性能。\n*   可用功率以最大化整体性能的方式分配给系统组件。一种策略可能涉及根据每个组件在性能提升中的份额进行单独分配（或解除分配）。\n\
  *   采用活动向量来执行热平衡计算，从而防止热点。活动数据也可用于以无争用且节能的方式协同调度任务。\n*   您可以分析以下任务特征：(1) 任务优先级，(2)\
  \ 能耗与热特性，以及 (3) 与任务优先级成比例的延迟目标的优化方法。\n\n工作负载阶段可用于自适应架构，通过预测性状态反馈来指导性能和功耗优化。由于 HMM\
  \ 使用观测值并将其与面向目标的状态（如平均温度或利用率）相关联，因此在系统设计中很值得考虑。观测点可以通过使用一组合理的系统级性能计数器和传感器来表征。通过使用特征提取技术提取工作负载阶段，可以测量预测控制目标（如服务器温度）的隐藏状态。此外，状态与这些观测值之间存在概率关系。这些概率关系（也称为配置文件）会随着工作负载在其生命周期内的持续使用而强化和演变。如果您将正常的工作负载行为视为观测序列的一种模式，那么\
  \ HMM 应该适合将这些模式映射到多个状态之一。此外，基于嵌入大量由上下文和环境输入通知的策略，构建自适应策略至关重要。这些策略管理各种行为属性，增强灵活性，以便在高度环境变化的情况下最大化效率和性能。基于\
  \ HMM 的方法关联系统观测值（使用情况、活动配置文件）以预测最可能的系统状态。HMM 训练使用初始数据和连续重估，创建一个由组件模型、转移概率和观测符号概率组成的配置文件。CHMM\
  \ 通过聚类多个组件的同质行为来帮助估计工作负载阶段。工作负载阶段可以通过最大化观测序列概率的 k 个混合的 d 维高斯（观测向量）模型来解释。\n\n###\
  \ 用于阶段检测的混合模型\n\n基于 HMM 的方法的首要目标是通过在存在时变行为的情况下建立各种阶段执行边界来预测过程的状态。与传统研究聚合行为的方法不同，基于\
  \ HMM 的方法可以使用高斯混合模型（GMM）提取代表性阶段并进行工作负载分类。例如，HMM 可以通过针对工作负载及其对应的、由固有行为模式表征的阶段进行自我训练来建模。这些阶段可以被视为嵌入在隐藏状态中的潜在符号（因为它们无法直接观察），而隐藏状态在这种情况下就是工作负载。在训练好的模型中，这些潜在阶段模式可以通过一组观测现象来识别，这些观测现象通过单个混合分量概率密度的组合以及隐藏状态（使用状态转移矩阵评估）的存在来建模。观测值以合成计数器和传感器的形式存在，用于测量系统以及系统组件的性能和功耗特性。以下各节将依次描述有助于工作负载阶段检测的各种功能模块。\n\
  \n#### 传感器模块\n\n在自主系统仪表化中，端点（传感器/控制器）遍布整个平台（见图 5-6），这些端点的特性可能因平台而异。在典型的服务器管理架构中，传感器模块包含性能计数器以及温度、气流和功率传感器的组合。这些传感器通过多种接口访问，例如\
  \ PCI Express、SMBus、PECI 总线和 CPU 型号特定寄存器（MSR）。传感器的输出经过统计处理并用作反馈。仪表化的相对重要性可能因用户需求而异。在某些情况下，由于成本限制，通过将传感器数据与一组不同的变量相关联，使用合成仪表化来代替物理传感器。在其他情况下，物理传感器的仪表化精度可能随工作区域而变化，超出该区域则可能非常不准确。在这种情况下，灵敏度在传感器的整个工作范围内不是恒定的，从而导致非线性。非线性取决于传感器输出在整个传感器范围内与理想行为的偏差。可能需要在线性工作范围内校准传感器，然后在校准后的非线性工作区域使用校准后的参数和函数。由于传感器特性在长时间内老化，传感器数据也可能观察到长期漂移。对于数字传感器，由于测量数据是实际数据的近似值，因此还可能存在数字化误差。此外，采样频率的限制可能导致测量数据出现动态误差。应用程序测量或控制平台某方面的能力在很大程度上取决于其托管位置及其与仪表化端点的连接性。\n\
  \n![A978-1-4302-5990-9_5_Fig6_HTML.gif](img/A978-1-4302-5990-9_5_Fig6_HTML.gif)\n\
  \n图 5-6.\n\n典型 Intel Xeon 服务器平台中的仪表化遥测\n\n系统中的功率、热和性能变化可能导致次优行为，可能需要纠正以符合平台策略。必须提前很好地预测这种行为，以便在机会窗口内采取纠正措施。可以使用一组传感器来预测此类情况，这些传感器共同充当组件高斯模型来模拟整体特征密度。在平台中，这些传感器以活动计数器、温度、功率和性能监视器等形式提供。传感器数据的类别如下：\n\
  \n\n\n*   **CPU 性能计数器**：这些是内置于现代微处理器中的专用硬件计数器，用于在 CPU 上下文中存储与硬件相关活动的计数。这些计数器的输出用于预测常见工作负载的行为，涉及\
  \ CPU 利用率（缓存、流水线、空闲时间、停顿、热效应）。\n*   **内存性能计数器**：内存性能计数器用于识别内存访问模式、带宽利用率、动态随机存取存储器（DRAM）功耗以及\
  \ DRAM 命令活动（读取、写入）的比例，这对于描述工作负载的内存密集型行为非常有用。通过观察读/写周期的比例以及处于预充电、激活和空闲状态的时间，可以描述工作负载模式。\n\
  *   **I/O 性能计数器**：I/O 功耗的三个主要指标是：(1) 直接内存访问（DMA），(2) 不可缓存访问，以及 (3) 中断活动。其中，每周期中断次数是\
  \ I/O 功耗的主要指标。由于 I/O 芯片中存在各种性能增强技术（如写入合并），DMA 指标的表现并非最优。I/O 中断通常由 I/O 设备触发，以指示大数据传输的完成。因此，可以将\
  \ I/O 功耗与相应的设备关联起来。由于无法通过 CPU 计数器获取此信息，操作系统会通过性能监视器提供该数据。\n*   **热数据**：除了上述性能计数器外，您还可以考虑使用热数据。这些数据在所有现代组件（CPU、内存等）中均可获取，并可通过\
  \ PECI 总线访问。\n*   **工作负载性能反馈**：基于控制理论的动作会基于迟滞效应启动防御性响应，以减少资源需求变化的影响。如果该响应干扰了有用工作的性能要求，则需要进行修正。过度的响应会降低系统速度，并对控制动作的有效性产生负面影响。状态反馈在给定时间传达性能需求（或服务级别目标）的最优满足情况。这种反馈需要通过预测与所执行工作行为及其动态需求相关的适应度函数的属性来估算。连续的状态反馈会训练特定于系统的控制动作，并通过将其与未来可能重复出现的独特状态阶段指纹相关联，来保存这些动作的“配方”。\n\
  \n#### 模型降阶模块\n\n模型降阶模块（MRB）负责通过保留关键的不相关且非共线的数据集来降低数据集的维度。这使我们能够保留最重要的数据集——那些足以识别表现出时变行为的工作负载操作阶段的数据集。MRB\
  \ 模型的输入是与微架构性能计数器、工作负载性能计数器以及模拟传感器（测量功耗、温度等）相关的时间序列数据。这些数据可以通过图 5-6 中所示的多种接口（PCI\
  \ Express、SMBus、PECI 总线等）之一进行收集。\n\n您可以使用主成分分析（PCA）来降低数据维度，同时不丢失信息（参见第 2 章）。得到的输出变量是主成分，它们是不相关的。例如，PCA\
  \ 将 N 个输入 ![A978-1-4302-5990-9_5_Figca_HTML.jpg](img/A978-1-4302-5990-9_5_Figca_HTML.jpg)\
  \ 转换为 M 个主成分 ![A978-1-4302-5990-9_5_Figcb_HTML.jpg](img/A978-1-4302-5990-9_5_Figcb_HTML.jpg)，信息重叠非常少\
  \ ![A978-1-4302-5990-9_5_Figcc_HTML.jpg](img/A978-1-4302-5990-9_5_Figcc_HTML.jpg)。此外，每个主成分的方差按降序排列\
  \ ![A978-1-4302-5990-9_5_Figcd_HTML.jpg](img/A978-1-4302-5990-9_5_Figcd_HTML.jpg)，使得\
  \ x [1] 包含最多信息，而 x [M] 包含最少信息。每个主成分定义了一个观测的维度。\n\n#### 发射模块\n\n发射模块（EB）负责以时间序列数据的形式收集不相关的发射数据。从传感器收集的原始数据包含噪声，必须经过滤波才能提取可量化的信息。降噪过程会识别出一个能够良好表示数据的简单动态系统。在训练周期中，降噪方案由一个代表性分布组成，该分布适用于时间窗口\
  \ δt 内的输入数据。流向接收模块（见图 5-7）的传感器数据流会延迟一个可配置的时间段 δt。δt 时间段内数据的行为由底层方程控制，该方程经过训练以拒绝（或重建）数据点。\n\
  \n![A978-1-4302-5990-9_5_Fig7_HTML.gif](img/A978-1-4302-5990-9_5_Fig7_HTML.gif)\n\
  \n图 5-7.\n\n使用 GMM 的阶段检测模型\n\n传感器模块的输出被处理成 EB，EB 处理轮询到的传感器数据序列，以生成连续的观测序列。此外，MRB\
  \ 通过综合那些重要的传感器输入并提供独立特征，来缩减传感器输入的数量。您可以使用一组离散的加权高斯概率密度函数（PDF），每个函数都有自己的均值和协方差矩阵，通过连续发射来更好地建模阶段检测特征。高斯混合模型构成了参数模型，其参数通过使用公式\
  \ 5-14 和 5-15 从训练数据中迭代估计得出。在工作负载阶段检测中，一个由 k 个混合分量组成的 d 维高斯分布（独立发射）被建模为高斯密度的加权和（见公式\
  \ 5-16）。\n\n#### 训练模块\n\n动态系统的特征在于其时序特征，这些特征的时变属性在运行期间会发生变化。这些系统会产生一个时间序列的观测值，可以对其进行分析以获取动态特性。训练模块（TB）通过向预测模型输入度量向量以及对应的工作负载（如系统功耗）的预测变量，来促进预测模型的构建。TB\
  \ 执行无监督分类，并通过将数据划分为同质聚类来构建数据结构，使得相似的对象被分组到同一类中。在最简单的情况下，您可以使用 k-means 聚类算法，该算法将\
  \ d 维发射数据划分为 k 个聚类，使得每个发射数据属于具有最近均值的聚类。对于给定的发射数据集 ![A978-1-4302-5990-9_5_Figce_HTML.jpg](img/A978-1-4302-5990-9_5_Figce_HTML.jpg)，k-means\
  \ 聚类算法通过找到所有 k 个聚类到观测值的最小距离，将发射数据划分为 k 个集合 ![A978-1-4302-5990-9_5_Figcf_HTML.jpg](img/A978-1-4302-5990-9_5_Figcf_HTML.jpg)：\n\
  \n![A978-1-4302-5990-9_5_Figcg_HTML.jpg](img/A978-1-4302-5990-9_5_Figcg_HTML.jpg)\n\
  \n每个 G 元素充当 k 个单密度状态（每个状态代表一个独特的工作负载阶段）的单分量高斯密度函数；μ [i] 表示聚类 i 的均值。\n\n\n\n####\
  \ 参数估计模块\n\n你可以使用 GMM 来表示工作负载阶段预测系统中的特征分布，其中各个分量密度对一组潜在的潜在类别进行建模。参数估计模块（PEB）负责估计模型\
  \ λ [k] 的参数，该模型用于拟合该模型的数据。最初，模型的输入数据是来自 TB 的输出传感器数据，该数据将观测值分类（标记）为聚类编号？分类器使用最小失真或最近邻方法对输入向量进行分类，从混合模型中选择最佳的高斯分量。一旦每个模型的训练数据在时间间隔\
  \ δt 内被缓冲，它们就会被用来估计该模型的高斯混合参数。在没有先验模型的情况下，PEB 会初始化混合数量并估计模型参数（c [k] ,μ [k] ,U [k]\
  \ ）。你可以使用期望最大化（EM）方法，该方法最大化聚类标记数据的似然函数 ![A978-1-4302-5990-9_5_Figch_HTML.jpg](img/A978-1-4302-5990-9_5_Figch_HTML.jpg)（参见第\
  \ 1 章）。EM 算法的基本思想是引入一个变量（高斯混合分量），以简化似然函数的最大化。EM 算法是一个两步法：\n\nE 步：估计给定发射值 (X) 和模型\
  \ (λ) 下每个高斯混合分量的概率分布。  \nM 步：估计数据和潜在变量（高斯混合分量）的联合概率分布。此步骤修改高斯混合分量的模型参数，以最大化发射值和该高斯分量本身的似然函数。\n\
