  \ 增大）。\n\n## DBN 概述\n\nDBN 是一种深度架构，自快速贪婪训练算法（Hinton, Osindero, and Teh 2006）提出以来，在文献中广泛出现。它是由随机神经元按层分组构成的网络，层内无神经元连接。网络的前两层包含具有无向连接的神经元，形成类似于生物神经元的联想记忆，而其余隐藏层则构成一个有向无环图，如图\
  \ 7-5 所示。\n\n![A978-1-4302-5990-9_7_Fig5_HTML.gif](img/A978-1-4302-5990-9_7_Fig5_HTML.gif)\n\
  \n图 7-5.\n\nDBN 架构\n\n尽管 DBN 可以被视为具有更多隐藏层的 ANN，但使用反向传播训练 DBN 并不能产生良好的机器学习模型，因为“解释消除”现象使得深度模型中的推理更加困难。在训练网络时，通常会做出各层独立的简化假设。而解释消除（也称为伯克森悖论或选择偏差）使这一假设无效；隐藏节点变得反相关。例如，如果一个输出节点可以被两个同样罕见且独立的事件激活，且这两个事件同时发生的概率更小（因为两个独立事件同时发生的概率是两者概率的乘积），那么一个事件的发生会否定（“解释消除”）另一个事件的发生，从而在两个事件之间产生负相关。由于训练深度架构的困难，DBN\
  \ 一度失去 popularity，直到 Hinton 和 Salakhutdinov（2006）提出了一种贪婪训练算法来高效地训练它们。该算法将 DBN 分解为顺序堆叠的\
  \ RBM，RBM 是一种两层网络，其约束是只包含层间神经元连接，即不属于同一层的神经元之间的连接。\n\n如图 7-6 所示，层 1 内的神经元之间不允许有连接，层\
  \ 2 也是如此；连接必须仅将层 1 的神经元连接到层 2 的神经元。在 DBN 中，前两层允许有双向连接，而其余层只有有向连接。因此，对深度架构的兴趣重新燃起，因为训练它们变得可行且快速，包括在调整权重之前独立训练\
  \ RBM 单元，并使用上下算法以避免欠拟合（Hinton, Osindero, and Teh 2006）。\n\n![A978-1-4302-5990-9_7_Fig6_HTML.gif](img/A978-1-4302-5990-9_7_Fig6_HTML.gif)\n\
