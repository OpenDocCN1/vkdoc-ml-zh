  \n\n\n## 多类支持向量机\n\n将 SVM 二分类扩展到多类情况的早期工作由 Weston 和 Watkins（1999 年）以及 Platt（2000\
  \ 年）完成。研究人员设计了多种策略来解决多分类问题，包括一对多、成对分类以及多分类公式化方法，下文将逐一讨论。\n\n*   一对多（也称为一对其余[OAA]）可能是最早的\
  \ SVM 多类实现方法，也是最常用的多类 SVM 之一。它构建了 c 个二值 SVM 分类器，其中 c 是类别数。每个分类器将一个类别与所有其他类别区分开来，从而将问题简化为二分类问题。存在\
  \ c 个决策函数：![A978-1-4302-5990-9_3_Figax_HTML.jpg](img/A978-1-4302-5990-9_3_Figax_HTML.jpg)。OAA\
  \ 方法的初始公式规定，当且仅当一个类别接受了某个数据点，而所有其他类别都未接受时，才将该数据点分配给该类别。当多个类别接受它或所有类别都拒绝它时，特征空间中会留下未决策区域。Vapnik（1998）建议将数据点分配给输出值最高的类别，无论其符号如何。最终的标签输出被赋予具有最高输出值的类别：![A978-1-4302-5990-9_3_Figay_HTML.jpg](img/A978-1-4302-5990-9_3_Figay_HTML.jpg)\n\
  *   由 Knerr、Personnaz 和 Dreyfus（1990 年）提出，并由 Friedman（1996 年）和 Kressel（1999 年）首次在\
  \ SVM 中采用，成对分类（也称为一对一[OAO]）构建了 c(c – 1)/2 个二值 SVM，每个 SVM 仅用于区分 c 个类别中的两个，并且需要评估(c\
  \ – 1)个 SVM 分类器。对于来自第 k 类和第 j 类的训练数据，(![A978-1-4302-5990-9_3_Figaz_HTML.jpg](img/A978-1-4302-5990-9_3_Figaz_HTML.jpg))的约束条件为![A978-1-4302-5990-9_3_Figba_HTML.jpg](img/A978-1-4302-5990-9_3_Figba_HTML.jpg)，对于![A978-1-4302-5990-9_3_Figbb_HTML.jpg](img/A978-1-4302-5990-9_3_Figbb_HTML.jpg)\
  \ ![A978-1-4302-5990-9_3_Figbc_HTML.jpg](img/A978-1-4302-5990-9_3_Figbc_HTML.jpg)对于\
  \ ![A978-1-4302-5990-9_3_Figbd_HTML.jpg](img/A978-1-4302-5990-9_3_Figbd_HTML.jpg)\
  \ ![A978-1-4302-5990-9_3_Figbe_HTML.jpg](img/A978-1-4302-5990-9_3_Figbe_HTML.jpg)\n\
  *   多分类目标函数可能具有最紧凑的形式，因为它在一个步骤中优化了问题。其决策函数与 OAA 技术相同。多分类目标函数构建了 c 个二类规则，并且 c 个决策函数求解以下约束条件：![A978-1-4302-5990-9_3_Figbf_HTML.jpg](img/A978-1-4302-5990-9_3_Figbf_HTML.jpg)\
  \ ![A978-1-4302-5990-9_3_Figbg_HTML.jpg](img/A978-1-4302-5990-9_3_Figbg_HTML.jpg)。\n\
  \n对于合理大小的数据集，不同多分类技术的准确性是可比的。对于任何特定问题，最优方法的选择部分取决于所需的准确性，部分取决于开发和训练时间目标。例如，从计算成本的角度来看，OAA\
  \ 和 OAO 差异很大。假设有 c 个不同的类别，共 N 个实例，并且 T(N [1])表示学习一个二值分类器所需的时间。使用 N [1]个样本，OAA 的学习时间为\
  \ cN ^( 3)，而 OAO 则需要 4(c – 1)N ^( 3)/ c ²。\n\n尽管 SVM 参数模型允许在构建判别函数时进行调整，但对于多类问题，这些参数并不总是适用于整个数据集。因此，有时更可取的做法是将数据划分为具有相似特征的子组，并分别推导分类器参数。这个过程产生了多级\
  \ SVM（MSVM）或层次化 SVM，如 Stockman（2010 年）所示，它可以产生更高的泛化准确性并降低过拟合的可能性。图 3-7 展示了单个 SVM\
  \ 和 MSVM 的图形表示。\n\n![A978-1-4302-5990-9_3_Fig7_HTML.gif](img/A978-1-4302-5990-9_3_Fig7_HTML.gif)\n\
  \n图 3-7.\n\n单个多类 SVM 与 MSVM 流程\n\n采用多级方法，可以为每个阶段分别优化不同的核函数和调优参数。第一阶段的 SVM 可以训练用于区分单个类别和其余类别。在下一阶段，SVM\
  \ 可以调整不同的核函数以进一步区分剩余类别。因此，将存在一个二值分类器，每个阶段实现一个决策函数。\n\n作为多类 SVM 的替代方案，层次化 SVM 在整体模型误差方面具有优势。通过选择合适的核函数和平滑元参数值，SVM\
  \ 的准确性接近贝叶斯最优规则。此外，根据定义，对于一个具有 M c[i]个类别的多类问题，以及一个输入向量 x，![A978-1-4302-5990-9_3_Figbh_HTML.jpg](img/A978-1-4302-5990-9_3_Figbh_HTML.jpg)，因为类别应覆盖整个搜索空间。当所考虑的类别不是等概率时，最大值![A978-1-4302-5990-9_3_Figbi_HTML.jpg](img/A978-1-4302-5990-9_3_Figbi_HTML.jpg)必须大于\
  \ 1/M；否则，总和将小于 1。例如，假设正确分类的概率为\n\n![A978-1-4302-5990-9_3_Figbj_HTML.jpg](img/A978-1-4302-5990-9_3_Figbj_HTML.jpg)\n\
  \n其中 R [i]是特征空间中决策支持 c [ i] 的区域。根据区域 R [i]的定义，\n\n![A978-1-4302-5990-9_3_Figbk_HTML.jpg](img/A978-1-4302-5990-9_3_Figbk_HTML.jpg)\n\
  \n➩![A978-1-4302-5990-9_3_Figbl_HTML.jpg](img/A978-1-4302-5990-9_3_Figbl_HTML.jpg);\n\
  \n因此，多分类错误的概率为\n\n![A978-1-4302-5990-9_3_Figbm_HTML.jpg](img/A978-1-4302-5990-9_3_Figbm_HTML.jpg)\n\
  \n随着类别数 M 的增加，对于扁平化的多分类公式，P [e]会增加。对于层次化分类，多分类任务在每个阶段被简化为二分类任务，其中![A978-1-4302-5990-9_3_Figbn_HTML.jpg](img/A978-1-4302-5990-9_3_Figbn_HTML.jpg)。因此，与扁平化的多分类任务相比，层次化任务的累积误差预计会渐近收敛到一个更低的值。\n\
  \n\n\n## 支持向量机与不平衡数据集\n\n在许多实际应用和非合成数据集中，数据往往是不平衡的；也就是说，重要类别（通常称为少数类）的样本数量远少于另一类别（通常称为多数类）。当少数类的风险损失高于多数类时，类别不平衡对分类算法构成了重大挑战。当少数类数据点比多数类数据点更重要，且主要目标是正确分类这些少数类数据点时，以优化整体准确率为导向的标准机器学习方法并不理想；它会产生偏向多数类的超平面，从而导致泛化能力差。\n\
  \n在处理不平衡数据集时，整体准确率是衡量分类器性能的一个有偏指标。相反，混淆矩阵及其包含的真阳性（TP）和假阳性（FP）信息，能更好地指示分类器的性能。混淆矩阵在无监督学习中称为匹配矩阵，在机器学习以外的领域称为误差矩阵或列联矩阵，它直观地展示了实际类别与预测类别的准确率。\n\
  \n准确率指标\n\n混淆矩阵如下所示：\n\n| 预测/实际类别 | 正类 | 负类 |\n| --- | --- | --- |\n| 正类 | TP |\
  \ FP |\n| 负类 | FN | TN |\n\n准确率是指被分类算法正确分类的数据点数量：\n\n![A978-1-4302-5990-9_3_Figbo_HTML.jpg](img/A978-1-4302-5990-9_3_Figbo_HTML.jpg)\n\
  \n正类是对设计者而言最重要的类别，通常也是少数类。\n\n真阳性（TP）（在某些领域也称为召回率）是指从正类中正确分类的数据点数量。\n\n假阳性（FP）是指被预测为正类但实际上属于负类的数据点数量。\n\
  \n真阴性（TN）是指从负类中正确分类的数据点数量。\n\n假阴性（FN）是指被预测为负类但实际上属于正类的数据点数量。\n\n灵敏度（也称为真阳性率 [TPR]\
  \ 或召回率 [RR]）是衡量分类算法对正类数据点分类效果的一个指标：\n\n![A978-1-4302-5990-9_3_Figbp_HTML.jpg](img/A978-1-4302-5990-9_3_Figbp_HTML.jpg)\n\
  \n特异度（也称为真阴性率 [TNR]）是衡量分类算法对负类数据点分类效果的一个指标：\n\n![A978-1-4302-5990-9_3_Figbq_HTML.jpg](img/A978-1-4302-5990-9_3_Figbq_HTML.jpg)\n\
  \n受试者工作特征（ROC）曲线为在不平衡数据集上运行的分类器提供了另一种有用的图形表示。ROC 最初由雷达和电气工程师在第二次世界大战期间为通信和目标预测而开发，后来也被诊断决策领域所采用。Fawcett（2006）对\
  \ ROC 分析进行了全面介绍，并强调了常见的误解。\n\n最初的 SVM 公式在其监督学习阶段并未考虑类别不平衡问题。但是，后续研究提出了针对不平衡数据集分类的\
  \ SVM 公式修改方案。\n\n先前关于 SVM 的工作要么通过预处理数据，要么通过对 SVM 公式提出算法修改来解决类别不平衡问题。Kubat（1997）建议通过随机欠采样多数类（而非过采样少数类）来平衡数据集。然而，这会导致多数类的信息丢失。Veropoulos、Campbell\
  \ 和 Cristianini（1999）为正类和负类引入了不同的损失函数，以惩罚少数类数据点的错误分类。Tax 和 Ruin（1999）通过使用支持向量数据描述（SVDD）解决了类别不平衡问题，其目标是找到一个能够包含少数类并尽可能将其与异常值分离的球体。Feng\
  \ 和 Williams（1999）提出了广义缩放 SVM（GS-SVM），这是 SVM 的另一种变体，它在训练 SVM 后引入了一个超平面平移。平移距离被添加到\
  \ SVM 公式中；平移距离是通过将数据点投影到训练后超平面的法向量上，并找到整个数据集的分布尺度来计算的（Das 2012）。Chang 和 Lin（2011）提出了加权散度\
  \ SVM（WSD-SVM），它通过使用数据点的散度及其基于位置的权重，将全局信息嵌入到 GS-SVM 中。\n\n在数据和算法层面，人们已经做出了许多努力来学习不平衡数据。在学习分类器之前对数据进行预处理，可以通过复制少数类进行过采样以平衡类别分布，或者对多数类进行欠采样，通过从该类中随机消除样本来平衡数据（Kotsiantis,\
  \ Kanellopoulos, and Pintelas 2006）。Tang 等人（2009）推荐了粒度 SVM 重复欠采样（GSVM-RU）算法，该算法并非使用随机欠采样多数类来获得平衡数据集，而是使用\
  \ SVM 本身——其思想是形成多个多数信息粒度，从中提取局部多数支持向量，然后与少数类聚合。Ou、Hung 和 Oyang（2006）以及 Napierała、Stefanowski\
  \ 和 Wilk（2010）提出了另一种从不平衡数据中学习分类器的重采样方法。这些作者得出结论，只有当数据严重受到噪声或边界样本影响时，他们提出的重采样方法才能优于已知的过采样方法。合成少数类过采样技术（SMOTE）算法（Chawla\
  \ 等人，2002）通过在给定的少数类数据点与其最近的少数类邻居之间引入人工少数类样本来对少数类进行过采样。SMOTE 算法的扩展版本已被开发出来，包括一种在距离空间中工作的版本（Koknar-Tezel\
  \ and Latecki 2010）。成本敏感方法也已用于不平衡数据学习。这些方法为错误分类任何数据样本定义了一个成本矩阵，并将该矩阵拟合到分类算法中（He\
  \ and Garcia 2009）。\n\nTax 和 Duin（2004）提出了单类 SVM，它倾向于仅从少数类中学习。单类 SVM 旨在估计概率密度函数，该函数对少数类中的元素给出正值，对其他所有元素给出负值。\n\
  \n通过向少数类的支持向量引入一个乘法因子 z，Imam、Ting 和 Kamruzzaman（2006）认为，学习到的 SVM 的偏差将自动减少，而无需提供任何额外参数，也无需调用多次\
  \ SVM 训练。\n\nAkbani、Kwek 和 Japkowicz（2004）提出了一种基于 SMOTE 算法与正类和负类不同错误成本相结合的算法。Wang\
  \ 和 Japkowicz（2010）也聚合了不同的惩罚因子，并使用 SVM 分类器集成来改善单个分类器的错误，并处理学习到的 SVM 偏斜问题。为了尝试使用\
  \ SVM 标准公式改进不平衡数据集的分类，Ajeeb、Nayal 和 Awad（2013）提出了一种新颖的少数类 SVM（MinSVM），该算法通过在 SVM\
  \ 目标函数中添加一个约束，将边界分离得更靠近多数类。因此，少数类数据点得到优先考虑，被错误分类的概率也更小。\n\n\n\n## 改进 SVM 的计算需求\n\
  \n尽管原始 SVM 公式具有鲁棒性和最优性，但 SVM 在计算上扩展性不佳。由于在大型数据集上训练收敛缓慢，SVM 的在线测试时间可能并非最优；SVM 将分类器超平面模型写为支持向量的总和，其数量无法提前估计，且可能多达数据集的一半。因此，正是对于较大的数据集，SVM\
  \ 无法高效地提供结果，尤其是在非线性分类的情况下。大型数据集在训练期间带来了沉重的计算时间和存储需求，有时甚至使 SVM 比以收敛缓慢著称的 ANN 还要慢。因此，当在线预测需要在计算能力和电源供应有限的平台（如移动设备）上实现实时性能时，支持向量集的基数可能成为一个问题。\n\
  \n人们已进行了许多尝试来加速 SVM。一项关于 SVM 及其变体的综述揭示了加速策略之间的二分法。第一类技术应用于 SVM 算法的训练阶段，该阶段在寻找最优分隔面时会产生更高的计算成本。这些算法的目的是减少数据集的基数并加速优化求解器。第二类技术旨在加速测试周期。随着注重功耗的移动设备的普及，以及计算从云端推向这些终端的普遍趋势，在计算资源有限且需要实时预测的应用中，减少\
  \ SVM 测试周期可能非常有用。例如，移动设备上的在线预测将极大地受益于减少执行预测所需的计算量。\n\n为了降低 SVM 优化问题的计算复杂度，Platt\
  \ (1998) 开发了序列最小优化 (SMO) 方法，该方法将优化问题分解为两个二次规划 (QP) 问题。这种分解减轻了算法对大量内存的需求，使得在大型数据集上训练\
  \ SVM 成为可能。因此，该算法的增长在线性和二次之间交替，具体取决于数据集大小。SMO 仅加速了训练阶段，无法控制支持向量的数量或测试时间。为了实现进一步的加速，在各种并行编程平台上开发了许多\
  \ SMO 的并行实现 (Zeng 等人 2008; Peng, Ma, 和 Hong 2009; Catanzaro 等人 2008; Alham 等人 2010;\
  \ Cao 等人 2006)，包括图形处理单元 (GPU) (Catanzaro 等人 2008)、Hadoop MapReduce (Alham 等人 2010)\
  \ 和消息传递接口 (MPI) (Cao 等人 2006)。\n\n使用 Cholesky 分解 (Gill 和 Murray 1974)，Fine (2002)\
  \ 通过采用一个需要随训练集大小线性扩展的更新的低秩矩阵来近似核矩阵。然后将该矩阵输入 QP 求解器，以获得 SVM 分类问题的近似解。这种方法被称为 Cholesky\
  \ 乘积形式 QP，显示出显著的训练时间减少，其近似解由 SMO 提供。然而，如果训练集包含冗余特征，或者支持向量被一个较大的值缩放，则此方法可能无法收敛 (Fine\
  \ 和 Scheinberg 2002)。\n\nLee (2001a) 没有分解优化问题，而是将约束优化重新表述为一个无约束的平滑问题，该问题可以在二次时间内使用\
  \ Newton-Armijo 算法求解。这种重新表述在多个数据库上提高了标准 SVM 公式 (Vapnik 1999) 的测试精度 (Lee 2001)。此外，Lee\
  \ (2001) 认为，这种重新表述允许随机选择向量子集，并强制创建更多的支持向量，而不会严重影响模型的预测精度。\n\nKong 和 Wang (2010)\
  \ 通过计算特征空间中的自中心和互中心距离，并根据这些点的比率和中心距离消除统计上不显著的点，来识别边界向量。训练集被强制平衡，并将结果与在加州大学欧文分校机器学习库\
  \ (Frank 和 Asuncion 2010) 的三个数据集上使用简化 SVM (RSVM) 得到的结果进行了比较。作者发现，该模型比 RSVM 具有更好的泛化性能，但由于计算比率和中心距离的开销，它需要稍长的训练时间。\n\
  \nZhang (2008) 使用 k-近邻 (k-NN) 算法识别边界向量。使用此方法，计算每个向量与所有其他向量之间的距离，并保留那些在其 k 个近邻中具有相反类别向量的向量。对于线性不可分问题，k-NN\
  \ 应用于核空间，在该空间中数据集是线性可分的。预提取的边界向量用于训练 SVM。由于这个子集比原始数据集小得多，训练会更快，并且支持向量集也会更小。\n\n\
  Downs, Gates, 和 Masters (2002) 试图通过从 SMO 求解器产生的支持向量集中消除那些线性依赖于其他支持向量的向量，来减少预测阶段使用的支持向量数量。因此，最终的支持向量集由在核空间中通过使用行简化阶梯形获得的所有线性无关的支持向量组成。尽管这种方法对多项式核和具有大\
  \ sigma 值的 RBF 核产生了缩减，但减少的支持向量数量无法提前预测，并且取决于核函数和具体问题。\n\nNguyen (2006) 通过使用一个不属于原始训练集的构造支持向量，迭代地替换属于同一类别的两个最近的支持向量，来减少支持向量集。该算法在训练集上训练\
  \ SVM 并获得支持向量集后应用。该算法在美国邮政服务数据库 (Le Cun 1990) 上进行了测试，并在预测精度几乎没有降低的情况下，显著减少了支持向量集的基数。\n\
  \nRizk, Mitri, 和 Awad (2013) 提出了一种局部混合 SVM (LMSVM)，该方法利用核技巧提供的增强可分离性，同时引入一次性的计算成本。LMSVM\
  \ 在核空间中对数据应用核 k-均值聚类，然后基于标签异质性的混合度量修剪不需要的聚类。扩展这一概念，Rizk, Mitri, 和 Awad (2014) 提出了膝点切割\
  \ SVM (KCSVM) 和受膝点切割序优化启发的 SVM (KCOOSVM)，采用有序核值的软技巧和均匀子采样来降低 SVM 的计算复杂度，同时保持对其泛化能力的可接受影响。\n\
  \n\n\n## 支持向量机在手写识别中的案例研究\n\n自动手写识别（HWR）在多种离线与在线传感任务中正变得日益流行。鉴于人们对节能计算的意识不断增强，开发既稳健又计算高效的算法仍然是一个具有挑战性的问题。离线识别通过光学扫描单词，然后将这些图像转换为计算机软件环境中可用的字母代码。在线识别则自动将图形输入板或笔触式电脑屏幕上的书写内容转换为字母代码。HWR\
  \ 系统也可分为依赖书写者与独立于书写者两类，由于提供的数据方差较小，依赖书写者的系统识别率更高。\n\n由于孤立字母的 HWR 是在线 HWR 的关键步骤，我们在此展示一个案例研究，旨在开发一个高效的、独立于书写者的孤立字母\
  \ HWR 系统，该系统使用笔迹轨迹建模进行特征提取，并使用多类支持向量机（MSVM）进行分类（Hajj and Awad 2012）。除了强调该应用的重要性外，本案例研究还说明了如何从序列数据中创建静态特征，以及如何将多类任务转换为分层任务。通常，隐马尔可夫模型（HMM）更擅长建模和识别序列数据，但通过适当的特征生成方案，SVM\
  \ 模型可用于对中等规模手写词汇量的可变序列长度进行建模。\n\n所提出的 HWR 工作流程包括：预处理、特征提取以及一个分三阶段的分层分类阶段。\n\n###\
