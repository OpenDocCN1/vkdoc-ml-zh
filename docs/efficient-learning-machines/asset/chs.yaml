  \n### 朴素贝叶斯\n\n朴素贝叶斯是一种简单的概率分类器，它应用了贝叶斯定理，并带有特征之间相互独立的强（朴素）假设，即一个类别的某个特征的出现与另一个特征的出现无关。\n\
  \n假设输入特征 x [1], x [2], ... x [n] 在给定类别标签 Y 的条件下彼此条件独立，即：\n\n![A978-1-4302-5990-9_1_Figf_HTML.jpg](img/A978-1-4302-5990-9_1_Figf_HTML.jpg)\n\
  \n对于二分类问题（i = 0, 1），我们将 P(i|x) 定义为测量向量 x={x [1], x [2]...x [3]} 属于类别 i 的概率。此外，我们定义一个分类得分：\n\
  \n![A978-1-4302-5990-9_1_Figg_HTML.jpg](img/A978-1-4302-5990-9_1_Figg_HTML.jpg)\
  \ ![A978-1-4302-5990-9_1_Figh_HTML.jpg](img/A978-1-4302-5990-9_1_Figh_HTML.jpg)\n\
  \n其中 P(i|x) 与 f(x|i)P(i) 成正比，而 f(x|i) 是类别 i 对象的 x 的条件分布。\n\n朴素贝叶斯模型因其简单性和鲁棒性而异常有效且极具吸引力。由于该算法无需对大型数据集应用复杂的迭代参数估计方案，因此它非常有用，且构建和使用相对容易。它是文本分类和垃圾邮件过滤等相关领域中的流行算法。\n\
  \n### 分类与回归树\n\n分类与回归树（CART）是一种非参数决策树，它使用二元递归划分方案，从包含完整学习样本的根节点开始，反复分裂两个子节点（Breiman\
  \ 等人，1984 年）。树的生长过程涉及在每个节点所有可能的分裂中进行选择，使得生成的子节点“最纯”。一旦 CART 生成了一个“最大树”，它就会检查通过剪除最大树的分支而获得的较小树，以确定哪些分支对训练数据上树的整体性能贡献最小。CART\
  \ 机制旨在产生一系列嵌套的剪枝树。通过评估剪枝序列中每棵树的预测性能，可以确定大小合适或“诚实”的树。\n\n## 数据挖掘研究中的挑战性问题\n\n数据挖掘和知识发现已成为与数据库系统、机器学习、智能信息系统、专家系统、控制理论等众多领域相关的跨学科研究领域。数据挖掘是一个重要且活跃的研究领域，但在处理可能包含噪声、不完整、冗余且本质动态的超大型数据库时，也面临着理论和实践上的挑战。Yang\
  \ 和 Wu（2006 年）的一项研究回顾了数据挖掘研究中最具挑战性的问题，总结如下。\n\n### 面向高维数据与高速数据流的扩展\n\n设计能够处理通过高速数据流提取的极高维特征的分类器是一项挑战。为了确保决定性优势，此类情况下的数据挖掘应是一个持续的在线过程。但是，技术上的挑战阻碍了我们在存在环境漂移和概念漂移的情况下，对大量流式数据计算模型。如今，我们尝试通过增量挖掘和离线模型更新来解决这个问题，以保持对当前数据流的准确建模。通过开发内存数据库、高密度存储器和大容量存储，并辅以高性能计算基础设施，信息技术方面的挑战正在得到解决。\n\
  \n### 挖掘序列数据与时间序列数据\n\n对序列化和时间序列数据进行有效的分类、聚类和预测，至今仍是一个开放的挑战。时间序列数据常常受到噪声的污染，这会对短期和长期预测产生不利影响。尽管可以使用信号处理技术或平滑方法来过滤噪声，但可能会导致过滤后的数据出现滞后。在闭环环境中，这可能会降低预测的准确性，因为我们最终可能会对过程本身过度补偿或供给不足。在某些情况下，可以通过差分预测器来纠正滞后，但这可能需要对模型本身进行大量调整。放置在数据输入/输出模块附近的噪声消除滤波器，可以在挖掘之前进行调整，以识别和清理噪声数据。\n\
  \n### 从复杂数据中挖掘复杂知识\n\n复杂数据可以多种形式存在，可能需要特殊技术来提取对制定现实世界决策有用的信息。例如，信息可能以图形形式存在，需要发现大型数据中图形和结构化模式的方法。另一种复杂性可能以非独立同分布（non-iid）数据对象的形式存在，这些对象不能作为独立的单个对象进行挖掘。它们可能与其他数据对象共享应被识别的关系结构。\n\
  \n用于非结构化数据的最先进的数据挖掘方法，缺乏整合领域知识和知识接口的能力，无法将数据挖掘的结果与现实世界场景联系起来。\n\n### 分布式数据挖掘与多智能体数据挖掘\n\
  \n在分布式数据感知环境中，发现分布式模式并关联通过不同探针流式传输的数据可能具有挑战性。目标是最大限度地减少数据交换量并降低所需的通信带宽。可以部署博弈论方法来应对这一挑战。\n\
  \n\n\n### 数据挖掘过程中的相关问题\n\n自动化的数据挖掘与清洗操作能够显著提升数据挖掘效率。尽管我们可以快速处理模型并发现模式，但数据集成与数据清洗等预处理操作会产生主要成本。通过自动化降低这些成本所带来的收益，远大于试图进一步降低模型构建与模式发现成本所获得的回报。\n\
  \n### 安全性、隐私与数据完整性\n\n在数据挖掘过程中确保用户隐私至关重要。保证所收集输入数据与合成个体模式的知识完整性同样不可或缺。\n\n### 处理非静态、不平衡与成本敏感数据\n\
  \n数据在不同领域中动态且持续变化。历史的数据采样与模型构建试验可能并非最优方案。当基于新训练数据重新训练当前模型时，由于不同的选择偏差，可能会经历学习漂移。为进行准确预测，需要动态纠正此类偏差。\n\
  \n## 总结\n\n本章通过关键术语、机器学习类型以及十大数据挖掘与机器学习算法，探讨了机器学习的核心要点。由于万维网上数据的爆炸式增长，机器学习已广泛应用于网络搜索、广告投放、信用评分、股市预测、基因序列分析、行为分析、智能优惠券、药物研发、天气预报、大数据分析等诸多领域。每天都有新的机器学习应用被探索。大数据分析与图分析已成为基于云的商业发展的重要组成部分。数据分析新领域与机器学习应用也加速了专用硬件与加速器的发展，以提升算法性能、大数据存储与数据检索能力。\n\
  \n"
- "# 2. 机器学习与知识发现\n\n知之为知之，不知为不知，是知也。——孔子《论语》\n\n近年来，数据挖掘领域取得了显著进展。由于能够解决复杂问题，数据挖掘已应用于工程、生物科学、社交媒体、医学与商业智能等多个领域。大多数应用的主要目标是表征复杂数据流中的模式。这些模式随后与知识发现和决策相结合。在互联网时代，信息收集与时空数据的动态分析是创新以及开发更优产品与流程的关键。当数据集庞大且复杂时，使用传统统计方法处理和分析模式变得困难。大数据是指收集到的数据量巨大、形式复杂且非结构化，以至于无法使用标准数据库管理系统（如\
  \ DBMS 和 RDBMS）进行处理。与大数据相关的新兴挑战不仅包括处理日益增长的数据量，还包括需要提取、转换、分析、存储和可视化的数据流的广泛多样性与复杂性。大数据分析利用推断统计学，从信息密度低且受随机变化影响的大规模数据集中得出关于依赖性、行为与预测的结论。此类系统应能以在广泛情境下应用时产生合理答案的格式，对知识发现进行建模。大数据的特征如下：\n\
  \n*   **海量性**：生成的数据量巨大。从如此庞大的数据量中检测相关性与价值颇具挑战。\n*   **多样性**：数据类型与来源范围广泛。\n*   **高速性**：数据生成速度快。及时做出反应可能要求很高。\n\
  *   **波动性**：由于季节性和事件驱动的峰值，数据流可能高度不一致且难以管理。\n*   **复杂性**：数据需要被链接、关联和相互关联，以推断非线性关系与因果效应。\n\
  \n现代技术进步使工业界得以涉足大数据与大数据分析。经济实惠的开源软件基础设施、更快的处理器、更便宜的存储、虚拟化、高吞吐量连接以及非结构化数据管理工具的发展，结合云计算，为高质量信息检索与更快速的分析打开了大门，使企业能够降低成本并缩短开发具有定制化功能的新产品所需的时间。\n\
  \n大数据与强大的分析能力可以整合起来，提供有价值的服务，例如：\n\n\n\n*   **故障根本原因检测**：意外故障导致的计划外停机成本可能高达数十亿美元。根本原因分析（RCA）能够识别决定过去故障位置、规模、时间和性质的因素，并学习关联可防止此类故障再次发生的行动、条件和行为。RCA\
  \ 将被动应对故障的方法转变为主动解决问题的方法，在问题发生前就加以解决，并避免不必要的升级。\n*   **动态优惠券系统**：动态优惠券系统能够以极具选择性的方式发放折扣券，其发放方式与能够为产品或服务提供商带来最大战略利益的因素相对应。控制向选定接收者发放优惠券的因素，是基于现有地理位置、对特定产品的评估兴趣、历史消费模式、动态定价、按时间顺序的购物地点访问、产品浏览模式以及过往优惠券的兑换情况来建模的。这些因素中的每一个都会根据竞争压力、行为转变、季节性影响、外部因素以及产品成熟度动态进行加权和重新分析。优惠券会根据接收者的个人资料、情境和位置实时发放。向大量移动接收者发放优惠券的速度、精确度和准确性是需要考虑的重要因素。\n\
  *   **购物行为分析**：产品制造商尤其希望了解其竞争对手产品在卖场的热力图模式。例如，大屏幕电视制造商会想确定买家对其他电视制造商所提供功能的兴趣。这只能通过评估潜在买家在卖场中靠近竞争对手产品时的移动轨迹和停留时间来分析。此类报告可以实时地、针对单个制造商提供，也可以定期地、以汇总形式提供。这些报告可能会促使制造商发放动态优惠券，以影响仍处于决策阶段的潜在买家，同时也有助于制造商根据买家对竞争对手产品的兴趣程度，来改进、移除、保留或增强产品功能。\n\
  *   **检测欺诈行为**：与保险、医疗保健、信用卡和身份盗窃相关的各类欺诈行为每年给消费者和企业造成数十亿美元的损失。大数据和智能分析为开发实时解决方案以识别欺诈并在其发生前进行预防铺平了道路。智能分析会生成模型，用于验证与消费行为、地理位置、活动高峰和保险索赔相关的模式。如果某个模式无法验证，则会启动纠正、预防或惩罚措施。这些措施的准确性、精确性和速度对于成功隔离欺诈行为至关重要。例如，每笔交易可能会实时使用一个或多个模型评估多达\
  \ 500 个属性。\n*   **数据中心的工作负载资源调优与选择**：在云服务管理环境中，服务水平协议（SLA）定义了服务质量（QoS）的预期，用于管理由计算资源池构成的特定服务托管环境中的性能损失。通常，服务器系统中资源相互依赖的复杂性会导致次优行为，进而造成性能损失。一个表现良好的模型能够预测需求模式，并以及时和优化的方式主动应对动态压力。动态表征方法可以合成一个自校正的工作负载指纹码本，该码本有助于进行阶段预测，通过主动的工作负载分配和负载均衡实现持续调优。换句话说，码本表征了某些特征，这些特征会被持续重新评估，以重塑工作负载行为，从而适应与预期输出的偏差。然而，码本中最新的模型可能尚未经历过更新或未识别的模式。新的工作负载被托管在某个计算节点（在数千个潜在节点中）上，这种方式不仅能减少热热点，还能通过降低资源瓶颈来提升性能。能够实时分析并得出最优工作负载托管方案的速度，对于工作负载分配和均衡的成功至关重要。\n\
  \n## 知识发现\n\n知识提取从结构化和非结构化来源收集信息，以构建知识数据库，用于从底层庞大且语义模糊的数据集中识别有意义且有用的模式。模糊数据集是其元素具有隶属度的集合。隶属度由取值在\
  \ 0 到 1 之间的隶属函数定义。\n\n提取的知识与源数据结合被重用，以生成模式的枚举，这些模式会被添加回知识库。知识发现的过程涉及对大量数据进行程序化探索，以寻找可被枚举为知识的模式。所获取的知识以模型的形式呈现，必要时可对这些模型提出特定查询。知识发现将计算机科学和机器学习（如数据库和算法）的概念与统计学的概念相结合，以解决面向用户的问题和疑问。知识可以用不同的形式来描述，例如参与者类别、属性关联模型和依赖关系。大数据中的知识发现使用核心机器学习算法，这些算法专为分类、聚类、降维和协同过滤以及可扩展的分布式系统而设计。本章讨论的是，当单台机器要处理的数据集非常大时，那些有用的机器学习算法类别。\n\
  \n### 分类\n\n分类是开发能够复制人类决策的预测分析的核心。分类算法适用于边界清晰的问题，即输入遵循一组特定属性，且输出是分类的。通常，分类过程会建立一个经验档案，通过将新输入与先前观察到的模式进行匹配来评估新输入。如果模式能够匹配，则将该输入与预定义的预测行为模式关联起来。如果模式无法匹配，则将其隔离以进行进一步评估，以确定它是未发现的有效模式还是异常模式。基于机器的分类算法遵循监督学习技术，即算法通过使用精心准备的输入，从准确决策的示例（也称为训练集）中学习。分类涉及的两个主要步骤是：使用学习算法合成模型，以及利用该模型对新数据进行分类。\n\
  \n### 聚类\n\n聚类是一个知识发现过程，它根据相似的属性（或特征）对给定集合中的项目进行分组。同一聚类中的成员具有相似的特征，而不同聚类中的成员则特征不同。通常，聚类涉及一个迭代的试错算法，该算法基于相似性（或相异性）假设运行，并在满足终止条件时停止。挑战在于找到一个函数，能够将两个项目（或数据点）之间的相似程度量化为一个数值。聚类的参数——例如聚类算法、距离函数、密度阈值和聚类数量——取决于具体的应用和单个数据集。\n\
  \n\n\n### 降维\n\n降维是通过特征选择和特征提取来减少随机变量的过程。降维可以缩短训练时间、增强泛化能力并减少过拟合。特征选择是通过消除冗余或不相关的特征，合成原始变量的子集用于模型构建的过程。相比之下，特征提取则是通过组合属性，将高维空间转换为更低维空间的过程。\n\
  \n### 协同过滤\n\n协同过滤是利用多个数据源之间的协作方法，对信息或模式进行过滤的过程。协同过滤通过收集具有相似兴趣的众多用户的偏好，并基于这些偏好做出推荐，从而探索感兴趣的领域。协同过滤算法期望在数据极其稀疏、用户和项目数量不断增长、存在同义词、数据噪声和隐私问题的情况下，仍能在短时间内做出令人满意的推荐。\n\
  \n机器学习基于从训练数据（模型）中习得的既定属性进行预测分析。机器学习通过将新信息与以模式形式存在的历史信息进行匹配，帮助探索有用的知识或先前未知的知识。这些模式用于过滤出新信息或模式。一旦这些新信息经过一组关联行为模式的验证，就会被整合到现有的知识库中。新信息也可能作为额外的训练数据，对现有模型进行修正。以下各节将探讨知识发现中使用的各种机器学习算法，涉及聚类、分类、降维和协同过滤。\n\
  \n## 机器学习：分类算法\n\n### 逻辑回归\n\n逻辑回归是一种概率统计分类模型，用于预测事件发生的概率。逻辑回归对分类因变量 X 与二分法分类结果或特征\
  \ Y 之间的关系进行建模。逻辑函数可以表示为\n\n![A978-1-4302-5990-9_2_Figa_HTML.jpg](img/A978-1-4302-5990-9_2_Figa_HTML.jpg)\n\
  \n逻辑函数可以重写并转换为逻辑函数的反函数——称为 logit 或对数几率——这是生成逻辑回归系数的关键，\n\n![A978-1-4302-5990-9_2_Figb_HTML.jpg](img/A978-1-4302-5990-9_2_Figb_HTML.jpg)\n\
  \n如图 2-1 所示，逻辑函数可以接收负无穷到正无穷之间的输入值范围（β [0] +β [1] X），并且输出（P(Y|X)）被限制在 0 到 1 之间。\n\
  \n![A978-1-4302-5990-9_2_Fig1_HTML.gif](img/A978-1-4302-5990-9_2_Fig1_HTML.gif)\n\
  \n图 2-1.\n\n逻辑函数\n\nP(Y|X) 的 logit 变换为线性回归提供了动态范围，并且可以转换回几率。逻辑回归方法使用回归系数 β [0] 和\
  \ β [1] 拟合回归曲线，如公式 2-1 所示，其中输出响应是二元（二分法）变量，X 是数值型。由于逻辑函数曲线是非线性的，因此使用 logit 变换（见公式\
  \ 2-2）来执行线性回归，其中 P(Y  |X) 是给定 X 值时成功（Y）的概率。使用广义线性模型，可以构建一个估计的逻辑回归方程，如下所示\n\n![A978-1-4302-5990-9_2_Figc_HTML.jpg](img/A978-1-4302-5990-9_2_Figc_HTML.jpg)\n\
  \n系数 β [0] 和 β [k]（k = 1, 2, ..., n）使用最大似然估计进行估计，以模拟因变量 Y 在给定 X [k]（k = 1, 2, ...,\
  \ n）值时取值为 1 的概率。\n\n逻辑回归广泛应用于结果以二元格式呈现的领域。例如，要根据身体质量指数预测血液胆固醇水平，你会使用线性回归，因为结果是连续型的。如果需要根据身体质量指数预测患糖尿病的几率，你会使用逻辑回归，因为结果是二元型的。\n\
  \n### 随机森林\n\n随机森林（Breiman 2001）是一种用于分类的集成学习方法，其中“弱学习器”通过使用大量去相关决策树（即随机森林）协作形成“强学习器”。然而，随机森林并非基于单个深层树的输出来制定解决方案，而是聚合多个浅层树的输出，形成装袋法的额外一层。装袋法通过对数据集进行自助采样，使用独立的连续树构建\
  \ n 个预测器。这 n 个预测器通过平均化组合起来，以解决分类或估计问题。尽管单个分类器是弱学习器，但所有分类器组合起来就形成了一个强学习器。单个决策树具有高方差和高偏差，而随机森林通过平均多个决策树来提升估计性能。在集成术语中，决策树代表一个弱分类器。术语“森林”表示使用多个决策树来做出分类决策。\n\
  \n随机森林算法可以总结如下：\n\n要构建 B 棵树，从原始数据集中选择 n 个自助样本。  \n对于每个自助样本，生长一棵分类树或回归树。  \n在树的每个节点：\
  \  \n– 从所有预测变量中随机选择 m 个预测变量（或特征子集）（随机子空间）。  \n– 提供最佳分割的预测变量在该节点执行二元分割。  \n– 下一个节点从所有预测变量中随机选择另一组\
  \ m 个变量，并执行上一步骤。  \n给定一个待分类的新数据集，取所有 B 棵子树的多数投票结果。\n\n通过对树的集成进行平均，可以降低最终估计的方差。随机森林具有良好的准确性，并且能在大型数据集上高效运行。它是估计缺失数据的有效方法，即使大量数据缺失也能保持准确性。此外，随机森林可以估计变量对于分类的相对重要性。\n\
  \n\n\n### 隐马尔可夫模型\n\n隐马尔可夫模型（HMM）是一个双重随机过程，其中被建模的系统是一个具有未观测（隐藏）状态的马尔可夫过程。尽管底层的随机过程是隐藏的且无法直接观测，但可以通过另一组产生观测符号序列的随机过程来观察它。在传统的马尔可夫模型中，状态对观测者是可见的，并且状态转移通过转移概率进行参数化。每个状态都有一个关于输出发射（观测变量）的概率分布。基于\
  \ HMM 的方法将系统观测与状态转移关联起来，以预测最可能的状态序列。HMM 的状态只能从观测到的发射中推断出来——因此使用了“隐藏”这一术语。由 HMM 生成的输出发射序列用于估计状态序列。HMM\
  \ 是生成式模型，其中对观测和隐藏状态的联合分布进行建模。要定义一个隐马尔可夫模型，需要指定以下属性（见图 2-2）：\n\n![A978-1-4302-5990-9_2_Fig2_HTML.gif](img/A978-1-4302-5990-9_2_Fig2_HTML.gif)\n\
  \n图 2-2.\n\nHMM 的属性\n\n*   状态集合：{S [1],S [2]...,S [n] }\n*   状态序列：Q=q [1],q [2],...,q\
  \ [t]\n*   马尔可夫链性质：![A978-1-4302-5990-9_2_Figd_HTML.jpg](img/A978-1-4302-5990-9_2_Figd_HTML.jpg)\n\
  *   观测集合：O={o [1],o [2],o [3],...,o [M] }\n*   转移概率矩阵：![A978-1-4302-5990-9_2_Fige_HTML.jpg](img/A978-1-4302-5990-9_2_Fige_HTML.jpg)\n\
  *   发射概率矩阵：![A978-1-4302-5990-9_2_Figf_HTML.jpg](img/A978-1-4302-5990-9_2_Figf_HTML.jpg)\n\
  *   初始概率矩阵：![A978-1-4302-5990-9_2_Figg_HTML.jpg](img/A978-1-4302-5990-9_2_Figg_HTML.jpg)\n\
  *   HMM：M = (A,B,π)\n\nHMM 解决的三个基本问题可总结如下：\n\n*   模型评估：评估给定 HMM（M=(A,B,π)）下观测序列的似然性。\n\
  *   路径解码：评估给定观测序列和 HMM 模型 M=(A,B,π)下的最优模型状态序列（Q）（隐藏状态）。\n*   模型训练：确定最能解释观测信号的一组模型参数。\n\
  \nHMM 尤其以其在时间模式识别中的应用而闻名，例如语音、手写、手势识别、词性标注、乐谱跟随、局部放电和生物信息学。有关 HMM 的更多详细信息，请参见第 5\
  \ 章。\n\n### 多层感知器\n\n多层感知器（MLP）是一个由简单神经元组成的前馈网络，它将输入数据集映射到一组输出上。MLP 包含多个由有向图全连接的节点层，其中每个节点（输入节点除外）都是一个具有非线性激活函数的神经元。\n\
  \nMLP 的基本组成部分是神经元。在 MLP 中，一对神经元通过加权边在两个相邻层中连接。如图 2-3 所示，MLP 至少包含三层神经元，包括一个输入层、一个或多个隐藏层以及一个输出层。输入神经元的数量取决于输入特征的维度；输出神经元的数量由类别数决定。隐藏层的数量以及每个隐藏层中神经元的数量取决于所解决问题的类型。神经元数量过少会导致学习效率低下；神经元数量过多则会导致泛化效率低下。MLP\
  \ 使用一种称为反向传播的监督学习技术来训练网络。在其简单实例中，感知器通过非线性激活函数处理加权实值输入的线性组合来计算输出 y，\n\n![A978-1-4302-5990-9_2_Fig3_HTML.gif](img/A978-1-4302-5990-9_2_Fig3_HTML.gif)\n\
  \n图 2-3.\n\nMLP 将输入特征馈送到输入层，并从输出层获取结果；结果通过从输入层到输出层的前馈方式计算\n\n![A978-1-4302-5990-9_2_Figh_HTML.jpg](img/A978-1-4302-5990-9_2_Figh_HTML.jpg)\n\
  \n其中 w 表示权重向量，x 是输入向量，b 是偏置，ϕ是激活函数。通常，MLP 系统选择逻辑 Sigmoid 函数 1/(1+e ^(–x) )或双曲正切函数\
  \ tanh(x)作为激活函数。这些函数提供了统计上的便利，因为它们在原点附近是线性的，并且当远离原点时会迅速饱和。\n\nMLP 的学习过程会调整隐藏层的权重，从而减少输出误差。从随机权重开始，MLP\
  \ 将输入模式信号通过网络前馈，并从输出层开始反向传播误差信号。反向传播的误差信号由实际值（O [n] (t)）和期望值（T [n] ）之间的差异构成。误差函数可总结为\n\
  \n![A978-1-4302-5990-9_2_Figi_HTML.jpg](img/A978-1-4302-5990-9_2_Figi_HTML.jpg)\n\
  \n学习过程的目标是最小化误差函数。为了找到误差函数的最小值，需要对其关于权重矩阵进行微分。学习算法包括以下步骤：\n\n在区间[1, –1]内初始化随机权重。\
  \   向网络发送一个输入模式。   计算网络的输出。   对于输出层中的每个节点 n：计算输出节点 n 上的误差：E(O [n] (t))=T [n] –O\
  \ [n] (t)。   将 E(O [n] (t))添加到所有连接到节点 n 的权重上。     重复步骤 2。  \n\n为了影响收敛速度，从而减小权重进行自适应变化时的步长，会使用一个学习参数η\
