  人工智能的关键始终在于表示。 — 杰夫·霍金斯


  基于统计学习或 Vapnik-Chervonenkis (VC) 理论，支持向量机 (SVM) 能够很好地泛化到未见过的数据。第 3 章中介绍的 SVM 概念可以推广到适用于回归问题。与分类一样，支持向量回归
  (SVR) 的特点在于使用核函数、稀疏解以及对间隔和支持向量数量的 VC 控制。虽然不如 SVM 流行，但 SVR 已被证明是实值函数估计的有效工具。作为一种监督学习方法，SVR
  使用对称损失函数进行训练，该函数对高估和低估错误给予同等惩罚。采用 Vapnik 的 ![A978-1-4302-5990-9_4_Figam_HTML.jpg](img/A978-1-4302-5990-9_4_Figam_HTML.jpg)-不敏感方法，在估计函数周围对称地形成一个最小半径的柔性管，使得绝对值小于某个阈值
  ![A978-1-4302-5990-9_4_Figan_HTML.jpg](img/A978-1-4302-5990-9_4_Figan_HTML.jpg)
  的误差在估计值上下均被忽略。这样，管外的点会受到惩罚，而管内的点，无论位于函数上方还是下方，都不会受到惩罚。SVR 的主要优势之一是其计算复杂度不依赖于输入空间的维度。此外，它具有出色的泛化能力和高预测精度。


  本章旨在概述 SVR 和贝叶斯回归。它还介绍了一个改进型 SVR 的案例研究，该改进适用于必须消除或严格限制低估函数的关键场景。




  ## SVR 概述


  回归问题是分类问题的一种泛化形式，其模型返回的是连续值输出，而非有限集合中的输出。换句话说，回归模型估计的是一个连续值的多元函数。


  支持向量机（SVM）通过将二分类问题表述为凸优化问题来求解（Vapnik 1998）。该优化问题旨在找到最大间隔分离超平面，同时尽可能正确地对训练点进行分类。SVM
  用支持向量来表示这个最优超平面。SVM 的稀疏解和良好的泛化能力使其适用于回归问题。SVM 向 SVR 的推广是通过在函数周围引入一个 ε 不敏感区域（称为 ε
  管）来实现的。这个管道将优化问题重新表述为：找到最能逼近连续值函数的管道，同时平衡模型复杂度和预测误差。更具体地说，SVR 的优化问题表述首先定义了一个需要最小化的凸
  ε 不敏感损失函数，然后找到包含大多数训练实例的最平坦管道。因此，根据损失函数和管道的几何特性构建了一个多目标函数。接着，使用适当的数值优化算法求解具有唯一解的凸优化问题。超平面用支持向量来表示，这些支持向量是位于管道边界之外的训练样本。与
  SVM 类似，SVR 中的支持向量是影响管道形状的最具影响力的实例，并且假设训练数据和测试数据是独立同分布（iid）的，均来自监督学习背景下同一个固定但未知的概率分布函数。


