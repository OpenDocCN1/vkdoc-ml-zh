  \ N，则按拥挤距离降序选择前沿 F [j] 中的个体，直到达到大小为 N 的种群。至此，下一代的交配池创建完成。在图中，非支配前沿 F [1] (t)[,]\
  \ F [2] (t) 和 F [3] (t) 被完全包含，而按拥挤距离排序的前沿 F [4] (t) 被部分包含在交配池 P(t + 1) 中。\n\n![A978-1-4302-5990-9_10_Fig6_HTML.gif](img/A978-1-4302-5990-9_10_Fig6_HTML.gif)\n\
