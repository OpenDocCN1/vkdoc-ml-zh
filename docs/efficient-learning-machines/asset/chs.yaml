  \n公式 2-6 表示一个迭代的权重自适应过程，其中在迭代(t + 1)时，输出误差的一部分被添加到来自迭代 t 的现有权重上。\n\nMLP 通常用于监督学习的模式识别过程。由于深度学习的成功，人们对\
  \ MLP 反向传播网络重新产生了兴趣。深度学习是一种使用多个隐藏层有效训练 MLP 的方法。随着硅技术的现代进步，深度学习正在被开发，以解锁那些可以通过深层架构表示高度变化函数的领域中巨大的大数据分析潜力。\n\
  \n## 机器学习：聚类算法\n\n\n\n### k-均值聚类\n\nk-均值聚类是一种向量量化的无监督学习算法，它将 n 个观测值划分为 k 个簇。该算法定义了\
  \ k 个质心，作为各自簇的原型。当使用特定的距离度量进行测量时，每个对象都会被分配到具有最近质心的簇中。当所有对象都被分配到 k 个簇之一时，将对象分配到簇的步骤即告完成。该过程会基于先前的\
  \ S={S [1],S [1],...,S [k] } 分配重新计算质心，并将对象重新分配到最近的新的质心，如此重复。该过程持续进行，直到任意 k 个簇的质心不再移动。通常，k-均值聚类算法通过最小化对象数据与簇质心之间距离的平方和，根据对象的特征将其划分为\
  \ k 个组（或簇）。\n\n对于一组给定的 d 维观测向量 (x [1],x [2],...,x [n] )，k-均值聚类将 n 个观测值划分为 k(≤n)\
  \ 个簇集，以最小化平方和：\n\n![A978-1-4302-5990-9_2_Figk_HTML.jpg](img/A978-1-4302-5990-9_2_Figk_HTML.jpg)\n\
  \n其中 μ [i] 是 S [i] 中点的均值。\n\nk-均值聚类算法易于在大型数据集上实现。它在市场细分、计算机视觉、应用和工作负载画像、光学字符识别以及语音合成等领域有着广泛的应用。该算法常被用作其他算法的预处理步骤，以寻找初始配置。\n\
  \n### 模糊 k-均值（模糊 c-均值）\n\n模糊 k-均值（也称为模糊 c-均值 [FCM]）（Dunn 1973; Bezdek 1981）是 k-均值算法的一种扩展，它综合了软聚类，在软聚类中，一个对象可以以一定的概率属于多个簇。该算法在将数据对象分配到簇时提供了更高的灵活性，并允许数据对象在多个相邻簇中保持部分隶属关系。FCM\
  \ 使用范围在 [1, n] 内的模糊化参数 m，该参数决定了簇的模糊程度。m=1 表示硬聚类，而 m>1 则表示决策空间中数据对象之间的模糊程度更高。FCM\
  \ 算法基于最小化目标函数：\n\n![A978-1-4302-5990-9_2_Figl_HTML.jpg](img/A978-1-4302-5990-9_2_Figl_HTML.jpg)\n\
  \n其中 x 是 d 维数据对象，c [j] 是簇 j 的 d 维质心（参见公式 2-10），w [k] (x) 是 x 在簇 k 中的隶属度，该隶属度取决于模糊化参数\
  \ m，该参数控制赋予最近质心的权重：\n\n![A978-1-4302-5990-9_2_Figm_HTML.jpg](img/A978-1-4302-5990-9_2_Figm_HTML.jpg)\n\
  \n使用 FCM，第 k 个簇的 d 维质心 (c [k] ) 是所有点的均值，按其对该簇的隶属度进行加权：\n\n![A978-1-4302-5990-9_2_Fign_HTML.jpg](img/A978-1-4302-5990-9_2_Fign_HTML.jpg)\n\
  \nc-均值聚类算法综合了簇中心以及数据对象被分配到这些簇的程度。这并不转化为硬性的隶属函数。FCM 在图像处理中用于对图像中的对象进行聚类。\n\n### 流式\
  \ k-均值\n\n流式 k-均值是一个两步算法，包括一个流式步骤和一个球 k-均值步骤。流式步骤一次性遍历大小为 n 的数据对象，并生成最佳数量的质心——这相当于\
  \ klog(n) 个簇，其中 k 是预期的簇数量。这些簇的属性被传递给球 k-均值步骤，该步骤将簇的数量减少到 k。\n\n#### 流式步骤\n\n流式步骤算法一次处理一个数据对象，并决定是将该数据对象添加到现有簇还是创建一个新簇。如果簇的质心与数据点之间的距离小于距离截止阈值，则算法将该数据添加到现有簇，或者以\
  \ d/(distancecutoff) 的概率创建一个新簇。如果距离超过截止值，则算法创建一个具有新质心的新簇。随着处理更多的数据对象，现有簇的质心可能会改变其位置。此过程会持续添加新簇，直到现有簇的数量达到簇截止限制。可以通过增加距离截止阈值来减少簇的数量。此步骤主要用于降维。此步骤的输出是一个缩减后的数据集，形式为多个簇，这些簇代表了大量原始数据。\n\
  \n#### 球 k-均值步骤\n\n球 k-均值算法接收流式步骤的输出（X = 质心集合 > k），并执行多次独立运行，通过选择最佳解决方案来综合出 k 个簇。每次运行使用一种种子机制选择\
  \ k 个质心，并迭代运行球 k-均值算法以优化解决方案。\n\n种子选择过程可能会调用 k-means++ 算法以实现 k 个簇的最佳分布。k-means++\
  \ 种子选择算法总结如下：\n\n从 X 中均匀随机选择中心 c [1]。   通过以概率 P(x) 选择 xϵX 来选择一个新中心 c [i]，并将其添加到\
  \ ![A978-1-4302-5990-9_2_Figo_HTML.jpg](img/A978-1-4302-5990-9_2_Figo_HTML.jpg)\
  \ 中，  \n\n![A978-1-4302-5990-9_2_Figp_HTML.jpg](img/A978-1-4302-5990-9_2_Figp_HTML.jpg)\n\
  \n其中 D(x) 是 x 与已选择的最近中心之间的距离。\n\n重复步骤 2，直到选出 k 个中心 ![A978-1-4302-5990-9_2_Figq_HTML.jpg](img/A978-1-4302-5990-9_2_Figq_HTML.jpg)。\
  \   以与范数 ![A978-1-4302-5990-9_2_Figs_HTML.jpg](img/A978-1-4302-5990-9_2_Figs_HTML.jpg)\
  \ 成比例的概率随机选取两个中心 ![A978-1-4302-5990-9_2_Figr_HTML.jpg](img/A978-1-4302-5990-9_2_Figr_HTML.jpg)。\
  \   对于每个 ![A978-1-4302-5990-9_2_Figt_HTML.jpg](img/A978-1-4302-5990-9_2_Figt_HTML.jpg)，在其周围创建一个半径为\
  \ ![A978-1-4302-5990-9_2_Figu_HTML.jpg](img/A978-1-4302-5990-9_2_Figu_HTML.jpg)\
  \ 的球。   使用 ![A978-1-4302-5990-9_2_Figw_HTML.jpg](img/A978-1-4302-5990-9_2_Figw_HTML.jpg)\
  \ 中包含在球内的元素重新计算新的质心 ![A978-1-4302-5990-9_2_Figv_HTML.jpg](img/A978-1-4302-5990-9_2_Figv_HTML.jpg)。\
  \  \n\n该算法在处理大量数据对象的应用中特别有用。该算法通过执行流式操作，并用由原始数据的 k·log(n) 个质心组成的缩减代理数据替换原始数据，从而降低原始数据集的维度。缩减后的数据作为球\
  \ k-均值算法的输入，该算法为其各自的簇综合并优化出 k 个质心。\n\n## 机器学习：降维\n\n机器学习通过大量特征来训练大多数回归或分类问题。这增加了复杂性，提高了计算要求，并增加了收敛到解决方案所需的时间。缓解这些问题的一个有用方法是通过综合一个更低维度的空间来降低原始特征的空间维度。在这个新的、更低维度的空间中，最重要的特征得以保留，特征之间的隐藏相关性得以揭示，不重要的特征则被丢弃。最简单、最直接且监督最少的特征缩减方法之一涉及矩阵分解的变体：奇异值分解、特征分解和非负矩阵分解。以下各节将讨论统计降维中常用的一些方法。\n\
  \n\n\n### 奇异值分解\n\n奇异值分解（SVD）通过矩阵分析，将高维矩阵综合为低维表示。SVD 有助于消除矩阵表示中较不重要的部分，从而得到具有所需维数的近似表示。这有助于创建与原始矩阵高度相似但规模更小的矩阵表示。由于以下特性，SVD\
  \ 在降维中非常有用：\n\n*   SVD 将相关变量转换为一组不相关的变量，从而揭示数据项之间的对应关系。\n*   SVD 识别出数据点变化最大的维度。\n\
  \n一旦识别出具有显著变化的点，就可以用更少的维度来近似原始数据点。你可以定义阈值，低于该阈值的变化可以被忽略，从而在保留数据点内在关系和兴趣点相关信息的前提下，实现高度精简的数据集。\n\
  \n如果 M 是一个 m × n 矩阵，那么可以将其分解为三个矩阵 U、∑ 和 V^T 的乘积，它们具有以下特性：\n\n*   U 是一个列正交矩阵。U 的列是\
  \ MM^(T) 的标准正交特征向量。\n*   V^(T) 是正交矩阵 V 的转置。V 的列是 M^(T)M 的标准正交特征向量。\n*   ∑ 是一个对角矩阵，除对角线外所有元素均为\
  \ 0。∑ 包含来自 U 或 V 的特征值的平方根，并按降序排列。\n\n在其精确形式中，M 可以重写为：\n\n![A978-1-4302-5990-9_2_Figx_HTML.jpg](img/A978-1-4302-5990-9_2_Figx_HTML.jpg)\n\
  \n在降维过程中，你合成 U 和 V，使得它们包含原始数据中按变化程度降序排列的元素。你可以删除代表没有显著变化维度的元素。这可以通过将最小的特征值设为 0 来实现。公式\
  \ 2-11 可以重写为其最佳秩-l 近似形式：\n\n![A978-1-4302-5990-9_2_Figy_HTML.jpg](img/A978-1-4302-5990-9_2_Figy_HTML.jpg)\n\
  \n其中 u[i] 和 v[i] 分别是 U 和 V 的第 i 列，λ[i] 是对角矩阵 ∑ 的第 i 个元素。\n\n### 主成分分析\n\n当空间中有一群点时，用于表示这些点的坐标和轴是任意的。这些点相对于所选轴的方向具有一定的方差，表示在该方向上围绕平均值的分散程度。在二维系统中，模型受到第二轴垂直于第一轴的约束。但在三维及更高维情况下，你可以将第\
  \ n 轴垂直于任意两个轴构成的平面。模型受到第一轴位置的约束，该轴被定位在方差最大的方向上。这产生了一个新的特征空间，将点群压缩到高方差的轴上。你可以选择方差较大的轴，并消除方差较小的轴。图\
  \ 2-4 展示了新的特征空间，该空间从一个包含 160 个特征的数据集缩减为 59 个分量（轴）。每个分量相对于其他分量都关联着一定比例的方差。第一个分量方差最大，其次是第二个分量，依此类推。\n\
  \n![A978-1-4302-5990-9_2_Fig4_HTML.gif](img/A978-1-4302-5990-9_2_Fig4_HTML.gif)\n\
  \n图 2-4.\n\n一个包含 160 个特征的数据集经主成分变换后缩减为 59 个分量时，各分量的方差百分比\n\n主成分分析（PCA）是一种广泛使用的分析技术，它通过识别模式来降低数据集的维度，同时不会显著损失信息。PCA\
  \ 的目标是将高维特征空间投影到一个更小的子集中，以降低计算成本。PCA 计算新的特征，称为主成分（PC），它们是原始特征在更大变异性方向上的不相关线性组合。关键在于将特征集映射到矩阵\
  \ M，并合成 MM^(T) 或 M^(T)M 的特征值和特征向量。特征向量有助于简化那些可以通过沿轴进行拉伸、压缩或翻转等线性变换来建模的问题。特征值提供了这种变换发生的因子（特征向量的长度和幅度）。在新特征空间中，选择具有较大特征值的特征向量，因为对于数据分布而言，它们比具有较小特征值的特征向量包含更多信息。与下一个\
  \ PC（相对于第一个 PC 不相关）相比，第一个 PC 具有尽可能大的方差（即最大的特征值），后者是在与第一个分量正交的约束下计算的。本质上，第 i 个 PC\
  \ 是与所有先前 PC 都不相关的最大方差的线性组合。\n\nPCA 包含以下步骤：\n\n计算原始数据集的 d 维均值。  \n计算特征的协方差矩阵。  \n\
  计算协方差矩阵的特征向量和特征值。  \n按特征值递减的顺序对特征向量进行排序。  \n选择具有最大特征值的 k 个特征向量。\n\n特征向量值表示每个变量对\
  \ PC 轴的贡献。PC 的方向指向 m 维点中方差最大的方向。\n\nPCA 是用于发现新的、信息丰富的、不相关特征的最广泛使用的多变量方法之一；它通过拒绝低方差特征来降低维度，并且有助于减少分类和回归分析的计算需求。\n\
  \n### Lanczos 算法\n\nLanczos 算法是一种低成本的特征分解技术，与截断 SVD 相同，区别在于它不显式计算矩阵的奇异值/向量。Lanczos\
  \ 算法使用少量 Lanczos 向量，这些向量是 M^T M 或 MM^T 的特征向量，其中 M 是一个对称的 n × n 矩阵。\n\nLanczos 算法首先初始化一个任意非零向量\
  \ x[0]，其基数等于矩阵 M 的列数。该算法的第 m 步（m<<n）将矩阵 M 转换为一个三对角矩阵 T[mm]。迭代过程可以总结如下：\n\n#### 初始化\n\
