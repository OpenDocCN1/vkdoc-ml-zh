  一些研究人员提出了对损失函数的修改，使其成为非对称的。Shim、Yong 和 Hwang（2011）在支持向量分位数回归（SVQR）中使用了非对称的ε-不敏感损失函数，试图减少支持向量的数量。作者根据分位数改变了不敏感性，并获得了更稀疏的模型。Schabe（1991）为贝叶斯参数估计提出了双边二次损失函数和准二次
  s-损失函数，而 Norstrom（1996）用非对称损失函数替换了二次损失函数，为贝叶斯风险分析推导出一类在原点附近趋近无穷大的通用函数。Nath 和 Bhattacharyya（2007）提出了一种最大间隔分类器，该分类器对每个类别的误分类进行不同约束，从而允许不同的容忍度水平。Lee、Hsieh
  和 Wang（2005）将典型的 SVR 方法重新表述为一个无约束问题，从而只需解一个线性方程组，而不是一个凸二次方程组。Pan 和 Pan（2006）比较了经济公差设计中的三种不同损失函数：田口二次损失函数、倒正态损失函数和修正倒正态损失函数。


