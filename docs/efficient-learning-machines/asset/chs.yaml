- "# 7. 深度神经网络\n\n我认为大脑本质上是一台计算机，而意识就像一个计算机程序。当计算机关闭时，它就会停止运行。理论上，它可以在神经网络上被重新创建，但这将非常困难，因为它需要一个人所有的记忆。——斯蒂芬·霍金，《时代》杂志\n\
  \n人工神经网络（ANNs）于 20 世纪 40 年代被提出，作为人类大脑皮层中基本计算单元的简化模型，此后一直是一个活跃的研究领域。在人工神经网络的众多演进中，深度神经网络（DNNs）（Hinton,\
  \ Osindero, and Teh 2006）作为浅层人工神经网络结构的一种有前景的扩展而脱颖而出。迄今为止，基于深度神经网络的分层学习，以及其他贝叶斯推理和演绎推理技术的最佳展示，是\
  \ 2011 年 IBM 超级计算机沃森在传奇性的电视问答节目《危险边缘！》中的表现。\n\n本章首先介绍一些关于人工神经网络的基础入门知识，然后概述深度神经网络的结构和学习方案。\n\
  \n\n\n## 人工神经网络简介\n\n人工神经网络已在许多实际应用中取得成功，尤其是在监督学习模式下。然而，人工神经网络也一直受到一些显著挑战和缺陷的困扰。监督学习面临的众多挑战之一是维度灾难（Arnold\
  \ 等人，2011），当特征数量和训练点数量变得非常大时就会出现这种情况。因此，大数据使得人工神经网络的学习更加困难，因为需要处理的数据量巨大，随之而来的是内存和计算需求。分类中的另一个挑战是数据非线性，它表征了不同类别特征的重叠，使得分离类别的任务更加困难。主要由于这些原因，以及选择合适网络架构的启发式方法，人工神经网络在\
  \ 1990 年代和 2000 年代落后于被广泛采用的支持向量机，后者在许多方面被证明优于人工神经网络。\n\n注意\n\n支持向量机为机器学习问题提供了一种有原则的方法，因为它具有统计学习理论的数学基础。支持向量机将解构建为支持向量的加权和，而支持向量只是训练输入的一个子集。与人工神经网络类似，支持向量机基于训练数据集最小化特定的误差代价函数，并依赖于经验风险模型。此外，支持向量机使用结构风险最小化，并对优化问题施加额外的约束，迫使优化步骤找到一个最终能更好泛化的模型，因为它位于类别之间的等距最大距离处。\n\
  \n随着硬件和计算能力的进步，深度神经网络被提出作为人工神经网络浅层架构的扩展。一些批评者认为深度学习只是“神经网络的另一个流行词”（Collobert，2011）。尽管深度神经网络借用了生物大脑中神经元的概念，但它并不像皮层算法或其他受生物启发的机器学习方法那样试图对其进行建模。深度神经网络的概念源于福岛邦彦（1980）提出的新认知机模型。广义上，深度神经网络被定义为一组旨在以分层方式学习并涉及多个知识表示抽象层次的机器学习算法，其架构旨在实现强人工智能模型。这些架构随着信息在更高层次传播而积累知识，其方式是更高层次的学习由较低层次发生的统计学习定义并建立在其基础之上。\n\
  \n考虑到深度学习的这种广泛定义，我们可以将反向传播算法（自 1974 年可用）与循环神经网络和卷积神经网络（于 1980 年代引入）的结合解释为深度架构的前身。然而，直到\
  \ Hinton、Osindero 和 Teh（2006）对深度学习训练的贡献出现，深度架构的研究才获得了动力。以下各节将简要概述人工神经网络，并更详细地介绍深度信念网络和受限玻尔兹曼机。\n\
  \n### 早期人工神经网络结构\n\n最早的人工神经网络尝试之一可以追溯到 1940 年代末，当时心理学家唐纳德·赫布（Hebb，1949）基于神经元的可塑性特征引入了今天所知的赫布学习：当位于突触两侧的神经元同步且反复受到刺激时，突触的强度会以与放电神经元各自输出成比例的方式增加（Brown\
  \ 等人，1990），如下所示：\n\n![A978-1-4302-5990-9_7_Figa_HTML.jpg](img/A978-1-4302-5990-9_7_Figa_HTML.jpg)\n\
  \n其中 t 代表训练周期，w [ij] 是第 i 个和第 j 个神经元之间连接的权重，x [i] 是第 i 个神经元的输出，η [ij] 是特定于该突触的学习率。\n\
  \n赫布规则是一种无监督学习方案，它局部地更新网络的权重；也就是说，每个突触的训练仅取决于与其相连的神经元的权重。由于其实现简单，赫布规则被认为是第一个人工神经网络学习规则，并由此衍生出多种变体。该算法的首次实现是在\
  \ 1954 年，于麻省理工学院使用计算机进行（Farley 和 Clark，1954）。\n\n1950 年代还引入了感知机，这是一种用于模式识别的两层神经网络模型，使用加法和减法运算（Rosenblatt，1958）。如图\
  \ 7-1 所示，该模型由四个组件组成。视网膜或输入区域通过感觉单元接收刺激。这些连接被称为局部连接，因为它们的起点倾向于聚集在某个点或某个区域周围。尽管投影区域中的单元与关联区域中的单元相同，但投影区域通过局部连接接收输入，而关联区域的输入则通过随机连接来自投影区域；仿佛输入是从分散的区域生成的。A\
  \ 单元接收一组可能具有兴奋性或抑制性的传递脉冲。如果刺激超过某个阈值，这些单元就会通过放电做出响应。关联区域和响应单元之间的随机连接是双向的。前馈连接将突触从关联区域传递到响应，而反馈连接则将兴奋性突触传递到关联区域中产生该连接的源点。抑制性突触补充了关联区域中未向相关响应传递的源点。\n\
  \n![A978-1-4302-5990-9_7_Fig1_HTML.gif](img/A978-1-4302-5990-9_7_Fig1_HTML.gif)\n\
  \n图 7-1.\n\n罗森布拉特感知机结构\n\n\n\n### 经典人工神经网络\n\n人工神经网络的基本结构是人工神经元，如图 7-2 所示，其形态和功能与生物神经元相似（Haykin\
  \ 1994）。\n\n![A978-1-4302-5990-9_7_Fig2_HTML.gif](img/A978-1-4302-5990-9_7_Fig2_HTML.gif)\n\
