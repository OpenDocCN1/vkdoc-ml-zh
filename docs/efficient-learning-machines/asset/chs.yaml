  \n步骤 5 是一个递归操作，其中每个连续的迭代都会根据目标适应度评估已排序解的拥挤距离。步骤 5 会为每个目标适应度调用。这里，I[i].k 表示集合 I 中第\
  \ i 个个体的第 k 个目标函数值。拥挤距离是 m 维超空间中每个个体之间的欧几里得距离。边界上的个体总是被选中，因为它们具有无限的距离分配。为了确保精英主义，将当前代的子代和父代种群合并，以选择下一代的交配池。随后，通过非支配对种群进行排序。如图\
