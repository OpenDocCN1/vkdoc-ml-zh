  *   实验 4：使用 CE 代价函数和所提出的权重更新规则训练的 CA


  模拟实验在 Windows 7 家庭高级版操作系统上，使用 Intel i7 2GHz 处理器和 6GB 内存，通过 MATLAB R2011a 软件，并采用修改过的中枢神经系统（CNS）库进行。该
  CNS 库由麻省理工学院的 Mutch、Knoblich 和 Poggio（2010）开发，是一个用于模拟皮层组织网络的框架。


  数据库来自 UCI 机器学习库，包含一组 13 帧梅尔频率倒谱系数（MFCC），代表了 8800 个阿拉伯语口语数字——属于十个类别（0-9）之一，由 88 位不同的发音人说出，这些数字是在使用移动汉明窗对口语数字进行滤波后获得的。多种技术在该数据库上得到了验证；使用多类
  SVM 分类器（Ji and Sun 2011），基于三折交叉验证取得的最佳结果显示识别率达到 97.03%。


  ### 阿拉伯语音素的树状表示


  作为 22 个国家的第一语言，阿拉伯语在全球使用最广泛的语言中排名第五（Mosa and Ali 2009）。尽管处理语音识别的应用显著增加（例如，iPhone
  4S 的 Siri 界面），但阿拉伯语的实现仍然有限，这主要是由于其形态复杂性。对于阿拉伯语自动语音识别，音素识别是连续语音分析中的一个重要步骤。大多数研究通过提取孤立的音素或小的语音片段（El-Obaid,
  Al-Nassiri, and Maaly 2006; Awais 2003; Gevaert, Tsenov, and Mladenov 2010; Al-Manie,
  Alkanhal, and Al-Ghamdi 2009）来分析更长的语音信号（Abushariah et al. 2010）和广播新闻（Al-Manie, Alkanhal,
  and Al-Ghamdi 2009），使用了多种技术，例如人工神经网络（Essa, Tolba, and Elmougy 2008）、模糊隐马尔可夫模型（Shenouda,
  Zaki, and Goneid 2006）、模糊逻辑、并发自组织映射（Sehgal, Gondal, and Dooley 2004）和隐马尔可夫模型（Satori,
  Harti, and Chenfour 2007; Bourouba et al. 2010; Biadsy, Moreno, and Jansche 2012）。


  阿拉伯语在中东和北非地区使用，有不同的方言。然而，文学阿拉伯语（也称为现代标准阿拉伯语）是所有阿拉伯语国家在文件和正式场合使用的官方形式。口语和书面阿拉伯语之间的一个区别是后者中存在变音符号（用于指示字母发音方式的标记）。阿拉伯语的复杂性源于其不寻常的形态：单词使用词根-模式方案构成，其中词根由
  3 个辅音组成，从一个词根可以衍生出多种可能性。从语音学角度看，阿拉伯语有 28 个辅音音段和 6 个元音（Newman 1984）。音素可以根据说话时嘴唇和舌头的发音部位进行分组，如阿拉伯语音素分类所示。


