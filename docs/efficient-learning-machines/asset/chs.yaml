  \n图 11-5.\n\n各种工作负载的阶段转换图\n\n图 11-6 显示了工作负载-阶段边界，在四个工作负载中发现了七个簇。每个工作负载都由其独特的阶段组合来表征。一旦工作负载被识别，就会根据其资源利用率和时间序列模式进行阶段特征化。工作负载\
  \ 3 主要由阶段 7 组成，而工作负载 1 则是阶段 3、5 和 6 的复杂混合体。这些阶段揭示了在任何给定时间点特定于某个工作负载实例的特征。\n\n![A978-1-4302-5990-9_11_Fig6_HTML.gif](img/A978-1-4302-5990-9_11_Fig6_HTML.gif)\n\
  \n图 11-6.\n\n工作负载与阶段依赖关系图；一个工作负载可能与其他工作负载共享阶段特征，并且可以包含一个或多个阶段\n\n\n\n### 指纹识别\n\n\
  工作负载在多种约束条件下运行时，会经历不同的执行阶段。这些约束与功耗、热量产生以及服务质量（QoS）要求相关。由于在功耗和性能参数调优方面存在多种自由度，最佳系统运行涉及复杂的选择。该过程包括建模方法、实现选择以及动态调优。指纹识别作为一种关键特性，能够捕捉动态自适应系统随时间变化的行为。此能力被用作一种统计输出，有助于在需求变化之前重新配置硬件和软件，并使得针对重复出现的阶段能够复用已训练的模型。模式检测还有助于在工作负载执行期间预测未来阶段，从而避免对工作负载行为变化做出被动响应。\n\
  \n作为工作负载指纹识别过程的一部分（见图 11-7），在给定时间间隔内收集、分类并聚合各个性能特征，以建立代表现有工作负载或工作负载集合的模式。系统控制代理，例如\
  \ I/O 调度器、电源分配和动态随机存取存储器（DRAM）页面策略设置，可以使用这些信息来实时调整其参数或调度工作负载。指纹识别大致可以通过三个属性来描述：规模、阶段和模式。机器学习过程通过在一段有限时间内测量或数据挖掘性能特征，来促进这些属性的综合。通常，特征选择过程允许将性能矩阵与独特工作负载行为的出现自动关联，从而有助于快速诊断和主动调优。指纹数据可以与简单的统计函数（如优化、可视化或控制理论）相结合，以创建强大的操作员工具。此外，指纹有助于遏制对一个或多个指定服务级别目标（SLO）的持续违反，这涉及执行主动操作以使系统恢复到符合\
  \ SLO 的状态。\n\n![A978-1-4302-5990-9_11_Fig7_HTML.gif](img/A978-1-4302-5990-9_11_Fig7_HTML.gif)\n\
  \n图 11-7.\n\n工作负载指纹：一种可量化的表征形式\n\n#### 规模属性\n\n规模属性在资源的主动预配置中非常有用。利用规模维度可以回答以下问题：\n\
  \n*   分布的形状是怎样的？哪些资源比其他资源更受欢迎？是否存在显著的尾部？\n*   在峰值期间，对热门对象组的访问在空间局部性方面表现如何？\n\n####\
  \ 阶段属性\n\n阶段代表了一个独特属性，用于表征正在进行的进程的行为。在此示例中，阶段展示了独特的功耗、温度和性能特征。如前所述（参见“阶段确定”一节），此示例采用简单的\
  \ k-means 算法，以聚类形式综合出排他性行为，这些聚类被表示为阶段。一旦所有相关的特征向量被识别出来，就会执行此过程。这些向量是以资源使用形式直接或间接反映独特行为的观测值。这些阶段是压缩后的代表性输出，可以与任何其他统计参数结合使用来预测行为。阶段的序列可以被视为模式。模式代表了工作负载独特的时变特性。图\
  \ 11-8a 展示了一次工作负载执行期间的阶段序列。图 11-8b 显示了该阶段序列的编码表示。\n\n![A978-1-4302-5990-9_11_Fig8a_HTML.gif](img/A978-1-4302-5990-9_11_Fig8a_HTML.gif)![A978-1-4302-5990-9_11_Fig8b_HTML.gif](img/A978-1-4302-5990-9_11_Fig8b_HTML.gif)\n\
  \n图 11-8.\n\n(a) 测试工作负载阶段，(b) 游程编码阶段序列，以及 (c) 阶段转移似然矩阵和工作负载-阶段依赖矩阵；工作负载 1 的阶段依赖关系已高亮显示\n\
  \n#### 模式属性\n\n模式被定义为重复出现的阶段序列。一旦识别出一个序列，就可以用它来预测未来的阶段以及当前阶段的持续时间。在时间序列操作中，你为时间序列模式数据库构建词汇表。词汇表中的每个字母由工作负载的运行阶段表示。该阶段以固定长度间隔\
  \ (T) 进行测量。模式矩阵可以表示为 M [ij] ，其中 i 代表模式，j 代表该模式的频率。随着新模式的识别，它们会被更新到模式矩阵中，而旧的、不频繁的模式则会被弃用。你可以使用离散时间马尔可夫链（DTMC）（见公式\
  \ 11-3）来识别变化阶段的时间序列序列中的潜在模式，\n\n![A978-1-4302-5990-9_11_Figi_HTML.jpg](img/A978-1-4302-5990-9_11_Figi_HTML.jpg)\n\
  \n其中 q [t] 代表当前状态，S [i] 代表运行阶段之一。在此模型中，状态转移（阶段变化）遵循马尔可夫性质，然后基于用于预测的学习模型，在状态（阶段）之间创建转移。你可以使用移动窗口来监控实时数据，并为最近观测到的数据生成一个自回归模型，然后将其与学习到的马尔可夫模型的状态进行匹配。如有必要，该模型还会进行修正以适应变化。通过追踪从一个阶段到另一个阶段的时间序列演进，你可以构建马尔可夫模型的转移函数（见图\
  \ 11-8c）。\n\n### 预测\n\n工作负载预测模块检测工作负载的趋势，并对未来的工作负载量进行预测。如果目标工作负载表现出强烈的周期性行为，则可以将历史预测纳入工作负载预测中。这使得策略决策能够提前主动应对工作负载峰值。这也有助于你利用云计算提供商提供的异构计算和\
  \ I/O 资源。此外，基于提取的模式，你可以以创建不同性能模型的方式来分配工作负载。\n\n\n\n## 示例 2：动态能量分配\n\n近年来，控制服务器设备所消耗的电量已变得日益重要。在电力治理中，三类行动的准确性与敏捷性至关重要：\n\
  \n*   选择哪些硬件元件必须以何种速率运行，以满足软件的性能需求\n*   评估达到这些速率需要消耗多少电力\n*   根据计算需求的变化调整电力支出\n\n\
  观察工作负载的变化如何影响不同服务器组件的功耗，能为分析以及构建将服务质量（QoS）预期与功耗关联起来的模型提供关键数据。下一个示例描述了一个在英特尔至强服务器上实现自主功耗控制的过程中，所涉及的观察、建模与纠偏流程，该服务器在执行数据库查询工作负载时需满足不断变化的响应时间与吞吐量需求。该流程始于系统内一组分布式物理与逻辑传感器所允许的细粒度功耗性能观察。这些观察数据用于训练工作负载各个阶段的模型。一旦训练完成，系统功耗、吞吐量和延迟模型便会参与优化启发式算法，该算法重新分配电力，以最大化服务器的整体每瓦性能。\n\
  \n“功耗优化”一词指的是在应用层面瞄准并实现高水平功耗归一化性能的行为。对于软件应用（例如业务交易服务或内容检索服务），重要的性能指标包括已处理请求的数量（吞吐量）以及每个请求的周转延迟（响应时间）。优化功耗涉及多种动态权衡。通常，一个系统可以表示为一组组件，这些组件通过协同交互产生有用功。这些组件可能是异构的，或者面临异构负载，并且它们的功耗和功耗控制机制可能各不相同。在任何组件层面（例如处理单元或存储单元），都需要根据该组件的速度在程序整体执行速度或速率中是否扮演关键角色，持续地增加或减少其功耗。特别是，不同的应用阶段对组件速度的敏感度可能不同。例如，与\
  \ CPU 密集型执行阶段相比，内存密集型执行阶段受中央处理器（CPU）频率缩放的影响较小。由于大多数现代处理器都采用了执行重排序技术，程序从乱序执行中获益的程度会因阶段而异。此外，新工作到达系统的速率会发生变化，因此，程序为满足特定服务水平预期而必须达到的整体执行速度也会随时间变化。因此，所需的功耗性能权衡必须持续进行。\n\
  \n可以说，鉴于当今系统中普遍存在的自我纠正和自我调节特性，由软件驱动的功耗性能优化可能并无必要。例如，在功耗控制算法中，CPU 和 DRAM 会在低活动期间转换到较低频率或超低功耗模式。尽管电路级自我调节在将组件转换到低功耗状态方面非常有益，但软件需要掌握策略控制权，以决定应减少哪些活动以及何时减少，从而促进硬件向省电模式转换。\n\
  \n在负载较轻的服务器上实现节能是一项精细的任务，很难委托给基于硬件的固定方案。服务器通常配置为以尽可能低的延迟处理高流入率的工作请求。因此，服务器拥有多个 CPU\
  \ 和大量物理内存的情况并不少见，在需求高峰期和低谷期，计算任务和数据在这些资源上广泛分布。由于活动的分布式特性，减慢单个 CPU 或 DRAM 的速度可能会产生不可预测的性能影响；将服务器的一部分推入超低功耗运行状态可能会适得其反。在另一个极端，当功耗接近饱和水平时，硬件难以确定或强制执行关于哪些软件活动可以容忍性能下降、哪些必须保持原样的决策。\n\
  \n因此，软件必须与硬件共同承担决定何时以及在哪个组件上可以节省功耗的责任。在此，我们考虑一种用于对服务器配置的功耗性能权衡进行细粒度控制的自主解决方案。该解决方案包含用于观察、分析、规划和控制的要素，旨在根据指定为\
  \ SLO（服务水平目标）的应用级性能目标，动态地管理电力支出。该方案使用一个随时间变化的数据库查询工作负载，其中学习机器同时改变对 CPU 和 DRAM 的电力分配，并通过服务器中的一组分布式物理和逻辑传感器收集性能和功耗读数。通过这些观察，为工作负载的各个阶段训练模型。基于这些模型，优化启发式算法重新分配电力，以最大化服务器的整体每瓦性能。实验测量表明，该启发式算法能够根据性能目标的需要或允许，改善性能和功耗。\n\
  \n\n\n### 学习过程：特征选择\n\n学习过程的主要作用是识别总功耗（P）与两个性能指标——响应时间（R）和吞吐量（T）之间的关系。这些关系被综合成模型，优化技术则利用这些模型来实现更好的能效。泛化过程需要一个分类器，该分类器输入一个离散特征向量，并输出一个运行阶段，其过程可概括如下：\n\
  \n*   主要组件（CPU 和双列直插式内存模块 [DIMM]）的多个电源轨上，经过精细时间对齐的组件级功耗读数\n*   与三个量对应的系统级读数，每个量都在一个短时间间隔内取平均值：(1)\
  \ P，系统总功耗；(2) T，应用级吞吐量；(3) R，请求所经历的响应时间\n\n组件级功耗读数与 {P, T, R} 元组对齐。然后，整个数据集合被用于将\
  \ {P, T, R} 空间划分为多个类别（阶段）。在每个类别或阶段内，一个线性函数可以将 P、T、R 与组件级功耗读数关联起来。这些线性关系用于优化规划，其目标可能是在\
  \ R（响应时间）不超过特定阈值的前提下，最小化 P（系统总功耗）或最大化 T（应用级吞吐量）。学习过程在线持续进行。因此，随着工作负载的变化，模型和优化规划也会相应调整。\n\
  \n可以采用支持向量机（SVM）技术将 {P, T, R} 空间划分为不同阶段，并获取在每个阶段内支配 {P, T, R} 变量的线性关系。如前所述，SVM 是一种计算高效且功能强大的技术；由\
  \ Boser、Guyon 和 Vapnik（1992 年）发明，广泛应用于各类机器学习问题中的分类和回归。给定一组将训练输入与输出关联起来的数据集合，SVM\
  \ 是一个能够完成以下任务的数学实体：\n\nSVM 描述了一个（在某个更高维度上的）超平面，该超平面在输入空间中的投影将输入划分为等价类，使得给定类别中的输入具有一个线性函数，该函数将其映射到对该类别而言独特的输出。其投影为\
  \ SVM 的超平面，在考虑一个软间隔的前提下，最大化其与每个类别中最近样本之间的距离，从而最大化类别间的距离。SVM 创建了一个软间隔，允许存在有界的分类误差，即本应位于投影一侧的一小部分输入，反而被放置在另一侧的有界距离内（因此被错误分类）；这个间隔允许在类别间高度分离（即更好的区分度）与避免过多异常值之间进行实用的权衡。\n\
  \n公式 11-4 将 {P, T, R} 的每个元素表示为每个处理器内五个功耗读数的线性函数，该函数适用于每个给定的类别或阶段。其中 (V [CPU] ) 表示进入处理器的功率，V\
  \ [DIMM] 测量连接到处理器并由其控制的内存模块中的功率。变量 J 代表一个给定的类别，{P J,R J,T J} 代表训练集中编号为 t 的样本的一个元组，与该样本相关的各种功耗读数由\
  \ V*(t) 表示。阶段 J；常数 K* [P] 、K* [R] 、K* [T] ；以及系数 ![A978-1-4302-5990-9_11_Figj_HTML.jpg](img/A978-1-4302-5990-9_11_Figj_HTML.jpg)\
  \ 和 ![A978-1-4302-5990-9_11_Figk_HTML.jpg](img/A978-1-4302-5990-9_11_Figk_HTML.jpg)\
  \ 均通过 SVM 回归技术进行估计。\n\n![A978-1-4302-5990-9_11_Figl_HTML.jpg](img/A978-1-4302-5990-9_11_Figl_HTML.jpg)\n\
  \n### 学习过程：优化规划\n\n能源和性能模型具有多个自由度以及相互冲突的目标，难以共同优化。例如，考虑以下目标：\n\n*   每瓦最佳性能\n*  \
  \ 保持在功耗限制内\n*   响应时间 ≤ 服务水平协议（SLA）阈值\n\n这些目标之间可能会出现冲突，需要考虑诸如以下问题：\n\n*   如何在系统功耗预算内获得给定的吞吐量\n\
  *   如何在响应时间阈值下获得给定的吞吐量\n\n在通常情况下，P（系统总功耗）受到吞吐量和响应时间这两个性能目标的影响。同样在一般情况下，性能受到处理器和\
  \ DIMM 模块两者功耗的影响。因此，优化规划必须努力实现一个复合目标：在这个目标中，为实现一个目标而消耗的功率通常是以牺牲另一个目标为代价的。一旦为功耗、吞吐量和响应时间合成出线性估计模型的系数，这些模型就可以通过一个反馈控制回路，在多目标优化中用作合成反馈。此示例使用自适应加权遗传算法（AWGA）方法，在具有多个目标的场景中搜索全局最优解。在这种机器学习技术中，成功的结果被定义为以这样一种方式重新分配功率，使得功率、响应时间和吞吐量的倒数都满足可行的限制。更一般地，一组适应度函数\
  \ {f [n] }（每个目标 n 对应一个）决定了候选设置（即描述组件间功率分布的向量）对于每个目标的最优性。在 AWGA 中，对于候选设置 {x} 的种群\
  \ f，![A978-1-4302-5990-9_11_Figm_HTML.jpg](img/A978-1-4302-5990-9_11_Figm_HTML.jpg)\
  \ ) 和 ![A978-1-4302-5990-9_11_Fign_HTML.jpg](img/A978-1-4302-5990-9_11_Fign_HTML.jpg)\
  \ = min(fn(x)|x ![A978-1-4302-5990-9_11_Figae_HTML.jpg](img/A978-1-4302-5990-9_11_Figae_HTML.jpg)\
  \ f)，你分别计算一组 n = 1, 2, . . . , N 个目标中每个目标的适应度边界，其中 f 中的每个 x 都是一个向量，其适应度函数代表组件（如\
  \ CPU 和 DIMM）之间一种可行的功率分布。然后，你可以选择一个 N 目标适应度函数 F 来评估一个聚合的适应度值。例如，在 AWGA 的情况下，F 可以选择为\n\
  \n![A978-1-4302-5990-9_11_Figo_HTML.jpg](img/A978-1-4302-5990-9_11_Figo_HTML.jpg)\n\
  \n进化算法（EA）从给定代数的 f 中选择父代（通常采用精英策略，允许当前代的最佳解原封不动地传递到下一代），并从中产生功率可行的子代，作为下一代的新候选解。在目标空间中，![A978-1-4302-5990-9_11_Figp_HTML.jpg](img/A978-1-4302-5990-9_11_Figp_HTML.jpg)\
  \ 和 ![A978-1-4302-5990-9_11_Figq_HTML.jpg](img/A978-1-4302-5990-9_11_Figq_HTML.jpg)\
  \ 代表每一代都会更新的极值点。作为极值点，适应度边界 {(![A978-1-4302-5990-9_11_Figr_HTML.jpg](img/A978-1-4302-5990-9_11_Figr_HTML.jpg))|n\
  \ = 1, 2, . . . , N} 在每一代都会更新，并且每个目标的贡献（权重）也会相应更新。\n\n\n\n### 学习过程：监控\n\n要实现能效性能并遵守功耗与性能约束，需要实时反馈控制。自主系统通过持续基于反馈的纠偏机制来实现，具体包含以下功能：\n\
  \n*   **监控基础设施**：用于采样或量化物理及逻辑指标（如功耗、温度、活动率），并获取指标的统计矩\n*   **分析模块**：用于提炼被监控量之间的关系（例如功耗、温度与性能之间的关系），并判断一个或多个运行目标是否面临风险\n\
  *   **规划单元**：用于制定行动方案，例如暂停、恢复、加速或减速系统的各个部分，以实施特定的策略选择（例如限制功耗或能耗，或提升性能）\n*   **执行能力**：用于执行已制定的计划，从而控制系统的运行\n\
  \n通常，知识库会辅助分析与规划。知识库可以是一个信息存储库，用于编录每个系统状态下允许执行的操作；也可以隐含在分析、规划和控制能力的逻辑中。在专为可扩展性设计的系统中，知识库通常包含一种自适应机制，用于跟踪并从先前的决策和结果中学习。对于智能反馈控制过程而言，细粒度且低侵入性的功耗性能监控是自适应电源管理基础设施的关键要素。理想的监控机制应能实时运行（即报告尽可能新的数据），且不受被监控行为的影响。在此配置下，操作系统和软件层面的逻辑传感器可提供近乎实时的信息流，包含常见系统调用、存储访问和网络传输的速率。这些逻辑传感器通过物理传感器补充了功耗感知能力。\n\
  \n遥测总线用于从物理（硬件）和逻辑（软件）传感器收集数据，并将其发送至监控代理。具体而言，功耗感知是通过感测每个处理器芯片的电压调节器（VR）输出来实现的。接收遥测数据的监控代理会对数据进行处理，将其组织成时间对齐的功耗与性能统计流，并将该流传输至远程机器以进行进一步存储或分析。监控基础设施提供了获取每个处理器独立功耗读数的能力。每个处理器控制着独立的内存通道，每个通道包含多个\
  \ DIMM；每对内存通道提供一个 V[DDQ]信号；将这些 V[DDQ]读数相加即可得到每个处理器在内存子系统中的功耗。这些传感器收集的数据会通过一系列转换进行精炼（见图\
  \ 11-9）：\n\n![A978-1-4302-5990-9_11_Fig9_HTML.gif](img/A978-1-4302-5990-9_11_Fig9_HTML.gif)\n\
  \n图 11-9.\n\n传感器网络模型：传感器网络分层架构（S1, S2, ..., Sn）代表平台传感器（CPU/DIMM 功耗、温度、性能等）。来源：平台自主性愿景：系统鲁棒框架（英特尔，2011）\n\
  \n*   **传感器硬件抽象（SHA）层**：该层与传感器及通信通道交互。它采用自适应采样，使得测量仅在必要时进行，并消除冗余。\n*   **平台传感器分析器**：该层去除噪声并分离趋势，从而更容易将近期和历史数据作为输入纳入后续处理。\n\
  *   **平台传感器抽象层**：该层提供编程接口，通过在其上层实现的控制程序，灵活处理已分析的传感器数据。\n*   **平台传感器事件生成层**：该层使得生成信号成为可能。信号促进了控制程序之间基于事件的对话，从而允许将进一步的控制托管在分布式容器集（例如本地或远程控制器软件及操作系统模块）中。前述的逐步精炼过程弥合了传感器产生的原始数据与软件模块能够接收并进一步分析的处理后、有序的性能与功耗读数及警报流之间的差距。\n\
  \n虽然可以轻松为机器配备计量电源来感知总功耗，但要实现细粒度功耗分解的仪器化能力则需要付出相当大的努力。此外，在生产机器中添加大量物理功耗传感器，从成本角度而言既无必要也不切实际。现代机器中的事件计数能力提供了一种强大的替代方法，可在直接测量不切实际时估算组件功耗。对于近期\
  \ CPU，一种简单而准确的功耗估算方法是基于使用情况和电源状态驻留时间，使用训练好的模型进行预测。通过包含执行配置文件（这些文件捕获指令落入单指令多数据流（SIMD）、加载/存储、算术逻辑单元（ALU）等少数类别中每一类的比例），可以使此类训练更加准确。DRAM\
  \ 功耗同样可以根据缓存未命中次数，或在内存控制器处计数并通过处理器事件监视器跟踪的 DRAM 操作来估算。DRAM 功耗估算允许以 DIMM 粒度测量 DRAM\
  \ 能量，其精度足以实现对 DRAM 电源状态的有效控制。对 DRAM 能量的有效控制不仅使我们能够降低硬件基础设施成本，还能通过减少为补偿低估而必需的防护带来提高能效。此外，也可以减少高估，以避免性能下降。\n\
  \n通过进程控制方法可以获得便于在竞争组件间进行最优功耗分配的决策空间，在这些方法中，特权软件可以修改其功耗。第一种方法（常用于基于英特尔的处理器）是更改 P\
  \ 状态和 C 状态（Siddha 2007）。第二种方法是使用一种称为运行平均功率限制（RAPL）能力的控制机制，更改 CPU 和 DRAM 模块的平均功耗水平。CPU\
  \ RAPL 提供了接口，用于为特定时间窗口设置功耗预算，并让硬件满足能量目标。将功耗限制指定为时间窗口内的平均值，使我们能够表示物理功耗和热约束。特权软件可以通过向接口寄存器编程设定所需的平均功耗水平来使用\
  \ RAPL 能力，硬件则可在可编程控制窗口内通过自身的修正频率调整来引导处理器达到该水平。窗口大小和功耗限制的选择，使得无论是在单机层面还是数据中心层面，对机器功耗的修正都能快速进行。实践中，窗口大小可在毫秒到秒之间变化——前者用于满足供电约束，后者用于管理热约束。RAPL\
  \ 概念也扩展到了内存系统，这得益于在英特尔平台的几个最新版本中，内存控制器被集成到了每个多核处理器中。尽管 CPU 和内存能量可以单独调节，但可以构建一种协调的自整定方法，其中功耗调节是联合优化函数的一部分，该函数由下一节讨论的机器学习技术支持。\n\
  \n\n\n## 模型训练：流程与评估\n\n在模型训练过程中，数据收集模块从电力监控传感器收集时间对齐的读数。此外，它还从数据库性能模块收集响应时间和请求完成率。这些读数提供了输入-输出训练向量\
