  1964）、所追求的模型稀疏性以及训练计算复杂度。这里介绍的损失函数是对称且凸的。虽然可以采用非对称损失函数来限制低估或高估，但损失函数应为凸函数，以确保优化问题具有唯一解，并且可以在有限步数内找到该解。在本章中，推导将基于公式
