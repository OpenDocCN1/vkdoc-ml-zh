  ### 实验结果


  从加州大学欧文分校机器学习库（Bache 和 Lichman，2013）获取的多个模式识别数据库的实验结果表明，CA（皮层算法）具有优越的性能，具体数据集详情如下：


  *   **字母识别数据集**：该数据集包含 20,000 张黑白图像，需将其分类为英文字母表中的 26 个大写字母之一（Slate，1991）。每个实例由一组
  16 个整数型特征表示，这些特征被归一化到 0-15 的范围内，代表图像的各个方面，例如水平和垂直位置、宽度和长度。该数据集报告的最佳准确率为 97.58%（Bagirov
  和 Ugon，2011）。

  *   **图像分割数据集**：该数据集由大小为 3 `×` 3 的图像组成，每个图像由 19 个属性描述，这些属性描述了图像的特征，例如平均强度、饱和度和色调（Vision
  Group，1990）。该数据集被划分为包含 210 个实例的训练集和包含 2,100 个实例的测试集；每个图像属于 7 个类别之一。Dash 等人（2003）实现了
  98.6% 的准确率。

  *   **ISOLET（孤立字母语音识别）数据集**：本实验的任务是将一组孤立的英语口语字母分类为 26 个类别（A-Z）之一。该数据集由 150 位发音者说出的
  2,800 个实例组成，每个实例由一组 617 个特征表示，包括频谱系数、轮廓特征、响音特征、前响音特征和后响音特征（Cole 和 Fanty，1994）。该数据库报告的准确率为
  96.73%（Dietterich，1994）。

  *   **PENDIGITS（基于笔迹的手写数字识别）数据集**：本实验涉及基于笔迹的手写数字识别。该数据库收集了来自 44 位书写者的 10,992 个样本，每个样本是一个
  (x, y) 坐标序列，代表书写过程中笔的轨迹。这些序列经过重采样，以获得固定长度的属性向量（等于 16，即八对 (x, y) 坐标），并进行归一化以消除不同书写习惯带来的伪影影响。10,992
  个样本被划分为包含 7,494 个实例的训练集和 3,498 个实例的测试集。该数据集的准确率达到 98.6%（Alpaydin 和 Alimoglu，1998）。

  *   **多特征数据集**：该数据集包含 649 个特征，总共 2,000 个手写数字模式（`0''`--`9''`），这些模式从一组荷兰公用事业地图中提取（Duin，2013）。这些数字通过六个特征集表示：字符形状的
  76 个傅里叶系数；216 个轮廓相关性；64 个 Karhunen-Lo`è`ve 系数；240 个像素平均值（在 2 `×` 3 窗口中）；47 个 Zernike
  矩；以及六个形态学特征。达到的最佳准确率为 98%（Perkins 和 Theiler，2003）。

  *   **鲍鱼数据集**：该数据集的任务是根据总共八项物理测量值（如高度、重量、直径和长度）对 4,177 个鲍鱼的年龄进行分类。该数据集的特点是类别分布极不平衡，已达到
  79.0% 的准确率（Tan 和 Dowe，2003）。


