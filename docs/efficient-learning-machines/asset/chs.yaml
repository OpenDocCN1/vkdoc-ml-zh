  ## 贝叶斯线性回归


  与支持向量回归（SVR）不同，贝叶斯线性回归是一种**生成式**（而非判别式）方法，它基于贝叶斯推断构建线性回归模型。在指定模型后，该方法会计算参数的后验分布和模型预测值。这种统计分析使得该方法能够在训练过程中确定模型复杂度，从而得到一个更不易过拟合的模型。


