  \n*   **细胞体**：大小和形状各异\n*   **树突**：从细胞体延伸出的众多树状结构，构成神经元的接收部分（即输入部位）\n*   **轴突**：一种细长、分支相对较少的结构，负责将电信号传递到相连区域\n\
