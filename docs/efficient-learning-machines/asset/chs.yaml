  约束条件是最小化给定输入下函数的预测值与实际输出之间的误差。SVR 采用 ε 不敏感损失函数，对距离期望输出超过 ε 的预测进行惩罚。ε 的值决定了管道的宽度；较小的值表示对误差的容忍度较低，同时也会影响支持向量的数量，进而影响解的稀疏性。直观上，后者可以通过图
  4-1 来理解。如果 ε 减小，管道的边界会向内移动。因此，更多的数据点位于边界附近，这意味着更多的支持向量。类似地，增加 ε 将导致边界附近的点减少。




  由于对噪声输入不敏感，ε-不敏感区域使模型更具鲁棒性。可以采用多种损失函数，包括线性、二次和 Huber ε损失函数，分别如公式 4-4、4-5 和 4-6 所示。如图
