  \ (t) 为 1，否则为 0\n\ng(P [sj,i] (t – p)) 以概率 P [sj,i] (t) 为 1，否则为 0\n\n## 结论\n\n本章及前两章涵盖了与深度学习相关的四种学习算法：深度神经网络（DNN）、皮层算法（CA）、层级时间记忆（HTM）和脉冲神经网络（SNN）。DNN\
  \ 是一种从传统 AI 视角发展起来的成熟技术，并在许多应用中展现出稳健的结果。CA、SNN 和 HTM 是受生物启发的技术，虽然不太成熟，但被生物启发计算的支持者视为极具前景。然而，传统的\
  \ AI 支持者认为，与 DNN 相关的方法将成为学习领域的未来赢家。哪种愿景会占上风是一个激烈争论的问题。\n\n但是，与其问谁对谁错，我们或许更应该根据所寻求学习的背景和目标来提出问题。我们是在寻求创造一种通用的机器智能形式，能够复制人类智能通过从少量实例中进行推理来学习的能力，以应用于各种场景？还是我们追求的是计算高效的学习框架，能够以蛮力处理从物联网（IOT）收集的大数据，以开发能够执行预测和描述性任务的模型？\n\
  \n由于研究人员尚未就 AI 的唯一定义或评估学习算法的黄金标准达成一致，本文旨在为读者提供关于深度学习这个快速扩展的子领域的一般背景和当前快照。\n\n\n\n"
- "# 10. 多目标优化\n\n所有人都在追寻同一个目标：成功或幸福。实现真正成功的唯一途径，是在服务社会的过程中完全展现自我。首先，要有一个明确、清晰、切实的理想——一个目标，一个目的。其次，要拥有实现目标所需的手段：智慧、金钱、材料和方法。最后，调整你所有的手段去服务于那个目标。\
  \ ——亚里士多德\n\n多目标优化旨在满足一组约束条件的同时实现多个目标，且这些目标之间很可能相互冲突。多目标优化也可以解释为一个多准则决策过程，在此过程中，多个目标函数需要同时进行优化。在许多情况下，最优决策可能需要在相互冲突的目标之间进行权衡。传统的优化方案使用一个权重向量来指定每个目标的相对重要性，然后将这些目标组合成一个标量成本函数。这种策略通过将多目标问题转化为单目标问题来降低其求解复杂度。多目标优化的求解技术涉及模型复杂度与准确性之间的权衡。多目标优化的例子可见于经济学（制定货币政策）、金融学（风险-收益分析）、工程学（过程控制、设计权衡分析）以及许多其他需要处理相互冲突目标的应用场景中。\n\
  \n多目标优化的先决条件之一是确定一个解是否优于另一个解。然而，并不存在得出此类结论的简单方法。相反，多目标优化方法通常采用一组帕累托最优解（也称为非支配解），这些解是在不同目标之间具有不同权衡的备选方案。在由帕累托最优集定义的解中，如果不降低该集合中至少一个其他目标的性能，就无法改进任何一个目标。由决策者来选择最符合其偏好策略或指导方针的帕累托最优解。帕累托图展示了不同目标之间权衡的属性。解可以表示为一条曲线或一个三维曲面的形状，该曲面在多目标空间中权衡不同的区域。\n\
  \n本章讨论使用进化方法求解基于帕累托的多目标优化问题的机器学习方法论。目标是找到一组非支配解，使其在每一代中与帕累托前沿的距离最小。连续的解作为进化过程的一部分被构建，其中一组选定的个体解会为下一代产生另一组解。具有较高适应度度量的解更有可能被选入交配池，前提是假设它们将在下一代（下一次运行）中产生更适应的解，而适应度度量较弱的解则更有可能被丢弃。这类解具有若干属性，使其适用于涉及以下情况的问题：(1)\
  \ 庞大且复杂的搜索空间，(2) 相互冲突的目标。\n\n## 正式定义\n\n多目标优化问题处理有限数量的目标函数。在一个具有 n 个同等重要目标（均需最小化或最大化以满足性能标准）的优化问题中，从数学上，该问题可以表示为一个必须通过某种方式进行权衡的目标向量\
  \ f [i] (x)，![A978-1-4302-5990-9_10_Figa_HTML.jpg](img/A978-1-4302-5990-9_10_Figa_HTML.jpg)\n\
  \n其中 X（见公式 10-2）是一组 n 个决策向量（一个决策空间），代表为满足约束条件和优化向量函数而选定的参数值，![A978-1-4302-5990-9_10_Figb_HTML.jpg](img/A978-1-4302-5990-9_10_Figb_HTML.jpg)\n\
  \n在清晰理解这些目标之间的权衡之前，无法确定它们的相对重要性。由于 F(x) 是一个向量，相互竞争的目标函数会阻止其获得唯一解。你可以将决策空间 X 中的每个解\
  \ x 与目标空间 Y 中的一个点关联起来，使得\n\n![A978-1-4302-5990-9_10_Figc_HTML.jpg](img/A978-1-4302-5990-9_10_Figc_HTML.jpg)\n\
  \n在多目标优化中，集合 X 和 Y 分别被称为决策变量空间和目标函数空间。图 10-1 展示了搜索空间到目标空间的映射。搜索空间的每一次迭代都会产生一组定义目标空间的目标向量，其中多个最优目标向量可能代表了目标之间的不同权衡。\n\
  \n![A978-1-4302-5990-9_10_Fig1_HTML.gif](img/A978-1-4302-5990-9_10_Fig1_HTML.gif)\n\
  \n图 10-1.\n\n多目标优化问题：将搜索空间映射到目标空间\n\n### 帕累托最优性\n\n帕累托最优性是一个建立在多目标优化基础上的概念，它通过多个目标组合之间的权衡来促进多目标向量的优化。权衡的制定是为了以牺牲一个或多个其他目标的性能为代价来提高一个目标的性能。如图\
  \ 10-1 所示，目标空间中的每个点代表一组独特的模型变量，因此帕累托最优性对多个帕累托最优解进行分类。该术语是为了纪念维尔弗雷多·帕累托（1848–1923），一位意大利经济学家，他证明了收入遵循幂律概率分布。\n\
  \n在理想情况下，多目标问题的最优解通常被表示为帕累托集 ![A978-1-4302-5990-9_10_Figd_HTML.jpg](img/A978-1-4302-5990-9_10_Figd_HTML.jpg)。相应的结果或目标向量由帕累托前沿\
  \ ![A978-1-4302-5990-9_10_Fige_HTML.jpg](img/A978-1-4302-5990-9_10_Fige_HTML.jpg)\
  \ 表示。在实践中，理想解是不存在的，求解多目标优化通常不会产生唯一的最优解。相反，我们使用帕累托最优解，在这种解中，如果不降低至少一个其他目标的性能，就无法改进任何一个目标。因此，当使用进化技术时，了解最优帕累托集\
  \ (X*, Y*) 有助于找到最佳折衷解。\n\n\n\n### 支配关系\n\n如果满足以下条件，则解 x[1] 支配另一个解 ![A978-1-4302-5990-9_10_Figf_HTML.jpg](img/A978-1-4302-5990-9_10_Figf_HTML.jpg)：\n\
  \n对于所有目标，解 x[1] 优于或等于 x[2]，即 ![A978-1-4302-5990-9_10_Figg_HTML.jpg](img/A978-1-4302-5990-9_10_Figg_HTML.jpg)\
  \  \n对于至少一个目标，解 x[1] 严格优于 x[2]，即 ![A978-1-4302-5990-9_10_Figh_HTML.jpg](img/A978-1-4302-5990-9_10_Figh_HTML.jpg)\
  \  \n\n如果这两个条件中的任何一个被违反，则 x[1] 不（帕累托）支配解 x[2]。支配关系是非对称的。例如，如果解 x[1] 不支配解 ![A978-1-4302-5990-9_10_Figi_HTML.jpg](img/A978-1-4302-5990-9_10_Figi_HTML.jpg)，这并不意味着\
  \ x[2] 支配 ![A978-1-4302-5990-9_10_Figj_HTML.jpg](img/A978-1-4302-5990-9_10_Figj_HTML.jpg)；因此，两个解可以是非支配的。然而，支配关系也是传递的。例如，如果\
