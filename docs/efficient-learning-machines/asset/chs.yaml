  \n\n\n## 示例 3：入侵检测的系统方法\n\n在协作自组网和普适无线连接的时代，我们更容易受到恶意攻击。这些复杂的攻击在入侵尝试期间会低于阈值边界运行，只能通过分析相对于正常行为的完整系统活动来识别。许多此类攻击本质上是隐蔽的，无法通过传统的入侵检测系统（IDS）方法（如流量监控、端口扫描或协议违规）检测到。入侵检测可以类比于人体免疫系统，它通过理解正常过程的规范来识别并消除异常。标识符应分布在整个系统中，并具有可识别且可适应的关系。因此，我们需要一个模型，该模型在每个状态下都有产生可观测系统输出的概率，以及一个指示下一状态的独立概率。\n\
  \n与有线网络不同，自组网节点在成员节点之间进行协调，以允许独占使用通信信道。恶意节点可以利用协作节点的这种分布式且复杂的决策特性来发起攻击或劫持节点。这种固有的脆弱性可能使整个网络集群瘫痪，并通过冒充、消息污染、被动监听或充当恶意路由器等方式进一步危及安全。IDS\
  \ 机制应能够通过将系统中的异常活动与用户配置文件及演变趋势进行比较来检测入侵。尽管如果攻击者低于阈值运行，这些机制可能不足以阻止恶意攻击，但可以修改基于阈值的机制来监控相关系统组件的趋势以预测攻击。这类似于\
  \ HMM（参见第 5 章），其中隐藏状态（攻击）可以从相关观测值（系统参数变化、故障频率等）中预测出来。观测到的行为充当正常或异常活动的签名或描述，并以统计度量和模型的形式进行表征。度量是一个随机变量，代表在一段时间内累积的定量测量值。从审计记录中获得的观测值，当与统计模型一起使用时，可以分析任何与标准配置文件的偏差，并触发可能的入侵状态。\n\
  \n本示例讨论了一种基于 HMM 的入侵检测策略，使用多元高斯模型处理观测值，这些观测值反过来用于预测以隐藏状态形式存在的攻击。该模型包括一个用于事件聚类的自组织网络、一个观测分类器、一个漂移检测器、一个配置文件估计器（PE）、一个高斯混合模型（GMM）加速器以及一个\
  \ HMM 引擎。该方法旨在根据观测到的与正常配置文件的偏差，或通过将这些偏差分类到适当的攻击配置文件中，来预测入侵状态。HMM 是一种离散事件的随机模型，也是马尔可夫链的一种变体。与传统的马尔可夫链一样，HMM\
  \ 由一组离散状态和一个状态转移概率矩阵 A = {a [ij] } 组成。此外，每个状态都有一个观测符号概率向量 B = b [j] (v)，该向量对应于系统在状态\
  \ j 时产生类型 v 的符号的概率。HMM 的状态只能从观测到的符号中推断出来——因此称为“隐藏”。HMM 将观测值与隐藏状态相关联，这些隐藏状态考虑了系统设计，其中观测点通过使用一组可接受的系统级入侵检查点（IC）进行优化；隐藏状态是利用与这些观测值之间的概率关系的显式知识创建的。这些关系（也称为配置文件）会随着多个独立系统的持续使用而强化和演变。如果观测点可以标准化，那么入侵可预测性问题就可以简化为将现有和新的隐藏状态配置到标准观测值中。\n\
  \n### 建模方案\n\nHMM 建模方案的参数包括观测状态、隐藏（入侵）状态和 HMM 配置文件。使用初始数据和连续重估进行 HMM 训练，会创建一个包含转移概率和观测符号概率的配置文件。HMM\
  \ 建模涉及以下任务：\n\n*   测量观测状态，这些状态是从入侵指标中分析或逻辑推导出来的。这些指标是分布在整个系统中的测试点。\n*   估计瞬时观测概率函数，该函数表示在给定隐藏状态的情况下观测值的概率。该密度函数可以使用显式参数模型（多元高斯）进行估计，或者通过非参数方法（多元核密度发射）从数据中隐式估计。\n\
  *   通过聚类单个或多个组件的同质行为来估计隐藏状态。这些状态指示了需要向管理员识别的各种入侵活动。\n*   使用先验知识或随机数据估计隐藏状态转移概率矩阵。先验知识以及长期时间特征，指示了状态组件从一个入侵状态转移到另一个入侵状态的近似概率。\n\
  \n#### 观测（发射）状态\n\n观测状态代表使用 IC 指标分析或逻辑推导出的竞争风险。机器入侵可以被视为多个组件竞争入侵发生的结果。在该模型中，IC 引擎推导出连续的多元观测值，这类似于均值和标准差模型，不同之处在于前者基于两个或多个度量之间的相关性。这些观测值\
  \ b [j] (v) 具有连续概率密度函数（PDF），并且是多元高斯（正态）分布的混合，表示为（Lee, Kawahara, and Shikano 2001）\n\
  \n![A978-1-4302-5990-9_11_Figu_HTML.jpg](img/A978-1-4302-5990-9_11_Figu_HTML.jpg)\n\
  \n其中 ![A978-1-4302-5990-9_11_Figv_HTML.jpg](img/A978-1-4302-5990-9_11_Figv_HTML.jpg)\
  \ 表示转置，且\n\nc [jk] ≥ 0 & ![A978-1-4302-5990-9_11_Figw_HTML.jpg](img/A978-1-4302-5990-9_11_Figw_HTML.jpg)\n\
  \nσ [jk] = 第 j 个状态的第 k 个混合分量的协方差矩阵\n\nμ [jk] = 第 j 个状态的第 k 个混合分量的均值向量\n\nv = 观测向量\n\
  \nM = 具有多元高斯分布的观测值的维度数\n\nθ [jk] = (σ [jk] , μ [jk] ) = 高斯分量\n\nη [jk] = 第 j 个状态的第\
  \ k 个混合分量的漂移因子\n\nλ [jk] = (θ [jk] , c [jk] , η [jk] ) = 用户配置文件分量\n\nIC 引擎负责为所有矩阵和所有可能的攻击状态动态重估\
  \ λ [jk] 参数。表示观测值维度的各种矩阵如下：\n\n*   **资源活动趋势**：在较大采样周期内监控的资源活动的度量，其特性在该采样周期内重复出现。每个活动周期可以被视为活动度量的一个额外维度。\n\
  *   **事件间隔**：两个连续活动（例如，登录尝试）之间间隔的度量。\n*   **事件趋势**：在较大采样周期内监控的事件的度量，其目标是利用内置的可重复性计算事件行为（例如，一天内的登录尝试次数）。\n\
  \n\n\n#### 隐藏状态\n\n隐藏状态 ![A978-1-4302-5990-9_11_Figx_HTML.jpg](img/A978-1-4302-5990-9_11_Figx_HTML.jpg)\
  \ 是一组不可见的状态，但每个状态会随机生成 M 个观测值（或可见状态 O）的混合。后续状态的概率仅取决于前一个状态。完整模型由以下概率定义：转移概率矩阵 A\
  \ = a [ij]，其中 a [ij] = p(S [i] |S [j] )；观测概率矩阵 B = (b [i] (v [m] ))，其中 b [i] (v\
  \ [m] ) = p(v [m] |S [i] )；以及初始概率向量 π = p(S [i] )。观测概率表示当预期出现特定故障状态时，以一定概率观测到的属性。该模型表示为\
  \ M = (A,B,π)。转移概率矩阵是一个方阵，其大小等于状态数量，代表状态转移概率。\n\n观测概率分布是一个非方阵，其维度等于状态数量乘以可观测值数量。该分布表示在给定状态下观测到某个值的概率。图\
  \ 11-15 中描述的入侵检测系统（IDS）使用了以下状态：\n\n![A978-1-4302-5990-9_11_Fig15_HTML.gif](img/A978-1-4302-5990-9_11_Fig15_HTML.gif)\n\
  \n图 11-15.\n\nHMM 模型，包含五个入侵状态，每个状态有四个高斯分布；每个高斯分布可表示为观测值的混合分量。（来源：Khanna 和 Liu，2006）\n\
  \n*   正常（N）状态表示符合用户轮廓。\n*   恶意入侵尝试（HI）表示正在进行的恶意入侵尝试。这通常是外部代理试图绕过系统安全性的典型行为。\n* \
  \  友好入侵尝试（FI）表示正在进行的非恶意入侵尝试。这通常是内部代理试图绕过系统安全性的典型行为。\n*   入侵进行中（IP）表示正在建立自身的入侵活动。这包括尝试访问特权资源和资源使用加速。\n\
  *   入侵成功（IS）表示入侵成功。成功的入侵将伴随异常的资源使用（CPU、内存、I/O 活动等）。\n\n### 入侵检测系统架构\n\n在自组织网络中，入侵检测系统（IDS）部署在节点上，用于本地且独立于其他节点地检测入侵迹象，而不是使用路由器、网关或防火墙。在本节中，我们定义了\
  \ IDS 中相互协作以预测攻击状态的组件。\n\n模型训练完成后，会进入运行时状态，在此状态下，它会检查并对每个有效观测值进行分类。然后，模型决定将该观测值添加到轮廓更新中、拒绝它，或将其标记为“未分类”。此决策至关重要，因为用户正常行为的漂移可能代表攻击情况。未分类的观测值会被监控，以便将来进行分类。根据未分类状态趋向于特定分类的趋势相似性，以及来自其他独立观测的状态机反馈，该观测值随后将被作为噪声拒绝，或分类为有效状态。IDS\
  \ 的各种组件如下：\n\n*   轮廓估计器（PE）：PE 负责维护/重新估计用户轮廓，将观测值分类为攻击状态，在检测到可疑观测值时触发警报，或根据 HMM\
  \ 反馈对轮廓进行重新估计。用户轮廓数据由 PDF 参数 ![A978-1-4302-5990-9_11_Figy_HTML.jpg](img/A978-1-4302-5990-9_11_Figy_HTML.jpg)\
  \ 组成，其中 j 代表入侵状态，k 代表高斯混合模型（GMM）的混合分量。新的观测值将根据此轮廓进行评估，从而得出其分类和漂移检测。\n*   检测工具：检测工具生成事件数据，这些数据由聚类代理处理并用于估计轮廓。组件识别和测量涉及设置，以判断事件是应以固定间隔采样，还是在记录到模式变化时生成通知（或警报）作为事件向量。传感器数据应能够分析数据（无论是实时收集还是事后分析），并为可疑的入侵行为提供实时警报通知。这需要快速的硅级钩子，能够识别、计数、设置阈值、添加时间戳、生成事件和清除活动。此类钩子的示例包括性能计数器、翻转计数器（也称为事务计数器）、报头嗅探器、故障警报（如页面错误）和带宽使用监控器。同时，还需要软件检测工具来采样与软件相关的测量值，例如会话活动、不同进程和应用程序之间的系统调用使用情况、文件系统使用情况以及换入/换出使用情况。大多数操作系统以进程跟踪（例如，UNIX\
  \ 中的进程 ID [PID]）的形式支持这些钩子。这些快速钩子与采样能力的组合被聚类以形成观测。\n*   数据聚类：观测数据依赖于活跃事件的聚合。例如，由资源使用引擎生成的资源故障事件会进一步分类为故障类型，例如页面错误。在采样间隔内，页面错误计数和无效页面错误代表了测量实例（m\
  \ [1], m [2]）。一个观测值（发射值）可以是一组相关的测量值，但由单个概率分布函数表示。这些测量值中的每一个都带有不同的权重，如同多元高斯分布。例如，由于网络文件系统（NFS），磁盘\
  \ I/O 使用率可能与网络 I/O 使用率相关。这种关系被纳入轮廓中，以保证观测的完整性，并降低维度，以实现有效的运行时处理。\n*   分类器：对观测数据进行分析，以便在由不同概率分布参数驱动的轮廓中，将其子分类为适当的攻击状态。一旦识别出适当的攻击状态，就会生成一个关注事件以启动纠正或记录操作。还会分析观测数据是否存在概念漂移，以补偿用户（或攻击）行为的变化。因此，IC\
  \ 引擎（见图 11-16）的目标之一是为 j（攻击状态）构建一个分类器，对于每个实现，该分类器对于 j 的一个值具有接近 1 的后验概率 p(j|v)，而对于所有其他值则接近\
  \ 0。这可以通过在给定观测数据 v 的情况下最小化香农熵来实现，对于每个观测值，香农熵可计算为 ![A978-1-4302-5990-9_11_Figz_HTML.jpg](img/A978-1-4302-5990-9_11_Figz_HTML.jpg)\n\
  \n![A978-1-4302-5990-9_11_Fig16_HTML.gif](img/A978-1-4302-5990-9_11_Fig16_HTML.gif)\n\
  \n图 11-16.\n\n\n\n内燃机引擎。轮廓的重新估计使用观测分类器和 HMM 反馈至轮廓。当观测结果被分类为攻击状态或无法分类（U）时，轮廓管理器会触发一个关注事件。关注事件会基于其他连续观测（虚线箭头）启动\
  \ HMM 状态序列预测，这些观测与轮廓和状态转移概率共同提取。（来源：Khanna and Liu 2006）\n*   每个内燃机引擎独立于其他观测（或发射）来采样其观测。每当它怀疑有异常活动时，就会触发警报，从而引发对最可能状态的评估。随着系统改变其活跃行为，对应行为的轮廓会被更新，通过实时使用连续估计机制重新评估模型参数，以避免误报评估。新的\
  \ HMM 参数会与历史 HMM 参数再次进行评估，通过比较旧模型和重新训练模型的熵。期望最大化（EM）算法（Moon 1996）为统计模型中存在未观测变量的参数的最大似然估计（MLE）问题提供了一种通用方法。评估过程产生一组参数，算法使用这些参数将观测点分配到新的状态。对于\
  \ GMM，EM 算法的计算复杂度为 O(i × ND²)，其中 i 是执行的迭代次数，N 是样本数量，D 是状态维度。一种常见的实现选择是 k-means 算法，其中\
  \ k 个簇由其质心参数化，复杂度为 O(kND)。还可以使用许多其他算法，包括 x-means 聚类（Pelleg and Moore 2000），它将复杂度降低到\
  \ O(D)。\n*   概念漂移检测器（CDD）：该模块检测并分析轮廓中的概念漂移（Widmer and Kubat 1996），当仅靠训练数据集不足时，需要持续更新模型（轮廓）。当存在随时间演变的概念漂移时，如果新概念和旧概念仍具有一致性，并且任意选择的旧数据量恰好合适（Fan\
  \ 2004），那么不加选择地使用旧数据是有帮助的。这需要一种高效的数据挖掘方法，以帮助选择新旧数据（历史数据）的组合，从而实现准确的重新轮廓化和进一步分类。所使用的机制是\
  \ Kullback-Leibler（KL）散度（Kullback and Leibler 1951），其中相对熵衡量生成模型的两个概率分布之间的核距离。KL\
  \ 散度也是从先验到后验过程中香农信息的增益，表示为 ![A978-1-4302-5990-9_11_Figaa_HTML.jpg](img/A978-1-4302-5990-9_11_Figaa_HTML.jpg)\n\
  *   其中 α [jkt] 是 KL 散度度量 ![A978-1-4302-5990-9_11_Figab_HTML.jpg](img/A978-1-4302-5990-9_11_Figab_HTML.jpg)，是新的高斯分量，而\
  \ θ [jkt] 是时间 t 时第 j 个状态的第 k 个混合的旧高斯分量。你可以通过蒙特卡洛模拟评估散度，使用大数定律（Grimmett and Stirzacker\
  \ 1992），该方法从估计的高斯分量中抽取一个观测值 v [i] ![A978-1-4302-5990-9_11_Figac_HTML.jpg](img/A978-1-4302-5990-9_11_Figac_HTML.jpg)，计算对数比率，并在\
  \ M 个样本上取平均值，如 ![A978-1-4302-5990-9_11_Figad_HTML.jpg](img/A978-1-4302-5990-9_11_Figad_HTML.jpg)\n\
  *   在时间域计算的 KL 散度数据用于评估漂移速度（也称为漂移因子）（0 ≤ η ≤ 1）。然后，这些数据用于为历史参数分配权重，这些权重反过来用于重新轮廓化。\n\
  *   反馈引擎（FE）：该组件负责将当前状态信息反馈给 PE。当前状态信息使用当前的 PDF 模型参数进行重新评估。然后，这个重新评估的状态信息用于改进寻找\
  \ MLE 的下降算法。\n\n## 轮廓与系统考量\n\n在本节中，我们考察构成轮廓结构输入的事件。我们将特征定义为通过处理器函数从一个或多个时间输入事件中导出的处理后的观测。\n\
  \n利用事件的时间序列信息可以提升为单个用户、程序或类别定义的轮廓的性能（Ghosh, Schwartzbard, and Schata 1999）。以下任何形式的异常活动都是入侵或蠕虫活动的指标：\n\
  \n*   CPU 活动通过采样故障、处理器间中断（IPI）调用、上下文切换、线程迁移、锁自旋和使用统计信息进行监控。\n*   网络活动通过采样输入错误率、冲突率、远程过程调用（RPC）拒绝率、重复确认（DUPACK）、重传率、超时率、刷新认证、带宽使用、活动连接、连接建立失败、头部错误和校验和失败等进行监控。\n\
  *   中断活动通过采样设备中断（非定时器）进行监控。\n*   I/O 利用率通过采样 I/O 请求的平均队列长度和繁忙百分比进行监控。\n*   内存活动通过采样内存传输速率、页面统计信息（回收率、换入率、换出率）、地址转换错误以及短时间间隔内扫描的页面和分页平均值进行监控。\n\
  *   文件访问活动通过采样文件访问频率、文件使用溢出和文件访问错误进行监控。\n*   系统进程活动通过采样具有不当进程优先级的进程、进程使用的 CPU 和内存资源、进程长度、阻塞\
  \ I/O 的进程、僵尸进程以及生成该进程的命令和终端进行监控。\n*   系统故障活动代表非法活动（或硬件错误），通过采样来检测系统使用中的异常。罕见故障是糟糕编程的结果，但活动的突然爆发则表明存在攻击。\n\
  *   系统调用活动涉及获取计算机系统权限的强大工具。入侵伴随着意外系统调用的执行。如果可以在程序执行前收集其系统调用执行模式，并将其与运行时系统调用执行行为进行比较，那么就可以检测到意外的系统调用执行。在实时操作期间，会应用模式匹配算法，将所检查进程生成的系统调用与模式表中的条目进行即时匹配。根据匹配的程度，可以判断系统调用序列是代表正常行为还是异常行为（Wespi,\
  \ Dacier, and Debar 1999）。\n*   会话活动通过采样登录频率、不成功的登录尝试、会话持续时间、会话时间和会话资源使用情况进行监控。\n\
  \n\n\n## 传感器数据测量\n\n传感器数据经过收集和统计处理，可用于衡量历史趋势、捕捉独特模式以及可视化异常行为。这些数据被分类后进行分析，以预测异常活动。传感器数据测量包含多个组件，分别执行统计处理功能或基础设施功能（例如生成优先级事件），具体如下：\n\
  \n*   传感器数据测量（SDM）钩子降低了系统复杂性，并提高了软件复用的可能性（见图 11-17）。SDM 能够利用系统策略发送警报，从而加速对集群组件的联合测量。硬件和软件充当传感器与控制系统之间的粘合剂，该系统能够测量事件间隔和事件趋势，并在偏离系统策略定义的正常行为时生成警报。SDM\
  \ 硬件作为一个多实例实体存在，接收来自系统中各处事件的警报向量。一组形成集群的相关事件会注册到同一个 SDM 实例上。该实例代表了一组模式类别之间的贝叶斯最优决策边界，每个类别由一个\
  \ SDM 实例表示，并与一个参考向量相关联。每个 SDM 实例都可以进行趋势分析和警报，并将来自事件传感器的测量结果整合到一个统一的视图中。集群趋势分析对微小的信号变化非常敏感，能够通过监督式自组织映射（Kohonen\
  \ 1995），利用学习向量量化（LVQ）检测嵌入在正常信号中的异常信号。LVQ 背后的策略是有效训练参考向量，以定义注册到某个 SDM 实例的各个 SDM 类别之间的贝叶斯最优决策边界。\n\
  \n    ![A978-1-4302-5990-9_11_Fig17_HTML.gif](img/A978-1-4302-5990-9_11_Fig17_HTML.gif)\n\
  \n    图 11-17.\n\n    事件（圆圈）、传感器（SDM）和分类器（ODC）之间关系的示意图。事件集群（以相同颜色标记）注册到 SDM。在评估事件属性后，SDM\
  \ 向 ODC 生成一个事件，ODC 负责分类、趋势分析和漂移计算。分类反馈充当重新估计的机制。（来源：Khanna 和 Liu 2006）\n*   观测数据分类器（ODC）钩子加速了对\
  \ SDM 生成的观测警报的分类。这是一种多实例硬件，能够并行处理多个观测。ODC 钩子的每个已注册观测实例都包含每个状态的高斯概率分布参数。在收到 SDM 警报后，相应的观测会被分类为特定状态。对观测数据的重新分类可能导致与该状态对应的概率分布参数发生变化。ODC\
  \ 可以维护历史参数，这些参数用于使用 KL 漂移检测器计算概念漂移属性，例如漂移因子和漂移速度。\n*   GMM 计算器利用当前观测值计算每个状态的高斯混合概率。在系统设置期间，事件向量会注册到\
  \ SDM 实例。这些事件在其各自的 SDM 中被聚类和处理。处理过程包括触发属性，这些属性会启动一个观测。然后，这些观测作为单维事件注册到其 ODC。收到触发信号后，ODC\
  \ 对源自该触发的观测进行重新分类，并计算概念漂移。该硬件由其父级触发后激活。\n\n## 总结\n\n随着越来越多的数据以非结构化的数字形式表达，新的计算模型正在被开发出来，以有意义的方式处理这些数据。可以应用机器学习方法，通过系统地应用算法来综合非结构化数据集与信息之间的基本关系。机器学习利用了泛化的力量，这是通过人类学习形成概念过程中固有且必不可少的组成部分。机器学习方法可用于开发自主系统，利用模块化功能来实现智能反馈控制系统。这种方法在建模知识功能方面可以发挥关键作用，该功能用于实现稳定且可行的系统。本章介绍了机器学习中使用的三种技术示例。第一个示例采用了工作负载指纹识别的概念，利用阶段检测来建立具有空间均匀性和独特性的可观测特征。第二个示例基于多个计算单元之间最优动态能量分配的概念。该示例提出将阶段作为压缩的代表性输出，可以与任何其他统计参数结合使用来预测未来行为。最后一个示例建议使用\
  \ IDS 机制，通过参考用户画像和演变趋势监控系统中的异常活动来检测入侵。每个示例都使用了特定于应用的机器学习技术组合来实现预期目标。\n"
