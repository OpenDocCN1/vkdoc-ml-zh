  \ 年前九个月的数据作为训练数据集，后三个月用于交叉验证模型的预测。他灵机一动，想到可以使用预测技术为雅虎股票时间序列生成一条泛化曲线。然后根据该曲线的形状，决定采用哪种回归模型来实现对未来时间点的预测。使用预测技术的根本目的是捕捉时间序列对象中存在的季节性和趋势成分。\n\
  \n因此，大卫开始专注于第一个目标——即构建一个能够最佳捕捉雅虎股票时间序列成分的时间序列预测模型。他回想起在公司金融课程中，他们曾使用时间序列方法进行股票预测。他做了一些研究，以了解什么是时间序列建模，以及何时应该优先使用它。\n\
  \n### 时间序列建模\n\n以固定时间间隔收集的数据点构成时间序列。时间序列分析通常旨在根据问题的基本假设，预测随时间变化的长期趋势。\n\n那天是星期五，大卫期待着与朋友和家人共度周末。他也对与朋友玛丽亚的会面感到兴奋，玛丽亚是他学生时代的同班同学，研究方向偏向统计学。\n\
  \n星期六，大卫和玛丽亚在一家著名的快餐店共进午餐。大卫没有浪费时间，直接提出了问题以及他打算如何解决。他知道，在分析初期进行充分的尽职调查，才能得出富有成效的研究成果。因此，他很想听听玛丽亚关于时间序列分析中必不可少的统计概念和技术的建议，以便在继续之前加以应用。玛丽亚建议他检查时间序列数据是否平稳，因为大多数时间序列模型都是设计用于处理平稳数据并给出结果的。\n\
  \n\n\n## 评估时间序列对象的平稳性\n\n大卫把他的计划拆解成了几个部分。他首先计划了解一个时间序列对象需要具备哪些属性才能是平稳的。然后，他必须检查手头的数据是否平稳；如果不是，他需要寻找使其平稳的技术。大卫首先列出了使时间序列对象平稳的属性。\n\
  \n### 平稳时间序列的属性\n\n大多数时间序列模型都基于数据是平稳的这一假设。此外，与平稳时间序列相关的对立理论比非平稳时间序列理论更容易实现。如果一个时间序列对象具有以下属性，则它是平稳的：\n\
  \n*   不存在趋势\n*   均值随时间保持恒定\n*   方差随时间保持恒定\n*   不存在自相关。自相关是指当前时间序列与其滞后版本之间的相关性。\n\
  \n一旦大卫知道了时间序列对象平稳所需的四个属性，他就开始寻找技术来检验时间序列数据是否平稳。\n\n### 判断时间序列是否平稳的检验方法\n\n他的搜索为他提供了两种验证方法：探索性数据分析和迪基-富勒检验。探索性数据分析方法可以帮助检测雅虎股票数据集中的平稳性属性。\n\
  \n#### 探索性数据分析\n\n这更像是一种通过可视化来判断分布是否平稳的方法。它涉及使用滚动均值和滚动方差来回答根本问题。如果这些滚动指标随时间保持恒定，那么该分布将符合平稳时间序列对象的条件。那么，滚动均值是如何计算的呢？首先，我们定义需要计算滚动均值的子集长度（例如，5）。然后，我们通过对序列中的数字以\
  \ 5 个为一组进行平均，来生成我们自己的时间序列。例如，考虑一个具有以下值的时间序列：\n\n*   10, 50, 34, -5, 15, 19, 1, -30,\
  \ 16, 37\n\n那么随后的滚动均值将如下所示：\n\n*   NA, NA, NA, NA, NA, 20.8, 22.6, 12.8, 0, 4.2,\
  \ 8.6\n\n滚动方差的计算同理，只不过在每个实例中计算的是方差而不是均值。\n\n然后，这些滚动均值将被绘制在时间序列图上。然而，通过观察上面的滚动均值，我们可以推断出这些值似乎变化很大，并且完全不是恒定的。因此，上面示例中显示的时间序列不是平稳的。\n\
  \n尽管第一种方法看起来直接且易于实现，但大卫仍在寻找一种统计技术，使他能够验证时间序列对象是否平稳。他的搜索也让他找到了迪基-富勒检验。\n\n#### 迪基-富勒检验\n\
  \n这更像是一种检查时间序列对象是否平稳的统计方法。该检验在其原假设中假设时间序列对象是非平稳的。一旦应用于给定的时间序列对象，迪基-富勒检验会返回不同置信区间下的检验统计量和临界值。如果检验统计量的值低于临界值，则原假设不成立，我们选择备择假设（即时间序列对象是平稳的）。\n\
  \n一旦他知道了使时间序列对象平稳的属性，并在查看了识别它的技术之后，大卫决定检查手头的数据是否平稳。因此，他编写了清单 3-4 中的代码片段。\n\n```\n\
  def evaluate_stationarity(timeseries, t=30):\n#Determing rolling statistics\nrolmean\
  \ = timeseries.rolling(window=t).mean()\nrolstd = timeseries.rolling(window=t).std()\n\
  #Plot rolling statistics:\norig = plt.plot(timeseries, color='blue',label='Original')\n\
  mean = plt.plot(rolmean, color='red', label='Rolling Mean')\nstd = plt.plot(rolstd,\
  \ color='black', label = 'Rolling Std')\nplt.legend(loc='best')\nplt.title('Rolling\
  \ Mean & Standard Deviation')\nplt.show(block=False)\n#Perform Dickey-Fuller test:\n\
  print 'Results of Dickey-Fuller Test:'\ndftest = adfuller(timeseries, autolag='AIC')\n\
  dfoutput = pd.Series(dftest[0:4], index=['Test Statistic','p-value','#Lags Used','Number\
  \ of Observations Used'])\nfor key,value in dftest[4].items():\ndfoutput['Critical\
  \ Value (%s)'%key] = value\nprint dfoutput\nListing 3-4.\nMethod to Evaluate If\
  \ a Time Series Object Is Stationary\n```\n\n对于编程经验不多的大卫来说，编写清单 3-4 中的代码片段并非易事。他知道这个时间序列验证功能会被反复重用。因此，他将代码写在一个函数中，以便在需要时随时使用该功能。他决定记录下他所写的所有代码，以便日后在理解困难时可以查阅。他回忆道：\n\
  \n> 默认情况下，我将窗口大小 't' 初始化为 30，也就是一个月。然后我计算了时间序列对象的滚动均值和滚动标准差。接着，我将时间序列、滚动均值和滚动标准差绘制在一起，将探索性数据分析方法付诸实践。我知道这能让我判断时间序列对象是否平稳。之后，我决定也尝试用于检测的统计检验，并将迪基-富勒检验付诸应用。我确保打印出迪基-富勒检验的输出，并根据置信区间确定临界区间。\n\
  \n现在大卫已经定义了清单 3-4 中的方法，他决定调用它，并将时间序列对象作为参数传递，同时将窗口大小 't' 设置为 15（即两周）。他调用了 `evaluate_stationary`\
  \ 方法，如清单 3-5 所示。\n\n```\nevaluate_stationarity(data_train['Close_Adj'], 15)\nListing\
  \ 3-5.\nUsing the Method to Test If Time Series Object Is Stationary\n```\n\n输出\n\
