  \n图 1-9.\n\n循环模式示意图\n\n#### 趋势\n\n趋势（见图 1-10）是连续变量的长期增加或减少。这种模式随时间可能并非完全线性，但应用平滑处理后，它可以概括为上升或下降方向。\n\
  \n![A432778_1_En_1_Fig10_HTML.gif](img/A432778_1_En_1_Fig10_HTML.gif)\n\n图 1-10.\n\
  \n趋势示意图\n\n埃里克决定测试南希对时间序列概念的理解，于是他让她谈谈对图 1-7 中时间序列图的看法。“你觉得这个时间序列图怎么样？模式是季节性的还是循环的？是季节性的，对吧？”\n\
  \n南希的回答再次让埃里克感到惊讶。她说道：\n\n> 是的，因为模式在固定的时间间隔内重复——即季节性。事实上，我们可以将这个分布拆分成三个分布。一个模式是随时间重复的季节性。第二个是平坦的密度分布。最后，第三个模式是该密度函数上的线条（即峰值）。在进行时间序列预测时，我们可以利用这两个分布对未来时间进行估计，并将它们相加，从而在计算出的置信区间内进行预测。\n\
  \n根据她的推论，南希在统计学选修课上的成绩似乎没有白费。南希还想知道更多问题的答案。因此，她决定用接下来的练习题来挑战读者。\n\n练习题\n\n1.  确定按年份划分的出行次数分布。你看到了特定的模式吗？\
  \  \n2.  确定按月份划分的出行次数分布。你看到了特定的模式吗？  \n3.  确定按天划分的出行次数分布。你看到了特定的模式吗？  \n4.  确定按天划分的出行次数分布。你看到了特定的模式吗？\
  \  \n5.  绘制每日出行次数的频率分布图。\n\n## 度量中心\n\n埃里克认为，均值、中位数和众数等度量有助于对相关特征进行概括性观察。考虑到这一点，他决定向南希讲解度量中心的概念。\n\
  \n### 均值\n\n通俗地说，均值指的是数字的平均值。均值受异常值影响很大，因为异常值引入的偏斜会将均值拉向极端值。\n\n*   符号：\n    * \
  \  μ -> 参数 -> 总体均值\n    *   ![$$ \\overset{\\acute{\\mkern6mu}}{x} $$](img/A432778_1_En_1_Chapter_IEq1.gif)\
  \ -> 统计量 -> 样本均值\n*   均值的规则：\n    *   ![$$ {\\mu}_{a+ bx}=a+b{\\mu}_x $$](img/A432778_1_En_1_Chapter_Equa.gif)\n\
  \n    *   ![$$ {\\mu}_{x+y}={\\mu}_x+{\\mu}_y $$](img/A432778_1_En_1_Chapter_Equb.gif)\n\
  \n在我们的编码示例中，我们将使用 `statistics.mean(data)`。这将返回数据（一个实数序列或迭代器）的样本算术平均值。\n\n均值主要有两种变体。\n\
  \n\n\n#### 算术平均数\n\n算术平均数比几何平均数更简单，因为它是对数值进行平均（即，将所有数值相加，然后除以这些数值的个数）。以十名学生在一次数学考试中的成绩为例：\n\
  \n*   78, 65, 89, 93, 87, 56, 45, 73, 51, 81\n\n计算算术平均数的公式如下：\n\n![$$ mean=\\frac{78+65+89+93+87+56+45+73+51+81}{10}=71.8\
  \ $$](img/A432778_1_En_1_Chapter_Equc.gif)\n\n因此，学生在数学考试中成绩的算术平均数为 71.8。当观测值（即数学成绩）相互独立时，算术平均数最为适用。在此例中，这意味着一名学生的考试成绩不会影响另一名学生在同一考试中的成绩。\n\
  \n#### 几何平均数\n\n正如我们之前所见，算术平均数适用于相互独立的观测值。然而，这并不适用于几何平均数，因为它用于计算相互依赖的观测值的平均数。例如，假设你将储蓄投资于股票五年。每年的收益将再投资于下一年的股票。假设我们在五年中每年的回报率如下：\n\
  \n*   60%, 80%, 50%, -30%, 10%\n\n这些回报率相互依赖吗？是的，没错！为什么？因为下一年的投资是基于前一年获得的资本进行的，因此第一年的亏损意味着下一年可投资的资本减少，反之亦然。所以，是的，我们将计算几何平均数。但如何计算呢？我们将按如下步骤进行：\n\
  \n*   [(0.6 + 1) * (0.8 + 1) * (0.5 + 1) * (-0.3 + 1) * (0.1 + 1)]^(1/5) - 1 = 0.2713\n\
  \n因此，具有这些回报率的投资在第五年末将产生 27.13% 的回报率。观察上述计算，你可以看到我们首先将百分比转换为小数。接着，我们给每个小数加 1，以消除负项带来的影响。然后，我们将所有项相乘，并对结果应用幂运算。所应用的幂是\
  \ 1 除以观测值的个数（本例中为 5）。最后，我们将结果减去 1。进行减法是为了消除最初对每个项加 1 所带来的影响。如果我们没有对每个项（即每年的回报率）加\
  \ 1，那么就不需要进行减 1 的操作。\n\n### 中位数\n\n中位数是与平均数、众数并列的一种中心位置度量，它受数据中异常值的影响较小。当数据中观测值的个数为奇数时，中间的数据点即为中位数。\n\
  \n在本章中，我们将使用 `statistics.median(data)` 来计算中位数。如果数值个数为奇数，该函数返回数值数据的中位数（中间值）；如果数值个数为偶数，则使用“中间两个数的平均值”方法返回中间两个值的平均数。如果数据为空，则会引发\
  \ `StatisticsError`。\n\n### 众数\n\n众数适用于离散或名义性质的数据。众数返回数据集中出现频率最高的观测值。众数不受数据中异常值的影响。\n\
  \n### 方差\n\n方差表示数据点围绕平均数的离散程度。方差大意味着数据高度分散，方差小则表示数据紧密聚集。\n\n1.  符号：\n\n    ![$$\
  \ {\\sigma}_x² $$](img/A432778_1_En_1_Chapter_Equ1.gif)\n\n2.  公式：\n    1.  ![$$\
  \ \\frac{\\sum {\\left(X-\\overset{\\acute{\\mkern6mu}}{X}\\right)}²}{n-1} $$](img/A432778_1_En_1_Chapter_Equd.gif)\n\
  \n    2.  ![$$ {\\sigma}_x²=\\sum {\\left({x}_i-{\\mu}_x\\right)}²{p}_i $$](img/A432778_1_En_1_Chapter_Eque.gif)\n\
  \n3.  为什么方差计算中分母是 n-1？样本方差的平均值往往小于总体方差；因此，自由度被用作转换因子。\n4.  方差规则：\n    1.  ![$$ {\\\
  sigma}_{a+ bx}²={b}²{\\sigma}_x² $$](img/A432778_1_En_1_Chapter_Equf.gif)\n\n  \
  \  2.  ![$$ {\\boldsymbol{\\sigma}}_{\\boldsymbol{x}+\\boldsymbol{y}}²={\\boldsymbol{\\\
  sigma}}_{\\boldsymbol{x}}²+{\\boldsymbol{\\sigma}}_{\\boldsymbol{y}}² $$](img/A432778_1_En_1_Chapter_IEq2.gif)（如果\
  \ X 和 Y 是独立变量）\n\n        ![$$ {\\boldsymbol{\\sigma}}_{\\boldsymbol{x}-\\boldsymbol{y}}²={\\\
  boldsymbol{\\sigma}}_{\\boldsymbol{x}}²+{\\boldsymbol{\\sigma}}_{\\boldsymbol{y}}²\
  \ $$](img/A432778_1_En_1_Chapter_Equg.gif)\n\n    3.  ![$$ {\\boldsymbol{\\sigma}}_{\\\
  boldsymbol{x}+\\boldsymbol{y}}²={\\boldsymbol{\\sigma}}_{\\boldsymbol{x}}²+{\\boldsymbol{\\\
  sigma}}_{\\boldsymbol{y}}²+2\\boldsymbol{r}{\\boldsymbol{\\sigma}}_{\\boldsymbol{x}}{\\\
  boldsymbol{\\sigma}}_{\\boldsymbol{y}} $$](img/A432778_1_En_1_Chapter_IEq3.gif)（如果\
  \ X 和 Y 具有相关性 r）\n\n        ![$$ {\\boldsymbol{\\sigma}}_{\\boldsymbol{x}+\\boldsymbol{y}}²={\\\
  boldsymbol{\\sigma}}_{\\boldsymbol{x}}²+{\\boldsymbol{\\sigma}}_{\\boldsymbol{y}}²+2\\\
  boldsymbol{r}{\\boldsymbol{\\sigma}}_{\\boldsymbol{x}}{\\boldsymbol{\\sigma}}_{\\\
  boldsymbol{y}} $$](img/A432778_1_En_1_Chapter_Equh.gif)\n\n在编程练习中，我们将使用 `statistics.variance(data,\
  \ xbar=None)` 来计算方差。该函数将返回至少包含两个实数值的数列的样本方差。\n\n### 标准差\n\n标准差与方差一样，也衡量数据围绕平均数的离散程度。唯一的区别在于，标准差是方差的平方根。这使得它具有与数据相同的单位，从而便于从洞察中推断解释。标准差受异常值和偏态分布的影响很大。\n\
  \n*   符号：σ\n*   公式：![$$ \\sqrt{\\sigma²} $$](img/A432778_1_En_1_Chapter_IEq4.gif)\n\
  \n我们测量标准差而非方差，是因为：\n\n*   它是正态分布中离散程度的自然度量\n*   与原始观测值具有相同的单位\n\n\n\n### 常数对中心统计量的影响\n\
  \n让我们评估当数据通过引入常数进行变换时，中心统计量会如何变化。我们将评估均值、中位数、四分位距、标准差和方差的结果。首先，我们来看当每个数据点加上或减去一个常数“a”时，这些统计量分别会表现出何种行为。\n\
  \n加法：加上常数 a\n\n*   ![$$ {\\overset{\\acute{\\mkern6mu}}{x}}_{new}=a+\\overset{\\\
  acute{\\mkern6mu}}{x} $$](img/A432778_1_En_1_Chapter_Equi.gif)\n\n*   ![$$ media{n}_{new}=a+\
  \ median $$](img/A432778_1_En_1_Chapter_Equj.gif)\n\n*   ![$$ IQ{R}_{new}=a+ IQR\
  \ $$](img/A432778_1_En_1_Chapter_Equk.gif)\n\n*   ![$$ {s}_{new}=s $$](img/A432778_1_En_1_Chapter_Equl.gif)\n\
  \n*   ![$$ {\\sigma_x²}_{new}={\\sigma}_x² $$](img/A432778_1_En_1_Chapter_Equm.gif)\n\
  \n给每个观测值加上一个常数会影响均值、中位数和四分位距。然而，标准差和方差保持不变。请注意，当数据中的观测值减去一个常数时，也会出现相同的行为。接下来，我们看看当给数据中的每个观测值乘以一个常数（即“b”）时，是否会出现相同的行为。\n\
  \n乘法：乘以常数 b\n\n*   ![$$ {\\overset{\\acute{\\mkern6mu}}{x}}_{new}=b\\overset{\\\
  acute{\\mkern6mu}}{x} $$](img/A432778_1_En_1_Chapter_Equn.gif)\n\n*   ![$$ media{n}_{new}=\
  \ bmedian $$](img/A432778_1_En_1_Chapter_Equo.gif)\n\n*   ![$$ IQ{R}_{new}= bIQR\
  \ $$](img/A432778_1_En_1_Chapter_Equp.gif)\n\n*   ![$$ {s}_{new}= bs $$](img/A432778_1_En_1_Chapter_Equq.gif)\n\
  \n*   ![$$ {\\sigma_x²}_{new}={b}²{\\sigma}_x² $$](img/A432778_1_En_1_Chapter_Equr.gif)\n\
  \n哇！给数据中的每个观测值乘以一个常数，改变了所有五个中心统计量。请注意，当数据中的所有观测值除以一个常数项时，也会产生相同的效果。\n\n在了解了中心度量值的描述后，南希对详细理解行程时长产生了兴趣。因此，埃里克提出了计算平均行程时长和中位行程时长的想法。此外，南希想要确定大多数行程的起始站点，以便为现有客户开展促销活动。因此，埃里克决定确定“from_station_name”字段的众数。\n\
  \n注意\n\n使用统计包计算中心度量值需要将输入的数据结构转换为列表类型。\n\n```\ntrip_duration = list(data['tripduration'])\n\
  station_from = list(data['from_station_name'])\nprint 'Mean of trip duration: %f'%statistics.mean(trip_duration)\n\
  print 'Median of trip duration: %f'%statistics.median(trip_duration)\nprint 'Mode\
  \ of station originating from: %s'%statistics.mode(station_from)\nListing 1-15.\n\
  使用统计包确定中心度量值\n```\n\n输出\n\n```\nMean of trip duration: 1202.612210\nMedian of trip\
  \ duration: 633.235000\nMode of station originating from: Pier 69 / Alaskan Way\
  \ & Clay St\n```\n\n清单 1-15 的输出显示，大多数行程起始于 Pier 69/Alaskan Way & Clay St 站。因此，这是针对现有客户开展促销活动的理想地点。此外，输出结果显示均值大于中位数。南希好奇为什么平均值（即均值）大于中心值（即中位数）。根据她所读到的内容，她意识到这可能是由于中位数之后存在一些极值，或者是因为大多数值位于中位数之后。埃里克决定绘制行程时长的分布图（见清单\
  \ 1-16），以确定哪种假设成立。\n\n```\ndata['tripduration'].plot.hist(bins=100, title='Frequency\
  \ distribution of Trip duration')\nplt.show()\nListing 1-16.\n绘制行程时长直方图\n```\n\n\
  ![A432778_1_En_1_Fig11_HTML.gif](img/A432778_1_En_1_Fig11_HTML.gif)\n\n图 1-11.\n\
  \n行程时长频率分布\n\n图 1-11 中的分布只有一个峰值（即众数）。该分布不对称，并且大多数值位于众数的右侧。这些右侧的极值在数量上可以忽略不计，但它们的极端性质倾向于将均值向自身方向拉拽。这就是均值大于中位数的原因。\n\
  \n图 1-11 中的分布被称为正态分布。\n\n### 正态分布\n\n正态分布，或者说高斯分布，是一种呈钟形的连续概率分布。该分布的一个重要特征是均值位于分布的中心，其周围有散布（即标准差）。正态分布中的大多数观测值位于均值附近，并随着远离均值而逐渐减少。大约\
  \ 68% 的观测值位于距离均值 1 个标准差的范围内；95% 的观测值位于距离均值 2 个标准差的范围内；而 99.7% 的观测值位于距离均值 3 个标准差的范围内。均值为\
  \ 0、标准差为 1 的正态分布被称为标准正态分布。图 1-12 展示了正态分布及其置信区间。\n\n![A432778_1_En_1_Fig12_HTML.gif](img/A432778_1_En_1_Fig12_HTML.gif)\n\
  \n图 1-12.\n\n正态分布与置信水平\n\n以下是最常见的置信水平：\n\n| 置信水平 | 公式 |\n| --- | --- |\n| 68% |\
  \ 均值 ± 1 个标准差 |\n| 95% | 均值 ± 2 个标准差 |\n| 99.7% | 均值 ± 3 个标准差 |\n\n#### 偏度\n\n偏度是衡量不对称性的指标。前面展示的正态分布是对称的，因此没有偏度元素。存在两种类型的偏度（即正偏度和负偏度）。\n\
  \n![A432778_1_En_1_Fig13_HTML.gif](img/A432778_1_En_1_Fig13_HTML.gif)\n\n图 1-13.\n\
  \n偏态与对称的正态分布\n\n从图 1-13 可以看出，对于以下每种变体，中心度量值之间存在关系：\n\n*   对称分布：均值 = 中位数 = 众数\n*\
  \   正偏态：均值 < 中位数 < 众数\n*   负偏态：均值 > 中位数 > 众数\n\n通过图 1-12 你会发现，图 1-13(c) 中的分布在其右侧有一个长尾。这可能是由于存在异常值所致。\n\
  \n\n#### 异常值\n\n异常值是指与大多数观测值显著不同的数值。这些值可能自然产生，也可能因设备故障或录入错误而出现。\n\n为了理解什么是异常值，我们需要查看图\
  \ 1-14。\n\n![A432778_1_En_1_Fig14_HTML.gif](img/A432778_1_En_1_Fig14_HTML.gif)\n\
  \n图 1-14.\n\n使用箱线图说明异常值\n\n从图 1-14 中可以看出，位于须线之外的观测值被称为异常值。\n\n```\n[Q1 – 1.5 (IQR)\
  \ ,  Q3 + 1.5 (IQR) ] (即 IQR = Q3 - Q1)\n代码清单 1-17.\n不被视为异常值的数值区间\n```\n\n不在此区间内的数值被视为异常值。了解\
  \ Q1 和 Q3 的值是进行此计算的基础。\n\n数据集中存在异常值是好事吗？通常不是！那么，我们应该如何处理数据集中的异常值呢？以下是几种最常用的方法：\n\
  \n*   **删除异常值**：只有当异常值与有效值的比例非常低，且数据值不属于时间序列尺度时，才可采用此方法。如果异常值比例较高，删除这些值会损害数据的丰富性，应用模型也无法捕捉到数据内在的真实本质。然而，如果数据具有时间序列性质，删除异常值并不可行，原因在于时间序列模型要有效训练，数据必须在时间上保持连续。在这种情况下删除异常值会在连续分布中引入断裂。\n\
  *   **用均值替换异常值**：另一种方法是取图 1-14 所示区间内数值的均值，计算该均值，并用其替换异常值。这能成功地将异常值转换为与有效观测值一致；然而，这会移除数据集中原本存在的异常点，而这些异常点的发现可能带来有趣的见解。\n\
  *   **转换异常值**：应对异常值的另一种方法是将它们限制在可接受数据的上下边界内。上边界可通过将 Q3 和 IQR 的值代入公式 Q3 + 1.5IQR\
  \ 计算得出，下边界则可通过将 Q1 和 IQR 的值代入公式 Q1 – 1.5IQR 计算得出。\n*   **变量变换**：变换用于将原有的分布转换为正态分布。异常值会给数据带来非正态性，因此对变量进行变换可以减少异常值的影响。变换方法包括但不限于自然对数、将数据转换为比率变量等。\n\
  \n南希很好奇我们的数据集中是否存在异常值——更准确地说，是在 `tripduration` 特征中。为此，埃里克决定首先通过编写代码清单 1-18 中的代码来创建一个箱线图（见图\
  \ 1-15），以直观地查看异常值，然后通过应用代码清单 1-19 中的区间计算方法进行验证。\n\n```\nbox = data.boxplot(column=['tripduration'])\n\
  plt.show()\n代码清单 1-18.\n绘制行程时长的箱线图\n```\n\n![A432778_1_En_1_Fig15_HTML.gif](img/A432778_1_En_1_Fig15_HTML.gif)\n\
  \n图 1-15.\n\n行程时长的箱线图\n\n南希惊讶地发现，从图 1-15 的箱线图中，行程时长存在大量异常值。她问埃里克能否确定行程时长值中异常值的比例。她想知道异常值在数据集中是占很小一部分还是大部分。为此，埃里克编写了代码清单\
  \ 1-19 中的代码。\n\n```\nq75, q25 = np.percentile(trip_duration, [75 ,25])\niqr = q75\
  \ - q25\nprint 'Proportion of values as outlier: %f percent'%(\n(len(data) - len([x\
  \ for x in trip_duration if q75+(1.5*iqr) >=x>= q25-(1.5*iqr)]))*100/float(len(data)))\n\
  代码清单 1-19.\n确定 tripduration 观测值中异常值的比例\n```\n\n输出\n\n```\nProportion of values as\
  \ outlier: 9.548218 percent\n```\n\n埃里克向南希解释了代码清单 1-19 中的代码，内容如下：\n\n> 如图 1-14 所示，Q3\
  \ 指的是第 75 百分位数，Q1 指的是第 25 百分位数。因此我们使用 `numpy.percentile()` 方法来确定 Q1 和 Q3 的值。接着，我们通过两者相减来计算\
  \ IQR。然后，我们应用代码清单 1-18 中指定的区间来确定值的子集。最后，我们使用公式得出异常值的数量。\n\n```\n异常值的数量 = 所有值的长度\
  \ - 所有非异常值的长度\n代码清单 1-20.\n计算异常值数量的公式\n```\n\n在我们的代码中，`len(data)` 确定所有值的长度，而所有非异常值的长度由\
  \ `len([x for x in trip_duration if q75+(1.5*iqr) >=x>= q25-(1.5*iqr)]))` 确定。\n\n\
  因此，随后应用了代码清单 1-20 中的公式来计算被视为异常值的比例。\n\n```\n异常值比例 = (异常值的数量 / 所有值的长度) * 100\n代码清单\
