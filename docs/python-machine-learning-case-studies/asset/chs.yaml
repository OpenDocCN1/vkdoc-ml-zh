  \ 2-18 中非线性的回归最佳拟合线时感到惊讶。\n\n他的理解是，多元线性回归应该产生一条线性线，而不是非线性的最佳拟合线。对此，克莱尔回应如下：\n\n\
  > 分析中的特征数量与图中的维度数量成正比。在我们的案例中，有五个解释变量和一个响应变量，总共六个变量。在六维空间中绘制点是很困难的，因此图 2-18 使用二维来表示。如果我们在六维空间中观察，最佳拟合线本应是线性表示的。\n\
  \n克莱尔指出，由于这个多元回归的 R² 极低，不能使用这个模型来预测响应变量（即混凝土强度）。请注意，R² 极低；因此我们肯定不会继续使用它来回答当前的问题。然而，输出也给出了系数。第一个是\
  \ alpha 系数，随后的是 beta 系数。史密斯和克莱尔都知道数据中存在多重共线性。因此，在寻找适用于多重共线性数据的回归技术时，他们遇到了岭回归，并决定尝试一下。不过，克莱尔认为最好先向史密斯解释一下网格搜索。在继续之前，让我们先探索其他回归模型，以找到最适合我们数据的模型。\n\
  \n\n### 网格搜索\n\n网格搜索采用“拟合”与“评分”的方法，为给定模型确定最佳参数。待调优的模型及其参数和有限可能取值会被传入 `GridSearchCV`。输出结果指明了能使模型达到最佳调优效果的参数值。\n\
  \n在解释了网格搜索之后，克莱尔整理了一份关于岭回归的知识库。\n\n### 岭回归\n\n岭回归在线性最小二乘损失函数的基础上，加入了 L2 范数的正则化项。这种回归方法内置支持接受多个解释变量来预测响应变量。L2\
  \ 是一种向量范数，用于衡量向量的大小。L2 范数是最常被教授和使用的。假设我们有一个向量 ![$$ \\overrightarrow{\\beta} $$](img/A432778_1_En_2_Chapter_IEq10.gif)，它包含两个分量\
  \ β[0] 和 β[1]。其 L2 范数定义如下：\n\n*   公式：![$$ {\\left|\\left|\\overrightarrow{\\beta}\\\
  right|\\right|}_2=\\sqrt{\\beta_0²+{\\beta}_1²} $$](img/A432778_1_En_2_Chapter_IEq11.gif)\n\
  \n这是从原点到这些向量分量（即 β[0] 和 ![$$ {\\beta}_1\\Big) $$](img/A432778_1_En_2_Chapter_IEq12.gif)）的笛卡尔距离。岭回归在以下条件下表现良好：\n\
  \n*   当我们有多个解释变量时\n*   解释变量之间存在多重共线性\n\n多重共线性会导致有偏估计量，因为经过多次迭代计算后，贝塔系数会异常增大。这引出了一个问题：哪次迭代的最佳系数才是真实的？由于估计量现在存在偏差，对多次迭代的系数取平均值无法得到总体系数。然而，这些系数内部的方差不会太高，因此有助于更好地理解这些系数。为了避免贝塔值过大，我们需要对贝塔的最大值施加约束。因此，我们可以用数学方式将岭回归定义如下：\n\
  \n*   公式：![$$ \\underset{\\overrightarrow{\\beta}}{\\mathit{\\min}}{\\left|\\left|\\\
  overrightarrow{y}-A\\overrightarrow{B}\\right|\\right|}_2² $$](img/A432778_1_En_2_Chapter_IEq13.gif)\
  \ 满足条件 ![$$ \\vee \\overrightarrow{\\beta}{\\vee}_2²\\le {c}² $$](img/A432778_1_En_2_Chapter_IEq14.gif)\
  \ 或\n\n![$$ \\underset{\\overrightarrow{\\beta}}{\\mathit{\\min}}{\\left|\\left|\\\
  overrightarrow{y}-A\\overrightarrow{B}\\right|\\right|}_2²+\\lambda \\vee \\overrightarrow{\\\
  beta}{\\vee}_2² $$](img/A432778_1_En_2_Chapter_Equd.gif)\n\n在岭回归中，由于我们选择的是 L2 范数，贝塔值的约束形状是一个圆形，如图\
  \ 2-19 所示。之前我们对数据应用了简单线性回归和多元线性回归。然而，岭回归、套索回归和弹性网络回归更适用于多元回归，因此它们将成为我们分析的首选。\n\n\
  ![A432778_1_En_2_Fig19_HTML.gif](img/A432778_1_En_2_Fig19_HTML.gif)\n\n图 2-19.\n\
  \n岭回归的表示\n\n现在史密斯理解了岭回归，他很想知道它如何利用现有的解释变量来预测混凝土强度。正如我们之前读到的，岭回归支持接受多个解释变量作为输入；因此，克莱尔决定运行一个多元岭回归，如代码清单\
  \ 2-11 所示。图 2-20 显示了结果。\n\n```\nalphas = np.arange(0.1,5,0.1)\nmodel = Ridge()\n\
  cv = GridSearchCV(estimator=model, param_grid=dict(alpha=alphas))\ny_pred = cv.fit(x_train,\
  \ y_train).predict(x_test)\nplt.scatter(range(len(y_test)), y_test,  color='black')\n\
  plt.plot(y_pred, color='blue', linewidth=3)\nprint 'Features: %s'%str(features)\n\
  print 'R2 score: %f'%r2_score(y_test, y_pred)\nprint 'Intercept: %f'%regr.intercept_\n\
  print 'Coefficients: %s'%str(regr.coef_)\n代码清单 2-11.\n计算多元岭回归\n```\n\n输出\n\n![A432778_1_En_2_Fig20_HTML.gif](img/A432778_1_En_2_Fig20_HTML.gif)\n\
  \n图 2-20.\n\n多元岭回归图\n\n```\nFeatures:      ['cement_component', 'flay_ash', 'water_component',\
  \ 'superplasticizer', 'coarse_aggregate']\nR2 score:      0.097982\nIntercept: \
  \    77.802791\nCoefficients:  [0.04531335  0.01168227 -0.13620573  0.24324622 -0.03297459]\n\
  ```\n\n史密斯理解代码清单 2-11 中的代码并没有太大困难，因为它与代码清单 2-10 中的代码相似。他唯一不理解的是网格搜索是如何被应用到实际中的。于是克莱尔开始解释与\
  \ `GridSearchCV` 相关的这段代码。她首先指向 `alphas = np.arange(0.1,5,0.1)`，这行代码用于生成一个值在 0.1\
  \ 到 5 之间、步长为 0.1 的数组。这个数组连同岭回归模型一起被输入到 `GridSearchCV` 中。因此，`GridSearchCV` 会逐一尝试\
  \ alpha 的值，以确定最能微调模型的那个值。\n\n理解了代码清单 2-11 中的代码后，史密斯提出了一个问题：应用岭回归后，R² 是否表现更好？对此，克莱尔说了以下内容：\n\
  \n> 完全没有，因为它完全相同，系数也是如此。其原因可能是，在存在多个特征和多重共线性的情况下，线性回归倾向于偏向 L2 范数，而 L2 范数正是岭回归所使用的正则化项，因此两者具有相似性。此外，还要注意我们在方法中使用了网格搜索来优化\
  \ alpha。那么 alpha 到底是什么？alpha 是一个正则化参数，用于在岭回归中加权 L2 范数项。alpha 值为 0 会将岭回归模型转换为普通最小二乘回归模型。因此，alpha\
  \ 值越高，平滑度约束越强，系数的幅度就越小。alpha 值的影响如图 2-21 所示。\n> \n> ![A432778_1_En_2_Fig21_HTML.gif](img/A432778_1_En_2_Fig21_HTML.gif)\n\
  > \n> 图 2-21.\n> \n> alpha 值对回归拟合线平滑度的影响\n\n即使在调整参数后，岭回归也没有比多元线性回归带来任何改进。克莱尔认为，将正则化项从\
  \ L2 范数改为 L1 范数可能会给 R² 分数带来一些改进。因此，她决定尝试套索回归，并在接下来的章节中对其进行了描述。\n\n\n\n### 套索回归\n\
  \n与岭回归相反，套索回归使用 L1 范数。套索回归的 L1 范数定义如下：\n\n*   公式：![$$ {\\left|\\left|\\overrightarrow{\\\
  beta}\\right|\\right|}_1=\\left|{\\beta}_0\\right|+{\\beta}_1\\vee $$](img/A432778_1_En_2_Chapter_IEq15.gif)\n\
  \n从数学角度，我们将套索回归定义如下：\n\n*   公式：![$$ \\underset{\\overrightarrow{\\beta}}{\\mathit{\\\
  min}}{\\left|\\left|\\overrightarrow{y}-A\\overrightarrow{B}\\right|\\right|}_2²\
  \ $$](img/A432778_1_En_2_Chapter_IEq16.gif) 满足条件 ![$$ \\vee \\overrightarrow{\\\
  beta}{\\vee}_1\\le c $$](img/A432778_1_En_2_Chapter_IEq17.gif) 或\n*   ![$$ \\underset{\\\
  overrightarrow{\\beta}}{\\mathit{\\min}}{\\left|\\left|\\overrightarrow{y}-A\\overrightarrow{B}\\\
  right|\\right|}_2²+\\lambda \\vee \\overrightarrow{\\beta}{\\vee}_1 $$](img/A432778_1_En_2_Chapter_Eque.gif)\n\
  \n由于我们之前选择的岭回归是 L2 范数，因此 beta 值的约束形状是一个圆形。然而，在采用 L1 范数的套索回归中，beta 的约束形状是一个菱形（见图\
  \ 2-22）。\n\n![A432778_1_En_2_Fig22_HTML.gif](img/A432778_1_En_2_Fig22_HTML.gif)\n\
  \n图 2-22.\n\n套索回归的表示\n\n考虑到这个菱形位于第一象限 x 轴上的边缘，我们可以看到其坐标为 (c,0)。上方的等高线在 (0,c) 处与菱形相切，这意味着我们得到了\
  \ β [1] 的值，而没有得到 β [2] 的值。因此，将以下内容代入方程将导致与 β [1] 相关的解释变量变为 0。因此，在整个过程中，套索回归最终只会保留少数几个解释变量，而相比之下，岭回归的形状是圆形，会包含数据集中的所有解释变量。\n\
  \n史密斯预计这里的 R² 会有所改善，因为他认为只精选少数几个解释变量而忽略其余变量可以使模型更强大。因此，克莱尔测试了该模型，如代码清单 2-12 所示。\n\
  \n```\nmodel = Lasso()\ncv = GridSearchCV(estimator=model, param_grid=dict(alpha=alphas))\n\
  y_pred = cv.fit(x_train, y_train).predict(x_test)\nplt.scatter(range(len(y_test)),\
  \ y_test,  color='black')\nplt.plot(y_pred, color='blue', linewidth=3)\nprint 'Features:\
  \ %s'%str(features)\nprint 'R2 score: %f'%r2_score(y_test, y_pred)\nprint 'Intercept:\
  \ %f'%regr.intercept_\nprint 'Coefficients: %s'%str(regr.coef_)\n代码清单 2-12.\n计算多元套索回归\n\
  ```\n\n输出\n\n```\nFeatures:      ['cement_component', 'flay_ash', 'water_component',\
  \ 'superplasticizer', 'coarse_aggregate']\nR2 score:      0.103610\nIntercept: \
  \    77.802791\nCoefficients:  [0.04531335 0.01168227 -0.13620573 0.24324622 -0.03297459]\n\
  ```\n\n史密斯注意到套索回归的表现优于多元岭回归和线性回归（图 2-23）。\n\n![A432778_1_En_2_Fig23_HTML.gif](img/A432778_1_En_2_Fig23_HTML.gif)\n\
  \n图 2-23.\n\n多元套索回归图\n\n然而，根据克莱尔的说法，0.1 的 R² 非常低，不足以用来推断响应变量。此外，她指出，与岭回归一样，这里再次使用了网格搜索来优化\
  \ alpha 项。\n\n由于到目前为止没有取得重大成功，克莱尔决定引入回归模型中的最佳方案。弹性网络融合了这两种方法（即岭回归和套索回归）的优点。\n\n\
  ### 弹性网络\n\n弹性网络克服了套索回归中发现的局限性（即惩罚函数）。套索倾向于只选择部分解释变量，并且对于多重共线性的解释变量组，它只会从该组中选择一个。为了避免这种情况，明智的做法是在惩罚项中添加一个二次部分（即岭回归中存在的\
  \ ![$$ {\\left|\\left|\\beta \\right|\\right|}²\\Big) $$](img/A432778_1_En_2_Chapter_IEq18.gif）。因此，弹性网络所做的是包含套索回归和岭回归惩罚项的凸组合。\n\
  \n克莱尔编写了代码清单 2-13 中的代码，尝试对数据应用多元弹性网络回归。\n\n```\nmodel = ElasticNet()\ncv = GridSearchCV(estimator=model,\
  \ param_grid=dict(alpha=alphas))\ny_pred = cv.fit(x_train, y_train).predict(x_test)\n\
  plt.scatter(range(len(y_test)), y_test,  color='black')\nplt.plot(y_pred, color='blue',\
  \ linewidth=3)\nprint 'Features: %s'%str(features)\nprint 'R2 score: %f'%r2_score(y_test,\
  \ y_pred)\nprint 'Intercept: %f'%regr.intercept_\nprint 'Coefficients: %s'%str(regr.coef_)\n\
  代码清单 2-13.\n计算多元弹性网络回归\n```\n\n输出\n\n![A432778_1_En_2_Fig24_HTML.gif](img/A432778_1_En_2_Fig24_HTML.gif)\n\
  \n图 2-24.\n\n多元弹性网络回归图\n\n```\nFeatures:      ['cement_component', 'flay_ash', 'water_component',\
  \ 'superplasticizer', 'coarse_aggregate']\nR2 score:      0.099785\nIntercept: \
  \    77.802791\nCoefficients:  [0.04531335  0.01168227 -0.13620573  0.24324622 -0.03297459]\n\
  ```\n\n克莱尔对这个模型的结果感到失望（图 2-24）。她回忆道：\n\n> 这里的交叉验证结果似乎比套索回归要低。正如我们之前读到的，套索似乎会考虑一部分解释变量；因此，弹性网络试图将两者结合起来的努力反而抵消了套索单独使用时的优势。这就是我们在当前数据上观察到的行为，但请注意，这并非对所有问题集都普遍适用。\n\
  \n史密斯很好奇是否存在某种技术可以迭代地提高回归模型的准确性。克莱尔知道答案（即梯度提升回归）。\n\n\n\n### 梯度提升回归\n\n由分类或回归树模型组成的集成方法会汇聚成一个梯度提升模型（见图\
