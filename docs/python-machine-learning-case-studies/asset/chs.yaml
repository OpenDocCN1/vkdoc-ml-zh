  \n### 变量类型\n\nNancy 决定更进一步，为数据集中的每个特征分配数据类型。\n\n表 1-4.\n\nNancy 将变量分类为数据类型的方法\n\n\
  | 特征名称 | 变量类型 |\n| --- | --- |\n| `trip_id` `bikeid` `tripduration` `from_station_id`\
  \ `to_station_id` `birthyear` | 数字 |\n| `Starttime` `Stoptime` | 日期 |\n| `from_station_name\
  \ to_station_name` `Usertype` `Gender` | 文本 |\n\n查看表 1-4 中的特征分类后，Eric 注意到 Nancy\
  \ 正确识别了数据类型，因此对他来说，解释变量类型的含义似乎是一件容易的事。Eric 回忆起他曾解释过以下内容：\n\n> 在日常与数据交互中，我们通常将数字表示为整数，文本表示为字符串，真/假表示为布尔值等。这些就是我们所说的数据类型。但机器学习中的术语更为细致，它将我们之前了解的数据类型细分为变量类型。理解这些变量类型对于在进行探索性数据分析或决定将哪种合适的机器学习算法应用于我们的数据时选择图表类型至关重要。\n\
  \n#### 连续/定量变量\n\n连续变量在给定范围内可以有无限多个值。与离散变量不同，它们是不可数的。在探索连续变量的类型之前，让我们先理解什么是真正的零点。\n\
  \n##### 真正的零点\n\n如果某个测量尺度具有真正的零点，那么值为 0 意味着你什么都没有。以表示购买的纸杯蛋糕数量的比率变量为例。值为 0 表示你连一个纸杯蛋糕都没买。真正的零点是区分定距变量和比率变量的关键因素。\n\
  \n现在让我们探索不同类型的连续变量。\n\n##### 定距变量\n\n定距变量存在于本质上是连续的且具有数值的数据中。以每天测量的某个社区的温度为例。间隔之间的差异保持不变，例如\
  \ 70 摄氏度和 50 摄氏度之间的差异与 80 摄氏度和 100 摄氏度之间的差异相同。我们可以计算定距变量的平均值和中位数，但它们没有真正的零点。\n\n\
  ##### 比率变量\n\n定距变量的属性与比率变量非常相似，区别在于比率变量中，0 表示该测量值不存在。以某个社区汽车行驶的距离为例。摄氏温度是一个定距变量，因此值为\
  \ 0 摄氏度并不意味着没有温度。然而，请注意，值为 0 公里表示汽车没有行驶距离，因此被视为比率变量。此外，顾名思义，测量的比率也可以使用，例如行驶 50 公里的距离是汽车行驶\
  \ 25 公里距离的两倍。\n\n#### 离散变量\n\n离散变量在给定范围内具有有限的值集。与连续变量不同，它们是可数的。让我们看一些本质上是分类的离散变量的例子。\n\
  \n##### 定序变量\n\n定序变量的值按从低到高或从高到低的顺序排列。这些定序变量内部的层级之间可以有不等的间距。例如，以下层级：\n\n1.  小学\n\
  2.  中学\n3.  学院\n4.  大学\n\n小学和中学之间的年数差异肯定不等于中学和学院之间的差异。如果这些差异是恒定的，那么这个变量也有资格成为定距变量。\n\
  \n##### 定类变量\n\n定类变量是没有内在顺序的分类变量；然而，层级之间存在恒定的差异。定类变量的例子可以是性别、一年中的月份、制造商发布的汽车等。以一年中的月份为例，每个月都是一个不同的层级。\n\
  \n##### 二分变量\n\n二分变量是只有两个类别或层级的定类变量。例子包括：\n\n*   年龄：24 岁以下，24 岁以上\n*   性别：男，女\n\n\
  #### 潜在变量\n\n潜在变量不属于解释变量（即自变量）或响应变量（即因变量），但可能影响对这些变量之间关系的解释。例如，如果我们想根据申请人的性别预测他/她是否能被大学录取。在这种情况下，一个可能的潜在变量可以是申请人寻求录取的院系名称。\n\
  \n#### 人口统计变量\n\n人口统计学（源自希腊语，意为“描述人民”）是对人口的研究。该学科考察人口的规模和构成，以及人口从一个地方到另一个地方的流动。人口统计学家还分析人口增长及其控制的影响。人口统计变量是研究人员收集的变量，用于描述用于推断统计的样本的性质和分布。在应用统计学和研究中，这些变量包括年龄、性别、种族、社会经济指标和群体成员身份等。\n\
  \n\n\n#### 因变量与自变量\n\n自变量也被称为解释变量，因为它用于解释或预测因变量（也称为响应变量或结果变量）。\n\n结合数据集来看，哪些是因变量和自变量？假设共享单车系统的管理层找到你，要求你构建一个系统来提前预测行程时长，以确保单车供应充足。在这种情况下，你的因变量是什么？显然是行程时长。那么自变量又是什么？这些变量将包含我们认为影响因变量的特征（例如，用户类型、性别以及具体时间和日期）。\n\
  \n埃里克让南希根据他刚刚解释的变量类型对特征进行分类。\n\n表 1-5.\n\n南希将变量分类为变量类型的方法\n\n| 特征名称 | 变量类型 |\n|\
  \ --- | --- |\n| `trip_id` `bikeid` `tripduration` `from_station_id` `to_station_id`\
  \ `birthyear` | 连续型 |\n| `Starttime` `Stoptime` | 日期时间型 |\n| `from_station_name\
  \ to_station_name` | 字符串型 |\n| `Usertype gender` | 名义型 |\n\n南希现在对机器学习中的变量类型有了清晰的认识，也知道了哪些特征属于哪种变量类型（见表\
  \ 1-5）。然而，尽管查看了每个特征的初始观测值（见表 1-2），她仍然无法推断出每个表格所包含信息的深度和广度。她向埃里克提到了这一点，而作为数据分析专家的埃里克给出了答案：对数据集中的特征进行单变量分析。\n\
  \n### 单变量分析\n\n单变量一词源于“uni”，意为单一。这是对单个变量进行的分析，因此不涉及解释变量之间的任何关系。\n\n埃里克决定对数据集进行单变量分析，以便更好地单独理解各个特征（见代码清单\
