  \n## 对时间序列建模\n\n在应用不同的时间序列模型之前，大卫认为最好先理解许多模型所使用的基本概念。经过研究，他整理了对自回归项数 (AR)、移动平均项数\
  \ (MA) 和差分次数 (D) 含义的解释。他认为这些术语很重要，因为它们构成了时间序列模型的预测方程。\n\n*   **自回归 (AR) 项数或 p**：AR\
  \ 项是响应变量的滞后值。例如，取 p = 5。那么，为了预测 t5 时刻的响应变量，t0 到 t4 之间的时间序列将被视为解释变量。\n*   **移动平均\
  \ (MA) 项数或 q**：MA 项是响应变量中滞后的预测误差。例如，取 q = 5。那么，为了预测 t5 时刻的响应变量，将考虑 t0 到 t4 之间的时间序列。因此，这表示该时刻移动平均值与实际值之间的差异。\n\
  *   **差分次数 (d)**：这指的是我们希望对时间序列对象应用的差分阶数。\n\n给定时间序列模型的参数书写如下：p, d, q。一旦理解了时间序列技术的通用参数，大卫决定整理一份用于衡量预测时间序列准确性的统计检验列表。\n\
  \n### 验证预测序列的检验\n\n经过适当的研究，大卫了解到一些最著名的用于衡量预测时间序列准确性的检验方法。\n\n#### 平均预测误差\n\n这是每个时间点残差的平均值。平均预测误差的取值范围可以从负无穷大到正无穷大。\n\
  \n#### 平均绝对误差\n\n平均绝对误差与平均预测误差相同，只是残差被转换为绝对值；也就是说，正残差保持不变，而负残差则转换为正数。其取值范围介于 0 和正无穷大之间。\n\
  \n#### 残差平方和\n\n残差平方和 (RSS) 通常用于回归分析，以了解回归模型未能解释的方差比例。其计算方法是：计算每个时间点的残差，取其平方，然后求和。对残差进行平方可确保结果为正数。RSS\
  \ 的最小值为 0，表示时间序列模型已最大程度地估计了方差。\n\n#### 均方根误差\n\n均方根误差 (RMSE)，也称为均方根偏差 (RMSD)，是 RSS\
  \ 的进阶版本，它对 RSS 的输出结果应用了平方根。\n\n大卫现在对 p、q 和 d 这些术语的含义有了相当清晰的认识。然而，他不确定在将时间序列模型中的这些参数传入时，每个参数应该取什么值。他的搜索发现了一些规则，这些规则根据\
  \ ACF 和 PACF 中的模式来决定 p、q 和 d 的值。\n\n\n\n### 确定建模参数\n\nDavid 计划查看经过对数变换和差分处理的时间序列的\
