  \n搜索引擎将用户的输入查询作为参数，从信息检索系统中对文档进行聚类。因此，搜索结果会按这些聚类文档的排序顺序呈现。\n\n### 基于人口统计的客户细分\n\n\
  聚类也应用于营销领域——更具体地说，是品牌领域。营销研究主管使用聚类来发现客户细分以及他们品牌和竞争对手品牌的感知图。通过这种方式，他们可以了解自己品牌的定位以及所服务的客户细分市场。这有助于品牌确定要瞄准的客户画像，包括现有客户和潜在客户，以及他们的人口统计特征。\n\
