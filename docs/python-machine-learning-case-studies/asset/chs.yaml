  \ 1-7 中的明确模式。\n\n#### 季节性模式\n\n季节性模式（见图 1-8）指的是在固定的已知周期后出现的季节性效应。这个周期可以是月中的周、年中的周、年中的月、年中的季度等。这就是为什么季节性时间序列也被称为周期性时间序列。\n\
