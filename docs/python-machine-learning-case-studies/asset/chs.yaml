  \n### 主成分分析\n\nPCA 通过正交变换，将一组高度相关的观测值转换为一组线性不相关的变量，称为主成分。这种变换的目的是使第一个主成分具有最大的方差。\n\
  \n![A432778_1_En_4_Fig6_HTML.gif](img/A432778_1_En_4_Fig6_HTML.gif)\n\n图 4-6.\n\n\
