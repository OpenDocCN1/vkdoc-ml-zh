- "# 3. 时间序列\n\n本章的目标是让你入门时间序列预测。时间序列预测与回归的不同之处在于，时间充当解释变量，并且应在相等的时间间隔内保持连续。本章将涵盖平稳性的概念、其重要性，以及检查时间序列对象中是否存在平稳性的方法。将应用几种时间序列模型，并使用最有效的评估技术来检查它们的预测结果。\n\
  \n注意\n\n本书采用 Python 2.7.11 作为编码示例的事实标准。此外，你需要安装该版本以完成练习。\n\n\n\n## 案例研究：预测雅虎每日调整收盘价\n\
  \n大卫第二天与客户珍妮丝安排了会议。他们将讨论珍妮丝投资收益下滑的原因。珍妮丝是一位百万富翁商人的女儿，在听闻市场有望随经济形势好转而增长的传言后，她找到了大卫。她有意采取长期高风险投资策略，以享受潜在的高额投资回报。然而本季度，尽管资本市场前景良好，她的收益却出现了下滑。\n\
  \n大卫查看了珍妮丝的投资组合，开始逐一分析每只股票在上季度的表现。他发现投资组合收益与预期收益不匹配的原因，在于雅虎股票预测存在巨大残差。如果该股票数量在整个投资组合中占比很小，这种预测误差的影响本可忽略不计，但当前情况并非如此。\n\
  \n大卫回想起在哈佛商学院学习公司金融和商业分析课程时的内容，决定尝试运用这些概念来寻找解决方案。他应该使用回归分析还是时间序列分析？哪些技术可以应用于雅虎股票的预测？\n\
  \n大卫从 Python 提供的 Matplotlib 金融数据包中提取了雅虎股票数据（代码片段见清单 3-2）。\n\n大卫进行了一些研究，以了解数据中每个特征包含的信息。他为雅虎股票价格数据集整理了一份数据字典（见表\
