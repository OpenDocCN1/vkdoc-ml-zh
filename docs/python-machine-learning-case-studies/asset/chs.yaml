  \n### 相关性\n\n克莱尔首先决定查看是否有任何探索性变量与响应变量（即混凝土强度）相关。这个问题对她来说至关重要，因为她相信两个定量实体之间的高相关性可以产生更优的最佳拟合线性回归线。因此，她有兴趣确定这些定量变量之间关系的强度和方向。为此，她编写了代码清单\
