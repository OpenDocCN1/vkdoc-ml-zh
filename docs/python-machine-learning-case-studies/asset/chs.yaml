  \n尽管罗斯已经解决了手头的问题，但他仍对聚类在现实世界中的应用感兴趣。\n\n## 聚类的应用\n\n聚类在多个研究领域都有广泛的应用。\n\n### 疾病识别\n\
  \n![A432778_1_En_4_Fig16_HTML.gif](img/A432778_1_En_4_Fig16_HTML.gif)\n\n图 4-16.\n\
