  \ Status 的情况一样，树将有一个父节点和两个子节点（即出现和未出现）。在搜索分类模型时，她发现了一种可视化表示：决策树分类。\n\n\n\n### 决策树分类\n\
  \n决策树以分层方式形成一棵树，每个节点都有一个决策边界，用于向下推进。当无法再进行任何分裂时，树便停止分支。内部节点代表输入变量，并连接到每个子节点。子节点对输入变量的值进行分割。它们通过在每一层对数据进行划分来实现这一点，节点分支到子节点。这种行为被称为递归划分。决策树易于解释且时间效率高，因此可以很好地处理大型数据集。决策树还可以处理数值型和分类型数据，即数值型数据用于回归，分类型数据用于分类。然而，决策树的准确性不如其他机器学习分类算法产生的效果好。\n\
  \n此外，决策树对训练数据集的泛化程度很高，因此极易过拟合。决策树旨在对数据进行划分，使得每个划分后的实例具有相似/同质的值。ID3 算法用于计算样本的同质性，如果样本完全同质，则其熵为\
  \ 0，值为 1，反之亦然。决策树是一种参数化监督学习方法，所谓参数化，是指它可以应用于任何数据，无论其底层分布如何。\n\nJudy 博士编写了清单 5-26\
  \ 中的代码，在训练数据集上训练决策树分类模型。她使用了清单 5-25 中的测试-训练分割变量（即 y_test、y_train、x_test、x_train）。\n\
