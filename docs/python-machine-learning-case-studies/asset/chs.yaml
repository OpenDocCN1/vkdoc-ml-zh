  \ AR 和 MA 模型，希望能得到一个更稳健的模型来预测雅虎股票。\n\n\n\n### 组合模型\n\n组合模型是指自回归（AR）与移动平均（MA）的结合。该模型将包含全部三个参数——p、d\
  \ 和 q，并初步定义为 ARIMA——ARIMA(p, d, q)。组合模型意味着所有参数都将被纳入考量。David 预期残差平方和（RSS）会降低，因此他毫不迟疑地应用了组合模型，如代码清单\
  \ 3-20 所示，参数值设定为 p = 1、d = 1、q = 1。\n\n![A432778_1_En_3_Fig20_HTML.gif](img/A432778_1_En_3_Fig20_HTML.gif)\n\
