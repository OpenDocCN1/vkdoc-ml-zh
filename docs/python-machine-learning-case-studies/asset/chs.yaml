  \n## 判断时间序列是否存在自相关的检验\n\n自相关是当前时间序列与其滞后版本之间的相关性。在阅读关于自相关的文献时，David 了解到自相关存在两种变体。\n\
  \n### 自相关函数\n\n自相关函数（ACF）确定时间序列与其滞后版本之间的相关性。例如，对于包含十个观测值且滞后为 5 的数据，将计算以下序列之间的相关性：\n\
  \n*   t4, t5, t6, t7, t8, t9\n*   t0, t1, t2, t3, t4, t5\n\n### 偏自相关函数\n\n偏自相关函数（PACF）也衡量时间序列与其滞后版本之间的相关性，但它会消除先前比较中已经解释过的变化。例如，在我们的例子中，对于滞后为\
  \ 5 的情况，它会移除 t0 和 t3 之间已经捕获的变化。\n\n既然 David 知道了什么是自相关，他的下一步就是确定可用于在应用了差分的对数变换时间序列中测量自相关的方法。\n\
  \n\n\n### 测量自相关\n\n大卫取得了一些成功，因为他找到了一种统计方法，用于测量对数转换后时间序列中的自相关性（即德宾-沃森统计量）。\n\n####\
  \ 德宾-沃森统计量\n\n与自相关相关图不同，德宾-沃森统计量更像是一种确定数据中是否存在自相关的统计方法。它通过计算统计回归分析中残差的自相关性来实现这一点。该统计量返回一个介于\
  \ 0 和 4 之间的数值，其中 0 表示强正自相关，4 表示强负自相关，而 2 则表示完全不存在自相关。\n\n在研究自相关时，大卫回想起他曾读到过，差分法可用于消除\
  \ ACF 和 PACF。由于已经对对数转换后的时间序列对象应用了差分法，大卫预期不会出现 ACF 和 PACF。他首先计划使用清单 3-16 中的德宾-沃森统计方法来检查自相关的存在性。\n\
  \n```\nsm.stats.durbin_watson(data_log_diff)\n清单 3-16.\n计算对数转换差分后时间序列的德宾-沃森统计量\n\
  ```\n\n输出\n\n```\n2.1859293629518555\n```\n\n看到结果接近 2，大卫非常兴奋，这表明在对数转换差分后的时间序列中不存在自相关。然而，他很好奇，在没有自相关的情况下，ACF\
