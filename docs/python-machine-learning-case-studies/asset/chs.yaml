  \ (MSS.CoMSS) 的计算方法”。通过查看表 4-4 中的矩阵，罗斯推断这篇论文属于 HSO 分组，并且不属于其他任何分组。\n\n既然他知道了什么是聚类，并且已经将数据转换为适合应用的形式，那么是时候应用聚类建模了。然而，首先他必须确定评估指标，以便评估聚类模型的优劣。与可用于评估回归和分类模型的技术相反，可用于统计评估聚类模型优劣的技术并不多。原因在于，在回归和分类中，已经有标记数据可用于训练模型。但聚类的情况并非如此。\n\
  \n### 评估聚类模型的指标\n\n经过一番研究，罗斯了解到没有单一的方法可以评估聚类模型的输出。他遇到了两种使其有效的方法。第一种更偏向技术性。它认为，如果每个聚类内的方差得到最大程度的解释，聚类内的对象具有相似的属性，并且聚类之间彼此远离，那么聚类模型就足够好。第二种方法则认为，如果聚类定义在直觉上有意义，那么模型就是强大的。\n\
  \n罗斯现在对聚类以及评估其优劣的方法有了清晰的理解。因此，他开始寻找在相关应用中效果最好的聚类模型。经过深入研究，他提出了几种聚类模型。\n\n## 聚类模型\n\
  \n罗斯决定从事实上的聚类算法（即 k-means 聚类）开始。对罗斯来说，在将其应用于手头的数据集之前，理解聚类收敛的方法至关重要。因此，他整理了对 k-means\
  \ 聚类算法的解释。\n\n### k-Means 聚类\n\nk-means 聚类将数据空间划分为 Voronoi 单元表示。这种转换将数据观测值划分为 k\
  \ 个聚类，其中每个观测值属于具有最近均值的聚类。k-means 聚类的执行步骤如下：\n\n1.  随机选择 k 个质心。\n2.  将每个观测值与最近的质心绑定。\n\
  3.  通过计算每个聚类内观测值的均值，重新计算每个聚类的新质心。\n4.  重复步骤 2。\n\n你可能会注意到步骤 1 和步骤 3 相似，区别在于步骤 1\
  \ 中质心是随机选择的，而步骤 3 中是通过计算每个聚类内观测值的均值得到的。\n\n然后步骤 2 和步骤 4 是相同步骤的重复。步骤 3 和步骤 4 会迭代，直到聚类收敛——即数据集中所有观测值的聚类隶属关系保持不变。这最大化了聚类之间的距离，并最小化了每个聚类内观测值之间的距离。k-means\
  \ 聚类在最小化全局目标函数时并不总能找到最优配置。该聚类算法对聚类中心的初始选择高度敏感。\n\n罗斯现在完全理解了 k-means 聚类算法中收敛是如何执行的。然而，他对于\
  \ k 的值（即他应该预先指定的聚类数量）对于手头的数据来说多少才是最优的毫无头绪。他记得曾在 LinkedIn 上看到过一篇关于 k-means 聚类的文章。于是他搜索了发布那篇文章的人，并给他发消息寻求帮助。他的联系人波拉克建议罗斯使用以下方法：\n\
  \n*   肘部法\n*   方差解释\n*   BIC 分数\n\n他开始研究肘部法的工作原理，然后应用它来找到对模型最优的聚类数量。\n\n\n\n####\
  \ 肘部法则\n\n罗斯提出的肘部法则，是指将解释的方差百分比表示为聚类数量的函数。它用于确定新增加的聚类能贡献多少边际方差。值得关注的一点是，第一个聚类会解释最大方差，而随着每个新聚类的加入，边际增益会逐渐下降。肘部就是这样一个点：当新增一个聚类时，边际方差会出现显著下降，该点对应的聚类数量即为最优值。罗斯决定将肘部法则应用于经过矩阵变换的数据集。\n\
  \n![A432778_1_En_4_Fig2_HTML.gif](img/A432778_1_En_4_Fig2_HTML.gif)\n\n图 4-2.\n\
  肘部法则曲线，表示为聚类数量的函数\n\n```\nmatrix, x_cols = matrix_from_df(data_train)\nX = matrix[x_cols]\n\
  K = range(1,50)\nKM = [KMeans(n_clusters=k).fit(X) for k in K]\ncentroids = [k.cluster_centers_\
  \ for k in KM]\nD_k = [cdist(X, cent, 'euclidean') for cent in centroids]\ndist\
  \ = [np.min(D,axis=1) for D in D_k]\navgWithinSS = [sum(d)/X.shape[0] for d in dist]\n\
  fig = plt.figure()\nax = fig.add_subplot(111)\nax.plot(K, avgWithinSS, 'b*-')\n\
  plt.grid(True)\nplt.xlabel('Number of clusters')\nplt.ylabel('Average within-cluster\
  \ sum of squares')\nplt.title('Elbow for KMeans clustering')\n代码清单 4-8.\n在数据矩阵上应用肘部法则与方差解释\n\
  ```\n\n在代码清单 4-8 中，罗斯回忆说，他训练了 49 个 k-means 聚类模型，每个模型的 k 值从 1 到 50 各不相同。然后，他获取了这些聚类模型的聚类中心，并逐个模型地确定了每篇研究论文的聚类归属。最后，对于每个模型，他计算了所有研究论文的平方和，再除以研究论文的总数，得到平均簇内平方和。接着，他将这\
  \ 49 个聚类模型的簇内平方和绘制在图 4-2 中，以形成肘部法则。\n\n在查看图 4-2 时，罗斯推断肘部出现在 k = 9 处。然而，除非有不止一种方法都收敛到相同的聚类数量，否则他并不完全信服。因此，他转而研究方差解释。\n\
  \n#### 方差解释\n\n方差解释的百分比，或者说 F 检验，是组间方差与总方差的比率。同样地，这里肘部将决定 k-means 聚类模型的最优聚类数量。罗斯通过编写代码清单\
  \ 4-9 中的代码片段，将方差解释付诸实践。\n\n![A432778_1_En_4_Fig3_HTML.gif](img/A432778_1_En_4_Fig3_HTML.gif)\n\
  \n图 4-3.\n解释方差曲线，表示为聚类数量的函数\n\n```\nmatrix, x_cols = matrix_from_df(data_train)\n\
  X = matrix[x_cols]\nK = range(1,50)\nKM = [KMeans(n_clusters=k).fit(X) for k in\
  \ K]\ncentroids = [k.cluster_centers_ for k in KM]\nD_k = [cdist(X, cent, 'euclidean')\
  \ for cent in centroids]\ndist = [np.min(D,axis=1) for D in D_k]\nwcss = [sum(d**2)\
  \ for d in dist]\ntss = sum(pdist(X)**2)/X.shape[0]\nbss = tss-wcss\nkIdx = 10-1\n\
  fig = plt.figure()\nax = fig.add_subplot(111)\nax.plot(K, bss/tss*100, 'b*-')\n\
  plt.grid(True)\nplt.xlabel('Number of clusters')\nplt.ylabel('Percentage of variance\
