  \n\n\n## 过拟合与欠拟合\n\n过拟合是指模型在某个数据集上过度拟合的现象。这种泛化能力因此导致模型无法对未见数据做出高度准确的预测。图 2-12 中的非线性曲线展示了过拟合。\n\
  \n![A432778_1_En_2_Fig12_HTML.gif](img/A432778_1_En_2_Fig12_HTML.gif)\n\n图 2-12.\n\
  \n过拟合示意图\n\n以下方法可用于抑制过拟合：\n\n*   简化模型；即尽可能调整最少的参数，因为模型越复杂，就越容易对当前数据过拟合。\n*   执行交叉验证。例如，随机选择\
  \ x% 的数据值用于训练，剩余的 y% 用于测试。在训练数据上拟合模型，用它预测测试数据上的值，并计算测试误差。重复此过程 n 次。每次训练/测试的划分都是随机进行的。计算所有测试误差的平均值，以找出当前模型的真实测试误差。\n\
  \n欠拟合是指模型对当前数据的训练精度不高的现象。\n\n欠拟合的处理与偏差和方差有关。如果训练误差和测试误差都很高，则模型具有高偏差，如图 2-13 所示。\n\
  \n![A432778_1_En_2_Fig13_HTML.gif](img/A432778_1_En_2_Fig13_HTML.gif)\n\n图 2-13.\n\
  \n高偏差示意图\n\n此外，如果测试误差和训练误差之间存在较大差距，则模型具有高方差，如图 2-14 所示。\n\n![A432778_1_En_2_Fig14_HTML.gif](img/A432778_1_En_2_Fig14_HTML.gif)\n\
  \n图 2-14.\n\n高方差示意图\n\n如果模型属于高偏差类型的欠拟合，那么补救措施可以是增加模型复杂度；如果模型属于高方差类型的欠拟合，那么补救措施可以是引入更多数据，或者降低模型复杂度。\n\
  \n克莱尔决定将数据随机划分为训练/测试集，以验证模型的准确性，并在出现过拟合时执行交叉验证（列表 2-8）。\n\n```\ndef split_train_test(data,\
  \ feature, train_index=0.7):\ntrain, test = train_test_split(data, test_size = 1-train_index)\n\
  if type(feature) == list:\nx_train = train[feature].as_matrix()\ny_train = train['concrete_strength'].as_matrix()\n\
  x_test = test[feature].as_matrix()\ny_test = test['concrete_strength'].as_matrix()\n\
  else:\nx_train = [[x] for x in list(train[feature])]\ny_train = [[x] for x in list(train['concrete_strength'])]\n\
  x_test = [[x] for x in list(test[feature])]\ny_test = [[x] for x in list(test['concrete_strength'])]\n\
  return x_train, y_train, x_test, y_test\n列表 2-8.\n将数据拆分为训练集和测试集\n```\n\n克莱尔向史密斯解释了列表\
  \ 2-8 中的代码：“在上面的代码中，我们执行了 0.7-0.3 的划分。这意味着数据中 70% 的观测值构成训练数据集，用于拟合数据；而 30% 的观测值构成测试数据集，用于评估模型。”\n\
  \n克莱尔指出，欠拟合和过拟合可以在模型首次应用时从其输出中检测出来。为了确定消除欠拟合和过拟合的最佳方法，你必须经历多次建模迭代，直到找到一个同时避免这两种情况的模型。因此，这是一项持续的工作，并且每当将任何模型（回归、分类等）应用于数据时都应执行。\n\
  \n史密斯很好奇，是否存在一些技术可以在回归模型应用于数据集后评估其准确性。克莱尔的回答是肯定的，因此她编写了下一节内容来介绍这一点。\n\n## 回归评估指标\n\
  \n`Sklearn.metrics` 是确定回归模型性能的绝佳工具。它通过实现多个实用函数、评分和损失函数来实现这一点。这些函数通常输出单个结果；然而，它们也已增强到可以生成多个输出，最值得注意的是平均绝对误差、R²\
  \ 分数、均方误差和解释方差分数。\n\n克莱尔整理了一份最常用的回归评估方法的简要列表。\n\n### 解释方差分数\n\n该分数定义了最佳拟合回归模型所解释的总体方差的比例。该指标的最佳分数是\
  \ 1。解释方差分数的数学定义如下：\n\n*   公式：![$$ explaine{d}_{variance}\\left(y,\\widehat{y}\\\
  right)=1-\\frac{Var\\left\\{y-\\widehat{y}\\right\\}}{Var\\left\\{y\\right\\}} $$](img/A432778_1_En_2_Chapter_IEq4.gif)\n\
  *   其中：\n    *   yˆ：估计的目标输出\n    *   y：对应的（正确的）目标输出\n    *   Var：方差\n\n### 平均绝对误差\n\
  \n平均绝对误差（MAE）是残差（即估计目标与实际目标结果之间的差异）的平均值。该度量的其他形式可能包括将相对频率作为权重因子。MAE 在测量数据的相同尺度（即单位）上工作。因此其局限性在于无法比较使用不同尺度/单位的序列。其数学定义如下：\n\
  \n*   公式：![$$ {\\displaystyle \\begin{array}{c}\\hfill {y}_i-{\\widehat{y}}_i\\\
  vee \\hfill \\\\ {}\\hfill MAE\\left(y,\\widehat{y}\\right)=\\frac{1}{n_{samples}}{\\\
  sum}_{1=0}^{n_{samples}-1}\\hfill \\end{array}} $$](img/A432778_1_En_2_Chapter_IEq5.gif)\n\
  *   其中：\n    *   yˆ [i]：估计的目标输出\n    *   y [i]：对应的（正确的）目标输出\n    *   n [samples]：样本数量\n\
  \n### 均方误差\n\n均方误差（MSE）与 MAE 类似，区别在于它取的是残差的平方，而不是估计目标输出与对应实际目标输出之间的绝对差值。该值始终为正，且越接近\
  \ 0 越好。对 MSE 取平方根将得到均方根偏差（RMSE），其单位与目标输出相同。MSE 的数学定义如下：\n\n*   公式：![$$ MSE\\left(y,\\\
  widehat{y}\\right)=\\frac{1}{n_{samples}}{\\sum}_{1=0}^{n_{samples}-1}{\\left({y}_i-{\\\
  widehat{y}}_i\\right)}² $$](img/A432778_1_En_2_Chapter_IEq6.gif)\n*   其中：\n    *\
  \   yˆ [i]：第 i 个样本的估计目标输出\n    *   y [i]：对应的（正确的）目标输出\n    *   n [samples]：样本数量\n\
  \n### R²\n\nR²，也称为决定系数，定义了回归模型可能预测出多少未来样本的度量。此外，它也表示了响应变量中可由解释变量预测的方差比例。其取值范围从 1\
  \ 到负无穷，其中 1 是最优值。其数学表示如下：\n\n*   公式：![$$ {R}²\\left(y,\\widehat{y}\\right)=1-\\\
  frac{{\\displaystyle {\\sum}_{1=0}^{n_{samples}-1}}{\\left({y}_i-{\\widehat{y}}_i\\\
  right)}²}{{\\displaystyle {\\sum}_{1=0}^{n_{samples}-1}}{\\left({y}_i-\\acute{y}\\\
  right)}²} $$](img/A432778_1_En_2_Chapter_IEq7.gif)\n*   公式：![$$ {r}²=\\frac{varianceofpredictedvalues\\\
  widehat{y}}{varianceofobservedvaluesy} $$](img/A432778_1_En_2_Chapter_IEq8.gif)\n\
  *   示例：\n    *   R = -0.7\n    *   R ² = 0.49（即一半的变异由线性关系解释）\n*   其中：\n    *   yˆ\
  \ [i]：第 i 个样本的估计目标输出\n    *   y [i]：对应的（正确的）目标输出\n    *   ![$$ \\widehat{y}=\\frac{1}{n_{samples}}\\\
  ;{\\displaystyle \\sum_{1=0}^{n_{samples}-1}{y}_i} $$](img/A432778_1_En_2_Chapter_Equc.gif)\n\
  \n    *   n [samples]：样本数量\n\n### 残差\n\n*   公式：残差 = 观测值 y – 预测值 y 或 ( ![$$ y-\\\
  widehat{y} $$](img/A432778_1_En_2_Chapter_IEq9.gif) )\n*   最小二乘残差的均值始终为 0\n\n\n\n\
  ### 残差图\n\n残差图是以解释变量 x（即自变量）为横轴、回归残差为纵轴的散点图。参见图 2-15。最小二乘回归线会被 x 方向上的极端点（且附近无其他点）拉向该点。虚线代表最小二乘回归线。\n\
  \n![A432778_1_En_2_Fig15_HTML.gif](img/A432778_1_En_2_Fig15_HTML.gif)\n\n图 2-15.\n\
  \n残差图\n\n### 残差平方和\n\n残差平方和（RSS）指的是回归模型的最佳拟合线未能捕捉到的数据方差量。RSS 越小，模型越好。\n\n为简单起见，我们将继续使用\
  \ R² 作为交叉验证的指标。此外，考虑到我们正在进行预测工作，这个指标似乎是一个更好的选择，因为它能帮助我们确定未来样本在准确度尺度上的位置。\n\n现在，在了解了欠拟合、过拟合的概念以及回归评估技术后，克莱尔认为，是时候检验一下自己能否找到最适合当前数据的回归模型了。\n\
  \n## 回归的类型\n\n克莱尔继续指出，SKLearn 是 Python 中最常用的机器学习库。SKLearn 提供了一系列用于回归建模的算法。她根据 SKLearn\
  \ 网站上的内容整理出了图 2-13，作为根据数据集大小选择通常最佳回归算法的参考。\n\n你可以从 [`http://scikit-learn.org/stable/tutorial/machine_learning_map/`](http://scikit-learn.org/stable/tutorial/machine_learning_map/)\
  \ 下载图 2-16 所示的速查表。\n\n![A432778_1_En_2_Fig16_HTML.jpg](img/A432778_1_En_2_Fig16_HTML.jpg)\n\
  \n图 2-16.\n\n回归-SKLearn 速查表\n\n史密斯决定尝试一下，找出适合当前数据集大小的回归模型。他回忆道：“在我们的案例中，样本数量少于 10\
  \ 万，因此潜在的模型有 Lasso、ElasticNet、SVR(kernel=‘rbf’)、集成回归器、岭回归和 SVR(kernel=‘linear’)。”\n\
  \n线性回归是最基础的回归模型，因此克莱尔决定从它开始建模。\n\n### 线性回归\n\n多亏了克莱尔，史密斯已经知道什么是线性回归（见图 2-2）。因此，克莱尔决定将其付诸应用，看看它的表现如何，于是她编写了清单\
