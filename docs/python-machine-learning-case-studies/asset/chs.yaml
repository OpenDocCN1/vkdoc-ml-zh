  \n她希望这个庞大的特征池现在能使分类模型更好地理解底层数据的动态。她知道什么是分类，但好奇心驱使她撰写了以下关于该主题的材料。\n\n## 分类\n\n分类帮助我们判断一个新观测值将属于给定的哪个类别。分类属于监督学习，只有将带有标签的成员数据作为输入提供后，模型才能进行训练。这些成员变量通常是分类变量，可以是名义变量，也可以是布尔变量。\n\
  \n例如，考虑一个人在一家顶级银行申请抵押贷款。银行将审核他的申请，并想知道此人未来是否会违约。如果不会，银行将批准他的抵押贷款申请。这是分类的一个典型应用，银行使用过去的数据来训练模型。然后，模型将考虑此人的年龄、性别、薪资指数、生活方式指数和信用评分，以预测他未来是否会违约。这里我们试图预测的成员变量是“违约”，并且它是分类变量。\n\
  \n以下方法可用于评估分类模型：\n\n*   **准确性**：分类器和预测器的准确度\n*   **速度**：模型训练和预测所需的时间\n*   **鲁棒性**：处理缺失值和噪声的能力\n\
  *   **可扩展性**：在磁盘相关数据库中的效率\n*   **可解释性**：模型做出的预测具有直观意义\n\n### 模型评估技术\n\nPython 允许借助多种评分、损失和效用函数来衡量分类性能。这些指标需要置信度值的概率估计、正类、二元决策值或\
  \ `sample_weight` 参数内的值（即每个样本对总体得分的加权贡献）。这些指标可以通过多种方式进行划分。\n\n\n\n#### 混淆矩阵\n\n\
  混淆矩阵统计了真负例、假正例、假负例和真正例的数量。\n\n![A432778_1_En_5_Fig9_HTML.gif](img/A432778_1_En_5_Fig9_HTML.gif)\n\
  \n图 5-9.\n\n混淆矩阵及其对应公式\n\n*   **真负例**：模型正确地将 0 预测为 0 的实例频次。\n*   **假负例**：模型将 1 错误预测为\
  \ 0 的实例频次。\n*   **真正例**：模型正确地将 1 预测为 1 的实例频次。\n*   **假正例**：模型将 0 错误预测为 1 的实例频次。\n\
  \n在研究过程中，Judy 博士发现了一个混淆矩阵的简化版本，该版本以可视化形式展示模型评估结果。\n\n#### 二分类：接收者操作特征\n\n理解 ROC（接收者操作特征）曲线背后机制的一个好方法是通过混淆矩阵。ROC\
  \ 曲线以图形方式绘制了当判别阈值变化时二分类器的性能。请牢记以下术语：\n\n*   **真正例率 (TPR)**：即灵敏度、召回率或检测概率\n*   **假正例率\
  \ (FPR)**：即 1 - 特异度、真负例率或误报概率\n\n例如，考虑同一个数据集，模型将在该数据集上训练以预测未来高度可能违约的人群。我们将数据按 70/30\
  \ 比例拆分，这意味着模型将使用 70% 的观测值进行训练，并使用 30% 的观测值进行测试。在使用模型对 30% 的观测值进行预测后，我们得到了表 5-4 中的图表。\n\
  \n表 5-4.\n\n实际数据与预测数据的违约频次\n\n|   | 将会违约 | 不会违约 |\n| --- | --- | --- |\n| 实际值 |\
  \ 30 | 70 |\n| 正确预测值 | 19 | 36 |\n\n此例中，TPR 为 19/30 ≈ 63%。而 FPR 为 36/70 ≈ 51%。\n\
  \n![A432778_1_En_5_Fig10_HTML.gif](img/A432778_1_En_5_Fig10_HTML.gif)\n\n图 5-10.\n\
  \nROC 曲线及其相互间的相对比较\n\nROC 曲线绘制了正例中真正例的比例（即 TPR）与负例中假正例的比例（即 FPR）之间的关系。或者换句话说，我们可以说\
  \ ROC 曲线是作为误报率函数的灵敏度。它绘制了一个累积分布函数，有助于选择可能最优的模型。\n\n曲线上的准确率由曲线下面积 (AUC) 表示。其值范围在\
  \ 0.0 到 1.0 之间。\n\nJudy 博士决定定义一个方法，该方法将接收实际数据并预测模型的优良性。为此，她编写了清单 5-24 中的代码片段。\n\n\
