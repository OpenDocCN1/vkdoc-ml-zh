- "# 5. 分类\n\n本章旨在解决依赖于有限数量结果的现实世界问题。这些结果本质上可以是布尔型的，只有两个选择（即真/假或是/否）。它们也可以是名义型的（乘客将登上的船名、一组学生将获得的最高教育程度等）。在本章中，我们将讨论监督学习，即使用标记数据来训练模型。在这些数据上训练模型将能够对未见过的数据集进行标签预测（即未来预测）。在本章中，我们将讨论特征提取和选择，并以评估分类准确率的方法作为结束。\n\
  \n注意\n\n本书采用 Python 2.7.11 作为编码示例的事实标准。此外，你需要安装它才能完成练习。\n\n在本章中，我们将使用可从以下网址下载的医疗预约失约数据集：\n\
  \n[`www.kaggle.com/joniarroba/noshowappointments`](http://www.kaggle.com/joniarroba/noshowappointments)\n\
  \n\n\n## 案例研究：俄亥俄诊所——应对供需问题\n\n儿科外科医生兼俄亥俄诊所主管朱迪医生遇到了大麻烦，该诊所连续第三年出现亏损。朱迪医生最近刚晋升到这个职位，但她清楚地知道，诊所一直在效率方面尽职尽责。最让她惊讶的是，尽管拥有最优秀的医生，预约也从不缺乏，医院却仍在亏损。为了对财务状况放心，她聘请了一家第三方公司来审计财务部门。然而，该公司并未发现任何与当前困境相关的证据。\n\
  \n俄亥俄诊所是俄亥俄州的一家非营利性医疗中心。该诊所的独特使命是将研究与教育同临床及住院护理相结合。该医疗中心拥有庞大的员工队伍，共计 5 万人，正是这些员工的共同努力，使得该医疗中心迄今已能处理约\
  \ 700 万人次的就诊。\n\n此前，遇到类似情况，医院依赖的是捐赠者的资金注入。然而，随着管理层最近的人事变动，医院已开始努力实现自负盈亏。正如朱迪医生回忆的那样：\n\
  \n> 管理层的这项新举措对我来说是一个巨大的挑战，因为那恰好是我接手这个职位的时候。我没有时间安顿下来，所以这对我来说是一个生死攸关的局面。如果财务没有问题，预约量激增，没有大量招聘或加薪，那么造成这种困境的唯一原因可能就是患者在预约后根本没有出现。\n\
  \n董事会会议很快就要召开，她必须在会议前收集见解，为这种异常现象找出原因。朱迪医生知道，无论是猜测还是谣言，都无法让她找出尽管预约量很大却仍在亏损的原因。为了进一步调查她的怀疑，她获取了预约数据转储，并决定利用这些数据来验证证据。她知道具体的数据不会受偏见影响，因此能清晰地呈现当前的情况。首先，她必须交叉检查数据集中的特征是否与手头的问题相关。于是，她调出了表\
  \ 5-1 中的数据字典。\n\n表 5-1.\n\n医疗预约未出席数据集的数据字典\n\n| 特征名称 | 描述 |\n| --- | --- |\n| Age\
  \ | 患者年龄 |\n| Gender | 患者性别 |\n| AppointmentRegistration | 向患者发出预约的日期 |\n| ApointmentData\
  \ | 为患者安排的预约日期 |\n| DayOfTheWeek | 预约安排的星期几 |\n| Status | 预约安排的星期几（即响应变量） |\n| Diabetes\
  \ | 患者是否患有糖尿病 |\n| Alcoolism | 患者是否受酒精中毒影响 |\n| HiperTension | 患者是否患有高血压 |\n| Handicap\
