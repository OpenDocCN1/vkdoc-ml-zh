  \n## 相关性\n\n相关性指的是两个定量特征之间关系的强度和方向。相关性值为 1 表示正方向上的强相关，而相关性值为 -1 表示负方向上的强相关。值为 0\
  \ 表示定量特征之间没有相关性。请注意，相关性并不意味着因果关系；也就是说，一个实体的变化并不强制导致另一个实体的变化。\n\n属性与自身的相关性意味着相关性值为\
  \ 1。许多机器学习算法由于存在多重共线性而无法提供最佳性能。多重共线性指的是所选特征之间存在相关性，因此通常建议在将数据集中的特征纳入分析之前，检查所有特征之间的两两相关性。\n\
  \n以下是最常见的相关性类型：\n\n### 皮尔逊 R 相关系数\n\n皮尔逊 R 相关系数是三种方法中最常见的，通常适用于计算两个线性相关且似乎呈正态分布的定量变量之间的关系。例如，以股票市场中两只密切相关的证券为例，考察它们之间的关系程度。\n\
  \n### 肯德尔秩相关系数\n\n与适用于正态分布数据的皮尔逊相关系数相比，肯德尔秩相关系数是一种非参数检验，用于确定两个定量特征之间关系的强度和方向。非参数技术针对的是正态分布以外的分布。相反，参数技术则针对正态分布。\n\
  \n\n\n### 斯皮尔曼等级相关系数\n\n斯皮尔曼等级相关系数是一种与肯德尔等级相关系数类似的非参数检验，其区别在于斯皮尔曼等级相关系数不对数据分布做任何假设。斯皮尔曼等级相关系数最适用于有序数据。\n\
  \n南希想了解年龄的变化是否会导致行程时长的线性变化。为此，埃里克决定采用皮尔逊相关系数，并绘制这两个变量之间的散点图，以便直观地观察它们的关系。\n\n```\n\
  data = data.dropna()\nseaborn.pairplot(data, vars=['age', 'tripduration'], kind='reg')\n\
  plt.show()\n清单 1-25.\n行程时长与年龄的散点图矩阵\n```\n\n.\n\n![A432778_1_En_1_Fig17_HTML.gif](img/A432778_1_En_1_Fig17_HTML.gif)\n\
