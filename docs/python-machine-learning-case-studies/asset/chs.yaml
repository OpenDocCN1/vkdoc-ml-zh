  \n时间序列对象是非平稳的，这意味着预测的道路不再平坦。在应用预测之前，他必须首先使时间序列对象平稳。因此，他做了一些研究，并提出了几种使时间序列对象平稳的方法。\n\
  \n\n\n### 使时间序列对象平稳的方法\n\n尽管存在多种实现方法，但没有一种能保证使时间序列对象完全平稳。这些方法所做的是对时间序列对象进行变换，使其看起来更接近平稳对象。它们通过从时间序列对象中移除趋势和季节性来实现这一点。以下是能使时间序列对象更接近平稳对象的一些方法：\n\
  \n*   应用变换\n*   估计趋势并将其从原始序列中移除\n*   差分\n*   分解\n\n大卫决定逐一应用所有这些方法，以确定哪一种能使时间序列对象尽可能平稳。他首先研究了应用变换如何帮助实现这一短期目标。\n\
  \n#### 应用变换\n\n对数、立方根和平方根等变换会对较大的值进行惩罚，从而使序列变得平稳。大卫决定应用每一种变换，找出能使该时间序列对象几乎平稳的方法。他从对数变换开始。\n\
  \n##### 对数变换\n\n大卫编写了清单 3-6 中的代码片段，以查看对数变换是否能生成一个本质平稳的时间序列。\n\n```\ndata_log = np.log(data_train['Close_Adj'])\n\
  evaluate_stationarity(data_log, 15)\n清单 3-6.\n对时间序列对象应用对数变换\n```\n\n输出\n\n![A432778_1_En_3_Fig3_HTML.gif](img/A432778_1_En_3_Fig3_HTML.gif)\n\
