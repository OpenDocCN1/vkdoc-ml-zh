  \ loss='hinge', n_iter=5, n_jobs=1,\npenalty='l2', power_t=0.5, random_state=None,\
  \ shuffle=True,\nverbose=0, warm_start=False)\n```\n\nJudy 博士在清单 5-28 中拟合了两次模型。这样做的原因是，她首先通过\
  \ RBF 采样器对数据进行拟合和变换，从而对数据进行采样。据 Judy 博士所说，RBF 采样器在应用线性算法之前，近似了 RBF 核的特征映射。她还指出，`fit_tranform`\
  \ 中的 `fit` 执行了蒙特卡洛采样，而 `transform` 项执行了数据的映射。\n\n然后，她编写了清单 5-29 中的代码，将训练好的模型应用于测试数据集，然后使用它来查找预测标签以及模型的准确性。\n\
  \n```\nX_test = rbf_feature.fit_transform(x_test)\nY_pred = clf.predict(X_test)\n\
  model_performance('Kernel approximation', X_train, y_train, y_test, Y_pred)\n清单\
  \ 5-29.\n计算核近似与 SGD 分类器的准确性\n```\n\n输出\n\n![A432778_1_En_5_Fig13_HTML.gif](img/A432778_1_En_5_Fig13_HTML.gif)\n\
  \n图 5-13.\n\n核近似与 SGD 分类器的 ROC 曲线\n\n```\nModel name: Kernel approximation\nTest\
  \ accuracy (Accuracy Score):           0.695619\nTest accuracy (ROC AUC Score):\
  \            0.500000\nTrain accuracy:                           0.698398\nArea\
  \ Under the Precision-Recall Curve:    0.152191\n```\n\n训练准确率相对于决策树分类有所下降，这意味着模型没有高度泛化到训练数据集上，这确实是一个好迹象。同时，在查看图\
  \ 5-13 时，Judy 博士注意到测试数据准确率有了显著提升，从 0.59 跃升至 0.7。尽管在上述方面有所改进，但 ROC 的 AUC 值却下降了，这让她非常惊讶。在网上搜索了几个小时后，她仍然毫无头绪。因此，她决定去见她的朋友\
  \ Zoe，并征求她的意见。Zoe 听完问题后，给出了如下解释：\n\n> 嗯，准确率往往只衡量算法检测真正例的性能。它的不足之处在于没有考虑假正例和假负例。这些假例导致\
  \ AUC 下降，尽管准确率更高了。\n\n\n\n在佐伊的帮助下，朱迪博士得以清晰地看透混乱。然而，她对自己目前探索的模型精度仍不满意。她想知道是否存在某种技术，能够结合多个模型的力量，构建一个具有顶尖预测精度的模型。经过一番深入研究，朱迪博士发现“集成”正是她所寻求的表示方法。她还了解到，集成技术分为两种类型（即提升法和装袋法），她认为在使用这些技术训练模型之前，理解它们至关重要。\n\
  \n### 集成方法\n\n集成方法结合了多个机器学习算法的预测结果，从而获得比单个模型更准确的预测。集成方法通常分为两种变体（装袋法和提升法）。\n\n####\
  \ 装袋法\n\n装袋法，也称为自助法，其优化目标是最大限度地减少方差。它通过组合生成与原始数据大小相同的多重集，为训练数据集生成额外的数据来实现这一点。当模型过拟合且倾向于产生高方差时，应用装袋法是理想的选择。这可以通过进行多次重采样（每次都会过拟合），然后将它们的结果平均在一起来解决。这反过来会抵消部分方差。\n\
  \n![A432778_1_En_5_Fig14_HTML.gif](img/A432778_1_En_5_Fig14_HTML.gif)\n\n图 5-14.\n\
  \n装袋算法的基本工作流程\n\n决策树对其训练所依据的特定数据非常敏感。如果训练数据发生变化，生成的决策树可能会有很大不同，并产生不同的预测。决策树作为一种高方差的机器学习算法，可以通过自助法过程来应用装袋法。\n\
  \n考虑一个包含 50 个特征和 3000 个观测值的数据集。装袋法可能会创建 500 棵树，每棵树包含 500 个随机观测值和 20 个特征。最后，它将平均这\
  \ 500 个树模型的所有预测，以得到最终预测。\n\n#### 提升法\n\n提升法定义了一个目标函数，用于衡量给定一组参数时模型的性能。目标函数包含两部分：正则化和训练损失，两者相加。训练损失衡量我们的模型在训练数据上的预测能力。最常用的训练损失函数包括均方误差和逻辑回归。正则化项控制模型的复杂度，有助于避免过拟合。提升树使用树集成，因为它们将多个树的预测结果相加。\n\
  \n![A432778_1_En_5_Fig15_HTML.gif](img/A432778_1_En_5_Fig15_HTML.gif)\n\n图 5-15.\n\
  \n提升算法的基本工作流程\n\n朱迪博士决定通过应用最受欢迎的装袋技术（即随机森林分类）来将装袋法付诸实践。\n\n## 随机森林分类\n\n随机森林分类是装袋法的一种，也是目前最强大的机器学习算法之一。在决策树分类中，不同的子树可能具有许多结构相似性，这可能导致预测输出彼此高度相关。随机森林分类器通过限制每个分裂点处的特征来减少子树之间的这种相关性。因此，随机森林不是从所有可用变量中选择一个变量，而是从有限的随机特征样本中搜索能够最小化误差的变量。对于分类问题，每个分裂点处的变量数量可以定义如下：\n\
  \n![A432778_1_En_5_Fig16_HTML.gif](img/A432778_1_En_5_Fig16_HTML.gif)\n\n图 5-16.\n\
  \n随机森林分类器示意图\n\n*   符号：m\n*   公式：![$$ \\sqrt{p} $$](img/A432778_1_En_5_Chapter_IEq1.gif)\n\
  *   其中，\n    1.  ‘m’ 是每个分裂点处的最优变量数量\n    2.  ‘p’ 是数据集中变量的总数\n\n随机森林分类器速度快，并且可以处理不平衡或包含缺失值的数据。她编写了清单\
  \ 5-30 中的代码，将此集成技术应用于实际应用。\n\n```\nclf = RandomForestClassifier()\nclf.fit(x_train,\
  \ y_train)\n清单 5-30.\n在训练数据集上训练随机森林分类器\n```\n\n输出\n\n```\nRandomForestClassifier(bootstrap=True,\
  \ class_weight=None, criterion='gini',\nmax_depth=None, max_features='auto', max_leaf_nodes=None,\n\
  min_impurity_split=1e-07, min_samples_leaf=1,\nmin_samples_split=2, min_weight_fraction_leaf=0.0,\n\
  n_estimators=10, n_jobs=1, oob_score=False, random_state=None,\nverbose=0, warm_start=False)\n\
  ```\n\n朱迪博士使用默认参数配置应用了随机森林分类器。然后，她编写了清单 5-31 中的代码片段，以评估随机森林分类器模型的优劣。\n\n```\ny_pred\
  \ = clf.predict(x_test)\nmodel_performance('Random Forest', x_train, y_train, y_test,\
  \ y_pred)\n清单 5-31.\n计算随机森林分类器模型的准确率\n```\n\n输出\n\n![A432778_1_En_5_Fig17_HTML.gif](img/A432778_1_En_5_Fig17_HTML.gif)\n\
  \n图 5-17.\n\n随机森林分类器的 ROC 曲线\n\n```\nModel name: Random Forest\nTest accuracy (Accuracy\
  \ Score):           0.640874\nTest accuracy (ROC AUC Score):            0.534295\n\
  Train accuracy:                           0.990071\nArea Under the Precision-Recall\
  \ Curve:    0.132014\n```\n\n训练准确率与决策树分类器相似。看起来两种树分类器技术都使模型过拟合了。然而，与决策树分类器相反，随机森林分类器的测试准确率显著提高。但是，测试水平的准确率仍然远不及使用核近似的\
  \ SGD 分类器所获得的准确率（即 0.7 对比 0.64）。\n\n在应用了随机森林分类器之后，朱迪博士很想知道提升集成是否能产生一个强大的模型。为此，她计划对从清单\
  \ 5-24 获得的训练-测试分割应用梯度提升。\n\n\n\n### 梯度提升\n\n在提升方法中，样本的选择是通过对难以分类的观测值赋予越来越高的权重来实现的。梯度提升分类以集成弱预测模型（通常是决策树）的形式生成预测模型。它通过针对任意可微损失函数进行优化来泛化模型。在每个阶段，回归树都拟合二项式或多项式偏差损失函数的负梯度。\n\
  \n简单来说，梯度提升分类器执行以下操作：\n\n1.  梯度提升逐个构建集成树。\n2.  所有单个树的预测结果被求和。\n3.  目标函数与当前集成预测之间的差异（即残差）被重构。\n\
  4.  集成中的下一棵树应补充现有树，并最小化集成的残差。\n\nJudy 博士乐观地认为，梯度提升分类器能产生最佳结果，因为它们对难以分类的样本赋予更高的权重，这将使集成模型投入更多精力来分类这些高权重样本。为此，她编写了清单\
  \ 5-32 中的代码片段来训练模型，然后为测试数据集预测标签。\n\n```\nclf = GradientBoostingClassifier(random_state=10,\
  \ learning_rate=0.1, n_estimators=200, max_depth=5, max_features=10)\nclf.fit(x_train,\
  \ y_train)\ny_pred = clf.predict(x_test)\n清单 5-32.\n通过应用梯度提升分类器训练模型并预测状态标签\n```\n\
  \n这一次，Judy 博士在初始化模型时传入了一些参数。她决定采用 0.1 的学习率，这个值既不太小也不太大。除此之外，她将最大迭代次数设为 200，树的最大深度设为\
  \ 5，并限制模型最多从十个特征中学习。Judy 博士编写了清单 5-33 中的代码片段来评估模型的优良性。为此，她将训练集、测试集和预测值作为参数传递给之前在清单\
  \ 5-24 中定义的 `model_performance` 函数。\n\n```\nmodel_performance('Gradient Boosting',\
  \ x_train, y_train, y_test, y_pred)\n清单 5-33.\n计算梯度提升分类器的准确率\n```\n\n输出\n\n![A432778_1_En_5_Fig18_HTML.gif](img/A432778_1_En_5_Fig18_HTML.gif)\n\
  \n图 5-18.\n\n梯度提升分类器的 ROC 曲线\n\n```\n模型名称: Gradient Boosting\n测试准确率 (Accuracy Score):\
  \           0.700408\n测试准确率 (ROC AUC Score):            0.514929\n训练准确率:       \
  \                    0.707403\n精确率-召回率曲线下面积:    0.153744\n```\n\nJudy 博士认为该模型在避免过拟合方面做得不错。与之前应用的模型相比，准确率有所提高，ROC\
  \ 得分也超过了使用 SGD 分类器的核近似方法。然而，ROC 得分仍然低于决策树分类器模型的结果。\n\n在研究过程中，Judy 博士发现梯度提升分类模型在训练时也会输出模型赋予每个特征集的重要性得分。她很好奇在训练模型时哪些特征的表现优于其他特征。为此，她编写了清单\
  \ 5-34 中的代码来查看特征的重要性得分。\n\n```\nfor feature, score in zip(features_of_choice, list(clf.feature_importances_)):\n\
  print '%s\\t%f'%(feature, score)\n清单 5-34.\n打印梯度提升分类器分配的特征权重\n```\n\n输出\n\n```\n\
  年龄                                     0.143221\n性别                            \
  \      0.009629\n星期几                            0.053643\n糖尿病                  \
