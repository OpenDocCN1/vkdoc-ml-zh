  \ t 统计量的概念，并为南希做了一个小演示。\n\n## 假设检验：比较两组\n\n在介绍比较两组的方法之前，理解零假设和备择假设非常重要。\n\n零假设是我们在假设检验中试图寻找证据反驳的假设。零假设通常是研究者基于先前知识或经验提出的初始主张。备择假设的总体参数值与零假设不同。备择假设是你希望最终成立的结果。通过执行统计检验来决定在假设检验中哪一个成立。如果实验结果支持零假设，我们就说实验未能拒绝零假设。你可能会想：“这不就是接受零假设吗？”嗯，并非如此！“无罪”并不等同于一个人就是无辜的。\n\
  \n### t 统计量\n\nt 指的是以标准误差为单位表示的差异。它有两种最常见的变体：\n\n单样本 t 检验\n\n这是为了寻找总体均值与假设值之间存在显著差异的证据。\n\
  \n双样本 t 检验\n\n这是当你试图寻找两个总体均值之间存在显著差异的证据时使用的方法。请注意，来自两个分布的样本应相互独立。\n\nt 值和 p 值在内部是关联的。t\
  \ 值的绝对值越大，p 值越小，因为分布集中在均值附近，因此拒绝零假设的概率就越高。\n\nt 值可以是负数也可以是正数。无论方向如何，t 值的绝对值越大，就越有力地反驳了“不存在显著差异”（即零假设）的观点。反之，如果\
  \ t 值趋近于 0，则意味着总体均值之间，或总体均值与假设值之间不存在显著差异。\n\n与相关性等统计现象不同，t 值是通过从整个总体中抽取一个样本计算得出的。由于抽样是随机的，每次计算出的\
  \ t 值都会呈现随机抽样误差（即与之前计算的 t 值存在一定差异）。\n\nt 分布有助于识别因从整个总体中随机抽样而产生的变化幅度。\n\n\n\n###\
  \ t 分布与样本量\n\n自由度指的是你在多个选项中拥有选择权的情况。通常自由度等于样本量减 1。自由度决定了高斯分布的离散程度。自由度越大，落在尾部的概率密度就越小，分布会紧密集中在均值周围。小样本量更容易出现异常情况，因此即使原假设成立，也可能导致结果远离原假设。因此，在计算\
  \ t 值时，最好使用较大的样本量。\n\n![A432778_1_En_1_Fig19_HTML.gif](img/A432778_1_En_1_Fig19_HTML.gif)\n\
  \n图 1-19.\n\nt 分布随样本量变化的情况\n\n现在我们来计算所有性别和用户类型类别的双尾 t 检验（参见代码清单 1-27）。这样做的目的是了解不同类别在方差上是否具有相似性。如果具有相似性，它们将被视为一个组；否则，在分析模式中将分别处理。\n\
  \n```\nfor cat in ['gender','usertype']:\nprint 'Category: %s\\n'%cat\ngroupby_category\
  \ = data.groupby(['starttime_date', cat])['starttime_date'].count().unstack(cat)\n\
  groupby_category = groupby_category.dropna()\ncategory_names = list(groupby_category.columns)\n\
  for comb in [(category_names[i],category_names[j]) for i in range(len(category_names))\
  \ for j in range(i+1, len(category_names))]:\nprint '%s %s'%(comb[0], comb[1])\n\
  t_statistics = stats.ttest_ind(list(groupby_category[comb[0]]), list(groupby_category[comb[1]]))\n\
  print 'Statistic: %f, P value: %f'%(t_statistics.statistic, t_statistics.pvalue)\n\
  print '\\n'\n代码清单 1-27.\n计算性别和用户类型类别的双尾 t 检验\n```\n\n输出结果\n\n```\nCategory: gender\n\
  Female Male\nStatistic: -38.572176, P value: 0.000000\nFemale Other\nStatistic:\
  \ 48.248666, P value: 0.000000\nMale Other\nStatistic: 53.180282, P value: 0.000000\n\
  Category: usertype\nMember Short-Term Pass Holder\nStatistic: 14.393456, P value:\
  \ 0.000000\n```\n\n南希对这段代码和输出结果都感到困惑，于是埃里克解释道：\n\n> 首先，我们遍历了性别和年龄这两个特征。对于每个特征，我们先将该列拆分为多个类别列。例如，性别被拆分为男性、女性和其他。接着，我们构建了类别对，并对它们运行\
  \ t 检验。例如，男性-女性、男性-其他等。结果显示所有类别之间似乎具有同质性。我这么说是什么意思呢？在所有比较中，输出结果中的 p 值都大致为 0。如果我们采用\
  \ 95%的置信区间，那么对应的 p 值为 0.05。上述所有统计量都没有超过我们设定的 p 值基准。这让我们得出结论：在进入建模阶段时，我们需要将所有类别分开处理，因为它们具有不同的方差。\n\
  \n南希现在对受众有了一定程度的了解，但她还想了解更多，为此她计划生成一个问题并进行抽样。于是她问埃里克能否在这方面给她讲解一两个概念。埃里克知道中心极限定理在抽样和分析中具有关键价值，于是他举了一个例子来说明。\n\
  \n## 中心极限定理\n\n以任意一个由随机样本组成的分布为例，该分布具有明确的均值和标准差。现在，我们从该分布中随机抽取一些样本，并计算其均值和标准差。随着样本量（即\
  \ n）的增加，均值和标准差会趋近于高斯正态分布的均值和标准差。换句话说，随着从任意分布中抽取的样本量增加，该分布会收敛到具有给定均值和标准差的正态分布。那么，样本量需要多大，该定理才能发挥作用呢？\n\
  \n*   样本量越大，抽样分布就越接近正态分布。\n*   任意分布越接近正态分布，满足该定理所需的样本量就越少。统计学家通常建议在这种情况下样本量取 30\
  \ 到 40。\n\n埃里克决定利用手头的数据来帮助解释中心极限定理（参见代码清单 1-28）。\n\n![A432778_1_En_1_Fig20_HTML.gif](img/A432778_1_En_1_Fig20_HTML.gif)\n\
  \n图 1-20.\n\n不同样本量下的每日票务分布\n\n```\ndaily_tickets = list(data.groupby('starttime_date').size())\n\
  sample_tickets = []\ncheckpoints = [1, 10, 100, 300, 500, 1000]\nplot_count = 1\n\
  random.shuffle(daily_tickets)\nplt.figure(figsize=(15,7))\nbinrange=np.array(np.linspace(0,700,101))\n\
  for i in xrange(1000):\nif daily_tickets:\nsample_tickets.append(daily_tickets.pop())\n\
  if i+1 in checkpoints or not daily_tickets:\nplt.subplot(2,3,plot_count)\nplt.hist(sample_tickets,\
  \ binrange)\nplt.title('n=%d' % (i+1),fontsize=15)\nplot_count+=1\nif not daily_tickets:\n\
  break\nplt.show()\n代码清单 1-28.\n在行程数据集上验证中心极限定理的脚本\n```\n\n埃里克对代码清单 1-28 中的代码解释如下：\n\
  \n> 随机打乱是为了改变每日票务数量的顺序。完成后，固定不同的样本量，以观察分布随样本量变化的情况。请注意图 1-20，随着样本量的增加，分布似乎逐渐转变为正态分布。这验证了中心极限定理。\n\
  \n## 案例研究结论\n\n埃里克和南希的推论帮助他们更好地理解了受众，并获得了有价值的见解。这些见解基于 2014 年至 2016 年收集的数据，其中人口统计信息仅适用于会员，而不适用于短期通行证持有者。因此，为了获取短期通行证持有者的信息，南希知道她需要进行一项市场调研，而中心极限定理将在其中派上用场。行程时长呈现出一种随时间重复的明确季节性模式。对该时间序列进行预测，可以帮助南希预测公司需要加大营销力度的时机，以及预测出行高峰时段，从而确保运营效率。至于促销活动，南希现在知道，启动活动的最佳站点是\
  \ Pier 69/Alaskan Way & Clay St。异常值只占数据集的一小部分；然而，它们的时间序列特性意味着这些异常值无法被移除，因此需要应用变换。关于进一步的分析，南希现在意识到，由于特征不具有同质性，分析必须在单个类别层面进行。\n\
  \n南希不确定他们使用的技术是否已经过时，或者是否也能应用于现实世界。因此，埃里克整理了一份来自行业朋友的应用清单，展示了他们如何将统计学和概率论应用于实际。\n\
  \n## 统计学与概率论的应用\n\n统计学与概率论在多个研究领域都有广泛的应用。\n\n### 精算科学\n\n精算师运用数学、概率论、统计学、金融学、经济学、计算机科学和建模等概念来评估和定价风险。他们的应用案例存在于保险、咨询公司和政府等领域。\n\
  \n\n\n### 生物统计学\n\n统计学在生物学的各个分支中都有应用。这包括生物实验的设计以及从实验中做出推断。深入探究生物统计学，会发现一些例子，其中受试对象（患者、细胞等）对某些刺激（例如药物）表现出不同的反应。生物统计学家使用推断统计学来解读这些异常现象的意义。\n\
  \n### 天体统计学\n\n天体统计学是统计分析、天体物理学和数据挖掘的融合体。通过对宇宙进行自动扫描收集到的数据，用于做出推论。\n\n### 商业分析\n\
  \n商业分析运用运营理论和统计理论来构建预测模型。它还结合了优化技术，为客户和企业高管获取有效的洞察。\n\n这些洞察使公司能够自动化和优化其业务流程。商业智能与商业分析的不同之处在于，商业智能帮助我们回答“发生了什么”，而商业分析则帮助我们理解这种异常的原因（即，它最初为何发生，以及再次发生的可能性）。这些分析被应用于各种业务领域，例如企业优化、欺诈分析、定价分析、供应链分析等。\n\
  \n### 计量经济学\n\n运用统计方法来估计经济关系构成了计量经济学。一些例子包括：衡量离婚法对离婚率和结婚率的影响、移民政策对本地工人工资变化的影响，或者预测通货膨胀率、利率或国内生产总值等宏观经济变量。\n\
  \n### 机器学习\n\n几种机器学习算法都基于统计理论或其高级版本。一个常见的例子是贝叶斯理论。\n\n### 统计信号处理\n\n利用过去的语音语料库来确定所说词语的最高概率。此外，统计信号处理还应用于以下领域：\n\
  \n*   博弈论\n*   估计与滤波\n*   信号处理\n*   线性系统\n\n### 选举\n\n竞选经理利用民意调查的结果来推断其政党在即将到来的选举中获胜的可能性。\n\
  \n"
