  trans: '

    ### 套索回归


    与岭回归相反，套索回归使用 L1 范数。套索回归的 L1 范数定义如下：


    *   公式：![$$ {\left|\left|\overrightarrow{\beta}\right|\right|}_1=\left|{\beta}_0\right|+{\beta}_1\vee
    $$](img/A432778_1_En_2_Chapter_IEq15.gif)


    从数学角度，我们将套索回归定义如下：


    *   公式：![$$ \underset{\overrightarrow{\beta}}{\mathit{\min}}{\left|\left|\overrightarrow{y}-A\overrightarrow{B}\right|\right|}_2²
    $$](img/A432778_1_En_2_Chapter_IEq16.gif) 满足条件 ![$$ \vee \overrightarrow{\beta}{\vee}_1\le
    c $$](img/A432778_1_En_2_Chapter_IEq17.gif) 或

    *   ![$$ \underset{\overrightarrow{\beta}}{\mathit{\min}}{\left|\left|\overrightarrow{y}-A\overrightarrow{B}\right|\right|}_2²+\lambda
    \vee \overrightarrow{\beta}{\vee}_1 $$](img/A432778_1_En_2_Chapter_Eque.gif)


    由于我们之前选择的岭回归是 L2 范数，因此 beta 值的约束形状是一个圆形。然而，在采用 L1 范数的套索回归中，beta 的约束形状是一个菱形（见图
    2-22）。


    ![A432778_1_En_2_Fig22_HTML.gif](img/A432778_1_En_2_Fig22_HTML.gif)


    图 2-22.


    套索回归的表示


    考虑到这个菱形位于第一象限 x 轴上的边缘，我们可以看到其坐标为 (c,0)。上方的等高线在 (0,c) 处与菱形相切，这意味着我们得到了 β [1] 的值，而没有得到
    β [2] 的值。因此，将以下内容代入方程将导致与 β [1] 相关的解释变量变为 0。因此，在整个过程中，套索回归最终只会保留少数几个解释变量，而相比之下，岭回归的形状是圆形，会包含数据集中的所有解释变量。


    史密斯预计这里的 R² 会有所改善，因为他认为只精选少数几个解释变量而忽略其余变量可以使模型更强大。因此，克莱尔测试了该模型，如代码清单 2-12 所示。


    ```

    model = Lasso()

    cv = GridSearchCV(estimator=model, param_grid=dict(alpha=alphas))

    y_pred = cv.fit(x_train, y_train).predict(x_test)

    plt.scatter(range(len(y_test)), y_test,  color=''black'')

    plt.plot(y_pred, color=''blue'', linewidth=3)

    print ''Features: %s''%str(features)

    print ''R2 score: %f''%r2_score(y_test, y_pred)

    print ''Intercept: %f''%regr.intercept_

    print ''Coefficients: %s''%str(regr.coef_)

    代码清单 2-12.

    计算多元套索回归

    ```


    输出


    ```

    Features:      [''cement_component'', ''flay_ash'', ''water_component'', ''superplasticizer'',
    ''coarse_aggregate'']

    R2 score:      0.103610

    Intercept:     77.802791

    Coefficients:  [0.04531335 0.01168227 -0.13620573 0.24324622 -0.03297459]

    ```


    史密斯注意到套索回归的表现优于多元岭回归和线性回归（图 2-23）。


    ![A432778_1_En_2_Fig23_HTML.gif](img/A432778_1_En_2_Fig23_HTML.gif)


    图 2-23.


    多元套索回归图


    然而，根据克莱尔的说法，0.1 的 R² 非常低，不足以用来推断响应变量。此外，她指出，与岭回归一样，这里再次使用了网格搜索来优化 alpha 项。


    由于到目前为止没有取得重大成功，克莱尔决定引入回归模型中的最佳方案。弹性网络融合了这两种方法（即岭回归和套索回归）的优点。


    ### 弹性网络


    弹性网络克服了套索回归中发现的局限性（即惩罚函数）。套索倾向于只选择部分解释变量，并且对于多重共线性的解释变量组，它只会从该组中选择一个。为了避免这种情况，明智的做法是在惩罚项中添加一个二次部分（即岭回归中存在的
    ![$$ {\left|\left|\beta \right|\right|}²\Big) $$](img/A432778_1_En_2_Chapter_IEq18.gif）。因此，弹性网络所做的是包含套索回归和岭回归惩罚项的凸组合。


    克莱尔编写了代码清单 2-13 中的代码，尝试对数据应用多元弹性网络回归。


    ```

    model = ElasticNet()

    cv = GridSearchCV(estimator=model, param_grid=dict(alpha=alphas))

    y_pred = cv.fit(x_train, y_train).predict(x_test)

    plt.scatter(range(len(y_test)), y_test,  color=''black'')

    plt.plot(y_pred, color=''blue'', linewidth=3)

    print ''Features: %s''%str(features)

    print ''R2 score: %f''%r2_score(y_test, y_pred)

    print ''Intercept: %f''%regr.intercept_

    print ''Coefficients: %s''%str(regr.coef_)

    代码清单 2-13.

