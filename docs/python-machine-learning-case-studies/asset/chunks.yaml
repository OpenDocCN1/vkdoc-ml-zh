    ## 用于建模的数据转换


    罗斯花了数小时寻找这个谜题的解决方案。他感到失望，因为他原本期望这种方法能奏效并产生结果。为了简化问题，他将搜索范围缩小到一个特征（即分组），并开始思考如何将其重新编码为数值形式。夜深了，但罗斯无法入睡，这时一个想法闪过他的脑海。为什么不把“分组”特征转换成布尔值呢？这样，属于某个分组的研究论文旁边就标记为
    1，否则为 0。他能想到的数据表示形式是一个矩阵，其中列代表不同的分组，行代表研究论文。


    他知道一篇研究论文可能属于一个分组。在数据集中，给定研究论文的分组由分隔符（即 \n）分隔。因此，他首先决定通过拆分中间的分隔符来分离分组，这样如果一篇研究论文属于三个分组，它将在数据集中由三个不同的观测值（即行）表示。


    ```

    s = data_train[''groups''].str.split(''\n'').apply(pd.Series, 1).stack()

    s.index = s.index.droplevel(-1)

    s.name = ''groups''

    del data_train[''groups'']

    data_train = data_train.join(s).reset_index()

    代码清单 4-4.

    按分组函数逐行拉伸数据框

    ```


    除了分离分组，罗斯还决定添加一个新特征“标志”，并为所有行赋值为 1。按照他的想法，值为 1 表示该行的研究论文属于“分组”列中的那个分组。


    表 4-3.


    数据框转换后数据集的观测值打印


    ![A432778_1_En_4_Figb_HTML.gif](img/A432778_1_En_4_Figb_HTML.gif)


    ```

    data_train[''flags''] = pd.Series(np.ones(len(data_train)), index=data_train.index)

    data_train.head()

    代码清单 4-5.

    为分组隶属关系添加新变量

    ```


    在将研究论文按其所属分组展开，并为其关联一个隶属标志后，罗斯知道是时候将这个数据结构转换为矩阵了。为此，他定义了代码清单 4-6 中的函数。


    ```

    def matrix_from_df(data_train):

    matrix = data_train.pivot_table(index = [''title''], columns=[''groups''], values=''flags'')

    matrix = matrix.fillna(0).reset_index()

    x_cols = matrix.columns[1:]

    return matrix, x_cols

    代码清单 4-6.

    添加用于创建矩阵的函数

    ```


    多年来，罗斯已经熟练掌握了 Microsoft Excel 中的数据透视表。因此，他决定在代码清单 4-6 中使用相同的方法进行数据框到矩阵的转换。于是，他在代码清单
    4-6 中初始化了一个方法，将训练数据转换为一个数据透视表，以标题为索引，每个分组由单独的列表示，值来自“标志”特征。然后，他将索引中不属于某个分组领域的研究论文对应的位置设为
    0。他决定通过使用代码清单 4-6 中定义的方法来生成矩阵。


    表 4-4.


    矩阵的初始观测值


    ![A432778_1_En_4_Figc_HTML.gif](img/A432778_1_En_4_Figc_HTML.gif)


    ```

    matrix, x_cols = matrix_from_df(data_train)

    matrix.head()

    代码清单 4-7.

    从 matrix_from_df 方法中获取矩阵和 x 列

    ```


    罗斯看到输出结果符合预期，感到非常兴奋。为了检验自己的理解，他从表 4-4 中随机挑选了一篇研究论文。他选择了“一种用于 (MSS.CoMSS) 的计算方法”。通过查看表
    4-4 中的矩阵，罗斯推断这篇论文属于 HSO 分组，并且不属于其他任何分组。


    既然他知道了什么是聚类，并且已经将数据转换为适合应用的形式，那么是时候应用聚类建模了。然而，首先他必须确定评估指标，以便评估聚类模型的优劣。与可用于评估回归和分类模型的技术相反，可用于统计评估聚类模型优劣的技术并不多。原因在于，在回归和分类中，已经有标记数据可用于训练模型。但聚类的情况并非如此。


    ### 评估聚类模型的指标


    经过一番研究，罗斯了解到没有单一的方法可以评估聚类模型的输出。他遇到了两种使其有效的方法。第一种更偏向技术性。它认为，如果每个聚类内的方差得到最大程度的解释，聚类内的对象具有相似的属性，并且聚类之间彼此远离，那么聚类模型就足够好。第二种方法则认为，如果聚类定义在直觉上有意义，那么模型就是强大的。


    罗斯现在对聚类以及评估其优劣的方法有了清晰的理解。因此，他开始寻找在相关应用中效果最好的聚类模型。经过深入研究，他提出了几种聚类模型。


    ## 聚类模型


    罗斯决定从事实上的聚类算法（即 k-means 聚类）开始。对罗斯来说，在将其应用于手头的数据集之前，理解聚类收敛的方法至关重要。因此，他整理了对 k-means
    聚类算法的解释。


    ### k-Means 聚类


    k-means 聚类将数据空间划分为 Voronoi 单元表示。这种转换将数据观测值划分为 k 个聚类，其中每个观测值属于具有最近均值的聚类。k-means
    聚类的执行步骤如下：


    1.  随机选择 k 个质心。

    2.  将每个观测值与最近的质心绑定。

    3.  通过计算每个聚类内观测值的均值，重新计算每个聚类的新质心。

    4.  重复步骤 2。


    你可能会注意到步骤 1 和步骤 3 相似，区别在于步骤 1 中质心是随机选择的，而步骤 3 中是通过计算每个聚类内观测值的均值得到的。


    然后步骤 2 和步骤 4 是相同步骤的重复。步骤 3 和步骤 4 会迭代，直到聚类收敛——即数据集中所有观测值的聚类隶属关系保持不变。这最大化了聚类之间的距离，并最小化了每个聚类内观测值之间的距离。k-means
    聚类在最小化全局目标函数时并不总能找到最优配置。该聚类算法对聚类中心的初始选择高度敏感。


    罗斯现在完全理解了 k-means 聚类算法中收敛是如何执行的。然而，他对于 k 的值（即他应该预先指定的聚类数量）对于手头的数据来说多少才是最优的毫无头绪。他记得曾在
    LinkedIn 上看到过一篇关于 k-means 聚类的文章。于是他搜索了发布那篇文章的人，并给他发消息寻求帮助。他的联系人波拉克建议罗斯使用以下方法：


    *   肘部法

    *   方差解释

    *   BIC 分数


    他开始研究肘部法的工作原理，然后应用它来找到对模型最优的聚类数量。

    '
- fmt: '### Elbow Method


    The Elbow method in Ross’s terms is the percentage of variance explained as a
    function of the number of clusters. It determines how much marginal variance is
    contributed by a newly added cluster. A point of interest is that the first cluster
    will explain maximum variance with marginal gains dropping on the addition of
    every new cluster. Elbow will be the point where a new cluster will result in
    a considerable marginal drop, that being the optimal number of clusters. Ross
    decided to apply the Elbow method to the matrix transformed dataset.


    ![A432778_1_En_4_Fig2_HTML.gif](A432778_1_En_4_Fig2_HTML.gif)


    Figure 4-2. Elbow method curve as a function of number of clusters


    ```

    matrix, x_cols = matrix_from_df(data_train)

    X = matrix[x_cols]

    K = range(1,50)

    KM = [KMeans(n_clusters=k).fit(X) for k in K]

    centroids = [k.cluster_centers_ for k in KM]

    D_k = [cdist(X, cent, ''euclidean'') for cent in centroids]

    dist = [np.min(D,axis=1) for D in D_k]

    avgWithinSS = [sum(d)/X.shape[0] for d in dist]

    fig = plt.figure()

    ax = fig.add_subplot(111)

    ax.plot(K, avgWithinSS, ''b*-'')

    plt.grid(True)

    plt.xlabel(''Number of clusters'')

    plt.ylabel(''Average within-cluster sum of squares'')

    plt.title(''Elbow for KMeans clustering'')

    Listing 4-8.

    Applying Elbow Method and Variance Explained on Data Matrix

    ```


    In Listing [4-8](#A432778_1_En_4_Chapter.html#Par70), Ross recalled training 49
    models of k-means clustering, each having a different k-value ranging from 1 to
    50. He then fetched the cluster centers for those clustering models and determined
    the cluster memberships for each research paper model by model. Finally, for each
    model, he computed the sum of all research papers and divided it by the total
    number of research papers to get the average within cluster sum of squares. He
    then plotted the cluster sum of squares for all of the 49 cluster models in Figure
    [4-2](#A432778_1_En_4_Chapter.html#Fig2) to formulate the Elbow method.


    While looking at Figure [4-2](#A432778_1_En_4_Chapter.html#Fig2), Ross deduced
    the elbow to occur at `k = 9`. However, he wasn''t sold until and unless more
    than one method doesn''t converge on the same number of clusters. Thus he moved
    toward understanding variance explained.


    ### Variance Explained


    The percentage of variance explained, or in other words F-test, is the ratio of
    group variance to the total variance. Here again the elbow will determine the
    optimal number of clusters for the k-means clustering model. Ross put variance
    explained into practice by writing the code snippet in Listing [4-9](#A432778_1_En_4_Chapter.html#Par74).


    ![A432778_1_En_4_Fig3_HTML.gif](A432778_1_En_4_Fig3_HTML.gif)


    Figure 4-3. Explained variance curve as a function of number of clusters


    ```

    matrix, x_cols = matrix_from_df(data_train)

    X = matrix[x_cols]

    K = range(1,50)

    KM = [KMeans(n_clusters=k).fit(X) for k in K]

    centroids = [k.cluster_centers_ for k in KM]

    D_k = [cdist(X, cent, ''euclidean'') for cent in centroids]

    dist = [np.min(D,axis=1) for D in D_k]

    wcss = [sum(d**2) for d in dist]

    tss = sum(pdist(X)**2)/X.shape[0]

    bss = tss-wcss

    kIdx = 10-1

    fig = plt.figure()

    ax = fig.add_subplot(111)

    ax.plot(K, bss/tss*100, ''b*-'')

    plt.grid(True)

    plt.xlabel(''Number of clusters'')

    plt.ylabel(''Percentage of variance explained'')

    plt.title(''Elbow for KMeans clustering'')

    Listing 4-9.

    Applying Elbow Method and Variance Explained to Data Matrix

    ```


    Ross recalled having explained Listing [4-9](#A432778_1_En_4_Chapter.html#Par74)
    in the following words:


    > After getting the cluster memberships of each research paper cluster by cluster,
    the distances were then used to compute the within cluster sum of square. Next,
    distances were computed among the columns within each research paper to compute
    the total sum of squares. Finally, within the cluster sum of square was subtracted
    from total sum of squares to get the between sum of squares. Ratio of between
    sum of squares and total sum of squares was taken to plot in Figure [4-3](#A432778_1_En_4_Chapter.html#Fig3).


    To Ross Figure [4-3](#A432778_1_En_4_Chapter.html#Fig3) looked like an exponential
    cumulative distribution function. The variance explained was seemingly smooth
    and kept increasing with the number of clusters. This made it difficult for Ross
    to figure out the elbow. After due consideration, Ross noticed the gradient to
    start smoothing from `k = 9`, similar to what he had observed with the Elbow method.


    However, he didn''t stop there and continued looking for methods to help determine
    the optimal `k`, and within a short time he was exposed to the Bayesian Information
    Criterion (BIC) score.


    ### Bayesian Information Criterion Score


    BIC is another technique to choose the best model out of a finite set of models.
    The model with the lowest BIC score is deemed to be the winner. When training
    the model a high probability of increasing the likelihood of getting accurate
    clusters exists by adding extra parameters; however, he knew that doing so would
    overfit the model. BIC overcomes this problem by adding a penalty term on number
    of parameters in the model. BIC works on the assumption that the sample size should
    be much larger than the number of parameters in the model. Hence BIC won’t be
    suitable for complex models working on high-dimensional data.


    ![A432778_1_En_4_Fig4_HTML.gif](A432778_1_En_4_Fig4_HTML.gif)


    Figure 4-4. Sample BIC score plot


    The knowledge base on BIC score made Ross drop it as an option, because that BIC
    score is suitable for low-dimensional data, and therefore the matrix transformation
    meant that now the data had (number of groups + 1) dimensions, making it high-dimensional
    data.


    He was curious to know if a method existed to determine the optimal number of
    clusters, a method which resonates to how a k-means cluster works. In other words,
    Ross wanted to find a method that determines the optimal number of clusters on
    which intercluster distances are the maximum and intracluster distances are at
    a minimum. His search made him look into research papers, where he found the Silhouette
    method.'
