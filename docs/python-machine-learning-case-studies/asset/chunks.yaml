    ### Types of Variables


    Nancy decided to go an extra mile and allocated data type to each feature in the
    dataset.


    *Table 1-4. Nancy’s Approach to Classifying Variables into Data Types*


    | Feature name | Variable type |

    | --- | --- |

    | `trip_id` `bikeid` `tripduration` `from_station_id` `to_station_id` `birthyear`
    | Numbers |

    | `Starttime` `Stoptime` | Date |

    | `from_station_name` `to_station_name` `Usertype` `Gender` | Text |


    After looking at the feature classification in Table [1-4](#A432778_1_En_1_Chapter.html#Tab4)
    Eric noticed that Nancy had correctly identified the data types and thus it seemed
    to be an easy job for him to explain what variable types mean. As Eric recalled
    to have explained the following:


    > In normal everyday interaction with data we usually represent numbers as integers,
    text as strings, True/False as Boolean, etc. These are what we refer to as data
    types. But the lingo in machine learning is a bit more granular, as it splits
    the data types we knew earlier into variable types. Understanding these variable
    types is crucial in deciding upon the type of charts while doing exploratory data
    analysis or while deciding upon a suitable machine learning algorithm to be applied
    on our data.


    #### Continuous/Quantitative Variables


    A continuous variable can have an infinite number of values within a given range.
    Unlike discrete variables, they are not countable. Before exploring the types
    of continuous variables, let’s understand what is meant by a true zero point.


    ##### True Zero Point


    If a level of measurement has a true zero point, then a value of 0 means you have
    nothing. Take, for example, a ratio variable which represents the number of cupcakes
    bought. A value of 0 will signify that you didn’t buy even a single cupcake. The
    true zero point is a strong discriminator between interval and ratio variables.


    Let’s now explore the different types of continuous variables.


    ##### Interval Variables


    Interval variables exist around data which is continuous in nature and has a numerical
    value. Take, for example, the temperature of a neighborhood measured on a daily
    basis. Difference between intervals remains constant, such that the difference
    between 70 Celsius and 50 Celsius is the same as the difference between 80 Celsius
    and 100 Celsius. We can compute the mean and median of interval variables however
    they don’t have a true zero point.


    ##### Ratio Variables


    Properties of interval variables are very similar to those of ratio variables
    with the difference that in ratio variables a 0 indicates the absence of that
    measurement. Take, for example, distance covered by cars from a certain neighborhood.
    Temperature in Celsius is an interval variable, so having a value of 0 Celsius
    does not mean absence of temperature. However, notice that a value of 0 KM will
    depict no distance covered by the car and thus is considered as a ratio variable.
    Moreover, as evident from the name, ratios of measurements can be used as well
    such that a distance covered of 50 KM is twice the distance of 25 KM covered by
    a car.


    #### Discrete Variables


    A discrete variable will have finite set of values within a given range. Unlike
    continuous variables those are countable. Let’s look at some examples of discrete
    variables which are categorical in nature.


    ##### Ordinal Variables


    Ordinal variables have values that are in an order from lowest to highest or vice
    versa. These levels within ordinal variables can have unequal spacing between
    them. Take, for example, the following levels:


    1.  Primary school

    2.  High school

    3.  College

    4.  University


    The difference between primary school and high school in years is definitely not
    equal to the difference between high school and college. If these differences
    were constant, then this variable would have also qualified as an interval variable.


    ##### Nominal Variables


    Nominal variables are categorical variables with no intrinsic order; however,
    constant differences between the levels exist. Examples of nominal variables can
    be gender, month of the year, cars released by a manufacturer, and so on. In the
    case of month of year, each month is a different level.


    ##### Dichotomous Variables


    Dichotomous variables are nominal variables which have only two categories or
    levels. Examples include:


    *   Age: under 24 years, above 24 years

    *   Gender: male, female


    #### Lurking Variable


    A lurking variable is not among exploratory (i.e., independent) or response (i.e.,
    dependent) variables and yet may influence the interpretations of relationship
    among these variables. For example, if we want to predict whether or not an applicant
    will get admission in a college on the basis of his/her gender. A possible lurking
    variable in this case can be the name of the department the applicant is seeking
    admission to.


    #### Demographic Variable


    Demography (from the Greek word meaning “description of people”) is the study
    of human populations. The discipline examines size and composition of populations
    as well as the movement of people from locale to locale. Demographers also analyze
    the effects of population growth and its control. A demographic variable is a
    variable that is collected by researchers to describe the nature and distribution
    of the sample used with inferential statistics. Within applied statistics and
    research, these are variables such as age, gender, ethnicity, socioeconomic measures,
    and group membership.'
