  trans: "\n# 1. 统计学与概率论\n\n本章旨在向你灌输传统统计学与概率论的基本概念。当然，你们中的许多人可能想知道这与机器学习有什么关系。实际上，为了将最佳拟合模型应用于你的数据，最重要的前提是你首先要理解数据本身。这将使你能够发现数据中的分布，衡量数据的质量，并运行一些基本测试，以了解因变量和自变量之间是否存在某种关系。让我们开始吧。\n\
    \n注意\n\n本书采用 Python 2.7.11 作为代码示例的事实标准。此外，你需要在本地安装它以便完成练习。\n\n那么，为什么我更喜欢 Python\
    \ 2.7.11 而不是 Python 3x 呢？以下是一些原因：\n\n*   第三方库对 Python 2x 的支持相对优于对 Python 3x 的支持。这意味着\
    \ Python 2x 中有相当数量的库在 Python 3x 中缺乏支持。\n*   一些当前的 Linux 发行版和 macOS 默认提供 Python\
    \ 2x。目的是让读者无论使用何种操作系统版本，都能在其系统上应用代码示例，因此这是继续前进的选择。\n*   上述事实是企业倾向于使用 Python 2x\
    \ 或决定不将其代码库从 Python 2x 迁移到 Python 3x 的原因。\n\n## 案例研究：共享单车计划——确定品牌形象\n\n南希和埃里克被分配了一项艰巨的任务：为一个新的共享单车计划确定品牌形象。他们必须在今年的年度董事会上展示他们的成果，以便制定一个强有力的营销计划来吸引潜在客户。\n\
    \n该共享单车计划为城市居民提供了一种便捷、廉价且环保的交通替代方式。该服务在西雅图设有 50 个站点，共 500 辆自行车。每个站点都配备有锁车系统（所有自行车停放在此）、自助服务终端（客户可以获取会员钥匙或支付行程费用）以及头盔租赁服务。人们可以选择购买会员钥匙或短期通行证。会员钥匙赋予年度会员资格，钥匙可以从自助服务终端获取。会员的优势包括快速取车以及不限次数的\
    \ 45 分钟免费骑行。短期通行证则允许在 24 小时或 3 天内使用自行车。骑行者可以在全市 50 个站点中的任何一个取车和还车。\n\n杰森于 2014\
    \ 年 5 月启动了这项服务，此后一直专注于增加自行车数量和停靠站点，以便为客户提供更多便利和可达性。尽管进行了扩张，客户留存率仍然是一个问题。正如杰森回忆的那样：“我们计划投入一年的投资来铺设必要的基础设施，以便客户开始使用。我们制定了一项策略，确保留存率保持在高位，使这种模式能够自我维持。然而，结果却事与愿违（即，客户基础的增长未能跟上基础设施扩张的速度）。”\n\
    \n一家私营服务公司会有三种选择来遏制这个问题：争取赞助商、提高服务费用或扩大客户群。涨价对杰森来说不是一个选项，因为这是一项公共资助的倡议，旨在为所有人提供负担得起的交通。至于增加客户群，他们必须决定一种能够以低成本实现广泛覆盖的营销渠道。\n\
    \n南希，一位在企业部门工作了十年的营销人员，以及埃里克，一位数据分析师，被专门聘用，以找到解决这个问题的方法。他们的优势在于，他们获得了交易历史数据集，因此无需经历进行市场研究以收集数据的麻烦。\n\
    \n南希意识到，在最低预算下吸引回头客，首先需要了解客户（即，客户画像）。正如她所说：“了解你的品牌形象至关重要，因为它能帮助你接触到更有可能以更高概率转化的目标受众。此外，这也有助于吸引针对类似客户画像的赞助商。这种双管齐下的方法可以使我们的利润为正。”\n\
    \n当南希和埃里克思考手头的问题时，他们提出了如下问题：哪个属性与行程时长和行程次数的相关性最强？哪个年龄段的人最适应我们的服务？\n\n以下是提供给南希和埃里克的行程数据集的数据字典：\n\
    \n表 1-1.\n\n共享单车数据集中行程数据的数据字典\n\n| 特征名称 | 描述 |\n| --- | --- |\n| trip_id | 分配给每次行程的唯一\
    \ ID |\n| Starttime | 行程开始的日期和时间（太平洋标准时间） |\n| Stoptime | 行程结束的日期和时间（太平洋标准时间）\
    \ |\n| Bikeid | 分配给每辆自行车的 ID |\n| Tripduration | 行程时间（秒） |\n| from_station_name\
    \ | 行程出发站点的名称 |\n| to_station_name | 行程到达站点的名称 |\n| from_station_id | 行程出发站点的\
    \ ID |\n| to_station_id | 行程到达站点的 ID |\n| Usertype | 值可以是以下之一：短期通行证持有者或会员 |\n\
    | Gender | 骑行者的性别 |\n| Birthyear | 骑行者的出生年份 |\n\n本章的练习要求埃里克安装清单 1-1 中所示的包。他倾向于提前导入所有包，以避免在本地机器上实现代码片段时出现瓶颈。\n\
    \n然而，为了让埃里克在他的代码中导入这些包，他首先需要安装它们。他按如下方式操作：\n\n1.  打开终端/Shell\n2.  使用终端/Shell 导航到他的代码目录\n\
    3.  安装 `pip`：\n\n```\n    python get-pip.py\n```\n\n4.  分别安装每个包，例如：\n\n```\n \
    \   pip install pandas\n```\n\n```\n%matplotlib inline\nimport random\nimport\
    \ datetime\nimport pandas as pd\nimport matplotlib.pyplot as plt\nimport statistics\n\
    import numpy as np\nimport scipy\nfrom scipy import stats\nimport seaborn\n清单\
    \ 1-1.\n导入本章所需的包\n```\n\n## 执行探索性数据分析\n\n埃里克回忆起他曾用以下话语解释探索性数据分析：\n\n> 我所说的探索性数据分析（EDA）是什么意思？嗯，我的意思是通过可视化方式查看数据。为什么我们需要通过可视化方式查看数据？好吧，考虑到你的数据集中有\
    \ 100 万个观测值，仅仅通过查看数据来理解它并不容易，因此最好将其可视化地绘制出来。但你不觉得这是在浪费时间吗？不，一点也不，因为理解数据能让我们理解特征的重要性及其局限性。\n"
