    到目前为止，这是一段漫长的旅程。David 应用了对数变换，使用差分法使时间序列平稳，最后将组合模型应用于这个经过对数变换和差分处理的时间序列。现在的时间序列与他最初看到的大不相同，因为他已经应用了对数变换和差分。由于预测是在修改后的时间序列上进行的，因此现在需要将其反向缩放，以观察它对雅虎股票初始时间序列的预测效果如何。

