  trans: '#### 异常值


    异常值是指与大多数观测值显著不同的数值。这些值可能自然产生，也可能因设备故障或录入错误而出现。


    为了理解什么是异常值，我们需要查看图 1-14。


    ![A432778_1_En_1_Fig14_HTML.gif](img/A432778_1_En_1_Fig14_HTML.gif)


    图 1-14.


    使用箱线图说明异常值


    从图 1-14 中可以看出，位于须线之外的观测值被称为异常值。


    ```

    [Q1 – 1.5 (IQR) ,  Q3 + 1.5 (IQR) ] (即 IQR = Q3 - Q1)

    代码清单 1-17.

    不被视为异常值的数值区间

    ```


    不在此区间内的数值被视为异常值。了解 Q1 和 Q3 的值是进行此计算的基础。


    数据集中存在异常值是好事吗？通常不是！那么，我们应该如何处理数据集中的异常值呢？以下是几种最常用的方法：


    *   **删除异常值**：只有当异常值与有效值的比例非常低，且数据值不属于时间序列尺度时，才可采用此方法。如果异常值比例较高，删除这些值会损害数据的丰富性，应用模型也无法捕捉到数据内在的真实本质。然而，如果数据具有时间序列性质，删除异常值并不可行，原因在于时间序列模型要有效训练，数据必须在时间上保持连续。在这种情况下删除异常值会在连续分布中引入断裂。

    *   **用均值替换异常值**：另一种方法是取图 1-14 所示区间内数值的均值，计算该均值，并用其替换异常值。这能成功地将异常值转换为与有效观测值一致；然而，这会移除数据集中原本存在的异常点，而这些异常点的发现可能带来有趣的见解。

    *   **转换异常值**：应对异常值的另一种方法是将它们限制在可接受数据的上下边界内。上边界可通过将 Q3 和 IQR 的值代入公式 Q3 + 1.5IQR
    计算得出，下边界则可通过将 Q1 和 IQR 的值代入公式 Q1 – 1.5IQR 计算得出。

    *   **变量变换**：变换用于将原有的分布转换为正态分布。异常值会给数据带来非正态性，因此对变量进行变换可以减少异常值的影响。变换方法包括但不限于自然对数、将数据转换为比率变量等。


    南希很好奇我们的数据集中是否存在异常值——更准确地说，是在 `tripduration` 特征中。为此，埃里克决定首先通过编写代码清单 1-18 中的代码来创建一个箱线图（见图
    1-15），以直观地查看异常值，然后通过应用代码清单 1-19 中的区间计算方法进行验证。


    ```

    box = data.boxplot(column=[''tripduration''])

    plt.show()

    代码清单 1-18.

    绘制行程时长的箱线图

    ```


    ![A432778_1_En_1_Fig15_HTML.gif](img/A432778_1_En_1_Fig15_HTML.gif)


    图 1-15.


    行程时长的箱线图


    南希惊讶地发现，从图 1-15 的箱线图中，行程时长存在大量异常值。她问埃里克能否确定行程时长值中异常值的比例。她想知道异常值在数据集中是占很小一部分还是大部分。为此，埃里克编写了代码清单
    1-19 中的代码。


    ```

    q75, q25 = np.percentile(trip_duration, [75 ,25])

    iqr = q75 - q25

    print ''Proportion of values as outlier: %f percent''%(

    (len(data) - len([x for x in trip_duration if q75+(1.5*iqr) >=x>= q25-(1.5*iqr)]))*100/float(len(data)))

    代码清单 1-19.

    确定 tripduration 观测值中异常值的比例

    ```


    输出


    ```

    Proportion of values as outlier: 9.548218 percent

    ```


    埃里克向南希解释了代码清单 1-19 中的代码，内容如下：


    > 如图 1-14 所示，Q3 指的是第 75 百分位数，Q1 指的是第 25 百分位数。因此我们使用 `numpy.percentile()` 方法来确定
    Q1 和 Q3 的值。接着，我们通过两者相减来计算 IQR。然后，我们应用代码清单 1-18 中指定的区间来确定值的子集。最后，我们使用公式得出异常值的数量。


    ```

    异常值的数量 = 所有值的长度 - 所有非异常值的长度

    代码清单 1-20.

    计算异常值数量的公式

    ```


    在我们的代码中，`len(data)` 确定所有值的长度，而所有非异常值的长度由 `len([x for x in trip_duration if q75+(1.5*iqr)
    >=x>= q25-(1.5*iqr)]))` 确定。


    因此，随后应用了代码清单 1-20 中的公式来计算被视为异常值的比例。


    ```

    异常值比例 = (异常值的数量 / 所有值的长度) * 100

    代码清单 1-21.

    计算异常值比例的公式

    ```


    南希看到数据集中只有 9.5% 的值是异常值，松了一口气。考虑到数据集的时间序列性质，她知道删除这些异常值并非可行选项。因此，她明白唯一可以依赖的方法是对这些异常值应用变换，以消除其极端性质。不过，她有兴趣观察行程时长非异常值的均值。然后，她想将其与之前在代码清单
    1-15 中计算的所有值的均值进行比较。


    ```

    mean_trip_duration = np.mean([x for x in trip_duration if q75+(1.5*iqr) >=x>=
    q25-(1.5*iqr)])

    upper_whisker = q75+(1.5*iqr)

    print ''Mean of trip duration: %f''%mean_trip_duration

    代码清单 1-22.

    计算 tripduration 内观测值的 z 分数

    ```


    输出


    ```

    Mean of trip duration: 711.726573

    ```


    代码清单 1-22 中计算的非异常值行程时长均值（约 712）远低于代码清单 1-15 中在存在异常值情况下计算的均值（约 1,203）。这很好地说明了均值受数据集中异常值影响很大的概念。


    南希好奇为什么埃里克初始化了变量 `upper_whisker`，因为它在代码清单 1-22 的代码中并未使用。埃里克对此有一个说明：“`upper_whisker`
    是右侧（即正方向）须线的最大值，即所有有效值所达到的边界，任何大于该值的数值都被视为异常值。你很快就会明白我们为什么在这里初始化它。”


    埃里克有兴趣了解一旦异常值被转换为有效值集后的结果统计。因此，他决定从将异常值简单转换为代码清单 1-22 中计算的有效值均值开始。


    ```

    def transform_tripduration(x):

    if x > upper_whisker:

    return mean_trip_duration

    return x

    data[''tripduration_mean''] = data[''tripduration''].apply(lambda x: transform_tripduration(x))

    data[''tripduration_mean''].plot.hist(bins=100, title=''Frequency distribution
    of mean transformed Trip duration'')

    plt.show()

    代码清单 1-23.

    计算 tripduration 内观测值的均值分数

    ```'
