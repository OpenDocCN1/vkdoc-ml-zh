  raw: '### Decision Tree Classification


    Decision trees form a tree in a hierarchical fashion with each node having a decision
    boundary to proceed downward. The tree stops branching out at the level where
    there are no more splits possible. Interior nodes represent input variables having
    edges to each of the children. Children split the values from the input variable.
    They do that by partitioning the data at each level with nodes branching out to
    children. This behavior is known as recursive partitioning. Decision trees are
    easy to interpret and time efficient, and hence they can work well with large
    datasets. Decision trees can also handle both numerical and categorical data,
    that is, regression in case of numerical and classification in case of categorical
    data. However, the accuracy of decision trees is not as good as that produced
    by other machine learning classification algorithms.


    Moreover, decision trees generalize highly to the training dataset and thus are
    highly susceptible to overfitting. A decision tree aims to partition the data
    so that each of the partitioned instances has similar/homogeneous values. ID3
    algorithms are used to calculate the homogeneity of a sample, and if it is completely
    homogeneous it translates into an entropy of 0 and into a value of 1 or vice versa.
    A decision tree is a form of a parametric supervised learning method, and by parametric
    we mean that it can be applied to any data regardless of its underlying distribution.


    Dr. Judy wrote the code in Listing [5-26](#A432778_1_En_5_Chapter.html#Par134)
