    ## 核近似


    核近似对输入进行非线性变换，使其适用于线性分类和其他算法。这比核技巧更好，因为它可以显著降低处理非常大数据集时的学习成本。将核映射近似与 SGD 分类器相结合，可以在大型数据集上实现非线性学习。


    ### SGD 分类器


    在 SGD 分类器中，损失的梯度一次更新一个样本，并且模型根据学习率进行更新。为了使模型在默认学习率下获得最佳结果，数据应具有零均值和单位方差。


    ![A432778_1_En_5_Fig12_HTML.gif](img/A432778_1_En_5_Fig12_HTML.gif)


