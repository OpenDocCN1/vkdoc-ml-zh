  raw: "## Case Study: Ohio Clinic—Meeting Supply and Demand\n\nDr. Judy, a pediatric\
    \ surgeon and clinic supervisor at Ohio Clinic, was in big trouble, facing clinic\
    \ losses for the third consecutive year. Dr. Judy had recently been promoted to\
    \ this position, but she knew for a fact that the clinic had been doing due diligence\
    \ in terms of efficiency. What surprised her most was that the hospital was incurring\
    \ losses despite having the finest doctors available and no lack of scheduled\
    \ appointments. To be reassured about the financial side of things, she hired\
    \ a third-party firm to audit the finance department. However, the firm found\
    \ no evidence pertaining to the dilemma at hand.\n\nOhio Clinic is a nonprofit\
    \ medical center in Ohio. The clinic operates with a unique mission of blending\
    \ research and education with clinical and hospital care. The medical center has\
    \ a huge head force of 50,000 employees, and as a result of the combined effort\
    \ of those employees, the medical center has been able to handle approximately\
    \ 7 million visits so far.\n\nPreviously, in situations like these, the hospital\
