  trans: '

    ## 特征探索


    克莱尔首先将数据加载到内存中（参见代码清单 2-2）。


    ```

    data = pd.read_csv(''examples/concrete_data.csv'')

    代码清单 2-2.

    将数据读取到内存中

    ```


    史密斯好奇数据量有多大以及数据长什么样。于是克莱尔编写了代码清单 2-3 中的代码，打印数据集的一些初始观察结果，以便了解其内容。


    ```

    print len(data)

    data.head()

    代码清单 2-3.

    打印数据集的大小及前几行数据

    ```


    输出


    表 2-2.


    数据集观察结果打印


    ![A432778_1_En_2_Figa_HTML.gif](img/A432778_1_En_2_Figa_HTML.gif)


    ```


    ```


    在查看表 2-2 中的前几行观察结果时，史密斯注意到除了年龄之外，所有特征都是浮点数，年龄是唯一的整数变量。他还注意到，高炉矿渣、粉煤灰和减水剂并非混凝土制造时的必备成分。此外，他发现数据集中的混凝土数据可能有一年之久（例如，第
    3 行的年龄为 365，约等于一年）。


    克莱尔确信，为了进行后续分析（即相关性分析、回归分析），特征名称应尽可能简洁。因此，她编写了代码清单 2-4 中的代码片段，使名称既简短又易于人类阅读。重命名时，她遵循了表
    2-3 中定义的名称映射。


    表 2-3.


    变量名称映射


    | 旧特征名称 | 新特征名称 |

    | --- | --- |

    | Cement(component 1)(kg in a m3 mixture) | cement_component |

    | Blast Furnace Slag(component 2)(kg in a m3 mixture) | furnace_slag |

    | Fly Ash(component 3)(kg in a m3 mixture) | flay_ash |

    | Water(component 4)(kg in a m3 mixture) | water_component |

    | Superplasticizer(component 5)(kg in a m3 mixture) | superplasticizer |

    | Coarse Aggregate(component 6)(kg in a m3 mixture) | coarse_aggregate |

    | Fine Aggregate(component 7)(kg in a m3 mixture) | fine_aggregate |

    | Age (days) | age |

    | Concrete compressive strength(MPa, megapascals) | concrete_strength |


    ```

    data.columns = [''cement_component'', ''furnace_slag'', ''flay_ash'', ''water_component'',
    ''superplasticizer'', \

    ''coarse_aggregate'', ''fine_aggregate'', ''age'', ''concrete_strength'']

    代码清单 2-4.

    重命名列名

    ```


    在了解了数据的样子之后，克莱尔需要看看探索性变量与响应变量之间的相关性如何，以及数据中是否存在多重共线性或奇异点。


    ### 相关性


    克莱尔首先决定查看是否有任何探索性变量与响应变量（即混凝土强度）相关。这个问题对她来说至关重要，因为她相信两个定量实体之间的高相关性可以产生更优的最佳拟合线性回归线。因此，她有兴趣确定这些定量变量之间关系的强度和方向。为此，她编写了代码清单
    2-5 中的代码。然而，在继续之前，她解释了为什么相关性和回归并不完全相同：


    > 相关性可以在任意两个定量变量之间计算。然而，回归总是在一个响应变量和一个或多个探索性变量之间进行。相关性仅限于两个定量变量，而回归可以涉及两个以上的定量变量，即一个响应变量和多个探索性变量，也称为多元回归。


    克莱尔还指出，直观查看相关性的一种简单方法是使用响应变量与探索性变量之间的散点图，一次一个变量（图 2-8）。


    ![A432778_1_En_2_Fig8_HTML.gif](img/A432778_1_En_2_Fig8_HTML.gif)


    图 2-8.


    响应变量与探索性变量之间的散点图


    ```

    plt.figure(figsize=(15,10.5))

    plot_count = 1

    for feature in list(data.columns)[:-1]:

    plt.subplot(3,3,plot_count)

    plt.scatter(data[feature], data[''concrete_strength''])

    plt.xlabel(feature.replace(''_'','' '').title())

    plt.ylabel(''Concrete strength'')

    plot_count+=1

    plt.show()

    代码清单 2-5.

    绘制响应变量与探索性变量之间的散点图

    ```


    克莱尔对代码清单 2-5 中的代码进行了描述，以便让史密斯轻松理解所使用的方法。她回忆道：


    > 我们通过使用子图在同一张图中生成了多个图。我们首先通过 `plt.figure(figsize=(15,10.5))` 定义了图形大小。这将图形固定为宽度
    15、高度 10.5。响应变量（即混凝土强度）在所有图中保持不变，而探索性变量则一次考虑一个（即逐个绘图）。因此，我们使用了 `for feature in
    list(data.columns)[:-1]`，它遍历除最后一个变量（即响应变量）之外的所有变量。然后我们按如下方式定义了子图索引：`plt.subplot(3,3,plot_count)`。前三个数字定义了行数，后三个数字定义了列数。这意味着该图形最多可以容纳
    9 个图。`plot_count` 定义了特定图在图形中的位置索引。在此场景中，可能的取值范围是 1 到 9。


    史密斯决定尝试通过观察图 2-8 来解释相关性。于是他得出了以下三点见解：


    *   除了混凝土强度与年龄之间的散点图外，大多数图中异常值的存在可以忽略不计。

    *   在一些散点图中，我们看到大量数值落在 0 上。这在混凝土 `strength` 变量与探索性变量（主要是年龄、矿渣、粉煤灰和减水剂）之间的图中可以看到。

    *   似乎存在一些情况，两个定量变量之间有时呈正相关，有时呈负相关，有时则没有相关性。

    '
- fmt: "Claire decided to extend these findings by listing the pairs for each of the\
    \ instances (i.e., no, positive and negative correlations). She did so by evaluating\
    \ plots in Figure [2-6](#A432778_1_En_2_Chapter.html#Fig6) on the benchmark correlation\
    \ in Figure [2-9](#A432778_1_En_2_Chapter.html#Fig9). In case there is a trend,\
    \ it will be either a negative or a positive correlation. An absence of a definite\
    \ trend will indicate the existence of no correlation.\n\n![A432778_1_En_2_Fig9_HTML.gif](A432778_1_En_2_Fig9_HTML.gif)\n\
    \nFigure 2-9.\n\nIllustration of positive, negative, and no correlation\n\n* \
    \  Positive correlation exists between\n    *   Cement component and concrete\
    \ strength\n    *   Superplasticizer and concrete strength\n*   Negative correlation\
    \ lies between\n    *   Fly ash and concrete strength\n    *   Water component\
    \ and concrete strength\n    *   Coarse aggregate and concrete strength\n    *\
    \   Fine aggregate and concrete strength\n*   No correlation exists between\n\
    \    *   Furnace slag and concrete strength\n    *   Age and concrete strength\n\
    \nThe pairs identified by the visual representation made it easy for Smith to\
    \ understand what correlation is. However, he wanted to validate if the findings\
    \ made sense statistically as well. Hence, Claire came up with the code snippet\
    \ and computed Pearson correlation in Listing [2-6](#A432778_1_En_2_Chapter.html#Par116).\n\
    \n![A432778_1_En_2_Fig10_HTML.gif](A432778_1_En_2_Fig10_HTML.gif)\n\nFigure 2-10.\n\
    \nCorrelations between response variable and exploratory variables\n\n```\npd.set_option('display.width',\
    \ 100)\npd.set_option('precision', 3)\ncorrelations = data.corr(method='pearson')\n\
    print(correlations)\nListing 2-6.\nCalculating Pair-wise Pearson Correlations\n\
    ```\n\nClaire recalled explaining the findings in the following words:\n\n> Output\
    \ in Figure [2-10](#A432778_1_En_2_Chapter.html#Fig10) shows a grid in which the\
    \ Pearson correlation is computed between all features in the dataset and not\
    \ confined to just the correlations between exploratory variables and response\
    \ variable as we saw earlier in Figure [2-8](#A432778_1_En_2_Chapter.html#Fig8)\
    \ . A strong positive correlation has a value of 1, strong negative correlation\
    \ has a value of -1, and 0 indicates no correlation. By looking at the scatter\
    \ plot in Figure [2-8](#A432778_1_En_2_Chapter.html#Fig8) we had assumed that\
    \ there exists no correlation between age and concrete strength; however, the\
    \ statistical results in Figure [2-10](#A432778_1_En_2_Chapter.html#Fig10) say\
    \ otherwise; that is, there exists a slight positive correlation between the two\
    \ quantities. Visual deduction is prone to human error so we will go with the\
    \ latter (that is, there’s a slight positive correlation between the two quantities).\n\
    \nSmith, knowing how each exploratory variable correlates to the response variable,\
    \ was curious to investigate whether or not singularity or multicollinearity exists\
    \ in the dataset. This was exactly the next thing Claire had on list, and thus\
    \ she wrote the code in Listing [2-7](#A432778_1_En_2_Chapter.html#Par120).\n\n\
    ![A432778_1_En_2_Fig11_HTML.gif](A432778_1_En_2_Fig11_HTML.gif)\n\nFigure 2-11.\n\
    \nPair plot of all features in the dataset\n\n```\ndata_ = data[(data.T != 0).any()]\n\
    seaborn.        pairplot(data_, vars=data.columns, kind='reg')\nplt.show()\nListing\
    \ 2-7.\nCalculating Pair Plot Between All Features\n```\n\nClaire decided to first\
    \ explain to Smith what the code meant in Listing [2-7](#A432778_1_En_2_Chapter.html#Par120).\
    \ She pointed out an aspect obvious in Figure [2-8](#A432778_1_En_2_Chapter.html#Fig8)\
    \ (i.e., that some of the features in the dataset have value of 0 in majority).\
    \ She believed that having a majority of 0 values in the dataset can lead to correlation\
    \ coefficients and regression lines that do not cover the dataset in its true\
    \ essence. She started off by explaining that `data_= data[(data.T != 0).any()]`\
    \ meant deleting the records in columns having a value of 0. After doing that\
    \ she used `seaborn` `pairplot` to plot correlations between all features in the\
    \ dataset.\n\nWhile explaining the output in Figure [2-11](#A432778_1_En_2_Chapter.html#Fig11)\
    \ , Claire asked Smith to concentrate on column 1 and row 2. Claire recalled to\
    \ having explained that: “In many of the cases feature pairs don’t have a correlation\
    \ between them. Exception lies in two cases—that is, cement component and furnace\
    \ slag and cement component and fly ash—where we can see a strong negative correlation.”\n\
    \nSmith was overwhelmed by the insights he had gained so far. He had seen what\
    \ the plots looked like after zero was removed from the observations. He was curious\
    \ to determine how the correlation coefficients would look after zeros are removed\
    \ from the dataset. Moreover, he was aware that a Spearman correlation exists\
    \ between these features hence he was curious to see what correlation coefficients\
    \ it would present in the given situation. Finally, while looking at Figure [2-8](#A432778_1_En_2_Chapter.html#Fig8),\
    \ it seemed to Smith that all features were continuous except age, which looked\
    \ like a discrete variable to him as observations within age fell within one of\
    \ the seven discrete values, Smith was interested in splitting the data in to\
    \ age segments and compute the correlations for each of these splits to see a\
    \ strong correlation between the response variable and any of the exploratory\
    \ variables. Can you help Smith answer these questions? Give it a shot in the\
    \ following exercises.\n\n## Exercises\n\n1.  Remove zeros from the data features\
    \ and then recalculate the Pearson correlation. Any improvements in the correlation\
    \ coefficient?  \n2.  Determine Spearman correlation for features in the dataset.\
    \ Did this bring any marginal difference in the correlation scores?  \n3.  From\
    \ the scatter plot it seems that age is more of a discrete feature. Take the data\
    \ from each age one by one and calculate the Pearson correlations for the remaining\
    \ features. Does any specific age yield a good correlation between the response\
    \ variable and exploratory ones?\n\nNow that Claire and Smith understood the exploratory\
    \ variables that had a significant influence on concrete strength, and with knowledge\
    \ of where multicollinearity possibly exists, it was time to bring regression\
    \ into practice. Regression was required for them to come up with an equation\
    \ which can enable them to measure the concrete strength without the need of procuring\
    \ some special equipment to measure it. However, before proceeding with regression\
    \ models Claire felt she needed to make Smith aware of the important concepts\
    \ of overfitting and underfitting."
