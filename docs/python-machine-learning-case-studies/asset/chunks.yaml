    that patients who have their `AwaitingTime` in the third quartile are relatively
    more likely to not to show up, which supported her earlier laid null hypothesis—with
    increasing waiting time the likelihood of patient not showing up also increases.
    She also pointed out that the median in both the status instances is close to
