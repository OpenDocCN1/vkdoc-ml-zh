    训练准确率相对于决策树分类有所下降，这意味着模型没有高度泛化到训练数据集上，这确实是一个好迹象。同时，在查看图 5-13 时，Judy 博士注意到测试数据准确率有了显著提升，从
    0.59 跃升至 0.7。尽管在上述方面有所改进，但 ROC 的 AUC 值却下降了，这让她非常惊讶。在网上搜索了几个小时后，她仍然毫无头绪。因此，她决定去见她的朋友
