- fmt: "Zoe’s help enabled Dr. Judy to see clearly through the confusion. However,\
    \ she wasn’t yet satisfied with the accuracy of the models she had explored so\
    \ far. She was wondering whether techniques exist that can enable combining the\
    \ power of more than one model to build a model that can do predictions with top-notch\
    \ accuracy. After a thorough search, Dr. Judy found out that “ensemble” is the\
    \ term that describes the representation she desired. She also discovered that\
    \ ensemble techniques are subdivided into two types (i.e., Boosting and Bagging),\
    \ which she believed were important to understand before using them to train the\
    \ model.\n\n### Ensemble Methods\n\nAn ensemble method combines predictions from\
    \ multiple machine learning algorithms, which result in relatively more accurate\
    \ predictions than an individual model could have captured. Ensemble methods are\
    \ usually divided into two variants (Bagging and Boosting).\n\n#### Bagging\n\n\
    Bagging, also known as a bootstrap method, optimizes on minimizing the variance.\
    \ It does that by generating additional data for the training dataset using combinations\
    \ to produce multisets of same size as that of the original data. The application\
    \ of Bagging is ideal when the model overfits and you tend to go to higher variance.\
    \ This can be taken care of by taking many resamples, each overfitting, and averaging\
    \ them out together. This in turn cancels some of the variance.\n\n![A432778_1_En_5_Fig14_HTML.gif](A432778_1_En_5_Fig14_HTML.gif)\n\
    \nFigure 5-14. Basic work flow of Bagging algorithms\n\nDecision trees are sensitive\
    \ to specific data on which they are trained on. If training data is changed,\
    \ the resulting decision tree can be quite different and can yield different predictions.\
    \ A decision tree being a high-variance machine learning algorithm has the application\
    \ of Bagging by means of the bootstrap procedure.\n\nConsider a dataset that has\
    \ 50 features and 3,000 observations. Bagging might create 500 trees with 500\
    \ random observations for 20 features in each tree. Finally it will average out\
    \ the predictions for all of those 500 tree models to get the final prediction.\n\
    \n#### Boosting\n\nBoosting defines an objective function to measure the performance\
    \ of a model given a certain set of parameters. The objective function contains\
    \ two parts: regularization and training loss, both of which add to one another.\
    \ The training loss measures how predictive our model is on the training data.\
    \ The most commonly used training loss function includes mean squared error and\
    \ logistic regression. The regularization term controls the complexity of the\
    \ model, which helps avoid overfitting. Boosting trees use tree ensembles because\
    \ they sum together the prediction of multiple trees.\n\n![A432778_1_En_5_Fig15_HTML.gif](A432778_1_En_5_Fig15_HTML.gif)\n\
    \nFigure 5-15. Basic work flow of Boosting algorithms\n\nDr. Judy decided to put\
    \ Bagging into the application by applying the most sought Bagging technique (i.e.,\
    \ random forest classification).\n\n## Random Forest Classification\n\nRandom\
    \ forest classification is a type of Bagging, and it is one of the most powerful\
    \ machine learning algorithms available currently. In decision tree classification,\
    \ different subtrees can have a lot of structural similarities which can result\
    \ in prediction outputs that are strongly correlated to each other. The random\
    \ forest classifier reduces this correlation among the subtrees by limiting the\
    \ features at each split point. So, instead of choosing a variable from all variables\
    \ available, random forest searches for the variable that will minimize the error\
    \ from a limited random sample of features. For classification, the number of\
    \ variables at each split can be defined as follows:\n\n![A432778_1_En_5_Fig16_HTML.gif](A432778_1_En_5_Fig16_HTML.gif)\n\
    \nFigure 5-16. Illustration of random forest classifier\n\n*   Symbol: `m`\n*\
    \   Formula: `sqrt(p)`\n*   Where,\n    1.  `m` is the optimal number of variables\
    \ at each split\n    2.  `p` is the number of total variables in the dataset\n\
    \nRandom forest classifiers are fast and can work with data which is unbalanced\
    \ or has missing values. She wrote the code in Listing 5-30 to apply this ensemble\
    \ technique to the application.\n\n```\nclf = RandomForestClassifier()\nclf.fit(x_train,\
    \ y_train)\n```\n\nListing 5-30. Training RandomForest Classifier on Training\
    \ Dataset\n\nOutput\n\n```\nRandomForestClassifier(bootstrap=True, class_weight=None,\
    \ criterion='gini',\nmax_depth=None, max_features='auto', max_leaf_nodes=None,\n\
    min_impurity_split=1e-07, min_samples_leaf=1,\nmin_samples_split=2, min_weight_fraction_leaf=0.0,\n\
    n_estimators=10, n_jobs=1, oob_score=False, random_state=None,\nverbose=0, warm_start=False)\n\
    ```\n\nDr. Judy applied the random forest classifier with the default parameters\
    \ configuration. She then wrote the code snippet in Listing 5-31 to evaluate the\
    \ goodness of the random forest classifier model.\n\n```\ny_pred = clf.predict(x_test)\n\
    model_performance('Random Forest', x_train, y_train, y_test, y_pred)\n```\n\n\
    Listing 5-31. Finding Accuracy of the Random Forest Classifier Model\n\nOutput\n\
    \n![A432778_1_En_5_Fig17_HTML.gif](A432778_1_En_5_Fig17_HTML.gif)\n\nFigure 5-17.\
    \ ROC curve for random forest classifier\n\n```\nModel name: Random Forest\nTest\
    \ accuracy (Accuracy Score):           0.640874\nTest accuracy (ROC AUC Score):\
    \            0.534295\nTrain accuracy:                           0.990071\nArea\
    \ Under the Precision-Recall Curve:    0.132014\n```\n\nTrain accuracy resembled\
    \ that of the decision tree classifier. It appeared that both of the tree classifier\
    \ techniques overfitted the model. However, contrary to the decision tree classifier,\
    \ test accuracy of the random forest classifier increased considerably. However,\
    \ the test level accuracy was nowhere close to that gained from the SGD classifier\
    \ with kernel approximation (i.e., 0.7 vs. 0.64).\n\nHaving applied the random\
    \ forest classifier, Dr. Judy was interested to see if the boosting ensemble would\
    \ yield a strong model or not. For that purpose she planned to apply gradient\
    \ boosting to the train-test split obtained from Listing 5-24."
