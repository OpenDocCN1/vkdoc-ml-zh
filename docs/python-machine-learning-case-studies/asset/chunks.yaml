    在查看图 5-8 后，朱迪博士推断，等待时间处于第三四分位数的患者相对更有可能爽约，这支持了她先前提出的零假设——随着等待时间的增加，患者爽约的可能性也会增加。她还指出，两种状态实例的中位数都接近于零。


    探索性数据分析为朱迪博士提供了许多见解，她对此感到非常兴奋。总结来看，她观察到短信提醒提高了患者准时赴约的可能性。她还注意到，年轻患者更常不在预约时间出现，而年长患者则更为自律，能够准时赴约。此外，她还发现等待时间长的患者决定不在预约日期和时间出现。朱迪博士现在清楚地认识到，爽约是造成损失的原因，并且她已深入了解导致人们表现出这种行为的原因。现在，她计划继续前进，构建一个分类模型来预测患者未来是否会准时出现。这很重要，因为如果她知道某一天、某一周或某一个月内会出现的患者总数，她就可以相应地调整资源以节省成本。然而，在开始分类之前，她想知道是否可以通过特征生成的方式，从现有特征中提取更多特征。她相信这将有助于她捕捉数据集中的变异性和明确模式。


    ## 特征生成


    在机器学习中，数据集中的观测值和特征集数量越多，模型就越有可能捕捉到其中的变异性，从而理解其真实本质。朱迪博士知道增加观测值数量是不可行的；不过，她可以增加数据集中的特征集。朱迪博士对于如何从现有特征中提取更多特征毫无头绪。经过深思熟虑，她决定将包含日期的特征分解为更细粒度的日期组成部分。她编写了代码清单
    5-21 中的代码片段，将其逻辑应用于名为 AppointmentRegistration 和 AppointmentDate 的特征。


    ```

    for col in [''AppointmentRegistration'', ''ApointmentData'']:

    for index, component in enumerate([''year'', ''month'', ''day'']):

    data[''%s_%s''%(col, component)] = data[col].apply(lambda x: int(x.split(''T'')[0].split(''-'')[index]))

    代码清单 5-21.

    将日期特征分解为日期组成部分

    ```


    朱迪博士解释说，代码清单 5-21 中的代码片段将 AppointmentRegistration 和 AppointmentData 特征分解为各自的年、月、日组成部分。然而，它没有将它们分解为时间组成部分，因为
    AppointmentData 的字符串对象中不包含时间组成部分，而 AppointmentRegistration 特征则包含。因此，她编写了代码清单 5-22
    中的代码，将 AppointmentRegistration 特征也分解为其时间组成部分。


    ```

    for index, component in enumerate([''hour'', ''min'', ''sec'']):

    data[''%s_%s''%(''AppointmentRegistration'', component)] = data[''AppointmentRegistration''].apply(

    lambda x: int(x.split(''T'')[1][:-1].split('':'')[index]))

    代码清单 5-22.

    将 AppointmentRegistration 分解为时间组成部分

    ```


