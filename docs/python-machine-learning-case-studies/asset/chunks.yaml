    4.  Step 2 is repeated again.  


    You might note that steps 1 and 3 resemble each other, the difference being that
    in step 1, centroids are chosen at random, whereas in step 3 they are calculated
    by taking the mean of observations within each of those clusters.


    Then steps 2 and 4 are a repetition of the same step. Steps 3 and 4 are iterated
    until the clusters converge—that is, cluster memberships remain constant for all
    observations in the dataset. This maximizes the distance between clusters and
    minimizes the distance among the observations within each cluster. k-means clustering
    does not always find the most optimal configuration while minimizing the global
    objective function. The clustering algorithm is highly sensitive to how cluster
    centers are initially selected.


    Ross now fully understood how convergence is performed in a k-means clustering
    algorithm. However, he was clueless on as to what value of k (i.e., number of
    clusters he should specify upfront) would be optimal for the data at hand. He
    recalled having seen an article on k-means clustering on Linkedin. Hence he searched
    for the person who had posted that article and then messaged him asking for his
    assistance in this regard. His connection, Pollack, suggested that Ross use the
    following methods:


    *   Elbow method

    *   Variance explained

    *   BIC score


    He started off by looking at how the Elbow method works and then applied it to
    find the number of clusters optimal to the model.'
