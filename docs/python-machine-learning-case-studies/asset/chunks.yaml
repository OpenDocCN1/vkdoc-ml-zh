    #### 混淆矩阵


    混淆矩阵统计了真负例、假正例、假负例和真正例的数量。


    ![A432778_1_En_5_Fig9_HTML.gif](img/A432778_1_En_5_Fig9_HTML.gif)


    图 5-9.


    混淆矩阵及其对应公式


    *   **真负例**：模型正确地将 0 预测为 0 的实例频次。

    *   **假负例**：模型将 1 错误预测为 0 的实例频次。

    *   **真正例**：模型正确地将 1 预测为 1 的实例频次。

    *   **假正例**：模型将 0 错误预测为 1 的实例频次。


    在研究过程中，Judy 博士发现了一个混淆矩阵的简化版本，该版本以可视化形式展示模型评估结果。


    #### 二分类：接收者操作特征


    理解 ROC（接收者操作特征）曲线背后机制的一个好方法是通过混淆矩阵。ROC 曲线以图形方式绘制了当判别阈值变化时二分类器的性能。请牢记以下术语：


    *   **真正例率 (TPR)**：即灵敏度、召回率或检测概率

    *   **假正例率 (FPR)**：即 1 - 特异度、真负例率或误报概率


    例如，考虑同一个数据集，模型将在该数据集上训练以预测未来高度可能违约的人群。我们将数据按 70/30 比例拆分，这意味着模型将使用 70% 的观测值进行训练，并使用
    30% 的观测值进行测试。在使用模型对 30% 的观测值进行预测后，我们得到了表 5-4 中的图表。


    表 5-4.


    实际数据与预测数据的违约频次


    |   | 将会违约 | 不会违约 |

    | --- | --- | --- |

    | 实际值 | 30 | 70 |

    | 正确预测值 | 19 | 36 |


    此例中，TPR 为 19/30 ≈ 63%。而 FPR 为 36/70 ≈ 51%。


    ![A432778_1_En_5_Fig10_HTML.gif](img/A432778_1_En_5_Fig10_HTML.gif)


    图 5-10.


    ROC 曲线及其相互间的相对比较


    ROC 曲线绘制了正例中真正例的比例（即 TPR）与负例中假正例的比例（即 FPR）之间的关系。或者换句话说，我们可以说 ROC 曲线是作为误报率函数的灵敏度。它绘制了一个累积分布函数，有助于选择可能最优的模型。


    曲线上的准确率由曲线下面积 (AUC) 表示。其值范围在 0.0 到 1.0 之间。


    Judy 博士决定定义一个方法，该方法将接收实际数据并预测模型的优良性。为此，她编写了清单 5-24 中的代码片段。


    ```

    def model_performance(model_name, X_train, y_train, y_test, Y_pred):

    print ''Model name: %s''%model_name

    print ''Test accuracy (Accuracy Score): %f''%metrics.accuracy_score(y_test, Y_pred)

    print ''Test accuracy (ROC AUC Score): %f''%metrics.roc_auc_score(y_test, Y_pred)

    print ''Train accuracy: %f''%clf.score(X_train, y_train)

    fpr, tpr, thresholds = metrics.precision_recall_curve(y_test, Y_pred)

    print ''Area Under the Precision-Recall Curve: %f''%metrics.auc(fpr, tpr)

    false_positive_rate, true_positive_rate, thresholds = metrics.roc_curve(y_test,
    Y_pred)

    roc_auc = metrics.auc(false_positive_rate, true_positive_rate)

    plt.title(''Receiver Operating Characteristic'')

    plt.plot(false_positive_rate, true_positive_rate, ''b'',

    label=''AUC = %0.2f''% roc_auc)

    plt.legend(loc=''lower right'')

    plt.plot([0,1],[0,1],''r--'')

    plt.xlim([-0.1,1.2])

    plt.ylim([-0.1,1.2])

    plt.ylabel(''True Positive Rate'')

    plt.xlabel(''False Positive Rate'')

    plt.show()

    清单 5-24.

    声明一个函数，通过应用先前学习的方法来检测模型的准确率

    ```


    为了对模型进行交叉验证，Judy 博士知道她必须将数据拆分为训练数据和测试数据。


    ### 通过拆分数据集确保交叉验证


    Judy 博士计划使用训练数据集训练模型，然后使用该模型预测测试数据集中的值。她这样做是为了确定模型的优良性。她为训练/测试拆分编写了清单 5-25 中的代码。


    ```

    features_of_choice = [u''Age'', u''Gender'', ''DayOfTheWeek'', ''Diabetes'', ''Alcoolism'',
    ''HiperTension'',

    ''Smokes'', ''Scholarship'', ''Tuberculosis'', ''Sms_Reminder'',

    ''AwaitingTime'', ''AppointmentRegistration_year'', ''AppointmentRegistration_month'',

    ''AppointmentRegistration_day'', ''ApointmentData_year'', ''ApointmentData_month'',

    ''ApointmentData_day'', ''AppointmentRegistration_hour'', ''AppointmentRegistration_min'',

    ''AppointmentRegistration_sec'']

    x = np.array(data[features_of_choice])

    y = np.array(data[''Status''])

    x_train, x_test, y_train, y_test = train_test_split(x, y, test_size=0.3, random_state=1)

    清单 5-25.

    声明用于模型训练的特征，并将数据拆分为训练集和测试集

    ```


    Judy 博士在清单 5-25 中解释了她的逻辑。她编写代码进行 70-30 拆分，其中 70% 的观测值归入训练集，30% 的观测值归入测试数据集。


    在应用分类模型之前，她认为最好先回顾一下最初进行分类的原因。借助探索性分析，她已经找出了反复出现损失的原因。然后，她决定更进一步，为这个问题寻找补救措施。她决定使用分类作为一种辅助手段，来预测患者是否会在其预约日期出现。这将使管理层能够执行以下任一操作：


    *   缩减人力资源（即员工和医生）以降低成本

    *   确定患者未出现的原因，并找到该问题的解决方案


    在审视分类问题时，Judy 博士唯一能想到的可视化表示就是树。就像 Status 的情况一样，树将有一个父节点和两个子节点（即出现和未出现）。在搜索分类模型时，她发现了一种可视化表示：决策树分类。

