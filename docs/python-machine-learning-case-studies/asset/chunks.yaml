    南希和埃里克进行的多变量分析得出了一些有价值的见解。然而，南希好奇是否存在一些统计检验可以确定两个变量之间关系的强度。她想利用这些信息来确定对行程时长影响最大的特征。埃里克脑海中浮现出相关性的概念，他决定在继续分析之前先分享自己的知识基础。


    ## 相关性


    相关性指的是两个定量特征之间关系的强度和方向。相关性值为 1 表示正方向上的强相关，而相关性值为 -1 表示负方向上的强相关。值为 0 表示定量特征之间没有相关性。请注意，相关性并不意味着因果关系；也就是说，一个实体的变化并不强制导致另一个实体的变化。


    属性与自身的相关性意味着相关性值为 1。许多机器学习算法由于存在多重共线性而无法提供最佳性能。多重共线性指的是所选特征之间存在相关性，因此通常建议在将数据集中的特征纳入分析之前，检查所有特征之间的两两相关性。


    以下是最常见的相关性类型：


    ### 皮尔逊 R 相关系数


    皮尔逊 R 相关系数是三种方法中最常见的，通常适用于计算两个线性相关且似乎呈正态分布的定量变量之间的关系。例如，以股票市场中两只密切相关的证券为例，考察它们之间的关系程度。


    ### 肯德尔秩相关系数


    与适用于正态分布数据的皮尔逊相关系数相比，肯德尔秩相关系数是一种非参数检验，用于确定两个定量特征之间关系的强度和方向。非参数技术针对的是正态分布以外的分布。相反，参数技术则针对正态分布。

    '
- fmt: '### Spearman Rank Correlation


    Spearman rank correlation is a non-parametric test just like Kendall rank correlation,
    with the difference that Spearman rank correlation does not make any assumptions
    about the distribution of the data. Spearman rank correlation is most suitable
    for ordinal data.


    Nancy was interested to see if change in age brings a linear change to trip duration.
    For that Eric decided to bring Pearson R correlation into practice and decided
    to make a scatter plot between the two quantities for them to see the relationship
    visually.


    ```

    data = data.dropna()

    seaborn.pairplot(data, vars=[''age'', ''tripduration''], kind=''reg'')

    plt.show()

    Listing 1-25.

    Pairplot of trip duration and age

    ```


