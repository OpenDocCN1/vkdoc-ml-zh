    to as a standard normal distribution. Figure [1-12](#A432778_1_En_1_Chapter.html#Fig12)
    shows normal distribution along with confidence intervals.


    ![A432778_1_En_1_Fig12_HTML.gif](A432778_1_En_1_Fig12_HTML.gif)


    Figure 1-12.


    Normal distribution and confidence levels


    These are the most common confidence levels:


    | Confidence level | Formula |

    | --- | --- |

    | 68% | Mean ± 1 std. |

    | 95% | Mean ± 2 std. |

    | 99.7% | Mean ± 3 std. |


    #### Skewness


    Skewness is a measure of the lack of symmetry. The normal distribution shown previously
    is symmetric and thus has no element of skewness. Two types of skewness exist
    (i.e., positive and negative skewness).


    ![A432778_1_En_1_Fig13_HTML.gif](A432778_1_En_1_Fig13_HTML.gif)


    Figure 1-13.


    Skewed and symmetric normal distributions


    As seen from Figure [1-13](#A432778_1_En_1_Chapter.html#Fig13), a relationship
    exists among measure of centers for each one of the following variations:


    *   Symmetric distributions: Mean = Median = Mode

    *   Positively skewed: Mean < Median < Mode

    *   Negatively skewed: Mean > Median > Mode


    Going through Figure [1-12](#A432778_1_En_1_Chapter.html#Fig12) you will realize
    that the distribution in Figure [1-13(c)](#A432778_1_En_1_Chapter.html#Fig13)
    has a long tail on its right. This might be due to the presence of outliers.'
