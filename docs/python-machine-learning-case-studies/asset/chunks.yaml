    find any definitive pattern between trip duration and age. There is a minor positive
    correlation, as explained in Figure [1-18](#A432778_1_En_1_Chapter.html#Fig18)


    ![A432778_1_En_1_Fig18_HTML.gif](A432778_1_En_1_Fig18_HTML.gif)


