- fmt: '### Decision Tree Classification


    Decision trees form a tree in a hierarchical fashion with each node having a decision
    boundary to proceed downward. The tree stops branching out at the level where
    there are no more splits possible. Interior nodes represent input variables having
    edges to each of the children. Children split the values from the input variable.
    They do that by partitioning the data at each level with nodes branching out to
    children. This behavior is known as recursive partitioning. Decision trees are
    easy to interpret and time efficient, and hence they can work well with large
    datasets. Decision trees can also handle both numerical and categorical data,
    that is, regression in case of numerical and classification in case of categorical
    data. However, the accuracy of decision trees is not as good as that produced
    by other machine learning classification algorithms.


    Moreover, decision trees generalize highly to the training dataset and thus are
    highly susceptible to overfitting. A decision tree aims to partition the data
    so that each of the partitioned instances has similar/homogeneous values. ID3
    algorithms are used to calculate the homogeneity of a sample, and if it is completely
    homogeneous it translates into an entropy of 0 and into a value of 1 or vice versa.
    A decision tree is a form of a parametric supervised learning method, and by parametric
    we mean that it can be applied to any data regardless of its underlying distribution.


    Dr. Judy wrote the code in Listing [5-26](#A432778_1_En_5_Chapter.html#Par134)
    to train the decision tree classification model on a training dataset. She used
    the test-train split variables (i.e., `y_test`, `y_train`, `x_test`, `x_train`)
    from Listing [5-25](#A432778_1_En_5_Chapter.html#Par125).


    ```

    clf = DecisionTreeClassifier()

    clf.fit(x_train, y_train)

    Listing 5-26.

    Training the Model by Applying Decision Tree Classifier

    ```


    Output


    ```

    DecisionTreeClassifier(class_weight=None, criterion=''gini'', max_depth=None,

    max_features=None, max_leaf_nodes=None, min_samples_leaf=1,

    min_samples_split=2, min_weight_fraction_leaf=0.0,

    presort=False, random_state=None, splitter=''best'')

    ```


    Dr. Judy pointed out that because no configuration parameters were passed to the
    decision tree classifier, it took the default values of configuration parameters.
    The next step was to apply the trained model on a testing dataset to find the
    predicted labels of Status. She then aimed to compare the predicted labels to
    the original label of Status to calculate accuracy of the model.


    ```

    y_pred = clf.predict(x_test)

    model_performance(''Decision tree classifier'', x_train, y_train, y_test, y_pred)

    Listing 5-27.

    Finding Accuracy of Decision Tree Classifier

    ```


    Output


    ![A432778_1_En_5_Fig11_HTML.gif](A432778_1_En_5_Fig11_HTML.gif)


    Figure 5-11.


    ROC curve for decision tree model


    ```

    Model name: Decision tree classifier

    Test accuracy (Accuracy Score):           0.589040

    Test accuracy (ROC AUC Score):            0.523605

    Train accuracy:                           0.999952

    Area Under the Precision-Recall Curve:    0.112530

    ```


    Dr. Judy explained that the model was trained on `x_train`, and `y_train`. The
    trained model (i.e., `clf`) was then used to predict the labels of the test dataset
    (i.e., `y_pred`). Her output of Listing [5-27](#A432778_1_En_5_Chapter.html#Par138)
    presented the perfect representation of overfitting as the train accuracy was
    approaching 1. Test data accuracy came out to be subpar as the value was 0.5,
    which was distant from 1 (i.e., the perfect score). Dr. Judy was disappointed
    by the results but didn’t lose hope as she had many more classification techniques
    to experiment with.


    Dr. Judy was curious to know if techniques exist to enable non-linear learning
    for classification models. The search for such a technique brought her to the
    concept of kernel approximation.


    ## Kernel Approximation


    Kernel approximation performs non-linear transformations of the input to make
    it suitable for linear classification and other algorithms. This is better than
    kernel trick as it can significantly reduce the cost of learning with very large
    datasets. The combination of kernel map approximations with SGD classifier can
    make non-linear learning on large datasets possible.


    ### SGD Classifier


    In SGD classifier, the gradient of the loss is updated one sample at a time, and
    the model is updated with respect to the learning rate. In order for the model
    to give the best results on default learning rate, the data should have zero mean
    and unit variance.


    ![A432778_1_En_5_Fig12_HTML.gif](A432778_1_En_5_Fig12_HTML.gif)


    Figure 5-12.


    SGD classification results on Iris dataset


    This algorithm works best with data which is represented as sparse arrays of floating
    point values for features within the dataset. Loss parameter controls the model
    it fits, which is Linear Support Vector Machine (SVM) by default.


    Without waiting any longer, Dr. Judy wrote the code snippet in Listing [5-28](#A432778_1_En_5_Chapter.html#Par147)
    to train kernel approximation along with the SGD classifier model on the training
    dataset.


    ```

    rbf_feature = kernel_approximation.RBFSampler(gamma=1, random_state=1)

    X_train = rbf_feature.fit_transform(x_train)

    clf = SGDClassifier()

    clf.fit(X_train, y_train)

    Listing 5-28.

    Training the Model by Applying Kernel Approximation with SGD Classifier

    ```


    Output


    ```

    SGDClassifier(alpha=0.0001, average=False, class_weight=None, epsilon=0.1,

