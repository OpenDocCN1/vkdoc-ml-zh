- fmt: '### Outliers


    Outliers refer to the values distinct from majority of the observations. These
    occur either naturally, due to equipment failure, or because of entry mistakes.


    In order to understand what outliers are, we need to look at Figure [1-14](#A432778_1_En_1_Chapter.html#Fig14).


    ![A432778_1_En_1_Fig14_HTML.gif](A432778_1_En_1_Fig14_HTML.gif)


    Figure 1-14. Illustration of outliers using a box plot


    From Figure [1-14](#A432778_1_En_1_Chapter.html#Fig14) we can see that the observations
    lying outside the whiskers are referred to as the outliers.


    ```

    [Q1 – 1.5 (IQR) ,  Q3 + 1.5 (IQR) ] (i.e. IQR = Q3 - Q1)

    Listing 1-17.

    Interval of Values Not Considered Outliers

    ```


    Values not lying within this interval are considered outliers. Knowing the values
    of `Q1` and `Q3` is fundamental for this calculation to take place.


    Is the presence of outliers good in the dataset? Usually not! So, how are we going
    to treat the outliers in our dataset? Following are the most common methods for
    doing so:


    - **Remove the outliers**: This is only possible when the proportion of outliers
    to meaningful values is quite low, and the data values are not on a time series
    scale. If the proportion of outliers is high, then removing these values will
    hurt the richness of data, and models applied won’t be able to capture the true
    essence that lies within. However, in case the data is of a time series nature,
    removing outliers from the data won’t be feasible, the reason being that for a
    time series model to train effectively, data should be continuous with respect
    to time. Removing outliers in this case will introduce breaks within the continuous
    distribution.

    - **Replace outliers with means**: Another way to approach this is by taking the
    mean of values lying with the interval shown in Figure [1-14](#A432778_1_En_1_Chapter.html#Fig14),
    calculate the mean, and use these to replace the outliers. This will successfully
    transform the outliers in line with the valid observations; however, this will
    remove the anomalies that were otherwise present in the dataset, and their findings
    could present interesting insights.

    - **Transform the outlier values**: Another way to cop up with outliers is to
    limit them to the upper and lower boundaries of acceptable data. The upper boundary
    can be calculated by plugging in the values of `Q3` and `IQR` into `Q3 + 1.5IQR`
    and the lower boundary can be calculated by plugging in the values of `Q1` and
    `IQR` into `Q1 – 1.5IQR`.

    - **Variable transformation**: Transformations are used to convert the inherited
    distribution into a normal distribution. Outliers bring non-normality to the data
    and thus transforming the variable can reduce the influence of outliers. Methodologies
    of transformation include, but are not limited to, natural log, conversion of
    data into ratio variables, and so on.


    Nancy was curious to find out whether outliers exist within our dataset—more precisely
    in the `tripduration` feature. For that Eric decided to first create a box plot
    (see Figure [1-15](#A432778_1_En_1_Chapter.html#Fig15)) by writing code in Listing
    [1-18](#A432778_1_En_1_Chapter.html#Par202) to see the outliers visually and then
    checked the same by applying the interval calculation method in Listing [1-19](#A432778_1_En_1_Chapter.html#Par204).


    ```

    box = data.boxplot(column=[''tripduration''])

    plt.show()

    Listing 1-18.

    Plotting a Box plot of Trip Duration

    ```


    ![A432778_1_En_1_Fig15_HTML.gif](A432778_1_En_1_Fig15_HTML.gif)


    Figure 1-15. Box plot of trip duration


    Nancy was surprised to see a huge number of outliers in trip duration from the
    box plot in Figure [1-15](#A432778_1_En_1_Chapter.html#Fig15). She asked Eric
    if he could determine the proportion of trip duration values which are outliers.
    She wanted to know if outliers are a tiny or majority portion of the dataset.
    For that Eric wrote the code in Listing [1-19](#A432778_1_En_1_Chapter.html#Par204).


    ```

    q75, q25 = np.percentile(trip_duration, [75 ,25])

    iqr = q75 - q25

    print ''Proportion of values as outlier: %f percent''%(

    (len(data) - len([x for x in trip_duration if q75+(1.5*iqr) >=x>= q25-(1.5*iqr)]))*100/float(len(data)))

    Listing 1-19.

    Determining Ratio of Values in Observations of tripduration Which Are Outliers

    ```


    Output


    ```

    Proportion of values as outlier: 9.548218 percent

    ```


    Eric explained the code in Listing [1-19](#A432778_1_En_1_Chapter.html#Par204)
    to Nancy as follows:


    > As seen in Figure [1-14](#A432778_1_En_1_Chapter.html#Fig14), `Q3` refers to
    the 75th percentile and `Q1` refers to the 25th percentile. Hence we use the `numpy.percentile()`
    method to determine the values for `Q1` and `Q3`. Next we compute the `IQR` by
    subtracting both of them. Then we determine the subset of values by applying the
    interval as specified in Listing [1-18](#A432778_1_En_1_Chapter.html#Par202).
    We then used the formula to get the number of outliers.


    ```

    Number of outliers values = Length of all values - Length of all non outliers
    values

    Listing 1-20.

    Formula for Calculating Number of Outliers

    ```


    In our code, `len(data)` determines Length of all values and Length of all non
    outliers values is determined by `len([x for x in trip_duration if q75+(1.5*iqr)
    >=x>= q25-(1.5*iqr)])`.


    Hence then the formula in Listing [1-20](#A432778_1_En_1_Chapter.html#Par209)
    was applied to calculate the ratio of values considered outliers.


    ```

    Ratio of outliers = ( Number of outliers values / Length of all values ) * 100

    Listing 1-21.

    Formula for Calculating Ratio of Outlier Values

    ```


    Nancy was relieved to see only 9.5% of the values within the dataset to be outliers.
    Considering the time series nature of the dataset she knew that removing these
    outliers wouldn’t be an option. Hence she knew that the only option she could
    rely on was to apply transformation to these outliers to negate their extreme
    nature. However, she was interested in observing the mean of the non-outlier values
    of trip duration. This she then wanted to compare with the mean of all values
    calculated earlier in Listing [1-15](#A432778_1_En_1_Chapter.html#Par176).


    ```

    mean_trip_duration = np.mean([x for x in trip_duration if q75+(1.5*iqr) >=x>=
    q25-(1.5*iqr)])

    upper_whisker = q75+(1.5*iqr)

    print ''Mean of trip duration: %f''%mean_trip_duration

    Listing 1-22.

    Calculating z scores for Observations Lying Within tripduration

    ```


    Output


    ```

    Mean of trip duration: 711.726573

    ```


    The mean of non-outlier trip duration values in Listing [1-22](#A432778_1_En_1_Chapter.html#Par214)
    (i.e., approximately 712) is considerably lower than that calculated in the presence
    of outliers in Listing [1-15](#A432778_1_En_1_Chapter.html#Par176) (i.e., approximately
    1,203). This best describes the notion that mean is highly affected by the presence
    of outliers in the dataset.


    Nancy was curious as to why Eric initialized the variable `upper_whisker` given
    that it is not used anywhere in the code in Listing [1-22](#A432778_1_En_1_Chapter.html#Par214).
    Eric had a disclaimer for this: “`upper_whisker` is the maximum value of the right
    (i.e., positive) whisker i.e. boundary uptill which all values are valid and any
    value greater than that is considered as an outlier. You will soon understand
    why we initialized it over here.”


    Eric was interested to see the outcome statistics once the outliers were transformed
    into valid value sets. Hence he decided to start with a simple outlier transformation
    to the mean of valid values calculated in Listing [1-22](#A432778_1_En_1_Chapter.html#Par214).


    ```

    def transform_tripduration(x):

    if x > upper_whisker:

    return mean_trip_duration

    return x

    data[''tripduration_mean''] = data[''tripduration''].apply(lambda x: transform_tripduration(x))

    data[''tripduration_mean''].plot.hist(bins=100, title=''Frequency distribution
    of mean transformed Trip duration'')

    plt.show()

    Listing 1-23.

    Calculating Mean Scores for Observations Lying Within tripduration

    ```'
