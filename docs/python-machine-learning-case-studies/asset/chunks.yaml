    Support vector machines constructs hyperplane (s) for the purposes of classification
    and regression (see Figure [2-28](#A432778_1_En_2_Chapter.html#Fig28)). The goal
    is to have the largest separation between the two classes. This is ensured by
    maximizing the distance between the hyperplane and the data point on each side.
    During this process the sets are often not linearly separable in that space, and
    thus we are advised to map it to a high-dimensional space (i.e., by introducing
    kernels).


