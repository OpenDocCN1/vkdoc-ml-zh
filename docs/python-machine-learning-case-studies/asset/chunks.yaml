    ## Tests to Determine If a Time Series Has Autocorrelation


    Autocorrelation is the correlation between the series at current time with a lagged
    version of itself. While reading the literature about autocorrelation, David learned
    that autocorrelation exists in two variants.


    ### Autocorrelation Function


    Autocorrelation function (ACF) determines the correlation of time series along
    with a lagged version of itself. For example, data with ten observations and with
    a lag of 5 will have the correlation between the following series calculated:


    *   `t4`, `t5`, `t6`, `t7`, `t8`, `t9`

    *   `t0`, `t1`, `t2`, `t3`, `t4`, `t5`


    ### Partial Autocorrelation Function


    Partial autocorrelation function (PACF) also measures the correlation of a time
    series along with a lagged version of itself except that it eliminates the variations
    already explained by the prior comparisons. For example, as in our case, with
    a lag of 5, it will remove the variations already captured between `t0` and `t3`.


    Now that David knew what autocorrelation is, his next step was to determine the
    methodologies available to measure it within the log transformed differencing
    applied time series.'
