    史密斯很好奇克莱尔会使用哪些技术来解决这个问题。克莱尔认为这个问题是回归分析的理想应用，因为响应变量（混凝土抗压强度）是一个定量指标，并且她关注的是找出影响混凝土抗压强度的因素。这些影响因素，按其成分比例缩放并加总后，可以得出混凝土的抗压强度。因此，这将使得无需为手头问题专门采购任何设备就能计算混凝土抗压强度。为了帮助史密斯理解什么是回归分析，她整理了一些关于该主题的信息。\n\
    \n## 回归分析的概念\n\n回归分析描述了一个解释变量（即自变量）与一个响应变量（即因变量）之间的关系。解释变量也被称为预测变量，其数量可以多于一个。回归分析被用于预测和预报领域。回归分析用于确定，当其中一个解释变量变化而其他自变量保持不变时，响应变量的变化。这样做是为了理解每个解释变量所展现的关系。请注意，无论用于预测离散响应变量的分类方法如何，回归分析都用于预测本质上是连续的响应变量。回归分析的一个基本变体是线性回归。\n\
    \n### 内插与外推\n\n外推是指使用回归分析来预测响应变量的值，这些值超出了最初用于训练模型的解释变量值的范围。这些数据不用于训练模型，在图 2-1\
    \ 中用虚线表示。\n\n![A432778_1_En_2_Fig1_HTML.gif](img/A432778_1_En_2_Fig1_HTML.gif)\n\
    \n图 2-1.\n\n内插和外推的可视化表示\n\n回归模型将在手头的数据上拟合/训练（即，用实线表示的内插部分），然后训练好的模型将用于对虚线表示的部分进行外推。因此，内插是在已知数据上进行的，而外推是在未知数据上进行的。\n\
    \n### 线性回归\n\n线性回归是回归分析的一种形式，其中使用一个解释变量来预测响应变量的结果。它在数学上可以定义如下：\n\n*   符号：y\n*\
    \   公式：y = b [0] + b [1] x + e\n*   说明：\n    *   y：响应变量\n    *   x：解释变量\n    *\
    \   b [0]：斜率\n    *   b [1]：截距\n    *   e：回归残差\n\n图 2-2 直观地展示了这个方程。\n\n![A432778_1_En_2_Fig2_HTML.gif](img/A432778_1_En_2_Fig2_HTML.gif)\n\
    \n图 2-2.\n\n线性回归最佳拟合线及回归系数说明\n\n请注意，在图 2-2 中，截距是最佳拟合线与 y 轴相交的点。回归残差是响应变量的实际值与预测值之间的差值。\n\
    \n### y 对 x 的最小二乘回归线\n\n最小二乘回归线使得数据点到该线的垂直距离的平方和尽可能小。它在数学上可以定义如下：\n\n*   符号：![$$\
    \ \\widehat{y} $$](img/A432778_1_En_2_Chapter_IEq1.gif)\n*   公式：![$$ \\widehat{y}={b}_0+{b}_1x\
    \ $$](img/A432778_1_En_2_Chapter_IEq2.gif)\n*   进一步推导：\n    *   ![$$ {b}_1=r\\\
    frac{s_y}{s_x} $$](img/A432778_1_En_2_Chapter_Equa.gif)\n\n    *   ![$$ {b}_0=\\\
    overset{\\acute{\\mkern6mu}}{y}-{b}_1\\overset{\\acute{\\mkern6mu}}{x} $$](img/A432778_1_En_2_Chapter_Equb.gif)\n\
    \n*   最小二乘回归线总是通过点 (![$$ \\overset{\\acute{\\mkern6mu}}{x},\\overset{\\acute{\\\
    mkern6mu}}{y} $$](img/A432778_1_En_2_Chapter_IEq3.gif))\n\n图 2-3 中的图示使用了线性回归（即一个解释变量）来描述最小二乘回归线所采用的方法。y\
    \ 表示响应变量，而 x 表示解释变量。图中显示了数据点到直线的垂直距离，并且最佳拟合回归线被视为穿过这些数据点的中心。因此，这确保了每个数据点的残差平方被最小化。\n\
    \n![A432778_1_En_2_Fig3_HTML.gif](img/A432778_1_En_2_Fig3_HTML.gif)\n\n图 2-3.\n\
    \n残差\n"
- fmt: "### Multiple Regression\n\nMultiple regression is a type of regression in\
    \ which more than one exploratory variable is used to predict the outcome of a\
    \ response variable. Multiple regression is mathematically defined as follows:\n\
    \n- Symbol: `y`\n- Formula: `y = b[0] + b[1]x[1] + b[2]x[2] + b[3]x[3] + ... +\
    \ b[t]x[t] + e`\n- Illustration:\n    - `y`: Response variable\n    - `x[1], x[2],\
    \ x[3], ..., x[t]`: Explanatory variable\n    - `b[0]`: Slope\n    - `b[1], b[2],\
    \ b[3], ..., b[t]`: Intercepts\n    - `e`: Regression residual\n\nThe formula\
    \ above can also be referred to as the equation of regression. Essentially, one\
    \ is trying to find optimal values for all coefficients such can give the best\
    \ possible value of `y` given all `x`. In the case of single variable, it’s a\
    \ line (i.e., linear regression), as shown in Figure [2-3](#A432778_1_En_2_Chapter.html#Fig3),\
    \ but in case of multiple variables it becomes a plane, as shown in Figure [2-4](#A432778_1_En_2_Chapter.html#Fig4).\n\
    \n![A432778_1_En_2_Fig4_HTML.gif](A432778_1_En_2_Fig4_HTML.gif)\n\nFigure 2-4.\
    \ Multiple regression with two exploratory and one response variables explained\n\
    \nPlugging optimal values of coefficients (i.e., slope and intercepts) back in\
    \ the formula above will yield us an equation. Unknown values in this equation\
    \ will be the `x` values, which are the exploratory variable values in this case.\
    \ For any given value of `x`, the equation will return us with a prediction.\n\
    \n### Stepwise Regression\n\nThis type of regression is a customized version of\
    \ multiple regression. Rather than using all exploratory variables for predicting\
    \ the outcome, stepwise regression automatically selects the independent variables\
    \ from a given pool which can yield a best fit line. This can be done by doing\
    \ either of the following:\n\n- Try out one exploratory variable at a time and\
    \ use that for fitting the regression model. Incorporate that exploratory variable\
    \ if found statistically significant.\n- Run multiple regression on all exploratory\
    \ variables and use the one that is most statically significant to determine the\
    \ best fitted regression line.\n\nFigure [2-5](#A432778_1_En_2_Chapter.html#Fig5)\
    \ best describes the methodology adopted by stepwise regression.\n\n![A432778_1_En_2_Fig5_HTML.gif](A432778_1_En_2_Fig5_HTML.gif)\n\
    \nFigure 2-5. Flowchart of stepwise regression Source:.slideshare.net/bzinchenko/quant-trader-algorithms\n\
    \nHowever, as per some statisticians, this approach inherits the following problems:\n\
    \n- Opting for one exploratory variable and dropping others creates a bias toward\
    \ the one selected and deprives one from observing the chunk of variations which\
    \ could have been captured by the exploratory variables dropped in the first place.\n\
    - In the case of choosing among many exploratory variables, going through this\
    \ entire exercise will require significant computing power, and thus time.\n\n\
    ### Polynomial Regression\n\nSometimes when plotting the scatter plot between\
    \ exploratory and response variables we see a non-linear trend. This trend will\
    \ go unnoticed by the linear regression cameo, and will thus require a non-linear\
    \ treatment where polynomial regression comes in handy. Polynomial regression\
    \ uses degrees of polynomial to make a non-linear regression line. Polynomial\
    \ regression can mathematically be defined as follows:\n\n- Symbol: `y`\n- Formula:\
    \ `y = b[0] + b[1]x + b[2]x² + b[3]x³ + b[h]x^h + e`\n- Illustration:\n    - `y`:\
    \ Response variable\n    - `x[1], x[2], x[3], ..., x[h]`: Explanatory variable\n\
    \    - `b[0]`: Slope\n    - `b[1], b[2], b[3], ..., b[h]`: Intercepts\n    - `e`:\
    \ Regression residual\n    - `h`: Degree of polynomial\n\nLooking at Figure [2-6](#A432778_1_En_2_Chapter.html#Fig6)\
    \ you will notice that increasing the degree of polynomial makes the curve more\
    \ non-linear and induces additional curves within the regression line.\n\n![A432778_1_En_2_Fig6_HTML.gif](A432778_1_En_2_Fig6_HTML.gif)\n\
    \nFigure 2-6. Polynomial regression curves for different values of degrees (i.e.,\
    \ `h`)\n\n## Assumptions of Regressions\n\nIn order to prevent Smith from thinking\
    \ of regression as the magic wand for continuous data predictions, Claire came\
    \ up with the set of assumptions that should hold true for regression to be applicable\
    \ to a given dataset.\n\n### Number of Cases\n\nThe ratio of cases-to-independent\
    \ variables (IVs) should ideally be 20:1. This means that there should be 20 samples\
    \ for each exploratory variable. However, in extreme cases a minimum of 5 samples\
    \ to one exploratory variable is permissible (i.e., for 5 exploratory variables\
    \ there should be 25 samples in the dataset).\n\n### Missing Data\n\nIn regression,\
    \ missing data can lead to a model which is unfit for the sampling data. You might\
    \ fall victim to either one of the following situations:\n\n- There might be instances\
    \ when some observations have missing values for all fields within the data. Removing\
    \ them will be a wise thing to do because if the missing values are insignificant\
    \ then neglecting them won’t disturb the overall behavior captured by the model.\n\
    - In case only a given column has missing values in majority of the observations\
    \ no treatment is required because then regression will neglect the cases in which\
    \ there are no values for that variable.\n\n#### Outliers\n\nOutliers can create\
    \ a bias in the outcome of a regression model such that they will pull the best\
    \ fit line toward themselves. Hence treatment of outliers is critical in regression\
    \ and can be done by means of an appropriate method selected from the ones highlighted\
    \ in Chapter [1](#A432778_1_En_1_Chapter.html).\n\n### Multicollinearity and Singularity\n\
    \nMulticollinearity and Singularity are two concepts which undermines the regression\
    \ modeling, resulting in bizarre and inaccurate results. If exploratory variables\
    \ are highly correlated, then regression becomes vulnerable to biases. Multicollinearity\
    \ refers to a correlation of 0.9 or higher, whereas singularity refers to a perfect\
    \ correlation (i.e., 1).\n\nA remedy to this is to remove the exploratory variable\
    \ exhibiting correlation of more than 0.7. But then this brings us to the following\
    \ problem. Considering the example in Figure [2-7](#A432778_1_En_2_Chapter.html#Fig7),\
    \ where weight and blood pressure (BP) have a high correlation of 0.95.\n\n![A432778_1_En_2_Fig7_HTML.gif](A432778_1_En_2_Fig7_HTML.gif)\n\
    \nFigure 2-7. Illustration of multicollinearity\n\nNow which one (weight or BP)\
    \ is the troublemaker and should be removed? This is the point where tolerance\
    \ comes in as a remedy? Tolerance can be mathematically defined as follows:\n\n\
    - Formula: `Tolerance = 1 - r²`\n- Illustration:\n    - `r²`: Squared multiple\
    \ correlation of this variable with all other independent variables in the regression\
    \ equation\n\nTolerance refers to the proportion of the exploratory variable’s\
    \ variance not captured by other exploratory variables in the equation. The greater\
    \ this value, the better it is. Eradicating multicollinearity and singularity\
    \ will ensure that the response variable is predicted from the variations captured\
    \ by exploratory variables independently and not by the correlations which exist\
    \ among them.\n\nAfter reading through the description of the regression techniques\
    \ available, Smith was curious to know which method would work best for the problem\
    \ at hand. However, Claire knew that the process for figuring out the right method\
    \ would need some understanding of the data before moving forward. Hence she decided\
    \ to perform features’ exploration. By features she meant variables within the\
    \ dataset. She was primarily interested to see what the data looks like and if\
    \ the following exist:\n\n- Correlation between the exploratory variables and\
    \ the response variable or not\n- Multicollinearity and singularity"
