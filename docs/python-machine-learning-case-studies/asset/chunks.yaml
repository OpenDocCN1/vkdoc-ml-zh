    Dr. Judy pointed to the fact that the method in Listing [5-5](#A432778_1_En_5_Chapter.html#Par34)
    takes as an input the names of features which are discrete in nature because those
    will be represented as bar graphs. Without wasting time she called the function
    to plot the feature representations in Listing [5-6](#A432778_1_En_5_Chapter.html#Par36).


    ![A432778_1_En_5_Fig1_HTML.jpg](A432778_1_En_5_Fig1_HTML.jpg)


    Figure 5-1.


    Plots of feature representations


    ```

    discrete_vars = [''Gender'', ''DayOfTheWeek'', ''Status'', ''Diabetes'',

    ''Alcoolism'', ''HiperTension'', ''Handcap'', ''Smokes'',

    ''Scholarship'', ''Tuberculosis'', ''Sms_Reminder'']

    features_plots(discrete_vars)

    Listing 5-6.

    Calling ‘features_plot’ method in Listing 5-5 to Plot the Feature Representation

    ```


    While looking at Figure [5-1](#A432778_1_En_5_Chapter.html#Fig1), Dr. Judy noticed
    that none of the features has missing values. She made the following deductions
    about some of the features from the dataset :


    *   Age: Age lay in the range of -2 and 113\. Age between 0 and 113 did make sense,
    but what surprised her was how it could be negative. It seemed to her that there
    was some noise in the dataset.

    *   Handicap: Instead of being Boolean, this feature had values in the range of
    0 and 4.

    *   Sms_Reminder: Instead of being a Boolean entity, it had values in the range
    of 0 and 2\. It seemed to her that Sms_Reminder represented the frequency of reminders
    sent to each and every patient.

    *   AwaitingTime: Dr. Judy was puzzled to see AwaitingTime in negative terms.
    By definition this feature represented the number of days from which the appointment
    was issued to the date for which the appointment was issued. She believed that
    positive numbers would have made more sense.


    Findings from the deductions meant that Dr.Judy would have to clean data a bit
