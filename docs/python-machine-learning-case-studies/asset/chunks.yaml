- fmt: '### t-Distributions and Sample Size


    Degree of freedom refers to the instances in which you have the freedom to choose
    from more than one choice. Usually this is `sample size - 1`. Degree of freedom
    (`DF`) defines the spread of a Gaussian distribution. The more the `DF`, the lesser
    probability density lies within the tails, with the distribution tightly clustered
    around the mean. Small sample sizes are more likely to be unusual and thus pose
    a threat of getting further away from the null hypothesis even though the null
    hypothesis holds true. Hence it is better to have a large sample size when calculating
    `t-value`.


    ![A432778_1_En_1_Fig19_HTML.gif](A432778_1_En_1_Fig19_HTML.gif)


    Figure 1-19. Change in t-distributions due to changes in sample size


    Let’s calculate the two-tail `t-test` for all categories of genders and user types
    (see Listing [1-27](#A432778_1_En_1_Chapter.html#Par263)). We do this so we can
    understand if different categories have resemblance in variances. If they do,
    then they will be considered a group; otherwise they will be treated separately
    in the analysis mode.


    ```

    for cat in [''gender'',''usertype'']:

    print ''Category: %s\n''%cat

    groupby_category = data.groupby([''starttime_date'', cat])[''starttime_date''].count().unstack(cat)

    groupby_category = groupby_category.dropna()

    category_names = list(groupby_category.columns)

    for comb in [(category_names[i],category_names[j]) for i in range(len(category_names))
    for j in range(i+1, len(category_names))]:

    print ''%s %s''%(comb[0], comb[1])

    t_statistics = stats.ttest_ind(list(groupby_category[comb[0]]), list(groupby_category[comb[1]]))

    print ''Statistic: %f, P value: %f''%(t_statistics.statistic, t_statistics.pvalue)

    print ''\n''

    Listing 1-27. Computing Two-Tail t-test of Categories of gender and user types

    ```


    Output


