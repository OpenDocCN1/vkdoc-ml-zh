    得分仍然低于决策树分类器模型的结果。


    在研究过程中，Judy 博士发现梯度提升分类模型在训练时也会输出模型赋予每个特征集的重要性得分。她很好奇在训练模型时哪些特征的表现优于其他特征。为此，她编写了清单
