    #### 移动平均平滑


    移动平均平滑与滚动均值类似，这两种方法都是通过计算固定窗口内观测值的平均值来估计给定时间点的观测值。


    David 决定应用移动平均平滑来估计对数变换后时间序列的趋势。他通过编写清单 3-9 中的代码，对过去两周（即最后 15 个值）应用滚动均值。


    ![A432778_1_En_3_Fig6_HTML.gif](img/A432778_1_En_3_Fig6_HTML.gif)


    图 3-6.


    移动平均平滑后的时间序列


    ```

    moving_avg = pd.rolling_mean(data_log,15)

    plt.plot(data_log)

    plt.plot(moving_avg, color=''red'')

    清单 3-9.

    对时间序列对象应用移动平均平滑

    ```


    David 根据图 3-6 得出以下推论：“红线表示滚动均值，即通过移动平均平滑估计出的趋势。现在的目标是从对数变换后的时间序列中减去这个估计趋势。”请注意，由于
    David 取的是最后 15 个值的平均值，因此前 14 个值的滚动均值未定义。这可以从清单 3-10 的输出中观察到。


    ```

    data_log_moving_avg_diff = data_log - moving_avg

    data_log_moving_avg_diff.head(15)

    清单 3-10.

    打印去除趋势后的时间序列对象

    ```


    输出


    ```

    2016-01-04      NaN

    2016-01-05      NaN

    2016-01-06      NaN

    2016-01-07      NaN

    2016-01-08      NaN

    2016-01-11      NaN

    2016-01-12      NaN

    2016-01-13      NaN

    2016-01-14      NaN

    2016-01-15      NaN

    2016-01-19      NaN

    2016-01-20      NaN

    2016-01-21      NaN

    2016-01-22      NaN

    2016-01-25      -0.023439

    Name: Close_Adj, dtype: float64

    ```


    David 知道趋势的前 14 个观测值包含 `NaN`。因此，他决定从趋势中移除 `NaN`，然后从原始时间序列对象中减去这个趋势。他预期结果会是平稳的，并计划使用清单
    3-4 中定义的函数（见清单 3-11）对其进行检验。


    ```

    data_log_moving_avg_diff.dropna(inplace=True)

    evaluate_stationarity(data_log_moving_avg_diff)

    清单 3-11.

    评估去除趋势后的时间序列的平稳性

    ```


    输出


    ![A432778_1_En_3_Fig7_HTML.gif](img/A432778_1_En_3_Fig7_HTML.gif)


    图 3-7.


    移除移动平均后的时间序列，以及滚动均值和标准差


    ```

    Results of Dickey-Fuller Test:

    Test Statistic                  -4.375719

    p-value                         0.000328

    #Lags Used                      0.000000

    Number of Observations Used     174.000000

    Critical Value (5%)             -2.878298

    Critical Value (1%)             -3.468502

    Critical Value (10%)            -2.575704

