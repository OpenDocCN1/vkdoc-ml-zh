    ![A432778_1_En_BookBackmatter_Fig1_HTML.gif](A432778_1_En_BookBackmatter_Fig1_HTML.gif)


    Pie chart is best to use when trying to compare parts of a whole. If is suitable
    for analyzing categorical variables.


    ### Bar graph


    `Figure illustration of a bar graph`


    ![A432778_1_En_BookBackmatter_Fig2_HTML.gif](A432778_1_En_BookBackmatter_Fig2_HTML.gif)


    Bar graph is used to compare things between different groups or track changes
    over time (i.e. when changes are large). Bar graph is suitable for categorical
    and interval variables.


    ### Histogram


    `Figure illustration of a histogram`


    ![A432778_1_En_BookBackmatter_Fig3_HTML.gif](A432778_1_En_BookBackmatter_Fig3_HTML.gif)


    Histogram is suitable for continuous variables. It is used to plot frequency distributions
    with or without classes. Changing the class intervals will change the underlying
    distribution.


    ### Stem and Leaf plot


    `Figure illustration of a Stem and Leaf plot`


    ![A432778_1_En_BookBackmatter_Fig4_HTML.gif](A432778_1_En_BookBackmatter_Fig4_HTML.gif)


    Stem and Leaf plot is suitable for discrete interval variables, not that much
    in frequency. In other words Stem and Leaf plot can be inferred to as the transpose
    of a histogram. Contrary to histogram, we can reconstruct the original data from
