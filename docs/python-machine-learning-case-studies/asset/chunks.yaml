    Ross spent hours searching for a solution to this mystery. He felt disappointed
    as he had expected this approach to work and yield results. To make it easy, he
    narrowed down his search to one feature (i.e., `groups`) and started pondering
    on how he could recode it into a numeric form. It was late at night, but Ross
    couldn''t sleep, and then an idea struck him. Why not convert the `groups` feature
    into Boolean, such that a research paper that falls within a group will have `1`
    marked next to it, and `0` otherwise. The data representation he could think of
    would be a matrix where columns will represent the different groups and rows will
    represent the research papers.


    He knew that a research paper could fall into one group. Groups for a given research
    paper were separated by a delimiter (i.e., `\n`) in the dataset. Hence he first
    decided to separate groups by dividing the delimiter in between so that if a research
    paper falls within three groups it will be represented by three different observations
    (i.e., rows) in the dataset.


    ```

    s = data_train[''groups''].str.split(''\n'').apply(pd.Series, 1).stack()

    s.index = s.index.droplevel(-1)

    s.name = ''groups''

    del data_train[''groups'']

    data_train = data_train.join(s).reset_index()

    Listing 4-4.

    Stretching the Data Frame Row-wise as a Function of Groups

    ```


    In addition to separating groups, Ross also decided to add a new feature `flags`,
    and assign a value of `1` to all the rows. As per his notion, a value of `1` will
    denote that the research paper in that row belongs to the group in the `groups`
    column.


    Table 4-3.


    Print of Observations of the Dataset After Data Frame Transformation


    ![A432778_1_En_4_Figb_HTML.gif](A432778_1_En_4_Figb_HTML.gif)


    ```

    data_train[''flags''] = pd.Series(np.ones(len(data_train)), index=data_train.index)

    data_train.head()

    Listing 4-5.

    Adding New Variable for Group Membership

    ```


    Having expanded a research paper as a function of the group it belongs in, and
    having associated a member flag to it, Ross knew that the time had come to convert
    this data structure into a matrix. For that he defined the function in Listing
    [4-6](#A432778_1_En_4_Chapter.html#Par49).


    ```

    def matrix_from_df(data_train):

    matrix = data_train.pivot_table(index = [''title''], columns=[''groups''], values=''flags'')

    matrix = matrix.fillna(0).reset_index()

    x_cols = matrix.columns[1:]

    return matrix, x_cols

    Listing 4-6.

    Adding a Function for Matrix Creation

    ```


    Over the years, Ross had become proficient in pivot tables within Microsoft Excel.
    He thus decided to use the same methodology in Listing [4-6](#A432778_1_En_4_Chapter.html#Par49)
    for the data frame to matrix transformation. Hence he initialized a method in
    Listing [4-6](#A432778_1_En_4_Chapter.html#Par49) whereby he converted the training
    data into a pivot with `title` as an index, each group represented by a separate
    column, having values from the `flags` feature. Then he placed `0` where the research
    paper in the index didn''t fall within the realm of a given group. He decided
    to bring the matrix live by using the method defined in Listing [4-6](#A432778_1_En_4_Chapter.html#Par49).


    Table 4-4.


    Initial Observations of the Matrix


    ![A432778_1_En_4_Figc_HTML.gif](A432778_1_En_4_Figc_HTML.gif)


    ```

    matrix, x_cols = matrix_from_df(data_train)

    matrix.head()

    Listing 4-7.

    Retrieve Matrix and x cols from the matric_from_df Method

    ```


    Ross was thrilled to see the output come out as expected. To test his understanding,
    he picked a research paper from Table [4-4](#A432778_1_En_4_Chapter.html#Tab4)
    at random. He chose “A Computational Method for (MSS.CoMSS).” By looking at the
    matrix in Table [4-4](#A432778_1_En_4_Chapter.html#Tab4), Ross inferred that the
    paper fell in group `HSO` and didn’t have membership in any of the other groups.


    Now that he knew what clustering was, and having transformed the data into a form
    friendly for applying it, it was time for him to apply clustering modeling. However,
    first he had to determine the evaluation metrics by which he could evaluate the
    goodness of a clustering model. Contrary to the techniques available for evaluating
    regression and classification models, not many techniques are available to statistically
    evaluate the goodness of a clustering model. The reason is that in regression
    and classification, labeled data is already available on which the model is trained.
    However, this is not the case with clustering.


    ## Metrics of Evaluating Clustering Models


    Having done some research, Ross learned that there is no one way of to evaluate
    the output of a clustering model. He came across two approaches for making it
    work. The first was more of a technical nature. It deems a clustering model good
    enough if maximum variance is explained within each of the clusters, objects within
    the clusters share similar properties, and clusters are further away from each
    other. The second approach indicated the model to be strong if the cluster definitions
    make intuitive sense.


    Ross now had a clear understanding of clustering and methodologies to evaluate
    its goodness. Hence he started to look for clustering models that work best in
    related applications. After thorough research, he came up with several clustering
    models.


    # Clustering Models


    Ross decided to start with the de facto clustering algorithm (i.e., k-means clustering).
    To Ross, understanding the methodology by which clusters converge was pivotal
    before applying it to the dataset in hand. Hence he compiled an explanation of
    the k-means clustering algorithm.


    ## k-Means Clustering


    k-means clustering partitions the data space into Voronoi cells representation.
    This transformation divides the data observations into k-clusters in which each
    of the observations belongs to the cluster with the nearest mean. k-means clustering
    is done as follows:


    1.  k-centroids are chosen randomly.

    2.  Each of the observations is binded with the closest centroid.

    3.  New centroids for each of the clusters are recomputed by taking the mean of
    the observations lying within each cluster.

    4.  Step 2 is repeated again.


    You might note that steps 1 and 3 resemble each other, the difference being that
    in step 1, centroids are chosen at random, whereas in step 3 they are calculated
    by taking the mean of observations within each of those clusters.


    Then steps 2 and 4 are a repetition of the same step. Steps 3 and 4 are iterated
    until the clusters converge—that is, cluster memberships remain constant for all
    observations in the dataset. This maximizes the distance between clusters and
    minimizes the distance among the observations within each cluster. k-means clustering
    does not always find the most optimal configuration while minimizing the global
    objective function. The clustering algorithm is highly sensitive to how cluster
    centers are initially selected.


    Ross now fully understood how convergence is performed in a k-means clustering
    algorithm. However, he was clueless on as to what value of `k` (i.e., number of
    clusters he should specify upfront) would be optimal for the data at hand. He
    recalled having seen an article on k-means clustering on Linkedin. Hence he searched
    for the person who had posted that article and then messaged him asking for his
    assistance in this regard. His connection, Pollack, suggested that Ross use the
    following methods:


    *   Elbow method

    *   Variance explained

    *   BIC score


    He started off by looking at how the Elbow method works and then applied it to
    find the number of clusters optimal to the model.'
