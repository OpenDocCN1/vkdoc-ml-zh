  raw: '### Insurance


    Insurance companies receive a huge amount of insurance claims regarding damages.
    Insurance companies thus have to invest a lot of time and human resources to investigate
    the matter and come up with the final verdict. The final verdict is right in many
    of the cases but wrong in some of the cases. Hence, recently efforts have been
    made to deploy classification models in insurance companies to discriminate fraud
    claim applications from the legitimate ones.


    Dr. Judy summed up her analysis by recalling the initially laid objectives which
    were to determine reasons for recurring losses and methods to detect the occurrence
    of losses in the future. She started off by performing univariate and multivariate
    analysis of the data to determine the areas of data treatment. The exploratory
    analysis also enabled her to see that the losses were apparently a result of roughly
    33% of patients who did not show up on their appointment day and time. After performing
    data wrangling, she thought it better to generate more features from the existing
    ones to make it easy for the model to capture the true essence of data.


    She then reviewed multiple classification model evaluation techniques and split
    the data into train-test splits to enable evaluation of the models. Dr. Judy started
    off with decision tree classifiers which showed overfitting and high test error.
    However, after applying a handful of classification techniques she decided on
    the gradient boosting classification model, which yielded relatively better accuracy.
    By means of the gradient boosting model she now had the power to predict in real
    time if a patient who had booked an appointment would or would not show up on
    the day of his/her appointment. She knew that she had achieved a major milestone
    and was now looking forward to the board meeting.


    ## Appendix A: Chart types and when to use them


    ### Pie chart


