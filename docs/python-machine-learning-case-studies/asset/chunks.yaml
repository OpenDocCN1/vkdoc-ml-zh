    Looking at Table [5-3](#A432778_1_En_5_Chapter.html#Tab3) Dr. Judy was thrilled
    to see the features’ generation come true. The evidence was the columns representing
    the year, month, day, hour, minute, and second components of `AppointmentData`
    and `AppointmentRegistration`. Dr. Judy was well aware that her methodology of
    increasing the feature sets wasn’t the de facto technique as several other techniques
    achieving the same objective exist. She had some ideas about extracting more features;
    however, she went with the simplest one to save time. But she is open to collaboration
    if someone can help her extract other date components from the date features or
    help her transform the features into their Boolean counterparts. Hence she listed
    the exercises that follow.


    Exercises


    1.  Extract more features from the date features (week of the month, week of the
    year, day half, weekend, weekday, etc.).  

    2.  Include a Boolean transformation of the features in your dataset like that
    done in Chapter [4](#A432778_1_En_4_Chapter.html). This will increase the feature
    set which can become beneficial while training the model.  


    She was hopeful that this huge pool of features would now enable the classification
    model to better understand the dynamics of the underlying data. She was aware
    of what classification was, but her curiousity to learn more made her come up
    with the following material on the topic.


    ## Classification


    Classification helps us decide which of the given classes a new observation will
    fall into. Classification comes under supervised learning where the model can
    only be trained once a membership labeled data is provided as an input. These
    membership variables are usually categorical variables which can be nominal as
    well as Boolean in nature.


    As an example, consider a person applying for a mortgage at one of the premier
    banks. The bank will access his application and would like to know if that person
    will be subject to default in the future or not. If not, the bank will approve
    his application for the mortgage. This presents a prime application for classification
    where the bank uses past data to train the model. It will then take into account
    that person’s age, gender, salary index, lifestyle index, and credit score to
    predict whether or not he will default in the future. Here the membership variable
    we are trying to predict is “default,” and it is categorical in nature.


    The following methods can be used to evaluate a classification model:


    *   Accuracy: Classifier and predictor accuracy

    *   Speed: Time to train and predict from the model

    *   Robustness: Handling missing values and noise

    *   Scalability: Efficiency in disk-related databases

    *   Interpretability: Predictions made by the model make intuitive sense


    ### Model Evaluation Techniques


    Python allows the provision of measuring classification performance with the aid
    of several score, loss, and utility functions. These metrics require probability
    estimates of confidence values, positive class, binary decision values or value
    within the `sample_weight` parameter (i.e., weighted contribution of each sample
    to the overall score). These can be divided in several ways.'
