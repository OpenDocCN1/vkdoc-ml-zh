    在查看图 3-2 中的探索性数据分析时，大卫注意到，尽管滚动标准差的变化很小，但滚动均值显然相对变化很大。因此，他推断该时间序列对象是非平稳的。然后他查看了迪基-富勒检验的输出，看它是否也显示了相同的结果。他注意到检验统计量大于临界值；因此，他无法拒绝原假设，这意味着数据本质上是非平稳的。


    时间序列对象是非平稳的，这意味着预测的道路不再平坦。在应用预测之前，他必须首先使时间序列对象平稳。因此，他做了一些研究，并提出了几种使时间序列对象平稳的方法。

