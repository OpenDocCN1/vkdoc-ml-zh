    罗斯回忆说，他对代码清单 4-9 的解释如下：


    > 在逐个聚类地获取每篇研究论文的聚类归属后，利用这些距离计算簇内平方和。接着，计算每篇研究论文内部各列之间的距离，以计算总平方和。最后，从总平方和中减去簇内平方和，得到组间平方和。将组间平方和与总平方和的比值绘制在图
    4-3 中。


    对罗斯来说，图 4-3 看起来像一个指数累积分布函数。方差解释曲线似乎很平滑，并且随着聚类数量的增加而持续上升。这使得罗斯难以确定肘部的位置。经过仔细考虑，罗斯注意到梯度从
    k = 9 开始变得平缓，这与他在肘部法则中观察到的结果相似。


    然而，他并没有就此止步，而是继续寻找有助于确定最优 k 值的方法。不久，他接触到了贝叶斯信息准则（BIC）评分。


    #### 贝叶斯信息准则评分


    BIC 是另一种从有限模型集合中选择最佳模型的技术。BIC 评分最低的模型被认为是胜出者。在训练模型时，通过添加额外参数，有很高的概率可以增加获得准确聚类的可能性；但是，他知道这样做会导致模型过拟合。BIC
    通过对模型中的参数数量添加惩罚项来克服这个问题。BIC 的假设前提是样本量应远大于模型中的参数数量。因此，BIC 不适用于处理高维数据的复杂模型。


    ![A432778_1_En_4_Fig4_HTML.gif](img/A432778_1_En_4_Fig4_HTML.gif)


    图 4-4.

    样本 BIC 评分图


    关于 BIC 评分的知识让罗斯放弃了这一选项，因为 BIC 评分适用于低维数据，而矩阵变换意味着现在数据具有（组数 + 1）个维度，使其成为了高维数据。


    他很好奇是否存在一种方法，能够确定最优聚类数量，并且这种方法与 k-means 聚类的工作原理相契合。换句话说，罗斯想找到一种方法，能够确定使得簇间距离最大、簇内距离最小的最优聚类数量。他的探索促使他查阅研究论文，并在其中发现了轮廓系数法。

