  trans: '

    ### 使时间序列对象平稳的方法


    尽管存在多种实现方法，但没有一种能保证使时间序列对象完全平稳。这些方法所做的是对时间序列对象进行变换，使其看起来更接近平稳对象。它们通过从时间序列对象中移除趋势和季节性来实现这一点。以下是能使时间序列对象更接近平稳对象的一些方法：


    *   应用变换

    *   估计趋势并将其从原始序列中移除

    *   差分

    *   分解


    大卫决定逐一应用所有这些方法，以确定哪一种能使时间序列对象尽可能平稳。他首先研究了应用变换如何帮助实现这一短期目标。


    #### 应用变换


    对数、立方根和平方根等变换会对较大的值进行惩罚，从而使序列变得平稳。大卫决定应用每一种变换，找出能使该时间序列对象几乎平稳的方法。他从对数变换开始。


    ##### 对数变换


    大卫编写了清单 3-6 中的代码片段，以查看对数变换是否能生成一个本质平稳的时间序列。


    ```

    data_log = np.log(data_train[''Close_Adj''])

    evaluate_stationarity(data_log, 15)

    清单 3-6.

    对时间序列对象应用对数变换

    ```


    输出


    ![A432778_1_En_3_Fig3_HTML.gif](img/A432778_1_En_3_Fig3_HTML.gif)


    图 3-3.


    对数变换后的时间序列及其滚动均值和标准差


    ```

    Results of Dickey-Fuller Test:

    Test Statistic                  -1.136109

    p-value                         0.700460

    #Lags Used                      0.000000

    Number of Observations Used     188.000000

    Critical Value (5%)             -2.877040

    Critical Value (1%)             -3.465620

    Critical Value (10%)            -2.575032

    dtype: float64

    ```


    查看图 3-3，大卫注意到变换确实有效，因为它成功使滚动均值和滚动标准差保持恒定。然而，他惊讶地发现迪基-富勒检验的结果却相反（即变换后的序列仍然是非平稳的）。他是在注意到检验统计量大于临界值后得出这一结论的，这意味着原假设成立，对数变换后的对象本质上是非平稳的。他很好奇为什么两种方法会产生相互矛盾的结果。他能想到的唯一解释是，滚动均值虽然看起来恒定，但一旦放大图
    3-3 可能会发现其存在变化。因此，他添加了一些代码行，如清单 3-7 所示。


    ![A432778_1_En_3_Fig4_HTML.gif](img/A432778_1_En_3_Fig4_HTML.gif)


    图 3-4.


    对数变换分布中滚动均值的放大图


    ```

