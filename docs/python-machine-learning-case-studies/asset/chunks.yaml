    \ which has two components β [0] and β [1]. L2-norm for this can be defined as\
    \ follows:\n\n*   Formula: ![$$ {\\left|\\left|\\overrightarrow{\\beta}\\right|\\\
    right|}_2=\\sqrt{\\beta_0^2+{\\beta}_1^2} $$](A432778_1_En_2_Chapter_IEq11.gif)\n\
    \nThis is the Cartesian distance from the origin to these vector components (i.e.,\
    \ β [0] and ![$$ {\\beta}_1\\Big) $$](A432778_1_En_2_Chapter_IEq12.gif). Ridge\
    \ regression is good in the following conditions:\n\n*   When we have more than\
    \ one exploratory variable\n*   Multicollinearity exists between the exploratory\
    \ variables\n\nMulticollinearity will lead to biased estimators because the beta\
    \ coefficients get abnormally high when calculated over many iterations. Hence\
    \ this will lead us to the question, the best coefficient of which iteration is\
    \ the real one? As the estimators will be biased now, taking the coefficient averages\
    \ over much iteration won’t yield the population coefficients. However, the variances\
    \ within these coefficients won’t be too high and thus will help in better understanding\
    \ these coefficients. In order to avoid having beta values that are too big we\
    \ need to put some constraint on how big the betas can get. Hence we can mathematically\
    \ define Ridge regression as follows:\n\n*   Formula: ![$$ \\underset{\\overrightarrow{\\\
    beta}}{\\mathit{\\min}}{\\left|\\left|\\overrightarrow{y}-A\\overrightarrow{B}\\\
    right|\\right|}_2^2 $$](A432778_1_En_2_Chapter_IEq13.gif) subject to ![$$ \\vee\
    \ \\overrightarrow{\\beta}{\\vee}_2^2\\le {c}^2 $$](A432778_1_En_2_Chapter_IEq14.gif)\
    \ OR\n\n![$$ \\underset{\\overrightarrow{\\beta}}{\\mathit{\\min}}{\\left|\\left|\\\
    overrightarrow{y}-A\\overrightarrow{B}\\right|\\right|}_2^2+\\lambda \\vee \\\
    overrightarrow{\\beta}{\\vee}_2^2 $$](A432778_1_En_2_Chapter_Equd.gif)\n\nIn Ridge\
    \ regression considering our choice is L2-norm, our beta value constraint is in\
    \ the shape of a circle which can be seen in Figure [2-19](#A432778_1_En_2_Chapter.html#Fig19).\
    \ Earlier we applied single and multiple linear regression on data. However, Ridge,\
    \ Lasso, and ElasticNet regression are more suitable with multiple regression\
    \ and thus will be our analyses of choice.\n\n![A432778_1_En_2_Fig19_HTML.gif](A432778_1_En_2_Fig19_HTML.gif)\n\
    \nFigure 2-19.\n\nRepresentation of Ridge regression\n\nNow that Smith understood\
    \ Ridge regression, he was interested to see how well it predicts concrete strength\
    \ from the available exploratory variables. As we read earlier, Ridge regression\
    \ has a support of accepting multiple exploratory variables as input; hence, Claire\
    \ decided to run a multiple Ridge regression, as seen in Listing [2-11](#A432778_1_En_2_Chapter.html#Par209).\
    \ Figure [2-20](#A432778_1_En_2_Chapter.html#Fig20) shows the result.\n\n```\n\
    alphas = np.arange(0.1,5,0.1)\nmodel = Ridge()\ncv = GridSearchCV(estimator=model,\
    \ param_grid=dict(alpha=alphas))\ny_pred = cv.fit(x_train, y_train).predict(x_test)\n\
    plt.scatter(range(len(y_test)), y_test,  color='black')\nplt.plot(y_pred, color='blue',\
    \ linewidth=3)\nprint 'Features: %s'%str(features)\nprint 'R2 score: %f'%r2_score(y_test,\
    \ y_pred)\nprint 'Intercept: %f'%regr.intercept_\nprint 'Coefficients: %s'%str(regr.coef_)\n\
    Listing 2-11.\nCalculating Multiple Ridge Regression\n```\n\nOutput\n\n![A432778_1_En_2_Fig20_HTML.gif](A432778_1_En_2_Fig20_HTML.gif)\n\
    \nFigure 2-20.\n\nMultiple Ridge regression plot\n\n```\nFeatures:      ['cement_component',\
    \ 'flay_ash', 'water_component', 'superplasticizer', 'coarse_aggregate']\nR2 score:\
    \      0.097982\nIntercept:     77.802791\nCoefficients:  [0.04531335  0.01168227\
    \ -0.13620573  0.24324622 -0.03297459]\n```\n\nSmith didn’t have much difficulty\
    \ in understanding the code in Listing [2-11](#A432778_1_En_2_Chapter.html#Par209)\
    \ as it resembled the code in Listing [2-10](#A432778_1_En_2_Chapter.html#Par191).\
    \ The only thing he didn’t understand was how grid search was brought into application.\
    \ Hence Claire started to explain the piece of code that has to do with GridSearchCV.\
    \ She at first pointed to alphas = np.arange(0.1,5,0.1) which was used to generate\
    \ an array of values in the range of 0.1 to 5, with an offset of 0.1\\. This along\
    \ with the Ridge regression model was then fed into GridSearchCV. Hence GridSearchCV\
    \ tried values of alpha one by one to determine the one that best fine-tunes the\
    \ model.\n\nHaving understood the code in Listing [2-11](#A432778_1_En_2_Chapter.html#Par209),\
    \ Smith had a question. Did R² fare better when applying Ridge regression? To\
    \ this Claire said the following:\n\n> Not at all, as it’s exactly the same and\
    \ so are the coefficients. The reason for which can be that in the presence of\
    \ multiple features, and multicollinearity linear regression tends to bias towards\
    \ the L2-norm, and L2-norm is the regularization term which is used by Ridge regression,\
    \ hence a resemblance. Moreover, also notice that we are using grid search in\
    \ our approach to optimize for alpha. So what exactly is alpha? Alpha is a regularization\
    \ parameter which is used to weight the L2-norm term in Ridge regression. The\
    \ value of 0 for alpha translates the Ridge regression model to the ordinary least\
    \ squares regression model. Hence the higher the value of alpha, the higher the\
    \ smoothness constraint, and the lower would be the magnitude of the coefficients.\
    \ The effect of alpha values is shown for the illustration in Figure [2-21](#A432778_1_En_2_Chapter.html#Fig21)\
    \ .\n> \n> ![A432778_1_En_2_Fig21_HTML.gif](A432778_1_En_2_Fig21_HTML.gif)\n>\
    \ \n> Figure 2-21.\n> \n> Effect of alpha value on the smoothness of the regression\
    \ fit line\n\nRidge regression even after parameter didn’t bring any improvement\
    \ over what a multiple linear regression had to offer. Claire believed that changing\
    \ the regularization term from L2-norm to L1-norm might bring some improvements\
    \ to the R² score. Hence, she decided to try out Lasso regression, and came up\
    \ with the description of that in the following sections."
  trans: "\n### 网格搜索\n\n网格搜索采用“拟合”与“评分”的方法，为给定模型确定最佳参数。待调优的模型及其参数和有限可能取值会被传入 `GridSearchCV`。输出结果指明了能使模型达到最佳调优效果的参数值。\n\
    \n在解释了网格搜索之后，克莱尔整理了一份关于岭回归的知识库。\n\n### 岭回归\n\n岭回归在线性最小二乘损失函数的基础上，加入了 L2 范数的正则化项。这种回归方法内置支持接受多个解释变量来预测响应变量。L2\
    \ 是一种向量范数，用于衡量向量的大小。L2 范数是最常被教授和使用的。假设我们有一个向量 ![$$ \\overrightarrow{\\beta} $$](img/A432778_1_En_2_Chapter_IEq10.gif)，它包含两个分量\
    \ β[0] 和 β[1]。其 L2 范数定义如下：\n\n*   公式：![$$ {\\left|\\left|\\overrightarrow{\\beta}\\\
    right|\\right|}_2=\\sqrt{\\beta_0²+{\\beta}_1²} $$](img/A432778_1_En_2_Chapter_IEq11.gif)\n\
    \n这是从原点到这些向量分量（即 β[0] 和 ![$$ {\\beta}_1\\Big) $$](img/A432778_1_En_2_Chapter_IEq12.gif)）的笛卡尔距离。岭回归在以下条件下表现良好：\n\
    \n*   当我们有多个解释变量时\n*   解释变量之间存在多重共线性\n\n多重共线性会导致有偏估计量，因为经过多次迭代计算后，贝塔系数会异常增大。这引出了一个问题：哪次迭代的最佳系数才是真实的？由于估计量现在存在偏差，对多次迭代的系数取平均值无法得到总体系数。然而，这些系数内部的方差不会太高，因此有助于更好地理解这些系数。为了避免贝塔值过大，我们需要对贝塔的最大值施加约束。因此，我们可以用数学方式将岭回归定义如下：\n\
    \n*   公式：![$$ \\underset{\\overrightarrow{\\beta}}{\\mathit{\\min}}{\\left|\\\
    left|\\overrightarrow{y}-A\\overrightarrow{B}\\right|\\right|}_2² $$](img/A432778_1_En_2_Chapter_IEq13.gif)\
    \ 满足条件 ![$$ \\vee \\overrightarrow{\\beta}{\\vee}_2²\\le {c}² $$](img/A432778_1_En_2_Chapter_IEq14.gif)\
    \ 或\n\n![$$ \\underset{\\overrightarrow{\\beta}}{\\mathit{\\min}}{\\left|\\left|\\\
    overrightarrow{y}-A\\overrightarrow{B}\\right|\\right|}_2²+\\lambda \\vee \\overrightarrow{\\\
    beta}{\\vee}_2² $$](img/A432778_1_En_2_Chapter_Equd.gif)\n\n在岭回归中，由于我们选择的是 L2\
    \ 范数，贝塔值的约束形状是一个圆形，如图 2-19 所示。之前我们对数据应用了简单线性回归和多元线性回归。然而，岭回归、套索回归和弹性网络回归更适用于多元回归，因此它们将成为我们分析的首选。\n\
    \n![A432778_1_En_2_Fig19_HTML.gif](img/A432778_1_En_2_Fig19_HTML.gif)\n\n图 2-19.\n\
    \n岭回归的表示\n\n现在史密斯理解了岭回归，他很想知道它如何利用现有的解释变量来预测混凝土强度。正如我们之前读到的，岭回归支持接受多个解释变量作为输入；因此，克莱尔决定运行一个多元岭回归，如代码清单\
    \ 2-11 所示。图 2-20 显示了结果。\n\n```\nalphas = np.arange(0.1,5,0.1)\nmodel = Ridge()\n\
    cv = GridSearchCV(estimator=model, param_grid=dict(alpha=alphas))\ny_pred = cv.fit(x_train,\
    \ y_train).predict(x_test)\nplt.scatter(range(len(y_test)), y_test,  color='black')\n\
    plt.plot(y_pred, color='blue', linewidth=3)\nprint 'Features: %s'%str(features)\n\
    print 'R2 score: %f'%r2_score(y_test, y_pred)\nprint 'Intercept: %f'%regr.intercept_\n\
    print 'Coefficients: %s'%str(regr.coef_)\n代码清单 2-11.\n计算多元岭回归\n```\n\n输出\n\n![A432778_1_En_2_Fig20_HTML.gif](img/A432778_1_En_2_Fig20_HTML.gif)\n\
    \n图 2-20.\n\n多元岭回归图\n\n```\nFeatures:      ['cement_component', 'flay_ash', 'water_component',\
    \ 'superplasticizer', 'coarse_aggregate']\nR2 score:      0.097982\nIntercept:\
    \     77.802791\nCoefficients:  [0.04531335  0.01168227 -0.13620573  0.24324622\
    \ -0.03297459]\n```\n\n史密斯理解代码清单 2-11 中的代码并没有太大困难，因为它与代码清单 2-10 中的代码相似。他唯一不理解的是网格搜索是如何被应用到实际中的。于是克莱尔开始解释与\
    \ `GridSearchCV` 相关的这段代码。她首先指向 `alphas = np.arange(0.1,5,0.1)`，这行代码用于生成一个值在 0.1\
    \ 到 5 之间、步长为 0.1 的数组。这个数组连同岭回归模型一起被输入到 `GridSearchCV` 中。因此，`GridSearchCV` 会逐一尝试\
    \ alpha 的值，以确定最能微调模型的那个值。\n\n理解了代码清单 2-11 中的代码后，史密斯提出了一个问题：应用岭回归后，R² 是否表现更好？对此，克莱尔说了以下内容：\n\
    \n> 完全没有，因为它完全相同，系数也是如此。其原因可能是，在存在多个特征和多重共线性的情况下，线性回归倾向于偏向 L2 范数，而 L2 范数正是岭回归所使用的正则化项，因此两者具有相似性。此外，还要注意我们在方法中使用了网格搜索来优化\
    \ alpha。那么 alpha 到底是什么？alpha 是一个正则化参数，用于在岭回归中加权 L2 范数项。alpha 值为 0 会将岭回归模型转换为普通最小二乘回归模型。因此，alpha\
    \ 值越高，平滑度约束越强，系数的幅度就越小。alpha 值的影响如图 2-21 所示。\n> \n> ![A432778_1_En_2_Fig21_HTML.gif](img/A432778_1_En_2_Fig21_HTML.gif)\n\
    > \n> 图 2-21.\n> \n> alpha 值对回归拟合线平滑度的影响\n\n即使在调整参数后，岭回归也没有比多元线性回归带来任何改进。克莱尔认为，将正则化项从\
    \ L2 范数改为 L1 范数可能会给 R² 分数带来一些改进。因此，她决定尝试套索回归，并在接下来的章节中对其进行了描述。\n"
- fmt: '### Lasso Regression


    Contrary to Ridge regression, Lasso regression uses an L1-norm. L1-norm for Lasso
    regression can be defined as follows:


    - Formula: ![$$ {\left|\left|\overrightarrow{\beta}\right|\right|}_1=\left|{\beta}_0\right|+{\beta}_1\vee
    $$](A432778_1_En_2_Chapter_IEq15.gif)


    Mathematically we define Lasso regression as follows:


    - Formula: ![$$ \underset{\overrightarrow{\beta}}{\mathit{\min}}{\left|\left|\overrightarrow{y}-A\overrightarrow{B}\right|\right|}_2^2
    $$](A432778_1_En_2_Chapter_IEq16.gif) subject to ![$$ \vee \overrightarrow{\beta}{\vee}_1\le
    c $$](A432778_1_En_2_Chapter_IEq17.gif) OR

    - ![$$ \underset{\overrightarrow{\beta}}{\mathit{\min}}{\left|\left|\overrightarrow{y}-A\overrightarrow{B}\right|\right|}_2^2+\lambda
    \vee \overrightarrow{\beta}{\vee}_1 $$](A432778_1_En_2_Chapter_Eque.gif)


    Because our Ridge regression choice was an L2-norm, our beta value constraint
    was in the shape of a circle. However, in Lasso regression which takes L1-norm
    into consideration, our beta constraint is in the shape of a diamond (see Figure
    [2-22](#A432778_1_En_2_Chapter.html#Fig22)).


    ![A432778_1_En_2_Fig22_HTML.gif](A432778_1_En_2_Fig22_HTML.gif)


    Figure 2-22. Representation of Lasso regression


    Considering the edge of this diamond lying on the x axis of the first quadrant
    we can see that the coordinates are (c,0). The level curve above touches the diamond
    at (0,c) which means that we have a value for `β[1]` and not for `β[2]`. Hence
    substituting the following in the equation will lead to the exploratory variable
    associated with `β[1]` to turn into 0. Thus Lasso regression in this entire process
    will end with only a few exploratory variables as compared to Ridge regression
    in which the shape is a circle and includes all exploratory variables within the
    dataset.


    Smith was anticipating an improvement in the R² here because he believed that
    handpicking only a few exploratory variables and neglecting the rest can make
    the model stronger. Hence, Claire tested the model, as shown in Listing [2-12](#A432778_1_En_2_Chapter.html#Par225).


    ```

    model = Lasso()

    cv = GridSearchCV(estimator=model, param_grid=dict(alpha=alphas))

    y_pred = cv.fit(x_train, y_train).predict(x_test)

    plt.scatter(range(len(y_test)), y_test,  color=''black'')

    plt.plot(y_pred, color=''blue'', linewidth=3)

    print ''Features: %s''%str(features)

    print ''R2 score: %f''%r2_score(y_test, y_pred)

    print ''Intercept: %f''%regr.intercept_

    print ''Coefficients: %s''%str(regr.coef_)

    Listing 2-12. Calculating Multiple Lasso Regression

    ```


    Output


    ```

    Features:      [''cement_component'', ''flay_ash'', ''water_component'', ''superplasticizer'',
    ''coarse_aggregate'']

    R2 score:      0.103610

    Intercept:     77.802791

    Coefficients:  [0.04531335 0.01168227 -0.13620573 0.24324622 -0.03297459]

    ```


    Smith noticed that Lasso regression fared better than multiple Ridge and linear
    regressions (Figure [2-23](#A432778_1_En_2_Chapter.html#Fig23)).


    ![A432778_1_En_2_Fig23_HTML.gif](A432778_1_En_2_Fig23_HTML.gif)


    Figure 2-23. Multiple Lasso regression plot


    However, as per Claire, a R² of 0.1 is very low and not something the response
    variable can be extrapolated onto. Also, she pointed out that grid search was
    used again to optimize for alpha term as was done in Ridge regression.


    Having had no major success so far, Claire decided to bring in the best of the
    regressions. ElasticNet brings in an amalgam of both of these two approaches (i.e.,
    Ridge and Lasso).


    ### ElasticNet


    ElasticNet overcomes the limitations found in Lasso regression (i.e., the penalty
    function). Lasso tends to select only some exploratory variables and for the multicollinear
    group of exploratory variables, it will only select one from the group. To avoid
    this, it is wise to add a quadratic part to the penalty (i.e., ![$$ {\left|\left|\beta
    \right|\right|}^2\Big) $$](A432778_1_En_2_Chapter_IEq18.gif) which is present
    in Ridge regression. Hence what ElasticNet does is to include the convex sums
    of Lasso and Ridge regression penalties.


    Claire wrote the code in Listing [2-13](#A432778_1_En_2_Chapter.html#Par233) to
    try multiple ElasticNet on the data.


    ```

    model = ElasticNet()

    cv = GridSearchCV(estimator=model, param_grid=dict(alpha=alphas))

    y_pred = cv.fit(x_train, y_train).predict(x_test)

    plt.scatter(range(len(y_test)), y_test,  color=''black'')

    plt.plot(y_pred, color=''blue'', linewidth=3)

    print ''Features: %s''%str(features)

    print ''R2 score: %f''%r2_score(y_test, y_pred)

    print ''Intercept: %f''%regr.intercept_

    print ''Coefficients: %s''%str(regr.coef_)

    Listing 2-13. Calculating Multiple ElasticNet Regression

    ```


    Output


    ![A432778_1_En_2_Fig24_HTML.gif](A432778_1_En_2_Fig24_HTML.gif)


    Figure 2-24. Multiple ElasticNet regression plot


    ```

    Features:      [''cement_component'', ''flay_ash'', ''water_component'', ''superplasticizer'',
    ''coarse_aggregate'']

    R2 score:      0.099785

    Intercept:     77.802791

    Coefficients:  [0.04531335  0.01168227 -0.13620573  0.24324622 -0.03297459]

    ```


    Claire was disappointed with the results of this model (Figure [2-24](#A432778_1_En_2_Chapter.html#Fig24)).
    She recalled:


    > The cross-validation seemed to be lower here as compared to Lasso regression.
    As we read earlier, Lasso seems to consider a chunk of the exploratory variables;
    hence the ElasticNet’s efforts in adding both of them together nullifies the advantage
    that Lasso had in isolation. This is the behavior we saw on the data at hand but
    beware it doesn’t stand universal for all problem sets.


    Smith was curious to if any technique exists that iteratively improves the accuracy
    of a regression model. Claire knew the answer to that (i.e., gradient boosting
    regression).'
