  trans: '

    ### 残差图


    残差图是以解释变量 x（即自变量）为横轴、回归残差为纵轴的散点图。参见图 2-15。最小二乘回归线会被 x 方向上的极端点（且附近无其他点）拉向该点。虚线代表最小二乘回归线。


    ![A432778_1_En_2_Fig15_HTML.gif](img/A432778_1_En_2_Fig15_HTML.gif)


    图 2-15.


    残差图


    ### 残差平方和


    残差平方和（RSS）指的是回归模型的最佳拟合线未能捕捉到的数据方差量。RSS 越小，模型越好。


    为简单起见，我们将继续使用 R² 作为交叉验证的指标。此外，考虑到我们正在进行预测工作，这个指标似乎是一个更好的选择，因为它能帮助我们确定未来样本在准确度尺度上的位置。


    现在，在了解了欠拟合、过拟合的概念以及回归评估技术后，克莱尔认为，是时候检验一下自己能否找到最适合当前数据的回归模型了。


    ## 回归的类型


    克莱尔继续指出，SKLearn 是 Python 中最常用的机器学习库。SKLearn 提供了一系列用于回归建模的算法。她根据 SKLearn 网站上的内容整理出了图
    2-13，作为根据数据集大小选择通常最佳回归算法的参考。


    你可以从 [`http://scikit-learn.org/stable/tutorial/machine_learning_map/`](http://scikit-learn.org/stable/tutorial/machine_learning_map/)
    下载图 2-16 所示的速查表。


    ![A432778_1_En_2_Fig16_HTML.jpg](img/A432778_1_En_2_Fig16_HTML.jpg)


    图 2-16.


    回归-SKLearn 速查表


    史密斯决定尝试一下，找出适合当前数据集大小的回归模型。他回忆道：“在我们的案例中，样本数量少于 10 万，因此潜在的模型有 Lasso、ElasticNet、SVR(kernel=‘rbf’)、集成回归器、岭回归和
    SVR(kernel=‘linear’)。”


    线性回归是最基础的回归模型，因此克莱尔决定从它开始建模。


    ### 线性回归


    多亏了克莱尔，史密斯已经知道什么是线性回归（见图 2-2）。因此，克莱尔决定将其付诸应用，看看它的表现如何，于是她编写了清单 2-9 中的代码。


    ![A432778_1_En_2_Fig17_HTML.gif](img/A432778_1_En_2_Fig17_HTML.gif)


    图 2-17.


    单变量线性回归图


    ```

    plt.figure(figsize=(15,7))

    plot_count = 1

    for feature in [''cement_component'', ''flay_ash'', ''water_component'', ''superplasticizer'',
    ''coarse_aggregate'']:

    data_tr = data[[''concrete_strength'', feature]]

    data_tr=data_tr[(data_tr.T != 0).all()]

    x_train, y_train, x_test, y_test = split_train_test(data_tr, feature)

    # 创建线性回归对象

    regr = LinearRegression()

    # 使用训练集训练模型

    regr.fit(x_train, y_train)

    y_pred = regr.predict(x_test)

    # 绘制输出

    plt.subplot(2,3,plot_count)

    plt.scatter(x_test, y_test,  color=''black'')

    plt.plot(x_test, y_pred, color=''blue'',

    linewidth=3)

    plt.xlabel(feature.replace(''_'','' '').title())

    plt.ylabel(''Concrete strength'')

    print feature, r2_score(y_test, y_pred)

    plot_count+=1

    plt.show()

    清单 2-9.

    计算单变量线性回归

    ```


    输出


    ```

    cement_component     0.250526602238

    flay_ash             0.0546142086558

    water_component      0.112291736027

    superplasticizer     0.0430808938239

    coarse_aggregate     0.0206812124102

    ```


    解释代码对于史密斯理解结果至关重要。因此，克莱尔对清单 2-9 中的代码做了如下解释：


    > 查看上述代码时，你会注意到我们只使用了那些在观察图 2-8 时发现存在正相关或负相关的解释变量。其次，我们初始化了一个宽度为 15、高度为 7 的子图图形。第三，我们使用了训练/测试分割方法进行交叉验证。


    史密斯决定尝试解释一下输出的含义。几乎所有解释变量的 R² 值都接近 0，这表明线性回归的最佳拟合线未能捕捉到这些变量内部的方差。然而，水泥成分是个例外，其最佳拟合线捕捉到了相对可观的方差。考虑到
    R² 较低，这些模型都不能用于预测混凝土强度。


    ```

    features = [''cement_component'', ''flay_ash'', ''water_component'', ''superplasticizer'',
    ''coarse_aggregate'']

    data_tr = data

    data_tr=data_tr[(data_tr.T != 0).all()]

    x_train, y_train, x_test, y_test = split_train_test(data_tr, features)

    # 创建线性回归对象

    regr = LinearRegression()

    # 使用训练集训练模型

    regr.fit(x_train, y_train)

    y_pred = regr.predict(x_test)

    plt.scatter(range(len(y_test)), y_test,  color=''black'')

    plt.plot(y_pred, color=''blue'', linewidth=3)

    print ''Features: %s''%str(features)

    print ''R2 score: %f''%r2_score(y_test, y_pred)

    print ''Intercept: %f''%regr.intercept_

    print ''Coefficients: %s''%str(regr.coef_)

    清单 2-10.

    计算多元线性回归

    ```


    输出


    ![A432778_1_En_2_Fig18_HTML.gif](img/A432778_1_En_2_Fig18_HTML.gif)


    图 2-18.


    多元线性回归图


    ```

    Features:      [''cement_component'', ''flay_ash'', ''water_component'', ''superplasticizer'',
    ''coarse_aggregate'']

    R2 score:      0.097982

    Intercept:     77.802791

    Coefficients:  0.04531335  0.01168227 -0.13620573  0.24324622 -0.0329745

    ```


    克莱尔很惊讶，因为史密斯说得完全正确。她很好奇，如果同时纳入所有解释变量进行多元回归，会发生什么。于是她编写了清单 [2-10 中的代码片段。史密斯在一定程度上能够理解代码；然而，他看到图
    2-18 中非线性的回归最佳拟合线时感到惊讶。


    他的理解是，多元线性回归应该产生一条线性线，而不是非线性的最佳拟合线。对此，克莱尔回应如下：


    > 分析中的特征数量与图中的维度数量成正比。在我们的案例中，有五个解释变量和一个响应变量，总共六个变量。在六维空间中绘制点是很困难的，因此图 2-18 使用二维来表示。如果我们在六维空间中观察，最佳拟合线本应是线性表示的。


    克莱尔指出，由于这个多元回归的 R² 极低，不能使用这个模型来预测响应变量（即混凝土强度）。请注意，R² 极低；因此我们肯定不会继续使用它来回答当前的问题。然而，输出也给出了系数。第一个是
    alpha 系数，随后的是 beta 系数。史密斯和克莱尔都知道数据中存在多重共线性。因此，在寻找适用于多重共线性数据的回归技术时，他们遇到了岭回归，并决定尝试一下。不过，克莱尔认为最好先向史密斯解释一下网格搜索。在继续之前，让我们先探索其他回归模型，以找到最适合我们数据的模型。'
- fmt: '### Grid Search


    Grid search uses a `fit` and `score` methodology to determine the best parameter
    for a given model. The model to be tuned along with the parameters and their finite
    possible values is passed within `GridSearchCV`. The output signifies the parameter
    values on which the model will be best tuned.


    Having explained grid search, Clare compiled a knowledge base regarding Ridge
    regression.


    ### Ridge Regression


    Ridge regression implements the loss function of linear least squares function
    with a regularization of L2-norm. This type of regression has an inbuilt support
    of accepting multiple exploratory variables to predict the response variable.
    L2 is a vector norm which captures the magnitude of a vector. L2 is most commonly
    taught and used frequently. Consider that we have a vector `β` which has two components
    `β[0]` and `β[1]`. L2-norm for this can be defined as follows:


    - Formula: `||β||₂ = √(β₀² + β₁²)`


    This is the Cartesian distance from the origin to these vector components (i.e.,
    `β[0]` and `β₁`). Ridge regression is good in the following conditions:


    - When we have more than one exploratory variable

    - Multicollinearity exists between the exploratory variables


    Multicollinearity will lead to biased estimators because the beta coefficients
    get abnormally high when calculated over many iterations. Hence this will lead
    us to the question, the best coefficient of which iteration is the real one? As
    the estimators will be biased now, taking the coefficient averages over much iteration
    won’t yield the population coefficients. However, the variances within these coefficients
    won’t be too high and thus will help in better understanding these coefficients.
    In order to avoid having beta values that are too big we need to put some constraint
    on how big the betas can get. Hence we can mathematically define Ridge regression
    as follows:


    - Formula: `min_β ||y - Aβ||₂²` subject to `||β||₂² ≤ c²` OR `min_β ||y - Aβ||₂²
    + λ||β||₂²`


    In Ridge regression considering our choice is L2-norm, our beta value constraint
    is in the shape of a circle which can be seen in Figure 2-19. Earlier we applied
    single and multiple linear regression on data. However, Ridge, Lasso, and ElasticNet
    regression are more suitable with multiple regression and thus will be our analyses
    of choice.


    ![A432778_1_En_2_Fig19_HTML.gif](A432778_1_En_2_Fig19_HTML.gif)


    Figure 2-19. Representation of Ridge regression


    Now that Smith understood Ridge regression, he was interested to see how well
    it predicts concrete strength from the available exploratory variables. As we
    read earlier, Ridge regression has a support of accepting multiple exploratory
    variables as input; hence, Claire decided to run a multiple Ridge regression,
    as seen in Listing 2-11. Figure 2-20 shows the result.


    ```

    alphas = np.arange(0.1,5,0.1)

    model = Ridge()

    cv = GridSearchCV(estimator=model, param_grid=dict(alpha=alphas))

    y_pred = cv.fit(x_train, y_train).predict(x_test)

    plt.scatter(range(len(y_test)), y_test,  color=''black'')

    plt.plot(y_pred, color=''blue'', linewidth=3)

    print ''Features: %s''%str(features)

    print ''R2 score: %f''%r2_score(y_test, y_pred)

    print ''Intercept: %f''%regr.intercept_

    print ''Coefficients: %s''%str(regr.coef_)

    ```


    Listing 2-11. Calculating Multiple Ridge Regression


    Output


    ![A432778_1_En_2_Fig20_HTML.gif](A432778_1_En_2_Fig20_HTML.gif)


    Figure 2-20. Multiple Ridge regression plot


    ```

    Features:      [''cement_component'', ''flay_ash'', ''water_component'', ''superplasticizer'',
    ''coarse_aggregate'']

    R2 score:      0.097982

    Intercept:     77.802791

    Coefficients:  [0.04531335  0.01168227 -0.13620573  0.24324622 -0.03297459]

    ```


    Smith didn’t have much difficulty in understanding the code in Listing 2-11 as
    it resembled the code in Listing 2-10. The only thing he didn’t understand was
    how grid search was brought into application. Hence Claire started to explain
    the piece of code that has to do with `GridSearchCV`. She at first pointed to
    `alphas = np.arange(0.1,5,0.1)` which was used to generate an array of values
    in the range of 0.1 to 5, with an offset of 0.1. This along with the Ridge regression
    model was then fed into `GridSearchCV`. Hence `GridSearchCV` tried values of alpha
    one by one to determine the one that best fine-tunes the model.


    Having understood the code in Listing 2-11, Smith had a question. Did R² fare
    better when applying Ridge regression? To this Claire said the following:


    > Not at all, as it’s exactly the same and so are the coefficients. The reason
    for which can be that in the presence of multiple features, and multicollinearity
    linear regression tends to bias towards the L2-norm, and L2-norm is the regularization
    term which is used by Ridge regression, hence a resemblance. Moreover, also notice
    that we are using grid search in our approach to optimize for alpha. So what exactly
    is alpha? Alpha is a regularization parameter which is used to weight the L2-norm
    term in Ridge regression. The value of 0 for alpha translates the Ridge regression
    model to the ordinary least squares regression model. Hence the higher the value
    of alpha, the higher the smoothness constraint, and the lower would be the magnitude
    of the coefficients. The effect of alpha values is shown for the illustration
    in Figure 2-21.

    >

    > ![A432778_1_En_2_Fig21_HTML.gif](A432778_1_En_2_Fig21_HTML.gif)

    >

    > Figure 2-21. Effect of alpha value on the smoothness of the regression fit line


    Ridge regression even after parameter didn’t bring any improvement over what a
    multiple linear regression had to offer. Claire believed that changing the regularization
    term from L2-norm to L1-norm might bring some improvements to the R² score. Hence,
    she decided to try out Lasso regression, and came up with the description of that
    in the following sections.'
