  trans: "\n### 多元回归\n\n多元回归是一种使用多个解释变量来预测响应变量结果的回归类型。多元回归的数学定义如下：\n\n*   符号：y\n*\
    \   公式：y = b [0] + b [1] x [1] + b [2] x [2] + b [3] x [3] +….. b [t] x [t] +\
    \ e\n*   图示说明：\n    *   y：响应变量\n    *   x [1] , x [2] , x [3,] ……, x [t]：解释变量\n\
    \    *   b [0]：斜率\n    *   b [1] , b [2] , b [3] , ……., b [t]：截距\n    *   e：回归残差\n\
    \n上述公式也可称为回归方程。本质上，我们试图为所有系数找到最优值，以便在给定所有 x 的情况下，得到 y 的最佳可能值。在单变量情况下，它是一条直线（即线性回归），如图\
    \ 2-3 所示；但在多变量情况下，它变成一个平面，如图 2-4 所示。\n\n![A432778_1_En_2_Fig4_HTML.gif](img/A432778_1_En_2_Fig4_HTML.gif)\n\
    \n图 2-4.\n\n使用两个解释变量和一个响应变量的多元回归说明\n\n将系数（即斜率和截距）的最优值代入上述公式，我们将得到一个方程。该方程中的未知数是\
    \ x 值，即本例中的解释变量值。对于任何给定的 x 值，该方程都会返回一个预测值。\n\n### 逐步回归\n\n这种回归是多元回归的一种定制版本。逐步回归并非使用所有解释变量来预测结果，而是从给定的变量池中自动选择能够产生最佳拟合线的自变量。这可以通过以下任一方式完成：\n\
    \n*   一次尝试一个解释变量，并用其拟合回归模型。如果发现该解释变量在统计上显著，则将其纳入模型。\n*   对所有解释变量运行多元回归，并使用统计上最显著的那个变量来确定最佳拟合回归线。\n\
    \n图 2-5 最好地描述了逐步回归所采用的方法。\n\n![A432778_1_En_2_Fig5_HTML.gif](img/A432778_1_En_2_Fig5_HTML.gif)\n\
    \n图 2-5.\n\n逐步回归流程图 来源：.slideshare.net/bzinchenko/quant-trader-algorithms\n\n\
    然而，根据一些统计学家的观点，这种方法存在以下问题：\n\n*   选择一个解释变量而舍弃其他变量，会导致对所选变量产生偏差，并使我们无法观察到那些最初被舍弃的解释变量本可以捕捉到的变异部分。\n\
    *   在从众多解释变量中进行选择的情况下，完成整个分析过程将需要大量的计算能力，从而耗费时间。\n\n### 多项式回归\n\n有时，在绘制解释变量和响应变量之间的散点图时，我们会看到一种非线性趋势。这种趋势会被线性回归所忽略，因此需要一种非线性处理方法，此时多项式回归就派上了用场。多项式回归使用多项式的次数来生成非线性回归线。多项式回归的数学定义如下：\n\
    \n*   符号：y\n*   公式：y = b [0] + b [1] x + b [2] x ² + b [3] x ³ + b [h] x ^h +\
    \ e\n*   图示说明：\n    *   y：响应变量\n    *   x [1] , x [2] , x [3,] ……, x [h]：解释变量\n\
    \    *   b [0]：斜率\n    *   b [1] , b [2] , b [3] , ……., b [h]：截距\n    *   e：回归残差\n\
    \    *   h：多项式的次数\n\n观察图 2-6，您会注意到，增加多项式的次数会使曲线更加非线性，并在回归线内引入额外的弯曲。\n\n![A432778_1_En_2_Fig6_HTML.gif](img/A432778_1_En_2_Fig6_HTML.gif)\n\
    \n图 2-6.\n\n不同次数（即 h）下的多项式回归曲线\n\n## 回归的假设\n\n为了防止史密斯将回归视为连续数据预测的魔法棒，克莱尔提出了一组假设，这些假设必须成立，回归才能适用于给定的数据集。\n\
    \n### 案例数量\n\n案例数与自变量（IVs）的比例理想情况下应为 20:1。这意味着每个解释变量应有 20 个样本。然而，在极端情况下，每个解释变量至少允许有\
    \ 5 个样本（即，对于 5 个解释变量，数据集中应有 25 个样本）。\n\n### 缺失数据\n\n在回归中，缺失数据可能导致模型不适合样本数据。您可能会遇到以下两种情况之一：\n\
    \n*   有时，某些观测值在数据的所有字段中都存在缺失值。删除这些观测值是明智之举，因为如果缺失值不重要，忽略它们不会干扰模型捕捉到的整体行为。\n* \
    \  如果只有某个特定列在大多数观测值中存在缺失值，则无需处理，因为回归会忽略该变量没有值的那些案例。\n\n#### 异常值\n\n异常值可能会在回归模型的结果中引入偏差，使最佳拟合线向它们自身靠拢。因此，异常值的处理在回归中至关重要，可以通过从第\
    \ 1 章中强调的方法中选择合适的方法来完成。\n\n### 多重共线性与完全共线性\n\n多重共线性和完全共线性是两个会削弱回归建模能力、导致结果怪异且不准确的概念。如果解释变量高度相关，那么回归就容易受到偏差的影响。多重共线性指的是相关系数为\
    \ 0.9 或更高，而完全共线性指的是完全相关（即相关系数为 1）。\n\n对此的补救措施是移除相关系数超过 0.7 的解释变量。但这又带来了以下问题。考虑图\
    \ 2-7 中的例子，其中体重和血压（BP）具有 0.95 的高度相关性。\n\n![A432778_1_En_2_Fig7_HTML.gif](img/A432778_1_En_2_Fig7_HTML.gif)\n\
    \n图 2-7.\n\n多重共线性示意图\n\n现在，哪一个（体重还是血压）是问题变量，应该被移除？这时，容差能否作为补救措施？容差的数学定义如下：\n\n\
    *   公式：容差 = 1 - r ²\n*   图示说明：\n    *   r ²：该变量与回归方程中所有其他自变量的多元相关系数的平方\n\n容差指的是解释变量的方差中未被方程中其他解释变量所解释的比例。这个值越大越好。消除多重共线性和完全共线性将确保响应变量是根据解释变量独立捕捉到的变异来预测的，而不是根据它们之间存在的相关性。\n\
    \n在阅读完可用回归技术的描述后，史密斯很好奇哪种方法最适合手头的问题。然而，克莱尔知道，要找出正确的方法，需要在继续之前对数据有一定的了解。因此，她决定进行特征探索。她所说的特征是指数据集中的变量。她主要想看看数据是什么样的，以及是否存在以下情况：\n\
    \n*   解释变量与响应变量之间是否存在相关性\n*   多重共线性和完全共线性\n"
- fmt: '# Features’ Exploration


    Claire started off by loading the data into memory (see Listing [2-2](#A432778_1_En_2_Chapter.html#Par84)).


    ```

    data = pd.read_csv(''examples/concrete_data.csv'')

    Listing 2-2.

    Reading the Data in the Memory

    ```


    Smith was curious to know how much data there was and what it looked like. Hence
    Claire wrote the code in Listing [2-3](#A432778_1_En_2_Chapter.html#Par86) to
    print some initial observations of the dataset to get a feel of what it contains.


    ```

    print len(data)

    data.head()

    Listing 2-3.

    Printing the Size of the Dataset and Printing the First Few Rows of the Dataset

    ```


    Output


    Table 2-2.


    Print of Observations of the Dataset


    ![A432778_1_En_2_Figa_HTML.gif](A432778_1_En_2_Figa_HTML.gif)


    While looking at the first few observations in Table [2-2](#A432778_1_En_2_Chapter.html#Tab2),
    Smith noticed that all the features except that of `age` are floating point numbers,
    with `age` being the only integer variable. He also noticed that `blast furnace
    slag`, `fly ash`, and `superplasticizer` are not always the prerequisite when
    building a concrete. Moreover, he noticed that the concrete data within the dataset
    can be a year old (i.e., row no. 3 has an age of 365 ∼ year)


    Claire knew for sure that for the analysis (i.e., correlation, regression) to
    be done it is important that feature names should be as simple as possible. Hence
    she wrote the code snippet in Listing [2-4](#A432778_1_En_2_Chapter.html#Par91)
    to make the names brief and human readable. For renaming she followed the name
    mapping as defined in Table [2-3](#A432778_1_En_2_Chapter.html#Tab3).


    Table 2-3.


    Variable Names’ Mapping


    | Old Feature name | New feature name |

    | --- | --- |

    | Cement(component 1)(kg in a m3 mixture) | `cement_component` |

    | Blast Furnace Slag(component 2)(kg in a m3 mixture) | `furnace_slag` |

    | Fly Ash(component 3)(kg in a m3 mixture) | `flay_ash` |

    | Water(component 4)(kg in a m3 mixture) | `water_component` |

    | Superplasticizer(component 5)(kg in a m3 mixture) | `superplasticizer` |

    | Coarse Aggregate(component 6)(kg in a m3 mixture) | `coarse_aggregate` |

    | Fine Aggregate(component 7)(kg in a m3 mixture) | `fine_aggregate` |

    | Age (days) | `age` |

    | Concrete compressive strength(MPa, megapascals) | `concrete_strength` |


    ```

    data.columns = [''cement_component'', ''furnace_slag'', ''flay_ash'', ''water_component'',
    ''superplasticizer'', \

    ''coarse_aggregate'', ''fine_aggregate'', ''age'', ''concrete_strength'']

    Listing 2-4.

    Renaming the Columns

    ```


    Having seen what the data looks like, it was time for Claire to see how well the
    exploratory variables correlate to the response variable and if any multicollinearity/singularity
    in the data exists or not.


    ## Correlation


    Claire first decided to see whether any of the exploratory variables correlates
    to the response variable (i.e., concrete strength). This question was of the utmost
    importance to her because she believed that high correlation between two quantitative
    entities can lead to a better best fit linear regression line. Hence she was interested
    to determine the strength and direction of relationships between these quantitative
    quantities. For that she wrote the code in Listing [2-5](#A432778_1_En_2_Chapter.html#Par96).
    However, before moving forward she explained why correlation and regression are
    not entirely the same:


    > Correlation can be calculated between any two quantitative quantities. However,
    regression is always commuted between a response variable and exploratory variable(s).
    Correlation is limited to just two quantitative quantities where regression can
    have more than two quantitative quantities, that is, one response variable and
    more than one exploratory variables aka multiple regression.


    Claire also pointed out that an easy way to see the correlation visually is to
    use a scatter plot between response variable and exploratory variables, one at
    a time (Figure [2-8](#A432778_1_En_2_Chapter.html#Fig8)).


    ![A432778_1_En_2_Fig8_HTML.gif](A432778_1_En_2_Fig8_HTML.gif)


    Figure 2-8.


    Scatter plot between response variable and exploratory variables


    ```

    plt.figure(figsize=(15,10.5))

    plot_count = 1

    for feature in list(data.columns)[:-1]:

    plt.subplot(3,3,plot_count)

    plt.scatter(data[feature], data[''concrete_strength''])

    plt.xlabel(feature.replace(''_'','' '').title())

    plt.ylabel(''Concrete strength'')

    plot_count+=1

    plt.show()

    Listing 2-5.

    Plotting Scatter Plots Between the Response and Exploratory Variables

    ```


    Claire came up with the description of the code in Listing [2-5](#A432778_1_En_2_Chapter.html#Par96)
    to make Smith at ease with the methodology used. She recalled saying the following:


    > We came up with multiples plots within the same figure by using subplots. We
    first defined the figure size by means of `plt.figure(figsize=(15,10.5))`. This
    fixes the figure to a width of 15 and height of 10.5. The response variable (that
    is, concrete strength) i.e. response variable remains the same for all plots,
    whereas exploratory variables are taken into consideration one at a time (that
    is, Plot by plot). Thus we used: `for feature in list(data.columns)[:-1]` which
    looped through all the variables except the last one (that is, the response variable).
    Then we defined the subplot index as follows: `plt.subplot(3,3,plot_count)`. The
    first three define the number of rows, whereas the other three define the number
    of columns. This means that the figure will be able to accommodate a maximum of
    9 plots. `plot_count` defines the index where that specific plot will be positioned
    on the figure. Possible values within this scenario can be from 1 to 9.


    Smith decided to take a shot and explain the correlations by looking at Figure
    [2-8](#A432778_1_En_2_Chapter.html#Fig8). Hence he came up with the following
    three insights:


    *   The presence of outliers is negligible in the majority of these plots except
    for the plot between concrete strength and age.

    *   In some of the scatter plots we see a high frequency of values lying on 0.
    This can be seen in the plots between the concrete `strength` variable and exploratory
    variables, primarily `age`, `furnace slag`, `fly ash`, and `superplasticizer`.

    *   There seems to exist instances in which positive, sometimes negative, and
    sometimes no correlation exists between the two quantitative quantities.'
