    4.  Recently a new type of boosting, Xgboost, has been popular among data scientists.
    Apply that to our dataset, optimize using grid search, and see if it performs
    relatively better than gradient boosting.  


    Dr. Judy was curious to know if there are other real-world applications to classification.
