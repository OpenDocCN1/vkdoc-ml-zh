    ## 特征探索


    朱迪博士相信数据转储的价值，并使用清单 5-2 中的代码片段将其加载到计算机内存中。她还确保打印出数据转储中的首批初始观测结果。


    表 5-2.


    数据集观测结果打印


    ![A432778_1_En_5_Figa_HTML.gif](img/A432778_1_En_5_Figa_HTML.gif)


    ```

    data = pd.read_csv(''examples/No-show-Issue-Comma-300k.csv'')

    data.head()

    清单 5-2.

    将数据读入内存并打印前几行观测结果

    ```


    朱迪博士决定使用表 5-2 作为辅助工具，将特征归类为最常见的数据类型。


    *   整数：年龄、等待时间

    *   字符串：性别、星期几、状态

    *   日期时间：预约登记、预约日期

    *   布尔值：高血压、残疾、吸烟、奖学金、结核病、短信提醒


    她预计数据转储中的记录数量将达到数千条，因为她注意到每个月初的预约日程通常都是满的。她决定在清单 5-3 中验证这一点。


    ```

    print len(data)

    清单 5-3.

    查找数据集中观测结果的数量

    ```


    输出


    ```


    ```


    清单 5-3 的输出远远超出了朱迪博士的预期，这让她确信从数据中获得的洞察将具有很高的置信度。接下来，她计划观察每个特征中不同值的数量。她相信这有助于她剔除那些没有变异性的特征（即所有观测值都相同），并决定这些特征可以用哪些类型的图表来表示。为此，她编写了清单
    5-4 中的代码。


    ```

    for column in list(data.columns):

    print "{0:25} {1}".format(column, data[column].nunique())

    清单 5-4.

    打印每个特征集中不同值的频率

    ```


    输出


    ```

    Age                             109

    Gender                          2

    AppointmentRegistration         295425

    ApointmentData                  534

    DayOfTheWeek                    7

    Status                          2

    Diabetes                        2

    Alcoolism                       2

    HiperTension                    2

    Handicap                        5

    Smokes                          2

    Scholarship                     2

    Tuberculosis                    2

    Sms_Reminder                    3

    AwaitingTime                    213

    ```


    朱迪博士解释说，打印语句中的 {0:25} 表示将打印第一个索引中的特征（即列），并为其分配 25 个字符空间。清单 5-4 的输出表明数据集中有许多变量具有离散值，例如性别、状态、星期几等。这帮助她选择了表示每个特征的图表类型。她决定将等待时间和年龄绘制成直方图，因为这些是数值型且本质上是连续的。至于本质上是离散的特征，她计划用条形图来表示。她通过初始化清单
    5-5 中的函数来执行该图表，随后在图 5-1 中调用该函数来绘制图形。


    ```

    def features_plots(discrete_vars):

    plt.figure(figsize=(15,24.5))

    for i, cv in enumerate([''Age'', ''AwaitingTime'']):

    plt.subplot(7, 2, i+1)

    plt.hist(data[cv], bins=len(data[cv].unique()))

    plt.title(cv)

    plt.ylabel(''Frequency'')

    for i, dv in enumerate(discrete_vars):

    plt.subplot(7, 2, i+3)

    data[dv].value_counts().plot(kind=''bar'', title=dv)

    plt.ylabel(''Frequency'')

    清单 5-5.

    初始化函数以绘制数据集中的所有特征

    ```


    朱迪博士指出，清单 5-5 中的方法将本质上是离散的特征名称作为输入，因为这些特征将用条形图表示。她没有浪费时间，立即调用该函数来绘制清单 5-6 中的特征表示图。


    ![A432778_1_En_5_Fig1_HTML.jpg](img/A432778_1_En_5_Fig1_HTML.jpg)


    图 5-1.


    特征表示图


    ```

    discrete_vars = [''Gender'', ''DayOfTheWeek'', ''Status'', ''Diabetes'',

    ''Alcoolism'', ''HiperTension'', ''Handcap'', ''Smokes'',

    ''Scholarship'', ''Tuberculosis'', ''Sms_Reminder'']

    features_plots(discrete_vars)

    清单 5-6.

    调用清单 5-5 中的 ''features_plot'' 方法绘制特征表示图

    ```


    在查看图 5-1 时，朱迪博士注意到没有任何特征存在缺失值。她对数据集中的一些特征做出了以下推断：


    *   年龄：年龄的范围在 -2 到 113 之间。0 到 113 的年龄是有意义的，但令她惊讶的是年龄怎么会是负数。在她看来，数据集中存在一些噪声。

    *   残疾：该特征并非布尔值，其值范围在 0 到 4 之间。

    *   短信提醒：该特征并非布尔实体，其值范围在 0 到 2 之间。在她看来，短信提醒表示发送给每位患者的提醒频率。

    *   等待时间：朱迪博士看到等待时间为负数感到困惑。根据定义，该特征表示从预约发出到预约日期之间的天数。她认为正数才更有意义。


    这些推断的结果意味着朱迪博士在将数据输入分析流程之前，需要先对数据进行一些清理（即执行数据整理）。'
- fmt: '# Performing Data Wrangling


    She read somewhere that data wrangling is the process of mapping raw data into
    an organized form suitable for analyzing the data. Findings from Figure [5-1](#A432778_1_En_5_Chapter.html#Fig1)
    depicted the presence of negative values within `''Age''`, which didn’t make any
    intuitive sense to her, and thus she referred to these as noise. Hence she planned
    to start the treatment by counting the frequency of negative `Age` values. If
    the frequency of these observations were high she wouldn’t delete them as doing
    so would keep her from detecting the variations necessary for the prediction.
    To the contrary she planned to delete them if their frequency was negligible as
    deleting them wouldn’t have a major effect on the analysis. She started off by
    taking the frequency of negative `Age` values in Listing [5-7](#A432778_1_En_5_Chapter.html#Par44).


    ```

    data[data[''Age''] < 0][''Age''].value_counts().sum()

    Listing 5-7.

    Counting Frequency of Negative Age Observations

    ```


    Output


    ```


    ```


    The output of Listing [5-7](#A432778_1_En_5_Chapter.html#Par44) indicated the
    negative `Age` observations to be negligible as compared to the total number of
    observations within the dataset. Hence Dr. Judy decided to remove these negative
    observations from the `Age` feature.


    ```

    data = data[data[''Age''] >= 0]

    Listing 5-8.

    Removing Observations with Negative Age Values

    ```


    While looking at the deductions from Figure [5-1](#A432778_1_En_5_Chapter.html#Fig1),
    Dr. Judy also noticed that the feature named `''Handicap''` was an integer variable
    rather than a Boolean variable one. She recalled that the data definition for
    this feature set was missing from the data source and hence open to multiple interpretations.
    The only rationale she could think of for values lying within the range of 0 and
    4 was that this might be a Likert scale question or a numeric entity representing
    the frequency of times a patient has been handicapped. As the interpretation of
    this feature was ambiguous to her she decided to drop this feature from the dataset.


    ```

    del data[''Handcap'']

    Listing 5-9.

    Removing Variable Named ‘Handicap’ from the Dataset

    ```


    While looking at the deductions from Figure [5-1](#A432778_1_En_5_Chapter.html#Fig1),
    Dr. Judy also recalled that values within `AwaitingTime` appeared to be negative,
    and hence it made sense to transform them into positive values.


    ```

    data[''AwaitingTime''] = data[''AwaitingTime''].apply(lambda x: abs(x))

    Listing 5-10.

    Making Values Within AwaitingTime Positive

    ```


    The treatment of features on the basis of her deductions in Figure [5-1](#A432778_1_En_5_Chapter.html#Fig1)
    was completed. However, Dr. Judy recalled reading that most machine learning algorithms
    work best with integer or floating point input rather than in string format. She
    knew that the categorical variables in the dataset didn’t comply with this condition
    and hence it was important for her to recode the string categorical features to
    their integer counterparts. Dr. Judy started off by recoding `DayOfTheWeek` by
    binding the mapping from string to integer.


    ```

    dow_mapping = {''Monday'' : 0, ''Tuesday'' : 1, ''Wednesday'' : 2, ''Thursday''
    : 3, ''Friday'' : 4, ''Saturday'' : 5, ''Sunday'' : 6}

    data[''DayOfTheWeek''] = data[''DayOfTheWeek''].map(dow_mapping)

    Listing 5-11.

    Recode String Categorical Feature DayOfTheWeek to Integers

    ```


    Dr. Judy explained her recoding methodology as follows:


    > There exists methods for automatic recoding of categorical variables. These
    methods perform the recoding in an alphabetic order such that if categories for
    a feature are Male and Female, then it will assign a code of 0 to Female and 1
    to Male. `DayOfTheWeek` is an ordinal quantity; hence I decided to do the mapping
    manually. However, this is not the case in the `Gender` and `Status` features
    as they are nominal in nature. Hence, I will be using the predefined method to
    do the recoding automatically.


    Dr. Judy performed the recoding for `''Gender''` and `''Status''` in Listing [5-12](#A432778_1_En_5_Chapter.html#Par58).


    ```

    for field in [''Gender'', ''Status'']:

    data[field] = pd.Categorical.from_array(data[field]).codes

    Listing 5-12.

    Recode String Categorical Features to Integers

    ```


    Once she had performed data wrangling on the original dataset, Dr. Judy was curious
    as to how their representations had changed. Hence she looked at Figure [5-2](#A432778_1_En_5_Chapter.html#Fig2)
    to see their transformed feature representations.


    ![A432778_1_En_5_Fig2_HTML.jpg](A432778_1_En_5_Fig2_HTML.jpg)


    Figure 5-2.


    Plots of feature representations post data wrangling


    ```

    discrete_vars = [''Gender'', ''DayOfTheWeek'', ''Status'', ''Diabetes'',

    ''Alcoolism'', ''HiperTension'', ''Smokes'',

    ''Scholarship'', ''Tuberculosis'', ''Sms_Reminder'']

    features_plots(discrete_vars)

    Listing 5-13.

    Feature Representations Post Data Wrangling

    ```


    Dr. Judy made sure to remove `''Handicap''` from the list of discrete features
    in Listing [5-13](#A432778_1_En_5_Chapter.html#Par58). She pointed out that recoding
    assigned codes in the range of


    *   0 to (number of unique observations within the feature - 1)


    While looking at Figure [5-2](#A432778_1_En_5_Chapter.html#Fig2), Dr. Judy noticed
    that `AwaitingTime` seemed to decay in an exponential fashion. As per her observation,
    majority of the patients have an age of 0 (i.e., infants whose age is in months).
    She also pointed out to the hikes at the ages of 19, 38, and 57. Other than this,
    another surprising fact was that one-third of patients were males, and that the
    same proportion of patients didn’t show up at the date and time of their appointments.
    This information gave her a clue as to why the clinic was seeing losses despite
    of an increase in the number of appointments. She also noticed that majority of
    the patients were sent at least one SMS reminder; however, two-thirds of the time
    no reminder was sent. The absence of appointment reminders, she believed might
    be the reason behind patients not showing up.


    Once she understood the features within the dataset and after she had removed
    the ambiguities by performing data wrangling, Dr. Judy was interested in identifying
    relationships between different features within the dataset. She wanted to perform
    this multivariate analysis to gain an intuitive understanding of the types of
    patients who don’t show up on their appointment dates and time.'
