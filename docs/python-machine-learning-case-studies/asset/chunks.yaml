    # 3. 时间序列


    本章的目标是让你入门时间序列预测。时间序列预测与回归的不同之处在于，时间充当解释变量，并且应在相等的时间间隔内保持连续。本章将涵盖平稳性的概念、其重要性，以及检查时间序列对象中是否存在平稳性的方法。将应用几种时间序列模型，并使用最有效的评估技术来检查它们的预测结果。


    注意


    本书采用 Python 2.7.11 作为编码示例的事实标准。此外，你需要安装该版本以完成练习。

