    ```


    David 在查看图 3-7 时，对某些具体结果感到兴奋。探索性分析方法证明，去除趋势后的数据是平稳的，因为其滚动均值和标准差近乎恒定。迪基-富勒检验也证实了这一点，因为检验统计量小于所有临界值。这意味着原假设被拒绝，去除趋势后的时间序列对象在
    99% 的置信水平下是平稳的。


    David 达到了他的目标：他将对数变换后的时间序列对象的性质改变为平稳。然而，他想探索其他技术是否能使其更接近平稳性质。因此，他决定尝试使用指数加权移动平均来估计趋势。


    #### 指数加权移动平均


    指数加权移动平均与滚动均值方法类似，区别在于最近的观测值被赋予最高权重，而较早的观测值被赋予最低权重。换句话说，权重分配从最近的观测值到最早的观测值呈指数递减。


    随后，David 将对数变换后的时间序列对象应用指数加权移动平均，以观察是否能在使时间序列对象更接近平稳方面取得显著改进。


    ```

    expwighted_avg = pd.ewma(data_log, halflife=15)

    data_log_ewma_diff = data_log - expwighted_avg

    evaluate_stationarity(data_log_ewma_diff)

    清单 3-12.

    对时间序列对象应用指数加权移动平均平滑

    ```


    输出


    ![A432778_1_En_3_Fig8_HTML.gif](img/A432778_1_En_3_Fig8_HTML.gif)


    图 3-8.


    指数加权移动平均平滑后的时间序列


    ```

