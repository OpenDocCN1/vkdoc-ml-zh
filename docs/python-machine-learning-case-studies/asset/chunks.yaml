    ### 高斯混合模型


    高斯混合模型利用概率论来估计数据可被划分的聚类数量。它基于一个假设：所有数据点都是由有限个参数未知的高斯分布混合生成的。高斯混合模型可视为 k-means
    的增强版，其中考虑了数据的协方差以及高斯模型的中心。


