    ## Hypothesis Testing: Comparing Two Groups


    Before going through the methodology to compare two groups, it is important to
    understand null and alternative hypotheses.


    Null hypothesis is something we attempt to find evidence against in the hypothesis
    tests. Null hypothesis is usually an initial claim that researchers make on the
    basis of previous knowledge or experience. Alternative hypothesis has a population
    parameter value different from that of null hypothesis. Alternative hypothesis
    is something you hope to come out to be true. Statistical tests are performed
    to decide which of these holds true in a hypothesis test. If the experiment goes
    in favor of the null hypothesis then we say the experiment has failed in rejecting
    the null hypothesis. You might be thinking, “Ain’t it the same” as that of accepting
    the null hypothesis? Well, no! Not guilty doesn’t actually mean that a person
    is innocent.


    ### t-Statistics


    `t`-refers to a difference represented in the units of standard error. This exists
    in two most common variants:


    **1-sample-t**


    This is the search of evidence of a significant difference between a population
    mean and a hypothesized value.


    **2-sample-t**


    This is when you are trying to find the evidence of a significant difference between
    population means. Note that the samples from both the distributions should be
    independent of each other.


    `t`-value and `p`-values are internally linked. The larger the absolute value
    of the `t`-value, the smaller the `p`-value as the distribution is concentrated
    around the mean, and thus the higher the probability to reject the null hypothesis.


    `t`-value can be negative as well as positive. The greater the magnitude of `T`
    in either direction, the greater is the evidence against the notion that there
    is no significant difference (i.e., the null hypothesis). Vice versa, if the `t`-value
    approaches 0, then it implies that there is no significant difference between
    the population means or between a population mean and a hypothesized value.


    Contrary to a statistical phenomenon like correlation, a `t`-value is calculated
    by sampling one value from the entire population. Given that the sampling is random,
    each time a `t`-value is calculated the answer presents a random sampling error
    (i.e., some variation from the `t`-value calculated earlier).


    `t`-distributions help identify the magnitude of change due to random sampling
    from the entire population.'
