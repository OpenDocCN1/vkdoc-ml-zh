    SGDClassifier(alpha=0.0001, average=False, class_weight=None, epsilon=0.1,

    eta0=0.0, fit_intercept=True, l1_ratio=0.15,

    learning_rate=''optimal'', loss=''hinge'', n_iter=5, n_jobs=1,

    penalty=''l2'', power_t=0.5, random_state=None, shuffle=True,

    verbose=0, warm_start=False)

    ```


    Judy 博士在清单 5-28 中拟合了两次模型。这样做的原因是，她首先通过 RBF 采样器对数据进行拟合和变换，从而对数据进行采样。据 Judy 博士所说，RBF
    采样器在应用线性算法之前，近似了 RBF 核的特征映射。她还指出，`fit_tranform` 中的 `fit` 执行了蒙特卡洛采样，而 `transform`
    项执行了数据的映射。


    然后，她编写了清单 5-29 中的代码，将训练好的模型应用于测试数据集，然后使用它来查找预测标签以及模型的准确性。


