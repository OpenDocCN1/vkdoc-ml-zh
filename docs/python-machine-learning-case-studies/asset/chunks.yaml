- fmt: '### Biostatistics


    There are applications of statistics in various branches of biology. This encompasses
    the design of biological experiments and making inferences from them. Diving deeper
    into biostatistics reveals examples in which subjects (patients, cells, etc.)
    exhibit variation in response to some stimuli (e.g., medicine). Biostatisticians
    use inferential statistics to give meaning to these anomalies.


    ### Astrostatistics


    `Astrostatistics` is an amalgam of statistical analysis, astrophysics, and data
    mining. Data collected from automatic scanning of cosmos is used to make deductions.


    ### Business Analytics


    `Business Analytics` uses operational and statistical theories to make predictive
    models. It also incorporates optimization techniques to garner effective insights
    for customers and business executives.


    These insights enable companies to automate and optimize their business processes.
    `Business intelligence` differs from `business analytics` in that `business intelligence`
    helps us answer what happened whereas `business analytics` helps us understand
    the reason for this anomaly (i.e., why it happened in the first place and the
    chances of it happening again). These analytics are used in various business areas
    such as enterprise optimization, fraud analytics, pricing analytics, supply chain
    analytics, and so on.


    ### Econometrics


    The application of statistical methods for estimating economic relationships constitutes
    econometrics. Some of the examples include measuring the effect of divorce laws
    on divorce and marriage rates, change in wages of native workers from impact on
    immigration policies, or forecasting macroeconomic variables of inflation rates,
    interest rates, or gross domestic product.


    ### Machine Learning


    Several machine learning algorithms are based on statistical theories or an advanced
    version of the same. An example of this is the `Bayesian` theory which is commonly
    used.


    ### Statistical Signal Processing


    Past corpus of speeches is used to determine the highest probability of spoken
    words. Moreover, statistical signal processing is used in the following applications:


    *   Game theory

    *   Estimation and filtering

    *   Signal processing

    *   Linear systems


    ### Elections


    Campaign managers use the results of the polls to infer wins in the coming elections
    for their political parties.


    # 2. Regression


    `Regression` and time series analysis make predictions for quantitative target
    variables possible. This chapter aims to highlight the core concept of regression
    and its variants. The emphasis here is to take the readers through the journey
    of model selection when solving for real-world problems. Moreover, this chapter
    also features statistical tests to evaluate the findings of these regression techniques.


    **Note**


    This book incorporates `Python 2.7.11` as the de facto standard for coding examples.
    Moreover, you are required to have it installed for the Exercises.


    In this chapter we will be using the `Concrete Compressive Strength` dataset for
    coding examples and exercises. This data dump can be downloaded from UCI’s web
    site link:


    [`http://archive.ics.uci.edu/ml/datasets/Concrete+Compressive+Strength`](http://archive.ics.uci.edu/ml/datasets/Concrete+Compressive+Strength)


    ## Case Study: Removing Inconsistencies in Concrete Compressive Strength


    Andrew had an hour-long meeting with Smith regarding the frequent complaints he
    had been receiving from their existing clientele. Smith was the sales representative
    at a construction aggregates company and was facing difficulties in meeting his
    sales targets. Smith believed that the reason for his difficulties was that the
    existing clients had complaints regarding quality inconsistencies—this, when coupled
    with negative word of mouth in the market, was making it tough for him to seal
    deals with potential customers.


    Andrew, the plant supervisor, was Smith’s friend. At first Smith tried to find
    a solution for this problem, but when things got out of his control, he decided
    to have a meeting with Andrew.


    There is usually friction between the production and sales departments in most
    companies. Both of them usually fight over their yearly budgets and their plans
    for meeting their annual targets. Smith knew this but he felt sure that things
    would be different with Andrew as they had been friends for some time. However,
    as the meeting kicked off and Smith presented the matter to Andrew, to his dismay
    Andrew wasn’t ready to acknowledge any inconsistencies in production. As Smith
    recalled Andrew saying, “These complaints don’t make any sense to me. You ask
    why! Well first of all, we had an upgrade at our production plant in the last
    quarter, and you know for a fact that the raw material we use goes through a thorough
    testing prior to being used for production.”


    The meeting didn’t help Smith in any way, and he let the matter go for some time.
    One day, when he was in a networking session during one of his company’s corporate
    events, Smith heard some executives from the production department talking about
    the recent upgrade of the plant. He recalled hearing one of the executives say,
    “Though we don’t have any testing improvement in our recent upgrade for measuring
    concrete compressive strength, then too our product quality is superior thanks
    to our robust testing of raw material used.”


    When Smith heard this, he did some research and was surprised to discover that
    the complaints had gained momentum ever since the upgrade had taken place. However,
    he also discovered that the procurement of the testing equipment was put on hold
    due to a shortage of funds allocated to the procurement department. Smith knew
    for a fact that he couldn’t afford to wait until the next year for the issue to
    resolve on its own, and he had to find a way to make things right.


    He had heard that the recent upgrade meant that machines had recording data. Smith
    decided to set up a meeting with Claire (the manager of analytics) to see if she
    could help in figuring out the reason behind the inconsistencies in concrete compressive
    strength. The meeting went well for Smith, as Claire assured him of the in-house
    analytics capabilities. As Claire recalled, “At that time we had started up the
    analytics vertical, but I knew for sure that we had the muscles to formulate a
    model which can answer this anomaly.”


    Smith was relieved and now had to formulate a strategy to take his findings forward—that
    is, either approach management with his findings or share his findings to the
    production department for them to integrate those into their inner processes.
    However, Smith was curious if the data at hand was strong enough to deduce some
    quality findings. Moreover, he was interested to see which factors influence concrete
    compressive strength the most.


    Smith was interested to know which features of the dataset Claire would be working
    on. Hence, Claire came up with the data dictionary in Table [2-1](#A432778_1_En_2_Chapter.html#Tab1).


    **Table 2-1.** Data Dictionary for the Concrete Compressive Strength Dataset'
