- fmt: '# Case Study: Predicting Daily Adjusted Closing Rate of Yahoo


    David had a meeting scheduled with his client Janice the next day. They were meeting
    to investigate the reason for a dip in Janice’s returns. Janice was the daughter
    of a millionaire businessman, and she had approached David after hearing speculations
    that the market was expected to grow with escalating economic conditions. She
    was interested in taking a long-term risky position to enjoy potentially high
    returns on investment. However, this quarter she had seen a dip in her returns
    despite a good outlook in the capital market.


    David searched Janice’s portfolio and started looking at the performance of each
    stock individually to see how each one of them had fared in the last quarter.
    He figured out that the reason for the mismatch between the portfolio’s return
    and the expected returns was a huge residual in Yahoo stock forecasts. This forecast
    error would have had a minimal impact had the number of shares been a tiny chunk
    of the entire portfolio, but that was not the case in this scenario.


    David recalled the courses in corporate finance and business analytics that he
    had taken during his time at Harvard Business School and decided to give those
    concepts a try for figuring out a solution to this problem. Should he apply regression
    or time series? Which techniques can he apply to a forecast for the Yahoo stock?


    David pulled the data regarding Yahoo stock from the Matplotlib finance package
    provided by Python (see Listing [3-2](#A432778_1_En_3_Chapter.html#Par12) for
    a code snippet).


    David did some research to see what information is present in each feature within
    the data. He came up with a data dictionary for the Yahoo Stock prices dataset
    (see Table [3-1](#A432778_1_En_3_Chapter.html#Tab1)).


    **Table 3-1.** Data Dictionary for the Yahoo Stock Prices Dataset


    | Feature name | Description |

    | --- | --- |

    | `Date` | Date of given day of trading |

    | `Year` | Year of given day of trading |

    | `Month` | Month of given day of trading |

    | `Day` | Month of given day of trading |

    | `D` | Floating point representation of day |

    | `Open` | Open rate of given day of trading |

    | `Close` | Close rate of given day of trading |

    | `High` | High rate of given day of trading |

    | `Low` | Low rate of given day of trading |

    | `Volume` | Shares volume of given day of trading |

    | `adjusted_close` | Close rate of given day of trading. This also takes into
    account distributions and corporate actions that occurred before that day’s market
    opening. |


    Before moving forward David thought of initializing the following packages. This
    he preferred to do in order to avoid bottlenecks while implementing the code snippets
    on his local machine.


    ```

    %matplotlib inline

    import pandas as pd

    import numpy as np

    from datetime import datetime

    import statsmodels.api as sm

    import matplotlib.pyplot as plt

    from IPython.display import Image

    from matplotlib.pylab import rcParams

    from statsmodels.tsa.stattools import adfuller

    from statsmodels.tsa.stattools import acf, pacf

    from sklearn.linear_model import LinearRegression

    from statsmodels.tsa.arima_model import ARMA, ARIMA

    from sklearn.metrics import explained_variance_score

    from matplotlib.finance import fetch_historical_yahoo, parse_yahoo_historical_ochl

    rcParams[''figure.figsize''] = 15, 5

    ```


    **Listing 3-1.** Importing Packages Required for This Chapter


    David knew with certainty that understanding the data is fundamental prior to
    starting any analysis. His plan was to load the dataset within the memory and
    see a time plot of the adjusted closing rates to see if any pattern exists within
    the time series object.


    ## Feature Exploration


    David started off by loading the data into memory.


    ```

    fh = fetch_historical_yahoo(''^GSPC'', (2016, 1, 1), (2016, 12, 31))

    yahoo_data = parse_yahoo_historical_ochl(fh, asobject=True, adjusted=False)

    ```


    **Listing 3-2.** Reading the Data in the Memory


    While explaining the code, he first explained that `fetch_historical_yahoo` class
    was used to fetch the object of the yahoo index for all trading days of 2016.
    Next he passed that object into the `parse_yahoo_historical_ochl` method to get
    the data for the features described in Table [3-1](#A432778_1_En_3_Chapter.html#Tab1).


    ![A432778_1_En_3_Fig1_HTML.gif](A432778_1_En_3_Fig1_HTML.gif)


    **Figure 3-1.** Time series plot of adjusted closing rate of Yahoo stock for year
    2016


    ```

    dates = [x[0] for x in list(yahoo_data)]

    values = [x[-1] for x in list(yahoo_data)]

    data = pd.DataFrame({''Close_Adj'':values}, index=dates)

    date_thresh = datetime.strptime(''2016-10-01'',"%Y-%m-%d").date()

    data_train = data[:date_thresh]

    data_test = data[date_thresh:]

    plt.plot(data_train.index, data[''Close_Adj''])

    plt.xlabel(''Year'')

    plt.ylabel(''Adjusted Closing Rate'')

    plt.title(''Yahoo Adjusted closing rate - Year 2016'')

    ```


    **Listing 3-3.** Plotting Adjusted Closing Rate of Yahoo Stock for 2016 on a Time
    Series


    From Listing [3-3](#A432778_1_En_3_Chapter.html#Par14), David plotted the Yahoo
    stock closing rates for the year 2016 in Figure [3-1](#A432778_1_En_3_Chapter.html#Fig1).
    He split the original data series into test data (i.e., `data_test`) and train
    data (i.e., `data_train`). Hence, from that time onward David decided to use `data_train`
    as the data for formulating the time series model.


    Looking at the distribution in Figure [3-1](#A432778_1_En_3_Chapter.html#Fig1)
    David noticed that a definitive upward trend exists. Moreover, he saw that a seasonality
    exists (i.e., downward dip), repeating itself every 4.5-month interval.


    Because the majority of Janice’s portfolio included Yahoo stock, David knew that
    he had to take some measures to reduce the forecast error. In order for him to
    validate his model he decided to split the dataset. He aimed to use the data of
    the first nine months of 2016 as the training dataset, with the last three months
    for cross-validation of the model’s forecast. An idea came mind that he could
    use the forecasting techniques to come up with a generalization curve for the
    Yahoo stock time series. Then on the basis of the shape of that curve he could
    decide on the regression model that would enable predictions at a future point
    in time. The rationale behind using the forecasting techniques was to capture
    the seasonality and trend components present in the time series object.


    Hence David started off by concentrating on the first goal—that is, formulating
    a time series forecasting model that captures the components of Yahoo stock time
    series at its best. He recalled from his corporate finance course that they used
    to apply time series methods for stock forecasting. He did some research to understand
    what time series modeling is, and when it should be preferred.


    ### Time Series Modeling


    Data points collected at fixed period time intervals constitute a time series.
    Time series analysis is usually done with the objective of forecasting the long-term
    trend over time as per the problem’s underlying hypothesis.


    It was Friday and David was now looking forward to the weekend with his friends
    and family. He was also excited about meeting his friend Maria, who had been his
    batch mate in school, whose research was inclined toward statistics.


    It was Saturday, and David was having lunch with Maria at a famous fast-food restaurant.
    Without wasting much time, David brought up the problem and how he was planning
    on solving it. He knew that it was better to do due diligence in the analysis
    initially to conclude fruitful research. Thus he was interested to hear from Maria
    regarding the statistical concepts and techniques essential to time series analysis
    that he should incorporate before moving forward, Maria recommended that he check
    if his time series data was stationary as a majority of the time series models
    are designed to give results on stationary data.'
