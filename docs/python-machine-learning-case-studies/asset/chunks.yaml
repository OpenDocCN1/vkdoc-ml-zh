- fmt: '#### Moving Average Smoothing


    Moving average smoothing is similar to rolling mean in that in both these methods,
    the average of observations lying within a fixed window size is calculated in
    order to estimate the observation at a given time.


    David decided to apply moving average smoothing to estimate the trend of the log
    transformed time series. He decided to apply rolling mean over the past two weeks
    (i.e., last 15 values) by writing the code in Listing [3-9](#A432778_1_En_3_Chapter.html#Par75).


    ![A432778_1_En_3_Fig6_HTML.gif](A432778_1_En_3_Fig6_HTML.gif)


    Figure 3-6. Moving average smoothed time series


    ```

    moving_avg = pd.rolling_mean(data_log,15)

    plt.plot(data_log)

    plt.plot(moving_avg, color=''red'')

    Listing 3-9.

    Applying Moving Average Smoothing to the Time Series Object

    ```


    David made the following deduction from Figure [3-6](#A432778_1_En_3_Chapter.html#Fig6):
    “The red line shows the rolling mean, that is, the estimated trend from the moving
    average smoothing. The goal is now to subtract this estimated trend from the log
    transformed time series.” Note that since David had taken the average of the last
    15 values, rolling mean is not defined for the first 14 values. This can be observed
    from the output of Listing [3-10](#A432778_1_En_3_Chapter.html#Par77).


    ```

    data_log_moving_avg_diff = data_log - moving_avg

    data_log_moving_avg_diff.head(15)

    Listing 3-10.

    Printing Trendless Time Series Object

    ```


    Output


    ```

    2016-01-04      NaN

    2016-01-05      NaN

    2016-01-06      NaN

    2016-01-07      NaN

    2016-01-08      NaN

    2016-01-11      NaN

    2016-01-12      NaN

    2016-01-13      NaN

    2016-01-14      NaN

    2016-01-15      NaN

    2016-01-19      NaN

    2016-01-20      NaN

    2016-01-21      NaN

    2016-01-22      NaN

    2016-01-25      -0.023439

    Name: Close_Adj, dtype: float64

    ```


    David knew that the trend has `NaN` in its first 14 observations. Hence he decided
    to remove `NaN` from the trend and then subtract this trend from the original
    time series object. He expected the result to be stationary and planned to test
    it (see Listing [3-11](#A432778_1_En_3_Chapter.html#Par81)) from the function
    defined in Listing [3-4](#A432778_1_En_3_Chapter.html#Par39).


    ```

    data_log_moving_avg_diff.dropna(inplace=True)

    evaluate_stationarity(data_log_moving_avg_diff)

    Listing 3-11.

    Evaluating Trendless Time Series for Stationary

    ```


    Output


    ![A432778_1_En_3_Fig7_HTML.gif](A432778_1_En_3_Fig7_HTML.gif)


    Figure 3-7. Time series with moving average removed along with rolling mean and
    standard deviation


    ```

    Results of Dickey-Fuller Test:

    Test Statistic                  -4.375719

    p-value                         0.000328

    #Lags Used                      0.000000

    Number of Observations Used     174.000000

    Critical Value (5%)             -2.878298

    Critical Value (1%)             -3.468502

    Critical Value (10%)            -2.575704

    dtype: float64

    ```


    David was thrilled by some concrete results while looking at Figure [3-7](#A432778_1_En_3_Chapter.html#Fig7).
    The exploratory analysis approach proved the trendless data to be stationary because
    of a near to constant rolling mean and standard deviation. The Dickey-Fuller test
    proved the same as well because the test statistics came out to be smaller than
    all of the critical values. This meant that the null hypothesis is rejected and
    the trendless time series object stood stationary with a confidence level of 99%.


    David got what he wanted; that is, he changed the nature of the log transformed
    time series object to a stationary one. However, he wanted to explore if other
    techniques can make it closer to the stationary nature. Hence, he decided to try
    the exponentially weighted moving average for estimating the trend.


    #### Exponentially Weighted Moving Average


    Exponentially weighted moving average is similar to the rolling mean approach
    except that a recent observation is assigned the highest weight and a distinct
    one the lowest. In other words, the weight assignment decreases exponentially
    from the most recent observation to the most distinct one.


    David then applied the exponential weighted moving average to the log transformed
    time series object to see if he could witness a considerable improvement in making
    the time series object resemble the stationary one.


    ```

    expwighted_avg = pd.ewma(data_log, halflife=15)

    data_log_ewma_diff = data_log - expwighted_avg

    evaluate_stationarity(data_log_ewma_diff)

    Listing 3-12.

    Applying Exponential Weighted Moving Average Smoothing to the Time Series Object

    ```


    Output


    ![A432778_1_En_3_Fig8_HTML.gif](A432778_1_En_3_Fig8_HTML.gif)


    Figure 3-8. Exponentially weighted moving average smoothed time series


    ```

    Results of Dickey-Fuller Test:

    Test Statistic                  -3.273472

    p-value                         0.016107

    #Lags Used                      0.000000

    Number of Observations Used     188.000000

    Critical Value (5%)             -2.877040

    Critical Value (1%)             -3.465620

    Critical Value (10%)            -2.575032

    dtype: float64

    ```


    While looking at Figure [3-8](#A432778_1_En_3_Chapter.html#Fig8), David noticed
    that the rolling mean varied more than it did in Figure [3-7](#A432778_1_En_3_Chapter.html#Fig7).
    Hence he was indifferent to reaching a conclusion using the exploratory data analysis
    method. However, test statistics from the Dickey-Fuller test barely crossed the
    5% critical value measure. Thus, the test statistic being less than the critical
    value meant rejection of the null hypothesis. This led David to conclude that
    the log transformed trendless time series object has successfully become stationary
    in nature.


    The only considerable success that David had had so far came from removing the
    moving average smoothing estimated trend from the log transformed time series.
    However, he was not convinced of the stationary nature within the time series
    while looking at its exploratory data analysis plot. As per his deduction in Figure
    [3-1](#A432778_1_En_3_Chapter.html#Fig1), the time series object had both trend
    and seasonality. If trend reduction could do so well, he wondered, logically,
    whether both trend and seasonality reduction should do even better. He started
    looking for techniques to reduce both trend and seasonality. It didn’t take him
    long to figure out that differencing can do this job.'
