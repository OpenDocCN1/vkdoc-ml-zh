    \ power of more than one model to build a model that can do predictions with top-notch\
    \ accuracy. After a thorough search, Dr. Judy found out that “ensemble” is the\
    \ term that describes the representation she desired. She also discovered that\
    \ ensemble techniques are subdivided into two types (i.e., Boosting and Bagging),\
    \ which she believed were important to understand before using them to train the\
    \ model.\n\n### Ensemble Methods\n\nAn ensemble method combines predictions from\
    \ multiple machine learning algorithms, which result in relatively more accurate\
    \ predictions than an individual model could have captured. Ensemble methods are\
    \ usually divided into two variants (Bagging and Boosting).\n\n#### Bagging\n\n\
    Bagging, also known as a bootstrap method, optimizes on minimizing the variance.\
    \ It does that by generating additional data for the training dataset using combinations\
    \ to produce multisets of same size as that of the original data. The application\
    \ of Bagging is ideal when the model overfits and you tend to go to higher variance.\
    \ This can be taken care of by taking many resamples, each overfitting, and averaging\
    \ them out together. This in turn cancels some of the variance.\n\n![A432778_1_En_5_Fig14_HTML.gif](A432778_1_En_5_Fig14_HTML.gif)\n\
    \nFigure 5-14.\n\nBasic work flow of Bagging algorithms\n\nDecision trees are\
    \ sensitive to specific data on which they are trained on. If training data is\
    \ changed, the resulting decision tree can be quite different and can yield different\
    \ predictions. A decision tree being a high-variance machine learning algorithm\
    \ has the application of Bagging by means of the bootstrap procedure.\n\nConsider\
    \ a dataset that has 50 features and 3,000 observations. Bagging might create\
    \ 500 trees with 500 random observations for 20 features in each tree. Finally\
    \ it will average out the predictions for all of those 500 tree models to get\
    \ the final prediction.\n\n#### Boosting\n\nBoosting defines an objective function\
    \ to measure the performance of a model given a certain set of parameters. The\
    \ objective function contains two parts: regularization and training loss, both\
    \ of which add to one another. The training loss measures how predictive our model\
    \ is on the training data. The most commonly used training loss function includes\
    \ mean squared error and logistic regression. The regularization term controls\
    \ the complexity of the model, which helps avoid overfitting. Boosting trees use\
    \ tree ensembles because they sum together the prediction of multiple trees .\n\
    \n![A432778_1_En_5_Fig15_HTML.gif](A432778_1_En_5_Fig15_HTML.gif)\n\nFigure 5-15.\n\
    \nBasic work flow of Boosting algorithms\n\nDr. Judy decided to put Bagging into\
    \ the application by applying the most sought Bagging technique (i.e., random\
    \ forest classification).\n\n## Random Forest Classification\n\nRandom forest\
    \ classification is a type of Bagging, and it is one of the most powerful machine\
    \ learning algorithms available currently. In decision tree classification, different\
    \ subtrees can have a lot of structural similarities which can result in prediction\
    \ outputs that are strongly correlated to each other. The random forest classifier\
    \ reduces this correlation among the subtrees by limiting the features at each\
    \ split point. So, instead of choosing a variable from all variables available,\
    \ random forest searches for the variable that will minimize the error from a\
    \ limited random sample of features. For classification, the number of variables\
    \ at each split can be defined as follows:\n\n![A432778_1_En_5_Fig16_HTML.gif](A432778_1_En_5_Fig16_HTML.gif)\n\
    \nFigure 5-16.\n\nIllustration of random forest classifier\n\n*   Symbol: m\n\
    *   Formula: ![$$ \\sqrt{p} $$](A432778_1_En_5_Chapter_IEq1.gif)\n*   Where,\n\
    \    1.  ‘m’ is the optimal number of variables at each split  \n    2.  ‘p’ is\
    \ the number of total variables in the dataset  \n\nRandom forest classifiers\
    \ are fast and can work with data which is unbalanced or has missing values. She\
    \ wrote the code in Listing [5-30](#A432778_1_En_5_Chapter.html#Par171) to apply\
    \ this ensemble technique to the application.\n\n```\nclf = RandomForestClassifier()\n\
    clf.fit(x_train, y_train)\nListing 5-30.\nTraining RandomForest Classifier on\
    \ Training Dataset\n```\n\nOutput\n\n```\nRandomForestClassifier(bootstrap=True,\
    \ class_weight=None, criterion='gini',\nmax_depth=None, max_features='auto', max_leaf_nodes=None,\n\
    min_impurity_split=1e-07, min_samples_leaf=1,\nmin_samples_split=2, min_weight_fraction_leaf=0.0,\n\
    n_estimators=10, n_jobs=1, oob_score=False, random_state=None,\nverbose=0, warm_start=False)\n\
    ```\n\nDr. Judy applied the random forest classifier with the default parameters\
    \ configuration. She then wrote the code snippet in Listing [5-31](#A432778_1_En_5_Chapter.html#Par175)\
    \ to evaluate the goodness of the random forest classifier model.\n\n```\ny_pred\
    \ = clf.predict(x_test)\nmodel_performance('Random Forest', x_train, y_train,\
    \ y_test, y_pred)\nListing 5-31.\nFinding Accuracy of the Random Forest Classifier\
    \ Model\n```\n\nOutput\n\n![A432778_1_En_5_Fig17_HTML.gif](A432778_1_En_5_Fig17_HTML.gif)\n\
    \nFigure 5-17.\n\nROC curve for random forest classifier\n\n```\nModel name: Random\
    \ Forest\nTest accuracy (Accuracy Score):           0.640874\nTest accuracy (ROC\
    \ AUC Score):            0.534295\nTrain accuracy:                           0.990071\n\
    Area Under the Precision-Recall Curve:    0.132014\n```\n\nTrain accuracy resembled\
    \ that of the decision tree classifier. It appeared that both of the tree classifier\
    \ techniques overfitted the model. However, contrary to the decision tree classifier,\
    \ test accuracy of the random forest classifier increased considerably. However,\
    \ the test level accuracy was nowhere close to that gained from the SGD classifier\
    \ with kernel approximation (i.e., 0.7 vs. 0.64).\n\nHaving applied the random\
    \ forest classifier, Dr. Judy was interested to see if the boosting ensemble would\
    \ yield a strong model or not. For that purpose she planned to apply gradient\
    \ boosting to the train-test split obtained from Listing [5-24](#A432778_1_En_5_Chapter.html#Par122)."
  trans: "\n在佐伊的帮助下，朱迪博士得以清晰地看透混乱。然而，她对自己目前探索的模型精度仍不满意。她想知道是否存在某种技术，能够结合多个模型的力量，构建一个具有顶尖预测精度的模型。经过一番深入研究，朱迪博士发现“集成”正是她所寻求的表示方法。她还了解到，集成技术分为两种类型（即提升法和装袋法），她认为在使用这些技术训练模型之前，理解它们至关重要。\n\
    \n### 集成方法\n\n集成方法结合了多个机器学习算法的预测结果，从而获得比单个模型更准确的预测。集成方法通常分为两种变体（装袋法和提升法）。\n\n\
    #### 装袋法\n\n装袋法，也称为自助法，其优化目标是最大限度地减少方差。它通过组合生成与原始数据大小相同的多重集，为训练数据集生成额外的数据来实现这一点。当模型过拟合且倾向于产生高方差时，应用装袋法是理想的选择。这可以通过进行多次重采样（每次都会过拟合），然后将它们的结果平均在一起来解决。这反过来会抵消部分方差。\n\
    \n![A432778_1_En_5_Fig14_HTML.gif](img/A432778_1_En_5_Fig14_HTML.gif)\n\n图 5-14.\n\
    \n装袋算法的基本工作流程\n\n决策树对其训练所依据的特定数据非常敏感。如果训练数据发生变化，生成的决策树可能会有很大不同，并产生不同的预测。决策树作为一种高方差的机器学习算法，可以通过自助法过程来应用装袋法。\n\
    \n考虑一个包含 50 个特征和 3000 个观测值的数据集。装袋法可能会创建 500 棵树，每棵树包含 500 个随机观测值和 20 个特征。最后，它将平均这\
    \ 500 个树模型的所有预测，以得到最终预测。\n\n#### 提升法\n\n提升法定义了一个目标函数，用于衡量给定一组参数时模型的性能。目标函数包含两部分：正则化和训练损失，两者相加。训练损失衡量我们的模型在训练数据上的预测能力。最常用的训练损失函数包括均方误差和逻辑回归。正则化项控制模型的复杂度，有助于避免过拟合。提升树使用树集成，因为它们将多个树的预测结果相加。\n\
    \n![A432778_1_En_5_Fig15_HTML.gif](img/A432778_1_En_5_Fig15_HTML.gif)\n\n图 5-15.\n\
    \n提升算法的基本工作流程\n\n朱迪博士决定通过应用最受欢迎的装袋技术（即随机森林分类）来将装袋法付诸实践。\n\n## 随机森林分类\n\n随机森林分类是装袋法的一种，也是目前最强大的机器学习算法之一。在决策树分类中，不同的子树可能具有许多结构相似性，这可能导致预测输出彼此高度相关。随机森林分类器通过限制每个分裂点处的特征来减少子树之间的这种相关性。因此，随机森林不是从所有可用变量中选择一个变量，而是从有限的随机特征样本中搜索能够最小化误差的变量。对于分类问题，每个分裂点处的变量数量可以定义如下：\n\
    \n![A432778_1_En_5_Fig16_HTML.gif](img/A432778_1_En_5_Fig16_HTML.gif)\n\n图 5-16.\n\
    \n随机森林分类器示意图\n\n*   符号：m\n*   公式：![$$ \\sqrt{p} $$](img/A432778_1_En_5_Chapter_IEq1.gif)\n\
    *   其中，\n    1.  ‘m’ 是每个分裂点处的最优变量数量\n    2.  ‘p’ 是数据集中变量的总数\n\n随机森林分类器速度快，并且可以处理不平衡或包含缺失值的数据。她编写了清单\
    \ 5-30 中的代码，将此集成技术应用于实际应用。\n\n```\nclf = RandomForestClassifier()\nclf.fit(x_train,\
    \ y_train)\n清单 5-30.\n在训练数据集上训练随机森林分类器\n```\n\n输出\n\n```\nRandomForestClassifier(bootstrap=True,\
    \ class_weight=None, criterion='gini',\nmax_depth=None, max_features='auto', max_leaf_nodes=None,\n\
    min_impurity_split=1e-07, min_samples_leaf=1,\nmin_samples_split=2, min_weight_fraction_leaf=0.0,\n\
    n_estimators=10, n_jobs=1, oob_score=False, random_state=None,\nverbose=0, warm_start=False)\n\
    ```\n\n朱迪博士使用默认参数配置应用了随机森林分类器。然后，她编写了清单 5-31 中的代码片段，以评估随机森林分类器模型的优劣。\n\n```\n\
    y_pred = clf.predict(x_test)\nmodel_performance('Random Forest', x_train, y_train,\
    \ y_test, y_pred)\n清单 5-31.\n计算随机森林分类器模型的准确率\n```\n\n输出\n\n![A432778_1_En_5_Fig17_HTML.gif](img/A432778_1_En_5_Fig17_HTML.gif)\n\
    \n图 5-17.\n\n随机森林分类器的 ROC 曲线\n\n```\nModel name: Random Forest\nTest accuracy\
    \ (Accuracy Score):           0.640874\nTest accuracy (ROC AUC Score):       \
    \     0.534295\nTrain accuracy:                           0.990071\nArea Under\
    \ the Precision-Recall Curve:    0.132014\n```\n\n训练准确率与决策树分类器相似。看起来两种树分类器技术都使模型过拟合了。然而，与决策树分类器相反，随机森林分类器的测试准确率显著提高。但是，测试水平的准确率仍然远不及使用核近似的\
    \ SGD 分类器所获得的准确率（即 0.7 对比 0.64）。\n\n在应用了随机森林分类器之后，朱迪博士很想知道提升集成是否能产生一个强大的模型。为此，她计划对从清单\
    \ 5-24 获得的训练-测试分割应用梯度提升。\n"
- fmt: '### Gradient Boosting


    在`Boosting`中，样本的选择是通过给难以分类的观测值赋予越来越大的权重来完成的。梯度提升分类生成一个预测模型，该模型由一组弱预测模型（通常是决策树）集成而成。它通过针对任意可微损失函数进行优化来泛化模型。在每个阶段，回归树都拟合二项式或多项式偏差损失函数的负梯度。


    简单来说，梯度提升分类器执行以下操作：


    1.  梯度提升逐个构建树的集成。

    2.  所有单个树的预测结果被求和。

    3.  重建目标函数与当前集成预测之间的差异（即残差）。

    4.  集成中的下一棵树应补充现有树，并最小化集成的残差。


    Judy博士乐观地认为，梯度提升分类器将产生最佳结果，因为它们会为难以分类的样本分配更大的权重，这将使集成模型付出更多努力来分类这些高权重样本。为此，她编写了清单[5-32](#A432778_1_En_5_Chapter.html#Par187)中的代码片段来训练模型，然后为测试数据集预测标签。


    ```

    clf = GradientBoostingClassifier(random_state=10, learning_rate=0.1, n_estimators=200,
    max_depth=5, max_features=10)

    clf.fit(x_train, y_train)

    y_pred = clf.predict(x_test)

    Listing 5-32.

    Training the Model by Applying Gradient Boosting Classifier and Predicting Status
    Labels

    ```


    这次，Judy博士在初始化模型时传入了一些参数。她决定使用`0.1`的学习率，这个值既不太小也不太大。除此之外，她设定了最大迭代次数为`200`，树的最大深度为`5`，并将模型限制为最多从十个特征中学习。Judy博士编写了清单[5-33](#A432778_1_En_5_Chapter.html#Par189)中的代码片段来评估模型的优劣。为此，她将训练集、测试集和预测值作为参数传递给之前在清单[5-24](#A432778_1_En_5_Chapter.html#Par122)中定义的`model_performance`方法。


    ```

    model_performance(''Gradient Boosting'', x_train, y_train, y_test, y_pred)

    Listing 5-33.

    Finding Accuracy of Gradient Boosting Classifier

    ```


    输出


    ![A432778_1_En_5_Fig18_HTML.gif](A432778_1_En_5_Fig18_HTML.gif)


    图 5-18.


    梯度提升分类器的ROC曲线


    ```

    Model name: Gradient Boosting

    Test accuracy (Accuracy Score):           0.700408

    Test accuracy (ROC AUC Score):            0.514929

    Train accuracy:                           0.707403

    Area Under the Precision-Recall Curve:    0.153744

    ```


    Judy博士认为该模型在避免过拟合方面做得不错。与之前应用的模型相比，准确率有所提高，ROC分数也超过了使用SGD分类器的核近似方法。然而，ROC分数仍然低于决策树分类器模型的结果。


    在研究过程中，Judy博士发现梯度提升分类模型在训练时也会输出模型赋予每个特征集的重要性分数。她很好奇在训练模型时哪些特征的表现优于其他特征。为此，她编写了清单[5-34](#A432778_1_En_5_Chapter.html#Par194)中的代码来查看特征的重要性分数。


    ```

    for feature, score in zip(features_of_choice, list(clf.feature_importances_)):

    print ''%s\t%f''%(feature, score)

    Listing 5-34.

    Printing Features’ Weight as Assigned by Gradient Boosting Classifier

    ```


    输出


    ```

    Age                                     0.143221

    Gender                                  0.009629

    DayOfTheWeek                            0.053643

    Diabetes                                0.005889

    Alcoolism                               0.010774

    HiperTension                            0.006360

    Smokes                                  0.011096

    Scholarship                             0.010460

    Tuberculosis                            0.003295

    Sms_Reminder                            0.019245

    AwaitingTime                            0.128393

    AppointmentRegistration_year            0.023332

    AppointmentRegistration_month           0.045764

    AppointmentRegistration_day             0.077271

    AppointmentData_year                    0.019696

    AppointmentData_month                   0.066774

    AppointmentData_day                     0.119192

    AppointmentRegistration_hour            0.066528

    AppointmentRegistration_min             0.091829

    AppointmentRegistration_sec             0.087611

    ```


    名为`Age`、`AwaitingTime`和`AppointmentData_day`的特征被梯度提升分类器赋予了最大的权重。Judy博士兴奋地发现，该模型与她进行探索性数据分析时关于`Age`和`AwaitingTime`的推论一致。名为`Gender`、`HiperTension`、`Diabetes`和`Tuberculosis`的特征被梯度提升分类模型赋予了最小的权重。


    Judy博士进行了一次富有成效的数据分析和分类冲刺。然而，由于会议在半小时后就要开始，她无法继续深入，只能展示到目前为止所获得的发现。除非你们中有人能尝试其他分类方法，否则她无法再增加更多发现。她心中有一些备选方案，并勤勉地将它们添加到了练习中。


    ### 练习


    1.  重复梯度提升分类，但这次只考虑模型认为重要的特征。`AUC`和`ROC`有改善吗？

    2.  对梯度提升应用网格搜索（参考第[4](#A432778_1_En_4_Chapter.html)章），以微调`learning_rate`、`max_depth`等参数。

    3.  使用`PCA`（参考第[4](#A432778_1_En_4_Chapter.html)章）转换数据，然后应用我们讨论过的所有模型，看看是否能获得改进。

    4.  最近，一种新型的提升方法`Xgboost`在数据科学家中很流行。将其应用于我们的数据集，使用网格搜索进行优化，看看它的性能是否相对优于梯度提升。


    Judy博士想知道分类是否还有其他实际应用。为此，她查阅了互联网，并整理了一些迄今为止最引人注目的分类应用。


    ## 分类的应用


    多个研究领域都有大量的分类应用。


    ### 图像分类


    深度学习在预测图像中表示的对象方面有广泛的应用。这有助于搜索引擎中的图像聚类以及Instagram等应用中的推荐引擎。


    ### 音乐分类


    像Pandora这样的音乐应用会对音乐执行分类算法，以推荐符合你喜好的音乐。其美妙之处在于，你无需明确告诉Pandora你的偏好，因为它会自行学习。


    ### 电子邮件垃圾邮件过滤


    像Gmail、Outlook、Ymail等电子邮件服务已经部署了算法，用于将垃圾邮件与合法邮件进行分类。然后，根据判定结果决定将哪些邮件丢入垃圾邮件文件夹。'
  raw: '### Gradient Boosting


    In Boosting , the selection of samples is done by giving more and more weight
    to hard-to-classify observations. Gradient boosting classification produces a
    prediction model in the form of an ensemble of weak predictive models, usually
    decision trees. It generalizes the model by optimizing for the arbitrary differentiable
    loss function. At each stage, regression trees fit on the negative gradient of
    binomial or multinomial deviance loss function.


    In simple terminology, the gradient boosting classifier does the following:


    1.  Gradient boosting builds an ensemble of trees one by one.  

    2.  Predictions of all individual trees are summed.  

    3.  Discrepancy between target function and current ensemble prediction (i.e.,
    residual) is reconstructed.  

    4.  The next tree in the ensemble should complement existing trees and minimize
    the residual of the ensemble.  


    Dr. Judy was optimistic that gradient boosting classifiers would yield the best
    results as they assign more weight to hard-to-classify samples, which will make
    the ensemble exert more efforts to classify these high-weight samples. For that
    purpose she wrote the code snippet in Listing [5-32](#A432778_1_En_5_Chapter.html#Par187)
    to train the model and then predict labels for the testing dataset.


    ```

    clf = GradientBoostingClassifier(random_state=10, learning_rate=0.1, n_estimators=200,
    max_depth=5, max_features=10)

    clf.fit(x_train, y_train)

    y_pred = clf.predict(x_test)

    Listing 5-32.

    Training the Model by Applying Gradient Boosting Classifier and Predicting Status
    Labels

    ```


    This time around, Dr. Judy passed in some parameters while initializing the model.
    She decided to go with a learning rate of 0.1, which is not too small and not
    too large. Other than that she decided on maximum iterations of 200 and a tree
    with a maximum depth of 5, and she limited the model to train itself from a maximum
    of ten features. Dr. Judy wrote the code snippet in Listing [5-33](#A432778_1_En_5_Chapter.html#Par189)
    to evaluate the model for goodness. For that purpose she passed the train, test,
    and predicted values as parameters to the ‘model performance’ method earlier defined
    in Listing [5-24](#A432778_1_En_5_Chapter.html#Par122).


    ```

    model_performance(''Gradient Boosting'', x_train, y_train, y_test, y_pred)

    Listing 5-33.

    Finding Accuracy of Gradient Boosting Classifier

    ```


    Output


    ![A432778_1_En_5_Fig18_HTML.gif](A432778_1_En_5_Fig18_HTML.gif)


    Figure 5-18.


    ROC curve for gradient boosting classifier


    ```

    Model name: Gradient Boosting

    Test accuracy (Accuracy Score):           0.700408

    Test accuracy (ROC AUC Score):            0.514929

    Train accuracy:                           0.707403

    Area Under the Precision-Recall Curve:    0.153744

    ```


    Dr. Judy believed that the model did a fair job of avoiding overfitting. Accuracy
    improved relative to the earlier applied models, with a ROC score rising over
    that of the kernel approximation using the SGD classifier. However, the ROC score
    was still lower than what came up from the decision tree classifier model.


    While doing research, Dr. Judy had discovered that gradient boosting classification
    models also output the importance score the model gave to each feature set while
    training the model. She was curious to find which features outperformed others
    while training the model. For that purpose she wrote the code in Listing [5-34](#A432778_1_En_5_Chapter.html#Par194)
    to see features’ importance scores.


    ```

    for feature, score in zip(features_of_choice, list(clf.feature_importances_)):

    print ''%s\t%f''%(feature, score)

    Listing 5-34.

    Printing Features’ Weight as Assigned by Gradient Boosting Classifier

    ```


    Output


    ```

