    ## 执行探索性数据分析


    朱迪博士认为，与其直接开始探索性数据分析（EDA），不如先通过可视化方式观察数据，看看是否存在她可以用来调整模型的模式。她认为，随着年龄增长，人们看医生的需求也会增加。其背后的理念是，随着年龄增长，疾病会呈指数级增加。因此，她编写了清单
    5-14 中的代码，以查看这些数量之间的关系在现实中是否成反比。


    ![A432778_1_En_5_Fig3_HTML.gif](img/A432778_1_En_5_Fig3_HTML.gif)


    图 5-3.


    年龄与等待时间的散点图


    ```

    plt.scatter(data[''Age''], data[''AwaitingTime''], s=0.5)

    plt.title(''Scatter plot of Age and Awaiting Time'')

    plt.xlabel(''Age'')

    plt.ylabel(''Awaiting Time'')

    plt.xlim(0, 120)

    plt.ylim(0, 120)

    清单 5-14.

    年龄与等待时间的散点图

    ```


    朱迪博士对结果并不满意，因为图 5-3 显示的是一个高度分散的图，开始时没有相关性迹象，在 90 岁之后才出现一点负相关。可视化表示表明，先前建立的假设不成立。然而，她决定也使用清单
    5-15 中的统计相关性技术来验证这一点。


    ```

    pd.set_option(''display.width'', 100)

    pd.set_option(''precision'', 3)

    correlations = data[[''Age'', ''AwaitingTime'']].corr(method=''pearson'')

    print(correlations)

    清单 5-15.

    计算年龄与等待时间之间的皮尔逊相关系数

    ```


    输出


    ```

    Age             AwaitingTime

    Age            1.00e+00        -4.18e-03

    AwaitingTime   -4.18e-03       1.00e+00

    ```


    年龄与等待时间之间的相关性趋近于 0，这与她先前建立的假设相悖。她现在感兴趣的是，增加短信提醒次数是否会提高患者赴约的可能性。为此，她编写了清单 5-16
    中的代码，以绘制图 5-4 中的堆叠条形图。


    ![A432778_1_En_5_Fig4_HTML.gif](img/A432778_1_En_5_Fig4_HTML.gif)


