    Elite Daily 和 CrowdTwist 发布的报告，其中指出千禧一代是对自己喜爱品牌最忠诚的一代。原因之一是他们愿意分享对产品/服务的想法和意见。这些意见构成了庞大的经验库——足以让千禧一代做出深思熟虑的决定，并且他们会长期忠于这个决定。因此，南希确信大多数千禧一代会是会员，而非短期通行证持有者。埃里克决定绘制一个柱状图来验证南希的推论是否成立。


