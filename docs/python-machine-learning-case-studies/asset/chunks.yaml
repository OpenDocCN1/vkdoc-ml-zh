    ### 保险


    保险公司会收到大量关于损失的保险索赔。因此，保险公司不得不投入大量时间和人力资源进行调查并做出最终裁决。在许多情况下，最终裁决是正确的，但在某些情况下却是错误的。因此，近年来，人们致力于在保险公司部署分类模型，以区分欺诈索赔申请和合法索赔申请。


    朱迪博士通过回顾最初设定的目标来总结她的分析，这些目标是确定重复发生损失的原因以及未来检测损失发生的方法。她首先对数据进行了单变量和多变量分析，以确定需要处理的数据区域。探索性分析还使她发现，损失显然是由于大约
    33%的患者未在预约日期和时间就诊造成的。在进行数据整理后，她认为最好从现有特征中生成更多特征，以便模型更容易捕捉数据的真实本质。


    然后，她回顾了多种分类模型评估技术，并将数据分为训练集和测试集，以便对模型进行评估。朱迪博士从决策树分类器开始，该分类器显示出过拟合和高测试误差。然而，在尝试了多种分类技术后，她决定采用梯度提升分类模型，该模型产生了相对更好的准确性。通过梯度提升模型，她现在能够实时预测已预约的患者是否会在预约当天就诊。她知道自己已经实现了一个重要的里程碑，并期待着董事会会议。


    ## 附录 A：图表类型及其使用场景


    ### 饼图


    `饼图示意图`


    ![A432778_1_En_BookBackmatter_Fig1_HTML.gif](img/A432778_1_En_BookBackmatter_Fig1_HTML.gif)


    饼图最适合用于比较整体中的各个部分。它适用于分析分类变量。


    ### 条形图


    `条形图示意图`


    ![A432778_1_En_BookBackmatter_Fig2_HTML.gif](img/A432778_1_En_BookBackmatter_Fig2_HTML.gif)


    条形图用于比较不同组别之间的事物，或追踪随时间的变化（即变化较大时）。条形图适用于分类变量和区间变量。


    ### 直方图


    `直方图示意图`


    ![A432778_1_En_BookBackmatter_Fig3_HTML.gif](img/A432778_1_En_BookBackmatter_Fig3_HTML.gif)


    直方图适用于连续变量。它用于绘制带或不带分组的频率分布。改变组距会改变底层分布。


    ### 茎叶图


    `茎叶图示意图`


    ![A432778_1_En_BookBackmatter_Fig4_HTML.gif](img/A432778_1_En_BookBackmatter_Fig4_HTML.gif)


    茎叶图适用于离散区间变量，但不适用于频率较高的数据。换句话说，茎叶图可以看作是直方图的转置。与直方图相反，我们可以从茎叶图中重建原始数据。


    ### 箱线图


    `箱线图示意图`


    ![A432778_1_En_BookBackmatter_Fig5_HTML.gif](img/A432778_1_En_BookBackmatter_Fig5_HTML.gif)


    箱线图是直方图的一种变换形式，有助于理解数据分布的中位数、方差和偏度。中心的线代表中位数，两端的线称为须。须的边缘代表第一和第三四分位数，两者之间的差值称为四分位距。落在此范围之外的点被视为异常值。


