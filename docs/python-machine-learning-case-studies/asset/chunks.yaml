    applications of classification to date.


    ## Applications of Classification


    Several fields of study have numerous applications for classification.


    ### Image Classification


    Deep learning has wide applications in predicting the objects represented within
    images. This helps in image clustering within search engines and recommendation
    engines in applications like Instagram.


    ### Music Classification


    Music applications like Pandora perform classification algorithms on music to
    recommend one that matches your preferences. The beauty of it is that you don’t
    have to explicitly tell Pandora your preference as it will learn on its own.


    ### E-mail Spam Filtering


    E-mail services such as Gmail, Outlook, Ymail, and so on have deployed algorithms
    to classify spam e-mails compared to legitimate e-mails. The verdict then decides
    which e-mails to dump into the Spam folder.'
