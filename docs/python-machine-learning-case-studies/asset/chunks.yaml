    Claire was surprised, as Smith was spot-on. She was curious to see what would
    happen if she ran a multiple regression by incorporating all of the exploratory
    variables at the same time. Hence she came up with the code snippet in Listing
    [2-10](#A432778_1_En_2_Chapter.html#Par191). Smith was able to understand the
    code to a certain extent; however, he was surprised to see a non-linear regression
    best fit line in Figure [2-18](#A432778_1_En_2_Chapter.html#Fig18).


    His perception was that multiple linear regression should be producing a linear
    line rather than a non-linear best fit line. To this Claire responded the following:


    > Number of features in analysis is directly proportional to the number of dimensions
    on the plot. As in our case we have five exploratory and one response variable
    which add up to six variables. Plotting points in 6 dimensions will be a difficult
    thing to do, hence the representation of that is shown using two dimensions in
    Figure [2-18](#A432778_1_En_2_Chapter.html#Fig18). The best fit line would have
    been linearly represented had we seen that in the 6 dimensions.


    Claire pointed out that since the `R²` for this multiple regression is extremely
    low, one cannot use this model to predict the response variable (i.e., concrete
    strength). Note that the `R²` is extremely low; hence we will definitely not go
    forward with this to answer the question at hand. However, the output also gives
    us the coefficients. The first is the alpha coefficient, with the subsequent ones
    representing the beta coefficients. Both Smith and Claire knew that multicollinearity
    exists in the data. Hence in the pursuit of finding regression techniques which
    work on a multicollinear data, they came across Ridge regression and decided to
    try that out. However, Claire thought it better to explain to Smith about grid
    search. Before proceeding onward, let’s tap into other regression models to find
    the one that fits our data in the best possible way.'
  raw: '### Residual Plot


    A residual plot is a scatter plot of regression residuals against exploratory
    variable x (i.e., independent). See Figure [2-15](#A432778_1_En_2_Chapter.html#Fig15).
    The least square regression line is pulled by and toward a point that is extreme
    in x direction with no other points near it. A dotted line represents the least
    square regression line.


    ![A432778_1_En_2_Fig15_HTML.gif](A432778_1_En_2_Fig15_HTML.gif)


    Figure 2-15.


    Residual plot


    ### Residual Sum of Squares


    The residual sum of squares (RSS ) refers to amount of variance in data not captured
    by the best fit line of a regression model. The more minimal the RSS, the better
    the model is.


    For the sake of simplicity we will go forward with using R² as the metrics of
    cross-validation. Moreover, it seems to be a better choice considering that we
    are working for prediction, and this metric will help us determine where future
    samples will lie on the accuracy scale.


    Now having gone through the concepts of underfitting and overfitting and evaluation
    techniques of regression, Claire believed that it was time for her to test their
    mantle in finding a regression model which best fits the data at hand.


    ## Types of Regression


    Claire continued on by pointing out that SKLearn is the most common library for
    machine learning in Python. SKLearn offers a spectrum of algorithms for regression
    modeling. She came up with Figure [2-13](#A432778_1_En_2_Chapter.html#Fig13) from
    SKLearn’s web site as a reference to determine the regression algorithms which
    are usually the best given the size of our dataset.


    You can download the cheat sheet shown in Figure [2-16](#A432778_1_En_2_Chapter.html#Fig16)
    from [`http://scikit-learn.org/stable/tutorial/machine_learning_map/`](http://scikit-learn.org/stable/tutorial/machine_learning_map/)
    .


    ![A432778_1_En_2_Fig16_HTML.jpg](A432778_1_En_2_Fig16_HTML.jpg)


    Figure 2-16.


    Cheat sheet of Regression-SKLearn


    Smith decided to give it a shot and try to identify the regression models suitable
    for the size of the current dataset. He recalled having said: “As in our case,
    the number of samples is less than 100K, hence the potential models are Lasso,
    ElasticNet, SVR(kernel=‘rbf’), Ensemble Regressors, Ridge Regression, and SVR(kernel=‘linear’).”


    Linear regression is the most basic of the regression models to start with, and
    hence Claire decided to start modeling from it.


    ### Linear Regression


    Smith already knew what a linear regression was, thanks to Claire (see Figure
    [2-2](#A432778_1_En_2_Chapter.html#Fig2)). Hence Claire decided to put it into
    the application to see how it performs, so she compiled the code in Listing [2-9](#A432778_1_En_2_Chapter.html#Par184).


    ![A432778_1_En_2_Fig17_HTML.gif](A432778_1_En_2_Fig17_HTML.gif)


    Figure 2-17.


    Single linear regression plots


