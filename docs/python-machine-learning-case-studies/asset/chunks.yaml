    As an illustration an input value of water component was passed in the variable
    `''wc_new_data''`.


    Finally, Claire repeated the exercise, the difference this time being that coarse
    aggregate was taken as an input. She recalled from the output of Listing [2-14](#A432778_1_En_2_Chapter.html#Par241)
    that the confidence level of this regression model is approximately 23%.


    ```

    feature = ''coarse_aggregate''

