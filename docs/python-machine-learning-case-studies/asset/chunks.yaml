  trans: '

    #### 因变量与自变量


    自变量也被称为解释变量，因为它用于解释或预测因变量（也称为响应变量或结果变量）。


    结合数据集来看，哪些是因变量和自变量？假设共享单车系统的管理层找到你，要求你构建一个系统来提前预测行程时长，以确保单车供应充足。在这种情况下，你的因变量是什么？显然是行程时长。那么自变量又是什么？这些变量将包含我们认为影响因变量的特征（例如，用户类型、性别以及具体时间和日期）。


    埃里克让南希根据他刚刚解释的变量类型对特征进行分类。


    表 1-5.


    南希将变量分类为变量类型的方法


    | 特征名称 | 变量类型 |

    | --- | --- |

    | `trip_id` `bikeid` `tripduration` `from_station_id` `to_station_id` `birthyear`
    | 连续型 |

    | `Starttime` `Stoptime` | 日期时间型 |

    | `from_station_name to_station_name` | 字符串型 |

    | `Usertype gender` | 名义型 |


    南希现在对机器学习中的变量类型有了清晰的认识，也知道了哪些特征属于哪种变量类型（见表 1-5）。然而，尽管查看了每个特征的初始观测值（见表 1-2），她仍然无法推断出每个表格所包含信息的深度和广度。她向埃里克提到了这一点，而作为数据分析专家的埃里克给出了答案：对数据集中的特征进行单变量分析。


    ### 单变量分析


    单变量一词源于“uni”，意为单一。这是对单个变量进行的分析，因此不涉及解释变量之间的任何关系。


    埃里克决定对数据集进行单变量分析，以便更好地单独理解各个特征（见代码清单 1-4）。


    ```

    data = data.sort_values(by=''starttime'')

    data.reset_index()

    print ''Date range of dataset: %s - %s''%(data.ix[1, ''starttime''], data.ix[len(data)-1,
    ''stoptime''])

    代码清单 1-4.

    确定数据集的时间范围

    ```


    输出


    ```

    Date range of dataset: 10/13/2014 10:32 - 9/1/2016 0:20

    ```


    埃里克知道南希理解代码会有困难，因此他决定解释那些他认为本质上较为复杂的部分。关于代码清单 1-4 中的代码，埃里克解释道：


    > 我们首先按 `starttime` 对数据框进行排序。请注意，数据框是 Python 中的一种数据结构，我们在代码清单 1-2 中最初将数据加载到了其中。数据框有助于以表格形式组织数据，并通过哈希值实现快速搜索。此外，数据框还提供了便捷的函数，使数据分析工作更加轻松。排序操作改变了数据框内记录的位置，而位置的变化打乱了原本按升序排列的索引顺序。因此，考虑到这一点，我们决定重置索引，以便排序后的数据框现在拥有升序的索引。最后，我们打印了从
    `starttime` 的第一个值开始到 `stoptime` 的最后一个值结束的日期范围。


    埃里克的分析得出了两个见解。一是数据范围从 2014 年 10 月到 2016 年 9 月（即三年的数据）。此外，共享单车服务似乎通常在标准的朝九晚五工作时间之外也在运营。


    南希认为短期通行证持有者会比长期会员使用更多的行程。她相信大多数人会按日使用该服务，而不是购买长期会员。埃里克持不同看法；他认为新用户会是短期通行证持有者，但一旦他们尝试了服务并感到满意，最终会购买会员以享受提供的优惠和福利。他还认为，人们往往更重视自己付费的服务，并确保每一分钱都花得物有所值。因此，埃里克决定绘制一个按用户类型划分的行程频率条形图来验证他的观点（见代码清单
    1-5）。但在绘制之前，他简要记录了一些常用图表及其最适合的场景（副本见附录 A）。这张图表让南希理解了他为何在当前情况下选择条形图。


    ```

    groupby_user = data.groupby(''usertype'').size()

    groupby_user.plot.bar(title = ''Distribution of user types'')

    代码清单 1-5.

    绘制用户类型分布图

    ```


    ![A432778_1_En_1_Fig1_HTML.gif](img/A432778_1_En_1_Fig1_HTML.gif)


    图 1-1.


    表示用户类型分布的条形图


    南希不理解代码清单 1-5 中的代码片段。她对 `groupby` 和 `size` 方法的功能感到困惑。她记得曾问过埃里克以下问题：“我能理解 `groupby`
    按给定字段（即当前情况下的 `usertype`）对数据进行分组。但 `size` 是什么意思？它是否等同于 `count`，即统计每个分组的用户类型中的行程数量？”


    埃里克对南希的推断感到惊讶，并认为她的理解是正确的。然而，条形图呈现的见解（见图 1-1）支持了埃里克的观点，因为会员比非会员使用了更多的行程。

    '
- fmt: 'Nancy had recently read an article that talked about the gender gap among
    people who prefer riding bicycles. The article mentioned a cycle sharing scheme
    in UK where 77% of the people who availed the service were men. She wasn’t sure
    if similar phenomenon exists for people using the service in United States. Hence
    Eric came up with the code snippet in Listing [1-6](#A432778_1_En_1_Chapter.html#Par70)
    to answer the question at hand.


    ```

    groupby_gender = data.groupby(''gender'').size()

    groupby_gender.plot.bar(title = ''Distribution of genders'')

    Listing 1-6.

    Plotting the Distribution of Gender

    ```


    ![A432778_1_En_1_Fig2_HTML.gif](A432778_1_En_1_Fig2_HTML.gif)


    Figure 1-2.


    Bar graph signifying the distribution of genders


    Figure [1-2](#A432778_1_En_1_Chapter.html#Fig2) revealed that the gender gap resonates
    in states as well. Males seem to dominate the trips taken as part of the program.


    Nancy, being a marketing guru, was content with the analysis done so far. However
    she wanted to know more about her target customers to whom to company’s marketing
    message will be targetted to. Thus Eric decided to come up with the distribution
    of birth years by writing the code in Listing [1-7](#A432778_1_En_1_Chapter.html#Par70).
    He believed this would help the Nancy understand the age groups that are most
    likely to ride a cycle or the ones that are more prone to avail the service.


    ```

    data = data.sort_values(by=''birthyear'')

    groupby_birthyear = data.groupby(''birthyear'').size()

    groupby_birthyear.plot.bar(title = ''Distribution of birth years'', figsize =
    (15,4))

    Listing 1-7.

    Plotting the Distribution of Birth Years

    ```


    ![A432778_1_En_1_Fig3_HTML.gif](A432778_1_En_1_Fig3_HTML.gif)


    Figure 1-3.


    Bar graph signifying the distribution of birth years


    Figure [1-3](#A432778_1_En_1_Chapter.html#Fig3) provided a very interesting illustration.
    Majority of the people who had subscribed to this program belong to Generation
    Y (i.e., born in the early 1980s to mid to late 1990s, also known as millennials).
    Nancy had recently read the reports published by Elite Daily and CrowdTwist which
    said that millennials are the most loyal generation to their favorite brands.
    One reason for this is their willingness to share thoughts and opinions on products/services.
    These opinions thus form a huge corpus of experiences—enough information for the
    millenials to make a conscious decision, a decision they will remain loyal to
    for a long period. Hence Nancy was convinced that most millennials would be members
    rather than short-term pass holders. Eric decided to populate a bar graph to see
    if Nancy’s deduction holds true .


    ```

    data_mil = data[(data[''birthyear''] >= 1977) & (data[''birthyear'']<=1994)]

    groupby_mil = data_mil.groupby(''usertype'').size()

    groupby_mil.plot.bar(title = ''Distribution of user types'')

    Listing 1-8.

    Plotting the Frequency of Member Types for Millenials

    ```


    ![A432778_1_En_1_Fig4_HTML.gif](A432778_1_En_1_Fig4_HTML.gif)


    Figure 1-4.


    Bar graph of member types for millenials


    After looking at Figure [1-4](#A432778_1_En_1_Chapter.html#Fig4) Eric was surprised
    to see that Nancy’s deduction appeared to be valid, and Nancy made a note to make
    sure that the brand engaged millennials as part of the marketing plan.


    Eric knew that more insights can pop up when more than one feature is used as
    part of the analysis. Hence, he decided to give Nancy a sneak peek at multivariate
    analysis before moving forward with more insights.


    ### Multivariate Analysis


    Multivariate analysis refers to incorporation of multiple exploratory variables
    to understand the behavior of a response variable. This seems to be the most feasible
    and realistic approach considering the fact that entities within this world are
    usually interconnected. Thus the variability in response variable might be affected
    by the variability in the interconnected exploratory variables .


    Nancy believed males would dominate females in terms of the trips completed. The
    graph in Figure [1-2](#A432778_1_En_1_Chapter.html#Fig2), which showed that males
    had completed far more trips than any other gender types, made her embrace this
    viewpoint. Eric thought that the best approach to validate this viewpoint was
    a stacked bar graph (i.e., a bar graph for birth year, but each bar having two
    colors, one for each gender) (see Figure [1-5](#A432778_1_En_1_Chapter.html#Fig5)).


    ```

    groupby_birthyear_gender = data.groupby([''birthyear'', ''gender''])[''birthyear''].count().unstack(''gender'').fillna(0)

    groupby_birthyear_gender[[''Male'',''Female'',''Other'']].plot.bar(title = ''Distribution
    of birth years by Gender'', stacked=True, figsize = (15,4))

    Listing 1-9.

    Plotting the Distribution of Birth Years by Gender Type

    ```


    ![A432778_1_En_1_Fig5_HTML.gif](A432778_1_En_1_Fig5_HTML.gif)


    Figure 1-5.


    Bar graph signifying the distribution of birth years by gender type


    The code snippet in Listing [1-9](#A432778_1_En_1_Chapter.html#Par80) brought
    up some new aspects not previously highlighted.


    > We at first transformed the data frame by unstacking, that is, splitting, the
    gender column into three columns, that is, Male, Female, and Other. This meant
    that for each of the birth years we had the trip count for all three gender types.
    Finally, a stacked bar graph was created by using this transformed data frame.


    It seemed as if males were dominating the distribution. It made sense as well.
    No? Well, it did; as seen earlier, that majority of the trips were availed by
    males, hence this skewed the distribution in favor of males. However, subscribers
    born in 1947 were all females. Moreover, those born in 1964 and 1994 were dominated
    by females as well. Thus Nancy’s hypothesis and reasoning did hold true .


    The analysis in Listing [1-4](#A432778_1_En_1_Chapter.html#Par59) had revealed
    that all millennials are members. Nancy was curious to see what the distribution
    of user type was for the other age generations. Is it that the majority of people
    in the other age generations were short-term pass holders? Hence Eric brought
    a stacked bar graph into the application yet again (see Figure [1-6](#A432778_1_En_1_Chapter.html#Fig6)).


    ```

    groupby_birthyear_user = data.groupby([''birthyear'', ''usertype''])[''birthyear''].count().unstack(''usertype'').fillna(0)

    groupby_birthyear_user[''Member''].plot.bar(title = ''Distribution of birth years
