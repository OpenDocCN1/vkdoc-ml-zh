    ### Principle Component Analysis


    `PCA` converts a set of observations that are highly correlated into a set of
    linearly uncorrelated variables called principle components by an orthogonal transformation.
    This transformation is done such that the first component has the highest variance.


    ![A432778_1_En_4_Fig6_HTML.gif](A432778_1_En_4_Fig6_HTML.gif)


    Figure 4-6. Illustration of PCA


    Subsequent components have lower variances, keeping the constraint under consideration
    that it is orthogonal to the preceding components as depicted in Figure [4-6](#A432778_1_En_4_Chapter.html#Fig6).
    `PCA` is highly sensitive to relative scaling of the data. `PCA` can be thought
    of as a dimension reduction technique which reduces high-dimensional data to a
    fixed number of components.


    Having read the description, Ross was sure that with dimension reduction he was
