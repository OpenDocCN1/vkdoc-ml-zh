    in which the model chooses the optimal number of clusters on its own. It exhibits
    this behavior when `weight_concentration_prior` is set to be small enough and
    `n_components` is set to be larger than what is found necessary by the model.
    The variational Bayesian mixture model sets some mixture weight values close to
    zero, which lets the model choose effective components automatically.


