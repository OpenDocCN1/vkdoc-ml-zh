    ## Modeling a Time Series


    Before applying the different time series models, David thought it better to first
    understand the underlying concepts many of the models use. After research, he
    compiled explanations on the meaning of Number of Auto-Regressive (AR), Number
    of Moving Average (MA), and Number of Differences (D). He deemed these terms important
    because they formulate the prediction equation for the time series model.


    - **Number of Auto-Regressive (AR) terms or p**: AR terms are the lags of the
    response variable. Take, for example, a value of `p = 5`. Hence, in order to predict
    the response variable at `t5`, a time series between `t0` and `t4` will be considered
    the exploratory variables.

    - **Number of Moving Average (MA) terms or q**: MA terms are the lagged forecast
    errors in a response variable. Take, for example, a value of `q = 5`. Hence in
    order to predict the response variable at `t5`, a time series between `t0` and
    `t4` will be considered. Hence this means the difference between the moving average
    and actual value at that time instant.

    - **Number of Differences (d)**: This refers to the order of differencing that
    we are interested in applying to our time series object.


    Parameters for a given time series model are written as follows: `p`, `d`, `q`.
    Once he understood the common parameters of the time series techniques, David
    decided to compile a list of the statistical tests to measure the accuracy of
    the forecasted time series.


    ### Tests to Validate Forecasted Series


    After due research, David learned about some of the most notable tests for measuring
    the accuracy of the forecasted time series.


    #### Mean Forecast Error


    This is the mean of residuals at each time point. Mean forecast error values can
    range from negative infinity to positive infinity.


    #### Mean Absolute Error


    Mean absolute error is same as mean forecast error except that the residuals are
    converted to absolute terms; that is, positive residuals remain the same whereas
    negative residuals are converted into positive ones. Values can range between
    zero and positive infinity.


    #### Residual Sum of Squares


    The residual sum of squares (RSS) is usually used in regression to understand
    the fraction of variance not explained by the regression model. It is calculated
    by calculating the residuals at each point in time, taking their squares, and
    then adding them over. Squaring of the residuals ensures that the values come
    out to be positive. RSS can have a minimum value of 0, which indicates that the
    variance is estimated to the fullest extent by the time series model.


    #### Root Mean Squared Error


    The root mean squared error (RMSE), also known as root mean squared deviation
    (RMSD), is an advanced version of RSS in which square root is applied to the output
    of RSS.


    David now had a fair idea of what was meant by the terms `p`, `q`, and `d`. However,
    he wasn’t sure that what value each of these terms should entail when passing
    them within a time series model. His search uncovered some of the rules that decide
    the values of `p`, `q`, and `d` subject to the patterns within ACF and PACF.'
  raw: '### Measuring Autocorrelation


    David achieved some success as he was able to find a statistical method to measure
    autocorrelation within the log transformed time series (i.e., Durbin Watson statistic).


    #### Durbin Watson Statistic


    Contrary to the autocorrelation correlogram, Durbin Watson statistic is more of
    a statistical approach to determining the existence of autocorrelation within
    the data. It does so by computing autocorrelation among residuals from a statistical
    regression analysis. It returns a number between 0 and 4 where 0 depicts strong
    positive autocorrelation, 4 depicts strong negative autocorrelation, and 2 depicts
    no autocorrelation at all .


    While doing the research on autocorrelations, David recalled reading that differencing
    can be used to eradicate ACF and PACF. Having already applied differencing on
    the log transformed time series object, David was expecting no presence of ACF
    and PACF. At first he planned to check for the presence of autocorrelation using
    the Durbin Watson statistics method in Listing [3-16](#A432778_1_En_3_Chapter.html#Par120).


    ```

    sm.stats.durbin_watson(data_log_diff)

    Listing 3-16.

    Calculating the Durbin Watson Statistics for Log Transformed Differencing Applied
    Time Series

    ```


    Output


    ```

    2.1859293629518555

    ```


    David was thrilled to see the results to be a score approaching 2, which indicated
    the presence of no autocorrelation in the log transformed differencing applied
    time series. However, he was curious to see what the ACF and PACF would look in
    the absence of autocorrelation. Hence he came up with the code snippet in Listing
    [3-17](#A432778_1_En_3_Chapter.html#Par124).


    ![A432778_1_En_3_Fig12_HTML.gif](A432778_1_En_3_Fig12_HTML.gif)


    Figure 3-12.


    Plotting correlograms for ACF and PACF on log transformed differencing applied
    time series


    ```

    ax1 = plt.subplot(211)

    fig = sm.graphics.tsa.plot_acf(data_log_diff.squeeze(), lags=40, ax=ax1)

    ax2 = plt.subplot(212)

    fig = sm.graphics.tsa.plot_pacf(data_log_diff, lags=40, ax=ax2)

    Listing 3-17.

    Plotting Correlograms for ACF and PACF on Log Transformed Differencing Applied
    Time Series

    ```


    David noticed that both the ACF and PACF correlograms should a spike at 1 lag
    with no correlations to come on the later time lags. The next step after making
    the time series stationary was what excited David the most (i.e., applying forecasting
    to the Yahoo stock dataset to get forecasts with minimal residuals ).


    ## Modeling a Time Series


    Before applying the different time series models, David thought it better to first
    understand the underlying concepts many of the models use. After research, he
    compiled explanations on the meaning of Number of Auto-Regressive (AR), Number
    of Moving Average (MA), and Number of Differences (D). He deemed these terms important
    because they formulate the prediction equation for the time series model.


    *   Number of Auto-Regressive (AR) terms or p: AR terms are the lags of the response
    variable. Take, for example, a value of p = 5. Hence, in order to predict the
    response variable at t5, a time series between t0 and t4 will be considered the
    exploratory variables.

    *   Number of Moving Average (MA) terms or q: MA terms are the lagged forecast
    errors in a response variable. Take, for example, a value of q = 5\. Hence in
    order to predict the response variable at t5, a time series between t0 and t4
    will be considered. Hence this means the difference between the moving average
    and actual value at that time instant.

    *   Number of Differences (d): This refers to the order of differencing that we
    are interested in applying to our time series object.


    Parameters for a given time series model are written as follows: p, d, q. Once
    he understood the common parameters of the time series techniques, David decided
    to compile a list of the statistical tests to measure the accuracy of the forecasted
    time series.


    ### Tests to Validate Forecasted Series


    After due research, David learned about some of the most notable tests for measuring
    the accuracy of the forecasted time series.


    #### Mean Forecast Error


    This is the mean of residuals at each time point. Mean forecast error values can
    range from negative infinity to positive infinity.


    #### Mean Absolute Error


    Mean absolute error is same as mean forecast error except that the residuals are
    converted to absolute terms; that is, positive residuals remain the same whereas
    negative residuals are converted into positive ones. Values can range between
    zero and positive infinity.


    #### Residual Sum of Squares


    The residual sum of squares (RSS) is usually used in regression to understand
    the fraction of variance not explained by the regression model. It is calculated
    by calculating the residuals at each point in time, taking their squares, and
    then adding them over. Squaring of the residuals ensures that the values come
    out to be positive. RSS can have a minimum value of 0, which indicates that the
    variance is estimated to the fullest extent by the time series model.


    #### Root Mean Squared Error


    The root mean squared error (RMSE), also known as root mean squared deviation
    (RMSD), is an advanced version of RSS in which square root is applied to the output
    of RSS.


    David now had a fair idea of what was meant by the terms p, q, and d. However,
    he wasn’t sure that what value each of these terms should entail when passing
    them within a time series model. His search uncovered some of the rules that decide
    the values of p, q, and d subject to the patterns within ACF and PACF.'
  trans: '

    ### 测量自相关


    大卫取得了一些成功，因为他找到了一种统计方法，用于测量对数转换后时间序列中的自相关性（即德宾-沃森统计量）。


    #### 德宾-沃森统计量


    与自相关相关图不同，德宾-沃森统计量更像是一种确定数据中是否存在自相关的统计方法。它通过计算统计回归分析中残差的自相关性来实现这一点。该统计量返回一个介于
    0 和 4 之间的数值，其中 0 表示强正自相关，4 表示强负自相关，而 2 则表示完全不存在自相关。


    在研究自相关时，大卫回想起他曾读到过，差分法可用于消除 ACF 和 PACF。由于已经对对数转换后的时间序列对象应用了差分法，大卫预期不会出现 ACF 和
    PACF。他首先计划使用清单 3-16 中的德宾-沃森统计方法来检查自相关的存在性。


    ```

    sm.stats.durbin_watson(data_log_diff)

    清单 3-16.

    计算对数转换差分后时间序列的德宾-沃森统计量

    ```


    输出


    ```

    2.1859293629518555

    ```


    看到结果接近 2，大卫非常兴奋，这表明在对数转换差分后的时间序列中不存在自相关。然而，他很好奇，在没有自相关的情况下，ACF 和 PACF 会是什么样子。因此，他编写了清单
    3-17 中的代码片段。


    ![A432778_1_En_3_Fig12_HTML.gif](img/A432778_1_En_3_Fig12_HTML.gif)


    图 3-12.


    在对数转换差分后的时间序列上绘制 ACF 和 PACF 的相关图


    ```

    ax1 = plt.subplot(211)

    fig = sm.graphics.tsa.plot_acf(data_log_diff.squeeze(), lags=40, ax=ax1)

    ax2 = plt.subplot(212)

    fig = sm.graphics.tsa.plot_pacf(data_log_diff, lags=40, ax=ax2)

    清单 3-17.

    在对数转换差分后的时间序列上绘制 ACF 和 PACF 的相关图

    ```


    大卫注意到，ACF 和 PACF 的相关图都在滞后 1 处出现一个尖峰，而在后续的时间滞后中则没有相关性。使时间序列平稳后的下一步最让大卫兴奋（即，对雅虎股票数据集应用预测，以获得残差最小的预测值）。


    ## 对时间序列建模


    在应用不同的时间序列模型之前，大卫认为最好先理解许多模型所使用的基本概念。经过研究，他整理了对自回归项数 (AR)、移动平均项数 (MA) 和差分次数 (D)
    含义的解释。他认为这些术语很重要，因为它们构成了时间序列模型的预测方程。


    *   **自回归 (AR) 项数或 p**：AR 项是响应变量的滞后值。例如，取 p = 5。那么，为了预测 t5 时刻的响应变量，t0 到 t4 之间的时间序列将被视为解释变量。

    *   **移动平均 (MA) 项数或 q**：MA 项是响应变量中滞后的预测误差。例如，取 q = 5。那么，为了预测 t5 时刻的响应变量，将考虑 t0
    到 t4 之间的时间序列。因此，这表示该时刻移动平均值与实际值之间的差异。

    *   **差分次数 (d)**：这指的是我们希望对时间序列对象应用的差分阶数。


    给定时间序列模型的参数书写如下：p, d, q。一旦理解了时间序列技术的通用参数，大卫决定整理一份用于衡量预测时间序列准确性的统计检验列表。


    ### 验证预测序列的检验


    经过适当的研究，大卫了解到一些最著名的用于衡量预测时间序列准确性的检验方法。


    #### 平均预测误差


    这是每个时间点残差的平均值。平均预测误差的取值范围可以从负无穷大到正无穷大。


    #### 平均绝对误差


    平均绝对误差与平均预测误差相同，只是残差被转换为绝对值；也就是说，正残差保持不变，而负残差则转换为正数。其取值范围介于 0 和正无穷大之间。


    #### 残差平方和


    残差平方和 (RSS) 通常用于回归分析，以了解回归模型未能解释的方差比例。其计算方法是：计算每个时间点的残差，取其平方，然后求和。对残差进行平方可确保结果为正数。RSS
    的最小值为 0，表示时间序列模型已最大程度地估计了方差。


    #### 均方根误差


    均方根误差 (RMSE)，也称为均方根偏差 (RMSD)，是 RSS 的进阶版本，它对 RSS 的输出结果应用了平方根。


    大卫现在对 p、q 和 d 这些术语的含义有了相当清晰的认识。然而，他不确定在将时间序列模型中的这些参数传入时，每个参数应该取什么值。他的搜索发现了一些规则，这些规则根据
    ACF 和 PACF 中的模式来决定 p、q 和 d 的值。

