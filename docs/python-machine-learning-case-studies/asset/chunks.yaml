- fmt: "在代码清单[1-11](#A432778_1_En_1_Chapter.html#Par87)中，Eric首先对数据框进行切片，仅考虑短期通行证持有者。接着他检查该切片中出生年份的所有值是否缺失（即`null`）。由于确实如此，Nancy最初推断的假设成立——出生年份数据仅对会员可用。这让她回想起之前关于千禧一代品牌忠诚度的推论。因此，清单[1-11](#A432778_1_En_1_Chapter.html#Par87)的输出推翻了Nancy在图[1-4](#A432778_1_En_1_Chapter.html#Fig4)分析后得出的结论。这让Nancy感到沮丧，因为无法从现有数据验证千禧一代的忠诚度。Eric认为会员在申请会员资格时必须提供出生年份等详细信息，而短期通行证持有者则无需提供。Eric决定通过检查短期通行证持有者的性别数据是否可用来验证他的推论，为此他编写了清单[1-12](#A432778_1_En_1_Chapter.html#Par91)中的代码。\n\
    \n```\ndata[data['usertype']=='Short-Term Pass Holder']['gender'].isnull().values.all()\n\
    Listing 1-12.\nValidation If We Don’t Have Gender Available for Short-Term Pass\
    \ Holders\n```\n\n输出\n\n```\nTrue\n```\n\n因此Eric得出结论：对于用户类型“短期通行证持有者”，我们无法获取其人口统计变量。\n\
    \nNancy对出行频率随日期和时间的变化（即时间序列分析）很感兴趣。Eric知道数据中提供了行程开始时间，但为了绘制时间序列图，他需要将日期从字符串转换为日期时间格式（见清单[1-13](#A432778_1_En_1_Chapter.html#Par96)）。他还决定做更多处理：将日期时间拆分为日期组件（即年、月、日和小时）。\n\
    \n```\nList_ = list(data['starttime'])\nList_ = [datetime.datetime.strptime(x,\
    \ \"%m/%d/%Y %H:%M\") for x in List_]\ndata['starttime_mod'] = pd.Series(List_,index=data.index)\n\
    data['starttime_date'] = pd.Series([x.date() for x in List_],index=data.index)\n\
    data['starttime_year'] = pd.Series([x.year for x in List_],index=data.index)\n\
    data['starttime_month'] = pd.Series([x.month for x in List_],index=data.index)\n\
    data['starttime_day'] = pd.Series([x.day for x in List_],index=data.index)\ndata['starttime_hour']\
    \ = pd.Series([x.hour for x in List_],index=data.index)\nListing 1-13.\nConverting\
    \ String to datetime, and Deriving New Features\n```\n\nEric像向Nancy解释那样，确保对清单[1-13](#A432778_1_En_1_Chapter.html#Par96)中的代码段进行说明：\n\
    \n> 首先，我们将数据框的`starttime`列转换为列表。接着，将字符串日期转换为Python的`datetime`对象。然后，将列表转换为`Series`对象，并将日期从`datetime`对象转换为Pandas的`date`对象。最后，从包含`datetime`对象的列表中提取年、月、日和小时等时间组件。\n\
    \n现在，是时候对数据集中所有日期的出行频率进行时间序列分析了（见清单[1-14](#A432778_1_En_1_Chapter.html#Par100)）。\n\
    \n```\ndata.groupby('starttime_date')['tripduration'].mean().plot.bar(title =\
    \ 'Distribution of Trip duration by date', figsize = (15,4))\nListing 1-14.\n\
    Plotting the Distribution of Trip Duration over Daily Time\n```\n\n![A432778_1_En_1_Fig7_HTML.gif](A432778_1_En_1_Fig7_HTML.gif)\n\
    \n图1-7. 表示出行时长按日分布的条形图\n\n哇！出行时长随时间呈现出明显的规律性。\n\n### 时间序列组件\n\nEric决定向Nancy简要介绍时间序列分析中存在的模式类型。他相信这有助于Nancy理解图[1-7](#A432778_1_En_1_Chapter.html#Fig7)中的明确规律。\n\
    \n#### 季节性模式\n\n季节性模式（见图[1-8](#A432778_1_En_1_Chapter.html#Fig8)）指的是在固定已知周期后出现的季节效应。该周期可以是月中的周、年中的周、年中的月、年中的季度等。这就是季节性时间序列也被称为周期性时间序列的原因。\n\
    \n![A432778_1_En_1_Fig8_HTML.gif](A432778_1_En_1_Fig8_HTML.gif)\n\n图1-8. 季节性模式示意图\n\
    \n#### 循环模式\n\n循环模式（见图[1-9](#A432778_1_En_1_Chapter.html#Fig9)）与季节性模式不同，其模式在非周期性时间周期上重复。\n\
    \n![A432778_1_En_1_Fig9_HTML.gif](A432778_1_En_1_Fig9_HTML.gif)\n\n图1-9. 循环模式示意图\n\
    \n#### 趋势\n\n趋势（见图[1-10](#A432778_1_En_1_Chapter.html#Fig10)）是连续变量的长期增加或减少。这种模式随时间可能并非完全线性，但应用平滑处理后，可以概括为上升或下降方向。\n\
    \n![A432778_1_En_1_Fig10_HTML.gif](A432778_1_En_1_Fig10_HTML.gif)\n\n图1-10. 趋势示意图\n\
    \nEric决定测试Nancy对时间序列概念的理解，于是让她谈谈对图[1-7](#A432778_1_En_1_Chapter.html#Fig7)中时间序列图的看法。“你觉得这个时间序列图怎么样？模式是季节性的还是循环的？是季节性的，对吧？”\n\
    \nNancy的回答再次让Eric感到惊讶。她说道：\n\n> 是的，因为模式在固定的时间间隔内重复——即季节性。实际上，我们可以将分布拆分为三个分布。一个模式是随时间重复的季节性。第二个是平坦的密度分布。最后，第三个模式是该密度函数上的线条（即峰值）。在时间序列预测中，我们可以利用这两个分布对未来时间进行估计，并将它们相加，从而在计算出的置信区间内进行预测。\n\
    \n根据她的推论，Nancy在统计学选修课上的成绩似乎没有白费。Nancy还想知道更多问题的答案。因此，她决定用接下来的练习题来挑战读者。\n\n练习题\n\
    \n1.  确定按年份划分的出行次数分布。你看到特定模式了吗？\n2.  确定按月份划分的出行次数分布。你看到特定模式了吗？\n3.  确定按天划分的出行次数分布。你看到特定模式了吗？\n\
    4.  确定按天划分的出行次数分布。你看到特定模式了吗？\n5.  绘制每日出行次数的频率分布图。\n\n## 度量中心\n\nEric认为均值、中位数和众数等度量有助于对相关特征进行概括性观察。基于此，他决定向Nancy介绍度量中心的概念。\n\
    \n### 均值\n\n均值在通俗意义上指数字的平均值。均值受异常值影响很大，因为异常值引入的偏斜会将均值拉向极端值。\n\n*   符号：\n    *\
    \   `μ` -> 参数 -> 总体均值\n    *   `x̄` -> 统计量 -> 样本均值\n*   均值规则：\n    *   `μ_{a+bx}\
    \ = a + bμ_x`\n    *   `μ_{x+y} = μ_x + μ_y`\n\n我们将在编码示例中使用`statistics.mean(data)`。这将返回数据（实数序列或迭代器）的样本算术平均值。\n\
    \n均值存在两种主要变体。"
  raw: "In the code in Listing [1-11](#A432778_1_En_1_Chapter.html#Par87), Eric first\
    \ sliced the data frame to consider only short-term pass holders. Then he went\
    \ forward to find out if all the values in birth year are missing (i.e., null)\
    \ for this slice. Since that is the case, Nancy’s initially inferred hypothesis\
    \ was true—that birth year data is only available for members. This made her recall\
    \ her prior deduction about the brand loyalty of millennials. Hence the output\
    \ for Listing [1-11](#A432778_1_En_1_Chapter.html#Par87) nullifies Nancy’s deduction\
    \ made after the analysis in Figure [1-4](#A432778_1_En_1_Chapter.html#Fig4).\
    \ This made Nancy sad, as the loyalty of millenials can’t be validated from the\
    \ data at hand. Eric believed that members have to provide details like birth\
    \ year when applying for the membership, something which is not a prerequisite\
    \ for short-term pass holders. Eric decided to test his deduction by checking\
    \ if gender is available for short-term pass holders or not for which he wrote\
    \ the code in Listing [1-12](#A432778_1_En_1_Chapter.html#Par91).\n\n```\ndata[data['usertype']=='Short-Term\
    \ Pass Holder']['gender'].isnull().values.all()\nListing 1-12.\nValidation If\
    \ We Don’t Have Gender Available for Short-Term Pass Holders\n```\n\nOutput\n\n\
    ```\nTrue\n```\n\nThus Eric concluded that we don’t have the demographic variables\
    \ for user type ‘Short-Term Pass holders’.\n\nNancy was interested to see as to\
    \ how the frequency of trips vary across date and time (i.e., a time series analysis).\
    \ Eric was aware that trip start time is given with the data, but for him to make\
    \ a time series plot, he had to transform the date from string to date time format\
    \ (see Listing [1-13](#A432778_1_En_1_Chapter.html#Par96)). He also decided to\
    \ do more: that is, split the datetime into date components (i.e., year, month,\
    \ day, and hour ).\n\n```\nList_ = list(data['starttime'])\nList_ = [datetime.datetime.strptime(x,\
    \ \"%m/%d/%Y %H:%M\") for x in List_]\ndata['starttime_mod'] = pd.Series(List_,index=data.index)\n\
    data['starttime_date'] = pd.Series([x.date() for x in List_],index=data.index)\n\
    data['starttime_year'] = pd.Series([x.year for x in List_],index=data.index)\n\
    data['starttime_month'] = pd.Series([x.month for x in List_],index=data.index)\n\
    data['starttime_day'] = pd.Series([x.day for x in List_],index=data.index)\ndata['starttime_hour']\
    \ = pd.Series([x.hour for x in List_],index=data.index)\nListing 1-13.\nConverting\
    \ String to datetime, and Deriving New Features\n```\n\nEric made sure to explain\
    \ the piece of code in Listing [1-13](#A432778_1_En_1_Chapter.html#Par96) as he\
    \ had explained to Nancy:\n\n> At first we converted start time column of the\
    \ dataframe into a list. Next we converted the string dates into python datetime\
    \ objects. We then converted the list into a series object and converted the dates\
    \ from datetime object to pandas date object. The time components of year, month,\
    \ day and hour were derived from the list with the datetime objects.\n\nNow it\
    \ was time for the time series analysis of the frequency of trips over all days\
    \ provided within the dataset (see Listing [1-14](#A432778_1_En_1_Chapter.html#Par100)).\n\
    \n```\ndata.groupby('starttime_date')['tripduration'].mean().plot.bar(title =\
    \ 'Distribution of Trip duration by date', figsize = (15,4))\nListing 1-14.\n\
    Plotting the Distribution of Trip Duration over Daily Time\n```\n\n![A432778_1_En_1_Fig7_HTML.gif](A432778_1_En_1_Fig7_HTML.gif)\n\
    \nFigure 1-7.\n\nBar graph signifying the distribution of trip duration over daily\
    \ time\n\nWow! There seems to be a definitive pattern of trip duration over time\
    \ .\n\n### Time Series Components\n\nEric decided to brief Nancy about the types\
    \ of patterns that exist in a time series analysis. This he believed would help\
    \ Nancy understand the definite pattern in Figure [1-7](#A432778_1_En_1_Chapter.html#Fig7).\n\
    \n#### Seasonal Pattern\n\nA seasonal pattern (see Figure [1-8](#A432778_1_En_1_Chapter.html#Fig8))\
    \ refers to a seasonality effect that incurs after a fixed known period. This\
    \ period can be week of the month, week of the year, month of the year, quarter\
    \ of the year, and so on. This is the reason why seasonal time series are also\
    \ referred to as periodic time series.\n\n![A432778_1_En_1_Fig8_HTML.gif](A432778_1_En_1_Fig8_HTML.gif)\n\
    \nFigure 1-8.\n\nIllustration of seasonal pattern\n\n#### Cyclic Pattern\n\nA\
    \ cyclic pattern (see Figure [1-9](#A432778_1_En_1_Chapter.html#Fig9)) is different\
    \ from a seasonal pattern in the notion that the patterns repeat over non-periodic\
    \ time cycles .\n\n![A432778_1_En_1_Fig9_HTML.gif](A432778_1_En_1_Fig9_HTML.gif)\n\
    \nFigure 1-9.\n\nIllustration of cyclic pattern\n\n#### Trend\n\nA trend (see\
    \ Figure [1-10](#A432778_1_En_1_Chapter.html#Fig10)) is a long-term increase or\
    \ decrease in a continuous variable. This pattern might not be exactly linear\
    \ over time, but when smoothing is applied it can generalize into either of the\
    \ directions.\n\n![A432778_1_En_1_Fig10_HTML.gif](A432778_1_En_1_Fig10_HTML.gif)\n\
    \nFigure 1-10.\n\nIllustration of trend\n\nEric decided to test Nancy’s concepts\
    \ on time series, so he asked her to provide her thoughts on the time series plot\
    \ in Figure [1-7](#A432778_1_En_1_Chapter.html#Fig7). “What do you think of the\
    \ time series plot? Is the pattern seasonal or cyclic? Seasonal is it right?”\n\
    \nNancy’s reply amazed Eric once again. She said the following:\n\n> Yes it is\
    \ because the pattern is repeating over a fixed interval of time—that is, seasonality\
    \ . In fact, we can split the distribution into three distributions. One pattern\
    \ is the seasonality that is repeating over time. The second one is a flat density\
    \ distribution. Finally, the last pattern is the lines (that is, the hikes) over\
    \ that density function. In case of time series prediction we can make estimations\
    \ for a future time using both of these distributions and add up in order to predict\
    \ upon a calculated confidence interval.\n\nOn the basis of her deduction it seemed\
    \ like Nancy’s grades in her statistics elective course had paid off. Nancy wanted\
    \ answers to many more of her questions. Hence she decided to challenge the readers\
    \ with the Exercises that follow .\n\nExercises\n\n1.  Determine the distribution\
    \ of number of trips by year. Do you see a specific pattern?  \n2.  Determine\
    \ the distribution of number of trips by month. Do you see a specific pattern?\
    \  \n3.  Determine the distribution of number of trips by day. Do you see a specific\
    \ pattern?  \n4.  Determine the distribution of number of trips by day. Do you\
    \ see a specific pattern?  \n5.  Plot a frequency distribution of trips on a daily\
    \ basis.\n\n## Measuring Center of Measure\n\nEric believed that measures like\
    \ mean, median, and mode help give a summary view of the features in question.\
    \ Taking this into consideration, he decided to walk Nancy through the concepts\
    \ of center of measure .\n\n### Mean\n\nMean in layman terms refers to the averaging\
    \ out of numbers Mean is highly affected by outliers, as the skewness introduced\
    \ by outliers will pull the mean toward extreme values.\n\n*   Symbol:\n    *\
    \   μ-> Parameter -> population mean\n    *   ![$$ \\overset{\\acute{\\mkern6mu}}{x}\
    \ $$](A432778_1_En_1_Chapter_IEq1.gif)-> Statistic -> sample mean\n*   Rules of\
    \ mean:\n    *   ![$$ {\\mu}_{a+ bx}=a+b{\\mu}_x $$](A432778_1_En_1_Chapter_Equa.gif)\n\
    \n    *   ![$$ {\\mu}_{x+y}={\\mu}_x+{\\mu}_y $$](A432778_1_En_1_Chapter_Equb.gif)\n\
    \nWe will be using statistics.mean(data) in our coding examples. This will return\
    \ the sample arithmetic mean of data, a sequence or iterator of real-valued numbers.\n\
    \nMean exists in two major variants."
  trans: "\n在清单 1-11 的代码中，埃里克首先对数据框进行了切片，只考虑短期通行证持有者。接着他继续检查该切片中出生年份的所有值是否缺失（即为空）。由于情况确实如此，南希最初推断的假设成立——即只有会员才有出生年份数据。这让她回想起之前关于千禧一代品牌忠诚度的推论。因此，清单\
    \ 1-11 的输出推翻了南希在图 1-4 分析后得出的结论。这让南希感到沮丧，因为千禧一代的忠诚度无法从现有数据中得到验证。埃里克认为，会员在申请会员资格时必须提供出生年份等详细信息，而短期通行证持有者则无需提供。埃里克决定通过检查短期通行证持有者是否有性别数据来验证他的推论，为此他编写了清单\
    \ 1-12 中的代码。\n\n```\ndata[data['usertype']=='Short-Term Pass Holder']['gender'].isnull().values.all()\n\
    清单 1-12.\n验证短期通行证持有者是否没有性别数据\n```\n\n输出\n\n```\nTrue\n```\n\n因此埃里克得出结论，对于用户类型“短期通行证持有者”，我们没有人口统计变量。\n\
    \n南希很想知道出行频率如何随日期和时间变化（即时间序列分析）。埃里克知道数据中提供了行程开始时间，但为了绘制时间序列图，他必须将日期从字符串格式转换为日期时间格式（见清单\
    \ 1-13）。他还决定做更多工作：即将日期时间拆分为日期组件（即年、月、日和小时）。\n\n```\nList_ = list(data['starttime'])\n\
    List_ = [datetime.datetime.strptime(x, \"%m/%d/%Y %H:%M\") for x in List_]\ndata['starttime_mod']\
    \ = pd.Series(List_,index=data.index)\ndata['starttime_date'] = pd.Series([x.date()\
    \ for x in List_],index=data.index)\ndata['starttime_year'] = pd.Series([x.year\
    \ for x in List_],index=data.index)\ndata['starttime_month'] = pd.Series([x.month\
    \ for x in List_],index=data.index)\ndata['starttime_day'] = pd.Series([x.day\
    \ for x in List_],index=data.index)\ndata['starttime_hour'] = pd.Series([x.hour\
    \ for x in List_],index=data.index)\n清单 1-13.\n将字符串转换为日期时间，并衍生新特征\n```\n\n埃里克像向南希解释那样，确保解释了清单\
    \ 1-13 中的代码片段：\n\n> 首先，我们将数据框的开始时间列转换为列表。接着，我们将字符串日期转换为 Python 的 datetime 对象。然后，我们将该列表转换为\
    \ Series 对象，并将日期从 datetime 对象转换为 pandas 的 date 对象。年、月、日和小时这些时间组件是从包含 datetime\
    \ 对象的列表中衍生出来的。\n\n现在是对数据集中所有日期的出行频率进行时间序列分析的时候了（见清单 1-14）。\n\n```\ndata.groupby('starttime_date')['tripduration'].mean().plot.bar(title\
    \ = 'Distribution of Trip duration by date', figsize = (15,4))\n清单 1-14.\n绘制每日行程时长分布图\n\
    ```\n\n![A432778_1_En_1_Fig7_HTML.gif](img/A432778_1_En_1_Fig7_HTML.gif)\n\n图\
    \ 1-7.\n\n表示每日行程时长分布的条形图\n\n哇！行程时长似乎随时间呈现出明确的模式。\n\n### 时间序列组件\n\n埃里克决定向南希简要介绍时间序列分析中存在的模式类型。他相信这能帮助南希理解图\
    \ 1-7 中的明确模式。\n\n#### 季节性模式\n\n季节性模式（见图 1-8）指的是在固定的已知周期后出现的季节性效应。这个周期可以是月中的周、年中的周、年中的月、年中的季度等。这就是为什么季节性时间序列也被称为周期性时间序列。\n\
    \n![A432778_1_En_1_Fig8_HTML.gif](img/A432778_1_En_1_Fig8_HTML.gif)\n\n图 1-8.\n\
    \n季节性模式示意图\n\n#### 循环模式\n\n循环模式（见图 1-9）与季节性模式不同，其模式在非周期性的时间周期中重复。\n\n![A432778_1_En_1_Fig9_HTML.gif](img/A432778_1_En_1_Fig9_HTML.gif)\n\
    \n图 1-9.\n\n循环模式示意图\n\n#### 趋势\n\n趋势（见图 1-10）是连续变量的长期增加或减少。这种模式随时间可能并非完全线性，但应用平滑处理后，它可以概括为上升或下降方向。\n\
    \n![A432778_1_En_1_Fig10_HTML.gif](img/A432778_1_En_1_Fig10_HTML.gif)\n\n图 1-10.\n\
    \n趋势示意图\n\n埃里克决定测试南希对时间序列概念的理解，于是他让她谈谈对图 1-7 中时间序列图的看法。“你觉得这个时间序列图怎么样？模式是季节性的还是循环的？是季节性的，对吧？”\n\
    \n南希的回答再次让埃里克感到惊讶。她说道：\n\n> 是的，因为模式在固定的时间间隔内重复——即季节性。事实上，我们可以将这个分布拆分成三个分布。一个模式是随时间重复的季节性。第二个是平坦的密度分布。最后，第三个模式是该密度函数上的线条（即峰值）。在进行时间序列预测时，我们可以利用这两个分布对未来时间进行估计，并将它们相加，从而在计算出的置信区间内进行预测。\n\
    \n根据她的推论，南希在统计学选修课上的成绩似乎没有白费。南希还想知道更多问题的答案。因此，她决定用接下来的练习题来挑战读者。\n\n练习题\n\n1. \
    \ 确定按年份划分的出行次数分布。你看到了特定的模式吗？  \n2.  确定按月份划分的出行次数分布。你看到了特定的模式吗？  \n3.  确定按天划分的出行次数分布。你看到了特定的模式吗？\
    \  \n4.  确定按天划分的出行次数分布。你看到了特定的模式吗？  \n5.  绘制每日出行次数的频率分布图。\n\n## 度量中心\n\n埃里克认为，均值、中位数和众数等度量有助于对相关特征进行概括性观察。考虑到这一点，他决定向南希讲解度量中心的概念。\n\
    \n### 均值\n\n通俗地说，均值指的是数字的平均值。均值受异常值影响很大，因为异常值引入的偏斜会将均值拉向极端值。\n\n*   符号：\n    *\
    \   μ -> 参数 -> 总体均值\n    *   ![$$ \\overset{\\acute{\\mkern6mu}}{x} $$](img/A432778_1_En_1_Chapter_IEq1.gif)\
    \ -> 统计量 -> 样本均值\n*   均值的规则：\n    *   ![$$ {\\mu}_{a+ bx}=a+b{\\mu}_x $$](img/A432778_1_En_1_Chapter_Equa.gif)\n\
    \n    *   ![$$ {\\mu}_{x+y}={\\mu}_x+{\\mu}_y $$](img/A432778_1_En_1_Chapter_Equb.gif)\n\
    \n在我们的编码示例中，我们将使用 `statistics.mean(data)`。这将返回数据（一个实数序列或迭代器）的样本算术平均值。\n\n均值主要有两种变体。\n"
- fmt: "#### Arithmetic Mean\n\nAn arithmetic mean is simpler than a geometric mean\
    \ as it averages out the numbers (i.e., it adds all the numbers and then divides\
    \ the sum by the frequency of those numbers). Take, for example, the grades of\
    \ ten students who appeared in a mathematics test.\n\n* 78, 65, 89, 93, 87, 56,\
    \ 45, 73, 51, 81\n\nCalculating the arithmetic mean will mean\n\n![$$ mean=\\\
    frac{78+65+89+93+87+56+45+73+51+81}{10}=71.8 $$](A432778_1_En_1_Chapter_Equc.gif)\n\
    \nHence the arithmetic mean of scores taken by students in their mathematics test\
    \ was 71.8. Arithmetic mean is most suitable in situations when the observations\
    \ (i.e., math scores) are independent of each other. In this case it means that\
    \ the score of one student in the test won’t affect the score that another student\
    \ will have in the same test.\n\n#### Geometric Mean\n\nAs we saw earlier, arithmetic\
    \ mean is calculated for observations which are independent of each other. However,\
    \ this doesn’t hold true in the case of a geometric mean as it is used to calculate\
    \ mean for observations that are dependent on each other. For example, suppose\
    \ you invested your savings in stocks for five years. Returns of each year will\
    \ be invested back in the stocks for the subsequent year. Consider that we had\
    \ the following returns in each one of the five years:\n\n* 60%, 80%, 50%, -30%,\
    \ 10%\n\nAre these returns dependent on each other? Well, yes! Why? Because the\
    \ investment of the next year is done on the capital garnered from the previous\
    \ year, such that a loss in the first year will mean less capital to invest in\
    \ the next year and vice versa. So, yes, we will be calculating the geometric\
    \ mean. But how? We will do so as follows:\n\n* `[(0.6 + 1) * (0.8 + 1) * (0.5\
    \ + 1) * (-0.3 + 1) * (0.1 + 1)]^(1/5) - 1 = 0.2713`\n\nHence, an investment with\
    \ these returns will yield a return of 27.13% by the end of the fifth year. Looking\
    \ at the calculation above, you can see that at first we first converted percentages\
    \ into decimals. Next we added 1 to each of them to nullify the effects brought\
    \ on by the negative terms. Then we multiplied all terms among themselves and\
    \ applied a power to the resultant. The power applied was 1 divided by the frequency\
    \ of observations (i.e., five in this case). In the end we subtracted the result\
    \ by 1. Subtraction was done to nullify the effect introduced by an addition of\
    \ 1, which we did initially with each term. The subtraction by 1 would not have\
    \ been done had we not added 1 to each of the terms (i.e., yearly returns).\n\n\
    ### Median\n\nMedian is a measure of central location alongside mean and mode,\
    \ and it is less affected by the presence of outliers in your data. When the frequency\
    \ of observations in the data is odd, the middle data point is returned as the\
    \ median.\n\nIn this chapter we will use `statistics.median(data)` to calculate\
    \ the median. This returns the median (middle value) of numeric data if frequency\
    \ of values is odd and otherwise mean of the middle values if frequency of values\
    \ is even using “mean of middle two” method. If data is empty, `StatisticsError`\
    \ is raised.\n\n### Mode\n\nMode is suitable on data which is discrete or nominal\
    \ in nature. Mode returns the observation in the dataset with the highest frequency.\
    \ Mode remains unaffected by the presence of outliers in data.\n\n### Variance\n\
    \nVariance represents variability of data points about the mean. A high variance\
    \ means that the data is highly spread out with a small variance signifying the\
    \ data to be closely clustered.\n\n1. Symbol:\n\n   ![$$ {\\sigma}_x^2 $$](A432778_1_En_1_Chapter_Equ1.gif)\n\
    \n2. Formula:\n   1. ![$$ \\frac{\\sum {\\left(X-\\overset{\\acute{\\mkern6mu}}{X}\\\
    right)}^2}{n-1} $$](A432778_1_En_1_Chapter_Equd.gif)\n   2. ![$$ {\\sigma}_x^2=\\\
    sum {\\left({x}_i-{\\mu}_x\\right)}^2{p}_i $$](A432778_1_En_1_Chapter_Eque.gif)\n\
    \n3. Why `n-1` beneath variance calculation? The sample variance averages out\
    \ to be smaller than the population variance; hence, degrees of freedom is accounted\
    \ for as the conversion factor.\n\n4. Rules of variance:\n   1. ![$$ {\\sigma}_{a+\
    \ bx}^2={b}^2{\\sigma}_x^2 $$](A432778_1_En_1_Chapter_Equf.gif)\n   2. ![$$ {\\\
    boldsymbol{\\sigma}}_{\\boldsymbol{x}+\\boldsymbol{y}}^2={\\boldsymbol{\\sigma}}_{\\\
    boldsymbol{x}}^2+{\\boldsymbol{\\sigma}}_{\\boldsymbol{y}}^2 $$](A432778_1_En_1_Chapter_IEq2.gif)\
    \ (If X and Y are independent variables)\n\n      ![$$ {\\boldsymbol{\\sigma}}_{\\\
    boldsymbol{x}-\\boldsymbol{y}}^2={\\boldsymbol{\\sigma}}_{\\boldsymbol{x}}^2+{\\\
    boldsymbol{\\sigma}}_{\\boldsymbol{y}}^2 $$](A432778_1_En_1_Chapter_Equg.gif)\n\
    \n   3. ![$$ {\\boldsymbol{\\sigma}}_{\\boldsymbol{x}+\\boldsymbol{y}}^2={\\boldsymbol{\\\
    sigma}}_{\\boldsymbol{x}}^2+{\\boldsymbol{\\sigma}}_{\\boldsymbol{y}}^2+2\\boldsymbol{r}{\\\
    boldsymbol{\\sigma}}_{\\boldsymbol{x}}{\\boldsymbol{\\sigma}}_{\\boldsymbol{y}}\
    \ $$](A432778_1_En_1_Chapter_IEq3.gif) (if X and Y have correlation r)\n\n   \
    \   ![$$ {\\boldsymbol{\\sigma}}_{\\boldsymbol{x}+\\boldsymbol{y}}^2={\\boldsymbol{\\\
    sigma}}_{\\boldsymbol{x}}^2+{\\boldsymbol{\\sigma}}_{\\boldsymbol{y}}^2+2\\boldsymbol{r}{\\\
    boldsymbol{\\sigma}}_{\\boldsymbol{x}}{\\boldsymbol{\\sigma}}_{\\boldsymbol{y}}\
    \ $$](A432778_1_En_1_Chapter_Equh.gif)\n\nWe will be incorporating `statistics.variance(data,\
    \ xbar=None)` to calculate variance in our coding exercises. This will return\
    \ the sample variance across at least two real-valued numbered series.\n\n###\
    \ Standard Deviation\n\nStandard deviation, just like variance, also captures\
    \ the spread of data along the mean. The only difference is that it is a square\
    \ root of the variance. This enables it to have the same unit as that of the data\
    \ and thus provides convenience in inferring explanations from insights. Standard\
    \ deviation is highly affected by outliers and skewed distributions.\n\n* Symbol:\
    \ `σ`\n* Formula: ![$$ \\sqrt{\\sigma^2} $$](A432778_1_En_1_Chapter_IEq4.gif)\n\
    \nWe measure standard deviation instead of variance because\n\n* It is the natural\
    \ measure of spread in a Normal distribution\n* Same units as original observations"
  raw: "#### Arithmetic Mean\n\nAn arithmetic mean is simpler than a geometric mean\
    \ as it averages out the numbers (i.e., it adds all the numbers and then divides\
    \ the sum by the frequency of those numbers). Take, for example, the grades of\
    \ ten students who appeared in a mathematics test.\n\n*   78, 65, 89, 93, 87,\
    \ 56, 45, 73, 51, 81\n\nCalculating the arithmetic mean will mean\n\n![$$ mean=\\\
    frac{78+65+89+93+87+56+45+73+51+81}{10}=71.8 $$](A432778_1_En_1_Chapter_Equc.gif)\n\
    \nHence the arithmetic mean of scores taken by students in their mathematics test\
    \ was 71.8\\. Arithmetic mean is most suitable in situations when the observations\
    \ (i.e., math scores) are independent of each other. In this case it means that\
    \ the score of one student in the test won’t affect the score that another student\
    \ will have in the same test.\n\n#### Geometric Mean\n\nAs we saw earlier, arithmetic\
    \ mean is calculated for observations which are independent of each other. However,\
    \ this doesn’t hold true in the case of a geometric mean as it is used to calculate\
    \ mean for observations that are dependent on each other. For example, suppose\
    \ you invested your savings in stocks for five years. Returns of each year will\
    \ be invested back in the stocks for the subsequent year. Consider that we had\
    \ the following returns in each one of the five years:\n\n*   60%, 80%, 50%, -30%,\
    \ 10%\n\nAre these returns dependent on each other? Well, yes! Why? Because the\
    \ investment of the next year is done on the capital garnered from the previous\
    \ year, such that a loss in the first year will mean less capital to invest in\
    \ the next year and vice versa. So, yes, we will be calculating the geometric\
    \ mean. But how? We will do so as follows:\n\n*   [(0.6 + 1) * (0.8 + 1) * (0.5\
    \ + 1) * (-0.3 + 1) * (0.1 + 1)]^(1/5) - 1 = 0.2713\n\nHence, an investment with\
    \ these returns will yield a return of 27.13% by the end of the fifth year. Looking\
    \ at the calculation above, you can see that at first we first converted percentages\
    \ into decimals. Next we added 1 to each of them to nullify the effects brought\
    \ on by the negative terms. Then we multiplied all terms among themselves and\
    \ applied a power to the resultant. The power applied was 1 divided by the frequency\
    \ of observations (i.e., five in this case). In the end we subtracted the result\
    \ by 1\\. Subtraction was done to nullify the effect introduced by an addition\
    \ of 1, which we did initially with each term. The subtraction by 1 would not\
    \ have been done had we not added 1 to each of the terms (i.e., yearly returns).\n\
    \n### Median\n\nMedian is a measure of central location alongside mean and mode,\
    \ and it is less affected by the presence of outliers in your data. When the frequency\
    \ of observations in the data is odd, the middle data point is returned as the\
    \ median.\n\nIn this chaapter we will use statistics.median(data) to calculate\
    \ the median. This returns the median (middle value) of numeric data if frequency\
    \ of values is odd and otherwise mean of the middle values if frequency of values\
    \ is even using “mean of middle two” method. If data is empty, StatisticsError\
    \ is raised.\n\n### Mode\n\nMode is suitable on data which is discrete or nominal\
    \ in nature. Mode returns the observation in the dataset with the highest frequency.\
    \ Mode remains unaffected by the presence of outliers in data.\n\n### Variance\n\
    \nVariance represents variability of data points about the mean. A high variance\
    \ means that the data is highly spread out with a small variance signifying the\
    \ data to be closely clustered.\n\n1.  Symbol:\n\n    ![$$ {\\sigma}_x^2 $$](A432778_1_En_1_Chapter_Equ1.gif)\n\
    \n2.  Formula:\n    1.  ![$$ \\frac{\\sum {\\left(X-\\overset{\\acute{\\mkern6mu}}{X}\\\
    right)}^2}{n-1} $$](A432778_1_En_1_Chapter_Equd.gif)\n\n    2.  ![$$ {\\sigma}_x^2=\\\
    sum {\\left({x}_i-{\\mu}_x\\right)}^2{p}_i $$](A432778_1_En_1_Chapter_Eque.gif)\n\
    \n3.  Why n-1 beneath variance calculation? The sample variance averages out to\
    \ be smaller than the population variance; hence, degrees of freedom is accounted\
    \ for as the conversion factor.  \n4.  Rules of variance:\n    1.  ![$$ {\\sigma}_{a+\
    \ bx}^2={b}^2{\\sigma}_x^2 $$](A432778_1_En_1_Chapter_Equf.gif)\n\n    2.  ![$$\
    \ {\\boldsymbol{\\sigma}}_{\\boldsymbol{x}+\\boldsymbol{y}}^2={\\boldsymbol{\\\
    sigma}}_{\\boldsymbol{x}}^2+{\\boldsymbol{\\sigma}}_{\\boldsymbol{y}}^2 $$](A432778_1_En_1_Chapter_IEq2.gif)(If\
    \ X and Y are independent variables)\n\n        ![$$ {\\boldsymbol{\\sigma}}_{\\\
    boldsymbol{x}-\\boldsymbol{y}}^2={\\boldsymbol{\\sigma}}_{\\boldsymbol{x}}^2+{\\\
    boldsymbol{\\sigma}}_{\\boldsymbol{y}}^2 $$](A432778_1_En_1_Chapter_Equg.gif)\n\
    \n    3.  ![$$ {\\boldsymbol{\\sigma}}_{\\boldsymbol{x}+\\boldsymbol{y}}^2={\\\
    boldsymbol{\\sigma}}_{\\boldsymbol{x}}^2+{\\boldsymbol{\\sigma}}_{\\boldsymbol{y}}^2+2\\\
    boldsymbol{r}{\\boldsymbol{\\sigma}}_{\\boldsymbol{x}}{\\boldsymbol{\\sigma}}_{\\\
    boldsymbol{y}} $$](A432778_1_En_1_Chapter_IEq3.gif)(if X and Y have correlation\
    \ r)\n\n        ![$$ {\\boldsymbol{\\sigma}}_{\\boldsymbol{x}+\\boldsymbol{y}}^2={\\\
    boldsymbol{\\sigma}}_{\\boldsymbol{x}}^2+{\\boldsymbol{\\sigma}}_{\\boldsymbol{y}}^2+2\\\
    boldsymbol{r}{\\boldsymbol{\\sigma}}_{\\boldsymbol{x}}{\\boldsymbol{\\sigma}}_{\\\
    boldsymbol{y}} $$](A432778_1_En_1_Chapter_Equh.gif)\n\nWe will be incorporating\
    \ statistics.variance(data, xbar=None) to calculate variance in our coding exercises.\
    \ This will return the sample variance across at least two real-valued numbered\
    \ series .\n\n### Standard Deviation\n\nStandard deviation , just like variance,\
    \ also captures the spread of data along the mean. The only difference is that\
    \ it is a square root of the variance. This enables it to have the same unit as\
    \ that of the data and thus provides convenience in inferring explanations from\
    \ insights. Standard deviation is highly affected by outliers and skewed distributions.\n\
    \n*   Symbol: σ\n*   Formula: ![$$ \\sqrt{\\sigma^2} $$](A432778_1_En_1_Chapter_IEq4.gif)\n\
    \nWe measure standard deviation instead of variance because\n\n*   It is the natural\
    \ measure of spread in a Normal distribution\n*   Same units as original observations"
  trans: "\n#### 算术平均数\n\n算术平均数比几何平均数更简单，因为它是对数值进行平均（即，将所有数值相加，然后除以这些数值的个数）。以十名学生在一次数学考试中的成绩为例：\n\
    \n*   78, 65, 89, 93, 87, 56, 45, 73, 51, 81\n\n计算算术平均数的公式如下：\n\n![$$ mean=\\\
    frac{78+65+89+93+87+56+45+73+51+81}{10}=71.8 $$](img/A432778_1_En_1_Chapter_Equc.gif)\n\
    \n因此，学生在数学考试中成绩的算术平均数为 71.8。当观测值（即数学成绩）相互独立时，算术平均数最为适用。在此例中，这意味着一名学生的考试成绩不会影响另一名学生在同一考试中的成绩。\n\
    \n#### 几何平均数\n\n正如我们之前所见，算术平均数适用于相互独立的观测值。然而，这并不适用于几何平均数，因为它用于计算相互依赖的观测值的平均数。例如，假设你将储蓄投资于股票五年。每年的收益将再投资于下一年的股票。假设我们在五年中每年的回报率如下：\n\
    \n*   60%, 80%, 50%, -30%, 10%\n\n这些回报率相互依赖吗？是的，没错！为什么？因为下一年的投资是基于前一年获得的资本进行的，因此第一年的亏损意味着下一年可投资的资本减少，反之亦然。所以，是的，我们将计算几何平均数。但如何计算呢？我们将按如下步骤进行：\n\
    \n*   [(0.6 + 1) * (0.8 + 1) * (0.5 + 1) * (-0.3 + 1) * (0.1 + 1)]^(1/5) - 1 =\
    \ 0.2713\n\n因此，具有这些回报率的投资在第五年末将产生 27.13% 的回报率。观察上述计算，你可以看到我们首先将百分比转换为小数。接着，我们给每个小数加\
    \ 1，以消除负项带来的影响。然后，我们将所有项相乘，并对结果应用幂运算。所应用的幂是 1 除以观测值的个数（本例中为 5）。最后，我们将结果减去 1。进行减法是为了消除最初对每个项加\
    \ 1 所带来的影响。如果我们没有对每个项（即每年的回报率）加 1，那么就不需要进行减 1 的操作。\n\n### 中位数\n\n中位数是与平均数、众数并列的一种中心位置度量，它受数据中异常值的影响较小。当数据中观测值的个数为奇数时，中间的数据点即为中位数。\n\
    \n在本章中，我们将使用 `statistics.median(data)` 来计算中位数。如果数值个数为奇数，该函数返回数值数据的中位数（中间值）；如果数值个数为偶数，则使用“中间两个数的平均值”方法返回中间两个值的平均数。如果数据为空，则会引发\
    \ `StatisticsError`。\n\n### 众数\n\n众数适用于离散或名义性质的数据。众数返回数据集中出现频率最高的观测值。众数不受数据中异常值的影响。\n\
    \n### 方差\n\n方差表示数据点围绕平均数的离散程度。方差大意味着数据高度分散，方差小则表示数据紧密聚集。\n\n1.  符号：\n\n    ![$$\
    \ {\\sigma}_x² $$](img/A432778_1_En_1_Chapter_Equ1.gif)\n\n2.  公式：\n    1.  ![$$\
    \ \\frac{\\sum {\\left(X-\\overset{\\acute{\\mkern6mu}}{X}\\right)}²}{n-1} $$](img/A432778_1_En_1_Chapter_Equd.gif)\n\
    \n    2.  ![$$ {\\sigma}_x²=\\sum {\\left({x}_i-{\\mu}_x\\right)}²{p}_i $$](img/A432778_1_En_1_Chapter_Eque.gif)\n\
    \n3.  为什么方差计算中分母是 n-1？样本方差的平均值往往小于总体方差；因此，自由度被用作转换因子。\n4.  方差规则：\n    1.  ![$$\
    \ {\\sigma}_{a+ bx}²={b}²{\\sigma}_x² $$](img/A432778_1_En_1_Chapter_Equf.gif)\n\
    \n    2.  ![$$ {\\boldsymbol{\\sigma}}_{\\boldsymbol{x}+\\boldsymbol{y}}²={\\\
    boldsymbol{\\sigma}}_{\\boldsymbol{x}}²+{\\boldsymbol{\\sigma}}_{\\boldsymbol{y}}²\
    \ $$](img/A432778_1_En_1_Chapter_IEq2.gif)（如果 X 和 Y 是独立变量）\n\n        ![$$ {\\\
    boldsymbol{\\sigma}}_{\\boldsymbol{x}-\\boldsymbol{y}}²={\\boldsymbol{\\sigma}}_{\\\
    boldsymbol{x}}²+{\\boldsymbol{\\sigma}}_{\\boldsymbol{y}}² $$](img/A432778_1_En_1_Chapter_Equg.gif)\n\
    \n    3.  ![$$ {\\boldsymbol{\\sigma}}_{\\boldsymbol{x}+\\boldsymbol{y}}²={\\\
    boldsymbol{\\sigma}}_{\\boldsymbol{x}}²+{\\boldsymbol{\\sigma}}_{\\boldsymbol{y}}²+2\\\
    boldsymbol{r}{\\boldsymbol{\\sigma}}_{\\boldsymbol{x}}{\\boldsymbol{\\sigma}}_{\\\
    boldsymbol{y}} $$](img/A432778_1_En_1_Chapter_IEq3.gif)（如果 X 和 Y 具有相关性 r）\n\n\
    \        ![$$ {\\boldsymbol{\\sigma}}_{\\boldsymbol{x}+\\boldsymbol{y}}²={\\boldsymbol{\\\
    sigma}}_{\\boldsymbol{x}}²+{\\boldsymbol{\\sigma}}_{\\boldsymbol{y}}²+2\\boldsymbol{r}{\\\
    boldsymbol{\\sigma}}_{\\boldsymbol{x}}{\\boldsymbol{\\sigma}}_{\\boldsymbol{y}}\
    \ $$](img/A432778_1_En_1_Chapter_Equh.gif)\n\n在编程练习中，我们将使用 `statistics.variance(data,\
    \ xbar=None)` 来计算方差。该函数将返回至少包含两个实数值的数列的样本方差。\n\n### 标准差\n\n标准差与方差一样，也衡量数据围绕平均数的离散程度。唯一的区别在于，标准差是方差的平方根。这使得它具有与数据相同的单位，从而便于从洞察中推断解释。标准差受异常值和偏态分布的影响很大。\n\
    \n*   符号：σ\n*   公式：![$$ \\sqrt{\\sigma²} $$](img/A432778_1_En_1_Chapter_IEq4.gif)\n\
    \n我们测量标准差而非方差，是因为：\n\n*   它是正态分布中离散程度的自然度量\n*   与原始观测值具有相同的单位\n"
- fmt: '### Changes in Measure of Center Statistics due to Presence of Constants


    Let’s evaluate how measure of center statistics behave when data is transformed
    by the introduction of constants. We will evaluate the outcomes for mean, median,
    IQR (interquartile range), standard deviation, and variance. Let’s first start
    with what behavior each of these exhibits when a constant “a” is added or subtracted
    from each of these.


    **Addition: Adding a**


    *   ![$$ {\overset{\acute{\mkern6mu}}{x}}_{new}=a+\overset{\acute{\mkern6mu}}{x}
    $$](A432778_1_En_1_Chapter_Equi.gif)

    *   ![$$ media{n}_{new}=a+ median $$](A432778_1_En_1_Chapter_Equj.gif)

    *   ![$$ IQ{R}_{new}=a+ IQR $$](A432778_1_En_1_Chapter_Equk.gif)

    *   ![$$ {s}_{new}=s $$](A432778_1_En_1_Chapter_Equl.gif)

    *   ![$$ {\sigma_x^2}_{new}={\sigma}_x^2 $$](A432778_1_En_1_Chapter_Equm.gif)


    Adding a constant to each of the observations affected the mean, median, and IQR.
    However, standard deviation and variance remained unaffected. Note that the same
    behavior will come through when observations within the data are subtracted from
    a constant. Let’s see if the same behavior will repeat when we multiply a constant
    (i.e., “b”) to each observation within the data.


    **Multiplication: Multiplying b**


    *   ![$$ {\overset{\acute{\mkern6mu}}{x}}_{new}=b\overset{\acute{\mkern6mu}}{x}
    $$](A432778_1_En_1_Chapter_Equn.gif)

    *   ![$$ media{n}_{new}= bmedian $$](A432778_1_En_1_Chapter_Equo.gif)

    *   ![$$ IQ{R}_{new}= bIQR $$](A432778_1_En_1_Chapter_Equp.gif)

    *   ![$$ {s}_{new}= bs $$](A432778_1_En_1_Chapter_Equq.gif)

    *   ![$$ {\sigma_x^2}_{new}={b}^2{\sigma}_x^2 $$](A432778_1_En_1_Chapter_Equr.gif)


    Wow! Multiplying a constant to each observation within the data changed all five
    measures of center statistics. Do note that you will achieve the same effect when
    all observations within the data are divided by a constant term.


    After going through the description of center of measures, Nancy was interested
    in understanding the trip durations in detail. Hence Eric came up with the idea
    to calculate the mean and median trip durations. Moreover, Nancy wanted to determine
    the station from which most trips originated in order to run promotional campaigns
    for existing customers. Hence Eric decided to determine the mode of `from_station_name`
    field.


    **Note**


    Determining the measures of centers using the statistics package will require
    us to transform the input data structure to a list type.


    ```

    trip_duration = list(data[''tripduration''])

    station_from = list(data[''from_station_name''])

    print ''Mean of trip duration: %f''%statistics.mean(trip_duration)

    print ''Median of trip duration: %f''%statistics.median(trip_duration)

    print ''Mode of station originating from: %s''%statistics.mode(station_from)

    Listing 1-15.

    Determining the Measures of Center Using Statistics Package

    ```


    **Output**


    ```

    Mean of trip duration: 1202.612210

    Median of trip duration: 633.235000

    Mode of station originating from: Pier 69 / Alaskan Way & Clay St

    ```


    The output of Listing [1-15](#A432778_1_En_1_Chapter.html#Par100) revealed that
    most trips originated from Pier 69/Alaskan Way & Clay St station. Hence this was
    the ideal location for running promotional campaigns targeted to existing customers.
    Moreover, the output showed the mean to be greater than that of the mean. Nancy
    was curious as to why the average (i.e., mean) is greater than the central value
    (i.e., median). On the basis of what she had read, she realized that this might
    be either due to some extreme values after the median or due to the majority of
    values lying after the median. Eric decided to plot a distribution of the trip
    durations (see Listing [1-16](#A432778_1_En_1_Chapter.html#Par180)) in order to
    determine which premise holds true.


    ```

    data[''tripduration''].plot.hist(bins=100, title=''Frequency distribution of Trip
    duration'')

    plt.show()

    Listing 1-16.

    Plotting Histogram of Trip Duration

    ```


    ![A432778_1_En_1_Fig11_HTML.gif](A432778_1_En_1_Fig11_HTML.gif)


    **Figure 1-11.** Frequency distribution of trip duration


    The distribution in Figure [1-11](#A432778_1_En_1_Chapter.html#Fig11) has only
    one peak (i.e., mode). The distribution is not symmetric and has majority of values
    toward the right-hand side of the mode. These extreme values toward the right
    are negligible in quantity, but their extreme nature tends to pull the mean toward
    themselves. Thus the reason why the mean is greater than the median.


    The distribution in Figure [1-11](#A432778_1_En_1_Chapter.html#Fig11) is referred
    to as a normal distribution.


    ### The Normal Distribution


    Normal distribution, or in other words Gaussian distribution, is a continuous
    probability distribution that is bell shaped. The important characteristic of
    this distribution is that the mean lies at the center of this distribution with
    a spread (i.e., standard deviation) around it. The majority of the observations
    in normal distribution lie around the mean and fade off as they distance away
    from the mean. Some 68% of the observations lie within 1 standard deviation from
    the mean; 95% of the observations lie within 2 standard deviations from the mean,
    whereas 99.7% of the observations lie within 3 standard deviations from the mean.
    A normal distribution with a mean of zero and a standard deviation of 1 is referred
    to as a standard normal distribution. Figure [1-12](#A432778_1_En_1_Chapter.html#Fig12)
    shows normal distribution along with confidence intervals.


    ![A432778_1_En_1_Fig12_HTML.gif](A432778_1_En_1_Fig12_HTML.gif)


    **Figure 1-12.** Normal distribution and confidence levels


    These are the most common confidence levels:


    | Confidence level | Formula |

    | --- | --- |

    | 68% | Mean ± 1 std. |

    | 95% | Mean ± 2 std. |

    | 99.7% | Mean ± 3 std. |


    #### Skewness


    Skewness is a measure of the lack of symmetry. The normal distribution shown previously
    is symmetric and thus has no element of skewness. Two types of skewness exist
    (i.e., positive and negative skewness).


    ![A432778_1_En_1_Fig13_HTML.gif](A432778_1_En_1_Fig13_HTML.gif)


    **Figure 1-13.** Skewed and symmetric normal distributions


    As seen from Figure [1-13](#A432778_1_En_1_Chapter.html#Fig13), a relationship
    exists among measure of centers for each one of the following variations:


    *   Symmetric distributions: Mean = Median = Mode

    *   Positively skewed: Mean < Median < Mode

    *   Negatively skewed: Mean > Median > Mode


    Going through Figure [1-12](#A432778_1_En_1_Chapter.html#Fig12) you will realize
    that the distribution in Figure [1-13(c)](#A432778_1_En_1_Chapter.html#Fig13)
    has a long tail on its right. This might be due to the presence of outliers.'
