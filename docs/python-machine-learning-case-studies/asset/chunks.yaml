  trans: "\n克莱尔决定通过列出每个实例的配对（即无相关、正相关和负相关）来扩展这些发现。她通过评估图 2-6 中的图表，并对照图 2-9 中的基准相关性来完成这一工作。如果存在趋势，则要么是负相关，要么是正相关。没有明确的趋势则表明不存在相关性。\n\
    \n![A432778_1_En_2_Fig9_HTML.gif](img/A432778_1_En_2_Fig9_HTML.gif)\n\n图 2-9.\n\
    \n正相关、负相关和无相关的图示\n\n*   正相关存在于\n    *   水泥成分与混凝土强度之间\n    *   减水剂与混凝土强度之间\n* \
    \  负相关存在于\n    *   粉煤灰与混凝土强度之间\n    *   水成分与混凝土强度之间\n    *   粗骨料与混凝土强度之间\n   \
    \ *   细骨料与混凝土强度之间\n*   无相关存在于\n    *   矿渣与混凝土强度之间\n    *   龄期与混凝土强度之间\n\n通过可视化表示识别出的这些配对让史密斯很容易理解什么是相关性。然而，他想验证这些发现在统计上是否也有意义。因此，克莱尔编写了代码片段，并在清单\
    \ 2-6 中计算了皮尔逊相关性。\n\n![A432778_1_En_2_Fig10_HTML.gif](img/A432778_1_En_2_Fig10_HTML.gif)\n\
    \n图 2-10.\n\n响应变量与解释变量之间的相关性\n\n```\npd.set_option('display.width', 100)\npd.set_option('precision',\
    \ 3)\ncorrelations = data.corr(method='pearson')\nprint(correlations)\n清单 2-6.\n\
    计算成对皮尔逊相关性\n```\n\n克莱尔回忆起用以下话语解释这些发现：\n\n> 图 2-10 中的输出显示了一个网格，其中计算了数据集中所有特征之间的皮尔逊相关性，而不仅限于我们之前在\
    \ 2-8 中看到的解释变量与响应变量之间的相关性。强正相关的值为 1，强负相关的值为 -1，0 表示无相关。通过查看图 2-8 中的散点图，我们曾假设龄期与混凝土强度之间不存在相关性；然而，图\
    \ 2-10 中的统计结果却给出了相反的结论；也就是说，这两个量之间存在轻微的正相关。视觉推断容易受到人为误差的影响，因此我们将采用后者（即这两个量之间存在轻微的正相关）。\n\
    \n史密斯了解了每个解释变量如何与响应变量相关后，好奇地想探究数据集中是否存在单一共线性或多重共线性。这正是克莱尔清单上的下一项任务，因此她编写了清单 2-7\
    \ 中的代码。\n\n![A432778_1_En_2_Fig11_HTML.gif](img/A432778_1_En_2_Fig11_HTML.gif)\n\
    \n图 2-11.\n\n数据集中所有特征的配对图\n\n```\ndata_ = data[(data.T != 0).any()]\nseaborn.pairplot(data_,\
    \ vars=data.columns, kind='reg')\nplt.show()\n清单 2-7.\n计算所有特征之间的配对图\n```\n\n克莱尔决定先向史密斯解释清单\
    \ 2-7 中代码的含义。她指出了图 2-8 中显而易见的一个方面（即数据集中某些特征的值大部分为 0）。她认为，数据集中存在大量 0 值会导致相关系数和回归线无法真实反映数据集的本质。她首先解释说，`data_=\
    \ data[(data.T != 0).any()]` 意味着删除列中值为 0 的记录。完成此操作后，她使用 seaborn 的配对图来绘制数据集中所有特征之间的相关性。\n\
    \n在解释图 2-11 的输出时，克莱尔让史密斯重点关注第 1 列和第 2 行。克莱尔回忆起自己曾解释过：“在许多情况下，特征对之间不存在相关性。例外情况有两种——即水泥成分与矿渣，以及水泥成分与粉煤灰——在这两种情况下，我们可以看到强负相关。”\n\
    \n史密斯对自己目前获得的见解感到兴奋。他看到了从观测值中移除零值后图表的样子。他好奇地想确定从数据集中移除零值后相关系数会是什么样子。此外，他知道这些特征之间存在斯皮尔曼相关性，因此他好奇地想看看在给定情况下它会呈现什么样的相关系数。最后，在查看图\
    \ 2-8 时，史密斯似乎觉得所有特征都是连续的，除了龄期，在他看来，龄期看起来像一个离散变量，因为龄期内的观测值落在七个离散值之一中。史密斯有兴趣将数据按龄期分段，并计算每个分段的相关系数，以查看响应变量与任何解释变量之间是否存在强相关性。你能帮助史密斯回答这些问题吗？在以下练习中尝试一下。\n\
    \n练习\n\n1.  从数据特征中移除零值，然后重新计算皮尔逊相关性。相关系数是否有任何改善？\n2.  确定数据集中特征的斯皮尔曼相关性。这是否给相关性分数带来了任何边际差异？\n\
    3.  从散点图来看，龄期似乎更像一个离散特征。逐个提取每个龄期的数据，并计算其余特征的皮尔逊相关性。是否有某个特定龄期在响应变量与解释变量之间产生了良好的相关性？\n\
    \n现在，克莱尔和史密斯已经了解了那些对混凝土强度有显著影响的解释变量，并且知道了多重共线性可能存在于何处，是时候将回归付诸实践了。他们需要回归来得出一个方程，该方程能够使他们无需采购特殊设备来测量混凝土强度。然而，在继续使用回归模型之前，克莱尔觉得她需要让史密斯了解过拟合和欠拟合这两个重要概念。\n"
- fmt: "# Overfitting and Underfitting\n\nOverfitting refers to the phenomenon where\
    \ a model is highly fitted on a dataset. This generalization thus deprives the\
    \ model from making highly accurate predictions about unseen data. Overfitting\
    \ is shown by the non-linear line in Figure [2-12](#A432778_1_En_2_Chapter.html#Fig12).\n\
    \n![A432778_1_En_2_Fig12_HTML.gif](A432778_1_En_2_Fig12_HTML.gif)\n\nFigure 2-12.\
    \ Illustration of overfitting\n\nThe following methodologies can be used to curb\
    \ overfitting:\n\n- Make models simple; that is, tune as many minimum parameters\
    \ as possible, because the more complex they are, the more they will overfit the\
    \ data at hand.\n- Perform cross-validation. For example, randomly choose `x%`\
    \ of the data values for train and the remaining `y%` for test. Fit the model\
    \ on the train data, use it to predict values on the test data, and compute the\
    \ test error. Repeat this exercise again `n` times. Each of the times the train/test\
    \ split will be done randomly. Compute the average of all test errors to find\
    \ out the real test error of the model at hand.\n\nUnderfitting is a phenomenon\
    \ where the model is not trained with high precision on data at hand.\n\nThe treatment\
    \ of underfitting is subject to bias and variance. A model will have a high bias\
    \ if both train and test errors are high, as shown in Figure [2-13](#A432778_1_En_2_Chapter.html#Fig13).\n\
    \n![A432778_1_En_2_Fig13_HTML.gif](A432778_1_En_2_Fig13_HTML.gif)\n\nFigure 2-13.\
    \ Illustration of high bias\n\nMoreover, a model will have a high variance if\
    \ there is a large gap between test and train errors, as shown in Figure [2-14](#A432778_1_En_2_Chapter.html#Fig14).\n\
    \n![A432778_1_En_2_Fig14_HTML.gif](A432778_1_En_2_Fig14_HTML.gif)\n\nFigure 2-14.\
    \ Illustration of high variance\n\nIf a model has a high bias type underfitting,\
    \ then the remedy can be to increase the model complexity, and if a model is suffering\
    \ from high variance type underfitting, then the cure can be to bring in more\
    \ data or otherwise make the model less complex.\n\nClaire decided to randomly\
    \ divide the data into a train/test split to validate the accuracy of the model\
    \ and perform cross-validation in cases of overfitting (Listing [2-8](#A432778_1_En_2_Chapter.html#Par138)).\n\
    \n```\ndef split_train_test(data, feature, train_index=0.7):\n    train, test\
    \ = train_test_split(data, test_size = 1-train_index)\n    if type(feature) ==\
    \ list:\n        x_train = train[feature].as_matrix()\n        y_train = train['concrete_strength'].as_matrix()\n\
    \        x_test = test[feature].as_matrix()\n        y_test = test['concrete_strength'].as_matrix()\n\
    \    else:\n        x_train = [[x] for x in list(train[feature])]\n        y_train\
    \ = [[x] for x in list(train['concrete_strength'])]\n        x_test = [[x] for\
    \ x in list(test[feature])]\n        y_test = [[x] for x in list(test['concrete_strength'])]\n\
    \    return x_train, y_train, x_test, y_test\n```\n\nListing 2-8. Splitting the\
    \ Data in Training and Testing sets\n\nClaire explained the code in Listing [2-8](#A432778_1_En_2_Chapter.html#Par138)\
    \ to Smith as follows: “In the code above, we are performing a 0.7-0.3 split.\
    \ This means that 70% of the observations in the data form the training dataset\
    \ on which the data is fitted on, while 30% of it comprises the test dataset on\
    \ which the model will be evaluated.”\n\nClaire pointed out that underfitting\
    \ and overfitting are something that can be detected from the output of a model\
    \ when first applied. In order to determine the best methodology to eradicate\
    \ underfitting and overfitting, you have to go through multiple iterations of\
    \ modeling until you land on a model which is free from both of these. Hence,\
    \ this is an ongoing exercise and should be done whenever any model (regression,\
    \ classification, etc.) is applied to the data.\n\nSmith was curious to see whether\
    \ some techniques exist to evaluate the accuracy of a regression model once applied\
    \ to a dataset. Claire’s answer was affirmative, and hence she compiled the next\
    \ section for that purpose.\n\n# Regression Metrics of Evaluation\n\n`Sklearn.metrics`\
    \ is a great tool in determining the performance of a regression model. It does\
    \ this by implementing several utility functions, scores, and losses. These usually\
    \ give a single output; however, they have been enhanced to generate multiple\
    \ outputs as well, most notably, mean absolute error, R² score, mean squared error,\
    \ and explained variance score.\n\nClaire came up with a brief list of the most\
    \ commonly used evaluation methods for regression.\n\n## Explained Variance Score\n\
    \nThis score defines the proportion of variance in population explained by the\
    \ best fit regression model. The best score for this metric is 1. Explained variance\
    \ score is mathematically defined as follows:\n\n- Formula: ![$$ explaine{d}_{variance}\\\
    left(y,\\widehat{y}\\right)=1-\\frac{Var\\left\\{y-\\widehat{y}\\right\\}}{Var\\\
    left\\{y\\right\\}} $$](A432778_1_En_2_Chapter_IEq4.gif)\n- Where:\n  - `yˆ`:\
    \ Estimated target output\n  - `y`: Corresponding (correct) target output\n  -\
    \ `Var`: Variance\n\n## Mean Absolute Error\n\nMean absolute error (MAE) is the\
    \ mean of residuals (i.e., difference between the estimated target and actual\
    \ target outcomes). Alternative formulations of this measure may include relative\
    \ frequencies as the weight factors. MAE works on the same scale (i.e., unit)\
    \ on which the data is measured. Hence the limitation is that there is no possibility\
    \ of making comparisons between series using different scales/units. This can\
    \ be mathematically defined by the following:\n\n- Formula: ![$$ {\\displaystyle\
    \ \\begin{array}{c}\\hfill {y}_i-{\\widehat{y}}_i\\vee \\hfill \\\\ {}\\hfill\
    \ MAE\\left(y,\\widehat{y}\\right)=\\frac{1}{n_{samples}}{\\sum}_{1=0}^{n_{samples}-1}\\\
    hfill \\end{array}} $$](A432778_1_En_2_Chapter_IEq5.gif)\n- Where:\n  - `yˆ[i]`:\
    \ Estimated target output\n  - `y[i]`: Corresponding (correct) target output\n\
    \  - `n[samples]`: Number of samples\n\n## Mean Squared Error\n\nMean squared\
    \ error (MSE) is similar to MAE, except that now the square of residual is taken\
    \ instead of taking the absolute difference among the estimated target output\
    \ and corresponding actual target output. The value is always positive and values\
    \ closer to 0 are better. Taking the square root of MSE will yield root mean square\
    \ deviation (RMSE) which holds the same units as that of the target output. The\
    \ mathematical definition of MSE is as follows:\n\n- Formula: ![$$ MSE\\left(y,\\\
    widehat{y}\\right)=\\frac{1}{n_{samples}}{\\sum}_{1=0}^{n_{samples}-1}{\\left({y}_i-{\\\
    widehat{y}}_i\\right)}^2 $$](A432778_1_En_2_Chapter_IEq6.gif)\n- Where:\n  - `yˆ[i]`:\
    \ Estimated target output of `i^(th)` sample\n  - `y[i]`: Corresponding (correct)\
    \ target output\n  - `n[samples]`: Number of samples\n\n## R²\n\nR², also referred\
    \ to as the coefficient of determination, defines the measure of how many future\
    \ samples are likely to be predicted by the regression model. Moreover, it also\
    \ signifies the proportion of variance in response variable that is predictable\
    \ from the exploratory ones. Value ranges from 1 to minus infinity where 1 is\
    \ the most optimum. The mathematical representation is as follows:\n\n- Formula:\
    \ ![$$ {R}^2\\left(y,\\widehat{y}\\right)=1-\\frac{{\\displaystyle {\\sum}_{1=0}^{n_{samples}-1}}{\\\
    left({y}_i-{\\widehat{y}}_i\\right)}^2}{{\\displaystyle {\\sum}_{1=0}^{n_{samples}-1}}{\\\
    left({y}_i-\\acute{y}\\right)}^2} $$](A432778_1_En_2_Chapter_IEq7.gif)\n- Formula:\
    \ ![$$ {r}^2=\\frac{varianceofpredictedvalues\\widehat{y}}{varianceofobservedvaluesy}\
    \ $$](A432778_1_En_2_Chapter_IEq8.gif)\n- Example:\n  - `R = -0.7`\n  - `R² =\
    \ 0.49` (i.e., half the variation is accounted for by linear relationship)\n-\
    \ Where:\n  - `yˆ[i]`: Estimated target output of `i^(th)` sample\n  - `y[i]`:\
    \ Corresponding (correct) target output\n  - ![$$ \\widehat{y}=\\frac{1}{n_{samples}}\\\
    ;{\\displaystyle \\sum_{1=0}^{n_{samples}-1}{y}_i} $$](A432778_1_En_2_Chapter_Equc.gif)\n\
    \  - `n[samples]`: Number of samples\n\n## Residual\n\n- Formula: Residual = observed\
    \ `y` – predicted `y` OR ( ![$$ y-\\widehat{y} $$](A432778_1_En_2_Chapter_IEq9.gif)\
    \ )\n- Mean of least squares residuals is always 0"
  raw: "## Overfitting and Underfitting\n\nOverfitting refers to the phenomenon where\
    \ a model is highly fitted on a dataset. This generalization thus deprives the\
    \ model from making highly accurate predictions about unseen data. Overfitting\
    \ is shown by the non-linear line in Figure [2-12](#A432778_1_En_2_Chapter.html#Fig12).\n\
    \n![A432778_1_En_2_Fig12_HTML.gif](A432778_1_En_2_Fig12_HTML.gif)\n\nFigure 2-12.\n\
    \nIllustration of overfitting\n\nThe following methodologies can be used to curb\
    \ overfitting:\n\n*   Make models simple; that is, tune as many minimum parameters\
    \ as possible, because the more complex they are, the more they will overfit the\
    \ data at hand.\n*   Perform cross-validation. For example, randomly choose x%\
    \ of the data values for train and the remaining y% for test. Fit the model on\
    \ the train data, use it to predict values on the test data, and compute the test\
    \ error. Repeat this exercise again n times. Each of the times the train/test\
    \ split will be done randomly. Compute the average of all test errors to find\
    \ out the real test error of the model at hand.\n\nUnderfitting is a phenomenon\
    \ where the model is not trained with high precision on data at hand.\n\nThe treatment\
    \ of underfitting is subject to bias and variance. A model will have a high bias\
    \ if both train and test errors are high , as shown in Figure [2-13](#A432778_1_En_2_Chapter.html#Fig13).\n\
    \n![A432778_1_En_2_Fig13_HTML.gif](A432778_1_En_2_Fig13_HTML.gif)\n\nFigure 2-13.\n\
    \nIllustration of high bias\n\nMoreover, a model will have a high variance if\
    \ there is a large gap between test and train errors, as shown in Figure [2-14](#A432778_1_En_2_Chapter.html#Fig14).\n\
    \n![A432778_1_En_2_Fig14_HTML.gif](A432778_1_En_2_Fig14_HTML.gif)\n\nFigure 2-14.\n\
    \nIllustration of high variance\n\nIf a model has a high bias type underfitting,\
    \ then the remedy can be to increase the model complexity, and if a model is suffering\
    \ from high variance type underfitting, then the cure can be to bring in more\
    \ data or otherwise make the model less complex.\n\nClaire decided to randomly\
    \ divide the data into a train/test split to validate the accuracy of the model\
    \ and perform cross-validation in cases of overfitting (Listing [2-8](#A432778_1_En_2_Chapter.html#Par138)).\n\
    \n```\ndef split_train_test(data, feature, train_index=0.7):\ntrain, test = train_test_split(data,\
    \ test_size = 1-train_index)\nif type(feature) == list:\nx_train = train[feature].as_matrix()\n\
    y_train = train['concrete_strength'].as_matrix()\nx_test = test[feature].as_matrix()\n\
    y_test = test['concrete_strength'].as_matrix()\nelse:\nx_train = [[x] for x in\
    \ list(train[feature])]\ny_train = [[x] for x in list(train['concrete_strength'])]\n\
    x_test = [[x] for x in list(test[feature])]\ny_test = [[x] for x in list(test['concrete_strength'])]\n\
    return x_train, y_train, x_test, y_test\nListing 2-8.\nSplitting the Data in Training\
    \ and Testing sets\n```\n\nClaire explained the code in Listing [2-8](#A432778_1_En_2_Chapter.html#Par138)\
    \ to Smith as follows: “In the code above, we are performing a 0.7-0.3 split.\
    \ This means that 70% of the observations in the data form the training dataset\
    \ on which the data is fitted on, while 30% of it comprises the test dataset on\
    \ which the model will be evaluated .”\n\nClaire pointed out that underfitting\
    \ and overfitting are something that can be detected from the output of a model\
    \ when first applied. In order to determine the best methodology to eradicate\
    \ underfitting and overfitting, you have to go through multiple iterations of\
    \ modeling until you land on a model which is free from both of these. Hence,\
    \ this is an ongoing exercise and should be done whenever any model (regression,\
    \ classification, etc.) is applied to the data.\n\nSmith was curious to see whether\
    \ some techniques exist to evaluate the accuracy of a regression model once applied\
    \ to a dataset. Claire’s answer was affirmative, and hence she compiled the next\
    \ section for that purpose.\n\n## Regression Metrics of Evaluation\n\nSklearn.metrics\
    \ is a great tool in determining the performance of a regression model. It does\
    \ this by implementing several utility functions, scores, and losses. These usually\
    \ give a single output; however, they have been enhanced to generate multiple\
    \ outputs as well, most notably, mean absolute error, R² score, mean squared error,\
    \ and explained variance score.\n\nClaire came up with a brief list of the most\
    \ commonly used evaluation methods for regression.\n\n### Explained Variance Score\n\
    \nThis score defines the proportion of variance in population explained by the\
    \ best fit regression model. The best score for this metric is 1. Explained variance\
    \ score is mathematically defined as follows:\n\n*   Formula: ![$$ explaine{d}_{variance}\\\
    left(y,\\widehat{y}\\right)=1-\\frac{Var\\left\\{y-\\widehat{y}\\right\\}}{Var\\\
    left\\{y\\right\\}} $$](A432778_1_En_2_Chapter_IEq4.gif)\n*   Where:\n    *  \
    \ yˆ: Estimated target output\n    *   y: Corresponding (correct) target output\n\
    \    *   Var: Variance\n\n### Mean Absolute Error\n\nMean absolute error (MAE\
    \ ) is the mean of residuals (i.e., difference between the estimated target and\
    \ actual target outcomes). Alternative formulations of this measure may include\
    \ relative frequencies as the weight factors. MAE works on the same scale (i.e.,\
    \ unit) on which the data is measured. Hence the limitation is that there is no\
    \ possibility of making comparisons between series using different scales/units.\
    \ This can be mathematically defined by the following:\n\n*   Formula: ![$$ {\\\
    displaystyle \\begin{array}{c}\\hfill {y}_i-{\\widehat{y}}_i\\vee \\hfill \\\\\
    \ {}\\hfill MAE\\left(y,\\widehat{y}\\right)=\\frac{1}{n_{samples}}{\\sum}_{1=0}^{n_{samples}-1}\\\
    hfill \\end{array}} $$](A432778_1_En_2_Chapter_IEq5.gif)\n*   Where:\n    *  \
    \ yˆ [i] : Estimated target output\n    *   y [i] : Corresponding (correct) target\
    \ output\n    *   n [samples] : Number of samples\n\n### Mean Squared Error\n\n\
    Mean squared error (MSE ) is similar to MAE, except that now the square of residual\
    \ is taken instead of taking the absolute difference among the estimated target\
    \ output and corresponding actual target output. The value is always positive\
    \ and values closer to 0 are better. Taking the square root of MSE will yield\
    \ root mean square deviation (RMSE) which holds the same units as that of the\
    \ target output. The mathematical definition of MSE is as follows:\n\n*   Formula:\
    \ ![$$ MSE\\left(y,\\widehat{y}\\right)=\\frac{1}{n_{samples}}{\\sum}_{1=0}^{n_{samples}-1}{\\\
    left({y}_i-{\\widehat{y}}_i\\right)}^2 $$](A432778_1_En_2_Chapter_IEq6.gif)\n\
    *   Where:\n    *   yˆ [i] : Estimated target output of i^(th) sample\n    * \
    \  y [i] : Corresponding (correct) target output\n    *   n [samples] : Number\
    \ of samples\n\n### R²\n\nR² , also referred to as the coefficient of determination,\
    \ defines the measure of how many future samples are likely to be predicted by\
    \ the regression model. Moreover, it also signifies the proportion of variance\
    \ in response variable that is predictable from the exploratory ones. Value ranges\
    \ from 1 to minus infinity where 1 is the most optimum. The mathematical representation\
    \ is as follows:\n\n*   Formula: ![$$ {R}^2\\left(y,\\widehat{y}\\right)=1-\\\
    frac{{\\displaystyle {\\sum}_{1=0}^{n_{samples}-1}}{\\left({y}_i-{\\widehat{y}}_i\\\
    right)}^2}{{\\displaystyle {\\sum}_{1=0}^{n_{samples}-1}}{\\left({y}_i-\\acute{y}\\\
    right)}^2} $$](A432778_1_En_2_Chapter_IEq7.gif)\n*   Formula: ![$$ {r}^2=\\frac{varianceofpredictedvalues\\\
    widehat{y}}{varianceofobservedvaluesy} $$](A432778_1_En_2_Chapter_IEq8.gif)\n\
    *   Example:\n    *   R = -0.7\n    *   R ² = 0.49 (i.e., half the variation is\
    \ accounted for by linear relationship)\n*   Where:\n    *   yˆ [i] : Estimated\
    \ target output of i^(th) sample\n    *   y [i] : Corresponding (correct) target\
    \ output\n    *   ![$$ \\widehat{y}=\\frac{1}{n_{samples}}\\;{\\displaystyle \\\
    sum_{1=0}^{n_{samples}-1}{y}_i} $$](A432778_1_En_2_Chapter_Equc.gif)\n\n    *\
    \   n [samples] : Number of samples\n\n### Residual\n\n*   Formula: Residual =\
    \ observed y – predicted y OR ( ![$$ y-\\widehat{y} $$](A432778_1_En_2_Chapter_IEq9.gif)\
    \ )\n*   Mean of least squares residuals is always 0"
  trans: "\n## 过拟合与欠拟合\n\n过拟合是指模型在某个数据集上过度拟合的现象。这种泛化能力因此导致模型无法对未见数据做出高度准确的预测。图 2-12\
    \ 中的非线性曲线展示了过拟合。\n\n![A432778_1_En_2_Fig12_HTML.gif](img/A432778_1_En_2_Fig12_HTML.gif)\n\
    \n图 2-12.\n\n过拟合示意图\n\n以下方法可用于抑制过拟合：\n\n*   简化模型；即尽可能调整最少的参数，因为模型越复杂，就越容易对当前数据过拟合。\n\
    *   执行交叉验证。例如，随机选择 x% 的数据值用于训练，剩余的 y% 用于测试。在训练数据上拟合模型，用它预测测试数据上的值，并计算测试误差。重复此过程\
    \ n 次。每次训练/测试的划分都是随机进行的。计算所有测试误差的平均值，以找出当前模型的真实测试误差。\n\n欠拟合是指模型对当前数据的训练精度不高的现象。\n\
    \n欠拟合的处理与偏差和方差有关。如果训练误差和测试误差都很高，则模型具有高偏差，如图 2-13 所示。\n\n![A432778_1_En_2_Fig13_HTML.gif](img/A432778_1_En_2_Fig13_HTML.gif)\n\
    \n图 2-13.\n\n高偏差示意图\n\n此外，如果测试误差和训练误差之间存在较大差距，则模型具有高方差，如图 2-14 所示。\n\n![A432778_1_En_2_Fig14_HTML.gif](img/A432778_1_En_2_Fig14_HTML.gif)\n\
    \n图 2-14.\n\n高方差示意图\n\n如果模型属于高偏差类型的欠拟合，那么补救措施可以是增加模型复杂度；如果模型属于高方差类型的欠拟合，那么补救措施可以是引入更多数据，或者降低模型复杂度。\n\
    \n克莱尔决定将数据随机划分为训练/测试集，以验证模型的准确性，并在出现过拟合时执行交叉验证（列表 2-8）。\n\n```\ndef split_train_test(data,\
    \ feature, train_index=0.7):\ntrain, test = train_test_split(data, test_size =\
    \ 1-train_index)\nif type(feature) == list:\nx_train = train[feature].as_matrix()\n\
    y_train = train['concrete_strength'].as_matrix()\nx_test = test[feature].as_matrix()\n\
    y_test = test['concrete_strength'].as_matrix()\nelse:\nx_train = [[x] for x in\
    \ list(train[feature])]\ny_train = [[x] for x in list(train['concrete_strength'])]\n\
    x_test = [[x] for x in list(test[feature])]\ny_test = [[x] for x in list(test['concrete_strength'])]\n\
    return x_train, y_train, x_test, y_test\n列表 2-8.\n将数据拆分为训练集和测试集\n```\n\n克莱尔向史密斯解释了列表\
    \ 2-8 中的代码：“在上面的代码中，我们执行了 0.7-0.3 的划分。这意味着数据中 70% 的观测值构成训练数据集，用于拟合数据；而 30% 的观测值构成测试数据集，用于评估模型。”\n\
    \n克莱尔指出，欠拟合和过拟合可以在模型首次应用时从其输出中检测出来。为了确定消除欠拟合和过拟合的最佳方法，你必须经历多次建模迭代，直到找到一个同时避免这两种情况的模型。因此，这是一项持续的工作，并且每当将任何模型（回归、分类等）应用于数据时都应执行。\n\
    \n史密斯很好奇，是否存在一些技术可以在回归模型应用于数据集后评估其准确性。克莱尔的回答是肯定的，因此她编写了下一节内容来介绍这一点。\n\n## 回归评估指标\n\
    \n`Sklearn.metrics` 是确定回归模型性能的绝佳工具。它通过实现多个实用函数、评分和损失函数来实现这一点。这些函数通常输出单个结果；然而，它们也已增强到可以生成多个输出，最值得注意的是平均绝对误差、R²\
    \ 分数、均方误差和解释方差分数。\n\n克莱尔整理了一份最常用的回归评估方法的简要列表。\n\n### 解释方差分数\n\n该分数定义了最佳拟合回归模型所解释的总体方差的比例。该指标的最佳分数是\
    \ 1。解释方差分数的数学定义如下：\n\n*   公式：![$$ explaine{d}_{variance}\\left(y,\\widehat{y}\\\
    right)=1-\\frac{Var\\left\\{y-\\widehat{y}\\right\\}}{Var\\left\\{y\\right\\}}\
    \ $$](img/A432778_1_En_2_Chapter_IEq4.gif)\n*   其中：\n    *   yˆ：估计的目标输出\n    *\
    \   y：对应的（正确的）目标输出\n    *   Var：方差\n\n### 平均绝对误差\n\n平均绝对误差（MAE）是残差（即估计目标与实际目标结果之间的差异）的平均值。该度量的其他形式可能包括将相对频率作为权重因子。MAE\
    \ 在测量数据的相同尺度（即单位）上工作。因此其局限性在于无法比较使用不同尺度/单位的序列。其数学定义如下：\n\n*   公式：![$$ {\\displaystyle\
    \ \\begin{array}{c}\\hfill {y}_i-{\\widehat{y}}_i\\vee \\hfill \\\\ {}\\hfill\
    \ MAE\\left(y,\\widehat{y}\\right)=\\frac{1}{n_{samples}}{\\sum}_{1=0}^{n_{samples}-1}\\\
    hfill \\end{array}} $$](img/A432778_1_En_2_Chapter_IEq5.gif)\n*   其中：\n    * \
    \  yˆ [i]：估计的目标输出\n    *   y [i]：对应的（正确的）目标输出\n    *   n [samples]：样本数量\n\n###\
    \ 均方误差\n\n均方误差（MSE）与 MAE 类似，区别在于它取的是残差的平方，而不是估计目标输出与对应实际目标输出之间的绝对差值。该值始终为正，且越接近\
    \ 0 越好。对 MSE 取平方根将得到均方根偏差（RMSE），其单位与目标输出相同。MSE 的数学定义如下：\n\n*   公式：![$$ MSE\\left(y,\\\
    widehat{y}\\right)=\\frac{1}{n_{samples}}{\\sum}_{1=0}^{n_{samples}-1}{\\left({y}_i-{\\\
    widehat{y}}_i\\right)}² $$](img/A432778_1_En_2_Chapter_IEq6.gif)\n*   其中：\n  \
    \  *   yˆ [i]：第 i 个样本的估计目标输出\n    *   y [i]：对应的（正确的）目标输出\n    *   n [samples]：样本数量\n\
    \n### R²\n\nR²，也称为决定系数，定义了回归模型可能预测出多少未来样本的度量。此外，它也表示了响应变量中可由解释变量预测的方差比例。其取值范围从\
    \ 1 到负无穷，其中 1 是最优值。其数学表示如下：\n\n*   公式：![$$ {R}²\\left(y,\\widehat{y}\\right)=1-\\\
    frac{{\\displaystyle {\\sum}_{1=0}^{n_{samples}-1}}{\\left({y}_i-{\\widehat{y}}_i\\\
    right)}²}{{\\displaystyle {\\sum}_{1=0}^{n_{samples}-1}}{\\left({y}_i-\\acute{y}\\\
    right)}²} $$](img/A432778_1_En_2_Chapter_IEq7.gif)\n*   公式：![$$ {r}²=\\frac{varianceofpredictedvalues\\\
    widehat{y}}{varianceofobservedvaluesy} $$](img/A432778_1_En_2_Chapter_IEq8.gif)\n\
    *   示例：\n    *   R = -0.7\n    *   R ² = 0.49（即一半的变异由线性关系解释）\n*   其中：\n    * \
    \  yˆ [i]：第 i 个样本的估计目标输出\n    *   y [i]：对应的（正确的）目标输出\n    *   ![$$ \\widehat{y}=\\\
    frac{1}{n_{samples}}\\;{\\displaystyle \\sum_{1=0}^{n_{samples}-1}{y}_i} $$](img/A432778_1_En_2_Chapter_Equc.gif)\n\
    \n    *   n [samples]：样本数量\n\n### 残差\n\n*   公式：残差 = 观测值 y – 预测值 y 或 ( ![$$ y-\\\
    widehat{y} $$](img/A432778_1_En_2_Chapter_IEq9.gif) )\n*   最小二乘残差的均值始终为 0\n"
- fmt: '### Residual Plot


    A residual plot is a scatter plot of regression residuals against exploratory
    variable `x` (i.e., independent). See Figure [2-15](#A432778_1_En_2_Chapter.html#Fig15).
    The least square regression line is pulled by and toward a point that is extreme
    in `x` direction with no other points near it. A dotted line represents the least
    square regression line.


    ![A432778_1_En_2_Fig15_HTML.gif](A432778_1_En_2_Fig15_HTML.gif)


    Figure 2-15. Residual plot


    ### Residual Sum of Squares


    The residual sum of squares (`RSS`) refers to amount of variance in data not captured
    by the best fit line of a regression model. The more minimal the `RSS`, the better
    the model is.


    For the sake of simplicity we will go forward with using `R²` as the metrics of
    cross-validation. Moreover, it seems to be a better choice considering that we
    are working for prediction, and this metric will help us determine where future
    samples will lie on the accuracy scale.


    Now having gone through the concepts of underfitting and overfitting and evaluation
    techniques of regression, Claire believed that it was time for her to test their
    mantle in finding a regression model which best fits the data at hand.


    ## Types of Regression


    Claire continued on by pointing out that `SKLearn` is the most common library
    for machine learning in Python. `SKLearn` offers a spectrum of algorithms for
    regression modeling. She came up with Figure [2-13](#A432778_1_En_2_Chapter.html#Fig13)
    from `SKLearn`’s web site as a reference to determine the regression algorithms
    which are usually the best given the size of our dataset.


    You can download the cheat sheet shown in Figure [2-16](#A432778_1_En_2_Chapter.html#Fig16)
    from [`http://scikit-learn.org/stable/tutorial/machine_learning_map/`](http://scikit-learn.org/stable/tutorial/machine_learning_map/).


    ![A432778_1_En_2_Fig16_HTML.jpg](A432778_1_En_2_Fig16_HTML.jpg)


    Figure 2-16. Cheat sheet of Regression-SKLearn


    Smith decided to give it a shot and try to identify the regression models suitable
    for the size of the current dataset. He recalled having said: “As in our case,
    the number of samples is less than 100K, hence the potential models are `Lasso`,
    `ElasticNet`, `SVR(kernel=''rbf'')`, `Ensemble Regressors`, `Ridge Regression`,
    and `SVR(kernel=''linear'')`.”


    Linear regression is the most basic of the regression models to start with, and
    hence Claire decided to start modeling from it.


    ### Linear Regression


    Smith already knew what a linear regression was, thanks to Claire (see Figure
    [2-2](#A432778_1_En_2_Chapter.html#Fig2)). Hence Claire decided to put it into
    the application to see how it performs, so she compiled the code in Listing [2-9](#A432778_1_En_2_Chapter.html#Par184).


    ![A432778_1_En_2_Fig17_HTML.gif](A432778_1_En_2_Fig17_HTML.gif)


    Figure 2-17. Single linear regression plots


    ```

    plt.figure(figsize=(15,7))

    plot_count = 1

    for feature in [''cement_component'', ''flay_ash'', ''water_component'', ''superplasticizer'',
    ''coarse_aggregate'']:

    data_tr = data[[''concrete_strength'', feature]]

    data_tr=data_tr[(data_tr.T != 0).all()]

    x_train, y_train, x_test, y_test = split_train_test(data_tr, feature)

    # Create linear regression object

    regr = LinearRegression()

    # Train the model using the training sets

    regr.fit(x_train, y_train)

    y_pred = regr.predict(x_test)

    # Plot outputs

    plt.subplot(2,3,plot_count)

    plt.scatter(x_test, y_test,  color=''black'')

    plt.plot(x_test, y_pred, color=''blue'',

    linewidth=3)

    plt.xlabel(feature.replace(''_'','' '').title())

    plt.ylabel(''Concrete strength'')

    print feature, r2_score(y_test, y_pred)

    plot_count+=1

    plt.show()

    ```


