    ## Applications of Clustering


    Applications of clustering are vibrant in several fields of study.


    ### Identifying Diseases


    ![A432778_1_En_4_Fig16_HTML.gif](A432778_1_En_4_Fig16_HTML.gif)


    Figure 4-16. Clusters obtained along with their confidence intervals while identifying
    diseases


    Clustering has recently caught the attention of those in the medical field. This
    is primarily due to the fact that unsupervised non-linear clustering algorithms
    have been relatively more effective in predicting cancerous diseases.


    ### Document Clustering in Search Engines


    Search engines use the input query of user as a parameter to cluster documents
    from the information retrieval system. The search results are thus in a sorted
    order of those clustered documents.


    ### Demographic-Based Customer Segmentation


    Clustering is also used in the field of marketing—more specifically, branding.
    Marketing research executives use clustering to find out customer segmentations
    and perceptual maps of their brand and that of their competitors. This way they
    find out the positioning of their brands and the customer segmentation they are
    catering to. This helps brands determine the customer personas to target, both
    existing and potential customers, and their demographics.


    Ross decided to conclude his journey by recalling how he had started off with
    the difference between supervised and unsupervised algorithms. He then transformed
    the data into a matrix to increase the dimensions of the data at hand. He looked
    at different methodologies for determining the optimal number of clusters. He
    learned how to make wordclouds to generate an intuitive sense of the clusters
    formed. Along the lines of the end objective, he used several techniques in search
    of the right one to divide the research papers into segments with disjoint characteristics.
    His plan was to market those segments by means of their related keywords for the
    upcoming conference this year. He selected the three components from the Bayesian
    Gaussian mixture model to fuel up his efforts for the upcoming conference next
    year.


    # 5. Classification


    This chapter aims to solve real-world problems that depend on a finite number
    of outcomes. These outcomes can be Boolean in nature, with only two choices (i.e.,
    True/False or Yes/No). They can also be nominal in nature (boat name on which
    a passenger will embark, maximum education attainment a group of students will
    have, etc.). Throughout this chapter we will be talking about supervised learning
    whereby labeled data will be used to train the model. Training the models on this
    data will enable label predictions on an unseen dataset (i.e., future predictions).
    In this chapter we will be talking about feature extraction and selection and
    will conclude with methods to evaluate classification accuracy.


    Note


    This book incorporates Python 2.7.11 as the de facto standard for coding examples.
    Moreover, you are required to install it for the Exercises.


    In this chapter we will be incorporating the Medical Appointment No-Shows dataset
    available to download from


    [`www.kaggle.com/joniarroba/noshowappointments`](http://www.kaggle.com/joniarroba/noshowappointments)'
