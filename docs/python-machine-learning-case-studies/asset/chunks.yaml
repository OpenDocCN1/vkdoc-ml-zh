    `n_components` 设置得比模型认为必要的值更大时，它就会表现出这种特性。变分贝叶斯混合模型会将某些混合权重值设置为接近零，从而让模型自动选择有效的成分。


    罗斯决定将贝叶斯高斯混合模型应用于数据矩阵。他将成分数量限制为五个。他很想看看贝叶斯高斯混合模型会认为多少个成分是最优的。


