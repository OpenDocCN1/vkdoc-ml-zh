    > At first we looped over the two features `gender` and `age`. For each of these
    features, we first split its column into category columns. For example, `gender`
    was split into `Male`, `Female`, and `Others`. Next we made category pairs and
    ran `t-statistics` on them. For example, `Male-Female`, `Male-Others`, etcetera.
    The results seem to be homogeneous across all categories. What do I mean by that?
    Well for all of the comparisons, the `p-values` in the output seem to be roughly
    0. If we go with a confidence interval of 95%, then it translates to a `p-value`
    of 0.05. None of the statistics above exceeds our set `p-value` benchmark. This
    leads us to the conclusion that we need to treat all of these categories separately
    when moving in the modeling aspect, as all of them have different variances.


    Nancy now knew her audience to a certain degree, but she wanted to know more,
    and for that purpose she planned on generating a question and doing sampling.
    Thus she asked Eric if he could enlighten her with a concept or two along those
    lines. Eric knew that central limit theorem has a pivotal value in sampling and
    analysis, so he came up with an illustration.


    ## Central Limit Theorem


    Consider as an example any distribution consisting of random samples with a well-defined
    mean and standard deviation. Now let’s pick some random samples from that distribution
    and calculate the mean and standard deviation. As you increase the sample size
    (i.e., `n`), the mean and standard deviation converge to that of a Gaussian normal
    distribution. In other words, as you increase sampling from an arbitrary distribution
    it converges to a normal distribution with a given mean and standard deviation.
    So how large should the sampling size be for the theorem to influence the behavior?


    *   The greater the sample size is, the more closely that sampling distribution
    will resemble the normal distribution.

    *   The more the arbitrary distribution resembles the normal distribution, the
    fewer samplings will be required to satisfy the theorem. Statisticians usually
    recommend a sample size of 30 to 40 in a scenario like this one.


    Eric decided to use the data at hand as an aid to explain central limit theorem
    (see Listing [1-28](#A432778_1_En_1_Chapter.html#Par274)).


    ![A432778_1_En_1_Fig20_HTML.gif](A432778_1_En_1_Fig20_HTML.gif)


    Figure 1-20. Distributions of daily tickets on different sample sizes


    ```

    daily_tickets = list(data.groupby(''starttime_date'').size())

    sample_tickets = []

    checkpoints = [1, 10, 100, 300, 500, 1000]

    plot_count = 1

    random.shuffle(daily_tickets)

    plt.figure(figsize=(15,7))

    binrange=np.array(np.linspace(0,700,101))

    for i in xrange(1000):

    if daily_tickets:

    sample_tickets.append(daily_tickets.pop())

    if i+1 in checkpoints or not daily_tickets:

    plt.subplot(2,3,plot_count)

    plt.hist(sample_tickets, binrange)

    plt.title(''n=%d'' % (i+1),fontsize=15)

    plot_count+=1

    if not daily_tickets:

    break

    plt.show()

    Listing 1-28. Script to Validate Central Limit Theorem on Trips Dataset

    ```


    Eric explained the code in Listing [1-28](#A432778_1_En_1_Chapter.html#Par274)
    as follows:


    > Random shuffling was done in order to change the order of daily number of tickets.
    Once done, then different sample sizes were fixed in order to see the change in
    distribution as a function of the sample size. Note in Figure [1-20](#A432778_1_En_1_Chapter.html#Fig20)
    that with the increase in sample size, the distribution seems to transform into
    a normal distribution. This validates the central limit theorem.


    ## Case Study Findings


    Eric and Nancy’s deductions helped them understand their audience to a better
    extent and garner valuables insights. The insights were rendered on data collected
    from 2014 to 2016 with demographic information only available for the members
    and not short-term pass holders. Hence, in order to get information about the
    short-term pass holders Nancy knew that she had to go through a market research
    exercise where central limit theorem would come in handy. Trip duration follows
    a definite seasonal pattern that repeats over time. Forecasting this time series
    can help Nancy predict the times when the company needs to push its marketing
    efforts and times when most trips anticipated can help ensure operational efficiencies.
    As for the promotions, Nancy now knew that the best station at which to kick off
    the campaign would be `Pier 69/Alaskan Way & Clay St`. Outliers were a tiny portion
    of the dataset; however, their time series nature meant that those outliers couldn’t
    be removed and transformation was thus applied. Regarding further analysis, Nancy
    was now aware that as the features are not homogeneous, the analysis would have
    to be done on the individual category level.


    Nancy wasn’t sure if the techniques they applied were obsolete or have applications
    in real world applications as well. Hence Eric compiled the following list of
    applications that his friends from the industry use to bring Statistics and Probability
    into live.


    ## Applications of Statistics and Probability


    Applications of statistics and probability are vibrant in several fields of study.


    ### Actuarial Science


    Actuaries use the concepts of mathematics, probability theory, statistics, finance,
    economics, computer science, and modeling to evaluate and price risks. Their application
    cases exist in the domains of insurance, consulting firms, and government.'
