    \ ACF and PACF of the log transformed differencing applied time series to determine\
    \ the rule it best matches.\n\n![A432778_1_En_3_Fig17_HTML.gif](A432778_1_En_3_Fig17_HTML.gif)\n\
    \nFigure 3-17. ACF and PACF plots for `p = 1` and `q = 1`\n\n- **Rule 1**: `p\
    \ = 1` when ACF shows exponential decay, and PACF has a spike at lag 1 with no\
    \ correlation further on (See Figure [3-13](#A432778_1_En_3_Chapter.html#Fig13)).\n\
    \n  ![A432778_1_En_3_Fig13_HTML.gif](A432778_1_En_3_Fig13_HTML.gif)\n\n  Figure\
    \ 3-13. ACF and PACF plots for `p = 1`\n\n- **Rule 2**: `p = 2`, when ACF shows\
    \ a set of exponential decays or sine wave-shaped pattern, and PACF has spikes\
    \ at lags 1 and 2, with no correlation further on (See Figure [3-14](#A432778_1_En_3_Chapter.html#Fig14)).\n\
    \n  ![A432778_1_En_3_Fig14_HTML.gif](A432778_1_En_3_Fig14_HTML.gif)\n\n  Figure\
    \ 3-14. ACF and PACF plots for `p = 2`\n\n- **Rule 3**: `q = 1` when ACF has a\
    \ spike at lag 1 with no correlation further on, and PACF shows exponential decay\
    \ (See Figure [3-15](#A432778_1_En_3_Chapter.html#Fig15)).\n\n  ![A432778_1_En_3_Fig15_HTML.gif](A432778_1_En_3_Fig15_HTML.gif)\n\
    \n  Figure 3-15. ACF and PACF plots for `q = 1`\n\n- **Rule 4**: `q = 2`, when\
    \ ACF has spikes at lags 1 and 2, with no correlation further on, and PACF shows\
    \ a set of exponential decays or sine wave-shaped pattern (See Figure [3-16](#A432778_1_En_3_Chapter.html#Fig16)).\n\
    \n  ![A432778_1_En_3_Fig16_HTML.gif](A432778_1_En_3_Fig16_HTML.gif)\n\n  Figure\
    \ 3-16. ACF and PACF plots for `q = 2`\n\n- **Rule 5**: `p = 1`, `q = 1` when\
    \ both ACF and PACF show exponential decay starting at a lag of 1 (See Figure\
    \ [3-17](#A432778_1_En_3_Chapter.html#Fig17)).\n\nLooking at Figure [3-12](#A432778_1_En_3_Chapter.html#Fig12),\
    \ David wasn’t sure which of the rules satisfied the ACF and PACF patterns obvious\
    \ in the correlograms. Both ACF and PACF had a spike at 1 with no correlation\
    \ in the proceeding lags. He didn’t find this behavior being covered by any of\
    \ the rules, and thus he decided to leave to accuracy the values of `p`, `d`,\
    \ and `q` he would choose for the models. Having gone through the evaluation methods\
    \ for time series and having gone through the rules for selecting the parameter\
    \ values, David knew that the time had come to apply the time series models to\
    \ the differencing applied log transformed time series. His search of time series\
    \ models brought him to the effectiveness that ARIMA models displayed in various\
    \ time series applications. Hence he started off with understanding ARIMA.\n\n\
    ## Auto-Regressive Integrated Moving Averages\n\nARIMA stands for auto-regressive\
    \ integrated moving averages. ARIMA forecasting revolves around a linear equation\
    \ whose behavior is dependent upon the values of `p`, `d`, and `q`. In other words,\
    \ the ARIMA model filters signal from noise and forecasts it for future point\
    \ in time. An ARIMA model is defined as `ARIMA(p, d, q)`.\n\nThis section discusses\
    \ some of the variants of an ARIMA model.\n\n### Auto-Regressive Moving Averages\n\
    \nThe ARMA (auto-regressive moving averages) model is similar to an ARIMA model\
    \ except that now we use `p` and `q` to determine the linear equation. Moreover,\
    \ now the prediction is done on a mean adjusted series; that is, a time series\
    \ is transformed to a zero mean variant by subtracting the sample mean from it.\n\
    \nThis phenomenon can be defined by the following equation:\n\n`y[t] = Y[t] –\
    \ Ý, t = 1, …N`\n\nWhere:\n\n- `Y[t]`: Original time series\n- `Ý`: Mean adjusted\
    \ time series\n\nARMA model is defined as `ARMA(p, q)`.\n\n### Auto-Regressive\n\
    \nAn ARMA model forecasts a time series from a linear function of its past values.\
    \ Time lag is defined in the AR (auto-regressive) model to forecast the future\
    \ values of a time series. An AR model can be defined by the following equation:\n\
    \n`y[t] = β[0] + β[1] y[t−1] + ϵ[t]`\n\nWhere:\n\n- `β[0]`, `β[1]`: Beta coefficients\n\
    - `y[t-1]`: Lagged version of the time series\n- `ϵ[t]`: Residuals, which are\
    \ assumed to be normally distributed and random in time\n\nAn AR model is defined\
    \ as `AR(p, d)`.\n\nDavid decided to apply the AR model on differencing applied\
    \ log transformed time series. He knew that because this technique does not have\
    \ the term `q`, its value will be 0 (i.e., `q = 0`). He decided to apply AR with\
    \ the arbitrary term of `p = 2` and `d = 1` in Listing [3-18](#A432778_1_En_3_Chapter.html#Par161).\n\
    \n![A432778_1_En_3_Fig18_HTML.gif](A432778_1_En_3_Fig18_HTML.gif)\n\nFigure 3-18.\
    \ Plotting MA model smoothing on log transformed differencing applied time series\n\
    \n```\nmodel = ARIMA(data_log, order=(2, 1, 0), dates=data_log.index.to_datetime())\n\
    results_AR_210 = model.fit(disp=-1)\nplt.plot(data_log_diff)\nplt.plot(results_AR_210.fittedvalues,\
    \ color='red')\nplt.title('RSS: %.4f'% sum((results_AR_210.fittedvalues-data_log_diff)**2))\n\
    ```\n\nListing 3-18. Applying AR Model to Log Transformed Differencing Applied\
    \ Time Series\n\nDavid made sure to plot the original differencing applied and\
    \ log transformed time series along with the forecasted one using the AR technique\
    \ in Figure [3-18](#A432778_1_En_3_Chapter.html#Fig18). He was pleased to see\
    \ the RSS for this forecasted series approaching 0, which meant that the model\
    \ was fairly accurate in capturing the variance in the input series. The prediction\
    \ of Yahoo stock at that much of a negligible RSS was a big relief for him. He\
    \ then moved on to search for other techniques and that is when he discovered\
    \ the moving average technique.\n\n### Moving Average\n\nMA stands for moving\
    \ average model. MA is best for situations in which we have a univariate time\
    \ series object. MA forecasts future values by training itself on the current\
    \ and past values of a time series that are random in nature. The MA model is\
    \ defined as `MA(d, q)`.\n\nMA models don’t have the term `p`; hence David initialized\
    \ it as `p = 0`. David decided to apply the MA model to the log transformed differencing\
    \ applied time series, with a `q = 1` and `d = 1`.\n\n![A432778_1_En_3_Fig19_HTML.gif](A432778_1_En_3_Fig19_HTML.gif)\n\
    \nFigure 3-19. Plotting MA model smoothing on log transformed differencing applied\
    \ time series\n\n```\nmodel = ARIMA(data_log, order=(0, 1, 1), dates=data_log.index.to_datetime())\n\
    results_MA_011 = model.fit(disp=-1)\nplt.plot(data_log_diff)\nplt.plot(results_MA_011.fittedvalues,\
    \ color='red')\nplt.title('RSS: %.4f'% sum((results_MA_011.fittedvalues-data_log_diff)**2))\n\
    ```\n\nListing 3-19. Applying MA Model to Log Transformed Differencing Applied\
    \ Time Series\n\nDavid noticed no significant improvement in the RSS score after\
    \ applying MA to the differencing applied log transformed time series. He decided\
    \ to merge the AR and MA models in the hopes of seeing a more robust model for\
    \ predicting Yahoo stock."
