    查看图 5-4，朱迪博士注意到，与未发送提醒时相比，发送一次提醒后赴约患者数量的变化率约为 30%（即 (0.17 m – 0.13 m) / 0.13m），而发送一次提醒后未赴约患者数量的变化率约为
    25%（即 (0.05 m – 0.04 m) / 0.04m）。因此她得出结论，短信提醒确实能略微提高患者在预约日赴约的可能性。


    朱迪博士的观点是，大多数患者会在周中赴约，而许多患者会在周初或周末改变计划，不赴约。她认为这是因为周初和周末通常是企业最忙碌的时候，而工作压力在周中会有所缓解。她决定在清单
