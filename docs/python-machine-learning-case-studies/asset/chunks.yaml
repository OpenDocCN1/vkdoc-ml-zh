- fmt: "## Scaling Back the Forecast\n\nBefore scaling back the forecasts to the original\
    \ units, David thought it wise to print initial observations of the forecasted\
    \ time series.\n\n```\npredictions_ARIMA_diff = pd.Series(results_ARIMA_111.fittedvalues,\
    \ copy=True)\nprint predictions_ARIMA_diff.head()\n```\n\nOutput:\n\n```\n2016-01-05\
    \    0.000401\n2016-01-06    0.000237\n2016-01-07    0.001781\n2016-01-08    0.003630\n\
    2016-01-11    0.003035\ndtype: float64\n```\n\nThe output of Listing 3-21 provided\
    \ an interesting insight for David. Data loaded initially in Listing 3-2 had dates\
    \ starting from `2016-01-04` whereas dates in the output of Listing 3-2 were starting\
    \ from `2016-01-05`. After much thinking he found the answer to that. 'The parameter\
    \ `d`'—that is, the number of differences—had a value of 1 when forecasting was\
    \ done using the combined modeling. This induced a lag of 1, and thus the first\
    \ element didn’t have anything in the lagged version of itself to subtract from.\
    \ While conducting research on time series models, David had also read that the\
    \ output of these models gives absolute changes rather than cumulative sums at\
    \ each time interval. Going forward with absolute changes would have been a sound\
    \ strategy had the data been discrete. However, in a situation like this, where\
    \ the forecasted series will be a continuous distribution, cumulative sums were\
    \ the requirement. Hence David decided to convert these absolute changes to cumulative\
    \ sums for all time intervals in Listing 3-22.\n\n```\npredictions_ARIMA_diff_cumsum\
    \ = predictions_ARIMA_diff.cumsum()\nprint predictions_ARIMA_diff_cumsum.head()\n\
    ```\n\nOutput:\n\n```\n2016-01-05    0.000401\n2016-01-06    0.000638\n2016-01-07\
    \    0.002418\n2016-01-08    0.006049\n2016-01-11    0.009084\ndtype: float64\n\
    ```\n\nDavid knew that the model performed well in minimizing the residuals as\
    \ seen from the RSS score. However, he was also concerned with the quality of\
    \ the model, and hence he started looking for methods of measuring it. His search\
    \ concluded when he found Akaike Information Criterion (AIC) to test the quality\
    \ of a time series model. As per the explanation, the lower the score of AIC,\
    \ the better the quality of a time series model. Hence he put the forecasted time\
    \ series to the test in Listing 3-23.\n\n```\nprint results_ARIMA_111.aic\n```\n\
    \nOutput:\n\n```\n(-1234.0564146247877)\n```\n\nThe score from the output of Listing\
    \ 3-23 came out to be extremely low, thus proving the goodness of the model. Now\
    \ David’s plan of action was to scale back the forecasted series by reversing\
    \ the differencing and log transformation. He aimed to do so by taking the following\
    \ steps:\n\n- Remove differencing from the forecasted series.\n- Reverse the log\
    \ transformation by applying an exponent.\n- Evaluate the forecasted series by\
    \ calculating mean forecast error, mean absolute error, and root mean absolute\
    \ error.\n- Plot the original and forecasted series.\n\nDavid started off by concentrating\
    \ on removing differencing from the forecasted series. He planned to do that by\
    \ adding a base value to all observations of the forecasted series. He assumed\
    \ the first value of the log transformed time series to be the base value and\
    \ went forward with the implementation in Listing 3-24.\n\n```\npredictions_ARIMA_log\
    \ = pd.Series(data_log.ix[0], index=data_log.index)\npredictions_ARIMA_log = predictions_ARIMA_log.add(predictions_ARIMA_diff_cumsum,fill_value=0)\n\
    predictions_ARIMA_log.head()\n```\n\nOutput:\n\n```\n2016-01-04    7.607213\n\
    2016-01-05    7.607614\n2016-01-06    7.607850\n2016-01-07    7.609631\n2016-01-08\
    \    7.613261\ndtype: float64\n```\n\nThe next step was to remove log transformation\
    \ from the forecasted time series. Recalling his learnings from his Calculus 1\
    \ course in college he knew that the exponential acts as the inverse of log base\
    \ 10. In Listing 3-25 he planned to do that, and rate the forecasted series by\
    \ the aid of evaluation metrics.\n\n![A432778_1_En_3_Fig21_HTML.gif](A432778_1_En_3_Fig21_HTML.gif)\n\
    \nFigure 3-21. Plotting forecasted series vs. the original time series\n\n```\n\
    def mean_forecast_err(y, yhat):\n    return y.sub(yhat).mean()\ndef mean_absolute_err(y,\
    \ yhat):\n    return np.mean((np.abs(y.sub(yhat).mean()) / yhat)) # or percent\
    \ error = * 100\ndef rmse(y, yhat):\n    return np.sqrt(sum((yhat-y)**2)/len(y))\n\
    predictions_ARIMA = np.exp(predictions_ARIMA_log)\nplt.plot(data_train['Close_Adj'])\n\
    plt.plot(predictions_ARIMA)\nplt.title('RMSE: %.4f | MFE: %.4f | MAE: %.4f'% (\n\
    \    rmse(data_train['Close_Adj'], predictions_ARIMA), \n    mean_forecast_err(data_train['Close_Adj'],\
    \ predictions_ARIMA), \n    mean_absolute_err(data_train['Close_Adj'], predictions_ARIMA)))\n\
    ```\n\nIn Listing 3-24, David at first initialized a separate method for each\
    \ of the evaluation metrics. He then removed the log from the forecasted series.\
    \ In the end he validated the forecasted series by comparing it to the real one,\
    \ both statistically and graphically. The test statistics of RMSE, MFE, and MAE\
    \ revealed that this model had successfully forecasted correctly, which was good\
    \ news for David. Forecasted plot is represented by the green line, with the original\
    \ time series represented by a blue one. David was surprised to see in Figure\
    \ 3-21 that the forecasted time series resembled that of a linear regression line.\n\
    \nHence David decided to apply regression to the near to linear forecasted series\
    \ seen in Figure 3-21. He planned to train the regression line from the linear\
    \ forecasted series, predict for data from October to December 2016, and then\
    \ cross-validate it from the real values for that time period. He did so by writing\
    \ the code in Listing 3-26.\n\n```\nregr = LinearRegression()\nx_train = [[x]\
    \ for x in range(len(data_train))]\ny_train = [[y] for y in list(data_train['Close_Adj'])]\n\
    x_test = [[z] for z in range(x+1, x + 1+len(data_test))]\nregr.fit(x_train, y_train)\n\
    y_pred = regr.predict(x_test)\nexplained_variance_score(data_test['Close_Adj'],\
    \ y_pred)\nplt.scatter(range(len(data_test)), data_test['Close_Adj'],  color='black')\n\
    plt.plot(range(len(data_test)), y_pred, color='blue', linewidth=3)\nplt.ylabel('Concrete\
    \ strength')\n```\n\nOutput:\n\n![A432778_1_En_3_Fig22_HTML.gif](A432778_1_En_3_Fig22_HTML.gif)\n\
    \nFigure 3-22. Plotting forecasted series along with the predicted regression\
    \ line for Oct-Dec 2016\n\n```\n0.63472586609437109\n```\n\nDavid was happy to\
    \ see the regression line in Figure 3-22 fairly capture the trend within the dataset.\
    \ He performed model training on the forecasted time series and evaluated it against\
    \ the original time series of Yahoo stock. He also made sure to calculate the\
    \ explained variance score as well to see how much variance of the time series\
    \ is correctly captured by the best fit line. The value came out to be `0.63`,\
    \ which indicated that 63% of the variance within the time series was captured\
    \ by the linear regression line.\n\nGiven the results he had achieved within a\
    \ short time span, David was optimistic that he could achieve more if he had more\
    \ days to spare. However, he wants you to come on board and help him experiment\
    \ with different time series forecasting strategies. His rationale is that he\
    \ further wants to improve the accuracy of the forecasted series, as it is the\
