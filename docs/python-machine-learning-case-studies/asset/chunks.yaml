    鸢尾花数据集上的 SGD 分类结果


    该算法最适合处理以稀疏浮点值数组形式表示数据集中特征的数据。损失参数控制模型拟合的类型，默认情况下是线性支持向量机（SVM）。


    Judy 博士不再等待，编写了清单 5-28 中的代码片段，在训练数据集上训练核近似以及 SGD 分类器模型。


    ```

    rbf_feature = kernel_approximation.RBFSampler(gamma=1, random_state=1)

    X_train = rbf_feature.fit_transform(x_train)

    clf = SGDClassifier()

    clf.fit(X_train, y_train)

    清单 5-28.

