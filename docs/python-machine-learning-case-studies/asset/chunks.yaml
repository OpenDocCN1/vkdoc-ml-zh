    Judy 博士进行了一次富有成效的数据分析和分类冲刺。然而，由于会议在半小时后就要开始，她无法继续深入，只能展示到目前为止所获得的发现。除非你们中有人能尝试其他分类方法，否则她无法再增加更多发现。她心中有一些备选方案，并认真地将它们添加到了练习中。


    练习


    1.  重复梯度提升分类，但这次只考虑模型认为重要的特征。AUC 和 ROC 有改善吗？

    2.  对梯度提升应用网格搜索（参考第 4 章），以微调学习率、max_depth 等参数。

    3.  使用 PCA（参考第 4 章）转换数据，然后应用我们讨论过的所有模型，看看是否能获得改进。

    4.  最近，一种新型的提升方法 Xgboost 在数据科学家中很受欢迎。将其应用于我们的数据集，使用网格搜索进行优化，看看它的性能是否相对优于梯度提升。


    Judy 博士很好奇分类是否还有其他实际应用。为此，她查阅了互联网，并整理了一些迄今为止最引人注目的分类应用。


    ## 分类的应用


    多个研究领域都有大量的分类应用。


    ### 图像分类


    深度学习在预测图像中表示的对象方面有广泛应用。这有助于搜索引擎和 Instagram 等应用中的推荐引擎进行图像聚类。


    ### 音乐分类


    像 Pandora 这样的音乐应用会对音乐执行分类算法，以推荐符合你偏好的音乐。其美妙之处在于，你无需明确告诉 Pandora 你的偏好，因为它会自行学习。


    ### 电子邮件垃圾邮件过滤


    Gmail、Outlook、Ymail 等电子邮件服务已部署算法，用于将垃圾邮件与合法邮件进行分类。然后根据判定结果决定将哪些邮件丢入垃圾邮件文件夹。

