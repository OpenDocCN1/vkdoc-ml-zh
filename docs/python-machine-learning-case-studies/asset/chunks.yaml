    Dr. Judy was thrilled as exploratory data analysis provided her with many insights.
    Summing up, she observed that SMS reminders increased the likelihood of a patient
    showing up on time. She also noticed that younger patients more often did not
    show up at their appointment times whereas older patients were more disciplined
    and showed up on time. She also saw that people with long waiting times decided
    not to show up on their appointed date and times. Dr. Judy now had a fair idea
    that no-shows to appointment was the reason for losses, and she had gained insight
    into what leads people to exhibit this behavior. Now she was planning to move
    ahead and make a classification model to predict the likelihood of a patient to
    show up or not in the future. This was important because if she knew the total
    number of patients who would show up on a given day, week, or month, she could
    tune the resources likewise to save costs. However, before starting with this
    classification, she wondered whether she could extract more features out of the
    existing ones by means of features’ generation. She believed this would help her
    capture the variability and definite patterns within the dataset.


    ## Features’ Generation


    In machine learning, the greater the number of observations and feature sets within
    the dataset, the greater the likelihood that the model will capture the variability
    within it, to understand its true essence. Dr. Judy knew that increasing the number
    of observations was not an option; however, she could increase the feature sets
    within the dataset. Dr. Judy was clueless as to how she could extract more features
    from the existing features. After much thinking, she decided to break the features
    having dates into more granular date components. She wrote the code snippet in
    Listing [5-21](#A432778_1_En_5_Chapter.html#Par89) to apply her logic to features
    named `AppointmentRegistration` and `AppointmentDate`.


    ```

    for col in [''AppointmentRegistration'', ''ApointmentData'']:

    for index, component in enumerate([''year'', ''month'', ''day'']):

    data[''%s_%s''%(col, component)] = data[col].apply(lambda x: int(x.split(''T'')[0].split(''-'')[index]))

    ```

    Listing 5-21. Breaking Date Features into Date Components


    Dr. Judy explained that the code snippet in Listing [5-21](#A432778_1_En_5_Chapter.html#Par89)
    broke `AppointmentRegistration` and `AppointmentData` features into their respective
    year, month, and day components. However, it didn’t break them into their time
    components because `ApointmentData` doesn’t have a time component within its string
    object, whereas `AppointmentRegistration` feature does have it. Hence she wrote
    the code in Listing [5-22](#A432778_1_En_5_Chapter.html#Par91) to break the `AppointmentRegistration`
    feature into its time component as well.


    ```

    for index, component in enumerate([''hour'', ''min'', ''sec'']):

    data[''%s_%s''%(''AppointmentRegistration'', component)] = data[''AppointmentRegistration''].apply(

    lambda x: int(x.split(''T'')[1][:-1].split('':'')[index]))

    ```

    Listing 5-22. Breaking `AppointmentRegistration` into Time Components


