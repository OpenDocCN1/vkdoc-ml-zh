    为 712，这主要是因为所有大于上须边界的值并未被转换为清单 1-22 中计算的非异常值平均值。南希现在有兴趣了解这种转换后分布的中心度量情况。因此，埃里克给出了清单
    1-24 中的代码。


    ```

    print ''行程时长的平均值: %f''%data[''tripduration_mean''].mean()

    print ''行程时长的标准差: %f''%data[''tripduration_mean''].std()

    print ''行程时长的中位数: %f''%data[''tripduration_mean''].median()

    输出

    行程时长的平均值: 711.726573

    行程时长的标准差: 435.517297

    行程时长的中位数: 633.235000

