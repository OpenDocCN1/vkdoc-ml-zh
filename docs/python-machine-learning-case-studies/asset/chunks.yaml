    Test Statistic                  -3.273472

    p-value                         0.016107

    #Lags Used                      0.000000

    Number of Observations Used     188.000000

    Critical Value (5%)             -2.877040

    Critical Value (1%)             -3.465620

    Critical Value (10%)            -2.575032

    dtype: float64

    ```


    在查看图 3-8 时，David 注意到滚动均值比图 3-7 中的波动更大。因此，他对于使用探索性数据分析方法得出结论持中立态度。然而，迪基-富勒检验的检验统计量勉强超过了
    5% 的临界值。因此，检验统计量小于临界值意味着拒绝原假设。这使 David 得出结论：对数变换后的去除趋势时间序列对象已成功变为平稳性质。


    到目前为止，David 取得的唯一显著成功来自从对数变换后的时间序列中减去移动平均平滑估计的趋势。然而，在查看其探索性数据分析图时，他并不完全确信时间序列内部的平稳性质。根据他在图
    3-1 中的推论，时间序列对象同时包含趋势和季节性。他心想，如果减少趋势效果如此之好，那么从逻辑上讲，同时减少趋势和季节性应该效果更好。他开始寻找同时减少趋势和季节性的技术。没过多久，他就发现差分法可以完成这项工作。

    '
- fmt: '### Differencing


    Differencing subtracts the time series from a lagged version of itself (i.e.,
    observations at the previous instant). Differencing stabilizes the mean of a time
    series by removing changes in the level. David was confident that differencing,
    given its definition, would be the more effective in making the time series object
    stationary.


    He was expecting a closer-to-stationary time series subject. Hence he wrote the
    script in Listing [3-13](#A432778_1_En_3_Chapter.html#Par95) for his expectations
    to come true.


    ```

    data_log_diff = data_log - data_log.shift()

    data_log_diff.dropna(inplace=True)

    evaluate_stationarity(data_log_diff)

    Listing 3-13.

    Applying First-Order Differencing to the Log Version of the Time Series Object

    ```


    Output


    ![A432778_1_En_3_Fig9_HTML.gif](A432778_1_En_3_Fig9_HTML.gif)


    Figure 3-9.


    Statistics for the differencing applied time series


    ```

    Results of Dickey-Fuller Test:

    Test Statistic                  -1.038969e+01

    p-value                         2.036243e-18

    #Lags Used                      1.000000e+00

    Number of Observations Used     1.860000e+02

    Critical Value (5%)             -2.877208e+00

    Critical Value (1%)             -3.466005e+00

    Critical Value (10%)            -2.575122e+00

    dtype: float64

    ```


    David saw a remarkable improvement in Figure [3-9](#A432778_1_En_3_Chapter.html#Fig9)
    as the rolling mean and rolling standard deviation appear to be almost constant.
    The same was reflected by the Dickey-Fuller test as the test statistics came out
    to be much less than the 1% critical values. The seasonality and trend removed
    time series seems to be almost stationary in nature now. David had applied a first-order
    differencing; that is, a lag of 1 was induced while differencing. He was curious
    to find if a second- or third-order differencing can improve the stationary nature
    of the time series object. He invites you to collaborate on this by attempting
    the exercises.


    **Exercise**


    1.  Apply second- and third-order differencing to our log transformed series.
    Did it make the log transformed series stationary?


    David’s curious mind made him ponder if he could manage to remove seasonality
    and trend from the log transformed time series object as he had in trend estimation
    and removal earlier. Earlier he had applied two techniques to estimate the trend
    and removed that from the time series object to make it stationary in nature.
    He started looking for methodologies, if any, by which he could break the time
    series object into trend and seasonality components. He then planned to remove
    these two components from the time series object to make its resemblance closer
    to one of a stationary nature. His search brought him to the concept of decomposition.


    ### Decomposition


    Decomposition is yet another approach to eliminate trend and seasonality from
    a time series to make it stationary in nature. It does that by dividing the time
    series into three components: trend, seasonality, and residuals. The component
    of interest in this case is the residuals (i.e., time series without trend and
    seasonality).


    David was curious to see what the three components of the log transformed time
    series in question looked like. Hence, without wasting any further time he wrote
    the code in Listing [3-14](#A432778_1_En_3_Chapter.html#Par104).


    ![A432778_1_En_3_Fig10_HTML.gif](A432778_1_En_3_Fig10_HTML.gif)


    Figure 3-10.


    Decomposed log transformed time series


