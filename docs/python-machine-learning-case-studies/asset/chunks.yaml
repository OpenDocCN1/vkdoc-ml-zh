    ```


    查看表 5-3 后，朱迪博士看到特征生成成为现实，感到非常兴奋。证据就是那些代表 AppointmentData 和 AppointmentRegistration
    的年、月、日、时、分、秒组成部分的列。朱迪博士很清楚，她增加特征集的方法并非唯一标准技术，因为存在其他几种实现相同目标的技术。她有一些关于提取更多特征的想法；然而，为了节省时间，她选择了最简单的方法。但如果有人能帮助她从日期特征中提取其他日期组成部分，或者帮助她将特征转换为布尔类型，她愿意合作。因此，她列出了以下练习。


    练习


    1.  从日期特征中提取更多特征（月中的第几周、年中的第几周、半天、周末、工作日等）。

    2.  像第 4 章那样，在数据集中包含特征的布尔转换。这将增加特征集，在训练模型时可能有益。


    她希望这个庞大的特征池现在能使分类模型更好地理解底层数据的动态。她知道什么是分类，但好奇心驱使她撰写了以下关于该主题的材料。


    ## 分类


    分类帮助我们判断一个新观测值将属于给定的哪个类别。分类属于监督学习，只有将带有标签的成员数据作为输入提供后，模型才能进行训练。这些成员变量通常是分类变量，可以是名义变量，也可以是布尔变量。


    例如，考虑一个人在一家顶级银行申请抵押贷款。银行将审核他的申请，并想知道此人未来是否会违约。如果不会，银行将批准他的抵押贷款申请。这是分类的一个典型应用，银行使用过去的数据来训练模型。然后，模型将考虑此人的年龄、性别、薪资指数、生活方式指数和信用评分，以预测他未来是否会违约。这里我们试图预测的成员变量是“违约”，并且它是分类变量。


    以下方法可用于评估分类模型：


    *   **准确性**：分类器和预测器的准确度

    *   **速度**：模型训练和预测所需的时间

    *   **鲁棒性**：处理缺失值和噪声的能力

    *   **可扩展性**：在磁盘相关数据库中的效率

    *   **可解释性**：模型做出的预测具有直观意义


    ### 模型评估技术


    Python 允许借助多种评分、损失和效用函数来衡量分类性能。这些指标需要置信度值的概率估计、正类、二元决策值或 `sample_weight` 参数内的值（即每个样本对总体得分的加权贡献）。这些指标可以通过多种方式进行划分。

