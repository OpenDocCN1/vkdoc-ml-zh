    Ross had read somewhere that clusters in `k-means` are usually in a spherical
    shape. He was curious to know if methods exist which create non-uniform clusters
    of different shapes. It didn’t take him long to discover Gaussian mixture models
    as a potential candidate to satisfy his curiosity.


    ### Gaussian Mixture Model


    Gaussian mixture models use probabilistic theory to estimate the number of clusters
    the data can be divided into. It works on the assumption that all data points
    are generated from the mixture of finite number of Gaussian distributions with
    unknown parameters. Gaussian mixture models can be thought as an enhancement to
    `k-means` where the covariance of the data and centers of Gaussian models are
    taken into consideration.


    ![A432778_1_En_4_Fig9_HTML.gif](A432778_1_En_4_Fig9_HTML.gif)


    **Figure 4-9.** Visual representation of Gaussian mixture model


    Gaussian mixture model comes in the following variants to constrain the covariance
    of different cluster estimates:


    *   Spherical

    *   Diagonal

    *   Tied

    *   Full covariance


    Ross decided to apply Gaussian mixture models to find out the segments and their
    characteristics. For that purpose he wrote a function in Listing [4-21](#A432778_1_En_4_Chapter.html#Par147)
    to generate a scatter plot of clusters generated from Gaussian mixture models.


    ```

    def plot_results(X, Y_, means, covariances, index, title):

    color_iter = itertools.cycle([''b'', ''g'', ''red'', ''m'', ''y'', ''navy'', ''c'',
    ''cornflowerblue'', ''gold'',

    ''darkorange''])

    splot = plt.subplot(2, 1, 1 + index)

    for i, (mean, covar, color) in enumerate(zip(

    means, covariances, color_iter)):

    v, w = np.linalg.eigh(covar)

    v = 2\. * np.sqrt(2.) * np.sqrt(v)

    u = w[0] / np.linalg.norm(w[0])

    if not np.any(Y_ == i):

    continue

    plt.scatter(X[Y_ == i, 0], X[Y_ == i, 1], .8, color=color)

    angle = np.arctan(u[1] / u[0])

    angle = 180\. * angle / np.pi  # convert to degrees

    ell = mpl.patches.Ellipse(mean, v[0], v[1], 180\. + angle, color=color)

    ell.set_clip_box(splot.bbox)

    ell.set_alpha(0.5)

    splot.add_artist(ell)

    plt.xlim(0.0, 0.1)

    plt.ylim(-0.2, 1.2)

    plt.xticks(())

    plt.yticks(())

    plt.title(title)

    ```


    **Listing 4-21.** Defining Function to Plot the Clusters


    In Listing [4-21](#A432778_1_En_4_Chapter.html#Par147) Ross made sure to represent
    each cluster with a different color in order to help visually differentiate among
    them. He was now looking forward to applying Gaussian mixture models; however,
    he wasn’t very sure about what the number of components should be. He looked through
    the literature and found out that BIC score is used commonly in Gaussian mixture
    models for deciding upon the number of clusters. Now his plan was to run a Gaussian
    mixture model for all possible combinations of covariance types and components
    (i.e., from 2 to 9). Covariance types include spherical, tied, and full. For each
    of these combinations BIC score will be calculated and the combination with the
    maximum BIC score will be selected. Ross made this happen by writing the code
    in Listing [4-22](#A432778_1_En_4_Chapter.html#Par149).


