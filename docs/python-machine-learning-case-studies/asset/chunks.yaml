- fmt: '### Support Vector Machines


    ![A432778_1_En_2_Fig28_HTML.gif](A432778_1_En_2_Fig28_HTML.gif)


    Figure 2-28. Illustration of support vector machine regression


    Support vector machines constructs hyperplane(s) for the purposes of classification
    and regression (see Figure [2-28](#A432778_1_En_2_Chapter.html#Fig28)). The goal
    is to have the largest separation between the two classes. This is ensured by
    maximizing the distance between the hyperplane and the data point on each side.
    During this process the sets are often not linearly separable in that space, and
    thus we are advised to map it to a high-dimensional space (i.e., by introducing
    kernels).


    Claire decided to run both single and multiple support vector machine regressions
    on the dataset. She also planned to apply the linear kernel to the support vector
    regressor for better results.


    ```

    plt.figure(figsize=(15,7))

    plot_count = 1

    for feature in [''cement_component'', ''flay_ash'', ''water_component'', ''superplasticizer'',
    ''coarse_aggregate'']:

    data_tr = data[[''concrete_strength'', feature]]

    data_tr=data_tr[(data_tr.T != 0).all()]

    x_train, y_train, x_test, y_test = split_train_test(data_tr, feature)

    # Create linear regression object

    regr = SVR(kernel=''linear'')

    # Train the model using the training sets

    regr.fit(x_train, y_train)

    y_pred = regr.predict(x_test)

    # Plot outputs

