- fmt: '# Applications of Time Series Analysis


    ## Sales Forecasting


    Corporate organizations are concerned about the expected sales for the next period.
    Sales forecasts help them make rational decisions to achieve the targets at hand.
    Sales usually have a strong element of seasonality in them. Consider, for example,
    that we are forecasting the sales in dollar amount of groceries on a daily basis.
    We will see a seasonality that repeats monthly with the hike in sales coming in
    the first week of every month. Moreover, the change in habits of people (i.e.,
    spending and consumption) can instill a positive and negative trend in the series.


    ## Weather Forecasting


    This is the de facto application for time series analysis. Weather forecasting
    comes along with a lot of elements other than just the temperature. Forecasts
    are done for amount of rainfall, humidity, and wind speed as well.


    ## Unemployment Estimates


    Time series analysis is also used to estimate unemployed people in our economy.
    Unemployment is strongly affected by change in foreign direct investment, the
    security situation of a country, change in rate of skilled labor, and so on. These
    estimates are highly important as they affect the government’s expenditures for
    social and relief programs. Moreover, they help the government estimate the amount
    of change in direct and indirect tax as consumption levels increase due to the
    creation of employment.


    ## Disease Outbreak


    Nongovernmental organizations (NGOs) and social organizations are interested in
    forecasting the outbreak of a disease across the globe. This is important for
    them so that they can launch awareness programs and prevention strategies in regions
    highly susceptible to a particular disease or epidemic.


    ## Stock Market Prediction


    Stocks fluctuate a lot on a short-term basis during trading hours, which makes
    it difficult for investors to forecast the point in time when they can benefit
    the most. However, the problem becomes more critical when investors invest in
    a portfolio of stocks and are worried about the return they should expect from
    it in the future or adjust a stock in order to receive returns in their favor.
    This is where time series analysis comes in handy.


    David didn’t forget to summarize the methodology incorporated to reach the end
    result. He recalled having first defined the problem statement (i.e., predict
    Yahoo stock with a minimal residual). At first he had to understand what a time
    series is and then he validated the test of stationary against the time series
    object. Transformation and differencing were done to make the series object stationary.
    Then he applied the time series model and chose the one with the lowest RSS. This
    forecasted time series was then scaled back and used as an input to the linear
    regression line. The regression line enabled the extrapolation of future values
    and cross-validation was done to determine the variance explained by the best
    fit line.


    David now planned to incorporate this model to predict Janice’s expected returns
    and to avoid a major setback due to prediction inaccuracies.


    # Clustering


    The goal of this chapter is to solve real-world problems with the aid of supervised
    and unsupervised learning algorithms. First we will start off with the concept
    of clustering, determine how to organize the data, decide upon the number of components,
    and then end up seeing if the cluster outputs make any intuitive sense.


    **Note:** This book incorporates Python 2.7.11 as the de facto standard for coding
    examples. Moreover, you are required to install it for the Exercises.


    In this chapter we will be using the Accepted Papers dataset for clustering coding
    examples. This data dump can be downloaded from:


    [`https://archive.ics.uci.edu/ml/datasets/AAAI+2014+Accepted+Papers`](https://archive.ics.uci.edu/ml/datasets/AAAI+2014+Accepted+Papers)


    ## Case Study: Determination of Short Tail Keywords for Marketing


    Ross, the marketing director of an artificial intelligence (AI) conference, had
    to report to the board with recommendations for short tail keywords for the marketing
    of the 2015 conference. He also had to come up with a visualization of research
    papers submitted so far, grouped by their paper type.


    The conference is run by a nonprofit scientific society that ensures advancements
    in the domains of artificial intelligence. It does so by enhancing public understanding
    of the domain, as well as by providing researchers with a platform for them to
    present their findings in yearly conferences.


    In order to come up with a solution for the problem at hand, Ross started off
    by going through the web site. However, the magnitude of content from the research
    papers was too much for him to make an analysis.


    He thus knocked on Ted’s door to find out if any data was available to start off
    the analysis. The meeting with Ted, who was the director of the data warehousing
    department, gave Ross a glimpse of hope. As Ted recalled:


    > Ross came up to me with this request, but the problem was that we were going
    through a major overhaul of integrating SAP in/out processes. But fortunately
    we had some data dumps available in storage. I asked Ross for the conference year
    he wanted the data for, and boom we had the data dump for that year.


    Ross loaded the data dump in Microsoft Excel and started looking through the features.
    He thought that one strategy could be to group the papers by keywords or groups.
    He could then run separate ads on social media and use SEO (search engine optimization)
    to target the respective keywords within them. However, there were too many distinct
    values within keywords and group features, and thus they would result in many
    clusters of SEO keywords. His strategy was to come up with a maximum of ten different
    SEO keyword groups and let them run for several days to reap benefits. He had
    heard something about clustering, where you cluster the data into a fixed number
    of clusters, and so he decided that clustering would be his starting point.


    Now that he had a path to follow, he had some questions in mind. How many clusters
    would be optimal from the data provided? Given that the data is small, can any
    machine learning algorithm be a best fit to it? How should he visually present
    the data and, ultimately, the findings?


    Ross believed that understanding the features of data provided by Ted would prove
    beneficial later on down the path. He felt that understanding them would help
    him decide upon the best approach for solving the problem at hand. Hence he compiled
    the data dictionary in Table 4-1.


    **Table 4-1.** Data Dictionary for the Accepted Papers Dataset


    | Feature name | Description |

    | --- | --- |

    | Title | Title of the paper |

    | Authors | Author(s) of the paper |

    | Groups | Author-selected, high-level keyword(s) |

    | Keywords | Author-generated keywords |

    | Topics | Author-selected, low-level keywords |

    | Abstracts | Paper abstracts |


    While looking at Table 4-1, Ross deduced that all of the features were in a string
    format. Moreover, he noticed that paper manuscripts are not part of the dataset
    and abstracts were provided instead.


    Ross had recently completed the Python specialization offered by the University
