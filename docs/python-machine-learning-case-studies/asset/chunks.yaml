    Once done, then different sample sizes were fixed in order to see the change in
    distribution as a function of the sample size. Note in Figure [1-20](#A432778_1_En_1_Chapter.html#Fig20)
    that with the increase in sample size, the distribution seems to transform into
    a normal distribution. This validates the central limit theorem.


    ## Case Study Findings


    Eric and Nancy’s deductions helped them understand their audience to a better
    extent and garner valuables insights. The insights were rendered on data collected
    from 2014 to 2016 with demographic information only available for the members
    and not short-term pass holders. Hence, in order to get information about the
    short-term pass holders Nancy knew that she had to go through a market research
    exercise where central limit theorem would come in handy. Trip duration follows
    a definite seasonal pattern that repeats over time. Forecasting this time series
    can help Nancy predict the times when the company needs to push its marketing
    efforts and times when most trips anticipated can help ensure operational efficiencies.
    As for the promotions, Nancy now knew that the best station at which to kick off
    the campaign would be Pier 69/Alaskan Way & Clay St. Outliers were a tiny portion
    of the dataset; however, their time series nature meant that those outliers couldn’t
    be removed and transformation was thus applied. Regarding further analysis, Nancy
    was now aware that as the features are not homogeneous, the analysis would have
    to be done on the individual category level.


    Nancy wasn’t sure if the techniques they applied were obsolete or have applications
    in real world applications as well. Hence Eric compiled the following list of
    applications that his friends from the industry use to bring Statistics and Probability
    into live.


    ## Applications of Statistics and Probability


    Applications of statistics and probability are vibrant in several fields of study.


    ### Actuarial Science


    Actuaries use the concepts of mathematics, probability theory, statistics, finance,
    economics, computer science, and modeling to evaluate and price risks. Their application
    cases exist in the domains of insurance, consulting firms, and government.'
