    ## 执行数据整理


    她曾在某处读到，数据整理是将原始数据映射为适合分析的有组织格式的过程。图 5-1 的发现显示，“年龄”列中存在负值，这在她看来毫无直观意义，因此她将这些数据称为噪声。于是她计划先统计负年龄值的频率，以此开始处理。如果这些观测值的频率很高，她不会删除它们，因为删除会导致无法检测到预测所需的变量。相反，如果它们的频率可以忽略不计，她计划将其删除，因为删除它们不会对分析产生重大影响。她首先在代码清单
    5-7 中统计了负年龄值的频率。


    ```

    data[data[''Age''] < 0][''Age''].value_counts().sum()

    代码清单 5-7.

    统计负年龄观测值的频率

    ```


    输出


    ```


    ```


    代码清单 5-7 的输出表明，与数据集中的总观测值数量相比，负年龄观测值可以忽略不计。因此，朱迪博士决定从“年龄”特征中移除这些负观测值。


    ```

    data = data[data[''Age''] >= 0]

    代码清单 5-8.

    移除具有负年龄值的观测值

    ```


    在查看图 5-1 的推论时，朱迪博士还注意到名为“残疾”的特征是一个整数变量，而非布尔变量。她回想起该特征集的数据定义在数据源中缺失，因此存在多种解读。她能想到的唯一合理解释是，该值范围在
    0 到 4 之间，这可能是一个李克特量表问题，或者是一个表示患者残疾次数的数字实体。由于对这个特征的解释存在歧义，她决定从数据集中删除该特征。


    ```

    del data[''Handcap'']

    代码清单 5-9.

    从数据集中移除名为“残疾”的变量

    ```


    在查看图 5-1 的推论时，朱迪博士还回想起“等待时间”中的值似乎为负，因此将其转换为正值是合理的。


    ```

    data[''AwaitingTime''] = data[''AwaitingTime''].apply(lambda x: abs(x))

    代码清单 5-10.

    将“等待时间”中的值变为正数

    ```


    基于图 5-1 中推论的变量处理已经完成。然而，朱迪博士回想起她读过的大多数机器学习算法在整数或浮点数输入下表现最佳，而非字符串格式。她知道数据集中的分类变量不符合这一条件，因此将字符串分类特征重新编码为整数对她来说至关重要。朱迪博士首先通过绑定从字符串到整数的映射，对“星期几”进行重新编码。


    ```

    dow_mapping = {''Monday'' : 0, ''Tuesday'' : 1, ''Wednesday'' : 2, ''Thursday''
    : 3, ''Friday'' : 4, ''Saturday'' : 5, ''Sunday'' : 6}

    data[''DayOfTheWeek''] = data[''DayOfTheWeek''].map(dow_mapping)

    代码清单 5-11.

    将字符串分类特征“星期几”重新编码为整数

    ```


    朱迪博士对她的重新编码方法解释如下：


    > 存在自动重新编码分类变量的方法。这些方法按字母顺序执行重新编码，例如，如果一个特征的类别是“男”和“女”，那么它会将“女”分配为 0，“男”分配为 1。“星期几”是一个有序量；因此我决定手动进行映射。然而，“性别”和“状态”特征并非如此，因为它们本质上是名义变量。因此，我将使用预定义方法来自动进行重新编码。


    朱迪博士在代码清单 5-12 中对“性别”和“状态”进行了重新编码。


    ```

    for field in [''Gender'', ''Status'']:

    data[field] = pd.Categorical.from_array(data[field]).codes

