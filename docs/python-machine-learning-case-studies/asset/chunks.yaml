- fmt: '### Confusion Matrix


    Confusion matrix counts the true negatives, false positives, false negatives,
    and true positives.


    ![A432778_1_En_5_Fig9_HTML.gif](A432778_1_En_5_Fig9_HTML.gif)


    Figure 5-9. Confusion matrix along with the respective formulas


    - True negatives is the frequency of instances in which the model correctly predicted
    0 as 0.

    - False negatives is the frequency of instances in which the model predicted 1
    as 0.

    - True positives is the frequency of instances in which the model correctly predicted
    1 as 1.

    - False positives is the frequency of instances in which the model predicted 0
    as 1.


    While doing research Dr. Judy discovered a simplified version of the Confusion
    matrix which shows the model evaluation as a visual representation.


    ### Binary Classification: Receiver Operating Characteristic


    A good way to understand the mechanics behind ROC (Receiver Operating Characteristic)
    curves is by means of a Confusion matrix. ROC curves visually plot the performance
    of a binary classifier as the discrimination threshold is varied. Keep in mind
    the following terms:


    - True Positive Rate (TPR): that is, the sensitivity, recall, or probability of
    detection

    - False Positive Rate (FPR): that is, 1 - specificity, true negative rate, or
    probability of false alarm


    Consider, for example, the same dataset on which the model will be trained to
    predict the people who are highly subject to default in the future. We split the
    data into 70/30, which means that the model will be trained on 70% of the observations
    and tested on 30% of the observations. After having used the model to predict
    on 30% of the observations we ended up with the chart in Table 5-4.


    Table 5-4. Frequency of Defaults from Actual Data and the Predicted One


    | | Will default | Will not default |

    | --- | --- | --- |

    | Actual | 30 | 70 |

    | Correctly predicted | 19 | 36 |


    TPR in this case will be 19/30 ∼ 63%. Whereas, FPR in this case will be 36/70
    ∼ 51%


    ![A432778_1_En_5_Fig10_HTML.gif](A432778_1_En_5_Fig10_HTML.gif)


    Figure 5-10. ROC curves and relative comparison among each of them


    The ROC curve plots the fraction of true positives out of the positives (i.e.,
    TPR) versus the fraction of false positives out of the negatives (i.e., FPR).
    Or, in other terms, we can say a ROC curve is the sensitivity as a function of
    fallout. It plots a cumulative distribution function that helps select possibly
    optimal models.


    Accuracy on the curve is represented by Area under the Curve (AUC). Values range
    between 0.0 and 1.0.


    Dr. Judy decided to define a method that would take the actual data and predict
    the goodness of the model. For that reason she wrote the code snippet in Listing
    5-24.


    ```

    def model_performance(model_name, X_train, y_train, y_test, Y_pred):

    print ''Model name: %s''%model_name

    print ''Test accuracy (Accuracy Score): %f''%metrics.accuracy_score(y_test, Y_pred)

    print ''Test accuracy (ROC AUC Score): %f''%metrics.roc_auc_score(y_test, Y_pred)

    print ''Train accuracy: %f''%clf.score(X_train, y_train)

    fpr, tpr, thresholds = metrics.precision_recall_curve(y_test, Y_pred)

    print ''Area Under the Precision-Recall Curve: %f''%metrics.auc(fpr, tpr)

    false_positive_rate, true_positive_rate, thresholds = metrics.roc_curve(y_test,
    Y_pred)

    roc_auc = metrics.auc(false_positive_rate, true_positive_rate)

    plt.title(''Receiver Operating Characteristic'')

    plt.plot(false_positive_rate, true_positive_rate, ''b'',

    label=''AUC = %0.2f''% roc_auc)

    plt.legend(loc=''lower right'')

    plt.plot([0,1],[0,1],''r--'')

    plt.xlim([-0.1,1.2])

    plt.ylim([-0.1,1.2])

    plt.ylabel(''True Positive Rate'')

    plt.xlabel(''False Positive Rate'')

    plt.show()

    ```


    Listing 5-24. Declaring a Function to Detect Model’s Accuracy by Applying Methods
    Learned Previously


    In order to cross-validate the model, Dr. Judy knew that she would have to split
    the data into training and testing data.


    ### Ensuring Cross-Validation by Splitting the Dataset


    Dr. Judy planned to train the model from the training dataset and then use that
    model to predict the values in the test dataset. She planned on doing so to determine
    the goodness of the model. She wrote the code for the training/testing split in
    Listing 5-25.


    ```

    features_of_choice = [u''Age'', u''Gender'', ''DayOfTheWeek'', ''Diabetes'', ''Alcoolism'',
    ''HiperTension'',

    ''Smokes'', ''Scholarship'', ''Tuberculosis'', ''Sms_Reminder'',

    ''AwaitingTime'', ''AppointmentRegistration_year'', ''AppointmentRegistration_month'',

    ''AppointmentRegistration_day'', ''ApointmentData_year'', ''ApointmentData_month'',

    ''ApointmentData_day'', ''AppointmentRegistration_hour'', ''AppointmentRegistration_min'',

    ''AppointmentRegistration_sec'']

    x = np.array(data[features_of_choice])

    y = np.array(data[''Status''])

    x_train, x_test, y_train, y_test = train_test_split(x, y, test_size=0.3, random_state=1)

    ```


    Listing 5-25. Declaring Features for Model Training and Splitting Data into Training
    and Testing Sets


    Dr. Judy explained her logic in Listing 5-25. She wrote the code to take a 70-30
    split whereby 70% of the observations fall into training and 30% of observations
    fall into the test dataset.


    Before applying the classification model she thought it better to recall the reason
    for doing classification in the first place. With the aid of the exploratory analysis
    she had figured out the reason for recurring losses. Then she decided to go a
    further mile to find a remedy for this problem. She decided to use classification
    as an aid to predict if a patient will show up on his/her appointment day or not.
    This would enable management to do either of the following:


    - Scale down the human resources (i.e., staff and doctors) to cut costs

    - Determine the reasons for patients not showing up and find fixes for that problem


    While looking at classification, the only visual representation Dr. Judy could
    think of was a tree. As in the case of Status, the tree will have one parent node
    and two child nodes (i.e., show-ups and no-shows). While searching for classification
    models, she found a visual representation, Decision Tree Classification.'
