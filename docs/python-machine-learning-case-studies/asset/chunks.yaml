    ### 多变量分析


    多变量分析是指纳入多个解释变量来理解响应变量的行为。考虑到现实世界中的实体通常是相互关联的，这似乎是最可行且最现实的方法。因此，响应变量的变异性可能受到相互关联的解释变量变异性的影响。


    南希认为，在完成的出行次数方面，男性会超过女性。图 1-2 显示男性完成的出行次数远多于其他性别类型，这让她更加坚信这一观点。埃里克认为验证这一观点的最佳方法是使用堆叠柱状图（即，针对出生年份的柱状图，但每个柱形有两种颜色，分别代表一种性别）（见图
    1-5）。


