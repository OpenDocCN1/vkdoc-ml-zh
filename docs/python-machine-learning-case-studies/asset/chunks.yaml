    表 1-2.


    数据集前七列观察结果打印


    ![A432778_1_En_1_Figa_HTML.gif](img/A432778_1_En_1_Figa_HTML.gif)


    查看表 1-2 和表 1-3 后，Nancy 注意到 `tripduration` 以秒为单位表示。此外，`bike`、`from_station` 和 `to_station`
    的唯一标识符是字符串形式，而 `trip identifier` 的唯一标识符则是整数形式。


    表 1-3.


    数据集后五列观察结果打印


    ![A432778_1_En_1_Figb_HTML.gif](img/A432778_1_En_1_Figb_HTML.gif)


    ### 变量类型


    Nancy 决定更进一步，为数据集中的每个特征分配数据类型。


    表 1-4.


    Nancy 将变量分类为数据类型的方法


    | 特征名称 | 变量类型 |

    | --- | --- |

    | `trip_id` `bikeid` `tripduration` `from_station_id` `to_station_id` `birthyear`
    | 数字 |

    | `Starttime` `Stoptime` | 日期 |

    | `from_station_name to_station_name` `Usertype` `Gender` | 文本 |


    查看表 1-4 中的特征分类后，Eric 注意到 Nancy 正确识别了数据类型，因此对他来说，解释变量类型的含义似乎是一件容易的事。Eric 回忆起他曾解释过以下内容：


    > 在日常与数据交互中，我们通常将数字表示为整数，文本表示为字符串，真/假表示为布尔值等。这些就是我们所说的数据类型。但机器学习中的术语更为细致，它将我们之前了解的数据类型细分为变量类型。理解这些变量类型对于在进行探索性数据分析或决定将哪种合适的机器学习算法应用于我们的数据时选择图表类型至关重要。


    #### 连续/定量变量


    连续变量在给定范围内可以有无限多个值。与离散变量不同，它们是不可数的。在探索连续变量的类型之前，让我们先理解什么是真正的零点。


    ##### 真正的零点


    如果某个测量尺度具有真正的零点，那么值为 0 意味着你什么都没有。以表示购买的纸杯蛋糕数量的比率变量为例。值为 0 表示你连一个纸杯蛋糕都没买。真正的零点是区分定距变量和比率变量的关键因素。


    现在让我们探索不同类型的连续变量。


    ##### 定距变量


    定距变量存在于本质上是连续的且具有数值的数据中。以每天测量的某个社区的温度为例。间隔之间的差异保持不变，例如 70 摄氏度和 50 摄氏度之间的差异与 80
    摄氏度和 100 摄氏度之间的差异相同。我们可以计算定距变量的平均值和中位数，但它们没有真正的零点。


    ##### 比率变量


    定距变量的属性与比率变量非常相似，区别在于比率变量中，0 表示该测量值不存在。以某个社区汽车行驶的距离为例。摄氏温度是一个定距变量，因此值为 0 摄氏度并不意味着没有温度。然而，请注意，值为
    0 公里表示汽车没有行驶距离，因此被视为比率变量。此外，顾名思义，测量的比率也可以使用，例如行驶 50 公里的距离是汽车行驶 25 公里距离的两倍。


    #### 离散变量


    离散变量在给定范围内具有有限的值集。与连续变量不同，它们是可数的。让我们看一些本质上是分类的离散变量的例子。


    ##### 定序变量


    定序变量的值按从低到高或从高到低的顺序排列。这些定序变量内部的层级之间可以有不等的间距。例如，以下层级：


    1.  小学

    2.  中学

    3.  学院

    4.  大学


    小学和中学之间的年数差异肯定不等于中学和学院之间的差异。如果这些差异是恒定的，那么这个变量也有资格成为定距变量。


    ##### 定类变量


    定类变量是没有内在顺序的分类变量；然而，层级之间存在恒定的差异。定类变量的例子可以是性别、一年中的月份、制造商发布的汽车等。以一年中的月份为例，每个月都是一个不同的层级。


    ##### 二分变量


    二分变量是只有两个类别或层级的定类变量。例子包括：


    *   年龄：24 岁以下，24 岁以上

    *   性别：男，女


    #### 潜在变量


    潜在变量不属于解释变量（即自变量）或响应变量（即因变量），但可能影响对这些变量之间关系的解释。例如，如果我们想根据申请人的性别预测他/她是否能被大学录取。在这种情况下，一个可能的潜在变量可以是申请人寻求录取的院系名称。


    #### 人口统计变量


    人口统计学（源自希腊语，意为“描述人民”）是对人口的研究。该学科考察人口的规模和构成，以及人口从一个地方到另一个地方的流动。人口统计学家还分析人口增长及其控制的影响。人口统计变量是研究人员收集的变量，用于描述用于推断统计的样本的性质和分布。在应用统计学和研究中，这些变量包括年龄、性别、种族、社会经济指标和群体成员身份等。

    '
- fmt: '#### Dependent and Independent Variables


    An independent variable is also referred to as an exploratory variable because
    it is being used to explain or predict the dependent variable, also referred to
    as a response variable or outcome variable.


    Taking the dataset into consideration, what are the dependent and independent
    variables? Let’s say that Cycle Share System’s management approaches you and asks
    you to build a system for them to predict the trip duration beforehand so that
    the supply of cycles can be ensured. In that case, what is your dependent variable?
    Definitely `tripduration`. And what are the independent variables? Well, these
    variables will comprise of the features which we believe influence the dependent
    variable (e.g., `usertype`, `gender`, and time and date of the day).


    Eric asked Nancy to classify the features in the variable types he had just explained.


    **Table 1-5.** Nancy’s Approach to Classifying Variables into Variable Types


    | Feature name | Variable type |

    | --- | --- |

    | `trip_id` `bikeid` `tripduration` `from_station_id` `to_station_id` `birthyear`
    | Continuous |

    | `Starttime` `Stoptime` | DateTime |

    | `from_station_name` `to_station_name` | String |

    | `Usertype` `gender` | Nominal |


    Nancy now had a clear idea of the variable types within machine learning, and
    also which of the features qualify for which of those variable types (see Table
    [1-5](#A432778_1_En_1_Chapter.html#Tab5)). However despite of looking at the initial
    observations of each of these features (see Table [1-2](#A432778_1_En_1_Chapter.html#Tab2))
    she couldn’t deduce the depth and breadth of information that each of those tables
    contains. She mentioned this to Eric, and Eric, being a data analytics guru, had
    an answer: perform univariate analysis on features within the dataset.


    ### Univariate Analysis


    Univariate comes from the word “uni” meaning one. This is the analysis performed
    on a single variable and thus does not account for any sort of relationship among
    exploratory variables.


    Eric decided to perform univariate analysis on the dataset to better understand
    the features in isolation (see Listing [1-4](#A432778_1_En_1_Chapter.html#Par59)).


    ```

    data = data.sort_values(by=''starttime'')

    data.reset_index()

    print ''Date range of dataset: %s - %s''%(data.ix[1, ''starttime''], data.ix[len(data)-1,
    ''stoptime''])

    ```


    **Listing 1-4.** Determining the Time Range of the Dataset


    Output:


    ```

    Date range of dataset: 10/13/2014 10:32 - 9/1/2016 0:20

    ```


    Eric knew that Nancy would have a hard time understanding the code so he decided
    to explain the ones that he felt were complex in nature. In regard to the code
    in Listing [1-4](#A432778_1_En_1_Chapter.html#Par59), Eric explained the following:


    > We started off by sorting the data frame by `starttime`. Do note that data frame
    is a data structure in Python in which we initially loaded the data in Listing
    [1-2](#A432778_1_En_1_Chapter.html#Par26). Data frame helps arrange the data in
    a tabular form and enables quick searching by means of hash values. Moreover,
    data frame comes up with handy functions that make lives easier when doing analysis
    on data. So what sorting did was to change the position of records within the
    data frame, and hence the change in positions disturbed the arrangement of the
    indexes which were earlier in an ascending order. Hence, considering this, we
    decided to reset the indexes so that the ordered data frame now has indexes in
    an ascending order. Finally, we printed the date range that started from the first
    value of `starttime` and ended with the last value of `stoptime`.


    Eric’s analysis presented two insights. One is that the data ranges from October
    2014 up till September 2016 (i.e., three years of data). Moreover, it seems like
    the cycle sharing service is usually operational beyond the standard 9 to 5 business
    hours.


    Nancy believed that short-term pass holders would avail more trips than their
    counterparts. She believed that most people would use the service on a daily basis
    rather than purchasing the long term membership. Eric thought otherwise; he believed
    that new users would be short-term pass holders however once they try out the
    service and become satisfied would ultimately avail the membership to receive
    the perks and benefits offered. He also believed that people tend to give more
    weight to services they have paid for, and they make sure to get the maximum out
    of each buck spent. Thus, Eric decided to plot a bar graph of trip frequencies
    by user type to validate his viewpoint (see Listing [1-5](#A432778_1_En_1_Chapter.html#Par66)).
    But before doing so he made a brief document of the commonly used charts and situations
    for which they are a best fit to (see Appendix A for a copy). This chart gave
    Nancy his perspective for choosing a bar graph for the current situation.


    ```

    groupby_user = data.groupby(''usertype'').size()

    groupby_user.plot.bar(title = ''Distribution of user types'')

    ```


    **Listing 1-5.** Plotting the Distribution of User Types


    ![A432778_1_En_1_Fig1_HTML.gif](A432778_1_En_1_Fig1_HTML.gif)


    **Figure 1-1.** Bar graph signifying the distribution of user types


    Nancy didn’t understand the code snippet in Listing [1-5](#A432778_1_En_1_Chapter.html#Par66).
    She was confused by the functionality of `groupby` and `size` methods. She recalled
    asking Eric the following: “I can understand that `groupby` groups the data by
    a given field, that is, `usertype`, in the current situation. But what do we mean
    by `size`? Is it the same as count, that is, counts trips falling within each
    of the grouped `usertype`s?”


    Eric was surprised by Nancy’s deductions and he deemed them to be correct. However,
    the bar graph presented insights (see Figure [1-1](#A432778_1_En_1_Chapter.html#Fig1))
    in favor of Eric’s view as the members tend to avail more trips than their counterparts.'
