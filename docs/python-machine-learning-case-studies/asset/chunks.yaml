    The multivariate analysis that Nancy and Eric had performed had yielded some good
    insights. However, Nancy was curious to know if some statistical tests exist to
    determine the strength of the relationship between two variables. She wanted to
    use this information to determine the features which have the most impact on trip
    duration. The concept of correlation popped up in Eric’s mind, and he decided
    to share his knowledge base before moving on further with the analysis.


    ## Correlation


    Correlation refers to the strength and direction of the relationship between two
    quantitative features. A correlation value of 1 means strong correlation in the
    positive direction, whereas a correlation value of -1 means a strong correlation
    in the negative direction. A value of 0 means no correlation between the quantitative
    features. Please note that correlation doesn’t imply causation; that is, the change
    in one entity doesn’t enforce a change in the other one.


    Correlation of an attribute to itself will imply a correlation value of 1. Many
    machine learning algorithms fail to provide optimum performance because of the
    presence of multicollinearity. Multicollinearity refers to the presence of correlations
    among the features of choice, and thus it is usually recommended to review all
    pair-wise correlations among the features of a dataset before considering them
    for analysis.


    Following are the most common types of correlations:


    ### Pearson R Correlation


    Pearson R correlation is the most common of the three and is usually suitable
    to calculate the relationships between two quantitative variables which are linearly
    related and seem to be normally distributed. Take, for example, two securities
    in the stock market closely related to one another and examine the degree of relationship
    between them.


    ### Kendall Rank Correlation


    As compared to Pearson, which is suitable for normally distributed data, Kendall
    rank correlation is a non-parametric test to determine the strength and direction
    of relationship between two quantitative features. Non-parametric techniques are
    targeted to distributions other than the normal distribution. To the contrary,
    parametric techniques are targeted toward normal distribution.'
