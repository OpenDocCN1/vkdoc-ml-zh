    作为营销专家的南希对目前的分析结果感到满意。然而，她还想进一步了解公司的营销信息将针对的目标客户群体。因此，埃里克决定通过编写清单 1-7 中的代码来呈现出生年份的分布情况。他认为这有助于南希了解哪些年龄段的人最可能骑自行车，或者更倾向于使用该服务。


