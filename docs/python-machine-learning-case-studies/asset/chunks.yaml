  trans: "\n## 案例研究：俄亥俄诊所——应对供需问题\n\n儿科外科医生兼俄亥俄诊所主管朱迪医生遇到了大麻烦，该诊所连续第三年出现亏损。朱迪医生最近刚晋升到这个职位，但她清楚地知道，诊所一直在效率方面尽职尽责。最让她惊讶的是，尽管拥有最优秀的医生，预约也从不缺乏，医院却仍在亏损。为了对财务状况放心，她聘请了一家第三方公司来审计财务部门。然而，该公司并未发现任何与当前困境相关的证据。\n\
    \n俄亥俄诊所是俄亥俄州的一家非营利性医疗中心。该诊所的独特使命是将研究与教育同临床及住院护理相结合。该医疗中心拥有庞大的员工队伍，共计 5 万人，正是这些员工的共同努力，使得该医疗中心迄今已能处理约\
    \ 700 万人次的就诊。\n\n此前，遇到类似情况，医院依赖的是捐赠者的资金注入。然而，随着管理层最近的人事变动，医院已开始努力实现自负盈亏。正如朱迪医生回忆的那样：\n\
    \n> 管理层的这项新举措对我来说是一个巨大的挑战，因为那恰好是我接手这个职位的时候。我没有时间安顿下来，所以这对我来说是一个生死攸关的局面。如果财务没有问题，预约量激增，没有大量招聘或加薪，那么造成这种困境的唯一原因可能就是患者在预约后根本没有出现。\n\
    \n董事会会议很快就要召开，她必须在会议前收集见解，为这种异常现象找出原因。朱迪医生知道，无论是猜测还是谣言，都无法让她找出尽管预约量很大却仍在亏损的原因。为了进一步调查她的怀疑，她获取了预约数据转储，并决定利用这些数据来验证证据。她知道具体的数据不会受偏见影响，因此能清晰地呈现当前的情况。首先，她必须交叉检查数据集中的特征是否与手头的问题相关。于是，她调出了表\
    \ 5-1 中的数据字典。\n\n表 5-1.\n\n医疗预约未出席数据集的数据字典\n\n| 特征名称 | 描述 |\n| --- | --- |\n|\
    \ Age | 患者年龄 |\n| Gender | 患者性别 |\n| AppointmentRegistration | 向患者发出预约的日期 |\n\
    | ApointmentData | 为患者安排的预约日期 |\n| DayOfTheWeek | 预约安排的星期几 |\n| Status | 预约安排的星期几（即响应变量）\
    \ |\n| Diabetes | 患者是否患有糖尿病 |\n| Alcoolism | 患者是否受酒精中毒影响 |\n| HiperTension | 患者是否患有高血压\
    \ |\n| Handicap | 患者是否残疾 |\n| Smokes | 患者是否吸烟 |\n| Tuberculosis | 患者是否患有肺结核 |\n\
    | Scholarship | 患者是否获得社会福利组织的奖学金。贫困家庭可能通过获得经济援助而受益。 |\n| Sms_Reminder | 是否已向患者发送了预约短信提醒\
    \ |\n| AwaitingTime | 等待时间 = 预约登记日期 – 预约日期 |\n\n朱迪医生在网上搜索了在此分析过程中可能需要的所有相关软件包。清单\
    \ 5-1 展示了她的搜索结果。\n\n```\n%matplotlib inline\nimport numpy as np\nimport pandas\
    \ as pd\nfrom time import time\nimport matplotlib.pyplot as plt\nfrom IPython.display\
    \ import Image\nfrom matplotlib.pylab import rcParams\nfrom sklearn import metrics\n\
    from sklearn.cross_validation import train_test_split\nfrom sklearn.decomposition\
    \ import PCA\nfrom sklearn import kernel_approximation\nfrom sklearn.linear_model\
    \ import SGDClassifier\nfrom sklearn.tree import DecisionTreeClassifier\nfrom\
    \ sklearn.kernel_approximation import (RBFSampler,Nystroem)\nfrom sklearn.ensemble\
    \ import GradientBoostingClassifier, RandomForestClassifier\nrcParams['figure.figsize']\
    \ = 15, 5\n清单 5-1.\n导入本章所需的软件包\n```\n\n朱迪医生希望利用数据转储中的信息实现以下目标：\n\n1.  找出即使预约率上升，亏损仍然出现的原因。\n\
    2.  如果患者在预约时间未报到，提出一种方法，根据患者的特征判断其是否会出席。她认为，了解哪些患者可能不会出席，将使医院能够采取如下应对措施：\n   \
    \ *   提供持续的预约提醒和确认\n    *   使医生和医院员工的人数与当前需求保持一致。\n\n朱迪医生决定从理解数据转储中的特征并列出其可能的值开始。\n"
- fmt: '# Features’ Exploration


    Dr. Judy put her faith in the data dump and loaded it into the computer’s memory
    using the code snippet in Listing [5-2](#A432778_1_En_5_Chapter.html#Par19). She
    also made sure to print the first initial observations from the data dump.


    Table 5-2. Print of Observations of the Dataset


    ![A432778_1_En_5_Figa_HTML.gif](A432778_1_En_5_Figa_HTML.gif)


    ```

    data = pd.read_csv(''examples/No-show-Issue-Comma-300k.csv'')

    data.head()

    Listing 5-2.

    Reading the Data in the Memory and Printing the First Few Observations

    ```


    Dr. Judy decided to use Table [5-2](#A432778_1_En_5_Chapter.html#Tab2) as an aid
    to classify the features into the most common data types.


    - Integer: `Age`, `waiting time`

    - String: `Gender`, `DayOfTheWeek`, `Status`

    - Datetime: `AppointmentRegistration`, `ApointmentData`

    - Boolean: `HiperTension`, `Handicap`, `Smokes`, `Scholarship`, `Tuberculosis`,
    `Sms_Reminder`


    She anticipated the records within the data dump to be in thousands as she noticed
    that the appointment calendars were usually full at the start of every month.
    She decided to validate that in Listing [5-3](#A432778_1_En_5_Chapter.html#Par26).


    ```

    print len(data)

    Listing 5-3.

    Finding Count of Number of Observations in the Dataset

    ```


    Output


    ```


    ```


    The output of Listing [5-3](#A432778_1_En_5_Chapter.html#Par26) was way above
    Dr. Judy’s expectations and reassured her of the fact that insights gained from
    the data will have a high confidence level. Next she planned on observing the
    number of distinct values within each of the features. She believed this would
    help her to drop the features that offered no variability (i.e., having same value
    for all observations) and to decide upon the types of plots these features could
    be represented in. For that purpose she wrote the code in Listing [5-4](#A432778_1_En_5_Chapter.html#Par30).


    ```

    for column in list(data.columns):

    print "{0:25} {1}".format(column, data[column].nunique())

    Listing 5-4.

    Print of the Frequency of Distinct Values in Each Feature Set

    ```


    Output


    ```

    Age                             109

    Gender                          2

    AppointmentRegistration         295425

    ApointmentData                  534

    DayOfTheWeek                    7

    Status                          2

    Diabetes                        2

    Alcoolism                       2

    HiperTension                    2

    Handicap                        5

    Smokes                          2

    Scholarship                     2

    Tuberculosis                    2

    Sms_Reminder                    3

    AwaitingTime                    213

    ```


    Dr. Judy explained that `{0:25}` in the print statement meant that the feature
    in the first index (i.e., `column`) would be printed and 25 character spaces would
    be allocated to it. The output of Listing [5-4](#A432778_1_En_5_Chapter.html#Par30)
    implied that there are many variables within the dataset that have discrete values,
    examples of which include `Gender`, `Status`, `DayOfTheWeek`, and so on. This
    helped her choose the types of plots to represent each of these features. She
    decided to plot `AwaitingTime` and `Age` as histograms because these are numbers
    and continuous in nature. As for the features which are discrete in nature, she
    planned to represent them as a bar graph. She executed that graph by initializing
    the function in Listing [5-5](#A432778_1_En_5_Chapter.html#Par34), and later called
    it in Figure [5-1](#A432778_1_En_5_Chapter.html#Fig1) to plot the figure.


    ```

    def features_plots(discrete_vars):

    plt.figure(figsize=(15,24.5))

    for i, cv in enumerate([''Age'', ''AwaitingTime'']):

    plt.subplot(7, 2, i+1)

    plt.hist(data[cv], bins=len(data[cv].unique()))

    plt.title(cv)

    plt.ylabel(''Frequency'')

    for i, dv in enumerate(discrete_vars):

    plt.subplot(7, 2, i+3)

    data[dv].value_counts().plot(kind=''bar'', title=dv)

    plt.ylabel(''Frequency'')

    Listing 5-5.

    Initialize Function to Plot All Features Within the Dataset

    ```


    Dr. Judy pointed to the fact that the method in Listing [5-5](#A432778_1_En_5_Chapter.html#Par34)
    takes as an input the names of features which are discrete in nature because those
    will be represented as bar graphs. Without wasting time she called the function
    to plot the feature representations in Listing [5-6](#A432778_1_En_5_Chapter.html#Par36).


    ![A432778_1_En_5_Fig1_HTML.jpg](A432778_1_En_5_Fig1_HTML.jpg)


    Figure 5-1. Plots of feature representations


    ```

    discrete_vars = [''Gender'', ''DayOfTheWeek'', ''Status'', ''Diabetes'',

    ''Alcoolism'', ''HiperTension'', ''Handcap'', ''Smokes'',

    ''Scholarship'', ''Tuberculosis'', ''Sms_Reminder'']

    features_plots(discrete_vars)

    Listing 5-6.

    Calling ‘features_plot’ method in Listing 5-5 to Plot the Feature Representation

    ```


    While looking at Figure [5-1](#A432778_1_En_5_Chapter.html#Fig1), Dr. Judy noticed
    that none of the features has missing values. She made the following deductions
    about some of the features from the dataset:


    - **Age**: `Age` lay in the range of -2 and 113. Age between 0 and 113 did make
    sense, but what surprised her was how it could be negative. It seemed to her that
    there was some noise in the dataset.

    - **Handicap**: Instead of being Boolean, this feature had values in the range
    of 0 and 4.

    - **Sms_Reminder**: Instead of being a Boolean entity, it had values in the range
    of 0 and 2. It seemed to her that `Sms_Reminder` represented the frequency of
    reminders sent to each and every patient.

    - **AwaitingTime**: Dr. Judy was puzzled to see `AwaitingTime` in negative terms.
    By definition this feature represented the number of days from which the appointment
    was issued to the date for which the appointment was issued. She believed that
    positive numbers would have made more sense.


    Findings from the deductions meant that Dr. Judy would have to clean data a bit
    (i.e., perform data wrangling) before pushing it into the analysis pipeline.'
