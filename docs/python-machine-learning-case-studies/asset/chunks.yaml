- fmt: '### Silhouette Score


    `Silhouette score` is used to measure how close observations within a cluster
    are (i.e., intra-cluster distance (`a`)), and how distinct the clusters are from
    each other (i.e., mean nearest cluster distance (`b`)). The `Silhouette coefficient`
    is calculated as follows:


    *   (`b - a`) / `max(a, b)`


    The best value is 1 and the worst is -1. A coefficient value of 0 indicates overlapping
    clusters. The catch for Ross was now to select the number of clusters that yield
    the maximum `Silhouette score`. Without wasting any time he applied the `Silhouette`
    method on `k-means` models, within the cluster size range of 2 to 30.


