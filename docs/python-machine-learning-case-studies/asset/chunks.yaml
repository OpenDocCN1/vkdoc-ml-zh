  trans: "\n### 确定建模参数\n\nDavid 计划查看经过对数变换和差分处理的时间序列的 ACF 和 PACF 图，以确定其最符合的规则。\n\n\
    ![A432778_1_En_3_Fig17_HTML.gif](img/A432778_1_En_3_Fig17_HTML.gif)\n\n图 3-17.\n\
    \np = 1 且 q = 1 时的 ACF 和 PACF 图\n\n*   规则 1：当 ACF 呈指数衰减，且 PACF 在滞后 1 处有一个尖峰，之后无相关性时，p\
    \ = 1（见图 3-13）。\n\n    ![A432778_1_En_3_Fig13_HTML.gif](img/A432778_1_En_3_Fig13_HTML.gif)\n\
    \n    图 3-13.\n\n    p = 1 时的 ACF 和 PACF 图\n*   规则 2：当 ACF 呈现一组指数衰减或正弦波状模式，且 PACF\
    \ 在滞后 1 和 2 处有尖峰，之后无相关性时，p = 2（见图 3-14）。\n\n    ![A432778_1_En_3_Fig14_HTML.gif](img/A432778_1_En_3_Fig14_HTML.gif)\n\
    \n    图 3-14.\n\n    p = 2 时的 ACF 和 PACF 图\n*   规则 3：当 ACF 在滞后 1 处有一个尖峰，之后无相关性，且\
    \ PACF 呈指数衰减时，q = 1（见图 3-15）。\n\n    ![A432778_1_En_3_Fig15_HTML.gif](img/A432778_1_En_3_Fig15_HTML.gif)\n\
    \n    图 3-15.\n\n    q = 1 时的 ACF 和 PACF 图\n*   规则 4：当 ACF 在滞后 1 和 2 处有尖峰，之后无相关性，且\
    \ PACF 呈现一组指数衰减或正弦波状模式时，q = 2（见图 3-16）。\n\n    ![A432778_1_En_3_Fig16_HTML.gif](img/A432778_1_En_3_Fig16_HTML.gif)\n\
    \n    图 3-16.\n\n    q = 2 时的 ACF 和 PACF 图\n*   规则 5：当 ACF 和 PACF 均从滞后 1 开始呈指数衰减时，p\
    \ = 1, q = 1（见图 3-17）。\n\n查看图 3-12 后，David 不确定哪条规则符合相关图中明显的 ACF 和 PACF 模式。ACF\
    \ 和 PACF 都在滞后 1 处有一个尖峰，而在后续滞后中无相关性。他没有发现任何规则涵盖这种行为，因此他决定将模型参数 p、d 和 q 的值留待后续通过准确性来确定。在了解了时间序列的评估方法以及选择参数值的规则后，David\
    \ 知道是时候将时间序列模型应用于经过差分处理的对数变换时间序列了。他对时间序列模型的探索使他认识到 ARIMA 模型在各种时间序列应用中展现出的有效性。因此，他开始着手理解\
    \ ARIMA。\n\n## 自回归积分滑动平均模型\n\nARIMA 代表自回归积分滑动平均模型。ARIMA 预测围绕一个线性方程展开，该方程的行为取决于\
    \ p、d 和 q 的值。换句话说，ARIMA 模型从噪声中过滤出信号，并预测未来时间点的值。一个 ARIMA 模型被定义为 ARIMA(p, d, q)。\n\
    \n本节讨论 ARIMA 模型的一些变体。\n\n### 自回归滑动平均模型\n\nARMA（自回归滑动平均）模型与 ARIMA 模型类似，区别在于我们使用\
    \ p 和 q 来确定线性方程。此外，现在的预测是在均值调整序列上进行的；也就是说，通过从时间序列中减去样本均值，将其转换为零均值变体。\n\n这一过程可由以下方程定义：\n\
    \ny [t] = Y [t] – Ý, t = 1, …N\n\n其中，\n\n*   Y[t]：原始时间序列\n*   Ý：均值调整后的时间序列\n\n\
    ARMA 模型被定义为 ARMA(p, q)\n\n### 自回归模型\n\nARMA 模型根据其过去值的线性函数来预测时间序列。在 AR（自回归）模型中定义时间滞后，以预测时间序列的未来值。一个\
    \ AR 模型可由以下方程定义：\n\ny [t] = β [0] + β [1] y [t−1] + ϵ [t]\n\n其中，\n\n*   β [`0`]\
    \ , β [`1`]：Beta 系数\n*   `y` [`t-1`]：时间序列的滞后版本\n*   ϵ [`t`]：残差，假设其服从正态分布且在时间上是随机的\n\
    \n一个 AR 模型被定义为 AR(p, d)\n\nDavid 决定将 AR 模型应用于经过差分处理的对数变换时间序列。他知道，由于该技术不包含 'q'\
    \ 项，其值将为 0（即 q = 0）。他决定在代码清单 3-18 中，使用 p = 2 和 d = 1 的任意参数来应用 AR 模型。\n\n![A432778_1_En_3_Fig18_HTML.gif](img/A432778_1_En_3_Fig18_HTML.gif)\n\
    \n图 3-18.\n\n在对数变换差分处理时间序列上绘制 MA 模型平滑图\n\n```\nmodel = ARIMA(data_log, order=(2,\
    \ 1, 0), dates=data_log.index.to_datetime())\nresults_AR_210 = model.fit(disp=-1)\n\
    plt.plot(data_log_diff)\nplt.plot(results_AR_210.fittedvalues, color='red')\n\
    plt.title('RSS: %.4f'% sum((results_AR_210.fittedvalues-data_log_diff)**2))\n\
    代码清单 3-18.\n将 AR 模型应用于对数变换差分处理时间序列\n```\n\nDavid 确保在图 3-18 中绘制了原始的差分处理和对数变换时间序列，以及使用\
    \ AR 技术预测的时间序列。他很高兴看到该预测序列的 RSS 趋近于 0，这意味着模型在捕捉输入序列的方差方面相当准确。能以如此微小的 RSS 预测雅虎股票，对他来说是一个巨大的安慰。随后，他开始寻找其他技术，并发现了滑动平均技术。\n\
    \n### 滑动平均模型\n\nMA 代表滑动平均模型。MA 最适合处理单变量时间序列对象的情况。MA 通过基于当前和过去的时间序列值（这些值是随机的）进行训练来预测未来值。MA\
    \ 模型被定义为 MA(d, q)。\n\nMA 模型不包含 p 项；因此 David 将其初始化为 p = 0。David 决定将 MA 模型应用于对数变换差分处理时间序列，参数为\
    \ q = 1 和 d = 1。\n\n![A432778_1_En_3_Fig19_HTML.gif](img/A432778_1_En_3_Fig19_HTML.gif)\n\
    \n图 3-19.\n\n在对数变换差分处理时间序列上绘制 MA 模型平滑图\n\n```\nmodel = ARIMA(data_log, order=(0,\
    \ 1, 1), dates=data_log.index.to_datetime())\nresults_MA_011 = model.fit(disp=-1)\n\
    plt.plot(data_log_diff)\nplt.plot(results_MA_011.fittedvalues, color='red')\n\
    plt.title('RSS: %.4f'% sum((results_MA_011.fittedvalues-data_log_diff)**2))\n\
    代码清单 3-19.\n将 MA 模型应用于对数变换差分处理时间序列\n```\n\nDavid 注意到，在将 MA 应用于差分处理的对数变换时间序列后，RSS\
    \ 得分没有显著改善。他决定合并 AR 和 MA 模型，希望能得到一个更稳健的模型来预测雅虎股票。\n"
