- fmt: '# Evaluating the Stationary Nature of a Time Series Object


    David broke his plan into pieces. First he planned to see what properties a time
    series object should have for it to be stationary. Then he had to check if the
    data at hand was stationary; if it was not, he had to search for the techniques
    to make it stationary. David started off by pulling up the properties that make
    a time series object stationary.


    ## Properties of a Time Series Which Is Stationary in Nature


    Most of the time series models work on the assumption that data is stationary.
    Moreover, contrary theories related to stationary time series are easier to implement
    than non-stationary time series theories. A time series object is stationary if
    it has the following properties:


    - No trend exists

    - Mean remains constant over time

    - Variance remains constant over time

    - No autocorrelation exists. Autocorrelation is the correlation between the series
    at current time with a lagged version of itself.


    Once David knew the four properties a time series object should have for it to
    be stationary, he started to look for techniques to test if the time series data
    is stationary or not.


    ## Tests to Determine If a Time Series Is Stationary


    His search provided him with two methods for validation: exploratory data analysis
    and Dickey-Fuller test. The exploratory data analysis method can help detect the
    property of stationary within the Yahoo stock dataset.


    ### Exploratory Data Analysis


    This is more of a visual method of finding if the distribution is stationary.
    It encompasses the use of rolling mean and rolling variance to answer the underlying
    question. If these rolling metrics stay constant over time then the distribution
    will qualify as a stationary time series object. So, how is a rolling mean calculated?
    First we define the length of a subset over which rolling means have to be calculated
    (e.g., 5). Then we generate our own time series by averaging over the numbers
    in series in chunks of 5. Take, for example, a time series with the following
    values:


    - 10, 50, 34, -5, 15, 19, 1, -30, 16, 37


    Then the subsequent rolling mean will be as follows:


    - NA, NA, NA, NA, NA, 20.8, 22.6, 12.8, 0, 4.2, 8.6


    The same holds true for rolling variance except that instead of mean we will be
    calculating the variance at each instance.


    These rolling means will then be plotted on a time series plot. However, by looking
    at the rolling means above we can deduce that the values seem to vary a lot and
    are not at all constant. Hence, the time series shown in the example above is
    not stationary.


    Despite the fact that the first method seemed straightforward and easy to implement,
    David was looking for a statistical technique that would enable him to validate
    if the time series object is stationary or not. His search also brought him to
    the Dickey-Fuller test.


    ### Dickey-Fuller Test


    This is more of a statistical approach of checking if the time series object is
    stationary or not. The test in its null hypothesis assumes the time series object
    to be non-stationary. Once applied to a given time series object, the Dickey-Fuller
    test returns the test statistics and critical values at different confidence intervals.
    If the value of test statistics is lower than that of the critical value, then
    the null hypothesis does not hold true and we opt for the alternative hypothesis
    (i.e., that the time series object is stationary).


    Once he knew what properties make a time series object stationary, and after looking
    through the techniques to identify it, David decided to check if the data at hand
    was stationary or not. Thus he came up with the code snippet in Listing [3-4](#A432778_1_En_3_Chapter.html#Par39).


    ```

    def evaluate_stationarity(timeseries, t=30):

    #Determing rolling statistics

    rolmean = timeseries.rolling(window=t).mean()

    rolstd = timeseries.rolling(window=t).std()

    #Plot rolling statistics:

    orig = plt.plot(timeseries, color=''blue'',label=''Original'')

    mean = plt.plot(rolmean, color=''red'', label=''Rolling Mean'')

    std = plt.plot(rolstd, color=''black'', label = ''Rolling Std'')

    plt.legend(loc=''best'')

    plt.title(''Rolling Mean & Standard Deviation'')

    plt.show(block=False)

    #Perform Dickey-Fuller test:

    print ''Results of Dickey-Fuller Test:''

    dftest = adfuller(timeseries, autolag=''AIC'')

    dfoutput = pd.Series(dftest[0:4], index=[''Test Statistic'',''p-value'',''#Lags
    Used'',''Number of Observations Used''])

    for key,value in dftest[4].items():

    dfoutput[''Critical Value (%s)''%key] = value

    print dfoutput

    Listing 3-4.

    Method to Evaluate If a Time Series Object Is Stationary

    ```


    Writing the code snippet in Listing [3-4](#A432778_1_En_3_Chapter.html#Par39)
    was not an easy task for David, who didn''t have considerable experience in programming.
    He knew that this functionality of time series validation is subject to being
    reused again and again. Hence he wrote the code in a function so that he could
    use this functionality whenever needed. He decided to document whatever code he
    had written so that he could refer to it later, when he faced difficulty in understanding
    it. As he recalled:


    > By default I initialized the window size ''t'' to 30, that is, a month. Then
    I calculated the rolling mean and rolling standard deviation of our time series
    object. Next I plotted the time series, rolling mean, and rolling standard deviation
    together to apply the exploratory data analysis method into practice. This I knew
    would enable me to determine if the time series object is stationary or not. Later
    I decided to also try the statistical test for detection and brought the Dickey-Fuller
    test into application. I made sure to print the output of the Dickey-Fuller test
    and determine the critical intervals from the confidence interval.


    Now that David had defined the method in Listing [3-4](#A432778_1_En_3_Chapter.html#Par39),
    he decided to call it and pass the time series object as a parameter while keeping
    the window size ‘t’ to 15 (i.e., two weeks). He called the `evaluate_stationary`
    method as shown in Listing [3-5](#A432778_1_En_3_Chapter.html#Par43).


    ```

    evaluate_stationarity(data_train[''Close_Adj''], 15)

    Listing 3-5.

    Using the Method to Test If Time Series Object Is Stationary

    ```


    Output


    ![A432778_1_En_3_Fig2_HTML.gif](A432778_1_En_3_Fig2_HTML.gif)


    Figure 3-2. Plot of rolling mean and standard deviation of time series object


    ```

    Results of Dickey-Fuller Test:

    Test Statistic                 -1.114302

    p-value                        0.709335

    #Lags Used                     0.000000

    Number of Observations Used    188.000000

    Critical Value (5%)            -2.877040

    Critical Value (1%)            -3.465620

    Critical Value (10%)           -2.575032

    dtype: float64

    ```


    While looking at the exploratory data analysis in Figure [3-2](#A432778_1_En_3_Chapter.html#Fig2),
    David noticed that despite the variation in rolling standard deviation being small,
    rolling mean clearly seems to relatively vary a lot. Hence he deduced the time
    series object to be non-stationary. He then looked at the output of the Dickey-Fuller
    test to see if it depicts the same result as well. He noticed the test statistic
    to be greater than the critical values; hence he failed to reject the null hypothesis,
    which meant that the data is non-stationary in nature.


    The time series object being non-stationary meant that now the path to forecasting
    was no longer straightforward. He would first have to make the time series object
    stationary before he could apply forecasting to it. Hence he did some research
    and came up with several methods to make a time series object stationary.'
