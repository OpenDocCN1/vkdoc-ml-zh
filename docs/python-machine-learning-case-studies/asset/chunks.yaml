- fmt: '### Real Estate Industry


    The price of real estate can be predicted from size in square feet of a property,
    number of rooms, availability of parking, square feet of open space, number of
    miles from main road, and so on (see Figure [2-33](#A432778_1_En_2_Chapter.html#Fig33)).


    ![A432778_1_En_2_Fig33_HTML.gif](A432778_1_En_2_Fig33_HTML.gif)


    Figure 2-33. Predicting property as a function of size in feet


    To sum up this chapter, Claire and Smith at first came up with a consensus to
    use regression for predicting concrete strength. They planned to do so by means
    of a regression equation in order to avoid the costs of procuring testing equipment
    to measure it. They started off with the analysis by at first understanding the
    correlations that exist among concrete strength and exploratory variables. The
    ones exhibiting a positive or negative correlation were used for regression modeling.
    Moreover, correlations helped discover the multicollinearity that existed among
    the three exploratory variables.


    Regression model evaluation metrics were looked at and `R²` was picked for evaluating
    the regression models. They looked at what grid search is and how to apply it
    to determine the best parameter values for best tuning the model. They split the
    data into test and train subsets to enable cross-validation. Among the many regression
    techniques applied, single gradient boosting regressor exhibited the best `R²`
    values. Hence by the end of the analysis Smith and Claire had the following three
    models which they could use in isolation to predict concrete strength.


    At first Claire defined the use case of the gradient boosting regressor model
    which takes cement component as an input to predict concrete strength. She recalled
    from the output of Listing [2-14](#A432778_1_En_2_Chapter.html#Par241) that the
    confidence level of this regression model is approximately 34%.


    ```

    feature = ''cement_component''

    cc_new_data = [213.5]

    data_tr = data[[''concrete_strength'', feature]]

    data_tr=data_tr[(data_tr.T != 0).all()]

    x_train, y_train, x_test, y_test = split_train_test(data_tr, feature)

    regr = GradientBoostingRegressor()

    # Train the model using the training sets

    regr.fit(x_train, y_train)

    cs_pred = regr.predict(cc_new_data)

    print ''Predicted value of concrete strength: %f''%cs_pred

    ```


