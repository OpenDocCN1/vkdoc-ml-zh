    the seasonality and trend components present in the time series object.


    Hence David started off by concentrating on the first goal—that is, formulating
    a time series forecasting model that captures the components of Yahoo stock time
    series at its best. He recalled from his corporate finance course that they used
    to apply time series methods for stock forecasting. He did some research to understand
    what time series modeling is, and when it should be preferred .


    ### Time Series Modeling


    Data points collected at fixed period time intervals constitute a time series.
    Time series analysis is usually done with the objective of forecasting the long-term
    trend over time as per the problem’s underlying hypothesis.


    It was Friday and David was now looking forward to the weekend with his friends
    and family. He was also excited about meeting his friend Maria, who had been his
    batch mate in school, whose research was inclined toward statistics.


    It was Saturday, and David was having lunch with Maria at a famous fast-food restaurant.
    Without wasting much time, David brought up the problem and how he was planning
    on solving it. He knew that it was better to do due diligence in the analysis
    initially to conclude fruitful research. Thus he was interested to hear from Maria
    regarding the statistical concepts and techniques essential to time series analysis
    that he should incorporate before moving forward, Maria recommended that he check
    if his time series data was stationary as a majority of the time series models
    are designed to give results on stationary data.'
