    ## Introduction


    This volume embraces machine learning approaches and Python to enable automatic
    rendering of rich insights and solutions to business problems. The book uses a
    hands-on case study-based approach to crack real-world applications where machine
    learning concepts can provide a best fit. These smarter machines will enable your
    business processes to achieve efficiencies in minimal time and resources.


    `Python Machine Learning Case Studies` walks you through a step-by-step approach
    to improve business processes and help you discover the pivotal points that frame
    corporate strategies. You will read about machine learning techniques that can
    provide support to your products and services. The book also highlights the pros
    and cons of each of these machine learning concepts to help you decide which one
    best suits your needs.


    By taking a step-by-step approach to coding you will be able to understand the
    rationale behind model selection within the machine learning process. The book
    is equipped with practical examples and code snippets to ensure that you understand
    the data science approach for solving real-world problems.


    `Python Machine Leaarning Case Studies` acts as an enabler for people from both
    technical and non-technical backgrounds to apply machine learning techniques to
    real-world problems. Each chapter starts with a case study that has a well-defined
    business problem. The chapters then proceed by incorporating storylines, and code
    snippets to decide on the most optimal solution. Exercises are laid out throughout
    the chapters to enable the hands-on practice of the concepts learned. Each chapter
    ends with a highlight of real-world applications to which the concepts learned
    can be applied. Following is a brief overview of the contents covered in each
    of the five chapters:


    - Chapter [1](#A432778_1_En_1_Chapter.html) covers the concepts of statistics
    and probability.

    - Chapter [2](#A432778_1_En_2_Chapter.html) talks about regression techniques
    and methods to fine-tune the model.

    - Chapter [3](#A432778_1_En_3_Chapter.html) exposes readers to time series models
    and covers the property of stationary in detail.

    - Chapter [4](#A432778_1_En_4_Chapter.html) uses clustering as an aid to segment
    the data for marketing purposes.

    - Chapter [5](#A432778_1_En_5_Chapter.html) talks about classification models
    and evaluation metrics to gauge the goodness of these models.


    ## Acknowledgments


    I would like to thank my parents and lovely wife for their continuous support
    throughout this enlightening journey.'
