    ## Applications of Regression


    Applications of regression are vibrant in several fields of study.


    ### Predicting Sales


    Regression can be used to predict the sales of a good or service such as demand
    analysis (Figure [2-31](#A432778_1_En_2_Chapter.html#Fig31)).


    ![A432778_1_En_2_Fig31_HTML.gif](A432778_1_En_2_Fig31_HTML.gif)


    Figure 2-31. Prediction of retail sales and personal income


    Historical data of sales can be used to extrapolate the results for the future.
    Features like marketing costs, merchandizing, price, and number of stock keeping
    units (SKUs) can be given as the exploratory variables to the model.


    ### Predicting Value of Bond


    Inflation rate at different times can be used to predict bonds'' value. This can
    be the game changer when estimating the expected return from a portfolio that
    includes bonds.


    ### Rate of Inflation


    In economics we have the concepts of rate of inflation and theory of money supply.
    If a researcher believes the rate of inflation to be a function of the amount
    of money supply in the economy then what can he do? He can make rate of inflation
    as a response variable and the supply of money as the exploratory variable (see
    Figure [2-32](#A432778_1_En_2_Chapter.html#Fig32)).


    ![A432778_1_En_2_Fig32_HTML.gif](A432778_1_En_2_Fig32_HTML.gif)


    Figure 2-32. Prediction of inflation rates


    ### Insurance Companies


    These companies use regression to predict the amount of people who might reclaim
    their health insurance or life insurance, or the number of people who might have
    accidents in their insured vehicles.


    ### Call Center


    A call center manager might want to know the increase in number of complaints
    as a function of the call waiting times.


    ### Agriculture


    Regression can be used to predict the number of fruits that a given region is
    expected to yield. Possible exploratory variables can be the amount of rainfall,
    hours of sunshine, number of diseases affecting crops, number of affected crops
    by fire or diseases, quality index of soil, land fertility index, and so on.


    ### Predicting Salary


    Universities can use a predictive model to forecast the salary of students. Possible
    exploratory variables can be grades, number of competitions participated in, seat
    placement in the class, number of internships done, number of research papers
    published, number of projects done, number of sport events participated in, and
    so on.'
