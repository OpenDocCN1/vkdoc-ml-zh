    大卫查看了珍妮丝的投资组合，开始逐一分析每只股票在上季度的表现。他发现投资组合收益与预期收益不匹配的原因，在于雅虎股票预测存在巨大残差。如果该股票数量在整个投资组合中占比很小，这种预测误差的影响本可忽略不计，但当前情况并非如此。


    大卫回想起在哈佛商学院学习公司金融和商业分析课程时的内容，决定尝试运用这些概念来寻找解决方案。他应该使用回归分析还是时间序列分析？哪些技术可以应用于雅虎股票的预测？


