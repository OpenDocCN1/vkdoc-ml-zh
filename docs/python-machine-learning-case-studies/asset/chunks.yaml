    p-value                          0.705121

    #Lags Used                       0.000000

    Number of Observations Used     188.000000

    Critical Value (5%)             -2.877040

    Critical Value (1%)             -3.465620

    Critical Value (10%)            -2.575032

    dtype: float64

    ```


    大卫从图 3-5 中得出以下结论：


    > 如上图所示，滚动均值和标准差看似恒定，但与我们在对数变换序列图中看到的相比，恒定程度并不高。这就是在此次迪基-富勒检验结果中，检验统计量大于临界值的原因，这意味着原假设成立，对数变换后的对象本质上是非平稳的。


    对数变换和平方变换未能使手头的时间序列对象更接近平稳性质。对数变换确实有助于缩小时间序列对象的尺度并使其更平坦。因此，大卫决定将其他方法应用于对数变换后的序列，以使其平稳。他开始寻找统计学界推荐的其他变换方法，就在这时他了解到了立方变换。然而，他该下班回家了，因此他请求你在业余时间应用立方变换，并将结果分享给他。


    练习


    1.  确定我们时间序列的立方变换。它是否改善了检验统计量的值？


    新的一天开始了，大卫继续执行他的短期任务——将时间序列对象的性质转变为平稳的。在变换方法失败后，他正在寻找其他能够帮助他实现短期目标的技术。他重新开始，审视了图
    3-1 中时间序列对象的初始图。就在这时，一个想法浮现在脑海中：如果他从数据中移除上升趋势使其平稳，会怎么样呢？


    #### 估计趋势并将其从原始序列中移除


    他知道这个方法分为两步：首先需要估计趋势，然后将其从雅虎股票时间序列对象中移除。他开始寻找估计趋势的技术，幸运地找到了两种方法：移动平均平滑和指数加权移动平均。他从移动平均平滑开始。

