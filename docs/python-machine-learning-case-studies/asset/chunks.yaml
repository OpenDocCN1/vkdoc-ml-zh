    #### Durbin Watson Statistic


    Contrary to the autocorrelation correlogram, Durbin Watson statistic is more of
    a statistical approach to determining the existence of autocorrelation within
    the data. It does so by computing autocorrelation among residuals from a statistical
    regression analysis. It returns a number between 0 and 4 where 0 depicts strong
    positive autocorrelation, 4 depicts strong negative autocorrelation, and 2 depicts
    no autocorrelation at all.


    While doing the research on autocorrelations, David recalled reading that differencing
    can be used to eradicate ACF and PACF. Having already applied differencing on
    the log transformed time series object, David was expecting no presence of ACF
    and PACF. At first he planned to check for the presence of autocorrelation using
    the Durbin Watson statistics method in Listing [3-16](#A432778_1_En_3_Chapter.html#Par120).


