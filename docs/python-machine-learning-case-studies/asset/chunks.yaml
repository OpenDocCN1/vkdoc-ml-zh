    清单 1-9 中的代码片段揭示了一些之前未强调的新方面。


    > 我们首先通过取消堆叠（即拆分）的方式，将性别列转换为三列：男性、女性和其他。这意味着对于每个出生年份，我们都有了三种性别类型的出行次数。最后，使用这个转换后的数据框创建了一个堆叠柱状图。


    看起来男性在分布中占主导地位。这也很合理，不是吗？嗯，确实如此；正如之前所见，大多数出行是由男性完成的，因此这导致了分布偏向男性。然而，出生于 1947 年的订阅者全是女性。此外，出生于
    1964 年和 1994 年的订阅者也以女性为主。因此，南希的假设和推理确实成立。


    清单 1-4 中的分析显示，所有千禧一代都是会员。南希好奇其他年龄段的用户类型分布是怎样的。其他年龄段的大多数人是否都是短期通行证持有者？因此，埃里克再次在应用中引入了堆叠柱状图（见图
