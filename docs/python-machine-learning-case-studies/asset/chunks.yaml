    \ on supervised and unsupervised learning methods .\n\n## Supervised vs. Unsupervised\
    \ Learning\n\nMachine learning algorithms are usually divided into supervised\
    \ and unsupervised learning.\n\n![A432778_1_En_4_Fig1_HTML.gif](A432778_1_En_4_Fig1_HTML.gif)\n\
    \nFigure 4-1.\n\nSupervised vs. unsupervised learning\n\nRoss came up with an\
    \ explanation for both these methods.\n\n### Supervised Learning\n\nAs the name\
    \ suggests, supervised learning algorithms require supervision for them to train\
    \ the model. This supervision is usually necessary in the case of classification\
    \ where we have labeled data on which we train the model for it to predict the\
    \ labels of the unseen data. Here, the supervision is by means of the label provided\
    \ with each and every observation (i.e., supervising the learning process). Examples\
    \ include classification for discrete predictors and regression for the continuous\
    \ ones.\n\n### Unsupervised Learning\n\nUnsupervised learning algorithms require\
    \ no supervision from the data while training the model. A prime example of this\
    \ is clustering, which discovers the labels without any supervision needed. These\
    \ discovered labels then become the basis for classifying any new unseen data.\
    \ Another example of unsupervised learning is the rule of association, which entails\
    \ the concepts of complement and substitute. Complement refers to a phenomenon\
    \ whereby if a shopper buys X then, with a high degree of certainty, he will buy\
    \ Y as well. Substitute refers to a behavior whereby a shopper will buy either\
    \ X or Y.\n\nOther examples include anomaly detection, method of moments (e.g.,\
    \ mean and covariance), independent component analysis, and principle component\
    \ analysis (PCA).\n\nRoss had to decide on which of the two is suitable for his\
    \ problem at hand and the available data. From the data in Table [4-2](#A432778_1_En_4_Chapter.html#Tab2),\
    \ he noticed that the dataset provided no labeled data. This meant that he had\
    \ to predict labels from scratch using unsupervised learning.\n\nRoss was assuming\
    \ that clustering, being an unsupervised learning method, could help him find\
    \ the correct segments to meet the marketing goals. However, he wasn't too sure\
    \ if clustering was the right approach to pursue. Hence he came up with the following\
    \ material on the topic.\n\n## Clustering\n\nCluster analysis refers to the grouping\
    \ of observations so that the objects within each cluster share similar properties,\
    \ and properties of all clusters are independent of each other. Cluster algorithms\
    \ usually optimize by maximizing the distance among clusters and minimizing the\
    \ distance between objects in a cluster. Cluster analysis does not complete in\
    \ a single iteration but goes through several iterations until the model converges.\
    \ Model convergence means that the cluster memberships of all objects converge\
    \ and don’t change with every new iteration. Some clustering algorithms don’t\
    \ ask for the number of clusters/components, and come up with the number of clusters\
    \ that statistically make more sense. However, a huge chunk of clustering algorithms\
    \ prompt the user upfront for the number of clusters/components he desires in\
    \ the output. It is important to understand that clustering, just like classification,\
    \ is used to segment the data; however, these groups are not previously defined\
    \ in the training dataset (i.e., they are unlabeled data).\n\nDifferent algorithms\
    \ deploy different techniques for the computation of clusters. Some of those techniques\
    \ are as follows:\n\n*   Partitioning: Groups data into given number of clusters\
    \ while optimizing for the objective (e.g., distance).\n*   Hierarchical: Groups\
    \ data into a hierarchy of clusters. These hierarchies are formed top-down or\
    \ bottom-up.\n*   Grid-based: Divides the data into hyper-rectangle cells, discards\
    \ low-density cells, and combines high-density cells to form clusters.\n\nA good\
    \ clustering algorithm satisfies the following requirements :\n\n*   Within-cluster\
    \ similarity and between-cluster dissimilarity\n*   Can deal with training dataset\
    \ which is:\n    *   Of a high dimension\n    *   Affected by noise and outliers\n\
    \nRoss now had some knowledge of supervised and unsupervised models; however,\
    \ he was not sure if clustering could be applied to data that is textual in nature.\
    \ Moreover, he knew that the greater the number of features fed in, the higher\
    \ the chances to discover features that influence during the cluster discovery\
    \ process. Hence he had to figure out a way to convert textual data into numeric\
    \ form and use the existing four features to generate more features."
