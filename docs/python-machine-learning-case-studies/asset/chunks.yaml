    平均转换后行程时长的频率分布


    由于对异常值进行了均值转换，南希原本预期平均值会与清单 1-22 中的相同。在图 1-16 中，她知道 711.7 处的峰值是众数，这意味着转换后平均值与众数相同。最让她惊讶的是中位数正在接近平均值，这表明我们在图
