- fmt: '### Methods of Making a Time Series Object Stationary


    Though several methods of doing the job exist, none of them promises to make the
    time series object completely stationary. What these methods do is to transform
    the time series object to make it look closer to a stationary object. The methods
    do this by removing trend and seasonality from the time series object. Following
    are some of the methods that can make a time series object closer to a stationary
    object:


    - Applying transformations

    - Estimating trend and removing it from the original series

    - Differencing

    - Decomposition


    David decided to apply all these methodologies one by one to determine the one
    that can make the time series object as stationary as possible. He started off
    by looking at how applying transformations can help achieve this short-term objective.


    #### Applying Transformations


    Transformations like log, cube root, and square root penalize larger values and
    thus can enable the series to become stationary. David decided to apply each of
    these transformations to figure out the one that makes this time series object
    almost stationary. He started off with log transformation.


    ##### Log Transformation


    David wrote the code snippet in Listing [3-6](#A432778_1_En_3_Chapter.html#Par56),
    to see if log transformation can yield a time series which is stationary in nature.


    ```

    data_log = np.log(data_train[''Close_Adj''])

    evaluate_stationarity(data_log, 15)

    Listing 3-6.

    Applying Log Transformation to Time Series Object

    ```


    Output


    ![A432778_1_En_3_Fig3_HTML.gif](A432778_1_En_3_Fig3_HTML.gif)


    Figure 3-3. Log transformed time series along with rolling mean and standard deviation


    ```

    Results of Dickey-Fuller Test:

    Test Statistic                  -1.136109

    p-value                         0.700460

    #Lags Used                      0.000000

    Number of Observations Used     188.000000

    Critical Value (5%)             -2.877040

    Critical Value (1%)             -3.465620

    Critical Value (10%)            -2.575032

    dtype: float64

    ```


    Looking at Figure [3-3](#A432778_1_En_3_Chapter.html#Fig3), David noticed that
    the transformation did work as it managed to make the rolling mean and rolling
    standard deviation constant. However, he was astonished to see that the Dickey-Fuller
    test proved otherwise (i.e., the transformed series is still non-stationary).
    He deduced this after noticing the test statistics to be greater than the critical
    values which meant that the null hypothesis holds true and the log transformed
    object is non-stationary in nature. He was curious to know why both methods produced
    results contradicting each other. The only explanation he could think of was that
    the rolling mean, though it seems constant, might vary once he zoomed into Figure
    [3-3](#A432778_1_En_3_Chapter.html#Fig3). Hence he added some lines of code as
    shown in Listing [3-7](#A432778_1_En_3_Chapter.html#Par60).


    ![A432778_1_En_3_Fig4_HTML.gif](A432778_1_En_3_Fig4_HTML.gif)


    Figure 3-4. Plot of a zoomed figure of rolling mean from a log transformed distribution


    ```

    data_log = np.log(data_train[''Close_Adj''])

    #Determing rolling statistics

    rolmean = data_log.rolling(window=15).mean()

    rolstd = data_log.rolling(window=15).std()

    #Plot rolling statistics:

    orig = plt.plot(data_log, color=''blue'',label=''Original'')

    mean = plt.plot(rolmean, color=''red'', label=''Rolling Mean'')

    std = plt.plot(rolstd, color=''black'', label = ''Rolling Std'')

    plt.legend(loc=''best'')

    plt.ylim([7.4,7.8])

    plt.title(''Rolling Mean & Standard Deviation'')

    plt.show(block=False)

    Listing 3-7.

    Zooomed Figure of Rolling Mean from a Log Transformed Distribution

    ```


    The zoomed figure in Figure [3-4](#A432778_1_En_3_Chapter.html#Fig4) revealed
    rolling mean to be varying and not at all constant against time. According to
    David, this reasoning showed that the results from the Dickey-Fuller test demonstrated
    that the transformed series is non-stationary. Log transformation failed to make
    the object stationary in nature, and thus David moved to square root transformation
    as the next resort.


    ##### Square Root Transformation


    David applied square root (Sqrt) transformation to Yahoo stock data by writing
    the script in Listing [3-8](#A432778_1_En_3_Chapter.html#Par63).


    ```

    data_sqrt = np.sqrt(data_train[''Close_Adj''])

    evaluate_stationarity(data_sqrt, 15)

    Listing 3-8.

    Applying Sqrt Transformation to Time Series Object

    ```


    Output


    ![A432778_1_En_3_Fig5_HTML.gif](A432778_1_En_3_Fig5_HTML.gif)


    Figure 3-5. Sqrt transformed time series along with rolling mean and standard
    deviation


    ```

    Results of Dickey-Fuller Test:

    Test Statistic                   -1.124704

    p-value                          0.705121

    #Lags Used                       0.000000

    Number of Observations Used     188.000000

    Critical Value (5%)             -2.877040

    Critical Value (1%)             -3.465620

    Critical Value (10%)            -2.575032

    dtype: float64

    ```


    David deduced the following from Figure [3-5](#A432778_1_En_3_Chapter.html#Fig5):


    > Rolling mean and standard deviation seem constant as we see the plot above,
    but not much as compared to what we saw in the log transformed series plot. This
    is the reason that in the results of this Dickey-Fuller test, test statistics
    is greater than the critical values, which means that the null hypothesis holds
    true and the log transformed object is non-stationary in nature.


    Log and square transformation weren’t able to make the time series object at hand
    closer to a stationary nature. Log transformation did help to scale down the time
    series subject and make it more flat. Hence, David decided to apply other methods
    to the log transformed series to make it stationary. He started looking for other
    transformations recommended by the statistical community and that is when he learned
    about cube transformation. However, it was time for him to leave for home and
    he thus requested you to apply the cube transformation in your spare time and
    share the results with him.


    **Exercise**


    1. Determine the cube transformation of our time series. Does it improve the value
    of the test statistic?


    It was a new day and David resumed with his short-term mission of transforming
    the nature of the time series object to a stationary one. Having failed with the
    transformation methodologies, he was in search of other techniques that could
    help him achieve his short-term objective. He started afresh and started looking
    at the initial plot of the time series object in Figure [3-1](#A432778_1_En_3_Chapter.html#Fig1).
    It was then that an idea came to mind: what if he removed the upward trend from
    the data to make it stationary.


    #### Estimating Trend and Removing It from the Original Series


    He knew that the approach was two-fold: at first he would need to estimate the
    trend and then remove it from the Yahoo stock time series object. He started looking
    for techniques for estimating trends and luckily he found two methods: moving
    average smoothing and exponentially weighted moving average. He started off with
    moving average smoothing.'
