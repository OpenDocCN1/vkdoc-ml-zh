  \ QoS 分数——而分类则使用了 K 近邻（KNN）模型。本章对本书中用于网络流量指标分类和预测的所有算法，以及视频质量 MOS 分数的生成，进行了详尽的数学分解。\n\
  \n## 4.1 用于 NTMA 的分类模型\n\n在本书中，针对网络流量的两种机器学习方法是分类和预测，其中分类使用 K 近邻（KNN）模型实现。本节将详细阐述该算法，它允许最终用户获取设备在网络上的实时活动状态，该状态分为三大类。\n\
  \n### 4.1.1 分类的数据收集\n\n分类的第一步包括对收集到的数据进行预分类，因为目标是预测通常属于不同组别或类别的结果。具体来说，不同的用户活动，如“空闲”、“浏览”和“流媒体”，是基于实时网络流量来确定的。因此，会捕获这些预定义网络上下文中的参数，以构建训练数据集。在这种情况下，记录的值会根据以下状态，按照最可能的流量类型进行分类：\n\
  \n*   **空闲**：数据收集设备未主动向其网络接口发送或从网络接口接收任何与网络相关的指标，但通过社交媒体应用的通知或消息观察到的一些峰值除外。否则，网络特征保持相当稳定且接近于零。\n\
  \n*   **浏览**：包括网页浏览以及在 Facebook 和 Google News 等社交媒体应用上滚动浏览，通常观察到网络流量具有不稳定的特性，并伴有频繁的峰值。浏览可被视为中等使用强度。\n\
  \n*   **流媒体**：设备用于在 Twitch 或 YouTube 等平台上流式传输视频，同时收集网络流量。这通常会导致高带宽使用，具体取决于平台和所观看视频的质量。\n\
  \n在三维空间中，此类网络流量分类数据集的一部分（包含另一个参数，即“接收的数据包”）如图 4-1 所示。\n\n![](img/612428_1_En_4_Fig1_HTML.jpg)\n\
  \n一个下载速度与上传速度与接收数据包的三维散点图，绘制了空闲、浏览和流媒体三种状态的三个散点数据点。\n\n图 4-1\n\n设备活动状态的三维表示\n\n\
