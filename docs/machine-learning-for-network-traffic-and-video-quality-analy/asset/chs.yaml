  \ 分辨率直播，网络状况最佳，视频质量尚可\n\n## 7.5 总结\n\n随着 NTMA 和 VQA 应用的完成，第 7 章深入探讨了它们的集成，使得这两种功能能够在\
  \ Web 浏览器内的单个应用中同时可用。因此，对两个独立进程所使用的客户端、服务器和 Servlet 文件进行了适当修改，以适应更改后的布局以及一个可执行两种功能的按钮。本章连接了这两个领域，使最终用户能够实时获取网络性能的全局视图，包括预测分析、设备活动分类、网络\
  \ QoS 评分和视频质量评分。以下是一些关键要点：\n\n*   一个统一的系统可用于全面监控和分析网络流量与视频质量，并具备实时能力。\n\n*   集成式\
  \ NTMA 和 VQA 应用包含一个系统模型，具有客户端、服务器和 Servlet 范式，并遵循前几章所述的相同原则。\n\n*   作为未来工作，可以采用其他技术对现有算法进行比较和评估。例如，可以探索支持向量机（SVM）、随机森林或梯度提升机（GBM）等其他机器学习算法，以评估它们在\
  \ NTMA 和 VQA 任务中的性能。\n\n*   集成式 NTMA 和 VQA 应用可用于分析不同类型的网络，例如 4G（LTE）、5G 和 Wi-Fi\
  \ 网络，其指标可作为进一步分析的统计数据。通过实时预测网络流量参数，电信运营商可以在问题实际发生之前调查下载和上传速度的突然下降。\n\n*   在网络环境中多台\
  \ PC 上部署集成应用，使得可以通过观察网络和视频评分进行多次测试以评估其性能。\n\n*   该应用可作为第一层诊断工具，用于识别抖动和 MOS 评分等指标与正常值的偏差，电信公司可利用此工具立即定位需要处理、调查和优先处理的指标。\n\
  \n*   监管机构可将该集成应用作为执行无偏 QoS 测量的手段。——第 7 章\n\n\n\n索引 A 绝对类别评级 (ACR) 方法 AccepTV 视频质量监控器\
