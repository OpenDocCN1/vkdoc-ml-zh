  ### 3.1.11 视频质量数据库与基准测试


  视频质量数据库和基准测试对于 VQA 的进步至关重要，因为它们充当了计算评估的持续测试平台和数据集。以下是一些视频质量数据库：


  *   **LIVE 视频质量挑战数据库 (LIVE-VQC)**：包含一个庞大的视频库，涵盖了广泛的分辨率和内容类别 [38]。


  *   **TID2013**：旨在处理失真的照片和视频，为算法评估提供了广泛的难度。其内容包含了刻意引入的退化，模拟了现实中质量下降的情况 [39]。


  *   **YouTube UGC 数据集 (YouTube-UGC)**：旨在协助推进用户生成内容（UGC）视频质量评估和视频压缩的研究 [40]。


  *   **Netflix 视频多方法评估融合 (VMAF) 数据集**：由 Netflix 创建，该数据集涵盖了广泛的素材，包括不同复杂程度的视频。它对于评估专为流媒体服务定制的
  VQA 算法高度相关 [41]。


  同样地，接下来介绍一些基准测试方法 [42]：


  *   **标准化测试协议**：基准测试方法用于构建统一的评估协议，以保证一致性和可重复性。这些指南确立了测试算法的标准，确保评估的公正性和可比性。


  *   **作为参考点的客观指标**：通过诸如 PSNR 和 SSIM 等方法，这些指标为评估 VQA 模型的精度提供了可衡量的标准。


  同样，这里列出了关于 VQA 数据集的主要挑战和考量因素：


  *   **可扩展性**：每年都有采用突破性进步和新视频分辨率的新显示器进入市场，这要求 VQA 模型在性能上始终保持同步。


  *   **真实性与多样性**：所有测试环境中的观看条件必须保持一致，以消除偏差。


  *   **时间与空间可变性**：视频内容包含时间模式的变化和空间复杂度的差异，这对 VQA 算法构成了障碍，要求模型更加复杂并能有效适应各种情况。


  ### 3.1.12 VQA 中的时间与空间考量


  VQA 中的时间因素涉及内容随时间的变化及其对观众感知的影响。而空间问题则适用于特定帧的静态特征。表 3-4 讨论了在 VQA 领域中需要考虑的属性类型 [43,
  44]。


  表 3-4


  VQA 领域中需要考虑的属性类型


  | 考量维度 | 属性 | 描述 |

  | --- | --- | --- |

  | **时间** | 帧率与运动 | 帧率的提高有助于运动平滑度，减少运动模糊的发生，并提升视觉清晰度。 |

  | 时间一致性 | 帧率的波动或不规则会干扰观众的沉浸感，导致明显的质量下降。 |

  | 动态场景变化 | 频繁且突然的场景转换要求算法能够灵活应对内容的突变。 |

  | **空间** | 分辨率与细节 | 更高的分辨率意味着更丰富的细节，提升了可视化的水平和感知质量。 |

  | 压缩伪影 | 识别诸如模糊和块效应等伪影对于 VQA 模型至关重要。 |

  | 宽高比与构图 | 将空间特征与美学规范对齐可以增强观看体验。 |

  | **演进** | 自适应比特率流媒体 (ABS) | 网络状况与流媒体服务的性能密切相关，而 ABS 已经在可用带宽和流媒体质量之间架起了桥梁。 |

  | 用于时间分析的机器学习 | 寻找运动模式、场景变化和帧率波动。 |

  | 空间压缩技术 | 可以使用诸如高效视频编码 (HEVC) 之类的方法来提高空间压缩效率。 |


  ### 3.1.13 面向不断演进的视频内容的 VQA


  视频内容行业在不断发展，新的格式、平台、功能层出不穷，用户生成内容（UGC）也越来越受欢迎 [45]。传统的 VQA 方法可能并不总能轻易适应这些新的内容格式，例如在
  UGC 的情况下，用户使用来自极其庞大设备池的智能手机，这增加了评估视频质量的复杂性 [46]。本节探讨了新 VQA 模型的方法和要求，具体如下：


  *   **短视频**：作为当今最具吸引力的多媒体内容类型之一，像 TikTok 这样的平台引入了能够吸引用户注意力的短视频，并拥有基于观看历史推荐视频的独特算法。强大的
  VQA 算法需要彻底解决内容类型、编辑风格和用于录制视频的设备种类繁多的问题 [47]。


  *   **交互式与沉浸式内容**：超越标准的线性格式，虚拟现实（VR）和增强现实（AR）融入了空间和交互组件，这要求 VQA 考虑这些因素如何影响用户体验。一些特性包括
  360 度视频特性、投影、编码压力、缓存压力、带宽压力以及停顿模式和编码质量的变化 [48]。


  *   **UGC 中的质量可变性**：视频充满了质量差异，从专业制作的视频到业余录制的视频，不一而足。


  *   **主观偏好**：不同类型的内容对最终用户的吸引力不同，例如体育、电影、喜剧、舞蹈、学习、健身、美食和潮流等类型。


  *   **使用人工智能进行 IPTV**：通过自动化分析、优化编码和增强反馈，人工智能可以利用机器学习和计算机视觉技术来识别和分类视频质量问题，例如模糊、块效应或卡顿。然后，它可以提供改进视频传输的实用建议
  [49]。同样，可以优化编码参数和压缩方案，从而在保持视频质量的同时，最大限度地减少带宽和存储需求。此外，自然语言处理（NLP）和情感分析可用于收集和动态分析观众的评论，作为满意度和偏好水平的反馈。


  *   **用于 IPTV 的区块链**：区块链中的智能合约和代币可以作为 VQA 过程的激励措施，允许参与者因其输入和反馈而获得奖励 [49]。点对点（P2P）网络可用于视频内容的分发和流式传输，从而减少对中央服务器和网络的依赖，并缓解拥塞。这将有助于提高网络的服务质量（QoS）。




  ## 3.2 现有的 VQA 应用


  多媒体领域以其不断变化的特性和日益增长的复杂性而闻名，即使在全球连接性不断增强的情况下，也需要持续努力来改善观众体验。当前的 VQA 应用提供了涵盖广播、流媒体、电信、视频会议和
  IPTV 等一系列服务的解决方案，使用定制化的先进算法来测量并保证最佳的视频质量 [50]。本节将深入探讨一些主流的现成软件选项，并分析它们的特点、影响力以及对
  VQA 社区的贡献。


  ### 3.2.1 Telestream 公司的 Sentry


  Sentry 是一款基于软件的质量监控产品，拥有显示被监控频道特性的高质量图形用户界面（GUI），可用于有线电视、广播和 OTT 流媒体服务（即通过互联网的流媒体服务）[51]。该框架的目标是监控所部署内容的质量，以便检测并解决任何影响视频质量的因素。其主要亮点之一包括在客户察觉之前对内容交付质量做出反应，以避免不满和投诉。该软件同时服务于广播和流媒体服务，此外还提供图像质量评估功能，可分析诸如块效应、噪声和模糊等参数，并生成信息丰富的图形化结果。根据用户需求，该软件提供不同版本，并可配置在云端、虚拟专用网络以及数据中心运行。该公司使用定制的
  TekMOS 机器学习算法，该算法基于亮度进行逐帧分析，以确定视频质量特性，然后生成 QOS 分数以及 TekMOS 图表。


  ### 3.2.2 ThinkTel 公司的实时媒体评估（RTMA）


  RTMA 首先对企业网络进行评估，收集有关网络容量和高峰时段的信息，以生成一份完整的报告。其考虑的指标包括延迟、抖动以及音频和视频服务的容量 [52]。其目标是为客户提供关于如何进一步优化其网络的建议，这些建议基于来自众多商业通信软件（如
  Microsoft Teams）的数据。后者在高峰时段可能会给网络资源带来压力，从而影响员工的 QoS。因此，RTMA 提供了容量规划，节省了成本和时间，并保证了改善的用户体验。该软件不包含机器学习功能，因为它主要侧重于数据收集。


  ### 3.2.3 Witbe


  作为全球 IPTV 领域领先的 QoE 监控工具之一，Witbe 通过部署配备 VQA 功能的机器人，掌握了机顶盒（STB）、移动设备和网络浏览器的自动化测试概念
  [53]。其强大的云模型允许进行视频捕获，并支持远程实时控制设备 [54]。个性化的脚本编写功能允许即时编写和部署场景。例如，可以通过配备特殊优化摄像头以执行
  VQA 的机器人来监控 Netflix 和 YouTube 等流媒体服务，从而生成专有的主观 MOS 分数，以及模糊和块效应等指标。Witbe 还涉足游戏领域，在谷歌的云游戏平台
  Stadia 上进行了测试 [55]。可用性、登录、登录时间、游戏可用性、游戏启动时间、可玩性以及 Witbe 的 VQ-MOS 分数等 KPI 是生成的部分指标，这些指标随后可在
  Witbe Datalab 上查看，该平台提供可定制的仪表板用于分析。订阅者还可以选择接收视频和音频问题的即时通知。这些警报随后会实时显示在 Witbe Remote
  Eye Controller 上，使 NOC 团队能够快速响应发现的任何问题。Witbe 的最新算法 Witbe VQ-ID [56]，还能计算视频无任何问题的持续时间，以及识别出严重视频和音频劣化（如宏块效应、模糊和饱和度）的时间。这些指标为营销团队和管理人员提供了高层次的
