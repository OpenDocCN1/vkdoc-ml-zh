  ### 1.2.4 VQA 的实际应用


  VQA 领域并不仅限于科学研究和技术评估。定量评估和提升视频质量的能力在众多行业领域具有多种实际应用。本节将探讨 VQA 已被证明特别实用的一些实际场景，包括以下方面：


  *   **娱乐与流媒体服务**：Netflix、Amazon Prime Video 和 Disney+ 等流媒体平台高度依赖视觉和音频质量来评估其 QoE。缓冲和压缩伪影（如噪声、块效应、模糊和卡顿）是可通过持续监测来衡量的视频质量下降示例。VQA
  也用于内容推荐框架，根据用户过去的观看历史，向其推荐符合喜好的类似节目或电影 [61]。


  *   **电信与广播**：对于通常依赖 IPTV 和 OTT 服务作为主要收入来源的电信提供商而言，服务监控仪表盘对于全面了解其广播的所有频道至关重要。这在主动排查流媒体问题、减少客户投诉电话数量方面尤其有帮助。同样，体育赛事和新闻等直播活动需要传输的确定性，这往往决定了最终用户是否会订阅该特定提供商。


  *   **医疗保健与医学影像**：医疗诊断的可靠性依赖于来自各种成像方式（包括 X 光、MRI 和超声波）的高质量视觉数据。为防止误诊，VQA 算法会仔细检查医学图像中是否存在任何失真或异常迹象，并向医学专家发出警报
  [62]。在该领域，保持高图像质量的重要性怎么强调都不为过。


  *   **教育与在线学习**：由于新冠疫情等全球性问题，教育领域对在线学习工具的使用急剧增加，并且至今仍在持续增长。通过存在于视频讲座、教程、交互式模拟以及涵盖大量学生的视频会议中的
  VQA 算法，可确保高质量的教育视频内容，从而监控并保证演示的连续性。


  *   **广告与营销**：随着对视频质量与目标受众之间关系的认识不断提高，营销人员和广告商在发布视频广告前使用 VQA 评估视频质量，确保专业性和对品牌卓越性的承诺，从而更有可能吸引并留住观众的注意力。


  *   **安防与监控**：来自监控摄像头的实时视频流可接受强大的 VQA 算法处理，以确保录制的画面不会因压缩或传输缺陷而出现问题，从而支持诸如基于 AI 的车牌检测等精确功能。


  *   **游戏与虚拟现实 (VR)**：游戏开发工作室高度依赖 VQA 来为玩家创造真正沉浸式的体验 [63]。随着高端游戏开发环境的兴起，玩家期望惊艳的视觉效果和完美的性能。因此，VQA
  通过视觉优化和质量一致性来辅助实现这一目标。


  这些实际应用展示了 VQA 对行业和日常生活的深远影响。VQA 通过确保视频素材的高质量交付（这持续占据媒体食物链的顶端），有助于提升用户满意度、生产力，甚至影响某些重要决策。


  ### 1.2.5 VQA 面临的挑战


  尽管取得了显著进展，VQA 仍面临若干持续存在的挑战，从人类感知的主观性到新视频格式的复杂性，因此需要不断进行研发。人类思维的本质使得感知非常主观且独特。对一位观众而言的高质量媒体，对另一位观众可能并非如此。在追求用于质量评估的客观指标时，VQA
  面临着一个根本性障碍，即主观性。需要持续努力，通过开发能够反映人类视角多样性的模型来弥合“主观性差距” [64]。同样，视频是不断演变的作品，包含变化的场景构图、动态元素和听觉线索。时间特性，如运动平滑度、同步性和一致性，对观众的愉悦感有重大影响，但
  VQA 难以对其进行分析。此外，随着 YouTube、TikTok、Reddit 和 Instagram 等应用上用户生成内容的激增，VQA 需要兼具可扩展性和普适性的需求正日益紧迫。跨海量数据集、在多种环境中、以可靠的方式及时评估来自各种来源的视频质量，是一项持续的挑战。这也与媒体从不同能力设备上传有关，因此会涉及不同的视频格式和编解码器，范围从
  4K 视频到 HDR，再到 360 度 VR 素材。VQA 必须不断发展以评估这些新形式的质量 [65]。


  然而，一个主要障碍仍然是，对于视频会议和直播等密集型应用，VQA 算法需要实时执行，这些应用涵盖大量客户端，从 Instagram Live 上的几百人到 Twitch
  游戏直播中的数千人。这可能会对计算能力提出很高要求，并且在低资源环境（如低配置 PC）中可能无法按计划工作。同样，还存在缺乏真实数据的问题，需要围绕每个平台独立构建数据集，这使得主观数据收集既耗时又成本高昂。某些算法在测量视频质量时还会考虑网络状况。这在自适应流媒体协议（如基于
  HTTP 的动态自适应流媒体 (DASH)）中有所体现。由于内容质量可能在流媒体传输过程中发生变化，VQA 必须足够灵活，以便在自适应流媒体环境中准确评估不断变化的视频流。这些问题可以通过计算机视觉、机器学习、心理学和数据科学的进步来解决，并且需要研究人员、内容创作者和行业利益相关者之间的合作，以改进
  VQA 方法并确保其在这个快速扩张的数字领域中发挥作用。




  ### 1.2.6 VQA 领域的新兴趋势


  本节将介绍 VQA 领域的最新趋势与发展，这些趋势源于不断变化的数字内容时代以及质量监控日益增长的重要性 [66, 67, 68]。


  *   **深度学习** **进展**：深度学习的发展使得 VQA 能够借助卷积神经网络（CNN）和循环神经网络（RNN）等算法，达到前所未有的水平。视频质量中复杂的主观特征正越来越多地使用最先进的深度学习架构进行建模。这些模型在包含大量人类质量判断的数据集上进行训练，能够从视频中提取复杂的视觉元素，从而做出可靠的判断。


  *   **无参考（NR）指标**：不依赖客观、标准化视频质量示例的指标近来开始流行，这并非没有道理。这类通常基于机器学习方法的指标，在参考视频无法获取或难以获得的情况下尤其有用。


  *   **多模态评估**：将声音、文本和元数据整合到单一评估中，开辟了一个新方向。评估模型能够更深入地理解视频质量，因为它们考虑了不同的模态。例如，通过同时考虑视觉和音频组件，可以实现对多媒体体验的全面评估。


  *   **体验质量（QoE）模型**：这些框架考虑了超出标准质量测量范围、以用户为中心的特征。它们将用户参与度、关注度和反应都纳入考量，使得这些模型对于以吸引最广泛受众的方式增强视频体验至关重要。


  *   **自适应流媒体评估**：随着自适应流媒体技术的普及，结合了 NTMA 的新算法应运而生，旨在减少视频质量在适应不断变化的网络环境时出现的明显中断。


  *   **可解释人工智能（XAI）**：可解释人工智能在医疗和安全领域更为突出，模型会提供其特定质量评估背后的推理依据，从而进一步提高评估的准确性。


  *   **用于实时 VQA 的边缘计算**：作为提供实时分析的方法之一，边缘计算被用于在更靠近数据源（如客户端设备）的位置分析数据。一个典型的例子是直播或视频会议场景，其中基于边缘的
  VQA 系统围绕用户设备构建，以实现低延迟和快速质量评估。


  *   **跨领域应用**：在一个领域开发的算法正被移植和调整用于其他领域。例如，为流媒体开发的技术正越来越多地被分别应用于医疗、教育和安全领域，用于高质量图像、VR
  教室和摄像头视频流。


  这些发展证明，VQA 正成为支持在线媒体生态系统的基础组成部分。为了满足各个学科对高质量、互动体验日益增长的需求，随着互联网视频继续主导通信、娱乐和信息分发，VQA
  将发挥重要作用。


  ## 1.3 JavaScript 中的机器学习


  机器学习通过让系统能够从观察中学习并随时间提升性能，已经改变了众多行业。随着 JavaScript 崛起成为一种灵活且广泛使用的编程语言，现在可以直接在 Web
  应用程序中集成机器学习算法。本节深入探讨了 JavaScript 如何用于机器学习任务，提供了强大的工具和框架，为基于 Web 的环境增添了高级分析和智能能力。


  ### 1.3.1 机器学习简介


  机器学习（ML）作为人工智能（AI）的革命性单元，使机器能够从数据中学习，并在无需显式编程的情况下做出预测或选择。过去几年中，JavaScript 对 ML 的支持为从事
  Web 开发和工程的人员释放了巨大的潜力。本节介绍 ML 的基础知识，并解释其在 JavaScript 语境中的重要性。


  机器学习从根本上关注的是泛化和模式识别。它涉及教导计算机分析大量数据，并得出有意义的结论或做出准确的预测。机器学习算法可以分析历史信息以确定模式，并对未预见的数据生成预测。ML
  可以细分为以下主要类别 [69]：


  1.  **监督学习**：监督学习涉及使用包含输入和预期输出的标记数据来训练模型。目标是找出如何将输入映射到输出。垃圾邮件检测、图像分类和回归问题都是其中的例子。


  2.  **无监督学习**：无监督学习处理未标记的数据，算法试图发现数据中隐藏的结构或模式。这包括聚类和降维，可用于市场细分或识别异常。


  3.  **强化学习**：在这种学习类型中，智能体被赋予在环境中做出决策以最大化奖励信号的能力。一些用例包括机器人技术、游戏和自主系统。


  鉴于其在 Web 开发中的普及，JavaScript 在 ML 中的地位日益重要，使开发者能够将轻量级且复杂的算法直接集成到 Web 应用中。这带来了引人入胜且自适应的用户体验。JavaScript
  工具和框架已经发展到使 ML 更容易为更广泛的受众所用。这也为无需服务器端计算的实时可能性打开了大门。像照片中的物体检测、自然语言处理、情感分析和预测分析这些看似复杂的任务，都可以在客户端（即浏览器中）原生打包并构建为
  ML 模型。


  此外，随着工具集的不断演进以及全球贡献者的开源参与，JavaScript 中大量融入了诸如 TensorFlow.js、Brain.js 和 ml5.js 等库，这些库提供了数据准备方法以及用于预训练模型的抽象和函数
  [70]。这些框架为普通开发者提供了优势，使他们能够深入掌握先进的 ML 技术，并将其映射到只需以正确格式提供数据的简单方法上。此外，还可以构建和定制神经网络以匹配数据集的要求。因此，图像识别、聊天机器人和预测分析对开发者来说唾手可得。同样地，JavaScript
  允许编码人员使用现有库中提供的现成类和方法，在 NTMA 和 VQA 等领域应用 ML。JavaScript 与 ML 的结合预示着基于 Web 的应用新时代的到来，这些应用不仅具有自适应性，而且智能，能够即时做出数据驱动的决策。




  ### 1.3.2 将 JavaScript 与机器学习相结合


  JavaScript 与机器学习的融合极大地简化了应用程序的开发，它内置了数据准备和分析方法。本节重点介绍 Web 开发与数据驱动智能之间所架起的桥梁 [71]，具体如下：


  *   **Web 驱动的集成**：几十年来，JavaScript 一直是前端网页设计的主导语言。它与机器学习的结合直接为 Web 应用增添了智能，使其能够更好地解读、评估和响应用户交互。这种连接对于开发动态且个性化的用户体验极具价值。


  *   **客户端机器学习**：JavaScript 使程序员能够在客户端（即 Web 浏览器内部）原生地托管和应用机器学习模型。这是一项颠覆性的变革，因为它能够实时利用设备的处理能力，而无需持续的服务器交互。这意味着基于机器学习的应用也可以在离线或网络连接不佳的情况下使用。


  *   **交互式数据可视化**：在机器学习领域，数据可视化通常被视为所构建应用的基本要求之一。由于该领域的大多数用例都是实时的，JavaScript 提供了诸如
  D3.JS 之类的可视化库来补充机器学习工作流程。这意味着，通过将算法生成的预测结果与数据流相结合，可以以交互式图表的形式将数据流连同框架结果一起传达给最终用户，这为开发者构建机器学习驱动的应用增添了一层便利。


  *   **跨平台兼容性**：由于 JavaScript 天生具有跨平台兼容性，基于机器学习的 Web 应用可以在各种硬件和操作系统上无需修改即可运行。通过允许用户从智能手机、平板电脑、台式机和其他设备访问机器学习应用，机器学习应用的普及度得以提升。


  *   **实时交互性**：当今应用的实时交互性需求与 JavaScript 的事件驱动架构相辅相成，这种架构非常适合机器学习应用中的查询-响应交互，例如聊天机器人、情感分析和实时数据可视化。


  *   **增强用户体验**：借助 JavaScript 支持的机器学习，可以实现根据用户行为和偏好变化的自适应用户界面。这种新的复杂程度可以推荐定制化内容，并提供上下文感知的建议。


  JavaScript 中机器学习的实际应用形成了一种强大的组合，可用于创建不仅在视觉上吸引人，而且智能、事件驱动且在 Web 开发领域具有革命性的应用。


  ### 1.3.3 JavaScript 中的数据准备与预处理


  准确准备和清洗数据是机器学习工作流程中的一个主要环节。本节深入探讨 JavaScript 如何协助完成这些关键阶段，为机器学习模型的训练和推理准备好数据。表 1-2
  总结了可用的功能 [72, 73, 74]。


  表 1-2


  JavaScript 中的数据准备与预处理功能


  | 功能 | 描述 |

  | --- | --- |

  | **数据处理库** | JavaScript 包含简化数据操作和准备的包。Pandas.js 和 Dataframe-js 是提供与 Python 的 Pandas
  类似的数据结构和方法的库示例，使开发者能够有效地导入、过滤和操作数据。 |

  | **数据获取** | Web 应用通常从 API、数据库和用户贡献中获取内容。一些库（如 Axios）简化了用于数据检索的 HTTP 查询过程，而 IndexedDB
  则为 Web 应用提供了用于存储和请求的客户端数据库。 |

  | **数据清洗** | 现实世界的数据通常包含差异、缺失值和异常值，在输入训练算法之前需要进行清洗步骤。诸如 Lodash、D3.js 和 Dataframe-js
  等框架通过消除重复项、填充缺失值和识别异常值来促进此过程。 |

