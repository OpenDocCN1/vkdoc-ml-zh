  \ 21, 2\n\n此类数据集可以围绕更多设备状态构建，例如游戏、视频会议、社交媒体使用和在线购物。分类数据集的样本随本书代码一起提供。但是，建议每个用户根据自己的设备和互联网连接套餐规格执行自己的数据收集，以便在分类过程中达到最佳精度。\n\
  \n### 4.1.2 K 近邻（KNN）算法\n\nKNN 是一种用于回归和分类问题的监督学习技术。其目的是找到并分组彼此相似的对象[1]。该方法迭代地搜索数据集，使用闵可夫斯基距离、曼哈顿距离或欧几里得距离等度量标准计算测试实例与每个其他数据点之间的距离。在特征空间中对数据点进行分类时，它使用投票方法，将数据点分配为其\
  \ k 个最近邻居中最常见的类别。在本书中，选择欧几里得距离作为测量技术，两个特定记录之间的距离*d*的计算公式如公式 4-1 所示[2]：\n\n![$$ d\\\
  left(p,q\\right)=\\sqrt{\\sum_{i=1}^n\\Big({q}_i²-{p}_i²}\\Big) $$](img/612428_1_En_4_Chapter_TeX_Equ1.png)\n\
  \n(4-1)\n\n其中：\n\n*   *p*, *q*：欧几里得*n*维空间中的两个点\n\n*   *qi*, *pi*：从空间原点开始的欧几里得向量\n\
  \n*   *n*：构成平面的轴的数量\n\n### 4.1.3 分类的数据准备\n\n在将数据输入 KNN 模型之前，需要将其处理成合适的格式。图 4-2 显示了作为训练数据的三种活动状态的一个片段以及一个样本测试数据。此时，一个大型数据集在输入模型之前需要进行打乱。\n\
