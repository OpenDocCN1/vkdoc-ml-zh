  \ `ws.open` 事件。在此情况下，之前存储的活动标签页的 URL 被发送到服务器，以测试通信路径。\n\n2.  要接收消息，使用 `ws.onmessage`\
  \ 事件。此方法在收到来自服务器的任何消息时自动触发。由于服务器被编程为每秒发送消息，此方法也每秒执行一次。收到消息后，会相应地过滤出实时值、预测指标和网络性能指标，这些值用于更新\
  \ HTML 元素和图表。\n\n5.  检查是否收到与服务器端发生的任何错误相关的消息，如果有则生成警报。\n\n6.  使用 `addData()` 方法触发实时图表更新，该方法接收图表对象、时间步长、实时值以及一个标签作为输入，用于指示正在填充三个数据集中的哪一个。\n\
  \n7.  为“监控与分析”按钮创建一个事件监听器：\n    1.  使用 `ws` 对象上的 `send` 关键字向服务器发送一条“开始监控”消息。服务器被编程为在收到此特定消息后启动其进程。\n\
  \n2.  将从各自 HTML 元素中获取的“窗口大小”和“预测时间”变量封装到一个使用 `stringify()` 方法创建的 `JSONObject` 变量中。\n\
