  \n图 7-6\n\n集成 NTMA 和 VQA 应用程序的完整用户界面\n\n### 7.2.4 构建客户端脚本\n\n客户端功能使用 JavaScript\
  \ 实现，并保存在一个名为 `pop.js` 的单一文件中。如之前的 NTMA 和 VQA 示例所示，该文件使用 WebSockets [7] 管理与 Node.js\
  \ 服务器的通信，使用接收到的指标刷新用户界面，并通过跟踪 Chart.js 达到的索引来更新两个图表及其各自的指标。\n\n#### 文件功能\n\n`pop.js`\
  \ 文件具有以下功能：\n\n1.  声明在整个脚本中使用的全局变量。\n\n2.  使用 Chrome 扩展 API 查询 Chrome 标签页：\n   \
  \ 1.  检索有关活动标签页和最后聚焦标签页的信息。\n    2.  检索活动标签页的 URL。\n\n3.  创建到服务器的 WebSocket 连接：\n\
  \    1.  实现从服务器接收消息的方法。\n    2.  使用 `open` 事件处理连接。\n    3.  解析并记录消息。\n\n4.  接收并处理来自服务器的消息：\n\
  \    1.  解析包含实时网络指标、视频质量指标和图表更新的 JSON 消息。\n    2.  使用网络和视频质量指标更新 HTML 元素。\n    3.\
  \  使用最新指标动态更新 Chart.js 图表。\n    4.  根据服务器返回的特定错误生成信息性警报。\n\n5.  为“监控”按钮创建事件监听器：\n\
  \    1.  为按钮添加事件监听器。\n    2.  从用户界面获取“窗口大小”和“预测时间”参数，并以 JSON 格式发送到服务器。\n    3. \
  \ 调用一个方法，使用 Chrome 扩展 API 截取当前页面视图的屏幕截图。\n    4.  计算将图像发送到服务器所需的 8 KB 块的数量。\n  \
  \  5.  将服务器应预期的块数作为元数据发送。\n    6.  将每个块发送到服务器。\n\n6.  为 DOM 创建事件监听器：\n    1.  为\
  \ DOM 添加事件监听器。\n    2.  为 NTMA 和 VQA 初始化两个 Chart.js 图表对象。\n    3.  为切换开关添加事件监听器。\n\
  \    4.  当切换开关被选中时，隐藏 NTMA 图表并显示 VQA 图表。\n    5.  当切换开关未被选中时，显示 NTMA 图表并隐藏 VQA 图表。\n\
  \    6.  为五个数据集创建配置。\n\n7.  实现一个方法，根据指定的标签每秒更新图表。\n\n8.  实现一个方法，在收到 Node.js 服务器的请求时截取当前页面的屏幕截图。\n\
  \n#### 创建脚本结构\n\n`pop.js` 脚本的结构在代码清单 7-7 中给出，以及其他功能的代码放置位置。\n\n```\n// 声明在整个脚本中调用的全局对象。\n\
