  \ true, // 显示 x 轴刻度。\ncolor: '#6b7e9b', // 更改 x 轴刻度标签颜色。\nfont: {\nfamily: 'Ubuntu',\
  \ // 更改 x 轴刻度字体。\nsize: 10, // 更改 x 轴刻度字体大小。\n},\nstepSize: 10, // 更改 x 轴刻度步长。\n\
  },\n},\ny: {\ndisplay: true, // 显示 y 轴。\ntitle: {\ndisplay: true, // 显示 y 轴标题。\n\
  text: '数值', // 更改 y 轴标签。\ncolor: '#DFCCFB', // 更改 y 轴标签颜色。\nfont: {\nfamily: 'Fira\
