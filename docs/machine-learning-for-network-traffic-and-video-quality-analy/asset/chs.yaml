  ### 1.1.5 NTMA 面临的挑战


  NTMA 如同数据海洋中的哨兵，值守在当今复杂网络织就的洪流之中，肩负着从海量涌入的信息里提取隐藏故事线的重任。然而，这一知识领域暗藏着重重障碍迷宫，唯有凭借创造力、灵活性以及前沿方法方能克服。


  首要难题之一便是网络流量的惊人规模 [31]。全球数据中心每年处理约 100 ZB 的内容，而在当今时代，单个用户每年就能产生 TB 级的数据，这意味着穿越网络的信息量是惊人的
  [32]。要理解这股信息洪流，就需要采用诸如数据缩减、聚合和选择性采样等复杂方法。随着可用数据越来越多，遗漏有价值洞察的可能性也随之增加。随着越来越多的人使用流媒体服务、云技术和物联网设备，网络交互的多样性也在增加，这要求同时对实时和过往事件进行分析
  [33]。


  向加密传输的转变带来了新的复杂层面。谷歌报告称，互联网上加密网络流量的比例已从 2014 年的大约 50% 增长到 2020 年后的约 95% [34]，这表明为应对日益增长的安全担忧，加密技术的使用已变得多么普遍。虽然加密技术提升了数据隐私和安全性，但它也隐藏了数据包内容，使得解读它们如同破译密码信件一样困难。为了突破加密壁垒并在不违反数据保护法规的情况下获取情报，需要采用诸如深度包检测（DPI）之类的先进方法。DPI
  被广泛认为是网络安全领域的重要竞争者，展现出有效对抗现代网络威胁的强大能力。这是一个检查数据包在穿越特定位置时其内容，并随后根据相关实体（如公司、ISP 或网络管理员）预设的标准做出即时决策的过程
  [35]。尽管最近在分离网络流量构建块以尝试独立处理它们方面取得了进展，但 NTMA 社区在平衡安全性与透明度方面仍然面临巨大困难，尤其是在使用解密和用户匿名技术时。同样，根据
  IDC 的预测，到 2025 年，包括手机、平板电脑和物联网传感器在内的设备数量预计将达到 416 亿 [36]，这使得跨设备和通信协议标准化分析流程变得越来越困难。这要求开发能够处理多模态流量细微差别的方法。


  ### 1.1.6 NTMA 的应用案例


  随着威胁环境的变化和攻击手段的日益复杂，保护关键数字资产是 NTMA 的首要任务。为了检测安全漏洞或恶意行为，NTMA 会分析网络流量模式以发现异常。网络安全风险投资公司估计，到
  2025 年，与网络犯罪相关的年度支出将达到 10.5 万亿美元，这使得持续监控成为一道关键防线 [37]。网络安全专家可以利用 NTMA 的发现来加强防护、识别漏洞，并迅速应对诸如分布式拒绝服务（DDoS）攻击和勒索软件入侵等新威胁
  [38]。


  在当今持续连接和快速数据传输至关重要的数字经济中，网络优化至关重要。NTMA 通过检查网络流量模式来识别拥塞热点以及带宽和性能瓶颈 [39]。从这个角度出发，IT
  管理人员可以更有效地分配网络资产，提升用户的**服务质量**（QoS），并防止服务中断。爱立信预测，到 2024 年，5G 网络将覆盖全球 45% 的人口，这清楚地表明，随着对高速低延迟互联网连接的需求持续增长，有效的网络管理对于满足消费者期望至关重要
  [40]。


  通过有效监控性能瓶颈和优化网络资源，NTMA 确保用户能够获得无缝的在线体验。这在客户行为中显而易见：遇到网站性能问题的用户不太可能再次访问该网站。无论是下载高清内容、举行虚拟会议还是进行实时在线交易，NTMA
  在确保网络灵活性和有效性方面的作用都显著影响着用户的数字活动 [41]。


  NTMA 的更多应用案例重点列举如下：


  *   网络流量特征描述与监控

  *   网络优化与规划

  *   网络安全违规检测

  *   网络服务质量评估与改进

  *   网络组件预测性维护

  *   取证分析

  *   合规与监管报告

  *   漏洞扫描与补丁管理

  *   成本优化




  ### 1.1.7 NTMA 的新兴趋势


  将人工智能和机器学习融入 NTMA 已被视为一项颠覆性的发展。面对每日海量数据，由人工智能驱动的洞察力能为网络活动提供重要的前瞻性。像 Cloudflare 这样的公司利用人工智能分析海量网络流量数据，以实时识别并缓解分布式拒绝服务（DDoS）攻击。随着可用的计算能力不断增强，NTMA
  现在不仅能发现模式和异常，还能对其进行预测，从而极大地提升网络安全和性能。


  边缘计算的兴起也正在影响 NTMA 方法的变革。随着越来越多的物联网设备在网络边缘收集数据，NTMA 已从集中式评估演变为实时监控。像西门子这样的边缘计算先驱将其应用于生产中，通过评估植入设备中的传感器收集的数据，进行本地即时决策
  [42]。这一发展使得 NTMA 能够在数据生成时快速发现问题并提升性能，有助于减少延迟并确保流畅的用户体验。


  此外，云计算的日益普及正在显著提升 NTMA 的灵活性和可访问性 [43]。借助像 ThousandEyes（现为思科旗下公司）提供的基于云的 NTMA 服务
  [44]，网络运营商现在可以灵活地在分散的环境中安装和管理远程监控。这种适应性服务于网络拓扑结构不断变化的特性，包括远程办公的普及。向云端 NTMA 的迁移，体现了云的模块化和远程可用性如何满足当今网络不断变化的需求。这些发展共同为
  NTMA 赋予了新能力，使其能够在海量数据和数字复杂性的时代蓬勃发展。通过利用人工智能和机器学习、采用边缘计算以及集成云解决方案，NTMA 正朝着动态、智能和主动的网络管理方向迈进。诸如此类的变化凸显了
  NTMA 对支撑现代数字世界的可靠、高性能网络所产生的持久影响 [45]。


  ### 1.1.8 弥合 NTMA 与用户体验之间的差距


  随着数字时代的发展，NTMA 已成为网络响应性、耐用性以及最终用户体验的基石。NTMA 与最终用户的体验质量（QoE）有着内在联系 [46]。NTMA 分析网络流量、定位处理延迟并提升服务质量的能力，直接转化为改善的客户体验。以使用
  NTMA 进行实时监控的流媒体平台为例。服务监控和管理团队可以密切关注网络状态，并在流媒体质量下降时迅速采取行动，这种质量下降通常通过视频质量评估（VQA）获得的平均意见得分（MOS）来概括。这种即时适应与观众不断变化的习惯相辅相成。例如，Netflix
  报告称，2020 年第一季度新增了 1577 万订阅用户，比 2019 年同期增长了 23% [47]。NTMA 通过确保无故障的流媒体体验，有助于提高客户满意度和留存率。


  此外，NTMA 的专业知识也适用于电子商务领域，客户的交互对其最终购买行为有重大影响。在当前环境下，网络的效率至关重要。NTMA 通过对用户交互和交易流程的分析，识别潜在的延迟问题，确保快速、无误的交易。鉴于
  Statista 预测到 2027 年全球电子商务销售额将达到 5.56 万亿美元 [48]，这一点至关重要。除了技术管理的作用之外，NTMA 还通过改善用户体验质量来帮助推动收入增长。


  此外，远程工作场景也受益于 NTMA 与用户体验的融合。居家办公的日益普及使得网络速度和可靠性比以往任何时候都更加重要。由于 NTMA 致力于减少延迟、提升视频会议质量并确保数据及时传输，分散的团队可以高效协作。根据
  Owl Labs 进行的研究，高达 58% 的远程工作者认为，未来十年远程办公将更加普及 [49]。由于远程办公日益流行，NTMA 必须优先考虑流媒体和视频会议应用的
  QoE。简而言之，NTMA 弥合了技术经济与人类体验之间的差距。改善的用户体验、参与度和生产力，都是 NTMA 分析网络动态和维护性能能力的直接产物。




  ## 1.2 视频质量评估概述


  在当代多媒体消费的复杂数字格局中，视频素材的质量已成为一个关键的差异化因素。超越基本技术标准的范畴，视频质量评估（VQA）作为一个关键领域，旨在客观量化并主观理解视频输出的感知质量。其核心而言，VQA
  是一个跨学科领域，融合了工程学、心理学和人机交互。其最终目标是弥合视频的技术层面（如分辨率、比特率和压缩伪影）与人类观众主观感受之间的鸿沟。这项工作认识到人类视觉系统的复杂性，包括认知过程、视觉敏锐度和心理因素的相互作用，这些因素共同导致了人们以独特方式接收和理解周围世界
  [50]。流媒体视频在多个渠道的迅速普及凸显了 VQA 的必要性。确保人们在线观看的视频不仅在技术上可行，而且能吸引并沉浸其中，这一点至关重要。从这个意义上说，VQA
  就像一张地图，帮助内容制作方、流媒体服务商和电信运营商在用户体验质量方面满足消费者的期望。


  数字世界的变化也导致了决定视频质量的变量发生相应转变。尽管分辨率、比特率等视频质量因素极其重要，但它们只是问题的一小部分。许多因素都会影响观众对视频的感知，包括压缩伪影、色彩准确性、运动流畅度和音频同步。因此，VQA
  融合了客观和主观评估方法，旨在衡量技术特征并记录观众的情感反应。


  VQA 的动态发展体现在从基础的、基于规则的算法向复杂的机器学习模型的转变。如今，机器学习方法可用于复制人类的感知判断，取代了基于峰值信噪比（PSNR）和结构相似性指数（SSIM）等指标的旧方法。近年来，卷积神经网络（CNN）和循环神经网络（RNN）等深度学习架构已成为从视频中提取细微但重要的视觉细节的极其有用的工具
  [51]。


  除了在娱乐行业的应用，VQA 在医疗、安防和学术领域也具有实际意义。例如，在医学影像中，诊断图像的错误呈现可能导致致命后果。VQA 通过确保医学图像忠实于原始图像，减少了误解的可能性。借助
  VQA，安防专业人员可以确信他们正在查看真实、未经编辑的视频源，这有助于发现异常情况。VQA 对人工智能、机器学习和感知心理学的持续探索，使其成为现代数字体验的核心。通过将技术要求与人类感知对齐，它巩固了自身作为媒介的角色，不仅提供视频，更提供能够吸引、连接用户并引起共鸣的沉浸式视觉叙事。


  ### 1.2.1 VQA 的重要性


  在视频内容占据当前多媒体消费趋势主导地位的背景下，VQA 是核心，它通过优化指标塑造用户体验，从而将内容开发与分发策略结合在一起。VQA 旨在回答诸如视频内容质量对观众参与度和满意度有多大影响等问题。互联网协议电视（IPTV）广播公司和
  OTT 流媒体平台等内容制作行业需要强大的监控程序，以显示所传输媒体的当前状态，包括可用性、运行时间、服务质量和用户体验，这些都属于其反馈循环的一部分。该行业深知，观众不仅仅是消费内容，他们是在体验内容。本节将探讨
  VQA 在当今多媒体生态系统中的关键重要性。


  VQA 对用户参与度的直接影响可能是其重要性的最清晰指标。在一个选择丰富、注意力持续时间短暂的时代，视频内容的质量是数字用户互动的第一线。这与 TikTok、YouTube
  Shorts 和 Instagram Reels 等平台上短小精悍、引人入胜的视频消费的迅猛增长高度契合 [52]。VQA 扮演着监督者的角色，检查视频中可能导致观众脱离体验的缺陷，例如失真、故障和其他不足。VQA
  确保视频没有令人分心的缺陷，为即时吸引观众奠定了基础。VQA 的优势还包括其经济效益。根据《哈佛商业评论》的研究，仅保留 5% 的客户就能使盈利能力提升 25%
  至 95%，这表明内容质量与观众满意度之间存在直接关联 [53]。


  VQA 的相关性超越了技术能力，延伸至视频的心理共鸣。视频是分享思想、情感和体验的强大媒介。VQA 致力于维护赋予视频力量的感染力，无论是鼓舞人心的广告、信息丰富的教程，还是引人入胜的叙事。由于高清显示器、增强现实和虚拟现实的普及，用户对视频质量的期望不断提高。用户生成视频和直播有助于内容创作的民主化，但这相应地也带来了质量民主化的需求。VQA
  的职责还包括分析来自众多发布者的内容，以确保无论视频原始来源如何，都能提供一致、高质量的视觉体验。其影响深远，不仅影响用户参与度，也影响内容开发者和制作者。VQA
  通过倡导视频的高标准，在数字时代保护了兴趣、经济收益和情感影响。因此，数字故事的创作和消费过程被提升至技术与人类感知之间艺术交响乐的层面，进一步丰富了构成当代体验的数字马赛克。




  ### 1.2.2 影响视频质量的因素


  观看视频的体验受到多种因素的影响，每种因素都在观众形成的整体印象中发挥着独特作用。从技术参数到感知心理学，研究人员剖析了构成满意视频观看体验的要素，如表 1-1
  [54] 所示。


  表 1-1


  影响视频质量的因素


  | 因素 | 描述 |

  | --- | --- |

  | **分辨率** | 表示每个维度上的像素数量，是视频质量的主要决定因素。更高的分辨率（如 4K 和 8K）可呈现更清晰、更细致的图像。视频分辨率对其在屏幕（尤其是大尺寸屏幕）上的显示效果有重大影响。然而，更高的分辨率需要更大的带宽和更强的计算能力。
  |

  | **比特率** | 在特定时间内交换比特的速率。随着比特率提高，可以在减少压缩需求的情况下传输更多视觉细节，从而影响视频质量。高比特率可能会给网络带来负担，因此找到合适的平衡点颇具挑战。
  |

  | **压缩** | 视频压缩技术（如 H.264 和 H.265）对于在存储和传输视频时节省空间和带宽至关重要。然而，过度压缩可能会引入块状效应或模糊，损害视频质量。
  |

  | **帧率** | 每秒显示的帧数，也称为“fps”，由帧率决定。常见的帧率为每秒 24、30 和 60 帧。120 或 240 fps 及更高的帧率可提升动作的流畅度。然而，不同观众对帧率的偏好各不相同。
  |

  | **色彩准确度** | 逼真的视觉体验在很大程度上依赖于色彩还原。不准确的色彩可能使图像看起来虚假或令人不适。在医学成像和电影制作等领域，色彩保真度至关重要。
  |

  | **运动处理** | 任何包含大量动作的场景或体育赛事转播都必须能够无失真地渲染快速运动。显示器处理运动的能力与其帧率、刷新率和响应时间规格相关。 |

  | **音频质量** | 高质量的音频能增强视频素材的表现力。音频编码、立体声/环绕声系统以及降噪方法共同影响着整体音质。为了获得最佳观看体验，演示中的音频和视觉元素必须保持同步。
  |

  | **内容来源** | 大多数商业制作的内容都设有质量控制措施，而用户生成的内容则可能质量参差不齐。因此，视频的预期质量在很大程度上取决于其来源。 |

  | **观看环境** | 观众所处的环境也会影响感知到的视频质量。这包括照明条件、屏幕尺寸、观看距离和背景噪音。例如，窗户的眩光可能会损害整体印象。 |

  | **心理因素** | 观众的期望、注意力和情绪都在人类从心理层面解读视频质量的过程中发挥作用。然而，如果引人入胜的内容无法弥补技术缺陷，那么备受期待的内容中的技术缺陷可能会更加明显。
  |

  | **设备性能** | 观看体验由用于观看视频的设备决定，范围从智能手机等手持设备到具备 4K 能力的高端电视。 |


  因此，上述参数会影响最终的视频输出。一些可能的影响如下 [55]：


  *   **块状效应**：视频编码过程涉及基于块的技术。因此，网络性能下降可能导致数据丢失或编码错误。


  *   **模糊**：当空间信息或显著特征减少时，会出现模糊现象，导致场景或物体周围的边界融合且变得不清晰。


  *   **边缘失真**：这特指修改后的视频与其原始版本相比，在边缘处观察到的差异。内容中的物体呈现出不平整的边缘。


  *   **运动卡顿**：运动卡顿的发生通常通过使用序列编号将实时测量值与视频时间进行比较来评估。在某些情况下，可能会出现内容冻结或片段跳过的现象。


  内容创作者以及服务提供商必须理解并评估这些因素的影响，以便为人类提供令人满意、沉浸且引人注目的体验。




  ### 1.2.3 VQA 方法的演进


  在先进的机器学习和深度学习技术发展之前，VQA 主要基于传统方法。本节将详细阐述 VQA 方法的演进过程 [56]，具体如下：


  *   **主观评估**：经典 VQA 的支柱，即主观评估，依赖于人类观察者根据自身经验对视频进行评分。绝对类别评级（ACR）方法就是一种利用人类判断来评估视频质量的主观测试。观看者给出的评分和标签揭示了人类体验中富有洞察力的信息。目前，用于训练机器学习算法的数据集通常以人类判断为基准进行校准。


  *   **客观指标**：根据技术参数对视频质量进行定量评估，客观指标涵盖了多种数学公式。一些指标通过比较视频的未失真版本和失真版本来确定总体得分，例如峰值信噪比（PSNR）和结构相似性指数（SSIM）。这些测量方法可以实现快速、自动化的评估，但它们通常过于简单，无法解释人类感知中的细微差别。例如，PSNR
  对不准确性很敏感，但与人类感知的相关性较差。


  *   **混合方法**：这些方法整合了主观评估和更量化测量方法的各个方面。其目标是结合科学数据与个人经验。为了高效预测质量，这些方法基于主观输入进行训练，旨在将人类感知因素纳入考量，同时保留客观测量方法带来的自动化效率提升。


  *   **基于模型的技术**：利用计算机模拟来模仿人类视觉系统的特征，以对软件进行质量评估。视频质量专家组（VQEG）等组织创建了计算模型，例如视频质量模型（VQM）和视频质量专家（VQE）[57]。这些模型在确保技术测量与人类感知之间具有更好一致性的同时，还考虑了对比度敏感度和空间掩蔽效应。


  *   **基于比特流的评估**：与完全解码不同，这些方法使用视频比特流中的编码设置、帧率和压缩比等组件。尽管计算效率高，但这些方法可能会遗漏内容感知方式上的某些细微差别。


  *   **无参考（NR）指标**：传统的 VQA 方法通常采用全参考（FR）技术，即通过将失真视频与参考视频（即原始视频）进行比较来衡量失真程度。然而，NR
  方法无需参考流即可评估视频质量。这也被称为无参考指标。由 TestDevLab 开发的基于深度学习的视频质量测试（VQTDL）就是此类算法的一个例子，它试图在没有任何外部参考的情况下评估质量，这使得它在无法获取此类资源的情况下非常有用
  [58]。


  由于 VQA 是一个以应用为中心的过程，因此所选的具体方法需要高度适应其目的。围绕近期趋势所使用的技术，以及 VQA 方法需要适应新兴主题的需求，总结在图 1-5
  [59] 中。


