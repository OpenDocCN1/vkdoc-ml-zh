  \ vqaChart; // VQA Chart.js 对象的变量。\n// 查询活动标签页和最后聚焦标签页以检索当前 URL。\nchrome.tabs.query({\n\
  active: true,\nlastFocusedWindow: true,\n},\nfunction(tabs) {\n\n}\n);\n// 在 DOM\
  \ 上添加事件监听器，以便在页面加载后立即执行。\ndocument.addEventListener('DOMContentLoaded', function()\
  \ {\n\n}, false);\n// 动态更新图表的方法。\nfunction addData(chart, label, data, updateLabel)\
  \ {\n\n}\n代码清单 7-7\n创建脚本结构\n```\n\n#### 页面加载时初始化并配置图表\n\n一旦 HTML 文档的 DOM 加载完成，`DOMContentLoaded`\
  \ 事件就会被触发以执行其内容。因此，在执行以下操作之前，两个图表 `ntmaGraph` 和 `vqaGraph` 分别被引用到 `chart1` 和 `chart2`：\n\
  \n1.  获取 NTMA 和 VQA 的两个图表画布元素的引用。\n2.  获取切换开关输入元素的引用。\n3.  初始隐藏 VQA 图表。\n4.  创建一个在两个图表之间切换的函数。\n\
  5.  获取“监控”按钮的 DOM 元素并将其分配给全局变量 `monitorButton`。\n6.  创建数据集配置：\n    1.  为“下载速度 (kbps)”、“上传速度\
  \ (kbps)”和“延迟 (ms)”创建三个独立的数据集。这些用于 NTMA 图表。\n    2.  为“MOS 分数”和“平均 MOS 分数”创建两个独立的数据集。这些用于\
