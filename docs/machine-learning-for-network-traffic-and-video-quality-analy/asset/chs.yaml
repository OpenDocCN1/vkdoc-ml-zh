  \ // 更改 y 轴刻度字体。\nsize: 13, // 更改 y 轴刻度字体大小。\n},\n},\n},\n},\nplugins: {\nlegend:\
  \ {\nlabels: {\ncolor: '#DFCCFB', // 更改图例标签颜色。\nfont: {\nfamily: 'Roboto Mono',\
  \ // 更改图例标签字体。\n}\n}\n}\n}\n};\n// 折线图的配置对象。\nconst config = {\ntype: 'line', //\
  \ 设置图表类型。\ndata: data, // 设置图表数据。\noptions: options // 设置样式和自定义选项。\n};\n// 使用配置创建新的\
  \ Chart 实例，并将其附加到 id 为“myChart”的画布元素上。\nmyChart = new Chart(document.getElementById('myChart'),\
  \ config);\n清单 6-8\n页面加载时初始化并配置图表\n```\n\n\n\n#### 实时 WebSocket 通信与动态图表更新\n\n客户端的主要任务包括：在启用通过已建立连接传输消息之前，先在指定端口上与服务器建立连接。此外，它还能按需传输消息。然而，由于在此应用中服务器主要负责执行大部分计算任务，客户端主要专注于接收来自服务器的消息，并同时进行连续的屏幕截图。具体阐述如下：\n\
  \n1.  获取活动标签页的 URL 并将其存储在一个变量中。\n\n2.  初始化一个 `time` 变量，用于跟踪正在分析的帧数。\n\n3.  创建常量以动态区分两个图表。\n\
  \n4.  在 “ws://localhost:8081/” 上建立 WebSocket 连接，即通过端口 8081，进行实时通信。\n    1.  要发送消息，使用\
  \ `ws.open` 事件。在此情况下，将之前存储的活动标签页的 URL 发送给服务器，以便服务器知道正在访问哪个站点。这对于处理所截取的屏幕截图至关重要，因为可以根据视频帧的坐标进行裁剪。在此应用中，目前支持\
  \ YouTube 和 Twitch。但是，可以获取任何视频流媒体网站的裁剪坐标，并相应修改代码。\n\n2.  要接收消息，使用 `ws.onmessage`\
  \ 事件。此方法在收到来自服务器的任何消息时自动触发。服务器被编程为在收到来自 servlet 的结果后请求另一张屏幕截图，并将该结果中继给客户端。因此，客户端被编码为验证来自服务器的消息是否包含\
  \ “screenshot” 关键字，以及分析的帧数是否为六十。\n\n3.  来自服务器的消息还包含由 servlet 生成的视频质量指标。这些值用于更新 HTML\
  \ 元素和图表。\n\n5.  检查是否收到与服务器端发生的任何错误相关的消息，如果收到则生成警报。\n\n6.  使用 `addData()` 方法触发实时图表更新，该方法接收图表对象、时间步长、实时值以及一个标签作为输入，用于指示正在填充两个数据集中的哪一个。\n\
  \n7.  为 “Monitor” 按钮创建一个事件监听器：\n    1.  调用一个方法，使用 Chrome 扩展 API 截取当前页面视图的屏幕截图。\n\
  \n2.  在 “Monitor” 按钮的事件监听器外部实现 `takeScreenshot()` 方法。\n\n清单 6-9 给出了协调与服务器的双工通信、包含截屏机制以及实时更新图表的代码。\n\
  \n```\n// Store the URL of the active tab in a variable.\nvar tempurl = tabs[0].url;\n\
  // Variable for iterating time on the graph.\n// It is used to keep track of the\
  \ frames being analyzed.\nvar time = 0;\n// Constants for updating graph data.\n\
  const updateMOS = \"MOS\";\nconst updateAverageMOS = \"AverageMOS\";\n// Create\
  \ a WebSocket connection to the server.\nconst ws = new WebSocket('ws://localhost:8081/');\n\
  // Handle the WebSocket connection \"open\" event.\nws.onopen = function() {\n//\
  \ Log a message for when the extension has successfully connected to the server.\n\
  console.log('WebSocket Client Connected');\n// Send the URL of the active tab to\
  \ the server for it to know which site is being visited.\n// Specify the type as\
  \ \"sitedata\" and send the message in a JSON format.\nws.send(JSON.stringify({type:'sitedata',\
  \ value:tempurl}));\n};\n// Handle received messages from the server.\nws.onmessage\
  \ = function(e) {\n// Log any received message.\nconsole.log(\"Received from server:\
  \ \" + e.data);\n// Parse the JSON message for real-time metrics and graph updates.\n\
  // This occurs as soon as the NodeJS server receives a processed reply from the\
  \ Java Servlet.\nconst msg = JSON.parse(e.data);\n// Extract the message from the\
  \ server requesting another screenshot.\nvar screenshotMessage = msg.screenshot;\n\
  // Extract the message from the server containing the MOS score.\nvar mosScore =\
