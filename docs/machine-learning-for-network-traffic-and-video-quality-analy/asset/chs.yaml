  ## 3.3 视频质量评估前沿综述


  2023 年，普通人每周大约消费十七小时的互联网视频内容，较 2022 年的十九小时有所下降 [64]。这种观看模式的变化凸显了视频质量评估在满足观众不断变化的期望以及内容消费动态转变方面的重要性。为了理解定义当前视频质量环境的各种进步和发展，考虑到数字领域的持续变化，对视频质量评估进行全面审视至关重要。本节将深入阐述定义当前多媒体通信时代的前沿方法，目前有
  75% 的人在移动设备上消费短视频内容 [65]。


  ### 3.3.1 视频质量评估背景


  视频质量评估的发展源于将多媒体内容分发与用户对卓越视觉体验的需求同步起来的必要性。移动技术的最新进展赋予了世界一项不可思议的超能力：随时随地录制电影级画质的视频，让人们能够记录日常经历。Instagram
  Reels 和 TikTok 就是如此，视频在制作阶段就添加了字幕，以提高可访问性 [66]。尽管视频流量占互联网总流量的绝大部分，但它在到达最终接收者之前会经历多个处理步骤，在此过程中，感知到的视频质量可能会下降或提升。视频质量评估处于整个操作的核心，因此具有多种实际应用，例如实时质量监控、视频架构（如视频采集和传输）的性能评估，以及多媒体框架的感知优化。传统的视频质量评估方法主要依赖于生成技术信息，但未能完全捕捉人类感知的细微差别。视频质量评估研究的主要目标是创建与主观方法高度相关的客观方法
  [67]。根据 Brightcove 的数据，62% 的观众在遇到质量较差的视频内容时，容易对品牌产生负面看法 [68]。这一数字凸显了视频质量评估在影响消费者看法以及进而影响数字内容提供商成功方面的关键重要性。视频质量评估不仅是技术需求，更是那些力求在竞争激烈的多媒体通信领域取得成功的组织的战略必需品。




  ### 3.3.2 机器学习在视频质量评估中的应用


  视频质量的主观因素随着其在视频质量评估中的应用，已逐渐渗透到最强大的机器学习算法中。尽管在感知质量评估方面面临若干障碍，机器学习如今仍被广泛用于提升视频编解码器的编码效率
  [69]。机器学习还被全球最大的科技巨头之一 Netflix 所采用。其机器学习解决方案 VMAF 结合了视觉信息保真度（VIF）[70] 和细节丢失度量（DLM）[71]，通过逐像素计算连续帧之间亮度分量的时间差异来衡量图像质量。随后使用支持向量回归（SVR）计算加权平均值，量化最终的感知质量分数。由于依赖于帧级特征，VMAF
  并未考虑视频复杂的运动复杂度，这种复杂度超越了后续帧中单纯的逐像素变化。多年来，针对视频质量评估，人们提出了多种显著的端到端机器学习和深度学习方法，包括 Xu
  等人提出的 C3DVQA [72]，以及 Sun 等人提出的 CompressedVQA [73]。例如，后者通过使用一个简单的 MLP 网络来预测块级质量分数，其中多尺度权重源自人类视觉系统的对比度敏感函数，展示了机器学习模型在利用质量感知特征方面的卓越性能。


  尽管由机器学习驱动的模型性能卓越，但增强的流媒体方法却加大了对更大带宽容量的需求，并在传输过程中引入了额外的复杂性，这两者对于服务提供商和互联网服务提供商而言都是关键因素。历史上，这个问题是在管理网络服务质量的框架内进行研究的。然而，通过无线网络进行流媒体传输时，即使名义上的容量足够，由于信道条件的波动，质量也会下降
  [74]。这种劣化无法简单地通过纳入服务质量因素来准确评估。这些变量仅能提供特定网络状况的洞察，并未完全包含影响用户整体体验的端到端特性。为了解决这些组成部分，体验质量的管理已被公认为一种更有效的方法
  [75]。因此，更新的趋势集中在通过机器学习进行预测性体验质量管理，如图 3-9 [76] 所示。


