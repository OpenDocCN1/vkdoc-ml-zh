  \ 3 个子行。条目如下：1. 2, 11, 0。2. 129, 25, 1。3. 1856, 58, 2。测试数据：1276, 47, 问号。\n\n图 4-2\n\
  \n分类的数据准备\n\n\n\n### 4.1.4 KNN 的简化示例\n\n以下步骤是一个数值示例，用于根据本书中编码的模型对网络数据进行 KNN 分类。\n\
