  等人使用了多种回归方法，如 SVM、MLP 和 M5P，通过比较平均绝对百分比误差（MAPE）来预测 TCP/IP 流量的均匀性，如文献 [71] 所示。Cortez
  等人在文献 [72] 中研究了相同类型的流量，其数据集来自互联网服务提供商，并包含了与统计方法对比的各种预测时间范围。




  ## 2.4 本章小结


  第 2 章深入探讨了网络流量监控与分析（NTMA），涵盖了其基本原理、现有应用以及前沿技术。本章详细阐述了 NTMA 面临的难点和需考虑的因素，阐明了网络流量预测与分类算法的必要性。以下是一些关键要点：


  *   NTMA 主要应用于网络设备的实时监控与管理，以洞察并控制网络性能。

  *   一些现有的 NTMA 应用包括 Paessler PRTG Network Monitor 和 SolarWinds NetFlow Traffic Analyzer。

  *   NTMA 面临的挑战包括缺乏针对网络流量的预测和分类算法。

  *   NTMA 能有效管理带宽需求并检测网络威胁。

  *   机器学习算法在 NTMA 中日益普及，因此正被集成进来，以提供对网络数据更强的预测能力和异常检测能力。


  下一章将通过其基本原理和实际应用，对视频质量评估（VQA）进行深入剖析。


  '
- '# 3. 视频质量评估


  本章将揭示视频质量评估（VQA）的原理及其在常见流媒体平台上的应用。本章阐述了 VQA 的基本原理和要点，旨在维护无缝的多媒体体验。剖析内容包括深入探讨算法所使用的各种伪影，例如振铃效应、块效应和噪声。通过使用无参考（NR）指标技术，生成平均意见得分（MOS），该得分被解释为服务质量（QoS）评级。本章重点介绍了构建
  VQA 算法所用的基础模块，并回顾了电信公司和运营商当前使用的应用。此外，还对当前基于 VQA 的研究进行了深入回顾。


  ## 3.1 VQA 基本原理


  在过去十年中，只需轻轻滑动指尖就能召唤出各种多媒体内容的能力，导致了对 YouTube、Netflix、Amazon Prime、Twitch 和 Vimeo
  等流媒体服务需求的持续增长[1]。随着智能手机无缝融入日常生活，推动了 OTT 流媒体平台的出现，这产生了评估这些大型科技公司所提供的 QoS 以及最终用户体验质量（QoE）的日益增长的需求。因此，由于互联网应用数量的即将激增，围绕
  QoS、QoE、扩展和运营效率的管理变得日益复杂[2]。


  干扰通过互联网进行多媒体通信有效性的因素包括延迟、传输错误、数据包故障、带宽限制和抖动。这些因素会显著影响信号接收质量，导致消费者获得不满意的观看体验[3]。目标是评估网络需求，以确保多媒体应用、会话和网络环境无论遇到何种障碍都能保持一致的性能。鉴于流媒体视频流量构成了当前网络流量的重要部分，互联网提供商正将重心转向开发由机器学习（ML）驱动的
  VQA 算法，以准确评估和复制最终用户的行为[4]。


  将网络流量监控与分析（NTMA）和 VQA 结合起来用于网络管理，为服务运营中心（SOC）和网络运营中心（NOC）团队的工作方式带来了革命性的变化。这使他们能够全面了解其网络状况并迅速做出响应[5]。通过集成深度神经网络、支持向量机、多层感知器和卷积神经网络等机器学习技术，尽管存在各种用于网络流量管理和
  VQA 的软件和方法，但针对实时多媒体流量的 QoS 分析仍可得到显著改善，超越当前所能达到的水平。考虑到实时多媒体应用在包括计算机和手机在内的许多平台上的广泛使用，VQA
  应用的广泛可用性至关重要。这是为了确保灵活性并满足实时分析的要求。这突显了分析和预测方法必须在通常的在线视频流媒体情境中评估视频质量和网络 QoS。图 3-1
  展示了一个流行的架构，VQA 研究通常基于此架构[6]。


  ![](img/612428_1_En_3_Fig1_HTML.jpg)


  VQA 研究方法流程图。流程顺序为：视频比特流、特征提取与集成模块、视频质量估计器模块、视频质量估计。


  图 3-1


  VQA 研究方法[6]


  在多媒体消费的广阔领域中，视频质量是决定消费者体验和满意度的最强因素之一[7]。VQA 是一种开创性的方法，确保我们交互的视觉内容满足受众的标准和期望。它是追求最佳视觉保真度的基础，其主要目标是解决一个基本问题：什么构成了视觉上令人愉悦且引人入胜的视频？它探讨了定义在线视频的客观属性与人类感知的主观细微差别之间的复杂关系。VQA
  并非独立存在；它的成功依赖于基准、统计数据和定义明确的技术。对这些方面的审视旨在理解测试和验证视频内容质量的细致过程[8]。本节探讨了 VQA 的基本特征，审视了构成我们理解和评估视频质量的复杂框架。了解影响视频质量的因素、人类感知的复杂性以及客观和主观评估中使用的技术，构成了深入调查的基础。




  ### 3.1.1 视频质量指标


  视频质量评估（VQA）围绕一系列专门为衡量数字视频视觉准确性而开发的测量方法和评估手段展开。这些指标旨在为量化视频质量的各个组成部分提供一套规范标准，从而促进公正的比较与评估。作为计算机视觉领域的一个分支，VQA
  试图复现人类在观看视频时的主观体验，以期获得一个代表感知质量的评分 [9]。现代一些流行的基准测试包括：实时视频质量挑战（LIVE-VQC）、YouTube 用户生成内容（YouTube-UGC）、康斯坦茨自然视频数据库（KoNViD-1k）以及大规模社交视频质量（LSVQ）[10]。同样地，严格遵守全球基准，特别是国际电信联盟（ITU）制定的标准，能够提升评估流程的规范性
  [11, 12]。表 3-1 概述了多年来常用的 VQA 指标、评分系统及标准 [13, 14, 15]。


  表 3-1


  视频质量指标、评分系统及标准


  | VQA 指标 | 评分系统 | 描述 |

  | --- | --- | --- |

  | **客观视频质量指标** | 峰值信噪比（PSNR） | 量化信号可达到的最大功率与干扰噪声功率之间的比率。 |

  | 结构相似性指数（SSIM） | 评估原始图像与失真图像在结构上的相似程度，综合考虑亮度、对比度和整体结构等因素。 |

  | 多尺度结构相似性指数（MS-SSIM） | 通过优于 SSIM 模型的表现来取代它。该方法对亮度分量逐帧应用，然后计算平均指数。 |

  | 平均意见得分（MOS） | 一种转化为客观数值的主观指标，通常基于人类对视频质量的评估。 |

  | **主观视频质量指标** | 单刺激连续质量评估（SSCQE） | 要求观看者在视频播放过程中持续对视频质量进行评分。 |

  | 双刺激连续质量评估（DSCQE） | 使观看者能够将参考视频的质量与正在评估的视频进行持续比较评分。 |

  | **混合指标与评分系统** | 视频质量专家组（VQEG） | 结合主观和客观参数，对视频质量进行全面评估。 |

  | 混合视频质量指标（HVQM） | 整合主观和客观指标，提供对视频质量的综合评估。 |

  | **ITU 视频质量标准** | ITU-R BT.500 系列 | 描述了评估电视图像主观质量的技术。 |

  | ITU-T Rec. P.910 | 探讨了在多媒体应用中使用主观分析评估视频质量的方法 [16]。 |

  | ITU-T Rec. P.913 | 详细说明了在任何条件下评估互联网视频和电视广播质量的视频、音频及视听性能主观感知的方法 [17]。 |

  | ITU-T Rec. P.1204 | 针对可靠传输下分辨率高达 4K 的流媒体服务，处理其主观视频质量评估问题 [18]。 |


  在探究这些测量方法时，可以清楚地看到，通过在像素层面并兼顾人类感知，结合客观、主观和混合方法，能够实现对视频质量的全面评估。此外，遵循 ITU 标准可确保采用一种普遍认可且统一的方法，这些标准是为研究人员、工程师和行业专家制定的。根据
  ITU 的观点，尽管上述每种方法都有其优势和局限性，但明确推崇其中任何一种方法都是不切实际的。选择最适合特定条件的评估流程，取决于研究人员自身 [12]。


  ### 3.1.2 视频质量中的人类感知


  视频质量的评估超越了像素和帧的单纯技术特性，转而需要探索人类感知这一复杂领域。本节旨在审视人类认知与视觉内容之间错综复杂的相互作用，以深入了解人类如何感知和解读视觉刺激。以下是一些心理和生理变量
  [19, 20, 21]：


  *   **认知负荷**：指信息处理所需的心智努力。高认知负荷可能会影响对视频质量的感受，因为观看者可能难以处理复杂的视觉场景。


  *   **注意力与专注度**：干扰或视觉混乱会直接影响感知质量，以及观看者专注于画面中相关元素的能力。


  *   **色彩视觉**：人类视觉系统能够感知广泛的色彩，因此如果观察到色彩准确度有任何偏差，感知质量就会受到影响。


  *   **时间敏感性**：感知随时间变化的能力。更高的帧率有助于实现更流畅的运动，更贴近人类视觉系统固有的时间敏感性。


  *   **空间一致性**：空间关系中的不一致或失真会破坏视频内容的感知质量。


  *   **时间一致性**：指检测和解释随时间推移发生的变化的能力。提高帧率可增强运动的流畅性，精确匹配人类视觉系统固有的时间敏感性。


  *   **长时间观看**：长时间接触多媒体材料可能导致眼睛疲劳，这会削弱观看者理解高质量视觉内容的能力。


  *   **参与感与沉浸感**：引人入胜且身临其境的视觉体验会提升对卓越水平的感知，培养一种参与感和愉悦感。




  ### 3.1.3 视频质量属性


  随着世界对多媒体的依赖日益加深，确保服务提供商满足用户期望的质量标准，已成为决定其成败的直接因素。中国和印度等国家互联网接入率较低，但移动设备用于在线视频流媒体的使用率却很高。相比之下，美国等西方国家以及西欧部分地区，为电视网络设定了高标准。同样，由于选择更多，且只需点击一下按钮即可轻松便捷地更换服务，观众越来越倾向于选择视频流媒体提供商。全球流媒体市场增长率高达
  55%的数据也印证了这一点[22]。世界各地的最终用户都渴望获得顶级体验。根据普华永道（PwC）于 2019 年 10 月进行的一项涵盖美国 1000 多名 18
  至 64 岁人群的民意调查，简化流媒体内容播放流程的重要性日益凸显[23]。用户友好性与可靠性之间的关联，直接关系到用户参与度，对于促进用户长期使用并偏爱某项视频服务至关重要。图
  3-2 展示了 Akamai 内容分发网络（CDN）在视频分发过程中所体验到的视频流质量属性的重要性[24]。


