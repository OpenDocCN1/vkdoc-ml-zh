  在类似的研究中，Yousef 等人使用监督分类，通过基于平均杂质减少量预测 ABR 的显著属性来估计其类别 [88]。作者声称，该方法可以通过提供一组可在应用层使用的输入属性来预测任何
  ABR 方法的比特率选择。通过将其重构为一个多类分类问题，解决了预测难题，该问题包括交付质量（QoD）指标，例如过去和当前阶段的缓冲区大小、速度水平和下载时间。比较了多种机器学习方法的预测能力，包括逻辑回归、SVM、RF、DT、梯度提升（GB）和朴素贝叶斯（NB）。实验得出结论，RF
  和 GB 模型在性能上最为有效。


  该研究领域的其他值得注意的出版物包括 Bentaleb 等人提出的 ACTE 方法 [89]，这是一种基于片段下载调整比特率的独特方法。该策略改善了带宽，并减少了卡顿和延迟的发生。Zhao
  等人 [90] 使用两个神经网络，通过控制网络延迟并在 ABR 和延迟自适应方面做出更准确的决策来增强观看体验。根据 Sani 等人 [91] 的研究，RF 被证明是开发基于
  HTTP 的 ABR 视频流基础设施最有效的算法。评估是通过考虑视频片段的下载和到达时间、编解码器类型、片段长度和带宽等因素进行的。Da Hora 等人 [92]
  在使用支持向量回归（SVR）计算 YouTube 视频的 MOS 时，实现了 0.60 到 0.79 的 RMSE。研究人员纳入了上行链路和下行链路时间、帧数以及接收信号强度指示（RSSI）等特征。Ligata
  等人 [93] 成功使用 RF 对流媒体与缓冲比率、缓冲延迟、频率和持续时间进行了精确预测。本文使用的概念框架如图 3-17 所示。因此，他们的准确预测率在 85%
