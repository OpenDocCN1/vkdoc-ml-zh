  \ LBP 矩阵。完整的说明过程见第 4.3 节。\n\n#### 应用高斯模糊实现模糊效果\n\n高斯模糊的应用过程通过`gaussianblur()`方法执行，该方法遵循以下步骤。代码见清单\
  \ 6-27。\n\n1.  使用`LBP41gblur()`方法创建`mapDIST`对象。\n\n2.  定义一个 sigma 值数组，分别为 0.5、1、1.5、2\
  \ 和 2.5。\n\n3.  定义卷积核的大小。\n\n4.  计算高斯模糊：\n    1.  遍历定义的 sigma 值。\n\n2.  根据每个值计算卷积核。\n\
  \n3.  为模糊图像初始化一个输出数组。\n\n4.  在输入图像周围添加填充以处理边缘情况。\n\n5.  使用高斯核和输入图像执行卷积操作。\n\n6.\
  \  对卷积结果求和，得到模糊后的像素值。\n\n5.  提取特征：\n    1.  将模糊后的像素值四舍五入为整数。\n\n2.  对模糊图像应用`LBP41gblur()`方法。\n\
  \n3.  使用`mapPRI`调用`multadd()`方法。\n\n4.  计算并分配当前模糊迭代的特征值。\n\n6.  创建由特征标签和值组成的字符串，并通过`outputstream`对象将其写入“dataset1.txt”文件。这些标签从“11”开始，对于每个后续的\
  \ sigma 值，依次递增到“15”。\n\n```\n// 对给定的二维数组应用高斯模糊。\npublic String[] gaussianblur(double[][]\
  \ img1) {\n// 使用 LBP41gblur 方法初始化距离图。\nmapDIST = LBP41gblur(img1);\n// 定义用于高斯模糊的\
  \ sigma 值数组。\ndouble[] sigma = {0.5, 1, 1.5, 2, 2.5};\ndouble feat[] = new double[sigma.length];\n\
  // 定义卷积核的大小。\nint[][][] size = {{{-1, 0, 1}, {-1, 0, 1}, {-1, 0, 1},}, {{-1, -1,\
  \ -1}, {0, 0, 0}, {1, 1, 1},}};\nint len = 2;\nint wid = 2;\ndouble kernel[][] =\
  \ new double[3][3];\n// 遍历 sigma 值进行高斯模糊。\nfor (int blur = 0; blur < sigma.length;\
  \ blur++) {\n// 遍历卷积核的维度。\nfor (int B = 0; B < 3; B++) { // 1;9 0;8 1;9 2;10\nfor\
  \ (int C = 0; C < 3; C++) { // 2;7 1;6 0;5 1;6\n// 计算高斯核的指数项。\ndouble exp_conp =\
  \ -(Math.pow(size[0][B][C], 2) + Math.pow(size[1][B][C], 2)) / (2 * sigma[blur]\
  \ * sigma[blur]);\n// 计算高斯核值并存储到 kernel 数组中。\nkernel[B][C] = (Math.exp(exp_conp))\
  \ / (2 * Math.PI * sigma[blur] * sigma[blur]);\n}\n}\n// 初始化一个二维数组来存储高斯模糊的输出。\n\
  double[][] out = new double[img1.length][img1[0].length];\n// 用零填充 out 数组。\nfor\
  \ (double[] array : out) {\nArrays.fill(array, 0);\n}\n// 定义输入图像周围的填充像素数。\nint numOfPads\
  \ = 1;\n// 创建一个带填充的临时二维数组。\ndouble[][] temp = new double[img1.length + numOfPads\
  \ * 2][img1[0].length + numOfPads * 2];\n// 用零初始化 temp 数组。\nfor (int i = 0; i <\
  \ temp.length; i++) {\nfor (int j = 0; j < temp[i].length; j++) {\ntemp[i][j] =\
  \ 0;\n}\n}\n// 将输入图像复制到 temp 数组的中心。\nfor (int i = 0; i < img1.length; i++) {\nfor\
  \ (int j = 0; j < img1[i].length; j++) {\ntemp[i + numOfPads][j + numOfPads] = img1[i][j];\n\
  }\n}\n// 初始化用于计算的变量。\nint S = 0;\ndouble calc[][][] = new double[out.length * out[1].length][3][3];\n\
  // 嵌套循环执行卷积操作。\nfor (int i = 0; i < temp.length - len; i++) {\nfor (int j = 0; j\
  \ < temp[i].length - wid; j++) {\nint Q = 0;\nfor (int k = i; k < i + len + 1; k++)\
  \ {\nint R = 0;\n// 嵌套循环计算卷积。\nwhile (Q < 3 && R < 3) {\nfor (int l = j; l < j +\
  \ len + 1; l++) {\ncalc[S][Q][R] = temp[k][l] * kernel[Q][R];\nR++;\n}\nQ++;\n}\n\
  }\nS++;\n}\n}\n// 初始化一个数组来存储卷积结果的总和。\ndouble[] sum = new double[calc.length];\n\
  // 计算卷积结果的总和。\nfor (int a = 0; a < calc.length; a++) {\nfor (int b1 = 0; b1 < 3;\
  \ b1++) {\nfor (int c = 0; c < 3; c++) {\nsum[a] = sum[a] + calc[a][b1][c];\n}\n\
  }\n}\n// 创建一个二维数组来存储四舍五入后的最终结果。\ndouble array2d[][] = new double[img1.length][img1[1].length];\n\
  // 将四舍五入后的值分配给二维数组。\n// 遍历图像数组的行。\nfor (int i = 0; i < img1.length; i++) {\nfor\
  \ (int j = 0; j < img1[i].length; j++) {\narray2d[i][j] = sum[j % img1[1].length\
  \ + i * img1[1].length];\n// 将四舍五入后的总和值分配给二维数组。\narray2d[i][j] = Math.round(array2d[i][j]);\n\
  }\n}\n// 对二维数组应用 LBP41gblur 方法，并将结果分配给 mapPRI。\nmapPRI = LBP41gblur(array2d);\n\
  // 使用 mapPRI 调用 multadd 方法。\nmultadd(mapPRI);\n// 计算并分配当前模糊迭代的特征值。\nfeat[blur] =\
  \ sumRow / sumRow1;\n}\n// 初始化一个字符串数组来存储高斯模糊特征提取的结果。\nString[] sgblur = new String[5];\n\
  // 初始化一个用于标记特征的计数器。\nint count = 11;\n// 遍历 feat 数组，创建带有标签和值的字符串，并更新 outputstream。\n\
  for (int i = 0; i < feat.length; i++) {\nsgblur[i] = count + \":\" + feat[i];\n\
  outputstream.print(\"\" + sgblur[i] + \" \");\ncount++;\n}\n// 返回包含高斯模糊特征的字符串数组。\n\
  return sgblur;\n}\n清单 6-27\n应用高斯模糊\n```\n\n\n\n此外，为了便于从具有指定均值和方差的高斯分布中生成随机数，使用了清单\
  \ 6-28 中给出的 `getGaussian()` 方法。\n\n```\n// Generate a random number from a Gaussian\
  \ distribution with a specified mean and variance.\nprivate double getGaussian(double\
