  1.  **导入模块**：文件开头使用 `require` 关键字添加模块。添加的库有助于创建 HTTP 服务器、建立 WebSocket 连接、执行带权限的文件系统操作、处理屏幕截图，以及处理与\
  \ servlet 之间的请求-响应机制。\n\n2.  **初始化全局变量**：声明并初始化将在整个脚本中使用的对象。\n\n3.  **创建 HTTP 服务器**：在端口\
  \ 8081 上托管一个 HTTP 服务器，监听来自请求连接的客户端的传入请求。此服务器托管 WebSocket 连接。\n\n4.  **处理 WebSocket\
  \ 连接**：创建 WebSocket 服务器并将其绑定到 HTTP 服务器。然后，它监听来自连接客户端的连接，获取站点名称、数据块数量和二进制数据等信息，然后触发\
  \ VQA 流程。\n\n5.  **处理屏幕截图**：通过附加从客户端接收到的 8 KB 数据块来重建图像，并使用 `sharp` 库进行裁剪，使其仅包含视频帧。\n\
  \n6.  **与 Java servlet 通信**：使用 `axios` 库，向本地主机上托管的 Java servlet 发送 HTTP POST 请求，以根据裁剪并存储的图像计算\
  \ MOS。处理响应并将其映射为可解释的视频质量评级。\n\n7.  **监控视频质量**：通过 WebSocket 连接将指标更新发送到客户端，包括 MOS\
  \ 分数、质量评级和平均分数。\n\n在每个检查点，脚本都会记录语句，以提供对监控过程的洞察。这包括服务器的当前状态、发送和接收的消息，以及从 servlet\
