  ### 1.1.4 NTMA 技术与方法论


  NTMA 证明了技术创新与分析能力可以成功共存。从简单的数据包捕获到强大的机器学习算法，NTMA 通过允许电信工程师和数据分析师挖掘有用的模式、异常和结论，穿越原始数据的迷宫。数据包捕获的概念处于
  NTMA 技术的顶峰。这种基本方法在网络中拦截并捕获传输中的数据包。网络专家通过以自然形式（从头部到有效载荷）捕获数据包，从而获得对数据包所含信息的开放访问权限
  [20]。数据包捕获是理解通信模式、分析数据流特征，以及最重要的是识别可能表明安全问题或连接不一致的异常的基础。这种方法类似于数字化的罗塞塔石碑，破译着网络连接的含义。


  网络分析的核心方法之一围绕通过基于流的评估来处理大量网络数据，其中流是根据共享特征（例如源地址和目标地址、端口号和协议类型）对数据包进行分组而形成的 [21]。这种解耦允许网络管理者基于累积的信息而非单个数据包做出更优选择，从而形成对网络行为更全面的认知
  [22]。随后，洞察结果从设备、应用和服务层面观察到的模式行为中得以发展和推导。


  随着 NTMA 专业人员探索这一领域，两种不同的方法应运而生：主动网络监控和被动网络监控。为了测量吞吐量、安全性和可靠性，主动网络监控会故意生成流量。主动监控是一种通过使用“探针”或“代理”模拟不同情况来收集响应时间、延迟和其他指标数据，从而评估网络状态的方法
  [23]。类似于实验室实验，这种方法可以无阻碍地观察网络的结构和运行。当可用性和响应性至关重要时，主动监控因其能够持续评估网络行为和性能而大放异彩。MarketsandMarkets
  预测，全球网络监控市场到 2030 年将超过 69.7 亿美元 [24]，例如金融行业就使用主动监控来确保交易平台能快速响应瞬息万变的市场动态。


  相反，被动网络监控则扮演着沉默观察者的角色，记录所有网络活动，而不增加正在传输的数据量 [25]。深度包检测（DPI）等技术体现了这种方法，它允许网络管理者记录并检查未经更改的流量。当需要深入了解网络行为的深层历史背景时，被动监控是首选。互联网服务提供商（ISP）通常使用被动监控技术，例如分析流量模式，以更好地分配资源和优化其网络
  [26]。


  此外，数据分析和机器学习的采用为 NTMA 框架注入了额外的可靠性和高精度，将其提升到了一个全新的维度。一系列机器学习算法为模式识别和异常检测提供了全面的工具集
  [27]。如果不使用推理和描述性统计，网络专家将无法检测到那些本会被忽略的异常 [28]。此外，由于 NTMA 与机器学习的结合，预测分析和异常检测已进入一个新时代。从监督算法到深度学习（DL）架构，机器学习模型消耗海量数据集，以发掘先前隐藏的相关性和异常值。2021
  年全球网络犯罪损失已惊人地达到 6 万亿美元，预计网络攻击将进一步增加 [29]。这种与机器学习的集成可以提高威胁检测的准确性。由于机器学习模型能够根据不稳定的网络行为进行改变和适应，NTMA
  能够更好地预见潜在问题、发现异常值并提出预防措施。机器学习将 NTMA 从一种被动方法转变为主动方法，满足了现代数据驱动社会的需求。


  随着 NTMA 进入一个以信息过载和先进技术为特征的时代，其方法也反映了这种快速变革。通过数据包捕获、基于流的分析、统计和机器学习所获得的洞察力的协同作用，网络流量的复杂动态得以揭示。在这个以连接和知识为特征的时代，这部交响乐为电信专家提供了不仅理解而且预测网络行为的手段，引导网络基础设施走向高效、安全和卓越性能。图
  1-4 描绘了作为近期大多数 NTMA 过程研究基础的概念框架 [30]。


  ![](img/612428_1_En_1_Fig4_HTML.jpg)


