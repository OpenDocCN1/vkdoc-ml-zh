  2-14 所示，首先对时域捕获的流量进行分解，然后加入显式的大象流和子链路信息。这一步被证明对实验的成功至关重要，将长达五分钟时间段的预测准确性提高了。文中还提到了用于降低测量成本的插值机制。然而，主要结论是改进后的预测方法可以帮助百度将其带宽上限提升
  9%。作者特别强调了通过研究持续降低误差的重要性，因为即使是微小的改进，对于定期做出财务决策的公司来说也意义重大。


