  \n图 5-15\n在最佳网络环境下浏览 Facebook 和 Google 新闻\n\n## 5.5 本章小结\n\n第 5 章致力于基于前几章学到的概念，使用\
  \ JavaScript 开发 NTMA 框架的应用。首先描述了系统模型，接着介绍了客户端和服务器端文件的组成及其相互连接，并特别强调了它们各自的特性与协议。用户界面以用户友好为基础，结合\
  \ HTML 和 CSS 构建。本章还通过代码详细阐述了该应用中涉及的两个机器学习模型，并给出了时间序列预测、设备活动分类以及 QoS 评分计算的方法。关键要点如下：\n\
  \n*   使用 JavaScript 开发 NTMA 应用的过程，涉及创建并执行负责监控和分析网络流量的客户端与服务器端范式。\n*   NTMA 系统模型包括在\
  \ Google Chrome 中作为浏览器扩展执行的客户端文件，以及在 Node.js 服务器上执行的服务器程序。\n*   网络监控过程由应用的客户端通过一个按钮触发，随后无缝地与服务器端通信以接收网络流量数据。服务器还负责处理这些数据，并通过机器学习算法进行分类和预测分析。\n\
  *   该应用旨在通过将实时收集的数据与先前存储的数据相结合，以适应预测分析中不断变化的场景。由于计算是在一分钟（该时间也可相应调整）后执行，因此可获得该时间点特定网络场景的结果。不过，建议使用与被分析网络环境相关的合适数据集。此外，MLP\
  \ 的超参数需要微调，以确保在不断变化的生态系统中获得最佳性能，这反过来也要求进行全面的测试。\n*   在此应用中，内置了多种机制以确保其在大规模网络中的可扩展性。首先，它被设计为模块化和分布式的，允许通过随着网络规模增大而增加更多\
  \ Node.js 服务器来实现水平扩展。\n*   端口号的使用支持并行化和流处理等高效数据处理技术，从而能够实时处理大量网络流量，每个客户端都被独立处理。\n\
  *   可以利用基于云的基础设施来动态分配资源，并确保最佳性能和效率。\n\n下一章将分解介绍视频质量评估（VQA）应用的功能和代码。\n\n"
- "# 6. 使用 JavaScript 开发视频质量评估应用\n\n本章延续实践之旅，介绍使用 JavaScript 开发视频质量评估（VQA）模型的应用层面。为了获得视频流质量的实时平均意见得分（MOS），采用了无参考（NR）图像质量评估（IQA）指标。在内容以秒级速度被大量消费的时代，通常无法获得原始视频源。本书提出的算法以实时视频为输入，连续截取屏幕截图，并将其顺序输入算法。阻塞、振铃、模糊和噪声是应用盲/无参考图像空间质量评估器（BRISQUE）所针对的伪影示例。因此，本章详细阐述了如何使用\
  \ JavaScript 构建一个健壮、可靠且实时的 VQA 框架。\n\n\n\n## 6.1 VQA 系统模型\n\n本节将详细阐述 VQA 框架的系统模型。该模型采用三层架构，包括客户端、基于\
  \ Node.js 的后端服务器以及使用 Apache Tomcat 托管的本地 Java Servlet。出于测试目的，这三个系统运行在同一设备上。因此，最终用户将看到一个具有以下功能的面板：\n\
  \n1.  通过浏览器扩展，直接在网页浏览器中监控实时视频质量指标。\n\n2.  获取正在观看的视频流的实时视频质量评分，评分范围为 1 到 100。根据 VQA\
  \ 领域多家供应商使用的术语 [1]，该评分被称为实时平均意见得分（MOS），其中**较低的值**代表更好的客观质量。同样，**较高的值**则表示失真程度更高。\n\
  \n3.  获取一个主导质量评级，该评级总结了所分析帧的视频质量表现。\n\n这些功能的编码方式是，向服务器（进而向 Servlet）请求预设数量帧的视频指标。浏览器扩展由\
  \ JavaScript (JS) 驱动，后端为 Node.js 服务器。在这种情况下，后端仅负责充当客户端和 Servlet 之间的中介。Servlet 作为主要的\
  \ VQA 模块，其输入是网页浏览器截取的图像截图，该截图通过 Node.js 服务器传递，最终由 Servlet 接收。前端由 HTML 和 CSS 构成，而扩展和服务器之间以\
  \ JSON 格式来回发送消息。为了触发 Servlet，通过指定所截取截图的索引来发起一个 HTTP POST 请求。在 Node.js 服务器请求后，Servlet\
  \ 经过几秒钟的处理，会返回一个包含 MOS 评分的 JSON 响应。然后，服务器将此信息中继给客户端，客户端据此更新图形用户界面（GUI）。客户端接收到的信息还包括不同分析帧的\
  \ MOS 评分平均值，以及一个主导质量评级，该评级表示在特定会话期间哪个评级出现次数最多。能够在几秒钟内快速监控视频质量并生成多个指标，是此 VQA 应用程序的显著特点之一，该应用程序也被打包成一个简单的浏览器扩展。浏览器扩展需要四个文件来持续截取截图并与\
  \ Node.js 服务器通信，如完整的系统模型图 6-1 所示。\n\n![](img/612428_1_En_6_Fig1_HTML.jpg)\n\n一个\
  \ VQA 系统模型从浏览器扩展包开始，接着是 Node.js 服务器，最后以 Java Servlet 结束。然后，该过程重复进行。\n\n图 6-1\n\n\
  完整的 VQA 系统模型\n\n### 6.1.1 组件与功能\n\nWebSocket [2] 库使用 JSON 格式封装的消息，为 Node.js 服务器和浏览器扩展之间的双向通信框架提供支持。四个客户端文件、Node.js\
  \ 服务器以及 Servlet 的功能总结于表 6-1 中。\n\n表 6-1\n\nVQA 的文件功能\n\n| 文件 | 功能 |\n| --- | ---\
  \ |\n| **popup.html** | 当用户在网页浏览器的工具栏中点击扩展图标时，此文件决定了所出现面板的结构、内容和组件。因此，它被称为前端，包含构成监控图表、面板卡片以及用于触发服务器并启动\
  \ VQA 流程的按钮的用户界面（UI）元素。 |\n| **background.js** | 它负责管理与扩展各个部分相关的事件、状态和活动。通常，此类脚本用于监督持久性交互、管理通信模式以及执行后台任务。\
  \ |\n| **pop.js** | 它提供了当 UI 组件被交互和激活时调用的例程。因此，它管理用户交互和弹出窗口内的任何动态信息，以及向服务器发送数据和从服务器接收数据。在接收到来自服务器的输出消息后，它会更新文档对象模型（DOM）。\
  \ |\n| **manifest.json** | 作为一个 JSON 格式的文件，它提供了有关要使用的脚本以及控制标签页使用权限的信息。manifest.json\
  \ 文件还包括扩展的名称、版本、权限、操作和图标图像源。因此，它向浏览器提供了有关该扩展的信息。 |\n| **server.js** | 用 JS 编写的 server.js\
  \ 文件充当后端服务器，负责作为客户端和 Java Servlet 之间的中间人。在此应用程序中，与扩展客户端成功连接后，它首先接收客户端截取的截图数据块，并将其编译成\
  \ PNG 图像。然后，根据正在访问的网站，它使用 Sharp 库 [3] 裁剪图像，使其仅包含正在观看的视频帧。此帧随后也以 PNG 文件形式存储在本地。接着，它向\
  \ Servlet 发出 HTTP POST 请求，并等待包含 MOS 评分的响应，然后将该评分中继回客户端。server.js 文件包含多个库，以实现这种无缝交互。\
  \ |\n| **Servlet 包 (VQA 模块)** | Servlet 包使用 Java 在 Eclipse IDE 中编码。它使用下载的 Apache\
  \ Tomcat 服务器托管在本地主机上，并被编程为接收 HTTP POST 请求。当被触发时，Servlet 检索先前由 Node.js 服务器存储的图像，并将其通过一系列处理步骤，即\
  \ VQA 模块。输出是一个 MOS 评分，范围从 1 到 100，Servlet 以 JSON 格式将该评分输出到服务器。 |\n\n简而言之，当用户访问视频流媒体网站（如\
  \ YouTube 或 Twitch）时，可以使用该扩展通过 MOS 评分来监控正在观看视频的实时视频质量。这是通过在前一个截图处理完毕后立即截取一系列截图来实现的。用户只需点击“监控”按钮，即可分析使用\
  \ Chart.js [4] 创建的动态图表。\n\n### 6.1.2 视频质量 MOS 评分预测\n\n在此框架中，客户端截取的截图在生成 MOS 评分之前会经过一系列处理步骤。该评分代表了正在流式传输的视频的质量。该应用程序适用于具有自适应比特率（ABR）流式传输的视频播放器。此处的目标是获得一个普通用户能够理解的评分和评级。每张截取的截图都会在服务器端被标记，因为本地\
  \ Servlet 通过指定其文件路径来裁剪和获取同一图像。通过 HTTP POST 请求发送的参数决定了截取哪张截图。Node.js 服务器被编程为在从 Servlet\
  \ 获得响应后立即请求客户端截取另一张截图。在此过程中，它也会发送结果。因此，Node.js 服务器充当客户端和 Servlet 之间的中介，执行诸如裁剪图像和处理\
  \ HTTP 调用等操作。这消除了客户端的任何处理负载，从而防止了客户端在观看视频时出现延迟和卡顿。\n\n\n\n### 6.1.3 VQA 应用布局\n\n\
  在此应用中，弹出窗口使用户能够直接在网页浏览器中监控实时视频质量指标。实时图表会显示这些指标，并且可以动态调整，仅查看所需的参数。扩展程序打开后，会自动搜索要连接的\
  \ Node.js 服务器。“监控”按钮作为启动 VQA 过程的触发器。MOS 分数代表 servlet 针对某一特定帧生成的质量分数。点击此按钮时，会截取网页浏览器的屏幕截图并发送至\
  \ Node.js 服务器，在那里进行处理并馈送给 servlet。最终用户可以使用实时和主导两种质量指标。前者代表 servlet 实时输出的每一帧的质量评级，而后者则指示在特定会话期间获得最多的质量。图\
  \ 6-2 展示了完整的浏览器扩展程序。\n\n![](img/612428_1_En_6_Fig2_HTML.jpg)\n\n截图包含 VQA 布局。它包括一个数值与已分析帧数的关系图、视频质量性能以及图例。\n\
  \n图 6-2\nVQA 应用布局\n\n### 6.1.4 客户端–服务器–Servlet 交互\n\n图 6-3 展示了浏览器扩展程序、Node.js 服务器和托管的\
  \ Apache Tomcat Java servlet 之间的逐步三方通信框架。\n\n![](img/612428_1_En_6_Fig3_HTML.jpg)\n\
  \nVQA 系统模型的交互过程始于扩展程序启动、WebSocket 全双工通信、监控按钮、检索 URL 站点、处理接收、裁剪屏幕截图、发送 HTTP POST，然后继续查询和指标。\n\
  \n图 6-3\nVQA 的客户端–服务器–Servlet 交互\n\n## 6.2 VQA 的客户端程序结构\n\n在本节中，客户端（即前端）通过四个基本文件进行描述。图\
  \ 6-4 概述了客户端的程序结构。\n\n![](img/612428_1_En_6_Fig4_HTML.jpg)\n\n客户端程序结构包括以下组件：`manifest.json`、`background.js`、`popup.html`、`pop.js`。\n\
  \n图 6-4\n客户端程序结构\n\n### 6.2.1 配置扩展程序设置和权限\n\n本节涉及包含元数据的 `manifest.json` 文件，该文件允许\
  \ Google Chrome 将浏览器扩展程序添加到其列表中。此文件的代码见代码清单 6-1。图标可以添加到与 `manifest.json` 文件相同的目录中，如果用户希望使用默认图标，也可以省略。\n\
  \n```\n{\n\"manifest_version\": 3,  // Chrome 扩展程序的清单格式版本。\n\"name\": \"Video Quality\
  \ Assessment\",  // Chrome 扩展程序的名称。\n\"version\": \"1.0\",  // Chrome 扩展程序的版本号。\n\
  \"icons\": {\n\"16\": \"icon16.png\",   // 16x16 像素大小的图标。\n\"48\": \"icon48.png\"\
  ,   // 48x48 像素大小的图标。\n\"128\": \"icon128.png\"  // 128x128 像素大小的图标。\n},\n\"background\"\
  : {\n\"service_worker\": \"background.js\"  // 后台脚本，作为 Service Worker 实现。\n},\n\"\
  permissions\": [ // 扩展程序所需的权限列表。\n\"activeTab\",  // 允许扩展程序与当前活动标签页交互。\n\"scripting\"\
  ,  // 允许向网页注入脚本。\n\"webNavigation\",  // 使扩展程序能够接收网页导航生命周期中的事件。\n\"webRequest\"\
  ,  // 授予扩展程序访问以观察和分析网络请求的权限。\n\"storage\",  // 提供对浏览器存储 API 的访问以实现数据持久化。\n\"declarativeNetRequest\"\
  ,  // 允许扩展程序声明一组用于网络请求的规则。\n\"declarativeNetRequestFeedback\",  // 允许扩展程序提供关于网络请求的反馈。\n\
  \"tabs\"  // 使扩展程序能够查询和操作浏览器标签页。\n],\n\"action\": {\n\"default_popup\": \"popup.html\"\
  ,  // 点击扩展程序图标时的默认弹出 HTML 文件。\n\"default_title\": \"Video Quality Assessment\" \
  \ // 扩展程序图标的默认标题。\n}\n}\n代码清单 6-1\n使用扩展程序设置和权限配置 manifest.json\n```\n\n### 6.2.2\
  \ 配置后台脚本\n\n后台脚本充当一个被忽视的编排者，负责管理后台的关键操作，包括处理触发 Service Worker 逻辑的按钮按下事件。此文件的代码包含在\
  \ `background.js` 文件中，详见代码清单 6-2。\n\n```\n// 记录一条消息，指示扩展程序已启动。\nconsole.log(\"Extension\
  \ launched...\");\n// 监听扩展程序操作按钮的点击事件。\nchrome.action.onClicked.addListener(buttonClicked);\n\
  // 处理按钮点击事件的函数。\nfunction buttonClicked(tab) {\n// 记录一条消息，指示在点击按钮时后台脚本正在运行。\nconsole.log(\"\
  Background script running...\");\n}\n// 可以在此处添加额外的 Service Worker 逻辑\n// 此脚本独立于扩展程序运行，可以高效地执行后台任务\n\
  // 开发者可以扩展 Service Worker 的功能以处理各种任务，例如\n// 网络请求、数据管理和后台处理。\n代码清单 6-2\n使用 Service\
  \ Worker 逻辑配置 background.js\n```\n\n### 6.2.3 构建用户界面\n\n用户界面通过结合 HTML 和 CSS 构建，创建一个包含实时图表、视频质量指标、图例和一个按钮的弹出窗口。这些组件在同一个\
  \ HTML 文件（即 `popup.html`）中设置样式。程序的这一部分负责向最终用户直观地显示用于视频质量监控的相关指标。\n\n#### 文件功能\n\n\
  本节提供对 `popup.html` 文件的详细分析，概述其具体功能如下：\n\n1.  指定文档结构，包括以下内容：\n    1.  文档类型和语言。\n\
  \    2.  字符集和标题。\n    3.  修改内容安全策略（CSP）以允许特定的脚本源。\n\n2.  添加对外部资源的引用：\n    1.  从\
  \ Google Fonts [5] 导入所需的字体样式表。\n    2.  从 Font Awesome 图标库 [6] 导入仪表板的图标。\n    3.\
  \  链接从 Bootstrap 官方网站 [7] 下载的自定义 Bootstrap 样式表。\n\n3.  添加内部 CSS 以修改组件外观：\n    1.\
  \  设置主体、背景和按钮的样式。\n    2.  定义用户界面组件（如按钮、标签和图表）的样式。\n\n4.  显示标题和图表区域：\n    1.  为弹出窗口设置标题。\n\
  \    2.  创建一个用于嵌入图表区域的容器。\n    3.  使用 Chart.js 嵌入图表画布。\n\n5.  显示“视频质量性能”卡片：\n  \
  \  1.  创建一个用于视频质量指标的容器。\n    2.  分别显示最新的 MOS 分数、平均 MOS 分数、实时质量评级和主导质量评级及其图标。\n\n\
