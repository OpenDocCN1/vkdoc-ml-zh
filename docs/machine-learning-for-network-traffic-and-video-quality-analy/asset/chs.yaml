  ### 3.1.4 最优 VQA 策略


  随着观众越来越多地消费基于 IP 的剧集式长视频内容，他们对优质视频内容的期望也更高。无论使用何种设备或方法，内容的卓越水平都应保持一致。当移动设备观看视频的普及与发达国家观众更倾向于在电视屏幕上观看长篇连续剧和电影这一事实相矛盾时，情况就变得复杂了。据
  Vox 报道，Netflix 声称其流媒体内容中有高达 70%是在智能电视上消费的，而非手机、平板电脑或个人电脑[25]。观众期望广播电视和 OTT 视频在所有设备上都能提供一致的质量水平[26]。


  关键在于，目前尚无行业标准来定义理想视频的外观。尽管 VQA 已有既定标准，但互联网视频传输方面缺乏实践规范，导致业界无法达成共识。因此，视频服务提供商关注一系列基本的
  KPI，例如：重新缓冲率、视频启动时间（即用户请求视频到视频实际播放之间的时间）以及比特率（通常以 Kbps 或 Mbps 为单位）[27]。图 3-3 展示了视频服务提供商通常分析的视频质量与用户留存率之间的关系。


  ![](img/612428_1_En_3_Fig3_HTML.jpg)


  视频质量与用户留存率关系的示意图。相互关联的组件包括：交付性能、体验质量和业务成果，它们分别影响视频交付质量、观看体验和业务收益的衡量。


  图 3-3


  视频服务提供中视频质量与用户留存率的关系


  标准化之路首先在于确定指标、方法和测量工具，以保持评估的准确性和一致性。图 3-4 展示了通过添加两类指标来得出观众体验的过程[24]。


  ![](img/612428_1_En_3_Fig4_HTML.jpg)


  用户参与旅程流程图。QoS 指标与 QoE 指标之和构成性能，性能进而转化为最优方法和用户参与度。性能包含 QoS 和 QoE 指标的混合。


  图 3-4


  用户参与旅程


  如图 3-2 所示，流媒体和视频质量是决定视频服务提供商成功与否的关键指标，因此，必须定制并持续更新 VQA 算法的设计，以跟上最终用户的步伐。一个稳健的 VQA
  策略甚至会考虑客户旅程，以融合 QoS 和 QoE 指标。


  ### 3.1.5 体验质量（QoE）指标


  为了进一步理解 VQA 在数字环境中的必要性，审视那些可以在用户端测量的指标至关重要。正如消费者技术协会（CTA）所描述的，*QoE*指的是用户在观看应用或服务时所体验到的满意或不满意程度[28]。感知参与度是根据观众因消费媒体内容而产生的满意度来衡量的，这在很大程度上取决于用户的设备。QoE
  指标可以是客观的，也可以是主观的。表 3-2 列出了视频分析供应商通常处理的一些常见客观 QoE 指标[29, 30]。


  表 3-2


  用于衡量用户参与度的 QoE 指标


  | QoE 指标 | 描述 | 网络状况不佳的后果 |

  | --- | --- | --- |

  | **可用性** | 最终用户请求时内容的可用性。 | 观看流媒体时出现播放困难或中断。 |

  | **比特率** | 表示在特定时间范围内发送的比特数。 | 质量较低的流媒体通常会导致视频模糊、分辨率较差。 |

  | **播放失败** | 在初始重新缓冲过程完成后，因播放错误而终止的播放次数。 | 视频可能提前终止，或播放器/浏览器可能崩溃。 |

  | **重新缓冲** | 当视频片段下载速度慢于播放速度时发生的视频传输延迟。 | 视频卡顿、冻结、黑屏，以及可能出现的“死亡之轮”现象。 |

  | **启动时间** | 从启动播放到视频开始播放之间的持续时间。 | 视频启动延迟过长，或在实时流和线性流之间切换时延迟过长。 |

  | **视频启动错误** | 在显示第一帧视频之前，视频初始化期间播放尝试被中止的频率。 | 视频流缺失。 |

  | **滞后比** | 计算方式为等待时间除以观看时间。 | 流媒体缓冲，若比率过高可能导致用户离开。 |


  尽管大多数平台都试图囊括这些指标中的大部分，但用于获取最终指标的框架通常各不相同，导致测量和报告缺乏一致性。例如，不同的工具使用不同的公式来量化重新缓冲，通过平均值或百分比等计算方式，将其表示为次数、持续时间或频率。这取决于事件发生的方式和时间。



  ### 3.1.6 服务质量（QoS）指标


  QoS 指标围绕交付链中构成服务和性能质量的组件展开。这涵盖了从内容生成和处理，到分发以及最后一公里交付的各个环节。为了处理体验质量（QoE）差异并精确定位服务降级的原因，需要为视频分发过程中的每一个环节（例如观众的互联网服务提供商、CDN
  以及内容准备设施）建立 QoS 指标。其他相互关联的要素包括可用性、吞吐量、传输时间和抖动 [31]。从 CDN 的角度来看，视频分发依赖于几个相互关联的要素，如表
  3-3 所述 [24]。


  表 3-3


  从 CDN 角度进行性能测量的 QoS 指标


  | QoS 指标 | 描述 | 影响因素 |

  | --- | --- | --- |

  | 流量/点击量 | 通过 CDN 传输的数据量，以访问次数或字节数衡量 | 源站、中间层、边缘节点点击量 |

  | 吞吐量 | CDN 可用于数据传输的容量 | 以 Mbps 表示 |

  | 卸载量 | 未回源的总请求数 | 点击次数和流量 |

  | 可用性 | 计算为成功点击次数占总点击次数的比率 | 边缘节点和源站响应 |


  ### 3.1.7 性能质量（QoP）指标


  为了对观众的体验达成一致的理解，有必要使用特定的指标来评估视频分发过程中每个组件的 QoS。这些指标应与评估体验质量的行业标准紧密对齐。QoP 指标是描述运营数据以增强系统性能的特征，并通过充当代理
  QoE 度量来提供对业务要素的洞察。如果客户正在观看时长为六秒的视频片段，而 CDN 在交付该片段时超过了六秒，那么客户端播放器将会经历重新缓冲。这可以使用 QoP
  指标来衡量，该指标也充当客户端重新缓冲的代理参数 [24]。


  ### 3.1.8 主观视频质量评估（VQA）


  作为最终消费者的**人类**是视觉质量的最终评判者，其判断可以通过主观实验获得。这需要一组人（通常是非专家，通常被称为测试对象）参与，其角色是评估特定测试材料（例如一系列电影）的感知质量
  [32]。主观实验通常在受控的实验室环境中进行，详见 ITU-R BT.500 建议书 [12]：


  *   观看距离。

  *   室内照明。

  *   标准化协议。

  *   测试时长。

  *   观察者招募。

  *   检测不一致观察者并拒绝其评分的方法。

  *   计算 MOS 精度的方法。


  在受控环境中进行主观实验之前，需要进行细致的规划，并考虑评估方法、测试内容选择、观看环境、评分量表和呈现时间。主观 VQA 的不同类型方法如下 [33]：


  *   **单刺激**：向参与者呈现测试内容的不同版本，没有任何用于比较的参考。一个例子是绝对类别评分（ACR）方法。

  *   **双刺激**：通过向参与者展示包含参考视频和降质视频的两个视频，参与者对两个视频之间的质量变化进行评分。这被称为降质类别评分（DCR）。

  *   **多刺激**：参与者根据参考视频判断多个视频内容样本的质量，并能够多次回看素材。一个例子是多媒体视频质量主观评估（SAMVIQ）。


  这些方法会产生参与者给出的个人评分，例如 MOS 或差分平均意见得分（DMOS），具体取决于实验的设置。


  ### 3.1.9 客观视频质量评估（VQA）


  鉴于主观实验需要密集的规划、物理空间和时间，研究人员和工程师转向了客观质量测量，其目标是准确地产生相同的 MOS。下面解释两种不同的方法 [34]：


  *   **心理度量**：这些参数试图通过纳入对比度和运动感知、频率选择、时空模式、掩蔽和颜色判断等因素来表征人类视觉系统。这些度量适用于广泛的视频降质类型，尽管它们的计算通常资源密集，并且不常用于流媒体应用。

  *   **工程度量**：通过首先从视频中提取特定元素或伪影，这些参数不会忽视人类视觉系统的特性。然而，其设计背后的基本理念是分析视频内容，而不是专注于基础的视觉建模。然后将一组特征塑造成一种评估质量的客观方法，进而关联起来以预测
  MOS。


  根据进行评估的环境，客观方法可以分为以下几种 [35, 36]：


  *   **全参考（FR）**：此方法允许访问完整的原始视频作为参考。FR 方法依赖于将修改后的视频与原始素材进行比较。

  *   **降参考（RR）**：在此方法中，将原始视频的代表性特征提供给算法，并将测试视频的分析结果与此匹配信息进行比较。

  *   **无参考（NR）**：在无法访问原始视频的情况下，此方法使用多种技术，例如考虑测试视频像素域内的伪影、使用源自其码流的细节，或设计一种基于像素和基于码流的混合模型。


  ### 3.1.10 网络、视频和流媒体的质量指标


  在分析了客观性质的 QoE、QoS 和 QoP 指标之后，本节详细阐述了最终用户在视频质量方面的主观概念。这些指标的汇总版本见图 3-5 [37]。


