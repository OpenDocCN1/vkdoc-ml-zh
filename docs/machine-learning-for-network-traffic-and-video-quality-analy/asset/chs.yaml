  }\n// 如果标签代表上传速度。\nelse if (updateLabel === \"uploadTraffic\") {\n// 推送数据，即实时指标。\n\
  chart.data.datasets[1].data.push(data);\n}\n// 如果标签代表延迟。\nelse if (updateLabel ===\
  \ \"latency\") {\n// 推送数据，即实时指标。\nchart.data.datasets[2].data.push(data);\n}\n//\
  \ 首次调用此方法时，更新图表选项以显示 y 轴刻度。\n// 这样做是因为 y 轴刻度最初是禁用的。\nmyChart.options.scales.y.ticks.display\
  \ = true;\n// 更新图表。\nchart.update();\n代码清单 5-10\n实时图表更新机制\n```\n\n## 5.3 NTMA 服务器程序结构\n\
  \n本节详细阐述负责以下主要操作的 Node.js 服务器：\n\n1.  **导入模块**：文件开头使用 `require` 关键字添加模块。添加的库用于创建\
  \ HTTP 服务器、建立 WebSocket 连接、读取系统信息、读取本地数据库以及实现机器学习算法。\n\n2.  **初始化全局变量**：声明并初始化将在整个脚本中使用的对象。\n\
  \n3.  **读取本地存储的数据库**：服务器负责从本地数据库读取先前存储的值。这些值存储在数组中供后续使用。\n\n4.  **创建 HTTP 服务器**：在端口\
  \ 8080 上托管一个 HTTP 服务器，监听来自请求连接的客户端的传入请求。该服务器托管 WebSocket 连接。\n\n5.  **处理 WebSocket\
  \ 连接**：创建 WebSocket 服务器并将其绑定到 HTTP 服务器。然后监听来自连接客户端的连接，获取发送的参数，并触发监控和分析进程。\n\n6.\
  \  **网络监控**：`systeminformation` 库帮助每隔一秒收集网络数据，如下载速度、上传速度和延迟值。还会计算其他指标。这些值通过 `WebSocket`\
  \ 连接实时发送到客户端。一旦网络流量记录持续一分钟，监控进程停止，并触发预测和分类算法，以及计算 QoS 分数的方法。\n\n7.  **MLP 预测方法**：`predictMLP`\
  \ 方法用于使用 MLP 算法进行时间序列预测，这涉及在实时值（这些值被添加到先前收集的另一组时间序列数据数组中）上训练模型。此过程还会计算算法的百分比准确率，并使用滑动窗口进行预测。\n\
  \n8.  **QoS 分数计算方法**：`calculateQoS` 方法用于根据抖动和延迟值计算 QoS 分数。该分数范围从“最佳”到“中等”再到“较差”。\n\
  \n9.  **KNN 分类方法**：`calculateKNN` 方法用于使用 KNN 算法对设备活动进行分类。它读取分类数据库，打乱数据，训练 KNN 模型，并根据通过网络监控测量的最后一个数据点预测当前设备活动。\n\
  \n同样，脚本还会记录语句，以提供有关服务器当前操作、来自客户端的消息、实时测量的指标以及从机器学习算法获得的结果的信息。服务器端程序结构的概览如图 5-11\
  \ 所示。\n\n![](img/612428_1_En_5_Fig11_HTML.jpg)\n\n服务器端程序的分类图包括库、全局变量和方法。库包括 http、si、fs\
  \ 和 KNN。全局变量是样本大小、延迟、设备活动和服务器。方法包括 ws server dot on、intel latency 和 predict MLP\
  \ 等函数。\n\n图 5-11\n\n服务器端程序结构\n\n### 5.3.1 库和所需资源\n\n在编写服务器脚本之前，首先通过 Node.js 的控制台使用\
  \ `npm install` 关键字在本地下载所使用的库。每个特定模块的安装说明见表 5-3 中的下载链接。\n\n表 5-3\n\n服务器库和资源说明\n\n\
  | 库/资源 | 用途 | 下载链接 |\n| --- | --- | --- |\n| http | 创建 HTTP 服务器。 | [12] |\n| websocket\
  \ | 绑定到 HTTP 服务器以建立 WebSocket 连接。 | [1] |\n| systeminformation | 提供对设备上网络接口的访问以读取网络流量。\
  \ | [2] |\n| fs | 作为文件系统，允许访问设备上的文件。 | [13] |\n| mlp | 创建感知器以预测网络流量参数。 | [5] |\n\
  | ml-knn | 创建 KNN 模型以对设备活动进行分类。 | [4] |\n\n### 5.3.2 添加库\n\n为了开始编写此应用程序的引擎，在 `server.js`\
  \ 文件顶部使用 `require` 关键字一个接一个地将上述库添加到服务器脚本中。如代码清单 5-11 所示。\n\n```\n//指定与服务器和监控过程相关的导入。\n\
  const http = require(\"http\"); // 导入 'http' 模块以创建 HTTP 服务器。\nconst WebSocketServer\
  \ = require(\"websocket\").server; // 导入 WebSocket 服务器模块。\nconst si = require('systeminformation');\
  \ // 导入 'systeminformation' 库以获取设备的系统信息。\nconst fs = require('fs'); // 导入 'fs' 模块以处理文件系统。\n\
  // 与机器学习相关的导入。\nvar MLP = require('mlp'); // 导入 'mlp' 库，用于多层感知器预测。\nvar KNN = require('ml-knn');\
  \ // 导入 'ml-knn' 库，用于 K-最近邻分类。\n代码清单 5-11\n添加库\n```\n\n\n\n### 5.3.3 声明全局变量\n\n\
  全局变量在整个脚本中被引用，并在某些方法中使用，对于维护状态和在脚本不同部分之间共享数据至关重要。因此，它们会在导入库之后立即进行声明和初始化，如代码清单 5-12\
  \ 所示。\n\n```\n// 声明并初始化将在服务器脚本中使用的全局变量。\nvar monitoringInterval; // 声明一个用于监控间隔的变量。\n\
  var sampleSize = 0; // 初始化一个用于样本大小的变量，在数据收集阶段使用。\nvar predTime = 0; // 初始化一个用于用户期望预测时间的变量。\n\
  var predRX = 0; // 初始化一个用于预测下载速度（Kb/s）的变量。\nvar predTX = 0; // 初始化一个用于预测上传速度（Kb/s）的变量。\n\
  var predLat = 0; // 初始化一个用于预测延迟（ms）的变量。\nvar scoreQoS = \"\"; // 初始化一个用于 QoS 分数（服务质量）的变量。\n\
  var latency = 0; // 初始化一个用于延迟测量（ms）的变量。\nvar averageLatency = 0; // 初始化一个用于计算平均延迟（ms）的变量。\n\
  var deviceActivity = \"\"; // 初始化一个用于确定设备活动状态的变量，可选值为 \"idle\"、\"browsing\" 或 \"\
  streaming\"。\n代码清单 5-12\n声明全局变量\n```\n\n### 5.3.4 获取本地数据库\n\n为了提高算法效率，考虑到网络流量仅收集一分钟，来自同一网络环境的先前收集的值会被加载到两个不同的数组中，分别用于下载速度和上传速度。这意味着这些值将与按下“监控与分析”按钮时记录的流量进行核对。因此，MLP\
  \ 回归算法将拥有一个足够大的数据集，以产生准确的预测。在此情况下，`downloadSpeed.txt` 和 `uploadSpeed.txt` 文件存储在\
  \ `Databases` 文件夹中，而该文件夹位于项目的根目录下。\n\n该过程进一步说明如下：\n\n*   使用 `fs.readFileSync` 方法同步读取指定文件的内容。\n\
  *   这些文件是 .txt 文件，其中包含的元素由换行符分隔。\n*   使用正则表达式将文件内容分割成值，并输入到数组中。\n*   生成的数组 `downloadArray`\
  \ 和 `uploadArray` 用于初始化 ML 模型的历史网络速度数据。\n\n如代码清单 5-13 所示。\n\n```\n// 从本地存储的数据库中获取一些先前存储的下载速度值。\n\
  const contents1 = fs.readFileSync(\"./Databases/downloadSpeed.txt\", 'utf-8'); //\
  \ 读取 'downloadSpeed.txt' 文件的内容。\nvar downloadArray = contents1.split(/\\r?\\n/);\
  \ // 将内容分割成一个数组，假设每行代表一个值。\n// 从本地存储的数据库中获取一些先前存储的上传速度值。\nconst contents2 = fs.readFileSync(\"\
  ./Databases/uploadSpeed.txt\", 'utf-8'); // 读取 'uploadSpeed.txt' 文件的内容。\nvar uploadArray\
  \ = contents2.split(/\\r?\\n/); // 将内容分割成一个数组，假设每行代表一个值。\n代码清单 5-13\n获取本地数据库\n```\n\
  \n### 5.3.5 创建 WebSocket 服务器\n\nWebSocket 服务器常用于实时应用，例如在线游戏、金融平台和监控工具，这些场景中低延迟至关重要。WebSocket\
  \ 越来越多地用于当今的 Web 应用程序，因为它们能够在客户端和服务器之间实现无缝通信，而无需不断地发送和接收 HTTP 请求和响应。这对于需要从服务器持续轮询的数据可视化仪表板来说非常重要，可以实现更快、更稳定的响应时间，并提高性能和响应能力。这转化为通过单个长期存在的连接实现的全双工通信通道。双向路径通过以下步骤创建：\n\
  \n*   使用 `http.createServer` 方法创建一个 HTTP 服务器，同时指定服务器监听传入请求的端口号。\n*   通过引用用于导入其模块的变量来创建\
  \ WebSocket 服务器的实例，然后将其附加到 HTTP 服务器。\n*   记录有关服务器状态的消息。\n\n这些过程在代码清单 5-14 中有详细说明。\n\
  \n```\n// 在端口 8080 上托管服务器连接。\nconst server = http.createServer(); // 创建一个 HTTP 服务器实例。\n\
  server.listen(8080); // 监听端口 8080 上的传入 HTTP 请求。\nconsole.log(\"服务器已在端口 8080 上启动...\"\
  ); // 记录一条指示服务器已启动的消息。\nconsole.log(\"正在等待连接...\"); // 记录一条指示服务器正在等待连接的消息。\n// 创建一个\
  \ WebSocket 服务器实例，并将其附加到先前创建的 HTTP 服务器。\nconst wsServer = new WebSocketServer({\n\
  httpServer: server,\n});\n代码清单 5-14\n创建 WebSocket 服务器\n```\n\n### 5.3.6 监听客户端连接请求\n\
  \n本节涉及与客户端和服务器之间交互相关的几个过程，如图 5-3 所示。这些过程详述如下：\n\n*   监听客户端发出的连接请求。\n*   接受连接。\n\
  *   获取客户端通过 JSON 格式字符串发送的“窗口大小”和“预测时间”变量。\n*   从设备的网络接口读取网络数据。\n*   填充用于下载速度、上传速度和延迟的数组。\n\
  *   在收集到一分钟的网络流量时，调用预测和分类方法。\n*   在收集到一分钟的网络流量时，调用 QoS 计算方法。\n*   通过 WebSocket 将结果发送回客户端。\n\
  \n代码清单 5-15 给出了监听和接受客户端请求所涉及过程的结构。`connection.on` 代码块暂时留空，将在下一节中详细说明。\n\n```\n//\
  \ 通过 WebSocket 服务器监听客户端的连接请求。\nwsServer.on(\"request\", function (request) {\n//\
  \ 接受来自客户端的连接。\nconst connection = request.accept(null, request.origin);\n// 使用 \"\
  message\" 关键字接受来自客户端的传入消息。\nconnection.on(\"message\", function (message) {\n\n\
  });\n// 使用 \"close\" 关键字处理客户端断开连接。\nconnection.on(\"close\", function (reasonCode,\
  \ description) {\n// 记录一条消息以指示客户端已断开连接。\nconsole.log(\"客户端已断开连接。\");\n// 当客户端断开连接时，停止监控过程。\n\
  clearInterval(monitoringInterval);\n});\n});\n代码清单 5-15\n监听客户端连接请求\n```\n\n\n\n\
  #### 从客户端获取消息\n\n当服务器收到任何消息时，会触发 `connection.on` 代码块。该消息首先被记录到控制台，然后存储到一个变量中。由于客户端被编程为在按下“监控与分析”按钮时发送窗口大小和预测时间变量的值，因此通过\
  \ `if` 语句进行检查，以检测接收到的消息中是否包含 `windowSize` 关键字。一旦获取到该关键字，监控过程便会启动，并创建一个函数，使用 `setInterval`\
  \ 关键字使其每秒触发一次。这里指定了 1000 毫秒的时间间隔。如清单 5-16 所示，该代码块应放置在清单 5-15 所指示的位置。\n\n```\n//\
  \ 获取从客户端获得的消息。\n// 在此情况下，接收到的第一条消息是客户端发送过来的 URL。\n// 这确保了通信已建立。\nconsole.log(\"\
  来自客户端的消息:\", message.utf8Data);\n// 初始化一个变量，用于存储客户端发送过来的消息。\nvar clientMessage =\
  \ message.utf8Data;\n// 检查客户端发送的消息是否包含 JSONObject 中的变量 \"windowSize\"。\n// 这作为触发监控过程的判定条件。\n\
  // 接收到 \"windowSize\" 变量意味着客户端运行正常。\nif(clientMessage.includes(\"windowSize\"))\
  \ {\nconst msg = JSON.parse(clientMessage); // 初始化一个常量来解析消息。\n// 从 JSONObject 中获取\
  \ \"windowSize\" 和 \"predictionTime\" 的值。\nsampleSize = msg.windowSize; // \"windowSize\"\
  \ 的值。\npredTime = msg.predictionTime; // \"predictionTime\" 的值。\n// 初始化一个计数器，用于了解何时收集了足够的网络流量。\n\
  var counter = 0;\n// 初始化一个数组，用于存储延迟项。\nvar latencyArray = [];\n// 初始化一个计数器，用于了解何时收集了足够的延迟值。\n\
  var counterLatency = 0;\n// 使用 setInterval 方法创建一个每秒运行一次的函数。\n// 该方法接受一个函数和时间间隔（毫秒）作为输入。\n\
  monitoringInterval = setInterval(function() {\n\n}, 1000) // 为监控过程指定 1000 毫秒的间隔。\n\
  }\n清单 5-16\n从客户端获取消息并创建一个重复执行的函数\n```\n\n#### 测量延迟\n\n通过添加库时创建的变量来访问 `systeminformation`\
  \ 库。涉及以下 `if` 语句：\n\n*   首先进行检查，以确定库返回的延迟值是否为 `null`。如果缺少该指标，则表示没有互联网连接。因此，将包含错误信息的消息封装成\
  \ JSON 格式的变量，并使用 `connection.send()` 方法发送给客户端。这用于在前端向用户生成警报。\n\n*   如果获取到了指标，则填充相应的数组。\n\
  \n*   一旦收集到六十个值，就调用 `calculateQoS()` 方法来计算 QoS 分数。\n\n如清单 5-17 所示。\n\n```\n// 使用内置的\
  \ inetLatency() 方法读取延迟值。\nsi.inetLatency().then(data => {\n// 检查是否无法读取延迟，这意味着没有互联网连接。\n\
  if (data == null) {\n// 创建一条要发送给客户端的错误消息。\nconst errorMessage = {\nerror: \"无连接\"\
  \n};\n// 将错误消息封装成 JSON 格式的字符串，并通过 WebSocket 连接发送。\nconnection.send(JSON.stringify(errorMessage));\n\
  // 停止监控过程。\nclearInterval(monitoringInterval);\n// 如果连接正常。\n} else {\n// 使用 counterLatency\
  \ 计数器将延迟值填充到 latencyArray 对象中。\nlatencyArray[counterLatency] = data;\n// 指定延迟等于从\
  \ Wi-Fi 接口读取的数据。\nlatency = data;\n}\n// 当总共记录了 60 个值时，表示已收集了一分钟的流量。\nif (counterLatency\
  \ == 59) {\n// 调用基于记录的延迟值计算 QoS 的方法。\nscoreQoS = calculateQOS(latencyArray);\n}\n\
  // 递增 counterLatency 对象。\ncounterLatency++;\n})\n清单 5-17\n使用 systeminformation 库测量延迟\n\
  ```\n\n#### 测量网络流量并向客户端发送实时指标\n\n与上一节类似，再次使用 `systeminformation` 库来读取每秒接收和发送的数据包数量，并将此信息分别存储在\
  \ `RX` 和 `TX` 变量中。一旦收集到六十个值，就会触发以下过程：\n\n*   停止监控过程。\n\n*   调用预测方法，对下载速度、上传速度和延迟进行时间序列预测，同时处理返回\
  \ `NaN` 结果的情况。如果算法未返回指标，则通过 `while` 循环再次调用该方法。一旦获得指标，就跳出循环。\n\n*   调用分类方法，通过解析下载速度和上传速度作为输入参数来获取设备活动。\n\
  \n*   创建一个变量来存储获得的指标和结果。\n\n*   使用 `connection.send()` 方法将此变量以 JSON 格式的消息发送出去。\n\
  \n现在，如果尚未收集到六十个值，也会使用 `connection.send()` 方法将实时指标发送给客户端。随后递增一个计数器，并基于该计数器检查是否达到六十个值。清单\
  \ 5-18 演示了这些过程。\n\n\n\n```\n// 从 Wi-Fi 接口获取网络数据。\nsi.networkStats().then(data =>\
  \ {\n// 计算每秒接收的数据包数量，相当于下载速度。\nvar RX = Math.round((((data[0].rx_sec)/1000) + Number.EPSILON)\
  \ * 100) / 100;\n// 计算每秒发送的数据包数量，相当于上传速度。\nvar TX = Math.round((((data[0].tx_sec)/1000)\
  \ + Number.EPSILON) * 100) / 100;\n// 使用 push() 方法将新读取的流量数据添加到预加载数组中。\n// 预加载数组包含按时间序列存储的参数。\n\
  // 根据设备活动情况，这可能会提高算法的性能。\ndownloadArray.push(RX); // 将下载速度值添加到其预加载数组中。\nuploadArray.push(TX);\
  \ // 将上传速度值添加到其预加载数组中。\n// 将数值记录到控制台。\nconsole.log(\"下载速度: \" + RX + \" KB/s\");\n\
  console.log(\"上传速度: \" + TX + \" KB/s\");\nconsole.log(\"-----------------------------\"\
  );\n// 当总共记录了 60 个值时，停止监控过程并触发机器学习算法。\nif (counter == 60) {\n// 使用 clearInterval()\
  \ 方法停止监控过程。\nclearInterval(monitoringInterval);\n// 调用预测方法对下载速度进行时间序列预测。\n// 确保在算法失败并返回\
  \ NaN 时再次调用该方法。\nwhile (true) {\npredRX = predictMLP(downloadArray, parseInt(sampleSize),\
  \ parseInt(predTime), 0.1, 0.01);\nif (!isNaN(predRX)) {\n// 如果获得实际数值，则跳出循环。\nbreak;\n\
  }\n}\n// 调用预测方法对上传速度进行时间序列预测。\n// 确保在算法失败并返回 NaN 时再次调用该方法。\nwhile (true) {\npredTX\
  \ = predictMLP(uploadArray, parseInt(sampleSize), parseInt(predTime), 0.1, 0.01);\n\
  if (!isNaN(predTX)) {\n// 如果获得实际数值，则跳出循环。\nbreak;\n}\n}\n// 调用预测方法对延迟进行时间序列预测。\n\
  // 确保在算法失败并返回 NaN 时再次调用该方法。\nwhile (true) {\npredLat = predictMLP(latencyArray,\
  \ parseInt(sampleSize), parseInt(predTime), 0.1, 0.01);\nif (!isNaN(predLat)) {\n\
  // 如果获得实际数值，则跳出循环。\nbreak;\n}\n}\n// 通过调用分类方法对设备活动进行分类。\ndeviceActivity = calculateKNN(RX,\
  \ TX);\n// 创建一个包含预测和分类结果的常量变量。\nconst predictionMessage = {\ndownloadSpeed: RX,\n\
  uploadSpeed: TX,\npredictedDownloadSpeed: predRX,\npredictedUploadSpeed: predTX,\n\
  predictedLatency: predLat,\npredictedQoS: scoreQoS,\ndeviceActivity: deviceActivity,\n\
  averageLatency: averageLatency\n};\n// 将指标消息封装成 JSON 格式的字符串，并通过 WebSocket 连接发送。\n\
  connection.send(JSON.stringify(predictionMessage));\n}\n// 如果收集的数值数量尚未达到 60。\nelse\
  \ {\n// 创建一个包含每秒发送给客户端的网络流量值的常量变量。\n// 添加所有 3 个实时值。\nconst jsonMessage = {\ndownloadSpeed:\
  \ RX,\nuploadSpeed: TX,\nlatency: latency\n};\n// 将实时消息封装成 JSON 格式的字符串，并通过 WebSocket\
  \ 连接发送。\nconnection.send(JSON.stringify(jsonMessage));\n}\n// 增加网络流量计数器。\ncounter\
  \ = counter + 1;\n})\n清单 5-18\n测量网络流量并将实时指标发送给客户端\n```\n\n### 5.3.7 使用 MLP 回归进行时间序列预测的方法\n\
  \n如清单 5-18 所示，`predictMLP()` 方法被依次调用以处理三个数据流。所有数据流都应用相同的逻辑，如图 5-12 所示。\n\n![](img/612428_1_En_5_Fig12_HTML.jpg)\n\
  \n时间序列预测的流程图。它计算归一化因子，实例化 MLP 对象，设置超参数，创建滑动窗口，训练神经网络，预测变量，并在检查是否达到 i 后计算百分比精度和数值，以获得预测变量。\n\
  \n图 5-12\n\n使用 MLP 进行时间序列预测的流程图\n\n清单 5-19 给出了 `predictMLP()` 方法的完整代码。\n\n\n```\n\
  // 创建一个使用多层感知机（MLP）进行时间序列预测的方法。\n// 输入参数：\n// - array: 待预测的时间序列数组。\n// - batchSize:\
  \ 用户在界面上指定的窗口大小。\n// - pTime: 用户在界面上指定的预测时间。\n// - learningRate: MLP 的学习率。\n// -\
  \ maximumError: 训练过程中允许的最大误差。\nfunction predictMLP(array, batchSize, pTime, learningRate,\
  \ maximumError) {\n// 查找单变量数据流中的最大值和最小值。\nvar min = Math.min.apply(Math, array);\
  \ // 将最小值存储在一个变量中。\nvar max = Math.max.apply(Math, array); // 将最大值存储在一个变量中。\n//\
  \ 将窗口大小和预测时间的值存储在新变量中。\nvar windowSize = batchSize;\nvar pvalue = pTime;\n// 使用\
  \ \"MLP\" 关键字和 1 个输入层创建感知机。\nvar mlp = new MLP(windowSize, 1);\n// 添加隐藏层的数量。\nmlp.addHiddenLayer((2\
  \ * windowSize) + 1);\n// 初始化感知机。\nmlp.init();\n// 创建具有一组输入和相应输出的滑动窗口。\n// 声明一个用于输入的变量。\n\
  var inputs = [];\n// 声明一个用于输出的变量。\nvar outputs = [];\n// 声明用于填充 \"inputs\" 和 \"\
  outputs\" 数组的索引。\nvar inputValue, outputValue;\n// 初始化一个计数器，用于获取实际值。\nvar counter\
  \ = windowSize + pvalue - 1;\n// 初始化一个窗口索引。范围从 0 到 \"windowSize-1\"。\nvar index\
  \ = 0;\n// 初始化一个通用索引，用于移动窗口。\nvar valueFill = 0;\n// 创建用于窗口大小步长预测的滑动窗口。\nfor (let\
  \ a = 0; a < (array.length - windowSize - pvalue + 1); a++) {\n// 用 1 个窗口大小的元素数量填充\
  \ \"inputs\" 数组。\nfor (let i = valueFill; i < (valueFill + windowSize); i++) {\n\
  // 对每个输入进行归一化，使其范围在 0 到 1 之间。\ninputValue = (array[i] - min) / (max - min);\n//\
  \ 根据索引用归一化后的值填充 \"inputs\" 数组。\ninputs[index] = inputValue;\n// 递增索引。\nindex = index\
  \ + 1;\n}\n// 将索引重置为 0，以便在下一个滑动窗口时可以从 \"0 到 window\" 进行迭代。\nindex = 0;\n// 将通用索引移动到下一个相邻的值。\n\
  valueFill = valueFill + 1;\n// 获取实际输出值。\noutputValue = array[counter];\n// 将实际输出值添加到\
  \ \"outputs\" 数组中。\noutputs[a] = outputValue;\n// 递增计数器。\ncounter = counter + 1;\n\
  }\n// 将输入和输出添加到训练数据集中。\nfor (let i = 0; i < (array.length - windowSize - pvalue\
  \ + 1); i++) {\n// 将输入和输出添加到 MLP 的训练数据集中。\nmlp.addTrainingSet(inputs[i], outputs[i]);\n\
  }\n// 初始化一个变量来存储误差。\nvar error = 0;\n// 初始化学习率。\nvar learnRate = learningRate;\n\
  // 训练 MLP，直到误差小于或等于最大误差。\nwhile (error > maximumError) {\n// 使用指定的学习率训练 MLP。\nerror\
  \ = mlp.train(learnRate);\n}\n// 算法现在已经在实时值上完成了训练。\n// 再次使用滑动窗口来测量百分比准确率。\n// 为每个窗口生成一个预测值。\n\
  // 重新初始化之前的变量，以便它们可以被重用。\nvar inputs = [];\nvar inputValue;\nvar index = 0;\nvar\
  \ valueFill = 0;\n// 创建一个计数器来测量算法的准确率。\nvar accCounter = windowSize + pvalue - 1;\n\
  // 初始化一个变量来计算平均误差。\nvar averageError = 0;\n// 创建用于窗口大小步长预测的滑动窗口。\nfor (let a = 0;\
  \ a < (array.length - windowSize - pvalue + 1); a++) {\n// 用 1 个窗口大小的元素数量填充 \"inputs\"\
  \ 数组。\nfor (let i = valueFill; i < (valueFill + windowSize); i++) {\n// 对每个输入进行归一化，使其范围在\
  \ 0 到 1 之间。\ninputValue = (array[i] - min) / (max - min);\n// 根据索引用归一化后的值填充 \"inputs\"\
  \ 数组。\ninputs[index] = inputValue;\n// 递增索引。\nindex = index + 1;\n}\n// 将索引重置为 0，以便在下一个滑动窗口时可以从\
  \ \"0 到 window\" 进行迭代。\nindex = 0;\n// 将通用索引移动到下一个相邻的值。\nvalueFill = valueFill +\
  \ 1;\n// 使用 \"classify\" 方法计算此特定窗口的预测值。\nvar windowPrediction = mlp.classify(inputs);\n\
  // 对预测值进行反归一化。\nwindowPrediction = windowPrediction * (max - min) + min;\n// 初始化一个变量来存储每个窗口的百分比误差。\n\
  var individualError = 0;\n// 通过与实际值比较来计算每个单独的误差。\nif (array[accCounter] != 0) {\n\
  individualError = ((Math.abs(windowPrediction - array[accCounter])) / (array[accCounter]))\
  \ * 100;\n} else {\n// 如果实际值为 0；为防止除以 0\nindividualError = ((Math.abs(windowPrediction\
  \ - array[accCounter])) / (1)) * 100;\n}\n// 将准确率计数器递增 1。\naccCounter = accCounter\
  \ + 1;\n// 将单个误差加到误差总和中。\naverageError = averageError + individualError;\n}\n//\
  \ 通过将误差总和除以预测次数来计算平均误差。\naverageError = averageError / (array.length - windowSize\
  \ - 1);\n// 记录总平均误差的消息。\nconsole.log(\"总平均误差: \" + averageError + \" %\");\n// 计算百分比准确率。\n\
  var percentageAccuracy = 100 - averageError;\n// 记录百分比准确率。\nconsole.log(\"百分比准确率:\
  \ \" + percentageAccuracy  + \" %\");\n// 为最后的 \"windowSize\" 个值创建一个数组。\nvar pred\
  \ = [];\n// 为数据集中最后一个滑动窗口创建一个起始索引。\nvar arrayIndex = 0;\n// 为数据集中最后一个滑动窗口创建一个结束索引。\n\
  var lastWindowIndex = array.length - windowSize;\n// 对于最后一个可能的滑动窗口。\nfor (let i\
  \ = lastWindowIndex; i < array.length; i++) {\n// 用相应的归一化值填充最后一个滑动窗口数组。\npred[arrayIndex]\
  \ = (array[i] - min) / (max - min);\n// 将计数器递增 1。\narrayIndex = arrayIndex + 1;\n\
  }\n// 使用 \"classify\" 方法计算此特定窗口的预测值。\nvar mlpPrediction = mlp.classify(pred);\n\
  // 对预测值进行反归一化。\nmlpPrediction = (mlpPrediction * (max - min) + min);\n// 将预测值格式化为保留两位小数。\n\
  var predictedValue = Math.round((mlpPrediction + Number.EPSILON) * 100) / 100;\n\
  // 记录格式化后的预测值。\nconsole.log(pvalue + \" 秒后的预测值: \" + predictedValue);\nconsole.log(\"\
  -----------------------------\");\n// 清除训练数据集。\nmlp.clearTrainingSet();\n// 重置学习到的权重。\n\
  mlp.resetWeights();\n// 返回最终的预测值。\nreturn predictedValue;\n}\n代码清单 5-19\n使用 MLP\
  \ 回归进行时间序列预测的方法\n```\n\n### 5.3.8 计算 QoS 分数的方法\n\n本节涉及在代码清单 5-17 中调用的 `calculateQOS()`\
  \ 方法。为了衡量 QoS 分数，首先根据记录的延迟样本计算抖动，如公式 5-1 所示，其中 *n* 代表样本数量，*x* 是样本值，*i* 是采集值的顺序，从零开始。\n\
  \n![$$ Jitter=\\frac{\\sum_{i=1}^n\\left({x}_i-{x}_{i-1}\\right)}{n-1} $$](img/612428_1_En_5_Chapter_TeX_Equ1.png)\n\
  \n(5-1)\n\n随后，计算在六十秒持续时间内观察到的平均延迟。QoS 分数通过三个阈值来确定，并通过比较平均延迟与抖动来计算。如果抖动大于平均延迟的 50%，则认为设备显示“差”的\
  \ QoS。当相同结果介于 30% 和 50% 之间时，则分配“中等”QoS。最终，如果抖动小于平均延迟的 30%，则认为设备以“最佳”QoS 运行。这些标准旨在根据应用程序使用位置特定服务器的平均延迟，来定义不同程度的服务质量。这因国家和网络而异。此类阈值通常通过基于用户反馈、行业标准和服务级别协议等因素的迭代测试和验证进行微调。例如，电信运营商可能会根据通过不同网络路径到达特定国家/地区的最佳可能延迟来设定\
  \ QoS 标准。QoS 分数确定过程总结在图 5-13 中。\n\n![](img/612428_1_En_5_Fig13_HTML.jpg)\n\nQoS\
  \ 分数计算的流程图。它收集延迟样本，计算平均延迟，并根据抖动对 QoS 分数进行分类。抖动小于 30% 为最佳分数，小于 50% 为中等，大于 50% 为差。\n\
  \n图 5-13\n\nQoS 分数计算流程图\n\n此过程的代码在代码清单 5-20 中给出。\n\n\n\n```\n// 创建一个根据抖动和延迟值计算 QoS\
  \ 分数的方法。\n// 输入参数：\n// - array: 要解析的时间序列数组。\nfunction calculateQOS(array) {\n//\
  \ 初始化一个变量来存储最终分数。\n// 分数范围从“差”到“中等”再到“最佳”。\nvar score = \"\";\n// 初始化一个变量来计算所有延迟值的总和。\n\
  var sumLatency = 0;\n// 初始化一个变量来计算连续延迟值之间的差值总和。\nvar sumDifference = 0;\n// 遍历数组。\n\
  for(let i = 0; i < array.length; i++) {\n// 将当前值加到延迟总和上。\nsumLatency = sumLatency\
  \ + parseFloat(array[i]);\n// 检查当前索引是否大于 0。\nif(i > 0) {\n// 通过减法计算当前值与上一个值之间的差值，并累加。\n\
  sumDifference = sumDifference + Math.abs(parseFloat(array[i]) - parseFloat(array[i-1]));\n\
  }\n}\n// 通过将总和除以数值个数来计算平均延迟。\naverageLatency = sumLatency / array.length;\n// 通过将差值总和除以数值个数来计算抖动。\n\
  var jitter = sumDifference / array.length;\n// 记录平均延迟。\nconsole.log(\"平均延迟: \" +\
  \ averageLatency + \" ms\");\n// 记录抖动。\nconsole.log(\"抖动: \" + jitter + \" ms\"\
  );\n// 如果抖动大于平均延迟的 50%。\nif (jitter > (0.5 * averageLatency)) {\n// 将“差”赋值给 QoS\
  \ 分数。\nscore = score + \"差\";\n// 记录 QoS 分数。\nconsole.log(score);\n}\n// 如果抖动在平均延迟的\
  \ 30% 到 50% 之间。\nelse if ((jitter > (0.3 * averageLatency)) && (jitter < (0.5 *\
  \ averageLatency))) {\n// 将“中等”赋值给 QoS 分数。\nscore = score + \"中等\";\nconsole.log(score);\n\
  // 如果抖动小于平均延迟的 30%。\n} else {\n// 将“最佳”赋值给 QoS 分数。\nscore = score + \"最佳\";\n//\
  \ 记录 QoS 分数。\nconsole.log(score);\n}\n// 返回最终的 QoS 分数。\nreturn score;\n}\n代码清单 5-20\n\
  计算 QoS 分数的方法\n```\n\n### 5.3.9 设备活动分类方法\n\n关于识别设备所表现的活动类型，需要一个预先分类的数据集，其中包含下载速度、上传速度以及相应的活动类别，如第\
  \ 4 章所述。本书附带了一个示例数据集。然而，为了提高分类方法对各种网络活动形式的可靠性，建议在更大的数据集上进行补充测试，该数据集可以使用相同的应用程序收集。通过向数据集提供反映不同类型活动的广泛网络流量样本，算法可以增强其泛化能力，并准确区分不同形式的网络行为。该过程需要获取和分类多样化的网络流量数据，以保证对现实网络中可能遇到的各种场景进行全面的表示。涉及使用\
  \ KNN 算法进行数据准备和分类的技术流程总结在图 5-14 中。\n\n![](img/612428_1_En_5_Fig14_HTML.jpg)\n\n\
  用于分类设备活动的流程图。它使用 `fs` 模块从文件中读取内容，然后打乱加载的数据，分离输入，创建一个 KNN 对象，传递输入，获取参数，并生成输出，如空闲、浏览或流媒体。\n\
  \n图 5-14\n\n设备活动分类流程图\n\n此过程的代码在代码清单 5-21 中给出。\n\n```\n// 创建一个通过分类计算设备活动的方法。\n//\
  \ 输入参数：\n// - dspeed: 下载速度数组。\n// - uspeed: 上传速度数组。\nfunction calculateKNN(dspeed,\
  \ uspeed) {\n// 创建一个临时数组来存储来自分类数据库的数据。\nlet temp = [];\n// 通过指定文件位置读取分类数据库文件的内容。\n\
  const contents0 = fs.readFileSync(\"./Databases/classification.txt\", 'utf-8');\n\
  // 根据换行符将内容分割成一个数组。\nvar classificationDatabase = contents0.split(/\\r?\\n/);\n\
  // 遍历分类数据库并填充临时数组。\nfor (let i = 0; i < classificationDatabase.length; i++) {\n\
  // 将当前行按逗号分割，并将结果推入临时数组。\ntemp.push(classificationDatabase[i].split(\",\"));\n}\n\
  // 创建一个数据数组，其元素来自临时数组。\nvar data_array = temp;\n// 使用 Fisher-Yates 算法打乱数据数组。\ndata_array.sort(()\
  \ => Math.random() - 0.5);\n// 用原始数组初始化打乱后的数组。\nlet shuffledArray = data_array;\n\
  // 初始化一个空数组来存储输入数据。\nlet input = [];\n// 初始化一个空数组来存储输出数据。\nlet output = [];\n//\
  \ 遍历打乱后数组中的每个元素。\nfor (let i = 0; i < shuffledArray.length; i++) {\n// 检查当前元素是否不包含未定义的值。\n\
  if (!shuffledArray[i].includes(undefined)) {\n// 遍历打乱后数组第一行中的每个属性（列）。\nfor (let\
  \ j = 0; j < shuffledArray[0].length; j++) {\n// 检查当前属性是否在索引 2 处。\nif (j === 2)\
  \ {\n// 将索引 2 处的值赋值给输出数组。\noutput[i] = shuffledArray[i][2];\n} else {\n// 如果输入数组中尚不存在，则创建一个新数组。\n\
  input.push([]);\n// 将当前属性索引处的值赋值给输入数组。\ninput[i][j] = shuffledArray[i][j];\n}\n\
  }\n}\n}\n// 初始化一个新数组来存储输入数组的值。\nvar newInputs = [];\n// 遍历打乱后数组中的每个元素。\nfor(let\
  \ a = 0; a < shuffledArray.length; a++) {\n// 将输入数组中的值赋值给 newInputs 数组。\nnewInputs[a]\
  \ = input[a];\n}\n// 使用指定的参数创建一个新的 KNN（K-最近邻）模型：\n// - newInputs: 用于训练模型的输入数据。\n\
  // - output: 训练数据对应的输出类别。\n// - { k: 5 }: 一个选项对象，设置分类时要考虑的邻居数量（k）。\nvar knn = new\
  \ KNN(newInputs, output, { k: 5 });\n// 初始化一个变量来统计分类错误的数量。\nvar errorCount = 0;\n\
  // 遍历训练集中的每个数据点。\nfor (let i = 0; i < newInputs.length; i++) {\n// 使用 KNN 模型预测当前输入的类别。\n\
  let predictedValue = knn.predict(newInputs[i]);\n// 从训练集中获取实际类别。\nlet actualValue\
  \ = output[i];\n// 检查预测类别是否与实际类别不同。\nif(predictedValue !== actualValue) {\n// 如果分类错误，则增加错误计数。\n\
  errorCount++;\n}\n}\n// 通过计算错误数占输入数量的比例来计算 KNN 分类准确率。\nvar knnAccuracy = 100 - ((errorCount\
  \ / newInputs.length) * 100);\n// 记录 KNN 分类准确率。\nconsole.log(\"KNN 分类准确率: \" + knnAccuracy\
  \ + \" %\");\n// 待分类的用户输入数据（在此上下文中来自浏览器）。\nlet feed = [dspeed, uspeed];\n// 使用训练好的\
  \ KNN 模型预测输入数据对应的类别。\nlet result = knn.predict([feed]);\n// 初始化一个变量用于存储分类结果。\nvar\
  \ classification = \"\";\n// 将输入数据和预测类别记录到控制台。\nconsole.log(\"输入: \" + feed.toString()\
  \ + \"  类别: \" + result.toString());\n// 使用 switch 语句将预测的类别映射为人类可读的标签。\n// 如果结果为\
  \ 0，标签设置为“空闲”。\n// 如果结果为 1，标签设置为“浏览”。\n// 如果结果为 2，标签设置为“流媒体”。\nswitch (parseInt(result))\
  \ {\ncase 0:\nclassification = classification + \"空闲\";\nbreak;\ncase 1:\nclassification\
  \ = classification + \"浏览\";\nbreak;\ncase 2:\nclassification = classification +\
  \ \"流媒体\";\nbreak;\n}\n// 记录人类可读的分类结果标签。\nconsole.log(\"值的分类: \" + classification);\n\
  // 返回人类可读的分类结果标签。\nreturn classification;\n}\n代码清单 5-21\n使用 KNN 分类设备活动的方法\n```\n\
  \n\n\n## 5.4 NTMA 应用测试与部署\n\n客户端和服务器端构建完成后，NTMA 应用即可运行。本节将在标准家庭环境中，通过若干场景对其进行测试。为模拟较差的网络条件，我们特意对设备设置了带宽分配上限，从而产生高延迟和抖动。图\
  \ 5-15 至 5-19 展示了 NTMA 应用在上述场景中的表现。\n\n![](img/612428_1_En_5_Fig19_HTML.jpg)\n\n\
