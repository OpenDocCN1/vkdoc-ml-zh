  Ruiz 等人引入了一种新方法，用于有效优化实时多媒体应用所提供的服务质量 [78]。图 3-11 展示了论文中提出的多媒体应用通用自适应架构。该方法包括调整由机器学习算法选择的合适参数，以根据网络可用资源优化其性能。参数的修改在服务器端执行，即在自适应应用程序内部。简而言之，这些应用程序被配置为实时微调其设置，以满足最终用户的需求并满足用户感知的服务质量要求。为了考虑移动自组织网络原型中包括视频和音频丢失在内的情况，作者认为这些测试需要在网络层的分组化生态系统中运行。使用
  Slipper 规则归纳算法，基于从真实用户提取的分数来学习最终用户会偏好哪些设置。遗传算法确定自适应程序启动设置修改的时机。作者声称，即使在持续失真变化的情况下，他们的方法也能可靠地工作。


