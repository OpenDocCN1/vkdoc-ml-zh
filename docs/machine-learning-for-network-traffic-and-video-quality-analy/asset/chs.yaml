  \ 官方网站 [3] 下载的自定义 Bootstrap 样式表。\n\n3.  添加内部 CSS 以修改组件外观：\n    1.  设置 body、背景和按钮的样式。\n\
  \    2.  为用户界面组件（如按钮、标签和图表）定义样式。\n\n4.  显示标题和复选框：\n    1.  创建一个用于嵌入标题和复选框的容器。\n\
  \    2.  为弹出窗口设置标题。\n    3.  创建一个复选框，通过 CSS 格式化使其看起来像一个切换开关。\n\n5.  显示两个图表区域：\n\
  \    1.  创建一个用于嵌入 NTMA 图表区域的容器。\n    2.  创建一个用于嵌入 VQA 图表区域的容器。\n    3.  为每个图表区域嵌入一个使用\
  \ Chart.js 的图表画布。\n\n6.  显示“网络指标”卡片：\n    1.  创建一个用于网络指标的容器。\n    2.  分别显示预测下载速度、预测上传速度、预测延迟、网络活动和网络评分及其图标。\n\
