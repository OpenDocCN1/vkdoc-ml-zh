  \n*   使用 `axios` 库向 servlet 的端点发起 HTTP POST 请求。\n*   将截图的索引指定为参数。\n*   通过接收 JSON\
  \ 响应并将其存储到变量中来处理响应。\n*   将获取的 MOS 分数映射到其质量等级，以便于理解。\n*   增加不同的计数器以识别出现频率最高的质量等级。\n\
  *   计算平均 MOS 分数。\n*   将 MOS 分数、平均 MOS 分数、视频质量等级、主导视频质量等级以及一个请求客户端提供另一张截图的标签封装成 JSON\
  \ 格式的字符串。\n*   使用 `connection.send()` 方法通过 WebSocket 连接将此变量发送给客户端。\n*   记录任何获取到的错误并发送给客户端。\n\
  \n这些过程在代码清单 6-18 中进行了演示。\n\n\n\n```\n// 此时，包含 VQA 模块所需视频源的裁剪图像已就绪。\n// 记录一条消息，表示正在向\
  \ Java HTTP Apache 服务器（servlet）发送请求以获取 MOS 分数。\nconsole.log(\"Making request to\
  \ servlet.\")\n// 使用 \"Axios\" 库向该 servlet 发起 HTTP POST 请求。\naxios.post(\"http://localhost:8080/VQA/Score\"\
  , null, {\n// 指定 servlet 所需的参数，此处为截图计数。\nparams: {\nnumber: screenshotCount,\n},\n\
  })\n.then((response) => {\n// 处理来自 servlet 的响应。\n// 从 JSON 响应中获取 MOS 分数。\nmosScore\
  \ = response.data.score;\nmosScore = parseFloat(mosScore);\n// 记录一条消息以指示获取到的 MOS\
  \ 分数。\nconsole.log(\"Score obtained from servlet: \" + mosScore);\n// 针对极差质量情况处理异常值。\n\
  if (mosScore > 100) {\nmosScore = 100;\n}\n// 将获取到的 MOS 分数映射到其质量等级，以便于理解。\n// 根据分配的质量等级递增相应的计数器。\n\
  // 这是为了识别出现频率最高的视频质量，即“主导质量等级”。\nif (mosScore >= 0 && mosScore < 20) {\nliveQualityRating\
  \ = \"Excellent\";\ncountExcellent = countExcellent + 1;\n} else if (mosScore >=\
  \ 20 && mosScore < 40) {\nliveQualityRating = \"Great\";\ncountGreat = countGreat\
  \ + 1;\n} else if (mosScore >= 40 && mosScore < 65) {\nliveQualityRating = \"Good\"\
  ;\ncountGood = countGood + 1;\n} else if (mosScore >= 65 && mosScore < 80) {\nliveQualityRating\
  \ = \"Fair\";\ncountFair = countFair + 1;\n} else if (mosScore >= 80 && mosScore\
  \ < 90) {\nliveQualityRating = \"Poor\";\ncountPoor = countPoor + 1;\n} else if\
  \ (mosScore >= 90) {\nliveQualityRating = \"Bad\";\ncountBad = countBad + 1;\n}\n\
  // 记录一条消息以指示实时质量等级。\nconsole.log(\"Video Quality Rating: \" + liveQualityRating);\n\
  // 创建一个数组来存储每个质量等级的计数。\nvar countQuality = [countExcellent, countGreat, countGood,\
  \ countFair, countPoor, countBad];\n// 初始化变量以查找最大计数及其索引。\nvar maxCount = countQuality[0];\
  \ // 假设第一个是最大值。\nvar maxIndex = 0;\n// 遍历 countQuality 数组以查找最大计数及其索引。\nfor (var\
  \ i = 1; i < countQuality.length; i++) {\nif (countQuality[i] > maxCount) {\n//\
  \ 更新最大计数及其索引。\nmaxCount = countQuality[i];\nmaxIndex = i;\n}\n}\n// 创建一个表示质量等级的标签数组。\n\
  var labels = ['Excellent', 'Great', 'Good', 'Fair', 'Poor', 'Bad'];\n// 根据最大索引确定主导质量等级。\n\
  var dominantQualityRating = labels[maxIndex];\n// 将主导质量等级及其计数记录到控制台。\nconsole.log('The\
  \ highest count label is:', dominantQualityRating);\nconsole.log('The highest count\
  \ value is:', maxCount);\n// 计算并记录平均 MOS 分数。\nsumMosScore = sumMosScore + mosScore;\n\
  averageMosScore = sumMosScore / screenshotCount;\nconsole.log(\"Average MOS Score:\
  \ \" + averageMosScore);\n// 向客户端发送消息以请求另一张截图。\n// 创建一个常量变量，保存测量/计算得到的分数和等级。\nconst\
  \ screenshotUpdate = {\nscreenshot: \"sendScreenshot\",\nvideoScore: mosScore,\n\
  averageVideoScore: averageMosScore,\nvideoRating: liveQualityRating,\ndominantRating:\
  \ dominantQualityRating\n};\n// 将指标消息封装为 JSON 格式字符串，并通过 WebSocket 连接发送。\nconnection.send(JSON.stringify(screenshotUpdate));\n\
  // 递增截图计数以处理下一张截图。\nscreenshotCount = screenshotCount + 1;\n})\n.catch((error) =>\
  \ {\n// 记录一条错误消息，指示无法将截图发送到 servlet。\nconsole.error('Error sending screenshot to\
  \ servlet:', error);\n// 创建一条要发送给客户端的错误消息。\nconst errorMessage = {\nerror: \"Error\
  \ sending screenshot to servlet.\"\n};\n// 将错误消息封装为 JSON 格式字符串，并通过 WebSocket 连接发送。\n\
  connection.send(JSON.stringify(errorMessage));\n});\n代码清单 6-18\n查询 servlet 并处理响应\n\
  ```\n\n## 6.4 VQA 的 Servlet 程序结构\n\n本节将详细介绍在 Eclipse IDE 中构建并使用 Apache Tomcat 在本地托管的\
  \ Java servlet。该 servlet 的主要功能如下：\n\n1.  **处理 HTTP POST 请求**：通过 HTTP POST 请求与 servlet\
  \ 建立联系。创建时，Java 文件已包含用于接收客户端请求的实现。然后，servlet 负责在启动其他任务之前成功接收请求中发送的参数。\n\n2.  **定位图像**：在接收到待评估质量图像的截图编号后，servlet\
  \ 通过其路径动态查找该文件。\n\n3.  **对图像引入失真**：通过将原始图像与其多个伪参考图像（MPRI）进行比较，生成一个相似度分数数组。\n\n4.\
  \  **提取局部二值模式（LBP）特征**：在获取失真图像后，利用产生的亮度差异执行二值化过程。\n\n5.  **预测相似度指数和 MOS 质量分数**：在缩放回归器之前，将阻塞、振铃、模糊和噪声伪影的分数存储在一个二十维特征向量中。此步骤使用了\
