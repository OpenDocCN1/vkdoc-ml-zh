  以下各节将详细阐述构成 NTMA 的不同方面，例如其必要性和优势。



  ### 1.1.1 NTMA 的重要性


  在当今复杂的电信网络中，NTMA 如同哨兵般屹立，时刻监控着为互联世界提供养分的虚拟脉络。随着数字交互变得无处不在，网络中传输的数据量呈爆炸式增长。国际数据公司（IDC）估计，到
  2025 年，全球互联网用户将创造 175 泽字节的数据 [5]。面对日益汹涌的数据洪流，NTMA 是网络安全、隐私和效率的守护者。


  NTMA 的主要目标之一是理解网络流量的随机性。从全局来看，网络流量是各种交互、数据流和终端节点混杂而成的混沌集合。首先，通过描述这些模式，NTMA 为网络管理者提供了优化性能的坚实基础；其次，通过识别与预设规范的异常和偏差，NTMA
  确保在可能发生安全漏洞或中断时触发警报和通知 [6]。


  如果来自特定地理位置的数据包突然激增，可能预示着分布式拒绝服务（DDoS）攻击即将来临。NTMA 的力量不仅在于发现这种异常，更在于它能迅速采取行动以限制其造成的损害。威胁环境正在变化，根据
  Cloudflare 的报告，2022 年记录的 DDoS 攻击数量比上一年增加了 67%。卡巴斯基也记录了近 58,000 起此类事件 [7]。因此，NTMA
  充当着数字灯塔的角色，使网络专家能够对新威胁保持警惕，并在遭受攻击后迅速恢复正常。海量数据的传输也要求对资源进行战略性使用和对网络进行精细优化。借助 NTMA，互联网服务提供商（ISP）和其他电信运营商可以精准定位瓶颈、缓解拥塞并更有效地分配带宽。这一点至关重要，因为自
  2020 年疫情以来，对远程办公、在线课程和数字媒体的需求持续增长。得益于 NTMA 在提升服务质量（QoS）方面的努力，用户可以享受到更一致的数字体验，高清视频流、网页加载和应用程序响应都能以最高效率运行。


  总而言之，NTMA 不仅仅是一个监控过程；它还能提升网络安全并提高用户满意度。数字交互的普及凸显了其无处不在的特性，而随着网络的成熟，其重要性将与日俱增。NTMA
  通过接纳网络流量的多样性、理解其细微差别并将其转化为有用信息，为一个依赖效率和可靠性的数字互联社会铺平了道路。


  ### 1.1.2 NTMA 的关键目标


  NTMA 的核心目标是满足网络管理和优化的多个要求。根据 Statista 的数据，截至 2024 年 4 月，全球互联网用户已达 54.4 亿 [8]。随着数字接触的持续增长，NTMA
  在确保当今网络的持续可行性、安全性和效率方面将发挥越来越重要的作用。从战略上讲，NTMA 旨在实现以下目标 [9]：


  *   描述应用层典型的流量流和数据流。

  *   主动识别离群值和异常。

  *   通过最优路由提升整体效率。

  *   观察不同网络环境下的流量趋势并预测流量。

  *   提供网络的鸟瞰视图。


  通过对穿越网络的各种数据流进行严格的分类和分析，电信专家可以深入了解表征网络活动的模式。异常检测，即预先检测与既定流量标准的偏差，正是建立在这种对正常状态的熟悉基础之上。例如，VMware
  Carbon Black 报告称，2020 年针对银行企业的攻击增加了 118% [10]。NTMA 检测异常（包括流量意外激增或通信模式变化）的能力对于防止安全漏洞至关重要。随着数字交互的数量和重要性不断增长，NTMA
  与优化网络的需求自然契合。为了改善 QoS 和资源管理，NTMA 会识别拥塞区域、流量限制和其他性能瓶颈。这一点在当前尤为重要，因为根据 Ookla 的报告，到
  2023 年，全球平均网速预计将达到 110.4 Mbps [11]。用户现在要求稳定、低延迟、高速的访问，而 NTMA 的功能正是维护这一需求。因此，NTMA
  是安全、效率和用户体验的交汇点，并应对网络动态的复杂性。其目标可以概括为：在不断增长的数据量与对无缝用户体验的需求之间维护微妙的平衡。随着数字生态系统的演进，这一平衡的重要性将愈发凸显。




  ### 1.1.3 网络流量组件


  作为当今通信基础设施的骨干，网络流量本身就是一个复杂的现象。互联网协议（IP）数据包头部通过编码源地址、目的地址和端口号等信息，为数据传输提供了背景。提供背景信息的元数据，补充了代表消息本身的有效载荷数据。种类繁多的流媒体服务、信令数据包和控制消息，进一步加剧了网络流量本已混乱的状态
  [12]。IDC 预测，到 2025 年，全球数据圈将增长至 175 泽字节，其中 75% 将与非 PC 设备相关，这反过来也反映了非 PC 流量来源的增长 [13]。通过剖析这些复杂的组成部分，网络管理员可以更深入地了解用户行为、应用关系和流量模式。在看似无缝的数字交换表面之下，隐藏着一张错综复杂的网络流量之网。这个复杂的网络由一系列组件协同构成，它们共同在计算机之间实现信息的无缝传输。Statista
  预测，到 2030 年，全球将拥有 294 亿台物联网设备，这意味着网络流量组件的种类和数量将呈指数级增长 [14]。


  数据包是网络流量的基本构建块。这些数字包将数据传输到最终目的地。就像邮件中的信件一样，这些数据包拥有独特的“头部”，其中包含关键信息，例如它们的来源和去向，以及它们使用的端口和协议。路由器和交换机可以利用这些上下文信息将数据发送到正确的目的地。而“有效载荷”，即消息的主体，则隐藏在这些数据包的更深处。在传输过程中，信息本身（例如文本、照片、视频流或特定于应用的数据）就位于此处。当今数字体验的基础，正是建立在这些数据包的高速通信之上。图
  1-2 展示了一个 IP 数据包的结构 [15]。


  ![](img/612428_1_En_1_Fig2_HTML.jpg)


  一个 IP 数据包的数据包结构图，包含 24 字节的头部和 4 字节的数据。头部包括版本、长度、服务类型、数据包长度、标识、DF、MF、分片偏移、生存时间、传输协议、头部校验和、源
  IP 地址、目的 IP 地址、选项和填充。


  图 1-2

  IP 数据包的结构


  同样，网络中也会突出显示具有共同特征的、相互关联的数据包“流” [16]。因此，网络管理员可以理解应用、服务和设备之间——即在不同层级上的——通信动态，从而获得对网络动态的全局视角。这也是各种流类型发挥作用的地方，例如，IP
  语音（VoIP）通话、视频流和在线浏览活动可以根据其独特的趋势进行细分和分析。此外，数据包时间戳、通信长度和传输序列号等元数据，也有助于增强和把握网络交互。


  然而，网络流量元素的广泛多样性也带来了一定的困难。思科预测，视频媒体在互联网流量中的占比到 2021 年将占所有 IP 流量的 82% [17]，这带来了复杂性，需要先进的分析方法。数据包头部、有效载荷数据、元数据和多媒体流的复杂交织，构成了一个不断演变的复杂领域，这正是
  NTMA 试图驾驭的。理解这些组件对于洞察用户习惯、识别网络拥塞原因，以及在一个日益数据驱动的环境中保证无与伦比的用户体验至关重要。截至 2023 年 1 月，Sandvine
  报告称视频流量增长了 24%，Netflix 在视频消费量上超过了 YouTube。图 1-3 描绘了截至 2023 年 1 月底，全球范围内按流量类别划分的广泛列表及总消费量
  [18, 19]。


