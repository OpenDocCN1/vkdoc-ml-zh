  Bakker 等人提出了一系列旨在检测分布式拒绝服务（DDoS）攻击的分类器[[61]](#612428_1_En_2_Chapter.xhtml#CR61)。他们使用了公开可访问的数据集来构建一个普遍接受的基准，用于评估各个分类器的性能，特别是在精确率和检测率方面。该实验在一个实时
  SDN 中实施，对数据包和字节进行了数据捕获。所使用的算法包括随机森林、KNN、二次判别分析（QDA）、朴素贝叶斯和支持向量机（SVM）。这些算法在参考标准和实时网络中均进行了比较。在参考标准中，随机森林算法的准确率最高，而
  SVM 的性能最差。与此同时，在实时网络环境中，无论是被动模式还是主动模式，SVM 都表现出最高的准确率，这使得难以得出最终结论。


  ### 2.3.4 用于预测网络流量的机器学习算法


  Adekitan 等人的研究[[62]](#612428_1_En_2_Chapter.xhtml#CR62)围绕利用尼日利亚 Covenant 大学一整年的互联网流量日志数据展开。所考虑的参数是下载和上传的互联网流量量。预测模型基于前几天的累积数据来预测给定日期的数值。四种机器学习算法——即树集成、随机森林、决策树和朴素贝叶斯——与
  Konstanz 信息挖掘器（KNIME）数据挖掘软件相结合，以生成预测模型。研究人员得出的结果表明，对于下载和上传 IP 流量，精确率准确度为 55.66%，其中树集成方法表现最佳。


  Iqbal 等人对预测算法进行了比较分析，重点关注准确率、成本和复杂性作为关键评估标准[[63]](#612428_1_En_2_Chapter.xhtml#CR63)。他们使用时间序列方法、人工神经网络（ANN）和基于小波变换的预测，对网络流量进行了实时分析。作者强调，网络轨迹在很大程度上影响预测模型的选择，因此他们提出了一种新的度量标准，将准确率和功耗合并为一个单一变量。他们还设计了一个结合性能和能耗的评分，并强调了网络流量的总体可预测性。研究发现，对于需要更多计算资源的在线应用，双指数平滑（DES）和自回归移动平均（ARMA）表现出更高的预测准确率以及最低的能耗。然而，ANN
  似乎对不同网络轨迹的一致性更好，而指数平滑（ES）和三重指数平滑（TES）的实现仅增加了复杂性，并未提高准确率。


  类似地，Zhao 和 He 对长短期记忆网络（LSTM）、门控循环单元（GRU）、时序卷积网络（TCN）和 NTAM-LSTM 进行了比较[[64]](#612428_1_En_2_Chapter.xhtml#CR64)。后者指的是作者提出的用于网络流量预测的模型，其初始预测使用
  LSTM 进行，并插入了一个注意力机制以提高准确率。这使得在计算加权和的值之前，可以计算出各种流量类型属性的值。在一个包含 10,000 个网络指标（如每个数据包的总字节长度）实例的数据集上，以
  90:10 的训练-测试比例，算法根据平均绝对误差（MAE）进行了评估。所提出的模型不仅解决了传统 LSTM 模型总是为不同属性值设置相同长度的不足，而且在准确率和预测时间方面表现更优。这使得该模型可以应用于需要快速网络资源分配的场景。简而言之，当单独运行时，LSTM
  方法产生了最差的 MAE，但当与注意力机制结合时，它既实现了最小的性能误差，也实现了最快的预测时间。




  为了预测真实 LTE 环境中每个小区的数据量，Gijón 等人 [65] 对监督学习（SL）模型与时间序列分析方法论的有效性进行了深入比较。通过首先从跨越三十多个月的大规模数据集中收集数据，所研究的算法包括随机森林、神经网络、SVM、季节性自回归综合移动平均（SARIMA）以及加法
  Holt-Winters。随着 5G 的到来预计将引发拥塞的急剧增加，研究探讨了长期数据流量与短期序列预测之间关系的准确性和处理复杂度。随后，利用长期记录对移动流量进行预测，得出的结论是，在精度和存储需求方面，SL
  方法优于传统的时间序列过程。


  Sun 提出了一种基于本地无线局域网的智能预测流量分析工具的创新方法 [66]。该研究依赖于变系数回归模型，并辅以核估计和最近邻估计权重函数。作者将该算法标记为
  KNN 非参数回归预测算法，总结于图 2-12。此外，通过一种系统化的方法，精心构建了一个详尽的历史记录日志，以识别和确定现有历史数据与新获取数据之间的相似性。流量首先被识别为处于繁忙或非繁忙区域，前者代表因不同使用场景而产生的波动变化，后者则与相对稳定的行为模式相关。该算法在与先前在同一实验环境下进行的研究相比，无一例外地展现出更优越的准确性。


  ![](img/612428_1_En_2_Fig12_HTML.jpg)


  流程图描述了新轨迹如何通过历史数据库、近邻搜索程序、最近邻子集以及预测生成算法进行处理，以获得预测结果。


  图 2-12


  Sun 提出的 KNN 非参数回归预测算法的工作流程 [66]


  Joshi 和 Hadi 深入探索了多种方法论，涵盖了神经网络和数据挖掘技术领域，其焦点集中在提出各种线性和非线性预测方法上 [67]。该研究还涉及结合上述方法以提高预测效率。诸如
  DARPA 和 NSL-KDD 等著名数据集促进了所研究的各种评估指标的探索，包括自回归综合移动平均（ARIMA）和混合模型。此外，该综述还呈现了极具启发性的研究，深入探讨了
  NTMA 的复杂细微之处。


  在 Dalmazo 等人进行的一项研究中，研究人员研究了预测模型在动态环境中的有效性 [68]。具体来说，他们关注的是现代网络中常见的不可预测且波动的流量模式。在云计算的背景下，评估一种方法时考虑了多个变量，包括效率、准确性、计算时间和复杂度。测试了六种机器学习算法在使用静态和动态输入集预测时间序列数据方面的能力。这些算法包括简单移动平均（SMA）、加权移动平均（WMA）、指数移动平均（EMA）、泊松移动平均（PMA）、自回归移动平均（ARMA）和自回归综合移动平均（ARIMA）。该框架如图
  2-13 所示。研究揭示，与使用静态窗口方法相比，动态窗口大小算法（DyWiSA）的实施显著提升了所有六种算法的准确性。该论文还推荐使用 NTMA 来减轻历史模式随时间发生突然波动的影响。


