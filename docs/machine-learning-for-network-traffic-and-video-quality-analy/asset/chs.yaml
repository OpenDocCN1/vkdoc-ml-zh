  \ 应用可以优化，以便为 YouTube Shorts、TikTok 和 Instagram Reels 等流行服务持续截取屏幕截图。尽管本书中该应用是为网页浏览器量身定制的，但通过部署能够捕获当前流行的短视频相关屏幕截图的\
  \ Android 客户端，该无参考图像质量评估（盲 IQA）算法也可应用于移动、桌面和 IPTV 平台。因此，为了适应当今视频内容不断演变的特性，相同的 VQA\
  \ 原理可以简单地应用于用户迁移进行视频消费的平台，并结合来自用户的反馈机制，这些反馈可作为与机器学习算法生成的 MOS 评分进行比较的基础。例如，TikTok\
  \ 上偶尔弹出的弹窗，会向最终用户询问关于最近观看视频的反馈。通过持续监控和分析用户交互，可以进行调整，以确保应用在内容类型不断演变的情况下，仍能有效生成准确的\
  \ MOS 评分。\n\n## 6.6 总结\n\n第 5 章重点介绍了基于前几章掌握的概念，使用 JavaScript 进行 VQA 框架的应用开发。首先描述了系统模型，然后全面介绍了客户端、服务器和\
  \ Servlet 模块及其相应的功能。Servlet 使用 Java 语言在 Eclipse IDE 中编写，当被客户端和服务器组件生成的屏幕截图触发时，能够生成\
  \ MOS 评分。通过在网页浏览器中流式传输的视频上循环连续截取屏幕截图，用户可以获得实时的 QoS 指标，如测试与部署部分所示。以下是一些关键要点：\n\n\
  *   在 VQA 系统模型中，客户端在网页浏览器中执行，服务器端在 Node.js 上执行，Java Servlet 在 Eclipse IDE 上执行。\n\
  \n*   客户端程序负责捕获视频帧并将其传输到服务器进行分析。同时，服务器充当中间人，根据所截取的屏幕截图向 Servlet 请求 MOS 评分。一旦被触发，Servlet\
  \ 使用 BRISQUE 方法生成评分并将其发送回服务器，然后服务器更新客户端。\n\n在下一章中，NTMA 和 VQA 框架将被集成到一个简单的应用中，允许最终用户在同一个浏览器扩展中执行这两项功能。\n\
  \n\n\n"
- "# 7. NTMA 与 VQA 的集成\n\n为了将网络流量监控与分析（NTMA）和视频质量评估（VQA）整合到一个无缝的实时应用中，以满足网络和视频质量监控的双重需求，本章提供了完整的系统模型，弥合了网络活动分析与视频质量评估之间的鸿沟。因此，本章将介绍为实现客户端与\
  \ Node.js 服务器之间实时通信而编写的 JavaScript 代码以及对 Node.js 服务器所做的修改，并附上完整的程序结构和实现方法。最后，本章通过一个应用测试部分，阐明了\
  \ NTMA 与 VQA 集成应用的有效性。\n\n## 7.1 集成 NTMA 与 VQA 应用的系统模型\n\n在本节中，网络流量监控与分析（NTMA）和视频质量评估（VQA）应用被整合到一个单一的无缝应用中。相同的代码片段被修改，以构建一个三层架构，包括客户端、基于\
  \ Node.js 的后端服务器以及使用 Apache Tomcat 托管的本地 Java Servlet。这三个框架运行在同一设备上，但也可以适配到不同的设备上运行。以\
  \ NTMA 和 VQA 为核心，该应用在对整体用户体验进行全面评估后，为最终用户提供以下功能：\n\n1.  通过浏览器扩展，直接在网页浏览器中监控实时网络参数。\n\
  2.  基于整理成实时值的历史数据，获取回归和分类分析结果。\n3.  获取网络性能的服务质量（QoS）评分，即网络评分。\n4.  通过浏览器扩展，直接在网页浏览器中监控实时视频质量指标。\n\
  5.  获取正在观看的视频流的实时平均意见得分（MOS）。\n6.  获取一个主导质量评级，总结所分析帧的视频质量表现。\n\n构成此应用的原理分别继承自第 5\
  \ 章和第 6 章的 NTMA 和 VQA 应用。因此，用户界面（UI）被设计为显示来自两个领域的混合指标以及实时图表，用户可以通过在实时 NTMA 和实时 VQA\
  \ 之间切换选择来动态查看，从而让最终用户完全控制查看偏好。如前几章所述，扩展程序需要相同的四个基本文件才能运行。完整的系统模型如图 7-1 所示。\n\n![](img/612428_1_En_7_Fig1_HTML.jpg)\n\
  \n数据流图定义了视频质量评估。包含 popup.html、manifest.json、background.js 和 pop.js 文件的浏览器扩展包，通过网络流量监控与分析，经由\
  \ Node.js 服务器发送到 Java Servlet。\n\n图 7-1\n\n完整的集成 NTMA 与 VQA 系统模型\n\n### 7.1.1 组件与功能\n\
  \n构成此应用客户端（即前端）的仍是以下四个文件：\n\n*   popup.html\n*   background.js\n*   pop.js\n*  \
  \ manifest.json\n\n它们的功能与表 5-1 和表 6-1 中描述的相同，如下所示：\n\n*   从最终用户处获取“窗口大小”和“预测时间”参数的输入。\n\
  *   当点击“监控与分析”按钮时，向 Node.js 服务器发送消息以触发它。\n*   接收 JSON 消息中的网络和视频质量指标，然后将其输出到仪表盘上。\n\
  *   更新实时图表，并通过用户可点击的切换按钮在实时 NTMA 和 VQA 图表之间切换。\n\n同样，`server.js` 文件充当 NTMA 模块的后端和\
  \ VQA 模块的中介，因为后者从 Java Servlet 获取 MOS 分数。NTMA 功能通过在服务器端成功接收“窗口大小”和“预测时间”变量来触发。同样地，由连续的裁剪截图组成并进行图像质量评估（IQA）的\
  \ VQA 模块，在服务器端重建完整截图并进行裁剪后被触发。然后，托管第 6 章中介绍的同一个 Servlet，以基于失真加重方法计算 MOS 分数。一旦网络和视频质量指标都计算完毕，仪表盘就会显示最终用户所体验到的感受。因此，当用户访问\
  \ YouTube 或 Twitch 等视频流媒体网站时，可以使用集成的浏览器扩展来监控和预测实时网络指标，并观察视频质量的变化。对于此应用，NTMA 监控过程设置为六十秒，VQA\
  \ 监控过程设置为六十帧。后者涉及更多的处理时间，这意味着只有在获得 VQA 结果后才能进行完整的测试。\n\n### 7.1.2 结合视频质量指标的网络流量预测与分类\n\
  \n集成的 NTMA/VQA 应用包括在服务器端无缝进行的监控过程，同时向客户端报告实时指标和更新。尽管独立运行，这两个模块可以协同工作，以提高粒度和洞察力。这些指标可以作为衡量典型网络在不同类型活动下（甚至经历峰值和低谷时）性能的强有力且可靠的度量。机器学习（ML）算法训练得越多，其准确性就越高，因此算法对意外流量行为的预测和响应能力也就越强。此应用性能的关键在于数据集的选择，这取决于网络环境。该框架为构建一个可靠的集成\
  \ NTMA 和 VQA 应用提供了基础，用户只需在网页浏览器中轻轻一点即可使用。\n\n### 7.1.3 集成 NTMA/VQA 应用布局\n\n在此应用中，弹出窗口使用户能够直接在网页浏览器中监控实时网络和视频指标。一对实时图表描绘了指标的实时演变过程。用户可以通过一个切换按钮在\
  \ NTMA 和 VQA 图表之间进行选择。一旦打开，客户端会搜索 Node.js 服务器并连接到它。用户点击“监控与分析”按钮来触发后端进程。然后，第 5 章和第\
  \ 6 章中看到的相同功能开始运行，使得用户界面能够通过实时指标进行更新，这些指标由仪表盘卡片承载，并分类为“网络指标”或“视频质量指标”。测试结束后，会生成一个混合了网络和视频指标的集合，这些指标是在对每个模块的六十个实例进行分析后产生的，从而构成一个特定的会话。图\
  \ 7-2 展示了集成的 NTMA/VQA 浏览器扩展，其中显示了两个图表。\n\n![](img/612428_1_En_7_Fig2_HTML.jpg)\n\
  \n集成 NTMA 和 VQA 窗口的两个截图。实时功能在第二页开启。每个窗口都记录了数值随帧分析和时间变化的折线图。它还列出了已完成测试的网络指标和视频质量指标。\n\
  \n图 7-2\n\n集成 NTMA 与 VQA 应用布局\n\n\n\n### 7.1.4 客户端-服务器-Servlet 交互\n\n图 7-3 展示了客户端、Node.js\
  \ 服务器以及托管的 Apache Tomcat Java Servlet 之间逐步的三方通信架构。\n\n![](img/612428_1_En_7_Fig3_HTML.jpg)\n\
  \n数据流图定义了客户端、服务器以及托管的 Apache Tomcat Java Servlet 之间的三方通信。HTML 文件接收窗口大小和 URL，并通过\
  \ NTMA 和 VQA 从 Java Servlet 接收网络和视频质量指标。\n\n图 7-3\n\n用于集成 NTMA 和 VQA 的客户端-服务器-Servlet\
  \ 交互\n\n## 7.2 集成 NTMA/VQA 应用的客户端程序结构\n\n本节包含通过四个基本文件进行的前端开发。客户端程序结构的概要如图 7-4 所示。\n\
