  ### 2.2.4 ManageEngine NetFlow Analyzer


  NetFlow Analyzer [39] 是一个完整的流量分析工具，专注于流技术以展示网络带宽的实时表现，其主要目标是通过容量规划和安全监控来优化网络。它有助于收集、分析和生成关于带宽利用率的报告，并通过深入到接口级别的细节，成为提高全球网络效率的可靠合作伙伴。NetFlow
  使用连续流挖掘（CSM）引擎技术，支持网络取证和安全分析，以应对绕过防火墙的异常情况。此外，可以通过恶意网络行为识别上下文相关的异常值，以确保 QoS 标准。该应用程序还能够通过实施访问控制列表（ACL）或基于类的策略，来识别和分类过度消耗网络带宽的非标准应用程序。这可以与
  Cisco NBAR 配合使用，以获得对第 7 层流量的全面洞察，从而便于识别使用动态端口号或隐藏于常见端口中的应用程序。它兼容主要的流格式，例如 NetFlow、sFlow、cFlow
  和 J-Flow。NetFlow Analyzer 提供 IP SLA 监控、深度数据包检测功能、警报和通知以及分布式监控能力 [40]。图 2-6 展示了该应用程序在
