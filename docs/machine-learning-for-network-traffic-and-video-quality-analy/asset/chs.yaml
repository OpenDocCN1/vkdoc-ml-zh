  \ HTTP POST 请求\n\n本节涉及 `doPost()` 方法的开发，当 Servlet 收到来自客户端的请求时，该方法被触发。因此，它协调了图 6-23\
  \ 中所示的一系列处理步骤。\n\n![](img/612428_1_En_6_Fig23_HTML.jpg)\n\n流程图从获取编号参数开始，接着是指定请求截图路径、读取图像、获取\
  \ RGB 值、引入失真、获取 MPRI、提取 LBP 特征以及写入 JSON 对象。\n\n图 6-23\n\nServlet 的功能\n\n以下是 `doPost()`\
  \ 方法功能的详细分解：\n\n1.  从客户端发送的 HTTP 请求中获取“number”参数。\n\n2.  处理读取的图像：\n    1.  使用 `read()`\
  \ 方法根据“number”参数读取图像文件。\n\n2.  使用 `getRGB()` 方法提取截图中每个像素的 RGB 值，该方法将图像转换为灰度图。每个红色、绿色和蓝色像素值在\
  \ 0–255 范围内取平均值，并存储在 `img1` 数组中。\n\n3.  从灰度截图中提取 LBP 特征。\n\n4.  通过 `jpeg()`、`jpeg2000()`、`gblur()`\
  \ 和 `wnoise()` 方法应用压缩和失真技术。\n\n3.  创建用于 SVM 输入数据的“dataset1.txt”和“dataset.txt”文件，并将处理后的图像数据写入这些文件。\n\
  \n4.  调用图像处理运行器：\n    1.  定义图像处理的命令行参数。\n\n2.  使用 `runner()` 方法运行该进程。\n\n5.  定义用于\
  \ SVM 缩放和预测的命令行参数。\n\n6.  设置预测概率和输出流等选项。\n\n7.  从指定文件加载 SVM 模型，并使用它来预测处理后的图像数据的\
  \ MOS。\n\n8.  获取 MOS 分数作为预测结果。\n\n9.  创建一个 JSON 对象来存储 MOS 分数，并将响应的内容类型设置为 JSON。\n\
  \n10. 使用 `PrintWriter` 对象将响应写回客户端。\n\n`doPost()` 方法因此被填充，如代码清单 6-21 所示。相应文件的路径应根据实际情况进行更改。\n\
  \n\n\n```\n// 定义 doPost 方法以处理 HTTP POST 请求。\nprotected void doPost(HttpServletRequest\
