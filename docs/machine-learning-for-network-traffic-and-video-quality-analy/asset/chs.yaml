  },\n\"background\": {\n\"service_worker\": \"background.js\"  // 后台脚本，作为 Service\
  \ Worker 实现。\n},\n\"permissions\": [ // 扩展所需的权限列表。\n\"activeTab\",  // 允许扩展与当前活动标签页交互。\n\
