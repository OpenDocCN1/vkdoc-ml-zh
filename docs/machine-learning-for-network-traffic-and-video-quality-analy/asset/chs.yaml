  | **处理时间序列数据** | 某些围绕股票价格和物联网传感器构建的应用可以极大地受益于诸如重采样、聚合和插值时间序列数据点等功能。 |


  数据准备工具常常被低估，但它们通过有效管理、清洗和转换数据，为创建准确的机器学习模型铺平了道路。




  ### 1.3.4 使用 JavaScript 进行监督学习


  机器学习的一大支柱是监督学习方法，它允许使用标记数据训练框架进行预测和分类。这种方法为开发者提供了构建智能网站的丰富资源。以下是关于机器学习与 JavaScript
  结合如何使程序员能够高效创建监督学习模型的要点总结 [75]：


  *   **利用标记数据**：JavaScript 适用于情感分析、内容分类和推荐引擎等应用，因为它允许通过网页界面直接收集标记信息。这意味着输入与期望的输出结果相关联。


  *   **简化模型训练**：编码人员可以使用简洁的语法来构建模型架构、设置超参数并启动训练。JavaScript 的实时特性允许可视化训练进度，提高了模型的透明度，并允许进行动态调整。


  *   **跨平台兼容性**：使用 JavaScript 构建的此类模型能够在各种设备和操作系统上稳定运行，这意味着无论设备类型如何，广大用户都可以使用这些具备机器学习能力的网络应用。


  *   **跨领域应用**：可以开发自然语言处理（NLP）、图像识别、欺诈检测、人工智能聊天机器人等应用，这为创建能够满足几乎所有人需求的前沿、高度自适应的网络应用打开了大门。


  监督学习的一些用例包括：


  *   **分类**：根据文本的主题或情感对其进行分类是监督学习的一个典型应用。可以使用 JavaScript 创建一个电子邮件过滤器，根据训练数据判断邮件是否为垃圾邮件。


  *   **图像识别**：用于对图片进行分类的模型，例如判断给定图片是猫还是狗，可以用 JavaScript 实现。


  *   **预测分析**：通过使用 `scikit-learn.js` 等工具进行回归和时间序列分析，可以在使用 JavaScript 构建的网站上动态执行股票价格、客户流失率和客户需求的预测。


  ### 1.3.5 使用 JavaScript 进行无监督学习


  与监督学习中使用标记数据不同，无监督学习擅长在未标记的数据集中发现隐藏的结构、模式和相关性。这使得开发者能够从未注释的数据中获取洞察并提取有意义的信息。以下是其显著特点
  [76]：


  *   **聚类与数据分组**：通过所谓的数据聚类，可以根据潜在的相似性对数据点进行分组。这在诸如为定制化在线体验进行客户细分等场景中非常有用。


  *   **降维**：为了降低网络应用中的计算复杂度，会使用主成分分析（PCA）和 t-分布随机邻域嵌入（t-SNE）等专门用于降低数据集维度的技术。


  *   **异常检测**：无监督学习在发现数据趋势中的异常或离群点方面表现出色，这在欺诈检测和网络安全领域至关重要。偏离常态的情况会被迅速识别并相应处理。


  *   **自然语言处理（NLP）中的主题建模**：近年来，像 `Natural.js` 这样的 JavaScript 库已广受欢迎，它们使程序员能够从大量非结构化文本数据中推断含义并对相似词汇进行分组，从而促进内容分类和推荐。这是一个日益重要的功能，被在线商店用来获取关于特定产品评论的洞察。


  无监督学习的一些用例包括：


  *   **聚类**：可以使用 K-means 聚类或层次聚类等算法，根据客户的在线行为或产品偏好将其划分为不同的群体。


  *   **异常检测**：可以构建围绕发现金融数据中异常模式以识别欺诈交易的引擎。


  *   **降维**：如前所述，可以使用 PCA 等方法在保留关键字段的同时降低数据维度。


  结合 JavaScript 的 Web 开发，无监督学习是一个强大的盟友，它能揭示数据中的隐藏模式，解构复杂的数据集，并提取富有洞察力的知识。无论是否有标记数据，开发者都可以通过关联和推断，创建智能且数据驱动的在线体验。




  ### 1.3.6 JavaScript 中的深度学习


  作为机器学习的一个重要子集，深度学习近年来发展迅猛，这得益于其利用多层神经网络解决复杂问题的能力。深度学习主要与 Python 等语言相关联，通过 TensorFlow
  和 PyTorch 等框架实现，但它也已渗透到 JavaScript 领域，通过使用 Node.js 库为开发者提供了坚实的基础。深度学习利用了人工神经网络的潜力，人工神经网络旨在模仿人脑的结构和运作方式，进而采用相同的思维策略。就像大脑由触发反应的神经元组成一样，这些网络由权重和激活函数等超参数驱动，帮助它们从输入中学习层次化特征和表征。在经过一系列不同数据集的反复训练后，该算法能够处理复杂任务并生成输出。深度学习在网络开发领域的兴起归因于以下因素
  [77]：


  *   **多样化的神经网络架构**：JavaScript 与 TensorFlow.js 等包一起，为各种神经网络拓扑结构提供了广泛支持。卷积神经网络在图像分析领域表现出色，而循环神经网络则专门用于处理序列数据，例如自然语言处理
  [78]。BERT 和 GPT-3 等先进 Transformer 模型的出现正在显著影响该领域，它们在语言理解和生成领域带来了范式转变 [79]。Web 应用程序的灵活性使其能够有效地将深度学习技术用于各种目的，例如图像识别、情感分析和语言翻译。


  *   **使用预训练模型的迁移学习**：JavaScript 中的深度学习环境支持迁移学习的实践，开发者可以微调预训练模型以适应特定应用。例如，在图像识别场景中，使用像
  VGG16 这样的预训练卷积神经网络作为特征提取器，可以显著加速软件开发过程 [80]。类似地，利用 BERT 的情境语言理解能力，可以增强聊天机器人的精度以及自然语言处理相关活动中的内容摘要。


  *   **使用 JavaScript 进行实时推理**：使用 JavaScript 实现深度学习的一个显著优势是它能够在 Web 浏览器内部直接进行即时推理。使用客户端处理有助于减少延迟并降低服务器交互的需求。像专为图像分类设计的
  EfficientNet 和为文本理解开发的 BERT 这样的算法，可以对用户输入做出快速响应 [81]。这在聊天机器人、推荐系统和内容个性化等应用中广受赞誉。


  *   **可解释性与模型可说明性**：随着深度学习模型变得越来越复杂，理解其决策过程也变得越来越重要。JavaScript 配备了用于解释模型的工具，使其能够直观地展示特征重要性和决策边界。诸如积分梯度和
  SHAP 值等方法，可以洞察模型预测背后的原理，从而在医疗诊断和信用风险评估等领域增强透明度和可靠性 [82]。


  *   **跨领域影响**：JavaScript 中深度学习的应用已渗透到各个领域，产生了广泛的影响。在医疗保健行业，卷积神经网络被用于分析医学图像以进行诊断。相反，在自动驾驶领域，像
  YOLO 这样的算法被用于实时识别障碍物 [83]。同样，在自然语言处理方面，像 BERT 和 GPT-3 这样的 Transformer 算法已经显著改变了聊天机器人和语言理解的能力。


  将深度学习集成到 JavaScript 中，为 Web 开发者提供了多样化的技术功能，有助于创建智能、动态且快速的应用程序，这些应用程序表现出卓越的性能。这满足了互联网用户随着
  Web 应用程序使用率上升而对卓越性能日益增长的需求。


  ### 1.3.7 在 Web 应用程序中部署机器学习模型


  将机器学习模型集成到基于 Web 的应用程序中，标志着数据驱动开发的完成，使消费者能够直接访问智能和自动化功能。本节深入探讨在 Web 应用程序中实现机器学习模型的基本组成部分，重点关注实际挑战和机遇
  [84]，包括以下内容：


  *   **与 Web 环境的集成**：JavaScript 提供服务器端和客户端脚本的能力，提供了一个具有平滑集成的多功能平台。


  *   **RESTful API 和端点**：一种常用的模型部署策略涉及开发 RESTful API 和相应的端点。这些应用程序编程接口为 Web 应用程序提供了一种连接和使用机器学习模型的方法。这使得它们能够传输数据以进行预测，并接收模型提供的洞察。JavaScript
  与 Express.js 等框架结合使用时，简化了 API 的开发和维护过程。


  *   **客户端推理**：像 TensorFlow.js 这样的框架支持执行客户端代码。这种方法减少了数据传输所需的时间，并降低了与服务器的交互频率，从而带来快速且更高效的用户体验。


  *   **可扩展性与资源管理**：面对诸如用户加载时间和并发连接数等常见连接问题，在 Web 浏览器中部署机器学习模型时，可扩展性至关重要。Node.js 提供了可扩展性选项，以有效处理增加的流量并确保模型的快速执行。


  *   **性能优化**：在 Web 应用程序中优化模型效率至关重要。凭借其异步特性，JavaScript 有潜力优化框架执行，从而确保即使在用户流量大的情况下也能高效生成预测。




  ## 1.4 Node.js 与网络技术


  Node.js 是一个由 Chrome 的 V8 JavaScript 引擎驱动的 JavaScript 运行时，已在 Web 开发和网络领域获得了广泛认可。Node.js
  适用于网络技术的基本原因在于其采用了异步、非阻塞的输入/输出模型以及事件驱动的架构设计 [85]。与传统的同步编程语言相比，Node.js 能够并发处理大量网络请求，而不会影响其他进程的性能。这一特性极大地提升了管理网络连接的效率，尤其是在那些优先考虑响应速度和实时交互的场景中
  [86]。除了允许在服务器端开发完整的网络应用程序外，Node.js 还是跨平台的，可在 Windows、macOS 以及多种基于 Unix 的操作系统上运行。这使得它非常适合将服务器安装到从
  Web 服务器到物联网设备的各种设备上。


  Node.js 以其可通过其包管理器“npm”访问的大量模块和库而闻名。其中许多模块是专门为网络目的设计的，为常见障碍提供了现成的解决方案，例如建立 HTTP
  服务器、实现 WebSocket 以及与数据库连接。该系统的可扩展性促进了开发的快速进展，并简化了将第三方服务集成到网络应用程序中的过程。Node.js 的事件驱动特性在涉及实时通信的场景中提供了显著优势。WebSocket
  作为多个应用程序的基本组成部分，促进了客户端和服务器之间双向、低延迟通信通道的建立 [87]。在需要即时信息分发的应用程序中，例如聊天应用、在线游戏和协作工具，提供实时更新的能力至关重要。


  Node.js 与网络技术之间的关系是相互交织的，因为 Node.js 为开发高效且响应迅速的网络应用程序提供了一个强大的框架。本书将探讨使用 Node.js
  增强网络功能的可能性。这些功能包括创建服务器和客户端、确保网络连接的安全性，以及通过支持多个并发连接来促进应用程序的可扩展性。表 1-3 列出了 Node.js
  在网络技术中的一些用例 [88, 89]。


  表 1-3


  Node.js 在网络技术中的用例


