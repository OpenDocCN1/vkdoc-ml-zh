  ### 2.2.3 Wireshark


  Wireshark [37] 被广泛认为是一款著名的开源网络数据包分析工具。这意味着它允许检查网络数据包数据。虽然它不是一个功能完备的 NTMA 工具，但它作为一块垫脚石，为网络流量研究做出了重要贡献，能够及时捕获数据包信息，并且对于解决网络相关问题以及检查流量模式至关重要。它支持多种网络协议，并具有内置功能，能够以易于人类理解的格式解释和呈现数据包内容。一些示例包括
  IP、TCP、HTTP 和 SNMP [38]。这有助于管理网络数据流并发现阻塞和问题。因此，实时数据包捕获是 Wireshark 的亮点，而后续分析则需要第三方插件或整个框架。因此，Wireshark
  仅涵盖监控方面，并且对于网络管理员、安全专家以及从事 NTMA 复杂方面学习的学生来说，它是一个极好的资源，因为它是开源的。图 2-5 展示了通过 Wireshark
