  Vega 等人提出的通用预测性 VQA 方法工作流程 [76]




  与此同时，Raca 等人专注于研究机器学习和深度学习方法如何为蜂窝网络上的视频流服务生成精确预测 [86]。作者采用支持向量机（SVM）和随机森林（RF）作为吞吐量预测的训练算法。随后，在各自的能力、训练要求和数据需求方面，与长短期记忆（LSTM）框架进行了比较。通过考虑连接设备数量和平均吞吐量等参数，确定了单小区内的
  QoS 指标。推导出的特征包括比特率、切换次数、平均切换次数以及特定视频片段的平均比特率。然后，该预测器与一个基于 4G 的 HTTP 自适应流媒体（HAS）视频播放器相结合，与传统视频播放器的被动反应特性相比，实现了出色且具有前瞻性的评估。这带来了显著的改进，体现在不同质量级别之间的无缝切换以及对可用网络容量意外下降的快速适应方面。


  与这项研究一致，Mao 等人开发了 Pensieve，这是一个深度强化学习（DRL）系统，它整合了从客户端视频观众收集的数据，以确定未来的比特率 [87]。Pensieve
  利用先前案例的视频质量度量来改进过去的 ABR 决策。它能够通过试错动态地开发一种用于比特率自适应的控制方法。图 3-15 给出了一个包含 ABR 控制器的 HTTP
  自适应视频流概述。学习代理接收的输入除了带宽因素外，还包括检索视频部分所需的持续时间。因此，ABR RL 代理能够区分哪些策略由于有缺陷的建模技术而优于传统方法。通过使用神经网络将
  RL 应用于比特率自适应的 Pensieve 整体架构如图 3-16 所示。据作者称，该技术通过根据实际试验结果不断修改其控制策略来提高性能，与最先进的平台相比，性能提升了约
  12% 到 25%。


