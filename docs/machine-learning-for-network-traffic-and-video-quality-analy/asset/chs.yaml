  ## 1.5 本书概览


  本书共分为七章。在第一章（即本章）中，已为后续探索奠定了基础。本章概述了网络流量监控与分析（NTMA）和视频质量评估（VQA），并详细阐述了 JavaScript
  中机器学习（ML）的核心概念、方法论和现有应用，以及使用 Node.js 开发网络应用程序。这些主题向读者介绍了这些范式的核心组成部分。


  第 2 章聚焦于 NTMA 领域的机器学习技术。除了介绍行业专业人士当前使用的应用外，还介绍了网络流量分析的基础知识。本章还提供了关于 NTMA 在现实世界研究和应用方面的详细最新综述。


  第 3 章模仿了 VQA 的结构，重点介绍了通过主观和客观评估生成质量评估指标所涉及的基本概念。


  第 4 章将焦点转向围绕 NTMA 的分类和预测算法的分解。这包括对 ML 模型和框架及其超参数的详细检查，以实现最佳准确性。此外，还揭示了支持向量机（SVM）和深度学习（DL）方法在
  VQA 背景下的应用。


  第 5 章深入探讨了使用 JavaScript 实现 NTMA 的实践方面，从如何捕获网络流量开始，然后通过 Node.js 的后端进行实时网络分析。该应用程序被打包成一个轻量级的浏览器扩展，可以在任何页面上打开以进行即时实时监控。


  第 6 章描述了 VQA 应用程序的开发，其后端使用 Java 构建，并通过 Apache Tomcat 托管在本地 Servlet 上。前端包括在播放视频的浏览器标签页上打开的浏览器扩展，视频流被发送到
  Servlet，进而触发质量评估模块，最终生成一个视频质量分数。


  第 7 章将 NTMA 和 VQA 的功能整合到一个应用程序中，使得这两种能力都可以在同一个浏览器扩展中，通过点击一个按钮来使用。本章涵盖了系统模型、程序结构和性能分析等方面。




  '
- '# 2. 网络流量监控与分析


  本章通过全面回顾网络流量监控与分析（NTMA）的基本概念，并强调其在评估网络活动和性能方面所起的关键作用，从而奠定其基础。伴随着大量用户涌入我们的网络，网页浏览和视频流等活动的日益普及，进一步要求我们采取措施和标准来维护网络环境的服务质量（QoS）。因此，预测直接影响
  QoS 的网络流量参数（如上载和下载速率）至关重要。随后，本章将介绍全球组织和主要电信运营商当前使用的尖端 NTMA 方法。此外，本章还概述了用于分类和预测网络流量的
  NTMA 方法。因此，本章重点阐述本书中 NTMA 流程所依据框架的理论方面。


  ## 2.1 NTMA 基础


  互联网正经历着网络流量的指数级增长，网络流量是指在某个时间点通过网络传输的数据量 [1]。这种增长归因于互联网规模和复杂性的不断扩大。监控网络性能、确保安全性和管理资源是系统管理的基本组成部分
  [2]。这一主题引出了 NTMA 领域，当前科学研究主要集中于深度学习（DL）模型的应用，包括卷积神经网络（CNN）、循环神经网络（RNN）和长短期记忆（LSTM）分析。通常，网络开发生命周期（NDLC）用于为网络监控系统设计一个周期，该周期没有明确的起点或终点，同时满足以下领域
  [3]：


  *   评估进行研究的需求，识别现有问题，并分解网络拓扑。

  *   为特定时间尺度制定监控策略。

  *   通过监控、分析和实施来执行研究。

  *   通过日志记录捕获并记录监控结果。

  *   控制和评估结果。

  *   提出网络管理建议。


  随着分析功能的加入，以及近期机器学习（ML）发展的推动，这一列表进一步扩展，使得对网络指标进行预测成为可能。这导致了范式的转变，通过优化和基于 ML 的资源分配，提供了更多的网络管理选项。图
  2-1 描绘了一些先前研究基于其 NTMA 流程的基础结构 [3]。


