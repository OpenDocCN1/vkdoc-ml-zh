  \ 应用程序完成的用户界面\n\n### 6.2.4 构建客户端脚本\n\n客户端功能使用 JavaScript 实现，并包含在一个名为 `pop.js` 的单一文件中。该文件主要管理使用\
  \ WebSockets 与服务器的通信 [2]，使用接收到的指标刷新 UI，并使用 Chart.js 协调实时监控图表。\n\n\n\n#### 文件功能\n\
  \n以下是 `pop.js` 文件的功能分解：\n\n1.  声明全局变量，供整个脚本使用。\n\n2.  使用 Chrome 扩展 API 查询 Chrome\
  \ 标签页：\n    1.  获取当前活动且最后聚焦的标签页信息。\n\n    2.  获取活动标签页的 URL。\n\n3.  创建到服务器的 WebSocket\
  \ 连接：\n    1.  实现从服务器接收消息的方法。\n\n    2.  使用 `open` 事件处理连接。\n\n    3.  解析并记录消息。\n\
  \n4.  接收并处理来自服务器的消息：\n    1.  解析包含实时视频指标和图表更新的 JSON 消息。\n\n    2.  使用视频质量性能参数更新\
  \ HTML 元素。\n\n    3.  使用最新指标动态更新 Chart.js 图表。\n\n5.  为“监控”按钮创建事件监听器：\n    1.  为按钮添加事件监听器。\n\
  \n    2.  调用一个方法，使用 Chrome 扩展 API 截取当前页面视图的屏幕截图。\n\n    3.  计算将图像发送到服务器所需的 8 KB\
  \ 数据块数量。\n\n    4.  发送服务器应预期的数据块数量，作为元数据。\n\n    5.  将每个数据块发送到服务器。\n\n6.  为 DOM\
  \ 创建事件监听器：\n    1.  为 DOM 添加事件监听器。\n\n    2.  为两个数据集创建配置，并初始化 Chart.js 图表对象。\n\n\
  7.  实现一个方法，根据指定的标签每秒更新图表。\n\n8.  实现一个方法，在收到 Node.js 服务器的请求时截取当前页面的屏幕截图。\n\n####\
  \ 创建脚本结构\n\n在 `popup.html` 文件中导入并引用必要的库之后，通过首先定义结构来填充 `pop.js` 脚本，其中包括以下基本步骤：\n\n\
  *   初始化全局变量\n\n*   获取当前活动且先前聚焦的标签页的 URL\n\n*   为 DOM 附加一个事件监听器，以便在页面加载时立即触发执行\n\n\
  *   开发一个动态修改图表的程序\n\n清单 6-7 定义了脚本结构，以及其他功能的代码放置位置。\n\n```\n// 声明在整个脚本中调用的全局对象。\n\
  var monitorButton; // “监控”对象的变量。\nvar myChart; // Chart.js 对象的变量。\n// 查询活动且最后聚焦的标签页以获取当前\
  \ URL。\nchrome.tabs.query({\nactive: true,\nlastFocusedWindow: true,\n},\nfunction(tabs)\
  \ {\n\n}\n);\n// 在 DOM 上添加事件监听器，以便在页面加载时立即执行。\ndocument.addEventListener('DOMContentLoaded',\
  \ function() {\n\n}, false);\n// 在 servlet 分析每一帧后更新图表的方法。\nfunction addData(chart,\
  \ label, data, updateLabel) {\n\n}\n清单 6-7\n创建脚本结构\n```\n\n#### 页面加载时初始化并配置图表\n\n\
  `DOMContentLoaded` 事件在 HTML 文档的 DOM 完全加载后立即触发语句的执行。图表区域使用 `myChart` 变量引用，如 `popup.html`\
  \ 中所示。为了接受图表上设想的两个独立数据集，图表使用适当的规格进行初始化。通过为整个文档附加一个事件监听器来执行以下操作，该监听器在页面加载时立即触发：\n\
  \n1.  获取“监控”按钮的 DOM 元素，并将其分配给全局变量 `monitorButton`。\n\n2.  创建数据集配置：\n    1.  为“MOS\
  \ 分数”和“平均 MOS 分数”创建两个独立的数据集。\n\n2.  对于每个数据集，指定标签、背景颜色、边框颜色、边框宽度和点半径。\n\n3.  创建一个\
  \ `data` 对象，封装所有数据集设置，然后直接作为参数提供给 Chart.js。\n\n4.  创建一个 `options` 对象，用于设置 Chart.js\
  \ 图表的外观样式，设置包括响应性、宽高比、线条张力、轴配置、刻度显示设置和图例样式。\n\n5.  为 Chart.js 图表创建一个 `config` 对象，其中封装了图表类型、要包含的数据以及指定的选项。\n\
