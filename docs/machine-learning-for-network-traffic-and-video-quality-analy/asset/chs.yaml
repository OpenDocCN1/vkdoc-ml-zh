  ### 3.3.3 用于分析多媒体通信中视频质量的机器学习算法


  以往的研究主要集中在发现那些非常适合检测和响应多媒体通信系统（尤其是在基于互联网的通信中）控制特征的机器学习算法。Mohamed 等人使用人工神经网络复制并建模了一组样本个体对视频质量变化的反应
  [77]。考虑的因素包括丢包率、丢包分布、比特率和帧率。鉴于质量评估包含客观和主观两种视角，该研究旨在通过强调准确性来减轻围绕主观性的偏差。这些系统被部署在需要通过分组网络传输视频的场景中。然而，该评估并未考虑诸如音频与视频一同传输等特征，因此忽略了唇形同步等方面。人工神经网络模型使用来自人类测试小组的主观数据度量进行训练，从而充当一个模拟器。此外，作者重复了训练过程以改进算法。在二十名参与者进行主观评估后，具有预定失真参数的人工神经网络模型随后被部署在基于分组网络的实时视频架构上。该方法产生了
  0.9907 的相关系数和 0.253 的平均误差，从而证明了模拟人类视频质量评估的有效性。所用方法的总结如图 3-10 所示。


