  \"tabs\"  // 使扩展能够查询和操作浏览器标签页。\n],\n\"action\": {\n\"default_popup\": \"popup.html\"\
  ,  // 点击扩展图标时显示的默认弹出 HTML 文件。\n\"default_title\": \"Network Traffic Monitoring and\
  \ Analysis\"  // 扩展图标的默认标题。\n}\n}\n**代码清单 5-1**\n使用扩展设置和权限配置 manifest.json\n```\n\
  \n### 5.2.2 配置后台脚本\n\n作为静默的协调者，后台脚本在幕后处理基本功能，例如按钮点击，然后执行 Service Worker 逻辑。此应用程序所需的代码行在代码清单\
