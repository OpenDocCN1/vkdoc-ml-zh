  这意味着预测值为 33.184 ms。\n\n\n\n## 4.3 用于 VQA 的 SVM\n\n在本书中，实时的客观平均意见得分（MOS）是通过将连续截图输入到托管\
  \ Java servlet 中生成的，该 servlet 使用无参考（NR）方法，基于盲/无参考图像空间质量评估器（BRISQUE）原理进行图像质量评估（IQA）[17,\
  \ 18]。一旦获得前一帧的视频质量得分，就会立即截取并处理新的截图，从而形成一个连续循环。\n\n因此，通过应用本节详述的一系列步骤，图像失真程度可通过块效应、振铃效应、模糊和噪声等伪影来确定。对于此方法，得分越小表示视频质量越好。鉴于该指标在行业\
  \ VQA 供应商中的广泛使用和认可，它被标记为客观 MOS [19]。因此，本节将详细说明支持向量机（SVM）算法如何作为机器学习算法用于回归，从而根据实时视频（预处理为图像）生成视频质量得分。如\
  \ Min 等人 [20] 所述的工作所示，本书中的 VQA 模块使用了基于失真加剧的盲图像质量评估技术。\n\n### 4.3.1 基于失真加剧的盲图像质量评估\n\
  \n本书提出的 VQA 方法可分为以下三个主要步骤 [20]：\n\n1.  在生成多个伪参考图像（MPRI）的过程中，引入不同类型的退化加剧，以估计图像中最可能的失真类型。MPRI\
  \ 是通过添加不同比例的以下退化类型生成的 [21]：\n    1.  JPEG 压缩\n    2.  JPEG2000 压缩\n    3.  高斯模糊\n\
  \    4.  白噪声\n\n2.  然后，从每张图像中提取局部二值模式（LBP）特征，再评估该图像与每个生成的 MPRI 之间的相似性 [22]。\n\n\
  3.  将相似性得分输入到 SVM 回归模型中，用于缩放和最终预测视频质量得分 [23]。\n\n### 4.3.2 初步步骤\n\n图 4-6 展示了 BRISQUE\
  \ 方法所基于的系统模型。\n\n![](img/612428_1_En_4_Fig6_HTML.jpg)\n\nBRISQUE 方法初步步骤的图表。它始于一个浏览器扩展，然后是视频帧、本地目录以及\
  \ 5 个步骤。这 5 个步骤分别是：截图、JPEG 编码器压缩比的灰度图像、JPEG2000 压缩比的灰度图像、高斯模糊高斯核的灰度图像以及白噪声的灰度图像。\n\
  \n图 4-6\nBRISQUE 方法的初步步骤\n\nJava servlet 负责接收一个“数字”标签，该标签指示它应从代码中用户指定的本地目录中获取哪张截图。一旦接收到，它会读取裁剪后的截图，然后将其转换为灰度图，如图\
  \ 4-6 中的 `GrayImage` 对象所示。\n\n### 4.3.3 LBP 特征的提取\n\n在本节中，将结合数学公式和代码中执行的图示来解释 LBP\
  \ 特征的提取。\n\n#### 过程与公式\n\n获取灰度图像后，从 `grayImage` 对象中提取 LBP 特征，结果存储在 `mapDist` 数组中。二值化过程根据公式\
  \ 4-14 [22]，通过后续的亮度对比进行：\n\n![$$ {LBP}_{V,W}={\\sum}_{v=0}^{V-1}z\\left({p}_n-{p}_c\\\
  right) $$](img/612428_1_En_4_Chapter_TeX_Equ15.png)\n\n(4-14)\n\n其中：\n\n*   *p*[*c*]：中心像素\n\
  *   *p*[*n*]：圆形对称邻域像素\n*   *V*：邻域值\n*   *W*：LBP 特征的半径\n*   *z*(∗)：单位阶跃函数，表示为\n\n\
  ![$$ z=\\Big\\{1\\kern2.25em z\\ge 0\\ 0\\kern2.25em z&lt;0 $$](img/612428_1_En_4_Chapter_TeX_Equ16.png)\n\
  \n(4-15)\n\n为简化过程，将 *V* 和 *W* 设置为 *p* = 4 和 *r* = 1，得到以下 LBP 特征图：\n\n![$$ {LP}_{pr}=\\\
  Big\\{1\\kern2em {LP}_{4,1}=c\\ 0\\kern1.5em otherwise $$](img/612428_1_En_4_Chapter_TeX_Equ17.png)\n\
