  Vega 等人提出的基于 UDL 的实时 VQA 方法工作流程 [84]


  Vega 等人对视频流服务中用于测量 QoE 的技术进行了深入回顾 [76]。所涉及的框架包括用于评估 QoE 的预测方法，以期突出最适合此目的的机器学习算法。对于以
  MOS 为中心的 QoE 系统的客户端预测，已注意到 RR 和 NR 设计优于 FR 平台。这是因为 FR 框架需要访问源素材，导致算法耗时且复杂。然而，独立的
  RR 和 NR 模型在精确预测人类对视频素材的感知方面被证明是不足的。论文指出，机器学习通过实施主动式体验质量循环进行调节，显著提高了准确性。本文展示的众多预测框架之一如图
  3-14 所示。这些循环涉及消费者端和服务器端的监控工具，以便进行即时调整。Konuk 等人 [85] 展示了一个示例，其中使用 K-means 基于比特流和时空内容描述符对视频素材进行空间聚类。


