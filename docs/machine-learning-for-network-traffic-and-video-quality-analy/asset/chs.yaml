  \n对灰度图像施加四种不同类型的压缩和失真，以生成 MPRI。\n\n#### JPEG 压缩\n\n图像以 0 到 8 的压缩比进行压缩，步长为 2。图像所测试的伪影类型是块效应。在此过程结束时，会输出一组五张图像，称为\
  \ MPRI，如图 4-6 所示。JPEG 压缩由公式 4-17 概述，其中 *I* 表示原始图像。\n\n![$$ {M}_{lj}= JPEG\\left(I,{C}_j\\\
  right) $$](img/612428_1_En_4_Chapter_TeX_Equ18.png)\n\n(4-17)\n\n其中：\n\n*   *M*[*lj*]：在\
  \ JPEG 压缩的第 *j* 个程度（0 ≤ *j* ≤ 5）下压缩的 MPRI\n*   *l*：块效应伪影\n*   *JPEG*：JPEG 编码器\n\
  *   *C*[*j*]：压缩比\n\n#### JPEG2000 压缩\n\n类似地，使用 JPEG2000 编码器以 150 到 250 的比率（步长为 25）对图像引入\
  \ JPEG2000 压缩，从而生成其 MPRI。这种压缩类型检测振铃伪影，如公式 4-18 所示：\n\n![$$ {M}_{rj}= JPEG2K\\left(I,{N}_j\\\
  right) $$](img/612428_1_En_4_Chapter_TeX_Equ19.png)\n\n(4-18)\n\n其中：\n\n*   *M*[*rj*]：在\
  \ JPEG2K 压缩的第 *j* 个程度（0 ≤ *j* ≤ 5）下压缩的 MPRI\n*   *r*：振铃伪影\n*   *JPEG*2*K*：JPEG2K\
  \ 编码器\n*   *N*[*j*]：压缩比\n\n#### 高斯模糊\n\n类似地，对灰度图像添加高斯模糊，退化程度从 0.5 到 2.5，步长为 0.5，以检测模糊伪影。如公式\
  \ 4-19 所示：\n\n![$$ {M}_{bj}={GK}_j\\ast I $$](img/612428_1_En_4_Chapter_TeX_Equ20.png)\n\
  \n(4-19)\n\n其中：\n\n*   *M*[*bj*]：在第 *j* 个模糊程度（0 ≤ *j* ≤ 5）下模糊的 MPRI\n*   *b*：模糊伪影\n\
  *   *GK*[*j*]：高斯核\n\n\n\n#### 白噪声\n\n最后，添加的失真类型是白噪声，其强度范围从 0.3 到 0.7，步长为 0.1。这用于检测加噪，并由公式\
  \ 4-20 给出：\n\n![$$ {M}_{nj}=I+N\\left(0,{V}_j\\right) $$](img/612428_1_En_4_Chapter_TeX_Equ21.png)\n\
  \n(4-20)\n\n其中：\n\n*   *M*[*nj*]：在第*j*级白噪声（0 ≤ *j* ≤ 5）下的含噪 MPRI\n*   *n*：加噪伪影\n\
  *   *N*(0, *V*[*j*])：生成均值为 0、方差为*V*[*j*]的正态分布随机值\n\n### 4.3.5 相似度指数\n\n在应用不同类型的压缩和失真后，会生成一组二十个\
  \ MPRI。从每个 MPRI 中再次提取 LBP 特征，然后将结果数组存储在一个名为`mapPRI`的数组中。如图 4-15 [23, 24]所示。\n\n\
