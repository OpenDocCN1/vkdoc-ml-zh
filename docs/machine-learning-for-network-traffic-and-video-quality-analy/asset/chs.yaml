  图表展示了包含类别分配器和 CSV 加载器的训练测试分割器。该分割器分为 SMO 和 MLP 两部分，每部分都带有一个类别性能评估器。每个性能评估器都包含文本查看器。


  图 2-9


  Pradhan 提出的 SVM 和 ANN 模型工作流程 [[53]](#612428_1_En_2_Chapter.xhtml#CR53)


  在 Shafiq 等人的研究中，他们分析了一系列旨在对网络周围应用类型进行分类的机器学习技术的性能 [[54]](#612428_1_En_2_Chapter.xhtml#CR54)。该研究对
  SVM、C4.5 决策树、朴素贝叶斯和贝叶斯网络进行了比较分析。首先使用 Wireshark 捕获一分钟间隔内的网络流量。研究的应用包括 DNS、WWW、FTP、P2P
  和 Telnet，并使用 Netmate 工具总共提取了二十三个特征。实验中表现最佳的是 C4.5 算法，其分类准确率达到 79%，并且训练时间最短。


  在 Dixit 等人的研究中 [[55]](#612428_1_En_2_Chapter.xhtml#CR55)，他们对常见的互联网流量形式进行了分析，主要涉及
  K 近邻（KNN）和朴素贝叶斯算法，并结合了诸如数据包到达间隔时间、生存时间（TTL）和数据包计数等统计网络指标。该研究侧重于保护用户机密性，在使用 70:30
  的训练-测试分割比例下，KNN 获得了 85.3% 的精确率，而朴素贝叶斯达到了 54.2%。KNN 在邻居数为 8 时取得了最高准确率。该方法被推广用于基于具有相似特征的标准对网络属性进行分类。


  在 Guezzaz 等人的研究中 [[56]](#612428_1_En_2_Chapter.xhtml#CR56)，他们使用三层架构对网络监控背景下的 MLP
  分类器进行了分析。他们概述了一种在确定最优权重方面非常高效的训练方法，并采用了一种检测技术来验证模型。大多数分类器的性能会受到大数据集的不利影响，从而影响排序过程的效率。然而，MLP
  展示了其作为感知分析层的能力，可用于网络监控系统以增强数据传输的可靠性。类似地，在 Abassi 等人的研究 [[8]](#612428_1_En_2_Chapter.xhtml#CR8)
  中，使用了深度学习（DL）技术来构建网络流量管理模型。该研究包括了针对时间序列数据设计的 MLP、CNN 和 RNN 等算法。鉴于深度学习方法历来侧重于利用基于端口、基于数据包和基于流的指标，作者们提出并描述了更新的流量分类技术。


  考虑到企业数据的隐私性，Bayat 等人 [[57]](#612428_1_En_2_Chapter.xhtml#CR57) 融合了一系列深度学习技术，创建了一个复杂的分类模型，用于分析数据包流和负载信息，以及数据包到达之间的时间差。该过程旨在解决传输层安全（TLS）握手期间的服务器名称指示（SNI）分类问题，目标是在不检查加密数据包内容的情况下识别应用。该过程首先收集了约
  500,000 个指向不同网站的 HTTP 请求，然后通过 Wireshark 和 SSL 过滤器属性存储数据包捕获文件。提取了诸如累积字节数和到达时间等特征来准备训练数据集。使用的主要算法包括
  CNN 和门控循环单元（GRU），它们通过允许序列长度变化来扩展前馈神经网络。设计了一个隐藏状态，在每个先前状态之后激活，从而产生了算法的自适应特性。对于 Google
  Chrome 数据，实验使用 CNN-RNN 组合模型达到了 82.3% 的准确率。所使用的架构如图 2-10 所示。


  ![](img/612428_1_En_2_Fig10_HTML.jpg)


  流程图展示了安全的 HTTPS 训练数据集如何通过数据预处理和分类模型进行处理，该模型还有另一个输入为可疑的 HTTPS 流量，最终输出预测的服务。


  图 2-10


  Bayat 等人提出的 HTTPS 识别框架工作流程 [[57]](#612428_1_En_2_Chapter.xhtml#CR57)


  为了提供一个快速且自动化的多媒体流量管理框架，Wu 等人提出了一种 CNN 模型，该模型通过渐进式学习实现自我改进 [[58]](#612428_1_En_2_Chapter.xhtml#CR58)。该实验旨在通过深度学习，根据服务质量（QoS）对网络流量进行即时分类。配备了滑动窗口模型后，基于数据流提取参数，然后绘制出每个流的三维表示。随后对
  CNN 模型进行定制，以匹配所选特征的变化。此外，架构中还加入了知识蒸馏和偏差校正等技术，以支持自学习特性，而无需停止模型训练过程来适应新模式。与先前的研究相比，这导致了分类速度的提升，并且尽管增加了新的网络流量类别，内存使用量仍减少了
  50%。




  关于使用深度学习进行网络流量分类，在文献[[59]](#612428_1_En_2_Chapter.xhtml#CR59)中，作者开发了朴素贝叶斯和 C4.5
  决策树方法。该论文强调了在流媒体、游戏和 P2P 应用中使用机器学习的重要性，因为这些场景下无法依赖基于端口的协议识别方法。传统方法无法处理加密流量，这进一步增加了问题的复杂性，因此研究转向使用统计方法或机器学习方法。在实施特征选择步骤并结合多层神经网络后，实验的分类准确率达到了约
  95%。算法在十个不同的数据类别上运行，每个类别均源自包含 249 个网络流量参数的广泛 TCP 双向流。由于某些应用（如游戏）的可用样本数量有限，这些数据被归类为八种广泛的流量类型进行分析。本研究中使用的深度学习框架，即谷歌的
  TensorFlow，在样本量从 0 到 10,000 的范围内达到了 98.5%的稳定准确率，而朴素贝叶斯和随机森林在准确率方面均有所不足，仅在小样本量下表现良好。因此，深度学习算法展现出了稳定性和可靠性。


  Labayen 等人引入了一种混合系统，旨在通过分析流量趋势，将网络流量分类为不同的网络状态，例如在线浏览、流媒体和空闲行为[[60]](#612428_1_En_2_Chapter.xhtml#CR60)。首先使用
  Tshark 将数据捕获为 pcap 和 CSV 格式，然后预先标记为不同的类别，包括 p2p、视频、网页、批量、聊天、电子邮件和 voip。所提出的系统（如图
  2-11 所示）以包含从 IP 和 TCP/UDP 头部提取的字段的连续数据包流作为输入，然后将其预处理为合适的特征集合。系统形成了一个三层分层窗口数据结构，数据在其中被划分为时间窗口。这消除了特征之间的任何依赖性。接下来，执行一个三层分类过程，以获取与所生成的分类窗口相关联的用户活动。所使用的窗口被称为分类窗口、流窗口和行为窗口。该研究使用分层多层结构实现了
  97%的全局准确率，其中嵌入前两层的 K-means 算法和最后一层的随机森林算法取得了最佳性能。


  ![](img/612428_1_En_2_Fig11_HTML.jpg)


  该流程图描述了如何通过流量重构、窗口过滤、特征提取和分类来处理单个实时捕获的轨迹，以获取用户活动。


