  \n### 7.3.6 创建 WebSocket 服务器\n\nWebSocket 服务器托管在端口 8081 上，使用前述相同原理。如代码清单 7-15 所示。\n\
  \n```\n// 在端口 8081 上托管服务器连接。\nconst server = http.createServer(); // 创建一个 HTTP 服务器实例。\n\
  server.listen(8081); // 监听端口 8081 上的传入 HTTP 请求。\nconsole.log(\"Server started on\
