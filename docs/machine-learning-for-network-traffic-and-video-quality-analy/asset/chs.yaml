  客户端的主要功能是首先连接到指定端口上的服务器，然后打开连接以允许消息流动。它也可以在必要时发送消息，但由于在此应用中服务器负责大部分计算，客户端主要处理来自服务器的消息接收。此部分涉及的功能分解如下：\n\
  \n1.  获取活动标签页的 URL 并将其存储在一个变量中。\n\n2.  初始化一个 `time` 变量，作为图表的时间计数器。\n\n3.  创建常量以动态区分三个图表。\n\
