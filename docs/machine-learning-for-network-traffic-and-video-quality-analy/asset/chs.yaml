  的一些用户包括 Docker、Soundcloud、Showmax 和 Amadeus。与前述产品一样，流量预测服务需要作为像 Locust 这样的定制模块添加。


  ### 2.2.7 商业解决方案与开源解决方案


  组织在决定采用开源还是商业 NTMA 解决方案时，必须仔细权衡。每种方案都有其自身的优缺点，决策应根据个体需求、财务限制和资源可用性来做出。商业解决方案通常会产生财务成本，尽管它们提供广泛的帮助、丰富的功能和可靠的性能。通常，这些系统与拥有复杂网络架构、需要广泛功能、可扩展性和专家支持的大型公司高度兼容。诸如
  SolarWinds NetFlow Traffic Analyzer 和 Paessler PRTG Network Monitor 等商业解决方案提供了易于使用的界面、专门的客户支持和全面的功能，使其对有大量监控需求的企业具有吸引力
  [43]。相比之下，像 Wireshark 和 Prometheus 这样的开源替代方案，由于其软件免费，在灵活性、可定制性和成本效益方面具有优势。规模较小的企业、教育机构以及拥有设置和维护这些技术所需技能的技术娴熟的个人更倾向于选择它们。开源解决方案促进了协作社区的形成，使用户能够积极参与其发展，并根据特定需求对其进行定制。




  ### 2.2.8 挑战与考量


  实施 NTMA 解决方案，无论是商业版还是开源版，都可能遇到一系列挫折，涵盖从数据收集到数据隐私的各个方面。其中一些困难详述如下 [44, 45, 46]：


  *   **数据量**：使用 NTMA 工具会产生大量数据，类似于大数据立方体，需要强大的存储和处理能力。组织必须适当考虑制定数据保留规定和实施数据最小化方法。


  *   **加密流量**：随着加密流量（即 HTTPS）的日益普及，企业面临着在安全需求与隐私关切之间寻找微妙平衡的多方面任务。


  *   **网络可扩展性**：对于希望有效满足监控需求的企业来说，持续扩展和适应的能力是一个关键考量。当网络进行扩展或遇到更高负载水平时，这一点变得至关重要。


  *   **隐私与合规**：组织需要遵守法规并建立旨在保护用户信息的协议，同时也要遵守数据保护法律。


  *   **与现有基础设施集成**：高效的监控最终意味着与各种设备、协议和服务，以及现有和新的网络基础设施的兼容性。


  *   **告警与报告**：NTMA 的成功实施需要适当的告警系统和生成信息丰富的报告。企业必须决定合适的告警阈值，并确保其报告流程能提供及时且相关的信息。


  *   **资源分配**：在 CPU 和内存利用率方面，执行实时 NTMA 的系统需要提供最佳性能，以产生最佳结果并提供可靠的性能。


  *   **培训与专业知识**：建议组织为其人员分配培训机会的资源。


  然而，主要的挑战在于网络流量的不稳定性，这使得它在机器学习方面勉强逃脱了高精度预测和分类算法的掌控。本书在进展较为缓慢的领域探讨了这一困境。通过预测性特征，诸如预测网络相关问题等能力得以解锁，从而能够识别某些行为。因此，近年来，焦点一直放在对网络活动的主动洞察、预测异常以及自动解决已检测到的问题上。


  ## 2.3 NTMA 的最新研究综述


  根据 2022 年 1 月的最新数据，全球互联网用户数量达到了 49.5 亿人的最高点，约占全球总人口的 62.5% [47]。这一数据表明用户数量大幅激增，在一年内增加了约
  1.92 亿用户。COVID-19 疫情促使企业大规模转向使用基于网络的应用程序和服务。这一转变给有效管理与服务质量（QoS）、体验质量（QoE）、可扩展性和性能相关的困难带来了额外的复杂性
  [48]。根据思科的调查结果，2021 年 IP 视频流量占 IP 总流量的很大一部分，约为 82% [49]。预计这一显著的增长趋势将在可预见的未来持续下去。


  ### 2.3.1 NTMA 的背景


  网络流量监控与分析（NTMA）的概念涉及检查与数据消息流相关的指标，以检测有意义且可利用的行为趋势，从而实现对网络状态和功能的实时评估。作为背景，如果网页应用的加载时间不超过两秒，用户访问该应用的可能性会显著增加
  53%，这在浏览器扩展中更为知名，它们只需点击几下即可提供更快捷方便的访问方式 [50]。因此，跟踪和评估网络流量指标是服务提供商和网络管理员的一项重要职责。这种做法对于有效管理带宽需求和减轻网络攻击带来的风险至关重要。


  ### 2.3.2 机器学习的兴起


  最近的研究围绕使用基于机器学习的 NTMA 方法展开，特别是在那些侧重于基于端口和基于负载的方法论中，这些方法通过准确性评估来衡量性能。机器学习和 NTMA 的结合带来了对网络流量的系统性检查，从而能够对模式、特征和参数做出有依据的预测。这在评估网络的服务质量（QoS）以及评估其准确性和精确度水平，以及误报率和漏报率时至关重要。随着机器学习的出现，预测和准确性检测都变得更加容易
  [51]。相应地，云平台使用量和灵活性的激增极大地放大了存储和计算需求。根据 Medium [52]的数据，全球绝大多数企业（约 81%）已经实施了多云策略。在此背景下，诸如决策树（DT）和多层感知器（MLP）算法等高级分析技术可以集成到云计算平台中。通过利用这些平台，可以收集和分析实时网络数据，从而生成信息丰富且具有预测性的结果。这消除了对本地处理能力的需求。将机器学习融入分析在将数据分类为监督学习或非监督学习集方面发挥了关键作用。


  目前，在分析方面，网络流量既可以分类也可以预测。前者可以关联到识别网络流量性质的不同层次，从用户正在执行的活动类型，到更高级、计算密集型的分类，例如识别正在使用的确切应用程序。然而，诸如带宽、延迟、抖动和网站响应时间等网络参数可以通过回归算法进行处理，这些算法旨在预测给定时间点的这些变量
  [2]。接下来将介绍研究人员在这两个领域所开展相关工作的最新研究综述。




  ### 2.3.3 用于网络流量分类的机器学习算法


  近年来，多位研究人员积极致力于将机器学习算法应用于网络流量管理与分析（NTMA），旨在寻找能提供最佳准确率的方法。在文献[[53]](#612428_1_En_2_Chapter.xhtml#CR53)中，Pradhan
  为了对网络流量进行分类，旨在通过使用多个流特征作为输入变量来提升服务质量（QoS）。数据准备阶段使用 Perl 脚本结合 Wireshark 进行，生成了包含十三个属性的集合。分类任务分配的标签为
  FTP、WWW 和 P2P。训练的模型包括人工神经网络（ANN）、支持向量机（SVM）、多层感知机（MLP）和序列最小优化（SMO），实验使用 Weka 框架进行，如图
  2-9 所示。提取的特征包括数据包到达时间、数据包长度、协议和目的端口号等。仿真模型以逗号分隔值（CSV）文件格式作为输入，结果发现，当两种算法采用不同的训练百分比时，ANN
  的准确率达到 85.443%，而 SVM 的精确率达到 91.1392%。研究得出结论，在分类网络流量时，SVM 的性能远优于 ANN。


