  Jagadessan 等人旨在利用软件定义网络（SDN）保障实时闭路电视摄像机（CCTV）画面的充分传输，该网络用于将源端捕获的数据传输至最终用户的显示器 [79]。将剑桥大学于
  2010 年开发的 BAT 算法与位于控制交换机中的 AI 模块相结合，旨在对数据包进行优先级排序。实验采用物联网云作为数据库。结果表明，与未使用 SDN 的网络相比，该网络在抖动特性方面的性能提升了
  70%。


  Thomos 等人对近年来利用机器学习技术提升多媒体内容质量的最新进展进行了全面分析 [80]。该论文深入探讨了机器学习在多个领域的应用，例如 AR/VR/XR
  和 360 度视频、视频流系统、缓存以及 QoE 评估。例如，在自动驾驶汽车中，智能汽车需要以每秒 750 MB 的速度、超低延迟传输视频素材。为实现这一目标，基于先前研究创建了机器学习模型。从另一个角度来看，使用
  SVM 回归器将多个特征合并并处理成最终评分。此外，还探索了 CNN 用于整合多模态输入，并通过融入 HVS 的概念（如显著性）来增强图像质量评估（IQA）。显著性特征并非以图谱形式，而是以分层方式与
  IQA 属性相结合，随着网络深度的增加，后者得以逐步改善 [81]。反过来，这些组合特征被用于估计客观图像质量。这类模型还能实现资源的有效管理、数据预取、缓存服务以及安全措施的改进。


  Fu 等人提出了一种顺序强化学习（RL）方法，该方法配备动态分块机制，以应对 360 度视频流搜索空间的高维问题 [82]。典型的基于分块的视频流布局如图 3-12
  所示。与此同时，Kan 等人通过概率框架对前述分块方法进行了升级，为每个分块分配比特率 [83]。通过整合来自 RL 代理的反馈，该模型得到进一步加强，提升了该方法的有效性。这项研究在最终用户的
  QoE 方面，显著改善了 360 度视频流的体验。


