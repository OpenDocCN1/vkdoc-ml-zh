  \n*   “test_ind_scaled”文件：包含用于预测的测试数据。\n\n*   “model”文件：包含使用 epsilon-SVR 模型训练好的\
  \ SVM 模型，能够进行回归预测。\n\n*   “output.txt”文件：将包含 `predict()` 方法生成的输出。\n\n因此，`predict()`\
  \ 方法的功能如下，如清单 6-40 所示：\n\n1.  从 SVM 模型中获取类型和类别数量。\n\n2.  检查是否启用了概率预测。如果启用，则根据 SVM\
  \ 类型初始化 `prob_estimates`。\n\n3.  处理输入数据：\n    1.  逐行读取输入数据。\n\n    2.  对每一行进行分词，提取目标值和属性-值对。\n\
  \n    3.  用属性索引-值对填充一个 svm_node 数组。\n\n4.  进行预测：\n    1.  如果启用了概率预测且 SVM 类型支持，则使用\
  \ `svm.svm_predict_probability()` 预测概率，并将结果写入输出流。\n\n    2.  如果未启用概率预测或 SVM 类型不支持，则使用\
  \ `svm.svm_predict()` 进行标准 SVM 预测。\n\n    3.  根据存储在变量 `p` 中的预测值，对质量等级进行分类，并将其写入输出流。\n\
  \n```\n/** 使用 SVM 模型预测给定输入数据的值。\n* @param input              用于读取输入数据的 BufferedReader。\n\
  * @param output             用于写入输出数据的 DataOutputStream。\n* @param model        \
  \      用于预测的 SVM 模型。\n* @param predict_probability 指示是否预测概率的标志。\n* @return     \
  \              预测值。\n* @throws IOException       如果读取或写入数据时发生错误。\n*/\nprivate double\
  \ predict(BufferedReader input, DataOutputStream output, svm_model model, int predict_probability)\
  \ throws IOException {\n// 从 SVM 模型中获取类型和类别数量。\nint svm_type = svm.svm_get_svm_type(model);\n\
  int nr_class = svm.svm_get_nr_class(model);\ndouble[] prob_estimates = null;\n//\
  \ 如果适用，输出测试数据的概率模型信息。\nif (predict_probability == 1) {\nif (svm_type == svm_parameter.EPSILON_SVR\
  \ || svm_type == svm_parameter.NU_SVR) {\n// 打印回归的概率模型信息。\nSystem.out.print(\"测试数据的概率模型：目标值\
  \ = 预测值 + z，\\nz：拉普拉斯分布 e^(-|z|/sigma)/(2sigma)，sigma=\"\n+ svm.svm_get_svr_probability(model));\n\
  } else {\n// 打印分类的概率模型信息。\nint[] labels = new int[nr_class];\nsvm.svm_get_labels(model,\
  \ labels);\nprob_estimates = new double[nr_class];\noutput.writeBytes(\"标签\");\n\
  for (int j = 0; j < nr_class; j++) {\noutput.writeBytes(\" \" + labels[j]);\n}\n\
  output.writeBytes(\"\\n\");\n}\n}\n// 逐行处理输入数据。\nwhile (true) {\nString line = input.readLine();\n\
  if (line == null) break;\nStringTokenizer st = new StringTokenizer(line, \" \\t\\\
  n\\r\\f:\");\n// 从输入中提取目标值。\nString token = st.nextToken();\ntry {\n// 尝试将目标值解析为\
  \ double。\nDouble.parseDouble(token);\n} catch (NumberFormatException e) {\n// 如果解析失败，抛出异常。\n\
  throw new RuntimeException(\"输入文件中存在错误格式的数值：\" + token);\n}\nint m = st.countTokens()\
  \ / 2;\nsvm_node[] x = new svm_node[m];\nfor (int j = 0; j < m; j++) {\nx[j] = new\
  \ svm_node();\n// 从输入中提取属性索引。\ntoken = st.nextToken();\nx[j].index = atoi(token);\n\
  // 从输入中提取属性值。\ntoken = st.nextToken();\nx[j].value = atof(token);\n}\n// 进行预测。\n\
  double p;\nif (predict_probability == 1 && (svm_type == svm_parameter.EPSILON_SVR\
  \ || svm_type == svm_parameter.NU_SVR)) {\n// 使用概率预测进行回归。\np = svm.svm_predict_probability(model,\
  \ x, prob_estimates);\noutput.writeBytes(p + \"\\n\");\n} else {\n// 使用标准预测。\np\
  \ = svm.svm_predict(model, x);\noutput.writeBytes(p + \"\\n\");\n}\n// 根据预测值对质量等级进行分类。\n\
  if (p >= 0 && p < 20) {\noutput.writeBytes(p + \" 质量等级：差 \\n\");\nSystem.out.println(\"\
  \\nMOS: \" + p + \" \\n 评级：差\");\n} else if (p >= 20 && p < 40) {\noutput.writeBytes(p\
  \ + \" 质量等级：较差 \\n\");\nSystem.out.println(\"\\nMOS: \" + p + \" \\n 评级：较差\");\n\
  } else if (p >= 40 && p < 60) {\noutput.writeBytes(p + \" 质量等级：一般 \\n\");\nSystem.out.println(\"\
  \\nMOS: \" + p + \" \\n 评级：一般\");\n} else if (p >= 60 && p < 80) {\noutput.writeBytes(p\
  \ + \" 质量等级：良好 \\n\");\nSystem.out.println(\"\\nMOS: \" + p + \" \\n 评级：良好\");\n\
