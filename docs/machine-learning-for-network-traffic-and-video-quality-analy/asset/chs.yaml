  }\nSystem.out.println(\"-----------------------------------------------\");\nreturn\
  \ p;\n}\n清单 6-40\n预测 MOS\n```\n\n此外，`predict()` 函数使用的 `atof()` 和 `atoi()` 方法详见清单\
