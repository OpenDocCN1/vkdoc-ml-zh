  ); // 记录一条消息，指示服务器正在等待连接。\n// 创建一个 WebSocket 服务器实例，并将其附加到先前创建的 HTTP 服务器上。\nconst\
  \ wsServer = new WebSocketServer({\nhttpServer: server,\n});\n代码清单 7-15\n创建 WebSocket\
  \ 服务器\n```\n\n### 7.3.7 监听客户端连接\n\n在本节中，接受来自请求客户端的连接，然后等待接收来自该客户端的消息。在客户端，当点击“监控与分析”按钮时，“窗口大小”和“预测时间”变量会被发送到服务器。此过程与截图过程同时发生。现在，这些消息可能以不同的顺序到达服务器端。为了能够区分它们，在客户端为每条消息分配了一个“类型”。在客户端声明的五种消息类型包括：\n\
  \n*   `metadata`：表示接收到预期的数据块数量。\n\n*   `sitedata`：表示正在访问的网站 URL。\n\n*   `windowSize`：表示“窗口大小”变量。\n\
  \n*   `predictionTime`：表示“预测时间”变量。\n\n*   `binary`：表示客户端截图并发送的图像数据块。\n\n因此，本节详细阐述了用于在服务器端执行\
  \ NTMA 和 VQA 的代码。\n\n#### 添加 VQA 代码块\n\n在接收并重建完整的 PNG 图像后触发 servlet 的代码块如代码清单 7-16\
  \ 所示。它还会调用 `monitorNetworkTraffic()` 方法，该方法将在下一节中解释。\n\n\n```javascript\n// 通过 WebSocket\
  \ 服务器监听客户端的连接请求。\nwsServer.on(\"request\", function (request) {\n// 接受来自客户端的连接。\n\
  connection = request.accept(null, request.origin);\n// 使用 \"message\" 关键字接收来自客户端的传入消息。\n\
  connection.on(\"message\", function (message) {\n// 检查接收到的消息类型是否为 UTF-8 格式。\nif\
  \ (message.type === \"utf8\") {\n// 从接收到的消息中解析 UTF-8 数据。\nconst messageReceived\
  \ = JSON.parse(message.utf8Data);\n// 检查接收到的消息类型（元数据或站点数据）。\nif (messageReceived.type\
  \ === 'metadata') {\n// 使用接收到的元数据更新 totalChunks 变量。\ntotalChunks = messageReceived.totalChunks;\n\
  // 记录接收到的元数据信息。\nconsole.log('收到元数据：预计', totalChunks, '个数据块。');\n} else if (messageReceived.type\
  \ === 'sitedata') {\n// 使用接收到的值更新 siteName 变量。\nsiteName = messageReceived.value;\n\
  // 记录接收到的站点数据信息。\nconsole.log('收到站点数据：', siteName, '是链接。');\n// 检查网站链接以设置相应的裁剪坐标。\n\
  // 对于 YouTube 和 Twitch，坐标已预设。\n// 对于其他网站，则截取整个页面作为 VQA 模块的截图。\nif (siteName.includes(\"\
  youtube\")){\n// 针对 https://www.youtube.com/ 上的视频\ncropLeft = 98;\ncropTop = 80;\n\
  cropWidth = 1280;\ncropHeight = 720;\n} else if (siteName.includes(\"twitch\"))\
  \ {\n// 针对 https://www.twitch.tv/ 上的视频\ncropLeft = 239;\ncropTop = 52;\ncropWidth\
  \ = 1340;\ncropHeight = 752;\n} else {\n// 针对任何其他网站上的视频（不进行裁剪）。\ncropLeft = 0;\n\
  cropTop = 0;\ncropWidth = 1920;\ncropHeight = 953;\n}\n} else if (messageReceived.type\
  \ === 'windowSize') {\n// 检查接收到的消息类型是否为 \"windowSize\"。\nsampleSize = messageReceived.value;\
  \ // 获取窗口大小参数。\n} else if (messageReceived.type === 'predictionTime') {\n// 检查接收到的消息类型是否为\
  \ \"predictionTime\"。\npredTime = messageReceived.value; // 获取预测时间参数。\n// 窗口大小和预测时间值均已获取。\n\
  // 调用方法触发 NTMA 过程。\nmonitorNetworkTraffic();\n}\n} else if (message.type === \"\
  binary\") {\n// 如果接收到的消息是二进制类型。\n// 增加已接收数据块的计数器。\nreceivedChunks++;\n// 处理接收到的二进制数据。\n\
  const arrayBuffer = message.binaryData;\n// 将 arrayBuffer 转换为 Buffer。\nconst buffer\
  \ = Buffer.from(arrayBuffer);\n// 将数据块追加到一个文件中（例如，screenshot-1.png）。\n// 对于一张截图，其每个数据块都会被追加到同一个文件中，以生成最终的截图。\n\
  fs.appendFileSync(\"C://Users//Lavesh//Integrated//Screenshots//screenshot-\" +\
  \ screenshotCount + \".png\", buffer);\n// 记录消息以指示已接收数据块的索引。\nconsole.log('已接收数据块：',\
  \ receivedChunks, '/', totalChunks);\n// 如果所有数据块都已接收完毕，则完成并保存图像文件。\nif (receivedChunks\
  \ === totalChunks) {\n// 这表示已从客户端接收到完整的截图。\nconsole.log(\"所有数据块已接收。截图已保存。\");\n\
  // 指定裁剪前后的文件路径。\nvar pathBeforeCropping = \"C://Users//Lavesh//Integrated//Screenshots//screenshot-\"\
  \ + screenshotCount + \".png\";\nvar pathAfterCropping = \"C://Users//Lavesh//Integrated//ScreenshotsCropped//screenshot-\"\
  \ + screenshotCount + \".png\";\n// 使用 \"Sharp\" 库根据预设坐标裁剪图像。\nsharp(pathBeforeCropping)\n\
  .extract({ left: cropLeft, top: cropTop, width: cropWidth, height: cropHeight })\n\
  .toFile(pathAfterCropping, (err, info) => {\nif (err) {\n// 记录错误消息以指示无法执行裁剪。\nconsole.error('裁剪图像时出错：',\
  \ err);\n// 创建一条错误消息以发送给客户端。\nconst errorMessage = {\nerror: \"裁剪图像时出错。\"\n};\n\
  // 将错误消息封装成 JSON 格式的字符串，并通过 WebSocket 连接发送。\nconnection.send(JSON.stringify(errorMessage));\n\
  } else {\n// 记录消息以指示图像已成功裁剪。\nconsole.log('图像裁剪成功：', info);\n// 此时，包含 VQA 模块所需源的裁剪图像已可用。\n\
  // 记录消息，指示正在向 Java HTTP Apache 服务器（servlet）发出请求以返回 MOS 分数。\nconsole.log(\"正在向 servlet\
  \ 发出请求。\")\n// 使用 \"Axios\" 库向 servlet 发出 HTTP POST 请求。\naxios.post(\"http://localhost:8080/VQA/Score\"\
  , null, {\n// 指定 servlet 所需的参数，此处为截图计数。\nparams: {\nnumber: screenshotCount,\n},\n\
  })\n.then((response) => {\n// 处理来自 servlet 的响应。\n// 从 JSON 响应中检索 MOS 分数。\nmosScore\
  \ = response.data.score;\nmosScore = parseFloat(mosScore);\n// 记录消息以指示获取到的 MOS 分数。\n\
  console.log(\"从 servlet 获取的分数：\" + mosScore);\n// 处理超出优秀/差质量范围的异常值。\nif (mosScore\
  \ > 100) {\nmosScore = 100;\n} else if (mosScore < 0) {\nmosScore = 0;\n}\n// 根据\
  \ MOS 分数确定直播质量等级。\nif (mosScore >= 90) {\nliveQualityRating = \"优秀\";\ncountExcellent\
  \ = countExcellent + 1;\n} else if (mosScore >= 80) {\nliveQualityRating = \"良好\"\
  ;\ncountGreat = countGreat + 1;\n} else if (mosScore >= 65) {\nliveQualityRating\
  \ = \"好\";\ncountGood = countGood + 1;\n} else if (mosScore >= 40) {\nliveQualityRating\
  \ = \"一般\";\ncountFair = countFair + 1;\n} else if (mosScore >= 20) {\nliveQualityRating\
  \ = \"差\";\ncountPoor = countPoor + 1;\n} else {\nliveQualityRating = \"很差\";\n\
  countBad = countBad + 1;\n}\n// 记录消息以指示直播质量等级。\nconsole.log(\"视频质量等级：\" + liveQualityRating);\n\
  // 创建一个数组来存储每个质量等级的计数。\nvar countQuality = [countExcellent, countGreat, countGood,\
  \ countFair, countPoor, countBad];\n// 初始化变量以查找最大计数及其索引。\nvar maxCount = countQuality[0];\
  \ // 假设第一个是最大值。\nvar maxIndex = 0;\n// 遍历 countQuality 数组以查找最大计数及其索引。\nfor (var\
  \ i = 1; i < countQuality.length; i++) {\nif (countQuality[i] > maxCount) {\n//\
  \ 更新最大计数及其索引。\nmaxCount = countQuality[i];\nmaxIndex = i;\n}\n}\n// 创建一个表示质量等级的标签数组。\n\
  var labels = ['优秀', '良好', '好', '一般', '差', '很差'];\n// 根据最大索引确定主导质量等级。\nvar dominantQualityRating\
  \ = labels[maxIndex];\n// 将主导质量等级及其计数记录到控制台。\nconsole.log('计数最高的标签是：', dominantQualityRating);\n\
  console.log('最高计数值是：', maxCount);\n// 计算并记录平均 MOS 分数。\nsumMosScore = sumMosScore\
  \ + mosScore;\naverageMosScore = sumMosScore / screenshotCount;\nconsole.log(\"\
  平均 MOS 分数：\" + averageMosScore);\n// 向客户端发送消息以请求另一张截图。\n// 创建一个常量变量，保存测量/计算出的分数和等级。\n\
  const screenshotUpdate = {\nscreenshot: \"sendScreenshot\",\nvideoScore: mosScore,\n\
  averageVideoScore: averageMosScore,\nvideoRating: liveQualityRating,\ndominantRating:\
  \ dominantQualityRating\n};\n// 将指标消息封装成 JSON 格式的字符串，并通过 WebSocket 连接发送。\nconnection.send(JSON.stringify(screenshotUpdate));\n\
  // 增加截图计数以移动到下一张。\nscreenshotCount = screenshotCount + 1;\n})\n.catch((error) =>\
  \ {\n// 记录错误消息以指示无法将截图发送到 servlet。\nconsole.error('向 servlet 发送截图时出错：', error);\n\
  // 创建一条错误消息以发送给客户端。\nconst errorMessage = {\nerror: \"向 servlet 发送截图时出错。\"\n};\n\
  // 将错误消息封装成 JSON 格式的字符串，并通过 WebSocket 连接发送。\nconnection.send(JSON.stringify(errorMessage));\n\
  });\n}\n});\n// 将已接收数据块的数量设置为零，作为下一张截图的复位。\nreceivedChunks = 0;\n}\n}\n});\n// 使用\
  \ \"close\" 关键字处理客户端断开连接。\nconnection.on(\"close\", function (reasonCode, description)\
  \ {\n// 记录消息以指示客户端已断开连接。\nconsole.log(\"客户端已断开连接。\");\n// 当客户端断开连接时停止监控过程。\nclearInterval(monitoringInterval);\n\
  });\n});\n清单 7-16\n添加 VQA 模块\n```\n\n\n#### 添加 NTMA 模块\n\nNTMA 流程的代码封装在 `monitorNetworkTraffic()`\
  \ 方法中，该方法在成功接收到来自客户端的两个输入参数时被调用。此方法如代码清单 7-17 所示。\n\n```\n// 创建 NTMA 流程的方法。\nfunction\
  \ monitorNetworkTraffic() {\n// 初始化一个计数器，用于判断是否已收集到足够的网络流量数据。\nvar counter = 0;\n\
  // 初始化一个数组，用于存储延迟项。\nvar latencyArray = [];\n// 初始化一个计数器，用于判断是否已收集到足够的延迟值。\nvar\
  \ counterLatency = 0;\n// 使用 setInterval 方法创建一个每秒执行一次的函数。\n// 该方法接收一个函数和时间间隔（毫秒）作为输入。\n\
  monitoringInterval = setInterval(function() {\n// 使用内置的 inetLatency() 方法读取延迟值。\n\
  si.inetLatency().then(data => {\n// 检查是否无法读取延迟，这表示没有网络连接。\nif (data == null) {\n\
  // 创建一条要发送给客户端的错误消息。\nconst errorMessage = {\nerror: \"No Connection\"\n};\n// 将错误消息封装成\
  \ JSON 格式的字符串，并通过 WebSocket 连接发送。\nconnection.send(JSON.stringify(errorMessage));\n\
  // 停止监控进程。\nclearInterval(monitoringInterval);\n// 如果连接正常。\n} else {\n// 使用 counterLatency\
  \ 计数器将延迟值填充到 latencyArray 数组中。\nlatencyArray[counterLatency] = data;\n// 指定延迟等于从\
  \ Wi-Fi 接口读取的数据。\nlatency = data;\n}\n// 当总共记录了 60 个值时，表示已收集了一分钟的流量数据。\nif (counterLatency\
  \ == 59) {\n// 调用基于记录的延迟值计算 QoS 的方法。\nscoreQoS = calculateQOS(latencyArray);\n}\n\
  // 递增 counterLatency 对象。\ncounterLatency++;\n})\n// 从 Wi-Fi 接口获取网络数据。\nsi.networkStats().then(data\
  \ => {\n// 计算每秒接收的数据包数量，相当于下载速度。\nvar RX = Math.round((((data[0].rx_sec)/1000) +\
  \ Number.EPSILON) * 100) / 100;\n// 计算每秒发送的数据包数量，相当于上传速度。\nvar TX = Math.round((((data[0].tx_sec)/1000)\
  \ + Number.EPSILON) * 100) / 100;\n// 使用 push() 方法将新读取的流量数据添加到预加载的数组中。\n// 预加载的数组包含按时间序列存储的参数。\n\
  // 这可能会根据设备活动提高算法的性能。\ndownloadArray.push(RX); // 将下载速度值添加到其预加载数组中。\nuploadArray.push(TX);\
  \ // 将上传速度值添加到其预加载数组中。\n// 将值记录到控制台。\nconsole.log(\"Download Speed: \" + RX + \"\
  \ KB/s\");\nconsole.log(\"Upload Speed: \" + TX + \" KB/s\");\nconsole.log(\"-----------------------------\"\
  );\n// 当总共记录了 60 个值时，停止监控进程并触发机器学习算法。\nif (counter == 60) {\n// 使用 clearInterval()\
  \ 方法停止监控进程。\nclearInterval(monitoringInterval);\n// 调用预测方法对下载速度进行时间序列预测。\n// 确保在算法失败并返回\
  \ NaN 时再次调用该方法。\nwhile (true) {\npredRX = predictMLP(downloadArray, parseInt(sampleSize),\
  \ parseInt(predTime), 0.1, 0.01);\nif (!isNaN(predRX)) {\n// 如果获得实际数字，则跳出循环。\nbreak;\n\
  }\n}\n// 调用预测方法对上传速度进行时间序列预测。\n// 确保在算法失败并返回 NaN 时再次调用该方法。\nwhile (true) {\npredTX\
  \ = predictMLP(uploadArray, parseInt(sampleSize), parseInt(predTime), 0.1, 0.01);\n\
  if (!isNaN(predTX)) {\n// 如果获得实际数字，则跳出循环。\nbreak;\n}\n}\n// 调用预测方法对延迟进行时间序列预测。\n\
  // 确保在算法失败并返回 NaN 时再次调用该方法。\nwhile (true) {\npredLat = predictMLP(latencyArray,\
  \ parseInt(sampleSize), parseInt(predTime), 0.1, 0.01);\nif (!isNaN(predLat)) {\n\
  // 如果获得实际数字，则跳出循环。\nbreak;\n}\n}\n// 通过调用分类方法对设备活动进行分类。\ndeviceActivity = calculateKNN(RX,\
  \ TX);\n// 创建一个常量变量，保存获得的预测和分类结果。\nconst predictionMessage = {\ndownloadSpeed: RX,\n\
  uploadSpeed: TX,\npredictedDownloadSpeed: predRX,\npredictedUploadSpeed: predTX,\n\
  predictedLatency: predLat,\npredictedQoS: scoreQoS,\ndeviceActivity: deviceActivity,\n\
  averageLatency: averageLatency\n};\n// 将指标消息封装成 JSON 格式的字符串，并通过 WebSocket 连接发送。\n\
  connection.send(JSON.stringify(predictionMessage));\n}\n// 如果收集到的值数量尚未达到 60。\nelse\
  \ {\n// 创建一个常量变量，包含每秒要发送给客户端的网络流量值。\n// 添加所有 3 个实时值。\nconst jsonMessage = {\ndownloadSpeed:\
  \ RX,\nuploadSpeed: TX,\nlatency: latency\n};\n// 将实时消息封装成 JSON 格式的字符串，并通过 WebSocket\
  \ 连接发送。\nconnection.send(JSON.stringify(jsonMessage));\n}\n// 递增网络流量计数器。\ncounter\
  \ = counter + 1;\n})\n}, 1000) // 为监控进程指定 1000 毫秒的间隔。\n}\n代码清单 7-17\n添加 NTMA 模块\n\
  ```\n\n### 7.3.8 预测、分类和网络评分计算方法\n\n完成 VQA 后，预测、分类和网络评分计算方法分别由 `predictMLP()`、`calculateKNN()`\
  \ 和 `calculateQOS()` 方法执行，这些方法包含的代码与第 5.3.7、5.3.8 和 5.3.9 节中给出的代码完全相同。因此，它们被添加到\
