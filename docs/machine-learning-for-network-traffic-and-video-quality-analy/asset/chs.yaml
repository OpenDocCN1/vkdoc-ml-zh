  ```\n\n\n\n#### 实时 WebSocket 通信与动态图表更新\n\n与 NTMA 和 VQA 模块的原理相同，客户端主要负责在预定义端口上与服务器建立连接，随后通过已建立的连接进行消息交换。涉及以下功能：\n\
  \n1.  获取当前活动标签页的 URL 并将其存储在一个变量中。\n\n2.  初始化一个 `time` 变量，作为图表的时间计数器。\n\n3.  初始化一个\
  \ `frame` 变量，用于追踪正在分析的帧数。\n\n4.  创建常量以动态区分两个图表。\n\n5.  在 “ws://localhost:8081/”\
  \ 上建立 WebSocket 连接，即通过端口 8081，用于实时通信。\n    1.  发送消息时，使用 `ws.open` 事件。在此情况下，将之前存储的活动标签页\
  \ URL 发送给服务器，以便其知晓正在访问哪个站点。\n\n2.  接收消息时，使用 `ws.onmessage` 事件。该方法在收到来自服务器的任何消息时自动触发。服务器被编程为在收到\
  \ servlet 的结果后请求另一张截图，并将该结果转发给客户端。此外，由于服务器被编程为每秒向客户端发送实时网络指标，因此该方法也会每秒触发一次。随后使用一系列\
  \ `if` 语句根据所需的更新内容对消息进行过滤。相应的 HTML 元素也会随之更新。\n\n6.  检查是否收到与服务器端发生的任何错误相关的消息，如果收到则生成警报。\n\
  \n7.  使用 `addData()` 方法触发实时图表更新，该方法接收图表对象、时间步长、实时值以及一个标签作为输入，用于指示正在填充五个数据集中的哪一个。\n\
  \n8.  为“监控与分析”按钮创建一个事件监听器：\n    1.  使用 `stringify()` 方法将从各自 HTML 元素中获取的“窗口大小”和“预测时间”变量封装成\
  \ JSON 格式。\n\n2.  调用一个方法，使用 Chrome 扩展 API 截取当前页面视图的屏幕截图。\n\n3.  在“监控与分析”按钮的事件监听器外部实现\
  \ `takeScreenshot()` 方法。\n\n这些过程的代码见清单 7-9。\n\n\n```javascript\n// 将活动标签页的 URL 存储在一个变量中。\n\
  var tempurl = tabs[0].url;\n// 用于在图表上迭代时间的变量 (NTMA)。\nvar time = 0;\n// 用于跟踪正在分析的帧的变量\
  \ (VQA)。\nvar frame = 0;\n// 用于更新图表数据的常量。\nconst updateDownload = \"downloadTraffic\"\
  ;\nconst updateUpload = \"uploadTraffic\";\nconst updateLatency = \"latency\";\n\
  const updateMOS = \"MOS\";\nconst updateAverageMOS = \"AverageMOS\";\n// 创建到服务器的\
  \ WebSocket 连接。\nconst ws = new WebSocket('ws://localhost:8081/');\n// 处理 WebSocket\
  \ 连接 \"open\" 事件。\nws.onopen = function() {\n// 记录扩展程序成功连接到服务器的消息。\nconsole.log('WebSocket\
  \ 客户端已连接');\n// 将活动标签页的 URL 发送到服务器，以便其知道正在访问哪个站点。\n// 将类型指定为 \"sitedata\"，并以 JSON\
  \ 格式发送消息。\nws.send(JSON.stringify({type:'sitedata', value:tempurl}));\n};\n// 处理从服务器接收到的消息。\n\
  ws.onmessage = function(e) {\n// 记录任何接收到的消息。\nconsole.log(\"从服务器收到: \" + e.data);\n\
  // 处理与网络指标相关的消息。\n// 以下语句检查接收到的消息是否包含实时值或预测值。\n// 这些对象名称在服务器端设置。\nif (e.data.includes(\"\
  downloadSpeed\") || e.data.includes(\"uploadSpeed\") || e.data.includes(\"latency\"\
  ) || e.data.includes(\"predictedDownloadSpeed\") || e.data.includes(\"predictedUploadSpeed\"\
  ) || e.data.includes(\"predictedLatency\")) {\n// 解析用于实时指标和图表更新的 JSON 消息。\nconst\
  \ msg = JSON.parse(e.data);\n// 使用服务器端设置的相同表示法从消息中提取预测值。\n// 将这些值存储在其对应的变量中。\nvar\
  \ predRX = msg.predictedDownloadSpeed; // 预测下载速度指标的变量。\nvar predTX = msg.predictedUploadSpeed;\
  \ // 预测上传速度指标的变量。\nvar predLat = msg.predictedLatency; // 预测延迟指标的变量。\nvar scoreQoS\
  \ = msg.predictedQoS; // QoS 分数的变量。\nvar deviceActivity = msg.deviceActivity; //\
  \ 分类结果（即设备活动）的变量。\nvar averageLatency = msg.averageLatency; // 平均延迟指标的变量（未在 UI 上显示，但可以作为仪表板卡片添加）。\n\
  // 检查变量是否不为 \"undefined\"，因为 UI 上的值仅在获得结果后更新。\nif(typeof predRX !== \"undefined\"\
  \ || typeof predTX !== \"undefined\" || typeof predLat !== \"undefined\" || typeof\
  \ scoreQoS !== \"undefined\" || typeof deviceActivity !== \"undefined\") {\n// 使用从服务器接收到的指标更新\
  \ HTML 元素。\ndocument.getElementById(\"results_downloadSpeed\").innerHTML = predRX;\n\
  document.getElementById(\"results_uploadSpeed\").innerHTML = predTX;\ndocument.getElementById(\"\
  results_latency\").innerHTML = predLat;\ndocument.getElementById(\"results_networkScore\"\
  ).innerHTML = scoreQoS;\ndocument.getElementById(\"results_networkActivity\").innerHTML\
  \ = deviceActivity;\n// 更新 UI 以让用户知道测试已完成。\ndocument.getElementById(\"results_network\"\
  ).innerHTML = \"网络指标：测试完成\";\n}\n// 提取实时网络指标和图表更新。\nvar RX = msg.downloadSpeed;\
  \ // 将实时下载速度指标存储在一个变量中。\nvar TX = msg.uploadSpeed; // 将实时上传速度指标存储在一个变量中。\nvar latency\
  \ = msg.latency; // 将实时延迟指标存储在一个变量中。\n// 使用 addData() 方法将数据添加到 NTMA 图表，解析以下参数：\n\
  // 1. 图表对象。\n// 2. 时间步长（相对于用户点击按钮的时间 - 这表示 t = 0）。\n// 3. 实时值。\n// 4. 用于将变量引导至图表上正确值集的标签。\n\
  addData(ntmaChart, time, RX, updateDownload); // 使用最新的下载速度变量更新图表。\naddData(ntmaChart,\
  \ time, TX, updateUpload); // 使用最新的上传速度变量更新图表。\naddData(ntmaChart, time, latency,\
  \ updateLatency); // 使用最新的延迟变量更新图表。\n// 为下一个数据点增加时间。\ntime = time + 1;\n}\n// 处理与视频质量指标相关的消息。\n\
  // 以下语句检查接收到的消息是否包含实时或评估的视频质量指标。\n// 这些对象名称在服务器端设置。\nif (e.data.includes(\"videoScore\"\
  ) || e.data.includes(\"averageVideoScore\") || e.data.includes(\"videoRating\")\
  \ || e.data.includes(\"dominantRating\")) {\n// 解析用于实时指标和图表更新的 JSON 消息。\nconst msg\
  \ = JSON.parse(e.data);\n// 使用服务器端设置的相同表示法从消息中提取预测值。\n// 将这些值存储在其对应的变量中。\nvar mosScore\
  \ = parseFloat(msg.videoScore); // MOS 分数的变量。\nvar averageMosScore = parseFloat(msg.averageVideoScore);\
  \ // 平均 MOS 分数的变量。\nvar liveQualityRating = msg.videoRating; // 视频质量评级的变量。\nvar\
  \ dominantQualityRating = msg.dominantRating; // 主导视频质量评级的变量。\n// 由于此评级是实时的，因此使用从服务器接收到的指标更新\
  \ HTML 元素。\ndocument.getElementById(\"results_liveQualityRating\").innerHTML = liveQualityRating;\n\
  document.getElementById(\"results_dominantQualityRating\").innerHTML = dominantQualityRating;\n\
  // 使用 addData() 方法将数据添加到 VQA 图表，解析以下参数：\n// 1. 图表对象。\n// 2. 时间步长（相对于从 Java Servlet\
  \ 接收帧结果的时间）。\n// 3. 实时值。\n// 4. 用于将变量引导至图表上正确值集的标签。\naddData(vqaChart, frame, parseFloat(mosScore),\
  \ updateMOS); // 使用来自服务器的信息更新 MOS 图表。\naddData(vqaChart, frame, parseFloat(averageMosScore),\
  \ updateAverageMOS); // 使用来自服务器的信息更新平均 MOS 图表。\n// 为下一个要分析的帧增加帧计数。\nframe = frame\
  \ + 1;\n// 如果分析的帧数少于 60（索引从 0 开始，因此为 0-59）。\nif (e.data.includes(\"screenshot\"\
  ) && frame < 60) {\n// 捕获当前标签页的屏幕截图。\nchrome.tabs.captureVisibleTab(null, {format:\
  \ \"png\"}, (dataUrl) => {\n// 将 dataUrl 转换为 Blob。\nfetch(dataUrl)\n.then(res =>\
  \ res.blob())\n.then((blob) => {\n// 创建一个 Promise 来处理 Blob 到 ArrayBuffer 的转换。\n\
  return new Promise((resolve) => {\n// 创建一个 FileReader 实例。\nconst reader = new FileReader();\n\
  // 当读取器完成加载时，使用结果进行解析。\nreader.onloadend = () => resolve(reader.result);\n// 将 Blob\
  \ 作为 ArrayBuffer 读取。\nreader.readAsArrayBuffer(blob);\n});\n})\n.then((arrayBuffer)\
  \ => {\n// 指定将图像分解并发送到服务器的块大小。\nconst chunkSize = 8192; // 例如，8 KB 块\n// 计算所需的块数。\n\
  const totalChunks = Math.ceil(arrayBuffer.byteLength / chunkSize);\n// 首先发送元数据（总块数）。\n\
  ws.send(JSON.stringify({type: \"metadata\", totalChunks}));\n// 将数据分块并按所需块数发送。\n\
  // 遍历这些块并通过 WebSocket 连接发送它们。\nfor (let i = 0; i < totalChunks; i++) {\n// 计算当前块的起始和结束字节。\n\
  const start = i * chunkSize;\nconst end = Math.min(start + chunkSize, arrayBuffer.byteLength);\n\
  // 从 ArrayBuffer 中切片出当前块。\nconst chunk = arrayBuffer.slice(start, end);\n// 通过 WebSocket\
  \ 发送当前块。\nws.send(chunk);\n}\n})\n.catch((error) => {\n// 记录捕获屏幕截图时的任何错误。\nconsole.error(\"\
  捕获屏幕截图时出错:\", error);\n});\n});\n}\n}\n}\n清单 7-9\n实时 WebSocket 通信与动态图表更新\n```\n\n\
  \n#### 实时图表更新机制\n\n本节涉及 `addData()` 方法，该方法结合了 NTMA 和 VQA 模块的内容进行了轻微修改，使得两个图表都能实时填充数据。其代码见列表\
  \ 7-10。\n\n```\n// 通过先前创建的标签判断该方法是为哪个数据集调用的。\n// 如果标签代表下载速度。\nif (updateLabel ===\
  \ \"downloadTraffic\") {\n// 推送标签，即时间点。\nchart.data.labels.push(label);\n// 推送数据，即实时指标。\n\
  chart.data.datasets[0].data.push(data);\n}\n// 如果标签代表上传速度。\nelse if (updateLabel\
  \ === \"uploadTraffic\") {\n// 推送数据，即实时指标。\nchart.data.datasets[1].data.push(data);\n\
  }\n// 如果标签代表延迟。\nelse if (updateLabel === \"latency\") {\n// 推送数据，即实时指标。\nchart.data.datasets[2].data.push(data);\n\
  }\n// 如果标签代表 MOS。\nif (updateLabel === \"MOS\") {\n// 推送标签，即帧时刻。\nchart.data.labels.push(label);\n\
  // 推送数据，即实时指标。\nchart.data.datasets[0].data.push(data);\n}\n// 如果标签代表平均 MOS。\nelse\
  \ if (updateLabel === \"AverageMOS\") {\n// 推送数据，即实时指标。\nchart.data.datasets[1].data.push(data);\n\
  }\n// 当该方法首次被调用时，更新图表选项以显示 y 轴刻度。\n// 这样做是因为 y 轴刻度最初是禁用的。\nntmaChart.options.scales.y.ticks.display\
  \ = true;\nvqaChart.options.scales.y.ticks.display = true;\n// 更新图表。\nchart.update();\n\
  列表 7-10\n实时图表更新机制\n```\n\n## 7.3 集成 NTMA/VQA 应用的服务器程序结构\n\n`server.js` 文件的职责包括结合第\
  \ 5.3 节和第 6.3 节详述的流程，首先导入所有模块，然后初始化全局变量并创建一个 HTTP 服务器。接着，使用相同的机制来处理 WebSocket 连接，从客户端接收“窗口大小”和“预测时间”参数，并重建\
