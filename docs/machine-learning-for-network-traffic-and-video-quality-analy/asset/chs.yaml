  ### 6.4.7 提取 LBP 特征\n\n提取 LBP 特征需要将图像转换为灰度图，并添加若干种失真，例如 JPEG 压缩、JPEG2000 压缩、白噪声和高斯模糊。这些失真被应用于截图，以模拟可能影响视频质量感知的各种质量等级和波动。LBP\
  \ 是一种纹理描述符，通过将像素与其相邻像素进行逐像素比较来量化图像中的局部模式。在经历失真后，这些属性将从变形后的图像中计算得出。完整过程详见第 4.3 章。\n\
  \n#### 原始图像的 LBP 模式\n\n`LBP41()` 方法计算未应用任何特定噪声或失真的 LBP 模式。如清单 6-22 所示。\n\n```\n\
  // 计算原始图像的 LBP 模式。\npublic double[][] LBP41(double[][] img) {\n// LBP 模式中的邻居数量。\n\
  int Neighb = 4;\n// 输入图像的尺寸。\nint M = img.length;\nint N = img[1].length;\n// 用于提取中心值的块大小。\n\
  int bsize_M = 3;\nint bsize_N = 3;\n// 用于提取中心值的原始索引。\nint orig_m = 2;\nint orig_n\
  \ = 2;\n// 计算 LBP 模式的尺寸。\nd_m = M - bsize_M; // 8\nd_n = N - bsize_N; // 5\n// 从图像中提取中心值。\n\
  double[][] center = new double[orig_m + d_m][orig_n + d_n];// [10][7]\nfor (int\
  \ i = orig_m - 1; i = center[w][x]) {\ncell[m][q][r] = 1;\n} else {\ncell[m][q][r]\
  \ = 0;\n}\nx++;\n}\nw++;\n}\n}\n// 对每个位置的值求和，得到最终的 LBP 模式。\nfor (int s = 0; s <\
  \ Neighb; s++) {\nfor (int t = 0; t < d_m + 1; t++) { // 1;9 0;8 1;9 2;10\nfor (int\
  \ u = 0; u < d_n + 1; u++) { // 2;7 1;6 0;5 1;6\nzeros[t][u] = zeros[t][u] + cell[s][t][u];\n\
  }\n}\n}\n// 返回计算出的 LBP 模式。\nreturn zeros;\n}\n清单 6-22\n计算原始图像的 LBP 模式\n```\n\n####\
  \ 高斯模糊的二值化过程\n\n清单 6-23 给出了在高斯模糊的二值化过程中获取 LBP 模式的代码。\n\n```\n// 计算模糊伪影的 LBP 模式。\n\
