  \ k 个最近邻居的类别。从表 4-2 中，该记录因此被归类为“流媒体”，其最近类别为“2”，因为其欧几里得距离最短。\n\n## 4.2 NTMA 的预测模型\n\
  \n本节描述了多层感知器（MLP）回归模型。它与滑动或滚动窗口方法结合使用，以创建输入模型进行训练的数据元组。结合超参数优化过程，MLP 模型用于创建一个时间序列预测框架，允许用户使用“窗口大小”和“预测时间”变量来预测任何时间戳的网络流量。\n\
  \n### 4.2.1 多层感知器（MLP）算法\n\nMLP 算法属于神经网络领域，并在训练过程中使用反向传播方法 [3]。这包括前向和后向传递，其中调整称为权重的参数，使其针对特定数据集进行定制。在模型旨在减少预测值与数据点输入之间的误差之前，权重最初是随机分配的。这创建了一个连续循环，其中误差不断减小，直到满足用户设定的特定要求\
  \ [4]。MLP 是分类和回归问题的流行模型 [5]，因为它从一个接收预处理数据的输入层开始，然后是若干前馈计算单元的隐藏层。然后，输出层连接到这些隐藏层以生成预测。图\
  \ 4-3 给出了一个具有两个隐藏层的 MLP 模型的基本表示。\n\n![](img/612428_1_En_4_Fig3_HTML.jpg)\n\nMLP\
  \ 架构的网络图。它包括输入层中 2 个节点之间的连接，然后是 2 个隐藏层中各 3 个节点，以及输出层中的 2 个节点。\n\n图 4-3\n\nMLP 架构\n\
  \n一个简单的 MLP 可以用公式 4-2 来概括 [6]：\n\n![$$ {o}⁰=x,\\kern0.5em {o}^l={F}^l\\left({W}^l{\\\
  underset{\\_}{o}}^{\\left(l-1\\right)}\\right)\\kern0.5em for\\kern0.5em l=1,\\\
  dots, L $$](img/612428_1_En_4_Chapter_TeX_Equ2.png)\n\n(4-2)\n\n其中：\n\n*   *x*：输入向量，设置为“第零层的输出”\n\
  *   *l*：所讨论的层\n*   *o*^(*l*)：输出向量\n*   ![$$ {\\underset{\\_}{o}}^{\\left(l-1\\right)}\
  \ $$](img/612428_1_En_4_Chapter_TeX_IEq1.png)：通过在向量前添加数字 1 来增加向量的维度\n*   *W*^(*l*)：特定层的偏置项\n\
  *   *F*^(*l*)：应用于参数所有分量的激活函数\n\n### 4.2.2 超参数\n\nMLP 模型通常由超参数控制，这些超参数决定了网络结构，并最终为网络的训练方式定下基调。它们在训练过程之前设置。理想值可能因数据集的独特属性而异，包括其规模、复杂性和数据分布。鉴于网络流量数据依赖于底层因素，如网络带宽、网络设备和用于收集数据的设备，产生最佳性能准确性的超参数可能因用户和场景而异。因此，建议通过实验进行超参数调整，以确定特定用户或网络环境的最佳值组合。这里列出了一些典型的超参数\
  \ [7, 8]：\n\n*   **学习率**：学习率控制模型适应问题的速度。低学习率会减慢学习过程，但收敛平稳，而较大的值可能导致更快的训练过程，但收敛性较差。为了在分析过程中达到准确性，建议选择较小的学习率，以便在每次更新时进行微小的更改，但这会以花费更多预测时间为代价。\n\
  \n*   **周期数**：这是训练过程中一个周期内所有训练数据的总迭代/传递次数。\n\n*   **隐藏层数量**：适当数量的隐藏层可以产生高精度的值，同时降低时间复杂度。然而，过多的层数会使神经网络变得更加复杂\
  \ [9]。\n\n### 4.2.3 时间序列预测的数据准备\n\nMLP 回归要求在数据输入神经网络之前对其进行归一化。这通常会加速训练过程，从而减少收敛时间\
  \ [10]。根据公式 4-3，使用最小-最大归一化方法将数据拟合到 0 和 1 之间 [11]：\n\n![$$ {X}_{normalized}=\\frac{X-{X}_{min}}{X_{max}-{X}_{min}}\
  \ $$](img/612428_1_En_4_Chapter_TeX_Equ3.png)\n\n(4-3)\n\n其中：\n\n*   *X*：进行归一化的参数\n\
  *   *X*[*max*]：*X* 的最大值\n*   *X*[*min*]：*X* 的最小值\n\n同样，在预测之后，需要对输出进行反归一化，以便按相同比例放大数值。然后执行公式\
  \ 4-4：\n\n![$$ {X}_{denormalized}={X}_{normalized}\\left({X}_{max}-{X}_{min}\\right)+{X}_{min}\
  \ $$](img/612428_1_En_4_Chapter_TeX_Equ4.png)\n\n(4-4)\n\n接下来，在将每个窗口输入算法进行训练之前，将滑动窗口原理应用于归一化后的数据集。输入到\
  \ MLP 神经网络的单变量模型的预处理改编自 Neuroph 的神经网络文档 [12, 13, 14]。这将在下一节中描述。\n\n\n\n### 4.2.4\
  \ 滑动窗口概念\n\n滑动窗口（也称为滚动窗口）概念对于短期时间序列预测模型非常高效 [15, 16]。由于该应用以用户定义的特定预测时间作为输入，因此它非常适合本书中的回归方法。考虑下面给出的场景，该场景包含从数据集中获取的“下载速度”值，并具有以下回归模型参数：\n\
  \n*   **窗口大小**：5 秒\n*   **预测时间**：2 秒\n\n为便于说明，图 4-4 中给出的值直接来自数据集。在构建滑动窗口之前，这些值会被归一化，如下所示。\n\
  \n![](img/612428_1_En_4_Fig4_HTML.jpg)\n\n一张图表展示了下载速度的滑动窗口。它有 5 个阶段：索引、下载速度、第一个滑动窗口、第二个滑动窗口和第三个滑动窗口。索引包含从\
  \ 1 到 10 的 10 个值。下载速度包含 10 个值，例如 1063、1595、1471、1691、1618、1660、1639、1876、1680 和\
  \ 1598。滑动窗口的窗口大小为 5，预测时间为 2。\n\n**图 4-4**\n下载速度的滑动窗口示例\n\n这意味着，对于第一个滑动窗口，前五个实例被作为输入数据，而第（窗口大小\
  \ + 预测时间）个值（在此例中为第七个值）被作为输出数据。索引递增 1，循环持续进行直到数据集结束。此概念训练 MLP 模型，使其理解必须使用最后一个滑动窗口来预测由预测时间决定的期望值。\n\
  \n### 4.2.5 用于时间序列网络流量预测的 MLP\n\n在本书中，滑动窗口方法与独立的数据集合一起使用，具体由最终用户输入的窗口大小和预测时间因素决定。因此，在数据处理阶段，对三个变量中的每一个都采用单变量方法。公式\
  \ 4-5 至 4-7 用于计算隐藏层中每个神经元关于下载速度、上传速度和延迟的加权和：\n\n![$$ {z}_{j^h}={\\sum}_1^m\\left({w}_{i{j}^h}{D}_i\\\
  right)+{b}_{j^h} $$](img/612428_1_En_4_Chapter_TeX_Equ5.png)\n\n(4-5)\n\n![$$ {z}_{j^h}={\\\
  sum}_1^m\\left({w}_{i{j}^h}{U}_i\\right)+{b}_{j^h} $$](img/612428_1_En_4_Chapter_TeX_Equ6.png)\n\
