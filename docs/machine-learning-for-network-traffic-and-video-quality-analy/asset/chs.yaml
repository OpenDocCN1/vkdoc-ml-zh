  NTMA 研究方法


  2020 年底，数字宇宙由总计 44 泽字节组成，分布在五十万个网络中 [4]。NTMA 的核心原则之一涉及进行广泛研究并使用有效策略，首先检查然后量化这些通信系统内的交互。此过程需要快速获取数据、随后进行适配和数据分析，同时确保对原始数据的完整性影响最小
  [5]。


  根据思科的说法，数据收集方法通常分为两大类，即主动测量和被动测量，其中 90% 的现有技术是基于流的 [5]。这指的是对穿越已建立框架的指标进行持续监控，包括每秒发送和接收的数据包频率，以及带宽波动的速率。相反，主动测量被称为基于数据包的方法，包括检查和提取数据包信息，包括头部和有效载荷。这种方法使用商用硬件实现
  [6]，以解决深度数据包检测（DPI）速率与将数据写入磁盘速率之间的差异，该差异可能达到每秒几千兆比特（Gb）。




  ### 2.1.1 数据源与采集


  在数字领域，数据源呈现出广泛的多样性，反映了网络的广阔特性。这些数据源在提供有关网络行为、性能和安全的宝贵信息方面发挥着关键作用。因此，通常需要一个健壮的框架来处理这种海量数据涌入。然而，现有大数据技术的一个突出缺点是它们倾向于围绕离线模型构建，通常不适用于实时流量分析，而实时流量分析正是
  NTMA 的基础之一 [7]。NTMA 中的数据收集通常集中在三个主要来源，即数据包捕获、流数据和日志文件 [8]，具体如下：


  *   **数据包捕获**：数据包捕获被认为是最详细的方法，因为它涉及记录数据在网络中传输时的单个数据单元。其输出是对网络流量的全面检查，包括各种元素，如有效载荷内容、报头和通信模式。数据包级分析是检查复杂网络问题或执行取证调查的重要组成部分。然而，它可能会产生大量数据，需要强大的存储和处理能力。


  *   **流数据**：相比之下，流数据将网络活动整合为流统计信息。流表示在单一方向上发生的通信会话，通常基于共享特征（如源和目标 IP 地址、端口和协议）进行结构化。数据聚合过程显著减少了需要处理的数据总量，同时保留了
  NTMA 所需的关键信息。这在流量分析、带宽监控和异常识别领域非常有益。流数据通常通过 NetFlow、sFlow 和 IPFIX 等协议生成。


  *   **日志文件**：日志文件是 NTMA 背景下的另一个数据来源。在计算机网络中，网络设备、服务器和应用程序等组件通常会生成日志，目的是记录值得注意的事件和操作。这些日志在理解网络活动和识别安全问题方面具有重要价值。上下文信息在分析单个事件时起着至关重要的作用，因为它能够追踪导致网络异常的事件序列。


  NTMA 的有效性取决于能否从上述来源高效、可靠地获取数据。网络管理员和分析师在需要即时洞察单个数据包时，通常会使用 Wireshark 和 tcpdump 等数据包捕获工具
  [9]。这两种工具的使用频率取决于电池、处理器和内存使用等功能特性。流数据收集通过 NetFlow 等协议得以实现，这些协议能够在最小化计算负载的同时进行有效分析
  [10]。由各种网络设备和系统生成的日志文件，对于监控事件和解决问题至关重要 [11]。在这个动态领域，企业越来越倾向于使用提供集中式数据存储和处理能力的软件解决方案。上述解决方案优化了数据收集过程，使网络专业人员能够配备多样化的数据，以维护网络完整性并防范潜在的安全漏洞。


  ### 2.1.2 关键指标


  服务提供商和网络管理员通常需要关键绩效指标（KPI）或关键质量指标（KQI），这些指标乍看之下代表了网络的整体性能，并且也可以进一步深入分析。这些指标通常显示在网络运营中心（NOC）和服务运营中心（SOC）的告警仪表板上，因此必须可靠，因为它们肩负着作为检测网络问题（如速度慢、饱和和服务中断）第一接触点的责任。这些关键指标在表
  2-1 中进行了讨论 [8, 12]。


  表 2-1


  NTMA 的关键指标


  | 关键指标 | 描述 |

  | --- | --- |

  | **带宽利用率** | 它衡量在特定时间点正在使用的可用网络带宽的百分比。因此，它是反映网络资源分配情况以及数据传输是否因拥塞而受阻的重要指标。过高的带宽使用率可能表明需要进行优化或容量规划和扩展。
  |

  | **丢包率** | 作为用户体验的直接指标，丢包率表示未能到达预期接收者的数据包数量。对于网络会议或视频通话等实时应用，低丢包率至关重要。相反，高丢包率则表明流媒体和社交媒体等应用性能不佳。
  |

  | **延迟** | 同理，延迟是数据包从源端传输到目标端所花费的时间。视频会议和在线游戏等应用是典型的需要低延迟的服务。过度的延迟会导致这些程序无法使用。 |

  | **抖动** | 数据包到达时间的差异称为抖动，可用于指示网络拥塞或数据包路由异常。对于网络电话（VoIP）等实时应用，稳定的抖动率对于保持通话质量和实现无缝数据流至关重要。
  |

  | **吞吐量** | 作为衡量在给定时间内通过网络传输到目标的数据量的指标，吞吐量代表了网络有效传输数据的能力。对其的监控有助于检测数据传输速度的意外变化，这可能表明网络故障或攻击。
  |


  网络专业人员理解和监控这些关键指标至关重要，因为它们能够快速处理异常、改善用户体验并加强网络安全 [13]。这满足了企业在服务等级协议（SLA）范围内诊断问题以及维护安全稳定数字环境的需求。NTMA
  依赖于精确的测量和解读，以及适当的告警方法，才能以最佳状态运行并维持最高级别的安全性。




  ### 2.1.3 数据预处理与清洗


  在广阔且动态的数字生态系统中，网络数据流多种多样且常常充满噪声。数据预处理与清洗是确保分析前获取的数据正确、相关且无错误的关键步骤。以下解释了一些关键流程 [14,
  15]：


  *   **数据收集与聚合**：从多个来源（包括数据包捕获、流数据和日志文件）收集数据是数据准备的初始阶段。为了减少数据涌入量并加快计算速度，收集到的数据通常会被合并成易于处理的部分。基于时间的采样是一种聚合技术，用于将数据合并到相关的时间段内进行研究。简而言之，数据通常按预设的时间间隔进行收集。


  *   **数据标准化**：由于网络数据具有多种格式和单位类型，数据标准化通过允许直接比较来自不同来源和设备的数据来确保一致性。这为有意义地分析数据提供了可能性。


  *   **缺失数据处理**：数据源中偶尔会出现数据缺口，导致分析出现偏差。这通过诸如数据插补等方法进行处理，该方法利用现有数据估算缺失值。


  *   **噪声降低**：噪声和异常通常是设备故障或传输错误的结果。通过滤波和平滑等技术，可以去除异常值和离群点，以确保正确反映网络活动。


  *   **数据转换**：缩放和对数变换等技术用于确保数据符合分析方法的假设，并能够进行有洞察力的解读。


  *   **数据清洗**：这包括通过处理离群点和消除重复项来发现并修正数据集中的错误和不一致之处。


  数据集与实际网络行为和表示的一致性，是影响 NTMA 准确性的最关键因素之一，因此其重要性怎么强调都不为过。


  ### 2.1.4 网络拓扑与架构


  网络拓扑与设计是 NTMA 领域任何研究的基础。本节探讨网络的关键组成部分。


  ![](img/612428_1_En_2_Fig2_HTML.jpg)


  一个 SDN 控制平面的结构，包含一个核心模块和附加模块，周围环绕着四个接口：东西向接口、南向接口、东西向接口和北向接口。SDN 应用平面和 SDN 数据平面分别位于顶部和底部。


  图 2-2

  SDN 控制器概览 [18]


  *   **网络拓扑**：*拓扑*指的是网络中设备及其互连的配置。这些配置包括星型、总线型、环型和网状型，它们对数据收集、流量管理和安全监控有显著影响。为了有效获取网络流量，需要战略性地部署监控设备。流量流的研究也受拓扑影响，数据包的传输会受到延迟、抖动和丢包的影响。拓扑感知分析是一种旨在确保网络性能及其对
  QoS 标准的遵守符合预定预期的方法 [16]。同样，通过了解网络的脆弱性，管理人员能够增强安全程序，并将监控工作集中在最重要的点上。


  *   **网络架构**：架构涵盖了共同构成网络的设备、协议和服务的布局。这种架构框架可以是传统的分层设计，也可以是现代的软件定义网络（SDN）[17]。这一选择直接影响
  NTMA。传统系统有时需要从多个来源检索数据，而 SDN 架构通常整合数据收集，从而简化 NTMA 活动。安全问题与架构高度相关。复杂网络拓扑的引入可能会产生安全漏洞，但
  SDN 系统能够通过集中式策略执行提供改进的安全控制 [18]。同样，SDN 提供了动态且可定制的功能，以适应网络不断变化的需求。图 2-2 展示了一个 SDN
  控制器的概览。


  主要组成部分的分解如下 [17, 18]：


  *   **数据平面**：数据平面负责处理网络数据包的转发，由包括路由器、交换机和转发单元在内的网络设备组成。在 SDN 中，由于该平面是可编程的并能从控制器接收信号，因此可以实现对数据转发的动态控制。


  *   **控制平面**：控制平面掌握着网络流量路由决策的权力，它控制着流向数据平面交换机的数据流。


  *   **SDN 控制器**：在 SDN 中，控制器位于控制平面的核心。它充当应用层与网络设备之间的桥梁，从应用程序接收高级网络策略和设置，然后将其转换为数据平面设备的低级命令。


  *   **南向接口**：这是 SDN 控制器与数据平面设备之间的通路。使用诸如 OpenFlow 等协议来传达命令。


  *   **北向接口**：这是 SDN 控制器与 SDN 应用程序之间的通路，允许它们传达需求并获取关键的网络状态信息。


  *   **东西向接口**：它使控制器能够同步其视图并交换信息，以保持一致性。


  *   **SDN 应用平面**：SDN 应用程序运行在 SDN 控制器之上，利用全局视图的优势，从而实现多种服务和策略。例如负载均衡和流量工程。


  *   **核心模块**：网络发现、拓扑管理和路由命令等功能由核心模块处理，从而确保正确的网络视图。


  *   **附加模块**：SDN 控制器的功能可以扩展，以支持定制化的用例，例如提高安全性和 QoS。


  *   **与第三方应用的同步**：第三方应用允许与其他网络服务和业务应用集成，提供了一个灵活的网络管理绿洲。


  *   **与其他控制器的对等互联**：为了创建分布式 SDN 环境，控制器可以相互配对，以实现信息交换并维护准确的网络视图。




  ### 2.1.5 数据驱动分析


  数据驱动分析结合 NTMA，代表了对传统基于规则方法的转变，因为它强调直接从记录的网络数据中提取洞察。该方法利用设备、流量和通信模式产生的大数据，结合复杂的分析方法，来识别威胁、异常和安全风险，进而实现以下目标：


  *   **数据驱动洞察**：网络专家能够从网络设备产生的大量数据中提取有价值的洞察。通过机器学习、统计模型和数据挖掘方法，可以识别模式并检测异常。数据驱动分析的主要优势在于其预测网络活动的能力，包括流量趋势、带宽使用和潜在的性能挑战，并且它不仅考虑流量和拥塞参数，还考虑应用程序的个体属性，同时将用户行为纳入考量[19]。


  *   **安全威胁检测**：通过对网络数据的持续分析，可以快速检测可能表明安全漏洞、攻击或非法访问的异常情况。机器学习模型能够学习网络流量呈现的典型模式，使其能够在遇到偏离常态的情况时检测并发出异常信号。在某些情况下，与典型的
  Apache Spark 集群相比，Big-DAMA 可以将分析和检测速度提升 10 倍[20]。


  *   **资源优化**：企业能够优化资源分配，以确保关键任务应用获得所需的带宽，最终提升用户体验和运营效率[21]。


  *   **网络性能提升**：通过实时参数监控准确检测性能瓶颈和延迟问题，随后实施适当的补救措施。例如，在 6G 网络中，以数据为应用 AI 的前沿，人们设想了描述性、诊断性、预测性和规范性分析。这意味着能够深入了解信道条件、流量概况、资源可用性、用户未来位置、网络切片决策和资源分配[22]。


  *   **运营效率**：网络工程师能够做出明智的决策、自动化日常操作并快速解决问题，从而最大限度地减少停机时间并降低网络中断的可能性。


  从网络数据中获得的知识已超越单纯的观察，现在作为可操作的信息，使网络专家能够做出训练有素的决策、高效管理网络资源，并确保其数字服务的安全性和可靠性。


  ### 2.1.6 用于流量分类的监督学习


  将网络流量分类为离散类别是 NTMA 的一项基本任务，因为它有助于理解穿越网络的众多数据流。本节探讨了监督学习在流量分类背景下的重要性，研究了机器学习算法在识别和标记网络活动过程中的变革性影响。传统方法依赖于端口或协议数据，这些数据通常不足以准确识别动态使用这些方法的应用程序。监督学习是机器学习的一个分支，它在标记数据集（即预定义的类别或标签，如视频流、文件传输或网页浏览）上进行训练。分类过程可以总结为以下几点：


  *   **数据收集**：捕获数据包级或流级信息。

  *   **数据标记**：将流量手动分类为不同的标签。

  *   **特征提取**：识别和提取相关的特征和特性。

  *   **模型训练**：使用标记数据集训练各种模型。

  *   **流量分类**：使用训练好的模型对未知网络流量进行分类。


  监督学习在流量分类中的优势是多方面的。它能够识别广泛的应用程序，即使它们使用非标准端口或加密。此外，它可以适应新兴应用程序，而无需手动更新规则，使其适用于不断变化的网络环境。文献[23]中展示了一个这样的例子，其中使用了一种主动形式的机器学习来减少模型训练前对标记值集的需求。该算法主动选择需要标记的实例，并在小数据集上实现了高精度。


  因此，凭借强大的数据集，这些数据集在分配标签（无论是预先分配还是主动分配）方面具有可区分的特征，分类系统能够适应不断发展的应用程序而无需人工干预，进而使实时网络环境能够持续演进。这催生了动态流量管理和即时响应攻击的能力。同样，与安全问题相关的模式有助于及时识别入侵、数据泄露和其他未经授权的活动。一个例子是基于多特征融合的增量技术用于检测未知流量，如文献[24]所示。类似地，网络流量的精确分类使企业能够根据应用优先级有效管理网络资源，确保关键应用获得必要的带宽，并优先交付基本服务。


  ### 2.1.7 用于异常检测的无监督学习


  网络的特点是动态和复杂，通常会观察到大量的信息交换。异常的存在可能表明安全漏洞、网络问题或正在发展的危险，及时识别它们至关重要[25]。无监督学习算法用于在没有预先建立的类别或标签的情况下检查网络流量，通过以下步骤进行：


  *   **数据收集**：捕获数据包级或流级信息。

  *   **特征提取**：识别和提取相关的特征和特性。

  *   **模型训练**：使用聚类或降维方法来识别数据中固有的模式或结构。

  *   **异常检测**：识别与已建立模式的偏差，以指示可能的异常。


  无监督学习模型能够调整和适应网络条件的变化，使其适用于动态环境，这些环境的特点是可能存在不遵循预定义趋势的新兴威胁或异常。通过分析最新的数据集和流数据，发现可疑行为可用于早期预警系统。潜在的应用领域包括入侵检测、支付欺诈检测、公共安全、复杂系统监控和医疗数据分析。最后，通过无监督学习，异常识别无需预先训练，数据完全基于其内在结构进行评估，而异常通常根据其可疑程度进行分级[26]。




  ### 2.1.8 预测性分析


  随着物联网（IoT）、车联网（IoV）和 6G 等新框架的兴起，预测网络行为的能力已成为主动网络管理的基本要素。预测性分析通常指网络流量预测（NTP），它是 NTMA
  的一个子集，传统上依赖于时间序列预测（TSF），即通过识别过去与未来数据之间的现有依赖关系，创建能够估算未来流量规模的模型[27]。TSF 方法的优势在于其低复杂度，但网络流量的激增也催生了非
  TSF 框架的需求，这些框架基于流和报文头部数据进行操作，以预测未来流而非网络参数。因此，根据具体用例的不同，预测流与预测网络流量之间存在来回切换。用于创建 NTP
  训练模型的一些常用数据收集方法和模型如图 2-3 所示。


  ![](img/612428_1_En_2_Fig3_HTML.jpg)


  一个页面包含三种框架：批量离线、批量增量和在线增量。每种框架都展示了如何将带有特征的新 NT 数据通过数据集进行处理，以获得训练好的模型。在在线增量框架中，NT
  数据被分为当前数据和历史数据。


  图 2-3

  现有的 NTP 框架 [27]


  创建 NTP 框架涉及以下步骤：


  *   **数据收集**：收集与性能、事件和资源利用相关的时间序列格式数据。

  *   **数据预处理**：对数据集进行清洗、归一化和准备工作，以提高其质量和分析相关性。

  *   **特征选择**：选择相关特征来描述网络行为。

  *   **模型开发**：利用历史数据和一种追踪时间概念的概念来开发机器学习模型。

  *   **预测**：使用训练好的模型对未来趋势进行预测；这些预测通常基于最新的可用数据。


  总体而言，对于服务提供商来说，预测性分析在主动分配资源、优化服务质量（QoS）以及维持最佳网络性能方面至关重要[28]。通过预测洞察，可以根据客户对关键应用的优先级使用情况，为其分配适当的带宽。


  ### 2.1.9 基于 AI 的实时决策支持


  随着互联设备数量的不断增加，全球网络在新颖性、规模和复杂性方面正以惊人的速度发展。随着诸如自主感知、计算、学习、分析乃至无需人工监督的商业决策等新型应用的出现，人工智能与网络的结合对于数字化、精细化以及服务的持续演进至关重要[2]。传统上，电信专家构建和管理无线网络，他们大量运用其在网络设计、用户移动性、流量模式以及波传输框架方面的广泛知识，来设计和执行策略与流程，从而基本保证大规模系统的不间断运行。随着小基站和尖端无线电技术的引入，网络结构变得复杂得多。除了更难以预测之外，考虑到新可用的频谱频率和高度密集的网络，流量模式和无线电传输模型的评估也变得更加困难。因此，在帮助运营商促进无线和移动网络的部署与维护方面，人工智能处于主导地位[29]。此外，人工智能已被赋予自主决策和分析能力的信心，并被视为确保这些复杂网络实现零接触配置的关键。


  随着高级智能被整合到应用、网络和组织结构中，一种以数据为核心的策略将逐渐占据主导地位。这种方法将把自动化、可靠性和效率提升到前所未有的水平。电信公司将拥有更多控制权，并能够利用对收集数据的分析来更有效地管理其网络基础设施。通过定制并最终将特定功能映射到网络行为模式，可以使每项服务更加安全、可靠和稳健[30]。这将进一步推动
  Wi-Fi 和移动服务在社会和工业层面的演进。在高度分布式的架构内部，决策过程涉及多个地点和阶段。某些行动涉及经过深思熟虑的、能够改变整个网络行为的判断，因此由从多个地点收集的数据驱动；而另一些行动则由基于本地数据、具有极低延迟的严格控制机制决定[31]。这些选择通常属于关键类别，需要及时处理。拓扑结构的分布式特性应作为管理智能的基础，以便持续、精确地服务于这个庞大的通用结构。


  对于用于自动驾驶汽车、工业 4.0 和制造运营、智慧城市以及医疗保健的物联网传感器而言，在边缘附近或设备接口处产生的数据通常需要即时处理。由于存在限制数据存储位置的政策，将此类数据迁移到集中式云可能并非最佳选择。这表明在某些情况下，数据甚至可能不会被发送。这些正是需要实时
  NTMA 具备敏锐、直接、可靠和轻量级特性的场景，同时它应驻留在本地站点本身，而无需客户端-服务器模式。直接从众多网络节点学习全局数据模式，而无需将其传输到集中式系统，是解决这一挑战的一种潜在方案。很快，还需要找到合适的方法来共享新学到的信息，同时确保在设备间进行及时传输。AI
  算法、机器学习以及无线生态系统中的其他基础技术的协作，可以开启包括自我管理、自我优化和自我演进在内的突破性进展之门。


  ## 2.2 现有的 NTMA 应用


  在当今快节奏的数字环境中，企业主要依赖 NTMA 解决方案来有效维护其网络基础设施的完整性和最佳功能。网络管理和监控工具对于企业的成功至关重要，它们帮助 IT
  团队减少停机时间、识别瓶颈，从而提高故障排除效率，并找到关键绩效指标（KPI）以改善其服务质量和体验质量。由于重点不仅仅是监控，安全专业人员和管理员的目标是做出数据驱动的决策、建立弹性的安全措施，并为最终用户提供不间断的数字体验。以下是全球企业常用于
  NTMA 的现有软件简要描述[32]。




  ### 2.2.1 SolarWinds NetFlow Traffic Analyzer


  作为网络监控领域的知名企业，SolarWinds [33] 提供了一套全面的 NTMA 软件包，其中包括自动编译高度可定制且详细的报告。可以实施高效的排序特性，例如评估应用程序在特定时间段内使用的带宽比例，来对基于网络的应用程序进行列表和分类。简而言之，实时流量数据从持续的数据流中收集，并转化为可视化表示形式，例如表格和图表，以描绘业务基础设施的运行动态。该软件提供多种版本，包含流量分析和带宽监控等功能。它还支持
  VMware vSphere 分布式交换机，并能够根据特定类型的网络流量生成警告。它通常用于收集数据流和识别复杂的应用程序 [34]。然而，它缺少诸如流量预测和网络消耗分类等功能。该框架主要关注观察属性，包括跨堆栈
  IT 数据的关联以及并排比较数据。


  ### 2.2.2 Paessler PRTG Network Monitor


  为了让 IT 专业人员的工作更轻松，Paessler Router Traffic Grapher (PRTG) [35] 提供了关于网络、系统和应用程序的描述性且信息丰富的概览。通过适用于移动监控的
  Android 和 iOS 应用程序，可以在手机上轻松接收和处理警报。其显著特性包括可定制的仪表板，客户可以创建这些仪表板，也可以从各种适合当下需求的模板中进行选择，例如在办公室与管理团队进行演示。这涵盖了从创建带有集成动态地图的完全可操作仪表板，到添加自定义
  HTML 元素。这些功能可以组合在一起，创建一个全面的、实时的网络管理工具，适用于不同地点，从而提供对整个区域的全局视图。远程站点监控和带宽分析功能也可用于识别瓶颈源。该软件包还提供自动化浏览测试，可以在任何网站上执行，以获取诸如加载时间、响应时间以及网站是否正常运行等参数。同样，域名系统（DNS）服务器的状态也可以被检查。图
  2-4 展示了一个示例，其中测量并绘制了 Facebook 的 HTTP 加载时间。凭借云支持以及与数百家公司（如 IBM Cloud 和 Citrix Systems）的合作，自动发现模式允许通过预配置的传感器即时进行配置。此外，数据收集过程使用了
  ICMP、SNMP、WMI 和 HTTPS 等协议。这可以应用于多种场景，例如医疗保健系统和智慧城市 [36]。作为一个独立的应用程序，PRTG 并未实现机器学习算法。通过使用其合作伙伴之一
  Crosser 平台的预构建模块，可以将分析功能集成到该软件中。


