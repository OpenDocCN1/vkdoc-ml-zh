  \ 20、比较相似度、dataset1.txt、LIBSVM 缩放、范围、LIBSVM 预测、SVM 模型文件、质量分数、MOS 30，评级为优秀。\n\n图\
  \ 4-15\n\n相似度指数与视频质量分数预测模型\n\n*LP*[*d*] 和 *LP*[*m*] 特征图之间的重叠度使用公式 4-21 计算：\n\n![$$\
  \ {LP}_o=\\left({LP}_d.{LP}_m\\right) $$](img/612428_1_En_4_Chapter_TeX_Equ22.png)\n\
  \n(4-21)\n\n其中：\n\n*   *LP*[*o*]：*LP*[*d*] 和 *LP*[*m*] 之间的重叠度\n*   *LP*[*d*]：退化图像的特征图\n\
  *   *LP*[*m*]：MPRI 的特征图\n\n相似度 *sim* 由公式 4-22 定义，其中分子和分母指示了特征图中非零元素的数量：\n\n![$$\
  \ sim=s\\left({LP}_d,{LP}_m\\right)=\\frac{\\sum_{p,r}{ LP o}_{p,r}}{\\sum_{p,r}{\
  \ LP m}_{p,r}} $$](img/612428_1_En_4_Chapter_TeX_Equ23.png)\n\n(4-22)\n\n在代码实现中，先前生成的`mapPRI`数组值与`mapDIST`数组值之间的相似度分数使用公式\
  \ 4-23 计算，进而生成一个二十维的特征向量。该向量包含了该特定图像所有 MPRI 的相似度分数。然后，这些值被存储在一个名为“dataset1.txt”的.txt\
  \ 文件中。\n\n![$$ sim=\\frac{\\sum_{i,j} mapDIST\\left(i,j\\right). mapPRI\\left(i,j\\\
  right)}{\\sum_{i,j} mapPRI\\left(i,j\\right)+1} $$](img/612428_1_En_4_Chapter_TeX_Equ24.png)\n\
  \n(4-23)\n\n其中：\n\n*   *sim*：表示平均相似度分数\n*   *mapDIST*：从灰度图像中提取 LBP 特征后得到的像素结果数组\n\
  *   *mapPRI*：从每个 MPRI 中提取 LBP 特征后得到的像素数组\n*   *i* 和 *j*：*mapDIST* 和 *mapPRI* 数组中值的索引\n\
  \n二十维特征向量的表示法如公式 4-24 所示：\n\n![$$ sim=\\left[{sim}_{l1},..,{sim}_{l5,}\\ {sim}_{r1},..,{sim}_{r5,\\\
  kern0.5em }{sim}_{b1},..,{sim}_{b5,}{sim}_{n1},..,{sim}_{n5}\\right] $$](images/612428_1_En_4_Chapter/612428_1_En_4_Chapter_TeX_Equ25.png)\n\
  \n(4-24)\n\n其中：\n\n*   *sim*[*l*1] 至 *sim*[*l*5]：受块效应影响的特征向量的相似度分数\n*   *sim*[*r*1]\
  \ 至 *sim*[*r*5]：受振铃效应影响的特征向量的相似度分数\n*   *sim*[*b*1] 至 *sim*[*b*5]：受模糊效应影响的特征向量的相似度分数\n\
  *   *sim*[*n*1] 至 *sim*[*n*5]：受加噪影响的特征向量的相似度分数\n\n### 4.3.6 缩放\n\n在此步骤中，使用“range”文件，因为它包含了每个索引的最小和最大缩放因子，其中最小值列在-1\
  \ 以下，最大值列在 1 以下。用于缩放过程的代码片段使用了以下文件：\n\n*   “dataset1.txt”：包含测试数据\n*   “range”：包含用于将二十维特征向量缩放到[-1.0,\
  \ +1.0]范围的值\n*   “test_ind_scaled”：包含缩放后的值\n\n“range”文件如图 4-16 所示。\n\n![](img/612428_1_En_4_Fig16_HTML.jpg)\n\
  \n20 个索引的最小和最大缩放范围图表。部分数值如下：1. 0, 0.999459。2. 0, 0.998882。3. 0, 0.925888。4. 0, 0.944611。5.\
  \ 0, 0.999877。6. 0.137692, 0.974649。7. 0.137151, 0.980712999\n\n图 4-16\n\nrange\
  \ 文件中的缩放因子\n\n最小和最大缩放因子取自该文件，并分别用作缩放“dataset1.txt”文件中特征向量的下限和上限。公式 4-25 总结了缩放过程：\n\
  \n![$$ {scale}_{ind}=-1.0+\\left(1.0+1.0\\right)\\times \\left(\\frac{value_{ind}-\
  \ feat\\_{\\mathit{\\min}}_{ind}}{feat\\_{\\mathit{\\max}}_{ind}- feat\\_{\\mathit{\\\
  min}}_{ind}}\\right) $$](img/612428_1_En_4_Chapter_TeX_Equ26.png)\n\n(4-25)\n\n\
  其中：\n\n*   *scale*[*ind*]：索引`ind`处的缩放值\n*   *value*[*ind*]：索引`ind`处来自特征向量的测试值\n\
  *   *feat* _ *min*[*ind*]：索引`ind`处的最小缩放因子\n*   *feat* _ *max*[*ind*]：索引`ind`处的最大缩放因子\n\
  \n然后，每个计算出的值都会被打印到“test_ind_scaled”文件中。\n\n### 4.3.7 使用 SVM 进行预测\n\n为了根据获得的相似度分数预测整体图像质量分数，将二十维向量输入\
  \ SVM 进行回归。基于 LIBSVM 库[25]在解决预测问题时的简单性、高效性和可靠性，我们使用了该库。因此，MOS 分数按照公式 4-26 使用`svm_predict()`方法计算：\n\
  \n![$$ FIN= svm\\_ predict\\left(\\mathit{\\operatorname{mod}}, regressor\\right)\\\
  \ \\mathrm{for}\\ \\mathrm{j}\\in d $$](img/612428_1_En_4_Chapter_TeX_Equ27.png)\n\
  \n(4-26)\n\n其中：\n\n*   *FIN*：最终视频质量分数（MOS）\n*   *regressor*：计算出的缩放特征\n*   *mod*：用于近似预测的模型\n\
  \n用于预测方法的代码片段使用了以下文件：\n\n*   “test_ind_scaled”：包含缩放后的值，即用于预测的测试数据\n*   “model”：包含数据集模型\n\
  *   “output.txt”：包含输出结果\n\n因此，`svm_predict()`方法根据“model”文件中的参数来近似测试数据。同时，还会给出一个质量评级以及视频质量分数。一旦确定，servlet\
  \ 会以 JSON 格式将分数写回客户端。\n\n\n\n## 4.4 本章小结\n\n第 4 章介绍了本书中构建的 NTMA 和 VQA 模型所涉及的数学概念。NTMA\
  \ 分类模型使用 KNN 算法创建，而预测模型则使用了经过超参数微调的 MLP 神经网络，以实现最佳精度和性能。针对这两个框架，均给出了简要示例，描述了用于生成任意时刻设备活动状态和预测值的概念与公式。同样，对于\
  \ VQA，使用了 SVM 算法进行 MOS 评分的缩放和预测。以下是一些关键要点：\n\n*   机器学习概念对于增强 NTMA 和 VQA 框架的功能至关重要。\n\
  \n*   在 NTMA 的背景下，分类模型能够根据针对预标记数据集分类的实时网络流量，确定设备活动处于三种状态之一——即空闲、浏览和流媒体。\n\n*   预测算法有助于预测\
  \ NTMA 的网络参数，并计算 VQA 的 MOS 评分。\n\n*   详细描述了用于确定实时视频质量的 BRISQUE 方法。\n\n下一章将介绍 NTMA\
  \ 应用程序的开发，包括系统模型、客户端和服务器结构，以及测试和部署部分。\n\n"
- "# 5. 基于 JavaScript 的 NTMA 应用程序\n\n本章的重点将转向基于前几章阐述的背景进行应用程序开发。首先，将介绍一个完整的系统模型。详细阐述了包含客户端-服务器交互的架构，以及每个模块的功能和消息。简而言之，浏览器扩展与后端（即\
  \ Node.js）相结合，使用 HTML、CSS 和 JavaScript 的组合来构建客户端。通过客户端与 Node.js 服务器之间的双工通信，从设备的网络接口获取网络流量参数，然后对这些参数进行预测和分类的机器学习（ML）处理。因此，可以使用最终用户设置的预测时间和窗口大小变量的组合，实时预测延迟、抖动、上传和下载速率等参数。这也适用于分类目的，可以在几秒钟内确定设备的实时活动状态。通过在不同网络场景下对应用程序进行彻底的测试和部署，构建了一个功能完善、可靠且轻量级的网络流量监控与分析（NTMA）应用程序。\n\
  \n## 5.1 NTMA 系统模型\n\n在本节中，NTMA 框架的系统模型被分解为其组成部分。其基本原理涉及客户端-服务器范式，其中客户端是一个浏览器扩展，服务器是一个运行在同一设备或另一设备上的\
  \ Node.js 服务器。因此，最终用户拥有一个具备以下功能的仪表板：\n\n1.  通过浏览器扩展，直接在 Web 浏览器中监控实时网络参数。\n\n2.\
  \  基于汇总为实时值的历史数据，获取回归和分类分析结果。\n\n3.  获取网络性能的服务质量（QoS）评分。\n\n所描述的功能被编码实现，以便在预定义且可自定义的时间段内监控网络流量。该扩展使用\
  \ JavaScript (JS) 和 Node.js 混合编码，其中 Node.js 提供服务器端功能，并包含所需的库以及访问网络接口以读取网络流量变化的权限。前端使用\
  \ HTML 和 CSS 的组合构建，而扩展和服务器之间通过以 JSON 格式发送和接收的消息实现无缝双向通信。这些属性共同构成了 NTMA 框架的一部分，该框架由服务器在与客户端的全双工通信中按需生成，利用一系列机器学习技术实现预测和分类。在监控网络趋势中的不同行为后，后端触发分析程序，这些程序作用于历史数据和实时数据的组合，其中历史数据从存储在设备上的本地数据库中获取。这有助于提高算法在分类和预测过程中的性能精度。最显著的现代特性是能够通过远程服务器在浏览器插件中使用\
  \ NTMA。整个扩展包需要四个基本文件来向服务器推送数据以及从服务器检索数据，如图 5-1 所示的完整系统模型所示。\n\n![](img/612428_1_En_5_Fig1_HTML.jpg)\n\
  \n网络流量监控分析系统模型的示意流程图。浏览器扩展包通过端口 8080 上的双向 Web Socket 通信连接到 Node.js 服务器。\n\n图 5-1\n\
  完整的 NTMA 系统模型\n\n\n\n### 5.1.1 组件与功能\n\n扩展程序与服务器之间通过持续的 JSON 格式双向信息传输进行通信。这是由 WebSocket\
  \ 库 [1] 实现的，因为它能够通过单个持久连接双向传输微小的数据块。为了向服务器发送消息和从服务器接收消息，整个扩展程序包需要四个核心文件。这些文件汇总于表\
  \ 5-1。\n\n表 5-1\n\nNTMA 的文件功能\n\n| 文件 | 功能 |\n| --- | --- |\n| **popup.html** |\
  \ 此 HTML 文件定义了扩展程序弹出窗口的结构和内容，在本例中，即用户点击浏览器工具栏中的扩展程序图标时出现的仪表板。它包含前端，即 UI 元素，例如监控图、终端以及用于联系服务器并启动\
  \ NTMA 流程的按钮。 |\n| **background.js** | 作为一个在扩展程序后台运行并贯穿整个包生命周期的 JS 文件，它负责处理围绕扩展程序不同方面的事件、状态和任务。这些脚本通常用于监督长期连接、处理通信范式以及后台操作。\
  \ |\n| **pop.js** | 此 JS 文件充当 popup.html 文件的逻辑层，包含与 UI 元素交互并触发时调用的函数。因此，它处理用户交互或弹出窗口内的任何动态内容。在此程序中，它处理与服务器的数据通信并更新\
  \ DOM。 |\n| **manifest.json** | 这是一个 JSON 格式的配置文件，指定要使用的脚本以及管理标签页访问权限的权限。它还包含元数据，例如扩展程序的名称、版本、权限、操作和图标图像源。浏览器从此文件中获取有关扩展程序的信息。\
  \ |\n| **server.js** | 此 JS 文件通过 Node.js 运行，并充当扩展程序的后端服务器。它处理与客户端（即浏览器扩展程序）的通信。在此应用程序中，它负责监控来自网络接口的网络流量参数，并将其组织成时间序列数组，然后执行预测和分类，同时实时更新客户端的监控图。此文件中包含多个库，以实现与客户端的无缝交互。\
  \ |\n\n当访问任何在线页面时，流量扩展程序可用于观察并收集一分钟内的实时网络指标，包括以 Kbps 为单位的下载和上传速度以及以 ms 为单位的延迟。这是通过\
  \ “systeminformation” Node.js 包 [2] 实现的，该包直接访问设备的网络接口，记录涉及浏览器和后台活动的总带宽。用户输入一个“预测时间”参数，该参数指的是将要预测变量的时间点，以及一个“窗口大小”字段，该字段包含一个通常用于构建\
  \ ML 模型的原则，如前文第 4 章所述。客户端的动态图是使用 Chart JS [3] 创建的。\n\n### 5.1.2 网络流量的预测与分类\n\n在本研究中，收集到的流量在输入预测和分类方法之前，会经过一系列数据准备步骤。这代表了\
  \ ML 阶段，其中分类使用 K 近邻（KNN）算法执行，预测则使用多层感知器（MLP）框架，该框架属于神经网络类别。由于分类涉及对可转化为类别的事件进行预测，第一步是对数据集进行预标记。此处的目标是正确地将网络流量解释为“空闲”、“浏览”或“流媒体”。因此，训练数据集是通过在上述网络设置中收集数据来构建的。每个元组根据以一秒为间隔记录的当前网络行为状态被赋予一个数字标签。然后，数据集被存储在本地。总之，使用最优的五个邻居数，KNN\
  \ 算法通过 “ml-knn” Node 模块 [4] 被用来动态确定网络的实时状态。同样地，“mlp” Node 模块 [5] 负责 MLP 预测，以预测用户指定的感兴趣时间段内被动网络特征的值。Node.js\
  \ 服务器执行所有计算，然后将结果发送回客户端，并在客户端呈现给用户。\n\n### 5.1.3 NTMA 应用程序布局\n\n对于此应用程序，构建了一个包含多个组件的单一窗口，这些组件方便了用户的交互，而网络监控过程则在后台进行。一个实时图表描绘了网络流量，可以动态调整以仅查看所需的参数。“窗口大小”字段包含一个值，该值决定了用于预测预测值的样本数量，该预测值由“预测流量（秒）”字段表示，该字段又对应于用户希望预测值出现的时间点。然后，下载和上传速度以及延迟的预测值会连同计算出的\
  \ QoS 分数一起显示在 UI 上，该分数代表网络的实时性能。这些过程在按下“监控与分析”按钮时发生。除了预测功能外，网络活动状态的描述也通过 ML 计算得出，并连同平均延迟一起显示在用户界面上。完成的扩展程序如图\
  \ 5-2 所示。\n\n![](img/612428_1_En_5_Fig2_HTML.jpg)\n\n一张截图展示了网络流量监控分析应用程序的概览。它呈现了一个数值与时间（秒）的折线图。针对窗口大小和预测流量的预测指标及网络性能被监控和分析。\n\
  \n图 5-2\n\nNTMA 应用程序布局\n\n提取、测量和计算的参数如下：\n\n*   下载速度（kbps）\n\n*   上传速度（kbps）\n\n\
  *   延迟（ms）\n\n*   抖动\n\n*   网络 QoS 分数\n\n图 5-2 展示了在 Twitch 上观看直播视频时，在流媒体场景下生成的实时网络监控、分析和\
  \ QoS 分数。生成的分数为“最优”。在预测时间为 120 秒的情况下，仪表板使用 MLP 回归显示预测变量。该程序还使用 KNN 分类和过去记录的网络流量状态自动识别当前设备活动。因此，用户可以直接从浏览器监控实时网络流量特征，只需点击一个按钮即可向\
  \ Node.js 服务器请求实时分类和回归分析。后者通过 Node.js 终端在本地托管，每次点击按钮时，都会收集一分钟的新实时参数数组。\n\n\n\n\n\
  ### 5.1.4 客户端-服务器交互\n\n图 5-3 以逐步方式展示了浏览器扩展与 Node.js 服务器之间的客户端-服务器通信。\n\n![](img/612428_1_En_5_Fig3_HTML.jpg)\n\
  \n该时序图涉及客户端与服务器之间的 11 个步骤。这些步骤包括扩展启动与 HTTP 握手、全双工通信、预测时间与窗口大小的检索、监控与分析、以及经过 60 秒数据收集后的客户端存储与更新。\n\
  \n**图 5-3**\nNTMA 的客户端-服务器交互\n\n## 5.2 NTMA 的客户端程序结构\n\n本节将介绍构成浏览器扩展客户端的四个文件及其各自的代码。客户端程序结构的概览如图\
  \ 5-4 所示。\n\n![](img/612428_1_En_5_Fig4_HTML.jpg)\n\n客户端程序分类图。它包括 `manifest.json`、`background.js`、`popup.html`\
  \ 和 `pop.js`。每个文件都有进一步的分类。\n\n**图 5-4**\n客户端程序结构\n\n### 5.2.1 配置扩展设置与权限\n\n如前所述，`manifest.json`\
  \ 文件包含元数据，允许浏览器将其添加到“扩展程序”菜单中，从而集成到 Google Chrome 中。代码清单 5-1 包含了此文件中指定的参数，以及注释中每行代码的相应用途。对于\
  \ `\"icons\"` 标签，建议按照代码中给出的命名约定添加三个用户选择的图标。这些是 PNG 文件，使用户能够轻松地在浏览器扩展菜单中识别该应用程序。如果用户希望显示默认图标，也可以省略此标签。\n\
  \n```\n{\n\"manifest_version\": 3,  // Chrome 扩展的清单格式版本。\n\"name\": \"Network Traffic\
