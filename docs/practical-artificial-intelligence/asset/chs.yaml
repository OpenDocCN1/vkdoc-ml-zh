  清单 15-8\n滑动拼图和棋盘类\n```\n\n`Board<T>` 类包含以下属性和变量：\n\n*   `State`：T 值的矩阵；回想一下 T 是泛型的，因此它可以是任何类型，例如整数、字符串或任何其他类型\n\
  *   `Blank`：确定棋盘上要使用的空白元素\n*   `Path`：从根节点到代表此棋盘的节点所构建的路径\n*   `_blankPos`：确定棋盘上空白块位置的整数元组\n\
  *   `_n`：棋盘的行（列）数\n\n\n\n在 `Expand()` 方法中，我们生成当前节点的邻域；换句话说，我们生成相邻棋盘状态的集合（通过向每个可能方向移动空白方块获得）。由于我们可以在正向或反向搜索中生成移动，因此我们定义了\
  \ `Boolean` 变量 `backward` 来标识生成的移动是正向还是反向。利用这个变量，我们控制节点生成的多个方面，并考虑从根节点到目标节点（正向）或从目标节点到根节点（反向）执行搜索的情况。这实际上是双向搜索的意图——执行两次搜索，并使它们在路径上的某一点相遇。这个相遇点决定了解决谜题所需的路径或移动序列。语句\
  \ `Path.Last() != (backwards ? 'U' : 'D')` 保证了在正向或反向搜索中，我们避免在连续移动中重复状态。例如，如果我们在正向搜索中移动，我们不会希望将空白方块向右移动，然后在扩展同一节点时又将其移回左侧，因为那样会使我们回到相同状态，从而导致算法消耗更多计算时间。\n\
  \n在 `Move()` 方法中，我们利用清单 15-8 中所示的 `Move` 枚举来开发空白方块移动背后的逻辑，并确定在棋盘边界条件下某些移动是否可行。同样，语句\
  \ `path = backwards ? \"R\" : \"L\"` 的目的是决定当前步骤执行的移动类型，并确定我们是否在进行反向搜索；然后，此决定作为已“走过”路径的扩展，添加到生成节点的\
  \ `Path` 变量中。请记住，从正向视角看，当反向移动时，右意味着左，左意味着右，上意味着下，下意味着上。因为最终我们希望将这个反向路径与正向路径连接起来，所以我们决定从一开始就将其转换为“正向”版本。为了实现这种转换，我们使用了前面的语句\
  \ `(path = backwards ? \"R\" : \"L\")`。\n\n由于我们需要比较不同的棋盘状态来确定正向和反向搜索是否相遇，我们在 `Board<T>`\
  \ 类上实现了 `IEqualityComparer<Board<T>>` 接口，这迫使我们实现 `Equals()` 和 `GetHashCode()` 方法。后一个方法将留给读者作为练习，在本书中我们简单地让它返回\
  \ 0。第一个方法比较每个棋盘的 `State` 矩阵，如果每个单元格都一致则输出 true；否则输出 false。\n\n双向搜索类如清单 15-9 所示。\n\
  \n```\npublic class Bs\n{\npublic SlidingTilesPuzzle Game { get; set; }\npublic\
  \ Bs(SlidingTilesPuzzle game)\n{\nGame = game;\n}\npublic string BidirectionalBfs()\n\
  {\nvarqueueForward = new Queue>();\nqueueForward.Enqueue(Game.Board);\nvarqueueBackward\
  \ = new Queue>();\nqueueBackward.Enqueue(Game.Goal);\nwhile (queueForward.Count>\
  \ 0 &&queueBackward.Count> 0)\n{\nvarcurrentForward = queueForward.Dequeue();\n\
  varcurrentBackward = queueBackward.Dequeue();\nvarexpansionForward = currentForward.Expand();\n\
  varexpansionBackward = currentBackward.Expand(true);\nforeach (var c in expansionForward)\n\
  {\nif (c.Path.Length == 1 &&c.Equals(c, Game.Goal))\nreturn c.Path;\nqueueForward.Enqueue(c);\n\
  }\nforeach (var c in expansionBackward)\nqueueBackward.Enqueue(c);\nvar path = SolutionMet(queueForward,\
  \ expansionBackward);\nif (path != null)\nreturn path;\n}\nreturn null;\n}\nprivate\
  \ string SolutionMet(Queue>expansionForward, List>expansionBackward)\n{\nfor (vari\
  \ = 0; i()))\n{\nvar first = expansionForward.First(b =>b.Equals(b, expansionBackward[i]));\n\
  return first.Path + new string(expansionBackward[i].Path.Reverse().ToArray());\n\
  }\n}\nreturn null;\n}\n}\n清单 15-9\nBs 类\n```\n\n我们的 BS 算法将执行两次搜索，每次搜索由一个 BFS 过程组成，该过程使用队列按层级遍历状态树。我们实现一个\
  \ BFS 进行正向搜索，另一个进行反向搜索，这两个搜索相遇的点由 `SolutionMet()` 方法迭代检查。循环检查每个 `Path` 长度为 1 的扩展节点是否与目标状态匹配，这作为目标状态距离初始棋盘一步之遥情况的基础案例。图\
  \ 15-8 以图形方式描述了双向搜索算法的运行机制。\n\n![A449374_1_En_15_Fig8_HTML.jpg](img/A449374_1_En_15_Fig8_HTML.jpg)\n\
  \n图 15-8\n\n正向搜索（左侧）和反向搜索（右侧）。中间的点表示 BFS 中当前正在处理的节点，其周围的圆圈代表树的不同层级。蓝色点表示搜索过程中已发现并处理的节点，灰色点表示已入队的节点。绿色点表示两次搜索相遇的节点。\n\
  \n两次搜索在绿色点相遇。为了找到正向和反向搜索之间的这种链接或关系，我们使用 `SolutionMet()` 方法检查已扩展节点的集合（图中的灰色点）。此方法的目的是将正向搜索中所有已入队的点与反向搜索中所有已扩展的节点（距离中间处理节点最近的圆圈中的点）进行比对，查找它们状态或棋盘上的匹配项。如果找到完全匹配，则输出由两次搜索相遇的节点（正向和反向）的子路径相加得到的路径。\n\
