  , \"no\" },\n{ \"sunny\", \"cold\", \"normal\", \"weak\", \"yes\" },\n{ \"rainy\"\
  , \"temperate\", \"normal\", \"weak\", \"yes\" },\n{ \"sunny\", \"temperate\", \"\
