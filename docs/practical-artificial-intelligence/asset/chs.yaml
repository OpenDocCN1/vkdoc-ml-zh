  代码清单 3-6

  用于更新智能体状态（即已访问的单元格）的方法

  ```


  将所有内容整合在一起的方法是 `AgentAction(List<Percepts> percepts)`，如代码清单 3-7 所示。在此方法中，我们遍历从环境中获得的每一种感知并做出相应动作。例如，如果当前单元格是干净的，我们通过将该单元格添加到
  `_cellsVisited` 列表来更新智能体的状态（内部数据结构）；如果我们感知到当前单元格是脏的，我们就清洁它，以此类推，针对每种情况或感知及其后果或动作。此外，代码清单
  3-7 还说明了 `RandomAction(List<Percepts> percepts)` 和 `Move(Percepts p)` 方法。前者选择一个要执行的随机移动感知（`MoveUp`、`MoveDown`
  等），后者执行作为参数提供的移动感知。


  请注意，该智能体在移动之前总是会检查其状态和感知（回想一下 I x P 是有状态智能体的领域），并且它总是会尝试移动到之前未访问过的相邻单元格。


  ```

  public void AgentAction(List percepts)

  {

  if (percepts.Contains(Percepts.Clean))

  UpdateState();

  if (percepts.Contains(Percepts.Dirty))

  Clean();

  else if (percepts.Contains(Percepts.Finished))

  TaskFinished = true;

  else if (percepts.Contains(Percepts.MoveUp) && !_cellsVisited.Contains(new Tuple(X
  - 1, Y)))

  Move(Percepts.MoveUp);

  else if (percepts.Contains(Percepts.MoveDown) && !_cellsVisited.Contains(new Tuple(X
  + 1, Y)))

  Move(Percepts.MoveDown);

  else if (percepts.Contains(Percepts.MoveLeft) && !_cellsVisited.Contains(new Tuple(X,
  Y - 1)))

  Move(Percepts.MoveLeft);

  else if (percepts.Contains(Percepts.MoveRight) && !_cellsVisited.Contains(new Tuple(X,
  Y + 1)))

  Move(Percepts.MoveRight);

  else

  RandomAction(percepts);

  }

  private void RandomAction(List percepts)

  {

  var p = percepts[_random.Next(1, percepts.Count)];

  Move(p);

  }

  private void Move(Percepts p)

  {

  switch (p)

  {

  case Percepts.MoveUp:

  X -= 1;

  break;

  case Percepts.MoveDown:

  X += 1;

  break;

  case Percepts.MoveLeft:

  Y -= 1;

  break;

  case Percepts.MoveRight:

  Y += 1;

  break;

  }

  }

