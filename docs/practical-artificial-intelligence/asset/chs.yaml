  ## 总结


  在本章中，我们介绍了建模和模拟的概念。我们描述了什么是离散事件模拟（DES），并描述了其组成部分（事件、队列等）。我们研究了各种概率分布及其与模拟应用的关系。最后，我们展示了一个完整的示例，其中我们模拟了机场在给定时间内的运行情况，并能够看到各个部分如何组合在一起，创建一个模拟机场工作时间的程序，同时考虑了多个事件（到达、起飞、故障）。在下一章中，我们将开始深入探讨有趣且广阔的监督学习世界。




  '
- "# 9. 支持向量机\n\n在本章中，我们将开始研究监督学习，这是机器学习的一个分支，其算法类似于我们在学校中的学习方式——通过经验以及教授在课堂或训练中介绍的众多示例来学习。\n\
  \n许多监督学习算法由两个阶段组成：训练阶段，学习器会接收到一组训练数据，每个数据都是一个向量及其正确的分类；预测阶段，学习器在学习了与训练数据对应的函数后，现在需要预测新输入数据的正确分类或数值。例如，一个训练数据集可以定义如下：\n\
  \n```\n{  { (2, 3), 1}, { (1, 1), -1}, { (3, 3), 1}  }\n```\n\n请注意，每个 (x, y) 对都附带一个分类或类别，在此例中为\
  \ 1 或 -1。\n\n训练数据通常表示为一对 (v, c)，其中 v 是一个 n 维向量（通常称为特征向量），代表对象的不同属性；c 是针对当前问题该对象的分类或标签。对象可以是任何东西，从人、花朵、化合物到城市、州，基本上任何我们能想象到或可以分类的事物。向量可以指示对象的各种属性，例如位置、高度、重量、强度、性别、人口、含氧量等等。\n\
  \n通常，分类（我们稍后会探讨在此上下文中分类的含义）监督学习算法的学习过程遵循以下几点：\n\n*   **训练**：从作为输入接收的训练数据中，推断出一个函数\
  \ f(x)。该函数描述了数据的结构，并尝试根据从训练数据中学到的结构来分类新的输入数据。\n*   **预测**：假设接收到一个新数据 x，将其分类为 f(x)；即使用学习到的函数\
  \ f 来分类新的输入数据。\n\n监督学习试图解决的两个最重要的问题是分类和回归。\n\n在第一类问题中，我们将输入数据映射到预定义的、离散的类别数量中。因此，我们通过用某个类别标记输入数据来对其进行分类。在这种情况下，我们称该监督学习算法为**分类器**。在后一类问题中，我们不对对象进行分类或归类；而是对某个变量属于某个类别的可能性进行估计。在这类问题中，我们感兴趣的是找到一个能很好地表示数据集的关系。这种关系可以体现在最能逼近该数据集的直线上，就像在一种称为**线性回归**的回归类型中那样；解决这类问题的方法被称为**回归器**。\n\
  \n> **注意**\n>\n> 在分类算法中，输出变量取离散的、分类的值。在回归算法中，输出变量取连续的、实数值。回归算法会预测某一天的温度；分类算法则只会告诉我们天气是热还是不热。\n\
  \n在图 9-1 中，我们可以直观地看到分类器和回归器之间的区别。分类器 (b) 能够将空间划分为多个子空间或类别（图 9-1 中为两个类别），而回归器 (a)\
  \ 则只是试图找到一种结构（图 9-1 中的直线）来最好地逼近当前数据集的形状；由于该数据集具有线性结构，因此线性回归器是一个很好的逼近器。\n\n![A449374_1_En_9_Fig1_HTML.jpg](img/A449374_1_En_9_Fig1_HTML.jpg)\n\
  \n**图 9-1**\n\na) 表示一个回归器，b) 表示一个分类器\n\n在本章中，我们将研究支持向量机算法，该算法应用于数据分类，因此被视为分类器。本章的目的是描述支持向量机算法，并提供该算法的完整\
  \ C# 代码，同时附带一个 Windows Forms 可视化应用程序，以验证所获得的结果（以图形方式显示），并作为测试和说明的工具。在开发支持向量机时，我们将采用两种方法。一种将使用优化库来求解支持向量机试图解决的优化问题，另一种将使用\
  \ Platt 的序列最小优化（SMO）算法来求解同一问题。我们很快就会探讨支持向量机提供了什么元素，使我们能够预测新输入数据的类别。\n\n> **注意**\n\
  >\n> 统计学习理论是机器学习的一个分支，处理基于数据寻找预测函数的问题。统计学习理论已在计算机视觉、语音识别、文本分类、模式识别、生物信息学等领域取得了成功的应用。\n\
  \n\n\n## 什么是支持向量机（SVM）？\n\n支持向量机（SVM）是一种通常应用于分类问题的优化技术。它常被称为分类器，但也已适用于回归等其他优化问题；因此，我们可以断言\
  \ SVM 既可以作为分类器，也可以作为回归器。SVM 算法由弗拉基米尔·瓦普尼克于 20 世纪 60 年代提出，其基础主要依赖于统计学习理论和数学优化。事实上，SVM\
  \ 的训练阶段归结为求解一个优化问题，该问题为我们提供一组权重和一个值（偏置），从而能够对新输入的数据进行分类。\n\n与机器学习许多领域的情况一样，SVM 的核心是从数据中学习结构。在二元分类（仅两个类别）的情况下，SVM\
  \ 算法会找到一个超平面，该超平面相对于每个类别边界上的向量具有最宽的间隔。\n\nn 维空间的超平面是 n-1 维的子空间。例如，当 n = 1 时，我们的空间是一条直线，因此其超平面是点；当\
  \ n = 2 时，我们的空间是通常的二维坐标空间，因此其超平面是直线；当 n = 3 时，我们的空间是三维空间，因此其超平面是二维平面，以此类推。图 9-1\
  \ b) 展示了一个二维空间，其中橙色线代表该空间中的一个超平面。\n\n注意\n\nSVM 用于文本分类任务，例如类别分配、垃圾邮件检测和情感分析。它也常用于图像识别挑战，在基于方面的识别和基于颜色的分类中表现尤为出色。SVM\
  \ 在手写数字识别的许多领域也发挥着重要作用，例如邮政自动化服务。\n\n我们还可以注意到，这个超平面将蓝点与红点分开；我们可以说这是一个分类超平面，因为它将空间分成了两个类别。如图\
  \ 9-2 所示，对于一个给定的分类问题，可能存在多个分类超平面。\n\n![A449374_1_En_9_Fig2_HTML.jpg](img/A449374_1_En_9_Fig2_HTML.jpg)\n\
  \n图 9-2\n\n一个分类问题的各种可能的分类超平面\n\n对于未来输入的数据，并非每个超平面都具有相同的效果。直观上，我们希望有一个分类超平面能够在两个类别之间产生最大的间隔，这样待预测的新数据将有更大的机会被正确分类。\n\
  \n超平面与任一侧（蓝点或红点）最近数据点之间的距离称为间隔（图 9-3）。SVM 的目标是选择一个分类超平面，使得该超平面与训练集中任一类别任何点之间的间隔尽可能大。如前所述，这为我们正确分类新输入数据提供了更好的机会；从这个意义上说，我们可以断言\
  \ SVM 寻找的是用于分类数据的最优超平面。\n\n![A449374_1_En_9_Fig3_HTML.jpg](img/A449374_1_En_9_Fig3_HTML.jpg)\n\
  \n图 9-3\n\n由分类超平面定义的间隔 M\n\n为了找到训练数据集的最优超平面，我们需要找到能够在两个类别之间提供最大可能间隔的分类超平面。因此，SVM\
  \ 的训练阶段包含一个优化问题（更准确地说，是一个二次规划问题），其中我们最大化值 2 x M；换句话说，两倍的间隔将决定由穿过支持向量集的超平面所定义的“街道”的总宽度（图\
  \ 9-4）。定义此间隔的向量称为支持向量。\n\n![A449374_1_En_9_Fig4_HTML.jpg](img/A449374_1_En_9_Fig4_HTML.jpg)\n\
  \n图 9-4\n\n用黑点表示的支持向量\n\n为了得到 M 的公式，首先让我们回顾一下，在二维空间中，直线（二维中的超平面）的公式是 Ax + By + C\
  \ = 0。这个表达式可以推广，从而推导出任何超平面的一般表达式，其公式为 wx + b = 0，其中 w 是一个称为权重向量的向量，b（与直线方程中的 C 对应）是一个称为偏置或截距的实数值；该值决定了超平面在其空间中原点的偏移。因此，当\
  \ b = 0 时，意味着超平面通过原点 (0, 0, … 0)；w 是垂直于超平面的法向量，并定义了其方向。\n\n现在我们有了超平面的公式，可以通过找到支持向量（在图\
  \ 9-4 中标记为黑点）到超平面的距离来得到 M 的值。回想一下，在二维空间中，点 (x′, y′) 到直线的距离由以下公式给出：\n\n![$$ \\mathrm{M}=\\\
  frac{\\mid \\mathrm{A}{\\mathrm{x}}^{\\prime }+\\mathrm{B}{\\mathrm{y}}^{\\prime\
  \ }+\\mathrm{C}\\mid }{\\sqrt{{\\mathrm{A}}²+{\\mathrm{B}}²}} $$](img/A449374_1_En_9_Chapter_Equa.gif)\n\
  \n在一般形式下，在 n 维空间中，M 的公式可以推导如下：\n\n![$$ \\mathrm{M}=\\frac{\\mid \\mathrm{w}\\mathrm{x}+\\\
  mathrm{b}\\mid }{\\left\\Vert \\mathrm{w}\\right\\Vert } $$](img/A449374_1_En_9_Chapter_Equb.gif)\n\
  \n其中 ||w|| 是权重向量 w 的范数。回想一下，对于向量 v = (v1, v2 …vn)，其范数定义如下：\n\n![$$ \\left\\Vert\
  \ \\mathrm{v}\\right\\Vert ={{\\mathrm{v}}_1}²+{{\\mathrm{v}}_2}²+\\dots +{{\\mathrm{v}}_{\\\
  mathrm{n}}}² $$](img/A449374_1_En_9_Chapter_Equc.gif)\n\n任何超平面都可以通过缩放 w 和 b 以无限多种方式表示。这种归一化或缩放类似于我们有时对百分比使用的缩放类型；我们不将百分比称为\
  \ 85%，而是简单地使用 [0, 1] 范围内的数字，并找到从 85% 到等效值 0.85 的直接映射。在我们的例子中，我们有分类超平面，以及另外两个平行于分类超平面并穿过每个类别支持向量的超平面。通过归一化，我们可以将这些超平面表示如下：\n\
  \n![$$ \\mathrm{wx}+\\mathrm{b}=1 $$](img/A449374_1_En_9_Chapter_Equd.gif)\n\n![$$\
  \ \\mathrm{wx}+\\mathrm{b}=-1 $$](img/A449374_1_En_9_Chapter_Eque.gif)\n\n这种表示称为规范超平面；在这种表示下，假设值已归一化，并且我们试图找到分类超平面上的点到由支持向量形成的任一超平面的距离，我们可以调整\
  \ M 的方程如下：\n\n![$$ \\mathrm{M}=\\frac{\\mid \\mathrm{w}\\mathrm{x}+\\mathrm{b}\\\
  mid }{\\left\\Vert \\mathrm{w}\\right\\Vert }=\\frac{1}{\\left\\Vert \\mathrm{w}\\\
  right\\Vert } $$](img/A449374_1_En_9_Chapter_Equf.gif)\n\n因此，要最大化的总间隔将是 2 x M =\
  \ 2 / ||w||。请注意，最大化此值等同于最小化以下值：\n\n![$$ \\frac{{\\left\\Vert \\mathrm{w}\\right\\\
  Vert}²}{2} $$](img/A449374_1_En_9_Chapter_Equg.gif)\n\n至此，我们知道需要最小化上述函数，以便找到能够最大化分类超平面与两个类别之间间隔的（权重向量，偏置）对。现在我们需要定义这种优化将在哪组约束条件下进行。\n\
  \n我们已经有了穿过支持向量的超平面方程。由于支持向量定义了空间中每个类别的边界，这些超平面决定了我们的约束条件，因为我们需要每个数据点都位于这些超平面的一侧或另一侧（图\
  \ 9-5）。因此，我们最终得到以下约束条件：\n\n![$$ \\mathrm{wx}+\\mathrm{b}\\ge 1 $$](img/A449374_1_En_9_Chapter_Equh.gif)\n\
  \n![$$ \\mathrm{wx}+\\mathrm{b}\\le -1 $$](img/A449374_1_En_9_Chapter_Equi.gif)\n\
  \n\n\n第一个方程适用于数据点 x 的分类等于 yi = 1 的情况；否则适用于 yi = -1 的情况。请记住，对于每个数据点 x，我们在训练数据集中都有其对应的分类。\n\
  \n![A449374_1_En_9_Fig5_HTML.jpg](img/A449374_1_En_9_Fig5_HTML.jpg)\n\n图 9-5\n\n\
  蓝色点满足方程 wx + b >= 1，红色点满足方程 wx + b <= -1\n\n之前的约束条件可以合并为一个：\n\n![$$ {\\mathrm{y}}_{\\\
  mathrm{i}}\\left({\\mathrm{wx}}_{\\mathrm{i}}+\\mathrm{b}\\right)\\ge 1 $$](img/A449374_1_En_9_Chapter_Equj.gif)\n\
  \n最后，SVM 求解的优化问题表述如下：\n\n![$$ \\underset{\\mathrm{w},\\mathrm{b}}{\\min }{\\frac{\\\
  left\\Vert \\mathrm{w}\\right\\Vert }{2}}² $$](img/A449374_1_En_9_Chapter_Equk.gif)\n\
  \n![$$ \\mathrm{subject}\\ \\mathrm{to}:{\\mathrm{y}}_{\\mathrm{i}}\\left({\\mathrm{wx}}_{\\\
  mathrm{i}}+\\mathrm{b}\\right)\\ge 1 $$](img/A449374_1_En_9_Chapter_Equl.gif)\n\n\
  此刻请记住，刚刚提出的优化问题对应于一个线性 SVM 分类器；换句话说，我们假设训练数据集是线性可分的。那么 SVM 分类器函数如下所示：\n\n![$$ \\\
  operatorname{sign}\\left(\\mathrm{wx}+\\mathrm{b}\\right) $$](img/A449374_1_En_9_Chapter_Equm.gif)\n\
  \n![$$ \\operatorname{sign}\\left(\\mathrm{x}\\right)=\\Big\\{{\\displaystyle \\\
  begin{array}{c}-1\\kern0.50em \\ \\ \\ \\ \\mathrm{if}\\ \\ \\mathrm{x}<0\\\\ {}\\\
  \ \\ \\ \\ 0\\ \\ \\ \\ \\ \\ \\mathrm{if}\\ \\ \\mathrm{x}=0\\\\ {}\\ \\ \\ \\\
  \ 1\\kern0.50em \\ \\ \\ \\ \\ \\mathrm{if}\\ \\ \\mathrm{x}>0\\end{array}} $$](img/A449374_1_En_9_Chapter_Equn.gif)\n\
  \n注意，如果 wx + b >= 1，则数据点 x 属于类别 1；否则，x 属于类别 -1。正如我们所见，只要拥有 w 和 b 作为最优分类超平面的权重向量和偏置，我们就能对新的输入数据进行分类。\n\
  \n尽管目前我们已经得到了一个优化问题的公式，其解确实能引导我们找到分类超平面的最大间隔，但这个公式通常会被弃用，转而采用一个更便于计算和优化本身的公式。这个新公式基于拉格朗日乘子和沃尔夫对偶问题等价性。\n\
  \n对偶性在优化理论中扮演着关键角色，许多优化问题都有一个称为对偶问题的关联优化问题。这种问题的替代公式拥有一组解，这些解与原问题（称为原始问题）的解相关。特别是，对于一大类问题，原始解可以很容易地从对偶解中计算出来。此外，在我们本章处理的具体问题中，对偶公式提供了更易于处理的约束条件，这些条件也非常适合核函数（我们很快就会讨论它们）。\n\
  \n像我们这样的约束优化问题可以通过拉格朗日方法求解。该方法允许我们在满足一组约束的条件下，找到多变量函数的最大值或最小值。它通过添加 n + k 个变量（其中\
  \ k 是原始问题的约束数量）将约束问题简化为无约束问题。这些新变量被称为拉格朗日乘子。使用这种变换后，得到的问题将包含比原始问题更容易求解的方程。\n\n具有约束条件\
  \ ![$$ {\\mathrm{g}}_{\\mathrm{i}}\\left(\\mathrm{x}\\right)=0\\left(\\mathrm{i}=1\\\
  dots \\mathrm{m}\\right) $$](img/A449374_1_En_9_Chapter_IEq1.gif) 的函数 f(x) 的拉格朗日函数如下：\n\
  \n![$$ \\mathrm{L}\\left(\\mathrm{x},\\alpha \\right)=\\mathrm{f}\\left(\\mathrm{x}\\\
  right)+\\sum \\limits_{\\mathrm{i}=1}^{\\mathrm{m}}{\\alpha}_{\\mathrm{i}}{\\mathrm{g}}_{\\\
  mathrm{i}}\\left(\\mathrm{x}\\right) $$](img/A449374_1_En_9_Chapter_Equo.gif)\n\n\
  注意，新公式没有约束条件；它们已被封装到当前唯一的函数 L(x, α) 中。在这种情况下，α[i] 代表拉格朗日乘子。让我们将原始问题的目标函数和约束条件代入\
  \ L(w, b, α)：\n\n![$$ \\mathrm{L}\\left(\\mathrm{w},\\mathrm{b},\\alpha \\right)=\\\
  frac{{\\left\\Vert \\mathrm{w}\\right\\Vert}²}{2}-\\sum \\limits_{\\mathrm{i}=1}^{\\\
  mathrm{m}}{\\alpha}_{\\mathrm{i}}\\left({\\mathrm{y}}_{\\mathrm{i}}\\left({\\mathrm{wx}}_{\\\
  mathrm{i}}+\\mathrm{b}\\right)-1\\right) $$](img/A449374_1_En_9_Chapter_Equp.gif)\n\
  \n上述表达式使用了广义拉格朗日形式，它不仅包含等式约束，还包含不等式约束 ![$$ {\\mathrm{g}}_{\\mathrm{i}}\\left(\\\
  mathrm{x}\\right)\\le 0 $$](img/A449374_1_En_9_Chapter_IEq2.gif) 或等价地 ![$$ -{\\\
  mathrm{g}}_{\\mathrm{i}}\\left(\\mathrm{x}\\right)\\ge 0 $$](img/A449374_1_En_9_Chapter_IEq3.gif)。一旦我们引入了拉格朗日乘子，我们只需要找到问题的对偶形式。具体来说，我们将找到问题的沃尔夫对偶形式。为此，我们相对于\
  \ w 和 b 最小化 L，这通过求解以下方程来实现，其中 ![$$ {\\nabla}_{\\mathrm{x}}\\mathrm{L}\\left(\\mathrm{w},\\\
  mathrm{b},\\alpha \\right) $$](img/A449374_1_En_9_Chapter_IEq4.gif) 表示 L 相对于 x 的梯度：\n\
  \n![$$ {\\nabla}_{\\mathrm{w}}\\mathrm{L}\\left(\\mathrm{w},\\mathrm{b},\\alpha\
  \ \\right)=0 $$](img/A449374_1_En_9_Chapter_Equq.gif)\n\n![$$ {\\nabla}_{\\mathrm{b}}\\\
  mathrm{L}\\left(\\mathrm{w},\\mathrm{b},\\alpha \\right)=0 $$](img/A449374_1_En_9_Chapter_Equr.gif)\n\
  \nL 相对于 w 的导数得出以下结果：\n\n![$$ {\\nabla}_{\\mathrm{w}}\\mathrm{L}\\left(\\mathrm{w},\\\
  mathrm{b},\\alpha \\right)=\\mathrm{w}-\\sum \\limits_{\\mathrm{i}=1}^{\\mathrm{m}}{\\\
  alpha}_{\\mathrm{i}}{\\mathrm{y}}_{\\mathrm{i}}{\\mathrm{x}}_{\\mathrm{i}}=0 $$](img/A449374_1_En_9_Chapter_Equs.gif)\n\
  \n这意味着：\n\n![$$ \\mathrm{w}=\\sum \\limits_{\\mathrm{i}=1}^{\\mathrm{m}}{\\alpha}_{\\\
  mathrm{i}}{\\mathrm{y}}_{\\mathrm{i}}{\\mathrm{x}}_{\\mathrm{i}} $$](img/A449374_1_En_9_Chapter_Equt.gif)\n\
  \n至于相对于 b 的梯度，结果如下：\n\n![$$ {\\nabla}_{\\mathrm{b}}\\mathrm{L}\\left(\\mathrm{w},\\\
  mathrm{b},\\alpha \\right)=\\sum \\limits_{\\mathrm{i}=1}^{\\mathrm{m}}{\\alpha}_{\\\
  mathrm{i}}{\\mathrm{y}}_{\\mathrm{i}}=0 $$](img/A449374_1_En_9_Chapter_Equu.gif)\n\
  \n将新得到的 w 公式代入，并考虑到 ![$$ \\sum \\limits_{\\mathrm{i}=1}^{\\mathrm{m}}{\\alpha}_{\\\
  mathrm{i}}{\\mathrm{y}}_{\\mathrm{i}}=0 $$](img/A449374_1_En_9_Chapter_IEq5.gif)，我们可以将\
  \ L(w, b, α) 调整如下：\n\n![$$ \\mathrm{L}\\left(\\mathrm{w},\\mathrm{b},\\alpha \\\
  right)=\\sum \\limits_{\\mathrm{i}=1}^{\\mathrm{m}}{\\alpha}_{\\mathrm{i}}-\\frac{1}{2}\\\
  sum \\limits_{\\mathrm{i},\\mathrm{j}=1}^{\\mathrm{m}}{\\mathrm{y}}_{\\mathrm{i}}{\\\
  mathrm{y}}_{\\mathrm{j}}{\\alpha}_{\\mathrm{i}}{\\alpha}_{\\mathrm{j}}{\\mathrm{x}}_{\\\
  mathrm{i}}{\\mathrm{x}}_{\\mathrm{j}} $$](img/A449374_1_En_9_Chapter_Equv.gif)\n\
  \n注意，由于 x[i] 和 x[j] 是向量，x[i]x[j] 表示它们的内积。因此，我们最终得到了对偶问题的表达式，实际上这也是大多数 SVM 库和包所求解的优化问题，原因在于前面提到的优势。完整的优化问题如下所示：\n\
  \n\n\n![$$ {\\displaystyle \\begin{array}{l}\\underset{\\alpha }{\\max}\\mathrm{L}\\\
  left(\\mathrm{w},\\mathrm{b},\\alpha \\right)=\\sum \\limits_{\\mathrm{i}=1}^{\\\
  mathrm{m}}{\\alpha}_{\\mathrm{i}}-\\frac{1}{2}\\sum \\limits_{\\mathrm{i},\\mathrm{j}=1}^{\\\
  mathrm{m}}{\\mathrm{y}}_{\\mathrm{i}}{\\mathrm{y}}_{\\mathrm{j}}{\\alpha}_{\\mathrm{i}}{\\\
  alpha}_{\\mathrm{j}}{\\mathrm{x}}_{\\mathrm{i}}{\\mathrm{x}}_{\\mathrm{j}}\\\\ {}\\\
  kern0.50em \\ \\kern0.50em \\ \\kern0.50em \\ \\kern0.50em \\ \\kern0.50em \\ \\\
  kern0.50em \\ \\kern0.50em \\ \\kern0.50em \\ \\kern0.50em \\ \\kern0.50em \\ \\\
  mathrm{s}.\\mathrm{t}\\kern0.50em \\ \\kern0.50em \\ \\kern0.50em \\ \\kern0.50em\
  \ \\ \\kern0.50em \\sum \\limits_{\\mathrm{i}=1}^{\\mathrm{m}}{\\alpha}_{\\mathrm{i}}{\\\
  mathrm{y}}_{\\mathrm{i}}=0\\\\ {}\\kern0.50em \\ \\kern0.50em \\ \\kern0.50em \\\
  \ \\kern0.50em \\ \\kern0.50em \\ \\kern0.50em \\ \\kern0.50em \\ \\kern0.50em \\\
  \ \\kern0.50em \\ \\kern0.50em \\ \\ {\\alpha}_{\\mathrm{i}}\\ge 0\\ \\kern0.50em\
  \ \\ \\mathrm{i}=1,\\dots \\mathrm{m}\\end{array}} $$](img/A449374_1_En_9_Chapter_Equw.gif)\n\
  \n在下一节中，我们将看到一个实际问题，该问题（对偶问题）将使用 C# 中的优化库来解决。这个问题将帮助我们理解本章介绍的一些概念和思想。\n\n注意\n\n\
  函数 f 的梯度通常用符号 ![$$ \\nabla $$](img/A449374_1_En_9_Chapter_IEq6.gif) 表示，放在函数名之前（![$$\
  \ \\nabla f $$](img/A449374_1_En_9_Chapter_IEq7.gif)）。它是一个向量，由 f 对每个变量的导数构成，并指示了在给定点处\
  \ f 的最大增量方向。例如，假设 f 是一个将空间中每个点映射到给定压力的函数，那么梯度将指示从任何点 (x, y, z) 出发，压力变化最快的方向。\n\n\
  ## 实际问题：C# 中的线性 SVM\n\n为了开发我们的线性 SVM，我们将创建一个名为 `LinearSvmClassifier` 的类，该类具有以下字段或属性（列表\
  \ 9-1）。\n\n```\npublic class LinearSvmClassifier\n{\npublic ListTrainingSamples{\
  \ get; set; }\npublic double[] Weights;\npublic double Bias;\npublic List>SetA{\
  \ get; set; }\npublic List>SetB{ get; set; }\npublic List> Hyperplane { get; set;\
  \ }\nprivate readonlydouble[] _alphas;\npublic intModelToUse = 1;\npublic LinearSvmClassifier(IEnumerabletrainingSamples)\n\
  {\nTrainingSamples = new List(trainingSamples);\nWeights = new double[TrainingSamples.First().Features.Length];\n\
  SetA = new List>();\nSetB = new List>();\nHyperplane = new List>();\n_alphas = new\
  \ double[TrainingSamples.Count];\n}\n}\npublic class TrainingSample\n{\npublic int\
  \ Classification { get; set; }\npublic double[] Features { get; set; }\npublic TrainingSample(double\
  \ [] features, int classification)\n{\nFeatures = new double[features.Length];\n\
  Array.Copy(features, Features, features.Length);\nClassification = classification;\n\
  }\n}\n列表 9-1\n我们的线性 SVM 的属性和字段\n```\n\n每个属性或字段描述如下：\n\n*   `TrainingSamples`：`TrainingSample`\
  \ 对象的列表；每个对象代表一个数据点及其分类。列表 9-1 中展示的 `TrainingSample` 类仅包含一个双精度浮点数数组 `Features` 和一个整数\
  \ `Classification`。\n*   `Weights`：表示 SVM 模型中权重的双精度浮点数数组。\n*   `Bias`：表示 SVM 模型中偏置或截距的双精度浮点数。\n\
  *   `SetA`：`Tuple<double, double>` 的列表，表示训练数据中满足 wx + b >= 1 的点。仅在预测阶段使用。\n*   `SetB`：`Tuple<double,\
  \ double>` 的列表，表示训练数据中满足 wx + b <= -1 的点。仅在预测阶段使用。\n*   `Hyperplane`：`Tuple<double,\
  \ double>` 的列表，表示训练数据中满足 wx + b = 0 的点；即位于超平面上的点。仅在预测阶段使用。\n*   `_alphas`：表示 SVM\
  \ 对偶问题中 alpha 值的双精度浮点数数组。\n*   `ModelToUse`：确定 SVM 训练阶段所使用的训练方法。\n\n编码了对偶优化问题的 `Training()`\
  \ 方法如列表 9-2 所示。我们使用 Accord.NET 库作为求解 SVM 模型的优化工具。你可以通过网页或使用 Visual Studio 提供的 Nuget\
  \ 包管理器从 Nuget 下载 Accord.NET。\n\n```\npublic void Training()\n{\nvar coefficients\
  \ = new Dictionary, double>();\nModelToUse = 1;\nfor (vari = 0; i(i, j),\n-1 * TrainingSamples[i].Classification\
  \ * TrainingSamples[j].Classification *\nTrainingSamples[i].Features.Dot(TrainingSamples[j].Features));\n\
  }\nvar q = new double[TrainingSamples.Count, TrainingSamples.Count];\nq.SetInitValue(coefficients);\n\
  // 此变量包含 (1, 1, ..., 1)\nvar d = Enumerable.Repeat(1.0, TrainingSamples.Count).ToArray();\n\
  var objective = new QuadraticObjectiveFunction(q, d);\n// sum(ai * yi) = 0\nvar\
  \ constraints = new List\n{\nnew LinearConstraint(d)\n{\nVariablesAtIndices=Enumerable.Range(0,\
  \ TrainingSamples.Count).ToArray(),\nShouldBe = ConstraintType.EqualTo,\nValue =\
  \ 0,\nCombinedAs = TrainingSamples.Select(t =>t.Classification).ToArray().ToDouble()\n\
  }\n};\n// 0 <= ai\nfor (vari = 0; i<TrainingSamples.Count; i++)\n{\nconstraints.Add(new\
  \ LinearConstraint(1)\n{\nVariablesAtIndices = new[] { i },\nShouldBe = ConstraintType.GreaterThanOrEqualTo,\n\
  Value = 0\n});\n}\nvar solver = new GoldfarbIdnani(objective, constraints);\nif\
  \ (solver.Maximize())\n{\nvar solution = solver.Solution;\nUpdateWeightVector(solution);\n\
  UpdateBias();\n}\nelse\nConsole.WriteLine(\"错误 ...\");\n}\n列表 9-2\n使用 Accord.NET\
  \ 建模对偶优化问题的 Training() 方法\n```\n\n\n\n为了解决这个优化问题，我们将使用约束优化问题求解器 `GoldfarbIdnani`；这个求解器以及许多其他求解器都可以在\
  \ Accord.NET 库中找到。在 `GoldfarbIdnani` 类的构造函数中，有多种指定目标函数和约束的方式；在本例中，我们选择将目标函数指定为 `QuadracticObjectiveFunction`\
  \ 类，并将约束集指定为 `LinearConstraint` 类的实例。代表目标函数的 `QuadracticObjectiveFunction` 是通过指定目标函数的\
  \ Hessian 矩阵和线性项向量来声明的。从清单 9-2 中可以看出，`Training()` 方法首先将一组值存储到 `Dictionary<Tuple<int,\
  \ int>, double>` 中，其中第一个项（`Tuple<int i, int j>`）表示 Hessian 矩阵中系数所属的变量 i, j。\n\n\
  注意\n\nn 个变量的函数 f 的 Hessian 矩阵 H 是一个 n x n 矩阵，包含 f 关于每个 n 变量的二阶导数。我们可以说 f 是凸函数当且仅当\
  \ H 是半正定矩阵；即，它的所有特征值都是正的。\n\n目标函数关于变量 α[i] 的 Hessian 矩阵具有以下形式：\n\n![$$ -{1}^{\\\
  ast }{\\left[{\\mathrm{y}}_{\\mathrm{i}}{\\mathrm{y}}_{\\mathrm{j}}{\\mathrm{x}}_{\\\
  mathrm{i}}{\\mathrm{x}}_{\\mathrm{j}}\\right]}_{\\mathrm{mxm}} $$](A449374_1_En_9_Chapter_Equx.gif)\n\
  \n这个矩阵是半负定的，这表明我们的问题是凹的，而不是凸的。如果 H 是半正定的，那么我们的问题是凸的，这意味着任何收敛到局部最小值的优化器也会收敛到全局最小值，因为对于凸问题，这两组最小值是重合的。此外，这可以在多项式时间内完成，并且可以利用问题的二次结构；因此，它在实践中会很快。相反，如果\
  \ H 至少有一个负特征值，那么你的问题就是非凸的。当 H 至少有一个负特征值时，该问题被认为是 NP 难的。\n\n在 `Training()` 方法中，使用\
  \ Accord.NET 的对象和属性可以轻松定义线性约束集，这些对象和属性是不言自明的；唯一可能引起疑问的属性是 `LinearConstraint` 对象的\
  \ `CombineAs` 属性。`CombineAs` 允许我们指示伴随 `VariablesAtIndices` 属性中指定变量的标量系数，在本例中为 α[i]y[i]。\n\
  \n清单 9-3 中所示的 `UpdateWeightVector()` 和 `UpdateBias()` 方法负责根据前面描述的公式更新权重向量和偏置。\n\n\
  ```\nprivate void UpdateWeightVector(double [] alphas)\n{\n    var len = TrainingSamples.First().Features.Length;\n\
  \    for (var i = 0; i < len; i++)\n    {\n        for (var j = 0; j < TrainingSamples.Count;\
  \ j++)\n            Weights[i] += TrainingSamples[j].Classification * alphas[j]\
  \ *\n                          TrainingSamples[j].Features[i];\n    }\n}\nprivate\
  \ void UpdateBias()\n{\n    var x = TrainingSamples.First().Features;\n    Bias\
  \ = 1;\n    for (var i = 0; i < x.Length; i++)\n        Bias -= Weights[i] * x[i];\n\
  }\n清单 9-3\n用于更新分类超平面权重和偏置的方法\n```\n\n`Training()` 方法中使用的最后一个方法必须解释：`SetInitValue()`\
  \ 方法，它属于我们创建的一个扩展类，用于简化代码并避免不必要的循环以及与使用它们的方法的核心功能不对应的想法。这个扩展类及其方法在清单 9-4 中进行了说明。\n\
  \n```\npublic static class ArrayDoubleExtended\n{\n    public static void SetInitValue(this\
  \ double[,] q, Dictionary<Tuple<int, int>, double> coefficients, double epsilon\
  \ = 0.000001)\n    {\n        for (var i = 0; i < q.GetLength(0); i++)\n       \
  \     for (var j = 0; j < q.GetLength(1); j++)\n            {\n                q[i,\
  \ j] = coefficients[Tuple.Create(i, j)];\n                if (i == j)\n        \
  \            q[i, j] -= epsilon;\n            }\n    }\n    public static IEnumerable<int>\
  \ GetIndicesFromValues(this double[] toCompare, params double[] values)\n    {\n\
  \        var result = new List<int>();\n        for (var i = 0; i < toCompare.Length;\
  \ i++)\n            for (var j = 0; j < values.Length; j++)\n                if\
  \ (toCompare[i] == values[j])\n                    result.Add(i);\n        return\
  \ result;\n    }\n    public static double[] RoundValues(this double[] list, int\
  \ decimals)\n    {\n        var result = new double[list.Length];\n        for (var\
  \ i = 0; i < list.Length; i++)\n            result[i] = Math.Round(list[i], decimals);\n\
  \        return result;\n    }\n}\n清单 9-4\n包含扩展方法的类\n```\n\n`SetInitValue()` 方法用之前解释过的系数字典中的值填充\
  \ Hessian 矩阵的值。注意 epsilon 值，它从主对角线上的每个值中减去一个微小的量。这是必要的，因为我们的函数不是凸函数；因此，我们稍微改变这些值，试图将其变为半正定矩阵。我们之后必须考虑由这种改变产生的数值误差。如果矩阵不满足这个条件，`GoldfarbIdnani`\
  \ 求解器将不会给出解。\n\n`GetIndicesFromValues()` 方法保存两个数组中包含的值的索引，而 `RoundValues()` 方法根据指定的小数位数对值数组进行四舍五入。最后，`Predict()`\
  \ 方法如清单 9-5 所示。\n\n```\npublic void Predict(IEnumerable<double[]> elems)\n{\n  \
  \  var roundWeights = Weights.RoundValues(2).ToArray();\n    var roundBias = new[]\
  \ { Bias }.RoundValues(2).ToArray();\n    foreach (var e in elems)\n    {\n    \
  \    var @class = Math.Sign(e.Dot(roundWeights) + ModelToUse * roundBias.First());\n\
  \        if (@class >= 1)\n            SetA.Add(new Tuple<double, double>(e[0],\
  \ e[1]));\n        else if (@class <= -1)\n            SetB.Add(new Tuple<double,\
  \ double>(e[0], e[1]));\n        else\n            Hyperplane.Add(new Tuple<double,\
  \ double>(e[0], e[1]));\n    }\n}\n清单 9-5\nPredict() 方法\n```\n\n在 `Predict()` 方法中，我们首先对权重和偏置值进行四舍五入，然后对于每个元素或新的数据点，我们使用我们已经熟知的超平面方程（wx\
  \ + b）来获取其类别。如果其类别大于或等于 1，我们将其添加到 `SetA`；如果小于或等于 -1，我们将其添加到 `SetB`；否则，它必须满足 wx +\
  \ b = 0，因此它属于分类超平面。\n\n为了测试我们的超平面方程并查看它如何很好地分离或分类我们的数据点，我们创建了一个 Windows Forms 应用程序，该应用程序使用\
  \ OxyPlot 库来绘制图形。你可以通过网络在 Nuget 上获取 OxyPlot，或者使用 Visual Studio 附带的 Nuget 包管理器。清单\
  \ 9-6 展示了我们 Windows Forms 应用程序的 `SvmGui` 类。\n\n```\npublic partial class SvmGui\
  \ : Form\n{\n    private readonly MainViewModel _plot;\n    public SvmGui(double[]\
  \ weights, double bias, int model, IEnumerable<Tuple<double, double>> setA, IEnumerable<Tuple<double,\
  \ double>> setB, IEnumerable<Tuple<double, double>> hyperplane = null)\n    {\n\
  \        InitializeComponent();\n        _plot = new MainViewModel(weights, bias,\
  \ model, setA, setB, hyperplane);\n        var view = new OxyPlot.WindowsForms.PlotView\n\
  \        {\n            Width = Width,\n            Height = Height,\n         \
  \   Parent = this,\n            BackColor = Color.WhiteSmoke,\n            Model\
  \ = _plot.Model\n        };\n    }\n}\n清单 9-6\nSvmGui Windows Forms 类，我们在其中绘制获得的结果\n\
  ```\n\n正如我们所见，这个类非常简单；我们只需要创建一个 `PlotModel`（由 `MainViewModel` 类完成）和一个显示此模型的 `PlotView`。`MainViewModel`\
  \ 类如清单 9-7 所示。\n\n\n\n```\npublic class MainViewModel\n{\npublic PlotModel Model\
  \ { get; set; }\npublic MainViewModel(double[] weights, double bias, int model,\
  \ IEnumerable>setA, IEnumerable>setB, IEnumerable> hyperplane = null)\n{\nModel\
  \ = new PlotModel{ Title = \"SVM by SMO\" };\nvarscatterPointsA = setA.Select(e\
  \ => new ScatterPoint(e.Item1, e.Item2)).ToList();\nvarscatterPointsB = setB.Select(e\
  \ => new ScatterPoint(e.Item1, e.Item2)).ToList();\nvar h = new List();\nif (hyperplane\
  \ != null)\nh = hyperplane.Select(e => new ScatterPoint(e.Item1, e.Item2)).ToList();\
  \ ;\nvarscatterSeriesA = new ScatterSeries\n{\nMarkerFill = OxyColor.FromRgb(255,\
  \ 0, 0),\nItemsSource = scatterPointsA,\n};\nvarscatterSeriesB = new ScatterSeries\n\
  {\nMarkerFill = OxyColor.FromRgb(0, 0, 255),\nItemsSource = scatterPointsB\n};\n\
  varscatterSeriesH = new ScatterSeries\n{\nMarkerFill = OxyColor.FromRgb(0, 255,\
  \ 255),\nItemsSource = h\n};\nModel.Series.Add(scatterSeriesA);\nModel.Series.Add(scatterSeriesB);\n\
  Model.Series.Add(scatterSeriesH);\nModel.Series.Add(GetFunction(weights, bias, model));\n\
  }\npublic FunctionSeriesGetFunction(double [] w, double b, int model)\n{\nconst\
  \ int n = 10;\nvar series = new FunctionSeries();\nfor (var x = 0.0; x < n; x +=\
  \ 0.01)\n{\nfor (var y = 0.0; y < n; y += 0.01)\n{\n//根据 x, y 添加点\nvarfunVal = GetValue(x,\
  \ y, w, b, model);\nif (Math.Abs(funVal) <= 0.001)\nseries.Points.Add(new DataPoint(x,\
  \ y));\n}\n}\nreturn series;\n}\npublic double GetValue(double x, double y, double\
  \ [] w, double b, int model)\n{\nw = w.RoundValues(5).ToArray();\nb = new [] {b}.RoundValues(5).ToArray().First();\n\
  return w[0] * x  + w[1] * y + model * b;\n}\n}\n代码清单 9-7\n创建待绘制模型的 MainViewModel\
  \ 类\n```\n\n该类的构造函数接收所有必要的值（权重、偏置等），并创建不同的散点序列：一个用于满足 wx + b >= 1 的点，另一个用于满足 wx\
  \ + b <= -1 的点，最后一个用于超平面上的点——即满足 wx + b = 0 的点。此外，`GetFunction()` 方法绘制对应于超平面的直线。请注意，在此例中，我们考虑了因向\
  \ Hessian 矩阵主对角线添加 epsilon 而引入的数值误差；因此，我们将那些类别值小于等于 0.001 的点视为超平面上的点。`GetValue()`\
  \ 方法使用我们的 `RoundValues()` 扩展方法来确定输入数据的类别。\n\n我们可以像代码清单 9-8 所示，从控制台应用程序运行该代码。\n\n\
