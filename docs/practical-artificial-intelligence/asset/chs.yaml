  智能体之前寻找的位置是一个水源位置，因此 `WaterFound` 数据结构被更新，探测车在火星上找到了水！之后，它继续追踪下一个信念（图 4-7）：位于 (1,
  2) 的水源。


  再次，当接近（进入其感知或感知半径）时，下一个水源位置信念以及另一个障碍物位置信念被智能体丢弃，因此信念集被更新。


  现在，探测车已经用尽了它的信念集，它将四处漫游（持续十个动作；这在代码中是硬编码的，见图 4-8），直到我们的统计与概率推理组件被激活，并促使探测车根据逻辑结论为自己注入一个新的信念。在这种情况下——模仿我们人类大脑会做的事情，因为我们只是试图模仿人类在这种情况下会做什么——我们会认为，在未探索的区域找到水的可能性更大，或者说机会要大得多。在“启发式与元启发式”章节
  14 中，我们将看到这个概念被称为多样化，并且在遗传算法、禁忌搜索等元启发式算法中非常常见。


  ![A449374_1_En_4_Fig8_HTML.jpg](img/A449374_1_En_4_Fig8_HTML.jpg)


  图 4-8


  探测车在用尽信念集后四处漫游


  ![A449374_1_En_4_Fig7_HTML.jpg](img/A449374_1_En_4_Fig7_HTML.jpg)


  图 4-7


  探测车丢弃了一个水源位置信念和一个障碍物位置信念


  同样，我们可以有一个多样化阶段来探索地形中访问较少或未探索的区域，也可以有一个强化阶段来更好地探索之前发现过水的区域；即地形中有希望的区域。在我们的案例中，强化阶段可能涉及让探测车在地形的某个区域漫游。


  正如我们将在后续章节中看到的，在与搜索相关的问题中，找到强化和多样化阶段之间的平衡（有时称为探索-利用权衡）至关重要，而我们日常生活中面临的大多数问题都是搜索问题或优化问题，这些归根结底都是搜索问题，因为我们在所有可能解的空间中搜索一个最佳或最优的解。因此，许多问题都可以简化为仅仅是搜索，而这是一项通常需要智慧才能完成的复杂任务。


  继续我们的火星探测车示例，图 4-9 显示了探测车在完成漫游阶段后，为自己注入了一个关于第三区域左下角单元格有水的信念，并因此设定路线前往该单元格。


  这个信念的注入使得探测车找到了一个实际的水源位置，该位置位于注入的水源位置信念附近。因此，通过将搜索多样化到未探索的区域，我们找到了一个实际的水源位置（图 4-10）。这个过程会重复进行；探测车四处漫游（随机移动），最终注入一个新的信念，并移动到该位置（图
  4-11）。


  ![A449374_1_En_4_Fig11_HTML.jpg](img/A449374_1_En_4_Fig11_HTML.jpg)


  图 4-11


  探测车重复该过程，四处漫游，然后注入一个新的水源位置信念


  ![A449374_1_En_4_Fig10_HTML.jpg](img/A449374_1_En_4_Fig10_HTML.jpg)


  图 4-10


  探测车跟随注入的信念，并在此过程中找到了一个实际的水源位置


  ![A449374_1_En_4_Fig9_HTML.jpg](img/A449374_1_En_4_Fig9_HTML.jpg)


  图 4-9


  探测车为自己注入了一个关于第三区域左下角可能存在水源位置的信念




  本章介绍的“火星漫游车”具有多种可优化的特性，以提升其性能。例如，随着漫游车在火星上停留的时间越来越长，可以调整 `WanderThreshold` 参数，以延长其在特定区域徘徊的时间；这一决策可能取决于它当前所在区域的方形面积。此外，总是选择访问频率较低区域的角落来注入“水源位置信念”的策略也可以改变，并使其依赖于与漫游车历史或状态相关的各种条件。该选择也可以随机进行；例如，在所选区域中随机选择一个单元格来注入水源位置信念，或者选择该区域中访问最少的单元格。地形的划分方式也可能改变；我们可以使用存储在数据库中的一组划分模式，以不同方式（不总是
  2^n 细分）划分地形，让漫游车有机会探索不同形状的多样化区域。可能性是无限的，读者可以利用本章提供的框架，创建自己完美的火星漫游车。


  现在，我们已经研究了一个关于智能体及其架构的完整实际问题，可以继续前进，探索多智能体系统。在这些系统中，多个智能体共存，并可能协作或竞争，以实现它们共同的目标。这将是下一章的重点。


  ## 总结


  在本章中，我们介绍了设计火星漫游车 AI 的实际问题，该 AI 采用了一种混合架构，由反应层和实现 BDI（信念、愿望和意图）范式的审慎层组成。火星漫游车示例包含一个可视化应用程序（Windows
  Forms），演示了漫游车如何对不同场景做出反应，如何通过寻路算法进行规划，以及如何对即时感知到的情况提供及时响应。我们还介绍了智能体中的一个统计与概率组件，它作为一个审慎组件，使智能体能够探索未探索或访问较少的区域。


  '
- "# 5. 多智能体系统\n\n到目前为止，我们一直将智能体视为与环境交互的单一实体；在现实生活中，当多个智能体协作以实现共同目标时，许多问题可以更快、更高效地解决。\n\
  \n回想一下第 2 章和第 3 章中的清洁智能体；这个智能体独自处理整个地形的清洁问题。毫无疑问，如果多个清洁机器人在同一地形上相互通信并互相帮助，就能在更短的时间内完成这项任务，而单个智能体完成该任务则需要更长的时间并消耗更多资源。\n\
  \n如今，多智能体系统（MAS）被应用于现实世界的各种应用中，例如电脑游戏、军事防御系统、空中交通管制、交通运输、地理信息系统（GIS）、物流、医疗诊断等。其他用途涉及移动技术，它们被用于实现自动、动态的负载均衡和高可扩展性。\n\
  \n在本章中，我们将研究多智能体系统，其中多个智能体可以协作、协调、通信或竞争以实现特定目标。MAS 属于分布式系统与人工智能相结合的领域，形成了所谓的分布式人工智能。在本部分（将涵盖接下来的三章）结束时，我们将提出一个实际问题，即多个清洁机器人将协作清洁一个房间。\n\
  \n注意\n\n多智能体系统代表了分布式计算系统。与任何分布式系统一样，它们由多个相互作用的计算实体组成。然而，与经典分布式系统不同，它们的组成实体是智能的，并且能够彼此进行智能交互。\n\
  \n## 什么是多智能体系统？\n\n与之前介绍的逻辑和智能体术语一样，对于多智能体系统的定义并没有全球共识。在本书中，我们将提供一个我们认为合乎逻辑的个人定义，该定义也考虑了从科学文献中提取的其他\
  \ MAS 定义。\n\n多智能体系统（MAS）是一个智能体集合 S，这些智能体以竞争方式（旨在实现它们所属的子集 S' 所定义的目标，其中 S' 是 S 的一个划分）或协作方式（旨在实现\
  \ S 中定义的共同目标）相互交互。此外，也可能出现 S 中的每个智能体都为实现自身目标而行动的情况；在这种情况下，我们称之为独立的 MAS。\n\n在表 5-1\
  \ 中，我们可以看到 MAS 应用于空中交通管制的第一个非常常见的场景；在此场景中，智能体控制器 1（A1）直接与飞行员打交道，并与智能体控制器 2（A2）协作，为他们寻找可用的着陆跑道。有关这两个协作智能体之间的完整对话，请参阅表\
  \ 5-1。\n\n现在我们已经介绍了 MAS 术语的自我定义，我们将继续介绍其他相关的概念。\n\n联盟被认为是智能体集合的一个子集；对于像篮球、棒球或足球比赛这样的\
  \ MAS，总是存在两个联盟——即竞争的两个队伍。\n\n策略是一个函数，它接收环境的当前状态，并输出联盟要执行的动作。A 队的策略通常取决于 B 队中每个智能体在当前时刻执行的动作。\n\
  \n平台，也称为多智能体基础设施，是一个框架、基础或支撑，它描述了智能体架构、多智能体组织以及它们之间的关系或依赖关系。它允许智能体在不考虑此类平台属性（集中式与否、是否嵌入智能体等）的情况下进行交互，并且通常根据系统需求为智能体提供一组服务（智能体定位等），旨在增强\
  \ MAS 的活动和组织；它被视为智能体的工具。\n\n智能体架构描述了构成单个智能体的层或模块，以及它们之间的关系和交互。例如，在 MAS 上下文中，智能体通常有一个通信模块，用于加强与用户和其他智能体的通信。正如我们所知（来自第\
  \ 3 章和第 4 章），某些类型的智能体还具有规划层。通常，到达通信模块的传入消息会通过某种连接影响规划层，而规划层可能会创建由通信模块处理的传出消息。\n\n\
  多智能体组织描述了多个智能体如何组织起来形成一个 MAS。关系、智能体之间的交互以及它们在组织中的特定角色构成了多智能体组织。智能体架构不是多智能体组织的一部分，尽管它们之间的相互关系很常见。\n\
  \n如果一个智能体相对于构成 MAS 的智能体集合中的其他每个智能体都是自主的，则称该智能体在 MAS 中是自主的；换句话说，如果它不受任何其他智能体的控制或权力支配。\n\
  \n表 5-1\n\n空中交通管制场景中的 MAS 示例\n\n| 飞行员 | 智能体控制器 1 (A1) | 智能体控制器 2 (A2) |\n| --- |\
  \ --- | --- |\n| 对 A1：我可以降落吗？ |   |   |\n|   | 对 A2：有空闲跑道吗？ |   |\n|   |   | 对 A1：跑道\
  \ P。 |\n|   | 对飞行员：允许使用跑道 P。 |   |\n| 对 A1：收到 |   |   |\n|   | 对 A2：跑道 P 现在繁忙。 |\
  \   |\n\n\n\n如果一个多智能体系统（MAS）是独立的，且各智能体的目标互不相关，则该系统是离散的。因此，离散型 MAS 不涉及合作，因为每个智能体都会各行其是，努力实现自己的目标。\n\
  \n**模块化**是 MAS 的优势之一；有时，解决一个复杂问题会被细分为原问题中更简单的子问题，每个智能体可以专门解决其中某一特定类型的问题，从而提高了**可重用性**。想象一个应对城市灾难（如地震）的\
  \ MAS。这样的 MAS 将由不同的智能体（警察、消防员等）组成，每个智能体专注于单一任务，而所有智能体都肩负着建立秩序和拯救生命的全局使命。\n\n通过 MAS\
  \ 解决问题能带来**高效性**；如果有多个并发、并行的智能体同时工作来解决问题，那么问题的解决方案往往能更快地达成。\n\nMAS 还提供了更高的**可靠性**，因为我们可以有多个智能体负责处理单一任务，如果其中一个失败，其他智能体可以通过在剩余智能体之间重新分配任务来继续其工作。\n\
  \nMAS 提供的最后一个重要优势是**灵活性**；我们可以随意在 MAS 中添加或删除智能体，并且拥有互补技能的不同智能体可以组成联盟，共同协作以解决问题。\n\
  \n在接下来的章节中，我们将探讨分布式人工智能领域的一些关键概念，特别是关于 MAS 的主题：通信、合作、协商和协调。我们还将更深入地审视之前介绍过的一些概念。\n\
  \n注意\n\n平台可以提供的服务之一是智能体定位；换句话说，这是一种设施，通过它，一个智能体或第三方能够在 MAS 环境中定位到另一个智能体。\n\n## 多智能体组织\n\
  \n在本章前面部分，我们给出了术语“多智能体组织”的定义。在本节中，我们将详细介绍一些最常见的多智能体组织类型：\n\n*   **层级式**：智能体只能通过遵循层级结构进行通信的组织。由于这种限制，不需要智能体定位机制。取而代之的是一组协调者充当中间人，接收和发送智能体之间的所有消息。这些协调者通常位于层级结构的上层。因此，下层通常依赖于上层。在这种类型的组织中，通信量大大减少。\n\
  *   **扁平式或民主式**：智能体可以直接相互通信的组织。这种类型的组织没有固定结构，但如果智能体认为有必要解决某个特定任务，它们可以形成自己的结构。此外，不假定一个智能体对另一个智能体有控制权。智能体定位必须作为基础设施或平台的一部分提供，否则系统必须是封闭的；换句话说，每个智能体必须始终了解其他智能体。这种类型的组织可能导致通信开销过大。\n\
  *   **包含式**：智能体（被包含者）可以是其他智能体（容器）的组成部分的组织。这种类型的组织类似于层级模型，不同之处在于，被包含的智能体将其所有控制权交给其容器智能体。与层级式组织一样，它的通信开销较低。\n\
  *   **模块式**：MAS 由多个模块组成的组织，每个模块都可以被视为一个独立的 MAS。将系统划分为模块通常是通过考虑诸如地理邻近性或同一模块内智能体与服务之间需要极端交互等因素来完成的。模块化提高了任务执行的效率并减少了通信开销。\n\
  \n这些组织类型的混合形式以及从一种风格到另一种风格的动态变化都是可能的。从前面几点详述的多智能体组织中，我们可以很容易地看出，通信在定义智能体的架构和运作方式方面起着至关重要的作用。我们将用下一节来阐述这个非常重要主题的一些关键方面。\n\
  \n注意\n\n近年来，人们提出了各种各样的智能体架构。对于 MAS 架构而言，这个数量大大减少，因为要使一个智能体能够融入 MAS，它必须配备关键的组件（通信、协调等），使其能够与其他智能体进行适当的交互。\n\
  \n## 通信\n\nMAS 中的智能体必须协调它们的行动来解决问题。在这种情况下，协调是通过通信实现的，通信在提供智能体交互、促进信息共享与合作以及协调方面起着至关重要的作用。\n\
  \n在上一节中，我们讨论了 MAS 组织以及它们如何根据智能体所处的组织类型影响智能体通信。现在，我们将研究这个主题的一些具体方面。\n\n智能体之间建立的通信链路可以分为：\n\
  \n*   **点对点**：智能体直接相互通信。\n*   **广播/组播**：智能体能够向智能体集合的一个子集发送信息。如果这个子集等于整个智能体集合，那么该智能体是在广播；否则，它是在组播。\n\
  *   **中介式**：智能体之间的通信由第三方（协调者）进行中介（见图 5-1）。\n\n    ![A449374_1_En_5_Fig1_HTML.jpg](img/A449374_1_En_5_Fig1_HTML.jpg)\n\
  \n    图 5-1\n\n    智能体 1 和智能体 2 通过充当中间人的协调者进行通信\n\n考虑到消息从一个智能体传输到另一个智能体的媒介性质，通信可以分为：\n\
  \n*   **直接路由**：消息直接发送给其他智能体，信号无损失。\n*   **信号传播路由**：智能体发送信号，其强度随距离增加而减弱。\n*   **公告板路由**：使用黑板系统\n\
  \n黑板系统和直接消息传递是建立智能体通信的两种选择。\n\n黑板系统（图 5-2）代表一个公共的共享空间，供每个智能体放置其数据、信息和知识。每个智能体可以在任何给定时间从黑板读写数据，在这种集中式系统中，智能体之间没有直接通信。黑板还充当调度器，处理智能体请求、公共问题的数据、解决方案的当前状态、每个智能体的当前任务等。由于黑板系统由共享资源组成，必须注意在这种模型中可能出现的所有并发问题（多个智能体试图访问相同信息、智能体使用其他智能体写入的未更新的部分数据等）。\n\
  \n![A449374_1_En_5_Fig2_HTML.jpg](img/A449374_1_En_5_Fig2_HTML.jpg)\n\n图 5-2\n\n\
  黑板系统是一个集中的、公共的空间，供所有智能体放置和共享其信息\n\n在另一种变体（消息传递）中，信息从一个智能体（发送者）传递到另一个智能体（接收者）。智能体之间的通信意味着比分布式系统中的通信更多；因此，谈论交互比谈论通信更合适。当我们通信时，我们执行的不只是像在分布式系统中那样，按照指定的语法和给定的协议交换消息。因此，一种更精细的、倾向于\
  \ MAS 特有的通信类型是基于言语行为理论（Searle, 1969; Vanderveken, 1994）的通信，该理论最能描述用于建立智能体通信的消息传递替代方案。\n\
  \n\n\n### 言语行为理论\n\n言语行为理论（也称交际行为理论）的起源可追溯到约翰·奥斯汀的著作《如何以言行事》（1962 年）；多智能体系统中大多数关于交际的处理方式都受此理论启发。该理论的核心观点在于，我们应将交际视为一种行为形式。此外，奥斯汀注意到，某些话语如同物理行为一般，似乎能改变世界的状态。例如，宣战或简单的一句“我宣布你们结为夫妻”。\n\
  \n奥斯汀认为，所有交际都可以通过使用恰当的施为动词，以陈述形式表达出来。因此，像“爵士音乐会将于 10 月 10 日举行”这样简单的告知性短语，可以被视为“我通知你，爵士音乐会将于\
  \ 10 月 10 日举行”。指令性话语——例如“把那瓶朗姆酒给我”——可以被视为“我请求（要求）你把那瓶朗姆酒给我”。承诺性话语，如“我出 100 美元买你的家具”，可以被视为“我承诺我会出\
  \ 100 美元买你的家具”。\n\n我们所说的每一句话，都是为了实现某个目标；研究话语如何用于实现意图的理论就是言语行为理论。通过使用不同类型的言语行为，智能体可以有效地进行交互。\n\
  \n> **注**\n>\n> 交际行为理论是关于语言使用的理论；它们试图解释人们每天如何运用语言来实现自己的目标和意图。\n\n以下是一些言语行为构式的示例：\n\
  \n*   向其他智能体告知某些数据。\n*   查询其他智能体的状态或当前情况。\n*   回答问题。\n*   请求其他智能体采取行动。\n*   承诺做某事。\n\
  *   提出交易。\n*   确认提议和请求。\n\n塞尔（1969 年）将言语行为分为以下几类：\n\n*   **断言类**：当我们告知、断言、声称、描述时；例如，天阴了。\n\
  *   **指令类**：试图让听话者做某事；换句话说，就是请求、命令、建议、禁止；例如，把那瓶朗姆酒拿给我。\n*   **承诺类**：当说话者承诺做某事时，例如承诺、同意、提议、威胁、邀请；例如，我保证会给你带茶。\n\
  *   **表达类**：当说话者表达一种心理状态时；换句话说，就是祝贺、感谢、道歉；例如，很遗憾你没考上哈佛。\n*   **宣告类**：当说话者使某种事态得以实现时；换句话说，就是宣布、证婚、逮捕；例如，我宣布（宣告）你们结为夫妻。\n\
  \n一个言语行为包含两个组成部分：一个施为动词（例如，告知、宣布、请求等）和一个命题内容（例如，瓶子是开着的）。构建言语行为涉及将施为动词与命题内容相结合。请参见以下示例：\n\
  \n```\n施为动词 = 告知\n内容 = 瓶子是开着的\n言语行为 = 瓶子是开着的。\n施为动词 = 请求\n内容 = 瓶子是开着的\n言语行为 = 请打开瓶子。\n\
  施为动词 = 询问\n内容 = 瓶子是开着的\n言语行为 = 瓶子是开着的吗？\n施为动词 = 拒绝\n内容 = 瓶子是开着的\n言语行为 = 我拒绝打开瓶子\n\
  施为动词 = 同意\n内容 = 瓶子是开着的\n言语行为 = 我同意打开瓶子\n```\n\n正如我们通常为工作中的同事之间创建一种交流语言一样，一个包含不同智能体（这些智能体可能运行在不同的机器、不同的操作系统上）的多智能体系统，需要一种标准化的智能体通信语言，以便能够以标准格式交换消息。\n\
  \n### 智能体通信语言（ACL）\n\n智能体通信语言始于 20 世纪 80 年代；起初，它们依赖于为其创建的项目以及使用它们的智能体的内部表示；当时还没有标准语言。\n\
  \n大约在同一时期，出现了一种比其前身更具通用性的语言，即知识查询与操纵语言，通常称为 KQML。它由 DARPA 知识共享计划创建，旨在作为对知识表示技术（特别是本体论）研究的补充。\n\
  \nKQML 由两部分组成：语言本身充当“外部”语言，而知识交换格式（KIF）充当“内部”语言；前者描述施为动词，后者描述命题内容，并且主要基于一阶谓词演算。KQML\
  \ 表示依赖于知识库结构的知识；因此，它不使用特定的内部表示，而是假设每个智能体维护一个以知识断言形式描述的知识库。KQML 提出了许多施为动词，例如`query`和`tell`。其理念是，每个施为动词都可以根据其对通信智能体知识库产生的影响来赋予语义。此外，一个智能体只有在相信所发送内容的情况下，才会发送`tell`施为动词；换句话说，如果它认为该内容属于其知识库。接收到某个内容的`tell`施为动词的智能体，会将该内容插入到其知识库中；换句话说，它会开始相信被告知的内容。\n\
  \n> **注**\n>\n> 本体论是对某个领域（概念、属性、约束、个体等）的显式描述。它定义了一个词汇表，并用于在计算机智能体或人类之间共享对信息结构的理解。在积木世界中，`Block`表示一个概念，`OnTop`表示一种关系。\n\
  \nKQML 的优雅之处在于，所有用于理解消息内容的信息都包含在通信本身之中。其通用语法如图 5-3 所示；请注意它类似于 Lisp 编程语言：\n\n![A449374_1_En_5_Fig3_HTML.png](img/A449374_1_En_5_Fig3_HTML.png)\n\
  \n图 5-3\n\nKQML 消息的基本结构\n\n以下我们展示了一个 AgentX 和 AgentY 之间 KQML 对话的示例：\n\n```\n(stream-about\n\
  :sender AgentX\n:receiver AgentY\n:language KIF\n:ontology CleaningTerrains\n:query\n\
  :reply-for query_from_AgentY\n:content cell_i cell_j\n)\n(query\n:sender AgentX\n\
  :receiver AgentY\n:content(> (dirt cell_i) (0))\n)\n(tell\n:sender AgentX\n:receiver\
  \ AgentY\n:content(= (cell_j) (1))\n)\n(eos\n:sender AgentX\n:receiver AgentY\n\
  :query\n:reply-for query_from_AgentY\n)\n```\n\n在这段 KQML 消息的小片段中，AgentX 询问 AgentY\
  \ 单元格 i 是否有污垢；它还回复了之前从 AgentY 收到的查询，并告诉它单元格 j 有 1 个单位的污垢；`eos`代表信号结束。请注意，`content`字段的值是用`language`标签定义的语言编写的，在本例中是\
  \ KIF。\n\n> **注**\n>\n> KIF 是一种特定的逻辑语言，已被提议作为在专家系统、数据库、智能体等中描述事物的标准。可以说，KIF 是用于翻译其他语言的中介。尽管\
  \ KQML 通常与 KIF 结合作为内容语言，但它也可以与其他语言（如 Prolog、Lisp、Scheme 等）结合使用。\n\n1996 年，智能物理代理基金会（FIPA），一个独立的非营利组织（现为\
  \ IEEE 计算机学会的一部分），开始致力于制定基于智能体应用的若干规范；其中一项规范就是与组织同名的 ACL，即 FIPA-ACL。\n\n\n\nFIPA\
  \ 的基本结构与 KQML 非常相似，如图 5-4 所示。\n\n![A449374_1_En_5_Fig4_HTML.jpg](img/A449374_1_En_5_Fig4_HTML.jpg)\n\
  \n图 5-4\n\nFIPA 消息的组成部分\n\nFIPA 语言规范所接受的参数如下：\n\n*   `:sender` — 消息的发送者\n*   `:receiver`\
  \ — 消息的接收者\n*   `:content` — 消息的内容\n*   `:reply-with` — 消息的标识符\n*   `:reply-by`\
  \ — 回复消息的截止时间\n*   `:in-reply-to` — 被回复消息的标识符\n*   `:language` — 内容所使用的语言\n*   `:ontology`\
  \ — 用于表示领域的本体\n*   `:protocol` — 要遵循的通信协议\n*   `:conversation-id` — 会话的标识符\n\n表\
  \ 5-2 详细列出了部分 FIPA 执行语及其创建目的。\n\n表 5-2\n\n部分 FIPA 执行语\n\n| 执行语 | 传递信息 | 请求信息 | 协商\
  \ | 执行动作 | 错误处理 |\n| --- | --- | --- | --- | --- | --- |\n| `accept-proposal` |\
  \   |   | x |   |   |\n| `agree` |   |   |   | x |   |\n| `cancel` |   | x |   |\
  \ x |   |\n| `cfp` |   |   | x |   |   |\n| `confirm` | x |   |   |   |   |\n| `disconfirm`\
  \ `failure` | x |   |   |   | x |\n| `inform` | x |   |   |   |   |\n| `inform-if`\
  \ | x |   |   |   |   |\n| `inform-ref` | x |   |   |   |   |\n| `not-understood`\
  \ |   |   |   |   | x |\n| `propose` |   |   | x |   |   |\n| `query-if` |   | x\
  \ |   |   |   |\n| `query-ref` |   | x |   |   |   |\n| `refuse` |   |   |   | x\
  \ |   |\n| `reject-proposal` |   |   | x |   |   |\n| `request` |   |   |   | x\
  \ |   |\n| `request-when` |   |   |   | x |   |\n| `request-whenever` |   |   |\
  \   | x |   |\n| `subscribe` |   | x |   |   |   |\n\n`Inform` 和 `Request` 代表了两种基本的执行语，而其他执行语则是基于它们定义的。它们的含义由两部分组成：一个前提条件列表，说明言语行为成功必须满足的条件；以及一个理性效果，即消息发送者希望达到的目的。\n\
  \n在 FIPA 的 `inform` 执行语中，`content` 是一个陈述，`sender` 告知 `receiver` 某个给定命题为真；`sender`\
  \ 声明以下内容：\n\n*   某个命题为真。\n*   接收代理也必须相信该命题为真。\n*   接收方对该命题的真假一无所知。\n\n以下代码行展示了一个\
  \ FIPA `inform` 执行语的示例：\n\n```\n(inform\n:sender(agent-identifier :x)\n:receiver(agent-identifier\
  \ :y)\n:content dirt( cell_i, 0 )\n:language Prolog\n)\n```\n\n另一方面，`request` 执行语中的内容包含一个动作；在这种情况下，发送者请求接收者执行某个动作；发送者声明以下内容：\n\
  \n*   动作内容将被执行。\n*   接收方有能力执行此动作。\n*   不相信接收方已经打算执行该动作。\n\n在本节中，我们分析了 MAS 设计中的一个关键主题：通信。尽管这是每个\
  \ MAS 的基本方面，但还有其他相关组件，其中之一是协调。我们需要我们的代理进行协调，以避免出现诸如两个代理同时执行相同动作（例如，同时试图通过同一扇门）而可能无法实现的问题。协调将是下一节的重点。\n\
  \n## 协调与合作\n\n作为 MAS 一部分的代理，其存在和决策制定都处于一个存在其他代理的环境中。为了避免混乱并确保在此环境中的理性行为，我们需要代理进行协调，并以简洁、逻辑的方式实现其目标。评估\
  \ MAS 有两个主要标准：一致性和协调性。\n\n一致性指的是 MAS 在考虑某些评估标准（如解决方案质量、资源应用效率、逻辑决策等）时的表现如何。MAS 的一个常见问题是，在缺乏显式全局控制的情况下，如何保持整体一致性。在这种情况下，代理必须能够自行确定它们与其他代理共享的目标；它们还必须确定共同任务，避免不必要的冲突，并收集知识。在这种场景下，代理之间拥有某种组织形式是有用的。\n\
  \n协调性指的是代理通过同步来避免可能涉及两个或多个代理的非理性活动的能力。它意味着在规划和执行一个代理的动作时，需要考虑其他代理的动作。它也是实现 MAS 一致行为的一种手段，并且可能涉及合作。当\
  \ MAS 中的代理合作时，它们共同努力实现共同目标。当它们竞争时，它们的目标是相反的。在这两种情况下，协调都是必不可少的，因为代理在竞争、请求特定资源或提供服务时，必须考虑其他代理的动作。协调的例子包括确保代理的动作同步、向其他代理提供及时信息以及避免冗余的问题解决。\n\
  \n合作是非对抗性代理之间的协调。通常，为了成功合作，每个代理必须维护一个关于其他代理的模型，并开发一个关于未来交互的模型；这暗示了社交性。\n\n为了让 MAS\
  \ 中的代理协同工作，它们必须能够共享任务和信息。如果我们有一个由不同个体设计的代理组成的 MAS，那么最终可能会得到一个具有多种目标的 MAS，这些目标都源自不同的代理。或者，如果我们负责设计整个系统，那么我们可以让代理在我们认为必要时互相帮助；我们的最佳利益也将成为它们的最佳利益。在这种合作模型中，我们说代理是善意的，因为它们共同努力以实现共同目标。一个善意的\
  \ MAS，或者所有代理都是善意的 MAS，会显著简化系统的设计任务。\n\n当代理代表个人、组织、公司等的利益时，我们说它们是自利的。这些代理除了 MAS 中其他代理的目标之外，还有自己的一套目标，并且会为了实现这些目标而行动，甚至不惜牺牲其他代理的利益；这可能导致它们之间发生冲突。\n\
  \n注意\n\n自利的代理会严重复杂化 MAS 的设计任务。对于包含自利代理的 MAS，我们通常需要引入智能行为机制，例如基于博弈论或基于规则的算法。\n\n\
  图 5-5 展示了一棵包含实现协调的几种可能方法的树。\n\n![A449374_1_En_5_Fig5_HTML.jpg](img/A449374_1_En_5_Fig5_HTML.jpg)\n\
  \n图 5-5\n\n代理协调可能性的分类法\n\nMAS 中合作的基本策略是将任务分解并分配给各个代理。这种分而治之的方法无疑可以降低全局任务的复杂性，因为通过将其划分为更小的子任务，可以在更短的时间内使用更少的资源获得全局解决方案。通常，任务共享可以分为三个阶段：\n\
  \n*   问题分解（分）\n*   子问题求解\n*   解决方案综合（治）\n\n\n\n在问题分解阶段，全局问题被划分为子问题，通常通过递归或分层过程进行。如何划分是一个设计选择，且依赖于具体问题。由谁来进行问题分解以及如何进行分解，可以交由我们指定的一个智能体（任务分配者）来处理。该智能体可能只负责在集中式设计中向其他智能体分配任务，除此之外不处理任何其他事务。或者，它也可以成为子问题解决方案团队的一员，像其他智能体一样行动，但具备工作组织者的特殊属性。\n\
  \n一旦问题分解阶段为我们提供了全局问题的划分，每个智能体便对分配到的子问题做出贡献。在此过程中，智能体可能需要共享一些信息，并向其他智能体更新其当前状态。最后，在解决方案综合阶段，所有子问题的解决方案被（递归或分层地）整合起来。\n\
  \n在这种协作模型中，我们可以区分出多智能体系统执行过程中最可能出现的两种主要活动：任务共享和结果共享。前者将任务的组成部分分配给各个智能体，而后者则分配部分或完整的结果。\n\
  \n我们可以使用订阅/通知（发布者/订阅者）模式来进行结果共享；在这种模式中，一个对象（订阅者）订阅另一个对象（通知者），请求在事件 `evt` 发生时获得通知。一旦\
  \ `evt` 发生，通知者便会通知订阅者该事件的发生，它们以此方式主动交换信息。\n\n至此，我们还有一些未解答的问题。如何将任务分配或匹配给智能体？如何从已解决的部分组装出解决方案？为了回答第一个问题，我们将研究一种称为合同网的任务共享协议。\n\
  \n注意\n\n一些常用的任务共享机制包括：市场机制，即通过广义协议或相互选择将任务分配给智能体；多智能体规划，即由规划智能体负责任务分配；以及合同网协议，它是几种任务共享机制之一。\n\
  \n### 使用合同网进行协商\n\n合同网机制是一种用于智能体间任务共享的交互机制。它遵循实体（政府、公司等）用于规范商品和服务交换的模型。合同网为寻找合适的智能体来执行任务提供了一种解决方案。\n\
  \n想要完成任务的智能体被称为管理者。能够完成任务的候选智能体被称为承包商。合同网过程可概括为以下几个阶段（图 5-6）：\n\n1.  **公告**：管理者发出任务公告，其中包含待完成任务的具体说明。该说明必须包括任务描述、任何约束条件（截止日期等）以及元任务信息（投标必须在截止日期前提交、到期日等）。公告以广播形式发出。\n\
  2.  **投标**：智能体接收到与管理者公告相对应的广播，并自行决定是否要对该任务进行投标。在此过程中，他们必须考虑各种因素，如执行任务的能力以及能否满足所有约束条件。如果他们最终决定投标，则提交标书。\n\
  3.  **授标**：管理者必须在投标中进行选择，并决定将合同授予哪个智能体。此过程的结果会通知给每个提交了投标的智能体。\n4.  **执行**：中标者或成功的承包商执行任务。\n\
  \n    ![A449374_1_En_5_Fig6_HTML.jpg](img/A449374_1_En_5_Fig6_HTML.jpg)\n\n    图\
  \ 5-6\n\n    合同网过程\n\n通常，任何智能体都可以充当管理者，任何智能体也可以通过回复任务公告来充当承包商。由于这种灵活性，任务分解可以进一步深入到不同的层次。此外，如果某个承包商无法完成或无法为任务提供合适的解决方案，管理者可以寻找其他候选承包商；只要多智能体系统中还有智能体存在，管理者就可以寻找一个在某个时间点能够根据其要求执行任务的候选承包商。\n\
  \n从承包商的角度来看，他收到来自不同管理者的各种邀约（公告），并根据自己的判断决定哪个是最佳邀约。此决定基于某些标准（距离、报酬等）做出，然后他向相应的管理者发送投标。\n\
  \n从管理者的角度来看，他接收并评估针对每个任务公告的投标。任何被认为满意的、针对特定任务的投标，都将在任务公告的到期时间之前被接受。之后，管理者会通知中标的承包商，并可能通过发布“授标通知”公告，告知所有其他发送了投标的候选者该任务已被授予。\n\
  \n或许有人会说，合同网机制的一个缺点是，被授予任务的智能体不一定是该任务最合适或最佳的智能体，因为最合适的智能体可能在授标时正忙。\n\n注意\n\n管理者可能收不到针对某个公告的投标，原因有多种。所有智能体在收到公告时可能正忙；某个候选承包商（智能体）将公告的任务排在低于其他提供任务的位置；或者没有承包商能够处理公告的任务。\n\
  \nFIPA-ACL 规范旨在支持合同网协商机制。`cfp`（征求建议）执行语用于公告任务；`propose` 和 `refuse` 执行语用于提出或拒绝提议；`accept`\
  \ 和 `reject` 用于接受或拒绝提议；`inform` 和 `failure` 用于传达任务完成及其相应结果。\n\n\n\n### 社会规范与社会\n\
  \n经典人工智能一直关注于设计采用冯·诺依曼架构实现推理与控制逻辑的单一智能体。然而，智能体并非总是孤立存在的；它们所处的环境中可能存在其他智能体，并且需要某种形式的交互才能以最优方式完成任务。因此，将智能体视为一个由公认规则支配其行为与行动的社会是合乎逻辑的。社交性在协作式多智能体系统中至关重要，旨在支持近期应用所需的真正点对点分布式与灵活范式，而智能体正是在这种范式中能发挥最大作用。\n\
  \n多智能体系统中的社会承诺，是指一个智能体与另一个智能体或智能体群体之间产生的义务，它约束前者必须遵循预先约定的承诺或规则。设想一个多智能体系统，其中所有智能体必须在二维空间中保持在同一工作线上，但智能体\
  \ X 移动速度比其他智能体快，总是倾向于跑到前面而将团队抛在身后。该智能体对其他智能体的社会承诺可以是：始终保持在同一条线上，不超前移动，也不抛下任何成员。\n\
  \n为了给多智能体系统制定规则，我们可以设计社会规范或法律来约束智能体的行为（图 5-7）。社会法律是一组约束条件，每个约束条件以（S, A）对的形式呈现，表明智能体在处于状态\
  \ S 时不能执行动作 A。\n\n![A449374_1_En_5_Fig7_HTML.jpg](img/A449374_1_En_5_Fig7_HTML.jpg)\n\
  \n图 5-7\n\n决定智能体在 3×3 网格中移动的社会法律。该法律可防止碰撞。\n\n焦点状态集是我们希望智能体能够访问的状态集合；因此，从任何焦点状态出发，都必须存在一条通往其余焦点状态的路径。一条有用的法律不会阻止智能体从一个状态到达另一个状态；图\
  \ 5-5 中的法律便是一条有用的法律。\n\n在奠定了多智能体系统术语、概念和思想的基础之后，我们将在下一章介绍一个完整的实际应用：一个多智能体通信软件，它允许各种智能体在双向（服务端、客户端）程序中使用\
  \ WCF 发布者/订阅者模式交换消息。该通信程序将在后续章节（第 7 章）中用于创建一个完整的多智能体系统示例，其中一组清洁机器人将通过通信、协调与合作，清理一个\
  \ n×m 房间内的污垢。\n\n## 本章小结\n\n在本章中，我们介绍了多智能体系统领域。我们阐述了各种定义和概念，这些内容为我们正确理解多智能体系统术语铺平了道路，而掌握这些术语对于深入研读与该主题相关的科学文献至关重要。我们探讨了多智能体组织、智能体通信及其子领域（言语行为理论与智能体通信语言），并在本章结尾详细阐述了智能体间协调与协作的关键主题。本部分还涵盖了协商与社会规范的内容。在下一章中，我们将介绍一个非常有趣的实践问题：在一个基于发布者/订阅者模式创建的\
  \ WCF 应用程序中，一组 N 个智能体将相互交换消息。\n\n"
- "# 6. 使用 WCF 的多智能体系统通信\n\n在上一章中，我们探讨了多智能体系统的基础知识，并熟悉了多智能体系统平台、协调、协作和通信等概念。在本章中，我们将描述一个使用\
  \ Windows Communication Foundation 创建智能体网络的应用，该网络中的智能体能够相互交互并传递消息。该应用将采用发布者/订阅者设计模式来构建通信组件，多智能体系统中的每个智能体都将集成该组件。我们将在下一章中再次使用本章描述的应用，将其改造为清洁智能体多智能体系统中每个智能体的通信模块，这些清洁智能体的任务是清理房间内的污垢。\n\
  \nWCF 于 2006 年作为开发工具包问世，并最终成为.NET Framework 的一部分；它是一个应用程序编程接口，用于开发连接系统，能够为组织内部系统之间或互联网上系统之间的任何通信提供安全性和可靠性保障。WCF\
  \ 旨在为分布式计算提供一种可管理的方法，实现广泛的互操作性，并直接支持面向服务。WCF 是微软针对一个汇集了行业标准（定义不同协议、服务交互、类型转换、封送处理等）的平台所提供的替代方案。它为开发者提供了每个网络应用可能需要的、预先设计好的基础工具，其首个版本就包含了大量用于创建服务的实用功能（托管、服务实例管理、异步调用、可靠性、事务管理、断开连接的队列调用、安全性等）。\n\
  \n使用 WCF 作为运行时环境构建的应用，将允许我们将公共语言运行时类型作为服务使用，并允许我们将其他服务作为公共语言运行时类型来消费。服务、契约、绑定、终结点等概念将在我们开发多智能体系统通信示例的过程中逐一解释。\n\
  \n注意\n\nWindows Communication Foundation (WCF) 是一个用于在 Windows 上开发和部署服务的框架。使用 WCF，我们可以构建面向服务的应用程序。WCF\
  \ 取代了较旧的 ASMX Web 服务技术。\n\n\n\n## 服务\n\n服务是一种功能组件，可通过互联网或本地内部网络等网络供其消费者访问。计算器完全可以作为一项服务，提供给网络中的不同客户端，使它们能够连接到该服务并请求对任意给定数字执行任何运算。在面向服务的应用程序（SOA）中，我们聚合服务的方式，与开发面向对象应用程序时聚合对象的方式相同；在此类应用程序中，服务成为了一等公民。\n\
  \n服务使用任何预先商定的通信协议进行通信，并且它们可以使用任何语言、平台、版本或框架，而无需在这些方面达成任何协议。因此，可以说服务依赖于所应用的通信协议，但在其他任何领域都是独立的。\n\
  \n服务的客户端是利用服务功能的部分。在计算器服务示例中，客户端将是请求该服务求解数学表达式的程序。客户端可以是任何类型的程序，从控制台应用程序到 Windows\
  \ Forms、ASP.NET MVC 站点、WPF 程序，甚至是另一个服务。在 WCF 中，客户端从不直接与服务交互，即使是本地服务也不例外。相反，客户端始终使用代理将调用转发给服务。代理充当中间人，除了提供一些与代理相关的方法外，还呈现与服务相同的操作。\n\
  \n注意\n\n从以函数为一等公民的应用程序，发展到以对象为一等公民的应用程序（面向对象编程），经历了面向组件的应用程序（组件对象模型，COM），并最终演进到最新的阶段——面向服务的应用程序（SOA）。\n\
  \nWCF 最常使用简单对象访问协议（SOAP）消息进行通信；SOAP 是一种用于数据交换的协议。它可以被视为一组可被调用、发布和发现的组件。这些消息独立于传输协议，并且与\
  \ Web 服务不同，WCF 服务可以通过多种传输方式进行通信，而不仅仅是 HTTP。WCF 客户端能够与非 WCF 服务进行互操作，WCF 服务也可以与非 WCF\
  \ 客户端进行交互。\n\n## 协定\n\n我们在日常生活中经常处理协定，尤其是在与业务相关的事务中，以确保参与关系的各方就各种事项达成一致。在 WCF 中，协定是描述服务功能的标准方式；它是服务消费者和提供者正确关联的一种方式。在\
  \ SOA 应用程序中，拥有一个正确定义的协定可以让其消费者很好地了解如何使用该服务，即使他们可能不知道其实现方式。\n\nWCF 定义了多种类型的协定：\n\n\
  *   **服务协定**、**操作协定**：用于表示服务并描述客户端可以在服务上执行的操作。\n*   **数据协定**：用于表示对服务与客户端之间将要交换的数据的协定。WCF\
  \ 为内置类型（如 `int` 和 `string`）定义了隐式协定，并允许您为自定义类型定义显式数据协定。\n*   **错误协定**：用于通过将自定义异常类型与特定服务操作相关联，并描述服务如何处理错误以及如何将错误传播给其客户端，来定义服务引发的错误。\n\
  *   **消息协定**：由服务用于直接与消息交互，更改其格式或操作服务消息以修改其他特性，如 SOAP 标头等。\n\n在 WCF 中，有多种定义协定的方式或模式；我们可以使用单向模式、请求-响应模式或双工模式来定义它们。这些都是消息交换模式。\n\
  \n*   **单向**：当一个操作没有返回值，并且客户端应用程序不关心调用的成功或失败时，我们可以使用这种“发射后不管”的调用，称为单向。客户端发出调用后，WCF\
  \ 会生成一个请求消息，但不会有任何回复消息返回给客户端。因此，单向操作不能返回值，并且在服务端抛出的任何异常都不会传回给客户端。\n\n![A449374_1_En_6_Figa_HTML.jpg](img/A449374_1_En_6_Figa_HTML.jpg)\n\
  \n*   **请求-响应**：在此模式中，服务操作调用包括发送一条消息并期望从服务获得一条回复。使用此模式的操作具有输入参数和关联的返回值。客户端始终是发起双方通信的一方。\n\
  \n![A449374_1_En_6_Figb_HTML.jpg](img/A449374_1_En_6_Figb_HTML.jpg)\n\n*   **双工**：此交换模式允许客户端发送任意数量的消息，并以任意顺序接收。它类似于一次对话，其中说出的每个单词都被视为一条消息。任何一方都可以发起通信。\n\
  \n![A449374_1_En_6_Figc_HTML.jpg](img/A449374_1_En_6_Figc_HTML.jpg)\n\n为了在 WCF 中实现服务，通常需要遵循以下步骤：\n\
  \n1.  定义服务协定。服务协定指定了服务的签名、其交换的数据以及其他合同要求的数据。以下代码展示了非常经典的 Hello World 程序的服务版本：\n\n\
  ```\n    [ServiceContract]\n    interface IHelloWorld\n    {\n    [OperationContract(IsOneWay\
  \ = true)]\n    void HelloMessage();\n    }\n    ```\n\n2.  通过继承服务协定定义（预先安排的接口）来实现协定，并创建实现该协定的类：\n\
  \n```\n    public class Hello: IHelloWorld\n    {\n    public void HelloMessage()\n\
  \    {\n    Console.WriteLine(\"Hello World\");\n    }\n    }\n    ```\n\n3.  通过指定终结点信息和其他行为信息来配置服务。我们将在下一节中对此进行更多介绍。\
  \  \n4.  在 IIS 或应用程序中托管服务；它可以是控制台应用程序、Windows Forms、WPF、ASP.NET 等。  \n5.  创建客户端应用程序；它可以是控制台应用程序、Windows\
  \ Forms、WPF、ASP.NET 等。\n\n请注意，在 `IHelloWorld` 服务协定上声明但没有 `OperationContract` 属性的方法将不被视为\
  \ WCF 方法；换句话说，它们无法通过 WCF 应用程序进行调用。您可以将非 WCF 方法与 WCF 方法混合使用，以进行一些底层处理，但仅限于此目的。\n\n\
  \n\n## 绑定\n\nWCF 允许我们使用不同的传输协议（如 HTTP、HTTPS、TCP、MSMQ 等）以及不同的 XML 表示形式（如文本、二进制或 MTOM（消息传输优化机制））来发送消息；后者在\
  \ WCF 中被称为消息编码。此外，我们还可以利用一套 SOAP 协议（例如多种 WS-X 规范，如 `WSHttpBinding`、`WSDualHttpBinding`\
  \ 等）来改进特定的消息交互。这些改进可能涉及安全性、可靠消息传递和事务处理。这些通信概念（传输、消息编码和协议）对于理解运行时在网络上发生的情况至关重要。\n\
  \n在 WCF 中，绑定由 `System.ServiceModel.Channels.Binding` 类表示，所有绑定类都必须派生自这个基类；表 6-1 展示了\
  \ WCF 提供的一些内置绑定。\n\n表 6-1\n\nWCF 内置绑定\n\n| 绑定类 | 传输 | 消息编码 | 消息版本 |\n| --- | ---\
  \ | --- | --- |\n| `BasicHttpBinding` | HTTP | 文本 | SOAP 1.1 |\n| `WSHttpBinding`\
  \ | HTTP | 文本 | SOAP 1.2 WS-Addressing 1.0 |\n| `WSDualHttpBinding` | HTTP | 文本\
  \ | SOAP 1.2 WS-Addressing 1.0 |\n| `NetTcpBinding` | TCP | 二进制 | SOAP 1.2 |\n|\
  \ `NetPeerTcpBinding` | P2P | 二进制 | SOAP 1.2 |\n| `NetMsmqBinding` | MSMQ | 二进制\
  \ | SOAP 1.2 |\n| `CustomBinding` | 由你决定 | 由你决定 | 由你决定 |\n\n像 `BasicHttpBinding`\
  \ 和 `WSHttpBinding` 这样的绑定是为需要互操作性的场景而创建的。因此，它们都使用 HTTP 作为传输协议，并使用简单的文本进行消息编码。另一方面，带有\
  \ `Net` 前缀的绑定则针对在两端（服务端、客户端）均使用 .NET Framework 的场景进行了优化。因此，这些绑定并非为互操作性而设计，在 Windows\
  \ 环境中性能更佳。绑定是 WCF 应用程序中另一个称为终结点的组件的一部分；终结点将是下一节的主题。\n\n注意\n\n自 .NET Framework 4.5\
  \ 起，`NetPeerTcpBinding` 绑定已被标记为过时，并可能在将来被移除。\n\n## 终结点\n\nWCF 服务通过服务终结点公开，这些终结点为客户端提供了访问点，以便利用\
  \ WCF 服务提供的功能。服务终结点由所谓的服务 ABC 组成。A 代表地址（Address），它定义了服务的位置（例如 `http://localhost:9090/mas/`）。B\
  \ 代表绑定（Binding），它定义了如何与服务通信。C 代表协定（Contract），它定义了服务能做什么。因此，终结点可以看作是一个元组 <A, B, C>：地址、绑定和协定。\n\
  \n我们必须在服务端和客户端应用程序中都定义终结点；这可以通过编程方式或通过 `app.config` 文件来完成，如下一个示例（清单 6-1）所示。\n\n\
  ```\n\n清单 6-1\n在 app.config 文件中定义两个终结点\n```\n\n在 WCF 中，通过编程方式定义终结点与通过 `app.config`\
  \ 文件的配置设置定义终结点之间没有显著的技术差异。最终，.NET 会解析 `app.config` 文件并以编程方式执行其定义的配置。现在我们已经了解了 WCF\
  \ 的基础知识，接下来将介绍 WCF 支持的发布者/订阅者模式，我们将在与各种代理通信时使用该模式。\n\n## 发布者/订阅者模式\n\n实时应用程序是指那些提供特定事件实时推送或更新（例如篮球比赛、棒球比赛等）的应用程序，这些事件发生在提供推送之前很短的时间内。实时应用程序实现两种可能的机制之一来向客户端提供更新信息：推送和拉取。\n\
  \n为了理解这些机制的工作原理，让我们设想一个场景：我们希望了解一场棒球比赛的结果。我们是一个网络的一部分，该网络包含一个拥有最新信息（实时更新）的服务器，以及若干其他计算机。假设我们通过\
  \ HTTP 在浏览器（客户端）中获取实时推送，并考虑使用拉取机制，那么我们的计算机会不断发送更新请求，并从服务器拉取新信息（如果有的话）。这基本上就像时不时地问服务器：“你有什么新消息给我吗？”另一方面，如果我们采用推送机制，我们的客户端会告诉服务器：“请随时向我更新这场比赛的最新比分”，然后服务器会在有新信息可用时自动将更新“推送”给客户端。发布者/订阅者模型遵循后一种方法，即推送机制；服务器扮演发布者的角色，客户端扮演订阅者的角色，并且它需要在双方之间建立一个双工服务。\n\
  \n双工服务由两个协定组成，一个在服务器端，另一个在客户端。服务器端实现的协定将由订阅者（客户端）用于订阅特定的数据推送。客户端实现的协定将由服务器用于在需要“推送”新数据时进行调用。在客户端实现的协定称为回调协定。在接下来的章节中，我们将通过一个实际问题的示例来进一步了解发布者/订阅者模式、回调协定以及双工服务，该示例将所有这些部分整合到一个完整、可运行的实例中。\n\
  \n\n\n## 实际问题：使用 WCF 在多个代理之间进行通信\n\n在本节中，我们将创建一个 WCF 应用程序，其中多个代理共同维护一个共享消息列表，并且每个代理都能获知当前的消息列表；换句话说，每个代理都拥有实际列表的更新副本。此场景中的服务充当消息代理，将来自某个代理的新消息发送给所有其他代理。这是一个明显遵循发布者/订阅者模式的应用程序；在图\
  \ 6-1 中，我们可以看到其架构。\n\n![A449374_1_En_6_Fig1_HTML.jpg](img/A449374_1_En_6_Fig1_HTML.jpg)\n\
  \n图 6-1\n\n一个代理向列表添加消息，服务将更新后的列表传达给所有其他代理\n\n从实现过程开始，我们首先需要定义服务协定。由于我们将创建一个双工应用程序，因此服务协定定义需要附带一个回调协定。回调协定指定了服务可以在客户端上调用的操作。要在\
  \ Visual Studio 中创建 WCF 服务，请转到解决方案资源管理器，右键单击您希望作为项目容器的项目或文件夹；选择“添加新项”，然后查找“WCF 服务”选项（图\
  \ 6-2）。\n\n![A449374_1_En_6_Fig2_HTML.jpg](img/A449374_1_En_6_Fig2_HTML.jpg)\n\n\
  图 6-2\n\n向项目添加 WCF 服务\n\n添加服务后，您会看到两个文件已添加到项目中——一个类（协定实现）和一个接口（服务协定）。您还会注意到添加了对命名空间\
  \ `System.ServiceModel` 和 `System.ServiceModel.Description` 的引用，这些命名空间包含绑定类、`ServiceHost`\
  \ 类等。\n\n注意\n\n双工服务上的操作通常标记为 `OneWay = true` 以防止死锁。当多个单元相互等待对方完成，从而导致任何一方都无法完成时，就会发生死锁。\n\
  \n服务协定和回调协定的实现如代码清单 6-2 所示。\n\n```\n[ServiceContract(CallbackContract = typeof(IAgentCommunicationCallback))]\n\
  public interface IAgentCommunicationService\n{\n[OperationContract(IsOneWay = true)]\n\
  void Subscribe();\n[OperationContract(IsOneWay = true)]\nvoid Send(string from,\
  \ string to, string message);\n}\npublic interface IAgentCommunicationCallback\n\
  {\n[OperationContract(IsOneWay = true)]\nvoid SendUpdatedList(List messages);\n\
  }\n代码清单 6-2\n服务协定和回调协定\n```\n\n请注意，在前面的代码中，我们通过明确告知服务协定其回调协定是 `IAgentCommunicationCallback`\
  \ 来定义一种关系。因此，我们告诉服务，每当有新的更新可用时，使用该回调协定来通知客户端（通知将通过调用回调上的 `SendUpdateList()` 方法来实现）。服务协定包含两个操作：`Subscribe()`，用于将代理订阅到服务；以及\
  \ `Send()`，用于向消息列表发送新消息。回调协定有一个名为 `SendUpdatedList()` 的操作，用于将最新的消息列表发送给所有代理。\n\n\
  注意\n\n`IAgentCommunicationService` 和 `IAgentCommunicationCallback` 中的所有操作都返回 void，因为这是属性设置\
  \ `IsOneWay = true` 的要求。单向操作将阻塞，直到传出数据已写入网络连接。\n\n现在我们已经了解了服务和回调建立的操作协定，让我们来看看它们的具体实现。代码清单\
  \ 6-3 显示了服务实现。\n\n```\n[ServiceBehavior(InstanceContextMode = InstanceContextMode.Single,\
  \ ConcurrencyMode = ConcurrencyMode.Multiple)]\npublic class AgentCommunicationService\
  \ : IAgentCommunicationService\n{\nprivate static List _callbackChannels = new List();\n\
  private static List _messages = new List();\nprivate static readonly object _sycnRoot\
  \ = new object();\npublic void Subscribe()\n{\ntry\n{\nvar callbackChannel =\nOperationContext.Current.GetCallbackChannel();\n\
  lock (_sycnRoot)\n{\nif (!_callbackChannels.Contains(callbackChannel))\n{\n_callbackChannels.Add(callbackChannel);\n\
  Console.WriteLine(\"已添加回调通道: {0}\", callbackChannel.GetHashCode());\ncallbackChannel.SendUpdatedList(_messages);\n\
  }\n}\n}\ncatch\n{\n}\n}\npublic void Send(string from, string to, string message)\n\
  {\nlock (_sycnRoot)\n{\n_messages.Add(message);\nConsole.WriteLine(\"-- 消息列表 --\"\
  );\n_messages.ForEach(listItem => Console.WriteLine(listItem));\nConsole.WriteLine(\"\
  ------------------\");\nfor (int i = _callbackChannels.Count - 1; i >= 0; i--)\n\
  {\nif (((ICommunicationObject)_callbackChannels[i]).State != CommunicationState.Opened)\n\
  {\nConsole.WriteLine(\"检测到非打开的回调通道: {0}\", _callbackChannels[i].GetHashCode());\n\
  _callbackChannels.RemoveAt(i);\ncontinue;\n}\ntry\n{\n_callbackChannels[i].SendUpdatedList(_messages);\n\
  Console.WriteLine(\"已在回调通道上推送更新列表: {0}\", _callbackChannels[i].GetHashCode());\n\
  }\ncatch (Exception ex)\n{\nConsole.WriteLine(\"服务在回调通道上通信时引发异常: {0}\", _callbackChannels[i].GetHashCode());\n\
  Console.WriteLine(\"异常类型: {0} 描述: {1}\", ex.GetType(), ex.Message);\n_callbackChannels.RemoveAt(i);\n\
  }\n}\n}\n}\n}\n代码清单 6-3\n服务实现\n```\n\n请注意，`AgentCommunicationService` 类具有由 `ServiceBehavior`\
  \ 类定义的属性 `InstanceContextMode = InstanceContextMode.Single` 和 `ConcurrencyMode =\
  \ ConcurrencyMode.Multiple`；顾名思义，这个类允许我们为服务定义各种行为。第一个属性将其设置为 `Singleton` 类；因此，所有服务调用将由同一个服务实例处理，并且所有代理将引用相同的消息和客户端回调通道列表，因为这些字段被声明为静态的。后一个属性允许并发发生，并允许您拥有一个多线程服务，从而允许每个调用并行处理。服务对象的同步将使用\
  \ SyncRoot 模式和 C# 中的 `lock` 语句来处理。\n\n注意\n\n锁定公共对象不是一个好做法。公共对象可以被任何人锁定，从而产生意外的死锁。因此，在锁定暴露给外界的对象时应谨慎行事。SyncRoot\
  \ 模式通过使用私有的内部对象进行锁定来保证不会发生这种情况。\n\n`lock` 语句充当对象的钥匙。想象一个人想要进入一个房间，从主人那里拿到钥匙，当他在房间里时，其他人无法进入。当他离开时，他将钥匙还给主人，这样排队的下一个人就可以拿到钥匙并进入房间。防止多个线程同时访问和修改数据的代码称为线程安全代码。\n\
  \n`Subscriber()` 方法（操作）获取客户端的回调通道，并检查它是否已添加到回调通道列表中，如果尚未添加则将其添加。如果客户端之前没有访问过该服务，则向其发送\
  \ `latestMessage` 列表。\n\n在 `Send()` 方法中，我们必须确保一次只有一个线程能够访问该列表，这就是使用 `lock` 语句的原因。一旦我们添加了消息，我们就遍历每个回调通道，并通过调用它们的\
  \ `SendUpdatedList()` 方法来通知其余代理（客户端）新添加的内容。这个迭代过程是反向进行的，因为我们需要移除任何可能已将其状态更改为关闭或引发异常的通道。\n\
  \n\n\n如前所述，我们需要创建一个 `Proxy` 类来与服务交互。要创建双工代理，我们需要设计一个继承自 `DuplexClientBase<T>` 的类，然后创建服务协定（清单\
  \ 6-4）。\n\n```\npublic class AgentCommunicationServiceClient : DuplexClientBase,\
  \ IAgentCommunicationService\n{\npublic AgentCommunicationServiceClient(InstanceContext\
  \ callbackInstance, WSDualHttpBinding binding, EndpointAddress endpointAddress)\n\
  : base(callbackInstance, binding, endpointAddress) { }\npublic void Subscribe()\n\
  {\nChannel.Subscribe();\n}\npublic void Send(string from, string to, string message)\n\
  {\nChannel.Send(from, to, message);\n}\n}\n清单 6-4\n代理实现\n```\n\n从清单 6-4 可以看出，代理类的实现非常直接——只需将所有调用转发给父类\
  \ `DuplexClientBase<IAgentCommunicationService>` 提供的 `Channel` 属性（类型为 `IAgentCommunicationService`）。在\
  \ `Send` 方法中，我们包含了参数 `string from` 和 `string to`。我们将在下一章中使用这些参数来过滤来自代理和发送给代理的消息。\n\
  \n回调协定类的具体实现如清单 6-5 所示。\n\n```\n[CallbackBehavior(UseSynchronizationContext = false)]\n\
  public class AgentCommunicationCallback : IAgentCommunicationCallback\n{\npublic\
  \ event EventHandler ServiceCallbackEvent;\nprivateSynchronizationContext _syncContext\
  \ = AsyncOperationManager.SynchronizationContext;\npublic void SendUpdatedList(List\
  \ items)\n{\n_syncContext.Post(new SendOrPostCallback(OnServiceCallbackEvent), new\
  \ UpdatedListEventArgs(items));\n}\nprivate void OnServiceCallbackEvent(object state)\n\
  {\nEventHandler handler = ServiceCallbackEvent;\nvar e = state as UpdatedListEventArgs;\n\
  if (handler != null)\n{\nhandler(this, e);\n}\n}\n}\n清单 6-5\n回调协定实现\n```\n\n请记住，回调协定是负责处理从服务协定接收到的“推送更新”的。默认情况下，回调协定会在当前同步上下文上同步所有调用。如果你的客户端是\
  \ Windows Forms 应用程序，这种行为会导致代码在用户界面线程上执行，这并非一个好主意。\n\n为了将操作线程上获得的结果传达给 UI 线程，我们将使用\
  \ `AsyncOperationManager`，这是 .NET 为并发管理而整合的一个类。该类包含一个 `SynchronizationContext` 属性，该属性返回调用它的应用程序的同步上下文。最终，使用这些类的目的是在\
  \ UI 线程和操作线程之间共享数据。\n\n注意\n\n同步上下文提供了一种将工作单元排队到特定上下文的方法。它允许工作线程将消息分派到 UI 同步上下文。只有\
  \ UI 同步上下文才被允许操作 UI 控件；因此，如果我们尝试从另一个上下文更新 UI，将导致非法操作，从而引发异常。\n\n我们将使用 `SynchronizationContext`\
  \ 类的 `Post` 方法将消息异步排队到 UI 同步上下文。`Post` 方法接受两个参数：一个名为 `SendOrPostCallback` 的委托，表示消息被分派到\
  \ UI 同步上下文后需要执行的回调方法；以及一个提交给该委托的对象。我们通过传入已在 `Callback` 类中实现的 `OnServiceCallbackEvent`\
  \ 方法来创建 `SendOrPostCallback` 委托。我们还创建了 `UpdatedListEventArgs`（清单 6-6）类的一个实例，并在构造函数中提交新的消息列表。该委托和事件参数类实例被用作\
  \ `Post` 方法的参数。通过这种方式，当我们的事件调用方法从工作线程封送到 UI 线程时，它能够获取事件参数。`ServiceCallbackEvent`\
  \ 的订阅者（例如 Windows Forms、控制台应用程序等客户端）随后可以在事件触发时处理它。\n\n将 `UseSynchronizationContext`\
  \ 属性设置为 false 允许回调操作在不同线程之间分配。\n\n```\npublic class UpdatedListEventArgs : EventArgs\n\
  {\npublic List MessageList { get; set; }\npublic UpdatedListEventArgs(List messages)\n\
  {\nMessageList = messages;\n}\n}\n清单 6-6\n用作事件参数的类，用于更新客户端应用程序（Windows Forms）上的消息列表\n\
  ```\n\n现在我们已经展示了所有协定的具体实现，接下来展示充当服务主机的应用程序（清单 6-7）。\n\n```\nstatic void Main(string[]\
  \ args)\n{\n// 步骤 1 创建一个 URI 作为基地址。\nvar baseAddress = new Uri(\"http://localhost:9090/\"\
  );\n// 步骤 2 创建一个 ServiceHost 实例\nvar selfHost = new ServiceHost(typeof(AgentCommunicationService),\
  \ baseAddress);\ntry\n{\n// 步骤 3 添加服务终结点。\nselfHost.AddServiceEndpoint(typeof(IAgentCommunicationService),\n\
  new WSDualHttpBinding(WSDualHttpSecurityMode.None), \"AgentCommunicationService\"\
  );\n// 步骤 4 启用元数据交换并添加 MEX 终结点\nvar smb = new ServiceMetadataBehavior { HttpGetEnabled\
  \ = true };\nselfHost.Description.Behaviors.Add(smb);\nselfHost.AddServiceEndpoint(ServiceMetadataBehavior.MexContractName,\n\
  MetadataExchangeBindings.CreateMexHttpBinding(), baseAddress + \"mex\");\n// 步骤\
  \ 5 启动服务。\nselfHost.Open();\nConsole.WriteLine(\"服务已就绪。\");\nConsole.WriteLine(\"\
  正在监听: {0}\", baseAddress);\nConsole.WriteLine(\"按 <ENTER> 终止服务。\");\nConsole.WriteLine();\n\
  Console.ReadLine();\n// 关闭 ServiceHostBase 以关闭服务。\nselfHost.Close();\n}\ncatch (CommunicationException\
  \ ce)\n{\nConsole.WriteLine(\"发生异常: {0}\", ce.Message);\nselfHost.Abort();\n}\n\
  }\n清单 6-7\n在控制台应用程序中托管服务\n```\n\n创建服务的步骤在清单 6-7 中清晰展示。在此例中，我们将服务托管在控制台应用程序中。请注意，我们不会使用或编辑\
  \ `app.config` 文件；相反，所有绑定、地址和协定配置都是通过编程方式完成的。\n\n注意\n\n支持双工服务的 WCF 绑定有 `WSDualHttpBinding`、`NetTcpBinding`\
  \ 和 `NetNamedPipeBinding`。\n\n客户端应用程序将是一个 Windows Forms 应用程序，其代码如清单 6-8 所示。\n\n\n\
  \n```\npublic partial class AgentClient : Form\n{\nprivate const string ServiceEndpointUri\
  \ = \"http://localhost:9090/AgentCommunicationService\";\npublic AgentCommunicationServiceClient\
  \ Proxy { get; set; }\npublic AgentClient()\n{\nInitializeComponent();\nInitializeClient();\n\
  }\nprivate void InitializeClient()\n{\nif (Proxy != null)\n{\ntry\n{\nProxy.Close();\n\
  }\ncatch\n{\nProxy.Abort();\n}\n}\nvar callback = new AgentCommunicationCallback();\n\
  callback.ServiceCallbackEvent += HandleServiceCallbackEvent;\nvar instanceContext\
  \ = new InstanceContext(callback);\nvar dualHttpBinding = new WSDualHttpBinding(WSDualHttpSecurityMode.None);\n\
  var endpointAddress = new EndpointAddress(ServiceEndpointUri);\nProxy = new AgentCommunicationServiceClient(instanceContext,\
  \ dualHttpBinding, endpointAddress);\nProxy.Open();\nProxy.Subscribe();\n}\nprivate\
  \ void HandleServiceCallbackEvent(object sender, UpdatedListEventArgs e)\n{\nList\
  \ list = e.MessageList;\nif (list != null && list.Count > 0)\nmessageList.DataSource\
  \ = list;\n}\nprivate void SendBtnClick(object sender, EventArgs e)\n{\nProxy.Send(\"\
  \", \"\", wordBox.Text.Trim());\nwordBox.Clear();\n}\n}\n清单 6-8\n客户端应用程序\n```\n\n\
  正如预期，客户端应用程序（图 6-3）包含一个类型为 `AgentCommunicationServiceClient` 的字段，它代表客户端用于订阅服务并与服务通信的代理。`HandleServiceCallbackEvent`\
  \ 是当列表中添加新消息时触发的事件；这直接关系到我们之前描述的回调合约和 `OnServiceCallbackEvent` 事件。当用户点击客户端用户界面上的“发送”按钮并发送新消息时，会触发\
  \ `SendBtnClick` 事件。\n\n![A449374_1_En_6_Fig3_HTML.jpg](img/A449374_1_En_6_Fig3_HTML.jpg)\n\
  \n图 6-3\n\nWindows Forms 中的客户端用户界面\n\n现在我们已经将所有部分整合在一起，让我们测试应用程序，看看不同的代理如何通信和接收消息。\n\
  \n首先，让我们运行托管服务的控制台应用程序。\n\n注意\n\n通常需要管理员权限才能启动服务应用程序。如果在运行应用程序时遇到任何问题，请尝试以管理员身份运行。\n\
  \n然后，根据需要运行任意数量的客户端。在本例中，运行三个客户端就足够了。所描述的场景如图 6-4 所示。\n\n![A449374_1_En_6_Fig4_HTML.jpg](img/A449374_1_En_6_Fig4_HTML.jpg)\n\
  \n图 6-4\n\n运行服务与三个客户端\n\n现在我们可以操作应用程序，从任意客户端发送消息。结果将是一个所有消息的共享列表，如图 6-5 所示。\n\n\
  ![A449374_1_En_6_Fig5_HTML.jpg](img/A449374_1_En_6_Fig5_HTML.jpg)\n\n图 6-5\n\n在\
  \ WCF 发布者/订阅者应用程序中交换消息的代理\n\n在下一章中，我们将对前几节介绍的 WCF 通信应用程序稍作修改，使其适应我们的清洁代理多智能体系统示例。在清洁代理\
  \ MAS 程序中，客户端将是代理，它们通过充当消息代理（发布者）的 WCF 服务进行通信。第 5 章中探讨的概念，如合作、协调、合同网和社会法则，将在上述示例中再次涉及，并以实践的方式通过\
  \ C# 中的类和方法实现。\n\n## 总结\n\n在本章中，我们解释了 WCF 的一些基础知识（服务、合约、地址、绑定和终结点），以及网络应用程序中的一种常见模式——发布者/订阅者模型。我们介绍并描述了双工服务及其一些特性，例如回调合约。我们实现了一个\
  \ WCF 程序，该程序模拟了多个代理的通信，使用托管在控制台应用程序上的服务作为消息代理，并使用 Windows Forms 应用程序作为客户端。在下一章中，我们将把这个应用程序集成到一个更大的程序中，该程序模拟一个多智能体系统的过程，其任务是清除一个\
  \ n x m 房间内的所有污垢。\n\n"
- "# 7. 清洁代理：一个多智能体系统问题\n\n在第 5 章和第 6 章中，我们学习了多智能体系统（MAS）和多智能体通信。我们介绍了诸如智能体平台、智能体架构、协调、合作、社会法则等概念；我们还详细阐述了一个实际问题，即使用\
  \ Windows Communication Foundation（WCF）创建了一个多智能体通信模块。\n\n在本章中，我们将分析一个完整的实际问题，将所有部分整合在一起，开发一个\
  \ MAS，其中 n 个清洁代理将负责清理一个 n x m 房间内的污垢。这个问题将使我们能够融入之前学习的许多概念和定义，并将第 6 章中创建的 WCF 通信模块作为系统中每个智能体都将集成的\
  \ MAS 通信模块。\n\n清洁问题是一个很好的基准或场景，通过它我们可以理解如何使用 MAS 在更短的时间内、使用比单个智能体更少的资源来解决诸如清洁之类的任务。\n\
  \n注意\n\n清洁问题中的每个机器人将在其通信模块的核心使用 WCF，并使用 Windows Forms 来显示接收到的消息。\n\n## 程序结构\n\n\
  应用程序的结构将如图 7-1 所示。该程序包含通信、GUI（图形用户界面）、协商、规划和平台模块。通信和规划模块（除了通信语言 `FipaAcl` C# 类）将不在本章中分析，因为它们之前已经研究过。如需进一步参考，请下载本书附带的源代码。\n\
  \n![A449374_1_En_7_Fig1_HTML.jpg](img/A449374_1_En_7_Fig1_HTML.jpg)\n\n图 7-1\n\n\
  程序结构\n\nGUI 模块将包含两个 Windows Forms 应用程序——一个用于图形化表示房间、房间内的每个智能体及其交互，另一个用于表示智能体消息板。\n\
  \n协商模块将包含合同网任务共享方法的一个实现，每个阶段都作为 `ContractNet` 类中的一个静态 C# 方法实现。\n\n平台模块将包含一个智能体平台及其部分功能（通过字典进行智能体定位、用于任务共享的“决定角色”服务、对管理者和承包者的引用等）的实现。它将为其他类提供支持。\n\
  \n在通信模块中，我们将包含智能体通信语言（ACL）模块，该模块包含一个精简版的 `FIPA-ACL`，包括几个执行语。\n\n注意\n\n为了简化此 MAS\
  \ 示例中的规划任务，我们将假设列数（M）始终能被 MAS 中的智能体数量（S）整除，即 M % S == 0。这将使我们能够简单地为每个智能体分配 M / S\
  \ 列进行清洁。\n\n\n\n## 清洁任务\n\n为了表示和编码清洁任务，我们创建了清单 7-1 中所示的类。\n\n```\npublic class CleaningTask\n\
  {\npublic int Count { get; set; }\npublic int M { get; set; }\npublic List> SubDivide\
  \ { get; set; }\npublic IEnumerable SubTasks { get; set; }\npublic CleaningTask(int\
  \ m, int agents)\n{\nM = m;\nCount = agents;\nSubDivide = new List>();\nDivide();\n\
  SubTasks = BuildTasks();\n}\n/// \n/// 对于划分，我们假设 M % Count = 0，即\n/// 列数始终能被智能体数量整除。\n\
  /// \nprivate void Divide()\n{\nvar div = M / Count;\nfor (var i = 0; i (i, i +\
  \ div - 1));\n}\nprivate IEnumerable BuildTasks()\n{\nvar result = new string[SubDivide.Count];\n\
  for (var i = 0; i < SubDivide.Count; i++)\nresult[i] = \"clean(\" + SubDivide[i].Item1\
  \ + \",\" + SubDivide[i].Item2 + \")\";\nreturn result;\n}\n}\n清单 7-1\nCleaningTask\
  \ 类\n```\n\n该类包含以下字段或属性：\n\n*   `Count`：整数，表示参与清洁任务的智能体数量\n*   `M`：整数，表示房间的列数\n\
  *   `SubDivide`：`List<Tuple<int, int>>`，表示根据智能体数量和列数做出的公平列划分\n*   `SubTasks`：`IEnumerable<string>`，表示为了完成全局任务（清洁整个房间）而需要执行的一组任务。每个任务都使用我们的小型\
  \ `FipaAcl` 将要使用的自定义内部语言来定义。\n\n另一方面，`CleaningTask` 类公开了以下方法：\n\n*   `Divide()`：将清洁房间的全局任务划分为更小的子任务。每个子任务将由一组需要清洁的连续列组成。它在\
  \ `SubDivide` 属性中存储一组元组，每个元组定义了一个需要清洁的列范围；例如，(0, 2) 表示清洁第 0 列到第 2 列的子任务。\n*   `BuildTasks()`：返回一个\
  \ `IEnumerable<string>`，其中包含使用自定义语言描述的每个子任务，该语言稍后将用于通过通信模块并使用 FIPA 作为 ACL 来传输信息。\n\
  \n为了保持应用程序的良好模块化，`CleaningTask` 类仅处理与清洁问题相关的操作。在下一节中，我们将介绍清洁智能体平台。\n\n## 清洁智能体平台\n\
  \n清洁智能体平台由 `CleaningAgentPlatform` 类表示，其代码见清单 7-2。\n\n```\npublic class CleaningAgentPlatform\n\
  {\npublic Dictionary Directory { get; set; }\npublic IEnumerable Agents { get; set;\
  \ }\npublic IEnumerable Contractors { get; set; }\npublic MasCleaningAgent Manager\
  \ { get; set; }\npublic CleaningTask Task { get; set; }\npublic CleaningAgentPlatform(IEnumerable\
  \ agents, CleaningTask task)\n{\nAgents = new List(agents);\nDirectory = new Dictionary();\n\
  Task = task;\nforeach (var cleaningAgent in Agents)\n{\nDirectory.Add(cleaningAgent.Id,\
  \ cleaningAgent);\ncleaningAgent.Platform = this;\n}\nDecideRoles();\n}\npublic\
  \ void DecideRoles()\n{\n// 管理者角色\nManager = Agents.First(a => a.CleanedCells.Count\
  \ == Agents.Max(p => p.CleanedCells.Count));\nManager.Role = ContractRole.Manager;\n\
  // 承包者角色\nContractors = new List(Agents.Where(a => a.Id != Manager.Id));\nforeach\
  \ (var cleaningAgent in Contractors)\ncleaningAgent.Role = ContractRole.Contractor;\n\
  (Contractors as List).Add(Manager);\n}\n}\n清单 7-2\nCleaningAgentPlatform 类\n```\n\
  \n该类包含以下属性或字段：\n\n*   `Directory`：字典，包含智能体的 ID 及其引用，作为键值对\n*   `Agents`：`IEnumerable`，包含智能体集合\n\
  *   `Contractors`：`IEnumerable`，包含合同网中的承包者集合\n*   `Manager`：对合同网中管理者的引用\n*   `Task`：待执行的清洁任务\n\
  \n该类包含两个函数：一个构造函数和 `DecideRoles()` 方法。在构造函数中，我们初始化每个属性，然后将每个智能体添加到目录中，并将智能体的 `Platform`\
  \ 属性引用指向此平台。`DecideRoles()` 方法决定选择哪个智能体作为管理者，而其余智能体则被视为承包者。在此例中，选择管理者的标准是选择清洁单元格数量最多的智能体；这相当于说“选择最有经验的智能体，即工作最多的那个。”\n\
  \n注意\n\n在此例中，我们也将管理者添加到承包者列表中，因为我们希望他不仅指挥操作，还能像其他承包者一样参与其中，清洁房间的某一列范围。\n\n\n\n##\
  \ 合同网\n\n合同网任务分配机制由 `ContractNet` 类表示；每个智能体所扮演的角色在 `ContractRole` 枚举中定义。两者均在代码清单\
  \ 7-3 中描述。\n\n```\npublic class ContractNet\n{\npublic static IEnumerable Announcement(CleaningTask\
  \ cleaningTask, MasCleaningAgent manager, IEnumerable contractors, FipaAcl language)\n\
  {\nvar tasks = cleaningTask.SubTasks;\nforeach (var contractor in contractors)\n\
  {\nforeach (var task in tasks)\nlanguage.Message(Performative.Cfp, manager.Id.ToString(),\
  \ contractor.Id.ToString(), task);\n}\nreturn tasks;\n}\npublic static void Bidding(IEnumerable\
  \ tasks, IEnumerable contractors)\n{\nforeach (var contractor in contractors)\n\
  contractor.Bid(tasks);\n}\npublic static void Awarding(List messages, MasCleaningAgent\
  \ manager, IEnumerable contractors, CleaningTask task, FipaAcl language)\n{\nvar\
  \ agentsAssigned = new List>>();\nvar messagesToDict = messages.ConvertAll(FipaAcl.MessagesToDict);\n\
  // 处理投标\nforeach (var colRange in task.SubDivide)\n{\nvar firstCol = colRange.Item1;\n\
  var secondCol = colRange.Item2;\n// 第一列的投标\nvar bidsFirstCol = new List>>>>();\n\
  // 第二列的投标\nvar bidsSecondCol = new List>>>>();\nforeach (var contractor in contractors)\n\
  {\n// 跳过已分配的智能体\nif (agentsAssigned.Exists(tuple => tuple.Item1.Id == contractor.Id))\n\
  continue;\nvar c = contractor;\n// 获取当前承包商的投标消息\nvar messagesFromContractor = messagesToDict.FindAll(m\
  \ => m.ContainsKey(\"from\") && m[\"from\"] == c.Id.ToString());\nvar bids = FipaAcl.GetContent(messagesFromContractor);\n\
  // 列范围内第一列的投标\nvar bidsContractorFirstCol = bids.FindAll(b => b.Item2.Item2 == firstCol);\n\
  // 列范围内第二列的投标\nvar bidsContractorSecondCol = bids.FindAll(b => b.Item2.Item2 ==\
  \ secondCol);\nif (bidsContractorFirstCol.Count > 0)\n{\nbidsFirstCol.Add(\nnew\
  \ KeyValuePair>>>(contractor,\nbidsContractorFirstCol));\n}\nif (bidsContractorSecondCol.Count\
  \ > 0)\n{\nbidsSecondCol.Add(\nnew KeyValuePair>>>(contractor,\nbidsContractorSecondCol));\n\
  }\n}\n// 排序，使列表开头为最佳投标者（最近的智能体）\nbidsFirstCol.Sort(Comparison);\nbidsSecondCol.Sort(Comparison);\n\
  var closestAgentFirst = bidsFirstCol.FirstOrDefault();\nvar closestAgentSecond =\
  \ bidsSecondCol.FirstOrDefault();\n// 再次排序以找到最近的端点\nif (closestAgentFirst.Value\
  \ != null)\nclosestAgentFirst.Value.Sort(Comparison);\nif (closestAgentSecond.Value\
  \ != null)\nclosestAgentSecond.Value.Sort(Comparison);\n// 将智能体分配到列范围\nif (closestAgentFirst.Value\
  \ != null && closestAgentSecond.Value != null)\n{\nif (closestAgentFirst.Value.First().Item1\
  \ >= closestAgentSecond.Value.First().Item1)\nagentsAssigned.Add(new Tuple>(closestAgentSecond.Key,\n\
  closestAgentSecond.Value.First().Item2));\nelse\nagentsAssigned.Add(new Tuple>(closestAgentFirst.Key,\n\
  closestAgentFirst.Value.First().Item2));\n}\nelse if (closestAgentFirst.Value ==\
  \ null)\nagentsAssigned.Add(new Tuple>(closestAgentSecond.Key,\nclosestAgentSecond.Value.First().Item2));\n\
  else\nagentsAssigned.Add(new Tuple>(closestAgentFirst.Key,\nclosestAgentFirst.Value.First().Item2));\n\
  }\n// 为每个智能体传输接受的提案。\nforeach (var assignment in agentsAssigned)\nlanguage.Message(Performative.Accept,\
  \ manager.Id.ToString(),\nassignment.Item1.Id.ToString(), \"clean(\" + assignment.Item2.Item1\
  \ + \",\" + assignment.Item2.Item2 + \")\");\n}\nprivate static int Comparison(Tuple>\
  \ tupleA, Tuple> tupleB)\n{\nif (tupleA.Item1 > tupleB.Item1)\nreturn 1;\nif (tupleA.Item1\
  \ >>> bidsAgentA, KeyValuePair>>> bidsAgentB)\n{\nif (bidsAgentA.Value.Min(p =>\
  \ p.Item1) > bidsAgentB.Value.Min(p => p.Item1))\nreturn 1;\nif (bidsAgentA.Value.Min(p\
  \ => p.Item1)  p.Item1))\nreturn -1;\nreturn 0;\n}\n}\npublic enum ContractRole\n\
  {\nContractor, Manager, None\n}\n代码清单 7-3\nContractNet 类\n```\n\n该类包含以下静态方法：\n\n\
  *   `Announcement()`：管理者向每个承包商发送消息，宣布所有待完成的任务。\n*   `Bidding()`：要求每个智能体针对待完成的任务集提交投标。智能体端的投标在\
  \ `MasCleaningAgent` 类的 `Bid()` 方法中执行。\n*   `Awarding()`：执行任务分配机制最后阶段的方法。为了将列范围\
  \ x - x' 授予某个承包商（智能体），该方法计算每个智能体到该列范围四个端点的距离——即第一列的单元格 (0, x) 和 (n - 1, x)，以及第二列的单元格\
  \ (0, x') 和 (n - 1, x')——然后将该列范围授予距离这四个端点中任意一个最近的智能体（最小街区距离或曼哈顿距离）。智能体的投标包含一个 `tuple<int,\
  \ int>` 用于定义最近的端点，以及一个 `double` 值表示到该端点的距离。更多细节请参考代码注释。\n*   `Comparison()`：这两个方法均涉及通过考虑表示元素到某列距离的\
  \ double 值来对元素列表进行排序。\n\n每个方法都被创建为该类的服务；换句话说，它们都是无需创建类实例即可调用的静态方法。\n\n\n\n## FIPA-ACL\n\
  \n为了在智能体之间沟通清洁相关问题，我们创建了一种用于处理此类命令的微型语言。这种微型语言类似于`FIPA 语言`，并包含一种内部语言，该语言仅包含`clean(x,\
  \ y)`语句，用于指示智能体清理从 x 到 y 的所有列。`FipaAcl`类和`Performative`枚举均如代码清单 7-4 所示。\n\n```\n\
  public class FipaAcl\n{\npublic AgentCommunicationServiceClient Communication {\
  \ get; set; }\npublic FipaAcl(AgentCommunicationServiceClient communication)\n{\n\
  Communication = communication;\n}\npublic void Message(Performative p, string senderId,\
  \ string receiverId, string content)\n{\nswitch (p)\n{\ncase Performative.Accept:\n\
  ThreadPool.QueueUserWorkItem(delegate { Communication.Send(senderId, receiverId,\
  \ \"accept[content:\" + content + \";]\"); });\nbreak;\ncase Performative.Cfp:\n\
  ThreadPool.QueueUserWorkItem(delegate { Communication.Send(senderId, receiverId,\
  \ \"cfp[content:\" + content + \";]\"); });\nbreak;\ncase Performative.Proposal:\n\
  ThreadPool.QueueUserWorkItem(delegate { Communication.Send(senderId, receiverId,\
  \ \"proposal[from:\" + senderId + \";content:\" + content + \"]\"); });\nbreak;\n\
  }\n}\npublic static string GetPerformative(string task)\n{\nreturn task.Substring(0,\
  \ task.IndexOf('['));\n}\npublic static string GetInnerMessage(string task)\n{\n\
  return task.Substring(task.IndexOf('[') + 1, task.LastIndexOf(']') - task.IndexOf('[')\
  \ - 1);\n}\npublic static Dictionary MessageToDict(string innerMessage)\n{\nvar\
  \ result = new Dictionary();\nvar items = innerMessage.Split(';');\nvar contentItems\
  \ = new List();\nforeach (var item in items)\nif (!string.IsNullOrEmpty(item))\n\
  contentItems.AddRange(item.Split(':'));\nfor (int i = 0; i  MessagesToDict(string\
  \ message)\n{\nreturn MessageToDict(GetInnerMessage(message));\n}\npublic static\
  \ List>> GetContent(List> messagesFromContractor)\n{\nvar result = new List>>();\n\
  foreach (var msg in messagesFromContractor)\n{\nvar content = msg[\"content\"];\n\
  var values = content.Split(',');\nresult.Add(new Tuple>(double.Parse(values[0]),\n\
  new Tuple(int.Parse(values[1]), int.Parse(values[2]))));\n}\nreturn result;\n}\n\
  }\npublic enum Performative\n{\nAccept, Cfp, Inform, Proposal\n}\n代码清单 7-4\nFipaACL\
  \ 类\n```\n\n请注意，每个智能体之间的通信都是通过`ThreadPool`类的`QueueUserWorkItem`方法执行的。启动一个新线程可能是一项非常昂贵的操作；因此，我们利用线程池的功能来重用线程并降低成本。通过这种方式，我们将方法排队，以便在线程池提供的不同线程上执行。\n\
  \n`FipaACL`类包含一个`AgentCommunicationServiceClient`通信属性（回顾第 6 章，`AgentCommunicationServiceClient`是建立客户端与服务之间通信的代理），该属性用于向其他智能体发送消息。`FipaACL`包含了以下方法：\n\
  \n*   `Message()`：根据执行语类型，使用作为参数提供的`senderId`、`receiverId`和`content`字符串创建并发送一条新消息。\n\
  *   `GetPerformative()`：获取作为参数提供的消息的执行语；例如，对于像`cfp[content: clean(0,2)]`这样的消息，执行语将是`cfp`。\n\
  *   `GetInnerMessage()`：获取内部消息；例如，如果整个消息类似于`cfp[from: 2312; content: clean(0,2)]`，那么`from:\
  \ 2312; content: clean(0,2)`就代表了内部消息。\n*   `MessageToDict()`：假设提供了一个内部消息作为参数，它会将该内部消息转换为一个字典；例如，对于像`from:\
  \ 2312; content: clean(0,2)`这样的内部消息，生成的字典将是`{ 'from': 2312, 'content': 'clean(0,2)'\
  \ }`。\n*   `MessagesToDict()`：获取作为参数提交的消息的内部消息，并返回由`MessageToDict()`方法生成的字典。\n*\
  \   `GetContent()`：获取内部消息的 content 标签中包含的一组值。它假设每条消息对应一个承包商的投标；因此，它包含三个元素：一个双精度浮点数距离和一对与列范围匹配的整数；例如，`2.0,\
  \ 1, 1`将添加元组`<2.0, <0, 2>>`。\n\n本章介绍的多智能体系统清洁示例中，唯一使用`FipaAcl`类的组件是`ContractNet`和`MasCleaningAgent`类；后者将是下一节的主题。\n\
  \n\n\n## MAS 清洁代理\n\n清洁 MAS 示例中的代理是 `MasCleaningAgent` 类的对象，该类包含清单 7-5 所示的属性、字段和构造函数集合。\n\
