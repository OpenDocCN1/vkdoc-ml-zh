  \ new List<Tuple<int, int>>(tempFlips));\n    else\n        Flips[oppPlayerPos].AddRange(tempFlips);\n\
  }\n\nprivate bool CheckLftRgt(Tuple<int, int> oppPlayerPos, int player, Func<int,\
  \ bool> condition, int direction, List<Tuple<int, int>> tempFlips)\n{\n    for (var\
  \ i = oppPlayerPos.Item2; condition(i); i += direction)\n    {\n        if (Board[oppPlayerPos.Item1,\
  \ i] == player)\n        {\n            UpdateFlips(oppPlayerPos, tempFlips);\n\
  \            return true;\n        }\n        if (EmptyCell(oppPlayerPos.Item1,\
  \ i))\n        {\n            tempFlips.Clear();\n            break;\n        }\n\
  \        tempFlips.Add(new Tuple<int, int>(oppPlayerPos.Item1, i));\n    }\n   \
  \ return false;\n}\n\nprivate bool CheckDiagonal(Tuple<int, int> oppPlayerPos, int\
  \ player, Func<int, bool> conditionRow, Func<int, bool> conditionCol, int directionRow,\
  \ int directionCol, List<Tuple<int, int>> tempFlips)\n{\n    var i = oppPlayerPos.Item1;\n\
  \    var j = oppPlayerPos.Item2;\n    while (conditionRow(i) && conditionCol(j))\n\
  \    {\n        if (Board[i, j] == player)\n        {\n            UpdateFlips(oppPlayerPos,\
  \ tempFlips);\n            return true;\n        }\n        if (EmptyCell(i, j))\n\
  \        {\n            tempFlips.Clear();\n            break;\n        }\n    \
  \    tempFlips.Add(new Tuple<int, int>(i, j));\n        i += directionRow;\n   \
  \     j += directionCol;\n    }\n    return false;\n}\n\npublic void SetPiece(int\
  \ i, int j, int player)\n{\n    Board[i, j] = player;\n    FlipPieces(i, j, player,\
  \ this);\n}\n\nprivate void FlipPieces(int i, int j, int player, OthelloBoard othello)\n\
  {\n    var piecesToFlip = Flips[new Tuple<int, int>(i, j)];\n    UpdatePiecePos(new\
  \ Tuple<int, int>(i, j), player, othello);\n    foreach (var pair in piecesToFlip)\n\
  \    {\n        othello.Board[pair.Item1, pair.Item2] = player;\n        UpdatePiecePos(pair,\
  \ player, othello);\n    }\n}\n\nprivate void UpdatePiecePos(Tuple<int, int> pair,\
  \ int player, OthelloBoard othello)\n{\n    var removeFrom = player == 1 ? othello.Player2Pos\
  \ : othello.Player1Pos;\n    var addTo = player == 1 ? othello.Player1Pos : othello.Player2Pos;\n\
  \    if (!addTo.Contains(pair))\n        addTo.Add(pair);\n    removeFrom.Remove(pair);\n\
  }\n代码清单 16-4\n方法 CheckUpDown()、CheckLftRgt()、CheckDiagonal()、UpdateFlips()、SetPiece()、FlipPieces()\
