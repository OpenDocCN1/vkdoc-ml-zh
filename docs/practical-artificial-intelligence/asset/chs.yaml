  \ 类中创建的代理作为参数传递。最后，代理的 `Timer` 被启用并订阅了 `ReactionTimeOnTick`（清单 7-7）。该方法将每秒执行一次，促使代理采取行动。\n\
  \n```\nprivate void ReactionTimeOnTick(object sender, EventArgs eventArgs)\n{\n\
