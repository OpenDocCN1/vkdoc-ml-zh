  \n\n\n## 知情搜索\n\n在知情`搜索`中，我们利用问题定义之外的领域知识，旨在尽可能高效地解决问题。因此，在知情搜索算法中，我们会尝试智能地选择要探索的路径。知情搜索方法的一般方法由一系列算法表示，这些算法统称为最佳优先搜索。\n\
  \n最佳优先搜索类型的方法始终依赖于一个评估函数 F(n)，该函数为状态树中的每个节点 n 关联一个值。这个值旨在表示给定节点距离达到目标节点有多近；因此，最佳优先搜索方法通常会选择具有最低\
  \ F(n) 值的节点 n 来继续搜索过程（图 15-10）。尽管我们将这类算法称为“最佳优先”，但实际上并没有确定的方法来找到通往目标节点的最低成本路径。如果可能的话，我们就能始终获得最优解，而无需付出任何额外努力（启发式等）。\n\
  \n![A449374_1_En_15_Fig10_HTML.jpg](img/A449374_1_En_15_Fig10_HTML.jpg)\n\n图 15-10\n\
  \n在最佳优先搜索方法中，我们总是选择具有尽可能低的 F(n) 值的节点 n 来继续搜索。在此例中，F = 3，因此搜索从该节点继续。\n\n由于知情搜索策略会优先搜索状态空间中最有希望的分支，因此它们能够：\n\
  \n*   更快地找到解决方案；\n*   即使在时间有限的情况下也能找到解决方案；以及\n*   找到更好的解决方案，因为可以检查状态空间中更有利可图的部分，同时忽略无利可图的部分。\n\
  \n最佳优先搜索是一种搜索策略，并且如前所述，它是一个算法家族，其主要代表是贪婪最佳优先搜索和 A* 搜索。\n\n贪婪最佳优先搜索本质上是一种最佳优先搜索，其中评估函数\
  \ F(n) 是一个启发式函数；即 F(n) = H(n)。针对不同问题的启发式函数示例包括地图上两点之间的直线距离、错位元素的数量等。它们代表了一种在问题求解过程中嵌入额外知识的方法。当\
  \ H(n) = 0 时，意味着我们已经到达了一个目标节点。贪婪最佳优先搜索会扩展看似最接近目标的节点，但它既不是最优的，也不是完备的（可能会陷入无限循环）。该方法的一个明显问题是它没有考虑到当前节点的成本，因此如前所述，它并非最优，并且可能会像深度优先搜索一样走入死胡同。在使用启发式的方法中，如果我们采用一个智能的启发式，能够在几步之内引导我们走向正确的方向，那么就可以大幅降低复杂度。\n\
  \n注意\n\n当状态空间过大时，无信息的盲目搜索可能耗时过长而不实用，或者会严重限制我们探索空间的深度。因此，我们必须寻找那些通过沿途做出智能决策来缩小状态空间区域的方法；也就是说，我们必须寻找知情方法。\n\
  \nA* 搜索（Hart、Nilsson 和 Raphael，1968 年）是一种非常流行的方法，也是最佳优先搜索算法家族中最著名的成员。该方法背后的主要思想是避免扩展那些已经代价高昂的路径（考虑到从根节点遍历到当前节点的成本），并始终优先扩展最有希望的路径。该方法的评估函数是两个函数之和；即\
  \ F(n) = G(n) + H(n)，其中：\n\n*   G(n) 是到达节点 n 的（迄今为止的）成本；以及\n*   H(n) 是一个启发式函数，用于估计从节点\
  \ n 到达目标状态的成本。\n\n因为我们实际上是在寻找初始状态与某个目标状态之间的最优路径，所以衡量一个状态有多有希望的一个更好的指标是：迄今为止的成本加上从该节点到最近目标状态的最佳估计成本之和（图\
  \ 15-11）。\n\n![A449374_1_En_15_Fig11_HTML.jpg](img/A449374_1_En_15_Fig11_HTML.jpg)\n\
  \n图 15-11\n\n显示 G(s) 和 H(s) 之间关系的示意图\n\n为了在巨大的状态空间中引导搜索，我们使用启发式方法。启发式方法提供的信息旨在帮助我们找到一条可行且较短的路径，通往目标状态或配置。\n\
  \n在开发启发式方法时，确保其满足可采纳性标准非常重要。如果一个启发式方法不会高估从当前状态到达目标状态的最小成本，那么它就是可采纳的；如果可采纳，那么 A*\
  \ 搜索算法将始终找到最优解。\n\n\n## 滑动拼图游戏的 A* 算法\n\n表示滑动拼图游戏状态空间的树结构与双向搜索中开发的树结构相同。当前节点的邻域将由空白方块已交换到所有可能位置的棋盘组成。\n\
  \n滑动拼图游戏最常用的启发式函数是**错位方块数**，它可能也是该谜题最简单的启发式函数。顾名思义，错位方块数启发式函数返回的是错位方块的数量——即当前棋盘中的位置与目标状态或棋盘中的位置不匹配的方块数量。它是可采纳的，因为返回的数字不会高估到达目标状态所需的最小移动次数。你至少需要将每个错位的方块移动一次，才能将它们交换到目标位置；因此，它是可采纳的。\n\
  \n需要指出的是，在计算滑动拼图游戏的任何启发式函数时，我们绝不应考虑空白方块。如果在启发式计算中考虑了空白方块，那么我们可能会高估到达目标状态最短路径的实际代价，这将使启发式函数变得不可采纳。考虑一下，如果我们在一个距离目标状态仅一步之遥的棋盘中考虑了空白方块，会发生什么，如图\
  \ 15-12 所示。\n\n![A449374_1_En_15_Fig12_HTML.jpg](img/A449374_1_En_15_Fig12_HTML.jpg)\n\
  \n图 15-12\n\n如果我们考虑空白方块，到达目标状态的路径将是 2，但实际上它是 1；因此，我们高估了到达目标状态最短路径的实际代价。\n\n使用错位方块数启发式函数的\
  \ A* 算法大约需要 2.5 秒才能找到目标状态。实际上，我们可以做得更好，所以让我们尝试找到一个更巧妙的启发式函数，以缩短时间并减少访问的节点数。\n\n\
  注意\n\n关于此问题的完整 C# 代码，请参考作者撰写的以下文章：[`https://visualstudiomagazine.com/Articles/2015/10/30/Sliding-Tiles-C-Sharp-AI.aspx`](https://visualstudiomagazine.com/Articles/2015/10/30/Sliding-Tiles-C-Sharp-AI.aspx)\
  \ 。\n\n**曼哈顿距离**，或称**街区距离**，点 A=(x1, y1) 和 B=(x2, y2) 之间的启发式函数定义为它们对应坐标之差的绝对值之和：\n\
  \n![ $$ \\mathrm{MD}=\\mid {\\mathrm{x}}_1-{\\mathrm{x}}_2\\mid +\\mid {\\mathrm{y}}_1-{\\\
  mathrm{y}}_2\\mid $$ ](img/A449374_1_En_15_Chapter_Equa.gif)\n\n曼哈顿距离是可采纳的，因为它为每个方块返回将该方块移动到其目标位置所需的最小步数。曼哈顿距离是比错位方块数更精确的启发式函数；因此，在时间复杂度和访问节点数上的减少将是显著的。我们提供了更好的信息来指导搜索，因此目标能更快地被找到。使用此启发式函数，我们在\
  \ 172 毫秒内得到了一个最优解（有关完整的 C# 代码，请参考前面详述的文章）。\n\n**线性冲突**启发式函数提供了曼哈顿距离未计数的必要移动信息。如果两个方块\
  \ tj 和 tk 在同一行，tj 和 tk 的目标位置都在该行，tj 在 tk 的右侧，并且 tj 的目标位置在 tk 的目标位置的左侧，则称 tj 和 tk\
  \ 处于线性冲突中。\n\n![A449374_1_En_15_Fig13_HTML.jpg](img/A449374_1_En_15_Fig13_HTML.jpg)\n\
  \n图 15-13\n\n方块 3 和 1 位于正确的行，但列错误\n\n要将它们移动到目标位置，我们必须将其中一个向下移动，然后再向上移动；这些移动在曼哈顿距离中并未考虑。一个方块不能出现在多个冲突中，因为解决一个确定的冲突可能意味着同一行或列中其他冲突的解决。因此，如果方块\
  \ 1 与方块 3 存在冲突关系，那么它就不能再与方块 2 存在冲突关系，因为这可能会高估到达目标状态的最短路径，并使我们的启发式函数变得不可采纳。\n\n为了测试**线性冲突\
  \ + 曼哈顿距离**组合启发式函数，我们将使用图 15-14 中所示的 4 × 4 棋盘；该棋盘需要 55 步才能到达目标状态。节点 n 的值将由 F(n)\
  \ = Depth(n) + MD(n) + LC(n) 给出。组合这些启发式函数是可能的，因为它们所代表的移动不会相交，因此我们不会高估到达目标状态最短路径的代价。\n\
  \n![A449374_1_En_15_Fig14_HTML.jpg](img/A449374_1_En_15_Fig14_HTML.jpg)\n\n图 15-14\n\
  \n用于测试曼哈顿距离 + 线性冲突启发式函数的 4 × 4 棋盘。15 方块问题的状态空间比 8 方块问题要广阔得多。\n\n在完成一次遍历了超过一百万个节点、耗时\
  \ 124199 毫秒（略多于 2 分钟）的执行后，该算法为我们提供了一个解。\n\n**模式数据库**启发式函数由一个包含游戏不同状态的数据库定义。每个状态都与将一个模式（方块的子集）移动到其目标位置所需的最小移动次数相关联。在这种情况下，我们通过从\
  \ 8 方块目标状态开始进行逆向广度优先搜索，构建了一个小型模式数据库。结果保存在一个仅有 60,000 条记录的 `.txt` 文件中。为数据库选择的模式通常被称为“边缘”，在这种情况下，它包含顶行和最左列的方块。\n\
  \n![A449374_1_En_15_Fig15_HTML.jpg](img/A449374_1_En_15_Fig15_HTML.jpg)\n\n图 15-15\n\
  \n在 3 × 3 棋盘中使用的模式\n\n模式数据库启发式函数通过一个表查找函数来计算。在这种情况下，它是一个包含 60,000 个存储模式的字典查找。它在哲学上类似于分治法和动态规划技术。\n\
  \n使用**模式数据库**技术，我们可以在 50 毫秒内解决最难的 8 方块问题或配置。\n\n我们向数据库添加的条目越多，算法找到目标状态所消耗的时间就越少。在这种情况下，内存与时间之间的权衡有利于前者，并帮助我们获得良好的运行时间。这通常是其工作方式；你使用更多内存来减少算法的执行时间。当你想要解决\
  \ 4 x 4 谜题或 n 和 m 都大于 3 的 m x n 谜题时，模式数据库启发式函数代表了最终的替代方案。给读者的最后建议是将本节介绍的 A* 搜索和启发式函数与双向搜索结合起来，并比较结果。\n\
  \n## 总结\n\n在本章中，我们介绍了游戏编程，更具体地说，是游戏中的搜索。我们分析了在状态空间中搜索的基本方法，包括归类为无信息搜索的方法——广度优先搜索、深度优先搜索、深度限制搜索、迭代加深搜索和双向搜索——以及归类为有信息搜索的方法：最佳优先搜索和\
  \ A*。我们实现了一个针对滑动拼图游戏定制的、使用广度优先搜索作为子过程的双向搜索。最后，我们展示了如何使用不同的启发式函数为滑动拼图游戏开发 A* 搜索，如何组合其中一些启发式函数，以及如何通过使用\
  \ C# 的 `Stopwatch` 类来评估它们在时间复杂度方面的性能。\n\n\n\n"
- "# 16. 博弈论：对抗性搜索与黑白棋\n\n与博弈论关系最密切的人物，毫无疑问是约翰·冯·诺依曼，这位匈牙利裔美国数学家——二十世纪最伟大的数学家之一。尽管在他之前也有人提出了与博弈论相关的概念（尤其是埃米尔·博雷尔），但正是冯·诺依曼在\
  \ 1928 年发表了为两人零和博弈理论奠定基础的论文。他的研究成果最终体现在与奥斯卡·摩根斯坦合著的一本博弈论重要著作中，书名为《博弈论与经济行为》（1944\
  \ 年）。\n\n冯·诺依曼和摩根斯坦发展的理论与一类被称为**两人零和博弈**的游戏高度相关，即只有两名玩家，且一方赢得的正是另一方输掉的游戏。他们的数学框架最初使得该理论仅在特殊且有限的条件下适用。在过去的六十年里，这种情况发生了巨大变化，该框架得到了加强和推广。自\
  \ 20 世纪 70 年代末以来，可以断言博弈论已成为许多科学领域，尤其是经济学中，最重要且最有用的工具之一。在 20 世纪 50 年代和 60 年代，博弈论在理论上得到扩展，并应用于战争和政治问题。此外，它还在社会学和心理学中找到了应用，并与进化论和生物学建立了联系。1994\
  \ 年，约翰·纳什、约翰·海萨尼和莱因哈德·泽尔腾共同获得诺贝尔经济学奖，使博弈论受到了特别关注。\n\n约翰·纳什，2001 年奥斯卡获奖影片《美丽心灵》的主角，将博弈论转变为一种更通用的工具，使其能够分析双赢、双输以及输赢的情景。纳什使博弈论能够解决一个核心问题：我们应该竞争还是合作？\n\
  \n在本章中，我们将讨论从博弈论中衍生出的各种概念和思想。我们将探讨博弈论的一个分支，称为对抗性搜索，并描述极小化极大算法，该算法通常应用于确定性环境中、具有完美信息的两人零和博弈。\n\
  \n> **注**\n>\n> 1950 年，约翰·纳什证明了有限博弈总是存在一个均衡点，在该点上，所有玩家都选择在对手选择下对自己最有利的行动。纳什均衡，也称为策略均衡，是一个策略列表，每个玩家对应一个策略，其特性是任何玩家都不能单方面改变自己的策略并获得更好的收益。\n\
  \n## 什么是博弈论？\n\n博弈是一组结构化的任务，定义在娱乐性的环境和方式中，以吸引一个或多个玩家遵守逻辑规则，如果正确执行这些规则，游戏即告完成。\n\n\
  博弈论是关于如何分析博弈以及如何最优地进行博弈的数学理论；它也是一种将多种人类行为视为博弈一部分的观察方式。博弈论中可以分析的一些最流行的游戏包括黑白棋、二十一点、扑克、国际象棋、井字棋、双陆棋等等。实际上，博弈论分析的主题不仅仅是我们所熟知或认为的游戏。相反，还有许多其他情况可以被构建为博弈。每当理性的人必须在严格且已知的规则框架内做出决策，并且每个玩家根据其他玩家的决策获得收益时，我们就有了一个博弈。例子包括拍卖、谈判、军事战术等等。该理论由数学家在上世纪上半叶创立，但自那以后，博弈论的许多研究已在数学领域之外进行。\n\
  \n博弈论的关键方面围绕着识别过程参与者及其各种可量化的选项（选择），以及考虑他们的偏好和随后的反应。如果所有这些因素都经过仔细考虑，那么通过博弈论对问题进行建模——同时识别所有可能的情况——就会变得更容易。\n\
  \n科学文献中用来描述如何在博弈论中分析博弈的经典例子之一是**囚徒困境**。这个博弈的名称源于以下通常用于举例说明的情景。\n\n假设警方逮捕了两名他们知道一起犯下持械抢劫罪的人。不幸的是，他们缺乏足够的可采纳证据来让陪审团定罪。然而，他们确实有足够的证据以盗窃逃跑车辆的罪名将每名囚犯判刑两年。警察局长现在向每名囚犯提出以下条件：如果你承认抢劫，并牵连你的同伙，而他不认罪，那么你将获得自由，他将被判十年。如果你们都认罪，你们每人将被判五年。如果你们都不认罪，那么你们每人将因盗窃汽车被判两年。表\
  \ 16-1 说明了这个问题中的收益或利益矩阵。\n\n**表 16-1**\n\n**囚徒困境收益矩阵**\n\n|  | 囚犯 B，保持沉默 | 囚犯 B，背叛\
  \ |\n| --- | --- | --- |\n| 囚犯 A，保持沉默 | 2, 2 | 0, 10 |\n| 囚犯 A，背叛 | 10, 0 | 5, 5\
  \ |\n\n矩阵的单元格定义了每个玩家在每种行动组合下的收益。在每一对 (a, b) 中，玩家 A 的收益等于 a，玩家 B 的收益等于 b。\n\n*  \
  \ 如果两个玩家都保持沉默，那么他们每人获得收益 2。这出现在左上角的单元格中。\n*   如果两人都不保持沉默，他们每人获得收益 5；这出现在右下角的单元格中。\n\
  *   如果玩家 A 背叛而玩家 B 保持沉默，那么玩家 A 获得收益 10（获得自由），玩家 B 获得收益 0（十年监禁）；这出现在左下角的单元格中。\n*\
  \   如果玩家 B 背叛而玩家 A 保持沉默，那么玩家 B 获得收益 10，玩家 A 获得 0；这出现在右上角的单元格中。\n\n每个玩家通过比较自己在每一列中的个人收益来评估自己的两个可能行动，因为这显示了对于同伙的每个可能行动，哪个行动对自己更有利。因此，如果玩家\
  \ B 背叛，那么玩家 A 如果也背叛则获得收益 5，如果保持沉默则获得收益 0。如果玩家 B 保持沉默，那么玩家 A 如果也保持沉默则获得收益 2，如果背叛玩家\
  \ B 则获得收益 10。因此，无论玩家 B 做什么，玩家 A 背叛都会更好。另一方面，玩家 B 通过比较自己在每一行中的收益来评估自己的行动，并且他得出与玩家\
  \ A 完全相同的结论。当一个玩家的某个行动相对于对手的每个可能行动都更优时，我们说第一个行动严格支配第二个行动（回顾第 13 章中的术语，如帕累托集和帕累托最优性）。在囚徒困境中，认罪对两个玩家来说都严格支配了拒绝。双方都知道对方的这一点，完全消除了任何偏离严格支配路径的诱惑。因此，两个玩家都会背叛，并且两人都将入狱五年。\n\
  \n如今，已经创造出能够在国际象棋、跳棋和双陆棋等游戏中击败人类冠军的人工智能。最近（2016 年 3 月），谷歌 DeepMind 的 AlphaGo 程序，使用自学习算法（我们将在第\
  \ 17 章“强化学习”中探讨），成功击败了围棋世界冠军[李世石](https://en.wikipedia.org/wiki/Lee_Sedol#Lee%20Sedol)（图\
  \ 16-1）。\n\n\n\n## 对抗性搜索\n\n在本书中，我们将重点介绍博弈论的一个分支——对抗性搜索，它通常应用于棋盘游戏。在对抗性搜索中，我们研究当试图提前规划或展望一个存在其他智能体与我们对抗的世界时出现的问题。因此，在存在冲突目标和多个智能体的竞争环境中，对抗性搜索变得必不可少。\n\
  \n棋盘游戏分析是人工智能最古老的分支之一（Shannon, Turing, Wiener, and Shanon 1950）。这类游戏呈现出两个对手之间非常抽象和纯粹的竞争形式，并且明确需要一种“智能”。游戏的状态易于表示，玩家的可能动作也定义明确。尽管这是一个偶然性问题，但世界状态是完全可访问的，因为对手的特征无法预先知晓。棋盘游戏不仅因其偶然性而困难，还因为搜索树可能变得极其庞大。\n\
  \n![A449374_1_En_16_Fig1_HTML.jpg](img/A449374_1_En_16_Fig1_HTML.jpg)\n\n图 16-1\n\
  \n李世石 vs AlphaGo，2016 年 3 月\n\n我们需要达成共识的博弈论领域概念如下所示：\n\n*   **确定性游戏环境**：如果一个游戏不涉及任何随机过程（如掷骰子），则称其为确定性游戏；即玩家的行动会导致完全可预测的结果。诸如跳棋、国际象棋和黑白棋等游戏都是确定性的。\n\
  *   **随机性游戏环境**：如果一个游戏涉及某些随机过程（如掷骰子），则称其为随机性游戏。诸如西洋双陆棋和多米诺骨牌等游戏都是随机性的。\n*   **效用函数**：是从世界状态到实数的映射。这些数字被解释为智能体在给定状态下幸福程度的度量。\n\
  *   **常和博弈**：一个双人博弈是常和的，如果存在一个常数 c，使得对于每个策略 s ∈ A1 × A2，都有 u1(s) + u2(s) = c，其中\
  \ A1 是一个玩家的动作集合，A2 是另一个玩家的动作集合。\n*   **零和博弈**：c = 0 的常和博弈；即游戏结束时的效用值绝对值总是相等，符号相反。\n\
  *   **不完全信息博弈**：玩家不掌握关于其他玩家状态的全部信息的游戏。诸如扑克、拼字游戏和桥牌等游戏的信息是不完全的。\n*   **完全信息博弈**：其环境对所有玩家完全可观察的游戏；即每个玩家都了解其他玩家的状态。诸如黑白棋、跳棋和国际象棋等游戏都是完全信息的。\n\
  \n考虑到上述详细概念，我们可以创建表 16-2，该表按行和列标题详细说明了解决依赖于所定义条件的游戏所需的方法。\n\n表 16-2\n\n解决不同类型游戏的方法\n\
  \n|   | 零和 | 非零和 |\n| --- | --- | --- |\n| 完全信息 | 极小化极大算法，Alpha-Beta 剪枝 | 逆向归纳法，回溯分析\
  \ |\n| 不完全信息 | 概率极小化极大算法 | 纳什均衡 |\n\n在本书中，我们将重点讨论双人零和博弈——即一个玩家获得的价值，会以相同的数量被另一个玩家损失的游戏。因此，从下一节开始，我们将讨论应用于此类游戏的最相关算法。\n\
  \n注意\n\n美国特勤机构运行的一项名为“棱镜”的国际项目，使用基于博弈论的软件模型来确定恐怖活动、身份和可能地点的可预测性。\n\n## 极小化极大搜索算法\n\
  \n极小化极大搜索是一种应用于双人、零和、确定性、完全信息游戏的算法，用于确定玩家（MAX）在游戏给定阶段的最优策略，并假设另一个玩家（MIN）也会做出最优玩法。它应用于国际象棋、黑白棋、井字棋等游戏中。执行此算法时，我们遍历状态空间树，并根据其中一个玩家的损失或收益来表示每一步棋。因此，此方法只能用于在零和博弈中做出决策，其中一个玩家的损失就是另一个玩家的收益。理论上，此搜索算法基于冯·诺依曼的极小化极大定理，该定理指出，在这类游戏（零和、确定性、完全信息）中，总存在一组策略使得双方获得相同的价值，并且鉴于这是人们可以期望获得的最佳可能价值，因此应该采用这组策略。\n\
  \n注意\n\n一个极小化极大玩家（MAX）是一个进行最优玩法的玩家，它假设其对手（MIN）也在进行最优玩法，但方向相反；即一个最大化结果，另一个最小化结果。\n\
  \n因此，在极小化极大算法中，我们假设有两个玩家：即 MAX 和 MIN。搜索树以深度优先的方式生成，从当前游戏位置开始，一直延伸到游戏结束位置。当我们到达叶节点（代表游戏实际结束的节点）或达到最大深度（搜索将进行的最大深度）的节点时，就到达了游戏结束位置。由于大多数游戏拥有巨大的状态搜索空间，我们通常无法到达叶节点。因此，通常是在最大深度节点处，DFS\
  \ 停止并开始回溯。在回溯之前，该过程从游戏结束位置节点获取一个效用值。该值通过启发式方法获得，告诉我们从该点开始离获胜有多近。\n\n之后，效用值被回溯，并且根据父节点\
  \ N 是属于 MAX 玩家还是 MIN 玩家的树层级或深度，节点 N 的效用值从其子节点 c1, c2, … , cm 中获取，为 Max(c1, c2, …,\
  \ cm)（其中 Max() 是返回其参数最大值的函数）或 Min(c1, c2, …, cm)（其中 Min() 是返回其参数最小值的函数）。图 16-2 说明了该算法的运行过程。\n\
  \n![A449374_1_En_16_Fig2_HTML.jpg](img/A449374_1_En_16_Fig2_HTML.jpg)\n\n图 16-2\n\
  \n执行最大深度为 2 的极小化极大算法。该方法首先计算最大深度节点的值，然后根据节点是最大节点还是最小节点将这些值向上传递。以橙色标记的节点是被选中将其值在树中提升的节点。\n\
  \n该算法的伪代码如下：\n\n```\nMinimax(Node n): output Real-Value\n{\nif (IsLeaf(n)) then\
  \ return Evaluate(n);\nif (MaxDepth) then return Heuristics(n);\nif (n is a MAX\
  \ node) {\nv = NegativeInfinity\nforeach (child of n)\n{\nv' = Minimax (child)\n\
  if (v' > v) v= v'\n}\nreturn v\n}\nif (n is a MINnode)  {\nv = PositiveInfinity\n\
  foreach (child of n)\n{\nv' = Minimax (child)\nif (v' < v)  v= v'\n}\nreturn v\n\
  }\n}\n```\n\n注意在伪代码中，我们区分了两种评估游戏结束节点（叶节点或达到最大深度）的方法。如果到达叶节点，评估过程将根据根玩家是 MAX 还是 MIN\
  \ 输出 H 或 L。这些值对应于节点可能取值的范围 [L; H]。H 表示 MAX 获胜，L 表示 MIN 获胜；因为这是一个零和博弈，我们知道 L + H\
  \ = 0；即 L = -H。如果到达最大深度节点，则输出范围 [L; H] 内的一个值，指示从该点开始该路径有多好。\n\n注意\n\n每个单智能体问题都可以被视为双人博弈的一个特例，只需将环境视为其中一个玩家，并赋予其一个常数效用函数；例如，始终为\
  \ 0。\n\n\n\n## Alpha-Beta 剪枝\n\n极小化极大算法可能会探索生成树中的大量节点，而这些节点的路径最终会被算法舍弃，因为其他节点的值（更高或更低）会超越它们。让我们在图\
  \ 16-3 所示的极小化极大树中考虑这一场景。\n\n![A449374_1_En_16_Fig3_HTML.jpg](img/A449374_1_En_16_Fig3_HTML.jpg)\n\
  \n图 16-3\n\n剪除效用值为 1 的 MIN 节点的子节点\n\n在这棵极小化极大树中，有一个子树可以被剪枝。请记住：极小化极大算法通过深度优先搜索遍历树；因此，在某个时刻，它会回溯到绿色的\
  \ MIN 节点——我们将其称为 G。一旦到达 G，它已经发现并更新了 MIN 节点 2 和 3 的值。在更新 G 时，所有已发现且值已被更新的节点都标记为橙色。因为在更新\
  \ G 时，算法已经知晓其兄弟节点及其对应的效用值 2 和 3，并且考虑到它已知 G 是一个 MIN 节点，其值将始终低于已发现的值（1），那么根据简单的逻辑推理，根节点（MAX\
  \ 节点）的最终值必定是 3。因此，对 G 子节点的任何进一步探索都是徒劳的，这些分支可以在搜索中被剪除。\n\n为了确定哪些分支或子树可以被剪枝，极小化极大算法进行了轻微修改，增加了两个值：Alpha\
  \ 和 Beta。前者会持续更新在树的一层中找到的最高值，而后者会持续更新找到的最低值。以这些值为参考，我们就能决定是否应该剪除某个子树。该算法的伪代码如下所示：\n\
  \nMinimaxAlphaBetaPruning(节点 n, 实数 beta, 实数 alpha): 输出 实数\n\n```\n{\nif (IsLeaf(n))\
  \ then return Evaluate(n);\nif (MaxDepth) then return Heuristics(n);\nif (n 是 max\
  \ 节点) {\nv = beta\nforeach (n 的子节点) {\nv' = minimax (子节点, v, alpha)\nif (v' > v)\
  \ v = v'\nif (v > alpha) return alpha\n}\nreturn v\n}\nif (n 是 min 节点) {\nv = alpha\n\
  foreach (n 的子节点) {\nv' = minimax (子节点, beta, v)\nif (v' < v) v = v'\nif (v < beta)\
  \ return beta\n}\nreturn v\n}}\n```\n\nAlpha-Beta 剪枝如何影响我们的极小化极大搜索？这取决于子节点的访问顺序。如果子节点以最差的顺序被访问，那么可能永远不会进行任何剪枝。对于\
  \ MAX 节点，我们希望首先访问最佳子节点。对于 MIN 节点，我们希望首先访问最差子节点（从我们的角度来看，而非对手的角度）。\n\n当每次都能选择最佳子节点时，Alpha-Beta\
  \ 剪枝会导致树的每隔一层中的其余子节点被剪除；只有那个子节点会被探索。这意味着平均而言，树的搜索深度可以比以前增加一倍，这代表了搜索性能的显著提升。\n\n\
  ## 奥赛罗游戏\n\n奥赛罗（又名翻转棋、阳棋）是一款棋盘游戏，于 19 世纪末在伦敦创作，并于 1971 年由日本发明家长谷川五郎（图 16-4）修改，他将其注册为奥赛罗（取自莎士比亚的同名戏剧），并在过程中更改了几条规则。\n\
  \n![A449374_1_En_16_Fig4_HTML.jpg](img/A449374_1_En_16_Fig4_HTML.jpg)\n\n图 16-4\n\
  \n长谷川五郎，我们今天所知的奥赛罗的创造者\n\n奥赛罗在一个 8x8 的棋盘上进行（图 16-5），有两名玩家。一方控制白子，另一方控制黑子。棋子总数为 64\
  \ 枚，游戏结束后，棋盘上自己颜色棋子数量较多的玩家获胜。这是一款策略性的抽象游戏，与其他棋盘游戏（如围棋）类似。\n\n![A449374_1_En_16_Fig5_HTML.jpg](img/A449374_1_En_16_Fig5_HTML.jpg)\n\
  \n图 16-5\n\n奥赛罗棋盘\n\n棋盘的初始配置如图 16-6 所示。\n\n![A449374_1_En_16_Fig6_HTML.jpg](img/A449374_1_En_16_Fig6_HTML.jpg)\n\
  \n图 16-6\n\n奥赛罗棋盘的初始配置以及我们将在本章中开发的 Windows 窗体应用程序的图形用户界面\n\n控制黑子的玩家先手，走出第一步。该玩家的可行走法在图\
  \ 16-6 中用棋盘上的黄色方块表示。奥赛罗中的一步棋包括将一枚棋子放在棋盘上某个格子中，使其在水平、垂直或对角线方向上夹住对手的棋子。在图 16-7 中，我们可以看到棋盘上棋子的一种假想布局。\n\
  \n![A449374_1_En_16_Fig7_HTML.jpg](img/A449374_1_En_16_Fig7_HTML.jpg)\n\n图 16-7\n\
  \n假想的奥赛罗棋盘布局\n\n假设轮到白方走棋，一种可能的走法是将一枚棋子放在第 6 行、第 2 列（行列编号从 0 开始，从上到下），如图 16-8 所示（根据奥赛罗的走棋规则）。\n\
  \n![A449374_1_En_16_Fig8_HTML.jpg](img/A449374_1_En_16_Fig8_HTML.jpg)\n\n图 16-8\n\
  \n在 (6, 2) 放置一枚白子后的棋盘结果\n\n在 (6, 2) 放置一枚白子后，所有黑子将在所有方向（水平、垂直、对角线）上被夹住；因此，这些棋子被翻转，变成白子。\n\
  \n如果一名玩家无法移动其任何棋子（无法夹住对手的任何棋子），则其回合权交给另一名玩家。如果两名玩家都没有可行的走法，则游戏结束，棋盘上棋子数量最多的玩家获胜；当所有\
  \ 64 枚棋子都放在棋盘上时也是如此。这显然是一个确定性的、完美信息的、零和游戏。因此，可以在极小化极大搜索下开发一个人工智能。\n\n应用于此游戏的启发式方法旨在提高搜索（极小化极大）的性能；其中一些启发式方法如下：\n\
  \n\n\n*   **棋子差**：在黑白棋中，分析和构建启发式函数的一个基本特征是棋子差，即黑白棋子数量之差。最终得到的值是棋盘上黑子（B）或白子（W）所占的百分比，但当\
  \ W = B 时除外。其计算方式如下：\n    *   (B > W)：100 * B / (W + B)\n    *   (B < W)：100 * W\
  \ / (W + B)\n    *   (B = W)：0\n*   **角落占据**：角落是黑白棋游戏中的关键位置；控制角落的玩家在很大程度上控制了比赛。角落占据衡量的是每个玩家占据了多少个角落。要计算角落占据得分，我们统计角落中黑子的数量\
  \ B 和白子的数量 W。然后，角落占据得分计算公式为：\n    *   25B − 25W\n*   **角落邻近**：如果角落为空，则与角落相邻的格子可能非常危险；它们可能为对手创造占据角落的机会。因此，角落邻近衡量的是那些与空角落相邻的“危险”棋子。要计算角落邻近得分，我们统计与角落相邻的黑子数量和与角落相邻的白子数量。最终得分计算公式为：\n\
  \    *   -12.5B + 12.5W\n*   **机动性**：黑白棋中最糟糕的情况之一是玩家无棋可下而被迫跳过回合；因此，这个启发式函数衡量的是玩家有多少步可走。与棋子差启发式函数类似，它也是以百分比形式计算的，具体如下：\n\
  \    *   (B > W)：100 * B / (W + B)\n    *   (B < W)：100 * W / (W + B)\n    *   (B\
  \ = W, W = 0, B = 0)：0\n\n还有其他启发式函数，但我们只采用本书中刚刚描述的几个。请注意，所有这些函数输出的值都在 [-100; 100]\
  \ 范围内。这是我们为黑白棋实现所设定的值范围，因此，一个叶子节点（假设我们能在某个时刻到达它）如果 B > W，将获得 100 的奖励值；如果 W > B，将获得\
  \ -100 的奖励值；平局则返回 0。\n\n为了组合上述启发式函数，我们可以制定一个加权和，其权重在 [0, 1] 范围内，仿佛它们代表了每个启发式函数所获得的优先级百分比。一个节点的最终效用值将是：\n\
  \n![ $$ \\mathrm{UtilityValue}=\\frac{1}{\\mathrm{n}}\\sum \\limits_{\\mathrm{i}=1}^{\\\
  mathrm{n}}\\kern0.38em {\\mathrm{h}}_{\\mathrm{i}}\\ast {\\mathrm{w}}_{\\mathrm{i}}\
  \ $$ ](img/A449374_1_En_16_Chapter_Equa.gif)\n\n其中 n 是组合的启发式函数数量，w[i] 是与第 i 个启发式函数相关的权重，h[i]\
  \ 是第 i 个启发式函数的值。请注意，通过上述公式，我们保证节点的效用值始终在 [-100, 100] 范围内。在下一节中，我们将开始在 Windows Forms\
  \ 中编写黑白棋游戏代码，以及代表其 AI 组件的 Minimax 算法。\n\n## 实践问题：在 Windows Forms 中实现黑白棋游戏\n\n在本节中，我们将在\
