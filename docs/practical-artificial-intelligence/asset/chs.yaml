  《实用人工智能》（PAI）是一本提出全新学习模式的书籍。大多数人工智能书籍深度聚焦于理论，而忽略了贯穿全书用于演示理论的实践问题。在 PAI 中，我们提出了一种遵循本杰明·富兰克林（美利坚合众国开国元勋）理念的模式：“告诉我，我会忘记；教给我，我可能记住；让我参与，我才能学会。”因此，PAI
  包含理论知识，但保证每章至少包含一个完全编码（C#）的实践问题，以便读者更好地理解，并让他们参与到本章介绍的理论概念和思想中。读者可以使用本书附带的代码执行这些实践问题，从而更深入地理解本书所述的概念。


  PAI 中包含的解释和定义力求尽可能简单（同时不忽视其属于数学、科学环境的事实），以便不同背景的读者都能接触并理解内容，只需具备最基础的数学或编程知识。


  第 1 章和第 2 章探讨逻辑学，将其作为数学或计算机科学等许多科学的基础基石。在这些章节中，我们将描述命题逻辑、一阶逻辑和自动定理证明；并将介绍用 C# 编码的相关实践问题。


  在第 3 章至第 7 章中，我们将重点介绍智能体与多智能体系统。我们将深入探讨不同类型的智能体及其架构，然后提出一个大型实践问题：我们将编写一个火星车的代码，其任务是在火星上寻找水。我们还将包含另一个实践问题，其中我们设置一组智能体使用
  Windows Communication Foundation (WCF) 进行通信。最后，我们将通过介绍另一个实践问题（第 7 章）来结束本书的这一部分，在该问题中，一组智能体组成一个多智能体系统，将协作通信以清理房间的污垢。


  第 8 章将描述人工智能的一个子领域，即模拟，通过使用统计、概率工具来模拟现实生活中的场景。在本例中，我们将模拟一个机场的运作，包括飞机在特定时间段内抵达和离开机场的情况。


  第 9 章至第 12 章将专门讨论监督学习，这是机器学习中一个非常重要的范式。其基本思想是通过向机器（程序）展示大量 `<数据, 分类>` 对样本，来教会它做某事（通常是分类数据），其中
  `数据` 可以是任何东西，例如动物、房屋、人等。例如，样本集可以是 `<大象, 大型>`、`<猫, 小型>` 等等。显然，为了让机器能够理解和处理任何数据，我们必须输入数值而非文本。在这些章节中，我们将探讨支持向量机、决策树、神经网络以及手写数字识别。


  第 13 章将解释机器学习的另一个非常重要的范式，即无监督学习。在无监督学习中，我们学习输入数据的结构，并且没有像监督学习中那样的标签（分类）；换句话说，样本仅仅是
  `<数据>`，不包含分类。因此，无监督学习程序无需任何外部帮助，仅通过观察数据本身提供的信息来学习。在本章中，我们将描述聚类，这是一种经典的无监督学习技术。我们还将描述多目标聚类和多目标优化。本章将包含一种由作者提出的构建帕累托前沿的方法，即帕累托前沿构建器。


  第 14 章将重点介绍启发式算法和元启发式算法，这是我们在前面章节中会提及，并最终在此处深入研究的主题。我们将主要描述两种元启发式算法：遗传算法和禁忌搜索，它们是元启发式算法两大主要类别的代表，即基于种群的元启发式算法和基于单一解的元启发式算法。




  第 15 章将探索游戏编程的世界，特别是那些需要执行搜索的游戏。我们将详细介绍并实现许多流行的搜索算法。此外，还会包含一个实际问题：设计并编写一个滑动拼图智能体的代码。


  第 16 章将深入探讨博弈论，特别是其中被称为对抗性搜索的子领域。在这一领域中，我们将研究极小化极大算法，并实现一个使用该策略（极小化极大）进行对弈的奥赛罗智能体。


  第 17 章将描述一种如今被视为人工智能未来的机器学习范式；这种范式就是**强化学习**。在强化学习中，智能体通过奖励和惩罚进行学习；它们像人类一样随着时间的推移而学习，当学习过程足够长时，它们可以在游戏中达到极具竞争力的水平，甚至能够击败人类世界冠军（正如在西洋双陆棋和围棋中所发生的那样）。


