  \ / total);\nCentroid.Features = new List(result);\n}\npublic double AverageLinkageClustering(Cluster\
  \ c)\n{\nvar result = 0.0;\nforeach (var c1 in c.Objects)\nresult += Objects.Sum(c2\
  \ =>Distance.Euclidean(c1.Features, c2.Features));\nreturn result / (Total + c.Total);\n\
