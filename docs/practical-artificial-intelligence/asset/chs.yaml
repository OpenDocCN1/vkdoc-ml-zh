  在代码清单 8-8 中，我们可以看到 `RunwayAvailable()` 和 `TryToLand()` 方法。第一个方法非常简单，它让我们知道是否有可用的跑道，如果有，则返回其索引。后一个方法尝试为飞机授予降落许可，首先检查是否有可用的跑道。假设有，则更新相应的列表和属性，并设置飞机在机场消耗的时间；即其起飞时间。如果没有可用的跑道，则飞机将排队等待最终降落。


