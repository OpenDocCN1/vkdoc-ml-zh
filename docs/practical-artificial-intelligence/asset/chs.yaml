  ## 实际问题：将逻辑公式表示为二叉决策树


  二叉决策树（BDT）是一种带标签的二叉树，满足以下条件：


  *   叶节点标签为 0（假）或 1（真）。

  *   非叶节点标签为正整数。

  *   每个标签为 i 的非叶节点都有两个子节点，且子节点标签均为 i + 1。

  *   通向左侧子节点的分支取低值（0），通向右侧子节点的分支取高值（1）。


  注意


  二叉决策树只是表示或书写公式真值表的另一种方式。


  在图 1-7 中，我们可以看到一棵二叉决策树，其中叶节点用正方形表示，非叶节点用圆形表示。


  ![A449374_1_En_1_Fig7_HTML.jpg](img/A449374_1_En_1_Fig7_HTML.jpg)


  图 1-7


  p ∨`¬`q 的二叉决策树


  在二叉决策树中，树的每一层对应一个变量，其两个分支对应变量的可能取值（1, 0）。从根节点到叶节点的路径表示公式中所有变量的一种赋值。叶节点处的值表示公式的一种解释，即从根节点开始赋值的结果。


  现在我们已经学习了与命题逻辑相关的一些主题，是时候创建我们的第一个 AI 数据结构了。正如我们将看到的，通过使用上一个实际问题中介绍的 `Formula` 类，我们只需几行代码就能创建二叉决策树。该类将包含三个用于不同用途的构造函数，如代码清单
  1-6 所示。


  ```

  public class BinaryDecisionTree

  {

  private BinaryDecisionTreeLeftChild { get; set; }

  private BinaryDecisionTreeRightChild { get; set; }

  private int Value { get; set; }

  public BinaryDecisionTree()

  { }

  public BinaryDecisionTree(int value)

  {

  Value = value;

  }

  public BinaryDecisionTree(int value, BinaryDecisionTreelft, BinaryDecisionTreergt)

  {

  Value = value;

  LeftChild = lft;

  RightChild = rgt;

  }

  ...

  }

  代码清单 1-6

  BinaryDecisionTree 类的构造函数与属性

  ```


  二叉决策树是一种递归结构；因此，其模板或类将包含两个属性 `LeftChild` 和 `RightChild`，它们的类型均为 `BinaryDecisionTree`。`Value`
  属性是一个整数，用于标识变量，其顺序由 `Formula` 类中的 `Variables()` 方法提供；该顺序等同于树的高度；即，在第一层，根节点的值为 0，然后在高度为
  1 的层，每个节点（均代表同一变量）的值均为 1，依此类推。


  注意


  在二叉决策树中，每一层代表公式中的一个变量。离开节点（变量）的左侧分支对应变量取值为 0（假）的决策，右侧分支则表示变量取值为 1（真）的决策。


  代码清单 1-7 中所示的静态方法将负责构建二叉决策树。


  ```

  public static BinaryDecisionTreeFromFormula(Formula f)

  {

  return TreeBuilder(f, f.Variables(), 0, "");

  }

  private static BinaryDecisionTreeTreeBuilder(Formula f, IEnumerable variables, intvarIndex,
  string path)

  {

  if (!string.IsNullOrEmpty(path))

  variables.ElementAt(varIndex - 1).Value = path[path.Length - 1] != ''0'';

  if (varIndex == variables.Count())

  return new BinaryDecisionTree(f.Evaluate() ? 1 : 0);

  return new BinaryDecisionTree(varIndex, TreeBuilder(f, variables, varIndex + 1,
  path + "0"),

  TreeBuilder(f, variables, varIndex + 1, path + "1"));

  }

  代码清单 1-7

  从公式构建二叉决策树的方法


  公共方法 `FromFormula` 使用一个辅助私有方法，该方法依赖递归来创建树。


  `varIndex` 变量定义了树的高度，或者等价地，定义了代表该树层级的变量的索引。


  `Path` 以二进制字符串的形式存储每个变量的求值结果；例如，“010”表示一条路径，其中根变量 r 求值为假，然后其左子节点 lft 求值为真，最后 lft
  的右子节点求值为假。一旦我们到达与公式变量数量相等的深度，我们就使用与已构建路径匹配的赋值来对公式进行求值，并将最终结果保存在叶节点中。


  通过遍历决策树，我们可以获得公式在为其变量预定义的一组值（从根节点到叶节点的路径）下的输出。这一特性在决策过程中非常有用，因为树结构非常直观，易于解释和理解。决策树将在第
  4 章中深入介绍；目前我们应知道它们提供了若干优势或好处。其中值得一提的是，它们能在一张视图中创建所有可能输出及后续决策的可视化表示。由原始选择产生的每个后续决策也会在树上描绘出来，这样我们就能看到任何一个决策的整体效果。当我们遍历树并做出选择时，我们会看到从一个节点到另一个节点的特定路径，以及当前做出的决策可能对未来产生的影响。


  如前所述，我们将在下一节中描述与范式相关的各种实际问题。我们将学习如何将常规状态的公式转化为否定范式（NNF），再进一步转化为合取范式（CNF）。这种转化在处理公式时，尤其是在开发像
  DPLL 这样的逻辑相关算法时，会非常有用。




  ## 实际问题：将公式转化为否定范式（NNF）


  在本问题中，我们将最终研究一种将任意公式转化为否定范式的算法。请记住，范式之所以有用，是因为：


  *   它们减少了逻辑运算符（如蕴含等）；

  *   它们简化了句法结构（子公式的嵌套）；

  *   可以利用它们来寻求高效的数据结构。


  NNF 转换算法由以下递归思想确定；假设 F 是输入公式，以下是伪代码。


  函数 NNF(F)：


  *   如果 F 是变量或否定变量，则返回 F

  *   如果 F 是 `¬`(`¬`p)，则返回 NNF(p)

  *   如果 F 是 p ∧ q，则返回 NNF(p) ∧ NNF(q)

  *   如果 F 是 p ∨ q，则返回 NNF(p) ∨ NNF(q)

  *   如果 F 是 ¬(p ∨ q)，则返回 NNF(¬p) ∧ NNF(¬q)

  *   如果 F 是 ¬(p ∧ q)，则返回 NNF(¬p) ∨ NNF(¬q)


  我们将假设所有公式都不含蕴含，并利用 `Formula` 层次结构来实现所描述的伪代码。


  注意


  公式 ¬p ∧ q、p ∨ q、(p ∧ (¬q ∨ r)) 都处于否定范式。而公式 ¬(q ∨¬r)、¬(p ∧ q) 则不属于否定范式，因为这些公式中的某些部分包含了被否定的
  Or、And 公式。要处于 NNF，只有变量才能被否定。


  我们将从修改 `Formula` 抽象类开始，如清单 1-8 所示。


  ```

  public abstract class Formula

  {

  public abstract bool Evaluate();

  public abstract IEnumerable Variables();

  public abstract Formula ToNnf();

  }

