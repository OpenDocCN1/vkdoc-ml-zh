  清洁代理标记每个已访问的单元格，从而更快地移动到最后一个单元格并完成任务。另一方面，清洁机器人不保存环境状态，因此没有任何内部结构来帮助它决定哪个移动是正确的，基本上可以随机上下移动多次，甚至原地打转。清洁代理拥有包含环境信息的数据结构，以帮助其应用逻辑并做出理性决策，而清洁机器人则没有。根据代码清单
  3-8 所示代码的结果，随机机器人无法清理最后一个单元格上的污垢，而代理则能在给定时间内完成（图 3-5）。


