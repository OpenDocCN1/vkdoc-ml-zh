  BDI（信念-愿望-意图）和混合架构。




  ### 慎思架构：BDI 架构


  在纯粹的慎思架构中，智能体遵循基于目标的行为，能够进行推理和提前规划。慎思架构通常通过逻辑、图论、离散数学等方式，融入某种对世界的符号化表征，而决策（例如，关于执行何种行动）通常通过模式匹配和符号操作进行逻辑推理来做出。熟悉逻辑或函数式编程语言（如
  Prolog、Haskell 或 FSharp）的读者可能更容易理解符号的含义。慎思架构通常面临两个需要解决的问题：


  1.  将现实世界转化为一个恰当、准确的符号化版本，该版本对于智能体的目的而言是高效且有用的。这个问题通常非常耗时，尤其是在环境过于动态且不断变化的情况下。

  2.  符号化地表示关于现实世界实体、关系、过程等信息，以及如何利用这些信息进行推理和决策。


  问题 1 推动了人脸识别、语音识别、学习等领域的研究，而问题 2 则启发了知识表示、自动调度、自动推理、自动规划等方面的工作。尽管这些问题产生了大量的科学成果，但大多数研究者都承认，它们远未得到解决。即使是看似简单的问题，例如基本推理，也被证明异常困难。根本问题似乎在于，即使在非常简单的逻辑中进行定理证明也很困难，并且符号操作本身就很复杂；回想一下，一阶逻辑（FOL）甚至是不可判定的，而附加在其上的模态扩展（包括信念、愿望、时间等的表示）往往高度不可判定。


  注意


  术语“可判定”或“可判定性”与判定问题相关；即，可以定义为对输入值的问题输出“是”（1）或“否”（0）的问题。可满足性问题（SAT）是判定问题的一个特例。因此，我们说一个理论（公式集）是可判定的，如果存在一种方法或算法，可以判定一个给定的随机选择的公式是否属于该理论。


  通用的慎思架构如图 3-8 所示。


  ![A449374_1_En_3_Fig8_HTML.jpg](img/A449374_1_En_3_Fig8_HTML.jpg)


  图 3-8


  慎思架构


  多种慎思架构，如 BDI（稍后详述），其根源在于理解实践推理的哲学传统，即当寻求实现目标时，逐刻决定执行哪个行动的过程。人类的实践推理包含两个活动：


  1.  决定我们想要达到什么样的状态（慎思）。

  2.  决定如何达到这些状态（手段-目的推理或规划）。


  从前述活动中我们可以得出结论：慎思输出意图，手段-目的推理输出计划。


  注意


  实践推理与理论推理之间存在区别。前者指向行动，而后者指向信念。


  手段-目的推理是利用可用手段决定如何达成目的的过程；在人工智能领域，这被称为规划。智能体要生成一个计划，通常需要有一个待达成的表征或目标意图、一个其可执行行动的表征，以及一个其环境的表征（图
  3-9）。


  ![A449374_1_En_3_Fig9_HTML.jpg](img/A449374_1_En_3_Fig9_HTML.jpg)


  图 3-9


  智能体规划组件的输入与输出流


  慎思是如何发生的？在慎思过程中，第一步称为备选方案生成，智能体生成一组备选方案（目标、愿望）以供考虑。在第二步称为过滤中，智能体在可用选项中进行选择，并承诺执行其中一些。这些被选中的选项或备选方案就是它的意图。


  慎思架构中的关键问题是：“智能体如何对其（可能相互冲突的）目标进行慎思，以决定它将追求哪些目标？”这个问题的答案由每个慎思架构特有的目标-慎思策略提供；其中最流行的是由迈克尔·E·布拉特曼在其著作《意图、计划与实践理性》（1987）中创建的
  BDI 架构。


  注意


  考虑到它们与时间的交互，反应式架构存在于当下（持续时间短），而慎思架构则对过去进行推理，并面向未来进行规划（计划等）。


  信念、愿望与意图（BDI）架构包含对智能体信念、愿望和意图的显式表示。信念（它认为什么）通常被视为智能体对其环境所拥有的信息；我们可以说知识而非信念，但我们更倾向于使用更通用的术语“信念”，因为智能体所相信的有时可能是错误的。愿望（它想要什么）是智能体希望看到实现的事情，我们并不期望智能体对其所有愿望都采取行动。意图（它正在做什么）是智能体承诺要做的事情，它们基本上是过滤愿望的结果；BDI
  架构如图 3-10 所示。


  ![A449374_1_En_3_Fig10_HTML.jpg](img/A449374_1_En_3_Fig10_HTML.jpg)


  图 3-10


  BDI 架构


  信念通常由输出真值或假值的谓词（例如，`IsDirty(x,y)`）来描述，并代表智能体对世界拥有的内部知识。


  当愿望存在于信念库中（或被智能体手动移除）时，它们即被视为已实现。与信念库一样，愿望库在智能体执行过程中会不断更新。当一个愿望被创建为中间目标时，愿望之间可以通过层级链接（子/超愿望）相关联（例如，要清理地面上的污垢，可以有两个子愿望或子目标：移动到每个脏污单元格并清理它）。愿望具有一个可以动态变化的优先级值，该值用于在必要时从一组愿望中选择一个新的意图。


  一旦智能体考虑了所有选项，它必须承诺执行其中一些。在此例中，作为示例，它将只承诺执行一个，即其唯一可用的选项，该选项随后成为其意图。意图最终会导向行动，智能体应通过尝试实现其意图来行动。智能体应做出合理尝试以实现其意图，并可能为此遵循一系列行动（计划）。


  智能体选择的意图将从那一刻起约束其实践推理；一旦对某个意图做出承诺，智能体将不再考虑与已启动的意图相冲突的其他意图。意图可以被搁置（例如，当它们需要先实现一个子愿望时）。因此，存在一个意图栈；栈顶的意图是当前意图，也是唯一未被搁置的意图。




  意图应当持之以恒；换言之，我们必须投入所有可用资源去实现它们，而不能因为短期内未能达成便立即放弃，否则我们将始终一事无成。另一方面，意图也不能持续太久，因为可能存在合乎逻辑的理由需要放弃它们。例如，清洁代理可能在某时刻无事可做（清洁），或许是因为它处于多代理环境中，而其他代理已经完成了清洁任务。


  意图在实践推理中扮演着一系列重要角色：


  *   **意图驱动规划**：一旦代理决定实现某个意图，它就必须规划一系列行动来完成该意图。

  *   **意图约束后续思考**：一旦代理承诺于某个意图，它就不会再考虑与该选定意图相冲突的其他意图。

  *   **意图具有持续性**：代理不会无缘无故放弃其意图；通常会持续下去，直到它认为意图已成功实现、无法实现，或意图的目的已不复存在。

  *   **意图影响对未来的信念**：一旦代理采纳了某些意图，就有必要且合乎逻辑地基于这些意图将被实现的假设，对未来进行规划。


  代理需要时常停下来重新审视其意图，因为有些意图可能已变得不合理或无法实现。这一重新审视阶段会带来空间和时间上的成本，同时也给我们提出了一个问题：


  *   **鲁莽的代理**：如果代理不经常停下来重新审视其意图，可能会试图实现一个已不再可能的意图。

  *   **谨慎的代理**：如果代理过于频繁地停下来重新审视其意图，可能会在重新审视阶段消耗过多资源，而在实现意图上投入不足。


  在代理的事件驱动行为与目标导向行为之间取得平衡或折衷，是解决这一困境的方法。


  **注意**


  实验表明，在变化不频繁的环境中，鲁莽的代理比谨慎的代理表现更好。而在另一种场景（环境频繁变化）中，谨慎的代理则优于鲁莽的代理。


  BDI 代理中的实践推理过程依赖于以下组件。在后续要点中，假设 B 为信念集合，D 为愿望集合，I 为意图集合：


  *   一组当前信念，代表代理对其环境所掌握的信息

  *   一个信念修正函数（brf），接收感知输入和代理的信念，并确定新的信念集：brf: P x B -> B

  *   一个选项生成函数（options），接收关于环境的信念和意图（如有）作为输入，并确定代理的选项（愿望）：options: B x I -> D

  *   一组当前选项，代表代理可能采取的行动方案

  *   一个过滤函数（filter），代表代理的思考过程，使用信念、愿望和意图作为输入，以确定代理的意图：filter: B x D x I -> I

  *   一组当前意图，代表代理的承诺

  *   一个动作选择函数，使用当前意图作为输入，以确定要执行的动作


  毫不意外，BDI 代理在任何时刻的状态都是一个三元组 (B, D, I)。在不深入细节的情况下，BDI 代理的动作函数看起来相当简单；其伪代码如下所示：


  ```

  function AgentAction(P):

  B = brf(P, B)

  D = options(D, I)

  I = filter(B, D, I)

  end

  ```


  在下一章中，我们将介绍一个实际问题，为火星车开发一个基于 BDI 架构的人工智能；这个问题将帮助我们巩固本节介绍的许多概念。


  ### 混合架构


  许多研究者认为，在设计代理时，纯粹基于推理的代理或纯粹基于反应的代理都不是好策略。混合架构中，代理同时具备基于目标的组件（能够进行推理和提前规划）和反应式组件（能够对环境情况立即做出反应），这种架构通常比纯粹的推理型或反应型代理更受青睐。


  通常，混合架构代理由以下子系统或组件构成：


  *   **推理组件**：包含世界表征，该表征在某种程度上可以是符号化的；它像推理架构一样构建计划并做出决策。

  *   **反应组件**：能够无需复杂推理即可对特定情况做出反应（情况 -> 后果规则）。


  因此，混合代理兼具反应性和主动性，并且反应组件通常比推理组件具有更高的优先级。


  反应组件与推理组件共存所形成的分层且略带层级结构，自然引出了分层架构的概念，这代表了混合代理的设计思路。在这种架构中，代理的控制组件按层级排列，较高层级处理较抽象的信息。


  通常，分层架构中至少会有两层：一层处理反应行为，一层处理主动行为。实际上，没有理由不能有更多层。一般来说，我们可以将分层架构分为两种类型：


  *   **水平分层**：在水平分层架构中，代理的每一层都直接连接到感知输入和动作输出。因此，每一层都像一个代理，对要执行的动作提出建议。

  *   **垂直分层**：在垂直分层架构中，感知输入和动作输出都通过每一层进行处理，方向可以是一个或多个。


  水平分层和垂直分层如图 3-11 所示。


  ![A449374_1_En_3_Fig11_HTML.jpg](img/A449374_1_En_3_Fig11_HTML.jpg)


  图 3-11


  水平分层架构（左侧）和垂直分层架构（右侧）。注意，在垂直分层架构中，信息可能不止一次地通过每一层。


  水平分层架构在概念设计上非常简单；具有 n 种行为的代理需要 n 层，每层对应一种行为。尽管有这一优点，但每一层实际上都在相互竞争以提出动作建议，这可能导致代理表现出不一致的行为。为了提供一致性，通常需要一个中介函数来充当“中间人”，决定在任何给定时刻由哪一层控制代理。


  中介函数涉及高度复杂性，因为必须考虑所有层之间的所有可能交互，才能最终输出一个动作。从设计者的角度来看，创建这样的控制机制极其困难。




  在垂直分层架构中，这些问题会减少，因为层与层之间存在顺序，且最后一层负责输出待执行的动作。垂直分层架构通常分为两种类型：单程架构和双程架构。在前者中，智能体的决策过程依次流经每一层，直到最后一层生成动作。在双程架构中，信息先向上流经架构（第一程），然后再向下回流。双程垂直分层架构的原理与组织及企业的工作方式存在显著相似之处，即信息向上流至最高层，然后指令向下传达。在单程和双程垂直分层架构中，层间交互的复杂性都降低了。由于
  n 层之间有 n-1 条边，如果每层能够建议 m 个动作，那么层间最多需要考虑 m²(n − 1) 次交互。显然，这比水平分层架构迫使我们面对的交互级别要简单得多。这种简单性是有代价的，这个代价就是灵活性。为了让垂直分层架构做出决策，控制权必须在每个不同层之间传递。垂直分层架构并非完美无缺，任何一层的故障都可能对智能体的性能造成严重后果。在下一节中，我们将研究水平分层架构的一个特例：旅行机器。


  ### 旅行机器


  旅行机器代表由三层（建模层、规划层和反应层）组成的水平分层架构。图 3-12 展示了一台旅行机器。


  ![A449374_1_En_3_Fig12_HTML.jpg](img/A449374_1_En_3_Fig12_HTML.jpg)


  图 3-12


  旅行机器


  反应层以一组情境-动作规则的形式，对环境中检测到的变化提供即时响应，这些规则类似于包容架构中的规则。在接下来的伪代码中，我们展示了一个自主车辆智能体的反应规则。此示例展示了车辆的避障规则：


  ```

  rule-1: obstacle-avoidance

  if (in_front(vehicle, observer)

  andspeed(observer) > 0

  andseparation(vehicle, observer) <vehicleThreshHold)

  then

  change_orientation(vehicleAvoidanceAngle)

  ```


  规划层负责智能体的主动行为；换句话说，它负责智能体长期将要执行的操作。为了进行规划，该层维护着一个计划库；这些计划本质上是分层结构化的计划，旅行机器在运行时对其进行详细阐述以决定做什么。因此，为了实现一个目标，规划层会尝试在计划库中找到一个与智能体所寻求目标相匹配的计划。


  注意


  旅行机器最早的基准测试场景之一是自动驾驶车辆。


  顾名思义，建模层代表了世界及其各种实体（包括智能体）的模型。它预测智能体之间的冲突，并生成新目标以解决这些冲突。新生成的目标随后被向下传递到规划层，规划层利用其计划库来确定一个或一组满足这些目标的计划。


  所有三层都与一个控制子系统相关联，该子系统决定哪一层拥有对智能体的控制权。该子系统由一组控制规则组成，这些规则可以限制层间的信息，或者作用于层的输出，如下一个展示控制规则的伪代码所示：


  ```

  censorRule_1:

  if (entity(bigObstacle) in perceptions)

  then

  removeSensoryRecord(layerReact, entity(bigObstacle))

  ```


  这条控制规则阻止反应层知晓已检测到一个大障碍物。在大多数场景下，反应层是处理避障最合适的层，但在不同场景下，将此感知信息传递给其他层可能更好。在这种情况下，由于传感器检测到了一个可能从远处就能看到的大障碍物，规划层可能需要找到一个考虑大障碍物并改变智能体路线的计划。


  ### InteRRaP


  InteRRaP（理性反应行为与规划的集成）是一种垂直分层双程架构，由三层（协作层、规划层和行为层）组成，类似于旅行机器中的层次。图 3-13 展示了一个 InteRRaP
  架构。


  ![A449374_1_En_3_Fig13_HTML.jpg](img/A449374_1_En_3_Fig13_HTML.jpg)


  图 3-13


  InteRRaP 架构


  行为层（最底层）处理反应行为；规划层（中间层）处理常规规划以实现智能体的目标；协作层（最顶层）处理多智能体环境中的社交互动。每一层都关联着一个知识库；每个知识库都以便于其对应层使用的方式表示世界。


  最顶层的知识库表示环境中其他智能体的计划和动作集合；中间层的知识库表示智能体自身的计划和动作；最底层的知识库表示关于环境的原始信息。


  注意


  知识库是 InteRRaP 与旅行机器的区别所在。


  InteRRaP 与旅行机器的主要区别在于它们与环境交互的方式。在旅行机器中，每一层都连接到感知输入和动作输出，因此需要一个控制子系统来处理层间的冲突。在 InteRRaP
  中，各层在寻求实现共同目标时相互交互。


  InteRRaP 中层间交互存在两种主要类型：自底向上激活和自顶向下执行。前者发生在较低层无法处理当前情境，被迫将控制权传递给较高层时。后者发生在较高层利用较低层提供的设施来实现其目标时。典型的流程将从底层开始，当反应层接收到感知输入时；如果该层能够处理接收到的感知输入，它将自行处理；否则，它将控制权传递给规划层。如果规划层能够处理该情境，它可能会利用自顶向下执行；否则，它会继续将控制权向上传递给下一层。通过这种方式，控制权从最低层流向更高层（如有必要），然后再向下回流。


  ## 总结


  在本章中，我们介绍了智能体的概念，审视了其一些最相关的属性，并研究了一个实际问题，在该问题中，我们将第 2 章的清洁机器人转变为一个遵循智能体动作函数模型的清洁智能体，该函数接收一组感知并输出一个动作。我们还为该智能体添加了状态，并将其与执行随机动作的无状态智能体进行了比较。最后，我们介绍了各种智能体架构：反应式、慎思式和混合式。


  在下一章中，我们将研究一个非常有趣的问题（火星车），它将向我们展示智能体架构如何在现实场景中实现。




  '
- '# 4. 火星车


  延续上一章开启的路线（智能体），我们将把第 4 章用于介绍一款基于混合架构的火星车 AI，该架构包含一个用于即时决策的反应层，并采用 BDI（信念、愿望、意图）范式来实现其慎思层。这个实际问题将帮助我们巩固在第
  3 章中学到的所有知识（智能体属性、智能体状态、架构等），并帮助我们理解如何将所有这些整合到一个现实世界的问题中。


  太空探索是一个引人入胜的话题，它与人工智能领域结合得很好，并在全球拥有数百万追随者。由于太空条件对人类来说相当困难和危险，因此使用机器人是常见且必要的。因此，将人工智能用于参与太空探索的机器这一想法是合乎逻辑的，并且近年来对此进行了许多研究。


  本章涉及的实际问题将包括一个可视化应用程序（Windows Forms），该程序在 n x m（行 x 列）的离散环境中实时展示火星车的执行过程。该应用程序模拟了火星环境，其中有各种被智能体视为障碍物的岩石，以及隐藏的水源或水迹。该程序还将向我们展示其规划（构成计划的行动序列将以黄色标示）以及它如何管理信念、愿望和意图。火星车的目标基本上是科学研究，而在我们的案例中，最重要的任务是寻找火星上任何类型的水的痕迹，同时努力保持活跃并避开障碍物。


  注意


  勇气号和机遇号是两款最著名的火星车；它们都做出了惊人的发现，并大大超过了预期寿命。勇气号于 2003 年 6 月发射，机遇号于 2003 年 7 月发射。勇气号一直活跃到
  2010 年（七年寿命），当时它的轮子陷入沙中，而机遇号截至本书撰写时，仍在火星上活跃并漫游。


  ## 什么是火星车？


  今天的火星是一个荒凉、干燥的星球，从远处看，它与我们的家园地球几乎毫无相似之处。然而，当接近火星轨道时，我们可以在其表面看到可能是古代、现已干涸的湖泊和峡谷的痕迹，这表明火星可能在三四百万年前不仅拥有水，还可能拥有生命。


  太空中的生命是艰难的；人类在那里生存极其复杂、充满风险和危险，到达一些最近的星球可能需要很多年。因此，为了促进对其他世界的研究，多个航天机构（NASA、CSA、ESA
  等）一直在设计机器人——或者通常被称为漫游车——用于行星的探索和研究。


  火星车是一种自动化机动车辆，它装载了用于分析周围环境的摄像头、用于挖掘并可能分析有趣岩石的研究仪器、用于发送图片和数据以及接收指令的通信设备、用于自身供电的太阳能电池板等（图
  4-1）。火星车的任务是探索火星并收集重要数据，这些数据有望得出该星球过去存在水的结论——或者可能发现古代生命。


  ![A449374_1_En_4_Fig1_HTML.jpg](img/A449374_1_En_4_Fig1_HTML.jpg)


  图 4-1


  火星车


  火星车的移动速度通常非常缓慢，大约每秒两英寸（约每小时 0.09 英里）。考虑到将火星车送上火星所涉及的麻烦和成本，工程师们更倾向于稳妥行事、谨慎驾驶；没有人愿意看到一辆价值
  25 亿美元的火星车因为开得太快而翻倒。另一个重要点是：大多数火星车每天都会收到来自地球团队的一组命令或指令；这些指令告诉火星车去哪里或做什么。从这个意义上说，可以说经典的火星车并不像我们想象的那么自主；它们当然包含一些自主行为，因为地球团队并不在火星上，无法实时监视它们的每一步。因此，火星车的
  AI 负责判断何时岩石太大无法越过（障碍物），或者何时岩石的颜色和纹理使其值得检查。可以说，火星车是某种程度上的自主，并且非常擅长服从命令，有点像人类士兵。火星车的任务是一项双方面的工作；一方面，我们有地球上的工程师，规划他们的日常行动、大规模策略等；另一方面，我们有火星车，执行这些行动、探索、收集数据并将其发送回地球。


  在本章中，我们将演示如何为一款完全自主的火星车开发 AI，该 AI 将考虑地形中的障碍物，并在一种混合架构下寻找水源，该架构包含一个 BDI（信念、愿望、意图）慎思机制，并利用统计和概率为其注入新的信念，这些信念将作为从其状态（过往历史）得出的结论。


  注意


  火星通常被称为红色星球，因为它在夜空中呈现微红色调。总的来说，火星大部分呈铁锈色，这是因为其土壤中含有铁。当暴露于火星大气中微量的氧气时，铁会氧化或生锈。这种“铁锈尘埃”也可能被吹到空中，将天空变成桃色。




  ## 火星车架构


  让我们花点时间审视一下我们将为火星车 AI 提出的混合架构（图 4-2）。


  ![A449374_1_En_4_Fig2_HTML.jpg](img/A449374_1_En_4_Fig2_HTML.jpg)


  图 4-2

  火星车架构


  该架构由三层组成（反应层、BDI 层和规划层）；不同的感知或事件（在图 4-2 中以较小字体表示）可以触发某一层执行。例如，如果火星车当前位置有水，反应层将立即行动，引导火星车在该点挖掘。如果附近区域有与水相关的感知，反应层也会被触发。火星车将包含一个名为`SenseRadius`的变量或字段，用于确定其周围的圆形区域并代表其视野；火星车将能够感知该圆形区域内的一切。由于我们处理的是离散环境，这个圆形将是真实圆形的近似值；换句话说，它是圆形的离散版本。


  注意


  像勇气号或机遇号这样的火星车（均由 NASA 制造）都配备了鱼眼摄像头或广角摄像头，使它们能够捕捉前方地形的全景。这些摄像头拍摄的照片会被分析，以判断路径上的某块岩石是否太大而无法越过，等等。


  如果火星车有一些初始信念，并且没有特别重要的感知，控制权将从反应层转移到 BDI 层，在那里，一个从信念集开始的过程启动；在此过程中，信念集被更新。我们今天可能持有的信念，明天可能被证明是错误的。对于火星车来说，它认为可能有水的地形位置可能是错误的，因此，随着新感知的到来，这个信念数据库必须不断更新。在第二阶段，从信念中生成愿望。对于火星车来说，其信念将由可能存在水的位置组成，而其愿望则是这些可能存在水的位置，按照曼哈顿距离（也称为街区距离）作为度量标准，按邻近程度排序。因此，前往最近的水源位置将成为火星车当前的意图。


  为了实现其当前意图，火星车使用其计划库（在规划层中），并选择一个适合所选意图的计划。由于在本例中，我们只考虑与可能存在的水源位置相关的意图，我们的计划库将仅包含一种计划类型：路径查找。


  路径查找算法解决了在给定两点之间寻找最短路径的问题；这些算法不仅考虑网格/地形上的障碍物，还考虑每条可能路径的成本。其代表算法包括广度优先搜索（BFS）、迪杰斯特拉算法和
  A*搜索。对于我们的火星车，我们开发了 BFS，这是其中效率最低但也最简单的算法。其他算法通过使用启发式方法、动态规划等来获得更好的性能，并避免考虑成本高昂的路径。


  一旦火星车探索了其所有信念，它就会四处游荡（进行随机移动），直到达到一定数量的动作。此时，我们将通过使用一个数据结构（字典）向火星车注入信念，该数据结构将其状态或过去的历史维护为一组已访问的单元格及其访问频率（访问某个单元格的次数），以及一个包含应用概率和统计简单概念的
  deliberation 过程。


  在这个 deliberation 过程中，火星车已知的地形被划分为四个相等（或几乎相等）的扇区（为了更高的精度，可以划分为 2^n 个扇区），对于每个扇区以及该扇区中的每个`(位置,
  访问频率)`对，我们计算相对频率，并将每个单独扇区中获得的结果相加，最终得到四个总相对频率值（每个扇区一个）。相对频率（RF）的计算公式如下：


  ![$$ \mathrm{RF}\left(\mathrm{c}\right)=\frac{\mathrm{freq}\left(\mathrm{c}\right)}{\mathrm{N}}
  $$](img/A449374_1_En_4_Chapter_Equa.gif)


  其中 freq(c)表示单元格 c 被访问的次数，N 是 c 所属集合（扇区）中的元素总数。然后，对于每个扇区 S，其总相对频率为：


  ![$$ \mathrm{TRF}\left(\mathrm{S}\right)=\sum \limits_{\mathrm{i}=0}^{\mathrm{N}}\kern0.38em
  \mathrm{RF}\left({\mathrm{c}}_{\mathrm{i}}\right) $$](img/A449374_1_En_4_Chapter_Equb.gif)


  最后，火星车将选择在总相对频率最低的扇区的一个角落“注入”水源位置的信念，该扇区应该是过去访问最少的扇区。我们可以说这种方法在很大程度上是一种启发式方法；也就是说，我们对这个问题有特定的知识，并将其嵌入其中，试图让火星车在其任务中表现出更好的行为。这种启发式方法以及与此问题相关的其他方法将非常简单，甚至幼稚；当前的目的只是为了说明如何创建一个混合智能体架构。因此，启发式方法不会成为本章的核心。顺便提一下，我们总是选择选定扇区的一个角落来注入信念的策略或启发式方法，可以像扇区划分和选择过程一样得到极大的改进。


  现在，我们已经初步了解了火星车的架构以及它实际上如何一步步做出决策，是时候展示其代码了。


  ## 火星车代码


  火星车是用一个 C#类编写的，包含以下字段、属性和构造函数（清单 4-1）。


  ```

  public class MarsRover

  {

  public Mars Mars { get; set; }

  public List Beliefs { get; set; }

  public Queue Desires { get; set; }

  public Stack Intentions { get; set; }

  public List PlanLibrary { get; set; }

  public int X { get; set; }

  public int Y { get; set; }

  public int SenseRadius { get; set; }

  public double RunningOverThreshold { get; set; }

  // 标识火星车看到的最后一部分地形

  public List> CurrentTerrain { get; set; }

  public Plan CurrentPlan { get; set; }

  public List> WaterFound { get; set; }

  private double[,] _terrain;

  private static Random _random;

  private Dictionary, int> _perceivedCells;

  private int _wanderTimes;

  private const int WanderThreshold = 10;

  public MarsRover(Mars mars, double [,] terrain, int x, int y, IEnumerable initialBeliefs,
  double runningOver, int senseRadious)

  {

  Mars = mars;

  X = x;

  Y = y;

  _terrain = new double[terrain.GetLength(0), terrain.GetLength(1)];

  Array.Copy(terrain, _terrain, terrain.GetLength(0) * terrain.GetLength(1));

  Beliefs = new List(initialBeliefs);

  Desires = new Queue();

  Intentions = new Stack();

  PlanLibrary = new List

  {

  new  Plan(TypesPlan.PathFinding, this),

  };

  WaterFound = new List>();

  RunningOverThreshold = runningOver;

  SenseRadius = senseRadious;

