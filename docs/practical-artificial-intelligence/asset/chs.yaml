  总而言之，我们将 TS 应用于一个有趣的聚类相关问题，并通过将其与前沿构建器相结合，获得了帕累托前沿的一个相当不错的近似解。


  使用元启发式算法来解决分区问题、TSP、二次分配问题以及许多其他问题是强制性的，因为它们具有 NP 完全性质。事实上，大多数时候我们找到的不是最优解，而是这些最优解的近似解，有时如果运气好，这些近似解可能等于某个最优解。诸如遗传算法之类的元启发式算法可以与其他
  AI 方法相结合，目的是从一个已经优化过的解开始启动某个 AI 过程，从而最终获得更好的结果。


  ## 总结


  在本章中，我们研究了启发式算法和元启发式算法；我们实现了流行的爬山算法，它是所有基于单解的元启发式算法（S-元启发式算法）的鼻祖，并且我们还分析了遗传算法，作为基于种群的元启发式算法（P-元启发式算法）的代表。我们提供了这两种方法的实现，并在最后描述了一种
  S-元启发式算法的代表；具体来说，我们描述了禁忌搜索，并提出了一种嵌入多目标框架、面向解决第 13 章介绍的分区问题的 TS 方法。




