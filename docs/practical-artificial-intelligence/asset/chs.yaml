  Application.Run(new SvmGui(svmClassifier.Weights, svmClassifier.Bias, svmClassifier.ModelToUse,\
  \ svmClassifier.SetA, svmClassifier.SetB, svmClassifier.Hyperplane));\n代码清单 9-8\n\
  创建并执行 SVM 的控制台应用程序\n```\n\n执行上述代码后，得到的结果如图 9-6 所示。\n\n![A449374_1_En_9_Fig6_HTML.jpg](img/A449374_1_En_9_Fig6_HTML.jpg)\n\
  \n图 9-6\n\n显示分类超平面以及两侧点的图表\n\n到目前为止，我们假设数据集是线性可分的，但如果并非如此，或者两个类别之间没有完美的分隔，该怎么办？这些将是接下来几节的主要话题，我们将探讨\
  \ SVM 的非线性可分情况以及非完美分隔情况。\n\n## 非完美分隔\n\n在某些情况下，像我们迄今为止所考虑的那样寻找最优分类超平面并非最合适的选择。例如，图\
  \ 9-7 展示了离群点对确定最优分类超平面的影响。右侧图形左上角的单个红点导致超平面显著摆动，改变了其方向，并导致比左侧图形小得多的间隔。\n\n为了使算法对离群点敏感，并为了更大的目标（找到一个具有可观间隔的超平面）而接受一些误分类，我们将改变原始问题的表述，引入一组松弛变量和一个常数\
  \ C，该常数将控制如何处理误分类。\n\n![A449374_1_En_9_Fig7_HTML.jpg](img/A449374_1_En_9_Fig7_HTML.jpg)\n\
  \n图 9-7\n\n左右图形展示了离群点对最优分类超平面造成的影响\n\n原始问题的新表述如下：\n\n![$$ {\\displaystyle \\begin{array}{l}\\\
  underset{\\mathrm{w},\\mathrm{b}}{\\min }{\\frac{\\left\\Vert \\mathrm{w}\\right\\\
  Vert }{2}}²+\\mathrm{C}\\sum \\limits_{\\mathrm{i}=1}^{\\mathrm{m}}{\\xi}_{\\mathrm{i}}\\\
  \\ {}\\mathrm{subject}\\kern0.50em \\mathrm{to}:{\\mathrm{y}}_{\\mathrm{i}}\\left({\\\
  mathrm{w}\\mathrm{x}}_{\\mathrm{i}}+\\mathrm{b}\\right)\\ge 1-{\\xi}_{\\mathrm{i}}\\\
  \\ {}{\\xi}_{\\mathrm{i}}\\ge 0\\ \\kern0.50em \\mathrm{i}=1\\dots \\mathrm{m}\\\
  end{array}} $$](img/A449374_1_En_9_Chapter_Equy.gif)\n\n这种重新表述的一个直接结果是，现在允许训练数据的间隔小于\
  \ 1，并且每当训练数据的函数间隔为 1 − ξ[i] (ξ > 0) 时，该代价或惩罚将在目标函数中支付，即目标函数增加 C * ξ[i]。参数 C 控制着两个目标之间的相对权重：使\
  \ ||w||² 尽可能小（正如我们之前所讨论的，这会使间隔变大）以及确保大多数训练数据的间隔至少为 1。\n\n为了再次推导出对偶形式，我们引入拉格朗日形式，并再次将对\
  \ w 和 b 的导数设为零。我们将跳过完整的计算过程，留给读者自行完成；最终结果如下：\n\n![$$ {\\displaystyle \\begin{array}{l}\\\
  underset{\\alpha }{\\max}\\mathrm{L}\\left(\\mathrm{w},\\mathrm{b},\\alpha \\right)=\\\
  sum \\limits_{\\mathrm{i}=1}^{\\mathrm{m}}{\\alpha}_{\\mathrm{i}}-\\frac{1}{2}\\\
  sum \\limits_{\\mathrm{i},\\mathrm{j}=1}^{\\mathrm{m}}{\\mathrm{y}}_{\\mathrm{i}}{\\\
  mathrm{y}}_{\\mathrm{j}}{\\alpha}_{\\mathrm{i}}{\\alpha}_{\\mathrm{j}}{\\mathrm{x}}_{\\\
  mathrm{i}}{\\mathrm{x}}_{\\mathrm{j}}\\\\ {}\\kern0.50em \\ \\kern0.50em \\ \\kern0.50em\
  \ \\ \\kern0.50em \\ \\kern0.50em \\ \\kern0.50em \\ \\kern0.50em \\ \\kern0.50em\
  \ \\ \\kern0.50em \\ \\kern0.50em \\ \\kern0.50em \\ \\kern0.50em \\ \\kern0.50em\
  \ \\ \\kern0.50em \\ \\ \\mathrm{s}.\\mathrm{t}\\kern0.50em \\ \\kern0.50em \\ \\\
  kern0.50em \\ \\kern0.50em \\ \\kern0.50em \\sum \\limits_{\\mathrm{i}=1}^{\\mathrm{m}}{\\\
  alpha}_{\\mathrm{i}}{\\mathrm{y}}_{\\mathrm{i}}=0\\\\ {}\\kern0.50em \\ \\kern0.50em\
  \ \\ \\kern0.50em \\ \\kern0.50em \\ \\kern0.50em \\ \\kern0.50em \\ \\kern0.50em\
  \ \\ \\kern0.50em \\ \\kern0.50em \\ \\kern0.50em \\ \\kern0.50em \\ \\kern0.50em\
  \ \\ \\kern0.50em \\ 0\\le {\\alpha}_{\\mathrm{i}}\\le \\mathrm{C}\\kern0.50em \\\
  \ \\mathrm{i}=1,\\dots \\mathrm{m}\\end{array}} $$](img/A449374_1_En_9_Chapter_Equz.gif)\n\
  \n正如我们所见，重新表述后的问题的对偶形式与之前基本相同；唯一的区别在于，之前的 ![$$ {\\alpha}_{\\mathrm{i}}\\ge 0 $$](img/A449374_1_En_9_Chapter_IEq8.gif)\
  \ 约束现在变成了箱型约束 ![$$ 0\\le {\\alpha}_{\\mathrm{i}}\\le \\mathrm{C} $$](img/A449374_1_En_9_Chapter_IEq9.gif)。b\
  \ 的计算也发生了变化；我们稍后在研究 SMO 算法时会看到这一点。\n\n注意\n\n重新表述后的问题被称为软间隔 SVM，以区别于之前描述的硬间隔 SVM。对于软间隔\
  \ SVM，我们允许训练数据位于间隔内部，或者被误分类，并且我们希望最小化由松弛变量之和衡量的总体误差。\n\n\n\n## 非线性可分情况：核技巧\n\n到目前为止，我们一直假设训练数据集是线性可分的，但如果训练数据集或要学习的函数本身都不具备线性结构，会发生什么呢？图\
  \ 9-8 展示了这种情况。\n\n![A449374_1_En_9_Fig8_HTML.jpg](img/A449374_1_En_9_Fig8_HTML.jpg)\n\
  \n图 9-8\n\n非线性情况\n\n读者可以验证，在图中无法用超平面将这两类（红点和蓝点）分开。这种情况下该如何解决？SVM 的解决方案是将训练数据映射或转换到一个更高维、更丰富的空间；在该高维空间中找到一个分类超平面，然后将结果转换回原始空间。这种映射通过一个特征映射函数实现，该函数从原始空间（上例中的\
  \ R²）映射到更高维空间（R³），从而增加了数据的维度（图 9-9）。\n\n![A449374_1_En_9_Fig9_HTML.jpg](img/A449374_1_En_9_Fig9_HTML.jpg)\n\
  \n图 9-9\n\n数据从二维空间映射到三维空间\n\n例如，多项式特征映射 ![$$ \\varphi :{\\mathrm{R}}²\\to {\\mathrm{R}}³\
  \ $$](img/A449374_1_En_9_Chapter_IEq10.gif) 会按如下方式转换数据：\n\n![$$ \\left(\\mathrm{x},\\\
  mathrm{y}\\right)\\to \\left({\\mathrm{x}}²,{\\sqrt{2}}^{\\ast}\\mathrm{xy},{\\\
  mathrm{y}}²\\right) $$](img/A449374_1_En_9_Chapter_Equaa.gif)\n\n决策函数现在会改变其公式，以适应新的数据维度，如下所示：\n\
  \n![$$ \\mathrm{f}\\left(\\mathrm{x}\\right)=\\mathrm{w}\\cdot \\varphi \\left(\\\
  mathrm{x}\\right)+\\mathrm{b} $$](img/A449374_1_En_9_Chapter_Equab.gif)\n\n这种方法的一个问题是，在某些情况下\
  \ φ(x) 的维度可能会变得非常大；这会使需要求解的二次规划问题变得复杂，同时 w 的显式表示也会变得困难。幸运的是，在前面的章节中，我们已经得到了问题的对偶形式，该形式仅用\
  \ α[i] 表示，并且可以作为 w 的替代方案；因此，新的决策方程或分类超平面方程可以表述如下：\n\n![$$ \\mathrm{f}\\left(\\mathrm{x}\\\
  right)=\\sum \\limits_{\\mathrm{i}=1}^{\\mathrm{m}}{\\alpha}_{\\mathrm{i}}\\varphi\
  \ \\left({\\mathrm{x}}_{\\mathrm{i}}\\right)\\cdot \\mathrm{x}+\\mathrm{b} $$](img/A449374_1_En_9_Chapter_Equac.gif)\n\
  \n在这种情况下，我们称 K (![$$ {\\mathrm{x}}_{\\mathrm{i}},\\mathrm{x}\\Big)=\\varphi \\left({\\\
  mathrm{x}}_{\\mathrm{i}}\\right)\\cdot \\varphi \\left(\\mathrm{x}\\right) $$](img/A449374_1_En_9_Chapter_IEq11.gif)\
  \ 为核函数；该函数将替换我们公式中可能出现的任何内积。使用核函数的关键在于，计算其值的成本可能远低于计算甚至表示 φ(x) 的成本；计算核函数并不需要计算 φ(x)。\n\
  \n例如，多项式核遵循如下公式：\n\n![$$ \\mathrm{K}\\left(\\mathrm{x},{\\mathrm{x}}^{\\prime}\\\
  right)={\\left(\\mathrm{x}\\cdot {\\mathrm{x}}^{\\prime }+1\\right)}^{\\mathrm{d}}\
  \ $$](img/A449374_1_En_9_Chapter_Equad.gif)\n\n读者可以验证，计算这个核函数将比显式计算 ![$$ \\varphi\
  \ \\left({\\mathrm{x}}_{\\mathrm{i}}\\right)\\cdot \\varphi \\left(\\mathrm{x}\\\
  right) $$](img/A449374_1_En_9_Chapter_IEq12.gif) 高效得多，尤其是在维度很高的情况下。另一个相关的核是高斯核，其定义如下：\n\
  \n![$$ \\mathrm{K}\\left({\\mathrm{x}}^{\\prime },\\mathrm{x}\\right)={\\mathrm{e}}^{-{\\\
  left\\Vert \\mathrm{x}-{\\mathrm{x}}^{\\prime}\\right\\Vert}²/2{\\sigma}²} $$](img/A449374_1_En_9_Chapter_Equae.gif)\n\
  \n其中 ![$$ \\sigma >0 $$](img/A449374_1_En_9_Chapter_IEq13.gif)，由用户选择。直观地说，如果 φ(x)\
  \ 和 φ(z) 彼此接近，我们可以预期 K (![$$ {\\mathrm{x}}^{\\prime },\\mathrm{x}\\Big)=\\varphi\
  \ \\left({\\mathrm{x}}^{\\prime}\\right)\\cdot \\varphi \\left(\\mathrm{x}\\right)\
  \ $$](img/A449374_1_En_9_Chapter_IEq14.gif) 的值会很大。另一方面，如果 φ(x ') 和 φ(x) 相距很远（几乎相互正交），那么\
  \ K (![$$ {\\mathrm{x}}^{\\prime },\\mathrm{x}\\Big)=\\varphi \\left({\\mathrm{x}}^{\\\
  prime}\\right)\\cdot \\varphi \\left(\\mathrm{x}\\right) $$](img/A449374_1_En_9_Chapter_IEq15.gif)\
  \ 的值就会很小。因此，我们可以将 K (![$$ {\\mathrm{x}}^{\\prime },\\mathrm{x}\\Big) $$](img/A449374_1_En_9_Chapter_IEq16.gif)\
  \ 视为衡量 φ(x ') 和 φ(x) 相似程度，或者说衡量 x ' 和 x 相似程度的一种度量。\n\n核函数的应用并不仅限于 SVM。相反，它在人工智能领域有着更广泛的应用。任何计算内积的学习算法都可以用核函数替换内积，从而以更高效的方式处理高维特征空间。\n\
  \n注意\n\n并非所有函数都可以被视为核函数。已有证明（Mercer 定理）表明，一个函数能被视作核函数的充分必要条件是，其核矩阵 K 是对称半正定的。与包含\
  \ m 个向量的训练数据集相关联的核矩阵是一个 m x m 的方阵，其中包含所有可能的组合值 Kij = K(xi, xj)。\n\n\n\n## 序列最小优化算法（SMO）\n\
  \n序列最小优化（SMO）算法由微软研究院的约翰·普拉特于 1998 年提出；其目的是引入一种高效训练支持向量机的方法。因此，SMO 避免了使用二次规划库，而是通过解析方式求解大量小型优化子问题来解决优化问题，这些子问题涉及先前通过启发式方法选出的任意两个拉格朗日乘子。\n\
  \n理解 SMO 的运行机制需要掌握两个数学结论或定理。首先，作为拉格朗日乘子法的推广，**卡罗需-库恩-塔克条件**为判断优化问题的解是否最优提供了必要且充分的条件。其次，**奥苏纳定理**证明了一个大型二次规划问题可以分解为一系列较小的二次规划子问题。只要在前一个子问题的样本中至少加入一个违反\
  \ KKT 条件的样本，每一步都会降低整体目标函数，并维持一个满足所有约束的可行点。因此，一个始终至少添加一个违反者的二次规划子问题序列将保证收敛。奥苏纳定理验证了\
  \ SMO 在优化主二次规划问题的子问题时仅选择两个乘子的策略。总的来说，SMO 严重依赖上述两个结果来证明其运行机制。\n\n检查 KKT 条件意味着求解一个方程组，其中目标函数的梯度加上所有约束和拉格朗日乘子等于零。求解这个方程组（留给读者作为练习）后，你将得到以下条件，用于判断α[i]是否为最优解：\n\
  \n![$$ {\\displaystyle \\begin{array}{c}{\\alpha}_{\\mathrm{i}}=0\\leftrightarrow\
  \ {\\mathrm{y}}_{\\mathrm{i}}{\\mathrm{u}}_{\\mathrm{i}}\\ge 1\\\\ {}0<{\\alpha}_{\\\
  mathrm{i}}<C\\leftrightarrow {\\mathrm{y}}_{\\mathrm{i}}{\\mathrm{u}}_{\\mathrm{i}}=1\\\
  \\ {}{\\alpha}_{\\mathrm{i}}=\\mathrm{C}\\leftrightarrow {\\mathrm{y}}_{\\mathrm{i}}{\\\
  mathrm{u}}_{\\mathrm{i}}\\le 1\\end{array}} $$](img/A449374_1_En_9_Chapter_Equaf.gif)\n\
  \n在此情况下，u[i]是 SVM 对第 i 个训练数据提供的输出或分类结果。这些条件的几何解释见表 9-1。\n\n表 9-1\n\n拉格朗日乘子值与 KKT\
  \ 条件的几何解释\n\n| 值 | 解释 |\n| --- | --- |\n| ![$$ {\\alpha}_{\\mathrm{i}}=0 $$](img/A449374_1_En_9_Chapter_IEq17.gif)\
  \ | 第 i 个训练数据被正确分类；可能位于间隔边界上。 |\n| ![$$ 0<{\\alpha}_{\\mathrm{i}}<C $$](img/A449374_1_En_9_Chapter_IEq18.gif)\
  \ | 第 i 个训练数据被正确分类，且位于间隔边界上（支持向量）。 |\n| ![$$ {\\alpha}_{\\mathrm{i}}=\\mathrm{C}\
  \ $$](img/A449374_1_En_9_Chapter_IEq19.gif) | 此场景可能出现三种情况：第 i 个训练数据被正确分类且位于间隔边界上；或第\
  \ i 个训练数据被正确分类且位于分类超平面与间隔边界之间；或第 i 个训练数据被错误分类（可能因为它是一个异常值）。 |\n\n一旦所有α[i]在某个预定义的容差（通常为![$$\
  \ {10}^{-3} $$](img/A449374_1_En_9_Chapter_IEq20.gif)）内满足上述条件，SMO 算法将终止。\n\n注意\n\
  \n在普拉特的原始论文中，他假设分类超平面的公式为 wx - b 而非 wx + b。此外，他没有最大化本章所述对偶问题的目标函数 f(x)，而是最小化了 -f(x)；我们知道这等价于我们的最大化问题，因为\
  \ min f(x) = max -f(x)。\n\n如前所述，该算法每次优化两个α[i]。首先，根据奥苏纳定理，我们必须寻找一个违反 KKT 条件的α[i]；设这个α[i]为α[2]。然后，使用启发式方法找到另一个α[i]——设为α[1]。第一个乘子（α[2]）通常从非边界乘子（满足![$$\
  \ 0<{\\alpha}_{\\mathrm{i}}<C $$](img/A449374_1_En_9_Chapter_IEq21.gif)的乘子）集合中选取。\n\
  \n一旦我们选定了α[2]，第二个乘子α[1]的选择目标是最大化![$$ \\mid {\\mathrm{E}}_1-{\\mathrm{E}}_2\\mid\
  \ $$](img/A449374_1_En_9_Chapter_IEq22.gif)，其中![$$ {\\mathrm{E}}_{\\mathrm{i}}=\\\
  mathrm{f}\\left({\\mathrm{x}}_{\\mathrm{i}}\\right)-{\\mathrm{y}}_{\\mathrm{i}}\
  \ $$](img/A449374_1_En_9_Chapter_IEq23.gif)是 SVM 在正确分类第 i 个训练数据时产生的误差。这就是我们之前提到的启发式方法，旨在加速流程。如果找不到这样的α[1]，则随机选择一个非边界训练数据点。如果仍然失败，则随机选择任意训练数据；若再次失败，则重新选择α[2]。\n\
  \n选择α[1]和α[2]后，算法的其余部分简化为更新这些值。执行此类更新时，我们必须保证每个α[i]都满足问题的约束条件；即![$$ 0<{\\alpha}_{\\\
  mathrm{i}}<C $$](img/A449374_1_En_9_Chapter_IEq24.gif)和![$$ \\sum \\limits_{\\mathrm{i}=1}^{\\\
  mathrm{m}}{\\alpha}_{\\mathrm{i}}{\\mathrm{y}}_{\\mathrm{i}}=0 $$](img/A449374_1_En_9_Chapter_IEq25.gif)。由于奥苏纳定理允许我们仅关注由α[1]和α[2]组成的二次规划子问题，我们必须确保这两个拉格朗日乘子始终满足以下约束：\n\
  \n![$$ {\\displaystyle \\begin{array}{c}0<{\\alpha}_1,{\\alpha}_2<C\\\\ {}{\\alpha}_1{\\\
  mathrm{y}}_1+{\\alpha}_2{\\mathrm{y}}_2=\\mathrm{k}\\end{array}} $$](img/A449374_1_En_9_Chapter_Equag.gif)\n\
  \nα[1]和α[2]必须满足的约束可以在二维空间中用图形表示，如图 9-10 所示。\n\n![A449374_1_En_9_Fig10_HTML.jpg](img/A449374_1_En_9_Fig10_HTML.jpg)\n\
  \n图 9-10\n\n情况 a) 发生在 y1 ≠ y2 时；情况 b) 发生在 y1 = y2 时\n\n为了将α[1]和α[2]都保持在约束框内并满足线性约束，我们必须确定下界（L）和上界（H）值。如果\
  \ y1 ≠ y2，可以证明α[2]适用以下边界：\n\n![$$ {\\displaystyle \\begin{array}{l}\\mathrm{L}=\\\
  max \\left(0,{\\alpha}_2-{\\alpha}_1\\right)\\\\ {}\\mathrm{H}=\\min \\left(\\mathrm{C},\\\
  mathrm{C}+{\\alpha}_2-{\\alpha}_1\\right)\\end{array}} $$](img/A449374_1_En_9_Chapter_Equah.gif)\n\
  \n如果 y1 = y2，则直线方向改变；因此，\n\n![$$ {\\displaystyle \\begin{array}{l}\\mathrm{L}=\\\
  max \\left(0,{\\alpha}_2+{\\alpha}_1-\\mathrm{C}\\right)\\\\ {}\\mathrm{H}=\\min\
  \ \\left(\\mathrm{C},{\\alpha}_2+{\\alpha}_1\\right)\\end{array}} $$](img/A449374_1_En_9_Chapter_Equai.gif)\n\
  \n因此，更新后的α[2]——我们称之为α[2]^(new)，稍后将介绍如何计算——在计算后必须根据这些边界进行裁剪，其裁剪后的值如下：\n\n![$$ {\\\
  alpha}_2^{\\mathrm{new},\\mathrm{clipped}}=\\Big\\{{\\displaystyle \\begin{array}{l}\\\
  kern0.50em \\ \\kern0.50em \\ \\kern0.50em H\\ \\kern0.50em \\ \\kern0.50em \\ \\\
  kern0.50em \\ \\kern0.50em if\\ {\\alpha}_2^{\\mathrm{new}}\\ge H\\\\ {}{\\alpha}_2^{\\\
  mathrm{new}}\\kern0.50em \\ \\kern0.50em \\ \\kern0.50em \\ \\kern0.50em \\ if\\\
  \ \\ L<{\\alpha}_2^{\\mathrm{new}}<C\\\\ {}\\kern0.50em \\ \\kern0.50em \\ \\kern0.50em\
  \ \\ L\\ \\kern0.50em \\ \\kern0.50em \\ \\kern0.50em \\ \\kern0.50em if\\ \\ {\\\
  alpha}_2^{\\mathrm{new}}\\le L\\end{array}} $$](img/A449374_1_En_9_Chapter_Equaj.gif)\n\
  \n一旦我们获得了α[2]^(new)的最终（必要时裁剪后的）值，就可以使用线性约束方程轻松求得α[1]^(new)，如下几行所示。在α[1]^(new)的公式中，![$$\
  \ \\mathrm{s}={\\mathrm{y}}_1{\\mathrm{y}}_2 $$](img/A449374_1_En_9_Chapter_IEq26.gif)是一个引入的值，其唯一目的是从以下线性约束方程中解出α[1]^(new)：\n\
  \n\n\n![$$ {\\alpha}_1^{\\mathrm{new}}={\\alpha}_1+\\mathrm{s}\\left({\\alpha}_2-{\\\
  alpha}_2^{\\mathrm{new},\\mathrm{clipped}}\\right) $$](img/A449374_1_En_9_Chapter_Equak.gif)\n\
  \n到目前为止，我们已经掌握了 SMO 算法的几乎所有部分。不过，我们还缺少一个非常重要的组件——α[2] 的学习规则或更新规则。回顾一下，我们要优化的目标函数如下：\n\
  \n![$$ {\\displaystyle \\begin{array}{l}\\underset{\\alpha }{\\min}\\mathrm{L}\\\
  left(\\mathrm{w},\\mathrm{b},\\alpha \\right)=\\frac{1}{2}\\sum \\limits_{\\mathrm{i},\\\
  mathrm{j}=1}^{\\mathrm{m}}{\\mathrm{y}}_{\\mathrm{i}}{\\mathrm{y}}_{\\mathrm{j}}{\\\
  alpha}_{\\mathrm{i}}{\\alpha}_{\\mathrm{j}}\\mathrm{K}\\left({\\mathrm{x}}_{\\mathrm{i}}\\\
  right)\\mathrm{K}\\left({\\mathrm{x}}_{\\mathrm{j}}\\right)-\\sum \\limits_{\\mathrm{i}=1}^{\\\
  mathrm{m}}{\\alpha}_{\\mathrm{i}}\\\\ {}\\kern0.50em \\ \\kern0.50em \\ \\kern0.50em\
  \ \\ \\kern0.50em \\ \\kern0.50em \\ \\kern0.50em \\ \\kern0.50em \\ \\kern0.50em\
  \ \\ \\kern0.50em \\ \\kern0.50em \\ \\kern0.50em \\ \\kern0.50em \\ \\kern0.50em\
  \ \\ \\kern0.50em \\ \\ \\mathrm{s}.\\mathrm{t}\\kern0.50em \\ \\kern0.50em \\ \\\
  kern0.50em \\ \\kern0.50em \\ \\ \\sum \\limits_{\\mathrm{i}=1}^{\\mathrm{m}}{\\\
  alpha}_{\\mathrm{i}}{\\mathrm{y}}_{\\mathrm{i}}=0\\\\ {}\\kern0.50em \\ \\kern0.50em\
  \ \\ \\kern0.50em \\ \\kern0.50em \\ \\kern0.50em \\ \\kern0.50em \\ \\kern0.50em\
  \ \\ \\kern0.50em \\ \\kern0.50em \\ \\kern0.50em \\ \\kern0.50em \\ \\kern0.50em\
  \ \\ \\kern0.50em \\ \\ 0\\le {\\alpha}_{\\mathrm{i}}\\le \\mathrm{C}\\kern0.50em\
  \ \\ \\mathrm{i}=1,\\dots \\mathrm{m}\\end{array}} $$](img/A449374_1_En_9_Chapter_Equal.gif)\n\
  \n请注意，这与我们之前定义的问题相同，只是在公式中引入了核函数 K，并将目标从 max f(x) 改为 min -f(x)。这正是 Platt 论文中求解的精确公式。\n\
  \nα[2] 更新规则的表达式是从目标函数推导出来的，方法是先用 α[1] 和 α[2] 重写目标函数，然后仅用 α[2] 表示（利用线性约束条件），固定所有其他\
  \ α[i]，并通过计算关于 α[2] 的二阶导数来找到这个重写后目标函数的最小值。用 α[1] 和 α[2] 重写，并将任何其他 α[i] 项固定为常数，会得到以下结果：\n\
  \n![$$ \\frac{1}{2}{\\mathrm{K}}_{11}{\\alpha}_1²+\\frac{1}{2}{\\mathrm{K}}_{22}{\\\
  alpha}_2²+{\\mathrm{sK}}_{12}{\\alpha}_1{\\alpha}_2+{\\mathrm{v}}_1{\\mathrm{y}}_1{\\\
  alpha}_1+{\\mathrm{v}}_2{\\mathrm{y}}_2{\\alpha}_2-{\\alpha}_1-{\\alpha}_2+\\mathrm{P}\
  \ $$](img/A449374_1_En_9_Chapter_Equam.gif)\n\n其中，![$$ {\\mathrm{K}}_{\\mathrm{i}\\\
  mathrm{j}}=\\mathrm{K}\\left({\\mathrm{x}}_{\\mathrm{i}},{\\mathrm{x}}_{\\mathrm{j}}\\\
  right),{\\mathrm{v}}_{\\mathrm{i}}=\\sum \\limits_{\\mathrm{j}=3}^{\\mathrm{m}}{\\\
  mathrm{y}}_{\\mathrm{j}}{\\alpha}_{\\mathrm{j}}{\\mathrm{K}}_{\\mathrm{i}\\mathrm{j}},{\\\
  mathrm{v}}_1{\\mathrm{y}}_1{\\alpha}_1 $$](img/A449374_1_En_9_Chapter_IEq27.gif)\
  \ 是将 α[1] 与所有其他变量关联起来的项，同样地，v[2]y[2]α[2] 是将 α[2] 与所有其他变量关联起来的项。P 是一个常数，代表与所有其他 α[i]\
  \ 相关的项。使用如下形式的线性约束条件：\n\n![$$ {\\displaystyle \\begin{array}{c}{\\alpha}_1+\\mathrm{s}{\\\
  alpha}_2=\\mathrm{w}\\\\ {}\\mathrm{s}={\\mathrm{y}}_1{\\mathrm{y}}_2\\end{array}}\
  \ $$](img/A449374_1_En_9_Chapter_Equan.gif)\n\n使我们能够从重写后的方程中消去 α[1]，并仅从 α[2] 的角度来审视它。\n\
  \n![$$ {\\displaystyle \\begin{array}{l}\\frac{1}{2}{\\mathrm{K}}_{11}{\\left(\\\
  mathrm{w}-\\mathrm{s}{\\alpha}_2\\right)}²+\\frac{1}{2}{\\mathrm{K}}_{22}{\\alpha}_2²+{\\\
  mathrm{sK}}_{12}\\left(\\mathrm{w}-\\mathrm{s}{\\alpha}_2\\right){\\alpha}_2\\\\\
  \ {}+{\\mathrm{v}}_1{\\mathrm{y}}_1\\left(\\mathrm{w}-\\mathrm{s}{\\alpha}_2\\right)+{\\\
  mathrm{v}}_2{\\mathrm{y}}_2{\\alpha}_2\\\\ {}-\\left(\\mathrm{w}-\\mathrm{s}{\\\
  alpha}_2\\right)-{\\alpha}_2+\\mathrm{P}\\end{array}} $$](img/A449374_1_En_9_Chapter_Equao.gif)\n\
  \n为了找到上述公式最小值的表达式，我们求其关于 α[2] 的二阶导数，结果如下：\n\n![$$ \\left({\\mathrm{K}}_{11}+{\\\
  mathrm{K}}_{22}-2{\\mathrm{K}}_{12}\\right)\\kern0.50em {\\alpha}_2=\\mathrm{s}\\\
  left({\\mathrm{K}}_{11}-{\\mathrm{K}}_{12}\\right)\\mathrm{w}+{\\mathrm{y}}_2\\\
  left({\\mathrm{v}}_1-{\\mathrm{v}}_2\\right)+1-\\mathrm{s} $$](img/A449374_1_En_9_Chapter_Equap.gif)\n\
  \n这里考虑到了：\n\n![$$ {\\mathrm{v}}_{\\mathrm{i}}=\\sum \\limits_{\\mathrm{j}=3}^{\\\
  mathrm{m}}{\\mathrm{y}}_{\\mathrm{j}}{\\alpha}_{\\mathrm{j}}{\\mathrm{K}}_{\\mathrm{i}\\\
  mathrm{j}}={\\mathrm{u}}_{\\mathrm{i}}+{\\mathrm{b}}^{\\ast }-{\\mathrm{y}}_1{\\\
  alpha}_1^{\\ast }{\\mathrm{K}}_{1\\mathrm{i}}-{\\mathrm{y}}_2{\\alpha}_2^{\\ast\
  \ }{\\mathrm{K}}_{2\\mathrm{i}} $$](img/A449374_1_En_9_Chapter_Equaq.gif)\n\n在上式中，每个带有下标的变量都标识了其对应的最优值。\n\
  \n通过将 v[i] 和 w 代入二阶导数公式并重新调整各项，我们最终将得到 α[2] 的更新规则：\n\n![$$ {\\alpha}_2^{\\mathrm{new}}={\\\
  alpha}_2+\\frac{{\\mathrm{y}}_2\\left({\\mathrm{E}}_1-{\\mathrm{E}}_2\\right)}{{\\\
  mathrm{K}}_{11}+{\\mathrm{K}}_{22}-2{\\mathrm{K}}_{12}} $$](img/A449374_1_En_9_Chapter_Equar.gif)\n\
  \n其中，![$$ {\\mathrm{E}}_{\\mathrm{i}}={\\mathrm{u}}_{\\mathrm{i}}-{\\mathrm{y}}_{\\\
  mathrm{i}} $$](img/A449374_1_En_9_Chapter_IEq28.gif)，而 ![$$ {\\mathrm{K}}_{11}+{\\\
  mathrm{K}}_{22}-2{\\mathrm{K}}_{12} $$](img/A449374_1_En_9_Chapter_IEq29.gif) 被称为\
  \ SVM 的学习率。\n\n在深入实现 SMO 算法之前，最后一步是计算偏置项。我们已经知道如何计算 w，但偏置 b 呢？偏置的计算方式如下：\n\n![$$\
  \ {\\displaystyle \\begin{array}{l}{\\mathrm{b}}_1={\\mathrm{E}}_1+{\\mathrm{y}}_1\\\
  left({\\alpha}_1^{\\mathrm{new}}-{\\alpha}_1\\right){\\mathrm{K}}_{11}+{\\mathrm{y}}_2\\\
  left({\\alpha}_2^{\\mathrm{new},\\mathrm{clipped}}-{\\alpha}_2\\right){\\mathrm{K}}_{12}+\\\
  mathrm{b}\\\\ {}{\\mathrm{b}}_2={\\mathrm{E}}_2+{\\mathrm{y}}_1\\left({\\alpha}_1^{\\\
  mathrm{new}}-{\\alpha}_1\\right){\\mathrm{K}}_{12}+{\\mathrm{y}}_2\\left({\\alpha}_2^{\\\
  mathrm{new},\\mathrm{clipped}}-{\\alpha}_2\\right){\\mathrm{K}}_{22}+\\mathrm{b}\\\
  end{array}} $$](img/A449374_1_En_9_Chapter_Equas.gif)\n\n计算这些值的平均值，因此最终的偏置可以计算如下：\n\
  \n![$$ \\mathrm{b}=\\left({\\mathrm{b}}_1+{\\mathrm{b}}_2\\right)/2 $$](img/A449374_1_En_9_Chapter_Equat.gif)\n\
  \n如果没有 α[i] 被裁剪，那么可以保证 ![$$ \\mathrm{b}={\\mathrm{b}}_1={\\mathrm{b}}_2 $$](img/A449374_1_En_9_Chapter_IEq30.gif)。b\
  \ 的新值在 SMO 算法的每一步结束时计算。在详细描述了每一个理论部分之后，现在让我们来看看该算法在 C# 中的实现。\n\n\n\n## 实际问题：SMO\
  \ 算法实现\n\n本节将描述的 C# 算法严格遵循 Platt 在 1998 年发表的原始论文中的伪代码。首先，算法的入口点是清单 9-9 中所示的 `TrainingBySmo()`\
  \ 方法；该方法用于选择第一个 α[i]。清单 9-9 还展示了一个微小的更新，我们需要对之前章节中介绍的 `LinearSvmClassifier` 类进行此更新，SMO\
  \ 算法将嵌入其中。此更新包括将常量 C、Epsilon 和 Tolerance 添加为类的属性或字段；此外，所有与 SMO 相关的方法最终也将被添加进来。\n\
  \n```\npublic class LinearSvmClassifier\n{\nprivate const double C = 0.5;\nprivate\
  \ const double Epsilon = 0.001;\nprivate const double Tolerance = 0.001;\n...\n\
  }\npublic void TrainingBySmo()\n{\nvarnumChanged = 0;\nvarexamAll = true;\nModelToUse\
  \ = -1;\nwhile (numChanged> 0 || examAll)\n{\nnumChanged = 0;\nif (examAll)\n{\n\
  for (vari = 0; i<TrainingSamples.Count; i++)\nnumChanged += ExamineExample(i) ?1\
  \ : 0;\n}\nelse\n{\nvar subset = _alphas.GetIndicesFromValues(0, C);\nforeach (vari\
  \ in subset)\nnumChanged += ExamineExample(i) ?1 : 0;\n}\nif (examAll)\nexamAll\
  \ = false;\nelse if (numChanged == 0)\nexamAll = true;\n}\n}\n清单 9-9\nSMO 算法的起点，在此处我们搜索第一个拉格朗日乘子\n\
  ```\n\n`TrainingBySmo()` 方法声明了两个变量，用于辅助寻找两个拉格朗日乘子：`numChanged` 和 `examAll`。第一个是整数变量，包含适合与第一个选定的待优化拉格朗日乘子\
  \ α[2] 配对的非边界拉格朗日乘子的数量。如果找不到非边界乘子，则 `examAll` 变为 True，这意味着在下一次循环执行中必须检查所有训练数据。\n\
  \n清单 9-10 中所示的 `ExamineExample()` 方法首先检查给定的乘子 (α[2]) 是否违反了 KKT 条件，且违反程度超过了预定义的容差。假设确实违反，则它会寻找第二个拉格朗日乘子，并通过调用\
  \ `TakeStep()` 方法对它们进行联合优化。\n\n```\nprivate bool ExamineExample(int i1)\n{\nvaryi\
  \ = TrainingSamples[i1].Classification;\nvarai = _alphas[i1];\nvarerrorI = LFunctionValue(i1)\
  \ - yi;\nvarri = yi * errorI;\nif ((ri Tolerance &&ai> 0))\n{\nfor (var i2 = 0;\
  \ i2 <TrainingSamples.Count; i2++)\nif (TakeStep(i1, i2))\nreturn true;\n}\nreturn\
  \ false;\n}\n清单 9-10\nExamineExample() 方法寻找第二个拉格朗日乘子，并通过调用 TakeStep() 方法对它们进行联合优化\n\
  ```\n\n`TakeStep()` 方法（清单 9-11）接收两个选定的拉格朗日乘子的索引作为参数。\n\n```\nprivate bool TakeStep(inti,\
  \ int j)\n{\nif (i == j)\nreturn false;\nvaryi = TrainingSamples[i].Classification;\n\
  varyj = TrainingSamples[j].Classification;\n// 检查 aj 的边界\nvar s = yi*yj;\nvarerrorI\
  \ = LFunctionValue(i) - yi;\n// 计算 L, H\nvar l = Math.Max(0, _alphas[j] + _alphas[i]\
  \ * s - (s + 1) / 2 * C);\nvar h = Math.Min(C, _alphas[j] + _alphas[i] * s - (s\
  \ - 1) / 2 * C);\nif (l == h)\nreturn false;\ndouble newAj;\n// 获取 aj 的新值\nvar k12\
  \ = Kernel.Polynomial(2, TrainingSamples[i].Features, TrainingSamples[j].Features);\n\
  var k11 = Kernel.Polynomial(2, TrainingSamples[i].Features, TrainingSamples[i].Features);\n\
  var k22 = Kernel.Polynomial(2, TrainingSamples[j].Features, TrainingSamples[j].Features);\n\
  var eta = 2*k12 - k11 - k22;\nvarerrorJ = LFunctionValue(j) - yj;\nif (eta  h)\n\
  newAj = h;\n}\nelse\n{\nvar c1 = eta/2;\nvar c2 = yj * (errorI - errorJ) - eta *\
  \ _alphas[j];\nvarlObj = c1*Math.Pow(l, 2) + c2*l;\nvarhObj = c1*Math.Pow(h, 2)\
  \ + c2*h;\nif (lObj>hObj + Epsilon)\nnewAj = l;\nelse if (lObj C)\n{\nnewAj += s\
  \ * (newAi - C);\nnewAi = C;\n}\n// 更新偏置和权重向量\nUpdateBias(newAi, _alphas[i], newAj,\
  \ _alphas[j], yi, yj, errorI, errorJ, k11, k12, k22);\nUpdateWeightVector(i, j,\
  \ newAi, _alphas[i], newAj, _alphas[j], yi, yj);\n_alphas[i] = newAi;\n_alphas[j]\
  \ = newAj;\nreturn true;\n}\n清单 9-11\nTakeStep() 方法联合优化两个拉格朗日乘子\n```\n\n如果 `TakeStep()`\
  \ 方法成功优化了两个拉格朗日乘子，则返回 True；否则返回 False。`LFunctionValue()` 和 `Kernel.Polynomial()`\
  \ 方法在清单 9-12 中给出。前者计算目标函数的值，后者是 `Kernel` 类的一个静态方法，表示多项式核。该类旨在包含所有核函数；由于内积被认为是一种核函数，因此也被添加到了该类中。\n\
  \n```\nprivate double LFunctionValue(inti)\n{\nvar result = 0.0;\nfor (int k = 0;\
  \ k <TrainingSamples[i].Features.Length; k++)\nresult += Weights[k] * TrainingSamples[i].Features[k];\n\
  result -= Bias;\nreturn result;\n}\npublic class Kernel\n{\npublic static double\
  \ Polynomial(double degree, double [] v1, double [] v2)\n{\nreturn Math.Pow(InnerProduct(v1,\
  \ v2) + 1, degree);\n}\nprivate static double InnerProduct(double [] v1, double\
  \ [] v2)\n{\nvar result = 0.0;\nfor (vari = 0; i< v1.Length; i++)\nresult += v1[i]*v2[i];\n\
  return result;\n}\n}\n清单 9-12\nLFunctionValue() 方法，用于计算目标函数的值，以及 Kernel 类\n```\n\
  \n最后，让我们展示负责更新 SVM 偏置和权重向量的方法（清单 9-13）。\n\n```\nprivate void UpdateBias(double newAi,\
  \ double oldAi, double newAj,\ndouble oldAj, double yi, double yj, double errorI,\
  \ double errorJ,\ndouble k11, double k12, double k22)\n{\ndouble b1, b2, bNew;\n\
  if (newAi> 0 &&newAi 0 &&newAj< C)\nbNew = Bias + errorJ + yi * (newAi - oldAi)\
  \ * k12 + yj * (newAj - oldAj) * k22;\nelse\n{\nb1 = Bias + errorI + yi * (newAi\
  \ - oldAi) * k11 + yj * (newAj - oldAj) * k12;\nb2 = Bias + errorJ + yi * (newAi\
  \ - oldAi) * k12 + yj * (newAj - oldAj) * k22;\nbNew = (b1 + b2)/2;\n}\n}\nBias\
  \ = bNew;\n}\nprivate void UpdateWeightVector(inti, int j, double newAi, double\
  \ oldAi,\ndouble newAj, double oldAj, double yi, double yj)\n{\nvar t1 = yi * (newAi\
  \ - oldAi);\nvar t2 = yj * (newAj - oldAj);\nvarobjI = TrainingSamples[i].Features;\n\
  varobjJ = TrainingSamples[j].Features;\nfor (var k = 0; k <objI.Length; k++)\nWeights[k]\
  \ += t1 * objI[k] + t2 * objJ[k];\n}\n清单 9-13\nLFunctionValue() 方法，用于计算目标函数的值，以及\
  \ Kernel 类\n```\n\n现在我们已经实现了整个 SMO 算法，让我们看看该算法得到的分类超平面结果，使用之前用过的相同图形工具（Windows Forms\
  \ 应用程序，图 9-11）。\n\n\n\n![A449374_1_En_9_Fig11_HTML.jpg](img/A449374_1_En_9_Fig11_HTML.jpg)\n\
  \n图 9-11\n\n通过我们实现的 SMO 算法获得的分类超平面\n\n本章中读者心中必然萦绕的最后一个问题是：如何将 SVM 用于多类别分类？如何从一组\
  \ n 个类别中对新输入的数据进行分类或标记？这个问题被称为**多类 SVM**，本书不会详细讨论，因为它涉及的方法最终都依赖于二元 SVM 分类器；我们仅对其做一般性概述。\n\
  \n多类 SVM 分类的方法有很多。两种并非 SVM 特有的经典方案是：\n\n*   **一对多分类（OVA）**：假设有类别 A、B、C 和 D。我们不进行四路分类，而是训练四个不同的二元分类器：A\
  \ 与 非(A)、B 与 非(B)、C 与 非(C)、D 与 非(D)，从而得到四个超平面。然后，对于任何新输入的数据，选择在计算 wx + b 时给出最大值的超平面所对应的类别。\n\
  *   **全配对分类**：训练所有可能的分类配对。根据某种因素（例如被选中的次数）对类别进行排序，并选出最佳类别。\n\n多类 SVM 仍然是一个持续的研究课题，大多数提出的方法通常是通过组合多个二元分类器来构建的。有些方法也会同时考虑所有类别。由于解决多类问题的计算成本更高，因此尚未在大规模问题上对这些方法进行严肃的比较。特别是对于一步解决多类\
  \ SVM 的方法，需要解决一个规模大得多的优化问题，因此迄今为止的实验仅限于小数据集。\n\n至此，我们关于 SVM 的章节就结束了；现在，读者可以自行改进本文提出的\
  \ C# SVM，将其用作实验工具或根据自身需求进行定制。\n\n## 总结\n\n在本章中，我们描述了支持向量机（SVM）这一非常有趣的主题，将其作为面向解决特定机器学习问题（分类问题）的优化工具。我们主要关注二元分类，尽管在最后几段我们简要提及了一些多类方法。我们展示了如何使用\
  \ Accord .NET 库直接求解 SVM 的对偶优化问题，并且还解释并实现了序列最小优化（SMO）算法。我们包含了一个使用 Windows Forms 开发的图形应用程序，该程序利用\
  \ OxyPlot 使我们能够显示问题的超平面和数据点。\n\n"
- "# 10. 决策树\n\n数据挖掘是从大型数据集中发现并提取有意义、有用信息（模式）的过程。许多数据挖掘技术继承自人工智能，特别是机器学习及其子领域监督学习；在这些技术中，分类技术是其中之一。\n\
  \n分类是数据挖掘中的一项常见任务，它解决广泛的现实世界问题，例如欺诈检测、垃圾邮件检查、信用评分、破产预测、医疗诊断、模式识别、多媒体分类等。它被认为是公司基于决策模型开发有效知识以获得竞争优势的强大方法。在上一章中，我们学习了第一个分类器——支持向量机。在本章中，我们将介绍一种流行的分类器，它为我们提供了一种非常直观的方式来对一组项目进行分类：决策树。\n\
  \n在本章中，我们将介绍决策树（DT），描述其目的以及如何实现该目的。我们将介绍两种最流行的 DT 生成算法：ID3（迭代二分器 3）和 C4.5，后者是前者的扩展，包含多项重大改进。ID3\
  \ 和 C4.5 均由 J. Ross Quinlan 开发。\n\n此外，正如我们迄今为止所做的那样，我们将使用 Microsoft Automatic Graph\
  \ Layout 在 Windows Forms 中开发一个图形应用程序，以图形方式表示执行算法后获得的 DT。\n\n注意\n\nMicrosoft Automatic\
  \ Graph Layout (MSAGL) 是一个用于图形布局和查看的 .NET 工具。它由微软的 Lev Nachmanson、Sergey Pupyrev、Tim\
  \ Dwyer 和 Ted Hart 开发。使用 MSAGL，我们可以构建树和图，可以标记边和节点，甚至可以定义边的方向。除此之外，它还提供了许多其他功能，我们邀请读者自行探索。\n\
  \n\n\n## 什么是决策树？\n\n决策树（DT）是决策过程的图形化表示，具有高表达能力且易于人类理解。与支持向量机类似，DT 使用超平面将决策空间划分为不同类别（图\
  \ 10-1）。\n\n![A449374_1_En_10_Fig1_HTML.jpg](img/A449374_1_En_10_Fig1_HTML.jpg)\n\
  \n图 10-1\n\n使用 DT 创建的划分\n\n作为一棵树，DT 由**根节点**、多个**内部节点**和**叶节点**组成，这些节点最终决定新输入数据的分类。由于\
  \ DT 是从监督学习算法中获取的数据结构，这些算法接收一组训练数据作为输入，并输出一个函数（DT 可视为多元函数），用于对新输入数据进行分类。\n\n与 SVM\
  \ 或神经网络等其他算法不同，DT 会考虑并使用训练数据集中的属性名称集合，因为它们后续会利用这些名称来构建树。DT 中的每个节点都标有某个属性名称，从该节点出发的边则标有相应的属性值（假设这些值是离散且分类的）；叶节点标有目标属性值。因此，属性集可分为非目标属性和目标属性，其中\
  \ |目标| = 1。表 10-1 展示了若干属性及其对应值。\n\n表 10-1\n\n属性及其值\n\n| 属性 | 类型 | 值 |\n| --- | ---\
  \ | --- |\n| 天气 | 非目标 | 晴天，雨天，多云 |\n| 温度 | 非目标 | 温暖，寒冷，温和 |\n| 湿度 | 非目标 | 高，正常 |\n\
  | 风力 | 非目标 | 强，弱 |\n| 打棒球 | 目标 | 是，否 |\n\n表 10-2 展示了一个训练数据集的示例。\n\n表 10-2\n\n训练数据集\n\
  \n| 天气 | 温度 | 湿度 | 风力 | 打棒球 |\n| --- | --- | --- | --- | --- |\n| 晴天 | 温暖 | 高 |\
  \ 弱 | 否 |\n| 晴天 | 温暖 | 高 | 强 | 否 |\n| 多云 | 温暖 | 高 | 弱 | 是 |\n| 雨天 | 温和 | 高 | 弱 |\
  \ 是 |\n| 雨天 | 寒冷 | 正常 | 弱 | 是 |\n| 雨天 | 寒冷 | 正常 | 强 | 否 |\n| 多云 | 寒冷 | 正常 | 强 |\
  \ 是 |\n| 晴天 | 温和 | 高 | 弱 | 否 |\n| 晴天 | 寒冷 | 正常 | 弱 | 是 |\n| 雨天 | 温和 | 正常 | 弱 | 是\
  \ |\n| 晴天 | 温和 | 正常 | 强 | 是 |\n| 多云 | 温和 | 高 | 强 | 是 |\n| 多云 | 温暖 | 正常 | 弱 | 是 |\n\
  | 雨天 | 温和 | 高 | 强 | 否 |\n\n应用诸如 ID3 等学习方法，并使用表 10-2 中给出的训练数据集，可能得到如下 DT（图 10-2）。\n\
  \n![A449374_1_En_10_Fig2_HTML.jpg](img/A449374_1_En_10_Fig2_HTML.jpg)\n\n图 10-2\n\
  \n与表 10-2 训练数据匹配并使用 MSAGL 创建的 DT 图形\n\n一旦我们有了 DT，问题就是：如何对新输入数据进行分类？要对新数据进行分类，我们只需遍历这棵树，并将数据向量中的每个属性与其在新输入数据向量中的对应值进行匹配。例如，假设\
  \ x 是一条新输入数据，且\n\nX = (多云, 温暖, 正常, 强)\n\n那么，为了寻找 X 的分类，我们从根节点（天气）开始遍历树。因为 X 中的天气等于“多云”，我们沿着那条边前进，最终到达叶节点“是”，这意味着在\
  \ X 的条件或值下，打棒球 = 是。\n\n到目前为止，我们了解了 DT 的目的（分类），知道了它们的样子，也知道了在拥有 DT 后如何对新数据进行分类（从根节点遍历树，将输入数据与属性名称匹配）。在下一节中，我们将探讨如何生成\
  \ DT，并识别生成 DT 时可能出现的一些问题（例如过拟合）。\n\n注意\n\n如果我们从根节点到叶节点遍历 DT，就会得到一组描述决策过程的决策规则；例如，天气\
  \ = 晴天 且 湿度 = 正常 => 打棒球 = 是。每条决策规则由多个陈述的合取组成。\n\n\n\n## 生成决策树：ID3 算法\n\n构建最优决策树是监督学习中的一个关键问题。通常，从给定的属性集中可以构建出多个决策树。虽然有些树比其他树更准确，但由于搜索空间呈指数级增长，寻找最优树的问题在计算上是不可行的。\n\
  \n大多数为学习决策树而开发的算法都是核心算法（亨特算法）的变体，该算法采用自顶向下、贪心的方式在可能的决策树空间中进行搜索。亨特算法通过将训练数据集递归地划分为更细粒度的子集来生长决策树。假设\
  \ `TrainingData` 表示节点 N 处的当前训练数据集（仅考虑与非目标属性匹配的列），那么亨特算法的伪代码将遵循以下步骤：\n\n1.  如果 `TrainingData`\
  \ 包含的所有记录都属于同一类别 C，则 N 将是一个标记为 C 的叶节点。\n2.  如果 `TrainingData` 是一个空集，则 N 将是一个叶节点，标记为最常见的类别\
  \ C。请记住，`TrainingData` 仅包含非目标属性列；因此，C 取自目标属性列。\n3.  如果 `TrainingData` 包含属于多个类别的记录，则使用一个测试来选择用于将数据分割成更小子集的属性，并继续在每个子集上递归地应用相同的过程。\n\
  \nID3 算法使用了与亨特算法相同的思路；事实上，如果我们查看 ID3 的伪代码，它几乎与亨特算法的伪代码相同。主要区别在于属性分割测试。ID3 使用信息增益和熵的概念来选择具有最高信息增益的属性，然后，如同亨特算法中那样，创建一个以该属性名称标记的新节点。接着，它创建从该新节点出发的边，每个选定属性的值对应一条边，并在每条新边上继续递归。\n\
  \n注意\n\n熵和信息增益是源自信息论的概念，信息论是一门科学领域，其起源可追溯到被称为“信息时代之父”的克劳德·香农在 1948 年发表的一篇论文。它是一门关于数据操作（如压缩、存储、统计信号处理和通信）的科学。\n\
  \n生成决策树时需要考虑的一个重要点是训练数据集的大小。回顾一下，学习可以被视为逼近一个最能描述训练数据集的函数。这不仅仅发生在机器学习领域，在人类现实生活中也是如此。当我们学习驾驶时，我们学习一个函数，该函数通过某人（教练）提供的一组数据来描述给我们；这些数据包括：你不能撞到人，你不能在红灯时继续行驶，你必须遵守规定的限速，你这样操作方向盘，你用这个装置刹车，等等。利用这些数据，我们最终学会了一个过程或函数，它允许我们在接收到“驾驶”函数的输入（如“红灯”或“街上有人”）后，采取一个行动或输出（如“停车”、“继续”）。合理地，我们接收到的数据质量越高，我们就越能更好地学习逼近该训练数据集所属的函数。在图\
  \ 10-3 中，我们可以看到一张描述训练数据集大小与生成的决策树所提供的预测质量之间关系的图表。如前所述，训练数据集越大，正确逼近其所属函数的机会就越高。\n\
  \n![A449374_1_En_10_Fig3_HTML.jpg](img/A449374_1_En_10_Fig3_HTML.jpg)\n\n图 10-3\n\
  \n描述预测质量如何随着训练数据集大小的增加而提高的图表\n\n在下一小节中，我们将探讨熵和信息增益这两个概念背后的思想，这两个概念源自信息论，构成了 ID3\
  \ 及其后续算法中使用的分割标准。\n\n### 熵与信息增益\n\n熵是混沌和不确定性的度量；高熵意味着高度无序或混沌，而低熵意味着低不确定性或混沌（图 10-4）。熵函数通常表示为\
  \ H(x)，其中 x 是一个包含概率的向量；即，![ $$ \\mathrm{x}={\\mathrm{p}}_1,{\\mathrm{p}}_2,\\dots,\
  \ {\\mathrm{p}}_{\\mathrm{n}} $$ ](img/A449374_1_En_10_Chapter_IEq1.gif)。\n\n![A449374_1_En_10_Fig4_HTML.jpg](img/A449374_1_En_10_Fig4_HTML.jpg)\n\
  \n图 10-4\n\n熵函数\n\n观察图 10-4，我们可以看到当概率 p[i] 处于中间值时会发生什么；即，大约为 0.5。在这种情况下，我们得到高熵（接近\
  \ 1）。由于每个 p[i] 都存在高度不确定性，因为它们的概率接近 0.5（或 50% 的几率），这意味着它们可能均匀地（以相同概率）发生或不发生，那么全局的不确定性或混沌也会很高。当每个\
  \ p[i] 接近 0 或 1 时，它们的熵会很低，因为元素概率表明发生几率低或高，从而降低了不确定性。熵函数如下：\n\n![ $$ \\mathrm{H}\\\
  left(\\mathrm{X}\\right)=\\mathrm{H}\\left(\\left[{\\mathrm{p}}_1,\\dots, {\\mathrm{p}}_{\\\
  mathrm{n}}\\right]\\right)=-\\sum \\limits_{\\mathrm{i}=1}^{\\mathrm{n}}\\kern0.38em\
  \ {\\mathrm{p}}_{\\mathrm{i}}\\ast {\\log}_2{\\mathrm{p}}_{\\mathrm{i}} $$ ](A449374_1_En_10_Chapter_Equa.gif)\n\
  \n它满足以下一组性质：\n\n1.  ![ $$ \\mathrm{H}\\left(\\mathrm{X}\\right)=\\mathrm{H}\\left(\\\
  left[{\\mathrm{p}}_1,\\dots, {\\mathrm{p}}_{\\mathrm{n}}\\right]\\right)\\ge 0 $$\
  \ ](A449374_1_En_10_Chapter_IEq2.gif)。\n2.  如果存在某个 ![ $$ {\\mathrm{p}}_{\\mathrm{i}}=1\
  \ $$ ](img/A449374_1_En_10_Chapter_IEq4.gif)，则 ![ $$ \\mathrm{H}\\left(\\mathrm{X}\\\
  right)=\\mathrm{H}\\left(\\left[{\\mathrm{p}}_1,\\dots, {\\mathrm{p}}_{\\mathrm{n}}\\\
  right]\\right)=0 $$ ](A449374_1_En_10_Chapter_IEq3.gif)。\n3.  ![ $$ \\mathrm{H}\\\
  left(\\mathrm{X}\\right)=\\mathrm{H}\\left(\\left[{\\mathrm{p}}_1,\\dots, {\\mathrm{p}}_{\\\
  mathrm{n}}\\right]\\right)\\le \\mathrm{H}\\left(\\left[\\frac{1}{\\mathrm{n}},\\\
  dots, \\frac{1}{\\mathrm{n}}\\right]\\right) $$ ](A449374_1_En_10_Chapter_IEq5.gif)，最大的熵对应于等概率情况。\n\
  4.  ![ $$ \\mathrm{H}\\left(\\mathrm{X}\\right)=\\mathrm{H}\\left(\\left[{\\mathrm{p}}_1,\\\
  dots, {\\mathrm{p}}_{\\mathrm{n}},0\\right]\\right)=\\mathrm{H}\\left(\\left[{\\\
  mathrm{p}}_1,\\dots, {\\mathrm{p}}_{\\mathrm{n}}\\right]\\right). $$ ](A449374_1_En_10_Chapter_IEq6.gif)\n\
  \n回到 ID3 算法，我们在分割树时的目标是选择能够实现熵（无序、混沌、不确定性）最大程度降低的属性。我们如何衡量这种预期的降低？我们使用一个源自信息论的概念，称为信息增益，其公式如下：\n\
  \n![ $$ \\mathrm{G}\\left(\\mathrm{S},\\mathrm{A}\\right)=\\mathrm{H}\\left(\\mathrm{S}\\\
  right)-\\sum \\limits_{\\mathrm{v}\\in \\mathrm{Values}\\left(\\mathrm{A}\\right)}\\\
  frac{\\mid {\\mathrm{S}}_{\\mathrm{A}=\\mathrm{v}}\\mid }{\\mid \\mathrm{S}\\mid}\\\
  ast \\mathrm{H}\\left({\\mathrm{S}}_{\\mathrm{A}=\\mathrm{v}}\\right) $$ ](img/A449374_1_En_10_Chapter_Equb.gif)\n\
  \n其中，S 是决策树中当前节点的训练数据集，Values(A) 表示对应于属性 A 的值集，而 ![ $$ {\\mathrm{S}}_{\\mathrm{A}=\\\
  mathrm{v}} $$ ](img/A449374_1_En_10_Chapter_IEq7.gif) 是 S 中属性 A 的值等于 v 的子集。\n\n\n\
  \n信息增益可以定义为由于按属性 A 排序而导致 S 中熵的预期减少量。它回答了这样一个问题：如果我们选择属性 A，结果集将如何形成或排序？增益的计算方式是整个集合\
  \ S 的熵减去 S 中 A=v 的概率之和；即 (![ $$ \\frac{\\mid {\\mathrm{S}}_{\\mathrm{A}=\\mathrm{v}}\\\
  mid }{\\mid \\mathrm{S}\\mid } $$ ](img/A449374_1_En_10_Chapter_IEq8.gif)) 乘以子集\
  \ ![ $$ {\\mathrm{S}}_{\\mathrm{A}=\\mathrm{v}} $$ ](img/A449374_1_En_10_Chapter_IEq9.gif)\
  \ 的熵。\n\n这是 ID3 算法用于选择分裂树属性的测试标准，它将选择提供最高增益的那个属性。现在我们已经收集了构建 ID3 算法所需的所有必要部分，从下一节开始，我们将深入探讨实现问题，并用\
  \ C#开发我们的 ID3 方法。\n\n注意\n\n理想的属性会将训练数据集划分为全部为正例或全部为负例（相对于目标属性）的子集；即提供最大信息增益。\n\n\
  ### 实际问题：实现 ID3 算法\n\n为了开始实现我们的 ID3 算法，我们首先创建两个类（清单 10-1）来处理属性和训练数据集。\n\n```\npublic\
