  \ || Role == ContractRole.Manager && TaskDistributed)\n{\nAreaTobeCleaned = SetSocialLaw(_messageBoardWin.Messages);\n\
  }\nif (Role == ContractRole.Contractor && !AwaitingTaskAssignment)\n{\nThread.Sleep(2000);\n\
