  \ Queue();\nqueue.Enqueue(this);\ngraph.CreateLayoutSettings().EdgeRoutingSettings.EdgeRoutingMode\
  \ = EdgeRoutingMode.StraightLine;\nvar id = 0;\nwhile (queue.Count> 0)\n{\nvarcurrentNode\
  \ = queue.Dequeue();\nNode firstEnd;\nif (graph.Nodes.Any(n =>n.LabelText == currentNode.Value))\n\
  firstEnd = graph.Nodes.First(n =>n.LabelText == currentNode.Value);\nelse\nfirstEnd\
  \ = new Node((id++).ToString()) { LabelText = currentNode.Value };\ngraph.AddNode(firstEnd);\n\
  foreach (vardecisionTree in currentNode.Children)\n{\nvarsecondEnd = new Node((id++).ToString())\
  \ { LabelText = decisionTree.Value };\ngraph.AddNode(secondEnd);\ngraph.AddEdge(firstEnd.Id,\
  \ decisionTree.Edge, secondEnd.Id);\nqueue.Enqueue(decisionTree);\n}\n}\n}\n}\n\
  public enumDtTrainingAlgorithm\n{\nId3,\n}\n清单 10-2\nDecisionTree 类\n```\n\n该类包含以下属性：\n\
  \n*   `Dataset`：此方法接收训练数据集作为输入，同时也接收学习阶段使用的学习算法类型。\n*   `Value`：定义代表此决策树根节点的值\n\
  *   `Children`：定义当前决策树的子节点集合\n*   `Edge`：以字符串形式定义连接此节点与其父节点的边的标签\n\n此外，`DecisionTree`\
  \ 类包含以下方法：\n\n*   `Learn()`：此方法接收训练数据集作为输入，同时也接收学习阶段使用的学习算法类型。\n*   `Visualize()`：此方法使用\
  \ MSAGL 图形工具在学习阶段完成后可视化生成的树。\n*   `CreateNodes()`：此方法执行 BFS 算法来遍历由 ID3 算法创建的决策树，并在遍历过程中使用\
  \ MSAGL 工具创建一个带有标签的等效树。\n\nID3 算法及其支持方法（均属于`DecisionTree`类）如图 10-3 所示。\n\n\n\n```\n\
  public static DecisionTree Id3(string [,] values, List attributes, string edge)\n\
  {\n// 所有训练数据具有相同的目标属性\nvargoalValues = values.GetColumn(values.GetLength(1) - 1);\n\
  if (goalValues.DistinctCount() == 1)\nreturn new DecisionTree(goalValues.First(),\
  \ edge);\n// 不存在非目标属性\nif (attributes.Count == 0)\nreturn new DecisionTree(goalValues.GetMostFrequent(),\
  \ edge);\n// 将信息增益最高的属性设为根节点\nvarattrIndexPair = HighestGainAttribute(values, attributes);\n\
  varattr = attrIndexPair.Item1;\nvarattrIndex = attrIndexPair.Item2;\nvar root =\
  \ new DecisionTree(attr.Name, edge);\nforeach (var value in attr.Values)\n{\nvarsubSetVi\
  \ = values.GetRowIndex(attrIndex, value, ComparisonType.Equality);\nif (subSetVi.Count\
  \ == 0)\nroot.Children.Add(new DecisionTree(goalValues.GetMostFrequent(), value));\n\
  else\n{\nvarnewAttrbs = new List(attributes);\nnewAttrbs.RemoveAt(attrIndex);\n\
  varnewValues = values.GetMatrix(subSetVi).RemoveColumn(attrIndex);\nroot.Children.Add(Id3(newValues,\
  \ newAttrbs, attr.Name + \" : \" + value));\n}\n}\nreturn root;\n}\nprivate static\
  \ TupleHighestGainAttribute(string [,] values, IEnumerable attributes)\n{\nAttribute\
  \ result = null;\nvarmaxGain = double.MinValue;\nvar index = -1;\nvari = 0;\nforeach\
  \ (varattr in attributes)\n{\ndouble gain = Gain(values, i);\nif (gain >maxGain)\n\
  {\nmaxGain = gain;\nresult = attr;\nindex = i;\n}\ni++;\n}\nreturn new Tuple(result,\
  \ index);\n}\nprivate static double Gain(string [,] values, intattributeIndex)\n\
  {\nvarimpurityBeforeSplit = Entropy(values.GetFreqPerDistinctElem(values.GetLength(1)\
  \ - 1).GetProbabilities());\nvarimpurityAfterSplit= SubsetEntropy(values, attributeIndex);\n\
  return impurityBeforeSplit - impurityAfterSplit;\n}\nprivate static double Entropy(IEnumerableprobs)\n\
  {\nreturn -1 * probs.Sum(d =>LogEntropy(d));\n}\nprivate static double LogEntropy(double\
  \ p)\n{\nreturn p >0 ? p * Math.Log(p, 2) : 0;\n}\nprivate static double SubsetEntropy(string[,]\
  \ values, intcolumnIndex)\n{\nvarfreqDicc = values.GetFreqPerDistinctElem(columnIndex);\n\
  var result = 0.0;\nvar sum = freqDicc.Values.Sum();\nforeach (var key in freqDicc.Keys)\n\
  {\nvarrowIndex = values.GetRowIndex(columnIndex, key, ComparisonType.Equality);\n\
  varfrequencyPerClass = values.GetFreqPerDistinctElem(values.GetLength(1) - 1, rowIndex.ToArray());\n\
  result += (freqDicc[key] / (double) sum) * Entropy(frequencyPerClass.GetProbabilities());\n\
  }\nreturn result;\n}\n}\n代码清单 10-3\nID3 算法\n```\n\n在代码清单 10-3 中，我们使用了多个扩展方法，其中一些属于\
  \ Accord .NET 包，另一些属于我们创建的扩展类，用于支持 ID3 算法中必须处理的某些操作。如果将这些操作直接包含在方法代码中，会降低代码的可理解性、可读性和清晰度。此外，由于类中的每个方法都具有自描述性，并且与之前展示的伪代码相匹配，我们将重点解释代码清单\
  \ 10-4 中展示的扩展方法；这些方法属于一个扩展类。\n\n```\npublic static string GetMostFrequent(this string[]\
  \ values)\n{\nvardicc = new Dictionary();\nforeach (var v in values)\n{\nif (!dicc.ContainsKey(v))\n\
  dicc.Add(v, 1);\nelse\ndicc[v] += 1;\n}\nvarmaxVal = dicc.Max(e =>e.Value);\nreturn\
  \ dicc.First(p =>p.Value == maxVal).Key;\n}\npublic static DictionaryGetFreqPerDistinctElem(this\
  \ string [,] values, intcolumnIndex, int [] rowIndex = null )\n{\nvarfreqDicc =\
  \ new Dictionary();\nfor (vari = 0; iGetRowIndex(this string[,] values, intcolumnIndex,\
  \ string toCompare, ComparisonTypecomparisonType)\n{\nvar result = new List();\n\
  for (vari = 0; idouble.Parse(toCompare))\nresult.Add(i);\nbreak;\n}\n}\nreturn result;\n\
  }\npublic static string[,] GetMatrix(this string[,] values, ListrowIndex)\n{\nvar\
  \ result = new string[rowIndex.Count, values.GetLength(1)];\nvar j = 0;\nforeach\
  \ (vari in rowIndex)\n{\nresult.SetRow(j, values.GetRow(i));\nj++;\n}\nreturn result;\n\
  }\npublic static IEnumerableGetProbabilities(this Dictionarydicc)\n{\nvar probabilities\
  \ = new List();\nvar sum = dicc.Values.Sum();\nforeach (var e in dicc)\nprobabilities.Add((e.Value\
  \ / (double) sum));\nreturn probabilities;\n}\npublic enumComparisonType\n{\nEquality,\
  \ NumericGreaterThan, NumericLessThan\n}\n代码清单 10-4\n扩展方法\n```\n\n上述扩展方法的详细说明如下：\n\
  \n*   `GetMostFrequent()`：返回作为参数接收的字符串数组中出现频率最高的元素；`string []` 的扩展方法\n*   `GetFreqPerDistinctElem()`：返回指定列和指定行集（可选参数）中元素的频率（出现次数）；`string\
  \ [,]` 的扩展方法\n*   `GetRowIndex()`：返回满足比较条件的行索引集合，这些行在作为参数接收的列索引处的值满足由 `ComparisonType`\
  \ 定义的比较标准，并考虑作为参数传入的比较字符串；`string [,]` 的扩展方法\n*   `GetMatrix()`：返回一个新矩阵，仅包含原始矩阵中索引与作为参数接收的列表中的整数相匹配的行。它使用属于\
  \ Accord .NET 的 `SetRow()` 方法；`string [,]` 的扩展方法\n*   `GetProbabilities()`：返回输入字典中每个元素\
  \ x 的概率，计算公式为 value(x) / total(S)，其中 total(S) 是输入字典中所有元素值的总和；`Dictionary<string,\
  \ int>` 的扩展方法\n\n现在我们已经详细介绍了 ID3 实现的每个组成部分，接下来让我们看看如何通过在控制台应用程序中包含代码清单 10-5 中所示的代码来测试我们的算法。\n\
