  \ 13-7 所示。请注意，在这种情况下，我们得到了三个容易区分的组，如图所示。\n\n![A449374_1_En_13_Fig7_HTML.jpg](img/A449374_1_En_13_Fig7_HTML.jpg)\n\
  \n图 13-7\n\nk = 3 时 k-means 算法的执行结果\n\n到目前为止，我们研究了单目标聚类算法，即优化单个目标函数的算法。在 k-means\
  \ 的情况下，这个目标函数是误差平方和，也称为类内距离（最小化组内对象之间的距离）。我们可能尝试优化的另一个函数是类间函数（最大化不同组对象之间的距离）。在下一节中，我们将开始研究多目标聚类，其中我们不仅考虑优化单个函数，而是考虑多个函数，并尝试同时优化它们。\n\
  \n\n\n## 多目标聚类\n\n如今，许多现实问题迫使我们不仅要考虑给定函数的最佳可能值，还要考虑与当前问题相关的多个函数的值。例如，属于城市研究领域的区划技术，首次出现于\
  \ 19 世纪，旨在将住宅区与工业区分隔开来。这种城市化中最流行的技术，其主要思想是根据多个变量或标准，划分出同质区域。这些变量可能是人口统计方面的——例如，20\
  \ 岁以上的人口数量、10 岁以下的人口数量，等等。找到这样的划分显然是一个涉及优化不同函数的聚类问题。因此，我们可能试图找到一个具有最低类内距离（也称为紧致性）的聚类，同时优化类间距离或任何其他函数，这些函数很可能本质上是人口统计相关的。一个完美的聚类是同时具有最小类内距离和最大类间距离的聚类；因此，可以说聚类本质上是一个多目标优化问题。本节我们将首先探讨与多目标聚类相关的几个重要概念或定义。\n\
  \n许多优化问题通常涉及同时优化多个目标函数；这类问题被称为多目标优化问题（MOPs）。它们可以表述如下：\n\n![ $$ {\\displaystyle \\\
  begin{array}{l}\\operatorname{minimize}\\kern0.38em \\ \\mathrm{F}\\left(\\mathrm{x}\\\
  right)=\\left({\\mathrm{f}}_1\\left(\\mathrm{x}\\right),{\\mathrm{f}}_2\\left(\\\
  mathrm{x}\\right),\\dots, {\\mathrm{f}}_{\\mathrm{n}}\\left(\\mathrm{x}\\right)\\\
  right)\\\\ {}\\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\\
  \ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\ \\mathrm{x}\\in \\mathrm{A}\\\
  end{array}} $$ ](img/A449374_1_En_13_Chapter_Eque.gif)\n\n在这种情况下，A 代表问题的可行空间——即所有可行解的集合，这些解满足问题的所有约束条件。\n\
  \n如果一个向量 ![ $$ \\mathrm{u}=\\left({\\mathrm{u}}_1,{\\mathrm{u}}_2,\\dots {\\mathrm{u}}_{\\\
  mathrm{n}}\\right) $$ ](img/A449374_1_En_13_Chapter_IEq1.gif) 被另一个向量 ![ $$ \\mathrm{v}=\\\
  left({\\mathrm{v}}_1,{\\mathrm{v}}_2,\\dots {\\mathrm{v}}_{\\mathrm{n}}\\right)\
  \ $$ ](img/A449374_1_En_13_Chapter_IEq2.gif) 所支配，记作 u < v，当且仅当对于所有索引 i，我们都能验证 ![\
  \ $$ {\\mathrm{u}}_{\\mathrm{i}}\\le {\\mathrm{v}}_{\\mathrm{i}} $$ ](img/A449374_1_En_13_Chapter_IEq3.gif)。在任何其他情况下，u\
  \ 被称为非支配向量。请注意，“支配”关系取决于我们是要最小化还是最大化目标函数；请记住，我们总是可以将最小化问题转化为最大化问题，反之亦然。\n\n拥有多个目标意味着一个显著的问题——一个目标函数的改进可能导致另一个目标函数的恶化。因此，几乎不存在能优化所有目标的解；我们寻找的是一种权衡方案，而非那种解。帕累托最优解就代表了这种权衡。\n\
  \n一个可行解 x 被称为帕累托最优，如果不存在解 y 使得 F(x) < F(y)。换句话说，不存在解向量 y，其评估向量 (f1, f2, … fn) 能够支配\
  \ x 的评估向量 (f1, f2, … fn)。所有帕累托最优解的集合称为帕累托集，其像称为帕累托前沿。大多数多目标优化问题算法的目标是为给定问题构建一个帕累托前沿；这类方法通常是启发式或元启发式算法（我们将在下一章中探讨它们）。\n\
  \n注意\n\n帕累托最优性是一个以维尔弗雷多·帕累托（1848–1923）命名的概念，他是一位意大利工程师和经济学家。该概念已被应用于经济学、工程学和生命科学等学术领域。\n\
  \n\n\n## 帕累托前沿构建器\n\n通过查阅科学文献，我们可以找到多种发现帕累托前沿的方法。在本书中，我们将介绍作者独创的一种方法，名为帕累托前沿构建器。它适用于双目标优化——即你需要优化两个函数的情况。这种二元情况非常适合聚类问题，因为存在两个函数（类内和类间）可以为我们提供最优解。\n\
  \n对于二元情况，两个函数与帕累托前沿之间的关系可以如图 13-8 所示。\n\n![A449374_1_En_13_Fig8_HTML.jpg](img/A449374_1_En_13_Fig8_HTML.jpg)\n\
  \n图 13-8\n\n蓝色点构成帕累托前沿，红色点被蓝色点支配；因此，它们不被视为帕累托前沿的一部分。这是一个最小化问题。\n\n前沿构建器方法的策略分为不同阶段。其主要思想是按区域构建帕累托前沿，如图\
  \ 13-9 所示。\n\n![A449374_1_En_13_Fig9_HTML.jpg](img/A449374_1_En_13_Fig9_HTML.jpg)\n\
