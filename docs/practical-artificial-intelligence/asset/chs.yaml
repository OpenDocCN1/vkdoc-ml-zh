  \ C4.5 算法时探讨连续属性。\n\n`TrainingDataSet` 类包含以下属性和字段：\n\n*   `Values`：详细描述训练数据集值的矩阵\n\
  *   `GoalAttribute`：定义训练数据集的目标属性\n*   `NonGoalAttribute`：定义非目标属性的集合\n\n正如我们所见，`TrainingDataSet`\
  \ 类依赖于 `Attribute` 类；`DecisionTree` 类的第一部分如清单 10-2 所示。\n\n```\npublic class DecisionTree\n\
  {\npublic TrainingDataSetDataSet{ get; set; }\npublic string Value { get; set; }\n\
