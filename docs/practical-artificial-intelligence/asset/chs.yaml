  \ = true;\n}\nif (Role == ContractRole.Manager && !AnnouncementMade)\n{\nContractNet.Announcement(Platform.Task,\
  \ Platform.Manager, Platform.Contractors,\nLanguage);\nAnnouncementMade = true;\n\
