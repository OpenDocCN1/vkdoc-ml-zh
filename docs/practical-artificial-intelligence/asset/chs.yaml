  \ = new And(f1, f2);\nvarnnf = formula.ToNnf();\nConsole.WriteLine(\"NNF: \" + nnf);\n\
  nnf = nnf.ToCnf();\nvarcnf = new Cnf(nnf as And);\ncnf.SimplifyCnf();\nConsole.WriteLine(\"\
  CNF: \" + cnf);\nConsole.WriteLine(\"SAT: \" + cnf.Dpll());\n列表 2-10\n创建公式 (p ∨\
  \ q) ∧ (p ∨ ¬q) ∧ (¬p ∨ q) ∧ (¬p ∨ ¬r) 并使用 DPLL 算法判断其是否可满足\n```\n\n执行此代码后获得的结果如图\
