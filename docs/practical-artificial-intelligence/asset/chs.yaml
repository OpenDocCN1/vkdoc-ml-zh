  请注意，我们的寻路算法返回的计划（动作序列）或路径用黄色表示，目的是让我们更容易理解探测车要去哪里以及为什么。在这种情况下，探测车正在追踪其最近的水源位置信念。一旦到达那里（图
  4-6），它发现自己的信念是错误的，目标位置没有水，因为在该水源位置信念相邻的单元格中没有障碍物。好消息是，在探索该区域时，探测车感知到附近有一个水源位置（在其感知圈内），因此它冒险前往那里以了解更多信息。


