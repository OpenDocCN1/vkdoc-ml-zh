  \n图 10-5\n\n执行控制台应用程序后得到的决策树\n\n至此，我们已经涵盖了决策树的基础知识，解释了 ID3 算法的工作原理，并介绍了一个实现 ID3\
  \ 算法的实际问题。在接下来的章节中，我们将解释 ID3 算法的一些难点或缺点，以及其改进版本 C4.5 算法如何克服这些困难，通过应用剪枝技术来处理缺失值和值可以是连续而非离散的属性，从而提供更高效的决策树。\n\
  \n### C4.5 算法\n\nC4.5 算法（Quinlan, 1993）是对 ID3 算法缺陷的扩展或增强。其改进主要体现在三个要点：处理连续属性（请记住\
  \ ID3 仅处理分类属性）、处理缺失值，以及通过最终对树进行剪枝来解决过拟合问题。\n\n过拟合是指生成的决策树对训练数据集拟合得过于完美时出现的问题。其结果是，决策树最终对新输入数据的预测效果很差，因为它对已学习的训练数据集建立了一种不恰当的依赖关系或过拟合结构。为了更好地理解过拟合问题，让我们考虑一个实验：我们想要预测掷骰子的结果，而训练数据集包含掷骰子的日期、时间以及骰子的颜色。这里可能发生的情况是，学习器构建了一棵拟合数据的决策树，但考虑了诸如颜色等与结果无关的属性。这种情况通常出现在包含大量属性或特征的数据中。当处理拥有大量属性的训练数据或对象时，我们可能会发现许多无意义的属性，这些属性与最终决定后续数据结果的真正重要属性相比是无关的。\n\
  \n我们该如何处理这个问题？存在两种主要方法来应对过拟合问题。第一种方法是在生成过程的早期阶段，在决策树达到能完美分类训练数据集之前，就停止树的生长。第二种方法是在树生成之后对其进行剪枝。第二种方法比第一种更成功，主要是因为知道何时停止树的生长可能是一项棘手的任务。一旦我们开始剪枝过程，一个基本问题是如何判断一个子树是否值得剪枝；换句话说，我们应该使用什么标准进行剪枝，以及应该如何执行这个过程？\n\
  \n尽管有多种策略来执行决策树的剪枝过程，但最流行的方法依赖于**交叉验证**，这是一种统计技术，它将训练数据集 S 划分为子集 S[1] 和 S[2]，然后使用第一个子集进行训练并生成决策树，使用第二个子集来测试生成的决策树在分类来自验证集\
  \ S[2] 的数据时的表现如何。交叉验证与一种**后剪枝**度量相结合，该度量可以评估生成的决策树在剪枝后的表现。最常见的度量是**错误率降低**和**规则剪枝**。\n\
  \n错误率降低准则的伪代码如下：\n\n*   使用决策树对验证集 S[2] 中的训练数据进行分类（图 10-6）。\n*   对于每个节点 X：\n    *\
  \   找出以 X 为根的整个子树的错误总和。\n    *   计算相同训练数据的错误，但此时 X 已被转换为叶节点，并分配了其所有后代中最常见的类别。\n\
  *   比较这两个值，并剪枝掉错误率降低最多的那个子树。\n*   重复此过程，直到错误不再降低。\n\n图 10-6 展示了一个子树，其中加号表示正确分类的训练数据，减号表示错误分类的训练数据。\n\
  \n![A449374_1_En_10_Fig6_HTML.jpg](img/A449374_1_En_10_Fig6_HTML.jpg)\n\n图 10-6\n\
  \n由决策树分类的包含 16 个训练数据的验证集。正数表示决策树正确分类的训练数据，负数表示分类错误\n\n\n\n错误减少措施通常与一种称为子树替换的子树简化操作或剪枝技术结合使用。在这种自底向上的方法中，决策树的每个内部节点都可能成为剪枝的候选节点，该方法仅在检查其子树后才会对树进行剪枝。从这个意义上说，如之前的伪代码所述，剪枝可以理解为删除决策树的一个子树，并用一个叶子节点替换它，该叶子节点的值对应于该子树所有叶子节点中出现频率最高的类别。\n\
  \n当生成的决策树在验证集 S[2] 上测试时，如果其表现不如之前的决策树，则该子树最终会被剪枝。决策树中的节点会被迭代地剪枝，始终选择那些能提高生成决策树在验证集上效率的节点。这将导致任何基于训练数据集学习时偶然出现的规律而创建的叶子节点，在验证集上复核时被剪枝，因为同样的偶然规律不太可能在验证集上也出现。\n\
  \n另一个标准是规则剪枝，它将学习到的决策树转换为一组规则，每条规则对应从根节点到叶子节点的一条可能路径。它包含以下步骤：\n\n*   使用决策树（图 10-6）对验证集\
  \ S[2] 中的训练数据进行分类。\n*   将学习到的决策树转换为一组规则，每条规则对应从根节点到叶子节点的一条可能路径。\n*   通过剪枝那些能提高其估计准确率的前置条件来剪枝或泛化每条规则。\n\
  *   根据估计准确率对剪枝后的规则进行排序，并在对新传入数据进行分类时按此顺序考虑它们。\n\n从这个意义上说，规则的前置条件代表从根节点到叶子节点的属性测试，而该叶子节点的值或分类则成为规则的后置条件或结果。例如，如果\
  \ (outlook = sunny ^ humidity = normal) 是一个前置条件，而 playBaseball = yes 是结果。之后，如果移除某个前置条件不影响剪枝前决策树的估计准确率，则通过移除该前置条件来剪枝每条规则。\n\
  \nC4.5 算法的另一个显著特征是它使用不同的度量标准来选择用于分裂的属性；它不使用信息增益，而是使用增益率，其公式如下：\n\n![ $$ \\mathrm{GainRatio}\\\
  left(\\mathrm{S},\\mathrm{A}\\right)=\\frac{\\mathrm{Gain}\\left(\\mathrm{S},\\\
  mathrm{A}\\right)}{\\mathrm{SplitInformation}\\left(\\mathrm{S},\\mathrm{A}\\right)}\
  \ $$ ](img/A449374_1_En_10_Chapter_Equc.gif)\n\n其中\n\n![ $$ \\mathrm{S}\\mathrm{plitInformation}\\\
  left(\\mathrm{S},\\mathrm{A}\\right)=-\\sum \\limits_{\\mathrm{i}=1}^{\\mathrm{n}}\\\
  frac{\\mid {\\mathrm{S}}_{\\mathrm{i}}\\mid }{\\mid \\mathrm{S}\\mid}\\ast {\\log}_2\\\
  frac{\\mid {\\mathrm{S}}_{\\mathrm{i}}\\mid }{\\mid \\mathrm{S}\\mid } $$ ](img/A449374_1_En_10_Chapter_Equd.gif)\n\
  \n其中 S[i] 是根据包含 n 个可能值的属性 A 对 S 进行划分后得到的子集。增益率度量克服了信息增益的缺点，信息增益的主要缺点是偏向于具有最多取值的属性。例如，考虑一个包含许多可能值的\
  \ Date 属性；由于这个集合的大小可能非常巨大，它很可能会将整个训练数据集划分成更小的子集，这些子集的熵会非常低；因此，信息增益会非常高。增益率会惩罚那些具有均匀分布的多个取值的属性。\n\
  \n处理连续属性是 C4.5 相对于其前身 ID3 的主要优势之一。为了处理连续属性，C4.5 将值的集合划分成一组离散的区间。它创建一个二元决策节点，将可能值的范围分成两个子集：满足\
  \ < X 的和满足 >= X 的，其中 X 是一个待确定的阈值。这个过程假设连续值的集合存在一个全序关系。关键点在于找到进行划分的阈值 X。最常见的方法是按升序对训练数据集的值进行排序；遍历排序后的值列表，同时比较连续元素\
  \ (i, i + 1) 的目标属性；当且仅当它们的目标属性不同时，计算阈值为这两个连续元素的平均值（即 X'=(L[i] + L[i+1])/2）；计算在阈值\
  \ X' 上划分属性所获得的信息增益（考虑小于 X' 和大于 X' 的元素子集）；并选择提供最高信息增益的那个阈值。请注意，我们仅在连续元素的类别不同时才考虑它们。如果连续元素\
  \ L[i] 和 L[i+1]（其中 L 是连续属性上排序后的值列表）都具有相同的类别 C，我们永远不会考虑它们（图 10-7）。\n\n![A449374_1_En_10_Fig7_HTML.jpg](img/A449374_1_En_10_Fig7_HTML.jpg)\n\
  \n图 10-7\n\n在增量排序值后，我们检查那些目标属性不同的连续值\n\n对于处理缺失值，存在不同的策略，并且该过程通常在任何决策树学习算法执行之前进行。最简单的策略是直接忽略缺失值，在计算熵时不考虑它们。一个更聪明的策略是将训练数据集中该属性最常见的值分配给缺失值。最后，一种更复杂的方法是为缺失属性\
  \ A 的每个可能值分配概率，然后根据计算出的每个概率在该节点上创建分支。例如，假设我们有一个二元属性 A，其值为 P、Q，该属性有十个已知值，其中六个为属性\
  \ P，四个为值 Q，那么这种方法将创建两个分支，一个对应属性值为 P 的 0.6 概率，另一个对应属性值为 Q 的概率。\n\n\n\n### 实践问题：实现\
  \ C4.5 算法\n\n在本节中，我们将展示 C4.5 算法的一个实现，该实现将包含处理连续属性和增益率度量等不同特性。剪枝技术和处理缺失值的策略将留给读者作为练习，同时也是对本文所提供代码的补充。从\
  \ ID3 迁移到 C4.5 的主要编码任务在于适应对连续值的处理；因此，我们将在本节中介绍这部分内容。\n\n正如预期的那样，ID3 和 C4.5 共享几乎相同的代码。基础条件相同，主要区别在于主体部分。代码清单\
  \ 10-6 展示了 C4.5 算法的入口点；请记住，此方法将添加到我们本章一直在开发的 `DecisionTree` 类中。\n\n```\npublic static\
  \ DecisionTreeC45(string [,] values, List attributes, string edge)\n{\n// 所有训练数据具有相同的目标属性\n\
  vargoalValues = values.GetColumn(values.GetLength(1) - 1);\nif (goalValues.DistinctCount()\
