  GoalAttribute = goal;\nif (NonGoalAttributes.Count + 1 != Values.GetLength(1))\n\
  throw new Exception(\"Number of attributes must coincide\");\n}\n}\n清单 10-1\nAttribute\
  \ 和 TrainingDataSet 类\n```\n\n`Attribute` 类包含以下字段和属性：\n\n*   `Name`：定义属性名称的属性\n\
