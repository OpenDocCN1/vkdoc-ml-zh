  注意


  在 `AirportEvent<T>` 类中，我们通过 `where` 关键字要求 `T` 参数必须是 `IComparable` 类型。我们需要这个前提条件，以便后续能够以最通用的方式对它们进行比较。


  `AirportEvent<T>` 类包含以下属性：


  *   `Parameters`：一个双精度浮点数数组，存储用于不同分布的 lambda 参数。

  *   `Frames`：一个类型为 `T` 的元组列表，定义了事件的时间范围或数值范围，对应于表 8-1 和 8-2 中所示的概率分布和参数。此列表的基数必须与
  `Parameters` 数组以及接下来要列出的两个属性的基数相匹配。

  *   `DistributionValues`：双精度浮点数数组，用于在索引 `i` 处存储使用 `Parameters` 数组中的参数 `i` 计算概率分布
  `i` 所得的值。

  *   `Distributions`：要使用的分布列表；在计算概率分布时，我们考虑某个参数 lambda，计算所得的值存储在 `DistributionValues`
  数组中。


  除了上述属性，该类还包含以下方法：


  *   `SetDistributionValues()`：根据作为参数传入的分布类型，向 `Distributions` 列表添加新的分布，并使用指定的 `Parameters`
  对这些分布进行采样，将每个采样值存入 `DistributionValues` 数组。

  *   `GetEvtFrequency()`：此方法接收一个类型为 `T`（该类型为 `IComparable`）的参数，并将其与时间或数值范围进行比较，以确定它所属的部分，从而获取对应的分布值。例如，如果范围是
  `(0, 100)`、`(100, 200)`、`(200, 250)`，且 `T = 110`，那么 `T` 将落入第二个范围，并匹配第二个（`index=1`）分布值。


  此外，我们还有 `DistributionType` 枚举，它指示了本示例中将考虑的两种分布类型（泊松分布、指数分布）。


