  ## 总结


  在本章中，我们分析了人工智能与逻辑之间的关系。我们介绍了一种基础逻辑——命题逻辑。我们描述了包含用于表示公式（变量、逻辑连接词等）层次结构的各种代码，并通过不同方法对该层次结构进行了补充。这些方法包括否定范式转换算法和合取范式转换算法（依赖于先前介绍的分配律）。我们还描述了一种用于表示公式及其可能求值的二叉决策树。


  在下一章中，我们将开始研究一种扩展了命题逻辑的非常重要的逻辑：一阶逻辑。同时，我们将深入自动定理证明（ATP）的世界，并介绍一种用于判定公式可满足性的非常重要的方法——DPLL
  算法：


  ```

  (x)IsFriend(x, Arnaldo)(x)IsFriend(x, Arnaldo) (y)IsWorkingWith(y, Arnaldo)

