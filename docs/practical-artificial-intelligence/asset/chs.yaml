  {\nName = name;\nValues = values;\nType = type;\nTypeVal = typeVal;\n}\n}\npublic\
  \ enumTypeAttrib\n{\nGoal, NonGoal\n}\npublic enumTypeVal\n{\nDiscrete, Continuous\n\
