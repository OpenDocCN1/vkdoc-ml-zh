  \ 类\n```\n\n`Cluster` 类包含以下属性：\n\n*   `Objects`：簇中包含的对象集合\n*   `Centroid`：簇的质心\n\
  *   `ClusterNo`：簇的 ID，用于与其他簇区分\n*   `Total`：组或簇中的元素数量\n\n该类还包含以下方法：\n\n*   `Add()`：向簇中添加一个元素\n\
  *   `Remove()`：从簇中移除一个元素\n*   `CalculateCentroid()`：计算簇的质心\n*   `AverageLinkageClustering()`：计算簇之间的\
  \ `AverageLinkageClustering` 相似度度量，如前所述\n\n表示待聚类对象的 `Element` 类如代码清单 13-2 所示。\n\n\
  ```\npublic class Element\n{\npublic List Features { get; set; }\npublic int Cluster\
  \ { get; set; }\npublic Element(int cluster = -1)\n{\nFeatures = new List();\nCluster\
  \ = cluster;\n}\npublic Element(IEnumerable features)\n{\nFeatures = new List(features);\n\
  Cluster = -1;\n}\n}\n代码清单 13-2\nElement 类\n```\n\n该类包含一个 `Cluster` 属性，用于指示对象所属簇的\
