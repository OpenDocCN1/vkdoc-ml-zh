  用于连续属性的 HighestGainAttribute() 方法\n```\n\n在这个新的或连续版本的 `HighestGainAttribute()` 方法中，我们根据属性是离散还是连续进行了区分。还要注意，在这种情况下，该方法返回一个字典，其中包含所选属性、其索引，并且如果所选属性是连续的，则包含两个索引位置列表（less,\
