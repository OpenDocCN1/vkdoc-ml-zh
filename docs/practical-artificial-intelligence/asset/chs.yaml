  \ ATP 的含义及其一些用途和优势。让我们记住，ATP 是一个试图自动化数学家工作的领域，而 SAT 求解器是该领域中非常有用的工具。在接下来的章节中，我们将开始研究一种比命题逻辑更复杂的逻辑——一阶逻辑，它是命题逻辑的扩展，并且我们将初步了解它相对于更简单的命题逻辑所提供的一些优势。\n\
  \n\n\n## 一阶逻辑\n\n我们迄今为止所研究的命题由主语（对象或个体）和谓语组成。\n\n给定一组对象或主体，在这些对象之间定义的关系和属性被称为谓词。\n\
  \n谓词的示例如下：\n\n1.  x > x  \n2.  5 + y - x = 1  \n3.  x > 2\n\n在考虑了前面的示例后，我们可能会问自己，命题和谓词之间的区别是什么？\n\
  \n在最新的谓词示例中，我们有常量（1, 2, 5）、关系（>, =）和函数（+, -），它们都有固定的解释，但数值变量（x, y）的情况并非如此。这些变量在其可能取的值方面引入的不确定性，导致该表达式在逻辑上不被视为命题。根据变量\
  \ x、y 可能取的值，前面的表达式可能变为真或假——因此，成为命题。\n\n在逻辑学中，表达式 1、2、3 被称为 n 元谓词；即，一个具有 n 个变量的谓词。考虑示例\
  \ 1、2 和 3，我们可以说第一个表达式是一元谓词，第二个是二元谓词。属性是一元谓词，一种与主体本身的特定关系；因此，它被视为谓词的一个特例。\n\n注意\n\
  \n谓词表示主体、对象和个体之间的关系。它们缺乏真值；即，它们不像命题那样具有真或假的值。\n\n一阶逻辑（FOL）通过允许在逻辑语句中对对象进行某些形式的推理，扩展了命题逻辑。\n\
  \n在命题逻辑中，我们有代表可能为真或假的事实或陈述的变量，例如“第二次世界大战于 1952 年结束”或“《星球大战》由乔治·卢卡斯执导”，但你不能有代表汽车、铅笔或温度等事物的变量。在\
  \ FOL 中，变量指的是世界上的事物，如铅笔或温度，我们可以对它们进行量化，从而允许我们在一个句子中表达在命题逻辑中可能需要多个句子才能表达的内容。\n\n\
  总的来说，我们需要 FOL 的一些原因如下：\n\n*   我们需要一种方式来表达一个个体或主体具有某种属性，或者某些个体以特定方式相关联（例如，佐菲亚是单身，或者她嫁给了阿尔伯特，或者约翰尼是本杰明的狗）。\n\
  *   我们需要一种方式来表达所有（某种类型的）主体都具有某种属性（例如，所有的鸟都有翅膀，或者存在一个身高超过 7 英尺的男人）。\n*   我们需要一种方式来指代由其他实体功能性地确定的实体（例如，一个人的身高；一个物体的重量；两个数的和）。\n\
  \n命题逻辑提供的简化表示使得建模我们日常生活中通常出现的许多问题变得非常复杂。因此，我们必须依赖像 FOL 这样更复杂的逻辑。\n\n前面描述的原因催生了 FOL\
  \ 的语法。其语法允许我们（使用形式语言）形成类似于英语句子的公式，例如 `IsDog(“Johnny”)`（约翰尼是狗吗？）、`Misses(“Katty”,\
  \ “John”)`（凯蒂想念约翰）或 `∀x (IsDog(x) => ¬CanFly(x))`（对于所有对象 x，如果 x 是狗，那么 x 不能飞）。\n\n\
  FOL 的组成部分包括命题逻辑的连接词；项，可以是常量（a, b, John, Lucas 等）、变量（x, y 等）或应用于其他项的函数（F, G, H 等）；命题常量（True,\
  \ False）；谓词（IsDog, CanFly 等），表示单个对象的属性或两个或多个对象之间的关系；以及量词（‘对于所有...’ 记作 ∀，‘存在...’\
  \ 记作 ∃，‘存在唯一...’ 记作 ∃!）。FOL 中的重大新特性无疑是量词运算符的出现。\n\n一个公式可以是一个应用于一个或多个项的谓词，两个项的相等性（即\
  \ t1 = t2；∀(v)F'(v), ∃(v)F'(v)，如果 v 是一个变量且 F' 是一个公式），或者任何源自将命题逻辑的逻辑连接词应用于其他公式的结果。\n\
  \n下面我们更详细地描述一下 FOL 的语法：\n\n```\nconstant ::= a | A | b | B | c | C | John | Block1\
  \ | Block2 | ...\nvariable ::= x | y | z | x1| x2 | block1 | ...\nfunction::= f\
  \ | g | h | weight | sum | mother-of | ...\nterm ::= constant | variable | function\
  \ (term , ..., term)\npredicate::= A | B | C |IsDog| Loves |IsBrother ...\nbinary\
  \ connective ::=˄ | ˅ | => | \nformula ::= predicate (term , ..., term) | (term\
  \ = term) | ¬formula | ((formula) binary connective (formula)) | ∀(variable) formula\
  \ | ∃(variable) formula\n```\n\n在命题逻辑中，我们将公式解释为对其命题变量赋予真值。在 FOL 中，谓词和量词的引入使得公式的求值取决于在某个域（整数、实数、汽车、铅笔……任何我们能想到的东西）或对象宇宙中给出的解释；在这种情况下，解释的概念稍微复杂一些。\n\
  \n注意\n\n一个公式的解释是一个对 (D, A)，其中 D 是域，A 是对每个常量、函数、谓词等的赋值。\n\n为了定义公式 I 在域或对象集 D 中的解释，我们必须考虑以下解释规则：\n\
  \n1.  如果 c 是一个常量，那么 c 具有域 D。这种映射指示了名称（常量基本上是名称）如何与宇宙中的对象连接。我们可能有一个常量 Johnny，而 Johnny\
  \ 在狗的世界中的解释可能是一只特定的狗。\n2.  如果 P 是一个谓词，那么 P 具有域 D x D x ... x D；即，存在一个从谓词到 D 中关系的映射。\n\
  3.  如果 f 是一个函数，那么 f 具有域 D，其像也在 D 中；即，存在一个从函数到 D 中函数的映射。\n\n给定公式 F 在域 D 下的解释 I，I\
  \ 遵循以下求值规则：\n\n1.  如果 P(v1, v2, ... , vn) 是一个谓词，那么如果 (v1, v2, ... , vn) 是 D 中的一个关系，则\
  \ P 为真；即，(v1, v2, ... , vn) ∈ D x D x ... x D。回想一下，n 元关系是一组 n 元组。\n2.  如果 F, F'\
  \ 是 FOL 的公式，那么 F `∧` F', F `∨` F', F => F', F <=> F', `¬`F 在域 D 中具有与在命题逻辑中使用相同运算符时相同的真值；即，这些运算符在两种逻辑中具有相同的真值表。\n\
  3.  如果对于 D 中 v 的所有值，F(v) 都为真，则公式 ∀(v)F(v) 为真。\n4.  如果对于 D 中 v 的至少一个值，F(v) 为真，则公式\
  \ ∃(v)F(v) 为真。\n\n让我们检查一个示例，该示例将阐明解释和求值在 FOL 中如何工作；考虑以下公式在域 D 下的解释 I：\n\n```\n∃(x)IsFriend(x,\
  \ Arnaldo)∧∃(y)IsWorkingWith(y, Arnaldo)\nD = {John, Arnaldo, Mark, Louis, Duke,\
  \ Sting, Jordan, Miles, Lucas, Thomas, Chuck, Floyd, Hemingway}\nConstants = {Arnaldo}\n\
  Predicates = {IsFriend, IsWorkingWith}\nI(Arnaldo) = Arnaldo\nI(IsFriend) = {(John,\
  \ Arnaldo), (Mark, Louis), (Duke, Sting), (Jordan, Miles)}\nI(IsWorkingWith) = {(Lucas,\
  \ Arnaldo), (Thomas, Chuck), (Floyd, Hemingway)}\n```\n\n为了确定上述解释的真值，我们有\n\n```\n\
  ∃(x)IsFriend(x, Arnaldo)\n```\n\n对于 x = John 为真，因为元组或关系 `(John, Arnaldo)` 属于 `IsFriend`；因此，∃`(x)IsFriend(x,\
  \ Arnaldo)` 也为真。\n\n```\n∃(y)IsWorkingWith(y, Arnaldo)\n```\n\n对于 y = Lucas 为真，因为元组或关系\
  \ `(Lucas, Arnaldo)` 属于 `IsWorkingWith`；因此，∃`(y)IsWorkingWith(y, Arnaldo)` 也为真。\n\
  \n由于 ∃`(x)IsFriend(x, Arnaldo)` 和 ∃`(y)IsWorkingWith(y, Arnaldo)` 都为真，它们的合取也为真，因此该解释也为真。\n\
  \n\n\n### C# 中的谓词\n\n既然我们正在探索一阶逻辑的世界及其最显著的组成部分（谓词、量词等），那么值得一提的是，在 C# 中我们可以使用 `Predicate<T>`\
  \ 委托，这是一种允许我们测试类型 `T` 的对象是否满足给定条件的构造。例如，我们可以像下面这样定义 `Dog` 类（列表 2-14）。\n\n```\npublic\
  \ class Dog\n{\npublic string Name { get; set; }\npublic double Weight { get; set;\
  \ }\npublic Gender Sex { get; set; }\npublic Dog(string name, double weight, Gender\
  \ sex)\n{\nName = name;\nWeight = weight;\nSex = sex;\n}\n}\npublic enum Gender\
  \ {\nMale, Female\n}\n列表 2-14\nDog 类\n```\n\n然后，我们可以使用谓词来过滤并获取满足特定属性的对象，如列表 2-15\
  \ 所示，我们创建了一个狗列表，然后使用 `Find()` 方法（该方法需要一个谓词作为参数）来“查找”所有满足给定谓词的对象（狗）。\n\n```\nvarjohnny\
  \ = new Dog(\"Johnny\", 17.5, Gender.Male);\nvar jack = new Dog(\"Jack\", 23.5,\
  \ Gender.Male);\nvarjordan = new Dog(\"Jack\", 21.2, Gender.Male);\nvarmelissa =\
  \ new Dog(\"Melissa\", 19.7, Gender.Female);\nvar dogs = new List { johnny, jack,\
  \ jordan, melissa };\nPredicatemaleFinder = (Dog d) => { return d.Sex == Gender.Male;\
  \ };\nPredicateheavyDogsFinder = (Dog d) => { return d.Weight>= 22; };\nvarmaleDogs\
  \ = dogs.Find(maleFinder);\nvarheavyDogs = dogs.Find(heavyDogsFinder);\n列表 2-15\n\
  在 C# 中使用谓词来过滤并获取对象（本例中为狗），这些对象是雄性且体重超过 22 磅的狗\n```\n\n至此，我们已经进入了命题逻辑和一阶逻辑的世界。在下一节中，我们将介绍一个实际问题，在其中看到一阶逻辑的实际应用。\n\
  \n## 实际问题：清洁机器人\n\n在本节中，我们将看到前面描述的许多概念（函数、谓词等）如何应用于创建清洁机器人，其世界如图 2-5 所示。\n\n![A449374_1_En_2_Fig5_HTML.jpg](img/A449374_1_En_2_Fig5_HTML.jpg)\n\
