  在清单 8-2 中，我们可以看到 `AirportEvent<T>` 抽象类，它将作为其他三个表示 `AirportSimulation` 中不同事件的类的父类。其目的是缩短代码，将所有可以逻辑压缩或包含在单个父类中的行合并，从而利用
