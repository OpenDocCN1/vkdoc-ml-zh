  ## 实际问题：将公式转化为合取范式（CNF）


  合取范式（CNF）本质上是“AND of ORs”；即，变量或否定变量的组全部通过析取连接词连接，而所有组之间通过合取连接词关联；例如，(p ∨ q) ∧ (r
  ∨ ¬q)。由于前面详述的多种原因，我们有兴趣将公式转化为 CNF。CNF 转换算法的伪代码如下所示。


  函数 CNF(F)：


  *   如果 F 是变量或否定变量，则返回 F

  *   如果 F 是 p ∧ q，则返回 CNF(p) ∧ CNF(q)

  *   如果 F 是 p ∨ q，则返回 DISTRIBUTE-CNF (CNF(p),CNF(q))


  函数 DISTRIBUTE-CNF(P, Q)：


  *   如果 P 是 R ∧ S，则返回 DISTRIBUTE-CNF (R, Q) ∧ DISTRIBUTE-CNF (R, Q)

  *   如果 Q 是 T ∨ U，则返回 DISTRIBUTE-CNF (P, T) ∧ DISTRIBUTE-CNF (P, U)

  *   返回 P ∨ Q


  CNF 算法依赖于一个名为 `DISTRIBUTE-CNF` 的辅助方法，该方法利用命题逻辑的分配律来分解公式，使其更接近 CNF 的预期形式。


  注意


  CNF 算法假设输入公式已经处于 NNF。每个 NNF 公式都可以使用命题逻辑的分配律转化为等价的 CNF 公式。


  正如我们对 NNF 算法所做的那样，我们将把 CNF 算法插入到我们在之前实际问题中一直在增强的 `Formula` 层次结构中。对 `Formula` 抽象类必要的编辑如清单
  1-12 所示。


  ```

  public abstract class Formula

  {

  public abstract bool Evaluate();

  public abstract IEnumerable Variables();

  public abstract Formula ToNnf();

  public abstract Formula ToCnf();

  public Formula DistributeCnf(Formula p, Formula q)

  {

  if (p is And)

  return new And(DistributeCnf((p as And).P, q), DistributeCnf((p as And).Q, q));

  if(q is And)

  return new And(DistributeCnf(p, (q as And).P), DistributeCnf(p, (q as And).Q));

  return new Or(p, q);

  }

  }

  清单 1-12

  向 Formula 类添加 ToCnf() 和 DistributeCnf() 方法


  现在我们已经向父类添加了抽象方法，可以在子类 `And`、`Or` 中包含相应的重写，如清单 1-13 和 1-14 所示。


  ```

  public class And: BinaryGate

  {

  public And(Formula p, Formula q): base(p, q)

  { }

  public override bool Evaluate()

  {

  return P.Evaluate() &&Q.Evaluate();

  }

  public override Formula ToNnf()

  {

  return new And(P.ToNnf(), Q.ToNnf());

  }

  public override Formula ToCnf()

  {

  return new And(P.ToNnf(), Q.ToNnf());

  }

  }

