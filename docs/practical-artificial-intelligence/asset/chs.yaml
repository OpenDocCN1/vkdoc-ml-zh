  \ others 连接到 `Cnf` 的子句列表中。\n*   `private voidRemoveParenthesis(And and)`：将 `Cnf`\
  \ 转换为子句列表。\n\n`RemoveParenthesis(And and)` 方法负责执行一项非常重要的任务。该方法将我们已有的、由一系列串联的 AND\
  \ 连接符 `And(p1, And(p2, And( ... ) ))` 组成的 CNF 公式，转换为一个子句列表。\n\n到目前为止，我们一直使用的 `Formula`\
  \ 层次结构使我们免于为逻辑公式实现解析器，但它在清晰性上付出了一点代价。我们旨在通过执行此方法，将表示 CNF 的 `And` 公式转换为子句列表，来恢复清晰性。这种新的表示形式对于任何我们可能需要开发的、与\
  \ CNF 相关的算法都会非常有用；它对于我们将要介绍的 DPLL 算法肯定也会很有帮助。\n\n注意\n\n如果你想为逻辑公式开发一个解析器，可以使用 ANTLR（另一种语言识别工具），这是一个非常有用的工具，可以帮助开发者编写语法和创建解析器。ANTLR\
  \ 生成并输出 Java 或 C# 类（.cs 文件）形式的解析器，使你之后可以将它们包含在项目中并随意使用。\n\n`RemoveParenthesis(And\
  \ and)` 方法主要由一个包含若干条件的 `while` 循环组成。这些条件可能标志着循环的结束，每个条件都对应一个不同的场景，这些场景在我们考虑参数 `And`\
  \ 中的公式 P 和 Q 的类型时可能出现。这些场景如下：\n\n*   P、Q 是 OR 或字面量。\n*   （P 是 OR 或字面量）且 Q 是 And。\n\
  *   P 是 And 且（Q 是 OR 或字面量）。\n*   P、Q 都是 And。\n\n请注意，在 `RemoveParenthesis(And and)`\
  \ 的方法体中，存在对 `Literals()` 方法的多次调用。此方法必须被创建并插入到整个 `Formula` 层次结构中，就像我们之前对 `ToNnf()`\
  \ 和 `ToCnf()` 方法所做的那样。我们从顶层开始，即 `Formula` 抽象类，如清单 2-3 所示。\n\n```\npublic abstract\
  \ class Formula\n{\npublic abstract bool Evaluate();\npublic abstract IEnumerable\
  \ Variables();\npublic abstract Formula ToNnf();\npublic abstract Formula ToCnf();\n\
  public abstract IEnumerable Literals();\n...\n}\n清单 2-3\n向 Formula 抽象类添加 Literals()\
  \ 抽象方法\n```\n\n现在，我们需要在整个层次结构中分布 `Literals()` 方法的具体实现。在清单 2-4 中，我们展示了其余类的具体实现。\n\
  \n```\npublic abstract class BinaryGate : Formula\n{\n...\npublic override IEnumerable\
  \ Literals()\n{\nreturn P.Literals().Concat(Q.Literals());\n}\n}\npublic class Not\
  \ : Formula\n{\n...\npublic override IEnumerable Literals()\n{\nreturn P is Variable\
  \ ? new List() { this }: P.Literals();\n}\n}\npublic class Variable : Formula\n\
  {\n...\npublic override IEnumerable Literals()\n{\nreturnnew List() { this };\n\
  }\n}\n清单 2-4\n向层次结构中的其余类添加 Literals() 方法\n```\n\n到目前为止，我们已经用 C# 构建了一个逻辑框架；现在，是时候研究一个用于判断公式可满足性的最简单、最高效且最巧妙的算法之一了：DPLL\
  \ 算法。\n\n\n\n## DPLL 算法\n\nDavis-Putnam-Logemann-Loveland（DPLL）算法是一种决策过程，它利用回溯搜索来寻找一个能使\
  \ CNF（合取范式）公式可满足的赋值。该算法于 1960 年（由 Davis 和 Putnam 提出）和 1962 年（由 Davis、Logemann 和\
  \ Loveland 提出）的两篇文章中引入，至今仍是大多数高效 SAT 求解器的基础；它甚至已被扩展用于处理更复杂逻辑（如一阶逻辑）的小片段。\n\nSAT\
  \ 问题是第一个被证明是 NP 完全的问题；因此，找到解决该问题的有效程序至关重要。此外，该问题在自动定理证明、规划、调度以及人工智能的许多其他领域都有应用，因此多年来一直引起科学界的极大兴趣。\n\
  \nDPLL 接收一个 CNF 公式作为输入，并尝试通过回溯以及应用某些简化和降低当前公式复杂度的规则，来构建一个验证该公式的赋值。可能的赋值集合使用二叉树表示，这与我们在第\
  \ 1 章中介绍的二叉决策树非常相似。\n\n该算法的伪代码如下所示：\n\n```\nDPLL(cnf):\nTERMINATION-CONDITIONS(cnf)\n\
  cnf' = Rule_OneLiteral(cnf)\ncnf'' = Rule_PureLiteral(cnf')\n// 将决策树拆分为分支 p 和 ¬p\n\
  splitted = Rule_Split(cnf'')\nreturn DPLL(splitted[p]) || DPLL(splitted[¬p])\nTERMINATION-CONDITIONS(cnf):\n\
  如果 cnf.Clauses 为空:\n返回 True\n如果 cnf.Clauses 包含 Empty_Clause:\n返回 False\n```\n\n\
  DPLL 构建的树形结构由三个规则塑造：`OneLiteral`、`PureLiteral` 和 `Split`。前两个规则决定了每个节点中包含的公式，而最后一个规则则在树中创建新的分支。让我们逐一审视它们：\n\
  \n*   `OneLiteral`：如果存在一个单元子句（即只包含一个文字 p 的子句），则删除该子句以及所有包含 p 的子句。然后，从 CNF 的每个子句中删除\
  \ p 的否定（`¬`p）。如果一个公式是可满足的，那么这个文字必然为 1，因为它决定了其子句的真值。\n*   `PureLiteral`：如果存在一个文字\
  \ p，且 ¬p 不属于 CNF 的任何子句，则删除所有包含 p 的子句。在这种情况下，我们可以将 p 赋值为 1，因为它的否定在 CNF 中不存在。\n* \
  \  `Split`：应用纯文字规则后，我们知道如果存在文字 p，那么它的否定也必然存在。因此，我们选择一个文字 p，并将子句集划分为 Cp、C¬p 和 R。Cp\
  \ 子句集包含所有包含文字 p 的子句。C`¬`p 包含所有包含 ¬p 的子句，R 是不包含 p 或 ¬p 的子句集。最后，我们得到 Cp + R 和 C¬p\
  \ + R 这两个集合，其中 Cp + R 是将 R 中的每个子句添加到 Cp 后得到的集合；C¬p + R 是将 R 中的每个子句添加到 C¬p 后得到的集合。这两个集合将成为我们在\
  \ DPLL 过程中形成的树的左右分支的新 CNF 根节点。\n\n这些规则的示例可以在以下行中看到；每种情况都给出了一个初始 CNF 公式，然后对其应用每个规则。\n\
  \n```\n单文字示例\nCNF = {{p, q, ¬r},{p, ¬q}, {¬p}, {r}, {u}}\n-应用 OneLiteral 规则，L =\
  \ ¬p\nCNF' = {{p, q, ¬r},{p, ¬q}, {r}, {u}}\n-从 Cnf' 的子句中移除 ¬L = p\nCNF'' = {{q,\
  \ ¬r},{¬q}, {r}, {u}}\n纯文字示例\nCNF = {{p, q},{p, ¬q}, {r, q}, {r, ¬q}}\n-应用 PureLiteral\
  \ 规则，L = p\nCNF' = {{r, q}, {r, ¬q}}\n拆分示例\nCNF = {{p, ¬q, r},{¬p, q}, {¬r, q},\
  \ {¬r, ¬q}}\n-应用 Split 规则，L = p\nCNF' = {{¬q, r}, {¬r, q}, {¬r, ¬q}}\nCNF'' = {{q},\
  \ {¬r, q}, {¬r, ¬q}}\n```\n\nDPLL 算法及其所有辅助方法都将包含在 `Cnf` 类中。公共的 `Dpll()` 方法将依赖于一个私有的辅助\
  \ `Dpll` 方法，该方法接收一个 `Cnf` 类的副本作为参数，如代码清单 2-5 所示。\n\n```\npublic bool Dpll()\n{\n\
  return Dpll(new Cnf {Clauses = new List(Clauses)});\n}\nprivate bool Dpll(Cnfcnf)\n\
  {\n// 没有子句的 CNF 被视为 True\nif (cnf.Clauses.Count == 0)\nreturn true;\n// 规则 One Literal：如果存在一个只包含单个文字的子句\n\
  // 我们将其赋值为 True 并移除所有包含它的子句。\nvarcnfAfterOneLit = OneLiteral(cnf);\nif (cnfAfterOneLit.Item2\
  \ == 0)\nreturn true;\nif (cnfAfterOneLit.Item2 < 0)\nreturn false;\ncnf = cnfAfterOneLit.Item1;\n\
  // 规则 Pure Literal：如果存在一个文字，且其否定不在 Cnf 的任何子句中\nvarcnfPureLit = PureLiteralRule(cnf);\n\
  // 规则 Split：在一个文字上进行拆分，创建树的 2 个分支\nvar split = Split(cnfPureLit);\nreturn Dpll(split.Item1)\
  \ || Dpll(split.Item2);\n}\n代码清单 2-5\nDpll() 方法及其辅助方法 Dpll(Cnf cnf)\n```\n\n从代码清单\
  \ 2-5 中我们可以看到，`Dpll(Cnfcnf)` 方法与之前展示的 DPLL 伪代码非常接近。首先，我们检查当前 `Cnf` 类中是否存在一些子句，然后执行第一个简化规则，即单文字规则。如代码清单\
  \ 2-6 所示，`OneLiteral(Cnfcnf)` 方法返回一个 `Tuple<Cnf, int>`，其中元组中的结果 `Cnf` 类是在执行简化后得到的，结果整数可以是\
  \ -1、0 或 1。如果其值为 0，则 `Cnf` 公式没有更多子句需要检查，因此它必须为真（可满足）；如果其值为 -1，则在 `Cnf` 中发现了一个空子句，它必须为假（不可满足）。最后，在值为\
  \ 1 的情况下，由于尚未得出关于 `Cnf` 可满足性的决定性结果，程序必须继续执行。\n\n`OneLiteral(Cnfcnf)` 使用的两个辅助方法的描述如下：\n\
  \n*   `Negate Literal(Formula literal)`：接收一个假定为文字的 `Formula` 作为参数，并返回其否定。在其他情况下返回\
  \ null。\n*   `UnitClause(Cnfcnf)`：查找一个只包含单个文字的子句，并返回该文字。如果不存在这样的子句，则返回 null。\n\n\
  该规则的代码如代码清单 2-6 所示。\n\n\n```csharp\nprivate TupleOneLiteral(Cnfcnf)\n{\nvarunitLiteral\
  \ = UnitClause(cnf);\nif (unitLiteral == null)\nreturn new Tuple(cnf, 1);\nvarnewCnf\
  \ = new Cnf();\nwhile (unitLiteral != null)\n{\nvarclausesToRemove = new List();\n\
  vari = 0;\n// 第一轮循环 - 查找包含单元文字的子句，这些子句将不会出现在新的 Cnf 中\nforeach (var clause in cnf.Clauses)\n\
  {\nif (clause.Literals.Any(literal =>clause.LiteralEquals(literal, unitLiteral)))\n\
  clausesToRemove.Add(i);\ni++;\n}\n// 移除所有包含单元文字的子句后得到新的 Cnf\nnewCnf = new Cnf();\n\
  // 第二轮循环 - 保留不包含单元文字的子句\nfor (var j = 0; j (newCnf, 0);\n// 从剩余子句中移除单元文字的否定形式\n\
  varunitNegated = NegateLiteral(unitLiteral);\nvarclausesNoLitNeg = new List();\n\
  foreach (var clause in newCnf.Clauses)\n{\nvarnewClause = new Clause();\n// 保留除单元文字否定形式之外的所有文字\n\
  foreach (var literal in clause.Literals)\nif (!clause.LiteralEquals(literal, unitNegated))\n\
  newClause.Literals.Add(literal);\nclausesNoLitNeg.Add(newClause);\n}\nnewCnf.Clauses\
  \ = new List(clausesNoLitNeg);\n// 为下一阶段重置变量\ncnf = newCnf;\nunitLiteral = UnitClause(cnf);\n\
  // 发现空子句\nif (cnf.Clauses.Any(c =>c.Literals.Count == 0))\nreturn new Tuple(newCnf,\
  \ -1);\n}\nreturn new Tuple(newCnf, 1);\n}\npublic Formula NegateLiteral(Formula\
  \ literal)\n{\nif (literal is Variable)\nreturn new Not(literal);\nif (literal is\
  \ Not)\nreturn (literal as Not).P;\nreturn null;\n}\nprivate Formula UnitClause(Cnfcnf)\n\
  {\nforeach (var clause in cnf.Clauses)\nif (clause.Literals.Count == 1)\nreturn\
  \ clause.Literals.First();\nreturn null;\n}\n代码清单 2-6\nOneLiteral() 规则及其辅助方法\n```\n\
  \n`OneLiteral` 方法包含一个 `while` 循环，该循环在以下两种情况下结束：当前 `Cnf` 类中不再存在仅含单个文字的子句，或者达到终止条件（`Cnf`\
  \ 中无子句或发现空子句）。在此 `while` 循环内部，第一个循环用于存储每个子句中单元子句的位置（包括当前单元文字）。第二个循环通过跳过第一个循环中存储了位置的子句，构建一个新的\
  \ `Cnf` 类。`while` 循环内的第三个也是最后一个循环，其作用与前两个循环类似，但在此情况下，它确保在执行完前两个循环后得到的新 `Cnf` 中，每个子句都移除了单元文字的否定形式。\n\
  \n在代码清单 2-7 中，我们可以看到纯文字规则的代码，该规则通常在单文字规则之后应用。\n\n```csharp\nprivate CnfPureLiteralRule(Cnfcnf)\n\
  {\nvarpureLiterals = PureLiterals(cnf);\nif (pureLiterals.Count() == 0)\nreturn\
  \ cnf;\nvarnewCnf = new Cnf();\nvarclausesRemoved = new SortedSet();\n// 检查哪些子句包含纯文字\n\
  foreach (varpureLiteral in pureLiterals)\n{\nfor (vari = 0; iPureLiterals(Cnfcnf)\n\
  {\nvar result = new List();\nforeach (var clause in cnf.Clauses)\nforeach (var literal\
  \ in clause.Literals)\n{\nif (PureLiteral(cnf, literal))\nresult.Add(literal);\n\
  }\nreturn result;\n}\nprivate bool PureLiteral(Cnfcnf, Formula literal)\n{\nvar\
  \ negation = NegateLiteral(literal);\nforeach (var clause in cnf.Clauses)\n{\nforeach\
  \ (var l in clause.Literals)\nif (clause.LiteralEquals(l, negation))\nreturn false;\n\
  }\nreturn true;\n}\n代码清单 2-7\nPureLiteral() 规则及其辅助方法\n```\n\n`PureLiteralRule` 方法负责对单文字规则返回的新\
  \ `Cnf` 类执行纯文字规则。它依赖于以下辅助方法：\n\n*   `PureLiterals(Cnf cnf)`：返回在 `Cnf` 类中找到的纯文字列表。\n\
  *   `PureLiteral(Cnf cnf, Formula literal)`：判断给定文字是否为纯文字；即，如果其否定形式存在于 `Cnf` 类中，则返回\
  \ false；否则返回 true。\n\n`PureLiteralRule()` 方法会找出 `Cnf` 类中的所有纯文字，并将其从 `CNF 公式` 的每个子句中移除；然后返回一个包含结果子句的新\
  \ `Cnf`。\n\n最后，`Split()` 方法如代码清单 2-8 所示。\n\n```csharp\nprivate Tuple Split(Cnfcnf)\n\
  {\nvar literal = Heuristics.ChooseLiteral(cnf);\nvar tuple = SplittingOnLiteral(cnf,\
  \ literal);\nreturn new Tuple(RemoveLiteral(tuple.Item1, literal), RemoveLiteral(tuple.Item2,\
  \ NegateLiteral(literal)));\n}\nprivate CnfRemoveLiteral(Cnfcnf, Formula literal)\n\
  {\nvar result = new Cnf();\nforeach (var clause in cnf.Clauses)\nresult.Clauses.Add(clause.RemoveLiteral(literal));\n\
  return result;\n}\nprivate TupleSplittingOnLiteral(Cnfcnf, Formula literal)\n{\n\
  // 包含该文字的子句列表\nvar @in = new List();\n// 包含 Not(literal) 的子句列表\nvarinNegated = new\
  \ List();\n// 既不包含该文字也不包含 Not(literal) 的子句列表\nvar @out = new List();\nvar negated\
  \ = NegateLiteral(literal);\nforeach (var clause in cnf.Clauses)\n{\nif (clause.Contains(literal))\n\
  @in.Add(clause);\nelse if (clause.Contains(negated))\ninNegated.Add(clause);\nelse\n\
  @out.Add(clause);\n}\nvarinCnf = new Cnf { Clauses = @in };\nvaroutCnf = new Cnf\
  \ { Clauses = @inNegated };\ninCnf.Join(@out);\noutCnf.Join(@out);\nreturn new Tuple(inCnf,\
  \ outCnf);\n}\n代码清单 2-8\nSplit() 规则及其辅助方法\n```\n\n该方法使用了以下辅助方法：\n\n*   `RemoveLiteral(Cnf\
  \ cnf, Formula literal)`：返回一个新的 `Cnf` 类，其中每个子句都不包含作为参数传入的文字。\n*   `SplittingOnLiteral(Cnf\
  \ cnf, Formula literal)`：根据前面描述的分裂规则，返回一个包含两个 CNF 的元组。\n\n在 `Split()` 方法中，我们调用了名为\
  \ `Heuristics` 的类中的一个静态方法 `ChooseLiteral()`；该方法从 CNF 公式中输出第一个文字，并将其作为分支文字。\n\n启发式方法和元启发式方法是我们在第\
  \ 7 章中将要深入分析的主题。目前，我们可以将启发式方法视为一种基于经验的过程，它有助于将人类的经验性知识附加到解决特定问题的过程中。\n\n注意\n\n在\
  \ `SplittingOnLiteral()` 方法中，我们声明了变量 `@in`、`inNegated` 和 `@out`，其目的分别是存储包含用于分裂或分支的文字、其否定形式以及其他任何子句。我们使用\
  \ @ 前缀是因为 in 和 out 是 C# 中的关键字。\n\n在 DPLL 算法中，为了正确选择用于分支的文字（即用于分裂当前节点并创建树的新分支的文字），树的构建对于效率至关重要。我们暂且满足于当前这种简单的分支方法，在本书后续部分，我们将深入探讨更好的选择和分支方法。\n\
  \n\n## 实践问题：在命题逻辑中建模鸽巢原理\n\n鸽巢原理，也称为狄利克雷抽屉原理，是数学中一个简单但基础的概念。它由德国数学家[彼得·古斯塔夫·勒热纳·狄利克雷](https://es.wikipedia.org/wiki/Peter_Gustav_Lejeune_Dirichlet)于\
  \ 19 世纪提出，这位科学家定义了我们现在所知的函数概念——这是他众多领域贡献之一。\n\n该原理指出，如果你有 n 个鸽巢和 m 只鸽子，且 m > n（鸽子数量\
  \ > 鸽巢数量），那么至少有一个鸽巢包含两只鸽子。\n\n为了在命题逻辑中表述该原理，我们考虑变量 p_ij，它表示鸽子 i 被映射到鸽巢 j。我们将尝试创建一个\
  \ CNF 公式来建模此问题，然后判断其可满足性。\n\n以下约束条件将决定最终 CNF 公式的子句。\n\n*   p_i1 ∨ p_i2 ∨ ... ∨ p_in，对于每个\
  \ i <= m\n*   ¬p_ik ∨ ¬p_jk，对于每个 i, j <= m 且 k <= n，i ≠ j\n\n第一条规则保证每个子句（鸽巢）至少包含一只鸽子。第二条规则或约束适用于每一对不同变量，并保证没有两只鸽子在同一个鸽巢中。在接下来的实践问题中，我们将看到一个如何在程序中测试鸽巢原理的示例。\n\
  \n## 实践问题：判断命题逻辑公式是否可满足\n\n在这个实践问题中，我们将使用之前描述的层次结构和 DPLL 算法来判断给定的命题逻辑公式是否可满足。为了更好地可视化结果，我们将在\
  \ `Variable` 类中实现一个 `Name` 属性，并在 `Not`、`And`、`Or`、`Variable` 和 `Cnf` 类中重写 `ToString()`\
  \ 方法（列表 2-9）。\n\n```\npublic class Variable : Formula\n{\npublic bool Value { get;\
  \ set; }\npublic string Name { get; set; }\n...\npublic override string ToString()\n\
  {\nreturn Name;\n}\n}\npublic class Not : Formula\n{\n...\npublic override string\
  \ ToString()\n{\nreturn \"!\" + p;\n}\n}\npublic class Or : BinaryGate\n{\n...\n\
  public override string ToString()\n{\nreturn  \"(\" + P + \" | \" + Q + \")\";\n\
  }\n}\npublic class And : BinaryGate\n{\n...\npublic override string ToString()\n\
  {\nreturn  \"(\" + P + \" & \" + Q + \")\";\n}\n}\npublic class Cnf : BinaryGate\n\
  {\n...\npublic override string ToString()\n{\nif (Clauses.Count > 0)\n{\nvar result\
  \ = \"\";\nforeach (var clausule in Clauses)\n{\nvar c = \"\";\nforeach (var literal\
  \ in clausule.Literals)\nc += literal + \",\";\nresult += \"(\" + c + \")\";\n}\n\
  return result;\n}\nreturn \"Empty CNF\";\n}\n}\n列表 2-9\n为 Variable 类添加 Name 属性，并为\
  \ Variable、Not、And、Or 和 Cnf 类重写 ToString() 方法\n```\n\n让我们首先尝试将以下公式输入到我们的程序中：\n\n\
  ```\n(p ∨ q) ∧ (p ∨ ¬q) ∧ (¬p ∨ q) ∧ (¬p ∨ ¬r)\n```\n\n我们将使用 `And`、`Or`、`Variable`\
