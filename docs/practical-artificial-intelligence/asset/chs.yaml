  ### Adaline 与梯度下降搜索


  Adaline（自适应线性神经元）是 Bernard Widrow 于 1960 年提出的一种神经网络模型，其网络结构与感知机相同。感知机与 Adaline 的区别在于所使用的学习规则。Adaline
  算法使用一种具有多个名称的学习规则：**Delta 规则**、**梯度下降**或**最小均方**。该学习规则通常被用于多层网络，尤其是反向传播算法中。因此，Adaline
  是了解多层网络和流行的反向传播算法的良好入门。


  Delta 规则的主要思想是最小化对训练数据 x 进行分类时产生的平方误差：


  ![ $$ {\mathrm{E}}_{\mathrm{x}}=\frac{{\left({\mathrm{y}}_{\mathrm{x}}-{\mathrm{y}}_{\mathrm{x}}^{\prime}\right)}²}{2}
  $$ ](img/A449374_1_En_11_Chapter_Equd.gif)


  在此公式中，y[x] 是训练数据 x 的正确分类，而 y''[x] 是神经网络输出的分类结果。


  Adaline 是一个无阈值的神经网络，这意味着它在学习阶段不考虑偏置或阈值。因此，在训练过程中，其输出（对于数据点 x）简单地计算为 w[i]x[i] 的总和。为了实现对训练数据
  x 进行分类时产生的平方误差的最小化，该算法依赖于这样一个事实：函数的梯度（由所有偏导数组成的向量）指明了 E 的最陡峭增加方向（图 11-7）。因此，通过将梯度乘以
  -1，我们将从任意点获得 E 的最陡峭递减方向，这将引导我们达到所产生的最小误差。


  ![A449374_1_En_11_Fig7_HTML.jpg](img/A449374_1_En_11_Fig7_HTML.jpg)


  图 11-7


  梯度表示函数最大增量的方向；其相反数（蓝色箭头）表示最大减量的方向


  因此，Adaline 的训练方法是一种梯度下降搜索算法，它通过最小化全局误差 E（请记住 E[x] 仅与对训练数据 x 进行分类时产生的误差有关）来确定最佳权重向量。在
  Adaline 中，权重向量最初包含随机变量，然后这些权重将通过迈出小步并向下移动来修改，直到我们到达误差曲面上一个我们认为“可接受”的点；通常，对于任何训练数据点，最大误差的一个小值被认为是可接受的。梯度下降搜索能够找到可微函数的全局最小值。


  为了更好地理解梯度下降方法，让我们通过查看下图（图 11-8）来了解其工作原理。同时，让我们考虑在一个函数 ![ $$ \mathrm{f}:\mathrm{R}\to
  \mathrm{R} $$ ](img/A449374_1_En_11_Chapter_IEq15.gif) 中，即一个单变量 x 的函数，梯度下降方法寻找最小值的更新公式将是
  ![ $$ \mathrm{x}=\mathrm{x}-\alpha \ast \frac{\mathrm{\partial f}\left(\mathrm{x}\right)}{\mathrm{\partial
  x}} $$ ](img/A449374_1_En_11_Chapter_IEq16.gif)。


  ![A449374_1_En_11_Fig8_HTML.jpg](img/A449374_1_En_11_Fig8_HTML.jpg)


  图 11-8


  梯度下降方法的运行机制


  在图 11-8 中，梯度下降搜索从点 p1 = f(x) 开始。根据更新公式，它计算在点 x 处评估的 f 的导数，并乘以学习率 α。由于导数表示 f 的斜率——并且在这个特定情况下，红线（即点
  p1 处的切线）具有正斜率——那么 ![ $$ \alpha \ast \frac{\mathrm{\partial f}\left(\mathrm{x}\right)}{\mathrm{\partial
  x}} $$ ](img/A449374_1_En_11_Chapter_IEq17.gif) 将是一个正值（回想一下 ![ $$ \alpha >0\Big)
  $$ ](img/A449374_1_En_11_Chapter_IEq18.gif)）。因此，x 的新值（设为 x''）将向左移动，新的 p2 = f(x'')
  将满足 p2 < p1。这个过程将持续进行，直到我们达到最小值，假设 α 足够小，并且随着接近最小值，步长会变得更小；换句话说，x 将在新的迭代中缓慢地向左移动。


  回到一般情况，为了找到误差的最陡峭递减，我们将 E（对所有训练数据进行分类时产生的误差总和）表示为 w（权重向量）的函数。请注意，将 E 表示为 w 的函数总是可能的，因为对于任何给定的训练数据
  x，有 ![ $$ {\mathrm{y}}_{\mathrm{x}}^{\prime }={\mathrm{w}}_{\mathrm{i}}{\mathrm{x}}_{\mathrm{i}}
  $$ ](img/A449374_1_En_11_Chapter_IEq19.gif)；因此，要最小化的函数如下：


  ![ $$ \mathrm{E}\left(\mathrm{w}\right)=\frac{\sum \limits_{\mathrm{i}=1}^{\mathrm{n}}{\left({\mathrm{y}}_{\mathrm{i}}-{\mathrm{y}}_{\mathrm{i}}^{\prime}\right)}²}{2}
  $$ ](img/A449374_1_En_11_Chapter_Eque.gif)


  因此，我们将找到 E(w) 的梯度——设为 ![ $$ \mathrm{\nabla E}\left(\mathrm{w}\right) $$ ](img/A449374_1_En_11_Chapter_IEq20.gif)——并将其纳入
  Adaline 的学习规则中，该规则如下：


  ![ $$ \mathrm{w}=\mathrm{w}-\alpha \ast \mathrm{\nabla E}\left(\mathrm{w}\right)
  $$ ](img/A449374_1_En_11_Chapter_Equf.gif)


  请注意，规则中的符号是减号而不是加号。这是因为我们必须对梯度取反，即 ![ $$ -\mathrm{\nabla E}\left(\mathrm{w}\right)
  $$ ](img/A449374_1_En_11_Chapter_IEq21.gif)，以便最小化 E(w)。正如之前在感知机中定义的，α 是学习率，它控制着我们向解决方案移动的速度。前面的公式涉及我们更新权重向量
  w 的方式，但我们应该如何更新单个权重呢？单个权重的规则如下：


  ![ $$ {\mathrm{w}}_{\mathrm{i}}={\mathrm{w}}_{\mathrm{i}}-\alpha \ast \frac{\mathrm{\partial
  E}}{\partial {\mathrm{w}}_{\mathrm{i}}} $$ ](img/A449374_1_En_11_Chapter_Equg.gif)


  我们用其等价形式——关于每个权重 w[i] 的偏导数——替换了梯度。在通过计算一些导数并应用链式法则来展开项 ![ $$ \frac{\mathrm{\partial
  E}}{\partial {\mathrm{w}}_{\mathrm{i}}} $$ ](img/A449374_1_En_11_Chapter_IEq22.gif)
  之后，我们最终将得到梯度下降搜索的完整学习规则：


  ![ $$ \frac{\mathrm{\partial E}}{\partial {\mathrm{w}}_{\mathrm{i}}}=\sum \limits_{\mathrm{j}=1}^{\mathrm{n}}\left({\mathrm{y}}_{\mathrm{j}}-{\mathrm{y}}_{\mathrm{j}}^{\prime}\right)\ast
  \left(-{\mathrm{x}}_{\mathrm{i}\mathrm{j}}\right) $$ ](img/A449374_1_En_11_Chapter_Equh.gif)


  和之前一样，y[j] 表示训练数据 j 的正确分类，y[j]^′ 表示神经网络输出的分类，而 x[ij] 表示训练数据 j 的第 i 个输入值——即与权重 w[i]
  相关联的训练数据 j 的输入。


  尽管从理论或数学角度来看，梯度下降搜索是一种寻找函数局部最小值的优雅方法，但在实践中它往往相当缓慢。请注意，要更新单个权重，您需要遍历整个训练数据集，其中可能包含数万个训练样本，这意味着大量的计算。因此，出于这个实际原因，我们通常使用梯度下降搜索的一种近似变体作为
  Adaline 的学习规则；这种变体将在下一节中介绍。




  ### 随机逼近


  随机梯度下降（SGD）或增量梯度下降是 GDS 的一种补充逼近过程，它在计算每个训练数据的误差后增量更新权重。因此，它使我们免于必须遍历整个训练数据集来计算每个权重值的计算麻烦。实际上，这是
  Adaline 和其他通过考虑训练数据的正确分类及其在 NN 中的输出来最小化平方误差的 NN 算法（反向传播）中使用的方法。使用随机逼近的学习规则被称为 Delta
  规则、Adaline 规则或 Widrow-Hoff 规则（以其创建者命名）。在图 11-9 中，我们可以非常直观地了解 GDS 和 SGD 之间的差异。在第一种方法中，我们直接移动到误差曲面的最小值，因此我们沿着一条直线路径前进；而在后一种方法中，我们像醉汉一样移动；有时我们会失去平衡并移动到错误的位置，但最终我们会到达与
  GDS 相同的点。


  ![A449374_1_En_11_Fig9_HTML.jpg](img/A449374_1_En_11_Fig9_HTML.jpg)


  图 11-9


  左侧是 GDS 在误差曲面上到达最小值所遵循的直接路径；右侧是 SGD 所遵循的“不平衡”路径


  使用 SGD 的更新规则如下：


  ![ $$ {\mathrm{w}}_{\mathrm{i}}={\mathrm{w}}_{\mathrm{i}}+\alpha \ast \left({\mathrm{y}}_{\mathrm{i}}-{\mathrm{y}}_{\mathrm{i}}^{\prime}\right)\ast
  {\mathrm{x}}_{\mathrm{i}} $$ ](img/A449374_1_En_11_Chapter_Equi.gif)


  请注意此学习规则与之前为感知器描述的学习规则之间的相似性——它们看起来非常相似。主要区别是什么？主要区别在于训练时 NN 的输出。在 Adaline 中，我们不考虑任何阈值或激活函数；因此，![
  $$ {\mathrm{y}}_{\mathrm{i}}^{\prime }={\mathrm{w}}_{\mathrm{i}}{\mathrm{x}}_{\mathrm{i}}
  $$ ](img/A449374_1_En_11_Chapter_IEq23.gif)。


  注意


  当你在多层网络中组合多个 Adaline 时，你会得到所谓的 Madaline。


  ### 实际问题：实现 Adaline NN


  在研究了 Adaline 算法背后的理论之后，是时候在 C# 中最终实现该过程了。为此，我们将创建 `Adaline` 类，如清单 11-4 所示。


  ```

  public class Adaline :SingleNeuralNetwork

  {

  public Adaline(IEnumerabletrainingSamples, int inputs, double learningRate)

  : base(trainingSamples, inputs, learningRate)

  { }

  public override void Training()

  {

  double error;

  do

  {

  error = 0.0;

  foreach (vartrainingSample in TrainingSamples)

  {

  var output = LinearFunction(trainingSample.Features);

  varerrorT = Math.Pow(trainingSample.Classification - output, 2);

  if (Math.Abs(errorT)  0.25);

  }

  public double LinearFunction(double [] values)

  {

  var summation = (from i in Enumerable.Range(0, Weights.Count)

  select Weights[i]*values[i]).Sum();

  return summation;

  }

  public override double Predict(double[] features)

  {

  return LinearFunction(features) >0.5 ?1 : 0;

  }

  }

  清单 11-4

  Adaline 类

  ```


  此类继承自 `SingleNeuralNetwork` 并包含三个方法。第二个方法是 `LinearFunction()`，它简单地计算加权和 w[i]x[i]。请记住，Adaline
  中的预测阶段和训练阶段之间存在差异。在训练或学习阶段，我们将 NN 的输出计算为加权和，但在预测阶段，我们必须使用分类函数来分类新传入的数据；因此，预测函数与学习函数不同。在这种情况下，我们的预测函数计算新数据的加权和，并根据加权和的结果是大于
  0.5 还是小于 0.5 输出 1 或 0。


  `Training()` 方法包含一个 `do ... while()` 语句，我们在其中验证分类任何训练数据时产生的最大误差是否超过 0.25。如果超过，循环将继续；否则，我们将认为自己满意，方法将结束。此外，如果分类训练数据时的误差低于
  0.001，我们将不会改变权重。在图 11-10 中，我们可以看到在小型数据集上执行 Adaline 后获得的结果。


  ![A449374_1_En_11_Fig10_HTML.jpg](img/A449374_1_En_11_Fig10_HTML.jpg)


  图 11-10


  在小型数据集上执行 Adaline 后获得的结果


  如果我们对算法的运行方式感到好奇，可以在 `while (error > 0.25);` 这一行设置一个断点，然后观察每次迭代后最大误差如何减小。以下是在与感知器实现中使用的相同训练数据集上执行
  Adaline 时，在一系列迭代中获得的值：3.2386、1.7957、1.0569、0.6973、0.5822、0.5050、0.4523、0.4144、0.3861、0.3640、0.3463、0.3315、0.3189、0.3078、0.2980、0.2891、0.2810、0.2735、0.2676、0.2614、0.2552
  和 0.2491。




  ### 多层网络


  多层网络是一种神经网络，其中多个神经网络按层分组，并逐层连接。我们之前描述的神经网络（感知机、Adaline）由两层构成：一个包含多个节点的输入层和一个包含单个节点的输出层。图
  11-11 所示的多层神经网络由三层组成：输入层、隐藏层和输出层。它也是一种前馈神经网络；换句话说，所有信号都从一层的节点流向下一层的节点。因此，多层神经网络是通过将许多简单的“神经元”组合成层，并将一个神经元的输出作为下一层另一个神经元的输入而构建的。


  ![A449374_1_En_11_Fig11_HTML.jpg](img/A449374_1_En_11_Fig11_HTML.jpg)


  图 11-11


  由三层组成的多层、前馈、全连接神经网络：一层为输入单元，一层为隐藏单元（灰色），一层为输出单元（绿色）。有时输入层不被视为一层。


  除了从训练数据的分量（xi）接收输入的输入层外，所有其他层都从前一层的激活函数接收输入。多层网络中的每条边都代表一个权重，离开某个节点的任何边，其权重值都会乘以该节点出发的激活函数值。因此，来自层
  L（其中 L > 0，即非输入层）的任何节点，其输入或激活值将按如下方式计算：


  ![ $$ {\mathrm{A}}_{\mathrm{l},\mathrm{i}}=\mathrm{g}\left(\sum \limits_{\mathrm{j}=1}^{\mathrm{n}}\
  {\mathrm{w}}_{\mathrm{l}-1,\mathrm{j},\mathrm{i}}{\mathrm{A}}_{\mathrm{l}-1,\mathrm{j}}\right)
  $$ ](img/A449374_1_En_11_Chapter_Equj.gif)


  其中 n 是层 L - 1 中的单元总数，A[l,i] 表示层 L 中单元 i 的激活值，![ $$ {\mathrm{w}}_{\mathrm{l}-1,\mathrm{j},\mathrm{i}}
  $$ ](img/A449374_1_En_11_Chapter_IEq24.gif) 是从层 L – 1 的单元 j 到层 L 的单元 i 的权重或边，g 是神经网络中应用的激活函数。通常，g
  被选为技术上符合逻辑的 sigmoid 函数，其值范围在区间 [0, 1] 内，计算方式如下：


  ![ $$ \mathrm{sigmoid}\left(\mathrm{x}\right)=\frac{1}{1+{\mathrm{e}}^{-\mathrm{x}}}
  $$ ](img/A449374_1_En_11_Chapter_Equk.gif)


  sigmoid 函数一个非常重要的性质是它是可微且连续的；请记住，这个性质对我们很重要，因为我们将要计算梯度，进而计算导数。


  多层神经网络的一个关键要素是它们能够对非线性可分的数据集进行分类。因此，像 XOR（图 11-12）这样无法被线性神经网络（如感知机）分类的函数，可以通过一个仅包含一个隐藏层的简单多层神经网络正确分类。


  ![A449374_1_En_11_Fig12_HTML.jpg](img/A449374_1_En_11_Fig12_HTML.jpg)


  图 11-12


  XOR 函数；不存在一条直线可以将红点与绿点分开


  我们可以将多层神经网络视为强大的数学函数，能够逼近训练数据集中可能存在的任何表格函数。每个隐藏层代表一个函数，而层的组合可以看作是数学中的函数复合。因此，拥有
  n 个隐藏层可以看作是拥有数学函数 o(h1, h2 ( … hn(i(x)) … ))，其中 o 是输出层，i 是输入层，hi 是隐藏层。


  传统的神经网络只有一个隐藏层，当它们有多个隐藏层时，我们就在处理深度神经网络和深度学习。表 11-1 说明了隐藏层数量与所得神经网络能力之间的关系。


  表 11-1


  层数与神经网络能力的关系


  | 隐藏层数量 | 结果 |

  | --- | --- |

  | 无 | 仅能表示线性可分的函数或决策 |

  | 1 | 可以逼近任何包含从一个有限空间到另一个有限空间连续映射的函数 |

  | 2 | 可以使用有理激活函数以任意精度表示任意决策边界，并能以任意精度逼近任何平滑映射 |

  | >2 | 额外的层可以学习复杂的表示（一种自动特征工程）。 |


  已有证明，具有单个隐藏层的多层神经网络能够学习任何函数。因此，人们可能会问，既然一个隐藏层就能学习任何函数，那为什么还需要深度学习呢？关键在于，虽然通用逼近定理证明了拥有一个隐藏层确实足以学习任何连续函数，但它并未说明完成这种学习有多容易。因此，出于效率和准确性的考虑，我们可能需要增加神经网络架构的复杂性，并包含额外的隐藏层，以便在合理的时间内获得一个不错的解决方案。


  在决定神经网络架构时，隐藏层中神经元的数量是另一个需要考虑的重要问题。尽管这些层不直接与外部环境交互，但它们确实对最终输出有着显著影响。隐藏层的数量以及隐藏层中神经元的数量都必须仔细斟酌。


  在隐藏层中使用过少的神经元会导致所谓的欠拟合。当隐藏层中的神经元太少，无法有效感知复杂数据集中的信号时，就会发生欠拟合。在隐藏层中使用过多的神经元则会导致若干问题，其中最著名的是过拟合，即权重对训练数据集调整得过于完美，导致神经网络无法正确预测新的输入数据。


  注意


  通用逼近定理指出，具有一个包含有限数量神经元的隐藏层的前馈网络可以逼近任何连续函数；这使得神经网络可以被视为通用逼近器。




  ### 反向传播算法


  与 Adaline 神经网络类似，采用反向传播的多层神经网络通常依赖梯度下降法，更具体地说是随机梯度近似法，来调整网络的权重。它们也追求与 Adaline 算法相同的目标——最小化数据真实分类与网络输出之间二次差值的误差。


  反向传播算法的核心思想在于，它作为一种机制，将输出层产生的误差传递到最后一个隐藏层（沿途调整权重），再从那里传递到前一个隐藏层，依此类推，向后传播；换句话说，如果
  o 是输出层，h[1], h[2], …, h[n]表示隐藏层，那么反向传播算法会将误差从输出层（相当于调整权重或最小化误差）传递到 h[n]，然后从 h[n]传递到![
  $$ {\mathrm{h}}_{\mathrm{n}-1} $$ ](img/A449374_1_En_11_Chapter_IEq25.gif)，如此继续，直到误差调整过程到达
  h[1]。这种运作方式解释了“反向传播”名称的由来，因为输出是从输入层经过 h[1], h[2], …, h[n]层计算得出，最终到达输出层；然后，一旦获得输出，权重就从输出层向后调整到第一个隐藏层。


  如前所述，反向传播算法与 Adaline 方法一样，都依赖于梯度下降法。我们可以指出的这两种过程的第一个区别是，在 Adaline 中我们只有一个输出节点，但在多层神经网络中，因此在反向传播中，我们可能处理的是排列在输出层中的多个输出节点；因此，总误差必须按如下方式计算：


  ![ $$ \mathrm{E}\left(\mathrm{w}\right)=\frac{\sum \limits_{\mathrm{i}=1}^{\mathrm{n}}\sum
  \limits_{\mathrm{j}=1}^{\mathrm{k}}{\left({\mathrm{y}}_{\mathrm{i}\mathrm{j}}-{\mathrm{y}}_{\mathrm{i}\mathrm{j}}^{\prime}\right)}²}{2}
  $$ ](img/A449374_1_En_11_Chapter_Equl.gif)


  其中 n 是训练数据集的大小，k 是输出层中的单元数量，y[ij]是训练数据 i 在输出层节点 j 位置上的正确分类，而 y''[ij]是我们的神经网络在输出层节点
  j 处为训练数据 i 输出的分类。


  反向传播过程中每个节点的学习规则类似于感知机和 Adaline。根据随机近似法，该规则如下：


  ![ $$ {\mathrm{w}}_{\mathrm{ij}}={\mathrm{w}}_{\mathrm{ij}}+\alpha \ast {\delta}_{\mathrm{j}}\ast
  {\mathrm{x}}_{\mathrm{ij}} $$ ](img/A449374_1_En_11_Chapter_Equm.gif)


  在这种情况下，w[ij]表示从节点 i 到节点 j 的权重，α是学习率，x[ij]是从节点 i 到节点 j 的激活值（在输入层，这些值与输入值一致），δ[j]是节点
  j 处的误差。之前描述的学习规则在反向传播算法的权重更新规则中并没有像现在这样有两个下标（w[ij]）。让我们回想一下，反向传播旨在用于多层神经网络；因此，我们将有许多节点连接到其他节点，所以每条边
  ij 都有一个关联的 w[ij]。


  所以，在权重更新公式中，我们最初拥有除δ[j]之外的所有变量；这个项代表分类误差，我们需要对其关于权重求导以找到梯度，从而在误差曲面上找到相对于 w 的最陡下降方向。正如随机近似法所做的那样，我们每次迭代一个训练数据，这证明了


  ![ $$ {\delta}_{\mathrm{j}}=-\frac{\partial {\mathrm{E}}_{\mathrm{d}}}{\partial
  \sum \limits_{\mathrm{i}}{\mathrm{w}}_{\mathrm{i}\mathrm{j}}\ast {\mathrm{x}}_{\mathrm{i}\mathrm{j}}}
  $$ ](img/A449374_1_En_11_Chapter_Equn.gif)


  其中 E[d]是与分类训练数据 d 相关的误差，w[ij]是与单元 j 相关的权重。我们知道全局误差 E(w)的公式，但这不是我们为了最小化 w 而求导的公式。请记住，随机近似法每次只处理一个训练数据；因此，我们对以下方程求导：


  ![ $$ {\mathrm{E}}_{\mathrm{d}}=\frac{\sum \limits_{\mathrm{j}=1}^{\mathrm{k}}{\left({\mathrm{y}}_{\mathrm{j}}-{\mathrm{y}}_{\mathrm{j}}^{\prime}\right)}²}{2}
  $$ ](img/A449374_1_En_11_Chapter_Equo.gif)


  在这种情况下，k 是输出层中节点的总数，y[j]是节点 j 的正确分类，y''[j]是我们的神经网络输出的值。应用链式法则，并考虑到我们计算误差项的节点是输出单元还是隐藏单元，我们可以得到以下公式：


  *   对于输出层中的节点，


  ![ $$ {\delta}_{\mathrm{j}}=-\frac{\partial {\mathrm{E}}_{\mathrm{d}}}{\partial
  \sum \limits_{\mathrm{i}}{\mathrm{w}}_{\mathrm{i}\mathrm{j}}\ast {\mathrm{x}}_{\mathrm{i}\mathrm{j}}}=\left({\mathrm{y}}_{\mathrm{j}}-{\mathrm{y}}_{\mathrm{j}}^{\prime}\right)\ast
  {\mathrm{y}}_{\mathrm{j}}^{\prime}\ast \left(1-{\mathrm{y}}_{\mathrm{j}}^{\prime}\right)
  $$ ](img/A449374_1_En_11_Chapter_Equp.gif)


  这意味着，


  ![ $$ {\mathrm{w}}_{\mathrm{ij}}={\mathrm{w}}_{\mathrm{ij}}+\alpha \ast \left({\mathrm{y}}_{\mathrm{j}}-{\mathrm{y}}_{\mathrm{j}}^{\prime}\right)\ast
  {\mathrm{y}}_{\mathrm{j}}^{\prime}\ast \left(1-{\mathrm{y}}_{\mathrm{j}}^{\prime}\right)\ast
  {\mathrm{x}}_{\mathrm{ij}} $$ ](img/A449374_1_En_11_Chapter_Equq.gif)


  *   对于隐藏层中的节点，


  ![ $$ {\delta}_{\mathrm{j}}=-\frac{\partial {\mathrm{E}}_{\mathrm{d}}}{\partial
  \sum \limits_{\mathrm{i}}{\mathrm{w}}_{\mathrm{i}\mathrm{j}}\ast {\mathrm{x}}_{\mathrm{i}\mathrm{j}}}={\mathrm{y}}_{\mathrm{j}}^{\prime}\ast
  \left(1-{\mathrm{y}}_{\mathrm{j}}^{\prime}\right)\ast \sum \limits_{\mathrm{k}\in
  \mathrm{Stream}}{\delta}_{\mathrm{k}}\ast {\mathrm{w}}_{\mathrm{k}\mathrm{j}} $$
  ](img/A449374_1_En_11_Chapter_Equr.gif)


  在这种情况下，Stream 是输入对应于节点 j 输出的一组节点。前面的公式意味着


  ![ $$ {\mathrm{w}}_{\mathrm{ij}}={\mathrm{w}}_{\mathrm{ij}}+\alpha \ast {\mathrm{y}}_{\mathrm{j}}^{\prime}\ast
  \left(1-{\mathrm{y}}_{\mathrm{j}}^{\prime}\right)\ast \sum \limits_{\mathrm{k}\in
  \mathrm{Stream}}{\delta}_{\mathrm{k}}\ast {\mathrm{w}}_{\mathrm{k}\mathrm{j}}\ast
  {\mathrm{x}}_{\mathrm{ij}} $$ ](img/A449374_1_En_11_Chapter_Equs.gif)


  请注意，所获得的权重更新公式假设我们使用的是 S 型单元；换句话说，我们在神经网络的每个节点中都使用 S 型函数作为激活函数。输出层和隐藏层权重更新规则的通用形式分别如下：


  ![ $$ {\mathrm{w}}_{\mathrm{ij}}={\mathrm{w}}_{\mathrm{ij}}+\alpha \ast \left({\mathrm{y}}_{\mathrm{j}}-{\mathrm{y}}_{\mathrm{j}}^{\prime}\right)\ast
  \mathrm{G}\left({\mathrm{y}}_{\mathrm{j}}^{\prime}\right)\ast {\mathrm{x}}_{\mathrm{ij}}
  $$ ](img/A449374_1_En_11_Chapter_Equt.gif)


  ![ $$ {\mathrm{w}}_{\mathrm{ij}}={\mathrm{w}}_{\mathrm{ij}}+\alpha \ast \mathrm{G}\left({\mathrm{y}}_{\mathrm{j}}^{\prime}\right)\ast
  \sum \limits_{\mathrm{k}\in \mathrm{Stream}}{\delta}_{\mathrm{k}}\ast {\mathrm{w}}_{\mathrm{k}\mathrm{j}}\ast
  {\mathrm{x}}_{\mathrm{ij}} $$ ](img/A449374_1_En_11_Chapter_Equu.gif)


  其中 G(y[j]^′)表示在激活函数输出值处评估的激活函数的导数，我们知道这个值可以用 w 来表示。回想一下，S 型函数的导数是 F(x) * (1 - F(x))；这非常容易计算和使用，也是
  S 型函数成为多层神经网络经典激活函数的主要原因之一。




  图 11-13 展示了另一种流行的激活函数——双曲正切函数，这是一种对称函数，其输出范围在 [-1;1] 之间，其表示和计算公式如下：


  ![ $$ \tanh \left(\mathrm{x}\right)=\frac{\sinh \left(\mathrm{x}\right)}{\cosh \left(\mathrm{x}\right)}=\frac{{\mathrm{e}}^{\mathrm{x}}-{\mathrm{e}}^{-\mathrm{x}}}{{\mathrm{e}}^{\mathrm{x}}+{\mathrm{e}}^{-\mathrm{x}}}
  $$ ](img/A449374_1_En_11_Chapter_Equv.gif)


  ![A449374_1_En_11_Fig13_HTML.jpg](img/A449374_1_En_11_Fig13_HTML.jpg)


  **图 11-13**


  双曲正切函数，其输出值范围在 (-1;1) 之间


  如今，一种正在取代 Sigmoid 函数及其他类似平滑函数的流行激活函数是修正线性单元，即 ReLU（图 11-14）。与 Sigmoid 和平滑函数不同，ReLU
  不存在深度学习中的梯度消失问题，例如在训练超过三层的神经网络时。其公式极其简单：


  ![ $$ \mathrm{ReLU}\left(\mathrm{x}\right)=\max \left(0,\mathrm{x}\right) $$ ](img/A449374_1_En_11_Chapter_Equw.gif)


  换句话说，ReLU 让所有正值原封不动地通过，但将所有负值设置为 0。尽管更新的激活函数正逐渐受到关注，但目前大多数深度神经网络仍使用 ReLU 或其[密切相关的变体](https://en.wikipedia.org/wiki/Rectifier_%28neural_networks%29)。


  ![A449374_1_En_11_Fig14_HTML.jpg](img/A449374_1_En_11_Fig14_HTML.jpg)


