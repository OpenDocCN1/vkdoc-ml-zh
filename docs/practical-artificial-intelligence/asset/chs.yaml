  \ attribs, goalAttrib);\nvardtree = DecisionTree.Learn(trainingDataSet, DtTrainingAlgorithm.Id3);\n\
  dtree.Visualize();\nListing 10-5\n在控制台应用程序中测试我们的 DecisionTree 类和 ID3 算法\n```\n\n\
