  \n## 总结\n\n在本章中，我们研究了决策树，这是一种分类模型的实现，具有树状数据结构，通过从根节点遍历到任意叶节点可以找到决策规则。我们描述了生成决策树最基本、最流行的算法（ID3），并详细介绍了其在\
  \ C# 中的实现；该实现包括一个 Windows Forms 应用程序，该应用程序使用 MSAGL 以图形方式显示生成的决策树。\n\n我们还解释了 C4.5\
  \ 算法，它是 ID3 的改进版本，处理了连续属性、训练数据集中的缺失值以及过拟合问题。该算法的 C# 实现包含了最重要的编码细节，主要在于处理连续属性的特性。剪枝技术的实现留给读者作为练习。\n\
  \n"
- '# 11. 神经网络


  在本章中，我们将讨论人工神经网络，这是一类在监督学习领域（也适用于无监督学习和强化学习）非常流行的算法，它试图模仿或建模人脑的功能，以解决那些依赖于学习或逼近由训练数据表（以（数据，分类）对的形式定义）定义的函数
  F 的问题，这与支持向量机和决策树类似。这个函数 F 是学习过程的结果，被称为近似函数或学习函数。它随后被用于对新输入数据进行分类或预测其类别。


  正如我们目前所见，人工智能中使用的许多算法、方法和工具——尤其是在监督学习中——与其他知识领域密切相关，例如代数、数学分析和数学优化。因为生活中的学习涉及一个我们在时间线上“改进”或学习如何做某些事情的过程（考虑时间因素），而这正是优化算法的目标——通过迭代过程优化（最小化或最大化）一个函数——那么神经网络也不例外，我们将保持使用优化技术来学习和构建一个预测输入数据类别的函数的相同模式。


  在本章中，我们将介绍神经网络，描述其工作原理以及它们如何模拟我们的神经元协同工作的方式。我们将实现感知器算法，这是最古老、最简单的神经网络模型之一。我们还将实现
  Adaline 神经网络模型，因为它将是对多层神经网络主题的有用介绍；它使用的优化技术类似于本章将要考察的最后一个算法，即用于多层神经网络学习的流行反向传播算法。


  注意


  神经网络可应用于多种问题，其中值得提及的有模式、形状、人脸和手写识别、自动驾驶汽车等。脑式计算风格的研究源于 McCulloch 和 Pitts（1943 年）的工作，以及后来
  Hebb 著名的《行为的组织》（1949 年）。




  ## 什么是神经网络？


  神经元是神经系统的一种细胞（图 11-1），它拥有一层质膜，使其能够接收来自外部元素的刺激，并将信号传递给其他神经元或人脑中不同类型的细胞。它们接收或发送的信号是电化学信号；因此，神经元负责收集、处理并传递电化学信号。当多个神经元通过其突触连接时，就称它们构成了一个神经网络。在这个网络中，当从所有与之相连的其他神经元接收到的电化学信号的激发强度足够高时，神经元就会触发或发送一个信号。


  ![A449374_1_En_11_Fig1_HTML.jpg](img/A449374_1_En_11_Fig1_HTML.jpg)


  图 11-1


  生物神经元；树突代表来自其他神经元的信号输入，轴突代表我们神经元的输出。我们可以将神经元的结构理解为：输入节点称为树突，输出节点称为轴突，连接边称为突触。


  在数学人工智能世界中寻找一个类比模型，可以将神经元视为一个数学对象或函数，它接收所有与之相连的神经元输入的数值 x1, x2, …, xn，并将这些值组合起来，通过为每个连接关联权重值
  w1, w2, …, wn 来计算加权和，以此赋予每个连接一定的“相关性”。因此，X = w1 * x1 + w2 * x2 + … + wn * xn 就是到达神经元胞体的值。最终输出的值可以是一个信号，也可以是零（无信号）。为了确定信号（输出）的强度，我们通常使用一种称为**激活函数**的东西；该函数决定了输出值，并且会根据所用神经元的类型而变化。


  因此，神经网络（NN）就是上述神经元的集合；这些神经元之间的关系可以描述为形成一个图，其中从神经元 i 到神经元 j 的边表示对神经元 j 的输入，以及从神经元
  i 到神经元 j 的输出（图 11-2）。


  ![A449374_1_En_11_Fig2_HTML.jpg](img/A449374_1_En_11_Fig2_HTML.jpg)


  图 11-2


  神经网络作为图；神经元 4 和 5 接收来自神经元 1、2 和 3 的输入，而神经元 1、2 和 3 则与神经元 4 和 5 有输出连接。


  在接下来的章节中，我们将研究单单元神经网络，即由单个神经元组成的网络。在单神经元网络中，可以认为输入来自某些未知的神经元，其值与表示训练数据的向量相匹配。输出则用于对输入训练数据进行分类。


  注意


  一个人工神经元可以看作是一个数学函数 F = A(x1 * w1 + … + xn * wn)，其中 xi 是输入；wi 是用于增强或削弱与其他神经元连接的权重，而
  A 是最终决定输出信号强度的激活函数。


  ## 感知机：单一神经网络


  感知机是一个单一神经网络单元，遵循前述相同的过程：它接收 n 个输入 x1, …, xn，然后计算加权和 x1 * w1 + … + xn * wn，最后应用一个激活函数来获得输入数据的输出或分类。对于感知机，该函数通常如下所示：


  ![ $$ \mathrm{f}\left(\mathrm{x}\right)=\Big\{{\displaystyle \begin{array}{l}1\kern0.50em
  \ \ x\ge T\\ {}0\ \ \ \ otherwise\end{array}} $$ ](img/A449374_1_En_11_Chapter_Equa.gif)


  T 是一个称为阈值的值；它用于将加权和与阈值进行比较，以确定是否应该发送信号。因此，感知机可以表示为图 11-3 所示。


  ![A449374_1_En_11_Fig3_HTML.jpg](img/A449374_1_En_11_Fig3_HTML.jpg)


  图 11-3


  感知机计算输入和权重的加权和，将该值提交给激活函数 F，并且当且仅当 F 大于或等于给定阈值时，才将信号传输给其他神经元。


  我们已经了解了信息在感知机中的流动方式；请记住，所分析流程的目的是为输入数据提供分类。那么，我们如何训练它来正确预测新的输入数据呢？


  注意


  感知机由弗兰克·罗森布拉特于 20 世纪 50 年代创建，旨在将视网膜建模为人工神经网络。


  首先，感知机是一个线性分类器（回顾第 9 章，支持向量机也是线性分类器）；它试图找到一个权重向量和一个阈值，使得问题的空间被划分为 A 类和 B 类。权重向量和阈值将定义其中一个可能的分类超平面。如果我们在二维空间中，那么超平面就是一条线；如果在三维空间中，超平面就是一个平面，以此类推。如果训练数据集是线性可分的，那么训练数据中的所有点将始终位于分类超平面的一侧或另一侧。


  正如我们在第 9 章中所做的那样，让我们考虑一条直线的方程 y = mx + b，其中 m 是直线的斜率——或者更一般地说，是直线的梯度——而 b 是决定直线向左或向右偏移的偏置——即直线与
  y 轴的截距（图 11-4）。


  ![A449374_1_En_11_Fig4_HTML.jpg](img/A449374_1_En_11_Fig4_HTML.jpg)


  图 11-4


  考虑直线方程 mx + b = y，那么 m 定义了直线的斜率，b 定义了直线与 y 轴的截距，或者等价地，定义了直线的左右偏移


  因此，感知机中的训练或学习过程将包括对权重（直线的斜率）以及偏置进行调整（通过多次迭代随时间进行），以尝试找到一条直线或一般情况下找到一个超平面，能够正确地对所有训练数据进行分类；换句话说，就是找到一条将训练数据集划分为两个类别的直线。


  感知机算法首先为权重向量（通常在 [0, 1] 范围内）和偏置设置随机值。这将导致构建一个随机的分类超平面，或者在二维情况下（权重向量有两个分量），这将导致构建一条可能正确也可能不正确地对训练数据集进行分类的直线。然后，为了优化分类超平面并迫使其正确地对所有样本进行分类，会遍历整个训练数据集，并且每次检测到单个训练数据分类错误时，都会通过增加或减少与该训练数据分量相关的权重来进行修正；请记住，对于任何训练数据
  (x1, …, xn) 中的每个分量 xi，我们都有与之关联的某个 wi，并且所有这些都组合在加权和 x1 * w1 + … + xn * wn 中。


  注意




  感知机收敛定理指出，对于任何线性可分的数据集，感知机学习规则保证能在有限次迭代内找到解。


  因此，感知机的学习过程本质上是一种优化技术，我们通过缓慢改变分类超平面的斜率（或梯度）和偏置，将其移动到能正确分类所有训练数据的位置，从而改进分类超平面（图 11-5）。


  ![A449374_1_En_11_Fig5_HTML.jpg](img/A449374_1_En_11_Fig5_HTML.jpg)


  图 11-5


  在图中，直线 1 错误分类了两个红点；因此，我们修改权重和偏置，将其稍微向右移动；然后分类超平面 2 也错误分类了一个红点。最终，分类超平面 3 没有犯任何错误，正确地将红点和蓝点分开。


  感知机算法的伪代码如下：


  1.  将权重和偏置初始化为 [0, 1] 范围内的随机值。

  2.  如果满足停止条件，则结束。

  3.  遍历整个训练数据集，每次选取一个训练数据 (x, y)，其中 x 是特征向量，y 是其分类。

  4.  计算感知机对训练数据 x 的输出 y[x]。

  5.  如果 ![ $$ \mathrm{y}!={\mathrm{y}}_{\mathrm{x}} $$ ](img/A449374_1_En_11_Chapter_IEq1.gif)，则：按照以下规则修正每个权重：


  ![ $$ {\mathrm{w}}_{\mathrm{i}}={\mathrm{w}}_{\mathrm{i}}+\alpha \ast \left(\mathrm{y}-{\mathrm{y}}_{\mathrm{x}}\right)\ast
  {\mathrm{x}}_{\mathrm{i}} $$ ](img/A449374_1_En_11_Chapter_Equb.gif)


  同时使用以下公式修正偏置：


  ![ $$ \mathrm{b}=\mathrm{b}+\alpha \ast \left(\mathrm{y}-{\mathrm{y}}_{\mathrm{x}}\right)
  $$ ](img/A449374_1_En_11_Chapter_Equc.gif)


  6.  转到步骤 2。


  伪代码的第 5 步包含了所谓的感知机学习规则；算法中完成的所有学习都封装在修改权重的公式中。为了理解这个学习公式，让我们从头开始重构它。


  首先，注意到当 w · x < 0（其中 · 表示点积，即前面提到的加权和）且 x 的正确分类为正时，从几何上可以解释为向量 w 和 x 之间的夹角大于 90
  度，因此我们需要将 w 向 x 的方向旋转，使其进入正空间。同样地，如果 w · x > 0 且 x 的正确分类为负（或小于零），则向量 w 和 x 之间的夹角小于
  90 度，必须将 w 旋转远离 x。


  注意


  a • b 运算表示向量 a 和 b 之间的点积。当 a 和 b 垂直时，a • b = 0。


  因此，我们已经知道，将权重更新为 w + x 或 w - x 可以几何解释为将 w 向 x 的方向或相反方向移动；此操作旨在为训练数据 x 获得正确的分类。现在，为了将上述两种情况合并为一个，我们将添加项
  ![ $$ \left(\mathrm{y}-{\mathrm{y}}_{\mathrm{x}}\right) $$ ](img/A449374_1_En_11_Chapter_IEq2.gif)
  作为 x 的乘数。让我们分析这个项的可能取值，以理解它总能为我们提供 x 的正确符号。


  *   如果 ![ $$ \mathrm{y}={\mathrm{y}}_{\mathrm{x}} $$ ](img/A449374_1_En_11_Chapter_IEq3.gif)，则
  ![ $$ \mathrm{y}-{\mathrm{y}}_{\mathrm{x}}=0 $$ ](img/A449374_1_En_11_Chapter_IEq4.gif)，这意味着权重没有变化，因为
  x 的分类是正确的。

  *   如果 ![ $$ \mathrm{y}>{\mathrm{y}}_{\mathrm{x}} $$ ](img/A449374_1_En_11_Chapter_IEq5.gif)，则
  ![ $$ \mathrm{y}-{\mathrm{y}}_{\mathrm{x}}>0 $$ ](img/A449374_1_En_11_Chapter_IEq6.gif)，这意味着需要增加权重，因为
  ![ $$ \mathrm{y}>{\mathrm{y}}_{\mathrm{x}} $$ ](img/A449374_1_En_11_Chapter_IEq7.gif)；即，我们需要增加权重，使得
  w · x 为我们提供更高的值，从而训练数据将其分类为 1 而不是 0。

  *   如果 ![ $$ \mathrm{y}<{\mathrm{y}}_{\mathrm{x}} $$ ](img/A449374_1_En_11_Chapter_IEq8.gif)，则
  ![ $$ \mathrm{y}-{\mathrm{y}}_{\mathrm{x}}<0 $$ ](img/A449374_1_En_11_Chapter_IEq9.gif)，这意味着需要减少权重，因为
  ![ $$ \mathrm{y}<{\mathrm{y}}_{\mathrm{x}} $$ ](img/A449374_1_En_11_Chapter_IEq10.gif)。解释与上一点类似。


  因此，我们现在有了更新规则 ![ $$ \mathrm{w}+\left(\mathrm{y}-{\mathrm{y}}_{\mathrm{x}}\right)\ast
  \mathrm{x} $$ ](img/A449374_1_En_11_Chapter_IEq11.gif) 的合理解释，并且我们得出结论，将最后一项乘以 α，α
  是 (0, 1) 范围内的一个值，称为学习率。


  学习率控制感知机学习的速度，或者等价地说，控制我们在每一步改变权重和偏置的程度。从几何角度来看，它可以看作是将 w 向量向训练数据向量 x 旋转或远离其旋转的程度。为了保证收敛并且不越过问题的解，我们必须为学习率选择较小的值；通常选择
  0.05。


  使用类似的方法，我们可以推导出更新偏置的公式，但这留给读者作为练习。




  ### 实际问题：实现感知器神经网络


  为了在 C# 中实现感知器，我们将创建一个名为 `SingleNeuralNetwork` 的抽象类，该类将使我们能够轻松开发感知器以及任何我们需要实现的单单元神经网络，因为它们在结构上具有相似的特征，主要变化仅在于其学习规则。此类如清单
  11-1 所示。


  ```

  public abstract class SingleNeuralNetwork

  {

  public List<TrainingSample> TrainingSamples{ get; set; }

  public int Inputs { get; set; }

  public List<double> Weights { get; set; }

  public readonly Random Random = new Random();

  protected readonly double LearningRate;

  protected double Bias= 0.5;

  protected SingleNeuralNetwork(IEnumerable<TrainingSample> trainingSamples, int inputs,
  double learningRate)

  {

  TrainingSamples = new List<TrainingSample>(trainingSamples);

  Inputs = inputs;

  Weights = new List<double>();

  for (var i = 0; i < inputs; i++)

  Weights.Add(Random.NextDouble());

  LearningRate = learningRate;

  }

  public abstract void Training();

  public int Predict(IList<double> objects)

  {

  var sum = 0.0;

  for (var i = 0; i < Inputs; i++)

  sum += Weights[i] * objects[i];

  return sum + Bias > 0 ? 1 : 0;

  }

  public List<int> PredictSet(IEnumerable<IList<double>> objects)

  {

  var result = new List<int>();

  foreach (var obj in objects)

  result.Add(Predict(obj));

  return result;

  }

  }

  清单 11-1

  SingleNeuralNetwork 抽象类

  ```


  该类包含以下字段或属性：


  *   `TrainingSamples`：与 SVM 章节中使用的类相同；它包含一个表示训练数据的特征向量（双精度值）和一个定义该训练数据正确分类的整数。

  *   `Inputs`：表示感知器输入数量的整数。

  *   `Weights`：表示单单元神经网络权重向量的双精度值列表。

  *   `Random`：用于获取随机值的字段。

  *   `LearningRate`：感知器的学习率。

  *   `Threshold`：感知器的阈值；初始值设为 0.5。


  在类构造函数中，我们将权重初始化为 [0, 1] 范围内的随机值；构造函数之后是一组方法，详细说明如下：


  *   `Training()`：一个虚方法，每个继承自 `SingleNeuralNetwork` 的类都将实现该方法以提供训练算法实现。我们将其标记为 `virtual`
  而非 `abstract`，是因为我们考虑到您可能不希望为单单元神经网络包含训练方法，而只想使用其包含的字段和属性。

  *   `Predict()`：计算加权和 ![ $$ \mathrm{S}={\mathrm{w}}_{\mathrm{i}}\ast {\mathrm{x}}_{\mathrm{i}}
  $$ ](img/A449374_1_En_11_Chapter_IEq12.gif) 并检查 ![ $$ {\mathrm{w}}_{\mathrm{i}}\ast
  {\mathrm{x}}_{\mathrm{i}}+\mathrm{b}>0 $$ ](img/A449374_1_En_11_Chapter_IEq13.gif)
  或等价地检查 ![ $$ {\mathrm{w}}_{\mathrm{i}}\ast {\mathrm{x}}_{\mathrm{i}}>-b $$ ](img/A449374_1_En_11_Chapter_IEq14.gif)。

  *   `PredictSet()`：使用前一个方法，预测作为参数传入的列表中每个数据的分类。


  请记住，感知器的目标是找到一个分类超平面，将数据点集划分为 A 类和 B 类。这种划分必须保证 A 类中的每个元素都位于超平面的一侧，而 B 类中的每个元素都位于另一侧。该超平面将满足方程
  wx + b = 0（如第 9 章所述）。因此，在 `Predict()` 方法中，我们将任何满足 wx + b > 0 的数据点 x 分类为属于类别 1；否则，将其设置为类别
  0 的成员。


  最后，继承自 `SingleNeuralNetwork` 抽象类的 `Perceptron` 类如清单 11-2 所示。


  ```

  public class Perceptron :SingleNeuralNetwork

  {

  public Perceptron(IEnumerable<TrainingSample> trainingSamples, int inputs, double
  learningRate)

  : base(trainingSamples, inputs, learningRate)

  { }

  public override void Training()

  {

  while (true)

  {

  var missclasification = false;

  foreach (var trainingSample in TrainingSamples)

  {

  var output = Predict(trainingSample.Features);

  var features = trainingSample.Features;

  if (output != trainingSample.Classification)

  {

  missclasification = true;

  for (var j = 0; j < Inputs; j++)

  Weights[j] += LearningRate*(trainingSample.Classification - output)*features[j];

  Bias+= LearningRate * (trainingSample.Classification - output);

  }

  }

  if (!missclasification)

  break;

  }

  }

  }

