  \ n x m（n 行，m 列）网格中的污垢。网格中的每个单元格都是一个整数 d，其中 d 表示该单元格中的污垢数量。当 d = 0 时，该单元格被认为是干净的。\n\
  \n机器人将具有以下特性：\n\n*   它一次移动一步，有四个可能的方向（左、上、右、下）。\n*   在完全清洁一个单元格之前，它不会离开，并且它一次只清理一个单位的污垢；也就是说，如果在一个脏单元格上，它将一次清理一个单位的污垢（留下\
  \ -1 的污垢），然后继续到下一个决策阶段。\n*   当所有地方都干净或者其任务超过给定的时间（以毫秒为单位）时，它会停止。\n\n我们的清洁机器人将依赖以下谓词和函数：\n\
  \n*   `IsDirty()` 是一个谓词，用于确定机器人所在的单元格是否脏。\n*   `IsTerrainClean()` 是一个谓词，用于确定地形上的每个单元格是否都干净。\n\
  *   `MoveAvailable(int x, int y)` 是一个谓词，用于确定移动到地形上的 (x, y) 是否合法。\n*   `SelectMove()`\
  \ 是一个函数，用于随机选择一个移动方向。\n*   `Clean()` 是一个函数，用于从当前单元格（即机器人当前所在的单元格）清理一个单位的污垢（-1）。\n\
  *   `Move(Direction m)` 是一个函数，用于将机器人向方向 m 移动。\n*   `Print()` 是一个函数，用于打印地形。\n*  \
  \ `Start(int milliseconds)` 是一个函数，用于命令机器人开始清理。此方法的代码与前面解释的机器人行为相匹配。整数参数 `milliseconds`\
