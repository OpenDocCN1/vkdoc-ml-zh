  if (p is Not && q is Not)\nreturn LiteralEquals((p as Not).P, (q as Not).P);\nreturn\
  \ false;\n}\npublic bool IsLiteral(Formula p)\n{\nreturn p is Variable || (p is\
  \ Not && (p as Not).P is Variable);\n}\n}\n清单 2-1\n子句类\n```\n\n`Clause`类包含以下方法：\n\
  \n*   `public bool Contains(Formula literal)`：确定给定的文字是否属于该子句\n*   `public Clause\
