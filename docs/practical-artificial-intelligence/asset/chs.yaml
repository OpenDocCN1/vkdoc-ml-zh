  ```




  与无状态清洁机器人相比，清洁代理为我们提供了哪些优势？为了回答这个问题，我们首先注意到，清洁代理所使用的策略（通过保存已访问单元格坐标来记录其环境历史）非常直观。想象一下，你需要在一个拥有超过
  100 家商店的大城市里寻找某种产品 X；你会如何完成这项任务？直观上，你会每家商店只去一次，然后在脑海中记录下你已经去过那家店且产品不在那里，从而节省了再次访问的时间。接着你会一家接一家地移动，直到找到产品，始终牢记已访问过的商店是在浪费时间。这基本上就是我们的清洁代理试图做的事情，但有一个例外：有时可能不得不重新访问已经去过的单元格，因为代理只能移动到相邻的单元格，而所有相邻单元格可能都已被访问过。在图
  3-4 中，我们可以看到清洁代理与清洁机器人的基本对比。


