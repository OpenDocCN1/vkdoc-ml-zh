- "# 2. 自动定理证明与一阶逻辑\n\n延续第一章 1 的思路，本章我们将首先介绍一个与人工智能和逻辑相关的主题：自动定理证明。这是人工智能的一个领域，它服务于数学家的研究，并协助他们证明定理、推论等。在本章中，我们还将用一些篇幅来介绍一阶逻辑，这是一种通过允许或包含量词（全称量词和存在量词）来扩展命题逻辑的逻辑，并提供了一个更完整的框架，以便轻松表示日常生活中可能出现的不同类型的逻辑场景。\n\
  \n同时，我们将通过插入子句和 CNF C#类，并描述一种解决 SAT（可满足性）问题的非常重要的方法——DPLL 算法，来继续扩展第一章 1 中引入的`Formula`层次结构。实践问题将帮助我们更好地理解后续描述的每一个概念。本章最后将介绍一个简单的清洁机器人，它将使用一阶逻辑的一些术语，并展示它们如何应用于现实问题中。\n\
  \n## 自动定理证明\n\n自动定理证明器（ATP）是一种计算机程序，它可以生成并检查数学定理，并搜索定理真实性的证明；即其陈述总是为真。定理使用某种数学逻辑（如命题逻辑、一阶逻辑等）来表达。在这种情况下，我们只考虑使用命题逻辑作为其语言的\
  \ ATP。我们可以将 ATP 的工作流程想象为图 2-1 中所示。\n\n![A449374_1_En_2_Fig1_HTML.jpg](img/A449374_1_En_2_Fig1_HTML.jpg)\n\
  \n图 2-1\n\nATP 工作流程图\n\nATP 最初是为数学计算而创建的，但最近由于与之相关的广泛应用潜力，已在科学界引起关注。ATP 的众多应用之一是为数学定理数据库增加智能；换句话说，使用自动定理证明器在数学定理数据库中巧妙地查询等价定理。ATP\
  \ 将用于验证数据库中的某个定理在数学上是否与用户输入的另一个定理等价。字符串匹配算法或类似技术对于此类应用来说不够好，因为用户可能以与数据库中存储方式不同的措辞来表达定理，或者所搜索的定理可能是现有定理的逻辑推论，而非直接克隆。\n\
  \n定理证明器和形式化方法的另一个应用可以在硬件和软件设计的验证中找到。硬件验证恰好是一项极其重要的任务。例如，现代微处理器设计中的错误，其商业成本可能非常巨大，因此设计验证至关重要。\n\
  \n软件验证同样至关重要，因为该领域的错误可能代价高昂。此类错误造成灾难性后果的例子包括阿丽亚娜 5 号火箭的毁坏（由简单的整数溢出问题引起，本可通过形式化验证程序检测到）以及奔腾\
  \ II 处理器浮点单元中的错误。\n\nATP 的经典应用当然还是其最初创建的目的——作为辅助数学家研究的工具。可以说，ATP 是数学家们最喜欢的机器人。\n\
  \n注意\n\n一些逻辑比其他的更强大，能够表达和证明更多的定理。命题逻辑通常是其中最弱、最简单的。\n\n定理证明器因证明搜索所需的人工指导量以及可用于表达待证明定理的逻辑语言的复杂程度而异。必须在自动化程度与逻辑语言的复杂程度之间进行权衡。\n\
  \n只有在语言受限的情况下，才能实现高度的自动化。灵活的高阶语言的证明通常需要人工指导，相关的定理证明器被称为证明助手。\n\n这种人工协助可以通过程序员事先给出提示，或在证明过程中通过提示与\
  \ ATP 进行交互来提供。\n\n最简单的 ATP 类型是 SAT（可满足性）求解器，它依赖命题逻辑作为定理语言。SAT 求解器非常有用，但命题逻辑的表达能力有限，布尔表达式可能会变得相当庞大。此外，SAT\
  \ 问题是第一个被证明为 NP（非多项式）完全复杂性的问题（S.A. Cook，《定理证明过程的复杂性》）。目前有大量关于寻找高效 SAT 求解启发式方法的研究。\n\
  \n\n\n在纯数学中，证明通常是非形式化的；它们通过同行评审来“验证”，旨在令人信服地传达证明如何运作的直观、清晰的概念，并且定理陈述应始终为真。自动定理证明器（ATP）提供形式化证明，其输出可以是如图\
  \ 1-8 所示的布尔值“是”、“否”（真、假），或者如果发现陈述为假，则可能输出一个反例。\n\n注意\n\n使用模型检测方法进行软件和硬件验证与命题逻辑配合良好。在考虑问题的状态机描述后，得到表达式，并以二叉决策树的形式进行处理。\n\
  \n自动定理证明器（ATP）通常可以处理两类任务：它们可以检查其逻辑中的定理，或者可以自动生成证明。\n\n在证明检查时，ATP 接收一个形式化证明作为输入，该证明由一系列（步骤）公式组成，每个公式要么由一条公理证明，要么由应用于先前公式的推理规则证明：\n\
  \n```\n公式                    证明依据\nF1                       公理\nF2             \
  \          规则 X 和 F1\n...                       ...\n定理\n```\n\n这类证明在机械上非常容易检查；我们只需确保每个证明依据有效或应用正确即可。\n\
  \n然而，证明生成要困难得多。我们需要生成一系列公式，每个公式都有有效的证明依据，并保证最后一个公式是要证明的定理。对于简单问题，证明生成非常有用；例如，类型推断（C#、Java）、Web\
  \ 应用程序的安全性等。\n\n到目前为止，我们描述了一个 SAT 求解器——二叉决策树，它适用于小问题。然而，其规模是指数级的，并且在最坏情况下，为了检查可满足性，我们需要遍历整棵树。因此，在后续章节中，我们将更详细地讨论这个主题，以及如何使用其他方法获得更好的结果。\n\
  \n注意\n\n1976 年，肯尼斯·阿佩尔和沃尔夫冈·哈肯使用一个程序证明了四色定理，该程序对数十亿种情况进行了庞大的案例分析。四色定理指出，只需使用四种颜色就可以绘制世界地图，并保证不会有任何两个相邻国家共享同一种颜色。\n\
  \n## 实际问题：C#中的子句和 CNF 类\n\n在本节中，我们将通过添加`Clause`和`Cnf`类来增强本章一直在开发的逻辑框架。在编写 DPLL 算法（可能是确定逻辑公式可满足性的最巧妙算法，也是自动定理证明的基本工具）时，我们将使用这些类。\n\
  \n在开始开发这个新增强功能之前，让我们简要了解一些定义，这些定义将有助于理解我们即将开发的类。\n\n文字要么是一个变量，要么是变量的否定（例如，p、`¬`p、q、¬q）。\n\
  \n子句是文字的析取 p1 `∨` p2 `∨` ... `∨` pm，每个 CNF 都是一组子句。从现在开始，我们将子句表示为{p1, p2, ... pm}，其中每个\
  \ pi（i = 1, 2, ... ,m）都是一个文字。\n\n在清单 2-1 中，我们展示了提议的`Clause`类。\n\n```\npublic class\
  \ Clause\n{\npublic List Literals { get; set; }\npublic Clause()\n{\nLiterals =\
