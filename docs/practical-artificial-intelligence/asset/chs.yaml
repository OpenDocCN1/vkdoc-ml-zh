- '# 14. 启发式算法与元启发式算法


  到目前为止，我们已经多次提到“启发式”这个词。我们在“火星车”章节中使用它来引入一种看似合乎逻辑且简单的方法，该方法运用了我们对现实的实用知识，并帮助我们为机器人实现了合理的移动。这种方法主要基于我们的经验，而非任何经过科学验证的程序。


  在计算机科学中，我们通常面临的挑战是设计算法，使其既能提供良好的时间复杂度，又能为给定问题提供良好的解（如果可能的话，最优解）。启发式算法是一种可以轻易放弃上述任一前提，甚至两者都放弃的方法。例如，一个启发式算法可以为一个问题找到许多解，其中一些解可能不正确或不可行，而另一些可能是最优的。同样，它可以在短时间内执行，为问题提供可行解，但可能这些解中没有一个是全局最优的。这类算法通常应用于本质上困难的问题；例如，NP-难问题，如旅行商问题、聚类、车辆路径规划等。由于这些问题的性质及其高复杂性，我们必须依赖那些能够输出问题解（或部分解）的方法，以帮助我们最终获得尽可能接近最优解的确定解。


  一种非常特殊的启发式算法是元启发式算法，它是一个与问题无关的迭代过程，其中通过各种策略或准则组合多种启发式算法，试图引导搜索找到优质解。元启发式算法已变得非常流行；其中一些算法基于生物或化学过程，因其能够通过应用在合理时间内执行的简单算法来找到复杂问题的优质解而引起了极大兴趣。


  在本章中，我们将讨论启发式算法，特别是爬山法，并将介绍两种著名的元启发式算法；即，我们将研究遗传算法和禁忌搜索。还将包含实现前两种方法的实际问题。


  注意


  人工智能中的许多算法本质上是启发式的，或者在其执行过程中使用了启发式规则。一个判断给定电子邮件是否为垃圾邮件的应用程序会使用许多启发式规则来最终做出决策。




  ## 什么是启发式方法？


  启发式方法是一种源自经验、常识或基于专业知识的推测的方法，旨在为通常极难求解（NP-难）的问题提供或帮助提供实用的解决方案，因为最优或良好的可行解过于复杂而难以获得。启发式方法可以通过提供捷径来加速寻找良好可行解的过程。这种加速过程通常通过搜索算法实现，我们在其中遍历一棵表示可能解空间的树。应用特定问题的启发式方法可以显著减少树搜索的范围。滑动拼图（如图
  14-1 所示）就是这样一个例子，这款流行游戏的状态空间（所有可能的游戏配置）可以用一棵树来表示，树中的节点表示游戏的不同状态或配置。每个父节点最多有四个子节点，分别代表将一块拼图移动到空白区域的四种可能移动方式。


  ![A449374_1_En_14_Fig1_HTML.jpg](img/A449374_1_En_14_Fig1_HTML.jpg)


  图 14-1


  滑动拼图。左侧棋盘显示游戏未完成的状态，右侧棋盘显示目标状态。


  启发式方法掌握关于每个状态与目标状态接近程度的一些信息，这使得它们能够优先探索最有希望的路径。概括来说，启发式方法的一些最普遍特征如下：


  *   它们不保证一定能找到解，即使解可能存在。

  *   如果找到了解，也不保证该解是最优的（最小或最大）。

  *   有时（无法预先定义）会在合理的时间内找到一个良好的解。


  我们通常通过启发式函数来使用启发式方法。该函数为问题的每个状态分配一个数值，并定义该状态在从给定点（节点）尝试到达目标状态方面的前景如何；它通常记为 H(e)。启发式函数有两种解释。它可以指示状态
  e 与目标状态的接近程度，这意味着我们偏好启发式值最低的状态；或者它可以指示状态 e 与目标状态的距离，这意味着我们偏好启发式值最高的状态。在这两种情况下，我们分别是在最小化或最大化启发式函数。


  注意


  对于拼图游戏，当前棋盘上某块拼图的位置与目标棋盘上同一块拼图的位置之间计算的曼哈顿距离之和，就是一个启发式函数。


  ## 爬山法


  在爬山法或启发式方法中，我们从一个初始的随机解开始，并将其设为当前解。我们找出当前解的所有邻居解，然后执行一个步骤，将当前解定义为对要最小化（或最大化）的函数提供最大减少（或增加）的那个邻居解。爬山法是一种优化技术，可能会陷入局部最小值；因此，它很容易无法找到全局最优解。尽管存在局部性问题，它仍被广泛应用于人工智能中那些时间限制严格、且肯定可以利用短执行时间算法的问题。


  存在两种类型的爬山法：


  *   不可逆式：如果某条路径被证明无益，我们避免返回该状态集的子集。

  *   试探式：如果我们确定所选路径不合适，可以回溯到旧路径。


  在本书中，我们将重点讨论第一种方法（不可逆式），它与本节开头描述的爬山法最为相似。


  在不可逆爬山法中，我们通过两种备选方案来确定下一步要处理的解：


  *   简单爬山：我们选择处理或扩展当前邻居集中第一个比当前解更优的解。因此，过程在此停止，并且不会扫描当前解的所有邻居。

  *   最大坡度爬山：我们选择处理或扩展当前邻居集中所有解中最优的那个解。因此，过程在扫描完当前解的所有邻居后停止。


  在这两种情况下，如果当前邻居集中的每个解都比当前解更差或相等，则过程结束。


  注意


  爬山法是一种迭代改进的优化技术，是最佳优先搜索算法的一种变体，属于贪心算法家族。


  图 14-2 展示了爬山法如何找到局部最优解，用蓝点表示。


  ![A449374_1_En_14_Fig2_HTML.jpg](img/A449374_1_En_14_Fig2_HTML.jpg)


  图 14-2


  在这种情况下，我们最小化目标函数，并沿着橙色点的路径“下山”，直到到达蓝点，即局部最小值。我们正在最小化，因此蓝点是局部最小值。


  该算法的伪代码如下：


  ```

  HillClimbing(function F)

  {

  currentSolution = RandomSolution();

  while (No Improvement)

  vicinity = Neighbors(currentSolution);

  nextEval = -INF;

  nextSolution = null;

  for all x in vicinity

  {

  if (Evaluate(x) >nextEval)

  {

  nextSolution= x;

  nextEval = Evaluate (x);

  }

  }

  if nextEval<= Evaluate (currentSolution)

  return currentSolution;

  currentNode = nextSolution;

  }

  ```


  爬山法属于局部搜索算法家族。事实上，爬山法和局部搜索这两个术语有时可以互换使用，意味着它们被视为同一种算法，并且它们代表了一类称为基于单一解的元启发式算法，其中包括模拟退火、禁忌搜索等基于局部搜索的流行方法。


  注意


  局部搜索是一种用于解决计算上困难的优化问题的启发式方法；它通过在候选解空间（搜索空间）中从一个解移动到另一个解，应用局部变化，直到找到被认为最优的解、达到最大迭代次数或时间限制耗尽为止。




  ## 实践问题：实现爬山算法


  在本节中，我们将实现一个用于优化（最小化）连续目标函数的爬山算法。该过程中的邻域是通过考虑围绕当前解的半径为 R 的 n 维球面上的点集来计算的（图 14-3）。


  ![A449374_1_En_14_Fig3_HTML.jpg](img/A449374_1_En_14_Fig3_HTML.jpg)


  图 14-3


  当前解（蓝色点）的邻域由围绕它的 n 维球面上的所有红色点构成。在此例中，n = 1；即，1 维球面是一个圆。


  n 维球面（球体的一般化形式）的坐标可根据以下公式获得：


  ![ $$ {\displaystyle \begin{array}{c}{\mathrm{x}}_1=\mathrm{r}\ast \cos \left({\phi}_1\right)\\
  {}{\mathrm{x}}_2=\mathrm{r}\ast \sin \left({\phi}_1\right)\ast \cos \left({\phi}_2\right)\\
  {}{\mathrm{x}}_3=\mathrm{r}\ast \sin \left({\phi}_1\right)\ast \sin \left({\phi}_2\right)\ast
  \cos \left({\phi}_3\right)\\ {}\dots \\ {}{\mathrm{x}}_{\mathrm{n}-1}=\mathrm{r}\ast
  \sin \left({\phi}_1\right)\ast \dots \ast \sin \left({\phi}_{\mathrm{n}-2}\right)\ast
  \cos \left({\phi}_{\mathrm{n}-1}\right)\\ {}{\mathrm{x}}_{\mathrm{n}}=\mathrm{r}\ast
  \sin \left({\phi}_1\right)\ast \dots \ast \sin \left({\phi}_{\mathrm{n}-2}\right)\ast
  \sin \left({\phi}_{\mathrm{n}-1}\right)\end{array}} $$ ](img/A449374_1_En_14_Chapter_Equa.gif)


  其中 r 是 n 维球面的半径，![ $$ {\phi}_1,{\phi}_2,\dots {\phi}_{\mathrm{n}-1} $$ ](img/A449374_1_En_14_Chapter_IEq1.gif)
  是一组角度坐标，前 n - 2 个坐标的取值范围为 [0; π]，最后一个坐标的取值范围为 [0; 2π]。


  为了简化数学函数方面的工作，我们将添加对 `MathParser` NuGet 包的引用。通过使用此包，我们可以将函数定义为字符串，并在任意所需点对其进行求值。因此，我们将在
  `HillClimbing` 类中拥有一个 `Function` 公共属性，如代码清单 14-1 所示。


  ```

  public class HillClimbing

  {

  public Function Function{ get; set; }

  public double Step { get; set; }

  public double Radius { get; set; }

  private static readonly Random Random = new Random();

  public HillClimbing(Function function, double step, double radius)

  {

  Function = function;

  Step = step;

  Radius = radius;

  }

