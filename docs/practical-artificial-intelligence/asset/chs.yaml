- "# 13. 聚类与多目标聚类\n\n到目前为止，我们已经讨论了与监督学习相关的几种方法。在这些方法中，我们通过包含标记数据的训练数据集来逼近一个函数。在本章中，我们将开始探讨无监督学习，这是机器学习的一种范式，我们从未标记的数据集中推断函数和数据结构。\n\
  \n无监督学习方法不再拥有“训练”数据集。因此，无监督学习中的训练阶段消失了，因为数据没有关联的分类；正确的分类被认为是未知的。因此，无监督学习比监督学习主观得多，因为分析没有简单的目标，比如预测响应。无监督学习方法的一般目标，尽管听起来可能不精确，是找到描述被分析数据结构的模式。由于从实验室仪器或任何测量设备获取未标记数据通常比获取标记数据更容易，无监督学习方法正越来越多地应用于需要学习数据结构的多种问题。\n\
  \n在本章中，我们将探讨与无监督学习相关的最重要的学习任务之一——聚类，以及它的一个变体，即同时考虑多个要最小化或最大化的目标函数，这被称为多目标聚类。本章将描述并实现一个广泛聚类算法家族中的方法；具体来说，我们将实现\
  \ k-means 方法。此外，还将实现一些用于确定对象和聚类相似度的度量方法。\n\n注意\n\n监督学习和无监督学习算法都代表了数据挖掘应用中常用的知识提取技术。\n\
  \n\n\n## 什么是聚类？\n\n聚类是一大类算法的统称，其目标是将一组对象划分成多个组或簇，力求使同一组内的对象具有尽可能高的相似性，而不同组之间的对象具有尽可能高的差异性。此处的相似性与对象的某种属性相关；它可以是高度、重量、颜色、勇气，或数据集中包含的任何其他特征，通常以数值形式呈现。图\
  \ 13-1 展示了基于对象颜色的聚类。\n\n![A449374_1_En_13_Fig1_HTML.jpg](img/A449374_1_En_13_Fig1_HTML.jpg)\n\
  \n图 13-1\n\n根据颜色对一组对象进行聚类\n\n聚类在科学和商业的多个领域都有应用，例如天文学、心理学、医学、经济学、欺诈防范、建筑学、人口统计分析、图像分割等。\n\
  \n一个聚类算法通常由三个要素组成：\n\n*   **相似性度量**：用于确定两个对象之间相似度的函数。在图 13-1 的例子中，一个相似度函数可以是 `Color(x,\
  \ y)`，它输出一个整数，用于判断对象 x 和 y 在颜色上的等同程度。通常，输出的值越大，表示 x 和 y 之间的差异越大；输出的值越小，表示 x 和 y\
  \ 越相似。\n*   **准则函数或目标函数**：用于评估聚类质量的函数。\n*   **优化算法或聚类算法**：用于最小化或最大化准则函数的算法。\n\n\
  以下是一些最常用的相似性度量：\n\n*   n 维向量 a, b 的**欧几里得距离**：\n\n![ $$ \\mathrm{Euclidean}\\left(\\\
  mathrm{a},\\mathrm{b}\\right)=\\sqrt{\\sum \\limits_{\\mathrm{i}=1}^{\\mathrm{n}}{\\\
  left({a}_{\\mathrm{i}}-{b}_{\\mathrm{i}}\\right)}²} $$ ](img/A449374_1_En_13_Chapter_Equa.gif)\n\
  \n这是空间中两点之间的普通距离。\n*   n 维向量 a, b 的**曼哈顿距离**：\n\n![ $$ \\mathrm{Manhattan}\\left(\\\
  mathrm{a},\\mathrm{b}\\right)=\\sum \\limits_{\\mathrm{i}=1}^{\\mathrm{n}}\\mid\
  \ {a}_{\\mathrm{i}}-{b}_{\\mathrm{i}}\\mid $$ ](img/A449374_1_En_13_Chapter_Equb.gif)\n\
  \n这是欧几里得距离的一种近似，计算成本更低。\n*   属于 n x m 矩阵 T 的单元格的**闵可夫斯基距离**；p 是一个正整数，是前述距离的泛化形式：\n\
  \n![ $$ {\\mathrm{Minkowski}}_{\\mathrm{p}}\\left({T}_{\\mathrm{k}},{T}_{\\mathrm{h}}\\\
  right)=\\sqrt[\\mathrm{p}]{\\sum \\limits_{\\mathrm{i}=1}^{\\mathrm{m}}{\\left({T}_{\\\
  mathrm{k}\\mathrm{i}}-{T}_{\\mathrm{h}\\mathrm{i}}\\right)}²} $$ ](A449374_1_En_13_Chapter_Equc.gif)\n\
  \n在用于确定或评估聚类质量的准则函数或目标函数中，我们可以找到以下两种：\n\n*   **类内距离**，也称为**紧致性**：顾名思义，其前缀“intra”（内部的，在内的）表示它衡量的是簇（组）内数据点与簇质心之间的距离。簇质心是簇内所有数据点的平均向量。通常使用**误差平方和**作为衡量该距离的数学函数。\n\
  *   **类间距离**，也称为**隔离度或分离度**：顾名思义，其前缀“inter”（之间的）表示它衡量的是不同簇之间的远近程度。\n\n聚类算法家族可以分为层次聚类算法、划分聚类算法和贝叶斯聚类算法。图\
  \ 13-2 展示了不同聚类算法家族之间的关系。\n\n![A449374_1_En_13_Fig2_HTML.jpg](img/A449374_1_En_13_Fig2_HTML.jpg)\n\
  \n图 13-2\n\n聚类算法家族\n\n在本书中，我们将讨论层次聚类算法和划分聚类算法；贝叶斯聚类算法试图在数据点所有可能划分的集合上生成后验分布。这类算法与概率论和统计学等领域高度相关，因此留给读者作为补充研究。\n\
  \n注意\n\n聚类是一个众所周知的 NP 难问题，这意味着在确定性机器上无法开发或设计出该问题的多项式时间解法。\n\n\n\n## 层次聚类\n\n层次算法会从先前发现的簇中发掘新的簇；因此，新簇在嵌套于父簇之后便成为其子代，层次关系由此建立。层次算法可分为凝聚式与分裂式两种。\n\
  \n凝聚式（又称自底向上）层次算法开始时，每个对象都是一个独立的单元素簇，随后不断合并最相似的簇，形成规模递增的簇，直至所有对象归入一个簇为止。\n\n分裂式（又称自顶向下）层次算法开始时，所有对象同属一个簇，每一步从当前簇集合中选择一个组进行分裂，当每个对象都成为独立簇时停止。\n\
  \n层次算法可以输出树状图——一种用于说明簇排列方式的二叉树状图。在树状图中，每一层代表一种不同的聚类结果。图 13-3 展示了一个对由点 a、b、c、d、e\
  \ 构成的数据集执行凝聚式聚类的示例，包括最终生成的簇以及对应的树状图。\n\n![A449374_1_En_13_Fig3_HTML.jpg](img/A449374_1_En_13_Fig3_HTML.jpg)\n\
  \n图 13-3\n\n凝聚式聚类示例\n\n由于点 a 与 b、c 与 d 分别距离最近，它们被聚为一簇。随后，距离最近的簇 {a, b} 与 {c, d}\
  \ 被合并，{e} 则作为另一个簇保留。最后，所有数据点被合并为一个包含全部数据点的簇；在此过程中，我们执行的是自底向上的操作。如何确定簇的相似度或距离？前面详述的度量或距离给出了两个数据点之间的相似度，但簇之间的相似度又如何衡量？下面介绍的度量方法可输出簇之间的相似度：\n\
  \n*   **平均连接聚类**：通过计算所有配对 (x, y) 的相似度或距离来确定簇 C1 与 C2 的相似度，其中 x 属于 C1，y 属于 C2。将这些值相加，最终除以\
  \ C1 和 C2 中对象的总数。因此，我们计算的是 C1 与 C2 之间距离的平均值。\n*   **质心连接聚类**：通过计算配对 (x, y) 的相似度或距离来确定簇\
  \ C1 与 C2 的相似度，其中 x 是 C1 的质心，y 是 C2 的质心。\n*   **全连接聚类**：通过输出所有配对 (x, y) 中的最大相似度或距离来确定簇\
  \ C1 与 C2 的相似度，其中 x 是 C1 中的对象，y 是 C2 中的对象。\n*   **单连接聚类**：通过输出所有配对 (x, y) 中的最小相似度或距离来确定簇\
  \ C1 与 C2 的相似度，其中 x 是 C1 中的对象，y 是 C2 中的对象。\n\n凝聚式层次聚类的伪代码展示了实现此类算法在原理上有多么简单：\n\n\
  ```\nAgglomerativeClustering (dataPoints)\n{\n将 dataPoints 中的每个数据点初始化为一个独立簇\nwhile\
  \ (簇数量 > 1)\n根据簇相似度度量找到最近的两个簇 C1、C2\n合并(C1, C2)\nend\n}\n```\n\n凝聚式算法比分裂式算法效率更高，但后者通常能提供更精确的解。请注意，分裂式算法从整个数据集开始操作；因此，它能在原始数据集中找到最佳的二簇划分，并在此基础上在每个簇内找到最佳的可能划分。而凝聚式方法在合并时并不考虑数据的全局结构，因此仅限于分析成对结构。\n\
  \n注意\n\n19 世纪 50 年代霍乱流行期间，伦敦医生约翰·斯诺运用聚类技术在地图上标出霍乱死亡病例的位置。聚类结果表明，死亡病例集中在受污染的水井附近。\n\
  \n\n\n## 划分式聚类\n\n划分式算法将 n 个对象组成的集合划分为 k 个簇或类别。在这种情况下，k（簇或类别的数量）可以预先固定，也可以在优化目标函数时由算法自行确定。划分式聚类算法家族中最著名的代表是\
  \ k-means 算法（[MacQueen, 1967](https://home.deib.polimi.it/matteucc/Clustering/tutorial_html/kmeans.html#macqueen)）。\n\
  \nK-means 是最简单的无监督学习方法之一，用于对一组对象进行聚类。它遵循一个简单的过程，将给定的数据集划分为 k 个簇，其中 k 是预先固定的数字。在其初始化阶段，它会定义\
  \ k 个质心，每个簇一个。定义质心有不同的方法。我们可以从数据集中选择 k 个随机对象作为质心（朴素方法），或者通过选择彼此尽可能远离的质心，以更复杂的方式选择它们。所做的选择可能会影响后续的性能，因为初始质心会影响最终结果。\n\
  \nk-means 算法的主体由一个外层循环构成，该循环检查是否达到停止条件；这个外层循环包含一个内层循环，该循环遍历所有数据点。在这个内层循环中——在检查数据点\
  \ P 时——我们通过比较 P 到每个簇质心的距离来决定 P 应该被添加到哪个簇，最终将其添加到关联质心最近的簇中。\n\n一旦所有数据点被首次检查完毕——换句话说，内层循环首次结束——算法的第一阶段就完成了，并获得了初步的聚类结果。此时，我们需要优化我们的聚类；因此，我们重新计算上一步得到的\
  \ k 个质心（回想一下，质心是其各自簇的平均向量），这将为我们提供新的质心。如果停止条件尚未满足，则再次执行内层循环，将每个数据点添加到关联新质心最近的簇中。这就是\
  \ k-means 的主要过程；请注意，k 个质心会逐步改变它们的位置，直到不再发生变化。换句话说，算法的一个停止条件是质心集合在两次迭代之间不再改变。k-means\
  \ 的伪代码如下所示：\n\n```\nK-Means(dataPoints, k)\n{\ncList = InitializeKCentroids()\n\
  clusters = CreateClusters()\nwhile (!stoppingCondition)\n{\nforeach (pj in dataPoints)\n\
  {\ndj = Calculate distance from pj to every centroid cList_j\nAssign pj to clusters_jwhose\
  \ dj is minimum\n}\nUpdateCentroids()\n}\n}\n```\n\n被优化的目标函数（在此情况下为最小化）是误差平方和（SSE），也称为类内距离或紧致度：\n\
  \n![ $$ \\mathrm{SSE}=\\sum \\limits_{\\mathrm{i}=1}^{\\mathrm{k}}\\sum \\limits_{\\\
  mathrm{x}\\in {\\mathrm{C}}_{\\mathrm{i}}}\\mathrm{d}{\\left(\\mathrm{x},{\\mathrm{centroid}}_{\\\
  mathrm{i}}\\right)}² $$ ](img/A449374_1_En_13_Chapter_Equd.gif)\n\n其中 k 是簇的数量，C[i]\
  \ 是第 i 个簇，centroid[i] 表示与第 i 个簇关联的质心，d(a, b) 是 x 与 centroid[i] 之间的距离或相似性度量（通常是欧几里得距离）。因此，k-means\
  \ 的另一个可能的停止条件是 SSE 达到一个非常小的值。\n\n在图 13-4 中，我们可以看到 k-means 算法的第一步——选择 k 个质心。在此图中，蓝点表示数据点，黑点表示质心。\n\
  \n![A449374_1_En_13_Fig4_HTML.jpg](img/A449374_1_En_13_Fig4_HTML.jpg)\n\n图 13-4\n\
  \nk-means 的第一步，选择 k = 3 个随机对象或数据点作为质心\n\n图 13-5 显示了从第一步中选择质心集合后得到的 k = 3 个簇。\n\n\
  ![A449374_1_En_13_Fig5_HTML.jpg](img/A449374_1_En_13_Fig5_HTML.jpg)\n\n图 13-5\n\n\
  在第一步中选择质心集合后，并考虑使用距离度量来确定数据点之间的相似性，从而得到的聚类结果\n\n循环的最后一步是重新计算簇或质心的中心；此过程如图 13-6 所示。\n\
  \n![A449374_1_En_13_Fig6_HTML.jpg](img/A449374_1_En_13_Fig6_HTML.jpg)\n\n图 13-6\n\
  \n质心被重新计算为其所代表簇的平均向量\n\n前面图中所示的步骤会重复执行，直到满足停止条件。总而言之，k-means 是一种简单、高效的算法，如果使用非常小的\
  \ SSE 值作为停止条件，它可能会收敛到局部最小值。它的主要缺点是对异常值（孤立数据点）高度敏感，这可以通过移除那些与其他数据点相比距离质心集合更远的数据点来缓解。\n\
  \n\n\n## 实践问题：K-Means 算法\n\n在本节中，我们将实现一种可能是有史以来最流行的聚类算法：k-means。为了在实现中采用面向对象的方法，我们将创建\
  \ `Cluster` 和 `Element` 类，它们将包含与簇和对象（数据点）相关的所有操作和属性；`Cluster` 类如代码清单 13-1 所示。\n\n\
