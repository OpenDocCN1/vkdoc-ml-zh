  \ 16-9 所示。\n\n```\npublic class Minimax\n{\npublic intMaxDepth{ get; set; }\npublic\
  \ bool Max { get; set; }\nprivate Tuple _resultMove;\npublic Minimax(intmaxDepth,\
  \ bool max)\n{\nMaxDepth = maxDepth;\nMax = max;\n}\n}\n代码清单 16-9\nMinimax 类、属性和字段\n\
  ```\n\n`Minimax`类仅包含三个属性或字段。`MaxDepth`属性表示我们在搜索树中探索的深度，`Max`定义我们是要最大化还是最小化结果，`_resultMove`是一个私有变量，用于存储执行`Minimax`算法时找到的最佳路径的第一步。此外，我们还将包含以下方法（代码清单\
  \ 16-10）。\n\n```\npublic TupleGetOptimalMove(OthelloBoard board, bool max)\n{\n\
  Execute(board, max, 0);\nreturn _resultMove;\n}\nprivate double Execute (OthelloBoard\
  \ board, bool max, int depth)\n{\nif (depth == MaxDepth)\nreturn board.HeuristicUtility();\n\
  var children = board.Expand(max ? 1 : 2);\nif (children.Count == 0)\nreturn board.LeafNodeValue();\n\
  var result = !max ? double.MaxValue : double.MinValue;\nforeach (varothelloBoard\
  \ in children)\n{\nvar value = Execute(othelloBoard, !max, depth + 1);\nothelloBoard.UtilityValue\
  \ = value;\nresult = max ?Math.Max(value, result) :Math.Min(value, result);\n}\n\
  if (depth == 0)\n_resultMove = children.First(c =>c.UtilityValue == result).MoveFrom;\n\
  return result;\n}\n代码清单 16-10\nMinimax 类的 GetOptimalMove() 和 Execute() 方法\n```\n\
  \n极小化极大算法编码在`Execute()`方法中。`GetOptimalMove()`方法是该算法在图形用户界面中使用的简化公开接口。这是一个简单的设计问题，因为它使我们无需在公开方法中包含初始深度及其他参数；这些参数对于\
  \ GUI 组件来说是不必要的信息。\n\n现在，读者需要自行补充此处提供的代码。你可以添加更多启发式函数，将它们以加权和的形式组合，试验权重值，优化极小化极大算法（通过\
  \ Alpha-Beta 剪枝技术），并为黑白棋游戏打造最强的 AI——本章已为此奠定了所有基础。\n\n## 本章小结\n\n在本章中，我们简要提及并研究了博弈论的一些基本要素和问题。最终，我们深入探讨了博弈论的一个子分支——对抗性搜索，并考察了其最著名的代表之一：极小化极大算法。我们描述了一种针对该算法的优化技术——Alpha-Beta\
  \ 剪枝技术。接着，我们介绍了著名的黑白棋游戏，并为其提出了多种启发式函数。本章还包含了在 Windows Forms 中实现的完整黑白棋游戏，以及使用单一启发式函数（`PieceDifference`）为该游戏实现的非常简单的\
  \ AI。\n\n"
- "# 17. 强化学习\n\n到目前为止，本书已经探讨了监督学习和无监督学习算法。在本章中，我们将讨论强化学习算法。请记住：在监督学习中，我们有一个由样本 (x,\
  \ y) 组成的数据集，其中 x 通常是某个对象（房屋、飞机、人物、城市等）的特征向量，而 y 是 x 的正确分类。因此，监督学习是从表格数据中学习或逼近一个函数的过程。这种方法更接近计算机分析数据的方式，而非人类的方式。监督学习模拟了你教某人认识世界上各种不同对象的过程；例如，你可以向某人展示一个具有所有属性（颜色、大小等）的物体图像，并为其指定一个名称\
  \ (y)，因此像（黄色，10 厘米，可食用，水果）这样的东西就是香蕉。\n\n在无监督学习中，我们不像监督学习那样拥有带标签的数据。在这种情况下，我们不使用任何外部信息（数据的正确标签）。在无监督学习中，我们的目标是利用数据本身提供或内在拥有的信息来学习数据的结构，而不像监督学习中那样借助任何外部帮助。从这个意义上说，可以认为无监督学习更独立于外部实体或信息，更依赖于数据结构或数据关系。第\
  \ 13 章讨论的聚类，就是无监督学习算法的一个典型例子。\n\n在本章中，我们将学习强化学习，这种机器学习范式被认为是人类思维方式的最佳近似。该范式允许我们创建随时间演化的\
  \ AI；这种“心智”的演化是通过对智能体执行错误或正确行为给予惩罚和奖励来实现的。因此，在本章中，我们将描述马尔可夫决策过程（MDP），描述诸如 Q 学习和时序差分（TD）等强化学习方法，并提供一个编码示例，展示强化学习如何让我们设计出一个随时间推移提升性能、并学会以最少步数走出迷宫的智能体。\n\
  \n注意\n\nAlphaGo 是由谷歌 Deep Mind 创建的 AI，它在 2016 年 3 月击败了复杂围棋游戏的世界冠军李世石，正是通过强化学习算法学会了围棋。\n\
  \n\n\n## 什么是强化学习？\n\n强化学习（RL）与监督学习和无监督学习一样，并非单一方法或算法，而是遵循共同思想或范式的一大类算法。实际上，上述三种范式代表了构建人工智能方法的蓝图，而算法则是实现蓝图所详述过程的体现。\n\
  \n在强化学习范式中，学习通过试错进行，结果要么是奖励，要么是惩罚（负奖励），其目标是实现长期累积奖励最大化。可以说，强化学习是随时间推移的持续进化或优化过程。图\
  \ 17-1 展示了强化学习算法的基本流程。智能体与环境交互并对其施加动作，随后环境更新智能体的状态，并根据其进入新状态给予奖励（可能为负值）。\n\n![A449374_1_En_17_Fig1_HTML.jpg](img/A449374_1_En_17_Fig1_HTML.jpg)\n\
  \n**图 17-1**  \n强化学习算法的基本流程。智能体观察环境，执行动作与环境交互，并接收正奖励、负奖励或零奖励。\n\n需要重点考虑的是，奖励并非总是即时生效；可能存在奖励为零的状态，这等同于没有奖励。在开发强化学习方法时，我们需要对环境、状态、智能体动作和奖励进行建模；因此，整个问题本质上是一个马尔可夫决策过程（我们稍后将讨论此主题）。\n\
  \n强化学习基于**奖励假说**，该假说认为所有目标都可以通过最大化期望累积奖励来描述。\n\n一个强化学习智能体可能包含不同组件：定义智能体行为的**策略**、评估每个状态和/或动作优劣的**价值函数**，以及作为环境表征的**模型**。\n\
  \n> **注意**  \n> 与人类相似，强化学习智能体可以直接从原始输入（例如视觉信息）中构建和学习自身知识，无需任何硬编码特征或领域特定的启发式规则。\n\
  \n## 马尔可夫决策过程\n\n马尔可夫决策过程（MDP）是正式描述强化学习环境最常用的方法，许多问题都可以建模为 MDP。MDP 是一个离散状态-时间转移系统，包含一组可能的世界状态\
  \ s、一组可能的动作 a、一个实值奖励函数 R(s, a)、每个状态下每个动作效果的描述 T，以及一个初始状态 s[0]。\n\n为了理解现实问题中的 MDP，我们考虑一个环境：一只机器鼠被困其中，必须找到走出迷宫的路，如图\
  \ 17-2 所示。\n\n![A449374_1_En_17_Fig2_HTML.jpg](img/A449374_1_En_17_Fig2_HTML.jpg)\n\
  \n**图 17-2**  \n机器鼠必须找到走出迷宫的路。找到水源位置奖励 +100，找到奶酪奖励 +10000，而触电位置则导致惩罚或负奖励 -1000。\n\
  \n假设机器鼠试图到达迷宫尽头的终极奖励——奶酪（+10000 分），或沿途的次要奖励——水源（+100 分），同时希望避开会触电的位置（-1000 分）。老鼠在迷宫中的游走可以形式化为一个\
  \ MDP，这是一个具有指定状态间转移概率的过程。该问题的 MDP 可建模如下：\n\n*   **有限状态集**：老鼠在迷宫中的可能位置\n*   **每个状态下可用的动作集**：老鼠在每个状态下所有可能的移动，即\
  \ {上、下、左、右}，以及何时可用；例如，在角落时只有两个移动方向可用\n*   **状态间的转移**：当前状态（迷宫中的特定格子）与某个动作（向左移动）的组合，使机器鼠进入新位置（状态）。转移可能与一组概率相关联，这些概率涉及多个可能的状态。\n\
  *   **与转移相关的奖励**：在迷宫场景中，对于机器鼠而言，大多数奖励为 0，但到达有水源或奶酪的位置时为正奖励，到达有电的格子时为负奖励\n*   **折扣因子\
  \ γ**，取值范围 [0, 1]：量化即时奖励与未来奖励之间的重要性差异。例如，当 γ 等于 0.7，且三步后有一个 5 的奖励时，该奖励的现值为 0.7³\
  \ × 5。\n*   **无记忆性或马尔可夫性质**：一旦当前状态已知，老鼠在迷宫中的历史轨迹可以被清除，因为当前马尔可夫状态包含了历史中的所有有用信息。换句话说，“给定当下，未来独立于过去”。这也被称为马尔可夫性质。\n\
  \n现在，我们在强化学习中的目标是最大化长期累积奖励，其公式如下：\n\n![$$ \\sum \\limits_{\\mathrm{t}=0}^{\\mathrm{t}=\\\
  infty }\\ {\\gamma}^t\\ast r\\left(x(t),a(t)\\right) $$](img/A449374_1_En_17_Chapter_Equa.gif)\n\
  \n其中 t 是时间步，r(x, a) 是奖励函数，x(t) 表示智能体在时间 t 的状态，a(t) 表示在该状态及时间 t 时执行的动作。这是强化学习算法试图解决的主要问题，本质上是一个优化时间的问题。我们越早获得奖励，其价值就越大，因为折扣因子会随时间降低奖励的价值。我们使用折扣因子有以下几个原因：\n\
  \n*   偏好更早的奖励\n*   表示未来的不确定性\n*   动物/人类行为表现出对即时奖励的偏好\n*   避免循环马尔可夫过程中的无限回报（我们稍后将定义什么是回报）\n\
  *   在处理财务奖励时，即时奖励可能比延迟奖励获得更多利息\n\n我们在不同教科书中可能遇到的其他类型奖励包括：\n\n*   **总奖励**：\n\n\n\n\
  ![$$ \\sum \\limits_{t=1}^{\\infty}\\kern0.38em {r}_t $$](img/A449374_1_En_17_Chapter_Equb.gif)\n\
  \n*   平均奖励：\n\n![$$ \\underset{n\\to \\infty }{\\lim}\\frac{r_1+\\kern0.28em {r}_2+\\\
  dots +{r}_n}{n} $$](img/A449374_1_En_17_Chapter_Equc.gif)\n\n我们也可以将 MDP 视为马尔可夫奖励过程（MRP）与决策的结合。一个马尔可夫奖励过程由一组状态\
  \ S、一个状态转移矩阵 T（如前所述）、一个奖励函数 R 以及一个折扣因子 γ 组成。\n\n同时，MRP 可以被看作是一个带有数值的马尔可夫链。马尔可夫链（又称马尔可夫过程）由一组状态\
  \ S 和一个状态转移矩阵 T 组成。图 17-3 展示了一个 MRP，其中我们简要模拟了一个机器人的工作日（它正在查看 Facebook）。范围在 [0.0;\
  \ 1.0] 内的实数表示从一个状态转移到另一个状态的概率；圆圈表示状态，箭头表示从一个状态到另一个状态的转移。在此例中，最左侧的状态是初始状态。\n\n在该图中，所有动作要么是随机的——即\
  \ T : S x A -> Prob(S)，其中 Prob(S) 是一个概率分布——要么是确定性的，即 T : S x A -> S。\n\n注意\n\n规划问题和\
  \ MDP 都被视为搜索问题，区别在于前者处理的是显式动作和子目标，而后者处理的是不确定性和效用。\n\n在 MDP 中，时间范围（horizon）决定了我们的决策过程是无限时间、有限时间还是不定时间（直到满足某个条件）。无限时间范围的\
  \ MDP 更容易求解，因为它们没有截止期限；此外，由于在许多情况下，一个过程会执行多久并不明确，因此考虑无限时间范围的最优性模型很常见。\n\n![A449374_1_En_17_Fig3_HTML.jpg](img/A449374_1_En_17_Fig3_HTML.jpg)\n\
  \n图 17-3\n\n模拟机器人工作日的 MRP\n\n无限时间范围的回报 v[t] 是从时间步 t 到无穷远的折扣奖励总和：\n\n![$$ {\\mathrm{v}}_{\\\
  mathrm{t}}={\\mathrm{r}}_{\\mathrm{t}+1}+\\kern0.28em \\gamma \\ast {r}_{t+2}+\\\
  dots =\\kern0.28em \\sum \\limits_{k=0}^{\\infty }\\ {\\gamma}^k\\ast {r}_{t+k+1}\
  \ $$](img/A449374_1_En_17_Chapter_Equd.gif)\n\n再次注意折扣因子的便利性。如果我们将所有奖励累加到无穷远，总和通常是无限的。为了使数学计算更简洁，并给智能体施加压力，使其尽早获得奖励，我们使用了折扣因子。\n\
  \n## 价值/动作-价值函数与策略\n\n在 MRP 和 MDP 中引入奖励，使我们能够根据关联的奖励来定义状态的价值。这些表格化的价值是价值函数、状态价值函数的一部分，或者简称为\
  \ MRP 中某个状态的价值。它是指从状态 s 开始的期望回报：\n\n![$$ \\mathrm{V}\\left(\\mathrm{s}\\right)=\\\
  mathrm{R}\\left(\\mathrm{s}\\right)+\\kern0.28em \\gamma \\ast \\sum \\limits_{s^{\\\
  prime}\\in N(s)}^{\\mid N(s)\\mid }T\\left[s,\\kern0.28em {s}^{\\prime}\\right]\\\
  ast V\\left({s}^{\\prime}\\right) $$](A449374_1_En_17_Chapter_Eque.gif)\n\n在上述公式中，我们通过对所有可能的下一个状态或邻居状态\
  \ s′ 进行求和，计算从 s 转移到 s′ 的概率与 s′ 的无限时间范围期望折扣奖励（即 s′ 的价值）的乘积，从而得到下一个状态的期望长期价值。该公式基于贝尔曼方程（1957），也称为动态规划方程，及其最优性原理。该原理指出，一个最优策略具有这样的性质：无论初始状态和初始决策是什么，剩余的决策必须构成一个关于由第一个决策产生的状态的最优策略。在这种情况下，价值函数可以分解为即时奖励\
  \ R 和后续邻居状态 s′ 的折扣价值，即 γ * V(s′)。\n\n注意\n\n在计算机科学中，一个可以分解为子问题，并且这些子问题能产生全局最优解的问题（例如使用贝尔曼原理），被称为具有最优子结构。\n\
  \n为了了解如何计算这个方程，我们假设折扣因子 ![$$ \\gamma =0.9 $$](img/A449374_1_En_17_Chapter_IEq1.gif)\
  \ 以及前面图中所示的 MDP；我们可以按如下方式计算最左侧状态（洗脸）的价值：\n\nV('洗脸') = 1 + 0.9 * (0.7 * V('吃早餐')\
  \ + 0.3 * V('穿好衣服'))\n\n注意，如果我们设置 ![$$ \\gamma =0 $$](img/A449374_1_En_17_Chapter_IEq2.gif)，那么每个状态对应的价值将与其奖励相等。要完全计算所有\
  \ s 的 V(s)，我们需要求解 n 个方程中的 n 个未知数，其中 n 是 MRP 中的状态数量。\n\n在经典规划中，我们创建的计划要么是一个有序的动作列表，要么是一个部分有序的动作集合（我们在之前的章节中讨论过），这些动作旨在不参考环境状态的情况下执行。在\
  \ MDP 中，假设你有可能一步之内从任何状态转移到任何其他状态。因此，为了做好准备，通常的做法是计算一个完整的策略，而不是一个简单的计划。\n\n策略是从状态到动作的映射，它定义了智能体在环境中将遵循的行动方针或动作序列。通常用希腊字母\
  \ pi 表示：π(s)。由于马尔可夫性质，我们会发现动作的选择只需要依赖于当前状态（可能还有当前时间），而不依赖于任何先前的状态。我们将尝试找到一种策略，对于每个状态，该策略在该状态下执行时能最大化期望奖励。我们将这样的策略称为最优策略，并记为\
  \ π*(s)。\n\n策略可以是确定性的，为每个状态输出一个单一动作；也可以是随机的，根据各种概率输出一个动作。\n\n注意\n\n由于策略是一个动作序列，当你采用一个\
  \ MDP 并固定一个策略时，所有动作都已选定，剩下的就是一个马尔可夫链。\n\n在 MDP 中，遵循策略 π 的状态-价值函数 Vπ 是指从状态 s 开始，然后遵循策略\
  \ π 的期望回报：\n\n![$$ {\\mathrm{V}}_{\\pi}\\left(\\mathrm{s}\\right)={\\mathrm{R}}_{\\\
  pi}\\left(\\mathrm{s}\\right)+\\gamma \\ast \\sum \\limits_{s^{\\prime}\\in N(s)}^{\\\
  mid N(s)\\mid }{T}_{\\pi}\\left[s,{s}^{\\prime}\\right]\\ast {V}_{\\pi}\\left({s}^{\\\
  prime}\\right) $$](A449374_1_En_17_Chapter_Equf.gif)\n\n最优状态-价值函数是所有策略中的最大价值函数，如下所示：\n\
  \n\n\n![$$ {\\mathrm{V}}_{\\pi}^{\\ast}\\left(\\mathrm{s}\\right)=\\kern0.28em \\\
  underset{\\pi }{\\max }{\\mathrm{V}}_{\\pi}\\left(\\mathrm{s}\\right) $$](img/A449374_1_En_17_Chapter_Equg.gif)\n\
  \n动作-价值函数 Q(s, a)，或简称为 Q 函数，是指从状态 s 出发，采取动作 a，然后遵循策略 π 所得到的期望回报，其定义如下：\n\n![$$ {\\\
  mathrm{Q}}_{\\pi}\\left(\\mathrm{s},\\mathrm{a}\\right)=\\mathrm{R}\\kern0.38em\
  \ \\left(\\mathrm{s},\\mathrm{a}\\right)+\\gamma \\ast \\sum \\limits_{s^{\\prime}\\\
  in N(s)}^{\\mid N(s)\\mid }{T}_{\\pi}^a\\left[s,{s}^{\\prime}\\right]\\ast {V}_{\\\
  pi}\\left({s}^{\\prime}\\right) $$](A449374_1_En_17_Chapter_Equh.gif)\n\n请注意，Q(s,\
  \ a) 可以用 V(s) 来表示，并且它不仅考虑了状态，还考虑了导致状态转移的动作。\n\n注意\n\nQ 函数表示在给定状态下，某个特定动作的质量。\n\n\
  最优动作-价值函数是所有策略中最大的动作-价值函数，其定义如下：\n\n![$$ {\\mathrm{Q}}_{\\pi}^{\\ast}\\left(\\mathrm{s},\\\
  kern0.28em \\mathrm{a}\\right)=\\kern0.28em \\underset{\\pi }{\\max }{\\mathrm{Q}}_{\\\
  pi}\\left(\\mathrm{s},\\kern0.28em \\mathrm{a}\\right) $$](img/A449374_1_En_17_Chapter_Equi.gif)\n\
  \n强化学习智能体的目标是什么？其目标应是通过优化 V(s) 或 Q(s, a) 来学习一个最优策略；已有证明表明，所有最优策略都能达到最优的状态-价值函数和动作-价值函数，如下所示：\n\
  \n![$$ {\\mathrm{V}}_{\\pi}^{\\ast}\\left(\\mathrm{s}\\right)=\\kern0.28em {\\mathrm{Q}}_{\\\
  pi}^{\\ast}\\left(\\mathrm{s},\\kern0.28em \\pi \\left(\\mathrm{s}\\right)\\right)={\\\
  mathrm{V}}^{\\ast }={\\mathrm{Q}}^{\\ast } $$](img/A449374_1_En_17_Chapter_Equj.gif)\n\
  \n其中 V* 和 Q* 分别代表 V(s) 和 Q(s, a) 的最优值。因此，尝试优化这些函数之一以获得智能体的最优策略似乎是合乎逻辑的。请记住，这是我们在马尔可夫决策过程（MDP）中，尤其是在强化学习（RL）中的主要目标。\n\
  \n如果奖励和转移函数对智能体是已知的，那么它可以使用一种称为**值迭代**的基于模型（model-based）的算法来计算 V* 并获得最优策略。\n\n另一种获得最优策略并解决\
  \ MDP 的方法是**策略迭代**算法。这也是一种基于模型的方法，它直接操作策略，而不是通过最优价值函数间接找到策略。与值迭代方法一样，它假设智能体已知奖励和转移函数。\n\
  \n稍后，我们将讨论 **Q 学习**，这是一种无模型（model-free）的学习方法，适用于智能体最初只知道某些状态和动作是可能的，但不知道转移和奖励概率函数的情况。在\
  \ Q 学习中，智能体通过从与环境的交互历史中学习来改进其行为。只有当它执行某个动作并从状态 A 转移到状态 B 并收到奖励时，它才会发现存在这样的奖励。同样，它只有通过最终处于某个状态并查看其可选动作，才能弄清楚从该状态可以进行哪些转移。如果状态转移是随机的，它通过观察不同转移发生的频率来学习状态之间的转移概率。\n\
  \n注意\n\n在基于模型的方法中，智能体拥有环境的内置模型（奖励和转移函数），因此可以模拟环境以做出正确决策。在无模型方法中，智能体知道如何行动，但并不明确了解环境的任何信息。\n\
  \n## 值迭代算法\n\n在值迭代中，我们将通过应用一个迭代过程来计算所有状态 s 的 V*(s)，在这个过程中，我们对 V*(s) 的当前近似值会随着时间的推移逐渐接近最优值。我们首先将所有状态的\
  \ V(s) 初始化为 0。实际上，我们可以初始化为任何我们想要的值，但最简单的方法是从 0 开始。该算法使用 V(s) 的更新规则；该方法的伪代码如下所示：\n\
  \n![A449374_1_En_17_Figa_HTML.jpg](img/A449374_1_En_17_Figa_HTML.jpg)\n\n该问题的一个常见停止条件是，从步骤\
  \ t 到步骤 t + 1 的值变化小于或等于一个预定义的 epsilon 乘以折扣因子变量，如前面的伪代码所示。在这种情况下，δ 表示某次迭代中 V(s) 的最大变化。V\
  \ 和 V′ 表示效用向量，ε 表示状态效用中允许的最大误差。该算法会随着时间的推移收敛到正确的效用值。\n\n## 策略迭代算法\n\n在策略迭代算法中，我们同时搜索最优策略和效用值；因此，我们直接操作策略，而不是通过最优价值函数间接找到策略。该算法的伪代码如下所示：\n\
  \n![A449374_1_En_17_Figb_HTML.jpg](img/A449374_1_En_17_Figb_HTML.jpg)\n\n其中 V 是效用向量，π\
  \ 表示算法输出的策略，并用随机值初始化。`PolicyEvaluation()` 子程序用于求解以下线性方程组：\n\n![$$ \\mathrm{R}\\\
  left({\\mathrm{s}}_{\\mathrm{i}}\\right)+\\kern0.28em \\gamma \\ast ma{x}_a\\sum\
  \ \\limits_{s^{\\prime}\\in N\\left({s}_i\\right)}^{\\mid N\\left({s}_i\\right)\\\
  mid }T\\left[{s}_i,\\kern0.28em \\pi \\left({\\mathrm{s}}_{\\mathrm{i}}\\right),{s}^{\\\
  prime}\\right]\\ast {V}^{\\prime}\\left({s}^{\\prime}\\right) $$](A449374_1_En_17_Chapter_Equk.gif)\n\
  \n策略迭代（PI）选择一个初始策略，通常只是将状态上的奖励作为其效用，并根据最大期望效用原则计算出一个策略。然后，它迭代地执行两个步骤：**值确定**，即根据当前策略计算每个状态的效用；以及**策略改进**，即如果可能进行任何改进，则更新当前策略。当策略稳定时，算法终止。策略迭代通常会在几次迭代内收敛，但每次迭代的计算成本很高；请记住，该方法需要求解大型线性方程组。\n\
  \n\n\n## Q 学习与时间差分\n\n值迭代和策略迭代算法在确定最优策略方面表现出色，但它们假设我们的智能体拥有大量特定于问题的知识。具体来说，它们假设智能体能够准确知道环境中的转移函数和所有状态的奖励。这实际上包含了相当多的信息；在许多情况下，我们的智能体可能无法获取这些信息。\n\
  \n幸运的是，有一种方法可以学习这些信息。本质上，我们可以用学习时间来换取先验知识。其中一种方法是通过一种称为 Q 学习的强化学习形式。Q 学习是一种无模型学习形式，这意味着智能体不需要拥有任何环境模型；它只需要知道存在哪些状态，以及在每个状态下可以执行哪些动作。其工作原理如下：我们为每个状态分配一个估计值，称为\
  \ Q 值。当我们访问一个状态并获得奖励时，我们利用这个信息来更新对该状态价值的估计。（由于我们的奖励可能是随机的，我们可能需要多次访问一个状态。）\n\n考虑到\
  \ ![$$ {V}^{\\ast }(s)=\\underset{a^{\\prime }}{\\mathit{\\max}}\\kern0.38em Q\\\
  left(s,{a}^{\\prime}\\right) $$](img/A449374_1_En_17_Chapter_IEq3.gif)，我们可以仅用 Q\
  \ 函数重写之前详细描述的 Q(s, a) 公式。\n\n![$$ {\\mathrm{Q}}_{\\pi}\\left(\\mathrm{s},\\kern0.28em\
  \ \\mathrm{a}\\right)=\\kern0.28em \\mathrm{R}\\kern0.28em \\left(\\mathrm{s},\\\
  kern0.28em \\mathrm{a}\\right)+\\kern0.28em \\gamma \\ast \\sum \\limits_{s^{\\\
  prime}\\in N(s)}^{\\mid N(s)\\mid }{T}_{\\pi}^a\\left[s,\\kern0.28em {s}^{\\prime}\\\
  right]\\ast {Q}_{\\pi}\\left({s}^{\\prime },\\kern0.28em a\\right) $$](A449374_1_En_17_Chapter_Equl.gif)\n\
  \n上述公式是 Q 学习算法中使用的更新规则，如下所述：\n\n![A449374_1_En_17_Figc_HTML.jpg](img/A449374_1_En_17_Figc_HTML.jpg)\n\
  \n为了使 Q 学习收敛，我们必须保证每个状态都被无限次访问；一个人无法从没有经历过的事情中学习，因此，为了确保收敛并找到最优策略，必须无限次地访问每个状态。\n\
  \nQ 学习属于一类称为时间差分算法的方法。在时间差分算法（TDA）中，我们通过减小不同时间帧（t, t′）估计值之间的差异来学习。Q 学习是 TDA 的一个特例，我们减小一个状态及其后续状态（也称为邻居或后继状态）的\
  \ Q 值估计之间的差异。我们同样可以设计一种算法来减小当前状态与更远后代或祖先状态之间的差异。\n\n最流行的 TD 算法可能是 TD(λ)（Sutton 1988），它是\
  \ TDA 的一个通用版本，其核心思想是我们可以按如下方式计算 Q：\n\n![$$ {\\mathrm{Q}}^{\\mathrm{n}}\\left({\\\
  mathrm{s}}_{\\mathrm{t}},\\kern0.28em {\\mathrm{a}}_{\\mathrm{t}}\\right)={\\mathrm{r}}_{\\\
  mathrm{t}}+\\kern0.28em \\gamma \\ast {r}_{t+1}+\\dots +{\\gamma}^{n-1}\\ast {r}_{t+n-1}+{\\\
  gamma}^n\\ast \\underset{a}{\\max }Q\\left({s}_{t+n},a\\right) $$](img/A449374_1_En_17_Chapter_Equm.gif)\n\
  \n请注意，在上述公式中，我们不仅像在 Q 学习中那样只包含一步前瞻，而是考虑了未来 n 步。TD(λ) 使用一个 ![$$ 0\\le \\lambda \\\
  le 1 $$](img/A449374_1_En_17_Chapter_IEq4.gif) 参数，以如下方式混合了各种前瞻距离：\n\n![$$ {\\mathrm{Q}}^{\\\
  lambda}\\left({\\mathrm{s}}_{\\mathrm{t}},\\kern0.28em {\\mathrm{a}}_{\\mathrm{t}}\\\
  right)=\\left(1-\\lambda \\right)\\ast \\left[{\\mathrm{Q}}¹\\left({\\mathrm{s}}_{\\\
  mathrm{t}},\\kern0.28em {\\mathrm{a}}_{\\mathrm{t}}\\right)+\\lambda \\ast {\\mathrm{Q}}²\\\
  left({\\mathrm{s}}_{\\mathrm{t}},\\kern0.28em {\\mathrm{a}}_{\\mathrm{t}}\\right)\\\
  kern0.28em +{\\lambda}²\\ast {\\mathrm{Q}}³\\left({\\mathrm{s}}_{\\mathrm{t}},\\\
  kern0.28em {\\mathrm{a}}_{\\mathrm{t}}\\right)+\\kern0.28em \\dots \\right] $$](A449374_1_En_17_Chapter_Equn.gif)\n\
  \n当考虑 ![$$ \\lambda =0 $$](img/A449374_1_En_17_Chapter_IEq5.gif) 时，我们最终得到 Q 学习规则，即仅向前看一步的规则。随着λ的增加，算法更加侧重于基于更远前瞻的差异。当达到\
  \ ![$$ \\lambda =1 $$](img/A449374_1_En_17_Chapter_IEq6.gif) 时，仅考虑观察到的 ![$$ {\\\
  mathrm{r}}_{\\mathrm{t}+\\mathrm{i}} $$](img/A449374_1_En_17_Chapter_IEq7.gif) 值，当前\
  \ Q 估计值不再贡献。采用 TD(λ)方法的动机在于，在某些场景下，如果考虑更远的前瞻，训练效率会更高。\n\n\n\n## 实践问题：使用 Q-Learning\
  \ 解决迷宫\n\n在本实践问题中，我们将通过一个非常简单直观的场景来演示 Q-Learning 方法的应用：解决迷宫问题。在迷宫中，智能体从单元格 (0, 0)\
  \ 出发，必须找到位于单元格 (n - 1, m - 1) 的出口，其中 n 表示行数，m 表示列数，矩阵索引从零开始。图 17-4 展示了本章需要解决的迷宫。\n\
  \n![A449374_1_En_17_Fig4_HTML.jpg](img/A449374_1_En_17_Fig4_HTML.jpg)\n\n**图 17-4**\n\
  \n待解决的迷宫\n\n请注意，在上述迷宫中，智能体可以遵循多种策略到达出口单元格，但只有一种最优策略（图 17-5）。\n\n由于学习会随时间推移而发生（如同现实生活中的情况），我们必须保证在每个回合中持续访问每一个状态（单元格）；这是\
  \ Q-Learning 收敛的必要条件。回合（Episode）指的是智能体完成一次迷宫的过程，每当迷宫被完成，我们就说智能体从回合 E 进入回合 E + 1。\n\
  \n![A449374_1_En_17_Fig5_HTML.jpg](img/A449374_1_En_17_Fig5_HTML.jpg)\n\n**图 17-5**\n\
  \n智能体解决迷宫所遵循的最优策略\n\n我们将要使用的 Q-Learning 智能体，称为 Qagent，由清单 17-1 所示的类表示。\n\n```\n\
  public class QAgent\n{\npublic int X { get; set; }\npublic int Y { get; set; }\n\
  public Dictionary, List> QTable { get; set; }\npublic double Randomness { get; set;\
  \ }\npublic double[,] Reward { get; set; }\nprivate readonly bool[,] _map;\nprivate\
  \ readonly int _n;\nprivate readonly int _m;\nprivate readonly double _discountFactor;\n\
  private static readonly Random Random = new Random();\nprivate readonly Dictionary,\
  \ int> _freq;\npublic QAgent(int x, int y, double discountFactor, int n, int m,\
  \ double [,] reward, bool [,] map, double randomness)\n{\nX = x;\nY = y;\nRandomness\
  \ = randomness;\nInitQTable(n, m);\n_n = n;\n_m = m;\nReward = reward;\n_map = map;\n\
  _discountFactor = discountFactor;\n_freq = new Dictionary, int> {{new Tuple(0, 0),\
  \ 1}};\n}\n}\n```\n\n**清单 17-1**\n\nQAgent 类的属性、字段和构造函数\n\n该类包含以下属性或字段：\n\n*   `X`：表示智能体在棋盘上位置的行坐标\n\
  *   `Y`：表示智能体在棋盘上位置的列坐标\n*   `QTable`：以表格形式表示 Q 函数的矩阵，即 Q(s, a) 函数，其中行表示状态，列表示动作。它被编码为一个字典，键为\
  \ `Tuple<int, int>`（状态），值为一个包含四个 double 值的列表（分别对应上、下、左、右四个动作）。\n*   `Randomness`：由于我们需要时不时地随机游走，以尝试让智能体访问每一个状态，因此我们使用\
  \ `Randomness` 变量来表示一个 [0, 1] 范围内的值，该值对应生成随机动作的概率。\n*   `Reward`：表示每个状态的奖励矩阵\n*\
  \   `_ map`：表示环境（迷宫）地图的变量\n*   `_n`：环境的行数\n*   `_m`：环境的列数\n*   `_discountFactor`：折扣因子，如前所述，用于\
  \ Q-Learning 更新规则\n*   `_freq`：详细记录每个状态访问频率的字典；它将用于所采用的策略，以确保智能体无限频繁地访问每个状态，并力求获得最优策略\n\
  \n类构造函数中包含的 `InitQTable()` 方法（清单 17-2）旨在初始化 `QTable`；即初始化（状态，{`actionUp`, `actionDown`,\
  \ `actionLeft`, `actionRight`}）条目的字典。初始时，对于所有可能的动作 a，Q(s, a) = 0。\n\n```\nprivate\
  \ void InitQTable(int n, int m)\n{\nQTable = new Dictionary, List>();\nfor (var\
  \ i = 0; i < n; i++)\n{\nfor (var j = 0; j < m; j++)\n{\nQTable.Add(new Tuple(i,\
  \ j), new List { 0, 0, 0, 0});\n}\n}\n}\n```\n\n**清单 17-2**\n\n`InitQTable()` 方法\n\
  \nQ-Learning 过程发生在以下方法中（清单 17-3）；`actionByFreq` 参数将决定我们是使用基于频率和随机性的状态访问策略，还是仅依赖\
  \ Q 值来完成迷宫。由于每个学习过程都需要一定时间，我们将需要仅依赖频率加随机性策略来尝试“学习”——即足够频繁地访问每个状态，以便从这些经验中学习，并最终能够学习到一条最优策略，从而以最短时间和最少步数引导我们到达迷宫出口。\n\
  \n```\npublic void QLearning(bool actionByFreq = false)\n{\nvar currentState = new\
  \ Tuple(X, Y);\nvar action = SelectAction(actionByFreq);\nif (!_freq.ContainsKey(ActionToTuple(action)))\n\
  _freq.Add(ActionToTuple(action), 1);\nelse\n_freq[ActionToTuple(action)]++;\nActionToTuple(action,\
  \ true);\nvar reward = Reward[currentState.Item1, currentState.Item2];\nQTable[currentState][(int)\
  \ action] = reward + _discountFactor * QTable[new Tuple(X, Y)].Max();\n}\n```\n\n\
  **清单 17-3**\n\n`InitQTable()` 方法\n\n非常重要的动作选择策略将引导智能体学习到最优策略，该策略编码在清单 17-4 所示的 `SelectAction()`\
  \ 方法中。如果 `actionByFreq` 变量被激活（设置为 True），智能体将根据频率加随机性策略执行动作；否则，它将始终选择具有最高值的 Q(s',\
  \ a)。\n\n```\nprivate QAgentAction SelectAction(bool actionByFreq)\n{\nvar bestValue\
  \ = double.MinValue;\nvar bestAction = QAgentAction.None;\nvar availableActions\
  \ = AvailableActions();\nif (actionByFreq)\nreturn FreqStrategy(availableActions);\n\
  for (var i = 0; i < availableActions.Count; i++)\n{\nvar value = QTable[new Tuple(X,\
  \ Y)][i];\nif (value > bestValue)\n{\nbestAction = ActionSelector(i);\nbestValue\
  \ = value;\n}\n}\nreturn bestAction;\n}\n```\n\n**清单 17-4**\n\n`SelectAction()`\
  \ 方法\n\n上述方法使用了清单 17-5 中的 `FreqStrategy()` 方法。在该方法中，我们以 0.5 的概率应用随机动作，或者进行基于频率的访问；即，根据\
  \ `_freq` 字典，访问相邻状态中访问次数最少的那一个。\n\n```\nprivate QAgentAction FreqStrategy(List availableActions)\n\
  {\nvar newPos = availableActions.Select(availableAction => ActionToTuple(availableAction)).ToList();\n\
  var lowest = double.MaxValue;\nvar i = 0;\nvar bestIndex = 0;\nif (Random.NextDouble()\
  \ <= Randomness)\nreturn availableActions[Random.Next(availableActions.Count)];\n\
  foreach (var tuple in newPos)\n{\nif (!_freq.ContainsKey(tuple))\n{\nbestIndex =\
  \ i;\nbreak;\n}\nif (_freq[tuple] <= lowest)\n{\nlowest = _freq[tuple];\nbestIndex\
  \ = i;\n}\ni++;\n}\nreturn availableActions[bestIndex];\n}\n```\n\n**清单 17-5**\n\
  \n`FreqStrategy()` 方法\n\n为了确定智能体可用的动作集（即不会导致智能体撞墙的动作），我们在 QAgent 类中包含了 `AvailableActions()`\
  \ 方法，如清单 17-6 所示。\n\n```\nprivate List AvailableActions()\n{\nvar result = new List();\n\
  if (X - 1 >= 0 && _map[X - 1, Y])\nresult.Add(QAgentAction.Up);\nif (X + 1 < _n\
  \ && _map[X + 1, Y])\nresult.Add(QAgentAction.Down);\nif (Y - 1 >= 0 && _map[X,\
  \ Y - 1])\nresult.Add(QAgentAction.Left);\nif (Y + 1 < _m && _map[X, Y + 1])\nresult.Add(QAgentAction.Right);\n\
  return result;\n}\n```\n\n**清单 17-6**\n\n`AvailableActions()` 方法\n\n我们采用约定，将动作按顺序\
  \ {上, 下, 左, 右} 与从 0 开始的整数匹配；因此，上 = 0，下 = 1，左 = 2，右 = 3。清单 17-7 中所示的 `ActionSelector()`\
  \ 方法将一个整数转换为其对应的动作（我们稍后将看到 `QAgentAction` 枚举）。\n\n在清单 17-7 中，我们还可以看到 `ActionToTuple()`\
  \ 方法，该方法将 `QAgentAction` 转换为 `Tuple<int,int>`，表示执行该动作后得到的结果状态。\n\n\n\n```\npublic\
  \ QAgentAction ActionSelector(int action)\n{\nswitch (action)\n{\ncase 0:\nreturn\
  \ QAgentAction.Up;\ncase 1:\nreturn QAgentAction.Down;\ncase 2:\nreturn QAgentAction.Left;\n\
  case 3:\nreturn QAgentAction.Right;\ndefault:\nreturn QAgentAction.None;\n}\n}\n\
  public Tuple ActionToTuple(QAgentAction action, bool execute = false)\n{\nswitch\
  \ (action)\n{\ncase QAgentAction.Up:\nif (execute) X--;\nreturn new Tuple(X - 1,\
  \ Y);\ncase QAgentAction.Down:\nif (execute) X++;\nreturn new Tuple(X + 1, Y);\n\
  case QAgentAction.Left:\nif (execute) Y--;\nreturn new Tuple(X, Y - 1);\ncase QAgentAction.Right:\n\
  if (execute) Y++;\nreturn new Tuple(X, Y + 1);\ndefault:\nreturn new Tuple(-1, -1);\n\
  }\n}\n清单 17-7\n`ActionSelector()` 和 `ActionToTuple()` 方法\n```\n\n为了完成 `QAgent` 类，我们添加了\
  \ `Reset()` 方法（清单 17-8），该方法通过将智能体设置到起始位置并清空 `_frequency` 字典，来重置或为新一轮训练准备智能体。描述智能体可能动作的\
  \ `QAgentAction` 枚举如清单 17-8 所示。\n\n```\npublic void Reset()\n{\nX = 0;\nY = 0;\n\
  _freq.Clear();\n}\npublic enum QAgentAction\n{\nUp, Down, Left, Right, None\n}\n\
  清单 17-8\n`Reset()` 方法和 `QAgentAction` 枚举\n```\n\n我们已经展示了程序的机器学习代码，但还缺少一个组件：Windows\
  \ Forms 上的图形用户界面。\n\n`Form` 类的继承者 `MazeGui` 将直观地呈现迷宫，如清单 17-9 所示。请记住，我们正在编写一个 Windows\
  \ Forms 应用程序。\n\n```\npublic partial class MazeGui : Form\n{\nprivate readonly int\
  \ _n;\nprivate readonly int _m;\nprivate readonly bool[,] _map;\nprivate readonly\
  \ QAgent _agent;\nprivate Stopwatch _stopWatch;\nprivate int _episode;\npublic MazeGui(int\
  \ n, int m, bool [,] map, double [,] reward)\n{\nInitializeComponent();\ntimer.Interval\
  \ = 100;\n_n = n;\n_m = m;\n_map = map;\n_agent = new QAgent(0, 0, 0.9, _n, _m,\
  \ reward, map, .5);\n_stopWatch = new Stopwatch();\n}\n}\n清单 17-9\n`MazeGui` 类的字段和构造函数\n\
  ```\n\n该类包含以下属性或字段：\n\n*   `_n`：迷宫的行数\n*   `_m`：迷宫的列数\n*   `_map`：布尔值矩阵，指示单元格是否为墙壁\n\
  *   `_agent`：`QAgent` 类的实例\n*   `_stopWatch`：用于测量 Q-learning 过程中每一轮训练所耗时间的秒表\n*\
  \   `_episode`：Q-learning 过程中已执行的训练轮数\n\n为了在迷宫上绘制所有元素，我们为绘图控件（Picture Box）实现了 `Paint`\
  \ 事件，如清单 17-10 所示。\n\n```\nprivate void MazeBoardPaint(object sender, PaintEventArgs\
  \ e)\n{\nvar pen = new Pen(Color.Wheat);\nvar cellWidth = mazeBoard.Width / _n;\n\
  var cellHeight = mazeBoard.Height / _m;\nfor (var i = 0; i < _n; i++)\n{\nfor (var\
  \ j = 0; j < _m; j++)\n{\nif (!_map[i, j])\n{\ne.Graphics.FillRectangle(new SolidBrush(Color.Gray),\
  \ j * cellWidth, i * cellHeight, cellWidth, cellHeight);\n}\nelse\n{\ne.Graphics.DrawRectangle(pen,\
  \ j * cellWidth, i * cellHeight, cellWidth, cellHeight);\ne.Graphics.DrawString(\n\
  String.Format(\"{0:0.00}\", _agent.QTable[new Tuple(i, j)][0].ToString(CultureInfo.GetCultureInfo(\"\
  en-US\"))) + \",\" +\nString.Format(\"{0:0.00}\", _agent.QTable[new Tuple(i, j)][1].ToString(CultureInfo.GetCultureInfo(\"\
  en-US\"))) + \",\" +\nString.Format(\"{0:0.00}\", _agent.QTable[new Tuple(i, j)][2].ToString(CultureInfo.GetCultureInfo(\"\
  en-US\"))) + \",\" +\nString.Format(\"{0:0.00}\", _agent.QTable[new Tuple(i, j)][3].ToString(CultureInfo.GetCultureInfo(\"\
  en-US\")))\n,new Font(\"Arial\", 8, FontStyle.Bold), new SolidBrush(Color.White),\
  \ j * cellWidth, i * cellHeight);\n}\n}\ne.Graphics.FillEllipse(new SolidBrush(Color.Tomato),\
  \ _agent.Y * cellWidth, _agent.X * cellHeight, cellWidth, cellHeight);\ne.Graphics.DrawString(\"\
  Exit\", new Font(\"Arial\", 12, FontStyle.Bold), new SolidBrush(Color.Yellow), (_m\
  \ - 1) * cellWidth + 15, (_n - 1) * cellHeight + 15);\n}\n清单 17-10\n表示迷宫的 Picture\
  \ Box 的 Paint 事件\n```\n\n我们将智能体绘制为椭圆，将墙壁绘制为灰色单元格；我们还会在每个可通行的单元格上绘制四个值：状态 s 下所有可能动作的\
  \ Q(s, a) 值。\n\n为了从智能体获取并执行动作，我们包含了一个每秒触发一次的计时器，并在当前训练轮数小于 20 时，使用频率加随机性策略调用智能体的\
  \ `QLearning()` 方法。同样是在处理 tick 事件的方法（清单 17-11）中，我们重置了秒表和智能体的状态，并将每轮训练的耗时写入一个文件。\n\
  \n注意\n\n当处于目标状态 s 时，我们不应用 Q-learning 规则来更新 Q(s, a)；相反，我们取目标状态的奖励值，并将其直接赋给 Q(s, a)。\n\
  \n最后，我们刷新 `mazeBoard` 以在 GUI 上显示新的变化集合。\n\n```\nprivate void TimerTick(object sender,\
  \ EventArgs e)\n{\nif (!_stopWatch.IsRunning)\n_stopWatch.Start();\nif (_agent.X\
  \ != _n - 1 || _agent.Y != _m - 1)\n_agent.QLearning(_episode < 20);\nelse\n{\n\
  _agent.QTable[new Tuple(_n - 1, _m - 1)] = new List<double>\n{\n_agent.Reward[_n\
  \ - 1, _m - 1],\n_agent.Reward[_n - 1, _m - 1],\n_agent.Reward[_n - 1, _m - 1],\n\
  _agent.Reward[_n - 1, _m - 1]\n};\n_stopWatch.Stop();\n_agent.Reset();\nvar file\
  \ = new StreamWriter(\"E:/time_difference.txt\", true);\nfile.WriteLine(_stopWatch.ElapsedMilliseconds);\n\
  file.Close();\n_stopWatch.Reset();\n_episode++;\n}\nmazeBoard.Refresh();\n}\n}\n\
  清单 17-11\n处理 Tick 事件的方法\n```\n\n现在所有组件都已就位，让我们尝试测试并运行该应用程序，就像本书中一直做的那样，在控制台应用程序中创建必要的地图和奖励矩阵（清单\
  \ 17-12）。\n\n```\nvar map = new [,]\n{\n{true, false, true, false, true},\n{true,\
  \ true, true, false, true},\n{true, false, true, false, true},\n{true, false, true,\
  \ true, true},\n{true, true, true, false, true}\n};\nvar reward = new [,]\n{\n{-0.01,\
  \ -0.01, -0.01, -0.01, -0.01},\n{-0.01, -0.01, -0.01, -0.01, -0.01},\n{-0.01, -0.01,\
  \ -0.01, -0.01, -0.01},\n{-0.01, -0.01, -0.01, -0.01, -0.01},\n{-0.01, -0.01, -0.01,\
  \ -0.01, 1},\n};\nApplication.EnableVisualStyles();\nApplication.SetCompatibleTextRenderingDefault(false);\n\
  Application.Run(new MazeGui(5, 5, map, reward));\n清单 17-12\n测试 MazeGui 应用程序\n```\n\
  \n执行清单 17-12 中的代码后得到的结果，将是本章开发的 Windows Forms 应用程序的一个实例（图 17-6）。奖励函数为目标状态赋予奖励值 1，为其他任何状态赋予\
  \ -0.01。一旦智能体完成第一轮训练，目标状态（Exit）的每个动作都将包含奖励值 1；即 `Q('Exit', {up, down, left, right})\
  \ = 1`。\n\n![A449374_1_En_17_Fig6_HTML.jpg](img/A449374_1_En_17_Fig6_HTML.jpg)\n\
  \n图 17-6\n\n第 2 轮训练，QAgent 正在学习并更新 Q 值，这些值显示在每个单元格的左上角\n\n使用前面描述的探索策略（即混合使用访问单元格的频率和随机性来执行动作的策略），我们在每一轮训练中持续访问每个状态。完成\
  \ 20 轮训练后，智能体开始仅依赖已学习的 Q 值来采取动作，并且始终执行对应最高 Q(s', a) 值的动作。在这种情况下，我们能够找到最优策略，如图 17-5\
  \ 所示。\n\n图 17-7 展示了经过 20 轮训练后最终计算出的 Q(s, a) 值。读者可以验证，从单元格 (0, 0) 开始，始终选择具有最高 Q 值的动作（记住它们按\
  \ up, down, left, right 的顺序出现），将引导智能体走向最优策略——即以最少步数到达出口（目标状态）的策略。\n\n![A449374_1_En_17_Fig7_HTML.jpg](img/A449374_1_En_17_Fig7_HTML.jpg)\n\
  \n图 17-7\n\n智能体找到并执行的最优策略\n\n\n\n回想一下，我们在 Q 学习中的目标是实际学习 Q 函数 Q(s, a)。在这种情况下，我们以表格形式学习该函数，其中状态作为行，动作作为表格或矩阵的列。在某些场景中，由于我们可能拥有巨大的状态空间，采用这种方式可能难以处理。在这种情况下，我们可以依赖诸如神经网络之类的函数逼近器来近似\
  \ Q 函数。这实际上是 Tesauro 在其著名的西洋双陆棋智能体中所采用的方法，该智能体能够击败当时的西洋双陆棋世界冠军。\n\n## 总结\n\n在本章中，我们描述了强化学习这一有趣的主题，它是与监督学习和无监督学习并列的最重要的机器学习范式之一。我们首先定义了马尔可夫决策过程，这是强化学习中用于建模现实世界问题的数学框架。我们描述了价值函数\
  \ (V) 和动作价值函数 (Q)，并展示了这些函数之间的关系以及它们在获得最优策略中的重要性。本章还包含了策略的概念。我们提供了几种求解马尔可夫决策过程的方法。具体来说，我们详细介绍了价值迭代和策略迭代算法。最后，我们讨论了\
  \ Q 学习，并实现了一个实际问题，在该问题中我们使用它来让智能体学习如何以最短步数走出迷宫。\n\n\n\n索引 A\n《美丽心灵》\n动视暴雪（《使命召唤》）\n\
