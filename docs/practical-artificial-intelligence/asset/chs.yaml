  ```\n\n与之前的模式相同，我们通过以下几点来描述代码清单 16-3 中的方法集：\n\n*   `AvailableMovesAroundPiece()`:\
  \ 此方法从对手棋子的位置开始，检查其所有相邻格子，试图放置一枚可以夹击对手棋子的棋子。\n*   `SetPieceCreatedBoard()`: 在棋盘上放置一枚棋子，并翻转所有被这枚新棋子夹击的对手棋子。\n\
