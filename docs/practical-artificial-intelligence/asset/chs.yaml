  信念、愿望和意图类

  ```


  信念通常被编码为谓词，因此我们包含了一个动态（可以是任何类型）的 `Predicate` 属性来表示它们。在这种情况下，探测车的谓词是一个 `List<Tuple<int,
  int>>`，表示水源位置的信念。要使该类能够容纳不同类型的谓词，只需更改 `override ToString()` 方法即可。


  愿望不仅包含谓词，还包含子愿望，如第 3 章所述。`GetSubDesires()` 方法将负责从愿望树中获取叶子节点。回顾第 3 章，一个给定的愿望可能包含必须首先满足的子愿望，然后实际愿望才能实现，而这些叶子愿望或基本愿望是智能体必须首先执行的（因为其他愿望依赖于叶子愿望或由其产生）。


  最后，意图继承自愿望。请记住：意图是愿望的一个子集，我们可能有多个愿望，但并非所有愿望在特定时刻都需要是现实的；因此，意图是我们在某个时刻决定承诺的那些愿望。为了能够将愿望转换为意图，我们包含了
  `FromDesire()` 方法。


