  if (P is And)

  return new Or(new Not((P as And).P), new Not((P as And).Q));

  if (P is Or)

  return new And(new Not((P as Or).P), new Not((P as Or).Q));

  if (P is Not)

  return new Not((P as Not).P);

  return this;

  }

