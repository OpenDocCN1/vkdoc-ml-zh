  ## 总结


  在本章中，我们介绍了手写数字识别的问题，并开发了一个 Windows 窗体应用程序，允许用户在其中绘制数字，并最终获得对所绘数字的分类。我们只考虑了数字集合 {1,
  2, 3}，但该应用程序可以轻松扩展以包含所有可能的数字，只需向输出层添加新节点即可。我们测试了结果，如前所述，由于训练样本数量较少，应用程序可能会错误分类一些输入数据。因此，建议添加新的训练数据。本章介绍的可视化应用程序是神经网络强大能力与潜力的真实体现。


