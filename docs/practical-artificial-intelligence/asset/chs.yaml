  \ 15-1），它使一个人或多个人能够在尽可能真实的环境中进行互动并玩数字电子游戏，这种环境通过显示器（屏幕、镜片等）感知，通过控制器（摇杆、游戏手柄等）交互，并由一个平台（计算机、游戏机、手机等）执行——该平台负责向显示器发送图像和声音，并使控制器能够进行交互。\n\
  \n![A449374_1_En_15_Fig1_HTML.jpg](img/A449374_1_En_15_Fig1_HTML.jpg)\n\n**图 15-1**\n\
  \n《光环》系列（微软旗下）是有史以来最受欢迎的“射击游戏”（第一人称）和科幻游戏之一\n\n该平台执行游戏引擎，这是一个由图形和动画、物理、控制器交互、AI、声音、网络等组成的复合体，它遵循由开发者编码的电子游戏所定义的逻辑。\n\
  \n电子游戏的设计阶段通常包括一个由计算机科学家、历史学家、心理学家、音乐家、艺术家和数字营销人员以及其他专业人士组成的多学科团队的参与。他们共同努力，旨在为玩家提供他们所能拥有的最逼真的游戏，前提是游戏需要这种类型的逼真度。\n\
  \nAI 游戏开发团队将负责为游戏创建 AI。游戏的 AI 是什么？游戏的 AI 定义了我们在游戏中的对手有多聪明；例如，在足球、篮球或类似的体育游戏中，为电脑方实现的\
  \ AI 将包含一系列策略、战术、行为、动作等，这些最终定义了电脑玩家的复杂程度，使其对我们来说具有挑战性和娱乐性，让我们能够享受游戏。\n\nAI 游戏开发的主要课题之一是为游戏中的搜索创建算法。游戏中的搜索将是下一节的重点，在那里我们最终将开始深入探讨与游戏相关的\
  \ AI 算法。\n\n> **注意**\n>\n> 电子娱乐博览会（又称 E3）展会是世界上最大的游戏展会之一。它是游戏行业领导者展示其最新作品的聚会点。\n\
  \n\n\n## 游戏中的搜索\n\n许多游戏必须依赖搜索过程才能达到获胜状态。棋盘游戏可能是这类场景的最佳代表；在诸如滑块拼图（图 15-2）这样的棋盘游戏中，我们必须在所有可能状态的树中进行搜索，以找到实际上的获胜或目标状态。\n\
  \n![A449374_1_En_15_Fig2_HTML.jpg](img/A449374_1_En_15_Fig2_HTML.jpg)\n\n**图 15-2**\n\
  \n滑块拼图；一种依赖人工智能搜索方法的棋盘游戏\n\n树是用于表示状态空间（所有可能状态的集合）的非常常见的结构。树的定义或生成方式因具体问题而异；对于滑块拼图而言，空白方块可以交换到的四个位置中的每一个都代表当前节点的子节点。因此，我们会得到一棵包含所有可能状态的树，其子树类似于图\
  \ 15-3 中描绘的那样。\n\n![A449374_1_En_15_Fig3_HTML.jpg](img/A449374_1_En_15_Fig3_HTML.jpg)\n\
  \n**图 15-3**\n\n在滑块拼图中进行搜索，直到找到目标状态。在此示例中，我们使用启发式方法（错位方块数）来确定到达目标状态的最短路径（橙色方框）。\n\
  \n搜索生成的树为我们提供了一系列移动步骤——从根节点或起始状态，一路向下直至目标状态——从而为我们提供了游戏的解决方案。在图 15-3 中，解决方案将由移动步骤\
  \ {右，下，右} 表示；因此，从根节点出发的一条长度为 3 的路径将我们带到了目标状态。正如我们将看到的，将搜索方法与启发式方法结合的目的是缩短到达目标节点的搜索路径长度。\n\
  \n搜索策略可以根据以下标准进行分类：\n\n*   **系统性**：这是一种将状态空间结构化为树形结构的策略；当且仅当满足以下条件时，我们认为该策略是系统性的：\n\
  \    *   只要未找到解决方案且仍有待检查的候选节点，搜索就会继续；并且\n    *   每个候选节点只被检查一次。\n*   **信息利用**：它指的是搜索是否使用了领域特定知识；即，在搜索过程中对问题的了解。它可以分为：\n\
  \    *   知情搜索（最佳优先搜索、A*）；或\n    *   不知情或盲目搜索（广度优先搜索、深度优先搜索、迭代加深搜索）。\n\n在本书中，我们将重点讨论系统性策略，并且还将讨论知情和不知情的搜索方法。在后续章节中评估搜索算法的性能时，将考虑以下特征：\n\
  \n*   **b**（分支因子）：一个节点的最大子节点数\n*   **d**（深度）：从根节点到叶节点的所有路径的最大长度\n*   **m**：从根节点到目标状态的任何路径的最小长度\n\
  \n此外，我们将断言，如果一个搜索总能找到解决方案，则它是完备的；如果它总能找到到达目标状态的最低路径成本，则它是最优的。\n\n注意\n\n最古老的滑块拼图类型是十五数码拼图，由诺伊斯·查普曼于\
  \ 1880 年发明。\n\n## 不知情搜索\n\n在不知情搜索方法中，前沿中的所有非目标节点对算法来说看起来都是一样的；因此，这种类型的搜索也被称为盲目搜索。该过程无法确定从节点\
  \ X 出发的路径是否会比从节点 Y 出发的另一条路径更好。\n\n不知情搜索算法本质上是图算法；它们在树上运行，而树是一种特殊的图。因此，本文描述的算法也是图论工具箱的一部分。\n\
  \n广度优先搜索（BFS）是最流行的基于图的搜索算法之一。在这种方法中，节点按层级被发现；算法在发现距离根节点为 k+1 的任何节点之前，会先发现所有距离根节点为\
  \ k 的节点（图 15-4）。\n\n![A449374_1_En_15_Fig4_HTML.jpg](img/A449374_1_En_15_Fig4_HTML.jpg)\n\
  \n**图 15-4**\n\n使用 BFS 过程遍历树；我们从节点 A 开始，然后发现下一层的所有节点，即节点 B、C、D。我们继续这样操作，发现下一层的节点，即节点\
  \ E、F、G、H。最后，我们在最后一层发现节点 I 和 J。\n\n当 b 有限时，BFS 是完备的，其时间和空间复杂度均为 O(b^d)，并且当边成本等于\
  \ 1 时（即，在搜索中每前进一步的代价为 1），它是最优的。\n\n深度优先搜索（DFS）是另一种非常流行的基于图的搜索算法，并且是许多其他此类搜索过程的原型。在\
  \ DFS 中，节点按其向下距离被发现；算法从根节点开始，沿着最左侧子节点的路径前进，直到到达叶节点，然后“回溯”到先前访问过的节点 N，并继续发现 N 的下一个未访问的子节点。因此，它总是深入构建一条路径，寻找最左侧、未访问、最深的节点，并在整个树或图上递归地重复此过程（图\
  \ 15-5）。请注意，在可能遇到循环的图中，DFS 必须保证已访问的节点被标记为“已访问”。\n\n![A449374_1_En_15_Fig5_HTML.jpg](img/A449374_1_En_15_Fig5_HTML.jpg)\n\
  \n**图 15-5**\n\n使用 DFS 过程遍历树；我们从节点 A 开始，然后沿着通向最左侧、未访问节点的路径前进；因此，我们构建了由节点 A、B、E、I\
  \ 组成的路径，然后一路回溯到根节点（构建的路径中唯一有子节点待发现的节点），并移动到最左侧、未访问的子节点，即 C。它在 C 上递归执行相同的过程，并最终在节点\
  \ D 上执行，从而得到图中所示的路径。\n\n假设我们实现了某种控制机制来确定沿途哪些节点已被访问，并且假设我们处理的是一个有限空间，那么我们可以断言 DFS\
  \ 将是完备的；否则，它是不完备的，因为它可能陷入无限循环。其时间复杂度为 O(b^m)，如果 m 远大于 d，则可能比 O(b^d) 差得多。其空间复杂度为\
  \ O(b * m)，并且它不是一种最优的搜索算法。\n\n为了比较 BFS 和 DFS，第一种方法通常应用于以下场景：可能存在无限路径，可以在短路径内找到解决方案，或者可以轻松丢弃不成功的路径。另一方面，DFS\
  \ 更适用于状态空间受限、存在许多长路径的可能解决方案，或者错误路径通常很快终止且搜索可以相应调整的场景。\n\nBFS 和 DFS 是许多其他搜索算法衍生出来的主要构建块。许多这些衍生算法试图减少其前身的某些缺点；深度受限搜索和迭代加深搜索就是这种情况。\n\
  \n\n\n深度受限搜索（DLS）本质上是一种设置了深度限制 L 的 DFS（图 15-6）；即深度为 L 的节点没有后继节点，因此相当于我们在深度 L 处截断了树，从而消除了无限路径问题。如果\
  \ L = d，我们将获得最优解；如果 L < d，我们将得到不完整的解；而当 L > d 时，我们将得到非最优解。\n\n![A449374_1_En_15_Fig6_HTML.jpg](img/A449374_1_En_15_Fig6_HTML.jpg)\n\
  \n图 15-6\n\nDLS 是一种施加了深度限制 L 的 DFS\n\n迭代加深搜索（IDS）是一种用于发现最佳深度限制 L 的策略；其主要思想是将 DLS\
  \ 作为子方法，并逐步将深度限制从 1 增加到预定义的最大深度。该算法是完备且最优的；它总能发现最浅的目标节点。\n\n另一种依赖于 BFS 或 DFS 的无信息搜索过程是双向搜索（BS）。在\
  \ BS 中，我们同时执行两个搜索：一个从初始状态到目标状态，另一个从目标状态反向到初始状态。我们希望这两个搜索能在某一点相遇。因此，在此过程中，我们必须在每一步检查向前扩展的节点集是否与向后扩展的节点集相交。BS\
  \ 背后的关键动机是时间复杂度，因为 ![ $$ {\\mathrm{b}}^{\\mathrm{d}/2}+{\\mathrm{b}}^{\\mathrm{d}/2}\
  \ $$ ](img/A449374_1_En_15_Chapter_IEq1.gif) 在复杂度上小于 b^d。因此，该方法可以为我们提供一种更高效、更快速的方式来找到目标状态。此外，如果两个搜索（向前和向后）都是\
  \ BFS 算法，并且 b 是有限的，那么 BS 保证既是最优的也是完备的。\n\n## 实践问题：实现 BFS、DFS、DLS 和 IDS\n\n为了开发我们的无信息搜索策略，我们将使用\
  \ `Tree<T>` 类，该类出现在代码清单 15-1 中。这个泛型类包含一个表示根节点可能值（整数、字符串、数组、矩阵等）的 `State` 属性和一个子节点列表。其中还包含了几个构造函数。\n\
  \n```\npublic class Tree\n{\npublic T State { get; set; }\npublic List> Children\
  \ { get; set; }\npublic Tree()\n{\nChildren = new List>();\n}\npublic Tree(T state,\
  \ IEnumerable> children)\n{\nState = state;\nChildren = new List>(children);\n}\n\
  public Tree(T state)\n{\nState = state;\nChildren = new List>();\n}\npublic bool\
  \ IsLeaf {\nget {  return Children.Count == 0; }\n}\n}\n代码清单 15-1\nTree 类\n```\n\
  \n为了实现良好的面向对象设计，我们将 `UninformedMethod<T>` 抽象类（代码清单 15-2）编码为本节描述的所有无信息搜索策略的父类和共享字段的容器。\n\
  \n```\npublic abstract class UninformedMethod\n{\npublic Tree Tree { get; set; }\n\
  protected UninformedMethod(Tree tree)\n{\nTree = tree;\n}\npublic abstract ListExecute();\n\
  }\n代码清单 15-2\nUninformedMethod 类\n```\n\n在 `Bfs<T>` 类（代码清单 15-3）中，我们使用 `Queue` 数据结构编码了\
  \ BFS 策略。该数据结构通过将子节点入队并最终将最先入队的节点出队来扩展节点；因此 `Queue` 的 FIFO（先进先出）特性使我们能够按层级遍历树。\n\
  \n```\npublic class Bfs: UninformedMethod\n{\npublic Bfs(Tree tree):base(tree)\n\
  { }\npublic override ListExecute()\n{\nvar queue = new Queue>();\nqueue.Enqueue(Tree);\n\
  var path = new List();\nwhile (queue.Count> 0)\n{\nvar current = queue.Dequeue();\n\
  path.Add(current.State);\nforeach (var c in current.Children)\nqueue.Enqueue(c);\n\
  }\nreturn path;\n}\n}\n代码清单 15-3\nBfs 类\n```\n\n代码清单 15-4 中实现的 DFS 依赖于栈数据结构，该结构用于模拟\
  \ DFS 本质上递归的特性；因此它帮助我们避免使用函数递归，并允许我们将编码简化为一个简单的循环。请记住：栈是 LIFO（后进先出）数据结构，因此我们按相反顺序将子节点压入栈中，如下代码所示。\n\
  \n```\npublic class Dfs :UninformedMethod\n{\npublic Dfs(Tree tree):base(tree)\n\
  {\n}\npublic override ListExecute()\n{\nvar path = new List();\nvar stack = new\
  \ Stack>();\nstack.Push(Tree);\nwhile (stack.Count> 0)\n{\nvar current = stack.Pop();\n\
  path.Add(current.State);\nfor (vari = current.Children.Count - 1; i>= 0; i$$)\n\
  stack.Push(current.Children[i]);\n}\nreturn path;\n}\n}\n代码清单 15-4\nDfs 类\n```\n\
  \n任何其他无信息搜索策略基本上都是前述策略（DFS 和 BFS）的变体。代码清单 15-5 中展示的深度受限搜索类是 DFS 的直接后代。在这个类中，我们包含了两个属性：\n\
  \n*   `DepthLimit`：定义达到的最大深度\n*   `Value`：确定要在状态树中查找的值\n\n在这种情况下，我们实现了 DFS 算法的递归版本；如果使用递归，我们更容易构建从根节点到\
  \ `Value` 节点的路径。请注意，算法中有三个停止条件：已找到 `Value` 节点、已达到深度限制或已到达叶节点。\n\n\n\n```\npublic\
  \ class Dls: UninformedMethod\n{\npublic intDepthLimit{ get; set; }\npublic T Value\
  \ { get; set; }\npublic Dls(Tree tree, intdepthLimit, T value) : base(tree)\n{\n\
  DepthLimit = depthLimit;\nValue = value;\n}\npublic override ListExecute()\n{\n\
  var path = new List();\nif (RecursiveDfs(Tree, 0, path))\nreturn path;\nreturn null;\n\
  }\nprivate bool RecursiveDfs(Tree tree, int depth, ICollection path)\n{\nif (tree.State.Equals(Value))\n\
  return true;\nif (depth == DepthLimit || tree.IsLeaf)\nreturn false;\npath.Add(tree.State);\n\
  if (tree.Children.Any(child =>RecursiveDfs(child, depth + 1, path)))\nreturn true;\n\
  path.Remove(tree.State);\nreturn false;\n}\n}\n清单 15-5\nDls 类\n```\n\n最后，如前所述，**迭代加深搜索**将深度限制搜索作为子方法，用于找到通往目标状态的最浅深度（清单\
  \ 15-6）。\n\n```\npublic class Ids :UninformedMethod\n{\npublic DlsDls{ get; set;\
  \ }\npublic intMaxDepthSearch{ get; set; }\npublic intDepthGoalReached{ get; set;\
  \ }\npublic T Value { get; set; }\npublic Ids(Tree tree, intmaxDepthSearch, T value)\n\
  : base(tree)\n{\nMaxDepthSearch = maxDepthSearch;\nValue = value;\n}\npublic override\
  \ ListExecute()\n{\nfor (var depth = 1; depth (Tree, depth, Value);\nDepthGoalReached\
  \ = depth;\nvar path = Dls.Execute();\nif (path != null)\nreturn path;\n}\nDepthGoalReached\
  \ = -1;\nreturn null;\n}\n}\n清单 15-6\nIds 类\n```\n\n`Ids<T>` 泛型类包含与在树中搜索的 `Value`\
  \ 对应的属性，以及用于确定找到的目标节点深度（`DepthGoalReached`）和搜索将到达的最大深度（`MaxDepthSearch`）的属性。从 `Execute()`\
  \ 方法中，我们可以看到该算法由一个循环组成，该循环在深度 0、1、……、`MaxDepthSearch` 上应用 DLS。\n\n让我们在控制台应用程序中测试我们的算法，并声明一个树，如清单\
  \ 15-7 所示。\n\n```\nvar tree = new Tree{ State = \"A\" };\ntree.Children.Add(new\
  \ Tree { State = \"B\",\nChildren = new List>\n{\nnew Tree(\"E\")\n} });\ntree.Children.Add(new\
  \ Tree { State = \"C\",\nChildren = new List>\n{\nnew Tree(\"F\")\n}\n});\ntree.Children.Add(new\
  \ Tree { State = \"D\" });\nvarbfs = new Bfs(tree);\nvardfs = new Dfs(tree);\nvardls\
  \ = new Dls(tree, 21, \"E\");\nvar ids = new Ids(tree, 10, \"F\");\nvar path = bfs.Execute();\n\
  //var path = dfs.Execute();\n// var path = dls.Execute();\n//var path = ids.Execute();\n\
  foreach (var e in path)\nConsole.Write(e + \", \");\n清单 15-7\n测试无信息搜索算法\n```\n\n\
  取消每个方法中 `Execute()` 行的注释，我们将得到图 15-7 中所示的结果，按 BFS、DFS、DLS、IDS 的顺序显示。\n\n![A449374_1_En_15_Fig7_HTML.jpg](img/A449374_1_En_15_Fig7_HTML.jpg)\n\
  \n图 15-7\n\n执行 BFS、DFS、DLS 和 IDS 后获得的结果\n\n请注意，在这种情况下，按照实现方式，BFS 和 DFS 都按其定义的顺序遍历树，而\
  \ DLS 和 IDS 则通过查找特定值在树上执行搜索。\n\n## 实际问题：在滑动拼图上实现双向搜索\n\n我们多次提到**滑动拼图**作为一个棋盘游戏的例子，可以使用到目前为止讨论的搜索策略来解决，在本节中，我们将实现一个双向搜索来解决\
  \ 8 数码问题（3 x 3 网格）。将双向搜索应用于滑动拼图的积极方面在于，计算交换操作的逆操作非常容易；换句话说，计算目标状态的前驱非常容易。我们只需要向每个可能的方向移动空白块。因此，为了从目标状态向后移动，我们不需要实现任何额外的功能，而是稍微调整我们用于前向搜索的相同扩展过程。\n\
  \n首先，让我们检查一下我们将用于处理节点扩展和游戏相关逻辑的 `SlidingTilesPuzzle` 和 `Board` 类（清单 15-8）。`SlidingTilesPuzzle`\
  \ 类非常简单，其唯一目的是提供一种有意义的方式来引用“游戏”并组织程序逻辑。开发 AI 的关键支持类是 `Board<T>`。\n\n```\npublic\
  \ class SlidingTilesPuzzle\n{\npublic Board Board { get; set; }\npublic Board Goal\
  \ { get; set; }\npublic SlidingTilesPuzzle(Board initial, Board goal)\n{\nBoard\
  \ = initial;\nGoal = goal;\n}\n}\npublic class Board :IEqualityComparer>\n{\npublic\
  \ T[,] State { get; set; }\npublic T Blank { get; set; }\npublic string Path { get;\
  \ set; }\nprivate readonly Tuple _blankPos;\nprivate readonlyint _n;\npublic Board()\
  \ {}\npublic Board(T[,] state, T blank, TupleblankPos, string path)\n{\nState =\
  \ state;\nBlank = blank;\n_n = State.GetLength(0);\n_blankPos = blankPos;\nPath\
  \ = path;\n}\npublic List>Expand(bool backwards = false)\n{\nvar result = new List>();\n\
  var up = Move(GameProgramming.Move.Up, backwards);\nvar down = Move(GameProgramming.Move.Down,\
  \ backwards);\nvarlft = Move(GameProgramming.Move.Left, backwards);\nvarrgt = Move(GameProgramming.Move.Right,\
