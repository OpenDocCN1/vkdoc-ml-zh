  我们针对分区问题（多目标优化问题加聚类问题）的 TS 伪代码如下：


  ```

  TsZoning()

  {

  currentSolution = InitialSolution();

  while(!stoppingConditionMet)

  {

  neighborhood = GetNeighborhoodSetTabu(currentSolution);

  /*选择当前解作为邻域集中具有最小类内值且不在禁忌表中的解*/

  currentSolution = BestFittingNeighbor(neighborhood);

  If (intensificationTime){

  /*为当前解生成邻域，最小化第二个目标*/

  MinimizeSecondObjective();

  }

  If (diversificationTime) {

  FrontierBuilder();

  }

  UpdateParetoFrontier();

  }

  }

  ```


  初始解将通过取前 k 个数据集元素作为中心，然后将剩余元素聚类到其最近的中心来生成。请注意，通常每个新的聚类或解都是在邻域中形成的，要么通过选择 k 个中心然后将剩余的
  n - k 个元素聚类到其最近的中心，要么通过对已形成的解进行逐步变化。


  本书提出的 TS 使用了一种哈希集合列表形式的禁忌表数据结构，该结构将解的中心存储为哈希集合。如果一个解包含中心 c = (1,2,3)，而另一个解包含中心 c''=(3,4,2)，那么禁忌表将包含
  T = ((1,2,3),(3,4,2))。哈希集合列表便于处理、插入和搜索。此外，可以高效地检查一个中心为 (1,2,3) 的解是否在禁忌表中，并且由于集合数据结构会将
  (1,2,3)、(2,3,1)、(1,3,2)、(2,1,3) 视为相等，因此可以防止重复。我们的禁忌表将禁止在一段时间内使用某些中心元组。


