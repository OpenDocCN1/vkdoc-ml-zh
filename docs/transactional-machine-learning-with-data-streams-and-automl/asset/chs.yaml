- "# 2. 事务性机器学习\n\n事务性机器学习（TML）是机器学习中一个激动人心的领域，它专门专注于将自动机器学习（AutoML）应用于数据流，以创建无摩擦且弹性的机器学习解决方案。本章将定义\
  \ TML 以及构建 TML 解决方案所需的相关重要技术。它还将讨论用于存储和处理数据流以进行分析和机器学习的（大）数据平台。将机器学习应用于数据流对于颠覆性技术至关重要\
  \ [Jayanthiladevi et al., 2018]。我们对 TML 的定义如下。\n\n**TML** **定义** **：** 计算机通过使用自动化机器学习，应用于全部或部分数据流集，从而从数据流中学习的能力，这导致了一个无摩擦且弹性的机器学习过程和解决方案，该过程是连续的且基本不受人类干预。\n\
  \n## 审视 TML\n\n让我们更仔细地审视一下 TML 的含义。事务是指实时产生或创建的数据，或者是在某个事件发生后立即生成和捕获的数据。例如，当你从事某项活动（如购买产品或服务）时，你就会产生事务数据：销售点（POS）机器会捕获并记录你的行为产生的数据，比如你为产品或服务支付了多少钱、购买数量、你的姓名、产品或服务名称、购买地点、支付信息等。这些事务代表了购买产品或服务的最新事件，因此捕获了你当前的行为或行动。随着数据速度的提高，做出更快决策的机会也随之增加。TML\
  \ 能够实现更快的决策，这对于时间敏感的业务用例（如欺诈检测、产品和服务推荐、物联网设备控制等）至关重要。表 2-1 展示了从数据挖掘和商业智能到 TML 的演变过程。随着数据速度的提高，我们正从关系型数据仓库演进到事件流平台，这将需要对机器学习流程进行更高程度的自动化，从而实现更快的决策。对于某些需要更高程度人工交互来进行\
  \ ML 模型构建、测试和部署，并产生更高摩擦的业务用例，其 ML 解决方案将随着更多 ML 流程的自动化而朝着更低摩擦的方向发展。此外，ML 解决方案中更低的摩擦也将带来更高的弹性，使得\
  \ ML 解决方案能够根据业务需求，通过快速调整 ML 解决方案的数量和组件来进行扩展或缩减。\n\n表 2-1\n\n向 TML 的演进^(⁵)\n\n|  \
