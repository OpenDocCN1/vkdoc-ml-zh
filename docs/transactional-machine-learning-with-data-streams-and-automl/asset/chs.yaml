  \ 键描述\n\n| 键名 | 描述 |\n| --- | --- |\n| **Hyperprediction** | 使用流输入数据从 TML 算法得出的预测。\
  \ |\n| **Algokey** | 用于进行预测的算法的键。 |\n| **Algo** | 用于进行预测的算法。该算法物理存储在磁盘上并已加密。 |\n\
  | **Usedeploy** | 如果值为 1，HPDE 使用了 /deploy 文件夹中的算法；否则，使用了 Test 文件夹（即 /Models 文件夹）中的算法。\
  \ |\n| **Created** | 算法创建的日期和时间。 |\n| **Unixtime** | Unix 时间。 |\n| **ConsumeridHPDE**\
  \ | HPDE 读取以检索算法的主题的消费者 ID。 |\n| **Producerid** | HPDE 写入结果的主题的生产者 ID。 |\n| **HPDEHOST**\
  \ | HPDE 主机 IP 地址。 |\n| **HPDEPORT** | HPDE 端口。 |\n| **Consumefrom** | 包含用于超预测的算法的\
  \ Kafka 主题。 |\n| **Produceto** | 用于生成超预测的 Kafka 主题。 |\n| **Brokerhost** | Kafka\
  \ 代理主机。 |\n| **Brokerport** | Kafka 代理端口。 |\n| **Kafkakey** | 与预测关联的 Kafka 键。 |\n\
  | **Inputdata** | 自变量的值——按照 **Fieldnames** 中显示的正确顺序（不包括 Date）。 |\n| **Fieldnames**\
  \ | TML 模型中的字段名称。 |\n| **DependentVariable** | TML 模型的因变量。 |\n| **Partition** |\
  \ 包含超预测的 Kafka 分区。 |\n| **Offset** | Kafka 偏移量——指定超预测的偏移量。 |\n\n\n\n我们甚至可以更进一步，通过对最优算法执行优化，通过最大化或最小化目标函数，来找到自变量的最优值。例如，为此，我们调用\
  \ ***viperhpdeoptimize***：\n\n```\nviperhpdeoptimize(vipertoken,host,port,consumefrom,produceto,companyname,consumerid,producerid,\
  \ hpdehost,partition=-1,offset=-1,enabletls=0, delay=100,hpdeport=-999,usedeploy=0,\
  \ ismin=1,constraints='best', stretchbounds=20, constrainttype=1,epsilon=10,brokerhost='',brokerport=-999,\
  \ timeout=120,microserviceid='')\n```\n\n其中\n\n*   Vipertoken、host 和 port – 是 VIPER\
  \ 连接详情。\n\n*   consumefrom – 是函数 ***viperhpdetraining*** 中 ***produceto*** 参数的主题名称。\n\
  \n*   Produceto – 是您希望将最优值保存到的主题名称。\n\n*   Companyname – 是您公司的名称。\n\n*   Consumerid\
  \ – 是 ***consumefrom*** 中主题的 consumerid。\n\n*   Producerid – 是 ***Produceto*** 中主题的\
  \ producerid。\n\n*   Hpdehost、hpdeport – 是 HPDE 连接详情。\n\n*   Partition、offset –\
  \ 是最优算法信息的位置。\n\n*   Enabletls、delay、brokerhost、brokerport、timeout、microserviceid\
  \ – 如前所述。\n\n*   Ismin – 如果您想最小化因变量，则设置为 1；如果想最大化，则设置为 0。\n\n*   Constraints – 您可以将其保留为“best”，让\
  \ VIPER 自行决定；或者，也可以使用以下格式为每个自变量设置：varname1:min:max,varname2:min:max,...\n\n*   Stretchbounds\
  \ – 这是一个百分比，用于扩展自变量约束的边界。例如，如果 stretchbounds=20，且 a 和 b 是变量 **var** 的边界，即 a < **var**\
  \ < b，那么 HPDE 会将 a 减小为 a-a*0.2，并将 b 增加为 b+b*0.2，即扩展 20%。\n\n*   Constrainttype –\
  \ 如果为 1，则 HPDE 使用每个变量的最小值/最大值作为边界；如果为 2，HPDE 将根据其标准差调整最小值/最大值；如果为 3，则 HPDE 使用 stretchbounds\
  \ 来调整每个变量的最小值/最大值。\n\n*   Epsilon – 这是一个百分比。如果 epsilon 为 10，那么一旦 HPDE 找到一个良好的局部最小值/最大值，它就会使用此\
  \ epsilon 值将自变量的输入值扰动 10%，以找到全局最小值/最大值，从而确保您获得能够最小化或最大化因变量的最佳自变量值。\n\n如果此函数成功执行，则您已对该算法执行了优化，并将为能够最小化或最大化因变量的自变量生成最优值。输出如代码清单\
  \ 6-3 所示。\n\n```\n{\n\"UserDetails\": {\n\"CreatedOn\": \"Fri, 15 Jan 2021 16:01:16\
