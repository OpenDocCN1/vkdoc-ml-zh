  \n图 6-6\n\n密钥和密码\n\n*   密钥\n\n*   密码\n\n请务必记录好此密钥和密码。这些将是您的云凭证——出于安全原因，我已将我的密钥模糊处理。\n\
  \n最后一步是前往**工具和客户端配置**，如图 6-7 所示。\n\n![../images/510404_1_En_6_Chapter/510404_1_En_6_Fig7_HTML.jpg](img/510404_1_En_6_Fig7_HTML.jpg)\n\
  \n图 6-7\n\n工具和客户端配置\n\n在图 6-8 中，向下滚动到 **Go** 并复制 ***bootstrap.servers*** 地址。\n\n\
  ![../images/510404_1_En_6_Chapter/510404_1_En_6_Fig8_HTML.jpg](img/510404_1_En_6_Fig8_HTML.jpg)\n\
  \n图 6-8\n\nBootstrap 服务器\n\n恭喜，您已成功在云中配置了 Kafka 集群。接下来，我们需要设置 MAADS-VIPER 环境信息。\n\
  \n### VIPER 环境文件\n\n为了使用 VIPER，需要将 Kafka 云的相关信息保存在一个名为 **VIPER.ENV** 的文件中。该文件包含连接到\
  \ Kafka 云所需的所有必要信息。此文件的详细信息如表 6-1 所示。其中包含多个可配置参数。这些配置是为 VIPER、VIPERviz 和 HPDE 的每个实例设置的。所有敏感信息（如密码）在文件被\
  \ VIPER 保存和访问后将被隐藏。如果您用新信息更新此文件，则必须重启 VIPER、VIPERviz 和 HPDE，新信息才能生效。在构建 TML 解决方案时，我们将回头参考此表。此文件在\
  \ VIPER、HPDE 和 VIPERviz 之间共享。\n\n表 6-1\n\nVIPER.ENV 配置详情\n\n\n\n| 配置参数 | 描述 |\n\
  | --- | --- |\n| KAFKA_ADVERTISED_HOST_NAME | Kafka 服务器属性中的广播主机名。此为可选参数。 |\n| KAFKA_ZOOKEEPER_CONNECT\
  \ | Zookeeper 主机名和端口。此为可选参数。 |\n| KAFKA_CONNECT_BOOTSTRAP_SERVERS | Kafka 引导服务器——多个服务器之间用逗号分隔。此为必填参数。\
  \ |\n| KAFKA_ROOT | Kafka 根文件夹。如果使用 Kafka Cloud，只需输入“kafka”。此为可选参数。 |\n| HPDE_SERVER\
  \ | **自动机器学习**需要 HPDE（边缘设备超预测）。指定安装 HPDE 的主机。此为可选参数。 |\n| HPDE_PORT | HPDE 监听端口。此为可选参数。\
  \ |\n| SSL_CLIENT_CERT_FILE | 如果 Kafka 启用了 SSL/TLS，则需要 SSL 证书文件。此为必填参数。 |\n| SSL_CLIENT_KEY_FILE\
  \ | 如果 Kafka 启用了 SSL/TLS，则需要 SSL 证书密钥存储文件。此为必填参数。 |\n| SSL_SERVER_CERT_FILE | 如果\
  \ Kafka 启用了 SSL/TLS，则需要 SSL 证书服务器密钥文件。此为必填参数。 |\n| CLOUD_USERNAME | 用于连接 Confluent\
  \ Cloud 的 SASL_PLAIN 用户名。此为必填参数。 |\n| CLOUD_PASSWORD | 用于连接 Confluent Cloud 的 SASL_PLAIN\
  \ 密码。此为必填参数。 |\n| MAILSERVER | 用于发送电子邮件的 SMTP 邮件服务器主机名。如果使用 **AiMS Dashboard** 监控\
  \ Kafka 中的算法，则需要此参数。此为可选参数。 |\n| MAILPORT | 用于发送电子邮件的 SMTP 邮件服务器端口。如果使用 **AiMS Dashboard**\
  \ 监控 Kafka 中的算法，则需要此参数。此为可选参数。 |\n| FROMADDR | 电子邮件中显示的发送地址。如果使用 **AiMS Dashboard**\
  \ 监控 Kafka 中的算法，则需要此参数。此为可选参数。 |\n| SMTP_USERNAME | SMTP 用户名。如果使用 **AiMS Dashboard**\
  \ 监控 Kafka 中的算法，则需要此参数。此为可选参数。 |\n| SMTP_PASSWORD | SMTP 密码。如果使用 **AiMS Dashboard**\
  \ 监控 Kafka 中的算法并开启了告警，则需要此参数。此为可选参数。 |\n| SMTP_SSLTLS | 邮件服务器是否启用 SSL/TLS：true 或\
  \ false。如果使用 **AiMS Dashboard** 监控 Kafka 中的算法并开启了告警，则需要此参数。此为可选参数。 |\n| SERVICE_USERNAME\
  \ | 如果使用 ServiceNow，请指定 ServiceNow 网页登录用户名。如果使用 **AiMS Dashboard** 监控 Kafka 中的算法并开启了告警，则需要此参数。此为可选参数。\
  \ |\n| SERVICE_PASSWORD | 如果使用 ServiceNow，请指定 ServiceNow 网页登录密码。如果使用 **AiMS Dashboard**\
  \ 监控 Kafka 中的算法并开启了告警，则需要此参数。此为可选参数。 |\n| SERVICE_ASSIGNEE | 如果使用 ServiceNow，请指定\
  \ ServiceNow 名称，用于分配 ServiceNow 工单。如果使用 **AiMS Dashboard** 并开启了告警，则需要此参数。此为可选参数。\
  \ |\n| SERVICE_FORM_FIELDS | `{\"key1\":\"Assignedto\",\"key2\":\"LastReadofTopic\"\
  ,\"key3\":\"Consumerid\", \"key4\":\"Brokerhost\",\"key5\":\"Brokerport\",\"key6\"\
  :\"Companyname\", \"key7\":\"Contactemail\",\"key8\":\"Contactname\",\"key9\":\"\
  Description\", \"key10\":\"Location\",\"key11\":\"Topic\",\"key12\":\"Priority\"\
  ,\"key13\":\"Producerid\",\"key14\":\"LastWritetoTopic\"}`用户应将“Key”值替换为 ServiceNow\
  \ 表单中的字段名称。VIPER 在向 ServiceNow 提交事件时会更新这些键值。如果使用 **AiMS Dashboard** 并开启了告警，则需要此参数。此为可选参数。\
  \ |\n| SERVICE_CONTENTTYPE=application/json | ServiceNow 网页内容类型。此参数可以更改，但 **application/json**\
  \ 应该没问题。如果使用 **AiMS Dashboard** 并开启了告警，则需要此参数。此为可选参数。 |\n| POLLING_ALERTS | 轮询告警的间隔（分钟）。如果使用\
  \ **AiMS Dashboard** 并开启了告警，则需要此参数。VIPER 将轮询告警，并等待指定分钟数后进行下一次轮询。此为可选参数。 |\n| COMPANYNAME\
  \ | 指定公司名称。从 AiMS Dashboard 发送电子邮件时使用此参数。此为可选参数。 |\n\n对于本书中的示例，请在您的 VIPER.ENV 文件中进行以下更新（您的信息当然会与这里显示的不同；我已放入我的\
  \ Kafka 集群地址）：\n\n*   CLOUD_PASSWORD=[Secret]\n    1.  将 [Secret] 替换为图 6-6 中复制的\
  \ Secret。\n\n*   KAFKA_CONNECT_BOOTSTRAP_SERVERS=pkc-419q3.us-east4.gcp.confluent.cloud:9092^(⁶⁹)\n\
  \n*   CLOUD_USERNAME=[Key]\n    1.  将 [Key] 替换为图 6-6 中复制的 Key。\n\n由于我们要加密进出 Kafka\
  \ Cloud 的流量，因此需要使用 SSL/TLS 设置双向加密。为此，我们需要将三个文件转换为 PEM 格式。^(⁷⁰)（请注意，GitHub 上的 VIPER、VIPERviz\
  \ 和 HPDE 分发文件中提供了示例 .PEM 文件，但这些文件仅用于测试；应将其替换为您的官方文件证书。）\n\n*   客户端证书文件\n\n*   客户端密钥文件\n\
  \n*   服务器证书文件\n\n请注意，您可能需要事先准备好以下文件^(⁷¹)：\n\n*   kafka.server.truststore.jks\n\n\
  *   kafka.server.keystore.jks\n\n以下是执行此操作的常见步骤：\n\n*   ***$keytool*** -importkeystore\
  \ -srckeystore *kafka.server.keystore.jks* ​-destkeystore client.p12 -deststoretype\
  \ PKCS12\n\n*   ***$openssl*** pkcs12 -in client.p12 -nokeys -out client.cer.pem\n\
  \n*   ***$openssl*** pkcs12 -in client.p12 -nodes -nocerts -out client.key.pem\n\
  \    *   **输出：** client.cer.pem\n\n*   **输出：** client.key.pem\n\n1.  接下来，转换客户端密钥库：\n\
  \n*   **$keytool** -importkeystore -srckeystore kafka.server.truststore.jks ​-destkeystore\
  \ server.p12 -deststoretype PKCS12\n\n*   **$openssl** pkcs12 -in server.p12 -nokeys\
  \ -out server.cer.pem\n    *   **输出：** server.cer.pem\n\n1.  首先，使用 keytools 和 openssl\
  \ 提取证书颁发机构 (CA)：\n\n然后，您将使用 PEM 文件的完整路径更新 VIPER.ENV 文件，如下所示：^(⁷²)\n\n*   SSL_CLIENT_CERT_FILE=c:/viper/client.cer.pem\n\
  \n*   SSL_CLIENT_KEY_FILE=c:/viper/client.key.pem\n\n*   SSL_SERVER_CERT_FILE=c:/viper/server.cer.pem\n\
  \n如果一切操作正确，VIPER、HPDE 和 VIPERviz 将能够使用 SSL/TLS 加密与 Kafka 进行安全通信。下一节将讨论如何设置这些技术。\n\
  \n\n\n## VIPER、VIPERviz 和 HPDE 设置\n\nVIPER、VIPERviz 和 HPDE 可安装在 Windows、Linux 或\
  \ MacOS 操作系统上^(⁷³)，无需额外的软件组件或数据库。这些技术各自监听主机 IP 地址和端口号上的连接，这意味着你可以通过 REST API 结合\
  \ TML Python 库^(⁷⁴)（本章将使用该库）连接到它们。解决方案架构师和开发人员也会发现，将这些技术像*微服务*一样使用非常便捷，它们可以支持特定的\
  \ TML 解决方案，从而更容易通过负载削减来构建超大型 TML 解决方案。所有这些技术都与作为数据骨干的 Apache Kafka 紧密集成，这使得开发人员能够构建\
  \ TML 解决方案，无论其消耗的数据流、算法和洞察有多少。此外，这些技术不需要互联网连接，因为 Kafka 也可以在本地运行（我们将在云端使用 Confluent\
  \ Cloud 上的 Kafka，该云平台基于 Google Cloud Platform）。然而，在开发可用于生产的 TML 解决方案时，首选 Kafka Cloud。\n\
  \nVIPER 已通过 Confluent 与 Apache Kafka 的验证和测试，可从其网站^(⁷⁵)或 GitHub^(⁷⁶)下载。只需解压缩文件，并按照软件包中提供的安装说明进行操作即可。所有最新版本的技术均可从\
  \ GitHub 网站下载。启动 VIPER、VIPERviz 或 HPDE 时，用户可以在命令行输入“Help”，帮助屏幕将详细列出所有必要信息。具体来说，对于希望通过\
  \ REST API 连接的用户，该屏幕将提供所有 REST 命令。在我们的示例中，我们只需要连接到 VIPER，VIPER 将管理到 HPDE 的连接。\n\n\
  如果使用 MAADSTML Python 库，用户可以在 Jupyter Notebook 中编写 Python 代码，或通过下载 Python^(⁷⁷) 来编写。Python\
  \ 和 Jupyter 都非常流行，并且有许多资源可供你学习这些技术。其他问题应通过发送电子邮件至 info@otics.ca 联系 OTICS。或者，你也可以在\
  \ LinkedIn 上加入事务性机器学习小组^(⁷⁸)。下一节将讨论如何创建主题和连接数据流。\n\n### Kafka 主题和数据流\n\nKafka 和\
  \ TML 解决方案的一个基本组成部分是主题和数据流。我们已经在之前的章节中讨论过主题和数据流。本节将讨论如何创建和使用主题（或数据流）来创建训练数据集。首先，确保你已经下载并安装了\
  \ Python 编程语言。然后，打开 Python IDE，或者如果你使用 Jupyter Notebook，则在 Windows、Linux 或 MacOS\
  \ 中通过调用 ***jupyter notebook*** 来启动 Jupyter。我们的示例将使用 Windows 操作系统。接着，通过在命令提示符中调用\
  \ ***pip install maadstml*** 来安装 MAADSTML Python 库。这样就完成了。然后，要在 Kafka 中创建主题，你将使用函数\
  \ ***vipercreatetopic***。这个 Python 函数需要以下输入参数：^(⁷⁹)\n\n```\nvipercreatetopic(vipertoken,host,port,topic,companyname,contactname,contactemail,location,\
  \ description,enabletls=1, brokerhost='',brokerport=-999, numpartitions=2, replication=3,\
  \ microserviceid='')\n```\n\n其中\n\n*   vipertoken – 此令牌包含在 VIPER 分发文件中。\n\n*   host\
  \ – 这是 VIPER 的主机地址。\n\n*   port – 这是 VIPER 监听连接的端口。\n\n*   topic – 这是你想要创建的主题。多个主题可用逗号分隔。\n\
  \n*   companyname – 这是你公司的名称。\n\n*   contactname – 创建主题的联系人姓名。\n\n*   contactemail\
  \ – 创建主题的联系人电子邮件。\n\n*   location – 创建主题的联系人所在地。\n\n*   description – 主题的描述。\n\n\
  *   enabletls – 如果 Kafka 中启用了 SSL/TLS，则将此参数设置为 1；默认情况下，Kafka Cloud 中已启用此功能。\n\n\
  *   brokerhost – 指定 Kafka 代理主机。此为可选参数；如果留空，则 VIPER 将使用 KAFKA_CONNECT_BOOTSTRAP_SERVERS\
  \ 中的值。\n\n*   brokerport – 指定 Kafka 代理端口。此为可选参数；如果留空，则 VIPER 将使用 KAFKA_CONNECT_BOOTSTRAP_SERVERS\
  \ 中的端口值。\n\n*   numpartitions – 指定要在主题中创建的分区数。虽然默认设置为 2，但如果要从该主题消费的人数增加，你可能需要随着时间的推移增加此数量，以确保信息传递的并行处理。例如，如果有\
  \ 10 个人想要从该主题消费，请考虑将分区设置为 10。\n\n*   replication – 这是复制因子，告诉 Kafka 为了故障转移需要将主题复制多少次。Kafka\
  \ 的服务端最小值为 3。\n\n*   microserviceid – 如果使用反向代理进行负载削减，则可以在此处指定代理的名称。\n\n有些人可能会问为什么需要\
  \ companyname、contactname 等信息。这些信息在 AiMS 中管理主题时会很有用。如果你创建了数千个主题，能够识别谁创建了主题以及它们的用途将有助于改进主题（即\
  \ TML 解决方案）的管理，尤其是在 TML 解决方案出现问题时。你可能会发现，将业务/产品名称放在 companyname 中，有助于企业 IT 部门更好地跟踪\
  \ TML 解决方案。主题创建成功后，该函数将返回一个 ***producerid***。向主题生产数据时需要此 producerid。每个主题都有一个唯一的\
  \ producerid。\n\n要向主题生产数据，我们将使用函数 ***viperproducetotopic***。这个 Python 函数需要以下输入参数：\n\
  \n```\nviperproducetotopic(vipertoken,host,port,topic,producerid,enabletls=1,delay=100,inputdata='',maadsalgokey='',maadstoken='',getoptimal=0,externalprediction='',brokerhost='',brokerport=-999,microserviceid='')\n\
  ```\n\n其中\n\n*   vipertoken – 此令牌包含在 VIPER 分发文件中。\n\n*   host – 这是 VIPER 的主机地址。\n\
  \n*   port – 这是 VIPER 监听连接的端口。\n\n\n\n*   **topic** – 这是您要写入的主题。您可以用逗号分隔多个主题。如果使用多个主题，则必须具有相同数量的生产者\
  \ ID（以逗号分隔）和相同数量的外部预测（以逗号分隔）。一次性写入多个主题便于同步机器学习流的时序，并加速大量主题的创建。\n\n*   **producerid**\
  \ – 这是从 ***vipercreatetopic*** 返回的生产者 ID。\n\n*   **enabletls** – 如果在 Kafka 中启用了\
  \ SSL/TLS，则将此参数设置为 1；默认情况下，Kafka Cloud 中已启用此功能。\n\n*   **delay** – 此延迟参数是 VIPER\
  \ 等待 Kafka 响应消息已写入 Kafka 主题的确认所花费的毫秒数。\n\n*   **inputdata** – 对于 TML，此参数可忽略。\n\n\
  *   **maadsalgokey^(⁸⁰)** – 对于 TML，此参数可忽略。\n\n*   **maadstoken** – 对于 TML，此参数可忽略。\n\
  \n*   **getoptimal** – 对于 TML，此参数可忽略。\n\n*   **externalprediction** – 在此参数中输入一个值以写入主题。\n\
  \n*   **brokerhost** – 指定 Kafka 代理主机。此为可选参数；如果留空，则 VIPER 将使用 `KAFKA_CONNECT_BOOTSTRAP_SERVERS`\
  \ 中的值。\n\n*   **brokerport** – 指定 Kafka 代理端口。此为可选参数；如果留空，则 VIPER 将使用 `KAFKA_CONNECT_BOOTSTRAP_SERVERS`\
  \ 中的端口值。\n\n*   **microserviceid** – 如果使用反向代理进行负载削减。\n\n您可以在循环中使用上述函数，持续将数据写入 Kafka\
  \ 主题。您可以并行写入多个主题，这仅取决于您如何设计解决方案以及正在运行的 VIPER 实例数量。此函数将返回一个 JSON 对象，其中包含有关写入值、该值在\
  \ Kafka 中的键的详细信息，包括写入的分区、偏移量和时间戳。每个数据点可以通过以下内容在 Kafka 中唯一标识：\n\n*   **Topic**（主题）\n\
  \n*   **Partition**（分区）\n\n*   **Offset**（偏移量）\n\nKafka 使用唯一键来优化数据存储。对于非常大的数据集，这对于快速从主题中引用和消费数据至关重要。主题名称应谨慎选择，因为它们将标识构建训练数据集时所需的因变量和自变量流。一个简单的约定是使用\
  \ `[公司 ID]-[项目 ID]-[解决方案名称或 ID]-[输入或输出流]`。例如，`otics-iot-iotfailureprediction-sensorreadings-input`\
  \ 和 `otics-iot-iotfailureprediction-sensorreadings-predictions-output` 分别表示 TML\
  \ 解决方案 `iotfailureprediction` 的输入和输出流。这样，用户需要订阅哪些主题进行消费和可视化就一目了然了。无论您使用何种约定，都应保持一致。\n\
  \n虽然 Kafka 在使用分区存储大数据方面非常巧妙，但这也会使数据检索变得复杂。具体来说，Kafka 会选择它想要写入的分区以优化存储。检索数据时的挑战在于，您需要进行额外的处理来确定哪些数据是***最新***的数据。例如，如果一个主题有三十\
  \ (30) 个分区，Kafka 会将您的数据写入其中任何一个分区。在消费这些数据时，您将不知道哪个分区包含***最新***的数据。幸运的是，您可以告诉 VIPER\
  \ 使用值为 `-1` 的 `partition` 关键字来搜索每个分区以获取最新数据。由于 Kafka 中存储的每个值都有日期和时间值（人类可读的日期/时间以及\
  \ Unix 时间），因此您可以检查每个值的日期和时间戳，以确定哪个是***最新***的值。虽然在许多情况下这不是问题，但在某些情况下，您可能希望知道主题中存储的最新值。\n\
  \n为了**即时**构建训练数据集，我们将使用以下三个函数：\n\n*   `vipercreatejointopicstreams`\n\n*   `viperproducetotopicstream`\n\
  \n*   `vipercreatetrainingdata`\n\n首先，**vipercreatejointopicstreams** 定义如下：\n\n\
  ```\nvipercreatejointopicstreams(vipertoken,host,port,topic,topicstojoin,companyname,contactname,contactemail,\
  \ description,location,enabletls=0,brokerhost='',brokerport=-999, replication=1,\
  \ numpartitions=1, microserviceid='')\n```\n\n其中：\n\n*   **vipertoken** – 此令牌包含在\
  \ VIPER 发行版文件中。\n\n*   **host** – 这是 VIPER 的主机地址。\n\n*   **port** – 这是 VIPER 监听连接的端口。\n\
  \n*   **topic** – 这是将为连接流创建的主题。\n\n*   **topicstojoin** – 这是您要连接的数据流列表（即因变量和自变量流）。这些数据流应已存在。多个流之间用逗号分隔。\n\
  \n*   为此主题指定 **companyname**、**contactname**、**contactemail**、**description**、**location**、**enabletls**、**brokerhost**、**brokerport**、**replication**、**numpartitions**\
  \ 和 **microserviceid**，如前所述。请注意，某些字段是可选的。\n\n此函数将返回写入此主题所需的 ***producerid***。此函数充当指向将要连接的主题的指针。此指针将用于下一个函数，该函数将向此流生成数据。具体来说，一旦创建了连接的主题流，我们就可以向此流生成数据。为此，我们使用函数\
  \ ***viperproducetotopicstream***：\n\n*   **vipertoken** – 此令牌包含在 VIPER 发行版文件中。\n\
  \n*   **host** – 这是 VIPER 的主机地址。\n\n*   **port** – 这是 VIPER 监听连接的端口。\n\n*   **topic**\
  \ – 这是将包含来自连接流的所有数据的主题。\n\n*   **producerid** – 这是从 ***vipercreatejointopicstreams***\
  \ 返回的生产者 ID。\n\n*   **offset** – 这是从每个数据流开始读取数据的位置。具体来说，如果 `offset=0`，则此函数将从其连接的每个流的开头开始。如果\
  \ `offset=-1`，它将从最新值开始。此参数有助于避免检索大量数据，这可能会影响 TML 解决方案的性能。\n\n*   **maxrows** – 这是要***回滚***流的偏移量数量。对于监督学习模型，每个流中必须至少有\
  \ 30 个数据点。\n\n*   **enabletls**、**delay**、**brokerhost**、**brokerport** 和 **microserviceid**\
  \ 的定义如前所述。\n\n```\nviperproducetotopicstream(vipertoken,host,port,topic,producerid,offset,maxrows,enabletls,delay,\
  \ brokerhost='', brokerport=-999, microserviceid='')\n```\n\n此函数***同时***从所有数据流消费数据，并将其写入连接的主题流。回想一下，要连接的数据流位于参数\
  \ ***topicstojoin*** 中。读者可以利用这个强大的函数持续从多个数据流读取数据并实时连接它们。***maxrows*** 是用于回滚流的偏移量。具体来说，当\
  \ VIPER 同时从每个流检索数据时，它使用 `maxrows` 偏移量回滚每个流，然后将所有数据流合并到流主题中。此函数将执行以下步骤：\n\n1.  使用\
  \ `maxrows` 确保每个流具有相同数量的值。例如，被连接的流可能具有不同数量的数据点；对于机器学习，每个流中的数据量必须相同。\n\n2.  修剪流，以确保它们都具有相同数量的数据。例如，如果您连接三个流（流\
  \ 1 = 100 个数据点，流 2 = 150 个数据点，流 3 = 50 个数据点），则此函数将采用数据点最少的流（流 3），并将流 1 和流 2 修剪为\
  \ 50 个数据点。这确保了所有流最多有 50 个数据点。\n\n3.  将新的、修剪后的数据流生成到一个新主题，以构建训练数据集。\n\n\n\n如果 offset=-1，VIPER\
  \ 将回退流，这意味着当 offset=-1 时，你是在告诉 VIPER 定位到每个流的***最后一个偏移量***（技术上即流的末尾），然后根据 rollback=lastoffset-maxrows\
  \ 确定的偏移量回退该流。这个包含合并数据的流将用于构建训练数据集。\n\n在创建训练数据集之前，我们需要订阅刚刚创建的主题。为此，请调用函数 **vipersubscribeconsumer**\
  \ :^(⁸¹)\n\n```\nvipersubscribeconsumer(vipertoken,host,port,topic,companyname,contactname,contactemail,\
  \ location,description, brokerhost='', brokerport=-999,groupid='',microserviceid='')\n\
  ```\n\n其中\n\n*   vipertoken – 此令牌包含在 VIPER 发行文件中。\n\n*   host – 这是 VIPER 的主机地址。\n\
  \n*   port – 这是 VIPER 监听连接的端口。\n\n*   topic – 要订阅的主题名称。\n\n*   所有其他参数与之前类似。\n\n\
  该函数将返回一个消费者 ID：***consumerid***。每个主题的消费者都会使用一个唯一的消费者 ID。消费者 ID 允许 AiMS 跟踪和控制每个消费者，并记录读取的字节数。我们也可以通过调用函数\
  \ ***vipercreatetopic*** 为我们的训练数据集创建一个主题，该函数将返回 ***producerid***。我们需要 producerid\
  \ 和 consumerid 来创建训练数据集。\n\n现在，我们终于可以通过调用 ***vipercreatetrainingdata*** 来创建训练数据集了：\n\
  \n*   vipertoken – 此令牌包含在 VIPER 发行文件中。\n\n*   host – 这是 VIPER 的主机地址。\n\n*   port\
  \ – 这是 VIPER 监听连接的端口。\n\n*   consumefrom – 这是我们创建并使用函数 ***viperproducetotopicstream***\
  \ 生成合并流数据的主题。我们还通过调用 ***vipersubscribeconsumer*** 订阅了此主题，并将使用返回的 consumerid。\n\n\
  *   produceto – 这是我们将生成训练数据集的目标主题，即我们使用函数 ***vipercreatetopic*** 创建的主题。\n\n*   dependentvariable\
  \ – 因变量流的名称。这应与 *vipercreatejointopicstreams* 中的因变量匹配。\n\n*   independentvariables\
  \ – 自变量流的名称。这应与 *vipercreatejointopicstreams* 中的自变量匹配。\n\n*   consumerid – 这是 *consumefrom*\
  \ 主题的消费者 ID。\n\n*   producerid – 这是 *produceto* 主题的生产者 ID。\n\n*   offset – 这是 *consumefrom*\
  \ 主题中开始读取的偏移量或位置。\n\n*   companyname – 训练数据集所有者的公司名称。\n\n*   partition – 这是由 ***viperproducetotopicstream***\
  \ 生成的数据的分区位置。确保使用正确的数据来创建训练数据集非常重要。\n\n*   enabletls 和 delay 如前所述。\n\n*   brokerhost、brokerport\
  \ 和 microserviceid 与之前相同。\n\n```\nvipercreatetrainingdata(vipertoken,host,port,consumefrom,produceto,dependentvariable,\
  \ independentvariables, consumerid, producerid,companyname,partition=-1, enabletls=0,delay=100,\
  \ brokerhost='',brokerport=-999,microserviceid='')\n```\n\n训练数据集将存储在 Kafka 中，具体位于\
  \ ***Produceto*** 参数指定的主题内。我们终于可以调用 HPDE 对训练数据集执行 TML 以进行监督学习了。为此，我们需要调用 ***viperhpdetraining***：\n\
  \n```\nviperhpdetraining(vipertoken,host,port,consumefrom,produceto,companyname,consumerid,producerid,\
  \ hpdehost, viperconfigfile, enabletls=1,partition=-1,deploy=0, modelruns=50, modelsearchtuner=80,\
  \ hpdeport=-999,offset=-1, islogistic=0, brokerhost='', brokerport=-999,timeout=120,microserviceid='')\n\
  ```\n\n其中\n\n*   vipertoken、host 和 port 是 VIPER 的连接详细信息，与之前相同。\n\n*   consumefrom\
  \ – 这是我们在函数 ***vipercreatetrainingdata*** 的 ***Produceto*** 参数中生成训练数据集所用的 Kafka\
  \ 主题名称。您应该已经订阅了此主题并保存了 consumerid。\n\n*   produceto – 这是 HPDE 将存储最优算法详细信息的主题名称。您应该已经创建了此主题并保存了\
  \ ***producerid***。\n\n*   Companyname – 指定您的公司名称。\n\n*   Consumerid – ***consumefrom***\
  \ 参数中主题的消费者 ID。\n\n*   Producerid – ***produceto*** 主题中主题的生产者 ID。\n\n*   Hpdehost\
  \ – HPDE 的主机地址。\n\n*   Hpdeport – HPDE 监听的端口。\n\n*   Viperconfile – 磁盘上 VIPER.ENV\
  \ 文件的完整路径。\n\n*   Enabletls – 如果 Kafka 中启用了 SSL/TLS，则设置为 1；否则设置为 0。\n\n*   Partition\
  \ – 这是由 ***vipercreatetrainingdata*** 返回的训练数据集的分区号。此分区确保您使用的是正确的训练数据集。\n\n*   Deploy\
  \ – 如果为 1，则 HPDE 会将算法保存在 **deploy** 文件夹中。如果为 0，则仅将其保存到 Models 文件夹。如果您想测试算法而尚未在生产中使用它，这将非常有用。\n\
  \n*   Modelruns – HPDE 将运行以找到最佳算法的模型数量。该数字越大，HPDE 找到最优算法所需的时间就越长。\n\n*   Modelsearchtuner\
  \ – 一个介于 0 和 100 之间的整数。此变量将尝试微调模型搜索空间。接近 0 的数字意味着您将拥有大量模型，但其质量可能较低；接近 100（默认值=80）的数字意味着您将拥有较少的模型，但其质量会更高。\n\
  \n*   Offset – 训练数据集的偏移量数字位置。通常设置为 -1 以选择最后一个偏移量中的最新训练数据集。\n\n*   Islogistic – 如果因变量是二元变量，则将此参数设置为\
  \ 1，否则对于连续因变量设置为 0。\n\n*   Brokerhost、brokerport 和 microserviceid 与之前相同。\n\n*  \
  \ Timeout – 这是 VIPER 等待 HPDE 响应的秒数。\n\n如果 HPDE 成功响应，那么恭喜您，您刚刚使用了核心的 TML 函数。我们将把这些函数应用于一个实际示例，以便您更好地了解这些函数可以应用于哪些用例。训练函数将返回使用\
  \ ***viperhpdepredict*** 和 ***viperhpdeoptimize*** 函数进行预测或优化所需的所有信息。一个 TML 输出示例如清单\
  \ 6-1 所示。\n\n```\n{\n\"Algokey\": \"ConsumerId-TYq4wDnyS5pVqzImGQIwVQzGD1LrZ0_json\"\
