  \ – 表示使用 HTTPS (端口: 8003)；如果 secure=0，则将使用 HTTP (端口: 8002)。\n\n8.  **consumerid**=[输入主题为\
  \ otic-tmlbook-walmartretail-foottraffic-prediction-results-output 的消费者 ID] – 此消费者\
  \ ID 将从沃尔玛客流量程序文件中输出。\n\n9.  **vipertoken**=hivmg1TMR1zS1ZHVqF4s83Zq1rDtsZKh9pEULHnLR0BXPlaPEMZBEAyC7TY0\n\
  \n2.  沃尔玛示例的优化结果\n    1.  `https://127.0.0.1:8003/optimization.html?topic=otics-tmlbook-walmartretail-foottraffic-optimization-results-output&offset=-1&groupid=&rollbackoffset=10&topictype=optimization&secure=1&append=0&consumerid=[输入主题为\
  \ otic-tmlbook-walmartretail-foottraffic-prediction-results-output 的消费者 ID]&vipertoken=hivmg1TMR1zS1ZHVqF4s83Zq1rDtsZKh9pEULHnLR0BXPlaPEMZBEAyC7TY0`\n\
  \n2.  URL 字段\n        1.  所有字段与预测 URL 类似，但有以下更改：\n            1.  **optimization.html**\n\
  \n2.  **topic=otics-tmlbook-walmartretail-foottraffic-optimization-results-output**\n\
  \n3.  **topictype=optimization**\n\n4.  **consumerid=[输入主题为 otic-tmlbook-walmartretail-foottraffic-prediction-results-output\
  \ 的消费者 ID]** – 这将在沃尔玛预测和优化程序中为您输出。\n\n3.  银行欺诈异常检测\n    1.  `https://127.0.0.1:8003/anomaly.html?topic=otics-tmlbook-anomalydataresults&offset=-1&rollbackoffset=10&append=0&topictype=anomaly&secure=1&groupid=&consumerid=[输入您的消费者\
  \ ID]&vipertoken=hivmg1TMR1zS1ZHVqF4s83Zq1rDtsZKh9pEULHnLR0BXPlaPEMZBEAyC7TY0`\n\
  \        1.  URL 字段\n            1.  所有字段与预测 URL 类似，但有以下更改：\n                1.\
  \  **anomaly.html**\n\n2.  **topic=otics-tmlbook-anomalydataresults**\n\n3.  **topictype=anomaly**\n\
  \n4.  **consumerid=[输入您针对 otic-tmlbook-anomalydataresults 的消费者 ID]** – 这将在银行欺诈程序中输出。\n\
  \n4.  通用可视化\n    1.  您可以组合数据流并进行可视化。\n\n2.  对于沃尔玛用例，您可以使用以下 URL：`https://127.0.0.1:8003/generictopics.html?topic=otics-tmlbook-walmartretail-foottraffic-prediction-results-output,otics-tmlbook-walmartretail-foottraffic-optimization-results-output&offset=-1&groupid=&rollbackoffset=1&topictype=generic&append=0&secure=1&consumerid=&vipertoken=hivmg1TMR1zS1ZHVqF4s83Zq1rDtsZKh9pEULHnLR0BXPlaPEMZBEAyC7TY0`\n\
  \        1.  URL 字段\n            1.  **generictopics.html**\n\n2.  **topic=otics-tmlbook-walmartretail-foottraffic-prediction-results-output,otics-tmlbook-walmartretail-foottraffic-optimization-results-output**\
  \ – 组合多个主题，并用逗号分隔。\n\n5.  AiMS 仪表盘\n    1.  `https://127.0.0.1:8003/aims.html?secure=1&vipertoken=hivmg1TMR1zS1ZHVqF4s83Zq1rDtsZKh9pEULHnLR0BXPlaPEMZBEAyC7TY0`\n\
  \n2.  使用 **Aims.html**\n\n以下各节将描述每个可视化文件。\n\n\n\n## 流式异常检测可视化\n\n异常检测已在第 6 章中详细讨论。成功开发异常检测模型的一部分工作是为对等组和预测选择合适的标志。由于数据流多种多样，应仔细选择标志中的参数，以恰当地代表一个合理的对等组，从而最大限度地减少误报和漏报。VIPERviz\
  \ 提供了强大的流式可视化功能，并与 Kafka 集成，可将异常推送到您的 Web 浏览器。您可以使用此可视化来帮助微调用于异常训练和预测的标志。VIPERviz\
  \ 将通过文件 `anomaly.html` 连接并开始流式传输异常检测结果，该文件会生成一个带注释的时间线图表，如图 7-1 所示。\n\n![../images/510404_1_En_7_Chapter/510404_1_En_7_Fig1_HTML.jpg](img/510404_1_En_7_Fig1_HTML.jpg)\n\
  \n图 7-1\n\nVIPERviz 异常结果\n\n对于上述异常可视化表格，显示以下字段：\n\n*   **分析时间** – 异常分析的日期/时间。\n\
  *   **状态** – 如果显示 X，则表示非异常；如果显示对勾，则应更仔细地查看此交易。\n*   **风险评分** – 计算风险评分。\n*   **风险阈值**\
  \ – 用户选择的风险阈值。\n*   **输入流主题** – 新交易的输入流。\n*   **偏移量** – 风险评分的偏移量。\n*   **分区** –\
  \ 风险评分的分区。\n*   **分析字段** – 已分析的数据流字段。\n*   **交易计数** – 为检测欺诈而分析的交易数量。\n*   **异常计数**\
  \ – 发现的异常数量。\n*   **标志** – 用于发现异常的标志。\n*   **Kafka 键** – 风险评分的 Kafka 键。\n*   **异常数据**\
  \ – 每个流的异常数据；这些是针对每个字段 *F* 的单个交易 ***i***。\n*   **对等数据** – 每个字段 *F* 的对等组。\n\n带注释的图表将显示触发异常的交易信息，以及交易的日期和时间、行号以及发现异常的交易字段。这将有助于您判断该交易是否值得进一步调查。\n\
  \n此外，您可以将表格下载为 CSV 文件以进行进一步分析。您还可以将提供表格和可视化数据的完整 JSON 对象下载到 CSV 文件中。此可视化也有助于测试目的以及微调异常模型标志中的参数。同时，它还能提高对存储欺诈结果到\
  \ Kafka 的数据流的可见性。用户可以停止或开始流式传输；这不会对可视化造成任何中断。VIPERviz 始终从 Kafka 的任何偏移量检索数据，以确保您始终拥有完整的结果集。下一节将讨论预测可视化。\n\
  \n## 流式预测可视化\n\n在开发监督学习解决方案时，可视化流式预测是 TML 的另一个关键部分。\n\n类似的预测结果将如图 7-2 所示。图表将在 Y\
  \ 轴上绘制预测值，在 X 轴上绘制日期/时间。流式结果可以停止和开始。预测结果会实时绘制成图表和表格，并推送到您的浏览器。可视化主要用于帮助您做出决策，如前文在沃尔玛和银行欺诈用例中所述。它们还将帮助您观察数据流及其行为方式，这在测试期间可能有助于优化您的\
  \ TML 模型。自动生成的注释文本提供了额外的信息来支持您的决策。您还可以将表格中的结果下载到 CSV 文件。推送到浏览器的数据是 JSON 格式；JSON\
  \ 数据也可以下载。\n\n![../images/510404_1_En_7_Chapter/510404_1_En_7_Fig2_HTML.jpg](img/510404_1_En_7_Fig2_HTML.jpg)\n\
  \n图 7-2\n\n流式预测结果\n\n图 7-2 将显示以下字段：\n\n*   **日期/时间** – 预测生成的时间。\n*   **Unix 时间**\
  \ – 预测的 Unix 时间。\n*   **预测值** – 预测值。\n*   **输入数据** – 用于生成预测的输入数据（自变量的值）。\n*   **Kafka\
  \ 键** – 预测的 Kafka 键。\n*   **偏移量** – 预测的偏移量。\n*   **分区** – 预测的分区。\n*   **消费来源** –\
  \ 用于生成预测的训练算法所在的主题。\n*   **算法键** – 由 HPDE 生成的算法的唯一键。\n*   **算法** – 算法的名称。\n*   **使用部署**\
  \ – 如果为 1，则使用 `/deploy` 文件夹中的算法；否则，使用 `/models` 文件夹中的算法。\n\n下一节将讨论流式优化可视化。\n\n##\
  \ 流式优化可视化\n\nVIPERviz 也可以绘制优化结果图表，如图 7-3 所示。优化可视化将清晰地显示被优化的变量及其优化值；它还将显示优化了因变量的自变量的值。优化\
  \ JSON 数据可以下载。表格中的流式数据也可以下载。图 7-3 显示了沃尔玛用例的结果。这些仪表盘显示了自变量的最优值：一天中的小时、月份和门店编号，这些值导致了最大的人流量。\n\
  \n![../images/510404_1_En_7_Chapter/510404_1_En_7_Fig3_HTML.jpg](img/510404_1_En_7_Fig3_HTML.jpg)\n\
  \n图 7-3\n\n流式优化结果\n\n图 7-3 显示了以下内容：\n\n*   **平均目标函数值** – 这是来自其他优化模型运行的所有目标函数的平均值。\n\
  *   **优化变量** – 这些是被优化的变量的名称。\n*   **仪表盘**显示自变量的最优值。\n*   **日期/时间** – 这是优化执行的日期/时间。\n\
  *   **Unix 时间** – 这是优化执行的 Unix 时间。\n*   **目标函数值** – 优化后的目标函数的值。\n*   **变量** – 被优化的变量的名称。\n\
  *   **最优值** – 自变量的最优值。\n*   **约束最小值/最大值** – 用于约束的最小值和最大值。\n*   **Kafka 键** – 优化的\
  \ Kafka 键。\n*   **偏移量** – 优化的偏移量。\n*   **分区** – 优化的分区。\n*   **消费来源** – 存储来自训练的训练参数的主题。\n\
  *   **使用部署** – 如果为 1，则使用 `/deploy` 文件夹中的算法；否则，使用 `/models` 文件夹中的算法。\n\n下一节将讨论 AiMS\
  \ 仪表盘。\n\n\n\n## AiMS 仪表盘\n\nAiMS 是一个用于管理由 VIPER 和 HPDE 生成的算法的仪表盘。AiMS 由 VIPERviz\
  \ 提供服务。\n\n连接后，用户可以控制由 TML 解决方案为消费者、生产者和组创建的每个主题或组的生产和消费。AiMS 仪表盘如图 7-4 所示。AiMS\
  \ 已在第 2 章中详细讨论过。需要注意的是，AiMS 与 VIPER 协同工作。如果你运行了多个 VIPER 实例，只需使用相应的 `Vipervizhost`\
  \ 和 `port`，即可为每个 VIPER 实例使用 AiMS 来控制 TML 解决方案。这使得开发人员能够构建大型 TML 解决方案，同时让管理员能够轻松地从\
  \ AiMS 仪表盘控制每个解决方案，无论其规模大小。这种模块化特性还使得可以将 AiMS 与 VIPER 和 HPDE 一起构建到微服务架构中，并通过算法和模型管理将\
  \ Kafka 和 AutoML 处理解耦。通过此仪表盘，TML 解决方案管理员可以设置警报和通知，以确定主题是否正在被使用。如果未被使用，则可以将其停用。立即停用\
  \ TML 解决方案的能力可以对 TML 解决方案的成本产生直接的积极影响，这对于大型基于云的解决方案尤其重要。\n\n![../images/510404_1_En_7_Chapter/510404_1_En_7_Fig4_HTML.jpg](img/510404_1_En_7_Fig4_HTML.jpg)\n\
  \n图 7-4\n\nAiMS 仪表盘\n\n下一节将讨论如何在同一个图表中可视化多个数据流。\n\n## 通用主题的可视化\n\n在某些情况下，您希望将原始数据流一起可视化。例如，在沃尔玛的示例中，您可能希望将自变量数据流一起可视化。或者，您可能希望将预测结果和优化结果一起可视化；这可以通过通用图表实现，如图\
  \ 7-5 所示。\n\n![../images/510404_1_En_7_Chapter/510404_1_En_7_Fig5_HTML.jpg](img/510404_1_En_7_Fig5_HTML.jpg)\n\
  \n图 7-5\n\n通用主题图表\n\n此图表与预测图表类似，不同之处在于可以同时可视化多个数据流。结果也会被注释，以显示各个数据流的值。您还可以组合文本和数值数据流。\n\
  \n下一节将讨论 WebSockets。\n\n## 使用 WebSockets 进行可视化\n\n对于数据流而言，使用 WebSockets 有几个关键优势：\n\
  \n1.  传统浏览器需要向 Web 服务器发出请求才能接收响应：\n    1.  VIPERviz 不需要 Web 服务器，因为它内置了一个。\n\n  \
  \  2.  VIPERviz 不等待浏览器的请求；它可以*推送*结果到 Web 浏览器，这确保用户始终拥有最新结果。\n\n    3.  VIPERviz\
  \ 附带标准的 HTML 文件，您可以根据自己的需求进行自定义。VIPERviz 将持续向您推送数据。\n\n2.  VIPERviz 速度很快。当 HPDE\
  \ 生成结果并写入 Kafka 时，VIPERviz 可以立即检索新结果并将其流式传输到您的浏览器。\n\n3.  VIPERviz 可以实例化无限数量，并且可以同时处理来自\
  \ Web 浏览器的多个连接。这使得 TML 解决方案能够在不影响性能的情况下进行扩展。\n\n4.  VIPERviz 在前端使用简单的 HTML，允许用户为其受众自定义\
  \ HTML。具体来说，VIPERviz 有一个内置的 Web 服务器，可以为传统 Web 浏览器提供 HTML/JavaScript 服务。\n\n5.  VIPERviz\
  \ 是安全的。它可以使用带有 TLS 加密的 HTTPS 连接进行连接。\n\n通过安全、可扩展且可移植的 WebSockets 进行流式可视化，并与 VIPER/HPDE\
  \ 和 Kafka 集成，使 TML 解决方案达到企业级就绪状态。TML 解决方案的无摩擦和弹性特性带来的额外好处，使组织能够通过使用低延迟的流式可视化，在允许大规模消费结果的同时，最大化数据流的价值。下一节将总结本章。\n\
  \n## 总结\n\nTML 解决方案通过 VIPERviz 与流式可视化紧密集成。这使您能够构建可扩展的端到端 TML 解决方案，全面了解 TML 解决方案正在做什么，并轻松使用其输出进行决策。每个可视化都设计为使用由\
  \ VIPERviz 推送到您浏览器的 JSON 数据，VIPERviz 会持续监控 Kafka 主题以获取更新。更新会立即推送给您，因此无需请求。这使得 TML\
  \ 可视化对于数据流解决方案特别有效。\n\n您可以使用以下参数控制从 Kafka 检索的数据：\n\n*   topic\n*   consumerid\n\
  *   offset\n*   rollbackoffset\n*   append\n*   secure\n*   groupid\n\n您可以在 topic\
  \ 关键字中选择 TML 解决方案的输出主题。您可以通过 MAADSTML 或 AiMS 订阅任何主题来检索该主题的消费者 ID。设置 offset=-1 和\
  \ rollbackoffset 的值，将为您提供该主题的最新数据量。例如，如果 offset=-1 且 rollbackoffset=20，则会将最后 20\
  \ 个数据点发送到您的浏览器。此外，由于数据流可能累积得非常快，您可以使用 append 字段来控制附加到浏览器的数据量。例如，append=0 将不会向浏览器附加数据，即使\
  \ Kafka 中的数据变得非常大，您也始终拥有最新数据。但是，如果您确实想累积数据，只需设置 append=1。安全性也可以通过 secure 关键字来控制。设置\
  \ secure=1 将导致 VIPERviz 通过 HTTPS 连接发送数据；secure=0 将导致 VIPERviz 切换到 HTTP 连接。请注意，如果您在端口\
  \ 8002 上启动 VIPERviz，则 HTTPS 端口会自动设置为下一个端口：8003。\n\n您还可以通过在 groupid 字段中输入组 ID 来可视化来自\
  \ Kafka 消费者组的数据。Kafka 消费者组是一种非常方便的方式，可以以并行方式扩展您的可视化，同时保持每个消费者的数据吞吐量达到最佳性能。您可以使用\
  \ MAADSTML 或 AiMS 以编程方式创建消费者组。\n\nAiMS 仪表盘将为您提供已创建的主题和组的完整视图，并控制它们的执行。具体来说，您可以轻松地激活或停用消费者主题、生产者主题和组主题。您还可以设置通知和警报，以跟踪哪些主题正在被使用，哪些没有被使用。\n\
  \n最后，您需要五个可自定义的 HTML 文件用于可视化：\n\n1.  要可视化预测，请使用 prediction.html。\n2.  要可视化异常，请使用\
  \ anomaly.html。\n3.  要可视化优化，请使用 optimization.html。\n4.  要可视化通用主题，请使用 generictopics.html。\n\
  5.  要可视化 aims，请使用 aims.html。\n\n所有可视化数据都可以 CSV 和 JSON 格式下载。下一章将讨论 TML 的未来。\n\n脚注\
  \ 1   2   3\n\n\n\n"
- "# 8. 事务性机器学习在几乎所有行业中的演进与机遇\n\n我们已经讨论了使 TML 在将 AutoML 应用于数据流以获取更深入业务洞察和影响力方面发挥效用的几个领域。TML\
  \ 机遇背后的信念是：快速数据将需要快速机器学习来实现快速决策。鉴于快速数据将持续存在且其普及性只会增长，这为组织提供了利用它并为其业务增加更多价值的机会。你必须理解事务性机器学习的用例、演进及其与传统机器学习的区别。那些比同行更早评估并构建事务性机器学习能力的组织将获得优势。为此，你必须将机器学习流程自动化，同时使用实时且事件驱动的数据流。机器学习流程的自动化减少了人工接触点，从而实现了无摩擦的机器学习流程；结合数据流，你可以创建具有弹性且能快速伸缩的解决方案。\n\
  \n有几个领域将持续接纳并演进 TML，并与快速数据和快速决策保持一致。这些领域包括：\n\n1.  机器做出更快、更复杂的决策\n2.  使用数据流更广泛地采用\
  \ AutoML 技术及流程\n3.  堆叠或链接 TML 解决方案以应对更复杂的用例，特别是供应链优化\n\n下一节将进一步探讨这些领域。\n\n## 进一步探索的领域\n\
  \n本节将更详细地讨论这三个领域——具体来说，为什么这些领域值得关注，一些关键的研究问题是什么，存在哪些挑战，以及为组织创造的 TML 机遇。\n\n### 机器做出更快、更复杂的决策\n\
  \n良好的决策对于降低业务风险至关重要。在机器学习出现之前，业务决策容易受到主观性和速度慢的影响：由人类客观地分析数百或数千笔交易以发现欺诈是不可能的。通过从数据中进行机器学习，人类可以用数据驱动的洞察来补充其决策，从而降低主观性程度并提高决策速度。数据驱动的决策具有以下几个优势：\n\
  \n1.  它减少了决策过程中的人类偏见。\n2.  它使决策具有可辩护性。\n3.  它使决策过程可重复。\n4.  它增加了决策过程的透明度。\n5.  它使决策过程可审计。\n\
  \n上述列表假设人类处于决策循环中。对于更快的决策而言，人类是一个瓶颈，在决策速度至关重要的场景中，应使用机器学习解决方案来做出部分或全部决策：这被称为闭环决策。组织需要仔细考虑他们想要创建和使用的\
  \ TML 解决方案类型，并避免闭环可能带来的一些挑战。具体来说，在闭环决策中：\n\n1.  如何确保机器始终做出最佳决策？\n    1.  机器如何定义“最佳决策”？\n\
  \    2.  机器如何定义“糟糕的决策”？\n2.  机器是否应该做出生死攸关的决策？\n    1.  例如，在自动驾驶汽车中，机器在可能导致高速车祸的决策上应拥有多大自由度？\n\
  \    2.  机器决策的控制或护栏是什么？\n3.  我们如何确定复杂决策与非复杂决策？\n    1.  具体来说，是否存在对机器而言过于复杂的决策？如果是，我们如何确定？\n\
  \    2.  当决策变得过于复杂时，我们如何在人类和机器之间切换？什么决定了切换点？\n    3.  伦理和道德在机器决策中扮演什么角色？\n    4.\
  \  我们如何确保数据隐私？\n\n对于高速机器决策，上述领域还必须考虑训练机器的速度，以便它能从快速数据中学习。这引发了一些值得关注的领域：\n\n1.  我们如何利用*无监督*学习与数据流，快速识别异常，进而由监督学习算法进一步处理？\n\
  \    1.  虽然存在针对数据流的无监督学习方法，但在利用快速数据与快速机器学习实现更快欺诈检测这一领域，研究仍然非常少。\n2.  我们如何确保进入决策过程的数据质量良好？\n\
  \    1.  在快速数据中，我们如何定义良好的数据质量？\n    2.  我们如何清洗快速数据？\n3.  在快速数据环境中，如何使用统计指标来确保机器学习模型为监督学习捕获*正确*的变量（数据流）：因变量和自变量？\n\
  \n数据创建速度的不断提升将催生对机器学习速度提升的需求。虽然更快的机器学习以实现更快的决策为企业带来了诸多优势，但上述问题提出了需要深入研究的领域。\n\n\n\
  \n### AutoML 技术与流程在数据流中的更广泛应用\n\n本书重点介绍了多种技术与流程，以展示如何将数据流与 AutoML 相结合。书中展示了如何构建\
  \ TML 解决方案，以整合并自动化以下环节：\n\n*   数据摄取\n*   数据处理\n*   模型构建\n*   模型评估\n*   模型部署\n* \
  \  通过流式可视化进行决策\n\n上述领域面临的关键挑战之一是数据质量。正如第 1 章所述，决定数据质量的因素有很多，这些因素会影响学习成果的质量。随着几乎所有行业对更快机器学习的需求日益增长，实时数据质量流程的重要性也将不断提升。\n\
  \n流处理技术已在研究界得到广泛讨论，主要集中在流挖掘和查询方面；近年来，流处理在商业领域也日益普及。以亚马逊推出的热门技术 Kinesis^(¹⁰³) 为例，它使用\
  \ Apache Flink^(¹⁰⁴) 执行流分析，但采用的是 SQL 类型的查询来对数据流进行分析。这种方法与流挖掘并无二致，并非像 TML 那样使用高级算法进行机器学习。构建流分析解决方案的技术一直较为零散，缺乏一个清晰的技术栈来快速、轻松地构建解决方案。例如，要使用\
  \ Amazon Kinesis 构建流式解决方案，您可能需要以下部分或全部组件：^(¹⁰⁵)\n\n1.  AWS 基础设施\n2.  Kinesis\n3.\
  \  Apache Flink\n4.  用于构建应用程序的 Java/Scala\n5.  用于分析数据的 Apache Beam\n6.  用于图处理的 Apache\
  \ Gelly^(¹⁰⁶)\n7.  SQL\n8.  其他连接器\n9.  第三方可视化工具\n10. 这些技术的专业技能\n\nTML 旨在让更广泛的群体能够使用高级流处理技术，并正在推动高级流处理的民主化。随着社会不断从社交媒体以及我们家庭、办公室和城市中的自主/智能设备中需求并生成更多数据，更广泛的应用领域正在被识别出来。以下领域展现出\
  \ TML 应用的巨大潜力：\n\n1.  **农业** – 农业机械会产生大量关于维护、田间施肥、局部天气等的快速数据。\n2.  **医疗保健** – 医疗设备和植入物连接到分析数据的应用程序，例如用于预防以下疾病的深部脑刺激设备：\n\
  \    1.  肌张力障碍\n    2.  癫痫\n    3.  特发性震颤\n    4.  强迫症\n    5.  帕金森病\n3.  **金融与银行业**\
  \ – 银行消费者产生大量交易数据，这催生了金融科技和数字货币，可以通过优化来创建更具细分度的产品和服务。\n4.  **零售业** – 零售业为快速数据提供了众多应用场景，例如分析信用卡交易以防范欺诈、优化供应链、实时预测产品价格、改进线上和实体店的产品推荐以及优化产品库存。\n\
  5.  **能源业** – 涡轮机、风电场、太阳能电池板及其他现场设备等重型设备会产生快速数据，可用于预测和改善资产性能、故障以及优化石油和天然气钻井等运营操作。\n\
  6.  **制造业** – 设备和制造过程都会产生快速数据，可用于优化产品质量、改进流程和优化供应链。\n\n物联网是 TML 众多应用的自然领域。但这一领域需要仔细考虑以下几点：\n\
  \n*   需要做出的决策类型\n*   这些决策的速度\n*   这些决策的做出地点：是否在边缘端\n\n随着 5G 电信网络的日益兴起，将有可能以更快的速度创造更多数据。利用这些数据并应用\
  \ TML 前景广阔，但关键在于如何应用以及应用于何处？几乎所有行业都有许多用例可以利用 TML。具体来说：\n\n*   **金融与银行业**\n    *\
  \   **挑战** – 通过消除障碍、提高安全性和保护消费者资金来改进产品和服务。\n    *   **TML 机遇**\n        *   使用 TML\
  \ 异常检测来降低因欺诈造成的财务损失。\n        *   通过构建针对客户群不同细分群体（如男性 vs. 女性、年轻人 vs. 老年人、偏远地区 vs.\
  \ 城市地区等）进行预测的个性化 TML 解决方案，来细分产品和服务。\n    *   **重要考量**\n        *   数据隐私与网络安全\n \
  \       *   政府强制政策与法规\n        *   交易的规模与速度\n        *   设备的多样性\n        *   不断变化的消费者行为\n\
  \n*   **医疗保健**\n    *   **挑战** – 提供定制化的健康和患者护理，以减轻医院和医疗专业人员的负担，并改善每个人的健康和福祉。\n \
  \   *   **TML 机遇**\n        *   通过利用符合人口统计学特征的其他患者数据来预测药物和治疗方案，从而改善患者护理。例如，对于一名\
  \ 50 岁、患有关节疼痛的男性，可以通过移动应用程序预测最佳药物和治疗方案，从而减少医生的诊疗时间。\n        *   根据每个人的环境、症状和习惯来预测和优化植入物的设置。例如，对于深部脑植入物，设备植入患者胸部；该设备连接到手机应用程序，数据可以被捕获并发送到\
  \ TML 解决方案进行预测和优化，然后发送回手机以实时自动调整设备设置。\n        *   构建 TML 解决方案来预测老年人何时可能跌倒。跌倒是导致老年人死亡和受伤的首要原因^(¹⁰⁷)，现在已有配备传感器的设备可以生成数据，供\
  \ TML 解决方案用于预测并帮助提醒老年人潜在的跌倒风险。\n    *   **重要考量**\n        *   数据隐私与网络安全\n      \
  \  *   不同的患者需求和遗传因素\n        *   患者数量的规模\n        *   患者（以及医生/护士）接受和信任数字信息的风险水平\n\
  \        *   机器生成信息的准确性\n        *   数据的多样性、格式和设备\n\n*   **能源业**\n    *   **挑战**\
  \ – 提高能源产量并延长可再生和不可再生能源的资产寿命。\n    *   **TML 机遇**\n        *   通过预测资产在保修期内的维护周期来延长资产寿命。\n\
  \        *   在设备发生故障前预测其故障。\n        *   通过利用每分钟的天气预报构建 TML 解决方案，实时预测负荷并改进定价方案，从而预测和优化太阳能和风能发电。\n\
  \        *   利用井内的传感器数据预测和优化钻机上的控制设置，从而优化石油和天然气钻井。\n    *   **重要考量**\n        *\
  \   数据隐私与网络安全\n        *   数据和设备的多样性\n        *   数据质量问题\n        *   设备间数据速度和通信协议的差异\n\
  \        *   设备数量的规模\n        *   位于偏远地区，网络连接不稳定或没有互联网连接\n\n*   **零售业**\n    * \
  \  **挑战** – 以具有竞争力的价格在线下和线上提供更好、更多样化的产品和服务，同时降低供应成本。\n    *   **TML 机遇**\n     \
  \   *   为消费者提供更好、更快的产品推荐。\n        *   通过使用 TML 实时定位特定细分市场和地区的客户来改进营销活动。\n     \
  \   *   通过实时预测每种产品的需求来改进产品库存。\n        *   预测每种产品的价格，并同时提高数千种产品的利润率。\n\n\n\n*  \
  \ 在购买点减少信用卡欺诈\n\n*   重要考量\n            *   数据隐私与网络安全威胁\n\n*   复杂流程\n\n*   信用卡交易规模\n\
  \n*   设备与数据多样性\n\n*   线上及线下零售客户规模\n\n*   产品与服务数量规模\n\n*   向设备及 POS 系统传递信息的速度\n\n\
  *   消费者行为的季节性\n\n*   农业\n        *   挑战 – 在降低投入成本、提高设备可靠性的同时，提升作物产量与生产效益\n\n*  \
  \ TML 机遇\n            *   通过使用 TML，结合超本地化实时天气预报优化每种作物的施肥周期，从而提高作物产量\n\n*   利用 TML\
  \ 预测设备故障时间，并在设备保修期内进行维护，以降低维护成本并提升设备性能\n\n*   实现流程自动化与优化，构建更多无需人工干预即可自动调整设备设置的闭环解决方案\n\
  \n*   重要考量\n            *   数据与设备可变性\n\n*   网络连接不稳定或无互联网连接的偏远地区\n\n*   适用于闭环及系统之系统的复杂决策用例与机遇\n\
  \n*   制造业\n        *   挑战 – 改进制造流程、优化供应链、降低投入成本，同时提升产品质量\n\n*   TML 机遇\n       \
  \     *   连接不同的供应链流程，并串联 TML 解决方案，将前瞻性智能信息传递给下游流程\n\n*   通过实时预测产品缺陷来提升产品质量\n\n*\
  \   通过预测资产寿命终止来改善资产性能，并提高运营正常运行时间\n\n*   重要考量\n            *   数据隐私与网络安全威胁\n\n*\
  \   采用不同通信协议的设备互联互通\n\n*   数据与设备多样性\n\n*   适用于闭环及系统之系统的复杂决策用例与机遇\n\n*   大规模质量控制\n\
  \n*   投入品数量规模\n\n*   庞大而复杂的全球供应网络\n\n让我们进一步探讨上述某些领域。智能设备，乃至智慧城市和智慧国家的愿景，正逐渐成为现实。物联网的挑战不在于数据，而在于设备的多样性，这更凸显了与设备无关的\
  \ TML 解决方案的必要性。不同类型的设备拥有不同的通信协议，这将使数据提取充满挑战，进一步增加了实现这些设备操作自动化的复杂性。医疗保健领域为 TML 应用提供了众多空间。由流行病、疾病以及缺乏运动、不良饮食和压力等人类行为驱动的全球医疗成本不断上升，加之政府和私营企业对医院和诊所的持续组织与支持，使得医疗保健成为\
  \ TML 一个引人关注的领域。从我们身体收集数据的可穿戴设备日益增多，为机器学习提供了大量机会。这些技术使人类能够在没有医生干预的情况下，自行做出关于自身健康和福祉的决策，例如：\n\
  \n1.  来自可穿戴设备和植入物的数据流 – 医院正在利用机器进行远程手术和远程医疗咨询，从而降低差旅成本和医院资源的使用。利用数据寻找疫苗和医疗方法的研究正在迅速发展。\n\
  \n2.  来自医疗保健环境中物联网设备的数据流 – 医疗保健领域的另一个有趣方向是神经刺激，例如用于帮助缓解帕金森病症状的深部脑刺激。具体来说，传感器被植入人脑和胸部，生成可传输的数据。这些流式传输的大脑活动数据可以通过\
  \ TML 进行分析，以预测震颤的发作，并帮助预防特定帕金森病患者的震颤。目前，利用先进机器学习分析大脑活动的研究尚显不足 [Lozano et al., 2019]。利用每位患者的数据，为其构建个性化的\
  \ TML 解决方案是一项重要的应用，可以使数百万人受益；通过为他们提供如何调整所使用设备的见解（这些见解考虑到了他们的个体特征、症状和环境），可以改善他们的生活质量。\n\
  \n然而，您需要了解一些关键风险：\n\n1.  维护患者数据的隐私\n\n2.  提高医生、护士、患者及护理人员使用数据驱动技术的技能\n\n3.  信任机器做出健康决策\n\
  \n随着医疗保健领域的 IT 专业人员开发机器学习技术，一些值得探索的领域包括：\n\n1.  医疗保健的哪些领域可以从 TML 解决方案中受益？\n\n2.\
  \  医生、护士、患者及护理人员如何最好地利用 TML 解决方案的成果？\n\n3.  哪些健康决策适合由 TML 解决方案做出？\n\n4.  加快健康决策的优缺点是什么？\n\
  \n5.  加快健康决策的风险是什么？\n\n金融和银行业也有许多 TML 的潜在应用。随着人工智能迅速自动化许多人类任务，如金融交易、财务咨询、投资组合优化等，TML\
  \ 应用的机会将会增加。存在挑战的一些领域包括：\n\n1.  减少银行业中的欺诈和盗窃\n\n2.  提高财务报告的透明度\n\n3.  制定更好的法规，平衡基于\
  \ AI 的技术的需求，同时保护消费者\n\n4.  更好地追踪和监控金融市场中的高风险人类行为\n\n5.  对金融交易和记录进行更快速的审计能力\n\n随着在线和自动化银行活动的增多，利用机器学习进行欺诈检测、反洗钱和其他高风险行为监控的交易银行业务将继续获得发展动力。利用更多\
  \ AI 技术的金融科技公司正在蓬勃发展，通过移除迫使消费者必须通过银行办理业务的中介层，使银行业务更加便捷。现在，我们只需使用手机即可完成许多银行任务。这引发了一些行业内常见的问题：\n\
  \n*   银行消费者面临的风险和陷阱是什么？\n\n*   有哪些保护措施可以限制缺乏经验的银行消费者执行更高级的银行任务？\n\n在最近的一个案例中，^(¹⁰⁸)\
  \ 一名 20 岁、缺乏经验的金融科技用户在进行高级金融交易时，因一次糟糕的交易发现自己欠下了近 80 万美元；这种潜在损失的压力导致他自杀身亡。如果技术中存在限制和更强的控制措施，能在用户进行交易前发出警报，或许可以防止这场致命悲剧的发生。TML\
  \ 技术可以在用户实际做出错误金融交易决策之前，对其进行监控、跟踪和预测。\n\n\n\n另一个例子是，一个在线交易社区大幅推高了游戏驿站^(¹⁰⁹)（股票代码：GME）的股价，导致做空者（主要是机构投资者）陷入轧空，迫使他们买入股票，同时承受数十亿美元的损失。一个\
  \ TML 解决方案本可以通过观察游戏驿站的价格同行群体，并将其与新价格进行比较，从而提醒其他交易者注意该股票可能存在的异常交易活动。这种比较会立即显示，一只此前交易价格低于\
  \ 10 美元的股票，在大多数情况下，不可能在几小时内涨到 300 或 400 美元。利用根据个人用户（或股票）数据定制的机器学习模型，实现决策的速度和规模，在这些情况下可能大有裨益。\n\
  \n能源行业，包括石油和天然气、电力、天然气以及风能、水力和太阳能等可再生能源，是 TML 应用令人兴奋的领域。由燃烧化石燃料引起的气候变化和全球变暖问题日益受到重视，并促使各国政府对汽车、建筑、数据中心和农业的温室气体排放提出严格限制。这正推动着向更环保的技术和燃料来源转变。这种转变的一个例子是，汽车制造商正在提高电动汽车的产量，以满足消费者不断变化的需求和政府对气候变化的法规。\n\
  \nTML 在能源领域的应用多种多样。感兴趣的领域包括：\n\n1.  石油生产与优化\n2.  燃料产品的零售定价：风能、太阳能、精炼汽油、柴油\n3.  钻井优化：减少总钻井天数、提高钻速等\n\
  \nTML 的探索领域可以解决以下问题：\n\n1.  TML 解决方案如何将人类决策整合到更快的成果中？例如，在钻井过程中，人类控制着钻井过程；机器如何在钻井过程中，在任何深度，向人类提供“实时”建议？\n\
  2.  考虑整个资产组合中天气变化性的可再生能源动态定价策略，是一个可能受益于 TML 解决方案的领域。\n3.  资产监控与故障预测——随着更多传感器连接到现场资产，产生的数据可用于预测故障并减少停机时间。将来自不同传感器的数据流组合成一个训练数据集，可用于就资产性能做出复杂决策。\n\
  \n制造业为 TML 应用提供了许多感兴趣的领域，尤其是在新冠疫情给供应链带来压力（限制），使得供应链之间的同步变得非常困难的情况下。可以提供帮助的领域包括：\n\
  \n1.  优化互联物流\n2.  自动化制造流程和供应链\n3.  库存管理/发票管理\n4.  优化制造产品的投入选择\n5.  减少产品制造过程中的健康与安全事故\n\
  6.  预测缺陷产品\n\n制造过程可能非常复杂且技术性强。例如，制造业中的有监督和无监督流程挖掘可以识别复杂流程中推高成本的低效模式。流程挖掘可以利用异常检测和监督学习技术来：\n\
  \n1.  降低制造过程的复杂性\n2.  识别制造过程中的瓶颈，以帮助简化流程\n3.  减少健康与安全事故\n4.  部署到多样化的制造环境中，其成果能被人类快速、轻松地理解和使用\n\
  5.  整合来自制造过程多个（可能数百万个）领域的信息，以提高最终产品供应链的速度并降低成本。\n\n还有其他探索领域；希望本节内容能激发兴趣，从而引向其他未提及的领域。所提到的\
  \ TML 应用领域都有一个共同主题：规模、速度和机器智能，这可以促成人类和机器做出更好的决策。这些挑战凸显了需要更清晰的规划，并识别那些随着时间推移与企业和社会的优先事项相一致的价值领域。下一节将继续这一主题，讨论如何集成\
  \ TML 解决方案，以实现更深层次、更强大、更大规模的智能。\n\n### 堆叠与链接不同的 TML 解决方案\n\nTML 解决方案本身可以被设计为整合多个数据流和多种算法。这为将\
  \ TML 解决方案作为“系统的系统”（SoS）开辟了其他几个领域：将单个 TML 解决方案组合起来形成一个更大的系统。\n\n这种将数据流与 AutoML 集成的“系统的系统”在研究文献和组织中受到的关注较少，但它提供了构建结合每个\
  \ TML 解决方案的复杂自主系统的机会。能够从一个 TML 解决方案的输出中创建新的数据流，并将其用作另一个 TML 解决方案的输入，这在解决方案之间建立了隐式和显式的连接，可用于构建“系统的系统”。利用数据流可以构建相当复杂的\
  \ TML 解决方案。让我们以石油和天然气生产优化中的一个具体例子，通过提出以下问题来展示它如何使用 TML SoS 解决方案：\n\n1.  输入和输出将如何在\
  \ TML 解决方案之间使用？\n    1.  将为每口油井构建输入 TML 解决方案，用于监控压力、天然气和水的产量（以及其他输入）。\n    2.  输出\
  \ TML 解决方案将使用这些输入来调整压力、天然气和水压的控制，并确定最佳输入组合，以更快地提取更多石油。\n\n2.  每个解决方案需要什么类型的算法？\n\
  \    1.  由于每个输入 TML 解决方案都在监控压力、天然气和水，它将使用针对其所用数据而单独生成的 AutoML 算法。这是 TML 解决方案的一个重要方面：能够快速、大规模地创建定制化且高度特定于数据的算法。\n\
  \n3.  信息应该在 TML 解决方案之间何时交换？它们需要同步吗？\n    1.  输入 TML 解决方案按特定时间间隔将压力、天然气和水的最优值发送给输出\
  \ TML 解决方案，以便它能在亚秒级时间内快速调整整个油田的控制设置。\n\n4.  一个“系统的系统”需要多少个组件（TML 解决方案）？\n    1.\
  \  这取决于油田的规模和油井的数量；以及诸如泵、钻头、钻杆等设备的数量，以及其他产生快速数据并直接或间接参与石油生产的机械。\n\n5.  是否存在一个控制、编排机制来控制每个\
  \ TML 解决方案，从而控制整个系统？这将类似于主从模型。\n    1.  输出 TML 解决方案将根据预先配置的业务规则做出决策，以自动调整控制设置（闭环），或将信息作为决策支持呈现给人类（开环）。\n\
  \n虽然使用 TML 解决方案开发“系统的系统”可能看起来很复杂，但构建一个能够回答上述问题的“系统的系统”架构，将确保整个系统满足您的设计目标，并能在现实世界中发挥作用。这可能是提高大型复杂运营效率的有力方法。下一节将总结本章内容。\n\
  \n\n\n## 结语\n\n本章提供了几个可供进一步探索的领域，并讨论了 TML 解决方案的演进过程。本章还探讨了一些研究问题，这些问题可能为能源、医疗保健、制造业、零售业、金融与银行业以及物联网等多个行业提供有趣的探索方向。这些领域呈现了许多用例和挑战，需要更多研究，但也为\
  \ TML 解决方案提供了大量机遇。TML 的 LinkedIn 页面^(¹¹⁰)和 GitHub 页面^(¹¹¹)是了解 TML 最新动态的好去处。\n\n\
  数据隐私、数据质量、人类或机器更快决策、风险、供应链优化以及资产性能与监控等问题，在当今数字世界中具有切实的影响和价值。数据创建的速度，加上机器学习的速度，是我们当前机器学习方式的自然演进。\n\
  \n随着人类和机器以更快的速度产生更多数据，为了改善生活质量、创造收入并提高客户满意度，跟上节奏并提供更快的洞察以支持更优决策将变得至关重要。确定如何消费和交付更快、更高质量的信息，也将是一个关键的兴趣点和增长领域。这一点在支撑社交媒体、电影和音乐的流媒体技术中已显而易见——具体而言，就是利用机器学习向用户精准投放广告，即时推荐电影、音乐或产品，从而让消费者看得更多、买得更多、听得更多。这一切仅仅是个开始，随着\
  \ 5G 等电信网络日益普及，不同设备同时以更快的速度传输更多数据将变得更加容易。\n\n以可扩展的基础设施、更低的成本构建强大解决方案的障碍正在降低，并且这些能力如今已经存在。TML\
  \ 是一种利用数据速度和机器智能，结合云基础设施的力量，以更低成本更快推动创新的方式。\n\n自主技术将变得更加智能，需要技术之间更多的互联，从而为连接 TML\
  \ 解决方案的 SoS（系统之系统）开辟了领域。采用 TML 解决方案的系统之系统方法，可以提供一种无缝的方式来组合输入和输出，在 TML 系统之间推送和拉取洞察，并由一个主控制器编排\
  \ TML 解决方案以产生复杂的结果。这类系统使用传统的机器学习流程来实现会更困难，且成本可能更高。\n\nTML 将继续发展，并非因为它“应该”发展，而是因为人类对更快、更智能信息的需求驱动了数据创建速度的持续增长；这将促使组织交付\
  \ TML 类型的解决方案。成本、技术和基础设施的障碍正在降低，通过普及先进的智能技术，创新领域的竞争环境变得更加公平。\n\nTML 的未来看起来一片光明，它正沿着更快、更便宜、更智能、更具可扩展性的解决方案创新轨迹前进。虽然\
  \ TML 可以为组织带来巨大价值，但它们必须始终与企业的优先事项和业务需求保持一致。\n\n脚注 1   2   3   4   5   6   7   8\
  \   9\n\n"
- "# 9. TML 项目规划方法与总结思考\n\n本书介绍了 TML 的各个方面，TML 将 AutoML 应用于与 Apache Kafka 集成的数据流，使开发者能够构建在云中具有可扩展性、无摩擦性和弹性的\
  \ TML 解决方案。无摩擦性和弹性的重要性是 TML 解决方案的独特特征，也是其与传统机器学习（CML）的区别因素。我们还正式定义了 TML，以及 TML 解决方案的五个特征，例如数据流动性、数据流连接、数据流标准化为\
  \ JSON、数据流与 AutoML 的集成，以及使用低代码创建 TML 解决方案的能力。TML 基于这样一个信念：快速数据需要快速机器学习以实现快速决策。这并不意味着所有快速数据都需要\
  \ TML，因为如果不需要快速决策，那么 TML 就意义不大。\n\nCML 不适合数据流，原因如下：\n\n*   CML 流程主要操作于静态的、驻留在磁盘上的数据。\n\
  *   CML 流程在数据准备、模型构建、模型估计、超参数调优和报告方面需要大量人工介入，这增加了 CML 解决方案的摩擦。\n*   由于第 2 点，CML\
  \ 解决方案从新数据中重新学习的速度很慢。\n*   当业务需求或用户消费模式发生变化时，CML 解决方案不易快速扩展或缩减。\n*   在许多情况下，CML\
  \ 解决方案的模型管理、模型部署和解决方案支持都很困难。\n\nTML 与 CML 在以下方面有所不同：\n\n*   TML 将机器学习应用于持续流动的、实时的或事件驱动的数据流。\n\
  *   TML 通过动态组合或连接数据流来自动构建训练数据集；然后对这些训练数据集应用自动机器学习，以找到最适合训练数据集的算法——只需最少的人工干预，从而实现无摩擦的解决方案。\n\
  *   TML 可以立即部署解决方案供人类或机器消费。\n*   TML 可以持续、自动地构建训练数据集，以从更新的数据流中重新学习，并立即使洞察可供消费。\n\
  *   TML 解决方案可以通过以下方式轻松扩展或缩减：\n    1.  增加或减少消费 TML 解决方案洞察的消费者\n    2.  增加或减少数据流的生产者\n\
  \    3.  快速连接更多流以构建更大（或减少数据流以构建更小）的解决方案，使用更多（或更少）的机器学习算法\n    4.  使用 AiMS 仪表板或 TML\
  \ Python 函数自动激活或停用 TML 解决方案组件（生产者和消费者主题）\n\n虽然 TML 有优势，但我并非暗示它可以替代 CML。恰恰相反，对于没有快速数据、也不需要快速数据的组织来说，CML\
  \ 有其价值。在数据科学领域，CML 流程已经成熟且被广泛使用。有许多 CML 用例不需要 TML。TML 的优势在于数据是实时或事件驱动地快速、持续生成时。但是，即使数据流动很快，如果不需要更快的决策，也可能不足以证明使用\
  \ TML 的合理性。CML 和 TML 都有各自的应用领域和问题类别，旨在为组织创造价值，但它们必须在正确的业务背景下使用。\n\n\n\n数据是 CML 和\
  \ TML 之间的共同主线。两种方法都需要良好的数据质量。糟糕的数据会导致糟糕的机器学习洞察（解决方案）。我们讨论了与数据流相关的几个数据质量领域，例如速度、多样性、真实性和数据量。数据流是大数据现象的一部分，但并非所有大数据都是流式数据。数据流是实时流动的，但它们也是由事件创建的。事件引发数据创建，从而触发某些操作。例如，如果你在亚马逊上购买了一件商品，支付完成事件将触发产品发货操作。不难想象，这些场景在某些方面让我们的生活变得简单得多，而在其他方面则变得复杂。事件流和数据流或多或少是同义词。TML\
  \ 仍然需要干净的数据来提供可信且可操作的洞察。此外，其成功仍然依赖于有效的数据工程和架构实践，这些实践能够带来可扩展、安全且具有可用于有效决策的高质量洞察的\
  \ TML 解决方案。虽然机器会从好数据和坏数据中学习，但学习结果将反映所用数据的质量。下一节将讨论 TML 技术栈。\n\n## TML 技术栈\n\n除了设计和构建\
  \ TML 解决方案之外，构建功能性解决方案所需的技术取决于：\n\n*   **能够处理大量数据的数据流存储平台** – 在 GCP、AWS 或微软云基础设施中运行的云原生\
  \ Apache Kafka 是理想选择。\n*   **能够从源系统或设备摄取数据并将其写入 Kafka 的源连接器和汇连接器** – MAADS-VIPER\n\
  *   **使用深度学习算法分析流式数据以获取洞察** – MAADS-HPDE\n*   **实时可视化 TML 模型的结果** – MAADS-VIPERviz\n\
  \n洞察的存储、分析和可视化使 TML 解决方案具有可扩展性、安全性、无摩擦性、弹性，并且非常适合人类或机器进行实时决策。\n\n在第 6 章和第 7 章中，我们讨论了\
  \ TML 解决方案模板以及用于构建和可视化 TML 解决方案洞察的相关技术，例如：\n\n*   **云原生 Apache Kafka** 可以在 Amazon\
  \ Cloud Kafka、Microsoft Cloud Kafka、Google Cloud Kafka 或 Confluent Cloud Kafka 上运行，是我们\
  \ TML 的单一数据源。\n*   **MAADS-VIPER** 是官方的 Kafka 源连接器和汇连接器，用于从设备摄取数据，并向 Kafka 生产数据以及从\
  \ Kafka 消费数据。\n*   **MAADS-HPDE** 是与 VIPER 和 Kafka 集成的 AutoML 技术，执行所有监督和无监督的机器学习功能：\n\
  \    1.  应用机器学习算法并为训练数据集找到最佳算法\n    2.  使用该算法进行：\n        1.  预测分析\n        2. \
  \ 数学优化（规范分析）\n        3.  异常检测\n    3.  将所有结果生成到 Apache Kafka\n*   **MAADS-VIPERviz**\
  \ 通过 HTTPS 或 HTTP 连接将流式洞察或结果推送到客户端浏览器，实现可视化，包括：\n    1.  预测分析 – 推送来自预测性 TML 解决方案的预测结果\n\
  \    2.  优化 – 推送来自优化型 TML 解决方案的优化结果\n    3.  异常检测 – 推送来自异常检测 TML 解决方案的欺诈检测结果\n \
  \   4.  AiMS 仪表板 – 推送关于 TML 解决方案的所有信息，用于算法和洞察管理\n*   **MAADSTML Python 库**^(¹¹²)\
  \ 允许用户仅用几行代码，通过 TML Python 库函数创建强大的 TML 应用程序。\n\n上述技术简化了与 Apache Kafka 和机器学习的集成，以便对数据流进行高级分析。它们还简化了复杂任务，例如：\n\
  \n*   从设备和源系统摄取数据，并向运行在 GCP、AWS 和 Azure 上的 Kafka 生产数据以及从中消费数据。\n*   创建和管理 Kafka\
  \ 主题，同时跟踪每个数据的分区和偏移量。通过仔细管理分区和偏移量，VIPER 可以使用偏移量回滚数据流以获取数据历史的滑动窗口，然后连接多个滑动窗口（来自每个数据流）来构建用于机器学习的训练数据集。\n\
  *   分析过程很复杂，尤其是在处理多个数据流和具有数百万个偏移量的多个分区时，所有数据都在快速流动。TML 技术通过以下方式简化分析过程：(1) 自动将高级机器学习应用于连接后的数据流并找到最佳算法；(2)\
  \ 使用最新的训练模型自动对新数据进行预测、优化和异常检测；(3) 立即将来自任何 TML 解决方案的新洞察推送到客户端浏览器。\n\n\n\n*   通过结合数据流，实时构建监督式和无监督式机器学习模型。\n\
  \    1.  对于监督式机器学习，我们将数据流用作因变量流和自变量流。通过指定哪些流是因变量和自变量，我们可以实时构建一个机器学习模型，并将其发送给 HPDE\
  \ 进行训练。使用连接后的数据流进行训练是 TML with Kafka 的一个非常强大的功能。具体来说，我们使用偏移量参数自动回滚每个流，以获取一个历史数据集（滑动窗口），该数据集代表我们的训练数据集。VIPER\
  \ 告诉 Kafka 将训练数据集存储在一个主题中。Kafka 将训练数据集存储在指定主题的一个分区中；它将分区编号返回给 VIPER 以备将来使用。接下来，VIPER\
  \ 调用 HPDE，并将包含训练数据集的*主题*和分区编号传递给它。这之所以强大，原因如下：\n        1.  由于 Kafka 会选择分区来优化大数据存储，它会告知调用函数^(¹¹³)它选择了哪个分区；然后你在调用\
  \ HPDE 时使用这个分区，这能保证使用正确的训练数据集进行机器学习。这个过程使我们能够相对轻松地、持续地、实时地使用先进的自动机器学习技术，对非常大的数据集^(¹¹⁴)进行机器学习。我们不需要使用任何特殊的编程语言来对大型数据集进行机器学习，例如\
  \ Scala。\n\n2.  使用偏移量参数，我们可以告诉 Kafka 训练数据集在分区中的确切偏移量位置。这使我们能够保留训练数据集的审计跟踪，以防有人想要审计\
  \ TML 模型。我们可以根据需要创建任意数量的训练数据集，持续将它们添加到主题中，并精确地引导 HPDE 到 Kafka 主题中我们想要使用的训练数据集所在的分区和偏移量位置。\n\
  \n2.  对于无监督学习，我们的流程略有不同。我们不是构建训练数据集，而是构建对等组。这些对等组代表了数据流中的“正常”行为。对于异常检测，TML 将执行以下操作：\n\
  \        1.  连接感兴趣的数据流（字段），在每个流（字段）中找到对等组，并将其存储在 Kafka 主题中，然后返回分区和偏移量。\n\n2.  调用\
  \ HPDE，并将对等组的主题名称、分区和偏移量发送给它。\n\n3.  对于每个新事务以及事务中的每个字段，将其与相应的对等组进行比较，并计算风险评分。\n\n\
  4.  实时可视化结果。\n\n简化从设备和源系统摄取数据、向 Kafka 生产和消费数据、分析数据并将其可视化以辅助决策这些复杂任务，正是 TML 及其技术在快速数据和快速机器学习领域取得突破的原因，这些技术能够实现实时和大规模的快速决策。下一节将讨论\
  \ TML 项目规划方法。\n\n## TML 项目规划方法\n\n处理数据流中的监督式和无监督学习以及 AutoML 的能力，使 TML 不仅区别于 CML\
  \ 解决方案，也区别于那些更侧重于基于规则和基于 SQL 的方法进行预测、规范分析和异常检测的流处理技术。用于数据流异常检测的 TML 在银行和金融、物联网和资产绩效、制造业、供应链等领域提供了众多用例。监督式和无监督式\
  \ TML 解决方案背后的驱动力，分别是利用 Kafka 在实时回滚数据流时使用分区来管理大数据环境规模的能力，来创建训练数据集和对等组。\n\n上述过程可能会迅速变得复杂且难以管理，尤其是对于拥有数千个数据流、算法和洞察的大型\
  \ TML 解决方案而言。许多行业在管理机器学习解决方案方面仍然面临困难，无论解决方案规模大小，主要原因在于：\n\n*   解决方案与公司需求、战略和目标缺乏一致性\n\
  \n*   模型管理和运维困难，例如，机器学习解决方案崩溃或无法提供良好结果，导致人们停止使用它\n\n*   缺乏对解决方案的支持\n\n*   设计目标不明确，导致人们不信任驱动模型和结果的数据\n\
  \n*   解决方案性能不佳，例如，解决方案生成决策洞察的速度太慢，导致人们停止使用该解决方案\n\n可以通过关注以下几点来克服上述困难：\n\n1.  使 TML\
  \ 解决方案与公司目标保持一致：使用平衡计分卡方法会有所帮助。\n\n2.  选择合适的人员和技能来成功构建 TML 解决方案。这些将包括：\n    1. \
  \ 精通 CML 但理解流分析的数据科学家——我们引入了数据流科学家这个术语，指能够通过组合特定数据流来解决基于流的问题，从而构建 TML 模型的人。\n\n\
  2.  解决方案架构师，深入了解事件流平台（例如 Apache Kafka）如何与机器学习技术协同工作，以构建可扩展的 TML 解决方案，这些解决方案在微服务架构中与云上的\
  \ Apache Kafka 实现无摩擦和弹性扩展。\n\n3.  理解数据流细微差别的数据工程师——具有时间局部性（随时间演变）的事件驱动和实时数据。\n\n\
  4.  Python 开发者，能够使用 TML Python 库从设备和源系统摄取数据并将其流式传输到 Kafka，以及使用 TML Python 库函数构建\
  \ TML 解决方案。\n\n5.  可视化开发者，深入了解：\n        1.  JavaScript\n\n2.  JSON 数据格式\n\n3. \
  \ 可视化 API，例如 Google Charts\n\n6.  技术项目经理，接触过：\n        1.  Python\n\n2.  机器学习技术\n\
  \n3.  Kafka\n\n4.  云技术：AWS、GCP、Confluent、Azure\n\n5.  数据流\n\nTML 团队的规模将取决于以下因素：\n\
  \n1.  TML 解决方案中使用的数据流数量\n\n2.  将在 TML 解决方案中使用的源系统或设备\n\n3.  以下组件的实例数量：\n    1. \
  \ Kafka 代理\n\n2.  VIPER/HPDE/VIPERviz\n\n4.  可视化图表数量\n\n5.  可视化内容的消费者数量\n\n例如，我们以一个典型的\
  \ TML 解决方案为例，该方案包含：\n\n1.  1000 个数据流\n\n2.  100 个设备和源系统\n\n3.  以下实例：\n    1.  1\
  \ 个 Kafka 代理\n\n2.  10 个 VIPER 实例\n\n3.  5 个 HPDE 实例\n\n4.  5 个 VIPERviz 实例\n\n\
  4.  10 个可视化图表\n\n5.  50 个消费者\n\n6.  1 个 TML 用例\n\n表 9-1 显示了资源和人天数的细分。^(¹¹⁵)\n\n\
  表 9-1\n\nTML 工作量与资源细分\n\n\n\n| 资源 | 工作量（天） |\n| --- | --- |\n| 数据（流）科学家 | 14 |\n\
  | 解决方案架构师 | 11 |\n| 可视化开发人员 | 12 |\n| Python 开发人员 | 28 |\n| 数据工程师 | 20 |\n| 技术项目经理\
  \ | 17 |\n| 总工作量天数 | 102 |\n| 含 20% 应急储备 | 122 |\n\n表 9-1 中的“工作量（天）”列计算方式如下：\n\n\
  *   数据科学家 – 我们为每个用例分配了 4 天（0.8 FTE），并为每个源系统和设备分配了 0.02 FTE^(¹¹⁶)，总计 14 天工作量。理由是数据科学家将专注于解决用例问题，而非机器学习任务，因为\
  \ TML 使用了 AutoML。他们的主要职责是通过识别构成机器学习训练模型的因变量和自变量数据流，来制定训练数据集。\n\n*   解决方案架构师 – 我们为每个源系统分配了\
  \ 0.02 FTE，并为 VIPER、HPDE 和 VIPERviz 实例分配了 0.02 FTE，总计 11 天。理由是解决方案架构师需要专注于源系统如何与整体\
  \ TML 解决方案集成。如果源系统复杂，具有不同的数据格式、通信协议以及其他硬件或软件复杂性，此工作量可能会发生变化。解决方案架构师的主要职责是设计可扩展且稳健的\
  \ TML 架构，使其与数据流和源系统相协调，并与 TML 解决方案的弹性特性保持一致。\n\n*   可视化开发人员将负责（开发或配置）预测、优化和异常检测的可视化。我们为可视化数量（20\
  \ 个）和消费者数量（50 个）分配了 0.04 FTE，总计 12 天。需要注意的是，VIPERviz 提供了开箱即用的可视化功能，因此无需从头开发。这可以节省大量时间和成本。\n\
  \n*   Python 开发人员将使用 MAADSTML Python 库来开发 TML 解决方案。我们为每个源系统分配了 0.04 FTE，为所有 VIPER/HPDE/VIPERviz\
  \ 实例分配了 0.02 FTE，并为每个用例分配了 7 天（1.4 FTE），总计 28 天。由于 TML Python 库具有预构建函数，因此工作量大大减少。\n\
  \n*   数据工程师将与开发人员紧密合作，确保数据可访问并能流式传输到 Kafka。可能需要进行数据清理和准备工作。我们为每个源系统分配了 0.04 FTE，总计\
  \ 20 天。\n\n*   技术项目经理是确保 TML 项目顺利推进的重要角色。为了计算工作量，我们取所有资源工作量总和的 20%，得出 17 天。\n\n\
  上述工作量估算是否合理？根据我们的经验，答案是肯定的。如果我们增加 20% 的应急储备，TML 项目大约需要 122 个工作日才能完成。由于许多任务可以并行进行，该项目可以在不到一个月的时间内完成。图\
  \ 9-1 以图形方式展示了资源与工作量的关系。请注意，可能还有其他用于 TML 解决方案支持和维护的运营或项目角色，例如文档、培训、变更管理和控制以及安全。但是，我们选择不添加这些角色，而是专注于开发\
  \ TML 解决方案所需的关键角色，以保持示例的简洁性。\n\n![../images/510404_1_En_9_Chapter/510404_1_En_9_Fig1_HTML.jpg](img/510404_1_En_9_Fig1_HTML.jpg)\n\
  \n图 9-1\n\nTML 资源与工作量分配\n\n下一节将讨论 TML 价值创造。\n\n## TML 价值创造\n\n创造价值对每个企业都至关重要。我们在第\
  \ 4 章中还介绍了一个 TML 价值框架（TVF），它将帮助您选择那些经过优先级排序且与公司目标和战略紧密一致的 TML 用例。将机器学习解决方案与公司目标和战略保持一致，可确保这些解决方案产生正的利润率：即解决方案的开发成本低于其在生命周期内产生的价值。很多时候，企业在意识到为时已晚之前，都会忽视先进技术解决方案的成本。TML\
  \ 与 AiMS 相结合，为管理员提供了密切跟踪和监控解决方案（供消费者）使用情况的能力。由于 TML 技术与使用发布-订阅框架的 Apache Kafka 集成，因此可以跟踪消费者和生产者。当没有人消费\
  \ TML 解决方案的洞察时，设置警报和通知对于在超过非使用期限时触发解决方案停用非常重要。特别是对于消耗云计算、存储和网络资源的大型解决方案，能够停用无人使用的解决方案可以为组织节省大量成本。这些节省下来的成本可以用于构建更高价值的\
  \ TML 解决方案。TML 解决方案的价值体现在以下几个方面：\n\n*   更快的决策 – 通过减少 CML 中存在的摩擦，TML 以较少的人工干预加快了洞察生成的速度。例如，一个\
  \ TML IoT 解决方案可以持续对 IoT 数据进行自我训练，并预测设备故障风险，从而向可能决定采取预防性维护措施的人员发出警报。\n\n*   更快的扩展\
  \ – 与 Kafka 结合，TML 解决方案具有弹性，可以使用 API 和微服务架构快速扩展，为几乎所有行业的组织开辟了新的机遇。例如，在 IoT 环境中，可以快速将数百个新设备添加到\
  \ TML 平台，而数据和数据科学团队只需付出很少的增量工作。\n\n*   更快（更深入）的洞察 – 欺诈检测或产品推荐不仅可以即时提供，而且与 CML 解决方案不同，TML\
  \ 能够利用新数据不断进行自我优化和自我学习，以较少的人工干预融入新的欺诈手段或产品购买趋势，同时将最新的洞察以可视化形式呈现到客户浏览器中，以便更好、更轻松地做出决策。\n\
  \n通过更好、更快的决策来创造价值，需要具备将 TML 解决方案的结果可视化的能力。由于数据生成和洞察创建的速度，可视化对于数据流至关重要。数据创建速度的提高导致数据积累更快，随着时间的推移，数据中会出现更多样化的趋势和模式。数据流的时间局部性赋予了时间重要性，这将影响所捕获的学习成果和洞察。在监督学习中，机器将捕获估计参数中的学习成果。重新训练或重新学习的能力是\
  \ TML 解决方案最重要的方面之一。通过持续重新学习，我们可以自动更新估计参数，并确保我们从最新数据中获得最新的学习成果。这对于由静态、驻留磁盘数据驱动的 CML\
  \ 来说是无法快速实现的。拥有最新的估计参数意味着机器已经学习了数据中的任何新趋势和模式。使用最新的参数，我们更有可能做出更好的预测，并为自变量找到更好的最优值。这在模型退化可能迅速发生、损害业务绩效并降低客户满意度的行业中非常重要。\n\
  \n\n对于数据流的无监督学习，机器会向合并后的数据流应用算法，以寻找“正常”行为。它定义“正常”的方式是计算每个数据流的平均值或质心值。任何显著偏离平均值或质心的值都被视为“异常”，不会纳入对等组。如何选择正常性是通过计算每个数据点与其质心的标准差来确定的。HPDE\
  \ 能非常快速地完成这一过程。\n\n您还可以定义标志，用于控制如何为每个数据流选择对等组。同样，这是一种为每个数据流定义不同正常行为的非常强大的方法。无论您有\
  \ 100 个、100,000 个还是更多数据流，流程都不会改变。通过查找每个数据流中的异常，然后将结果合并以形成风险评分，您可以非常快速地判断行为是正常还是异常，然后将其可视化并进一步调查该交易。下一节将提供一些总结性思考。\n\
  \n## 总结性思考\n\n如前所述，如果 TML 解决方案不用于人类或机器做出能为您的业务增加价值的决策，那么它们就几乎没有用处。在某些情况下，组织会成为 AI\
  \ 和 ML 供应商的受害者，这些供应商在纸面上承诺其解决方案如何能为业务增值，但在实践中却未能真正兑现承诺。对于 TML 而言，纸上谈兵与实际操作之间的距离很小，因为在概念验证中证明\
  \ TML 解决方案价值的速度可能只需数小时。这有助于在 TML 解决方案与切实的业务价值之间建立可见的联系。如果机器学习解决方案不能为您的业务带来直接或间接的价值，那么它们就是在浪费宝贵的业务资源。使用\
  \ AiMS 正确监控和跟踪 TML 解决方案的价值生成，对于确保解决方案被使用并随着时间的推移为组织增加价值至关重要。\n\nTML 的未来看起来一片光明，部分原因是几乎所有行业都在以前所未有的速度和数量生成数据。随着云基础设施以及计算、存储和网络吞吐量的成本下降，以及电信网络升级到\
  \ 5G，对更快机器学习的需求将会上升。我们已经看到云技术采用率的增长，以及对 AI 和机器学习技能需求的增加，这得益于对使用算法进行更高级数据分析的需求。许多组织在数字化转型之旅中走得更远，将数据和\
  \ AI 技术作为增长基础的一部分。许多组织的关注领域将转向数据流和 AutoML，因为像 Apache Kafka（80% 的财富 100 强公司都在使用它）^(¹¹⁷)\
  \ 这样的技术继续为 TML 提供增长机会。有助于改善全球生活质量的智能设备也需要更快的机器学习来实现更快的决策。\n\n在后疫情时代，企业将寻求降低成本的方法，而\
  \ AI 和机器学习将成为运营效率的重要组成部分，从而以更好、更便宜的方式提供更贴近消费者需求的产品和服务。但是，TML 并非万能解决方案；它应成为整体创新战略的一部分，该战略强调利用快速数据实现快速决策的快速机器学习。只有通过这种战略认识，组织才会优先考虑\
  \ TML 解决方案，以解决正确的业务问题，从而做出正确的决策，快速创造业务价值。\n\n当您开始使用本书中强调的技术，更深入地研究涉及数据流和 AutoML\
  \ 的 TML 时，您将开始意识到有一大类用例属于 TML 的范畴。这不仅会为您的业务创造机会，也会为您个人创造机会，因为您将学习应用先进的自动、监督和无监督机器学习于快速流动数据流的最新方法，而这些是传统机器学习方法无法完全胜任的。\n\
