  优化输出键的描述\n\n| 键 | 描述 |\n| --- | --- |\n| **UserDetails** | 用户优化详情。 |\n| **CreatedOn**\
  \ | 生成优化的日期和时间。 |\n| **Unixtime** | 生成优化结果时的 Unix 时间。 |\n| **HPDEHOST** | HPDE 主机。\
  \ |\n| **ConstraintType** | 使用的约束类型。共有三种约束类型。如果 ConstraintType=1，则自变量将受其最小值和最大值的约束。例如，对于\
  \ independentvariable1，约束为 min <=independentvariable1<= max。如果 ConstraintType=2，则自变量将受其最小值减去其标准差的约束。例如，对于\
  \ independentvariable1，约束为 min-std <= independentvariable1<= max-std。如果 ConstraintType=3，则自变量将受其最小值减去\
  \ stretchbounds 值的约束。例如，对于 independentvariable1，约束为 min-min*stretchbounds<= independentvariable1<=\
  \ max-max*stretchbounds。 |\n| **Epsilon** | 一旦 HPDE 找到一个良好的局部最小值/最大值，它就会使用此 epsilon\
  \ 值来寻找全局最小值/最大值，以确保您获得能够最小化或最大化因变量的最佳自变量值。 |\n| **StretchBounds** | 一个百分比数字，范围从\
  \ 0 到 100。此值将用于约束中以扩展边界，如前所示。 |\n| **Usedeploy** | 如果为 1，则使用已部署的算法（在 /deploy 文件夹中）；否则，使用测试算法（在\
  \ /models 文件夹中）。 |\n| **OptimizedValues** | 这些是优化后目标函数和自变量的优化值。 |\n| **Objective**\
  \ | 这将指示您选择的是最大化还是最小化。 |\n| **ObjectiveFunctionValue** | 这是目标函数的优化值。 |\n| **OptimalValues**\
  \ | 这些是优化后自变量的优化值。 |\n| **Constraints** | 这将指示自变量的约束边界。 |\n| **DescriptiveStats**\
  \ | 这将显示自变量的描述性统计信息：最小值、最大值、平均值、标准差。 |\n| **AdditionDetails** | 这些是优化的附加详情。 |\n\
  | **Consumer ID** | 您在 Kafka 中消费的主题的消费者 ID。 |\n| **Producer ID** | 您在 Kafka 中生产的主题的生产者\
  \ ID。 |\n| **Consumefrom** | 您在 Kafka 中消费的主题。 |\n| **Produceto** | 您在 Kafka 中生产的主题。\
  \ |\n| **Brokerhost** | Kafka 代理主机。 |\n| **Brokerport** | Kafka 代理端口。 |\n| **BytesWritten**\
  \ | 写入 Kafka 的字节数。 |\n| **Kafkakey** | 与存储在 Kafka **produceto** 主题中的数据关联的 Kafka\
  \ 键。 |\n| **Partition** | Kafka 将数据写入 **produceto** 主题的分区。 |\n| **Offset** | Kafka\
  \ 为 **produceto** 主题中的数据生成的偏移量。 |\n\n***viperhpdetraining*** 和 ***viperhpdeoptimize***\
  \ 的组合可以强大地生成 TML 模型的结果，这些结果可用于更好、更快的决策。前述函数将对任何数据流执行 TML。通过使用最优算法来预测和优化自变量的值，用户可以以无摩擦的方式提供高级机器学习见解。图\
  \ 6-9 展示了一个典型的 TML 处理流程，通常说明了何时使用这些函数，以便于参考。\n\n![../images/510404_1_En_6_Chapter/510404_1_En_6_Fig9_HTML.jpg](img/510404_1_En_6_Fig9_HTML.jpg)\n\
  \n图 6-9\n\n监督学习的 TML 流程图\n\n我们将展示此过程如何应用于本书提供的示例代码。接下来的章节将讨论示例代码以及它们如何融入上述过程。\n\n\
