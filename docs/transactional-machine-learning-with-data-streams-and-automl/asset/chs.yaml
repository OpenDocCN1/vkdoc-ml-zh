  ```\n\n其中\n\n*   vipertoken、host 和 port – 是 VIPER 连接详情。\n\n*   consumefrom – 是函数\
  \ ***viperhpdetraining*** 中 ***produceto*** 参数的主题名称。您应该已经订阅了此主题并保存了 consumerid。\n\
  \n*   produceto – 是您想要写入预测值的主题名称。您应该已经创建了此主题并保存了 producerid。\n\n*   Companyname\
  \ – 您的公司名称。\n\n*   Consumerid – ***consumefrom*** 参数中主题的 consumerid。\n\n*   Producerid\
  \ – ***produceto*** 参数中主题的 producerid。\n\n*   Hpdehost – HPDE 的主机地址。\n\n*   Hpdeport\
  \ – HPDE 的端口地址。\n\n*   Inputdata – 这是自变量的新原始数据。具体来说，这些是算法进行预测所需的每个自变量的值。值的顺序必须与最优算法信息中自变量的顺序一致。或者，您可以附加您在\
  \ ***viperproducetotopicstream*** 中生成的数据流；VIPER 将持续读取此流并生成预测。\n\n*   Algokey – 这是标识最优算法的键，将由\
  \ ***viperhpdetraining*** 在 JSON 对象中返回。\n\n*   Partition – 这是包含最新训练算法的 Kafka 分区；通常，您可以将其设置为\
  \ -1，因为旧算法会被覆盖。\n\n*   Offset – 这是最优算法信息的偏移位置。\n\n*   Enabletls、delay、brokerhost、brokerport、timeout\
  \ 和 microserviceid – 前面已描述。\n\n*   Usedeploy – 如果希望使用 **deploy** 文件夹中的算法（算法必须存在），则设置为\
  \ 1；否则，如果为 0，则使用 Models 文件夹中的算法。\n\n如果此函数执行成功，则您已使用新的流数据从 TML 算法进行了预测。可以重复调用此函数以生成预测。示例输出如清单\
  \ 6-2 所示。\n\n```\n{\n\"Hyperprediction\": 2.935,\n\"Algokey\": \"ConsumerId-n1NiZUObhCOpIEhAn3q1df3orJpcqy_json\"\
