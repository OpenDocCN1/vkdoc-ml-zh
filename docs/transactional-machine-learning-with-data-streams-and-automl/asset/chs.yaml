  : 0,\n\"BytesWritten\": 944,\n\"kafkakey\": \"EkFXhJJ3fvTpquCyXEgUq3HZ-CsNnT\",\n\
  \"Partition\": 0,\n\"Offset\": 4\n}\n清单 6-1\nTML 输出示例\n```\n\n示例输出是 JSON 格式的数据。它显示了您进行预测和优化所需的所有重要信息的键和值。此\
  \ JSON 输出在表 6-2 中进行了描述。\n\n表 6-2\n\nJSON 输出键的描述\n\n\n\n| 键名 | 描述 |\n| --- | ---\
