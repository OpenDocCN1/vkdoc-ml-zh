  | **HPDEHOST** | HPDE 主机和端口。 |\n| **HPDEMACHINENAME** | 运行 HPDE 的机器。 |\n| **Modelruns**\
  \ | HPDE 将迭代的模型数量。此数字越大，HPDE 搜索最适合数据的最佳算法或模型的强度就越大。 |\n| Modelsearchtuner | 模型搜索调优器的值。\
