  引言


  *快速数据需要快速机器学习以实现快速决策。* 了解如何使用 Python 在云端将自动机器学习应用于 Apache Kafka 的数据流，并创建*无摩擦*（需要最少甚至无需人工干预）和*弹性*（通过控制数据流、算法和洞察用户的数量来实现可伸缩的机器学习解决方案）的事务性机器学习（TML）解决方案。本书将加深您对
  TML 解决方案内部工作原理的理解，这些解决方案使用与 Apache Kafka 集成的可扩展自动机器学习数据流。您将站在机器学习这一激动人心领域的前沿，该领域专注于数据与算法创建的速度、规模和自动化，这将为几乎所有行业带来商业价值。


  通过阅读本书，您将对 TML 的技术和业务方面有扎实的理解。您将了解如何构建包含所有必要细节的 TML 解决方案，所有可免费下载的软件都触手可及。在知识经济时代，数据创建速度不断加快，需要快速、无摩擦且弹性的机器学习解决方案来实现快速决策，从而大规模创造巨大的商业价值，您将站在技术和商业的前沿！


