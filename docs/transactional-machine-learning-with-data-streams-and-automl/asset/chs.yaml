  \ |\n\n表 5-2 中讨论的组件可以按需实例化以实现扩展。具体来说，对于大型 TML 解决方案，可能需要通过部署多个 DSSP、VIPER、VIPERviz\
  \ 和 HPDE 实例来进行负载削减。这些应用程序中的每一个都可以扩展到任意数量的实例，仅受硬件限制。下一节将展示这些组件如何在云实例中协同工作。\n\n##\
  \ TML 解决方案的技术架构\n\n上一节讨论了构成 TML 解决方案的技术组件。在本节中，我们将展示这些组件如何在图 5-2 所示的技术架构中协同工作。在图\
  \ 5-2 中，首先需要注意的是泳道图。\n\n![../images/510404_1_En_5_Chapter/510404_1_En_5_Fig2_HTML.jpg](img/510404_1_En_5_Fig2_HTML.jpg)\n\
  \n图 5-2\n\nTML 技术架构\n\n*   **数据生成** – 这些包括所有应用程序、传统设备、移动设备、传感器以及 Web 和社交媒体。\n\n\
  *   **网关** – 所有数据流经云网关或某些现场网关。这些网关将核心网络连接到边缘网络，并提供访问控制，允许数据通过网络传输到最终用户。它们还可以连接不同位置的不同云/数据中心。或者，它们可以将数据存储在\
  \ TML 解决方案可访问的数据库中。TML 将实时执行以下数据转换：(1) 合并多个数据流，(2) 将每个数据流修剪为等长以形成训练数据集，(3) 将数据流中的\
  \ JSON 对象转换为用于机器学习的数组，(4) 使用 Z 分数和同行组分析构建同行组以进行异常检测，(5) 整合并格式化新的数据流以用于预测、优化和异常检测。\n\
  \n*   **防火墙** – 确保进出数据中心（或网络基础设施）的数据具有适当的授权，并通过软件和硬件防火墙进行调节和控制。希望保护其环境的组织将建立一个防火墙边界，以控制数据的进出。\n\
  \n*   **云端 Kafka** – 云端 Kafka 是我们的 DSSP，它将存储来自 TML 解决方案的所有数据、洞察和算法，供最终用户使用。Kafka\
  \ 云是安全的，访问它需要使用 SASL/PLAIN 身份验证的云用户名和密码。此外，TML 解决方案与 Kafka 之间的所有流量都将使用传输层安全^(⁵⁹)\
  \ (TLS) 加密进行加密。\n\n*   **洞察消费者** – 这些是消费 TML 解决方案洞察的消费者。它们可以是应用程序、设备、Web 或社交媒体用户。您可以是最终用户，也可以是获取信息用于决策的机器。\n\
  \n防火墙内的 MAADS-VIPER 接收来自数据生成器的数据。原始数据格式必须为文本格式。然后，MAADS-VIPER 将：\n\n1.  使用 MAADSTML\
  \ Python 库函数 **vipercreatetopic** 来：\n    1.  使用云用户名/密码登录 Kafka 云\n    2.  在 Kafka\
  \ 中创建一个主题\n\n2.  使用 MAADS Python 库函数 **viperproducetotopic** 来：\n    1.  使用云用户名/密码登录\
  \ Kafka 云\n    2.  将数据转换为 JSON\n    3.  使用 TLS 加密数据\n    4.  将 JSON 数据写入已创建的 Kafka\
  \ 主题\n\n为了处理数据，在 Kafka 主题中，对于监督学习，MAADS-VIPER 将按照类似的登录过程读取 Kafka 中的主题，并：\n\n3. \
  \ 使用 MAADS Python 库函数：\n    1.  **Vipercreatejointopicstreams** – 合并多个数据流，并为合并后的流创建一个主题\n\
  \    2.  **Viperproducetotopicstream**\n        *   整合流数据\n        *   根据用户选择的偏移量回滚每个流以形成历史数据\n\
  \        *   将所有流的数据生成到合并后的主题流中\n    3.  **Vipercreatetrainingdata** – 创建训练数据集并将其生成到另一个主题中\n\
  \    4.  一旦训练数据集构建完成并保存在另一个主题中，就可以通过调用 HPDE 进行处理。具体来说，使用函数 **viperhpdetraining**：\n\
  \        1.  登录 Kafka 云以检索训练数据集（训练数据集不会从 VIPER 移动到 HPDE），并将机器学习算法应用于该数据集。\n\n\n\n\
  2.  它将生成一个最优算法，并将该算法物理写入磁盘，同时将所有关于该算法的元数据存储到另一个 Kafka 主题中。\n\n3.  它会将该 Kafka 主题的名称传回给\
  \ VIPER，VIPER 可使用该主题进行预测和优化。\n\n5.  使用最优算法进行预测是通过 **viperhpdepredict** 完成的：\n  \
  \  1.  此函数将接受输入数据，即自变量的值或另一个数据流，将输入数据传递给最优算法，并返回一个预测结果。\n\n2.  此函数可置于循环中，以持续将输入数据传递给最优算法来生成预测。或者，用户可以将输入数据指向一个数据流，当新数据进入该输入数据流时，持续生成预测。\n\
  \n6.  如果用户需要找到自变量的最佳或最差值，他们使用 **viperhpdeoptimize** 执行数学优化，以找到自变量的最优值。\n    1. \
  \ 最优值存储在另一个 Kafka 主题中，并由应用程序检索使用；这些值（及方法）非常适合构建闭环解决方案，在该方案中，机器无需人工干预即可做出所有决策。\n\n\
  7.  消费者通过 MAADS-VIPER，使用 **viperconsumefromtopic** 消费预测结果和最优值。\n    1.  此函数登录到 Kafka\
  \ Cloud，并使用 OFFSET 参数从指定的偏移量开始读取数据。用户可以从主题的开头（OFFSET = 0）、末尾（OFFSET = -1）或两者之间的任意位置读取数据。\n\
  \n2.  数据采用 JSON 格式，几乎任何编程语言或应用程序都可以读取。\n\n3.  预测值或最优值可以轻松地从 JSON 数据中提取出来。\n\n8.\
  \  当有大量消费者想要访问*同一个*主题时，可以使用 **viperconsumergroupconsumefromtopic**。\n    1.  此函数可用于对主题中的数据进行并行处理。当数据写入主题时，此函数会*同时*将数据分发给每个消费者。\n\
  \n2.  为了优化主题以进行并行处理，主题的分区数应与消费者数量相同。这使得 Kafka 能够将数据分发到主题中的每个分区，以便每个消费者可以同时访问并消费数据。管理员可以创建一个具有初始分区数的主题，如果需要更多分区来容纳更多消费者，可以使用\
  \ MAADSTML Python 库增加分区数。\n\n3.  此函数对于提升大型分布式 TML 解决方案的性能非常有用。\n\n## 无监督学习\n\n要使用无监督学习处理数据进行异常检测，您需要使用两个函数：**viperanomalytrain**\
  \ 和 **viperanomalypredict**。该过程与监督学习类似，但此处我们不创建训练数据集。相反，我们使用 viperanomalytrain 从我们想要分析异常的数据流中找出对等组。具体来说，从数据流生成对等组的步骤如下：\n\
  \n1.  **vipercreatejointopicstreams** – 用于连接多个数据流，并为连接后的流创建一个主题。\n\n2.  **viperproducetotopicstream**\n\
  \    1.  整合流数据\n\n    2.  根据用户选择的偏移量回滚每个流，以形成历史数据\n\n    3.  将所有流的数据生成到连接后的主题流中\n\
  \n3.  **viperanomalytrain** – 创建所有流的对等组。该对等组是一组代表“正常”行为的事务。\n\n4.  **viperanomalypredict**\
  \ – 通过将每个新数据与对等组进行实时比较，生成该数据被检测为异常的概率分数。\n\n我们将在下一章展示上述过程如何实现。在此之前，下一节将讨论 TML 组件之间的通信过程。\n\
  \n## 组件间的通信过程\n\nTML 组件之间的有效通信对于成功的 TML 解决方案至关重要。确保有效通信有三个重要组成部分：\n\n*   安全性\n\n\
  *   并发性\n\n*   算法管理\n\nKafka、VIPER、VIPERviz 和 HPDE 之间的所有通信均经过 SSL/TLS 加密。对于在分布式网络中传输的敏感信息，这种安全性至关重要。并发性也是确保\
  \ TML 解决方案能够同时处理多个想要从 Kafka 写入和读取信息的生产者和消费者的重要方面。虽然可以启动多个 VIPER、HPDE 和 VIPERviz\
  \ 实例，但每个应用程序都内置了并发处理能力，以同时处理多个请求。这不仅提高了性能，还允许减少每个应用程序的实例数量，从而降低解决方案的开销和成本。图 5-3\
  \ 展示了 TML 解决方案的通信周期。\n\n![../images/510404_1_En_5_Chapter/510404_1_En_5_Fig3_HTML.jpg](img/510404_1_En_5_Fig3_HTML.jpg)\n\
  \n图 5-3\n\nTML 通信周期\n\n图 5-3 展示了 TML 通信周期中的 12 个步骤。具体描述如下：\n\n*   **数据生成器** 通过向\
  \ Kafka 生成数据来启动通信周期。\n\n*   **MWS 接收器** 从数据生成器接收数据。\n\n*   **编码** MWS 使用 SSL/TLS\
  \ 加密对数据进行编码，并将其发送到 Kafka 主题。\n\n*   **MWS 发送器** 将数据发送到 Kafka 主题。\n\n*   **Kafka\
  \ Cloud** 存储数据。\n\n*   **解码** MWS 解码 Kafka 中训练数据集的位置，并将其发送给 HPDE。注意：MWS 不会将训练数据集发送给\
  \ HPDE，仅发送其在 Kafka 中的位置。\n\n*   **HPDE 消费者** 消费 Kafka 中的数据，并对训练数据集执行机器学习。\n\n* \
  \  **HPDE TML 算法生成器** 生成最优算法，微调超参数，并将其写入 Kafka 主题。\n\n*   **MWS 洞察接收器** 接收 Kafka\
  \ 中的预测结果、优化值和异常信息。\n\n*   **MWS 洞察生成器** 生成预测结果、优化值和异常信息的实时图表和表格，并通过 WebSockets 推送到用户的浏览器。\n\
  \n*   **编码** MWS 使用 WebSockets 与客户端的 Web 浏览器通信，通过 HTTPS 推送洞察信息，以便在客户端浏览器中进行可视化。\n\
  \n*   **Web 浏览器** 显示预测结果、优化值、异常信息和 AiMS 的实时可视化。\n\n*   **MWS 消费者** 从其 Web 浏览器消费预测结果、优化值、异常信息和\
  \ AiMS 的可视化内容。\n\n该周期可以扩展到任意数量的数据流（数据生成器）、算法、生产者和洞察消费者。Kafka Cloud 平台支持水平扩展，使得 TML\
  \ 在处理需要快速学习的大量快速数据时非常高效。\n\n下一节将讨论 TML 解决方案组件之间的数据流。它将展示数据是如何被生产和消费的，以及生产/消费的数据类型。它还将展示消费者需要生产和消费哪些类型的数据，以便用于可视化和决策。\n\
  \n\n\n## 数据流\n\nTML 组件之间的数据流采用 JSON 格式进行标准化。JSON 格式是一种广泛使用且被接受的数据标准，用于存储、展示和分析信息。Kafka\
  \ 也符合 JSON 标准。JSON 数据的另一个优势是跨平台和跨应用的兼容性，这意味着如果 TML 解决方案的结果需要被其他系统使用，在大多数情况下，这些系统应该能够读取\
  \ JSON 格式的数据。JSON 的另一个重要方面是性能。解析 JSON 格式的数据比解析非 JSON 数据要高效得多。此外，HPDE 创建的每个算法的元数据信息都以\
  \ JSON 格式存储在嵌入式数据库中，并由 VIPER 读取。这使得 VIPER 和 HPDE 的数据在不同操作系统之间的可移植性更加无缝和高效。\n\n图\
  \ 5-4 展示了核心 TML 组件之间的数据流动，具体如下：\n\n![../images/510404_1_En_5_Chapter/510404_1_En_5_Fig4_HTML.jpg](img/510404_1_En_5_Fig4_HTML.jpg)\n\
  \n图 5-4\n\n数据如何在 TML 组件之间流动\n\n1.  数据生成器发送由 MWS (MAADS-VIPER) 接收的原始数据。\n2.  MWS\
  \ 将数据格式化为 JSON，并以键值对的形式记录日期、时间、位置、数值和其他信息，对数据进行编码，并将其生成到 Kafka 主题中。请注意，可能有多个主题流（可能同时）被写入\
  \ Kafka。\n3.  MWS 接收器消费这些主题流，并使用前面描述的 MAADS 函数创建训练数据集。\n4.  MWS 调用正在主机和端口上监听连接的\
  \ HPDE。MWS 将包含训练数据集的 Kafka 主题名称传递给 HPDE。\n5.  HPDE 检索训练数据集，对数据执行机器学习，找到最优算法，微调超参数，并将算法写入磁盘。然后，它将主题名称以及算法在磁盘上的物理位置返回给调用的\
  \ MWS 程序。\n6.  MWS 将算法元信息写入一个 Kafka 主题，并返回该主题的名称。\n7.  其他 MWS 程序可以使用最优算法主题名称来传递输入数据（来自数据生成器的原始数据），并生成预测值、最优值或异常值。\n\
  8.  MWS 将预测值、最优值或异常值传递给洞察消费者进行可视化。\n\n上述过程可以重复任意多次。该过程的核心要素是：\n\n*   识别哪些数据流需要合并以创建训练数据集\n\
  *   为每个训练数据集记录最优算法名称（即 Kafka 中的主题）\n*   向正确的主题生成数据并从正确的主题消费数据\n*   使用新的原始数据和正确的最优算法来生成预测值和/或最优值及异常值\n\
  *   将正确的预测值和/或最优值或异常值发送给正确的消费者应用程序、设备或 Web/社交媒体以供消费\n\n因此，对于上述过程，TML 解决方案将：\n\n\
  1.  创建多个主题。\n2.  生成多个写入磁盘的最优算法。\n3.  主题可能需要多个 Kafka 分区。\n4.  使用 Kafka 的存储和吞吐能力。\n\
  5.  产生云成本。^(⁶⁰)\n\n因此，管理员、解决方案架构师和可视化设计人员应仔细关注整体解决方案成本，并尽量减少任何不必要的主题、分区和存储。下一节将讨论并展示一个\
  \ TML 解决方案架构示例。\n\n## 示例架构\n\n图 5-5 展示了一个使用 Confluent Cloud^(⁶¹) 的示例架构。Confluent\
  \ Cloud 是一个平台，在 Amazon AWS、Microsoft Azure 和 Google Cloud 上以托管服务的形式提供 Kafka。\n\n\
  ![../images/510404_1_En_5_Chapter/510404_1_En_5_Fig5_HTML.jpg](img/510404_1_En_5_Fig5_HTML.jpg)\n\
  \n图 5-5\n\nTML 示例架构^(⁶²)\n\n关于上述架构的一些显著特点：\n\n*   训练数据集存储在运行于 Confluent Cloud 中的\
  \ Kafka 中，该云使用 Amazon、Microsoft 或 Google 的基础设施。\n*   MAADS-VIPER (MWS)、VIPERviz\
  \ 或 HPDE 在 Windows、Linux 或 MacOS 环境中运行。\n*   MAADS-VIPERviz 是一种用于可视化 Kafka 中流式传输结果的可视化技术。\n\
  *   所有最优算法、预测值、异常值和最优值都存储在 Kafka 中。\n*   使用 SSL/TLS 加密来保护进出 Confluent Cloud 的数据安全。\n\
  *   可以使用多个 VIPER、VIPERviz 和 HPDE 实例来连接分布式网络中的多个 Confluent Cloud 实例。\n*   通过创建具有多个分区的主题，实现对访问同一主题的多个消费者的并行处理。\n\
  \n这种架构的通用性，跨越任何提供托管 Kafka 服务的云供应商，使得 TML 解决方案与云无关，同时确保不同托管 Kafka 服务之间的标准通信和数据格式。这扩展了\
  \ TML 解决方案的可行性和实用性。它也使得 Kafka 成为生产者、VIPER、HPDE 和 VIPERviz 生成的所有信息的中心源和汇。下一节将描述 TML\
  \ 的成本构成。\n\n\n\n## TML 成本管理\n\n我们在上一章讨论了 TML 的成本构成；本章将对此进行展开。对于基于云的解决方案，管理 TML 组件的成本将取决于以下几个组成部分：\n\
  \n*   **人员** – 由于 TML 自动化了许多传统数据科学家的任务，您应为设计、构建、测试、部署和维护 TML 解决方案规划以下资源。人员数量将取决于您计划开发的\
  \ TML 解决方案的规模和数量。角色如下：\n    *   **数据流工程师** – 负责为 TML 解决方案获取数据，并使用 MAADS-VIPER 和\
  \ MAADSTML Python 库将数据生成到 Kafka 的人员。此人应具备 Apache Kafka 和 Python 的知识。\n\n    *  \
  \ **TML 解决方案架构师** – 这是一个关键角色，因为此人将负责架构 TML 解决方案如何使用数据流，特别是源流和汇流是什么，以及它们如何被连接以产生用于可视化、扩展和决策的结果。\n\
  \n    *   **数据流科学家** – 负责制定 TML 解决方案的方法、方法论和模型公式，并使用 MAADSTML Python 库进行开发以用于部署的人员。\n\
  \n    *   **数据流可视化专家** – 负责维护或增强开箱即用可视化功能的人员。MAADS-VIPERviz 提供了四种预构建的可视化，用于预测、优化、异常和通用可视化，使您能够可视化组合的数据流。\n\
  \n    *   **TML 管理员** – 使用 AiMS 仪表板管理 TML 解决方案的运营人员。\n\n    *   **云基础设施专家** – 负责为\
  \ TML 解决方案构建和管理云基础设施，并定义安全性和访问控制列表的人员。\n\n*   **流程与变更管理**\n    *   **变更管理专家** –\
  \ 负责向（业务）用户传达 TML 解决方案的目的和价值，并定义 TML 解决方案所需的任何流程变更的人员。\n\n*   **技术**\n    *   **Kafka\
  \ 分区** – 最重要的成本组成部分是您每个主题使用的分区数量。成本按每个分区每小时计算。例如，1000 个分区，用于 1 个主题，持续 1 小时，将花费您\
  \ 4 美元。虽然这看起来很低，但如果您的 TML 解决方案使用 1000 个分区连续运行 6 个月，那么仅 1 个主题在 6 个月内就会产生 17,280 美元的账单。因此，请谨慎使用分区。\n\
  \n    *   **网络读写** – 这将取决于您读取数据和写入数据到 Kafka 的速度。速度越高，成本越高。\n\n    *   **存储** – 虽然存储是成本最低的组成部分，但也应进行相应管理。\n\
  \n上述组成部分是在组织中开发、部署和维护 TML 解决方案的核心组件。可能还有其他组件，但上述组件代表了成功部署 TML 所需考虑的大部分因素。下一节将总结本章。\n\
  \n## 总结\n\n本章详细介绍了 TML 参考架构和技术架构，重点说明了 TML 组件之间的通信和数据流。它还展示了一个 TML 架构的示例。讨论的一些主要关注领域包括：\n\
  \n*   TML 组件（如数据生成器、VIPER、VIPERviz、HPDE、Kafka 和洞察消费者）之间的通信周期。这可能是一个持续的过程，具体取决于如何使用\
  \ MAADSTML Python 库函数（或 REST API）开发 TML 解决方案。这些函数使开发人员能够访问 VIPER 并控制其功能：生成数据到 Kafka、从\
  \ Kafka 消费数据以及调用 HPDE。使用这些库函数可以开发出强大的 TML 解决方案。可以创建并连接多个 TML 解决方案。具体来说，通过使用 Kafka\
  \ 中的主题，其他 TML 解决方案可以使用相同的最优算法和洞察，并在不同的应用程序、设备、网络和社交媒体之间共享信息。\n\n*   TML 组件之间流动的数据采用\
  \ JSON 格式。JSON 格式使得跨不同应用程序共享洞察变得容易，并简化了从 JSON 对象中检索信息的过程。数据的标准化也使得操作 JSON 对象（例如组合和分析不同对象）变得容易。它还消除了为\
  \ TML 解决方案维护物理数据库模式的需求，因为元数据信息存储在 VIPER 和 HPDE 的嵌入式数据库中，这使得 TML 解决方案在不同环境之间具有高度的可移植性。\n\
  \nTML 解决方案可以构建为闭环或开环解决方案。对于闭环解决方案，这使得 TML 解决方案可以完全无摩擦且自动化，无需任何人工干预。生成的洞察可用于自动调整下游系统。开环解决方案在决策过程中需要一些人工干预，但与\
  \ CML 流程相比，这种干预是最小的。\n\n当架构师设计 TML 解决方案时，他们应注意以下几点：\n\n*   如果多个消费者访问同一个主题，应考虑并行处理。这将要求每个主题有多个分区以匹配消费者的数量。然而，分区越多，TML\
  \ 解决方案的成本就越高。\n\n*   创建的算法数量可能会增加，使模型管理复杂化，并可能产生安全问题。TML 管理员应使用 AiMS 来跟踪和管理算法，并在算法未被使用时将其停用。\n\
  \n*   TML 解决方案的成本主要取决于：\n    1.  人员 – 例如数据流工程师、TML 解决方案架构师、数据流科学家、数据流可视化专家、TML 管理员、云基础设施专家以及流程与变更管理专家\n\
  \n2.  Kafka 分区 – 分区越多，成本越高\n\n3.  存储量\n\n4.  主题数量\n\n5.  网络数据吞吐量\n\nTML 解决方案与云无关、与编程语言无关、与数据库无关、与操作系统无关。它们兼容\
  \ Amazon AWS、Microsoft Azure 和 Google Cloud 上的任何托管 Kafka 服务。使用 MAADSTML Python 库，开发人员可以创建强大的\
  \ TML 解决方案，代码量少，并且能够随着无限量的数据流、消费者和生产者快速扩展。JSON 数据格式的灵活性使得不同的应用程序和设备能够轻松地消费信息，用于机器或人类的决策和可视化。它还使得通过组合不同对象和分析这些对象以进一步提取信息，从而进一步操作\
  \ JSON 对象变得容易。\n\n通过使用 Kafka、VIPER、VIPERviz 和 HPDE 的多个实例来扩展 TML 解决方案，可以构建大规模的 TML\
  \ 解决方案。即使业务需求随时间演变，TML 解决方案也可以增长（或缩减）：这就是 TML 解决方案的弹性本质。可以添加更多的数据流，创建更多的训练数据集，并生成更多的算法。虽然这种增长可能会增加组织内部的成本和复杂性，但可以使用\
  \ AiMS 来控制、跟踪和管理这些复杂性和成本。TML 解决方案的可能性几乎是无限的，但结合 AiMS，它们可以以经济高效且负责任的方式构建。\n\n脚注 1\
  \   2   3   4   5   6\n\n\n\n"
- "# 6. 事务性机器学习解决方案模板与流式可视化\n\n本章将详细讨论构建事务性机器学习（TML）解决方案所需的技术，并附有示例代码，涵盖以下内容：\n\n\
  *   预测并优化沃尔玛 11,000 家门店的客流量\n*   对 10,000 笔银行交易中的 50 个银行账户进行异常预测\n\n本章旨在为您提供实践指导，演示如何使用运行在\
  \ Google Cloud Platform 上的 Confluent Cloud，构建集成 Apache Kafka 数据流与 AutoML 的 TML 解决方案。您将理解核心库函数，以及如何通过连接\
  \ VIPER 和 Kafka Cloud 的 MAADSTML Python 库^(⁶³)调用这些函数，以执行非常先进的自动机器学习，用于预测性和规范性分析，以及使用无监督机器学习进行异常检测。\n\
  \n您将熟悉构建和优化 TML 解决方案的常见步骤。该解决方案模板是一种简单而强大的方式，可帮助您快速构建 TML 解决方案，并能根据自身需求进行定制。您无需成为编程专家；即使是初学者也能发现使用此模板构建\
  \ TML 解决方案非常容易。我们将使用 Python 作为编程语言来访问 VIPER，但由于 VIPER 可以通过 REST 调用进行访问，您可以使用任何支持\
  \ REST 的编程语言（目前大多数编程语言都支持）。在本章结束时，您将使用领先的云平台和领先的 Kafka 技术，对（大）数据流执行先进的自动机器学习，同时使用先进的流式可视化技术获取洞察。所有示例和技术都可以在\
  \ GitHub 上找到。^(⁶⁴) 下一节将概述 TML 解决方案模板及其配套技术。\n\n## TML 解决方案模板概述\n\n此模板可用于构建任何类型的\
  \ TML 解决方案，这些解决方案具有可扩展性、无摩擦性和弹性。如前所述，以下描述的所有组件（Kafka Cloud 除外）都可以从 GitHub 下载。主要模板组件如下：\n\
  \n*   **Kafka Cloud** – 需要使用 Confluent Cloud 在 Amazon、Microsoft 或 Google 基础设施上创建具有\
  \ SSL/TLS 安全性的 Kafka 集群（代理）。\n*   **MAADS-VIPER（简称 VIPER）** – 在 Linux 上运行的官方 Kafka\
  \ 源连接器和接收器连接器（也提供 Windows 和 MacOS 版本）；它将执行 TML 解决方案所需的所有功能。此 Kafka 连接器已通过 Confluent\
  \ 的验证和测试。\n*   **环境文件** – VIPER 环境文件，包含所有必要的凭证，包括令牌文件 (admin.tok) 和示例 SSL/TLS 安全证书：client.cer.pem、client.key.pem、server.cer.pem。\n\
  *   **MAADS-HPDE（简称 HPDE）** – 在 Linux 上运行并执行 TML 的 AutoML 技术（也提供 Windows 和 MacOS\
  \ 版本）。\n*   **MAADS-VIPERviz（简称 VIPERviz）** – 可视化技术，用于可视化：HPDE 产生的异常检测、预测和优化结果。AiMS\
  \ 也需要 VIPERviz。\n*   **AiMS** – 算法与洞察管理系统仪表板，用于管理 TML 解决方案。\n*   **MAADSTML Python\
  \ 库**、**Python**^(⁶⁵) **IDE** 和 **Jupyter Notebook**。\n\n如前所述，在构建 TML 解决方案时，应仔细考虑\
  \ TML 解决方案的规模及其随时间的使用方式。规模将取决于：\n\n*   数据流（主题）的数量\n*   每个数据流（主题）中的分区数量\n*   用于监督学习的训练数据集数量或用于无监督学习的对等组数量\n\
  *   生成的算法、对等组、预测、最优值和异常的数量\n*   将从主题消费的消费者数量\n*   将向主题生产的生产者数量\n*   Kafka 代理、VIPER、VIPERviz\
  \ 和 HPDE 的实例数量\n*   Kafka 集群的大小\n\n下一节将详细讨论每个模板组件。\n\n### 模板组件详情\n\n本节将详细介绍每个模板组件及其使用方法。它将为您提供运行构建\
  \ TML 解决方案所需技术的一切必要设置说明。每个组件都提供了专为快速数据和快速机器学习而构建的高级功能。这对许多读者来说可能是新知识，但本章将尽力确保您理解每个组件及其用途。在您理解这些组件之后，构建\
  \ TML 解决方案依赖于少数几个函数，如果使用得当，您将能够相对轻松地在极短时间内构建出非常庞大的解决方案。让我们开始吧。\n\n\n\n### 通过 Confluent\
  \ Cloud 使用 Kafka 云服务\n\nKafka 是一个日益流行且功能强大的流处理软件平台。^(⁶⁶) 许多主流云供应商，如亚马逊、微软和谷歌，都在其基础设施中提供\
  \ Kafka 应用服务。这使得构建**云平台无关**的 TML 解决方案变得非常容易。VIPER 兼容在亚马逊 AWS、微软 Azure、谷歌云平台 (GCP)\
  \ 或 Confluent Cloud 上运行的 Kafka。\n\n一个非常流行的选择是使用 Confluent 提供的 Kafka 托管服务，称为 Confluent\
  \ Cloud (CC)。CC 允许 TML 开发人员选择在其偏好的云供应商上运行 Kafka 实例。开发人员可以选择使用亚马逊、微软或谷歌云基础设施创建 Kafka\
  \ 集群。使用 CC 在您选择的云供应商上运行 Kafka 的优势有三点：\n\n*   已经使用亚马逊、微软或谷歌的组织可以继续使用它们，而不会对其业务造成任何中断；同时，也无需学习新技术。\n\
  \n*   对于 Kafka 的企业级设置，您将继续从亚马逊、微软或谷歌收到一份云账单——Confluent 作为您账单中的一个明细项。具体来说，每个云提供商都会有\
  \ Confluent Cloud 的市场连接器，您可以使用它将您的基础设施计费与作为服务提供商的 CC 集成。更多详情可在 Confluent 网站上找到。^(⁶⁷)\n\
  \n*   无需特殊的 Kafka 设置——CC 负责所有设置细节，使开发人员能够快速专注于构建他们的 TML 解决方案。\n\n要开始构建您的 TML 解决方案，首先需要创建一个\
  \ Kafka 集群。为此，请遵循以下步骤：\n\n![../images/510404_1_En_6_Chapter/510404_1_En_6_Fig1_HTML.jpg](img/510404_1_En_6_Fig1_HTML.jpg)\n\
  \n图 6-1\n\nKafka 集群\n\n1.  前往 Confluent 登录页面 ^(⁶⁸) – 如果您没有账户，请创建一个。如果您已有账户，请直接登录。\n\
  \n2.  Confluent 会为您提供免费的云积分。这将允许您构建和测试一个规模适中的 TML 解决方案，并熟悉 Confluent Cloud。\n\n\
  3.  登录后，创建一个 Kafka 集群，如图 6-1 所示。\n\n然后，选择基本集群设置，如图 6-2 所示。\n\n![../images/510404_1_En_6_Chapter/510404_1_En_6_Fig2_HTML.jpg](img/510404_1_En_6_Fig2_HTML.jpg)\n\
  \n图 6-2\n\nKafka 基本集群\n\n点击“开始配置”后，您将看到如图 6-3 所示的界面。在这里，您可以在亚马逊、谷歌或微软之间进行选择。您可以选择任意一家；但是，如果您的组织偏爱某个特定的云供应商，那么您应该选择该供应商。\n\
  \n![../images/510404_1_En_6_Chapter/510404_1_En_6_Fig3_HTML.jpg](img/510404_1_En_6_Fig3_HTML.jpg)\n\
  \n图 6-3\n\n基础设施选择\n\n选择好特定的云供应商后，点击“继续”。集群创建成功后，您将看到图 6-4。\n\n![../images/510404_1_En_6_Chapter/510404_1_En_6_Fig4_HTML.jpg](img/510404_1_En_6_Fig4_HTML.jpg)\n\
  \n图 6-4\n\n集群概览\n\n集群创建后，还有几个额外的步骤。为了从 VIPER 和 HPDE 访问该集群，我们需要创建一个 API 密钥。为此，请点击**创建与您的账户关联的\
  \ API 密钥**，如图 6-5 所示。\n\n![../images/510404_1_En_6_Chapter/510404_1_En_6_Fig5_HTML.jpg](img/510404_1_En_6_Fig5_HTML.jpg)\n\
