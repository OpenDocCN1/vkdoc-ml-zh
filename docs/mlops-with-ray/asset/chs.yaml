  #### whylogs


  研究表明，高质量的数据能提升模型性能。然而，现实世界中的数据不断变化，如果不对模型进行持续监控和更新，就可能导致模型性能下降。能够轻松快速地检测和监控底层数据分布的变化，对于在生产环境中维持模型性能至关重要。


  whylogs 是一个开源库，用于生成各种数据类型（包括表格数据、文本、音频、图像等）的统计摘要。该库不采用数据采样技术，而是使用数据画像技术，即使在大量日志数据中也能准确表示罕见事件和异常值。生成的统计摘要称为
  whylogs 画像，以标准格式捕获，用于表示一段时间内的数据快照。它们提供了关键统计信息的全面概览，例如值分布、不同值计数、分位数、频繁项等。此外，whylogs
  画像还允许通过用户定义的指标和元数据进行自定义。


  whylogs 画像使得监控数据质量、追踪数据集随时间的变化以及进行可视化变得非常容易。这三种用途支持多种机器学习可观测性场景，包括特征漂移或概念漂移检测、性能退化分析、模型输入或数据管道质量验证等。


  whylogs 画像在设计上明确区分了生成画像的过程和基于画像采取行动的过程，从而在数据分析或告警方面实现了灵活性和可扩展性。这些画像设计得高效、可定制且可合并，使其适用于各种有严格要求的场景，例如特征和机器学习管道。


  *   **高效**：whylogs 画像体积非常紧凑，并能高效地描述其所代表的数据集。所有统计信息均以流式方式收集，只需对数据进行单次遍历，且内存开销极低。这使得
  whylogs 画像能够随列数线性扩展，而非随数据量扩展。


  *   **可定制**：whylogs 画像提供易于配置和自定义的统计信息，例如针对不同数据类型和用例的自定义追踪器。这种灵活性对于适应多样化的指标至关重要，并支持追踪文本和图像等复杂数据类型。


  *   **可合并**：whylogs 画像可以以分布式方式生成，然后在后续步骤中合并在一起，形成代表其组成画像聚合结果的新画像。


  注意


  数据采样 vs. 数据画像


  在微服务世界中，日志记录已成为理解和监控复杂系统健康状况的标准实践。在数据领域，数据日志记录旨在实现理解和监控数据的类似目的。数据日志记录有两种方法：采样和画像。


  采样是两者中较为简单的方法，通过随机或程序化方式从较大的数据流中选择数据样本并存储以供后续分析。这种简单方法易于实现；然而，在捕获整个数据集的重要统计属性方面存在缺点，例如会遗漏罕见事件和异常值，并且无法准确估计最小值/最大值或唯一值的数量。


  画像方法则涉及数据画像^(¹⁰⁵)（也称为数据素描或统计指纹识别），以捕获给定数据集的人类可解释的统计画像，从而提供对数据的洞察。画像通过利用一系列高效的流式算法来生成可扩展、轻量级的数据集统计画像。捕获的数据画像能够准确表示罕见事件和异常值，并且直方图、均值、标准差等统计属性易于解释。


  清单 6-2 中的代码片段展示了在 Python 中生成 whylogs 画像有多么简单，假设 whylogs Python 包已安装。


  ```

  # 导入并设置数据以执行验证

  import whylogs as why

  import pandas as pd

  df = pd.read_csv("")

  # 生成画像

  data_profile = why.log(df)

  # 以 Pandas DataFrame 格式检查画像

  data_profile_view = data_profile.view()

  data_profile_df = data_profile_view.to_pandas()

  清单 6-2

  使用 whylogs Python API 生成 whylogs 画像的示例

  ```


  默认情况下，生成的 whylogs 画像的行数将等于被记录数据集中的列数。被记录数据集中每列的标准生成指标存储在生成的 whylogs 画像每行的列中。标准指标分为以下几类：计数、基数、分布、类型。有关生成指标的更多详细信息，请参阅此文档页面：[`https://whylogs.readthedocs.io/en/latest/examples/basic/Inspecting_Profiles.html`](https://whylogs.readthedocs.io/en/latest/examples/basic/Inspecting_Profiles.html)。


  为了可视化生成的 whylogs 画像的摘要和漂移报告，我们将使用提供的 `NotebookProfileVisualizer` 类。请参阅清单 6-3，了解使用此类为泰坦尼克号数据集显示这些报告的示例。


  ```

  # 导入并设置数据以执行验证

  import whylogs as why

  import pandas as pd

  titanic_df = pd.read_csv("titanic.csv")

  # 为了生成漂移摘要，根据 Survived 值将 titanic_df 分成两部分

  # titanic 画像

  titanic_profile = why.log(titantic_df)

  profile = titanic_profile.profile()

  prof_view = profile.view()

  # 参考 whylogs 画像

  cond_reference = (titanic_df[''Survived'']==0)

  titanic_reference = titanic_df.loc[cond_reference]

  # 删除 Survived 和 Name 列

  titanic_reference = titanic_reference.drop(["Survived","Name"],  axis=1)

  ref_result = why.log(pandas=titanic_reference)

  ref_prof_view = ref_result.view()

  # 目标 whylogs 画像

  cond_target = (titanic_df[''Survived'']==1)

  titanic_target = titanic_df.loc[cond_target]

  # 删除 Survived 和 Name 列

  titanic_target = titanic_target.drop(["Survived","Name"],  axis=1)

  target_result = why.log(pandas=titanic_target)

  target_prof_view = target_result.view()

  # 实例化 NotebookProfileVisualizer 以生成报告

  from whylogs.viz import NotebookProfileVisualizer

  visualization = NotebookProfileVisualizer()

  visualization.set_profiles(target_profile_view=target_prof_view, reference_profile_view=ref_prof_view)

  # 生成漂移报告

  visualization.summary_drift_report()

