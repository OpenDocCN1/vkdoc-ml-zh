  通过对数据集应用 map_batches 获取批量预测

  ```


  `map_batches` 完成后，我们可以使用 `take_all()` 查看生成的文本。值得注意的是，我们这里没有使用 `Predictor`。这是因为 Predictor
  主要用于与 `Checkpoint` 一起使用，而本示例中我们没有使用检查点。




  ### 运行在线模型服务


  我们想在这个扩展的 LLM 示例中演示的 Ray 的最后一个方面是如何服务像 GPT-J-6B 这样的模型。为此，在代码清单 8-19 中，我们需要定义一个可调用的类，它将作为
  Ray Serve 部署（`serve.deployment`）来运行。在运行时，一个部署由多个副本组成，这些副本是在独立的 Ray Actor 中启动的类或函数的单独实例。副本的数量可以根据传入的请求负载进行扩展或缩减。


  我们通过相应地设置`num_gpus`来确保部署使用一个 GPU。我们在`__init__`中加载模型，这样只需初始化一次模型，然后就可以用它来处理多个请求，从而节省时间。


  ```

  import pandas as pd

  from ray import serve

  from starlette.requests import Request

  @serve.deployment(ray_actor_options={"num_gpus": 1})

  class PredictDeployment:

  def __init__(self, model_id: str, revision: str = None):

  from transformers import AutoModelForCausalLM, AutoTokenizer

  import torch

  self.model = AutoModelForCausalLM.from_pretrained(

  model_id,

  revision=revision,

  torch_dtype=torch.float16,

  low_cpu_mem_usage=True,

  device_map="auto",  # 自动利用 Actor 可用的所有 GPU

  )

  self.tokenizer = AutoTokenizer.from_pretrained(model_id)

  def generate(self, text: str) -> pd.DataFrame:

  input_ids = self.tokenizer(text, return_tensors="pt").input_ids.to(

  self.model.device

  )

  gen_tokens = self.model.generate(

  input_ids,

  do_sample=True,

  temperature=0.9,

  max_length=100,

  )

  return pd.DataFrame(

  self.tokenizer.batch_decode(gen_tokens), columns=["responses"]

  )

  async def __call__(self, http_request: Request) -> str:

  json_request: str = await http_request.json()

  prompts = []

  for prompt in json_request:

  text = prompt["text"]

  if isinstance(text, list):

  prompts.extend(text)

  else:

  prompts.append(text)

  return self.generate(prompts)

