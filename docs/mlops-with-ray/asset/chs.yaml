  ## 使用 Ray 训练和部署大型语言模型的示例


  在这个扩展示例中，我们将展示如何使用 Ray 微调一个名为 GPT-J-6B 的语言模型。GPT-J 是一个在 Pile 数据集^(¹¹¹)上训练的语言模型，其概念源自
  OpenAI 的 GPT-2 模型。该模型有多种变体，但这个特定版本因其拥有 60 亿个参数而得名。有关 GPT-J 的更多信息，请参阅 HuggingFace
  文档。^(¹¹²) 我们将使用 Ray 及其 HuggingFace Transformers 集成，并结合 HuggingFace Hub 中的预训练模型，但可以轻松调整此示例以使用类似模型。


  请注意，此示例并非旨在您的笔记本电脑上本地运行。相反，我们试图传达一个微调和部署中型语言模型的真实场景，并在此过程中为您提供一些实际的成本和运行时考量。需要说明的是，如果您拥有一台配备现代
  GPU 的优质工作站，适当修改本示例中的扩展配置将允许您直接运行此示例，但所需时间可能会比我们在此指出的长得多。


  为了给您一个概览，我们将按照以下具体步骤开发此示例：


  *   我们讨论如何启动一个安装了所有所需 Python 库的 Ray 集群。


  *   我们加载一个相对较小的数据集来微调我们的 GPT-J-6B 模型。


  *   我们定义转换此数据集所需的自定义预处理器。


  *   我们在一个规模可观的计算机集群上扩展模型的微调。示例的这一部分基于此 Ray 示例，^(¹¹³) 您可以参考该示例以获取更深入的信息。


  *   然后，我们检查是否从训练好的模型中获得了有用的预测。


  *   接着，我们在测试集上运行离线批处理。您可以在 Ray 文档中了解更多关于这方面的信息。^(¹¹⁴)


  *   最后，我们部署模型以从端点获取预测，您也可以通过阅读此示例了解更多信息。^(¹¹⁵)


  我们预测，随着公司尝试开发针对其用例和数据可用性进行专门化的大型语言模型，此类工作流程将变得越来越普遍，因此理解此类流程的构成是值得的。深入讨论此示例也将使我们有机会比以前更全面地讨论
  Ray 及其所有库。


