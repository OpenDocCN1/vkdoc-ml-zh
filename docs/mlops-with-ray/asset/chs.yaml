  ### 本章小结


  在本章中，我们探讨了如何为 AI 工作流构建各种 Ray 高级库。你已深入理解了关键概念，这些概念使你能够构建从实验到生产的可扩展机器学习项目。我们重点介绍了使用
  Ray Datasets 进行无状态计算（如特征预处理），并演示了 Ray Train 和 Tune 如何处理有状态计算（如模型训练）。Ray 擅长在复杂的 AI
  工作负载中无缝结合这些类型的计算，并将其扩展到大型集群。使用 Ray Serve 可以轻松部署你的 Ray 机器学习项目。


  我们还向你介绍了 Ray 的生态系统，使你能够在你当前使用或计划未来使用的工具旁边运行自己的实验。此外，我们还讨论了 Ray 的局限性，并将其与各种相关系统进行了比较。我们探讨了如何利用
  Ray 与其他工具相结合来增强或构建你自己的机器学习平台。


  掌握了这些知识，你已具备充分条件来开展自己的 Ray 实验，并利用最适合你需求的工具。你可以灵活地将 Ray 与其他工具集成，并根据需要扩展你的机器学习能力。


