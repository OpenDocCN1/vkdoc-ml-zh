  run` CLI 命令。在这种情况下，你需要从代码清单 8-20 中移除`serve.run(deployment)`这一行，然后通过在命令行中调用`serve
  run <filename>:deployment`来启动部署。


  ```

  deployment = PredictDeployment.bind(

  model_id=model_id, revision=revision

  )

  serve.run(deployment)

