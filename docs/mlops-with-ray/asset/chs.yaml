  ### 调优器与检查点


  Ray 中的调优器利用 Ray Tune 提供可扩展的超参数调优。它们能与训练器无缝协作，同时也支持您可能拥有的任何训练函数。当您运行训练器或调优器时，它们会生成特定于框架的检查点。这些检查点可用于为各种
  Ray 库（如 Tune、Train 或 Serve）加载模型。您可以通过访问训练器或调优器上 `.fit()` 调用的结果来获取检查点，正如我们将在下一个代码示例中看到的那样。


  检查点非常有用，因为它们充当了 Ray 的原生模型交换格式。它们允许您在后续阶段轻松检索训练好的模型，而无需担心用于存储和加载模型的自定义方法。图 8-5 展示了调优器如何与训练器交互以生成检查点。


  ![](img/600729_1_En_8_Fig5_HTML.jpg)


  该图从调优器域开始，包含训练器、参数空间和运行配置，然后是试验，最后以检查点结束。


  图 8-5


  Ray 调优器在一组工作节点上调整 Ray 训练器的超参数，同时也会为您生成检查点


  为了说明如何在 Python 中运行调优器，为简单起见，我们再次使用 XGBoostTrainer，但这次在参数中使用稍微复杂一些的设置，并使用更大的数据集进行操作。除了训练器实例之外，我们在清单
  8-3 中的调优器还接受一个 `param_space` 参数来告知调优器要调整哪些超参数，以及一个 `run_config` 参数来告知调优器如何调整训练实验。


  ```

  from sklearn.datasets import load_breast_cancer

  from ray import tune

  from ray.data import from_pandas

  from ray.train import RunConfig, ScalingConfig

  from ray.train.xgboost import XGBoostTrainer

  from ray.tune.tuner import Tuner

  def get_dataset():

  data_raw = load_breast_cancer(as_frame=True)

  dataset_df = data_raw["data"]

  dataset_df["target"] = data_raw["target"]

  dataset = from_pandas(dataset_df)

  return dataset

  trainer = XGBoostTrainer(

  label_column="target",

  params={},

  datasets={"train": get_dataset()},

  )

  param_space = {

  "scaling_config": ScalingConfig(

  num_workers=tune.grid_search([2, 4]),

  resources_per_worker={

  "CPU": tune.grid_search([1, 2]),

  },

  ),

  "params": {

  "objective": "binary:logistic",

  "tree_method": "approx",

  "eval_metric": ["logloss", "error"],

  "eta": tune.loguniform(1e-4, 1e-1),

  "subsample": tune.uniform(0.5, 1.0),

  "max_depth": tune.randint(1, 9),

  },

  }

  tuner = Tuner(trainable=trainer, param_space=param_space,

  run_config=RunConfig(name="my_tune_run"))

  # 运行调优任务并获取检查点

  result = tuner.fit()

  checkpoint = result.checkpoint

