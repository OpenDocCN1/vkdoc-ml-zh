  ```


  ### 运行批量预测


  批量推理是指对一组输入数据生成模型预测。该模型通常是一个复杂的机器学习模型，例如神经网络，但也可能只是一个简单的 Python 函数。在批量推理（也称为离线推理）中，您的模型会按需对大批量数据运行。这与在线推理形成对比，在线推理中，模型会在数据点可用时立即对其进行预测。


  在 Ray 中运行批量推理概念上很简单，需要三个步骤。首先，加载数据并应用所需的任何预处理。然后，定义您的模型以及将模型应用于数据的转换。最后，只需使用 Ray
  Data 的 `map_batches` 将转换应用于您的数据。图 8-6 示意性地说明了此过程。


  ![](img/600729_1_En_8_Fig6_HTML.jpg)


  该图从数据批次开始，然后映射到一个机器学习模型，最后以预测结束。


  图 8-6


  在批量推理中，数据批次被映射到模型上以按需获取预测


  让我们通过从 HuggingFace 加载一个简单的 GPT-2 模型，在清单 8-4 中用它定义一个预测器类，来快速说明此过程。我们创建合成文本数据，并使用
  Ray Data 的 `from_numpy` 辅助函数将其加载到 Ray 数据集中。最后，我们使用 `map_batches` 来获取预测。请注意我们如何使用所谓的
  `ActorPoolStrategy` 将此批量推理任务扩展到任意多的资源。


  ```

  from typing import Dict

  import numpy as np

  import ray

  # 步骤 1：从内存中的 Numpy 数组创建 Ray 数据集。

  ds = ray.data.from_numpy(np.asarray(["Complete this", "for me"]))

  # 步骤 2：定义用于推理的预测器类。

  class HuggingFacePredictor:

  def __init__(self):

  from transformers import pipeline

  # 初始化一个预训练的 GPT2 Huggingface 管道。

  self.model = pipeline("text-generation", model="gpt2")

  # 对一批数据进行推理的逻辑。

  def __call__(self, batch: Dict[str, np.ndarray]):

  # 从输入批次获取预测。

  predictions = self.model(

  list(batch["data"]), max_length=20, num_return_sequences=1

  )

  batch["output"] = [

  sequences[0]["generated_text"] for sequences in predictions

  ]

  return batch

  # 使用 2 个并行 actor 进行推理。每个 actor 对数据的不同分区进行预测。

  scale = ray.data.ActorPoolStrategy(size=2)

  # 步骤 3：将预测器映射到数据集上以获取预测。

  predictions = ds.map_batches(HuggingFacePredictor, compute=scale)

  # 步骤 4：显示一个预测输出。

  predictions.show(limit=1)

  清单 8-4

  在 HuggingFace Transformer 模型上运行简单的批量预测任务

  ```


  ### 在线服务部署


  您无需“离线”使用批量预测并直接与相关模型交互，而是可以利用 Ray Serve 部署一个可以通过 HTTP/S 查询的推理服务。使用 Ray Serve 提供模型服务的核心抽象是
  `Deployment`。


  为了演示 `Deployment` 的实际应用，让我们在清单 8-5 中使用一个来自 HuggingFace 的简单模型（该模型将英语翻译成法语），并使用 Ray
  Serve 的 `@serve.deployment` 装饰器使其成为一个 `Deployment`。


  ```

  # 文件名：serve_quickstart.py

  from starlette.requests import Request

  import ray

  from ray import serve

  from transformers import pipeline

  @serve.deployment(num_replicas=2, ray_actor_options={"num_cpus": 0.2, "num_gpus":
  0})

  class Translator:

  def __init__(self):

  # 加载模型

  self.model = pipeline("translation_en_to_fr", model="t5-small")

  def translate(self, text: str) -> str:

  # 运行推理

  model_output = self.model(text)

  # 后处理输出，仅返回翻译文本

  translation = model_output[0]["translation_text"]

  return translation

  async def __call__(self, http_request: Request) -> str:

  english_text: str = await http_request.json()

  return self.translate(english_text)

  translator_app = Translator.bind()

  清单 8-5

  使用 HuggingFace 翻译模型运行 Ray Serve 应用程序

  ```


  您可以通过调用命令 `serve run serve_quickstart:translator_app` 来运行此示例，该命令会将模型托管在 `http://127.0.0.1:8000/`
  上。要测试模型，只需在另一个终端窗口中执行清单 8-6 中的 Python 脚本即可。


  ```

  import requests

  english_text = "Hello world!"

  response = requests.post("http://127.0.0.1:8000/", json=english_text)

  french_text = response.text

  print(french_text)

