  上述 ML 监控系统包含三个主要组件：日志记录、快照存储和监控仪表盘。


  *   **日志记录**：使用 Evidently Python 库定期捕获数据或 ML 模型质量的摘要，并以 JSON 快照形式生成。

  *   **快照存储**：以仪表盘服务可访问的方式集中存储和组织捕获的 JSON 快照。

  *   **监控仪表盘**：使用 Evidently 监控服务解析快照，并在交互式图表中可视化捕获的指标或测试结果。


  Evidently ML 监控组件为那些希望利用 ML 可观测性开源解决方案逐步构建其 ML 可观测性基础设施的组织提供了一个基本蓝图。该组件仍在开发和完善中。有关最新的详细信息和进展，请访问其文档页面：[`https://docs.evidentlyai.com/user-guide/monitoring/monitoring_overview`](https://docs.evidentlyai.com/user-guide/monitoring/monitoring_overview)。


  本节重点介绍的三个开源解决方案的一个关键且共同的特点是，它们都被归类为供应商支持的开源软件。每个方案都由一家商业公司支持，提供路线图、稳定性和客户支持等优势，并且通常附带一个具有额外功能的基于云的商业版本。


  ## 总结


  ML 可观测性在确保 ML 模型部署到生产环境后性能保持在预期水平方面发挥着关键作用。模型性能下降可能因数据漂移或模型漂移等各种原因随时间逐渐发生。这些下降可能对业务产生显著的负面影响，影响范围从货币价值到用户体验和公司声誉。


  ML 可观测性基础设施是 ML 基础设施的关键支柱。它旨在检测、监控、告警和诊断模型性能问题。该基础设施的核心组件是可观测性存储。它旨在捕获 ML 开发过程各阶段（包括特征工程、模型训练、模型评估和模型预测）产生的各种模型相关数据。这些多样化的数据使得可观测性存储独特且有价值，并能满足
  ML 可观测性的需求：快速发现模型性能问题并缩短解决这些问题的时间。ML 可观测性基础设施所需的其他组件包括数据和指标摄取与计算、告警与通知以及交互式可视化。如图
  6-15 所示的 AI/ML 解决方案监控金字塔^(¹⁰⁶)，说明了最终支持 ML 可观测性所需的多种监控类型。


  ![](img/600729_1_En_6_Fig15_HTML.jpg)


  一个金字塔图，从上到下分为 5 个部分，分别标注为：AI/ML 可观测性、AI/ML 监控、数据监控、应用监控和基础设施监控。


