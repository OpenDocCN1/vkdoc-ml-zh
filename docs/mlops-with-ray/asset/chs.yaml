  AI/ML 解决方案监控金字塔


  ML 可观测性需要支持的主要部分包括特征验证、模型预测监控、特征和预测异常检测以及数据和模型漂移检测。诸如 Great Expectations、whylogs
  和 Evidently 等开源解决方案可供组织利用并整合到其 ML 可观测性基础设施中，以解决其中一些关键方面。


  三年前，组织别无选择，只能从零开始构建自己的 ML 可观测性基础设施。如今，大约有二十多家公司提供其供应商解决方案。^(¹⁰⁷) 这些解决方案已经成熟，变得更加复杂，并且在某种程度上已经商品化。与这些供应商解决方案的集成也变得越来越简单。除非组织有非常特殊的
  ML 可观测性需求，或者其运营规模超出了这些供应商解决方案的支持能力，否则将供应商解决方案评估作为“构建与购买”策略的一部分是明智之举。


