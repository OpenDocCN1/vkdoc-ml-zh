  ### 训练器


  一旦您定义了 Ray 数据集，就可以继续使用 Ray Train 来指定一个训练器。训练器负责在您的数据上运行机器学习算法。它为 TensorFlow、PyTorch
  或 HuggingFace 等训练框架提供了一致的接口。在下一节的示例中，我们将重点介绍 HuggingFace Transformers，但需要注意的是，其他框架集成使用
  Ray Train API 的方式是相同的。


  本质上，Ray 训练器在数据集上提供可扩展的机器学习训练。此外，它们被设计为与 Ray Tune 良好集成以进行超参数优化，我们将在下一节讨论这一点。图 8-4
  向您展示了训练器的工作原理。除了提供数据集之外，您还需要在调用训练器的 `fit` 方法之前提供一个 `ScalingConfig`，这将为您创建分布式训练过程。


  ![](img/600729_1_En_8_Fig4_HTML.jpg)


  训练器工作的结构。Ray 训练器域由 Ray 数据集和缩放配置组成，它们与训练域相连。训练域由四个工作节点组成。


  图 8-4


