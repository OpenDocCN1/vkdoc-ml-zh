  ### 微调语言模型


  现在，我们可以配置 Ray 的 `TorchTrainer` 来对 GPT-J-6B 模型执行分布式微调。为此，我们需要指定一个 `trainer_init_per_worker`
  函数，该函数会创建一个 HuggingFace Transformers `Trainer`。这个 `Trainer` 将由 Ray 在底层使用 PyTorch
  Distributed^(¹²⁰) 的分布式数据并行^(¹¹⁹)（DDP）进行分发。这意味着每个工作进程都拥有模型的独立副本，但处理不同的数据。在每个步骤结束时，所有工作进程将同步模型更新。


  GPT-J-6B 是一个相对较大的模型，无法在显存低于 16 GB 的 GPU 上运行。为了解决这个问题，我们可以使用 DeepSpeed，^(¹²¹) 这是一个用于优化训练过程的库，允许我们卸载和分区训练状态，从而降低总体显存使用量。此外，DeepSpeed
  ZeRO-3^(¹²²) 允许我们加载大型模型而不会耗尽内存。


  HuggingFace Transformers 与 Ray 的集成（`TransformersTrainer`）使您能够轻松配置和使用 DDP 与 DeepSpeed。您只需在
  `TrainingArguments` 对象中指定一个 `deepspeed` 配置参数即可。^(¹²³)


  清单 8-13 中用于定义 `Trainer` 的代码乍看之下可能长得吓人，但仔细看，你会发现我们定义 `trainer_init_per_worker` 的方式相对简单：


  *   我们首先定义一些训练超参数，例如 `batch_size`。

  *   然后，我们设置一个 DeepSpeed 配置，这部分占用了大量篇幅。首次阅读时可以跳过此部分。

  *   接下来，我们设置 `TrainingArguments`，稍后将其传入我们的 Trainer。

  *   然后，我们从 HuggingFace 加载 GPT-J 模型，以及用于预处理的 tokenizer。

  *   最后，我们构建并返回 `Trainer` 对象。


  ```

  import evaluate

  import torch

  from transformers import (

  Trainer,

  TrainingArguments,

  GPTJForCausalLM,

  AutoTokenizer,

  default_data_collator,

  )

  from transformers.utils.logging import disable_progress_bar, enable_progress_bar

  from ray import train

  from ray.train.huggingface.transformers import (

  prepare_trainer,

  RayTrainReportCallback

  )

  def trainer_init_per_worker(

  train_dataset, eval_dataset=None,

  **config):

  os.environ["OMP_NUM_THREADS"] = str(

  train.get_context().get_trial_resources().bundles[-1].get("CPU", 1)

  )

  # 启用 tf32 以获得更好的性能

  torch.backends.cuda.matmul.allow_tf32 = True

  batch_size = config.get("batch_size", 4)

  epochs = config.get("epochs", 2)

  warmup_steps = config.get("warmup_steps", 0)

  learning_rate = config.get("learning_rate", 0.00002)

  weight_decay = config.get("weight_decay", 0.01)

  steps_per_epoch = config.get("steps_per_epoch")

  # 步骤 2：定义 deepspeed 配置

  deepspeed = {

  "fp16": {

  "enabled": "auto",

  "initial_scale_power": 8,

  },

  "bf16": {"enabled": "auto"},

  "optimizer": {

  "type": "AdamW",

  "params": {

  "lr": "auto",

  "betas": "auto",

  "eps": "auto",

  },

  },

  "zero_optimization": {

  "stage": 3,

  "offload_optimizer": {

  "device": "cpu",

  "pin_memory": True,

  },

  "offload_param": {

  "device": "cpu",

  "pin_memory": True,

  },

  "overlap_comm": True,

  "contiguous_gradients": True,

  "reduce_bucket_size": "auto",

  "stage3_prefetch_bucket_size": "auto",

  "stage3_param_persistence_threshold": "auto",

  "gather_16bit_weights_on_model_save": True,

  "round_robin_gradients": True,

  },

  "gradient_accumulation_steps": "auto",

  "gradient_clipping": "auto",

  "steps_per_print": 10,

  "train_batch_size": "auto",

  "train_micro_batch_size_per_gpu": "auto",

  "wall_clock_breakdown": False,

  }

  # 步骤 3：设置训练参数

  training_args = TrainingArguments(

  "output",

  logging_steps=1,

  save_strategy="steps",

  save_steps=steps_per_epoch,

  max_steps=steps_per_epoch * epochs,

  learning_rate=learning_rate,

  weight_decay=weight_decay,

  warmup_steps=warmup_steps,

  label_names=["input_ids", "attention_mask"],

  push_to_hub=False,

  report_to="none",

  disable_tqdm=True,  # 精简输出

  fp16=True,

  gradient_checkpointing=True,

  deepspeed=deepspeed,

  )

  disable_progress_bar()

  # 步骤 4：加载模型和预处理器

  tokenizer = AutoTokenizer.from_pretrained(model_name)

  tokenizer.pad_token = tokenizer.eos_token

  print("正在加载模型")

  model = GPTJForCausalLM.from_pretrained(

  model_name, use_cache=False

  )

  model.resize_token_embeddings(len(tokenizer))

  print("模型加载完成")

  enable_progress_bar()

  metric = evaluate.load("accuracy")

  train_ds = train.get_dataset_shard("train")

  eval_ds = train.get_dataset_shard("validation")

  train_ds_iterable = train_ds.iter_torch_batches(

  batch_size=batch_size

  )

  eval_ds_iterable = eval_ds.iter_torch_batches(

  batch_size=batch_size

  )

  def compute_metrics(eval_pred):

  logits, labels = eval_pred

  predictions = np.argmax(logits, axis=-1)

  return metric.compute(

  predictions=predictions, references=labels

  )

  # 步骤 5：创建并训练一个 Trainer

  trainer = Trainer(

  model=model,

  args=training_args,

  train_dataset=train_ds_iterable,

  eval_dataset=eval_ds_iterable,

  compute_metrics=compute_metrics,

  tokenizer=tokenizer,

  data_collator=default_data_collator,

  )

  # 添加回调以向 Ray Train 报告检查点

  trainer.add_callback(RayTrainReportCallback())

  trainer = prepare_trainer(trainer)

  trainer.train()

  清单 8-13

  使用 DeepSpeed 配置定义 HuggingFace Transformers Trainer

  ```


  完成 `trainer_init_per_worker` 后，我们现在可以在清单 8-14 中实例化 Ray 的 `TorchTrainer`。我们设置了 `scaling_config`
  来控制工作进程数量和资源使用，以及用于训练和评估的 `datasets`。我们还传入了之前定义的 `splitter` 和 `tokenizer` 预处理器，它们被包装在一个
  `Chain` 中作为参数。这些链式预处理器将包含在返回的 `Checkpoint` 中，这意味着在推理期间也会应用它们。然后，我们调用 `TorchTrainer.fit`
  方法开始使用 Ray 进行训练。之后，我们将 `Result` 对象保存到一个变量中，以便访问指标和检查点。最后，我们使用返回的 `Result` 对象来访问指标和与最后一次迭代关联的
  Ray `Checkpoint`。


  ```

  from ray.train.torch import TorchTrainer

  from ray.train import RunConfig, ScalingConfig

  batch_size = 16

  train_ds_size = processed_datasets["train"].count()

  steps_per_epoch = train_ds_size // (batch_size * num_workers)

  trainer = TorchTrainer(

  train_loop_per_worker=train_func,

  train_loop_config={

  "epochs": 1,

  "batch_size": batch_size,  # 每个设备

  "steps_per_epoch": steps_per_epoch

  },

  scaling_config=ScalingConfig(

  num_workers=num_workers,

  use_gpu=use_gpu,

  resources_per_worker={"GPU": 1, "CPU": cpus_per_worker},

  ),

  datasets=processed_datasets,

  run_config=RunConfig(storage_path=storage_path),

  )

  trainer.fit()

  checkpoint = results.checkpoint

  checkpoint

