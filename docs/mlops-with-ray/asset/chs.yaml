  ### Ray 与相关系统的比较


  现在您已经对 Ray 及其库有了更深入的了解，本节将适时地比较 Ray 与同类系统所提供的功能。Ray 的生态系统是多方面的，可以从不同角度审视，并用于不同目的。这意味着
  Ray 的许多方面都可以与市场上其他工具进行比较。我们还将讨论如何将 Ray 集成到现有机器学习平台的复杂工作流中。


  我们之前尚未将 Ray 与其他系统进行直接比较。鉴于 Ray 的灵活性及其众多组件，它可以与更广泛的机器学习生态系统中的不同类型工具进行比较。让我们首先将 Ray
  与更明显的候选者进行比较，特别是基于 Python 的集群计算框架。


  ### 分布式 Python 框架


  在提供全面 Python 支持且不绑定特定云平台的分布式计算框架中，主要的竞争者是 Dask、Spark 和 Ray。尽管这些框架在技术和性能上存在一些取决于具体场景的差异，但根据您打算运行的工作负载类型进行比较是最有用的。表
  8-6 概述了最常见工作负载类型的比较。


  表 8-6


  分布式 Python 工作负载


  | 工作负载类型 | Dask | Spark | Ray |

  | --- | --- | --- | --- |

  | 深度学习 | 支持，非一等公民 | 支持，非一等公民 | 一等公民支持 |

  | 结构化数据处理 | 一等公民支持 | 一等公民支持 | 支持，非一等公民 |

  | 底层并行 | 使用任务的一等公民支持 | 无 | 使用任务和 Actor 的一等公民支持 |


  ### Ray AI 库与更广泛的 ML 生态系统


  Ray 主要专注于 AI 计算，特别是通过 Ray Train 提供分布式训练能力。然而，它并不旨在覆盖 AI 工作负载的每个方面。相反，Ray 与 ML 实验的跟踪和监控工具以及数据存储解决方案集成，而不是提供自己的原生解决方案。


  另一方面，在某些特定类别的工具中，Ray 可以被视为一种替代方案。例如，存在像 TorchX 或 TFX 这样的框架特定工具包，它们与其各自的框架紧密集成。相比之下，Ray
  是框架无关的，避免了供应商锁定，并提供了类似的工具。


  同样值得一提的是 Ray 与特定云服务的比较。一些主要的云服务提供全面的工具包，用于在 Python 中处理 ML 工作负载。一个显著的例子是 AWS SageMaker，它提供了一个与
  AWS 生态系统良好集成的全能型软件包。Ray 的目标不是取代像 SageMaker 这样的工具。相反，它为训练、评估和服务等计算密集型组件提供了替代方案。


  Ray 也可以作为 KubeFlow 或 Flyte 等 ML 工作流框架的可行替代方案。与许多基于容器的解决方案不同，Ray 提供了易于使用的 Python
  API 和对分布式数据的原生支持。


  在某些情况下，使用 Ray 可能不是一个直接的决定，它可以在 ML 生态系统中被视为或用作替代方案和补充组件。例如，作为开源系统，Ray 可以在像 SageMaker
  这样的托管 ML 平台中使用，或者您可以使用它们构建自己的 ML 平台。此外，虽然 Ray 可能并不总是直接与像 Spark 或 Dask 这样的专用大数据处理系统竞争，但
  Ray Datasets 通常可以满足您的处理需求。


  正如我们之前提到的，Ray 的设计理念围绕在单个脚本中表达 ML 工作负载，并将其作为统一的分布式系统在 Ray 上执行。由于 Ray 自动处理集群上的任务放置和执行，通常不需要显式的编排或与其他分布式系统的复杂集成。然而，需要注意的是，这种理念应该灵活地解释。有时，多个系统是必要的，或者任务需要被划分到不同的阶段。在这种情况下，像
  Argo 或 AirFlow 这样的专用工作流编排工具在与 Ray 结合使用时非常有价值。例如，您可能会选择将 Ray 作为 Lightning MLOps^(¹²⁷)
  框架中的一个步骤。


  ### 如何将 Ray 集成到您的 ML 平台


  要构建您自己的 ML 平台并将 Ray 与其他生态系统组件集成，您系统的核心将包含一组 Ray 集群，每个集群处理不同的任务。例如，一个集群可以处理预处理、训练
  PyTorch 模型和运行推理，而另一个集群可以专注于批量推理和模型服务。为了满足您的扩展需求，您可以利用 Ray Autoscaler 并使用 KubeRay
  将整个系统部署在 Kubernetes 上。此外，您可以根据需要添加其他组件来增强这个核心系统，例如：


  *   包含其他计算步骤，例如用于数据密集型预处理任务的 Spark。

  *   使用工作流编排器（如 AirFlow、Oozie 或 SageMaker Pipelines）来调度和创建您的 Ray 集群，以及运行 Ray 应用和服务。每个
  Ray 应用都可以是更大编排工作流的一部分，与 Spark ETL 作业等其他组件连接。

  *   创建用于交互式使用的 Ray 集群，配合 Jupyter notebook，这些 notebook 可以托管在 Google Colab 或 Databricks
  Notebooks 等平台上。

  *   与特征存储（如 Feast 或 Tecton）集成，因为 Ray Train、Datasets 和 Serve 提供了与这些工具的集成。

  *   通过将 Ray Train 和 Tune 与 MLflow 和 Weights & Biases 等平台集成，利用实验跟踪和指标存储。

  *   从外部存储解决方案（如 S3）存储和检索数据及模型，如图所示。


  通过将 Ray 与这些附加组件结合，您可以构建一个满足特定需求的全面 ML 平台，如图 8-8 所示。


