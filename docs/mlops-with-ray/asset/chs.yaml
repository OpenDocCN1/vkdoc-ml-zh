  在下面的代码示例中，我们使用 Ray 的 XGBoost 集成，并定义一个 `XGBoostTrainer` 来在合成的表格数据上训练一个简单模型。对于这种特定类型的训练器，我们还需要定义一个
  `label_column`。我们还通过向 代码清单 8-2 中 `XGBoostTrainer` 构造函数的 `params` 参数传递一个字典，来确保指定了学习
  `objective`。请注意，`datasets` 参数必须包含一个 `"train"` 键，但您也可以额外传入像 `"validation"`、`"test"`
  或自定义数据集这样的键。


