  请注意，我们将此数据集拆分为 `train` 和 `validation` 两个拆分。在每个拆分中，数据表示为单个字符串，因此我们需要进行一些预处理以使其可用于训练。为了继续，让我们先在清单
  8-11 中定义两个辅助函数，即：


  *   `split_text`：这将把单个字符串拆分为单独的行，删除空行和以 '':'' 结尾的角色名称（例如 `ROMEO:`）。

  *   `tokenize`：这将使用与模型关联的 HuggingFace Tokenizer 对行进行分词，通过适当的填充和截断确保每个条目具有相同的长度（`512`）。这是训练所必需的。


  ```

  from transformers import AutoTokenizer

  def split_text(batch: pd.DataFrame) -> pd.DataFrame:

  text = list(batch["text"])

  flat_text = "".join(text)

  split_text = [

  x.strip()

  for x in flat_text.split("\n")

  if x.strip() and not x.strip()[-1] == ":"

  ]

  return pd.DataFrame(split_text, columns=["text"])

  def tokenize(batch: pd.DataFrame) -> dict:

  tokenizer = AutoTokenizer.from_pretrained(model_name, use_fast=False)

  tokenizer.pad_token = tokenizer.eos_token

  ret = tokenizer(

  list(batch["text"]),

  truncation=True,

  max_length=512,

  padding="max_length",

  return_tensors="np",

  )

  ret["labels"] = ret["input_ids"].copy()

  return dict(ret)

  清单 8-11

