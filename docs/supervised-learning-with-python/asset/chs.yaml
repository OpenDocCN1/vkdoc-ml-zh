  \n```\ny_pred = rf_model.predict(X_test)\nprint(confusion_matrix(y_test, y_pred))\n\
  ax= plt.subplot()\nax.set_ylim(2.0, 0)\nannot_kws = {\"ha\": 'left',\"va\": 'top'}\n\
  sns.heatmap(mat_test, annot=True, ax = ax, fmt= 'g',annot_kws=annot_kws); #annot=True\
  \ to annotate cells\nax.set_xlabel('Predicted labels');\nax.set_ylabel('True labels');\n\
  ax.set_title('Confusion Matrix');\nax.xaxis.set_ticklabels(['Not Approved', 'Approved']);\n\
  ax.yaxis.set_ticklabels(['Not Approved', 'Approved']);\n```\n\n以上就是决策树算法和基于集成学习的随机森林算法的实现。基于树的算法非常易于理解和实现。它们通常是我们实现并测试系统准确性的首批算法之一。如果我们想快速创建一个解决方案，推荐使用基于树的方案，但它们容易过拟合。我们可以使用树剪枝或对树的大小设置约束来克服过拟合。我们将在第\
  \ 5 章再次讨论这个概念，届时我们将讨论所有克服机器学习模型中过拟合问题的技术。\n\n\n\n至此，我们关于基于树的算法的讨论就告一段落了。在本章中，我们学习了分类算法并对其进行了实现。这些算法在业界非常流行，并且功能强大，足以帮助我们构建稳健的机器学习模型。通常，我们会在开始时用这些算法测试数据，然后选择能给出最佳结果的那个。接着，我们会进一步调优，直到获得最理想的输出。最理想的输出可能*不是*最复杂的解决方案，但必定是能够提供所需水平的衡量参数、可复现性、稳健性、灵活性和易于部署的方案。请记住，复杂度与准确性*并不*成正比。更复杂的模型并*不*意味着更高的性能！\n\
  \n## 总结\n\n预测是我们手中强大的工具。利用这些机器学习算法，我们不仅能做出自信的决策，还能确定影响该决策的因素。这些算法广泛应用于银行、零售、制造、保险、航空等领域。其用途包括欺诈检测、质量检验、客户流失预测、贷款违约预测等等。\n\
  \n你应该注意，这些算法并非知识的唯一来源。良好的探索性分析是优秀机器学习算法的先决条件。而最重要的资源是“数据”本身。一个高质量且具有代表性的数据集至关重要。我们在第\
  \ 1 章中讨论了优质数据集应具备的特性。\n\n同样至关重要的是，从一开始就要构建一个合理的业务问题。目标变量的选择应与手头的业务问题保持一致。用于训练算法的训练数据起着非常关键的作用，因为算法学习的模式依赖于它。需要注意的是，我们确实会使用各种参数（如精确率、召回率、AUC、F1\
  \ 分数等）来衡量算法的性能。一个在训练集、测试集和验证集上表现良好的算法将是最佳算法。但即便如此，我们还会基于其他一些参数来选择最终可以部署到生产环境中的算法，这些内容我们将在第\
  \ 5 章中讨论。\n\n在第 1 章中，我们探讨了机器学习、其各种类型、数据及数据质量的属性，以及机器学习流程。在第 2 章中，我们学习了用于对连续变量建模的机器学习算法。在这第三章中，我们通过分类算法补充了知识。这些前几章的内容为你解决数据科学领域中的大多数业务问题奠定了坚实的基础。同时，你现在也已经准备好进入第\
  \ 4 章，迈出下一步。\n\n在前三章中，我们讨论了基础及中级算法。在下一章中，我们将涵盖更复杂的算法，如支持向量机、梯度提升以及用于回归和分类问题的神经网络。所以请保持专注！\n\
