  \n```\nimport seaborn as sns\nsns.pairplot(credit_df, hue=\"Loan_Status\", palette=\"\
  husl\")\n```\n\n注意\n\n如果测试准确率与训练准确率不相似且显著较低，则意味着模型过拟合。我们将在第 5 章中学习如何处理这个问题。\n\n\
  逻辑回归通常是我们在处理分类问题时最先使用的算法之一。它速度快、易于理解，并且能够简洁地处理分类数据和连续数据。因此，它非常流行。它还可以用于获取问题中的显著变量。\n\
  \n现在我们已经详细研究了逻辑回归，接下来让我们转向第二个非常重要的分类器：朴素贝叶斯。不要被“朴素”这个词误导；这个算法在分类方面相当稳健！\n\n## 朴素贝叶斯分类\n\
  \n设想一下：你正在计划一次露营。这次旅行将取决于几个因素，比如天气如何、是否有降雨预报、你是否请到了假、你的朋友们是否来，等等。你拥有历史数据，可以预测你是否会去露营，如表\
  \ 3-2 所示。\n\n表 3-2\n\n计划露营时需考虑的因素\n\n| 是否休假 | 天气 | 朋友是否来 | 湿度 | 是否去露营 |\n| --- |\
  \ --- | --- | --- | --- |\n| 是 | 下雨 | 否 | 高 | 是 |\n| 否 | 晴天 | 是 | 低 | 是 |\n| 是 |\
  \ 阴天 | 否 | 低 | 否 |\n| 是 | 下雨 | 否 | 高 | 是 |\n| 是 | 晴天 | 是 | 低 | 是 |\n| 是 | 下雨 | 是\
  \ | 高 | 是 |\n| 否 | 晴天 | 否 | 高 | 否 |\n| 否 | 阴天 | 是 | 低 | 是 |\n\n如表所示，是否去露营的最终决定取决于其他事件的结果。这引出了*条件概率*的概念。我们首先讨论几个与概率相关的关键点，以帮助更好地理解：\n\
  \n1.  如果 A 是任意事件，那么 A 的补事件，记作 Â，表示 A 不发生的事件。\n2.  事件 A 的概率用 P(A) 表示，其补事件的概率 P(![$$\
  \ \\hat{\\mathrm{A}} $$](img/499122_1_En_3_Chapter_TeX_IEq4.png)) = 1 – P(A)。\n\
  3.  设 A 和 B 为任意事件，其概率分别为 P(A) 和 P(B)。如果已知 B 已发生，那么 A 的概率可能会改变。如前面的例子，如果天气下雨，那么露营的概率就会改变。A\
  \ 的这个新概率称为给定 B 条件下 A 的*条件概率*，可以写作 P(A|B)。\n4.  数学上，![$$ \\mathrm{P}\\left(\\mathrm{A}|\\\
  mathrm{B}\\right)=\\frac{\\mathrm{P}\\left(\\mathrm{A}\\kern0.5em \\mathrm{and}\\\
  kern0.5em \\mathrm{B}\\right)}{\\mathrm{P}\\left(\\mathrm{B}\\right)} $$](img/499122_1_En_3_Chapter_TeX_IEq5.png)，其中\
  \ P(A|B) 表示给定 B 条件下 A 的概率，即已知 B 已发生时 A 的概率。\n5.  这种关系可以看作是*概率性*依赖，称为*条件*概率。这意味着在评估另一个事件的概率时，了解一个事件是重要的。\n\
  6.  如果两个事件相互独立，那么乘法规则简化为 P(A and B) = P(A)P(B)。例如，牛奶的价格不会对你的露营计划产生影响。\n\n有许多事件是相互依赖的，因此理解\
  \ P(A|B) 和 P(B|A) 之间的关系变得至关重要。在商业活动中也是如此，销售额取决于到店顾客的数量，顾客是否会再次购物取决于之前的体验，等等。贝叶斯定理有助于对这些因素进行建模并做出预测。\n\
  \n根据*贝叶斯规则*，如果我们有两个事件 A 和 B。那么给定 B 条件下 A 的条件概率可以表示为\n\n![$$ \\mathrm{P}\\left(\\\
  mathrm{A}\\left|\\mathrm{B}\\right.\\right)=\\mathrm{P}\\left(\\mathrm{B}\\left|\\\
  mathrm{A}\\right.\\right)\\times \\mathrm{P}\\left(\\mathrm{A}\\right)\\hbox{-}\
  \ \\hbox{-} \\mathrm{P}\\left(\\mathrm{B}\\right) $$](img/499122_1_En_3_Chapter_TeX_Equ11.png)\n\
  \n（公式 3-11）\n\n其中 P(A) 和 P(B) 分别是 A 和 B 的概率，P(A|B) 是给定 B 条件下 A 的概率，P(B|A) 是给定 A\
  \ 条件下 B 的概率。\n\n例如，如果我们想知道一名患有糖尿病的患者患心脏病的概率。我们拥有的数据如下：进入诊所的患者中有 10% 患有心脏病，而 5% 的患者患有糖尿病。在确诊心脏病的患者中，8%\
  \ 患有糖尿病。那么 P(A) = 0.10，P(B) = 0.05，P(B|A) = 0.08。根据贝叶斯规则，P(A|B) = (0.08×0.1)/0.05\
  \ = 0.16。\n\n\n\n如果我们对规则进行泛化，令 A[1] 到 A[n] 为一组互斥的结果。事件 A 的概率为 P(A[1]) 到 P(A[n])。这些被称为*先验*概率。由于信息结果可能会影响我们对任何\
  \ A[i] 概率的思考，我们需要为每个结果 A[i] 找到条件概率 P(A[i]|B)。这被称为 A[i] 的*后验*概率。\n\n利用贝叶斯法则，我们可以说：\n\
  \n![$$ \\mathrm{P}\\left({\\mathrm{A}}_{\\mathrm{i}}\\left|\\mathrm{B}\\right.\\\
  right)=\\mathrm{P}\\left(\\mathrm{B}\\left|{\\mathrm{A}}_{\\mathrm{i}}\\right.\\\
  right)\\;\\mathrm{P}\\left({\\mathrm{A}}_{\\mathrm{i}}\\right)/\\left\\{\\mathrm{P}\\\
  right(\\mathrm{B}\\left|{\\mathrm{A}}_1\\left)\\;\\mathrm{P}\\left({\\mathrm{A}}_1\\\
  right)+\\mathrm{P}\\right(\\mathrm{B}\\left|{\\mathrm{A}}_2\\left)\\;\\mathrm{P}\\\
  left({\\mathrm{A}}_2\\right)+\\dots +\\mathrm{P}\\right(\\mathrm{B}\\left|{\\mathrm{A}}_{\\\
  mathrm{n}}\\Big)\\;\\mathrm{P}\\left({\\mathrm{A}}_{\\mathrm{n}}\\right)\\right.\\\
  right.\\right. $$](img/499122_1_En_3_Chapter_TeX_Equ12.png)\n\n（公式 3-12）\n\n贝叶斯法则指出，后验概率等于似然乘以先验概率，再除以似然乘以先验概率的总和。贝叶斯法则中的分母是概率\
  \ P(B)。\n\n![$$ \\mathrm{后验概率}=\\left(\\mathrm{条件概率}\\times \\mathrm{先验概率}\\right)/\\\
  mathrm{证据} $$](img/499122_1_En_3_Chapter_TeX_Equ13.png)\n\n（公式 3-13）\n\n贝叶斯定理用于进行分类（二分类或多分类），它被称为*朴素贝叶斯*。之所以称为朴素，是因为它有一个非常强的假设，即变量和特征彼此独立，这在现实世界中通常不成立。通常这个假设会被违反，但朴素贝叶斯仍然表现良好。其思想是将所有可用证据以预测变量的形式纳入朴素贝叶斯规则，以获得更准确的类别预测概率。\n\
  \n根据贝叶斯法则，朴素贝叶斯估计条件概率（即在某事件已发生的情况下，另一事件发生的概率）。例如，如果我们想设计一个电子邮件垃圾邮件过滤器，并发现如果出现“折扣”这个词，则给定邮件是垃圾邮件。它易于实现、快速、稳健且相当准确。由于其易用性，它是一种非常流行的技术。\n\
  \n朴素贝叶斯算法的优点：\n\n1.  它是一种简单、容易、快速且非常稳健的方法。\n\n2.  它在干净数据和噪声数据上表现良好。\n\n3.  它只需要少量样本进行训练，但其基本假设是训练数据集是总体的真实代表。\n\
  \n4.  很容易获得预测的概率。\n\n朴素贝叶斯算法的缺点：\n\n1.  它依赖于一个非常强的假设，即自变量之间不相关。\n\n2.  它通常不适用于具有大量数值属性的数据集。\n\
  \n3.  在实践中，朴素贝叶斯算法预测的概率被认为不如预测的类别可靠。\n\n4.  在某些情况下，已经观察到，如果罕见事件不在训练数据中但出现在测试中，那么估计的概率将是错误的。\n\
  \n但是，当我们的某些自变量是连续变量时，我们无法计算条件概率！因此，在实际变量中，朴素贝叶斯被扩展为高斯朴素贝叶斯。\n\n在高斯朴素贝叶斯中，与每个属性或自变量相关的连续值被假定遵循高斯分布。它们也更容易处理，因为在训练时我们只需要估计连续变量的均值和标准差。\n\
  \n让我们进入案例研究，以开发朴素贝叶斯解决方案。\n\n## 案例研究：基于人口普查数据的收入预测\n\n**业务目标**：我们拥有人口普查数据，目标是基于其他属性的值预测个人的收入是否超过\
  \ 50K/年。\n\n**数据集**：数据集和代码可在本章开头共享的 Github 链接中找到。\n\n变量描述：\n\n*   Age：连续变量\n\n*\
  \   Workclass：Private, Self-emp-not-inc, Self-emp-inc, Federal-gov, Local-gov, State-gov,\
  \ Without-pay, Never-worked.\n\n*   fnlwgt：连续变量。\n\n*   Education：Bachelors, Some-college,\
  \ 11th, HS-grad, Prof-school, Assoc-acdm, Assoc-voc, 9th, 7th-8th, 12th, Masters,\
  \ 1st-4th, 10th, Doctorate, 5th-6th, Preschool.\n\n*   Education-num：连续变量。\n\n*\
  \   Marital-status：Married-civ-spouse, Divorced, Never-married, Separated, Widowed,\
  \ Married-spouse-absent, Married-AF-spouse.\n\n*   Occupation：Tech-support, Craft-repair,\
  \ Other-service, Sales, Exec-managerial, Prof-specialty, Handlers-cleaners, Machine-op-inspct,\
  \ Adm-clerical, Farming-fishing, Transport-moving, Priv-house-serv, Protective-serv,\
  \ Armed-Forces.\n\n*   Relationship：Wife, Own-child, Husband, Not-in-family, Other-relative,\
  \ Unmarried.\n\n*   Race：White, Asian-Pac-Islander, Amer-Indian-Eskimo, Other, Black.\n\
  \n*   Sex：Female, Male.\n\n*   Capital-gain：连续变量。\n\n*   Capital-loss：连续变量。\n\n\
  *   Hours-per-week：连续变量。\n\n*   Native-country：United States, Cambodia, England,\
  \ Puerto Rico, Canada, Germany, Outlying-US (Guam-USVI-etc), India, Japan, Greece,\
  \ South, China, Cuba, Iran, Honduras, Philippines, Italy, Poland, Jamaica, Vietnam,\
  \ Mexico, Portugal, Ireland, France, Dominican Republic, Laos, Ecuador, Taiwan,\
  \ Haiti, Colombia, Hungary, Guatemala, Nicaragua, Scotland, Thailand, Yugoslavia,\
  \ El Salvador, Trinadad&Tobago, Peru, Hong, Holland-Netherlands.\n\n*   Class：>50K,\
  \ <=50K\n\n**步骤 1**：在此处导入必要的库。\n\n```\nimport pandas as pd\nimport numpy as np\n\
  from sklearn import preprocessing\nfrom sklearn.model_selection import train_test_split#\
  \ 用于将数据集拆分为训练集和测试集\nfrom sklearn.naive_bayes import GaussianNB # 用于建模高斯朴素贝叶斯分类器\n\
  from sklearn.metrics import accuracy_score # 用于计算模型的准确率分数\n```\n\n**步骤 2**：我们现在导入数据。请注意，此文件具有\
  \ .data 扩展名。现在为了导入人口普查数据，我们传递四个参数。‘adult.data’ 参数是文件名。header 参数表示数据的第一行是否包含文件的标题。对于我们的数据集，没有标题，因此我们可以传递\
  \ ‘None’。delimiter 参数指示分隔数据的定界符。这里，我们使用 ‘ , ’ 定界符。此定界符允许该方法删除数据值前后的空格。当数据值使用的空格不一致时，这非常有用。\n\
  \n```\ncensus_df = pd.read_csv('adult.data', header = None, delimiter=' *, *', engine=\"\
  python\")\n```\n\n**步骤 3**：我们现在向数据框添加标题。这是必需的，以便我们以后能够访问列并更好地理解：\n\n```\ncensus_df.columns\
  \ = ['age', 'workclass', 'fnlwgt', 'education', 'education_num', 'marital_status',\
  \ 'occupation', 'relationship', 'race', 'sex', 'capital_gain', 'capital_loss', 'hours_per_week',\
  \ 'native_country', 'income']\n```\n\n**步骤 4**：让我们打印数据框中的总记录数（行数）：\n\n```\nlen(census_df)\n\
  输出结果为 32561\n```\n\n**步骤 5**：检查数据集中是否存在空值，如下所示：\n\n![../images/499122_1_En_3_Chapter/499122_1_En_3_Figr_HTML.jpg](img/499122_1_En_3_Figr_HTML.jpg)\n\
  \n```\ncensus_df.isnull().sum()\n```\n\n上述输出显示我们的数据集中没有“null”值。\n\n可能存在一些分类变量有缺失值。我们将检查这一点，有时它们会用“?”代替缺失值。\n\
  \n![../images/499122_1_En_3_Chapter/499122_1_En_3_Figs_HTML.jpg](img/499122_1_En_3_Figs_HTML.jpg)\n\
  \n\n\n```\nfor value in ['workclass','education','marital_status','occupation','relationship','race','sex','native_country','income']:\n\
  print(value,\":\", sum(census_df[value] == '?'))\n```\n\n上述代码片段的输出显示，`workclass`\
