  \n我们使用 knn 开发了一个解决方案，并获得了良好的准确率。k-近邻算法非常易于解释和可视化。由于不涉及繁重的统计学或数学知识，即使对于非数据科学用户来说，该方法也不难理解。这是该方法最重要的特性之一。作为一种非参数方法，它不对数据做任何假设，因此所需的数据准备工作量较少。\n\
  \n我们已经介绍了逻辑回归、朴素贝叶斯和 k-近邻算法。通常，当我们开始任何分类解决方案时，我们会先使用这三种算法来检查其准确率。接下来是基于树的算法：决策树和随机森林。我们已经在第\
  \ 2 章中讨论了这两者的理论概念。在下一节中，我们将介绍它们的区别，然后在一个数据集上实现它们。\n\n\n\n## 基于树的分类算法\n\n回顾第 2 章，我们学习了用于预测连续变量值的决策树。由于决策树既可解决分类问题也可解决回归问题，本章我们将研究使用决策树进行分类的解决方案。决策树的构建模块与图\
  \ 3-8 所示保持一致。\n\n![../images/499122_1_En_3_Chapter/499122_1_En_3_Fig8_HTML.jpg](img/499122_1_En_3_Fig8_HTML.jpg)\n\
  \n图 3-8\n\n决策树由根节点、决策节点和终端节点组成。子树称为分支\n\n区别在于分裂过程之后所采用的分类算法，这一点将在下文讨论。\n\n分裂的目标是创建尽可能多的纯节点。如果分裂后得到的某个节点包含的所有数据点都属于同一类别，则该节点被称为*纯节点*或*同质节点*。如果该节点包含属于不同类别的记录，则该节点是*不纯节点*或*异质节点*。目标是创建纯节点。衡量不纯度的主要方法有三种：熵、基尼指数和分类误差。我们现在详细描述它们，并比较各自的过程。假设我们有一个如表\
  \ 3-3 所示的数据集。\n\n表 3-3\n\n交通方式对性别和收入水平等其他因素的依赖性\n\n| 车辆数量 | 性别 | 费用 | 收入 | 交通方式\
  \ |\n| --- | --- | --- | --- | --- |\n| 1 | 女 | 低 | 中产阶级 | 火车 |\n| 0 | 男 | 低 | 低收入\
  \ | 公交 |\n| 1 | 女 | 高 | 中产阶级 | 火车 |\n| 1 | 男 | 低 | 中产阶级 | 公交 |\n| 0 | 男 | 中 | 中产阶级\
  \ | 火车 |\n| 1 | 男 | 低 | 中产阶级 | 公交 |\n| 2 | 女 | 高 | 高收入阶层 | 汽车 |\n| 0 | 女 | 低 | 低收入\
  \ | 公交 |\n| 2 | 男 | 高 | 中产阶级 | 汽车 |\n| 1 | 女 | 高 | 高收入阶层 | 汽车 |\n\n我们想要训练一个算法来预测交通方式。根据上述示例，我们可以计算出各自的概率为：\n\
  \n```\n概率（公交） = 4/10 = 0.4\n概率（汽车） = 3/10 = 0.3\n概率（火车） = 3/10 = 0.3\n```\n\n这三种方法分别是熵、基尼指数和分类误差，现描述如下：\n\
  \n*   **熵**：*熵*和*信息增益*是相辅相成的。一个纯节点需要较少的信息来描述自身，而不纯节点则需要更多信息。这也可以通过熵的形式来理解。（信息增益\
  \ = 1 – 熵。）\n\n![$$ \\mathrm{系统的熵}\\kern0.17em =\\hbox{-} \\mathrm{p}\\;{\\log}_2\\\
  mathrm{p}\\hbox{-} \\mathrm{q}\\;{\\log}_2\\mathrm{q} $$](img/499122_1_En_3_Chapter_TeX_Equ17.png)\n\
  \n（公式 3-17）\n\n![../images/499122_1_En_3_Chapter/499122_1_En_3_Fig9_HTML.png](img/499122_1_En_3_Fig9_HTML.png)\n\
  \n图 3-9\n\n不同类别数（n）下的最大熵值。概率 p = 1/n。\n\n*   其中 p 和 q 分别代表该节点中成功和失败的概率。这里的对数以 2\
  \ 为底。\n\n*   在上述示例中，熵 = –0.4 (log 0.4) – 0.3(log 0.3) – 0.3(log 0.3) = 1.571\n\n\
  *   纯节点的熵为 0，如图 3-9 所示。\n\n![../images/499122_1_En_3_Chapter/499122_1_En_3_Fig10_HTML.png](img/499122_1_En_3_Fig10_HTML.png)\n\
  \n图 3-10\n\n不同类别数（n）下的最大基尼指数值。概率 p = 1/n。\n\n*   **基尼系数**：基尼指数也可用于衡量不纯度。使用的公式如下：\n\
  \n![$$ \\mathrm{基尼指数}=1-\\Sigma {\\mathrm{p}}²\\mathrm{j} $$](img/499122_1_En_3_Chapter_TeX_Equ18.png)\n\
  \n（公式 3-18）\n*   在上述示例中，基尼指数 = 1 – (0.4² + 0.3² + 0.3²) = 0.660\n\n*   只包含单一类别的节点的基尼值为\
  \ 0，因为其概率为 1。与熵类似，当节点中所有类别的概率相等时，基尼值也达到最大值。基尼值的变化如图 3-10 所示。\n\n*   无论模型中类别数量多少，基尼值始终介于\
  \ 0 和 1 之间。\n\n*   **分类误差**：衡量不纯度的另一种方法是使用分类误差。其公式如下：\n\n![$$ \\mathrm{分类误差指数}=1-\\\
  max \\left({\\mathrm{p}}_{\\mathrm{i}}\\right) $$](img/499122_1_En_3_Chapter_TeX_Equ19.png)\n\
  \n（公式 3-19）\n\n*   其中 i 是类别数量\n\n*   与其他两种方法类似，其值介于 0 和 1 之间。\n\n*   对于上述示例，分类误差指数\
  \ = 1 – max(0.4,0.3,0.3) = 0.6\n\n我们可以使用这三种分裂方法中的任何一种进行分类。有一些常见的决策树算法可用于回归和分类问题。既然我们已经学习了回归和分类的概念，现在是时候研究不同类型的决策树算法了，这将是下一节的内容。\n\
  \n\n\n## 决策树算法类型\n\n业界使用一些重要的决策树算法。其中一些适用于分类问题，而另一些则是回归解决方案的更好选择。我们将讨论这些算法的各个方面。\n\
  \n主要的算法如下：\n\n1.  **ID3**（迭代二分器 3）是一种决策树算法，它使用贪心搜索在每次迭代中分割数据集。它使用熵或信息增益作为因子来迭代执行分割。对于模型中的每次连续迭代，它使用上一次迭代中未使用的变量，计算这些未使用变量的熵，然后选择熵最低的变量。换句话说，它选择信息增益最高的变量。ID3\
  \ 可能导致过拟合，并且可能不是最优选择。它在处理分类变量时表现相当不错。但当数据集包含连续变量时，由于节点分割可能基于许多值，其收敛速度会变慢。\n\n2.\
  \  **CART**（分类与回归树）是一种灵活的基于树的解决方案。它可以为连续或分类目标变量建模，因此是使用率最高的基于树的算法之一。与常规决策树算法一样，我们选择输入变量并迭代分割节点，直到构建出一个稳健的树。输入变量的选择采用贪心方法，目标是最小化损失。树的构建基于预定义的标准停止，例如每个叶子节点中必须存在的最小观测数。Python\
  \ 库`scikit-learn`使用了 CART 的优化版本，但目前不支持分类变量。\n\n3.  **C4.5** 是 ID3 的扩展，用于分类问题。与 ID3\
  \ 类似，它利用熵或信息增益进行分割。它是一个稳健的选择，因为它可以处理分类变量和连续变量。对于连续变量，它会分配一个阈值，并根据该阈值进行分割。值高于阈值的变量在一个桶中，而值小于或等于阈值的变量在另一个桶中。它允许数据中存在缺失变量，因为在计算熵值时不会考虑缺失值。\n\
  \n4.  **CHAID（卡方自动交互检测）** 是市场研究和营销领域的一种流行算法；例如，如果我们想了解某特定客户群体会如何响应新的营销活动。该营销活动可以针对新产品或服务，并且有助于营销团队制定相应的策略。CHAID\
  \ 主要基于调整后的显著性检验，主要用于我们拥有分类目标变量和分类自变量时。事实证明，它是可视化此类数据集的一种非常方便且便捷的方法。\n\n5.  **MARS（多元自适应回归样条）**\
  \ 是一种非参数回归技术。它最适用于测量变量之间的非线性关系。它是一种灵活的回归模型，可以处理分类变量和连续变量。它是处理海量数据集的非常稳健的解决方案，并且需要的数据准备工作非常少，因此实现起来相对更快。由于其灵活性和对数据集中非线性关系建模的能力，MARS\
  \ 通常是解决模型中过拟合问题的不错选择。\n\n前面讨论的基于树的算法各有其独特之处。其中一些更适合分类问题，而另一些则是回归问题的更好选择。CART 可用于分类和回归问题。\n\
  \n现在是时候使用决策树开发一个案例研究了。\n\n代码和数据集可在本章开头分享的 Github 链接中找到。\n\n我们可以使用与逻辑回归问题相同的数据集。在创建了训练数据和测试数据之后，进行实现。\n\
  \n**步骤 1：** 首先导入必要的库。\n\n```\nfrom sklearn.tree import DecisionTreeClassifier\n\
  ```\n\n**步骤 2：** 现在调用决策树分类器并训练模型。\n\n```\ndt_classifier = DecisionTreeClassifier()\n\
  dt_classifier.fit(X_train, y_train)\n```\n\n**步骤 3：** 使用训练好的模型对测试数据进行预测。\n\n```\n\
  y_pred = dt_classifier.predict(X_test)\n```\n\n**步骤 4：** 获取混淆矩阵。为了可视化，建议使用逻辑回归方法中使用的方法。\n\
  \n![../images/499122_1_En_3_Chapter/499122_1_En_3_Figah_HTML.jpg](img/499122_1_En_3_Figah_HTML.jpg)\n\
  \n```\nprint(confusion_matrix(y_test, y_pred))\nax= plt.subplot()\nax.set_ylim(2.0,\
