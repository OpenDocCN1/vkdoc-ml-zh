- "# 5. 端到端模型开发\n\n> *“旅程即是目的地。”*\n> \n> — 丹·埃尔登\n\n学习的道路永无止境。它需要耐心、时间、投入和努力。这条路并不容易，但凭借投入，可以取得很多成就。\n\
  \n在这段学习旅程中，你已经迈出了第一步。数据科学和机器学习正在改变世界各地的商业领域。而监督学习解决方案正在所有领域和业务流程中产生影响。\n\n在前四章中，我们涵盖了回归、分类以及\
  \ Boosting 和神经网络等高级主题。我们理解了相关概念，并通过各种案例研究开发了 Python 解决方案。这些机器学习模型可用于对收入、需求、价格、客户行为、欺诈等各种业务关键绩效指标进行预测和估算。\n\
  \n但在务实的商业世界中，这些机器学习模型必须部署到生产环境中。在生产环境中，它们被用于基于真实未见数据进行预测。我们将在本书的最后一章讨论这一点。\n\n此外，关于机器学习和数据科学，还有相当多的最佳实践。我们将涵盖所有这些内容。我们还将讨论创建机器学习模型时最常见的问题，如过拟合、空值、数据不平衡、异常值等。\n\
  \n\n\n## 所需技术工具包\n\n本章我们将使用 Python 3.5 或更高版本。我们将使用 Jupyter notebook；需要安装 Anaconda-Navigator\
  \ 来执行代码。所有数据集和代码均已上传至 Github 库 [`https://github.com/Apress/supervised-learning-w-python/tree/master/Chapter%205`](https://github.com/Apress/supervised-learning-w-python/tree/master/Chapter%25205)，方便下载和执行。\n\
  \n## 机器学习模型开发\n\n回顾一下，在第 1 章中，我们简要讨论了模型开发的端到端流程。现在我们将详细讨论每个步骤；我们将深入探讨每个步骤中最常见的问题以及如何应对。最终将进入模型部署阶段。图\
  \ 5-1 是我们遵循的模型开发流程。\n\n![../images/499122_1_En_5_Chapter/499122_1_En_5_Fig1_HTML.jpg](img/499122_1_En_5_Fig1_HTML.jpg)\n\
  \n图 5-1\n\n通常遵循的端到端模型开发流程及各阶段耗时\n\n机器学习模型开发的步骤如下：\n\n*   步骤 1：定义业务问题\n\n*   步骤 2：数据发现\n\
  \n*   步骤 3：数据清洗与准备\n\n*   步骤 4：探索性数据分析\n\n*   步骤 5：统计建模\n\n*   步骤 6：模型部署\n\n*  \
  \ 步骤 7：编写规范文档\n\n*   步骤 8：模型部署后，需要持续进行模型刷新和维护。\n\n我们将详细讨论所有步骤、其中常见的难题以及如何解决。整个过程将辅以实际的\
  \ Python 代码。\n\n## 步骤 1：定义业务问题\n\n一切始于业务问题。业务问题必须简洁、清晰、可衡量且可实现。它不能含糊不清，例如“增加利润”。它必须精确定义，具有清晰的业务目标以及可衡量的关键绩效指标。\n\
  \n业务问题的常见问题如下：\n\n*   模糊的业务问题难以解决。例如，每个企业都希望增加收入、提高利润和降低成本。应避免像*增加利润*这样不明确、模糊的业务问题。\n\
  \n*   业务目标必须可实现。我们不能期望一个机器学习模型在一夜之间将收入提高 80%，或在一个月内将成本降低一半。因此，目标必须在特定时间范围内可实现。\n\
  \n*   有时，定义的业务目标不是*量化的*。如果业务问题是“提高对客户群的理解”，它就没有可衡量的关键绩效指标。因此，业务问题必须明确定义且可通过关键绩效指标衡量，这一点至关重要。\n\
  \n*   在确定业务问题或开发过程中，有时会出现*范围蔓延*。范围蔓延指的是初始业务目标随时间推移而增加，或目标随时间变化的情况。它还涉及业务目标的变更。例如，假设机器学习模型最初旨在预测客户流失倾向。然而，在项目过程中，目标却变成了预测客户购买特定产品的倾向。这无疑会削弱解决方案的范围，并影响预期输出。不应鼓励此类做法。\n\
  \n一个好的业务问题应该是精确、可实现、可衡量且可重复的，如图 5-2 所示。\n\n![../images/499122_1_En_5_Chapter/499122_1_En_5_Fig2_HTML.png](img/499122_1_En_5_Fig2_HTML.png)\n\
  \n图 5-2\n\n一个好的业务问题应简洁、可衡量、可实现且可重复\n\n简而言之，拥有严格的范围和定义明确的业务问题，为成功创建机器学习模型铺平了道路。\n\
  \n提示\n\n业务利益相关者掌握着项目最终成功的关键。他们应从项目初期就适当参与其中。\n\n现在我们进入下一步，即数据发现阶段。这一步非常重要，它将决定我们是否能够继续进行机器学习模型开发！\n\
  \n\n\n## 步骤 2：数据发现阶段\n\n这是项目最关键阶段，因为它决定了项目的未来走向。数据发现阶段包括以下内容：\n\n1.  确定用于分析的数据库。需要申请相应的数据库权限，并记录所有必需的表格。这些表格通常会被迁移到开发环境中。数据库类型可能是\
  \ SQL/Oracle/Redshift/NoSQL 等。\n\n2.  有些数据源是 Excel 文件或 .csv/文本文件格式。这些文件需要加载到数据库中，以便我们随时调用。此外，**不**将数据文件保存在个人电脑上是一个好习惯。但随着基于数据架构的兴起，此类数据源可以存储在对象存储中，例如\
  \ S3 或 Azure Data Lake Storage。\n\n3.  所使用的数据集必须完整，并且与我们想要解决的业务问题相关。例如，如果我们要构建一个月度销售预估模型，那么至少需要拥有过去两到三年且没有缺失月份的数据。\n\
  \n4.  所使用的数据集必须能够充分代表当前的业务问题。它应该足够完整，以便数据集能够体现业务中的所有随机性。例如，如果一家制造工厂想要实施预测性维护模型，那么数据集应包含所有相关设备的数据。\n\
  \n5.  数据刷新也需要在此阶段进行规划。机器学习模型的构建可能需要一些时间。在此之前，可能需要对数据进行刷新。\n\n数据发现阶段通常遇到的问题如下：\n\n\
  *   数据集不完整，中间有缺失的月份，并且关键信息（如收入、客户数量或产品信息）不可用。例如，假设我们正在构建一个模型来判断客户在未来几个月是否会流失。为此，如果我们没有收入详情（表\
  \ 5-1），那么模型将无法发现数据中的模式来预测流失倾向。\n\n表 5-1\n\n以流失为目标变量的客户数据示例\n\n| 客户 ID | 收入 | 访问次数\
  \ | 商品数量 | 是否流失 (是/否) |\n    | --- | --- | --- | --- | --- |\n    | 1001 | 100 |\
  \ 2 | 10 | 是 |\n    | 1002 | - | 3 | 11 | 是 |\n    | 1003 | 102 | 4 | 9 | 否 |\n\
  \    | 1004 | ? | 5 | 10 | 否 |\n\n因此，在这种情况下，我们必须拥有这些缺失的数据点，才能对数据做出正确的推断。\n\n为了解决这个问题，如果我们无法获取这一列数据，可以尝试估算缺失的数据点。例如，在上述案例中，可以使用访问次数作为缺失数据点的替代指标。\n\
  \n*   第二个问题可能出现在我们拥有多个数据表，且这些表包含多种类型的信息时。如果缺少关联键或关系键损坏，那么数据整合将变得非常困难。例如，在表 5-2 中，我们有三张表的数据。\n\
  \n表 5-2\n\n表示员工数据的表格（员工人口统计、雇佣详情和薪资）\n\n| -![../images/499122_1_En_5_Chapter/499122_1_En_5_Figa_HTML.jpg](img/499122_1_En_5_Figa_HTML.jpg)\
  \ |\n\n在表 5-2 中，员工 ID（EmpID）是三张表的公共键。如果这个公共关系不存在或已损坏，我们就无法连接这些表，从而在所有字段之间建立有意义的关联。如果各个表中的信息之间缺少关联，我们将*无法*获得一个连贯且完整的数据集视图。\n\
  \n不幸的是，如果这个关联键缺失，我们能做的就不多了。我们仍然可以尝试使用部门或国家/地区的替代键来连接表，但这可能无法做到 100% 准确。\n\n*   数据不一致和错误的引用是可能完全颠覆分析和从数据中得出的见解的问题。例如，如果有不同的系统在捕获客户的收入数据，并且它们之间不同步，那么结果将是不正确的。\n\
  \n缓解步骤如下：\n    1.  从数据集中创建一份关于主要 KPI 的初始报告：例如收入、客户、交易量、设备数量、保单数量等 KPI。\n\n2.  与业务相关方核实并交叉检查这些\
  \ KPI。\n\n3.  找出计算错误的 KPI，并使用准确的业务逻辑进行修正。\n\n4.  重新生成报告，并就修订后的结果获得确认。\n\n*   数据质量是最大的挑战之一。回想一下，在第\
  \ 1 章中，我们讨论了高质量数据的属性。现在我们将详细回顾这些概念，并讨论如何在下一步中解决我们在数据方面面临的挑战。\n\n*   原始数据中也可能存在其他问题，例如：\n\
  \n表 5-3\n\n数据集中的不当表头\n\n| ![../images/499122_1_En_5_Chapter/499122_1_En_5_Figb_HTML.jpg](img/499122_1_En_5_Figb_HTML.jpg)\
  \ |\n\n1.  有时，一个列可能包含多个变量的信息。这可能在数据捕获阶段或数据转换阶段发生。\n\n2.  表的表头不规范，是数字格式。或者表头名称中包含空格，这会在我们后续尝试引用这些变量时造成麻烦。例如，表\
  \ 5-3 提供了两个数据集中列表头不当的示例。左侧表格的列标题是数字，并且列标题之间有空格。在第二个表格中，这些问题已得到修正。\n\n在这种情况下，一个明智的做法是用字符串替换数字列标题。同时建议用“_”之类的符号替换空格，或者将它们连接起来。在上面的例子中，“Day\
  \ Temp”已更改为“Day_Temp”，“1”和“2”已分别更改为“ABC”和“PQR”。在实际应用中，我们应该为 ABC 和 PQR 找到合乎逻辑的名称。\n\
  \n数据发现阶段的结果是确定最终要使用的表和数据集。如果确实遇到数据完全不完整的情况，我们可能会决定不继续，而是先完善数据集。\n\n现在，是时候讨论所有步骤中可能最耗时的环节了，即数据清洗和准备。\n\
  \n## 步骤 3：数据清洗与准备\n\n所有步骤中最耗时的可能就是数据清洗与准备了。它通常与步骤 2 一起占用 60% 到 70% 的时间。\n\n数据发现阶段将产生可用于进一步分析的数据集。但这并不意味着这些数据集是干净且可以直接使用的。我们通过*特征工程*和*预处理*来处理它们。\n\
  \n注意\n\n数据清洗并非一项花哨的工作；它需要耐心、严谨和时间。其本质上是高度迭代的。\n\n我们面临的最常见的数据问题列举如下：\n\n*   数据集中存在重复值\n\
  \n*   存在分类变量，但我们只想使用数值特征\n\n*   数据中存在缺失值、NULL 值或 NAN\n\n*   数据集不平衡\n\n*   数据中存在异常值\n\
  \n*   其他常见问题及所做的转换\n\n让我们从第一个问题开始，即数据集中的重复值。\n\n\n\n### 数据集中的重复值\n\n如果数据集中存在完全相同的行，那么这些行就是*重复值*。这意味着每一列中的每个值都完全相同，且顺序也一致。此类问题通常发生在数据采集或数据加载阶段。例如，在填写调查问卷时，同一个人填写了一次，然后又提供了完全相同的详细信息。\n\
  \n重复行的示例如下表 5-4 所示。请注意，第 1 行和第 5 行是重复的。\n\n表 5-4\n\n包含应删除的重复行的示例数据\n\n| -![../images/499122_1_En_5_Chapter/499122_1_En_5_Figc_HTML.gif](img/499122_1_En_5_Figc_HTML.gif)\
  \ |\n\n如果数据集中存在重复值，我们就无法信任模型的性能。如果重复记录同时成为训练集和测试集的一部分，模型的性能将被错误地提升并产生偏差。我们会得出模型表现良好的结论，而实际上并非如此。\n\
  \n我们可以通过几个简单的命令来识别重复值的存在，然后将其从数据集中删除。\n\n重复行（第 1 行和第 5 行）的示例如表 5-4 所示。现在，我们将在 Python\
  \ 中加载一个包含重复值的数据集，然后对其进行处理。所使用的数据集是鸢尾花（Iris）数据集，我们在第 2 章和第 3 章的练习部分已经使用过。相关代码可在 Github\
  \ 链接 [`https://github.com/Apress/supervised-learning-w-python/tree/master/Chapter%205`](https://github.com/Apress/supervised-learning-w-python/tree/master/Chapter%25205)\
  \ 处获取。\n\n步骤 1：导入库。\n\n```\nfrom pandas import read_csv\n```\n\n步骤 2：现在使用 `read_csv`\
  \ 命令加载数据集。\n\n```\ndata_frame = read_csv(\"IRIS.csv\", header=None)\n```\n\n步骤 3：现在查看数据集中的行数和列数。\n\
  \n```\nprint(data_frame.shape)\n(151,5) 数据集中有 151 行\n```\n\n步骤 4：现在检查数据集中是否存在重复值。\n\
  \n```\nduplicates = data_frame.duplicated()\n```\n\n步骤 5：现在打印重复的行。\n\n![../images/499122_1_En_5_Chapter/499122_1_En_5_Figd_HTML.jpg](img/499122_1_En_5_Figd_HTML.jpg)\n\
  \n```\nprint(duplicates.any())\nprint(data_frame[duplicates])\n```\n\n从输出中我们可以看到，有三行是重复的，需要删除。\n\
  \n步骤 6：使用 `drop_duplicates` 命令删除重复行，并再次检查形状。\n\n```\ndata_frame.drop_duplicates(inplace=True)\n\
  print(data_frame.shape)\n```\n\n形状现在减少到 148 行。\n\n这就是我们如何检查重复值并通过从数据集中删除来处理它们的方法。\n\
  \n重复值可能会提高机器学习模型的感知准确率，因此必须加以处理。我们现在讨论下一个常见问题：分类变量。\n\n### 数据集中的分类变量处理\n\n分类变量本身并非数据集中的问题。它们是信息和洞察的丰富来源。像性别、邮政编码、城市、类别、情感等变量确实很有洞察力且非常有用。\n\
  \n同时，数据集中存在分类变量可能会带来一些问题，例如：\n\n1.  一个分类变量可能只有非常少量的不同值。例如，如果变量是“城市”，并且某个值在总人口中占有显著比例，那么这个变量的用处就会很小。它不会在数据集中产生任何变化，也不会被证明是有用的。\n\
  \n2.  类似地，像“邮政编码”这样的分类变量可能有非常多的不同值。在这种情况下，它会变成一个难以使用的变量，并且不会为分析增加太多信息。\n\n3.  机器学习算法基于数学概念。像\
  \ k 近邻这样的算法会计算数据点之间的距离。如果变量本质上是分类的，那么欧几里得距离或余弦距离等任何距离度量都无法计算距离。一方面，决策树能够处理分类变量；另一方面，像逻辑回归、支持向量机等算法则不倾向于将分类变量作为输入。\n\
  \n4.  许多库（如 scikit-learn）目前仅适用于数值型数据。它们提供了许多稳健的解决方案来处理分类变量，我们接下来将讨论其中一些。\n\n因此，处理数据集中存在的分类变量变得至关重要。处理分类变量的方法有很多种。下面列出其中几种：\n\
  \n1.  将分类值转换为数字。在表 5-5 中，我们用数字替换了分类值。例如，我们用数字替换了城市。\n\n表 5-5\n\n像城市这样的分类变量可以用数字表示\n\
  \n| -![../images/499122_1_En_5_Chapter/499122_1_En_5_Fige_HTML.gif](img/499122_1_En_5_Fige_HTML.gif)\
  \ |\n\n在所示的示例中，我们用数字替换了城市。但这种方法存在一个问题。机器学习模型会得出结论，认为伦敦的排名高于东京，或者新德里是纽约的四分之一。这些见解显然具有误导性。\n\
  \n2.  也许最常用的方法是*独热编码*。在独热编码中，每个不同的值都被表示为数据集中的一个单独列。如果该值存在，则在该单元格中分配 1，否则分配 0。这些额外创建的变量被称为*虚拟变量*。例如，在前面的数据集中实施独热编码后，结果将如表\
  \ 5-6 所示。\n\n表 5-6\n\n独热编码将分类变量转换为数值，导致数据维度增加\n\n| -![../images/499122_1_En_5_Chapter/499122_1_En_5_Figf_HTML.jpg](img/499122_1_En_5_Figf_HTML.jpg)\
  \ |\n\n与用数字替换相比，这无疑是一种更直观、更稳健的方法。pandas 中有一个名为 `get_dummies` 的方法，它通过添加额外变量将分类变量转换为虚拟变量。`sklearn.preprocessing.OneHotEncoder`\
  \ 中还有另一种方法可以为我们完成这项工作。我们在本书的前面章节中已经处理过将分类变量转换为数值变量的问题。\n\n但独热编码并非万无一失的方法。想象一下，如果我们正在处理一个包含\
  \ 1000 个级别的数据集。在这种情况下，额外列的数量将是 1000。此外，数据集将非常稀疏，因为只有一列包含“1”，其余值都是 0。在这种情况下，建议我们先合并和聚类一些分类值，减少不同级别的数量，然后再进行独热编码。\n\
  \n分类变量提供了关于各个级别的丰富洞察。我们必须了解哪些算法能够处理分类变量，哪些不能。并不总是需要将分类变量转换为数值变量！\n\n我们现在将讨论数据集中最常见的缺陷类型：缺失值。\n\
  \n\n\n### 数据集中存在的缺失值\n\n大多数真实世界的数据集都存在变量缺失值的情况。数据集中存在 NULL、NAN、0、空白值等。这些缺失值可能在数据采集阶段或数据转换过程中引入，也可能是因为某些时间点数据本身不存在。几乎所有数据集都存在缺失值，无论是分类变量还是数值变量。我们必须处理这些缺失值。\n\
  \n例如，表 5-7 中的缺失值包含 NULL、NAN 和空白值；这些缺失值需要被处理。\n\n表 5-7\n\n数据集中存在的缺失值\n\n| ![../images/499122_1_En_5_Chapter/499122_1_En_5_Figg_HTML.gif](img/499122_1_En_5_Figg_HTML.gif)\
  \ |\n\n缺失值在我们进行分析时会带来很大问题。它会扭曲所有的平均值和中位数，导致我们无法从数据集中得出正确的结论。我们会构建一个有偏的模型，因为各个变量之间的关系会存在偏差。\n\
  \n提示\n\n如果值为零，我们不能断定它就是缺失值。有时，NULL 值也是一个正确的数据点。因此，在处理缺失值之前，应用业务逻辑至关重要。\n\n数据可能因以下原因出现缺失值：\n\
  \n1.  在数据提取阶段，数值未被正确记录。这可能是由于设备故障或记录此类数据的能力不足所致。\n2.  很多时候，非必填的数据未被录入。例如，客户在填写表单时可能不想输入地址详情。\n\
  3.  可能存在完全随机的缺失值，没有任何模式或原因。\n4.  有时（尤其是在调查等场景中），我们发现关于人们某个特定属性的回答未被收到。例如，受访者可能不愿意分享薪资细节。\n\
  5.  缺失值也可能遵循某种模式。例如，我们可能缺少某个特定年龄组、性别或地区的数据。这可能是由于该特定年龄组、性别或地区的数据不可用或未被采集。\n\n为了减少缺失值，作为第一步，我们要检查数据是设计上就缺失，还是属于需要处理的问题。例如，传感器可能无法记录超过某个压力范围的任何温度值。在这种情况下，温度值的缺失是正确的。\n\
  \n我们还应该检查缺失值相对于其他自变量以及相对于目标变量是否存在任何模式。例如，查看表 5-8 中的数据集，我们可以推断出，每当温度值为 NULL 时，设备就发生了故障。在这种情况下，温度与故障变量之间的数据存在明显的模式。因此，删除温度或处理温度变量将是错误的步骤。\n\
  \n表 5-8\n\nNULL 值并不总是坏事\n\n| ![../images/499122_1_En_5_Chapter/499122_1_En_5_Figh_HTML.gif](img/499122_1_En_5_Figh_HTML.gif)\
  \ |\n\n如果我们决定需要处理缺失值，那么有几种方法可以实现：\n\n1.  直接**删除**包含缺失值的行。这可以看作是最简单的方法，我们只需删除任何值为缺失的行。最大的优点是实现简单且快速。但这种方法会减少样本量。一刀切地删除所有包含缺失值的行有时会移除非常重要的信息。因此，在使用删除法时需要尽职调查。\n\
  \n2.  **均值、中位数或众数插补**：我们可能希望用均值、中位数或众数值来插补缺失值。均值和众数仅适用于连续变量。众数可用于连续变量和分类变量。\n\n\
  \    均值插补或中位数插补不能在对数据进行任何探索性分析的情况下实施。我们应该理解并分析数据中是否存在任何模式，如果使用均值或中位数插补缺失值，这些模式可能会受到影响。例如，在表\
  \ 5-9 中，用均值插补温度的缺失值将是一个错误的策略，因为有明确迹象表明温度与压力和粘度存在相关性。如果我们用均值插补该值，那么数据集将是有偏的。相反，在这种情况下，我们应该使用一种更好的方法，这将在后面的要点中讨论。\n\
  \n表 5-9\n\nNULL 值并不总是能用均值、中位数和众数插补，需要经过充分分析才能得出结论\n\n| ![../images/499122_1_En_5_Chapter/499122_1_En_5_Figi_HTML.gif](img/499122_1_En_5_Figi_HTML.gif)\
  \ |\n\n我们可以使用以下 Python 代码来插补缺失值。有一个 `SimpleImputer` 类，可用于插补缺失值，如下列代码所示。该代码可在 Github\
  \ 链接 [`https://github.com/Apress/supervised-learning-w-python/tree/master/Chapter%205`](https://github.com/Apress/supervised-learning-w-python/tree/master/Chapter%25205)\
  \ 获取。\n\n![../images/499122_1_En_5_Chapter/499122_1_En_5_Figj_HTML.jpg](img/499122_1_En_5_Figj_HTML.jpg)\n\
  \n```\n    import numpy as np\n    from sklearn.impute import SimpleImputer\n  \
  \  Next, impute the missing values.\n    impute = SimpleImputer(missing_values=np.nan,\
  \ strategy=\"mean\")\n    impute.fit([[2, 5], [np.nan, 8], [4, 6]])\n    SimpleImputer()\n\
  \    X = [[np.nan, 2], [6, np.nan], [7, 6]]\n    print(impute.transform(X))\n  \
  \  ```\n\n该函数的输出结果是用均值插补缺失值，因为在前面的函数中我们使用了 `strategy = 'mean'`。\n\n同样的 `SimpleImputer`\
  \ 类也可用于稀疏矩阵。\n\n![../images/499122_1_En_5_Chapter/499122_1_En_5_Figk_HTML.jpg](img/499122_1_En_5_Figk_HTML.jpg)\n\
  \n```\n    import scipy.sparse as sp\n    matrix = sp.csc_matrix([[2, 4], [0, -2],\
  \ [6, 2]])\n    impute = SimpleImputer(missing_values=-1, strategy=\"mean\")\n \
  \   impute.fit(matrix)\n    SimpleImputer(missing_values=-1)\n    matrix_test =\
  \ sp.csc_matrix([[-1, 2], [6, -1], [7, 6]])\n    print(impute.transform(matrix_test).toarray())\n\
  \    ```\n\n`SimpleImputer` 类也可以处理分类变量，其中使用最频繁的值进行插补。\n\n![../images/499122_1_En_5_Chapter/499122_1_En_5_Figl_HTML.jpg](img/499122_1_En_5_Figl_HTML.jpg)\n\
  \n```\n    import pandas as pd\n    data_frame = pd.DataFrame([[\"New York\", \"\
  New Delhi\"],[np.nan, \"Tokyo\"],[\"New York\", np.nan],[\"New York\", \"Tokyo\"\
  ]], dtype=\"category\")\n    impute = SimpleImputer(strategy=\"most_frequent\")\n\
  \    print(impute.fit_transform(data_frame))\n    ```\n\n3.  **使用机器学习模型进行预测**：我们可以利用机器学习模型来估计缺失值。其中一个数据集将用于训练，另一个数据集将用于进行预测。然后我们创建模型来进行预测。例如，我们可以使用\
  \ k-近邻算法来预测缺失的值。如图 5-3 所示，如果缺失数据点的值用黄色表示，那么使用 knn 插补法我们可以进行缺失值插补。我们在第 4 章中详细讨论了\
  \ knn。建议您再次回顾这些概念。\n\n![../images/499122_1_En_5_Chapter/499122_1_En_5_Fig3_HTML.jpg](img/499122_1_En_5_Fig3_HTML.jpg)\n\
  \n图 5-3\n\n用于对缺失值进行插补的 k-近邻方法\n\n\n\nKNN 插补法对定量和定性两种类型的变量都很有用。它考虑了各变量之间的相关性，这是该方法的一大优势。我们无需为每个缺失值创建预测算法，它也能处理存在多个缺失值的情况。但由于该方法需要在整个数据集中搜索相似性，因此会变得相当缓慢且耗时。其弱点之一在于\
  \ k 值的选择，该方法对插补所选的 k 值非常敏感。\n\n类似地，我们可以使用随机森林等其他算法来插补缺失值。我们正在编写代码，用于生成一个包含缺失值的样本数据集，然后使用\
  \ KNN 进行插补。\n\n**步骤 1：导入必要的库。**\n\n```\n    import numpy as np\n    import pandas\
  \ as pd\n    ```\n\n**步骤 2：现在我们将整理一个包含缺失值的数据集。我们将创建一个包含五列的数据框，但其中一些值缺失。**\n\n```\n\
  \    missing_dictionary = {'Variable_A': [200, 190, 90, 149, np.nan],\n    'Variable_B':\
  \ [400, np.nan, 149, 200, 205],\n    'Variable_C': [200,149, np.nan, 155, 165],\n\
  \    'Variable_D': [200, np.nan, 90, 149,100],\n    'Variable_E': [200, 190, 90,\
  \ 149, np.nan],}\n    missing_df = pd.DataFrame(missing_dictionary)\n    ```\n\n\
  **步骤 3：现在让我们查看一下数据框。我们可以看到数据集中存在一些空值。**\n\n![../images/499122_1_En_5_Chapter/499122_1_En_5_Figm_HTML.jpg](img/499122_1_En_5_Figm_HTML.jpg)\n\
  \n```\n    missing_df\n    ```\n\n**步骤 4：我们将使用 KNN 来插补缺失值。这可能需要安装`KNNImputer`模块。**\n\
  \n```\n    from sklearn.impute import KNNImputer\n    missing_imputer = KNNImputer(n_neighbors=2)\n\
  \    imputed_df = missing_imputer.fit_transform(missing_df)\n    ```\n\n**步骤 5：如果我们再次打印数据集，会发现缺失值已被插补。**\n\
  \n![../images/499122_1_En_5_Chapter/499122_1_En_5_Fign_HTML.jpg](img/499122_1_En_5_Fign_HTML.jpg)\n\
  \n```\n    imputed_df\n    ```\n\n使用模型预测缺失值是一种不错的方法。但这有一个潜在假设，即缺失值与数据集中的其他属性之间存在某种关系。\n\
  \n缺失值是最常见的挑战之一。你很少会找到一个没有缺失值的数据集。我们必须认识到，缺失并不一定意味着不完整。但一旦我们确定存在缺失值，最好对其进行处理。\n\n\
  现在，我们将转向面临的另一个挑战：不平衡数据集。\n\n## 数据集不平衡\n\n考虑一下这种情况。一家银行向客户提供信用卡。在每天数百万笔交易中，也存在少量欺诈交易。银行希望创建一个机器学习模型，以便能够在真实交易中检测出这些欺诈交易。\n\
  \n现在，欺诈交易的数量将非常少。可能所有交易中只有不到 1%是欺诈性的。因此，我们可用的训练数据集将没有足够的欺诈交易样本。这被称为*不平衡*数据集。\n\n\
  不平衡数据集可能会给预测模型带来严重问题。机器学习模型将无法学习欺诈交易的特征。此外，它还可能导致*准确率悖论*。在前述案例中，如果我们的机器学习模型将所有传入的交易都预测为真实交易，那么模型的整体准确率将达到\
  \ 99%！令人惊讶，对吧？但该模型将所有传入交易都预测为真实交易，这是不正确的，也违背了机器学习的初衷。\n\n有几种解决方案可以应对不平衡问题：\n\n![../images/499122_1_En_5_Chapter/499122_1_En_5_Fig4_HTML.png](img/499122_1_En_5_Fig4_HTML.png)\n\
  \n图 5-4\n\n分层意味着我们所关心的变量的分布\n\n1.  收集更多数据并纠正不平衡。这是可以实施和使用的最佳解决方案。当我们拥有更多数据点时，对于二分类模型，我们可以抽取一个包含两个类别平衡混合的数据样本；对于多分类模型，则可以抽取包含所有类别的样本。\n\
  \n2.  过采样和欠采样方法：我们可以对代表性不足的类别进行过采样，或者对代表性过高的类别进行欠采样。这些方法非常易于实现且执行速度快。但这两种方法都存在固有的挑战。当我们使用欠采样或过采样时，训练数据可能会变得有偏。我们在尝试采样时可能会遗漏一些重要的特征或数据点。在进行过采样或欠采样时，可以遵循一些规则：\n\
  \    1.  如果数据点数量较少，我们倾向于使用过采样。\n\n2.  如果我们拥有大量数据集，我们倾向于使用欠采样。\n\n3.  并不要求所有类别都具有相等的比例。如果目标变量有四个类别，并不要求每个类别都占\
  \ 25%。我们也可以设定一个较小的比例目标。\n\n4.  在采样时使用分层抽样方法（图 5-4）。随机抽样和分层抽样的区别在于，分层抽样在进行分层时会考虑我们想要使用的所有变量的分布。换句话说，我们在分层样本中得到的变量分布与总体分布相同，而这在随机抽样中可能无法保证。\n\
  \n在总体和样本中，分层保持了相同的比例。例如，如图 5-4 所示，总体中男女比例为 80:20。在总体的 10%样本中，男女比例应保持为 80:20，这通过分层抽样实现，而随机抽样不一定能保证。\n\
  \n提示\n\n过采样/欠采样只能用于训练数据。测试数据不应进行处理。因此，过采样/欠采样只能在创建了数据的训练/测试集划分之后进行，而不能在此之前进行。\n\n\
  1.  我们可以改变衡量模型准确率的方式。在我们之前讨论的欺诈检测案例中，准确率不应成为目标或应达成的参数。相反，我们应该关注召回率，将其作为需要优化和瞄准的参数。\n\
  \n\n\n2.  我们可以尝试一系列算法，而不是只关注某一类或某一种算法。这使我们能够检验和评估不同算法的有效性。研究发现，决策树在这种情况下通常表现良好。\n\
  \n3.  我们还可以实现一个 SMOTE 算法，该算法可以为我们生成或合成数据。SMOTE 是一种过采样技术，全称是系统化少数类过采样技术（Systematic\
  \ Minority Oversampling Technique）。\n\nSMOTE 的工作方式如下：\n    1.  它分析目标类的特征空间。\n\n\
  2.  然后检测最近邻，并选择相似的数据样本。通常，会使用距离度量选择两个或更多实例。\n\n3.  接着，在邻居的特征空间内，每次随机改变一个列的值。\n\n\
  4.  最后生成一个合成样本，该样本并非原始数据的精确副本。\n\n我们可以通过一个例子来学习。数据集是关于信用卡欺诈的，并且是不平衡的。我们将对其进行平衡处理。数据集和代码可在以下\
  \ Github 链接中找到：[`https://github.com/Apress/supervised-learning-w-python/tree/master/Chapter%205`](https://github.com/Apress/supervised-learning-w-python/tree/master/Chapter%25205)。\n\
  \n步骤 1：导入所有库。SMOTE 模块可能需要安装。\n\n```\n    import pandas as pd\n    from imblearn.over_sampling\
  \ import SMOTE\n    from imblearn.combine import  SMOTETomek\n    ```\n\n步骤 2：读取信用卡数据集。\n\
  \n```\n    credit_card_data_set = pd.read_csv('creditcard.csv')\n    ```\n\n步骤 3：首先创建\
  \ X 和 y 变量，然后使用 SMOTE 方法进行重采样。\n\n```\n    X = credit_card_data_set.iloc[:,:-1]\n\
  \    y = credit_card_data_set.iloc[:,-1].map({1:'Fraud', 0:'No Fraud'})\n    X_resampled,\
  \ y_resampled = SMOTE(sampling_strategy={\"Fraud\":500}).fit_resample(X, y)\n  \
  \  X_resampled = pd.DataFrame(X_resampled, columns=X.columns)\n    ```\n\n步骤 4：现在让我们看看原始数据集中各类别的百分比。\n\
  \n```\n    class_0_original = len(credit_card_data_set[credit_card_data_set.Class==0])\n\
  \    class_1_original = len(credit_card_data_set[credit_card_data_set.Class==1])\n\
  \    print(class_1_original/(class_0_original+class_1_original))\n    ```\n\n我们得到的结果是\
  \ 0.00172，即 0.172%。\n\n步骤 5：重采样后，让我们分析一下百分比分布。\n\n```\n    sampled_0 = len(y_sampled[y_sampled==0])\n\
  \    sampled_1 = len(y_sampled[y_sampled==1])\n    print(sampled_1/(sampled_0+sampled_1))\n\
  \    ```\n\n我们得到的结果是 50%。因此，数据集已从不平衡（低于 1%）平衡到了 50%。\n\nSMOTE 是处理类别不平衡的一种极好方法。它快速、易于执行，并且对于数值型数据能给出良好结果。但\
  \ SMOTE 在处理分类变量时可能会出错。例如，如果我们有一个分类变量“是否下雨”。这个变量只能取二值（即 0 或 1）。SMOTE 可能导致该变量出现小数，如\
  \ 0.55，这是不可能的。因此，在使用 SMOTE 时要小心！\n\n至此，我们完成了不平衡数据集的处理。这是我们面临的最重大挑战之一：它不仅影响机器学习模型，而且对准确率度量也有持久的影响。我们现在讨论数据集中遇到的异常值问题。\n\
  \n## 数据集中的异常值\n\n考虑一下。某企业日均销售额为 1000 美元。某天，一位顾客消费了 5000 美元。这条信息会使整个数据集发生偏斜。或者在一个天气预报数据集中，某城市的平均降雨量为\
  \ 100 厘米。但由于干旱季节，该季节没有降雨。这将完全改变我们从该数据中得出的推论。这样的数据点被称为*异常值*。\n\n异常值会对机器学习模型产生不利影响。我们面临的主要异常值问题如下：\n\
  \n![../images/499122_1_En_5_Chapter/499122_1_En_5_Fig5_HTML.jpg](img/499122_1_En_5_Fig5_HTML.jpg)\n\
  \n图 5-5\n\n异常值对回归方程的影响使其产生偏差\n\n1.  在存在异常值的情况下，我们的模型方程会受到严重影响，如图 5-5 所示。当存在异常值时，回归方程也会试图拟合它们，因此实际方程将不是最优的。\n\
  \n1.  异常值会使模型的估计产生偏差，并增加误差方差。\n\n2.  如果要进行统计检验，其功效和影响会受到严重影响。\n\n3.  总体而言，从数据分析的角度来看，我们无法信任模型的系数，因此模型得出的所有见解都将是有误的。\n\
  \n但与缺失值类似，异常值不一定都是坏的。我们必须应用业务逻辑来检查被标记为异常值的值是否真的是异常值，或者是一个有效的观测值。例如，在表 5-10 中，温度值看起来像是异常值，但一旦我们仔细观察，就可以推断出每当温度过高或过低时，目标变量“是否失败”的值都是“否”。\n\
  \n表 5-10\n\n温度的异常值不一定都是坏的，因此处理异常值时应谨慎\n\n| -![../images/499122_1_En_5_Chapter/499122_1_En_5_Figo_HTML.gif](img/499122_1_En_5_Figo_HTML.gif)\
  \ |\n\n因此，我们在处理异常值时应谨慎。不建议一刀切地删除异常值！\n\n检测异常值的方法有很多，包括以下几种：\n\n1.  回想一下我们在第 1 章讨论过的正态分布。如果一个值位于第\
  \ 5 百分位数和第 95 百分位数之外，或者第 1 百分位数和第 99 百分位数之外，我们可以将其视为异常值。\n\n2.  超出 –1.5 × IQR 和\
  \ +1.5 × IQR 范围的值可被视为异常值。这里的 IQR 是四分位距，计算公式为（第 75 百分位数的值）–（第 25 百分位数的值）。\n\n3. \
  \ 超出均值一个、两个或三个标准差的值可被称为异常值。\n\n4.  业务逻辑也有助于确定任何异常值以检测异常值。\n\n5.  我们可以通过箱线图或箱须图来可视化异常值。我们在前面的章节中创建过箱线图，并将在下一节中再次讨论。\n\
  \n我们可以通过多种方式处理异常值。在确定某个特定值是异常值并需要处理之后，我们可以执行以下操作：\n\n1.  完全删除异常值。这需要在确认可以删除异常值之后进行。\n\
  \n2.  对异常值进行封顶。例如，如果我们决定超出第 5 百分位数和第 95 百分位数的任何值都是异常值，那么超出这些范围的值将分别被限制在第 5 百分位数和第\
  \ 95 百分位数。\n\n3.  用均值、中位数或众数替换异常值。该方法与我们上一节讨论的缺失值处理方法类似。\n\n4.  有时，对变量取自然对数可以降低异常值的影响。但如果我们决定取自然对数，应再次采取谨慎的方法，因为它会改变实际值。\n\
  \n异常值对我们的数据集构成了巨大挑战。它们会使我们从数据中得出的见解发生偏斜。我们的系数会偏斜，模型也会产生偏差，因此我们应该认识到它们的影响。同时，我们不能忽视业务世界与异常值的关系，并判断该观测值是否是一个严重的异常值。\n\
  \n除了前面讨论的问题之外，现实世界的数据集还面临着其他一些挑战。我们将在下一节中讨论其中的一些挑战。\n\n\n\n## 数据集中的其他常见问题\n\n我们已经了解了数据集中最常见的问题，并研究了如何检测这些缺陷以及如何修复它们。但现实世界的数据集往往非常混乱且不干净，还有许多其他因素会影响分析的有效性。\n\
  \n我们在数据集中遇到的其他一些问题如下：\n\n1.  相关变量：如果自变量彼此相关，我们就无法衡量模型的真实能力。它也无法对自变量的预测能力产生正确的洞察。理解共线性的最佳方法是生成一个相关矩阵。这将引导我们找到相关的变量。我们应该测试输入变量的多种组合，如果准确率或伪\
  \ R² 没有显著下降，我们可以删除其中一个相关变量。我们在本书的前几章中已经处理过相关变量的问题。\n\n2.  有时整个列中只存在一个值。例如，在表 5-11\
  \ 中。\n\n表 5-11\n\n温度只有一个值，因此不添加任何信息\n\n| -![../images/499122_1_En_5_Chapter/499122_1_En_5_Figp_HTML.gif](img/499122_1_En_5_Figp_HTML.gif)\
  \ |\n\n温度恒为 1。它不会为我们的模型提供任何有意义的信息，因此删除此变量对我们最有利。\n\n3.  前一点的延伸情况是，某个特定变量只有两三个唯一值。例如，假设上述数据集有\
  \ 100,000 行。如果温度的唯一值只有 100 和 101，那么它也不会带来太多益处。不过，它可能和一个分类变量差不多。\n\n提示\n\n此类变量不会给模型增加任何东西，反而会不必要地降低伪\
  \ R²。\n\n1.  检测此类变量的另一种方法是检查它们的*方差*。第 1 点中讨论的变量方差将为 0，而第 2 点中讨论的变量方差会非常低。因此，我们可以检查变量的方差，如果低于某个阈值，我们可以进一步检查这些变量。\n\
  \n2.  同样重要的是，我们必须确保上一节数据发现阶段讨论的问题都已得到处理。如果没有，我们现在就必须处理它们并进行清理！\n\n以下是一些可以应用于变量的转换方法：\n\
  \n1.  标准化或 z-score：我们按照公式所示对变量进行转换。\n\n![$$ \\mathrm{Standardized}\\kern0.5em \\\
  mathrm{x}=\\frac{\\left(\\mathrm{x}-\\mathrm{mean}\\right)}{\\left(\\mathrm{standard}\\\
  kern0.5em \\mathrm{deviation}\\right)} $$](img/499122_1_En_5_Chapter_TeX_Equa.png)\n\
  \n这是最常用的技术。它使均值为 0，标准差为 1。\n\n2.  归一化用于将变量缩放到 0 和 1 之间，同时保留它们之间的比例范围。目标是使每个数据点具有相同的尺度，以便每个变量同等重要，如公式\
  \ 5-1 所示。\n\n![$$ \\mathrm{Normalized}\\;\\mathrm{x}=\\mathrm{x}-\\min \\left(\\\
  mathrm{x}\\right)\\hbox{-} \\hbox{-} \\left(\\max \\left(\\mathrm{x}\\right)-\\\
  min \\left(\\mathrm{x}\\right)\\right) $$](img/499122_1_En_5_Chapter_TeX_Equ1.png)\n\
  \n（公式 5-1）  \n3.  最小-最大归一化用于将数据缩放到 [0,1] 的范围；这意味着最大值被转换为 1，而最小值被赋值为 0。中间的所有其他值将获得\
  \ 0 到 1 之间的小数值，如公式 5-2 所示。\n\n![$$ \\mathrm{Normalized}\\;\\mathrm{x}=\\left(\\\
  mathrm{x}-{x}_{\\mathrm{min}}\\right)\\hbox{-} \\hbox{-} \\left({\\mathrm{x}}_{\\\
  mathrm{max}}-{\\mathrm{x}}_{\\mathrm{min}}\\right) $$](img/499122_1_En_5_Chapter_TeX_Equ2.png)\n\
  \n（公式 5-2）\n\n由于最小-最大归一化将数据缩放在 0 和 1 之间，因此如果数据集中存在异常值，它的表现并不理想。例如，如果数据有 100 个观测值，其中\
  \ 99 个观测值在 0 到 10 之间，而 1 个值为 50。由于 50 现在将被赋值为“1”，这将扭曲整个归一化后的数据集。\n\n4.  对变量进行对数变换是为了改变分布的形状，特别是用于处理数据集中的偏斜度。\n\
  \n5.  分箱用于将数值减少以进行分类。例如，年龄可以分为青年、中年和老年。\n\n这个数据清洗步骤并非易事。它确实是一个繁琐、迭代的过程。它考验耐心，并且需要商业洞察力、对数据集的理解、编码技能和常识。然而，我们进行的分析以及想要构建的机器学习模型的质量，都依赖于这一步。\n\
  \n现在，我们已经到了拥有数据集的阶段。它可能已经在一定程度上被清理干净，即使不是 100% 干净。\n\n我们现在可以进入 EDA 阶段，这是下一个主题。\n\
  \n\n\n## 第 4 步：探索性数据分析（EDA）\n\nEDA 是机器学习模型构建过程中最重要的步骤之一。我们检查所有变量，并理解它们的模式、相互依赖性、关系以及趋势。只有在\
  \ EDA 阶段，我们才能了解数据预期会如何表现。我们在此阶段从数据中发掘洞察和建议。强大的可视化效果能够完善整个 EDA 过程。\n\n提示\n\nEDA 是成功的关键。有时，恰当的\
  \ EDA 就能解决业务问题。\n\nEDA 与数据清洗阶段之间只有一线之隔。显然，数据准备、特征工程、EDA 和数据清洗这些阶段之间存在步骤重叠。\n\nEDA\
  \ 主要有两个分支：*单变量*分析和*双变量*分析。顾名思义，单变量分析是针对单个变量进行的。双变量分析则用于理解两个变量之间的关系。\n\n现在，我们将使用\
  \ Python 完成一个详细的案例。你可以按照以下步骤进行 EDA。为简洁起见，我们在此不粘贴所有结果。数据集和代码可在 Github 链接 [`https://github.com/Apress/supervised-learning-w-python/tree/master/Chapter%205`](https://github.com/Apress/supervised-learning-w-python/tree/master/Chapter%25205)\
  \ 处获取。\n\n步骤 1：导入必要的库。\n\n```\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot\
  \ as plt\n%matplotlib inline\n```\n\n步骤 2：加载数据文件。\n\n```\nmatches_df = pd.read_csv('matches.csv')\n\
