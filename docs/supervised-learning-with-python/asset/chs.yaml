- "# 4. 监督学习的高级算法\n\n> *“真正的智慧是一种在不失事物本质的前提下简化复杂事物的艺术。”*\n> \n> — 苏米特·辛格\n\n我们的生活是复杂的。我们每天都要应对复杂性——在家里、在工作中、在通勤路上、在家庭内部以及面对我们的职业目标时。通往成功的道路有很多，但成功的定义是主观且复杂的。我们总是努力寻找最佳要素来铺平通往成功的道路。\n\
  \n就像我们的生活一样，数据有时也可能极其复杂。我们需要更高级的算法、更精妙的技术、打破常规的方法和创新的流程来理解它。但任何解决方案、任何算法、任何方法和任何流程的核心，都是解决手头的业务问题。大多数业务问题都涉及如何增加利润和降低成本。利用这些先进的方法论，我们可以理解系统生成的复杂数据集。\n\
  \n在本书的前三章中，我们使用相当多的算法研究了用于回归和分类问题的机器学习。我们探讨了相关概念，并为它们开发了 Python 解决方案。在本章中，我们将研究高级算法。我们将学习这些算法，并为其开发数学概念和编码逻辑。我们不会只处理结构化数据。在本章中，我们还将处理非结构化数据集——文本和图像。\n\
  \n在本章中，我们将探讨诸如提升算法和支持向量机等高级算法。然后，我们将深入文本和图像数据的世界，并利用自然语言处理和图像分析的原理来解决此类挑战。深度学习用于解决复杂问题，因此我们将把深度学习应用于结构化数据和非结构化图像数据集。所有代码文件和数据集都附有逐步的解释。\n\
  \n\n\n## 所需技术工具包\n\n本书将使用 Python 3.5 或更高版本。建议你在自己的机器上安装好 Python。我们将使用 Jupyter notebook；执行代码需要安装\
  \ Anaconda-Navigator。所有数据集和代码均已上传至 Github 仓库 [`https://github.com/Apress/supervised-learning-w-python/tree/master/Chapter%204`](https://github.com/Apress/supervised-learning-w-python/tree/master/Chapter%25204)，方便下载和执行。\n\
  \n主要使用的库包括 numpy、pandas、matplotlib、seaborn、scikit learn 等。建议你在 Python 环境中安装这些库。本章将使用自然语言处理（NLP），因此会用到\
  \ NLTK 库和 RegexpTokenizer。此外，本章还需要 Keras 和 TensorFlow 库。\n\n接下来，让我们深入探讨基于集成的提升算法，并详细研究其概念！\n\
  \n## 提升算法\n\n回顾上一章，我们学习了集成建模技术。我们讨论了装袋算法，并使用随机森林创建了解决方案。本章将继续探讨集成建模技术。下一个算法是提升算法。\n\
  \n正式地说，提升是一种集成方法，它通过弱分类器构建出一个强分类器。我们按顺序创建一个新模型，同时确保从先前模型的错误或误分类中学习，如图 4-1 所示。其核心思想是赋予错误更高的权重，并随后改进建模，最终得到一个非常强大的模型。\n\
  \n最初，从训练数据集中抽取一个子集，所有数据点被赋予相同的权重。我们创建模型的基础版本（称之为 M1），然后根据错误预测计算损失。在下一轮迭代中，被错误分类的数据点被赋予更高的权重，并创建另一个模型（称之为\
  \ M2）。其思路是 M2 会比 M1 更好，因为它正在改进并试图纠正 M1 的错误。这个过程持续进行，创建多个模型，每个模型都在改进前一个模型。最终模型是所有先前模型的加权平均值。最终模型充当一个强学习器。\n\
  \n![../images/499122_1_En_4_Chapter/499122_1_En_4_Fig1_HTML.jpg](img/499122_1_En_4_Fig1_HTML.jpg)\n\
  \n图 4-1\n\n提升算法迭代地工作，在给错误分配更高权重的同时改进先前版本\n\n提升算法有多种类型：\n\n![../images/499122_1_En_4_Chapter/499122_1_En_4_Fig2_HTML.png](img/499122_1_En_4_Fig2_HTML.png)\n\
  \n图 4-2\n\n其他提升算法采用基于层级的方法，而基于叶子的方法使得轻量梯度提升非常适合大型数据集\n\n1.  **梯度提升**：梯度提升可用于分类和回归问题。例如，回归树可用作基学习器，后续的每棵树都是对前一棵树的改进。整体学习器会逐步改进那些残差最初较高的观测值。\n\
  \n梯度提升的特性如下：\n    1.  通过取完整数据集的一个子集来创建基学习器。\n\n2.  识别困难观测值，或者通过识别前一个模型中残差的值来进行*偏移*。\n\
  \n3.  通过计算出的梯度来识别误分类。这是该算法的核心思想。它创建新的基学习器，这些学习器与损失函数的负梯度具有最大相关性，而负梯度又与完整的集成解决方案相关联。\n\
  \n4.  然后进一步剖析误差成分，以添加更多关于残差的信息。\n\n2.  **AdaBoosting**：AdaBoosting 或自适应提升被视为梯度提升的一种特殊情况，其中通过迭代创建模型来改进前一个模型。最初，使用数据子集创建一个基础模型，并用它对完整数据集进行预测。我们通过计算误差来衡量性能。然后在创建下一个模型时，被错误预测的数据点被赋予更高的权重。权重与误差成正比；也就是说，误差越大，分配的权重越高。因此，创建的下一个模型是对前一个模型的改进，这个过程持续进行。一旦无法进一步降低误差，过程就会停止，我们得出结论：已经达到了最终模型，即最佳模型。\n\
  \nAdaBoost 具有以下特性：\n    1.  在 AdaBoost 中，通过给上一步中误分类的观测值分配更高的权重来进行偏移。\n\n2.  误分类通过高权重的观测值来识别。\n\
  \n\n\n3.  AdaBoost 中的指数损失函数会为在前一个模型中拟合不佳的样本分配更大的权重值。\n\n3.  **极限梯度提升**：XGB 的极限梯度提升是一种先进的提升算法。它最近变得非常流行，并赢得了许多数据科学和机器学习竞赛。它极其精确，并且实现起来速度相当快。\n\
  \nXGB 的特性如下：\n    1.  XGB 是一个相当快速的算法，因为它支持并行处理，因此比标准梯度提升更快。\n\n2.  它通过实施正则化技术来处理过拟合。\n\
  \n3.  它能很好地处理含有缺失值的混乱数据集，因为它内置了处理数据集中缺失值的机制。这是其最大的优势之一，因为我们无需处理数据中存在的缺失值。\n\n4.\
  \  它是一个相当灵活的算法，允许我们拥有自定义的优化目标和评估标准。\n\n5.  每次迭代中的交叉验证会产生最佳的提升迭代次数，这使其成为比同类算法更好的选择。\n\
  \n4.  **CatBoost**：如果我们要处理分类变量，CatBoost 是一个极好的解决方案。在典型的机器学习模型中，我们使用独热编码来处理分类变量。例如，如果我们有一个数据集包含分类变量“城市”，我们将其转换为数值变量，如表\
  \ 4-1 所示。\n\n表 4-1\n\n将分类变量转换为数值变量的独热编码\n\n| ![../images/499122_1_En_4_Chapter/499122_1_En_4_Figa_HTML.gif](img/499122_1_En_4_Figa_HTML.gif)\
  \ |\n\n但是，如果变量“城市”有 100 个唯一值，独热编码将导致在数据集中增加 100 个额外的维度。此外，生成的数据集将相当*稀疏*。稀疏性意味着对于某一列，只有少数几行是\
  \ 1；其余的都是 0。例如，在表 4-1 中，东京只有一个值为 1。这意味着矩阵包含的 0 比 1 多。因此，跨列的性能操作将花费很长时间。此外，如果结果维度数量太大，那么我们将需要巨大的内存。\n\
  \nCatBoost 没有这个问题。CatBoost 在内部处理分类变量，我们无需花时间处理它们。\n\n5.  **轻量梯度提升**：顾名思义，轻量梯度提升在计算上比同类算法更经济。如果数据集非常大，它是提升算法的首选。它实现了基于树的算法，并使用基于叶子的方法，而其他算法则使用基于层级的方法，如图\
  \ 4-2 所示。\n\n我们现在已经讨论了不同类型的提升算法。根据手头的业务问题和可用的数据集，我们会优先选择一种方法而非另一种。最近，极限梯度提升或 XGB\
  \ 获得了很大的 popularity。它是一种相当稳健的技术，能提供更好的结果，并在内部处理过拟合。\n\n我们现在将使用梯度提升算法在 Python 中实现一个案例。\n\
  \n### 使用梯度提升算法\n\n在本案例研究中，我们将实现多种算法。到目前为止，我们已经学习了多种算法，其中一些是基于集成的先进算法。现在是时候比较它们各自的准确率了。\n\
  \n我们将执行探索性数据分析（EDA），创建训练-测试分割，然后实现决策树、随机森林、装袋、AdaBoost 和梯度提升算法。最后，我们将比较所有算法各自的性能。\n\
