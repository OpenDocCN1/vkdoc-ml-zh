- "# 2. 监督学习在回归分析中的应用\n\n> *“唯一确定的就是不确定性。”*\n> \n> ——老普林尼\n\n未来无疑充满不确定性。我们所能做的最好就是为之规划。而要进行周密的规划，我们需要对未来有所预见。如果我们能提前知道产品的预期需求量，就能进行恰到好处的生产——不多也不少。如果我们知道货物的预期流量，就能纠正供应链中的瓶颈。机场如果能预知旅客的预期流入量，就能更好地规划资源。电商门户网站如果能知道即将到来的促销季预计会有多少次点击，就能规划好预期负载。\n\
  \n准确预测或许不可能，但预测这些数值确实是必要的。无论是否采用基于机器学习的预测模型，人们一直在进行这类预测，用于财务预算规划、资源分配、政策指导、预期增长率等。因此，对这些数值的估算至关重要。在第二章中，我们将学习预测这些数值的具体概念。\n\
  \n在第一章中，我们介绍了监督学习。我们还讨论了监督学习、无监督学习和半监督学习之间的区别。我们也探讨了两种监督学习算法：回归和分类。在第二章中，我们将深入研究监督回归算法的更深层概念。\n\
  \n我们将研究回归过程、模型如何训练、幕后流程，以及最终所有算法的执行。我们将学习每种算法的假设条件、优缺点以及背后的统计原理。我们还将使用 Python 编写代码来实现这些算法。数据准备、数据预处理、变量创建、训练-测试集划分、拟合机器学习模型、获取显著变量以及衡量准确率等步骤，都将通过\
  \ Python 进行学习和实现。代码和数据集已上传至 GitHub 仓库，方便获取。建议您亲自复现这些代码。\n\n## 所需技术工具包\n\n本书将使用 Python\
  \ 3.5 或更高版本。建议您在机器上安装 Python。我们将使用 Jupyter notebook；执行代码需要安装 Anaconda-Navigator。所有数据集和代码均已上传至\
  \ GitHub 仓库 [`https://github.com/Apress/supervised-learning-w-python/tree/master/Chapter2`](https://github.com/Apress/supervised-learning-w-python/tree/master/Chapter2)，方便下载和执行。\n\
  \n主要使用的库包括 numpy、pandas、matplotlib、seaborn、scikit learn 等。建议您在 Python 环境中安装这些库。\n\
  \n现在，让我们深入回归分析，详细探讨相关概念！\n\n## 回归分析与用例\n\n回归分析用于估算一个*连续*变量的值。回顾一下，连续变量是可以取任意数值的变量；例如，销售额、降雨量、客户数量、交易数量等。如果我们想估算下个月的销售额、下周预计到达航站楼的旅客人数、或者预计进行银行交易的客户数量，我们就会使用回归分析。\n\
  \n简单来说，如果我们想使用监督学习算法来预测一个连续变量的值，就会使用回归方法。回归分析对于解决商业问题和决策制定至关重要。预测值有助于利益相关者相应地分配资源，并为业务的预期增长或下滑做好规划。\n\
  \n以下用例将清晰地说明回归算法的用途：\n\n1.  零售商希望估算即将到来的促销季可能迎来的客户数量。基于此估算，企业可以规划商品库存、所需员工数量、所需资源等，以满足需求。回归算法有助于进行此类估算。\n\
  \n2.  一家制造工厂正在进行年度预算规划。作为该工作的一部分，需要根据预期需求来估算电费、水费、原材料、人力资源等各个项目下的支出。回归算法有助于分析历史数据并为业务生成估算值。\n\
  \n3.  一家房地产中介希望扩大其客户群。其中一个重要属性是公寓的价格，可以合理地进行调整和设定。该中介希望分析影响房产价格的多个参数，这可以通过回归分析来实现。\n\
  \n4.  一家国际机场希望改进规划并衡量下个月的预期客流量。这将使团队能够维持最佳服务质量。回归分析有助于此，并能估算出预计的旅客数量。\n\n5.  一家向客户提供信用卡的银行需要确定应向新客户提供多少信用额度。需要根据客户的年龄、职业、月薪、支出、历史记录等详细信息来规定信用额度。监督回归算法将对此决策有所帮助。\n\
  \n有相当多的统计算法可用于解决回归问题。主要算法列举如下：\n\n1.  线性回归\n\n2.  决策树\n\n3.  随机森林\n\n4.  支持向量机\n\
  \n5.  贝叶斯方法\n\n6.  神经网络\n\n我们将在本章学习前三种算法，其余算法将在第 4 章学习。下一节我们将从线性回归开始。\n\n\n\n##\
  \ 什么是线性回归\n\n回顾第一章 1 中我们讨论的利用面积、卧室数量、阳台、位置等因素预测房价的问题。图 2-1(i)展示了数据在向量空间图中的表示方式，而右侧的图\
  \ 2-1(ii)则提出了一种机器学习方程，称为最佳拟合线，用于解释数据中的随机性并预测价格。\n\n![../images/499122_1_En_2_Chapter/499122_1_En_2_Fig1_HTML.png](img/499122_1_En_2_Fig1_HTML.png)\n\
  \n图 2-1\n\n(i) 向量空间图中的数据展示了价格如何依赖于各种变量。(ii) 使用一种称为最佳拟合线的机器学习回归方程来建模这种关系，该方程可用于对未见过的数据集进行未来预测。\n\
  \n在前面的例子中，我们假设价格与面积、卧室数量等因素相关。我们在上一章讨论了*相关性*。让我们回顾一下关于相关性的要点：\n\n*   相关性分析用于衡量两个变量之间关联（线性关系）的强度。\n\
  \n*   如果两个变量同向变动，则它们呈正相关。例如：身高和体重呈正相关关系。如果两个变量反向变动，则它们呈负相关。例如，成本与利润呈负相关关系。\n\n*\
  \   相关系数的取值范围为 –1 到 +1。如果值为 –1，则为绝对负相关；如果值为 +1，则为绝对正相关。\n\n*   如果相关性为 0，则意味着两者之间关系不大。例如，鞋子和电脑的价格相关性较低。\n\
  \n线性回归分析的目的是衡量这种关系，并得出该关系的数学方程。该关系可用于预测未见数据点的值。例如，在房价问题中，预测房屋价格将是分析的目标。\n\n正式地说，线性回归用于根据至少一个自变量的值来预测因变量的值。它还能解释自变量的变化对因变量的影响。因变量也称为目标变量或*内生*变量。自变量也称为解释变量或*外生*变量。\n\
  \n线性回归已经存在了很长时间。尽管有相当多的先进算法（其中一些我们将在后续章节讨论），但线性回归仍然被广泛使用。它作为一个基准模型，通常是研究监督学习的第一步。建议你在学习更高级的算法之前，先深入理解和仔细研究线性回归。\n\
  \n假设我们有一组 x 和 Y 的观测值，其中 x 是自变量，Y 是因变量。方程 2-1 描述了 x 和 Y 之间的线性关系：\n\n![$$ {\\mathrm{Y}}_{\\\
  mathrm{i}}={\\upbeta}_0+{\\upbeta}_1{\\mathrm{x}}_{\\mathrm{i}}+{\\upvarepsilon}_{\\\
  mathrm{i}} $$](img/499122_1_En_2_Chapter_TeX_Equ1.png)\n\n(方程 2-1)\n\n其中\n\nY[i]\
  \ = *因*变量或我们想要预测的目标变量\n\nx[i] = *自*变量或用于预测 Y 值的预测变量\n\nβ[0] = 总体 Y *截距*。它表示当 x[i]\
  \ 的值为零时 Y 的值\n\nβ[1] = 总体斜率*系数*。它表示 x[i] 每变化一个单位时，Y 值的预期变化\n\nε = 模型中的*随机误差*项\n\n\
  有时，β[0] 和 β[1] 被称为*总体模型系数*。\n\n在上面的方程中，我们假设 Y 的变化是由 x 的变化引起的。因此，我们可以使用该方程来预测 Y 的值。数据和方程\
  \ 2-1 的表示将如图 2-2 所示。\n\n![../images/499122_1_En_2_Chapter/499122_1_En_2_Fig2_HTML.jpg](img/499122_1_En_2_Fig2_HTML.jpg)\n\
  \n图 2-2\n\n在图表上描绘的线性回归方程，显示了截距、斜率以及目标变量的实际值和预测值；红线表示最佳拟合线\n\n这些模型系数（β[0] 和 β[1]）起着重要作用。Y\
  \ 截距（β[0]）是当自变量值为 0 时因变量的值，即因变量的默认值。斜率（β[1]）是方程的斜率。它表示 x 值每变化一个单位时，Y 值的预期变化。它衡量了\
  \ x 对 Y 值的影响程度。β[1] 的绝对值越高，最终影响越大。\n\n图 2-2 也显示了预测值。我们可以理解，对于观测值 i 的 x 值，因变量的实际值是\
  \ *Y*[i]，而预测值或估计值是 ![$$ \\hat{Y_{\\mathrm{i}}} $$](img/499122_1_En_2_Chapter_TeX_IEq1.png)。\n\
  \n这里还有一个术语，*随机误差*，用 ε 表示。在我们做出估计之后，我们想知道我们的表现如何，即预测值与实际值相差多远。这由随机误差表示，它是 Y 的预测值与实际值之差，由\
  \ ![$$ \\varepsilon =\\left(\\hat{Y_1}-{Y}_{\\mathrm{i}}\\right) $$](img/499122_1_En_2_Chapter_TeX_IEq2.png)\
  \ 给出。需要注意的是，这个误差值越小，预测效果越好。\n\n这里还有一个重要的点需要考虑。可能存在多条线都可以表示这种关系。例如，在房价预测问题中，我们可以使用许多方程来确定关系，如图\
  \ 2-3(ii) 中不同颜色的线条所示。\n\n![../images/499122_1_En_2_Chapter/499122_1_En_2_Fig3_HTML.png](img/499122_1_En_2_Fig3_HTML.png)\n\
  \n图 2-3\n\n(i) 向量空间图中的数据展示了价格如何依赖于各种变量。(ii) 在尝试对数据进行建模时，可能存在多条可以拟合的线性方程，但目标是找到能够使当前数据损失最小的方程。\n\
  \n因此，我们需要找出能够最小化随机误差的最佳数学方程，从而用于进行预测。这是在回归算法的训练过程中实现的。在训练线性回归模型的过程中，我们得到 β[0] 和\
  \ β[1] 的值，这些值将最小化误差，并可用于为我们生成预测。\n\n线性回归模型对所使用的数据做出了一些假设。这些条件是检验我们分析的数据是否满足要求的试金石。通常情况下，数据*并不*符合这些假设，因此我们必须采取纠正措施使其变得更好。现在将讨论这些假设。\n\
  \n\n\n### 线性回归的假设\n\n线性回归有一些需要满足的假设。我们需要检验这些条件，并根据结果决定后续步骤：\n\n![../images/499122_1_En_2_Chapter/499122_1_En_2_Fig5_HTML.jpg](img/499122_1_En_2_Fig5_HTML.jpg)\n\
  \n图 2-5\n\n数据集中存在异方差性，因此残差散点图呈现锥形形状\n\n1.  线性回归要求因变量与自变量之间的关系是线性的。同时，检查异常值也很重要，因为线性回归对异常值敏感。线性假设最好通过散点图来检验。在图\
  \ 2-4 中，我们可以看到线性关系与非线性关系的含义。左侧的图呈现某种线性关系，而右侧的图则没有线性关系。\n\n![../images/499122_1_En_2_Chapter/499122_1_En_2_Fig4_HTML.jpg](img/499122_1_En_2_Fig4_HTML.jpg)\n\
  \n图 2-4\n\n(i) X 与 Y 之间存在线性关系。(ii) X 与 Y 变量之间没有太多关系；在这种情况下，将难以对关系进行建模。\n\n2.  线性回归要求所有自变量服从多元正态分布。该假设可以通过直方图或\
  \ Q-Q 图来检验。正态性可以通过拟合优度检验（如 Kolmogorov-Smirnov 检验）来检查。如果数据不服从正态分布，可以采用非线性变换（如对数变换）来解决问题。\n\
  \n3.  第三个假设是数据中几乎没有或完全没有*多重共线性*。当自变量之间高度相关时，就会产生多重共线性。多重共线性可以通过三种方法检验：\n    1. \
  \ **相关矩阵**：该方法测量所有自变量之间的皮尔逊双变量相关系数。该值越接近 1 或 –1，相关性越高。\n\n2.  **容忍度**：容忍度仅在回归分析过程中得出，用于衡量一个自变量对其他自变量的影响程度。其表示为\
  \ (1 – R²)。我们将在下一节讨论 R²。如果容忍度值 < 0.1，则数据中可能存在多重共线性。如果小于 0.01，则可以确定确实存在多重共线性。\n\n\
  3.  **方差膨胀因子 (VIF)**：VIF 可定义为容忍度的倒数 (1/T)。如果 VIF 值大于 10，则数据中可能存在多重共线性。如果大于 100，则可以确定确实存在多重共线性。\n\
  \n**注意** 对数据进行中心化处理（从每个分数中减去均值）有助于解决多重共线性问题。我们将在第 5 章详细讨论这一点！\n\n4.  线性回归假设数据中几乎没有或完全没有*自相关*。自相关意味着残差之间并非相互独立。自相关数据的最佳示例是时间序列数据，例如股票价格。T[n+1]\
  \ 时刻的股票价格依赖于 T[n] 时刻的价格。虽然我们使用散点图来检查自相关，但也可以使用德宾-沃森“d 检验”来检查自相关。其原假设是残差不存在自相关。如果\
  \ d 值在 2 左右，则意味着不存在自相关。通常 d 可以取 0 到 4 之间的任何值，但根据经验法则，1.5 < d < 2.5 意味着数据中不存在自相关。但德宾-沃森检验有一个缺陷。由于它仅分析线性自相关且仅分析直接相邻项，因此很多时候散点图就能满足我们的需求。\n\
  \n5.  线性回归问题的最后一个假设是*同方差性*，这意味着残差在回归线上是相等的。虽然可以使用散点图来检查同方差性，但也可以使用戈德菲尔德-匡特检验来检查异方差性。该检验将数据分为两组，然后检验两组之间残差的方差是否相似。图\
  \ 2-5 展示了一个非同方差残差的示例。在这种情况下，我们可以进行非线性校正来解决问题。如图 2-5 所示，异方差性导致残差图中出现独特的锥形形状。\n\n\
  检验这些假设至关重要，我们通常会对数据进行转换和清洗。这是必要的，因为我们希望解决方案能够良好运行并具有较高的预测精度。一个准确的机器学习模型将具有较低的损失。机器学习模型的这种精度测量过程基于目标变量。对于分类问题和回归问题，其测量方法不同。在本章中，我们讨论回归基础模型，而在下一章中，我们将研究分类模型的精度测量参数。这引出了衡量回归问题精度的重要主题，这也是我们接下来要讨论的话题。\n\
  \n\n\n## 衡量回归问题的效能\n\n衡量回归问题稳健性的方法有多种。*普通最小二乘法（OLS）* 是最常用且被引用最多的方法之一。在该方法中，通过找到使\
  \ Y 与 ![$$ \\hat{Y} $$](img/499122_1_En_2_Chapter_TeX_IEq3.png) 之间平方距离之和最小的 β[0]\
  \ 和 β[1] 值来获得它们，这里的 Y 和 ![$$ \\hat{Y} $$](img/499122_1_En_2_Chapter_TeX_IEq3.png)\
  \ 分别代表因变量的实际值和预测值，如图 2-6 所示。这被称为*损失函数*，即进行预测时产生的损失。毋庸置疑，我们希望最小化这个损失以获得最佳模型。这些误差也被称为*残差*。\n\
  \n![../images/499122_1_En_2_Chapter/499122_1_En_2_Fig6_HTML.jpg](img/499122_1_En_2_Fig6_HTML.jpg)\n\
  \n图 2-6\n\n目标变量的实际值与预测值之间的差异。这是在做出预测时产生的误差，作为最佳模型，需要将此误差最小化。\n\n一个非常重要的点：为什么我们要对误差取平方？原因是，如果我们不对误差取平方，正负项可能会相互抵消。例如，如果误差[1]是\
  \ +2，误差[2]是 -2，那么净误差将是 0！\n\n从图 2-6 中，我们可以得出\n\n![$$ {\\displaystyle \\begin{array}{l}\\\
  mathrm{Minimum}\\kern0.17em \\mathrm{squared}\\;\\mathrm{sum}\\;\\mathrm{of}\\kern0.17em\
  \ \\mathrm{error}=\\min\\;\\Sigma\\;{\\mathrm{e}}_{\\mathrm{i}}²\\\\ {}\\kern7.799994em\
  \ =\\min\\;\\Sigma\\;\\left({\\mathrm{Y}}_{\\mathrm{i}}-\\hat{{\\mathrm{Y}}_{\\\
  mathrm{i}}}\\right)\\\\ {}\\kern5.279997em =\\min\\;\\Sigma\\;{\\left[{\\mathrm{Y}}_{\\\
  mathrm{i}}-\\left({\\upbeta}_0+{\\upbeta}_1{\\mathrm{x}}_{\\mathrm{i}}\\right)\\\
  right]}²\\end{array}} $$](images/499122_1_En_2_Chapter/499122_1_En_2_Chapter_TeX_Equ2.png)\n\
  \n（公式 2-2）\n\n估计的斜率系数为\n\n![$$ {\\upbeta}_1={\\Sigma^{\\mathrm{n}}}_{\\mathrm{i}=1}\\\
  ;\\left({\\mathrm{x}}_{\\mathrm{i}}-\\overline{x}\\right)\\;\\left({\\mathrm{y}}_{\\\
  mathrm{i}}-\\overline{y}\\right)----{\\Sigma^{\\mathrm{n}}}_{\\mathrm{i}=1}\\;{\\\
  left({\\mathrm{x}}_{\\mathrm{i}}-\\overline{x}\\right)}² $$](img/499122_1_En_2_Chapter_TeX_Equ3.png)\n\
  \n（公式 2-3）\n\n估计的截距系数为\n\n![$$ {\\upbeta}_0=\\overline{y}-{\\mathrm{b}}_1\\;\\overline{x}\
  \ $$](img/499122_1_En_2_Chapter_TeX_Equ4.png)\n\n（公式 2-4）\n\n需要注意的一点是，回归线总是经过均值点\
  \ ![$$ \\overline{x} $$](img/499122_1_En_2_Chapter_TeX_IEq4.png) 和 ![$$ \\overline{y}\
  \ $$](img/499122_1_En_2_Chapter_TeX_IEq5.png)。\n\n基于上述讨论，我们可以研究变异度量。总变异由两部分组成，可以用以下公式表示：\n\
  \n![$$ {\\displaystyle \\begin{array}{l} SST= SSR+ SSE\\\\ {}\\mathrm{Total}\\;\\\
  mathrm{sum}\\;\\mathrm{of}\\kern0.17em \\mathrm{squares}=\\mathrm{Regression}\\\
  ;\\mathrm{sum}\\;\\mathrm{of}\\ \\mathrm{squares}+\\mathrm{Error}\\;\\mathrm{sum}\\\
  ;\\mathrm{of}\\kern0.17em \\mathrm{squares}\\\\ {} SST=\\Sigma\\;{\\left({\\mathrm{y}}_{\\\
  mathrm{i}}-\\overline{y}\\right)}²\\kern1.56em SSR=\\Sigma\\;{\\left({\\hat{Y}}_{\\\
  mathrm{i}}-\\overline{y}\\right)}²\\kern2.4em SSE=\\Sigma\\;{\\left({\\mathrm{y}}_{\\\
  mathrm{i}}-{\\hat{Y}}_{\\mathrm{i}}\\right)}²\\end{array}} $$](img/499122_1_En_2_Chapter_TeX_Equa.png)\n\
  \n其中 ![$$ \\overline{y} $$](img/499122_1_En_2_Chapter_TeX_IEq6.png)：因变量的平均值\n\n\
  Y[i]：因变量的观测值\n\n![$$ \\overline{y} $$](img/499122_1_En_2_Chapter_TeX_IEq7.png)：对于给定\
  \ xi 值的 y 的预测值\n\n在上式中，SST 是总平方和。它衡量 y[i] 围绕其均值 ![$$ \\overline{y} $$](img/499122_1_En_2_Chapter_TeX_IEq8.png)\
  \ 的变异。SSR 是回归平方和，是由 x 和 y 之间的线性关系所解释的变异。SSE 是误差平方和，是由 x 和 y 之间线性关系以外的因素引起的变异。理解这一概念的最佳方式是通过图\
  \ 2-7。\n\n![../images/499122_1_En_2_Chapter/499122_1_En_2_Fig7_HTML.png](img/499122_1_En_2_Fig7_HTML.png)\n\
  \n图 2-7\n\nSST = 总平方和：SSE = 误差平方和，SSR = 回归平方和\n\n上述讨论的概念为我们研究各种衡量回归模型准确性的度量和参数奠定了基础，我们现在就来讨论这些内容：\n\
  \n1.  平均绝对误差（MAE）：顾名思义，它是目标变量实际值与预测值之间绝对差的平均值，如公式 2-5 所示。\n\n![$$ \\mathrm{Mean}\\\
  kern0.17em \\mathrm{Absolute}\\kern0.17em \\mathrm{error}=\\frac{\\Sigma\\;\\left(\\\
  left|{\\hat{Y}}_{\\mathrm{i}}-{y}_{\\mathrm{i}}\\right|\\right)}{\\mathrm{n}} $$](img/499122_1_En_2_Chapter_TeX_Equ5.png)\n\
  \n（公式 2-5）\n\nMAE 的值越大，我们模型中的误差就越大。\n\n1.  均方误差（MSE）：MSE 是误差平方的平均值，即实际值与预测值之差的平方的平均值，如公式\
  \ 2-6 所示。与 MAE 类似，MSE 值越高意味着模型中的误差越大。\n\n![$$ \\mathrm{Mean}\\kern0.17em \\mathrm{squared}\\\
  kern0.17em \\mathrm{error}=\\frac{\\Sigma\\;{\\left(\\left|{\\hat{Y}}_{\\mathrm{i}}-{y}_{\\\
  mathrm{i}}\\right|\\right)}²}{\\mathrm{n}} $$](img/499122_1_En_2_Chapter_TeX_Equ6.png)\n\
  \n（公式 2-6）\n\n1.  均方根误差（Root MSE）：均方根误差是平均平方误差的平方根，由公式 2-7 表示。\n\n![$$ \\mathrm{Root}\\\
  kern0.17em \\mathrm{mean}\\kern0.17em \\mathrm{squared}\\kern0.17em \\mathrm{error}=\\\
  sqrt{\\frac{\\Sigma\\;{\\left(\\left|{\\hat{Y}}_{\\mathrm{i}}-{y}_{\\mathrm{i}}\\\
  right|\\right)}²}{\\mathrm{n}}} $$](img/499122_1_En_2_Chapter_TeX_Equ7.png)\n\n\
  （公式 2-7）\n\n1.  R 平方（R²）：它表示我们的模型能够解释数据中多少随机性。换句话说，在我们的数据总变异中，我们的模型能够解释多少。\n\nR²\
  \ = SSR/SST = 回归平方和/总平方和\n\nR² 的值总是在 0 到 1 之间，或 0% 到 100% 之间。R² 的值越高越好。可视化 R² 的方式如下图所示。在图\
  \ 2-8 中，R² 的值等于 1，这意味着 Y 值中 100% 的变异都可以由 x 解释。在图 2-9 中，R² 的值介于 0 和 1 之间，表明模型理解了部分变异。在最后一种情况，图\
  \ 2-9 中，R² = 0，这表明模型没有理解任何变异。在正常的业务场景中，我们得到的 R² 介于 0 和 1 之间，即模型解释了部分变异。\n\n![../images/499122_1_En_2_Chapter/499122_1_En_2_Fig9_HTML.jpg](img/499122_1_En_2_Fig9_HTML.jpg)\n\
  \n图 2-9\n\n如果 R² 的值介于 0 和 1 之间，则模型解释了部分变异。如果值为 0，则回归模型没有解释任何变异\n\n![../images/499122_1_En_2_Chapter/499122_1_En_2_Fig8_HTML.jpg](img/499122_1_En_2_Fig8_HTML.jpg)\n\
  \n图 2-8\n\nR² 等于 1；这表明我们的回归模型解释了自变量值中 100% 的变异\n\n\n\n2.  **伪 R 方**：它扩展了 R 方的概念。如果我们在模型中包含不显著的变量，它会惩罚该值。我们可以按照公式\
  \ 2-8 计算伪 R²。\n\n![$$ \\mathrm{Pseudo}\\;{\\mathrm{R}}²=1-\\frac{\\frac{SSE}{\\\
  left(\\mathrm{n}\\hbox{-} \\mathrm{k}\\hbox{-} 1\\right)}}{\\frac{SST}{\\left(\\\
  mathrm{n}\\hbox{-} 1\\right)}} $$](img/499122_1_En_2_Chapter_TeX_Equ8.png)\n\n（公式\
  \ 2-8）\n\n其中，n 是样本量，k 是自变量的数量。\n\n使用 R 方，我们衡量模型中解释的所有随机性。但是，如果我们包含所有自变量（包括不显著的变量），我们就不能声称该模型是稳健的。因此，我们可以说伪\
  \ R 方是衡量模型稳健性的更好表示和度量。\n\n**提示**\n\n在 R² 和伪 R² 之间，我们更倾向于使用伪 R²。该值越高，模型越好。\n\n现在，我们清楚了回归模型的假设以及如何衡量回归模型的性能。接下来，让我们研究线性回归的类型，然后开发一个\
  \ Python 解决方案。\n\n线性回归可以研究两种形式：简单线性回归和多元线性回归。\n\n**简单线性回归**，顾名思义，易于理解和应用。它仅使用一个自变量来预测目标变量的值。如前一个例子所示，如果我们只有房屋面积作为自变量来预测房价，这就是一个简单线性回归的例子。样本数据仅包含面积和价格，如下所示。在图\
  \ 2-10 中，我们展示了相同数据的散点图。\n\n![../images/499122_1_En_2_Chapter/499122_1_En_2_Fig10_HTML.jpg](img/499122_1_En_2_Fig10_HTML.jpg)\n\
  \n图 2-10\n\n价格与面积数据的散点图\n\n| 平方英尺 (x) | 价格 (单位：千美元) |\n| --- | --- |\n| 1200 | 100\
  \ |\n| 1500 | 120 |\n| 1600 | 125 |\n| 1100 | 95 |\n| 1500 | 125 |\n| 2200 | 200\
  \ |\n| 2100 | 195 |\n| 1410 | 110 |\n\n我们可以用公式 2-9 表示这些数据。\n\n![$$ \\mathrm{Price}={\\\
  upbeta}_0+{\\upbeta}_1\\mathrm{x}\\;\\mathrm{Area} $$](img/499122_1_En_2_Chapter_TeX_Equ9.png)\n\
  \n（公式 2-9）\n\n这里，价格是 Y（因变量），面积是 x 变量（自变量）。简单线性回归的目标是估计 β[0] 和 β[1] 的值，以便我们能够预测价格的值。\n\
  \n如果我们运行回归分析，我们将得到系数 β[0] 和 β[1] 的相应值，分别为 –28.07 和 0.10。稍后我们将使用 Python 运行代码，但让我们先解释其含义以便理解。\n\
  \n1.  β[0] 的值为 –28.07，意味着当平方英尺数为 0 时，价格为 –28,070 美元。现在，不可能有面积为 0 的房子；这只是表明，对于观察到的尺寸范围内的房屋，28,070\
  \ 美元是房价中未被面积解释的部分。\n\n2.  β[1] 为 0.10；这表明，房屋的平均价值每增加一平方英尺，平均增加 0.1 × (1000) = 100\
  \ 美元。\n\n线性回归有一个重要的局限性。我们不能用它来预测超出训练所用变量范围的值。例如，在前面的数据集中，我们无法建模预测面积在 2200 平方英尺以上和\
  \ 1100 平方英尺以下的房价。这是因为我们没有针对这些值训练模型。因此，该模型仅对最小值和最大值之间的值足够有效；在前面的例子中，有效范围是 1100 平方英尺到\
  \ 2200 平方英尺。\n\n是时候动手实践，使用 Python 中的数据集来解决问题了。我们使用 Python，以下是 Python 代码中的一些重要属性。这些属性在我们训练数据、设置参数和进行预测时使用：\n\
  \n*   **常见超参数**\n    *   `fit_intercept`：如果我们想计算模型的截距，则使用此参数；如果数据已中心化，则不需要。\n  \
  \  *   `normalize`：X 将通过减去均值并除以标准差进行归一化。\n    *   在将数据输入模型之前进行标准化，系数可以表明特征的重要性。\n\
  *   **常见属性**\n    *   `coef_`：每个自变量的权重。\n    *   `intercept_`：线性模型中独立项的偏置。\n*  \
  \ **常见函数**\n    *   `fit`：训练模型。将 X 和 Y 作为输入值并训练模型。\n    *   `predict`：模型训练完成后，对于给定的\
  \ X，可以使用 `predict` 函数预测 Y。\n*   **训练模型**\n    *   X 应为数据行格式，`X.ndim == 2`。\n   \
  \ *   对于单个目标，Y 应为 1D；对于多个目标，Y 应为 2D。\n    *   `fit` 函数用于训练模型。\n\n我们将创建两个简单线性回归的例子。在第一个例子中，我们将生成一个简单线性回归问题。然后在第二个例子中，将解决简单线性回归问题。现在让我们开始第一个例子。\n\
  \n### 示例 1：创建一个简单线性回归\n\n我们将通过生成一个数据集来创建一个简单线性回归。这段代码只是一个热身练习，将使您熟悉最简单形式的简单线性回归。\n\
  \n**步骤 1：** 首先导入必要的库。我们将导入 `numpy`、`pandas`、`matplotlib` 和 `scikit learn`。\n\n```\n\
  import numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as plt\n%matplotlib\
  \ inline\nfrom sklearn.linear_model import LinearRegression\nfrom sklearn.datasets\
  \ import make_regression\n```\n\n**步骤 2：** 下一步，我们将创建一个可用于回归的样本数据集。\n\n```\nX,Y =\
  \ make_regression(n_features=1, noise=5, n_samples=5000)\n```\n\n在上述代码中，`n_features`\
  \ 是我们希望数据集中拥有的特征数量。`n_samples` 是我们希望生成的样本数量。`noise` 是应用于输出的高斯噪声的标准差。\n\n**步骤 3：**\
  \ 使用 `matplotlib` 库绘制数据。`xlabel` 和 `ylabel` 将为图形提供标签。\n\n```\nplt.xlabel('特征 - X')\n\
  plt.ylabel('目标 - Y')\nplt.scatter(X,Y,s=5)\n```\n\n![../images/499122_1_En_2_Chapter/499122_1_En_2_Figa_HTML.jpg](img/499122_1_En_2_Figa_HTML.jpg)\n\
  \n**步骤 4：** 现在初始化一个线性回归实例。变量名为 `linear_model`。\n\n```\nlinear_model = LinearRegression()\n\
  ```\n\n**步骤 5：** 现在拟合线性回归。输入自变量是 X，目标变量是 Y。\n\n```\nlinear_model.fit(X,Y)\n```\n\
  \n**步骤 6：** 模型现在已训练完成。让我们查看线性回归模型的截距和斜率的系数值。\n\n```\nlinear_model.coef_\nlinear_model.intercept_\n\
  ```\n\n截距的值为 0.6759344，斜率为 33.1810。\n\n**步骤 7：** 我们使用这个训练好的模型，通过 X 来预测值，然后绘制出来。\n\
  \n```\npred = linear_model.predict(X)\nplt.scatter(X,Y,s=25, label=\"训练数据\")\nplt.scatter(X,pred,s=25,\
  \ label=\"预测数据\")\nplt.xlabel('特征 - X')\nplt.ylabel('目标 - Y')\nplt.legend()\nplt.show()\n\
  ```\n\n![../images/499122_1_En_2_Chapter/499122_1_En_2_Figb_HTML.jpg](img/499122_1_En_2_Figb_HTML.jpg)\n\
  \n蓝点代表映射到实际目标数据，而橙点代表预测值。\n\n我们可以看到训练数据和实际预测值是多么接近。现在，我们将使用一个数据集为简单线性回归创建一个解决方案。\n\
  \n\n\n### 示例 2：针对房屋数据集的简单线性回归\n\n我们有一个包含一个自变量（面积，以平方英尺为单位）的数据集，需要预测房价。这同样是简单线性回归的一个例子，即我们只有一个输入变量。代码和数据集已上传至本章开头分享的\
  \ Github 链接。\n\n步骤 1：在此处导入所有必需的库：\n\n```\nimport pandas as pd\nimport numpy as np\n\
  import matplotlib.pyplot as plt\nimport seaborn as sns\n%matplotlib inline\nimport\
  \ warnings\nwarnings.filterwarnings(action=\"ignore\", module=\"scipy\", message=\"\
  ^internal gelsd\")\n```\n\n步骤 2：使用 pandas 函数加载数据集：\n\n```\nhouse_df= pd.read_csv('House_data_LR.csv')\n\
  ```\n\n注意\n\n数据可能以 `.xls` 或 `.txt` 文件的形式存在。有时，需要通过建立数据库连接直接从数据库加载数据。\n\n```\nhouse_df.head()\n\
  ```\n\n![../images/499122_1_En_2_Chapter/499122_1_En_2_Figc_HTML.jpg](img/499122_1_En_2_Figc_HTML.jpg)\n\
  \n步骤 3：检查数据集中是否存在任何空值：\n\n```\nhouse_df.isnull().any()\n```\n\n步骤 4：存在一个无意义的变量。我们删除变量“Unnamed”：\n\
  \n```\nhouse_df.drop('Unnamed: 0', axis = 1, inplace = True)\n```\n\n步骤 5：删除该变量后，让我们查看数据集的前几行：\n\
  \n```\nhouse_df.head()\n```\n\n![../images/499122_1_En_2_Chapter/499122_1_En_2_Figd_HTML.jpg](img/499122_1_En_2_Figd_HTML.jpg)\n\
  \n步骤 6：现在，我们将通过分离自变量和目标变量来准备用于模型构建的数据集。\n\n```\nX = house_df.iloc[:, :1].values\n\
  y = house_df.iloc[:, -1].values\n```\n\n步骤 7：现在将数据拆分为训练集和测试集。\n\n**训练/测试拆分**：创建训练集和测试集涉及将数据集分别拆分为互斥的训练集和测试集。之后，使用训练集进行训练，并使用测试集进行测试。这将提供更准确的样本外准确性评估，因为测试数据集并非用于训练模型的数据集的一部分。这对于现实世界的问题来说更加真实。\n\
  \n这意味着我们知道该数据集中每个数据点的结果，因此非常适合进行测试！并且由于这些数据未用于训练模型，因此模型对这些数据点的结果一无所知。所以，本质上，这确实是样本外测试。此处测试数据占比为\
  \ 25% 或 0.25。\n\n随机状态，顾名思义，用于初始化内部随机数生成器，该生成器进而决定训练/测试索引的拆分。保持其固定可以让我们复制相同的训练/测试拆分，从而验证输出。\n\
  \n```\nfrom sklearn.model_selection import train_test_split\nX_train, X_test, y_train,\
  \ y_test = train_test_split(X, y, test_size = 0.25, random_state = 5)\n```\n\n步骤\
  \ 8：现在使用线性回归模型拟合数据：\n\n```\nfrom sklearn.linear_model import LinearRegression\n\
  simple_lr= LinearRegression()\nsimple_lr.fit(X_train, y_train)\n```\n\n步骤 9：模型现已训练完成。让我们用它来预测测试数据：\n\
  \n```\ny_pred = simple_lr.predict(X_test)\n```\n\n步骤 10：我们首先在训练数据上测试模型。我们将尝试预测训练数据并可视化结果。\n\
  \n```\nplt.scatter(X_train, y_train, color = 'r')\nplt.plot(X_train, simple_lr.predict(X_train),\
  \ color = 'b')\nplt.title('Sqft Living vs Price for Training')\nplt.xlabel('Square\
  \ feet')\nplt.ylabel('House Price')\nplt.show()\n```\n\n![../images/499122_1_En_2_Chapter/499122_1_En_2_Fige_HTML.jpg](img/499122_1_En_2_Fige_HTML.jpg)\n\
  \n步骤 11：现在让我们在测试数据上测试模型。这是检查模型鲁棒性的正确衡量标准。\n\n```\nplt.scatter(X_test, y_test, color\
  \ = 'r')\nplt.plot(X_train, simple_lr.predict(X_train), color = 'b')\nplt.title('Sqft\
  \ Living vs Price for Test')\nplt.xlabel('Square feet')\nplt.ylabel('House Price')\n\
  ```\n\n![../images/499122_1_En_2_Chapter/499122_1_En_2_Figf_HTML.jpg](img/499122_1_En_2_Figf_HTML.jpg)\n\
  \n步骤 12：现在让我们弄清楚预测效果的好坏。我们将计算 MSE 和 R²。\n\n```\nfrom sklearn.metrics import mean_squared_error\n\
  from math import sqrt\nrmse = sqrt(mean_squared_error(y_test, y_pred))\nfrom sklearn.metrics\
  \ import r2_score\nr2 = r2_score(y_test, y_pred)\nadj_r2 = 1 - float(len(y)-1)/(len(y)-len(simple_lr.coef_)-1)*(1\
  \ - r2)\nrmse, r2, adj_r2, simple_lr.coef_, simple_lr.intercept_\n```\n\n![../images/499122_1_En_2_Chapter/499122_1_En_2_Figg_HTML.jpg](img/499122_1_En_2_Figg_HTML.jpg)\n\
  \n步骤 13：现在我们将对未见过的 x 值进行预测：\n\n```\nimport numpy as np\nx_unseen=np.array([1500]).reshape(1,1)\n\
  simple_lr.predict(x_unseen)\n预测结果为 376666.84\n```\n\n在前两个示例中，我们了解了如何使用简单线性回归来训练模型并进行预测。在现实世界的问题中，几乎不会只有一个自变量。大多数商业世界问题都有多个变量，此类问题使用我们正在讨论的多元线性回归算法来解决。\n\
  \n**多元线性回归**或多元回归可以看作是简单线性回归的扩展，其中我们拥有不止一个自变量，而是多个自变量。例如，图 2-11 展示了类似数据集的多个变量在向量空间图中的表示：\n\
  \n![../images/499122_1_En_2_Chapter/499122_1_En_2_Fig11_HTML.png](img/499122_1_En_2_Fig11_HTML.png)\n\
  \n图 2-11\n\n向量空间图中描绘的多元回归模型，其中我们有两个自变量，x[1] 和 x[2]\n\n| 平方英尺 | 卧室数量 | 价格（千美元） |\n\
  | --- | --- | --- |\n| 1200 | 2 | 100 |\n| 1500 | 3 | 120 |\n| 1600 | 3 | 125 |\n\
  | 1100 | 2 | 95 |\n| 1500 | 2 | 125 |\n| 2200 | 4 | 200 |\n| 2100 | 4 | 195 |\n\
  | 1410 | 2 | 110 |\n\n因此，多元线性回归的方程如公式 2-10 所示。\n\n![$$ {\\mathrm{Y}}_{\\mathrm{i}}={\\\
  upbeta}_0+{\\upbeta}_1{\\mathrm{x}}_1+{\\upbeta}_2{\\mathrm{x}}_2+\\dots +{\\upvarepsilon}_{\\\
  mathrm{i}} $$](img/499122_1_En_2_Chapter_TeX_Equ10.png)\n\n（公式 2-10）\n\n因此，在简单线性回归的多元训练情况下，我们将得到\
  \ β[0]、β[1] 等的估计值。\n\n多元回归模型中的残差如图 2-12 所示。该示例针对一个双变量模型，我们可以清晰地看到残差值，即实际值与预测值之间的差异。\n\
  \n![../images/499122_1_En_2_Chapter/499122_1_En_2_Fig12_HTML.png](img/499122_1_En_2_Fig12_HTML.png)\n\
  \n图 2-12\n\n由 x[1] 和 x[2] 描绘的多元线性回归模型，以及针对一个样本观测值显示的残差。残差是实际值与预测值之间的差异。\n\n现在，我们将使用多元线性回归模型创建两个示例案例。在模型开发过程中，我们将进行\
  \ EDA（探索性数据分析），这是第一步，并且还将解决数据中的空值问题以及如何处理分类变量。\n\n\n\n### 示例 3：房价数据集的多元线性回归\n\n\
  我们正在处理房价数据集。目标变量是房价预测，并包含一些自变量。数据集和代码已上传至本章开头分享的 Github 链接。\n\n**步骤 1：** 首先导入所有必需的库。\n\
  \n```\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\n\
  import seaborn as sns\n%matplotlib inline\nimport warnings\nwarnings.filterwarnings(action=\"\
  ignore\", module=\"scipy\", message=\"^internal gelsd\")\n```\n\n**步骤 2：** 导入 .csv\
  \ 格式的数据，然后查看前几行。\n\n```\nhouse_mlr = pd.read_csv('House_data.csv')\nhouse_mlr.head()\n\
  ```\n\n![../images/499122_1_En_2_Chapter/499122_1_En_2_Figh_HTML.jpg](img/499122_1_En_2_Figh_HTML.jpg)\n\
