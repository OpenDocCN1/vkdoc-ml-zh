  import os,sys\nfrom scipy import stats\nfrom sklearn import metrics\nimport seaborn\
  \ as sn\n%matplotlib inline\n```\n\n**步骤 2**：使用 read_csv 命令加载数据集。输出结果如下所示。\n\n![../images/499122_1_En_3_Chapter/499122_1_En_3_Figb_HTML.jpg](img/499122_1_En_3_Figb_HTML.jpg)\n\
