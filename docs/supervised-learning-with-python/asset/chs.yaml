  现在我们将创建箱线图。\n\n![../images/499122_1_En_5_Chapter/499122_1_En_5_Figz_HTML.jpg](img/499122_1_En_5_Figz_HTML.jpg)\n\
  \n```\nteam_score = deliveries_df.groupby(['match_id', 'batting_team']).total_runs.sum().reset_index()\n\
  top_teams = deliveries_df.groupby('batting_team').total_runs.sum().nlargest(5).reset_index().batting_team.tolist()\n\
  top_teams_df = team_score[team_score.batting_team.isin(top_teams)]\ntop_teams_df.groupby('batting_team').boxplot(column\
  \ = 'total_runs', layout=(5,1),figsize=(6,20));\ntop_teams_df.boxplot( column =\
  \ 'total_runs',by = 'batting_team', rot = 20, figsize = (10,4));\n```\n\n我们在本书前面已经介绍了相关性指标。除此之外，还有多种方法可以执行\
  \ EDA。散点图、交叉表等都是很好的工具。\n\nEDA 是构建稳健机器学习模型的基础。不幸的是，EDA 经常被忽视，或者投入的时间较少。这是一种危险的方法，可能会导致模型在后期阶段面临挑战。EDA\
  \ 使我们能够衡量所有变量的分布范围，理解它们的趋势和模式，揭示相互关系，并为分析指明方向。大多数情况下，在 EDA 过程中显得重要的变量，机器学习模型也会发现其显著性。请记住，花在\
  \ EDA 上的时间对于项目的成功至关重要。这是一个吸引利益相关者并引起他们关注的有用资源，因为大多数洞察都相当有趣。可视化使洞察更具吸引力。此外，*非*机器学习或统计背景的受众将能够比机器学习模型更好地理解\
  \ EDA。因此，对数据进行稳健的 EDA 是明智之举。\n\n现在是时候在下一节讨论机器学习模型构建阶段了。\n\n## 第 5 步：机器学习模型构建\n\n\
  现在我们将讨论在机器学习模型开发阶段遵循的流程。一旦 EDA 完成，我们现在对数据集有了广泛的了解。我们对自己数据集中存在的许多趋势和相关性有了一定程度的清晰认识。现在我们必须进入实际的模型创建阶段。\n\
  \n我们了解在实际模型构建过程中遵循的步骤。我们在前面的章节中已经解决了许多案例研究。但在进行模型构建时，有几点我们应该注意。这些点涉及我们面临的常见问题或常犯的错误。我们将在本节中讨论它们。\n\
  \n我们将从数据的训练集和测试集划分开始。\n\n\n\n### 训练/测试数据划分\n\n我们知道，模型在训练数据上进行训练，并在测试/验证数据集上测试其准确性。原始数据被划分为训练/测试集或训练/测试/验证集。有多种常用的划分比例。对于训练/测试划分，我们可以使用\
  \ 70:30 或 80:20 的比例。对于训练/测试/验证划分，则可以分别使用 60:20:20 或 80:10:10 的比例。\n\n虽然我们了解训练数据和测试数据的用法，但仍需注意以下几点：\n\
  \n![../images/499122_1_En_5_Chapter/499122_1_En_5_Fig6_HTML.jpg](img/499122_1_En_5_Fig6_HTML.jpg)\n\
  \n图 5-6\n\n客户数据集彼此之间存在子集关系。例如，将在 30 天内流失的客户是将在 90 天内流失的客户的一个子集。\n\n1.  训练数据应能代表业务问题。例如，如果我们正在处理电信运营商的预付费客户群体，那么训练数据应仅包含预付费客户，而不包含后付费客户，尽管这一点在数据发现阶段可能已经检查过。\n\
  \n2.  在采样训练或测试数据集时不应存在任何偏差。有时，在创建训练或测试数据时，会基于时间或产品引入偏差。必须避免这种情况，因为这样进行的训练将是不正确的。最终输出的模型会对未见过的数据产生错误的预测。\n\
  \n3.  在训练阶段，验证数据集不应暴露给算法。如果我们将数据划分为训练集、测试集和验证集，那么在训练阶段，我们会在训练集和测试集上检查模型的准确性。验证数据集将仅使用一次，并且是在最终阶段，当我们想要检查模型的稳健性时。\n\
  \n4.  所有数据处理操作，如处理异常值、空值等，应仅应用于训练数据，而不应用于测试数据集或验证数据集。\n\n5.  目标变量定义了问题，并掌握着解决方案的关键。例如，零售商希望构建一个模型来预测哪些客户将会流失。在创建数据集时，需要考虑两个方面：\n\
  \    1.  目标变量的定义，或者说它的标签，将决定数据集的设计。例如，在表 5-12 中，如果目标变量是“流失”，那么模型将预测从系统中流失的倾向。如果是“未流失”，则意味着留在系统中而不流失的倾向。\n\
  \n        表 5-12\n\n        目标变量的定义会改变整个业务问题，进而改变模型\n\n        | -![../images/499122_1_En_5_Chapter/499122_1_En_5_Figaa_HTML.jpg](img/499122_1_En_5_Figaa_HTML.jpg)\
  \ |\n\n    2.  我们感兴趣预测事件的时间跨度。例如，如图 5-6 所示，将在未来 60 天内流失的客户与将在 90 天内流失的客户是不同的。\n\n\
  训练数据和测试数据的创建是进行实际建模之前最关键的一步。如果创建的数据集中存在任何偏差或不完整性，那么输出的机器学习模型也将是有偏差的。\n\n一旦我们获得了训练和测试数据集，我们就进入模型构建的下一步。\n\
  \n#### 模型构建与迭代\n\n现在是构建实际机器学习模型的时候了。根据手头的问题，如果我们正在开发一个监督学习解决方案，我们可以选择回归方法或分类算法。然后，我们将从可用的算法列表中选择一个算法。图\
  \ 5-7 展示了所有算法的可解释性与准确性之间的关系。\n\n![../images/499122_1_En_5_Chapter/499122_1_En_5_Fig7_HTML.jpg](img/499122_1_En_5_Fig7_HTML.jpg)\n\
  \n图 5-7\n\n各种算法在准确性和可解释性方面的排列\n\n通常，我们从基础算法开始，例如线性回归、逻辑回归或决策树。这为我们设定了其他算法需要突破的基本基准。\n\
  \n然后，我们继续使用其他分类算法来训练模型。在准确性、训练速度、预测速度、稳健性和易于理解性之间，始终存在一种权衡。这也取决于变量的性质；例如，k-近邻算法需要数值变量，因为它需要计算各个数据点之间的距离。需要采用独热编码将分类变量转换为相应的数值。\n\
  \n在创建训练数据之后，机器学习建模过程可以设想为以下步骤。我们以分类问题为例：\n\n1.  使用逻辑回归或决策树创建算法的初始版本。\n\n2.  在训练数据集上衡量性能。\n\
  \n3.  迭代以提高模型的训练性能。在迭代过程中，我们尝试添加或删除变量、更改超参数等组合。\n\n4.  在测试数据集上衡量性能。\n\n5.  比较训练和测试性能；模型不应过拟合（下一节将详细介绍）。\n\
  \n6.  使用其他算法（如随机森林或支持向量机）进行测试，并对它们执行相同级别的迭代。\n\n7.  根据训练和测试准确性选择最佳模型。\n\n8.  在验证数据集上衡量性能。\n\
  \n9.  在跨时间数据集上衡量性能。\n\nscikit-learn 库提供了一个极好的速查表，网址为 [`https://scikit-learn.org/stable/tutorial/machine_learning_map/index.html`](https://scikit-learn.org/stable/tutorial/machine_learning_map/index.html)。\n\
  \n![../images/499122_1_En_5_Chapter/499122_1_En_5_Figab_HTML.jpg](img/499122_1_En_5_Figab_HTML.jpg)\n\
  \n在此步骤结束时，我们将获得各种算法的准确性。我们现在将讨论衡量准确性的最佳实践。\n\n\n\n#### 精度测量与验证\n\n我们已经讨论了回归和分类问题中使用的各种精度测量参数。用于精度测量的关键绩效指标（KPI）将取决于具体的业务问题。回想一下之前讨论的欺诈检测案例研究：在该案例中，精度并不是正确的\
  \ KPI；相反，召回率才是应该瞄准和优化的 KPI。因此，根据具体目标，精度参数会发生变化。在机器学习模型阶段，比较各种算法是一种良好的实践，如表 5-13\
  \ 所示。\n\n表 5-13\n\n比较所有算法的性能测量参数以选择最佳算法\n\n| ![../images/499122_1_En_5_Chapter/499122_1_En_5_Figac_HTML.jpg](img/499122_1_En_5_Figac_HTML.jpg)\
  \ |\n\n然后我们可以做出决定，选择最佳算法。选择算法的决定还将取决于诸如训练所需时间、预测所需时间、部署便捷性、刷新便捷性等参数。\n\n除了精度测量，我们还会检查预测所需时间和模型的稳定性。如果模型用于实时预测，那么预测所需时间就成为一个关键\
  \ KPI。\n\n同时，我们还必须验证模型。模型验证是最关键的步骤之一。它检查模型在新的、未见过的数据集上的表现如何。而这正是我们模型的主要目标：在新的、未见过的数据集上做出良好预测！\n\
  \n在时间外数据集上测试模型性能总是一个好习惯。例如，如果模型是在 2017 年 1 月至 2018 年 12 月的数据集上训练的，我们应该在时间外数据（如 2019\
  \ 年 1 月至 2019 年 4 月）上检查其性能。这确保了模型能够在未见过的、不属于训练集的数据集上表现良好。接下来，我们将研究阈值对算法的影响以及如何在下一节中进行优化。\n\
  \n### 为分类算法寻找最佳阈值\n\n还有一个关于最优阈值的重要概念，它对分类算法很有用。*阈值*指的是一个观测值将属于某个类别的概率分数上限。它在衡量模型性能方面起着重要作用。\n\
  \n例如，假设我们正在构建一个预测模型，用于预测客户是否会流失。假设分类设置的阈值为 0.5。因此，如果模型为某个客户生成的分数为 0.5 或以上，则该客户被预测为会流失；否则不会。这意味着一个概率分数为\
  \ 0.58 的客户将被归类为“预测会流失”。但如果阈值改为 0.6，那么同一个客户将被归类为“非流失客户”。这就是设置阈值的影响。\n\n默认阈值设置为 0.5，但这通常不适用于不平衡数据集。优化阈值是一项重要任务，因为它会严重影响最终结果。\n\
  \n我们可以使用 ROC 曲线来优化阈值。最佳阈值是真阳性率和（1-假阳性率）相互重叠的点。这种方法在最小化假阳性率的同时最大化真阳性率。然而，建议在不同阈值下测试模型性能，以确定最佳值。最佳阈值还取决于我们试图解决的业务问题。\n\
  \n在模型开发阶段，我们常遇到一个常见问题：过拟合和欠拟合，我们现在就来讨论这个问题。\n\n### 过拟合与欠拟合问题\n\n在模型开发过程中，我们经常面临欠拟合或过拟合的问题。它们也被称为*偏差-方差权衡*。偏差-方差权衡指的是机器学习模型的一种属性，即在测试模型性能时，我们发现模型具有低偏差但高方差，反之亦然，如图\
  \ 5-8 所示。\n\n![../images/499122_1_En_5_Chapter/499122_1_En_5_Fig8_HTML.png](img/499122_1_En_5_Fig8_HTML.png)\n\
  \n图 5-8\n\n偏差-方差权衡。注意，最佳模型复杂度是偏差和方差都达到平衡的最佳点\n\n模型的欠拟合是指该模型无法做出准确预测。模型是幼稚且非常简单的。由于我们创建了一个非常简单的模型，它无法公正地处理数据集，如图\
  \ 5-9 所示。\n\n![../images/499122_1_En_5_Chapter/499122_1_En_5_Fig9_HTML.jpg](img/499122_1_En_5_Fig9_HTML.jpg)\n\
  \n图 5-9\n\n欠拟合，即创建了一个非常简单的模型\n\n另一方面，过拟合则恰恰相反（图 5-10）。如果我们创建了一个训练精度高但测试精度低的模型，这意味着算法非常细致地学习了训练数据集的参数。该模型对训练数据集给出了良好的精度，但对测试数据集则不然。\n\
  \n![../images/499122_1_En_5_Chapter/499122_1_En_5_Fig10_HTML.jpg](img/499122_1_En_5_Fig10_HTML.jpg)\n\
  \n图 5-10\n\n过拟合，即创建了一个非常复杂的模型\n\n欠拟合可以通过增加模型的复杂度来解决。欠拟合意味着我们为机器学习方法选择了一个过于简单的解决方案，而手头的问题需要更高的复杂度。我们可以很容易地识别出欠拟合的模型。模型的训练精度不会很好，因此我们可以得出结论，该模型甚至无法在训练数据上表现良好。为了解决欠拟合，我们可以训练一棵更深的树，或者不拟合线性方程，而是拟合非线性方程。使用像\
  \ SVM 这样的高级算法可能会带来改进的结果。\n\n提示\n\n有时数据中根本没有模式。即使使用最复杂的机器学习算法也不会带来好的结果。在这种情况下，进行非常深入的探索性数据分析（EDA）可能会有所帮助。\n\
  \n对于过拟合，我们可以采用以下方法：\n\n![../images/499122_1_En_5_Chapter/499122_1_En_5_Fig11_HTML.jpg](img/499122_1_En_5_Fig11_HTML.jpg)\n\
  \n图 5-11\n\nk 折交叉验证是解决过拟合问题的绝佳技术\n\n1.  也许最简单的方法是使用更多数据进行训练。但如果新数据集很混乱，或者新数据集与旧数据集相似且没有增加额外信息，这种方法可能并不总是有效。\n\
  \n2.  k 折交叉验证是应对过拟合的一种强大方法。它允许我们调整各自的超参数，并且在最终选择确定之前，测试集将完全是未见过的。\n\nk 折验证技术如图 5-11\
  \ 所示。这是一种非常易于实现和理解的方法。在这种技术中，我们迭代地将数据划分为训练“折”和测试“折”。\n\n在 k 折验证中，我们遵循以下步骤：\n\n1.\
  \  我们随机打乱数据集，然后将其分成 k 组。\n\n2.  对于每一组，我们将其作为测试集。其余组作为训练集。\n\n3.  通过在每个组上使用训练集进行训练并在测试集（也称为保留集）上进行测试，来拟合机器学习模型。\n\
  \n4.  最终精度是所有精度的汇总。\n\n\n\n这意味着每个数据点都有机会同时成为测试集和训练集的一部分。在实验的整个周期中，每个观测值都保持在一个组内并留在该组中。因此，每个观测值被用于测试一次，用于训练\
  \ (k–1) 次。\n\nk 折验证代码的 Python 实现已提交至 Github 仓库。\n\n5.  与决策树相比，随机森林等集成方法更容易对抗过拟合。\n\
  \n6.  正则化是对抗过拟合的技术之一。该技术使模型系数收缩至零或接近零。其理念是，如果方程中添加了更多变量，模型将受到惩罚。\n\n有两种正则化方法：Lasso（L1）回归和\
  \ Ridge（L2）回归。方程 5-3 可能在前面的章节中已经提到过。\n\n![$$ {\\mathrm{Y}}_{\\mathrm{i}}={\\upbeta}_0+{\\\
  upbeta}_1{\\mathrm{x}}_1+{\\upbeta}_2{\\mathrm{x}}_2+\\dots +{\\upvarepsilon}_{\\\
  mathrm{i}} $$](img/499122_1_En_5_Chapter_TeX_Equ3.png)\n\n（方程 5-3）\n\n同时，我们有一个损失函数需要优化以获得最佳方程。这就是残差平方和（RSS）。\n\
  \n在 Ridge 回归中，一个收缩量被添加到 RSS 中，如方程 5-4 所示。\n\n因此，修改后的\n\n![$$ RSS= RSS+\\uplambda\\\
  ;{\\Sigma_{\\mathrm{i}=1}}^{\\mathrm{n}}{\\upbeta}_{\\mathrm{i}}² $$](img/499122_1_En_5_Chapter_TeX_Equ4.png)\n\
  \n（方程 5-4）\n\n这里的 λ 是调整参数，它将决定我们想要对模型施加多大的惩罚。如果 λ 为零，则没有影响，但当它变大时，系数将开始趋近于零。\n\n\
  在 Lasso 回归中，一个收缩量被添加到 RSS 中，与 Ridge 类似但有所变化。不是平方，而是取绝对值，如方程 5-5 所示。\n\n因此，修改后的\n\
  \n![$$ RSS= RSS+\\uplambda\\;{\\Sigma_{\\mathrm{i}=1}}^{\\mathrm{n}}\\;\\left|{\\\
  upbeta}_{\\mathrm{i}}\\right| $$](img/499122_1_En_5_Chapter_TeX_Equ5.png)\n\n（方程\
  \ 5-5）\n\n在这两种模型之间，岭回归影响了模型的可解释性。它可以将非常重要变量的系数收缩到接近零。但它们永远不会为零，因此模型将始终包含所有变量。而在\
  \ Lasso 中，一些参数可以精确为零，这使得该方法也有助于变量选择和创建稀疏模型。\n\n7.  决策树通常会过拟合。我们可以通过以下两种方法在决策树中对抗过拟合：\n\
  \    1.  我们可以调整超参数并对树的生长设置约束：例如最大深度、所需的最大样本数、分裂的最大特征数、最大终端节点数等参数。\n\n2.  第二种方法是剪枝。剪枝与构建树相反。基本思想是，一棵非常大的树会过于复杂，无法很好地泛化，从而导致过拟合。回想一下，在第\
  \ 4 章中，我们使用决策树中的剪枝开发了代码。\n\n决策树遵循贪婪方法，因此决策仅基于当前状态，而不依赖于未来的预期状态。这种方法最终会导致过拟合。剪枝帮助我们解决这个问题。在决策树剪枝中，我们\n\
  \        1.  让树生长到最大可能的深度。\n\n2.  然后从底部开始，移除那些与顶部相比不提供任何益处的终端节点。\n\n请注意，机器学习解决方案的目标是对未见过的数据集进行预测。模型在历史训练数据上进行训练，以便理解训练数据中的模式，然后利用这些智能对新数据和未见过的数据进行预测。因此，评估模型在测试集和验证集上的性能至关重要。如果选择了过拟合的模型，它将无法处理新的数据点，从而失去创建机器学习模型的业务意义。\n\
  \n模型选择是最关键但也最令人困惑的步骤之一。很多时候，我们倾向于选择更复杂或更先进的算法，而不是更简单的算法。然而，如果简单的逻辑回归算法和先进的 SVM 给出相似的准确率，我们应该选择更简单的那个。更简单的模型更容易理解，对不断变化的业务需求更灵活，部署更直接，并且未来维护和更新也更轻松。一旦我们最终选择了要在生产环境中部署的算法，要替换它就会变得非常困难！\n\
  \n下一步是向关键利益相关者展示模型和见解，以获取他们的建议。\n\n### 关键利益相关者讨论与迭代\n\n与关键业务利益相关者保持密切联系是一个好习惯。有时，在与关键利益相关者讨论后需要进行一些迭代。他们可以利用业务敏锐度和理解力来提供意见。\n\
  \n### 展示最终模型\n\n机器学习模型已经准备好了。我们已经与关键利益相关者进行了初步的讨论轮次。现在是时候向更广泛的受众展示模型，以收集他们的反馈和意见了。\n\
  \n我们必须记住，机器学习模型需要被业务的多个职能部门使用。因此，所有职能部门在见解上保持一致至关重要。\n\n恭喜！您已经拥有一个功能完善、经过验证、测试且（至少部分）获得批准的模型。然后将其呈现给所有利益相关者和团队进行详细讨论。如果一切顺利，该模型就可以部署到生产环境中了。\n\
  \n\n\n## 第六步：模型部署\n\n到目前为止，我们已经了解了模型开发的所有阶段。机器学习模型基于历史数据进行训练，它生成了一系列洞察以及一个编译后的模型版本。该模型必须用于对新的、未见过的数据集进行预测。这个模型已经准备好投入生产环境，这被称为*部署*。现在我们将详细审视所有概念。\n\
  \n与传统软件工程相比，机器学习是一种不同类型的软件。对于一个机器学习模型，需要多种力量协同作用才能实现。我们现在必须讨论它们，因为它们是构建稳健且实用解决方案的基石。\n\
  \n关键要素如图 5-12 所示。\n\n![../images/499122_1_En_5_Chapter/499122_1_En_5_Fig12_HTML.jpg](img/499122_1_En_5_Fig12_HTML.jpg)\n\
  \n图 5-12\n\n机器学习解决方案的关键要素，它们是解决方案的基础\n\n1.  **相互依赖性**在机器学习解决方案中指的是各个变量之间的关系。如果其中一个变量的值发生变化，就会对其他变量的值产生影响。因此，变量之间是相互依赖的。同时，机器学习模型有时对数据点值的微小变化也相当“敏感”。\n\
  \n2.  **数据**是模型的核心。数据为模型提供动力；数据是原材料，是一切之源。然而，有些数据点非常不稳定，总是处于变化之中。因此，我们在设计系统时必须追踪这些数据变化。模型和数据是协同工作的。\n\
  \n3.  **错误**随时可能发生。我们在部署时计划了很多事情。我们确保部署的是正确版本的算法。通常，这个版本是在最新数据集上训练过并经过验证的。\n\n4.\
  \  **可复现性**是机器学习模型所需且期望但难以实现的特性之一。对于在动态数据集上训练的模型，或者像医疗设备或银行这类受协议和规则约束的领域，尤其如此。想象一下，在医疗设备行业，构建了一个图像分类模型来根据图像区分合格与不合格产品。在这种情况下，组织必须遵守协议，并向监管机构提交技术报告。\n\
  \n5.  **团队合作**是整个项目的核心。一个机器学习模型需要数据工程师、数据分析师、数据科学家、功能顾问、业务顾问、利益相关者、开发运维工程师等人的时间和关注。对于部署，我们也需要其中一些职能部门的指导和支持。\n\
  \n6.  **业务**利益相关者和赞助商是成功机器学习解决方案的关键。他们将指导如何消费和使用该解决方案来解决业务问题。\n\n提示\n\n部署并非易事；它需要时间、团队合作和多种技能来处理。\n\
  \n在开始部署机器学习模型之前，我们应该明确几个问题。除了我们在上一段中讨论的关键要素外，我们还应该了解关于机器学习模型的以下几点：\n\n1.  我们必须检查机器学习模型是实时运行还是以批量预测模式运行。例如，检查一笔传入交易是否欺诈是实时检查的一个例子。如果我们预测客户是否会违约，那不是一个实时系统，而是批量预测模式，我们甚至可以等到第二天再进行预测。\n\
  \n2.  我们将要处理的数据量是一个需要回答的大问题。因此，了解传入请求的大小很重要。例如，如果一个在线交易系统预期每秒处理 10 笔交易，而另一个系统预期每秒处理\
  \ 1000 笔交易，那么负载管理和决策速度将产生巨大差异。\n\n3.  我们还要确保检查模型的性能，包括预测所需时间、稳定性、内存需求以及最终输出的生成方式。\n\
  \n4.  然后，我们还要决定模型是需要开关式训练还是实时训练。\n    1.  开关式训练是指我们在历史数据上训练模型，并将其投入生产，直到其性能下降。然后我们将刷新模型。\n\
  \n2.  实时训练允许机器学习模型在实时数据集上进行训练，然后重新训练。它使机器学习模型始终能够适应新的数据集。\n\n5.  需要决定机器学习模型中期望的自动化程度。这将有助于我们更好地规划手动步骤。\n\
  \n一旦我们回答了这些问题，我们就明确了模型的目的和业务逻辑。经过一轮彻底的测试，模型就可以迁移到生产环境了。然后我们应该着手处理以下几点：\n\n1.  一切从拥有一个数据库开始。数据库可以在云端，也可以在传统服务器上。它包含模型将用于消费传入数据的所有表和源，如图\
  \ 5-13 所示。有时，一个单独的框架会将数据馈送给模型。\n\n![../images/499122_1_En_5_Chapter/499122_1_En_5_Fig13_HTML.jpg](img/499122_1_En_5_Fig13_HTML.jpg)\n\
  \n图 5-13\n\n机器学习模型可以从多个来源获取输入数据\n\n2.  如果某个变量不是原始变量，而是派生变量，那么在为数据创建数据源时就应该处理好这一点。例如，考虑一个零售商，传入的原始数据是当天的客户交易详情。我们构建了一个模型来预测客户流失，其中一个重要变量是客户的平均交易价值（总收入/交易次数）；那么这个变量将成为数据提供者表的一部分。\n\
  \n![../images/499122_1_En_5_Chapter/499122_1_En_5_Fig16_HTML.jpg](img/499122_1_En_5_Fig16_HTML.jpg)\n\
  \n图 5-16\n\n实时预测系统需要几秒或几毫秒来进行预测\n\n1.  这些传入数据对于机器学习模型来说是新的、未见过的。数据包含编译后模型所期望格式的数据。如果数据不是所期望的格式，则会出现运行时错误。因此，彻底检查输入数据至关重要。如果我们有一个使用神经网络的图像分类模型，我们应该检查输入图像的维度是否与网络期望的相同。同样，对于结构化数据，应检查输入数据是否符合预期，并检查变量的名称和类型（整数、字符串、布尔值、数据框等）。\n\
  \n2.  编译后的模型存储为序列化对象，例如 Python 的 `.pkl` 文件、R 语言的 `.R` 文件、MATLAB 的 `.mat` 文件、`.h5`\
  \ 文件等。这是用于进行预测的编译对象。有几种可用的格式：\n    1.  Pickle 格式用于 Python。该对象是一个流式对象，可以加载和共享。也可以在以后使用。\n\
  \n2.  ONNX（开放神经网络交换格式）允许存储预测模型。同样，PMML（预测模型标记语言）是另一种使用的格式。\n\n3.  模型的目标、要进行的预测的性质、传入数据的量、实时预测还是开关式预测等，使我们能够为问题设计出良好的架构。\n\
  \n\n\n4.  在模型部署方面，我们有多种选择。我们可以按以下方式部署模型：\n    1.  **Web 服务**：机器学习模型可以作为 Web 服务进行部署。这是一个很好的方法，因为它可以处理\
  \ Web、移动端和桌面端等多种接口。我们可以设置一个 API 包装器，并将模型部署为 Web 服务。该 API 包装器负责对未见过的数据进行预测。\n\n使用\
  \ Web 服务方法时，Web 服务可以接收输入数据，并将其转换为模型所期望的数据集或数据框。然后，它可以使用该数据集（无论是连续变量还是分类变量）进行预测，并返回相应的值。\n\
  \n考虑这样一个场景：一家零售商在线销售专业产品，其大部分业务来自回头客。现在，该零售商推出了一款新产品，并希望针对现有客户群进行营销。\n\n因此，我们希望部署一个机器学习模型，该模型能根据客户最近的历史交易记录，预测其是否会购买这款新产品。我们在图\
  \ 5-14 中描绘了整个过程。\n\n![../images/499122_1_En_5_Chapter/499122_1_En_5_Fig14_HTML.jpg](img/499122_1_En_5_Fig14_HTML.jpg)\n\
  \n图 5-14\n\n基于 Web 服务的部署流程\n\n需要注意的是，我们已经拥有客户过去行为的历史信息。由于需要对一组新信息进行预测，因此必须将这些信息合并，然后共享给预测服务。\n\
  \n作为第一步，网站或应用程序进行初始化，并向信息模块发出请求。信息模块包含客户历史交易等信息。它将这些客户信息返回给 Web 应用程序。Web 应用在本地初始化客户档案并存储这些信息。同样，在\
  \ Web 或应用程序中发生的新事件链或触发器也会被获取。这些数据点（旧客户详情和新数据值）被共享给一个函数或包装函数，该函数根据新的数据点更新接收到的信息。然后，这个更新后的信息被共享给预测\
  \ Web 服务，以生成预测并接收返回值。\n\n在这种方法中，我们可以使用 AWS Lambda 函数、Google Cloud 函数或 Microsoft\
  \ Azure 函数。或者，我们可以使用 Docker 等容器来部署 Flask 或 Django 应用程序。\n\n5.  **与数据库集成**：这可能是最常用的方法。如图\
  \ 5-15 所示，这种方法比基于 Web 服务的方法更简单，但仅适用于较小的数据库。\n\n![../images/499122_1_En_5_Chapter/499122_1_En_5_Fig15_HTML.jpg](img/499122_1_En_5_Fig15_HTML.jpg)\n\
  \n图 5-15\n\n与数据库集成以部署模型\n\n在这种方法中，一旦发生新交易，就会生成一个事件。该事件创建一个触发器。此触发器将信息共享给客户表，数据在其中更新，然后更新后的信息被共享给事件触发器。接着，运行预测模型，生成预测分数，以预测客户是否会购买新推出的产品。最后，根据预测结果再次更新客户数据。\n\
  \n这是一种更简单的方法。我们可以使用 MSSQL、PostGres 等数据库。\n\n我们还可以将模型部署到原生应用程序中，或作为 Web 应用程序部署。预测性机器学习模型可以作为本地服务在外部运行。这种方法使用并不广泛。模型部署后，系统需要消费其产生的预测结果。\n\
  \n6.  接下来需要考虑的步骤是消费机器学习模型所做的预测。\n    1.  如果模型进行的是*实时*预测，如图 5-16 所示，那么模型可以返回一个信号，例如通过/失败或是/否。模型也可以返回一个概率分数，然后由传入的请求进行处理。\n\
  \n![../images/499122_1_En_5_Chapter/499122_1_En_5_Fig17_HTML.jpg](img/499122_1_En_5_Fig17_HTML.jpg)\n\
  \n图 5-17\n\n批量预测保存到数据库\n\n1.  如果模型不是实时模型，那么模型可能会生成概率分数，这些分数需要保存到数据库中的一个单独表中。这被称为*批量预测*，如图\
  \ 5-17 所示。因此，模型生成的分数必须写回数据库。并非必须写回预测结果。我们可以将预测结果写入 .csv 或 .txt 文件，然后上传到数据库。通常，预测结果会附带生成该预测所依据的所有原始输入数据的详细信息。\n\
  \n对于回归问题，生成的预测可以是连续值；对于分类问题，可以是概率分数或类别。根据预测结果，我们可以进行相应的配置。\n\n1.  我们可以使用任何允许我们创建、训练和部署模型的云平台。一些最常见的选项包括：\n\
  \    1.  AWS SageMaker\n\n2.  Google Cloud AI 平台\n\n3.  Azure Machine Learning Studio（属于\
  \ Azure Machine Learning 服务的一部分）\n\n4.  IBM Watson Studio\n\n5.  Salesforce Einstein\n\
  \n6.  MathWorks 提供的 MATLAB\n\n7.  RapidMiner 提供的 RapidMiner AI Cloud\n\n8.  TensorFlow\
  \ Research Cloud\n\n恭喜！模型已部署到生产环境，并正在对真实且未见过的数据集进行预测。很激动，对吧？\n\n## 第 7 步：文档编写\n\n\
  我们的模型已部署，现在必须确保所有代码都已清理、检入并妥善记录。可以使用 Github 进行版本控制。\n\n模型的文档编写也取决于使用它的组织和领域。在受监管的行业中，妥善记录所有细节是至关重要的。\n\
  \n## 第 8 步：模型刷新与维护\n\n我们现在已经了解了模型开发和部署的所有阶段。但是，一旦模型投入生产，就需要持续监控。我们必须确保模型始终以期望的准确度水平运行。为此，建议设置一个仪表板或监控系统来定期评估模型的性能。如果没有这样的系统，可以对模型进行每月或每季度的检查。\n\
  \n模型刷新可以遵循图 5-18 所示的方法。这里我们展示了完整的逐步方法。\n\n![../images/499122_1_En_5_Chapter/499122_1_En_5_Fig18_HTML.jpg](img/499122_1_En_5_Fig18_HTML.jpg)\n\
  \n图 5-18\n\n机器学习模型刷新与维护流程\n\n模型部署后，我们可以每月对模型进行随机检查。如果性能不佳，则需要对模型进行刷新。即使模型性能没有下降，定期使用不断生成和保存的新数据点来刷新模型仍然是一个好习惯。\n\
  \n至此，我们完成了设计机器学习系统、从头开始开发、以及部署和维护它的所有步骤。这是一个漫长且相当繁琐的过程，需要团队合作。\n\n至此，我们来到了本书最后一章的结尾。\n\
  \n\n\n## 总结\n\n在最后一章中，我们研究了一个模型的生命周期——从零开始到维护。根据业务领域和具体用例，也可能存在其他方法和流程。\n\n至此，本书即将结束。我们以机器学习及其主要类别的介绍开启了本书。在接下来的章节中，我们讨论了回归问题，随后解决了分类问题。接着是更高级的算法，如支持向量机和神经网络。在最后一章中，我们集大成地创建了端到端的模型开发流程。Python\
  \ 代码和案例研究则辅助了理解。\n\n数据是新的石油、新的电力、新的动力和新的货币。这个领域正在迅速发展，其影响力遍及全球。随着如此迅猛的发展，该领域开辟了新的就业机会，并创造了新的职位头衔。数据分析师、数据工程师、数据科学家、可视化专家、机器学习工程师——这些职位在十年前并不存在。如今，对此类专业人才的需求巨大。但能够满足这些职位描述严格标准的人才却十分匮乏。当务之急是拥有能够将业务目标与分析问题相结合，并构想出解决动态业务问题方案的*数据艺术家*。\n\
  \n数据正在影响所有的业务、运营、决策和政策。每天都有越来越复杂的系统被创造出来。数据及其力量是巨大的：我们可以看到自动驾驶汽车、聊天机器人、欺诈检测系统、面部识别解决方案、物体检测解决方案等例子。我们能够快速生成洞察、扩展解决方案、进行可视化并即时做出决策。医疗行业可以研发更好的药物，银行和金融部门可以降低风险，电信运营商可以提供更好、更稳定的网络覆盖，零售行业可以提供更优惠的价格和更好的客户服务。用例数不胜数，并且仍在不断探索中。\n\
  \n但如何利用这股数据的力量，责任在于我们。我们可以将其用于造福人类，也可以用于毁灭。我们可以用机器学习和人工智能来传播爱或仇恨——这是我们的选择。正如那句老话所说——能力越大，责任越大！\n\
