  \n**第 6 步**：接下来我们将进行数据预处理。首先，创建数据框的一个深层副本：\n\n```\ncensus_df_rev = census_df.copy(deep=True)\n\
  ```\n\n**第 7 步**：在执行缺失值处理任务之前，我们需要获取数据框的一些汇总统计信息。为此，我们可以使用 `describe()` 方法。该方法可用于生成各种汇总统计信息，但不包括\
  \ NaN 值。\n\n![../images/499122_1_En_3_Chapter/499122_1_En_3_Figt_HTML.jpg](img/499122_1_En_3_Figt_HTML.jpg)\n\
  \n```\ncensus_df_rev.describe(), as follows:\n```\n\n```\ncensus_df_rev.describe(include=\
  \ 'all')\n```\n\n如果传递了 `all`，则表示我们希望检查所有属性的汇总信息，如下所示：\n\n![../images/499122_1_En_3_Chapter/499122_1_En_3_Figu_HTML.jpg](img/499122_1_En_3_Figu_HTML.jpg)\n\
  \n**第 8 步**：现在我们将对缺失的分类值进行插补：\n\n```\nfor value in ['workclass','education','marital_status','occupation','relationship','race','sex','native_country','income']:\n\
  replaceValue = census_df_rev.describe(include='all')[value][2]\ncensus_df_rev[value][census_df_rev[value]=='?']\
  \ = replaceValue\n```\n\n**第 9 步**：独热编码，将所有分类变量转换为数值型\n\n```\nle = preprocessing.LabelEncoder()\n\
  workclass_category = le.fit_transform(census_df.workclass)\neducation_category =\
  \ le.fit_transform(census_df.education)\nmarital_category   = le.fit_transform(census_df.marital_status)\n\
  occupation_category = le.fit_transform(census_df.occupation)\nrelationship_category\
  \ = le.fit_transform(census_df.relationship)\nrace_category = le.fit_transform(census_df.race)\n\
  sex_category = le.fit_transform(census_df.sex)\nnative_country_category = le.fit_transform(census_df.native_country)\n\
  ```\n\n**第 10 步**：现在初始化编码后的分类列：\n\n```\ncensus_df_rev['workclass_category'] = workclass_category\n\
  census_df_rev['education_category'] = education_category\ncensus_df_rev['marital_category']\
  \ = marital_category\ncensus_df_rev['occupation_category'] = occupation_category\n\
  census_df_rev['relationship_category'] = relationship_category\ncensus_df_rev['race_category']\
  \ = race_category\ncensus_df_rev['sex_category'] = sex_category\ncensus_df_rev['native_country_category']\
  \ = native_country_category\n```\n\n**第 11 步**：查看数据的前几行：\n\n![../images/499122_1_En_3_Chapter/499122_1_En_3_Figv_HTML.jpg](img/499122_1_En_3_Figv_HTML.jpg)\n\
  \n```\ncensus_df_rev.head()\n```\n\n**第 12 步**：旧的分类列已不再需要，我们可以安全地删除它们：\n\n```\n\
  dummy_fields = ['workclass','education','marital_status','occupation','relationship','race',\
  \ 'sex', 'native_country']\ncensus_df_rev = census_df_rev.drop(dummy_fields, axis\
  \ = 1)\n```\n\n**第 13 步**：我们需要对所有列重新建立索引，为此将使用 `reindex_axis` 方法。\n\n![../images/499122_1_En_3_Chapter/499122_1_En_3_Figw_HTML.jpg](img/499122_1_En_3_Figw_HTML.jpg)\n\
  \n```\ncensus_df_rev = census_df_rev.reindex_axis(['age', 'workclass_category',\
  \ 'fnlwgt', 'education_category', 'education_num', 'marital_category', 'occupation_category',\
  \ 'relationship_category', 'race_category', 'sex_category', 'capital_gain', 'capital_loss',\
  \ 'hours_per_week', 'native_country_category', 'income'], axis= 1) census_df_rev.head(5)\n\
  ```\n\n该方法已弃用，因此我们会收到如上图所示的错误。因此，让我们使用一个更新的方法，这样就不会出现所示的错误。\n\n![../images/499122_1_En_3_Chapter/499122_1_En_3_Figx_HTML.jpg](img/499122_1_En_3_Figx_HTML.jpg)\n\
  \n```\ncensus_df_rev = census_df_rev.reindex(['age', 'workclass_category', 'fnlwgt',\
  \ 'education_category', 'education_num', 'marital_category', 'occupation_category',\
  \  'relationship_category', 'race_category', 'sex_category', 'capital_gain',  'capital_loss',\
  \ 'hours_per_week', 'native_country_category', 'income'], axis= 1)\ncensus_df_rev.head(5)\n\
  ```\n\n**第 14 步**：现在我们将数据整理为自变量和目标变量：\n\n```\nX = census_df_rev.values[:,:14]  ##\
  \ 这些是输入变量\nY = census_df_rev.values[:,14]  ## 这是目标变量\n```\n\n**第 15 步**：现在按照 75:25\
  \ 的比例将数据拆分为训练集和测试集。\n\n```\nX_train, X_test, Y_train, Y_test = train_test_split(X,\
  \ Y, test_size = 0.25, random_state = 5)\n```\n\n**第 16 步**：现在我们将拟合朴素贝叶斯模型。\n\n\
  ```\nclf = GaussianNB()\nclf.fit(X_train, Y_train)\n```\n\n**第 17 步**：模型分类器现在已使用训练数据完成训练，并准备好进行预测。我们可以使用\
  \ `predict()` 方法，并将测试集特征作为其参数。\n\n```\nY_pred = clf.predict(X_test)\n```\n\n**第\
  \ 18 步**：现在检查模型的准确率。\n\n```\naccuracy_score(Y_test, Y_pred, normalize = True)\n\
  我们得到的准确率为 0.79032。\n```\n\n至此，我们使用真实数据集实现了朴素贝叶斯。建议你理解每一步，并通过复现解决方案来练习。\n\n朴素贝叶斯是一个极好的算法，值得练习和使用。贝叶斯统计正受到广泛关注，其强大功能在研究领域被大量利用。你可能听说过*贝叶斯优化*这个术语。贝叶斯定理的美妙之处在于其简洁性，这在我们的日常生活中非常明显。确实是一种直截了当的方法！\n\
  \n到目前为止，我们已经介绍了逻辑回归和朴素贝叶斯。现在我们将研究另一种非常广泛使用的分类器，称为 *k-近邻算法*。这是一种流行的方法，易于理解和实现——接下来让我们学习\
  \ knn。\n\n\n\n## k-近邻分类算法\n\n“物以类聚，人以群分。”这句古老的谚语完美诠释了 k-近邻算法。这是最流行的机器学习技术之一，其学习过程基于数据点之间的相似性。knn\
  \ 是一种*非参数*模型；它不构建“模型”，分类基于邻居的简单多数投票。它适用于属性与目标类别之间关系复杂且难以理解，但同一类别内的项目在属性值上相当同质的情况。但对于不干净的数据集，或者目标类别区分度不高的场景，它可能不是最佳选择。如果目标类别界限不清，那么在多数投票时就会导致明显的混淆。knn\
  \ 也可用于回归问题，对连续变量进行预测。在回归情况下，最终输出将是邻居值的平均值，该平均值将被分配给目标变量。让我们通过图示来观察：\n\n例如，我们有一些数据点，在向量空间图中用圆圈和加号表示，如图\
  \ 3-5 所示。此例中明显有两个类别。目标是分类图 3-5(ii)中所示的一个新数据点（用黄色标记），并识别它属于哪个类别。\n\n![../images/499122_1_En_3_Chapter/499122_1_En_3_Fig5_HTML.jpg](img/499122_1_En_3_Fig5_HTML.jpg)\n\
  \n图 3-5\n\n(i) 两个类别（绿色圆圈和黑色加号）的分布。(ii) 右侧显示需要分类的新数据点（用黄色符号表示）。必须使用 k-近邻算法进行分类。\n\
  \n这个黄色点要么是圆圈，要么是加号，没有其他可能。knn 将通过对其邻近的其他数据点进行多数投票来帮助分类。而“k”的值将指导我们考虑多少个数据点进行投票。假设我们取\
  \ k=4。那么，我们现在将以黄色点为中心画一个圆。这个圆的大小应刚好能包含四个数据点。如图 3-6(i)所示。\n\n![../images/499122_1_En_3_Chapter/499122_1_En_3_Fig6_HTML.jpg](img/499122_1_En_3_Fig6_HTML.jpg)\n\
  \n图 3-6\n\n(i) 如果我们选择四个最近邻，新出现的未见数据的情况。这是一个容易做出的决定。(ii) 右侧显示，由于四个邻居混合在一起，新数据点难以分类。\n\
  \n离黄色点最近的四个点都属于圆圈，或者我们可以说未知黄色点的所有*邻居*都是圆圈。因此，我们可以有很高的置信度预测黄色点应属于圆圈类。这里的选择相对简单直接。参考图\
  \ 3-6(ii)，情况就没那么简单了。因此，k 的选择起着至关重要的作用。\n\nk-近邻算法遵循的步骤如下：\n\n1.  我们接收需要处理的原始未分类数据集。\n\
  2.  我们从欧几里得距离、曼哈顿距离或闵可夫斯基距离中选择一个距离矩阵。\n3.  然后计算新数据点与已知分类的训练数据点之间的距离。\n4.  要考虑的邻居数量由“k”的值定义。\n\
  5.  接着，与具有最短距离的类别列表进行比较，并统计每个类别出现的次数。\n6.  得票最高的类别获胜。这意味着，出现频率最高、次数最多的类别被分配给未知数据点。\n\
  \n提示\n\n参数模型对输入数据做出一些假设，例如具有正态分布。然而，非参数方法认为数据分布无法通过有限参数集定义，因此不做任何假设。\n\n从讨论的 k-近邻步骤中，我们可以清楚地理解，最终精度取决于所使用的距离矩阵和“k”的值。\n\
  \n常用的距离矩阵有：\n\n1.  **欧几里得距离**：可能是计算两点之间距离最常用、最简单的方法。它是距离平方和的平方根：\n\n![$$ \\mathrm{欧几里得距离}=\\\
  sqrt{\\left({\\left(\\mathrm{y}2\\hbox{-} \\mathrm{y}1\\right)}²+{\\left(\\mathrm{x}2\\\
  hbox{-} \\mathrm{x}1\\right)}²\\right)} $$](img/499122_1_En_3_Chapter_TeX_Equ14.png)\n\
  \n(公式 3-14)  \n2.  **曼哈顿距离**：沿直角坐标轴测量的两点之间的距离。有时也称为城市街区距离。在平面上，p1 位于(x1, y1)，p2\
  \ 位于(x2, y2)，其距离为：\n\n![$$ \\mathrm{曼哈顿距离}=\\left|{\\mathrm{x}}_1-{\\mathrm{x}}_2\\\
  right|+\\left|{\\mathrm{y}}_1-{\\mathrm{y}}_2\\right| $$](img/499122_1_En_3_Chapter_TeX_Equ15.png)\n\
  \n(公式 3-15)  \n3.  **闵可夫斯基距离**：这是赋范向量空间中的一种度量。闵可夫斯基距离用于衡量向量的距离相似度。给定两个或多个向量，找出这些向量的距离相似度。主要地，闵可夫斯基距离在机器学习中用于找出距离相似度。它是一种广义距离度量，可以用以下公式表示：\n\
  \n![$$ {\\left({\\Sigma_{\\mathrm{i}=1}}^{\\mathrm{n}}\\;{\\left|{\\mathrm{x}}_{\\\
  mathrm{i}}-{\\mathrm{y}}_{\\mathrm{i}}\\right|}^{\\mathrm{p}}\\right)}^{1/p} $$](img/499122_1_En_3_Chapter_TeX_Equ16.png)\n\
  \n(公式 3-16)\n\n其中，通过使用不同的 p 值，我们可以得到不同的距离值。当 p=1 时，得到曼哈顿距离；当 p=2 时，得到欧几里得距离；当 p=∞时，得到切比雪夫距离。\n\
  \n4.  **余弦相似度**：它是内积空间中两个非零向量之间相似度的度量，衡量它们之间夹角的余弦值。0°的余弦值为 1，对于区间(0,π]弧度内的任何角度，余弦值都小于\
  \ 1。\n\n各种距离可以如图 3-7 所示进行查看。\n\n![../images/499122_1_En_3_Chapter/499122_1_En_3_Fig7_HTML.jpg](img/499122_1_En_3_Fig7_HTML.jpg)\n\
  \n图 3-7\n\n(i) 欧几里得距离；(ii) 曼哈顿距离；(iii) 余弦相似度\n\n提示\n\n在处理 knn 问题时，通常我们从欧几里得距离开始。在大多数业务问题中，它都能满足需求。距离矩阵是无监督聚类方法（如\
  \ k-means 聚类）中的一个重要参数。\n\nk-近邻算法的优点\n\n1.  它是一种非参数方法，不对向量空间中各类别的分布做任何假设。\n2.  它可用于二分类以及多分类问题。\n\
  3.  该方法非常易于理解和实现。\n4.  该方法具有鲁棒性，如果 k 值较大，则不受异常值的影响。\n\nk-近邻算法的缺点\n\n1.  精度取决于 k\
  \ 的值，因此有时找到最优值可能比较困难。\n2.  该方法要求类别分布不重叠。\n3.  没有特定的模型作为输出，如果 k 值较小，则会受到异常值存在的负面影响。\n\
  4.  该方法计算量大，因为它是一种*懒惰学习*算法。需要计算所有点之间的距离，然后进行多数投票。因此，它不是一种快速的方法。\n\nknn 还有其他形式，如下所示：\n\
  \n**半径邻居分类器**\n\n\n\n1.  该分类器基于一定数量的邻居实现学习。这些邻居位于每个训练点固定半径 r 的范围内，其中 r 是由用户指定的浮点数值。\n\
  \n2.  当数据采样不均匀时，我们更倾向于使用此方法。但是，当存在多个自变量且数据集稀疏时，该方法会受到*维度灾难*的影响。\n\n提示\n\n当维度数量增加时，空间体积会以非常快的速度增长，导致数据变得非常稀疏。这被称为维度灾难。数据稀疏性使得对任何数据集进行统计分析都成为一项相当具有挑战性的任务。\n\
  \n**KD 树最近邻**\n\n1.  如果数据集很大但自变量数量较少，此方法非常有效。\n\n2.  与其他方法相比，此方法的计算时间更短。\n\n现在是时候使用\
  \ k 近邻算法创建一个 Python 解决方案了，我们接下来将执行此操作。\n\n## 案例研究：k-近邻算法\n\n我们提供了一个待审计的数据集，该数据集包含在军事网络环境中模拟的各种入侵行为。它通过模拟典型的美国空军局域网，创建了一个获取网络原始\
  \ TCP/IP 转储数据的环境。该局域网像真实环境一样被重点监控，并遭受了多种攻击。一个连接是一系列 TCP 数据包，在某个时间段内开始和结束，在此期间，数据在某种明确定义的协议下从源\
  \ IP 地址流向目标 IP 地址。此外，每个连接都被标记为正常或攻击，并且每个攻击都恰好对应一种特定的攻击类型。每个连接记录大约包含 100 个字节。对于每个\
  \ TCP/IP 连接，从正常数据和攻击数据中提取了 41 个定量和定性特征（3 个定性特征和 38 个定量特征）。\n\n类变量有两个类别：正常和异常。\n\n\
