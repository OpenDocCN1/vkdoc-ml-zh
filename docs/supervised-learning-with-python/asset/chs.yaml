  \ epoch、batch_size 等值来衡量性能，从而进行迭代。\n\n至此，我们使用深度学习实现了两个用例，分别针对结构化数据和非结构化数据。\n\n深度学习是一种能够进一步提升我们能力的力量。对于非结构化数据集，神经网络正在引领我们找到前所未有的解决方案。像卷积神经网络、循环神经网络、长短期记忆网络（LSTM）、GRU\
  \ 等高级神经网络在各个领域都创造着奇迹。我们现在可以更好地检测癌症、增强安全系统、提高农业产量、减少购物时间、利用面部特征来允许或限制用户——用例非常丰富。在所有领域，我们都能感受到深度学习带来的涟漪效应。\n\
  \n至此，本书第四章即将结束。现在让我们对本章进行总结。\n\n## 总结\n\n本章相当特别，因为它涉及高级概念。但这些高级概念是建立在我们前几章所创建的基础之上的。这些高级概念和算法是当下的迫切需求。凭借更强的处理能力和增强的系统，我们可以实现更快速的解决方案。十年前还不存在的所需计算能力，如今已经具备。我们现在可以使用\
  \ GPU 和 TPU。我们现在可以存储和管理数 TB 或 PB 的数据。我们的数据收集策略已经大大改进。我们可以以更结构化的方式收集实时数据。我们的数据管理工具现在不再局限于独立服务器，而是扩展到了基于云的基础设施。这为我们提供了工具和信心，去实现更先进的基于\
  \ ML 的技术，以进一步提升能力。\n\n同时，我们不能低估前几章所研究算法的重要性。线性回归、决策树、KNN、朴素贝叶斯等是机器学习算法的基础。它们仍然是筛选重要变量的首选方法。这些算法设定了性能的基准。然后，Bagging\
  \ 和 Boosting 的集成技术进一步增强了能力。因此，在开始使用 Boosting 或 Bagging 算法之前，我们应该始终使用基础算法来测试和基准化性能。\n\
  \n随着深度学习的出现，我们能够处理更复杂的数据集。深度学习为性能提供了额外的推动力。但为了处理深度学习算法，我们需要更好的硬件系统。在这种情况下，基于云的基础设施提供了良好的服务。我们可以将代码部署在\
  \ Google Colaboratory 中并运行代码，从而利用服务器的处理能力。\n\n至此，我们已经在本书的范围内讨论了监督学习算法。在第 1 章中，我们介绍了机器学习。在第\
  \ 2 章和第 3 章中，我们研究了回归和分类算法。在第四章中，我们学习了 Boosting、SVM 和深度学习模型等高级算法，并处理了结构化和非结构化数据。在下一章，也就是本书的最后一章，我们将研究模型从创建到维护的端到端生命周期。\n\
