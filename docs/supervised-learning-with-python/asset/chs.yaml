- "# 3. 分类问题的监督学习\n\n> *“预测非常困难，尤其是关于未来的预测。”*\n> \n> —— 尼尔斯·玻尔\n\n我们生活在一个对事件的预测能帮助我们调整计划的世界里。如果我们知道今天会下雨，我们就不会去露营。如果我们知道股市会崩盘，我们会暂时持有投资。如果我们知道某个客户将从我们的业务中流失，我们会采取一些措施来吸引他们回来。所有这些预测都极具洞察力，对我们的业务具有战略重要性。\n\
  \n了解哪些因素导致我们的销售额上升/下降、使一封邮件有效或导致产品失败，也会有所帮助。我们可以改进缺点，并继续保持优点。整个客户定位策略都可以利用此类知识进行修改。我们可以改造在线互动或改变产品测试：其应用方式多种多样。这类机器学习模型被称为*分类*算法，这也是本章的重点。\n\
  \n在第二章中，我们研究了用于预测连续变量的回归问题。在第三章中，我们将探讨预测分类变量的概念。我们将研究我们对某个事件是否发生的置信度。本章我们将学习逻辑回归、决策树、K-近邻、朴素贝叶斯和随机森林。我们将研究所有算法，并使用实际数据集开发\
  \ Python 代码。我们将处理缺失值、重复值和异常值，进行探索性数据分析（EDA），衡量算法的准确性，并选择最佳算法。最后，我们将通过一个案例研究来完善理解。\n\
  \n## 所需技术工具包\n\n本书使用 Python 3.5+。建议你在机器上安装 Python。我们使用 Jupyter notebook；需要安装 Anaconda-Navigator\
  \ 来执行代码。\n\n主要使用的库包括 numpy、pandas、matplotlib、seaborn、scikitlearn 等。建议你在 Python 环境中安装这些库。所有代码和数据集已上传至\
  \ Github 仓库，链接如下： [`https://github.com/Apress/supervised-learning-w-python/tree/master/Chapter%203`](https://github.com/Apress/supervised-learning-w-python/tree/master/Chapter%25203)\n\
  \n在开始学习分类“机器学习”之前，有必要先研究一下统计概念中的临界区域和 p 值，我们现在就来学习。它们有助于判断所有自变量中某个变量的显著性。这确实是一个非常强大且关键的概念！\n\
  \n\n\n## 假设检验与 p 值\n\n假设市场上推出了一种名为 X 的新药，声称能在 5 周内治愈 90% 的糖尿病患者。该公司对 100 名患者进行了测试，其中\
  \ 90 名在 5 周内痊愈。我们如何确保该药物确实有效，或者该公司是否在虚假宣传，或者抽样方法是否存在偏差？\n\n假设检验恰恰有助于回答这些问题。\n\n\
  在假设检验中，我们首先确定一个假设。在上述新药的例子中，我们的假设是：药物 X 能在 5 周内治愈 90% 的糖尿病患者。这被称为*零假设*，用 H[0] 表示。在本例中，H[0]\
  \ 为 0.9。如果基于证据拒绝了零假设，则需要接受一个*备择假设* H[1]。在本例中，H[1] < 0.9。我们总是从假设零假设为真开始。\n\n然后我们定义显著性水平\
  \ α。它衡量的是，在拒绝零假设 H[0] 之前，我们希望样本结果有多不可能出现。请参考图 3-1(i)，你将能理解其中的关联。\n\n![../images/499122_1_En_3_Chapter/499122_1_En_3_Fig1_HTML.png](img/499122_1_En_3_Fig1_HTML.png)\n\
  \n图 3-1\n\n(i) 必须指定显著性水平，即我们接受结果且不拒绝零假设的临界点。(ii) 临界区域是中间图像中显示的 5% 区域。(iii) 右侧图像显示了\
  \ p 值以及它在本例中如何落入临界区域。\n\n然后我们将临界区域定义为“c”，如图 3-1(ii) 所示。\n\n如果 X 表示治愈的糖尿病患者人数，则临界区域定义为\
  \ P(X<c) < α，其中 α = 5%。在 95% 的置信区间内，有 5% 的可能性样本不包含总体均值。这可以解释为：如果我们感兴趣的样本落在临界区域内，那么我们可以安全地拒绝零假设。\n\
  \n这正是 5% 或 0.05 被称为*显著性水平*的原因。如果我们想要 99% 的置信区间，那么 0.01 就是显著性水平。\n\n下一步是获取 p 值。请参考图\
  \ 3-1(iii) 以获得更好的理解。\n\n正式地讲，*p 值*是在临界区域方向上，得到样本值及更极端值的概率。它是一种检查样本结果是否落在假设检验临界区域内的方法。因此，我们根据\
  \ p 值来决定是拒绝还是接受零假设。\n\n一旦计算出 p 值，我们就分析该值是否落在临界区域内。如果答案是肯定的，我们就可以拒绝零假设。\n\n关于假设检验和\
  \ p 值的知识至关重要，因为它为识别*显著变量*铺平了道路。每当我们训练机器学习算法时，除了其他结果外，我们还会得到每个变量的 p 值。根据经验法则，如果 p\
  \ 值小于或等于 0.05，则该变量被视为显著变量。\n\n在这种情况下，零假设是自变量不显著，且不影响目标变量。如果 p 值小于或等于 0.05，我们可以拒绝零假设，从而得出结论：该变量确实是显著的。用统计学的语言来说，如果自变量\
  \ x 的 p 值小于或等于 0.05，则表明有强有力的证据反对零假设，因为零假设成立的概率低于 5%。或者换句话说，变量 x 是预测目标变量 y 的显著变量。但这并不意味着备择假设有\
  \ 95% 的概率是正确的。需要注意的是，p 值是一个基于零假设的条件，与备择假设无关。\n\n我们使用 p 值来筛选显著变量，并比较它们各自的重要性。这是一个被普遍接受的用于选择显著变量的指标。\n\
  \n接下来，我们将在下一节中探讨分类算法的概念。\n\n\n\n## 分类算法\n\n在日常业务中，我们常常需要做出决策：是否投资某只股票、是否向客户发送通知、接受或拒绝某个产品、批准或忽略某项申请。这些决策的基础，是我们对业务、流程、目标以及影响决策的各种因素所拥有的某种洞察。同时，我们也期望这些决策能带来有利的结果。\n\
  \n*监督分类*算法正是用于生成此类洞察并帮助我们做出决策的。它们预测某个事件发生或不发生的概率。同时，根据所选的监督学习算法，我们还能了解影响此类事件发生的因素。\n\
  \n从形式上讲，*分类*算法是监督式机器学习算法的一个分支，用于对某个类别的概率进行建模。例如，如果我们要进行二分类，就会对两类进行建模，比如通过/未通过、健康/生病、欺诈/真实、是/否等。它还可以扩展到多分类问题——例如，好/坏/中性、红/黄/蓝/绿、猫/狗/马/车等。\n\
  \n与回归模型类似，分类算法也有一个目标变量和多个自变量。唯一的区别在于，目标变量本质上是分类变量。用于预测的自变量可以是连续型或分类型，具体取决于建模所使用的算法。\n\
  \n以下用例将有助于阐明分类算法的用途：\n\n1.  一家零售商正在流失其回头客，即那些曾经购买过商品的顾客不再光顾。监督学习算法将帮助识别那些更容易流失且不再回来的客户。然后，零售商可以有选择地针对这些客户，提供折扣以吸引他们重新光顾。\n\
  \n2.  一家制造工厂必须保持其产品的最佳质量。为此，技术团队希望确定特定的工具、原材料和物理条件组合是否能带来最佳质量和产量。监督算法可以帮助进行这种选择。\n\
  \n3.  一家保险公司希望对哪些客户应该给予保单进行建模。需要根据客户的历史记录、就业详情、交易模式等做出决策。在这里，分类机器学习模型可以帮助预测客户的接受分数，该分数可用于批准或拒绝申请。\n\
  \n4.  一家向客户提供信用卡的银行需要识别哪些传入交易是欺诈性的，哪些是真实的。需要根据交易详情（如来源、金额、交易时间、方式）以及其他客户参数做出决策。监督分类算法将有助于做出该决策。\n\
  \n5.  一家电信运营商希望在市场上推出一款新的数据产品。为此，需要锁定那些对该产品感兴趣并可能充值使用的用户。监督分类算法能够为每个用户生成一个分数，随后可以据此提供优惠。\n\
  \n上述用例是行业中一些实际的应用。分类算法会为某个事件生成一个概率分数，销售、市场、运营、质量、风险等团队据此可以做出业务决策。这是一种非常强大且便捷的用法！\n\
  \n有不少算法可以实现这一目的，我们将在本章讨论其中一部分，其余部分将在第 4 章中讨论。\n\n可以使用的算法包括：\n\n*   逻辑回归\n*   k-近邻\n\
  *   决策树\n*   随机森林\n*   朴素贝叶斯\n*   支持向量机\n*   梯度提升\n*   神经网络\n\n我们将在本章讨论前五种算法，其余的在下一章讨论。让我们从下一节的逻辑回归算法开始讨论。\n\
  \n\n\n### 用于分类的逻辑回归\n\n在第 2 章中，我们学习了如何使用线性回归预测连续变量的值，例如客户数量、销售额、降雨量等。现在，我们需要预测客户是否会到访、销售额是否会增长等问题。通过使用逻辑回归，我们可以对上述问题进行建模和求解。\n\
  \n正式地说，逻辑回归是一种利用逻辑函数对分类问题（即分类因变量）进行建模的统计模型。在基本形式中，我们建模的是*二元*分类问题，并将其称为二元逻辑回归。在需要建模多个类别的复杂问题中，我们使用*多项*逻辑回归。\n\
  \n让我们通过一个例子来理解逻辑回归。\n\n假设我们需要判断一笔信用卡交易是否具有欺诈性。响应是二元的（是或否）；如果交易看起来可信，它将被接受，否则将被拒绝。我们将获得传入的交易属性，如金额、交易时间、支付方式等，并且需要基于这些属性做出决策。\n\
  \n对于此类问题，逻辑回归对欺诈概率进行建模。在上述情况下，欺诈概率可以表示为：\n\n概率（欺诈 = 是 | 金额）\n\n该概率的值将介于 0 和 1 之间。可以解释如下：给定一个“欺诈金额”的值，我们可以对信用卡交易的真实性进行预测。\n\
  \n问题在于我们如何对这种关系进行建模。如果我们使用*线性*方程，可以简单地将其写为：\n\n![$$ \\mathrm{Probability}\\kern0.17em\
  \ \\mathrm{or}\\; \\mathrm{pr}\\left(\\mathrm{x}\\right)={\\upbeta}_0+{\\upbeta}_1\\\
  mathrm{x} $$](img/499122_1_En_3_Chapter_TeX_Equ1.png)\n\n（方程 3-1）\n\n如果我们想通过拟合上述公式，使用“金额”来预测“成功”，可以用以下图表的形式表示。对于较小的欺诈金额值，我们可以看到概率小于零，而对于较大的值，欺诈概率大于一。这两种情况都是不可能的。\n\
  \n因此，逻辑回归被用来解决这个问题。逻辑回归使用 *sigmoid* 函数，该函数接受任何实数值作为输入，并输出介于 0 和 1 之间的值。标准的*逻辑回归*方程可以表示为方程\
  \ 3-2，并在图 3-2 中展示。\n\n![$$ \\mathrm{P}\\left(\\mathrm{x}\\right)={\\mathrm{e}}^{\\\
  mathrm{t}}--\\left({\\mathrm{e}}^{\\mathrm{t}}+1\\right)\\;\\mathrm{where}\\;\\\
  mathrm{t}={\\upbeta}_0+{\\upbeta}_1\\mathrm{x} $$](img/499122_1_En_3_Chapter_TeX_Equ2.png)\n\
  \n（方程 3-2）\n\n![../images/499122_1_En_3_Chapter/499122_1_En_3_Fig2_HTML.jpg](img/499122_1_En_3_Fig2_HTML.jpg)\n\
  \n图 3-2\n\n(i) 线性回归函数无法很好地完成预测欺诈的任务。(ii) 具有“S”形曲线的逻辑回归将更合适，因为它会给出介于 0 和 1 之间的分数。\n\
  \n可以重写为：\n\n![$$ \\mathrm{P}\\left(\\mathrm{x}\\right)={\\mathrm{e}}^{\\upbeta_0+{\\\
  upbeta}_1\\mathrm{x}}--\\left(1+{\\mathrm{e}}^{\\upbeta_0+{\\upbeta}_1\\mathrm{x}}\\\
  right) $$](img/499122_1_En_3_Chapter_TeX_Equ3.png)\n\n（方程 3-3）\n\n接下来想到的问题是，如何拟合这个方程。回想一下，在线性回归中，我们希望预测的目标变量尽可能接近实际值。这里也采用了类似的方法。逻辑回归的拟合是使用*最大似然*函数完成的。似然函数衡量统计模型的拟合优度，对于逻辑回归，有时也称为对数似然函数。其数学证明超出了本书的范围。\n\
  \n如果我们对方程 3-3 进行变换，将得到：\n\n![$$ \\log\\;\\left(\\mathrm{p}\\left(\\mathrm{x}\\right)\\\
  hbox{-} \\hbox{-} 1\\hbox{-} \\mathrm{p}\\left(\\mathrm{x}\\right)\\right)={\\upbeta}_0+{\\\
  upbeta}_1\\mathrm{x} $$](img/499122_1_En_3_Chapter_TeX_Equ4.png)\n\n（方程 3-4）\n\n\
  如果我们对两边取自然对数：\n\n![$$ \\left(\\mathrm{p}\\left(\\mathrm{x}\\right)\\hbox{-} \\hbox{-}\
  \ 1\\hbox{-} \\mathrm{p}\\left(\\mathrm{x}\\right)\\right)={\\mathrm{e}}^{\\upbeta_0+{\\\
  upbeta}_1\\mathrm{x}} $$](img/499122_1_En_3_Chapter_TeX_Equ5.png)\n\n（方程 3-5）\n\n\
  在方程 3-5 中，量 ![$$ \\frac{\\mathrm{p}\\left(\\mathrm{x}\\right)}{\\left(1-\\mathrm{p}\\\
  left(\\mathrm{x}\\right)\\right)} $$](img/499122_1_En_3_Chapter_TeX_IEq1.png) 被称为*优势比*。之所以称为优势比，是因为与概率相比它更直观，因为优势比是博彩中的常用术语。\n\
  \n项 log ![$$ \\left(\\frac{\\mathrm{p}\\left(\\mathrm{x}\\right)}{1-\\mathrm{p}\\\
  left(\\mathrm{x}\\right)}\\right) $$](img/499122_1_En_3_Chapter_TeX_IEq2.png) 被称为\
  \ *logit*。如果与线性回归方程进行比较，我们可以很容易地发现，随着 x 每增加一个单位，logit（有时也称为对数优势比）会变化 β[1]。该值可以取\
  \ 0 到无穷大之间的任何值。我们可以在图 3-2(ii) 中可视化该函数。\n\n在大多数业务问题中，我们拥有不止一个自变量，因此我们使用多项逻辑回归来解决。数学上，它可以表示如下：\n\
  \n![$$ \\log\\;\\left(\\mathrm{p}\\left(\\mathrm{x}\\right)\\hbox{-} \\hbox{-} 1\\\
  hbox{-} \\mathrm{p}\\left(\\mathrm{x}\\right)\\right)={\\upbeta}_0+{\\upbeta}_1\\\
  mathrm{x}+\\dots +{\\upbeta}_{\\mathrm{n}} $$](img/499122_1_En_3_Chapter_TeX_Equ6.png)\n\
  \n（方程 3-6）\n\n但还有一个问题仍未解答：既然我们有线性回归，为什么还需要逻辑回归？\n\n假设一家银行正在根据客户的历史交易和服务细节评估其服务质量。在这种情况下，预测的响应将是正面的、负面的或中性的。我们将这些响应编码为：\n\
  \n![../images/499122_1_En_3_Chapter/499122_1_En_3_Figa_HTML.png](img/499122_1_En_3_Figa_HTML.png)\n\
  \n如果我们将目标变量视为连续变量，这意味着我们必须预测 y 的实际值。但这意味着正面比负面少一，负面比中性少一。并且正面与负面之间的差异与负面与中性之间的差异相同。这个论点本质上是错误的，并且没有任何实际意义。\n\
  \n此外，即使我们将响应的数量从三个减少到两个，比如只有正面和负面，线性回归也可能给出超过 1 或小于 0 的概率分数，这在数学上是不可能的。如果我们拟合最佳回归线，仍然不足以确定任何可以用来区分这两个类别的点。它会将一些正面分类为负面，反之亦然。此外，如果我们从线性回归中得到\
  \ 0.5 的分数，应该将其分类为正面还是负面？而一个异常值可能会完全打乱我们的输出。因此，使用像逻辑回归这样的分类算法而不是线性回归模型来解决问题，在实践中更为合理。\n\
  \n与线性回归一样，逻辑回归也有一些假设：\n\n1.  作为一种分类算法，逻辑回归模型的结果是一个二元或二分变量，例如成功/失败、是/否或零/一。\n\n2.\
  \  结果变量的 logit 与每个自变量之间存在线性关系。\n\n3.  不存在异常值，或者至少连续变量没有显著的异常值。\n\n4.  自变量之间不存在相关性。\n\
  \n\n\n需要注意的一点是，算法的准确性取决于用于训练算法的训练数据。如果训练数据不具有代表性，那么最终得到的模型将不够稳健。训练数据应符合我们在第 1 章中讨论的数据质量标准。我们将在第\
  \ 5 章中详细重新探讨这一概念。\n\n提示\n\n为了获得具有代表性的数据集，建议每个自变量相对于其最不频繁的值至少要有 10 个数据点。例如，对于 20\
  \ 个自变量和一个最不频繁的结果值 0.2，我们应该有 (20*10)/0.2 = 1000 个数据点。\n\n关于逻辑回归需要注意的要点：\n\n1.  逻辑分类模型的输出通常是一个事件的概率分数。它可用于二分类和多分类问题。\n\
  \n2.  由于输出是概率，因此它不能大于 1，也不能小于 0。因此逻辑曲线的形状是“S”形。\n\n3.  它可以处理任意数量的类别作为目标变量，也可以处理分类变量和连续自变量。\n\
  \n4.  最大似然算法有助于确定方程中各自的系数。自变量不需要服从正态分布，也不需要在每个组中具有相等的方差。\n\n5.  ![$$ \\frac{\\mathrm{P}}{1\\\
  hbox{-} \\mathrm{p}} $$](img/499122_1_En_3_Chapter_TeX_IEq3.png) 是优势比，只要这个值为正，成功的概率就超过\
  \ 50%。\n\n6.  在逻辑回归中，系数的解释比较困难，因为其关系不像线性回归那样直接。\n\n在继续之前，必须仔细审视准确度测量方法。建议你彻底掌握每一种方法。这确实是监督学习中的一个关键组成部分！\n\
  \n## 评估解决方案的准确性\n\n创建机器学习解决方案的目标是为了预测未来事件。但在将模型部署到生产环境之前，我们必须衡量模型的性能。此外，我们通常会通过多次迭代训练多个算法。我们必须根据各种准确的\
  \ KPI 来选择最佳算法。在本节中，我们将学习最重要的准确性评估标准。\n\n衡量分类问题效能的最重要指标如下：\n\n![../images/499122_1_En_3_Chapter/499122_1_En_3_Fig3_HTML.png](img/499122_1_En_3_Fig3_HTML.png)\n\
  \n图 3-3\n\n混淆矩阵是衡量机器学习模型效能的一个绝佳方法。通过它，我们可以计算精确率、召回率、准确率和 F1 分数，以了解模型的性能。\n\n1. \
  \ **混淆矩阵**：最流行的方法之一是*混淆矩阵*。它可用于二分类和多分类问题。其最简单的形式如图 3-3 所示，为一个 2×2 矩阵。\n\n现在我们将分别学习每个参数：\n\
  \n1.  **准确率**：准确率是指预测正确的数量。在前面的例子中，准确率为 (131+27)/ (131+27+3+24) = 85%\n\n2.  **精确率**：精确率表示在所有预测为正类的样本中，实际为正类的比例。在前面的例子中，精确率为\
  \ 131/ (131+24) = 84%\n\n3.  **召回率或灵敏度**：召回率是指所有实际为正类的事件中，我们成功捕获的比例。在这个例子中，为 131/\
  \ (131+3) = 97%\n\n4.  **特异度或真负率**：特异度是指所有实际为负类的样本中，被正确预测的比例。在这个例子中：27/ (27+24)\
  \ = 92%\n\n5.  **ROC 曲线和 AUC 值**：ROC（接收者操作特征）曲线用于比较不同模型。它是 TPR（真正率）和 FPR（假正率）之间的曲线图。ROC\
  \ 曲线下的面积（AUC）是衡量模型好坏的标准。AUC 值越高，模型越好，如图 3-4 所示。与水平方向成 45 度角的直线代表 50%的准确率。一个好的模型其面积应大于\
  \ 0.5，并且曲线应紧贴图形的左上角，如图 3-4 所示。图中绿色的曲线似乎是最好的模型。\n\n![../images/499122_1_En_3_Chapter/499122_1_En_3_Fig4_HTML.jpg](img/499122_1_En_3_Fig4_HTML.jpg)\n\
  \n图 3-4\n\n(i) 左侧显示的是 ROC 曲线。(ii) 右侧显示的是不同的 ROC 曲线。绿色的 ROC 曲线是最好的；它紧贴左上角，并且具有最大的\
  \ AUC 值。\n\n6.  **基尼系数**：我们也使用基尼系数来衡量模型拟合的好坏。正式地说，它是 ROC 曲线中面积之比，是 AUC 的缩放版本。\n\n\
  ![$$ GI=2\\ast AUC\\hbox{-} 1 $$](img/499122_1_En_3_Chapter_TeX_Equ7.png)\n\n(公式\
  \ 3-7)\n\n与 AUC 值类似，我们更倾向于选择基尼系数值更高的模型。\n\n7.  **F1 分数**：很多时候，我们在比较模型时会面临选择哪个 KPI\
  \ 的问题（即更高的精确率还是更高的召回率）。F1 分数为我们解决了这个难题。\n\n![$$ \\mathrm{F}1\\;\\mathrm{Score}=2\\\
  ;\\left(\\mathrm{precision}\\ast \\mathrm{recall}\\right)/\\mathrm{precision}+\\\
  mathrm{recall} $$](img/499122_1_En_3_Chapter_TeX_Equ8.png)\n\n(公式 3-8)\n\nF1 分数是精确率和召回率的调和平均数。F1\
  \ 分数越高越好。\n\n8.  **AIC 和 BIC**：赤池信息准则（AIC）和贝叶斯信息准则（BIC）用于选择最佳模型。AIC 源于频率概率，而 BIC\
  \ 源于贝叶斯概率。\n\n![$$ AIC=\\hbox{-} 2/\\mathrm{N}\\ast LL+2\\ast \\mathrm{k}/\\mathrm{N}\
  \ $$](img/499122_1_En_3_Chapter_TeX_Equ9.png)\n\n(公式 3-9) 而\n\n\n\n![$$ BIC=\\hbox{-}\
  \ 2\\ast LL+\\log \\left(\\mathrm{N}\\right)\\ast \\mathrm{k} $$](img/499122_1_En_3_Chapter_TeX_Equ10.png)\n\
  \n（公式 3-10）\n\n在这两个公式中，N 是训练集中的样本数量，LL 是模型在训练数据集上的对数似然，k 是模型中的变量数量。BIC 中的对数是以 e\
  \ 为底的自然对数，称为自然算法。\n\n我们倾向于 AIC 和 BIC 的较低值。AIC 会因模型的复杂度而对其进行惩罚，但 BIC 对模型的惩罚比 AIC\
  \ 更重。如果在这两者之间进行选择，与 BIC 相比，AIC 会选择更复杂的模型。\n\n提示\n\n在非常复杂的模型与精度相近的简单模型之间进行选择时，请选择更简单的那个。记住，自然总是偏爱简洁！\n\
  \n1.  **一致性与不一致性**：一致性是衡量模型的一种指标。让我们先理解一致性与不一致性的含义。\n\n假设你正在构建一个模型来预测客户是否会流失。输出结果是流失概率。数据如表\
  \ 3-1 所示。\n\n表 3-1\n\n客户是否流失的相应概率得分\n\n| 客户 ID | 概率 | 是否流失 |\n    | --- | --- |\
  \ --- |\n    | 1001 | 1 | 0.75 |\n    | 2001 | 0 | 0.24 |\n    | 3001 | 1 | 0.34\
  \ |\n    | 4001 | 0 | 0.62 |\n\n组 1：（流失 = 1）：客户 1001 和 3001\n\n组 2：（流失 = 0）：客户 2001\
  \ 和 4001\n\n现在，我们从组 1 和组 2 中各取一个数据点组成配对，然后进行比较。因此，配对情况如下：\n\n配对 1：1001 和 2001\n\n\
  配对 2：1001 和 4001\n\n配对 3：3001 和 2001\n\n配对 4：3001 和 4001\n\n通过分析这些配对，我们可以很容易地发现，在前三个配对中，模型将较高概率的分类为流失者。这里模型的分类是正确的。这些配对被称为一致对。配对\
  \ 4 中，模型将较低概率的分类为流失者，这不合逻辑。这个配对被称为不一致对。如果两个配对的概率相近，则称为并列对。\n\n我们可以使用 Somers D 来衡量质量，其公式为：\n\
  \nSomers D = （一致对百分比 – 不一致对百分比）。Somers D 越高，模型越好。\n\n一致性本身不能作为模型选择的唯一参数。它应作为衡量指标之一，同时还应检查其他指标。\n\
  \n2.  **KS 统计量**：KS 统计量或 Kolmogorov-Smirnov 统计量是衡量模型有效性的指标之一。它是累积真正例与累积假正例之间的最大差值。KS\
  \ 值越高，模型越好。\n\n3.  还建议在以下数据集上测试模型性能并比较关键绩效指标（KPI）：\n    1.  训练数据集：用于训练算法的数据集\n\n\
  2.  测试数据集：用于测试算法的数据集\n\n3.  验证数据集：该数据集仅在最终验证阶段使用一次\n\n4.  时间外验证：进行时间外测试是一种良好实践。例如，如果训练/测试/验证数据集来自\
  \ 2015 年 1 月至 2017 年 12 月，我们可以使用 2018 年 1 月至 2018 年 12 月作为时间外样本。其目的是测试模型在未见数据集上的性能。\n\
  \n以上是用于检查模型准确性的各种指标。我们通常使用多种算法创建多个模型。并且对于每种算法，都会进行多次迭代。因此，这些指标也用于比较模型，并挑选出最佳模型。\n\
  \n还有一点我们需要注意。我们总是希望系统能够准确。我们想要更好地预测股价是上涨还是下跌，或者明天是否会下雨。但有时，准确性可能具有欺骗性。我们将通过一个例子来理解这一点。\n\
  \n例如，在开发信用卡欺诈交易系统时，我们的业务目标是检测欺诈交易。通常，绝大多数（超过 99%）的交易并非欺诈。这意味着，如果一个模型将每笔传入的交易都预测为正常，该模型的准确率仍将达到\
  \ 99%！但该模型并未实现其识别欺诈交易的业务目标。在这种业务场景下，召回率才是我们应该关注的重要参数。\n\n至此，我们结束了对准确性评估的讨论。通常，对于分类问题，逻辑回归是我们用于建立基线的第一个算法。现在，让我们求解一个逻辑回归问题的示例。\n\
  \n\n\n## 案例研究：信用风险\n\n**业务背景**：信用风险即借款人未能偿还任何贷款。在银行业，这是在批准申请人贷款前需要考虑的重要因素。梦想住房金融公司主营所有住房贷款业务，业务覆盖城市、半城市和农村地区。客户首先申请住房贷款，随后公司会验证客户的贷款资格。\n\
  \n**业务目标**：公司希望根据客户在线申请表中填写的详细信息，实现贷款资格审核流程的自动化（实时）。这些详细信息包括性别、婚姻状况、教育程度、受抚养人数、收入、贷款金额、信用记录等。为实现此流程自动化，他们提出了一个问题：识别出有资格获得特定贷款金额的客户群体，以便能精准定位这些客户。这里他们提供了一个部分数据集。\n\
  \n**数据集**：数据集和代码可在本章开头提供的书籍 GitHub 链接中找到。变量描述如下：\n\n变量说明\n\n1.  Loan_ID：唯一贷款编号\n\
  2.  Gender：性别（男/女）\n3.  Married：申请人是否已婚（是/否）\n4.  Dependents：受抚养人数\n5.  Education：申请人教育程度（本科/本科以下）\n\
  6.  Self_Employed：是否自雇（是/否）\n7.  ApplicantIncome：申请人收入\n8.  CoapplicantIncome：共同申请人收入\n\
  9.  LoanAmount：贷款金额（单位：千）\n10.  Loan_Amount_Term：贷款期限（单位：月）\n11.  Credit_History：信用记录是否符合要求\n\
  12.  Property_Area：房产区域（城市/半城市/农村）\n13.  Loan_Status：贷款是否获批（是/否）\n\n现在开始使用逻辑回归进行编码。我们将探索数据集、清洗并转换数据、拟合模型，然后衡量解决方案的准确率。\n\
  \n**步骤 1**：首先导入所有必需的库。导入 seaborn 用于统计绘图；为了将数据框拆分为训练集和测试集，我们将使用 sklearn 包中基于随机函数的数据拆分功能。为了计算准确率指标和混淆矩阵，我们从\
  \ sklearn 导入了 metrics 模块。\n\n```\nimport pandas as pd\nfrom sklearn.linear_model\
