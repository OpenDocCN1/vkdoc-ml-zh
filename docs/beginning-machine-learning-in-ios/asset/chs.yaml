  @IBOutlet weak var fullBaths: UITextField!\n@IBOutlet weak var halfBaths: UITextField!\n\
  @IBOutlet weak var bedrooms: UITextField!\n@IBOutlet weak var kitchen: UITextField!\n\
  @IBOutlet weak var garageType: UITextField!\n@IBOutlet weak var housePrice: UILabel!\n\
  @IBAction func onDataSubmit(_ sender: Any) {\n}\n```\n\n*步骤 4*：将模型文件拖放到 Xcode 导航窗格中的项目文件夹中。选择模型文件后，你将看到各种信息，如模型的名称、类型、大小、作者和描述。你可以通过单击模型类部分下的模型名称来查看模型的\
  \ Swift 代码。在模型评估参数下，你还会看到模型接收的输入和返回的输出。在我们的应用程序中使用此模型之前，请确保在右侧窗格中为你的项目勾选了目标成员资格。\n\
  \n*步骤 5*：要在代码中使用该模型，我们需要导入 Core ML 框架，并在 ViewController 类中声明一个代表该模型的模型变量。为此，将以下代码添加到你的\
  \ ViewController.swift 文件中：\n\n```\nimport CoreML\n...\nclass ViewController: UIViewController\
  \ {\n...\nlet model = SentimentAnalyzer()\n...\n}\n...\n```\n\n\n\n*步骤 6*：现在，为了预测房价，我们将在点击提交按钮时调用预测方法。同时，我们还会将标签的值设置为模型返回的预测价格。为此，请在\
  \ `ViewController` 类中添加以下代码：\n\n```\n@IBAction func onDataSubmit(_ sender: Any)\
  \ {\nlet prediction = try? model.prediction(Area: Double(area.text!) ?? 0,\nNeighborhood:\
  \ neighborhood.text!,\nHouseStyle: houseStyle.text!,\nFullBath: Double(fullBaths.text!)\
  \ ?? 0,\nHalfBath: Double(halfBaths.text!) ?? 0,\nBedroom: Double(bedrooms.text!)\
  \ ?? 0,\nKitchen: Double(kitchen.text!) ?? 0,\nGarageType: garageType.text!)\nhousePrice.text\
