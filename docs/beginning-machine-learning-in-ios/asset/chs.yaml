- "# 1. 机器学习简介\n\n本章对机器学习（ML）的概念进行了基本解释，并介绍了其应用、ML 的类型、工作原理以及我们为何需要它。即使你是该概念的新手，本章也能为你提供开始学习\
  \ ML 所需的信息。这是一个有趣的章节，包含大量图片和示例，帮助你理解文本内容。\n\n## 什么是机器学习？\n\n在过去几年中，ML（也称为自动学习）一直是计算机科学和信息技术领域发展最快的领域之一。顾名思义，机器学习是一个机器学习给定输入数据集中重要模式的过程。现在你可能想知道“模式”一词在此语境中的含义。请参考图\
  \ 1-1 以获得更清晰的概念。\n\n![../images/474993_1_En_1_Chapter/474993_1_En_1_Fig1_HTML.jpg](img/474993_1_En_1_Fig1_HTML.jpg)\n\
  \n图 1-1\n\n数据模式\n\n此图展示了四组数据点在其对应图表上的映射。当我们这样做时，数据集中的数据点会形成独特的模式。图中观察到的模式有：稳定、上升、下降和可变。学习此类数据模式可用于开发一种算法，帮助机器在遇到陌生数据时进行适应并做出适当反应。ML\
  \ 的目标是让机器基于学习到的内容对陌生数据自动做出反应。例如，如果机器观察到给定的数据集形成一种稳定模式，其中数据点在 -1 到 +1 之间波动，它就可以预测下一个将添加到数据集中的数据点的值。\n\
  \n总而言之，ML 是创建从数据中学习并进行预测的程序的过程。一些著名的 ML 模型如下：\n\n![../images/474993_1_En_1_Chapter/474993_1_En_1_Fig5_HTML.jpg](img/474993_1_En_1_Fig5_HTML.jpg)\n\
  \n图 1-5\n\n决策树\n\n*   *决策树*：它使用树状图，根据对项目的观察来预测项目的目标值。图 1-5 展示了一个决策树，可帮助你决定是否接受工作邀请。\n\
  \n![../images/474993_1_En_1_Chapter/474993_1_En_1_Fig4_HTML.png](img/474993_1_En_1_Fig4_HTML.png)\n\
  \n图 1-4\n\n人工神经网络\n\n*   *人工神经网络（ANN）*：它是一个相互连接的节点网络，旨在以与人脑相同的方式处理信息。信息以节点间互连的形式存储在\
  \ ANN 中。它接收输入，根据存储的信息处理输入，并生成输出。图 1-4 显示了 ANN 中节点之间的互连。\n\n![../images/474993_1_En_1_Chapter/474993_1_En_1_Fig3_HTML.png](img/474993_1_En_1_Fig3_HTML.png)\n\
  \n图 1-3\n\n支持向量机\n\n*   *支持向量机（SVM）*：它是一种分类器，正式定义为一个分离超平面。给定一些带标签的训练数据，SVM 算法会输出一个最优超平面，用于对新示例进行分类。在二维空间中，这个超平面是一条将平面分成两部分的直线。请参考图\
  \ 1-3 以获得更清晰的理解。\n\n![../images/474993_1_En_1_Chapter/474993_1_En_1_Fig2_HTML.png](img/474993_1_En_1_Fig2_HTML.png)\n\
  \n图 1-2\n\n集成学习\n\n*   *集成学习*：结合多种 ML 算法（分类器），以获得比单独使用任何一种 ML 算法更好的预测性能。图 1-2 展示了集成学习中的控制流程。\n\
  \n\n\n## 机器学习有哪些应用？\n\n机器学习是一种我们在日常活动中有意或无意使用的工具。以下是一些常见的机器学习应用：\n\n*   电子邮件服务过滤垃圾邮件。\n\
  *   数码相机检测人脸。\n*   个人数字助理（PDA）识别语音指令。\n*   光学字符识别（OCR）软件从图像中识别字符。\n*   在线支付网关检测信用卡欺诈。\n\
  *   网站向用户展示个性化广告。\n\n除了上述应用，机器学习还用于其他各种领域，例如医疗诊断、太空探索、野生动物保护、情感分析等等。\n\n## 为什么我们需要机器学习？\n\
  \n假设我们想从用户的照片库中，在应用程序里展示所有玫瑰花的图片。这看起来是个简单的任务，所以我们可以编写一些程序。也许，我们会从颜色入手。如果图片中的主色调是红色，那它可能就是一朵玫瑰。\n\
  \n```\n// 使用颜色\n如果 颜色 == \"偏红\"\n```\n\n图 1-6 展示了不同类型的玫瑰。看着这张图，你会注意到有很多玫瑰是白色或黄色的。所以，我们会继续前进，开始描述形状。但很快我们就会意识到，即使编写这样一个简单的程序，用编程方式实现也非常困难。因此，这就是我们需要机器学习帮助的地方。我们不会用编程方式描述玫瑰的样子，而是通过经验来描述玫瑰。\n\
  \n![../images/474993_1_En_1_Chapter/474993_1_En_1_Fig6_HTML.jpg](img/474993_1_En_1_Fig6_HTML.jpg)\n\
  \n图 1-6\n\n不同类型的玫瑰\n\n机器学习有两个步骤。第一步，你收集玫瑰、百合、向日葵和其他花卉的图片，并给它们打上标签。你将它们通过一个学习算法运行，就会得到我们所说的模型。这个模型是对玫瑰外观的经验性表示。这一步被称为学习。第二步，你执行以下操作：\n\
  \n*   拍摄一张玫瑰的图片。\n*   将第一步生成的模型嵌入到你的应用程序中。\n*   将玫瑰的图片通过模型运行。\n\n你会得到图片的标签和置信度。见图\
  \ 1-7。这一步被称为推理。\n\n![../images/474993_1_En_1_Chapter/474993_1_En_1_Fig7_HTML.jpg](img/474993_1_En_1_Fig7_HTML.jpg)\n\
  \n图 1-7\n\n推理\n\n这就是我们如何利用机器学习的潜力来简化任务。\n\n## 机器学习是如何工作的？\n\n通俗地说，机器学习可以被看作是将过去的经验转化为专业知识。让我们考虑识别垃圾邮件并为其打标签的任务。为了执行这个任务，机器会创建一个集合，包含所有之前由人类用户标记为垃圾邮件的电子邮件；然后，机器会识别出所有在邮件中出现即表明是垃圾邮件的词汇。现在，当一封新邮件出现时，机器会扫描它，查找从之前垃圾邮件集合中识别出的可疑词汇，以判断新邮件是否为垃圾邮件。通过这种方式，机器就能正确且自动地为新邮件打标签。\n\
  \n让我们考虑另一个涉及机器学习的任务，即相机应用程序检测人脸。这个功能有助于相机在拍照前确保所有脸部都对焦。见图 1-8。为了自动检测人脸，相机需要知道人脸的结构。为此，相机应用程序中应用了一个学习算法，在此过程中，它使用一个包含各种人脸的训练数据集进行工作。通过分析训练数据集中的所有人脸，相机观察到了训练数据集中所有数据成员的共同模式。例如，它可能观察到所有人脸都由两只眼睛、一个鼻子和一对嘴唇组成。除此之外，它还可能观察到这些元素的定位。通过学习这些，相机现在就能自动检测人脸了。\n\
  \n![../images/474993_1_En_1_Chapter/474993_1_En_1_Fig8_HTML.jpg](img/474993_1_En_1_Fig8_HTML.jpg)\n\
  \n图 1-8\n\n面部识别\n\n有许多算法用于机器学习。其中一种算法是感知机学习算法。下一节将讨论这个算法，以便更清晰地了解机器学习。\n\n## 感知机学习算法\n\
  \n感知机是神经网络的一个经典例子，它根据接收到的输入产生二进制输出。我们可以将感知机用于分类任务，即需要将输入分为两个输出类别之一。例如，考虑图 1-9，它展示了一个线性可分问题。这里的目标是创建一个能够将红点与蓝点分开的感知机。为此，感知机必须首先分析训练数据集，并在图表上确定一条将蓝点与红点分开的直线。一旦完成，感知机就能通过确定新输入向量相对于该直线在图表上的位置，将其分类为蓝点或红点。\n\
  \n![../images/474993_1_En_1_Chapter/474993_1_En_1_Fig9_HTML.png](img/474993_1_En_1_Fig9_HTML.png)\n\
  \n图 1-9\n\n线性可分问题\n\n以下是感知机确定分隔两类输入向量的直线的学习过程：\n\n*   目标是基于训练数据集获得一条将红点与蓝点分开的直线。那么，让我们考虑一条直线的方程：\n\
  \n    ax + by + c = 0\n\n    x = - ![$$ \\frac{c}{a} $$](img/474993_1_En_1_Chapter_TeX_IEq1.png)\
  \ `-` ![$$ \\frac{b}{a} $$](img/474993_1_En_1_Chapter_TeX_IEq2.png) y\n\n*   我们现在得到了一个直线方程。直线的位置完全取决于\
  \ a、b 和 c 的值。因此，我们可以根据需要调整权重（a、b 和 c）的值。\n\n*   现在，将权重（a、b 和 c）初始化为随机的实数值。\n\n*\
  \   遍历训练数据集，收集所有被当前权重集错误分类的数据成员。如果所有数据成员都被正确分类，则将权重的值代入直线方程。你就找到了分隔红点和蓝点的直线。\n\n\
  *   否则，根据错误分类的数据成员修改权重（a、b 和 c），并再次遍历训练数据集。重复此过程，直到所有数据成员都被正确分类。\n\n\n\n## 机器学习类型\n\
  \n机器学习算法大致可分为三类：\n\n1.  *监督学习*：此类学习算法包含一个训练数据集，其中包含由输入值和期望输出值组成的配对。这类数据被称为标记训练数据。在此类算法中，会生成一个映射函数，将训练数据集中的输入值映射到其对应的输出值。监督学习代表了人类教授计算机的概念，主要用于执行分类任务。\n\
  \n2.  *无监督学习*：此类学习算法包含一个训练数据集，其中仅有输入值，没有输出值。这类数据被称为未标记训练数据。在此类学习算法中，学习纯粹基于数据的结构进行。无监督学习代表了计算机自我学习的概念，主要用于解决聚类任务。\n\
  \n3.  *强化学习*：此类学习算法通过与环境的交互来产生动作，并发现错误或成功。这种学习方式使机器能够自动确定特定环境中的理想行为。机器需要简单的反馈来学习哪个动作最佳；这被称为强化信号。\n\
  \n现在你已经了解了机器学习的基础知识，我们将讨论苹果公司提供的核心机器学习框架，用于将预训练的机器学习模型集成到 iOS 应用中。\n\n## 总结\n\n\
  *   机器学习是一个过程，在此过程中，机器学习给定数据集中的显著模式，以便能够进行预测。\n\n*   集成学习、支持向量机、人工神经网络和决策树是一些著名的机器学习模型。\n\
  \n*   垃圾邮件过滤、人脸检测、语音识别、光学字符识别、信用卡欺诈检测和个性化广告是机器学习的常见示例。\n\n*   机器学习的高级应用包括医疗诊断、太空探索、野生动物保护和情感分析。\n\
  \n*   机器学习识别历史数据中的模式，并利用这些知识对未来可能遇到的任何陌生数据做出适当反应。\n\n*   感知机是机器学习的一个经典示例，它根据接收到的输入给出二元输出，可用于解决线性可分问题。\n\
  \n*   机器学习算法大致分为三类：监督学习、无监督学习和强化学习。\n\n"
- "# 2. Core ML 框架简介\n\n在第 1 章中，你学习了机器学习的基本定义、工作原理、应用场景以及使用它所需的条件。本章将向你介绍 Core ML\
  \ 框架，该框架由苹果公司于 2017 年推出，旨在允许应用程序开发人员在其 iOS 应用中实现机器学习。你还将学习训练和推理的概念，这将让你更清晰地了解机器学习的工作原理。\n\
  \n本章还提供了为 iOS 设备创建机器学习应用的分步指南。如果你之前没有创建过 iOS 应用，也无需担心，因为本章将指导你完成从零开始创建应用的整个过程。\n\
  \n## Core ML 概览\n\nCore ML 是苹果公司发布的一个开创性的应用开发框架。它允许你在 iOS 应用中使用预训练的机器学习模型。\n\n传统上，机器学习应用必须依赖云服务来运行第三方机器学习算法。这导致应用在移动设备上运行非常缓慢。但随着\
  \ Core ML 的推出，机器学习应用现在可以在设备上本地运行经过优化和训练的机器学习算法，从而带来更快的处理速度（图 2-1）。\n\n![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig1_HTML.jpg](img/474993_1_En_2_Fig1_HTML.jpg)\n\
  \n图 2-1\n\nCore ML 应用带来更快的处理时间\n\nCore ML 功能强大，可用于实现多种功能。然而，Core ML 有两个直接的应用：\n\n\
  *   首先，开发者可以使用 Core ML 中已有的预训练模型。\n\n*   其次，他们可以使用 Caffe、Turi 和 Keras 等框架构建自己的自定义机器学习模型，然后将其转换为\
  \ Core ML 模型，以便在其 iOS 应用中使用。\n\n一些使用 Core ML 提供功能的知名应用包括 Pinterest（基于图像的搜索）、iPhone\
  \ 照片图库（将照片分组）和 Nude App（识别包含裸体的图片）。\n\n图 2-2 展示了将使用第三方框架创建的机器学习模型转换为 Core ML 格式的过程，以便你可以在应用中使用它。\n\
  \n![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig2_HTML.jpg](img/474993_1_En_2_Fig2_HTML.jpg)\n\
  \n图 2-2\n\n转换为 Core ML\n\nCore ML 支持广泛的机器学习算法，例如集成学习、支持向量机、人工神经网络、线性模型等。但是，Core\
  \ ML 仅运行使用标记数据训练的模型，不支持无监督模型。\n\n## Core ML 组件\n\nCore ML 是苹果的机器学习框架，适用于 macOS、iOS、watchOS\
  \ 和 tvOS。它是苹果先前机器学习框架——Accelerate 和 Metal Performance Shaders——的基础，这两个框架通常用作性能基元。Accelerate\
  \ 使用 CPU 处理内存密集型任务，而 MPS 使用 GPU 处理计算密集型任务。Core ML 根据应用的需求决定使用哪个底层框架。图 2-3 展示了 Core\
  \ ML 框架的各种组件。除了 Accelerate 和 MPS 之外，Core ML 还支持以下特定领域的框架：\n\n![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig3_HTML.png](img/474993_1_En_2_Fig3_HTML.png)\n\
  \n图 2-3\n\nCore ML 组件\n\n*   *Vision*：Vision 是苹果用于处理所有与计算机视觉和图像相关事务的一站式框架。它包含计算机视觉算法，有助于执行图像和视频的检测与分类等任务。它可以用于物体跟踪或基于深度学习的人脸检测等。\n\
  \n*   *Natural Language*：这是苹果用于文本处理的一站式框架。它可以用于分析自然语言并从中推断出一些元数据。它有助于执行命名实体识别、文本预测、语言识别和情感分析等任务。\n\
  \n*   *GameplayKit*：这是一个有助于在你的应用中融入常见游戏行为的框架，例如伪随机数生成、物体运动和寻路。它是一个面向对象的框架，包含可帮助你构建游戏的可重用组件。\n\
  \n你可以将 Core ML 视为一组工具，它帮助你整合多个机器学习模型，并将它们封装在一个接口中，以便你可以在应用代码中轻松使用它们。\n\n\n\n## 训练与推理\n\
  \n在第 1 章中，你已经了解到机器学习是一个在给定数据集中发现模式以进行预测的过程。为此，我们需要以下实体：\n\n*   *输入数据点*：假设我们要将学生分类为“通过/未通过”。在这种情况下，输入数据点将由不同学生的分数组成。\n\
  \n*   *给定输入点的预期输出*：继续我们之前的分类示例，预期输出将包括“通过”或“未通过”。\n\n*   *学习算法*：这是一种学习如何将输入映射到输出，并创建可用于处理新输入（推理）的规则的算法。这些规则是通过称为训练的过程创建的。\n\
  \n让我们考虑一些例子来更清楚地理解这一点。\n\n*示例 1（图像识别）*：一个正在学习识别街道上婴儿车的模型，使用数百万张街道图像进行训练。这些图像被称为训练数据集。其中一些图像完全没有行人，而另一些则多达\
  \ 50 人。多个学习算法在这些数据（街道图像）上进行训练，每个算法都能访问正确答案。每个算法都会开发出不同的模型来识别街道上的婴儿车。这个过程被称为训练。之后，当一张新图像作为输入提供给算法时，它将应用适当的模型并确定图像中婴儿车的数量。这个过程被称为推理。\n\
  \n*示例 2（分拣）*：一个模型正在学习使用视觉识别来分拣物品。当物品在传送带上经过时，它会从一堆物品中挑出可回收物品。它将玻璃、塑料、纸张和金属等物品放入各自的回收箱中。这个过程被称为推理。每个物品都贴有一个识别号码。每天一次，人类专家检查回收箱，并告知机器人哪些物品被错误分拣。机器人利用这些反馈进行改进。这个过程被称为训练。\n\
  \n*示例 3（决策制定）*：一个模型正在学习评估与金融投资相关的风险。该模型被输入大量关于投资者过去进行的交易以及这些交易结果的数据。基于这些训练数据，模型计算风险回报比。这被称为训练。现在，当模型被输入关于某项投资的特定参数时，它可以预测与该投资相关的风险。这被称为推理。\n\
  \n## 机器学习模型\n\n在机器学习中，模型不过是一个接收输入并返回输出的函数。它通过训练和推理的过程生成，即将训练数据集应用于学习算法。学习算法在训练数据中寻找模式，这些模式将数据集中的输入数据点映射到它们对应的输出数据点。然后，算法返回一个捕获这些数据模式的机器学习模型。\n\
  \n你可能希望在应用程序中使用的大多数模型，其核心都具备一些关键功能。机器学习模型提供的一些常见功能（见图 2-4）包括情感分析、手写识别、语言翻译、图像分类、风格迁移、音乐标记和文本预测。\n\
  \n![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig4_HTML.jpg](img/474993_1_En_2_Fig4_HTML.jpg)\n\
  \n图 2-4\n\n机器学习模型的关键功能\n\nCore ML 支持多种模型，包括神经网络、树集成、支持向量机和线性模型。它要求机器学习模型采用 Core\
  \ ML 格式，即扩展名为 `.mlmodel` 的文件。Apple 提供了几个已内置于 Core ML 框架中的开源机器学习模型。但是，你也可以创建自己的自定义机器学习模型，将其转换为\
  \ Core ML 格式，并在你的应用程序中使用。\n\n在本章的后续部分，我们将学习如何创建一个简单的 iOS 应用程序，并在该应用程序中实现一个开源机器学习模型。\n\
  \n\n\n## 开始使用 Xcode\n\nXcode 与 Core ML 框架紧密集成，是苹果公司推出的一款功能极其强大的 IDE（集成开发环境），用于为\
  \ MacBook、iPhone、iPad、Apple Watch 和 Apple TV 构建应用程序。\n\n以下是本章作为通用开发实践所使用的配置：\n\n\
  *   *Xcode*：9.4.1 或更高版本\n*   *部署 SDK*：11.4 或更高版本\n*   *编程语言*：Swift 4 或更高版本\n*  \
  \ *模拟器*：iPhone 8 Plus 或更高版本\n\n假设你熟悉 Mac 环境，并且已在 MacBook 上安装了 Xcode，那么让我们开始构建第一个\
  \ iOS 应用程序。\n\n*步骤 1*：启动 Xcode。它应该会显示一个欢迎对话框（图 2-5）。在此处，选择“创建一个新的 Xcode 项目”来开始一个新项目。\n\
  \n![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig5_HTML.jpg](img/474993_1_En_2_Fig5_HTML.jpg)\n\
  \n图 2-5\n\nXcode 欢迎对话框\n\n*步骤 2*：Xcode 会显示各种设备和项目模板供你选择（图 2-6）。选择你的目标设备和合适的模板（单视图应用）。然后点击“下一步”。\n\
  \n![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig6_HTML.jpg](img/474993_1_En_2_Fig6_HTML.jpg)\n\
  \n图 2-6\n\nXcode 模板选择\n\n*步骤 3*：这将带你进入另一个屏幕，用于填写项目的所有必要选项（图 2-7）。这些选项包括：\n\n![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig7_HTML.jpg](img/474993_1_En_2_Fig7_HTML.jpg)\n\
  \n图 2-7\n\nXcode 项目选项\n\n*   *产品名称*：你的应用程序的名称。\n*   *组织名称*：你可以在此框中填写你的公司名称。\n* \
  \  *组织标识符*：这是以反向顺序书写的域名。如果你有域名，可以使用你自己的域名。\n*   *类前缀*：Xcode 使用类前缀自动命名类。你可以选择自己的前缀或将其留空。\n\
  *   *设备*：选择你希望应用程序在其上运行的设备。\n\n*步骤 4*：然后 Xcode 会询问你希望将项目保存在哪里（图 2-8）。在你的 Mac 上选择一个文件夹（例如，桌面），然后点击“创建”。\n\
  \n![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig8_HTML.jpg](img/474993_1_En_2_Fig8_HTML.jpg)\n\
  \n图 2-8\n\nXcode 文件夹选择器\n\n*步骤 5*：确认后，Xcode 会根据你提供的所有选项自动创建项目。下一个屏幕将类似于图 2-9。\n\n\
  ![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig9_HTML.jpg](img/474993_1_En_2_Fig9_HTML.jpg)\n\
  \n图 2-9\n\nXcode 主窗口\n\n在进入代码部分之前，让我们先熟悉一下 Xcode 工作区（图 2-10）。\n\n![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig10_HTML.jpg](img/474993_1_En_2_Fig10_HTML.jpg)\n\
  \n图 2-10\n\nXcode 工作区\n\n*   左侧窗格是项目导航器。你可以在此区域找到所有文件。\n*   工作区的中央部分是编辑器区域。\n* \
  \  最右侧的窗格是工具区。此区域显示文件的属性，并允许你访问快速帮助。\n*   顶部有一个工具栏，提供各种功能，用于运行应用程序、切换编辑器等。\n\n*步骤\
  \ 6*：在项目导航器区域，你会找到一个名为 `MainStoryboard.storyboard` 的文件。选择此文件，你会注意到编辑器区域变为一个界面构建器（图\
  \ 2-11），其中显示了一个空白的应用程序屏幕。\n\n![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig11_HTML.jpg](img/474993_1_En_2_Fig11_HTML.jpg)\n\
  \n图 2-11\n\nXcode 界面构建器\n\n*步骤 7*：在工具区的下部，你会找到对象库。在这里，你可以选择任意 UI 控件并将其拖放到视图中。让我们选择“标签”并将其拖入视图。你可以从工具区的对象属性中更改标签的文本。你还可以根据需要添加定位约束，以正确构建\
  \ UI 元素的结构。\n\n*步骤 8*：现在是时候测试你的应用程序了。你可以使用工具栏上的运行图标来运行它。Xcode 会自动构建应用程序并在模拟器中运行它。如果一切正常，你的应用程序应该在模拟器中正常运行。\n\
  \n就是这样！我们刚刚创建了第一个 iOS 应用程序。在下一节中，我们将学习如何在此应用程序中集成一个开源的 ML 模型。\n\n\n\n## 使用 Xcode\
  \ 创建照片应用\n\n现在，让我们创建一个应用，允许用户从照片库中选择一张图片，并在屏幕上显示所选图片。稍后我们将修改此应用，在其中加入一个机器学习模型。\n\
  \n*步骤 1*：启动 Xcode，打开我们之前创建的“Machine Learning Demo”应用。\n\n*步骤 2*：从导航区域打开名为“MainStoryboard.storyboard”的文件，以启动界面构建器。\n\
  \n*步骤 3*：删除我们之前创建的标签。然后，通过从工具区域的对象库中将控件拖拽到界面构建器，向界面中添加一个按钮，随后再添加一个图像视图。请参考图 2-12。您可以通过工具区域的对象属性来更改按钮的颜色和文本。\n\
  \n![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig12_HTML.jpg](img/474993_1_En_2_Fig12_HTML.jpg)\n\
  \n图 2-12\n\n照片应用界面\n\n*步骤 4*：界面创建完成后，我们将专注于应用的逻辑。点击工具栏右侧的图标打开辅助编辑器。在辅助编辑器中加载名为“ViewController.swift”的文件。您将同时看到窗口左侧的界面构建器和右侧的代码（“ViewController.swift”）。请参考图\
  \ 2-13。\n\n![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig13_HTML.jpg](img/474993_1_En_2_Fig13_HTML.jpg)\n\
  \n图 2-13\n\n辅助编辑器\n\n*步骤 5*：要将界面元素连接到代码，我们需要创建输出口和操作。输出口用于修改 UI 元素的属性，而操作则用于处理与\
  \ UI 元素相关的事件。我们将为按钮和图像视图创建输出口。为此，按住 Control 键并从按钮/图像视图拖拽到代码（“ViewController.swift”）中，然后创建一个\
  \ IBOutlet。在连接字段中，我们选择 Outlet；名称使用 btn 或 imageView；类型选择 UIButton 或 UIImageView。这将在您的\
  \ ViewController 类中生成以下 IBOutlet 代码：\n\n```\n@IBOutlet weak var btn: UIButton!\n\
  @IBOutlet weak var imageView: UIImageView!\n```\n\n*步骤 6*：当点击按钮时，应用应打开一个图像选择器，允许用户从照片库中选择一张图片并返回所选图片。现在，让我们创建一个操作来处理按钮的点击事件。为此，再次按住\
  \ Control 键并从按钮拖拽到代码。您应该会看到一个类似于图 2-14 的弹出窗口。在连接字段中，我们选择 Action；名称使用 pickImageBtnClick；触发操作的事件为“Touch\
  \ Up Inside”；传递给方法的参数为 Sender。\n\n![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig14_HTML.jpg](img/474993_1_En_2_Fig14_HTML.jpg)\n\
  \n图 2-14\n\nIBAction\n\n这将在您的 ViewController 类中生成以下 IBAction 代码：\n\n```\n@IBAction\
  \ func pickImageBtnClick(_ sender: Any) {\n//code\n}\n```\n\n*步骤 7*：现在，让我们添加处理按钮点击的代码。首先，由于我们需要用户与照片库交互，我们必须遵循\
  \ UIImagePickerControllerDelegate 协议以及 UINavigationControllerDelegate 协议。将这两个控制器添加到\
  \ ViewControllor.swift 文件中的类定义中：\n\n```\nclass ViewController: UIViewController,\
  \ UIImagePickerControllerDelegate, UINavigationControllerDelegate {\n//code\n}\n\
  ```\n\n*步骤 8*：当用户点击按钮时，我们需要创建一个 UIImagePickerController 实例，并将其委托设置为当前类。我们还需要将图像选择器的源指定为照片库。选择器创建后，我们需要使用\
  \ present 方法以模态方式呈现它。为此，将以下代码添加到 ViewControllor.swift 文件中的 pickImageBtnClick 方法中：\n\
  \n```\n@IBAction func pickImageBtnClick(_ sender: Any) {\nlet imagePicker = UIImagePickerController()\n\
  imagePicker.delegate = self\nimagePicker.allowsEditing = false\nimagePicker.sourceType\
  \ = .photoLibrary\npresent(imagePicker, animated: true, completion: nil)\n}\n```\n\
  \n*步骤 9*：由于我们遵循了 UIImagePickerControllerDelegate，我们需要实现两个委托方法：imagePickerController\
  \ 和 imagePickerControllerDidCancel。当用户完成从库中选择图像时，会调用 imagePickerController 方法。因此，我们将使用此方法在应用的图像视图中设置所选图像。当用户取消图像选择器时，会调用\
  \ imagePickerControllerDidCancel 方法。因此，在此方法中，我们只需关闭选择器。将以下代码添加到 ViewControllor.swift\
  \ 文件中的 ViewController 类中：\n\n```\nfunc imagePickerController(_ picker: UIImagePickerController,\
  \ didFinishPickingMediaWithInfo info: [String : Any]) {\nlet pickedImage = info[UIImagePickerControllerOriginalImage]\
  \ as! UIImage\nimageView.image = pickedImage\nself.dismiss(animated: true, completion:\
  \ nil)\n}\nfunc imagePickerControllerDidCancel(_ picker: UIImagePickerController)\
  \ {\nself.dismiss(animated: true, completion: nil)\n}\n```\n\n请注意，如果您使用的是 Swift\
  \ 4.2，上述代码可能无法正常工作，因为它是用 Swift 4.0 编写的。以下是您将使用的替代代码：\n\n```\nfunc imagePickerController(_\
  \ picker: UIImagePickerController, didFinishPickingMediaWithInfo info: [UIImagePickerController.InfoKey\
  \ : Any]) {\nlet pickedImage = info[UIImagePickerController.InfoKey.originalImage]\
  \ as! UIImage\nimageView.image = pickedImage\npicker.dismiss(animated: true)\n}\n\
  func imagePickerControllerDidCancel(_ picker: UIImagePickerController) {\nself.dismiss(animated:\
  \ true, completion: nil)\n}\n```\n\n如果一切正常，您最终的 Swift 代码（Swift 4.0）应如下所示：\n\n```\n\
  import UIKit\nclass ViewController: UIViewController, UIImagePickerControllerDelegate,\
  \ UINavigationControllerDelegate {\n@IBOutlet var btn: UIButton!\n@IBOutlet var\
  \ imageView: UIImageView!\noverride func viewDidLoad() {\nsuper.viewDidLoad()\n\
  btn.layer.cornerRadius = 8\n}\n@IBAction func pickImageBtnClick(_ sender: Any) {\n\
  let imagePicker = UIImagePickerController()\nimagePicker.delegate = self\nimagePicker.allowsEditing\
  \ = false\nimagePicker.sourceType = .photoLibrary\npresent(imagePicker, animated:\
  \ true, completion: nil)\n}\n//UIImagePickerControllerDelegate Methods\nfunc imagePickerController(_\
  \ picker: UIImagePickerController, didFinishPickingMediaWithInfo info: [String :\
  \ Any]) {\nlet pickedImage = info[UIImagePickerControllerOriginalImage] as! UIImage\n\
  imageView.image = pickedImage\nself.dismiss(animated: true, completion: nil)\n}\n\
  func imagePickerControllerDidCancel(_ picker: UIImagePickerController) {\nself.dismiss(animated:\
  \ true, completion: nil)\n}\n}\n```\n\n*步骤 10*：由于我们的应用需要访问用户设备的照片库，我们需要请求用户授予访问权限。否则，我们的应用可能会意外终止。为避免这种情况，我们需要在应用的“Info.plist”文件（图\
  \ 2-15）中添加以下属性：\n\n![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig15_HTML.jpg](img/474993_1_En_2_Fig15_HTML.jpg)\n\
  \n图 2-15\n\n信息属性列表\n\n*   *键*：隐私 – 照片库使用说明\n\n*   *值*：$(PRODUCT_NAME) 照片使用\n\n\n\
  \n就是这样！我们刚刚创建了一个 iPhone 应用，它允许用户从照片库中选取图片，并将选中的图片显示在屏幕上。现在该测试我们的应用了。你可以使用工具栏上的运行图标来运行应用。Xcode\
  \ 会自动构建应用并在模拟器中运行它（图 2-16）。如果一切正常，你的应用应该能在模拟器中顺利运行。\n\n![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig16_HTML.jpg](img/474993_1_En_2_Fig16_HTML.jpg)\n\
  \n图 2-16\n\n使用 Xcode 的照片应用\n\n## 在应用中使用 Core ML 模型\n\nCore ML 最精彩的部分在于，它让你能够将预训练模型集成到应用中。即使你对神经网络或机器学习没有深入了解，也能做到这一点。唯一的限制是，模型必须是\
  \ Core ML 格式才能集成到你的应用中。在本书的这一部分，我们将使用一个已经是 Core ML 格式且可在苹果官网获取的模型。\n\n我们在本章上一节构建的应用允许用户从设备的照片库中选择图片。现在，我们将在这个应用中集成一个\
  \ Core ML 模型，该模型会尝试预测所选图片中物体的标签。为此，我们首先需要下载模型。前往苹果的机器学习开发者网站（[`https://developer.apple.com/machine-learning/build-run-models/`](https://developer.apple.com/machine-learning/build-run-models/)），并滚动到页面底部。你会看到一个区域，列出了所有可免费下载的预训练\
  \ Core ML 模型（图 2-17）。\n\n![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig17_HTML.jpg](img/474993_1_En_2_Fig17_HTML.jpg)\n\
  \n图 2-17\n\n苹果 Core ML 模型\n\n我们将在应用中使用的模型是 Inceptionv3。这个模型最初是用 Keras 构建的，并通过 Python\
  \ 工具转换成了 Core ML 格式。它能够从超过 1000 个类别（例如树木、动物、食物、车辆、人物、花卉等）中检测图像中的主要物体。请随意使用列表中的其他模型代替\
  \ Inceptionv3，因为所有 Core ML 模型的处理过程几乎相同。下面我们来看看将这个模型集成到应用中的分步步骤。\n\n*步骤 1*：首先，我们需要在应用界面上添加一个标签，用于显示所选图片的预测结果。为此，进入界面构建器，减小\
  \ imageView 的高度，以便在底部为标签腾出空间。然后，从对象库中拖拽一个标签放到界面上。参考图 2-18。\n\n![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig18_HTML.jpg](img/474993_1_En_2_Fig18_HTML.jpg)\n\
  \n图 2-18\n\n更新后的照片应用界面\n\n*步骤 2*：为新创建的标签添加一个输出口，以便我们稍后可以更改其文本。\n\n```\n@IBOutlet\
  \ weak var classifier: UILabel!\n```\n\n*步骤 3*：现在我们已经为预测准备好了界面，接下来让模型开始工作。你将拥有之前从苹果网站下载的\
  \ Inceptionv3.mlmodel 文件。将该文件拖拽到 Xcode 项目导航器中的项目文件夹下。这会将 Core ML 模型添加到你的应用中。\n\n\
  *步骤 4*：从导航器中选择模型文件，你会注意到 Xcode 会自动识别该文件为 ML 模型。它会显示模型的相关信息，例如模型类型（在我们的例子中是神经网络分类器）、作者详情、模型描述等（图\
  \ 2-19）。\n\n![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig19_HTML.jpg](img/474993_1_En_2_Fig19_HTML.jpg)\n\
  \n图 2-19\n\nCore ML 模型（Inceptionv3）\n\n它还会显示模型类，该类由 ML 模型自动生成，可以直接在我们的应用中使用。点击类名旁边的箭头，你将能看到模型类的实现代码。\n\
  \nXcode 显示的其他重要信息是模型评估参数。这是关于模型接收的输入和返回的输出的信息。在我们的例子中，模型接收一张 299×299 大小的彩色图像作为输入，并返回一个字符串作为输出。\n\
  \n*步骤 5*：现在，让我们在应用中使用模型类来进行预测。打开 ViewController.swift 文件，并在文件最开头导入 Core ML 框架。\n\
  \n```\nimport CoreML\n```\n\n*步骤 6*：在 ViewController 类中声明一个模型变量，该变量将代表 Core ML 模型。\n\
  \n```\nvar model:Inceptionv3!\n```\n\n*步骤 7*：重写 ViewController 类的 viewWillAppear()\
  \ 方法，并在该方法中初始化模型。\n\n```\noverride func viewWillAppear(_ animated: Bool) {\nmodel\
  \ = Inceptionv3()\n}\n```\n\n*步骤 8*：我们的模型接收的输入是一张 299×299 大小的图像。因此，在用户完成图片选择后，我们需要调整图片大小。我们将在委托方法\
  \ imagePickerController() 中编写相关代码。以下代码将为我们完成这项工作：\n\n\n\n### 注意\n\n以下代码行中的编号仅为后续解释而添加。\n\
  \n```\n//resize image\n1\\. UIGraphicsBeginImageContextWithOptions (CGSize(width:\
  \ 299, height: 299), true, 2.0)\n2\\. pickedImage.draw(in: CGRect(x: 0, y: 0, width:\
  \ 299, height: 299))\n3\\. let newImage = UIGraphicsGetImageFromCurrentImageContext()!\n\
  4\\. UIGraphicsEndImageContext()\n5\\. let attrs = [kCVPixelBufferCGImageCompatibilityKey:\
  \ kCFBooleanTrue, kCVPixelBufferCGBitmapContextCompatibilityKey: kCFBooleanTrue]\
  \ as CFDictionary\n6\\. var pixelBuffer : CVPixelBuffer?\n7\\. let status = CVPixelBufferCreate(kCFAllocatorDefault,\
  \ Int(newImage.size.width), Int(newImage.size.height), kCVPixelFormatType_32ARGB,\
  \ attrs, &pixelBuffer)\n8\\. guard (status == kCVReturnSuccess) else {\n9\\. return\n\
  10\\. }\n11\\. CVPixelBufferLockBaseAddress(pixelBuffer!, CVPixelBufferLockFlags(rawValue:\
  \ 0))\n12\\. let pixelData = CVPixelBufferGetBaseAddress(pixelBuffer!)\n13\\. let\
  \ rgbColorSpace = CGColorSpaceCreateDeviceRGB()\n14\\. let context = CGContext(data:\
  \ pixelData, width: Int(newImage.size.width), height: Int(newImage.size.height),\
  \ bitsPerComponent: 8, bytesPerRow: CVPixelBufferGetBytesPerRow(pixelBuffer!), space:\
  \ rgbColorSpace, bitmapInfo: CGImageAlphaInfo.noneSkipFirst.rawValue)\n15\\. context?.translateBy(x:\
  \ 0, y: newImage.size.height)\n16\\. context?.scaleBy(x: 1.0, y: -1.0)\n17\\. UIGraphicsPushContext(context!)\n\
  18\\. newImage.draw(in: CGRect(x: 0, y: 0, width: newImage.size.width, height: newImage.size.height))\n\
  19\\. UIGraphicsPopContext()\n20\\. CVPixelBufferUnlockBaseAddress(pixelBuffer!,\
  \ CVPixelBufferLockFlags(rawValue: 0))\n```\n\n现在，让我们理解上述代码中发生了什么。由于我们的模型接受大小为 299×299\
  \ 的输入图像，第 1-4 行将所选图像转换为该尺寸，并将其赋值给一个名为 `newImage` 的新变量。\n\n重要的是要知道，模型接受以像素形式表示的输入图像。因此，第\
  \ 5-10 行将 `newImage` 以像素缓冲区的形式存储，该缓冲区本质上将图像以像素形式保存在内存中。此缓冲区将作为输入提供给预测过程。\n\n然后，图像中的所有像素都被转换为设备相关的\
  \ RGB 色彩空间。第 11-13 行完成了这一操作。在第 14 行，我们将像素数据存储在 `CGContext` 中，以便轻松修改图像像素的某些属性。接着，我们在第\
  \ 15-16 行根据需求缩放图像。第 17-20 行更新最终的图像缓冲区。\n\n请注意，如果你不理解这段代码的大部分内容，这没关系。你只需要知道，我们获取了用户从相册中选择的图片，并将其转换为模型可接受用于预测的形式。\n\
  \n*步骤 9*：最后，是时候调用模型的预测方法了，该方法将为我们进行图像预测。在委托方法 `imagePickerController()` 中，紧接在图像调整大小代码之后，添加以下代码。\n\
  \n```\n//predict image label\nguard let prediction = try? model.prediction(image:\
  \ pixelBuffer!) else {\nclassifier.text = \"Can't Predict!\"\nreturn\n}\nclassifier.text\
  \ = \"This is probably \\(prediction.classLabel).\"\n```\n\n预测方法以像素缓冲区作为参数传入。如果预测成功，该方法会返回一个对象，该对象提供输出标签。我们将此输出标签文本设置为我们之前添加到界面中的分类器标签。如果预测不成功，我们手动设置分类器标签文本，以告知用户模型无法预测所选图像的标签。\n\
  \n*步骤 10*：终于到了构建并运行应用程序的时候了。让我们看看我们的第一个 ML 应用程序表现如何。图 2-20 到图 2-24 展示了你在使用应用程序时应该会看到的不同屏幕。\n\
  \n![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig24_HTML.jpg](img/474993_1_En_2_Fig24_HTML.jpg)\n\
  \n图 2-24\n\n照片应用预测 (E)\n\n![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig23_HTML.jpg](img/474993_1_En_2_Fig23_HTML.jpg)\n\
  \n图 2-23\n\n照片应用预测 (D)\n\n![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig22_HTML.jpg](img/474993_1_En_2_Fig22_HTML.jpg)\n\
  \n图 2-22\n\n照片应用预测 (C)\n\n![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig21_HTML.jpg](img/474993_1_En_2_Fig21_HTML.jpg)\n\
  \n图 2-21\n\n照片应用预测 (B)\n\n![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig20_HTML.jpg](img/474993_1_En_2_Fig20_HTML.jpg)\n\
  \n图 2-20\n\n照片应用预测 (A)\n\n## 总结\n\n*   Core ML 是苹果公司的一个框架，可用于为 iPhone、iPad、MacBook、Apple\
  \ TV 和 Apple Watch 等苹果产品开发机器学习应用程序。\n\n*   Core ML 允许开发者使用已转换为 Core ML 格式的预训练 ML\
  \ 模型，在其应用程序中实现 ML 功能。\n\n*   Core ML 还允许开发者将自定义 ML 模型转换为 Core ML 格式，以便在其应用程序中使用。\n\
  \n*   Core ML 将模型集成到应用程序包中，使得 ML 算法可以在本地而非远程运行。这带来了更快的处理速度。\n\n*   Core ML 基于苹果之前的框架——Accelerate\
  \ 和 Metal Performance Shaders (MPS)——它们充当性能原语。\n\n*   Core ML 的主要组件包括：\n    *  \
  \ *Vision*：图像和视频分类\n    *   *Natural Language*：基于文本的预测和情感分析\n    *   *GameplayKit*：实现游戏玩法行为\n\
  \n*   一个 ML 模型可以通过输入数据点、每个输入数据点对应的输出，以及一个将输入数据点映射到相应输出的学习算法来训练。一旦训练完成，模型便可用于推理。\n\
  \n*   ML 模型通常提供的功能包括情感分析、手写识别、语言翻译、图像分类、文本预测等。\n\n"
- "# 3. 使用 Turi Create 创建自定义 Core ML 模型\n\n在第 2 章中，你学习了如何在应用程序中使用预训练的机器学习模型。在本章中，你将学习如何使用第三方框架\
  \ Turi Create 来训练你自己的模型。你还将找到一份逐步指南，了解如何将此训练好的模型转换为 Core ML 格式，并在你的应用程序中使用它。\n\n\
  ## 自定义模型的必要性\n\nML 模型可以被视为一段代码，我们用它来为应用程序添加智能用户体验。正如我们在第 2 章中学到的，ML 模型可用于执行各种任务；并且就像任何其他代码片段一样，没有一个单一的模型可以执行所有智能任务。例如，考虑你可能希望在应用程序中实现的以下任务：\n\
  \n*   能够拍摄食物照片并了解你正在摄入多少卡路里\n*   通过 iPhone 上的简单手势更改电视屏幕上的演示幻灯片\n*   实时跟踪物体\n*  \
  \ 在照片上尝试艺术滤镜\n*   根据音乐文件的流派对其进行分类\n\n这只是一个简短的列表；你可能希望应用程序执行的智能任务数不胜数。所有这些任务都展示了截然不同的用户体验；因此，没有一个单一的\
  \ ML 模型能够容纳所有这些任务。这就是自定义模型需求的来源。所有这些任务都有一些共同点——它们都使用 ML，并且它们都需要很少的数据即可在我们的应用程序中实现。因此，我们可以为每个想要执行的任务创建一个自定义\
  \ ML 模型。\n\n\n\n## 自定义模型创建的生命周期\n\n要创建自定义 Core ML 模型，首先需要确定要解决的问题，并收集有助于解决该问题的数据。例如，如果你要创建一个预测下个月电费的模型，你需要收集的数据就是历史电费账单以及相应时间段的用电量统计数据。\n\
  \n拥有数据集后，下一步是使用合适的算法训练模型。训练完成后，你可以通过评估模型来检查其准确性。最后，如果对评估结果满意，就可以构建模型。如果不满意，可以再次迭代训练过程。你可以重复此过程，直到对结果满意为止。图\
  \ 3-1 展示了自定义模型创建的生命周期。\n\n### 注意\n\nApple 引入了一种名为 ML Model (.mlmodel) 的标准化文件格式，允许开发者在应用中使用机器学习。所有机器学习模型最终都需要转换为\
  \ Core ML 格式 (.mlmodel)，才能在 Apple 产品中使用。\n\n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig1_HTML.jpg](img/474993_1_En_3_Fig1_HTML.jpg)\n\
  \n图 3-1\n\n自定义模型创建的生命周期\n\n以下是创建自定义 Core ML 模型所涉及的步骤：\n\n1.  *问题*：自定义模型创建的第一步是确定要解决的问题，并从机器学习的角度理解它。请考虑表\
  \ 3-1 中的任务及其对应的机器学习类别。\n\n    表 3-1\n\n    机器学习任务\n\n    | **你想要完成的任务** | **机器学习术语**\
  \ |\n    | --- | --- |\n    | 标记图像 | 图像分类 |\n    | 识别图像中的物体 | 物体检测 |\n    | 查找相似图像\
  \ | 图像相似度 |\n    | 创建自定义风格头像 | 风格迁移 |\n    | 个性化用户选择 | 推荐系统 |\n    | 使用传感器检测活动 |\
  \ 活动分类 |\n    | 分析消息中的情感 | 文本分类器 |\n    | 预测标签 | 分类器 |\n    | 预测数值 | 回归 |\n    |\
  \ 将相似数据分组 | 聚类 |\n\n2.  *数据*：确定问题后，下一步是确定完成此任务所需的数据类型和数据量。对于监督学习，数据将由输入和相应输出的配对组成。数据可以是任何形式，例如图片、文本文件、CSV\
  \ 文件或表格。最后，我们收集用于训练模型的相关数据。\n\n3.  *训练*：收集到所需数据后，我们就可以开始在数据上训练模型。\n\n4.  *评估*：模型准备好后，我们可以通过评估模型在测试数据集上的成功率来确定其质量。如果结果不达标，模型尚未准备好投入生产，我们可以重复训练过程，直到模型变得更准确。\n\
  \n5.  *模型*：如果训练过程的结果令人满意，我们可以生成可在应用中使用的 .mlmodel 文件。\n\n从头开始训练和评估模型可能是一项复杂的任务。为了简化这种复杂性，Apple\
  \ 引入了 Turi Create。结合 Python 使用 Turi Create，我们可以用很少的代码行，基于现有的机器学习模型来训练自定义模型，但更多细节将在后面介绍。\n\
  \n## 组装数据\n\n在了解组装数据之前，让我们先了解可以使用机器学习完成的基本任务类型。如果你有大量图像，你可能希望根据其内容对这些图像进行分类；如果你的应用向用户展示广告，你可能希望根据用户偏好定制这些广告；或者你可能希望提示用户通讯录中的重复联系人。\n\
  \n所有这些任务都需要不同类型的数据。为了便于理解，让我们考虑以下我们将尝试解决的问题陈述：\n\n### 问题\n\n给定一张狗的照片，应用程序应该能够预测狗的品种。\n\
  \n要创建一个能够完成此任务的模型，我们需要大量不同品种的狗的图像。然后，我们将从这些图像中创建一个数据集。别担心，这听起来并没有那么复杂。首先，在你的 MacBook\
  \ 上创建一个名为 Dataset 的文件夹。在 Dataset 文件夹内，为你想要分类的每个狗品种创建子文件夹。然后，在每个子文件夹中放置一些该品种狗的图像。请注意，子文件夹的名称应为狗品种的名称。请参考图\
  \ 3-2。\n\n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig2_HTML.jpg](img/474993_1_En_3_Fig2_HTML.jpg)\n\
  \n图 3-2\n\n自定义机器学习模型的数据集\n\n就这样。我们现在拥有了训练模型以执行分类任务所需的数据集。在本章的以下部分，我们将学习如何使用数据集训练机器学习模型。\n\
  \n## Turi Create 简介\n\nTuri Create 是一个基于 Python 的框架，可帮助你直接从数据集创建 Core ML 模型。它是一个开源框架，可在\
  \ [`https://github.com/apple/turicreate`](https://github.com/apple/turicreate) 获取。它也是跨平台的，这意味着你可以在\
  \ MacOS 和 Linux 上使用它。\n\n使用 Turi Create 的主要好处是，它允许我们在操作系统中已有的机器学习模型之上训练我们的模型，而不是从头开始训练。这通常被称为迁移学习。这一点很重要，因为从头开始训练模型需要数百万张图像、巨大的计算能力和大量的耐心。相反，使用\
  \ Turi Create，我们可以利用现有的机器学习模型（如 ResNet（残差网络）），并针对我们的特定数据训练该模型的最后几层。这样，我们就可以利用手头的数据量，及时创建一个足够好的机器学习模型。使用迁移学习还可以减小模型大小。\n\
  \n\n\n### 注意\n\n我们后续的所有开发工作将使用 Mac OS Mojave 10.14 和 Xcode 10。\n\n接下来，我们来学习如何在 Mac\
  \ 上安装 Turi Create。\n\n*步骤 1*：要安装 Turi Create，我们需要在 Mac 上安装 Python。默认情况下，Mac 系统已安装\
  \ Python 2.7，这足以满足 Turi Create 的安装需求。如果你愿意，也可以从 [`https://www.python.org`](https://www.python.org)\
  \ 手动下载 Python 并安装到 Mac 上。但请注意，Turi Create 不支持最新版本的 Python（即 3.7 版）；因此，我们将使用系统默认安装的\
  \ Python 版本。要检查系统上的 Python 版本，可以打开终端窗口并运行“python”命令。参见图 3-3。\n\n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig3_HTML.jpg](img/474993_1_En_3_Fig3_HTML.jpg)\n\
  \n图 3-3\n\n在 Mac 上检查 Python 版本\n\n*步骤 2*：现在，为了使用 Python 安装包，你需要在系统上安装 Python 包管理器（通常称为\
  \ pip）。为此，请打开终端窗口并运行“sudo easy_install pip”命令。参见图 3-4。然后耐心等待包管理器安装到你的系统上。\n\n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig4_HTML.jpg](img/474993_1_En_3_Fig4_HTML.jpg)\n\
  \n图 3-4\n\n在 Mac 上安装 pip\n\n*步骤 3*：再次打开终端窗口，运行“pip”命令，检查 Python 包管理器是否已成功安装到系统上。如果已安装，你将看到包管理器提供的命令列表（图\
  \ 3-5）。如果没有，请在继续下一步之前尝试在 Mac 上重新安装 pip。\n\n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig5_HTML.jpg](img/474993_1_En_3_Fig5_HTML.jpg)\n\
  \n图 3-5\n\nPython 命令\n\n*步骤 4*：现在 pip 已成功安装在你的 Mac 上，你可以使用它来安装 Turi Create。打开终端窗口并运行以下命令，在你的机器上安装最新版本的\
  \ Turi Create（输出结果见图 3-6）：\n\n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig6_HTML.jpg](img/474993_1_En_3_Fig6_HTML.jpg)\n\
  \n图 3-6\n\n安装 Turi Create\n\n```\npip install turicreate\n```\n\n现在，你已成功在机器上安装了\
  \ Turi Create。在下一节中，我们将学习如何使用它来创建自定义 ML 模型。\n\n## 训练和评估自定义模型\n\n以下是使用 Turi Create\
  \ 创建自定义 ML 模型的步骤：\n\n*步骤 1*：打开 Xcode；在菜单中选择 **文件 ➤ 新建 ➤ 文件**（图 3-7）。\n\n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig7_HTML.jpg](img/474993_1_En_3_Fig7_HTML.jpg)\n\
  \n图 3-7\n\n在 Xcode 中新建文件\n\n*步骤 2*：从模板选择菜单中选择空白文件（图 3-8）。\n\n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig8_HTML.jpg](img/474993_1_En_3_Fig8_HTML.jpg)\n\
  \n图 3-8\n\nXcode 模板选择\n\n*步骤 3*：将文件命名为 **MyCustomModel.py**\n\n*步骤 4*：将其保存到桌面。\n\
  \n*步骤 5*：通过添加以下代码行导入 Turi Create：\n\n```\nimport turicreate as tc\n```\n\n*步骤 6*：通过添加以下代码定义训练数据集的路径：\n\
  \n```\nurl = \"dataset/\"\n```\n\n*步骤 7*：添加以下代码以搜索并从数据集文件夹加载图像：\n\n```\ndata = tc.load_images(url)\n\
  ```\n\n*步骤 8*：现在我们将定义图像类别并将其保存在 **“dogBreed”** 属性中。我们将从图像的路径中获取文件夹名称来确定图像类别。为此，请添加以下代码：\n\
  \n```\ndata[\"dogBreed\"] = data[\"path\"].apply(lambda path: path.split('/')[1])\n\
  ```\n\n这将创建一个带标签的数据集，其中训练数据集中的每个图像都将有一个路径和一个名为 **“dogBreed”** 的属性。\n\n*步骤 9*：现在，我们将新的带标签数据集保存为\
  \ SFrame。此 SFrame 将用于训练数据。添加以下代码将数据集保存为 SFrame：\n\n```\ndata.save(\"dogBreed.sframe\"\
  )\n```\n\n*步骤 10*：让我们在 Turi Create 上预览新的带标签数据。为此，请添加以下代码：\n\n```\ndata.explore()\n\
  ```\n\n*步骤 11*：为了加载用于训练的 SFrame，编写以下代码：\n\n```\ndataBuffer = tc.SFrame(\"dogBreed.sframe\"\
  )\n```\n\n*步骤 12*：现在，我们将使用 90% 的数据训练模型，并使用剩余的 10% 的数据测试模型。为此，请编写以下代码：\n\n```\ntrainingBuffers,\
  \ testingBuffers = dataBuffer.random_split(0.9)\nmodel = tc.image_classifier.create(trainingBuffers,\
  \ target=\"dogBreed\", model=\"squeezenet_v1.1\")\n```\n\n这里，我们是在已有的 **“Squeezenet”**\
  \ 模型基础上训练我们的模型。你可以使用其他模型，如 **“ResNet-50”**，以获得更高的准确率。\n\n*步骤 13*：现在是时候评估测试数据以确定模型的准确率了。为此，请添加以下代码：\n\
  \n```\nevaluations = model.evaluate(testingBuffers)\nprint evaluations[\"accuracy\"\
  ]\n```\n\n*步骤 14*：最后，添加以下代码以保存模型并将其导出为 Core ML 格式：\n\n```\nmodel.save(\"dogBreed.model\"\
  )\nmodel.export_CoreML(\"dogBreed.mlmodel\")\n```\n\n你的 MyCustomModel.py 最终代码应如图\
  \ 3-9 所示。\n\n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig9_HTML.jpg](img/474993_1_En_3_Fig9_HTML.jpg)\n\
  \n图 3-9\n\nMyCustomModel Python 代码\n\n要执行此代码，请打开 Mac 上的“终端”应用，并将当前目录更改为你的 Python\
  \ 文件所在位置。然后使用以下命令执行代码：\n\n```\npython MyCustomModel.py\n```\n\nPython 代码执行可能需要几分钟时间。首先，代码会将图像从数据集加载到内存中，然后根据图像所在的文件夹进行标记，接着将它们转换为用于训练的\
  \ SFrame。请注意，你无需显式执行任何操作；一旦你在终端窗口中执行了 Python 代码，该过程将自动开始。你只需耐心等待代码为你生成一个 Core ML\
  \ 模型即可。图 3-10 中的终端屏幕显示了该过程。\n\n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig10_HTML.jpg](img/474993_1_En_3_Fig10_HTML.jpg)\n\
  \n图 3-10\n\n加载图像并创建 SFrame\n\n\n\n现在，我们在第 10 步中用于预览已标注图像的 `explore()` 方法，将打开 Turi\
  \ Create 可视化窗口（见图 3-11），该窗口会预览这些图像。\n\n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig11_HTML.jpg](img/474993_1_En_3_Fig11_HTML.jpg)\n\
  \n图 3-11\n\nTuri Create 可视化\n\n你可以在这里看到已标注的训练数据。与此同时，代码将继续在终端窗口中执行。代码现在将加载我们之前创建的\
  \ SFrame，下载基础 ML 模型（本例中为 Squeezenet），并开始在基础模型之上训练 SFrame。图 3-12 中的终端屏幕显示了这一过程。\n\
  \n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig12_HTML.jpg](img/474993_1_En_3_Fig12_HTML.jpg)\n\
  \n图 3-12\n\n训练数据集\n\n训练过程结束后，代码将评估模型，以判断其是否足够准确。此评估将在我们从数据集中随机选取的测试数据上进行。这种随机选取是通过我们编写的一行代码实现的，该代码将数据集按\
  \ (0.9, 0.1) 的比例拆分，即使用 90% 的数据集进行训练，10% 的数据集进行测试。评估过程会进行多次迭代，代码还会打印每次迭代的准确率。图 3-13\
  \ 中的终端屏幕显示了这一过程。\n\n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig13_HTML.jpg](img/474993_1_En_3_Fig13_HTML.jpg)\n\
  \n图 3-13\n\n评估模型\n\n评估完成后，代码将保存模型并将其转换为 Core ML 格式。你会在你的 Mac 上看到生成的一些新项目（图 3-14）。\n\
  \n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig14_HTML.jpg](img/474993_1_En_3_Fig14_HTML.jpg)\n\
  \n图 3-14\n\n自定义模型文件\n\n就是这样。你刚刚使用 Turi Create 创建了一个 Core ML 模型。现在，这个模型可以在你的 iOS\
  \ 应用程序中使用，根据给定的图片来对狗的品种进行分类。\n\n## 将自定义模型转换为 Core ML\n\n如果你使用 Turi Create 从头生成模型，则无需担心转换问题，因为它已经以\
  \ Core ML 格式创建了模型；但如果你使用其他工具，如 Caffe、TensorFlow 或 Keras，你可能想知道如何将使用这些工具构建的模型转换为\
  \ Core ML 格式。为此，Apple 在推出 Core ML 的同时也推出了 Core ML Tools。它是一个开源的 Python 包，可以接收多种格式的\
  \ ML 模型，并将其转换为 Core ML 格式。\n\n让我们学习如何使用 Core ML Tools 将模型转换为 Core ML 格式。为此，你需要在机器上安装\
  \ Python。如果没有安装，请从 [`https://www.python.org`](https://www.python.org) 安装最新版本的 Python。我们将以一个\
  \ Caffe 模型为例，将其转换为 Core ML 格式。为此，请考虑以下步骤：\n\n*第 1 步*：在你的 Mac 上打开“终端”应用程序，并使用 Python\
  \ 包管理器安装 Core ML Tools。为此，请输入以下命令：\n\n```\npip install CoreMLtools\n```\n\n*第 2\
  \ 步*：打开 Xcode；在菜单中选择 **File ➤ New ➤ File**（图 3-15）。\n\n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig15_HTML.jpg](img/474993_1_En_3_Fig15_HTML.jpg)\n\
  \n图 3-15\n\n在 Xcode 中新建文件\n\n*第 3 步*：从模板选择菜单中选择“空白文件”（图 3-16）。\n\n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig16_HTML.jpg](img/474993_1_En_3_Fig16_HTML.jpg)\n\
  \n图 3-16\n\nXcode 模板选择\n\n*第 4 步*：将文件命名为 **MyConverter.py**\n\n*第 5 步*：将其保存到桌面。\n\
  \n*第 6 步*：下载你想要转换为 Core ML 格式的 Caffe 模型。请注意，当你下载 Caffe 模型时，你会得到三个不同的文件：\n\n*   **modelName.caffemodel**\
  \ – 模型文件\n\n*   **deploy.prototxt** – 包含网络结构的文件\n\n*   **labels.txt** – 包含预测输出值的文件\n\
  \n*第 7 步*：打开 MyConverter.py 文件，并添加以下代码以导入 Core MLtools：\n\n```\nimport CoreMLtools\n\
  ```\n\n*第 8 步*：我们的 Caffe 模型由两个文件定义：“.caffemodel”和“.prototxt”。因此，让我们通过添加以下代码行将其添加到代码中：\n\
  \n```\ncaffe_model = ('oxford102.caffemodel', 'deploy.prototxt')\n```\n\n*第 9 步*：接下来，我们将通过添加以下代码来定义我们的类别标签文件：\n\
  \n```\nlabels = 'class_labels.txt'\n```\n\n*第 10 步*：现在，要将 Caffe 模型转换为 Core ML 格式，请添加以下代码行：\n\
  \n```\nCoreML_model = Core MLtools.converters.caffe.convert\n(caffe_model, class_labels\
  \ = labels)\n```\n\n*第 11 步*：最后，我们可以通过将以下代码添加到我们的文件中来保存转换后的模型：\n\n```\nCoreML_model.save('MyCustomModel.mlmodel')\n\
  ```\n\n你的最终代码应如图 3-17 所示。\n\n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig17_HTML.jpg](img/474993_1_En_3_Fig17_HTML.jpg)\n\
  \n图 3-17\n\n从 Caffe 转换为 Core ML（代码）\n\n*第 12 步*：要执行代码，请在你的 Mac 上打开“终端”应用程序，将当前目录更改为你的\
  \ Python 文件所在位置，然后输入以下命令（输出结果见图 3-18）。\n\n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig18_HTML.jpg](img/474993_1_En_3_Fig18_HTML.jpg)\n\
  \n图 3-18\n\n从 Caffe 转换为 Core ML（执行）\n\n```\npython MyConverter.py\n```\n\n当代码执行完成后，你将看到\
  \ Core ML 格式的输出模型文件（图 3-19）。\n\n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig19_HTML.jpg](img/474993_1_En_3_Fig19_HTML.jpg)\n\
  \n图 3-19\n\n从 Caffe 转换为 Core ML（输出）\n\n这就是使用 Core ML Tools 将 Caffe 模型转换为 Core ML\
  \ 格式的过程。\n\n\n\n## 在应用中使用自定义模型\n\n一旦模型被创建或转换为 Core ML 格式，你就可以像使用苹果提供的 Core ML 模型一样，在应用中使用它。现在，让我们在应用中使用之前通过\
  \ Turi Create 创建的模型，该模型可以根据狗的图像预测其品种。为此，我们将使用 Xcode 10 创建一个应用，允许用户从设备的照片库中选取一张狗的图像。然后，应用将显示该图像以及图像中狗的品种。请按照以下步骤操作：\n\
  \n*步骤 1*：启动 Xcode 10。它应该会显示一个欢迎对话框。在此处，选择“Create a new Xcode project”以开始一个新项目（图\
  \ 3-20）。\n\n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig20_HTML.jpg](img/474993_1_En_3_Fig20_HTML.jpg)\n\
  \n图 3-20\n\n欢迎使用 Xcode\n\n*步骤 2*：Xcode 会显示各种设备和项目模板供你选择（图 3-21）。选择你的目标设备和合适的模板（Single\
  \ View Application）。然后点击“Next”。\n\n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig21_HTML.jpg](img/474993_1_En_3_Fig21_HTML.jpg)\n\
  \n图 3-21\n\nXcode 模板选择\n\n*步骤 3*：这将进入另一个屏幕，用于填写项目的所有必要选项（图 3-22）。这些选项包括 Product\
  \ Name、Organization Name、Organization Identifier、Class Prefix、Devices 等。填写详细信息并进入下一步。\n\
  \n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig22_HTML.jpg](img/474993_1_En_3_Fig22_HTML.jpg)\n\
  \n图 3-22\n\nXcode 项目选项\n\n*步骤 4*：然后 Xcode 会询问你希望将项目保存在哪里（图 3-23）。在你的 Mac 上选择一个文件夹（例如桌面），然后点击“Create”。\n\
  \n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig23_HTML.jpg](img/474993_1_En_3_Fig23_HTML.jpg)\n\
  \n图 3-23\n\nXcode 文件夹选择器\n\n*步骤 5*：确认后，Xcode 会根据你提供的所有选项自动创建项目。从导航窗格中选择 **“Main.storyboard”**\
  \ 文件，打开应用的界面构建器。请参考图 3-24。\n\n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig24_HTML.jpg](img/474993_1_En_3_Fig24_HTML.jpg)\n\
  \n图 3-24\n\nXcode 界面构建器\n\n*步骤 6*：通过从工具区域的控件库中将控件拖拽到界面构建器，依次添加一个 Button 和一个 Image\
  \ View。你可以从工具区域的对象属性中更改按钮的颜色和文本。另外，在应用界面中添加一个标签，用于显示所选图像的预测结果。请参考图 3-25。\n\n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig25_HTML.jpg](img/474993_1_En_3_Fig25_HTML.jpg)\n\
  \n图 3-25\n\n狗品种预测器应用界面\n\n*步骤 7*：点击工具栏右侧的图标打开助理编辑器。在助理编辑器中加载名为 **“ViewController.swift”**\
  \ 的文件。你将同时看到窗口左侧的界面构建器和右侧的代码（**‘ViewController.swift’**）。请参考图 3-26。\n\n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig26_HTML.jpg](img/474993_1_En_3_Fig26_HTML.jpg)\n\
  \n图 3-26\n\n助理编辑器\n\n*步骤 8*：要将界面元素连接到代码，我们需要创建 Outlet 和 Action。为 Button、ImageView\
  \ 和 Label 创建 Outlet。同时为按钮创建一个 Action。为此，按住 Control 键并从 Button/Image View/Label 拖拽到代码（“ViewController.swift”）中。如果成功为\
  \ UI 元素创建了 Outlet 和 Action，以下代码将被添加到你的 ViewController 类中：\n\n```\n@IBOutlet weak\
  \ var predictionText: UILabel!\n@IBOutlet weak var imageView: UIImageView!\n@IBOutlet\
  \ weak var btn: UIButton!\n@IBAction func btnClick(_ sender: Any) {\n}\n```\n\n\
  *步骤 9*：现在让我们添加处理按钮点击的代码。首先，由于我们需要用户与照片库交互，我们必须遵循 UIImagePickerControllerDelegate\
  \ 协议以及 UINavigationControllerDelegate 协议。将这两个控制器添加到 ViewControllor.swift 文件的类定义中：\n\
  \n```\nclass ViewController: UIViewController, UIImagePickerControllerDelegate,\
  \ UINavigationControllerDelegate {\n//code\n}\n```\n\n*步骤 10*：当用户点击按钮时，我们需要创建一个\
  \ UIImagePickerController 实例，并将其委托设置为当前类。我们还需要将图像选择器的源指定为照片库。创建选择器后，我们需要使用 present\
  \ 方法以模态方式呈现它。为此，将以下代码添加到 ViewControllor.swift 文件的 pickImageBtnClick 方法中：\n\n```\n\
  @IBAction func btnClick(_ sender: Any) {\nlet imagePicker = UIImagePickerController()\n\
  imagePicker.delegate = self\nimagePicker.allowsEditing = false\nimagePicker.sourceType\
  \ = .photoLibrary\npresent(imagePicker, animated: true, completion: nil)\n}\n```\n\
  \n*步骤 11*：由于我们遵循了图像选择器的委托，我们需要实现两个委托方法：imagePickerController 和 imagePickerControllerDidCancel。当用户完成从库中选择图像时，会调用\
  \ imagePickerController 方法。因此，我们将使用此方法在应用的 Image View 中设置所选图像。当用户取消图像选择器时，会调用 imagePickerControllerDidCancel\
  \ 方法。因此，在此方法中，我们只需关闭选择器。将以下代码添加到 ViewControllor.swift 文件的 ViewController 类中：\n\n\
  ```\nfunc imagePickerController(_ picker: UIImagePickerController, didFinishPickingMediaWithInfo\
  \ info: [UIImagePickerController.InfoKey : Any]) {\nlet pickedImage = info[.originalImage]\
  \  as! UIImage\nimageView.image = pickedImage\nself.dismiss(animated: true, completion:\
  \ nil)\n}\nfunc imagePickerControllerDidCancel(_ picker: UIImagePickerController)\
  \ {\nself.dismiss(animated: true, completion: nil)\n}\n```\n\n*步骤 12*：由于我们的应用需要访问用户设备的照片库，我们需要请求用户授予访问权限。否则，我们的应用可能会意外终止。为避免这种情况，我们需要在应用的\
  \ **“Info.plist”** 文件中添加以下属性（图 3-27）：\n\n*Key*: Privacy – Photo Library Usage Description\n\
  \n*Value*: (PRODUCT_NAME) photo use\n\n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig27_HTML.jpg](img/474993_1_En_3_Fig27_HTML.jpg)\n\
  \n图 3-27\n\n信息属性列表\n\n*步骤 13*：现在我们已经创建了应用界面，让我们将自定义模型添加到项目中。为此，将模型文件拖拽到 Xcode 项目导航器中的项目文件夹下。这会将\
  \ Core ML 模型添加到你的应用中。\n\n*步骤 14*：从导航器中选择模型文件，你会注意到 Xcode 会自动将该文件识别为 ML 模型。它会显示模型的相关信息，例如模型类型（在我们的例子中是\
  \ Neural Network Classifier）、模型大小、模型描述等。请参考图 3-28。\n\n\n\n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig28_HTML.jpg](img/474993_1_En_3_Fig28_HTML.jpg)\n\
  \n图 3-28\n\n自定义 Core ML 模型（Dog_Breed_Predictor）\n\n它还显示了**模型类**，该类由 ML 模型自动生成，可直接在我们的应用程序中使用。点击类名旁边的箭头，您将能够看到模型类的实现代码。\n\
  \nXcode 显示的其他重要信息是**模型评估参数**。这是关于模型接收的输入和返回的输出的信息。在我们的案例中，模型接收一张大小为 227×227 的彩色图像作为输入，并返回一个字符串作为输出。\n\
  \n*步骤 15*：现在，让我们在应用程序中使用模型类来进行预测。转到 `ViewController.swift` 文件，并在最开头导入 Core ML 框架。\n\
  \n```\nimport CoreML\n```\n\n*步骤 16*：在 `ViewController` 类中声明一个模型变量，该变量将代表 Core ML\
  \ 模型。\n\n```\nvar model:dogBreed!\n```\n\n*步骤 17*：重写 `ViewController` 类的 `viewWillAppear()`\
  \ 方法，并在该方法中初始化模型。\n\n```\noverride func viewWillAppear(_ animated: Bool) {\nmodel\
  \ = dogBreed()\n}\n```\n\n*步骤 18*：我们的模型接受的输入是一张大小为 227×227 的图像。因此，在用户完成图像选择后，我们需要调整图像大小。我们将在委托方法\
  \ `imagePickerController()` 中编写相关代码。以下代码将完成此任务：\n\n### 注意\n\n以下代码行中的编号仅用于后续解释，编号本身并非代码的一部分。\n\
  \n```\n//调整图像大小\n1\\.  UIGraphicsBeginImageContextWithOptions (CGSize(width: 277,\
  \ height: 277), true, 2.0)\n2\\.  pickedImage.draw(in: CGRect(x: 0, y: 0, width:\
  \ 277, height: 277))\n3\\.  let newImage = UIGraphicsGetImageFromCurrentImageContext()!\n\
  4\\.  UIGraphicsEndImageContext()\n5\\.  let attrs = [kCVPixelBufferCGImageCompatibilityKey:\
  \ kCFBooleanTrue, kCVPixelBufferCGBitmapContextCompatibilityKey: kCFBooleanTrue]\
  \ as CFDictionary\n6\\.  var pixelBuffer : CVPixelBuffer?\n7\\.  let status = CVPixelBufferCreate(kCFAllocatorDefault,\
  \ Int(newImage.size.width), Int(newImage.size.height), kCVPixelFormatType_32ARGB,\
  \ attrs, &pixelBuffer)\n8\\.  guard (status == kCVReturnSuccess) else {\n9\\.  \
  \   return\n10\\.  }\n11\\.  CVPixelBufferLockBaseAddress(pixelBuffer!, CVPixelBufferLockFlags(rawValue:\
  \ 0))\n12\\.  let pixelData = CVPixelBufferGetBaseAddress(pixelBuffer!)\n13\\. \
  \ let rgbColorSpace = CGColorSpaceCreateDeviceRGB()\n14\\.  let context = CGContext(data:\
  \ pixelData, width: Int(newImage.size.width), height: Int(newImage.size.height),\
  \ bitsPerComponent: 8, bytesPerRow: CVPixelBufferGetBytesPerRow(pixelBuffer!), space:\
  \ rgbColorSpace, bitmapInfo: CGImageAlphaInfo.noneSkipFirst.rawValue)\n15\\.  context?.translateBy(x:\
  \ 0, y: newImage.size.height)\n16\\.  context?.scaleBy(x: 1.0, y: -1.0)\n17\\. \
  \ UIGraphicsPushContext(context!)\n18\\.  newImage.draw(in: CGRect(x: 0, y: 0, width:\
  \ newImage.size.width, height: newImage.size.height))\n19\\.  UIGraphicsPopContext()\n\
  20\\.  CVPixelBufferUnlockBaseAddress(pixelBuffer!, CVPixelBufferLockFlags(rawValue:\
  \ 0))\n```\n\n现在，让我们理解上述代码的作用。由于我们的模型接受大小为 227×227 的输入图像，第 1-4 行将所选图像转换为该大小，并将其赋值给一个名为\
  \ `newImage` 的新变量。\n\n重要的是要知道模型接受像素形式的输入图像。因此，第 5-10 行将 `newImage` 以像素缓冲区的形式存储，该缓冲区基本上将图像以像素形式保存在内存中。此缓冲区将作为输入提供给预测过程。\n\
  \n然后，图像中的所有像素都被转换为设备相关的 RGB 颜色空间。第 11-13 行完成此操作。在第 14 行，我们将像素数据存储在 `CGContext` 中，以便我们可以轻松修改图像像素的某些属性。然后，我们在第\
  \ 15-16 行根据需求缩放图像。第 17-20 行更新最终的图像缓冲区。\n\n请注意，如果您不理解此代码的大部分内容，也没有关系。您只需要知道，我们获取了用户从照片库中选择的图片，并将其转换为模型可接受用于预测的形式。\n\
  \n*步骤 19*：最后，是时候调用模型的预测方法了，该方法将为我们进行图像预测。在委托方法 `imagePickerController()` 中，紧接在图像调整大小代码之后，添加以下代码。\n\
  \n```\n//预测图像标签\nguard let prediction = try? model.prediction(image: pixelBuffer!)\
  \ else {\npredictionText.text = \"无法预测！\"\nreturn\n}\npredictionText.text = \"犬种：\\\
  (prediction.dogBreed)。\"\n```\n\n预测方法将像素缓冲区作为参数传入。如果预测成功，该方法返回一个对象，该对象为我们提供输出标签。我们将此输出标签文本设置为我们之前添加到界面的分类器标签。如果预测不成功，我们手动设置分类器标签文本，以告知用户模型无法预测所选图像的标签。\n\
  \n*步骤 20*：终于到了构建并运行应用程序的时候了。让我们看看我们的第一个 ML 应用程序表现如何。图 3-29 到图 3-33 展示了您在操作应用程序时应该会看到的不同屏幕。\n\
  \n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig33_HTML.jpg](img/474993_1_En_3_Fig33_HTML.jpg)\n\
  \n图 3-33\n\n犬种预测（E）\n\n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig32_HTML.jpg](img/474993_1_En_3_Fig32_HTML.jpg)\n\
  \n图 3-32\n\n犬种预测（D）\n\n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig31_HTML.jpg](img/474993_1_En_3_Fig31_HTML.jpg)\n\
  \n图 3-31\n\n犬种预测（C）\n\n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig30_HTML.jpg](img/474993_1_En_3_Fig30_HTML.jpg)\n\
  \n图 3-30\n\n犬种预测（B）\n\n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig29_HTML.jpg](img/474993_1_En_3_Fig29_HTML.jpg)\n\
  \n图 3-29\n\n犬种预测（A）\n\n## 总结\n\n*   没有一个单一的模型可以用来执行所有智能任务。因此，我们需要针对不同任务使用不同的自定义模型。\n\
  \n*   自定义机器学习模型可以通过五个简单步骤创建：\n    *   定义问题\n\n    *   收集数据\n\n    *   训练学习算法\n\n\
  \    *   评估学习算法\n\n    *   构建模型\n\n*   Apple 引入了一个名为 Turi Create 的基于 Python 的包，它可以帮助我们直接从数据集创建自定义\
  \ ML 模型。\n\n*   Turi Create 使用一种称为迁移学习的技术，也就是说，我们可以在现有模型的基础上训练我们的模型。现有模型的学习成果被迁移到我们的模型；因此，我们只需要训练模型的最后几层。这显著减少了训练时间以及模型的大小。\n\
  \n*   Apple 还引入了 Core ML Tools，这是一个 Python 包，可以使用很少的代码行将各种格式的模型转换为 Core ML 格式。\n\
  \n*   一旦您将 ML 模型转换为 Core ML 格式，它就可以像任何 Apple 提供的模型一样，轻松地在您的应用程序中使用。\n\n\n\n"
- "# 4. 使用 Create ML 自定义 Core ML 模型\n\n在第 3 章中，你学习了如何使用名为 Turi Create 的第三方框架来训练自定义机器学习模型。本章将向你介绍苹果公司于\
  \ 2018 年推出的 Create ML 框架，该框架允许开发者为 iOS 应用训练自定义 ML 模型。除了你在第 3 章中训练的图像分类模型外，本章还将介绍另外两种类型的模型：一种使用基于文本的数据进行训练，另一种使用表格数据进行训练。\n\
  \n## Create ML 简介\n\nCore ML 负责将 ML 模型集成到你的应用中，而 Create ML 则用于构建这些 ML 模型。虽然可以使用\
  \ Core ML 工具创建自定义 ML 模型（正如我们在第 3 章中所学的），但苹果公司在 2018 年推出了 Create ML，以使事情变得更加简单。Create\
  \ ML 是苹果公司自己的 ML 框架。其理念是使用 Create ML 构建你的自定义 ML 模型，然后使用 Core ML 将其应用到你的应用中。\n\n\
  Create ML 允许程序员用 Swift 实现端到端的机器学习，而不是用其他语言训练模型，然后再用 Swift 将其集成到 iOS 应用中。此外，你还可以直接在\
  \ Xcode Playground 中使用 Create ML。以下是可使用 Create ML 训练成模型的数据类型。图 4-1 也展示了这些类型。\n\n\
  ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig1_HTML.jpg](img/474993_1_En_4_Fig1_HTML.jpg)\n\
  \n图 4-1\n\n使用 Create ML 训练成模型的数据类型\n\n*   *图像*：此类数据可用于训练自定义图像分类器模型，该模型能够识别图像中的物体。\n\
  \n*   *文本*：此类数据可用于训练自定义文本分类器模型，该模型可用于执行情感分析、主题分析和领域分析等任务。\n\n*   *表格数据*：此类数据可用于训练自定义回归模型，该模型可用于执行多种类型的预测。\n\
  \n使用 Create ML 创建自定义模型的工作流程与我们在第 3 章中学到的自定义模型创建生命周期相同。步骤包括：问题识别、数据收集、训练模型、评估模型和生成模型。更多详情，请参阅第\
  \ 3 章中的相关主题。\n\n在本章的后续部分，我们将学习如何使用 Create ML 创建图像分类模型、文本分类模型以及回归模型。\n\n### 图像分类\n\
  \n图像分类是一个确定要为给定图像应用什么标签的问题。我们将尝试解决上一章中解决的同一个问题，即犬种识别，但这次使用 Create ML。以下是我们的问题陈述：\n\
  \n### 问题\n\n*给定一张狗的照片，模型应能识别出狗的品种。*\n\n现在，你可能已经拥有在第 3 章中创建的数据集。我们将为这个示例使用相同的数据集。如果你没有数据集，以下是需要做的：\n\
  \n![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig2_HTML.jpg](img/474993_1_En_4_Fig2_HTML.jpg)\n\
  \n图 4-2\n\n图像分类器的数据集\n\n*   首先，在你的 MacBook 上创建一个名为 Dataset 的文件夹。\n\n*   在 Dataset\
  \ 文件夹内，为你想要分类的每种狗创建一个子文件夹。\n\n*   然后，在每个子文件夹中放入一些该品种狗的图像。\n\n*   请注意，子文件夹的名称应为该文件夹中包含的狗的品种。图\
  \ 4-2 显示了数据集的文件夹结构。\n\n就这样；你现在有了自己的数据集。下一步是使用这些数据训练你的模型。请注意，Create ML 使用了我们在第 3\
  \ 章学习 Turi Create 时了解到的相同迁移学习技术。这意味着，使用 Create ML，我们可以在操作系统中已有的 ML 模型基础上训练我们的模型。这会导致更快的训练速度和更小的模型尺寸。以下是使用\
  \ Create ML 训练图像分类器模型的步骤：\n\n*步骤 1*：打开 Xcode；在菜单中选择 **File ➤ New ➤ Playground**（图\
  \ 4-3）。\n\n![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig3_HTML.jpg](img/474993_1_En_4_Fig3_HTML.jpg)\n\
  \n图 4-3\n\nXcode 中的新 Playground\n\n*步骤 2*：从模板选择菜单中选择空白文件（图 4-4）。请注意，你需要在 macOS 下选择空白文件，而不是\
  \ iOS，因为 Create ML 框架不支持 iOS Playgrounds。\n\n![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig4_HTML.jpg](img/474993_1_En_4_Fig4_HTML.jpg)\n\
  \n图 4-4\n\nPlayground 模板选择\n\n*步骤 3*：将其命名为 **“DogBreedPredictor”** 并保存到桌面。\n\n*步骤\
  \ 4*：现在，通过向 Playground 添加以下代码来导入 Create MLUI：\n\n```\nimport CreateMLUI\n```\n\n\
  Create MLUI 是一个类似于 Create ML 的框架；唯一的区别是，与 Create ML 不同，它带有用户界面。\n\n*步骤 5*：接下来，我们将创建一个构建器，帮助我们训练模型。为此，添加以下代码：\n\
  \n```\nlet builder = MLImageClassifierBuilder()\n```\n\n*步骤 6*：要使用 Create MLUI 的实时演示功能与构建器一起工作，我们将在代码中使用以下方法：\n\
  \n```\nbuilder.showInLiveView()\n```\n\n通过从工具栏打开辅助编辑器来启用 Xcode 的实时演示功能。你会在代码的最后一行看到一个播放按钮。请参考图\
  \ 4-5。点击该按钮可在实时演示中查看构建器界面。\n\n![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig5_HTML.jpg](img/474993_1_En_4_Fig5_HTML.jpg)\n\
  \n图 4-5\n\nXcode Playground 中的实时演示\n\n*步骤 7*：你会注意到，我们需要将图像拖放到构建器 UI 中才能开始训练。这非常简单。选择\
  \ Dataset 文件夹，并将整个文件夹拖放到构建器 UI 中。一旦你这样做了，Playground 就会开始训练模型。底部的控制台会显示已处理的图像数量、已用时间和任务完成百分比。请参考图\
  \ 4-6。\n\n![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig6_HTML.jpg](img/474993_1_En_4_Fig6_HTML.jpg)\n\
  \n图 4-6\n\n使用 Create ML 训练图像分类器 (A)\n\n训练完成后，构建器 UI 会显示三个标签：训练、验证和评估。请参考图 4-7。\n\
  \n\n\n![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig7_HTML.jpg](img/474993_1_En_4_Fig7_HTML.jpg)\n\
  \n图 4-7\n\n使用 Create ML 训练图像分类器 (B)\n\n*   训练过程会显示 Playground 成功训练的数据量。该值应为 100%。\n\
  \n*   训练前，Xcode 会从训练数据集中预留一部分图像，用于在模型训练完成后对其进行评估。验证过程会显示该评估的结果。\n\n*   评估应为空白，因为我们没有明确地在任何数据上测试模型。\n\
  \n*步骤 8*：让我们看看模型在识别未见过的狗图像品种方面表现如何。为此，创建一个包含一些未见过的狗图像的文件夹（保持文件夹结构与训练数据集相同），并将其拖放到构建器\
  \ UI 中。Playground 将开始测试模型。请参考图 4-8。\n\n![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig8_HTML.jpg](img/474993_1_En_4_Fig8_HTML.jpg)\n\
  \n图 4-8\n\n使用 Create ML 测试图像分类器 (A)\n\n测试完成后，你将看到评估标签出现一个值。100% 表示模型正确分类了所有图像。请参考图\
  \ 4-9。\n\n![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig9_HTML.jpg](img/474993_1_En_4_Fig9_HTML.jpg)\n\
  \n图 4-9\n\n使用 Create ML 测试图像分类器 (B)\n\n*步骤 9*：如果你对结果满意，接下来要做的就是保存模型。为此，请点击“实时演示”中“图像分类器”标题旁边的箭头。将出现一个下拉菜单，显示模型的所有元数据，如图\
  \ 4-10 所示。根据你的偏好更改元数据，然后点击“保存”。\n\n![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig10_HTML.jpg](img/474993_1_En_4_Fig10_HTML.jpg)\n\
  \n图 4-10\n\n保存图像分类器\n\n这就是我们使用 Create ML UI 构建 ML 模型的方法。如果你不想使用构建器 UI，而想通过编程方式完成，请按照以下步骤操作：\n\
  \n*步骤 1*：打开 Xcode；在菜单中选择“文件”➤“新建”➤“Playground”。\n\n*步骤 2*：从模板选择菜单中选择“空白”文件。请注意，你需要在\
  \ macOS 下选择空白文件，而不是 iOS，因为 iOS Playground 不支持 Create ML 框架。\n\n*步骤 3*：将其命名为 **“DogBreedPredictor”**\
  \ 并保存到桌面。\n\n*步骤 4*：现在，通过向 Playground 添加以下代码来导入 Create ML 和 Foundation：\n\n```\n\
  import CreateML\nimport Foundation\n```\n\n*步骤 5*：通过添加以下代码定义训练数据集和测试数据集的位置：\n\n\
  ```\nlet trainingLoc = URL(fileURLWithPath: \"/Users/yourusername/Desktop/MyDataset\"\
  \ )\nlet testLoc = URL(fileURLWithPath: \"/Users/yourusername/Desktop/MyTestData\"\
  )\n```\n\n*步骤 6*：通过添加以下代码定义模型：\n\n```\nlet model = try MLImageClassifier(trainingData:\
  \ .labledDirectories(at: trainingLoc))\n```\n\n要开始训练，请按 Shift+Enter。底部的控制台将显示已处理的图像数量、已用时间和任务完成百分比。请参考图\
  \ 4-11。\n\n![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig11_HTML.jpg](img/474993_1_En_4_Fig11_HTML.jpg)\n\
  \n图 4-11\n\n使用 Create ML 训练图像分类器 (C)\n\n*步骤 7*：训练完成后，你可能希望基于测试数据评估模型。为此，请添加以下代码：\n\
  \n```\nlet evaluation = model.evaluation(on:     .labledDirectories(at: testLoc))\n\
  ```\n\n要开始测试，请按 Shift+Enter。底部的控制台将显示评估输出。请参考图 4-12。\n\n![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig12_HTML.jpg](img/474993_1_En_4_Fig12_HTML.jpg)\n\
  \n图 4-12\n\n使用 Create ML 测试图像分类器 (C)\n\n*步骤 8*：如果你对评估结果满意，就该保存模型了。为此，请添加以下代码：\n\n\
  ```\ntry model.write(to: URL(fileURLWithPath: \"/Users/yourusername/Desktop/DogBreedPredictor\"\
  ))\n```\n\n按 Shift+Enter，模型将保存到你提供的路径。你的最终代码应如图 4-13 所示。\n\n![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig13_HTML.jpg](img/474993_1_En_4_Fig13_HTML.jpg)\n\
  \n图 4-13\n\n使用 Create ML 的图像分类器\n\n就是这样。我们刚刚使用 Create ML 创建了一个图像分类器，它可以根据给定的图片预测狗的品种。你可以将此模型导入你的\
  \ iOS 应用程序，并查看其性能表现。\n\n\n\n### 文本分类\n\n现在你已经了解了如何处理图像，你可能希望基于文本数据（自然语言）实现一些机器学习任务。这类任务包括情感分析、垃圾邮件过滤、主题分析等。这些任务通常被称为文本分类任务，而执行这些任务的机器学习模型则被称为文本分类器。接下来，我们将学习如何创建一个能够通过分类文本片段来执行情感分析的机器学习模型。\n\
  \n为此，我们首先需要一些数据作为训练模型的基础。这些数据可以通过以下形式提供：\n\n![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig14_HTML.jpg](img/474993_1_En_4_Fig14_HTML.jpg)\n\
  \n图 4-14\n\n用于训练的文本数据\n\n*   **原始文本文件**：你可以像图像分类器示例中那样创建带标签的目录。每个带标签的目录都包含原始文本文件，其中的文本内容与标签相符。请参考图\
  \ 4-14 中的示例。\n\n这里，我们有两个带标签的目录：一个用于正面数据，一个用于负面数据。标有“加号”的目录包含正面文本的原始文章，而标有“减号”的目录则包含负面文本的原始文章。\n\
  \n![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig15_HTML.jpg](img/474993_1_En_4_Fig15_HTML.jpg)\n\
  \n图 4-15\n\n用于训练的 CSV 数据\n\n*   **CSV 文件**：另一种组织训练数据的方式是创建一个 CSV（逗号分隔值）文件。在这里，所有数据都包含在一个单独的文件中，而不是分散在多个文件中。请参考图\
  \ 4-15 中的示例。\n\n这里，我们有一个单独的文件，其中包含原始文本条目及其对应的真实标签，两者用逗号分隔。该文件可以独立用于训练我们的机器学习模型。\n\
  \n![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig16_HTML.jpg](img/474993_1_En_4_Fig16_HTML.jpg)\n\
  \n图 4-16\n\n用于训练的 JSON 数据\n\n*   **JSON 文件**：JSON 代表 JavaScript 对象表示法。它是 CSV 的一种替代数据格式。与\
  \ CSV 文件一样，JSON 文件也将所有数据包含在一个单独的文件中。它使用键值对来表示带标签的数据。请参考图 4-16 中的示例以获得更清晰的理解。\n\n\
  这里，每条数据有两个键：“Text”表示数据内容，“Label”表示对应数据的真实标签。该文件也可以独立用于训练我们的机器学习模型。\n\n现在我们已经了解了可用于训练文本分类模型的数据类型，接下来让我们学习训练过程中涉及的典型步骤。以下是训练文本分类器的典型工作流程步骤（如图\
  \ 4-17 所示）：\n\n![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig17_HTML.jpg](img/474993_1_En_4_Fig17_HTML.jpg)\n\
  \n图 4-17\n\n训练文本分类器的典型工作流程\n\n*   **原始数据**：首先，我们收集用于训练的原始数据。\n\n*   **语言识别**：然后，我们从原始文本中识别出语言。\n\
  \n*   **生成词元**：接着，我们需要从文本中生成词元，学习算法会将这些词元与某些标签进行映射。\n\n*   **应用学习算法**：学习算法将词元作为输入，并对它们进行一些处理。\n\
  \n*   **获取预测标签**：然后，学习算法会给出输入词元的预测标签。\n\n*   **与真实标签比较**：现在，我们将预测标签与原始文本的实际标签进行比较。\n\
  \n*   **重复迭代**：如果预测不够准确，我们将重复训练过程。\n\n*   **生成模型**：如果预测足够准确，我们将生成模型。\n\n\n\n然而，使用\
  \ Create ML，可以将该过程中涉及的所有复杂性简化为非常少的几个简单步骤。让我们学习如何使用 Create ML 创建一个文本分类器，如果输入文本是乐观的，则返回“Positive”；如果输入文本是悲观的，则返回“Negative”。为此，我们首先需要收集并整理数据。\n\
  \n*步骤 1*：在你的 Macbook 上创建两个文件夹：**“MyDataset”** 和 **“MyTestDataset”**。\n\n*步骤 2*：为上一步创建的两个文件夹分别创建两个子文件夹：**“Positive”**\
  \ 和 **“Negative”**。\n\n*步骤 3*：在名为 **“Positive”** 的文件夹中，放入包含正面评论样本的文本文件。在名为 **“Negative”**\
  \ 的文件夹中，放入包含负面评论样本的文本文件。文件夹结构请参考图 4-18。\n\n![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig18_HTML.jpg](img/474993_1_En_4_Fig18_HTML.jpg)\n\
