  \n*步骤 1*：打开 Xcode，按照本书之前学过的步骤创建一个 iOS 应用程序项目。你可以参考图 4-36 所示的界面。\n\n![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig36_HTML.jpg](img/474993_1_En_4_Fig36_HTML.jpg)\n\
