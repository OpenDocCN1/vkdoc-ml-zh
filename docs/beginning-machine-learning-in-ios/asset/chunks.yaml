    code.


    *Step 4*: Now, to capture the text change event of the text view, we will need
    our ViewController class to conform to the TextViewDelegate protocol. We also
    need to set the delegate for Text View in the viewDidLoad method. To do so, add
    the following code to the ViewController.swift file:


    ```

    class ViewController: UIViewController, UITextViewDelegate {

    @IBOutlet weak var textView: UITextView!

    override func viewDidLoad() {

    super.viewDidLoad()

    textView.delegate = self;

    }

    }

    ```


    *Step 5*: Now to perform some action when the text in the textView is changed,
    we need to implement the textViewDidChange method of UITextViewDelegate protocol.
    To do so, add the following code to the ViewController class:


    ```

    func textViewDidChange(_ textView: UITextView){

    }

    ```


    *Step 6*: It is now time to add our ML model to the app. Drag-and-drop the model
    file into your project folder in the navigation pane of Xcode. On selecting the
    model file, you will see various information such as Name, Type, Size, Author,
    and Description of the model. You can see the Swift code for the model by clicking
    the model name under the Model Class section. Under Model Evaluation Parameters,
    you will also see that the model takes in a string as input text and returns a
    string as an output label. Before using this model in our app, make sure that
    the target membership in the right pane is checked for your project. See Figure
    [4-25](#474993_1_En_4_Chapter.xhtml#Fig25) for reference.


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig25_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig25_HTML.jpg)


    Figure 4-25


    Text classifier in Xcode


    *Step 7*: Now to use the model in our code, we will need to import the Core ML
    framework and declare a model variable in the ViewController class, which will
    represent the model. To do so, add the following code to the ViewController.swift
    file:


    ```

    import CoreML

    ...

    class ViewController: UIViewController, UITextViewDelegate {

    ...

    let model = SentimentAnalyzer()

    ...

    }

    ...

    ```


    *Step 8*: Now, to analyze the user sentiment we will call the prediction method
    every time the text in the TextView is changed. To do so, add the following code
    to the ViewController class :


    ```

    func textViewDidChange(_ textView: UITextView) {

    if let prediction = try? model.prediction(text: textView.text){

    if (prediction.label.contains("Positive")){

    btn.isEnabled = true

    btn.backgroundColor = UIColor.green

    lbl.text = "Good to go!"

    }

    else{

    btn.isEnabled = false

    btn.backgroundColor = UIColor.red

    lbl.text = "Please Enter Positive Text!"

    }

    }

    else{

    btn.isEnabled = true

    btn.backgroundColor = UIColor.blue

    lbl.text = "Neutral Sentiment!"

    }

    }

    ```


