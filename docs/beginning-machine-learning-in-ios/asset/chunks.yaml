    in and the output it returns. Before using this model in our app, make sure that
    the target membership in the right pane is checked for your project.


    *Step 5*: To use the model in our code, we will need to import the Core ML framework
    and declare a model variable in the ViewController class that will represent the
    model. To do so, add the following code to your ViewController.swift file:


    ```

    import CoreML

    ...

    class ViewController: UIViewController {

