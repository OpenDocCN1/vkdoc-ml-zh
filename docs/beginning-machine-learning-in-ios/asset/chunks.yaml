    of custom model creation that we learned in Chapter [3](#474993_1_En_3_Chapter.xhtml).
    The steps include: problem identification, data gathering, training the model,
    evaluating the model, and generating the model. For more details, kindly refer
    to the relevant topics in Chapter [3](#474993_1_En_3_Chapter.xhtml).


    In the following sections of this chapter, we will learn how to create an image
    classification model, text classification model, as well as a regression model
    using Create ML.


    ### Image Classification


    Image classification is a problem of determining what label you would like to
    apply to a given image. We will try to solve the same problem that we solved in
    the previous chapter, that is, dog breed identification, but this time using Create
    ML. The following is our problem statement:


    ### Problem


    *Given a picture of a dog, the model should be able to identify the breed of the
    dog.*


    Now, you might already have the dataset that you created in Chapter [3](#474993_1_En_3_Chapter.xhtml).
    We will use the same dataset for this example. If you do not have the dataset,
    here is what you need to do:


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig2_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig2_HTML.jpg)


    Figure 4-2


    Dataset for image classifier


    *   First, create a folder called Dataset on your MacBook.


    *   Inside the Dataset folder, create subfolders for each breed of dog you want
    to classify.


    *   Then inside each subfolder, place some images of dogs of that breed.


    *   Note that the name of the subfolder should be the breed of the dogs whose
    images that folder contains. Figure [4-2](#474993_1_En_4_Chapter.xhtml#Fig2) shows
    the folder structure for the dataset.


    That’s it; you now have your dataset. The next step is to train your model using
    this data. Note that Create ML uses the same transfer learning technique that
    we learned about in Chapter [3](#474993_1_En_3_Chapter.xhtml) while learning about
    Turi Create. It means, using Create ML, we can train our model on top of an ML
    model that already exists in the OS. This results in faster training and smaller
    model size. Following are the steps to train an image classifier model using Create
    ML:


    *Step 1*: Open Xcode; select **File ➤ New ➤ Playground** in the menu (Figure [4-3](#474993_1_En_4_Chapter.xhtml#Fig3)).


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig3_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig3_HTML.jpg)


    Figure 4-3


    New Playground in Xcode


    *Step 2*: Select the Blank file from the template selection menu (Figure [4-4](#474993_1_En_4_Chapter.xhtml#Fig4)).
    Note that you need to select a blank file under MacOS and not iOS, because the
    Create ML framework isn’t supported for iOS Playgrounds.


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig4_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig4_HTML.jpg)


    Figure 4-4


    Playground template selection


    *Step 3*: Name it **“DogBreedPredictor”** and save it to desktop.


    *Step 4*: Now import Create MLUI by adding the following code to the Playground:


    ```

    import CreateMLUI

    ```


    Create MLUI is a framework similar to Create ML; the only difference is that unlike
    Create ML, it has a UI to it.


    *Step 5*: Next, we will create a builder that will help us in training our model.
    To do so, add the following code:


    ```

    let builder = MLImageClassifierBuilder()

    ```


    *Step 6*: To work with the builder using the Live Demo feature of Create MLUI,
    we will use the following method in our code:


    ```

    builder.showInLiveView()

    ```


    Enable the Live Demo feature of Xcode by switching on the assistant editor from
    the toolbar. You will see a play button on the last line of your code. See Figure
    [4-5](#474993_1_En_4_Chapter.xhtml#Fig5) for reference. Click that button to view
    the builder interface in the Live Demo.


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig5_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig5_HTML.jpg)


    Figure 4-5


    Live demo in Xcode Playground


    *Step 7*: You will notice that we need to drop images into the builder UI to begin
    training. This is quite simple. Select the Dataset folder, and drop the entire
    folder into the builder UI. As soon as you do this, the Playground will start
    training the model. The console at the bottom will show you the number of images
    processed, elapsed time, and the percentage of job done. See Figure [4-6](#474993_1_En_4_Chapter.xhtml#Fig6)
    for reference.


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig6_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig6_HTML.jpg)


    Figure 4-6


    Training image classifier using Create ML (A)


    When the training is done, the builder UI will show you three labels: Training,
    Validation, and Evaluation. See Figure [4-7](#474993_1_En_4_Chapter.xhtml#Fig7)
    for reference.'
  trans: '

    # 4. 使用 Create ML 自定义 Core ML 模型


    在第 3 章中，你学习了如何使用名为 Turi Create 的第三方框架来训练自定义机器学习模型。本章将向你介绍苹果公司于 2018 年推出的 Create
    ML 框架，该框架允许开发者为 iOS 应用训练自定义 ML 模型。除了你在第 3 章中训练的图像分类模型外，本章还将介绍另外两种类型的模型：一种使用基于文本的数据进行训练，另一种使用表格数据进行训练。


    ## Create ML 简介


    Core ML 负责将 ML 模型集成到你的应用中，而 Create ML 则用于构建这些 ML 模型。虽然可以使用 Core ML 工具创建自定义 ML
    模型（正如我们在第 3 章中所学的），但苹果公司在 2018 年推出了 Create ML，以使事情变得更加简单。Create ML 是苹果公司自己的 ML
    框架。其理念是使用 Create ML 构建你的自定义 ML 模型，然后使用 Core ML 将其应用到你的应用中。


    Create ML 允许程序员用 Swift 实现端到端的机器学习，而不是用其他语言训练模型，然后再用 Swift 将其集成到 iOS 应用中。此外，你还可以直接在
    Xcode Playground 中使用 Create ML。以下是可使用 Create ML 训练成模型的数据类型。图 4-1 也展示了这些类型。


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig1_HTML.jpg](img/474993_1_En_4_Fig1_HTML.jpg)


    图 4-1


    使用 Create ML 训练成模型的数据类型


    *   *图像*：此类数据可用于训练自定义图像分类器模型，该模型能够识别图像中的物体。


    *   *文本*：此类数据可用于训练自定义文本分类器模型，该模型可用于执行情感分析、主题分析和领域分析等任务。


    *   *表格数据*：此类数据可用于训练自定义回归模型，该模型可用于执行多种类型的预测。


    使用 Create ML 创建自定义模型的工作流程与我们在第 3 章中学到的自定义模型创建生命周期相同。步骤包括：问题识别、数据收集、训练模型、评估模型和生成模型。更多详情，请参阅第
    3 章中的相关主题。


    在本章的后续部分，我们将学习如何使用 Create ML 创建图像分类模型、文本分类模型以及回归模型。


    ### 图像分类


    图像分类是一个确定要为给定图像应用什么标签的问题。我们将尝试解决上一章中解决的同一个问题，即犬种识别，但这次使用 Create ML。以下是我们的问题陈述：


    ### 问题


    *给定一张狗的照片，模型应能识别出狗的品种。*


    现在，你可能已经拥有在第 3 章中创建的数据集。我们将为这个示例使用相同的数据集。如果你没有数据集，以下是需要做的：


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig2_HTML.jpg](img/474993_1_En_4_Fig2_HTML.jpg)


    图 4-2


    图像分类器的数据集


    *   首先，在你的 MacBook 上创建一个名为 Dataset 的文件夹。


    *   在 Dataset 文件夹内，为你想要分类的每种狗创建一个子文件夹。


    *   然后，在每个子文件夹中放入一些该品种狗的图像。


    *   请注意，子文件夹的名称应为该文件夹中包含的狗的品种。图 4-2 显示了数据集的文件夹结构。


    就这样；你现在有了自己的数据集。下一步是使用这些数据训练你的模型。请注意，Create ML 使用了我们在第 3 章学习 Turi Create 时了解到的相同迁移学习技术。这意味着，使用
    Create ML，我们可以在操作系统中已有的 ML 模型基础上训练我们的模型。这会导致更快的训练速度和更小的模型尺寸。以下是使用 Create ML 训练图像分类器模型的步骤：


    *步骤 1*：打开 Xcode；在菜单中选择 **File ➤ New ➤ Playground**（图 4-3）。


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig3_HTML.jpg](img/474993_1_En_4_Fig3_HTML.jpg)


    图 4-3


    Xcode 中的新 Playground


    *步骤 2*：从模板选择菜单中选择空白文件（图 4-4）。请注意，你需要在 macOS 下选择空白文件，而不是 iOS，因为 Create ML 框架不支持
    iOS Playgrounds。


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig4_HTML.jpg](img/474993_1_En_4_Fig4_HTML.jpg)


    图 4-4


    Playground 模板选择


    *步骤 3*：将其命名为 **“DogBreedPredictor”** 并保存到桌面。


    *步骤 4*：现在，通过向 Playground 添加以下代码来导入 Create MLUI：


    ```

    import CreateMLUI

    ```


    Create MLUI 是一个类似于 Create ML 的框架；唯一的区别是，与 Create ML 不同，它带有用户界面。


    *步骤 5*：接下来，我们将创建一个构建器，帮助我们训练模型。为此，添加以下代码：


    ```

    let builder = MLImageClassifierBuilder()

    ```


    *步骤 6*：要使用 Create MLUI 的实时演示功能与构建器一起工作，我们将在代码中使用以下方法：


    ```

    builder.showInLiveView()

    ```


    通过从工具栏打开辅助编辑器来启用 Xcode 的实时演示功能。你会在代码的最后一行看到一个播放按钮。请参考图 4-5。点击该按钮可在实时演示中查看构建器界面。


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig5_HTML.jpg](img/474993_1_En_4_Fig5_HTML.jpg)


    图 4-5


    Xcode Playground 中的实时演示


    *步骤 7*：你会注意到，我们需要将图像拖放到构建器 UI 中才能开始训练。这非常简单。选择 Dataset 文件夹，并将整个文件夹拖放到构建器 UI 中。一旦你这样做了，Playground
    就会开始训练模型。底部的控制台会显示已处理的图像数量、已用时间和任务完成百分比。请参考图 4-6。


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig6_HTML.jpg](img/474993_1_En_4_Fig6_HTML.jpg)


    图 4-6


    使用 Create ML 训练图像分类器 (A)


    训练完成后，构建器 UI 会显示三个标签：训练、验证和评估。请参考图 4-7。

    '
- fmt: '![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig7_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig7_HTML.jpg)


    **Figure 4-7** Training image classifier using Create ML (B)


    - 训练过程显示 Playground 成功训练的数据量，该值应为 100%。

    - 在训练之前，Xcode 会从训练数据集中预留一部分图像，用于在模型训练完成后进行评估。验证结果显示的是该评估的结果。

    - 评估应为空白，因为我们没有显式地在任何数据上测试模型。


    **步骤 8**：让我们看看模型在识别未见过的狗图像品种方面表现如何。为此，创建一个包含一些未见过的狗图像的文件夹（保持文件夹结构与训练数据集相同），并将其拖放到构建器
    UI 中。Playground 将开始测试模型。请参考图 [4-8](#474993_1_En_4_Chapter.xhtml#Fig8)。


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig8_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig8_HTML.jpg)


    **Figure 4-8** Testing image classifier using Create ML (A)


    测试完成后，你将看到评估标签的值。100% 表示模型正确分类了所有图像。请参考图 [4-9](#474993_1_En_4_Chapter.xhtml#Fig9)。


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig9_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig9_HTML.jpg)


    **Figure 4-9** Testing image classifier using Create ML (B)


    **步骤 9**：如果你对结果满意，下一步就是保存模型。为此，点击 Live Demo 中图像分类器标题旁边的箭头。将出现一个下拉菜单，显示模型的所有元数据，如图
    [4-10](#474993_1_En_4_Chapter.xhtml#Fig10) 所示。根据需要更改元数据，然后点击保存。


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig10_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig10_HTML.jpg)


    **Figure 4-10** Saving the image classifier


    这就是我们使用 Create ML UI 构建 ML 模型的方法。如果你不想使用构建器 UI，而想以编程方式完成，请按照以下步骤操作：


    **步骤 1**：打开 Xcode；在菜单中选择 `File` ➤ `New` ➤ `Playground`。


    **步骤 2**：从模板选择菜单中选择空白文件。请注意，你需要选择 macOS 下的空白文件，而不是 iOS，因为 Create ML 框架不支持 iOS
    Playground。


    **步骤 3**：将其命名为 `DogBreedPredictor` 并保存到桌面。


    **步骤 4**：现在通过添加以下代码到 Playground 来导入 Create ML 和 Foundation：


    ```swift

    import CreateML

    import Foundation

    ```


    **步骤 5**：通过添加以下代码定义训练数据集和测试数据集的位置：


    ```swift

    let trainingLoc = URL(fileURLWithPath: "/Users/yourusername/Desktop/MyDataset"
    )

    let testLoc = URL(fileURLWithPath: "/Users/yourusername/Desktop/MyTestData")

    ```


    **步骤 6**：通过添加以下代码定义模型：


    ```swift

    let model = try MLImageClassifier(trainingData: .labledDirectories(at: trainingLoc))

    ```


    要开始训练，请按 `Shift+Enter`。底部的控制台将显示已处理的图像数量、已用时间和完成百分比。请参考图 [4-11](#474993_1_En_4_Chapter.xhtml#Fig11)。


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig11_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig11_HTML.jpg)


    **Figure 4-11** Training image classifier using Create ML (C)


    **步骤 7**：训练完成后，你可能希望基于测试数据评估模型。为此，添加以下代码：


    ```swift

    let evaluation = model.evaluation(on:     .labledDirectories(at: testLoc))

    ```


    要开始测试，请按 `Shift+Enter`。底部的控制台将显示评估输出。请参考图 [4-12](#474993_1_En_4_Chapter.xhtml#Fig12)。


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig12_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig12_HTML.jpg)


    **Figure 4-12** Testing image classifier using Create ML (C)


    **步骤 8**：如果你对评估结果满意，就该保存模型了。为此，添加以下代码：


    ```swift

    try model.write(to: URL(fileURLWithPath: "/Users/yourusername/Desktop/DogBreedPredictor"))

    ```


    按 `Shift+Enter`，模型将保存到你提供的路径。你的最终代码应如图 [4-13](#474993_1_En_4_Chapter.xhtml#Fig13)
    所示。


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig13_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig13_HTML.jpg)


    **Figure 4-13** Image classifier using Create ML


    就这样。我们刚刚使用 Create ML 创建了一个图像分类器，它可以根据图片预测狗的品种。你可以将此模型导入到你的 iOS 应用程序中，并查看其表现。'
  raw: '![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig7_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig7_HTML.jpg)


    Figure 4-7


    Training image classifier using Create ML (B)


    *   The training displays the amount of data Playground was successfully able
    to train. This should be 100%.


    *   Before training, Xcode puts aside some images from the training dataset, which
    it later uses for evaluating the model once it’s trained. Validation displays
    the result of such evaluation.


    *   Evaluation should be blank because we are not explicitly testing the model
    on any data.


    *Step 8*: Let us see how good our model performs in determining the breed from
    unseen dog images. To do so, create a folder containing some unseen dog images
    (keep the folder structure the same as the training dataset) and drop it into
    the builder UI. The Playground will start testing the model. See Figure [4-8](#474993_1_En_4_Chapter.xhtml#Fig8)
    for reference.


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig8_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig8_HTML.jpg)


    Figure 4-8


    Testing image classifier using Create ML (A)


    When testing is done, you will see a value for the Evaluation label. 100% means
    that the model classified all the images correctly. See Figure [4-9](#474993_1_En_4_Chapter.xhtml#Fig9)
    for reference.


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig9_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig9_HTML.jpg)


    Figure 4-9


    Testing image classifier using Create ML (B)


    *Step 9*: If you are satisfied with the results, the next thing to do is to save
    the model. To do so, click the arrow next to the Image Classifier title in the
    Live Demo. A drop-down menu will appear, displaying all the metadata about the
    model, as shown in Figure [4-10](#474993_1_En_4_Chapter.xhtml#Fig10). Change the
    metadata as per your preference and click Save.


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig10_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig10_HTML.jpg)


    Figure 4-10


    Saving the image classifier


    That’s how we build an ML Model using Create ML UI. If you do not want to use
    the builder UI and want to do this programmatically, following are the steps to
    do so:


    *Step 1*: Open Xcode; select File ➤ New ➤ Playground in the menu.


    *Step 2*: Select the Blank file from the template selection menu. Note that you
    need to select a blank file under MacOS and not iOS, because the Create ML framework
    isn’t supported for iOS Playgrounds.


    *Step 3*: Name it **“DogBreedPredictor”** and save it to desktop.


    *Step 4*: Now import Create ML and Foundation by adding the following code to
    the Playground:


    ```

    import CreateML

    import Foundation

    ```


    *Step 5*: Define the location of training dataset and test dataset by adding the
    following code:


    ```

    let trainingLoc = URL(fileURLWithPath: "/Users/yourusername/Desktop/MyDataset"
    )

    let testLoc = URL(fileURLWithPath: "/Users/yourusername/Desktop/MyTestData")

    ```


    *Step 6*: Define the model by adding the following code:


    ```

    let model = try MLImageClassifier(trainingData: .labledDirectories(at: trainingLoc))

    ```


    To begin training, press Shift+Enter. The console at the bottom will show you
    the number of images processed, elapsed time, and the percentage of job done.
    See Figure [4-11](#474993_1_En_4_Chapter.xhtml#Fig11) for reference.


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig11_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig11_HTML.jpg)


    Figure 4-11


    Training image classifier using Create ML (C)


    *Step 7*: Now that training is done, you might want to evaluate the model based
    on the test data. To do so, add the following code:


    ```

    let evaluation = model.evaluation(on:     .labledDirectories(at: testLoc))

    ```


    To begin testing, press Shift+Enter. The console at the bottom will show you the
    evaluation output. See Figure [4-12](#474993_1_En_4_Chapter.xhtml#Fig12) for reference.


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig12_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig12_HTML.jpg)


    Figure 4-12


    Testing image classifier using Create ML (C)


    *Step 8*: If you are happy with the evaluation results, it is time to save the
    model. To do so, add the following code:


    ```

    try model.write(to: URL(fileURLWithPath: "/Users/yourusername/Desktop/DogBreedPredictor"))

    ```


    Press Shift+Enter and the model will be saved at the path you provided. Your final
    code should be as shown in Figure [4-13](#474993_1_En_4_Chapter.xhtml#Fig13).


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig13_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig13_HTML.jpg)


    Figure 4-13


    Image classifier using Create ML


    That’s it. We just created an image classifier using Create ML that can predict
    the breed of a dog, given its picture. You can import this model into your iOS
    application and see how it performs.'
