  trans: "\n## 自定义模型创建的生命周期\n\n要创建自定义 Core ML 模型，首先需要确定要解决的问题，并收集有助于解决该问题的数据。例如，如果你要创建一个预测下个月电费的模型，你需要收集的数据就是历史电费账单以及相应时间段的用电量统计数据。\n\
    \n拥有数据集后，下一步是使用合适的算法训练模型。训练完成后，你可以通过评估模型来检查其准确性。最后，如果对评估结果满意，就可以构建模型。如果不满意，可以再次迭代训练过程。你可以重复此过程，直到对结果满意为止。图\
    \ 3-1 展示了自定义模型创建的生命周期。\n\n### 注意\n\nApple 引入了一种名为 ML Model (.mlmodel) 的标准化文件格式，允许开发者在应用中使用机器学习。所有机器学习模型最终都需要转换为\
    \ Core ML 格式 (.mlmodel)，才能在 Apple 产品中使用。\n\n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig1_HTML.jpg](img/474993_1_En_3_Fig1_HTML.jpg)\n\
    \n图 3-1\n\n自定义模型创建的生命周期\n\n以下是创建自定义 Core ML 模型所涉及的步骤：\n\n1.  *问题*：自定义模型创建的第一步是确定要解决的问题，并从机器学习的角度理解它。请考虑表\
    \ 3-1 中的任务及其对应的机器学习类别。\n\n    表 3-1\n\n    机器学习任务\n\n    | **你想要完成的任务** | **机器学习术语**\
    \ |\n    | --- | --- |\n    | 标记图像 | 图像分类 |\n    | 识别图像中的物体 | 物体检测 |\n    | 查找相似图像\
    \ | 图像相似度 |\n    | 创建自定义风格头像 | 风格迁移 |\n    | 个性化用户选择 | 推荐系统 |\n    | 使用传感器检测活动\
    \ | 活动分类 |\n    | 分析消息中的情感 | 文本分类器 |\n    | 预测标签 | 分类器 |\n    | 预测数值 | 回归 |\n\
    \    | 将相似数据分组 | 聚类 |\n\n2.  *数据*：确定问题后，下一步是确定完成此任务所需的数据类型和数据量。对于监督学习，数据将由输入和相应输出的配对组成。数据可以是任何形式，例如图片、文本文件、CSV\
    \ 文件或表格。最后，我们收集用于训练模型的相关数据。\n\n3.  *训练*：收集到所需数据后，我们就可以开始在数据上训练模型。\n\n4.  *评估*：模型准备好后，我们可以通过评估模型在测试数据集上的成功率来确定其质量。如果结果不达标，模型尚未准备好投入生产，我们可以重复训练过程，直到模型变得更准确。\n\
    \n5.  *模型*：如果训练过程的结果令人满意，我们可以生成可在应用中使用的 .mlmodel 文件。\n\n从头开始训练和评估模型可能是一项复杂的任务。为了简化这种复杂性，Apple\
    \ 引入了 Turi Create。结合 Python 使用 Turi Create，我们可以用很少的代码行，基于现有的机器学习模型来训练自定义模型，但更多细节将在后面介绍。\n\
    \n## 组装数据\n\n在了解组装数据之前，让我们先了解可以使用机器学习完成的基本任务类型。如果你有大量图像，你可能希望根据其内容对这些图像进行分类；如果你的应用向用户展示广告，你可能希望根据用户偏好定制这些广告；或者你可能希望提示用户通讯录中的重复联系人。\n\
    \n所有这些任务都需要不同类型的数据。为了便于理解，让我们考虑以下我们将尝试解决的问题陈述：\n\n### 问题\n\n给定一张狗的照片，应用程序应该能够预测狗的品种。\n\
    \n要创建一个能够完成此任务的模型，我们需要大量不同品种的狗的图像。然后，我们将从这些图像中创建一个数据集。别担心，这听起来并没有那么复杂。首先，在你的 MacBook\
    \ 上创建一个名为 Dataset 的文件夹。在 Dataset 文件夹内，为你想要分类的每个狗品种创建子文件夹。然后，在每个子文件夹中放置一些该品种狗的图像。请注意，子文件夹的名称应为狗品种的名称。请参考图\
    \ 3-2。\n\n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig2_HTML.jpg](img/474993_1_En_3_Fig2_HTML.jpg)\n\
    \n图 3-2\n\n自定义机器学习模型的数据集\n\n就这样。我们现在拥有了训练模型以执行分类任务所需的数据集。在本章的以下部分，我们将学习如何使用数据集训练机器学习模型。\n\
    \n## Turi Create 简介\n\nTuri Create 是一个基于 Python 的框架，可帮助你直接从数据集创建 Core ML 模型。它是一个开源框架，可在\
    \ [`https://github.com/apple/turicreate`](https://github.com/apple/turicreate)\
    \ 获取。它也是跨平台的，这意味着你可以在 MacOS 和 Linux 上使用它。\n\n使用 Turi Create 的主要好处是，它允许我们在操作系统中已有的机器学习模型之上训练我们的模型，而不是从头开始训练。这通常被称为迁移学习。这一点很重要，因为从头开始训练模型需要数百万张图像、巨大的计算能力和大量的耐心。相反，使用\
    \ Turi Create，我们可以利用现有的机器学习模型（如 ResNet（残差网络）），并针对我们的特定数据训练该模型的最后几层。这样，我们就可以利用手头的数据量，及时创建一个足够好的机器学习模型。使用迁移学习还可以减小模型大小。\n"
- fmt: '### Note


    We will be using Mac OS Mojave 10.14 and Xcode 10 for all the development that
    we do here onward.


    Let us learn how to install Turi Create on our Mac.


    **Step 1**: To install Turi Create, we will need Python installed on our Mac.
    By default, we have Python 2.7 installed on Mac systems. This would be sufficient
    for installing Turi Create. You can manually download Python from [`https://www.python.org`](https://www.python.org)
    and install it on your Mac if you wish to. But note that Turi Create does not
    support the latest version of Python (i.e., version 3.7); hence we will use the
    default version of Python that is installed on our systems. To check the Python
    version on your system, you can open the terminal window and run the `python`
    command. See Figure [3-3](#474993_1_En_3_Chapter.xhtml#Fig3).


    ![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig3_HTML.jpg](images/474993_1_En_3_Chapter/474993_1_En_3_Fig3_HTML.jpg)


    Figure 3-3: Checking Python version on Mac


    **Step 2**: Now, in order to install packages using Python, you need to install
    the Python package manager (commonly known as `pip`) on your system. To do so,
    open the terminal window and run the `sudo easy_install pip` command. See Figure
    [3-4](#474993_1_En_3_Chapter.xhtml#Fig4). Sit back and wait while the package
    manager gets installed on your system.


    ![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig4_HTML.jpg](images/474993_1_En_3_Chapter/474993_1_En_3_Fig4_HTML.jpg)


    Figure 3-4: Installing `pip` on Mac


    **Step 3**: Open the terminal window again and run the `pip` command to check
    if the Python package manager is successfully installed on your system. If it
    is installed, then you will see a list of commands offered by the package manager
    (Figure [3-5](#474993_1_En_3_Chapter.xhtml#Fig5)). If not, please try reinstalling
    `pip` on your Mac before proceeding to the next step.


