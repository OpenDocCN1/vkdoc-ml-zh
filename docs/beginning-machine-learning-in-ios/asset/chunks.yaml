- fmt: "**Step 6**: Now to predict the house price, we will call the prediction method\
    \ when the submit button is tapped. We will also set the value of the label to\
    \ the predicted price that the model returns. To do so, add the following code\
    \ to the `ViewController` class:\n\n```\n@IBAction func onDataSubmit(_ sender:\
    \ Any) {\nlet prediction = try? model.prediction(Area: Double(area.text!) ?? 0,\n\
    Neighborhood: neighborhood.text!,\nHouseStyle: houseStyle.text!,\nFullBath: Double(fullBaths.text!)\
    \ ?? 0,\nHalfBath: Double(halfBaths.text!) ?? 0,\nBedroom: Double(bedrooms.text!)\
    \ ?? 0,\nKitchen: Double(kitchen.text!) ?? 0,\nGarageType: garageType.text!)\n\
    housePrice.text = \"\\(String(describing: prediction!.SalePrice))\"\n}\n```\n\n\
    **Step 7**: It is finally time to build and run the application. Let us find out\
    \ how well our ML model predicts the house price for the user’s dream house. Figures\
    \ [4-37](#474993_1_En_4_Chapter.xhtml#Fig37) and [4-38](#474993_1_En_4_Chapter.xhtml#Fig38)\
    \ show different screens that you should see while playing around with your application.\n\
    \n![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig38_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig38_HTML.jpg)\n\
    \nFigure 4-38 House price finder application (B)\n\n![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig37_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig37_HTML.jpg)\n\
    \nFigure 4-37 House price finder application (A)\n\n## Summary\n\n- Apple introduced\
    \ Create ML in 2018 to provide developers with the capability to implement end-to-end\
    \ machine learning in Swift.\n- Though ML models can be created using previously\
    \ launched Core ML tools, Create ML does the job even easier with its direct integration\
    \ with Xcode Playgrounds.\n- Major types of data that can be trained into a model\
    \ using Create ML are images, text, and tabular data.\n- The workflow of custom\
    \ model creation using Create ML is the same as the life cycle of custom model\
    \ creation that we learned in Chapter [3](#474993_1_En_3_Chapter.xhtml). It is\
    \ as follows:\n    - Define the problem\n    - Collect data\n    - Train the learning\
    \ algorithm\n    - Evaluate the Learning Algorithm\n    - Build the model\n- Image\
    \ classifier models can be built to accomplish tasks such as prediction of dog\
    \ breed from its image.\n- Text classifier models can be built to accomplish tasks\
    \ such as predicting the sentiment of the users based on the text that they type.\n\
    - Regression models can be built to accomplish tasks such as predicting the price\
    \ of a house based on its locality, net area, type of house, and multiple other\
    \ factors.\n\n# 5. Improving Computational Efficiency\n\nThis chapter shares with\
    \ the reader’s information on some miscellaneous topics such as the difference\
    \ between GPU and CPU processing, and things to consider while implementing machine\
    \ learning.\n\nMore importantly, this chapter covers two important frameworks\
    \ that the Core ML framework is based on: Accelerate and Metal Performance Shaders\
    \ (MPS). There are no practical examples of using these two frameworks in code\
    \ because they are implicitly used while implementing ML using Core ML. However,\
    \ the chapter covers abstract information on the libraries that these two frameworks\
    \ comprise.\n\n## GPU vs. CPU Processing\n\nThe CPU (Central Processing Unit)\
    \ is often called the brain of a machine. The majority of the software on the\
    \ machine requires a CPU to function. However, there are several examples of software\
    \ that requires heavy computation power. A CPU cannot efficiently support the\
    \ functioning of such software. This is where a GPU (graphics processing unit)\
    \ comes to the rescue.\n\nA GPU is a special kind of microprocessor that is designed\
    \ for quick image rendering. GPUs were launched as a solution to graphically potent\
    \ applications that consumes a lot of CPU power and degrades the overall machine\
    \ performance. However, modern GPUs are even capable of handling applications\
    \ that require powerful mathematical calculations. With the use of GPUs, whenever\
    \ software needs heavy computation power, the process is transferred from CPU\
    \ to GPU to preserve the overall performance quality of the machine. Figure [5-1](#474993_1_En_5_Chapter.xhtml#Fig1)\
    \ shows the abstract structure of CPUs and GPUs.\n\n![../images/474993_1_En_5_Chapter/474993_1_En_5_Fig1_HTML.jpg](images/474993_1_En_5_Chapter/474993_1_En_5_Fig1_HTML.jpg)\n\
    \nFigure 5-1 CPU vs. GPU\n\nThough a CPU and GPU are both silicon-based microprocessors,\
    \ they process tasks in very different ways. While a CPU is referred to as the\
    \ brain of a machine, a GPU is referred to as the muscle of the machine. A CPU\
    \ is good at performing multiple, diverse kinds of tasks but it can run only few\
    \ tasks at a time due to its limited number of cores. Whereas a GPU focuses all\
    \ its computation power in carrying out one specific kind of task, but it can\
    \ run multiple instances of similar tasks due to its large number of cores. A\
    \ CPU has up to 24 cores, which are designed to optimize the performance of a\
    \ single task within a job. On the other hand, a GPU has thousands of smaller\
    \ cores, which are optimized for handling multiple tasks in a parallel architecture.\
    \ Modern GPUs are used to address tasks such as ML and big data analysis.\n\n\
    ## Key Considerations while Implementing Machine Learning\n\nWhile implementing\
    \ ML on a mobile device, we tend to lose some of the luxuries that we get while\
    \ implementing it on a computer. Following are some of the points to consider\
    \ while implementing ML in a mobile application:\n\n- **Model size**: In previous\
    \ chapters we walked through the process of building some simple ML models, which\
    \ are negligible in terms of memory requirements. But, as you dive into the world\
    \ of ML, it’s common to find models hundreds of megabytes in size. For example,\
    \ the VGG16 model is a 16-layer neural network architecture trained on the ImageNet\
    \ dataset used for image classification. It is available on Apple’s site and is\
    \ approximately 500 megabytes in size. Asking your user to download such a large\
    \ file may intimidate them.\n- **Memory**: Along with the overall size of the\
    \ model, you also need to be concerned about the amount of working memory that\
    \ the model might require. It is not uncommon for desktop computers to have around\
    \ 16 to 32 Gigabytes of memory, but the latest iPhone (iPhone XS Max) has merely\
    \ 4 Gigabytes of RAM. This constraint should be kept in mind while selecting the\
    \ ML model for your mobile application.\n- **Processing speed**: This is a factor\
    \ that depends on multiple things. Loading the input data and making the inference\
    \ is not the only part of the workflow. There is certain preprocessing as well\
    \ as postprocessing associated with the functioning of the application. For instance,\
    \ if the input text is in string format and your model only accepts an array input,\
    \ you might want to convert the string into an array before making the inference.\
    \ This is referred to as preprocessing. In the same way, if the model returns\
    \ a string label as an output but you want to display an emoticon to the user,\
    \ you might want to map the string to the corresponding emoticon before displaying\
    \ it to the user. This is referred to as postprocessing. At times, you might have\
    \ to trade off some processing speed against large model size."
  raw: "*Step 6*: Now to predict the house price, we will call the prediction method\
    \ when the submit button is tapped. We will also set the value of the label to\
    \ the predicted price that the model returns. To do so, add the following code\
    \ to the ViewController class:\n\n```\n@IBAction func onDataSubmit(_ sender: Any)\
    \ {\nlet prediction = try? model.prediction(Area: Double(area.text!) ?? 0,\nNeighborhood:\
    \ neighborhood.text!,\nHouseStyle: houseStyle.text!,\nFullBath: Double(fullBaths.text!)\
    \ ?? 0,\nHalfBath: Double(halfBaths.text!) ?? 0,\nBedroom: Double(bedrooms.text!)\
    \ ?? 0,\nKitchen: Double(kitchen.text!) ?? 0,\nGarageType: garageType.text!)\n\
    housePrice.text = \"\\(String(describing: prediction!.SalePrice))\"\n}\n```\n\n\
    *Step 7*: It is finally time to build and run the application. Let us find out\
    \ how well our ML model predicts the house price for the user’s dream house. Figures\
    \ [4-37](#474993_1_En_4_Chapter.xhtml#Fig37) and [4-38](#474993_1_En_4_Chapter.xhtml#Fig38)\
    \ show different screens that you should see while playing around with your application.\n\
    \n![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig38_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig38_HTML.jpg)\n\
    \nFigure 4-38\n\nHouse price finder application (B)\n\n![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig37_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig37_HTML.jpg)\n\
    \nFigure 4-37\n\nHouse price finder application (A)\n\n## Summary\n\n*   Apple\
    \ introduced Create ML in 2018 to provide developers with the capability to implement\
    \ end-to-end machine learning in Swift.\n\n*   Though ML models can be created\
    \ using previously launched Core ML tools, Create ML does the job even easier\
    \ with its direct integration with Xcode Playgrounds.\n\n*   Major types of data\
    \ that can be trained into a model using Create ML are images, text, and tabular\
    \ data.\n\n*   The workflow of custom model creation using Create ML is the same\
    \ as the life cycle of custom model creation that we learned in Chapter [3](#474993_1_En_3_Chapter.xhtml).\
    \ It is as follows:\n    *   Define the problem\n\n    *   Collect data\n\n  \
    \  *   Train the learning algorithm\n\n    *   Evaluate the Learning Algorithm\n\
    \n    *   Build the model\n\n*   Image classifier models can be built to accomplish\
    \ tasks such as prediction of dog breed from its image.\n\n*   Text classifier\
    \ models can be built to accomplish tasks such as predicting the sentiment of\
    \ the users based on the text that they type.\n\n*   Regression models can be\
    \ built to accomplish tasks such as predicting the price of a house based on its\
    \ locality, net area, type of house, and multiple other factors.\n\n# 5. Improving\
    \ Computational Efficiency\n\nThis chapter shares with the reader’s information\
    \ on some miscellaneous topics such as the difference between GPU and CPU processing,\
    \ and things to consider while implementing machine learning.\n\nMore importantly,\
    \ this chapter covers two important frameworks that the Core ML framework is based\
    \ on: Accelerate and Metal Performance Shaders (MPS). There are no practical examples\
    \ of using these two frameworks in code because they are implicitly used while\
    \ implementing ML using Core ML. However, the chapter covers abstract information\
    \ on the libraries that these two frameworks comprise.\n\n## GPU vs. CPU Processing\n\
    \nThe CPU (Central Processing Unit) is often called the brain of a machine. The\
    \ majority of the software on the machine requires a CPU to function. However,\
    \ there are several examples of software that requires heavy computation power.\
    \ A CPU cannot efficiently support the functioning of such software. This is where\
    \ a GPU (graphics processing unit) comes to the rescue.\n\nA GPU is a special\
    \ kind of microprocessor that is designed for quick image rendering. GPUs were\
    \ launched as a solution to graphically potent applications that consumes a lot\
    \ of CPU power and degrades the overall machine performance. However, modern GPUs\
    \ are even capable of handling applications that require powerful mathematical\
    \ calculations. With the use of GPUs, whenever software needs heavy computation\
    \ power, the process is transferred from CPU to GPU to preserve the overall performance\
    \ quality of the machine. Figure [5-1](#474993_1_En_5_Chapter.xhtml#Fig1) shows\
    \ the abstract structure of CPUs and GPUs.\n\n![../images/474993_1_En_5_Chapter/474993_1_En_5_Fig1_HTML.jpg](images/474993_1_En_5_Chapter/474993_1_En_5_Fig1_HTML.jpg)\n\
    \nFigure 5-1\n\nCPU vs. GPU\n\nThough a CPU and GPU are both silicon-based microprocessors,\
    \ they process tasks in very different ways. While a CPU is referred to as the\
    \ brain of a machine, a GPU is referred to as the muscle of the machine. A CPU\
    \ is good at performing multiple, diverse kinds of tasks but it can run only few\
    \ tasks at a time due to its limited number of cores. Whereas a GPU focuses all\
    \ its computation power in carrying out one specific kind of task, but it can\
    \ run multiple instances of similar tasks due to its large number of cores. A\
    \ CPU has up to 24 cores, which are designed to optimize the performance of a\
    \ single task within a job. On the other hand, a GPU has thousands of smaller\
    \ cores, which are optimized for handling multiple tasks in a parallel architecture.\
    \ Modern GPUs are used to address tasks such as ML and big data analysis .\n\n\
    ## Key Considerations while Implementing Machine Learning\n\nWhile implementing\
    \ ML on a mobile device, we tend to lose some of the luxuries that we get while\
    \ implementing it on a computer. Following are some of the points to consider\
    \ while implementing ML in a mobile application:\n\n*   *Model size*: In previous\
    \ chapters we walked through the process of building some simple ML models, which\
    \ are negligible in terms of memory requirements. But, as you dive into the world\
    \ of ML, it’s common to find models hundreds of megabytes in size. For example,\
    \ the VGG16 model is a 16-layer neural network architecture trained on the ImageNet\
    \ dataset used for image classification. It is available on Apple’s site and is\
    \ approximately 500 megabytes in size. Asking your user to download such a large\
    \ file may intimidate them.\n\n*   *Memory*: Along with the overall size of the\
    \ model, you also need to be concerned about the amount of working memory that\
    \ the model might require. It is not uncommon for desktop computers to have around\
    \ 16 to 32 Gigabytes of memory, but the latest iPhone (iPhone XS Max) has merely\
    \ 4 Gigabytes of RAM. This constraint should be kept in mind while selecting the\
    \ ML model for your mobile application.\n\n*   *Processing speed*: This is a factor\
    \ that depends on multiple things. Loading the input data and making the inference\
    \ is not the only part of the workflow. There is certain preprocessing as well\
    \ as postprocessing associated with the functioning of the application. For instance,\
    \ if the input text is in string format and your model only accepts an array input,\
    \ you might want to convert the string into an array before making the inference.\
    \ This is referred to as preprocessing. In the same way, if the model returns\
    \ a string label as an output but you want to display an emoticon to the user,\
    \ you might want to map the string to the corresponding emoticon before displaying\
    \ it to the user. This is referred to as postprocessing. At times, you might have\
    \ to trade off some processing speed against large model size."
  trans: "\n*步骤 6*：现在，为了预测房价，我们将在点击提交按钮时调用预测方法。同时，我们还会将标签的值设置为模型返回的预测价格。为此，请在 `ViewController`\
    \ 类中添加以下代码：\n\n```\n@IBAction func onDataSubmit(_ sender: Any) {\nlet prediction\
    \ = try? model.prediction(Area: Double(area.text!) ?? 0,\nNeighborhood: neighborhood.text!,\n\
    HouseStyle: houseStyle.text!,\nFullBath: Double(fullBaths.text!) ?? 0,\nHalfBath:\
    \ Double(halfBaths.text!) ?? 0,\nBedroom: Double(bedrooms.text!) ?? 0,\nKitchen:\
    \ Double(kitchen.text!) ?? 0,\nGarageType: garageType.text!)\nhousePrice.text\
    \ = \"\\(String(describing: prediction!.SalePrice))\"\n}\n```\n\n*步骤 7*：终于到了构建并运行应用程序的时候了。让我们看看我们的\
    \ ML 模型在预测用户梦想之家的房价方面表现如何。图 4-37 和图 4-38 展示了你在操作应用程序时应该看到的不同界面。\n\n![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig38_HTML.jpg](img/474993_1_En_4_Fig38_HTML.jpg)\n\
    \n图 4-38\n\n房价查找应用程序 (B)\n\n![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig37_HTML.jpg](img/474993_1_En_4_Fig37_HTML.jpg)\n\
    \n图 4-37\n\n房价查找应用程序 (A)\n\n## 总结\n\n*   Apple 在 2018 年推出了 Create ML，为开发者提供了在\
    \ Swift 中实现端到端机器学习的能力。\n\n*   虽然可以使用之前推出的 Core ML 工具创建 ML 模型，但 Create ML 通过与 Xcode\
    \ Playgrounds 的直接集成，使这项工作变得更加简单。\n\n*   使用 Create ML 可以训练成模型的主要数据类型包括图像、文本和表格数据。\n\
    \n*   使用 Create ML 创建自定义模型的工作流程与我们之前在第三章中学到的自定义模型创建生命周期相同。具体如下：\n    *   定义问题\n\
    \    *   收集数据\n    *   训练学习算法\n    *   评估学习算法\n    *   构建模型\n\n*   可以构建图像分类器模型来完成诸如根据狗的图像预测其品种等任务。\n\
    \n*   可以构建文本分类器模型来完成诸如根据用户输入的文本预测其情感等任务。\n\n*   可以构建回归模型来完成诸如根据房屋所在地、净面积、房屋类型及其他多种因素预测房价等任务。\n\
    \n# 5. 提高计算效率\n\n本章向读者介绍一些杂项主题的信息，例如 GPU 与 CPU 处理的区别，以及在实现机器学习时需要考虑的事项。\n\n更重要的是，本章涵盖了\
    \ Core ML 框架所基于的两个重要框架：Accelerate 和 Metal Performance Shaders (MPS)。没有在代码中使用这两个框架的实际示例，因为在使用\
    \ Core ML 实现机器学习时会隐式地使用它们。不过，本章涵盖了这两个框架所包含的库的抽象信息。\n\n## GPU 与 CPU 处理\n\nCPU（中央处理器）通常被称为机器的“大脑”。机器上的大多数软件都需要\
    \ CPU 才能运行。然而，有些软件需要强大的计算能力。CPU 无法高效地支持此类软件的运行。这时，GPU（图形处理器）就派上了用场。\n\nGPU 是一种特殊的微处理器，专为快速图像渲染而设计。GPU\
    \ 最初是作为图形密集型应用的解决方案而推出的，这些应用会消耗大量 CPU 资源并降低整体机器性能。然而，现代 GPU 甚至能够处理需要强大数学计算能力的应用。通过使用\
    \ GPU，每当软件需要强大计算能力时，处理过程就会从 CPU 转移到 GPU，以保持机器的整体性能质量。图 5-1 展示了 CPU 和 GPU 的抽象结构。\n\
    \n![../images/474993_1_En_5_Chapter/474993_1_En_5_Fig1_HTML.jpg](img/474993_1_En_5_Fig1_HTML.jpg)\n\
    \n图 5-1\n\nCPU 与 GPU 对比\n\n尽管 CPU 和 GPU 都是基于硅的微处理器，但它们处理任务的方式截然不同。CPU 被称为机器的“大脑”，而\
    \ GPU 则被称为机器的“肌肉”。CPU 擅长执行多种不同类型的任务，但由于其核心数量有限，一次只能运行少量任务。而 GPU 则将其所有计算能力集中在执行一种特定类型的任务上，但由于其拥有大量核心，它可以同时运行多个相似的任务实例。CPU\
    \ 最多拥有 24 个核心，这些核心旨在优化作业中单个任务的性能。另一方面，GPU 拥有数千个更小的核心，这些核心针对并行架构中处理多个任务进行了优化。现代\
    \ GPU 被用于处理诸如机器学习和大数据分析等任务。\n\n## 实现机器学习时的关键考虑因素\n\n在移动设备上实现机器学习时，我们往往会失去在计算机上实现时所拥有的一些便利条件。以下是在移动应用程序中实现机器学习时需要考虑的一些要点：\n\
    \n*   *模型大小*：在前面的章节中，我们介绍了构建一些简单 ML 模型的过程，这些模型在内存需求方面可以忽略不计。但是，随着你深入 ML 世界，经常会遇到大小达数百兆字节的模型。例如，VGG16\
    \ 模型是一个 16 层神经网络架构，在用于图像分类的 ImageNet 数据集上训练而成。它在 Apple 的网站上可用，大小约为 500 兆字节。要求用户下载如此大的文件可能会让他们望而却步。\n\
    \n*   *内存*：除了模型的整体大小之外，你还需要关注模型可能需要的运行内存量。台式计算机通常拥有 16 到 32 GB 的内存，但最新的 iPhone（iPhone\
    \ XS Max）仅有 4 GB 的 RAM。在为你的移动应用程序选择 ML 模型时，应牢记这一限制。\n\n*   *处理速度*：这是一个取决于多种因素的因素。加载输入数据并进行推理并不是工作流程的全部。应用程序的运行还涉及某些预处理和后处理。例如，如果输入文本是字符串格式，而你的模型只接受数组输入，你可能需要在推理之前将字符串转换为数组。这被称为预处理。同样，如果模型返回一个字符串标签作为输出，但你希望向用户显示一个表情符号，你可能需要在向用户显示之前将字符串映射到相应的表情符号。这被称为后处理。有时，你可能不得不在处理速度和较大的模型大小之间进行权衡。\n"
- fmt: '## Accelerate


    `Accelerate`是一个框架，由苹果公司于2003年在Mac OS X v10.3 Panther中首次引入。它是一个高性能向量加速库的集合，允许你在应用程序中执行基于向量的操作，而无需显式使用底层向量指令。你无需关心用户的机器，因为`Accelerate`框架被设计为根据代码运行机器的架构自动调用相应的指令集。图[5-2](#474993_1_En_5_Chapter.xhtml#Fig2)展示了`Accelerate`框架所包含的库。


    ![../images/474993_1_En_5_Chapter/474993_1_En_5_Fig2_HTML.png](images/474993_1_En_5_Chapter/474993_1_En_5_Fig2_HTML.png)


    图5-2 Panther中的`Accelerate`框架


    ### vImage – 图像变换


    `vImage`库包含用于对图形和图像执行操作的程序。这些程序能充分利用可用硬件。它们可以执行如下操作：


    *   **格式转换**：`vImage`库主要支持`Planar8`、`PlanarF`、`ARGB8888`和`ARGBFFFF`等图像格式，并支持这些格式之间的图像转换。

    *   **卷积**：这是一个术语，指根据像素周围像素的值修改像素值的过程。卷积可用于实现模糊、锐化、浮雕等图像效果。`vImage`库还支持反卷积，即逆转卷积效果的过程。

    *   **形态学操作**：这些操作用于修改图像的结构。`vImage`库支持两种形态学操作：膨胀（像素尺寸逐渐增大）和腐蚀（像素尺寸逐渐减小）。

    *   **直方图**：图像的直方图用于图形化描述图像像素的强度。`vImage`库支持创建图像直方图。此外，还可以变换图像，使其具有与特定直方图相同的像素强度。

    *   **几何操作**：`vImage`库提供了可以对图像进行几何变换的子程序。操作包括旋转、翻转、扭曲、镜像、缩放等。

    *   **Alpha合成**：图像中的每个像素都有一个决定其不透明度的alpha值。Alpha合成是将两个具有不同alpha值的图像合并，产生一个图像置于另一个图像之上的效果。

    *   **变换操作**：`vImage`库还支持不依赖于其他像素值的像素变换函数。这些函数包括矩阵乘法和伽马校正。


    ### vDSP – 数字信号处理


    `vDSP`库主要专注于傅里叶变换、矩阵算术和向量操作。`vDSP`库的应用包括语音处理、音频处理、数字图像处理、密码学以及其他向量操作，例如求向量的绝对值、在单精度向量和双精度向量之间转换、压缩向量值等。`vDSP`子程序操作于基本的C数据类型，如`float`、`integer`、`double`、`short
    integer`和`character`。


    ### BLAS 和 LAPACK


    基本线性代数子程序（BLAS）和线性代数包（LAPACK）库包含执行基于矩阵的线性代数计算的子程序，例如特征值问题和矩阵乘法。`BLAS`作为`LAPACK`的基础库，执行高级代数计算。


    ### vMathLib


    `vMathLib`是标准数学库`libm`的面向向量版本。它们之间的区别在于`vMathLib`使用128位硬件向量来执行数学运算。


    ### vBigNum


    `vBigNum`库使用1024位整数操作数执行整数加法、减法、除法和乘法等操作。


    要在你的Xcode项目中使用`Accelerate`库，你需要通过添加以下代码来添加`Accelerate`头文件：


    ```

    #include <Accelerate/Accelerate.h>

    OR

    import Accelerate

    ```


    你还需要从系统框架文件夹中将该框架添加到你的项目中：


    ```

    /System/Library/Frameworks/Accelerate.framework

    ```


    ### 注意


    `Accelerate`是一个复杂的框架，不建议作为在iOS中开始机器学习的方式。作为初学者，你只需要知道Core ML（最新的机器学习框架）基于`Accelerate`，并利用了`Accelerate`框架的计算能力。'
  raw: "## Accelerate\n\nAccelerate is a framework that was first introduced by Apple\
    \ in 2003 for Mac OS X v10.3 Panther. It is a collection of high-performance vector-accelerated\
    \ libraries that lets you perform vector-based operations in your application\
    \ without explicitly using low-level vector instructions. You do not need to be\
    \ concerned with the user’s machine because the Accelerate framework is written\
    \ to automatically invoke the appropriate instruction set based on the architecture\
    \ of the machine that the code is running on. Figure [5-2](#474993_1_En_5_Chapter.xhtml#Fig2)\
    \ shows the libraries that the Accelerate framework is comprised of.\n\n![../images/474993_1_En_5_Chapter/474993_1_En_5_Fig2_HTML.png](images/474993_1_En_5_Chapter/474993_1_En_5_Fig2_HTML.png)\n\
    \nFigure 5-2\n\nAccelerate framework in Panther\n\n### vImage – Image Transformation\n\
    \nThe vImage library contains routines to perform operations on graphics and images.\
    \ These routines make the best use of available hardware. They can perform operations\
    \ such as the following:\n\n*   *Format conversion*: The vImage library primarily\
    \ supports image formats such as Planar8, PlanarF, ARGB8888, and ARGBFFFF. It\
    \ supports image conversion between these formats.\n\n*   *Convolution*: This\
    \ is a term that refers to the process of modifying pixel values based on the\
    \ values of the pixels surrounding it. Convolution can be used to implement image\
    \ effects such as blur, sharpening, embossing, and so on. The vImage library also\
    \ supports deconvolution, which is a process of reversing the effect of convolution.\n\
    \n*   *Morphological* *operations*: These are the operations that are used to\
    \ modify the structure of an image. The vImage library supports two morphological\
    \ operations: dilation, where the size of the pixels is gradually increased; and\
    \ erosion, where the size of the pixels is gradually decreased.\n\n*   *Histograms*:\
    \ The histogram for an image is used to graphically describe the intensities of\
    \ the image pixels. The vImage library supports the creation of image histograms.\
    \ Moreover, one can also transform an image to have the same pixel intensities\
    \ as a particular histogram.\n\n*   *Geometric operations*: The vImage library\
    \ provides subroutines that can geometrically transform images. The operations\
    \ include Rotate, Flip, Warp, Mirror, Scale, and so on.\n\n*   *Alpha compositing*:\
    \ Each pixel in an image has an alpha value that determines the opaqueness of\
    \ the pixel. Alpha compositing is the process of merging two images with different\
    \ alpha values and producing an image that would give the effect as if one image\
    \ is placed on top of another.\n\n*   *Transformation* *operations*: The vImage\
    \ library also supports pixel transformation functions that do not depend upon\
    \ the value of other pixels. The functions include matrix multiplication and gamma\
    \ correction.\n\n### vDSP – Digital Signal Processing\n\nThe vDSP library is primarily\
    \ focused on Fourier transforms, matrix arithmetic, and vector operations. The\
    \ applications of the vDSP library includes speech processing, audio processing,\
    \ digital image processing, cryptography, and other vector operations such as\
    \ finding the absolute value of a vector, converting between a single precision\
    \ vector and a double precision vector, compressing vector values, and so on.\
    \ vDSP subroutines operate on basic C data types such as float, integer, double,\
    \ short integer, and character.\n\n### BLAS and LAPACK\n\nThe Basic Linear Algebra\
    \ Subprograms (BLAS) and Linear Algebra Package (LAPACK) libraries contain subroutines\
    \ to perform matrix-based linear algebra computations such as eigenvalue problems\
    \ and matrix multiplication. BLAS acts as a base library for LAPACK that performs\
    \ advanced algebraic computations.\n\n### vMathLib\n\nThe vMathLib is a vector-centric\
    \ version of the standard math library libm. The difference between them is that\
    \ vMathLib uses 128-bit hardware vectors to perform mathematical operations.\n\
    \n### vBigNum\n\nThe vBigNum library performs operations such as integer addition,\
    \ substraction, division, and multiplication using 1024-bit integer operands.\n\
    \nTo use the Accelerate libraries in your Xcode project, you will need to add\
    \ the Accelerate header file in your project by adding the following code:\n\n\
    ```\n#include \nOR\nimport Accelerate\n```\n\nYou will also need to add the framework\
    \ to your project from the system frameworks folder:\n\n```\n.../System/Library/Frameworks/Accelerate.framework\n\
    ```\n\n### Note\n\nAccelerate is a complex framework and is not a recommended\
    \ way to begin machine learning in iOS. As a beginner, all you need to know is\
    \ that Core ML, the latest framework for ML, is based on Accelerate and harnesses\
    \ the computational capabilities of the Accelerate framework."
  trans: "\n## Accelerate\n\nAccelerate 是一个框架，最早由苹果公司在 2003 年随 Mac OS X v10.3 Panther\
    \ 引入。它是一个高性能向量加速库的集合，让你可以在应用中执行基于向量的操作，而无需显式使用底层向量指令。你无需关心用户的机器，因为 Accelerate\
    \ 框架被设计为能根据代码运行机器的架构自动调用相应的指令集。图 5-2 展示了 Accelerate 框架所包含的库。\n\n![../images/474993_1_En_5_Chapter/474993_1_En_5_Fig2_HTML.png](img/474993_1_En_5_Fig2_HTML.png)\n\
    \n图 5-2\n\nPanther 中的 Accelerate 框架\n\n### vImage – 图像变换\n\nvImage 库包含用于对图形和图像执行操作的例程。这些例程能充分利用可用的硬件。它们可以执行如下操作：\n\
    \n*   *格式转换*：vImage 库主要支持 Planar8、PlanarF、ARGB8888 和 ARGBFFFF 等图像格式，并支持这些格式之间的图像转换。\n\
    \n*   *卷积*：这是一个术语，指根据像素周围像素的值来修改像素值的过程。卷积可用于实现模糊、锐化、浮雕等图像效果。vImage 库还支持反卷积，这是一个逆转卷积效果的过程。\n\
    \n*   *形态学操作*：这些操作用于修改图像的结构。vImage 库支持两种形态学操作：膨胀（像素尺寸逐渐增大）和腐蚀（像素尺寸逐渐减小）。\n\n*\
    \   *直方图*：图像的直方图用于以图形方式描述图像像素的强度。vImage 库支持创建图像直方图。此外，还可以变换图像，使其像素强度与特定直方图一致。\n\
    \n*   *几何操作*：vImage 库提供了可以对图像进行几何变换的子程序。这些操作包括旋转、翻转、扭曲、镜像、缩放等。\n\n*   *Alpha 合成*：图像中的每个像素都有一个\
    \ alpha 值，用于确定该像素的不透明度。Alpha 合成是将两个具有不同 alpha 值的图像合并，产生一个图像，效果如同将一个图像放置在另一个图像之上。\n\
    \n*   *变换操作*：vImage 库还支持不依赖于其他像素值的像素变换函数。这些函数包括矩阵乘法和伽马校正。\n\n### vDSP – 数字信号处理\n\
    \nvDSP 库主要专注于傅里叶变换、矩阵运算和向量操作。vDSP 库的应用包括语音处理、音频处理、数字图像处理、密码学以及其他向量操作，例如求向量的绝对值、单精度向量与双精度向量之间的转换、压缩向量值等。vDSP\
    \ 子程序操作于基本的 C 数据类型，如 float、integer、double、short integer 和 character。\n\n### BLAS\
    \ 和 LAPACK\n\n基本线性代数子程序（BLAS）和线性代数包（LAPACK）库包含用于执行基于矩阵的线性代数计算的子程序，例如特征值问题和矩阵乘法。BLAS\
    \ 作为 LAPACK 的基础库，用于执行高级代数计算。\n\n### vMathLib\n\nvMathLib 是标准数学库 libm 的以向量为中心的版本。它们之间的区别在于\
    \ vMathLib 使用 128 位硬件向量来执行数学运算。\n\n### vBigNum\n\nvBigNum 库使用 1024 位整数操作数执行整数加法、减法、除法和乘法等运算。\n\
    \n要在你的 Xcode 项目中使用 Accelerate 库，你需要通过添加以下代码将 Accelerate 头文件添加到你的项目中：\n\n```\n\
    #include \n或者\nimport Accelerate\n```\n\n你还需要从系统框架文件夹中将该框架添加到你的项目中：\n\n```\n.../System/Library/Frameworks/Accelerate.framework\n\
    ```\n\n### 注意\n\nAccelerate 是一个复杂的框架，不建议作为在 iOS 中开始机器学习的方式。作为初学者，你只需要知道 Core ML（最新的机器学习框架）是基于\
    \ Accelerate 的，并且利用了 Accelerate 框架的计算能力。\n"
- fmt: '# Metal Performance Shaders


    `MPS` is a framework that was announced by Apple at WWDC 2015. It is a collection
    of optimized, high-performance image processing algorithms for iOS 9. `MPS` uses
    the device GPU for compute-heavy tasks. The functions in the `MPS` framework implement
    most of the common image processing tasks such as blur, convolution, histogram,
    resampling, and so on. These functions act as a black box to developers. The major
    benefit of this is that Apple can modify and improve the framework as per the
    availability of better hardware, while the developers do not need to worry about
    the framework code. Figure [5-3](#474993_1_En_5_Chapter.xhtml#Fig3) shows the
    class hierarchy for the `MPS` framework.


    ![../images/474993_1_En_5_Chapter/474993_1_En_5_Fig3_HTML.png](images/474993_1_En_5_Chapter/474993_1_En_5_Fig3_HTML.png)


    Figure 5-3


    `MPS` framework architecture


    All the classes in the `MPS` framework are derived from a class called `MPSKernel`.
    A kernel in this context refers to a set of weights that are combined with the
    source image to produce an output image. `MPSKernel`, as a class, does nothing
    but create a copy of the kernel and gives it a name. The real job is done by the
    three subclasses of `MPSKernel`: `MPSUnaryImageKernel`, `MPSBinaryImageKernel`,
    and `MPSImageHistogram`.


    A unary image kernel takes in a single texture as an input and produces a single
    output texture. There are several categories of unary operation that can be performed
    using `MPSUnaryImageKernel`. Every operation has its own class that inherits from
    `MPSUnaryImageKernel`. The naming convention for these subclasses is in a fashion
    such that the operation name is prefixed by `MPSImage`. For instance, if the operation
    to be performed is Gaussian Blur, the class name will be `MPSImageGaussianBlur`.
    Following are the operations supported by `MPSUnaryImageKernel`:


    ![../images/474993_1_En_5_Chapter/474993_1_En_5_Fig6_HTML.jpg](images/474993_1_En_5_Chapter/474993_1_En_5_Fig6_HTML.jpg)


    Figure 5-6


    Sobel edge detection using `MPS`


    ![../images/474993_1_En_5_Chapter/474993_1_En_5_Fig5_HTML.jpg](images/474993_1_En_5_Chapter/474993_1_En_5_Fig5_HTML.jpg)


    Figure 5-5


    Threshold to zero using `MPS`


    ![../images/474993_1_En_5_Chapter/474993_1_En_5_Fig4_HTML.jpg](images/474993_1_En_5_Chapter/474993_1_En_5_Fig4_HTML.jpg)


    Figure 5-4


    Gaussian blur using `MPS`


    *   *Convolutional operations*: Box, Tent, GaussianBlur (Figure [5-4](#474993_1_En_5_Chapter.xhtml#Fig4)),
    Sobel (Figure [5-6](#474993_1_En_5_Chapter.xhtml#Fig6)), Convolution (general)

    *   *Thresholding*: ThresholdBinary, ThresholdBinaryInverse, ThresholdToZero (Figure
    [5-5](#474993_1_En_5_Chapter.xhtml#Fig5)), ThresholdToZeroInverse, ThresholdTruncate

    *   *Lanczos resampling*: LanczosScale (down-scale, up-scale, squeeze, stretch)

    *   *Morphological operations*: erode, dilute, min, max

    *   *Sliding neighborhood operations*: Integral, IntegralOfSquares, AreaMax, AreaMin,
    Median, Threshold


    A binary image kernel, unlike unary image kernels, takes in two textures as an
    input to produce a single output texture. Although there is a class called `MPSBinaryImageKernel`
    dedicated for the processing of binary images, there are no concrete subclasses
    inheriting from this class. Hence, we can only assume that this class is for developers
    to inherit from and write some custom code for the binary image operations that
    they want to perform.


    `MPSImageHistogram` is a class that is used to compute the histogram of an image.
    Just like `UnaryImageKernel`, `MPSImageHistogram` also works on single-input texture.
    Typically, the histogram of the image is subsequently passed on to the `MPSImageHistogramEqualization`
    or `MPSImageHistogramSpecification`. The equalization filter allows equalization
    of the color intensities in your image to a uniform set of values (Figure [5-7](#474993_1_En_5_Chapter.xhtml#Fig7)),
    whereas the specification filter is used to modify your image histogram to match
    a histogram that you can specify.


    ![../images/474993_1_En_5_Chapter/474993_1_En_5_Fig7_HTML.jpg](images/474993_1_En_5_Chapter/474993_1_En_5_Fig7_HTML.jpg)


    Figure 5-7


    Histogram equalization using `MPS`


    As an ML beginner, all you need to know is that when you create an image classifier
    model using `Create ML`, or perform inference using `Core ML`, the `MPS` framework
    plays a vital role in the underlying processes.


    ## Summary


    *   A Central Processing Unit (CPU) is used for lightweight applications that
    do not require much computational power, whereas a Graphics Processing Unit (GPU)
    is used for applications that are graphically or mathematically potent and might
    degrade the overall machine performance if processed using a CPU.

    *   Model size, memory, and processing speed are three important factors to consider
    while implementing ML in mobile applications.

    *   The size for an ML model may be as big as 500 megabytes. It is a good practice
    to choose the model based on the computational power of the target machine.

    *   While selecting the ML model for your application, you also need to keep in
    mind that the working memory for computer devices might range from 16 to 32 gigabytes
    but the same for a mobile device might be limited to just 4 megabytes.

    *   `Accelerate` is a framework that was released by Apple in 2003 to provide
    libraries for vector computations, signal processing, and algebraic computations.

    *   The `Accelerate` framework comprises libraries such as `vImage`, `vDSP`, `BLAS`,
    `LAPACK`, `vMathLib`, and `vBigNum`.

    *   Metal Performance Shaders (`MPS`) is a framework that was released by Apple
    in 2015. It is a collection of optimized, high-performance image processing algorithms
    for iOS 9 that uses the device GPU for compute-heavy tasks.

    *   `MPS` provides classes for image processing tasks such as convolution, thresholding,
    resampling, morphological operations, histogram generation, equalization, and
    so on.

    *   Apple’s latest ML framework, `Core ML`, is based on both `Accelerate` and
    `MPS`.


    ### Index


    #### A


    `Accelerate` framework, `BLAS` and `LAPACK` library, libraries, low-level vector
    instructions, `vBigNum` library, `vDSP` library, `vImage` library, `vMathLib`,
    Apple’s ML framework, Artificial neural networks (ANNs), Assembling data


    #### B


    Basic Linear Algebra Subprograms (`BLAS`), Binary image kernel


    #### C


    Central Processing Unit (CPU), Comma-separated values (CSV), Core Machine Learning
    (`Core ML`), applications, cloud services, components, domain-specific frameworks,
    `Inceptionv3`, photos application, prediction, prediction method, pretrained models,
    integrate, updated interface, `viewWillAppear()` method, `Core ML`, conversion,
    `caffe` model, execution, `caffe` model, scratch, tools, Xcode, `Create ML` framework,
    custom ML model, custom model creation, data types, trained into model, end-to-end
    ML, Swift, image classification (see Image classification model), regression model
    (see Regression model), testing image classifier, text classification (see Text
    classification model), training image classifier, training regression model, training
    text classifier, CSV data, Custom model, Apple-provided `Core ML` models, assistant
    editor, build and run application, button click, `CGContext`, controllers, core
    ML model, dog breed predictor application, interface, image buffer, `imagePickerControllerDidCancel()`
    method, `imagePickerController()` method, information property list, life cycle,
    ML tasks, model class, outlets and actions, `pickImageBtnClick()` method, pixel
    buffer, task, training and evaluating (see Training and evaluating, custom model),
    `UIImagePickerController`, `viewWillAppear()` method, Xcode, Xcode folder picker,
