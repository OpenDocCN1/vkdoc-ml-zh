    ### 回归模型


    既然你已经学会了如何处理图像和文本，你可能还想基于表格数据实现一些机器学习任务。当你需要根据多个参数进行预测时，通常会用到这类数据。例如，可以根据社区、房屋总面积、卧室和浴室数量、车库类型、房屋楼层数等参数来预测房价。接下来，让我们学习如何使用
    Create ML 完成这项任务。


    首先，我们需要准备表格格式的训练数据。我收集了一些表格数据，其中包含了美国不同社区房屋的价格。图 4-29 展示了数据的样子。


