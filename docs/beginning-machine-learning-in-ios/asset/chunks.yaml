    ## Converting a Custom Model into Core ML


    If you are using Turi Create to generate a model from scratch, you do not need
    to worry about conversion because it already creates a model in the Core ML format;
    but if you are using other tools like Caffe, TensorFlow, or Keras, you might be
    wondering how to convert models built using those tools to the Core ML format.
    To do that, Apple has introduced Core ML Tools alongside Core ML. It is an open-source
    Python package that takes ML models in a variety of formats and converts them
    into the Core ML format.


    Let us learn how to use Core ML Tools to convert models into the Core ML format.
    To do so, you will need Python installed on your machine. If you do not have it,
    please install the recent version of Python from [`https://www.python.org`](https://www.python.org).
    We will take a Caffe model and convert it into the Core ML format. To do so, consider
    the following steps:


    *Step 1*: Open the Terminal application on your Mac and install Core ML Tools
    using the Python package manager. To do so, type in the following command:


    ```

    pip install CoreMLtools

    ```


    *Step 2*: Open Xcode; select **File ➤ New ➤ File** in the menu (Figure [3-15](#474993_1_En_3_Chapter.xhtml#Fig15)).


    ![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig15_HTML.jpg](images/474993_1_En_3_Chapter/474993_1_En_3_Fig15_HTML.jpg)


    **Figure 3-15** New file in Xcode


    *Step 3*: Select Blank file from template selection menu (Figure [3-16](#474993_1_En_3_Chapter.xhtml#Fig16)).


    ![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig16_HTML.jpg](images/474993_1_En_3_Chapter/474993_1_En_3_Fig16_HTML.jpg)


    **Figure 3-16** Xcode template selection


    *Step 4*: Name the file `MyConverter.py`


    *Step 5*: Save it to desktop.


    *Step 6*: Download the Caffe model that you want to convert to the Core ML format.
    Note that when you download a Caffe model, you will have three different files:


    *   `modelName.caffemodel` – The model file

    *   `deploy.prototxt` – The file that contains the network structure

    *   `labels.txt` – The file that contains the output values for the prediction


    *Step 7*: Open the `MyConverter.py` file and add the following code to import
    Core MLtools:


    ```

    import CoreMLtools

    ```


    *Step 8*: Our Caffe model is defined by two files: `.caffemodel` and `.prototxt`.
    So, let us add it into the code by adding the following lines of code:


    ```

    caffe_model = (''oxford102.caffemodel'', ''deploy.prototxt'')

    ```


    *Step 9*: Next, we will define our class labels file by adding the following code:


    ```

    labels = ''class_labels.txt''

    ```


    *Step 10*: Now to convert the Caffe model into the Core ML format, add the following
    line of code:


    ```

    CoreML_model = CoreMLtools.converters.caffe.convert(caffe_model, class_labels
    = labels)

    ```


    *Step 11*: Finally, we can save the converted model by adding the following code
    to our file:


    ```

    CoreML_model.save(''MyCustomModel.mlmodel'')

    ```


    Your final code should be as in Figure [3-17](#474993_1_En_3_Chapter.xhtml#Fig17).


    ![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig17_HTML.jpg](images/474993_1_En_3_Chapter/474993_1_En_3_Fig17_HTML.jpg)


    **Figure 3-17** Converting from Caffe to Core ML (code)


    *Step 12*: To execute the code, open the Terminal app on your Mac, change the
    current directory to the location of your Python file, and type the following
    command (see Figure [3-18](#474993_1_En_3_Chapter.xhtml#Fig18) for output).


    ![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig18_HTML.jpg](images/474993_1_En_3_Chapter/474993_1_En_3_Fig18_HTML.jpg)


    **Figure 3-18** Converting from Caffe to Core ML (execution)


