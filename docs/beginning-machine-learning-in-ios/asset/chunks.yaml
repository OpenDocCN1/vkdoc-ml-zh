- fmt: '# Using a Custom Model in Your Application


    Once a model is created or converted to the Core ML format, you can use it in
    your applications in the same way as you would use one of the Apple-provided Core
    ML models. Let us use in our application the model that we created using Turi
    Create to predict the breed of the dog, given its image. For this, we will create
    an application using Xcode 10 that will allow users to pick an image of a dog
    from the photo library of their device. The application will then display the
    image along with the breed of the dog that is displayed in the image. Follow these
    steps:


    *Step 1*: Launch Xcode 10. It should display a welcome dialog. From here, choose
    “Create a new Xcode project” to start a new project (Figure [3-20](#474993_1_En_3_Chapter.xhtml#Fig20)).


    ![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig20_HTML.jpg](images/474993_1_En_3_Chapter/474993_1_En_3_Fig20_HTML.jpg)


    Figure 3-20


    Welcome to Xcode


    *Step 2*: Xcode shows you various devices and project templates for your application
    (Figure [3-21](#474993_1_En_3_Chapter.xhtml#Fig21)). Choose your target device
    and appropriate template (Single View Application). Then click “Next.”


    ![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig21_HTML.jpg](images/474993_1_En_3_Chapter/474993_1_En_3_Fig21_HTML.jpg)


    Figure 3-21


    Xcode template selection


    *Step 3*: This brings you to another screen to fill in all the necessary options
    for your project (Figure [3-22](#474993_1_En_3_Chapter.xhtml#Fig22)). The options
    include Product Name, Organization Name, Organization Identifier, Class Prefix,
    Devices, and so on. Fill in the details and go to the next step.


    ![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig22_HTML.jpg](images/474993_1_En_3_Chapter/474993_1_En_3_Fig22_HTML.jpg)


    Figure 3-22


    Xcode project options


    *Step 4*: Xcode then asks you where you want to save your project (Figure [3-23](#474993_1_En_3_Chapter.xhtml#Fig23)).
    Pick any folder (e.g., Desktop) on your Mac and click “Create.”


    ![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig23_HTML.jpg](images/474993_1_En_3_Chapter/474993_1_En_3_Fig23_HTML.jpg)


    Figure 3-23


    Xcode folder picker


    *Step 5*: As you confirm, Xcode automatically creates your project based on all
    the options you provided. From the navigator pane, select the `"Main.storyboard"`
    file to open the interface builder for your application. See Figure [3-24](#474993_1_En_3_Chapter.xhtml#Fig24)
    for reference.


    ![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig24_HTML.jpg](images/474993_1_En_3_Chapter/474993_1_En_3_Fig24_HTML.jpg)


    Figure 3-24


    Xcode interface builder


    *Step 6*: Add a Button followed by an Image View to the interface by dragging
    the controls from the object library in the utility area to the interface builder.
    You can change the color and text of the button from the object attributes in
    the utility area. Also add a label to the application interface to display the
    prediction for the selected image. See Figure [3-25](#474993_1_En_3_Chapter.xhtml#Fig25)
    for reference.


    ![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig25_HTML.jpg](images/474993_1_En_3_Chapter/474993_1_En_3_Fig25_HTML.jpg)


    Figure 3-25


    Dog breed predictor application interface


    *Step 7*: Open the assistant editor by clicking its icon on the right end of the
    toolbar. Load the file called `"ViewController.swift"` in the assistant editor.
    You’ll simultaneously see the interface builder on the left part of the window
    and your code (`''ViewController.swift''`) on the right part of the window. See
    Figure [3-26](#474993_1_En_3_Chapter.xhtml#Fig26) for reference.


    ![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig26_HTML.jpg](images/474993_1_En_3_Chapter/474993_1_En_3_Fig26_HTML.jpg)


    Figure 3-26


    Assistant editor


    *Step 8*: To connect interface elements to the code, we need to create outlets
    and actions. Create an outlet for Button, ImageView, and Label. Also create an
    action for the button. To do so, control and drag from the Button/Image View/Label
    to the code (`"ViewController.swift"`). If you are successful in creating outlets
    and actions for the UI elements, the following code will be added to your `ViewController`
    class:


    ```

    @IBOutlet weak var predictionText: UILabel!

    @IBOutlet weak var imageView: UIImageView!

    @IBOutlet weak var btn: UIButton!

    @IBAction func btnClick(_ sender: Any) {

    }

    ```


    *Step 9*: Now let us add the code that will handle the button click. First, since
    we need the user to interact with the photo library, we must conform to the `UIImagePickerControllerDelegate`
    protocol as well as `UINavigationControllerDelegate` protocol. Add both the controllers
    to you class definition in the `ViewControllor.swift` file:


    ```

    class ViewController: UIViewController, UIImagePickerControllerDelegate, UINavigationControllerDelegate
    {

    //code

    }

    ```


    *Step 10*: When the user clicks the button, we need to create an instance of `UIImagePickerController`
    and set its delegate to our current class. We also need to specify the source
    for the image picker as the photo library. Once the picker is created, we need
    to present it modally using the `present` method. To do so, add the following
    code to the `pickImageBtnClick` method in the `ViewControllor.swift` file:


    ```

    @IBAction func btnClick(_ sender: Any) {

    let imagePicker = UIImagePickerController()

    imagePicker.delegate = self

    imagePicker.allowsEditing = false

    imagePicker.sourceType = .photoLibrary

    present(imagePicker, animated: true, completion: nil)

    }

    ```


    *Step 11*: Since we are confirming to the delegate for the image picker, we need
    to implement two delegate methods: `imagePickerController` and `imagePickerControllerDidCancel`.
    The `imagePickerController` method is called when the user is finished selecting
    the image from the library. Hence, we will use this method to set the selected
    image in the Image View of our application. The `imagePickerControllerDidCancel`
    method is called when the user cancels the image picker. Hence, in this method,
    we will simply dismiss the picker. Add the following code to the `ViewController`
    class in the `ViewControllor.swift` file:


    ```

    func imagePickerController(_ picker: UIImagePickerController, didFinishPickingMediaWithInfo
    info: [UIImagePickerController.InfoKey : Any]) {

    let pickedImage = info[.originalImage]  as! UIImage

    imageView.image = pickedImage

    self.dismiss(animated: true, completion: nil)

    }

    func imagePickerControllerDidCancel(_ picker: UIImagePickerController) {

    self.dismiss(animated: true, completion: nil)

    }

    ```


    *Step 12*: Since our application needs to access the photo library of the user’s
    device, we need to ask the user to grant access for the same. Otherwise our application
    might terminate unexpectedly. To avoid that, we need to add the following property
    in the `"Info.plist"` file (Figure [3-27](#474993_1_En_3_Chapter.xhtml#Fig27))
    of our application:


    *Key*: Privacy – Photo Library Usage Description


    *Value*: (PRODUCT_NAME) photo use


    ![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig27_HTML.jpg](images/474993_1_En_3_Chapter/474993_1_En_3_Fig27_HTML.jpg)


    Figure 3-27


    Information property list


    *Step 13*: Now that we have created the application interface, let us add our
    custom model to the project. To do so, drag and drop the model file under your
    project folder in the Xcode project navigator. This will add the Core ML model
    in your application.


    *Step 14*: Select the model file from the navigator and you will notice that the
    Xcode automatically recognizes the file as an ML model. It displays information
    about the model such as type of the model (which in our case is Neural Network
    Classifier), the size of the model, model description, and so on. See Figure [3-28](#474993_1_En_3_Chapter.xhtml#Fig28)
    for reference.'
  raw: '## Using a Custom Model in Your Application


    Once a model is created or converted to the Core ML format, you can use it in
    your applications in the same way as you would use one of the Apple-provided Core
    ML models. Let us use in our application the model that we created using Turi
    Create to predict the breed of the dog, given its image. For this, we will create
    an application using Xcode 10 that will allow users to pick an image of a dog
    from the photo library of their device. The application will then display the
    image along with the breed of the dog that is displayed in the image. Follow these
    steps:


    *Step 1*: Launch Xcode 10\. It should display a welcome dialog. From here, choose
    “Create a new Xcode project” to start a new project (Figure [3-20](#474993_1_En_3_Chapter.xhtml#Fig20)).


    ![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig20_HTML.jpg](images/474993_1_En_3_Chapter/474993_1_En_3_Fig20_HTML.jpg)


    Figure 3-20


    Welcome to Xcode


    *Step 2*: Xcode shows you various devices and project templates for your application
    (Figure [3-21](#474993_1_En_3_Chapter.xhtml#Fig21)). Choose your target device
    and appropriate template (Single View Application). Then click “Next.”


    ![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig21_HTML.jpg](images/474993_1_En_3_Chapter/474993_1_En_3_Fig21_HTML.jpg)


    Figure 3-21


    Xcode template selection


    *Step 3*: This brings you to another screen to fill in all the necessary options
    for your project (Figure [3-22](#474993_1_En_3_Chapter.xhtml#Fig22)). The options
    include Product Name, Organization Name, Organization Identifier, Class Prefix,
    Devices , and so on. Fill in the details and go to the next step.


    ![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig22_HTML.jpg](images/474993_1_En_3_Chapter/474993_1_En_3_Fig22_HTML.jpg)


    Figure 3-22


    Xcode project options


    *Step 4*: Xcode then asks you where you want to save your project (Figure [3-23](#474993_1_En_3_Chapter.xhtml#Fig23)).
    Pick any folder (e.g., Desktop) on your Mac and click “Create.”


    ![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig23_HTML.jpg](images/474993_1_En_3_Chapter/474993_1_En_3_Fig23_HTML.jpg)


    Figure 3-23


    Xcode folder picker


    *Step 5*: As you confirm, Xcode automatically creates your project based on all
    the options you provided. From the navigator pane, select the **“Main.storyboard”**
    file to open the interface builder for your application. See Figure [3-24](#474993_1_En_3_Chapter.xhtml#Fig24)
    for reference.


    ![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig24_HTML.jpg](images/474993_1_En_3_Chapter/474993_1_En_3_Fig24_HTML.jpg)


    Figure 3-24


    Xcode interface builder


    *Step 6*: Add a Button followed by an Image View to the interface by dragging
    the controls from the object library in the utility area to the interface builder.
    You can change the color and text of the button from the object attributes in
    the utility area. Also add a label to the application interface to display the
    prediction for the selected image. See Figure [3-25](#474993_1_En_3_Chapter.xhtml#Fig25)
    for reference.


    ![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig25_HTML.jpg](images/474993_1_En_3_Chapter/474993_1_En_3_Fig25_HTML.jpg)


    Figure 3-25


    Dog breed predictor application interface


    *Step 7*: Open the assistant editor by clicking its icon on the right end of the
    toolbar. Load the file called **“ViewController.swift”** in the assistant editor.
    You’ll simultaneously see the interface builder on the left part of the window
    and your code **(‘ViewController.swift’)** on the right part of the window. See
    Figure [3-26](#474993_1_En_3_Chapter.xhtml#Fig26) for reference.


    ![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig26_HTML.jpg](images/474993_1_En_3_Chapter/474993_1_En_3_Fig26_HTML.jpg)


    Figure 3-26


    Assistant editor


    *Step 8*: To connect interface elements to the code, we need to create outlets
    and actions. Create an outlet for Button, ImageView, and Label. Also create an
    action for the button. To do so, control and drag from the Button/Image View/Label
    to the code (“ViewController.swift”). If you are successful in creating outlets
    and actions for the UI elements, the following code will be added to your ViewController
    class:


    ```

    @IBOutlet weak var predictionText: UILabel!

    @IBOutlet weak var imageView: UIImageView!

    @IBOutlet weak var btn: UIButton!

    @IBAction func btnClick(_ sender: Any) {

    }

    ```


    *Step 9*: Now let us add the code that will handle the button click. First, since
    we need the user to interact with the photo library, we must conform to the UIImagePickerControllerDelegate
    protocol as well as UINavigationControllerDelegate protocol. Add both the controllers
    to you class definition in the ViewControllor.swift file:


    ```

    class ViewController: UIViewController, UIImagePickerControllerDelegate, UINavigationControllerDelegate
    {

    //code

    }

    ```


    *Step 10*: When the user clicks the button, we need to create an instance of UIImagePickerController
    and set its delegate to our current class. We also need to specify the source
    for the image picker as the photo library. Once the picker is created, we need
    to present it modally using the present method. To do so, add the following code
    to the pickImageBtnClick method in the ViewControllor.swift file:


    ```

    @IBAction func btnClick(_ sender: Any) {

    let imagePicker = UIImagePickerController()

    imagePicker.delegate = self

    imagePicker.allowsEditing = false

    imagePicker.sourceType = .photoLibrary

    present(imagePicker, animated: true, completion: nil)

    }

    ```


    *Step 11*: Since we are confirming to the delegate for the image picker, we need
    to implement two delegate methods: imagePickerController and imagePickerControllerDidCancel.
    The imagePickerController method is called when the user is finished selecting
    the image from the library. Hence, we will use this method to set the selected
    image in the Image View of our application. The imagePickerControllerDidCancel
    method is called when the user cancels the image picker. Hence, in this method,
    we will simply dismiss the picker. Add the following code to the ViewController
    class in the ViewControllor.swift file:


    ```

    func imagePickerController(_ picker: UIImagePickerController, didFinishPickingMediaWithInfo
    info: [UIImagePickerController.InfoKey : Any]) {

    let pickedImage = info[.originalImage]  as! UIImage

    imageView.image = pickedImage

    self.dismiss(animated: true, completion: nil)

    }

    func imagePickerControllerDidCancel(_ picker: UIImagePickerController) {

    self.dismiss(animated: true, completion: nil)

    }

    ```


    *Step 12*: Since our application needs to access the photo library of the user’s
    device, we need to ask the user to grant access for the same. Otherwise our application
    might terminate unexpectedly. To avoid that, we need to add the following property
    in the **“Info.plist”** file (Figure [3-27](#474993_1_En_3_Chapter.xhtml#Fig27))
    of our application:


    *Key*: Privacy – Photo Library Usage Description


    *Value*: (PRODUCT_NAME) photo use


    ![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig27_HTML.jpg](images/474993_1_En_3_Chapter/474993_1_En_3_Fig27_HTML.jpg)


    Figure 3-27


    Information property list


    *Step 13*: Now that we have created the application interface, let us add our
    custom model to the project. To do so, drag and drop the model file under your
    project folder in the Xcode project navigator. This will add the Core ML model
    in your application.


    *Step 14*: Select the model file from the navigator and you will notice that the
    Xcode automatically recognizes the file as an ML model. It displays information
    about the model such as type of the model (which in our case is Neural Network
    Classifier), the size of the model, model description, and so on. See Figure [3-28](#474993_1_En_3_Chapter.xhtml#Fig28)
    for reference.'
  trans: '

    ## 在应用中使用自定义模型


    一旦模型被创建或转换为 Core ML 格式，你就可以像使用苹果提供的 Core ML 模型一样，在应用中使用它。现在，让我们在应用中使用之前通过 Turi
    Create 创建的模型，该模型可以根据狗的图像预测其品种。为此，我们将使用 Xcode 10 创建一个应用，允许用户从设备的照片库中选取一张狗的图像。然后，应用将显示该图像以及图像中狗的品种。请按照以下步骤操作：


    *步骤 1*：启动 Xcode 10。它应该会显示一个欢迎对话框。在此处，选择“Create a new Xcode project”以开始一个新项目（图
    3-20）。


    ![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig20_HTML.jpg](img/474993_1_En_3_Fig20_HTML.jpg)


    图 3-20


    欢迎使用 Xcode


    *步骤 2*：Xcode 会显示各种设备和项目模板供你选择（图 3-21）。选择你的目标设备和合适的模板（Single View Application）。然后点击“Next”。


    ![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig21_HTML.jpg](img/474993_1_En_3_Fig21_HTML.jpg)


    图 3-21


    Xcode 模板选择


    *步骤 3*：这将进入另一个屏幕，用于填写项目的所有必要选项（图 3-22）。这些选项包括 Product Name、Organization Name、Organization
    Identifier、Class Prefix、Devices 等。填写详细信息并进入下一步。


    ![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig22_HTML.jpg](img/474993_1_En_3_Fig22_HTML.jpg)


    图 3-22


    Xcode 项目选项


    *步骤 4*：然后 Xcode 会询问你希望将项目保存在哪里（图 3-23）。在你的 Mac 上选择一个文件夹（例如桌面），然后点击“Create”。


    ![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig23_HTML.jpg](img/474993_1_En_3_Fig23_HTML.jpg)


    图 3-23


    Xcode 文件夹选择器


    *步骤 5*：确认后，Xcode 会根据你提供的所有选项自动创建项目。从导航窗格中选择 **“Main.storyboard”** 文件，打开应用的界面构建器。请参考图
    3-24。


    ![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig24_HTML.jpg](img/474993_1_En_3_Fig24_HTML.jpg)


    图 3-24


    Xcode 界面构建器


    *步骤 6*：通过从工具区域的控件库中将控件拖拽到界面构建器，依次添加一个 Button 和一个 Image View。你可以从工具区域的对象属性中更改按钮的颜色和文本。另外，在应用界面中添加一个标签，用于显示所选图像的预测结果。请参考图
    3-25。


    ![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig25_HTML.jpg](img/474993_1_En_3_Fig25_HTML.jpg)


    图 3-25


    狗品种预测器应用界面


    *步骤 7*：点击工具栏右侧的图标打开助理编辑器。在助理编辑器中加载名为 **“ViewController.swift”** 的文件。你将同时看到窗口左侧的界面构建器和右侧的代码（**‘ViewController.swift’**）。请参考图
    3-26。


    ![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig26_HTML.jpg](img/474993_1_En_3_Fig26_HTML.jpg)


    图 3-26


    助理编辑器


    *步骤 8*：要将界面元素连接到代码，我们需要创建 Outlet 和 Action。为 Button、ImageView 和 Label 创建 Outlet。同时为按钮创建一个
    Action。为此，按住 Control 键并从 Button/Image View/Label 拖拽到代码（“ViewController.swift”）中。如果成功为
    UI 元素创建了 Outlet 和 Action，以下代码将被添加到你的 ViewController 类中：


    ```

    @IBOutlet weak var predictionText: UILabel!

    @IBOutlet weak var imageView: UIImageView!

    @IBOutlet weak var btn: UIButton!

    @IBAction func btnClick(_ sender: Any) {

    }

    ```


    *步骤 9*：现在让我们添加处理按钮点击的代码。首先，由于我们需要用户与照片库交互，我们必须遵循 UIImagePickerControllerDelegate
    协议以及 UINavigationControllerDelegate 协议。将这两个控制器添加到 ViewControllor.swift 文件的类定义中：


    ```

    class ViewController: UIViewController, UIImagePickerControllerDelegate, UINavigationControllerDelegate
    {

    //code

    }

    ```


    *步骤 10*：当用户点击按钮时，我们需要创建一个 UIImagePickerController 实例，并将其委托设置为当前类。我们还需要将图像选择器的源指定为照片库。创建选择器后，我们需要使用
    present 方法以模态方式呈现它。为此，将以下代码添加到 ViewControllor.swift 文件的 pickImageBtnClick 方法中：


    ```

    @IBAction func btnClick(_ sender: Any) {

    let imagePicker = UIImagePickerController()

    imagePicker.delegate = self

    imagePicker.allowsEditing = false

    imagePicker.sourceType = .photoLibrary

    present(imagePicker, animated: true, completion: nil)

    }

    ```


    *步骤 11*：由于我们遵循了图像选择器的委托，我们需要实现两个委托方法：imagePickerController 和 imagePickerControllerDidCancel。当用户完成从库中选择图像时，会调用
    imagePickerController 方法。因此，我们将使用此方法在应用的 Image View 中设置所选图像。当用户取消图像选择器时，会调用 imagePickerControllerDidCancel
    方法。因此，在此方法中，我们只需关闭选择器。将以下代码添加到 ViewControllor.swift 文件的 ViewController 类中：


    ```

    func imagePickerController(_ picker: UIImagePickerController, didFinishPickingMediaWithInfo
    info: [UIImagePickerController.InfoKey : Any]) {

    let pickedImage = info[.originalImage]  as! UIImage

    imageView.image = pickedImage

    self.dismiss(animated: true, completion: nil)

    }

    func imagePickerControllerDidCancel(_ picker: UIImagePickerController) {

    self.dismiss(animated: true, completion: nil)

    }

    ```


    *步骤 12*：由于我们的应用需要访问用户设备的照片库，我们需要请求用户授予访问权限。否则，我们的应用可能会意外终止。为避免这种情况，我们需要在应用的 **“Info.plist”**
    文件中添加以下属性（图 3-27）：


    *Key*: Privacy – Photo Library Usage Description


    *Value*: (PRODUCT_NAME) photo use


    ![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig27_HTML.jpg](img/474993_1_En_3_Fig27_HTML.jpg)


    图 3-27


    信息属性列表


    *步骤 13*：现在我们已经创建了应用界面，让我们将自定义模型添加到项目中。为此，将模型文件拖拽到 Xcode 项目导航器中的项目文件夹下。这会将 Core
    ML 模型添加到你的应用中。


    *步骤 14*：从导航器中选择模型文件，你会注意到 Xcode 会自动将该文件识别为 ML 模型。它会显示模型的相关信息，例如模型类型（在我们的例子中是 Neural
    Network Classifier）、模型大小、模型描述等。请参考图 3-28。

    '
- fmt: "![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig28_HTML.jpg](images/474993_1_En_3_Chapter/474993_1_En_3_Fig28_HTML.jpg)\n\
    \n**Figure 3-28** Custom Core ML model (`Dog_Breed_Predictor`)\n\nIt also displays\
    \ the `Model Class`, which is automatically generated from the ML model and can\
    \ be directly used in our application. Click the arrow next to the class name\
    \ and you will be able to see the implementation code of the model class.\n\n\
    Other important information that the Xcode displays is the `Model Evaluation Parameters`.\
    \ This is the information about the input that the model takes in and the output\
    \ that it returns. In our case, the model takes in a colored image of size 227×227\
    \ as an input and it returns a string as output.\n\n**Step 15**: Now let us use\
    \ the model class in our application in order to make predictions. Go to the `ViewController.swift`\
    \ file and import the Core ML framework in the very beginning.\n\n```\nimport\
    \ CoreML\n```\n\n**Step 16**: Declare a model variable in the `ViewController`\
    \ class that will represent the Core ML model.\n\n```\nvar model:dogBreed!\n```\n\
    \n**Step 17**: Override the `viewWillAppear()` method of the `ViewController`\
    \ class and initialize the model in that method.\n\n```\noverride func viewWillAppear(_\
    \ animated: Bool) {\nmodel = dogBreed()\n}\n```\n\n**Step 18**: The input that\
    \ our model takes in is an image of size 227×227. Thus, we will need to resize\
    \ the image after the user is done selecting the image. We will write the code\
    \ for this in the delegate method `imagePickerController()`. The following code\
    \ will do the job for us:\n\n> **Note**: The numbering in the following lines\
    \ of code is just added for the explanation that follows, and the numbers are\
    \ not a part of the code.\n\n```\n//resize image\n1.  UIGraphicsBeginImageContextWithOptions\
    \ (CGSize(width: 277, height: 277), true, 2.0)\n2.  pickedImage.draw(in: CGRect(x:\
    \ 0, y: 0, width: 277, height: 277))\n3.  let newImage = UIGraphicsGetImageFromCurrentImageContext()!\n\
    4.  UIGraphicsEndImageContext()\n5.  let attrs = [kCVPixelBufferCGImageCompatibilityKey:\
    \ kCFBooleanTrue, kCVPixelBufferCGBitmapContextCompatibilityKey: kCFBooleanTrue]\
    \ as CFDictionary\n6.  var pixelBuffer : CVPixelBuffer?\n7.  let status = CVPixelBufferCreate(kCFAllocatorDefault,\
    \ Int(newImage.size.width), Int(newImage.size.height), kCVPixelFormatType_32ARGB,\
    \ attrs, &pixelBuffer)\n8.  guard (status == kCVReturnSuccess) else {\n9.    \
    \ return\n10.  }\n11.  CVPixelBufferLockBaseAddress(pixelBuffer!, CVPixelBufferLockFlags(rawValue:\
    \ 0))\n12.  let pixelData = CVPixelBufferGetBaseAddress(pixelBuffer!)\n13.  let\
    \ rgbColorSpace = CGColorSpaceCreateDeviceRGB()\n14.  let context = CGContext(data:\
    \ pixelData, width: Int(newImage.size.width), height: Int(newImage.size.height),\
    \ bitsPerComponent: 8, bytesPerRow: CVPixelBufferGetBytesPerRow(pixelBuffer!),\
    \ space: rgbColorSpace, bitmapInfo: CGImageAlphaInfo.noneSkipFirst.rawValue)\n\
    15.  context?.translateBy(x: 0, y: newImage.size.height)\n16.  context?.scaleBy(x:\
    \ 1.0, y: -1.0)\n17.  UIGraphicsPushContext(context!)\n18.  newImage.draw(in:\
    \ CGRect(x: 0, y: 0, width: newImage.size.width, height: newImage.size.height))\n\
    19.  UIGraphicsPopContext()\n20.  CVPixelBufferUnlockBaseAddress(pixelBuffer!,\
    \ CVPixelBufferLockFlags(rawValue: 0))\n```\n\nNow, let us understand what is\
    \ happening in the preceding code. Since our model accepts an input image of size\
    \ 227×227, lines 1-4 convert the selected image to that size and assign it to\
    \ a new variable called `newImage`.\n\nIt is important to know that the model\
    \ accepts an input image in the form of pixels. Hence, lines 5-10 store the `newImage`\
    \ in the form of a pixel buffer, which basically holds the image in the form of\
    \ pixels in the memory. This buffer will be supplied as an input for prediction.\n\
    \nThen, all the pixels present in the image are converted in to device dependent\
    \ RGB color space. Lines 11-13 do that. In line 14, we store the pixel data in\
    \ `CGContext` so that we can easily modify some properties of the image pixels.\
    \ We then scale the image as per our requirement in lines 15-16. Lines 17-20 update\
    \ the final image buffer.\n\nNote that it’s okay if you do not understand most\
    \ parts of this code. The only thing you need to know is that we took the picture\
    \ that the user selected from the photo library and converted it into a form that\
    \ the model accepts for prediction.\n\n**Step 19**: Finally, it’s time to call\
    \ the prediction method of the model that will do the image prediction for us.\
    \ Add the following code in the delegate method `imagePickerController()` right\
    \ after the image resizing code.\n\n```\n//predict image label\nguard let prediction\
    \ = try? model.prediction(image: pixelBuffer!) else {\npredictionText.text = \"\
    Can't Predict!\"\nreturn\n}\npredictionText.text = \"Dog Breed:  \\(prediction.dogBreed).\"\
    \n```\n\nThe prediction method is supplied with the pixel buffer as a parameter.\
    \ If the prediction is successful, the method returns an object that gives us\
    \ the output label. We set this output label text to the classifier label that\
    \ we added to the interface earlier. If the prediction is not successful, we manually\
    \ set the classifier label text to let the user know that the model was unable\
    \ to predict the label for the selected image.\n\n**Step 20**: It is finally time\
    \ to build and run the application. Let us find out how well our first ML application\
    \ does. Figures [3-29](#474993_1_En_3_Chapter.xhtml#Fig29) to Figure [3-33](#474993_1_En_3_Chapter.xhtml#Fig33)\
    \ show different screens that you should see while playing around with your application.\n\
    \n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig33_HTML.jpg](images/474993_1_En_3_Chapter/474993_1_En_3_Fig33_HTML.jpg)\n\
    \n**Figure 3-33** Dog breed prediction (E)\n\n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig32_HTML.jpg](images/474993_1_En_3_Chapter/474993_1_En_3_Fig32_HTML.jpg)\n\
    \n**Figure 3-32** Dog breed prediction (D)\n\n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig31_HTML.jpg](images/474993_1_En_3_Chapter/474993_1_En_3_Fig31_HTML.jpg)\n\
    \n**Figure 3-31** Dog breed prediction (C)\n\n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig30_HTML.jpg](images/474993_1_En_3_Chapter/474993_1_En_3_Fig30_HTML.jpg)\n\
    \n**Figure 3-30** Dog breed prediction (B)\n\n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig29_HTML.jpg](images/474993_1_En_3_Chapter/474993_1_En_3_Fig29_HTML.jpg)\n\
    \n**Figure 3-29** Dog breed prediction (A)\n\n## Summary\n\n*   There is no single\
    \ model that can be used to perform all the intelligent tasks. Hence, we need\
    \ different custom models for different tasks.\n*   The custom machine learning\
    \ model can be created in five simple steps:\n    *   Define the problem\n   \
    \ *   Collect data\n    *   Train the learning algorithm\n    *   Evaluate the\
    \ learning algorithm\n    *   Build the model\n*   Apple introduced a Python-based\
    \ package called `Turi Create` that helps us in creating custom ML models directly\
    \ from the dataset.\n*   `Turi Create` uses a technique called transfer learning,\
    \ that is, we can train our model on top of an already existing model. The learning\
    \ of the existing model is transferred to our model; therefore we only need to\
    \ train the last few layers of our model. This significantly reduces the training\
    \ time as well as the size of our model.\n*   Apple also introduced `Core ML Tools`,\
    \ which is a Python package that can be used to convert models from various formats\
    \ to the Core ML format using very few lines of code.\n*   Once you convert an\
    \ ML model to the Core ML format, it can be easily used in your application, just\
    \ like any of the Apple-provided models."
  raw: "![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig28_HTML.jpg](images/474993_1_En_3_Chapter/474993_1_En_3_Fig28_HTML.jpg)\n\
    \nFigure 3-28\n\nCustom Core ML model (Dog_Breed_Predictor)\n\nIt also displays\
    \ the Model Class, which is automatically generated from the ML model and can\
    \ be directly used in our application. Click the arrow next to the class name\
    \ and you will be able to see the implementation code of the model class.\n\n\
    Other important information that the Xcode displays is the Model Evaluation Parameters.\
    \ This is the information about the input that the model takes in and the output\
    \ that it returns. In our case, the model takes in a colored image of size 227×227\
    \ as an input and it returns a string as output.\n\n*Step 15*: Now let us use\
    \ the model class in our application in order to make predictions. Go to the ViewController.swift\
    \ file and import the Core ML framework in the very beginning.\n\n```\nimport\
    \ CoreML\n```\n\n*Step 16*: Declare a model variable in the ViewController class\
    \ that will represent the Core ML model.\n\n```\nvar model:dogBreed!\n```\n\n\
    *Step 17*: Override the viewWillAppear() method of the ViewController class and\
    \ initialize the model in that method.\n\n```\noverride func viewWillAppear(_\
    \ animated: Bool) {\nmodel = dogBreed()\n}\n```\n\n*Step 18*: The input that our\
    \ model takes in is an image of size 227×227\\. Thus, we will need to resize the\
    \ image after the user is done selecting the image. We will write the code for\
    \ this in the delegate method imagePickerController(). The following code will\
    \ do the job for us:\n\n### Note\n\nThe numbering in the following lines of code\
    \ is just added for the explanation that follows, and the numbers are not a part\
    \ of the code.\n\n```\n//resize image\n1\\.  UIGraphicsBeginImageContextWithOptions\
    \ (CGSize(width: 277, height: 277), true, 2.0)\n2\\.  pickedImage.draw(in: CGRect(x:\
    \ 0, y: 0, width: 277, height: 277))\n3\\.  let newImage = UIGraphicsGetImageFromCurrentImageContext()!\n\
    4\\.  UIGraphicsEndImageContext()\n5\\.  let attrs = [kCVPixelBufferCGImageCompatibilityKey:\
    \ kCFBooleanTrue, kCVPixelBufferCGBitmapContextCompatibilityKey: kCFBooleanTrue]\
    \ as CFDictionary\n6\\.  var pixelBuffer : CVPixelBuffer?\n7\\.  let status =\
    \ CVPixelBufferCreate(kCFAllocatorDefault, Int(newImage.size.width), Int(newImage.size.height),\
    \ kCVPixelFormatType_32ARGB, attrs, &pixelBuffer)\n8\\.  guard (status == kCVReturnSuccess)\
    \ else {\n9\\.     return\n10\\.  }\n11\\.  CVPixelBufferLockBaseAddress(pixelBuffer!,\
    \ CVPixelBufferLockFlags(rawValue: 0))\n12\\.  let pixelData = CVPixelBufferGetBaseAddress(pixelBuffer!)\n\
    13\\.  let rgbColorSpace = CGColorSpaceCreateDeviceRGB()\n14\\.  let context =\
    \ CGContext(data: pixelData, width: Int(newImage.size.width), height: Int(newImage.size.height),\
    \ bitsPerComponent: 8, bytesPerRow: CVPixelBufferGetBytesPerRow(pixelBuffer!),\
    \ space: rgbColorSpace, bitmapInfo: CGImageAlphaInfo.noneSkipFirst.rawValue)\n\
    15\\.  context?.translateBy(x: 0, y: newImage.size.height)\n16\\.  context?.scaleBy(x:\
    \ 1.0, y: -1.0)\n17\\.  UIGraphicsPushContext(context!)\n18\\.  newImage.draw(in:\
    \ CGRect(x: 0, y: 0, width: newImage.size.width, height: newImage.size.height))\n\
    19\\.  UIGraphicsPopContext()\n20\\.  CVPixelBufferUnlockBaseAddress(pixelBuffer!,\
    \ CVPixelBufferLockFlags(rawValue: 0))\n```\n\nNow, let us understand what is\
    \ happening in the preceding code. Since our model accepts an input image of size\
    \ 227×227, lines 1-4 convert the selected image to that size and assign it to\
    \ a new variable called newImage.\n\nIt is important to know that the model accepts\
    \ an input image in the form of pixels. Hence, lines 5-10 store the newImage in\
    \ the form of a pixel buffer, which basically holds the image in the form of pixels\
    \ in the memory. This buffer will be supplied as an input for prediction.\n\n\
    Then, all the pixels present in the image are converted in to device dependent\
    \ RGB color space. Lines 11-13 do that. In line 14, we store the pixel data in\
    \ CGContext so that we can easily modify some properties of the image pixels.\
    \ We then scale the image as per our requirement in lines 15-16\\. Lines 17-20\
    \ update the final image buffer.\n\nNote that it’s okay if you do not understand\
    \ most parts of this code. The only thing you need to know is that we took the\
    \ picture that the user selected from the photo library and converted it into\
    \ a form that the model accepts for prediction.\n\n*Step 19*: Finally, it’s time\
    \ to call the prediction method of the model that will do the image prediction\
    \ for us. Add the following code in the delegate method imagePickerController()\
    \ right after the image resizing code.\n\n```\n//predict image label\nguard let\
    \ prediction = try? model.prediction(image: pixelBuffer!) else {\npredictionText.text\
    \ = \"Can't Predict!\"\nreturn\n}\npredictionText.text = \"Dog Breed:  \\(prediction.dogBreed).\"\
    \n```\n\nThe prediction method is supplied with the pixel buffer as a parameter.\
    \ If the prediction is successful, the method returns an object that gives us\
    \ the output label. We set this output label text to the classifier label that\
    \ we added to the interface earlier. If the prediction is not successful, we manually\
    \ set the classifier label text to let the user know that the model was unable\
    \ to predict the label for the selected image.\n\n*Step 20*: It is finally time\
    \ to build and run the application. Let us find out how well our first ML application\
    \ does. Figures [3-29](#474993_1_En_3_Chapter.xhtml#Fig29) to Figure [3-33](#474993_1_En_3_Chapter.xhtml#Fig33)\
    \ show different screens that you should see while playing around with your application.\n\
    \n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig33_HTML.jpg](images/474993_1_En_3_Chapter/474993_1_En_3_Fig33_HTML.jpg)\n\
    \nFigure 3-33\n\nDog breed prediction (E)\n\n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig32_HTML.jpg](images/474993_1_En_3_Chapter/474993_1_En_3_Fig32_HTML.jpg)\n\
    \nFigure 3-32\n\nDog breed prediction (D)\n\n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig31_HTML.jpg](images/474993_1_En_3_Chapter/474993_1_En_3_Fig31_HTML.jpg)\n\
    \nFigure 3-31\n\nDog breed prediction (C)\n\n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig30_HTML.jpg](images/474993_1_En_3_Chapter/474993_1_En_3_Fig30_HTML.jpg)\n\
    \nFigure 3-30\n\nDog breed prediction (B)\n\n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig29_HTML.jpg](images/474993_1_En_3_Chapter/474993_1_En_3_Fig29_HTML.jpg)\n\
    \nFigure 3-29\n\nDog breed prediction (A)\n\n## Summary\n\n*   There is no single\
    \ model that can be used to perform all the intelligent tasks. Hence, we need\
    \ different custom models for different tasks.\n\n*   The custom machine learning\
    \ model can be created in five simple steps:\n    *   Define the problem\n\n \
    \   *   Collect data\n\n    *   Train the learning algorithm\n\n    *   Evaluate\
    \ the learning algorithm\n\n    *   Build the model\n\n*   Apple introduced a\
    \ Python-based package called Turi Create that helps us in creating custom ML\
    \ models directly from the dataset.\n\n*   Turi Create uses a technique called\
    \ transfer learning, that is, we can train our model on top of an already existing\
    \ model. The learning of the existing model is transferred to our model; therefore\
    \ we only need to train the last few layers of our model. This significantly reduces\
    \ the training time as well as the size of our model.\n\n*   Apple also introduced\
    \ Core ML Tools, which is a Python package that can be used to convert models\
    \ from various formats to the Core ML format using very few lines of code.\n\n\
    *   Once you convert an ML model to the Core ML format, it can be easily used\
    \ in your application, just like any of the Apple-provided models."
  trans: "\n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig28_HTML.jpg](img/474993_1_En_3_Fig28_HTML.jpg)\n\
    \n图 3-28\n\n自定义 Core ML 模型（Dog_Breed_Predictor）\n\n它还显示了**模型类**，该类由 ML 模型自动生成，可直接在我们的应用程序中使用。点击类名旁边的箭头，您将能够看到模型类的实现代码。\n\
    \nXcode 显示的其他重要信息是**模型评估参数**。这是关于模型接收的输入和返回的输出的信息。在我们的案例中，模型接收一张大小为 227×227 的彩色图像作为输入，并返回一个字符串作为输出。\n\
    \n*步骤 15*：现在，让我们在应用程序中使用模型类来进行预测。转到 `ViewController.swift` 文件，并在最开头导入 Core ML\
    \ 框架。\n\n```\nimport CoreML\n```\n\n*步骤 16*：在 `ViewController` 类中声明一个模型变量，该变量将代表\
    \ Core ML 模型。\n\n```\nvar model:dogBreed!\n```\n\n*步骤 17*：重写 `ViewController`\
    \ 类的 `viewWillAppear()` 方法，并在该方法中初始化模型。\n\n```\noverride func viewWillAppear(_\
    \ animated: Bool) {\nmodel = dogBreed()\n}\n```\n\n*步骤 18*：我们的模型接受的输入是一张大小为 227×227\
    \ 的图像。因此，在用户完成图像选择后，我们需要调整图像大小。我们将在委托方法 `imagePickerController()` 中编写相关代码。以下代码将完成此任务：\n\
    \n### 注意\n\n以下代码行中的编号仅用于后续解释，编号本身并非代码的一部分。\n\n```\n//调整图像大小\n1\\.  UIGraphicsBeginImageContextWithOptions\
    \ (CGSize(width: 277, height: 277), true, 2.0)\n2\\.  pickedImage.draw(in: CGRect(x:\
    \ 0, y: 0, width: 277, height: 277))\n3\\.  let newImage = UIGraphicsGetImageFromCurrentImageContext()!\n\
    4\\.  UIGraphicsEndImageContext()\n5\\.  let attrs = [kCVPixelBufferCGImageCompatibilityKey:\
    \ kCFBooleanTrue, kCVPixelBufferCGBitmapContextCompatibilityKey: kCFBooleanTrue]\
    \ as CFDictionary\n6\\.  var pixelBuffer : CVPixelBuffer?\n7\\.  let status =\
    \ CVPixelBufferCreate(kCFAllocatorDefault, Int(newImage.size.width), Int(newImage.size.height),\
    \ kCVPixelFormatType_32ARGB, attrs, &pixelBuffer)\n8\\.  guard (status == kCVReturnSuccess)\
    \ else {\n9\\.     return\n10\\.  }\n11\\.  CVPixelBufferLockBaseAddress(pixelBuffer!,\
    \ CVPixelBufferLockFlags(rawValue: 0))\n12\\.  let pixelData = CVPixelBufferGetBaseAddress(pixelBuffer!)\n\
    13\\.  let rgbColorSpace = CGColorSpaceCreateDeviceRGB()\n14\\.  let context =\
    \ CGContext(data: pixelData, width: Int(newImage.size.width), height: Int(newImage.size.height),\
    \ bitsPerComponent: 8, bytesPerRow: CVPixelBufferGetBytesPerRow(pixelBuffer!),\
    \ space: rgbColorSpace, bitmapInfo: CGImageAlphaInfo.noneSkipFirst.rawValue)\n\
    15\\.  context?.translateBy(x: 0, y: newImage.size.height)\n16\\.  context?.scaleBy(x:\
    \ 1.0, y: -1.0)\n17\\.  UIGraphicsPushContext(context!)\n18\\.  newImage.draw(in:\
    \ CGRect(x: 0, y: 0, width: newImage.size.width, height: newImage.size.height))\n\
    19\\.  UIGraphicsPopContext()\n20\\.  CVPixelBufferUnlockBaseAddress(pixelBuffer!,\
    \ CVPixelBufferLockFlags(rawValue: 0))\n```\n\n现在，让我们理解上述代码的作用。由于我们的模型接受大小为 227×227\
    \ 的输入图像，第 1-4 行将所选图像转换为该大小，并将其赋值给一个名为 `newImage` 的新变量。\n\n重要的是要知道模型接受像素形式的输入图像。因此，第\
    \ 5-10 行将 `newImage` 以像素缓冲区的形式存储，该缓冲区基本上将图像以像素形式保存在内存中。此缓冲区将作为输入提供给预测过程。\n\n然后，图像中的所有像素都被转换为设备相关的\
    \ RGB 颜色空间。第 11-13 行完成此操作。在第 14 行，我们将像素数据存储在 `CGContext` 中，以便我们可以轻松修改图像像素的某些属性。然后，我们在第\
    \ 15-16 行根据需求缩放图像。第 17-20 行更新最终的图像缓冲区。\n\n请注意，如果您不理解此代码的大部分内容，也没有关系。您只需要知道，我们获取了用户从照片库中选择的图片，并将其转换为模型可接受用于预测的形式。\n\
    \n*步骤 19*：最后，是时候调用模型的预测方法了，该方法将为我们进行图像预测。在委托方法 `imagePickerController()` 中，紧接在图像调整大小代码之后，添加以下代码。\n\
    \n```\n//预测图像标签\nguard let prediction = try? model.prediction(image: pixelBuffer!)\
    \ else {\npredictionText.text = \"无法预测！\"\nreturn\n}\npredictionText.text = \"\
    犬种：\\(prediction.dogBreed)。\"\n```\n\n预测方法将像素缓冲区作为参数传入。如果预测成功，该方法返回一个对象，该对象为我们提供输出标签。我们将此输出标签文本设置为我们之前添加到界面的分类器标签。如果预测不成功，我们手动设置分类器标签文本，以告知用户模型无法预测所选图像的标签。\n\
    \n*步骤 20*：终于到了构建并运行应用程序的时候了。让我们看看我们的第一个 ML 应用程序表现如何。图 3-29 到图 3-33 展示了您在操作应用程序时应该会看到的不同屏幕。\n\
    \n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig33_HTML.jpg](img/474993_1_En_3_Fig33_HTML.jpg)\n\
    \n图 3-33\n\n犬种预测（E）\n\n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig32_HTML.jpg](img/474993_1_En_3_Fig32_HTML.jpg)\n\
    \n图 3-32\n\n犬种预测（D）\n\n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig31_HTML.jpg](img/474993_1_En_3_Fig31_HTML.jpg)\n\
    \n图 3-31\n\n犬种预测（C）\n\n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig30_HTML.jpg](img/474993_1_En_3_Fig30_HTML.jpg)\n\
    \n图 3-30\n\n犬种预测（B）\n\n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig29_HTML.jpg](img/474993_1_En_3_Fig29_HTML.jpg)\n\
    \n图 3-29\n\n犬种预测（A）\n\n## 总结\n\n*   没有一个单一的模型可以用来执行所有智能任务。因此，我们需要针对不同任务使用不同的自定义模型。\n\
    \n*   自定义机器学习模型可以通过五个简单步骤创建：\n    *   定义问题\n\n    *   收集数据\n\n    *   训练学习算法\n\
    \n    *   评估学习算法\n\n    *   构建模型\n\n*   Apple 引入了一个名为 Turi Create 的基于 Python 的包，它可以帮助我们直接从数据集创建自定义\
    \ ML 模型。\n\n*   Turi Create 使用一种称为迁移学习的技术，也就是说，我们可以在现有模型的基础上训练我们的模型。现有模型的学习成果被迁移到我们的模型；因此，我们只需要训练模型的最后几层。这显著减少了训练时间以及模型的大小。\n\
    \n*   Apple 还引入了 Core ML Tools，这是一个 Python 包，可以使用很少的代码行将各种格式的模型转换为 Core ML 格式。\n\
    \n*   一旦您将 ML 模型转换为 Core ML 格式，它就可以像任何 Apple 提供的模型一样，轻松地在您的应用程序中使用。\n"
- fmt: '# 4. Custom Core ML Models Using Create ML


    In Chapter [3](#474993_1_En_3_Chapter.xhtml), you learned how to train custom
    machine learning models using a third-party framework called Turi Create. This
    chapter introduces you to the Create ML framework introduced by Apple Inc. in
    2018 to allow developers to train custom ML models for iOS applications. In addition
    to the image classification model that you trained in Chapter [3](#474993_1_En_3_Chapter.xhtml),
    this chapter introduces two more types of models: one trained using text-based
    data and the other trained using tabular data.


    ## Introduction to Create ML


    While Core ML takes care of integrating an ML model in your application, Create
    ML is used to build those ML models. Though it is possible to create custom ML
    models using Core ML Tools (just like we learned in Chapter [3](#474993_1_En_3_Chapter.xhtml)),
    Apple introduced Create ML in 2018 to make things even simpler. Create ML is Apple’s
    very own ML framework. The idea is to build your custom ML model using Create
    ML and then use it in your application using Core ML.


    Rather than training your model in some other language and then using Swift to
    integrate it with your iOS application, Create ML allows a programmer to implement
    end-to-end ML in Swift. Moreover, you can use Create ML directly in your Xcode
    Playgrounds. Following are the types of data that can be trained into a model
    using Create ML. Figure 4-1 shows them as well.


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig1_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig1_HTML.jpg)


    **Figure 4-1** Data types trained into a model using Create ML


    - **Images**: This kind of data can be used to train a custom image classifier
    model that can recognize an object in the images.

    - **Text**: This kind of data can be used to train a custom text classifier model
    that can be used to perform tasks like sentiment analysis, topic analysis, and
    domain analysis.

    - **Tabular data**: This kind of data can be used to train a custom regression
    model that can be used to perform predictions of multiple kinds.


    The workflow of a custom model creation using Create ML is same as the life cycle
    of custom model creation that we learned in Chapter [3](#474993_1_En_3_Chapter.xhtml).
    The steps include: problem identification, data gathering, training the model,
    evaluating the model, and generating the model. For more details, kindly refer
    to the relevant topics in Chapter [3](#474993_1_En_3_Chapter.xhtml).


    In the following sections of this chapter, we will learn how to create an image
    classification model, text classification model, as well as a regression model
    using Create ML.


    ### Image Classification


    Image classification is a problem of determining what label you would like to
    apply to a given image. We will try to solve the same problem that we solved in
    the previous chapter, that is, dog breed identification, but this time using Create
    ML. The following is our problem statement:


    #### Problem


    *Given a picture of a dog, the model should be able to identify the breed of the
    dog.*


    Now, you might already have the dataset that you created in Chapter [3](#474993_1_En_3_Chapter.xhtml).
    We will use the same dataset for this example. If you do not have the dataset,
    here is what you need to do:


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig2_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig2_HTML.jpg)


    **Figure 4-2** Dataset for image classifier


    - First, create a folder called `Dataset` on your MacBook.

    - Inside the `Dataset` folder, create subfolders for each breed of dog you want
    to classify.

    - Then inside each subfolder, place some images of dogs of that breed.

    - Note that the name of the subfolder should be the breed of the dogs whose images
    that folder contains. Figure 4-2 shows the folder structure for the dataset.


    That’s it; you now have your dataset. The next step is to train your model using
    this data. Note that Create ML uses the same transfer learning technique that
    we learned about in Chapter [3](#474993_1_En_3_Chapter.xhtml) while learning about
    Turi Create. It means, using Create ML, we can train our model on top of an ML
    model that already exists in the OS. This results in faster training and smaller
    model size. Following are the steps to train an image classifier model using Create
    ML:


    **Step 1**: Open Xcode; select **File ➤ New ➤ Playground** in the menu (Figure
    4-3).


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig3_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig3_HTML.jpg)


    **Figure 4-3** New Playground in Xcode


    **Step 2**: Select the Blank file from the template selection menu (Figure 4-4).
    Note that you need to select a blank file under MacOS and not iOS, because the
    Create ML framework isn’t supported for iOS Playgrounds.


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig4_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig4_HTML.jpg)


    **Figure 4-4** Playground template selection


    **Step 3**: Name it `"DogBreedPredictor"` and save it to desktop.


    **Step 4**: Now import `CreateMLUI` by adding the following code to the Playground:


    ```

    import CreateMLUI

    ```


    `CreateMLUI` is a framework similar to Create ML; the only difference is that
    unlike Create ML, it has a UI to it.


    **Step 5**: Next, we will create a builder that will help us in training our model.
    To do so, add the following code:


    ```

    let builder = MLImageClassifierBuilder()

    ```


    **Step 6**: To work with the builder using the Live Demo feature of `CreateMLUI`,
    we will use the following method in our code:


    ```

    builder.showInLiveView()

    ```


    Enable the Live Demo feature of Xcode by switching on the assistant editor from
    the toolbar. You will see a play button on the last line of your code. See Figure
    4-5 for reference. Click that button to view the builder interface in the Live
    Demo.


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig5_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig5_HTML.jpg)


    **Figure 4-5** Live demo in Xcode Playground


    **Step 7**: You will notice that we need to drop images into the builder UI to
    begin training. This is quite simple. Select the `Dataset` folder, and drop the
    entire folder into the builder UI. As soon as you do this, the Playground will
    start training the model. The console at the bottom will show you the number of
    images processed, elapsed time, and the percentage of job done. See Figure 4-6
    for reference.


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig6_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig6_HTML.jpg)


    **Figure 4-6** Training image classifier using Create ML (A)


    When the training is done, the builder UI will show you three labels: Training,
    Validation, and Evaluation. See Figure 4-7 for reference.'
