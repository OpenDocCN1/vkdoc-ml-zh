- fmt: "# What Are the Applications of Machine Learning?\n\n`ML` is a tool that we\
    \ knowingly or unknowingly use in many of our day to day activities. Following\
    \ are some of the familiar `ML` applications:\n\n- An e-mail service filters spam\
    \ e-mail.\n- A digital camera detects human faces.\n- Personal digital assistants\
    \ (`PDAs`) detect voice commands.\n- Optical character recognition (`OCR`) software\
    \ recognizes characters from an image.\n- Online payment gateways detect credit\
    \ card fraud.\n- Websites display personalized advertisements to a user.\n\nApart\
    \ from the aforementioned applications, `ML` is also used in various other domains\
    \ such as medical diagnosis, space exploration, wildlife preservation, sentiment\
    \ analysis, and so on.\n\n## Why Do We Need Machine Learning?\n\nLet’s say we\
    \ want to display all the images of roses in our application from the user’s photo\
    \ library. This seems like a simple task, so we can do some programming. Perhaps,\
    \ we’ll start with the color. If the dominant color in the picture is red, maybe\
    \ it’s a rose.\n\n```\n// Use Color\nIf color == \"reddish\"\n```\n\nFigure [1-6](#474993_1_En_1_Chapter.xhtml#Fig6)\
    \ shows different types of roses. Looking at the figure, you will notice that\
    \ there are many roses that are white or yellow in color. So, we’ll go forward\
    \ and start describing the shape. And soon we’ll realize that it’s very difficult\
    \ to write even such a simple program programmatically. Hence, this is where we\
    \ turn to `ML` for our help. Rather than describing how a rose looks programmatically,\
    \ we will describe a rose empirically.\n\n![../images/474993_1_En_1_Chapter/474993_1_En_1_Fig6_HTML.jpg](images/474993_1_En_1_Chapter/474993_1_En_1_Fig6_HTML.jpg)\n\
    \nFigure 1-6\n\nDifferent types of roses\n\n`ML` has two steps. In the first step,\
    \ you collect images of roses, lilies, sunflowers, and other flowers and label\
    \ them. You will run them through a learning algorithm and you will get what we\
    \ call a model. This model is an empirical representation of what a rose looks\
    \ like. This step is known as learning. In the second step, you do the following:\n\
    \n- Take a picture of a rose.\n- Embed the model generated in step one in your\
    \ app.\n- Run the picture of a rose through the model.\n\nYou will get a label\
    \ for the picture and the confidence level. See Figure [1-7](#474993_1_En_1_Chapter.xhtml#Fig7).\
    \ This step is known as inference.\n\n![../images/474993_1_En_1_Chapter/474993_1_En_1_Fig7_HTML.jpg](images/474993_1_En_1_Chapter/474993_1_En_1_Fig7_HTML.jpg)\n\
    \nFigure 1-7\n\nInference\n\nThis is how we harness the potential of `ML` to simplify\
    \ our tasks.\n\n## How Does Machine Learning Work?\n\nIn layman terms, `ML` can\
    \ be thought of as converting past experiences into expertise. Let us consider\
    \ the task of recognizing spam e-mails and labelling them. To perform this task,\
    \ the machine will create a set of all the e-mails that were previously labeled\
    \ as spam e-mails by a human user; the machine will then identify all the terms\
    \ whose appearance in the e-mail is an indication of spam e-mail. Now when a new\
    \ e-mail appears, the machine scans it for suspicious words identified from the\
    \ set of previous spam e-mails to identify if the new e-mail is a spam. This way,\
    \ the machine will be able to label new e-mails correctly and automatically.\n\
    \nLet us consider another task that involves `ML`, that is, the detection of human\
    \ faces by camera application. This functionality helps the camera to make sure\
    \ that all the faces are in focus before the picture gets captured. See Figure\
    \ [1-8](#474993_1_En_1_Chapter.xhtml#Fig8). To automatically detect a human face,\
    \ the camera needs to know the structure of a human face. For this purpose, a\
    \ learning algorithm is applied in the camera application, during which it works\
    \ with a training data set consisting of a variety of human faces. By analyzing\
    \ all the human faces in the training data set, the camera observes the common\
    \ pattern in all the data members of the training data set. For instance, it may\
    \ observe that all the human faces consist of two eyes, one nose, and a pair of\
    \ lips. Along with that it might also observe the positioning of these elements.\
    \ By learning this, the camera will now be able to detect human faces automatically.\n\
    \n![../images/474993_1_En_1_Chapter/474993_1_En_1_Fig8_HTML.jpg](images/474993_1_En_1_Chapter/474993_1_En_1_Fig8_HTML.jpg)\n\
    \nFigure 1-8\n\nFacial recognition\n\nThere are many algorithms that are used\
    \ for `ML`. One such algorithm is the Perceptron Learning Algorithm. The following\
    \ section discusses this algorithm to get a clearer idea about `ML`.\n\n## Perceptron\
    \ Learning Algorithm\n\nThe Perceptron is a classic example of a neural network\
    \ that gives a binary output based on the input it receives. We can use a Perceptron\
    \ for a classification task where we need to classify the input in one of two\
    \ output categories. For instance, consider Figure [1-9](#474993_1_En_1_Chapter.xhtml#Fig9),\
    \ which presents a linearly separable problem. Here, the goal is to create a Perceptron\
    \ that separates red dots from blue dots. To do this, the Perceptron must first\
    \ analyze the training data set and determine a straight line on the graph that\
    \ separates the blue dots from the red ones. Once that is done, the Perceptron\
    \ will be able to classify new input vectors as blue dots or red dots by determining\
    \ their position on the graph in relation to the line.\n\n![../images/474993_1_En_1_Chapter/474993_1_En_1_Fig9_HTML.png](images/474993_1_En_1_Chapter/474993_1_En_1_Fig9_HTML.png)\n\
    \nFigure 1-9\n\nLinearly separable problem\n\nFollowing is the learning process\
    \ for the Perceptron to determine the line that separates the two categories of\
    \ input vectors:\n\n- The goal is to obtain a straight line based on the training\
    \ data set that separates the red dots from the blue dots. So, let us consider\
    \ the equation of a straight line:\n\n  `ax + by + c = 0`\n\n  `x = - (c/a) -\
    \ (b/a) y`\n\n- We now get an equation of the straight line. The position of the\
    \ line completely depends on the values of `a`, `b`, and `c`. So, we can adjust\
    \ the value of weights (`a`, `b` and `c`) as per our requirements.\n\n- Now, initialize\
    \ the weights (`a`, `b` and `c`) to random real values.\n\n- Iterate through the\
    \ training data set, collecting all data members misclassified by the current\
    \ set of weights. If all the data members are classified correctly, substitute\
    \ the values of the weights in the equation of the line. You’ve found the line\
    \ that separates the red dots from the blue ones.\n\n- Or else, modify the weights\
    \ (`a`, `b` and `c`) depending on the misclassified data members and iterate again\
    \ through the training data set. Repeat the process until all the data members\
    \ are classified correctly."
