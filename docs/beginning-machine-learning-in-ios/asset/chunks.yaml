    ## 将自定义模型转换为 Core ML


    如果你使用 Turi Create 从头生成模型，则无需担心转换问题，因为它已经以 Core ML 格式创建了模型；但如果你使用其他工具，如 Caffe、TensorFlow
    或 Keras，你可能想知道如何将使用这些工具构建的模型转换为 Core ML 格式。为此，Apple 在推出 Core ML 的同时也推出了 Core ML
    Tools。它是一个开源的 Python 包，可以接收多种格式的 ML 模型，并将其转换为 Core ML 格式。


    让我们学习如何使用 Core ML Tools 将模型转换为 Core ML 格式。为此，你需要在机器上安装 Python。如果没有安装，请从 [`https://www.python.org`](https://www.python.org)
    安装最新版本的 Python。我们将以一个 Caffe 模型为例，将其转换为 Core ML 格式。为此，请考虑以下步骤：


    *第 1 步*：在你的 Mac 上打开“终端”应用程序，并使用 Python 包管理器安装 Core ML Tools。为此，请输入以下命令：


    ```

    pip install CoreMLtools

    ```


    *第 2 步*：打开 Xcode；在菜单中选择 **File ➤ New ➤ File**（图 3-15）。


    ![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig15_HTML.jpg](img/474993_1_En_3_Fig15_HTML.jpg)


    图 3-15


    在 Xcode 中新建文件


