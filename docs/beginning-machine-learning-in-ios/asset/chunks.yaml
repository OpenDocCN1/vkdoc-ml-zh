    \n```\n//predict image label\nguard let prediction = try? model.prediction(image:\
    \ pixelBuffer!) else {\nclassifier.text = \"Can't Predict!\"\nreturn\n}\nclassifier.text\
    \ = \"This is probably \\(prediction.classLabel).\"\n```\n\n预测方法以像素缓冲区作为参数传入。如果预测成功，该方法会返回一个对象，该对象提供输出标签。我们将此输出标签文本设置为我们之前添加到界面中的分类器标签。如果预测不成功，我们手动设置分类器标签文本，以告知用户模型无法预测所选图像的标签。\n\
    \n*步骤 10*：终于到了构建并运行应用程序的时候了。让我们看看我们的第一个 ML 应用程序表现如何。图 2-20 到图 2-24 展示了你在使用应用程序时应该会看到的不同屏幕。\n\
    \n![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig24_HTML.jpg](img/474993_1_En_2_Fig24_HTML.jpg)\n\
    \n图 2-24\n\n照片应用预测 (E)\n\n![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig23_HTML.jpg](img/474993_1_En_2_Fig23_HTML.jpg)\n\
    \n图 2-23\n\n照片应用预测 (D)\n\n![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig22_HTML.jpg](img/474993_1_En_2_Fig22_HTML.jpg)\n\
    \n图 2-22\n\n照片应用预测 (C)\n\n![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig21_HTML.jpg](img/474993_1_En_2_Fig21_HTML.jpg)\n\
    \n图 2-21\n\n照片应用预测 (B)\n\n![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig20_HTML.jpg](img/474993_1_En_2_Fig20_HTML.jpg)\n\
    \n图 2-20\n\n照片应用预测 (A)\n\n## 总结\n\n*   Core ML 是苹果公司的一个框架，可用于为 iPhone、iPad、MacBook、Apple\
    \ TV 和 Apple Watch 等苹果产品开发机器学习应用程序。\n\n*   Core ML 允许开发者使用已转换为 Core ML 格式的预训练\
    \ ML 模型，在其应用程序中实现 ML 功能。\n\n*   Core ML 还允许开发者将自定义 ML 模型转换为 Core ML 格式，以便在其应用程序中使用。\n\
    \n*   Core ML 将模型集成到应用程序包中，使得 ML 算法可以在本地而非远程运行。这带来了更快的处理速度。\n\n*   Core ML 基于苹果之前的框架——Accelerate\
    \ 和 Metal Performance Shaders (MPS)——它们充当性能原语。\n\n*   Core ML 的主要组件包括：\n    *\
    \   *Vision*：图像和视频分类\n    *   *Natural Language*：基于文本的预测和情感分析\n    *   *GameplayKit*：实现游戏玩法行为\n\
    \n*   一个 ML 模型可以通过输入数据点、每个输入数据点对应的输出，以及一个将输入数据点映射到相应输出的学习算法来训练。一旦训练完成，模型便可用于推理。\n\
    \n*   ML 模型通常提供的功能包括情感分析、手写识别、语言翻译、图像分类、文本预测等。\n\n# 3. 使用 Turi Create 创建自定义 Core\
    \ ML 模型\n\n在第 2 章中，你学习了如何在应用程序中使用预训练的机器学习模型。在本章中，你将学习如何使用第三方框架 Turi Create 来训练你自己的模型。你还将找到一份逐步指南，了解如何将此训练好的模型转换为\
    \ Core ML 格式，并在你的应用程序中使用它。\n\n## 自定义模型的必要性\n\nML 模型可以被视为一段代码，我们用它来为应用程序添加智能用户体验。正如我们在第\
    \ 2 章中学到的，ML 模型可用于执行各种任务；并且就像任何其他代码片段一样，没有一个单一的模型可以执行所有智能任务。例如，考虑你可能希望在应用程序中实现的以下任务：\n\
    \n*   能够拍摄食物照片并了解你正在摄入多少卡路里\n*   通过 iPhone 上的简单手势更改电视屏幕上的演示幻灯片\n*   实时跟踪物体\n*\
    \   在照片上尝试艺术滤镜\n*   根据音乐文件的流派对其进行分类\n\n这只是一个简短的列表；你可能希望应用程序执行的智能任务数不胜数。所有这些任务都展示了截然不同的用户体验；因此，没有一个单一的\
    \ ML 模型能够容纳所有这些任务。这就是自定义模型需求的来源。所有这些任务都有一些共同点——它们都使用 ML，并且它们都需要很少的数据即可在我们的应用程序中实现。因此，我们可以为每个想要执行的任务创建一个自定义\
    \ ML 模型。\n"
- fmt: "# Life Cycle of a Custom Model Creation\n\nIn order to create a custom Core\
    \ ML model, the first thing you will need to do is to identify the problem you\
    \ are trying to solve and collect data that will help you solve the problem. For\
    \ instance, if you are trying to create a model that will predict your next month’s\
    \ electricity bill, the data you will need to collect are your historical electricity\
    \ bills and your electricity consumption statistics for the corresponding time\
    \ period.\n\nOnce you have the dataset, the next step is to train the model using\
    \ an appropriate algorithm. Once the training is done, you can check the accuracy\
    \ by evaluating the model. Finally, if you are satisfied with the evaluation results,\
    \ you can build the model. If not satisfied, you can pass the model through another\
    \ iteration of the training process. You can repeat the process for as long as\
    \ you are unsatisfied with the results. Figure [3-1](#474993_1_En_3_Chapter.xhtml#Fig1)\
    \ shows the life cycle of custom model creation.\n\n### Note\n\nApple has introduced\
    \ a standardized file format called ML Model (`.mlmodel`) that allows developers\
    \ to use machine learning in their application. All the machine learning models\
    \ need to be eventually converted into the Core ML format (`.mlmodel`) in order\
    \ to use them in Apple products.\n\n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig1_HTML.jpg](images/474993_1_En_3_Chapter/474993_1_En_3_Fig1_HTML.jpg)\n\
    \nFigure 3-1\n\nLife cycle of custom model creation\n\nFollowing are the steps\
    \ involved in creation of a custom Core ML model:\n\n1.  *Problem*: The first\
    \ step of custom model creation involves identifying the problem that we are trying\
    \ to solve and understanding it in terms of ML. Consider the tasks in Table [3-1](#474993_1_En_3_Chapter.xhtml#Tab3)\
    \ and their corresponding ML category.\n\n    Table 3-1\n\n    Machine Learning\
    \ Tasks\n\n    | **Task You Want to Do** | **Machine Learning Terminology** |\n\
    \    | --- | --- |\n    | Label images | Image Classification |\n    | Recognize\
    \ objects within images | Object Detection |\n    | Find similar images | Image\
    \ Similarity |\n    | Create custom styled avatars | Style Transfer |\n    | Personalize\
    \ user choices | Recommender |\n    | Detect activity using sensors | Activity\
    \ Classification |\n    | Analyze sentiment from message | Text Classifier |\n\
    \    | Predict a label | Classifier |\n    | Predict a numeric value | Regression\
    \ |\n    | Group similar data together | Clustering |\n\n2.  *Data*: Once we identify\
    \ the problem, the next step is to identify the type of data and the amount of\
    \ data that we will need to accomplish this task. For supervised learning, the\
    \ data will consist of pairs of input and the corresponding output. Data can be\
    \ in any form such as pictures, text files, CSV files, or tables. Finally, we\
    \ collect relevant data that we will use to train our model.\n\n3.  *Train*: Once\
    \ we’ve collected the required data, we can start training our model on the data.\n\
    \n4.  *Evaluate*: Once the model is ready, we can determine its quality by evaluating\
    \ the model’s success ratio against a test dataset. If the results are not up\
    \ to the mark and the model is not ready for production, we can reiterate the\
    \ training process until the model becomes more accurate.\n\n5.  *Model*: If the\
    \ results of the training process are satisfactory, we can generate the `.mlmodel`\
    \ that can be used in our applications.\n\nTraining and evaluating a model from\
    \ scratch can be a complicated task. To simplify this complexity, Apple has introduced\
    \ Turi Create. Using Turi Create in collaboration with Python will allow us to\
    \ train our custom model based on existing ML models using very few lines of code,\
    \ but more on that later.\n\n## Assembling Data\n\nBefore learning about assembling\
    \ data, let us understand the basic types of tasks that we can accomplish using\
    \ ML. If you have lots of images, you might be interested in categorizing those\
    \ images on the basis of their content; if your application shows advertisement\
    \ to the users, you might want to customize those advertisements as per the user\
    \ preference; or you might want to prompt users about the duplicate contacts in\
    \ their phonebook.\n\nAll these tasks require different types of data. For understanding,\
    \ let us consider the following problem statement that we will try to solve:\n\
    \n### Problem\n\nGiven a picture of a dog, the application should be able to predict\
    \ the breed of the dog.\n\nTo create a model that can do this task, we will need\
    \ lots of images of dogs from different breeds. We will then create a dataset\
    \ from these images. Don’t worry; it’s not as complicated as it sounds. First,\
    \ create a folder called `Dataset` on your MacBook. Inside the `Dataset` folder,\
    \ create subfolders for each breed of dog you want to classify. Then inside each\
    \ subfolder, place some images of dogs of that breed. Note that the name of the\
    \ subfolder should be the name of the dog breed. Refer to Figure [3-2](#474993_1_En_3_Chapter.xhtml#Fig2)\
    \ for reference.\n\n![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig2_HTML.jpg](images/474993_1_En_3_Chapter/474993_1_En_3_Fig2_HTML.jpg)\n\
    \nFigure 3-2\n\nDataset for custom ML model\n\nThat’s it. We now have the dataset\
    \ required to train our model to perform the classification task. In the following\
    \ section of this chapter, we will learn how to train an ML model using the dataset.\n\
    \n## Introduction to Turi Create\n\nTuri Create is a Python-based framework that\
    \ helps you create Core ML models directly from the dataset. It is an open-source\
    \ framework available at [`https://github.com/apple/turicreate`](https://github.com/apple/turicreate).\
    \ It is also cross-platform, which means that you can use it on both MacOS and\
    \ Linux.\n\nThe major benefit of using Turi Create is that rather than training\
    \ a model from scratch, it allows us to train our model on the top of the ML model\
    \ that already exists in the OS. This is commonly known as transfer learning.\
    \ This is important because training a model from scratch requires millions of\
    \ images, huge computing power, and lots of patience. Instead, using Turi Create,\
    \ we can use existing ML models such as ResNet (residual networks) and train the\
    \ last few layers of this model to our specific data. This way we can create a\
    \ sufficiently good ML model using the amount of data that we have and in time.\
    \ Using transfer learning also results in smaller model size."
