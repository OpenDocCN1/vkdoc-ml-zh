    That’s it. We just created a text classifier using Create ML that can predict
    the sentiment of the user on the basis of textual input. Let us now create an
    application to test this model. We will create an application that will allow
    the user to enter some text and, on the basis of the text entered, we will predict
    the emotional state of the user. If it is positive, we will enable the button
    that can be used to post the text on some social website. If it is negative, we
    will disable the button so that the user won’t be able to post the negative content
    on the website.


    *Step 1*: Open Xcode and create an iOS application project by following the steps
    that you’ve learned previously in this book.


    *Step 2*: Open the **“Main.storyboard”** file to access the application interface.
    Add a Text View, a label, and a button. See Figure [4-24](#474993_1_En_4_Chapter.xhtml#Fig24)
    for reference.


