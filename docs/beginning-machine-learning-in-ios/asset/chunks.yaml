    @IBOutlet weak var imageView: UIImageView!

    ```


    *Step 6*: At the tap of the button, the app should open an image picker that allows
    the user to select an image from the photo library and return the selected image.
    Let us now create an action that will handle the click event for the button. To
    do so, again control and drag from the button to the code. You should see a popup
    similar to Figure [2-14](#474993_1_En_2_Chapter.xhtml#Fig14). In the connection
    field we will choose Action; as Name we will use pickImageBtnClick; the Event
    that fires the action is “Touch Up Inside”; and the argument passed to the method
    is Sender.


    ![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig14_HTML.jpg](images/474993_1_En_2_Chapter/474993_1_En_2_Fig14_HTML.jpg)


    Figure 2-14


    IBAction


    That should create the following IBAction code in your ViewController class:


    ```

    @IBAction func pickImageBtnClick(_ sender: Any) {

    //code

    }

    ```


    *Step 7*: Now let us add the code that will handle the button click. First of
    all, since we need the user to interact with the photo library, we have to conform
    to the UIImagePickerControllerDelegate protocol as well as UINavigationControllerDelegate
    protocol. Add both controllers to your class definition in the ViewControllor.swift
    file:


    ```

    class ViewController: UIViewController, UIImagePickerControllerDelegate, UINavigationControllerDelegate
    {

    //code

    }

    ```


    *Step 8*: When the user clicks the button, we need to create an instance of UIImagePickerController
    and set its delegate to our current class. We also need to specify the source
    for the image picker as the photo library. Once the picker is created, we need
    to present it modally using the present method. To do so, add the following code
    to the pickImageBtnClick method in ViewControllor.swift file:


    ```

    @IBAction func pickImageBtnClick(_ sender: Any) {

    let imagePicker = UIImagePickerController()

    imagePicker.delegate = self

    imagePicker.allowsEditing = false

    imagePicker.sourceType = .photoLibrary

    present(imagePicker, animated: true, completion: nil)

    }

    ```


    *Step 9*: Since we are confirming to UIImagePickerControllerDelegate, we need
    to implement two delegate methods: imagePickerController and imagePickerControllerDidCancel.
    The imagePickerController method is called when the user is finished selecting
    the image from the library. Hence, we will use this method to set the selected
    image in the Image View of our application. The imagePickerControllerDidCancel
    method is called when the user cancels the image picker. Hence, in this method,
    we will simply dismiss the picker. Add the following code to the ViewController
    class in the ViewControllor.swift file:


    ```

    func imagePickerController(_ picker: UIImagePickerController, didFinishPickingMediaWithInfo
    info: [String : Any]) {

    let pickedImage = info[UIImagePickerControllerOriginalImage] as! UIImage

    imageView.image = pickedImage

    self.dismiss(animated: true, completion: nil)

    }

    func imagePickerControllerDidCancel(_ picker: UIImagePickerController) {

    self.dismiss(animated: true, completion: nil)

    }

    ```


    Note that if you are using Swift 4.2, the preceding code might not work for you,
    since it is written in Swift 4.0\. Following is the code that you will use instead:


    ```

    func imagePickerController(_ picker: UIImagePickerController, didFinishPickingMediaWithInfo
    info: [UIImagePickerController.InfoKey : Any]) {

    let pickedImage = info[UIImagePickerController.InfoKey.originalIm    age] as!
    UIImage

    imageView.image = pickedImage

    picker.dismiss(animated: true)

    }

    func imagePickerControllerDidCancel(_ picker: UIImagePickerController) {

    self.dismiss(animated: true, completion: nil)

    }

    ```


    If everything is alright, your final swift code (Swift 4.0) should be as follows:


    ```

    import UIKit

    class ViewController: UIViewController, UIImagePickerControllerDelegate, UINavigationControllerDelegate
    {

    @IBOutlet var btn: UIButton!

    @IBOutlet var imageView: UIImageView!

    override func viewDidLoad() {

    super.viewDidLoad()

    btn.layer.cornerRadius = 8

    }

    @IBAction func pickImageBtnClick(_ sender: Any) {

    let imagePicker = UIImagePickerController()

    imagePicker.delegate = self

    imagePicker.allowsEditing = false

    imagePicker.sourceType = .photoLibrary

    present(imagePicker, animated: true, completion: nil)

    }

    //UIImagePickerControllerDelegate Methods

    func imagePickerController(_ picker: UIImagePickerController, didFinishPickingMediaWithInfo
    info: [String : Any]) {

    let pickedImage = info[UIImagePickerControllerOriginalImage] as! UIImage

    imageView.image = pickedImage

    self.dismiss(animated: true, completion: nil)

    }

    func imagePickerControllerDidCancel(_ picker: UIImagePickerController) {

    self.dismiss(animated: true, completion: nil)

    }

    }

    ```


    *Step 10*: Since our application needs to access the photo library of the user’s
    device, we need to ask the user to grant access for the same. Otherwise, our application
    might terminate unexpectedly. To avoid that, we need to add the following property
    in the “Info.plist” file (Figure [2-15](#474993_1_En_2_Chapter.xhtml#Fig15)) of
    our application:


    ![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig15_HTML.jpg](images/474993_1_En_2_Chapter/474993_1_En_2_Fig15_HTML.jpg)


    Figure 2-15


    Information property list


    *   *Key*: Privacy – Photo Library Usage Description


    *   *Value*: $(PRODUCT_NAME) photo use'
