    output values. Supervised learning represents the concept of humans teaching the
    computer. It is mainly used to perform classification tasks.


    2.  *Unsupervised learning*: This type of learning algorithm consists of a training
    data set that has only input values, no output values. Such data is known as unlabeled
    training data. In such learning algorithms, learning occurs purely based on the
    structure of the data. Unsupervised learning represents the concept of computers
    teaching themselves. It is mainly used to solve clustering tasks.


    3.  *Reinforcement learning*: This type of learning algorithm interacts with the
    environment by producing actions and discovering error or success. This type of
    learning allows machines to automatically determine the ideal behavior within
    a specific environment. Simple feedback is required for the machine to learn which
    action is best; this is known as the reinforcement signal.


    Now that you are aware of the basics of ML, we will discuss the core ML framework
    provided by Apple to implement pretrained ML models into iOS applications.


    ## Summary


    *   Machine Learning is a process during which a machine learns about significant
    patterns in a given set of data so that it can make predictions.


    *   Ensemble learning, SVMs, ANNs, and decision trees are some of the well-known
    ML models.


    *   Spam e-mail filtering, face detection, voice recognition, OCR, credit card
    fraud detection, and personalized advertisements are common examples of ML.


    *   Advanced applications of ML include medical diagnosis, space exploration,
    wildlife preservation, and sentiment analysis.


    *   ML identifies patterns in historical data and uses this knowledge to react
    appropriately to any alien data that it might encounter in the future.


    *   Perceptron is a classic example of ML that gives a binary output based on
    the input it receives. It can be used to solve a linearly separable problem.


    *   ML algorithms are broadly classified into three types: supervised, unsupervised,
    and reinforcement learning.


    # 2. Introduction to Core ML Framework


    In Chapter [1](#474993_1_En_1_Chapter.xhtml), you learned the basic definition
    of machine learning (ML), how it works, where it is used, and what is required
    to use it. This chapter will introduce you to the Core ML framework that was introduced
    by Apple Inc. in 2017 to allow application developers to implement ML in their
    iOS applications. You will also learn the concepts of training and inference,
    which will give you a clearer picture of how ML works.


    This chapter also provides a step-by-step guide for creating an ML application
    for an iOS device. You need not to worry if you have not created an iOS application
    previously, because this chapter will guide you through the entire process of
    creating an application from scratch.


    ## Core ML at a Glance


    Core ML is a groundbreaking application development framework released by Apple.
    It allows you to use pretrained ML models in your iOS applications.


    Traditionally, ML applications had to rely on cloud services to run third-party
    ML algorithms. This caused the application to run very slow on mobile devices.
    But with the launch of Core ML, ML applications can now locally run optimized
    and trained ML algorithms on the device, leading to faster processing speed (Figure
    [2-1](#474993_1_En_2_Chapter.xhtml#Fig1)).


    ![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig1_HTML.jpg](images/474993_1_En_2_Chapter/474993_1_En_2_Fig1_HTML.jpg)


    Figure 2-1


    Core ML applications lead to faster processing time


    Core ML is huge, and it can be used to implement a multitude of functionalities.
    However, there are two direct applications of Core ML:


    *   First, the developers can use the pretrained models that already exist in
    the Core ML.


    *   Second, they can they can build their own custom ML model using frameworks
    like Caffe, Turi, and Keras, and then convert it into a Core ML model to use it
    in their iOS application.


    Some well-known applications that use the functionality provided by Core ML are
    Pinterest (image-based search), iPhone Photo Library (groups photos together),
    and Nude App (recognizes pictures with nudity).


    Figure [2-2](#474993_1_En_2_Chapter.xhtml#Fig2) shows the process of converting
    an ML model created using third-party frameworks into the Core ML format so that
    you can use it in your application.


    ![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig2_HTML.jpg](images/474993_1_En_2_Chapter/474993_1_En_2_Fig2_HTML.jpg)


    Figure 2-2


    Converting to Core ML


    Core ML offers support for a wide range of ML algorithms such as ensemble learning,
    support vector machines (SVMs), artificial neural networks (ANNs), linear models,
    and so on. However, Core ML will only run models that are trained with labeled
    data. It does not provide support for unsupervised models.


    ## Core ML Components


    Core ML is Apple’s ML framework available for macOS, iOS, watchOS, and tvOS. It
    acts as a foundation for Apple’s previous ML frameworks—Accelerate and Metal Performance
    Shaders (MPS)—which are commonly used as performance primitives. Accelerate uses
    CPUs for memory-heavy tasks, while MPS uses GPU for compute-heavy tasks. Core
    ML decides which underlying framework to use based on the requirement of the application.
    Figure [2-3](#474993_1_En_2_Chapter.xhtml#Fig3) shows various components of the
    Core Ml framework. In addition to Accelerate and MPS, Core ML provides support
    for the following domain-specific frameworks:


    ![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig3_HTML.png](images/474993_1_En_2_Chapter/474993_1_En_2_Fig3_HTML.png)


    Figure 2-3


    Core ML components


    *   *Vision*: Vision is Apple’s one-stop shop to do all the things related to
    computer vision and images. It is a framework that is comprised of computer vision
    algorithms that help in performing tasks such as detection and classification
    of images and videos. It can be used to do things like object tracking or deep
    learning-based face detection.


    *   *Natural Language*: This is Apple’s one-stop shop to do text processing. It
    is a framework that can be used to analyze natural language and deduce some metadata
    from it. It is helpful for performing tasks like named entity recognition (NER),
    text prediction, language identification, and sentiment analysis.


    *   *GameplayKit*: It is a framework that helps to incorporate common gameplay
    behavior such as pseudorandom number generation, object motion, and path finding
    in your application. It is an object-oriented framework that contains reusable
    components that help you build games.


    You can think of Core ML as a set of tools that helps you in bringing multiple
    ML models together and wrap them in one interface so that you can easily use them
    in your application code.'
  trans: '

    ## 机器学习类型


    机器学习算法大致可分为三类：


    1.  *监督学习*：此类学习算法包含一个训练数据集，其中包含由输入值和期望输出值组成的配对。这类数据被称为标记训练数据。在此类算法中，会生成一个映射函数，将训练数据集中的输入值映射到其对应的输出值。监督学习代表了人类教授计算机的概念，主要用于执行分类任务。


    2.  *无监督学习*：此类学习算法包含一个训练数据集，其中仅有输入值，没有输出值。这类数据被称为未标记训练数据。在此类学习算法中，学习纯粹基于数据的结构进行。无监督学习代表了计算机自我学习的概念，主要用于解决聚类任务。


    3.  *强化学习*：此类学习算法通过与环境的交互来产生动作，并发现错误或成功。这种学习方式使机器能够自动确定特定环境中的理想行为。机器需要简单的反馈来学习哪个动作最佳；这被称为强化信号。


    现在你已经了解了机器学习的基础知识，我们将讨论苹果公司提供的核心机器学习框架，用于将预训练的机器学习模型集成到 iOS 应用中。


    ## 总结


    *   机器学习是一个过程，在此过程中，机器学习给定数据集中的显著模式，以便能够进行预测。


    *   集成学习、支持向量机、人工神经网络和决策树是一些著名的机器学习模型。


    *   垃圾邮件过滤、人脸检测、语音识别、光学字符识别、信用卡欺诈检测和个性化广告是机器学习的常见示例。


    *   机器学习的高级应用包括医疗诊断、太空探索、野生动物保护和情感分析。


    *   机器学习识别历史数据中的模式，并利用这些知识对未来可能遇到的任何陌生数据做出适当反应。


    *   感知机是机器学习的一个经典示例，它根据接收到的输入给出二元输出，可用于解决线性可分问题。


    *   机器学习算法大致分为三类：监督学习、无监督学习和强化学习。


    # 2. Core ML 框架简介


    在第 1 章中，你学习了机器学习的基本定义、工作原理、应用场景以及使用它所需的条件。本章将向你介绍 Core ML 框架，该框架由苹果公司于 2017 年推出，旨在允许应用程序开发人员在其
    iOS 应用中实现机器学习。你还将学习训练和推理的概念，这将让你更清晰地了解机器学习的工作原理。


    本章还提供了为 iOS 设备创建机器学习应用的分步指南。如果你之前没有创建过 iOS 应用，也无需担心，因为本章将指导你完成从零开始创建应用的整个过程。


    ## Core ML 概览


    Core ML 是苹果公司发布的一个开创性的应用开发框架。它允许你在 iOS 应用中使用预训练的机器学习模型。


    传统上，机器学习应用必须依赖云服务来运行第三方机器学习算法。这导致应用在移动设备上运行非常缓慢。但随着 Core ML 的推出，机器学习应用现在可以在设备上本地运行经过优化和训练的机器学习算法，从而带来更快的处理速度（图
    2-1）。


    ![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig1_HTML.jpg](img/474993_1_En_2_Fig1_HTML.jpg)


    图 2-1


    Core ML 应用带来更快的处理时间


    Core ML 功能强大，可用于实现多种功能。然而，Core ML 有两个直接的应用：


    *   首先，开发者可以使用 Core ML 中已有的预训练模型。


    *   其次，他们可以使用 Caffe、Turi 和 Keras 等框架构建自己的自定义机器学习模型，然后将其转换为 Core ML 模型，以便在其 iOS
    应用中使用。


    一些使用 Core ML 提供功能的知名应用包括 Pinterest（基于图像的搜索）、iPhone 照片图库（将照片分组）和 Nude App（识别包含裸体的图片）。


    图 2-2 展示了将使用第三方框架创建的机器学习模型转换为 Core ML 格式的过程，以便你可以在应用中使用它。


    ![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig2_HTML.jpg](img/474993_1_En_2_Fig2_HTML.jpg)


    图 2-2


    转换为 Core ML


    Core ML 支持广泛的机器学习算法，例如集成学习、支持向量机、人工神经网络、线性模型等。但是，Core ML 仅运行使用标记数据训练的模型，不支持无监督模型。


    ## Core ML 组件


    Core ML 是苹果的机器学习框架，适用于 macOS、iOS、watchOS 和 tvOS。它是苹果先前机器学习框架——Accelerate 和 Metal
    Performance Shaders——的基础，这两个框架通常用作性能基元。Accelerate 使用 CPU 处理内存密集型任务，而 MPS 使用 GPU
    处理计算密集型任务。Core ML 根据应用的需求决定使用哪个底层框架。图 2-3 展示了 Core ML 框架的各种组件。除了 Accelerate 和
    MPS 之外，Core ML 还支持以下特定领域的框架：


    ![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig3_HTML.png](img/474993_1_En_2_Fig3_HTML.png)


    图 2-3


    Core ML 组件


    *   *Vision*：Vision 是苹果用于处理所有与计算机视觉和图像相关事务的一站式框架。它包含计算机视觉算法，有助于执行图像和视频的检测与分类等任务。它可以用于物体跟踪或基于深度学习的人脸检测等。


    *   *Natural Language*：这是苹果用于文本处理的一站式框架。它可以用于分析自然语言并从中推断出一些元数据。它有助于执行命名实体识别、文本预测、语言识别和情感分析等任务。


    *   *GameplayKit*：这是一个有助于在你的应用中融入常见游戏行为的框架，例如伪随机数生成、物体运动和寻路。它是一个面向对象的框架，包含可帮助你构建游戏的可重用组件。


    你可以将 Core ML 视为一组工具，它帮助你整合多个机器学习模型，并将它们封装在一个接口中，以便你可以在应用代码中轻松使用它们。

    '
- fmt: '## Training and Inference


    In Chapter [1](#474993_1_En_1_Chapter.xhtml) you learned that ML is a process
    of discovering patterns in a given data set to make predictions. To do so, we
    need the following entities:


    - *Input data points*: Let’s say we want to classify a student as Pass/Fail. In
    this case, the input data points will be comprised of the marks of various students.

    - *Expected outputs for the given input points*: Continuing our previous example
    of classification, the expected outputs would consist of Pass or Fail.

    - *A learning algorithm*: This is the algorithm that learns how to map input to
    the output and create rules that can be used to deal with new inputs (inference).
    These rules are created by the process called training.


    Let us consider some examples to understand this more clearly.


    *Example 1 (image recognition)*: A model that is learning to identify strollers
    on a street is trained with millions of images of streets. These images are known
    as a training data set. Some of the images contain no pedestrians at all, while
    others have up to 50. Multiple learning algorithms are trained on the data (street
    images), with each having access to the correct answers. Each algorithm develops
    a variety of models to identify strollers on streets. This process is known as
    training. After this, when a new image is fed as an input to the algorithm, it
    will apply the appropriate model and determine the number of strollers in the
    image. This process is known as inference.


    *Example 2 (sorting)*: A model is learning to sort items using visual identification.
    It picks out recyclable items from the lot as it passes on a conveyor belt. It
    places items such as glass, plastic, paper, and metal into their respective bins.
    This process is known as inference. Each item is labeled with an identification
    number. Once a day, human experts examine the bins and inform the robot about
    the items that were incorrectly sorted. The robot uses this feedback to improve.
    This process is known as training.


    *Example 3 (decision making)*: A model is learning to make an estimate of risk
    associated with financial investment. The model is fed a large amount of data
    on the transactions that investors made in the past, along with the outcomes of
    those transactions. Based on this training data, the model calculates the risk-to-reward
    ratio. This is known as training. Now, when the model is fed with certain parameters
    about an investment, it can predict the risk associated with that investment.
    This is known as inference.


    ## Machine Learning Models


    A model, in terms of machine learning, is nothing but a function that takes in
    some input and returns some output. It is generated by the process of training
    and inference, that is, applying a training data set to a learning algorithm.
    The learning algorithm finds patterns in training data that maps the input data
    points in the data set to their corresponding output data points. The algorithm
    then returns an ML model that captures these data patterns.


    Most of the models that you might want to use in your application have some key
    function at their core. Some of the usual functionalities offered by ML models
    (see Figure [2-4](#474993_1_En_2_Chapter.xhtml#Fig4)) are sentiment analysis,
    handwriting recognition, language translation, image classification, style transfer,
    music tagging, and text prediction.


    ![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig4_HTML.jpg](images/474993_1_En_2_Chapter/474993_1_En_2_Fig4_HTML.jpg)


    Figure 2-4


    Key functionalities of ML models


    Core ML supports a variety of models, including neural networks, tree ensembles,
    support vector machines, and linear models. It requires the ML models to be in
    Core ML format, that is, files with a `.mlmodel` file extension. Apple provides
    several open source ML models that are already built in the Core ML framework.
    However, you can create your own custom ML model, convert it into Core ML format,
    and use it in your application.


    In the following part of this chapter, we will learn how to create a simple iOS
    application, and implement an open source ML model in that application.'
