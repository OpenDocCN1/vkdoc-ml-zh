    Figure 3-5: Python commands


    **Step 4**: Now that `pip` is successfully installed on your Mac, you can use
    it to install Turi Create. Open the terminal window and run the following command
    to install the latest version of Turi Create on your machine (see Figure [3-6](#474993_1_En_3_Chapter.xhtml#Fig6)
    for the output):


    ![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig6_HTML.jpg](images/474993_1_En_3_Chapter/474993_1_En_3_Fig6_HTML.jpg)


