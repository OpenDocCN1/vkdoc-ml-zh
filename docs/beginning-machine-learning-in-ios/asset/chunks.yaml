  raw: '### Regression Model


    Now that you know how to work with images as well as text, you might want to implement
    some ML tasks based on tabular data. Such data is normally used when you want
    to do some prediction based on multiple parameters. For instance, it can be used
    to predict the price for a house based on parameters such as neighborhood, total
    area of the house, number of bedrooms and baths, type of garage, number of levels
    the house has, and so on. Let us learn how to do this task using Create ML.


    First of all, we will need the training data in tabular format. I have collected
    some tabular data that gives me the prices for houses in various neighborhoods
    in the United States. Figure [4-29](#474993_1_En_4_Chapter.xhtml#Fig29) shows
    what the data looks like.


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig29_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig29_HTML.jpg)


    Figure 4-29


    Tabular data for regression


    As you can see, the data describes houses in various neighborhoods along with
    their sale price. We will train our model on this data to predict the price of
    a house given the parameters. You can select a different dataset based on your
    preference and requirements. Let us go through the steps to train a regression
    model.


    *Step 1*: Create a folder called **“Dataset”** on your Macbook.


    *Step 2*: Store the tabular training data in a CSV file called **“train.csv.”**
    Figure [4-30](#474993_1_En_4_Chapter.xhtml#Fig30) shows the folder structure.


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig30_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig30_HTML.jpg)


    Figure 4-30


    Dataset for regression model


    *Step 3*: Open Xcode; select **File ➤ New ➤ Playground** in the menu (Figure [4-31](#474993_1_En_4_Chapter.xhtml#Fig31)).


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig31_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig31_HTML.jpg)


    Figure 4-31


    New Playground in Xcode


    *Step 4*: Select the Blank file from the template selection menu (Figure [4-32](#474993_1_En_4_Chapter.xhtml#Fig32)).
    Note that you need to select a blank file under MacOS and not iOS because Create
    ML framework isn’t supported for iOS Playgrounds.


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig32_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig32_HTML.jpg)


    Figure 4-32


    Playground template selection


    *Step 5*: Name it **“HousePricePredictor”** and save it to desktop.


    *Step 6*: Note that as of now, Create MLUI is only available for an Image Classifier
    and not for any other type of ML Model. So, we will have to use Create ML instead
    of Create MLUI. Add the following code to the Playground to import Create ML and
    Foundation:


    ```

    import CreateML

    import Foundation

    ```


    *Step 7*: Define the location of the training dataset by adding the following
    code:


    ```

    let trainingLoc = URL(fileURLWithPath: "/Users/yourusername/Desktop/Dataset/train.csv"     )

    ```


    *Step 8*: Note that Create ML contains a special data structure called MLDataTable
    that makes it easy to deal with tabular data. We will have to create MLDataTables
    for our training data. To do so, add the following code to the Playground:


    ```

    let houseData = try MLDataTable(contentsOf: trainingLoc)

    ```


    *Step 9*: Split some test data from the training data so that we can test the
    model once it is trained. To do so, add the following code:


    ```

    let (trainingData, testData) = houseData.randomSplit(by:0.8, seed: 0)

    ```


    *Step 10*: Define the model by adding the following code:


    ```

    let model = try MLRegressor(trainingData: trainingData, targetColumn: "SalePrice")

    ```


    To begin training, press Shift+Enter. The console at the bottom will show you
    the data for each iteration of training. See Figure [4-33](#474993_1_En_4_Chapter.xhtml#Fig33)
    for reference.


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig33_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig33_HTML.jpg)


    Figure 4-33


    Training regression model using Create ML


    **Step 11:** Now that training is done, you might want to evaluate the model based
    on the test data. To do so, add the following code:


    ```

    let evaluation =     model.testingMetrics(on:testData)

    ```


    To begin testing, press Shift+Enter.


    *Step 12*: Once the evaluation is done, it is time to add some metadata and save
    the model. To do so, add the following code:


    ```

    let modeldata = MLModelMetadata(author: "Mohit Thakkar", shortDescription: "Model
    that     predicts house prices", license: "Open Source",     version: "1.0")

    try model.write(to: URL(fileURLWithPath: "/Users/mohitthakkar/Desktop/HousePricePredictor.mlmodel"),
    metadata: modeldata)

    ```


    Press Shift+Enter and the model will be saved at the path you provided. Your final
    code should be as shown in Figure [4-34](#474993_1_En_4_Chapter.xhtml#Fig34).


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig34_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig34_HTML.jpg)


    Figure 4-34


    Regression model using Create ML


    That’s it. Our model is now ready to predict house prices. If you open the MLModel
    file (Figure [4-35](#474993_1_En_4_Chapter.xhtml#Fig35)), you will notice that
    the model takes in various house parameters such as neighborhood, total area of
    the house, number of bedrooms and baths, type of garage, and number of levels
    the house has, and it returns the house price as an output.


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig35_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig35_HTML.jpg)


    Figure 4-35


    House price predictor


    Now that we have created the regression model, let us create an iOS application
    to see if the model really works. We will create an application that allows users
    to enter the details about their dream house. And on the click of a button, we
    will fetch those details and use our model to predict the price. We will then
    display the house price to the user on the application interface.


    *Step 1*: Open Xcode and create an iOS application project by following the steps
    that you’ve learned previously in this book. You can use the interface shown in
    Figure [4-36](#474993_1_En_4_Chapter.xhtml#Fig36) as a reference.


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig36_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig36_HTML.jpg)


    Figure 4-36


    House price finder application interface


    *Step 2*: Open the **“Main.storyboard”** file to access the application interface.


    *Step 3*: Create outlets for the fields that describe the house and also for the
    label that will display the predicted price for the house. Also create an action
    for the button click event. This will add the following code to your ViewController
    class:


    ```

    @IBOutlet weak var area: UITextField!

    @IBOutlet weak var neighborhood: UITextField!

    @IBOutlet weak var houseStyle: UITextField!

    @IBOutlet weak var fullBaths: UITextField!

    @IBOutlet weak var halfBaths: UITextField!

