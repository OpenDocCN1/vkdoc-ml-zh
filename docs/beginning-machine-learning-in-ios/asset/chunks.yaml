    就是这样！我们刚刚创建了一个 iPhone 应用，它允许用户从照片库中选取图片，并将选中的图片显示在屏幕上。现在该测试我们的应用了。你可以使用工具栏上的运行图标来运行应用。Xcode
    会自动构建应用并在模拟器中运行它（图 2-16）。如果一切正常，你的应用应该能在模拟器中顺利运行。


    ![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig16_HTML.jpg](img/474993_1_En_2_Fig16_HTML.jpg)


    图 2-16


    使用 Xcode 的照片应用


    ## 在应用中使用 Core ML 模型


    Core ML 最精彩的部分在于，它让你能够将预训练模型集成到应用中。即使你对神经网络或机器学习没有深入了解，也能做到这一点。唯一的限制是，模型必须是 Core
    ML 格式才能集成到你的应用中。在本书的这一部分，我们将使用一个已经是 Core ML 格式且可在苹果官网获取的模型。


    我们在本章上一节构建的应用允许用户从设备的照片库中选择图片。现在，我们将在这个应用中集成一个 Core ML 模型，该模型会尝试预测所选图片中物体的标签。为此，我们首先需要下载模型。前往苹果的机器学习开发者网站（[`https://developer.apple.com/machine-learning/build-run-models/`](https://developer.apple.com/machine-learning/build-run-models/)），并滚动到页面底部。你会看到一个区域，列出了所有可免费下载的预训练
    Core ML 模型（图 2-17）。


    ![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig17_HTML.jpg](img/474993_1_En_2_Fig17_HTML.jpg)


    图 2-17


    苹果 Core ML 模型


    我们将在应用中使用的模型是 Inceptionv3。这个模型最初是用 Keras 构建的，并通过 Python 工具转换成了 Core ML 格式。它能够从超过
    1000 个类别（例如树木、动物、食物、车辆、人物、花卉等）中检测图像中的主要物体。请随意使用列表中的其他模型代替 Inceptionv3，因为所有 Core
    ML 模型的处理过程几乎相同。下面我们来看看将这个模型集成到应用中的分步步骤。


    *步骤 1*：首先，我们需要在应用界面上添加一个标签，用于显示所选图片的预测结果。为此，进入界面构建器，减小 imageView 的高度，以便在底部为标签腾出空间。然后，从对象库中拖拽一个标签放到界面上。参考图
    2-18。


    ![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig18_HTML.jpg](img/474993_1_En_2_Fig18_HTML.jpg)


    图 2-18


    更新后的照片应用界面


    *步骤 2*：为新创建的标签添加一个输出口，以便我们稍后可以更改其文本。


    ```

    @IBOutlet weak var classifier: UILabel!

    ```


    *步骤 3*：现在我们已经为预测准备好了界面，接下来让模型开始工作。你将拥有之前从苹果网站下载的 Inceptionv3.mlmodel 文件。将该文件拖拽到
    Xcode 项目导航器中的项目文件夹下。这会将 Core ML 模型添加到你的应用中。


    *步骤 4*：从导航器中选择模型文件，你会注意到 Xcode 会自动识别该文件为 ML 模型。它会显示模型的相关信息，例如模型类型（在我们的例子中是神经网络分类器）、作者详情、模型描述等（图
    2-19）。


    ![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig19_HTML.jpg](img/474993_1_En_2_Fig19_HTML.jpg)


    图 2-19


    Core ML 模型（Inceptionv3）


    它还会显示模型类，该类由 ML 模型自动生成，可以直接在我们的应用中使用。点击类名旁边的箭头，你将能看到模型类的实现代码。


    Xcode 显示的其他重要信息是模型评估参数。这是关于模型接收的输入和返回的输出的信息。在我们的例子中，模型接收一张 299×299 大小的彩色图像作为输入，并返回一个字符串作为输出。


    *步骤 5*：现在，让我们在应用中使用模型类来进行预测。打开 ViewController.swift 文件，并在文件最开头导入 Core ML 框架。


    ```

    import CoreML

    ```


    *步骤 6*：在 ViewController 类中声明一个模型变量，该变量将代表 Core ML 模型。


    ```

    var model:Inceptionv3!

    ```


    *步骤 7*：重写 ViewController 类的 viewWillAppear() 方法，并在该方法中初始化模型。


    ```

    override func viewWillAppear(_ animated: Bool) {

    model = Inceptionv3()

    }

    ```


    *步骤 8*：我们的模型接收的输入是一张 299×299 大小的图像。因此，在用户完成图片选择后，我们需要调整图片大小。我们将在委托方法 imagePickerController()
    中编写相关代码。以下代码将为我们完成这项工作：

    '
- fmt: "### Note\n\nThe numbering in the following lines of code is just added for\
    \ the explanation that follows.\n\n```\n//resize image\n1. UIGraphicsBeginImageContextWithOptions(CGSize(width:\
    \ 299, height: 299), true, 2.0)\n2. pickedImage.draw(in: CGRect(x: 0, y: 0, width:\
    \ 299, height: 299))\n3. let newImage = UIGraphicsGetImageFromCurrentImageContext()!\n\
    4. UIGraphicsEndImageContext()\n5. let attrs = [kCVPixelBufferCGImageCompatibilityKey:\
    \ kCFBooleanTrue, kCVPixelBufferCGBitmapContextCompatibilityKey: kCFBooleanTrue]\
    \ as CFDictionary\n6. var pixelBuffer : CVPixelBuffer?\n7. let status = CVPixelBufferCreate(kCFAllocatorDefault,\
    \ Int(newImage.size.width), Int(newImage.size.height), kCVPixelFormatType_32ARGB,\
    \ attrs, &pixelBuffer)\n8. guard (status == kCVReturnSuccess) else {\n9. return\n\
    10. }\n11. CVPixelBufferLockBaseAddress(pixelBuffer!, CVPixelBufferLockFlags(rawValue:\
    \ 0))\n12. let pixelData = CVPixelBufferGetBaseAddress(pixelBuffer!)\n13. let\
    \ rgbColorSpace = CGColorSpaceCreateDeviceRGB()\n14. let context = CGContext(data:\
    \ pixelData, width: Int(newImage.size.width), height: Int(newImage.size.height),\
    \ bitsPerComponent: 8, bytesPerRow: CVPixelBufferGetBytesPerRow(pixelBuffer!),\
    \ space: rgbColorSpace, bitmapInfo: CGImageAlphaInfo.noneSkipFirst.rawValue)\n\
    15. context?.translateBy(x: 0, y: newImage.size.height)\n16. context?.scaleBy(x:\
    \ 1.0, y: -1.0)\n17. UIGraphicsPushContext(context!)\n18. newImage.draw(in: CGRect(x:\
    \ 0, y: 0, width: newImage.size.width, height: newImage.size.height))\n19. UIGraphicsPopContext()\n\
    20. CVPixelBufferUnlockBaseAddress(pixelBuffer!, CVPixelBufferLockFlags(rawValue:\
    \ 0))\n```\n\nNow, let us understand what is happening in the preceding code.\
    \ Since our model accepts an input image of size 299×299, lines 1-4 convert the\
    \ selected image to that size and assign it to a new variable called `newImage`.\n\
    \nIt is important to know that the model accepts an input image in form of pixels.\
    \ Hence, lines 5-10 store the `newImage` in the form of a pixel buffer, which\
    \ basically holds the image in the form of pixels in the memory. This buffer will\
    \ be supplied as an input for prediction.\n\nThen, all the pixels present in the\
    \ image are converted into device-dependent RGB color space. Lines 11-13 do that.\
    \ In line 14, we store the pixel data in `CGContext` so that we can easily modify\
    \ some properties of the image pixels. We then scale the image as per our requirement\
    \ in lines 15-16. Lines 17-20 update the final image buffer.\n\nNote that it’s\
    \ okay if you do not understand most parts of this code. The only thing you need\
    \ to know is that we took the picture that the user selected from the photo library\
    \ and converted it into a form that the model accepts for prediction.\n\n**Step\
    \ 9**: Finally, it’s time to call the prediction method of the model that will\
    \ do the image prediction for us. Add the following code in the delegate method\
    \ `imagePickerController()` right after the image resizing code.\n\n```\n//predict\
    \ image label\nguard let prediction = try? model.prediction(image: pixelBuffer!)\
    \ else {\n    classifier.text = \"Can't Predict!\"\n    return\n}\nclassifier.text\
    \ = \"This is probably \\(prediction.classLabel).\"\n```\n\nThe prediction method\
    \ is supplied with the pixel buffer as a parameter. If the prediction is successful,\
    \ the method returns an object that gives us the output label. We set this output\
    \ label text to the classifier label that we added to the interface earlier. If\
    \ the prediction is not successful, we manually set the classifier label text\
    \ to let the user know that the model was unable to predict the label for the\
    \ selected image.\n\n**Step 10**: It is finally time to build and run the application.\
    \ Let us find out how well our first ML application does. Figures [2-20](#474993_1_En_2_Chapter.xhtml#Fig20)\
    \ to Figure [2-24](#474993_1_En_2_Chapter.xhtml#Fig24) show different screens\
    \ that you should see while playing around with your application.\n\n![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig24_HTML.jpg](images/474993_1_En_2_Chapter/474993_1_En_2_Fig24_HTML.jpg)\n\
    \nFigure 2-24\n\nPhotos application prediction (E)\n\n![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig23_HTML.jpg](images/474993_1_En_2_Chapter/474993_1_En_2_Fig23_HTML.jpg)\n\
    \nFigure 2-23\n\nPhotos application prediction (D)\n\n![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig22_HTML.jpg](images/474993_1_En_2_Chapter/474993_1_En_2_Fig22_HTML.jpg)\n\
    \nFigure 2-22\n\nPhotos application prediction (C)\n\n![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig21_HTML.jpg](images/474993_1_En_2_Chapter/474993_1_En_2_Fig21_HTML.jpg)\n\
    \nFigure 2-21\n\nPhotos application prediction (B)\n\n![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig20_HTML.jpg](images/474993_1_En_2_Chapter/474993_1_En_2_Fig20_HTML.jpg)\n\
    \nFigure 2-20\n\nPhotos application prediction (A)\n\n## Summary\n\n- Core ML\
    \ is a framework by Apple that can be used to develop machine learning applications\
    \ for Apple products such as iPhone, iPad, MacBook, Apple TV, and Apple Watch.\n\
    - Core ML allows developers to use pretrained ML models, which are already in\
    \ Core ML format, to implement ML functionalities in their applications.\n- Core\
    \ ML also allows developers to convert custom ML models into Core ML format to\
    \ use it their applications.\n- Core ML integrates the model within the application\
    \ package so that the ML algorithms can run locally instead of remotely. This\
    \ results in faster processing speeds.\n- Core ML is based on Apple’s previous\
    \ frameworks—Accelerate and Metal Performance Shaders (MPS)—that act as performance\
    \ primitives.\n- The major components of Core ML are:\n  - *Vision*: Classification\
    \ of images and videos\n  - *Natural Language*: Text-based prediction and sentiment\
    \ analysis\n  - *GameplayKit*: Implements gameplay behavior\n- An ML model can\
    \ be trained using input data points, output for each input data point, and a\
    \ learning algorithm that maps the input data points to their corresponding output.\
    \ Once trained, a model can be used for inference.\n- The usual functionalities\
    \ offered by ML models are sentiment analysis, handwriting recognition, language\
    \ translation, image classification, text prediction, and so on.\n\n# 3. Custom\
    \ Core ML Models Using Turi Create\n\nIn Chapter [2](#474993_1_En_2_Chapter.xhtml),\
    \ you learned how to use pretrained machine learning models in your application.\
    \ In this chapter, you will learn how to train your own model with a third-party\
    \ framework using Turi Create. You will also find a step-by-step guide on how\
    \ to convert this trained model into the Core ML format and use it in your application.\n\
    \n## Necessity for a Custom Model\n\nAn ML model can be thought of as a piece\
    \ of code that we use to add intelligent user experiences in our application.\
    \ As we learned in Chapter [2](#474993_1_En_2_Chapter.xhtml), an ML model can\
    \ be used to perform a variety of tasks; and just like any other piece of code,\
    \ there is no single model that can be used to carry out all the intelligent tasks.\
    \ For instance, consider the following tasks that you might want to implement\
    \ in your application:\n\n- Ability to take a picture of your food and know how\
    \ many calories you are consuming\n- Changing the presentation slides on a TV\
    \ screen with a simple gesture on your iPhone\n- Tracking an object in real time\n\
    - Trying out artistic filters on photographs\n- Categorizing the music files as\
    \ per their genres\n\nThis is just a small list; there are an endless number of\
    \ intelligent tasks that you might want your application to perform. All these\
    \ tasks demonstrate very different user experiences; hence there is no single\
    \ ML model that can accommodate all of these tasks. This is where the need for\
    \ a custom model arises. All these tasks have some things in common—the fact that\
    \ they all use ML and they all require very little data to implement them in our\
    \ application. Hence, we can create a custom ML model for each of the tasks that\
    \ we want to perform."
