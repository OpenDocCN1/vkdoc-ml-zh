    ### About the Author and About the Technical Reviewer


    ### About the Author


    ### About the Technical Reviewer


    # 1. Introduction to Machine Learning


    This chapter provides a basic explanation of the concept of machine learning (ML)
    along with information about its applications, types of ML, how it works, and
    why we need it. Even if you are a novice to the concept, this chapter should help
    you with the information you need to get started with ML. It is a fun chapter,
    with lots of pictures and examples to help you understand the text.


    ## What Is Machine Learning?


    In the past few years, ML, also referred to as automated learning, has been one
    of the fastest growing areas in the field of computer science and information
    technology. As the term suggests, machine learning is a process during which a
    machine learns about significant patterns in a given set of input data. Now you
    might be wondering what the word “pattern” means in this context. Consider Figure
    [1-1](#474993_1_En_1_Chapter.xhtml#Fig1) to get a clearer idea.


    ![../images/474993_1_En_1_Chapter/474993_1_En_1_Fig1_HTML.jpg](images/474993_1_En_1_Chapter/474993_1_En_1_Fig1_HTML.jpg)


    Figure 1-1


    Data patterns


    This figure demonstrates a mapping of four sets of data points on their corresponding
    graphs. As we do that, the data points in the data set form a unique pattern.
    The patterns observed in the figure are Stable, Ascending, Descending, and Variable.
    Learning about such data patterns can be used to develop an algorithm that helps
    the machine to adapt and react appropriately when it encounters alien data. The
    goal of ML is to make a machine react automatically to alien data based on the
    learning. For instance, if the machine observes that the given data set forms
    a stable pattern where data points deviate from -1 to +1, it can predict the value
    of the next data point that will be added to the data set.


    To sum it up, ML is the process of creating programs that learn from data and
    make predictions. Some of the well-known ML models are as follows:


    ![../images/474993_1_En_1_Chapter/474993_1_En_1_Fig5_HTML.jpg](images/474993_1_En_1_Chapter/474993_1_En_1_Fig5_HTML.jpg)


    Figure 1-5


    Decision tree


    *   *Decision tree*: It uses a tree-like graph that predicts the item’s target
    value based on observations about the item. Figure [1-5](#474993_1_En_1_Chapter.xhtml#Fig5)
    demonstrates a decision tree that helps you make the decision of accepting or
    rejecting a job offer.


    ![../images/474993_1_En_1_Chapter/474993_1_En_1_Fig4_HTML.png](images/474993_1_En_1_Chapter/474993_1_En_1_Fig4_HTML.png)


    Figure 1-4


    Artificial neural network


    *   *Artificial neural network (ANN)*: It is an interconnected network of nodes
    that is designed to process information in the same way as a human brain does
    it. The information is stored in an ANN in the form of interconnections between
    nodes. It takes in the input, processes the input based on the stored information,
    and generates the output. Figure [1-4](#474993_1_En_1_Chapter.xhtml#Fig4) shows
    the interconnections between nodes in an ANN.


    ![../images/474993_1_En_1_Chapter/474993_1_En_1_Fig3_HTML.png](images/474993_1_En_1_Chapter/474993_1_En_1_Fig3_HTML.png)


    Figure 1-3


    Support vector machine


    *   *Support vector machine (SVM)*: It is a classifier that is formally defined
    by a separating hyperplane. Given some labeled training data, the SVM algorithm
    outputs an optimal hyperplane that categorizes new examples. In two-dimensional
    space, this hyperplane is a line dividing a plane in two parts. Consider Figure
    [1-3](#474993_1_En_1_Chapter.xhtml#Fig3) to get a better idea.


    ![../images/474993_1_En_1_Chapter/474993_1_En_1_Fig2_HTML.png](images/474993_1_En_1_Chapter/474993_1_En_1_Fig2_HTML.png)


    Figure 1-2


    Ensemble learning


    *   *Ensemble learning*: Combination of several ML algorithms (classifiers) to
    obtain a better predictive performance as compared with any one ML algorithm alone.
    Figure [1-2](#474993_1_En_1_Chapter.xhtml#Fig2) shows the flow of control in ensemble
    learning.'
