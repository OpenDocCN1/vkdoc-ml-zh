  trans: '

    ### 文本分类


    现在你已经了解了如何处理图像，你可能希望基于文本数据（自然语言）实现一些机器学习任务。这类任务包括情感分析、垃圾邮件过滤、主题分析等。这些任务通常被称为文本分类任务，而执行这些任务的机器学习模型则被称为文本分类器。接下来，我们将学习如何创建一个能够通过分类文本片段来执行情感分析的机器学习模型。


    为此，我们首先需要一些数据作为训练模型的基础。这些数据可以通过以下形式提供：


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig14_HTML.jpg](img/474993_1_En_4_Fig14_HTML.jpg)


    图 4-14


    用于训练的文本数据


    *   **原始文本文件**：你可以像图像分类器示例中那样创建带标签的目录。每个带标签的目录都包含原始文本文件，其中的文本内容与标签相符。请参考图 4-14
    中的示例。


    这里，我们有两个带标签的目录：一个用于正面数据，一个用于负面数据。标有“加号”的目录包含正面文本的原始文章，而标有“减号”的目录则包含负面文本的原始文章。


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig15_HTML.jpg](img/474993_1_En_4_Fig15_HTML.jpg)


    图 4-15


    用于训练的 CSV 数据


    *   **CSV 文件**：另一种组织训练数据的方式是创建一个 CSV（逗号分隔值）文件。在这里，所有数据都包含在一个单独的文件中，而不是分散在多个文件中。请参考图
    4-15 中的示例。


    这里，我们有一个单独的文件，其中包含原始文本条目及其对应的真实标签，两者用逗号分隔。该文件可以独立用于训练我们的机器学习模型。


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig16_HTML.jpg](img/474993_1_En_4_Fig16_HTML.jpg)


    图 4-16


    用于训练的 JSON 数据


    *   **JSON 文件**：JSON 代表 JavaScript 对象表示法。它是 CSV 的一种替代数据格式。与 CSV 文件一样，JSON 文件也将所有数据包含在一个单独的文件中。它使用键值对来表示带标签的数据。请参考图
    4-16 中的示例以获得更清晰的理解。


    这里，每条数据有两个键：“Text”表示数据内容，“Label”表示对应数据的真实标签。该文件也可以独立用于训练我们的机器学习模型。


    现在我们已经了解了可用于训练文本分类模型的数据类型，接下来让我们学习训练过程中涉及的典型步骤。以下是训练文本分类器的典型工作流程步骤（如图 4-17 所示）：


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig17_HTML.jpg](img/474993_1_En_4_Fig17_HTML.jpg)


    图 4-17


    训练文本分类器的典型工作流程


    *   **原始数据**：首先，我们收集用于训练的原始数据。


    *   **语言识别**：然后，我们从原始文本中识别出语言。


    *   **生成词元**：接着，我们需要从文本中生成词元，学习算法会将这些词元与某些标签进行映射。


    *   **应用学习算法**：学习算法将词元作为输入，并对它们进行一些处理。


    *   **获取预测标签**：然后，学习算法会给出输入词元的预测标签。


    *   **与真实标签比较**：现在，我们将预测标签与原始文本的实际标签进行比较。


    *   **重复迭代**：如果预测不够准确，我们将重复训练过程。


    *   **生成模型**：如果预测足够准确，我们将生成模型。

    '
- fmt: 'However, using Create ML, all the complexities involved in the process can
    be reduced to very few, simple steps. Let us learn how to create, using Create
    ML, a text classifier that returns `"Positive"` if the input text is optimistic
    and returns `"Negative"` if the input text is pessimistic. To do so, we will first
    collect and organize our data.


    *Step 1*: Create two folders: `"MyDataset"` and `"MyTestDataset"` on your Macbook.


    *Step 2*: Create two subfolders: `"Positive"` and `"Negative"` for each of the
    two folders created in the previous step.


    *Step 3*: Inside the folders named `"Positive"`, put some text files that contain
    sample positive comments. Inside folders named `"Negative"`, put some text files
    that contain sample negative comments. Refer to Figure [4-18](#474993_1_En_4_Chapter.xhtml#Fig18)
    for the folder structure.


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig18_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig18_HTML.jpg)


    Figure 4-18


    Dataset for text classifier


    That’s it. We now have the dataset required to train our model to perform the
    text classification task. Let us now train the model using the assembled data.


    *Step 1*: Open Xcode; select **File ➤ New ➤ Playground** in the menu (Figure [4-19](#474993_1_En_4_Chapter.xhtml#Fig19)).


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig19_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig19_HTML.jpg)


    Figure 4-19


    New Playground in Xcode


    *Step 2*: Select the Blank file from the template selection menu (Figure [4-20](#474993_1_En_4_Chapter.xhtml#Fig20)).
    Note that you need to select a blank file under MacOS and not iOS because Create
    ML framework isn’t supported for iOS Playgrounds.


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig20_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig20_HTML.jpg)


    Figure 4-20


    Playground template selection


    *Step 3*: Name it `"SentimentAnalyzer"` and save it to desktop.


    *Step 4*: Note that as of now, Create MLUI is only available for an Image Classifier
    and not for any other type of ML Model. So, we will have to use Create ML instead
    of Create MLUI. Add the following code to the Playground to import Create ML and
    Foundation:


    ```

    import CreateML

    import Foundation

    ```


    *Step 5*: Define the location of the training dataset and test dataset by adding
    the following code:


    ```

    let trainingLoc = URL(fileURLWithPath: "/Users/yourusername/Desktop/MyDataset"
    )

    let testLoc = URL(fileURLWithPath: "/Users/yourusername/Desktop/MyTestDataset")

    ```


    *Step 6*: Define the model by adding the following code:


    ```

    let model = try MLTextClassifier(trainingData: .labledDirectories(at: trainingLoc))

    ```


    To begin training, press `Shift+Enter`. The console at the bottom will show you
    the number of training iterations and the accuracy for each iteration. See Figure
    [4-21](#474993_1_En_4_Chapter.xhtml#Fig21) for reference.


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig21_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig21_HTML.jpg)


    Figure 4-21


    Training text classifier using Create ML


    *Step 7*: Now that training is done, you might want to evaluate the model based
    on the test data. To do so, add the following code:


    ```

    let evaluation = model.evaluation(on: .labledDirectories(at: testLoc))

    ```


    To begin testing, press `Shift+Enter`.


    *Step 8*: Once the evaluation is done, it is time to save the model. To do so,
    add the following code:


    ```

    try model.write(to: URL(fileURLWithPath: "/Users/yourusername/Desktop/SentimentAnalyzer.mlmodel"))

    ```


    Press `Shift+Enter` and the model will be saved at the path you provided. Your
    final code should be as in Figure [4-22](#474993_1_En_4_Chapter.xhtml#Fig22).


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig22_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig22_HTML.jpg)


    Figure 4-22


    Text classifier using Create ML


    If you have successfully executed the code, you will find an ML model named `"SentimentAnalyzer"`
    on your desktop (Figure [4-23](#474993_1_En_4_Chapter.xhtml#Fig23)).'
