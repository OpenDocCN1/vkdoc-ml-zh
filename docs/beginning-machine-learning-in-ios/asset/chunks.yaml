    an image from the photo library and displays the selected image on the screen.
    It’s time to test our application. You can run the application using the run icon
    on the toolbar. Xcode automatically builds the app and runs it in the simulator
    (Figure [2-16](#474993_1_En_2_Chapter.xhtml#Fig16)). If everything is fine, your
    app should run properly in the simulator.


    ![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig16_HTML.jpg](images/474993_1_En_2_Chapter/474993_1_En_2_Fig16_HTML.jpg)


    Figure 2-16


    Photos application using Xcode


    ## Using a Core ML Model in Your Application


    The most wonderful part about Core ML is that it lets you integrate pretrained
    models in your application. And this can be done even if you do not have an extensive
    knowledge about neural networks or ML. The only constraint is that the model should
    be in Core ML format to integrate it in your application. In this part of the
    book, we will use a model that is already in Core ML format and is available on
    Apple’s website.


    The application that we built in the previous section of this chapter lets the
    user select a picture from their device’s photo library. We will now integrate
    a Core ML model in this application, which will try to predict the label for the
    object in the selected picture. To do so, we will need to first download the model.
    Go to Apple’s Developer website on ML ( [`https://developer.apple.com/machine-learning/build-run-models/`](https://developer.apple.com/machine-learning/build-run-models/)
    ) and scroll to the bottom of the page. You will see a section listing all the
    pretrained Core ML models that are available to download for free (Figure [2-17](#474993_1_En_2_Chapter.xhtml#Fig17)).


    ![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig17_HTML.jpg](images/474993_1_En_2_Chapter/474993_1_En_2_Fig17_HTML.jpg)


    Figure 2-17


    Apple Core ML models


    The model that we will be using for our application is Inceptionv3\. This model
    is originally built using Keras and is converted to Core ML format using Python
    tools. It detects presiding objects in an image from more than 1,000 categories
    such as trees, animals, food, vehicles, people, flowers, and so on. Please feel
    free to use any other model from the list instead of Inceptionv3, as the process
    is almost similar for all the Core ML Models. Let us see a step-by-step procedure
    to integrate this model in our application.


    *Step 1*: First, we will need to add a label to the application interface to display
    the prediction for the selected image. To do so, go to the interface builder and
    decrease the height of the imageView to make space for the label at the bottom.
    Now drag and drop a label from the object library into the interface. See Figure
    [2-18](#474993_1_En_2_Chapter.xhtml#Fig18) for reference.


    ![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig18_HTML.jpg](images/474993_1_En_2_Chapter/474993_1_En_2_Fig18_HTML.jpg)


    Figure 2-18


    Photos application updated interface


    *Step 2*: Add an outlet for the newly created label so that we can change its
    text later.


    ```

    @IBOutlet weak var classifier: UILabel!

    ```


    *Step 3*: Now that we have prepared the interface for the prediction, let us put
    the model to work. You will have the Inceptionv3.mlmodel file that you downloaded
    from the Apple website previously. Drag and drop that file under your project
    folder in the Xcode project navigator. This will add the Core ML model in your
    application.


    *Step 4*: Select the model file from the navigator and you will notice that the
    Xcode automatically recognizes the file as an ML model. It displays information
    about the model such as type of the model (which in our case is Neural Network
    Classifier), the author details, model description, and so on (Figure [2-19](#474993_1_En_2_Chapter.xhtml#Fig19)).


    ![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig19_HTML.jpg](images/474993_1_En_2_Chapter/474993_1_En_2_Fig19_HTML.jpg)


    Figure 2-19


    Core ML model (Inceptionv3)


    It also displays the Model Class, which is automatically generated from the ML
    model and can be directly used in our application. Click the arrow next to the
    class name and you will be able to see the implementation code of the model class.


    Other important information that the Xcode displays is the Model Evaluation Parameters.
    This is the information about the input that the model takes in and the output
    that it returns. In our case, the model takes in a colored image of size 299×299
    as an input and it returns a string as output.


    *Step 5*: Now let us use the model class in our application to make predictions.
    Go to the ViewController.swift file and import the Core ML framework in the very
    beginning.


    ```

    import CoreML

    ```


    *Step 6*: Declare a model variable in the ViewController class that will represent
    the Core ML model.


    ```

    var model:Inceptionv3!

    ```


    *Step 7*: Override the viewWillAppear() method of the ViewController class and
    initialize the model in that method.


    ```

    override func viewWillAppear(_ animated: Bool) {

    model = Inceptionv3()

    }

    ```


    *Step 8*: The input that our model takes in is an image of size 299×299\. Thus,
    we will need to resize the image after the user is done selecting the image. We
    will write the code for this in the delegate method imagePickerController(). The
    following code will do the job for us:'
