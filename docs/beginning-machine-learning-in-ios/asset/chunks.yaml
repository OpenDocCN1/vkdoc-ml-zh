  trans: '

    ## 训练与推理


    在第 1 章中，你已经了解到机器学习是一个在给定数据集中发现模式以进行预测的过程。为此，我们需要以下实体：


    *   *输入数据点*：假设我们要将学生分类为“通过/未通过”。在这种情况下，输入数据点将由不同学生的分数组成。


    *   *给定输入点的预期输出*：继续我们之前的分类示例，预期输出将包括“通过”或“未通过”。


    *   *学习算法*：这是一种学习如何将输入映射到输出，并创建可用于处理新输入（推理）的规则的算法。这些规则是通过称为训练的过程创建的。


    让我们考虑一些例子来更清楚地理解这一点。


    *示例 1（图像识别）*：一个正在学习识别街道上婴儿车的模型，使用数百万张街道图像进行训练。这些图像被称为训练数据集。其中一些图像完全没有行人，而另一些则多达
    50 人。多个学习算法在这些数据（街道图像）上进行训练，每个算法都能访问正确答案。每个算法都会开发出不同的模型来识别街道上的婴儿车。这个过程被称为训练。之后，当一张新图像作为输入提供给算法时，它将应用适当的模型并确定图像中婴儿车的数量。这个过程被称为推理。


    *示例 2（分拣）*：一个模型正在学习使用视觉识别来分拣物品。当物品在传送带上经过时，它会从一堆物品中挑出可回收物品。它将玻璃、塑料、纸张和金属等物品放入各自的回收箱中。这个过程被称为推理。每个物品都贴有一个识别号码。每天一次，人类专家检查回收箱，并告知机器人哪些物品被错误分拣。机器人利用这些反馈进行改进。这个过程被称为训练。


    *示例 3（决策制定）*：一个模型正在学习评估与金融投资相关的风险。该模型被输入大量关于投资者过去进行的交易以及这些交易结果的数据。基于这些训练数据，模型计算风险回报比。这被称为训练。现在，当模型被输入关于某项投资的特定参数时，它可以预测与该投资相关的风险。这被称为推理。


    ## 机器学习模型


    在机器学习中，模型不过是一个接收输入并返回输出的函数。它通过训练和推理的过程生成，即将训练数据集应用于学习算法。学习算法在训练数据中寻找模式，这些模式将数据集中的输入数据点映射到它们对应的输出数据点。然后，算法返回一个捕获这些数据模式的机器学习模型。


    你可能希望在应用程序中使用的大多数模型，其核心都具备一些关键功能。机器学习模型提供的一些常见功能（见图 2-4）包括情感分析、手写识别、语言翻译、图像分类、风格迁移、音乐标记和文本预测。


    ![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig4_HTML.jpg](img/474993_1_En_2_Fig4_HTML.jpg)


    图 2-4


    机器学习模型的关键功能


    Core ML 支持多种模型，包括神经网络、树集成、支持向量机和线性模型。它要求机器学习模型采用 Core ML 格式，即扩展名为 `.mlmodel` 的文件。Apple
    提供了几个已内置于 Core ML 框架中的开源机器学习模型。但是，你也可以创建自己的自定义机器学习模型，将其转换为 Core ML 格式，并在你的应用程序中使用。


    在本章的后续部分，我们将学习如何创建一个简单的 iOS 应用程序，并在该应用程序中实现一个开源机器学习模型。

    '
- fmt: '# Beginning with Xcode


    Tightly integrated with the Core ML framework, Xcode is an incredibly productive
    IDE (integrated development environment) by Apple that’s used to build applications
    for MacBook, iPhone, iPad, Apple Watch, and Apple TV.


    Following are the configurations that we’ll be using as a general development
    practice for this chapter:


    - *Xcode*: version 9.4.1 or later

    - *Deploy SDK*: version 11.4 or later

    - *Programming language*: Swift 4 or later

    - *Simulator*: iPhone 8 Plus or later


    Assuming that you are familiar with the Mac environment and you have Xcode installed
    on your MacBook, let us begin building our first iOS application.


    *Step 1*: Launch Xcode. It should display a welcome dialog (Figure [2-5](#474993_1_En_2_Chapter.xhtml#Fig5)).
    From here, choose “Create a new Xcode project” to start a new project.


    ![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig5_HTML.jpg](images/474993_1_En_2_Chapter/474993_1_En_2_Fig5_HTML.jpg)


    Figure 2-5 Xcode welcome dialog


    *Step 2*: Xcode shows you various devices and project templates for your application
    (Figure [2-6](#474993_1_En_2_Chapter.xhtml#Fig6)). Choose your target device and
    appropriate template (Single View App). Then click “Next.”


    ![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig6_HTML.jpg](images/474993_1_En_2_Chapter/474993_1_En_2_Fig6_HTML.jpg)


    Figure 2-6 Xcode template selection


    *Step 3*: This brings you to another screen to fill in all the necessary options
    for your project (Figure [2-7](#474993_1_En_2_Chapter.xhtml#Fig7)). The options
    include the following:


    ![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig7_HTML.jpg](images/474993_1_En_2_Chapter/474993_1_En_2_Fig7_HTML.jpg)


    Figure 2-7 Xcode project options


    - *Product Name*: The name of your application.

    - *Organization Name*: You can fill in this box with your company’s name.

    - *Organization Identifier*: This is the domain name written in reverse order.
    If you have a domain, you can use your own domain name.

    - *Class Prefix*: Xcode uses the class prefix to name the class automatically.
    You can choose your own prefix or leave it blank.

    - *Devices*: Select the device on which you want your application to run.


    *Step 4*: Xcode then asks you where you want to save your project (Figure [2-8](#474993_1_En_2_Chapter.xhtml#Fig8)).
    Pick any folder (e.g., Desktop) on your Mac and click “Create.”


    ![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig8_HTML.jpg](images/474993_1_En_2_Chapter/474993_1_En_2_Fig8_HTML.jpg)


    Figure 2-8 Xcode folder picker


    *Step 5*: As you confirm, Xcode automatically creates your project based on all
    the options you provided. The next screen will look similar to Figure [2-9](#474993_1_En_2_Chapter.xhtml#Fig9).


    ![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig9_HTML.jpg](images/474993_1_En_2_Chapter/474993_1_En_2_Fig9_HTML.jpg)


    Figure 2-9 Xcode main window


    Before moving on to the code segment, let us familiarize ourselves with the Xcode
    workspace (Figure [2-10](#474993_1_En_2_Chapter.xhtml#Fig10)).


    ![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig10_HTML.jpg](images/474993_1_En_2_Chapter/474993_1_En_2_Fig10_HTML.jpg)


    Figure 2-10 Xcode workspace


    - On the left pane, it’s the project navigator. You can find all your files under
    this area.

    - The center part of the workspace is the editor area.

    - The rightmost pane is the utility area. This area displays the properties of
    the file and allows you to access Quick Help.

    - There’s a toolbar at the top that provides various functions for you to run
    your app, switch editor, and so on.


    *Step 6*: In the project navigator area, you will find a file that goes by the
    name `MainStoryboard.storyboard`. Select this file and you will notice that the
    editor area changes to an interface builder (Figure [2-11](#474993_1_En_2_Chapter.xhtml#Fig11))
    that shows an empty screen for your application.


    ![../images/474993_1_En_2_Chapter/474993_1_En_2_Fig11_HTML.jpg](images/474993_1_En_2_Chapter/474993_1_En_2_Fig11_HTML.jpg)


    Figure 2-11 Xcode interface builder


    *Step 7*: In the lower part of the utility area, you’ll find the object library.
    From here, you can choose any of the UI controls and drag-and-drop it into the
    view. Let us pick “Label” and drag it into the view. You can change the text of
    the label from the object attributes in the utility area. You can also add positioning
    constraints as per your requirements for proper structuring of the UI elements.


    *Step 8*: Now it’s time to test your app. You can run it using the run icon on
    the toolbar. Xcode automatically builds the app and runs it in the simulator.
    If everything is fine, your app should run properly in the simulator.


    That’s it! We just created our first iOS application. In the following section
    we’ll learn to integrate an open-source ML model in this application.'
