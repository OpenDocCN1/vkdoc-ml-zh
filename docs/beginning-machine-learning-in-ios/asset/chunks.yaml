    ## Training and Evaluating a Custom Model


    Following are the steps to create a custom ML model using Turi Create:


    **Step 1**: Open Xcode; select **File ➤ New ➤ File** in the menu (Figure [3-7](#474993_1_En_3_Chapter.xhtml#Fig7)).


    ![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig7_HTML.jpg](images/474993_1_En_3_Chapter/474993_1_En_3_Fig7_HTML.jpg)


    Figure 3-7: New file in Xcode


    **Step 2**: Select Blank file from template selection menu (Figure [3-8](#474993_1_En_3_Chapter.xhtml#Fig8)).


    ![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig8_HTML.jpg](images/474993_1_En_3_Chapter/474993_1_En_3_Fig8_HTML.jpg)


    Figure 3-8: Xcode template selection


    **Step 3**: Name the file `MyCustomModel.py`


    **Step 4**: Save it to desktop.


    **Step 5**: Import Turi Create by adding the following line of code:


    ```

    import turicreate as tc

    ```


    **Step 6**: Define the path for the training dataset by adding the following code:


    ```

    url = "dataset/"

    ```


    **Step 7**: Add the following code to search and load images from the dataset
    folder:


    ```

    data = tc.load_images(url)

    ```


    **Step 8**: Now we will define the image category and save it in the `dogBreed`
    property. We will fetch the folder name from the path of the image to determine
    the image category. To do so, add the following code:


    ```

    data["dogBreed"] = data["path"].apply(lambda path: path.split(''/'')[1])

    ```


    This will create a labeled dataset where each image in our training dataset will
    have a path and a property called `dogBreed`.


    **Step 9**: Now, we will save the new labeled dataset as an SFrame. This SFrame
    will be used to train the data. Add the following code to save the dataset as
    an SFrame:


    ```

    data.save("dogBreed.sframe")

    ```


    **Step 10**: Let us preview the new labeled data on Turi Create. To do so, add
    the following code:


    ```

    data.explore()

    ```


    **Step 11**: To load the SFrame for training purposes, write the following code:


    ```

    dataBuffer = tc.SFrame("dogBreed.sframe")

    ```


    **Step 12**: Now we will train the model using 90% of the data and test the model
    using the remaining 10% of the data. To do so, write the following code:


    ```

    trainingBuffers, testingBuffers = dataBuffer.random_split(0.9)

    model = tc.image_classifier.create(trainingBuffers, target="dogBreed", model="squeezenet_v1.1")

    ```


    Here, we are training our model on top of the `Squeezenet` model that already
    exists. You can use other models like `ResNet-50` for more accuracy.


    **Step 13**: It is now time to evaluate the test data to determine the accuracy
    of the model. To do so, add the following code:


    ```

    evaluations = model.evaluate(testingBuffers)

    print evaluations["accuracy"]

    ```


    **Step 14**: Finally, add the following code to save the model and export it to
    the Core ML format:


    ```

    model.save("dogBreed.model")

    model.export_CoreML("dogBreed.mlmodel")

    ```


    Your final code for `MyCustomModel.py` should be as in Figure [3-9](#474993_1_En_3_Chapter.xhtml#Fig9).


    ![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig9_HTML.jpg](images/474993_1_En_3_Chapter/474993_1_En_3_Fig9_HTML.jpg)


    Figure 3-9: `MyCustomModel` Python code


    To execute this code, open the Terminal app on your Mac and change the current
    directory to the location of your Python file. Then execute the code using the
    following command:


    ```

    python MyCustomModel.py

    ```


    It might take several minutes while the Python code is executing. First, the code
    will load the images from the dataset into the memory, then the images will be
    labeled based on the folder they reside in, and then they will be converted to
    an SFrame that will be used for training. Note that you do not need to explicitly
    do anything; the process will automatically start once you have executed the Python
    code in the terminal window. All you need to do is sit back and wait for the code
    to give you a Core ML model. The terminal screen in Figure [3-10](#474993_1_En_3_Chapter.xhtml#Fig10)
    shows the process.


    ![../images/474993_1_En_3_Chapter/474993_1_En_3_Fig10_HTML.jpg](images/474993_1_En_3_Chapter/474993_1_En_3_Fig10_HTML.jpg)


    Figure 3-10: Loading images and creating an SFrame'
