    ```

    CoreML_model = Core MLtools.converters.caffe.convert

    (caffe_model, class_labels = labels)

    ```


    *第 11 步*：最后，我们可以通过将以下代码添加到我们的文件中来保存转换后的模型：


    ```

    CoreML_model.save(''MyCustomModel.mlmodel'')

    ```


