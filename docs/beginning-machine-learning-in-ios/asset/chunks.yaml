- fmt: '### Text Classification


    Now that you know how to work with images, you might want to implement some ML
    tasks based on textual data (natural language). Such tasks include sentiment analysis,
    spam filtering, topic analysis, and so on. These tasks are commonly known as text
    classification tasks and the ML model that performs these tasks is known as a
    text classifier. Here, we will learn how to create an ML model that can perform
    sentiment analysis by classifying a piece of text.


    To do so, we will first need some data on the basis of which we can train our
    model. Such data can be provided in the following forms:


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig14_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig14_HTML.jpg)


    **Figure 4-14** – Textual data for training


    - **Raw text files**: You can create labeled directories just like you did for
    the image classifier example. Each of these labeled directories will contain raw
    text files containing text that justifies the label. Consider the example in Figure
    4-14.


    Here, we have two labeled directories: one for positive data and one for negative
    data. The one with the “plus” label contains raw text articles containing positive
    texts, while the one with the “minus” label contains raw text articles containing
    negative texts.


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig15_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig15_HTML.jpg)


    **Figure 4-15** – CSV data for training


    - **CSV file**: Another way to organize your training data is to create a CSV
    (comma-separated values) file. Here, instead of separate files, all the data will
    be contained in one single file. Consider the example in Figure 4-15.


    Here, we have a single file that contains entries for raw text and their respective
    truth label separated by a comma. This file can be used independently to train
    our ML model.


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig16_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig16_HTML.jpg)


    **Figure 4-16** – JSON data for training


    - **JSON file**: JSON stands for JavaScript Object Notation. It is an alternative
    data format to CSV. Just like a CSV file, a JSON file also contains all the data
    in one single file. It contains Key–Value pairs for representing the labeled data.
    Consider the example in Figure 4-16 to get a clearer idea.


    Here, we have two keys for each piece of data: “Text” representing the data and
    “Label” representing the truth label for the corresponding data. This file can
    also be used independently to train our ML model.


    Now that we are aware of the types of data that we can use to train a text classification
    model, let us learn about the typical steps involved in the training process.
    Following are the typical workflow steps for training a text classifier (they
    are also shown in Figure 4-17):


    ![../images/474993_1_En_4_Chapter/474993_1_En_4_Fig17_HTML.jpg](images/474993_1_En_4_Chapter/474993_1_En_4_Fig17_HTML.jpg)


    **Figure 4-17** – Typical workflow for training a text classifier


    - **Raw data**: First, we collect the raw data that will be used for the training.

    - **Language identification**: Then we identify the language from the raw text.

    - **Token Generation**: Then we need to generate tokens from the text, which will
    be mapped against some labels by the learning algorithm.

    - **Apply learning algorithm**: The learning algorithm will take the tokens as
    input and do some processing on them.

    - **Get predictive label**: The learning algorithm will then give us the predicted
    label for the input tokens.

    - **Compare it with truth label**: We will now compare the predicted label with
    the actual label for the raw text.

    - **Reiterate**: If the prediction is not accurate enough, we will reiterate the
    training process.

    - **Model generation**: If the prediction is accurate enough, we will generate
    the model.'
