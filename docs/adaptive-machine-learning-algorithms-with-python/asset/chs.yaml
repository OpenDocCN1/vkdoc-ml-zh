- '# 2. 通用理论与符号


  ## 2.1 引言


  在本章中，我提出了从矩阵序列中自适应求解矩阵代数问题的算法。这些流或序列可以是随机矩阵 {*A*[*k*]} 或 {*B*[*k*]}，也可以是随机向量序列 {**x**[*k*]}
  或 {**y**[*k*]} 的相关矩阵。矩阵代数的例子包括矩阵求逆、平方根、平方根逆、特征向量、广义特征向量、奇异向量和广义奇异向量。


  本章还涵盖了后续章节中使用的基本术语和方法。我还介绍了众所周知的从随机矩阵或向量序列计算均值、中位数、协方差、逆协方差和相关矩阵的自适应算法。此外，我提出了一种计算随机向量序列归一化均值的新算法。


  为简单起见，我们假设多维数据 {**x**[*k*]∈ℜ^(*n*)} 以序列形式到达。从这个数据序列中，我们可以推导出一个矩阵序列 {![$$ {A}_k={\mathbf{x}}_k{\mathbf{x}}_k^T
  $$](img/522202_1_En_2_Chapter_TeX_IEq1.png)}。我们将数据相关矩阵 *A* 定义如下：


  ![$$ A=\underset{k\to \infty }{\lim }E\left[{\mathbf{x}}_k{\mathbf{x}}_k^T\right]
  $$](images/522202_1_En_2_Chapter/522202_1_En_2_Chapter_TeX_IEq2.png)。     (2.1)




  ## 2.2 平稳序列与非平稳序列


  在实际应用中，我们面临两种类型的序列：平稳序列和非平稳序列。如果 ![$$ {\lim}_{k\to \infty }E\left[{\mathbf{x}}_k{\mathbf{x}}_k^T\right]
  $$](images/522202_1_En_2_Chapter/522202_1_En_2_Chapter_TeX_IEq3.png) 是一个常数，则序列 {**x**[*k*]}
  被认为是*渐近*（*弱*）*平稳*的。对于一个*非平稳*序列 {**x**[*k*]}，![$$ E\left[{\mathbf{x}}_k{\mathbf{x}}_{k+m}^T\right]
  $$](images/522202_1_En_2_Chapter/522202_1_En_2_Chapter_TeX_IEq4.png) 仍然是 *k* 和 *m*
  的函数，并且 ![$$ E\left[{\mathbf{x}}_k{\mathbf{x}}_k^T\right] $$](images/522202_1_En_2_Chapter/522202_1_En_2_Chapter_TeX_IEq5.png)
  是 *k* 的函数。非平稳数据的示例见 *Publicly Real-World Datasets to Evaluate Stream Learning Algorithms*
  [Vinicius Souza 等人，20]。图 2-1 展示了平稳数据和非平稳数据的示例。


  ![](img/522202_1_En_2_Fig1a_HTML.png)![](img/522202_1_En_2_Fig1b_HTML.png)


  图 2-1


  平稳数据和非平稳数据的示例


  数据中的非平稳性可以通过本参考文献 [Shay Palachy 19] 中描述的著名技术来检测。


  ## 2.3 自适应均值、中位数和协方差的应用场景


  尽管自适应均值计算是最简单的算法之一，但它在实际应用中非常重要。


  ### 手写字符识别


  考虑检测手写数字 8 的问题。图 2-2 展示了来自 Keras 数据集 MNIST 图像 [Keras, MNIST] 的六个数字 8 的实例。


