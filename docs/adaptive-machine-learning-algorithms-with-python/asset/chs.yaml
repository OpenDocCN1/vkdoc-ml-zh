  frac{1}{2}{\\left({{\\mathbf{w}}_k^i}^T{\\mathbf{w}}_k^i-1\\right)}²\\right) $$](img/522202_1_En_5_Chapter_TeX_IEq71.png),     (5.31)\n\
  \n其中 *i*=1,…,*p* 且 *μ* > 0。对 (5.31) 关于 ![$$ {\\mathbf{w}}_k^i $$](img/522202_1_En_5_Chapter_TeX_IEq72.png)\
  \ 求梯度，我们得到用于 PCA 的 AL2 收缩自适应梯度下降算法：\n\n![$$ {W}_{k+1}={W}_k+{\\eta}_k\\left(2{A}_k{W}_k-{W}_k\
  \ UT\\left({W}_k^T{A}_k{W}_k\\right)-{A}_k{W}_k UT\\left({W}_k^T{W}_k\\right)-\\\
  mu {W}_k UT\\left({W}_k^T{W}_k-{I}_p\\right)\\right) $$](img/522202_1_En_5_Chapter_TeX_IEq73.png)     (5.32)\n\
  \n其中 *μ* > 0，且 UT[⋅] 将其矩阵参数中对角线以下的所有元素设为零。当 *k*→∞ 时，*W*[*k*] 收敛于 *W*^*= [±**ϕ**[1]\
  \ ±**ϕ**[2] … ±**ϕ**[*p*]]。\n\n### AL2 加权算法\n\nAL2 加权 PCA 算法的目标函数为\n\n![$$ J\\left({\\\
