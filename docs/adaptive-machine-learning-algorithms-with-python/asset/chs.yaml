  \ 主特征向量的自适应算法。然而，在某些应用中，仅计算主特征向量是不够的；我们还需要计算 *A*[*k*] 的次特征向量。其中一个应用是多维数据压缩或多媒体视频传输中的数据降维\
  \ [Le Gall 91]。例如，在使用 JPEG 技术进行静态视频压缩时，图像被划分为 8X8 的块。通过将高维视频数据投影到其在线相关矩阵的主特征向量子空间上，可以将其降维到较低维度。通过线性变换将数据投影到特征向量子空间的过程被称为主成分分析（PCA），它与\
  \ Karhunen-Loeve 变换（KLT）密切相关 [Fukunaga 90]。我们通过离散余弦变换（DCT）给出的固定变换向量来近似特征向量，DCT 是\
  \ MPEG 标准的核心压缩方法 [Le Gall 91]。可以证明，对于来自一阶马尔可夫模型的信号（这是数字图像的一个合理模型），DCT 渐近等价于 PCA。\n\
