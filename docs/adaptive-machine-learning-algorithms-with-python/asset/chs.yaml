  *   对于非常大的 ‖**w**[0]‖（例如 ‖**w**[0]‖=10.0），LUO 算法在 *η*[*k*]=1/(200+*k*) 时无法收敛，因为收敛变得不稳定。


  *   对于较小的 ‖**w**[0]‖，RQ 的收敛性优于其他算法，因为其时间常数 ‖**w**[0]‖²/*λ*[1] 小于时间常数为 1/*λ*[1] 的其他算法。


