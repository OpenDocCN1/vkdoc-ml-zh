  \ {\\boldsymbol{\\upvarphi}}_i\\right\\Vert \\left\\Vert {\\mathbf{w}}_k^i\\right\\\
  Vert $$](img/522202_1_En_8_Chapter_TeX_IEq1.png)，\n\n其中 ![$$ {\\mathbf{w}}_k^i $$](img/522202_1_En_8_Chapter_TeX_IEq2.png)\
