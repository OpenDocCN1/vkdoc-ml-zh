  ## 4.1 引言与用例


  在本章中，我提出了一个统一的框架，用于推导和讨论十种用于主特征向量计算的自适应算法（其中一些是众所周知的），这也被称为主成分分析（PCA）或卡洛南-洛伊变换。一个对称正定矩阵
  *A*∈ℜ^(*nXn*) 的*第一主特征向量*，是对应于 *A* 的最大特征值 λ[1] 的特征向量 **ϕ**[1]。这里 *A***ϕ**[*i*]= λ[*i*]**ϕ**[*i*]
  对于 *i*=1,…,*n*，其中 λ[1]>λ[2]≥...≥λ[*n*]>0 是 *A* 的 *n* 个最大特征值，分别对应于特征向量 **ϕ**[1],…,**ϕ**[*n*]。


  机器学习中的一个重要问题是提取最能代表多维数据变化的最显著特征。这将多维数据降维到一维，从而易于建模。然而，在实际应用中，数据统计特性会随时间变化（非平稳）。因此，设计一种能够在低内存、低计算量的边缘设备上适应变化数据的解决方案颇具挑战性。


  图 4-1 展示了一个流式 10 维非平稳数据的示例，该数据在 500 个样本点后统计特性发生突变。叠加的红色曲线显示了由自适应算法估计出的主特征向量。主特征向量的自适应估计值在
  50 个样本点内收敛到其真实值。当数据在 500 个样本点后发生突变时，它会重新适应变化后的数据，并在 100 个样本点内重新收敛到其真实值。所有这些都是在低计算量、低内存和低延迟的条件下实现的。


  ![](img/522202_1_En_4_Fig1_HTML.png)


  图 4-1


  尽管数据发生突变，自适应算法仍能快速计算出第一主特征向量并使其收敛


  除了这个例子，在机器学习、模式分析、信号处理、蜂窝通信和自动控制等领域 [Haykin 94, Owsley 78, Pisarenko 73, Chatterjee
  et al*.* 97-99, Chen et al*.* 99, Diamantaras and Strintzis 97] 中，还有若干应用需要在线（即实时）求解主特征分解。正如第
  2 章所讨论的，在这些实时场景中，底层的相关矩阵 *A* 是未知的。相反，我们有一个随机向量序列 {**x**[*k*]∈ℜ^(*n*)}，从中我们可以获得一个瞬时矩阵序列
  {*A*[*k*]∈ℜ^(*nxn*)}，使得 *A* = lim[*k→*∞]*E*[*A*[*k*]]。对于每一个新输入的样本 **x**[*k*]，我们需要获得主特征向量
  **ϕ**[1] 的当前估计值 **w**[*k*]，使得 **w**[*k*] 强收敛于其真实值 **ϕ**[1]。


  计算 **ϕ**[1] 的在线估计值 **w**[*k*] 的一种常用方法是最大化*瑞利商* (RQ) [Golub and VanLoan 83] 准则 *J*(**w**[*k*];*A*[*k*])，其中


  ![$$ J\left({\mathbf{w}}_k;{A}_k\right)=\frac{{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k}{{\mathbf{w}}_k^T{\mathbf{w}}_k}
  $$](img/522202_1_En_4_Chapter_TeX_IEq1.png)。     (4.1)


  信号 **x**[*k*] 可以通过将其投影到 **w**[*k*] 上压缩为单个值，即 ![$$ {\mathbf{w}}_k^T{\mathbf{x}}_k
  $$](img/522202_1_En_4_Chapter_TeX_IEq2.png)。


  关于 PCA 算法的文献非常多样化，从业者从不同的背景出发来处理这个问题，包括信号处理、神经学习和统计模式识别。在每个学科内，自适应 PCA 算法都是从其自身的角度推导出来的，其中可能包括特设方法。由于
  PCA 算法的方法和解决方案分散在不同的学科领域，因此需要一个统一的框架来推导和分析这些算法。


  在本章中，我提供了一个通用框架，用于按照第 1.​4 节概述的四个步骤，对十种自适应算法进行推导、收敛性和速率分析。对于每种算法，我都给出了每个步骤的结果。这个统一框架有助于对这十种算法进行比较研究。在此过程中，我对已知算法提供了新的视角，并提出了两种新的
  PCA 自适应算法。对于已知算法，如果先前实现中已有结果，我会加以说明；否则，我会提供新的结果。对于新算法，我会证明我的结果。


  ### 本章概要


  在第 4.2 节中，我列出了本章将推导和讨论的自适应 PCA 算法。我还列出了推导这些算法所依据的目标函数以及必要的假设。第 4.3 节介绍了 Oja PCA
  算法并描述了其收敛特性。在第 4.4 节中，我分析了三种基于瑞利商准则 (4.1) 的算法。在第 4.5 节中，我讨论了基于信息论准则的 PCA 算法。第 4.6
  节描述了均方误差目标函数及其算法。在第 4.7 节中，我讨论了基于惩罚函数的算法。第 4.8 和 4.9 节提出了基于增广拉格朗日准则的新 PCA 算法。第 4.10
  节总结了收敛性结果。第 4.11 节讨论了实验结果。最后，第 4.12 节对本章进行了总结。


  ## 4.2 算法与目标函数




  ### 自适应算法


  [Chatterjee *神经网络*，第 18 卷，第 2 期，第 145-149 页，2005 年 3 月]。


  我根据算法的发明者或其推导所依据的目标函数，对它们进行了分类。所有算法的形式均为


  **w**[*k* + 1] = **w**[*k*] + *η*[*k*]*h*(**w**[*k*], *A*[*k*]),     (4.2)


  其中函数 *h*(**w**[*k*],*A*[*k*]) 遵循特定的连续性和正则性属性 [Ljung 77,92]，而 *η*[*k*] 是一个递减的增益序列。各种自适应算法的项
  *h*(**w**[*k*];*A*[*k*]) 如下：


  *   OJA: ![$$ {A}_k{\mathbf{w}}_k-{\mathbf{w}}_k{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k
  $$](img/522202_1_En_4_Chapter_TeX_IEq3.png).


  *   RQ: ![$$ \frac{1}{{\mathbf{w}}_k^T{\mathbf{w}}_k}\left({A}_k{\mathbf{w}}_k-{\mathbf{w}}_k\left(\frac{{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k}{{\mathbf{w}}_k^T{\mathbf{w}}_k}\right)\right)
  $$](img/522202_1_En_4_Chapter_TeX_IEq4.png).


  *   OJAN: ![$$ {A}_k{\mathbf{w}}_k-{\mathbf{w}}_k\left(\frac{{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k}{{\mathbf{w}}_k^T{\mathbf{w}}_k}\right)={\mathbf{w}}_k^T{\mathbf{w}}_k\cdot
  RQ $$](img/522202_1_En_4_Chapter_TeX_IEq5.png).


  *   LUO: ![$$ {\mathbf{w}}_k^T{\mathbf{w}}_k\left({A}_k{\mathbf{w}}_k-{\mathbf{w}}_k\left(\frac{{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k}{{\mathbf{w}}_k^T{\mathbf{w}}_k}\right)\right)={\left({\mathbf{w}}_k^T{\mathbf{w}}_k\right)}²\cdot
  RQ $$](img/522202_1_En_4_Chapter_TeX_IEq6.png).


  *   IT: ![$$ \frac{A_k{\mathbf{w}}_k}{{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k}-{\mathbf{w}}_k=\frac{1}{{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k}\cdot
  OJA $$](img/522202_1_En_4_Chapter_TeX_IEq7.png)


  *   XU: ![$$ 2{A}_k{\mathbf{w}}_k-{\mathbf{w}}_k{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k-{A}_k{\mathbf{w}}_k{\mathbf{w}}_k^T{\mathbf{w}}_k=
  OJA-{A}_k{\mathbf{w}}_k\left({\mathbf{w}}_k^T{\mathbf{w}}_k-1\right) $$](img/522202_1_En_4_Chapter_TeX_IEq8.png).


  *   PF: ![$$ {A}_k{\mathbf{w}}_k-\mu {\mathbf{w}}_k\left({\mathbf{w}}_k^T{\mathbf{w}}_k-1\right)
  $$](img/522202_1_En_4_Chapter_TeX_IEq9.png).


  *   OJA+: ![$$ {A}_k{\mathbf{w}}_k-{\mathbf{w}}_k{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k-{\mathbf{w}}_k\left({\mathbf{w}}_k^T{\mathbf{w}}_k-1\right)=
  OJA-{\mathbf{w}}_k\left({\mathbf{w}}_k^T{\mathbf{w}}_k-1\right) $$](img/522202_1_En_4_Chapter_TeX_IEq10.png)


  *   AL1: ![$$ {A}_k{\mathbf{w}}_k-{\mathbf{w}}_k{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k-\mu
  {\mathbf{w}}_k\left({\mathbf{w}}_k^T{\mathbf{w}}_k-1\right) $$](img/522202_1_En_4_Chapter_TeX_IEq11.png).


  *   AL2: ![$$ 2{A}_k{\mathbf{w}}_k-{\mathbf{w}}_k{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k-{A}_k{\mathbf{w}}_k{\mathbf{w}}_k^T{\mathbf{w}}_k-\mu
  {\mathbf{w}}_k\left({\mathbf{w}}_k^T{\mathbf{w}}_k-1\right) $$](img/522202_1_En_4_Chapter_TeX_IEq12.png).


  这里 IT 代表信息论，AL 代表增广拉格朗日法。尽管这些算法大多已知，但新的 AL1 和 AL2 算法是从本章后面讨论的增广拉格朗日目标函数推导出来的。


  ### 目标函数


  按照我在第 2.2 章中提出的方法论，前面提到的所有算法都是从目标函数推导出来的。其中一些目标函数包括：


  *   OJA 算法的目标函数，

  *   最小均方误差准则，

  *   瑞利商准则，

  *   罚函数法，

  *   信息论准则，以及

  *   增广拉格朗日法。


  ## 4.3 OJA 算法


  该算法由 Oja 等人 [Oja 85, 89, 92] 提出。直观上，OJA 算法是通过将瑞利商准则表示为拉格朗日函数推导出来的，该函数在约束条件 ![$$
  {\mathbf{w}}_k^T{\mathbf{w}}_k=1 $$](img/522202_1_En_4_Chapter_TeX_IEq14.png) 下最小化
  ![$$ -{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k $$](img/522202_1_En_4_Chapter_TeX_IEq13.png)。


  ### 目标函数


  根据数据样本 **x**[*k*]，OJA 算法的目标函数可以写为


  ![$$ J\left({\mathbf{w}}_k;{\mathbf{x}}_k\right)=-{\left\Vert {\mathbf{x}}_k^T\left({\mathbf{x}}_k-{\mathbf{w}}_k{\mathbf{w}}_k^T{\mathbf{x}}_k\right)\right\Vert}²
  $$](img/522202_1_En_4_Chapter_TeX_IEq15.png)     (4.3)


  如果我们用数据相关矩阵 *A*[*k*] 的瞬时值 ![$$ {\mathbf{x}}_k{\mathbf{x}}_k^T $$](img/522202_1_En_4_Chapter_TeX_IEq16.png)
  来表示它，那么 (4.3) 等价于以下目标函数：


  ![$$ J\left({\mathbf{w}}_k;{A}_k\right)=-{\left\Vert {A}_k^{\frac{1}{2}}\left(I-{\mathbf{w}}_k{\mathbf{w}}_k^T\right){A}_k^{\frac{1}{2}}\right\Vert}_F²
  $$](img/522202_1_En_4_Chapter_TeX_IEq17.png).     (4.4)


  从 (4.4) 中我们可以看到，目标函数 *J*(**w**[*k*];**x**[*k*]) 表示样本 **x**[*k*] 与其经过矩阵 ![$$ {\mathbf{w}}_k{\mathbf{w}}_k^T
  $$](img/522202_1_En_4_Chapter_TeX_IEq18.png) 变换后的结果之间的差异。在神经网络中，这种变换被称为*自联想*^(²)
  [Haykin 94]。图 4-2 展示了一个两层自联想网络。


  ![](img/522202_1_En_4_Fig2_HTML.jpg)


  图 4-2


  用于第一主特征向量的两层线性自联想神经网络


  ### 自适应算法


  (4.4) 关于 **w**[*k*] 的梯度为


  ![$$ {\nabla}_{{\mathbf{w}}_k}J\left({\mathbf{w}}_k;{A}_k\right)=-4{A}_k\left({A}_k{\mathbf{w}}_k-{\mathbf{w}}_k{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k\right).
  $$](img/522202_1_En_4_Chapter_TeX_Equa.png)


  用于 PCA 的自适应梯度下降 OJA 算法为


  ![$$ {\mathbf{w}}_{k+1}={\mathbf{w}}_k-{\eta}_k{A}_k^{-1}{\nabla}_{{\mathbf{w}}_k}J\left({\mathbf{w}}_k;{A}_k\right)={\mathbf{w}}_k+{\eta}_k\left({A}_k{\mathbf{w}}_k-{\mathbf{w}}_k{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k\right)
  $$](img/522202_1_En_4_Chapter_TeX_IEq19.png),     (4.5)


  其中 *η*[*k*] 是一个小的递减常数。


  该算法针对多维数据 `X[nDim,nSamples]` 的 Python 代码如下：


  ```

  A = np.zeros(shape=(nDim,nDim)) # 存储自适应相关矩阵

  w = 0.1 * np.ones(shape=(nDim,11)) # 所有算法的权重向量

  for epoch in range(nEpochs):

  for iter in range(nSamples):

  cnt = nSamples*epoch + iter

  x = X[:,iter]

  x = x.reshape(nDim,1)

  A = A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - A)

  # OJA 算法

  v = w[:,0].reshape(nDim, 1)

  v = v + (1/(100+cnt))*(A @ v - v @ (v.T @ A @ v))

  w[:,0] = v.reshape(nDim)

  ```


  ### 收敛速度


  主特征向量 **ϕ**[1] 的收敛时间常数为 1/*λ*[1]，对于次要特征向量 **ϕ**[*i*]（*i*=2,…,*n*），其时间常数为 1/(*λ*[1]–*λ*[*i*])。这些时间常数取决于数据相关矩阵
  *A* 的特征结构。


  ## 4.4 RQ、OJAN 和 LUO 算法


  ### 目标函数


  这三种算法是以下瑞利商目标函数的不同推导形式：


  ![$$ J\left({\mathbf{w}}_k;{A}_k\right)=-\left(\frac{{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k}{{\mathbf{w}}_k^T{\mathbf{w}}_k}\right)
  $$](img/522202_1_En_4_Chapter_TeX_IEq20.png).     (4.6)


  这些算法最初由 Luo 等人 [Luo 等人 97; Taleb 等人 99; Cirrincione 等人 00] 和 Oja 等人 [Oja 等人 92]
  提出。许多实践者提出了 RQ 算法的变体 [Chauvin 89; Sarkar 等人 89; Yang 等人 89; Fu and Dowling 95; Taleb
  等人 99; Cirrincione 等人 00]。




  ### 自适应算法


  关于 **w**[*k*] 的 (4.7) 的梯度为


  ![$$ {\nabla}_{{\mathbf{w}}_k}J\left({\mathbf{w}}_k;{A}_k\right)=\frac{-1}{{\mathbf{w}}_k^T{\mathbf{w}}_k}\left({A}_k{\mathbf{w}}_k-{\mathbf{w}}_k\frac{{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k}{{\mathbf{w}}_k^T{\mathbf{w}}_k}\right).
  $$](img/522202_1_En_4_Chapter_TeX_Equb.png)


  用于 PCA 的自适应梯度下降 RQ 算法为


  ![$$ {\mathbf{w}}_{k+1}={\mathbf{w}}_k-{\eta}_k{\nabla}_{{\mathbf{w}}_k}J\left({\mathbf{w}}_k;{A}_k\right)={\mathbf{w}}_k+{\eta}_k\frac{1}{{\mathbf{w}}_k^T{\mathbf{w}}_k}\left({A}_k{\mathbf{w}}_k-{\mathbf{w}}_k\frac{{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k}{{\mathbf{w}}_k^T{\mathbf{w}}_k}\right)
  $$](img/522202_1_En_4_Chapter_TeX_IEq21.png).     (4.7)


  用于 PCA 的自适应梯度下降 OJAN 算法为


  ![$$ {\mathbf{w}}_{k+1}={\mathbf{w}}_k-{\eta}_k\left({\mathbf{w}}_k^T{\mathbf{w}}_k\right){\nabla}_{{\mathbf{w}}_k}J\left({\mathbf{w}}_k;{A}_k\right)={\mathbf{w}}_k+{\eta}_k\left({A}_k{\mathbf{w}}_k-{\mathbf{w}}_k\frac{{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k}{{\mathbf{w}}_k^T{\mathbf{w}}_k}\right)
  $$](img/522202_1_En_4_Chapter_TeX_IEq22.png).     (4.8)


  用于 PCA 的自适应梯度下降 LUO 算法为


  ![$$ {\mathbf{w}}_{k+1}={\mathbf{w}}_k-{\eta}_k{\left({\mathbf{w}}_k^T{\mathbf{w}}_k\right)}²{\nabla}_{{\mathbf{w}}_k}J\left({\mathbf{w}}_k;{A}_k\right)={\mathbf{w}}_k+{\eta}_k\left({\mathbf{w}}_k^T{\mathbf{w}}_k\right)\kern0.5em
  \left({A}_k{\mathbf{w}}_k-{\mathbf{w}}_k\frac{{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k}{{\mathbf{w}}_k^T{\mathbf{w}}_k}\right)
  $$](img/522202_1_En_4_Chapter_TeX_IEq23.png).     (4.9)


  这些算法处理多维数据 `X[nDim,nSamples]` 的 Python 代码如下


  ```

  A = np.zeros(shape=(nDim,nDim)) # stores adaptive correlation matrix

  w = 0.1 * np.ones(shape=(nDim,11)) # weight vectors of all algorithms

  for epoch in range(nEpochs):

  for iter in range(nSamples):

  cnt = nSamples*epoch + iter

  x = X[:,iter]

  x = x.reshape(nDim,1)

  A = A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - A)

  # OJAN Algorithm

  v = w[:,1].reshape(nDim, 1)

  v = v + (1/(10+cnt))*(A @ v - v @ ((v.T @ A @ v) / (v.T @ v)) )

  w[:,1] = v.reshape(nDim)

  # LUO Algorithm

  v = w[:,2].reshape(nDim, 1)

  v = v + (1/(20+cnt))*(A @ v * (v.T @ v) - v @ (v.T @ A @ v))

  w[:,2] = v.reshape(nDim)

  # RQ Algorithm

  v = w[:,3].reshape(nDim, 1)

  v = v + (1/(100+cnt))*(A @ v - v @ ((v.T @ A @ v) / (v.T @ v)) )

  w[:,3] = v.reshape(nDim)

  ```


  ### 收敛速度


  对于*主特征向量* **ϕ**[1] 的收敛时间常数为


  RQ: ‖**w**[0]‖²/*λ*[1].


  OJAN: 1/*λ*[1].


  LUO: ‖**w**[0]‖^(–2)/*λ*[1].


  对于次要特征向量 **ϕ**[*i*] (*i*=2,…,*n*) 的收敛时间常数为


  RQ: ‖**w**[0]‖²/(*λ*[1]–*λ*[*i*]) 对于 *i*=2,…,*n*.


  OJAN: 1/(*λ*[1]–*λ*[*i*]) 对于 *i*=2,…,*n*.


  LUO: ‖**w**[0]‖^(–2)/(*λ*[1]–*λ*[*i*]) 对于 *i*=2,…,*n*.


  这些时间常数依赖于 *A* 的特征结构。


  ## 4.5 IT 算法


  ### 目标函数


  信息论（IT）准则的目标函数为


  ![$$ J\left({\mathbf{w}}_k;{A}_k\right)={\mathbf{w}}_k^T{\mathbf{w}}_k-\ln \left({\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k\right)
  $$](img/522202_1_En_4_Chapter_TeX_IEq24.png).     (4.10)


  Plumbley [Pumbley 95] 以及 Miao 和 Hua [Miao and Hua 98] 研究了该目标函数。


  ### 自适应算法


  关于 **w**[*k*] 的 (4.12) 的梯度为


  ![$$ {\nabla}_{{\mathbf{w}}_k}J\left({\mathbf{w}}_k;{A}_k\right)={\mathbf{w}}_k-\frac{A_k{\mathbf{w}}_k}{{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k}.
  $$](img/522202_1_En_4_Chapter_TeX_Equc.png)


  用于 PCA 的自适应梯度下降 IT 算法为


  ![$$ {\mathbf{w}}_{k+1}={\mathbf{w}}_k-{\eta}_k{\nabla}_{{\mathbf{w}}_k}J\left({\mathbf{w}}_k;{A}_k\right)={\mathbf{w}}_k+{\eta}_k\left(\frac{A_k{\mathbf{w}}_k}{{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k}-{\mathbf{w}}_k\right)
  $$](img/522202_1_En_4_Chapter_TeX_IEq25.png).     (4.11)


  该算法处理多维数据 `X[nDim,nSamples]` 的 Python 代码如下


  ```

  A = np.zeros(shape=(nDim,nDim)) # stores adaptive correlation matrix

  w = 0.1 * np.ones(shape=(nDim,11)) # weight vectors of all algorithms

  for epoch in range(nEpochs):

  for iter in range(nSamples):

  cnt = nSamples*epoch + iter

  x = X[:,iter]

  x = x.reshape(nDim,1)

  A = A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - A)

  # IT Algorithm

  v = w[:,5].reshape(nDim, 1)

  v = v + (4/(1+cnt))*((A @ v / (v.T @ A @ v)) - v)

  w[:,5] = v.reshape(nDim)

  ```


  ### 收敛速度


  该算法的一个独特之处在于 ‖**w**(*t*)‖ 的时间常数为 1，并且*独立于* *A* 的特征结构。


  ### η[k] 的上界


  我已经证明存在一个统一的 η[k] 上界，使得 **w**[k] 一致有界。此外，如果 ‖**w**[*k*]‖² ≤ α+1，那么当满足以下条件时，‖**w**[*k*+1]‖²
  ≤ ‖**w**[*k*]‖²


  ![$$ {\eta}_k&lt;\frac{2\left(\alpha +1\right)}{\alpha }. $$](img/522202_1_En_4_Chapter_TeX_Equd.png)


  ## 4.6 XU 算法


  ### 目标函数


  最初由 Xu [Xu 91, 93] 提出，XU 算法的目标函数为


  ![$$ J\left({\mathbf{w}}_k;{A}_k\right)=-{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k+{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k\left({\mathbf{w}}_k^T\mathbf{w}-1\right)=-2{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k+{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k{\mathbf{w}}_k^T{\mathbf{w}}_k
  $$](img/522202_1_En_4_Chapter_TeX_IEq26.png)     (4.12)


  目标函数 *J*(**w**[*k*];*A*[*k*]) 表示样本 **x**[*k*] 与其经矩阵 ![$$ {\mathbf{w}}_k{\mathbf{w}}_k^T
  $$](img/522202_1_En_4_Chapter_TeX_IEq27.png) 变换后的结果之间的均方误差。这种变换也称为*自关联*，如图 4-1 所示。我们定义
  ![$$ {A}_k=\left(1/k\right){\sum}_{t=1}^k{\mathbf{x}}_t{\mathbf{x}}_t^T $$](img/522202_1_En_4_Chapter_TeX_IEq28.png)。那么，均方误差目标函数为


  ![$$ J\left({\mathbf{w}}_k;{A}_k\right)=\frac{1}{k}\sum \limits_{i=1}^k{\left\Vert
  {\mathbf{x}}_k-{\mathbf{w}}_k{\mathbf{w}}_k^T{\mathbf{x}}_k\right\Vert}²={trA}_k-2{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k+{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k{\mathbf{w}}_k^T{\mathbf{w}}_k,
  $$](img/522202_1_En_4_Chapter_TeX_Eque.png)


  这与 (4.12) 相同。


  ### 自适应算法


  关于 **w**[*k*] 的 (4.12) 的梯度为


  ![$$ {\nabla}_{{\mathbf{w}}_k}J\left({\mathbf{w}}_k;{A}_k\right)=-\left(2{A}_k{\mathbf{w}}_k-{\mathbf{w}}_k{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k-{A}_k{\mathbf{w}}_k{\mathbf{w}}_k^T{\mathbf{w}}_k\right).
  $$](img/522202_1_En_4_Chapter_TeX_Equf.png)


  用于 PCA 的自适应梯度下降 XU 算法为


  ![$$ {\mathbf{w}}_{k+1}={\mathbf{w}}_k-{\eta}_k{\nabla}_{{\mathbf{w}}_k}J\left({\mathbf{w}}_k;{A}_k\right)={\mathbf{w}}_k+{\eta}_k\left(2{A}_k{\mathbf{w}}_k-{\mathbf{w}}_k{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k-{A}_k{\mathbf{w}}_k{\mathbf{w}}_k^T{\mathbf{w}}_k\right)
  $$](img/522202_1_En_4_Chapter_TeX_IEq29.png).     (4.13)


  该算法处理多维数据 `X[nDim,nSamples]` 的 Python 代码如下


  ```

  A = np.zeros(shape=(nDim,nDim)) # stores adaptive correlation matrix

  w = 0.1 * np.ones(shape=(nDim,11)) # weight vectors of all algorithms

  for epoch in range(nEpochs):

  for iter in range(nSamples):

  cnt = nSamples*epoch + iter

  x = X[:,iter]

  x = x.reshape(nDim,1)

  A = A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - A)

  # XU Algorithm

  v = w[:,6].reshape(nDim, 1)

  v = v + (1/(50+cnt))*(2*A@ v - v@(v.T @ A @ v) - A@ v@ (v.T @ v))

  w[:,6] = v.reshape(nDim)

  ```




  ### 收敛速率


  主特征向量 **ϕ**[1] 的收敛时间常数为 1/*λ*[1]，次特征向量 **ϕ**[*i*]（*i*=2,…,*n*）的收敛时间常数为 1/(*λ*[1]–*λ*[*i*])。这些时间常数取决于数据相关矩阵
  *A* 的特征结构。


  ### η[k] 的上界


  存在一个统一的 η[*k*] 上界，使得 **w**[*k*] 几乎必然一致有界。如果 ‖**w**[k]‖² ≤ α+1，且 *θ* 是 *A*[*k*] 的最大特征值，则当满足以下条件时，有
  ‖**w**[*k*+1]‖² ≤ ‖**w**[*k*]‖²：


  ![$$ {\eta}_k&lt;\frac{1}{\theta \alpha}. $$](img/522202_1_En_4_Chapter_TeX_Equg.png)


  ## 4.7 惩罚函数算法


  ### 目标函数


  惩罚函数（PF）算法的目标函数最初由 Chauvin [Chauvin 89] 提出，其形式为：


  ![$$ J\left({\mathbf{w}}_k;{A}_k\right)=-{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k+\frac{\mu
  }{2}{\left({\mathbf{w}}_k^T{\mathbf{w}}_k-1\right)}² $$](img/522202_1_En_4_Chapter_TeX_IEq30.png),
  *μ* > 0.     (4.14)


  目标函数 *J*(**w**[*k*];*A*[*k*]) 是瑞利商准则 (4.1) 的一种实现，其中约束条件 ![$$ {\mathbf{w}}_k^T{\mathbf{w}}_k=1
  $$](img/522202_1_En_4_Chapter_TeX_IEq31.png) 通过非线性优化中的惩罚函数方法强制执行，*μ* 是一个正的惩罚常数。


  ### 自适应算法


  (4.14) 关于 **w**[*k*] 的梯度为：


  ![$$ \left(1/2\right){\nabla}_{{\mathbf{w}}_k}J\left({\mathbf{w}}_k;{A}_k\right)=-\left({A}_k{\mathbf{w}}_k-\mu
  {\mathbf{w}}_k\left({\mathbf{w}}_k^T{\mathbf{w}}_k-1\right)\right). $$](img/522202_1_En_4_Chapter_TeX_Equh.png)


  用于 PCA 的自适应梯度下降 PF 算法为：


  ![$$ {\mathbf{w}}_{k+1}={\mathbf{w}}_k-{\eta}_k{\nabla}_{{\mathbf{w}}_k}J\left({\mathbf{w}}_k;{A}_k\right)={\mathbf{w}}_k+{\eta}_k\left({A}_k{\mathbf{w}}_k-\mu
  {\mathbf{w}}_k\left({\mathbf{w}}_k^T{\mathbf{w}}_k-1\right)\right) $$](img/522202_1_En_4_Chapter_TeX_IEq32.png),     (4.15)


  其中 *μ* > 0。


  该算法针对多维数据 `X[nDim,nSamples]` 的 Python 代码如下：


  ```

  mu = 10

  A = np.zeros(shape=(nDim,nDim)) # stores adaptive correlation matrix

  w = 0.1 * np.ones(shape=(nDim,11)) # weight vectors of all algorithms

  for epoch in range(nEpochs):

  for iter in range(nSamples):

  cnt = nSamples*epoch + iter

  x = X[:,iter]

  x = x.reshape(nDim,1)

  A = A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - A)

  # PF Algorithm

  v = w[:,7].reshape(nDim, 1)

  v = v + (1/(50+cnt)) * (A @ v - mu * v @ (v.T @ v - 1))

  w[:,7] = v.reshape(nDim)

  ```


  ### 收敛速率


  主特征向量 **ϕ**[1] 的收敛时间常数为 1/(*λ*[1] + *μ*)，次特征向量 **ϕ**[*i*]（*i*=2,…,*n*）的收敛时间常数为 1/(*λ*[1]–*λ*[*i*])。这些时间常数取决于数据相关矩阵
  *A* 的特征结构。


  ### η[k] 的上界


  存在一个统一的 η[k] 上界，使得 **w**[k] 一致有界。如果 ‖**w**[k]‖² ≤ α+1，且 *θ* 是 *A*[k] 的最大特征值，则当满足以下条件时，有
  ‖**w**[k+1]‖² ≤ ‖**w**[k]‖²：


  ![$$ {\eta}_k&lt;\frac{1}{\mu \alpha -\theta } $$](img/522202_1_En_4_Chapter_TeX_IEq33.png)，假设
  μα>θ。


  ## 4.8 增广拉格朗日 1 算法


  ### 目标函数与自适应算法


  增广拉格朗日 1（AL1）算法的目标函数是通过应用非线性优化的增广拉格朗日方法，在约束条件 ![$$ {\mathbf{w}}_k^T{\mathbf{w}}_k=1
  $$](img/522202_1_En_4_Chapter_TeX_IEq35.png) 下最小化 ![$$ -{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k
  $$](img/522202_1_En_4_Chapter_TeX_IEq34.png) 而得到的：


  ![$$ J\left({\mathbf{w}}_k;{A}_k\right)=-{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k+{\alpha}_k\left({\mathbf{w}}_k^T{\mathbf{w}}_k-1\right)+\frac{\mu
  }{2}{\left({\mathbf{w}}_k^T{\mathbf{w}}_k-1\right)}² $$](img/522202_1_En_4_Chapter_TeX_IEq36.png),     (4.16)


  其中 *α*[*k*] 是拉格朗日乘子，*μ* 是正的惩罚常数。*J*(**w**[*k*];*A*[*k*]) 关于 **w**[*k*] 的梯度为：


  ![$$ {\nabla}_{{\mathbf{w}}_k}J\left({\mathbf{w}}_k;{A}_k\right)=-2\left({A}_k{\mathbf{w}}_k-{\alpha}_k{\mathbf{w}}_k-\mu
  {\mathbf{w}}_k\left({\mathbf{w}}_k^T{\mathbf{w}}_k-1\right)\right). $$](img/522202_1_En_4_Chapter_TeX_Equi.png)


  令该梯度等于 **0** 并利用约束条件 ![$$ {\mathbf{w}}_k^T{\mathbf{w}}_k=1 $$](img/522202_1_En_4_Chapter_TeX_IEq37.png)，我们得到
  *α*[*k*]=**w**[*k*]^(*T*)*A*[*k*]**w**[*k*]。将此 *α*[*k*] 代入梯度中，得到 AL1 算法：


  ![$$ {\mathbf{w}}_{k+1}={\mathbf{w}}_k+{\eta}_k\left({A}_k{\mathbf{w}}_k-{\mathbf{w}}_k{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k-\mu
  {\mathbf{w}}_k\left({\mathbf{w}}_k^T{\mathbf{w}}_k-1\right)\right) $$](img/522202_1_En_4_Chapter_TeX_IEq38.png),     (4.17)


  其中 *μ* > 0。注意，当 *μ* =1 时，(4.17) 与 OJA+ 算法相同。


  该算法针对多维数据 `X[nDim,nSamples]` 的 Python 代码如下：


  ```

  mu = 10

  A = np.zeros(shape=(nDim,nDim)) # stores adaptive correlation matrix

  w = 0.1 * np.ones(shape=(nDim,11)) # weight vectors of all algorithms

  for epoch in range(nEpochs):

  for iter in range(nSamples):

  cnt = nSamples*epoch + iter

  x = X[:,iter]

  x = x.reshape(nDim,1)

  A = A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - A)

  # AL1 Algorithm

  v = w[:,8].reshape(nDim, 1)

  v = v + (1/(50+cnt))*(A@v - v@(v.T @A @ v) - mu* v@ (v.T@v - 1))

  w[:,8] = v.reshape(nDim)

  ```


  ### 收敛速率


  主特征向量 **ϕ**[1] 的收敛时间常数为 1/(*λ*[1] + *μ*)，次特征向量 **ϕ**[*i*]（*i*=2,…,*n*）的收敛时间常数为 1/(*λ*[1]–*λ*[*i*])。这些时间常数取决于数据相关矩阵
  *A* 的特征结构。


  ### η[k] 的上界


  存在一个统一的 η[k] 上界，使得 **w**[k] 一致有界。如果 ‖**w**[k]‖² ≤ α+1，且 *θ* 是 A[k] 的最大特征值，则当满足以下条件时，有
  ‖**w**[k+1]‖ ² ≤ ‖**w**[k]‖²：


  ![$$ {\eta}_k&lt;\frac{1}{\left(\mu +\theta \right)\alpha }. $$](img/522202_1_En_4_Chapter_TeX_Equj.png)


  ## 4.9 增广拉格朗日 2 算法


  ### 目标函数


  增广拉格朗日 2（AL2）算法的目标函数为：


  ![$$ J\left({\mathbf{w}}_k;{A}_k\right)=-{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k+{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k\left({\mathbf{w}}_k^T{\mathbf{w}}_k-1\right)+\frac{\mu
  }{2}{\left({\mathbf{w}}_k^T{\mathbf{w}}_k-1\right)}² $$](img/522202_1_En_4_Chapter_TeX_IEq39.png)     (4.18)


  目标函数 *J*(**w**[*k*];*A*[*k*]) 是增广拉格朗日方法在瑞利商准则 (4.1) 上的一个应用。它使用了 XU 目标函数，同时也使用了惩罚函数方法
  (4.14)，其中 *μ* 是一个正的惩罚常数。




  ### 自适应算法


  关于 **w**[*k*] 的 (4.18) 的梯度为


  ![$$ \left(1/2\right){\nabla}_{{\mathbf{w}}_k}J\left({\mathbf{w}}_k;{A}_k\right)=-\left(2{A}_k{\mathbf{w}}_k-{\mathbf{w}}_k{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k-{A}_k{\mathbf{w}}_k{\mathbf{w}}_k^T{\mathbf{w}}_k-\mu
  {\mathbf{w}}_k\left({\mathbf{w}}_k^T{\mathbf{w}}_k-1\right)\right). $$](img/522202_1_En_4_Chapter_TeX_Equk.png)


  用于 PCA 的自适应梯度下降 AL2 算法为


  ![$$ {\mathbf{w}}_{k+1}={\mathbf{w}}_k+{\eta}_k\left(2{A}_k{\mathbf{w}}_k-{\mathbf{w}}_k{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k-{A}_k{\mathbf{w}}_k{\mathbf{w}}_k^T{\mathbf{w}}_k-\mu
  {\mathbf{w}}_k\left({\mathbf{w}}_k^T{\mathbf{w}}_k-1\right)\right) $$](img/522202_1_En_4_Chapter_TeX_IEq40.png),    (4.19)


  其中 *μ* > 0。


  该算法针对多维数据 `X[nDim,nSamples]` 的 Python 代码如下：


  ```

  mu = 10

  A = np.zeros(shape=(nDim,nDim)) # stores adaptive correlation matrix

  w = 0.1 * np.ones(shape=(nDim,11)) # weight vectors of all algorithms

  for epoch in range(nEpochs):

  for iter in range(nSamples):

  cnt = nSamples*epoch + iter

  x = X[:,iter]

  x = x.reshape(nDim,1)

  A = A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - A)

  # AL2 Algorithm

  v = w[:,9].reshape(nDim, 1)

  v = v + (1/(50+cnt))*(2* A @ v - v @ (v.T @ A @ v) –

  A@ v @ (v.T @ v) - mu* v @ (v.T @ v -1))

  w[:,9] = v.reshape(nDim)

  ```


  ### 收敛速度


  主特征向量 **ϕ**[1] 的收敛时间常数为 1/(*λ*[1] + (*μ*/2))，次特征向量 **ϕ**[*i*] 的收敛时间常数为 1/(*λ*[1]–*λ*[*i*])，其中
  *i*=2,…,*n*。这些时间常数取决于数据相关矩阵 *A* 的特征结构。


  ### η[k] 的上界


  存在一个统一的 η[k] 上界，使得 **w**[*k*] 一致有界。此外，如果 ‖**w**[k]‖² ≤ α+1 且 *θ* 是 *A*[*k*] 的最大特征值，那么当满足以下条件时，‖**w**[k+1]‖²
  ≤ ‖**w**[k]‖²：


  ![$$ {\eta}_k&lt;\frac{2}{\left(2\theta +\mu \right)\alpha }. $$](img/522202_1_En_4_Chapter_TeX_Equl.png)


  ## 4.10 算法总结


  表 4-1 总结了各算法的收敛结果。该表还显示了 *η*[*k*] 的上界（如果存在）。其中 *τ* 表示时间常数，**w**[0] 表示 **w**[*k*]
  的初始值，α+1 表示 ‖**w**[*k*]‖² 的上界（即 ‖**w**[*k*]‖² ≤ α+1），*θ* 表示 *A*[*k*] 的第一主特征值。


  表 4-1


  收敛结果总结


  | 算法 | 收敛时间常数 | *η*[*k*] 的上界 |

  | --- | --- | --- |

  | OJA | 1/*λ*[1] | 2/*αθ* |

  | OJAN | 1/*λ*[1] | 不可用 |

  | LUO | ‖**w**[0]‖^(–2)/*λ*[1] | 不可用 |

  | RQ | ‖**w**[0]‖²/*λ*[1] | 不可用 |

  | OJA+ | 1/(*λ*[1]+1) | 1/(*α*–*θ*) |

  | IT | 1 | 2(*α*+1)/*α* |

  | XU | 1/*λ*[1] | 1/*αθ* |

  | PF | 1/(*λ*[1]+*μ*) | 1/(*μα*–*θ*) |

  | AL1 | 1/(*λ*[1]+*μ*) | 1/(*μ*+*θ*)*α* |

  | AL2 | 1/(*λ*[1]+(*μ*/2)) | 2/(*μ*+2*θ*)*α* |


  请注意，时间常数越小，收敛速度越快。结论如下：


  1.  对于除 IT 之外的所有算法，*λ*[1] 的值越大，**ϕ**[1] 的收敛效果越好。

  2.  对于 LUO 算法，‖**w**[0]‖ 越大，时间常数越小，这意味着初始权重越大，收敛效果越好。

  3.  对于 RQ 算法，‖**w**[0]‖ 越大，收敛效果越差。

  4.  对于 PF、AL1 和 AL2 算法，*μ* 越大，时间常数越小，但 *μ* 值过大会因过度强调约束而导致算法性能不佳。


  ## 4.11 实验结果


  我进行了三组实验。


  1.  在第一组实验中，我对单个数据集使用了前面描述的自适应算法，并采用了不同的起始向量 **w**[0] [Chatterjee, *Neural Networks*,
  Vol. 18, No. 2, pp. 145-149, March 2005]。

  2.  在第二组实验中，我生成了多个数据样本，并使用相同的起始向量 **w**[0] 应用了自适应算法 [Chatterjee, *Neural Networks*,
  Vol. 18, No. 2, pp. 145-149, March 2005]。

  3.  在第三组实验中，我使用了一个来自公共数据集的**真实世界非平稳**数据集 [V. Souza et al*.* 2020]，以证明自适应算法能够快速收敛到集成相关矩阵的第一主特征向量。


