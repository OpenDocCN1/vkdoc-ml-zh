  [Chatterjee, *Neural Networks*, Vol. 18, No. 2, pp. 145-149, March 2005].


  我生成了 1,000 个 10 维高斯数据样本（即 *n*=10），其均值为零，协方差如下所示。该协方差矩阵是通过将 [Okada and Tomita 85]
