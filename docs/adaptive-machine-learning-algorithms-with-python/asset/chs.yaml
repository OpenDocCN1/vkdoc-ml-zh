  ## 7.3 OJA GEVD 算法


  ### OJA 齐次算法


  OJA 齐次算法的目标函数可以写为


  ![$$ J\left({\mathbf{w}}_k^i;{A}_k,{B}_k\right)=-{{\mathbf{w}}_k^i}^T{A}_k{B}_k^{-1}{A}_k{\mathbf{w}}_k^i+\frac{1}{2}{\left({{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i\right)}²+\sum
  \limits_{j=1,j\ne i}^p{\left({{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^j\right)}²
  $$](img/522202_1_En_7_Chapter_TeX_IEq28.png)，     (7.5)


  其中 *i*=1,…,*p* (*p*≤*n*)。通过对 (7.5) 关于 ![$$ {\mathbf{w}}_k^i $$](img/522202_1_En_7_Chapter_TeX_IEq29.png)
  求梯度，我们得到以下自适应算法：


  ![$$ {\mathbf{w}}_{k+1}^i={\mathbf{w}}_k^i-{\eta}_k{B}_k{A}_k^{-1}{\nabla}_{{\mathbf{w}}_k^i}J\left({\mathbf{w}}_k^i;{A}_k,{B}_k\right)
  $$](img/522202_1_En_7_Chapter_TeX_IEq30.png) 对于 *i*=1,…,*p*，     (7.6)


  其中 *η*[*k*] 是一个递减的增益常数。定义 ![$$ {W}_k=\left[{\mathbf{w}}_k¹\dots {\mathbf{w}}_k^p\right]
  $$](images/522202_1_En_7_Chapter/522202_1_En_7_Chapter_TeX_IEq31.png)，由 (7.6) 我们得到


  ![$$ {W}_{k+1}={W}_k+{\eta}_k\left({A}_k{W}_k-{B}_k{W}_k{W}_k^T{A}_k{W}_k\right)
  $$](img/522202_1_En_7_Chapter_TeX_IEq32.png)。     (7.7)


  ### OJA 紧缩算法


  OJA 紧缩自适应 GEVD 算法的目标函数是


  ![$$ J\left({\mathbf{w}}_k^i;{A}_k,{B}_k\right)=-{{\mathbf{w}}_k^i}^T{A}_k{B}_k^{-1}{A}_k{\mathbf{w}}_k^i+\frac{1}{2}{\left({{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i\right)}²+\sum
  \limits_{j=1}^{i-1}{\left({{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^j\right)}² $$](img/522202_1_En_7_Chapter_TeX_IEq33.png)，     (7.8)


  其中 *i*=1,…,*p*。通过对 (7.8) 关于 ![$$ {\mathbf{w}}_k^i $$](img/522202_1_En_7_Chapter_TeX_IEq34.png)
  求梯度，我们得到 OJA 紧缩自适应梯度下降算法为


  ![$$ {\mathbf{w}}_{k+1}^i={\mathbf{w}}_k^i-{\eta}_k\left({A}_k{\mathbf{w}}_k^i-\sum
  \limits_{j=1}^i{B}_k{\mathbf{w}}_k^j{{\mathbf{w}}_k^j}^T{A}_k{\mathbf{w}}_k^i\right)
  $$](img/522202_1_En_7_Chapter_TeX_IEq35.png)，     (7.9)


  其中 *i*=1,…,*p* (*p*≤*n*)。该算法的矩阵形式为


  ![$$ {W}_{k+1}={W}_k+{\eta}_k\left({A}_k{W}_k-{B}_k{W}_k UT\left({W}_k^T{A}_k{W}_k\right)\right)
  $$](img/522202_1_En_7_Chapter_TeX_IEq36.png)，     (7.10)


  其中 UT[⋅] 将其矩阵参数对角线以下的所有元素设置为零。




  ### OJA 加权算法


  OJA 加权自适应 GEVD 算法的目标函数为


  ![$$ J\left({\mathbf{w}}_k^i;{A}_k,{B}_k\right)=-{c}_i{{\mathbf{w}}_k^i}^T{A}_k{B}_k^{-1}{A}_k{\mathbf{w}}_k^i+\frac{c_i}{2}{\left({{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i\right)}²+\sum
  \limits_{j=1,j\ne i}^p{c}_j{\left({{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^j\right)}²
  $$](img/522202_1_En_7_Chapter_TeX_IEq37.png)     (7.11)


  其中 *i*=1,…,*p*，*c*[1],…,*c*[*p*] (*p*≤*n*) 是满足以下条件的小正数：


  *c*[1] > *c*[2] > … > *c*[*p*] > 0, *p* ≤ *n*.     (7.12)


  给定一个对角矩阵 *C* =  *diag* (*c*[1], …, *c*[*p*])，*p* ≤ *n*，OJA 加权自适应算法为


  ![$$ {W}_{k+1}={W}_k+{\eta}_k\left({A}_k{W}_kC-{B}_k{W}_k{CW}_k^T{A}_k{W}_k\right)
  $$](img/522202_1_En_7_Chapter_TeX_IEq38.png).     (7.13)


  ### OJA 算法 Python 代码


  以下 Python 代码适用于多维数据 `X[nDim,nSamples]` 和 `Y[nDim,nSamples]`：


  ```

  from numpy import linalg as la

  A = np.zeros(shape=(nDim,nDim)) # 存储自适应相关矩阵

  B = np.zeros(shape=(nDim,nDim)) # 存储自适应相关矩阵

  W2 = 0.1 * np.ones(shape=(nDim,nEA)) # 所有算法的权重向量

  W3 = W2

  c = [2.6-0.3*k for k in range(nEA)]

  C = np.diag(c)

  I  = np.identity(nDim)

  for epoch in range(nEpochs):

  for iter in range(nSamples):

  cnt = nSamples*epoch + iter

  # 使用当前数据向量 x,y 更新数据相关矩阵 A,B

  x = X[:,iter]

  x = x.reshape(nDim,1)

  A = A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - A)

  y = Y[:,iter]

  y = y.reshape(nDim,1)

  B = B + (1.0/(1 + cnt))*((np.dot(y, y.T)) - B)

  # 收缩梯度下降

  W2 = W2 + (1/(150 + cnt))*(A @ W2 - B @ W2 @ np.triu(W2.T @ A @ W2))

  # 加权梯度下降

  W3 = W3 + (1/(500 + cnt))*(A @ W3 @ C - B @ W3 @ C @ (W3.T @ A @ W3))

  ```


  ## 7.4 XU GEVD 算法


  ### XU 齐次算法


  XU 齐次自适应 GEVD 算法的目标函数为


  ![$$ J\left({\mathbf{w}}_k^i;{A}_k,{B}_k\right)=-2{{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i+\left({{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i\right)\left({{\mathbf{w}}_k^i}^T{B}_k{\mathbf{w}}_k^i\right)+2\sum
  \limits_{j=1,j\ne i}^p{{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^j{{\mathbf{w}}_k^j}^T{B}_k{\mathbf{w}}_k^i
  $$](img/522202_1_En_7_Chapter_TeX_IEq39.png)     (7.14)


  其中 *i*=1,…,*p* (*p*≤*n*)。通过对 (7.14) 关于 ![$$ {\mathbf{w}}_k^i $$](img/522202_1_En_7_Chapter_TeX_IEq40.png)
  求梯度，我们得到 XU 齐次自适应梯度下降算法：


  ![$$ {\mathbf{w}}_{k+1}^i={\mathbf{w}}_k^i+{\eta}_k\left(2{A}_k{\mathbf{w}}_k^i-\sum
  \limits_{j=1}^p{A}_k{\mathbf{w}}_k^j{{\mathbf{w}}_k^j}^T{B}_k{\mathbf{w}}_k^i-\sum
  \limits_{j=1}^p{B}_k{\mathbf{w}}_k^j{{\mathbf{w}}_k^j}^T{A}_k{\mathbf{w}}_k^i\right)
  $$](img/522202_1_En_7_Chapter_TeX_IEq41.png)     (7.15)


  其中 *i*=1,…,*p*，其矩阵形式为


  ![$$ {W}_{k+1}={W}_k+{\eta}_k\left(2{A}_k{W}_k-{A}_k{W}_k{W}_k^T{B}_k{W}_k-{B}_k{W}_k{W}_k^T{A}_k{W}_k\right)
  $$](img/522202_1_En_7_Chapter_TeX_IEq42.png).     (7.16)


  ### XU 收缩算法


  XU 收缩自适应 GEVD 算法的目标函数为


  ![$$ J\left({\mathbf{w}}_k^i;{A}_k,{B}_k\right)=-2{{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i+\left({{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i\right)\left({{\mathbf{w}}_k^i}^T{B}_k{\mathbf{w}}_k^i\right)+2\sum
  \limits_{j=1}^{i-1}{{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^j{{\mathbf{w}}_k^j}^T{B}_k{\mathbf{w}}_k^i
  $$](img/522202_1_En_7_Chapter_TeX_IEq43.png)     (7.17)


  其中 *i*=1,…,*p* (*p*≤*n*)。通过对 (7.17) 关于 ![$$ {\mathbf{w}}_k^i $$](img/522202_1_En_7_Chapter_TeX_IEq44.png)
  求梯度，我们得到


  ![$$ {W}_{k+1}={W}_k+{\eta}_k\left(2{A}_k{W}_k-{A}_k{W}_k UT\left({W}_k^T{B}_k{W}_k\right)-{B}_k{W}_k
  UT\left({W}_k^T{A}_k{W}_k\right)\right) $$](img/522202_1_En_7_Chapter_TeX_IEq45.png), (7.18)


  其中 UT[⋅] 将其矩阵参数中对角线以下的所有元素设为零。Chatterjee 等人 [Mar 00, Thms 1, 2] 证明，当 *k*→∞ 时，*W*[*k*]
  以概率 1 收敛到 [±**ϕ**[1] ±**ϕ**[2] … ±**ϕ**[*p*]]。


  ### XU 加权算法


  XU 加权自适应 GEVD 算法的目标函数为


  ![$$ J\left({\mathbf{w}}_k^i;{A}_k,{B}_k\right)=-2{c}_i{{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i+{c}_i\left({{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i\right)\left({{\mathbf{w}}_k^i}^T{B}_k{\mathbf{w}}_k^i\right)+2\sum
  \limits_{j=1,j\ne i}^p{c}_j{{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^j{{\mathbf{w}}_k^j}^T{B}_k{\mathbf{w}}_k^i
  $$](img/522202_1_En_7_Chapter_TeX_IEq46.png)     (7.19)


  其中 *i*=1,…,*p* (*p*≤*n*)，*c*[1],…,*c*[*p*] 是满足 (7.12) 的小正数。自适应算法为


  ![$$ {W}_{k+1}={W}_k+{\eta}_k\left(2{A}_k{W}_kC-{B}_k{W}_k{CW}_k^T{A}_k{W}_k-{A}_k{W}_k{CW}_k^T{B}_k{W}_k\right)
  $$](img/522202_1_En_7_Chapter_TeX_IEq47.png),  (7.20)


  其中 *C* = *diag*(*c*[1],…,*c*[*p*])。


  ### XU 算法 Python 代码


  以下 Python 代码适用于多维数据 `X[nDim,nSamples]` 和 `Y[nDim,nSamples]`：


  ```

  from numpy import linalg as la

  A  np.zeros(shape=(nDim,nDim)) # 存储自适应相关矩阵

  B  = np.zeros(shape=(nDim,nDim)) # 存储自适应相关矩阵

  W2 = 0.1 * np.ones(shape=(nDim,nEA)) # 所有算法的权重向量

  W3 = W2

  c = [2.6-0.3*k for k in range(nEA)]

  C = np.diag(c)

  for epoch in range(nEpochs):

  for iter in range(nSamples):

  cnt = nSamples*epoch + iter

  # 使用当前数据向量 x,y 更新数据相关矩阵 A,B

  x = X[:,iter]

  x = x.reshape(nDim,1)

  A = A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - A)

  y = Y[:,iter]

  y = y.reshape(nDim,1)

  B = B + (1.0/(1 + cnt))*((np.dot(y, y.T)) - B)

  # 收缩梯度下降

  W2 = W2 + (1/(100 + cnt))*(A @ W2 - 0.5 * B @ W2 @ \

  np.triu(W2.T @ A @ W2)- 0.5* A@ W2 @ np.triu(W2.T@ B @ W2))

  # 加权梯度下降

  W3 = W3 + (1/(300 + cnt))*(A @ W3 @ C - 0.5 * B @ W3 @ C @ \(W3.T @ A @ W3) - 0.5
  *

  A @ W3 @ C @ (W3.T @ B @ W3))

  ```


  ## 7.5 PF GEVD 算法


  ### PF 齐次算法


  我们将瑞利商准则 (7.2) 写成以下惩罚函数，从而得到 PF 齐次广义特征向量算法的目标函数：


  ![$$ J\left({\mathbf{w}}_k^i;{A}_k,{B}_k\right)=-{{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i+\mu
  \left(\sum \limits_{j=1,j\ne i}^p{\left({{\mathbf{w}}_k^j}^T{B}_k{\mathbf{w}}_k^i\right)}²+\frac{1}{2}{\left({{\mathbf{w}}_k^i}^T{B}_k{\mathbf{w}}_k^i-1\right)}²\right)
  $$](img/522202_1_En_7_Chapter_TeX_IEq48.png),     (7.21)


  其中 *μ* > 0 且 *i*=1,…,*p* (*p*≤*n*)。通过对 (7.21) 关于 ![$$ {\mathbf{w}}_k^i $$](img/522202_1_En_7_Chapter_TeX_IEq49.png)
  求梯度，我们得到 PF 齐次自适应算法：


  ![$$ {W}_{k+1}={W}_k+{\eta}_k\left({A}_k{W}_k-\mu {B}_k{W}_k\left({W}_k^T{B}_k{W}_k-{I}_p\right)\right)
  $$](img/522202_1_En_7_Chapter_TeX_IEq50.png),     (7.22)


  其中 *I*[*p*] 是一个 *p*X*p* 的单位矩阵。




  ### PF 消去算法


  PF 消去 GEVD 算法的目标函数为


  ![$$ J\left({\mathbf{w}}_k^i;{A}_k,{B}_k\right)=-{{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i+\mu
  \left(\sum \limits_{j=1}^{i-1}{\left({{\mathbf{w}}_k^j}^T{B}_k{\mathbf{w}}_k^i\right)}²+\frac{1}{2}{\left({{\mathbf{w}}_k^i}^T{B}_k{\mathbf{w}}_k^i-1\right)}²\right)
  $$](img/522202_1_En_7_Chapter_TeX_IEq51.png), (7.23)


  其中 *μ* > 0 且 *i*=1,…,*p*。自适应算法为


  ![$$ {W}_{k+1}={W}_k+{\eta}_k\left({A}_k{W}_k-\mu {B}_k{W}_k\mathrm{U}T\left({W}_k^T{B}_k{W}_k-{I}_p\right)\right)
  $$](img/522202_1_En_7_Chapter_TeX_IEq52.png),     (7.24)


  其中 UT[⋅] 将其矩阵参数中对角线以下的所有元素设置为零。


  ### PF 加权算法


  PF 加权 GEVD 算法的目标函数为


  ![$$ J\left({\mathbf{w}}_k^i;{A}_k,{B}_k\right)=-{c}_i{{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i+\mu
  \left(\sum \limits_{j=1,j\ne i}^p{c}_i{\left({{\mathbf{w}}_k^j}^T{B}_k{\mathbf{w}}_k^i\right)}²+\frac{c_j}{2}{\left({{\mathbf{w}}_k^i}^T{B}_k{\mathbf{w}}_k^i-1\right)}²\right)
  $$](img/522202_1_En_7_Chapter_TeX_IEq53.png), (7.25)


  其中 *c*[1] > *c*[2] > … > *c*[*p*] > 0 (*p* ≤ *n*), *μ* > 0, 且 *i*=1,…,*p*。相应的自适应算法为


  ![$$ {W}_{k+1}={W}_k+{\eta}_k\left({A}_k{W}_kC-\mu {B}_k{W}_kC\left({W}_k^T{B}_k{W}_k-{I}_p\right)\right)
  $$](img/522202_1_En_7_Chapter_TeX_IEq54.png),     (7.26)


  其中 *C* =  *diag* (*c*[1], …, *c*[*p*])。


  ### PF 算法 Python 代码


  以下 Python 代码适用于多维数据 `X[nDim,nSamples]` 和 `Y[nDim,nSamples]`：


  ```

  from numpy import linalg as la

  A  = np.zeros(shape=(nDim,nDim)) # 存储自适应相关矩阵

  B  = np.zeros(shape=(nDim,nDim)) # 存储自适应相关矩阵

  W2 = 0.1 * np.ones(shape=(nDim,nEA)) # 所有算法的权向量

  W3 = W2

  c = [2.6-0.3*k for k in range(nEA)]

  C = np.diag(c)

  I  = np.identity(nDim)

  for epoch in range(nEpochs):

  for iter in range(nSamples):

  cnt = nSamples*epoch + iter

  # 使用当前数据向量 x,y 更新数据相关矩阵 A,B

  x = X[:,iter]

  x = x.reshape(nDim,1)

  A = A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - A)

  y = Y[:,iter]

  y = y.reshape(nDim,1)

  B = B + (1.0/(1 + cnt))*((np.dot(y, y.T)) - B)

  # 消去梯度下降

  W2 = W2 + (1/(100 + cnt))*(A @ W2 - mu * B @ W2 @ \

  np.triu((W2.T @ B @ W2) - I))

  # 加权梯度下降

  W3 = W3 + (1/(500 + cnt))*(A @ W3 @ C - mu * B @ W3 @ C @ \

  ((W3.T @ B @ W3) - I))

  ```


  ## 7.6 AL1 GEVD 算法


  ### AL1 齐次算法


  我们将非线性优化的增广拉格朗日方法应用于瑞利商准则 (7.4)，得到 AL1 齐次 GEVD 算法的目标函数：


  ![$$ J\left({\mathbf{w}}_k^i;{A}_k,{B}_k\right)=-{{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i+\alpha
  \left({{\mathbf{w}}_k^i}^T{B}_k{\mathbf{w}}_k^i-1\right)+2\sum \limits_{j=1,j\ne
  i}^p{\beta}_j{{\mathbf{w}}_k^j}^T{B}_k{\mathbf{w}}_k^i $$](img/522202_1_En_7_Chapter_TeX_IEq55.png),


  ![$$ +\mu \left(\sum \limits_{j=1,j\ne i}^p{\left({{\mathbf{w}}_k^j}^T{B}_k{\mathbf{w}}_k^i\right)}²+\frac{1}{2}{\left({{\mathbf{w}}_k^i}^T{B}_k{\mathbf{w}}_k^i-1\right)}²\right)
  $$](img/522202_1_En_7_Chapter_TeX_IEq56.png),     (7.27)


  对于 *i*=1,…,*p* (*p*≤*n*)，其中 (*α*, *β*[1], *β*[2], …, *β*[*p*]) 是拉格朗日乘子，*μ* 是一个正的惩罚常数。对
  ![$$ J\left({\mathbf{w}}_k^i;{A}_k,{B}_k\right) $$](img/522202_1_En_7_Chapter_TeX_IEq57.png)
  关于 ![$$ {\mathbf{w}}_k^i $$](img/522202_1_En_7_Chapter_TeX_IEq58.png) 求梯度，令梯度等于
  **0**，并利用约束条件 ![$$ {{\mathbf{w}}_k^j}^T{B}_k{\mathbf{w}}_k^i={\delta}_{ij} $$](img/522202_1_En_7_Chapter_TeX_IEq59.png)，我们得到


  ![$$ \alpha ={{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i $$](img/522202_1_En_7_Chapter_TeX_IEq60.png)
  且 ![$$ {\beta}_j={{\mathbf{w}}_k^j}^T{A}_k{\mathbf{w}}_k^i $$](img/522202_1_En_7_Chapter_TeX_IEq61.png)
  对于 *j*=1,…,*p*。     (7.28)


  将 (7.27) 梯度中的 (*α*, *β*[1], *β*[2], …, *β*[*p*]) 替换，我们得到 AL1 齐次自适应梯度下降广义特征向量算法：


  ![$$ {\mathbf{w}}_{k+1}^i={\mathbf{w}}_k^i+{\eta}_k\left({A}_k{\mathbf{w}}_k^i-\sum
  \limits_{j=1}^p{B}_k{\mathbf{w}}_k^j\left({{\mathbf{w}}_k^j}^T{A}_k{\mathbf{w}}_k^i\right)\right.\left.-\mu
  \sum \limits_{j=1}^p{B}_k{\mathbf{w}}_k^j\left({{\mathbf{w}}_k^j}^T{B}_k{\mathbf{w}}_k^i-{\delta}_{ij}\right)\right)
  $$](img/522202_1_En_7_Chapter_TeX_IEq62.png) (7.29)


  其中 *μ* > 0。定义 ![$$ {W}_k=\left[{\mathbf{w}}_k¹\dots {\mathbf{w}}_k^p\right] $$](images/522202_1_En_7_Chapter/522202_1_En_7_Chapter_TeX_IEq63.png)，我们得到


  ![$$ {W}_{k+1}={W}_k+{\eta}_k\left(\left({A}_k{W}_k-{B}_k{W}_k{W}_k^T{A}_k{W}_k-\mu
  {B}_k{W}_k\left({W}_k^T{B}_k{W}_k-{I}_p\right)\right)\right. $$](img/522202_1_En_7_Chapter_TeX_IEq64.png), (7.30)


  其中 *I*[*p*] 是一个 *p*X*p* 的单位矩阵。


  ### AL1 消去算法


  AL1 消去 GEVD 算法的目标函数为


