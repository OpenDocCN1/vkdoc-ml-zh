  手写 MNIST 数字 0 及所有字符的相关矩阵


  以下 Python 代码对数据样本 `X[nDim,nSamples]` 进行白化：


  ```

  from scipy.linalg import eigh

  nDim = X.shape[0]

  corX = (X @ X.T) / nSamples

  eigvals, eigvecs = eigh(corX)

  V  = np.fliplr(eigvecs)

  D = np.zeros(shape=(nDim,nDim))

  for i in range(nDim):

  if (eigvals[::-1][i] < 10):

  D[i,i] = 0

  else:

  D[i,i] = np.sqrt(1/eigvals[::-1][i])

  Z = V @ D @ V.T @ X

  ```


  接下来，让我们看看变换后的数据和新的相关矩阵。图 3-3 显示，字符的差异化特征得到增强，相关矩阵呈对角线分布，而非沿所有像素分布，表明数据已白化，相关矩阵为单位矩阵。


  ![](img/522202_1_En_3_Fig3a_HTML.jpg)![](img/522202_1_En_3_Fig3b_HTML.jpg)


  图 3-3


  白化后的手写 MNIST 数字 0。所有字符的相关矩阵是对角矩阵。


  我们将数据相关矩阵 *A* 定义为


  ![$$ {A}_k=\frac{1}{k}\sum \limits_{i=1}^k{\mathbf{x}}_i{\mathbf{x}}_i^T={A}_{k-1}+\frac{1}{k}\left({\mathbf{x}}_k{\mathbf{x}}_k^T-{A}_{k-1}\right).
  $$](img/522202_1_En_3_Chapter_TeX_Equa.png)


  *A* 的平方根，也称为 Cholesky 分解 [Cholesky 分解，维基百科]，记作 *A*^½。类似地，*A*^(–½) 表示 *A* 的逆平方根。然而，如下文所述，这两个矩阵函数均无唯一解，并且可以得到各种自适应算法，每种算法都会导致不同的解。尽管这些矩阵函数有无数解，但在某些限制条件下（例如唯一的对称正定解）存在唯一解。


  在本章中，我为每个矩阵函数 *A*^½ 和 *A*^(–½) 各介绍三种自适应算法。在这三种算法中，一种自适应算法得到对称正定解，另外两种得到更一般的解。




  ### A^½ 和 A^(–½) 的多种解法


  设 *A*=ΦΛΦ^(*T*) 为实对称正定 *n*×*n* 矩阵 *A* 的特征分解，其中 Φ 和 Λ 分别是 *A* 的特征向量矩阵和特征值矩阵。这里 Λ=diag(*λ*[1],…,*λ*[*n*])
  是对角特征值矩阵，满足 *λ*[1]≥…≥*λ*[*n*]>0，且 Φ∈ℜ^(*nXn*) 是标准正交矩阵。*A*^½ 的一个解是 *L*=Φ*D*，其中 *D*=![$$
  \operatorname{diag}\left(\pm {\lambda}_1^{\frac{1}{2}},\dots, \pm {\lambda}_n^{\frac{1}{2}}\right)
  $$](img/522202_1_En_3_Chapter_TeX_IEq1.png)。然而，这通常不是一个对称解，并且对于任何标准正交^(¹)矩阵 *U*，Φ*DU*
  也是一个解。我们可以证明，*A*^½ 是对称的当且仅当其形式为 Φ*DΦ*^(*T*)，并且 *A*^½ 有 2^(*n*) 个对称解。当 *D* 正定时，我们得到
  *A*^½ 的唯一对称正定解为 ΦΛ^½Φ^(*T*)，其中 Λ^½ = ![$$ \operatorname{diag}\left({\lambda}_1^{\frac{1}{2}},\dots,
  {\lambda}_n^{\frac{1}{2}}\right) $$](img/522202_1_En_3_Chapter_TeX_IEq2.png)。类似地，*A*
  的逆平方根 *A*^(–½) 的一个通解是 Φ*D*^(–1)*U*，其中 *D* 如前定义，*U* 是任意标准正交矩阵。*A*^(–½) 的唯一对称正定解是
  ΦΛ^(–½)Φ^(*T*)，其中 Λ^(–½) =![$$ \operatorname{diag}\left({\lambda}_1^{-\frac{1}{2}},\dots,
  {\lambda}_n^{-\frac{1}{2}}\right) $$](img/522202_1_En_3_Chapter_TeX_IEq3.png)。


  ### 本章概要


  在第 3.2、3.3 和 3.4 节中，我将讨论三种用于自适应计算 *A*^½ 的算法。第 3.4 节讨论了 *A*^½ 的唯一对称正定解。在第 3.5、3.6
  和 3.7 节中，我将讨论三种用于自适应计算 *A*^(–½) 的算法。第 3.7 节描述了 *A*^(–½) 的唯一对称正定解。第 3.8 节展示了使用 10
  维高斯数据对六种算法的实验结果。第 3.9 节对本章进行总结。


  ## 3.2 自适应平方根算法：方法 1


  设 {**x**[*k*∈]ℜ^(*n*)} 是一个数据向量序列，其在线数据相关矩阵 *A*[*k*∈]ℜ^(*nXn*) 由下式给出：


  ![$$ {A}_k=\frac{1}{k}\sum \limits_{i=1}^k{\beta}^{k-i}{\mathbf{x}}_i{\mathbf{x}}_i^T
  $$](img/522202_1_En_3_Chapter_TeX_IEq4.png)。     (3.1)


  这里 **x**[*k*] 是时刻 *k* 的观测向量，0<*β*≤1 是用于非平稳序列的遗忘因子。如果数据是平稳的，渐近相关矩阵 *A* 为：


  ![$$ A=\underset{k\to \infty }{\lim }E\left[{A}_k\right] $$](images/522202_1_En_3_Chapter/522202_1_En_3_Chapter_TeX_IEq5.png)。     (3.2)


  ### 目标函数


  遵循第 1.​4 节描述的方法，我首先给出一个目标函数 *J*，该函数关于矩阵 *W* 的最小值给出了渐近数据相关矩阵 *A* 的平方根。目标函数为：


  ![$$ J(W)={\left\Vert A-{W}^TW\right\Vert}_F² $$](img/522202_1_En_3_Chapter_TeX_IEq6.png)。     (3.3)


  *J*(*W*) 关于 *W* 的梯度为：


  ∇[*W*]*J*(*W*) =  − 4*W*(*A* − *W*^(*T*)*W*)。     (3.4)


  ### 自适应算法


  根据 (3.4) 中的梯度，我们得到以下自适应梯度下降算法：


  ![$$ {W}_{k+1}={W}_k-{\eta}_k\left(1/4\right){\nabla}_WJ\left({W}_k;{A}_k\right)={W}_k+{\eta}_k\left({W}_k{A}_k-{W}_k{W}_k^T{W}_k\right)
  $$](img/522202_1_En_3_Chapter_TeX_IEq7.png)，     (3.5)


  其中 *η*[*k*] 是一个小的递减常数，并遵循 GitHub [Chatterjee GitHub] 上收敛性证明中的假设 A1.2。


  以下 Python 代码使用数据 `X[nDim,nSamples]` 实现了此算法：


  ```

  for epoch in range(nEpochs):

  for iter in range(nSamples):

  cnt = nSamples*epoch + iter

  x = X[:,iter]

  x = x.reshape(nDim,1)

  A = A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - A)

  etat1 = 1.0/(50 + cnt)

  # 算法 1

  W1 = W1 + etat1 * (W1 @ A - W1 @ W1.T @ W1)

  ```


  ## 3.3 自适应平方根算法：方法 2


  ### 目标函数


  目标函数 *J*(*W*)，其关于 *W* 的最小值给出了 *A* 的平方根，为：


  ![$$ J(W)={\left\Vert A-{WW}^T\right\Vert}_F² $$](img/522202_1_En_3_Chapter_TeX_IEq8.png)。     (3.6)


  *J*(*W*) 关于 *W* 的梯度为：


  ∇[*W*]*J*(*W*) =  − 4(*A* − *WW*^(*T*) )*W*。     (3.7)


  ### 自适应算法


  我们得到以下用于 *A* 的平方根的自适应梯度下降算法：


  ![$$ {W}_{k+1}={W}_k-{\eta}_k\left(1/4\right){\nabla}_WJ\left({W}_k;{A}_k\right)={W}_k+{\eta}_k\left({A}_k{W}_k-{W}_k{W}_k^T{W}_k\right)
  $$](img/522202_1_En_3_Chapter_TeX_IEq9.png)，     (3.8)


  其中 *η*[*k*] 是一个小的递减常数。


  以下 Python 代码使用数据 `X[nDim,nSamples]` 实现了此算法：


  ```

  for epoch in range(nEpochs):

  for iter in range(nSamples):

  cnt = nSamples*epoch + iter

  x = X[:,iter]

  x = x.reshape(nDim,1)

  A = A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - A)

  etat1 = 1.0/(50 + cnt)

  # 算法 2

  W2 = W2 + etat1 * (A @ W2 - W2 @ W2.T @ W2)

  ```


  ## 3.4 自适应平方根算法：方法 3


  ### 自适应算法


  遵循自适应算法 (3.5) 和 (3.8)，我现在提出一种用于计算 *A* 的对称正定平方根的算法：


  ![$$ {W}_{k+1}={W}_k+{\eta}_k\left({A}_k-{W}_k²\right) $$](img/522202_1_En_3_Chapter_TeX_IEq10.png)，     (3.9)


  其中 *η*[*k*] 是一个小的递减常数，且 *W*[*k*] 是对称的。


  以下 Python 代码使用数据 `X[nDim,nSamples]` 实现了此算法：


  ```

  for epoch in range(nEpochs):

  for iter in range(nSamples):

  cnt = nSamples*epoch + iter

  x = X[:,iter]

  x = x.reshape(nDim,1)

  A = A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - A)

  etat2 = 1.0/(50 + cnt)

  # 算法 3

  W3 = W3 + etat2 * (A - W3 @ W3)

  ```


  ## 3.5 自适应逆平方根算法：方法 1


  ### 目标函数


  目标函数 *J*(*W*)，其最小化器 *W*^(***) 给出了 *A* 的逆平方根，为：


  ![$$ J(W)={\left\Vert I-{W}^T AW\right\Vert}_F² $$](img/522202_1_En_3_Chapter_TeX_IEq11.png)。     (3.10)


  *J*(*W*) 关于 *W* 的梯度为：


  ∇[*W*]*J*(*W*) =  − 4*AW*(*I* − *W*^(*T*)*AW*)。     (3.11)


  ### 自适应算法


  根据 (3.11) 中的梯度，我们得到以下自适应梯度下降算法：


  ![$$ {W}_{k+1}={W}_k-{\eta}_k\left(1/4\right){A}_k^{-1}{\nabla}_WJ\left({W}_k;{A}_k\right)={W}_k+{\eta}_k\left({W}_k-{W}_k{W}_k^T{A}_k{W}_k\right)
  $$](img/522202_1_En_3_Chapter_TeX_IEq12.png)     (3.12)


  以下 Python 代码使用数据 `X[nDim,nSamples]` 实现了此算法：


  ```

  for epoch in range(nEpochs):

  for iter in range(nSamples):

  cnt = nSamples*epoch + iter

  x = X[:,iter]

  x = x.reshape(nDim,1)

  A = A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - A)

  etat1 = 1.0/(100 + cnt)

  # 算法 1

  W1 = W1 + etat1 * (W1 - W1 @ W1.T @ A @ W1)

  ```


  ## 3.6 自适应逆平方根算法：方法 2




  ### 目标函数


  目标函数 *J*(*W*) 关于 *W* 的最小化给出了 *A* 的逆平方根，其表达式为：


  ![$$ J(W)={\left\Vert I-{WAW}^T\right\Vert}_F² $$](img/522202_1_En_3_Chapter_TeX_IEq13.png)。     (3.13)


  *J*(*W*) 关于 *W* 的梯度为：


  ∇[*W*]*J*(*W*) =  − 4(*I* − *WAW*^(*T*))*WA*。     (3.14)


  ### 自适应算法


  我们得到以下用于计算 *A* 的逆平方根的自适应算法：


  ![$$ {W}_{k+1}={W}_k-{\eta}_k\left(1/4\right){\nabla}_WJ\left({W}_k;{A}_k\right){A}_k^{-1}={W}_k+{\eta}_k\left({W}_k-{W}_k{A}_k{W}_k^T{W}_k\right)
  $$](img/522202_1_En_3_Chapter_TeX_IEq14.png)，     (3.15)


  其中 *η*[*k*] 是一个小的递减常数。


  以下 Python 代码使用数据 `X[nDim,nSamples]` 实现了该算法：


  ```

  for epoch in range(nEpochs):

  for iter in range(nSamples):

  cnt = nSamples*epoch + iter

  x = X[:,iter]

  x = x.reshape(nDim,1)

  A = A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - A)

  etat1 = 1.0/(100 + cnt)

  # 算法 2

  W2 = W2 + etat1 * (W2 - W2 @ A @ W2.T @ W2)

  ```


  ## 3.7 自适应逆平方根算法：方法 3


  ### 自适应算法


  通过扩展自适应算法 (3.12) 和 (3.15)，我现在提出一种用于计算 *A* 的对称正定逆平方根的自适应算法：


  *W*[*k* + 1] = *W*[*k*] + *η**k*，     (3.16)


  其中 *η*[*k*] 是一个小的递减常数，且 *W*[*k*] 是对称的。


  以下 Python 代码使用数据 `X[nDim,nSamples]` 实现了该算法：


  ```

  for epoch in range(nEpochs):

  for iter in range(nSamples):

  cnt = nSamples*epoch + iter

  x = X[:,iter]

  x = x.reshape(nDim,1)

  A = A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - A)

  etat2 = 1.0/(100 + cnt)

  # 算法 3

  W3 = W3 + etat2 * (I - W3 @ A @ W3)

  ```


