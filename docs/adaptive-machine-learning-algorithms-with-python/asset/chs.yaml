  \n\n\n## 8.3 压缩高容量与高维数据\n\n当输入数据量很大时，将这些数据存储在设备上用于训练机器学习模型可能会变得极其困难。如果数据是高维的（例如超过\
  \ 100 维），问题会变得更加复杂。在这种情况下，我们希望将数据压缩成批次，并存储特征向量的序列，以供将来用于机器学习训练。\n\n在本例中，我使用了开源的\
  \ `gassensor.arff` 数据。该数据集包含 129 个分量/维度，共 13,910 个样本。我使用了自适应 EVD 算法（5.13）来计算前 16\
  \ 个主成分 [**ϕ**[1] **ϕ**[2] … **ϕ**[16]]。然后我从这 16 维的主成分中重建了数据。在图 8-10 中，左列是原始数据，右列是重建数据。显然，它们看起来非常相似，并且实现了\
  \ 8 倍的数据压缩。\n\n![](img/522202_1_En_8_Fig10_HTML.jpg)\n\n图 8-10\n\n使用自适应 EVD 算法（5.13）实现\
  \ 8 倍压缩的原始数据（左）与重建数据（右）\n\nPython 代码见第 5.4 节，以及下方针对 `dataset[nDim,nSamples]` 的代码：\n\
  \n```\nfrom numpy import linalg as la\nnSamples = dataset.shape[0]\nnDim = dataset.shape[1]\n\
  nEA = 16\nA = np.zeros(shape=(nDim,nDim)) # 存储自适应相关矩阵\nN = np.zeros(shape=(1,nEA))\
  \ # 存储特征范数\nW = 0.1 * np.ones(shape=(nDim,nEA)) # 存储自适应特征向量\nfor iter in range(nSamples):\n\
  cnt = iter + 1\n# 使用当前样本 x 更新数据相关矩阵 A\nx = np.array(dataset.iloc[iter])\nx = x.reshape(nDim,1)\n\
  A = A + (1.0/cnt)*((np.dot(x, x.T)) - A)\netat = 1.0/(500 + cnt)\n# 缩减梯度下降\nW =\
  \ W + etat*(A @ W - 0.5*W @ np.triu(W.T @ A @ W) - \\\n0.5*A @ W @ np.triu(W.T @\
  \ W))\n```\n\n### 数据表示（PCA）特征\n\n让我们通过比较传统方法计算的批次相关矩阵的特征值和特征向量，与自适应算法（5.13）在每个自适应步骤中针对前四个主特征向量的结果，来展示自适应算法的成功。\n\
