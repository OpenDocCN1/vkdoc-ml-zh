  \left({{\mathbf{w}}_k^i}^T{B}_k{\mathbf{w}}_k^i-1\right)+2\sum \limits_{j=1}^{i-1}{\beta}_j{{\mathbf{w}}_k^j}^T{B}_k{\mathbf{w}}_k^i
  $$](img/522202_1_En_7_Chapter_TeX_IEq65.png)


