  mathbf{w}}_k^i $$](img/522202_1_En_5_Chapter_TeX_IEq78.png) 的梯度设为零，并利用约束条件 ![$$\
  \ {{\\mathbf{w}}_k^j}^T{\\mathbf{w}}_k^i={\\delta}_{ij} $$](img/522202_1_En_5_Chapter_TeX_IEq79.png)，我们得到\n\
  \n*α* = 0 且 ![$$ {\\beta}_j={{\\mathbf{w}}_k^j}^T{A}_k{\\mathbf{w}}_k^i/{{\\mathbf{w}}_k^i}^T{A}_k{\\\
  mathbf{w}}_k^i $$](img/522202_1_En_5_Chapter_TeX_IEq80.png)，其中 *j*=1,…,*p*, *j*≠*i*。     (5.36)\n\
  \n将 (*α*,*β*[1],*β*[2],…,*β*[*p*]) 代入 (5.36) 的梯度中，我们得到用于 PCA 的 IT 齐次自适应梯度下降算法：\n\
  \n![$$ {W}_{k+1}={W}_k+{\\eta}_k\\left({A}_k{W}_k-{W}_k{W}_k^T{A}_k{W}_k\\right)\\\
  kern0.5em \\mathrm{DIAG}{\\left({W}_k^T{A}_k{W}_k\\right)}^{-1} $$](img/522202_1_En_5_Chapter_TeX_IEq81.png),     (5.37)\n\
  \n其中 DIAG[⋅] 将其矩阵参数中*除*对角线以外的所有元素设为零，从而使矩阵对角化。*W*[*k*] 收敛于 *W*^*= Φ*DU*，其中 *D=*[*D*[1]|0]^(*T*)∈ℜ^(*n*X*p*),\
  \ *D*[1]*=diag*(*d*[1]*,...,d*[*p*])∈ ℜ^(*p*X*p*), *d*[*i*]*=*±1 对于 *i=*1,...,*p*，且\
  \ *U*∈ℜ^(*p*X*p*) 是一个任意旋转矩阵*。\n\n### IT 收缩算法\n\n信息论收缩 PCA 算法的目标函数为\n\n![$$ J\\left({\\\
  mathbf{w}}_k^i;{A}_k\\right)={{\\mathbf{w}}_k^i}^T{\\mathbf{w}}_k^i-\\log \\left({{\\\
  mathbf{w}}_k^i}^T{A}_k{\\mathbf{w}}_k^i\\right)+\\alpha \\left({{\\mathbf{w}}_k^i}^T{\\\
  mathbf{w}}_k^i-1\\right)+2\\sum \\limits_{j=1}^{i-1}{\\beta}_j{{\\mathbf{w}}_k^j}^T{\\\
  mathbf{w}}_k^i $$](img/522202_1_En_5_Chapter_TeX_IEq82.png),     (5.38)\n\n其中 (*α*,*β*[1],*β*[2],…,*β*[*i*–1])\
  \ 是拉格朗日乘子，且 *i*=1,…,*p*。通过求解 (*α*,*β*[1],*β*[2],…,*β*[*i*–1]) 并将其代入 (5.38) 的梯度中，我们得到用于\
  \ PCA 的 IT 收缩自适应梯度下降算法：\n\n![$$ {W}_{k+1}={W}_k+{\\eta}_k\\left({A}_k{W}_k-{W}_k\
  \ UT\\left({W}_k^T{A}_k{W}_k\\right)\\right)\\kern0.5em \\mathrm{DIAG}{\\left({W}_k^T{A}_k{W}_k\\\
  right)}^{-1} $$](img/522202_1_En_5_Chapter_TeX_IEq83.png).     (5.39)\n\n当 *k*→∞\
  \ 时，*W*[*k*] 以概率 1 收敛于 *W*^(***)= [±**ϕ**[1] ±**ϕ**[2] … ±**ϕ**[*p*]]。\n\n### IT\
  \ 加权算法\n\nIT 加权 PCA 算法的目标函数为\n\n![$$ J\\left({\\mathbf{w}}_k^i;{A}_k\\right)={c}_i{{\\\
  mathbf{w}}_k^i}^T{\\mathbf{w}}_k^i-{c}_i\\log \\left({{\\mathbf{w}}_k^i}^T{A}_k{\\\
  mathbf{w}}_k^i\\right)+\\alpha {c}_i\\left({{\\mathbf{w}}_k^i}^T{\\mathbf{w}}_k^i-1\\\
  right)+2\\sum \\limits_{j=1,j\\ne i}^p{\\beta}_j{c}_j{{\\mathbf{w}}_k^j}^T{\\mathbf{w}}_k^i\
  \ $$](img/522202_1_En_5_Chapter_TeX_IEq84.png)     (5.40)\n\n其中 *i*=1,…,*p* 且 (*α*,*β*[1],*β*[2],…,*β*[*p*])\
  \ 是拉格朗日乘子。IT 加权自适应梯度下降算法为：\n\n![$$ {W}_{k+1}={W}_k+{\\eta}_k\\left({A}_k{W}_kC-{W}_k{CW}_k^T{A}_k{W}_k\\\
  right)\\kern0.5em \\mathrm{DIAG}{\\left({W}_k^T{A}_k{W}_k\\right)}^{-1} $$](img/522202_1_En_5_Chapter_TeX_IEq85.png),     (5.41)\n\
  \n其中 *C*=*diag*(*c*[1],…,*c*[*p*]) 且 *c*[1]>*c*[2]>…>*c*[*p*]>0。这里，当 *k*→∞ 时，*W*[*k*]\
  \ 收敛于 *W*^(***)= [±**ϕ**[1] ±**ϕ**[2] … ±**ϕ**[*p*]]。\n\n\n\n### IT 算法 Python 代码\n\
  \n以下 Python 代码使用数据 `X[nDim,nSamples]` 实现了 IT PCA 算法：\n\n```\nfrom numpy import linalg\
  \ as la\nnEA = 4 # number of PCA components computed\nnEpochs  = 3\nA  = np.zeros(shape=(nDim,nDim))\
  \ # stores adaptive correlation matrix\nW1 = 0.1 * np.ones(shape=(nDim,nEA)) # weight\
  \ vectors of all algorithms\nW2 = W1\nW3 = W1\nc = [2-0.3*k for k in range(nEA)]\n\
  C = np.diag(c)\nfor epoch in range(nEpochs):\nfor iter in range(nSamples):\ncnt\
  \ = nSamples*epoch + iter\nx = X[:,iter]\nx = x.reshape(nDim,1)\nA = A + (1.0/(1\
  \ + cnt))*((np.dot(x, x.T)) - A)\n# Homogeneous Gradient Descent\nW1 = W1 + (1/(50\
  \ + cnt))*(A @ W1 - W1 @ (W1.T @ A @ W1)) @ \\inv(np.diag(\nnp.diagonal(W1.T @ A\
  \ @ W1)))\n# Deflated Gradient Descent\nW2 = W2 + (1/(20 + cnt))*(A @ W2 - W2 @\
  \ np.triu(W2.T @ A @ W2)) @ \\inv(np.diag(\nnp.diagonal(W2.T @ A @ W2)))\n# Weighted\
  \ Gradient Descent\nW3 = W3 + (1/(10 + cnt))*(A @ W3 @ C - W3 @ C @ (W3.T @ A @\
  \ W3)) @ \\inv(np.diag(\nnp.diagonal(W3.T @ A @ W3)))\n```\n\n## 5.9 RQ 算法\n\n###\
  \ RQ 齐次算法\n\n我们从瑞利商出发，为瑞利商齐次 PCA 算法推导出如下目标函数：\n\n![$$ J\\left({\\mathbf{w}}_k^i;{A}_k\\\
  right)=-\\frac{{{\\mathbf{w}}_k^i}^T{A}_k{\\mathbf{w}}_k^i}{{{\\mathbf{w}}_k^i}^T{\\\
