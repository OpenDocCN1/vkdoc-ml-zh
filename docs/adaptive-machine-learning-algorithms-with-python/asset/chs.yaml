- '# 6. 特征向量的加速计算


  ## 6.1 引言


  在第 5 章中，我讨论了几种自适应算法，用于从向量序列 {**x**[*k*]∈ℜ^(*n*)} 中计算在线相关矩阵 *A*[*k*]∈ℜ^(*n*X*n*)
  的主特征向量和次特征向量。我通过在目标函数上应用梯度下降法推导了这些算法。然而，众所周知[Baldi and Hornik 95, Chatterjee et
  al*.* Mar 98, Haykin 94]，基于梯度下降的*主成分分析*（PCA）算法收敛缓慢。此外，分析和实验研究均表明，这些算法的收敛性取决于增益序列
  {*η*[*k*]} 的适当选择。而且，已有证明[Chatterjee et al*.* Nov 97; Chatterjee et al*.* Mar 98;
  Chauvin 89]指出，如果增益序列超过上限，算法可能会发散或收敛到错误解。


  由于这些算法大多用于实时（即在线）处理，因此在在线过程开始时确定增益参数的适当选择尤其困难。因此，为了更广泛地应用这些算法，重要的是：


  *   加快算法的收敛速度，以及

  *   根据当前数据样本自动选择增益参数。




  ### 基于梯度的自适应 PCA 的目标函数


  第 4 章和第 5 章讨论的部分目标函数已被实践者用于通过先进非线性优化技术推导加速自适应 PCA 算法，这些技术包括：


  *   最速下降法 (SD)，

  *   共轭方向法 (CD)，

  *   牛顿-拉夫逊法 (NR)，以及

  *   递归最小二乘法 (RLS)。


  与第 4 章和第 5 章讨论的梯度下降法相比，这些优化方法使算法收敛速度更快。它们还帮助我们计算增益序列 {*η*[*k*]} 的值，这在梯度下降法中是无法获得的。唯一的缺点是这些改进算法需要额外的计算量。请注意，每种优化方法应用于不同的目标函数时，都会产生一种新的自适应
  PCA 算法。


  在信号处理应用中，第一个广泛用于加速 PCA 的目标函数是瑞利商 (RQ) 目标函数，详见第 4.​4 节和第 5.​9 节。Sarkar 等人 [Sarkar
  et al*.* 89; Yang et al*.* 89] 将最速下降法和共轭方向法应用于该目标函数，以计算极值（最大或最小）特征向量。Fu 和 Dowling
  [Fu and Dowling 94, 95] 推广了共轭方向算法，用于计算所有特征向量。Zhu 和 Wang [Zhu and Wang 97] 也对该目标函数的正则化总体最小二乘版本使用了共轭方向法。关于基于共轭方向法处理
  RQ 目标函数的综述，可参见 [Yang et al*.* 89]。


  第二个用于加速 PCA 的目标函数是惩罚函数 (PF) 目标函数，详见第 4.​7 节和第 5.​5 节。Chauvin [Chauvin 97] 提出了一种基于
  PF 目标函数的梯度下降算法，并分析了该函数的景观。Mathew 等人 [Mathew et al*.* 94, 95, 96] 也使用该目标函数，提出了一种用于自适应
  PCA 的牛顿型算法。


  第三个用于加速 PCA 的目标函数是信息论 (IT) 目标函数，详见第 4.​5 节和第 5.​8 节。Miao 和 Hua [Miao and Hua 98]
  提出了用于自适应主子空间分析的梯度下降和 RLS 算法。


  第四个用于加速 PCA 的目标函数是 XU 目标函数，详见第 4.​6 节和第 5.​4 节。例如，Xu [Xu 93]、Yang [Yang 95]、Fu 和
  Dowling [Fu and Dowling 94]、Bannour 和 Azimi-Sadjadi [Bannour and Azimi-Sadjadi 95]
  以及 Miao 和 Hua [Miao and Hua 98] 都使用了该目标函数的变体。如第 5.​4 节所述，该目标函数有几种变体，包括两层线性自联想神经网络输出的均方误差。Xu
  通过使用梯度下降法推导出一种自适应主子空间分析算法。Yang 使用了梯度下降法和递归最小二乘优化方法。Bannour 和 Azimi-Sadjadi 也描述了一种基于递归最小二乘法的自适应
  PCA 算法，该算法使用了此目标函数。Fu 和 Dowling 将该目标函数简化为类似于 RQ 目标函数的形式，从而可以通过 Sarkar 等人 [Sarkar
  et al*.* 89; Yang et al*.* 89] 提出的共轭方向法进行最小化。他们还通过使用近似和紧缩技术计算了次分量。


  ### 本章概要


  第 4 章和第 5 章讨论的任何目标函数，都可以通过使用非线性优化技术（针对该目标函数）来获得加速的自适应 PCA 算法，这些技术包括：


  *   梯度下降法，

  *   最速下降法，

  *   共轭方向法，

  *   牛顿-拉夫逊法，以及

  *   递归最小二乘法。


  然而，在本章的讨论中，我将只使用这些目标函数中的一个。我注意到，这些分析可以推广到第 4 章和第 5 章中的其他目标函数。本章我选择的目标函数是第 5.​4 节讨论的
  XU 紧缩目标函数。


  尽管对 XU 目标函数（见第 5.​4 节）进行梯度下降会产生著名的 Xu 最小均方误差重构 (LMSER) 算法 [Xu 93]，但最速下降法、共轭方向法和牛顿-拉夫逊法则为
  PCA 产生了新的自适应算法 [Chatterjee et al. Mar 00]。惩罚函数 (PF) 紧缩目标函数（见第 5.​5 节）也已通过 Kang 等人
  [Kang et al*.* 00] 的最速下降法、共轭方向法和拟牛顿优化方法得到了加速。


  我将把这些算法应用于平稳和**非平稳多维**高斯数据序列。我通过实验表明，与 Xu [Xu 93] 提出的传统梯度下降技术相比，自适应最速下降法、共轭方向法和牛顿-拉夫逊算法收敛得更快。此外，新算法能根据当前数据样本自动选择增益序列
  {*η*[*k*]}。我进一步将最速下降算法与最先进的方法进行比较，例如 Yang 的投影近似子空间跟踪 (PASTd) [Yang 95]、Bannour 和
  Sadjadi 的递归最小二乘法 (RLS) [Bannour et al*.* 95] 以及 Fu 和 Dowling 的共轭梯度特征结构跟踪 (CGET1)
  [Fu and Dowling 94, 95] 算法。


  用于自适应 PCA 算法的 XU 紧缩目标函数在第 5.​4 节的公式 (5.12) 中给出：


  ![$$ J\left({\mathbf{w}}_k^i;{A}_k\right)=-2{{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i+{{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i{{\mathbf{w}}_k^i}^T{\mathbf{w}}_k^i+2\sum
  \limits_{j=1}^{i-1}{{\mathbf{w}}_k^i}^T{\mathbf{w}}_k^j{{\mathbf{w}}_k^j}^T{A}_k{\mathbf{w}}_k^i
  $$](img/522202_1_En_6_Chapter_TeX_IEq1.png)，     (6.1)


  其中 *i*=1,…,*p*，*A*[*k*]∈ℜ^(*n*X*n*) 是在线观测矩阵。我现在将不同的非线性最小化方法应用于公式 (6.1) 中的目标函数 ![$$
  J\left({\mathbf{w}}_k^i;{A}_k\right) $$](img/522202_1_En_6_Chapter_TeX_IEq2.png)，以获得用于自适应
  PCA 的各种算法。


  在第 6.2 节、6.3 节、6.4 节和 6.5 节中，我将梯度下降法、最速下降法、共轭方向法和牛顿-拉夫逊优化方法应用于公式 (6.1) 中给出的用于 PCA
  的无约束 XU 目标函数。在此，我获得了用于自适应 PCA 的新算法。在第 6.6 节中，我展示了使用平稳和非平稳高斯序列的实验结果，从而证明了新算法比传统的梯度下降自适应
  PCA 算法收敛更快。我还将最速下降算法与最先进的算法进行了比较。第 6.7 节对本章进行了总结。




  ## 6.2 梯度下降算法


  [Chatterjee 等人，《IEEE 神经网络汇刊》，第 11 卷，第 2 期，第 338-355 页，2000 年 3 月]


  (6.1) 关于 ![$$ {\mathbf{w}}_k^i $$](img/522202_1_En_6_Chapter_TeX_IEq3.png) 的梯度为


  ![$$ {\mathbf{g}}_k^i=\left(1/2\right){\nabla}_{{\mathbf{w}}_k^i}J\left({\mathbf{w}}_k^i;{A}_k\right)=-2{A}_k{\mathbf{w}}_k^i+\sum
  \limits_{j=1}^i{A}_k{\mathbf{w}}_k^j{{\mathbf{w}}_k^j}^T{\mathbf{w}}_k^i+\sum \limits_{j=1}^i{\mathbf{w}}_k^j{{\mathbf{w}}_k^j}^T{A}_k{\mathbf{w}}_k^i
  $$](img/522202_1_En_6_Chapter_TeX_IEq4.png) 对于 *i*=1,…,*p*。     (6.2)


  因此，用于 PCA 的 XU 紧缩自适应梯度下降算法（见第 5.4.2 节）为


  ![$$ {\mathbf{w}}_{k+1}^i={\mathbf{w}}_k^i-{\eta}_k{\mathbf{g}}_k^i={\mathbf{w}}_k^i+{\eta}_k\left(2{A}_k{\mathbf{w}}_k^i-\sum
  \limits_{j=1}^i{A}_k{\mathbf{w}}_k^j{{\mathbf{w}}_k^j}^T{\mathbf{w}}_k^i-\sum \limits_{j=1}^i{\mathbf{w}}_k^j{{\mathbf{w}}_k^j}^T{A}_k{\mathbf{w}}_k^i\right)
  $$](img/522202_1_En_6_Chapter_TeX_IEq5.png) 对于 *i*=1,…,*p*，     (6.3)


  其中 *η*[*k*] 是一个递减的增益常数。我们可以简单地用其瞬时值 ![$$ {\mathbf{x}}_k{\mathbf{x}}_k^T $$](img/522202_1_En_6_Chapter_TeX_IEq6.png)
  或第 2 章中的递归公式（公式 2.3 或 2.4）来表示 *A*[*k*]。为了方便，定义一个矩阵 ![$$ {W}_k=\left[{\mathbf{w}}_k¹\dots
  {\mathbf{w}}_k^p\right] $$](images/522202_1_En_6_Chapter/522202_1_En_6_Chapter_TeX_IEq7.png)
  (*p*≤*n*)，其列是分别收敛到 *A*[*k*] 的 *p* 个主特征向量的 *p* 个权重向量。那么，(6.2) 可以表示为（与第 5.​4.​2 节中的
  (5.​14) 相同）：


  ![$$ {W}_{k+1}={W}_k+{\eta}_k\left(2{A}_k{W}_k-{A}_k{W}_k UT\left({W}_k^T{W}_k\right)-{W}_k
  UT\left({W}_k^T{A}_k{W}_k\right)\right) $$](img/522202_1_En_6_Chapter_TeX_IEq8.png)，     (6.4)


  其中 UT[⋅] 将其矩阵参数中对角线以下的所有元素设置为零，从而使其成为上三角矩阵。注意，(6.2) 是 Xu [Xu 93] 提出的 LMSER 算法，该算法源自前馈神经网络的最小均方误差准则（见第
  5.​4 节）。


  ## 6.3 最速下降算法


  [Chatterjee 等人，《IEEE 神经网络汇刊》，第 11 卷，第 2 期，第 338-355 页，2000 年 3 月]


  用于 PCA 的自适应最速下降算法由 (6.1) 中的 ![$$ J\left({\mathbf{w}}_k^i;{A}_k\right) $$](img/522202_1_En_6_Chapter_TeX_IEq9.png)
  推导得出：


  ![$$ {\mathbf{w}}_{k+1}^i={\mathbf{w}}_k^i-{\alpha}_k^i{\mathbf{g}}_k^i $$](img/522202_1_En_6_Chapter_TeX_IEq10.png)，     (6.5)


  其中 ![$$ {\mathbf{g}}_k^i $$](img/522202_1_En_6_Chapter_TeX_IEq11.png) 由 (6.2) 给出，而
  ![$$ {\alpha}_k^i $$](img/522202_1_En_6_Chapter_TeX_IEq12.png) 是一个非负标量，用于最小化 ![$$
  J\left({\mathbf{w}}_k^i-\alpha {\mathbf{g}}_k^i;{A}_k\right) $$](img/522202_1_En_6_Chapter_TeX_IEq13.png)。由于我们在
  (6.1) 中有 ![$$ J\left({\mathbf{w}}_k^i;{A}_k\right) $$](img/522202_1_En_6_Chapter_TeX_IEq14.png)
  的表达式，我们对函数 ![$$ J\left({\mathbf{w}}_k^i-\alpha {\mathbf{g}}_k^i;{A}_k\right) $$](img/522202_1_En_6_Chapter_TeX_IEq15.png)
  关于 *α* 求最小值，并得到以下三次方程：


  *c*[3]*α*³ + *c*[2]*α*² + *c*[1]*α* + *c*[0] = 0，     (6.6)


  其中


  ![$$ {c}_0=-{{\mathbf{g}}_k^i}^T{\mathbf{g}}_k^i $$](img/522202_1_En_6_Chapter_TeX_IEq16.png)，![$$
  {c}_1={{\mathbf{g}}_k^i}^T{H}_k^i{\mathbf{g}}_k^i $$](img/522202_1_En_6_Chapter_TeX_IEq17.png)，![$$
  {c}_2=-3\left({{\mathbf{g}}_k^i}^T{A}_k{\mathbf{g}}_k^i{{\mathbf{w}}_k^i}^T{\mathbf{g}}_k^i+{{\mathbf{w}}_k^i}^T{A}_k{\mathbf{g}}_k^i{{\mathbf{g}}_k^i}^T{\mathbf{g}}_k^i\right)
  $$](img/522202_1_En_6_Chapter_TeX_IEq18.png)，![$$ {c}_3=2{{\mathbf{g}}_k^i}^T{A}_k{\mathbf{g}}_k^i{{\mathbf{g}}_k^i}^T{\mathbf{g}}_k^i
  $$](img/522202_1_En_6_Chapter_TeX_IEq19.png)。


  这里 ![$$ {H}_k^i $$](img/522202_1_En_6_Chapter_TeX_IEq20.png) 是 ![$$ J\left({\mathbf{w}}_k^i;{A}_k\right)
  $$](img/522202_1_En_6_Chapter_TeX_IEq21.png) 的 Hessian 矩阵，如下所示：


  ![$$ {H}_k^i=-2{A}_k+2{A}_k{\mathbf{w}}_k^i{{\mathbf{w}}_k^i}^T+{\mathbf{w}}_k^i{{\mathbf{w}}_k^i}^T{A}_k+{{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^iI+\sum
  \limits_{j=1}^i{A}_k{\mathbf{w}}_k^j{{\mathbf{w}}_k^j}^T+\sum \limits_{j=1}^i{\mathbf{w}}_k^j{{\mathbf{w}}_k^j}^T{A}_k
  $$](img/522202_1_En_6_Chapter_TeX_IEq22.png)     (6.7)


  在已知 ![$$ {\mathbf{w}}_k^i $$](img/522202_1_En_6_Chapter_TeX_IEq23.png) 和 ![$$ {\mathbf{g}}_k^i
  $$](img/522202_1_En_6_Chapter_TeX_IEq24.png) 的值的情况下，可以求解这个三次方程以获得使 ![$$ J\left({\mathbf{w}}_k^i-\alpha
  {\mathbf{g}}_k^i;{A}_k\right) $$](img/522202_1_En_6_Chapter_TeX_IEq25.png) 最小化的
  *α*。下一节将描述 *α* 的计算方法。


  我们现在用矩阵形式表示自适应 PCA 算法 (6.5)。我们定义矩阵：


  ![$$ {W}_k=\left[{\mathbf{w}}_k¹,\dots, {\mathbf{w}}_k^p\right] $$](images/522202_1_En_6_Chapter/522202_1_En_6_Chapter_TeX_IEq26.png)，![$$
  {G}_k=\left[{\mathbf{g}}_k¹,\dots, {\mathbf{g}}_k^p\right] $$](images/522202_1_En_6_Chapter/522202_1_En_6_Chapter_TeX_IEq27.png)，以及
  ![$$ {\Gamma}_k=\mathrm{Diag}\left({\alpha}_k¹,\dots, {\alpha}_k^p\right) $$](img/522202_1_En_6_Chapter_TeX_IEq28.png)。


  那么，自适应最速下降 PCA 算法为


  ![$$ {G}_k=-2{A}_k{W}_k+{W}_k UT\left({W}_k^T{A}_k{W}_k\right)+{A}_k{W}_k UT\left({W}_k^T{W}_k\right),
  $$](img/522202_1_En_6_Chapter_TeX_IEq29.png)


  *W*[*k* + 1] = *W*[*k*] − *G*[*k*]Γ[*k*]。     (6.8)


  这里 UT[·] 与 (6.4) 中的相同。




  ### 最速下降法中 ![$$ {\alpha}_k^i $$](img/522202_1_En_6_Chapter_TeX_IEq30.png) 的计算


  根据 (6.1) 中的 *J*(**w**[*i*];*A*)，我们计算使 *J*(**w**[*i*] − *α***g**[*i*]; *A*) 最小化的
  *α*，其中


  ![$$ {\mathbf{g}}_i=-2A{\mathbf{w}}_i+{\mathbf{w}}_i{{\mathbf{w}}_i}^TA{\mathbf{w}}_i+\sum
  \limits_{j=1}^{i-1}{\mathbf{w}}_j{{\mathbf{w}}_j}^TA{\mathbf{w}}_i+A{\mathbf{w}}_i{{\mathbf{w}}_i}^T{\mathbf{w}}_i+\sum
  \limits_{j=1}^{i-1}A{\mathbf{w}}_j{{\mathbf{w}}_j}^T{\mathbf{w}}_i $$](img/522202_1_En_6_Chapter_TeX_IEq31.png)。


  我们有


  ![$$ \frac{d J\left({\mathbf{w}}_i-\alpha {\mathbf{g}}_i\right)}{d\alpha}=\frac{1}{2}
  tr\left[{\nabla}_{{\mathbf{w}}_i-\alpha {\mathbf{g}}_i}J\left({\mathbf{w}}_i-\alpha
  {\mathbf{g}}_i\right)\frac{d{\left({\mathbf{w}}_i-\alpha {\mathbf{g}}_i\right)}^T}{d\alpha}\right]=-\frac{1}{2}{\mathbf{g}}_i^T{\nabla}_{{\mathbf{w}}_i-\alpha
  {\mathbf{g}}_i}J\left({\mathbf{w}}_i-\alpha {\mathbf{g}}_i\right), $$](images/522202_1_En_6_Chapter/522202_1_En_6_Chapter_TeX_Equa.png)


  其中


  ![$$ \left(1/2\right){\nabla}_{{\mathbf{w}}_i-\alpha {\mathbf{g}}_i}J\left({\mathbf{w}}_i-\alpha
  {\mathbf{g}}_i\right)=-2A\left({\mathbf{w}}_i-\alpha {\mathbf{g}}_i\right)+\left({\mathbf{w}}_i-\alpha
  {\mathbf{g}}_i\right){\left({\mathbf{w}}_i-\alpha {\mathbf{g}}_i\right)}^TA\left({\mathbf{w}}_i-\alpha
  {\mathbf{g}}_i\right) $$](img/522202_1_En_6_Chapter_TeX_Equb.png)


  ![$$ +A\left({\mathbf{w}}_i-\alpha {\mathbf{g}}_i\right){\left({\mathbf{w}}_i-\alpha
  {\mathbf{g}}_i\right)}^T\left({\mathbf{w}}_i-\alpha {\mathbf{g}}_i\right)+\sum \limits_{j=1}^{i-1}{\mathbf{w}}_j{{\mathbf{w}}_j}^TA\left({\mathbf{w}}_i-\alpha
  {\mathbf{g}}_i\right)+\sum \limits_{j=1}^{i-1}A{\mathbf{w}}_j{{\mathbf{w}}_j}^T\left({\mathbf{w}}_i-\alpha
  {\mathbf{g}}_i\right). $$](img/522202_1_En_6_Chapter_TeX_Equc.png)


  简化此方程，我们得到以下三次方程：


  ![$$ {c}_3{\alpha}³+{c}_2{\alpha}²+{c}_1\alpha +{c}_0=0, $$](img/522202_1_En_6_Chapter_TeX_Equd.png)


  其中


  ![$$ {c}_0=-{\mathbf{g}}_i^T{\mathbf{g}}_i $$](img/522202_1_En_6_Chapter_TeX_IEq32.png),
  ![$$ {c}_1={\mathbf{g}}_i^T{H}_i{\mathbf{g}}_i $$](img/522202_1_En_6_Chapter_TeX_IEq33.png),
  ![$$ {c}_2=-3\left({\mathbf{g}}_i^TA{\mathbf{g}}_i{\mathbf{w}}_i^T{\mathbf{g}}_i+{\mathbf{w}}_i^TA{\mathbf{g}}_i{\mathbf{g}}_i^T{\mathbf{g}}_i\right)
  $$](img/522202_1_En_6_Chapter_TeX_IEq34.png), ![$$ {c}_3=2{\mathbf{g}}_i^TA{\mathbf{g}}_i{\mathbf{g}}_i^T{\mathbf{g}}_i
  $$](img/522202_1_En_6_Chapter_TeX_IEq35.png)。


  这里 *H*[*i*] 是 (6.7) 中给出的 *J*(**w**[*i*]; *A*) 的 Hessian 矩阵。


  众所周知，三次多项式至少有一个实根（一个实根加两个共轭复根，或三个实根）。这些根也可以如 [Artin 91] 所示以闭式形式计算。如果根是复数，那么 **w**[*i*] − *α***g**[*i*]
  也是复数，显然这不是我们要找的根。如果我们有三个实根，那么我们可以取对应于最小 *J*(**w**[*i*] − *α***g**[*i*]; *A*) 的根，或者取对应于
  3*c*[3]*α*² + 2*c*[2]*α* + *c*[1] > 0 的根。


  ### 最速下降法算法代码


  以下 Python 代码使用数据 `X[nDim,nSamples]` 实现了此算法：


  ```

  from numpy import linalg as la

  A  = np.zeros(shape=(nDim,nDim)) # 存储自适应相关矩阵

  W1 = 0.1 * np.ones(shape=(nDim,nEA)) # 所有算法的权重向量

  W2 = W1

  I  = np.identity(nDim)

  Weight = 1

  nEpochs = 1

  for epoch in range(nEpochs):

  for iter in range(nSamples):

  cnt = nSamples*epoch + iter

  # 使用当前样本 x 更新数据相关矩阵 A

  x = X1[:,iter]

  x = x.reshape(nDim,1)

  A = Weight * A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - Weight * A)

  # 最速下降法

  G = -2 * A @ W2 + A @ W2 @ np.triu(W2.T @ W2) + \

  W2 @ np.triu(W2.T @ A @ W2)

  for i in range(nEA):

  M = np.zeros(shape=(nDim,nDim))

  for k in range(i):

  wk = W2[:,k].reshape(nDim,1)

  M = M + (A @ (wk @ wk.T) + (wk @ wk.T) @ A)

  wi = W2[:,i].reshape(nDim,1)

  F = - 2*A + 2*A @ (wi @ wi.T) + 2 * (wi @ wi.T) @ A + \

  A * (wi.T @ wi) + (wi.T @ A @ wi) * I  +  M

  gi = G[:,i].reshape(nDim,1)

  a0 = np.asscalar(gi.T @ gi)

  a1 = np.asscalar(- gi.T @ F @ gi)

  a2 = np.asscalar(3 * ((wi.T @ A @ gi) @ (gi.T @ gi) + \

  (gi.T @ A @ gi)*(wi.T @ gi)))

  a3 = np.asscalar(- 2 * (gi.T @ A @ gi) @ (gi.T @ gi))

  c  = np.array([a3, a2, a1, a0])

  rts = np.roots(c)

  rs = np.zeros(3)

  r  = np.zeros(3)

  J  = np.zeros(3)

  cnt1 = 0

  for k in range(3):

  if np.isreal(rts[k]):

  re = np.real(rts[k])

  rs[cnt1] = re

  r = W2[:,i] - re * G[:,i]

  J[cnt1] = np.asscalar(-2*(r.T @ A @ r) + (r.T @ A @ r) * \

  (r.T @ r) + (r.T @ M @ r))

  cnt1 = cnt1 + 1

  yy = min(J)

  iyy = np.argmin(J)

  alpha = rs[iyy]

  W2[:,i] = (W2[:,i] - alpha * G[:,i]).T

  ```




  ## 6.4 共轭方向算法


  [Chatterjee 等人，《IEEE 神经网络汇刊》，第 11 卷，第 2 期，第 338-355 页，2000 年 3 月]


  用于 PCA 的自适应共轭方向算法可推导如下：


  ![$$ {\mathbf{w}}_{k+1}^i={\mathbf{w}}_k^i+{\alpha}_k^i{\mathbf{d}}_k^i $$](img/522202_1_En_6_Chapter_TeX_IEq36.png)


  ![$$ {\mathbf{d}}_{k+1}^i=-{\mathbf{g}}_{k+1}^i+{\beta}_k^i{\mathbf{d}}_k^i $$](img/522202_1_En_6_Chapter_TeX_IEq37.png)，     (6.9)


  其中 ![$$ {\mathbf{g}}_{k+1}^i=\left(1/2\right){\nabla}_{{\mathbf{w}}_i}J\left({\mathbf{w}}_{k+1}^i;{A}_k\right)
  $$](img/522202_1_En_6_Chapter_TeX_IEq38.png)。增益常数 ![$$ {\alpha}_k^i $$](img/522202_1_En_6_Chapter_TeX_IEq39.png)
  被选为使 ![$$ J\left({\mathbf{w}}_k^i+\alpha {\mathbf{d}}_k^i\right) $$](img/522202_1_En_6_Chapter_TeX_IEq40.png)
  最小化的 *α* 值。与最速下降法类似，我们得到以下三次方程：


  *c*[3]*α*³ + *c*[2]*α*² + *c*[1]*α* + *c*[0] = 0，     (6.10)


  其中


  ![$$ {c}_0={{\mathbf{g}}_k^i}^T{\mathbf{d}}_k^i $$](img/522202_1_En_6_Chapter_TeX_IEq41.png)，![$$
  {c}_1={{\mathbf{d}}_k^i}^T{H}_k^i{\mathbf{d}}_k^i $$](img/522202_1_En_6_Chapter_TeX_IEq42.png)，![$$
  {c}_2=3\left({{\mathbf{d}}_k^i}^T{A}_k{\mathbf{d}}_k^i{{\mathbf{w}}_k^i}^T{\mathbf{d}}_k^i+{{\mathbf{w}}_k^i}^T{A}_k{\mathbf{d}}_k^i{{\mathbf{d}}_k^i}^T{\mathbf{d}}_k^i\right)
  $$](img/522202_1_En_6_Chapter_TeX_IEq43.png)，![$$ {c}_3=2{{\mathbf{d}}_k^i}^T{A}_k{\mathbf{d}}_k^i{{\mathbf{d}}_k^i}^T{\mathbf{d}}_k^i
  $$](img/522202_1_En_6_Chapter_TeX_IEq44.png)。


  这里，![$$ {\mathbf{g}}_k^i=\left(1/2\right){\nabla}_{{\mathbf{w}}_i}J\left({\mathbf{w}}_k^i;{A}_k\right)
  $$](img/522202_1_En_6_Chapter_TeX_IEq45.png) 如 (6.2) 所示。求解方程 (6.10) 以获得使 ![$$ J\left({\mathbf{w}}_k^i+\alpha
  {\mathbf{d}}_k^i\right) $$](img/522202_1_En_6_Chapter_TeX_IEq46.png) 最小化的 *α* 值。对于
  ![$$ {\beta}_k^i $$](img/522202_1_En_6_Chapter_TeX_IEq47.png) 的选择，我们可以使用多种方法，例如
  Hestenes-Stiefel、Polak-Ribiere、Fletcher-Reeves 和 Powell（在维基百科上有描述）。


  现在，我们将自适应共轭方向 PCA 算法 (6.9) 表示为矩阵形式。我们定义以下矩阵：


  ![$$ {W}_k=\left[{\mathbf{w}}_k¹,\dots, {\mathbf{w}}_k^p\right] $$](images/522202_1_En_6_Chapter/522202_1_En_6_Chapter_TeX_IEq48.png)，![$$
  {G}_k=\left[{\mathbf{g}}_k¹,\dots, {\mathbf{g}}_k^p\right] $$](images/522202_1_En_6_Chapter/522202_1_En_6_Chapter_TeX_IEq49.png)，![$$
  {D}_k=\left[{\mathbf{d}}_k¹,\dots, {\mathbf{d}}_k^p\right] $$](images/522202_1_En_6_Chapter/522202_1_En_6_Chapter_TeX_IEq50.png)，


  ![$$ {\Gamma}_k=\operatorname{diag}\left({\alpha}_k¹,\dots, {\alpha}_k^p\right)
  $$](img/522202_1_En_6_Chapter_TeX_IEq51.png) 和 ![$$ {\Pi}_k=\operatorname{diag}\left({\beta}_k¹,\dots,
  {\beta}_k^p\right) $$](img/522202_1_En_6_Chapter_TeX_IEq52.png)。


  那么，自适应共轭方向 PCA 算法为


  *W*[*k* + 1] = *W*[*k*] + *D*[*k*]Γ[*k*]，


  ![$$ {G}_{k+1}=-2{A}_k{W}_{k+1}+{W}_{k+1} UT\left({W}_{k+1}^T{A}_k{W}_{k+1}\right)+{A}_k{W}_{k+1}
  UT\left({W}_{k+1}^T{W}_{k+1}\right) $$](img/522202_1_En_6_Chapter_TeX_IEq53.png)，


  *D*[*k* + 1] =  − *G*[*k* + 1] + *D*[*k*]Π[*k*]。     (6.11)


  这里 UT[·] 与 (6.4) 中的相同。


  ### 共轭方向算法代码


  以下 Python 代码使用数据 `X[nDim,nSamples]` 实现了该算法：


  ```

  from numpy import linalg as la

  A  = np.zeros(shape=(nDim,nDim)) # 存储自适应相关矩阵

  W1 = 0.1 * np.ones(shape=(nDim,nEA)) # 所有算法的权重向量

  W2 = W1

  I  = np.identity(nDim)

  Weight = 1

  nEpochs = 1

  for epoch in range(nEpochs):

  for iter in range(nSamples):

  cnt = nSamples*epoch + iter

  # 使用当前样本 x 更新数据相关矩阵 A

  x = X1[:,iter]

  x = x.reshape(nDim,1)

  A = Weight * A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - Weight * A)

  # 共轭方向法

  # 初始化 D

  G = -2 * A @ W2 + A @ W2 @ np.triu(W2.T @ W2) + \

  W2 @ np.triu(W2.T @ A @ W2)

  if (iter == 0):

  D = G

  # 更新 W

  for i in range(nEA):

  gi = G[:,i].reshape(nDim,1)

  wi = W2[:,i].reshape(nDim,1)

  di = D[:,i].reshape(nDim,1)

  M = np.zeros(shape=(nDim,nDim))

  for k in range(i):

  wk = W2[:,k].reshape(nDim,1)

  M = M + (A @ (wk @ wk.T) + (wk @ wk.T) @ A)

  F = - 2*A + 2*A @ (wi @ wi.T) + 2 * (wi @ wi.T) @ A + A * \

  (wi.T @ wi) + (wi.T @ A @ wi) * I  +  M

  a0 = np.asscalar(gi.T @ di)

  a1 = np.asscalar(- di.T @ F @ di)

  a2 = np.asscalar(3 * ((wi.T @ A @ di) * (di.T @ di) + \

  (di.T @ A @ di) * (wi.T @ di)))

  a3 = np.asscalar(- 2 * (di.T @ A @ di) * (di.T @ di))

  c  = np.array([a3, a2, a1, a0])

  rts = np.roots(c)

  rs = np.zeros(3)

  r  = np.zeros(3)

  J  = np.zeros(3)

  cnt1 = 0

  for k in range(3):

  if np.isreal(rts[k]):

  re = np.real(rts[k])

  rs[cnt1] = re

  r = (W2[:,i] - re * di.T).reshape(nDim,1)

  J[cnt1] = np.asscalar(-2*(r.T @ A @ r) + (r.T @ A @ r) * \

  (r.T @ r) + (r.T @ M @ r))

  cnt1 = cnt1 + 1

  yy = min(J)

  iyy = np.argmin(J)

  alpha = rs[iyy]

  W2[:,i] = W2[:,i] - alpha * di.T

  # 更新 d

  gi = G[:,i].reshape(nDim,1)

  wi = W2[:,i].reshape(nDim,1)

  di = D[:,i].reshape(nDim,1)

  M = np.zeros(shape=(nDim,nDim))

  for k in range(i):

  wk = W2[:,k].reshape(nDim,1)

  M = M + (A @ (wk @ wk.T) + (wk @ wk.T) @ A)

  F = - 2*A + 2*A @ (wi @ wi.T) + 2 * (wi @ wi.T) @ A + \

  A * (wi.T @ wi) + (wi.T @ A @ wi) * I  +  M

  beta = (gi.T @ F @ di) / (di.T @ F @ di)

  di = gi + 1*beta*di

  D[:,i] = di.T

  ```




  ## 6.5 牛顿-拉夫森算法


  [Chatterjee 等人，《IEEE 神经网络汇刊》，第 11 卷，第 2 期，第 338-355 页，2000 年 3 月]


  用于 PCA 的自适应牛顿-拉夫森算法为：


  ![$$ {\mathbf{w}}_{k+1}^i={\mathbf{w}}_k^i-{\alpha}_k^i{\left({H}_k^i\right)}^{-1}{\mathbf{g}}_k^i
  $$](img/522202_1_En_6_Chapter_TeX_IEq54.png)，     (6.12)


  其中 ![$$ {\alpha}_k^i $$](img/522202_1_En_6_Chapter_TeX_IEq55.png) 是一个非负标量，![$$ {H}_k^i
  $$](img/522202_1_En_6_Chapter_TeX_IEq56.png) 是 (6.7) 中给出的在线海森矩阵。搜索参数 ![$$ {\alpha}_k^i
  $$](img/522202_1_En_6_Chapter_TeX_IEq57.png) 通常通过以下方式选择：(1) 最小化 ![$$ J\left({\mathbf{w}}_k^i+\alpha
  {\mathbf{d}}_k^i\right) $$](img/522202_1_En_6_Chapter_TeX_IEq58.png)，其中 ![$$ {\mathbf{d}}_k^i=-{\left({H}_k^i\right)}^{-1}{\mathbf{g}}_k^i
  $$](img/522202_1_En_6_Chapter_TeX_IEq59.png)；(2) 作为一个标量常数；或 (3) 作为一个递减序列 {![$$ {\alpha}_k^i
  $$](img/522202_1_En_6_Chapter_TeX_IEq60.png)}，使得当 *k*→∞ 时，![$$ {\alpha}_k^i $$](img/522202_1_En_6_Chapter_TeX_IEq61.png)→0。


  该算法的主要关注点在于，![$$ {H}_k^i $$](img/522202_1_En_6_Chapter_TeX_IEq62.png) 应为正定矩阵，并且我们应自适应地获得
  ![$$ {\left({H}_k^i\right)}^{-1} $$](img/522202_1_En_6_Chapter_TeX_IEq63.png) 的估计值，以使算法计算高效。如果我们通过舍弃项
  ![$$ \left(-{A}_k+{A}_k{{\mathbf{w}}_k^i}^T{\mathbf{w}}_k^i\right) $$](img/522202_1_En_6_Chapter_TeX_IEq64.png)
  来近似海森矩阵，则可以解决这两个问题，因为当 ![$$ {\mathbf{w}}_k^i $$](img/522202_1_En_6_Chapter_TeX_IEq65.png)
  接近解时，该项接近于 0。新的海森矩阵为：


  ![$$ {H}_k^i\approx {{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^iI-{\tilde{A}}_k^i+2{A}_k{\mathbf{w}}_k^i{{\mathbf{w}}_k^i}^T+2{\mathbf{w}}_k^i{{\mathbf{w}}_k^i}^T{A}_k,
  $$](img/522202_1_En_6_Chapter_TeX_IEq66.png)     (6.13)


  其中


  ![$$ {\tilde{A}}_k^i={A}_k-\sum \limits_{j=1}^{i-1}{\mathbf{w}}_k^j{{\mathbf{w}}_k^j}^T{A}_k-\sum
  \limits_{j=1}^{i-1}{A}_k{\mathbf{w}}_k^j{{\mathbf{w}}_k^j}^T. $$](img/522202_1_En_6_Chapter_TeX_Eque.png)


  我们可以通过关于 *i* 的迭代方程来计算 ![$$ {A}_k^i $$](img/522202_1_En_6_Chapter_TeX_IEq67.png)，如下所示：


  ![$$ {\tilde{A}}_k^{i+1}={\tilde{A}}_k^i-{\mathbf{w}}_k^i{{\mathbf{w}}_k^i}^T{A}_k-{A}_k{\mathbf{w}}_k^i{{\mathbf{w}}_k^i}^T.
  $$](img/522202_1_En_6_Chapter_TeX_Equf.png)


  对该海森矩阵求逆包括对矩阵 ![$$ {B}_k^i={{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^iI-{\tilde{A}}_k^i
  $$](img/522202_1_En_6_Chapter_TeX_IEq68.png) 求逆以及两次秩一更新。该矩阵 ![$$ {B}_k^i $$](img/522202_1_En_6_Chapter_TeX_IEq69.png)
  的近似逆由下式给出：


  ![$$ {\left({B}_k^i\right)}^{-1}={\left({{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^iI-{\tilde{A}}_k^i\right)}^{-1}\approx
  \frac{I+{\tilde{A}}_k^i/{{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i}{{{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i}
  $$](img/522202_1_En_6_Chapter_TeX_IEq70.png)。     (6.14)


  通过对 (6.13) 中的海森矩阵 ![$$ {H}_k^i $$](img/522202_1_En_6_Chapter_TeX_IEq71.png) 进行两次秩一更新，可以得到一个自适应求逆算法。我们定义


  ![$$ {C}_k^i={B}_k^i+2{A}_k{\mathbf{w}}_k^i{{\mathbf{w}}_k^i}^T. $$](img/522202_1_En_6_Chapter_TeX_IEq72.png)     (6.15)


  那么，根据 (6.13)，![$$ {\left({H}_k^i\right)}^{-1} $$](img/522202_1_En_6_Chapter_TeX_IEq73.png)
  的更新公式为：


  ![$$ {\left({H}_k^i\right)}^{-1}={\left({C}_k^i\right)}^{-1}-\frac{2{\left({C}_k^i\right)}^{-1}{\mathbf{w}}_k^i{{\mathbf{w}}_k^i}^T{A}_k{\left({C}_k^i\right)}^{-1}}{1+2{{\mathbf{w}}_k^i}^T{A}_k{\left({C}_k^i\right)}^{-1}{\mathbf{w}}_k^i},
  $$](img/522202_1_En_6_Chapter_TeX_IEq74.png)     (6.16)


  其中 ![$$ {\left({C}_k^i\right)}^{-1} $$](img/522202_1_En_6_Chapter_TeX_IEq75.png)
  由 (6.15) 得到：


  ![$$ {\left({C}_k^i\right)}^{-1}={\left({B}_k^i\right)}^{-1}-\frac{2{\left({B}_k^i\right)}^{-1}{A}_k{\mathbf{w}}_k^i{{\mathbf{w}}_k^i}^T{\left({B}_k^i\right)}^{-1}}{1+2{{\mathbf{w}}_k^i}^T{\left({B}_k^i\right)}^{-1}{A}_k{\mathbf{w}}_k^i}
  $$](img/522202_1_En_6_Chapter_TeX_IEq76.png)     (6.17)


  并且 ![$$ {\left({B}_k^i\right)}^{-1} $$](img/522202_1_En_6_Chapter_TeX_IEq77.png)
  由 (6.14) 给出。


  ### 牛顿-拉夫森算法代码


  以下 Python 代码使用数据 `X[nDim,nSamples]` 实现了该算法：


  ```

  from numpy import linalg as la

  A  = np.zeros(shape=(nDim,nDim)) # stores adaptive correlation matrix

  W1 = 0.1 * np.ones(shape=(nDim,nEA)) # weight vectors of all algorithms

  W2 = W1

  I  = np.identity(nDim)

  Weight = 1

  nEpochs = 1

  for epoch in range(nEpochs):

  for iter in range(nSamples):

  cnt = nSamples*epoch + iter

  # Update data correlation matrix A with current sample x

  x = X1[:,iter]

  x = x.reshape(nDim,1)

  A = Weight * A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - Weight * A)

  # Newton Rhapson

  G = -2* A @ W4 + A@ W4@ np.triu(W4.T @ W4) + W4@ np.triu(W4.T @ A @ W4)

  # Update W

  for i in range(nEA):

  M = np.zeros(shape=(nDim,nDim))

  for k in range(i):

  wk = W4[:,k].reshape(nDim,1)

  M = M + (A @ (wk @ wk.T) + (wk @ wk.T) @ A)

  wi = W4[:,i].reshape(nDim,1)

  F = - 2*A + 2*A @ (wi @ wi.T) + 2 * (wi @ wi.T) @ A + \

  A * (wi.T @ wi) + (wi.T @ A @ wi) * I  +  M

  lam = wi.T @ A @ wi

  Atilde = A

  if (iter > 0):

  invB = (I + (Atilde/lam))/lam

  invC = invB- (2*invB@ A @wi @wi.T @ invB)/(1 + 2*wi.T@ invB@ A @ wi)

  invF = invC- (2*invC@ wi @wi.T @A @ invC)/(1 + 2*wi.T@ A @invC @ wi)

  gi = G[:,i].reshape(nDim,1)

  di = -invF @ gi

  a0 = np.asscalar(gi.T @ di)

  a1 = np.asscalar(di.T @ F @ di)

  a2 = np.asscalar(3* ((wi.T @ A @ di) @ (di.T @ di) + \

  (di.T @ A @ di)*(wi.T @ di)))

  a3 = np.asscalar(2 * (di.T @ A @ di) @ (di.T @ di))

  c  = np.array([a3, a2, a1, a0])

  rts = np.roots(c)

  rs = np.zeros(3)

  r  = np.zeros(3)

  J  = np.zeros(3)

  cnt1 = 0

  for k in range(3):

  if np.isreal(rts[k]):

  re = np.real(rts[k])

  rs[cnt1] = re

  r = W4[:,i] + re * di.reshape(nDim)

  J[cnt1] = np.asscalar(-2*(r.T @ A @ r) + (r.T @ A @ r) * \

  (r.T @ r) + (r.T @ M @ r))

  cnt1 = cnt1 + 1

  iyy = np.argmin(J)

  alpha = rs[iyy]

  W4[:,i] = (W4[:,i] + alpha * di.reshape(nDim)).T

  ```


  ## 6.6 实验结果


  我进行了两组实验来测试加速 PCA 算法的性能。第一组实验在*平稳*高斯数据上进行，第二组在*非平稳*高斯数据上进行。然后，我将最速下降算法与最先进的自适应 PCA
  算法进行了比较，例如 Yang 的投影近似子空间跟踪算法、Bannour 和 Sadjadi 的递归最小二乘算法，以及 Fu 和 Dowling 的共轭梯度特征结构跟踪算法。




