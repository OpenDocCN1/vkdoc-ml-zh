  ## 4.12 结论


  RQ、OJAN 和 LUO 算法要求 ‖**w**[0]‖=1，以便主特征向量 **w**[*k*] 收敛到单位范数（即 ‖**w**[*k*]‖→1）。所有其他算法（PF
  除外）对于 **w**[0] 的各种非零值都能收敛到单位范数。根据定理 4.8，PF 算法成功收敛到 ![$$ \left\Vert {\mathbf{w}}_k\right\Vert
  \to \sqrt{1+{\lambda}_1/\mu } $$](img/522202_1_En_4_Chapter_TeX_IEq42.png)。


  统一的框架以及目标函数的可用性使我能够推导并分析每种算法的收敛性能。每种算法的结果总结在表 4-5 中。对于每种方法，我计算了当 *n*=10 时，自适应算法单次迭代的近似
  MATLAB 浮点运算次数^(³)，并将其展示在表 4-5 中。


