  图 6-8 中四种算法之间的比较显示，对于前四个主特征向量，它们之间的差异很小。同样，在三种收敛更快的算法中，由于最速下降法(6.8)每次迭代所需的计算量最小，因此它最适合在速度和计算量之间取得最优平衡。


  ### 与最新算法的比较


  我将最速下降法(6.8)与 Yang 的 PASTd 算法、Bannour 和 Sadjadi 的 RLS 算法以及 Fu 和 Dowling 的 CGET1
  算法进行了比较。我首先在第 6.6.1 节所述的平稳数据上测试了这四种算法。


  我将 ONE 定义为一个所有元素均为 1 的 10×4 矩阵。每种算法的初始值如下：


  1.  最速下降法：


  *W*[0] = 0.1*ONE。


  1.  Yang 的 PASTd 算法：


  *W*[0] = 0.1*ONE, *β*=0.997，且对于 *i* = 1, 2, …, *p* (*p*≤*n*)，有 ![$$ {d}_0^i=0.2
  $$](img/522202_1_En_6_Chapter_TeX_IEq86.png)。


  1.  Bannour 和 Sadjadi 的 RLS 算法：


  *W*[0] = 0.1*ONE 且 *P*[0] = ONE。


  1.  Fu 和 Dowling 的 CGET1 算法：


  *W*[0] = 0.1*ONE 且 ![$$ {A}_0={\mathbf{x}}_k{\mathbf{x}}_k^T $$](img/522202_1_En_6_Chapter_TeX_IEq87.png)。


  我发现 PASTd 和 RLS 算法的性能在很大程度上分别取决于 ![$$ {d}_0^i $$](img/522202_1_En_6_Chapter_TeX_IEq88.png)
  和 *P*[0] 的初始选择。因此，我选择了在大多数实验中能给出最佳结果的初始值。本次实验的结果如图 6-9 所示。


  ![](img/522202_1_En_6_Fig9_HTML.jpg)


  图 6-9


  最速下降法(6.8)、PASTd、RLS 和 CGET1 算法对平稳数据 A 的前四个主特征向量的收敛情况


  从图 6-9 可以观察到，最速下降法和 CGET1 算法对所有四个主特征向量都表现良好。对于次要特征向量，RLS 算法的表现略优于 PASTd 算法。对于主要特征向量，所有算法都表现良好。算法之间的差异在次要（第三和第四）特征向量上尤为明显。


  接下来，我将这四种算法应用于第 6.6.2 节所述的非平稳数据，其中公式(2.5, 第 2 章)中的*β*=0.995。本次实验的结果如图 6-10 所示。


  ![](img/522202_1_En_6_Fig10_HTML.jpg)


  图 6-10


  最速下降法(6.8)、PASTd、RLS 和 CGET1 算法对非平稳数据两个协方差矩阵前四个主特征向量的收敛情况


  可以观察到，最速下降法和 CGET1 算法对所有四个主特征向量都表现良好。在处理非平稳性方面，PASTd 算法的表现优于 RLS 算法。这是预料之中的，因为 PASTd
  算法通过遗忘因子*β*=0.995 来应对非平稳性，而 RLS 算法没有此选项。




  ## 6.7 结论


  我提出了一种无约束目标函数，通过使用诸如梯度下降、最速下降、共轭梯度和牛顿-拉夫森等非线性优化方法，来获得各种新的主成分分析自适应算法。使用平稳和非平稳数据对这些算法进行比较表明，与梯度下降算法相比，最速下降、共轭梯度和牛顿-拉夫森算法具有更快的跟踪能力。


  应进一步考虑算法的计算复杂度。最速下降、共轭梯度和牛顿-拉夫森算法的计算复杂度为 *O*(*pn*²)。然而，如果在梯度下降算法中使用估计值 ![$$ {A}_k={\mathbf{x}}_k{\mathbf{x}}_k^T
  $$](img/522202_1_En_6_Chapter_TeX_IEq89.png) 代替公式 (6.4)，则计算复杂度降至 *O*(*pn*)，尽管收敛速度会变慢。CGET1
  算法的复杂度为 *O*(*pn*²)。PASTd 和 RLS 算法的复杂度为 *O*(*pn*)。然而，如图 6-9 和 6-10 所示，它们的收敛速度慢于最速下降和
  CGET1 算法。此外，如 [Cichocki and Unbehauen 93] 中的示例所示，梯度下降算法可以通过并行架构实现。


