  ### AL2 算法 Python 代码


  以下 Python 代码适用于数据 `X[nDim,nSamples]` 和 `Y[nDim,nSamples]`：


  ```

  from numpy import linalg as la

  A  = np.zeros(shape=(nDim,nDim)) # 存储自适应相关矩阵

  B  = np.zeros(shape=(nDim,nDim)) # 存储自适应相关矩阵

  W2 = 0.1 * np.ones(shape=(nDim,nEA)) # 所有算法的权重向量

  W3 = W2

  c = [2.6-0.3*k for k in range(nEA)]

  C = np.diag(c)

  I  = np.identity(nDim)

  mu = 1

  for epoch in range(nEpochs):

  for iter in range(nSamples):

  cnt = nSamples*epoch + iter

  # 使用当前数据向量 x,y 更新数据相关矩阵 A,B

  x = X[:,iter]

  x = x.reshape(nDim,1)

  A = A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - A)

  y = Y[:,iter]

  y = y.reshape(nDim,1)

  B = B + (1.0/(1 + cnt))*((np.dot(y, y.T)) - B)

  # 收缩梯度下降

  W2 = W2 + (1/(100 + cnt))*(A @ W2 - 0.5 * B @ W2 @ np.triu(W2.T @ A \

  @ W2) - 0.5 * A @ W2 @ np.triu(W2.T @ B @ W2) - \

  0.5 * mu * B @ W2 @ np.triu((W2.T @ B @ W2) - I))

  # 加权梯度下降

  W3 = W3 + (1/(300 + cnt))*(A @ W3 @ C - 0.5 * B @ W3 @ C @ (W3.T @ A \

  @ W3) - 0.5 * A @ W3 @ C @ (W3.T @ B @ W3) - \

  0.5 * mu * B @ W3 @ C @ ((W3.T @ B @ W3) - I))

  ```


  ## 7.8 IT GEVD 算法




  ### IT 齐次算法


  信息论齐次 GEVD 算法的目标函数为


  ![$$ J\left({\mathbf{w}}_k^i;{A}_k,{B}_k\right)={{\mathbf{w}}_k^i}^T{B}_k{\mathbf{w}}_k^i-\ln
  \left({{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i\right)+\alpha \left({{\mathbf{w}}_k^i}^T{B}_k{\mathbf{w}}_k^i-1\right)+2\sum
  \limits_{j=1,j\ne i}^p{\beta}_j{{\mathbf{w}}_k^j}^T{B}_k{\mathbf{w}}_k^i $$](img/522202_1_En_7_Chapter_TeX_IEq81.png)     (7.42)


  其中 *i*=1,…,*p*，(*α*, *β*[1], *β*[2], …, *β*[*p*]) 为拉格朗日乘子，*ln*(.) 是以 *e* 为底的对数。通过令
  (7.42) 关于 ![$$ {\mathbf{w}}_k^i $$](img/522202_1_En_7_Chapter_TeX_IEq82.png) 的梯度等于
  **0**，并利用约束条件 ![$$ {{\mathbf{w}}_k^j}^T{B}_k{\mathbf{w}}_k^i={\delta}_{ij} $$](img/522202_1_En_7_Chapter_TeX_IEq83.png)，我们得到


  *α* = 0 且 ![$$ {\beta}_j=\frac{{{\mathbf{w}}_k^j}^T{A}_k{\mathbf{w}}_k^i}{{{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i}
  $$](img/522202_1_En_7_Chapter_TeX_IEq84.png)，     (7.43)


  其中 *j*=1,…,*p*。将 (*α*, *β*[1], *β*[2], …, *β*[*p*]) 代入 (7.42) 的梯度中，我们得到广义特征向量的 IT
  齐次自适应梯度下降算法：


  ![$$ {\mathbf{w}}_{k+1}^i={\mathbf{w}}_k^i+{\eta}_k\left({A}_k{\mathbf{w}}_k^i-\sum
  \limits_{j=1}^p{B}_k{\mathbf{w}}_k^j\left({{\mathbf{w}}_k^j}^T{A}_k{\mathbf{w}}_k^i\right)\right)/{{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i
  $$](img/522202_1_En_7_Chapter_TeX_IEq85.png)，     (7.44)


  其中 *i*=1,…,*p*，其矩阵形式为


  ![$$ {W}_{k+1}={W}_k+{\eta}_k\left({A}_k{W}_k-{B}_k{W}_k{W}_k^T{A}_k{W}_k\right)\kern0.5em
  \mathrm{DIAG}{\left({W}_k^T{A}_k{W}_k\right)}^{-1} $$](img/522202_1_En_7_Chapter_TeX_IEq86.png)，     (7.45)


  其中 DIAG[⋅] 将其矩阵参数中除对角线以外的所有元素置零。


  ### IT 收缩算法


  IT 收缩 GEVD 算法的目标函数为


  ![$$ J\left({\mathbf{w}}_k^i;{A}_k,{B}_k\right)={{\mathbf{w}}_k^i}^T{B}_k{\mathbf{w}}_k^i-\ln
  \left({{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i\right)+\alpha \left({{\mathbf{w}}_k^i}^T{B}_k{\mathbf{w}}_k^i-1\right)+2\sum
  \limits_{j=1}^{i-1}{\beta}_j{{\mathbf{w}}_k^j}^T{B}_k{\mathbf{w}}_k^i $$](img/522202_1_En_7_Chapter_TeX_IEq87.png)     (7.46)


  其中 *i*=1,…,*p*，(*α*, *β*[1], *β*[2], …, *β*[*p*]) 为拉格朗日乘子。由 (7.43) 我们得到自适应梯度算法：


  ![$$ {W}_{k+1}={W}_k+{\eta}_k\left({A}_k{W}_k-{B}_k{W}_k UT\left({W}_k^T{A}_k{W}_k\right)\right)\kern0.6em
  \mathrm{DIAG}{\left({W}_k^T{A}_k{W}_k\right)}^{-1} $$](img/522202_1_En_7_Chapter_TeX_IEq88.png) (7.47)


  ### IT 加权算法


  IT 加权 GEVD 算法的目标函数为


  ![$$ J\left({\mathbf{w}}_k^i\right)={c}_i{{\mathbf{w}}_k^i}^T{B}_k{\mathbf{w}}_k^i-{c}_i\ln
  \left({{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i\right)+\alpha {c}_i\left({{\mathbf{w}}_k^i}^T{B}_k{\mathbf{w}}_k^i-1\right)+2\sum
  \limits_{j=1,j\ne i}^p{\beta}_j{c}_j{{\mathbf{w}}_k^j}^T{B}_k{\mathbf{w}}_k^i $$](img/522202_1_En_7_Chapter_TeX_IEq89.png)     (7.48)


  其中 *i*=1,…,*p*，(*α*, *β*[1], *β*[2], …, *β*[*p*]) 为拉格朗日乘子。通过求解 (*α*, *β*[1], *β*[2],
  …, *β*[*k*]) 并将其代入 (7.48) 的梯度中，我们得到自适应算法：


  ![$$ {W}_{k+1}={W}_k+{\eta}_k\left({A}_k{W}_kC-{B}_k{W}_k{CW}_k^T{A}_k{W}_k\right)\kern0.5em
  \mathrm{DIAG}{\left({W}_k^T{A}_k{W}_k\right)}^{-1} $$](img/522202_1_En_7_Chapter_TeX_IEq90.png)。     (7.49)


  ### IT 算法 Python 代码


  以下 Python 代码适用于数据 `X[nDim,nSamples]` 和 `Y[nDim,nSamples]`：


  ```

  from numpy import linalg as la

  A  = np.zeros(shape=(nDim,nDim)) # 存储自适应相关矩阵

  B  = np.zeros(shape=(nDim,nDim)) # 存储自适应相关矩阵

  W2 = 0.1 * np.ones(shape=(nDim,nEA)) # 所有算法的权向量

  W3 = W2

  c = [2.6-0.3*k for k in range(nEA)]

  C = np.diag(c)

  for epoch in range(nEpochs):

  for iter in range(nSamples):

  cnt = nSamples*epoch + iter

  # 使用当前数据向量 x,y 更新数据相关矩阵 A,B

  x = X[:,iter]

  x = x.reshape(nDim,1)

  A = A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - A)

  y = Y[:,iter]

  y = y.reshape(nDim,1)

  B = B + (1.0/(1 + cnt))*((np.dot(y, y.T)) - B)

  # 收缩梯度下降

  W2 = W2 + (1/(50 + cnt))*(A @ W2 - B @ W2 @ np.triu(W2.T @ A @ W2)) \

  @ inv(np.diag(np.diagonal(W2.T @ A @ W2)))

  # 加权梯度下降

  W3 = W3 + (1/(100 + cnt))*(A @ W3 @ C – B @ W3 @ C @ (W3.T @ A @ W3)) \

  @ inv(np.diag(np.diagonal(W3.T @ A @ W3)))

  ```


