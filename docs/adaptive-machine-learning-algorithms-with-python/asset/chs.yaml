  nSamples = X.shape[1]\nnDim = X.shape[0]\ncorX = (X @ X.T) / nSamples\neigvals,\
  \ eigvecs = eigh(corX)\nV  = np.fliplr(eigvecs)\n# PCA 变换后的数据\nY = V[:,:100] @ V[:,:100].T\
  \ @ X\n```\n\n由于 PCA 在均方误差意义上是最优的，它已被广泛应用于信号与图像处理、数据分析、模式识别、通信和控制工程等领域。诸如信号子空间与噪声子空间分离等应用在数字通信和数字图像处理中非常重要。PCA\
  \ 在信号处理中的应用包括时域和空域谱分析。例如，多信号分类（MUSIC）技术、最小范数方法、ESPIRIT 估计器以及用于估计正弦波频率或入射到天线阵列的平面波到达方向（DOA）的加权子空间拟合（WSF）方法。最近，PCA\
  \ 被应用于盲数字通信和语音处理。例如，在 [Chatterjee et al. 97-99; Chen et al. 99] 中，PCA 被用于基于 DS-CDMA\
  \ 的空频处理中的盲二维 RAKE 接收机，以解决远近问题。在 [Diamantaras and Strintzis 97] 中，PCA 被用于存在噪声情况下的最优线性矢量编码和解码。\n\
  \n\n\n### 统一框架\n\n在本章中，我提出了一个统一框架，用于推导和分析几种（部分知名的）自适应特征分解算法。其步骤包括以下内容：\n\n1.  描述一个目标函数，我通过使用非线性优化的梯度下降法，从该函数推导出自适应算法。\n\
  \n2.  对于每个目标函数，我提供了三种推导自适应算法的方法，从而得到三组自适应算法，每组算法在计算成本、收敛特性和实现简易性上各有特点：\n    1. \
  \ *齐次自适应规则：* 这类算法不计算特征值递减的真正归一化特征向量。相反，它们生成单位特征向量的线性组合。然而，这类算法计算速度快，且可在并行网络中实现。\n\
  \n2.  *收缩自适应规则：* 在此规则下，我们失去了算法的齐次性，但能生成特征值递减的单位特征向量，从而满足许多应用需求。然而，训练是顺序进行的，第 *n*^(*th*)\
  \ 个神经元的权值学习规则依赖于前 *n*–1 个神经元的训练，这使得训练过程难以并行实现。\n\n3.  *加权自适应规则：* 这类算法通过为每个特征向量使用不同的标量权重，打破了齐次算法的对称性而获得。单位特征向量被显式地按特征值递减顺序得到。这些算法也可以在并行网络中实现。然而，它们需要额外的计算。\n\
  \n有趣的是，这里介绍的许多算法是在超过十年的时间里独立发现的。例如，Oja 等人*.* [Oja and Karhunen 85] 于 1985 年首次提出了\
  \ Oja 齐次算法 (5.5)。众多从业者在 1989 年至 1998 年间的不同出版物中广泛分析了该算法（参见第 5.3.1 节）。Sanger [Sanger\
  \ 89] 于 1989 年展示了该算法的收缩版本 (5.8)。随后，Oja、Brockett、Xu 和 Chen 等人在 1992-98 年间提出了该算法的加权变体\
  \ (5.10)（参见第 5.3.2 节）。本章将这些算法以及许多其他算法（包括几种新算法）统一到一个具有简单推导过程的单一框架中。请注意，尽管这些算法是从不同角度发现的，但我将它们建立在一个共同的基础上。\n\
  \n给定一个已中心化为零均值的渐近平稳序列 {**x**[*k*]∈ℜ^(*n*)}，其渐近数据相关矩阵由 ![$$ A=\\underset{k\\to \\\
  infty }{\\lim }E\\left[{\\mathbf{x}}_k{\\mathbf{x}}_k^T\\right] $$](images/522202_1_En_5_Chapter/522202_1_En_5_Chapter_TeX_IEq1.png)\
  \ 给出。*A* 的 *p*≤*n* 个正交单位主特征向量 **ϕ**[1],...,**ϕ**[*p*] 由下式给出：\n\n![$$ {\\boldsymbol{\\\
  upvarphi}}_i^TA{\\boldsymbol{\\upvarphi}}_j={\\lambda}_i{\\delta}_{ij} $$](img/522202_1_En_5_Chapter_TeX_IEq2.png)，且\
  \ ![$$ {\\boldsymbol{\\upvarphi}}_i^T{\\boldsymbol{\\upvarphi}}_j={\\delta}_{ij}\
  \ $$](img/522202_1_En_5_Chapter_TeX_IEq3.png) 对于 *i*=1,…,*p*， (5.1)\n\n其中 λ[1]>\
  \ ... >λ[*p*]>λ[*p*+1]≥ ... ≥λ[*n*]>0 是 *A* 按幅值降序排列的 *p* 个最大特征值。如果序列 {**x**[*k*]}\
  \ 是非平稳的，我们通过 (2.3) 或 (2.5) 计算在线数据相关矩阵 *A*[*k*]∈ℜ^(*n*X*n*)。\n\n在我对算法的分析中，我遵循第 1.​4\
  \ 节概述的方法论。对于这些算法，我描述了一个*目标函数 J*(**w**[*i*]; *A*) 和一个形式如下的更新规则：\n\n*W*[*k* + 1] = *W*[*k*] + *η*[*k*]*h*(*W*[*k*],\
  \ *A*[*k*])， (5.2)\n\n其中 *h*(*W*[*k*],*A*[*k*]) 遵循某些连续性和正则性属性 [Ljung 77, 92]，且 *η*[*k*]\
  \ 是一个递减的增益序列。\n\n### 本章概要\n\n在第 5.2 节中，我讨论了本章分析的目标函数及其变体。在第 5.3 节中，我针对 OJA 目标函数提出了齐次、收缩和加权变体的自适应算法及其收敛结果。在第\
  \ 5.4 节中，我分析了均方误差 (XU) 目标函数的相同三种变体。在第 5.5 节中，我讨论了从罚函数 (PF) 目标函数推导出的算法，并证明了收敛结果。在第\
  \ 5.6 节中，我考虑了增广拉格朗日 1 (AL1) 目标函数；在第 5.7 节中，我介绍了增广拉格朗日 2 (AL2) 目标函数。在第 5.8 节中，我介绍了信息论\
  \ (IT) 准则；在第 5.9 节中，我描述了瑞利商 (RQ) 准则。在第 5.10 节中，我给出了此处讨论的所有算法的总结。在第 5.11 节中，我讨论了实验结果，并在第\
  \ 5.12 节中对本章进行了总结。\n\n## 5.2 算法与目标函数\n\n遵循我在第 2.​2 章中提出的方法论，对于每个算法，我描述一个目标函数并为其推导出自适应算法。我根据算法的发明者或推导它们所依据的目标函数对它们进行了分类。这些目标函数是：\n\
  \n1.  Oja 目标函数 [Oja 92; Oja et al*.* 92]，\n\n2.  用于 Xu 算法的均方误差目标函数 [Xu 91, 93]，\n\
  \n3.  罚函数法 [Chauvin 89; Mathew et al*.* 95]，\n\n4.  增广拉格朗日方法 1，\n\n5.  增广拉格朗日方法\
  \ 2，\n\n6.  信息论准则 [Pumbley 95; Miao and Hua 98]，\n\n7.  瑞利商准则 [Luo 97; Sarkar and\
  \ Yang 89; Yang et al*.* 89; Fu and Dowling 94, 95]。\n\n\n\n### 自适应算法目标函数总结\n\n\
