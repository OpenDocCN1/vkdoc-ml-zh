- '# 1. 引言


  在本章中，我将介绍用于数据表示和分类的重要特征的自适应计算方法。我将论证这些特征在机器学习、数据可视化和数据分析中的重要性。同时，我也会展示这些算法在多个学科中的重要性，并介绍它们在这些学科中的推导方式。最后，我将提出一种通用的方法来推导这些算法。该方法具有很高的实用价值，因为实践者可以利用它为自己的应用场景推导出专属的特征和算法。


  对于这些数据特征，我假设数据以序列形式到达，必须即时使用，且无法将整批数据存储在内存中。


  在回归、分类、增强或可视化等机器学习和数据分析问题中，数据的有效表示是关键。当数据是多维且随时间变化时，计算挑战更为严峻。此时，我们不仅需要及时计算出表示后的数据，还要以快速、高效且稳健的方式适应不断变化的输入。


  一种著名的数据压缩/表示方法是卡胡南-洛厄夫定理 [Karhunen–Loève theorem, Wikipedia] 或特征向量正交展开 [Fukunaga
  90]。该方法也被称为主成分分析（PCA）[principal component analysis, Wikipedia]。由于每个特征向量可根据其对应的特征值进行排序，因此可以选择一组“最佳”特征向量作为最相关的特征。


  图 1-1 展示了一个包含两个类别的二维数据，其中用于数据表示的最佳特征是将数据投影到向量 **e**[1] 上，该向量捕捉了来自两个类别的数据的最显著属性。


  ![](img/522202_1_En_1_Fig1_HTML.png)


  图 1-1


  最能表示来自两个类别的数据的数据表示特征 **e**[1] [来源：Chatterjee 等人，IEEE Transactions on Neural Networks,
  Vol. 8, No. 3, pp. 663-678, May 1997]


  然而，在分类中，通常希望提取能有效保持*类别可分性*的特征。简单来说，分类特征提取的目标是找到一个变换，将原始测量值映射到一个更小的特征集，该特征集包含解决整个模式识别问题所需的所有判别信息。


  图 1-2 展示了相同的包含两个类别的二维数据，其中用于分类的最佳特征是向量 **e**[2]，将数据投影到 **e**[2] 上能带来最佳的类别可分性。


  ![](img/522202_1_En_1_Fig2_HTML.jpg)


  图 1-2


  能带来最佳类别可分性的数据分类特征 **e**[2] [来源：Chatterjee 等人，IEEE Transactions on Neural Networks,
  Vol. 8, No. 3, pp. 663-678, May 1997]


  在接下来的章节中介绍用于流数据的自适应算法之前，我需要讨论以下几点：


  1.  通过对数据进行线性变换获得的常用特征，以及它们如何用于边缘应用的流数据

  2.  这些特征的历史渊源，以及我们如何从不同学科中推导出它们

  3.  为什么我们要使用自适应算法来计算这些特征

  4.  如何创建一个通用的数学框架来推导这些特征以及更多其他特征的自适应算法


  ## 1.1 通过线性变换获得的常用特征


  在本节中，我将讨论四种用于数据分析和机器学习的常用特征。这些特征在数据分类和表示中非常有效，并且可以通过对数据进行简单的线性变换轻松获得。这些特征的简洁性和有效性使其非常适用于流数据和边缘应用。


  用数学术语来说，设 {**x**[*k*]} 是一个表示数据的 *n* 维（零均值）序列。我们寻求一个矩阵序列 {*W*[*k*]} 和一个变换：


  ![$$ {\mathbf{y}}_k={W}_k^T{\mathbf{x}}_k $$](img/522202_1_En_1_Chapter_TeX_IEq1.png)，     (1.1)


  使得线性变换 **y**[*k*] 具有数据表示的特性，并且是我们所需的特征。我将在后面讨论其中一些特征。


  **定义：** 将 {**x**[*k*]} 的数据相关矩阵 *A* 定义为


  ![$$ A=\underset{k\to \infty }{\lim }E\left[{\mathbf{x}}_k{\mathbf{x}}_k^T\right]
  $$](images/522202_1_En_1_Chapter/522202_1_En_1_Chapter_TeX_IEq2.png)。     (1.2)


  ### 数据白化


  数据白化是一个对数据进行去相关处理的过程，使得所有分量都具有单位方差。这是机器学习和数据分析中用于“归一化”数据的预处理步骤，以便更容易建模。这里数据的线性变换
  **y**[*k*] 具有性质 ![$$ E\left[{\mathbf{y}}_k{\mathbf{y}}_k^T\right] $$](images/522202_1_En_1_Chapter/522202_1_En_1_Chapter_TeX_IEq3.png)=*I*[*n*]（单位矩阵）。我将在第
  3 章中讨论 *W*[*k*]=*A*^(–½) 是最优值。


  图 1-3 展示了原始数据和白化数据的相关矩阵。原始随机正态数据高度相关，如所有轴上的颜色所示。白化数据完全去相关，分量之间没有相关性，因为只存在对角线上的值。


  ![](img/522202_1_En_1_Fig3_HTML.jpg)


  图 1-3


  原始相关数据通过数据白化算法变为不相关


  从原始数据集 `X[nDim, nSamples]` 生成白化数据的 Python 代码如下：


  ```

  from scipy.linalg import eigh

  # 计算原始数据的相关矩阵和特征向量

  corX = (X @ X.T) / nSamples

  # 生成白化数据

  eigvals, eigvecs = eigh(corX)

  V = np.fliplr(eigvecs)

  D  = np.diag(np.sqrt(1/eigvals[::-1]))

  Y = V @ D @ V.T @ X

  corY = (Y @ Y.T)/nSamples

  # 绘制原始数据和白化数据的相关矩阵

  import seaborn as sns

  plt.figure(figsize=(10, 4))

  plt.rcParams.update({''font.size'': 16})

  plt.subplot(1, 2, 1)

  sns.heatmap(corX, linewidth=0.5, linecolor="green", cmap=''RdBu'', cbar=False)

  plt.title("原始数据")

  plt.subplot(1, 2, 2)

  sns.heatmap(corY, linewidth=0.5, linecolor="green", cmap=''hot'', cbar=False)

  plt.title("白化数据")

  plt.show()

  ```




  ### 主成分


  [主成分分析](https://en.wikipedia.org/wiki/Principal_component_analysis)（PCA）是数据表示模型中一个经过充分研究的例子。从*经典统计学*的角度来看，PCA
  是对多变量数据 {**x**[*k*]} 协方差结构的分析。令 **y**[*k*]=[*y*[*k*1],…,*y*[*kp*]]^(*T*) 为 PCA 变换后数据的成分。在这种表示中，第一主成分
  *y*[*k1*] 是一个一维线性子空间，投影数据的方差在该子空间上最大。第二主成分 *y*[*k*2] 是在与 *y*[*k*1] 正交的空间中方差最大的方向，依此类推。


  已有研究表明，最优权重矩阵 *W*[*k*] 是零均值输入过程 {**x**[*k*]} 相关矩阵的特征向量矩阵。令 *A*Φ=ΦΛ 为 *A* 的*特征分解（EVD）*，其中
  Φ 和 Λ 分别是特征向量和特征值矩阵。这里 Λ=*diag*(*λ*[1],…,*λ*[*n*]) 是对角特征值矩阵，满足 *λ*[1]≥…≥*λ*[*n*]>0，且
  Φ 是标准正交的。我们将 Φ[*p*]∈ℜ^(*n*X*p*) 记为其列是前 *p* 个主特征向量的矩阵。那么最优的 *W*[*k*]=Φ[*p*]。


  PCA 有三种在应用中很有用的变体。


  1.  当 *p*=*n* 时，**y**[*k*] 的 *n* 个成分按方差从最大到最小排序。这是用于*数据分析*的成分分析器。


  2.  当 *p*<*n* 时，**y**[*k*] 的 *p* 个成分包含用于*数据压缩*的最大信息量。


  3.  对于 *p*<*n*，**y**[*k*] 中方差最小的 *n*–*p* 个成分可被视为异常信号，并通过重构为 (*I*[*n*]–Φ[*p*]Φ[*p*]^(*T*))**x**[*k*]
  来获得一个*新颖性滤波器*。


  图 1-4 显示了原始数据和 PCA 变换后的随机正态数据的相关矩阵。原始数据高度相关，如所有轴上的颜色所示。PCA 变换后的数据不相关，仅具有对角块，且成分
  1（左上角块）的表示值最高，之后递减。


  ![](img/522202_1_En_1_Fig4_HTML.jpg)


  图 1-4


  原始相关数据通过 PCA 投影变得不相关


  从原始数据集 `X[nDim, nSamples]` 生成 PCA 投影数据的 Python 代码如下：


  ```

  from scipy.linalg import eigh

  # 计算数据相关矩阵

  corX = (X @ X.T) / nSamples

  # 生成 PCA 变换后的数据

  eigvals, eigvecs = eigh(corX)

  EstV = np.fliplr(eigvecs)

  Y = EstV.T @ X

  corY = (Y @ Y.T)/nSamples

  # 绘制 PCA 变换后的数据

  import seaborn as sns

  plt.figure(figsize=(10, 5))

  plt.rcParams.update({''font.size'': 16})

  plt.subplot(1, 2, 1)

  sns.heatmap(corX, linewidth=0.5, linecolor="green", cmap=''RdBu'', cbar=False)

  plt.title("原始数据")

  plt.subplot(1, 2, 2)

  sns.heatmap(corY, linewidth=0.5, linecolor="green", cmap=''hot'', cbar=False)

  plt.title("PCA 变换后")

  plt.show()

  ```


  ### 线性判别特征


  线性判别分析（LDA）[线性判别分析，维基百科] 从多个类别的数据中创建特征，使得变换后的表示 **y**[*k*] 具有最大的类别可分性。给定数据 **x**[*k*]
  和相应的类别 **c**[*k*]，我们可以计算以下矩阵：


  *   数据相关矩阵 *B*=*E*(**x**[*k*]**x**[*k*]^(*T*))，


  *   互相关矩阵 *M*=*E*(**x**[*k*]**c**[*k*]^(*T*))，


  *   以及 *A*=*MM*^(*T*)。


  众所周知，线性变换 *W*[*k*]（公式 1.1）是 *A* 相对于 *B* 的*广义特征分解*（GEVD）[广义特征向量，维基百科]。这里 *A*Ψ=*B*ΨΔ，其中
  Ψ 和 Δ 分别是广义特征向量和特征值矩阵。此外，Ψ[*p*]∈ℜ^(*n*X*p*) 是其列为前 *p≤n* 个主广义特征向量的矩阵。


  图 1-5 展示了一个二分类问题，其中左侧的真实世界数据相关矩阵在所有轴上都有值，很难区分这两个类别。右侧是 LDA 变换后的数据，清晰地显示了两个类别，易于分类。


  ![](img/522202_1_En_1_Fig5_HTML.jpg)


  图 1-5


  原始相关数据通过线性判别分析变得不相关


  从二分类、多维数据集 `[nDim, nSamples]` 自适应生成 LDA 变换后相关矩阵的 Python 代码如下：


  ```

  # 自适应计算矩阵 A 和 B

  from numpy import linalg as la

  dataset2 = dataset.drop([''Class''],1)

  nSamples = dataset2.shape[0]

  nDim = dataset2.shape[1]

  classes = np.array(dataset[''Class'']-1)

  classes_categorical = tf.keras.utils.to_categorical(classes, num_classes=2)

  M = np.zeros(shape=(nDim,2)) # 存储自适应相关矩阵

  B = np.zeros(shape=(nDim,nDim)) # 存储自适应相关矩阵

  for iter in range(nSamples):

  cnt = iter + 1

  # 从当前样本 x 生成矩阵 A 和 B

  x = np.array(dataset2.iloc[iter])

  x = x.reshape(nDim,1)

  B = B + (1.0/cnt)*((np.dot(x, x.T)) - B)

  y = classes_categorical[iter].reshape(2,1)

  M = M + (1.0/cnt)*((np.dot(x, y.T)) - M)

  A = M @ M.T

  # 生成 LDA 变换后的数据

  from scipy.linalg import eigh

  from sklearn.preprocessing import normalize

  eigvals, eigvecs = eigh(A, B)

  V = np.fliplr(eigvecs)

  VTAV = np.around(V.T @ A @ V, 2)

  VTBV = np.around(V.T @ B @ V, 2)

  # 绘制 LDA 变换后的数据

  import seaborn as sns

  plt.figure(figsize=(8, 8))

  plt.rcParams.update({''font.size'': 16})

  plt.subplot(2, 2, 1)

  sns.heatmap(A, linewidth=0.5, linecolor="green", cmap=''RdBu'', cbar=False)

  plt.title("原始数据")

  plt.subplot(2, 2, 2)

  sns.heatmap(VTBV, linewidth=0.5, linecolor="green", cmap=''hot'', cbar=False)

  plt.title("LDA 变换后")

  plt.subplot(2, 2, 3)

  sns.heatmap(A, linewidth=0.5, linecolor="green", cmap=''RdBu'', cbar=False)

  plt.subplot(2, 2, 4)

  sns.heatmap(VTAV, linewidth=0.5, linecolor="green", cmap=''hot'', cbar=False)

  plt.show()

  ```


  ### 奇异值特征


  奇异值分解（SVD）[奇异值分解，维基百科] 是 EVD 问题的一个特例，如下所述。给定互相关（n×m 实）矩阵 *M*=*E*(**x**[*k*]**c**[*k*]^(*T*))
  ∈ℜ^(*nXm*)，SVD 计算两个矩阵 *U*[*k*]∈ℜ^(*nXn*) 和 *V*[*k*]∈ℜ^(*mXm*)，使得 *U*[*k*]^(*T*)*MV*[*k*]=*S*[*nxm*]，其中
  *U*[*k*] 和 *V*[*k*] 是标准正交的，且 *S*=diag(*s*[1],...*s*[*r*])，*r*=min(*m*, *n*)，满足 *s*[1]>=...>=*s*[*r*]>=0。通过重新排列向量
  **x**[*k*] 和 **c**[*k*]，我们可以将一个 *n*x*m* 维的 SVD 问题转化为一个 (*n*+*m*)x(*n*+*m*) 维的 EVD
  问题。




