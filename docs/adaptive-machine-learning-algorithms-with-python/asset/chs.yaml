  \ 8 维数据，这些数据偶尔会出现异常读数。检测异常的一种方法是计算当前样本与其运行中位数的偏差，并将其与一个统计量进行比较。\n\n我使用了自适应中位数算法（2.20）来计算运行中位数，并使用一个简单的统计量来检测异常。结果见图\
