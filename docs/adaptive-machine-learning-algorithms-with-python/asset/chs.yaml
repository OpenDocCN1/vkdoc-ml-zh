  *α* = 0 且 ![$$ {\beta}_j=\frac{{{\mathbf{w}}_k^j}^T{A}_k{\mathbf{w}}_k^i}{{{\mathbf{w}}_k^i}^T{B}_k{\mathbf{w}}_k^i}
  $$](img/522202_1_En_7_Chapter_TeX_IEq94.png) 其中 *j*=1,…,*p*。     (7.51)


  将 (*α*, *β*[1], *β*[2], …, *β*[*p*]) 代入 (7.50) 的梯度中并进行小幅近似，我们得到广义特征向量的 RQ 齐次自适应梯度下降算法：


  ![$$ {\mathbf{w}}_{k+1}^i={\mathbf{w}}_k^i+{\eta}_k\left({A}_k{\mathbf{w}}_k^i-\sum
  \limits_{j=1}^p{B}_k{\mathbf{w}}_k^j\left({{\mathbf{w}}_k^j}^T{A}_k{\mathbf{w}}_k^i\right)\right)/{{\mathbf{w}}_k^i}^T{B}_k{\mathbf{w}}_k^i
