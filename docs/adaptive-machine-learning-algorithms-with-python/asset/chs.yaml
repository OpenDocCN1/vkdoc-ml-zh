  i}^p{\beta}_j{c}_j{{\mathbf{w}}_k^j}^T{B}_k{\mathbf{w}}_k^i $$](img/522202_1_En_7_Chapter_TeX_IEq68.png),


  ![$$ +\mu \left(\sum \limits_{j=1,j\ne i}^p{c}_j{\left({{\mathbf{w}}_k^j}^T{B}_k{\mathbf{w}}_k^i\right)}²+\frac{c_i}{2}{\left({{\mathbf{w}}_k^i}^T{B}_k{\mathbf{w}}_k^i-1\right)}²\right)
  $$](img/522202_1_En_7_Chapter_TeX_IEq69.png),     (7.33)


  对于 *i*=1,…,*p* (*p*≤*n*)，其中 (*α*, *β*[1], *β*[2], …, *β*[*p*]) 是拉格朗日乘子，*μ* 是一个正的惩罚常数，且
  *c*[1] > *c*[2] > … > *c*[*p*] > 0。自适应算法为


  ![$$ {W}_{k+1}={W}_k+{\eta}_k\left(\left({A}_k{W}_kC-{B}_k{W}_k{CW}_k^T{A}_k{W}_k-\mu
  {B}_k{W}_kC\left({W}_k^T{B}_k{W}_k-{I}_p\right)\right)\right. $$](img/522202_1_En_7_Chapter_TeX_IEq70.png), (7.34)


  其中 *C* =  *diag* (*c*[1], …, *c*[*p*])。




  ### AL1 算法 Python 代码


  以下 Python 代码适用于多维数据 `X[nDim,nSamples]` 和 `Y[nDim,nSamples]`：


  ```

  from numpy import linalg as la

  A  = np.zeros(shape=(nDim,nDim)) # 存储自适应相关矩阵

  B  = np.zeros(shape=(nDim,nDim)) # 存储自适应相关矩阵

  W2 = 0.1 * np.ones(shape=(nDim,nEA)) # 所有算法的权重向量

  W3 = W2

  c = [2.6-0.3*k for k in range(nEA)]

  C = np.diag(c)

  I  = np.identity(nDim)

  mu = 2

  for epoch in range(nEpochs):

  for iter in range(nSamples):

  cnt = nSamples*epoch + iter

  # 使用当前数据向量 x,y 更新数据相关矩阵 A,B

  x = X[:,iter]

  x = x.reshape(nDim,1)

  A = A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - A)

  y = Y[:,iter]

  y = y.reshape(nDim,1)

  B = B + (1.0/(1 + cnt))*((np.dot(y, y.T)) - B)

  # 收缩梯度下降

  W2 = W2 + (1/(500 + cnt))*(A @ W2 - B @ W2 @ np.triu(W2.T @ A @ W2) \

  - mu * B @ W2 @ np.triu((W2.T @ B @ W2) - I))

  # 加权梯度下降

  W3 = W3 + (1/(1000 + cnt))*(A @ W3 @ C - B @ W3 @ C @ (W3.T @ A @ W3) \

  - mu * B @ W3 @ C @ ((W3.T @ B @ W3) - I))

  ```


