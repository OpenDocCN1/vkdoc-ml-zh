  sum \\limits_{j=1,j\\ne i}^p{\\beta}_j{{\\mathbf{w}}_k^j}^T{\\mathbf{w}}_k^i $$](img/522202_1_En_5_Chapter_TeX_IEq86.png)，     (5.42)\n\
  \n其中 *i*=1,…,*p*，(*α*,*β*[1],*β*[2],…, *β*[*p*]) 为拉格朗日乘子。通过令 (5.42) 关于 ![$$ {\\\
  mathbf{w}}_k^i $$](img/522202_1_En_5_Chapter_TeX_IEq87.png) 的梯度等于 **0**，并利用约束条件\
  \ ![$$ {{\\mathbf{w}}_k^j}^T{\\mathbf{w}}_k^i={\\delta}_{ij} $$](img/522202_1_En_5_Chapter_TeX_IEq88.png)，我们得到\n\
  \n*α* = 0 且 ![$$ {\\beta}_j={{\\mathbf{w}}_k^j}^T{A}_k{\\mathbf{w}}_k^i/{{\\mathbf{w}}_k^i}^T{\\\
  mathbf{w}}_k^i $$](img/522202_1_En_5_Chapter_TeX_IEq89.png)，其中 *j*=1,…,*p*，*j*≠*i*。     (5.43)\n\
  \n将 (5.42) 梯度中的 (*α*,*β*[1],*β*[2],…,*β*[*p*]) 替换，并进行近似，我们得到用于 PCA 的 RQ 齐次自适应梯度下降算法：\n\
  \n![$$ {W}_{k+1}={W}_k+{\\eta}_k\\left({A}_k{W}_k-{W}_k{W}_k^T{A}_k{W}_k\\right)\\\
  kern0.5em \\mathrm{DIAG}{\\left({W}_k^T{W}_k\\right)}^{-1} $$](img/522202_1_En_5_Chapter_TeX_IEq90.png)，     (5.44)\n\
  \n其中 DIAG[⋅] 将其矩阵参数中除对角线外的所有元素置零。这里 *W*[*k*] 收敛于 *W*^(***)= Φ*DU*，其中 *D=*[*D*[1]|0]^(*T*)∈ℜ^(*n*X*p*)，*D*[1]*=diag*(*d*[1]*,...,d*[*p*])∈ℜ^(*p*X*p*)，*d*[*i*]*=*±1，*i=*1,...,*p*，而\
  \ *U*∈ℜ^(*p*X*p*) 是一个任意旋转矩阵*。*\n\n### RQ 收缩算法\n\nRQ 收缩 PCA 算法的目标函数为\n\n![$$ J\\\
  left({\\mathbf{w}}_k^i;{A}_k\\right)=-\\frac{{{\\mathbf{w}}_k^i}^T{A}_k{\\mathbf{w}}_k^i}{{{\\\
  mathbf{w}}_k^i}^T{\\mathbf{w}}_k^i}+\\alpha \\left({{\\mathbf{w}}_k^i}^T{\\mathbf{w}}_k^i-1\\\
  right)+2\\sum \\limits_{j=1}^{i-1}{\\beta}_j{{\\mathbf{w}}_k^j}^T{\\mathbf{w}}_k^i\
  \ $$](img/522202_1_En_5_Chapter_TeX_IEq91.png)     (5.45)\n\n其中 *i*=1,…,*p*，(*α*,*β*[1],*β*[2],…,\
  \ *β*[*i*–1]) 为拉格朗日乘子。通过求解 (*α*,*β*[1],*β*[2],…,*β*[*i*–1]) 并将其代入 (5.45) 的梯度中，我们得到自适应梯度下降算法：\n\
  \n![$$ {W}_{k+1}={W}_k+{\\eta}_k\\left({A}_k{W}_k-{W}_k UT\\left({W}_k^T{A}_k{W}_k\\\
  right)\\right)\\kern0.5em \\mathrm{DIAG}{\\left({W}_k^T{W}_k\\right)}^{-1} $$](img/522202_1_En_5_Chapter_TeX_IEq92.png)。     (5.46)\n\
  \n当 *k*→∞ 时，*W*[*k*] 以概率 1 收敛于 *W*^(***)= [±**ϕ**[1] ±**ϕ**[2] … ±**ϕ**[*p*]]。\n\
  \n### RQ 加权算法\n\nRQ 加权 PCA 算法的目标函数为\n\n![$$ J\\left({\\mathbf{w}}_k^i;{A}_k\\right)=-{c}_i\\\
  frac{{{\\mathbf{w}}_k^i}^T{A}_k{\\mathbf{w}}_k^i}{{{\\mathbf{w}}_k^i}^T{\\mathbf{w}}_k^i}+\\\
  alpha {c}_i\\left({{\\mathbf{w}}_k^i}^T{\\mathbf{w}}_k^i-1\\right)+2\\sum \\limits_{j=1,j\\\
  ne i}^p{\\beta}_j{c}_j{{\\mathbf{w}}_k^j}^T{\\mathbf{w}}_k^i $$](img/522202_1_En_5_Chapter_TeX_IEq93.png)，     (5.47)\n\
  \n其中 *i*=1,…,*p*，(*α*,*β*[1],*β*[2],…,*β*[*p*]) 为拉格朗日乘子。通过求解 (*α*,*β*[1],*β*[2],…,*β*[*p*])\
  \ 并将其代入 (5.47) 的梯度中，我们得到算法\n\n![$$ {W}_{k+1}={W}_k+{\\eta}_k\\left({A}_k{W}_kC-{W}_k{CW}_k^T{A}_k{W}_k\\\
  right)\\kern0.5em \\mathrm{DIAG}{\\left({W}_k^T{W}_k\\right)}^{-1} $$](img/522202_1_En_5_Chapter_TeX_IEq94.png)，     (5.48)\n\
  \n其中 *C*=*diag*(*c*[1],…,*c*[*p*]) 且 *c*[1]>*c*[2]>…>*c*[*p*]>0。当 *k*→∞ 时，*W*[*k*]\
  \ 以概率 1 收敛于 *W*^(***)= [±**ϕ**[1] ±**ϕ**[2] … ±**ϕ**[*p*]]。\n\n### RQ 算法 Python\
  \ 代码\n\n以下 Python 代码使用数据 `X[nDim,nSamples]` 实现了 RQ PCA 算法：\n\n```\nfrom numpy import\
  \ linalg as la\nnEA = 4 # number of PCA components computed\nnEpochs  = 2\nA  =\
  \ np.zeros(shape=(nDim,nDim)) # stores adaptive correlation matrix\nW1 = 0.1 * np.ones(shape=(nDim,nEA))#\
  \ weight vectors of all algorithms\nW2 = W1\nW3 = W1\nc = [2-0.3*k for k in range(nEA)]\n\
  C = np.diag(c)\nfor epoch in range(nEpochs):\nfor iter in range(nSamples):\ncnt\
  \ = nSamples*epoch + iter\nx = X[:,iter]\nx = x.reshape(nDim,1)\nA = A + (1.0/(1\
  \ + cnt))*((np.dot(x, x.T)) - A)\n# Homogeneous Gradient Descent\nW1 = W1 + (1/(50\
  \ + cnt))*(A @ W1 - W1 @ (W1.T @ A @ W1)) @ \\\ninv(np.diag(np.diagonal(W1.T @ W1)))\n\
  # Deflated Gradient Descent\nW2 = W2 + (1/(20 + cnt))*(A @ W2 - W2 @ np.triu(W2.T\
  \ @ A @ W2)) @ \\inv(np.diag(\nnp.diagonal(W2.T @ W2)))\n# Weighted Gradient Descent\n\
  W3 = W3 + (1/(200 + cnt))*(A @ W3 @ C - W3 @ C @ (W3.T @ A @ W3)) @ \\inv(np.diag(\n\
  np.diagonal(W3.T @ W3)))\n```\n\n\n\n## 5.10 自适应特征向量算法总结\n\n我将本章讨论的算法总结在表 5-2 中。每个算法均采用\
