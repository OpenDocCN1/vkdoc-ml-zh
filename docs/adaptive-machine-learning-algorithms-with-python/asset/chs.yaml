  Λ= *diag*(*λ*[1],...,*λ*[*n*]) 表示为广义特征值矩阵，使得 *λ*[1]>*λ*[2]>...>*λ*[*p*]>*λ*[*p*+1]≥...≥*λ*[*n*]>0。我使用下标
