  \n## 5.3 OJA 算法\n\n\n\n### OJA 齐次算法\n\nOJA 齐次算法的目标函数为\n\n![$$ J\\left({\\mathbf{w}}_k^i;{A}_k\\\
  right)=-{{\\mathbf{w}}_k^i}^T{A}_k²{\\mathbf{w}}_k^i+\\frac{1}{2}{\\left({{\\mathbf{w}}_k^i}^T{A}_k{\\\
  mathbf{w}}_k^i\\right)}²+\\sum \\limits_{j=1,j\\ne i}^p{\\left({{\\mathbf{w}}_k^i}^T{A}_k{\\\
  mathbf{w}}_k^j\\right)}² $$](img/522202_1_En_5_Chapter_TeX_IEq25.png),     (5.3)\n\
  \n其中 *i*=1,…,*p* (*p*≤*n*)。通过对 (5.3) 关于 ![$$ {\\mathbf{w}}_k^i $$](img/522202_1_En_5_Chapter_TeX_IEq26.png)\
  \ 求梯度，我们得到以下自适应算法：\n\n![$$ {\\mathbf{w}}_{k+1}^i={\\mathbf{w}}_k^i-{\\eta}_k{A}_k^{-1}{\\\
  nabla}_{{\\mathbf{w}}_k^i}J\\left({\\mathbf{w}}_k^i;{A}_k\\right) $$](img/522202_1_En_5_Chapter_TeX_IEq27.png)\
  \ 其中 *i*=1,…,*p*,\n\n或\n\n![$$ {\\mathbf{w}}_{k+1}^i={\\mathbf{w}}_k^i+{\\eta}_k\\\
  left({A}_k{\\mathbf{w}}_k^i-\\sum \\limits_{j=1}^p{\\mathbf{w}}_k^j{{\\mathbf{w}}_k^j}^T{A}_k{\\\
  mathbf{w}}_k^i\\right) $$](img/522202_1_En_5_Chapter_TeX_IEq28.png)     (5.4)\n\n\
  其中 *i*=1,…,*p*，*η*[*k*] 是一个小的递减常数。我们定义一个矩阵 ![$$ {W}_k=\\left[{\\mathbf{w}}_k¹\\\
  dots {\\mathbf{w}}_k^p\\right] $$](images/522202_1_En_5_Chapter/522202_1_En_5_Chapter_TeX_IEq29.png)\
  \ (*p*≤*n*)，其列是 *p* 个权重向量，分别收敛于 *A* 的 *p* 个主特征向量。我们可以将 (5.4) 表示为\n\n![$$ {W}_{k+1}={W}_k+{\\\
  eta}_k\\left({A}_k{W}_k-{W}_k{W}_k^T{A}_k{W}_k\\right) $$](img/522202_1_En_5_Chapter_TeX_IEq30.png)     (5.5)\n\
  \n这是由 Oja 提出的*主子空间学习算法*的矩阵形式 [Oja 85,89,92]。\n\n*W*[*k*] 收敛于 *W*^(***)=Φ*DU*，其中\
  \ *D=*[*D*[1]|0]^(*T*)∈ℜ^(*n*X*p*)*, D*[1]*=diag*(*d*[1]*,...,d*[p])∈ℜ^(*p*X*p*),\
  \ *d*[*i*]*=*±1 对于 *i=*1,...,*p*，且 *U*∈ℜ^(*p*X*p*) 是一个任意旋转矩阵（即 *U*^(*T*)*U=UU*^(*T*)*=I*[*p*]*）。\n\
  \n### OJA 收缩算法\n\nOJA 收缩自适应 PCA 算法的目标函数为\n\n![$$ J\\left({\\mathbf{w}}_k^i;{A}_k\\\
  right)=-{{\\mathbf{w}}_k^i}^T{A}_k²{\\mathbf{w}}_k^i+\\frac{1}{2}{\\left({{\\mathbf{w}}_k^i}^T{A}_k{\\\
  mathbf{w}}_k^i\\right)}²+\\sum \\limits_{j=1}^{i-1}{\\left({{\\mathbf{w}}_k^i}^T{A}_k{\\\
  mathbf{w}}_k^j\\right)}² $$](img/522202_1_En_5_Chapter_TeX_IEq31.png) 对于 *i*=1,…,*p*。\
  \ (5.6)\n\n通过对 (5.6) 求梯度，我们得到 OJA 收缩自适应梯度下降算法：\n\n![$$ {W}_{k+1}={W}_k+{\\eta}_k\\\
  left({A}_k{W}_k-{W}_k UT\\left({W}_k^T{A}_k{W}_k\\right)\\right) $$](img/522202_1_En_5_Chapter_TeX_IEq32.png),     (5.7)\n\
  \n其中 UT[⋅] 将其矩阵参数中对角线以下的所有元素设置为零，从而使其成为上三角矩阵。该算法也称为*广义 Hebbian 算法* [Sanger 89]。Sanger\
  \ 证明了当 *k*→∞ 时，*W*[*k*] 收敛于 *W*^(***)= [±**ϕ**[1] ±**ϕ**[2] … ±**ϕ**[*p*]]。\n\n\
  ### OJA 加权算法\n\nOJA 加权自适应 PCA 算法的目标函数为\n\n![$$ J\\left({\\mathbf{w}}_k^i;{A}_k\\\
  right)=-{c}_i{{\\mathbf{w}}_k^i}^T{A}_k²{\\mathbf{w}}_k^i+\\frac{c_i}{2}{\\left({{\\\
  mathbf{w}}_k^i}^T{A}_k{\\mathbf{w}}_k^i\\right)}²+\\sum \\limits_{j=1,j\\ne i}^p{c}_j{\\\
  left({{\\mathbf{w}}_k^i}^T{A}_k{\\mathbf{w}}_k^j\\right)}² $$](img/522202_1_En_5_Chapter_TeX_IEq33.png)     (5.8)\n\
  \n其中 *i*=1,…,*p*，且 *c*[1],…,*c*[*p*] 是满足 *c*[1]>*c*[2]>…>*c*[*p*]>0, *p*≤*n* 的小正数。由\
  \ (5.8)，我们得到 PCA 的 OJA 加权自适应梯度下降算法：\n\n![$$ {W}_{k+1}={W}_k+{\\eta}_k\\left({A}_k{W}_kC-{W}_k{CW}_k^T{A}_k{W}_k\\\
  right) $$](img/522202_1_En_5_Chapter_TeX_IEq34.png)     (5.9)\n\n其中 *C*=*diag*(*c*[1],…,*c*[*p*])。该算法也称为*Brockett\
  \ 子空间*算法 [Xu 93, Chen, Amari, Lin 98]。Xu [Xu 93, 定理 5 和 6] 证明了当 *k*→∞ 时，*W*[*k*]\
  \ 收敛于 *W*^(***)= [±**ϕ**[1] ±**ϕ**[2] … ±**ϕ**[*p*]]。\n\n### OJA 算法 Python 代码\n\n\
  以下 Python 代码使用数据 `X[nDim,nSamples]` 实现了 OJA PCA 算法：\n\n```\nfrom numpy import linalg\
  \ as la\nnEA = 4 # number of PCA components computed\nnEpochs  = 2\nA  = np.zeros(shape=(nDim,nDim))\
  \ # stores adaptive correlation matrix\nW1 = 0.1 * np.ones(shape=(nDim,nEA)) # weight\
  \ vectors of all algorithms\nW2 = W1\nW3 = W1\nc = [2-0.3*k for k in range(nEA)]\n\
  C = np.diag(c)\nfor epoch in range(nEpochs):\nfor iter in range(nSamples):\ncnt\
  \ = nSamples*epoch + iter\n# Update data correlation matrix A with current data\
  \ sample x\nx = X[:,iter]\nx = x.reshape(nDim,1)\nA = A + (1.0/(1 + cnt))*((np.dot(x,\
  \ x.T)) - A)\n# Homogeneous Gradient Descent\nW1 = W1 + (1/(100 + cnt))*(A @ W1\
  \ - W1 @ (W1.T @ A @ W1))\n# Deflated Gradient Descent\nW2 = W2 + (1/(100 + cnt))*(A\
  \ @ W2 - W2 @ np.triu(W2.T @ A @ W2))\n# Weighted Gradient Descent\nW3 = W3 + (1/(220\
  \ + cnt))*(A @ W3 @ C - W3 @ C @ (W3.T @ A @ W3))\n```\n\n## 5.4 XU 算法\n\n### XU\
  \ 齐次算法\n\nXU 齐次自适应 PCA 算法的目标函数为\n\n![$$ J\\left({\\mathbf{w}}_k^i;{A}_k\\right)=-{{\\\
  mathbf{w}}_k^i}^T{A}_k{\\mathbf{w}}_k^i+\\left({{\\mathbf{w}}_k^i}^T{A}_k{\\mathbf{w}}_k^i\\\
  right)\\left({{\\mathbf{w}}_k^i}^T{\\mathbf{w}}_k^i-1\\right)+2\\sum \\limits_{j=1,j\\\
  ne i}^p{{\\mathbf{w}}_k^i}^T{A}_k{\\mathbf{w}}_k^j{{\\mathbf{w}}_k^j}^T{\\mathbf{w}}_k^i\
  \ $$](img/522202_1_En_5_Chapter_TeX_IEq35.png)     (5.10)\n\n其中 *i*=1,…,*p*。通过对\
  \ (5.10) 关于 ![$$ {\\mathbf{w}}_k^i $$](img/522202_1_En_5_Chapter_TeX_IEq36.png)\
  \ 求梯度，我们得到 PCA 的 XU 齐次自适应梯度下降算法：\n\n![$$ {W}_{k+1}={W}_k+{\\eta}_k\\left(2{A}_k{W}_k-{A}_k{W}_k{W}_k^T{W}_k-{W}_k{W}_k^T{A}_k{W}_k\\\
  right) $$](img/522202_1_En_5_Chapter_TeX_IEq37.png).     (5.11)\n\n该算法也称为*最小均方误差重构*\
  \ (*LMSER*) *算法* [Xu 91,93]，并且是从前馈神经网络的*最小均方误差*准则推导出来的。Xu [Xu 93, 定理 2, 3] 证明了 *W*[*k*]\
  \ 收敛于 *W*^(***)=Φ*DU*，其中 *D=*[*D*[1]|0]^(*T*)∈ℜ^(*n*X*p*), *D*[1]*=diag*(*d*[1]*,...,d*[*p*])∈ℜ^(*p*X*p*),\
  \ *d*[*i*]*=*±1 对于 *i=*1,...,*p*，且 *U*∈ℜ^(*p*X*p*) 是一个任意旋转矩阵。\n\n### XU 收缩算法\n\n\
  XU 收缩自适应 PCA 算法的目标函数为\n\n![$$ J\\left({\\mathbf{w}}_k^i;{A}_k\\right)=-{{\\mathbf{w}}_k^i}^T{A}_k{\\\
  mathbf{w}}_k^i+\\left({{\\mathbf{w}}_k^i}^T{A}_k{\\mathbf{w}}_k^i\\right)\\left({{\\\
  mathbf{w}}_k^i}^T{\\mathbf{w}}_k^i-1\\right)+2\\sum \\limits_{j=1}^{i-1}{{\\mathbf{w}}_k^i}^T{A}_k{\\\
  mathbf{w}}_k^j{{\\mathbf{w}}_k^j}^T{\\mathbf{w}}_k^i $$](img/522202_1_En_5_Chapter_TeX_IEq38.png)     (5.12)\n\
  \n其中 *i*=1,…,*p*。PCA 的 XU 收缩自适应梯度下降算法为\n\n![$$ {W}_{k+1}={W}_k+{\\eta}_k\\left(2{A}_k{W}_k-{A}_k{W}_k\
  \ UT\\left({W}_k^T{W}_k\\right)-{W}_k UT\\left({W}_k^T{A}_k{W}_k\\right)\\right)\
  \ $$](img/522202_1_En_5_Chapter_TeX_IEq39.png),     (5.13)\n\n其中 UT[⋅] 将其矩阵参数中对角线以下的所有元素设置为零。Chatterjee\
  \ 等人*.* [Mar 00, 定理 1,2] 证明了当 *k*→∞ 时，*W*[*k*] 收敛于 *W*^(***)= [±**ϕ**[1] ±**ϕ**[2]\
  \ … ±**ϕ**[*p*]]*。\n\n\n\n### XU 加权算法\n\nXU 加权自适应 PCA 算法的目标函数为\n\n![$$ J\\left({\\\
  mathbf{w}}_k^i;{A}_k\\right)=-{c}_i{{\\mathbf{w}}_k^i}^T{A}_k{\\mathbf{w}}_k^i+{c}_i\\\
  left({{\\mathbf{w}}_k^i}^T{A}_k{\\mathbf{w}}_k^i\\right)\\left({{\\mathbf{w}}_k^i}^T{\\\
  mathbf{w}}_k^i-1\\right)+2\\sum \\limits_{j=1,j\\ne i}^p{c}_j{{\\mathbf{w}}_k^i}^T{A}_k{\\\
  mathbf{w}}_k^j{{\\mathbf{w}}_k^j}^T{\\mathbf{w}}_k^i $$](img/522202_1_En_5_Chapter_TeX_IEq40.png)     (5.14)\n\
  \n其中 *i*=1,…,*p* 且 *c*[1]>*c*[2]>…>*c*[*p*]>0。根据 (5.14)，用于 PCA 的 XU 加权自适应梯度下降算法为\n\
  \n![$$ {W}_{k+1}={W}_k+{\\eta}_k\\left(2{A}_k{W}_k{C}_k-{W}_k{CW}_k^T{A}_k{W}_k-{A}_k{W}_k{CW}_k^T{W}_k\\\
  right) $$](img/522202_1_En_5_Chapter_TeX_IEq41.png)     (5.15)\n\n其中 *C*=*diag*(*c*[1],…,*c*[*p*])。Xu\
  \ [Xu 93, 定理 5, 6] 证明了当 *k*→∞ 时，*W*[*k*] 收敛于 *W*^(***)= [±**ϕ**[1] ±**ϕ**[2] … ±**ϕ**[*p*]]。\n\
  \n### XU 算法 Python 代码\n\n以下 Python 代码使用数据 `X[nDim,nSamples]` 实现了 XU PCA 算法：\n\n\
  ```\nfrom numpy import linalg as la\nnEA = 4 # 计算的 PCA 分量数量\nnEpochs  = 2\nA  =\
  \ np.zeros(shape=(nDim,nDim)) # 存储自适应相关矩阵\nW1 = 0.1 * np.ones(shape=(nDim,nEA))\
  \ # 所有算法的权重向量\nW2 = W1\nW3 = W1\nc = [2-0.3*k for k in range(nEA)]\nC = np.diag(c)\n\
  for epoch in range(nEpochs):\nfor iter in range(nSamples):\ncnt = nSamples*epoch\
  \ + iter\nx = X[:,iter]\nx = x.reshape(nDim,1)\nA = A + (1.0/(1 + cnt))*((np.dot(x,\
  \ x.T)) - A)\n# 齐次梯度下降\nW1 = W1 + (1/(100 + cnt))*(A @ W1 - 0.5 * W1 @ (W1.T @ A\
  \ @ W1) -0.5 * A @ W1 @ (W1.T @ W1))\n# 收缩梯度下降\nW2 = W2 + (1/(100 + cnt))*(A @ W2\
  \ - 0.5 * W2 @ np.triu(W2.T @ A @ W2) -0.5 * A @ W2 @ np.triu(W2.T @ W2))\n# 加权梯度下降\n\
  W3 = W3 + (1/(100 + cnt))*(A @ W3 @ C - 0.5 * W3 @ C @ (W3.T @ A @ W3) -0.5 * A\
  \ @ W3 @ C @ (W3.T @ W3))\n```\n\n## 5.5 PF 算法\n\n### PF 齐次算法\n\n通过将瑞利商准则表示为以下惩罚函数，我们得到了惩罚函数齐次\
  \ PCA 算法的目标函数：\n\n![$$ J\\left({\\mathbf{w}}_k^i;{A}_k\\right)=-{{\\mathbf{w}}_k^i}^T{A}_k{\\\
  mathbf{w}}_k^i+\\mu \\left(\\sum \\limits_{j=1,j\\ne i}^p{\\left({{\\mathbf{w}}_k^j}^T{\\\
  mathbf{w}}_k^i\\right)}²+\\frac{1}{2}{\\left({{\\mathbf{w}}_k^i}^T{\\mathbf{w}}_k^i-1\\\
  right)}²\\right) $$](img/522202_1_En_5_Chapter_TeX_IEq42.png),  (5.16)\n\n其中 *μ*>0\
  \ 且 *i*=1,…,*p*。根据 (5.16) 对 ![$$ {\\mathbf{w}}_k^i $$](img/522202_1_En_5_Chapter_TeX_IEq43.png)\
  \ 的梯度，我们得到用于 PCA 的 PF 齐次自适应梯度下降算法为\n\n![$$ {W}_{k+1}={W}_k+{\\eta}_k\\left({A}_k{W}_k-\\\
  mu {W}_k\\left({W}_k^T{W}_k-{I}_p\\right)\\right) $$](img/522202_1_En_5_Chapter_TeX_IEq44.png),     (5.17)\n\
  \n其中 *I*[*p*] 是一个 *p*X*p* 的单位矩阵。\n\n*W*[k] 收敛于 *W*^*=Φ*DU*，其中 *D*=[*D*[1]|0]^T∈ℜ^(nXp)，*D*[1]=diag(*d*[1],...,*d*[*p*])∈\
  \ ℜ^(*pXp*)，对于 i=1,...,*p*，*d*[*i*]=±![$$ \\sqrt{1+\\left({\\lambda}_i/\\mu \\right)}\
  \ $$](img/522202_1_En_5_Chapter_TeX_IEq45.png)，且 *U*∈ℜ^(*pXp*) 是一个任意旋转矩阵。回顾一下，*λ*[1]>*λ*[2]>...>*λ*[*p*]>*λ*[*p*+1]≥...≥*λ*[*n*]\
  \ >0 是 *A* 的特征值，**ϕ**[*i*] 是对应于 *λ*[*i*] 的特征向量，使得 Φ=[**ϕ**[1] ... **ϕ**[*n*]] 是标准正交的。\n\
  \n### PF 收缩算法\n\nPF 收缩 PCA 算法的目标函数为\n\n![$$ J\\left({\\mathbf{w}}_k^i;{A}_k\\right)=-{{\\\
  mathbf{w}}_k^i}^T{A}_k{\\mathbf{w}}_k^i+\\mu \\left(\\sum \\limits_{j=1}^{i-1}{\\\
  left({{\\mathbf{w}}_k^j}^T{\\mathbf{w}}_k^i\\right)}²+\\frac{1}{2}{\\left({{\\mathbf{w}}_k^i}^T{\\\
  mathbf{w}}_k^i-1\\right)}²\\right) $$](img/522202_1_En_5_Chapter_TeX_IEq46.png),  (5.18)\n\
  \n其中 *μ* > 0 且 *i*=1,…,*p*。用于 PCA 的 PF 收缩自适应梯度下降算法为\n\n![$$ {W}_{k+1}={W}_k+{\\\
  eta}_k\\left({A}_k{W}_k-\\mu {W}_k UT\\left({W}_k^T{W}_k-{I}_p\\right)\\right) $$](img/522202_1_En_5_Chapter_TeX_IEq47.png),     (5.19)\n\
  \n其中 UT[⋅] 将其矩阵参数对角线以下的所有元素设置为零。*W*[k] 收敛于 *W*^*=[*d*[1]ϕ[1] *d*[2]ϕ[2] … *d*[*p*]ϕ[*p*]]*，其中\
  \ d*[*i*] *= ±*![$$ \\sqrt{1+\\left({\\lambda}_i/\\mu \\right)} $$](img/522202_1_En_5_Chapter_TeX_IEq48.png)。\n\
  \n### PF 加权算法\n\nPF 加权 PCA 算法的目标函数为\n\n![$$ J\\left({\\mathbf{w}}_k^i;{A}_k\\right)=-{c}_i{{\\\
  mathbf{w}}_k^i}^T{A}_k{\\mathbf{w}}_k^i+\\mu \\left(\\sum \\limits_{j=1,j\\ne i}^p{c}_j{\\\
  left({{\\mathbf{w}}_k^j}^T{\\mathbf{w}}_k^i\\right)}²+\\frac{c_i}{2}{\\left({{\\\
  mathbf{w}}_k^i}^T{\\mathbf{w}}_k^i-1\\right)}²\\right) $$](img/522202_1_En_5_Chapter_TeX_IEq49.png) (5.20)\n\
  \n其中 *c*[1]>*c*[2]>…>*c*[*p*]>0，*μ* > 0，且 *i*=1,…,*p*。用于 PCA 的 PF 加权自适应梯度下降算法为\n\
  \n![$$ {W}_{k+1}={W}_k+{\\eta}_k\\left({A}_k{W}_kC-\\mu {W}_kC\\left({W}_k^T{W}_k-{I}_p\\\
  right)\\right) $$](img/522202_1_En_5_Chapter_TeX_IEq50.png),     (5.21)\n\n其中 *C=diag*(*c*[1],…,*c*[*p*])。*W*[*k*]\
  \ 收敛于 *W*^(***)=[*d*[1]ϕ[1] *d*[2]ϕ[2] … *d*[*p*]ϕ[*p*]]，*其中 d*[*i*] = ±![$$ \\\
  sqrt{1+\\left({\\lambda}_i/\\mu \\right)} $$](img/522202_1_En_5_Chapter_TeX_IEq51.png)。\n\
  \n### PF 算法 Python 代码\n\n以下 Python 代码使用数据 `X[nDim,nSamples]` 实现了 PF PCA 算法：\n\n\
  ```\nfrom numpy import linalg as la\nnEA = 4 # 计算的 PCA 分量数量\nnEpochs  = 2\nA  =\
  \ np.zeros(shape=(nDim,nDim)) # 存储自适应相关矩阵\nW1 = 0.1 * np.ones(shape=(nDim,nEA))\
  \ # 所有算法的权重向量\nW2 = W1\nW3 = W1\nc = [2-0.3*k for k in range(nEA)]\nC = np.diag(c)\n\
  I  = np.identity(nEA)\nmu = 2\nfor epoch in range(nEpochs):\nfor iter in range(nSamples):\n\
  cnt = nSamples*epoch + iter\nx = X[:,iter]\nx = x.reshape(nDim,1)\nA = A + (1.0/(1\
  \ + cnt))*((np.dot(x, x.T)) - A)\n# 齐次梯度下降\nW1 = W1 + (1/(100 + cnt))*(A @ W1 -\
  \ mu * W1 @ ((W1.T @ W1) - I))\n# 收缩梯度下降\nW2 = W2 + (1/(100 + cnt))*(A @ W2 - mu\
  \ * W2 @ np.triu((W2.T @ W2) - I))\n# 加权梯度下降\nW3 = W3 + (1/(100 + cnt))*(A @ W3\
  \ @ C - mu * W3 @ C @ ((W3.T @ W3) - I))\n```\n\n## 5.6 AL1 算法\n\n\n\n### AL1 齐次算法\n\
  \n通过将非线性优化的增广拉格朗日方法应用于瑞利商准则，我们得到增广拉格朗日方法 1（AL1）齐次 PCA 算法的目标函数如下：\n\n![$$ J\\left({\\\
  mathbf{w}}_k^i;{A}_k\\right)=-{{\\mathbf{w}}_k^i}^T{A}_k{\\mathbf{w}}_k^i+\\alpha\
  \ \\left({{\\mathbf{w}}_k^i}^T{\\mathbf{w}}_k^i-1\\right)+2\\sum \\limits_{j=1,j\\\
  ne i}^p{\\beta}_j{{\\mathbf{w}}_k^j}^T{\\mathbf{w}}_k^i $$](img/522202_1_En_5_Chapter_TeX_IEq52.png),\n\
  \n![$$ +\\mu \\left(\\sum \\limits_{j=1,j\\ne i}^p{\\left({{\\mathbf{w}}_k^j}^T{\\\
  mathbf{w}}_k^i\\right)}²+\\frac{1}{2}{\\left({{\\mathbf{w}}_k^i}^T{\\mathbf{w}}_k^i-1\\\
  right)}²\\right) $$](img/522202_1_En_5_Chapter_TeX_IEq53.png)，     (5.22)\n\n其中\
  \ *i*=1,…,*p*，(*α*,*β*[1],*β*[2],…,*β*[p]) 是拉格朗日乘子，*μ* 是一个正的惩罚常数。目标函数 (5.22) 在约束条件\
  \ ![$$ {W}_k^T{W}_k={I}_p $$](img/522202_1_En_5_Chapter_TeX_IEq55.png) 下等价于 ![$$\
  \ - tr\\left({W}_k^T{A}_k{W}_k\\right) $$](img/522202_1_En_5_Chapter_TeX_IEq54.png)，该函数也作为\
  \ AL1 算法的能量函数。\n\n令 (5.22) 关于 ![$$ {\\mathbf{w}}_k^i $$](img/522202_1_En_5_Chapter_TeX_IEq56.png)\
  \ 的梯度等于 **0**，并利用约束条件 ![$$ {{\\mathbf{w}}_k^j}^T{\\mathbf{w}}_k^i={\\delta}_{ij}\
  \ $$](img/522202_1_En_5_Chapter_TeX_IEq57.png)，我们得到\n\n![$$ \\alpha ={{\\mathbf{w}}_k^i}^T{A}_k{\\\
  mathbf{w}}_k^i $$](img/522202_1_En_5_Chapter_TeX_IEq58.png) 和 ![$$ {\\beta}_j={{\\\
  mathbf{w}}_k^j}^T{A}_k{\\mathbf{w}}_k^i $$](img/522202_1_En_5_Chapter_TeX_IEq59.png)，其中\
  \ *j*=1,…,*p*，*j*≠*i*。     (5.23)\n\n将 (5.22) 梯度中的 (*α*,*β*[1],*β*[2],…,*β*[*p*])\
  \ 替换后，我们得到用于 PCA 的 AL1 齐次自适应梯度下降算法：\n\n![$$ {W}_{k+1}={W}_k+{\\eta}_k\\left(\\left({A}_k{W}_k-{W}_k{W}_k^T{A}_k{W}_k-\\\
  mu {W}_k\\left({W}_k^T{W}_k-{I}_p\\right)\\right)\\right. $$](img/522202_1_En_5_Chapter_TeX_IEq60.png)，     (5.24)\n\
  \n其中 *μ*>0，*I*[*p*] 是一个 *p*X*p* 的单位矩阵。当 *μ*=0 时，该算法与 OJA 算法 (5.5) 相同。我们可以证明 *W*[*k*]\
  \ 收敛于 *W*^(***)=Φ*DU*，其中 *D=*[*D*[1]|0]^(*T*)∈ℜ^(*n*X*p*)*，D*[1]*= diag*(*d*[1]*,...,d*[*p*])∈ℜ^(*p*X*p*)，*d*[*i*]*=*±1，*i=*1,...,*p*，而\
  \ *U*∈ℜ^(*p*X*p*) 是一个任意旋转矩阵。\n\n### AL1 收缩算法\n\nAL1 收缩 PCA 算法的目标函数为\n\n![$$ J\\\
  left({\\mathbf{w}}_k^i;{A}_k\\right)=-{{\\mathbf{w}}_k^i}^T{A}_k{\\mathbf{w}}_k^i+\\\
  alpha \\left({{\\mathbf{w}}_k^i}^T{\\mathbf{w}}_k^i-1\\right)+2\\sum \\limits_{j=1}^{i-1}{\\\
  beta}_j{{\\mathbf{w}}_k^j}^T{\\mathbf{w}}_k^i+\\mu \\left(\\sum \\limits_{j=1}^{i-1}{\\\
  left({{\\mathbf{w}}_k^j}^T{\\mathbf{w}}_k^i\\right)}²+\\frac{1}{2}{\\left({{\\mathbf{w}}_k^i}^T{\\\
  mathbf{w}}_k^i-1\\right)}²\\right) $$](img/522202_1_En_5_Chapter_TeX_IEq61.png)     (5.25)\n\
  \n其中 *i*=1,…,*p*。通过求解 (*α*,*β*[1],*β*[2],…,*β*[*i*–1])，并将其代入 (5.25) 的梯度中，我们得到\n\n\
  ![$$ {W}_{k+1}={W}_k+{\\eta}_k\\left(\\left({A}_k{W}_k-{W}_k UT\\left({W}_k^T{A}_k{W}_k\\\
  right)-\\mu {W}_k UT\\left({W}_k^T{W}_k-{I}_p\\right)\\right)\\right. $$](img/522202_1_En_5_Chapter_TeX_IEq62.png)，     (5.26)\n\
  \n其中 *μ*>0，UT[⋅] 将其矩阵参数中对角线以下的所有元素设置为零。当 *k*→∞ 时，*W*[*k*] 收敛于 *W*^(***)=[±**ϕ**[1]\
  \ ±**ϕ**[2] … ±**ϕ**[*p*]]。\n\n### AL1 加权算法\n\nAL1 加权 PCA 算法的目标函数为\n\n![$$ J\\left({\\\
  mathbf{w}}_k^i;{A}_k\\right)=-{c}_i{{\\mathbf{w}}_k^i}^T{A}_k{\\mathbf{w}}_k^i+\\\
  alpha {c}_i\\left({{\\mathbf{w}}_k^i}^T{\\mathbf{w}}_k^i-1\\right)+2\\sum \\limits_{j=1,j\\\
  ne i}^p{\\beta}_j{c}_j{{\\mathbf{w}}_k^j}^T{\\mathbf{w}}_k^i $$](img/522202_1_En_5_Chapter_TeX_IEq63.png),\n\
  \n![$$ +\\mu \\left(\\sum \\limits_{j=1,j\\ne i}^p{c}_j{\\left({{\\mathbf{w}}_k^j}^T{\\\
  mathbf{w}}_k^i\\right)}²+\\frac{c_i}{2}{\\left({{\\mathbf{w}}_k^i}^T{\\mathbf{w}}_k^i-1\\\
  right)}²\\right) $$](img/522202_1_En_5_Chapter_TeX_IEq64.png)     (5.27)\n\n其中 *i*=1,…,*p*，(*α*,*β*[1],*β*[2],…,*β*[*p*])\
  \ 是拉格朗日乘子，*μ* 是一个正的惩罚常数。通过求解 (*α*,*β*[1],*β*[2],…,*β*[*p*])，并将其代入 (5.27) 的梯度中，我们得到\
  \ AL1 加权自适应梯度下降算法：\n\n![$$ {W}_{k+1}={W}_k+{\\eta}_k\\left(\\left({A}_k{W}_kC-{W}_k{CW}_k^T{A}_k{W}_k-\\\
  mu {W}_kC\\left({W}_k^T{W}_k-{I}_p\\right)\\right)\\right. $$](img/522202_1_En_5_Chapter_TeX_IEq65.png)，     (5.28)\n\
  \n其中 *μ*>0，*c*[1]>*c*[2]>…>*c*[*p*]>0，*C*=*diag*(*c*[1],…,*c*[*p*])。我们可以证明，当 *k*→∞\
  \ 时，*W*[*k*] 收敛于 *W*^(***)= [±**ϕ**[1] ±**ϕ**[2] … ±**ϕ**[*p*]]。\n\n### AL1 算法 Python\
  \ 代码\n\n以下 Python 代码实现了使用数据 `X[nDim,nSamples]` 的 AL1 PCA 算法：\n\n```\nfrom numpy\
  \ import linalg as la\nnEA = 4 # 计算的 PCA 分量数量\nnEpochs  = 2\nA  = np.zeros(shape=(nDim,nDim))\
  \ # 存储自适应相关矩阵\nW1 = 0.1 * np.ones(shape=(nDim,nEA)) # 所有算法的权重向量\nW2 = W1\nW3 = W1\n\
  c = [2-0.3*k for k in range(nEA)]\nC = np.diag(c)\nI  = np.identity(nEA)\nmu = 2\n\
  for epoch in range(nEpochs):\nfor iter in range(nSamples):\ncnt = nSamples*epoch\
  \ + iter\nx = X[:,iter]\nx = x.reshape(nDim,1)\nA = A + (1.0/(1 + cnt))*((np.dot(x,\
  \ x.T)) - A)\n# 齐次梯度下降\nW1 = W1 + (1/(100 + cnt))*(A @ W1 - W1 @ (W1.T @ A @ W1)\
  \ -mu * W1 @ ((W1.T\n@ W1) - I))\n# 收缩梯度下降\nW2 = W2 + (1/(100 + cnt))*(A @ W2 -\
  \ W2 @ np.triu(W2.T @ A @ W2) -mu * W2 @ np.triu\n((W2.T @ W2) - I))\n# 加权梯度下降\n\
  W3 = W3 + (1/(300 + cnt))*(A @ W3 @ C - W3 @ C @ (W3.T @ A @ W3) -mu * W3 @ C @\n\
  ((W3.T @ W3) - I))\n```\n\n## 5.7 AL2 算法\n\n### AL2 齐次算法\n\nAL2 目标函数可以从 AL1 齐次目标函数\
  \ (5.22) 推导得出，方法是将 (5.23) 中的 *α*,*β*[1],*β*[2],…,*β*[*p*] 代入 (5.22)：\n\n![$$ J\\\
  left({\\mathbf{w}}_k^i;{A}_k\\right)=-{{\\mathbf{w}}_k^i}^T{A}_k{\\mathbf{w}}_k^i+\\\
