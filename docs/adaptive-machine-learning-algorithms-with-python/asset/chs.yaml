  \n我使用了与第 8.1.1 节中对平稳数据所使用的相同 Python 代码。\n\n## 8.2 适应传入的数据漂移\n\n虽然检测非平稳数据的漂移很重要，但我们的算法能够快速适应数据漂移也同样重要。请参见图\
  \ 8-8 中*模拟数据*的示例，该数据在 500 个样本后突然变为不同的底层统计量。\n\n![](img/522202_1_En_8_Fig8_HTML.png)\n\
  \n图 8-8\n\n在 500 个样本后发生突变的非平稳多维模拟数据\n\n我使用了自适应最速下降算法 (6.8) 来计算主特征向量。自适应算法帮助我们适应这种突变，并重新计算底层的\
  \ PCA 统计量——在本例中，是数据的前两个主特征向量。见图 8-9。\n\n![](img/522202_1_En_8_Fig9_HTML.jpg)\n\n\
