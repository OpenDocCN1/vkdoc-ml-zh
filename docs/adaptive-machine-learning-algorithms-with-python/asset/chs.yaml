  ### AL1 加权算法


  AL1 加权 GEVD 算法的目标函数为


  ![$$ J\left({\mathbf{w}}_k^i;{A}_k,{B}_k\right)=-{c}_i{{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i+\alpha
