    ### 广义特征分解方法


    我们首先定义非自适应情况下的问题。三种广义特征值问题（*A*Φ=*B*ΦΛ、*AB*Φ=ΦΛ 和 *BA*Φ=ΦΛ，其中 *A* 和 *B* 是实对称 *n*×*n*
    矩阵，且 *B* 正定）均可通过将 *B* 进行 Cholesky 分解（*B*=*LL*^(*T*) 或 *B*=*U*^(*T*)*U*）简化为标准对称特征值问题。利用
    *B* = *LL*^(*T*)，我们可以将 *A*Φ=*B*ΦΛ 写为：


    (*L*^(−1)*AL*^(−*T*))(*L*^(*T*)Φ) = (*L*^(*T*)Φ)Λ 或 *C*Ψ = ΨΛ。     (7.4)


    这里 *C* 是对称矩阵 *C* = *L*^(–1) *A L*^(–*T*)，且 Ψ = *L*^(*T*) Φ。表 7-1 总结了三种类型的问题如何简化为标准形式
    *C*Ψ=ΨΛ，以及如何从简化问题的特征向量 Ψ 恢复原始问题的特征向量 Φ。


    **表 7-1**


    广义特征分解问题的类型及其解


    | 问题类型 | *B* 的分解 | 简化形式 | 广义特征向量 |

    | --- | --- | --- | --- |

    | *AΦ*=*BΦ*Λ | *B* = *LL*^(*T*) | *C* = *L*^(–1) *A L*^(–*T*) | Φ = *L*^(–*T*)
    Ψ |

    | *B* = *U*^(*T*)*U* | *C* = *U*^(–*T*) *A U*^(–1) | Φ = *U*^(–1) Ψ |

    | *ABΦ*=ΦΛ | *B* = *LL*^(*T*) | *C* = *L*^(*T*) *A L* | Φ= *L*^(–*T*) Ψ |

    | *B* = *U*^(*T*)*U* | *C* = *U A U*^(*T*) | Φ = *U*^(–1) Ψ |

    | *BAΦ*=ΦΛ | *B* = *LL*^(*T*) | *C* = *L*^(*T*) *A L* | Φ = *L* Ψ |

    | *B* = *U*^(*T*)*U* | *C* = *U A U*^(*T*) | Φ = *U*^(*T*) Ψ |


    在自适应情况下，我们可以扩展这些技术：首先（自适应地）为每个样本 *B*[*k*] 计算一个矩阵 *W*[*k*]，其中当 *k→*∞ 时，*W*[*k*]
    以概率 1 (w.p.1) 趋近于 *B* 的逆 Cholesky 分解 *L*^(–1)。此处可考虑第 3 章中的任意算法。接下来，我们考虑一个序列 {![$$
    {C}_k={W}_{k-1}{A}_k{W}_{k-1}^T $$](img/522202_1_En_7_Chapter_TeX_IEq4.png)}，用于自适应地计算矩阵
    *V*[*k*]，其中当 *k→*∞ 时，*V*[*k*] 以概率 1 趋近于 lim[*k→∞*]*E*[*C*[*k*]] 的特征向量矩阵。为此，可考虑第
    5 章和第 6 章中的任意算法。结合这两个步骤，得到 *W*[*k*]*V*[*k*]，已证明当 *k→*∞ 时，该乘积以概率 1 收敛于 Φ。因此，这两个步骤可以*同时*进行，并强收敛于特征向量矩阵
    Φ。该方法的完整描述见 [Chatterjee et al. May 97, Mar 97]。在本章中，我将提供多种新技术来解决自适应情况下的广义特征分解问题。


    ### 本章概要


    在第 7.2 节中，我将列出推导自适应广义特征分解算法的目标函数。在第 7.3、7.4 和 7.5 节中，我将分别基于 OJA 目标函数，介绍齐次、收缩和加权变体的自适应算法。在第
    7.6、7.7 和 7.8 节中，我将分析均方误差 (XU) 目标函数的相同三种变体，并给出收缩情况下的收敛性证明。在第 7.9、7.10 和 7.11 节中，我将讨论基于惩罚函数
    (PF) 目标函数推导的算法。在第 7.12、7.13 和 7.14 节中，我将考虑增广拉格朗日 1 (AL1) 目标函数；在第 7.15、7.16 和 7.17
    节中，我将介绍增广拉格朗日 2 (AL2) 目标函数。在第 7.18、7.19 和 7.20 节中，我将介绍信息论 (IT) 准则；在第 7.21、7.22
    和 7.23 节中，我将描述瑞利商 (RQ) 准则。在第 7.24 节中，我将讨论实验结果，并在第 7.25 节中给出结论。


    ## 7.2 算法与目标函数


    与 PCA 算法（第 5 章）类似，在本章中，我将介绍几种用于广义特征向量计算的自适应算法。我考虑两个已中心化为零均值的渐近平稳序列 {**x**[*k*]∈ℜ^(*n*)}
    和 {**y**[*k*]∈ℜ^(*n*)}。我们可以通过其瞬时值 {![$$ {\mathbf{x}}_k{\mathbf{x}}_k^T $$](img/522202_1_En_7_Chapter_TeX_IEq5.png),![$$
    {\mathbf{y}}_k{\mathbf{y}}_k^T $$](img/522202_1_En_7_Chapter_TeX_IEq6.png)} 或通过公式
    (2.3) 计算的运行平均值来表示 {**x**[*k*],**y**[*k*]} 对应的在线相关矩阵 {*A*[*k*],*B*[*k*]}。然而，如果
    {**x**[*k*],**y**[*k*]} 是非平稳的，我们可以通过公式 (2.5) 从数据样本 {**x**[*k*],**y**[*k*]} 构建相关矩阵
    {*A*[*k*],*B*[*k*]}。


    ### 自适应 GEVD 算法的目标函数总结


    遵循第 2.​3 节的方法论，对于每种算法，我将描述目标函数并推导其自适应算法。目标函数包括：


    *   Oja 目标函数 (OJA)，

    *   Xu 均方误差目标函数 (XU)，

    *   惩罚函数法 (PF)，

    *   增广拉格朗日法 1 (AL1)，

    *   增广拉格朗日法 2 (AL2)，

    *   信息论准则 (IT)，以及

    *   瑞利商准则 (RQ)。


    与 PCA 情况相同，从每个目标函数可以推导出三种算法变体，分别是：


    1.  *齐次自适应规则：* 这些算法不计算特征值递减的归一化广义特征向量。

    2.  *收缩自适应规则：* 在此，我们生成特征值递减的单位广义特征向量。然而，训练是顺序进行的，这使得并行实现的训练过程更加困难。

    3.  *加权自适应规则：* 这些算法通过对每个广义特征向量使用不同的标量权重而获得，使得它们归一化并按特征值递减的顺序排列。

