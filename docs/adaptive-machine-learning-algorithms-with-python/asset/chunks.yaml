    ### Anomaly Detection of Streaming Data


    A simple yet powerful algorithm to detect anomalies in data is to calculate the
    median and compare the current value against the median of the data. Figure [2-4](#522202_1_En_2_Chapter.xhtml#Fig4)
    shows streaming data [Yahoo Research Webscope S5 Data] containing occasional anomalous
    values. We adaptively computed the median with algorithm ([2.20](#522202_1_En_2_Chapter.xhtml#Par57))
    and compared it against the data to detect anomalies. Here the data samples are
