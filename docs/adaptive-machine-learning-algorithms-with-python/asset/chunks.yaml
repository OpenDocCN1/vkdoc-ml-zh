- fmt: '### Adaptive Algorithms


    [Chatterjee *Neural Networks*, Vol. 18, No. 2, pp. 145-149, March 2005].


    I have itemized the algorithms based on their inventors or on the objective functions
    from which they are derived. All algorithms are of the form


    `w[k+1] = w[k] + η[k] * h(w[k], A[k])`, (4.2)


    where the function `h(w[k], A[k])` follows certain continuity and regularity properties
    [Ljung 77,92], and `η[k]` is a decreasing gain sequence. The term `h(w[k]; A[k])`
    for various adaptive algorithms are


    *   OJA: `A_k w_k - w_k w_k^T A_k w_k`

    *   RQ: `(1 / (w_k^T w_k)) * (A_k w_k - w_k * ((w_k^T A_k w_k) / (w_k^T w_k)))`

    *   OJAN: `A_k w_k - w_k * ((w_k^T A_k w_k) / (w_k^T w_k)) = w_k^T w_k * RQ`

    *   LUO: `w_k^T w_k * (A_k w_k - w_k * ((w_k^T A_k w_k) / (w_k^T w_k))) = (w_k^T
    w_k)^2 * RQ`

    *   IT: `(A_k w_k) / (w_k^T A_k w_k) - w_k = (1 / (w_k^T A_k w_k)) * OJA`

    *   XU: `2 A_k w_k - w_k w_k^T A_k w_k - A_k w_k w_k^T w_k = OJA - A_k w_k (w_k^T
    w_k - 1)`

    *   PF: `A_k w_k - μ w_k (w_k^T w_k - 1)`

    *   OJA+: `A_k w_k - w_k w_k^T A_k w_k - w_k (w_k^T w_k - 1) = OJA - w_k (w_k^T
    w_k - 1)`

    *   AL1: `A_k w_k - w_k w_k^T A_k w_k - μ w_k (w_k^T w_k - 1)`

    *   AL2: `2 A_k w_k - w_k w_k^T A_k w_k - A_k w_k w_k^T w_k - μ w_k (w_k^T w_k
    - 1)`


    Here IT denotes information theory, and AL denotes augmented Lagrangian. Although
    most of these algorithms are known, the new AL1 and AL2 algorithms are derived
    from an augmented Lagrangian objective function discussed later in this chapter.


    ### Objective Functions


    Conforming to my proposed methodology in Chapter 2.2, all algorithms mentioned
    before are derived from objective functions. Some of these objective functions
    are


    *   Objective function for the OJA algorithm,

    *   Least mean squared error criterion,

    *   Rayleigh quotient criterion,

    *   Penalty function method,

    *   Information theory criterion, and

    *   Augmented Lagrangian method.


    ## 4.3 OJA Algorithm


    This algorithm was given by Oja et al. [Oja 85, 89, 92]. Intuitively, the OJA
    algorithm is derived from the Rayleigh quotient criterion by representing it as
    a Lagrange function, which minimizes `-w_k^T A_k w_k` under the constraint `w_k^T
    w_k = 1`.


    ### Objective Function


    In terms of the data samples `x[k]`, the objective function for the OJA algorithm
    can be written as


    `J(w_k; x_k) = -|| x_k^T (x_k - w_k w_k^T x_k) ||^2` (4.3)


    If we represent the data correlation matrix `A[k]` by its instantaneous value
    `x_k x_k^T`, then (4.3) is equivalent to the following objective function:


    `J(w_k; A_k) = -|| A_k^(1/2) (I - w_k w_k^T) A_k^(1/2) ||_F^2`. (4.4)


    We see from (4.4) that the objective function `J(w[k]; x[k])` represents the difference
    between the sample `x[k]` and its transformation due to a matrix `w_k w_k^T`.
    In neural networks, this transform is called *auto-association*² [Haykin 94].
    Figure 4-2 shows a two-layer auto-associative network.


    **Figure 4-2** Two-layer linear auto-associative neural network for the first
    principal eigenvector


    ### Adaptive Algorithm


    The gradient of (4.4) with respect to `w[k]` is


    `∇_{w_k} J(w_k; A_k) = -4 A_k (A_k w_k - w_k w_k^T A_k w_k)`.


    The adaptive gradient descent OJA algorithm for PCA is


    `w_{k+1} = w_k - η_k A_k^{-1} ∇_{w_k} J(w_k; A_k) = w_k + η_k (A_k w_k - w_k w_k^T
    A_k w_k)`, (4.5)


    where `η[k]` is a small decreasing constant.


    The Python code for this algorithm with multidimensional data `X[nDim,nSamples]`
    is


    ```python

    A = np.zeros(shape=(nDim,nDim)) # stores adaptive correlation matrix

    w = 0.1 * np.ones(shape=(nDim,11)) # weight vectors of all algorithms

    for epoch in range(nEpochs):

    for iter in range(nSamples):

    cnt = nSamples*epoch + iter

    x = X[:,iter]

    x = x.reshape(nDim,1)

    A = A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - A)

    # OJA Algorithm

    v = w[:,0].reshape(nDim, 1)

    v = v + (1/(100+cnt))*(A @ v - v @ (v.T @ A @ v))

    w[:,0] = v.reshape(nDim)

    ```


    ### Rate of Convergence


    The convergence time constant for the principal eigenvector `ϕ[1]` is `1/λ[1]`
    and for the minor eigenvectors `ϕ[i]` is `1/(λ[1]–λ[i])` for `i=2,…,n`. The time
    constants are dependent on the eigen-structure of the data correlation matrix
    `A`.


    ## 4.4 RQ, OJAN, and LUO Algorithms


    ### Objective Function


    These three algorithms are different derivations of the following Rayleigh quotient
    objective function:


    `J(w_k; A_k) = - ( (w_k^T A_k w_k) / (w_k^T w_k) )`. (4.6)


    These algorithms were initially presented by Luo et al. [Luo et al. 97; Taleb
    et al. 99; Cirrincione et al. 00] and Oja et al. [Oja et al. 92]. Variations of
    the RQ algorithm have been presented by many practitioners [Chauvin 89; Sarkar
    et al. 89; Yang et al. 89; Fu and Dowling 95; Taleb et al. 99; Cirrincione et
    al. 00].'
