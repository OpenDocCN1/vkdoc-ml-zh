    The objective function for the RQ weighted GEVD algorithm is


    ![$$ J\left({\mathbf{w}}_k^i;{A}_k,{B}_k\right)=-{c}_i\frac{{{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i}{{{\mathbf{w}}_k^i}^T{B}_k{\mathbf{w}}_k^i}+\alpha
    {c}_i\left({{\mathbf{w}}_k^i}^T{B}_k{\mathbf{w}}_k^i-1\right)+2\sum \limits_{j=1}^i{\beta}_j{c}_j{{\mathbf{w}}_k^j}^T{B}_k{\mathbf{w}}_k^i
    $$](images/522202_1_En_7_Chapter/522202_1_En_7_Chapter_TeX_IEq99.png),     (7.56)


    for `i=1,…,p`, where (`α`, `β[1]`, `β[2]`, …, `β[p]`) are Lagrange multipliers.
    By solving (`α`, `β[1]`, `β[2]`, …, `β[k]`) and replacing them in the gradient
    of (7.56), we obtain the adaptive algorithm:


    ![$$ {W}_{k+1}={W}_k+{\eta}_k\left({A}_k{W}_kC-{B}_k{W}_k{CW}_k^T{A}_k{W}_k\right)\kern0.5em
    \mathrm{DIAG}{\left({W}_k^T{B}_k{W}_k\right)}^{-1} $$](images/522202_1_En_7_Chapter/522202_1_En_7_Chapter_TeX_IEq100.png).     (7.57)


    ### RQ Algorithm Python Code


    The following Python code works with data `X[nDim,nSamples]` and `Y[nDim,nSamples]`:


    ```python

    from numpy import linalg as la

    A  = np.zeros(shape=(nDim,nDim)) # stores adaptive correlation matrix

    B  = np.zeros(shape=(nDim,nDim)) # stores adaptive correlation matrix

    W2 = 0.1 * np.ones(shape=(nDim,nEA)) # weight vectors of all algorithms

    W3 = W2

    c = [2.6-0.3*k for k in range(nEA)]

    C = np.diag(c)

    I  = np.identity(nDim)

    for epoch in range(nEpochs):

    for iter in range(nSamples):

    cnt = nSamples*epoch + iter

    # Update data correlation matrices A,B with current data vectors x,y

    x = X[:,iter]

    x = x.reshape(nDim,1)

    A = A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - A)

    y = Y[:,iter]

    y = y.reshape(nDim,1)

    B = B + (1.0/(1 + cnt))*((np.dot(y, y.T)) - B)

    # Deflated Gradient Descent

    W2 = W2 + (1/(20 + cnt))*(A @ W2 - B @ W2 @ np.triu(W2.T @ A @ W2)) \

    inv(np.diag(np.diagonal(W2.T @ B @ W2)))

    # Weighted Gradient Descent

    W3 = W3 + (1/(300 + cnt))*(A @ W3 @ C - B @ W3 @ C @ (W3.T @ A @ W3)) \

    @ inv(np.diag(np.diagonal(W3.T @ B @ W3)))

    ```


