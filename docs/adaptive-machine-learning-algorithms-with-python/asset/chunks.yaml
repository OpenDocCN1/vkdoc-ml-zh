    W3 = W3 + (1/(300 + cnt))*(A @ W3 @ C - 0.5 * B @ W3 @ C @ \(W3.T @ A @ W3) -
    0.5 *

    A @ W3 @ C @ (W3.T @ B @ W3))

    ```


