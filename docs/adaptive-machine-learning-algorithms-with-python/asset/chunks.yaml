    *谨以此书献给我的父亲 Basudev Chatterjee，以及所有指引和激励我的老师和导师。*


    前言


    本书介绍了在机器学习、数据可视化和数据分析中具有重要价值的几类流数据问题。书中提供了多种自适应算法，用于解决流数据向量或矩阵上的这些问题。基于复杂神经网络的应用已十分普遍，计算能力也在呈指数级增长，那么为什么我们还需要自适应计算呢？


    在数据量大、数据维度高、数据随时间变化且底层统计特性不断改变，并且我们没有足够的存储、计算能力和带宽来低延迟处理数据的环境中，自适应算法至关重要。边缘设备上的计算就是这样一个环境。


    由于蜂窝边缘数十亿设备的快速普及，以及这些设备上机器学习和数据分析应用的指数级增长，我们迫切需要在这些设备上管理以下方面：


    *   大规模计算时的功耗

    *   输入的非平稳性和传入数据的漂移

    *   设备上的计算延迟

    *   设备的内存和带宽


    [2021 年 Gartner 关于边缘计算的报告](https://www.itweb.co.za/content/lwrKx73KXLL7mg1o) [Stratus
    Technologies, 2021] 指出，由云和 5G 的采用所推动的基于设备的计算增长，将要求我们优先考虑并构建边缘计算框架。


    在这些环境中存在以下约束：


    *   数据无法立即批量处理，需要即时使用。我们有一个向量或矩阵的流序列作为算法的输入。

    *   数据随时间变化。换句话说，数据是非平稳的，会导致输入特征的显著漂移，从而使机器学习模型随着时间的推移不再有效。

    *   数据量和维度很大，我们没有设备内存、带宽或功率来存储或将数据上传到云端。


    在这些应用中，我们使用自适应算法来管理设备的功耗、内存和带宽，以便我们能够维持预训练模型的准确性。一些用例包括：


    1.  计算传入数据的特征漂移，并提前检测训练-服务偏差 [Kaz 等人，2021]。

    2.  适应传入数据的漂移，并计算最适合数据的特征。

    3.  计算传入数据中的异常，以便模型使用良好、干净的数据。

    4.  将传入数据压缩为特征，用于创建新模型。


    在第 8 章中，我结合真实世界的数据，通过自适应算法讨论了这些问题的解决方案。


    ## 检测特征漂移


    请看一个例子，其中实时数据 [Vinicius Souza 等人，2020] 存在特征的渐进漂移。在实时环境中，观测数据的底层分布会发生变化。这些数据统计特性的变化称为*漂移*。当统计特性的变化是平滑的时，称为*渐进漂移*。图
    1 显示了多元数据各分量幅度随时间缓慢变化，呈现出渐进漂移。


    尽早检测到这些漂移分量非常重要，这样我们就可以更新机器学习模型以保持性能。请注意，数据的基线统计信息是事先未知的。


    ![](img/522202_1_En_BookFrontmatter_Fig1_HTML.png)


    图 1


    数据分量随时间呈现渐进漂移


    我使用了一种自适应算法（见第 5 章）来计算数据的[主成分](https://en.wikipedia.org/wiki/Principal_component_analysis)
    [主成分分析，维基百科]，并从中推导出一个度量指标。图 2 显示该度量指标并未收敛到其统计值（理想值为 1），而是向 0 发散。这可以快速检测到特征漂移，从而使边缘设备能够更新机器学习模型。


    ![](img/522202_1_En_BookFrontmatter_Fig2_HTML.png)


    图 2


    基于自适应主成分的度量指标在实时过程中早期检测到数据漂移


    图中检测度量指标的下行斜率表明了特征的渐进漂移。


    ## 适应漂移


    在另一种类型的漂移中，数据的统计特性会发生突变。图 3 显示了模拟的多维数据，在 500 个样本后，其底层统计特性发生了突变。


    ![](img/522202_1_En_BookFrontmatter_Fig3_HTML.png)


    图 3


    模拟数据在 500 个样本后统计特性发生突变


    自适应算法帮助我们适应这种突变，并重新计算底层统计特性，在本例中，即数据的前两个主特征向量（见第 6 章）。图 4 中的理想值为 1。当数据在 500 个样本后发生突变时，该值下降并迅速恢复至
    1。


    ![](img/522202_1_En_BookFrontmatter_Fig4_HTML.png)


    图 4


    主特征向量适应突变的数据


    ## 我的方法


    ### 自适应算法与最佳实践


    在本书中，我提供了超过 50 个自适应算法的示例来解决实际问题。我还提供了为不同用例选择合适算法的最佳实践。我将这些问题表述为矩阵计算，其中底层矩阵是未知的。我假设整个数据并非一次性可用。相反，我有一系列随机矩阵或向量，我从中计算矩阵函数，而无需知道这些矩阵。当每个样本被呈现给算法时，矩阵函数被自适应地计算出来。


    1.  我的算法处理每个传入样本 **x**[*k*]，使得在任何时刻 *k*，所有当前可用的数据都被考虑在内。

    2.  对于每个样本，算法估计所需的矩阵函数，并且其估计具有已知的统计特性。

    3.  这些算法能够适应底层系统的变化，因此对于每个样本 **x**[*k*]，我获得的是过程的当前状态，而不是所有样本的平均值（即，我可以处理平稳和非平稳数据）。


