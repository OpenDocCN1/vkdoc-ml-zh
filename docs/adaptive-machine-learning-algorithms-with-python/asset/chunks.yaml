    (gi.T @ A @ gi)*(wi.T @ gi)))

    a3 = np.asscalar(- 2 * (gi.T @ A @ gi) @ (gi.T @ gi))

    c  = np.array([a3, a2, a1, a0])

    rts = np.roots(c)

    rs = np.zeros(3)

    r  = np.zeros(3)

    J  = np.zeros(3)

    cnt1 = 0

    for k in range(3):

    if np.isreal(rts[k]):

    re = np.real(rts[k])

    rs[cnt1] = re

    r = W2[:,i] - re * G[:,i]

    J[cnt1] = np.asscalar(-2*(r.T @ A @ r) + (r.T @ A @ r) * \

    (r.T @ r) + (r.T @ M @ r))

    cnt1 = cnt1 + 1

    yy = min(J)

    iyy = np.argmin(J)

