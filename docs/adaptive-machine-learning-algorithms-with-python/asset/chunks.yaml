    {\mathbf{w}}_k\left({\mathbf{w}}_k^T{\mathbf{w}}_k-1\right)\right) $$](images/522202_1_En_4_Chapter/522202_1_En_4_Chapter_TeX_IEq38.png),     (4.17)


    where *μ* > 0\. Note that ([4.17](#522202_1_En_4_Chapter.xhtml#Par101)) is the
    same as OJA+ algorithm for *μ* =1.


    The Python code for this algorithm with multidimensional data `X[nDim,nSamples]`
    is


    ```

    mu = 10

    A = np.zeros(shape=(nDim,nDim)) # stores adaptive correlation matrix

    w = 0.1 * np.ones(shape=(nDim,11)) # weight vectors of all algorithms

    for epoch in range(nEpochs):

    for iter in range(nSamples):

    cnt = nSamples*epoch + iter

    x = X[:,iter]

    x = x.reshape(nDim,1)

    A = A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - A)

    # AL1 Algorithm

    v = w[:,8].reshape(nDim, 1)

    v = v + (1/(50+cnt))*(A@v - v@(v.T @A @ v) - mu* v@ (v.T@v - 1))

    w[:,8] = v.reshape(nDim)

    ```


    ### Rate of Convergence


    The convergence time constant for the principal eigenvector **ϕ**[1] is 1/(*λ*[1] + *μ*)
    and for the minor eigenvectors **ϕ**[*i*] is 1/(*λ*[1]–*λ*[*i*]) for *i*=2,…,*n*.
    The time constants are dependent on the eigen-structure of the data correlation
    matrix *A*.


    ### Upper Bound of η[k]


    There exists a uniform upper bound for η[k] such that **w**[k] is uniformly bounded.
    If ‖**w**[k]‖² ≤ α+1 and *θ* is the largest eigenvalue of A[k], then ‖**w**[k+1]‖
    ² ≤ ‖**w**[k]‖² if


    ![$$ {\eta}_k&lt;\frac{1}{\left(\mu +\theta \right)\alpha }. $$](images/522202_1_En_4_Chapter/522202_1_En_4_Chapter_TeX_Equj.png)


    ## 4.9 Augmented Lagrangian 2 Algorithm


    ### Objective Function


    The objective function for the augmented Lagrangian 2 (AL2) algorithm is


    ![$$ J\left({\mathbf{w}}_k;{A}_k\right)=-{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k+{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k\left({\mathbf{w}}_k^T{\mathbf{w}}_k-1\right)+\frac{\mu
    }{2}{\left({\mathbf{w}}_k^T{\mathbf{w}}_k-1\right)}^2 $$](images/522202_1_En_4_Chapter/522202_1_En_4_Chapter_TeX_IEq39.png)     (4.18)


    The objective function *J*(**w**[*k*];*A*[*k*]) is an application of the augmented
    Lagrangian method on the Rayleigh quotient criterion ([4.1](#522202_1_En_4_Chapter.xhtml#Par7)).
    It uses the XU objective function and also uses the penalty function method ([4.14](#522202_1_En_4_Chapter.xhtml#Par87)),
    where *μ* is a positive penalty constant.'
