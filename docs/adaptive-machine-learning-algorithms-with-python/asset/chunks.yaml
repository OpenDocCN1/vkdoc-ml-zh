    ![$$ {A}_k=\frac{1}{k}\sum \limits_{i=1}^k{\beta}^{k-i}{\mathbf{x}}_i{\mathbf{x}}_i^T
    $$](images/522202_1_En_3_Chapter/522202_1_En_3_Chapter_TeX_IEq4.png).     (3.1)


    Here **x**[*k*] is an observation vector at time *k* and 0<*β*≤1 is a forgetting
    factor used for non-stationary sequences. If the data is stationary, the asymptotic
    correlation matrix *A* is


    ![$$ A=\underset{k\to \infty }{\lim }E\left[{A}_k\right] $$](images/522202_1_En_3_Chapter/522202_1_En_3_Chapter_TeX_IEq5.png).     (3.2)


    ### Objective Function


    Following the methodology described in Section [1.​4](#522202_1_En_1_Chapter.xhtml#Sec19),
    I present the algorithm by first showing an objective function *J*, whose minimum
    with respect to matrix *W* gives us the square root of the asymptotic data correlation
    matrix *A*. The objective function is


    ![$$ J(W)={\left\Vert A-{W}^TW\right\Vert}_F^2 $$](images/522202_1_En_3_Chapter/522202_1_En_3_Chapter_TeX_IEq6.png).     (3.3)


