- fmt: '### Problems with Conventional Non-Adaptive Approaches


    The conventional approach for evaluating matrix functions requires the computation
    of the matrix after collecting all samples and then the application of a numerical
    procedure. There are two problems with this approach.


    1. The dimension of the samples may be large so that even if all the samples are
    available, performing the matrix algebra may be difficult or may take a prohibitively
    large number of computational resources and memory.

    2. The matrix functions evaluated by conventional schemes cannot adapt to small
    changes in the data (e.g., a few incoming samples). If the matrix functions are
    estimated by conventional methods from *K* (finite) samples, then for each additional
    sample, all of the computation must be repeated.


    These deficiencies make the conventional schemes inefficient for real-time applications.


    ### Computationally Simple


    My approach is to use computationally simple adaptive algorithms. For example,
    given a sequence of random vectors `{x[k]}`, a well-known algorithm for the principal
    eigenvector evaluation uses the update rule `w[k+1] = w[k] + η (x[k]x[k]^T – w[k]w[k]^T
    x[k]x[k]^T w[k])`, where `η` is a small positive constant. In this algorithm,
    for each sample `x[k]` the update procedure requires simple matrix-vector multiplications,
    yet the vector `w[k]` converges quickly to the principal eigenvector of the data
    correlation matrix. Clearly, this can be easily implemented in CPUs on devices
    with low memory and power usage.


    The objective of this book is to present a variety of [neuromorphic](https://en.wikipedia.org/wiki/Neuromorphic_engineering)
    adaptive algorithms for matrix algebra problems. Neuromorphic algorithms work
    by mimicking the physics of the human neural systems using networks, where activation
    by neurons propagate to other neurons in a cascading chain.


    ### Matrix Functions I Solve


    The matrix algebra functions that I compute adaptively include


    - Normalized mean, median

    - LU decomposition (square root), inverse square root

    - Eigenvector/eigenvalue decomposition (EVD)

    - Generalized EVD

    - Singular value decomposition (SVD)

    - Generalized SVD


    For each matrix function, I will discuss practical use cases in machine learning
    and data analytics and support them with experimental results.


    ### Common Methodology to Derive Adaptive Algorithms


    Another contribution of this book is the presentation of a common methodology
    to derive each adaptive algorithm. For each matrix function and every adaptive
    algorithm, I present a scalar unconstrained objective function `J(W; A)` whose
    minimizer `W*` is the desired matrix function of `A`. From this objective function
    `J(W; A)`, I derive the adaptive algorithm such as `W[k+1] = W[k] – η ∇[W] J(W[k];
    A)` by using standard techniques of optimization (for example, gradient descent).
    I then speed up these adaptive algorithms by using statistical methods. Note that
    this helps practitioners create new adaptive algorithms for their use cases.


    In summary, the book starts with a common framework to derive adaptive algorithms
    and then uses the framework for each category of streaming data problems starting
    with the adaptive median to complex principal components and discriminant analysis.
    I present practical problems in each category and derive the algorithms to solve
    them. The final chapter solves critical edge computation problems for time-varying,
    non-stationary data with minimal compute, memory, latency, and bandwidth. I also
    provide the code [Chatterjee GitHub] for all algorithms discussed here.


    ## GitHub


    All simulations and implementation code by chapters are published in the public
    GitHub:


    [`https://github.com/cchatterj0/AdaptiveMLAlgorithms`](https://github.com/cchatterj0/AdaptiveMLAlgorithms)


    The GitHub page contains the following items:


    - Python code for all chapters starting with Chapter [2](#522202_1_En_2_Chapter.xhtml)

    - MATLAB simulation code in a separate directory

    - Data for all implementation code

    - Proofs of convergence for some of the algorithms


    ## Acknowledgments


    I want to thank my professor and mentor Vwani Roychowdhury for guiding me through
    my Ph.D. thesis, where I first created much of the research presented in this
    book. Vwani taught me how to research, write, and present this material in the
    many papers we wrote together. He also inspired me to continue this research and
    eventually write this book. I could not have done it without his inspiration,
    help, and guidance. I sincerely thank Vwani for being my teacher and mentor.


    ## About the Author


    ## About the Technical Reviewer'
