- fmt: '### Principal Components


    [Principal component analysis](https://en.wikipedia.org/wiki/Principal_component_analysis)
    (PCA) is a well-studied example of the data representation model. From the perspective
    of *classical statistics*, PCA is an analysis of the covariance structure of multivariate
    data {`x[k]`}. Let `y[k] = [y[k1], …, y[kp]]^T` be the components of the PCA-transformed
    data. In this representation, the first principal component `y[k1]` is a one-dimensional
    linear subspace where the variance of the projected data is maximal. The second
    principal component `y[k2]` is the direction of maximal variance in the space
    orthogonal to `y[k1]` and so on.


    It has been shown that the optimal weight matrix `W[k]` is the eigenvector matrix
    of the correlation of the zero-mean input process {`x[k]`}. Let `AΦ = ΦΛ` be the
    *eigenvector decomposition (EVD)* of `A`, where `Φ` and `Λ` are respectively the
    eigenvector and eigenvalue matrices. Here `Λ = diag(λ[1], …, λ[n])` is the diagonal
    eigenvalue matrix with `λ[1] ≥ … ≥ λ[n] > 0` and `Φ` is orthonormal. We denote
    `Φ[p] ∈ ℜ^(n×p)` as the matrix whose columns are the first `p` principal eigenvectors.
    Then optimal `W[k] = Φ[p]`.


    There are three variations of PCA that are useful in applications.


    1.  When `p = n`, the `n` components of `y[k]` are ordered according to maximal
    to minimal variance. This is the component analyzer that is used for *data analysis*.


    2.  When `p < n`, the `p` components of `y[k]` have maximal information for *data
    compression*.


    3.  For `p < n`, the `n – p` components of `y[k]` with minimal variance can be
    regarded as abnormal signals and reconstructed as `(I[n] – Φ[p]Φ[p]^T)x[k]` to
    obtain a *novelty filter*.


    Figure [1-4](#522202_1_En_1_Chapter.xhtml#Fig4) shows the correlation matrices
    of the original and PCA-transformed random normal data. The original data is highly
    correlated as shown by the colors on all axes. The PCA-transformed data is uncorrelated
    with diagonal blocks only and highest representation value for component 1 (top
    left corner block) and decreasing thereafter.


    ![](images/522202_1_En_1_Chapter/522202_1_En_1_Fig4_HTML.jpg)


    Figure 1-4


    Original correlated data is uncorrelated by PCA projection


    The Python code for the PCA projected data from original dataset `X[nDim, nSamples]`
    is


    ```

    from scipy.linalg import eigh

    # Compute data correlation matrix

    corX = (X @ X.T) / nSamples

    # generate the PCA transformed data

    eigvals, eigvecs = eigh(corX)

    EstV = np.fliplr(eigvecs)

    Y = EstV.T @ X

    corY = (Y @ Y.T)/nSamples

    # plot the PCA transformed data

    import seaborn as sns

    plt.figure(figsize=(10, 5))

    plt.rcParams.update({''font.size'': 16})

    plt.subplot(1, 2, 1)

    sns.heatmap(corX, linewidth=0.5, linecolor="green", cmap=''RdBu'', cbar=False)

    plt.title("Original data")

    plt.subplot(1, 2, 2)

    sns.heatmap(corY, linewidth=0.5, linecolor="green", cmap=''hot'', cbar=False)

    plt.title("PCA Transformed")

    plt.show()

    ```


    ### Linear Discriminant Features


    Linear discriminant analysis (LDA) [linear discriminant analysis, Wikipedia] creates
    features from data from multiple classes such that the transformed representation
    `y[k]` has the most class separability. Given a data `x[k]` and the corresponding
    classes `c[k]`, we can calculate the following matrices:


    *   data correlation matrix `B = E(x[k]x[k]^T)`,

    *   cross correlation matrix `M = E(x[k]c[k]^T)`,

    *   and `A = MM^T`.


    It is well known that the linear transform `W[k]` (Eq [1.1](#522202_1_En_1_Chapter.xhtml#Par16))
    is the *generalized eigen-decomposition* (GEVD) [generalized eigenvector, Wikipedia]
    of `A` with respect to `B`. Here `AΨ = BΨΔ` where `Ψ` and `Δ` are respectively
    the generalized eigenvector and eigenvalue matrices. Furthermore, `Ψ[p] ∈ ℜ^(n×p)`
    is the matrix whose columns are the first `p ≤ n` principal generalized eigenvectors.


    Figure [1-5](#522202_1_En_1_Chapter.xhtml#Fig5) shows a two-class classification
    problem where the real-world data correlation matrix on the left has values on
    all axes and it is hard to distinguish the two classes. On the right is the LDA-transformed
    data, which clearly shows the two classes and is easy to classify.


    ![](images/522202_1_En_1_Chapter/522202_1_En_1_Fig5_HTML.jpg)


    Figure 1-5


    Original correlated data is uncorrelated by linear discriminant analysis


    The Python code to adaptively generate the LDA transformed correlation matrix
    from a two-class, multi-dimensional dataset `[nDim, nSamples]` is


    ```

    # Adaptively compute matrices A and B

    from numpy import linalg as la

    dataset2 = dataset.drop([''Class''],1)

    nSamples = dataset2.shape[0]

    nDim = dataset2.shape[1]

    classes = np.array(dataset[''Class'']-1)

    classes_categorical = tf.keras.utils.to_categorical(classes, num_classes=2)

    M = np.zeros(shape=(nDim,2)) # stores adaptive correlation matrix

    B = np.zeros(shape=(nDim,nDim)) # stores adaptive correlation matrix

    for iter in range(nSamples):

    cnt = iter + 1

    # generate matrices A and B from current sample x

    x = np.array(dataset2.iloc[iter])

    x = x.reshape(nDim,1)

    B = B + (1.0/cnt)*((np.dot(x, x.T)) - B)

    y = classes_categorical[iter].reshape(2,1)

    M = M + (1.0/cnt)*((np.dot(x, y.T)) - M)

    A = M @ M.T

    # generate the LDA transformed data

    from scipy.linalg import eigh

    from sklearn.preprocessing import normalize

    eigvals, eigvecs = eigh(A, B)

    V = np.fliplr(eigvecs)

    VTAV = np.around(V.T @ A @ V, 2)

    VTBV = np.around(V.T @ B @ V, 2)

    # plot the LDA transformed data

    import seaborn as sns

    plt.figure(figsize=(8, 8))

    plt.rcParams.update({''font.size'': 16})

    plt.subplot(2, 2, 1)

    sns.heatmap(A, linewidth=0.5, linecolor="green", cmap=''RdBu'', cbar=False)

    plt.title("Original data")

    plt.subplot(2, 2, 2)

    sns.heatmap(VTBV, linewidth=0.5, linecolor="green", cmap=''hot'', cbar=False)

    plt.title("LDA Transformed")

    plt.subplot(2, 2, 3)

    sns.heatmap(A, linewidth=0.5, linecolor="green", cmap=''RdBu'', cbar=False)

    plt.subplot(2, 2, 4)

    sns.heatmap(VTAV, linewidth=0.5, linecolor="green", cmap=''hot'', cbar=False)

    plt.show()

    ```


    ### Singular Value Features


    Singular value decomposition (SVD) [singular value decomposition, Wikipedia] is
    a special case of an EVD problem as follows. Given the cross-correlation (n-by-m
    real) matrix `M = E(x[k]c[k]^T) ∈ ℜ^(n×m)`, SVD computes two matrices `U[k] ∈
    ℜ^(n×n)` and `V[k] ∈ ℜ^(m×m)` such that `U[k]^T M V[k] = S[n×m]`, where `U[k]`
    and `V[k]` are orthonormal and `S = diag(s[1], ... s[r])`, `r = min(m, n)`, with
    `s[1] >= ... >= s[r] >= 0`. By rearranging the vectors `x[k]` and `c[k]` we can
    make an `n×m` dimensional SVD problem into an `(n+m)×(n+m)` dimensional EVD problem.'
