    # 3. Square Root and Inverse Square Root


    ## 3.1 Introduction and Use Cases


    Adaptive computation of the square root and inverse square root of the real-time
    correlation matrix of a streaming sequence {`x[k]`∈ℜ^(`n`)} has numerous applications
    in machine learning, data analysis, and image/signal processing. They include
    data whitening, classifier design, and data normalization [Foley and Sammon 75;
    Fukunaga 90].


    Data whitening is a process of decorrelating the data such that all components
    have unit variance. It is a data preprocessing step in machine learning and data
    analysis to “normalize” the data so that it is easier to model. Prominent applications
    are:


    - To transform correlated noise in a signal to independent and identically distributed
    (iid) noise, which is easier to classify

    - Generalized eigenvector computation [Chatterjee et al. Mar 97] (see Chapter
    [7](#522202_1_En_7_Chapter.xhtml))

    - Linear discriminant analysis computation [linear discriminant analysis, Wikipedia]

    - Gaussian classifier design and computation of distance measures [Chatterjee
    et al. May 97]


    Figure [3-1](#522202_1_En_3_Chapter.xhtml#Fig1) shows the correlation matrices
    of the original and whitened data. The original data is highly correlated as shown
    by the colors on all axes. The whitened data is fully uncorrelated with no correlation
    between components since only diagonal values exist.


    ![](images/522202_1_En_3_Chapter/522202_1_En_3_Fig1_HTML.jpg)


    Figure 3-1


    Original correlated data on the left and the uncorrelated “whitened” data on the
    right


    Figure [3-2](#522202_1_En_3_Chapter.xhtml#Fig2) shows a handwritten number 0 obtained
    from the Keras MNIST dataset [Keras, MNIST]. The correlation matrix on the right
    shows that the data pixels are highly correlated for all pixels.


    ![](images/522202_1_En_3_Chapter/522202_1_En_3_Fig2a_HTML.jpg)![](images/522202_1_En_3_Chapter/522202_1_En_3_Fig2b_HTML.jpg)


    Figure 3-2


    Handwritten MNIST number 0 and the correlation matrix of all characters


    The following Python code whitens the data samples `X[nDim, nSamples]`:


    ```

    from scipy.linalg import eigh

    nDim = X.shape[0]

    corX = (X @ X.T) / nSamples

    eigvals, eigvecs = eigh(corX)

    V  = np.fliplr(eigvecs)

    D = np.zeros(shape=(nDim,nDim))

    for i in range(nDim):

    if (eigvals[::-1][i] < 10):

    D[i,i] = 0

    else:

    D[i,i] = np.sqrt(1/eigvals[::-1][i])

    Z = V @ D @ V.T @ X

    ```


    Next let’s see the transformed data and the new correlation matrix. Figure [3-3](#522202_1_En_3_Chapter.xhtml#Fig3)
    shows that the differentiated features of the character are accentuated and the
    correlation matrix is diagonal and not distributed along all pixels, showing that
    the data is whitened with the identity correlation matrix.


    ![](images/522202_1_En_3_Chapter/522202_1_En_3_Fig3a_HTML.jpg)![](images/522202_1_En_3_Chapter/522202_1_En_3_Fig3b_HTML.jpg)


    Figure 3-3


    Handwritten MNIST number 0 after whitening. The correlation matrix of all characters
    is diagonal


    We define the data correlation matrix `A` as


    ![$$ {A}_k=\frac{1}{k}\sum \limits_{i=1}^k{\mathbf{x}}_i{\mathbf{x}}_i^T={A}_{k-1}+\frac{1}{k}\left({\mathbf{x}}_k{\mathbf{x}}_k^T-{A}_{k-1}\right).
    $$](images/522202_1_En_3_Chapter/522202_1_En_3_Chapter_TeX_Equa.png)


    The square root of `A`, also called the Cholesky decomposition [Cholesky decomposition,
    Wikipedia], is denoted by `A^½`. Similarly, `A^(–½)` denotes the inverse square
    root of `A`. However, as explained below, there is no unique solution for both
    of these matrix functions, and various adaptive algorithms can be obtained where
    each algorithm leads to a different solution. Even though there are numerous solutions
    for these matrix functions, there are unique solutions under some restrictions,
    such as a unique symmetric positive definite solution.


    In this chapter, I present three adaptive algorithms for each matrix function
    `A^½` and `A^(–½)`. Out of the three, one adaptive algorithm leads to the symmetric
    positive definite solution and two lead to more general solutions.'
