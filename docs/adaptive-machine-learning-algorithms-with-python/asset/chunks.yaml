    ## 1.2 线性特征的多学科起源


    在本节中，我将通过展示多个学科如何推导这些特征并针对流数据自适应地计算它们，进一步讨论数据表示和分类特征的重要性。对于每个学科，我将演示这些特征在真实数据上的使用。


    ### 赫布学习或神经生物学


    赫布学习假说是最古老且最著名的学习规则。赫布提出，当细胞`*A*`的轴突激发细胞`*B*`时，突触权重`*W*`会根据`*f*(**x**,**y**)`进行调整，其中`*f*(⋅)`是突触前活动`**x**`和突触后活动`**y**`的函数。作为一种特殊情况，我们可以将权重调整写为`Δ*W*=η**xy**^(*T*)`，其中`η>0`是一个小常数。


    给定一个输入序列{`**x**[*k*]`}，我们可以构造其线性变换![$$ {y}_k={\mathbf{w}}_k^T{\mathbf{x}}_k $$](images/522202_1_En_1_Chapter/522202_1_En_1_Chapter_TeX_IEq12.png)，其中`**w**[*k*∈]ℜ^(*n*)`是权重向量。我们可以描述一个用于调整`**w**[*k*]`的赫布规则
    [Haykin 94]：`**w**[*k*+1]=**w**[*k*]+η***x***[*k*]*y*[*k*]`。由于此规则会导致指数增长，Oja [Oja
    89] 引入了一个规则，通过归一化`**w**[*k*]`来限制其增长，如下所示：


    ![$$ {\mathbf{w}}_{k+1}=\frac{{\mathbf{w}}_k+\eta {\mathbf{x}}_k{y}_k}{\left\Vert
    {\mathbf{w}}_k+\eta {\mathbf{x}}_k{y}_k\right\Vert }, $$](images/522202_1_En_1_Chapter/522202_1_En_1_Chapter_TeX_IEq13.png)     (1.3)


    假设`η`很小且`‖**w**[*k*]‖=1`，可以将([1.3](#522202_1_En_1_Chapter.xhtml#Par42))展开为`η`的幂级数，得到：


    ![$$ {\mathbf{w}}_{k+1}={\mathbf{w}}_k+\eta \left({\mathbf{x}}_k{y}_k-{y}_k^2{\mathbf{w}}_k\right)+O\left({\eta}^2\right),
    $$](images/522202_1_En_1_Chapter/522202_1_En_1_Chapter_TeX_IEq14.png)     (1.4)


    忽略`*O*(η²)`项，我们得到*约束赫布算法* (*CHA*) 或 *Oja 单单元规则* (第[4](#522202_1_En_4_Chapter.xhtml)章，第[4.​3](#522202_1_En_4_Chapter.xhtml#Sec6)节)。实际上，该算法收敛到`*A*`的第一个主特征向量。


    请注意，自适应 PCA 算法通常用于流数据，并且存在一些 GitHub 仓库。我在此创建了一个包含这些算法的综合仓库，并在本书及相关的 GitHub 中介绍了新的算法。


    例如，算法([1.4](#522202_1_En_1_Chapter.xhtml#Par44))已被广泛用于流数据，以从数据中推导出最强的表示特征，用于分析和机器学习。图[1-6](#522202_1_En_1_Chapter.xhtml#Fig6)显示了具有季节性的多元非平稳数据。使用自适应更新规则([1.4](#522202_1_En_1_Chapter.xhtml#Par44))，我们可以在流数据的
    0.2% 内有效地推导出第一个主成分。图[1-6](#522202_1_En_1_Chapter.xhtml#Fig6)左侧显示了季节性时变流数据，右侧显示了算法快速收敛（理想值为
    1）到第一个主特征向量，从而得到最强的数据表示特征。


    ![](images/522202_1_En_1_Chapter/522202_1_En_1_Fig6_HTML.png)


    **图 1-6** 用于季节性流数据的自适应 PCA 算法


    在真实的 33 维数据集`[nDim][nSamples]`上实现赫布自适应算法的 Python 代码如下：


    ```python

    # Adaptive Hebbian/OJA algorithms

    from numpy import linalg as la

    A = np.zeros(shape=(nDim,nDim)) # stores adaptive correlation matrix

    w = 0.1 * np.ones(shape=(nDim)) # weight vectors of all algorithms

    for iter in range(nSamples):

    # update the data correlation matrix with latest data vector x

    x = np.array(dataset1.iloc[iter]).reshape(nDim,1)

    A = A + (1.0/(1 + iter))*((np.dot(x, x.T)) - A)

    # Hebbian/OJA Algorithm

    v = w[:].reshape(nDim, 1)

    v = v + (1/(100+iter))*(A @ v - v @ (v.T @ A @ v))

    w[:] = v.reshape(nDim)

    ```'
