    a gradient descent algorithm based on the PF objective function and analyzes the
    landscape of this function. Mathew et al*.* [Mathew et al*.* 94, 95, 96] also
    use this objective function to offer a Newton-type algorithm for adaptive PCA.


    The third objective function used for accelerated PCA is the information theoretic
    (IT) objective function discussed in Sections [4.​5](#522202_1_En_4_Chapter.xhtml#Sec14)
    and [5.​8](#522202_1_En_5_Chapter.xhtml#Sec31). Miao and Hua [Miao and Hua 98]
    present gradient descent and RLS algorithms for adaptive principal sub-space analysis.


    The fourth objective function used for accelerated PCA is the XU objective function
    given in Sections [4.​6](#522202_1_En_4_Chapter.xhtml#Sec19) and [5.​4](#522202_1_En_5_Chapter.xhtml#Sec11).
    For example, Xu [Xu 93], Yang [Yang 95], Fu and Dowling [Fu and Dowling 94], Bannour
    and Azimi-Sadjadi [Bannour and Azimi-Sadjadi 95], and Miao and Hua [Miao and Hua
    98] used variations of this objective function. As discussed in Section [5.​4](#522202_1_En_5_Chapter.xhtml#Sec11),
    there are several variations of this objective function including the mean squared
    error at the output of a two-layer linear auto-associative neural network. Xu
    derives an algorithm for adaptive principal sub-space analysis by using gradient
    descent. Yang uses gradient descent and recursive least squares optimization methods.
    Bannour and Azimi-Sadjadi also describe a recursive least squares-based algorithm
    for adaptive PCA with this objective function. Fu and Dowling reduce this objective
    function to one similar to the RQ objective function, which can be minimized by
    the conjugate direction methods due to Sarkar et al*.* [Sarkar et al*.* 89; Yang
    et al*.* 89]. They also compute the minor components by using an approximation
    and by employing the deflation technique.


    ### Outline of This Chapter


    Any of the objective functions discussed in Chapters [4](#522202_1_En_4_Chapter.xhtml)
    and [5](#522202_1_En_5_Chapter.xhtml) can be used to obtain accelerated adaptive
    PCA algorithms by using nonlinear optimization techniques (on this objective function)
    such as


    *   Gradient descent,


    *   Steepest descent,


    *   Conjugate direction,


    *   Newton-Raphson, and


    *   Recursive least squares.


    I shall, however, use only one of these objective functions for the discussion
    in this chapter. I note that these analyses can be extended to the other objective
    functions in Chapters [4](#522202_1_En_4_Chapter.xhtml) and [5](#522202_1_En_5_Chapter.xhtml).
    My choice of objective function for this chapter is the XU deflation objective
    function discussed in Section [5.​4](#522202_1_En_5_Chapter.xhtml#Sec11).


    Although gradient descent on the XU objective function (see Section [5.​4](#522202_1_En_5_Chapter.xhtml#Sec11))
    produces the well-known Xu’s least mean square error reconstruction (LMSER) algorithm
    [Xu 93], the steepest descent, conjugate direction, and Newton-Raphson methods
    produce new adaptive algorithms for PCA [Chatterjee et al. Mar 00]. The penalty
    function (PF) deflation objective (see Section [5.​5](#522202_1_En_5_Chapter.xhtml#Sec16))
    function has also been accelerated by the steepest descent, conjugate direction,
    and quasi-Newton methods of optimization by Kang et al*.* [Kang et al*.* 00].


    I shall apply these algorithms to stationary and **non-stationary multi-dimensional**
    Gaussian data sequences. I experimentally show that the adaptive steepest descent,
    conjugate direction, and Newton-Raphson algorithms converge much faster than the
    traditional gradient descent technique due to Xu [Xu 93]. Furthermore, the new
    algorithms automatically select the gain sequence {*η*[*k*]} based on the current
    data sample. I further compare the steepest descent algorithm with state-of-the-art
    methods such as Yang’s Projection Approximation Subspace Tracking (PASTd) [Yang
    95], Bannour and Sadjadi’s recursive least squares (RLS) [Bannour et al*.* 95],
    and Fu and Dowling’s conjugate gradient eigenstructure tracking (CGET1) [Fu and
    Dowling 94, 95] algorithms.


    The XU deflation objective function for adaptive PCA algorithms is given in the
    Section [5.​4](#522202_1_En_5_Chapter.xhtml#Sec11) equation (5.12) as


    ![$$ J\left({\mathbf{w}}_k^i;{A}_k\right)=-2{{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i+{{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i{{\mathbf{w}}_k^i}^T{\mathbf{w}}_k^i+2\sum
    \limits_{j=1}^{i-1}{{\mathbf{w}}_k^i}^T{\mathbf{w}}_k^j{{\mathbf{w}}_k^j}^T{A}_k{\mathbf{w}}_k^i
    $$](images/522202_1_En_6_Chapter/522202_1_En_6_Chapter_TeX_IEq1.png),     (6.1)


    for *i*=1,…,*p*, where *A*[*k*]∈ℜ^(*n*X*n*) is the online observation matrix.
    I now apply different methods of nonlinear minimization to the objective function
    ![$$ J\left({\mathbf{w}}_k^i;{A}_k\right) $$](images/522202_1_En_6_Chapter/522202_1_En_6_Chapter_TeX_IEq2.png)
    in (6.1) to obtain various algorithms for adaptive PCA.


    In Sections [6.2](#522202_1_En_6_Chapter.xhtml#Sec4), [6.3](#522202_1_En_6_Chapter.xhtml#Sec5),
    [6.4](#522202_1_En_6_Chapter.xhtml#Sec8), and [6.5](#522202_1_En_6_Chapter.xhtml#Sec10),
    I apply the gradient descent, steepest descent, conjugate direction, and Newton-Raphson
    optimization methods to the unconstrained XU objective function for PCA given
    in (6.1). Here I obtain new algorithms for adaptive PCA. In Section [6.6](#522202_1_En_6_Chapter.xhtml#Sec12),
    I present experimental results with stationary and non-stationary Gaussian sequences,
    thereby showing faster convergence of the new algorithms over traditional gradient
    descent adaptive PCA algorithms. I also compare the steepest descent algorithm
    with state-of-the-art algorithms. Section [6.7](#522202_1_En_6_Chapter.xhtml#Sec16)
    concludes the chapter.'
  trans: '

    ### 基于梯度的自适应 PCA 的目标函数


    第 4 章和第 5 章讨论的部分目标函数已被实践者用于通过先进非线性优化技术推导加速自适应 PCA 算法，这些技术包括：


    *   最速下降法 (SD)，

    *   共轭方向法 (CD)，

    *   牛顿-拉夫逊法 (NR)，以及

    *   递归最小二乘法 (RLS)。


    与第 4 章和第 5 章讨论的梯度下降法相比，这些优化方法使算法收敛速度更快。它们还帮助我们计算增益序列 {*η*[*k*]} 的值，这在梯度下降法中是无法获得的。唯一的缺点是这些改进算法需要额外的计算量。请注意，每种优化方法应用于不同的目标函数时，都会产生一种新的自适应
    PCA 算法。


    在信号处理应用中，第一个广泛用于加速 PCA 的目标函数是瑞利商 (RQ) 目标函数，详见第 4.​4 节和第 5.​9 节。Sarkar 等人 [Sarkar
    et al*.* 89; Yang et al*.* 89] 将最速下降法和共轭方向法应用于该目标函数，以计算极值（最大或最小）特征向量。Fu 和 Dowling
    [Fu and Dowling 94, 95] 推广了共轭方向算法，用于计算所有特征向量。Zhu 和 Wang [Zhu and Wang 97] 也对该目标函数的正则化总体最小二乘版本使用了共轭方向法。关于基于共轭方向法处理
    RQ 目标函数的综述，可参见 [Yang et al*.* 89]。


    第二个用于加速 PCA 的目标函数是惩罚函数 (PF) 目标函数，详见第 4.​7 节和第 5.​5 节。Chauvin [Chauvin 97] 提出了一种基于
    PF 目标函数的梯度下降算法，并分析了该函数的景观。Mathew 等人 [Mathew et al*.* 94, 95, 96] 也使用该目标函数，提出了一种用于自适应
    PCA 的牛顿型算法。


    第三个用于加速 PCA 的目标函数是信息论 (IT) 目标函数，详见第 4.​5 节和第 5.​8 节。Miao 和 Hua [Miao and Hua 98]
    提出了用于自适应主子空间分析的梯度下降和 RLS 算法。


    第四个用于加速 PCA 的目标函数是 XU 目标函数，详见第 4.​6 节和第 5.​4 节。例如，Xu [Xu 93]、Yang [Yang 95]、Fu
    和 Dowling [Fu and Dowling 94]、Bannour 和 Azimi-Sadjadi [Bannour and Azimi-Sadjadi
    95] 以及 Miao 和 Hua [Miao and Hua 98] 都使用了该目标函数的变体。如第 5.​4 节所述，该目标函数有几种变体，包括两层线性自联想神经网络输出的均方误差。Xu
    通过使用梯度下降法推导出一种自适应主子空间分析算法。Yang 使用了梯度下降法和递归最小二乘优化方法。Bannour 和 Azimi-Sadjadi 也描述了一种基于递归最小二乘法的自适应
    PCA 算法，该算法使用了此目标函数。Fu 和 Dowling 将该目标函数简化为类似于 RQ 目标函数的形式，从而可以通过 Sarkar 等人 [Sarkar
    et al*.* 89; Yang et al*.* 89] 提出的共轭方向法进行最小化。他们还通过使用近似和紧缩技术计算了次分量。


    ### 本章概要


    第 4 章和第 5 章讨论的任何目标函数，都可以通过使用非线性优化技术（针对该目标函数）来获得加速的自适应 PCA 算法，这些技术包括：


    *   梯度下降法，

    *   最速下降法，

    *   共轭方向法，

    *   牛顿-拉夫逊法，以及

    *   递归最小二乘法。


    然而，在本章的讨论中，我将只使用这些目标函数中的一个。我注意到，这些分析可以推广到第 4 章和第 5 章中的其他目标函数。本章我选择的目标函数是第 5.​4
    节讨论的 XU 紧缩目标函数。


    尽管对 XU 目标函数（见第 5.​4 节）进行梯度下降会产生著名的 Xu 最小均方误差重构 (LMSER) 算法 [Xu 93]，但最速下降法、共轭方向法和牛顿-拉夫逊法则为
    PCA 产生了新的自适应算法 [Chatterjee et al. Mar 00]。惩罚函数 (PF) 紧缩目标函数（见第 5.​5 节）也已通过 Kang
    等人 [Kang et al*.* 00] 的最速下降法、共轭方向法和拟牛顿优化方法得到了加速。


    我将把这些算法应用于平稳和**非平稳多维**高斯数据序列。我通过实验表明，与 Xu [Xu 93] 提出的传统梯度下降技术相比，自适应最速下降法、共轭方向法和牛顿-拉夫逊算法收敛得更快。此外，新算法能根据当前数据样本自动选择增益序列
    {*η*[*k*]}。我进一步将最速下降算法与最先进的方法进行比较，例如 Yang 的投影近似子空间跟踪 (PASTd) [Yang 95]、Bannour
    和 Sadjadi 的递归最小二乘法 (RLS) [Bannour et al*.* 95] 以及 Fu 和 Dowling 的共轭梯度特征结构跟踪 (CGET1)
    [Fu and Dowling 94, 95] 算法。


    用于自适应 PCA 算法的 XU 紧缩目标函数在第 5.​4 节的公式 (5.12) 中给出：


    ![$$ J\left({\mathbf{w}}_k^i;{A}_k\right)=-2{{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i+{{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i{{\mathbf{w}}_k^i}^T{\mathbf{w}}_k^i+2\sum
    \limits_{j=1}^{i-1}{{\mathbf{w}}_k^i}^T{\mathbf{w}}_k^j{{\mathbf{w}}_k^j}^T{A}_k{\mathbf{w}}_k^i
    $$](img/522202_1_En_6_Chapter_TeX_IEq1.png)，     (6.1)


    其中 *i*=1,…,*p*，*A*[*k*]∈ℜ^(*n*X*n*) 是在线观测矩阵。我现在将不同的非线性最小化方法应用于公式 (6.1) 中的目标函数
    ![$$ J\left({\mathbf{w}}_k^i;{A}_k\right) $$](img/522202_1_En_6_Chapter_TeX_IEq2.png)，以获得用于自适应
    PCA 的各种算法。


    在第 6.2 节、6.3 节、6.4 节和 6.5 节中，我将梯度下降法、最速下降法、共轭方向法和牛顿-拉夫逊优化方法应用于公式 (6.1) 中给出的用于
    PCA 的无约束 XU 目标函数。在此，我获得了用于自适应 PCA 的新算法。在第 6.6 节中，我展示了使用平稳和非平稳高斯序列的实验结果，从而证明了新算法比传统的梯度下降自适应
    PCA 算法收敛更快。我还将最速下降算法与最先进的算法进行了比较。第 6.7 节对本章进行了总结。

    '
- fmt: '## 6.2 Gradient Descent Algorithm


    [Chatterjee et al. *IEEE Trans. on Neural Networks*, Vol. 11, No. 2, pp. 338-355,
    March 2000.]


    The gradient of (6.1) with respect to `w_k^i` is


    `g_k^i = (1/2) ∇_{w_k^i} J(w_k^i; A_k) = -2 A_k w_k^i + Σ_{j=1}^i A_k w_k^j (w_k^j)^T
    w_k^i + Σ_{j=1}^i w_k^j (w_k^j)^T A_k w_k^i` for `i = 1, …, p`. (6.2)


    Thus, the XU deflation adaptive gradient descent algorithm for PCA (see Section
    5.4.2) is


    `w_{k+1}^i = w_k^i - η_k g_k^i = w_k^i + η_k (2 A_k w_k^i - Σ_{j=1}^i A_k w_k^j
    (w_k^j)^T w_k^i - Σ_{j=1}^i w_k^j (w_k^j)^T A_k w_k^i)` for `i = 1, …, p`, (6.3)


    where `η[k]` is a decreasing gain constant. We can represent `A[k]` simply by
    its instantaneous value `x_k x_k^T` or by its recursive formula in Chapter 2 (Eq.
    2.3 or 2.4). It is convenient to define a matrix `W_k = [w_k^1 … w_k^p]` (`p ≤
    n`), for which the columns are the `p` weight vectors that converge to the `p`
    principal eigenvectors of `A[k]` respectively. Then, (6.2) can be represented
    as (same as (5.14) in Section 5.4.2):


    `W_{k+1} = W_k + η_k (2 A_k W_k - A_k W_k UT(W_k^T W_k) - W_k UT(W_k^T A_k W_k))`,
    (6.4)


    where `UT[·]` sets all elements below the diagonal of its matrix argument to zero,
    thereby making it upper triangular. Note that (6.2) is the LMSER algorithm due
    to Xu [Xu 93] that was derived from a least mean squared error criterion of a
    feed-forward neural network (see Section 5.4).


    ## 6.3 Steepest Descent Algorithm


    [Chatterjee et al. *IEEE Trans. on Neural Networks*, Vol. 11, No. 2, pp. 338-355,
    March 2000.]


    The adaptive steepest descent algorithm for PCA is obtained from `J(w_k^i; A_k)`
    in (6.1) as


    `w_{k+1}^i = w_k^i - α_k^i g_k^i`, (6.5)


    where `g_k^i` is given in (6.2) and `α_k^i` is a non-negative scalar minimizing
    `J(w_k^i - α g_k^i; A_k)`. Since we have an expression for `J(w_k^i; A_k)` in
    (6.1), we minimize the function `J(w_k^i - α g_k^i; A_k)` with respect to `α`
    and obtain the following cubic equation:


    `c[3] α³ + c[2] α² + c[1] α + c[0] = 0`, (6.6)


    where


    `c_0 = -(g_k^i)^T g_k^i`, `c_1 = (g_k^i)^T H_k^i g_k^i`, `c_2 = -3 ((g_k^i)^T
    A_k g_k^i (w_k^i)^T g_k^i + (w_k^i)^T A_k g_k^i (g_k^i)^T g_k^i)`, `c_3 = 2 (g_k^i)^T
    A_k g_k^i (g_k^i)^T g_k^i`.


    Here `H_k^i` is the Hessian of `J(w_k^i; A_k)` as follows:


    `H_k^i = -2 A_k + 2 A_k w_k^i (w_k^i)^T + w_k^i (w_k^i)^T A_k + (w_k^i)^T A_k
    w_k^i I + Σ_{j=1}^i A_k w_k^j (w_k^j)^T + Σ_{j=1}^i w_k^j (w_k^j)^T A_k` (6.7)


    With known values of `w_k^i` and `g_k^i`, this cubic equation can be solved to
    obtain `α` that minimizes `J(w_k^i - α g_k^i; A_k)`. A description of the computation
    of `α` is given in next section.


    We now represent the adaptive PCA algorithm (6.5) in the matrix form. We define
    the matrices:


    `W_k = [w_k^1, …, w_k^p]`, `G_k = [g_k^1, …, g_k^p]`, and `Γ_k = Diag(α_k^1, …,
    α_k^p)`.


    Then, the adaptive steepest descent PCA algorithm is


    `G_k = -2 A_k W_k + W_k UT(W_k^T A_k W_k) + A_k W_k UT(W_k^T W_k)`,


    `W[k + 1] = W[k] - G[k] Γ[k]`. (6.8)


    Here `UT[·]` is the same as in (6.4).'
