- fmt: '# 4.12 Concluding Remarks


    The `RQ`, `OJAN`, and `LUO` algorithms require `‖w[0]‖=1` for the principal eigenvector
    `w[k]` to converge to unit norm (i.e., `‖w[k]‖→1`). All other algorithms (except
    `PF`) converged to the unit norm for various non-zero values for `w[0]`. As per
    Theorem 4.8, the `PF` algorithm successfully converged to `‖w_k‖ → √(1 + λ₁/μ)`.


    The unified framework and the availability of the objective functions allows me
    to derive and analyze each algorithm on its convergence performance. The results
    for each algorithm are summarized in Table 4-5. For each method, I computed the
    approximate MATLAB flop³ count for one iteration of the adaptive algorithm for
    `n=10` and show them in Table 4-5.


    **Table 4-5** Comparison of Different Adaptive Algorithms [Chatterjee, Neural
    Networks 2005]


    | Alg. | Pros | Cons |

    | --- | --- | --- |

    | `OJA` | Convergence increases with larger `λ₁` and `λ₁/λ₂`. Upper bound of `η[k]`
    can be determined. Fewer computations per iteration (Flops=460). | Convergence
    cannot be improved by larger `‖w[0]‖`. |

    | `OJAN` | Convergence increases with larger `λ₁` and `λ₁/λ₂`. Fewer computations
    per iteration (Flops=481). | Upper bound of `η[k]` not available. Convergence
    cannot be improved by larger `‖w[0]‖`. Require `‖w[0]‖=1` for `w[k]` to converge
    to unit norm. |

    | `LUO` | Convergence increases with larger `λ₁` and `λ₁/λ₂`. Convergence increases
    for larger `‖w[0]‖`. Fewer computations per iteration (Flops=502). | Upper bound
    of `η[k]` not available. Convergence decreases for smaller `‖w[0]‖`. Requires
    `‖w[0]‖=1` for `w[k]` to converge to unit norm. |

    | `RQ` | Convergence increases with larger `λ₁` and `λ₁/λ₂`. Convergence increases
    for smaller `‖w[0]‖`. Fewer computations per iteration (Flops=503). | Upper bound
    of `η[k]` not available. Convergence decreases for larger `v`. Requires `‖w[0]‖=1`
    for `w[k]` to converge to unit norm. |

    | `OJA+` | Convergence increases with larger `λ₁` and `λ₁/λ₂`. Upper bound of
    `η[k]` can be determined. Fewer computations per iteration (Flops=501). | Convergence
    cannot be improved by larger `‖w[0]‖`. |

    | `IT` | Upper bound of `η[k]` can be determined. Fewer computations per iteration
    (Flops=460). | Convergence independent of `λ₁`. Experimental results show poor
    convergence. |

    | `XU` | Convergence increases with larger `λ₁` and `λ₁/λ₂`. Upper bound of `η[k]`
    can be determined. | Convergence cannot be improved by larger `‖w[0]‖`. More computations
    per iteration (Flops=800). |

    | `PF` | Convergence increases with larger `λ₁` and `λ₁/λ₂`. Convergence increases
