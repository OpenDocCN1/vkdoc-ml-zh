    The adaptive conjugate direction algorithm for PCA can be obtained as follows:


    ![$$ {\mathbf{w}}_{k+1}^i={\mathbf{w}}_k^i+{\alpha}_k^i{\mathbf{d}}_k^i $$](images/522202_1_En_6_Chapter/522202_1_En_6_Chapter_TeX_IEq36.png)


