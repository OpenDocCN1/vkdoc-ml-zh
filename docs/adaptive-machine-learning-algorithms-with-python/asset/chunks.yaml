- fmt: "### Unified Framework\n\nIn this chapter, I present a unified framework to\
    \ derive and analyze several algorithms (some well-known) for adaptive eigen-decomposition.\
    \ The steps consist of the following:\n\n1.  Description of an objective function\
    \ from which I derive the adaptive algorithm by using the gradient descent method\
    \ of nonlinear optimization.\n2.  For each objective function, I offer three methods\
    \ of deriving the adaptive algorithms, which lead to three sets of adaptive algorithms,\
    \ each with its own computational cost, convergence property, and implementation\
    \ simplicity:\n    1.  *Homogeneous Adaptive Rule:* These algorithms do not compute\
    \ the true normalized eigenvectors with decreasing eigenvalues. Instead, they\
    \ produce a linear combination of the unit eigenvectors. However, these algorithms\
    \ can be computed quickly and implemented in parallel networks.\n    2.  *Deflation\
    \ Adaptive Rule:* Here, we lose the homogeneity of the algorithms, but produce\
    \ unit eigenvectors with decreasing eigenvalues, thereby satisfying many application\
    \ requirements. However, the training is sequential, and the learning rule for\
    \ the weights of the *n*^(*th*) neuron depends on the training of the previous\
    \ *n*–1 neurons, thereby making the training process difficult for parallel implementations.\n\
    \    3.  *Weighted Adaptive Rule:* These algorithms are obtained by breaking the\
    \ symmetry of the homogeneous algorithms by using a different scalar weight for\
    \ each eigenvector. The unit eigenvectors are obtained explicitly and in the order\
    \ of decreasing eigenvalues. It is also possible to implement these algorithms\
    \ in parallel networks. However, the algorithms require extra computation.\n\n\
    It is interesting to observe that many algorithms presented here were independent\
    \ discoveries over more than a decade. For example, Oja et al. [Oja and Karhunen\
    \ 85] first presented the Oja homogeneous algorithm (5.5) in 1985. Various practitioners\
    \ extensively analyzed this algorithm in separate publications from 1989 to 1998\
    \ (see Section [5.3.1](#522202_1_En_5_Chapter.xhtml#Sec7)). Sanger [Sanger 89]\
    \ showed the deflation version (5.8) of this algorithm in 1989. Subsequently,\
    \ Oja, Brockett, Xu and Chen et al. presented the weighted variation (5.10) of\
    \ this algorithm during 1992-98 (see Sec. [5.3.2](#522202_1_En_5_Chapter.xhtml#Sec8)).\
    \ This chapter unifies these algorithms and many others, including several new\
    \ algorithms, in a single framework with uncomplicated derivations. Note that\
    \ although these algorithms were discovered from various perspectives, I presented\
    \ them on a single foundation.\n\nGiven an asymptotically stationary sequence\
    \ {`**x**[*k*]`∈ℜ^(*n*)} that has been centered to zero mean, the asymptotic data\
    \ correlation matrix is given by `A = lim_{k→∞} E[x_k x_k^T]`. The *p*≤*n* orthogonal\
    \ unit principal eigenvectors `**ϕ**[1]`,...,`**ϕ**[*p*]` of `A` are given by\n\
    \n`**ϕ**_i^T A **ϕ**_j = λ_i δ_ij`, and `**ϕ**_i^T **ϕ**_j = δ_ij` for *i*=1,…,*p*,\
    \ (5.1)\n\nwhere `λ[1] > ... > λ[*p*] > λ[*p*+1] ≥ ... ≥ λ[*n*] > 0` are the *p*\
    \ largest eigenvalues of `A` in descending order of magnitude. If the sequence\
    \ {`**x**[*k*]`} is non-stationary, we compute the online data correlation matrix\
    \ `A[*k*]`∈ℜ^(*n*X*n*) by (2.3) or (2.5).\n\nIn my analyses of the algorithms,\
    \ I follow the methodology outlined in Section [1.​4](#522202_1_En_1_Chapter.xhtml#Sec19).\
    \ For the algorithms, I describe an *objective function* `J(**w**[*i*]; A)` and\
    \ an updated rule of the form\n\n`W[*k* + 1] = W[*k*] + η[*k*] * h(W[*k*], A[*k*])`,\
    \ (5.2)\n\nwhere `h(W[*k*], A[*k*])` follows certain continuity and regularity\
    \ properties [Ljung 77, 92] and `η[*k*]` is a decreasing gain sequence.\n\n###\
    \ Outline of This Chapter\n\nIn Section [5.2](#522202_1_En_5_Chapter.xhtml#Sec4),\
    \ I discuss the objective functions and their variations that are analyzed in\
    \ this chapter. In Section [5.3](#522202_1_En_5_Chapter.xhtml#Sec6), I present\
    \ adaptive algorithms for the homogeneous, deflation, and weighted variations\
    \ for the OJA objective function with convergence results. In Section [5.4](#522202_1_En_5_Chapter.xhtml#Sec11),\
    \ I analyze the same three variations for the mean squared error (XU) objective\
    \ function. In Section [5.5](#522202_1_En_5_Chapter.xhtml#Sec16), I discuss algorithms\
    \ derived from the penalty function (PF) objective function and prove the convergence\
    \ results. In Section [5.6](#522202_1_En_5_Chapter.xhtml#Sec21), I consider the\
    \ augmented Lagrangian 1 (AL1) objective function; in Section [5.7](#522202_1_En_5_Chapter.xhtml#Sec26),\
    \ I present the augmented Lagrangian 2 (AL2) objective function. In Section [5.8](#522202_1_En_5_Chapter.xhtml#Sec31),\
    \ I present the information theory (IT) criterion; in Section [5.9](#522202_1_En_5_Chapter.xhtml#Sec36),\
    \ I describe the Rayleigh quotient (RQ) criterion. In Section [5.10](#522202_1_En_5_Chapter.xhtml#Sec41),\
    \ I present a summary of all algorithms discussed here. In Section [5.11](#522202_1_En_5_Chapter.xhtml#Sec42),\
    \ I discuss the experimental results and I conclude the chapter with Section [5.12](#522202_1_En_5_Chapter.xhtml#Sec43).\n\
    \n## 5.2 Algorithms and Objective Functions\n\nConforming to my proposed methodology\
