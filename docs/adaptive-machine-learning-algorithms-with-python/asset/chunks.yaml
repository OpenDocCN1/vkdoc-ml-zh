    \ although very large values of `μ` will make the algorithm perform poorly due\
    \ excessive emphasis on the constraints.\n\n## 4.11 Experimental Results\n\nI\
    \ did three sets of experiments.\n\n1.  In the first experiment, I used the adaptive\
