    1.  对于每种算法，我评估了其计算性能和收敛性能。


    2.  我跳过了齐次算法，因为它们在实际应用中用处不大，会产生特征向量的任意旋转。


    3.  注意，*A*[*k*]∈ℜ^(*n*X*n*), *B*[*k*]∈ℜ^(*n*X*n*) 且 *W*[*k*]∈ℜ^(*n*X*p*)。我根据矩阵维度
    *n* 和 *p* 给出了每种算法的计算复杂度。


    4.  收敛性能根据主分量和次分量的收敛速度确定。我按 1-10 的等级对收敛性进行评分，其中 10 表示收敛最快的算法。


    5.  我跳过了 IT 和 RQ 算法，因为与其他算法相比，它们表现不佳，并且矩阵求逆增加了计算复杂度。参见表 7-3。


    可以观察到以下几点：


    1.  OJA 算法复杂度最低，性能良好。


    2.  AL2 算法复杂度最高，性能最佳。


    3.  AL1 算法性能仅次于 AL2，PF 和 XU 算法紧随其后。


    复杂度和精度的权衡将决定在实际场景中使用哪种算法。如果计算资源充足，AL2 算法是最佳选择。XU 算法在复杂度和性能之间取得了良好的平衡。


    总之，我从一个通用框架出发，展示了 21 种算法，其中许多是新的，并且每种算法都有对应的目标函数。请注意，虽然我对这些目标函数应用了梯度下降技术，但我本可以应用任何其他非线性优化技术，例如最速下降法、共轭方向法、牛顿-拉夫逊法或递归最小二乘法。目标函数的可用性使我们能够通过对其应用新的优化技术来推导新算法，并对自适应算法进行收敛性分析。


    # 8. 自适应线性算法的实际应用


    在本章中，我将探讨线性自适应算法的实际应用案例。这些算法的一些最佳应用场景源于设备上的边缘计算，这需要管理以下方面：


    *   大规模设备计算的功耗


    *   输入的非平稳性


    *   设备计算的延迟


    *   设备的内存和带宽


    在这些情况下，存在以下约束：


    *   数据以随机向量序列 {**x**[*k*]} 或随机矩阵序列 {*A*[*k*]} 的形式到达。


    *   数据随时间变化，导致输入特征发生显著漂移，使得模型随着时间的推移不再有效。


    *   数据量巨大，我们没有足够的设备存储空间、带宽或电量来存储或上传数据。


    *   数据维度可能很大。


    在这些情况下，我将演示如何使用线性自适应算法来管理设备的功耗、内存和带宽，以保持预训练模型的准确性。我将涵盖的示例如下：


    *   计算传入数据的特征漂移，并提前检测训练-服务偏差 [Kaz Sato 等人*.* 21]


    *   适应传入数据漂移，并计算最适合数据的特征


    *   将传入数据压缩为特征，用于创建新模型


    *   计算传入数据中的异常值，以便模型使用干净良好的数据


    在这些示例中，我使用了来自以下存储库的数据：用于评估流学习算法的公开真实世界数据集。该数据集代表了真实的流式非平稳数据 [Vinicius Souza 等人*.*
    20]。


    请注意，除了本章讨论的示例外，我在整本书中还考虑了许多其他实际的自适应示例，例如：


    *   使用自适应均值进行手写字符识别


    *   使用自适应中位数进行异常检测


    *   数据表示特征计算


    *   数据分类特征计算


    ## 8.1 检测特征漂移


    随着传入数据的底层统计特性随时间变化，用于机器学习的模型性能会下降。及早检测特征漂移并重新训练模型，可以保持机器学习解决方案的准确性。

