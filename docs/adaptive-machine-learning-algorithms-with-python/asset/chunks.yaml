    UT\left({W}_k^T{A}_k{W}_k\right)\right) $$](img/522202_1_En_7_Chapter_TeX_IEq45.png), (7.18)


    其中 UT[⋅] 将其矩阵参数中对角线以下的所有元素设为零。Chatterjee 等人 [Mar 00, Thms 1, 2] 证明，当 *k*→∞ 时，*W*[*k*]
    以概率 1 收敛到 [±**ϕ**[1] ±**ϕ**[2] … ±**ϕ**[*p*]]。


