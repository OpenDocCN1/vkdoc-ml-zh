    In this chapter, I consider real-world examples of linear adaptive algorithms.
    Some of the best needs for these algorithms arise due to edge computation on devices,
    which require managing the following:


    *   Power usage for device-based computation at scale


    *   Non-stationarity of inputs


    *   Latency of computation on devices


    *   Memory and bandwidth of devices


    In these cases, there are the following constraints:


    *   The data arrives as a sequence of random vectors {**x**[*k*]} or random matrices
    {*A*[*k*]}.


    *   The data changes with time, causing significant drift of input features whereby
    the models are no longer effective over time.


    *   The data volume is large and we do not have the device storage, bandwidth,
    or power to store or upload the data.


    *   Data dimensionality can be large.


    In these circumstances, I will demonstrate how to use the linear adaptive algorithms
    to manage the device’s power, memory, and bandwidth in order to maintain accuracy
    of the pretrained models. The examples I will cover are the following:


    *   Calculating feature drift of incoming data and detecting training-serving
    skew [Kaz Sato et al*.* 21] ahead of time


    *   Adapting to incoming data drift and calculating features that best fit the
    data


    *   Compressing incoming data into features for use in new model creation


    *   Calculating anomalies in incoming data so that good clean data is used by
    the models


    In these examples, I used data from the following repository: Publicly Real-World
    Datasets to Evaluate Stream Learning Algorithms. This dataset represents real-world
    streaming non-stationarity data [Vinicius Souza et al*.* 20].


    Note that besides the examples discussed in this chapter, I have considered many
    other practical examples of adaptive examples throughout the book, such as


    *   Handwritten character recognition with adaptive mean


    *   Anomaly detection with adaptive median


    *   Data representation feature computation


    *   Data classification feature computation


    ## 8.1 Detecting Feature Drift


    As the underlying statistical properties of the incoming data changes with time,
    the models used for machine learning decay in performance. Early detection of
    feature drift and retraining the models maintains the accuracy of the machine
    learning solution.'
