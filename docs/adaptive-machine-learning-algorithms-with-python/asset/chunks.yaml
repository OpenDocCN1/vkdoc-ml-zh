    import eigh

    nSamples = X.shape[1]

    nDim = X.shape[0]

    corX = (X @ X.T) / nSamples

    eigvals, eigvecs = eigh(corX)

    V  = np.fliplr(eigvecs)

    # PCA Transformed data

    Y = V[:,:100] @ V[:,:100].T @ X

    ```


