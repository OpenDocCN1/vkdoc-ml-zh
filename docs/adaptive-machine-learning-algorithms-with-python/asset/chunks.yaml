    {\mathbf{w}}_k^p\right] $$](images/522202_1_En_6_Chapter/522202_1_En_6_Chapter_TeX_IEq7.png)
    (*p*≤*n*)，其列是分别收敛到 *A*[*k*] 的 *p* 个主特征向量的 *p* 个权重向量。那么，(6.2) 可以表示为（与第 5.​4.​2
