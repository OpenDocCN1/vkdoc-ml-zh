    ### AL2 Algorithm Python Code


    The following Python code implements the AL2 PCA algorithms with data `X[nDim,nSamples]`:


    ```

    from numpy import linalg as la

    nEA = 4 # number of PCA components computed

    nEpochs  = 2

    A  = np.zeros(shape=(nDim,nDim)) # stores adaptive correlation matrix

    W1 = 0.1 * np.ones(shape=(nDim,nEA)) # weight vectors of all algorithms

    W2 = W1

    W3 = W1

    c = [2-0.3*k for k in range(nEA)]

    C = np.diag(c)

    I  = np.identity(nEA)

    mu = 2

    for epoch in range(nEpochs):

    for iter in range(nSamples):

    cnt = nSamples*epoch + iter

    x = X[:,iter]

    x = x.reshape(nDim,1)

    A = A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - A)

    # Homogeneous Gradient Descent

    W1 = W1 + (1/(100 + cnt))*(A @ W1 - 0.5 * W1 @ (W1.T @ A @ W1) -0.5 * A @ W1

    @(W1.T @ W1) -0.5 * mu * W1

    @((W1.T @ W1) - I))

    # Deflated Gradient Descent

    W2 = W2 + (1/(100 + cnt))*(A @ W2 - 0.5 * W2 @ np.triu(W2.T @ A @ W2) -0.5 * A

    @ W2 @ np.triu(W2.T @ W2) -

    0.5 * mu * W2 @ np.triu((W2.T @ W2) - I))

    # Weighted Gradient Descent

    W3 = W3 + (1/(100 + cnt))*(A @ W3 @ C - 0.5 * W3 @ C @ (W3.T @ A @ W3) -

    0.5 * A @ W3 @ C @ (W3.T @ W3) -0.5 * mu * W3 @ C

    @((W3.T @ W3) - I))

    ```


    ## 5.8 IT Algorithms


    ### IT Homogeneous Function


    The objective function for the information theory homogeneous PCA algorithm is


    ![$$ J\left({\mathbf{w}}_k^i;{A}_k\right)={{\mathbf{w}}_k^i}^T{\mathbf{w}}_k^i-\log
    \left({{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i\right)+\alpha \left({{\mathbf{w}}_k^i}^T{\mathbf{w}}_k^i-1\right)+2\sum
    \limits_{j=1,j\ne i}^p{\beta}_j{{\mathbf{w}}_k^j}^T{\mathbf{w}}_k^i $$](images/522202_1_En_5_Chapter/522202_1_En_5_Chapter_TeX_IEq77.png)     (5.35)


    where `(α,β[1],β[2],…,β[p])` are Lagrange multipliers and `i=1,…,p`. By equating
    the gradient of (5.35) with respect to ![$$ {\mathbf{w}}_k^i $$](images/522202_1_En_5_Chapter/522202_1_En_5_Chapter_TeX_IEq78.png)
    to `0`, and using the constraint ![$$ {{\mathbf{w}}_k^j}^T{\mathbf{w}}_k^i={\delta}_{ij}
    $$](images/522202_1_En_5_Chapter/522202_1_En_5_Chapter_TeX_IEq79.png), we obtain


    `α = 0` and ![$$ {\beta}_j={{\mathbf{w}}_k^j}^T{A}_k{\mathbf{w}}_k^i/{{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i
    $$](images/522202_1_En_5_Chapter/522202_1_En_5_Chapter_TeX_IEq80.png) for `j=1,…,p`,
    `j≠i`.     (5.36)


    Replacing `(α,β[1],β[2],…,β[p])` in the gradient of (5.36), we obtain the IT homogeneous
    adaptive gradient descent algorithm for PCA:


    ![$$ {W}_{k+1}={W}_k+{\eta}_k\left({A}_k{W}_k-{W}_k{W}_k^T{A}_k{W}_k\right)\kern0.5em
    \mathrm{DIAG}{\left({W}_k^T{A}_k{W}_k\right)}^{-1} $$](images/522202_1_En_5_Chapter/522202_1_En_5_Chapter_TeX_IEq81.png),     (5.37)


    where `DIAG[⋅]` sets all elements *except* the diagonal of its matrix argument
    to zero, thereby making the matrix diagonal. `W[k]` converges to `W^*= ΦDU`, where
    `D=[D[1]|0]^(T)∈ℜ^(nXp)`, `D[1]=diag(d[1],...,d[p])∈ ℜ^(pXp)`, `d[i]=±1` for `i=1,...,p`,
    and `U∈ℜ^(pXp)` is an arbitrary rotation matrix.


    ### IT Deflation Algorithm


    The objective function for the information theory deflation PCA algorithm is


    ![$$ J\left({\mathbf{w}}_k^i;{A}_k\right)={{\mathbf{w}}_k^i}^T{\mathbf{w}}_k^i-\log
