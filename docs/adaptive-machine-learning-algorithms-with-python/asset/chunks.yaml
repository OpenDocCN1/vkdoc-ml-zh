    arrives as a sequence. From this data sequence, we can derive a matrix sequence
    {![$$ {A}_k={\mathbf{x}}_k{\mathbf{x}}_k^T $$](images/522202_1_En_2_Chapter/522202_1_En_2_Chapter_TeX_IEq1.png)}.
    We define the data correlation matrix *A* as follows:


    ![$$ A=\underset{k\to \infty }{\lim }E\left[{\mathbf{x}}_k{\mathbf{x}}_k^T\right]
