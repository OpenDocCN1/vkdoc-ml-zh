- fmt: '# 3.9 Concluding Remarks


    I presented six adaptive algorithms for the computation of the square root and
    inverse square root of the correlation matrix of a random vector sequence. In
    four cases, I presented an objective function and, in all cases, I discussed the
    convergence properties of the algorithms. Note that although I applied the gradient
    descent technique on these objective functions, I could have applied any other
    technique of nonlinear optimization such as steepest descent, conjugate direction,
    Newton-Raphson, or recursive least squares. The availability of the objective
    functions allows us to derive new algorithms by using new optimization techniques
    on them, and also to perform convergence analyses of the adaptive algorithms.


    Footnotes [1](#522202_1_En_3_Chapter.xhtml#Fn1_source)


    # 4. First Principal Eigenvector


    ## 4.1 Introduction and Use Cases


    In this chapter, I present a unified framework to derive and discuss ten adaptive
    algorithms (some well-known) for principal eigenvector computation, which is also
    known as principal component analysis (PCA) or the Karhunen-Loeve [Karhunen–Loève
    theorem, Wikipedia] transform. The first *principal eigenvector* of a symmetric
    positive definite matrix `A∈ℜ^(nXn)` is the eigenvector `ϕ[1]` corresponding to
    the largest eigenvalue `λ[1]` of `A`. Here `Aϕ[i]= λ[i]ϕ[i]` for `i=1,…,n`, where
    `λ[1]>λ[2]≥...≥λ[n]>0` are the `n` largest eigenvalues of `A` corresponding to
    eigenvectors `ϕ[1],…,ϕ[n]`.


    An important problem in machine learning is to extract the most significant feature
    that represents the variations in the multi-dimensional data. This reduces the
    multi-dimensional data into one dimension that can be easily modeled. However,
    in real-world applications, the data statistics change over time (non-stationary).
    Hence it is challenging to design a solution that adapts to changing data on a
    low-memory and low-computation edge device.


    Figure [4-1](#522202_1_En_4_Chapter.xhtml#Fig1) shows an example of streaming
    10-dimensional non-stationary data that abruptly changes statistical properties
    after 500 samples. The overlaid red curve shows the principal eigenvector estimated
    by the adaptive algorithm. The adaptive estimate of the principal eigenvector
    converges to its true value within 50 samples. As the data changes abruptly after
    500 samples, it readapts to the changed data and converges back to its true value
    within 100 samples. All of this is achieved with low computation, low memory,
    and low latency.


    ![](images/522202_1_En_4_Chapter/522202_1_En_4_Fig1_HTML.png)


    Figure 4-1


    Rapid convergence of the first principal eigenvector is computed by an adaptive
    algorithm in spite of abrupt changes in data


    Besides this example, there are several applications in machine learning, pattern
    analysis, signal processing, cellular communications, and automatic control [Haykin
    94, Owsley 78, Pisarenko 73, Chatterjee et al*.* 97-99, Chen et al*.* 99, Diamantaras
    and Strintzis 97], where an online (i.e., real-time) solution of principal eigen-decomposition
    is desired. As discussed in Chapter [2](#522202_1_En_2_Chapter.xhtml), in these
    real-time situations, the underlying correlation matrix `A` is unknown. Instead,
    we have a sequence of random vectors `{x[k]∈ℜ^(n)}` from which we obtain an instantaneous
    matrix sequence `{A[k]∈ℜ^(nxn)}`, such that `A = lim[k→∞]E[A[k]]`. For every incoming
    sample `x[k]`, we need to obtain the current estimate `w[k]` of the principal
    eigenvector `ϕ[1]`, such that `w[k]` converges strongly to its true value `ϕ[1]`.


    A common method of computing the online estimate `w[k]` of `ϕ[1]` is to maximize
    the *Rayleigh quotient* (RQ) [Golub and VanLoan 83] criterion `J(w[k];A[k])`,
    where


    ![$$ J\left({\mathbf{w}}_k;{A}_k\right)=\frac{{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k}{{\mathbf{w}}_k^T{\mathbf{w}}_k}
    $$](images/522202_1_En_4_Chapter/522202_1_En_4_Chapter_TeX_IEq1.png). (4.1)


    The signal `x[k]` can be compressed to a single value by projecting it onto `w[k]`
    as ![$$ {\mathbf{w}}_k^T{\mathbf{x}}_k $$](images/522202_1_En_4_Chapter/522202_1_En_4_Chapter_TeX_IEq2.png).


    The literature for PCA algorithms is very diverse and practitioners have approached
    the problem from a variety of backgrounds including signal processing, neural
    learning, and statistical pattern recognition. Within each discipline, adaptive
    PCA algorithms are derived from their own perspectives, which may include ad hoc
    methods. Since the approaches and solutions to PCA algorithms are distributed
    along disciplinary lines, a unified framework for deriving and analyzing these
    algorithms is necessary.


    In this chapter, I offer a common framework for derivation, convergence, and rate
    analyses for the ten adaptive algorithms in four steps outlined in Section [1.4](#522202_1_En_1_Chapter.xhtml#Sec19).
    For each algorithm, I present the results for each of these steps. The unified
    framework helps in conducting a comparative study of the ten algorithms. In the
    process, I offer fresh perspectives on known algorithms and present two new adaptive
    algorithms for PCA. For known algorithms, if results exist from prior implementations,
    I state them; otherwise, I provide the new results. For the new algorithms, I
    prove my results.


    ### Outline of This Chapter


    In Section [4.2](#522202_1_En_4_Chapter.xhtml#Sec3), I list the adaptive PCA algorithms
    that I derive and discuss in this chapter. I also list the objective functions
    from which I derive these algorithms and the necessary assumptions. Section [4.3](#522202_1_En_4_Chapter.xhtml#Sec6)
    presents the Oja PCA algorithm and describes its convergence properties. In Section
    [4.4](#522202_1_En_4_Chapter.xhtml#Sec10), I analyze three algorithms based on
    the Rayleigh quotient criterion ([4.1](#522202_1_En_4_Chapter.xhtml#Par7)). In
    Section [4.5](#522202_1_En_4_Chapter.xhtml#Sec14), I discuss PCA algorithms based
    on the information theoretic criterion. Section [4.6](#522202_1_En_4_Chapter.xhtml#Sec19)
    describes the mean squared error objective function and algorithms. In Section
    [4.7](#522202_1_En_4_Chapter.xhtml#Sec24), I discuss penalty function-based algorithms.
    Sections [4.8](#522202_1_En_4_Chapter.xhtml#Sec29) and [4.9](#522202_1_En_4_Chapter.xhtml#Sec33)
    present new PCA algorithms based on the augmented Lagrangian criteria. Section
    [4.10](#522202_1_En_4_Chapter.xhtml#Sec38) presents the summary of convergence
    results. Section [4.11](#522202_1_En_4_Chapter.xhtml#Sec39) discusses the experimental
    results. Finally, section [4.12](#522202_1_En_4_Chapter.xhtml#Sec44) concludes
    the chapter.


