- fmt: '# 6.7 Concluding Remarks


    I presented an unconstrained objective function to obtain various new adaptive
    algorithms for PCA by using nonlinear optimization methods such as gradient descent,
    steepest descent, conjugate gradient, and Newton-Raphson. Comparison among these
    algorithms with stationary and non-stationary data show that the SD, CG, and NR
    algorithms have faster tracking abilities compared to the GD algorithm.


    Further consideration should be given to the computational complexity of the algorithms.
    SD, CG, and NR algorithms have computational complexity of `O(pn²)`. If, however,
    we use the estimate `A_k = x_k x_k^T` instead of (6.4) in the GD algorithm, then
    the computational complexity drops to `O(pn)`, although the convergence gets slower.
    The CGET1 algorithm has complexity `O(pn²)`. The PASTd and RLS algorithms have
    complexity `O(pn)`. However, their convergence is slower than the SD and CGET1
    algorithms as shown in Figures [6-9](#522202_1_En_6_Chapter.xhtml#Fig9) and [6-10](#522202_1_En_6_Chapter.xhtml#Fig10).
    Further note that the GD algorithm can be implemented by parallel architecture
    as shown by the examples in [Cichocki and Unbehauen 93].


    # 7. Generalized Eigenvectors


    ## 7.1 Introduction and Use Cases


    This chapter is concerned with the adaptive solution of the generalized eigenvalue
    problems `AΦ = BΦΛ`, `ABΦ = ΦΛ`, and `BAΦ = ΦΛ`, where `A` and `B` are real, symmetric,
    `n × n` matrices and `B` is positive definite. In particular, we shall consider
    the problem `AΦ = BΦΛ`, although the remaining two problems are similar. The matrix
    pair (pencil) `(A, B)` is commonly referred to as a *symmetric-definite pencil*
    [Golub and VanLoan 83].


    As seen before, the conventional (numerical analysis) method for evaluating `Φ`
    and `Λ` requires the computation of `(A, B)` after collecting all of the samples,
    and then the application of a numerical procedure [Golub and VanLoan 83]; in other
    words, the approach works in a *batch* fashion. In contrast, for the online case,
    matrices `(A, B)` are unknown. Instead, there are available two sequences of random
    matrices `{A[k], B[k]}` with `lim[k→∞] E[A[k]] = A` and `lim[k→∞] E[B[k]] = B`.
    For every sample `(A[k], B[k])`, we need to obtain the current estimates `(Φ[k],
    Λ[k])` of `(Φ, Λ)` respectively, such that `(Φ[k], Λ[k])` converge strongly to
    `(Φ, Λ)`.


    ### Application of GEVD in Pattern Recognition


    In pattern recognition, there are problems where we are given samples (`x ∈ ℜⁿ`)
    from different populations or pattern classes. The well-known problem of linear
    discriminant analysis (LDA) [Chatterjee et al. Nov 97, May 97, Mar 97] seeks a
    transform `W ∈ ℜⁿˣᵖ` (`p ≤ n`), such that the interclass distance (measured by
    the scatter of the patterns around their mixture mean) is maximized, while at
    the same time the intra-class distance (measured by the scatter of the patterns
    around their respective class means) is as small as possible. The objective of
    this transform is to group the classes into well-separated clusters. The former
    scatter matrix, known as the mixture scatter matrix, is denoted by `A`, and the
    latter matrix, known as the within-class scatter matrix, is denoted by `B` [Fukunaga
    90]. When the first column `w` of `W` is needed (i.e., `p = 1`), the problem can
    be formulated in the constrained optimization framework as


    Maximize `wᵀ A w` subject to `wᵀ B w = 1`. (7.1)


    A twin problem to (7.1) is to maximize the Rayleigh quotient criterion [Golub
    and VanLoan 83] with respect to `w`:


    `J(w; A, B) = (wᵀ A w) / (wᵀ B w)`. (7.2)


    A solution to (7.1) or (7.2) leads to the generalized eigen-decomposition problem
    `A w = λ B w`, where `λ` is the largest generalized eigenvalue of `A` with respect
    to `B`. In general, the `p` columns of `W` are the `p ≤ n` orthogonal unit generalized
    eigenvectors `φ[1], ..., φ[p]` of `A` with respect to `B` where


    `φᵢᵀ A φⱼ = λᵢ δᵢⱼ`, and `φᵢᵀ B φⱼ = δᵢⱼ` for `i = 1, …, p`, (7.3)


    where `λ[1] > ... > λ[p] > λ[p+1] ≥ ... ≥ λ[n] > 0` are the `p` largest generalized
    eigenvalues of `A` with respect to `B` in descending order of magnitude. In summary,
    LDA is a powerful feature extraction tool for the class separability feature [Chatterjee
    May 97], and our adaptive algorithms are suited to this.


    ### Application of GEVD in Signal Processing


    Next, let’s discuss an analogous problem of detecting a desired signal in the
    presence of interference. Here, we seek the optimum linear transform `W` for weighting
    the signal plus interference such that the desired signal is detected with maximum
    power and minimum interference. Given the matrix pair `(A, B)`, where `A` is the
    correlation matrix of the signal plus interference plus noise and `B` is the correlation
    matrix of interference plus noise, we can formulate the signal detection problem
    as the constrained maximization problem in (7.1). Here, we maximize the signal
    power and minimize the power of the interference. The solution for `W` consists
    of the `p ≤ n` largest generalized eigenvectors of the matrix pencil `(A, B)`.
    Adaptive generalized eigen-decomposition algorithms also allow the tracking of
    slow changes in the incoming data [Chatterjee et al. Nov 97, Mar 97; Chen et al.
    2000].'
