    MNIST dataset [Keras, MNIST]. The original data is 28x28=784 dimensional. I used
    the first 100 principal components and reconstructed the images. This is 7.8x
    reduction in data. The reconstructed images look similar to the original.


    ![](images/522202_1_En_5_Chapter/522202_1_En_5_Fig2_HTML.jpg)


    Figure 5-2


    Original MNIST number 9 on the left and reconstructed number on the right after
    7.8x compression with principal components


    The following Python code can be used to PCA compress the data `X[nDim,nSamples]`:


    ```

