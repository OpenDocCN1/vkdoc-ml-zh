- fmt: '# 1. Introduction


    In this chapter, I present the adaptive computation of important features for
    data representation and classification. I demonstrate the importance of these
    features in machine learning, data visualization, and data analytics. I also show
    the importance of these algorithms in multiple disciplines and present how these
    algorithms are obtained there. Finally, I present a common methodology to derive
    these algorithms. This methodology is of high practical value since practitioners
    can use this methodology to derive their own features and algorithms for their
    own use cases.


    For these data features, I assume that the data arrives as a sequence, has to
    be used instantaneously, and the entire batch of data cannot be stored in memory.


    In machine learning and data analysis problems such as regression, classification,
    enhancement, or visualization, effective representation of data is key. When this
    data is multi-dimensional and time varying, the computational challenges are more
    formidable. Here we not only need to compute the represented data in a timely
    manner, but also adapt to the changing input in a fast, efficient, and robust
    manner.


    A well-known method of data compression/representation is the Karhunen-Loeve theorem
    [Karhunen–Loève theorem, Wikipedia] or eigenvector orthonormal expansion [Fukunaga
    90]. This method is also known as principal component analysis (PCA) [principal
    component analysis, Wikipedia]. Since each eigenvector can be ranked by its corresponding
    eigenvalue, a subset of the “best” eigenvectors can be chosen as the most relevant
    features.


    Figure [1-1](#522202_1_En_1_Chapter.xhtml#Fig1) shows two-class, two-dimensional
    data in which the best feature for data representation is the projection of the
    data on vector `e[1]`, which captures the most significant properties of the data
    from the two classes.


    ![](images/522202_1_En_1_Chapter/522202_1_En_1_Fig1_HTML.png)


    Figure 1-1


    Data representation feature `e[1]` that best represents the data from the two
    classes [Source: Chatterjee et al. IEEE Transactions on Neural Networks, Vol.
    8, No. 3, pp. 663-678, May 1997]


    In classification, however, you generally want to extract features that are effective
    for preserving *class separability*. Simply stated, the goal of classification
    feature extraction is to find a transform that maps the raw measurements into
    a smaller set of features, which contain all the discriminatory information needed
    to solve the overall pattern recognition problem.


    Figure [1-2](#522202_1_En_1_Chapter.xhtml#Fig2) shows the same two-class, two-dimensional
    data in which the best feature for classification is vector `e[2]`, whereby projection
    of the data on `e[2]` leads to best class separability.


    ![](images/522202_1_En_1_Chapter/522202_1_En_1_Fig2_HTML.jpg)


    Figure 1-2


    Data classification feature `e[2]` that leads to best class separability [Source:
    Chatterjee et al. IEEE Transactions on Neural Networks, Vol. 8, No. 3, pp. 663-678,
    May 1997]


    Before I present the adaptive algorithms for streaming data in the following chapters,
    I need to discuss the following:


    1. Commonly used features that are obtained by a linear transform of the data
    and are used with streaming data for edge applications

    2. Historical relevance of these features and how we derive them from different
    disciplines

    3. Why we want to use adaptive algorithms to compute these features

    4. How to create a common mathematical framework to derive adaptive algorithms
    for these features and many more


    ## 1.1 Commonly Used Features Obtained by Linear Transform


    In this section, I discuss four commonly used features for data analytics and
    machine learning. These features are effective in data classification and representation,
    and can be easily obtained by a simple linear transform of the data. The simplicity
    and effectiveness of these features makes them useful for streaming data and edge
    applications.


    In mathematical terms, let `{x[k]}` be an *n*-dimensional (zero mean) sequence
    that represents the data. We are seeking a matrix sequence `{W[k]}` and a transform:


    ![$$ {\mathbf{y}}_k={W}_k^T{\mathbf{x}}_k $$](images/522202_1_En_1_Chapter/522202_1_En_1_Chapter_TeX_IEq1.png),
    (1.1)


    such that the linear transform `y[k]` has properties of data representation and
    is our desirable feature. I discuss a few of these features later.


    **Definition:** Define the data correlation matrix `A` of `{x[k]}` as


    ![$$ A=\underset{k\to \infty }{\lim }E\left[{\mathbf{x}}_k{\mathbf{x}}_k^T\right]
    $$](images/522202_1_En_1_Chapter/522202_1_En_1_Chapter_TeX_IEq2.png). (1.2)


    ### Data Whitening


    Data whitening is a process of decorrelating the data such that all components
    have unit variance. It is a data preprocessing step in machine learning and data
    analysis to “normalize” the data so that it is easier to model. Here the linear
    transform `y[k]` of the data has the property ![$$ E\left[{\mathbf{y}}_k{\mathbf{y}}_k^T\right]
    $$](images/522202_1_En_1_Chapter/522202_1_En_1_Chapter_TeX_IEq3.png)`= I[n]` (identity).
    I discuss in Chapter [3](#522202_1_En_3_Chapter.xhtml) that the optimal value
    of `W[k] = A^(–½)`.


    Figure [1-3](#522202_1_En_1_Chapter.xhtml#Fig3) shows the correlation matrices
    of the original and whitened data. The original random normal data is highly correlated
    as shown by the colors on all axes. The whitened data is fully uncorrelated with
    no correlation between components since only diagonal values exist.


    ![](images/522202_1_En_1_Chapter/522202_1_En_1_Fig3_HTML.jpg)


    Figure 1-3


    Original correlated data is uncorrelated by the data whitening algorithm


    The Python code to generate the whitened data from original dataset `X[nDim, nSamples]`
    is


    ```python

    from scipy.linalg import eigh

    # Compute Correlation matrix and eigen vectors of the original data

    corX = (X @ X.T) / nSamples

    # generate the whitened data

    eigvals, eigvecs = eigh(corX)

    V = np.fliplr(eigvecs)

    D  = np.diag(np.sqrt(1/eigvals[::-1]))

    Y = V @ D @ V.T @ X

    corY = (Y @ Y.T)/nSamples

    # Plot the original and whitened correlation matrices

    import seaborn as sns

    plt.figure(figsize=(10, 4))

    plt.rcParams.update({''font.size'': 16})

    plt.subplot(1, 2, 1)

    sns.heatmap(corX, linewidth=0.5, linecolor="green", cmap=''RdBu'', cbar=False)

    plt.title("Original data")

    plt.subplot(1, 2, 2)

    sns.heatmap(corY, linewidth=0.5, linecolor="green", cmap=''hot'', cbar=False)

    plt.title("Whitened data")

    plt.show()

    ```'
