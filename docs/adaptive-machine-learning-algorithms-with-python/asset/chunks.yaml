    ## 5.5 PF Algorithms


    ### PF Homogeneous Algorithm


    We obtain the objective function for the penalty function homogeneous PCA algorithm
    by expressing the Rayleigh quotient criterion as the following penalty function:


    ![$$ J\left({\mathbf{w}}_k^i;{A}_k\right)=-{{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i+\mu
    \left(\sum \limits_{j=1,j\ne i}^p{\left({{\mathbf{w}}_k^j}^T{\mathbf{w}}_k^i\right)}^2+\frac{1}{2}{\left({{\mathbf{w}}_k^i}^T{\mathbf{w}}_k^i-1\right)}^2\right)
    $$](images/522202_1_En_5_Chapter/522202_1_En_5_Chapter_TeX_IEq42.png),  (5.16)


    where `μ>0` and `i=1,…,p`. From the gradient of (5.16) with respect to `w_k^i`,
    we obtain the PF homogeneous adaptive gradient descent algorithm for PCA as


    ![$$ {W}_{k+1}={W}_k+{\eta}_k\left({A}_k{W}_k-\mu {W}_k\left({W}_k^T{W}_k-{I}_p\right)\right)
    $$](images/522202_1_En_5_Chapter/522202_1_En_5_Chapter_TeX_IEq44.png),     (5.17)


    where `I[p]` is a `p×p` identity matrix.


    `W[k]` converges to `W^*=ΦDU`, where `D=[D[1]|0]^T∈ℜ^(n×p)`, `D[1]=diag(d[1],...,d[p])∈ℜ^(p×p)`,
    `d[i]=±√(1+(λ_i/μ))` for `i=1,...,p`, and `U∈ℜ^(p×p)` is an arbitrary rotation
    matrix. Recall that `λ[1]>λ[2]>...>λ[p]>λ[p+1]≥...≥λ[n] >0` are the eigenvalues
    of `A`, and `ϕ[i]` as the eigenvector corresponding to `λ[i]` such that `Φ=[ϕ[1]
    ... ϕ[n]]` are orthonormal.


    ### PF Deflation Algorithm


    The objective function for the PF deflation PCA algorithm is


    ![$$ J\left({\mathbf{w}}_k^i;{A}_k\right)=-{{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i+\mu
    \left(\sum \limits_{j=1}^{i-1}{\left({{\mathbf{w}}_k^j}^T{\mathbf{w}}_k^i\right)}^2+\frac{1}{2}{\left({{\mathbf{w}}_k^i}^T{\mathbf{w}}_k^i-1\right)}^2\right)
    $$](images/522202_1_En_5_Chapter/522202_1_En_5_Chapter_TeX_IEq46.png),  (5.18)


    where `μ > 0` and `i=1,…,p`. The PF deflation adaptive gradient descent algorithm
    for PCA is


    ![$$ {W}_{k+1}={W}_k+{\eta}_k\left({A}_k{W}_k-\mu {W}_k UT\left({W}_k^T{W}_k-{I}_p\right)\right)
    $$](images/522202_1_En_5_Chapter/522202_1_En_5_Chapter_TeX_IEq47.png),     (5.19)


    where `UT[⋅]` sets all elements below the diagonal of its matrix argument to zero.
    `W[k]` converges to `W^*=[d[1]ϕ[1] d[2]ϕ[2] … d[p]ϕ[p]]`, where `d[i] = ±√(1+(λ_i/μ))`.


    ### PF Weighted Algorithm


    The objective function for the PF weighted PCA algorithm is


    ![$$ J\left({\mathbf{w}}_k^i;{A}_k\right)=-{c}_i{{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i+\mu
    \left(\sum \limits_{j=1,j\ne i}^p{c}_j{\left({{\mathbf{w}}_k^j}^T{\mathbf{w}}_k^i\right)}^2+\frac{c_i}{2}{\left({{\mathbf{w}}_k^i}^T{\mathbf{w}}_k^i-1\right)}^2\right)
    $$](images/522202_1_En_5_Chapter/522202_1_En_5_Chapter_TeX_IEq49.png) (5.20)


    where `c[1]>c[2]>…>c[p]>0`, `μ > 0`, and `i=1,…,p`. The PF weighted adaptive gradient
    descent algorithm for PCA is


    ![$$ {W}_{k+1}={W}_k+{\eta}_k\left({A}_k{W}_kC-\mu {W}_kC\left({W}_k^T{W}_k-{I}_p\right)\right)
    $$](images/522202_1_En_5_Chapter/522202_1_En_5_Chapter_TeX_IEq50.png),     (5.21)


    where `C=diag(c[1],…,c[p])`. `W[k]` converges to `W^*=[d[1]ϕ[1] d[2]ϕ[2] … d[p]ϕ[p]]`,
    where `d[i] = ±√(1+(λ_i/μ))`.


    ### PF Algorithm Python Code


    The following Python code implements the PF PCA algorithms with data `X[nDim,nSamples]`:


    ```python

    from numpy import linalg as la

    nEA = 4 # number of PCA components computed

    nEpochs  = 2

    A  = np.zeros(shape=(nDim,nDim)) # stores adaptive correlation matrix

    W1 = 0.1 * np.ones(shape=(nDim,nEA)) # weight vectors of all algorithms

    W2 = W1

    W3 = W1

    c = [2-0.3*k for k in range(nEA)]

    C = np.diag(c)

    I  = np.identity(nEA)

    mu = 2

    for epoch in range(nEpochs):

    for iter in range(nSamples):

    cnt = nSamples*epoch + iter

    x = X[:,iter]

    x = x.reshape(nDim,1)

    A = A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - A)

    # Homogeneous Gradient Descent

    W1 = W1 + (1/(100 + cnt))*(A @ W1 - mu * W1 @ ((W1.T @ W1) - I))

    # Deflated Gradient Descent

    W2 = W2 + (1/(100 + cnt))*(A @ W2 - mu * W2 @ np.triu((W2.T @ W2) - I))

    # Weighted Gradient Descent

    W3 = W3 + (1/(100 + cnt))*(A @ W3 @ C - mu * W3 @ C @ ((W3.T @ W3) - I))

    ```


