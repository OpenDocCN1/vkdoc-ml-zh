    *I dedicate this book to my father, Basudev Chatterjee, and all my teachers and
    mentors who have guided and inspired me.*


    Preface


    This book presents several categories of streaming data problems that have significant
    value in machine learning, data visualization, and data analytics. It offers many
    adaptive algorithms for solving these problems on streaming data vectors or matrices.
    Complex neural network-based applications are commonplace and computing power
    is growing exponentially, so why do we need adaptive computation?


    Adaptive algorithms are critical in environments where the data volume is large,
    data has high dimensions, data is time-varying and has changing underlying statistics,
    and we do not have sufficient storage, computing power, and bandwidth to process
    the data with low latency. One such environment is computation on edge devices.


    Due to the rapid proliferation of billions of devices at the cellular edge and
    the exponential growth of machine learning and data analytics applications on
    these devices, there is an urgent need to manage the following on these devices:


    *   Power usage for computation at scale


    *   Non-stationarity of inputs and drift of the incoming data


    *   Latency of computation on devices


    *   Memories and bandwidth of devices


    The [2021 Gartner report on Edge computation](https://www.itweb.co.za/content/lwrKx73KXLL7mg1o)
    [Stratus Technologies, 2021] suggests that device-based computation growth propelled
    by the adoption of cloud and 5G will require us to prioritize and build a framework
    for edge computation.


    In these environments are the following constraints:


    *   The data cannot be batched immediately and needs to be used instantaneously.
    We have a streaming sequence of vectors or matrices as inputs to the algorithms.


    *   The data changes with time. In other words, the data is non-stationary, causing
    significant drift of input features whereby the machine learning models are no
    longer effective over time.


    *   The data volume and dimensionality are large, and we do not have the device
    memory, bandwidth, or power to store or upload the data to the cloud.


    In these applications, we use adaptive algorithms to manage the device’s power,
    memory, and bandwidth so that we can maintain accuracy of the pretrained models.
    Some use cases are the following:


    1.  Calculate feature drift of incoming data and detect training-serving skew
    [Kaz et al*.* 2021] ahead of time.


    2.  Adapt to incoming data drift and calculate features that best fit the data.


    3.  Calculate anomalies in incoming data so that good, clean data is used by the
    models.


    4.  Compress incoming data into features for use in new model creation.


    In Chapter [8](#522202_1_En_8_Chapter.xhtml), I present solutions to these problems
    with adaptive algorithms discussed with real-world data.


    ## Detecting Feature Drift


    See the example where the real-time data [Vinicius Souza et al. 2020] has a gradual
    drift of features. In real-time environments there are changes in the underlying
    distribution of the observed data. These changes in the statistical properties
    of the data are called *drift*. When the changes in statistical properties are
    smooth, it is called *gradual drift*. Figure [1](#522202_1_En_BookFrontmatter_OnlinePDF.xhtml#Fig1)
    shows a slow change in the magnitude of the components of a multivariate data
    over time, showing a gradual drift.


    It’s important to detect these drift components early in the process so that we
    can update the machine learning model to maintain performance. Note that the baseline
    statistics of the data is not known ahead of time.


    ![](images/522202_1_En_BookFrontmatter_Fig1_HTML.png)


    Figure 1


    Data components show gradual drift over time


    I used an adaptive algorithm (see Chapter [5](#522202_1_En_5_Chapter.xhtml)) to
    compute the [principal components](https://en.wikipedia.org/wiki/Principal_component_analysis)
    [principal component analysis, Wikipedia] of the data and derive a metric from
    them. Figure [2](#522202_1_En_BookFrontmatter_OnlinePDF.xhtml#Fig2) shows that
    the metric does not converge to its statistical value (ideally 1) and diverges
    towards 0\. This detects the feature drift quickly so that the edge device can
    update the machine learning model.


    ![](images/522202_1_En_BookFrontmatter_Fig2_HTML.png)


    Figure 2


    An adaptive principal component-based metric detects drift in data early in the
    real-time process


    The downward slope of the detection metric in the graph indicates the gradual
    drift of the features.


    ## Adapting to Drift


    In another type of drift, the data changes its statistical properties abruptly.
    Figure [3](#522202_1_En_BookFrontmatter_OnlinePDF.xhtml#Fig3) shows simulated
    multi-dimensional data that abruptly changes to a different underlying statistic
    after 500 samples.


    ![](images/522202_1_En_BookFrontmatter_Fig3_HTML.png)


    Figure 3


    Simulated data that abruptly changes statistical properties after 500 samples


    The adaptive algorithms help us adapt to this abrupt change and recalculate the
    underlying statistics, in this case, the first two principal eigenvectors of the
    data (see Chapter [6](#522202_1_En_6_Chapter.xhtml)). The ideal values in Figure
    [4](#522202_1_En_BookFrontmatter_OnlinePDF.xhtml#Fig4) are 1\. As the data changes
    abruptly after 500 samples, the value falls and quickly recovers back to 1.


    ![](images/522202_1_En_BookFrontmatter_Fig4_HTML.png)


    Figure 4


    Principal eigenvectors adapt to abruptly changing data


    ## My Approach


    ### Adaptive Algorithms and Best Practices


    In this book, I offer over 50 examples of adaptive algorithms to solve real-world
    problems. I also offer best practices to select the right algorithms for different
    use cases. I formulate these problems as matrix computations, where the underlying
    matrices are unknown. I assume that the entire data is not available at once.
    Instead, I have a sequence of random matrices or vectors from which I compute
    the matrix functions without knowing the matrices. The matrix functions are computed
    adaptively as each sample is presented to the algorithms.


    1.  My algorithms process each incoming sample **x**[*k*] such that at any instant
    *k* all of the currently available data is taken into consideration.


    2.  For each sample, the algorithm estimates the desired matrix functions, and
    its estimates have known statistical properties.


    3.  The algorithms have the ability to adapt to variations in the underlying systems
    so that for each sample **x**[*k*] I obtain the current state of the process and
    not an average over all samples (i.e., I can handle both stationary and non-stationary
    data).'
