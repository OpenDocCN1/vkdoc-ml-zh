    ## 7.3 OJA GEVD Algorithms


    ### OJA Homogeneous Algorithm


    The objective function for the OJA homogeneous algorithm can be written as


    ```

    J(w_k^i; A_k, B_k) = -w_k^i^T A_k B_k^{-1} A_k w_k^i + 1/2 (w_k^i^T A_k w_k^i)^2
    + Σ_{j=1, j≠i}^p (w_k^i^T A_k w_k^j)^2

    ```


    for `i = 1, …, p` (`p ≤ n`). From the gradient of (7.5) with respect to `w_k^i`
    we obtain the following adaptive algorithm:


    ```

    w_{k+1}^i = w_k^i - η_k B_k A_k^{-1} ∇_{w_k^i} J(w_k^i; A_k, B_k)

    ```


    for `i = 1, …, p`. Defining `W_k = [w_k^1 ... w_k^p]`, from (7.6) we get


    ```

    W_{k+1} = W_k + η_k (A_k W_k - B_k W_k W_k^T A_k W_k)

    ```


    ### OJA Deflation Algorithm


    The objective function for the OJA deflation adaptive GEVD algorithm is


    ```

    J(w_k^i; A_k, B_k) = -w_k^i^T A_k B_k^{-1} A_k w_k^i + 1/2 (w_k^i^T A_k w_k^i)^2
    + Σ_{j=1}^{i-1} (w_k^i^T A_k w_k^j)^2

    ```


    for `i = 1, …, p`. From the gradient of (7.8) with respect to `w_k^i`, we obtain
    the OJA deflation adaptive gradient descent algorithm as


    ```

    w_{k+1}^i = w_k^i - η_k (A_k w_k^i - Σ_{j=1}^i B_k w_k^j w_k^j^T A_k w_k^i)

    ```


    for `i = 1, …, p` (`p ≤ n`). The matrix form of the algorithm is


    ```

    W_{k+1} = W_k + η_k (A_k W_k - B_k W_k UT(W_k^T A_k W_k))

    ```


    where `UT[·]` sets all elements below the diagonal of its matrix argument to zero.'
