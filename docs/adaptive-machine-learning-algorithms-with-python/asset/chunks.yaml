    Figures [6-2](#522202_1_En_6_Chapter.xhtml#Fig2) through [6-4](#522202_1_En_6_Chapter.xhtml#Fig4)
    show the iterates of the four algorithms to compute the first four principal eigenvectors
    of *A*. For the gradient descent (6.4) algorithm, I used *η*[*k*]=1/(400+*k*).
    For the conjugate direction method, I used the Hestenes-Stiefel [Nonlinear conjugate
    gradient method, Wikipedia] method (see Section [6.4](#522202_1_En_6_Chapter.xhtml#Sec8))
    to compute ![$$ {\beta}_k^i $$](images/522202_1_En_6_Chapter/522202_1_En_6_Chapter_TeX_IEq80.png).
    For the steepest descent, conjugate direction, and Newton-Raphson methods, I chose
    ![$$ {\alpha}_k^i $$](images/522202_1_En_6_Chapter/522202_1_En_6_Chapter_TeX_IEq81.png)
    by solving a cubic equation as described in Sections [6.3](#522202_1_En_6_Chapter.xhtml#Sec5),
    [6.4](#522202_1_En_6_Chapter.xhtml#Sec8), and [6.5](#522202_1_En_6_Chapter.xhtml#Sec10),
    respectively.


    ![](images/522202_1_En_6_Chapter/522202_1_En_6_Fig4_HTML.png)


    Figure 6-4


    Convergence of the first four principal eigenvectors of A by the gradient descent
    (6.4) and Newton-Raphson (6.12) algorithms for stationary data


    ![](images/522202_1_En_6_Chapter/522202_1_En_6_Fig3_HTML.png)


    Figure 6-3


    Convergence of the first four principal eigenvectors of A by the gradient descent
    (6.4) and conjugate direction (6.11) algorithms for stationary data


    ![](images/522202_1_En_6_Chapter/522202_1_En_6_Fig2_HTML.png)


    Figure 6-2


    Convergence of the first four principal eigenvectors of A by the gradient descent
    (6.4) and steepest descent (6.8) algorithms for stationary data


    It is clear from Figures [6-2](#522202_1_En_6_Chapter.xhtml#Fig2) through [6-4](#522202_1_En_6_Chapter.xhtml#Fig4)
    that the steepest descent, conjugate direction, and Newton-Raphson algorithms
    converge faster than the gradient descent algorithm in spite of a careful selection
    of *η*[*k*] for the gradient descent algorithm. Besides, the new algorithms do
    not require ad-hoc selections of *η*[*k*]. Instead, the gain parameters ![$$ {\alpha}_k^i
    $$](images/522202_1_En_6_Chapter/522202_1_En_6_Chapter_TeX_IEq82.png) and ![$$
    {\beta}_k^i $$](images/522202_1_En_6_Chapter/522202_1_En_6_Chapter_TeX_IEq83.png)
    are computed from the online data sequence.


    Comparison between the four algorithms show small differences between them for
    the first four principal eigenvectors of *A*. Among the three faster converging
    algorithms, the steepest descent algorithm (6.8) requires the smallest amount
    of computation per iteration. Therefore, these experiments show that the steepest
    descent adaptive algorithm (6.8) is most suitable for optimum speed and computation
    among the four algorithms presented here.'
  trans: '

    ### 平稳数据的实验


    我生成了 2000 个 10 维高斯数据样本（即 *n*=10），均值为零，协方差如下所示。请注意，该协方差矩阵源自[Okada and Tomita 85]中的第一个协方差矩阵乘以
    2。协方差矩阵为


    ![](img/522202_1_En_6_Figa_HTML.png)


    该协方差矩阵的特征值为


    11.7996, 5.5644, 3.4175, 2.0589, 0.7873, 0.5878, 0.1743, 0.1423, 0.1213, 0.1007。


    显然，前四个特征值显著，我自适应地计算了对应的特征向量（即 *p*=4）。10 维随机平稳数据的图示见图 6-1。


    ![](img/522202_1_En_6_Fig1_HTML.png)


    图 6-1


    10 维平稳随机正态数据


    为了计算在线数据序列 {*A*[*k*]}，我根据上述协方差矩阵生成了随机数据向量 {**x**[*k*]}。我使用第 2 章中的算法(2.3)，从 {**x**[*k*]}
    生成了 {*A*[*k*]}。在收集完所有 500 个样本 **x**[*k*] 后，我计算了相关矩阵 *A*，公式如下：


    ![$$ A=\frac{1}{2000}\sum \limits_{i=1}^{2000}{\mathbf{x}}_i{\mathbf{x}}_i^T.
    $$](img/522202_1_En_6_Chapter_TeX_Equg.png)


    我将通过标准数值分析方法[Golub and VanLoan 83]从该 *A* 计算出的特征向量和特征值称为*实际值*。


    我在随机数据序列 {*A*[*k*]} 上使用了自适应梯度下降法(6.4)、最速下降法(6.8)、共轭方向法(6.11)和牛顿-拉夫逊法(6.12)。所有算法均以
    *W*[0] = 0.1*ONE 初始化，其中 ONE 是一个 10 行 4 列的矩阵，所有元素均为 1。为了衡量算法的收敛性和精度，我计算了每个自适应算法在第
    *k* 次更新时的方向余弦，公式如下：


    方向余弦 (*k*) = ![$$ \frac{\left|{{\mathbf{w}}_k^i}^T{\boldsymbol{\upvarphi}}_i\right|}{\left\Vert
    {\mathbf{w}}_k^i\left\Vert \right\Vert {\boldsymbol{\upvarphi}}_i\right\Vert }
    $$](img/522202_1_En_6_Chapter_TeX_IEq78.png)，     (6.18)


    其中 ![$$ {\mathbf{w}}_k^i $$](img/522202_1_En_6_Chapter_TeX_IEq79.png) 是 *A*[*k*]
    在第 *k* 次更新时的估计特征向量，**ϕ**[*i*] 是通过传统数值分析方法从所有收集样本中计算出的实际特征向量。


    图 6-2 至 6-4 展示了四种算法计算 *A* 的前四个主特征向量的迭代过程。对于梯度下降法(6.4)，我使用了 *η*[*k*]=1/(400+*k*)。对于共轭方向法，我使用了
    Hestenes-Stiefel[非线性共轭梯度法，维基百科]方法（见第 6.4 节）来计算 ![$$ {\beta}_k^i $$](img/522202_1_En_6_Chapter_TeX_IEq80.png)。对于最速下降法、共轭方向法和牛顿-拉夫逊法，我通过求解三次方程来选择
    ![$$ {\alpha}_k^i $$](img/522202_1_En_6_Chapter_TeX_IEq81.png)，具体方法分别在第 6.3 节、第
    6.4 节和第 6.5 节中描述。


    ![](img/522202_1_En_6_Fig4_HTML.png)


    图 6-4


    平稳数据下，梯度下降法(6.4)和牛顿-拉夫逊法(6.12)算法对 A 的前四个主特征向量的收敛情况


    ![](img/522202_1_En_6_Fig3_HTML.png)


    图 6-3


    平稳数据下，梯度下降法(6.4)和共轭方向法(6.11)算法对 A 的前四个主特征向量的收敛情况


    ![](img/522202_1_En_6_Fig2_HTML.png)


    图 6-2


    平稳数据下，梯度下降法(6.4)和最速下降法(6.8)算法对 A 的前四个主特征向量的收敛情况


    从图 6-2 至 6-4 可以清楚地看出，尽管为梯度下降法精心选择了 *η*[*k*]，但最速下降法、共轭方向法和牛顿-拉夫逊法的收敛速度仍快于梯度下降法。此外，新算法无需临时选择
    *η*[*k*]。相反，增益参数 ![$$ {\alpha}_k^i $$](img/522202_1_En_6_Chapter_TeX_IEq82.png)
    和 ![$$ {\beta}_k^i $$](img/522202_1_En_6_Chapter_TeX_IEq83.png) 是根据在线数据序列计算得出的。


    四种算法之间的比较显示，对于 *A* 的前四个主特征向量，它们之间的差异很小。在三种收敛速度更快的算法中，最速下降法(6.8)每次迭代所需的计算量最小。因此，这些实验表明，在本文介绍的四种算法中，最速下降自适应算法(6.8)在速度和计算量方面最为合适。

    '
- fmt: '### Experiments with Non-Stationary Data


    In order to demonstrate the tracking ability of the algorithms with non-stationary
    data, I generated 500 samples of zero-mean 10-dimensional Gaussian data (i.e.,
    `n=10`) with the covariance matrix stated before. I then abruptly changed the
    data sequence by generating 1,000 samples of zero-mean 10-dimensional Gaussian
    data with the covariance matrix below (the fifth covariance matrix from [Okada
    and Tomita 85] multiplied by 4):


    ![](images/522202_1_En_6_Chapter/522202_1_En_6_Figb_HTML.png)


    The eigenvalues of this covariance matrix are


    23.3662, 16.5698, 6.8611, 1.8379, 1.5452, 0.7010, 0.3851, 0.3101, 0.2677, 0.2278,


    which are drastically different from the previous eigenvalues. Figure [6-5](#522202_1_En_6_Chapter.xhtml#Fig5)
    plots the 10-dimensional non-stationary data.


    ![](images/522202_1_En_6_Chapter/522202_1_En_6_Fig5_HTML.png)


    Figure 6-5


    10-dimensional non-stationary random data with abrupt changes after 500 samples


    I generated `{A[k]}` from `{x[k]}` by using the algorithm (2.5 in Chapter [2](#522202_1_En_2_Chapter.xhtml))
    with `β=0.995`. I used the adaptive gradient descent (6.4), steepest descent (6.8),
    conjugate direction (6.11), and Newton-Raphson (6.12) algorithms on the random
    observation sequence `{A[k]}` and measured the convergence accuracy of the algorithms
    by computing the direction cosine at `k`-th update of each adaptive algorithm
    as shown in (6.18). I started all algorithms with `W[0] = 0.1*ONE`, where `ONE`
    is a 10 X 4 matrix whose all elements are ones. Here again I computed the first
    four eigenvectors (i.e., `p=4`).


    Figures [6-6](#522202_1_En_6_Chapter.xhtml#Fig6) through [6-8](#522202_1_En_6_Chapter.xhtml#Fig8)
    show the iterates of the four algorithms to compute the first four principal eigenvectors
    of the two covariance matrices described before. For the conjugate direction method,
    I used the Hestenes-Stiefel [nonlinear conjugate gradient method, Wikipedia] method
    to compute `β_k^i`. For the steepest descent, conjugate direction, and Newton-Raphson
    methods, I chose `α_k^i` by solving a cubic equation as described in Sections
    [6.3](#522202_1_En_6_Chapter.xhtml#Sec5) through [6.5](#522202_1_En_6_Chapter.xhtml#Sec10).


    ![](images/522202_1_En_6_Chapter/522202_1_En_6_Fig8_HTML.jpg)


    Figure 6-8


    Convergence of the first four principal eigenvectors of two covariance matrices
    by the gradient descent (6.4) and Newton-Raphson (6.12) algorithms for non-stationary
    data


    ![](images/522202_1_En_6_Chapter/522202_1_En_6_Fig7_HTML.jpg)


    Figure 6-7


    Convergence of the first four principal eigenvectors of two covariance matrices
    by the gradient descent (6.4) and conjugate direction (6.11) algorithms for non-stationary
    data


    ![](images/522202_1_En_6_Chapter/522202_1_En_6_Fig6_HTML.jpg)


    Figure 6-6


    Convergence of the first four principal eigenvectors of two covariance matrices
    by the gradient descent (6.4) and steepest descent (6.8) algorithms for non-stationary
    data


    Once again, it is clear from Figures [6-6](#522202_1_En_6_Chapter.xhtml#Fig6)
    through [6-8](#522202_1_En_6_Chapter.xhtml#Fig8) that the steepest descent, conjugate
    direction, and Newton-Raphson algorithms converge faster and track the changes
    in data much better than the traditional gradient descent algorithm. In some cases,
    such as Figure [6-6](#522202_1_En_6_Chapter.xhtml#Fig6) for the third principal
    eigenvector, the gradient descent algorithm fails as the data sequence changes,
    but the new algorithms perform correctly.


    Comparison between the four algorithms in Figure [6-8](#522202_1_En_6_Chapter.xhtml#Fig8)
    show small differences between them for the first four principal eigenvectors.
    Once again, among the three faster converging algorithms, since the steepest descent
    algorithm (6.8) requires the smallest amount of computation per iteration, it
    is most suitable for optimum speed and computation.


    ### Comparison with State-of-the-Art Algorithms


    I compared the steepest descent algorithm (6.8) with Yang’s PASTd algorithm, Bannour
    and Sadjadi’s RLS algorithm, and Fu and Dowling’s CGET1 algorithm. I first tested
    the four algorithms on the stationary data described in Section 6.6.1.


    I define `ONE` as a 10X4 matrix whose all elements are ones. The initial values
    for each algorithm are as follows:


    1.  The steepest descent algorithm:


    `W[0] = 0.1*ONE`.


    2.  Yang’s PASTd algorithm:


    `W[0] = 0.1*ONE`, `β=0.997` and `d_0^i=0.2` for `i = 1, 2, …, p` (`p ≤ n`).


    3.  Bannour and Sadjadi’s RLS algorithm:


    `W[0] = 0.1*ONE` and `P[0] = ONE`.


    4.  Fu and Dowling’s CGET1 algorithm:


    `W[0] = 0.1*ONE` and `A_0 = x_k x_k^T`.


    I found that the performance of the PASTd and RLS algorithms depended considerably
    on the initial choices of `d_0^i` and `P[0]` respectively. I, therefore, chose
    the initial values that gave the best results for most experiments. The results
    of this experiment are shown in Figure [6-9](#522202_1_En_6_Chapter.xhtml#Fig9).


    ![](images/522202_1_En_6_Chapter/522202_1_En_6_Fig9_HTML.jpg)


    Figure 6-9


    Convergence of the first four principal eigenvectors of A by steepest descent
    (6.8), PASTd, RLS, and CGET1 algorithms for stationary data


    Observe from Figure [6-9](#522202_1_En_6_Chapter.xhtml#Fig9) that the steepest
    descent and CGET1 algorithms perform quite well for all four principal eigenvectors.
    The RLS performed a little better than the PASTd algorithm for the minor eigenvectors.
    For the major eigenvectors, all algorithms performed well. The differences between
    the algorithms were evident for the minor (third and fourth) eigenvectors.


    I next applied the four algorithms on non-stationary data described in Section
    6.6.2 with `β=0.995` in eq. (2.5, Chapter [2](#522202_1_En_2_Chapter.xhtml)).
    The results of this experiment are shown in Figure [6-10](#522202_1_En_6_Chapter.xhtml#Fig10).


    ![](images/522202_1_En_6_Chapter/522202_1_En_6_Fig10_HTML.jpg)


    Figure 6-10


    Convergence of the first four principal eigenvectors of two covariance matrices
    by the steepest descent (6.8), PASTd, RLS, and CGET1 algorithms for non-stationary
    data


    Observe that the steepest descent and CGET1 algorithms perform quite well for
    all four principal eigenvectors. The PASTd algorithm performs better than the
    RLS algorithm in handling non-stationarity. This is expected since the PASTd algorithm
    accounts for non-stationarity with a forgetting factor of `β=0.995`, whereas the
    RLS algorithm has no such option.'
