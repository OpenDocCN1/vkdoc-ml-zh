    3. Note that `A[k] ∈ ℜ^(n×n)`, `B[k] ∈ ℜ^(n×n)` and `W[k] ∈ ℜ^(n×p)`. I presented
    the computation complexity of each algorithm in terms of the matrix dimensions
    `n` and `p`.

    4. The convergence performance is determined based on the speed of convergence
    of the principal and the minor components. I rated convergence in a scale of 1-10
    where 10 is the fastest converging algorithm.

