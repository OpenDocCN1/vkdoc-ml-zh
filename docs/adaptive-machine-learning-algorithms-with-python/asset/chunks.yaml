    ### 我的方法：流式数据的自适应处理


    当我们面对连续的数据样本序列时，批处理算法便不再适用。此时，需要采用自适应算法来解决矩阵代数问题。这类算法的一个直接优势是，它们可以应用于实时问题，例如边缘计算、自适应数据压缩
    [Le Gall 91]、用于噪声分析和源定位的天线阵列处理 [Owsley 78]，以及用于频率估计的自适应谱分析 [Pisarenko 73]。


    我的方法是提供计算简单的自适应算法，用于处理来自流式数据的矩阵计算。请注意，在以下环境中，自适应算法至关重要：数据量大、数据维度高、数据随时间变化且其底层统计特性也在变化，并且我们没有足够的存储、计算和带宽来以低延迟处理数据。边缘设备和边缘计算就是这样的环境之一。


    例如，给定客户电子购物数据的流式样本 {**x**[*k*]}，我们需要从数据流中计算出一个关键的客户情感指标 **w**[*k*]。为此，我们需要设计一个**简单的更新规则**，以便在新数据
    **x** 可用时更新客户情感指标 **w**。这个简单的更新规则会在新数据 **x**[*k*] 可用时，将情感指标 **w**[*k*] 更新为其最新值
    **w**[*k*+1]。其格式为 **w**[*k*+1]= **w**[*k*] + *f*(**w**[*k*],**x**[*k*])，其中：


    *   **w**[*k*] 是情感指标的上一个值，

    *   **w**[*k*+1] 是情感指标的最新更新值，

    *   **x**[*k*] 是用于计算 **w**[*k*+1] 的最新数据，以及

    *   *f*(.) 是关于 **w**[*k*] 和 **x**[*k*] 的一个简单函数。


    这个更新规则的一个例子是著名的 [Oja 82] 算法，用于计算流式序列 {**x**[*k*]} 的第一个主特征向量：


    ![$$ {\mathbf{w}}_{k+1}={\mathbf{w}}_k+\eta \left({\mathbf{x}}_k{\mathbf{x}}_k^T-{\mathbf{w}}_k{\mathbf{w}}_k^T{\mathbf{x}}_k{\mathbf{x}}_k^T\right){\mathbf{w}}_k
    $$](img/522202_1_En_1_Chapter_TeX_IEq23.png)，     (1.19)


    其中 η>0 是一个小的增益常数。在该算法中，对于每个样本 **x**[*k*]，更新过程只需要简单的矩阵-向量乘法，并且向量 **w**[*k*] 会收敛到数据相关矩阵
    *A* 的主特征向量。显然，这可以很容易地在小型 CPU 上实现。


    图 1-11 展示了一个多变量电子购物点击流数据集 [Apczynski M. et al*.*]。自适应更新规则 (1.19) 被用于计算买家定价情感指标。左侧显示了数据，右侧显示了自适应计算出的情感指标（理想值为
    1）。随着新数据的到来，情感指标被自适应地更新，并且情感值迅速收敛到其理想值 1。


    ![](img/522202_1_En_1_Fig11_HTML.png)


    图 1-11


    左侧为电子购物点击流数据，右侧为通过更新规则 (1.19) 计算出的买家情感指标（理想值 = 1）


    与传统的迭代批处理解决方案相比，自适应算法有几个优点和缺点。


    优点包括：


    *   传统解决方案会找出所有特征向量和特征值，而自适应解决方案仅计算所需的特征向量。在许多应用中，我们并不需要特征值。因此，自适应算法应该更高效。

    *   此外，自适应算法的计算复杂度取决于矩阵-向量乘积 *A***x** 的效率。当矩阵 *A* 具有某种结构（例如稀疏、汉克尔或托普利兹矩阵）时，这些方法可以更加高效，因为可以使用
    FFT 来加速计算。

    *   自适应算法很容易适应时变多维过程的框架，例如自适应信号处理，其中输入过程是持续更新的。


    缺点包括：


    *   自适应算法为当前数据集生成特征值的近似值，而批处理算法则提供精确值。

    *   自适应方法需要一段“启动”时间才能达到高精度，如图 1-10 中的曲线所示。


    ### 自适应算法的要求


    从前面的讨论可以清楚地看出，用于矩阵计算的自适应算法需要计算成本低廉，以便计算过程能够跟上输入数据流的速度。我们还要求估计值能够强收敛到其真实值。因此，我们期望我们的自适应算法满足以下约束条件：


    *   算法应能适应数据的微小变化，这对于实时应用非常有用。

    *   从算法获得的估计值应具有已知的统计特性。

    *   与自适应算法相关的网络架构由单层或双层网络中的线性单元组成，这样网络可以很容易地用简单的 CPU 实现，无需特殊硬件。

    *   算法涉及的计算成本低廉，以便统计过程能够在每个数据样本到达时对其进行处理。

    *   从算法获得的估计值应强收敛到其真实值。


    基于这些要求，我们着手设计能够解决本书中考虑的矩阵代数问题的自适应算法。本书的目标是开发多种神经形态自适应算法来解决矩阵代数问题。


    尽管我将讨论许多用于求解矩阵函数的自适应算法，但大多数算法都遵循以下通用形式：


    *W*[*k* + 1] = *W*[*k*] + *ηH*(**x**[*k*], *W*[*k*])，     (1.20)


    其中 *H*(**x**[*k*],*W*[*k*]) 满足某些连续性和正则性属性 [Ljung 77,78,84,92]，并且 η > 0 是一个小的增益常数。这些算法满足前面概述的要求。


    ### 自适应矩阵计算算法的实际应用与 GitHub


    在第 8 章中，我将讨论这些自适应矩阵计算算法的几个实际应用。我还将这些应用的代码发布在公共 GitHub 仓库 [Chanchal Chatterjee
    GitHub] 中。

    '
- fmt: '# 1.4 Common Methodology for Derivations of Algorithms


    My contributions in this book are two-fold:


    1. I present a common methodology to derive and analyze each adaptive algorithm.

    2. I present adaptive algorithms to a number of matrix algebra problems.


    The literature for adaptive algorithms for matrix computation offers a wide range
    of techniques (including ad hoc methods) and various types of convergence procedures.
    In this book, I present a *common methodology* to derive and prove the convergence
    of the adaptive algorithms (all proofs are in the GitHub).


    The advantage of adopting this is to allow the reader to follow the methodology
    and derive new adaptive algorithms for their use cases.


    In the following chapters, I follow the following steps to derive each algorithm:


    1. **Objective function**


    I first present an *objective function* `J(W; A[k])` such that the minimizer `W*`
    of `J` is the desired matrix function of the data matrix `A`.


    2. **Derive the adaptive algorithm**


    I derive an *adaptive update rule* for matrix `W` by applying the gradient descent
    technique on the objective function `J(W; A[k])`. The adaptive gradient descent
    update rule is


    `W[k + 1] = W[k] - η[k] ∇[W] J(W[k], A[k]) = W[k] + η[k] h(W[k], A[k])`, (1.21)


    where the function `h(W[k], A[k])` follows certain continuity and regularity properties
    and `η[k]` is a decreasing gain sequence.


    3. **Speed up the adaptive algorithm**


    The availability of the objective function `J(W; A)` allows us to speed up the
    adaptive algorithm by applying speedup techniques in optimization theory such
    as steepest descent, conjugate direction, Newton-Raphson, and recursive least
    squares. Details of these methods for principal component analysis are given in
    Chapter [6](#522202_1_En_6_Chapter.xhtml).


    4. **Show the algorithms converge to the matrix functions**


    In this book, I provide numerical experiments to demonstrate the convergence of
    these algorithms. The mathematical proofs are provided in a separate document
    in the GitHub [Chatterjee Github].


    An important benefit of following this methodology is to allow practitioners to
    derive new algorithms for their own use cases.


    ### Matrix Algebra Problems Solved Here


    In the applications, I consider the data as arriving in temporal succession, such
    as in vector sequences `{x[k]}` or `{y[k]}`, or in matrix sequences `{A[k]}` or
    `{B[k]}`. Note that the algorithms given here can be used for non-stationary input
    streams.


    In the following chapters, I present novel adaptive algorithms to estimate the
    following matrix functions:


    - Mean, correlation, and normalized mean of `{x[k]}`

    - Square root (`A^(½)`) and inverse of the square root (`A^(-½)`) of `A` from
    `{x[k]}` or `{A[k]}`

    - Principal eigenvector of `A` from `{x[k]}` or `{A[k]}`

    - Principal and minor eigenvector of `A` from `{x[k]}` or `{A[k]}`

    - Generalized eigenvectors of `A` with respect to `B` from `{x[k]}` and `{z[k]}`
    or `{A[k]}` and `{B[k]}`

    - Singular value decomposition (SVD) of `C` from `{x[k]}` and `{z[k]}` or `{C[k]}`


    Besides these algorithms, I also discuss


    - Adaptive computation of mean, covariance, and matrix inversion

    - Methods to accelerate the adaptive algorithms by techniques of nonlinear optimization


    ## 1.5 Outline of The Book


    In the following chapters, I discuss in detail the formulation, derivation, convergence,
    and experimental results of many adaptive algorithms for various matrix algebra
    problems.


    In Chapter [2](#522202_1_En_2_Chapter.xhtml), I discuss basic terminologies and
    methods used throughout the remaining chapters. This chapter also discusses adaptive
    algorithms mean, median, correlation, covariance, and inverse correlation/covariance
    computation for both stationary and non-stationary data. I further discusses novel
    adaptive algorithms for normalized mean computation.


    In Chapter [3](#522202_1_En_3_Chapter.xhtml), I discuss three adaptive algorithms
    for the computation of the square root of a matrix sequence. I next discuss three
    algorithms for the inverse square root of the same. I offer objective functions
    and convergence proofs for these algorithms.


    In Chapter [4](#522202_1_En_4_Chapter.xhtml), I discuss 11 algorithms, some of
    them new algorithms, for the adaptive computation of the first principal eigenvector
    of a matrix sequence or the online correlation matrix of a vector sequence. I
    offer best practices to choose the algorithm for a given application. I follow
    the common methodology of deriving and analyzing the convergence of each algorithm,
    supported by experimental results.


    In Chapter [5](#522202_1_En_5_Chapter.xhtml), I present 21 adaptive algorithms
    for the computation of principal and minor eigenvectors of a matrix sequence or
    the online correlation matrix of a vector sequence. These algorithms are derived
    from 7 different types of objective functions, each under 3 different conditions.
    Each algorithm is derived, discussed, and shown to converge analytically and experimentally.
    I offer best practices to choose the algorithm for a given application.


    Since I have objective functions for all of the adaptive algorithms, in Chapter
    [6](#522202_1_En_6_Chapter.xhtml), I deviate from the traditional gradient descent
    method of deriving the algorithms. Here I derive new computationally faster algorithms
    by using steepest descent, conjugate direction, Newton-Raphson, and recursive
    least squares on the objective functions. Experimental results and comparison
    with state-of-the-art algorithms show the faster convergence of these adaptive
    algorithms.


    In Chapter [7](#522202_1_En_7_Chapter.xhtml), I discuss 21 adaptive algorithms
    for generalized eigen-decomposition from two matrix or vector sequences. Once
    again, I follow the common methodology and derive all algorithms from objective
    functions, followed by experimental results.


    In Chapter [8](#522202_1_En_8_Chapter.xhtml), I present real-world applications
    of these algorithms with examples and code.


    The bibliography is in Chapter [9](https://doi.org/10.1007/978-1-4842-8017-1_9).


    # 2. General Theories and Notations


    ## 2.1 Introduction


    In this chapter, I present algorithms for the adaptive solutions of matrix algebra
    problems from a sequence of matrices. The streams or sequences can be random matrices
    `{A[k]}` or `{B[k]}`, or the correlation matrices of random vector sequences `{x[k]}`
    or `{y[k]}`. Examples of matrix algebra are matrix inversion, square root, inverse
    square root, eigenvectors, generalized eigenvectors, singular vectors, and generalized
    singular vectors.


    This chapter additionally covers the basic terminologies and methods used throughout
    the remaining chapters. I also present well-known adaptive algorithms to compute
    the mean, median, covariance, inverse covariance, and correlation matrices from
    random matrix or vector sequences. Furthermore, I present a new algorithm to compute
    the normalized mean of a random vector sequence.


    For the sake of simplicity, let’s assume that the multidimensional data `{x[k]
    ∈ ℜ^n}` arrives as a sequence. From this data sequence, we can derive a matrix
    sequence `{A_k = x_k x_k^T}`. We define the data correlation matrix `A` as follows:


    ```

    A = lim_{k→∞} E[x_k x_k^T]

    ``` (2.1)'
