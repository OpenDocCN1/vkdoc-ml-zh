    We obtain the objective function for the Rayleigh quotient homogeneous GEVD algorithm
    from the Rayleigh quotient criterion (7.2) as follows:


    ![$$ J\left({\mathbf{w}}_k^i;{A}_k,{B}_k\right)=-\frac{{{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i}{{{\mathbf{w}}_k^i}^T{B}_k{\mathbf{w}}_k^i}+\alpha
    \left({{\mathbf{w}}_k^i}^T{B}_k{\mathbf{w}}_k^i-1\right)+2\sum \limits_{j=1,j\ne
    i}^p{\beta}_j{{\mathbf{w}}_k^j}^T{B}_k{\mathbf{w}}_k^i $$](images/522202_1_En_7_Chapter/522202_1_En_7_Chapter_TeX_IEq91.png)
    (7.50)


