    $$](images/522202_1_En_6_Chapter/522202_1_En_6_Chapter_TeX_IEq45.png) as given
    in (6.2). Equation (6.10) is solved to obtain *α* that minimizes ![$$ J\left({\mathbf{w}}_k^i+\alpha
