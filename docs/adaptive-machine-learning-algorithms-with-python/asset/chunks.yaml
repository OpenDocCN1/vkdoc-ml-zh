    ## 6.2 梯度下降算法


    [Chatterjee 等人，《IEEE 神经网络汇刊》，第 11 卷，第 2 期，第 338-355 页，2000 年 3 月]


    (6.1) 关于 ![$$ {\mathbf{w}}_k^i $$](img/522202_1_En_6_Chapter_TeX_IEq3.png) 的梯度为


    ![$$ {\mathbf{g}}_k^i=\left(1/2\right){\nabla}_{{\mathbf{w}}_k^i}J\left({\mathbf{w}}_k^i;{A}_k\right)=-2{A}_k{\mathbf{w}}_k^i+\sum
    \limits_{j=1}^i{A}_k{\mathbf{w}}_k^j{{\mathbf{w}}_k^j}^T{\mathbf{w}}_k^i+\sum
    \limits_{j=1}^i{\mathbf{w}}_k^j{{\mathbf{w}}_k^j}^T{A}_k{\mathbf{w}}_k^i $$](img/522202_1_En_6_Chapter_TeX_IEq4.png)
    对于 *i*=1,…,*p*。     (6.2)


    因此，用于 PCA 的 XU 紧缩自适应梯度下降算法（见第 5.4.2 节）为


    ![$$ {\mathbf{w}}_{k+1}^i={\mathbf{w}}_k^i-{\eta}_k{\mathbf{g}}_k^i={\mathbf{w}}_k^i+{\eta}_k\left(2{A}_k{\mathbf{w}}_k^i-\sum
    \limits_{j=1}^i{A}_k{\mathbf{w}}_k^j{{\mathbf{w}}_k^j}^T{\mathbf{w}}_k^i-\sum
    \limits_{j=1}^i{\mathbf{w}}_k^j{{\mathbf{w}}_k^j}^T{A}_k{\mathbf{w}}_k^i\right)
    $$](img/522202_1_En_6_Chapter_TeX_IEq5.png) 对于 *i*=1,…,*p*，     (6.3)


    其中 *η*[*k*] 是一个递减的增益常数。我们可以简单地用其瞬时值 ![$$ {\mathbf{x}}_k{\mathbf{x}}_k^T $$](img/522202_1_En_6_Chapter_TeX_IEq6.png)
