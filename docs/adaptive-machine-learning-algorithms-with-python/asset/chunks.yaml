    is given by


    ![$$ {\left({B}_k^i\right)}^{-1}={\left({{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^iI-{\tilde{A}}_k^i\right)}^{-1}\approx
    \frac{I+{\tilde{A}}_k^i/{{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i}{{{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i}
    $$](images/522202_1_En_6_Chapter/522202_1_En_6_Chapter_TeX_IEq70.png).     (6.14)


    An adaptive algorithm for inverting the Hessian ![$$ {H}_k^i $$](images/522202_1_En_6_Chapter/522202_1_En_6_Chapter_TeX_IEq71.png)
    in (6.13) can be obtained by two rank-one updates. Let’s define


    ![$$ {C}_k^i={B}_k^i+2{A}_k{\mathbf{w}}_k^i{{\mathbf{w}}_k^i}^T. $$](images/522202_1_En_6_Chapter/522202_1_En_6_Chapter_TeX_IEq72.png)     (6.15)


    Then from (6.13), an update formula for ![$$ {\left({H}_k^i\right)}^{-1} $$](images/522202_1_En_6_Chapter/522202_1_En_6_Chapter_TeX_IEq73.png)
    is


    ![$$ {\left({H}_k^i\right)}^{-1}={\left({C}_k^i\right)}^{-1}-\frac{2{\left({C}_k^i\right)}^{-1}{\mathbf{w}}_k^i{{\mathbf{w}}_k^i}^T{A}_k{\left({C}_k^i\right)}^{-1}}{1+2{{\mathbf{w}}_k^i}^T{A}_k{\left({C}_k^i\right)}^{-1}{\mathbf{w}}_k^i},
    $$](images/522202_1_En_6_Chapter/522202_1_En_6_Chapter_TeX_IEq74.png)     (6.16)


    where ![$$ {\left({C}_k^i\right)}^{-1} $$](images/522202_1_En_6_Chapter/522202_1_En_6_Chapter_TeX_IEq75.png)
    is obtained from (6.15) as


    ![$$ {\left({C}_k^i\right)}^{-1}={\left({B}_k^i\right)}^{-1}-\frac{2{\left({B}_k^i\right)}^{-1}{A}_k{\mathbf{w}}_k^i{{\mathbf{w}}_k^i}^T{\left({B}_k^i\right)}^{-1}}{1+2{{\mathbf{w}}_k^i}^T{\left({B}_k^i\right)}^{-1}{A}_k{\mathbf{w}}_k^i}
    $$](images/522202_1_En_6_Chapter/522202_1_En_6_Chapter_TeX_IEq76.png)     (6.17)


    and ![$$ {\left({B}_k^i\right)}^{-1} $$](images/522202_1_En_6_Chapter/522202_1_En_6_Chapter_TeX_IEq77.png)
    is given in (6.14).


    ### Newton-Raphson Algorithm Code


    The following Python code implements this algorithm with data `X[nDim,nSamples]`:


    ```

    from numpy import linalg as la

    A  = np.zeros(shape=(nDim,nDim)) # stores adaptive correlation matrix

    W1 = 0.1 * np.ones(shape=(nDim,nEA)) # weight vectors of all algorithms

    W2 = W1

    I  = np.identity(nDim)

    Weight = 1

    nEpochs = 1

    for epoch in range(nEpochs):

    for iter in range(nSamples):

    cnt = nSamples*epoch + iter

    # Update data correlation matrix A with current sample x

    x = X1[:,iter]

    x = x.reshape(nDim,1)

    A = Weight * A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - Weight * A)

    # Newton Rhapson

    G = -2* A @ W4 + A@ W4@ np.triu(W4.T @ W4) + W4@ np.triu(W4.T @ A @ W4)

    # Update W

    for i in range(nEA):

    M = np.zeros(shape=(nDim,nDim))

    for k in range(i):

    wk = W4[:,k].reshape(nDim,1)

    M = M + (A @ (wk @ wk.T) + (wk @ wk.T) @ A)

    wi = W4[:,i].reshape(nDim,1)

    F = - 2*A + 2*A @ (wi @ wi.T) + 2 * (wi @ wi.T) @ A + \

    A * (wi.T @ wi) + (wi.T @ A @ wi) * I  +  M

    lam = wi.T @ A @ wi

    Atilde = A

    if (iter > 0):

    invB = (I + (Atilde/lam))/lam

    invC = invB- (2*invB@ A @wi @wi.T @ invB)/(1 + 2*wi.T@ invB@ A @ wi)

    invF = invC- (2*invC@ wi @wi.T @A @ invC)/(1 + 2*wi.T@ A @invC @ wi)

    gi = G[:,i].reshape(nDim,1)

    di = -invF @ gi

    a0 = np.asscalar(gi.T @ di)

    a1 = np.asscalar(di.T @ F @ di)

    a2 = np.asscalar(3* ((wi.T @ A @ di) @ (di.T @ di) + \

    (di.T @ A @ di)*(wi.T @ di)))

    a3 = np.asscalar(2 * (di.T @ A @ di) @ (di.T @ di))

    c  = np.array([a3, a2, a1, a0])

    rts = np.roots(c)

    rs = np.zeros(3)

    r  = np.zeros(3)

    J  = np.zeros(3)

    cnt1 = 0

    for k in range(3):

    if np.isreal(rts[k]):

    re = np.real(rts[k])

    rs[cnt1] = re

    r = W4[:,i] + re * di.reshape(nDim)

    J[cnt1] = np.asscalar(-2*(r.T @ A @ r) + (r.T @ A @ r) * \

    (r.T @ r) + (r.T @ M @ r))

    cnt1 = cnt1 + 1

    iyy = np.argmin(J)

    alpha = rs[iyy]

    W4[:,i] = (W4[:,i] + alpha * di.reshape(nDim)).T

    ```


    ## 6.6 Experimental Results


    I did two sets of experiments to test the performance of the accelerated PCA algorithms.
    I did the first set of experiments on *stationary* Gaussian data and the second
    set on *non*-*stationary* Gaussian data. I then compared the steepest descent
    algorithm against state-of-the-art adaptive PCA algorithms like Yang’s Projection
    Approximation Subspace Tracking, Bannour and Sadjadi’s Recursive Least Squares,
    and Fu and Dowling’s Conjugate Gradient Eigenstructure Tracking algorithms.'
  trans: '

    ## 6.5 牛顿-拉夫森算法


    [Chatterjee 等人，《IEEE 神经网络汇刊》，第 11 卷，第 2 期，第 338-355 页，2000 年 3 月]


    用于 PCA 的自适应牛顿-拉夫森算法为：


    ![$$ {\mathbf{w}}_{k+1}^i={\mathbf{w}}_k^i-{\alpha}_k^i{\left({H}_k^i\right)}^{-1}{\mathbf{g}}_k^i
    $$](img/522202_1_En_6_Chapter_TeX_IEq54.png)，     (6.12)


    其中 ![$$ {\alpha}_k^i $$](img/522202_1_En_6_Chapter_TeX_IEq55.png) 是一个非负标量，![$$
    {H}_k^i $$](img/522202_1_En_6_Chapter_TeX_IEq56.png) 是 (6.7) 中给出的在线海森矩阵。搜索参数 ![$$
    {\alpha}_k^i $$](img/522202_1_En_6_Chapter_TeX_IEq57.png) 通常通过以下方式选择：(1) 最小化 ![$$
    J\left({\mathbf{w}}_k^i+\alpha {\mathbf{d}}_k^i\right) $$](img/522202_1_En_6_Chapter_TeX_IEq58.png)，其中
    ![$$ {\mathbf{d}}_k^i=-{\left({H}_k^i\right)}^{-1}{\mathbf{g}}_k^i $$](img/522202_1_En_6_Chapter_TeX_IEq59.png)；(2)
    作为一个标量常数；或 (3) 作为一个递减序列 {![$$ {\alpha}_k^i $$](img/522202_1_En_6_Chapter_TeX_IEq60.png)}，使得当
    *k*→∞ 时，![$$ {\alpha}_k^i $$](img/522202_1_En_6_Chapter_TeX_IEq61.png)→0。


    该算法的主要关注点在于，![$$ {H}_k^i $$](img/522202_1_En_6_Chapter_TeX_IEq62.png) 应为正定矩阵，并且我们应自适应地获得
    ![$$ {\left({H}_k^i\right)}^{-1} $$](img/522202_1_En_6_Chapter_TeX_IEq63.png)
    的估计值，以使算法计算高效。如果我们通过舍弃项 ![$$ \left(-{A}_k+{A}_k{{\mathbf{w}}_k^i}^T{\mathbf{w}}_k^i\right)
    $$](img/522202_1_En_6_Chapter_TeX_IEq64.png) 来近似海森矩阵，则可以解决这两个问题，因为当 ![$$ {\mathbf{w}}_k^i
    $$](img/522202_1_En_6_Chapter_TeX_IEq65.png) 接近解时，该项接近于 0。新的海森矩阵为：


    ![$$ {H}_k^i\approx {{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^iI-{\tilde{A}}_k^i+2{A}_k{\mathbf{w}}_k^i{{\mathbf{w}}_k^i}^T+2{\mathbf{w}}_k^i{{\mathbf{w}}_k^i}^T{A}_k,
    $$](img/522202_1_En_6_Chapter_TeX_IEq66.png)     (6.13)


    其中


    ![$$ {\tilde{A}}_k^i={A}_k-\sum \limits_{j=1}^{i-1}{\mathbf{w}}_k^j{{\mathbf{w}}_k^j}^T{A}_k-\sum
    \limits_{j=1}^{i-1}{A}_k{\mathbf{w}}_k^j{{\mathbf{w}}_k^j}^T. $$](img/522202_1_En_6_Chapter_TeX_Eque.png)


    我们可以通过关于 *i* 的迭代方程来计算 ![$$ {A}_k^i $$](img/522202_1_En_6_Chapter_TeX_IEq67.png)，如下所示：


    ![$$ {\tilde{A}}_k^{i+1}={\tilde{A}}_k^i-{\mathbf{w}}_k^i{{\mathbf{w}}_k^i}^T{A}_k-{A}_k{\mathbf{w}}_k^i{{\mathbf{w}}_k^i}^T.
    $$](img/522202_1_En_6_Chapter_TeX_Equf.png)


    对该海森矩阵求逆包括对矩阵 ![$$ {B}_k^i={{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^iI-{\tilde{A}}_k^i
    $$](img/522202_1_En_6_Chapter_TeX_IEq68.png) 求逆以及两次秩一更新。该矩阵 ![$$ {B}_k^i $$](img/522202_1_En_6_Chapter_TeX_IEq69.png)
    的近似逆由下式给出：


    ![$$ {\left({B}_k^i\right)}^{-1}={\left({{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^iI-{\tilde{A}}_k^i\right)}^{-1}\approx
    \frac{I+{\tilde{A}}_k^i/{{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i}{{{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i}
    $$](img/522202_1_En_6_Chapter_TeX_IEq70.png)。     (6.14)


    通过对 (6.13) 中的海森矩阵 ![$$ {H}_k^i $$](img/522202_1_En_6_Chapter_TeX_IEq71.png) 进行两次秩一更新，可以得到一个自适应求逆算法。我们定义


    ![$$ {C}_k^i={B}_k^i+2{A}_k{\mathbf{w}}_k^i{{\mathbf{w}}_k^i}^T. $$](img/522202_1_En_6_Chapter_TeX_IEq72.png)     (6.15)


    那么，根据 (6.13)，![$$ {\left({H}_k^i\right)}^{-1} $$](img/522202_1_En_6_Chapter_TeX_IEq73.png)
    的更新公式为：


    ![$$ {\left({H}_k^i\right)}^{-1}={\left({C}_k^i\right)}^{-1}-\frac{2{\left({C}_k^i\right)}^{-1}{\mathbf{w}}_k^i{{\mathbf{w}}_k^i}^T{A}_k{\left({C}_k^i\right)}^{-1}}{1+2{{\mathbf{w}}_k^i}^T{A}_k{\left({C}_k^i\right)}^{-1}{\mathbf{w}}_k^i},
    $$](img/522202_1_En_6_Chapter_TeX_IEq74.png)     (6.16)


    其中 ![$$ {\left({C}_k^i\right)}^{-1} $$](img/522202_1_En_6_Chapter_TeX_IEq75.png)
    由 (6.15) 得到：


    ![$$ {\left({C}_k^i\right)}^{-1}={\left({B}_k^i\right)}^{-1}-\frac{2{\left({B}_k^i\right)}^{-1}{A}_k{\mathbf{w}}_k^i{{\mathbf{w}}_k^i}^T{\left({B}_k^i\right)}^{-1}}{1+2{{\mathbf{w}}_k^i}^T{\left({B}_k^i\right)}^{-1}{A}_k{\mathbf{w}}_k^i}
    $$](img/522202_1_En_6_Chapter_TeX_IEq76.png)     (6.17)


    并且 ![$$ {\left({B}_k^i\right)}^{-1} $$](img/522202_1_En_6_Chapter_TeX_IEq77.png)
    由 (6.14) 给出。


    ### 牛顿-拉夫森算法代码


    以下 Python 代码使用数据 `X[nDim,nSamples]` 实现了该算法：


    ```

    from numpy import linalg as la

    A  = np.zeros(shape=(nDim,nDim)) # stores adaptive correlation matrix

    W1 = 0.1 * np.ones(shape=(nDim,nEA)) # weight vectors of all algorithms

    W2 = W1

    I  = np.identity(nDim)

    Weight = 1

    nEpochs = 1

    for epoch in range(nEpochs):

    for iter in range(nSamples):

    cnt = nSamples*epoch + iter

    # Update data correlation matrix A with current sample x

    x = X1[:,iter]

    x = x.reshape(nDim,1)

    A = Weight * A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - Weight * A)

    # Newton Rhapson

    G = -2* A @ W4 + A@ W4@ np.triu(W4.T @ W4) + W4@ np.triu(W4.T @ A @ W4)

    # Update W

    for i in range(nEA):

    M = np.zeros(shape=(nDim,nDim))

    for k in range(i):

    wk = W4[:,k].reshape(nDim,1)

    M = M + (A @ (wk @ wk.T) + (wk @ wk.T) @ A)

    wi = W4[:,i].reshape(nDim,1)

    F = - 2*A + 2*A @ (wi @ wi.T) + 2 * (wi @ wi.T) @ A + \

    A * (wi.T @ wi) + (wi.T @ A @ wi) * I  +  M

    lam = wi.T @ A @ wi

    Atilde = A

    if (iter > 0):

    invB = (I + (Atilde/lam))/lam

    invC = invB- (2*invB@ A @wi @wi.T @ invB)/(1 + 2*wi.T@ invB@ A @ wi)

    invF = invC- (2*invC@ wi @wi.T @A @ invC)/(1 + 2*wi.T@ A @invC @ wi)

    gi = G[:,i].reshape(nDim,1)

    di = -invF @ gi

    a0 = np.asscalar(gi.T @ di)

    a1 = np.asscalar(di.T @ F @ di)

    a2 = np.asscalar(3* ((wi.T @ A @ di) @ (di.T @ di) + \

    (di.T @ A @ di)*(wi.T @ di)))

    a3 = np.asscalar(2 * (di.T @ A @ di) @ (di.T @ di))

    c  = np.array([a3, a2, a1, a0])

    rts = np.roots(c)

    rs = np.zeros(3)

    r  = np.zeros(3)

    J  = np.zeros(3)

    cnt1 = 0

    for k in range(3):

    if np.isreal(rts[k]):

    re = np.real(rts[k])

    rs[cnt1] = re

    r = W4[:,i] + re * di.reshape(nDim)

    J[cnt1] = np.asscalar(-2*(r.T @ A @ r) + (r.T @ A @ r) * \

    (r.T @ r) + (r.T @ M @ r))

    cnt1 = cnt1 + 1

    iyy = np.argmin(J)

    alpha = rs[iyy]

    W4[:,i] = (W4[:,i] + alpha * di.reshape(nDim)).T

    ```


    ## 6.6 实验结果


    我进行了两组实验来测试加速 PCA 算法的性能。第一组实验在*平稳*高斯数据上进行，第二组在*非平稳*高斯数据上进行。然后，我将最速下降算法与最先进的自适应
    PCA 算法进行了比较，例如 Yang 的投影近似子空间跟踪算法、Bannour 和 Sadjadi 的递归最小二乘算法，以及 Fu 和 Dowling 的共轭梯度特征结构跟踪算法。

