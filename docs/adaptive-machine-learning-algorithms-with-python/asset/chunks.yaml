    ## 1.2 Multi-Disciplinary Origin of Linear Features


    In this section, I further discuss the importance of data representation and classification
    features by showing how multiple disciplines derive these features and compute
    them adaptively for streaming data. For each discipline, I demonstrate the use
    of these features on real data.


    ### Hebbian Learning or Neural Biology


    Hebb’s postulate of learning is the oldest and most famous of all learning rules.
    Hebb proposed that when an axon of cell *A* excites cell *B*, the synaptic weight
    *W* is adjusted based on *f*(**x**,**y**), where *f*(⋅) is a function of presynaptic
    activity **x** and postsynaptic activity **y**. As a special case, we may write
    the weight adjustment Δ*W*=η**xy**^(*T*), where η>0 is a small constant.


    Given an input sequence {**x**[*k*]}, we can construct its linear transform ![$$
    {y}_k={\mathbf{w}}_k^T{\mathbf{x}}_k $$](images/522202_1_En_1_Chapter/522202_1_En_1_Chapter_TeX_IEq12.png),
    where **w**[*k*∈]ℜ^(*n*) is the weight vector. We can describe a Hebbian rule
    [Haykin 94] for adjusting **w**[*k*] as **w**[*k*+1]=**w**[*k*]+η***x***[*k*]*y*[*k*].
    Since this rule leads to exponential growth, Oja [Oja 89] introduced a rule to
    limit the growth of **w**[*k*] by normalizing **w**[*k*] as follows:


    ![$$ {\mathbf{w}}_{k+1}=\frac{{\mathbf{w}}_k+\eta {\mathbf{x}}_k{y}_k}{\left\Vert
    {\mathbf{w}}_k+\eta {\mathbf{x}}_k{y}_k\right\Vert }, $$](images/522202_1_En_1_Chapter/522202_1_En_1_Chapter_TeX_IEq13.png)     (1.3)


    Assuming small η and ‖**w**[*k*]‖=1, ([1.3](#522202_1_En_1_Chapter.xhtml#Par42))
    can be expanded as a power series in η, yielding


    ![$$ {\mathbf{w}}_{k+1}={\mathbf{w}}_k+\eta \left({\mathbf{x}}_k{y}_k-{y}_k^2{\mathbf{w}}_k\right)+O\left({\eta}^2\right),
    $$](images/522202_1_En_1_Chapter/522202_1_En_1_Chapter_TeX_IEq14.png)     (1.4)


    Eliminating the *O*(η²) term, we get the *constrained Hebbian algorithm* (*CHA*)
    or *Oja’s one-unit rule* (Chapter [4](#522202_1_En_4_Chapter.xhtml), Sec [4.​3](#522202_1_En_4_Chapter.xhtml#Sec6)).
    Indeed, this algorithm converges to the first principal eigenvector of *A*.


    Note that adaptive PCA algorithms are commonly used on streaming data and some
    GitHubs exist. I create here a comprehensive repository of these algorithms and
    also present new ones in this book and the associated GitHub.


    For example, algorithm ([1.4](#522202_1_En_1_Chapter.xhtml#Par44)) has been widely
    used on streaming data to derive the strongest representation feature from the
    data for analytics and machine learning. Figure [1-6](#522202_1_En_1_Chapter.xhtml#Fig6)
    shows multivariate non-stationary data with seasonality. Using the adaptive update
    rule ([1.4](#522202_1_En_1_Chapter.xhtml#Par44)), we derive the first principal
    component effectively in 0.2% of the streaming data. Figure [1-6](#522202_1_En_1_Chapter.xhtml#Fig6)
    shows the seasonal time-varying streaming data on the left and the rapid convergence
    (ideal value is 1) of the algorithm on the right to the first principal eigenvector
    leading to the strongest data representation feature.


    ![](images/522202_1_En_1_Chapter/522202_1_En_1_Fig6_HTML.png)


    Figure 1-6


    Adaptive PCA algorithm used on seasonal streaming data


    The Python code to implement the Hebbian adaptive algorithm on real 33-dimensional
    dataset `[nDim][nSamples]` is


    ```

    # Adaptive Hebbian/OJA algorithms

    from numpy import linalg as la

    A = np.zeros(shape=(nDim,nDim)) # stores adaptive correlation matrix

    w = 0.1 * np.ones(shape=(nDim)) # weight vectors of all algorithms

    for iter in range(nSamples):

    # update the data correlation matrix with latest data vector x

    x = np.array(dataset1.iloc[iter]).reshape(nDim,1)

    A = A + (1.0/(1 + iter))*((np.dot(x, x.T)) - A)

    # Hebbian/OJA Algorithm

    v = w[:].reshape(nDim, 1)

    v = v + (1/(100+iter))*(A @ v - v @ (v.T @ A @ v))

    w[:] = v.reshape(nDim)

    ```'
