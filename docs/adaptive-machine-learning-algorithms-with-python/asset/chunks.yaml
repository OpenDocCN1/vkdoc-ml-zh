    $$](images/522202_1_En_6_Chapter/522202_1_En_6_Chapter_TeX_IEq43.png), ![$$ {c}_3=2{{\mathbf{d}}_k^i}^T{A}_k{\mathbf{d}}_k^i{{\mathbf{d}}_k^i}^T{\mathbf{d}}_k^i
    $$](images/522202_1_En_6_Chapter/522202_1_En_6_Chapter_TeX_IEq44.png).


