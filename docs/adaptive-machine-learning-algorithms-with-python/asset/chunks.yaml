    Since PCA is optimal in the mean-squares error sense, it has been widely used
    in signal and image processing, data analysis, pattern recognition, communications,
    and control engineering. Applications such as the separation of signal subspace
    and noise subspace are important in digital communications and digital image processing.
    Applications of PCA in signal processing include temporal and spatial domain spectral
    analyses. Examples include multiple signal classification (MUSIC) techniques,
    minimum-norm methods, ESPIRIT estimators, and weighted subspace fitting (WSF)
    methods for estimating frequencies of sinusoids or direction of arrival (DOA)
    of plane waves impinging on an antenna array. More recently, PCA is applied to
    blind digital communications and speech processing. For example, in [Chatterjee
    et al. 97-99; Chen et al. 99], PCA is employed in a blind two-dimensional RAKE
    receiver for DS-CDMA-based space-frequency processing to solve the near-far problem.
