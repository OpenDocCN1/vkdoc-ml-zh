  trans: '

    ## 1.4 算法推导的通用方法论


    我在本书中的贡献有两方面：


    1.  我提出了一种推导和分析每种自适应算法的通用方法论。


    2.  我针对多个矩阵代数问题提出了自适应算法。


    关于矩阵计算的自适应算法文献提供了多种技术（包括特设方法）和各种类型的收敛过程。在本书中，我提出了一种*通用方法论*来推导并证明自适应算法的收敛性（所有证明均在
    GitHub 上）。


    **采用此方法论的优点在于，它能让读者遵循该方法论，为其应用场景推导出新的自适应算法。**


    在接下来的章节中，我将遵循以下步骤来推导每种算法：


    1.  **目标函数**


    我首先提出一个*目标函数* *J*(*W*;*A*[*k*])，使得该函数的最小化器 *W*^(***) 是数据矩阵 *A* 的期望矩阵函数。


    2.  **推导自适应算法**


    我通过对目标函数 *J*(*W*;*A*[*k*]) 应用梯度下降技术，推导出矩阵 *W* 的*自适应更新规则*。自适应梯度下降更新规则为：


    *W*[*k* + 1] = *W*[*k*] − *η*[*k*]∇[*W*]*J*(*W*[*k*], *A*[*k*]) = *W*[*k*] + *η*[*k*]*h*(*W*[*k*],
    *A*[*k*]),     (1.21)


    其中函数 *h*(*W*[*k*],*A*[*k*]) 遵循特定的连续性和正则性属性，而 *η*[*k*] 是一个递减的增益序列。


    3.  **加速自适应算法**


    目标函数 *J*(*W*;*A*) 的可用性使我们能够通过应用优化理论中的加速技术（如最速下降法、共轭方向法、牛顿-拉夫逊法和递归最小二乘法）来加速自适应算法。这些方法在主成分分析中的详细内容见第
    6 章。


    4.  **证明算法收敛于矩阵函数**


    在本书中，我提供了数值实验来证明这些算法的收敛性。数学证明在 GitHub [Chatterjee Github] 的单独文档中提供。


    遵循此方法论的一个重要好处是，它允许实践者为其自身的应用场景推导新的算法。


    ### 此处解决的矩阵代数问题


    在应用中，我假设数据按时间顺序到达，例如向量序列 {**x**[*k*]} 或 {**y**[*k*]}，或矩阵序列 {*A*[*k*]} 或 {*B*[*k*]}。请注意，此处给出的算法可用于非平稳输入流。


    在接下来的章节中，我将提出新颖的自适应算法来估计以下矩阵函数：


    *   均值、相关性和归一化均值（针对 {**x**[*k*]}）

    *   从 {**x**[*k*]} 或 {*A*[*k*]} 中计算 *A* 的平方根 (*A*^½) 和平方根的逆 (*A*^(–½))

    *   从 {**x**[*k*]} 或 {*A*[*k*]} 中计算 *A* 的主特征向量

    *   从 {**x**[*k*]} 或 {*A*[*k*]} 中计算 *A* 的主特征向量和次特征向量

    *   从 {**x**[*k*]} 和 {**z**[*k*]} 或 {*A*[*k*]} 和 {*B*[*k*]} 中计算 *A* 相对于 *B* 的广义特征向量

    *   从 {**x**[*k*]} 和 {**z**[*k*]} 或 {*C*[*k*]} 中计算 *C* 的奇异值分解 (SVD)


    除了这些算法，我还讨论了：


    *   均值、协方差和矩阵求逆的自适应计算

    *   通过非线性优化技术加速自适应算法的方法


    ## 1.5 本书大纲


    在接下来的章节中，我将详细讨论针对各种矩阵代数问题的多种自适应算法的公式化、推导、收敛性以及实验结果。


    在第 2 章中，我讨论了后续章节中使用的基本术语和方法。本章还讨论了针对平稳和非平稳数据的均值、中位数、相关性、协方差以及逆相关/协方差计算的自适应算法。我进一步讨论了用于归一化均值计算的新颖自适应算法。


    在第 3 章中，我讨论了三种用于计算矩阵序列平方根的自适应算法。接着，我讨论了三种用于计算其平方根逆的算法。我为这些算法提供了目标函数和收敛性证明。


    在第 4 章中，我讨论了 11 种算法（其中一些是新算法），用于自适应计算矩阵序列的第一主特征向量或向量序列的在线相关矩阵。我提供了针对特定应用选择算法的最佳实践。我遵循通用的方法论来推导和分析每种算法的收敛性，并辅以实验结果。


    在第 5 章中，我提出了 21 种自适应算法，用于计算矩阵序列的主特征向量和次特征向量，或向量序列的在线相关矩阵。这些算法源自 7 种不同类型的目标函数，每种函数在
    3 种不同条件下推导。每种算法都经过推导、讨论，并在分析和实验上证明其收敛性。我提供了针对特定应用选择算法的最佳实践。


    由于我为所有自适应算法都提供了目标函数，因此在第 6 章中，我偏离了传统的梯度下降法来推导算法。这里，我通过对目标函数应用最速下降法、共轭方向法、牛顿-拉夫逊法和递归最小二乘法，推导出新的计算速度更快的算法。实验结果以及与最先进算法的比较显示了这些自适应算法更快的收敛速度。


    在第 7 章中，我讨论了 21 种用于从两个矩阵或向量序列进行广义特征分解的自适应算法。我再次遵循通用的方法论，从目标函数推导所有算法，并附上实验结果。


    在第 8 章中，我通过示例和代码展示了这些算法在现实世界中的应用。


    参考文献在第 [9](https://doi.org/10.1007/978-1-4842-8017-1_9) 章。


    # 2. 通用理论与符号


    ## 2.1 引言


    在本章中，我提出了从矩阵序列中自适应求解矩阵代数问题的算法。这些流或序列可以是随机矩阵 {*A*[*k*]} 或 {*B*[*k*]}，也可以是随机向量序列
    {**x**[*k*]} 或 {**y**[*k*]} 的相关矩阵。矩阵代数的例子包括矩阵求逆、平方根、平方根逆、特征向量、广义特征向量、奇异向量和广义奇异向量。


    本章还涵盖了后续章节中使用的基本术语和方法。我还介绍了众所周知的从随机矩阵或向量序列计算均值、中位数、协方差、逆协方差和相关矩阵的自适应算法。此外，我提出了一种计算随机向量序列归一化均值的新算法。


    为简单起见，我们假设多维数据 {**x**[*k*]∈ℜ^(*n*)} 以序列形式到达。从这个数据序列中，我们可以推导出一个矩阵序列 {![$$ {A}_k={\mathbf{x}}_k{\mathbf{x}}_k^T
    $$](img/522202_1_En_2_Chapter_TeX_IEq1.png)}。我们将数据相关矩阵 *A* 定义如下：


    ![$$ A=\underset{k\to \infty }{\lim }E\left[{\mathbf{x}}_k{\mathbf{x}}_k^T\right]
    $$](images/522202_1_En_2_Chapter/522202_1_En_2_Chapter_TeX_IEq2.png)。     (2.1)

    '
- fmt: '## 2.2 Stationary and Non-Stationary Sequences


    In practical implementations, we face two types of sequences: stationary and non-stationary.
    A sequence {`x`[*k*]} is considered *asymptotically* (*weak*) *stationary* if
    ![$$ {\lim}_{k\to \infty }E\left[{\mathbf{x}}_k{\mathbf{x}}_k^T\right] $$](images/522202_1_En_2_Chapter/522202_1_En_2_Chapter_TeX_IEq3.png)
    is a constant. For a *non-stationary* sequence {`x`[*k*]}, ![$$ E\left[{\mathbf{x}}_k{\mathbf{x}}_{k+m}^T\right]
    $$](images/522202_1_En_2_Chapter/522202_1_En_2_Chapter_TeX_IEq4.png) remains a
    function of both *k* and *m*, and ![$$ E\left[{\mathbf{x}}_k{\mathbf{x}}_k^T\right]
    $$](images/522202_1_En_2_Chapter/522202_1_En_2_Chapter_TeX_IEq5.png) is a function
    of *k*. Examples of non-stationary data are given in *Publicly Real-World Datasets
    to Evaluate Stream Learning Algorithms* [Vinicius Souza et al. 20]. Figure [2-1](#522202_1_En_2_Chapter.xhtml#Fig1)
    shows examples of stationary and non-stationary data.


    ![](images/522202_1_En_2_Chapter/522202_1_En_2_Fig1a_HTML.png)![](images/522202_1_En_2_Chapter/522202_1_En_2_Fig1b_HTML.png)


    Figure 2-1


    Examples of stationary and non-stationary data


    Non-stationarity in data can be detected by well-known techniques described in
    this reference [Shay Palachy 19].


    ## 2.3 Use Cases for Adaptive Mean, Median, and Covariances


    Adaptive mean computation is important in real-world applications even though
    it is one of the simplest algorithms.


    ### Handwritten Character Recognition


    Consider the problem of detecting handwritten number 8. Figure [2-2](#522202_1_En_2_Chapter.xhtml#Fig2)
    shows six instances of the number 8 from the Keras dataset MNIST images [Keras,
    MNIST].


    ![](images/522202_1_En_2_Chapter/522202_1_En_2_Fig2_HTML.jpg)


    Figure 2-2


    Examples of variations in handwritten number 8


    One algorithm to recognize the number 8 with all its variations is to find the
    mean set of pixels that represent it. Due to random variations in handwriting,
    it is difficult to compile all variations of each character ahead of time. It
    is important to design an adaptive learning scheme whereby instantaneous variations
    in these characters are immediately represented in the machine learning algorithm.


    The adaptive mean detection algorithm is helpful in finding the common patterns
    that represent the number 8. Figure [2-3](#522202_1_En_2_Chapter.xhtml#Fig3) shows
    a template for the number 8 obtained by the adaptive mean algorithm given in Eq.
    ([2.2](#522202_1_En_2_Chapter.xhtml#Par15)).


    ![](images/522202_1_En_2_Chapter/522202_1_En_2_Fig3a_HTML.png)![](images/522202_1_En_2_Chapter/522202_1_En_2_Fig3b_HTML.png)


