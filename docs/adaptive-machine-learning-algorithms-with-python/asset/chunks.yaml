    - OJAN: `1/(λ[1]–λ[i])` for `i=2,…,n`

    - LUO: `‖w[0]‖^(–2)/(λ[1]–λ[i])` for `i=2,…,n`


    The time constants are dependent on the eigen-structure of `A`.


    ## 4.5 IT Algorithm


    ### Objective Function


    The objective function for the information theory (IT) criterion is


    ![$$ J\left({\mathbf{w}}_k;{A}_k\right)={\mathbf{w}}_k^T{\mathbf{w}}_k-\ln \left({\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k\right)
    $$](images/522202_1_En_4_Chapter/522202_1_En_4_Chapter_TeX_IEq24.png). (4.10)


    Plumbley [Pumbley 95] and Miao and Hua [Miao and Hua 98] have studied this objective
    function.


    ### Adaptive Algorithm


    The gradient of ([4.12](#522202_1_En_4_Chapter.xhtml#Par77)) with respect to `w[k]`
    is


    ![$$ {\nabla}_{{\mathbf{w}}_k}J\left({\mathbf{w}}_k;{A}_k\right)={\mathbf{w}}_k-\frac{A_k{\mathbf{w}}_k}{{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k}.
    $$](images/522202_1_En_4_Chapter/522202_1_En_4_Chapter_TeX_Equc.png)


    The adaptive gradient descent IT algorithm for PCA is


    ![$$ {\mathbf{w}}_{k+1}={\mathbf{w}}_k-{\eta}_k{\nabla}_{{\mathbf{w}}_k}J\left({\mathbf{w}}_k;{A}_k\right)={\mathbf{w}}_k+{\eta}_k\left(\frac{A_k{\mathbf{w}}_k}{{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k}-{\mathbf{w}}_k\right)
    $$](images/522202_1_En_4_Chapter/522202_1_En_4_Chapter_TeX_IEq25.png). (4.11)


    The Python code for this algorithm with multidimensional data `X[nDim,nSamples]`
    is


    ```

    A = np.zeros(shape=(nDim,nDim)) # stores adaptive correlation matrix

    w = 0.1 * np.ones(shape=(nDim,11)) # weight vectors of all algorithms

    for epoch in range(nEpochs):

    for iter in range(nSamples):

    cnt = nSamples*epoch + iter

    x = X[:,iter]

    x = x.reshape(nDim,1)

    A = A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - A)

    # IT Algorithm

    v = w[:,5].reshape(nDim, 1)

    v = v + (4/(1+cnt))*((A @ v / (v.T @ A @ v)) - v)

    w[:,5] = v.reshape(nDim)

    ```


    ### Rate of Convergence


    A unique feature of this algorithm is that the time constant for `‖w(t)‖` is 1
    and it is *independent* of the eigen-structure of `A`.


    ### Upper Bound of `η[k]`


    I have proven that there exists a uniform upper bound for `η[k]` such that `w[k]`
    is uniformly bounded. Furthermore, if `‖w[k]‖² ≤ α+1`, then `‖w[k+1]‖² ≤ ‖w[k]‖²`
    if


    ![$$ {\eta}_k&lt;\frac{2\left(\alpha +1\right)}{\alpha }. $$](images/522202_1_En_4_Chapter/522202_1_En_4_Chapter_TeX_Equd.png)


    ## 4.6 XU Algorithm


    ### Objective Function


    Originally presented by Xu [Xu 91, 93], the objective function for XU algorithm
    is


    ![$$ J\left({\mathbf{w}}_k;{A}_k\right)=-{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k+{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k\left({\mathbf{w}}_k^T\mathbf{w}-1\right)=-2{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k+{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k{\mathbf{w}}_k^T{\mathbf{w}}_k
    $$](images/522202_1_En_4_Chapter/522202_1_En_4_Chapter_TeX_IEq26.png) (4.12)


    The objective function `J(w[k];A[k])` represents the mean squared error between
    the sample `x[k]` and its transformation due to a matrix ![$$ {\mathbf{w}}_k{\mathbf{w}}_k^T
    $$](images/522202_1_En_4_Chapter/522202_1_En_4_Chapter_TeX_IEq27.png). This transform,
    also known as *auto-association*, is shown in Figure [4-1](#522202_1_En_4_Chapter.xhtml#Fig1).
    We define ![$$ {A}_k=\left(1/k\right){\sum}_{t=1}^k{\mathbf{x}}_t{\mathbf{x}}_t^T
    $$](images/522202_1_En_4_Chapter/522202_1_En_4_Chapter_TeX_IEq28.png). Then, the
    mean squared error objective function is


    ![$$ J\left({\mathbf{w}}_k;{A}_k\right)=\frac{1}{k}\sum \limits_{i=1}^k{\left\Vert
    {\mathbf{x}}_k-{\mathbf{w}}_k{\mathbf{w}}_k^T{\mathbf{x}}_k\right\Vert}^2={trA}_k-2{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k+{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k{\mathbf{w}}_k^T{\mathbf{w}}_k,
    $$](images/522202_1_En_4_Chapter/522202_1_En_4_Chapter_TeX_Eque.png)


    which is the same as ([4.12](#522202_1_En_4_Chapter.xhtml#Par77)).


    ### Adaptive Algorithm


    The gradient of ([4.12](#522202_1_En_4_Chapter.xhtml#Par77)) with respect to `w[k]`
    is


    ![$$ {\nabla}_{{\mathbf{w}}_k}J\left({\mathbf{w}}_k;{A}_k\right)=-\left(2{A}_k{\mathbf{w}}_k-{\mathbf{w}}_k{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k-{A}_k{\mathbf{w}}_k{\mathbf{w}}_k^T{\mathbf{w}}_k\right).
    $$](images/522202_1_En_4_Chapter/522202_1_En_4_Chapter_TeX_Equf.png)


    The adaptive gradient descent XU algorithm for PCA is


    ![$$ {\mathbf{w}}_{k+1}={\mathbf{w}}_k-{\eta}_k{\nabla}_{{\mathbf{w}}_k}J\left({\mathbf{w}}_k;{A}_k\right)={\mathbf{w}}_k+{\eta}_k\left(2{A}_k{\mathbf{w}}_k-{\mathbf{w}}_k{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k-{A}_k{\mathbf{w}}_k{\mathbf{w}}_k^T{\mathbf{w}}_k\right)
    $$](images/522202_1_En_4_Chapter/522202_1_En_4_Chapter_TeX_IEq29.png). (4.13)


    The Python code for this algorithm with multidimensional data `X[nDim,nSamples]`
    is


    ```

    A = np.zeros(shape=(nDim,nDim)) # stores adaptive correlation matrix

    w = 0.1 * np.ones(shape=(nDim,11)) # weight vectors of all algorithms

    for epoch in range(nEpochs):

    for iter in range(nSamples):

    cnt = nSamples*epoch + iter

    x = X[:,iter]

    x = x.reshape(nDim,1)

    A = A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - A)

    # XU Algorithm

    v = w[:,6].reshape(nDim, 1)

    v = v + (1/(50+cnt))*(2*A@ v - v@(v.T @ A @ v) - A@ v@ (v.T @ v))

    w[:,6] = v.reshape(nDim)

    ```'
