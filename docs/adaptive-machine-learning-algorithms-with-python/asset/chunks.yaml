    By equating the gradient (7.50) with respect to `w_k^i` to **0**, and using the
    constraint `w_k^j^T B_k w_k^i = δ_ij`, we obtain


    `α = 0` and `β_j = (w_k^j^T A_k w_k^i) / (w_k^i^T B_k w_k^i)` for `j=1,…,p`. (7.51)


