    ## 5.3 OJA 算法

    '
- fmt: '### OJA Homogeneous Algorithm


    The objective function for the OJA homogeneous algorithm is


    ![$$ J\left({\mathbf{w}}_k^i;{A}_k\right)=-{{\mathbf{w}}_k^i}^T{A}_k^2{\mathbf{w}}_k^i+\frac{1}{2}{\left({{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i\right)}^2+\sum
    \limits_{j=1,j\ne i}^p{\left({{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^j\right)}^2
    $$](images/522202_1_En_5_Chapter/522202_1_En_5_Chapter_TeX_IEq25.png), (5.3)


    for `i=1,…,p` (`p≤n`). From the gradient of (5.3) with respect to ![$$ {\mathbf{w}}_k^i
    $$](images/522202_1_En_5_Chapter/522202_1_En_5_Chapter_TeX_IEq26.png) we obtain
    the following adaptive algorithms:


    ![$$ {\mathbf{w}}_{k+1}^i={\mathbf{w}}_k^i-{\eta}_k{A}_k^{-1}{\nabla}_{{\mathbf{w}}_k^i}J\left({\mathbf{w}}_k^i;{A}_k\right)
    $$](images/522202_1_En_5_Chapter/522202_1_En_5_Chapter_TeX_IEq27.png) for `i=1,…,p`,


    or


    ![$$ {\mathbf{w}}_{k+1}^i={\mathbf{w}}_k^i+{\eta}_k\left({A}_k{\mathbf{w}}_k^i-\sum
    \limits_{j=1}^p{\mathbf{w}}_k^j{{\mathbf{w}}_k^j}^T{A}_k{\mathbf{w}}_k^i\right)
    $$](images/522202_1_En_5_Chapter/522202_1_En_5_Chapter_TeX_IEq28.png) (5.4)


    for `i=1,…,p`, where `η[k]` is a small decreasing constant. We define a matrix
    ![$$ {W}_k=\left[{\mathbf{w}}_k^1\dots {\mathbf{w}}_k^p\right] $$](images/522202_1_En_5_Chapter/522202_1_En_5_Chapter_TeX_IEq29.png)
    (`p≤n`), for which the columns are the `p` weight vectors that converge to the
    `p` principal eigenvectors of `A` respectively. We can represent (5.4) as


    ![$$ {W}_{k+1}={W}_k+{\eta}_k\left({A}_k{W}_k-{W}_k{W}_k^T{A}_k{W}_k\right) $$](images/522202_1_En_5_Chapter/522202_1_En_5_Chapter_TeX_IEq30.png)
    (5.5)


    This is the matrix form of the *principal subspace learning algorithm* given by
    Oja [Oja 85,89,92].


    `W[k]` converges `W(∗)=ΦDU`, where `D=[D[1]|0]^(T)∈ℜ^(nXp)`, `D[1]=diag(d[1],...,d[p])∈ℜ^(pXp)`,
    `d[i]=±1` for `i=1,...,p`, and `U∈ℜ^(pXp)` is an arbitrary rotation matrix (i.e.,
    `U^(T)U=UU^(T)=I[p]`).


    ### OJA Deflation Algorithm


    The objective function for the OJA deflation adaptive PCA algorithm is


    ![$$ J\left({\mathbf{w}}_k^i;{A}_k\right)=-{{\mathbf{w}}_k^i}^T{A}_k^2{\mathbf{w}}_k^i+\frac{1}{2}{\left({{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i\right)}^2+\sum
    \limits_{j=1}^{i-1}{\left({{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^j\right)}^2
    $$](images/522202_1_En_5_Chapter/522202_1_En_5_Chapter_TeX_IEq31.png) for `i=1,…,p`.
    (5.6)


    From the gradient of (5.6), we obtain the OJA deflation adaptive gradient descent
    algorithm:


    ![$$ {W}_{k+1}={W}_k+{\eta}_k\left({A}_k{W}_k-{W}_k UT\left({W}_k^T{A}_k{W}_k\right)\right)
    $$](images/522202_1_En_5_Chapter/522202_1_En_5_Chapter_TeX_IEq32.png), (5.7)


    where `UT[⋅]` sets all elements below the diagonal of its matrix argument to zero,
    thereby making it upper triangular. This algorithm is also known as the *generalized
    Hebbian algorithm* [Sanger 89]. Sanger proved that `W[k]` converges to `W(∗)=
    [±ϕ[1] ±ϕ[2] … ±ϕ[p]]` as `k→∞`.


    ### OJA Weighted Algorithm


    The objective function for the OJA weighted adaptive PCA algorithm is


    ![$$ J\left({\mathbf{w}}_k^i;{A}_k\right)=-{c}_i{{\mathbf{w}}_k^i}^T{A}_k^2{\mathbf{w}}_k^i+\frac{c_i}{2}{\left({{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i\right)}^2+\sum
    \limits_{j=1,j\ne i}^p{c}_j{\left({{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^j\right)}^2
    $$](images/522202_1_En_5_Chapter/522202_1_En_5_Chapter_TeX_IEq33.png) (5.8)


    for `i=1,…,p` and `c[1],…,c[p]` are small positive numbers satisfying `c[1]>c[2]>…>c[p]>0`,
    `p≤n`. From (5.8), we obtain the OJA weighted adaptive gradient descent algorithm
    for PCA as


    ![$$ {W}_{k+1}={W}_k+{\eta}_k\left({A}_k{W}_kC-{W}_k{CW}_k^T{A}_k{W}_k\right)
    $$](images/522202_1_En_5_Chapter/522202_1_En_5_Chapter_TeX_IEq34.png) (5.9)


    where `C=diag(c[1],…,c[p])`. This algorithm is also known as *Brockett’s subspace*
    algorithm [Xu 93, Chen, Amari, Lin 98]. Xu [Xu 93, Theorems 5 and 6] proved that
    `W[k]` converges to `W(∗)= [±ϕ[1] ±ϕ[2] … ±ϕ[p]]` as `k→∞`.


    ### OJA Algorithm Python Code


    The following Python code implements the OJA PCA algorithms with data `X[nDim,nSamples]`:


    ```python

    from numpy import linalg as la

    nEA = 4 # number of PCA components computed

    nEpochs  = 2

    A  = np.zeros(shape=(nDim,nDim)) # stores adaptive correlation matrix

    W1 = 0.1 * np.ones(shape=(nDim,nEA)) # weight vectors of all algorithms

    W2 = W1

    W3 = W1

    c = [2-0.3*k for k in range(nEA)]

    C = np.diag(c)

