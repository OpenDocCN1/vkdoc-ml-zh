- fmt: '### Experiments with Stationary Data


    I generated 2000 samples of 10-dimensional Gaussian data (i.e., `n=10`) with mean
    zero and covariance given below. Note that this covariance matrix is obtained
    from the first covariance matrix in [Okada and Tomita 85] multiplied by 2. The
    covariance matrix is


    ![](images/522202_1_En_6_Chapter/522202_1_En_6_Figa_HTML.png)


    The eigenvalues of the covariance matrix are


    `11.7996`, `5.5644`, `3.4175`, `2.0589`, `0.7873`, `0.5878`, `0.1743`, `0.1423`,
    `0.1213`, `0.1007`.


    Clearly, the first four eigenvalues are significant and I adaptively compute the
    corresponding eigenvectors (i.e., `p=4`). See Figure [6-1](#522202_1_En_6_Chapter.xhtml#Fig1)
    for the plots of the 10-dimensional random stationary data.


    ![](images/522202_1_En_6_Chapter/522202_1_En_6_Fig1_HTML.png)


    Figure 6-1


    10-dimensional stationary random normal data


    In order to compute the online data sequence `{A[k]}`, I generated random data
    vectors `{x[k]}` from the above covariance matrix. I generated `{A[k]}` from `{x[k]}`
    by using algorithm (2.3) in Chapter [2](#522202_1_En_2_Chapter.xhtml). I computed
    the correlation matrix `A` after collecting all 500 samples `x[k]` as


    ![$$ A=\frac{1}{2000}\sum \limits_{i=1}^{2000}{\mathbf{x}}_i{\mathbf{x}}_i^T.
    $$](images/522202_1_En_6_Chapter/522202_1_En_6_Chapter_TeX_Equg.png)


    I refer to the eigenvectors and eigenvalues computed from this `A` by a standard
    numerical analysis method [Golub and VanLoan 83] as the *actual values*.


    I used the adaptive gradient descent (6.4), steepest descent (6.8), conjugate
    direction (6.11), and Newton-Raphson (6.12) algorithms on the random data sequence
    `{A[k]}`. I started all algorithms with `W[0] = 0.1*ONE`, where `ONE` is a 10
    X 4 matrix whose all elements are ones. In order to measure the convergence and
    accuracy of the algorithms, I computed the direction cosine at `k`-th update of
    each adaptive algorithm as


    Direction cosine (`k`) = ![$$ \frac{\left|{{\mathbf{w}}_k^i}^T{\boldsymbol{\upvarphi}}_i\right|}{\left\Vert
    {\mathbf{w}}_k^i\left\Vert \right\Vert {\boldsymbol{\upvarphi}}_i\right\Vert }
    $$](images/522202_1_En_6_Chapter/522202_1_En_6_Chapter_TeX_IEq78.png), (6.18)


    where ![$$ {\mathbf{w}}_k^i $$](images/522202_1_En_6_Chapter/522202_1_En_6_Chapter_TeX_IEq79.png)
    is the estimated eigenvector of `A[k]` at `k`-th update and `φ[i]` is the actual
    eigenvector computed from all collected samples by a conventional numerical analysis
    method.


    Figures [6-2](#522202_1_En_6_Chapter.xhtml#Fig2) through [6-4](#522202_1_En_6_Chapter.xhtml#Fig4)
    show the iterates of the four algorithms to compute the first four principal eigenvectors
    of `A`. For the gradient descent (6.4) algorithm, I used `η[k]=1/(400+k)`. For
    the conjugate direction method, I used the Hestenes-Stiefel [Nonlinear conjugate
    gradient method, Wikipedia] method (see Section [6.4](#522202_1_En_6_Chapter.xhtml#Sec8))
    to compute ![$$ {\beta}_k^i $$](images/522202_1_En_6_Chapter/522202_1_En_6_Chapter_TeX_IEq80.png).
    For the steepest descent, conjugate direction, and Newton-Raphson methods, I chose
    ![$$ {\alpha}_k^i $$](images/522202_1_En_6_Chapter/522202_1_En_6_Chapter_TeX_IEq81.png)
    by solving a cubic equation as described in Sections [6.3](#522202_1_En_6_Chapter.xhtml#Sec5),
    [6.4](#522202_1_En_6_Chapter.xhtml#Sec8), and [6.5](#522202_1_En_6_Chapter.xhtml#Sec10),
    respectively.


    ![](images/522202_1_En_6_Chapter/522202_1_En_6_Fig4_HTML.png)


    Figure 6-4


    Convergence of the first four principal eigenvectors of A by the gradient descent
    (6.4) and Newton-Raphson (6.12) algorithms for stationary data


    ![](images/522202_1_En_6_Chapter/522202_1_En_6_Fig3_HTML.png)


    Figure 6-3


    Convergence of the first four principal eigenvectors of A by the gradient descent
    (6.4) and conjugate direction (6.11) algorithms for stationary data


    ![](images/522202_1_En_6_Chapter/522202_1_En_6_Fig2_HTML.png)


    Figure 6-2


    Convergence of the first four principal eigenvectors of A by the gradient descent
    (6.4) and steepest descent (6.8) algorithms for stationary data


    It is clear from Figures [6-2](#522202_1_En_6_Chapter.xhtml#Fig2) through [6-4](#522202_1_En_6_Chapter.xhtml#Fig4)
    that the steepest descent, conjugate direction, and Newton-Raphson algorithms
    converge faster than the gradient descent algorithm in spite of a careful selection
    of `η[k]` for the gradient descent algorithm. Besides, the new algorithms do not
    require ad-hoc selections of `η[k]`. Instead, the gain parameters ![$$ {\alpha}_k^i
    $$](images/522202_1_En_6_Chapter/522202_1_En_6_Chapter_TeX_IEq82.png) and ![$$
    {\beta}_k^i $$](images/522202_1_En_6_Chapter/522202_1_En_6_Chapter_TeX_IEq83.png)
    are computed from the online data sequence.


    Comparison between the four algorithms show small differences between them for
    the first four principal eigenvectors of `A`. Among the three faster converging
    algorithms, the steepest descent algorithm (6.8) requires the smallest amount
    of computation per iteration. Therefore, these experiments show that the steepest
    descent adaptive algorithm (6.8) is most suitable for optimum speed and computation
    among the four algorithms presented here.'
