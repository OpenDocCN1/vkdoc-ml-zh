- fmt: '### Various Solutions for `A^½` and `A^(–½)`


    Let `A = ΦΛΦ^T` be the eigen-decomposition of the real, symmetric, positive definite
    `n x n` matrix `A`, where `Φ` and `Λ` are respectively the eigenvector and eigenvalue
    matrices of `A`. Here `Λ = diag(λ[1], …, λ[n])` is the diagonal eigenvalue matrix
    with `λ[1] ≥ … ≥ λ[n] > 0`, and `Φ ∈ ℜ^(n x n)` is orthonormal. A solution for
    `A^½` is `L = ΦD`, where `D = diag(±λ₁^½, …, ±λ_n^½)`. However, in general this
    is not a symmetric solution, and for any orthonormal matrix `U`, `ΦDU` is also
    a solution. We can show that `A^½` is symmetric if, and only if, it is of the
    form `ΦDΦ^T`, and there are `2^n` symmetric solutions for `A^½`. When `D` is positive
    definite, we obtain the unique symmetric positive definite solution for `A^½`
    as `ΦΛ^½Φ^T`, where `Λ^½ = diag(λ₁^½, …, λ_n^½)`. Similarly, a general solution
    for the inverse square root `A^(–½)` of `A` is `ΦD^(–1)U`, where `D` is defined
    before and `U` is any orthonormal matrix. The unique symmetric positive definite
    solution for `A^(–½)` is `ΦΛ^(–½)Φ^T`, where `Λ^(–½) = diag(λ₁^(-½), …, λ_n^(-½))`.


    ### Outline of This Chapter


    In Sections 3.2, 3.3, and 3.4, I discuss three algorithms for the adaptive computation
    of `A^½`. Section 3.4 discusses the unique symmetric positive definite solution
    for `A^½`. In Sections 3.5, 3.6, and 3.7, I discuss three algorithms for the adaptive
    computation of `A^(–½)`. Section 3.7 describes the unique symmetric positive definite
    solution for `A^(–½)`. Section 3.8 presents experimental results for the six algorithms
    with 10-dimensional Gaussian data. Section 3.9 concludes the chapter.


    ## 3.2 Adaptive Square Root Algorithm: Method 1


    Let `{x[k] ∈ ℜ^n}` be a sequence of data vectors whose online data correlation
    matrix `A[k] ∈ ℜ^(n x n)` is given by


    ```

    A_k = (1/k) * Σ_{i=1}^k β^(k-i) * x_i * x_i^T

    ```     (3.1)


    Here `x[k]` is an observation vector at time `k` and `0 < β ≤ 1` is a forgetting
    factor used for non-stationary sequences. If the data is stationary, the asymptotic
    correlation matrix `A` is


    ```

    A = lim_{k→∞} E[A_k]

    ```     (3.2)


    ### Objective Function


    Following the methodology described in Section 1.4, I present the algorithm by
    first showing an objective function `J`, whose minimum with respect to matrix
    `W` gives us the square root of the asymptotic data correlation matrix `A`. The
    objective function is


    ```

    J(W) = ||A - W^T W||_F^2

    ```     (3.3)


    The gradient of `J(W)` with respect to `W` is


    ```

    ∇_W J(W) = -4W(A - W^T W)

    ```     (3.4)


    ### Adaptive Algorithm


    From the gradient in (3.4), we obtain the following adaptive gradient descent
    algorithm:


    ```

    W_{k+1} = W_k - η_k (1/4) ∇_W J(W_k; A_k) = W_k + η_k (W_k A_k - W_k W_k^T W_k)

    ```     (3.5)


    where `η[k]` is a small decreasing constant and follows assumption A1.2 in the
    Proofs of Convergence in the GitHub [Chatterjee GitHub].


    The following Python code implements this algorithm with data `X[nDim,nSamples]`:


    ```

    for epoch in range(nEpochs):

    for iter in range(nSamples):

    cnt = nSamples*epoch + iter

    x = X[:,iter]

    x = x.reshape(nDim,1)

    A = A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - A)

    etat1 = 1.0/(50 + cnt)

    # Algorithm 1

    W1 = W1 + etat1 * (W1 @ A - W1 @ W1.T @ W1)

    ```


    ## 3.3 Adaptive Square Root Algorithm: Method 2


    ### Objective Function


    The objective function `J(W)`, whose minimum with respect to `W` gives us the
    square root of `A`, is


    ```

    J(W) = ||A - W W^T||_F^2

    ```     (3.6)


    The gradient of `J(W)` with respect to `W` is


    ```

    ∇_W J(W) = -4(A - W W^T) W

    ```     (3.7)


    ### Adaptive Algorithm


    We obtain the following adaptive gradient descent algorithm for square root of
    `A`:


    ```

    W_{k+1} = W_k - η_k (1/4) ∇_W J(W_k; A_k) = W_k + η_k (A_k W_k - W_k W_k^T W_k)

    ```     (3.8)


    where `η[k]` is a small decreasing constant.


    The following Python code implements this algorithm with data `X[nDim,nSamples]`:


    ```

    for epoch in range(nEpochs):

    for iter in range(nSamples):

    cnt = nSamples*epoch + iter

    x = X[:,iter]

    x = x.reshape(nDim,1)

    A = A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - A)

    etat1 = 1.0/(50 + cnt)

    # Algorithm 2

    W2 = W2 + etat1 * (A @ W2 - W2 @ W2.T @ W2)

    ```


    ## 3.4 Adaptive Square Root Algorithm: Method 3


    ### Adaptive Algorithm


    Following the adaptive algorithms (3.5) and (3.8), I now present an algorithm
    for the computation of a symmetric positive definite square root of `A`:


    ```

    W_{k+1} = W_k + η_k (A_k - W_k^2)

    ```     (3.9)


    where `η[k]` is a small decreasing constant and `W[k]` is symmetric.


    The following Python code implements this algorithm with data `X[nDim,nSamples]`:


    ```

    for epoch in range(nEpochs):

    for iter in range(nSamples):

    cnt = nSamples*epoch + iter

    x = X[:,iter]

    x = x.reshape(nDim,1)

    A = A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - A)

    etat2 = 1.0/(50 + cnt)

    # Algorithm 3

    W3 = W3 + etat2 * (A - W3 @ W3)

    ```


    ## 3.5 Adaptive Inverse Square Root Algorithm: Method 1


    ### Objective Function


    The objective function `J(W)`, whose minimizer `W*` gives us the inverse square
    root of `A`, is


    ```

    J(W) = ||I - W^T A W||_F^2

    ```     (3.10)


    The gradient of `J(W)` with respect to `W` is


    ```

    ∇_W J(W) = -4 A W (I - W^T A W)

    ```     (3.11)


    ### Adaptive Algorithm


    From the gradient in (3.11), we obtain the following adaptive gradient descent
    algorithm:


    ```

    W_{k+1} = W_k - η_k (1/4) A_k^{-1} ∇_W J(W_k; A_k) = W_k + η_k (W_k - W_k W_k^T
    A_k W_k)

    ```     (3.12)


    The following Python code implements this algorithm with data `X[nDim,nSamples]`:


    ```

    for epoch in range(nEpochs):

    for iter in range(nSamples):

    cnt = nSamples*epoch + iter

    x = X[:,iter]

    x = x.reshape(nDim,1)

    A = A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - A)

    etat1 = 1.0/(100 + cnt)

    # Algorithm 1

    W1 = W1 + etat1 * (W1 - W1 @ W1.T @ A @ W1)

    ```


