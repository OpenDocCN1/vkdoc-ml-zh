    $$](img/522202_1_En_7_Chapter_TeX_IEq32.png)。     (7.7)


    ### OJA 紧缩算法


    OJA 紧缩自适应 GEVD 算法的目标函数是


    ![$$ J\left({\mathbf{w}}_k^i;{A}_k,{B}_k\right)=-{{\mathbf{w}}_k^i}^T{A}_k{B}_k^{-1}{A}_k{\mathbf{w}}_k^i+\frac{1}{2}{\left({{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i\right)}²+\sum
