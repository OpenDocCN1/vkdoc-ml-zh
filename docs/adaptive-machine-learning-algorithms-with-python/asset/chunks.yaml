    samples


    I used the adaptive steepest descent algorithm (6.8) to compute the principal
    eigenvectors. The adaptive algorithm helps us adapt to this abrupt change and
    recalculate the underlying PCA statistics—in this case, the first two principal
    eigenvectors of the data. See Figure [8-9](#522202_1_En_8_Chapter.xhtml#Fig9).


    ![](images/522202_1_En_8_Chapter/522202_1_En_8_Fig9_HTML.jpg)


    Figure 8-9


    The adaptive steepest descent algorithm (6.8) rapidly adapts to abrupt non-stationary
    data for principal eigenvector computation.


    The Python code for this algorithm is given in Section [6.3](#522202_1_En_8_Chapter.xhtml#Sec5).'
