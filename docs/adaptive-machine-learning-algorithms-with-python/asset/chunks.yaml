    ## 2.4 Adaptive Mean and Covariance of Nonstationary Sequences


    In the stationary case, given a sequence {`x`[*k*]∈ℜ^(*n*)}, we can compute the
    adaptive mean `m`[*k*] as follows:


    ![$$ {\mathbf{m}}_k=\frac{1}{k}\sum \limits_{i=1}^k{\mathbf{x}}_i={\mathbf{m}}_{k-1}+\frac{1}{k}\left({\mathbf{x}}_k-{\mathbf{m}}_{k-1}\right)
    $$](images/522202_1_En_2_Chapter/522202_1_En_2_Chapter_TeX_IEq6.png). (2.2)


    Similarly, the adaptive correlation `A`[*k*] is


    ![$$ {A}_k=\frac{1}{k}\sum \limits_{i=1}^k{\mathbf{x}}_i{\mathbf{x}}_i^T={A}_{k-1}+\frac{1}{k}\left({\mathbf{x}}_k{\mathbf{x}}_k^T-{A}_{k-1}\right)
    $$](images/522202_1_En_2_Chapter/522202_1_En_2_Chapter_TeX_IEq7.png). (2.3)


    Here we use all samples up to time instant *k*.


    If, however, the data is non-stationary, we use a *forgetting factor* 0<*β*≤1
    to implement an effective window of size 1/(1–*β*) as


    ![$$ {\mathbf{m}}_k=\frac{1}{k}\sum \limits_{i=1}^k{\beta}^{k-i}{\mathbf{x}}_i=\beta
    {\mathbf{m}}_{k-1}+\frac{1}{k}\left({\mathbf{x}}_k-\beta {\mathbf{m}}_{k-1}\right)
    $$](images/522202_1_En_2_Chapter/522202_1_En_2_Chapter_TeX_IEq8.png) (2.4)


    and


    ![$$ {A}_k=\frac{1}{k}\sum \limits_{i=1}^k{\beta}^{k-i}{\mathbf{x}}_i{\mathbf{x}}_i^T=\beta
    {A}_{k-1}+\frac{1}{k}\left({\mathbf{x}}_k{\mathbf{x}}_k^T-\beta {A}_{k-1}\right)
    $$](images/522202_1_En_2_Chapter/522202_1_En_2_Chapter_TeX_IEq9.png). (2.5)


    This effective window ensures that the past data samples are downweighted with
    an exponentially fading window compared to the recent ones in order to afford
    the tracking capability of the adaptive algorithm. The exact value of *β* depends
    on the specific application. Generally speaking, for slow time-varying {`x`[*k*]},
    *β* is chosen close to 1 to implement a large effective window, whereas for fast
    time-varying {`x`[*k*]}, *β* is chosen near zero for a small effective window
    [Benveniste et al. 90].


    The following is Python code to adaptively compute a mean vector and correlation
    matrix with data `X[nDim,nSamples]`:


    ```

    for epoch in range(nEpochs):

    for iter in range(nSamples):

    cnt = nSamples*epoch + iter

    x = X[:,iter]

    x = x.reshape(nDim,1)

    # Eq.2.4

    m = beta * m  + (1.0/(1 + cnt)) * (x - beta * m)

    # Eq.2.5

    A = beta * A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - beta * A)

    ```


    ## 2.5 Adaptive Covariance and Inverses


    Given the mean and correlations discussed before, the adaptive covariance matrix
    `B`[*k*] can also be computed as follows:


    ![$$ {B}_k=\frac{1}{k}\sum \limits_{i=1}^k{\beta}^{k-i}\left({\mathbf{x}}_i-{\mathbf{m}}_i\right){\left({\mathbf{x}}_i-{\mathbf{m}}_i\right)}^T=\beta
    {B}_{k-1}+\frac{1}{k}\left(\left({\mathbf{x}}_k-{\mathbf{m}}_k\right){\left({\mathbf{x}}_k-{\mathbf{m}}_k\right)}^T-\beta
    {B}_{k-1}\right) $$](images/522202_1_En_2_Chapter/522202_1_En_2_Chapter_TeX_IEq10.png)
    (2.6)


    From the adaptive correlation matrix `A`[*k*] in ([2.5](#522202_1_En_2_Chapter.xhtml#Par22)),
    the inverse correlation matrix ![$$ {A}_k^{-1} $$](images/522202_1_En_2_Chapter/522202_1_En_2_Chapter_TeX_IEq11.png)
    can be obtained adaptively by the Sherman-Morrison formula [Sherman–Morrison,
    Wikipedia] as


    ![$$ {A}_k^{-1}=\frac{k}{\beta \left(k-1\right)}\left({A}_{k-1}^{-1}-\frac{A_{k-1}^{-1}{\mathbf{x}}_k{\mathbf{x}}_k^T{A}_{k-1}^{-1}}{\beta
    \left(k-1\right)+{\mathbf{x}}_k^T{A}_{k-1}^{-1}{\mathbf{x}}_k}\right) $$](images/522202_1_En_2_Chapter/522202_1_En_2_Chapter_TeX_IEq12.png).
    (2.7)


    Similarly, the inverse covariance matrix ![$$ {B}_k^{-1} $$](images/522202_1_En_2_Chapter/522202_1_En_2_Chapter_TeX_IEq13.png)
    can be obtained adaptively as


    ![$$ {B}_k^{-1}=\frac{k}{\beta \left(k-1\right)}\left({B}_{k-1}^{-1}-\frac{B_{k-1}^{-1}\left({\mathbf{x}}_k-{\mathbf{m}}_k\right){\left({\mathbf{x}}_k-{\mathbf{m}}_k\right)}^T{B}_{k-1}^{-1}}{\beta
    \left(k-1\right)+{\left({\mathbf{x}}_k-{\mathbf{m}}_k\right)}^T{B}_{k-1}^{-1}\left({\mathbf{x}}_k-{\mathbf{m}}_k\right)}\right)
    $$](images/522202_1_En_2_Chapter/522202_1_En_2_Chapter_TeX_IEq14.png). (2.8)


    The following is Python code to adaptively compute inverse correlation and inverse
    covariance matrices with data `X[nDim,nSamples]`:


    ```

    for epoch in range(nEpochs):

    for iter in range(nSamples):

    cnt = nSamples*epoch + iter

    x = X[:,iter]

    x = x.reshape(nDim,1)

    y = Y[:,iter]

    y = x.reshape(nDim,1)

    # Eq.2.7

    k = cnt+2

    AW = (k/(beta*(k-1))) * (AW - (AW * (x @ x.T) * AW) \

    / (beta*(k-1) + x.T @ AW @ x))

    # Eq.2.8

    BW = (k/(beta*(k-1))) * (BW - (BW * (y @ y.T) * BW) \

    / (beta*(k-1) + y.T @ BW @ y))

    ```'
