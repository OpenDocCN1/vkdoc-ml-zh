- fmt: '### Computation of ![$$ {\alpha}_k^i $$](images/522202_1_En_6_Chapter/522202_1_En_6_Chapter_TeX_IEq30.png)
    for Steepest Descent


    From `J(w[i]; A)` in (6.1), we compute `α` that minimizes `J(w[i] − α g[i]; A)`,
    where


    ![$$ {\mathbf{g}}_i=-2A{\mathbf{w}}_i+{\mathbf{w}}_i{{\mathbf{w}}_i}^TA{\mathbf{w}}_i+\sum
    \limits_{j=1}^{i-1}{\mathbf{w}}_j{{\mathbf{w}}_j}^TA{\mathbf{w}}_i+A{\mathbf{w}}_i{{\mathbf{w}}_i}^T{\mathbf{w}}_i+\sum
    \limits_{j=1}^{i-1}A{\mathbf{w}}_j{{\mathbf{w}}_j}^T{\mathbf{w}}_i $$](images/522202_1_En_6_Chapter/522202_1_En_6_Chapter_TeX_IEq31.png).


    We have


    ![$$ \frac{d J\left({\mathbf{w}}_i-\alpha {\mathbf{g}}_i\right)}{d\alpha}=\frac{1}{2}
    tr\left[{\nabla}_{{\mathbf{w}}_i-\alpha {\mathbf{g}}_i}J\left({\mathbf{w}}_i-\alpha
    {\mathbf{g}}_i\right)\frac{d{\left({\mathbf{w}}_i-\alpha {\mathbf{g}}_i\right)}^T}{d\alpha}\right]=-\frac{1}{2}{\mathbf{g}}_i^T{\nabla}_{{\mathbf{w}}_i-\alpha
    {\mathbf{g}}_i}J\left({\mathbf{w}}_i-\alpha {\mathbf{g}}_i\right), $$](images/522202_1_En_6_Chapter/522202_1_En_6_Chapter_TeX_Equa.png)


    where


    ![$$ \left(1/2\right){\nabla}_{{\mathbf{w}}_i-\alpha {\mathbf{g}}_i}J\left({\mathbf{w}}_i-\alpha
    {\mathbf{g}}_i\right)=-2A\left({\mathbf{w}}_i-\alpha {\mathbf{g}}_i\right)+\left({\mathbf{w}}_i-\alpha
    {\mathbf{g}}_i\right){\left({\mathbf{w}}_i-\alpha {\mathbf{g}}_i\right)}^TA\left({\mathbf{w}}_i-\alpha
    {\mathbf{g}}_i\right) $$](images/522202_1_En_6_Chapter/522202_1_En_6_Chapter_TeX_Equb.png)


    ![$$ +A\left({\mathbf{w}}_i-\alpha {\mathbf{g}}_i\right){\left({\mathbf{w}}_i-\alpha
    {\mathbf{g}}_i\right)}^T\left({\mathbf{w}}_i-\alpha {\mathbf{g}}_i\right)+\sum
    \limits_{j=1}^{i-1}{\mathbf{w}}_j{{\mathbf{w}}_j}^TA\left({\mathbf{w}}_i-\alpha
    {\mathbf{g}}_i\right)+\sum \limits_{j=1}^{i-1}A{\mathbf{w}}_j{{\mathbf{w}}_j}^T\left({\mathbf{w}}_i-\alpha
    {\mathbf{g}}_i\right). $$](images/522202_1_En_6_Chapter/522202_1_En_6_Chapter_TeX_Equc.png)


    Simplifying this equation, we obtain the following cubic equation:


    ![$$ {c}_3{\alpha}^3+{c}_2{\alpha}^2+{c}_1\alpha +{c}_0=0, $$](images/522202_1_En_6_Chapter/522202_1_En_6_Chapter_TeX_Equd.png)


    where


    ![$$ {c}_0=-{\mathbf{g}}_i^T{\mathbf{g}}_i $$](images/522202_1_En_6_Chapter/522202_1_En_6_Chapter_TeX_IEq32.png),
    ![$$ {c}_1={\mathbf{g}}_i^T{H}_i{\mathbf{g}}_i $$](images/522202_1_En_6_Chapter/522202_1_En_6_Chapter_TeX_IEq33.png),
    ![$$ {c}_2=-3\left({\mathbf{g}}_i^TA{\mathbf{g}}_i{\mathbf{w}}_i^T{\mathbf{g}}_i+{\mathbf{w}}_i^TA{\mathbf{g}}_i{\mathbf{g}}_i^T{\mathbf{g}}_i\right)
    $$](images/522202_1_En_6_Chapter/522202_1_En_6_Chapter_TeX_IEq34.png), ![$$ {c}_3=2{\mathbf{g}}_i^TA{\mathbf{g}}_i{\mathbf{g}}_i^T{\mathbf{g}}_i
    $$](images/522202_1_En_6_Chapter/522202_1_En_6_Chapter_TeX_IEq35.png).


    Here `H[i]` is the Hessian of `J(w[i]; A)` given in (6.7).


    It is well known that a cubic polynomial has at least one real root (two complex
    conjugate roots with a real root or three real roots). The roots can also be computed
    in closed form as shown in [Artin 91]. If a root is complex, then `w[i] − α g[i]`
    is complex, and clearly this is not the root we are looking for. If we have three
    real roots, then we can either take the root corresponding to minimum `J(w[i]
    − α g[i]; A)` or the one corresponding to `3c[3]α² + 2c[2]α + c[1] > 0`.


    ### Steepest Descent Algorithm Code


    The following Python code implements this algorithm with data `X[nDim, nSamples]`:


    ```python

    from numpy import linalg as la

    A  = np.zeros(shape=(nDim,nDim)) # stores adaptive correlation matrix

    W1 = 0.1 * np.ones(shape=(nDim,nEA)) # weight vectors of all algorithms

    W2 = W1

    I  = np.identity(nDim)

    Weight = 1

    nEpochs = 1

    for epoch in range(nEpochs):

    for iter in range(nSamples):

    cnt = nSamples*epoch + iter

    # Update data correlation matrix A with current sample x

    x = X1[:,iter]

    x = x.reshape(nDim,1)

    A = Weight * A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - Weight * A)

    # Steepest Descent

    G = -2 * A @ W2 + A @ W2 @ np.triu(W2.T @ W2) + \

    W2 @ np.triu(W2.T @ A @ W2)

    for i in range(nEA):

    M = np.zeros(shape=(nDim,nDim))

    for k in range(i):

    wk = W2[:,k].reshape(nDim,1)

    M = M + (A @ (wk @ wk.T) + (wk @ wk.T) @ A)

    wi = W2[:,i].reshape(nDim,1)

    F = - 2*A + 2*A @ (wi @ wi.T) + 2 * (wi @ wi.T) @ A + \

    A * (wi.T @ wi) + (wi.T @ A @ wi) * I  +  M

    gi = G[:,i].reshape(nDim,1)

    a0 = np.asscalar(gi.T @ gi)

    a1 = np.asscalar(- gi.T @ F @ gi)

    a2 = np.asscalar(3 * ((wi.T @ A @ gi) @ (gi.T @ gi) + \

    (gi.T @ A @ gi)*(wi.T @ gi)))

    a3 = np.asscalar(- 2 * (gi.T @ A @ gi) @ (gi.T @ gi))

    c  = np.array([a3, a2, a1, a0])

    rts = np.roots(c)

    rs = np.zeros(3)

    r  = np.zeros(3)

    J  = np.zeros(3)

    cnt1 = 0

    for k in range(3):

    if np.isreal(rts[k]):

    re = np.real(rts[k])

    rs[cnt1] = re

    r = W2[:,i] - re * G[:,i]

    J[cnt1] = np.asscalar(-2*(r.T @ A @ r) + (r.T @ A @ r) * \

    (r.T @ r) + (r.T @ M @ r))

    cnt1 = cnt1 + 1

    yy = min(J)

    iyy = np.argmin(J)

    alpha = rs[iyy]

    W2[:,i] = (W2[:,i] - alpha * G[:,i]).T

    ```'
