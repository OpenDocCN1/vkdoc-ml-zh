    的梯度，我们得到用于 PCA 的 PF 齐次自适应梯度下降算法为


    ![$$ {W}_{k+1}={W}_k+{\eta}_k\left({A}_k{W}_k-\mu {W}_k\left({W}_k^T{W}_k-{I}_p\right)\right)
    $$](img/522202_1_En_5_Chapter_TeX_IEq44.png),     (5.17)


    其中 *I*[*p*] 是一个 *p*X*p* 的单位矩阵。


    *W*[k] 收敛于 *W*^*=Φ*DU*，其中 *D*=[*D*[1]|0]^T∈ℜ^(nXp)，*D*[1]=diag(*d*[1],...,*d*[*p*])∈
    ℜ^(*pXp*)，对于 i=1,...,*p*，*d*[*i*]=±![$$ \sqrt{1+\left({\lambda}_i/\mu \right)}
    $$](img/522202_1_En_5_Chapter_TeX_IEq45.png)，且 *U*∈ℜ^(*pXp*) 是一个任意旋转矩阵。回顾一下，*λ*[1]>*λ*[2]>...>*λ*[*p*]>*λ*[*p*+1]≥...≥*λ*[*n*]
    >0 是 *A* 的特征值，**ϕ**[*i*] 是对应于 *λ*[*i*] 的特征向量，使得 Φ=[**ϕ**[1] ... **ϕ**[*n*]] 是标准正交的。


    ### PF 收缩算法


    PF 收缩 PCA 算法的目标函数为


    ![$$ J\left({\mathbf{w}}_k^i;{A}_k\right)=-{{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i+\mu
    \left(\sum \limits_{j=1}^{i-1}{\left({{\mathbf{w}}_k^j}^T{\mathbf{w}}_k^i\right)}²+\frac{1}{2}{\left({{\mathbf{w}}_k^i}^T{\mathbf{w}}_k^i-1\right)}²\right)
    $$](img/522202_1_En_5_Chapter_TeX_IEq46.png),  (5.18)


    其中 *μ* > 0 且 *i*=1,…,*p*。用于 PCA 的 PF 收缩自适应梯度下降算法为


    ![$$ {W}_{k+1}={W}_k+{\eta}_k\left({A}_k{W}_k-\mu {W}_k UT\left({W}_k^T{W}_k-{I}_p\right)\right)
    $$](img/522202_1_En_5_Chapter_TeX_IEq47.png),     (5.19)


    其中 UT[⋅] 将其矩阵参数对角线以下的所有元素设置为零。*W*[k] 收敛于 *W*^*=[*d*[1]ϕ[1] *d*[2]ϕ[2] … *d*[*p*]ϕ[*p*]]*，其中
    d*[*i*] *= ±*![$$ \sqrt{1+\left({\lambda}_i/\mu \right)} $$](img/522202_1_En_5_Chapter_TeX_IEq48.png)。


    ### PF 加权算法


    PF 加权 PCA 算法的目标函数为


    ![$$ J\left({\mathbf{w}}_k^i;{A}_k\right)=-{c}_i{{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i+\mu
    \left(\sum \limits_{j=1,j\ne i}^p{c}_j{\left({{\mathbf{w}}_k^j}^T{\mathbf{w}}_k^i\right)}²+\frac{c_i}{2}{\left({{\mathbf{w}}_k^i}^T{\mathbf{w}}_k^i-1\right)}²\right)
    $$](img/522202_1_En_5_Chapter_TeX_IEq49.png) (5.20)


    其中 *c*[1]>*c*[2]>…>*c*[*p*]>0，*μ* > 0，且 *i*=1,…,*p*。用于 PCA 的 PF 加权自适应梯度下降算法为


    ![$$ {W}_{k+1}={W}_k+{\eta}_k\left({A}_k{W}_kC-\mu {W}_kC\left({W}_k^T{W}_k-{I}_p\right)\right)
    $$](img/522202_1_En_5_Chapter_TeX_IEq50.png),     (5.21)


    其中 *C=diag*(*c*[1],…,*c*[*p*])。*W*[*k*] 收敛于 *W*^(***)=[*d*[1]ϕ[1] *d*[2]ϕ[2] …
    *d*[*p*]ϕ[*p*]]，*其中 d*[*i*] = ±![$$ \sqrt{1+\left({\lambda}_i/\mu \right)} $$](img/522202_1_En_5_Chapter_TeX_IEq51.png)。


    ### PF 算法 Python 代码


    以下 Python 代码使用数据 `X[nDim,nSamples]` 实现了 PF PCA 算法：


    ```

    from numpy import linalg as la

    nEA = 4 # 计算的 PCA 分量数量

    nEpochs  = 2

    A  = np.zeros(shape=(nDim,nDim)) # 存储自适应相关矩阵

    W1 = 0.1 * np.ones(shape=(nDim,nEA)) # 所有算法的权重向量

    W2 = W1

    W3 = W1

    c = [2-0.3*k for k in range(nEA)]

    C = np.diag(c)

    I  = np.identity(nEA)

    mu = 2

    for epoch in range(nEpochs):

    for iter in range(nSamples):

    cnt = nSamples*epoch + iter

    x = X[:,iter]

    x = x.reshape(nDim,1)

    A = A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - A)

    # 齐次梯度下降

    W1 = W1 + (1/(100 + cnt))*(A @ W1 - mu * W1 @ ((W1.T @ W1) - I))

    # 收缩梯度下降

    W2 = W2 + (1/(100 + cnt))*(A @ W2 - mu * W2 @ np.triu((W2.T @ W2) - I))

    # 加权梯度下降

    W3 = W3 + (1/(100 + cnt))*(A @ W3 @ C - mu * W3 @ C @ ((W3.T @ W3) - I))

    ```


