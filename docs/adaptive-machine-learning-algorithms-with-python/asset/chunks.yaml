    ![$$ {\mathbf{w}}_{k+1}^i={\mathbf{w}}_k^i-{\eta}_k{B}_k{A}_k^{-1}{\nabla}_{{\mathbf{w}}_k^i}J\left({\mathbf{w}}_k^i;{A}_k,{B}_k\right)
    $$](img/522202_1_En_7_Chapter_TeX_IEq30.png) 对于 *i*=1,…,*p*，     (7.6)


    其中 *η*[*k*] 是一个递减的增益常数。定义 ![$$ {W}_k=\left[{\mathbf{w}}_k¹\dots {\mathbf{w}}_k^p\right]
