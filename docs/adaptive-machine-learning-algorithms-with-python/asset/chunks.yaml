    ## 2.6 自适应归一化均值算法


    自适应归一化均值算法最直接的选择是使用公式(2.2)并对每个**m**[*k*]进行归一化。然而，通过以下代价函数可以获得更高效的算法，其最小化器**w**^*是渐近归一化均值**m**/‖**m**‖，其中**m**
    = lim[*k* → ∞]*E*[**x**[*k*]]：


    ![$$ J\left({\mathbf{w}}_k;{\mathbf{x}}_k\right)={\left\Vert {\mathbf{x}}_k-{\mathbf{w}}_k\right\Vert}²+\alpha
    \left({\mathbf{w}}_k^T{\mathbf{w}}_k-1\right) $$](img/522202_1_En_2_Chapter_TeX_IEq15.png)，     (2.9)


    其中α是拉格朗日乘子，用于强制执行均值归一化的约束。*J*(**w**[*k*];**x**[*k*])关于**w**[*k*]的梯度为


    ![$$ \left(1/2\right){\nabla}_{{\mathbf{w}}_k}J\left({\mathbf{w}}_k;{\mathbf{x}}_k\right)=-\left({\mathbf{x}}_k-{\mathbf{w}}_k\right)+\alpha
    {\mathbf{w}}_k $$](img/522202_1_En_2_Chapter_TeX_IEq16.png)。     (2.10)


    将公式(2.10)乘以![$$ {\mathbf{w}}_k^T $$](img/522202_1_En_2_Chapter_TeX_IEq17.png)并应用约束条件![$$
    {\mathbf{w}}_k^T{\mathbf{w}}_k=1 $$](img/522202_1_En_2_Chapter_TeX_IEq18.png)，我们得到


    ![$$ \alpha ={\mathbf{w}}_k^T{\mathbf{x}}_k-1 $$](img/522202_1_En_2_Chapter_TeX_IEq19.png)。     (2.11)


    在公式(2.11)中使用此*α*，我们得到用于归一化均值的自适应梯度下降算法：


    ![$$ {\mathbf{w}}_{k+1}={\mathbf{w}}_k+{\eta}_k\left({\mathbf{x}}_k-{\mathbf{w}}_k^T{\mathbf{x}}_k{\mathbf{w}}_k\right)
    $$](img/522202_1_En_2_Chapter_TeX_IEq20.png)，     (2.12)


    其中*η*[*k*]是一个小的递减常数，满足 GitHub [Chatterjee GitHub] 上收敛性证明中的假设 A1.2。


    ### 自适应归一化均值算法的变体


    目标函数(2.9)有几种变体，它们衍生出许多其他用于归一化均值计算的自适应算法。(2.9)的一种变体是将公式(2.11)中*α*的值代入目标函数(2.9)，得到以下目标函数：


    ![$$ J\left({\mathbf{w}}_k;{\mathbf{x}}_k\right)={\left\Vert {\mathbf{x}}_k-{\mathbf{w}}_k\right\Vert}²+\left({\mathbf{w}}_k^T{\mathbf{x}}_k-1\right)\left({\mathbf{w}}_k^T{\mathbf{w}}_k-1\right)
    $$](img/522202_1_En_2_Chapter_TeX_IEq21.png)。     (2.13)


    与(2.9)不同，该目标函数是无约束的，并且内置了约束条件![$$ {\mathbf{w}}_k^T{\mathbf{w}}_k=1 $$](img/522202_1_En_2_Chapter_TeX_IEq22.png)。它导出了以下自适应算法：


    ![$$ {\mathbf{w}}_{k+1}={\mathbf{w}}_k+{\eta}_k\left(2{\mathbf{x}}_k-{\mathbf{w}}_k^T{\mathbf{x}}_k{\mathbf{w}}_k-{\mathbf{w}}_k^T{\mathbf{w}}_k{\mathbf{x}}_k\right)
    $$](img/522202_1_En_2_Chapter_TeX_IEq23.png)。     (2.14)


    另一种变体是使用非线性优化的罚函数法来强制执行约束条件![$$ {\mathbf{w}}_k^T{\mathbf{w}}_k=1 $$](img/522202_1_En_2_Chapter_TeX_IEq24.png)。该目标函数为


    ![$$ J\left({\mathbf{w}}_k;{\mathbf{x}}_k\right)={\left\Vert {\mathbf{x}}_k-{\mathbf{w}}_k\right\Vert}²+\frac{\mu
    }{2}{\left({\mathbf{w}}_k^T{\mathbf{w}}_k-1\right)}² $$](img/522202_1_En_2_Chapter_TeX_IEq25.png)，     (2.15)


    其中*μ*是一个正的惩罚常数。该目标函数也是无约束的，并导出了以下自适应算法：


    ![$$ {\mathbf{w}}_{k+1}={\mathbf{w}}_k+{\eta}_k\left({\mathbf{x}}_k-{\mathbf{w}}_k-\mu
    {\mathbf{w}}_k\left({\mathbf{w}}_k^T{\mathbf{w}}_k-1\right)\right) $$](img/522202_1_En_2_Chapter_TeX_IEq26.png)。     (2.16)


    以下是使用算法(2.12)、(2.14)和(2.16)，利用数据`X[nDim,nSamples]`自适应计算归一化均值的 Python 代码：


    ```

    for epoch in range(nEpochs):

    for iter in range(nSamples):

    cnt = nSamples*epoch + iter

    x = X[:,iter]

    x = x.reshape(nDim,1)

    # 公式 2.12

    w1 = w1 + (1.0/(100+cnt))*(x - (w1.T @ x)*w1)

    # 公式 2.14

    w2 = w2 + (1.0/(100+cnt))*(2*x-(w2.T @ x)*w2 - (w2.T @ w2)*x)

    # 公式 2.16

    w3 = w3 + (1.0/(100+cnt))*(x - w3- mu* w3 @ ((w3.T @ w3)-1))

    ```


    ## 2.7 自适应中位数算法


    给定一个序列{**x**[*k*]}，其渐近中位数*μ*满足以下条件：


    ![$$ \underset{k\to \infty }{\lim}\mathrm{P}\left({\mathbf{x}}_k\ge \mu \right)=\underset{k\to
    \infty }{\lim}\mathrm{P}\left({\mathbf{x}}_k&lt;\mu \right)=0.5 $$](img/522202_1_En_2_Chapter_TeX_IEq27.png)     (2.17)


    其中 P(*E*)是事件*E*的概率测度，且 0 ≤ P(*E*) ≤ 1。其最小化器**w**^*为渐近中位数*μ*的目标函数*J*(**w**[*k*];**x**[*k*])是


    *J*(**w**[*k*]; **x**[*k*]) = ‖**x**[*k*] − **w**[*k*]‖。     (2.18)


    *J*(**w**[*k*];**x**[*k*])关于**w**[*k*]的梯度为


    ![$$ {\nabla}_{{\mathbf{w}}_k}J\left({\mathbf{w}}_k;{\mathbf{x}}_k\right)=-\operatorname{sgn}\left({\mathbf{x}}_k-{\mathbf{w}}_k\right)
    $$](img/522202_1_En_2_Chapter_TeX_IEq28.png)，     (2.19)


    其中 sgn(.)是符号算子（若*x*≥0 则 sgn(*x*)=1，若*x*<0 则 sgn(*x*)=–1）。根据公式(2.19)中的梯度，我们得到自适应梯度下降算法：


    **w**[*k* + 1] = **w**[*k*] + *η*[*k*] sgn (**x**[*k*] − **w**[*k*])。     (2.20)


    以下是使用算法(2.20)，利用数据`X[nDim,nSamples]`自适应计算中位数的 Python 代码：


    ```

    for epoch in range(nEpochs):

    for iter in range(nSamples):

    cnt = nSamples*epoch + iter

    x = X[:,iter]

    x = x.reshape(nDim,1)

    # 公式 2.20

    md = md + (3.0/(1 + cnt)) * np.sign(x - md)

    ```

