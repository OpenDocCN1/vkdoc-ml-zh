    I used the same Python code I used on the stationary data in Section [8.1.1](#522202_1_En_8_Chapter.xhtml#Sec2).


    ## 8.2 Adapting to Incoming Data Drift


    While it is important to detect drift of non-stationary data, it is also important
    for our algorithms to adapt to data drift quickly. See the example of *simulated
    data* in Figure [8-8](#522202_1_En_8_Chapter.xhtml#Fig8) that abruptly changes
    to a different underlying statistic after 500 samples.


