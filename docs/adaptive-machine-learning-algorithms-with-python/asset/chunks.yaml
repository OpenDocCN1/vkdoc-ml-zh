    Table [4-2](#522202_1_En_4_Chapter.xhtml#Tab2) demonstrates


    *   Convergence of all adaptive algorithms is similar except for the RQ and IT
    algorithms.


    *   Other than IT, all algorithms converge with a time constant ∝ 1/*λ*[1].


    *   For the IT algorithm, the time constant of the principal eigenvector is 1\.
    Since *λ*[1]=17.9, the convergence of all algorithms is faster than IT.


    *   For the RQ and LUO algorithms, the time constants are ‖**w**[0]‖²/*λ*[1] and
    ‖**w**[0]‖^(–2)/*λ*[1,] respectively.


    *   Clearly, for larger ‖**w**[0]‖, RQ converges at a slower rate than other algorithms
    and LUO converges faster than other algorithms whose time constants are 1/*λ*[1].


    *   For very large ‖**w**[0]‖ such as ‖**w**[0]‖=10.0, the LUO algorithm fails
    to converge for *η*[*k*]=1/(200+*k*) because the convergence becomes unstable.


    *   For smaller ‖**w**[0]‖, the convergence of RQ is better than other algorithms
    since its time constant ‖**w**[0]‖²/*λ*[1] is smaller than other algorithms whose
    time constants are 1/*λ*[1].


