    The diagonal weight matrix `C` used for the weighted algorithms is `DIAG(2.0,
    1.7, 1.4, 1.1)`. I ran all algorithms for *three epochs* of the data, where one
    epoch means presenting all training data once in random order. I did not show
    the results for the homogeneous algorithms since the homogeneous method produces
    a linear combination of the actual eigenvectors of `A`. Thus, the direction cosines
    are not indicative of the performance of the algorithms for the homogeneous case.


    ### 5.12 Concluding Remarks


    In this chapter, I discussed 21 different algorithms for adaptive PCA and viewed
    their convergence results. For each algorithm, I presented a common framework
    including an objective function from which I derived the adaptive algorithm. The
    deflation and weighted algorithms converged for all four principal eigenvectors,
    although the performance for the first principal eigenvector is the best. The
    convergences of all algorithms are similar, except for the IT algorithm, which
    did not perform as well as the rest.


    Note that although I applied the gradient descent technique on the objective functions,
    I could have applied any other technique of nonlinear optimization such as steepest
    descent, conjugate direction, Newton-Raphson, or recursive least squares. The
    availability of the objective functions allows us to derive new algorithms by
    using new optimization techniques on them and also to perform convergence analyses
    of the adaptive algorithms.


    # 6. Accelerated Computation of Eigenvectors


    ## 6.1 Introduction


    In Chapter [5](#522202_1_En_5_Chapter.xhtml), I discussed several adaptive algorithms
    for computing principal and minor eigenvectors of the online correlation matrix
    `A[k] ∈ ℜ^(nXn)` from a sequence of vectors `{x[k] ∈ ℜ^(n)}`. I derived these
    algorithms by applying the gradient descent on an objective function. However,
    it is well known [Baldi and Hornik 95, Chatterjee et al. Mar 98, Haykin 94] that
    *principal component analysis* (PCA) algorithms based on gradient descents are
    slow to converge. Furthermore, both analytical and experimental studies show that
    convergence of these algorithms depends on appropriate selection of the gain sequence
    `{η[k]}`. Moreover, it is proven [Chatterjee et al. Nov 97; Chatterjee et al.
    Mar 98; Chauvin 89] that if the gain sequence exceeds an upper bound, then the
    algorithms may diverge or converge to a false solution.


    Since most of these algorithms are used for real-time (i.e., online) processing,
    it is especially difficult to determine an appropriate choice of the gain parameter
    at the start of the online process. Hence, it is important for wider applicability
    of these algorithms to


    *   Speed up the convergence of the algorithms, and

    *   Automatically select the gain parameter based on the current data sample.'
  raw: '## 5.11 Experimental Results


    I generated 500 samples **x**[*k*] of 10-dimensional Gaussian data (i.e., *n*=10)
    with the mean zero and covariance given below. The covariance matrix is obtained
    from the second covariance matrix in [Okada and Tomita 85] multiplied by 3\. The
    covariance matrix is


    ![](images/522202_1_En_5_Chapter/522202_1_En_5_Figa_HTML.png)


    The eigenvalues of the covariance matrix are


    17.9013, 10.2212, 8.6078, 6.5361, 2.2396, 1.8369, 1.1361, 0.7693, 0.2245, 0.1503.


    I computed the first four principal eigenvectors (i.e., the eigenvector corresponding
    to the largest four eigenvalues) (i.e., *p*=4) by the adaptive algorithms described
    here. In order to compute the online data sequence {*A*[*k*]}, I generated random
    data vectors {**x**[*k*]} from the above covariance matrix. I generated {*A*[*k*]}
    from {**x**[*k*]} by using algorithm (2.5 in Section [2.​4](#522202_1_En_2_Chapter.xhtml#Sec6))
    with *β*=1\. I computed the correlation matrix *A* after collecting all 500 samples
    **x**[*k*] as


    ![$$ A=\frac{1}{500}\sum \limits_{i=1}^{500}{\mathbf{x}}_i{\mathbf{x}}_i^T. $$](images/522202_1_En_5_Chapter/522202_1_En_5_Chapter_TeX_Equd.png)


    I referred to the eigenvectors and eigenvalues computed from this *A* by a standard
    numerical analysis method [Golub and VanLoan 83] as the *actual values*.


    I started all algorithms with **w**[0] = 0.1*ONE, where ONE is a 10X4 matrix whose
    all elements are ones. In order to measure the convergence and accuracy of the
    algorithms, I computed the direction cosine at *k*^(*th*) update of each adaptive
    algorithm as


    Direction cosine (*k*) = ![$$ \left|{{\mathbf{w}}_k^i}^T{\boldsymbol{\upvarphi}}_i\right|/\left\Vert
    {\boldsymbol{\upvarphi}}_i\right\Vert \left\Vert {\mathbf{w}}_k^i\right\Vert $$](images/522202_1_En_5_Chapter/522202_1_En_5_Chapter_TeX_IEq109.png)     (5.49)


    where ![$$ {\mathbf{w}}_k^i $$](images/522202_1_En_5_Chapter/522202_1_En_5_Chapter_TeX_IEq110.png)
    is the estimated eigenvector of *A*[*k*] at *k*^(*th*) update and **ϕ**[*i*] is
    the actual *i*^(*th*) principal eigenvector computed from all collected samples
    by a conventional numerical analysis method.


    Figure [5-3](#522202_1_En_5_Chapter.xhtml#Fig3) shows the iterates of the OJA
    algorithms (deflated and weighted) to compute the first four principal eigenvectors
    of *A*. Figure [5-4](#522202_1_En_5_Chapter.xhtml#Fig4) shows the same for the
    XU algorithms. Figure [5-5](#522202_1_En_5_Chapter.xhtml#Fig5) shows the same
    for the PF algorithms. Figure [5-6](#522202_1_En_5_Chapter.xhtml#Fig6) shows the
    iterates of the AL1 algorithms (deflated and weighted) to compute the first four
    principal eigenvectors of *A*. Figure [5-7](#522202_1_En_5_Chapter.xhtml#Fig7)
    shows the same for the AL2 algorithms. Figure [5-8](#522202_1_En_5_Chapter.xhtml#Fig8)
    shows the same for the IT algorithms. Figure [5-9](#522202_1_En_5_Chapter.xhtml#Fig9)
    shows the same for the RQ algorithms.


    ![](images/522202_1_En_5_Chapter/522202_1_En_5_Fig9_HTML.png)


    Figure 5-9


    Convergence of the first four principal eigenvectors of A by the RQ deflation
    (5.46) and RQ weighted (5.48) adaptive algorithms


    ![](images/522202_1_En_5_Chapter/522202_1_En_5_Fig8_HTML.png)


    Figure 5-8


    Convergence of the first four principal eigenvectors of A by the IT deflation
    (5.39) and IT weighted (5.41) adaptive algorithms


    ![](images/522202_1_En_5_Chapter/522202_1_En_5_Fig7_HTML.png)


    Figure 5-7


    Convergence of the first four principal eigenvectors of A by the AL2 deflation
    (5.32) and AL2 weighted (5.34) adaptive algorithms


    ![](images/522202_1_En_5_Chapter/522202_1_En_5_Fig6_HTML.png)


    Figure 5-6


    Convergence of the first four principal eigenvectors of A by the AL1 deflation
    (5.26) and AL1 weighted (5.28) adaptive algorithms


    ![](images/522202_1_En_5_Chapter/522202_1_En_5_Fig5_HTML.png)


    Figure 5-5


    Convergence of the first four principal eigenvectors of A by the PF deflation
    (5.19) and PF weighted (5.21) adaptive algorithms


    ![](images/522202_1_En_5_Chapter/522202_1_En_5_Fig4_HTML.png)


    Figure 5-4


    Convergence of the first four principal eigenvectors of A by the XU deflation
    (5.13) and XU weighted (5.15) adaptive algorithms


    ![](images/522202_1_En_5_Chapter/522202_1_En_5_Fig3_HTML.png)


    Figure 5-3


    Convergence of the first four principal eigenvectors of A by the OJA deflation
    (5.7) and OJA weighted (5.9) adaptive algorithms


    The diagonal weight matrix *C* used for the weighted algorithms is DIAG(2.0, 1.7,
    1.4, 1.1). I ran all algorithms for *three epochs* of the data, where one epoch
    means presenting all training data once in random order. I did not show the results
    for the homogeneous algorithms since the homogeneous method produces a linear
    combination of the actual eigenvectors of *A*. Thus, the direction cosines are
    not indicative of the performance of the algorithms for the homogeneous case.


    ## 5.12 Concluding Remarks


    In this chapter, I discussed 21 different algorithms for adaptive PCA and viewed
    their convergence results. For each algorithm, I presented a common framework
    including an objective function from which I derived the adaptive algorithm. The
    deflation and weighted algorithms converged for all four principal eigenvectors,
    although the performance for the first principal eigenvector is the best. The
    convergences of all algorithms are similar, except for the IT algorithm, which
    did not perform as well as the rest.


    Note that although I applied the gradient descent technique on the objective functions,
    I could have applied any other technique of nonlinear optimization such as steepest
    descent, conjugate direction, Newton-Raphson, or recursive least squares. The
    availability of the objective functions allows us to derive new algorithms by
    using new optimization techniques on them and also to perform convergence analyses
    of the adaptive algorithms.


    # 6. Accelerated Computation of Eigenvectors


    ## 6.1 Introduction


    In Chapter [5](#522202_1_En_5_Chapter.xhtml), I discussed several adaptive algorithms
    for computing principal and minor eigenvectors of the online correlation matrix
    *A*[*k*]∈ℜ^(*n*X*n*) from a sequence of vectors {**x**[*k*]∈ℜ^(*n*)}. I derived
    these algorithms by applying the gradient descent on an objective function. However,
    it is well known [Baldi and Hornik 95, Chatterjee et al*.* Mar 98, Haykin 94]
    that *principal component analysis* (PCA) algorithms based on gradient descents
    are slow to converge. Furthermore, both analytical and experimental studies show
    that convergence of these algorithms depends on appropriate selection of the gain
    sequence {*η*[*k*]}. Moreover, it is proven [Chatterjee et al*.* Nov 97; Chatterjee
    et al*.* Mar 98; Chauvin 89] that if the gain sequence exceeds an upper bound,
    then the algorithms may diverge or converge to a false solution.


    Since most of these algorithms are used for real-time (i.e., online) processing,
    it is especially difficult to determine an appropriate choice of the gain parameter
    at the start of the online process. Hence, it is important for wider applicability
    of these algorithms to


    *   Speed up the convergence of the algorithms, and


    *   Automatically select the gain parameter based on the current data sample.'
