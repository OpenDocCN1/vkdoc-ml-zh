    ### AL1 Deflation Algorithm


    The objective function for the AL1 Deflation PCA algorithm is


    ![$$ J\left({\mathbf{w}}_k^i;{A}_k\right)=-{{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i+\alpha
    \left({{\mathbf{w}}_k^i}^T{\mathbf{w}}_k^i-1\right)+2\sum \limits_{j=1}^{i-1}{\beta}_j{{\mathbf{w}}_k^j}^T{\mathbf{w}}_k^i+\mu
    \left(\sum \limits_{j=1}^{i-1}{\left({{\mathbf{w}}_k^j}^T{\mathbf{w}}_k^i\right)}^2+\frac{1}{2}{\left({{\mathbf{w}}_k^i}^T{\mathbf{w}}_k^i-1\right)}^2\right)
    $$](images/522202_1_En_5_Chapter/522202_1_En_5_Chapter_TeX_IEq61.png)     (5.25)


    for `i=1,…,p`. By solving for (`α`,`β[1]`,`β[2]`,…,`β[i–1]`), and replacing them
