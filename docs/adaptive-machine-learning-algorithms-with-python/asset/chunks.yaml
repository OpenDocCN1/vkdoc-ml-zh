    ![](images/522202_1_En_8_Chapter/522202_1_En_8_Fig14_HTML.png)


    Figure 8-14


    NOAA real-world dataset with an anomaly in one component only, detected by the
    adaptive median algorithm (2.20)


    I used the adaptive median detection algorithm (2.20) on all components of this
    dataset. I used a simple algorithm of testing to determine an anomaly:


    Anomaly = ABS (Sample_Value – Adaptive_Median) > 4 x Adaptive_Median.


    Figure [8-15](#522202_1_En_8_Chapter.xhtml#Fig15) shows the data in blue, the
    adaptive median in green, and the anomalies in red. Clearly the adaptive median
    algorithm (2.20) detects the anomaly accurately.


    ![](images/522202_1_En_8_Chapter/522202_1_En_8_Fig15_HTML.png)


    Figure 8-15


    Anomaly in the NOAA dataset detected with the adaptive median algorithm (2.20)


    The Python code used here is same as the previous example except for the detection
    threshold:


    ```

    y = (np.abs(x-w) > 4*w) # Anomaly detection threshold.

    ```'
