    We obtain the objective function for the augmented Lagrangian Method 1 homogeneous
    PCA algorithm by applying the augmented Lagrangian method of nonlinear optimization
    to the Rayleigh quotient criterion as follows:


    ![$$ J\left({\mathbf{w}}_k^i;{A}_k\right)=-{{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i+\alpha
    \left({{\mathbf{w}}_k^i}^T{\mathbf{w}}_k^i-1\right)+2\sum \limits_{j=1,j\ne i}^p{\beta}_j{{\mathbf{w}}_k^j}^T{\mathbf{w}}_k^i
    $$](images/522202_1_En_5_Chapter/522202_1_En_5_Chapter_TeX_IEq52.png),


    ![$$ +\mu \left(\sum \limits_{j=1,j\ne i}^p{\left({{\mathbf{w}}_k^j}^T{\mathbf{w}}_k^i\right)}^2+\frac{1}{2}{\left({{\mathbf{w}}_k^i}^T{\mathbf{w}}_k^i-1\right)}^2\right)
    $$](images/522202_1_En_5_Chapter/522202_1_En_5_Chapter_TeX_IEq53.png),     (5.22)


    for `i=1,…,p`, and (`α`,`β[1]`,`β[2]`,…,`β[p]`) are Lagrange multipliers and `μ`
    is a positive penalty constant. The objective function (5.22) is equivalent to
    `- tr(W_k^T A_k W_k)` under the constraint `W_k^T W_k = I_p`, which also serves
    as the energy function for the AL1 algorithms.


    Equating the gradient of (5.22) with respect to `w_k^i` to `0`, and using the
    constraint `w_k^j^T w_k^i = δ_ij`, we obtain


    `α = w_k^i^T A_k w_k^i` and `β_j = w_k^j^T A_k w_k^i` for `j=1,…,p`, `j≠i`.     (5.23)


    Replacing (`α`,`β[1]`,`β[2]`,…,`β[p]`) in the gradient of (5.22), we obtain the
    AL1 homogeneous adaptive gradient descent algorithm for PCA:


    ![$$ {W}_{k+1}={W}_k+{\eta}_k\left(\left({A}_k{W}_k-{W}_k{W}_k^T{A}_k{W}_k-\mu
    {W}_k\left({W}_k^T{W}_k-{I}_p\right)\right)\right. $$](images/522202_1_En_5_Chapter/522202_1_En_5_Chapter_TeX_IEq60.png),     (5.24)


    where `μ>0` and `I[p]` is a `p×p` identity matrix. This algorithm is the same
    as the OJA algorithm (5.5) for `μ=0`. We can prove that `W[k]` converges to `W^*
    = ΦDU`, where `D = [D[1]|0]^T ∈ ℜ^(n×p)`, `D[1] = diag(d[1],...,d[p]) ∈ ℜ^(p×p)`,
