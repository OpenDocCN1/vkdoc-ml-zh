    ## 5.11 实验结果


    我生成了 500 个 10 维高斯数据（即 *n*=10）的样本 **x**[*k*]，其均值为零，协方差如下所示。该协方差矩阵由[Okada and Tomita
    85]中的第二个协方差矩阵乘以 3 得到。协方差矩阵为


    ![](img/522202_1_En_5_Figa_HTML.png)


    该协方差矩阵的特征值为


    17.9013, 10.2212, 8.6078, 6.5361, 2.2396, 1.8369, 1.1361, 0.7693, 0.2245, 0.1503。


    我通过本文所述的自适应算法计算了前四个主特征向量（即对应最大四个特征值的特征向量）（即 *p*=4）。为了计算在线数据序列 {*A*[*k*]}，我从上述协方差矩阵生成了随机数据向量
    {**x**[*k*]}。我使用算法（第 2.​4 节中的公式 2.5）且 *β*=1，从 {**x**[*k*]} 生成了 {*A*[*k*]}。在收集完所有
    500 个样本 **x**[*k*] 后，我将相关矩阵 *A* 计算为


    ![$$ A=\frac{1}{500}\sum \limits_{i=1}^{500}{\mathbf{x}}_i{\mathbf{x}}_i^T. $$](img/522202_1_En_5_Chapter_TeX_Equd.png)


    我将通过标准数值分析方法[Golub and VanLoan 83]从该 *A* 计算出的特征向量和特征值称为*实际值*。


    所有算法均以 **w**[0] = 0.1*ONE 启动，其中 ONE 是一个所有元素均为 1 的 10X4 矩阵。为了衡量算法的收敛性和准确性，我在每个自适应算法的第
    *k* 次更新时计算方向余弦，公式如下：


    方向余弦 (*k*) = ![$$ \left|{{\mathbf{w}}_k^i}^T{\boldsymbol{\upvarphi}}_i\right|/\left\Vert
    {\boldsymbol{\upvarphi}}_i\right\Vert \left\Vert {\mathbf{w}}_k^i\right\Vert $$](img/522202_1_En_5_Chapter_TeX_IEq109.png)     (5.49)


    其中 ![$$ {\mathbf{w}}_k^i $$](img/522202_1_En_5_Chapter_TeX_IEq110.png) 是第 *k*
    次更新时 *A*[*k*] 的估计特征向量，**ϕ**[*i*] 是通过传统数值分析方法从所有收集的样本中计算出的第 *i* 个实际主特征向量。


    图 5-3 展示了 OJA 算法（消去法和加权法）计算 *A* 的前四个主特征向量的迭代过程。图 5-4 展示了 XU 算法的相同过程。图 5-5 展示了
    PF 算法的相同过程。图 5-6 展示了 AL1 算法（消去法和加权法）计算 *A* 的前四个主特征向量的迭代过程。图 5-7 展示了 AL2 算法的相同过程。图
    5-8 展示了 IT 算法的相同过程。图 5-9 展示了 RQ 算法的相同过程。


    ![](img/522202_1_En_5_Fig9_HTML.png)


    图 5-9


    通过 RQ 消去法(5.46)和 RQ 加权法(5.48)自适应算法得到的 *A* 的前四个主特征向量的收敛情况


    ![](img/522202_1_En_5_Fig8_HTML.png)


    图 5-8


    通过 IT 消去法(5.39)和 IT 加权法(5.41)自适应算法得到的 *A* 的前四个主特征向量的收敛情况


    ![](img/522202_1_En_5_Fig7_HTML.png)


    图 5-7


    通过 AL2 消去法(5.32)和 AL2 加权法(5.34)自适应算法得到的 *A* 的前四个主特征向量的收敛情况


    ![](img/522202_1_En_5_Fig6_HTML.png)


    图 5-6


    通过 AL1 消去法(5.26)和 AL1 加权法(5.28)自适应算法得到的 *A* 的前四个主特征向量的收敛情况


    ![](img/522202_1_En_5_Fig5_HTML.png)


    图 5-5


    通过 PF 消去法(5.19)和 PF 加权法(5.21)自适应算法得到的 *A* 的前四个主特征向量的收敛情况


    ![](img/522202_1_En_5_Fig4_HTML.png)


    图 5-4


    通过 XU 消去法(5.13)和 XU 加权法(5.15)自适应算法得到的 *A* 的前四个主特征向量的收敛情况


    ![](img/522202_1_En_5_Fig3_HTML.png)


    图 5-3


    通过 OJA 消去法(5.7)和 OJA 加权法(5.9)自适应算法得到的 *A* 的前四个主特征向量的收敛情况


    用于加权算法的对角权重矩阵 *C* 为 DIAG(2.0, 1.7, 1.4, 1.1)。我对所有算法运行了数据的*三个周期*，其中一个周期表示以随机顺序呈现所有训练数据一次。我没有展示同质化算法的结果，因为同质化方法会产生
    *A* 的实际特征向量的线性组合。因此，方向余弦不能反映同质化情况下算法的性能。


    ## 5.12 结论


    在本章中，我讨论了 21 种不同的自适应 PCA 算法，并展示了它们的收敛结果。对于每种算法，我提出了一个通用框架，包括一个目标函数，并从中推导出自适应算法。消去法和加权算法对所有四个主特征向量都收敛，尽管第一个主特征向量的性能最佳。除
    IT 算法外，所有算法的收敛性相似，IT 算法的表现不如其他算法。


    请注意，虽然我在目标函数上应用了梯度下降技术，但我也可以应用任何其他非线性优化技术，例如最速下降法、共轭方向法、牛顿-拉夫森法或递归最小二乘法。目标函数的可用性使我们能够通过在其上使用新的优化技术来推导新算法，并对自适应算法进行收敛性分析。


    # 6. 特征向量的加速计算


    ## 6.1 引言


    在第 5 章中，我讨论了几种自适应算法，用于从向量序列 {**x**[*k*]∈ℜ^(*n*)} 中计算在线相关矩阵 *A*[*k*]∈ℜ^(*n*X*n*)
    的主特征向量和次特征向量。我通过在目标函数上应用梯度下降法推导了这些算法。然而，众所周知[Baldi and Hornik 95, Chatterjee et
    al*.* Mar 98, Haykin 94]，基于梯度下降的*主成分分析*（PCA）算法收敛缓慢。此外，分析和实验研究均表明，这些算法的收敛性取决于增益序列
    {*η*[*k*]} 的适当选择。而且，已有证明[Chatterjee et al*.* Nov 97; Chatterjee et al*.* Mar 98;
    Chauvin 89]指出，如果增益序列超过上限，算法可能会发散或收敛到错误解。


    由于这些算法大多用于实时（即在线）处理，因此在在线过程开始时确定增益参数的适当选择尤其困难。因此，为了更广泛地应用这些算法，重要的是：


    *   加快算法的收敛速度，以及

    *   根据当前数据样本自动选择增益参数。

    '
- fmt: '# Objective Functions for Gradient-Based Adaptive PCA


    Some of the objective functions discussed in Chapters [4](#522202_1_En_4_Chapter.xhtml)
    and [5](#522202_1_En_5_Chapter.xhtml) have been used by practitioners to derive
    accelerated adaptive PCA algorithms by using advanced nonlinear optimization techniques
    such as:


    * Steepest descent (SD),

    * Conjugate direction (CD),

    * Newton-Raphson (NR), and

    * Recursive least squares (RLS).


    These optimization methods lead to faster convergence of the algorithms compared
    to the gradient descent methods discussed in Chapters [4](#522202_1_En_4_Chapter.xhtml)
    and [5](#522202_1_En_5_Chapter.xhtml). They also help us compute a value of the
    gain sequence `{η[k]}`, which is not available in the gradient descent method.
    The only drawback is the additional computation needed by these improved algorithms.
    Note that each optimization method when applied to a different objective function
    leads to a new algorithm for adaptive PCA.


    The first objective function that is used extensively in signal processing applications
    for accelerated PCA is the Rayleigh quotient (RQ) objective function described
    in Sections [4.4](#522202_1_En_4_Chapter.xhtml#Sec10) and [5.9](#522202_1_En_5_Chapter.xhtml#Sec36).
    Sarkar et al. [Sarkar et al. 89; Yang et al. 89] applied the steepest descent
    and conjugate direction methods to this objective function to compute the extremal
    (largest or smallest) eigenvectors. Fu and Dowling [Fu and Dowling 94, 95] generalized
    the conjugate direction algorithm to compute all eigenvectors. Zhu and Wang [Zhu
    and Wang 97] also used a conjugate direction method on a regularized total least
    squares version of this objective function. A survey of conjugate direction-based
    algorithms on the RQ objective function is found in [Yang et al. 89].


    The second objective function that is used for accelerated PCA is the penalty
    function (PF) objective function discussed in Sections [4.7](#522202_1_En_4_Chapter.xhtml#Sec24)
    and [5.5](#522202_1_En_5_Chapter.xhtml#Sec16). Chauvin [Chauvin 97] presents a
    gradient descent algorithm based on the PF objective function and analyzes the
    landscape of this function. Mathew et al. [Mathew et al. 94, 95, 96] also use
    this objective function to offer a Newton-type algorithm for adaptive PCA.


    The third objective function used for accelerated PCA is the information theoretic
    (IT) objective function discussed in Sections [4.5](#522202_1_En_4_Chapter.xhtml#Sec14)
    and [5.8](#522202_1_En_5_Chapter.xhtml#Sec31). Miao and Hua [Miao and Hua 98]
    present gradient descent and RLS algorithms for adaptive principal sub-space analysis.


    The fourth objective function used for accelerated PCA is the XU objective function
    given in Sections [4.6](#522202_1_En_4_Chapter.xhtml#Sec19) and [5.4](#522202_1_En_5_Chapter.xhtml#Sec11).
    For example, Xu [Xu 93], Yang [Yang 95], Fu and Dowling [Fu and Dowling 94], Bannour
    and Azimi-Sadjadi [Bannour and Azimi-Sadjadi 95], and Miao and Hua [Miao and Hua
    98] used variations of this objective function. As discussed in Section [5.4](#522202_1_En_5_Chapter.xhtml#Sec11),
    there are several variations of this objective function including the mean squared
    error at the output of a two-layer linear auto-associative neural network. Xu
    derives an algorithm for adaptive principal sub-space analysis by using gradient
    descent. Yang uses gradient descent and recursive least squares optimization methods.
    Bannour and Azimi-Sadjadi also describe a recursive least squares-based algorithm
    for adaptive PCA with this objective function. Fu and Dowling reduce this objective
    function to one similar to the RQ objective function, which can be minimized by
    the conjugate direction methods due to Sarkar et al. [Sarkar et al. 89; Yang et
    al. 89]. They also compute the minor components by using an approximation and
    by employing the deflation technique.


    ## Outline of This Chapter


    Any of the objective functions discussed in Chapters [4](#522202_1_En_4_Chapter.xhtml)
    and [5](#522202_1_En_5_Chapter.xhtml) can be used to obtain accelerated adaptive
    PCA algorithms by using nonlinear optimization techniques (on this objective function)
    such as:


    * Gradient descent,

    * Steepest descent,

    * Conjugate direction,

    * Newton-Raphson, and

    * Recursive least squares.


    I shall, however, use only one of these objective functions for the discussion
    in this chapter. I note that these analyses can be extended to the other objective
    functions in Chapters [4](#522202_1_En_4_Chapter.xhtml) and [5](#522202_1_En_5_Chapter.xhtml).
    My choice of objective function for this chapter is the XU deflation objective
    function discussed in Section [5.4](#522202_1_En_5_Chapter.xhtml#Sec11).


    Although gradient descent on the XU objective function (see Section [5.4](#522202_1_En_5_Chapter.xhtml#Sec11))
    produces the well-known Xu’s least mean square error reconstruction (LMSER) algorithm
    [Xu 93], the steepest descent, conjugate direction, and Newton-Raphson methods
    produce new adaptive algorithms for PCA [Chatterjee et al. Mar 00]. The penalty
    function (PF) deflation objective (see Section [5.5](#522202_1_En_5_Chapter.xhtml#Sec16))
    function has also been accelerated by the steepest descent, conjugate direction,
    and quasi-Newton methods of optimization by Kang et al. [Kang et al. 00].


    I shall apply these algorithms to stationary and **non-stationary multi-dimensional**
    Gaussian data sequences. I experimentally show that the adaptive steepest descent,
    conjugate direction, and Newton-Raphson algorithms converge much faster than the
    traditional gradient descent technique due to Xu [Xu 93]. Furthermore, the new
    algorithms automatically select the gain sequence `{η[k]}` based on the current
    data sample. I further compare the steepest descent algorithm with state-of-the-art
    methods such as Yang’s Projection Approximation Subspace Tracking (PASTd) [Yang
    95], Bannour and Sadjadi’s recursive least squares (RLS) [Bannour et al. 95],
    and Fu and Dowling’s conjugate gradient eigenstructure tracking (CGET1) [Fu and
    Dowling 94, 95] algorithms.


    The XU deflation objective function for adaptive PCA algorithms is given in the
    Section [5.4](#522202_1_En_5_Chapter.xhtml#Sec11) equation (5.12) as


    ```

    J(w_k^i; A_k) = -2 w_k^i^T A_k w_k^i + w_k^i^T A_k w_k^i w_k^i^T w_k^i + 2 Σ_{j=1}^{i-1}
    w_k^i^T w_k^j w_k^j^T A_k w_k^i

    ```


    (6.1)


    for `i = 1, ..., p`, where `A[k] ∈ ℜ^(n×n)` is the online observation matrix.
    I now apply different methods of nonlinear minimization to the objective function
    `J(w_k^i; A_k)` in (6.1) to obtain various algorithms for adaptive PCA.


    In Sections [6.2](#522202_1_En_6_Chapter.xhtml#Sec4), [6.3](#522202_1_En_6_Chapter.xhtml#Sec5),
    [6.4](#522202_1_En_6_Chapter.xhtml#Sec8), and [6.5](#522202_1_En_6_Chapter.xhtml#Sec10),
    I apply the gradient descent, steepest descent, conjugate direction, and Newton-Raphson
    optimization methods to the unconstrained XU objective function for PCA given
    in (6.1). Here I obtain new algorithms for adaptive PCA. In Section [6.6](#522202_1_En_6_Chapter.xhtml#Sec12),
    I present experimental results with stationary and non-stationary Gaussian sequences,
    thereby showing faster convergence of the new algorithms over traditional gradient
    descent adaptive PCA algorithms. I also compare the steepest descent algorithm
    with state-of-the-art algorithms. Section [6.7](#522202_1_En_6_Chapter.xhtml#Sec16)
    concludes the chapter.'
