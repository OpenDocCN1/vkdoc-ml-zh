  trans: '

    ### 非平稳数据实验


    为了展示算法对非平稳数据的跟踪能力，我生成了 500 个样本的零均值 10 维高斯数据（即 *n*=10），其协方差矩阵如前所述。随后，我通过生成 1000
    个样本的零均值 10 维高斯数据（协方差矩阵如下，该矩阵来自[Okada and Tomita 85]中的第五个协方差矩阵乘以 4）来突然改变数据序列：


    ![](img/522202_1_En_6_Figb_HTML.png)


    该协方差矩阵的特征值为：


    23.3662, 16.5698, 6.8611, 1.8379, 1.5452, 0.7010, 0.3851, 0.3101, 0.2677, 0.2278，


    这些值与之前的特征值截然不同。图 6-5 绘制了这 10 维非平稳数据。


    ![](img/522202_1_En_6_Fig5_HTML.png)


    图 6-5


    在 500 个样本后发生突变的 10 维非平稳随机数据


    我使用算法（第 2 章中的 2.5 式）从{**x**[*k*]}生成了{*A*[*k*]}，其中*β*=0.995。我在随机观测序列{*A*[*k*]}上应用了自适应梯度下降法(6.4)、最速下降法(6.8)、共轭方向法(6.11)和牛顿-拉夫逊法(6.12)，并通过计算每个自适应算法在第*k*次更新时的方向余弦（如(6.18)式所示）来衡量算法的收敛精度。所有算法均以*W*[0]
    = 0.1*ONE 初始化，其中 ONE 是一个所有元素均为 1 的 10×4 矩阵。此处我同样计算了前四个特征向量（即 *p*=4）。


    图 6-6 至 6-8 展示了四种算法在计算前述两个协方差矩阵的前四个主特征向量时的迭代过程。对于共轭方向法，我使用了 Hestenes-Stiefel [非线性共轭梯度法，维基百科]方法来计算
    ![$$ {\beta}_k^i $$](img/522202_1_En_6_Chapter_TeX_IEq84.png)。对于最速下降法、共轭方向法和牛顿-拉夫逊法，我通过求解一个三次方程（如第
    6.3 节至 6.5 节所述）来选择 ![$$ {\alpha}_k^i $$](img/522202_1_En_6_Chapter_TeX_IEq85.png)。


    ![](img/522202_1_En_6_Fig8_HTML.jpg)


    图 6-8


    梯度下降法(6.4)和牛顿-拉夫逊法(6.12)算法对非平稳数据两个协方差矩阵前四个主特征向量的收敛情况


    ![](img/522202_1_En_6_Fig7_HTML.jpg)


    图 6-7


    梯度下降法(6.4)和共轭方向法(6.11)算法对非平稳数据两个协方差矩阵前四个主特征向量的收敛情况


    ![](img/522202_1_En_6_Fig6_HTML.jpg)


    图 6-6


    梯度下降法(6.4)和最速下降法(6.8)算法对非平稳数据两个协方差矩阵前四个主特征向量的收敛情况


    从图 6-6 至 6-8 可以再次清晰地看出，最速下降法、共轭方向法和牛顿-拉夫逊法比传统的梯度下降法收敛更快，并且能更好地跟踪数据的变化。在某些情况下，例如图
    6-6 中针对第三个主特征向量，当数据序列发生变化时，梯度下降法失效，但新算法仍能正确执行。


    图 6-8 中四种算法之间的比较显示，对于前四个主特征向量，它们之间的差异很小。同样，在三种收敛更快的算法中，由于最速下降法(6.8)每次迭代所需的计算量最小，因此它最适合在速度和计算量之间取得最优平衡。


    ### 与最新算法的比较


    我将最速下降法(6.8)与 Yang 的 PASTd 算法、Bannour 和 Sadjadi 的 RLS 算法以及 Fu 和 Dowling 的 CGET1
    算法进行了比较。我首先在第 6.6.1 节所述的平稳数据上测试了这四种算法。


    我将 ONE 定义为一个所有元素均为 1 的 10×4 矩阵。每种算法的初始值如下：


    1.  最速下降法：


    *W*[0] = 0.1*ONE。


    1.  Yang 的 PASTd 算法：


    *W*[0] = 0.1*ONE, *β*=0.997，且对于 *i* = 1, 2, …, *p* (*p*≤*n*)，有 ![$$ {d}_0^i=0.2
    $$](img/522202_1_En_6_Chapter_TeX_IEq86.png)。


    1.  Bannour 和 Sadjadi 的 RLS 算法：


    *W*[0] = 0.1*ONE 且 *P*[0] = ONE。


    1.  Fu 和 Dowling 的 CGET1 算法：


    *W*[0] = 0.1*ONE 且 ![$$ {A}_0={\mathbf{x}}_k{\mathbf{x}}_k^T $$](img/522202_1_En_6_Chapter_TeX_IEq87.png)。


    我发现 PASTd 和 RLS 算法的性能在很大程度上分别取决于 ![$$ {d}_0^i $$](img/522202_1_En_6_Chapter_TeX_IEq88.png)
    和 *P*[0] 的初始选择。因此，我选择了在大多数实验中能给出最佳结果的初始值。本次实验的结果如图 6-9 所示。


    ![](img/522202_1_En_6_Fig9_HTML.jpg)


    图 6-9


    最速下降法(6.8)、PASTd、RLS 和 CGET1 算法对平稳数据 A 的前四个主特征向量的收敛情况


    从图 6-9 可以观察到，最速下降法和 CGET1 算法对所有四个主特征向量都表现良好。对于次要特征向量，RLS 算法的表现略优于 PASTd 算法。对于主要特征向量，所有算法都表现良好。算法之间的差异在次要（第三和第四）特征向量上尤为明显。


    接下来，我将这四种算法应用于第 6.6.2 节所述的非平稳数据，其中公式(2.5, 第 2 章)中的*β*=0.995。本次实验的结果如图 6-10 所示。


    ![](img/522202_1_En_6_Fig10_HTML.jpg)


    图 6-10


    最速下降法(6.8)、PASTd、RLS 和 CGET1 算法对非平稳数据两个协方差矩阵前四个主特征向量的收敛情况


    可以观察到，最速下降法和 CGET1 算法对所有四个主特征向量都表现良好。在处理非平稳性方面，PASTd 算法的表现优于 RLS 算法。这是预料之中的，因为
    PASTd 算法通过遗忘因子*β*=0.995 来应对非平稳性，而 RLS 算法没有此选项。

