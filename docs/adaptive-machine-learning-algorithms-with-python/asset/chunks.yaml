- fmt: '### Auto-Associative Networks


    Auto-association is a neural network structure in which the desired output is
    same as the network input `x[k]`. This is also known as the linear autoencoder
    [autoencoder, Wikipedia]. Let’s consider a two-layer linear network with weight
    matrices `W[1]` and `W[2]` for the input and output layers, respectively, and
    `p` (≤`n`) nodes in the hidden layer. The mean square error (MSE) at the network
    output is given by


    ![$$ e=E\left[{\left\Vert {\mathbf{x}}_k-{W}_2^T{W}_1^T{\mathbf{x}}_k\right\Vert}^2\right]
    $$](images/522202_1_En_1_Chapter/522202_1_En_1_Chapter_TeX_IEq15.png). (1.5)


    Due to `p` nodes in the hidden layer, a minimum MSE produces outputs that represent
    the best estimates of `x[k]` in the `ℜ[p]` subspace. Since projection onto `Φ[p]`
    minimizes the error in the `ℜ[p]` subspace, we expect the first layer weight matrix
    `W[1]` to be rotations of `Φ[p]`. The second layer weight matrix `W[2]` is the
    inverse of `W[1]` to finally represent the “best” identity transform. This intuitive
    argument has been proven [Baldi and Hornik 89,95, Bourland and Kamp 88], where
    the optimum weight matrices are


    `W[1] = Φ[p]R` and ![$$ {W}_2={R}^{-1}{\Phi}_p^T $$](images/522202_1_En_1_Chapter/522202_1_En_1_Chapter_TeX_IEq16.png),
    (1.6)


    where `R` is a non-singular `n x n` matrix. Note that if we further impose the
    constraint ![$$ {W}_2={W}_1^T $$](images/522202_1_En_1_Chapter/522202_1_En_1_Chapter_TeX_IEq17.png),
    then `R` is a unitary matrix and the input layer weight matrix `W[1]` is orthonormal
    and spans the space defined by `Φ[p]`, the `p` principal eigenvectors of the input
    correlation matrix `A`. See Figure [1-7](#522202_1_En_1_Chapter.xhtml#Fig7).


    ![](images/522202_1_En_1_Chapter/522202_1_En_1_Fig7_HTML.jpg)


    Figure 1-7


    Auto-associative neural network


    Note that if we have a single node in the hidden layer (i.e., `p=1`), then we
    obtain `e` as the output sum squared error for a two-layer linear auto-associative
    network with input layer weight vector `w` and output layer weight vector `w^T`.
    The optimal value of `w` is the first principal eigenvector of the input correlation
    matrix `A[k]`.


    The result in (1.6) suggests the possibility of a PCA algorithm by using a gradient
    correction only to the input layer weights, while the output layer weights are
    modified in a symmetric fashion, thus avoiding the backpropagation of errors in
    one of the layers. One possible version of this idea is


    ![$$ {W}_1\left(k+1\right)={W}_1(k)-\eta \frac{\mathit{\partial e}}{\mathit{\partial}{W}_1}
    $$](images/522202_1_En_1_Chapter/522202_1_En_1_Chapter_TeX_IEq18.png) and `W[2](k+1)
    = W[1](k+1)^T`. (1.7)


    Denoting `W[1](k)` by `W[k]`, we obtain an algorithm that is the same as Oja’s
    *subspace learning algorithm* (SLA).


    Algorithm (1.7) has been used widely on multivariate streaming data to extract
    the significant principal components so that we can instantaneously find the important
    data representation features. Figure [1-8](#522202_1_En_1_Chapter.xhtml#Fig8)
    shows multidimensional streaming data on the left and the rapid convergence of
    the first two principal eigenvectors on the right by the adaptive algorithm (1.7),
    which is further described in Chapter [5](#522202_1_En_5_Chapter.xhtml).


    ![](images/522202_1_En_1_Chapter/522202_1_En_1_Fig8_HTML.png)


    Figure 1-8


    Convergence of the first two principal eigenvectors computed from multidimensional
    streaming data. Data is on the left and feature convergence (ideal value = 1)
    is on the right


    The Python code to generate the first 4 principal eigenvectors from 10-dimensional
    synthetic dataset is


    ```

    from numpy import linalg as la

    A = np.zeros(shape=(nDim,nDim)) # stores adaptive correlation matrix

    W2 = 0.1 * np.ones(shape=(nDim,nEA)) # weight vectors of all algorithms

    W3 = W2

    c = [2-0.3*k for k in range(nEA)]

    C = np.diag(c)

    for epoch in range(nEpochs):

    for iter in range(nSamples):

    cnt = nSamples*epoch + iter

    # Update data correlation matrix A with current data sample x

    x = X[:,iter]

    x = x.reshape(nDim,1)

    A = A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - A)

    # Deflated Gradient Descent

    W2 = W2 + (1/(100 + cnt))*(A @ W2 - W2 @ np.triu(W2.T @ A @ W2))

    # Weighted Gradient Descent

    W3 = W3 + (1/(220 + cnt))*(A @ W3 @ C - W3 @ C @ (W3.T @ A @ W3))

    ```'
