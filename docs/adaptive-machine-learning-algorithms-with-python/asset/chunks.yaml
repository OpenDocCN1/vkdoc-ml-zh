    ## 8.3 压缩高容量与高维数据


    当输入数据量很大时，将这些数据存储在设备上用于训练机器学习模型可能会变得极其困难。如果数据是高维的（例如超过 100 维），问题会变得更加复杂。在这种情况下，我们希望将数据压缩成批次，并存储特征向量的序列，以供将来用于机器学习训练。


    在本例中，我使用了开源的 `gassensor.arff` 数据。该数据集包含 129 个分量/维度，共 13,910 个样本。我使用了自适应 EVD 算法（5.13）来计算前
    16 个主成分 [**ϕ**[1] **ϕ**[2] … **ϕ**[16]]。然后我从这 16 维的主成分中重建了数据。在图 8-10 中，左列是原始数据，右列是重建数据。显然，它们看起来非常相似，并且实现了
    8 倍的数据压缩。


    ![](img/522202_1_En_8_Fig10_HTML.jpg)


    图 8-10


    使用自适应 EVD 算法（5.13）实现 8 倍压缩的原始数据（左）与重建数据（右）


    Python 代码见第 5.4 节，以及下方针对 `dataset[nDim,nSamples]` 的代码：


    ```

    from numpy import linalg as la

    nSamples = dataset.shape[0]

    nDim = dataset.shape[1]

    nEA = 16

    A = np.zeros(shape=(nDim,nDim)) # 存储自适应相关矩阵

    N = np.zeros(shape=(1,nEA)) # 存储特征范数

    W = 0.1 * np.ones(shape=(nDim,nEA)) # 存储自适应特征向量

    for iter in range(nSamples):

    cnt = iter + 1

    # 使用当前样本 x 更新数据相关矩阵 A

    x = np.array(dataset.iloc[iter])

    x = x.reshape(nDim,1)

    A = A + (1.0/cnt)*((np.dot(x, x.T)) - A)

    etat = 1.0/(500 + cnt)

    # 缩减梯度下降

    W = W + etat*(A @ W - 0.5*W @ np.triu(W.T @ A @ W) - \

    0.5*A @ W @ np.triu(W.T @ W))

    ```


    ### 数据表示（PCA）特征


    让我们通过比较传统方法计算的批次相关矩阵的特征值和特征向量，与自适应算法（5.13）在每个自适应步骤中针对前四个主特征向量的结果，来展示自适应算法的成功。


    为了衡量自适应算法的收敛性和准确性，我计算了每个自适应算法在第 *k* 次更新时的特征向量的方向余弦，公式如下：


    方向余弦 (*k*) = ![$$ \left|{{\mathbf{w}}_k^i}^T{\boldsymbol{\upvarphi}}_i\right|/\left\Vert
    {\boldsymbol{\upvarphi}}_i\right\Vert \left\Vert {\mathbf{w}}_k^i\right\Vert $$](img/522202_1_En_8_Chapter_TeX_IEq1.png)，


    其中 ![$$ {\mathbf{w}}_k^i $$](img/522202_1_En_8_Chapter_TeX_IEq2.png) 是在第 *k* 次更新时对
    *A*[*k*] 的估计特征向量，**ϕ**[*i*] 是通过传统数值分析方法从所有收集的样本中计算出的实际第 *i* 个主特征向量。我按如下方式测量了第
    *k* 次更新时特征值的误差：


    绝对误差 (*k*) = ![$$ \left|{d}_k^i-{\lambda}_k^i\right| $$](img/522202_1_En_8_Chapter_TeX_IEq3.png)，


    其中 ![$$ {d}_k^i $$](img/522202_1_En_8_Chapter_TeX_IEq4.png) 是在第 *k* 次更新时对 *A*[*k*]
    的估计特征值，![$$ {\lambda}_k^i $$](img/522202_1_En_8_Chapter_TeX_IEq5.png) 是通过传统数值分析方法从所有收集的样本中计算出的实际第
    *i* 个主特征值。


    我执行了以下操作：


    ![](img/522202_1_En_8_Fig12_HTML.png)


    图 8-12


    使用自适应算法（5.13）时前四个主特征值的绝对误差


    ![](img/522202_1_En_8_Fig11_HTML.png)


    图 8-11


    使用自适应算法（5.13）时前四个主特征向量的方向余弦（理想值为 1）


    1.  我绘制了每个自适应步骤中特征向量与批次特征向量的方向余弦图。见图 8-11。


    2.  我绘制了每个自适应步骤中特征值与批次特征值的误差图。见图 8-12。


    最终结果如下：


    *   实际特征值：[57.865, 36.259, 27.087, 21.833]


    *   自适应特征值：[57.857, 36.251, 27.054, 21.881]


    这些结果表明，自适应算法准确地计算了 PCA 特征，这将实现 8 倍的数据压缩，以替代庞大的原始数据。


    此处使用的 Python 代码与上一节相同。


    ## 8.4 检测特征异常


    这里我使用自适应线性算法来检测数据中的异常。


    ### Yahoo 真实数据集


    该数据集是 `real_data.csv`，来源于 Yahoo Research Webscope：S5 - 一个带标签的异常检测数据集 [Yahoo Research
    Webscope]。检测机器中的异常是制造业市场的一项重要机器学习任务。我收集了来自机器的 8 维数据，这些数据偶尔会出现异常读数。检测异常的一种方法是计算当前样本与其运行中位数的偏差，并将其与一个统计量进行比较。


    我使用了自适应中位数算法（2.20）来计算运行中位数，并使用一个简单的统计量来检测异常。结果见图 8-13。我将数据绘制为蓝色，自适应中位数为绿色，异常点为红色。


    ![](img/522202_1_En_8_Fig13_HTML.png)


    图 8-13


    Yahoo Webscope 多维真实数据集，其中多个分量的异常由自适应中位数算法（2.20）检测到


    以下 Python 代码用于多维数据集 `X[nDim, nSamples]`：


    ```

    from numpy import linalg as la

    nSamples = X.shape[0]

    nDim = X.shape[1]

    w = np.zeros(shape=(nDim,1)) # 存储自适应特征向量

    anam = np.zeros(shape=(nDim,nSamples))

    mdks = np.zeros(shape=(nDim,nSamples))

    for iter in range(nSamples):

    cnt = iter + 1

    # 当前数据向量 x

    x = np.array(X.iloc[iter])

    x = x.reshape(nDim,1)

    # 公式 2.20

    w = w + (1/(1 + iter)) * np.sign(x - w)

    mdks[:,iter] = w.T

    y = (np.abs(x-w) > 0.5*w) # 异常检测阈值

    anam[:,iter] = y.T

    ```


    ### NOAA 数据集


    数据集名称为 `NOAA.arff`。数据序列有八个分量。如图 8-14 所示，分量 F3 有一个异常尖峰。


    ![](img/522202_1_En_8_Fig14_HTML.png)


    图 8-14


    NOAA 真实世界数据集，仅在一个分量中存在异常，由自适应中位数算法（2.20）检测到


    我对该数据集的所有分量使用了自适应中位数检测算法（2.20）。我使用了一个简单的测试算法来确定异常：


    异常 = 绝对值（样本值 – 自适应中位数）> 4 x 自适应中位数。


    图 8-15 中，数据为蓝色，自适应中位数为绿色，异常点为红色。显然，自适应中位数算法（2.20）准确地检测到了异常。


    ![](img/522202_1_En_8_Fig15_HTML.png)


    图 8-15


    使用自适应中位数算法（2.20）检测到的 NOAA 数据集中的异常


    此处使用的 Python 代码与上一个示例相同，只是检测阈值不同：


    ```

    y = (np.abs(x-w) > 4*w) # 异常检测阈值。

    ```

