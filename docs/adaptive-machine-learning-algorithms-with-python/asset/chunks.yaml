    etat2 = 1.0/(100 + cnt)

    # 算法 3

    W3 = W3 + etat2 * (I - W3 @ A @ W3)

    ```


    ## 3.8 实验结果


    我生成了 500 个 10 维（即 *n*=10）高斯数据样本 {**x**[*k*]}，其均值为零，协方差如下所示。该协方差矩阵是通过将 [Okada and
    Tomita 85] 中的第一个协方差矩阵乘以 3 得到的。协方差矩阵为：


    ![](img/522202_1_En_3_Figa_HTML.png)


    该协方差矩阵的特征值为：


    [17.699, 8.347, 5.126, 3.088, 1.181, 0.882, 0.261, 0.213, 0.182, 0.151]。


    ### 自适应平方根算法实验


    我分别使用方法 1、2、3 的自适应算法 (3.5)、(3.8) 和 (3.9) 来计算平方根 *A*，其中 *A* 是根据所有收集到的样本计算出的相关矩阵，如下所示：


    ![$$ A=\frac{1}{500}\sum \limits_{i=1}^{500}{\mathbf{x}}_i{\mathbf{x}}_i^T. $$](img/522202_1_En_3_Chapter_TeX_Equb.png)


    我以 *W*[0]=*I*（10X10 单位矩阵）启动算法。在每个算法的第 *k* 次更新时，我计算了实际相关矩阵 *A* 与每种方法对应的 *W*[*k*]
    的平方之间的误差的 Frobenius 范数 [Frobenius 范数，维基百科]。我将此误差记为 *e*[*k*]，如下所示：


    ![$$ {e}_k^{\mathrm{Method}1}={\left\Vert A-{W}_k^T{W}_k\right\Vert}_F $$](img/522202_1_En_3_Chapter_TeX_IEq15.png)，     (3.17)


    ![$$ {e}_k^{\mathrm{Method}2}={\left\Vert A-{W}_k{W}_k^T\right\Vert}_F $$](img/522202_1_En_3_Chapter_TeX_IEq16.png)，     (3.18)


    ![$$ {e}_k^{\mathrm{Method}3\hbox{-} 1}={\left\Vert A-{W}_k²\right\Vert}_F $$](img/522202_1_En_3_Chapter_TeX_IEq17.png)，     (3.19)


    ![$$ {e}_k^{\mathrm{Method}3\hbox{-} 2}={\left\Vert {\varPhi \varLambda}^{\frac{1}{2}}{\Phi}^T-{W}_k\right\Vert}_F
    $$](img/522202_1_En_3_Chapter_TeX_IEq18.png)。     (3.20)


    对于每种算法，我通过 (2.5) 式（其中 *β*=1）从 **x**[*k*] 生成 *A*[*k*]。在 (3.9) 中，我计算了 *A*^½ 的唯一正定解与其估计值
    *W*[*k*] 之间的误差。图 3-4 通过绘制四个误差 *e*[*k*] 随 *k* 的变化曲线，展示了所有三种方法的收敛图。在 500 个样本之后，*e*[*k*]
    的最终值为：方法 1 和 2 的 *e*[500] = 0.451，方法 3-1 (3.19) 的 *e*[500] = 0.720，方法 3-2 (3.20)
    的 *e*[500] = 0.250。


    ![](img/522202_1_En_3_Fig4_HTML.png)


    图 3-4


    A^½ 算法 (3.5)、(3.8) 和 (3.9) 的收敛情况


    从图 3-4 可以清楚地看出，所有误差都接近于零。与实际值相比的微小差异是由于输入数据变化导致 *W*[*k*] 元素中的随机波动造成的。


    ### 自适应逆平方根算法实验


    我分别使用方法 1、2、3 的自适应算法 (3.12)、(3.15) 和 (3.16) 来计算逆平方根 *A*。我以 *W*[0]=*I*（10X10 单位矩阵）启动算法。在每个算法的第
    *k* 次更新时，我计算了实际相关矩阵 *A* 与每种方法对应的 *W*[*k*] 的逆平方之间的误差的 Frobenius 范数。我将此误差记为 *e*[*k*]，如下所示：


    ![$$ {e}_k^{\mathrm{Method}1}={\left\Vert I-{W}_k^T{AW}_k\right\Vert}_F $$](img/522202_1_En_3_Chapter_TeX_IEq19.png)，     (3.21)


    ![$$ {e}_k^{\mathrm{Method}2}={\left\Vert I-{W}_k{AW}_k^T\right\Vert}_F $$](img/522202_1_En_3_Chapter_TeX_IEq20.png)，     (3.22)


    ![$$ {e}_k^{\mathrm{Method}3\hbox{-} 1}\kern0.5em ={\left\Vert I-{W}_k{AW}_k\right\Vert}_F
    $$](img/522202_1_En_3_Chapter_TeX_IEq21.png)，     (3.23)


    ![$$ {e}_k^{\mathrm{Method}3\hbox{-} 2}={\left\Vert {\varPhi \varLambda}^{-\frac{1}{2}}{\Phi}^T-{W}_k\right\Vert}_F
    $$](img/522202_1_En_3_Chapter_TeX_IEq22.png)，     (3.24)


    在 (3.24) 中，我计算了 *A*^(–½) 的唯一正定解与其估计值 *W*[*k*] 之间的误差。图 3-5 通过绘制四个误差 *e*[*k*] 随
    *k* 的变化曲线，展示了所有三种方法的收敛图。在 500 个样本之后，*e*[*k*] 的最终值为：方法 1 和 2 的 *e*[500] = 0.419，方法
    3-1 (3.23) 的 *e*[500] = 0.630，方法 3-2 (3.24) 的 *e*[500] = 0.823。


    ![](img/522202_1_En_3_Fig5_HTML.png)


    图 3-5


    A^(–½) 算法 (3.12)、(3.15) 和 (3.16) 的收敛情况


    从图 3-5 可以清楚地看出，所有误差都接近于零。与之前一样，使用更多轮次的实验显示估计精度有所提高。

