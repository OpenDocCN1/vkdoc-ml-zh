    $$](images/522202_1_En_4_Chapter/522202_1_En_4_Chapter_TeX_IEq21.png). (4.7)


    The adaptive gradient descent OJAN algorithm for PCA is


    ![$$ {\mathbf{w}}_{k+1}={\mathbf{w}}_k-{\eta}_k\left({\mathbf{w}}_k^T{\mathbf{w}}_k\right){\nabla}_{{\mathbf{w}}_k}J\left({\mathbf{w}}_k;{A}_k\right)={\mathbf{w}}_k+{\eta}_k\left({A}_k{\mathbf{w}}_k-{\mathbf{w}}_k\frac{{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k}{{\mathbf{w}}_k^T{\mathbf{w}}_k}\right)
    $$](images/522202_1_En_4_Chapter/522202_1_En_4_Chapter_TeX_IEq22.png). (4.8)


    The adaptive gradient descent LUO algorithm for PCA is


    ![$$ {\mathbf{w}}_{k+1}={\mathbf{w}}_k-{\eta}_k{\left({\mathbf{w}}_k^T{\mathbf{w}}_k\right)}^2{\nabla}_{{\mathbf{w}}_k}J\left({\mathbf{w}}_k;{A}_k\right)={\mathbf{w}}_k+{\eta}_k\left({\mathbf{w}}_k^T{\mathbf{w}}_k\right)\kern0.5em
    \left({A}_k{\mathbf{w}}_k-{\mathbf{w}}_k\frac{{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k}{{\mathbf{w}}_k^T{\mathbf{w}}_k}\right)
    $$](images/522202_1_En_4_Chapter/522202_1_En_4_Chapter_TeX_IEq23.png). (4.9)


    The Python code for these algorithms with multidimensional data `X[nDim,nSamples]`
    is


    ```

    A = np.zeros(shape=(nDim,nDim)) # stores adaptive correlation matrix

    w = 0.1 * np.ones(shape=(nDim,11)) # weight vectors of all algorithms

    for epoch in range(nEpochs):

    for iter in range(nSamples):

    cnt = nSamples*epoch + iter

    x = X[:,iter]

    x = x.reshape(nDim,1)

    A = A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - A)

    # OJAN Algorithm

    v = w[:,1].reshape(nDim, 1)

    v = v + (1/(10+cnt))*(A @ v - v @ ((v.T @ A @ v) / (v.T @ v)) )

    w[:,1] = v.reshape(nDim)

    # LUO Algorithm

    v = w[:,2].reshape(nDim, 1)

    v = v + (1/(20+cnt))*(A @ v * (v.T @ v) - v @ (v.T @ A @ v))

    w[:,2] = v.reshape(nDim)

