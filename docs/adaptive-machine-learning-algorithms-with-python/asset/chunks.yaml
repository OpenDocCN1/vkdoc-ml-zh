    # 7. Generalized Eigenvectors


    ## 7.1 Introduction and Use Cases


    This chapter is concerned with the adaptive solution of the generalized eigenvalue
    problems *A*Φ=*B*ΦΛ, *AB*Φ=ΦΛ, and *BA*Φ=ΦΛ, where *A* and *B* are real, symmetric,
    *n*X*n* matrices and *B* is positive definite. In particular, we shall consider
    the problem *A*Φ=*B*ΦΛ, although the remaining two problems are similar. The matrix
    pair (pencil) (*A*,*B*) is commonly referred to as a *symmetric-definite pencil*
    [Golub and VanLoan 83].


    As seen before, the conventional (numerical analysis) method for evaluating Φ
    and Λ requires the computation of (*A*,*B*) after collecting all of the samples,
    and then the application of a numerical procedure [Golub and VanLoan 83]; in other
    words, the approach works in a *batch* fashion. In contrast, for the online case,
    matrices (*A*,*B*) are unknown. Instead, there are available two sequences of
    random matrices {*A*[*k*],*B*[*k*]} with lim[*k→∞*]*E*[*A*[*k*]]=*A* and lim[*k→∞*]*E*[*B*[*k*]]=*B*.
    For every sample (*A*[*k*],*B*[*k*]), we need to obtain the current estimates
    (Φ[*k*],Λ[*k*]) of (Φ,Λ) respectively, such that (Φ[*k*],Λ[*k*]) converge strongly
    to (Φ,Λ).


    ### Application of GEVD in Pattern Recognition


    In pattern recognition, there are problems where we are given samples (**x∈**ℜ^(*n*))
    from different populations or pattern classes. The well-known problem of linear
    discriminant analysis (LDA) [Chatterjee et al. Nov 97, May 97, Mar 97] seeks a
    transform *W∈*ℜ^(*n*X*p*) (*p≤n*), such that the interclass distance (measured
    by the scatter of the patterns around their mixture mean) is maximized, while
    at the same time the intra-class distance (measured by the scatter of the patterns
    around their respective class means) is as small as possible. The objective of
    this transform is to group the classes into well-separated clusters. The former
    scatter matrix, known as the mixture scatter matrix, is denoted by *A*, and the
    latter matrix, known as the within-class scatter matrix, is denoted by *B* [Fukunaga
    90]. When the first column **w** of *W* is needed (i.e., *p*=1), the problem can
    be formulated in the constrained optimization framework as


    Maximize **w**^(*T*)*A***w** subject to **w**^(*T*)*B***w** = 1.     (7.1)


    A twin problem to (7.1) is to maximize the Rayleigh quotient criterion [Golub
    and VanLoan 83] with respect to **w**:


    ![$$ J\left(\mathbf{w};A,B\right)=\frac{{\mathbf{w}}^TA\mathbf{w}}{{\mathbf{w}}^TB\mathbf{w}}
    $$](images/522202_1_En_7_Chapter/522202_1_En_7_Chapter_TeX_IEq1.png).     (7.2)


    A solution to (7.1) or (7.2) leads to the generalized eigen-decomposition problem
    *A***w**=*λB***w**, where *λ* is the largest generalized eigenvalue of *A* with
    respect to *B*. In general, the *p* columns of *W* are the *p*≤*n* orthogonal
    unit generalized eigenvectors **ϕ**[1],...,**ϕ**[*p*] of *A* with respect to *B*
    where


    ![$$ {\boldsymbol{\upvarphi}}_i^TA{\boldsymbol{\upvarphi}}_j={\lambda}_i{\delta}_{ij}
    $$](images/522202_1_En_7_Chapter/522202_1_En_7_Chapter_TeX_IEq2.png), and ![$$
    {\boldsymbol{\upvarphi}}_i^TB{\boldsymbol{\upvarphi}}_j={\delta}_{ij} $$](images/522202_1_En_7_Chapter/522202_1_En_7_Chapter_TeX_IEq3.png)
    for *i*=1,…,*p*,     (7.3)


    where λ[1]> ... >λ[*p*]>λ[*p*+1]≥ ... ≥λ[*n*]>0 are the *p* largest generalized
    eigenvalues of *A* with respect to *B* in descending order of magnitude. In summary,
    LDA is a powerful feature extraction tool for the class separability feature [Chatterjee
    May 97], and our adaptive algorithms are suited to this.


    ### Application of GEVD in Signal Processing


    Next, let’s discuss an analogous problem of detecting a desired signal in the
    presence of interference. Here, we seek the optimum linear transform *W* for weighting
    the signal plus interference such that the desired signal is detected with maximum
    power and minimum interference. Given the matrix pair (*A*,*B*), where *A* is
    the correlation matrix of the signal plus interference plus noise and *B* is the
    correlation matrix of interference plus noise, we can formulate the signal detection
    problem as the constrained maximization problem in (7.1). Here, we maximize the
    signal power and minimize the power of the interference. The solution for *W*
    consists of the *p*≤*n* largest generalized eigenvectors of the matrix pencil
    (*A*,*B*). Adaptive generalized eigen-decomposition algorithms also allow the
    tracking of slow changes in the incoming data [Chatterjee et al. Nov 97, Mar 97;
    Chen et al. 2000].'
  trans: '

    ## 6.7 结论


    我提出了一种无约束目标函数，通过使用诸如梯度下降、最速下降、共轭梯度和牛顿-拉夫森等非线性优化方法，来获得各种新的主成分分析自适应算法。使用平稳和非平稳数据对这些算法进行比较表明，与梯度下降算法相比，最速下降、共轭梯度和牛顿-拉夫森算法具有更快的跟踪能力。


    应进一步考虑算法的计算复杂度。最速下降、共轭梯度和牛顿-拉夫森算法的计算复杂度为 *O*(*pn*²)。然而，如果在梯度下降算法中使用估计值 ![$$ {A}_k={\mathbf{x}}_k{\mathbf{x}}_k^T
    $$](img/522202_1_En_6_Chapter_TeX_IEq89.png) 代替公式 (6.4)，则计算复杂度降至 *O*(*pn*)，尽管收敛速度会变慢。CGET1
    算法的复杂度为 *O*(*pn*²)。PASTd 和 RLS 算法的复杂度为 *O*(*pn*)。然而，如图 6-9 和 6-10 所示，它们的收敛速度慢于最速下降和
    CGET1 算法。此外，如 [Cichocki and Unbehauen 93] 中的示例所示，梯度下降算法可以通过并行架构实现。


    # 7. 广义特征向量


    ## 7.1 引言与应用场景


    本章关注广义特征值问题 *A*Φ=*B*ΦΛ、*AB*Φ=ΦΛ 和 *BA*Φ=ΦΛ 的自适应求解，其中 *A* 和 *B* 是实对称 *n*×*n* 矩阵，且
    *B* 是正定的。我们将特别考虑问题 *A*Φ=*B*ΦΛ，尽管其余两个问题与之类似。矩阵对（束）(*A*,*B*) 通常被称为*对称正定束* [Golub
    and VanLoan 83]。


    如前所述，计算 Φ 和 Λ 的传统（数值分析）方法需要在收集所有样本后计算 (*A*,*B*)，然后应用数值过程 [Golub and VanLoan 83]；换句话说，该方法以*批处理*方式工作。相比之下，对于在线情况，矩阵
    (*A*,*B*) 是未知的。相反，存在两个随机矩阵序列 {*A*[*k*],*B*[*k*]}，满足 lim[*k→∞*]*E*[*A*[*k*]]=*A*
    和 lim[*k→∞*]*E*[*B*[*k*]]=*B*。对于每个样本 (*A*[*k*],*B*[*k*])，我们需要分别获得 (Φ,Λ) 的当前估计值
    (Φ[*k*],Λ[*k*])，使得 (Φ[*k*],Λ[*k*]) 强收敛于 (Φ,Λ)。


    ### 广义特征值分解在模式识别中的应用


    在模式识别中，存在一些问题，我们拥有来自不同总体或模式类别的样本（**x∈**ℜ^(*n*)）。著名的线性判别分析问题 [Chatterjee et al.
    Nov 97, May 97, Mar 97] 寻求一个变换 *W∈*ℜ^(*n*X*p*) (*p≤n*)，使得类间距离（通过模式围绕其混合均值的散布度量）最大化，同时类内距离（通过模式围绕其各自类别均值的散布度量）尽可能小。该变换的目标是将类别分组为分离良好的簇。前者称为混合散布矩阵，记为
    *A*；后者称为类内散布矩阵，记为 *B* [Fukunaga 90]。当需要 *W* 的第一列 **w** 时（即 *p*=1），该问题可以在约束优化框架中表述为


    最大化 **w**^(*T*)*A***w**，约束条件为 **w**^(*T*)*B***w** = 1。     (7.1)


    与 (7.1) 类似的问题是最大化关于 **w** 的瑞利商准则 [Golub and VanLoan 83]：


    ![$$ J\left(\mathbf{w};A,B\right)=\frac{{\mathbf{w}}^TA\mathbf{w}}{{\mathbf{w}}^TB\mathbf{w}}
    $$](img/522202_1_En_7_Chapter_TeX_IEq1.png)。     (7.2)


    问题 (7.1) 或 (7.2) 的解导致广义特征分解问题 *A***w**=*λB***w**，其中 *λ* 是 *A* 相对于 *B* 的最大广义特征值。通常，*W*
    的 *p* 列是 *A* 相对于 *B* 的 *p*≤*n* 个正交单位广义特征向量 **ϕ**[1],...,**ϕ**[*p*]，其中


    ![$$ {\boldsymbol{\upvarphi}}_i^TA{\boldsymbol{\upvarphi}}_j={\lambda}_i{\delta}_{ij}
    $$](img/522202_1_En_7_Chapter_TeX_IEq2.png)，且 ![$$ {\boldsymbol{\upvarphi}}_i^TB{\boldsymbol{\upvarphi}}_j={\delta}_{ij}
    $$](img/522202_1_En_7_Chapter_TeX_IEq3.png)，对于 *i*=1,…,*p*，     (7.3)


    其中 λ[1]> ... >λ[*p*]>λ[*p*+1]≥ ... ≥λ[*n*]>0 是 *A* 相对于 *B* 的 *p* 个最大广义特征值，按降序排列。总之，线性判别分析是一种用于类别可分性特征的强大特征提取工具
    [Chatterjee May 97]，我们的自适应算法适用于此。


    ### 广义特征值分解在信号处理中的应用


    接下来，让我们讨论一个在存在干扰的情况下检测期望信号的类似问题。在这里，我们寻求最优线性变换 *W* 来对信号加干扰进行加权，以便以最大功率和最小干扰检测到期望信号。给定矩阵对
    (*A*,*B*)，其中 *A* 是信号加干扰加噪声的相关矩阵，*B* 是干扰加噪声的相关矩阵，我们可以将信号检测问题表述为 (7.1) 中的约束最大化问题。在这里，我们最大化信号功率并最小化干扰功率。*W*
    的解由矩阵束 (*A*,*B*) 的 *p*≤*n* 个最大广义特征向量组成。自适应广义特征分解算法还允许跟踪输入数据中的缓慢变化 [Chatterjee
    et al. Nov 97, Mar 97; Chen et al. 2000]。

    '
- fmt: '### Methods for Generalized Eigen-Decomposition


    We first define the problem for the non-adaptive case. Each of the three generalized
    eigenvalue problems (`AΦ = BΦΛ`, `ABΦ = ΦΛ`, and `BAΦ = ΦΛ`, where `A` and `B`
    are real, symmetric, `n x n` matrices and `B` is positive definite) can be reduced
    to a standard symmetric eigenvalue problem using a Cholesky factorization of `B`
    as either `B = LL^T` or `B = U^T U`. With `B = LL^T`, we can write `AΦ = BΦΛ`
    as


    `(L^(-1) A L^(-T))(L^T Φ) = (L^T Φ)Λ` or `CΨ = ΨΛ`. (7.4)


    Here `C` is the symmetric matrix `C = L^(-1) A L^(-T)` and `Ψ = L^T Φ`. Table
    7-1 summarizes how each of the three types of problems can be reduced to the standard
    form `CΨ = ΨΛ`, and how the eigenvectors `Φ` of the original problem may be recovered
    from the eigenvectors `Ψ` of the reduced problem.


    **Table 7-1** Types of Generalized Eigen-Decomposition problems and their solutions


    | Type of Problem | Factorization of `B` | Reduction | Generalized Eigenvectors
    |

    | :--- | :--- | :--- | :--- |

    | `AΦ = BΦΛ` | `B = LL^T` | `C = L^(-1) A L^(-T)` | `Φ = L^(-T) Ψ` |

    | | `B = U^T U` | `C = U^(-T) A U^(-1)` | `Φ = U^(-1) Ψ` |

    | `ABΦ = ΦΛ` | `B = LL^T` | `C = L^T A L` | `Φ = L^(-T) Ψ` |

    | | `B = U^T U` | `C = U A U^T` | `Φ = U^(-1) Ψ` |

    | `BAΦ = ΦΛ` | `B = LL^T` | `C = L^T A L` | `Φ = L Ψ` |

    | | `B = U^T U` | `C = U A U^T` | `Φ = U^T Ψ` |


    In the adaptive case, we can extend these techniques by first (adaptively) computing
    a matrix `W[k]` for each sample `B[k]`, where `W[k]` tends to the inverse Cholesky
    factorization `L^(-1)` of `B` with probability one (w.p.1) as `k → ∞`. Any of
    the algorithms in Chapter 3 can be considered here. Next, we consider a sequence
    `{C_k = W_{k-1} A_k W_{k-1}^T}`, which is used to adaptively compute a matrix
    `V[k]`, where `V[k]` tends to the eigenvector matrix of `lim[k→∞] E[C[k]]` w.p.1
    as `k → ∞`. Any of the algorithms in Chapters 5 and 6 can be considered for this
    purpose. In conjunction, the two steps yield `W[k] V[k]`, which is proven to converge
    w.p.1 to `Φ` as `k → ∞`. Thus, the two steps can proceed *simultaneously* and
    converge strongly to the eigenvector matrix `Φ`. A full description of this method
    is given in [Chatterjee et al. May 97, Mar 97]. In this chapter, I offer a variety
    of new techniques to solve the generalized eigen-decomposition problem for the
    adaptive case.


    ### Outline of This Chapter


    In Section 7.2, I list the objective functions from which I derive the adaptive
    generalized eigen-decomposition algorithms. In Sections 7.3, 7.4, and 7.5, I present
    adaptive algorithms for the homogeneous, deflation, and weighted variations, respectively,
    from the OJA objective function. In Sections 7.6, 7.7, and 7.8, I analyze the
    same three variations for the mean squared error (XU) objective function and convergence
    proofs for the deflation case. In Sections 7.9, 7.10, and 7.11, I discuss algorithms
    derived from the penalty function (PF) objective function. In Sections 7.12, 7.13,
    and 7.14, I consider the augmented Lagrangian 1 (AL1) objective function, and
    in Sections 7.15, 7.16, and 7.17, I present the augmented Lagrangian 2 (AL2) objective
    function. In Sections 7.18, 7.19, and 7.20, I present the information theory (IT)
    criterion, and in Sections 7.21, 7.22, and 7.23, I describe the Rayleigh quotient
    (RQ) criterion. In Section 7.24, I discusses the experimental results, and in
    Section 7.25, I present conclusions.


    ## 7.2 Algorithms and Objective Functions


    Similar to the PCA algorithms (Chapter 5), in this chapter, I present several
    adaptive algorithms for generalized eigenvector computation. I consider two asymptotically
    stationary sequences `{x[k] ∈ ℜ^n}` and `{y[k] ∈ ℜ^n}` that have been centered
    to zero mean. We can represent the corresponding online correlation matrices `{A[k],
    B[k]}` of `{x[k], y[k]}` either by their instantaneous values `{x_k x_k^T, y_k
    y_k^T}` or by their running averages by (2.3). If, however, `{x[k], y[k]}` are
    non-stationary, we can construct correlation matrices `{A[k], B[k]}` out of data
    samples `{x[k], y[k]}` by (2.5).


    ### Summary of Objective Functions for Adaptive GEVD Algorithms


    Conforming to the methodology in Section 2.3, for each algorithm, I describe objective
    functions and derive the adaptive algorithms for them. The objective functions
    are


    *   Oja’s objective function (OJA),

    *   Xu’s mean squared error objective function (XU),

    *   Penalty function method (PF),

    *   Augmented Lagrangian Method 1 (AL1),

    *   Augmented Lagrangian Method 2 (AL2),

    *   Information theory criterion (IT), and

    *   Rayleigh quotient criterion (RQ).


    Same as the PCA case, there are three variations of algorithms derived from each
    objective function. They are


    1.  *Homogeneous Adaptive Rule:* These algorithms do not compute the true normalized
    generalized eigenvectors with decreasing eigenvalues.

    2.  *Deflation Adaptive Rule:* Here, we produce unit generalized eigenvectors
    with decreasing eigenvalues. However, the training is sequential, thereby making
    the training process harder for parallel implementations.

    3.  *Weighted Adaptive Rule:* These algorithms are obtained by using a different
    scalar weight for each generalized eigenvector, making them normalized and in
    the order of decreasing eigenvalues.'
