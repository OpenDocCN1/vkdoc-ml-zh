    ### RQ 加权算法


    RQ 加权 GEVD 算法的目标函数为


    ![$$ J\left({\mathbf{w}}_k^i;{A}_k,{B}_k\right)=-{c}_i\frac{{{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i}{{{\mathbf{w}}_k^i}^T{B}_k{\mathbf{w}}_k^i}+\alpha
    {c}_i\left({{\mathbf{w}}_k^i}^T{B}_k{\mathbf{w}}_k^i-1\right)+2\sum \limits_{j=1}^i{\beta}_j{c}_j{{\mathbf{w}}_k^j}^T{B}_k{\mathbf{w}}_k^i
    $$](img/522202_1_En_7_Chapter_TeX_IEq99.png)，     (7.56)


    其中 *i*=1,…,*p*，(*α*, *β*[1], *β*[2], …, *β*[*p*]) 是拉格朗日乘子。通过求解 (*α*, *β*[1], *β*[2],
    …, *β*[*k*]) 并将其代入 (7.56) 的梯度中，我们得到自适应算法：


    ![$$ {W}_{k+1}={W}_k+{\eta}_k\left({A}_k{W}_kC-{B}_k{W}_k{CW}_k^T{A}_k{W}_k\right)\kern0.5em
    \mathrm{DIAG}{\left({W}_k^T{B}_k{W}_k\right)}^{-1} $$](img/522202_1_En_7_Chapter_TeX_IEq100.png)。     (7.57)


    ### RQ 算法 Python 代码


    以下 Python 代码适用于数据 `X[nDim,nSamples]` 和 `Y[nDim,nSamples]`：


    ```

    from numpy import linalg as la

    A  = np.zeros(shape=(nDim,nDim)) # 存储自适应相关矩阵

    B  = np.zeros(shape=(nDim,nDim)) # 存储自适应相关矩阵

    W2 = 0.1 * np.ones(shape=(nDim,nEA)) # 所有算法的权向量

    W3 = W2

    c = [2.6-0.3*k for k in range(nEA)]

    C = np.diag(c)

    I  = np.identity(nDim)

    for epoch in range(nEpochs):

    for iter in range(nSamples):

    cnt = nSamples*epoch + iter

    # 使用当前数据向量 x,y 更新数据相关矩阵 A,B

    x = X[:,iter]

    x = x.reshape(nDim,1)

    A = A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - A)

    y = Y[:,iter]

    y = y.reshape(nDim,1)

    B = B + (1.0/(1 + cnt))*((np.dot(y, y.T)) - B)

    # 压缩梯度下降

    W2 = W2 + (1/(20 + cnt))*(A @ W2 - B @ W2 @ np.triu(W2.T @ A @ W2)) \

    inv(np.diag(np.diagonal(W2.T @ B @ W2)))

    # 加权梯度下降

    W3 = W3 + (1/(300 + cnt))*(A @ W3 @ C - B @ W3 @ C @ (W3.T @ A @ W3)) \

    @ inv(np.diag(np.diagonal(W3.T @ B @ W3)))

    ```


    ## 7.10 实验结果


    我从 10 维高斯数据（即 *n*=10）中生成了 1,000 个样本（{**x**[*k*]} 和 {**y**[*k*]}），其均值为零，协方差如下所示。{**x**[*k*]}
    的协方差矩阵 *A* 由 [Okada and Tomita 85] 中的第二个协方差矩阵乘以 3 得到：


    ![](img/522202_1_En_7_Figa_HTML.png)


    {**y**[*k*]} 的协方差矩阵 *B* 由 [Okada and Tomita 85] 中的第三个协方差矩阵乘以 2 得到：


    ![](img/522202_1_En_7_Figb_HTML.png)


    (*A*,*B*) 的广义特征值为


    107.9186, 49.0448, 8.3176, 5.1564, 2.8814, 2.3958, 1.9872, 1.2371, 0.9371, 0.1096。


    我通过前述自适应算法计算了前四个主广义特征向量（即对应最大四个特征值的特征向量）（即 *p*=4）。为了计算在线数据序列 {*A*[*k*]}，我从上述协方差矩阵
    *A* 生成了随机数据向量 {**x**[*k*]}。然后使用第 2 章中的算法 (2.21) 从 {**x**[*k*]} 生成 {*A*[*k*]}。类似地，我从协方差矩阵
    *B* 生成随机数据向量 {**y**[*k*]}，然后从 {**y**[*k*]} 生成 {*B*[*k*]}。在分别收集完所有 500 个样本 **x**[*k*]
    和 **y**[*k*] 后，我计算了相关矩阵 *A*[*computed*] 和 *B*[*computed*]，如下所示：


    ![$$ {A}_{computed}=\frac{1}{1000}\sum \limits_{i=1}^{1000}{\mathbf{x}}_i{\mathbf{x}}_i^T
    $$](img/522202_1_En_7_Chapter_TeX_IEq101.png) 和 ![$$ {B}_{computed}=\frac{1}{1000}\sum
    \limits_{i=1}^{1000}{\mathbf{y}}_i{\mathbf{y}}_i^T $$](img/522202_1_En_7_Chapter_TeX_IEq102.png)。


    我将通过标准数值分析方法 [Golub and VanLoan 83] 从这些 *A* 和 *B* 计算出的广义特征向量和特征值称为*实际值*。


    所有算法均以 **w**[0] = 0.1*ONE 启动，其中 ONE 是一个所有元素均为 1 的 10 X 4 矩阵。为了衡量算法的收敛性和准确性，我计算了每个自适应算法在第
    *k* 次更新时的方向余弦，如下所示：


    方向余弦 (*k*) = ![$$ \frac{\left|{{\mathbf{w}}_k^i}^T{\boldsymbol{\upvarphi}}_i\right|}{\left\Vert
    {\mathbf{w}}_k^i\left\Vert \right\Vert {\boldsymbol{\upvarphi}}_i\right\Vert }
    $$](img/522202_1_En_7_Chapter_TeX_IEq103.png)，     (7.58)


    其中 ![$$ {\mathbf{w}}_k^i $$](img/522202_1_En_7_Chapter_TeX_IEq104.png) 是在第 *k*
    次更新时估计的 (*A*[*k*],*B*[*k*]) 的广义特征向量，**ϕ**[*i*] 是通过传统数值分析方法从所有收集的样本中计算出的实际第 *i*
