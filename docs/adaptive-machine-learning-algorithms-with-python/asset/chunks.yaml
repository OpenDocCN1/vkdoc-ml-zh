  raw: "### Unified Framework\n\nIn this chapter, I present a unified framework to\
    \ derive and analyze several algorithms (some well-known) for adaptive eigen-decomposition.\
    \ The steps consist of the following:\n\n1.  Description of an objective function\
    \ from which I derive the adaptive algorithm by using the gradient descent method\
    \ of nonlinear optimization.\n\n2.  For each objective function, I offer three\
    \ methods of deriving the adaptive algorithms, which lead to three sets of adaptive\
    \ algorithms, each with its own computational cost, convergence property, and\
    \ implementation simplicity:\n    1.  *Homogeneous Adaptive Rule:* These algorithms\
    \ do not compute the true normalized eigenvectors with decreasing eigenvalues.\
    \ Instead, they produce a linear combination of the unit eigenvectors. However,\
    \ these algorithms can be computed quickly and implemented in parallel networks.\n\
    \n2.  *Deflation Adaptive Rule:* Here, we lose the homogeneity of the algorithms,\
    \ but produce unit eigenvectors with decreasing eigenvalues, thereby satisfying\
    \ many application requirements. However, the training is sequential, and the\
    \ learning rule for the weights of the *n*^(*th*) neuron depends on the training\
    \ of the previous *n*–1 neurons, thereby making the training process difficult\
    \ for parallel implementations.\n\n3.  *Weighted Adaptive Rule:* These algorithms\
    \ are obtained by breaking the symmetry of the homogeneous algorithms by using\
    \ a different scalar weight for each eigenvector. The unit eigenvectors are obtained\
    \ explicitly and in the order of decreasing eigenvalues. It is also possible to\
    \ implement these algorithms in parallel networks. However, the algorithms require\
    \ extra computation.\n\nIt is interesting to observe that many algorithms presented\
    \ here were independent discoveries over more than a decade. For example, Oja\
    \ et al*.* [Oja and Karhunen 85] first presented the Oja homogeneous algorithm\
    \ (5.5) in 1985\\. Various practitioners extensively analyzed this algorithm in\
    \ separate publications from 1989 to 1998 (see Section [5.3.1](#522202_1_En_5_Chapter.xhtml#Sec7)).\
    \ Sanger [Sanger 89] showed the deflation version (5.8) of this algorithm in 1989\\\
    . Subsequently, Oja, Brockett, Xu and Chen et al*.* presented the weighted variation\
    \ (5.10) of this algorithm during 1992-98 (see Sec. [5.3.2](#522202_1_En_5_Chapter.xhtml#Sec8)).\
    \ This chapter unifies these algorithms and many others, including several new\
    \ algorithms, in a single framework with uncomplicated derivations. Note that\
    \ although these algorithms were discovered from various perspectives, I presented\
    \ them on a single foundation.\n\nGiven an asymptotically stationary sequence\
    \ {**x**[*k*]∈ℜ^(*n*)} that has been centered to zero mean, the asymptotic data\
    \ correlation matrix is given by ![$$ A=\\underset{k\\to \\infty }{\\lim }E\\\
    left[{\\mathbf{x}}_k{\\mathbf{x}}_k^T\\right] $$](images/522202_1_En_5_Chapter/522202_1_En_5_Chapter_TeX_IEq1.png).\
    \ The *p*≤*n* orthogonal unit principal eigenvectors **ϕ**[1],...,**ϕ**[*p*] of\
    \ *A* are given by\n\n![$$ {\\boldsymbol{\\upvarphi}}_i^TA{\\boldsymbol{\\upvarphi}}_j={\\\
    lambda}_i{\\delta}_{ij} $$](images/522202_1_En_5_Chapter/522202_1_En_5_Chapter_TeX_IEq2.png),\
    \ and ![$$ {\\boldsymbol{\\upvarphi}}_i^T{\\boldsymbol{\\upvarphi}}_j={\\delta}_{ij}\
    \ $$](images/522202_1_En_5_Chapter/522202_1_En_5_Chapter_TeX_IEq3.png)for *i*=1,…,*p*,\
    \ (5.1)\n\nwhere λ[1]> ... >λ[*p*]>λ[*p*+1]≥ ... ≥λ[*n*]>0 are the *p* largest\
    \ eigenvalues of *A* in descending order of magnitude. If the sequence {**x**[*k*]}\
    \ is non-stationary, we compute the online data correlation matrix *A*[*k*]∈ℜ^(*n*X*n*)\
    \ by (2.3) or (2.5).\n\nIn my analyses of the algorithms, I follow the methodology\
    \ outlined in Section [1.​4](#522202_1_En_1_Chapter.xhtml#Sec19). For the algorithms,\
    \ I describe an *objective function J*(**w**[*i*]; *A*) and an updated rule of\
    \ the form\n\n*W*[*k* + 1] = *W*[*k*] + *η*[*k*]*h*(*W*[*k*], *A*[*k*]), (5.2)\n\
    \nwhere *h*(*W*[*k*],*A*[*k*]) follows certain continuity and regularity properties\
    \ [Ljung 77, 92] and *η*[*k*] is a decreasing gain sequence.\n\n### Outline of\
    \ This Chapter\n\nIn Section [5.2](#522202_1_En_5_Chapter.xhtml#Sec4), I discuss\
    \ the objective functions and their variations that are analyzed in this chapter.\
    \ In Section [5.3](#522202_1_En_5_Chapter.xhtml#Sec6), I present adaptive algorithms\
    \ for the homogeneous, deflation, and weighted variations for the OJA objective\
    \ function with convergence results. In Section [5.4](#522202_1_En_5_Chapter.xhtml#Sec11),\
    \ I analyze the same three variations for the mean squared error (XU) objective\
    \ function. In Section [5.5](#522202_1_En_5_Chapter.xhtml#Sec16), I discuss algorithms\
    \ derived from the penalty function (PF) objective function and prove the convergence\
    \ results. In Section [5.6](#522202_1_En_5_Chapter.xhtml#Sec21), I consider the\
    \ augmented Lagrangian 1 (AL1) objective function; in Section [5.7](#522202_1_En_5_Chapter.xhtml#Sec26),\
    \ I present the augmented Lagrangian 2 (AL2) objective function. In Section [5.8](#522202_1_En_5_Chapter.xhtml#Sec31),\
    \ I present the information theory (IT) criterion; in Section [5.9](#522202_1_En_5_Chapter.xhtml#Sec36),\
    \ I describe the Rayleigh quotient (RQ) criterion. In Section [5.10](#522202_1_En_5_Chapter.xhtml#Sec41),\
    \ I present a summary of all algorithms discussed here. In Section [5.11](#522202_1_En_5_Chapter.xhtml#Sec42),\
    \ I discuss the experimental results and I conclude the chapter with Section [5.12](#522202_1_En_5_Chapter.xhtml#Sec43).\n\
    \n## 5.2 Algorithms and Objective Functions\n\nConforming to my proposed methodology\
    \ in Chapter [2.​2](#522202_1_En_2_Chapter.xhtml#Sec2), for each algorithm, I\
    \ describe an objective function and derive the adaptive algorithm for it. I have\
    \ itemized the algorithms based on their inventors or on the objective functions\
    \ from which they are derived. The objective functions are\n\n1.  Oja’s objective\
    \ function [Oja 92; Oja et al*.* 92],\n\n2.  Mean squared error objective function\
    \ for Xu’s Algorithm [Xu 91, 93],\n\n3.  Penalty function method [Chauvin 89;\
    \ Mathew et al*.* 95],\n\n4.  Augmented Lagrangian Method 1,\n\n5.  Augmented\
    \ Lagrangian Method 2,\n\n6.  Information theory criterion [Pumbley 95; Miao and\
    \ Hua 98],\n\n7.  Rayleigh quotient criterion [Luo 97; Sarkar and Yang 89; Yang\
    \ et al*.* 89; Fu and Dowling 94, 95]."
  trans: "\n### 统一框架\n\n在本章中，我提出了一个统一框架，用于推导和分析几种（部分知名的）自适应特征分解算法。其步骤包括以下内容：\n\n1.\
    \  描述一个目标函数，我通过使用非线性优化的梯度下降法，从该函数推导出自适应算法。\n\n2.  对于每个目标函数，我提供了三种推导自适应算法的方法，从而得到三组自适应算法，每组算法在计算成本、收敛特性和实现简易性上各有特点：\n\
    \    1.  *齐次自适应规则：* 这类算法不计算特征值递减的真正归一化特征向量。相反，它们生成单位特征向量的线性组合。然而，这类算法计算速度快，且可在并行网络中实现。\n\
    \n2.  *收缩自适应规则：* 在此规则下，我们失去了算法的齐次性，但能生成特征值递减的单位特征向量，从而满足许多应用需求。然而，训练是顺序进行的，第 *n*^(*th*)\
    \ 个神经元的权值学习规则依赖于前 *n*–1 个神经元的训练，这使得训练过程难以并行实现。\n\n3.  *加权自适应规则：* 这类算法通过为每个特征向量使用不同的标量权重，打破了齐次算法的对称性而获得。单位特征向量被显式地按特征值递减顺序得到。这些算法也可以在并行网络中实现。然而，它们需要额外的计算。\n\
    \n有趣的是，这里介绍的许多算法是在超过十年的时间里独立发现的。例如，Oja 等人*.* [Oja and Karhunen 85] 于 1985 年首次提出了\
    \ Oja 齐次算法 (5.5)。众多从业者在 1989 年至 1998 年间的不同出版物中广泛分析了该算法（参见第 5.3.1 节）。Sanger [Sanger\
    \ 89] 于 1989 年展示了该算法的收缩版本 (5.8)。随后，Oja、Brockett、Xu 和 Chen 等人在 1992-98 年间提出了该算法的加权变体\
    \ (5.10)（参见第 5.3.2 节）。本章将这些算法以及许多其他算法（包括几种新算法）统一到一个具有简单推导过程的单一框架中。请注意，尽管这些算法是从不同角度发现的，但我将它们建立在一个共同的基础上。\n\
    \n给定一个已中心化为零均值的渐近平稳序列 {**x**[*k*]∈ℜ^(*n*)}，其渐近数据相关矩阵由 ![$$ A=\\underset{k\\to\
    \ \\infty }{\\lim }E\\left[{\\mathbf{x}}_k{\\mathbf{x}}_k^T\\right] $$](images/522202_1_En_5_Chapter/522202_1_En_5_Chapter_TeX_IEq1.png)\
    \ 给出。*A* 的 *p*≤*n* 个正交单位主特征向量 **ϕ**[1],...,**ϕ**[*p*] 由下式给出：\n\n![$$ {\\boldsymbol{\\\
    upvarphi}}_i^TA{\\boldsymbol{\\upvarphi}}_j={\\lambda}_i{\\delta}_{ij} $$](img/522202_1_En_5_Chapter_TeX_IEq2.png)，且\
    \ ![$$ {\\boldsymbol{\\upvarphi}}_i^T{\\boldsymbol{\\upvarphi}}_j={\\delta}_{ij}\
    \ $$](img/522202_1_En_5_Chapter_TeX_IEq3.png) 对于 *i*=1,…,*p*， (5.1)\n\n其中 λ[1]>\
    \ ... >λ[*p*]>λ[*p*+1]≥ ... ≥λ[*n*]>0 是 *A* 按幅值降序排列的 *p* 个最大特征值。如果序列 {**x**[*k*]}\
    \ 是非平稳的，我们通过 (2.3) 或 (2.5) 计算在线数据相关矩阵 *A*[*k*]∈ℜ^(*n*X*n*)。\n\n在我对算法的分析中，我遵循第\
    \ 1.​4 节概述的方法论。对于这些算法，我描述了一个*目标函数 J*(**w**[*i*]; *A*) 和一个形式如下的更新规则：\n\n*W*[*k* + 1] = *W*[*k*] + *η*[*k*]*h*(*W*[*k*],\
    \ *A*[*k*])， (5.2)\n\n其中 *h*(*W*[*k*],*A*[*k*]) 遵循某些连续性和正则性属性 [Ljung 77, 92]，且\
    \ *η*[*k*] 是一个递减的增益序列。\n\n### 本章概要\n\n在第 5.2 节中，我讨论了本章分析的目标函数及其变体。在第 5.3 节中，我针对\
    \ OJA 目标函数提出了齐次、收缩和加权变体的自适应算法及其收敛结果。在第 5.4 节中，我分析了均方误差 (XU) 目标函数的相同三种变体。在第 5.5\
    \ 节中，我讨论了从罚函数 (PF) 目标函数推导出的算法，并证明了收敛结果。在第 5.6 节中，我考虑了增广拉格朗日 1 (AL1) 目标函数；在第 5.7\
    \ 节中，我介绍了增广拉格朗日 2 (AL2) 目标函数。在第 5.8 节中，我介绍了信息论 (IT) 准则；在第 5.9 节中，我描述了瑞利商 (RQ)\
    \ 准则。在第 5.10 节中，我给出了此处讨论的所有算法的总结。在第 5.11 节中，我讨论了实验结果，并在第 5.12 节中对本章进行了总结。\n\n\
    ## 5.2 算法与目标函数\n\n遵循我在第 2.​2 章中提出的方法论，对于每个算法，我描述一个目标函数并为其推导出自适应算法。我根据算法的发明者或推导它们所依据的目标函数对它们进行了分类。这些目标函数是：\n\
    \n1.  Oja 目标函数 [Oja 92; Oja et al*.* 92]，\n\n2.  用于 Xu 算法的均方误差目标函数 [Xu 91, 93]，\n\
    \n3.  罚函数法 [Chauvin 89; Mathew et al*.* 95]，\n\n4.  增广拉格朗日方法 1，\n\n5.  增广拉格朗日方法\
    \ 2，\n\n6.  信息论准则 [Pumbley 95; Miao and Hua 98]，\n\n7.  瑞利商准则 [Luo 97; Sarkar\
    \ and Yang 89; Yang et al*.* 89; Fu and Dowling 94, 95]。\n"
- fmt: '### Summary of Objective Functions for Adaptive Algorithms


    Each algorithm is of the form (5.2), which we derive from an objective function
    `J(w[i]; A)`, where `W = [w[1], …, w[p]]` (`p ≤ n`). The objective function `J(w[i];
    A)` for each adaptive algorithm is given in Table 5-1.


    **Table 5-1** Objective Functions for Adaptive Eigen-Decomposition Algorithms
    Discussed Here


    | Alg. | Type | Objective Function `J(·)` |

    | --- | --- | --- |

    | OJA | Homogeneous | `-w_i^T A^2 w_i + 1/2 (w_i^T A w_i)^2 + Σ_{j=1, j≠i}^p (w_i^T
    A w_j)^2` |

    | | Deflation | `-w_i^T A^2 w_i + 1/2 (w_i^T A w_i)^2 + Σ_{j=1}^{i-1} (w_i^T A
    w_j)^2` |

    | | Weighted | `-c_i w_i^T A^2 w_i + c_i/2 (w_i^T A w_i)^2 + Σ_{j=1, j≠i}^p c_j
    (w_i^T A w_j)^2` |

    | XU | Homogeneous | `-w_i^T A w_i + (w_i^T A w_i)(w_i^T w_i - 1) + 2 Σ_{j=1,
    j≠i}^p w_i^T A w_j w_i^T w_i` |

    | | Deflation | `-w_i^T A w_i + (w_i^T A w_i)(w_i^T w_i - 1) + 2 Σ_{j=1}^{i-1}
    w_i^T A w_j w_j^T w_i` |

    | | Weighted | `-c_i w_i^T A w_i + c_i (w_i^T A w_i)(w_i^T w_i - 1) + 2 Σ_{j=1,
    j≠i}^p c_j w_i^T A w_j w_j^T w_i` |

    | PF | Homogeneous | `-w_i^T A w_i + μ Λ_H(w_1, …, w_p)` |

    | | Deflation | `-w_i^T A w_i + μ Λ_D(w_1, …, w_p)` |

    | | Weighted | `-c_i w_i^T A w_i + μ Λ_W(w_1, …, w_p)` |

    | AL1 | Homogeneous | `-w_i^T A w_i + α (w_i^T w_i - 1) + 2 Σ_{j=1, j≠i}^p β_j
    w_j^T w_i + μ Λ_H(w_1, …, w_p)` |

    | | Deflation | `-w_i^T A w_i + α (w_i^T w_i - 1) + 2 Σ_{j=1}^{i-1} β_j w_j^T
    w_i + μ Λ_D(w_1, …, w_i)` |

    | | Weighted | `-c_i w_i^T A w_i + α c_i (w_i^T w_i - 1) + 2 Σ_{j=1, j≠i}^p β_j
    c_j w_j^T w_i + μ Λ_W(w_1, …, w_p)` |

    | AL2 | Homogeneous | `-w_i^T A w_i + (w_i^T A w_i)_i (w_i^T w_i - 1) + 2 Σ_{j=1,
    j≠i}^p w_i^T A w_j w_j^T w_i + μ Λ_H(w_1, …, w_p)` |

    | | Deflation | `-w_i^T A w_k^i + (w_i^T A w_i)(w_i^T w_i - 1) + 2 Σ_{j=1}^{i-1}
    w_i^T A w_j w_j^T w_i + μ Λ_D(w_1, …, w_i)` |

    | | Weighted | `-c_i w_i^T A w_i + c_i (w_i^T A w_i)(w_i^T w_i - 1) + 2 Σ_{j=1,
    j≠i}^p c_j w_i^T A w_j w_j^T w_i + μ Λ_W(w_1, …, w_p)` |

    | IT | Homogeneous | `w_i^T w_i - log(w_i^T A w_i) + α (w_i^T w_i - 1) + 2 Σ_{j=1,
    j≠i}^p β_j w_j^T w_i` |

    | | Deflation | `w_i^T w_i - log(w_i^T A w_i) + α (w_i^T w_i - 1) + 2 Σ_{j=1}^{i-1}
    β_j w_j^T w_i` |

    | | Weighted | `c_i w_i^T w_i - c_i log(w_i^T A w_i) + α c_i (w_i^T w_i - 1) +
    2 Σ_{j=1, j≠i}^p β_j c_j w_j^T w_i` |

    | RQ | Homogeneous | `-(w_i^T A w_i / w_i^T w_i) + α (w_i^T w_i - 1) + 2 Σ_{j=1,
    j≠i}^p β_j w_j^T w_i` |

    | | Deflation | `-(w_i^T A w_i / w_i^T w_i) + α (w_i^T w_i - 1) + 2 Σ_{j=1}^{i-1}
    β_j w_j^T w_i` |

    | | Weighted | `-c_i (w_i^T A w_i / w_i^T w_i) + α c_i (w_i^T w_i - 1) + 2 Σ_{j=1,
    j≠i}^p β_j c_j w_j^T w_i` |


    In these expressions, `Λ_H`, `Λ_D`, `Λ_W` are defined as:


    ```

    Λ_H(w_1, …, w_p) = Σ_{j=1, j≠i}^p (w_j^T w_i)^2 + 1/2 (w_i^T w_i - 1)^2

    ```


    ```

    Λ_D(w_1, …, w_i) = Σ_{j=1}^{i-1} (w_j^T w_i)^2 + 1/2 (w_i^T w_i - 1)^2

    ```


    and


    ```

    Λ_W(w_1, …, w_p) = Σ_{j=1, j≠i}^p c_j (w_j^T w_i)^2 + c_i/2 (w_i^T w_i - 1)^2

    ```


    ## 5.3 OJA Algorithms'
