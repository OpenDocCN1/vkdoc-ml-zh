    # AL2 Algorithm

    v = w[:,9].reshape(nDim, 1)

    v = v + (1/(50+cnt))*(2* A @ v - v @ (v.T @ A @ v) –

    A@ v @ (v.T @ v) - mu* v @ (v.T @ v -1))

    w[:,9] = v.reshape(nDim)

    ```


    ### Rate of Convergence


    The convergence time constant for the principal eigenvector **ϕ**[1] is 1/(*λ*[1] + (*μ*/2))
    and for the minor eigenvectors **ϕ**[*i*] is 1/(*λ*[1]–*λ*[*i*]) for *i*=2,…,*n*.
    The time constants are dependent on the eigen-structure of the data correlation
    matrix *A*.


    ### Upper Bound of η[k]


    There exists a uniform upper bound for η[k] such that **w**[*k*] is uniformly
    bounded. Furthermore, if ‖**w**[k]‖² ≤ α+1 and *θ* is the largest eigenvalue of
    *A*[*k*], then ‖**w**[k+1]‖² ≤ ‖**w**[k]‖² if


    ![$$ {\eta}_k&lt;\frac{2}{\left(2\theta +\mu \right)\alpha }. $$](images/522202_1_En_4_Chapter/522202_1_En_4_Chapter_TeX_Equl.png)


    ## 4.10 Summary of Algorithms


    Table [4-1](#522202_1_En_4_Chapter.xhtml#Tab1) summarizes the convergence results
    of the algorithms. It also shows the upper bounds of *η*[*k*], when available.
    Here *τ* denotes the time constant, **w**[0] denotes the initial value of **w**[*k*],
    α+1 the upper bound of ‖**w**[*k*]‖² (i.e., ‖**w**[*k*]‖² ≤ α+1), and *θ* denotes
    the first principal eigenvalue of *A*[*k*].


    Table 4-1


    Summary of Convergence Results


    | Algorithm | Convergence Time Constants | Upper Bounds of *η*[*k*] |

    | --- | --- | --- |

    | OJA | 1/*λ*[1] | 2/*αθ* |

    | OJAN | 1/*λ*[1] | Not Available |

    | LUO | ‖**w**[0]‖^(–2)/*λ*[1] | Not Available |

    | RQ | ‖**w**[0]‖²/*λ*[1] | Not Available |

    | OJA+ | 1/(*λ*[1]+1) | 1/(*α*–*θ*) |

    | IT | 1 | 2(*α*+1)/*α* |

    | XU | 1/*λ*[1] | 1/*αθ* |

    | PF | 1/(*λ*[1]+*μ*) | 1/(*μα*–*θ*) |

    | AL1 | 1/(*λ*[1]+*μ*) | 1/(*μ*+*θ*)*α* |

    | AL2 | 1/(*λ*[1]+(*μ*/2)) | 2/(*μ*+2*θ*)*α* |


    Note that a smaller time constant yields faster convergence. The conclusions are


    1.  For all algorithms, except IT, convergence of **ϕ**[1] improves for larger
    values of *λ*[1].


    2.  For LUO, the time constant decreases for larger ‖**w**[0]‖, which implies
    that convergence improves for larger initial weights.


    3.  For RQ, convergence deteriorates for larger ‖**w**[0]‖.


    4.  For the PF, AL1, and AL2 algorithms, the time constant decreases for larger
    *μ*, although very large values of *μ* will make the algorithm perform poorly
    due excessive emphasis on the constraints.


    ## 4.11 Experimental Results


    I did three sets of experiments.


    1.  In the first experiment, I used the adaptive algorithms described before on
    a single data set with various starting vectors **w**[0] [Chatterjee, *Neural
    Networks*, Vol. 18, No. 2, pp. 145-149, March 2005].


    2.  In the second experiment, I generated several data samples and used the adaptive
    algorithms with the same starting vector **w**[0] [Chatterjee, *Neural Networks*,
    Vol. 18, No. 2, pp. 145-149, March 2005].


    3.  In the third experiment, I used a **real-world non-stationary** data set from
    a public dataset [V. Souza et al*.* 2020] to demonstrate the fast convergence
    of the adaptive algorithms to the first principal eigenvector of the ensemble
    correlation matrix.


    ### Experiments with Various Starting Vectors *w*[*0*]


    [Chatterjee, *Neural Networks*, Vol. 18, No. 2, pp. 145-149, March 2005].


    I generated 1,000 samples of 10-dimensional Gaussian data (i.e., *n*=10) with
    the mean zero and covariance given below. The covariance matrix is obtained from
    the second covariance matrix in [Okada and Tomita 85] multiplied by 3, which is


    ![](images/522202_1_En_4_Chapter/522202_1_En_4_Figa_HTML.gif)     (4.20)


    The eigenvalues of the covariance matrix are


    17.9013, 10.2212, 8.6078, 6.5361, 2.2396, 1.8369, 1.1361, 0.7693, 0.2245, 0.1503.


    I computed the principal eigenvector (i.e., the eigenvector corresponding to the
    largest eigenvalue = 17.9013) by the adaptive algorithms described before from
    different starting vectors **w**[0]. I obtained **w**[0]=*c****r**, where **r∈ℜ**^(10)
    is a *N*(0,1) random vector and *c*∈[0.05,2.0]. This causes a variation in ‖**w**[0]‖
    from 0.1 to 5.0.


    In order to compute the online data sequence {*A*[*k*]}, I generated random data
    vectors {**x**[*k*]} from the covariance matrix ([4.20](#522202_1_En_4_Chapter.xhtml#Par128)).
    I generated {*A*[*k*]} from {**x**[*k*]} by using the algorithm (2.5) with *β*=1\.
    I compute the correlation matrix *A* after collecting all 500 samples **x**[*k*]
    as


    ![$$ A=\frac{1}{500}\sum \limits_{i=1}^{500}{\mathbf{x}}_i{\mathbf{x}}_i^T. $$](images/522202_1_En_4_Chapter/522202_1_En_4_Chapter_TeX_Equm.png)


    I refer to the eigenvectors and eigenvalues computed from this *A* by a standard
    numerical analysis method [Golub and VanLoan 83] as the *actual values* .


    In order to measure the convergence and accuracy of the algorithms, I computed
    the percentage direction cosine at *k*^(*th*) update of each adaptive algorithm
    as


    Percentage Direction Cosine (*k*) = ![$$ \frac{100\left|{\mathbf{w}}_k^T{\boldsymbol{\upvarphi}}_1\right|}{\left\Vert
    {\mathbf{w}}_k\right\Vert } $$](images/522202_1_En_4_Chapter/522202_1_En_4_Chapter_TeX_IEq41.png),     (4.21)


    where **w**[*k*] is the estimated first principal eigenvector of *A*[*k*] at *k*^(*th*)
    update and **ϕ**[1] is the actual first principal eigenvector computed from all
    collected samples by a conventional numerical analysis method. For all algorithms,
    I used *η*[*k*]=1/(200+*k*). For the PF, AL1, and AL2 algorithms, I used *μ*=10\.
    The results are summarized in Table [4-2](#522202_1_En_4_Chapter.xhtml#Tab2).
    I reported the percentage direction cosines after sample values *k*=*N*/2 and
    *N* (i.e., *k*=250 and 500) for each algorithm.


    Table 4-2


    Convergence of the Principal Eigenvector of A by Adaptive Algorithms at Sample
    Values k={250,500} for Different Initial Values **w**[0]'
  trans: '

    ### 自适应算法


    关于 **w**[*k*] 的 (4.18) 的梯度为


    ![$$ \left(1/2\right){\nabla}_{{\mathbf{w}}_k}J\left({\mathbf{w}}_k;{A}_k\right)=-\left(2{A}_k{\mathbf{w}}_k-{\mathbf{w}}_k{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k-{A}_k{\mathbf{w}}_k{\mathbf{w}}_k^T{\mathbf{w}}_k-\mu
    {\mathbf{w}}_k\left({\mathbf{w}}_k^T{\mathbf{w}}_k-1\right)\right). $$](img/522202_1_En_4_Chapter_TeX_Equk.png)


    用于 PCA 的自适应梯度下降 AL2 算法为


    ![$$ {\mathbf{w}}_{k+1}={\mathbf{w}}_k+{\eta}_k\left(2{A}_k{\mathbf{w}}_k-{\mathbf{w}}_k{\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k-{A}_k{\mathbf{w}}_k{\mathbf{w}}_k^T{\mathbf{w}}_k-\mu
    {\mathbf{w}}_k\left({\mathbf{w}}_k^T{\mathbf{w}}_k-1\right)\right) $$](img/522202_1_En_4_Chapter_TeX_IEq40.png),    (4.19)


    其中 *μ* > 0。


    该算法针对多维数据 `X[nDim,nSamples]` 的 Python 代码如下：


    ```

    mu = 10

    A = np.zeros(shape=(nDim,nDim)) # stores adaptive correlation matrix

    w = 0.1 * np.ones(shape=(nDim,11)) # weight vectors of all algorithms

    for epoch in range(nEpochs):

    for iter in range(nSamples):

    cnt = nSamples*epoch + iter

    x = X[:,iter]

    x = x.reshape(nDim,1)

    A = A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - A)

    # AL2 Algorithm

    v = w[:,9].reshape(nDim, 1)

    v = v + (1/(50+cnt))*(2* A @ v - v @ (v.T @ A @ v) –

    A@ v @ (v.T @ v) - mu* v @ (v.T @ v -1))

    w[:,9] = v.reshape(nDim)

    ```


    ### 收敛速度


    主特征向量 **ϕ**[1] 的收敛时间常数为 1/(*λ*[1] + (*μ*/2))，次特征向量 **ϕ**[*i*] 的收敛时间常数为 1/(*λ*[1]–*λ*[*i*])，其中
    *i*=2,…,*n*。这些时间常数取决于数据相关矩阵 *A* 的特征结构。


    ### η[k] 的上界


    存在一个统一的 η[k] 上界，使得 **w**[*k*] 一致有界。此外，如果 ‖**w**[k]‖² ≤ α+1 且 *θ* 是 *A*[*k*] 的最大特征值，那么当满足以下条件时，‖**w**[k+1]‖²
    ≤ ‖**w**[k]‖²：


    ![$$ {\eta}_k&lt;\frac{2}{\left(2\theta +\mu \right)\alpha }. $$](img/522202_1_En_4_Chapter_TeX_Equl.png)


    ## 4.10 算法总结


    表 4-1 总结了各算法的收敛结果。该表还显示了 *η*[*k*] 的上界（如果存在）。其中 *τ* 表示时间常数，**w**[0] 表示 **w**[*k*]
    的初始值，α+1 表示 ‖**w**[*k*]‖² 的上界（即 ‖**w**[*k*]‖² ≤ α+1），*θ* 表示 *A*[*k*] 的第一主特征值。


    表 4-1


    收敛结果总结


    | 算法 | 收敛时间常数 | *η*[*k*] 的上界 |

    | --- | --- | --- |

    | OJA | 1/*λ*[1] | 2/*αθ* |

    | OJAN | 1/*λ*[1] | 不可用 |

    | LUO | ‖**w**[0]‖^(–2)/*λ*[1] | 不可用 |

    | RQ | ‖**w**[0]‖²/*λ*[1] | 不可用 |

    | OJA+ | 1/(*λ*[1]+1) | 1/(*α*–*θ*) |

    | IT | 1 | 2(*α*+1)/*α* |

    | XU | 1/*λ*[1] | 1/*αθ* |

    | PF | 1/(*λ*[1]+*μ*) | 1/(*μα*–*θ*) |

    | AL1 | 1/(*λ*[1]+*μ*) | 1/(*μ*+*θ*)*α* |

    | AL2 | 1/(*λ*[1]+(*μ*/2)) | 2/(*μ*+2*θ*)*α* |


    请注意，时间常数越小，收敛速度越快。结论如下：


    1.  对于除 IT 之外的所有算法，*λ*[1] 的值越大，**ϕ**[1] 的收敛效果越好。

    2.  对于 LUO 算法，‖**w**[0]‖ 越大，时间常数越小，这意味着初始权重越大，收敛效果越好。

    3.  对于 RQ 算法，‖**w**[0]‖ 越大，收敛效果越差。

    4.  对于 PF、AL1 和 AL2 算法，*μ* 越大，时间常数越小，但 *μ* 值过大会因过度强调约束而导致算法性能不佳。


    ## 4.11 实验结果


    我进行了三组实验。


    1.  在第一组实验中，我对单个数据集使用了前面描述的自适应算法，并采用了不同的起始向量 **w**[0] [Chatterjee, *Neural Networks*,
    Vol. 18, No. 2, pp. 145-149, March 2005]。

    2.  在第二组实验中，我生成了多个数据样本，并使用相同的起始向量 **w**[0] 应用了自适应算法 [Chatterjee, *Neural Networks*,
    Vol. 18, No. 2, pp. 145-149, March 2005]。

    3.  在第三组实验中，我使用了一个来自公共数据集的**真实世界非平稳**数据集 [V. Souza et al*.* 2020]，以证明自适应算法能够快速收敛到集成相关矩阵的第一主特征向量。


