    ## 5.5 PF 算法


    ### PF 齐次算法


    通过将瑞利商准则表示为以下惩罚函数，我们得到了惩罚函数齐次 PCA 算法的目标函数：


    ![$$ J\left({\mathbf{w}}_k^i;{A}_k\right)=-{{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i+\mu
    \left(\sum \limits_{j=1,j\ne i}^p{\left({{\mathbf{w}}_k^j}^T{\mathbf{w}}_k^i\right)}²+\frac{1}{2}{\left({{\mathbf{w}}_k^i}^T{\mathbf{w}}_k^i-1\right)}²\right)
