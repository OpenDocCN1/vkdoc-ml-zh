    We observed that data representation and classification problems lead to matrix
    algebra problems, which have two solutions depending on the nature of the inputs.


    1.  The first set of solutions requires the relevant matrices to be known in advance.


    2.  The second set of solutions requires a sequence of samples from which the
    matrix can be computed.


    In this section, I explain the difference between batch and adaptive processing,
    benefits of adaptive processing on streaming data, and the requirements for adaptive
    algorithms.


    ### Iterative or Batch Processing of Static Data


    When the data is available in advance and the underlying matrices are known, we
    can use the batch processing approach. These algorithms have been used to solve
    a large variety of matrix algebra problems such as matrix inversion, EVD, SVD,
    and PCA [Cichocki et al*.* 92, 93]. These algorithms are solved in two steps:
    (1) using the pooled data to estimate the required matrices, and (2) using a numerical
    matrix algebra procedure to solve the necessary matrix functions.


    For example, consider a simple matrix inversion problem for the correlation matrix
    *A* of a data sequence {**x**[*k*]}. We can calculate the matrix inverse *A*^(-1)
    after all of the data have been collected and *A* has been calculated. This approach
    works in a batch fashion. When a new sample **x** is added, it is not difficult
    to get the inverse of the new matrix *A*[*new*]=(*nA*+**xx**^(*T*))/(*n*+1), where
    *n* is the total number of samples used to compute *A*. Although the computation
    for *A* is simple, all the computations for solving ![$$ {A}_{new}^{-1} $$](images/522202_1_En_1_Chapter/522202_1_En_1_Chapter_TeX_IEq22.png)
    need to be repeated.


    There are two problems with this batch processing approach.


    1.  First, the dimension of the samples may be large so that even if all the samples
    are available, performing the matrix algebra may be difficult or may take a prohibitively
    large amount of computational time. For example, eigenvector evaluation requires
    *O*(*n*³) computation, which is infeasible for samples of a large dimension (say
    1,000) which occurs commonly in image processing and automatic control applications.


    2.  Second, the matrix functions evaluated by conventional schemes cannot adapt
    to small changes in the data (e.g., a few incoming samples). If the matrix functions
    are estimated by conventional methods from *K* samples, then for each additional
    sample all of the computation has to be repeated.


    These deficiencies make the batch schemes inefficient for real-time applications
    where the data arrives incrementally or in an *online* fashion.'
  trans: '

    ### 优化理论


    在优化理论中，通过评估目标函数的最大值和最小值来计算各种矩阵函数。给定一个对称正定矩阵束 (*A*,*B*)，第一主广义特征向量通过最大化著名的瑞利商得到：


    ![$$ J\left(\mathbf{w}\right)=\frac{{\mathbf{w}}^TA\mathbf{w}}{{\mathbf{w}}^TB\mathbf{w}}
    $$](img/522202_1_En_1_Chapter_TeX_IEq21.png)。     (1.15)


    基于优化方法 [Luenberger]，该目标函数有三种常见的修正形式。它们是：


    *   拉格朗日乘子法：


    *J*(**w**) =  − **w**^(*T*)*A***w** + *α*(**w**^(*T*)*B***w** − 1),     (1.16)


    其中 *α* 是拉格朗日乘子。


    *   罚函数法：


    *J*(**w**) =  − **w**^(*T*)*A***w** + *μ*(**w**^(*T*)*B***w** − 1)²,     (1.17)


    其中 *μ* 是一个非负标量常数。


    *   增广拉格朗日法：


    *J*(**w**) =  − **w**^(*T*)*A***w** + *α*(**w**^(*T*)*B***w** − 1) + *μ*(**w**^(*T*)*B***w** − 1)²,     (1.18)


    其中 *α* 是拉格朗日乘子，*μ* > 0 是罚函数常数。基于此目标函数的几种算法将在第 4 章至第 7 章中给出。


    通过使用梯度的瞬时值和梯度上升技术，我们可以从这些目标函数中获得自适应算法，这将在后续章节中讨论。这些目标函数的一个优点是我们可以使用加速收敛方法，例如最速下降法、共轭方向法和牛顿-拉夫逊法。第
    6 章讨论了其中的几种方法。递归最小二乘法也已通过采用目标函数逆黑塞矩阵的各种近似，被应用于自适应矩阵计算。


    ## 1.3 为什么需要自适应算法？


    我们观察到，数据表示和分类问题会引出矩阵代数问题，根据输入的性质，这些问题有两种解决方案。


    1.  第一类解决方案要求预先知道相关的矩阵。


    2.  第二类解决方案需要一系列样本，从中可以计算出矩阵。


    在本节中，我将解释批处理和自适应处理之间的区别、自适应处理对流式数据的优势，以及自适应算法的要求。


    ### 静态数据的迭代或批处理


    当数据预先可用且底层矩阵已知时，我们可以使用批处理方法。这些算法已被用于解决各种矩阵代数问题，例如矩阵求逆、特征值分解、奇异值分解和主成分分析 [Cichocki
    et al*.* 92, 93]。这些算法分两步求解：(1) 使用汇集数据估计所需的矩阵，(2) 使用数值矩阵代数过程求解必要的矩阵函数。


    例如，考虑数据序列 {**x**[*k*]} 的相关矩阵 *A* 的简单矩阵求逆问题。我们可以在收集完所有数据并计算出 *A* 之后，计算矩阵逆 *A*^(-1)。这种方法以批处理方式工作。当添加一个新样本
    **x** 时，计算新矩阵 *A*[*new*]=(*nA*+**xx**^(*T*))/(*n*+1) 的逆并不困难，其中 *n* 是用于计算 *A* 的样本总数。尽管
    *A* 的计算很简单，但求解 ![$$ {A}_{new}^{-1} $$](img/522202_1_En_1_Chapter_TeX_IEq22.png)
    的所有计算都需要重复进行。


    这种批处理方法存在两个问题。


    1.  首先，样本的维度可能很大，因此即使所有样本都可用，执行矩阵代数运算也可能很困难，或者需要耗费大量计算时间，这在实际中是不可行的。例如，特征向量评估需要
    *O*(*n*³) 的计算量，这对于图像处理和自动控制应用中常见的大维度样本（例如 1,000）是不可行的。


    2.  其次，通过传统方案评估的矩阵函数无法适应数据的微小变化（例如，少数几个新传入的样本）。如果通过传统方法从 *K* 个样本估计出矩阵函数，那么对于每一个额外的样本，所有的计算都必须重复进行。


    这些缺陷使得批处理方案对于数据增量到达或*在线*方式的实时应用效率低下。

    '
- fmt: '### My Approach: Adaptive Processing of Streaming Data


    When we have a continuous sequence of data samples, batch algorithms are no longer
    useful. Instead, adaptive algorithms are used to solve matrix algebra problems.
    An immediate advantage of these algorithms is that they can be used on real-time
    problems such as edge computation, adaptive data compression [Le Gall 91], antenna
    array processing for noise analysis and source location [Owsley 78], and adaptive
    spectral analysis for frequency estimation [Pisarenko 73].


    My approach is to offer computationally simple adaptive algorithms for matrix
    computations from streaming data. Note that adaptive algorithms are critical in
    environments where the data volume is large, the data has high dimensions, the
    data is time varying and has changing underlying statistics, and we do not have
    sufficient storage, compute, and bandwidth to process the data with low latency.
    One such environment is edge devices and computation.


    For example, given streaming samples `{x[k]}` of customer e-shopping data, we
    need to calculate a key customer sentiment `w[k]` from the data stream. For that,
    we need to design a **simple update rule** to change the customer sentiment `w`
    as new data `x` is available. The simple update rule will change the sentiment
    `w[k]` to its latest value `w[k+1]` as new data `x[k]` is available. It is of
    the format `w[k+1] = w[k] + f(w[k], x[k])`, where


    - `w[k]` is last value of the sentiment,

    - `w[k+1]` is the latest updated value of the sentiment,

    - `x[k]` is the newest data used to calculate `w[k+1]`, and

    - `f(.)` is a simple function of `w[k]` and `x[k]`.


    An example of this update rule is the well-known algorithm [Oja 82] to compute
    the first principal eigenvector of a streaming sequence `{x[k]}`:


    ![$$ {\mathbf{w}}_{k+1}={\mathbf{w}}_k+\eta \left({\mathbf{x}}_k{\mathbf{x}}_k^T-{\mathbf{w}}_k{\mathbf{w}}_k^T{\mathbf{x}}_k{\mathbf{x}}_k^T\right){\mathbf{w}}_k
    $$](images/522202_1_En_1_Chapter/522202_1_En_1_Chapter_TeX_IEq23.png), (1.19)


    where `η > 0` is a small gain constant. In this algorithm, for each sample `x[k]`
    the update procedure requires simple matrix-vector multiplications, and the vector
    `w[k]` converges to the principal eigenvector of the data correlation matrix `A`.
    Clearly, this can be easily implemented in small CPUs.


    Figure [1-11](#522202_1_En_1_Chapter.xhtml#Fig11) shows a multivariate e-shopping
    clickstream dataset [Apczynski M. et al.]. The adaptive update rule (1.19) is
    used to compute buyer pricing sentiments. The data is shown on the left and sentiments
    computed adaptively are shown on the right (ideal value is 1). The sentiments
    are updated adaptively as new data arrives and the sentiment value converges quickly
    to its ideal value of 1.


    ![](images/522202_1_En_1_Chapter/522202_1_En_1_Fig11_HTML.png)


    **Figure 1-11** e-Shopping clickstream data on the left and buyer sentiments computed
    by the update rule (1.19) on the right (ideal value = 1)


    There are several advantages and disadvantages of adaptive algorithms over conventional
    iterative batch solutions.


    The advantages are:


    - While conventional solutions find all eigenvectors and eigenvalues, adaptive
    solutions compute the desired eigenvectors only. In many applications, we do not
    need eigenvalues. Hence, they should be more efficient.

    - Furthermore, computational complexity of adaptive algorithms depends on the
    efficiency of the matrix-vector product `Ax`. These methods can be even more efficient
    when the matrix `A` has a certain structure such as sparse, Hankel, or Toeplitz
    for which FFT can be used to speed up the computation.

    - Adaptive algorithms easily fit the framework of time-varying multidimensional
    processes such as adaptive signal processing, where the input process is continuously
    updated.


    The disadvantages are:


    - Adaptive algorithms produce an approximate value of the features for the current
    dataset whereas batch algorithms provide an exact value.

    - The adaptive approach requires a “ramp up” time to reach high accuracy as evidenced
    by the curves in Figure [1-10](#522202_1_En_1_Chapter.xhtml#Fig10).


    ### Requirements of Adaptive Algorithms


    It is clear from the previous discussion that adaptive algorithms for matrix computation
    need to be inexpensive for the computational process to keep pace with the input
    data stream. We also require that the estimates converge strongly to their actual
    values. We therefore expect our adaptive algorithms to satisfy the following constraints:


    - The algorithms should adapt to small changes in data, which is useful for real-time
    applications.

    - The estimates obtained from the algorithms should have known statistical properties.

    - The network architectures associated with the adaptive algorithms consist of
    linear units in one- or two-layer networks, such that the networks can be easily
    implemented with simple CPUs and no special hardware.

    - The computation involved in the algorithms is inexpensive such that the statistical
    procedure can process every data sample as they arrive.

    - The estimates obtained from the algorithms converge strongly to their actual
    values.


    With these requirements, we proceed to design adaptive algorithms that solve the
    matrix algebra problems considered in this book. The objective of this book is
    to develop a variety of neuromorphic adaptive algorithms to solve matrix algebra
    problems.


    Although I will discuss many adaptive algorithms to solve the matrix functions,
    most of the algorithms are of the following general form:


    `W[k+1] = W[k] + ηH(x[k], W[k])`, (1.20)


    where `H(x[k], W[k])` follows certain continuity and regularity properties [Ljung
    77,78,84,92], and `η > 0` is a small gain constant. These algorithms satisfy the
    requirements outlined before.


    ### Real-World Use of Adaptive Matrix Computation Algorithms and GitHub


    In Chapter [8](#522202_1_En_8_Chapter.xhtml), I discuss several real-world applications
    of these adaptive matrix computation algorithms. I also published the code for
    these applications in a public GitHub [Chanchal Chatterjee GitHub].'
