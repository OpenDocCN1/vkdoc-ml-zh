    \left({{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i\right)+\alpha {c}_i\left({{\mathbf{w}}_k^i}^T{B}_k{\mathbf{w}}_k^i-1\right)+2\sum
    \limits_{j=1,j\ne i}^p{\beta}_j{c}_j{{\mathbf{w}}_k^j}^T{B}_k{\mathbf{w}}_k^i
    $$](img/522202_1_En_7_Chapter_TeX_IEq89.png)     (7.48)


    其中 *i*=1,…,*p*，(*α*, *β*[1], *β*[2], …, *β*[*p*]) 为拉格朗日乘子。通过求解 (*α*, *β*[1], *β*[2],
    …, *β*[*k*]) 并将其代入 (7.48) 的梯度中，我们得到自适应算法：


    ![$$ {W}_{k+1}={W}_k+{\eta}_k\left({A}_k{W}_kC-{B}_k{W}_k{CW}_k^T{A}_k{W}_k\right)\kern0.5em
    \mathrm{DIAG}{\left({W}_k^T{A}_k{W}_k\right)}^{-1} $$](img/522202_1_En_7_Chapter_TeX_IEq90.png)。     (7.49)


    ### IT 算法 Python 代码


    以下 Python 代码适用于数据 `X[nDim,nSamples]` 和 `Y[nDim,nSamples]`：


    ```

    from numpy import linalg as la

    A  = np.zeros(shape=(nDim,nDim)) # 存储自适应相关矩阵

    B  = np.zeros(shape=(nDim,nDim)) # 存储自适应相关矩阵

    W2 = 0.1 * np.ones(shape=(nDim,nEA)) # 所有算法的权向量

    W3 = W2

    c = [2.6-0.3*k for k in range(nEA)]

    C = np.diag(c)

    for epoch in range(nEpochs):

    for iter in range(nSamples):

    cnt = nSamples*epoch + iter

    # 使用当前数据向量 x,y 更新数据相关矩阵 A,B

    x = X[:,iter]

    x = x.reshape(nDim,1)

    A = A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - A)

    y = Y[:,iter]

    y = y.reshape(nDim,1)

    B = B + (1.0/(1 + cnt))*((np.dot(y, y.T)) - B)

    # 收缩梯度下降

    W2 = W2 + (1/(50 + cnt))*(A @ W2 - B @ W2 @ np.triu(W2.T @ A @ W2)) \

    @ inv(np.diag(np.diagonal(W2.T @ A @ W2)))

    # 加权梯度下降

    W3 = W3 + (1/(100 + cnt))*(A @ W3 @ C – B @ W3 @ C @ (W3.T @ A @ W3)) \

    @ inv(np.diag(np.diagonal(W3.T @ A @ W3)))

    ```


    ## 7.9 RQ GEVD 算法


    ### RQ 齐次算法


    我们根据瑞利商准则 (7.2) 得到瑞利商齐次 GEVD 算法的目标函数如下：


    ![$$ J\left({\mathbf{w}}_k^i;{A}_k,{B}_k\right)=-\frac{{{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i}{{{\mathbf{w}}_k^i}^T{B}_k{\mathbf{w}}_k^i}+\alpha
    \left({{\mathbf{w}}_k^i}^T{B}_k{\mathbf{w}}_k^i-1\right)+2\sum \limits_{j=1,j\ne
    i}^p{\beta}_j{{\mathbf{w}}_k^j}^T{B}_k{\mathbf{w}}_k^i $$](img/522202_1_En_7_Chapter_TeX_IEq91.png) (7.50)


    其中 *i*=1,…,*p*，(*α*, *β*[1], *β*[2], …, *β*[*p*]) 为拉格朗日乘子。通过令 (7.50) 关于 ![$$ {\mathbf{w}}_k^i
    $$](img/522202_1_En_7_Chapter_TeX_IEq92.png) 的梯度等于 **0**，并利用约束条件 ![$$ {{\mathbf{w}}_k^j}^T{B}_k{\mathbf{w}}_k^i={\delta}_{ij}
    $$](img/522202_1_En_7_Chapter_TeX_IEq93.png)，我们得到


    *α* = 0 且 ![$$ {\beta}_j=\frac{{{\mathbf{w}}_k^j}^T{A}_k{\mathbf{w}}_k^i}{{{\mathbf{w}}_k^i}^T{B}_k{\mathbf{w}}_k^i}
    $$](img/522202_1_En_7_Chapter_TeX_IEq94.png) 其中 *j*=1,…,*p*。     (7.51)


    将 (*α*, *β*[1], *β*[2], …, *β*[*p*]) 代入 (7.50) 的梯度中并进行小幅近似，我们得到广义特征向量的 RQ 齐次自适应梯度下降算法：


    ![$$ {\mathbf{w}}_{k+1}^i={\mathbf{w}}_k^i+{\eta}_k\left({A}_k{\mathbf{w}}_k^i-\sum
    \limits_{j=1}^p{B}_k{\mathbf{w}}_k^j\left({{\mathbf{w}}_k^j}^T{A}_k{\mathbf{w}}_k^i\right)\right)/{{\mathbf{w}}_k^i}^T{B}_k{\mathbf{w}}_k^i
    $$](img/522202_1_En_7_Chapter_TeX_IEq95.png)，     (7.52)


    其中 *i*=1,…,*p*，其矩阵形式为


    ![$$ {W}_{k+1}={W}_k+{\eta}_k\left({A}_k{W}_k-{B}_k{W}_k{W}_k^T{A}_k{W}_k\right)\kern0.5em
    \mathrm{DIAG}{\left({W}_k^T{B}_k{W}_k\right)}^{-1} $$](img/522202_1_En_7_Chapter_TeX_IEq96.png)。     (7.53)


    ### RQ 收缩算法


    RQ 收缩 GEVD 算法的目标函数为


    ![$$ J\left({\mathbf{w}}_k^i;{A}_k,{B}_k\right)=-\frac{{{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i}{{{\mathbf{w}}_k^i}^T{B}_k{\mathbf{w}}_k^i}+\alpha
    \left({{\mathbf{w}}_k^i}^T{B}_k{\mathbf{w}}_k^i-1\right)+2\sum \limits_{j=1}^i{\beta}_j{{\mathbf{w}}_k^j}^T{B}_k{\mathbf{w}}_k^i
    $$](img/522202_1_En_7_Chapter_TeX_IEq97.png)， (7.54)


    其中 *i*=1,…,*p*，(*α*, *β*[1], *β*[2], …, *β*[*p*]) 为拉格朗日乘子。通过求解 (*α*, *β*[1], *β*[2],
    …, *β*[*k*]) 并将其代入 (7.54) 的梯度中，我们得到自适应算法：


    ![$$ {W}_{k+1}={W}_k+{\eta}_k\left({A}_k{W}_k-{B}_k{W}_k UT\left({W}_k^T{A}_k{W}_k\right)\right)\kern0.5em
    \mathrm{DIAG}{\left({W}_k^T{B}_k{W}_k\right)}^{-1} $$](img/522202_1_En_7_Chapter_TeX_IEq98.png)。 (7.55)

