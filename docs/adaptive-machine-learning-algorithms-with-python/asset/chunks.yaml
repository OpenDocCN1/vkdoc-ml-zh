    \ following chapters. One advantage of these objective functions is that we can\
    \ use accelerated convergence methods such as steepest descent, conjugate direction,\
    \ and Newton-Raphson. Chapter [6](#522202_1_En_6_Chapter.xhtml) discusses several\
    \ such methods. The recursive least squares method has also been applied to adaptive\
    \ matrix computations by taking various approximations of the inverse Hessian\
    \ of the objective functions.\n\n## 1.3 Why Adaptive Algorithms?\n\nWe observed\
    \ that data representation and classification problems lead to matrix algebra\
    \ problems, which have two solutions depending on the nature of the inputs.\n\n\
    1. The first set of solutions requires the relevant matrices to be known in advance.\n\
    2. The second set of solutions requires a sequence of samples from which the matrix\
    \ can be computed.\n\nIn this section, I explain the difference between batch\
    \ and adaptive processing, benefits of adaptive processing on streaming data,\
    \ and the requirements for adaptive algorithms.\n\n### Iterative or Batch Processing\
    \ of Static Data\n\nWhen the data is available in advance and the underlying matrices\
    \ are known, we can use the batch processing approach. These algorithms have been\
    \ used to solve a large variety of matrix algebra problems such as matrix inversion,\
    \ EVD, SVD, and PCA [Cichocki et al. 92, 93]. These algorithms are solved in two\
    \ steps: (1) using the pooled data to estimate the required matrices, and (2)\
    \ using a numerical matrix algebra procedure to solve the necessary matrix functions.\n\
    \nFor example, consider a simple matrix inversion problem for the correlation\
    \ matrix `A` of a data sequence `{x[k]}`. We can calculate the matrix inverse\
    \ `A^(-1)` after all of the data have been collected and `A` has been calculated.\
    \ This approach works in a batch fashion. When a new sample `x` is added, it is\
    \ not difficult to get the inverse of the new matrix `A[new] = (nA + xx^T) / (n\
    \ + 1)`, where `n` is the total number of samples used to compute `A`. Although\
    \ the computation for `A` is simple, all the computations for solving `A_new^(-1)`\
    \ need to be repeated.\n\nThere are two problems with this batch processing approach.\n\
    \n1. First, the dimension of the samples may be large so that even if all the\
    \ samples are available, performing the matrix algebra may be difficult or may\
    \ take a prohibitively large amount of computational time. For example, eigenvector\
    \ evaluation requires `O(n³)` computation, which is infeasible for samples of\
    \ a large dimension (say 1,000) which occurs commonly in image processing and\
    \ automatic control applications.\n\n2. Second, the matrix functions evaluated\
    \ by conventional schemes cannot adapt to small changes in the data (e.g., a few\
    \ incoming samples). If the matrix functions are estimated by conventional methods\
    \ from `K` samples, then for each additional sample all of the computation has\
    \ to be repeated.\n\nThese deficiencies make the batch schemes inefficient for\
    \ real-time applications where the data arrives incrementally or in an *online*\
    \ fashion."
