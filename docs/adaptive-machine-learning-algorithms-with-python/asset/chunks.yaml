    # 5. 主特征向量与次特征向量


    ## 5.1 引言与应用场景


    在第 4 章中，我讨论了用于计算在线相关矩阵 *A*[*k*]∈ℜ^(*n*X*n*) 主特征向量的自适应算法。然而，在某些应用中，仅计算主特征向量是不够的；我们还需要计算
    *A*[*k*] 的次特征向量。其中一个应用是多维数据压缩或多媒体视频传输中的数据降维 [Le Gall 91]。例如，在使用 JPEG 技术进行静态视频压缩时，图像被划分为
    8X8 的块。通过将高维视频数据投影到其在线相关矩阵的主特征向量子空间上，可以将其降维到较低维度。通过线性变换将数据投影到特征向量子空间的过程被称为主成分分析（PCA），它与
    Karhunen-Loeve 变换（KLT）密切相关 [Fukunaga 90]。我们通过离散余弦变换（DCT）给出的固定变换向量来近似特征向量，DCT 是
    MPEG 标准的核心压缩方法 [Le Gall 91]。可以证明，对于来自一阶马尔可夫模型的信号（这是数字图像的一个合理模型），DCT 渐近等价于 PCA。


    图 5-1 左侧显示了原始的 128 维信号。右侧，我使用自适应算法，仅用 16 个主成分重建了信号，实现了 8 倍压缩。结果表明，重建后的数据几乎与原始数据相同。


    ![](img/522202_1_En_5_Fig1_HTML.png)


    图 5-1


    左侧为原始信号，右侧为使用主成分进行 8 倍压缩后的重建信号


    关于此应用的更多细节和代码见第 8 章。


    图 5-2 显示了来自 Keras MNIST 数据集 [Keras, MNIST] 的数字 9。原始数据是 28x28=784 维的。我使用了前 100
    个主成分并重建了图像。这实现了 7.8 倍的数据缩减。重建后的图像看起来与原始图像相似。


    ![](img/522202_1_En_5_Fig2_HTML.jpg)


    图 5-2


    左侧为原始 MNIST 数字 9，右侧为使用主成分进行 7.8 倍压缩后的重建数字


    以下 Python 代码可用于对数据 `X[nDim,nSamples]` 进行 PCA 压缩：


    ```

    # 计算前 100 个主成分并对数据进行 PCA 压缩

    from scipy.linalg import eigh

    nSamples = X.shape[1]

    nDim = X.shape[0]

    corX = (X @ X.T) / nSamples

    eigvals, eigvecs = eigh(corX)

    V  = np.fliplr(eigvecs)

    # PCA 变换后的数据

    Y = V[:,:100] @ V[:,:100].T @ X

    ```


    由于 PCA 在均方误差意义上是最优的，它已被广泛应用于信号与图像处理、数据分析、模式识别、通信和控制工程等领域。诸如信号子空间与噪声子空间分离等应用在数字通信和数字图像处理中非常重要。PCA
    在信号处理中的应用包括时域和空域谱分析。例如，多信号分类（MUSIC）技术、最小范数方法、ESPIRIT 估计器以及用于估计正弦波频率或入射到天线阵列的平面波到达方向（DOA）的加权子空间拟合（WSF）方法。最近，PCA
    被应用于盲数字通信和语音处理。例如，在 [Chatterjee et al. 97-99; Chen et al. 99] 中，PCA 被用于基于 DS-CDMA
    的空频处理中的盲二维 RAKE 接收机，以解决远近问题。在 [Diamantaras and Strintzis 97] 中，PCA 被用于存在噪声情况下的最优线性矢量编码和解码。

