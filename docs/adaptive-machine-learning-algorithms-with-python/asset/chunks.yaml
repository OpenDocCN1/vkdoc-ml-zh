    \n- **Penalty function**:\n  `J(w) = -w^T A w + μ(w^T B w - 1)²`, (1.17)\n  where\
    \ `μ` is a non-negative scalar constant.\n\n- **Augmented Lagrangian**:\n  `J(w)\
    \ = -w^T A w + α(w^T B w - 1) + μ(w^T B w - 1)²`, (1.18)\n  where `α` is a Lagrange\
    \ multiplier and `μ > 0` is the penalty constant. Several algorithms based on\
