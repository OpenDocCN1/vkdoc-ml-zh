    \limits_{j=1}^{i-1}{\beta}_j{{\mathbf{w}}_k^j}^T{\mathbf{w}}_k^i $$](images/522202_1_En_5_Chapter/522202_1_En_5_Chapter_TeX_IEq82.png),     (5.38)


    where `(α,β[1],β[2],…,β[i–1])` are Lagrange multipliers and `i=1,…,p`. By solving
    for `(α,β[1],β[2],…,β[i–1])` and replacing them in the gradient of (5.38), we
    obtain the IT deflation adaptive gradient descent algorithm for PCA:


    ![$$ {W}_{k+1}={W}_k+{\eta}_k\left({A}_k{W}_k-{W}_k UT\left({W}_k^T{A}_k{W}_k\right)\right)\kern0.5em
    \mathrm{DIAG}{\left({W}_k^T{A}_k{W}_k\right)}^{-1} $$](images/522202_1_En_5_Chapter/522202_1_En_5_Chapter_TeX_IEq83.png).     (5.39)


    `W[k]` converges with probability one to `W^(**) = [±ϕ[1] ±ϕ[2] … ±ϕ[p]]` as `k→∞`.


    ### IT Weighted Algorithm


    The objective function for the IT weighted PCA algorithm is


    ![$$ J\left({\mathbf{w}}_k^i;{A}_k\right)={c}_i{{\mathbf{w}}_k^i}^T{\mathbf{w}}_k^i-{c}_i\log
