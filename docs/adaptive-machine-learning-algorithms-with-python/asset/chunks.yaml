    图 8-5


    自适应 EVD 算法 (5.13) 在非平稳数据上前四个特征向量的范数


    同样，第二到第四个特征向量发生了发散，表明在数据序列早期就出现了特征漂移。第二到第四个特征向量的下降斜率在序列早期就检测到了特征的漂移。


    我使用了与第 8.1.1 节中对平稳数据所使用的相同 Python 代码。


    ### Electricity 数据集


    该数据集的名称为 `elec.arff`。该数据集包含多种非平稳分量，如图 8-6 所示。


