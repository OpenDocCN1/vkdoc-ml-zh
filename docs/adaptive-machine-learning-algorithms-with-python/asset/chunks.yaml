    ### 统计模式识别


    线性异联想的一个特例是执行 *m* 选 1 分类的网络，其中网络的输入 **x** 被分类为 *m* 个类别 ω[1],...,ω[*m*] 中的一个。如果
    **x∈**ω[*i*]，则 **d**=**e**[*i*]，其中 **e**[*i*] 是第 *i* 个标准基向量。与无监督的自联想学习不同，该网络是有监督的。在这种情况下，*A*
    和 *B* 是散布矩阵。这里 *A* 是*类间散布矩阵 S*[*b*]*，即类均值围绕混合均值的散布，而 *B* 是*混合散布矩阵 S*[*m*]*，即所有样本（不考虑类别归属）的协方差。(*A*,*B*)
    的广义特征向量分解被称为*线性判别分析* (LDA)，这在第 1.1 节中已讨论过。


    ### 信息论


    数据模型 (1.1) 的另一个观点源于 Linsker [1988] 和 Plumbley [1993]。根据 Linsker 的 *Infomax* 原理，权重矩阵
    *W* 的最优值出现在其输出 **y** 关于其输入 **x** 所传递的信息 *I*(**x**,**y**) 被*最大化*时。这等价于输入 **x**
    中关于输出 **y** 的信息，因为 *I*(**x**,**y**)=*I*(**y**,**x**)。然而，像 (1.1) 这样的无噪声过程，其 **y**
    中包含关于输入 **x** 的无限信息，反之亦然，因为 **y** 完美地表示了 **x**。为了继续分析，我们假设输入 **x** 包含一些噪声 **n**，这阻止了
    **y** 精确测量 **x**。该模型有两种变体，均受 Plumbley [1993] 启发。


    在第一个模型中，我们假设输出 **y** 因变换 *W* 而受到噪声污染。我们进一步假设可用于传输的平均功率是有限的，输入 **x** 是均值为零、协方差为
    *A* 的高斯分布，噪声 **n** 是均值为零、协方差为 *N* 的不相关高斯分布，并且变换噪声 **n** 与 **x** 独立。含噪声的数据模型为


    **y** = *W*^(*T*)**x** + **n**。 (1.12)


    互信息 *I*(**y**,**x**)（在高斯假设下）为


    *I*(**y**, **x**) = 0.5 log det(*W*^(*T*)*AW* + *N*) − 0.5 log det(*N*)。 (1.13)


    我们定义一个带有功率约束的目标函数为


    *J*(*W*) = *I*(**y**, **x**) − 0.5*tr*(Λ(*W*^(*T*)*AW* + *N*))， (1.14)


    其中 Λ 是一个由拉格朗日乘子组成的对角矩阵。当 *W*=Φ*R* 时，该函数被最大化，其中 Φ 是 *A* 的主特征向量矩阵，*R* 是一个非奇异旋转矩阵。

