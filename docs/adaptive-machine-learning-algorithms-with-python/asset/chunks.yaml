  raw: '### INSECTS-incremental_balanced_norm Dataset: Eigenvector Test


    The dataset name is `INSECTS-incremental_balanced_norm.arff` . This dataset has
    33 components. It has gradually increasing components causing the feature drift
    shown in Figure [8-1](#522202_1_En_8_Chapter.xhtml#Fig1).


    ![](images/522202_1_En_8_Chapter/522202_1_En_8_Fig1_HTML.png)


    Figure 8-1


    Non-stationary multi-dimensional real-world data with incremental drift


    #### Adaptive EVD of Semi-Stationary Components


    I dropped the drift components and used the EVD linear adaptive algorithm (5.13)
    from Chapter [5](#522202_1_En_5_Chapter.xhtml), shown below, on the remaining
    components:


    ![$$ {W}_{k+1}={W}_k+{\eta}_k\left(2{A}_k{W}_k-{A}_k{W}_k UT\left({W}_k^T{W}_k\right)-{W}_k
    UT\left({W}_k^T{A}_k{W}_k\right)\right). $$](images/522202_1_En_8_Chapter/522202_1_En_8_Chapter_TeX_Equ1.png)


    (5.13)


    Note that the remaining components are a lot more stable, but some non-stationarity
    still exists. For each input sample of the sequence, I plotted the norms of the
    first four principal eigenvectors to demonstrate the quality of convergence of
    these eigenvectors; see Figure [8-2](#522202_1_En_8_Chapter.xhtml#Fig2).


    ![](images/522202_1_En_8_Chapter/522202_1_En_8_Fig2_HTML.jpg)


    Figure 8-2


    Norms of the first four eigenvectors for the adaptive EVD algorithm (5.13) on
    stationary data


    The first four eigenvector norms converge rapidly to stable values with streaming
    samples. The upward horizontal slopes of the curves indicate stable convergence.
    The slight downward slopes of the third and fourth principal eigenvectors show
    a slight non-stationarity in the data. But the data is largely stable and stationary.
    We can conclude that the features are consistent with the current machine learning
    model and no model changes are necessary.


    The following Python code works on multidimensional data `dataset2 [nDim, nSamples]`:


    ```

    # Adaptive algorithm

    from numpy import linalg as la

    nSamples = dataset2.shape[0]

    nDim = dataset2.shape[1]

    A = np.zeros(shape=(nDim,nDim)) # stores adaptive correlation matrix

    N = np.zeros(shape=(1,nDim)) # stores eigen norms

    W = 0.1 * np.ones(shape=(nDim,nDim)) # stores adaptive eigenvectors

    for iter in range(nSamples):

    cnt = iter + 1

    # Update data correlation matrix A with current data vector x

    x = np.array(dataset2.iloc[iter])

    x = x.reshape(nDim,1)

    A = A + (1.0/cnt)*((np.dot(x, x.T)) - A)

    etat = 1.0/(25 + cn t)

    # Deflated Gradient Descent

    W = W + etat*(A @ W - 0.5*W @ np.triu(W.T @ A @ W) - \

    0.5*A @ W @ np.triu(W.T @ W))

    newnorm = la.norm(W, axis=0)

    N = np.vstack([N, newnorm])

    ```


    #### Adaptive EVD of Non-Stationary Components


    I next used the non-stationary components of the data to detect feature drift
    with the adaptive algorithms. I used the same adaptive EVD algorithm (5.13) and
    plotted the norms of the first four principal eigenvectors for each data sample,
    as shown in Figure [8-3](#522202_1_En_8_Chapter.xhtml#Fig3).


    ![](images/522202_1_En_8_Chapter/522202_1_En_8_Fig3_HTML.jpg)


    Figure 8-3


    Norms of the first four eigenvectors for the adaptive EVD algorithm (5.13) on
    non-stationary data


    You can clearly see that the second through fourth eigenvectors diverge, indicated
    by the downward slopes of the graphs, showing the feature drift early in the sequence.
    The downward slope of the second through fourth eigenvectors indicates the gradual
    drift of the features. This result shows that the features are drifting from the
    original ones used to build the machine learning model.


    I used the same Python code I used on the stationary data in Section [8.1.1](#522202_1_En_8_Chapter.xhtml#Sec2).


    ### INSECTS-incremental-abrupt_balanced_norm Dataset


    The dataset name is `INSECTS-incremental_abrupt_balanced_norm.arff` . This dataset
    has repeated abrupt changes in features, as shown in Figure [8-4](#522202_1_En_8_Chapter.xhtml#Fig4).


    ![](images/522202_1_En_8_Chapter/522202_1_En_8_Fig4_HTML.png)


    Figure 8-4


    Non-stationary multi-dimensional real-world data with periodic abrupt drift


    I used the same adaptive EVD algorithm (5.13) and observed the norms of the first
    four principal eigenvectors and plotted them for each data sample, as shown in
    Figure [8-5](#522202_1_En_8_Chapter.xhtml#Fig5).


    ![](images/522202_1_En_8_Chapter/522202_1_En_8_Fig5_HTML.jpg)


    Figure 8-5


    Norms of the first four eigenvectors for the adaptive EVD algorithm (5.13) on
    non-stationary data


    Once again, the second through fourth eigenvectors diverge, indicating feature
    drift early in the data sequence. The downward slope of the second through fourth
    eigenvectors detects drift of the features early in the sequence.


    I used the same Python code I used on the stationary data in Section [8.1.1](#522202_1_En_8_Chapter.xhtml#Sec2).


