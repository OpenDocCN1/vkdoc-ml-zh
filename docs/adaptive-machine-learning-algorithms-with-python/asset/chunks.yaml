- fmt: '### 5.11 Experimental Results


    I generated 500 samples `x[k]` of 10-dimensional Gaussian data (i.e., `n=10`)
    with the mean zero and covariance given below. The covariance matrix is obtained
    from the second covariance matrix in [Okada and Tomita 85] multiplied by 3. The
    covariance matrix is


    ![](images/522202_1_En_5_Chapter/522202_1_En_5_Figa_HTML.png)


    The eigenvalues of the covariance matrix are


    17.9013, 10.2212, 8.6078, 6.5361, 2.2396, 1.8369, 1.1361, 0.7693, 0.2245, 0.1503.


    I computed the first four principal eigenvectors (i.e., the eigenvector corresponding
    to the largest four eigenvalues) (i.e., `p=4`) by the adaptive algorithms described
    here. In order to compute the online data sequence `{A[k]}`, I generated random
    data vectors `{x[k]}` from the above covariance matrix. I generated `{A[k]}` from
    `{x[k]}` by using algorithm (2.5 in Section [2.4](#522202_1_En_2_Chapter.xhtml#Sec6))
    with `β=1`. I computed the correlation matrix `A` after collecting all 500 samples
    `x[k]` as


    ![$$ A=\frac{1}{500}\sum \limits_{i=1}^{500}{\mathbf{x}}_i{\mathbf{x}}_i^T. $$](images/522202_1_En_5_Chapter/522202_1_En_5_Chapter_TeX_Equd.png)


    I referred to the eigenvectors and eigenvalues computed from this `A` by a standard
    numerical analysis method [Golub and VanLoan 83] as the *actual values*.


    I started all algorithms with `w[0] = 0.1*ONE`, where `ONE` is a 10X4 matrix whose
    all elements are ones. In order to measure the convergence and accuracy of the
    algorithms, I computed the direction cosine at `k`-th update of each adaptive
    algorithm as


    Direction cosine (`k`) = ![$$ \left|{{\mathbf{w}}_k^i}^T{\boldsymbol{\upvarphi}}_i\right|/\left\Vert
    {\boldsymbol{\upvarphi}}_i\right\Vert \left\Vert {\mathbf{w}}_k^i\right\Vert $$](images/522202_1_En_5_Chapter/522202_1_En_5_Chapter_TeX_IEq109.png)     (5.49)


    where ![$$ {\mathbf{w}}_k^i $$](images/522202_1_En_5_Chapter/522202_1_En_5_Chapter_TeX_IEq110.png)
    is the estimated eigenvector of `A[k]` at `k`-th update and `φ[i]` is the actual
    `i`-th principal eigenvector computed from all collected samples by a conventional
    numerical analysis method.


