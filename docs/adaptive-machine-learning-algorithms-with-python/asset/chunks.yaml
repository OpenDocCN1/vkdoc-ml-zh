    ## 3.2 自适应平方根算法：方法 1


    设 {**x**[*k*∈]ℜ^(*n*)} 是一个数据向量序列，其在线数据相关矩阵 *A*[*k*∈]ℜ^(*nXn*) 由下式给出：


    ![$$ {A}_k=\frac{1}{k}\sum \limits_{i=1}^k{\beta}^{k-i}{\mathbf{x}}_i{\mathbf{x}}_i^T
    $$](img/522202_1_En_3_Chapter_TeX_IEq4.png)。     (3.1)


    这里 **x**[*k*] 是时刻 *k* 的观测向量，0<*β*≤1 是用于非平稳序列的遗忘因子。如果数据是平稳的，渐近相关矩阵 *A* 为：


    ![$$ A=\underset{k\to \infty }{\lim }E\left[{A}_k\right] $$](images/522202_1_En_3_Chapter/522202_1_En_3_Chapter_TeX_IEq5.png)。     (3.2)


    ### 目标函数


    遵循第 1.​4 节描述的方法，我首先给出一个目标函数 *J*，该函数关于矩阵 *W* 的最小值给出了渐近数据相关矩阵 *A* 的平方根。目标函数为：


    ![$$ J(W)={\left\Vert A-{W}^TW\right\Vert}_F² $$](img/522202_1_En_3_Chapter_TeX_IEq6.png)。     (3.3)


    *J*(*W*) 关于 *W* 的梯度为：


    ∇[*W*]*J*(*W*) =  − 4*W*(*A* − *W*^(*T*)*W*)。     (3.4)


    ### 自适应算法


    根据 (3.4) 中的梯度，我们得到以下自适应梯度下降算法：


    ![$$ {W}_{k+1}={W}_k-{\eta}_k\left(1/4\right){\nabla}_WJ\left({W}_k;{A}_k\right)={W}_k+{\eta}_k\left({W}_k{A}_k-{W}_k{W}_k^T{W}_k\right)
    $$](img/522202_1_En_3_Chapter_TeX_IEq7.png)，     (3.5)


    其中 *η*[*k*] 是一个小的递减常数，并遵循 GitHub [Chatterjee GitHub] 上收敛性证明中的假设 A1.2。


    以下 Python 代码使用数据 `X[nDim,nSamples]` 实现了此算法：


    ```

    for epoch in range(nEpochs):

    for iter in range(nSamples):

    cnt = nSamples*epoch + iter

    x = X[:,iter]

    x = x.reshape(nDim,1)

    A = A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - A)

    etat1 = 1.0/(50 + cnt)

    # 算法 1

    W1 = W1 + etat1 * (W1 @ A - W1 @ W1.T @ W1)

    ```


    ## 3.3 自适应平方根算法：方法 2


    ### 目标函数


    目标函数 *J*(*W*)，其关于 *W* 的最小值给出了 *A* 的平方根，为：


    ![$$ J(W)={\left\Vert A-{WW}^T\right\Vert}_F² $$](img/522202_1_En_3_Chapter_TeX_IEq8.png)。     (3.6)


    *J*(*W*) 关于 *W* 的梯度为：


    ∇[*W*]*J*(*W*) =  − 4(*A* − *WW*^(*T*) )*W*。     (3.7)


    ### 自适应算法


    我们得到以下用于 *A* 的平方根的自适应梯度下降算法：


    ![$$ {W}_{k+1}={W}_k-{\eta}_k\left(1/4\right){\nabla}_WJ\left({W}_k;{A}_k\right)={W}_k+{\eta}_k\left({A}_k{W}_k-{W}_k{W}_k^T{W}_k\right)
    $$](img/522202_1_En_3_Chapter_TeX_IEq9.png)，     (3.8)


    其中 *η*[*k*] 是一个小的递减常数。


    以下 Python 代码使用数据 `X[nDim,nSamples]` 实现了此算法：


    ```

    for epoch in range(nEpochs):

    for iter in range(nSamples):

    cnt = nSamples*epoch + iter

    x = X[:,iter]

    x = x.reshape(nDim,1)

    A = A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - A)

    etat1 = 1.0/(50 + cnt)

    # 算法 2

    W2 = W2 + etat1 * (A @ W2 - W2 @ W2.T @ W2)

    ```


    ## 3.4 自适应平方根算法：方法 3


    ### 自适应算法


    遵循自适应算法 (3.5) 和 (3.8)，我现在提出一种用于计算 *A* 的对称正定平方根的算法：


    ![$$ {W}_{k+1}={W}_k+{\eta}_k\left({A}_k-{W}_k²\right) $$](img/522202_1_En_3_Chapter_TeX_IEq10.png)，     (3.9)


    其中 *η*[*k*] 是一个小的递减常数，且 *W*[*k*] 是对称的。


    以下 Python 代码使用数据 `X[nDim,nSamples]` 实现了此算法：


    ```

    for epoch in range(nEpochs):

    for iter in range(nSamples):

    cnt = nSamples*epoch + iter

    x = X[:,iter]

    x = x.reshape(nDim,1)

    A = A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - A)

    etat2 = 1.0/(50 + cnt)

    # 算法 3

    W3 = W3 + etat2 * (A - W3 @ W3)

    ```


    ## 3.5 自适应逆平方根算法：方法 1


    ### 目标函数


    目标函数 *J*(*W*)，其最小化器 *W*^(***) 给出了 *A* 的逆平方根，为：


    ![$$ J(W)={\left\Vert I-{W}^T AW\right\Vert}_F² $$](img/522202_1_En_3_Chapter_TeX_IEq11.png)。     (3.10)


    *J*(*W*) 关于 *W* 的梯度为：


    ∇[*W*]*J*(*W*) =  − 4*AW*(*I* − *W*^(*T*)*AW*)。     (3.11)


    ### 自适应算法


    根据 (3.11) 中的梯度，我们得到以下自适应梯度下降算法：


    ![$$ {W}_{k+1}={W}_k-{\eta}_k\left(1/4\right){A}_k^{-1}{\nabla}_WJ\left({W}_k;{A}_k\right)={W}_k+{\eta}_k\left({W}_k-{W}_k{W}_k^T{A}_k{W}_k\right)
    $$](img/522202_1_En_3_Chapter_TeX_IEq12.png)     (3.12)


    以下 Python 代码使用数据 `X[nDim,nSamples]` 实现了此算法：


    ```

    for epoch in range(nEpochs):

    for iter in range(nSamples):

    cnt = nSamples*epoch + iter

    x = X[:,iter]

    x = x.reshape(nDim,1)

    A = A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - A)

    etat1 = 1.0/(100 + cnt)

    # 算法 1

    W1 = W1 + etat1 * (W1 - W1 @ W1.T @ A @ W1)

    ```


    ## 3.6 自适应逆平方根算法：方法 2

    '
- fmt: '### Objective Function


    The objective function `J(W)`, whose minimum with respect to `W` gives us the
    inverse square root of `A`, is


    ![$$ J(W)={\left\Vert I-{WAW}^T\right\Vert}_F^2 $$](images/522202_1_En_3_Chapter/522202_1_En_3_Chapter_TeX_IEq13.png).
    (3.13)


    The gradient of `J(W)` with respect to `W` is


    `∇[W]J(W) = −4(I − WAW^(T))WA`. (3.14)


    ### Adaptive Algorithm


    We obtain the following adaptive algorithm for the inverse square root of `A`:


    ![$$ {W}_{k+1}={W}_k-{\eta}_k\left(1/4\right){\nabla}_WJ\left({W}_k;{A}_k\right){A}_k^{-1}={W}_k+{\eta}_k\left({W}_k-{W}_k{A}_k{W}_k^T{W}_k\right)
    $$](images/522202_1_En_3_Chapter/522202_1_En_3_Chapter_TeX_IEq14.png), (3.15)


    where `η[k]` is a small decreasing constant.


    The following Python code implements this algorithm with data `X[nDim,nSamples]`:


    ```

    for epoch in range(nEpochs):

    for iter in range(nSamples):

    cnt = nSamples*epoch + iter

    x = X[:,iter]

    x = x.reshape(nDim,1)

    A = A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - A)

    etat1 = 1.0/(100 + cnt)

    # Algorithm 2

    W2 = W2 + etat1 * (W2 - W2 @ A @ W2.T @ W2)

    ```


    ## 3.7 Adaptive Inverse Square Root Algorithm: Method 3


    ### Adaptive Algorithm


    By extending the adaptive algorithms (3.12) and (3.15), I now present an adaptive
    algorithm for the computation of a symmetric positive definite inverse square
    root of `A`:


    `W[k + 1] = W[k] + η[k](I − W[k]A[k]W[k])`, (3.16)


    where `η[k]` is a small decreasing constant and `W[k]` is symmetric.


    The following Python code implements this algorithm with data `X[nDim,nSamples]`:


    ```

    for epoch in range(nEpochs):

    for iter in range(nSamples):

    cnt = nSamples*epoch + iter

    x = X[:,iter]

    x = x.reshape(nDim,1)

    A = A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - A)

    etat2 = 1.0/(100 + cnt)

    # Algorithm 3

    W3 = W3 + etat2 * (I - W3 @ A @ W3)

    ```


    ## 3.8 Experimental Results


    I generated 500 samples `{x[k]}` of 10-dimensional (i.e., `n=10`) Gaussian data
    with mean zero and covariance, given below. The covariance matrix is obtained
    from the first covariance matrix in [Okada and Tomita 85] multiplied by 3. The
    covariance matrix is


    ![](images/522202_1_En_3_Chapter/522202_1_En_3_Figa_HTML.png)


    The eigenvalues of the covariance matrix are


    [17.699, 8.347, 5.126, 3.088, 1.181, 0.882, 0.261, 0.213, 0.182, 0.151].


    ### Experiments for Adaptive Square Root Algorithms


    I used adaptive algorithms (3.5), (3.8), and (3.9) for Methods 1, 2, and 3, respectively,
    to compute the square root `A`, where `A` is the correlation matrix computed from
    all collected samples as


    ![$$ A=\frac{1}{500}\sum \limits_{i=1}^{500}{\mathbf{x}}_i{\mathbf{x}}_i^T. $$](images/522202_1_En_3_Chapter/522202_1_En_3_Chapter_TeX_Equb.png)


    I started the algorithms with `W[0]=I` (10X10 identity matrix). At `k^(th)` update
    of each algorithm, I computed the Frobenius norm [Frobenius norm, Wikipedia] of
    the error between the actual correlation matrix `A` and the square of `W[k]` that
    is appropriate for each method. I denote this error by `e[k]` as follows:


    ![$$ {e}_k^{\mathrm{Method}1}={\left\Vert A-{W}_k^T{W}_k\right\Vert}_F $$](images/522202_1_En_3_Chapter/522202_1_En_3_Chapter_TeX_IEq15.png),
    (3.17)


    ![$$ {e}_k^{\mathrm{Method}2}={\left\Vert A-{W}_k{W}_k^T\right\Vert}_F $$](images/522202_1_En_3_Chapter/522202_1_En_3_Chapter_TeX_IEq16.png),
    (3.18)


    ![$$ {e}_k^{\mathrm{Method}3\hbox{-} 1}={\left\Vert A-{W}_k^2\right\Vert}_F $$](images/522202_1_En_3_Chapter/522202_1_En_3_Chapter_TeX_IEq17.png),
    (3.19)


    ![$$ {e}_k^{\mathrm{Method}3\hbox{-} 2}={\left\Vert {\varPhi \varLambda}^{\frac{1}{2}}{\Phi}^T-{W}_k\right\Vert}_F
    $$](images/522202_1_En_3_Chapter/522202_1_En_3_Chapter_TeX_IEq18.png). (3.20)


    For each algorithm, I generated `A[k]` from `x[k]` by (2.5) with `β=1`. In (3.9)
    I computed the error between the unique positive definite solution of `A^½` and
    its estimate `W[k]`. Figure 3-4 shows the convergence plots for all three methods
    by plotting the four errors `e[k]` against `k`. The final values of `e[k]` after
    500 samples were `e[500] = 0.451` for Methods 1 and 2, `e[500] = 0.720` for Method
    3-1 (3.19), and `e[500] = 0.250` for Method 3-2 (3.20).


    ![](images/522202_1_En_3_Chapter/522202_1_En_3_Fig4_HTML.png)


    Figure 3-4


    Convergence of the `A^½` algorithms (3.5), (3.8), and (3.9)


    It is clear from Figure 3-4 that the errors are all close to zero. The small differences
    compared to the actual values are due to random fluctuations in the elements of
    `W[k]` caused by the varying input data.


    ### Experiments for Adaptive Inverse Square Root Algorithms


    I used adaptive algorithms (3.12), (3.15), and (3.16) for Methods 1, 2, and 3,
    respectively, to compute the inverse square root `A`. I started the algorithms
    with `W[0]=I` (10X10 identity matrix). At `k^(th)` update of each algorithm, I
    computed the Frobenius norm of the error between the actual correlation matrix
    `A` and the inverse square of `W[k]` that is appropriate for each method. I denoted
    this error by `e[k]` as shown:


    ![$$ {e}_k^{\mathrm{Method}1}={\left\Vert I-{W}_k^T{AW}_k\right\Vert}_F $$](images/522202_1_En_3_Chapter/522202_1_En_3_Chapter_TeX_IEq19.png),
    (3.21)


    ![$$ {e}_k^{\mathrm{Method}2}={\left\Vert I-{W}_k{AW}_k^T\right\Vert}_F $$](images/522202_1_En_3_Chapter/522202_1_En_3_Chapter_TeX_IEq20.png),
    (3.22)


    ![$$ {e}_k^{\mathrm{Method}3\hbox{-} 1}\kern0.5em ={\left\Vert I-{W}_k{AW}_k\right\Vert}_F
    $$](images/522202_1_En_3_Chapter/522202_1_En_3_Chapter_TeX_IEq21.png), (3.23)


    ![$$ {e}_k^{\mathrm{Method}3\hbox{-} 2}={\left\Vert {\varPhi \varLambda}^{-\frac{1}{2}}{\Phi}^T-{W}_k\right\Vert}_F
    $$](images/522202_1_En_3_Chapter/522202_1_En_3_Chapter_TeX_IEq22.png), (3.24)


    In (3.24) I computed the error between the unique positive definite solution of
    `A^(–½)` and its estimate `W[k]`. Figure 3-5 shows the convergence plot for all
    three methods by plotting the four errors `e[k]` against `k`. The final values
    of `e[k]` after 500 samples were `e[500] = 0.419` for Methods 1 and 2, `e[500]
    = 0.630` for Method 3-1 (3.23), and `e[500] = 0.823` for Method 3-2 (3.24).


    ![](images/522202_1_En_3_Chapter/522202_1_En_3_Fig5_HTML.png)


    Figure 3-5


    Convergence of the `A^(–½)` algorithms (3.12), (3.15), and (3.16)


    It is clear from Figure 3-5 that the errors are all close to zero. As before,
    experiments with higher epochs show an improvement in the estimation accuracy.'
