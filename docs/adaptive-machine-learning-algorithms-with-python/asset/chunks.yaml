    $$](images/522202_1_En_7_Chapter/522202_1_En_7_Chapter_TeX_IEq85.png) (7.44)


    for `i=1,…,p`, whose matrix version is


    ![$$ {W}_{k+1}={W}_k+{\eta}_k\left({A}_k{W}_k-{B}_k{W}_k{W}_k^T{A}_k{W}_k\right)\kern0.5em
    \mathrm{DIAG}{\left({W}_k^T{A}_k{W}_k\right)}^{-1} $$](images/522202_1_En_7_Chapter/522202_1_En_7_Chapter_TeX_IEq86.png)
    (7.45)


    where `DIAG[⋅]` sets all elements *except* the diagonal of its matrix argument
    to zero.


    ### IT Deflation Algorithm


    The objective function for the IT deflation GEVD algorithm is


    ![$$ J\left({\mathbf{w}}_k^i;{A}_k,{B}_k\right)={{\mathbf{w}}_k^i}^T{B}_k{\mathbf{w}}_k^i-\ln
    \left({{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i\right)+\alpha \left({{\mathbf{w}}_k^i}^T{B}_k{\mathbf{w}}_k^i-1\right)+2\sum
    \limits_{j=1}^{i-1}{\beta}_j{{\mathbf{w}}_k^j}^T{B}_k{\mathbf{w}}_k^i $$](images/522202_1_En_7_Chapter/522202_1_En_7_Chapter_TeX_IEq87.png)
    (7.46)


    for `i=1,…,p`, where (`α`, `β[1]`, `β[2]`, …, `β[p]`) are Lagrange multipliers.
    From (7.43), we obtain the adaptive gradient algorithm:


    ![$$ {W}_{k+1}={W}_k+{\eta}_k\left({A}_k{W}_k-{B}_k{W}_k UT\left({W}_k^T{A}_k{W}_k\right)\right)\kern0.6em
    \mathrm{DIAG}{\left({W}_k^T{A}_k{W}_k\right)}^{-1} $$](images/522202_1_En_7_Chapter/522202_1_En_7_Chapter_TeX_IEq88.png)
    (7.47)


    ### IT Weighted Algorithm


    The objective function for the IT weighted GEVD algorithm is


    ![$$ J\left({\mathbf{w}}_k^i\right)={c}_i{{\mathbf{w}}_k^i}^T{B}_k{\mathbf{w}}_k^i-{c}_i\ln
    \left({{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i\right)+\alpha {c}_i\left({{\mathbf{w}}_k^i}^T{B}_k{\mathbf{w}}_k^i-1\right)+2\sum
    \limits_{j=1,j\ne i}^p{\beta}_j{c}_j{{\mathbf{w}}_k^j}^T{B}_k{\mathbf{w}}_k^i
    $$](images/522202_1_En_7_Chapter/522202_1_En_7_Chapter_TeX_IEq89.png) (7.48)


    for `i=1,…,p`, where (`α`, `β[1]`, `β[2]`, …, `β[p]`) are Lagrange multipliers.
    By solving (`α`, `β[1]`, `β[2]`, …, `β[k]`) and replacing them in the gradient
    of (7.48), we obtain the adaptive algorithm:


    ![$$ {W}_{k+1}={W}_k+{\eta}_k\left({A}_k{W}_kC-{B}_k{W}_k{CW}_k^T{A}_k{W}_k\right)\kern0.5em
    \mathrm{DIAG}{\left({W}_k^T{A}_k{W}_k\right)}^{-1} $$](images/522202_1_En_7_Chapter/522202_1_En_7_Chapter_TeX_IEq90.png)
    (7.49)


    ### IT Algorithm Python Code


    The following Python code works with data `X[nDim,nSamples]` and `Y[nDim,nSamples]`:


    ```

    from numpy import linalg as la

    A  = np.zeros(shape=(nDim,nDim)) # stores adaptive correlation matrix

    B  = np.zeros(shape=(nDim,nDim)) # stores adaptive correlation matrix

    W2 = 0.1 * np.ones(shape=(nDim,nEA)) # weight vectors of all algorithms

    W3 = W2

    c = [2.6-0.3*k for k in range(nEA)]

    C = np.diag(c)

    for epoch in range(nEpochs):

    for iter in range(nSamples):

    cnt = nSamples*epoch + iter

    # Update data correlation matrices A,B with current data vectors x,y

    x = X[:,iter]

    x = x.reshape(nDim,1)

    A = A + (1.0/(1 + cnt))*((np.dot(x, x.T)) - A)

    y = Y[:,iter]

    y = y.reshape(nDim,1)

    B = B + (1.0/(1 + cnt))*((np.dot(y, y.T)) - B)

    # Deflated Gradient Descent

    W2 = W2 + (1/(50 + cnt))*(A @ W2 - B @ W2 @ np.triu(W2.T @ A @ W2)) \

    @ inv(np.diag(np.diagonal(W2.T @ A @ W2)))

    # Weighted Gradient Descent

    W3 = W3 + (1/(100 + cnt))*(A @ W3 @ C – B @ W3 @ C @ (W3.T @ A @ W3)) \

    @ inv(np.diag(np.diagonal(W3.T @ A @ W3)))

    ```


