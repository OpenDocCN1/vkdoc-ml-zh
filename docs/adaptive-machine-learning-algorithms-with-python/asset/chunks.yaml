- fmt: '# 2.6 Adaptive Normalized Mean Algorithm


    The most obvious choice for an adaptive normalized mean algorithm is to use ([2.2](#522202_1_En_2_Chapter.xhtml#Par15))
    and normalize each `m[k]`. However, a more efficient algorithm can be obtained
    from the following cost function whose minimizer `w*` is the asymptotic normalized
    mean `m/||m||`, where `m = lim[k → ∞] E[x[k]]`:


    ![$$ J\left({\mathbf{w}}_k;{\mathbf{x}}_k\right)={\left\Vert {\mathbf{x}}_k-{\mathbf{w}}_k\right\Vert}^2+\alpha
    \left({\mathbf{w}}_k^T{\mathbf{w}}_k-1\right) $$](images/522202_1_En_2_Chapter/522202_1_En_2_Chapter_TeX_IEq15.png),
    (2.9)


    where `α` is a Lagrange multiplier that enforces the constraint that the mean
    is normalized. The gradient of `J(w[k];x[k])` with respect to `w[k]` is


    ![$$ \left(1/2\right){\nabla}_{{\mathbf{w}}_k}J\left({\mathbf{w}}_k;{\mathbf{x}}_k\right)=-\left({\mathbf{x}}_k-{\mathbf{w}}_k\right)+\alpha
    {\mathbf{w}}_k $$](images/522202_1_En_2_Chapter/522202_1_En_2_Chapter_TeX_IEq16.png),
    (2.10)


    Multiplying ([2.10](#522202_1_En_2_Chapter.xhtml#Par35)) by `w_k^T` and applying
    the constraint `w_k^T w_k = 1`, we obtain


    ![$$ \alpha ={\mathbf{w}}_k^T{\mathbf{x}}_k-1 $$](images/522202_1_En_2_Chapter/522202_1_En_2_Chapter_TeX_IEq19.png),
    (2.11)


    Using this `α` in ([2.11](#522202_1_En_2_Chapter.xhtml#Par37)), we obtain the
    adaptive gradient descent algorithm for normalized mean:


    ![$$ {\mathbf{w}}_{k+1}={\mathbf{w}}_k+{\eta}_k\left({\mathbf{x}}_k-{\mathbf{w}}_k^T{\mathbf{x}}_k{\mathbf{w}}_k\right)
    $$](images/522202_1_En_2_Chapter/522202_1_En_2_Chapter_TeX_IEq20.png), (2.12)


    where `η[k]` is a small decreasing constant, which follows assumption A1.2 in
    the Proofs of Convergence in GitHub [Chatterjee GitHub].


    ## Variations of the Adaptive Normalized Mean Algorithm


    There are several variations of the objective function ([2.9](#522202_1_En_2_Chapter.xhtml#Par33))
    that lead to many other adaptive algorithms for normalized mean computation. One
    variation of ([2.9](#522202_1_En_2_Chapter.xhtml#Par33)) is to place the value
    of `α` in ([2.11](#522202_1_En_2_Chapter.xhtml#Par37)) in the objective function
    ([2.9](#522202_1_En_2_Chapter.xhtml#Par33)) to obtain the following objective
    function:


    ![$$ J\left({\mathbf{w}}_k;{\mathbf{x}}_k\right)={\left\Vert {\mathbf{x}}_k-{\mathbf{w}}_k\right\Vert}^2+\left({\mathbf{w}}_k^T{\mathbf{x}}_k-1\right)\left({\mathbf{w}}_k^T{\mathbf{w}}_k-1\right)
    $$](images/522202_1_En_2_Chapter/522202_1_En_2_Chapter_TeX_IEq21.png), (2.13)


    Unlike ([2.9](#522202_1_En_2_Chapter.xhtml#Par33)), this objective function is
    unconstrained and has the constraint `w_k^T w_k = 1` built into it. It leads to
    the following adaptive algorithm:


    ![$$ {\mathbf{w}}_{k+1}={\mathbf{w}}_k+{\eta}_k\left(2{\mathbf{x}}_k-{\mathbf{w}}_k^T{\mathbf{x}}_k{\mathbf{w}}_k-{\mathbf{w}}_k^T{\mathbf{w}}_k{\mathbf{x}}_k\right)
    $$](images/522202_1_En_2_Chapter/522202_1_En_2_Chapter_TeX_IEq23.png), (2.14)


    Another variation is the use of a penalty function method of nonlinear optimization
    that enforces the constraint `w_k^T w_k = 1`. This objective function is


    ![$$ J\left({\mathbf{w}}_k;{\mathbf{x}}_k\right)={\left\Vert {\mathbf{x}}_k-{\mathbf{w}}_k\right\Vert}^2+\frac{\mu
    }{2}{\left({\mathbf{w}}_k^T{\mathbf{w}}_k-1\right)}^2 $$](images/522202_1_En_2_Chapter/522202_1_En_2_Chapter_TeX_IEq25.png),
    (2.15)


    where `μ` is a positive penalty constant. This objective function is also unconstrained
    and leads to the following adaptive algorithm:


    ![$$ {\mathbf{w}}_{k+1}={\mathbf{w}}_k+{\eta}_k\left({\mathbf{x}}_k-{\mathbf{w}}_k-\mu
    {\mathbf{w}}_k\left({\mathbf{w}}_k^T{\mathbf{w}}_k-1\right)\right) $$](images/522202_1_En_2_Chapter/522202_1_En_2_Chapter_TeX_IEq26.png),
    (2.16)


    The following is the Python code to adaptively compute a normalized mean by algorithms
    ([2.12](#522202_1_En_2_Chapter.xhtml#Par39)), ([2.14](#522202_1_En_2_Chapter.xhtml#Par44)),
    and ([2.16](#522202_1_En_2_Chapter.xhtml#Par48)) with data `X[nDim,nSamples]`:


    ```

    for epoch in range(nEpochs):

    for iter in range(nSamples):

    cnt = nSamples*epoch + iter

    x = X[:,iter]

    x = x.reshape(nDim,1)

    # Eq.2.12

    w1 = w1 + (1.0/(100+cnt))*(x - (w1.T @ x)*w1)

    # Eq.2.14

    w2 = w2 + (1.0/(100+cnt))*(2*x-(w2.T @ x)*w2 - (w2.T @ w2)*x)

    # Eq.2.16

    w3 = w3 + (1.0/(100+cnt))*(x - w3- mu* w3 @ ((w3.T @ w3)-1))

    ```


    # 2.7 Adaptive Median Algorithm


    Given a sequence `{x[k]}`, its asymptotic median `μ` satisfies the following:


    ![$$ \underset{k\to \infty }{\lim}\mathrm{P}\left({\mathbf{x}}_k\ge \mu \right)=\underset{k\to
    \infty }{\lim}\mathrm{P}\left({\mathbf{x}}_k<\mu \right)=0.5 $$](images/522202_1_En_2_Chapter/522202_1_En_2_Chapter_TeX_IEq27.png)
    (2.17)


    where `P(E)` is the probability measure of event `E` and `0 ≤ P(E) ≤ 1`. The objective
    function `J(w[k];x[k])` whose minimizer `w*` is the asymptotic median `μ` is


    `J(w[k]; x[k]) = ||x[k] − w[k]||`. (2.18)


    The gradient of `J(w[k];x[k])` with respect to `w[k]` is


    ![$$ {\nabla}_{{\mathbf{w}}_k}J\left({\mathbf{w}}_k;{\mathbf{x}}_k\right)=-\operatorname{sgn}\left({\mathbf{x}}_k-{\mathbf{w}}_k\right)
    $$](images/522202_1_En_2_Chapter/522202_1_En_2_Chapter_TeX_IEq28.png), (2.19)


    where `sgn(.)` is the sign operator (`sgn(x)=1` if `x≥0` and `–1` if `x<0`). From
    the gradient in ([2.19](#522202_1_En_2_Chapter.xhtml#Par55)), we obtain the adaptive
    gradient descent algorithm:


    `w[k + 1] = w[k] + η[k] sgn (x[k] − w[k])`. (2.20)


    The following is the Python code to adaptively compute the median by algorithm
    ([2.20](#522202_1_En_2_Chapter.xhtml#Par57)) with data `X[nDim,nSamples]`:


    ```

    for epoch in range(nEpochs):

    for iter in range(nSamples):

    cnt = nSamples*epoch + iter

    x = X[:,iter]

    x = x.reshape(nDim,1)

    # Eq.2.20

    md = md + (3.0/(1 + cnt)) * np.sign(x - md)

    ```'
