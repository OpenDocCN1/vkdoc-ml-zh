    ### AL1 Weighted Algorithm


    The objective function for the AL1 weighted PCA algorithm is


    ![$$ J\left({\mathbf{w}}_k^i;{A}_k\right)=-{c}_i{{\mathbf{w}}_k^i}^T{A}_k{\mathbf{w}}_k^i+\alpha
