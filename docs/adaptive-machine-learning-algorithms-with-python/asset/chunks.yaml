- fmt: "### Hetero-Associative Networks\n\nLet’s consider a hetero-associative network,\
    \ which differs from the auto-associative case in the output layer, which is `d`\
    \ instead of `x`. Here `d` denotes the categorical classes the data belongs to.\
    \ One example of `d` = `e[i]` where `e[i]` is the *i*^(*th*) standard basis vector\
    \ [standard basis, Wikipedia] for class *i*. In a two-class problem, `d` = `[1\
    \ 0]^T` for class 1 and `d` = `[0 1]^T` for class 2. Let’s denote `B` = `E(xx^T)`,\
    \ `M` = `E(xd^T)`, and `A` = `MM^T`. See Figure [1-9](#522202_1_En_1_Chapter.xhtml#Fig9).\n\
    \n![](images/522202_1_En_1_Chapter/522202_1_En_1_Fig9_HTML.jpg)\n\nFigure 1-9\
    \  \nHetero-associative neural network\n\nWe consider a two-layer linear hetero-associative\
    \ neural network with just a single neuron in the hidden layer and `m ≤ n` output\
    \ units. Let `w ∈ ℜ^n` be the weight vector for the input layer and `v ∈ ℜ^m`\
    \ be the weight vector for the output layer. The MSE at the network output is\n\
    \n`e = E{||d − vw^T x||²}`. (1.8)\n\nWe further assume that the network has limited\
    \ power, so `w^T B w = 1`. Hence, we impose this constraint on the MSE criterion\
    \ in (1.8) as\n\n`J(w, v) = E{||d − vw^T x||²} + μ(w^T B w − 1)`, (1.9)\n\nwhere\
    \ `μ` is the Lagrange multiplier. This equation has a unique global minimum where\
    \ `w` is the first principal eigenvector of the matrix pencil `(A, B)` and `v\
    \ = M^T w`. Furthermore, from the gradient of (1.9) with respect to `w`, we obtain\
    \ the update equation for `w` as\n\n```\nw_{k+1} = w_k - η ∂J/∂w (w_k, v_k) =\
    \ w_k + η (I - B_k w_k w_k^T) M_k v_k\n```  \n(1.10)\n\nWe can substitute the\
    \ convergence value of `v` (1.10) and avoid the back-propagation of errors in\
    \ the second layer to obtain\n\n```\nw_{k+1} = w_k + η (A_k w_k - B_k w_k (w_k^T\
    \ A_k w_k))\n```  \n(1.11)\n\nThis algorithm can be used effectively to adaptively\
    \ compute classification features from streaming data.\n\nFigure [1-10](#522202_1_En_1_Chapter.xhtml#Fig10)\
    \ shows the multivariate e-shopping clickstream dataset [Apczynski M., et al*.*]\
    \ belonging to two classes determining buyer’s pricing sentiments. We use the\
    \ adaptive algorithm (1.11) to compute the class separability feature `w`. Figure\
    \ [1-10](#522202_1_En_1_Chapter.xhtml#Fig10) shows the following:\n\n![](images/522202_1_En_1_Chapter/522202_1_En_1_Fig10_HTML.png)\n\
    \nFigure 1-10  \ne-Shopping clickstream data on the left and uncorrelated class\
    \ separable data on the right\n\n- The original multi-dimensional e-shopping data\
    \ on the left 2 figures.\n- The original data correlation on the right (3rd figure).\
    \ The original data correlation matrix shows that the classes are indistinguishable\
    \ in the original data.\n- The correlation matrix of the data transformed by algorithm\
    \ (1.11) on the far right. The white and red blocks on the far right matrix show\
    \ the two classes are clearly separated in the transformed data by the algorithm\
    \ (1.11).\n\nThe Python code to generate the class separable transformed correlation\
    \ matrix from two-class multi-dimensional dataset `[nDim, nSamples]` is\n\n```\n\
    # Adaptively compute matrices A and B\nfrom numpy import linalg as la\nnSamples\
    \ = dataset1.shape[0]\nnDim = dataset1.shape[1]\nclasses = np.array(dataset['price2']-1)\n\
    classes_categorical = tf.keras.utils.to_categorical(classes, num_classes=2)\n\
    M = np.zeros(shape=(nDim,2)) # stores adaptive correlation matrix\nB = np.zeros(shape=(nDim,nDim))\
    \ # stores adaptive correlation matrix\nfor iter in range(nSamples):\n    cnt\
    \ = iter + 1\n    x = np.array(dataset1.iloc[iter])\n    x = x.reshape(nDim,1)\n\
    \    B = B + (1.0/cnt)*((np.dot(x, x.T)) - B)\n    y = classes_categorical[iter].reshape(2,1)\n\
    \    M = M + (1.0/cnt)*((np.dot(x, y.T)) - M)\nA = M @ M.T\n# generate the transformed\
    \ data\nfrom scipy.linalg import eigh\neigvals, eigvecs = eigh(A, B)\nV = np.fliplr(eigvecs)\n\
    VTAV = np.around(V.T @ A @ V, 2)\nVTBV = np.around(V.T @ B @ V, 2)\n# plot the\
    \ LDA transformed data\nimport seaborn as sns\nplt.figure(figsize=(12, 12))\n\
    plt.rcParams.update({'font.size': 16})\nplt.subplot(2, 2, 1)\nsns.heatmap(A, linewidth=0.5,\
    \ linecolor=\"green\", cmap='RdBu', cbar=False)\nplt.title(\"Original Correlated\
    \ Data\")\nplt.subplot(2, 2, 2)\nsns.heatmap(VTBV, linewidth=0.5, linecolor=\"\
    green\", cmap='hot', cbar=False)\nplt.title(\"Transformed Class Separable Data\"\
    )\nplt.subplot(2, 2, 3)\nsns.heatmap(A, linewidth=0.5, linecolor=\"green\", cmap='RdBu',\
    \ cbar=False)\nplt.title(\"Original Correlated Data\")\nplt.subplot(2, 2, 4)\n\
    sns.heatmap(VTAV, linewidth=0.5, linecolor=\"green\", cmap='hot', cbar=False)\n\
    plt.title(\"Transformed Class Separable Data\")\nplt.show()\n```\n\n### Statistical\
    \ Pattern Recognition\n\nOne special case of linear hetero-association is a network\
    \ performing one-from-`m` classification, where input `x` to the network is classified\
    \ into one out of `m` classes `ω[1], ..., ω[m]`. If `x ∈ ω[i]` then `d = e[i]`\
    \ where `e[i]` is the *i*^(*th*) standard basis vector. Unlike auto-associative\
    \ learning, which is unsupervised, this network is supervised. In this case, `A`\
    \ and `B` are scatter matrices. Here `A` is the *between-class scatter matrix*\
    \ `S[b]`, the scatter of the class means around the mixture mean, and `B` is the\
    \ *mixture scatter matrix* `S[m]`, the covariance of all samples regardless of\
    \ class assignments. The generalized eigenvector decomposition of `(A, B)` is\
    \ known as *linear discriminant analysis* (LDA), which was discussed in Section\
    \ [1.1](#522202_1_En_1_Chapter.xhtml#Sec1).\n\n### Information Theory\n\nAnother\
    \ viewpoint of the data model (1.1) is due to Linsker [1988] and Plumbley [1993].\
    \ According to Linsker’s *Infomax* principle, the optimum value of the weight\
    \ matrix `W` is when the information `I(x, y)` transmitted to its output `y` about\
    \ its input `x` is *maximized*. This is equivalent to information in input `x`\
    \ about output `y` since `I(x, y) = I(y, x)`. However, a noiseless process like\
    \ (1.1) has infinite information about input `x` in `y` and vice versa since `y`\
    \ perfectly represents `x`. In order to proceed, we assume that input `x` contains\
    \ some noise `n`, which prevents `x` from being measured accurately by `y`. There\
    \ are two variations of this model, both inspired by Plumbley [1993].\n\nIn the\
    \ first model, we assume that the output `y` is corrupted by noise due to the\
    \ transform `W`. We further assume that average power available for transmission\
    \ is limited, the input `x` is zero-mean Gaussian with covariance `A`, the noise\
    \ `n` is zero-mean uncorrelated Gaussian with covariance `N`, and the transform\
    \ noise `n` is independent of `x`. The noisy data model is\n\n`y = W^T x + n`.\
    \ (1.12)\n\nThe mutual information `I(y, x)` (with Gaussian assumptions) is\n\n\
    `I(y, x) = 0.5 log det(W^T A W + N) − 0.5 log det(N)`. (1.13)\n\nWe define an\
    \ objective function with power constraints as\n\n`J(W) = I(y, x) − 0.5 tr(Λ(W^T\
    \ A W + N))`, (1.14)\n\nwhere `Λ` is a diagonal matrix of Lagrange multipliers.\
    \ This function is maximized when `W = Φ R`, where `Φ` is the principal eigenvector\
    \ matrix of `A` and `R` is a non-singular rotation matrix."
  raw: '### Hetero-Associative Networks


    Let’s consider a hetero-associative network , which differs from the auto-associative
    case in the output layer, which is **d** instead of **x**. Here **d** denotes
    the categorical classes the data belongs to. One example of **d**=**e**[*i*] where
    **e**[*i*] is the *i*^(*th*) standard basis vector [standard basis, Wikipedia]
    for class *i*. In a two-class problem, **d**=[1 0]^(*T*) for class 1 and **d**=[0
    1]^(*T*) for class 2\. Let’s denote *B*=*E*(**xx**^(*T*)), *M*=*E*(**xd**^(*T*)),
    and *A*=*MM*^(*T*). See Figure [1-9](#522202_1_En_1_Chapter.xhtml#Fig9).


    ![](images/522202_1_En_1_Chapter/522202_1_En_1_Fig9_HTML.jpg)


    Figure 1-9


    Hetero-associative neural network


    We consider a two-layer linear hetero-associative neural network with just a single
    neuron in the hidden layer and *m≤n* output units. Let **w∈**ℜ^(*n*) be the weight
    vector for the input layer and **v∈**ℜ^(*m*) be the weight vector for the output
    layer. The MSE at the network output is


    *e* = *E*{‖**d** − **vw**^(*T*)**x**‖²}.     (1.8)


    We further assume that the network has limited power, so **w**^(*T*)*B***w**=1.
    Hence, we impose this constraint on the MSE criterion in ([1.8](#522202_1_En_1_Chapter.xhtml#Par62))
    as


    *J*(**w**, **v**) = *E*{‖**d** − **vw**^(*T*)**x**‖²} + *μ*(**w**^(*T*)*B***w** − 1),     (1.9)


    where μ is the Lagrange multiplier. This equation has a unique global minimum
    where **w** is the first principal eigenvector of the matrix pencil (*A*,*B*)
    and **v**=*M*^(*T*)**w**. Furthermore, from the gradient of ([1.9](#522202_1_En_1_Chapter.xhtml#Par64))
    with respect **w**, we obtain the update equation for **w** as


    ![$$ {\mathbf{w}}_{k+1}={\mathbf{w}}_k-\eta \frac{\mathit{\partial J}}{\mathit{\partial}\mathbf{w}}\left({\mathbf{w}}_k,{\mathbf{v}}_k\right)={\mathbf{w}}_k+\eta
    \left(I-{B}_k{\mathbf{w}}_k{\mathbf{w}}_k^T\right)\kern0.2em {M}_k{\mathbf{v}}_k
    $$](images/522202_1_En_1_Chapter/522202_1_En_1_Chapter_TeX_IEq19.png).     (1.10)


    We can substitute the convergence value of **v** ([1.10](#522202_1_En_1_Chapter.xhtml#Par66))
    and avoid the back-propagation of errors in the second layer to obtain


    ![$$ {\mathbf{w}}_{k+1}={\mathbf{w}}_k+\eta \left({A}_k{\mathbf{w}}_k-{B}_k{\mathbf{w}}_k\left({\mathbf{w}}_k^T{A}_k{\mathbf{w}}_k\right)\right).
    $$](images/522202_1_En_1_Chapter/522202_1_En_1_Chapter_TeX_IEq20.png)     (1.11)


    This algorithm can be used effectively to adaptively compute classification features
    from streaming data.


    Figure [1-10](#522202_1_En_1_Chapter.xhtml#Fig10) shows the multivariate e-shopping
    clickstream dataset [Apczynski M., et al*.*] belonging to two classes determining
    buyer’s pricing sentiments. We use the adaptive algorithm ([1.11](#522202_1_En_1_Chapter.xhtml#Par68))
    to compute the class separability feature **w**. Figure [1-10](#522202_1_En_1_Chapter.xhtml#Fig10)
    shows the following:


    ![](images/522202_1_En_1_Chapter/522202_1_En_1_Fig10_HTML.png)


    Figure 1-10


    e-Shopping clickstream data on the left and uncorrelated class separable data
    on the right


    *   The original multi-dimensional e-shopping data on the left 2 figures.


    *   The original data correlation on the right (3rd figure). The original data
    correlation matrix shows that the classes are indistinguishable in the original
    data.


    *   The correlation matrix of the data transformed by algorithm ([1.11](#522202_1_En_1_Chapter.xhtml#Par68))
    on the far right. The white and red blocks on the far right matrix show the two
    classes are clearly separated in the transformed data by the algorithm ([1.11](#522202_1_En_1_Chapter.xhtml#Par68)).


    The Python code to generate the class separable transformed correlation matrix
    from two-class multi-dimensional dataset[nDim, nSamples] is


    ```

    # Adaptively compute matrices A and B

    from numpy import linalg as la

    nSamples = dataset1.shape[0]

    nDim = dataset1.shape[1]

    classes = np.array(dataset[''price2'']-1)

    classes_categorical = tf.keras.utils.to_categorical(classes, num_classes=2)

    M = np.zeros(shape=(nDim,2)) # stores adaptive correlation matrix

    B = np.zeros(shape=(nDim,nDim)) # stores adaptive correlation matrix

    for iter in range(nSamples):

    cnt = iter + 1

    x = np.array(dataset1.iloc[iter])

    x = x.reshape(nDim,1)

    B = B + (1.0/cnt)*((np.dot(x, x.T)) - B)

    y = classes_categorical[iter].reshape(2,1)

    M = M + (1.0/cnt)*((np.dot(x, y.T)) - M)

    A = M @ M.T

    # generate the transformed data

    from scipy.linalg import eigh

    eigvals, eigvecs = eigh(A, B)

    V = np.fliplr(eigvecs)

    VTAV = np.around(V.T @ A @ V, 2)

    VTBV = np.around(V.T @ B @ V, 2)

    # plot the LDA transformed data

    import seaborn as sns

    plt.figure(figsize=(12, 12))

    plt.rcParams.update({''font.size'': 16})

    plt.subplot(2, 2, 1)

    sns.heatmap(A, linewidth=0.5, linecolor="green", cmap=''RdBu'', cbar=False)

    plt.title("Original Correlated Data")

    plt.subplot(2, 2, 2)

    sns.heatmap(VTBV, linewidth=0.5, linecolor="green", cmap=''hot'', cbar=False)

    plt.title("Transformed Class Separable Data")

    plt.subplot(2, 2, 3)

    sns.heatmap(A, linewidth=0.5, linecolor="green", cmap=''RdBu'', cbar=False)

    plt.title("Original Correlated Data")

    plt.subplot(2, 2, 4)

    sns.heatmap(VTAV, linewidth=0.5, linecolor="green", cmap=''hot'', cbar=False)

    plt.title("Transformed Class Separable Data")

    plt.show()

    ```


    ### Statistical Pattern Recognition


    One special case of linear hetero-association is a network performing one-from-*m*
    classification, where input **x** to the network is classified into one out of
    *m* classes ω[1],...,ω[*m*]. If **x∈**ω[*i*] then **d**=**e**[*i*] where **e**[*i*]
    is the *i*^(*th*) standard basis vector. Unlike auto-associative learning, which
    is unsupervised, this network is supervised. In this case, *A* and *B* are scatter
    matrices. Here *A* is the *between-class scatter matrix S*[*b*], the scatter of
    the class means around the mixture mean, and *B* is the *mixture scatter matrix
    S*[*m*], the covariance of all samples regardless of class assignments. The generalized
    eigenvector decomposition of (*A*,*B*) is known as *linear discriminant analysis*
    (LDA), which was discussed in Section [1.1](#522202_1_En_1_Chapter.xhtml#Sec1).


    ### Information Theory


    Another viewpoint of the data model ([1.1](#522202_1_En_1_Chapter.xhtml#Sec1))
    is due to Linsker [1988] and Plumbley [1993]. According to Linsker’s *Infomax*
    principle, the optimum value of the weight matrix *W* is when the information
    *I*(**x**,**y**) transmitted to its output **y** about its input **x** is *maximized*.
    This is equivalent to information in input **x** about output **y** since *I*(**x**,**y**)=*I*(**y**,**x**).
    However, a noiseless process like ([1.1](#522202_1_En_1_Chapter.xhtml#Sec1)) has
    infinite information about input **x** in **y** and vice versa since **y** perfectly
    represents **x**. In order to proceed, we assume that input **x** contains some
    noise **n**, which prevents **x** from being measured accurately by **y**. There
    are two variations of this model, both inspired by Plumbley [1993].


    In the first model, we assume that the output **y** is corrupted by noise due
    to the transform *W*. We further assume that average power available for transmission
    is limited, the input **x** is zero-mean Gaussian with covariance *A*, the noise
    **n** is zero-mean uncorrelated Gaussian with covariance *N*, and the transform
    noise **n** is independent of **x**. The noisy data model is


    **y** = *W*^(*T*)**x** + **n**.     (1.12)


    The mutual information *I*(**y**,**x**) (with Gaussian assumptions) is


    *I*(**y**, **x**) = 0.5 log  det(*W*^(*T*)*AW* + *N*) − 0.5 log  det(*N*).     (1.13)


    We define an objective function with power constraints as


    *J*(*W*) = *I*(**y**, **x**) − 0.5*tr*(Λ(*W*^(*T*)*AW* + *N*)),     (1.14)


    where Λ is a diagonal matrix of Lagrange multipliers. This function is maximized
    when *W*=Φ*R*, where Φ is the principal eigenvector matrix of *A* and *R* is a
    non-singular rotation matrix.'
