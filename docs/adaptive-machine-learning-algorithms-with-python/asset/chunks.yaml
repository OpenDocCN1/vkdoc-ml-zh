- fmt: '# 8.3 Compressing High Volume and High Dimensional Data


    When the incoming data volume is large, it can be prohibitively difficult to store
    such data on the device for training machine learning models. The problem is further
    complicated if the data is high dimensional, like 100+ dimensions. In such circumstances,
    we want to compress the data into batches and store the sequence of feature vectors
    for future use for machine learning training.


    In this example, I used the open source `gassensor.arff` data. The dataset has
    129 components/dimensions and 13,910 samples. I used the adaptive EVD algorithm
    (5.13) to compute the first 16 principal components [**ϕ**[1] **ϕ**[2] … **ϕ**[16]].
    I reconstructed the data back from these 16-dimensional principal components.
    In Figure [8-10](#522202_1_En_8_Chapter.xhtml#Fig10), the left column is the original
    data and the right column is the reconstructed data. Clearly, they look quite
    similar and there is an 8x data compression.


    ![](images/522202_1_En_8_Chapter/522202_1_En_8_Fig10_HTML.jpg)


    Figure 8-10


    Original (left) and reconstructed (right) data with 8x compression using the adaptive
    EVD algorithm (5.13)


    The Python code is given in Section [5.4](#522202_1_En_8_Chapter.xhtml#Sec11)
    and below for `dataset[nDim,nSamples]:`


    ```

    from numpy import linalg as la

    nSamples = dataset.shape[0]

    nDim = dataset.shape[1]

    nEA = 16

    A = np.zeros(shape=(nDim,nDim)) # stores adaptive correlation matrix

    N = np.zeros(shape=(1,nEA)) # stores eigen norms

    W = 0.1 * np.ones(shape=(nDim,nEA)) # stores adaptive eigenvectors

    for iter in range(nSamples):

    cnt = iter + 1

    # Update data correlation matrix A with current sample x

    x = np.array(dataset.iloc[iter])

    x = x.reshape(nDim,1)

    A = A + (1.0/cnt)*((np.dot(x, x.T)) - A)

    etat = 1.0/(500 + cnt)

    # Deflated Gradient Descent

    W = W + etat*(A @ W - 0.5*W @ np.triu(W.T @ A @ W) - \

    0.5*A @ W @ np.triu(W.T @ W))

    ```


    ## Data Representation (PCA) Features


    Let’s demonstrate the success of the adaptive algorithms by comparing the eigenvalues
    and eigenvectors of the batch correlation matrix computed by conventional method
    with the adaptive algorithm (5.13) at each adaptive step for the first four principal
    eigenvectors.


    In order to measure the convergence and accuracy of the adaptive algorithm, I
    computed the direction cosine at *k*^(*th*) update eigenvector of each adaptive
    algorithm as


    Direction cosine (*k*) = ![$$ \left|{{\mathbf{w}}_k^i}^T{\boldsymbol{\upvarphi}}_i\right|/\left\Vert
    {\boldsymbol{\upvarphi}}_i\right\Vert \left\Vert {\mathbf{w}}_k^i\right\Vert $$](images/522202_1_En_8_Chapter/522202_1_En_8_Chapter_TeX_IEq1.png),


    where ![$$ {\mathbf{w}}_k^i $$](images/522202_1_En_8_Chapter/522202_1_En_8_Chapter_TeX_IEq2.png)
    is the estimated eigenvector of `A[k]` at *k*^(*th*) update and **ϕ**[*i*] is
    the actual *i*^(*th*) principal eigenvector computed from all collected samples
    by a conventional numerical analysis method. I measured the error of the eigenvalues
    at the *k*^(*th*) update as follows:


    Abs error (*k*) = ![$$ \left|{d}_k^i-{\lambda}_k^i\right| $$](images/522202_1_En_8_Chapter/522202_1_En_8_Chapter_TeX_IEq3.png),


    where ![$$ {d}_k^i $$](images/522202_1_En_8_Chapter/522202_1_En_8_Chapter_TeX_IEq4.png)
    is the estimated eigenvalue of `A[k]` at *k*^(*th*) update and ![$$ {\lambda}_k^i
    $$](images/522202_1_En_8_Chapter/522202_1_En_8_Chapter_TeX_IEq5.png) is the actual
    *i*^(*th*) principal eigenvalue computed from all collected samples by a conventional
    numerical analysis method.


    I did the following:


    ![](images/522202_1_En_8_Chapter/522202_1_En_8_Fig12_HTML.png)


    Figure 8-12


    Absolute error of the first four principal eigenvalues with the adaptive algorithm
    (5.13)


    ![](images/522202_1_En_8_Chapter/522202_1_En_8_Fig11_HTML.png)


    Figure 8-11


    Direction cosines of the first four principal eigenvectors with the adaptive algorithm
    (5.13) (ideal value = 1)


    1.  I plotted the direction cosines of the eigenvectors with the batch eigenvectors
    for each adaptive step. See Figure [8-11](#522202_1_En_8_Chapter.xhtml#Fig11).


    2.  I plotted the errors of the eigenvalues with the batch eigenvalues for each
    adaptive step. See Figure [8-12](#522202_1_En_8_Chapter.xhtml#Fig12).


    The final results are


    *   Actual eigenvalues: [57.865, 36.259, 27.087, 21.833]


    *   Adaptive eigenvalues: [57.857, 36.251, 27.054, 21.881]


    These results demonstrate that the adaptive algorithm accurately computed the
    PCA features, which will create an 8x data compression in place of the voluminous
    raw data.


    The Python code used here is same as in the section before this one.


    # 8.4 Detecting Feature Anomalies


    Here I used adaptive linear algorithms to detect anomalies in data.


    ## Yahoo Real Dataset


    The dataset is `real_data.csv` and is derived from Yahoo Research Webscope: S5
    - A Labeled Anomaly Detection Dataset [Yahoo Research Webscope]. Detecting anomalies
    in machines is an important machine learning task for the manufacturing market.
    I collected 8-dimensional data from machines, which have occasional anomalous
    readings. One method of detecting anomalies is to calculate the deviation of the
    current sample from its running median and compare it against a statistic.


    I used the adaptive median algorithm (2.20) to calculate the running median and
    a simple statistic to detect anomalies. See the results in Figure [8-13](#522202_1_En_8_Chapter.xhtml#Fig13).
    I plotted the data in blue, the adaptive median in green, and the anomalies in
    red.


    ![](images/522202_1_En_8_Chapter/522202_1_En_8_Fig13_HTML.png)


    Figure 8-13


    Yahoo Webscope multidimensional real dataset with anomalies in several components
    detected by the adaptive median algorithm (2.20)


    The following Python code is used on multidimensional dataset `X[nDim, nSamples]:`


    ```

    from numpy import linalg as la

    nSamples = X.shape[0]

    nDim = X.shape[1]

    w = np.zeros(shape=(nDim,1)) # stores adaptive eigenvectors

    anam = np.zeros(shape=(nDim,nSamples))

    mdks = np.zeros(shape=(nDim,nSamples))

    for iter in range(nSamples):

    cnt = iter + 1

    # current data vector x

    x = np.array(X.iloc[iter])

    x = x.reshape(nDim,1)

    #Eq.2.20

    w = w + (1/(1 + iter)) * np.sign(x - w)

    mdks[:,iter] = w.T

    y = (np.abs(x-w) > 0.5*w) # Anomaly detection threshold

    anam[:,iter] = y.T

    ```


    ## NOAA Dataset


    The dataset name is `NOAA.arff`. The data sequence has eight components. Component
    F3 has an anomalous spike, as shown in Figure [8-14](#522202_1_En_8_Chapter.xhtml#Fig14).


    ![](images/522202_1_En_8_Chapter/522202_1_En_8_Fig14_HTML.png)


    Figure 8-14


    NOAA real-world dataset with an anomaly in one component only, detected by the
    adaptive median algorithm (2.20)


    I used the adaptive median detection algorithm (2.20) on all components of this
    dataset. I used a simple algorithm of testing to determine an anomaly:


    Anomaly = ABS (Sample_Value – Adaptive_Median) > 4 x Adaptive_Median.


    Figure [8-15](#522202_1_En_8_Chapter.xhtml#Fig15) shows the data in blue, the
    adaptive median in green, and the anomalies in red. Clearly the adaptive median
    algorithm (2.20) detects the anomaly accurately.


    ![](images/522202_1_En_8_Chapter/522202_1_En_8_Fig15_HTML.png)


    Figure 8-15


    Anomaly in the NOAA dataset detected with the adaptive median algorithm (2.20)


    The Python code used here is same as the previous example except for the detection
    threshold:


    ```

    y = (np.abs(x-w) > 4*w) # Anomaly detection threshold.

    ```'
