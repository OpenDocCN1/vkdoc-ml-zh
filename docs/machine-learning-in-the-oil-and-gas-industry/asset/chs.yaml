- '# 5. 地质建模


  地质建模是勘探与开发规划过程中的重要步骤。地质建模是在利用地震解释过程中提取的信息，对油藏构造框架形成认识之后进行的。通过构造框架定义的层位和断层，创建一个三维（3D）网格。该三维网格与测井数据一起使用，以生成油藏属性（如孔隙度、渗透率等）的详细三维模型。此步骤是油藏模拟的前置环节。基于三维油藏模型的计算也有助于估算重要参数，包括原始石油地质储量（OOIP）。


  一旦利用构造框架创建了三维网格，在执行任何进一步的工作流程步骤之前，需要估算离散的岩石物理属性（如相）和连续属性（如孔隙度和渗透率）。测井数据构成了属性估算的基础。应用多种建模技术来为三维网格的每个单元生成这些属性。一些最常用的技术涉及以下算法
  [1] [2]。


  *   简单克里金法

  *   普通克里金法

  *   泛克里金法

  *   序贯高斯模拟

  *   多元高斯模拟


  在本章中，我们将讨论机器学习如何帮助我们估算三维网格上的岩石物理属性值。首先，我们讨论所有技术共有的基本基础，以及本章中使用的机器学习技术。接着，我们描述本章使用的数据集，展示机器学习算法在该数据集上的应用，并概述一些算法局限性。


  ## 变差函数


  变差函数是几乎所有具有工业相关性的三维空间建模技术的基础。变差函数提供了属性 *Z* 在距关注点不同距离处的半方差（通常简称为*方差*）。在经典的地统计学方法
  [1] 中，属性 *Z* 的半变差函数 *γ (h)*（通常称为*变差函数*）定义为


  ![$$ \gamma (h)=\frac{1}{2n(h)}\sum \limits_{n(h)}E\left[{\left(Z\left(u+h\right)-Z(u)\right)}²\right],
  $$](images/480430_1_En_5_Chapter/480430_1_En_5_Chapter_TeX_Equ1.png)


  (5.1)


  其中 *n(h)* 是相距距离 *h*（也称为*滞后距*）的点对数量。需要注意的是，使用此公式计算得到的实验变差函数需使用解析表达式（如球状变差函数模型）进行拟合。


  图 5-1 展示了变差函数 *γ (h)* 的球状变差函数模型拟合示意图。在图 5-1 中，*r* 代表变差函数的变程。该值表示从给定点开始，属性值之间的相关性消失（即属性值去相关）的距离。基台值用
  *s* 表示，是变差函数渐近达到的半方差值。基台值可以理解为位于距离大于变差函数变程 (*r*) 的两点处属性值的方差。块金方差 *n* 是对实验或测量数据不确定性的估计。


  ![../images/480430_1_En_5_Chapter/480430_1_En_5_Fig1_HTML.jpg](img/480430_1_En_5_Fig1_HTML.jpg)


  图 5-1


  球状变差函数模型示意图


  变差函数可以是全方向的或各向同性的，即假设在任何方向上对于相同的滞后距值都能观测到相同的半方差。也可能存在各向异性的变差函数，其中半方差取决于滞后距值和方向。各向异性变差函数的一个例子是沿侧向（例如
  *x* 和 *y* 方向）使用相同的变差函数模型，而沿深度方向使用另一个不同的变差函数模型。克里金法在估算远离井点处的岩石物理属性值时依赖于变差函数。克里金法是一种广义线性回归形式，它提供了一个最优估计量，以最小化估计属性值的均方误差。在本章中，我们不打算讨论克里金技术的细节。相反，我们专注于一种机器学习算法，该算法大致相当于简单克里金算法。


  能够获取用于进行三维地质建模练习的开源数据集是最大的挑战。在本章中，我们的目标是为你提供一个在三维地质模型上进行岩石物理属性插值的工作示例。考虑到这一点，我们选择了由石油工程师协会比较解决方案项目
  SPE 9 [3] 提供的一个简单地质模型，该模型可在 [`https://github.com/OPM/opm-data`](https://github.com/OPM/opm-data)
  获取。SPE 9 模型如图 5-2 所示，叠加显示了 *permx*（*x* 方向渗透率）。


