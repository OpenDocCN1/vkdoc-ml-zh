  是油藏半径，英尺；*μ*[*o*] 是原油粘度，厘泊；*B*[*o*] 是原油地层体积系数；*h*[*op*] 是射孔段长度，英尺；![$$ \frac{{\mathrm{k}}_{fv}}{{\mathrm{k}}_{fh}}
