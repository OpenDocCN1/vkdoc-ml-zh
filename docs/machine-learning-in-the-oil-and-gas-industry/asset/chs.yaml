  \ RHOMA (G/CM3) 和 CARB_FLAG (无量纲) 除外，它们显示出 70% 的共线性。根据经验法则，建议采取额外步骤来理解特征的重要性，并仅保留重要性较高的特征。然而，特征工程和特征选择是内容广泛的课题，超出了本章的讨论范围。我们将重点放在构建机器学习模型上。\n\
  \n观察图 3-7 中的最终变量列表及其观测数量，数据集中只有一个主要分类变量——LITHOTYPE。对于分类问题，这就是输出变量。\n\n![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig7_HTML.jpg](img/480430_1_En_3_Fig7_HTML.jpg)\n\
  \n图 3-7\n\n数据集中特征的数据类型信息\n\n## 监督学习\n\n正如我们在本章开头所讨论的，那些利用已知输入来预测变量输出的问题属于监督学习范畴。如果输出是定量或连续的，则属于回归问题。而如果输出是定性或离散/分类的，则属于分类问题\
  \ [10]。换句话说，目标是学习一个函数 *f*，该函数表示由输入变量提供的系统信息，用于预测或推断响应（输出）变量 [7]。\n\n在本节中，我们提供了各种回归和分类算法的基本实现代码片段。目的是通过提供一个起点，让您熟悉不同的算法。本章后面的一节将介绍一个超参数调优示例，该示例可适用于本章讨论的任何机器学习算法。\n\
  \n在简要描述不同算法并提供代码片段后，将进行简要分析以了解每种算法的性能。但需要注意的是，这些算法实现并未针对性能进行优化；因此，使用这些算法进行微调的模型可能会表现出比此处基本实现更好的性能。\n\
  \n### 回归\n\n回归是监督学习问题的一个子类型，其输出是定量或连续变量。在我们一直使用的岩石物理数据示例中，KLOGH 被选为输出变量。所有其他特征都被视为独立的输入变量。因此，回归问题的目标是找到最优函数\
  \ *f*，该函数能够利用所有其他变量作为输入特征，准确预测 KLOGH。\n\n![$$ KLOGH=f\\Big( BVW, CARB\\_ FLAG, COAL\\\
  _ FLAG, PHIF, RHOFL, RHOMA, $$](img/480430_1_En_3_Chapter_TeX_Equa.png)\n\n![$$\
  \ RW, SAND\\_ FLAG, SW, TEMP, VSH\\Big). $$](img/480430_1_En_3_Chapter_TeX_Equ10.png)\n\
  \n(3.10)\n\n本节简要讨论了各种机器学习算法，但未深入探讨其数学细节或超参数优化。本节展示了这些算法的最小实现，我们建议您按照本章末尾“延伸阅读”部分提供的建议，更深入地研究每种算法。\n\
  \n使用 scikit-learn 和 TensorFlow 机器学习库，通过 Python 实现这些算法。本章示例的端到端代码可在本书代码仓库中的 Jupyter\
  \ notebook 中找到。该 Jupyter notebook 还包含一些基本函数，这些函数用于生成精度指标、绘制回归曲线以及生成预测结果的散点图。\n\n\
  #### 多元线性回归\n\n多元线性回归，或简称为多元回归，是最简单的回归算法。在该算法中，为每个输入特征分配一个数值系数，输出变量则预测为特征值与其对应数值系数相乘所得值的总和。该算法的训练过程试图最小化观测值与模型预测输出值之间的残差平方和。以下代码片段展示了该算法的一个示例实现。\n\
  \n```\n# 多元线性回归\nfrom sklearn.linear_model import LinearRegression\nlin_reg = LinearRegression()\n\
  lin_reg.fit(X_train, y_train)  # 训练算法\nprint(lin_reg.intercept_)  # 截距\nprint(lin_reg.coef_)\
  \  # 系数\n# 对测试数据进行预测\ny_pred_lin = lin_reg.predict(X_test)\n```\n\n**结果**\n\n```\n\
  平均绝对误差: 283.89717843775026\n均方误差: 245181.5892137209\n均方根误差: 495.15814566027376\n\
  R 平方: 0.1488228559603506\n```\n\n多元线性回归的回归图如图 3-8 所示，同时还包括测试数据集中 KLOGH 预测值的比较。从测试数据观测值与预测值的回归图可以看出，线性模型未能捕捉到输入特征与输出变量之间的非线性映射关系。可以得出结论，该算法过于简单，无法解决该问题，并且存在较强的偏差（欠拟合）。\n\
  \n![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig8_HTML.jpg](img/480430_1_En_3_Fig8_HTML.jpg)\n\
  \n图 3-8\n\n多元线性回归结果，以回归图和散点图形式展示\n\n\n\n#### 支持向量回归\n\n支持向量回归基于支持向量机。该方法通过允许一定的误差范围对每个数据点执行回归。对于每个数据点\
  \ *y*，预测值落在 (*y* + *ϵ*) 到 (*y* - *ϵ*) 的范围内都是可以接受的。在图 3-9 中，误差范围 *ϵ* 由两个支持向量描绘，并允许模型调优的灵活性。\n\
  \n![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig9_HTML.jpg](img/480430_1_En_3_Fig9_HTML.jpg)\n\
  \n图 3-9\n\n描绘带有误差范围 *ϵ* 的支持向量的示意图\n\n除了误差范围，该算法还利用了*核技巧*。核技巧将非线性的低维空间投影到高维空间。在高维空间中，可以将原始的非线性问题表示为线性问题。scikit-learn\
  \ 中有多种核函数可用于支持向量回归的实现，包括 `'linear'`、`'sigmoid'`、`'rbf'` 和 `'polynomial'`。\n\n由于数据集中存在非线性，本例选择了径向基函数（`'rbf'`）核，也称为*高斯核*。以下代码片段展示了一个示例实现。\n\
  \n```\n# Support Vector Regression (SVR)\nfrom sklearn.svm import SVR\nsvr_reg =\
  \ SVR(kernel='rbf', C=100, gamma=0.1, epsilon=.1)\nsvr_reg.fit(X_train, y_train)\n\
  # Prediction on test data\ny_pred_svr = svr_reg.predict(X_test)\n```\n\n**结果**\n\
  \n```\nMean Absolute Error: 82.06389051208197\nMean Squared Error: 112564.26261124818\n\
  Root Mean Squared Error: 335.5059799932755\nR Squared: 0.6092197302512246\n```\n\
  \n基于支持向量回归结果的回归图和散点图如图 3-10 所示。该算法的性能显著优于多元线性回归。这种改进归功于支持向量回归中应用的误差范围和核技巧。\n\n![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig10_HTML.jpg](img/480430_1_En_3_Fig10_HTML.jpg)\n\
  \n图 3-10\n\n支持向量回归结果以回归图和散点图形式展示\n\n#### 决策树回归\n\n决策树是一种非参数化的基于树的流程图。该算法通过构建一个由多个叶节点组成的基于规则的层次树结构来工作。在每个叶节点上，对一个特征或一组特征施加一个条件。在决策树的每个节点处，根据施加的条件，训练数据中的样本被分割成多个子节点。预测值根据终端叶节点中样本的平均值计算得出（见图\
  \ 3-11）。\n\n在训练过程中，算法学习在每个叶节点分割训练数据的规则，以使观测值与预测值之间的均方误差（MSE）最小化。由于其高度可解释的特性，决策树非常常用于回归问题。图\
  \ 3-12 显示，与之前两种算法相比，应用该算法提供了更好的预测。然而，该算法存在过拟合的问题。此处展示了一个决策树回归的代码片段。\n\n```\n# Decision\
  \ Tree – Regression\nfrom sklearn.tree import DecisionTreeRegressor\ndt_reg = DecisionTreeRegressor(random_state=42)\n\
  dt_reg.fit(X_train, y_train)\n# Prediction on test data\ny_pred_dt = dt_reg.predict(X_test)\n\
  ```\n\n**结果**\n\n```\nMean Absolute Error: 29.73391044401977\nMean Squared Error:\
  \ 35097.83335297129\nRoot Mean Squared Error: 187.34415750957191\nR Squared: 0.8781536833529513\n\
  ```\n\n![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig12_HTML.jpg](img/480430_1_En_3_Fig12_HTML.jpg)\n\
  \n图 3-12\n\n决策树回归结果以回归图和散点图形式展示\n\n![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig11_HTML.jpg](img/480430_1_En_3_Fig11_HTML.jpg)\n\
  \n图 3-11\n\n决策树的概念性描述，该树根据 PHIF 的值分割数据\n\n#### 随机森林回归\n\n*随机森林*是一种基于决策树集成的算法。该算法应用了本章前面讨论过的装袋（bagging）方法。随机森林算法对输入特征和训练数据都应用装袋方法。这意味着，对于随机森林模型中生长的每棵决策树，都会随机选择输入特征的一个子集和训练数据的一个子集来训练该决策树。该算法并行训练多棵决策树。\n\
  \n决策树算法存在过拟合问题。这是由于使用单棵树造成的，它几乎记住了整个训练数据，而无法泛化。然而，通过对特征和训练数据进行装袋，随机森林算法解决了过拟合问题，从而能够提供稳健的预测模型。从随机森林回归获得的结果显示出比之前讨论的算法更好的预测精度。通过查看图\
  \ 3-13 中的图可以验证这一观察结果。此处展示了一个示例代码实现。\n\n```\n# Random Forest – Regression\nfrom sklearn.ensemble\
  \ import RandomForestRegressor\nrf_reg = RandomForestRegressor(random_state=42)\n\
  rf_reg.fit(X_train, y_train)\n# Prediction on test data\ny_pred_rf = rf_reg.predict(X_test)\n\
  ```\n\n**结果**\n\n```\nMean Absolute Error: 20.0011266166531\nMean Squared Error:\
  \ 14744.082604216954\nRoot Mean Squared Error: 121.4252140381764\nR Squared: 0.948814157854232\n\
  ```\n\n![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig13_HTML.jpg](img/480430_1_En_3_Fig13_HTML.jpg)\n\
  \n图 3-13\n\n随机森林回归结果以回归图和散点图形式展示\n\n#### XGBoost：极端梯度提升\n\nXGBoost 是非常强大且流行的机器学习算法之一，由于其优化的实现，它为大型数据集提供了高精度。该算法遵循提升（boosting）概念，其中弱学习器（决策树）按顺序生长。每棵后续树都基于前一棵树的预测误差进行学习。对于在前一个学习器中表现出较高\
  \ MSE 的数据点，会给予更高的权重来改进预测。该算法从弱学习器中创建一个复合模型，从而提供稳健的性能。\n\n该算法旨在以更高的执行速度优化性能。模型本身使用梯度下降算法进行优化；因此，它提供了更高的精度。图\
  \ 3-14 显示了使用 XGBoost 回归的预测绘制的回归图和散点图。以下代码片段展示了 XGBoost 回归算法的示例实现。\n\n```\n# XGBoost\
  \ – Regression\nimport xgboost as xgb\nxgb_reg = xgb.XGBRegressor()\nxgb_reg.fit(X_train,\
  \ y_train)\n# Prediction on test data\ny_pred_xgb = xgb_reg.predict(X_test)\n```\n\
  \n**结果**\n\n```\nMean Absolute Error: 34.95929924279304\nMean Squared Error: 14853.490861224791\n\
  Root Mean Squared Error: 121.87489840498243\nR Squared: 0.948434334034536\n```\n\
  \n![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig14_HTML.jpg](img/480430_1_En_3_Fig14_HTML.jpg)\n\
  \n图 3-14\n\nXGBoost 回归结果以回归图和散点图形式展示\n\n\n\n#### 人工神经网络\n\n人工神经网络建立在人脑神经元决策能力原理之上，它们是更复杂的深度学习网络的基础构建模块。神经网络架构包含一个输入层、一个或多个隐藏层以及一个输出层。每一层都由神经元构成，计算就在这些神经元中进行。\n\
  \n在本章稍后的部分，我们将更详细地讨论人工神经网络及其在深度学习中的应用。在以下代码示例中，构建了一个多层感知器模型，该模型将误差反向传播原理作为主要学习机制。\n\
  \n在误差反向传播过程中，模型预测中的估计误差会被反向传播，以调整神经网络模型参数，并计算出更新后的模型参数。这个迭代训练过程会持续进行，直到满足模型精度或训练时长的特定条件。图\
  \ 3-15 展示了基于以下代码构建的神经网络模型所获得的预测结果图。\n\n```\n# 多层感知器 – 回归\nimport tensorflow as tf\n\
  from tensorflow import keras\nfrom tensorflow.keras import layers\ndef build_model():\n\
  ann_reg = keras.Sequential([\nlayers.Dense(32, activation=\"relu\", input_shape=[len(X_train.keys())]),\n\
  layers.Dense(32, activation=\"relu\"),\nlayers.Dense(1) ])\noptimizer = tf.keras.optimizers.RMSprop(0.001)\n\
  ann_reg.compile(loss='mse', optimizer=optimizer, metrics=['mse'])\nreturn ann_reg\n\
  ```\n\n**结果**\n\n```\n平均绝对误差: 80.5055592187044\n均方误差: 51228.191722683405\n均方根误差:\
  \ 226.33645690140906\nR 平方: 0.8221552194654382\n```\n\n这里构建的基础神经网络模型的精度，可能不如本章前面讨论的一些更简单的模型。随着机器学习模型复杂度的增加，充分训练它们的任务也变得更加具有挑战性。为了充分训练一个*深度*神经网络模型，我们需要遵循超参数优化的流程，这将在本章后面讨论。\n\
  \n![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig15_HTML.jpg](img/480430_1_En_3_Fig15_HTML.jpg)\n\
  \n图 3-15\n\n人工神经网络回归结果，以回归图和散点图形式展示\n\n#### 回归模型比较\n\n为了比较前面讨论的不同机器学习模型的结果，我们比较了\
  \ RMSE 分数来评估它们的性能。基于测试数据集的结果，随机森林和 XGBoost 回归算法似乎是表现最好的（见表 3-1）。然而，我们想重申的是，这些结果是基于这些算法最简单的实现，并且没有调整任何参数。每种算法的微调模型所显示的精度与本摘要中显示的不同。然而，这一分析确立了随机森林和\
  \ XGBoost 算法在快速构建回归问题原型方面的有效性。\n\n表 3-1\n\n回归模型与 RMSE 分数\n\n| 回归模型 | RMSE |\n| ---\
  \ | --- |\n| 多元线性回归 | 495.16 |\n| 支持向量回归 | 335.51 |\n| 决策树 | 187.34 |\n| 随机森林 |\
  \ 121.42 |\n| XGBoost | 121.87 |\n| 人工神经网络 | 226.34 |\n\n### 分类\n\n分类是监督学习的一个子类别，其中输出变量是离散的或分类的。对于本章讨论的示例，LITHOTYPE\
  \ 是唯一的分类变量，因此被用作输出变量。分类算法的目标是找到函数 *f*，该函数能够映射特征以准确预测不同的岩性类别。\n\n![$$ LITHOTYPE=f\\\
  Big( BVW, CARB\\_ FLAG, COAL\\_ FLAG, PHIF, RHOFL, RHOMA, RW, $$](img/480430_1_En_3_Chapter_TeX_Equb.png)\n\
  \n![$$ SAND\\_ FLAG, SW, TEMP, VSH, KLOGH\\Big). $$](img/480430_1_En_3_Chapter_TeX_Equ11.png)\n\
  \n(3.11)\n\n对于本章使用的岩石物理数据集，数据中存在多个岩性类别，如图 3-16 所示。\n\n![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig16_HTML.jpg](img/480430_1_En_3_Fig16_HTML.jpg)\n\
  \n图 3-16\n\n输出变量中可用的不同岩性类别\n\n为简单起见，只保留至少包含 250 个数据点的类别，其余的被过滤掉。从图 3-16 中可以看出，频率最高的类别是“其他”，它不传递任何有用信息，因此也被丢弃。\n\
  \n图 3-17 显示了分类模型中使用的三个主要类别。一个只有两个类别的分类输出变量是二分类问题。然而，在我们使用的数据集中，输出变量有超过两个类别。因此，在本示例中，我们解决的是一个*多类别*分类问题。\n\
  \n![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig17_HTML.jpg](img/480430_1_En_3_Fig17_HTML.jpg)\n\
  \n图 3-17\n\nLITHOTYPE 分类输出变量中的三个主要类别\n\n\n\n#### 多项逻辑回归\n\n逻辑回归是一种分类技术，用于解决二分类问题。二分类相当简单：如果一个样本不属于某一类，则它必然属于另一类。逻辑回归使用\
  \ Sigmoid 函数（见图 3-21）。该函数在输入值发生微小变化时，其输出值会从 0 急剧变化到 1。Sigmoid 函数的这一特性有助于对属于两个不同类别的样本数据进行分类。对于涉及两个以上类别的分类问题，*多项逻辑回归*是基本的多类分类算法之一。该算法使用*softmax*函数，其表达式如下：\n\
  \n![$$ {f}_{softmax}\\left({z}^i\\right)=\\frac{e^{z_i}}{\\sum \\limits_{j=1}^k{e}^{z_j}},\
  \ $$](img/480430_1_En_3_Chapter_TeX_Equ12.png)\n\n(3.12)\n\n其中，*k* 是多类分类问题中的类别数量，*i*\
  \ 是当前针对输入 *z*^(*i*) 计算 softmax 函数的类别。Softmax 函数也会从 0 到 1 发生非常迅速的变化，但它具备处理多个类别的能力。简单来说，softmax\
  \ 函数提供了样本属于 *k* 个类别中任一类的概率。多项逻辑回归也称为*softmax 回归*。以下代码片段展示了使用该算法进行多类分类的示例实现。\n\n\
  ```\nfrom sklearn.linear_model import LogisticRegression\nclf_logreg = LogisticRegression()\n\
  clf_logreg.fit(X_train, y_train)\n# 对测试数据进行预测\ny_pred_logreg = clf_logreg.predict(X_test)\n\
  # 准确率指标\nclf_metrics(y_test, y_pred_logreg)\n```\n\n**结果**\n\n```\nClassification\
  \ Accuracy Score: 0.6480938416422287\nClassification Report:\nprecision    recall\
  \  f1-score   support\nF-MOUTHBAR       0.40      0.05      0.08        87\nF-TIDAL\
  \ BAR       0.53      0.86      0.66       119\nF-TIDAL CHANNEL       0.82     \
  \ 0.85      0.84       135\naccuracy                           0.65       341\n\
  macro avg       0.59      0.58      0.53       341\nweighted avg       0.61    \
  \  0.65      0.58       341\n```\n\n分类准确率的结果以分类报告的形式呈现，其中精确率、召回率和 F1 分数作为分类器预测能力的量化指标。该算法对\
  \ F-TIDAL CHANNEL 类别的预测精确率较高，但对样本数量较少的类别预测精确率不佳。\n\n需要注意的是，当数据集中某个类别的样本数量远多于其他类别时，某些分类器的表现可能不佳。在*样本不平衡*的情况下，对训练数据进行重采样以使各类别样本数量相等，可能有助于提高分类算法的精确率和准确率。\n\
  \n#### 支持向量分类器\n\n之前，我们讨论了支持向量和核技巧。*支持向量分类器*使用了类似的概念。为了执行分类，该算法构建了最优超平面，以分离属于不同类别的样本。其二维等效表示可以看作是一条划分属于两个不同类别的点簇的直线。该算法使用一个正则化参数，该参数决定了分隔超平面的间隔（回顾\
  \ *ϵ*）。结果表明，该算法无法有效识别样本数量较少的类别。\n\n```\nfrom sklearn.svm import SVC\nclf_svc = SVC()\n\
  clf_svc.fit(X_train, y_train)\n# 对测试数据进行预测\ny_pred_svc = clf_svc.predict(X_test)\n\
  # 准确率指标\nclf_metrics(y_test, y_pred_svc)\n```\n\n**结果**\n\n```\nClassification Accuracy\
  \ Score: 0.6217008797653959\nClassification Report:\nprecision    recall  f1-score\
  \   support\nF-MOUTHBAR       0.00      0.00      0.00        87\nF-TIDAL BAR  \
  \     0.50      0.87      0.64       119\nF-TIDAL CHANNEL       0.80      0.81 \
  \     0.80       135\naccuracy                           0.62       341\nmacro avg\
  \       0.43      0.56      0.48       341\nweighted avg       0.49      0.62  \
  \    0.54       341\n```\n\n#### 决策树分类器\n\n决策树分类器算法采用的方法与之前讨论的决策树回归类似。在回归算法中，预测是通过对样本所属的终端叶节点中的值取平均来生成的。而在分类问题中，属于某个终端树节点的所有样本都被归类为其中一个类别。\n\
  \n在模型训练过程中，该算法试图最小化熵（随机性）并最大化信息增益。一个经过充分训练且无随机性的树，其任何给定终端叶节点中的所有样本都只属于一个样本类别。结果表明，尽管存在样本不平衡问题，该算法在不同岩性类别上仍能提供高精确率和准确率。\n\
  \n```\nfrom sklearn.tree import DecisionTreeClassifier\nclf_dt = DecisionTreeClassifier()\n\
  clf_dt.fit(X_train, y_train)\n# 对测试数据进行预测\ny_pred_dt = clf_dt.predict(X_test)\n\
  # 准确率指标\nclf_metrics(y_test, y_pred_dt)\n```\n\n**结果**\n\n```\nClassification Accuracy\
  \ Score: 0.9853372434017595\nClassification Report :\nprecision    recall  f1-score\
  \   support\nF-MOUTHBAR       0.98      0.98      0.98        87\nF-TIDAL BAR  \
  \     0.99      0.97      0.98       119\nF-TIDAL CHANNEL       0.99      1.00 \
  \     0.99       135\naccuracy                           0.99       341\nmacro avg\
  \       0.98      0.98      0.98       341\nweighted avg       0.99      0.99  \
  \    0.99       341\n```\n\n#### 随机森林分类器\n\n随机森林分类器的工作原理与我们之前讨论的随机森林回归完全相同。唯一的区别在于，在分类算法中，会生长出一片由决策树分类器组成的森林，最终的预测是基于*投票*而非取平均值来生成的。\n\
  \n在投票方法中，集成预测中出现频率最高的类别被选为最终输出。该算法还提供了预测样本属于任一类别概率的灵活性。选择这两种输出方法中的哪一种取决于具体问题。示例代码实现和分类结果表明，该算法提供的预测具有高精确率和准确率。\n\
  \n```\nfrom sklearn.ensemble import RandomForestClassifier\nclf_rf = RandomForestClassifier()\n\
  clf_rf.fit(X_train, y_train)\n# 对测试数据进行预测\ny_pred_rf = clf_rf.predict(X_test)\n\
  # 准确率指标\nclf_metrics(y_test, y_pred_rf)\n```\n\n**结果**\n\n```\nClassification Accuracy\
  \ Score: 0.9882697947214076\nClassification Report:\nprecision    recall  f1-score\
  \   support\nF-MOUTHBAR       0.99      0.98      0.98        87\nF-TIDAL BAR  \
  \     0.99      0.98      0.99       119\nF-TIDAL CHANNEL       0.99      1.00 \
  \     0.99       135\naccuracy                           0.99       341\nmacro avg\
  \       0.99      0.99      0.99       341\nweighted avg       0.99      0.99  \
  \    0.99       341\n```\n\n\n\n#### *k*-近邻算法 (*k*-NN)\n\n*k*-近邻算法 (*k*-NN) 是一种基于相似度度量（例如，距离函数，如两个样本之间的欧几里得距离，或二元向量之间的汉明距离）的非参数算法。该算法利用相似度度量在样本数据中寻找\
  \ *k* 个最近的邻近点，并根据这 *k* 个邻居中出现频率最高的类别来预测输出类别。\n\n该算法的输入参数之一是在未知类别样本点附近搜索的邻居数量。该算法的示例实现和结果展示了其合理的性能。然而，其表现不如之前讨论的基于树的算法。\n\
  \n```\nfrom sklearn.neighbors import KNeighborsClassifier\nclf_knn = KNeighborsClassifier()\n\
  clf_knn.fit(X_train, y_train)\n# 对测试数据进行预测\ny_pred_knn = clf_knn.predict(X_test)\n\
  # 准确率指标\nclf_metrics(y_test, y_pred_knn)\n```\n\n**结果**\n\n```\nClassification Accuracy\
  \ Score: 0.8592375366568915\nClassification Report:\nprecision    recall  f1-score\
  \   support\nF-MOUTHBAR       0.83      0.75      0.79        87\nF-TIDAL BAR  \
  \     0.86      0.85      0.86       119\nF-TIDAL CHANNEL       0.87      0.94 \
  \     0.90       135\naccuracy                           0.86       341\nmacro avg\
  \       0.86      0.85      0.85       341\nweighted avg       0.86      0.86  \
  \    0.86       341\n```\n\n#### 高斯朴素贝叶斯分类\n\n高斯朴素贝叶斯算法基于**贝叶斯定理**，并假设多个输入特征独立地对样本属于特定类别的概率做出贡献。该算法假设与每个类别相关的连续特征服从高斯分布或正态分布。\n\
  \n通过使用最大似然原理，该算法可以预测样本点属于特定类别的概率。该算法也属于基础分类算法的范畴，但其性能优于其他基础分类算法，例如多项逻辑回归。以下代码片段展示了该算法的示例实现和分类结果。\n\
  \n```\nfrom sklearn.naive_bayes import GaussianNB\nclf_gnb = GaussianNB()\nclf_gnb.fit(X_train,\
  \ y_train)\n# 对测试数据进行预测\ny_pred_gnb = clf_gnb.predict(X_test)\n# 准确率指标\nclf_metrics(y_test,\
  \ y_pred_gnb)\n```\n\n**结果**\n\n```\nClassification Accuracy Score: 0.6099706744868035\n\
  Classification Report:\nprecision    recall  f1-score   support\nF-MOUTHBAR    \
  \   0.40      0.54      0.46        87\nF-TIDAL BAR       0.61      0.34      0.44\
  \       119\nF-TIDAL CHANNEL       0.77      0.89      0.82       135\naccuracy\
  \                           0.61       341\nmacro avg       0.59      0.59     \
  \ 0.57       341\nweighted avg       0.62      0.61      0.60       341\n```\n\n\
  #### 线性判别分析\n\n线性判别分析（LDA）同样基于输入特征服从高斯分布的假设。此外，该算法假设每个特征具有相同的方差。在该算法中，输入特征被转换，使得两个不同类别的输入特征值之间的重叠最小化。这是通过执行转换来实现的，该转换最大化样本中任意两个不同类别的特征统计均值之间的距离。该算法提供了样本点属于特定类别的概率。\n\
  \nLDA 是一种简单的算法，对于小型数据集可以表现合理。然而，如果训练数据包含统计均值重叠的输入特征，则该算法无法区分属于不同类别的样本。以下代码片段和结果展示了\
  \ LDA 在多类分类问题上相比其他基础算法（即高斯朴素贝叶斯和多项逻辑分类器）具有更好的性能。\n\n```\nfrom sklearn.discriminant_analysis\
  \ import LinearDiscriminantAnalysis\nclf_lda = LinearDiscriminantAnalysis()\nclf_lda.fit(X_train,\
  \ y_train)\n# 对测试数据进行预测\ny_pred_lda = clf_lda.predict(X_test)\n# 准确率指标\nclf_metrics(y_test,\
  \ y_pred_lda)\n```\n\n**结果**\n\n```\nClassification Accuracy Score: 0.7800586510263929\n\
  Classification Report :\nprecision    recall  f1-score   support\nF-MOUTHBAR   \
  \    0.73      0.56      0.64        87\nF-TIDAL BAR       0.71      0.82      0.76\
  \       119\nF-TIDAL CHANNEL       0.87      0.89      0.88       135\naccuracy\
  \                           0.78       341\nmacro avg       0.77      0.76     \
  \ 0.76       341\nweighted avg       0.78      0.78      0.78       341\n```\n\n\
  #### 分类模型比较\n\n对于本节中构建的分类模型，我们使用 F1 分数作为指标来比较它们的性能。基于测试数据集的结果，决策树和随机森林分类器是性能最好的分类模型，如表\
  \ 3-2 所示。对这些模型进行进一步调优预计会改变这些准确率结果。\n\n表 3-2\n\n分类模型与 F1 分数\n\n| 分类模型 | F1 分数 |\n\
  | --- | --- |\n| 多项逻辑回归 | 0.648 |\n| 支持向量分类器 | 0.621 |\n| 决策树分类器 | 0.985 |\n| 随机森林分类器\
  \ | 0.988 |\n| *k*-NN | 0.859 |\n| 高斯朴素贝叶斯 | 0.609 |\n| 线性判别分析 | 0.780 |\n\n## 无监督学习\n\
  \n到目前为止，我们讨论了与监督学习相关的问题，其中机器学习算法试图将训练数据中的输入特征映射到相应的输出变量。在无监督学习问题中，没有需要映射到输入特征的关联输出变量。相反，无监督机器学习算法通过寻找训练数据中隐藏的关系和/或模式来工作。无监督学习问题的两大类别包括聚类和降维。我们将讨论这两类算法并展示示例实现。\n\
  \n### 聚类\n\n在这类无监督学习中，算法试图在样本数据中找到具有相似特征的簇。当样本总体中存在相对不同的群体时，聚类算法在样本数据上效果非常好。一旦聚类算法训练完成，任何新的观测值都会被预测属于该算法基于原始样本数据识别出的某个簇。\n\
  \n\n\n#### K-Means 聚类\n\nK-Means 聚类算法用于将包含 *n* 个观测值的数据集划分为以质心为中心的 *k* 个不同簇。训练数据中的每个观测值都属于一个特定的簇。一个簇或聚合的点群具有某些嵌入其中的相似特征。对于本章使用的岩石物理数据集，找到生成肘部图所需的簇数非常重要，如图\
  \ 3-18 所示。肘部图展示了*惯性*（各点到其簇质心的距离平方和）随簇数变化的情况。\n\n![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig18_HTML.jpg](img/480430_1_En_3_Fig18_HTML.jpg)\n\
  \n图 3-18\n\n基于惯性值指示最佳簇数的肘部图\n\n观察肘部图，当 *k* = 3 个簇时，存在一个明显的拐点或肘部。使用该数据集的最佳簇数 *k*\
  \ = 3，在 KLOGH 和 PHIF (V/V) 之间生成的散点图显示了三个不同簇之间的清晰边界（见图 3-19）。从物理意义上讲，这些簇可能描绘了地下岩石的逻辑分组，类似于相或岩性类型。\n\
  \n![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig19_HTML.jpg](img/480430_1_En_3_Fig19_HTML.jpg)\n\
  \n图 3-19\n\nKLOGH 与 PHIF 之间的散点图，显示了使用 K-Means 聚类算法生成的不同簇之间的边界\n\n```\nimport sklearn.cluster\
  \ as cluster\nimport seaborn as sns\nkm3 = cluster.KMeans(n_clusters=3, init='k-means++',\
  \ max_iter=300, n_init=10, random_state=42).fit(X)\nX['Labels'] = km3.labels_\n\
  X['Labels'].value_counts()\nsns.scatterplot(X['PHIF (V/V)'], X['KLOGH (MD)'], hue=X['Labels'],\
  \ palette=sns.color_palette('hls', X['Labels'].nunique()))\nplt.title('KMeans with\
  \ 3 Clusters')\n```\n\n### 降维\n\n降维是一个抽象概念，对于分析具有极多特征的数据集非常有用。执行降维通常是为了为机器学习算法获得更好的输入特征。它在不显著牺牲模型预测能力的情况下提高了计算效率。降维还消除了原始数据中不同特征之间可能存在的共线性。主成分分析就是此类算法中的一种。\n\
  \n#### 主成分分析\n\n*主成分分析*（PCA）利用特征的正交变换，提供了一种统计方法，通过将多个线性相关的特征转换为线性无关的变量来减少输入数据的维度。这些线性无关的变量被称为*主成分*，它们彼此正交。\n\
  \n第一个主成分解释了数据集中的最大方差，随后的每个主成分解释的方差依次递减。这种方法有一个注意事项：主成分通常不如原始特征易于解释。需要注意的是，PCA 对缩放敏感，因此使用本章前面讨论的方法对特征进行缩放非常重要。\n\
  \n使用本章前面使用的相同数据集，以下实现表明前四个主成分可以解释大约 86% 的样本方差。\n\n```\nfrom sklearn.decomposition\
  \ import PCA\npca = PCA()\nX_train = pca.fit_transform(X_train)\nX_test = pca.transform(X_test)\n\
  explained_variance = pca.explained_variance_ratio_\nprint(explained_variance)\n\
  ```\n\n**结果**\n\n```\nExplained Variance\n[4.32302153e-01 2.49297862e-01 1.06117586e-01\
  \ 7.90285832e-02\n4.83399458e-02 3.41638092e-02 2.32342217e-02 1.67907297e-02\n\
  6.98516043e-03 2.81954933e-03 9.13677877e-04 6.64565466e-06\n7.64286168e-08]\n```\n\
  \n计算主成分后，我们使用随机森林分类来了解在 PCA 之后减少输入特征数量如何影响机器学习模型的准确性。在这里，我们比较了使用全部 12 个特征的预测准确性与使用前四个主成分生成的预测准确性。从以下代码实现结果来看，将输入特征数量减少到前四个主成分并不会显著降低预测准确性。\n\
  \n```\n# Random Forest with entire data\nclassifier = RandomForestClassifier(random_state=42)\n\
  classifier.fit(X_train, y_train)\n# Predicting the Test set results\ny_pred = classifier.predict(X_test)\n\
  print(confusion_matrix(y_test, y_pred))\nprint(accuracy_score(y_test, y_pred))\n\
  Accuracy with all features: 0.9377289377289377\n# Random Forest with only 4 components\n\
  classifier_4comp = RandomForestClassifier(random_state=42)\nclassifier_4comp.fit(X_train_4comp,\
  \ y_train)\n# Predicting the Test set results\ny_pred_4comp= classifier_4comp.predict(X_test_4comp)\n\
  print(confusion_matrix(y_test, y_pred_4comp))\nprint(accuracy_score(y_test, y_pred_4comp))\n\
  Accuracy with only first 4 principal components: 0.8974358974358975\n```\n\n## 深度学习\n\
  \n我们已经讨论了用于解决分类、回归、降维和聚类相关问题的有监督和无监督机器学习算法。在讨论回归算法时，我们简要提到了人工神经网络。神经计算是深度学习算法的核心。深度学习算法试图创建深度层次模型，这些模型可以执行复杂任务，例如区分不同物体、理解人类语音或基于多个输入图像创作新画作。\n\
  \n在本节中，我们将讨论以下深度学习算法。\n\n*   多层感知器（MLP）\n\n*   卷积神经网络（CNN）\n\n*   循环神经网络（RNN）\n\n\
  *   长短期记忆网络（LSTM）\n\n\n\n### 多层感知机 (MLP)\n\n多层感知机（MLP）是最基础的深度学习算法。神经元是深度神经网络（包括\
  \ MLP）的基本构建模块。图 3-20 展示了一个神经元的示意图。神经元通过使用与输入相关联的权重计算输入值的加权和，然后对加权和施加一个非线性的*激活函数*（*f*）。神经元执行的这种非线性变换赋予了\
  \ MLP 和其他深度神经网络对高度非线性过程进行建模的能力，这些过程出现在许多自然现象和工业问题中。神经元也被称为*神经网络节点*。\n\n![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig20_HTML.jpg](img/480430_1_En_3_Fig20_HTML.jpg)\n\
  \n图 3-20\n\n人工神经网络中神经元计算的示意图\n\n神经元可以使用多种激活函数来执行非线性变换。Sigmoid 函数和双曲正切函数是经典使用的激活函数。一些更先进的激活函数包括*线性整流单元*（ReLU）、带泄露的\
  \ ReLU 和指数线性单元。图 3-21 展示了这些传统和现代非线性激活函数 [11] 的函数形式和形状对比。这些函数易于求导（连续且可微）。这一特性使得这些函数在梯度计算过程中计算效率很高，而梯度计算是训练深度神经网络的重要部分。\n\
  \n![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig21_HTML.jpg](img/480430_1_En_3_Fig21_HTML.jpg)\n\
  \n图 3-21\n\n传统与现代激活函数对比 [11]\n\n图 3-22 展示了一个 MLP 的示意图。这种深度神经网络由以下组件构成。\n\n![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig22_HTML.jpg](img/480430_1_En_3_Fig22_HTML.jpg)\n\
  \n图 3-22\n\n多层感知机的示意图\n\n*   **输入层：** 该层包含节点，这些节点便于将输入特征引入神经网络，并应用非线性变换。\n\n*  \
  \ **隐藏层：** 这些层包含具有非线性激活函数的神经元或节点。隐藏层由一个权重矩阵（*W*）和一个偏置向量（*b*）表示。矩阵 *W* 和向量 *b* 的维度取决于该层中节点的数量。例如，连接\
  \ *m* 个输入（特征矩阵 *X*）并将值广播到第一个隐藏层中 *n* 个节点的输入层，其权重矩阵的维度为 *m* × *n*。同时，偏置向量 *b* 有 *n*\
  \ 个元素。该层的输出是 *f* (*WX* + *b*)，其中 *f* 是激活函数。\n\n*   **输出层：** 输出层与最后一个隐藏层连接，并确保神经网络的输出与问题定义一致。例如，如果神经网络正在被训练用于对具有\
  \ *k* 个不同类别的数据集进行分类，输出层会计算 *k* 个不同的值，然后对每个 *k* 值应用 softmax 函数。在所描述的场景中，输出中的每个元素对应样本属于\
  \ *k* 个类别中某一个的概率。\n\n*   **优化器：** 优化器通过使用误差反向传播来促进神经网络各层权重矩阵 *W* 和偏置向量 *b* 的更新。\n\
  \n优化器使用损失函数来评估预测值的准确性。在回归问题中，这个损失函数可以是 RMSE。然而，在分类问题中，可能需要一个相对复杂的损失函数。在分类问题中，输出层提供\
  \ *k* 个概率值（*y*）。如果一个对象只属于其中一个对象类别（这是大多数现实世界分类任务的情况），那么为了实现分类器的最佳性能，这 *k* 个值中应该有一个接近\
  \ 1。标签被进行独热编码，以将类别标签转换为概率。例如，在一个 *k*=3 类的问题中，类别 1、2 和 3 分别表示为独热向量（*p*）[1, 0, 0]、[0,\
  \ 1, 0] 和 [0, 0, 1]。像分类交叉熵这样的损失函数会使用这些值来提供误差的定量估计，这对于迭代更新神经网络模型参数（即权重和偏置）非常有用。通过使用输出向量（*y*）和独热编码标签向量（*p*），可以使用以下公式计算分类交叉熵。\n\
  \n![$$ crossentropy=\\sum \\limits_{i=1}^k-{p}_i\\log \\left({y}_i\\right). $$](img/480430_1_En_3_Chapter_TeX_Equ13.png)\n\
  \n(3.13)\n\n接下来，我们将这些概念应用于对图 3-23 所示数据集中的图像进行分类。\n\n![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig23_HTML.jpg](img/480430_1_En_3_Fig23_HTML.jpg)\n\
  \n图 3-23\n\n来自 SFO（盐体/断层/其他）数据集的一些样本图像\n\n机器学习社区中有一些标准的图像数据集，通常用于评估分类模型。这些数据集包括手写数字集合（MNIST）、日常生活中遇到的物体集合（CIFAR10）等等。在本章中，我们使用公共领域和\
  \ Kaggle 上可用的地震勘测数据创建了一个数据集。该数据集（昵称为 *SFO 数据集*）包含 1,500 张属于三个类别（盐体、断层和其他）的地震图像。我们使用\
  \ MLP 对该数据集中的图像进行分类。以下代码片段展示了使用 TensorFlow 库实现 MLP 模型的方法。\n\n```\n# 定义一个深度神经网络模型\n\
  reg_param = 0.02 # L2 正则化的正则化参数\nmodel = Sequential()\nmodel.add(Dense(1024, activation=\"\
  relu\", kernel_initializer=\"he_normal\", kernel_regularizer=l2(l=reg_param),\n\
  input_shape=(n_features,)))\nmodel.add(Dense(512, activation=\"relu\", kernel_initializer=\"\
  he_normal\",\nkernel_regularizer=l2(l=reg_param)))\nmodel.add(Dense(256, activation=\"\
  relu\", kernel_initializer=\"he_normal\",\nkernel_regularizer=l2(l=reg_param)))\n\
  model.add(Dense(128, activation=\"relu\", kernel_initializer=\"he_normal\",\nkernel_regularizer=l2(l=reg_param)))\n\
  model.add(Dense(64, activation=\"relu\", kernel_initializer=\"he_normal\",\nkernel_regularizer=l2(l=reg_param)))\n\
  model.add(Dense(32, activation=\"relu\", kernel_initializer=\"he_normal\",\nkernel_regularizer=l2(l=reg_param)))\n\
  model.add(Dense(16, activation=\"relu\", kernel_initializer=\"he_normal\",\nkernel_regularizer=l2(l=reg_param)))\n\
  model.add(Dense(8, activation=\"relu\", kernel_initializer=\"he_normal\",\nkernel_regularizer=l2(l=reg_param)))\n\
  model.add(Dense(3, activation=\"softmax\"))\n# 编译模型\nmodel.compile(optimizer='Adadelta',\
  \ loss=\"sparse_categorical_crossentropy\", metrics=['accuracy'])\n```\n\n上述神经网络模型的实现包含以下组件。\n\
  \n\n\n*   一个包含 1024 个节点的**密集**输入层。七个隐藏层，节点数分别为 512、256、128、64、32、16 和 8。这些节点被称为**密集**层，是因为这些层中的每个节点都与前一层和后一层的每个节点相连，从而提供了密集连接（见图\
  \ 3-22）。最后，是一个包含三个节点的输出层。所有节点（输出层除外）都使用 ReLU 激活函数。输入层和隐藏层的权重使用`he_normal`初始化器进行初始化。\n\
  \n*   正则化是指在模型训练过程中，当模型参数（权重和偏置）发生较大变化时施加惩罚。它提供了一种防止过拟合的保护措施。惩罚的程度可以通过正则化参数进行调整，该参数通常是一个较小的数值。在所示的\
  \ MLP 模型中，我们使用了 L2 正则化，正则化参数为 0.02。\n\n*   模型中的输出层使用 softmax 激活函数来输出估计的分类概率。\n\n\
  *   该模型使用`Adadelta`优化器，该优化器采用具有自适应学习率的随机梯度下降方法。虽然其他一些优化器需要预定义学习率，但`Adadelta`优化器会自适应地计算学习率。该优化器使用`sparse_categorical_crossentropy`作为损失函数，这是之前讨论的分类交叉熵在每种对象只能属于样本类别中一个类别的情况下的变体。\n\
  \n以下代码片段用于训练上述 MLP 模型。\n\n```\n# 使用验证集进行早停的回调\nearlystop_callback = EarlyStopping(monitor='val_accuracy',\n\
  min_delta=0.0001, patience=50)\n# 保存最佳模型\nckpt_path = './models/dnn.h5'\nckpt_callback\
  \ = ModelCheckpoint(filepath=ckpt_path, mode=\"max\",\nmonitor='val_accuracy', verbose=1,\n\
  save_best_only=True)\n# 训练模型\nhistory = model.fit(X_train, y_train, epochs=500,\
  \ batch_size=BATCH_SIZE, validation_data=(X_valid, y_valid),\ncallbacks=[earlystop_callback,\
  \ ckpt_callback],\nverbose=1)\n```\n\n模型训练过程的重要组件如下。\n\n*   **Epochs（轮次）：** 一个 epoch\
  \ 对应于算法处理一次训练数据中所有样本所需的训练迭代次数。这里的 MLP 模型预计训练 500 个 epoch。\n\n*   **Early-stopping（早停）：**\
  \ 此概念使用验证数据集持续监控训练过程。`min_delta`参数定义了最小验证准确率提升。如果模型准确率在`patience`参数定义的训练轮次数内没有超过`min_delta`的提升，则停止训练。此代码实现会在每次超过之前的最佳验证准确率时保存模型。在训练结束时提供最佳验证准确率的模型可用于后续生成预测。\n\
  \n图 3-24 展示了训练和验证数据集在训练轮次中损失函数的变化。使用该过程训练的 MLP 模型用于对测试数据集生成预测。该模型对盐层、断层和其他类别的预测准确率如下。\n\
  \n```\nTest Accuracy: 0.713\n```\n\n通过优化超参数，模型准确率可以在一定程度上得到提升。\n\n![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig24_HTML.jpg](img/480430_1_En_3_Fig24_HTML.jpg)\n\
  \n图 3-24\n\n学习曲线，展示了多层感知器随轮次变化的训练损失\n\n这个例子向我们展示了 MLP 可以生成一个用于识别图像的模型，其正确率约为 70%。然而，MLP\
  \ 并非专门用于图像识别任务的算法。接下来，我们将讨论一种专门用于图像识别和其他通用计算机视觉应用的深度神经网络架构。\n\n### 卷积神经网络（CNN）\n\
  \n只有在 2D 或 3D 上下文中同时观察图像像素时，才能实现物体的视觉识别。我们使用 MLP 进行图像分类任务。尽管 MLP 的表现比抛硬币要好，但它生成的预测无法用于任何实际应用。这种较低的准确率源于\
  \ MLP 在查看图像时缺乏空间上下文。\n\n卷积神经网络（CNN）是一种专门的神经网络，它通过执行允许在学习过程中包含空间上下文的计算来学习识别物体。CNN\
  \ 是使用卷积层构建的。虽然训练 CNN 的大部分方面与训练 MLP 相似，但神经网络架构存在显著差异。\n\n图 3-25 总结了与 CNN 架构相关的一些重要概念。在\
  \ CNN 的卷积层中，卷积滤波器遍历图像以提取图像特征，这有助于识别给定图像所属的类别。\n\n![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig25_HTML.jpg](img/480430_1_En_3_Fig25_HTML.jpg)\n\
  \n图 3-25\n\n(a) 图像和卷积滤波器，(b) 卷积操作，(c) 步长，(d) 图像周围的零填充，以及 (e) 在卷积层上进行的特征提取的概念性表示\n\
  \n以下是图 3-25 中所示与 CNN 相关的一些重要概念。\n\n*   **Filter（滤波器）：** 一个方形权重矩阵通常代表卷积层中的一个滤波器。CNN\
  \ 训练过程的主要目标之一是学习卷积滤波器的最优权重。\n\n*   **Convolution（卷积）：** 在卷积操作期间，计算图像重叠像素与滤波器之间逐元素乘积的总和。该值被分配给重叠图像块的中心像素（见图\
  \ 3-25-b）。\n\n*   **Stride（步长）：** 滤波器可以一次移动一个像素来遍历图像，或者可以跳过中间的几个像素。滤波器在图像上遍历时一次移动的像素数称为*步长*（见图\
  \ 3-25-c）。\n\n*   **Padding（填充）：** 当滤波器遍历图像时，由于边缘处没有重叠单元，它会减小图像的尺寸。在某些需要保持图像尺寸的场景中，可以在图像边缘填充零（见图\
  \ 3-25-d）。对于大小为*W* × *W*的图像，由大小为*F* × *F*的滤波器以步长*S*遍历，并在图像边缘填充*P*个单元，输出图像的尺寸可通过![$$\
  \ \\left[\\frac{W-K+2P}{S}\\right]+1\\. $$](images/480430_1_En_3_Chapter/480430_1_En_3_Chapter_TeX_IEq3.png)计算。\n\
  \n当图像通过多个卷积层处理时，滤波器会提取出图像中的区分性特征，使得更容易将样本数据中的一个类别与其他类别区分开来（见图[3-25](https://doi.org/10.1007/978-1-4842-6094-4_2Fig#25)-e）。以下代码片段展示了用于对\
  \ SFO 数据集中的图像进行分类的 CNN 模型。\n\n```\nmodel = Sequential()\nmodel.add(Conv2D(96, (5,\
  \ 5), activation=\"relu\",\ninput_shape=(IMG_DIM, IMG_DIM, 1)))\nmodel.add(MaxPooling2D((2,\
  \ 2)))\nmodel.add(Conv2D(128, (5, 5), activation=\"relu\"))\nmodel.add(MaxPooling2D((2,\
  \ 2)))\nmodel.add(Conv2D(128, (5, 5), activation=\"relu\"))\nmodel.add(MaxPooling2D((2,\
  \ 2)))\nmodel.add(Conv2D(64, (5, 5), activation=\"relu\"))\nmodel.add(Flatten())\n\
  model.add(Dense(64, activation=\"relu\"))\nmodel.add(Dense(32, activation=\"relu\"\
  ))\nmodel.add(Dense(3, activation=\"softmax\"))\n```\n\n\n\n代码中的 CNN 模型交替使用了二维卷积层和最大池化层。在最大池化操作中，算法从一组像素中选择最大值来替换现有像素值。所展示的\
  \ CNN 架构包含四个二维卷积层，滤波器大小为 5×5，并使用 ReLU 激活函数。卷积层之后是两个使用 ReLU 激活函数的全连接层，以及一个包含三个节点并使用\
  \ softmax 激活的输出层。该 CNN 采用与之前描述的训练 MLP 相同的机制进行训练。图 3-26 展示了损失函数随训练轮次的变化。该 CNN 模型在识别盐体、断层和其他类别方面表现出较高的预测精度。\n\
  \n```\nTest Accuracy: 0.953\n```\n\n至此，我们结束了关于图像分类任务的深度学习算法概述。接下来，我们将讨论用于时间序列预测的深度学习算法。\n\
  \n![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig26_HTML.jpg](img/480430_1_En_3_Fig26_HTML.jpg)\n\
  \n图 3-26\n\n学习曲线，展示了卷积神经网络随轮次变化的训练损失\n\n### 循环神经网络（RNN）\n\n循环神经网络（RNN）提供了一种专门的架构，可以对序列（包括时间序列数据）进行建模。图\
  \ 3-27 展示了 RNN 架构的示意图。\n\n![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig27_HTML.jpg](img/480430_1_En_3_Fig27_HTML.jpg)\n\
  \n图 3-27\n\nRNN 架构的示意图\n\nRNN 是一系列基础神经网络模型，其中每个模型都从序列中单个步骤的输入和输出中学习。如果我们将这个序列中的模型折叠成一个单一的模型，该模型将其输出作为输入，并不断更新模型参数，我们就得到了如图\
  \ 3-27（最右侧）所示的 RNN 架构。\n\n然而，这种学习模型参数（权重和偏置）的方法存在稳定性问题。有时，由于误差梯度较大，模型权重从序列中的一个步骤到下一个步骤的变化可能过大。梯度在序列的多个步骤中累积可能导致权重更新过大，从而使得数值超出计算机能处理的数值范围。这被称为*梯度爆炸*问题。\n\
  \n另一方面，如果误差梯度在序列的多个步骤中过小，累积这些梯度可能导致值接近于零。在这种情况下，模型停止更新权重，无法学习。这被称为*梯度消失*问题。\n\n\
  存在专门解决梯度爆炸和梯度消失问题的架构。在讨论其中一种专门算法之前，我们先看看用于构建时间序列预测模型的时间序列数据。\n\n图 3-28 展示了由 Equinor（[`https://data.equinor.com`](https://data.equinor.com)）提供的\
  \ Volve 数据集中两口井的日产量（左图）和累计产量（右图）数据。我们将使用这些数据，根据最近几周的产量数据来生成次日产量预测。\n\n![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig28_HTML.jpg](img/480430_1_En_3_Fig28_HTML.jpg)\n\
  \n图 3-28\n\n图表展示了从 Volve 数据集中选取的两口井的日产油量（左图）和累计产油量（右图）数据\n\n#### 长短期记忆网络（LSTM）\n\
  \n我们讨论了在训练 RNN 模型时遇到的梯度爆炸和梯度消失问题。长短期记忆网络（LSTM）是一种通过控制信息从序列中的一个步骤流向下一个步骤来解决这些问题的架构。LSTM\
  \ 模型被表示为一个带有信息流调节*门*的单元（见图 3-29）。LSTM 模型中的单元状态变量保留了序列（或正在建模的时间序列）的长期记忆。这些门包括以下内容。\n\
  \n![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig29_HTML.jpg](img/480430_1_En_3_Fig29_HTML.jpg)\n\
  \n图 3-29\n\n长短期记忆网络（LSTM）单元架构示意图\n\n*   **遗忘门：** 该门根据单元输入和序列前一步的输出（隐藏状态）的组合来收集学习到的信息。然后，使用\
  \ sigmoid 函数决定应该丢弃多少信息。sigmoid 函数提供 0 到 1 之间的值，其中 1 表示保留所有信息，0 表示丢弃所有信息。\n\n*  \
  \ **输入门：** 该门也使用单元输入和前一步的输出。输入门使用 sigmoid 函数来学习应该保留多少信息用于更新单元状态。相同的输入会通过*tanh*激活函数。输入门提供\
  \ 0 到 1 之间的值，而*tanh*提供-1 到 1 之间的值。这两者的组合用于更新单元状态。\n\n*   **输出门：** 输出门使用的输入与前两个门类似。它使用\
  \ sigmoid 函数学习计算模型输出所需的信息量。应用于单元状态（序列的长期记忆）的*tanh*激活函数与从输出门接收到的值的组合，提供了单元的输出。\n\n\
  以下代码片段展示了使用 TensorFlow 实现 LSTM 架构的示例。使用过去 14 天的累计产量数据来预测次日的累计产量。该实现包含两个堆叠的 LSTM\
  \ 层，之后是一个全连接层，以及一个具有单个节点（一个输出变量）的输出层。我们使用`Adadelta`优化器，并最小化均方误差（MSE）指标来训练 LSTM 模型。该实现还使用了基于验证数据的早停法（此处未显示）。\n\
  \n```\nmodel = Sequential()\nmodel.add(LSTM(NUM_HIDDEN, activation=\"relu\", return_sequences=True,\
  \ input_shape=(LOOKBACK, 1)))\nmodel.add(LSTM(NUM_HIDDEN, activation=\"relu\", return_sequences=False))\n\
  model.add(Dense(NUM_HIDDEN))\nmodel.add(Dense(1))\nmodel.compile(optimizer='Adadelta',\
  \ loss=\"mse\")\n```\n\n图 3-30（左图）展示了观测到的测试数据的归一化累计产量，以及 LSTM 模型预测的累计产量。图 3-30（右图）展示了观测到的测试数据与\
  \ LSTM 对测试数据预测值的交叉图。结果表明，尽管在油井生产初期存在一些不匹配，但 LSTM 模型具有良好的预测能力。一个工业相关的实现会输出未来多天的产量——我们鼓励您使用提供的代码来实现这一点。\n\
  \n![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig30_HTML.jpg](img/480430_1_En_3_Fig30_HTML.jpg)\n\
  \n图 3-30\n\n图表展示了测试数据及对应的 LSTM 模型对累计产油量的预测（左图），以及观测到的测试数据与 LSTM 预测的累计产油量的交叉图（右图）\n\
  \n## 超参数优化\n\n我们之前提到，超参数优化有助于提高模型精度。在本节中，我们将演示一个优化过程的简单代码示例。但在深入实现细节之前，让我们先了解超参数的定义。\n\
  \n\n\n### 什么是超参数？\n\n超参数是在机器学习算法训练过程中用于学习最佳模型参数的变量。换句话说，超参数是帮助学习最优模型参数的参数。以下是一些超参数的示例：\n\
  \n*   神经网络中的层数\n*   神经网络层中的节点数\n*   神经网络节点的激活函数类型\n*   模型训练的迭代次数或轮数（epochs）\n* \
  \  基于核的方法中“核”类型的选择\n*   正则化参数\n*   神经网络权重初始化的类型\n*   提前停止的容差（`min_delta`）\n*   提前停止前等待的轮数（`patience`）\n\
  \n尽管这种方法的名称暗示它仅适用于优化超参数，但在某些场景下，它也可以调整模型参数。我们通过一个代码示例来演示这一点。\n\n#### 使用 Hyperopt\
  \ 进行超参数优化\n\n我们使用 Hyperopt（一个 Python 库）来演示超参数优化过程。我们使用支持向量分类器算法来演示该过程。我们使用了岩性分类数据，并构建了一个基础分类器。该基础分类器的准确率将作为基准，用于评估超参数优化过程带来的模型性能提升。以下代码片段展示了基础分类器的实现及其对应的分类准确率。\n\
  \n```\nsvc = SVC()\nsvc.fit(X_train, y_train)\n# 对测试数据进行预测\ny_pred = svc.predict(X_test)\n\
  # 准确率指标\nclf_metrics(y_test, y_pred)\n分类准确率得分：0.8621700879765396\n```\n\nHyperopt\
  \ 使用一个目标函数，通过最小化该函数来计算模型参数和超参数的最优值。在以下示例中，使用 k 折交叉验证的准确率得分乘以 -1 作为目标函数。通过 50 次迭代中反复调整超参数和模型参数来最小化目标函数。实现中的一些重要方面包括：\n\
  \n*   **K 折交叉验证：** 在此方法中，训练数据被分成 *k* 个子集或折。利用这些 k 折，训练 *k* 个独立的模型。每个模型在训练时，每次保留其中一折用于验证（验证折），并使用剩余的\
  \ k-1 折来训练模型。k 折交叉验证的准确率得分是通过计算各个模型在各自验证折数据上的准确率得分的平均值得到的。\n\n*   **参数空间：** 定义了模型参数和与模型相关的超参数可以取值的范围。\n\
  \n*   **超参数：** 在此示例中，核的类型是一个超参数。常数 *C*、多项式次数和 gamma 是模型参数。这是一个同时优化超参数和模型参数的示例。\n\
  \n以下代码片段展示了为支持向量分类器模型寻找最优核及其对应参数的方法。\n\n```\ndef objective(params):\nsvc = SVC(**params)\n\
  return -1\\. * cross_val_score(svc, X_train, y_train).mean()\nkernels = ['rbf','poly','rbf','sigmoid']\n\
  space = {'C':hp.lognormal('C', 0, 1),\n'kernel':hp.choice('kernel', kernels),\n\
  'degree':hp.choice('degree', range(1, 15)),\n'gamma':hp.uniform('gamma', 1e-2, 1e2)\n\
  }\ntrials = Trials()\nbest_svc = fmin(objective, space, algo=tpe.suggest, max_evals=50,\
  \ trials=trials)\nprint(best_svc)\n{'C': 1751.5444736790396, 'degree': 11, 'gamma':\
  \ 5.899864955354083, 'kernel': 0}\n```\n\n在确定了最佳核类型和模型参数后，使用最佳模型对测试数据进行预测。\n\n```\n\
  svc = SVC(C=best_svc['C'],\nkernel=kernels[best_svc['kernel']],\ndegree=best_svc['degree'],\n\
  gamma=best_svc['gamma'])\nsvc.fit(X_train, y_train)\n# 对测试数据进行预测\ny_pred = svc.predict(X_test)\n\
  # 准确率指标\nclf_metrics(y_test, y_pred)\n分类准确率得分：0.9618768328445748\n```\n\n该示例表明，使用\
  \ Hyperopt 库进行超参数优化，将模型分类准确率从 0.86 提升到了 0.96。通过实现适当的目标函数，类似的过程可以应用于提高任何其他机器学习或深度学习算法的准确率。\n\
  \n## 总结\n\n> *我来这里不是要告诉你结局如何，而是告诉你这一切将如何开始。*\n> \n> ——尼奥，《黑客帝国》[12]\n\n机器学习和深度学习是内容广泛的课题。在本章中，我们试图概述与机器学习和深度学习算法相关的几个概念。我们的重点是使用开源数据集为每种算法提供简单的代码实现。然而，我们承认，掌握这些概念需要进一步学习和持续练习。请参考“延伸阅读”部分推荐的后续步骤。在接下来的章节中，我们将通过应用本章讨论的概念，为石油和天然气行业相关问题构建一些有趣的机器学习应用。\n\
  \n"
- '# 4. 地球物理学与地震数据处理


  在前面的章节中，我们了解了 Python 编程，学习了机器学习和深度学习的概念，并使用 Python 实现了其中一些概念。本章的重点是概述机器学习在地球物理学领域的应用。勘探工作流程的主要目标是利用地震数据处理来构建地球模型，以估算储层属性。这是一个成熟且经过充分研究的问题，在地震成像和储层属性估算科学背后，有数十年的学术和工业研究积累。


  机器学习在勘探地球物理学中的应用历史悠久，几乎与过去几十年机器学习的兴衰同步。其在勘探地球物理学工作流程中的应用非常广泛。详细解释每一个应用超出了本章的范围。本章的方法旨在概述地震成像过程，并详细讨论盐体解释这一具有挑战性的问题。本章将以简要总结其他几个问题以及勘探和解释工作流程的相关文献指引作为结尾。




  ## 地震反射实验


  地震波在地球内部的反射和折射现象，最早是在记录地震产生的地震波的地震仪上观测到的。地震反射实验的基本原理是向地下发射波，并用数千个传感器进行记录。图 4-1 展示了一个用于在海洋环境中采集反射数据的实验示意图。使用爆炸性能源发射波，这些波会从地下的不同界面反射回来。来自关键地层的这些反射波被传感器记录下来。如图中所示，数千个传感器由拖缆拖曳。


  ![../images/480430_1_En_4_Chapter/480430_1_En_4_Fig1_HTML.jpg](img/480430_1_En_4_Fig1_HTML.jpg)


  **图 4-1**


  海洋地震反射实验示意图（来源：美国国家科学基金会）


  图 4-2 展示了一个由地震实验记录的样本记录示例。这种类型的数据记录被称为“炮集记录”，因为它对应于一次爆炸，并记录了由此产生的反射波。对于一个典型的海洋实验，在一个区域内会采集数千个这样的炮集记录。


  ![../images/480430_1_En_4_Chapter/480430_1_En_4_Fig2_HTML.jpg](img/480430_1_En_4_Fig2_HTML.jpg)


  **图 4-2**


  炮集：由单个地震实验捕获的数据（来源：地震成像导论）


  地震处理的目标是利用如图 4-2 所示的传感器数据，生成地下的图像，并估算地球的物理属性。通常，目标是估算穿过地球的压缩波的速度，因为该速度是波长尺度上储层属性的一个替代指标。将这些炮集记录转换为地球图像的过程称为成像。在生成地下图像的过程中，通过一个称为地球模型构建的过程来估算地下属性也至关重要。关于地震采集问题及其各种挑战的概述，请参考文献
  [1]。


  ## 反问题：成像与速度模型构建


  记录 PB 级地震数据的目标是获取地球地下的图像，并估算地下的物理属性。用于模拟地下波传播的最小模型由声波方程给出。存在更复杂的模型用于精确模拟波传播，但这些模型超出了本入门章节的范围。关于基于波动方程的成像及其相关反问题的优秀数学概述，可参考文献
  [2]。


  声波方程的模型可以通过图 4-3 所示的偏微分方程组来定义。


  ![../images/480430_1_En_4_Chapter/480430_1_En_4_Fig3_HTML.jpg](img/480430_1_En_4_Fig3_HTML.jpg)


  **图 4-3**


  声波方程


  在上述方程组中，*u*(x, *t*) 是水听器记录的压力场，*c*(x) 是地下声波（压缩波）的波速，*f*(x[s], *t*) 是上一节所述实验的震源子波。该方程组需结合适当的初始条件和边界条件来求解。


  在数学和地球物理学文献中，这个线性系统被称为正问题，因为它给出了一个物理系统的定义，用于在给定地下波速定义的情况下模拟波场。这是一个经过充分研究且定义明确的问题，拥有数个世纪的学术历史。感兴趣的读者可查阅参考文献
  [3] 及其中的参考文献。


  然而，地震成像的目标是求解上述系统所定义问题的反问题。其目标是找到一个能够解释已记录数据的模型（图 4-4）。与线性问题的正问题不同，反问题是一个强非线性问题，求解起来颇具挑战性。此外，反问题的解是非唯一的。非唯一性意味着可能存在多个模型都能合理地解释已记录的数据。


  ![../images/480430_1_En_4_Chapter/480430_1_En_4_Fig4_HTML.jpg](img/480430_1_En_4_Fig4_HTML.jpg)


  **图 4-4**


  反问题


  图 4-5 展示了构成地震成像学科的两大类问题的比较。成像问题是精确确定反射体的位置，而反演问题是估算一个能够解释地下已记录数据的地下模型（速度和各向异性属性）。


  ![../images/480430_1_En_4_Chapter/480430_1_En_4_Fig5_HTML.jpg](img/480430_1_En_4_Fig5_HTML.jpg)


  **图 4-5**


  成像与反演


  ### 沉积岩的物理性质


  在沉积岩中，压缩波速度变化显著，并且在所有尺度上都能观察到非均质性。图 4-6 显示了来自美国陆上某口井的速度剖面。可以在不同尺度上观察到速度的变化，其变化范围跨越多个数量级——从微米到毫米再到公里。


  ![../images/480430_1_En_4_Chapter/480430_1_En_4_Fig6_HTML.jpg](img/480430_1_En_4_Fig6_HTML.jpg)


  **图 4-6**


  岩石属性的多尺度非均质性（数据来源：TGS）


  为了研究图 4-4 所示方程组中定义的非线性反问题，采用微扰方法来研究地下引起的散射。Born 近似是一种最初用于量子力学中研究扩展体散射的技术。当散射体尺寸相对于波长较小时，该近似被证明是准确的。感兴趣的读者可参考文献
  [2]。


  速度模型可以根据尺度进行分离。一个平滑的宏观模型包含了速度的长尺度分量。通常，这表现为一个平滑的背景。散射体则以平滑背景之上的振荡微扰形式表示，代表了速度的高频分量。这种地下模型仅模拟单次散射。换句话说，这些模型模拟了主要的反射波。对
  Born 近似的详细处理超出了本次地震成像入门讨论的范围。有关详细信息，感兴趣的读者可参考文献 [2]。




  ### 成像与反演


  本节旨在深入探讨速度估算以及地下散射体成像的过程。基于地表记录的数据和平滑的背景速度模型，成像的目标是找到地下的反射率。这是一个线性反演问题，存在多种方法可以对地下的散射体进行成像。


  为了准确识别地下的反射体，拥有精确的速度模型也至关重要。基于地表记录的数据，速度反演的目标是找到一个能够解释地表记录数据的平滑背景速度模型。这比成像问题困难得多，且具有强非线性。在实践中，估算反射体与更新速度模型的过程是在一个迭代循环中完成的，直到满足特定标准。


  用于定位地下反射体的线性反演问题在实践中是近似处理的。其数学细节超出了本成像入门材料的范围。我们计算一个近似逆，这个过程被称为偏移。目前使用的偏移算法有多种，包括基尔霍夫偏移、逆时偏移、波动方程偏移等。其目标是将接收波场向后传播，并将震源波场向前传播，而成像结果就是不同时延值下波场的互相关。得到的零时延值即为图像（图
  4-7）。


  ![../images/480430_1_En_4_Chapter/480430_1_En_4_Fig7_HTML.jpg](img/480430_1_En_4_Fig7_HTML.jpg)


  图 4-7

  偏移概述


  估算地下速度属性的一种常用技术是使用全波形反演方法。这是一种迭代方法，用于匹配在特定频率范围内地表记录的数据。该技术计算速度模型的平滑部分，并且与大多数强非线性优化问题一样，对初始模型的选择非常敏感。由于数据的带限特性，这种方法只能得到平滑解，无法解析所有尺度的结构。参考文献
  [4] 描述了在墨西哥湾构建速度模型所面临的挑战。图 4-8 展示了来自参考文献 [4] 的、在墨西哥湾亚特兰蒂斯油田通过全波形反演获得的速度模型。


  ![../images/480430_1_En_4_Chapter/480430_1_En_4_Fig8_HTML.jpg](img/480430_1_En_4_Fig8_HTML.jpg)


  图 4-8

  由全波形反演导出的速度模型 [4]


  由于数据的带限特性，一个精确的初始模型对于解决这个优化问题至关重要，以避免陷入局部极小值。该优化问题的公式化假设是：观测到的波形与预测波形在最低频率处的差异小于半个波长。然而，地震数据中低频信息的缺失会导致周期跳跃，从而使问题陷入局部极小值而非达到全局极小值。这个问题在诸如墨西哥湾这样的盆地中更难解决，因为其中存在的盐体复杂结构导致了速度对比，使得优化问题极具挑战性（图
  4-9）。


  ![../images/480430_1_En_4_Chapter/480430_1_En_4_Fig9_HTML.jpg](img/480430_1_En_4_Fig9_HTML.jpg)


  图 4-9

  缺乏低频数据带来的挑战


  ### 克服低频挑战


  在过去几年中，地震采集技术取得了快速的技术进步。在过去的二十年里，覆盖范围和方位角（角度）的范围有了显著改善——近方位角采集、宽方位角采集、全方位角采集是过去几十年中一些操作创新的例子。此外，在过去几年中，人们多次尝试拓宽采集的频率范围。低频数据至关重要，因为它有助于避免优化问题陷入局部极小值。因此，在过去几年中，人们进行了多次尝试来获取低频数据。但是，采集技术极其昂贵，并且在大规模实施上可能面临挑战。然而，在无法获得低频数据的情况下，从更好的初始速度开始，并拥有一个*先验*的速度模型结构，有助于加速收敛。


  在构建用于建立结构的速度模型时，盐体解释是一项具有挑战性的任务。盐体解释的最先进方法涉及由训练有素的地质学家和领域专家团队进行人工解释，他们将其地质先验知识施加于反演问题中。然而，鉴于反演问题的迭代性质，解释人员需要在每次成像应用之后挑选盐体的结构。挑选盐体结构的过程是一个耗时的问题，对于构建精确的地震速度模型至关重要。




  ## 基于机器学习的盐体解释


  本节将重点概述地震成像中的监督学习问题。作为示例，我们将详细聚焦于前文所述速度模型构建中的二值分割问题。


  语义分割问题在计算机视觉领域已得到充分研究。其目标是为图像中的每个像素分配一个对象类别。图 4-10 展示了计算机视觉数据集中的示例以及地震图像-掩膜对，以说明问题之间的相似性。左侧面板展示了语义分割数据集中的两个样本。右侧面板则显示了地震图像以及通过对给定输入图像进行语义分割过程获得的掩膜。除了识别图像中的各种对象外，任务还包括描绘对象的边界。


  ![../images/480430_1_En_4_Chapter/480430_1_En_4_Fig10_HTML.jpg](img/480430_1_En_4_Fig10_HTML.jpg)


  **图 4-10**


  语义分割：计算机视觉 vs 地震成像


  从概念上讲，这与速度模型构建工作流程中使用的解释过程相似。给定一幅地震图像，目标是将其中的每个像素分类为盐体或沉积物。这可以构建为一个监督学习问题，类似于计算机视觉中的语义分割问题，其中图像是偏移算法的输出，而标签是一个二值掩膜。


  图 4-10 展示了一个示例，说明了地震成像中语义分割问题的相似性。这是一个更大的三维数据体中的一个切片，代表了偏移后的振幅。标签是从同一区域的 velocity
  模型中提取的。需要注意的重要一点是，这些是连续的振幅，不同于计算机视觉数据集中已量化的图像。此外，从不同偏移体采样的图像具有不同的振幅分布。因此，在将这些图像应用于深度学习算法之前，通常需要进行某种形式的归一化。


  将深度学习算法应用于地震图像有一些重要方面。请注意，这些方面特定于从地震图像中解释盐体的问题。


  1.  **图像尺寸的选择：** 可以使用合适的窗口提取算法来获取图像块用于训练或推理。


  2.  **图像的预处理：** 为了将连续振幅转换为量化级别，我们应用归一化。大多数归一化方法原则上都有效。然而，基于均值和标准差的缩放已被证明是有效的。


