  ## 高斯过程回归


  高斯过程回归是一种监督学习方法，它利用高斯过程来解决回归问题。高斯过程回归具有某些优势，使其对三维空间插值问题颇具吸引力。


  *   该算法具有出色的观测数据插值能力。因此，在已钻井之间的区域估算的属性值非常可靠。

  *   使用高斯过程回归生成的预测是概率性的。因此，可以计算置信区间，并对估算值提供不确定性估计。此功能已在 scikit-learn 库中实现。这对于地质建模非常重要，因为不确定性量化是三维属性建模中一个非常重要的方面。

  *   高斯过程回归使用了核技巧。核函数将问题输入投影到高维空间，使得高度非线性的回归问题变为线性或近似线性。这使得解决具有挑战性的非线性回归问题更加高效。


  然而，与其他任何算法一样，高斯过程回归也存在一些缺点。其中一些缺点包括：


  *   模型训练需要全部的样本信息。这使得它不适合在非常大的数据集上进行训练。然而，地质建模是一个地球科学家必须处理数据匮乏问题的领域。因此，在大多数情况下，这并不会构成严峻的挑战。

  *   如果输入特征中的变量数量有限（大约几十个），高斯过程回归效果良好。当我们转向更高维的输入特征时，该方法会失去效率。这也不是一个重大问题，因为对于空间三维插值，输入特征主要由
  *x*、*y* 和 *z*（或变换后的 *u*、*v* 和 *w*）坐标组成。

  *   该方法不适用于外推。当我们远离样本数据时，估算值趋向于样本数据的均值，而估算方差则趋向于样本数据的方差。





  ### 公式表述


  高斯过程（GP）是一个随机变量的集合，其中这些变量的任意有限子集都服从多元正态分布。如果我们有一个服从高斯（即正态）分布的单一随机变量，并将其绘制出来，会得到一条钟形曲线。如果我们有两个具有类似分布的随机变量，将它们分别绘制在
  *x* 轴和 *y* 轴上，就会得到一个钟形曲面。这就是包含两个随机变量的多元正态分布。我们可以想象三个满足条件的随机变量，以此类推。


  现在，假设存在一些点 *X*，其观测到的属性值由 *f*(*X*) 或简写为 *f* 给出。此外，基于这些信息，对于一组点 *X*^∗，我们试图估计 *f*(*X*^∗)
  或 *f*^∗。这意味着我们试图计算概率分布 *p*(*f*^∗| *f*)。在零均值的假设下，我们可以将 *f*(*X*) 近似为如下形式 [4]。


  ![$$ f(X)\sim N\left(0,K\left(\theta, X,{X}^{\prime}\right)\right), $$](img/480430_1_En_5_Chapter_TeX_Equ2.png)


  (5.2)


  其中 *N* 表示均值为零的正态分布，*K*(*θ*, *X*, *X*^′) 表示所有观测数据点对 (*X*, *X*^′) 之间的协方差矩阵。该协方差矩阵确保在输入空间中距离相近的点，其输出值也彼此接近。在点
  *X*^∗ 处的估计均值由下式给出：


  ![$$ y=K\left(\theta, {X}^{\ast },X\right)K{\left(\theta, X,{X}^{\prime}\right)}^{-1}f(X).
  $$](img/480430_1_En_5_Chapter_TeX_Equ3.png)


  (5.3)


  在公式 5.3 中，出现了一个新项 *K*(*θ*, *X*^∗, *X*)。该项衡量了观测数据点（本例中为导出的测井曲线）与我们试图估计属性值的点之间的协方差。如果我们将克里金法与高斯过程回归进行类比，那么协方差矩阵类似于图
  5-1 中所示的解析变差函数。在高斯过程回归中，协方差函数是通过前面讨论的*核技巧*来实现的。最常用的核是径向基函数（RBF）核。


  ### 径向基函数（RBF）核


  RBF 核也被称为*平方指数*核。该核由长度尺度参数进行参数化，这些参数类似于图 5-1 中所示的变差函数变程。RBF 核可以具有单一长度尺度，从而等效于全方向（各向同性）变差函数；或者，它可以具有与输入维度相同的数量，从而等效于各向异性变差函数。RBF
  核的函数形式如下：


  ![$$ k\left(x,y,z\right)=\exp \left(-\frac{1}{2}d{\left(\frac{x}{l_x},\frac{y}{l_y},\frac{z}{l_z}\right)}²\right).
  $$](img/480430_1_En_5_Chapter_TeX_Equ4.png)


  (5.4)


  在公式 5.4 中，*l*[*x*]、*l*[*y*] 和 *l*[*z*] 分别表示 *x*、*y* 和 *z* 方向上的长度尺度或变差函数变程。此外，`GaussianProcessRegressor`
  的 scikit-learn 实现提供了一个超参数 `alpha`，它代表图 5-1 中变差函数模型的块金方差（*n*）。需要注意的是，这里讨论的方法假设样本均值为零。这可以通过在
  scikit-learn 中使用 `StandardScaler` 来实现。清单 5-2 展示了使用 `GaussianProcessRegressor` 对
  *permx* 进行插值的实现。


  ```

  from sklearn.preprocessing import StandardScaler

  from sklearn.gaussian_process import GaussianProcessRegressor

  from sklearn.gaussian_process.kernels import RBF

  x_scaler = StandardScaler()

  X_scaled = x_scaler.fit_transform(X)

  y_scaler = StandardScaler()

  y_scaled = y_scaler.fit_transform(np.array(y).reshape(-1, 1))

  kernel = RBF([5.e-1, 5.e-3, 5.e-3], (1.e-3, 1.e0))

  gpr = GaussianProcessRegressor(kernel=kernel,

  alpha=0.75,

  n_restarts_optimizer=10,

  normalize_y=False,

  random_state=12345)

  y_scaled = y_scaled.flatten()

  gpr.fit(X_scaled, y_scaled)

  pred, sigma = gpr.predict(X_scaled, return_std=True)

  pred = y_scaler.inverse_transform(pred.reshape(1, -1))

  print(''GPR Fit Score: %f'' % gpr.score(X_scaled, y_scaled))

  GPR Fit Score: 0.708586653049732

