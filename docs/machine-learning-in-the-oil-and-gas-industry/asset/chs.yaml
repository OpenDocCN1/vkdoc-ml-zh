  \ 年，全球超过一半的能源需求由石油和天然气行业提供[1]，并且到 2050 年，它仍将提供高达 50%的能源结构。这些增长预测是在 2020 年新冠疫情爆发之前做出的。\n\
  \n然而，三个相互关联的挑战正困扰着石油和天然气行业：盈利能力、环境影响和替代能源；这些挑战对资源获取、产量增长和可持续性构成了限制。\n\n*   由于产能建设能力大于需求增长，大宗商品价格和盈利能力往往受到限制。在油气价格较高（即高于\
