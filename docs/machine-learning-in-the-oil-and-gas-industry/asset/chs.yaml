  另一种便捷的方法是构建独立的虚拟计量函数，并同时运行所有函数（例如，Y1oil = f(X1), Y1water = f(X1), Y1gas = f(X1),
  Y2oil = f(X2), Y2water = f(X2), Y2gas = f(X2), ……等）。


  ```

  # 创建输入特征和目标值

  X0 = df[["BHP", "WHP", "WHT", "Tsep", "Psep", "Choke_in"]]

  X1 = df[["WHP", "Psep"]]

