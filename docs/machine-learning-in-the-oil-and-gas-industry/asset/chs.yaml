- "# 1. 迈向油气行业 4.0\n\n能源是维持现代人类生活的基本需求之一。2016 年，全球能源需求为 552 千万亿英热单位。其中，石油供应了 177 千万亿英热单位，天然气供应了\
  \ 127 千万亿英热单位。这表明，2016 年全球 55%的能源需求由石油和天然气行业满足[1]。预计到 2040 年，全球 57%的能源需求将由石油和天然气行业满足。这些数字展示了石油和天然气行业当下及未来对我们日常生活的影响。尽管石油作为能源的使用可追溯到数百年前，但现代历史上第一口油井于\
  \ 1848 年在阿塞拜疆的巴库钻成[2]。\n\n1859 年，埃德温·德雷克在美国钻成了第一口商业油井（见图 1-1）。德雷克油井是现代石油和天然气行业的转折点，由此引发了油井钻探领域的投资热潮。150\
  \ 多年来，该行业不断发展并采用新技术。石油和天然气行业很可能是少数几个以推动工业革命而闻名的行业之一。在过去的几个世纪里，世界见证了三次工业革命。\n\n![../images/480430_1_En_1_Chapter/480430_1_En_1_Fig1_HTML.jpg](img/480430_1_En_1_Fig1_HTML.jpg)\n\
  \n图 1-1\n\n德雷克油井被认为是第一口使用钻机成功钻探的油井[3]\n\n*   第一次工业革命始于 1760 年左右，以蒸汽机的发明为标志。在这个时代，蒸汽动力工具促进了工厂的机械化生产，蒸汽机彻底改变了人们的出行方式。\n\
  *   从 19 世纪末到 20 世纪初，生产的科学原理被引入工业领域。这导致了装配线上产品的大规模生产。福特汽车公司生产的汽油发动机汽车是第二次工业革命期间大规模生产的杰出典范之一。\n\
  *   随着 1945 年第一台通用计算机 ENIAC 的诞生，第三次工业革命或数字革命的种子被播下。到 20 世纪 80 年代，半导体技术的进步彻底改变了全世界的工业，计算从大型主机转向个人电脑。互联网的出现连接了世界，信息技术的进步开启了一个新的工业化时代。\n\
  \n目前，全球各行业正在经历第四次工业革命。这场革命由计算基础设施、预测技术、数据存储和数据处理能力的非凡增长所推动。第四次工业革命——有时以附加在不同行业名称后的“4.0”版本指代——正由以下推动因素驱动：\n\
  \n*   工业物联网，它促进了企业和运营环境中众多设备之间的无缝连接，并支持协作决策。\n*   大数据技术，它利用分布式数据存储和处理来高效地存储和处理海量数据。\n\
  *   利用加速计算设备（如图形处理单元）的云计算机器。\n\n石油和天然气行业也正在进行数字化转型，这被称为“油气行业 4.0”。石油和天然气行业的运营涉及高风险情况，无论是对人类生命还是环境而言。因此，只有在经过严格的验证阶段，确保健康、安全和环境标准得到适当满足后，才能采用新技术。尽管在采用新技术时极为谨慎，但石油和天然气行业始终对优化和简化现有流程的新技术持开放态度。\n\
  \n本书聚焦于机器学习（人工智能的一个子集）在石油和天然气行业的应用。在本章中，我们不深入探讨机器学习技术的具体细节，而是讨论与上游石油和天然气行业不同生命周期阶段相关的一些应用实例。为了便于那些对石油和天然气行业背景了解不多的读者，我们首先简要概述该行业的不同部门。\n\
  \n## 主要油气行业部门\n\n石油和天然气矿床通常位于地表以下数千英尺处。将这些深度的石油和天然气开采到地表，然后将其转化为可用能源的过程涉及大量操作。图\
  \ 1-2 展示了石油和天然气行业运营中不同的生命周期阶段。广义上讲，石油和天然气生产的整个过程分为以下三个行业部门。\n\n![../images/480430_1_En_1_Chapter/480430_1_En_1_Fig2_HTML.jpg](img/480430_1_En_1_Fig2_HTML.jpg)\n\
  \n图 1-2\n\n典型石油和天然气行业运营环境中的不同生命周期阶段\n\n*   上游行业\n*   中游行业\n*   下游行业\n\n### 上游行业\n\
  \n上游石油和天然气行业也称为勘探与生产行业。上游行业的运营侧重于识别地表以下可能蕴藏石油和天然气的区域。在确定潜在储量后，详细的勘探规划、油井钻探以及石油和天然气的生产也属于上游行业的范畴。从逻辑上讲，上游运营可分为以下活动：\n\
  \n*   勘探与评估\n*   油田开发规划\n*   钻井与完井\n*   生产作业\n*   废弃\n\n\n\n#### 勘探与评价\n\n在地表下精确找到油气藏的位置，是一项如同大海捞针般充满挑战的活动。过去一个世纪以来，人类对地球地下结构的科学认识已显著提升。地质调查提供了地表下结构的地质图或模型。结合地球物理勘探，这些模型有助于形成对地下结构的详细理解。\n\
  \n地球物理勘探有多种类型，具体取决于所使用的技术，例如磁法、电磁法、重力法和地震勘探等。近年来，地震勘探已被证明是定位潜在油气藏最可靠的方法。地震勘探可以在陆上或海上进行。\n\
  \n地震成像的基本原理与人体超声波成像相似。进行地震勘探的过程需要一个声能源。在陆地上，这些声源可以是大型振动卡车；在海上地震勘探中，则是气枪。从不同地下结构反射回来的声波由地表或水面附近的检波器或水听器（非常灵敏的麦克风）接收。3D\
  \ 和 4D 地震勘探是石油和天然气行业中数据量最大的数据集之一，有时其规模可达拍字节级别。这些地震勘探提供的信息有助于识别地下构造特征以及潜在的油气藏。\n\n\
  地质学家对地球的沉积环境有详细的理解，这有助于他们了解不同岩层在地下的排列方式。地质学家利用他们在盆地和层序地层学方面的深厚知识，并结合地震数据解释所获得的信息，来精确定位可能发现石油的位置。\n\
  \n一旦以一定的置信度确定了油气藏的潜在位置，运营的石油和天然气公司就会获得该油气区块的租赁权。基于地球物理和地质认识的结合，会钻探探井（也称为*野猫井*）来验证潜在的油气藏位置。如果在第一口野猫井中发现了石油，油藏工程师便会参与到油田评价过程中。\n\
  \n在此过程中，会在原始野猫井周围钻探更多的评价井。从探井中收集不同的测井记录和岩心记录，这些记录将进一步用于更详细地了解已发现的油气藏。\n\n地质学家和岩石物理学家利用地质模型以及测井数据，在目标区域建立详细的物理属性三维油藏模型，这一过程被称为*岩石物理建模*。在目标区域计算岩石物理属性，例如孔隙度（岩石中可储存或输送油气的空隙比例）以及油、水饱和度。这些详细的岩石物理模型有助于计算已发现油气藏中总可采和可恢复油气量的概率估算值。\n\
  \n#### 油田开发规划\n\n一旦勘探和评价活动结束，油藏工程师和地球科学家（地质学家和地球物理学家）会共同制定一份详细的计划，以进一步开发油气生产田。勘探和评价阶段获得的所有信息和见解——包括详细的油藏模型——都会被考虑在内。此阶段做出的决策包括：确定钻井的精确位置、优化井位布局的详细设计、完井设计（包括所需的射孔和增产措施）。\n\
  \n设施工程师、油藏工程师和生产工程师还会制定处理油气所需的详细设施设计（例如，用于分离油、水和气的分离器）。油田开发计划还包括将生产的油气运输到储存或处理设施的策略。一旦油田开发计划获得批准，就开始按照计划中规定的规格建造设施、钻探油井并完成完井。\n\
  \n#### 钻井与完井\n\n钻井过程的核心是创建油气从油气藏流向地表的通道。钻井是一项高风险、高资本支出的作业。深水海上钻井平台的日租金及相关费用可能接近每天\
  \ 100 万美元。粗略估算，一口海上油井的成本可能在 1 亿至 2 亿美元之间——在深水区域甚至更高。一口陆上油井的钻井成本可能在 500 万至 800 万美元之间[4]。\n\
  \n在钻井作业中，钻头连接在钻柱的最下端，钻柱是由钢或铝合金制成的钻杆依次连接而成的长柱。钻柱的顶端连接着一个驱动装置（一种机械设备），为钻柱提供扭矩。\n\n\
  由于这个扭矩，连接在钻柱底部的钻头旋转并切削岩石，从而形成井眼。在钻井作业期间，钻井泥浆会流经钻杆以冷却钻头。钻井泥浆还有助于清除钻井过程中产生的岩屑。\n\n\
  在钻井过程中，钻柱会定期收回，并通过固井和下套管来稳定井眼。套管是高强度的中空钢管，它与固井作业相结合，可以加固井眼，防止井眼坍塌。除了提供结构强度外，套管还能确保钻井过程中使用的化学流体不会污染附近的含水层和地下水源。\n\
  \n在固井并将套管下入井眼后，生产油管会被下入井眼。油管是耐腐蚀的中空不锈钢管，其直径始终小于套管，通过封隔装置固定在套管内。油管为油气从井底到地表提供通道，并保护套管免受腐蚀和其他可能的磨损。\n\
  \n一旦套管和油管就位，就会在套管或套管与油管上制造射孔，以促进油气从储层岩石流入井眼。除了射孔，完井活动还可能包括水力压裂和其他增产措施。\n\n在水力压裂过程中，水以极高的压力注入井眼。高压会在岩石中产生裂缝，为油气从储层流向井眼创造额外的通道。支撑剂是直径很小的砂粒，在压裂过程中用于确保裂缝保持张开状态。支撑剂的运移由转向剂辅助，转向剂是一种化学化合物，用于促进支撑剂颗粒从井眼流向裂缝内部。\n\
  \n一旦油田开发计划中规定的所有完井活动完成，油井便开始生产油气。需要注意的是，上述几页中提到的活动，从开始到油井产出第一滴油，有时可能需要五到十年的时间。\n\
  \n\n\n#### 生产作业\n\n一旦油井开始产出石油和天然气，生产工程师和油藏工程师会持续监测该井的生产趋势。在整个油井生命周期内，其油气产量会随时间推移而递减。生产工程师会制定方案，通过采用诸如人工举升等技术来维持油井的石油流动。人工举升可以利用泵（如电动潜油泵、抽油杆泵等），或通过向井底注入气体进行气举，以增加或维持油井的油气流量。在生产作业期间，还可以进行其他修井和干预作业，例如更换完井设备以维持油井的产出。\n\
  \n#### 废弃\n\n经过多年的持续生产，油井的油气产量持续下降。如前所述，工程师们会尝试通过修井和干预作业来使油井复产。然而，在某个时间点之后，鉴于油井极低的生产潜力，复产可能被认为在经济上不可行。在这种情况下，油井会被注入水泥封堵并废弃。这是油气井生命周期的最后一个阶段。在封堵和废弃过程中，会严格遵守不同监管机构制定的封井要求，以确保合规。\n\
  \n### 中游产业\n\n中游产业负责将从油井产出的原油运输至下游加工设施。运输方式可通过管道、油轮、卡车或铁路。此外，中游产业还负责石油商品（包括原油和天然气）的储存和营销。通过这种方式，中游产业充当了偏远地区油气生产设施与通常建在人口稠密区附近的下游加工设施之间的连接纽带。\n\
  \n### 下游产业\n\n下游产业的主要功能包括原油的分馏或裂解（将粘稠的高分子量原油转化为透明状的低分子量石油燃料的过程）以及相关的化学处理。随后是调合操作，最终生产出供大众消费的成品石油燃料。此外，下游炼油厂还负责天然气的净化。下游产业的完整范围包括炼油厂、石化厂、分销运营、零售中心及其他相关设施。在石油天然气行业的三个部门中，下游产业对普通大众的可见度最高，因为我们几乎所有人日常通勤的车辆都使用汽油或柴油。喷气燃料、沥青、润滑油、塑料和天然气是下游产业生产的其他各种石油产品。\n\
  \n到目前为止，我们已经讨论了石油天然气行业的三个部门。我们有意将中游和下游产业的描述保持简短。在接下来的章节中，我们将重点讨论上游石油天然气行业的数字化及其与机器学习的联系。\n\
  \n## 数字油田\n\n全球石油天然气行业拥有巨大的经济影响力。根据公共领域可用的数据，2017 年全球石油天然气公司的收入约为 5.5 万亿美元[5]。其中，排名前十的公司占据了近一半的收入（见图\
  \ 1-3）。近年来，几乎所有公司都开始投资于数字化转型工作。根据世界经济论坛发布的一份报告，2016 年至 2025 年间，石油天然气行业的数字化转型可能价值\
  \ 1.6 万亿至 2.5 万亿美元[6]。这些数字让我们得以一窥石油天然气行业数字化努力的巨大规模。\n\n![../images/480430_1_En_1_Chapter/480430_1_En_1_Fig3_HTML.jpg](img/480430_1_En_1_Fig3_HTML.jpg)\n\
  \n图 1-3\n\n全球领先的石油天然气公司及其在 2017 年全球收入中的份额[5]\n\n数字化对石油天然气行业来说并不新鲜。计算机辅助的互联油田可以追溯到\
  \ 20 世纪 70 年代末[7]。在过去二十年中，上游石油天然气行业在实时数据和现场驱动设备的使用方面呈指数级增长，这导致了众多数字油田的实施。这些实施已展现出在提升运营效率、优化产量和最大化油气采收率方面的价值。同时，数字油田的实施促进了更好、更快的决策，同时降低了健康、环境和安全风险。正式地讲，数字油田是一个“测量-计算-控制”循环的过程，其频率能够确保系统在其时间常数约束内始终维持最佳运行条件，同时可持续地：\n\
  \n*   最大化产量\n*   最小化资本支出/运营支出\n*   最小化环境影响\n*   保障相关人员的安全和相关设备的完整性[8] [9]\n\n这些目标可以通过协调四个相互关联的领域来实现：人员、自动化工作流程、流程和技术。需要注意的是，要恰当地描述支持数字油田实施的工作流程需要付出巨大努力。简而言之，数字油田是自动化与信息技术的集合，它转变了石油资产管理理念，并驱动更高效的运营工作流程。它涉及由数字自动化支持的学科、数据、应用和工作流集成工具的协同（见图\
  \ 1-4），具体包括以下内容。\n\n![../images/480430_1_En_1_Chapter/480430_1_En_1_Fig4_HTML.jpg](img/480430_1_En_1_Fig4_HTML.jpg)\n\
  \n图 1-4\n\n数字油田的不同组成部分\n\n*   现场仪表\n*   遥测技术\n*   自动化\n*   数据管理\n*   集成生产模型\n* \
  \  工作流自动化\n*   可视化\n*   协作环境\n*   预测分析\n\n成功的数字油田实施需要所有这些组件之间的同步。数字油田的预测分析组件负责为油田的当前和未来前景生成数据驱动的洞察。该组件通常承载着机器学习算法，是成功实施数字油田的关键。在下一节中，我们将讨论机器学习如何为数字油田实施乃至整个石油天然气行业提供预测分析能力。\n\
  \n\n\n## 上游产业与机器学习\n\n上游产业应用机器学习已有数十年历史，不过它可能曾被称作人工智能或其他别名。图 1-5 展示了机器学习与石油天然气行业里程碑事件的综合时间线。该时间线特别强调了代表数据采集与数字化进程的油气行业里程碑。根据时间线上技术演进的性质，我们可以将其划分为不同时期。截至\
  \ 20 世纪头十年，这两个行业都处于奠基阶段。\n\n![../images/480430_1_En_1_Chapter/480430_1_En_1_Fig5_HTML.jpg](img/480430_1_En_1_Fig5_HTML.jpg)\n\
  \n图 1-5  \n石油天然气行业与机器学习里程碑事件。数据来源：参考文献[2]和[10]\n\n在早期阶段，机器学习领域诞生了基础理论发现——如贝叶斯定理和最小二乘法。而在石油天然气行业，首批商业油井被钻探，石油作为重要燃料逐渐普及，并缓慢取代燃煤蒸汽机。进入\
  \ 20 世纪中期，我们看到油气行业开始使用电测井技术。与此同时，图灵的学习机在第一台通用计算机（ENIAC，1945 年）问世后不久便出现了。\n\n20 世纪\
  \ 50 年代标志着机器学习领域两项极其重要的发现：神经网络和感知机。这两者都被视为 20 世纪后期发展出的强大高级机器学习算法的基础。20 世纪 60 年代，油气行业工具取得重要进展，包括数字地层倾角仪（可测量井筒中的地层倾角，帮助区分不同类型的岩层）。同一时期还诞生了最近邻算法，这是机器学习的基础算法之一。\n\
  \n随着时间推移，我们看到 20 世纪 70 年代油气行业出现了多项重大发展。一些关键技术如亮点地震、测井系统、泥浆脉冲遥测和随钻测量（MWD）均在这一时期问世。这些都是数据采集技术的重大进步，至今仍是石油工程师最重要的数据来源之一。在这十年间，数字油田的初步概念化和实施得以实现，通过计算机系统整合了不同信息平台。对于机器学习而言，反向传播理论诞生了。反向传播理论的重要性体现在：没有它，我们就不会看到近年来神经网络引领的人工智能领域革命。\n\
  \n20 世纪 80 年代，三维地震彻底改变了地球科学家研究地下结构的方式。大约在同一时期，随钻测井（LWD）技术使钻井作业期间能够获取实时数据，提供关于地下地层物理特性的精确信息。同一十年间，新认知机的发明为高级计算机视觉奠定了基础，而循环神经网络（RNN）则为序列建模提供了新工具。或许只是巧合：地下三维地震成像最重要的进展之一，与基础计算机视觉算法新认知机的发现，仅相隔数年。在本书第\
  \ 4 章中，您将看到这两个在不同行业仅相隔两年发生的事件，如何通过将计算机视觉算法应用于地震图像，从而产生对地球地下结构的洞察。\n\n20 世纪 80 年代机器学习领域的另外两项重要发现是：应用反向传播理论促进神经网络训练，以及强化学习的基础建立。强化学习是机器学习范式之一，它依靠奖励函数来训练软件代理完成特定任务。这些算法可以教会虚拟玩家在游戏中战胜人类，或教会机器人像人类一样行走。^(¹)\n\
  \n20 世纪 90 年代，地震技术取得了重大进展。一方面，超级计算机被用于处理三维地震数据；另一方面，四维地震数据帮助地球科学家解释和可视化地下结构随时间的演变。这又是一个美妙巧合的十年。当地球科学家获得了理解地震时间序列演变的能力时，机器学习发现了一种名为*长短期记忆*（LSTM）的新算法用于序列预测。这两个事件在时间线上仅相隔三年。LSTM\
  \ 解决了传统循环神经网络的一些局限性，提供了更强的序列预测能力。您将在第 3 章中了解更多关于 LSTM 的知识。\n\n20 世纪 90 年代还见证了随机森林和支持向量机算法的发现。随着时间的推移，随机森林算法已成为每位机器学习从业者首选算法之一。\n\
  \n20 世纪 90 年代是机器学习研究加速发展的十年，在此期间发表的最引人入胜的算法之一是卷积神经网络（CNN）。CNN 在过去十年中一直是计算机视觉领域的驱动力。在\
  \ 20 世纪 90 年代，石油天然气行业也见证了新技术的发展，如声波测井、闭环钻井系统和智能井。\n\n\n\n自 21 世纪初以来，油气行业在数据采集领域取得了显著的技术进步。除了海上地震勘探获取的海量数据外，非常规油气行业的蓬勃发展也成为了大量数据的来源。此外，计算硬件的发展，例如基于图形处理单元（GPU）的计算机，极大地提升了计算能力。借助快速计算硬件与海量训练数据的结合，近年来开发的机器学习算法已能够在无需任何人工监督的情况下，识别图像和视频中的物体。另一方面，一类新型算法——生成对抗网络（GAN）——已经能够生成几乎无法与真实照片区分的人脸图像。有趣的是，GAN\
  \ 也被有效地应用于地震图像重建中[11]。\n\n对这两个行业的里程碑回顾显示，它们在数据采集、数字化以及从海量数据中学习的能力方面都取得了显著进展。在本章的后续部分，我们将简要回顾机器学习在上游行业不同环节的应用。首先，我们简要概述特定上游行业环节中可用的不同类型数据，然后讨论将这些数据与机器学习算法结合以解决上游行业问题的案例。对于那些没有机器学习背景的读者来说，在学习这些算法在油气行业的应用之前，先对它们有一个初步了解是很重要的。因此，在本书接下来的章节中，我们将首先详细介绍这些机器学习算法的细节。然后，我们将展示这些算法如何用于解决行业特定问题的示例。在本章中，你只需理解存在不同类型的机器学习算法，并且它们已被应用于解决各种行业相关问题即可。\n\
  \n### 地球科学\n\n地球科学可以被理解为涵盖地质学、地球物理学和岩石物理学的一门学科。在以下小节中，我们将讨论一些与地球科学相关的问题，这些问题已通过应用机器学习算法得到解决。\n\
  \n#### 地球物理建模\n\n地球物理学家处理地震数据。地震数据可以是二维、三维或四维（描述时间演化）。由于数据量庞大，地震数据集最适合用于需要大量数据进行充分训练的先进机器学习算法，例如\
  \ CNN。以下讨论一些可通过应用机器学习来解决的地球物理学问题。\n\n##### 自动断层解释\n\n断层解释是地震解释中的一个关键步骤。断层由不同的地下运动机制形成，导致结构不连续性。在考虑目标区域存在断层后，需要做出某些操作决策。在传统工作流程中，断层解释是一个耗时的过程。卷积神经网络可能有助于将断层解释作为一个计算机视觉问题进行公式化和求解。然而，生成大量代表地震图像及其对应断层位置的标记数据来训练\
  \ CNN 模型并不总是可行的。不过，最近的研究已经确立了用最小训练数据集训练先进 CNN 变体的方法，同时能在提供的地震图像中对断层位置进行高度精确的逐像素预测[12]\
  \ [13]。\n\n##### 自动盐体识别\n\n地震解释中的另一项关键任务是识别地下环境中的盐体。在传统工作流程中，目视拾取盐/沉积物边界是进行盐体识别的标准方法。这是一个耗时的手动过程，且可能受到个人偏见的影响。基于先进\
  \ CNN 的分类，结合残差学习，在描绘盐体方面已展现出高精度。这些基于 CNN 的算法的结果与手动解释的盐体显示出良好的一致性。这些结果表明了应用 CNN 进行自动盐体识别的潜力[14]。\n\
  \n##### 地震插值\n\n获取高分辨率、规则采样的地震数据常常受到物理或经济条件的限制。这导致了欠采样的地震数据集。此外，数据质量问题（如坏道或死道）的存在，给依赖高分辨率、高质量地震图像的勘探和生产活动带来了额外挑战。应对这些挑战可以使地球科学家、油藏工程师及其他行业专业人士提高其模型的预测能力。\n\
  \n近年来，生成对抗网络已被用于地震图像的插值。地震插值有助于重建坏道和死道。它也可以用作地震数据的分辨率增强工具。使用生成对抗网络进行地震插值的结果使其成为经典方法的一个有趣替代方案[11]。\n\
  \n##### 地震反演\n\n地震反演过程将地震数据转换为描述油藏的定量岩石属性估计值。在最近的研究中，GAN 已被结合作为创建地下地质结构及其岩石物理属性的*先验*模型。生成的结构和属性信息被用于辅助地震反演[15]。这是\
  \ GAN 在地震处理领域的另一个有趣应用。\n\n#### 地质建模\n\n地质建模是在目标区域的地表及地下生成详细的二维或三维物理属性模型的过程。建模过程使用了地表的地质观测数据、该区域钻探井的不同类型测井数据以及地震数据。以下讨论一些在地质建模中的机器学习应用。\n\
  \n##### 岩石物理建模\n\n岩石物理建模对于了解油藏中油气储层的结构和属性至关重要。神经网络已被成功应用于创建油气藏中岩石物理属性分布的详细表示，这有时被称为*神经克里金法*[16]\
  \ [17]。近年来，深度神经网络已被应用于生成详细的二维和三维模型或油藏[18] [19]。这些研究证明了机器学习方法在构建详细的岩石物理属性模型方面的有效性。\n\
  \n\n\n##### 岩相分类\n\n岩相可理解为具有独特特征的一类岩石。了解油气藏中的岩相分布有助于识别更可能产出油气岩石的区域。近年来，应用深度神经网络的机器学习方法在基于测井岩石物理性质[20]以及远离井位的随机兴趣点[19]进行岩相分类方面，已展现出合理的准确性。\n\
  \n### 油藏工程\n\n油藏工程师能够获取地球科学家使用的几乎所有数据。他们还掌握其负责油田的油气产量和作业历史数据。他们利用多种多样的数据来制定从油藏乃至整个油田经济最优地开采油气的方案。接下来将讨论一些机器学习已展现出潜在优势的油藏工程活动。\n\
  \n#### 油田开发规划\n\n在油田开发规划期间，油藏工程师利用现有井的数据。基于对现有井数据的分析，他们决定新井的布井位置。具体而言，这是非常规油气资源开发中的标准做法。已有多种方法尝试应用机器学习，基于历史数据来规划新井。\n\
  \n其中一种方法是通过应用主成分分析（PCA）进行降维，随后采用回归方法来预测拟建新井的生产潜力[21]。基于机器学习方法的分析也证明了其揭示隐藏模式的能力，这些模式在高维空间中不易被察觉。通过识别这些模式，可以识别出预期表现相似的井。进一步的分析可以揭示表现相似井的共同属性、表现不佳井性能欠佳的根本原因，以及在新井中避免类似不良性能的措施[22]。\n\
  \n#### 辅助历史拟合\n\n历史拟合过程遵循一个迭代方案来调整油藏参数。当历史拟合结果与观测到的油藏表现达到合理匹配时，该过程即收敛。在非均质性强、复杂性高的油藏中，历史拟合可能是一个耗时且计算成本高昂的过程。近年来，基于人工神经网络的方法已被应用于油藏历史拟合[23]。这类方法采用完全数据驱动的代理模型，显著降低了计算成本。与全尺寸数值油藏模拟器相比，代理油藏模型的计算成本仅为其一小部分。这种计算成本的降低使得历史拟合过程变得非常高效[24]。\n\
  \n#### 产量预测与储量估算\n\n预测生产井的石油产量是油藏工程师的主要职责之一。基于生成的产量预测，可以做出关于未来油田开发活动的决策。产量预测有助于估算可采储量和进行经济评价。传统上，数值模拟和递减曲线分析（DCA）技术被广泛用于产量预测。这些技术需要了解油藏行为，并且在模拟复杂物理过程方面缺乏灵活性。\n\
  \n近年来，使用前馈神经网络[25][26]和循环神经网络的机器学习方法已在单井和多井的产量预测中证明了其有效性和准确性。这些机器学习方法使得无论资产是否拥有大量作业历史信息，其预测过程都变得高效且准确[27]。\n\
  \n### 钻井与完井\n\n海上钻井是一项高风险、高资本支出的作业。深水海上钻井每天的成本可能高达 100 万美元，而在深水钻井场景下，单口井的成本可能高达数亿美元。鉴于这些事实，采用机器学习模型的自动化可以显著提高钻井作业的操作安全性，同时降低钻井成本。接下来将讨论机器学习在钻井与完井活动中的一些应用，这些应用展示了在提高操作安全性和成本效益方面的巨大潜力。\n\
  \n#### 自动化事件识别与分类\n\n上游资产通过人工生成的作业报告和传感器数据（如钻压、立管压力、转速等）创造有价值的见解。只有当数据质量足够，且信息得到正确解释、存储和使用时，才能实现这种价值。报告和数据为推导井事件提供了基础。井事件的例子包括：生产时间（例如，钻进）、非生产时间或\
  \ NPT（例如，卡钻、粘滑振动、井眼清洁、管柱故障、井漏、底部钻具组合涡动、过大扭矩和摩阻、低机械钻速、钻头磨损、地层损害、井眼失稳等），以及隐性损失时间或\
  \ ILT（例如，缓慢的接单根、次优钻进和起下钻）。\n\n多年来，钻井和完井作业一直得到广泛数据收集过程的支持。在过去的二十年里，随着井下传感器和远程通信能力的加入，钻井和完井作业期间出现了广泛的实时数据收集过程。当前的挑战是从实时数据中识别事件并获取见解，以防止\
  \ NPT 和 ILT。传统上，每日钻井报告（DDR）一直是描述井场关键作业和事件详细日志的权威来源；然而，它们受制于人为偏差，并且使用不一致的文本格式和术语。自动化事件识别与分类的目标是，在能够实现最佳和安全钻井作业的时间范围内，查明并纠正钻井过程中出现的问题[28]。\n\
  \n已经提出了各种机器学习技术，通过检测事件发生时钻井参数的变化趋势来自动识别和分类钻井事件。钻井事件是使用定义的专家规则、阈值和标准[29]，以及回归和分类方法[30]，从海量\
  \ DDR 和实时钻井数据库中提取的。也有研究尝试最大化 DDR 和实时数据的价值[31]。\n\n#### 非生产时间（NPT）最小化\n\n钻井作业中的非生产时间（NPT）可能由多种原因引起。由于钻井设备租赁费用高昂，因此存在经济激励来最小化此类非生产时间。井涌和卡钻是导致非生产时间的两个最重要问题。接下来将讨论一种用于预测这些问题发生概率的机器学习方法。\n\
  \n\n\n##### 早期井涌检测\n\n*井涌*是指气体突然从地层渗入井筒的事件。当气体进入井筒后，便开始向地表上升。气体的向上运动表现为地表泥浆体积增加，同时伴随泥浆流出井口的流速增大。\n\
  \n井涌是一种危险事件，对其后果进行补救的成本往往十分高昂。越早检测到井涌，钻井平台上的工作人员就能越早采取必要的纠正措施。然而，传统的报警系统要么存在大量误报，要么无法准确识别井涌。机器学习算法的应用能够在钻井过程中提供泥浆体积和流速的精确估算，同时也显著降低了误报频率。这有助于钻井人员及时采取有效的纠正措施\
  \ [32]。\n\n##### 卡钻预测\n\n在钻井作业的某些情况下，钻杆可能会卡在井筒内。一旦钻杆被卡住，钻井作业就会暂停，直到采取补救措施。卡钻问题是导致钻井作业非生产时间的主要因素之一。为了预测卡钻事件相关的非线性行为，通过粒子群优化算法优化的人工神经网络在提前预测卡钻事件可能性方面表现出了高精度。从这种机器学习方法获得的预测，结合合理的工程判断，具有预防卡钻事件的潜力\
  \ [33]。\n\n#### 自主钻井平台\n\n大型海上钻井平台通常位于偏远地区，每天可产生高达 1 到 2 太字节的数据。使用 2 Mbps 的卫星链路传输海上平台一天产生的如此大量的数据需要\
  \ 12 天或更长时间 [34]。因此，任何关键的数据驱动决策都必须在海上钻井平台本身上进行。自主钻井平台结合了机器学习、工业物联网和机器人技术。此外，平台上的决策需要安装在平台上的边缘计算设备（嵌入了机器学习和其他算法的电子电路设备）。钻井平台上精密的机械和大量的传感器提供了决策所需的所有相关信息。工业物联网设备获取的数据可以由运行在边缘计算设备上的机器学习算法处理。最后，算法给出的建议被传回给钻井操作员或机器人，从而执行最终行动。自主钻井平台的目标包括以下内容。\n\
  \n*   以最优速率钻井（机械钻速优化）[35]。\n\n*   最小化非生产时间，例如，提前预测卡钻的可能性，并提高不同补救措施的成功概率（钻井作业中总非生产时间的\
  \ 25%归因于卡钻）[33]。\n\n*   操作安全，例如，早期井涌检测以确保人员安全并保护生态系统 [32]。\n\n### 采油工程\n\n随着油气田的成熟，油藏和井况会持续变化，并且很可能是朝着恶化的方向发展。结果，由于含水率（石油中水的比例或百分比）上升、举升设备效率低下、缺乏足够的油藏压力支持或地面回压瓶颈等诸多原因，产量会迅速下降。油藏和油田的衰退可能是单井产量下降以及非生产井（停产井）数量快速增加的结果。\n\
  \n为了管理产量下降，需要钻新井或对现有井进行干预。为了通过现有井提高产量，油藏和采油工程师会规划并执行修井作业，包括挤水泥、井完整性、打捞作业和层位封隔，以优化和维持石油生产。\n\
  \n采油工程的作用是确保油藏生产在已批准的油田开发方案的现有边界内进行，包括井数、设施能力和有限的支出。采油工程师的职责可能包括以下内容。\n\n*   规划、收集和解释生产监测数据。\n\
  \n*   建立、维护和利用模型进行井性能管理。\n\n*   确定井的操作包络线和设定点。\n\n*   识别、排序、实施和评估增产机会，包括修井作业。\n\n\
  #### 修井机会候选井识别\n\n在其生命周期内的某些情况下，一口井可能无法令人满意地运行和生产。识别此类井，并执行干预和补救活动（也称为*修井*）以使井的性能达到令人满意的水平，已显示出显著的经济效益。专家系统在石油和天然气行业已使用数十年，其流程涵盖从数据集成和清洗、问题检测，到根据产量增益、成本、风险和净现值对候选井进行排序。利用数据分析、机器学习和推理工具（如贝叶斯信念网络\
  \ [36] [37]）的新型系统已被提出并用于检测生产问题，并给出井、油藏或设施中各种问题发生的可能性。这些系统有助于区分根本原因，并对现有的不同应对措施进行优先级排序。这些筛选逻辑作为一个可重复的自动化过程运行，可以按计划执行或按需执行。\n\
  \n##### 生产优化\n\n生产优化的目标是利用到该时间点为止所有可用信息来管理并确保盈利地实现资产目标，自信地预测结果，做出能产生最优结果的决策，并在下一个决策时间点之前实施这些决策。油田中实时井下测量和远程驱动阀门的日益普及，使得实时进行全油田范围的操作优化成为可能\
  \ [38]。有了更多的实时数据和测量值，就有可能构建机器学习模型，这些模型可以在获得新数据时进行更新。虽然实时优化这个术语当然并不新鲜，并且实时优化已在生产操作的某些环节中得到实践，但如今在日常生产操作中实现实时优化的可行性已大大提高。\n\
  \n##### 加密钻井\n\n加密钻井是指在油田开发周期的后期阶段，为了增加井-油藏接触面积而选择的额外泄油位置。加密钻井的目的是提高或改善井的采收率，这些井的泄油区域内可能存在未被开采的油气藏。选择加密井候选井需要仔细分析，以验证、量化并定位这些未被开采的油藏位置。已经开发出多种数据驱动的方法来预测潜在侧钻井的产量，提供一套标准来选择最适合侧钻的井，同时利用所有相关的不确定性，并与随机经济分析相关联\
  \ [39]。\n\n\n\n#### 最优完井策略\n\n*完井*是指安装在井筒内以确保油气从储层提升至井口的硬件设备。最优完井策略需要正确理解储层潜力（即随时间变化的多相流体、固体、产能及压力状态）以及生产要求（即产量目标和井口压力）。\n\
  \n许多研究者采用多变量分析方法，包括多元线性回归分析和利用多学科数据的统计模型，例如岩石物理数据（如厚度、渗透率、饱和度）、完井数据（如油管尺寸、增产液及裂缝强度）和生产数据（如压力及多相流测试数据）。传统上，生产工程模型（如节点分析井模型）足以提供准确的预测性能关系，以实现成功完井。在未知井况失效或储层现象不确定的情况下，数据驱动模型比纯工程模型能提供更好的预测。\n\
  \n过去五年间，机器学习算法在非常规油气完井性能预测中的应用呈爆炸式增长[40] [41]。数据驱动方法帮助作业者选择最优完井参数，这些参数对生产有积极影响，并有利于降低单位成本，例如段间距、泵送桥塞射孔固井设计、注入速率、每英尺水平段支撑剂质量及每英尺水平段液量[42]。\n\
  \n#### 预测性维护\n\n上游油气行业使用了大量设备。所有设备在最终失效前都有一定的运行寿命。超过 90%的生产油井需要人工举升方法来提高产量。*电潜泵*（ESP）被广泛用于人工举升，使其成为确保油井持续产油的关键部件。\n\
  \n尽管是上游作业中的关键设备之一，但 ESP 的故障率非常高[43] [44]。这些故障通常是随机发生的，并导致油井产量损失。据估计，ESP 故障每年导致数亿桶原油产量损失或延迟。以往的研究采用*主成分分析*（PCA）方法，利用完整的历史数据来检测\
  \ ESP 故障并预测设备在失效前的剩余使用寿命。即将发生的故障通常表现为 PCA 数据点远离原点。将基于机器学习模型的这些预测与工程原理相结合，可以在 ESP\
  \ 问题发生之前很久就检测到问题，并制定预防措施，从而产生显著的经济效益[45] [46]。\n\n## 行业趋势\n\n到目前为止，我们已经讨论了机器学习在上游油气行业的几种应用。现在，我们通过分析研究发表趋势（见图\
  \ 1-6），来整体分析油气行业和机器学习行业的一些趋势。\n\n为了分析行业趋势，我们在谷歌学术上使用了不同的搜索查询，以了解油气行业内机器学习社区以及整个机器学习社区的发表趋势是如何演变的。以下有趣的趋势已经显现。\n\
  \n*   在 2008 年，整个研究社区中，*人工智能*一词的主导地位被*机器学习*一词超越。油气行业在 2018 年也观察到了类似的交叉点。这表明油气行业采用机器学习术语的时间滞后了十年。\n\
  \n    ![../images/480430_1_En_1_Chapter/480430_1_En_1_Fig6_HTML.jpg](img/480430_1_En_1_Fig6_HTML.jpg)\n\
  \n    图 1-6\n\n    基于谷歌学术关键词搜索结果数量（a）油气行业，以及 b）所有行业中与机器学习、深度学习和人工智能相关的出版物）得出的 1991\
  \ 年至 2019 年趋势。2019 年的引用次数是根据 2019 年 3 月的数据估算的。\n\n*   2012 年之后，*人工智能*一词在整个研究社区中的流行度急剧下降。这种下降推动了*机器学习*和*深度学习*这两个术语使用量的增长。2019\
  \ 年可能标志着油气行业开始出现类似趋势。\n\n*   整个研究社区在 2010 年观察到的*深度学习*模式，大约在 2015 年开始在油气行业出现，滞后了将近五年。\n\
  \n*   对于整个研究社区而言，*机器学习*在 2017 年出现急剧下降。大约在同一时间，*深度学习*的兴起仍在继续。\n\n基于这些观察，可以得出以下结论。\n\
  \n*   与整个行业相比，油气行业对机器学习和深度学习的采用滞后了大约五到十年。\n\n*   目前，该行业对机器学习和深度学习的采用正在上升。\n\n* \
  \  在不久的将来，机器学习和深度学习的增长应会持续。在某个时间点，深度学习将在流行度上超越机器学习。\n\n如果你还在犹豫是否值得花时间学习机器学习而不是深度学习，答案是肯定的。深度学习是机器学习的一个子领域。在第\
  \ 3 章中，我们将讨论机器学习和深度学习的基础知识。这些技术在油气行业的采用率有巨大的增长潜力。\n\n## 总结\n\n在本章中，我们概述了油气行业的不同环节。我们还比较了上游油气行业数据采集与集成技术的时间线，以及机器学习算法的历史演变。此外，我们概述了机器学习在一些上游行业问题中的应用。我们希望你现在对上游油气行业有了一个总体了解，知道机器学习可以在哪些方面提供有价值的解决方案。在接下来的章节中，我们将选择其中一些问题，并看看如何使用真实数据集为这些问题构建机器学习解决方案。在此之前，接下来的几章将专门介绍\
  \ Python 编程、机器学习和深度学习概念的概述。\n\n\n\n"
- "# 2. Python 编程入门\n\n在上一章中，我们讨论了石油和天然气行业面临的一些挑战，而机器学习可以提供数据驱动的洞察和解决方案。然而，在实施这些解决方案之前，你需要学习如何编写适用的机器学习算法代码。这使得在深入机器学习之前，必须先理解一门计算机编程语言。\n\
  \n有多种编程语言可用于跨行业开发机器学习解决方案和应用。Python、R、Java、C/C++、Julia、Scala、Go 和 Lua 是用于开发机器学习算法和应用的领先语言中的一部分。在这些语言中，截至\
  \ 2019 年，Python 拥有最大的机器学习从业者社区。这种情况会随时间改变吗？也许在遥远的未来，另一种编程语言会在受欢迎程度上超越 Python。我们避免陷入关于哪种编程语言更好或更差的争论，因为这并非本书的意图。应该承认，每种编程语言都有其自身的优点和缺点。然而，鉴于\
  \ Python 提供的丰富机器学习生态系统和活跃社区，在学习机器学习算法时学习 Python 具有实际意义。\n\nPython 具有以下特性。\n\n* \
  \  **平台无关性**。在一个平台上编写的 Python 代码可以在另一个平台上运行。这意味着，如果你在 Windows 操作系统上编写了代码，若想在 Linux\
  \ 操作系统上运行，无需重写。Python 已被移植到几乎所有常用的平台。不过，对于与操作系统和文件系统相关的功能，可能需要进行一些微小的调整。\n\n*  \
  \ **解释型语言**。你无需在运行 Python 代码之前显式地编译它。Python 代码由解释器执行，解释器负责将 Python 代码转换为字节码。\n\n\
  *   **高级语言**。在编写 Python 代码时，你无需担心复杂的系统级细节，例如在程序执行期间如何分配或释放内存。Python 为大量通用函数提供了抽象，使你能够更多地关注编程逻辑，而不是系统或硬件级别的细节。\n\
  \n*   **开源**。Python 是免费分发的，甚至可用于商业目的。任何人都可以查看和修改 Python 源代码。一个庞大的开发者社区不断为丰富的 Python\
  \ 生态系统贡献新的功能和特性，用于通用计算和机器学习。\n\n*   **面向对象**。Python 支持面向对象的编程范式，你可以使用一组变量和函数来定义现实世界实体的数据结构和行为。我们将在本章后面提供更多细节。\n\
  \n*   **动态类型**。在 Python 中定义变量时，你无需担心定义其数据类型。简单来说，你不需要描述一个变量是整数还是带小数的实数（浮点数）。Python\
  \ 会动态地为变量分配数据类型。\n\n*   **会话式语法**。Python 语法直观且具有会话风格。举个例子，如果你想查看一个数字是否存在于一个数字列表中，你可以编写\
  \ `if 5 in [1, 2, 3, 4, 5]`，结果将是 `True`。\n\n*   **易于学习**。Python 的特性使其成为一种易于学习的编程语言。虽然精通\
  \ Python 可能需要付出巨大努力，但与本章前面提到的大多数其他编程语言相比，入门 Python 的学习曲线更短。\n\n在我们开始用 Python 编写代码之前，我们需要安装\
  \ Python 并设置编程环境。下一节将引导你在计算机上完成 Python 的安装过程。\n\n## 安装与环境设置\n\n在选择 Python 安装程序时，有很多选项可供选择。对于本书，我们建议从\
  \ Anaconda 发行版下载网站 [2] 获取适用于你计算机操作系统的最新 Python 3.x 安装程序。Anaconda 发行版包含了大部分所需的 Python\
  \ 库，并且还附带包管理的额外好处，这确保了安装在 Python 环境中的不同库的版本彼此兼容。详细的安装说明在 [3] 中提供。\n\n成功安装 Anaconda\
  \ 发行版后，我们建议你通过从 Anaconda Prompt（可以从程序/开始菜单访问，如图 2-1 所示）执行以下命令集，将 Python 版本降级到 3.6。\n\
  \n![../images/480430_1_En_2_Chapter/480430_1_En_2_Fig1_HTML.jpg](img/480430_1_En_2_Fig1_HTML.jpg)\n\
  \n图 2-1\n\n使用 Anaconda Prompt 安装 Python 3.6 版本\n\n```\n> conda update --all\n> conda\
  \ install python=3.6\n```\n\n这些步骤确保你拥有 Python 3.6 版本，这是安装稍后在第 3 章中使用的一些机器学习库所必需的。至此，你应该拥有完成本章剩余部分所需的所有\
  \ Python 库。现在，让我们熟悉一下 Jupyter Notebook。\n\n## Jupyter Notebook\n\nJupyter Notebook，或简称为\
  \ *notebook*，提供了一种在基于 Web 的界面中交互式编写和执行 Python 代码的方式。Notebook 还允许你编写 Markdown，这使得共享有关代码的信息更加容易。如果你想制作一个吸引人的\
  \ notebook，可以在 Markdown 单元格中包含图像和其他格式化文本。但是，我们将把重点放在 Python 代码上。要为本章启动一个新的 Jupyter\
  \ Notebook，请在命令提示符或终端中导航到包含数据和本书源代码的目录，并使用以下命令：\n\n```\n> jupyter notebook\n```\n\
  \n你应该会看到一个互联网浏览器窗口打开，并显示一个仪表板，如图 2-2 所示。\n\n![../images/480430_1_En_2_Chapter/480430_1_En_2_Fig2_HTML.jpg](img/480430_1_En_2_Fig2_HTML.jpg)\n\
  \n图 2-2\n\n在 Web 浏览器中显示的 Jupyter Notebook 仪表板\n\n成功启动 notebook 仪表板后，找到并单击仪表板右侧的\
  \ New 按钮，然后在 Notebook: 下选择 **Python 3**。你应该会看到一个新的 notebook 在一个新的浏览器标签页中打开，如图 2-3\
  \ 所示。\n\n![../images/480430_1_En_2_Chapter/480430_1_En_2_Fig3_HTML.jpg](img/480430_1_En_2_Fig3_HTML.jpg)\n\
  \n图 2-3\n\n在 Web 浏览器中显示的一个新的 Jupyter Notebook\n\n*恭喜！* 你已经创建了你的第一个 Jupyter Notebook。在基于\
  \ Web 的界面中，你可以看到带有不同选项卡的菜单栏，例如 File、Edit 等。在菜单栏下方，工具栏提供了创建新单元格的选项（由带有 **+** 符号的按钮表示），该单元格可以是代码单元格、Markdown\
  \ 单元格或其他类型，具体取决于工具栏下拉菜单中相关选项的选择。代码单元格包含常规的 Python 代码，而 Markdown 单元格则可以包含对 notebook\
  \ 中正在开发的功能的纯文本或格式化文本描述。可以通过按 Ctrl+Enter 或 Alt+Enter 来执行单元格。如果按 Ctrl+Enter，当前单元格中的代码或\
  \ Markdown 将被执行。但是，如果按 Alt+Enter，除了执行当前单元格中的代码或 Markdown 之外，还会在当前单元格下方插入一个新单元格。\n\
  \n\n\n### 为什么选择 Jupyter？\n\n这种执行 Python 代码的过程可以看作是 Python 解释器和 Python 脚本的混合体。Jupyter\
  \ Notebook 提供的一些额外优势包括：通过融合代码、图形、数据和文本的丰富计算与数据驱动叙事，提供了一种便捷的分享工作成果的方式 [4]。这种基于 Web\
  \ 的环境的另一个优势是，它将代码、文本、图像、方程和可视化图表等所有不同部分整合到一个文档中。Notebook 易于共享，并且可以随时编辑，因为它们对关联系统的依赖性不大。这就是\
  \ Jupyter Notebook 在教学/学术环境中被使用的主要原因。\n\n这些不同的方法通常根据代码的目标和用户的经验水平来选择。例如，处于入门阶段的数据科学家通常从\
  \ Jupyter Notebook 开始，因为它们无需安装单独的 IDE（集成开发环境）就能提供交互式环境。然而，软件开发人员通常更喜欢 IDE，因为它们提供了更高级的调试程序、Git\
  \ 集成和集成终端。\n\n现在你已经了解了一些关于 Notebook 的基础知识，让我们编写并执行我们的第一个 Python 代码。\n\n注意\n\n各章节中使用的代码片段以\
  \ Jupyter Notebook 的形式提供，可以在本书的代码仓库中找到。这些 Jupyter Notebook 提供了一个全面的代码库，使你能够浏览本书各章节中讨论的端到端问题工作流程。\n\
  \n## Python 入门\n\n现在，在新 Notebook 的代码单元格中，让我们输入以下代码，然后按 Ctrl+Enter。\n\n```\nprint(\"\
  Hello World!\")\n```\n\n你应该会看到以下输出。\n\n```\nHello World!\n```\n\n恭喜！你已经用 Python\
  \ 编写了第一行代码。在这一行代码中，我们要求 Python 解释器将“Hello World!”这句话打印到输出控制台。在本章的后续部分，我们将更详细地介绍\
  \ Python 编程。\n\n你可以在已创建的 Notebook 中为每个代码片段创建一个新的代码单元格，并在我们学习本章不同编程概念时执行这些代码片段。\n\
  \n本章重点介绍 Python 编程语言的基础知识，本书将使用该语言来执行机器学习算法。本章涵盖的主题列表包括以下内容。\n\n*   Python 编程语言基础\n\
  \    *   执行代码（三种不同方法）：Python 解释器、IPython 和 .py 脚本\n\n    *   语言结构与含义：编程语言的语法和语义\n\
  \n    *   Python 中一切都是对象吗？讨论 Python 中的变量和运算符\n\n    *   如何在 Python 中使用数字并执行运算？\n\
  \n    *   为什么 Python 被认为是一种动态且强类型的语言？\n\n*   数据结构：列表、元组、集合和字典\n\n*   控制流工具和迭代器：if、else、for\
  \ 和 while 语句\n\n*   基本面向对象编程：函数、方法和类\n\n*   Python 库：如何使用 Python 中丰富的模块和包库，以及其他有用的库？\n\
  \    *   NumPy：使用数组和矩阵进行科学计算\n\n    *   pandas：数据分析\n\n    *   Matplotlib：2D 绘图和可视化\n\
  \n本章使用来自石油和天然气行业的开源数据集，并提供了使用 Python 库进行基础数据分析和可视化的入门指南。\n\n## Python 基础\n\n像 C、Fortran\
  \ 或 Java 这样的编译型语言与像 Python 这样的解释型语言之间的一个主要区别在于执行过程。Python 是一种非常灵活的语言，可以轻松地逐行执行，并提供了多种不同的方式来执行用\
  \ Python 编程语言编写的代码。接下来介绍三种常用的方法。\n\n### Python 解释器\n\nPython 解释器提供了执行逐行代码最基本的方法之一。一旦在系统上安装了\
  \ Python，在命令提示符下运行 `'python'` 就会启动该过程。会显示当前 Python 版本，随后出现 `>>>`，表示可以从此处开始执行 Python\
  \ 代码（见图 2-4）。\n\n![../images/480430_1_En_2_Chapter/480430_1_En_2_Fig4_HTML.jpg](img/480430_1_En_2_Fig4_HTML.jpg)\n\
  \n图 2-4\n\n使用 Python 解释器运行逐行代码\n\n### Python 脚本\n\n经验更丰富的程序员更喜欢以扩展名为 `.py` 的脚本形式生成代码。整个代码使用\
  \ Python 终端执行（见图 2-5 和 2-6）。\n\n![../images/480430_1_En_2_Chapter/480430_1_En_2_Fig6_HTML.jpg](img/480430_1_En_2_Fig6_HTML.jpg)\n\
  \n图 2-6\n\n在集成终端中执行来自 .py 文件的代码\n\n![../images/480430_1_En_2_Chapter/480430_1_En_2_Fig5_HTML.jpg](img/480430_1_En_2_Fig5_HTML.jpg)\n\
  \n图 2-5\n\n使用 IDE 创建一个简单的 .py 文件\n\n\n\n### 语言结构与含义\n\n本节简要介绍 Python 编程语言的语法和语义，这有助于更轻松地解释、实现和动态编码多种编程范式。如需深入讨论其中任一概念，可参考\
  \ Python 编程语言的作者吉多·范罗苏姆 [5]。Python 简洁一致的设计基于“应该有一种——且最好只有一种——显而易见的方法来完成它”的哲学，正如*Python\
  \ 之禅* [6] 中所提到的。\n\n语言的结构或形式构成了编程语言的语法。它通常包含三个层次——单词、短语和上下文——这些层次定义了编写程序的规则。语法不提供有关命令含义或执行的任何信息。另一方面，语言的语义由代码背后的含义及其预期提供的结果来定义。本章列出了该语言背后的一些规则和含义。\n\
  \nPython 是一种区分大小写的语言；例如，`test_variable` 和 `Test_Variable` 被视为两个不同的对象。与其他一些编程语言不同，Python\
  \ 不需要命令终止符。例如，不需要在每个语句后使用分号（`;`）。但是，如果需要在同一行代码中执行两个不同的语句，则可以使用分号将它们分隔开，如下所示。\n\n\
  ```\ntest_var = 10; print (test_var)\n```\n\n*输出*\n\n```\n\n```\n\n空白字符限制了流程控制，但不会影响代码。这在以下代码片段中得到了说明。\n\
  \n```\nx1 = 10*2\nx2 = 10 * 2\nx3 = 10   *    2\nprint(x1)\nprint(x2)\nprint(x3)\n\
  ```\n\n*输出*\n\n```\n\n```\n\n缩进对于定义代码块的开始至关重要，并指示一组一起执行的语句。这就是空白字符起作用的情况。Python\
  \ 不使用花括号（`{}`）来定义代码块，因此缩进是区分代码块与其余代码的关键。例如，以下 `'for'` 循环显示，由于循环重复，缩进的代码打印 `'Count'`\
  \ 三次，但语句 `'Outside the loop'` 仅打印一次。\n\n```\nvar_length = 3\nfor i in range(var_length):\n\
  # 缩进的代码块，是循环的一部分\nprint('Count', i)\nprint ('Outside the loop') # 不是循环的一部分\n```\n\
  \n*输出*\n\n```\nCount 0\nCount 1\nCount 2\nOutside the loop\n```\n\n正斜杠用于为目录分配路径，因为\
  \ Python 遵循 UNIX 风格的路径规范。例如，Windows 中文件夹的相对路径 `C:\\Desktop\\Python\\Code` 需要更改为路径\
  \ `C:/Desktop/Python/Code`*。*\n\n字符串可以用单引号（‘ ’）、双引号（“ ”）或三引号（‘“ ”’）表示。惯例是使用单引号表示单词字符串，双引号表示句子，三引号表示段落或文档字符串。\n\
  \n```\nword = 'Example'\nsentence = \"This is an example of a sentence\"\npara =\
  \ '''This is a paragraph \n```\n\n对于用三引号（`'''`）括起来的多行语句，注释是代码中不可或缺的一部分，用于解释程序员的思考过程，并帮助其他人理解代码的意图。在\
  \ Python 中，单行注释可以用井号（`#`）开头，而多行注释（注释块）可以用三引号括起来。\n\n为了更深入地了解代码风格和格式，建议阅读 PEP8 风格指南\
  \ [7]，它可以帮助读者以更有条理和一致的风格编写代码。\n\n## Python 中一切都是对象吗？\n\nPython 是一种面向对象的编程语言，并将一切视为对象。与其他编程语言相比，Python\
  \ 中对*对象*的定义较为宽松，某些对象不一定需要具有属性或方法。也不是所有对象都可以被子类化。该语言的创建者吉多·范罗苏姆 [8] 希望“所有可以在语言中命名的对象（例如，整数、字符串、函数、类、模块、方法等）都具有同等的地位”，因此将它们归类为“一等公民”。换句话说，每个对象都可以赋值给变量、作为列表的成员、用作字典中的键值对，或作为参数传递。\n\
  \nPython 作为一种动态类型和解释型语言的优势之一在于定义变量的方式非常简单。在这种情况下，数据类型会在程序执行期间进行检查，并且源代码会被翻译。\n\n\
  在 Python 中，每个变量名仅绑定到一个对象。通常，赋值运算符执行此操作。当将值赋给变量时，在许多编程语言中，它被认为是以容器或内存桶的形式存储的 [4]。在\
  \ Python 中，这最好表示为指针而不是容器。这也是为什么没有声明*数据类型*的原因之一，而这在其他语言中非常常见。以下代码片段提供了变量名如何指向任何类型对象的示例。\n\
  \n```\nvar1 = 5 # var1 是一个整数\nvar2 = 'This is a String' # var2 是一个字符串\nvar3 = [1,2,3]\
  \ # var3 是一个列表\n```\n\n有不同类别的运算符可用于对数据执行多种操作。下面列出了一些。\n\n*   算术运算符（加法、减法、取模等）\n\
  *   位运算符（AND、OR、XOR 等）\n*   赋值运算符（+=、/= 等）\n*   比较运算符（<=、!= 等），输出布尔值（即 True 或 False）\n\
  *   布尔运算（and、or、not 等），输出布尔值（即 True 或 False）\n*   身份和成员运算符（is、is not、not in 等）\n\
  \n### 数据结构\n\n程序中常用的基本内置数据类型包括整数、浮点数、复数、布尔值、字符串和 None 数据类型。除了这些基本类型之外，本节还将讨论一些其他的数据结构。这些复合类型的数据结构包括列表、元组、字典和集合。结合每种情况的示例进行简要描述，可以帮助我们理解它们的格式以及可能使用的不同方式。\n\
  \n建议读者参考 Python 文档 [9] 以获取每种数据结构的详细说明。\n\n\n\n#### 列表\n\n列表（List）是用方括号（`[]`）括起来的元素集合，是一种有序且可变的数组，元素之间用逗号分隔，可以包含不同的数据类型，如整型、浮点型、字符串等。列表中允许存在重复元素。嵌套列表是“列表的列表”，常用于表示二维矩阵。列表及其元素有多种访问方式。索引从\
  \ 0 开始，0 代表列表的第一个元素。\n\n负索引也可以访问列表中的元素，其中最后一个元素的索引为 –1，倒数第二个为 –2，以此类推。有多种方法可用于访问或修改列表中的元素。一些示例包括\
  \ `append()`、`pop()`、`count()`、`sort()` 等等。由于列表是可变的，因此可以修改/更改列表中的元素，也可以合并多个列表。\n\
  \n```\n# 列表\nlist1 = [1,2,3] # 包含整数值的简单列表\nlist2 = [1,None,'Python',3.14] # 包含混合数据类型的列表\n\
  # 嵌套列表\nlist3 = [ [1,2,3], [10,20,30], ['示例', '嵌套', '列表']]\nlist4 = [1,2,3,3,2,2,2,1,5,8,0]\
  \ # 包含重复元素的列表\nprint(list1[0])\nprint(list2[-2])\nprint(list3[2][1])\nprint(list4.count(2))\n\
  print(list3[2][1:3])\nprint(list1 + list2)\n```\n\n*输出*\n\n```\n\nPython\n嵌套\n\n\
  ['嵌套', '列表']\n[1, 2, 3, 1, None, 'Python', 3.14]\n```\n\n#### 元组\n\n元组（Tuple）用圆括号\
  \ `()` 括起来，与列表非常相似，主要区别在于其不可变性（不可更改）。元组通常包含一个异构的元素序列，通过解包或索引进行访问。与列表一样，元素是有序的，并用逗号分隔。元素的访问方式与列表相同，索引也从\
  \ 0 开始。与列表类似，负索引可以访问元组中的元素，其中最后一个元素的索引为 –1，倒数第二个为 –2，以此类推。元组可用的方法包括 `count()` 和\
  \ `index()`。使用元组而非列表的优势包括：与等效列表相比执行速度更快，以及在我们不希望数据被修改的情况下使用。\n\n```\n# 元组\ntuple1\
  \ = (1,2,3) # 包含整数值的简单元组\ntuple2 = (1,None,'Python',3.14) # 包含混合数据类型的元组\n# 嵌套元组\n\
  tuple3 = ([1,2,3], [10,20,30], ['示例', '嵌套', '元组'])\ntuple4 = (1,2,3,3,2,2,2,1,5,8,0)\
  \ # 重复元素\nprint(tuple1[0])\nprint(tuple2[-2])\nprint(tuple3[2][1])\nprint(tuple4.count(2))\n\
  print(tuple3[2][1:3])\nprint(tuple1 + tuple2)\n```\n\n*输出*\n\n```\n\nPython\n嵌套\n\
  \n['嵌套', '元组']\n(1, 2, 3, 1, None, 'Python', 3.14)\n```\n\n#### 字典\n\n字典（Dictionary）用花括号（`{}`）括起来，是另一种复合数据类型，有时也称为关联数组，由一组键值对组成。它与列表有某些相似之处，因为这两种数据类型都是可变的、动态的（可增加或减少大小），并且可以嵌套（字典中的字典）。主要区别在于元素的访问方式。字典元素通过键而不是索引位置来访问。也可以使用内置函数\
  \ `dict()` 创建字典，如下例所示。字典的一个限制是给定的“键”只能出现一次。字典的一些常用方法包括 `clear()`、`items()`、`keys()`、`values()`\
  \ 和 `pop()`。\n\n```\n# 字典\ndict1 = {\n'德克萨斯州': '二叠纪盆地',\n'科罗拉多州': ' DJ 盆地',\n'北达科他州':\
  \ '威利斯顿盆地'\n}\n# 嵌套字典\ndict2 = dict(\n美国 = {'埃克森美孚', '雪佛龙', '康菲'},\n英国 = 'BP',\n\
  收入 = [279.3, 158.9, 38.73, 303.7])\nprint(dict1)\nprint(dict2)\n```\n\n*输出*\n\n\
  ```\n{'德克萨斯州': '二叠纪盆地', '科罗拉多州': ' DJ 盆地', '北达科他州': '威利斯顿盆地'}\n{'美国': {'康菲', '雪佛龙',\
  \ '埃克森美孚'}, '英国': 'BP', '收入': [279.3, 158.9, 38.73, 303.7]}\n```\n\n#### 集合\n\n\
  集合（Set）用花括号（`{}`）括起来，元素之间用逗号分隔，是一个无序的元素集合。由于元素没有特定的顺序，因此索引在集合中没有意义。集合可以包含不同数据类型的元素，但这些元素必须是唯一的且不可变的。然而，集合本身是可以改变的，并且可以向其中添加/删除元素。\n\
  \n使用集合的一大优势是能够执行数学运算，如并集、交集、对称差集等。尽管元素可以是不同的数据类型，如整型、浮点型或字符串，但集合不能包含可变元素（如列表或字典）作为其元素。下面是一个示例，展示了如何更新集合的元素以及打印两个集合的并集。集合可用的方法包括\
  \ `add()`、`clear()`、`discard()`、`intersection()` 和 `pop()` 等。\n\n```\n# 集合\nset1\
  \ = {1,2,3} # 包含整数值的简单集合\nset2 = set((1,None,'Python',3.14)) # 包含混合数据类型的列表\n# 会报错\n\
  # set3 = {[1,2,3], [10,20,30], ['示例', '嵌套', '列表']}\nset4 = {1,2,3,3,2,2,2,1,5,8,0}\
  \ # 包含重复元素的集合\nprint(set1)\nprint(set2)\n# print(set3)\nprint(set4)\n```\n\n*输出*\n\
  \n```\n{1, 2, 3}\n{3.14, 1, 'Python', None}\n{0, 1, 2, 3, 5, 8}\n```\n\n### 控制流工具与迭代器\n\
  \n控制流是指需要重复执行某段代码块以完成操作的情况。一些简单的条件语句包括 `if`、`elif` 和 `else`，它们使用布尔条件来执行一组命令。这些概念的实现通过一个示例来说明，我们假设一个只有三种岩石渗透率类别的简单情况。缩进和冒号（`:`）的使用是\
  \ Python 语法的一部分。\n\n```\n# if-elif-else 示例\nperm = 0.001 # 输入，单位为毫达西\nif (perm >\
  \ 0.0001):\n    print('这是毫达西级别，似乎是砂岩或石灰岩！')\nelif(perm == 1E-6):\n    print('这是微达西级别，似乎是致密砂岩！')\n\
  else:\n    print('这是纳达西级别，似乎是页岩！')\n```\n\n*输出*\n\n```\n这是毫达西级别，似乎是砂岩或石灰岩！\n```\n\
  \n另一方面，循环控制语句主要有两类：基于循环次数的或由事件控制的。循环控制的示例包括 `for`、`while`、`break`、`continue` 和 `pass`。`for`\
  \ 语句属于第一类，它对列表中的每个项目或循环次数执行循环。`while` 语句在特定条件为真时执行。在某些情况下，需要强制退出循环，此时使用 `break`。当需要跳过当前循环的剩余部分进入下一次迭代时，使用\
  \ `continue`。\n\n```\nfor i in range(3):\n    print('进入循环，计数为', i)\nprint('循环执行完毕！')\n\
  ```\n\n*输出*\n\n```\n进入循环，计数为 0\n进入循环，计数为 1\n进入循环，计数为 2\n循环执行完毕！\nwhile (perm<1E-6):\n\
  \    print('渗透率极低，典型非常规井！')\nelse:\n    print('不是非常规井！')\n```\n\n*输出*\n\n```\n不是非常规井！\n\
  ```\n\n\n\n## 基本面向对象编程\n\n在项目开发过程中，经常会遇到需要用不同参数重复执行某段代码的情况。代码被组织成更可复用的模块，这些模块被称为*函数*。在\
  \ Python 中，可以通过 `def` 或 `lambda` 语句创建函数。下面展示了一个用于单位转换的函数示例。每次需要再次转换单位时，只需调用该函数并传入新参数即可。\n\
  \n```\n# 用于转换泥浆重量单位的函数\ndef unit_conversion(a):\n\"\"\"\n该函数用于转换泥浆重量单位。\n输入：泥浆重量（kg/m3）\n\
  输出：泥浆重量（ppg 或 psi/ft 或比重）\n\"\"\"\nprint('输入的泥浆重量（kg/m3）为：', a)\nmw_ppg = a * 0.0083454\n\
  mw_psift = a * 0.000434\nsp_gravity = a * 0.001\nprint('泥浆重量（ppg）：', mw_ppg)\nprint('泥浆重量（psi/ft）：',\
  \ mw_psift)\nprint('比重：', sp_gravity)\n# 输入泥浆重量（kg/m3）\nmud_weight = 1250\nunit_conversion(mud_weight)\n\
  ```\n\n*输出*\n\n```\n输入的泥浆重量（kg/m3）为：1250\n泥浆重量（ppg）：10.43175\n泥浆重量（psi/ft）：0.5425\n\
  比重：1.25\n```\n\n当我们在代码中仅将函数作为语句块使用时，这被称为面向过程的编程方式。然而，还有另一种编写更复杂、更有组织程序的方法，通常被称为*面向对象编程*（OOP）。数据和功能（即属性和行为）被封装在类和对象中，这是\
  \ OOP 的两个主要方面。类创建了与特定特征相关的用户自定义数据结构。它可以被看作一个蓝图，可以用不同的实例来填充。在类内部创建包含属性的不同对象。下面展示了一个简单类的示例。该示例说明了如何将“井”作为一个类，其属性包括\
  \ API 编号、盆地和产量。关于类的更详细描述，建议参考 [11]。\n\n```\nclass well():\n# 类属性\nwell_type = 'oil\
  \ well'\n# 初始化器\ndef __init__(self, api, basin, oil_prod, gas_prod):\nself.api =\
  \ api\nself.basin = basin\nself.oil_prod = oil_prod # 桶\nself.gas_prod = gas_prod\
  \ # 千立方英尺\n# 实例方法\ndef boe_calc(self):\nboe = self.oil_prod + self.gas_prod/5.8\n\
  return boe\n# 实例化类\nwell_1 = well(12345, 'Williston', 1000, 5000)\n# 调用类的方法\nprint(well_1.boe_calc())\
  \ # well_1 的桶油当量产量\nwell_2 = well(78910, 'Permian', 2000, 6000)\nprint(well_2.boe_calc())\
  \ # well_2 的桶油当量产量\n```\n\n*输出*\n\n```\n1862.0689655172414\n3034.4827586206898\n\
  # 访问实例属性\nprint('第一口井的 API 编号为：', well_1.api, '，位于', well_1.basin, '盆地')\nif well_1.well_type\
  \ == 'oil well':\nprint(\"{0} 属于 {1} 类别\".format(well_1.api, well_1.well_type))\n\
  ```\n\n*输出*\n\n```\n第一口井的 API 编号为：12345，位于 Williston 盆地\n12345 属于 oil well 类别\n\
  ```\n\n## Python 库\n\n在接下来的部分中，将简要讨论一些最流行的库，包括 pandas、NumPy 和 Matplotlib。另一个常用的\
  \ Python 库是 scikit-learn，用于机器学习，将在后续章节中介绍。\n\n### pandas：数据分析库\n\npandas 是一个开源库，其名称源于术语*面板数据*，常用于多维结构化数据集的数据分析。Pandas\
  \ 可以接受多种格式的数据文件作为输入，例如 .csv、.xlsx、.json、.html 以及其他许多常用格式。数据随后可以组织成由行和列组成的数据框形式。一旦数据转换为数据框，就可以使用多种不同的方法进行数据探索。还可以从数据框本身获取统计信息，如均值、中位数和标准差。\n\
  \n本章以北海 Volve 油田的一个数据集为例。导入数据后，通过查看数据类型和描述性统计进行简要的*探索性数据分析*（EDA）。通过删除 NA 值来清理数据，尽管更全面的\
  \ EDA 过程包括多个步骤，例如数据插补、异常值分析以及初步特征选择。还会导入另一个具有相同标题信息但属于不同井的数据集，并将两个数据框合并。\n\n该数据集包含以下可供分析的岩石物理信息。\n\
  \n*   井数：2\n\n*   井名：15/9-19 A 和 15/9-19 BT2\n\n*   BVW (V/V)：总体积含水率\n\n*   CARB_FLAG\
  \ (无量纲)\n\n*   COAL_FLAG (无量纲)\n\n*   KLOGH (mD)\n\n*   PHIF (V/V)：裂缝孔隙度\n\n*  \
  \ RHOFL (G/CM3)：流体体积密度\n\n*   RHOMA (G/CM3)：骨架体积密度\n\n*   RW (OHMM)：水电阻率\n\n*  \
  \ SAND_FLAG (无量纲)\n\n*   SW (V/V)：含水饱和度\n\n*   TEMP (DEGC)：温度（摄氏度）\n\n*   VSH (V/V)：泥质含量\n\
  \n*   LITHOTYPE：岩石特征\n\n```\nimport pandas as pd\n# 将 .csv 文件作为数据框导入\ndata = pd.read_csv('data/15_9-19_A_CPI_LITHO.csv')\n\
  # 数据以包含行和列的表形式导入\ndata # 整个数据集\n```\n\n*输出*\n\n![../images/480430_1_En_2_Chapter/480430_1_En_2_Figa_HTML.jpg](img/480430_1_En_2_Figa_HTML.jpg)\n\
  \n以下代码片段获取构成数据框的索引和不同列。要访问元素/列，可以使用列名或数字索引。\n\n```\nprint(data.index)\nprint(data.columns)\n\
  ```\n\n*输出*\n\n```\nRangeIndex(start=0, stop=3008, step=1)\nIndex(['COMMON_WELL_NAME',\
  \ 'DEPTH (M)', 'BVW (V/V)', 'CARB_FLAG (UNITLESS)',\n'COAL_FLAG (UNITLESS)', 'KLOGH\
  \ (MD)', 'PHIF (V/V)', 'RHOFL (G/CM3)',\n'RHOMA (G/CM3)', 'RW (OHMM)', 'SAND_FLAG\
  \ (UNITLESS)', 'SW (V/V)',\n'TEMP (DEGC)', 'VSH (V/V)', 'LITHOTYPE'],\ndtype='object')\n\
  ```\n\n理解一维（序列）和二维（数据框）操作非常重要，下面将对其进行定义。\n\n*   **序列**：一个数组，其中索引被分配给一个值\n\n*   **数据框**：一个二维数组，其中索引被分配给多个值，并且可以包含多个列\n\
  \n如果你想合并来自不同来源的数据集，可以通过多种方式组合它们。下面简要介绍语法中使用的不同参数。\n\n```\npd.merge(left, right,\
  \ how, on)\n```\n\n这里，前两个参数表示需要合并的第一个和第二个数据框，通常称为*左*数据框和*右*数据框。`how` 参数定义要执行的合并类型，可以是以下之一。\n\
  \n*   how = ‘outer’ 允许你取数据集的并集并将它们附加在一起。\n\n*   how = ‘inner’ 允许你取数据集的交集，仅保留共同的值。\n\
  \n*   how = ‘left’。包含左数据框的所有索引。如果某些索引不存在于‘左’数据框中，则它们不会包含在合并后的数据集中。\n\n*   how =\
  \ ‘right’。包含右数据框的所有索引。如果某些索引不存在于‘右’数据框中，则它们不会包含在合并后的数据集中。\n\n关键字 `on` 决定数据框是否基于某个唯一标识符（例如，油气井的\
  \ API 编号）进行合并。\n\n```\n# 从另一个文件合并数据\n# 使用另一口井的数据并合并数据框\ndata2 = pd.read_csv('data/15_9-19_BT2_CPI_LITHO.csv')\n\
  data_combined = pd.merge(data, data2, how=\"outer\", on = None)\n```\n\n\n\n###\
  \ NumPy：科学计算\n\n这是 Python 中一个常用于科学计算的库，它使用多维数组对象。创建 NumPy 数组是一个直接的过程。接下来展示了使用不同方法创建\
  \ NumPy 数组的示例。\n\n```\n# 导入库\nimport numpy as np\narray1 = np.array([1,2,3,4])\n\
  array2 = np.array([1,None,'Python',4.19])\narray3 = np.array([[(1,3.14,6),(1,2,3)],\
  \ [(100,200,300), (99,9.9,0.99)]])\n# 均匀间隔的值 - 步长\narray4 = np.arange(5, 20, 4)\n\
  # 均匀间隔的值 - 样本数量\narray5 = np.linspace(0,100,9)\narray6 = np.random.randint(10, size=6)\
  \  # 一维数组\nprint(array1)\nprint(array2)\nprint(array3)\nprint(array4)\nprint(array5)\n\
  print(array6)\n```\n\n*输出*\n\n```\n[1 2 3 4]\n[1 None 'Python' 4.19]\n[[[  1\\.\
  \     3.14   6\\.  ]\n[  1\\.     2\\.     3\\.  ]]\n[[100\\.   200\\.   300\\.\
  \  ]\n[ 99\\.     9.9    0.99]]]\n[ 5  9 13 17]\n[  0\\.   12.5  25\\.   37.5  50\\\
  .   62.5  75\\.   87.5 100\\. ]\n[6 7 3 6 1 1]\n```\n\nNumPy 支持数学运算（加法、对数等）和数组排序。以下代码片段展示了一个简单示例。要全面了解可用的\
  \ NumPy 操作，我们建议您参考 NumPy 文档 [12]。\n\n```\n# 数组数学运算 - 两种不同方法\nprint(array1 + array4)\n\
  print(np.add(array1, array4))\nprint(np.log(array1))\n# 数组排序\narray6.sort(axis=0)\n\
  print(array6)\n```\n\n*输出*\n\n```\n[ 6 11 16 21]\n[ 6 11 16 21]\n[0\\.         0.69314718\
  \ 1.09861229 1.38629436]\n[1 1 3 6 6 7]\nprint(\"维度数量: \", array3.ndim)\nprint(\"\
  数组形状:\", array3.shape)\nprint(\"数组大小: \", array3.size)\n```\n\n*输出*\n\n```\n维度数量:\
  \  3\n数组形状: (2, 2, 3)\n数组大小:  12\n```\n\n通过索引访问 NumPy 数组中的元素与访问列表中的元素非常相似。对于多维数组，可以使用逗号分隔的索引元组来访问元素。*切片操作*也非常相似。NumPy\
  \ 中还提供了其他一些更常用的数组操作例程，这些在 NumPy 数组操作文档 [13] 中有描述。接下来展示了一些简单的数组操作示例。\n\n```\ni =\
  \ np.append(array6, [25,26,27])\nprint(i)\nconcat = np.concatenate((array1, array2),\
  \ axis=0)\nprint(concat)\nmean_val = np.mean(array5)\nprint(mean_val)\n```\n\n*输出*\n\
  \n```\n[ 1  1  3  6  6  7 25 26 27]\n[1 2 3 4 1 None 'Python' 4.19]\n50.0\n```\n\
  \n### Matplotlib：Python 数据可视化库\n\nMatplotlib 是最流行的数据可视化库之一，由 John D. Hunter 于 2003\
