  ## 推荐 NFR 中的最优井距


  极限含水率定义了存在水锥的油藏中理论上的最大含水率，它决定了底水油藏中经济可采油量的上限。在此类油藏开采过程中，水锥形成阶段含水率会快速上升，随后在无边界油区（无限大油区）中含水率趋于稳定（极限含水率）。然而，在多井油藏中，每口井均受无流动边界（NFB）约束，含水率不会稳定，而是表现为缓慢的含水率上升/推进速率。这是因为有限边界油藏中的原油被采出，导致含水率缓慢上升。


  如果井的泄油面积足够大，其尺寸超过水锥的横向长度（在水锥形成（扩展）阶段结束时），则对于 NFB 系统，后期含水率缓慢推进阶段主要受油层采出程度控制，因为水锥扩展的影响变得可忽略不计。


  后期含水率可能导致产油不经济，因此井的采收率主要受水锥扩展结束时间控制。这意味着最优井的泄油半径应等于水锥的横向长度，从而使井的原油采收率最大化。这一概念如图
  7-10 所示。该最小井间距定义为阈值井距，或两倍井的阈值泄油半径 [14]。


  ![../images/480430_1_En_7_Chapter/480430_1_En_7_Fig10_HTML.jpg](img/480430_1_En_7_Fig10_HTML.jpg)


  图 7-10


  阈值泄油半径等于水锥横向长度（阈值半径），可实现井的最大采收率




  ### 预测阈值储层半径


  阈值半径可通过大量模拟实验进行统计确定，这些实验针对多种井/储层系统，通过改变包括水平渗透率（k[h]）、各向异性比（![$$ \frac{{\mathrm{k}}_{\mathrm{v}}}{{\mathrm{k}}_{\mathrm{h}}}
  $$](img/480430_1_En_7_Chapter_TeX_IEq6.png)）和穿透比（![$$ \frac{h_{op}}{h_o} $$](img/480430_1_En_7_Chapter_TeX_IEq7.png)）、油层厚度（h[o]）、流度比（M）以及含水层厚度（h[w]）等属性。Box
  和 Behnken 方法可以设计一个模拟实验矩阵 [18]。该设计规定了总共 54 次不同的模拟运行（储层/含水层系统），通过系统性地增大泄油面积直至其等于最大水锥的横向长度来确定阈值半径。然后利用这些结果，通过多元二阶多项式回归，推导出一个用于计算阈值泄油半径
  r[eTh] 的经验公式。


  预测阈值储层半径的公式如下：


  ![$$ {\mathrm{r}}_{eTh}=14920.6-3563.7\mathrm{M}-68.5{\mathrm{h}}_{\mathrm{w}}-34586\frac{{\mathrm{k}}_{\mathrm{v}}}{{\mathrm{k}}_{\mathrm{h}}}+99.65{\mathrm{h}}_{\mathrm{o}}+288{\mathrm{M}}²+0.107{\mathrm{h}}_{\mathrm{w}}²+31290{\left(\frac{{\mathrm{k}}_{\mathrm{v}}}{{\mathrm{k}}_{\mathrm{h}}}\right)}²+1.5\mathrm{M}{\mathrm{h}}_{\mathrm{w}}-0.55M{\mathrm{k}}_{\mathrm{h}}-10.13{Mh}_{\mathrm{o}}-0.087{\mathrm{h}}_{\mathrm{w}}{\mathrm{h}}_{\mathrm{o}}+0.1{\mathrm{k}}_{\mathrm{h}}{\mathrm{h}}_{\mathrm{o}}.
  $$](img/480430_1_En_7_Chapter_TeX_Equ5.png)


  (7.5)


  以下是作为输入参数函数的阈值储层半径预测器的实现。


