  \n图 2-7\n\n用于观察页岩体积 (Vsh) 随深度变化的折线图示例\n\n## 总结\n\nPython 是一门庞大的编程语言，需要不止一本书才能涵盖其所有编程概念；然而，在本章中，我们提供了一个简要的介绍。我们希望您已经了解了基本的数据结构、控制流以及一些标准库。本章为本书提供了必要的编程基础。我们强烈建议您参考原始的\
  \ Python 文档以及本章提到的其他资源。这些资源为不断发展的 Python 编程概念和库提供了最新的描述和解释清晰的示例。\n\n"
- "# 3. 机器学习和深度学习概念概述\n\n在本章中，我们重点探索机器学习和深度学习算法的领域。前一章的数据集在本章中也会用到。此外，我们还将介绍一些新的公开数据集，用于构建机器学习和深度学习模型。在上一章中，您学习了\
  \ Python 编程的基本概念。在本章中，我们将开始使用 Python 编程和相关库来探索数据，并进行数据整理以清理数据，使其能够用作不同机器学习模型的输入。本章分为七个主要部分，从机器学习概述开始。\n\
  \n本节之后是机器学习应用相关的一些通用概念和最佳实践。后续部分将深入探讨探索性数据分析、监督学习、回归和分类算法以及无监督学习算法。另有专门章节介绍深度学习和超参数优化概念及其在特定石油和天然气行业问题中的应用。\n\
  \n## 机器学习\n\n机器学习是一个领域，在该领域中，计算机通过算法进行编程，使其能够从经验中学习和适应，从而在使用指标评估时改进某项任务，而不是明确告知其结果\
  \ [1]。这个定义通过一个简单示例进行解释：任务是识别手写数字，指标是使用人类标注的手写数字图像数据库（作为经验）正确分类的数字百分比。“学习”部分利用大量数据使计算机能够理解底层模式。\n\
  \n随着计算能力的进步和高效机器的出现，过去几年中机器学习算法的效率有了显著提高。机器学习已成功应用的一些领域包括图像识别、文本分析（例如垃圾邮件过滤）、情感分析或信息提取、视频游戏和机器人技术。每一天，机器学习的新应用都在不断涌现。\n\
  \n### 近期进展\n\n机器学习领域的最新进展体现在自动驾驶汽车和自主车辆上，它们拥有多个传感器，可以高频收集实时数据。传感器数据由预训练的机器学习算法处理，为自动驾驶汽车或自主车辆提供“智能”。类似技术也用于激光地形测绘、路径规划和自适应视觉。\n\
  \n机器学习的另一个成功应用在于自动语音识别和语言翻译器，这些功能在智能设备中很常见。基于生成对抗网络（GAN）原理构建的生成模型是机器学习最新进展的另一个例子，通过专门的深度学习模型，可以重建或生成逼真的人脸。\n\
  \n\n\n### 机器学习分类\n\n机器学习算法可分为三大类。\n\n*   **监督学习：** 在监督学习中，期望的输出或响应变量是已知的，机器学习算法提供输入特征与输出变量之间的映射关系。监督学习的两个主要子类是回归问题和分类问题，具体由输出变量的类型决定。当输出变量为连续值时，属于回归问题。\n\
  \n    另一方面，对于分类问题，输出变量包含多个类别或标签。在监督学习中，模型训练过程会持续评估误差并进行改进，直到达到期望的准确度水平。\n\n*   **无监督学习：**\
  \ 在无监督学习中，没有明确的输出变量，关系是基于提供给算法的数据生成的。属于此类别的一些算法可以揭示输入特征之间的隐藏结构和关系。无监督学习的一些例子包括聚类、降维算法和关联规则学习。\n\
  \n*   **强化学习：** 这类算法的设计方式是，算法做出的决策序列会关联一个奖励或惩罚。奖励或惩罚有助于算法学习为实现既定目标而应采取的一系列决策。这些算法使用马尔可夫决策过程（MDP）进行建模。\n\
  \n    强化学习通常被认为是“半监督”学习，但在不确定且可能复杂的环境中，算法会采用试错方法，通过对其执行的动作进行惩罚或奖励来寻找解决方案。工业自动化机器人是强化学习应用的一个例子。\n\
  \n如第 1 章所述，本章的讨论仅限于监督学习和无监督学习算法。\n\n### 模型训练注意事项\n\n由于数据科学工具包中提供了大量算法，有时确定解决某个问题应使用哪种算法会变得具有挑战性。许多算法可以解决同一个问题，并学习输入特征与输出变量之间的关系。然而，不同算法采用的技术和学习过程可能差异显著。\n\
  \n当某些模型参数改变时，一种算法可能优于其他算法。模型训练过程涉及称为*超参数*的附加参数，这些参数可能包括以下内容。\n\n*   模型训练的迭代次数。\n\
  *   每次迭代中使用的训练数据比例（批量大小）。\n*   用于改变模型参数的估计误差比例（学习率）。\n\n这种为学习最优模型参数而调整超参数的迭代过程称为*超参数优化*。我们将在本章后面部分讨论一种简单的超参数优化技术。\n\
  \n除了最优模型参数外，选择最优数量和类型的输入特征也可以提高模型的准确性。这使得特征工程和特征选择成为机器学习过程中非常重要的方面。\n\n需要注意的是，本节我们仅提供所选机器学习算法的基本概述和示例代码实现。要透彻理解每种算法，需要对每种技术进行全面回顾，这在单一书籍章节中是无法实现的。我们鼓励您在将每种算法及其相关模型参数和超参数应用于实际问题之前，深入探索和理解它们。与每种算法相关的参数列表可在相应机器学习库的官方文档中找到。\n\
  \n每种机器学习算法都有三个主要组成部分：*表示、优化*和*评估* [2]。函数以数值、符号、基于实例或概率图模型的形式表示 [3]。为了提高算法性能，会采用优化方法，例如梯度下降、动态规划或进化计算。这些模型的评估通过统计指标进行，可能包括精确率、召回率和均方根误差（RMSE）的计算。\n\
  \n### 机器学习库\n\nScikit-learn 是 Python 中最流行的开源机器学习库之一，它构建于其他开源 Python 库之上，包括 NumPy、SciPy\
  \ 和 Matplotlib。Scikit-learn 最初于 2007 年作为 Google 编程之夏项目的一部分开发。它通过 Python 编程接口提供了广泛的监督和无监督学习算法的实现。\n\
  \nTensorFlow 是另一个由 Google 开发的开源软件库，用于数值计算，在机器学习应用（如浅层人工神经网络和深度学习）中非常流行。TensorFlow\
  \ 允许使用*张量*创建数据流图，张量是进行计算的多维数组。该库旨在支持在多个 CPU 和 GPU 上并行运行，并为多种编程语言（如 Python、C++ 和\
  \ Java）提供封装器。在本书中，我们使用 TensorFlow 2.x 版本。\n\nKeras，在希腊语中意为*角*，是一个开源的高级神经网络库，非常用户友好、模块化，并且易于与\
  \ Python 配合使用。它不像 TensorFlow 那样处理底层计算，而是使用后端引擎来执行模型开发的计算。Keras 默认使用 TensorFlow 后端。\n\
  \n还有许多其他开源库，例如 Theano、PyTorch、OpenCV 和 Apache Spark ML，可用于开发机器学习模型。然而，由于社区广泛采用且功能完备，我们选择\
  \ TensorFlow 作为首选库。\n\n我们不提供算法的数学细节。我们专注于使用标准 Python 库进行机器学习算法的动手实践。请参阅本章末尾的“延伸阅读”部分，查找一些有用的资源，这些资源有助于加深对本章讨论的机器学习算法数学基础的理解。\n\
  \n注意\n\n本章使用的主要 Python 库包括 NumPy、SciPy、Matplotlib、scikit-learn、Keras、TensorFlow\
  \ 2.x、XGBoost、LightGBM 和 Hyperopt。其中一些库应已存在于标准的 Anaconda 安装中。对于缺失的库，请按照各个库的帮助页面中的安装说明进行操作。安装过程可能因操作系统（例如\
  \ Windows 或 Linux）、所用计算机的硬件（是否带有 NVIDIA GPU）等而有显著差异。我们建议您根据您的操作系统和硬件找到合适的安装程序，并在继续阅读本章其余部分之前安装所需的库。\n\
  \n\n\n### 机器学习流水线\n\n机器学习流水线是一系列处理单元（包括进程、线程、例程和函数）以流程图形式排列而成，用于将数据从一种表示形式转换为另一种表示形式。构建机器学习流水线的目标是在注重可重复性和灵活性的同时提升模块化程度。\n\
  \n一个可用于生产环境的机器学习项目需要精心设计的机器学习流水线。模型本身只是端到端流水线中的众多组件之一。机器学习工作流程的其他组件包括数据收集、数据验证与预处理、特征提取、模型选择、训练与验证、预测、评估以及部署。本章的重点是构建机器学习模型。\n\
  \n## 通用概念\n\n在本节中，我们将讨论适用于大多数机器学习模型构建实践的通用概念。\n\n### 数据预处理：归一化与标准化\n\n为了构建机器学习模型，我们需要对数据进行预处理，以确保机器学习算法的计算稳定性。数据预处理中的一个重要步骤是重新缩放输入特征和输出变量（针对回归问题），使其范围保持一致，然后再将其作为输入提供给机器学习算法。为了理解这一概念，我们考虑一个输入特征或输出变量具有不同数据范围的示例。在训练过程中，我们可能会遇到一个范围很大的输入特征，例如累计产量（范围从\
  \ 1000 桶到 100,000 桶）。而另一个特征的范围可能非常小，例如孔隙度（范围从 0.05 到 0.60）。\n\n在迭代训练过程中，与较大值输入特征相关联的模型参数（例如系数或权重）会与较小值输入特征对应的参数存在显著差异。此外，如果输出变量的范围非常大，那么误差指标（如\
  \ RMSE）可能会产生非常大的数值。当使用这个较大的误差值来调整已经相当大的模型参数时，在模型参数的迭代更新过程中，某些值可能会超出计算机能够处理的数值极限。这可能导致计算不稳定，最终导致学习过程中的性能不佳。对输入值的高度敏感还可能引发严重的泛化误差[4]。\n\
  \n在处理具有不同单位和范围的多个特征的数据时，对数据进行预处理以实现更快的训练至关重要，这有助于减少过拟合并获得更准确的预测。例如，在梯度下降优化过程的收敛中就可以观察到这一点[5]。\n\
  \nscikit-learn 库中提供了多种方法，例如标准化、归一化和缩放，可以帮助高效地处理数据。预处理方法的选择取决于算法和参数优化过程。需要提醒的是：这些术语在不同领域的习惯用法中经常互换使用。\n\
  \n#### 归一化\n\n归一化是将数据从原始范围重新缩放，使其值落在 0 到 1 或-1 到 1 范围内的过程。当已知数据的近似上下界、数据中几乎没有或没有异常值、且数据分布接近均匀分布时，可以应用此方法。scikit-learn\
  \ 库提供的用于缩放数据的工具之一是`MinMaxScaler()`，它使用以下公式。\n\n![$$ {X}_{norm}=\\frac{X- Xmin}{Xmax-\
  \ Xmin}. $$](img/480430_1_En_3_Chapter_TeX_Equ1.png)\n\n(3.1)\n\n#### 标准化（Z 分数归一化）\n\
  \n当特征被重新缩放，使其具有均值为零、标准差为一的标准正态分布（钟形曲线的高斯分布）特性时，这个过程称为*标准化*。当机器学习算法假设输入数据呈正态分布时，这一点非常重要。在这种方法中，重新缩放后的值通过以下公式计算。\n\
  \n![$$ z=\\frac{x-\\mu }{\\sigma }, $$](img/480430_1_En_3_Chapter_TeX_Equ2.png)\n\
  \n(3.2)\n\n*其中*z 是标准 Z 分数，*x*是输入数据，*μ*是输入数据的样本均值，*σ*是均值标准差。此方法适用于特征分布中不包含极端异常值的情况。\n\
  \n### 欠拟合或过拟合\n\n当我们训练机器学习模型时，主要目标之一是将其用于对未见过的数据进行预测。一个训练充分的模型应该对未见过的数据展现出与训练数据相同的预测精度。然而，在某些情况下，模型可能无法在未见过的数据上表现良好。这可能是由模型的欠拟合或过拟合引起的。\n\
  \n*   **欠拟合：** 当训练过程过早停止，或者模型接触训练数据不足时，就会发生欠拟合。在这种情况下，模型无法学习到训练数据中存在的通用模式。在训练数据和未见过的数据上预测精度都很差，是欠拟合的指标。\n\
  \n*   **过拟合：** 人们可能会选择使用训练数据集中的所有可用数据对模型进行大量迭代训练，以便模型学习到训练数据中存在的所有模式。结果，模型可能在训练数据上展现出非常高的精度。然而，模型对训练数据调整得过于精细，以至于失去了对未见过的数据进行泛化的能力。在这种情况下，即使模型能够以高精度对训练数据进行预测，它对未见过的数据的预测精度也很差。这种情况表明模型过拟合。\n\
  \n确保模型既不欠拟合也不过拟合非常重要。机器学习模型应该得到充分训练，以便能够以合理的精度对未见过的数据进行预测。换句话说，机器学习模型应该能够进行*泛化*。\n\
  \n\n\n### 数据划分：训练集、验证集与测试集\n\n正如我们刚刚讨论的，过拟合是机器学习模型训练过程中遇到的主要挑战之一。这是由于模型学习了训练数据中的细微细节或噪声所致。在这种情况下，模型开始记忆训练数据。这会导致模型在训练数据上表现良好，但对于未见过的数据，其准确率会显著下降。为了解决过拟合问题并帮助模型更具*泛化*能力，划分数据集被视为一个必要步骤。根据经验法则，数据集通常被分为三个观测集：训练数据、验证数据和测试数据[6]，其定义如下。\n\
  \n*   **训练数据：** 用于模型训练过程的观测子集。算法使用该数据集来学习机器学习模型的参数。\n\n*   **验证数据：** 一个观测子集，用于在训练过程中评估模型的预测性能。通过验证数据观察到的预测误差趋势，有助于确定充分训练所需的迭代次数。在典型的模型训练中，通过迭代训练过程，训练集和验证集的预测误差都应持续下降。然而，如果我们观察到某个点，训练数据的预测误差持续下降，但验证数据的预测误差开始上升，则应停止训练。验证误差开始上升的点，标志着过拟合的开始。\n\
  \n*   **测试数据：** 该数据子集仅用于评估完全训练好的模型的性能。测试数据上的预测准确率，是模型在真实场景中遇到未见数据时性能的指标。\n\n以下代码片段展示了使用\
  \ scikit-learn 工具进行数据集划分的应用。\n\n```\nfrom sklearn.model_selection import train_test_split\n\
  X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42)\n\
  ```\n\n### 模型评估指标\n\n为了理解模型在未见数据集上的泛化程度，并评估其性能，使用一个可以据此评估模型性能的量化指标至关重要。\n\n在本节中，我们将讨论一些用于量化模型预测准确率的评估指标，并据此选择性能最佳的算法。这些指标也取决于问题的类型。对于回归模型中的定量结果，一些常用的指标包括决定系数（*R*²）和均方根误差（RMSE）。*R*²\
  \ 使用以下公式计算。\n\n![$$ {R}²=1-\\frac{S{S}_{res}}{S{S}_{tot}}. $$](img/480430_1_En_3_Chapter_TeX_Equ3.png)\n\
  \n(3.3)\n\n*SS*[*res*] 是残差平方和，*SS*[*tot*] 是总平方和，其数学计算公式如下。\n\n![$$ S{S}_{res}=\\\
  sum {\\left({y}_i-{y}_{reg}\\right)}², $$](img/480430_1_En_3_Chapter_TeX_Equ4.png)\n\
  \n(3.4)\n\n![$$ S{S}_{tot}=\\sum {\\left({y}_i-\\overline{y}\\right)}²\\. $$](img/480430_1_En_3_Chapter_TeX_Equ5.png)\n\
  \n(3.5)\n\n这里，*y*[*i*] 是每个数据点的值，![$$ \\overline{y} $$](img/480430_1_En_3_Chapter_TeX_IEq1.png)\
  \ 是平均值，*y*[*reg*] 是回归模型预测的值。\n\n另一方面，RMSE 指标使用以下公式计算。\n\n![$$ RMSE=\\sqrt{\\sum\
  \ \\limits_{i=1}^n\\frac{{\\left(\\hat{y_i}-{y}_i\\right)}²}{N}}, $$](img/480430_1_En_3_Chapter_TeX_Equ6.png)\n\
  \n(3.6)\n\n其中 ![$$ \\hat{y_i} $$](img/480430_1_En_3_Chapter_TeX_IEq2.png) 是回归模型预测的值，*N*\
  \ 是观测数量。\n\n对于分类问题，模型准确率定义为正确预测数量与总预测数量的比率。对于一个包含 *N* 个不同类别的分类问题，还会使用*混淆矩阵*或*误差矩阵*，它是一个\
  \ *N*×*N* 的矩阵，主对角线上包含 *N* 个正确分类，其余可能的错误位于非对角线元素上。该矩阵提供了一种可视化方法来评估机器学习模型在分类问题上的性能。图\
  \ 3-1 展示了二分类（两个类别）混淆矩阵的示例。\n\n![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig1_HTML.jpg](img/480430_1_En_3_Fig1_HTML.jpg)\n\
  \n图 3-1\n\n混淆矩阵示意图，其中 P = 正类，N = 负类，TP = 真正例；FP = 假正例；TN = 真负例；FN = 假负例\n\n基于该矩阵，可以确定一些准确率指标，包括精确率、召回率和\
  \ F1 分数。\n\n#### 精确率\n\n精确率定义为对于给定类别，真正例（正确预测）样本数量与预测为该类别的总样本数量的比率。高精确率输出表明，在模型预测属于给定类别的样本中，大多数样本确实属于该类。\n\
  \n![$$ Precision=\\frac{True\\ Positive}{True\\ Positive+ False\\ Positive}. $$](img/480430_1_En_3_Chapter_TeX_Equ7.png)\n\
  \n(3.7)\n\n#### 召回率\n\n召回率定义为真正例样本数量与属于该类别的总样本数量的比率。高召回率表明，属于给定类别的样本中，被错误分类为其他类别的样本非常少。\n\
  \n![$$ Recall=\\frac{True\\ Positive}{True\\ Positive+ False\\ Negative}. $$](img/480430_1_En_3_Chapter_TeX_Equ8.png)\n\
  \n(3.8)\n\n#### F1 分数\n\nF1 分数提供了精确率和召回率的调和平均值。在模型选择过程中，会在多个分类算法中选择具有最高 F1 分数的模型。\n\
  \n![$$ F1=2\\times \\frac{Precision\\times Recall}{Precision+ Recall}. $$](img/480430_1_En_3_Chapter_TeX_Equ9.png)\n\
  \n(3.9)\n\n### 可复现的机器学习\n\n机器学习算法为一系列工业相关问题提供了比传统方法更好的预测能力。然而，对于工业应用而言，确保模型训练和模型生成的预测结果能够完全复现至关重要。有时，即使使用相同的数据集和相同的算法，也可能难以复现结果并获得相同的性能。\n\
  \n这些差异可归因于多种原因，例如权重的随机初始化、数据集的随机打乱以及多种机器学习算法的随机性。为了解决这个问题，在机器学习算法实现中仔细设置*随机种子*，可以让我们向实现可复现性迈进一步。以下代码片段展示了为操作系统环境变量、Python\
  \ 随机模块、NumPy 和 TensorFlow 设置随机种子的一些示例。\n\n```\nseed_value = 42\n# 使用环境变量设置 Python\
  \ 随机种子\nos.environ['PYTHONHASHSEED']=str(seed_value)\nimport random\n# 使用 Python\
  \ 随机模块设置 Python 随机种子\nrandom.seed(seed_value)\nimport numpy as np\nnp.random.seed(seed_value)\
  \ # 设置 Numpy 随机种子\nimport tensorflow as tf\ntf.random.set_seed(seed_value) # 设置\
  \ TensorFlow 随机种子\n```\n\n\n\n### Bagging 与 Boosting\n\n到目前为止，我们已经讨论了如何选择单个机器学习模型以获得最佳且可重复的性能。然而，在现实场景中，基于单一算法的单个模型可能无法提供最佳解决方案。*集成学习*\
  \ 正是为了应对这一挑战而引入的；它通过使用相同算法训练多个机器学习模型，来构建一个更强大、更稳健的预测模型。\n\n其核心理念是组合多个弱学习器，形成一个强大的学习集成体，从而提供比单个机器学习模型更高的准确率。Bagging\
  \ 和 Boosting 是该类别中最常用的两种技术。它们有助于降低噪声、方差（即避免过拟合）或偏差（即避免欠拟合）。在定义这些概念之前，理解*自助法（Bootstrapping）*\
  \ 很重要，这是一种统计学中使用的重采样技术。在自助法过程中，会从给定的数据集中有放回地随机抽取多个样本。自助法可以量化与统计学习方法相关的不确定性 [7]。\n\
  \n*Bagging* 是 *Bootstrap Aggregation（自助聚合）* 的简称。当在某些机器学习算法（如决策树）中遇到高方差（过拟合）时，Bagging\
  \ 非常有用。它通过并行训练同质弱学习器（即性能较差的模型）来组合它们，并通过平均（回归）或投票（分类）过程提供预测。这个过程会产生一个更稳健的模型，同时降低过拟合的可能性。\n\
  \n另一方面，*Boosting* 也是从同质弱学习器的集成中学习，但采用的是顺序和自适应方式。与 Bagging 旨在减少方差（过拟合）不同，这种方法试图通过基于先前训练的性能较差的模型来训练新模型，从而最小化偏差（欠拟合）。换句话说，Bagging\
  \ 使用等权平均来生成预测，而 Boosting 则使用多个学习器的组合来提供一个性能更好的模型。\n\n### 模型可解释性\n\n在统计学和机器学习领域，众所周知，过于复杂的模型并不总是问题的最佳解决方案。这主要是因为随着模型变得复杂，会损失模型的可解释性。对于许多需要解释模型输出且模型推理是优先级的行业来说，可解释性至关重要。例如，在一个具有多层和多个神经元的深度神经网络中，可能很难解释某个特定输入特征对输出的影响。\n\
  \n这与基于决策树的方法，或者更简单的线性回归模型形成对比，在后两者中，参数的变化直接映射到输出变量的变化。人们投入了大量精力来更好地理解复杂的机器学习算法；然而，这仍然是一个正在进行的研究领域。\n\
  \n## 探索性数据分析 (EDA)\n\n在现实场景中，数据通常不会以完美的格式准备好，可以直接输入到机器学习模型中。机器学习项目的第一步是进行探索性数据分析\
  \ (EDA)，其中包括检测不一致性、检查假设、确定解释变量之间的关系以及理解特征之间关系的步骤 [8]。\n\n探索性数据分析是理解和准备机器学习模型数据的关键过程。EDA\
  \ 中的一些步骤包括变量识别、单变量和双变量分析、缺失值处理、异常值移除以及额外变量的转换或创建。EDA 的目的在于更好地理解数据及其假设，提高数据质量，并通过发现数据趋势的线索来生成分析假设\
  \ [9]。这涉及使用汇总统计和可视化技术来回答关于给定数据的问题。\n\n本节对第 2 章中使用的油气数据进行了简要的探索性分析。我们继续上一章的分析，其中来自两口井的数据已被合并。合并后的数据集作为输入，并生成一个数据框来执行\
  \ EDA。以下代码输出显示了合并后数据框的大小。\n\n```\nShape of the dataset (rows, columns): (5127, 15)\n\
  ```\n\n如图 3-2 所示，该数据框包含多个 NA 值，需要移除这些值以清理数据集。从图中可以看出，多个特征列存在 236 个缺失值，这些都需要处理。在这种情况下，由于\
  \ NA 出现在同一组数据点上，我们选择删除这些值，而不是进行插补（即替换缺失值）。一旦从数据集中移除 NA 值，数据框的新形状如下所示。\n\n![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig2_HTML.jpg](img/480430_1_En_3_Fig2_HTML.jpg)\n\
  \n图 3-2\n\n数据集中缺失值或 NA 值的直方图\n\n```\nShape of the dataset (rows, columns): (4818,\
  \ 15)\n```\n\n下一步是研究数据集中特征的描述性统计。图 3-3 显示了数据框的描述性统计。\n\n![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig3_HTML.jpg](img/480430_1_En_3_Fig3_HTML.jpg)\n\
  \n图 3-3\n\n数据框的描述性统计\n\n下一步是查看特征的分布。在图 3-4 中，以一些特征为例进行了展示。VSH (V/V) 是其中一个特征，它显示出偏态，这可能是由于出现了范围更广的较少出现的值或存在异常值。观察异常值存在的一个简单方法是通过箱线图。图\
  \ 3-5 展示了同一组特征的箱线图示例。再次查看特征 VSH (V/V)，您可以看到一些点远在上四分位数范围之外。在本节中，不涉及异常值分析。但是，您可以采取额外的过滤步骤来移除数据中任何现有的异常值。\n\
