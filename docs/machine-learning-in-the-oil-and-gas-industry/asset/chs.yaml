  ```


  ## 总结


  本章讨论了两种不同的产量预测方法，即 Arps 和 ARIMA。以北达科他州某口井的产量数据为例，该信息是从一个公共网站抓取的。使用 Arps 方法进行递减曲线分析是油藏工程领域中传统的预测形式。基于时间序列的
  ARIMA 方法则侧重于统计学，为产量预测问题提供了机器学习的视角。这两种方法的应用证明了它们在解决问题上的有效性。我们鼓励您在日常的产量预测工作中应用这些方法。


  '
- '# 7. 采油工程


  采油工程涉及分析现场数据和模型，以制定如何最优地维持油井和地面生产设施性能的决策。本章涵盖了使用机器学习方法进行生产建模的精选主题。这些主题包括用于预测井产量的模型识别、识别实现最优产量的早期措施，以及识别可能受益于修井作业的生产井。


  ## 采油工程概述


  采油优化涵盖了多种活动，包括测量、分析、建模、排序和实施旨在提高生产效率和盈利能力的措施。采油工程师通常会广泛考虑多种方案，以在技术、经济和环境方面改善生产系统状况。作为一个从油藏源头到销售点的上游一体化生产系统示例，图
  7-1 展示了从储层界面到销售点的煤层气生产系统示意图[1]。


  ![../images/480430_1_En_7_Chapter/480430_1_En_7_Fig1_HTML.jpg](img/480430_1_En_7_Fig1_HTML.jpg)


  图 7-1


  一体化气水生产系统[1]


  流动压力与产液量之间的关系描述了任意时间点的稳态井性能（图 7-2）。油井优化的结果可能是提高油藏的生产能力（左侧），从而在更高的流动压力下获得更高的产液量，和/或减少流出端的限制（右侧），从而在更低的流动压力下增加产液量。


  ![../images/480430_1_En_7_Chapter/480430_1_En_7_Fig2_HTML.png](img/480430_1_En_7_Fig2_HTML.png)


  图 7-2


  沿流入和流出性能曲线的产量增加


  随着过去几十年数字自动化的引入，已经存在一个成熟的技术框架，用于实现一次性或持续的油气田优化[2]。持续优化需要集成现场硬件（例如，井下传感器、远程激活完井设备、地面设施）和能够支持决策的计算机算法，包括数据处理、虚拟传感、模式识别和物理模型集成。


  采油工程通常通过数据分析和物理建模来解决以下问题。


  *   资产（油藏、油井、设施）是否达到了其全部生产潜力？


  *   监测数据揭示了资产健康状况的哪些信息？


  *   限制产量的因素是什么？


  *   产量损失/延迟的最可能原因是什么？


  *   阻止递减、恢复或增加产量的最有效措施是什么？


  *   如果采取某项措施，它是否会成功、盈利且可持续？


  采油工程是一个持续的过程，旨在提高油气田的技术和财务绩效。其目标是以最小的成本和努力最大化有效的生产系统能力。这个循环过程包括常规数据采集、数据分析和信息整合、方案分析与决策，以及详细的工程设计与执行（见图
  7-3）。


  ![../images/480430_1_En_7_Chapter/480430_1_En_7_Fig3_HTML.jpg](img/480430_1_En_7_Fig3_HTML.jpg)


  图 7-3


  采油工程关键流程


  通过常规监测计划捕获了大量种类和数量的数据，这些数据被同化以通过异常识别来发现异常事件。据此，采油工程师分析并整合所有采集的数据，以评估状态、对系统性能进行建模，并确定油井和设施的最佳运行范围。这种分析允许为油井和设施标记关键性能标签。


  *   基于流动状态：活跃健康、活跃不健康、不活跃

  *   基于预期性能：符合预期、高于或低于预期性能

  *   基于问题识别：无、前兆事件、问题、故障

  *   基于潜力和受限产能：油藏、油井、设施、法规、计划性维护




  随着机器学习被引入石油和天然气行业，大量应用已被发布，用于辅助流动状态识别、性能计量、问题识别以及产能约束等方面的研究。


  在油藏层面，有多种方法可用于寻找机会，包括钻新井，或通过堵水、化学增产、补射其他层位、侧钻至油藏其他区域或废弃现有井来修复现有井。生产工程师专注于挑战油井的生产和注入目标、增加注入支持、选择最佳的人工举升系统、清除生产管柱中的固相沉积物等。生产工程师还会审查并确保地面设施（包括仪表、控制、井口、管道、分离器、泵、压缩机、加热器等）的最大可操作性和维护。


  ## 生产优化


  优化生产操作——以最小的努力——可能涉及对生产系统（油藏、井、地面设备）中增产机会进行排序。此外，为了维持精益运营，生产操作需要持续审查流程、管理系统、人员适应性以及智能技术的应用。通常，尽管存在油井性能、地下响应、设备故障率和下游需求的不确定性，也必须做出决策。信息的异质性和当前资产的复杂性意味着需要采用迭代方法来识别可行的机会。管理生产优化机会涉及风险与不确定性的管理。


  生产优化是一个关于生产绩效和资产运营的持续改进过程 [3]。持续的生产优化意味着，通过用更高层级的目标和当前资产状态更新最优预测，来频繁地质疑预期绩效（见图 7-4）。这是通过采取行动来缩小实际绩效与预期绩效之间的差距来实现的。更快的监控回路会比较实际与预期绩效，以确定每分钟、每小时和每天的差距。较慢的监控回路则会更新资产的预期绩效。


  持续生产优化背景下的主要输入包括：(i) 用于标定和验证生产模型的现场数据，(ii) 用于确定资产状态的现场数据，(iii) 井和管道几何结构，以及 (iv)
  先验过程知识。主要输出是：(i) 指示预期或实际绩效的模型响应，(ii) 指示现场诊断的模型失配，(iii) 指示最优解的操作变量变动，以及 (iv) 优化后的预测和假设情景。


  ![../images/480430_1_En_7_Chapter/480430_1_En_7_Fig4_HTML.jpg](img/480430_1_En_7_Fig4_HTML.jpg)


  图 7-4


  持续生产优化循环


  由于生产系统的复杂性（见图 7-1），操作员可以做出众多决策来寻找最优绩效。这些决策可分为短期决策，例如调整油井的操作点和确定油井维护需求，以及长期决策，例如井数、井距和地面设施能力。


  多变量优化技术在石油工业中以多种方式被用于支持决策和完成日常任务，例如资源调度、油藏参数的最优历史拟合、最优井位和井距、生产参数设置 [4] [5]，以及驱替效率或采收率的优化
  [6]。此类优化使用通过第一性原理离线生成的模型，或使用现场采集的数据通过半经验方法生成的模型。


  尽管在石化行业广泛应用，但多变量优化尚未深入渗透到上游行业。在已应用的范围内，它缺乏与实际油田的联系，并且没有考虑纳入动态数据以持续更新模型。


  ## 预测油井产能潜力


  *油井产能潜力*预测是评估油井性能的关键活动，对于确定与当前测量值之间的任何差距是必要的。传统上，对于一口完全穿透单层、裸眼完井且具有圆形泄油区域的垂直井（见图
  7-5），稳态液体产量（*Q*[*Liquid*]）是使用流体在多孔介质中流动的基本方程（方程 6.1）以及从井底到地面的生产系统压降来预测的 [7]。


  ![$$ {Q}_{Liquid}=\left(\frac{k_{ro}}{\mu_o{\beta}_o}+\frac{k_{rw}}{\mu_w{\beta}_w}\right)\left(\frac{kh}{\ln
  \frac{r_e}{r_w}+S}\right)\left({P}_{Res}-{P}_{fbhp}\right). $$](img/480430_1_En_7_Chapter_TeX_Equ1.png)


  (7.1)


  油井产能潜力 *Q*[*Liquid*] 取决于岩石-流体性质，包括油相相对渗透率（*k*[*ro*]）和水相相对渗透率（*k*[*rw*]）；岩石性质，包括绝对渗透率（*k*）和厚度（*h*）；流体性质（油和水的粘度（*μ*[*o*],
  *μ*[*w*]）以及油和水的体积系数（*β*[*o*], *β*[*w*]））；静态油藏压力（*P*[*Res*]）；井筒结构，包括井筒半径（*r*[*w*]）和油藏泄油半径（*r*[*e*]）以及表皮系数（*S*）。通过将井底流动压力（*P*[*fbhp*]）从零变化到静态油藏压力（*P*[*Res*]），可以得到如图
  7-2 所示的油藏流入动态关系（IPR）。


  *P*[*fbhp*] 也是 *Q*[*Liquid*]、流体性质（即初始溶解气油比，*Rsi*；原油密度，^oAPI）的函数。流出系统中的压降取决于井口回压（*P*[*sep*]）、油嘴内径、油管内径（*ID*[*tubing*]）、油管长度（*TVDSS*[*well*]）、井筒倾斜角、井筒长度（*MD*[*well*]）以及油管内的流体（*Q*[*Oil*],
  *Q*[*wat*], *Q*[*gas*]）。


  ## 利用虚拟传感器增强油井感知能力


  在许多情况下，由于传感器故障、技术可用性、仪表可靠性或经济原因，直接的物理测量不可用或与过程性能不一致。在这种情况下，虚拟传感器是物理传感器的便捷替代品，它利用在已安装仪表的油井中已知条件下可用的数据来预测其他测量值
  [8]。许多技术已被开发出来，用于从其他间接测量值（例如，虚拟计量或软传感器）估算产量和压力。


  例如，对于特定的油嘴直径，井口压力（WHP）和温度（WHT）与出油管线压力（FLP）相关；因此，在这四个变量之间建立一个机器学习模型是方便的，这样它可以在需要时作为替代。由于大多数油气井表现出非平稳过程，其边界条件可能随着油井寿命的变化而改变，因此可以稳妥地认为，虚拟传感器模型可能并非在整个油井寿命期间都有效，而仅适用于特定时间段。


  ![../images/480430_1_En_7_Chapter/480430_1_En_7_Fig5_HTML.jpg](img/480430_1_En_7_Fig5_HTML.jpg)


  图 7-5


  带气举的垂直井




  ### 虚拟流量计量


  井监测对于油藏表征、管理生产潜力以及选择增产措施至关重要。监测的关键在于了解井的流动状况（即流量和流动状态）。通常，井的产量（如油、水和气）并非始终直接测量；然而，借助虚拟传感器，可以构建并实施连续的*井产量估算*（WRE），也称为*虚拟产量估算器*（VRE）。虚拟流量计量是虚拟传感器的一种类型
  [9]。


  在石油和天然气行业中，一类广为人知的虚拟产量估算器源自基于物理学的节点分析模型。这种产量估算需要一致的流体物性（PVT）数据、适合用途的生产井测试以及可靠的传感器
  [10]。在这类模型中，数据缺失、数据偏差或传感器故障可能导致产量估算中断，并需要进行新的校准。此外，传感器输入的不确定性和产量估算的置信度在这些方法中通常被忽视
  [11]。


  另一种方法是关注由机器学习算法驱动的数据驱动型 VRE。该过程涉及使用地面实时传感器数据、历史产量和井测试数据，建立预测模型，用于即时预测多相流量、累计产量以及其他关注量（如气油比、含水率）。


  当测量数据充足时，包括频繁的井测试（例如，每年 8-12 次）、永久式井口和地面管线传感器（压力、温度），数据驱动型 VRE 能产生令人鼓舞的结果。井下传感器的可用性是理想的，但并非必需。


  ### 从间接测量值预测井产量


  考虑一口拥有超过 2000 次流量测试的自喷井。使用其中一半的测试数据构建一个用于预测虚拟产量（包括油、水和气）的机器学习模型，并用其预测另一半数据。输入数据指可用的井测量值，包括井底压力（BHP）、井口压力（WHP）、井口温度（WHT）、分离器压力（Psep）、分离器温度（TSep）以及油嘴内径（ID_Choke）。预测输出包括作为所有给定测量值函数的油、水和气产量。


  *   输入数据：“Well_Rates.csv”


  *   Python 代码：“Chapter07_Well_Rate_Predictor_RF_GBM.ipynb”


  该笔记本提供了使用随机森林（RF）回归方法（即产量 = *f* (BHP, WHP, WHT, Tsep, Psep, Choke)）进行油产量预测的简化代码。提供的文件中还包含其他虚拟计量功能。


  ```

  df = pd.read_csv("./data/Well_Rates.csv")

  X = df[["BHP", "WHP", "WHT", "Tsep", "Psep", "Choke_in"]]

  y = np.array(df[["Qoil"]].values).reshape(-1, )

  scaler = MinMaxScaler()  # Scale Data

  ```


  在归一化的 PCA 数据上应用无监督分类（例如，DBSCAN, GMIX），可以在数据进入回归步骤之前筛选出干净的数据。


  ```

  X_scaled = scaler.fit_transform(X)

  pca = PCA()

  X_pca = pca.fit_transform(X_scaled)  # Perform PCA

  pca_df = pd.DataFrame(X_pca)

  # Cluster using DBSCAN

  clustering = DBSCAN(eps=0.5, min_samples=12).fit(X_pca)

  pca_df["DBSCAN"] = clustering.labels_ + 1

  # Keep only the rows where DBSCAN=0

  clust_df = pca_df[(pca_df["DBSCAN"] == 1)]

  # Delete text columns "DBSCAN"

  clust_df.drop(columns=["DBSCAN"],inplace=True)

  # Merge data

  X_merge = X.merge(pca_df,left_index=True,right_index=True)

  X_merge["Labelled Y"] = y

  ```


  创建训练数据，并将数据集拆分为训练集和验证集。


  ```

  # Bring only the Xrows selected as per Clust_df --> # X.iloc[clust_df.index.tolist(),:]

  # Bring only the Yrows selected as per Clust_df --> # y[clust_df.index.tolist()

  train_X, test_X, train_y, test_y = train_test_split(X.iloc[clust_df.index.tolist(),:],y[clust_df.index.tolist()],
  test_size=0.5, random_state=123)

  ```


  构建一个 RF 估算器。


  ```

  # Random Forest Regression

  model_RF = RF(n_estimators=200, random_state=123)

  model_RF.fit(train_X, train_y)

  ```


  对训练集和验证集进行预测。


  ```

  pred_y_RF_test = model_RF.predict(test_X) # Blind test

  pred_y_RF_train = model_RF.predict(train_X)

  pred_y_RF_all = model_RF.predict(X.iloc[clust_df.index.tolist(),:])

  # Compute  r2 scores

  r2_RF_train = r2_score(train_y, pred_y_RF_train)

  r2_RF_test = r2_score(test_y, pred_y_RF_test)

  r2_RF_all = r2_score(y[clust_df.index.tolist()], pred_y_RF_all)

  ```


  包含使用原始数据集的计算，以便进行绘图。


  ```

  # RF to X_merge file

  all_pred = np.array([np.nan for i in range(len(X_merge))])

  all_pred[clust_df.index.tolist()] = pred_y_RF_all

  X_merge["Predicted_RF"] = all_pred

  X_merge.to_csv("X_merge.csv", index=False)

  ```


  准备绘图。


  ```

  # Xplot of predicted and actual values

  fig = plt.figure(figsize=(6,6))

  ax = plt.axes()

  plt.scatter(y[clust_df.index.tolist()], pred_y_RF_all, c="blue")

  plt.scatter(test_y, pred_y_RF_test, c="red")

  ax.set(xlabel="Test Data", ylabel="RF Model Prediction", title="Oil Rate RF Predictor
  Model")

  plt.show()

  ```


  同样的过程可以重复用于 GBM 估算器或您偏好的任何其他算法。RF 和 GBM 回归方法的结果如图 7-6 所示。


