- fmt: '# Stationarity Requirements for the Time Series


    While working with time series modeling algorithms, we need to ensure the data
    is stationary. A stationary time series is one whose statistical properties, such
    as mean, variance, and autocorrelation, are constant over time [[31](#480430_1_En_6_Chapter.xhtml#Par87)].
    By using mathematical transformations, such as logarithms, it is possible to convert
    the data into the form of stationary time series. `Dickey-Fuller` tests can be
    used to find out whether a time series is stationary or not [[32](#480430_1_En_6_Chapter.xhtml#Par88)].


    The decline curve in the example for the well with API: `33025021780000` shows
    the presence of a time trend (usually decreasing for decline curve analysis),
    and seasonality, which makes the local mean a function of time. This proves the
    nonstationary nature of the decline curve, as shown in Figure [6-8](#480430_1_En_6_Chapter.xhtml#Fig8).
    The exponentially weighted moving average approach is used to remove the time
    trend from the data. When the transformation is made, the data loses the trend
    and exhibits a close to the constant rolling mean.


    ![../images/480430_1_En_6_Chapter/480430_1_En_6_Fig8_HTML.jpg](images/480430_1_En_6_Chapter/480430_1_En_6_Fig8_HTML.jpg)


    Figure 6-8


    Oil production data showing the decreasing trend with variable rolling mean indicating
    nonstationary behavior


    By using the method of differences, both seasonality and trends can be removed
    from the data. In this method, a difference of observation at a particular time
    is taken with the preceding observation. First-order differencing can be carried
    out in Python using the `pandas` library and is an effective approach in removing
    seasonality. The implementation is shown in Figure [6-9](#480430_1_En_6_Chapter.xhtml#Fig9),
    which shows the loss of trend and seasonality after the transformations are applied.


    ![../images/480430_1_En_6_Chapter/480430_1_En_6_Fig9_HTML.jpg](images/480430_1_En_6_Chapter/480430_1_En_6_Fig9_HTML.jpg)


    Figure 6-9


    Trend and seasonality removed using log transformation, leading to locally stable
    mean


    Statistical correlation analysis is performed to understand the strength of the
    relationship between two variables. This leads us to *autocorrelation function*
    (ACF) and *partial autocorrelation function* (PACF). ACF is defined as the coefficient
    of correlation between two values in a time series, which can measure the linear
    relationship between an observation at the current time, *t*, and the observations
    at previous times [[33](#480430_1_En_6_Chapter.xhtml#Par89)]. If the time series
    is transformed and the correlation coefficient is obtained, it gives us PACF,
    which is often useful for identifying the order of an autoregressive model. For
    the example discussed, ACF and PACF plots are shown in Figure [6-10](#480430_1_En_6_Chapter.xhtml#Fig10).


    ![../images/480430_1_En_6_Chapter/480430_1_En_6_Fig10_HTML.jpg](images/480430_1_En_6_Chapter/480430_1_En_6_Fig10_HTML.jpg)


    Figure 6-10


    ACF and PACF plots to understand the correlation between variables


    ## ARIMA Components


    If you break down the *autoregressive integrated moving average,* or ARIMA, modeling
    algorithm, each component of the acronym has its own definition. ARIMA models
    time series data for forecasting (i.e., for predicting future points in the series),
    in such a way that the following occurs [[34](#480430_1_En_6_Chapter.xhtml#Par90)]
    [[36](#480430_1_En_6_Chapter.xhtml#Par92)].


    * A pattern of growth/decline in the data is accounted for (hence the *autoregressive*
    component)

    * The rate of change of the growth/decline in the data is accounted for (hence
    the *integrated* component)

    * Noise between consecutive time points is accounted for (hence the *moving average*
    component)


    Each of these components is explicitly specified in the model as a parameter.
    Standard notation is used in ARIMA (*p*, *d*, *q*), where the parameters are substituted
    with integer values to quickly indicate the specific ARIMA model being used [[35](#480430_1_En_6_Chapter.xhtml#Par91)]
    [[37](#480430_1_En_6_Chapter.xhtml#Par93)]. The parameters of the ARIMA model
    are defined as follows.


    * ***p***. The number of lag observations included in the model, which is also
    called the *lag order*

    * ***d***. The number of times that the raw observations are differenced, which
    is also called the *degree of differencing*

    * ***q***. The size of the moving average window, which is also called the *order
    of moving average*


    The autocorrelation and partial autocorrelation functions (ACF and PACF) help
    determine the starting values of these parameters. By observing Figure [6-10](#480430_1_En_6_Chapter.xhtml#Fig10),
    we can observe a sharp decline in the ACF and PACF after a certain number of lags
    (shown on the *x*-axis). By analyzing the lag for this decline, we can estimate
    the parameters of an ARIMA model. The parameter, *p*, for an autoregressive part,
    is determined using the PACF, whereas ACF provides the parameter *q* for the moving
    average part of the model. Based on the observations made in Figure [6-10](#480430_1_En_6_Chapter.xhtml#Fig10),
    we are going to use an ARIMA model with the parameters *p*=2, *d*=1, and *q*=2.
    Next, we show plots for a residual sum of squares (RSS) obtained from the autoregressive
    model (see Figure [6-11](#480430_1_En_6_Chapter.xhtml#Fig11)), the moving average
    model (see Figure [6-12](#480430_1_En_6_Chapter.xhtml#Fig12)), and the combined
    ARIMA model (see Figure [6-13](#480430_1_En_6_Chapter.xhtml#Fig13)).


    ### The Autoregressive Model


    ```

    model_AR = ARIMA(ts_log, order=(2, 1, 0))

    ```


    ![../images/480430_1_En_6_Chapter/480430_1_En_6_Fig11_HTML.jpg](images/480430_1_En_6_Chapter/480430_1_En_6_Fig11_HTML.jpg)


    Figure 6-11


    Autoregressive model with residual sum of squares score of 2.202


    ### The Moving Average Model


    ```

    model_MA = ARIMA(ts_log, order=(0, 1, 2))

    ```


    ![../images/480430_1_En_6_Chapter/480430_1_En_6_Fig12_HTML.jpg](images/480430_1_En_6_Chapter/480430_1_En_6_Fig12_HTML.jpg)


    Figure 6-12


    Moving average model with a residual sum of squares score of 2.207'
