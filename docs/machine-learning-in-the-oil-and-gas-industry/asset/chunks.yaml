    the semivariogram *γ (h)* (often called a *variogram*) of property *Z* is defined
    as


    ![$$ \gamma (h)=\frac{1}{2n(h)}\sum \limits_{n(h)}E\left[{\left(Z\left(u+h\right)-Z(u)\right)}^2\right],
    $$](images/480430_1_En_5_Chapter/480430_1_En_5_Chapter_TeX_Equ1.png)


    (5.1)


    where *n(h)* is the number of pairs that are separated by the distance *h* (also
    called *lag*). It should be noted that the experimental variograms calculated
    using this equation are fitted using an analytical expression, such as a spherical
    variogram model.


    Figure [5-1](#480430_1_En_5_Chapter.xhtml#Fig1) demonstrates the schematic representation
    of the spherical variogram model fit of a variogram *γ (h)*. In Figure [5-1](#480430_1_En_5_Chapter.xhtml#Fig1),
    *r* represents the variogram range. This value indicates the separation from a
    given point over which the correlation between the property values vanishes (i.e.,
    property values are decorrelated). Sill is represented by *s*, which is the value
    of semivariance achieved by the variogram asymptotically. Sill value can be conceived
    as the variance of the property values at two points, located at a distance more
    than the variogram range (*r*). Nugget variance, *n*, is an estimate of the uncertainty
    in the experimental or measured data.


    ![../images/480430_1_En_5_Chapter/480430_1_En_5_Fig1_HTML.jpg](images/480430_1_En_5_Chapter/480430_1_En_5_Fig1_HTML.jpg)


    Figure 5-1


    Schematic depiction of a spherical variogram model


    The variogram may be omnidirectional or isotropic, where it is assumed that the
    same semivariance is observed for a lag value in any direction. It is also possible
    to have an anisotropic variogram, where semivariance depends on the lag value
    and the direction. An example of anisotropic variogram may be to use the same
    variogram model along the lateral directions (e.g., *x* and *y*), and use of a
    separate variogram model along the depth. Kriging techniques rely on variograms
    in the estimation of the petrophysical property value at a point away from the
    wells. Kriging is a form of generalized linear regression, which provides an optimal
    estimator to minimize mean-squared-errors of estimated property values. In this
    chapter, we are not going to discuss details of the kriging techniques. Rather,
    we focus on a machine learning algorithm, which is roughly equivalent to a simple
    kriging algorithm.


    Having access to an open source data set for carrying out a 3D geomodeling exercise
    is the biggest challenge. For this chapter, our objective is to give you a working
    example of petrophysical properties interpolation over a 3D geological model.
    Keeping this in mind, we selected a simple geological model provided by the Society
    of Petroleum Engineers Comparative Solution Project SPE 9 [[3](#480430_1_En_5_Chapter.xhtml#Par48)],
    which is available at [`https://github.com/OPM/opm-data`](https://github.com/OPM/opm-data).
    The SPE 9 model is shown in Figure [5-2](#480430_1_En_5_Chapter.xhtml#Fig2), with
    *permx* (permeability in the *x*-direction) shown in the overlay.


    ## Data Description


    This grid has 24, 25, and 15 cells in the x, y, and z directions, respectively.
    By visually observing the data in this model, we can quickly note two clear features
    of this model. First, the model has a significant level of heterogeneity, and
    second, there is a low correlation between the values in the adjacent cells. The
    hypothesis formed is based on visual observation is examined by a quantitative
    analysis of the data in a later section of this chapter.


    ![../images/480430_1_En_5_Chapter/480430_1_En_5_Fig2_HTML.jpg](images/480430_1_En_5_Chapter/480430_1_En_5_Fig2_HTML.jpg)


    Figure 5-2


    The SPE 9 model is rendered with permx property as an overlay


    This grid has 24, 25,


