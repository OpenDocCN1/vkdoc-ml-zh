- fmt: "### Why Jupyter?\n\nThis process of executing Python code can be thought of\
    \ as a hybrid between the Python interpreter and Python scripts. Some of the added\
    \ advantages provided by Jupyter Notebook include a convenient means of sharing\
    \ work via rich computational and data-driven narratives that mix code, figures,\
    \ data, and text [[4](#480430_1_En_2_Chapter.xhtml#Par137)]. An additional advantage\
    \ of this web-based environment is that it combines all the different pieces like\
    \ code, text, images, equations, and visualization plots, together in one document.\
    \ The notebooks are easily shareable and could be edited on the go since they\
    \ do not have too much dependency on the associated system. This is the primary\
    \ reason why Jupyter Notebooks are used in a teaching/academic environment.\n\n\
    These different approaches are usually selected based on the objectives of the\
    \ code and the amount of experience the user has. For example, data scientists\
    \ in the beginner phase usually start with Jupyter Notebooks since they provide\
    \ an interactive environment without installing a separate IDE (integrated development\
    \ environment). However, software developers typically prefer an IDE since they\
    \ provide more advanced debugging procedures, Git integration, and an integrated\
    \ terminal.\n\nNow that you have learned a few basic things about notebooks, let’s\
    \ write and execute our first Python code.\n\n**Note**\n\nCode snippets used in\
    \ the chapters are provided in the form of Jupyter Notebooks, which can be found\
    \ in the book's code repository. These Jupyter Notebooks provide a comprehensive\
    \ code base, which allows you to navigate through end-to-end problem workflows\
    \ discussed in the book chapters.\n\n## Getting Started with Python\n\nNow, in\
    \ the code cell of the new notebook, let’s type the following code, followed by\
    \ `Ctrl+Enter`.\n\n```\nprint(\"Hello World!\")\n```\n\nYou should see the following\
    \ output.\n\n```\nHello World!\n```\n\nCongratulations! You have written your\
    \ first line of code in Python. In this one line of code, we asked Python interpreter\
    \ to print the words “Hello World!” to the output console. In the subsequent sections\
    \ of this chapter, we are going to take a more detailed look at Python programming.\n\
    \nYou can create a new code cell in the already created notebook for each code\
    \ snippet, and execute the code snippets as we go over different programming concepts\
    \ in this chapter.\n\nThis chapter is focused on the basics of Python programming\
    \ language, which is used in this book for the execution of machine learning algorithms.\
    \ The list of topics covered in this chapter includes the following.\n\n*   Basics\
    \ of the Python programming language\n    *   Executing code (three different\
    \ methods): Python Interpreter, IPython, and `.py` scripts\n    *   Language structure\
    \ and meaning: syntax and semantics of the programming language\n    *   Is everything\
    \ an object in Python? Discussion of variables and operators in Python\n    *\
    \   How can we use numbers and perform operations in Python?\n    *   Why is Python\
    \ considered a dynamic and strongly-typed language?\n*   Data structures: lists,\
    \ tuples, sets, and dictionaries\n*   Control flow tools and iterators: `if`,\
    \ `else`, `for`, and `while` statements\n*   Basic object-oriented programming:\
    \ functions, methods, and classes\n*   Python libraries: How to use the vast library\
    \ of modules and packages available in Python, along with other useful libraries?\n\
    \    *   NumPy: Scientific computing using arrays and matrices\n    *   pandas:\
    \ Data analysis\n    *   Matplotlib: 2D plotting and visualization\n\nThe chapter\
    \ uses an open source dataset from the oil and gas industry and provides a walk-through\
    \ of basics of data analysis and visualization using Python libraries.\n\n## Python\
    \ Basics\n\nA primary difference between a compiled language like C, Fortran,\
    \ or Java and an interpreted language like Python is the execution process. Python\
    \ is a very flexible language that can be easily executed line by line and provides\
    \ multiple different ways to execute code written in Python programming language.\
    \ Three commonly used approaches are provided next.\n\n### Python Interpreter\n\
    \nPython Interpreter offers one of the most basic approaches to execute line-wise\
    \ code. Once Python is installed on a system, running `'python'` on the command\
    \ prompt starts the process. The current version of Python is displayed and followed\
    \ by `>>>`, indicating that Python code can be executed from this point onward\
    \ (see Figure [2-4](#480430_1_En_2_Chapter.xhtml#Fig4)).\n\n![../images/480430_1_En_2_Chapter/480430_1_En_2_Fig4_HTML.jpg](images/480430_1_En_2_Chapter/480430_1_En_2_Fig4_HTML.jpg)\n\
    \nFigure 2-4\n\nUsing Python Interpreter to run line-by-line code\n\n### Python\
    \ Scripts\n\nMore experienced programmers prefer to generate code in the form\
    \ of a script with a `.py` extension. The entire code is executed using a Python\
    \ terminal (see Figures [2-5](#480430_1_En_2_Chapter.xhtml#Fig5) and [2-6](#480430_1_En_2_Chapter.xhtml#Fig6)).\n\
    \n![../images/480430_1_En_2_Chapter/480430_1_En_2_Fig6_HTML.jpg](images/480430_1_En_2_Chapter/480430_1_En_2_Fig6_HTML.jpg)\n\
    \nFigure 2-6\n\nExecuting the code from `.py` file in an integrated terminal\n\
    \n![../images/480430_1_En_2_Chapter/480430_1_En_2_Fig5_HTML.jpg](images/480430_1_En_2_Chapter/480430_1_En_2_Fig5_HTML.jpg)\n\
    \nFigure 2-5\n\nUsing an IDE to create a simple `.py` file"
