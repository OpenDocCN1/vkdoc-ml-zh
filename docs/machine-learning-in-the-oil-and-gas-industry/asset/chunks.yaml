    ### XGBoost: eXtreme Gradient Boosting


    XGBoost is among very powerful and popular machine learning algorithms, which
    provides high accuracy for large datasets due to its optimized implementation.
    This algorithm follows the boosting concept, where weak learners (decision trees)
    are grown sequentially. Each subsequent tree learns based on the prediction errors
    of the previous tree. A higher weightage is given to improving predictions at
    the data points, which exhibited higher MSE in the previous learner. An algorithm
    creates a composite model from weak learners, which provides robust performance.


    The algorithm is designed to optimize performance at higher execution speed. The
    model itself is optimized using a gradient descent algorithm; as a result, it
    provides higher accuracy. Figure [3-14](#480430_1_En_3_Chapter.xhtml#Fig14) shows
