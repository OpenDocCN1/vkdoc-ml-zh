    ```

    {''Texas'': ''Permian Basin'', ''Colorado'': '' DJ Basin'', ''North Dakota'':
    ''Williston Basin''}

    {''USA'': {''Conoco'', ''Chevron'', ''Exxon''}, ''UK'': ''BP'', ''Revenue'': [279.3,
    158.9, 38.73, 303.7]}

    ```


    ### Sets


    Enclosed within a curly brace (`{}`) and separated by a comma, sets are an unordered
    collection of items. Since the elements are not in any particular order, indexing
    has no meaning in sets. Sets can have elements of different data types but they
    have to be unique and must be immutable. However, the set itself can be changed
    and it is possible to add/remove items from it.


    A big advantage of using the sets is the utility of being able to perform mathematical
    operations like union, intersection, symmetric difference and so forth. Although
    elements could be of different data types like `int`, `float` or `string`, a set
    cannot have mutable elements like list or dictionary as its element. An example
    is shown where the elements of a set are updated and the union of two sets are
    printed out. Some of the methods available for set are `add()`, `clear()`, `discard()`,
    `intersection()`, and `pop()`, and so forth.


    ```

    # sets

    set1 = {1,2,3} # simple set with integer values

    set2 = set((1,None,''Python'',3.14)) # list with mixed data types

    # Gives an Error

    # set3 = {[1,2,3], [10,20,30], [''Example'', ''Nested'', ''List'']}

    set4 = {1,2,3,3,2,2,2,1,5,8,0} # set with repeated elements

    print(set1)

    print(set2)

    # print(set3)

    print(set4)

    ```


    *Output*


    ```

    {1, 2, 3}

    {3.14, 1, ''Python'', None}

    {0, 1, 2, 3, 5, 8}

    ```


    ## Control Flow Tools and Iterators


    Control flow is when a certain block of code is required to perform an operation
    in a repeated manner. Some of the simple conditional statements include `if`,
    `elif`, and `else`, which uses a boolean condition to execute a set of commands.
    The implementation of these concepts is illustrated using an example where we
    assume a simple case with only three types of rock permeability category. The
    use of indentations and semicolons (`:`) are a part of Python syntax.


    ```

    # example of if-elif-else

    perm = 0.001 # input in millidarcy

    if (perm > 0.0001):

    print(''This is a millidarcy case, seems to be a sandstone or limestone rock!'')

    elif(perm = 1E-6):

    print(''This is a microdarcy case, seems to be tight sand rock!'')

    else:

    print(''This is a nanodarcy case, seems to be shale rock!'')

    ```


    *Output*


    ```

    This is a millidarcy case, seems to be a sandstone or limestone rock!

    ```


    On the other hand, there are two primary categories for loop control statements,
    which are either based on loop counts or controlled by an event. Examples of the
    loop controls include `for`, `while`, `break`, `continue`, and `pass`. A `for`
    statement belongs to the first category, where a loop is executed for every item
    in a list or a loop count. A `while` statement is executed while a particular
    condition is true. There are cases when the code needs to be forced out of the
    loop, and `break` is used in that situation. `Continue` is used when a remainder
    of a current loop needs to be skipped to another iteration.


    ```

    Code for i in range(3):

    print(''Entered the loop for count'', i)

    print(''Loop Execution is complete!'')

    ```


    *Output*


    ```

    Entered the loop for count 0

    Entered the loop for count 1

    Entered the loop for count 2

    Loop Execution is complete!

    Codewhile (perm<1E-6):

    print(''Very Low Permeability typical for unconventional wells!'')

    else:

    print(''Not an unconventional well!'')

    ```


    *Output*


    ```

    Not an unconventional well!

