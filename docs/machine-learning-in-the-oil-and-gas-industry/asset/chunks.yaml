- fmt: "### Process Challenges and Mitigations\n\nThe following highlights the most\
    \ relevant process-related challenges and suggested mitigating options.\n\n- **Challenge**:\
    \ Companies are continuously stressed with increasing profitability, mostly by\
    \ reducing cost by employing fewer human resources, while leading to longer than\
    \ usual working periods and less safe working sites. Future generations will have\
    \ to do more with less, hence yielding more results per unit time and less unit\
    \ cost.\n  \n  **Mitigation Options**\n  - Automate drilling site operations using\
    \ robotized operations and leveraging advanced data analytics for event detection\
    \ focusing on abnormal critical events (i.e., stuck pipe and lost circulation).\n\
    \  - Automate production monitoring adding continuous data analytics of wellsite\
    \ parameters while enabling routine well analysis via exception-based surveillance\
    \ (EBS) focusing on critical well status.\n  - Implement well and reservoir performance\
    \ analytics for proactive opportunity identification while focusing on high-value-added\
    \ activities [[2](#480430_1_En_8_Chapter.xhtml#Par145)].\n  - AI-assisted complex\
    \ decision-making with an automated routine-action recommendation.\n\n- **Challenge**:\
    \ Managing downtime. One key component of the oil and gas production capacity\
    \ are the time the facility is to be shut down and the instances when it is not\
    \ able to deliver its intended potential. A key challenge is to maintain these\
    \ periods as low-and-predictable as possible. Unintended, unplanned shutdown time\
    \ may derail the unit operating costs significantly.\n  \n  **Mitigation Options**\n\
    \  - Implement data analytics and business processes to predict unplanned events,\
    \ track downtime, production losses (a.k.a. `production deferral`), and causes\
    \ of planned vs. unplanned downtime.\n  - Implement event classification to enable\
    \ root-cause-analysis (RCA) of all unplanned downtime events.\n\n- **Challenge**:\
    \ Disconnected business processes, and difficulties in a functional organizational\
    \ design due to the challenges originating from a silo mentality. For some integrated\
    \ oil and gas companies, key business processes are typically disconnected across\
    \ functions and within the functions.\n  \n  **Mitigation Options**\n  - Implement\
    \ KPIs across functions and share them across the multiple levels of the organization\
    \ using business analytics dashboards.\n  - Define key roles and responsibilities\
    \ that are shared across functions, and share them.\n\n- **Challenge**: At the\
    \ upstream level, production operations, reservoir management, field development,\
    \ and drilling are typically disconnected functions. This hinders global optimization\
    \ of the opportunities for enhancing business performance. Is it better to repair\
    \ a high water producing well or drill a new drain?\n  \n  **Mitigation Options**\n\
    \  - Implement an integrated well performance enhancement opportunity identification\
    \ and ranking process that involves multi-objective constrained global optimization\
    \ objective functions looking at short- and long-term goals.\n  - Faster and reliable\
    \ forecasts based on integrated right-physics approaches leveraging deep learning.\n\
    \n- **Challenge**: At the corporate level, upstream and downstream have very different\
    \ KPIs. Although the sale of raw oil is more profitable, the potential to increase\
    \ revenue is typically constrained by market size; therefore, the option to increase\
    \ profit is to maximize the revenues from downstream products without jeopardizing\
    \ the upstream obligations.\n  \n  **Mitigation Options**\n  - Implement a corporate\
    \ level planning and scheduling process that involves multi-objective constrained\
    \ global optimization looking at short- and long-term goals. This involves using\
    \ gradient-free methods with advanced evolutionary optimization techniques.\n\n\
    ### People Challenges and Mitigations\n\nThe following highlights the most relevant\
    \ people-related challenges and suggested mitigating options.\n\n- **Challenge**:\
    \ Low availability and poor adequacy of the new workforce intensify sustainability\
    \ goals. Young professionals may not have the required level of competencies to\
    \ address the impending challenges and require long times to get trained.\n  \n\
    \  **Mitigation Options**\n  - Incorporate hybrid academic syllabuses in undergraduate\
    \ and graduate-level programs.\n  - Offer public data sets allowing students and\
    \ research community to familiarize themselves with typical data sets, setting\
    \ industry expectations for standard analytics and machine learning problems.\n\
    \  - Implement `enterprise document management` (EDM) and knowledge search leveraging\
    \ `natural language processing` (NLP) to optimize resource utilization through\
    \ better technical information sharing and knowledge leverage.\n  - Implement\
    \ a robotic engineer assistant: chatbots accessing large knowledge base enabled\
    \ with NLP and speech recognition.\n  - Educate new generations faster on what\
    \ matters most (i.e., create undergraduate oil and gas programs with an emphasis\
    \ on machine learning and data analytics).\n\n- **Challenge**: Separation among\
    \ subsurface and digital disciplines. Typically, most engineering and geologic\
    \ disciplines, particularly those individuals with most oilfield acumen, lack\
    \ digital orientation to solve problems involving data, and process automation.\n\
    \  \n  **Mitigation Options**\n  - Implement short on-the-job training programs\
    \ for new employees covering key aspects of machine learning and artificial intelligence\
    \ in the oil and gas industry.\n  - Promote cross-posting projects between technical\
    \ and digital specialties.\n\n- **Challenge**: Managing the silo mentality across\
    \ multidisciplinary teams and organizations is an old challenge across industries\
    \ [[3](#480430_1_En_8_Chapter.xhtml#Par146)]. In such conditions, individuals’\
    \ and teams’ lack of common goals preventing them from sharing key data and information.\
    \ This mentality ultimately affects efficiency and employee morale.\n  \n  **Mitigation\
    \ Options**\n  - Implement collaborative project management providing visibility\
    \ to ongoing work.\n  - Reward teamwork, favoring those who lead new ideas, those\
    \ who share lessons learned, as those who protect and share knowledge.\n  - Provide\
    \ an environment for knowledge sharing and ideas nurturing.\n\n- **Challenge**:\
    \ Managing unplanned and ad hoc work requires people to deviate from their original\
    \ responsibilities, hence derailing corporate objectives. If this becomes the\
    \ normal way of working, then there is a wrong functional design and/or the available\
    \ (human) resources are not enough in quantity and quality.\n  \n  **Mitigation\
    \ Options**\n  - Implement data analytics and business processes to track ad hoc\
    \ work and causes of planned vs. unplanned downtime."
  raw: "### Process Challenges and Mitigations\n\nThe following highlights the most\
    \ relevant process-related challenges and suggested mitigating options.\n\n* \
    \  **Challenge**: Companies are continuously stressed with increasing profitability,\
    \ mostly by reducing cost by employing fewer human resources, while leading to\
    \ longer than usual working periods and less safe working sites. Future generations\
    \ will have to do more with less, hence yielding more results per unit time and\
    \ less unit cost.\n\n    **Mitigation Options**\n    *   Automate drilling site\
    \ operations using robotized operations and leveraging advanced data analytics\
    \ for event detection focusing on abnormal critical events (i.e., stuck pipe and\
    \ lost circulation).\n\n    *   Automate production monitoring adding continuous\
    \ data analytics of wellsite parameters while enabling routine well analysis via\
    \ exception-based surveillance (EBS) focusing on critical well status.\n\n   \
