    ## Summary


    In this chapter, we provided a brief overview of production engineering. We also
    discussed production optimization and the formulation for predicting well rate
    performance. Using realistic synthetic data generated with first-principles models,
    we presented you with the machine learning approach to virtual metering. The virtual
    metering example demonstrates how sensor data obtained from the oil wells can
    help us continuously monitor production from a well. A section of this chapter
    also provided example implementation of machine learning algorithms for predicting
    impending well failure, using the historical production data.


    In the last sections of the chapter, we discussed the problem of predicting critical
