- fmt: '### Basic Data Analysis of the Well Logs


    We want to explore whether the `permx` data populated on the SPE 9 3D model, and
    the well logs extracted from this model follow the same statistical patterns.
    Taking a pragmatic approach, we first calculate the sample mean, standard deviation,
    and variance by using the `permx` values from the extracted well logs, and all
    grid cells of the SPE 9 model. These values are summarized in Table [5-2](#480430_1_En_5_Chapter.xhtml#Tab2).


    **Table 5-2** Mean and Standard Deviations of the `permx` Property for the Wells
    Extracted from the SPE 9 Model and for all Grid Cells


    | Extracted Well Logs | All SPE 9 Grid Cells |

    | --- | --- |

    | Mean | Standard Deviation | Variance | Mean | Standard Deviation | Variance
    |

    | --- | --- | --- | --- | --- | --- |

    | 116.47 | 507.24 | 257287.53 | 108.08 | 375.31 | 140856.44 |


    The values of mean `permx` property from the extracted well logs, and all the
    grid cells in the SPE 9 model are relatively close. However, the values of standard
    deviation and variance indicate that the distribution of values around the mean
    is significantly wider for the extracted well logs. A possible conclusion is that
    the `permx` property values on the SPE 9 model may not have been generated using
    the property distribution on the well locations provided with the model. We also
    compute experimental variogram models from the extracted well logs, and all the
    grid cells by using the code in Listing [5-1](#480430_1_En_5_Chapter.xhtml#PC1),
    which implements Equation 5.1 in Python.


    ```

    from scipy.spatial.distance import pdist, squareform

    import numpy as np

    def variogram_one_lag(X, perm, lag, bin_width):

    """Experimental semi-variogram for one lag"""

    dist_mat = squareform(pdist(X))

    n_points = dist_mat.shape[0]

    list_var = []

    for i in range(n_points):

    for j in range(i + 1, n_points):

    if(dist_mat[i, j] >= (lag - bin_width)) and \

    (dist_mat[i, j] <= (lag + bin_width)):

    list_var.append((perm[i] - perm[j])**2.0)

    return np.sum(list_var) / (2.0 * len(list_var))

    def variogram(X, perm, lags, bin_width):

    """Experimental variogram calculation"""

    variogram = []

    for lag in lags:

    variogram.append(variogram_one_lag(X, perm, lag, bin_width))

    return variogram

    Listing 5-1

    Code Snippet for Experimental Variogram Computation

    ```


    Figure [5-4](#480430_1_En_5_Chapter.xhtml#Fig4) shows the computed experimental
    variograms for the extracted well logs and the entire grid. The first fact that
    stands out is significantly large nugget variance in both of these variogram models.
    A large nugget indicates that the data is very noisy, and there is not enough
    spatial correlation.


    This was a hypothesis, which we had from the visual observation, and now we can
    quantitatively establish this by using variogram computations. At this point it’s
    clear that 3D interpolation based on property distribution at the well locations
    will not be able to reproduce the `permx` property model shown in the SPE 9 model
    (Figure [5-2](#480430_1_En_5_Chapter.xhtml#Fig2)). It may be tempting to argue
    that we can use an analytical variogram with zero nugget, but that is not realistic,
    as it does not capture the uncertainty inherent in the input data being provided
    for interpolation.


    In the next section, we start discussing Gaussian process regression, which is
    a machine learning algorithm with parallels to kriging concepts, and we demonstrate
    how to use it for 3D interpolation of the extracted well logs over the SPE 9 grid
    cells.


    ![../images/480430_1_En_5_Chapter/480430_1_En_5_Fig4_HTML.jpg](images/480430_1_En_5_Chapter/480430_1_En_5_Fig4_HTML.jpg)


    **Figure 5-4** Computed experimental variograms from the SPE 9 model, based on
    data from all grid cells (red circles), and data from the well logs extracted
    based on well locations (blue squares)


    ## Gaussian Process Regression


    Gaussian process regression is a supervised learning method, which implements
    Gaussian processes to solve regression problems. There are certain advantages
    of Gaussian process regression, which make it appealing for 3D spatial interpolation
    problems.


    - This algorithm has the excellent capability of interpolating the observed data.
    As a result, property values estimated in an area between already drilled wells
    are very reliable.

    - Predictions generated using Gaussian process regression are probabilistic. Therefore,
    it is possible to compute confidence intervals and provide estimates of uncertainty
    on the estimated value. This functionality is implemented in the `scikit-learn`
    library. This is very important for geological modeling, as uncertainty quantification
    is a very important aspect in 3D property modeling.

    - Gaussian process regression uses the kernel trick. The kernels project problem
    input onto a high dimensional space, such that a highly nonlinear regression problem
    becomes linear, or approximately linear. This allows a more efficient solution
    to a challenging nonlinear regression problem.


    However, just like any other algorithm, there are some disadvantages associated
    with Gaussian process regression as well. Some of the disadvantages include the
    following.


    - The model training requires the entire sample information. This makes it unfit
    for training on very large datasets. However, geomodeling is a field where geoscientists
    must deal with a lack of data. Therefore, in most of the scenarios, this does
    not pose a serious challenge.

    - Gaussian process regression works well if there are a limited number of variables
    in the input feature, approximately a few dozens. As we move to a higher dimensional
    input feature, the method loses its efficiency. This is also not a significant
    problem because, for spatial 3D interpolation, the input feature mostly consists
    of `x`, `y`, and `z` (or transformed `u`, `v`, and `w`) coordinates.

    - This method is not suitable for extrapolation. As we move further away from
    the sample data, the estimated values tend to the mean of sample data, with estimation
    variance tending to the variance of the sample data.'
