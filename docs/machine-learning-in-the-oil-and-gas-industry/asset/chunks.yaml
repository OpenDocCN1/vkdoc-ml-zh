  trans: "\n### 什么是超参数？\n\n超参数是在机器学习算法训练过程中用于学习最佳模型参数的变量。换句话说，超参数是帮助学习最优模型参数的参数。以下是一些超参数的示例：\n\
    \n*   神经网络中的层数\n*   神经网络层中的节点数\n*   神经网络节点的激活函数类型\n*   模型训练的迭代次数或轮数（epochs）\n\
    *   基于核的方法中“核”类型的选择\n*   正则化参数\n*   神经网络权重初始化的类型\n*   提前停止的容差（`min_delta`）\n*\
    \   提前停止前等待的轮数（`patience`）\n\n尽管这种方法的名称暗示它仅适用于优化超参数，但在某些场景下，它也可以调整模型参数。我们通过一个代码示例来演示这一点。\n\
    \n#### 使用 Hyperopt 进行超参数优化\n\n我们使用 Hyperopt（一个 Python 库）来演示超参数优化过程。我们使用支持向量分类器算法来演示该过程。我们使用了岩性分类数据，并构建了一个基础分类器。该基础分类器的准确率将作为基准，用于评估超参数优化过程带来的模型性能提升。以下代码片段展示了基础分类器的实现及其对应的分类准确率。\n\
    \n```\nsvc = SVC()\nsvc.fit(X_train, y_train)\n# 对测试数据进行预测\ny_pred = svc.predict(X_test)\n\
    # 准确率指标\nclf_metrics(y_test, y_pred)\n分类准确率得分：0.8621700879765396\n```\n\nHyperopt\
    \ 使用一个目标函数，通过最小化该函数来计算模型参数和超参数的最优值。在以下示例中，使用 k 折交叉验证的准确率得分乘以 -1 作为目标函数。通过 50 次迭代中反复调整超参数和模型参数来最小化目标函数。实现中的一些重要方面包括：\n\
    \n*   **K 折交叉验证：** 在此方法中，训练数据被分成 *k* 个子集或折。利用这些 k 折，训练 *k* 个独立的模型。每个模型在训练时，每次保留其中一折用于验证（验证折），并使用剩余的\
    \ k-1 折来训练模型。k 折交叉验证的准确率得分是通过计算各个模型在各自验证折数据上的准确率得分的平均值得到的。\n\n*   **参数空间：** 定义了模型参数和与模型相关的超参数可以取值的范围。\n\
    \n*   **超参数：** 在此示例中，核的类型是一个超参数。常数 *C*、多项式次数和 gamma 是模型参数。这是一个同时优化超参数和模型参数的示例。\n\
    \n以下代码片段展示了为支持向量分类器模型寻找最优核及其对应参数的方法。\n\n```\ndef objective(params):\nsvc = SVC(**params)\n\
    return -1\\. * cross_val_score(svc, X_train, y_train).mean()\nkernels = ['rbf','poly','rbf','sigmoid']\n\
    space = {'C':hp.lognormal('C', 0, 1),\n'kernel':hp.choice('kernel', kernels),\n\
    'degree':hp.choice('degree', range(1, 15)),\n'gamma':hp.uniform('gamma', 1e-2,\
    \ 1e2)\n}\ntrials = Trials()\nbest_svc = fmin(objective, space, algo=tpe.suggest,\
    \ max_evals=50, trials=trials)\nprint(best_svc)\n{'C': 1751.5444736790396, 'degree':\
    \ 11, 'gamma': 5.899864955354083, 'kernel': 0}\n```\n\n在确定了最佳核类型和模型参数后，使用最佳模型对测试数据进行预测。\n\
    \n```\nsvc = SVC(C=best_svc['C'],\nkernel=kernels[best_svc['kernel']],\ndegree=best_svc['degree'],\n\
    gamma=best_svc['gamma'])\nsvc.fit(X_train, y_train)\n# 对测试数据进行预测\ny_pred = svc.predict(X_test)\n\
    # 准确率指标\nclf_metrics(y_test, y_pred)\n分类准确率得分：0.9618768328445748\n```\n\n该示例表明，使用\
    \ Hyperopt 库进行超参数优化，将模型分类准确率从 0.86 提升到了 0.96。通过实现适当的目标函数，类似的过程可以应用于提高任何其他机器学习或深度学习算法的准确率。\n\
    \n## 总结\n\n> *我来这里不是要告诉你结局如何，而是告诉你这一切将如何开始。*\n> \n> ——尼奥，《黑客帝国》[12]\n\n机器学习和深度学习是内容广泛的课题。在本章中，我们试图概述与机器学习和深度学习算法相关的几个概念。我们的重点是使用开源数据集为每种算法提供简单的代码实现。然而，我们承认，掌握这些概念需要进一步学习和持续练习。请参考“延伸阅读”部分推荐的后续步骤。在接下来的章节中，我们将通过应用本章讨论的概念，为石油和天然气行业相关问题构建一些有趣的机器学习应用。\n\
    \n# 4. 地球物理学与地震数据处理\n\n在前面的章节中，我们了解了 Python 编程，学习了机器学习和深度学习的概念，并使用 Python 实现了其中一些概念。本章的重点是概述机器学习在地球物理学领域的应用。勘探工作流程的主要目标是利用地震数据处理来构建地球模型，以估算储层属性。这是一个成熟且经过充分研究的问题，在地震成像和储层属性估算科学背后，有数十年的学术和工业研究积累。\n\
    \n机器学习在勘探地球物理学中的应用历史悠久，几乎与过去几十年机器学习的兴衰同步。其在勘探地球物理学工作流程中的应用非常广泛。详细解释每一个应用超出了本章的范围。本章的方法旨在概述地震成像过程，并详细讨论盐体解释这一具有挑战性的问题。本章将以简要总结其他几个问题以及勘探和解释工作流程的相关文献指引作为结尾。\n"
- fmt: '# Seismic Reflection Experiment


    Reflections and refractions in seismic waves within the earth were first observed
    on seismographs that recorded earthquake-generated seismic waves. The general
    principle of a seismic reflection experiment is to send waves into the subsurface
    and record them with several thousands of sensors. Figure [4-1](#480430_1_En_4_Chapter.xhtml#Fig1)
    shows a schematic of an experiment that is used to acquire reflection data in
    the marine setting. An explosive source of energy is used to emit waves that are
    reflected from contrasts in the subsurface. These reflections from key layers
    are recorded by sensors. Several thousands of sensors are towed by the streamer
    as shown in the cartoon.


    ![../images/480430_1_En_4_Chapter/480430_1_En_4_Fig1_HTML.jpg](images/480430_1_En_4_Chapter/480430_1_En_4_Fig1_HTML.jpg)


    Figure 4-1


    Schematic of a marine seismic reflection experiment (Courtesy: National Science
    Foundation)


    Figure [4-2](#480430_1_En_4_Chapter.xhtml#Fig2) shows an example of a sample record
    that is recorded by a seismic experiment. A data record of this type is called
    a "shot record" as it corresponds to a single explosion from which the reflection
    waves have been recorded. For a typical marine experiment, there are several thousands
    of these shots acquired over an area.


    ![../images/480430_1_En_4_Chapter/480430_1_En_4_Fig2_HTML.jpg](images/480430_1_En_4_Chapter/480430_1_En_4_Fig2_HTML.jpg)


    Figure 4-2


    Shot gather: Data captured by a single seismic experiment (Courtesy: Introduction
    to Seismic Imaging)


    The objective of seismic processing is to use sensor data, as shown in Figure
    [4-2](#480430_1_En_4_Chapter.xhtml#Fig2), to generate an image of the subsurface,
    as well as estimate the properties of the Earth. Typically, the objective is to
    estimate the velocity of the compressional waves traveling through the Earth as
    these are a proxy for the reservoir properties at the scale of the wavelength.
    The process of converting these shot records to generate an image of the earth
    is called imaging. During the process of generating a subsurface image, it is
    also essential to estimate the properties of the subsurface through a process
    called earth model building. An overview of the seismic acquisition problem and
    its various challenges is explained in reference [[1](#480430_1_En_4_Chapter.xhtml#Par45)].


    ## Inverse Problem: Imaging and Velocity Model Building


    The goal of recording petabytes of seismic data is to obtain an image of the subsurface
    of the earth, as well as estimate the physical properties of the subsurface. A
    minimal model for modeling wave propagation in the subsurface is given by the
    acoustic wave equation. More complicated models exist for accurately modeling
    wave propagation. Such models are beyond the scope of this introductory chapter.
    An excellent mathematical overview of the wave equation based imaging, and the
    inverse problem associated with it can be found in reference [[2](#480430_1_En_4_Chapter.xhtml#Par46)].


    A model for acoustic wave equation can be defined by the partial differential
    equation system shown in Figure [4-3](#480430_1_En_4_Chapter.xhtml#Fig3).


    ![../images/480430_1_En_4_Chapter/480430_1_En_4_Fig3_HTML.jpg](images/480430_1_En_4_Chapter/480430_1_En_4_Fig3_HTML.jpg)


    Figure 4-3


    Acoustic Wave Equation


    In the above system of equations, `u(x, t)` is the pressure field that is recorded
    by the hydrophones, `c(x)` is the wavespeed of sound waves (compressional waves)
    in the subsurface and `f(x[s], t)` is the source signature for the experiment
    described in the previous section. The system is solved with an appropriate set
    of initial conditions and boundary conditions.


    In the mathematical and geophysical literature, this linear system is called a
    forward problem as it gives the definition of a physical system for modeling the
    wave field, given the definition of wave speed in the earth''s subsurface. This
    is a well-studied and well defined problem with several centuries of academic
    history behind it. The interested reader is suggested to consult reference [[3](#480430_1_En_4_Chapter.xhtml#Par47)],
    and the references therein.


    However, the objective of seismic imaging is to solve the inverse of the problem
    as defined by the system above. The objective is to find a model that explains
    the data that has been recorded (Figure [4-4](#480430_1_En_4_Chapter.xhtml#Fig4)).
    Unlike the forward problem which is a linear problem, the inverse problem is a
    strongly nonlinear problem that is challenging to solve. Further, the solution
    to the inverse problem is non-unique. Non-uniqueness implies several models can
    reasonably explain the data that has been recorded.


    ![../images/480430_1_En_4_Chapter/480430_1_En_4_Fig4_HTML.jpg](images/480430_1_En_4_Chapter/480430_1_En_4_Fig4_HTML.jpg)


    Figure 4-4


    Inverse problem


    Figure [4-5](#480430_1_En_4_Chapter.xhtml#Fig5) shows the comparison of two broad
    classes of problems that form the discipline of seismic imaging. The problem of
    imaging is accurate positioning of reflectors while the problem of inversion is
    estimating a subsurface model (velocity and anisotropic properties) that explain
    the data that has been recorded in the subsurface.


    ![../images/480430_1_En_4_Chapter/480430_1_En_4_Fig5_HTML.jpg](images/480430_1_En_4_Chapter/480430_1_En_4_Fig5_HTML.jpg)


    Figure 4-5


    Imaging and Inversion


    ### Physical Properties of Sedimentary Rocks


    In sedimentary rocks, compressional velocity varies significantly, and heterogeneity
    is observed on all scales. Figure [4-6](#480430_1_En_4_Chapter.xhtml#Fig6) shows
    the velocity profile from a well from onshore United States. The variation in
    velocity can be observed on various scales, varying across several orders of magnitude
    - from micrometers to millimeters to kilometers.


    ![../images/480430_1_En_4_Chapter/480430_1_En_4_Fig6_HTML.jpg](images/480430_1_En_4_Chapter/480430_1_En_4_Fig6_HTML.jpg)


    Figure 4-6


    Multiscale heterogeneity of rock properties (Data courtesy: TGS)


    In order to study the nonlinear inverse problem defined in the equation system
    shown in Figure [4-4](#480430_1_En_4_Chapter.xhtml#Fig4), a perturbation approach
    is used to study the scattering caused by the subsurface. Born approximation is
    a technique originally used in quantum mechanics to study scattering by an extended
    body. It is shown to be accurate when the size of the scatterers is small compared
    to the wavelength. Interested readers are referred to the reference [[2](#480430_1_En_4_Chapter.xhtml#Par46)].


    Velocity model can be separated according to scales. A smooth macromodel that
    contains the long-scale component of velocity. Typically, this is in the form
    of a smooth background. The scatterers are represented in the form of an oscillatory
    perturbation above the smooth background, which represents the high-frequency
    component of the velocity. This model of the subsurface models single scattering
    only. In other words, these model the primary reflected waves. A careful treatment
    of Born approximation is beyond the scope of this introductory discussion on seismic
    imaging. The interested reader is referred to reference [[2](#480430_1_En_4_Chapter.xhtml#Par46)]
    for details.'
