  trans: '

    ### 成像与反演


    本节旨在深入探讨速度估算以及地下散射体成像的过程。基于地表记录的数据和平滑的背景速度模型，成像的目标是找到地下的反射率。这是一个线性反演问题，存在多种方法可以对地下的散射体进行成像。


    为了准确识别地下的反射体，拥有精确的速度模型也至关重要。基于地表记录的数据，速度反演的目标是找到一个能够解释地表记录数据的平滑背景速度模型。这比成像问题困难得多，且具有强非线性。在实践中，估算反射体与更新速度模型的过程是在一个迭代循环中完成的，直到满足特定标准。


    用于定位地下反射体的线性反演问题在实践中是近似处理的。其数学细节超出了本成像入门材料的范围。我们计算一个近似逆，这个过程被称为偏移。目前使用的偏移算法有多种，包括基尔霍夫偏移、逆时偏移、波动方程偏移等。其目标是将接收波场向后传播，并将震源波场向前传播，而成像结果就是不同时延值下波场的互相关。得到的零时延值即为图像（图
    4-7）。


    ![../images/480430_1_En_4_Chapter/480430_1_En_4_Fig7_HTML.jpg](img/480430_1_En_4_Fig7_HTML.jpg)


    图 4-7

    偏移概述


    估算地下速度属性的一种常用技术是使用全波形反演方法。这是一种迭代方法，用于匹配在特定频率范围内地表记录的数据。该技术计算速度模型的平滑部分，并且与大多数强非线性优化问题一样，对初始模型的选择非常敏感。由于数据的带限特性，这种方法只能得到平滑解，无法解析所有尺度的结构。参考文献
    [4] 描述了在墨西哥湾构建速度模型所面临的挑战。图 4-8 展示了来自参考文献 [4] 的、在墨西哥湾亚特兰蒂斯油田通过全波形反演获得的速度模型。


    ![../images/480430_1_En_4_Chapter/480430_1_En_4_Fig8_HTML.jpg](img/480430_1_En_4_Fig8_HTML.jpg)


    图 4-8

    由全波形反演导出的速度模型 [4]


    由于数据的带限特性，一个精确的初始模型对于解决这个优化问题至关重要，以避免陷入局部极小值。该优化问题的公式化假设是：观测到的波形与预测波形在最低频率处的差异小于半个波长。然而，地震数据中低频信息的缺失会导致周期跳跃，从而使问题陷入局部极小值而非达到全局极小值。这个问题在诸如墨西哥湾这样的盆地中更难解决，因为其中存在的盐体复杂结构导致了速度对比，使得优化问题极具挑战性（图
    4-9）。


    ![../images/480430_1_En_4_Chapter/480430_1_En_4_Fig9_HTML.jpg](img/480430_1_En_4_Fig9_HTML.jpg)


    图 4-9

    缺乏低频数据带来的挑战


    ### 克服低频挑战


    在过去几年中，地震采集技术取得了快速的技术进步。在过去的二十年里，覆盖范围和方位角（角度）的范围有了显著改善——近方位角采集、宽方位角采集、全方位角采集是过去几十年中一些操作创新的例子。此外，在过去几年中，人们多次尝试拓宽采集的频率范围。低频数据至关重要，因为它有助于避免优化问题陷入局部极小值。因此，在过去几年中，人们进行了多次尝试来获取低频数据。但是，采集技术极其昂贵，并且在大规模实施上可能面临挑战。然而，在无法获得低频数据的情况下，从更好的初始速度开始，并拥有一个*先验*的速度模型结构，有助于加速收敛。


    在构建用于建立结构的速度模型时，盐体解释是一项具有挑战性的任务。盐体解释的最先进方法涉及由训练有素的地质学家和领域专家团队进行人工解释，他们将其地质先验知识施加于反演问题中。然而，鉴于反演问题的迭代性质，解释人员需要在每次成像应用之后挑选盐体的结构。挑选盐体结构的过程是一个耗时的问题，对于构建精确的地震速度模型至关重要。

