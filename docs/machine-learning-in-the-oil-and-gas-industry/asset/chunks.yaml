    The `k-means` clustering algorithm is used for partitioning a dataset with *n*
    observations into *k* distinct clusters centered at a centroid. Each observation
    in the training data belongs to a particular cluster. A cluster or aggregated
    group of points have certain similar characteristics embedded into them. For the
    petrophysical dataset being used in this chapter, it is important to find the
    number of clusters for which an elbow plot is generated, as shown in Figure [3-18](#480430_1_En_3_Chapter.xhtml#Fig18).
    The elbow plot shows the variation of *inertia* (the sum of squared distances
    of points from their cluster centroid) as a function of the number of clusters.


    ![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig18_HTML.jpg](images/480430_1_En_3_Chapter/480430_1_En_3_Fig18_HTML.jpg)


    **Figure 3-18** Elbow plot indicating optimum number of clusters based on inertia
    value


    Looking at the elbow plot, for *k* = 3 clusters, a distinct kink or elbow is present.
    Using this optimum number of *k* = 3 clusters for the dataset, a scatter plot
    generated between `KLOGH` and `PHIF` (V/V) shows distinct boundaries between the
    three different clusters (see Figure [3-19](#480430_1_En_3_Chapter.xhtml#Fig19)).
