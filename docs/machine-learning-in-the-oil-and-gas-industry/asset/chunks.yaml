- fmt: '# Toward Oil and Gas 4.0


    Energy is one of the fundamental needs for sustaining modern human life. In the
    year 2016, global energy demand was 552 quadrillion British thermal units (quads).
    Out of this, 177 quads were supplied by oil, and 127 quads were supplied by gas.
    This indicates that 55% of global energy demand in 2016 was supplied by the oil
    and gas industry [[1](#480430_1_En_1_Chapter.xhtml#Par130)]. It is also anticipated
    that by 2040, 57% of global energy demand will be fulfilled by the oil and gas
    industry. These numbers demonstrate the present and future impact of the oil and
    gas industry on our day-to-day lives. Although the use of oil as a source of energy
    dates back hundreds of years, the first oil well in modern history was drilled
    in Baku, Azerbaijan, in 1848 [[2](#480430_1_En_1_Chapter.xhtml#Par131)].


    In 1859, Edwin Drake drilled the first commercial oil well in the United States
    (see Figure [1-1](#480430_1_En_1_Chapter.xhtml#Fig1)). Drake’s well is a turning
    point for the modern oil and gas industry, which resulted in a great wave of investments
    in oil well drilling. For more than 150 years, the industry has constantly evolved
    and adopted new technologies. The oil and gas industry is probably among the few
    industries that have the distinction of fueling the industrial revolutions. Over
    the past few centuries, the world has witnessed three industrial revolutions.


    ![../images/480430_1_En_1_Chapter/480430_1_En_1_Fig1_HTML.jpg](images/480430_1_En_1_Chapter/480430_1_En_1_Fig1_HTML.jpg)


    Figure 1-1


    Drake’s well is considered the first well successfully drilled using a drilling
    rig [[3](#480430_1_En_1_Chapter.xhtml#Par132)]


    - The first industrial revolution started around 1760 with the invention of the
    steam engine. During this era, steam-powered tools facilitated mechanical production
    in the factories, and steam engines revolutionized how people traveled.

    - During the late nineteenth century to early twentieth century, scientific principles
    of production were brought in to the industries. This led to the mass production
    of products in the assembly lines. Gasoline-engine powered cars manufactured by
    the Ford Motor Company were among the most impressive examples of mass production
    at large scale, which happened during the second industrial revolution.

    - With ENIAC, the first general-purpose computer was built in 1945, seeds of the
    third industrial revolution or digital revolution were sown. By the 1980s, progress
    made in semiconductor technology revolutionized industries all over the world,
    as computing moved from mainframe computers to personal computers. The arrival
    of the Internet connected the world, and progress in information technology ushered
    a new era of industrialization.


    Currently, the industries across the globe are undergoing the fourth industrial
    revolution. This revolution is fueled by extraordinary growth in computing infrastructure,
    predictive techniques, data storage, and data processing capabilities. The fourth
    industrial revolution—sometimes denoted as the 4.0 version attached to the different
    industry names—is being fueled by the following enablers.


    - Industrial Internet of Things (IIoT), which facilitates seamless connectivity
    between numerous devices in corporate and operational settings, and enables collaborative
    decision making.

    - Big data technologies, which harness distributed data storage and processing
    to store and process enormous amounts of data efficiently.

    - Cloud computing machines leveraging accelerated computing devices, such as graphics
    processing units (GPUs).


    The oil and gas industry is also undergoing a digital transformation, which is
    referred to as “Oil and Gas 4.0.” Oil and gas industry operations involve high-risk
    situations, both from human life, and environmental perspectives. As a result,
    the adoption of new technologies is possible only after a rigorous phase of validation
    to ensure that the health, safety, and environmental (HSE) standards are met appropriately.
    Despite the abundant caution exercised in new technology adoption, the oil and
    gas industry has remained open to new technologies for optimizing and streamlining
    the existing processes.


    This book focuses on machine learning (a subset of artificial intelligence) applications
    in the oil and gas industry. In this chapter, without going into specific details
    of machine learning techniques, we discuss some example applications related to
    different life cycle stages of the upstream oil and gas industry. For the benefit
    of those of you with little background in the oil and gas industry, we start with
    a brief overview of the different industry sectors.


    ## Major Oil and Gas Industry Sectors


    Oil and gas deposits are often located thousands of feet below the earth’s surface.
    The process of extracting oil and gas from these depths to the surface, and then
    converting it into a usable source of energy involves a large variety of operations.
    Figure [1-2](#480430_1_En_1_Chapter.xhtml#Fig2) shows different life-cycle stages
    in the oil and gas industry operations. Broadly, the entire process of producing
    oil and gas is divided into the following three industry sectors.


    ![../images/480430_1_En_1_Chapter/480430_1_En_1_Fig2_HTML.jpg](images/480430_1_En_1_Chapter/480430_1_En_1_Fig2_HTML.jpg)


    Figure 1-2


    Different life-cycle stages in a typical oil and gas industry operational environment


    - Upstream industry

    - Midstream industry

    - Downstream industry


    ### The Upstream Industry


    The upstream oil and gas industry is also known as the exploration and production,
    or E&P, industry. Operations in the upstream industry are focused on identifying
    locations below the earth’s surface, which have the potential of producing oil
    and gas. Following the identification of a potential reserve, detailed planning
    of exploration, drilling oil wells, and producing oil and gas also comes under
    the upstream industry. Logically, upstream operations can be divided into the
    following activities.


    - Exploration and appraisal

    - Field development planning

    - Drilling and completion

    - Production operations

    - Abandonment'
