- fmt: '*   `R²` for train data using `GradientBoostingRegressor` is `0.995428`.

    *   `R²` for blind test data using `GradientBoostingRegressor` is `0.992874`.

    *   `R²` for all data using `GradientBoostingRegressor` is `0.994193`.


    Notice that for there are six available measurements (`[BHP, WHP, WHT, Tsep, Psep,
    Choke_in]`) the engineer can implement for multiple virtual rate calculators,
    also known as control volume, just by changing the input features in training
    matrix `X` and output vector `Y`.


    One way is to “uncomment” the required `X` and `Y` combination.


    ```

    # Create input feature and target

    #X = df[["WHP", "Psep"]] # flow line performance

    #X = df[["WHP", "Psep", "Choke_in"]] # flow line and choke performance

    #X = df[["BHP", "WHP"]] # tubing vertical lift performance (VLP)

    #X = df[["BHP", "WHP", "Choke_in"]] # VLP and choke performance

    #X = df[["WHP", "WHT", "Tsep", "Psep"]] # flow line P&T performance

    #X = df[["WHP", "WHT", "Tsep", "Psep", "Choke_in"]] # choke performance

    #y = np.array(df[["Qoil"]].values).reshape(-1, )

    #y = np.array(df[["Qwater"]].values).reshape(-1, )

    #y = np.array(df[["Qgas"]].values).reshape(-1, )

    ```


    Another convenient method is to build independent virtual metering functions and
    run all of them simultaneously (i.e., `Y1oil = f(X1)`, `Y1water = f(X1)`, `Y1gas
    = f(X1)`, `Y2oil = f(X2)`, `Y2water = f(X2)`, `Y2gas = f(X2)`, …, etc.).


    ```

    # Create input feature and target

    X0 = df[["BHP", "WHP", "WHT", "Tsep", "Psep", "Choke_in"]]

    X1 = df[["WHP", "Psep"]]

    X2 = df[["WHP", "Psep", "Choke_in"]]

    X3 = df[["BHP", "WHP"]]

    X4 = df[["BHP", "WHP", "Choke_in"]]

    X5 = df[["WHP", "WHT", "Tsep", "Psep"]]

    X6 = df[["WHP", "WHT", "Tsep", "Psep", "Choke_in"]]

    Y1 = np.array(df[["Qgas"]].values).reshape(-1, )

    Y2 = np.array(df[["Qoil"]].values).reshape(-1, )

    Y3 = np.array(df[["Qwater"]].values).reshape(-1, )

    ```


    The advantage of this approach is that all 7 input matrices (`X0` to `X6`) and
    for each rate (`Y1`, `Y2`, `Y3`) have been built with different physical process
    assumptions; for example flow across the flow line, flow across the choke or flow
    across the tubing.


    The obtained models tend to agree when the process conditions are stable, and
    the models are well-calibrated. But they are also powerful tools for identifying
    exceptions in the system; these models diverge when process conditions are different
    from the original assumptions; for example, increasing water cut or increasing
    GOR.


    ### Predicting Well Rates for Gas-lift Wells


    A gas-lift well (see Figure [7-7](#480430_1_En_7_Chapter.xhtml#Fig7)), whose properties
    are shown in Table [7-1](#480430_1_En_7_Chapter.xhtml#Tab1), has about 12,538
    flow test data points. A machine learning model for predicting well rates (including
    oil, water, and gas) will be built. The input data refers to available measurements
    at the well, including bottomhole pressure (`BHP`), wellhead pressure (`WHP`),
    wellhead temperature (`WHT`), flowline pressure and temperatures (`FLP`, `FLT`),
    and choke internal diameter (`ID_Choke`). The predicted output includes the oil,
    water, and gas rates as a function of all the given measurements.


    **Table 7-1** Vertical Well with Gas-Lift Properties


    | | Average | Standard deviation |

    | --- | --- | --- |

    | Oil Gravity, ^oAPI | 36.3 | 0.2 |

    | Oil Initial Solution Gas, `Rsi`, SCF/bbl | 516.7 | 3.0 |

    | Gas Specific Gravity, | 0.8 | 0.0 |

    | Water Salinity, ppm | 230,010 | 1,330.2 |

    | Reservoir Temperature, ^oF | 240 | 1.4 |

    | Reservoir Pressure, psi | 4,347 | 376.3 |

    | Tubing Length, ft | 12,269 | 7.1 |

    | Casing ID, inches | 6.2 | 0.0 |

    | Tubing ID, inches | 3.1 | 0.0 |

    | Gas lift Orifice Depth, ft | 12,069 | 7.1 |

    | Flowline ID, inches | 3.1 | 0.0 |

    | Flowline Length, ft | 10 | 0.1 |

    | Temperature Surface, ^oF | 80 | 0.5 |

    | Heat Transfer Coefficient, BTU/(hr∙ft²∙^oF) | 9.2 | 1.6 |


    *   Input data: `"Well_Choke_GL.csv"`

    *   Python code: `"Chapte07_GL_Well_Rate_and_Pressure_MLP_Predictor.ipynb"`


    Python code for the oil, water, and gas rate prediction is implemented using the
    multilayer perceptron (`MLP`) regression method (i.e., `rate = f(BHP, WHP, WHT,
    FLP, FLT, ID_Choke, ID_orifice, Q_Gas_lift)`).


    ![../images/480430_1_En_7_Chapter/480430_1_En_7_Fig7_HTML.jpg](images/480430_1_En_7_Chapter/480430_1_En_7_Fig7_HTML.jpg)


    **Figure 7-7** Well rate (oil, water, and gas) estimator using `MLP` algorithm
    for gas-lift well


    ## Predicting Well Failures


    One of the production engineer’s tasks is to establish practices and methods to
    proactively detect and prevent well failures, to recommend actions on the well
    (and facilities) operating envelopes. Reservoir, near wellbore environment, downhole
    equipment, and any component of the surface production system may fail at any
    point in time, leading to considerable unplanned downtime, production losses,
    and uncontrolled operation expenditures. The proactive identification and prevention
    of well failures lead to appropriate maintenance scheduling which ultimately reduces
    inappropriate repairs, minimizes downtime, and subsequently improves operation
    efficiency [[12](#480430_1_En_7_Chapter.xhtml#Par141)].


    Engineers face challenges in identifying candidates and ranking opportunities
    for production enhancement purely from performance data. Standard production data
    management and decision-making platforms poorly predict a decline in uptime, availability,
    and optimum operating envelope of wells. The challenges typically relate to proper
    system understanding, well condition diagnosis, proactive opportunity identification,
    efficient opportunity ranking of opportunities, and post-job performance analysis.


    Systematic pattern recognition workflow to detect the well failures in sucker
    rod pumped (`SRP`) wells have been successfully implemented [[12](#480430_1_En_7_Chapter.xhtml#Par141)].
    This led to tremendous savings in engineering tied to detecting `SRP` failures,
    as well as minimizing the production losses.


    Recommending the optimum treatment method is also a necessary task to manage operating
    expenditures, not only by minimizing rig and equipment cost but also by bringing
    the well faster to production and avoiding future failure for the same cause [[13](#480430_1_En_7_Chapter.xhtml#Par142)].
    The idea is to combine historic success and failure data, with field personnel
    comments, and basic business rules into a data-driven model able to recommend
    treatment methods that optimize design, field plan, equipment use, and job performance.


    The steps to build any advisory solution that predicts well failure, include data
    screening, data feature engineering, root-cause-analysis, recommending actions,
    and feedback.


    ### Data Screening


    Data screening identifies symptoms that show where asset performance is not as
    good as expected. Patterns among wells are detected to identify similar behavior
    and reduce the complexity of the screening problem from several hundred sensors
    to a few categories of similar measurement types.


    ### Data Feature Engineering


    Data feature engineering may involve the generation of data features using domain-knowledge,
    feature extraction, and pattern recognition. The objective of this step is to
    allow the algorithm to act on trends rather than on actual values. Rather than
    acknowledging the fact that the tubing head pressure is 1200 kPa, for example,
    the advisory system should consider whether the tubing head pressure is increasing,
    stable, or decreasing. The rate of change in any of the input variables is only
    one of the features in a data stream that needs to be extracted.


    Domain expert interviews and the elaboration of the surveillance logic reveal
    that it is a combination of features in the data streams that are typically used
    by experts to detect events. In only a few cases, it is an absolute value or threshold
    that alarms the experts; usually, it is a series of features in one signal or
    many signals combined.'
