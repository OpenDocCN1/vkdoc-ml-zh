    Hello World!\")\n```\n\n你应该会看到以下输出。\n\n```\nHello World!\n```\n\n恭喜！你已经用 Python\
    \ 编写了第一行代码。在这一行代码中，我们要求 Python 解释器将“Hello World!”这句话打印到输出控制台。在本章的后续部分，我们将更详细地介绍\
    \ Python 编程。\n\n你可以在已创建的 Notebook 中为每个代码片段创建一个新的代码单元格，并在我们学习本章不同编程概念时执行这些代码片段。\n\
    \n本章重点介绍 Python 编程语言的基础知识，本书将使用该语言来执行机器学习算法。本章涵盖的主题列表包括以下内容。\n\n*   Python 编程语言基础\n\
    \    *   执行代码（三种不同方法）：Python 解释器、IPython 和 .py 脚本\n\n    *   语言结构与含义：编程语言的语法和语义\n\
    \n    *   Python 中一切都是对象吗？讨论 Python 中的变量和运算符\n\n    *   如何在 Python 中使用数字并执行运算？\n\
    \n    *   为什么 Python 被认为是一种动态且强类型的语言？\n\n*   数据结构：列表、元组、集合和字典\n\n*   控制流工具和迭代器：if、else、for\
    \ 和 while 语句\n\n*   基本面向对象编程：函数、方法和类\n\n*   Python 库：如何使用 Python 中丰富的模块和包库，以及其他有用的库？\n\
    \    *   NumPy：使用数组和矩阵进行科学计算\n\n    *   pandas：数据分析\n\n    *   Matplotlib：2D 绘图和可视化\n\
    \n本章使用来自石油和天然气行业的开源数据集，并提供了使用 Python 库进行基础数据分析和可视化的入门指南。\n\n## Python 基础\n\n像\
    \ C、Fortran 或 Java 这样的编译型语言与像 Python 这样的解释型语言之间的一个主要区别在于执行过程。Python 是一种非常灵活的语言，可以轻松地逐行执行，并提供了多种不同的方式来执行用\
    \ Python 编程语言编写的代码。接下来介绍三种常用的方法。\n\n### Python 解释器\n\nPython 解释器提供了执行逐行代码最基本的方法之一。一旦在系统上安装了\
    \ Python，在命令提示符下运行 `'python'` 就会启动该过程。会显示当前 Python 版本，随后出现 `>>>`，表示可以从此处开始执行 Python\
    \ 代码（见图 2-4）。\n\n![../images/480430_1_En_2_Chapter/480430_1_En_2_Fig4_HTML.jpg](img/480430_1_En_2_Fig4_HTML.jpg)\n\
    \n图 2-4\n\n使用 Python 解释器运行逐行代码\n\n### Python 脚本\n\n经验更丰富的程序员更喜欢以扩展名为 `.py` 的脚本形式生成代码。整个代码使用\
    \ Python 终端执行（见图 2-5 和 2-6）。\n\n![../images/480430_1_En_2_Chapter/480430_1_En_2_Fig6_HTML.jpg](img/480430_1_En_2_Fig6_HTML.jpg)\n\
    \n图 2-6\n\n在集成终端中执行来自 .py 文件的代码\n\n![../images/480430_1_En_2_Chapter/480430_1_En_2_Fig5_HTML.jpg](img/480430_1_En_2_Fig5_HTML.jpg)\n\
    \n图 2-5\n\n使用 IDE 创建一个简单的 .py 文件\n"
- fmt: "### Language Structure and Meaning\n\nThis section briefly covers the syntax\
    \ and semantics of Python programming language, which makes it easier to interpret,\
    \ implement, and dynamically code for multiple programming paradigms. For an in-depth\
    \ discussion on any of these concepts, you can refer to Guido van Rossum [[5](#480430_1_En_2_Chapter.xhtml#Par138)],\
    \ who is the author of Python programming language. Python’s simple and consistent\
    \ design is based on the philosophy that “there should be one—and preferably only\
    \ one—obvious way to do it,” as mentioned in *The Zen of Python* [[6](#480430_1_En_2_Chapter.xhtml#Par139)].\n\
    \nThe structure or form of a language is what constitutes the syntax for the programming\
    \ language. It is usually comprised of three levels— words, phrases, and context—that\
    \ define the rules in which a program is written. No information about the meaning\
    \ or execution of a command is provided with the syntax. On the other hand, the\
    \ semantics of a language is defined by the meaning behind the code and what it\
    \ is supposed to provide as an outcome. Some of the rules and meanings behind\
    \ the language are listed in this chapter.\n\nPython is a case-sensitive language;\
    \ for example, `test_variable` and `Test_Variable` are treated as two different\
    \ objects. Unlike some other programming languages, Python does not require a\
    \ command terminator. Example, use of a semicolon (`;`) after every statement\
    \ is not required. However, if two different statements need to be executed in\
    \ the same line of code, a semicolon can separate them, as shown next.\n\n```\n\
    test_var = 10; print (test_var)\n```\n\n*Output*\n\n```\n\n```\n\nWhitespace limits\
    \ the control of flow, but it does not affect the code. This is illustrated in\
    \ the following code snippet.\n\n```\nx1 = 10*2\nx2 = 10 * 2\nx3 = 10   *    2\n\
    print(x1)\nprint(x2)\nprint(x3)\n```\n\n*Output*\n\n```\n\n```\n\nIndentation\
    \ is very critical to define the start of a block of code and indicates a group\
    \ of statements executed together. This is the case where whitespace matters.\
    \ Python does not use curly brackets (`{}`) to define a code block, and hence\
    \ indentation is what distinguishes a code block from the rest of the code. As\
    \ an example, the following `'for'` loop shows that the indented code printing\
    \ `'Count'` is printed thrice due to loop repetition, but the statement `'Outside\
    \ the loop'` is only printed once.\n\n```\nvar_length = 3\nfor i in range(var_length):\n\
    # indented code block which is a part of loop\nprint('Count', i)\nprint ('Outside\
    \ the loop') # not a part of loop\n```\n\n*Output*\n\n```\nCount 0\nCount 1\n\
    Count 2\nOutside the loop\n```\n\nThe forward slash is used for assigning a path\
    \ to a directory because Python follows UNIX-style path specifications. For example,\
    \ the relative path for a folder in Windows, `C:\\Desktop\\Python\\Code`, needs\
    \ to be changed to path `C:/Desktop/Python/Code`.\n\nStrings could be represented\
    \ with single quotes (‘ ’), double quotes (“ ”), or triple quotes (‘“ ”’). A convention\
    \ is to include one-word strings with single quotes, a sentence with double quotes,\
    \ and a paragraph or docstring with triple quotes.\n\n```\nword = 'Example'\n\
    sentence = \"This is an example of a sentence\"\npara = '''This is a paragraph\
    \ \n```\n\nWith a multiline statement enclosed in triple quotes (`'''`), comments\
    \ are an integral part of the code to explain the thinking process of the programmer\
    \ and help others to follow the intention of the code. In Python, single-line\
    \ comments can be started with a pound sign (`#`), while multiline comments (comment\
    \ block) can be enclosed in triple quotes.\n\nFor a deeper dive into code style\
    \ and formatting, the PEP8 Style Guide [[7](#480430_1_En_2_Chapter.xhtml#Par140)]\
    \ is a recommended reading which can help readers write code in a much more organized\
    \ and consistent style.\n\n## Is Everything an Object in Python?\n\nPython is\
    \ an object-oriented programming language and treats everything as an object.\
    \ With a loose definition of an *object* in Python, as compared to other programming\
    \ languages, some objects do not necessarily need to have attributes nor methods.\
    \ Neither are all the objects subclassable. The creator of the language, Guido\
    \ van Rossum [[8](#480430_1_En_2_Chapter.xhtml#Par141)] wanted “all objects that\
    \ could be named in the language (e.g., integers, strings, functions, classes,\
    \ modules, methods, etc.) to have equal status,” and hence classified them as\
    \ “first-class everything.” In other words, every object can be assigned to a\
    \ variable, included as a member of a list, used as a key-value pair in a dictionary,\
    \ or to be passed as an argument.\n\nOne of the advantages of Python being a dynamically\
    \ typed and interpreted language is the simplistic nature in which the variables\
    \ are defined. In this case, data types are checked, and the source code is translated\
    \ during the execution of the program.\n\nIn Python, each variable name is bound\
    \ only to an object. Usually, assignment operators carry out this operation. When\
    \ a value is assigned to a variable, in many programming languages, it is thought\
    \ to be stored in the form of a container or memory bucket [[4](#480430_1_En_2_Chapter.xhtml#Par137)].\
    \ In Python, this is better represented as a pointer instead of being a container.\
    \ This is one of the reasons why there is no declaration of a *datatype*, which\
    \ is very commonly found in other languages. The following code snippet provides\
    \ an example of how variable names can point to objects of any type.\n\n```\n\
    var1 = 5 # var1 is an integer\nvar2 = 'This is a String' # var2 is a string\n\
    var3 = [1,2,3] # var3 is a list\n```\n\nThere are different categories of operators\
    \ available for carrying out multiple operations on data. Some of them are listed\
    \ next.\n\n*   Arithmetic operators (addition, subtraction, modulus, etc.)\n*\
    \   Bitwise operators (AND, OR, XOR, etc.)\n*   Assignment operators (`+=`, `/=`,\
    \ etc.)\n*   Comparison operators (`<=`, `!=`, etc.) that output a boolean value\
    \ (i.e., `True` or `False`)\n*   Boolean operations (`and`, `or`, `not`, etc.)\
    \ that output a boolean value (i.e., `True` or `False`)\n*   Identity and membership\
    \ operators (`is`, `is not`, `not in`, etc.)\n\n### Data Structures\n\nBasic built-in\
    \ datatypes that are commonly used in a program include integer, float, complex,\
    \ boolean, string, and `None` datatypes. Apart from these basic ones, there are\
    \ a few more data structures that are discussed in this section. These compound\
    \ type data structures include lists, tuple, dictionary, and sets. A brief description,\
    \ along with an example for each case, can help us understand their format and\
    \ different ways in which they could be used.\n\nIt is recommended that the reader\
    \ refers to Python documentation [[9](#480430_1_En_2_Chapter.xhtml#Par142)] for\
    \ a detailed explanation of each data structure."
