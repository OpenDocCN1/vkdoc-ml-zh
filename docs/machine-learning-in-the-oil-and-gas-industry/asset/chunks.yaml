- fmt: '### Support Vector Regression


    Support vector regression is based on a support vector machine. In this method,
    regression is performed on each point by allowing a margin for error. For each
    data point `y`, it is acceptable to get a predicted value in the range between
    (`y` + `ϵ`) and (`y` - `ϵ`). In Figure [3-9](#480430_1_En_3_Chapter.xhtml#Fig9),
    the error margin `ϵ` is depicted by two supporting vectors and allows flexibility
    in model tuning.


    ![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig9_HTML.jpg](images/480430_1_En_3_Chapter/480430_1_En_3_Fig9_HTML.jpg)


    Figure 3-9: Schematic depicting the support vectors with error margin `ϵ`


    In addition to the error margin, this algorithm takes advantage of a *kernel trick*.
    The kernel trick projects a nonlinear lower-dimensional space onto a higher-dimensional
    space. In the higher dimensional space, it is possible to represent the original
    nonlinear problem as a linear problem. Several kernels are available for support
    vector regression implementation in `scikit-learn`, which include `''linear''`,
    `''sigmoid''`, `''rbf''`, and `''polynomial''`.


    A radial basis function (`''rbf''`) kernel, which is also called a *Gaussian kernel*,
    is selected in this example due to the presence of nonlinearity in the dataset.
    The following code snippet shows an example implementation.


    ```

    # Support Vector Regression (SVR)

    from sklearn.svm import SVR

    svr_reg = SVR(kernel=''rbf'', C=100, gamma=0.1, epsilon=.1)

    svr_reg.fit(X_train, y_train)

    # Prediction on test data

    y_pred_svr = svr_reg.predict(X_test)

    ```


    **Results**


    ```

    Mean Absolute Error: 82.06389051208197

    Mean Squared Error: 112564.26261124818

    Root Mean Squared Error: 335.5059799932755

    R Squared: 0.6092197302512246

    ```


    The regression plot and scatter plot based on the support vector regression results
    are shown in Figure [3-10](#480430_1_En_3_Chapter.xhtml#Fig10). This algorithm
    performs significantly better than multiple linear regression. This improvement
    is attributed to the error margin and the kernel trick applied in the support
    vector regression.


    ![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig10_HTML.jpg](images/480430_1_En_3_Chapter/480430_1_En_3_Fig10_HTML.jpg)


    Figure 3-10: Support vector regression results shown as regression plot and scatter
    plot


    ### Decision Tree Regression


    Decision Trees are nonparametric tree-based flowcharts. This algorithm works by
    constructing a rule-based hierarchical tree structure built of multiple leaf nodes.
    A condition is imposed on a feature or a set of features at each leaf node. At
    each node of the decision tree, the samples in training data are split into multiple
    child nodes depending on the imposed condition. The predicted values are calculated
    based on the average value of the samples in the terminal leaf nodes (see Figure
    [3-11](#480430_1_En_3_Chapter.xhtml#Fig11)).


    During the training process, the algorithm learns the rules to split training
