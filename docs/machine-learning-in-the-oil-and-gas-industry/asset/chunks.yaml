  trans: '

    ## 总结


    在本章中，我们使用了一种机器学习方法，该方法提供了与克里金技术等效的工具。我们利用一个开源数据集来训练高斯过程回归模型。近年来，空间插值领域出现了一些新的发展。最值得注意的是*生成对抗网络*（GAN）。在石油和天然气行业，GAN
    已被用于地震图像的插值[5]。然而，退一步评估这些方法在地质建模视角下的适用性或许是值得的。


    通常，地球科学家面临的最大挑战是能否从测井数据中获得优质数据。在油田开发的初始阶段，测井数据非常稀缺。在这种情况下，像 GAN 这类算法的适用性令人质疑，因为训练它们需要大量数据。然而，在拥有数百口井的测井数据时，评估基于深度学习的技术[6]的适用性或许是值得的。但在一般情况下，高斯过程回归是岩石物理属性插值的一个不错算法选择。


    参数 Alpha 的影响


    本章展示的结果是在训练`GaussianProcessRegressor`模型时，使用了值为 0.75 的`alpha`参数生成的。


    *   尝试使用不同的`alpha`参数值，观察输出结果如何变化。你会看到，随着`alpha`值的降低，`GaussianProcessRegressor`的评分会不断提高，但其预测远离井位处属性值的能力会减弱。


    *   如果你能访问一个真实的、格式为.GRDECL 的 3D 网格模型，请尝试使用本书提供的代码处理该 3D 网格，看看是否能用`GaussianProcessRegressor`生成良好的结果。


    # 6. 油藏工程


    石油和天然气行业从一开始就在解决与自动化和优化相关的问题。现代技术和数据驱动算法为该行业提供了额外的机制来解决问题和获取洞察。机器学习在油田中的应用体现在钻井工程中的机械钻速优化[1]、钻柱压差卡钻[2]、甜点识别[3]、岩石物理建模[4]、储层流体性质估算[5]、地下表征[6]、油藏模拟[7]、采油工程[8]以及完井工程[9]等领域，仅举几例。


    一些研究试图将传统的统计方法与机器学习相结合[10]，以提高完井作业和整体生产的性能。近年来的一个热门话题是优化完井设计以减轻压裂干扰[11]，这被认为对非常规油气藏至关重要[12]。由于油藏中存在的非均质性和不确定性，许多人提出了对纯物理模型[13]的质疑，这促使我们将注意力转向数据驱动的解决方案，以补充这些研究。现代计算能力也使得神经网络和基于深度学习的解决方案能够应用于解决石油和天然气行业的问题。多项研究尝试使用这种学习技术来解决诸如钻头回弹检测[14]、生产数据分析[15]、地震层位解释[16]等问题。


    机器学习的应用可分为两类[12]。第一类依赖于生产数据，第二类包括完井、作业和其他油藏参数。本章基于第一类，使用公开的生产数据进行分析。


    在石油工程领域，油藏工程师的主要职责之一是能够量化油藏的动态。这是通过*递减曲线分析*（DCA）来完成的，即监测产量随时间的变化，并预测油藏可产出的石油或天然气体积。DCA
    扮演着重要角色，是油藏工程师工具箱中最有价值的技术之一，因为它提供了一种估算原始地质储量和废弃时的剩余储量，并预测未来产量直至达到经济极限的方法。使用这种方法做出的预测通常用于向美国证券交易委员会（SEC）报告储量，因此它在石油经济学领域具有高度重要性。


    随着石油和天然气行业越来越多地采用基于机器学习的解决方案，人们一直在努力改进递减曲线分析，以做出更准确的预测。机器学习应用日益增长的原因之一是海量数据的存在，这些数据有助于构建油藏模型并进行历史拟合。传统的油藏工程和油藏建模方法成本高昂且耗时，因此我们的注意力转向了能够提供相似或更高精度估算的数据驱动方法。


    本章介绍了油藏工程领域中可以使用机器学习解决的问题。后续章节将专门介绍如何抓取一个公开数据集，并为递减曲线分析开发预测模型。


    本章介绍了使用 Arps 递减方法和基于时间序列分析进行产量预测的传统统计分析形式。讨论了不同方法的预测结果。这只是一个简要描述，鼓励读者尝试其他方法，如循环神经网络（RNN）和长短期记忆网络（LSTM），来预测石油和天然气产量，这些方法已被证明能提供更高精度的预测[17]。

    '
- fmt: '# The Role of Machine Learning in Reservoir Engineering


    Some of the areas of reservoir engineering in which machine learning-based solutions
    are directly applicable include optimized reservoir management [[18](#480430_1_En_6_Chapter.xhtml#Par74)],
    where identifying and planning of new wells is always a big challenge. Subsurface
    characterization of reservoir properties for an efficient field development plan
    can also be achieved by machine learning [[5](#480430_1_En_6_Chapter.xhtml#Par61)].
    Another area where machine learning can be applied includes the generation of
    pseudo logs or prediction of PVT properties using data from analogous wells [[19](#480430_1_En_6_Chapter.xhtml#Par75)][[20](#480430_1_En_6_Chapter.xhtml#Par76)].
    Some other examples include the interpretation of geology [[21](#480430_1_En_6_Chapter.xhtml#Par77)],
    geophysics [[22](#480430_1_En_6_Chapter.xhtml#Par78)], and the creation of knowledge
    graphs, which can provide deeper insights.


    Literature has shown how certain machine learning–based methods like neural network
    and deep learning have improved the predictions in comparison to Arps, Duong and
    the *stretched exponential production decline* (SEPD) model [[13](#480430_1_En_6_Chapter.xhtml#Par69)]
    [[23](#480430_1_En_6_Chapter.xhtml#Par79)] [[24](#480430_1_En_6_Chapter.xhtml#Par80)].
    By using machine learning algorithms, the traditional approach of using type wells
    for production forecasting [[25](#480430_1_En_6_Chapter.xhtml#Par81)] has been
    improved. Algorithms like random forest, support vector machine, and multivariate
    adaptive regression splines have also improved prediction accuracy [[26](#480430_1_En_6_Chapter.xhtml#Par82)].
    Other studies have shown better results with neural networks for predicting oil
    rates for Bakken shale wells [[27](#480430_1_En_6_Chapter.xhtml#Par83)]. A typical
    decline curve with respect to time is shown in Figure [6-1](#480430_1_En_6_Chapter.xhtml#Fig1).


    ![../images/480430_1_En_6_Chapter/480430_1_En_6_Fig1_HTML.jpg](images/480430_1_En_6_Chapter/480430_1_En_6_Fig1_HTML.jpg)


    Figure 6-1


    An example of a typical decline curve with time on the x-axis and operating gas
    rates on the y-axis [[28](#480430_1_En_6_Chapter.xhtml#Par84)]


    # Dataset Description


    Publicly available production data from the Oil and Gas Division of the North
    Dakota Industrial Commission (NDIC) [[29](#480430_1_En_6_Chapter.xhtml#Par85)]
    was used in the analysis. A `Python` script scraped the data from the website.
    Excel (`.csv`) files from mid-2015 onward are available on the website, which
    were used in this chapter. A snapshot of the NDIC website is shown in Figure [6-2](#480430_1_En_6_Chapter.xhtml#Fig2).


    ![../images/480430_1_En_6_Chapter/480430_1_En_6_Fig2_HTML.jpg](images/480430_1_En_6_Chapter/480430_1_En_6_Fig2_HTML.jpg)


    Figure 6-2


    Snapshot of North Dakota Industrial Commission website used to scrape production
    data [[29](#480430_1_En_6_Chapter.xhtml#Par85)]


    Once the data is scraped, as you can see in the distinct API numbers, there are
    17,756 wells in the analysis. Not all the wells have oil and gas production reported
    accurately, and hence a challenge is to clean the data as much as possible. Using
    some basic data visualization, we can understand the dataset we are currently
    working with.


    The analysis is focused on oil production, since it is the dominant flow from
    wells in North Dakota. In this study, we use data from mid-2015 through 2018 for
    history matching, and the data from 2019 is forecasted. The data is in the form
    of a time series with monthly production available for the analysis. Apart from
    the conventional Arps equations used for decline curve analysis, time series-based
    forecasting is also performed in this chapter.


    Based on the two methods, we can determine the more accurate method using root-mean-square
    error (RMSE) as a metric, since this is a regression problem. It is to be noted
    that the analysis is only shown for a few wells, but the code repository includes
    the entire set of wells retrieved from the website. Figure [6-3](#480430_1_En_6_Chapter.xhtml#Fig3)
    shows the snapshot of the production data from spreadsheet, which includes 21
    columns.


