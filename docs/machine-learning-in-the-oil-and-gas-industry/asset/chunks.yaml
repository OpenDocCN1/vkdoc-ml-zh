    ### NumPy：科学计算


    这是 Python 中一个常用于科学计算的库，它使用多维数组对象。创建 NumPy 数组是一个直接的过程。接下来展示了使用不同方法创建 NumPy 数组的示例。


    ```

    # 导入库

    import numpy as np

    array1 = np.array([1,2,3,4])

    array2 = np.array([1,None,''Python'',4.19])

    array3 = np.array([[(1,3.14,6),(1,2,3)], [(100,200,300), (99,9.9,0.99)]])

    # 均匀间隔的值 - 步长

    array4 = np.arange(5, 20, 4)

    # 均匀间隔的值 - 样本数量

    array5 = np.linspace(0,100,9)

    array6 = np.random.randint(10, size=6)  # 一维数组

    print(array1)

    print(array2)

    print(array3)

    print(array4)

    print(array5)

    print(array6)

    ```


    *输出*


    ```

    [1 2 3 4]

    [1 None ''Python'' 4.19]

    [[[  1\.     3.14   6\.  ]

    [  1\.     2\.     3\.  ]]

    [[100\.   200\.   300\.  ]

    [ 99\.     9.9    0.99]]]

    [ 5  9 13 17]

    [  0\.   12.5  25\.   37.5  50\.   62.5  75\.   87.5 100\. ]

    [6 7 3 6 1 1]

    ```


    NumPy 支持数学运算（加法、对数等）和数组排序。以下代码片段展示了一个简单示例。要全面了解可用的 NumPy 操作，我们建议您参考 NumPy 文档 [12]。


    ```

    # 数组数学运算 - 两种不同方法

    print(array1 + array4)

    print(np.add(array1, array4))

    print(np.log(array1))

    # 数组排序

    array6.sort(axis=0)

    print(array6)

    ```


    *输出*


    ```

    [ 6 11 16 21]

    [ 6 11 16 21]

    [0\.         0.69314718 1.09861229 1.38629436]

    [1 1 3 6 6 7]

    print("维度数量: ", array3.ndim)

    print("数组形状:", array3.shape)

    print("数组大小: ", array3.size)

    ```


    *输出*


    ```

    维度数量:  3

    数组形状: (2, 2, 3)

    数组大小:  12

    ```


    通过索引访问 NumPy 数组中的元素与访问列表中的元素非常相似。对于多维数组，可以使用逗号分隔的索引元组来访问元素。*切片操作*也非常相似。NumPy 中还提供了其他一些更常用的数组操作例程，这些在
    NumPy 数组操作文档 [13] 中有描述。接下来展示了一些简单的数组操作示例。


    ```

    i = np.append(array6, [25,26,27])

    print(i)

    concat = np.concatenate((array1, array2), axis=0)

    print(concat)

    mean_val = np.mean(array5)

    print(mean_val)

    ```


