    \n另一方面，循环控制语句主要有两类：基于循环次数的或由事件控制的。循环控制的示例包括 `for`、`while`、`break`、`continue` 和\
    \ `pass`。`for` 语句属于第一类，它对列表中的每个项目或循环次数执行循环。`while` 语句在特定条件为真时执行。在某些情况下，需要强制退出循环，此时使用\
