  trans: '

    ## 基于机器学习的盐体解释


    本节将重点概述地震成像中的监督学习问题。作为示例，我们将详细聚焦于前文所述速度模型构建中的二值分割问题。


    语义分割问题在计算机视觉领域已得到充分研究。其目标是为图像中的每个像素分配一个对象类别。图 4-10 展示了计算机视觉数据集中的示例以及地震图像-掩膜对，以说明问题之间的相似性。左侧面板展示了语义分割数据集中的两个样本。右侧面板则显示了地震图像以及通过对给定输入图像进行语义分割过程获得的掩膜。除了识别图像中的各种对象外，任务还包括描绘对象的边界。


    ![../images/480430_1_En_4_Chapter/480430_1_En_4_Fig10_HTML.jpg](img/480430_1_En_4_Fig10_HTML.jpg)


    **图 4-10**


    语义分割：计算机视觉 vs 地震成像


    从概念上讲，这与速度模型构建工作流程中使用的解释过程相似。给定一幅地震图像，目标是将其中的每个像素分类为盐体或沉积物。这可以构建为一个监督学习问题，类似于计算机视觉中的语义分割问题，其中图像是偏移算法的输出，而标签是一个二值掩膜。


    图 4-10 展示了一个示例，说明了地震成像中语义分割问题的相似性。这是一个更大的三维数据体中的一个切片，代表了偏移后的振幅。标签是从同一区域的 velocity
    模型中提取的。需要注意的重要一点是，这些是连续的振幅，不同于计算机视觉数据集中已量化的图像。此外，从不同偏移体采样的图像具有不同的振幅分布。因此，在将这些图像应用于深度学习算法之前，通常需要进行某种形式的归一化。


    将深度学习算法应用于地震图像有一些重要方面。请注意，这些方面特定于从地震图像中解释盐体的问题。


    1.  **图像尺寸的选择：** 可以使用合适的窗口提取算法来获取图像块用于训练或推理。


    2.  **图像的预处理：** 为了将连续振幅转换为量化级别，我们应用归一化。大多数归一化方法原则上都有效。然而，基于均值和标准差的缩放已被证明是有效的。


    ### 数据集描述


    我们使用由 TGS 和 Kaggle 主办的 TGS Kaggle 盐体解释挑战赛 [5] 的数据集。该数据集是一组在地下随机位置选取的图像。图像尺寸为 101
    × 101 像素，每个像素被分类为盐体或沉积物。图 4-11 展示了所选数据集中的几个图像样本。


    ![../images/480430_1_En_4_Chapter/480430_1_En_4_Fig11_HTML.jpg](img/480430_1_En_4_Fig11_HTML.jpg)


    **图 4-11**


    来自 Kaggle 数据集的几个样本图像（左）及对应的标签（右）


    ### 用于语义分割的 U-Net


    为了训练一个深度学习模型来执行语义分割，过去几年中已经发表了几种架构。其中一些语义分割架构已经建立了分割领域的最先进记录 [6]。尽管我们将列出详细解释这些模型的出版物，但在本章中，我们将重点介绍
    U-Net 作为一个典型示例 [7]。


    如图 4-12 所示，U-Net 由一个收缩路径（如图左侧所示）和一个扩展路径（如图右侧所示）组成。收缩路径遵循卷积神经网络的架构。重复应用两个 3 × 3
    卷积，每个卷积后接一个线性整流单元（ReLU），以及一个步长为 2 的最大池化操作进行下采样。在每个下采样步骤中，特征通道数加倍。扩展路径中的每一步都包含特征图的上采样，随后是一个
    2 × 2 卷积（“上卷积”）。此上采样步骤将特征通道数减半，并将其与来自收缩路径的相应裁剪特征图进行拼接，然后是两个 3 × 3 卷积，每个卷积后接一个
    ReLU。由于每次卷积都会丢失边界像素，因此裁剪是必要的。在最后一层，使用一个 1 × 1 卷积将每个 64 分量的特征向量映射到所需的类别数。该网络总共有
    14 个卷积层。


    ![../images/480430_1_En_4_Chapter/480430_1_En_4_Fig12_HTML.jpg](img/480430_1_En_4_Fig12_HTML.jpg)


    **图 4-12**


    U-Net 架构（参考文献 [7]）


    ### U-Net 的损失函数


    交并比（IOU）目标函数通常用于评估语义分割问题的准确性（图 4-13）。计算机视觉领域还提出了其他几种目标函数。我们想指出，尽管 IOU 是评估分割网络常用的指标，但
    Jupyter notebook 中分享的示例使用二元交叉熵作为损失函数，原因很简单：它更容易理解，并且在大多数深度学习库中普遍可用。


    为了应用该指标，计算预测对象与期望对象的交集作为分子，计算预测对象与期望对象的并集作为分母。该商即为衡量准确性的指标。可以看出，如果模型准确地预测了对象的形状，那么交并比将为
    1。


    ![../images/480430_1_En_4_Chapter/480430_1_En_4_Fig13_HTML.jpg](img/480430_1_En_4_Fig13_HTML.jpg)


    **图 4-13**


    交并比目标函数

