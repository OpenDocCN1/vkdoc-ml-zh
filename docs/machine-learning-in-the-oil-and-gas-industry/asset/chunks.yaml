    ### 测井数据的基本统计分析


    我们想要探究，SPE 9 三维模型中填充的 *permx* 数据，以及从该模型中提取的测井数据，是否遵循相同的统计规律。采用实用主义方法，我们首先利用提取的测井数据中的
    *permx* 值，以及 SPE 9 模型的所有网格单元，计算了样本均值、标准差和方差。这些数值汇总于表 5-2。


    表 5-2


    从 SPE 9 模型提取的测井数据与所有网格单元的 permx 属性均值与标准差


    | 提取的测井数据 | 所有 SPE 9 网格单元 |

    | --- | --- |

    | 均值 | 标准差 | 方差 | 均值 | 标准差 | 方差 |

    | --- | --- | --- | --- | --- | --- |

    | 116.47 | 507.24 | 257287.53 | 108.08 | 375.31 | 140856.44 |


    从提取的测井数据和 SPE 9 模型所有网格单元中得到的 *permx* 属性均值相对接近。然而，标准差和方差的值表明，提取的测井数据中，数值围绕均值的分布范围明显更广。一个可能的结论是，SPE
    9 模型上的 *permx* 属性值可能并非基于模型提供的井位处的属性分布生成的。我们还利用代码清单 5-1 中的代码，从提取的测井数据和所有网格单元计算了实验变差函数模型，该代码用
    Python 实现了公式 5.1。


    ```

    from scipy.spatial.distance import pdist, squareform

    import numpy as np

    def variogram_one_lag(X, perm, lag, bin_width):

    """单个滞后距的实验半变差函数"""

    dist_mat = squareform(pdist(X))

    n_points = dist_mat.shape[0]

    list_var = []

    for i in range(n_points):

    for j in range(i + 1, n_points):

    if(dist_mat[i, j] >= (lag - bin_width)) and \

    (dist_mat[i, j] <= (lag + bin_width)):

    list_var.append((perm[i] - perm[j])**2.0)

    return np.sum(list_var) / (2.0 * len(list_var))

    def variogram(X, perm, lags, bin_width):

    """实验变差函数计算"""

    variogram = []

    for lag in lags:

    variogram.append(variogram_one_lag(X, perm, lag, bin_width))

    return variogram

