    #### 决策树回归


    决策树是一种非参数化的基于树的流程图。该算法通过构建一个由多个叶节点组成的基于规则的层次树结构来工作。在每个叶节点上，对一个特征或一组特征施加一个条件。在决策树的每个节点处，根据施加的条件，训练数据中的样本被分割成多个子节点。预测值根据终端叶节点中样本的平均值计算得出（见图
    3-11）。


    在训练过程中，算法学习在每个叶节点分割训练数据的规则，以使观测值与预测值之间的均方误差（MSE）最小化。由于其高度可解释的特性，决策树非常常用于回归问题。图
    3-12 显示，与之前两种算法相比，应用该算法提供了更好的预测。然而，该算法存在过拟合的问题。此处展示了一个决策树回归的代码片段。


    ```

    # Decision Tree – Regression

    from sklearn.tree import DecisionTreeRegressor

    dt_reg = DecisionTreeRegressor(random_state=42)

    dt_reg.fit(X_train, y_train)

    # Prediction on test data

    y_pred_dt = dt_reg.predict(X_test)

    ```


