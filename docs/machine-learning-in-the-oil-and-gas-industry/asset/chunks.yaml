    at the well, including bottomhole pressure (BHP), wellhead pressure (WHP), wellhead
    temperature (WHT), flowline pressure and temperatures (FLP, FLT), and choke internal
    diameter (ID_Choke). The predicted output includes the oil, water, and gas rates
    as a function of all the given measurements.


