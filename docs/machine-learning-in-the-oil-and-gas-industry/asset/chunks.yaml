    阈值半径可通过大量模拟实验进行统计确定，这些实验针对多种井/储层系统，通过改变包括水平渗透率（k[h]）、各向异性比（![$$ \frac{{\mathrm{k}}_{\mathrm{v}}}{{\mathrm{k}}_{\mathrm{h}}}
    $$](img/480430_1_En_7_Chapter_TeX_IEq6.png)）和穿透比（![$$ \frac{h_{op}}{h_o} $$](img/480430_1_En_7_Chapter_TeX_IEq7.png)）、油层厚度（h[o]）、流度比（M）以及含水层厚度（h[w]）等属性。Box
    和 Behnken 方法可以设计一个模拟实验矩阵 [18]。该设计规定了总共 54 次不同的模拟运行（储层/含水层系统），通过系统性地增大泄油面积直至其等于最大水锥的横向长度来确定阈值半径。然后利用这些结果，通过多元二阶多项式回归，推导出一个用于计算阈值泄油半径
    r[eTh] 的经验公式。


