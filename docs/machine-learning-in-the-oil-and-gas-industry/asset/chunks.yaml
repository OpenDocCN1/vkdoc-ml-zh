  trans: '

    #### 利用社交与人类传感器进行大规模数据采集


    在大型无线传感器应用方面，石油和天然气行业落后于其他行业（例如金融、医疗和市场营销）[7]。这些传感器可能来自多种来源：可穿戴联网设备、社交网络、多领域协作，或任何物联网设备网络。


    #### 人工智能政策制定


    随着机器学习和人工智能在社会和企业世界中扮演越来越重要的角色，政府和组织制定政策的需求也日益明显[8]。政府政策和全球合作协议可以极大地加速（或减缓）机器学习和人工智能在社会各层面的进步与采用，涵盖健康、食品、服务、能源、交通和教育等领域。


    #### 政府组织对人工智能的采用


    政府在采用人工智能方面面临着诸多挑战[9]，包括数据的有效利用、人员技能、人工智能生态系统、遗留文化和采购机制。然而，像阿联酋这样的国家在人工智能采用率上的变化，可能对石油和天然气行业的机器学习/人工智能发展产生巨大影响。公民满意度与政府采用率之间存在很强的相关性[10]。


    ### 机器学习与人工智能技术前景


    毫无疑问，机器学习和人工智能在过去十年中取得了指数级的进步[11]。这种加速的步伐表明，相关的科学和技术在未来十年也将继续发展[12]。


    人工智能将在我们的日常生活中扮演常规角色[13]，包括石油和天然气行业。人工智能将在解决未来十年关键工程挑战方面发挥关键作用[14]；特别是，它将解决钻井[15]、生产和油藏工程中的许多挑战。


    #### 深度学习


    机器学习模型的性能会随着数据可用性的增加而提升。深度神经网络具有利用更多数据的潜力。以下是深度学习应用的示例。


    *   自动化钻井作业需要对时间序列数据进行正确的事件分类。一个基于语义分割的离线模型与基于 CNN 的推理模型并行运行，可以在实时钻井分析系统中以 99%的准确率对钻机状态进行分类和预测[16]。


    *   得益于机器学习和人工智能辅助的复杂事件检测，水力压裂作业持续改进。这些事件包括压裂阶段开始和结束、球座操作识别以及泵速周期的分类。一个基于 CNN
    和 U-Net 架构的深度学习应用提供了水力压裂事件的实时自动解释[17]。


    *   测井解释通常被视为一项耗时的任务，其主观结果会给油藏研究增加不必要的的不确定性。使用多种建模技术（即用于监督分类的模型堆叠）的自动岩石物理解释，在缩短地下模型研究周期和提高预测质量方面前景广阔[18]。


    *   通过目视检查钻屑来识别岩性和流体，是油气检测、井位部署、地下导航以及最终优化油田开发成本所必需的。然而，这类任务通常被认为附加值低，因为它依赖于主观解释。近年来，使用
    CNN 进行视觉识别在该领域已变得流行。


    *   使用深度学习技术可在钻机现场实时对岩屑量进行分类[19]。在将每一帧视频输入分类模型之前，会进行归一化和主成分分析。


    *   由于图像类别之间高度相似，钻屑图像分类十分困难。一个贝叶斯优化的 CNN 集成方法优于其他已知方法，尤其是在参数空间巨大的情况下[20]。


    #### 强化学习


    在数据量庞大的领域，强化学习具有巨大的潜力。强化学习对数据的需求量很大。一项基于井数据的深度强化学习应用被提出用于优化注水[21]。AI 代理可以通过使用压力和相监测等可用数据来学习油藏行为。经过训练的代理可以预测其策略变化如何影响目标函数。


    #### 多物理场模型


    传统的基于静态和基于流动的升尺度方法，用于从离散裂缝模型生成等效连续介质模型，存在精度低和计算成本高的问题。能够像数据驱动模型一样快速运行的详细流体流动模型，在石油和天然气行业中一直备受关注且具有价值。一种基于物理的深度学习方法被用于对裂缝介质构建的等效连续介质模型的高分辨率图像进行升尺度处理[22]。


    #### 人工智能的未来


    由于人工智能具有处理信息的程序化能力，人们一致认为，未来人工智能将提供更多情境化信息[23]（见表 8-1）。


    表 8-1


    人工智能的各个浪潮（源自[23]）


    | 主要 AI 浪潮 | 第一波（<2000 年） | 第二波（过去十年） | 第三波（未来） |

    | --- | --- | --- | --- |

    | 描述 | 分类 | 解释 |

    | --- | --- | --- |

    |   | 手工知识 | 统计学习 | 情境化适应 |

    | 主要范围 | 由人类定义的知识结构；算法探索具体细节 | 针对特定问题领域、基于数据训练的统计模型 | 针对现实世界现象类别的情境化解释模型 |

    | 能力 | 能够对狭义定义的问题进行推理<br>无学习能力，处理不确定性能力差 | 细致的分类和预测能力<br>无情境化能力，推理能力极弱 | 模型驱动决策<br>模型生成关于测试字符可能如何创建的的解释
    |


    #### 可解释人工智能


    随着机器学习/人工智能模型性能的提升，理解和解释它们也变得越来越困难。可解释人工智能的目标是生成具有同等优越性能（即高预测精度）的自我解释型机器学习模型，同时使个人能够理解和信任这些模型[24]。

    '
- fmt: '### Computational Linguists


    Computational linguists are concerned with the statistical or rule-based modeling
    of natural language. Achieving superior human-level artificial intelligence depends
    on the ability to read documents directly in natural language text [[25](#480430_1_En_8_Chapter.xhtml#Par168)].


    Considering the rise of AI-assisted conversational engines in the oil and gas
    industry (e.g., `Nesh` [[26](#480430_1_En_8_Chapter.xhtml#Par169)], `Sandy` [[27](#480430_1_En_8_Chapter.xhtml#Par170)],
    `Willow` [[28](#480430_1_En_8_Chapter.xhtml#Par171)], and others [[29](#480430_1_En_8_Chapter.xhtml#Par172)]),
    it is reasonable to believe that natural language processing will play a key role
    in the development of machine learning and artificial intelligence applications
    in the next decade.


    ### Focused Initiatives


    Sometimes taking a boiling-the-ocean approach leads to frustration and early disillusionment.
    Pursuing too many initiatives at the same time, and trying to prove value in all
    of them may lead to no results. It is then recommended to focus on a few initiatives
    and try to prove the value in a limited scope and short time frame. After rewards
    have been confirmed and communicated across stakeholders, there will be greater
    motivation to move forward with bigger chunks of work.


    ### Data as an Asset


    Without large databases, it is not easy to build strong machine learning applications.
    Therefore, this will be limited to a few companies unless industries decide to
    share publicly meaningful sets of data (e.g., Norwegian `Volve` field data set)
    to collaborate and build robust applications. Not even giant service companies
    nor operators have the full data set to understand the complexity of oilfield
    operations. This may have implications for either cost reduction of the supply
    chain or appearance of new lines of business in the oil patch that make money
    from advertising, suppliers, and companies.


    ### Getting More Ideas Adopted


    Machine learning and artificial intelligence applications are emerging as a new
    class of engineering or scientific method. A lot of what is done today is experimental
    steps to search for the perfect algorithm. Oil and gas companies have merely started
    to spend significant effort in developing a blueprint of data-driven applications.


    There are many initiatives in the ideas and proof-of-concept stage; however, only
    a few ideas will be piloted on a small scale, and a small fraction will be rolled
    out as mainstream products.


    In the meantime, the oil and gas industry needs to exercise a lot of trial and
    error. Without trying, the oil and gas industry will not achieve what other industries
    have achieved. For this, a growth mindset is needed.


    Maybe some ideas are not ready for prime time, but trial and error are required.


    ## Summary


    The oil and gas industry will continue to play a key role in our society over
    the next decades, and its sustainability depends on our ability to address and
    mitigate important processes, people, and technology challenges.


    The oil and gas industry’s “process” challenges include managing downtime, interconnecting
    its business process, and optimizing the hydrocarbon value chain to provide a
    sustainable industry and secure energy source for society.


    People challenges include low availability and poor adequacy of the workforce
    to solve ongoing problems, exacerbated by separation among subsurface and digital
    disciplines, managing the silo mentality across multidisciplinary teams and organizations,
    and prioritizing unplanned and ad hoc work.


    Technology-related challenges include requirements to continuously manage (monitor,
    optimize and control) asset performance, demonstrating a commitment to environmental
    concerns while providing a maximum return to shareholders and delivering a safer
    workplace with less human-intensive actions and decision-making processes.


    Machine learning and artificial intelligence technology applications are still
    in the infancy stage in the oil and gas industry; therefore, tremendous opportunities
    exist for young professionals to perform and find ways to grow their careers.
    Major barriers exist in terms of knowledge skills and gaps, technical challenges
    including lack of standards and weak alignment with traditional IT, and changes
    including clear use case definitions and embedding the change into the existing
    processes.


    On the commercial side, machine learning and artificial intelligence technologies
    still lack an industry framework, where there is a balance between innovation
    and sustainable business models. This is not only seen in the oil and gas industry
    but throughout many industries.


    The evolution of key digital technologies will enable a better road for machine
    learning and artificial intelligence technologies in the oil and gas industry,
    including cost effective well site sensors and massive data capture through wearable
    devices.


    The continuous progress of machine learning and artificial intelligence core technologies,
    including deep learning and explainable AI, is a key factor for enhancing usability
    in many industries, including the oil and gas industry, which will enable more
    transformative and value-added processes.


    Policymaking toward machine learning and artificial intelligence use, in addition
    to increased adoption through large government organizations, will enhance the
    use of machine learning and artificial intelligence in all sectors. Therefore,
    it will provide oxygen to the oil and gas industry for navigating through the
    next decades.'
