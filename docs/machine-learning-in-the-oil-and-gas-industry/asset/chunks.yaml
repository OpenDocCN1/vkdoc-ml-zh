    ### Recurrent Neural Network (RNN)


    Recurrent neural networks, or RNNs, provide specialized architecture, which can
    model sequences, including time-series data. Figure [3-27](#480430_1_En_3_Chapter.xhtml#Fig27)
    shows the schematic representation of RNN architecture.


    ![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig27_HTML.jpg](images/480430_1_En_3_Chapter/480430_1_En_3_Fig27_HTML.jpg)


    Figure 3-27


    Schematic representation of an RNN architecture


    RNN is a sequence of basic neural network models, where each model learns from
    the input and output of an individual step in the sequence. If we fold the models
    in this sequence into a single model, which takes its output as input, and keeps
    on updating the model parameters, we get the RNN architecture as shown in Figure
    [3-27](#480430_1_En_3_Chapter.xhtml#Fig27) (extreme right).


    However, this approach to learning model parameters (weights and bias) suffers
    from stability problems. Sometimes, the changes in model weights from one step
    in the sequence to the next step in the sequence may be too large due to large
    error gradients. Accumulation of gradients over multiple steps in the sequence
    might lead to very large updates in weights, resulting in values beyond the numeric
    limit that the computer can handle. This is called an *exploding gradient* problem.


    On the other hand, if the error gradients are too small over multiple steps in
    the sequence, accumulating these gradients might lead to a value close to zero.
    In this scenario, the model stops updating the weights and is not able to learn.
    This is called a *vanishing gradient* problem.


    There are specialized architectures that address exploding and vanishing gradient
    problems. Before getting into the discussion of one of those specialized algorithms,
    we look at the time series data that we use for building a time series forecasting
    model.


    Figure [3-28](#480430_1_En_3_Chapter.xhtml#Fig28) shows daily production (left)
    and cumulative production (right) data from two wells of the Volve dataset made
    available by Equinor ([`https://data.equinor.com`](https://data.equinor.com)).
    We are going to use this data for generating day-ahead production estimates using
    the production data from recent weeks.


    ![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig28_HTML.jpg](images/480430_1_En_3_Chapter/480430_1_En_3_Fig28_HTML.jpg)


    Figure 3-28


    Plots showing daily oil production (left), and cumulative oil production (right)
    data from two wells selected from the Volve dataset


    #### Long Short-Term Memory (LSTM)


    We discussed the exploding and vanishing gradient problems encountered during
    the training of RNN models. Long short-term memory (LSTM) is an architecture,
    which addresses these problems by controlling the flow of information from one
    step in the sequence to the next. LSTM model is represented as a cell (see Figure
    [3-29](#480430_1_En_3_Chapter.xhtml#Fig29)) with information flow regulating *gates*.
    The cell state variable in the LSTM model retains long-term memory of the sequence,
    or the time series being modeled. These gates include the following.


    ![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig29_HTML.jpg](images/480430_1_En_3_Chapter/480430_1_En_3_Fig29_HTML.jpg)


    Figure 3-29


    Schematic depiction of long short-term memory (LSTM) cell architecture


    *   **Forget gate:** This gate gathers the information learned based on the combination
    of input to the cell, and output (hidden state) from the previous step in the
    sequence. Then, using a sigmoid function, it determines the amount of information
    that should be discarded. The sigmoid function provides values between 0 and 1,
    with 1 depicting retention of all the information, and 0 depicting discarding
    all the information.


    *   **Input gate:** This gate also uses input to the cell, and output from the
    previous step. The input gate uses a sigmoid function to learn the amount of information
    that should be retained for updating the cell state. The same input is passed
    through *tanh* activation. The input gate provides values between 0 and 1, whereas
    *tanh* provides values between –1 and 1\. A combination of these two is used for
    updating the cell state.


    *   **Output gate:** The output gate uses an input similar to the previous two
    gates. Using a sigmoid function, it learns the amount of information necessary
    to compute the model output. A combination of *tanh* activation applied to the
    cell state (long-term memory of the sequence) and values received from the output
    gate provides cell output.


    The following code snippet shows a sample implementation of LSTM architecture
    using TensorFlow. Cumulative production data from the past 14 days is used for
    predicting cumulative production on the next day. This implementation contains
    two stacked LSTM layers, followed by a dense layer, and an output layer with a
    single node (one output variable). We use the `Adadelta` optimizer and minimize
    the mean-squared error (MSE) metric for training the LSTM model. The implementation
    also uses early-stopping using validation data (not shown here).


    ```

    model = Sequential()

    model.add(LSTM(NUM_HIDDEN, activation="relu", return_sequences=True, input_shape=(LOOKBACK,
    1)))

    model.add(LSTM(NUM_HIDDEN, activation="relu", return_sequences=False))

    model.add(Dense(NUM_HIDDEN))

    model.add(Dense(1))

    model.compile(optimizer=''Adadelta'', loss="mse")

    ```


    Figure [3-30](#480430_1_En_3_Chapter.xhtml#Fig30) (left) shows the normalized
    cumulative production for the observed test data, and the cumulative production
    predicted by the LSTM model. Figure [3-30](#480430_1_En_3_Chapter.xhtml#Fig30)
    (right) shows a cross plot of observed test data, and LSTM predicted values for
    the test data. The results indicate good prediction capability of the LSTM model,
    after some mismatch during the early days of production from the well. An industrially
    relevant implementation outputs production for several days—something we encourage
    you to implement using the provided code.


    ![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig30_HTML.jpg](images/480430_1_En_3_Chapter/480430_1_En_3_Fig30_HTML.jpg)


    Figure 3-30


    Plots showing test data and corresponding LSTM model predictions for cumulative
    oil production(left), and a cross plot of observed and LSTM predicted cumulative
    oil production for the test data (right)


    ## Hyperparameter Optimization


    We have mentioned that hyperparameter optimization can help to improve model accuracy.
    In this section, we demonstrate a simple code example of the optimization process.
    But, before getting into the implementation details, let’s learn the definition
    of hyperparameters.'
