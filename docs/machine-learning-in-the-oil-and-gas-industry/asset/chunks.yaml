  raw: '### Predicting Threshold Reservoir Radius


    Threshold radius can be determined statistically using a large number of simulated
    experiments for a variety of well/reservoir system, by varying the properties
    including horizontal permeability (k[h]), anisotropy ratio (![$$ \frac{{\mathrm{k}}_{\mathrm{v}}}{{\mathrm{k}}_{\mathrm{h}}}
    $$](images/480430_1_En_7_Chapter/480430_1_En_7_Chapter_TeX_IEq6.png)) and penetration
    ratio (![$$ \frac{h_{op}}{h_o} $$](images/480430_1_En_7_Chapter/480430_1_En_7_Chapter_TeX_IEq7.png)),
    oil-pay thickness (h[o]), mobility (M) ratio and aquifer thickness (h[w]). The
    Box and Behnken method can design a matrix of simulated experiments [[18](#480430_1_En_7_Chapter.xhtml#Par147)].
    The design stipulates a total of 54 different simulation runs (reservoir/aquifer
    systems) to determine the threshold radius by systematically increasing the size
    of the drainage area until it becomes equal to the lateral length of maximum water
    cone. The results are then used to develop an empirical formula for threshold
    drainage radius, r[eTh] using the multiple second-order polynomial regression.


    The resulting formula for predicting threshold reservoir radius is


    ![$$ {\mathrm{r}}_{eTh}=14920.6-3563.7\mathrm{M}-68.5{\mathrm{h}}_{\mathrm{w}}-34586\frac{{\mathrm{k}}_{\mathrm{v}}}{{\mathrm{k}}_{\mathrm{h}}}+99.65{\mathrm{h}}_{\mathrm{o}}+288{\mathrm{M}}^2+0.107{\mathrm{h}}_{\mathrm{w}}^2+31290{\left(\frac{{\mathrm{k}}_{\mathrm{v}}}{{\mathrm{k}}_{\mathrm{h}}}\right)}^2+1.5\mathrm{M}{\mathrm{h}}_{\mathrm{w}}-0.55M{\mathrm{k}}_{\mathrm{h}}-10.13{Mh}_{\mathrm{o}}-0.087{\mathrm{h}}_{\mathrm{w}}{\mathrm{h}}_{\mathrm{o}}+0.1{\mathrm{k}}_{\mathrm{h}}{\mathrm{h}}_{\mathrm{o}}.
    $$](images/480430_1_En_7_Chapter/480430_1_En_7_Chapter_TeX_Equ5.png)


    (7.5)


    The following is the implementation of the threshold reservoir radius predictor
    as a function of the input parameters.


    *   Input data: Threshold_reservoir_radius.csv


    *   Output: “Threshold Radius values”


    *   Python code: “Chapter07_Threshold_Radius_Predictor_using_OLS.ipynb”


    *   Method: Multivariable linear regression methods


    ```

    import statsmodels.api as sm

    from statsmodels.tools.tools import add_constant

    import pandas as pd

    import statsmodels

    from statsmodels.stats.outliers_influence import variance_inflation_factor

    df = pd.read_csv("Threshold_reservoir_radius.csv")

    Y = df.threshold_radius.values

    x = df.drop([''threshold_radius'' ], axis=1)

    vif = pd.DataFrame()

    vif = [variance_inflation_factor(x.values, i) for i in range(x.shape[1])]

    print(vif)

    X = sm.add_constant(x) # adding a constant

    model = sm.OLS(Y, X).fit()

    predictions = model.predict(X)

    model.summary()

