    *   R² for blind test data using GradientBoostingRegressor is 0.992874.


    *   R² for all data using GradientBoostingRegressor is 0.994193.


    Notice that for there are six available measurements ([BHP, WHP, WHT, Tsep, Psep,
    Choke_in) the engineer can implement for multiple virtual rate calculators, also
    known as control volume, just by changing the input features in training matrix
    X and output vector Y.


    One way is to “uncomment” the required X and Y combination .


    ```

    # Create input feature and target

    #X = df[["WHP", "Psep"]] # flow line performance

    #X = df[["WHP", "Psep", "Choke_in"]] # flow line and choke performance

    #X = df[["BHP", "WHP"]] # tubing vertical lift performance (VLP)

    #X = df[["BHP", "WHP", "Choke_in"]] # VLP and choke performance

    #X = df[["WHP", "WHT", "Tsep", "Psep"]] # flow line P&T performance

    #X = df[["WHP", "WHT", "Tsep", "Psep", "Choke_in"]] # choke performance

    #y = np.array(df[["Qoil"]].values).reshape(-1, )

    #y = np.array(df[["Qwater"]].values).reshape(-1, )

    #y = np.array(df[["Qgas"]].values).reshape(-1, )

    ```


    Another convenient method is to build independent virtual metering functions and
    run all of them simultaneously (i.e., Y1oil = f(X1), Y1water = f(X1), Y1gas =
    f(X1), Y2oil = f(X2), Y2water = f(X2), Y2gas = f(X2), …, etc.).


    ```

    # Create input feature and target

    X0 = df[["BHP", "WHP", "WHT", "Tsep", "Psep", "Choke_in"]]

    X1 = df[["WHP", "Psep"]]

    X2 = df[["WHP", "Psep", "Choke_in"]]

    X3 = df[["BHP", "WHP"]]

    X4 = df[["BHP", "WHP", "Choke_in"]]

    X5 = df[["WHP", "WHT", "Tsep", "Psep"]]

    X6 = df[["WHP", "WHT", "Tsep", "Psep", "Choke_in"]]

    Y1 = np.array(df[["Qgas"]].values).reshape(-1, )

    Y2 = np.array(df[["Qoil"]].values).reshape(-1, )

    Y3 = np.array(df[["Qwater"]].values).reshape(-1, )

    ```


    The advantage of this approach is that all 7 input matrices (X0 to X6) and for
    each rate (Y1, Y2, Y3) have been built with different physical process assumptions;
    for example flow across the flow line, flow across the choke or flow across the
    tubing.


    The obtained models tend to agree when the process conditions are stable, and
    the models are well-calibrated. But they are also powerful tools for identifying
    exceptions in the system; these models diverge when process conditions are different
    from the original assumptions; for example, increasing water cut or increasing
    GOR.


