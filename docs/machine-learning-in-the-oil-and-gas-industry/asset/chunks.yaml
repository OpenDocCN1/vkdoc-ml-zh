- fmt: '# 5. Geomodeling


    Geomodeling is an important step in the process of exploration and production
    planning. Geomodeling is performed after developing an understanding of the structural
    framework of the reservoir using the information extracted during seismic interpretation.
    A three-dimensional (3D) grid is created by using the horizons and faults defined
    by the structural framework. This 3D grid is used along with the well logs to
    generate a detailed 3D model of the reservoir properties, such as porosity, permeability,
    and so forth. This step is a precursor to reservoir simulation. The calculations
    based on the 3D reservoir model also help in estimating important quantities,
    including original oil in place (OOIP).


    Once a 3D grid is created using the structural framework, it requires estimates
    of discrete petrophysical properties, such as facies, and continuous properties,
    such as porosity and permeability, before performing any further workflow steps.
    The data from the well logs form the basis for property estimation. A wide array
    of modeling techniques are applied to generate these properties on every cell
    of the 3D grid. Some of the most common techniques involve the following algorithms
    [[1](#480430_1_En_5_Chapter.xhtml#Par46)] [[2](#480430_1_En_5_Chapter.xhtml#Par47)].


    - Simple kriging

    - Ordinary kriging

    - Universal kriging

    - Sequential Gaussian simulation

    - Plurigaussian simulation


    In this chapter, we discuss how machine learning can help us estimate petrophysical
    property values on a 3D grid. First, we discuss some of the basic foundations
    that are common to all the techniques, as well as the machine learning techniques
    that are used in this chapter. Following that, we describe the dataset that we
    use in this chapter, show application of machine learning algorithm on the dataset,
    and outline some algorithmic limitations.


    ## Variogram


    Variograms are the foundation of almost every 3D spatial modeling technique of
    industrial relevance. Variograms provide the semivariance (often called *variance*
    for simplicity) of property `Z` at different distances from the point of interest.
    In a classical geostatistical approach [[1](#480430_1_En_5_Chapter.xhtml#Par46)],
    the semivariogram `γ (h)` (often called a *variogram*) of property `Z` is defined
    as


    ```

    γ (h) = (1 / (2 * n(h))) * Σ_{n(h)} E[(Z(u + h) - Z(u))^2]

    ```


    (5.1)


    where `n(h)` is the number of pairs that are separated by the distance `h` (also
    called *lag*). It should be noted that the experimental variograms calculated
    using this equation are fitted using an analytical expression, such as a spherical
    variogram model.


    Figure [5-1](#480430_1_En_5_Chapter.xhtml#Fig1) demonstrates the schematic representation
    of the spherical variogram model fit of a variogram `γ (h)`. In Figure [5-1](#480430_1_En_5_Chapter.xhtml#Fig1),
    `r` represents the variogram range. This value indicates the separation from a
    given point over which the correlation between the property values vanishes (i.e.,
    property values are decorrelated). Sill is represented by `s`, which is the value
    of semivariance achieved by the variogram asymptotically. Sill value can be conceived
    as the variance of the property values at two points, located at a distance more
    than the variogram range (`r`). Nugget variance, `n`, is an estimate of the uncertainty
    in the experimental or measured data.


    ![../images/480430_1_En_5_Chapter/480430_1_En_5_Fig1_HTML.jpg](images/480430_1_En_5_Chapter/480430_1_En_5_Fig1_HTML.jpg)


    Figure 5-1: Schematic depiction of a spherical variogram model


    The variogram may be omnidirectional or isotropic, where it is assumed that the
    same semivariance is observed for a lag value in any direction. It is also possible
    to have an anisotropic variogram, where semivariance depends on the lag value
    and the direction. An example of anisotropic variogram may be to use the same
    variogram model along the lateral directions (e.g., `x` and `y`), and use of a
    separate variogram model along the depth. Kriging techniques rely on variograms
    in the estimation of the petrophysical property value at a point away from the
    wells. Kriging is a form of generalized linear regression, which provides an optimal
    estimator to minimize mean-squared-errors of estimated property values. In this
    chapter, we are not going to discuss details of the kriging techniques. Rather,
    we focus on a machine learning algorithm, which is roughly equivalent to a simple
    kriging algorithm.


    Having access to an open source data set for carrying out a 3D geomodeling exercise
    is the biggest challenge. For this chapter, our objective is to give you a working
    example of petrophysical properties interpolation over a 3D geological model.
    Keeping this in mind, we selected a simple geological model provided by the Society
    of Petroleum Engineers Comparative Solution Project SPE 9 [[3](#480430_1_En_5_Chapter.xhtml#Par48)],
    which is available at `https://github.com/OPM/opm-data`. The SPE 9 model is shown
    in Figure [5-2](#480430_1_En_5_Chapter.xhtml#Fig2), with `permx` (permeability
    in the `x`-direction) shown in the overlay.


    ## Data Description


    This grid has 24, 25, and 15 cells in the `x`, `y`, and `z` directions, respectively.
    By visually observing the data in this model, we can quickly note two clear features
    of this model. First, the model has a significant level of heterogeneity, and
    second, there is a low correlation between the values in the adjacent cells. The
    hypothesis formed is based on visual observation is examined by a quantitative
    analysis of the data in a later section of this chapter.


    ![../images/480430_1_En_5_Chapter/480430_1_En_5_Fig2_HTML.jpg](images/480430_1_En_5_Chapter/480430_1_En_5_Fig2_HTML.jpg)


    Figure 5-2: The SPE 9 model is rendered with `permx` property as an overlay


    We extracted the well logs for the property `permx`, based on the well locations
    provided in the SPE 9 model, as listed in Table [5-1](#480430_1_En_5_Chapter.xhtml#Tab1).
    Figure [5-3](#480430_1_En_5_Chapter.xhtml#Fig3) shows the extracted well logs
    for the property `permx`.


    ![../images/480430_1_En_5_Chapter/480430_1_En_5_Fig3_HTML.jpg](images/480430_1_En_5_Chapter/480430_1_En_5_Fig3_HTML.jpg)


    Figure 5-3: Well logs for `permx` property, based on well locations for SPE 9
    model


    In Figure [5-3](#480430_1_En_5_Chapter.xhtml#Fig3), an isolated injector well
    can be seen in the northeast corner of the reservoir model. In contrast, producer
    wells are concentrated away from the injector well in a clustered manner.


    Next, we perform some basic analysis of grid data and extracted well logs.


    Table 5-1: Well Location Indexes in the SPE 9 Model Grid


    | Well Name | Well I | Well J | Well Name | Well I | Well J |

    | --- | --- | --- | --- | --- | --- |

    | INJE1 | 23 | 24 | PRODU14 | 7 | 12 |

    | PRODU2 | 4 | 0 | PRODU15 | 10 | 13 |

    | PRODU3 | 7 | 1 | PRODU16 | 12 | 14 |

    | PRODU4 | 10 | 2 | PRODU17 | 14 | 15 |

    | PRODU5 | 9 | 3 | PRODU18 | 10 | 16 |

    | PRODU6 | 11 | 4 | PRODU19 | 11 | 17 |

    | PRODU7 | 3 | 5 | PRODU20 | 4 | 18 |

    | PRODU8 | 7 | 6 | PRODU21 | 7 | 19 |

    | PRODU9 | 13 | 7 | PRODU22 | 10 | 20 |

    | PRODU10 | 10 | 8 | PRODU23 | 14 | 21 |

    | PRODU11 | 11 | 9 | PRODU24 | 11 | 22 |

    | PRODU12 | 9 | 10 | PRODU25 | 9 | 23 |

    | PRODU13 | 4 | 11 | PRODU26 | 16 | 24 |'
