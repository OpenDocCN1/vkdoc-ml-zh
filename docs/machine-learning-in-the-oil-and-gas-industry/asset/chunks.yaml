    \n控制流是指需要重复执行某段代码块以完成操作的情况。一些简单的条件语句包括 `if`、`elif` 和 `else`，它们使用布尔条件来执行一组命令。这些概念的实现通过一个示例来说明，我们假设一个只有三种岩石渗透率类别的简单情况。缩进和冒号（`:`）的使用是\
    \ Python 语法的一部分。\n\n```\n# if-elif-else 示例\nperm = 0.001 # 输入，单位为毫达西\nif (perm\
    \ > 0.0001):\n    print('这是毫达西级别，似乎是砂岩或石灰岩！')\nelif(perm == 1E-6):\n    print('这是微达西级别，似乎是致密砂岩！')\n\
