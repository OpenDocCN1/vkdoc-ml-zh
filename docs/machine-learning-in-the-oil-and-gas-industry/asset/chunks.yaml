    ## Predicting Well Failures


    One of the production engineer’s tasks is to establish practices and methods to
    proactively detect and prevent well failures, to recommend actions on the well
    (and facilities) operating envelopes. Reservoir, near wellbore environment, downhole
    equipment, and any component of the surface production system may fail at any
    point in time, leading to considerable unplanned downtime, production losses,
    and uncontrolled operation expenditures. The proactive identification and prevention of
    well failures lead to appropriate maintenance scheduling which ultimately reduces
    inappropriate repairs, minimizes downtime, and subsequently improves operation
    efficiency [[12](#480430_1_En_7_Chapter.xhtml#Par141)].


    Engineers face challenges in identifying candidates and ranking opportunities
    for production enhancement purely from performance data. Standard production data
    management and decision-making platforms poorly predict a decline in uptime, availability,
    and optimum operating envelope of wells. The challenges typically relate to proper
    system understanding, well condition diagnosis, proactive opportunity identification,
    efficient opportunity ranking of opportunities, and post-job performance analysis.


    Systematic pattern recognition workflow to detect the well failures in sucker
    rod pumped (SRP) wells have been successfully implemented [[12](#480430_1_En_7_Chapter.xhtml#Par141)].
    This led to tremendous savings in engineering tied to detecting SRP failures,
    as well as minimizing the production losses.


    Recommending the optimum treatment method is also a necessary task to manage operating
    expenditures, not only by minimizing rig and equipment cost but also by bringing
    the well faster to production and avoiding future failure for the same cause [[13](#480430_1_En_7_Chapter.xhtml#Par142)].
    The idea is to combine historic success and failure data, with field personnel
    comments, and basic business rules into a data-driven model able to recommend
    treatment methods that optimize design, field plan, equipment use, and job performance.


    The steps to build any advisory solution that predicts well failure, include data
    screening, data feature engineering, root-cause-analysis, recommending actions,
    and feedback.


    ### Data Screening


    Data screening identifies symptoms that show where asset performance is not as
    good as expected. Patterns among wells are detected to identify similar behavior
    and reduce the complexity of the screening problem from several hundred sensors
    to a few categories of similar measurement types.


    ### Data Feature Engineering


    Data feature engineering may involve the generation of data features using domain-knowledge,
    feature extraction, and pattern recognition. The objective of this step is to
    allow the algorithm to act on trends rather than on actual values. Rather than
    acknowledging the fact that the *tubing head pressure* is 1200 kPa, for example,
    the advisory system should consider whether the tubing head pressure is increasing,
    stable, or decreasing. The rate of change in any of the input variables is only
    one of the features in a data stream that needs to be extracted.


    Domain expert interviews and the elaboration of the surveillance logic reveal
    that it is a combination of features in the data streams that are typically used
    by experts to detect events. In only a few cases, it is an absolute value or threshold
    that alarms the experts; usually, it is a series of features in one signal or
    many signals combined.'
