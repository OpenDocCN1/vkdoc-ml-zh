    ## 总结


    本章讨论了两种不同的产量预测方法，即 Arps 和 ARIMA。以北达科他州某口井的产量数据为例，该信息是从一个公共网站抓取的。使用 Arps 方法进行递减曲线分析是油藏工程领域中传统的预测形式。基于时间序列的
    ARIMA 方法则侧重于统计学，为产量预测问题提供了机器学习的视角。这两种方法的应用证明了它们在解决问题上的有效性。我们鼓励您在日常的产量预测工作中应用这些方法。


    # 7. 采油工程


    采油工程涉及分析现场数据和模型，以制定如何最优地维持油井和地面生产设施性能的决策。本章涵盖了使用机器学习方法进行生产建模的精选主题。这些主题包括用于预测井产量的模型识别、识别实现最优产量的早期措施，以及识别可能受益于修井作业的生产井。


    ## 采油工程概述


    采油优化涵盖了多种活动，包括测量、分析、建模、排序和实施旨在提高生产效率和盈利能力的措施。采油工程师通常会广泛考虑多种方案，以在技术、经济和环境方面改善生产系统状况。作为一个从油藏源头到销售点的上游一体化生产系统示例，图
    7-1 展示了从储层界面到销售点的煤层气生产系统示意图[1]。


    ![../images/480430_1_En_7_Chapter/480430_1_En_7_Fig1_HTML.jpg](img/480430_1_En_7_Fig1_HTML.jpg)


    图 7-1


    一体化气水生产系统[1]


    流动压力与产液量之间的关系描述了任意时间点的稳态井性能（图 7-2）。油井优化的结果可能是提高油藏的生产能力（左侧），从而在更高的流动压力下获得更高的产液量，和/或减少流出端的限制（右侧），从而在更低的流动压力下增加产液量。


    ![../images/480430_1_En_7_Chapter/480430_1_En_7_Fig2_HTML.png](img/480430_1_En_7_Fig2_HTML.png)


    图 7-2


    沿流入和流出性能曲线的产量增加


    随着过去几十年数字自动化的引入，已经存在一个成熟的技术框架，用于实现一次性或持续的油气田优化[2]。持续优化需要集成现场硬件（例如，井下传感器、远程激活完井设备、地面设施）和能够支持决策的计算机算法，包括数据处理、虚拟传感、模式识别和物理模型集成。


    采油工程通常通过数据分析和物理建模来解决以下问题。


    *   资产（油藏、油井、设施）是否达到了其全部生产潜力？


    *   监测数据揭示了资产健康状况的哪些信息？


    *   限制产量的因素是什么？


    *   产量损失/延迟的最可能原因是什么？


    *   阻止递减、恢复或增加产量的最有效措施是什么？


    *   如果采取某项措施，它是否会成功、盈利且可持续？


    采油工程是一个持续的过程，旨在提高油气田的技术和财务绩效。其目标是以最小的成本和努力最大化有效的生产系统能力。这个循环过程包括常规数据采集、数据分析和信息整合、方案分析与决策，以及详细的工程设计与执行（见图
    7-3）。


    ![../images/480430_1_En_7_Chapter/480430_1_En_7_Fig3_HTML.jpg](img/480430_1_En_7_Fig3_HTML.jpg)


    图 7-3


    采油工程关键流程


    通过常规监测计划捕获了大量种类和数量的数据，这些数据被同化以通过异常识别来发现异常事件。据此，采油工程师分析并整合所有采集的数据，以评估状态、对系统性能进行建模，并确定油井和设施的最佳运行范围。这种分析允许为油井和设施标记关键性能标签。


    *   基于流动状态：活跃健康、活跃不健康、不活跃

    *   基于预期性能：符合预期、高于或低于预期性能

    *   基于问题识别：无、前兆事件、问题、故障

    *   基于潜力和受限产能：油藏、油井、设施、法规、计划性维护

    '
- fmt: '# With the Introduction of Machine Learning to the Oil and Gas Industry


    With the introduction of machine learning to the oil and gas industry, numerous
    applications have been published to aid in the research of flowing status identification,
    performance metering, and problem identification and production capacity constraints.


    Multiple methods are used to look for opportunities at the reservoir level, including
    drilling new wells or repairing the existing ones by the water shutoff, chemical
    stimulation, reperforating other zones, sidetracking to other areas of the reservoir,
    or abandoning the existing well. Production engineers focus on challenging the
    well production and injection targets, increasing the injection support, selecting
    the best artificial lift system, cleaning the production tubing form solids, and
    so forth. Production engineers also review and ensure maximum surface facilities
    operability and maintenance, including instrumentation, control, wellhead, pipelines,
    separators, pumps, compressors, heaters, and so forth.


    ## Production Optimization


    Optimizing production operations may—with minimum effort—involve ranking the opportunities
    for production increase from the production system (reservoirs, wells, surface
    equipment). Also, to sustain lean operations, production operations require the
    constant review of processes, management systems, the adaptation of people, and
    applications of smart technology. Often, decisions must be made despite the uncertainties
    of well performance, subsurface response, equipment failure rates, and downstream
    demands. The heterogeneity of information and the complexity of current assets
    implies an iterative approach to identify viable opportunities. Managing production
    optimization opportunities involves the management of risk and uncertainty.


    Production optimization is a continuous improvement process regarding production
    performance and asset operations [[3](#480430_1_En_7_Chapter.xhtml#Par132)]. Continuous
    production optimization means that expected performance is frequently challenged
    by updating an optimal forecast with upper-level targets and current asset status
    (see Figure [7-4](#480430_1_En_7_Chapter.xhtml#Fig4)). This is achieved by applying
    actions that close the gap that exists between actual and expected performance.
    Faster surveillance loops compare actual vs. expected performance to determine
    minute-by-minute, hourly and daily gaps. A slower surveillance loop updates the
    asset’s expected performance.


    The main input in a continuous production optimization context includes (i) field
    data for calibration and validation of production models, (ii) field data for
    establishing asset status, (iii) wells and pipeline geometry, and (iv) prior process
    knowledge. The main output is (i) model response indicating expected or actual
    performance, (ii) model mismatch indicating field diagnosis, (iii) manipulated
    variables movements indicating optimal solution, and (iv) optimized forecasts
    and what-if scenarios.


    ![../images/480430_1_En_7_Chapter/480430_1_En_7_Fig4_HTML.jpg](images/480430_1_En_7_Chapter/480430_1_En_7_Fig4_HTML.jpg)


    Figure 7-4


    Continuous production optimization loops


    Because of the complexity of the production system (see Figure [7-1](#480430_1_En_7_Chapter.xhtml#Fig1)),
    there are numerous decisions that an operator can make to find optimum performance.
    These decisions can be grouped into short-term decisions, such as adjusting the
    well’s operating point and establishing well service requirements, and long-term
    decisions, such as well count, spacing and surface facility capacities.


    Multivariable optimization techniques are used in many ways in the oil industry
    to support decisions and to accomplish daily tasks, such as resource scheduling,
    optimum history matching of reservoir parameters, optimal well location and spacing,
    production parameter settings [[4](#480430_1_En_7_Chapter.xhtml#Par133)] [[5](#480430_1_En_7_Chapter.xhtml#Par134)],
    and optimization of the displacement efficiency or recovery factor [[6](#480430_1_En_7_Chapter.xhtml#Par135)].
    Such optimization uses models that are generated offline by using first principles
    or semi-empirically by using data acquired in the field.


    Despite its extensive use in the petrochemical industry, multivariable optimization
    has not penetrated much of the upstream industry. To the extent used, it lacks
    the connection with the real field and does not consider the inclusion of dynamic
    data for the continuous updating of models.


    ## Predicting Well Rate Potential


    *Well rate potential* prediction is one key activity to assess well performance
    needed to establish any gap concerning current measurements. Traditionally, steady-state
    liquid rate (`Q[Liquid]`) is predicted by using the fundamental equation (Equation
    6.1) of fluid flow through porous media [[7](#480430_1_En_7_Chapter.xhtml#Par136)]
    for a vertical well, fully penetrating a single-layer, open-hole and circular
    drainage area (see Figure [7-5](#480430_1_En_7_Chapter.xhtml#Fig5)) and the pressure
    drop across the production system from the bottomhole to the surface.


    ```

    Q_{Liquid} = (k_{ro} / (μ_o β_o) + k_{rw} / (μ_w β_w)) * (kh / (ln(r_e / r_w)
    + S)) * (P_Res - P_fbhp)

    ```


    (7.1)


    Well rate potential `Q[Liquid]` depends on the rock-fluid properties including
    the relative permeability to oil (`k[ro]`) and water (`k[rw]`), the rock properties
    including absolute permeability (`k`) and thickness (`h`), the fluid properties
    (oil and water viscosities (`μ[o]`, `μ[w]`) and oil and water formation volume
    factors (`β[o]`, `β[w]`), the static reservoir pressure (`P[Res]`), the wellbore
    architecture including the wellbore radius (`r[w]`) and reservoir drainage radius
    (`r[e]`) and skin (`S`). The reservoir inflow performance relationship (IPR),
    as shown in Figure [7-2](#480430_1_En_7_Chapter.xhtml#Fig2), can be obtained by
    varying flowing bottom hole pressure (`P[fbhp]`) from zero to static reservoir
    pressure (`P[Res]`).


    `P[fbhp]` is a function also of `Q[Liquid]`, fluid properties (i.e., initial solution
    gas, `Rsi`; oil density, `^oAPI`). The pressure drop in the outflow system depends
    on the wellhead backpressure (`P[sep]`), choke ID, internal tubing diameter (`ID[tubing]`),
    tubing length (`TVDSS[well]`), wellbore deviation angle, wellbore length (`MD[well]`),
    and the fluids inside the tubing (`Q[Oil]`, `Q[wat]`, `Q[gas]`).


    ## Increasing Well Awareness with Virtual Sensors


    On many occasions, direct physical measurements are unavailable or inconsistent
    with process performance due to sensor failure, technology availability, instrument
    reliability, or economic reasons. In such situations, virtual sensors are convenient
    replacements of physical sensors that use available data during well-known conditions
    in instrumented wells to predict other measurements [[8](#480430_1_En_7_Chapter.xhtml#Par137)].
    Many technologies have been developed to estimate rates and pressures from other
    indirect measurements (e.g., virtual metering or soft sensors).


    For example, wellhead pressure (WHP) and temperature (WHT) are related to flow
    line pressure (FLP) for a specific choke diameter; therefore, it is convenient
    to establish a machine learning model among these four variables so that it can
    serve as a replacement whenever needed. Since most of the oil and gas wells exhibit
    a nonstationary process, where the boundary conditions may change along with the
    life of the same, it is probably safe to recognize that the virtual sensor model
    may not be valid throughout the life of the well, but for a specific period of
    time.


    ![../images/480430_1_En_7_Chapter/480430_1_En_7_Fig5_HTML.jpg](images/480430_1_En_7_Chapter/480430_1_En_7_Fig5_HTML.jpg)


    Figure 7-5


    Vertical well with gas-lift'
