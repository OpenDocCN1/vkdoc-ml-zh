- fmt: '# Salt Interpretation with Machine Learning


    In this section, the focus will be on giving an overview of supervised learning
    problems in seismic imaging. As an example, we will focus in detail on the problem
    of binary segmentation for the case of velocity model building described in the
    previous sections.


    The problem of semantic segmentation is well studied in the computer vision community.
    The goal is to assign each pixel of the image an object class. Figure [4-10](#480430_1_En_4_Chapter.xhtml#Fig10)
    shows examples from a computer vision dataset and seismic image-mask pair to draw
    similarity between the problems. The left pane shows two samples from a semantic
    segmentation dataset. The right pane shows the seismic image and the mask obtained
    by semantic segmentation process on the given input image. Apart from recognizing
    various objects in the image, the task is also to delineate the boundaries of
    the object.


    ![../images/480430_1_En_4_Chapter/480430_1_En_4_Fig10_HTML.jpg](images/480430_1_En_4_Chapter/480430_1_En_4_Fig10_HTML.jpg)


    Figure 4-10


    Semantic segmentation: Computer vision v/s Seismic Imaging


    Conceptually, this is similar to the interpretation process used in velocity model
    building workflow. Given a seismic image, the goal is to classify each pixel in
    the seismic image as salt or sediment. This can be cast as a supervised learning
    problem similar to the semantic segmentation problem for computer vision, where
    the image is the output from the migration algorithm, and the label is a binary
    mask.


    An example is shown in Figure [4-10](#480430_1_En_4_Chapter.xhtml#Fig10) that
    shows the similarity of the semantic segmentation problem in seismic imaging.
    This is a slice of a larger 3D cube of data that represents the post-migrated
    amplitudes. The labels are extracted from the velocity model of the same area.
    An important point to note is that these are continuous amplitudes unlike images
    in computer vision datasets that have been quantized. Further, images sampled
    from different migrated volumes have different amplitude distributions. Therefore,
    it is common to apply normalization of some form before applying deep learning
    algorithms on these images.


    There are some important aspects of applying deep learning algorithms to seismic
    images. Please note that these are specific to the problem of interpreting salt
    from seismic images.


    1. **Choice of image sizes:** A suitable window extraction algorithm can be used
    to use patches for training or inference.

    2. **Preprocessing of the images:** In order to convert the continuous amplitudes
    to quantized levels, we apply normalization. Most methods of normalization do
    work in principle. However, scaling based on the mean and standard deviation has
    shown to work.


    ## Dataset Description


    We use the dataset from TGS Kaggle Salt Interpretation challenge [[5](#480430_1_En_4_Chapter.xhtml#Par49)]
    that was hosted by TGS and Kaggle. The data is a set of images chosen at various
    locations chosen at random in the subsurface. The images are 101 × 101 pixels,
    and each pixel is classified as salt or sediment. Figure [4-11](#480430_1_En_4_Chapter.xhtml#Fig11)
    shows a few samples of the images from the chosen dataset.


    ![../images/480430_1_En_4_Chapter/480430_1_En_4_Fig11_HTML.jpg](images/480430_1_En_4_Chapter/480430_1_En_4_Fig11_HTML.jpg)


    Figure 4-11


    A few sample images (left) and corresponding labels (right) from the Kaggle dataset


    ## U-Net for Semantic Segmentation


    In order to train a deep learning model to perform semantic segmentation, several
    architectures have been published over the last few years. Some of the architectures
    for semantic segmentation have established state-of-the-art records in segmentation
    [[6](#480430_1_En_4_Chapter.xhtml#Par50)]. Although we will list the publications
    explaining the models in detail, in this chapter, we will focus on U-Net as a
    canonical example [[7](#480430_1_En_4_Chapter.xhtml#Par51)].


    As shown in Figure [4-12](#480430_1_En_4_Chapter.xhtml#Fig12), U-Net consists
    of a contracting path (as seen on the left of the image), and an expanding path
    (as seen on the right). The contracting path follows the architecture of convolutional
    neural networks. Repeated application of two 3 × 3 convolutions, each followed
    by a Rectified Linear Unit (ReLU), and a max-pooling operation with a stride of
    2 for downsampling. At each downsampling step, the feature channels are doubled.
    Every step in the expanding path consists of an upsampling of the feature map,
    followed by a 2 × 2 convolution (“up-convolution”). This upsampling step halves
    the number of feature channels, concatenates it with the corresponding cropped
    feature map from the contracting path, two 3 × 3 convolutions each followed by
    a ReLU. The cropping is necessary due to the loss of border pixels in every convolution.
    At the final layer a 1 × 1 convolution is used to map each 64-component feature
    vector to the desired number of classes. In total the network has 14 convolutional
    layers.


    ![../images/480430_1_En_4_Chapter/480430_1_En_4_Fig12_HTML.jpg](images/480430_1_En_4_Chapter/480430_1_En_4_Fig12_HTML.jpg)


    Figure 4-12


    U-Net architecture (Reference [[7](#480430_1_En_4_Chapter.xhtml#Par51)])


    ## Loss Function for U-Net


    An objective function of intersection over union (IOU) is commonly used for evaluating
    the accuracy of semantic segmentation problems (Figure [4-13](#480430_1_En_4_Chapter.xhtml#Fig13)).
    Several other objective functions have been proposed in the computer vision community.
    We want to note that although IOU is a commonly used metric for evaluating segmentation
    networks, the example shared in the Jupyter notebook uses binary crossentropy
    as the loss function for the simple reason that it is easier to understand and
    commonly available in most of the deep learning libraries.


    To apply the metric, the intersection over the predicted object and the expected
    object are computed for the numerator, and the union over the predicted object
    and the expected object are computed for the denominator. The quotient is the
    metric for measuring the accuracy. As can be seen, if the model predicts the shape
    of the object accurately, the intersection over union will be 1.


    ![../images/480430_1_En_4_Chapter/480430_1_En_4_Fig13_HTML.jpg](images/480430_1_En_4_Chapter/480430_1_En_4_Fig13_HTML.jpg)


    Figure 4-13


    Objective function of intersection over union'
