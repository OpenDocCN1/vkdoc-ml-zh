    ### 多层感知机 (MLP)


    多层感知机（MLP）是最基础的深度学习算法。神经元是深度神经网络（包括 MLP）的基本构建模块。图 3-20 展示了一个神经元的示意图。神经元通过使用与输入相关联的权重计算输入值的加权和，然后对加权和施加一个非线性的*激活函数*（*f*）。神经元执行的这种非线性变换赋予了
    MLP 和其他深度神经网络对高度非线性过程进行建模的能力，这些过程出现在许多自然现象和工业问题中。神经元也被称为*神经网络节点*。


    ![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig20_HTML.jpg](img/480430_1_En_3_Fig20_HTML.jpg)


    图 3-20


    人工神经网络中神经元计算的示意图


    神经元可以使用多种激活函数来执行非线性变换。Sigmoid 函数和双曲正切函数是经典使用的激活函数。一些更先进的激活函数包括*线性整流单元*（ReLU）、带泄露的
    ReLU 和指数线性单元。图 3-21 展示了这些传统和现代非线性激活函数 [11] 的函数形式和形状对比。这些函数易于求导（连续且可微）。这一特性使得这些函数在梯度计算过程中计算效率很高，而梯度计算是训练深度神经网络的重要部分。


    ![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig21_HTML.jpg](img/480430_1_En_3_Fig21_HTML.jpg)


    图 3-21


    传统与现代激活函数对比 [11]


    图 3-22 展示了一个 MLP 的示意图。这种深度神经网络由以下组件构成。


    ![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig22_HTML.jpg](img/480430_1_En_3_Fig22_HTML.jpg)


    图 3-22


    多层感知机的示意图


    *   **输入层：** 该层包含节点，这些节点便于将输入特征引入神经网络，并应用非线性变换。


    *   **隐藏层：** 这些层包含具有非线性激活函数的神经元或节点。隐藏层由一个权重矩阵（*W*）和一个偏置向量（*b*）表示。矩阵 *W* 和向量 *b*
    的维度取决于该层中节点的数量。例如，连接 *m* 个输入（特征矩阵 *X*）并将值广播到第一个隐藏层中 *n* 个节点的输入层，其权重矩阵的维度为 *m*
    × *n*。同时，偏置向量 *b* 有 *n* 个元素。该层的输出是 *f* (*WX* + *b*)，其中 *f* 是激活函数。


    *   **输出层：** 输出层与最后一个隐藏层连接，并确保神经网络的输出与问题定义一致。例如，如果神经网络正在被训练用于对具有 *k* 个不同类别的数据集进行分类，输出层会计算
    *k* 个不同的值，然后对每个 *k* 值应用 softmax 函数。在所描述的场景中，输出中的每个元素对应样本属于 *k* 个类别中某一个的概率。


    *   **优化器：** 优化器通过使用误差反向传播来促进神经网络各层权重矩阵 *W* 和偏置向量 *b* 的更新。


    优化器使用损失函数来评估预测值的准确性。在回归问题中，这个损失函数可以是 RMSE。然而，在分类问题中，可能需要一个相对复杂的损失函数。在分类问题中，输出层提供
    *k* 个概率值（*y*）。如果一个对象只属于其中一个对象类别（这是大多数现实世界分类任务的情况），那么为了实现分类器的最佳性能，这 *k* 个值中应该有一个接近
    1。标签被进行独热编码，以将类别标签转换为概率。例如，在一个 *k*=3 类的问题中，类别 1、2 和 3 分别表示为独热向量（*p*）[1, 0, 0]、[0,
    1, 0] 和 [0, 0, 1]。像分类交叉熵这样的损失函数会使用这些值来提供误差的定量估计，这对于迭代更新神经网络模型参数（即权重和偏置）非常有用。通过使用输出向量（*y*）和独热编码标签向量（*p*），可以使用以下公式计算分类交叉熵。


    ![$$ crossentropy=\sum \limits_{i=1}^k-{p}_i\log \left({y}_i\right). $$](img/480430_1_En_3_Chapter_TeX_Equ13.png)


    (3.13)


    接下来，我们将这些概念应用于对图 3-23 所示数据集中的图像进行分类。


