  raw: '### Virtual Rate Metering


    Well surveillance is essential for reservoir characterization, managing production
    potential, and selecting activities to enhance production. Key to surveillance
    is to understand well flowing conditions (i.e., flow rates and flowing status).
    Typically, well rates (i.e., oil, water, and gas) are not directly measured all
    the time; however, with virtual sensors, it is possible to build and implement
    continuous *well rate estimation* (WRE), also known as *virtual rate estimators*
    (VRE). Virtual rate metering is one type of a virtual sensor [[9](#480430_1_En_7_Chapter.xhtml#Par138)].


    One class of virtual rate estimators that is very well-known in the oil and gas
    industry is derived from physics-based nodal analysis models. This rate estimation
    requires consistent pressure-volume-temperature (PVT) data, fit-for-purpose production
    well tests, and reliable sensors [[10](#480430_1_En_7_Chapter.xhtml#Par139)].
    In these kinds of models, missing data, biased data, or failing sensors may break
    the rate estimation, and a new calibration is required. In addition, sensor input
    uncertainty and rate estimation confidence are commonly overlooked in these approaches
    [[11](#480430_1_En_7_Chapter.xhtml#Par140)].


    Another approach is to focus on data-driven VRE, enabled by machine learning algorithms.
    The process involves prediction models for generating instantaneous predictions
    of multiphase flow rates, cumulative production, and other quantities of interest,
    such as GOR, WCT, using real-time sensor data at the surface, and historical production,
    and well test data.


    Data-driven VRE produces encouraging results when measured data is sufficient,
    including frequent well tests (e.g., 8–12 per year), permanent wellhead, and flowline
    sensors (pressure, temperature). The availability of downhole sensors is desirable
    but not required.


    ### Predicting Well Rates from Indirect Measurements


    Consider a naturally-flowing well with more than 2000 flow tests available. A
    machine learning model for predicting virtual rates—including oil, water, and
    gas—is built with half of the tests available to predict the other half. The input
    data refers to available well measurements, including bottomhole pressure (BHP),
    wellhead pressure (WHP), wellhead temperature (WHT), separator pressure (Psep),
    separator temperature (TSep), and chokes internal diameter (ID_Choke). The predicted
    output includes the oil, water, and gas rates as a function of all the given measurements.


    *   Input data: “Well_Rates.csv”


    *   Python code: “Chapter07_Well_Rate_Predictor_RF_GBM.ipynb”


    The notebook provides simplified code for the oil predictor using Random Forest
    (RF) regression method (i.e., rate = *f* (BHP, WHP, WHT, Tsep, Psep, Choke)).
    Additional virtual metering functions are available in the provided file.


    ```

    df = pd.read_csv("./data/Well_Rates.csv")

    X = df[["BHP", "WHP", "WHT", "Tsep", "Psep", "Choke_in"]]

    y = np.array(df[["Qoil"]].values).reshape(-1, )

    scaler = MinMaxScaler()  # Scale Data

    ```


    Unsupervised classification (e.g., DBSCAN, GMIX) over the normalized PCA data
    can select clean data prior to feeding to the regression step.


    ```

    X_scaled = scaler.fit_transform(X)

    pca = PCA()

    X_pca = pca.fit_transform(X_scaled)  # Perform PCA

    pca_df = pd.DataFrame(X_pca)

    # Cluster using DBSCAN

    clustering = DBSCAN(eps=0.5, min_samples=12).fit(X_pca)

    pca_df["DBSCAN"] = clustering.labels_ + 1

    # Keep only the rows where DBSCAN=0

    clust_df = pca_df[(pca_df["DBSCAN"] == 1)]

    # Delete text columns "DBSCAN"

    clust_df.drop(columns=["DBSCAN"],inplace=True)

    # Merge data

    X_merge = X.merge(pca_df,left_index=True,right_index=True)

    X_merge["Labelled Y"] = y

    ```


    Create training data and split the set into training and validation data sets.


    ```

    # Bring only the Xrows selected as per Clust_df --> # X.iloc[clust_df.index.tolist(),:]

    # Bring only the Yrows selected as per Clust_df --> # y[clust_df.index.tolist()

    train_X, test_X, train_y, test_y = train_test_split(X.iloc[clust_df.index.tolist(),:],y[clust_df.index.tolist()],
    test_size=0.5, random_state=123)

    ```


    Build a RF estimator.


    ```

    # Random Forest Regression

    model_RF = RF(n_estimators=200, random_state=123)

    model_RF.fit(train_X, train_y)

    ```


    Predictions for training and validation data sets.


    ```

    pred_y_RF_test = model_RF.predict(test_X) # Blind test

    pred_y_RF_train = model_RF.predict(train_X)

    pred_y_RF_all = model_RF.predict(X.iloc[clust_df.index.tolist(),:])

    # Compute  r2 scores

    r2_RF_train = r2_score(train_y, pred_y_RF_train)

    r2_RF_test = r2_score(test_y, pred_y_RF_test)

    r2_RF_all = r2_score(y[clust_df.index.tolist()], pred_y_RF_all)

    ```


    Include calculations with the original data set so they can be plotted.


    ```

    # RF to X_merge file

    all_pred = np.array([np.nan for i in range(len(X_merge))])

    all_pred[clust_df.index.tolist()] = pred_y_RF_all

    X_merge["Predicted_RF"] = all_pred

    X_merge.to_csv("X_merge.csv", index=False)

    ```


    Prepare plots.


    ```

    # Xplot of predicted and actual values

    fig = plt.figure(figsize=(6,6))

    ax = plt.axes()

    plt.scatter(y[clust_df.index.tolist()], pred_y_RF_all, c="blue")

    plt.scatter(test_y, pred_y_RF_test, c="red")

    ax.set(xlabel="Test Data", ylabel="RF Model Prediction", title="Oil Rate RF Predictor
    Model")

    plt.show()

    ```


    The same procedure can be repeated with the GBM estimator or any other algorithm
    that you prefer. The results of RF and GBM regression methods are shown in Figure
    [7-6](#480430_1_En_7_Chapter.xhtml#Fig6).


    ![../images/480430_1_En_7_Chapter/480430_1_En_7_Fig6_HTML.jpg](images/480430_1_En_7_Chapter/480430_1_En_7_Fig6_HTML.jpg)


    Figure 7-6


    Well virtual rate estimator for RF and GBM methods (red is training data, blue
    is blind test data)


    The regressor scores are as follows.


    *   R² for train data using random forest is 0.999838.


    *   R² for blind test data using random forest is 0.998584.


    *   R² for all data using random forest is 0.999230.'
