    \n#### 集合\n\n集合（Set）用花括号（`{}`）括起来，元素之间用逗号分隔，是一个无序的元素集合。由于元素没有特定的顺序，因此索引在集合中没有意义。集合可以包含不同数据类型的元素，但这些元素必须是唯一的且不可变的。然而，集合本身是可以改变的，并且可以向其中添加/删除元素。\n\
    \n使用集合的一大优势是能够执行数学运算，如并集、交集、对称差集等。尽管元素可以是不同的数据类型，如整型、浮点型或字符串，但集合不能包含可变元素（如列表或字典）作为其元素。下面是一个示例，展示了如何更新集合的元素以及打印两个集合的并集。集合可用的方法包括\
