  trans: '

    #### 生产作业


    一旦油井开始产出石油和天然气，生产工程师和油藏工程师会持续监测该井的生产趋势。在整个油井生命周期内，其油气产量会随时间推移而递减。生产工程师会制定方案，通过采用诸如人工举升等技术来维持油井的石油流动。人工举升可以利用泵（如电动潜油泵、抽油杆泵等），或通过向井底注入气体进行气举，以增加或维持油井的油气流量。在生产作业期间，还可以进行其他修井和干预作业，例如更换完井设备以维持油井的产出。


    #### 废弃


    经过多年的持续生产，油井的油气产量持续下降。如前所述，工程师们会尝试通过修井和干预作业来使油井复产。然而，在某个时间点之后，鉴于油井极低的生产潜力，复产可能被认为在经济上不可行。在这种情况下，油井会被注入水泥封堵并废弃。这是油气井生命周期的最后一个阶段。在封堵和废弃过程中，会严格遵守不同监管机构制定的封井要求，以确保合规。


    ### 中游产业


    中游产业负责将从油井产出的原油运输至下游加工设施。运输方式可通过管道、油轮、卡车或铁路。此外，中游产业还负责石油商品（包括原油和天然气）的储存和营销。通过这种方式，中游产业充当了偏远地区油气生产设施与通常建在人口稠密区附近的下游加工设施之间的连接纽带。


    ### 下游产业


    下游产业的主要功能包括原油的分馏或裂解（将粘稠的高分子量原油转化为透明状的低分子量石油燃料的过程）以及相关的化学处理。随后是调合操作，最终生产出供大众消费的成品石油燃料。此外，下游炼油厂还负责天然气的净化。下游产业的完整范围包括炼油厂、石化厂、分销运营、零售中心及其他相关设施。在石油天然气行业的三个部门中，下游产业对普通大众的可见度最高，因为我们几乎所有人日常通勤的车辆都使用汽油或柴油。喷气燃料、沥青、润滑油、塑料和天然气是下游产业生产的其他各种石油产品。


    到目前为止，我们已经讨论了石油天然气行业的三个部门。我们有意将中游和下游产业的描述保持简短。在接下来的章节中，我们将重点讨论上游石油天然气行业的数字化及其与机器学习的联系。


    ## 数字油田


    全球石油天然气行业拥有巨大的经济影响力。根据公共领域可用的数据，2017 年全球石油天然气公司的收入约为 5.5 万亿美元[5]。其中，排名前十的公司占据了近一半的收入（见图
    1-3）。近年来，几乎所有公司都开始投资于数字化转型工作。根据世界经济论坛发布的一份报告，2016 年至 2025 年间，石油天然气行业的数字化转型可能价值
    1.6 万亿至 2.5 万亿美元[6]。这些数字让我们得以一窥石油天然气行业数字化努力的巨大规模。


    ![../images/480430_1_En_1_Chapter/480430_1_En_1_Fig3_HTML.jpg](img/480430_1_En_1_Fig3_HTML.jpg)


    图 1-3


    全球领先的石油天然气公司及其在 2017 年全球收入中的份额[5]


    数字化对石油天然气行业来说并不新鲜。计算机辅助的互联油田可以追溯到 20 世纪 70 年代末[7]。在过去二十年中，上游石油天然气行业在实时数据和现场驱动设备的使用方面呈指数级增长，这导致了众多数字油田的实施。这些实施已展现出在提升运营效率、优化产量和最大化油气采收率方面的价值。同时，数字油田的实施促进了更好、更快的决策，同时降低了健康、环境和安全风险。正式地讲，数字油田是一个“测量-计算-控制”循环的过程，其频率能够确保系统在其时间常数约束内始终维持最佳运行条件，同时可持续地：


    *   最大化产量

    *   最小化资本支出/运营支出

    *   最小化环境影响

    *   保障相关人员的安全和相关设备的完整性[8] [9]


    这些目标可以通过协调四个相互关联的领域来实现：人员、自动化工作流程、流程和技术。需要注意的是，要恰当地描述支持数字油田实施的工作流程需要付出巨大努力。简而言之，数字油田是自动化与信息技术的集合，它转变了石油资产管理理念，并驱动更高效的运营工作流程。它涉及由数字自动化支持的学科、数据、应用和工作流集成工具的协同（见图
    1-4），具体包括以下内容。


    ![../images/480430_1_En_1_Chapter/480430_1_En_1_Fig4_HTML.jpg](img/480430_1_En_1_Fig4_HTML.jpg)


    图 1-4


    数字油田的不同组成部分


    *   现场仪表

    *   遥测技术

    *   自动化

    *   数据管理

    *   集成生产模型

    *   工作流自动化

    *   可视化

    *   协作环境

    *   预测分析


    成功的数字油田实施需要所有这些组件之间的同步。数字油田的预测分析组件负责为油田的当前和未来前景生成数据驱动的洞察。该组件通常承载着机器学习算法，是成功实施数字油田的关键。在下一节中，我们将讨论机器学习如何为数字油田实施乃至整个石油天然气行业提供预测分析能力。

    '
- fmt: '# Upstream Industry and Machine Learning


    The upstream industry has used machine learning for decades. However, it may have
    been referred to as artificial intelligence, or by other alternate names. Figure
    [1-5](#480430_1_En_1_Chapter.xhtml#Fig5) shows a composite timeline of machine
    learning and oil and gas industry milestones. In the timeline, special emphasis
    has been given to the oil and gas industry milestones representing an advancement
    in data acquisition and digitalization. Based on the nature of advancements in
    the timeline, we can group the timeline into distinct periods. The time up to
    the first decade of the twentieth century is the foundation for both industries.


    ![../images/480430_1_En_1_Chapter/480430_1_En_1_Fig5_HTML.jpg](images/480430_1_En_1_Chapter/480430_1_En_1_Fig5_HTML.jpg)


    **Figure 1-5** Oil and gas industry and machine learning milestones. Compiled
    from references [[2](#480430_1_En_1_Chapter.xhtml#Par133)] and [[10](#480430_1_En_1_Chapter.xhtml#Par139)]


    During the early years, fundamental theoretical discoveries—such as Bayes’ theorem
    and the least-squares method—took place in the machine learning arena. In the
    oil and gas industry, first commercial oil wells were drilled, and oil gained
    popularity as an important fuel, slowly replacing coal-fired steam engines. As
    we move toward the mid-twentieth century, we observe the use of electrical logging
    in the oil and gas industry. In contrast, Turing’s learning machine appears shortly
    after the first general-purpose computer (ENIAC, 1945) came into existence.


    The 1950s mark two very important discoveries in the field of machine learning:
    neural networks and perceptrons. Both are considered as the basis of the powerful
    advanced machine learning algorithms developed in the latter part of the twentieth
    century. The 1960s mark some important advances in the oil and gas tooling, including
    digital dipmeter (which could log dip angle in a wellbore, and help in differentiating
    different types of rock layers). The 1960s also marked the invention of the nearest-neighbors
    algorithm, which is one of the fundamental algorithms in machine learning.


    As we move further, we see several significant developments in the oil and gas
    industry during the 1970s. Some of the significant technologies, such as bright
    spot seismic, logging systems, mud-pulse telemetry, and measurement-while-drilling
    (MWD), came into existence during this decade. All of these were significant developments
    in data acquisition technologies, and to this date, remain among some of the very
    important data sources for petroleum engineers. During this decade, the earliest
    conceptualization and implementation of digital oilfields took place, where the
    integration of different information platforms was performed through computer
    systems. For machine learning, backpropagation theory came into existence. The
    importance of the backpropagation theory can be understood from the fact that
    without this theory, we would not have seen a revolution in the field of artificial
    intelligence that neural networks have ushered in the recent years.


    During the 1980s, 3D seismic forever changed the way geoscientists studied subsurface
    structures. Around the same time, logging-while-drilling (LWD) enabled access
    to real-time data during drilling operations, providing precise information about
    the physical properties of the subsurface formation. During the same decade, the
    invention of neocognitron laid down the foundation of advanced computer vision,
    and recurrent neural network (RNN) provided a new tool for sequence modeling.
    It can only be a coincidence that one of the most important advances in 3D seismic
    imaging of the subsurface, and discovery of the fundamental computer vision algorithm
    neocognitron, were a couple of years apart. In Chapter [4](#480430_1_En_4_Chapter.xhtml)
    of this book, you will see how these two events, which happened only two years
    apart in two different industries, can be connected to generate insight about
    the earth’s subsurface structure by applying computer vision algorithms to the
    seismic images.


    Two more essential discoveries in the field of machine learning during the 1980s
    were the application of backpropagation theory to facilitate the training of neural
    networks and the foundation of reinforcement learning. Reinforcement learning
    is one of the machine learning paradigms, which relies on reward functions to
    train software agents for accomplishing specific tasks. These are the algorithms
    that can teach a virtual player to win a game against a human, or teach a robot
    to walk like a human.^([¹](#fn1))


    In the 1990s, significant advancements happened in seismic technology. On one
    hand, supercomputers were employed to process 3D seismic data. On the other hand,
    4D seismic data helped geoscientists interpret and visualize the evolution of
    the subsurface structures over time. This was also a decade of another beautiful
    coincidence. As geoscientists gained the capability of understanding the evolution
    of seismic in a time sequence, machine learning found a new algorithm called `long
    short-term memory` (LSTM) for sequence prediction. These two events are marked
    on the timeline a mere three years apart. LSTM addressed some limitations in the
    conventional recurrent neural networks and provided a better capability of sequence
    prediction. You will learn more about LSTMs in Chapter [3](#480430_1_En_3_Chapter.xhtml).


    The 1990s also witnessed the discovery of random forest and support vector machine
    algorithms. Over time, the random forest algorithm has earned a place among the
    go-to algorithms of every machine learning practitioner.


    The 1990s was a decade of accelerated research in the field of machine learning,
    and one of the fascinating algorithms to be published during this decade was the
    convolutional neural network (CNN). CNNs have been a driving force in the field
    of computer vision in the past decade. During the 1990s, the oil and gas industry
    also witnessed new technologies, such as sonic logging, closed-loop drilling systems,
    and intelligent wells.'
  raw: '## Upstream Industry and Machine Learning


    The upstream industry has used machine learning for decades. However, it may have
    been referred to as artificial intelligence, or by other alternate names. Figure
    [1-5](#480430_1_En_1_Chapter.xhtml#Fig5) shows a composite timeline of machine
    learning and oil and gas industry milestones. In the timeline, special emphasis
    has been given to the oil and gas industry milestones representing an advancement
    in data acquisition and digitalization. Based on the nature of advancements in
    the timeline, we can group the timeline into distinct periods. The time up to
    the first decade of the twentieth century is the foundation for both industries.


    ![../images/480430_1_En_1_Chapter/480430_1_En_1_Fig5_HTML.jpg](images/480430_1_En_1_Chapter/480430_1_En_1_Fig5_HTML.jpg)


    Figure 1-5


    Oil and gas industry and machine learning milestones. Compiled from references
    [[2](#480430_1_En_1_Chapter.xhtml#Par133)] and [[10](#480430_1_En_1_Chapter.xhtml#Par139)]


    During the early years, fundamental theoretical discoveries—such as Bayes’ theorem
    and the least-squares method—took place in the machine learning arena. In the
    oil and gas industry, first commercial oil wells were drilled, and oil gained
    popularity as an important fuel, slowly replacing coal-fired steam engines. As
    we move toward the mid-twentieth century, we observe the use of electrical logging
    in the oil and gas industry. In contrast, Turing’s learning machine appears shortly
    after the first general-purpose computer (ENIAC, 1945) came into existence.


    The 1950s mark two very important discoveries in the field of machine learning:
    neural networks and perceptrons. Both are considered as the basis of the powerful
    advanced machine learning algorithms developed in the latter part of the twentieth
    century. The 1960s mark some important advances in the oil and gas tooling, including
    digital dipmeter (which could log dip angle in a wellbore, and help in differentiating
    different types of rock layers). The 1960s also marked the invention of the nearest-neighbors
    algorithm, which is one of the fundamental algorithms in machine learning.


    As we move further, we see several significant developments in the oil and gas
    industry during the 1970s. Some of the significant technologies, such as bright
    spot seismic, logging systems, mud-pulse telemetry, and measurement-while-drilling
    (MWD), came into existence during this decade. All of these were significant developments
    in data acquisition technologies, and to this date, remain among some of the very
    important data sources for petroleum engineers. During this decade, the earliest
    conceptualization and implementation of digital oilfields took place, where the
    integration of different information platforms was performed through computer
    systems. For machine learning, backpropagation theory came into existence. The
    importance of the backpropagation theory can be understood from the fact that
    without this theory, we would not have seen a revolution in the field of artificial
    intelligence that neural networks have ushered in the recent years.


    During the 1980s, 3D seismic forever changed the way geoscientists studied subsurface
    structures. Around the same time, logging-while-drilling (LWD) enabled access
    to real-time data during drilling operations, providing precise information about
    the physical properties of the subsurface formation. During the same decade, the
    invention of neocognitron laid down the foundation of advanced computer vision,
    and recurrent neural network (RNN) provided a new tool for sequence modeling.
    It can only be a coincidence that one of the most important advances in 3D seismic
    imaging of the subsurface, and discovery of the fundamental computer vision algorithm
    neocognitron, were a couple of years apart. In Chapter [4](#480430_1_En_4_Chapter.xhtml)
    of this book, you will see how these two events, which happened only two years
    apart in two different industries, can be connected to generate insight about
    the earth’s subsurface structure by applying computer vision algorithms to the
    seismic images.


    Two more essential discoveries in the field of machine learning during the 1980s
    were the application of backpropagation theory to facilitate the training of neural
    networks and the foundation of reinforcement learning. Reinforcement learning
    is one of the machine learning paradigms, which relies on reward functions to
    train software agents for accomplishing specific tasks. These are the algorithms
    that can teach a virtual player to win a game against a human, or teach a robot
    to walk like a human.^([¹](#fn1))


    In the 1990s, significant advancements happened in seismic technology. On one
    hand, supercomputers were employed to process 3D seismic data. On the other hand,
    4D seismic data helped geoscientists interpret and visualize the evolution of
    the subsurface structures over time. This was also a decade of another beautiful
    coincidence. As geoscientists gained the capability of understanding the evolution
    of seismic in a time sequence, machine learning found a new algorithm called *long
    short-term memory* (LSTM) for sequence prediction. These two events are marked
    on the timeline a mere three years apart. LSTM addressed some limitations in the
    conventional recurrent neural networks and provided a better capability of sequence
    prediction. You will learn more about LSTMs in Chapter [3](#480430_1_En_3_Chapter.xhtml).


    The 1990s also witnessed the discovery of random forest and support vector machine
    algorithms. Over time, the random forest algorithm has earned a place among the
    go-to algorithms of every machine learning practitioner.


    The 1990s was a decade of accelerated research in the field of machine learning,
    and one of the fascinating algorithms to be published during this decade was the
    convolutional neural network (CNN). CNNs have been a driving force in the field
    of computer vision in the past decade. During the 1990s, the oil and gas industry
    also witnessed new technologies, such as sonic logging, closed-loop drilling systems,
    and intelligent wells.'
  trans: "\n## 上游产业与机器学习\n\n上游产业应用机器学习已有数十年历史，不过它可能曾被称作人工智能或其他别名。图 1-5 展示了机器学习与石油天然气行业里程碑事件的综合时间线。该时间线特别强调了代表数据采集与数字化进程的油气行业里程碑。根据时间线上技术演进的性质，我们可以将其划分为不同时期。截至\
    \ 20 世纪头十年，这两个行业都处于奠基阶段。\n\n![../images/480430_1_En_1_Chapter/480430_1_En_1_Fig5_HTML.jpg](img/480430_1_En_1_Fig5_HTML.jpg)\n\
    \n图 1-5  \n石油天然气行业与机器学习里程碑事件。数据来源：参考文献[2]和[10]\n\n在早期阶段，机器学习领域诞生了基础理论发现——如贝叶斯定理和最小二乘法。而在石油天然气行业，首批商业油井被钻探，石油作为重要燃料逐渐普及，并缓慢取代燃煤蒸汽机。进入\
    \ 20 世纪中期，我们看到油气行业开始使用电测井技术。与此同时，图灵的学习机在第一台通用计算机（ENIAC，1945 年）问世后不久便出现了。\n\n20\
    \ 世纪 50 年代标志着机器学习领域两项极其重要的发现：神经网络和感知机。这两者都被视为 20 世纪后期发展出的强大高级机器学习算法的基础。20 世纪 60\
    \ 年代，油气行业工具取得重要进展，包括数字地层倾角仪（可测量井筒中的地层倾角，帮助区分不同类型的岩层）。同一时期还诞生了最近邻算法，这是机器学习的基础算法之一。\n\
    \n随着时间推移，我们看到 20 世纪 70 年代油气行业出现了多项重大发展。一些关键技术如亮点地震、测井系统、泥浆脉冲遥测和随钻测量（MWD）均在这一时期问世。这些都是数据采集技术的重大进步，至今仍是石油工程师最重要的数据来源之一。在这十年间，数字油田的初步概念化和实施得以实现，通过计算机系统整合了不同信息平台。对于机器学习而言，反向传播理论诞生了。反向传播理论的重要性体现在：没有它，我们就不会看到近年来神经网络引领的人工智能领域革命。\n\
    \n20 世纪 80 年代，三维地震彻底改变了地球科学家研究地下结构的方式。大约在同一时期，随钻测井（LWD）技术使钻井作业期间能够获取实时数据，提供关于地下地层物理特性的精确信息。同一十年间，新认知机的发明为高级计算机视觉奠定了基础，而循环神经网络（RNN）则为序列建模提供了新工具。或许只是巧合：地下三维地震成像最重要的进展之一，与基础计算机视觉算法新认知机的发现，仅相隔数年。在本书第\
    \ 4 章中，您将看到这两个在不同行业仅相隔两年发生的事件，如何通过将计算机视觉算法应用于地震图像，从而产生对地球地下结构的洞察。\n\n20 世纪 80\
    \ 年代机器学习领域的另外两项重要发现是：应用反向传播理论促进神经网络训练，以及强化学习的基础建立。强化学习是机器学习范式之一，它依靠奖励函数来训练软件代理完成特定任务。这些算法可以教会虚拟玩家在游戏中战胜人类，或教会机器人像人类一样行走。^(¹)\n\
    \n20 世纪 90 年代，地震技术取得了重大进展。一方面，超级计算机被用于处理三维地震数据；另一方面，四维地震数据帮助地球科学家解释和可视化地下结构随时间的演变。这又是一个美妙巧合的十年。当地球科学家获得了理解地震时间序列演变的能力时，机器学习发现了一种名为*长短期记忆*（LSTM）的新算法用于序列预测。这两个事件在时间线上仅相隔三年。LSTM\
    \ 解决了传统循环神经网络的一些局限性，提供了更强的序列预测能力。您将在第 3 章中了解更多关于 LSTM 的知识。\n\n20 世纪 90 年代还见证了随机森林和支持向量机算法的发现。随着时间的推移，随机森林算法已成为每位机器学习从业者首选算法之一。\n\
    \n20 世纪 90 年代是机器学习研究加速发展的十年，在此期间发表的最引人入胜的算法之一是卷积神经网络（CNN）。CNN 在过去十年中一直是计算机视觉领域的驱动力。在\
    \ 20 世纪 90 年代，石油天然气行业也见证了新技术的发展，如声波测井、闭环钻井系统和智能井。\n"
- fmt: 'Since the beginning of the twenty-first century, the oil and gas industry
    has seen significant technological advancement in the space of data acquisition.
    Along with the vast amounts of data acquired by the offshore seismic surveys,
    the boom in unconventional oil and gas industry has also been a source of large
    amounts of data. Furthermore, computing hardware advances, such as graphics processing
    units (`GPU`) based computers, have accelerated computing capability significantly.
    Leveraging fast-computing hardware in conjunction with enormous amounts of training
    data, machine learning algorithms developed during the recent years have become
    capable of identifying objects in the images and videos without any human supervision.
    On the other side, a new class of algorithms, generative adversarial network (`GAN`)
    have been able to generate human faces, which are nearly impossible to distinguish
    from the real human pictures. Interestingly, `GANs` are also effectively used
    in seismic image reconstruction [[11](#480430_1_En_1_Chapter.xhtml#Par140)].


    The milestones review of the two industries shows significant progress both industries
    have made collectively in data acquisition, digitalization, and capability of
    learning from the vast amounts of data. In the following part of this chapter,
    we are going to briefly review the use of machine learning in different parts
    of the upstream industry. First, we provide a brief overview of different types
    of data available in a specific upstream industry section, and then we discuss
    cases where this data is used with machine learning algorithms to solve upstream
    industry problems. For those of you without a background in machine learning,
    it is important to get a gentle introduction of these algorithms, before learning
    their applications in the oil and gas industry. Therefore, in the coming chapters
    of this book, we first go over the details of these machine learning algorithms.
    Then we show examples of how these algorithms are used for solving industry-specific
    problems. In this chapter, it is sufficient for you to understand that there are
    different kinds of machine learning algorithms, which have been applied to solve
    various types of industry-related problems.


    ## Geosciences


    Geosciences can be understood as a discipline comprising of fields of geology,
    geophysics, and petrophysics. In the following sections, we discuss a few problems
    related to geosciences, which have been solved by the application of machine learning
    algorithms.


    ### Geophysical Modeling


    Geophysicists work with the seismic data. Seismic data may be 2D, 3D, or 4D (depicting
    temporal evolution). Due to sheer volume, seismic datasets are the most suitable
    for advanced machine learning algorithms, such as `CNN`, which require a lot of
    data to train adequately. Some of the problems in geophysics that can be solved
    by the application of machine learning are discussed here.


    #### Automated Fault Interpretation


    Fault interpretation is an essential step in seismic interpretation. Faults are
    formed by different mechanisms of subsurface movements, which result in a structural
    discontinuity. Certain operational decisions need to be taken after considering
    the presence of faults in the region of interest. In conventional workflows, fault
    interpretation is a time-intensive process. Convolutional Neural Networks may
    be instrumental in formulating and solving fault interpretation as a computer
    vision problem. However, it may not always be possible to generate large amounts
    of labeled data representing seismic images, and corresponding fault locations
    to train the `CNN` models. However, recent research has established methodologies
    for training advanced `CNN` variants with minimal training datasets, while providing
    highly accurate pixel-by-pixel prediction of the fault locations in the provided
    seismic images [[12](#480430_1_En_1_Chapter.xhtml#Par141)] [[13](#480430_1_En_1_Chapter.xhtml#Par142)].


    #### Automated Salt Identification


    Another crucial task in seismic interpretation is to identify the salt bodies
    in the subsurface environment. In the conventional workflows, visual picking of
    the salt/sediment boundaries is the standard way of performing salt identification.
    This is a time-consuming manual process, which may be affected by individual bias.
    Advanced `CNN`-based classification, along with the residual learning, has demonstrated
    high precision in delineating salt bodies. The results from these `CNN`-based
    algorithms show good agreement with manually interpreted salt bodies. Such results
    indicate the potential of applying `CNN` for automated salt identification [[14](#480430_1_En_1_Chapter.xhtml#Par143)].


    #### Seismic Interpolation


    Acquisition of high resolution, regularly sampled seismic data is often hindered
    due to physical or financial constraints. This leads to undersampled seismic data
    sets. Also, the presence of data quality issues, such as bad or dead traces, introduces
    additional challenges in the exploration and production activities that depend
    on high resolution and high-quality seismic images. Addressing these challenges
    can enable geoscientists, reservoir engineers, and other industry professionals
    to improve the predictive capability of their models.


    In recent years, generative adversarial networks have been employed for the interpolation
    of seismic images. Seismic interpolation helps in reconstructing the bad, and
    dead traces. It may also be used as a resolution enhancement tool for seismic
    data. The results of seismic interpolation using a generative adversarial network
    make it an interesting alternative to classical methods [[11](#480430_1_En_1_Chapter.xhtml#Par140)].


    #### Seismic Inversion


    The process of seismic inversion transforms seismic data into quantitative rock
    property estimates describing the reservoir. In recent research, `GAN` has been
    combined as an *a priori* model for creating subsurface geological structures,
    and their petrophysical properties. The generated structural and properties information
    was used for assisted seismic inversion [[15](#480430_1_En_1_Chapter.xhtml#Par144)].
    This is another interesting application of `GANs` in the field of seismic processing.


    ### Geological Modeling


    Geological modeling is the process of generating detailed 2D or 3D models of physical
    properties in the region of interest, at and below the surface of the earth. The
    modeling process uses geological observations at the earth’s surface, data available
    from different types of well logs from the wells drilled in the region, and seismic
    data. Some machine learning applications in geological modeling are being discussed
    here.


    #### Petrophysical Modeling


    Petrophysical modeling is critical for gaining understanding about the structure
    and properties of zones of oil and gas deposits in a reservoir. Neural networks
    have been successfully applied to create a detailed representation of petrophysical
    property distributions in the oil and gas reservoirs, which is sometimes called
    a *neural kriging* [[16](#480430_1_En_1_Chapter.xhtml#Par145)] [[17](#480430_1_En_1_Chapter.xhtml#Par146)].
    During recent years, deep neural networks have been applied for generating detailed
    2D and 3D models or reservoirs [[18](#480430_1_En_1_Chapter.xhtml#Par147)] [[19](#480430_1_En_1_Chapter.xhtml#Par148)].
    These studies demonstrate the effectiveness of machine learning methodologies
    in constructing detailed models of petrophysical properties.'
