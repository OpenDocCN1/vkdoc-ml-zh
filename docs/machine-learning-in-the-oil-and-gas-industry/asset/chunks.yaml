    ```


    #### 线性判别分析


    线性判别分析（LDA）同样基于输入特征服从高斯分布的假设。此外，该算法假设每个特征具有相同的方差。在该算法中，输入特征被转换，使得两个不同类别的输入特征值之间的重叠最小化。这是通过执行转换来实现的，该转换最大化样本中任意两个不同类别的特征统计均值之间的距离。该算法提供了样本点属于特定类别的概率。


    LDA 是一种简单的算法，对于小型数据集可以表现合理。然而，如果训练数据包含统计均值重叠的输入特征，则该算法无法区分属于不同类别的样本。以下代码片段和结果展示了
    LDA 在多类分类问题上相比其他基础算法（即高斯朴素贝叶斯和多项逻辑分类器）具有更好的性能。


    ```

    from sklearn.discriminant_analysis import LinearDiscriminantAnalysis

    clf_lda = LinearDiscriminantAnalysis()

    clf_lda.fit(X_train, y_train)

    # 对测试数据进行预测

    y_pred_lda = clf_lda.predict(X_test)

    # 准确率指标

    clf_metrics(y_test, y_pred_lda)

    ```


    **结果**


