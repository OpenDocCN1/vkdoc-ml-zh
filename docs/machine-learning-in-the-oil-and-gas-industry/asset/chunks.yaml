    ![../images/480430_1_En_6_Chapter/480430_1_En_6_Fig6_HTML.jpg](images/480430_1_En_6_Chapter/480430_1_En_6_Fig6_HTML.jpg)


    Figure 6-6


    Forecasted results using Arps decline curve model


    ### Validation


    A test dataset which includes production from 2019 onwards is used to validate
    the performance of forecasts from the decline curve model. This data has not been
    used to train the empirical models and serves the purpose of validating the performance
    of the model. Figure [6-7](#480430_1_En_6_Chapter.xhtml#Fig7) includes the comparison
    of hyperbolic curve performance with the actual data.


    A common accuracy metric—root-mean-squared error (RMSE)—is determined in this
    example to quantify the accuracy of predictions from the hyperbolic model.


    ```

    RMSE - Hyperbolic Model: 81.419 bbl/d

    ```


    ![../images/480430_1_En_6_Chapter/480430_1_En_6_Fig7_HTML.jpg](images/480430_1_En_6_Chapter/480430_1_En_6_Fig7_HTML.jpg)


    Figure 6-7


    Comparison between actual data and hyperbolic forecast which includes the test
    data (i.e., production from 2019 onward)


    ## Time Series–Based Forecasting Using the ARIMA Model


    Another method for understanding the trend of the time series data and forecasting
    includes analyzing statistical trends from historical data. A common model, ARIMA
    (*autoregressive integrated moving average* ), is used in this chapter. In this
    particular analysis, the date column needs to be converted to datetime datatype
    for easier manipulation of time data.'
