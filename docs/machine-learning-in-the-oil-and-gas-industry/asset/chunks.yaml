  trans: '

    #### 勘探与评价


    在地表下精确找到油气藏的位置，是一项如同大海捞针般充满挑战的活动。过去一个世纪以来，人类对地球地下结构的科学认识已显著提升。地质调查提供了地表下结构的地质图或模型。结合地球物理勘探，这些模型有助于形成对地下结构的详细理解。


    地球物理勘探有多种类型，具体取决于所使用的技术，例如磁法、电磁法、重力法和地震勘探等。近年来，地震勘探已被证明是定位潜在油气藏最可靠的方法。地震勘探可以在陆上或海上进行。


    地震成像的基本原理与人体超声波成像相似。进行地震勘探的过程需要一个声能源。在陆地上，这些声源可以是大型振动卡车；在海上地震勘探中，则是气枪。从不同地下结构反射回来的声波由地表或水面附近的检波器或水听器（非常灵敏的麦克风）接收。3D
    和 4D 地震勘探是石油和天然气行业中数据量最大的数据集之一，有时其规模可达拍字节级别。这些地震勘探提供的信息有助于识别地下构造特征以及潜在的油气藏。


    地质学家对地球的沉积环境有详细的理解，这有助于他们了解不同岩层在地下的排列方式。地质学家利用他们在盆地和层序地层学方面的深厚知识，并结合地震数据解释所获得的信息，来精确定位可能发现石油的位置。


    一旦以一定的置信度确定了油气藏的潜在位置，运营的石油和天然气公司就会获得该油气区块的租赁权。基于地球物理和地质认识的结合，会钻探探井（也称为*野猫井*）来验证潜在的油气藏位置。如果在第一口野猫井中发现了石油，油藏工程师便会参与到油田评价过程中。


    在此过程中，会在原始野猫井周围钻探更多的评价井。从探井中收集不同的测井记录和岩心记录，这些记录将进一步用于更详细地了解已发现的油气藏。


    地质学家和岩石物理学家利用地质模型以及测井数据，在目标区域建立详细的物理属性三维油藏模型，这一过程被称为*岩石物理建模*。在目标区域计算岩石物理属性，例如孔隙度（岩石中可储存或输送油气的空隙比例）以及油、水饱和度。这些详细的岩石物理模型有助于计算已发现油气藏中总可采和可恢复油气量的概率估算值。


    #### 油田开发规划


    一旦勘探和评价活动结束，油藏工程师和地球科学家（地质学家和地球物理学家）会共同制定一份详细的计划，以进一步开发油气生产田。勘探和评价阶段获得的所有信息和见解——包括详细的油藏模型——都会被考虑在内。此阶段做出的决策包括：确定钻井的精确位置、优化井位布局的详细设计、完井设计（包括所需的射孔和增产措施）。


    设施工程师、油藏工程师和生产工程师还会制定处理油气所需的详细设施设计（例如，用于分离油、水和气的分离器）。油田开发计划还包括将生产的油气运输到储存或处理设施的策略。一旦油田开发计划获得批准，就开始按照计划中规定的规格建造设施、钻探油井并完成完井。


    #### 钻井与完井


    钻井过程的核心是创建油气从油气藏流向地表的通道。钻井是一项高风险、高资本支出的作业。深水海上钻井平台的日租金及相关费用可能接近每天 100 万美元。粗略估算，一口海上油井的成本可能在
    1 亿至 2 亿美元之间——在深水区域甚至更高。一口陆上油井的钻井成本可能在 500 万至 800 万美元之间[4]。


    在钻井作业中，钻头连接在钻柱的最下端，钻柱是由钢或铝合金制成的钻杆依次连接而成的长柱。钻柱的顶端连接着一个驱动装置（一种机械设备），为钻柱提供扭矩。


    由于这个扭矩，连接在钻柱底部的钻头旋转并切削岩石，从而形成井眼。在钻井作业期间，钻井泥浆会流经钻杆以冷却钻头。钻井泥浆还有助于清除钻井过程中产生的岩屑。


    在钻井过程中，钻柱会定期收回，并通过固井和下套管来稳定井眼。套管是高强度的中空钢管，它与固井作业相结合，可以加固井眼，防止井眼坍塌。除了提供结构强度外，套管还能确保钻井过程中使用的化学流体不会污染附近的含水层和地下水源。


    在固井并将套管下入井眼后，生产油管会被下入井眼。油管是耐腐蚀的中空不锈钢管，其直径始终小于套管，通过封隔装置固定在套管内。油管为油气从井底到地表提供通道，并保护套管免受腐蚀和其他可能的磨损。


    一旦套管和油管就位，就会在套管或套管与油管上制造射孔，以促进油气从储层岩石流入井眼。除了射孔，完井活动还可能包括水力压裂和其他增产措施。


    在水力压裂过程中，水以极高的压力注入井眼。高压会在岩石中产生裂缝，为油气从储层流向井眼创造额外的通道。支撑剂是直径很小的砂粒，在压裂过程中用于确保裂缝保持张开状态。支撑剂的运移由转向剂辅助，转向剂是一种化学化合物，用于促进支撑剂颗粒从井眼流向裂缝内部。


    一旦油田开发计划中规定的所有完井活动完成，油井便开始生产油气。需要注意的是，上述几页中提到的活动，从开始到油井产出第一滴油，有时可能需要五到十年的时间。

    '
- fmt: '### Production Operations


    Once the well starts producing oil and gas, production engineers and reservoir
    engineers continue to monitor the production trends for the well. Throughout the
    well’s life span, the production of oil and gas from the well declines over time.
    Production engineers develop plans for maintaining oil flow from the well by using
    techniques, such as artificial lift. An artificial lift may utilize pumps (electrical
    submersible pumps, sucker rod pumps, etc.), or gas lift by injecting gas into
    the bottomhole to increase or maintain the flow of oil and gas from the well.
    During the production operations, other well intervention and workover activities,
    such as replacing a completion to maintain the flow from the well, can also be
    performed.


    ### Abandonment


    Through several years of continuous production, oil and gas production rates from
    the well keep declining. As mentioned earlier, engineers attempt to revive a well
    by well intervention and workover activities. However, after a certain point of
    time, it may be deemed uneconomical to revive a well given extremely poor production
    potential of the well. In such a scenario, the well is plugged with cement and
    abandoned. This is the last stage in the life cycle of an oil and gas well. During
    the plugging and abandonment process, requirements set forth by different regulatory
    bodies for plugging the well are strictly followed to ensure compliance.


    ### The Midstream Industry


    The midstream industry is responsible for transporting crude oil produced from
    the oil wells to the downstream processing facilities. Transportation may take
    place via pipelines, oil vessels, trucks, or rails. In addition, the midstream
    industry is also responsible for the storage and marketing of petroleum commodities
    including crude oil and natural gas. In this way, the midstream industry acts
    as a connecting link between the oil and gas production facilities in the remote
    areas, and the downstream processing facilities, which are often established close
    to populated areas.


    ### The Downstream Industry


    The primary functions of the downstream industry include fractionation or cracking
    of crude oil (a process of converting thick, high molecular weight crude oil to
    transparent looking, low molecular weight petroleum fuels) and related chemical
    treatments. This is followed by blending operations, which result in finished
    petroleum products for mass consumption as fuel. Besides, downstream refineries
    are also responsible for the purification of natural gas. The complete spectrum
    of the downstream industry includes oil refineries, petrochemical plants, distribution
    operations, retail centers, and other related facilities. Among the three sectors
    of the oil and gas industry, the downstream industry has the most visibility to
    the general population, as almost all of us use gasoline or diesel in our vehicles
    for our day to day commute. Jet fuel, asphalt, lubricants, plastics, and natural
    gas are among the other various petroleum products produced by the downstream
    industry.


    So far, we have discussed the three sectors of the oil and gas industry. We deliberately
    kept the description of midstream and downstream industries short. In the next
    sections, we focus our discussion on digitalization of the upstream oil and gas
    industry and its connection with machine learning.


    ## Digital Oilfields


    The global oil and gas industry has an impressive economic footprint. Based on
    the data available in the public domain, worldwide revenue of the oil and gas
    companies was approximately US $5.5 trillion in 2017 [[5](#480430_1_En_1_Chapter.xhtml#Par134)].
    Out of this, the top 10 companies shared almost half of this revenue (see Figure
    [1-3](#480430_1_En_1_Chapter.xhtml#Fig3)). In recent years, almost all these companies
    have started investing in digital transformation efforts. According to a report
    published by the World Economic Forum, digital transformation for the oil and
    gas industry may be worth from US $1.6 trillion to $2.5 trillion, between 2016
    and 2025 [[6](#480430_1_En_1_Chapter.xhtml#Par135)]. These numbers give a glimpse
    of the sheer magnitude of oil and gas industry digitalization efforts.


    ![../images/480430_1_En_1_Chapter/480430_1_En_1_Fig3_HTML.jpg](images/480430_1_En_1_Chapter/480430_1_En_1_Fig3_HTML.jpg)


    Figure 1-3 World-leading oil and gas companies, and their share in the global
    revenue based on data for 2017 [5]


    Digitalization is not new to the oil and gas industry. Computer-assisted connected
    oil fields date to the late 1970s [[7](#480430_1_En_1_Chapter.xhtml#Par136)].
    In the last two decades, the upstream oil and gas industry has faced an exponential
    increase in the use of real-time data, and field actuating devices, which have
    led to numerous digital oilfield implementations. These have demonstrated value
    to drive operational efficiency, optimize production, and maximize hydrocarbon
    recovery factors. At the same time, digital oilfield implementations have facilitated
    better and faster decisions while reducing health, environmental, and safety risks.
    Formally, digital oilfield is a process of a measure-calculate-control cycle at
    a frequency which maintains the system’s optimal operating conditions at all times
    within the time constant constraints of the system, while sustainably:


    *   Maximizing production

    *   Minimizing capital expenditure (CAPEX) / operational expenditure (OPEX)

    *   Minimizing environmental impact

    *   Safeguarding the safety of the people involved and the integrity of the associated
    equipment [[8](#480430_1_En_1_Chapter.xhtml#Par137)] [[9](#480430_1_En_1_Chapter.xhtml#Par138)]


    These objectives can be achieved by synchronizing four interrelated areas: people,
    automated workflows, processes, and technologies. It should be noted that significant
    efforts are required to properly describe a work process that supports digital
    oilfield implementation. In a simplified way, digital oilfields are a collection
    of automation and information technologies that transform the philosophy of the
    way petroleum assets are managed and drive more efficient operating work processes.
    It involves orchestration of disciplines, data, applications, and workflow integration
    tools supported by digital automation (see Figure [1-4](#480430_1_En_1_Chapter.xhtml#Fig4)),
    which involves the following:


    ![../images/480430_1_En_1_Chapter/480430_1_En_1_Fig4_HTML.jpg](images/480430_1_En_1_Chapter/480430_1_En_1_Fig4_HTML.jpg)


    Figure 1-4 Different components of a Digital Oilfield (DOF)


    *   Field instrumentation

    *   Telemetry

    *   Automation

    *   Data management

    *   Integrated production models

    *   Workflow automation

    *   Visualization

    *   Collaboration environments

    *   Predictive analytics


    A successful digital oilfield implementation requires synchronization among all
    of these components. The predictive analytics component of a digital oilfield
    is responsible for generating data-driven insight for the present and future prospects
    of the oilfields. This component often hosts machine learning algorithms and is
    a key to successful digital oilfield implementation. In the next section, we discuss
    how machine learning is providing predictive analytics capability to the digital
    oilfield implementations, and the oil and gas industry at large.'
