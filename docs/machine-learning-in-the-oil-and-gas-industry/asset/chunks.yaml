  trans: '

    ## 机器学习在油藏工程中的作用


    机器学习解决方案可直接应用的油藏工程领域包括优化油藏管理 [18]，其中新井的识别与规划始终是一大挑战。通过机器学习，还可以实现储层属性的地下表征，以制定高效的油田开发方案
    [5]。机器学习的另一个应用领域包括利用类比井数据生成伪测井曲线或预测 PVT 属性 [19][20]。其他示例还包括地质解释 [21]、地球物理解释 [22]，以及构建能够提供更深入见解的知识图谱。


    文献表明，与 Arps、Duong 和*拉伸指数产量递减*（SEPD）模型 [13] [23] [24] 相比，某些基于机器学习的方法（如神经网络和深度学习）已改进了预测效果。通过使用机器学习算法，传统的利用标准井进行产量预测
    [25] 的方法已得到改进。随机森林、支持向量机和多元自适应回归样条等算法也提高了预测精度 [26]。其他研究表明，使用神经网络预测巴肯页岩油井的产油率取得了更好的结果
    [27]。图 6-1 展示了一条典型的随时间变化的递减曲线。


    ![../images/480430_1_En_6_Chapter/480430_1_En_6_Fig1_HTML.jpg](img/480430_1_En_6_Fig1_HTML.jpg)


    **图 6-1**


    典型递减曲线示例，x 轴为时间，y 轴为运行气量 [28]


    ## 数据集描述


    分析中使用了来自北达科他州工业委员会（NDIC）油气部门 [29] 的公开生产数据。通过一个 Python 脚本从网站抓取数据。网站上提供了 2015 年中期至今的
    Excel（.csv）文件，本章即使用这些文件。NDIC 网站的截图如图 6-2 所示。


    ![../images/480430_1_En_6_Chapter/480430_1_En_6_Fig2_HTML.jpg](img/480430_1_En_6_Fig2_HTML.jpg)


    **图 6-2**


    用于抓取生产数据的北达科他州工业委员会网站截图 [29]


    数据抓取完成后，从不同的 API 编号可以看出，分析中包含了 17,756 口井。并非所有井的油气产量都准确上报，因此面临的挑战是尽可能清理数据。通过一些基础的数据可视化，我们可以了解当前正在处理的数据集。


    分析重点放在石油产量上，因为它是北达科他州油井的主要产出物。在本研究中，我们使用 2015 年中期至 2018 年的数据进行历史拟合，并对 2019 年的数据进行预测。数据以时间序列的形式呈现，分析中使用了月度产量数据。除了用于递减曲线分析的传统
    Arps 方程外，本章还进行了基于时间序列的预测。


    基于这两种方法，我们可以使用均方根误差（RMSE）作为指标来确定更准确的方法，因为这是一个回归问题。需要注意的是，分析仅针对少数几口井展示，但代码仓库包含了从网站检索到的全部井集。图
    6-3 展示了电子表格中生产数据的截图，其中包含 21 列。


    ![../images/480430_1_En_6_Chapter/480430_1_En_6_Fig3_HTML.jpg](img/480430_1_En_6_Fig3_HTML.jpg)


    **图 6-3**


    显示生产数据的电子表格截图


    数据集中包含以下列，其中包括一些静态信息以及按月报告的石油、天然气和水的产量。数据库中还提供了以经纬度形式表示的井位坐标。关于生产天数的信息用于确定产油率。


    以下是 21 个数据列。


    ```

    Index([''ReportDate'', ''API_WELLNO'', ''FileNo'', ''Company'', ''WellName'',
    ''Quarter'', ''Section'', ''Township'', ''Range'', ''County'', ''FieldName'',
    ''Pool'', ''Oil'', ''Wtr'', ''Days'', ''Runs'', ''Gas'', ''GasSold'', ''Flared'',
    ''Lat'', ''Long''], dtype="object")

    ```


    添加到现有数据框中的一些额外特征包括油井投产日期，以及计算特定油井的在线天数。以下代码片段用于查找数据库中产油量最高的前十口井。


    ```

    # 查找产量（总和）最高的前 10 口井

    grouped_data = train_prod.groupby([''API_WELLNO'']).sum()

    grouped_data = grouped_data.sort_values(by=[''Oil''])

    grouped_data = grouped_data.nlargest(10, ''Oil'').reset_index()

    ```


    两口示例井的递减趋势如图 6-4 所示，其中*y*轴为产油率，*x*轴为时间。


    ![../images/480430_1_En_6_Chapter/480430_1_En_6_Fig4_HTML.jpg](img/480430_1_En_6_Fig4_HTML.jpg)


    **图 6-4**


    两口示例井的递减曲线（产油率相对于时间尺度绘制）

