- fmt: '### Formulation


    高斯过程（GP）是一个随机变量的集合，其中任意有限个变量都服从多元正态分布。如果我们有一个服从高斯（即正态）分布的单一随机变量，将其绘制出来会得到一条钟形曲线。如果我们有两个服从类似分布的随机变量，将它们分别绘制在`x`轴和`y`轴上，会得到一个钟形曲面。这就是包含两个随机变量的多元正态分布。我们可以想象三个满足条件的随机变量，以此类推。


    现在，假设存在一些点`X`，其观测属性值由`f(X)`或简写为`f`给出。此外，基于这些信息，对于一组点`X*`，我们试图估计`f(X*)`或`f*`。这意味着我们试图计算概率分布`p(f*
    | f)`。在零均值的假设下，我们可以将`f(X)`近似为如下形式[[4](#480430_1_En_5_Chapter.xhtml#Par49)]。


    ![$$ f(X)\sim N\left(0,K\left(\theta, X,{X}^{\prime}\right)\right), $$](images/480430_1_En_5_Chapter/480430_1_En_5_Chapter_TeX_Equ2.png)


    (5.2)


    其中`N`表示均值为零的正态分布，`K(θ, X, X'')`表示所有观测数据点对`(X, X'')`之间的协方差矩阵。该协方差矩阵确保输入空间中距离相近的点，其输出值也彼此接近。在点`X*`处的估计均值由下式给出：


    ![$$ y=K\left(\theta, {X}^{\ast },X\right)K{\left(\theta, X,{X}^{\prime}\right)}^{-1}f(X).
    $$](images/480430_1_En_5_Chapter/480430_1_En_5_Chapter_TeX_Equ3.png)


    (5.3)


    在公式[5.3](#480430_1_En_5_Chapter.xhtml#Equ3)中，出现了一个新项`K(θ, X*, X)`。该项表示观测数据点（本例中为导出的测井曲线）与我们要进行属性估计的点之间的协方差。如果我们将克里金法与高斯过程回归进行类比，协方差矩阵类似于图[5-1](#480430_1_En_5_Chapter.xhtml#Fig1)中所示的解析变差函数。在高斯过程回归中，协方差函数通过前面讨论的*核技巧*来实现。最常用的核是径向基函数（RBF）核。


    ### 径向基函数（RBF）核


    RBF核也称为*平方指数*核。该核由长度尺度参数进行参数化，这些参数类似于图[5-1](#480430_1_En_5_Chapter.xhtml#Fig1)中所示的变差函数变程。RBF核可以具有单一长度尺度，从而等效于全方向（各向同性）变差函数；或者它可以具有与输入相同数量的维度，从而等效于各向异性变差函数。RBF核的函数形式如下：


    ![$$ k\left(x,y,z\right)=\exp \left(-\frac{1}{2}d{\left(\frac{x}{l_x},\frac{y}{l_y},\frac{z}{l_z}\right)}^2\right).
    $$](images/480430_1_En_5_Chapter/480430_1_En_5_Chapter_TeX_Equ4.png)


    (5.4)


    在公式[5.4](#480430_1_En_5_Chapter.xhtml#Equ4)中，`l[x]`、`l[y]`和`l[z]`分别表示`x`、`y`和`z`方向上的长度尺度或变差函数变程。此外，`GaussianProcessRegressor`的`scikit-learn`实现提供了一个超参数`alpha`，它代表图[5-1](#480430_1_En_5_Chapter.xhtml#Fig1)中变差函数模型的块金方差（`n`）。需要注意的是，这里讨论的方法假设样本均值为零。这可以通过使用`scikit-learn`中的`StandardScaler`来实现。清单[5-2](#480430_1_En_5_Chapter.xhtml#PC2)展示了使用`GaussianProcessRegressor`对`permx`进行插值的实现。


    ```

    from sklearn.preprocessing import StandardScaler

    from sklearn.gaussian_process import GaussianProcessRegressor

    from sklearn.gaussian_process.kernels import RBF

    x_scaler = StandardScaler()

    X_scaled = x_scaler.fit_transform(X)

    y_scaler = StandardScaler()

    y_scaled = y_scaler.fit_transform(np.array(y).reshape(-1, 1))

    kernel = RBF([5.e-1, 5.e-3, 5.e-3], (1.e-3, 1.e0))

    gpr = GaussianProcessRegressor(kernel=kernel,

    alpha=0.75,

    n_restarts_optimizer=10,

    normalize_y=False,

    random_state=12345)

    y_scaled = y_scaled.flatten()

    gpr.fit(X_scaled, y_scaled)

    pred, sigma = gpr.predict(X_scaled, return_std=True)

    pred = y_scaler.inverse_transform(pred.reshape(1, -1))

    print(''GPR Fit Score: %f'' % gpr.score(X_scaled, y_scaled))

    GPR Fit Score: 0.708586653049732

    Listing 5-2

    Code Snippet for Gaussian Process Regression for Property Value Estimation Away
    from Wells

    ```


    在代码示例中，我们将数据转换为具有零均值和单位方差。具有单位方差也有助于我们选择`alpha`参数作为样本方差的一个分数。较小的`alpha`值会使数据在井位处拟合得非常好，从而获得更高的拟合分数。您可以尝试使用不同的`alpha`值，观察拟合分数和整体预测结果如何变化。


    代码中的RBF核具有三个长度尺度，这表明使用的是各向异性核（变差函数）。在长度尺度列表之后，RBF核中的参数是一个元组，定义了长度尺度的上下界。在训练过程中，优化算法会在定义的上下界内选择最佳拟合的长度尺度。使用清单[5-2](#480430_1_En_5_Chapter.xhtml#PC2)中生成的模型，可以预测井位处的`permx`值。如图[5-5](#480430_1_En_5_Chapter.xhtml#Fig5)所示，这些估计值具有较低的方差。


    此外，还使用训练好的模型预测了SPE 5模型所有网格单元中的`permx`值。图[5-6](#480430_1_En_5_Chapter.xhtml#Fig6)显示了估计的均值预测和相应的方差。可以观察到，井位附近的估计值方差较低。随着我们远离井位，得到的预测值和方差等于根据导出的测井曲线数据计算出的均值和方差值，如表[5-2](#480430_1_En_5_Chapter.xhtml#Tab2)所示。根据图[5-4](#480430_1_En_5_Chapter.xhtml#Fig4)中观察到的变差函数模型，我们预期会出现这种情况，因为与基台值相比，块金方差显著，表明导出的测井曲线数据相关性较低。


    ![../images/480430_1_En_5_Chapter/480430_1_En_5_Fig6_HTML.jpg](images/480430_1_En_5_Chapter/480430_1_En_5_Fig6_HTML.jpg)


    Figure 5-6


    Using trained Gaussian process regression model (a) predicted permx values at
    all SPE 9 grid cells and (b) corresponding estimation variance


    ![../images/480430_1_En_5_Chapter/480430_1_En_5_Fig5_HTML.jpg](images/480430_1_En_5_Chapter/480430_1_En_5_Fig5_HTML.jpg)


    Figure 5-5


    Using Gaussian process regression (a) predicted permx values at the SPE 9 well
