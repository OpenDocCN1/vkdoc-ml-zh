- fmt: '### Predicting Threshold Reservoir Radius


    Threshold radius can be determined statistically using a large number of simulated
    experiments for a variety of well/reservoir systems, by varying the properties
    including horizontal permeability (`k[h]`), anisotropy ratio (`kv/kh`) and penetration
    ratio (`hop/ho`), oil-pay thickness (`h[o]`), mobility (`M`) ratio and aquifer
    thickness (`h[w]`). The Box and Behnken method can design a matrix of simulated
    experiments [18]. The design stipulates a total of 54 different simulation runs
    (reservoir/aquifer systems) to determine the threshold radius by systematically
    increasing the size of the drainage area until it becomes equal to the lateral
    length of maximum water cone. The results are then used to develop an empirical
    formula for threshold drainage radius, `r[eTh]` using the multiple second-order
    polynomial regression.


    The resulting formula for predicting threshold reservoir radius is


    ```

    r[eTh] = 14920.6 - 3563.7M - 68.5h[w] - 34586(kv/kh) + 99.65h[o] + 288M^2 + 0.107h[w]^2
    + 31290(kv/kh)^2 + 1.5M*h[w] - 0.55M*k[h] - 10.13M*h[o] - 0.087h[w]*h[o] + 0.1k[h]*h[o]

    ```


    (7.5)


    The following is the implementation of the threshold reservoir radius predictor
    as a function of the input parameters.


    - Input data: `Threshold_reservoir_radius.csv`

    - Output: "Threshold Radius values"

    - Python code: `Chapter07_Threshold_Radius_Predictor_using_OLS.ipynb`

    - Method: Multivariable linear regression methods


