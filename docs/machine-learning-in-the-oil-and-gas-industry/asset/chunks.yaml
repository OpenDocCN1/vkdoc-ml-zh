  trans: '

    ##### 早期井涌检测


    *井涌*是指气体突然从地层渗入井筒的事件。当气体进入井筒后，便开始向地表上升。气体的向上运动表现为地表泥浆体积增加，同时伴随泥浆流出井口的流速增大。


    井涌是一种危险事件，对其后果进行补救的成本往往十分高昂。越早检测到井涌，钻井平台上的工作人员就能越早采取必要的纠正措施。然而，传统的报警系统要么存在大量误报，要么无法准确识别井涌。机器学习算法的应用能够在钻井过程中提供泥浆体积和流速的精确估算，同时也显著降低了误报频率。这有助于钻井人员及时采取有效的纠正措施
    [32]。


    ##### 卡钻预测


    在钻井作业的某些情况下，钻杆可能会卡在井筒内。一旦钻杆被卡住，钻井作业就会暂停，直到采取补救措施。卡钻问题是导致钻井作业非生产时间的主要因素之一。为了预测卡钻事件相关的非线性行为，通过粒子群优化算法优化的人工神经网络在提前预测卡钻事件可能性方面表现出了高精度。从这种机器学习方法获得的预测，结合合理的工程判断，具有预防卡钻事件的潜力
    [33]。


    #### 自主钻井平台


    大型海上钻井平台通常位于偏远地区，每天可产生高达 1 到 2 太字节的数据。使用 2 Mbps 的卫星链路传输海上平台一天产生的如此大量的数据需要 12 天或更长时间
    [34]。因此，任何关键的数据驱动决策都必须在海上钻井平台本身上进行。自主钻井平台结合了机器学习、工业物联网和机器人技术。此外，平台上的决策需要安装在平台上的边缘计算设备（嵌入了机器学习和其他算法的电子电路设备）。钻井平台上精密的机械和大量的传感器提供了决策所需的所有相关信息。工业物联网设备获取的数据可以由运行在边缘计算设备上的机器学习算法处理。最后，算法给出的建议被传回给钻井操作员或机器人，从而执行最终行动。自主钻井平台的目标包括以下内容。


    *   以最优速率钻井（机械钻速优化）[35]。


    *   最小化非生产时间，例如，提前预测卡钻的可能性，并提高不同补救措施的成功概率（钻井作业中总非生产时间的 25%归因于卡钻）[33]。


    *   操作安全，例如，早期井涌检测以确保人员安全并保护生态系统 [32]。


    ### 采油工程


    随着油气田的成熟，油藏和井况会持续变化，并且很可能是朝着恶化的方向发展。结果，由于含水率（石油中水的比例或百分比）上升、举升设备效率低下、缺乏足够的油藏压力支持或地面回压瓶颈等诸多原因，产量会迅速下降。油藏和油田的衰退可能是单井产量下降以及非生产井（停产井）数量快速增加的结果。


    为了管理产量下降，需要钻新井或对现有井进行干预。为了通过现有井提高产量，油藏和采油工程师会规划并执行修井作业，包括挤水泥、井完整性、打捞作业和层位封隔，以优化和维持石油生产。


    采油工程的作用是确保油藏生产在已批准的油田开发方案的现有边界内进行，包括井数、设施能力和有限的支出。采油工程师的职责可能包括以下内容。


    *   规划、收集和解释生产监测数据。


    *   建立、维护和利用模型进行井性能管理。


    *   确定井的操作包络线和设定点。


    *   识别、排序、实施和评估增产机会，包括修井作业。


    #### 修井机会候选井识别


    在其生命周期内的某些情况下，一口井可能无法令人满意地运行和生产。识别此类井，并执行干预和补救活动（也称为*修井*）以使井的性能达到令人满意的水平，已显示出显著的经济效益。专家系统在石油和天然气行业已使用数十年，其流程涵盖从数据集成和清洗、问题检测，到根据产量增益、成本、风险和净现值对候选井进行排序。利用数据分析、机器学习和推理工具（如贝叶斯信念网络
    [36] [37]）的新型系统已被提出并用于检测生产问题，并给出井、油藏或设施中各种问题发生的可能性。这些系统有助于区分根本原因，并对现有的不同应对措施进行优先级排序。这些筛选逻辑作为一个可重复的自动化过程运行，可以按计划执行或按需执行。


    ##### 生产优化


    生产优化的目标是利用到该时间点为止所有可用信息来管理并确保盈利地实现资产目标，自信地预测结果，做出能产生最优结果的决策，并在下一个决策时间点之前实施这些决策。油田中实时井下测量和远程驱动阀门的日益普及，使得实时进行全油田范围的操作优化成为可能
    [38]。有了更多的实时数据和测量值，就有可能构建机器学习模型，这些模型可以在获得新数据时进行更新。虽然实时优化这个术语当然并不新鲜，并且实时优化已在生产操作的某些环节中得到实践，但如今在日常生产操作中实现实时优化的可行性已大大提高。


    ##### 加密钻井


    加密钻井是指在油田开发周期的后期阶段，为了增加井-油藏接触面积而选择的额外泄油位置。加密钻井的目的是提高或改善井的采收率，这些井的泄油区域内可能存在未被开采的油气藏。选择加密井候选井需要仔细分析，以验证、量化并定位这些未被开采的油藏位置。已经开发出多种数据驱动的方法来预测潜在侧钻井的产量，提供一套标准来选择最适合侧钻的井，同时利用所有相关的不确定性，并与随机经济分析相关联
    [39]。

    '
- fmt: "### Optimal Completion Strategy\n\n`Completion` is a term to indicate the\
    \ hardware deployed inside the wellbore to ensure production lifting from the\
    \ reservoir to the wellhead. Optimal completion strategy requires the proper understanding\
    \ of reservoir potential (i.e., multiphase fluids, solids, productivity, and pressure\
    \ regimes as a function of time) as well as the production requirements (i.e.,\
    \ rate targets and wellhead pressure).\n\nMany authors use multivariate analysis,\
    \ which includes multiple linear regression analysis and statistical models using\
    \ multidisciplinary data, such as petrophysical (e.g., thickness, permeability,\
    \ saturation), completion (e.g., tubing size, stimulation fluid, and fracture\
    \ intensity), and production (e.g., pressure and multiphase flow tests data).\
    \ Traditionally, production engineering models, such as nodal analysis well models\
    \ are good enough to provide accurate predictive performance relationships for\
    \ successful completions. In the cases of unknown well failure or uncertain reservoir\
    \ phenomena, data-driven models provide much better prediction than pure engineering\
    \ models.\n\nOver the last five years, there has been an explosion in the applications\
    \ of machine learning algorithms for predicting completion performance in unconventionals\
    \ [[40](#480430_1_En_1_Chapter.xhtml#Par169)] [[41](#480430_1_En_1_Chapter.xhtml#Par170)].\
    \ Data-driven methods assist operators in the selection of optimum completion\
    \ parameters, which have a positive effect on production and are advantageous\
    \ to lower unit costs, such as stage intensity, plug-and-perforate cemented-well\
    \ designs, injection rate, and proppant mass per lateral foot and fluid volume\
    \ per lateral foot [[42](#480430_1_En_1_Chapter.xhtml#Par171)].\n\n### Predictive\
    \ Maintenance\n\nThe upstream oil and gas industry employs a vast array of equipment.\
    \ All equipment have an operational lifetime, before the ultimate failure. More\
    \ than 90% of all producing oil wells need an artificial lift method to increase\
    \ oil production. The `electrical submersible pump` (ESP) is widely used for artificial\
    \ lift, making it a critical component in ensuring continued oil production from\
    \ the wells.\n\nDespite being among critical equipment in the upstream operations,\
    \ ESPs exhibit significantly high failure rates [[43](#480430_1_En_1_Chapter.xhtml#Par172)]\
    \ [[44](#480430_1_En_1_Chapter.xhtml#Par173)]. These failures are often random\
    \ and result in lost oil production from the wells. It is estimated that ESP failures\
    \ lead to hundreds of millions of barrels of lost or deferred oil production each\
    \ year. Previous studies have used a `principal component analysis` (PCA) approach\
    \ to detect ESP failures and predict the remaining useful life of the equipment\
    \ before failure by using complete historical data. An imminent failure often\
    \ shows up as PCA data scattered away from the origin. Combining these predictions\
    \ from the machine learning-based models with engineering principles to detect\
    \ problems with ESPs, long before they occur, and prescribing preventive actions\
    \ can have a significant economic impact [[45](#480430_1_En_1_Chapter.xhtml#Par174)]\
    \ [[46](#480430_1_En_1_Chapter.xhtml#Par175)].\n\n## Industry Trends\n\nSo far,\
    \ we have discussed several applications of machine learning in the upstream oil\
    \ and gas industry. Now we analyze some trends in the oil and gas industry and\
    \ machine learning industry at large by analyzing research publication trends\
    \ (see Figure [1-6](#480430_1_En_1_Chapter.xhtml#Fig6)).\n\nFor analyzing the\
    \ industry trends, we used different search queries on Google Scholar to understand\
    \ how publication trends in the machine learning community within the oil and\
    \ gas industry and the general machine learning community have been evolving.\
    \ The following interesting trends have emerged.\n\n*   There was a crossover\
    \ in the dominance of the term `artificial intelligence` over the term `machine\
    \ learning` in the general research community in 2008. A similar crossover was\
    \ observed in the oil and gas community in 2018. This indicates that the oil and\
    \ gas industry has adopted a machine learning lexicon with a delay of ten years.\n\
    \n    ![../images/480430_1_En_1_Chapter/480430_1_En_1_Fig6_HTML.jpg](images/480430_1_En_1_Chapter/480430_1_En_1_Fig6_HTML.jpg)\n\
    \n    Figure 1-6\n\n    Trends from 1991 to 2019, based on the number of Google\
    \ Scholar keyword search results for a) oil and gas industry, and b) all industries\
    \ related machine learning, deep learning, and artificial intelligence publications.\
    \ Citation count for 2019 is estimated based on data from March 2019\n\n*   After\
    \ 2012, there was a steep decline in the popularity of the term `artificial intelligence`\
    \ in the general research community. This decline fueled growth in the use of\
    \ the terms `machine learning` and `deep learning`. The year 2019 may have marked\
    \ the beginning of a similar trend for the oil and gas industry.\n\n*   The pattern\
    \ observed for the general research community in 2010 for `deep learning` began\
    \ to appear for the oil and gas industry around 2015, almost a five-year delay.\n\
    \n*   For the general research community, `machine learning` showed a steep decline\
    \ in 2017. Around the same time, the rise of `deep learning` continued.\n\nBased\
    \ on these observations, the following conclusions may be drawn.\n\n*   Adoption\
    \ of machine learning and deep learning in the oil and gas industry has lagged\
    \ by around five to ten years when compared with the general industry.\n\n*  \
    \ Currently, the adoption of machine learning and deep learning in the industry\
    \ is on the rise.\n\n*   In the near future, growth in machine learning and deep\
    \ learning should continue. At some point, deep learning will take over machine\
    \ learning in terms of popularity.\n\nIf you are wondering whether it is still\
    \ worth investing time to learn machine learning rather than deep learning, the\
    \ answer is yes. Deep learning is a subfield of machine learning. In Chapter [3](#480430_1_En_3_Chapter.xhtml),\
    \ we will discuss the fundamentals of both machine learning and deep learning.\
    \ There is a significant potential for growth in the adoption rates of these techniques\
    \ in the oil and gas industry.\n\n## Summary\n\nIn this chapter, we provided an\
    \ overview of the different segments of the oil and gas industry. We also compared\
    \ the timeline of data acquisition and integration technologies in the upstream\
    \ oil and gas industry, with the historical evolution of machine learning algorithms.\
    \ Further, we provided an overview of applications of machine learning to some\
    \ upstream industry problems. We hope that you now have a general understanding\
    \ of the upstream oil and gas industry, where machine learning can provide valuable\
    \ solutions. In the coming chapters, we will select some of these problems and\
    \ see how to build machine learning solutions to these problems using real data\
    \ sets. Before that, the next couple of chapters will be dedicated for overview\
    \ of Python programming, machine learning, and deep learning concepts."
  raw: "#### Optimal Completion Strategy\n\n*Completion* is a term to indicate the\
    \ hardware deployed inside the wellbore to ensure production lifting from the\
    \ reservoir to the wellhead. Optimal completion strategy requires the proper understanding\
    \ of reservoir potential (i.e., multiphase fluids, solids, productivity, and pressure\
    \ regimes as a function of time) as well as the production requirements (i.e.,\
    \ rate targets and wellhead pressure).\n\nMany authors use multivariate analysis,\
    \ which includes multiple linear regression analysis and statistical models using\
    \ multidisciplinary data, such as petrophysical (e.g., thickness, permeability,\
    \ saturation), completion (e.g., tubing size, stimulation fluid, and fracture\
    \ intensity), and production (e.g., pressure and multiphase flow tests data).\
    \ Traditionally, production engineering models, such as nodal analysis well models\
    \ are good enough to provide accurate predictive performance relationships for\
    \ successful completions. In the cases of unknown well failure or uncertain reservoir\
    \ phenomena, data-driven models provide much better prediction than pure engineering\
    \ models.\n\nOver the last five years, there has been an explosion in the applications\
    \ of machine learning algorithms for predicting completion performance in unconventionals\
    \ [[40](#480430_1_En_1_Chapter.xhtml#Par169)] [[41](#480430_1_En_1_Chapter.xhtml#Par170)].\
    \ Data-driven methods assist operators in the selection of optimum completion\
    \ parameters, which have a positive effect on production and are advantageous\
    \ to lower unit costs, such as stage intensity, plug-and-perforate cemented-well\
    \ designs, injection rate, and proppant mass per lateral foot and fluid volume\
    \ per lateral foot [[42](#480430_1_En_1_Chapter.xhtml#Par171)].\n\n#### Predictive\
    \ Maintenance\n\nThe upstream oil and gas industry employs a vast array of equipment.\
    \ All equipment have an operational lifetime, before the ultimate failure. More\
    \ than 90% of all producing oil wells need an artificial lift method to increase\
    \ oil production. The *electrical submersible pump* (ESP) is widely used for artificial\
    \ lift, making it a critical component in ensuring continued oil production from\
    \ the wells.\n\nDespite being among critical equipment in the upstream operations,\
    \ ESPs exhibit significantly high failure rates [[43](#480430_1_En_1_Chapter.xhtml#Par172)]\
    \ [[44](#480430_1_En_1_Chapter.xhtml#Par173)]. These failures are often random\
    \ and result in lost oil production from the wells. It is estimated that ESP failures\
    \ lead to hundreds of millions of barrels of lost or deferred oil production each\
    \ year. Previous studies have used a *principal component analysis* (PCA) approach\
    \ to detect ESP failures and predict the remaining useful life of the equipment\
    \ before failure by using complete historical data. An imminent failure often\
    \ shows up as PCA data scattered away from the origin. Combining these predictions\
    \ from the machine learning-based models with engineering principles to detect\
    \ problems with ESPs, long before they occur, and prescribing preventive actions\
    \ can have a significant economic impact [[45](#480430_1_En_1_Chapter.xhtml#Par174)]\
    \ [[46](#480430_1_En_1_Chapter.xhtml#Par175)].\n\n## Industry Trends\n\nSo far,\
    \ we have discussed several applications of machine learning in the upstream oil\
    \ and gas industry. Now we analyze some trends in the oil and gas industry and\
    \ machine learning industry at large by analyzing research publication trends\
    \ (see Figure [1-6](#480430_1_En_1_Chapter.xhtml#Fig6)).\n\nFor analyzing the\
    \ industry trends, we used different search queries on Google Scholar to understand\
    \ how publication trends in the machine learning community within the oil and\
    \ gas industry and the general machine learning community have been evolving.\
    \ The following interesting trends have emerged.\n\n*   There was a crossover\
    \ in the dominance of the term *artificial intelligence* over the term *machine\
    \ learning* in the general research community in 2008\\. A similar crossover was\
    \ observed in the oil and gas community in 2018\\. This indicates that the oil\
    \ and gas industry has adopted a machine learning lexicon with a delay of ten\
    \ years.\n\n    ![../images/480430_1_En_1_Chapter/480430_1_En_1_Fig6_HTML.jpg](images/480430_1_En_1_Chapter/480430_1_En_1_Fig6_HTML.jpg)\n\
    \n    Figure 1-6\n\n    Trends from 1991 to 2019, based on the number of Google\
    \ Scholar keyword search results for a) oil and gas industry, and b) all industries\
    \ related machine learning, deep learning, and artificial intelligence publications.\
    \ Citation count for 2019 is estimated based on data from March 2019\n\n*   After\
    \ 2012, there was a steep decline in the popularity of the term *artificial intelligence*\
    \ in the general research community . This decline fueled growth in the use of\
    \ the terms *machine learning* and *deep learning*. The year 2019 may have marked\
    \ the beginning of a similar trend for the oil and gas industry.\n\n*   The pattern\
    \ observed for the general research community in 2010 for *deep learning* began\
    \ to appear for the oil and gas industry around 2015, almost a five-year delay.\n\
    \n*   For the general research community, *machine learning* showed a steep decline\
    \ in 2017\\. Around the same time, the rise of *deep learning* continued.\n\n\
    Based on these observations, the following conclusions may be drawn.\n\n*   Adoption\
    \ of machine learning and deep learning in the oil and gas industry has lagged\
    \ by around five to ten years when compared with the general industry.\n\n*  \
    \ Currently, the adoption of machine learning and deep learning in the industry\
    \ is on the rise.\n\n*   In the near future, growth in machine learning and deep\
    \ learning should continue. At some point, deep learning will take over machine\
    \ learning in terms of popularity.\n\nIf you are wondering whether it is still\
    \ worth investing time to learn machine learning rather than deep learning, the\
    \ answer is yes. Deep learning is a subfield of machine learning. In Chapter [3](#480430_1_En_3_Chapter.xhtml),\
    \ we will discuss the fundamentals of both machine learning and deep learning.\
    \ There is a significant potential for growth in the adoption rates of these techniques\
    \ in the oil and gas industry.\n\n## Summary\n\nIn this chapter, we provided an\
    \ overview of the different segments of the oil and gas industry. We also compared\
    \ the timeline of data acquisition and integration technologies in the upstream\
    \ oil and gas industry, with the historical evolution of machine learning algorithms.\
    \ Further, we provided an overview of applications of machine learning to some\
    \ upstream industry problems. We hope that you now have a general understanding\
    \ of the upstream oil and gas industry, where machine learning can provide valuable\
    \ solutions. In the coming chapters, we will select some of these problems and\
    \ see how to build machine learning solutions to these problems using real data\
    \ sets. Before that, the next couple of chapters will be dedicated for overview\
    \ of Python programming, machine learning, and deep learning concepts."
  trans: "\n#### 最优完井策略\n\n*完井*是指安装在井筒内以确保油气从储层提升至井口的硬件设备。最优完井策略需要正确理解储层潜力（即随时间变化的多相流体、固体、产能及压力状态）以及生产要求（即产量目标和井口压力）。\n\
    \n许多研究者采用多变量分析方法，包括多元线性回归分析和利用多学科数据的统计模型，例如岩石物理数据（如厚度、渗透率、饱和度）、完井数据（如油管尺寸、增产液及裂缝强度）和生产数据（如压力及多相流测试数据）。传统上，生产工程模型（如节点分析井模型）足以提供准确的预测性能关系，以实现成功完井。在未知井况失效或储层现象不确定的情况下，数据驱动模型比纯工程模型能提供更好的预测。\n\
    \n过去五年间，机器学习算法在非常规油气完井性能预测中的应用呈爆炸式增长[40] [41]。数据驱动方法帮助作业者选择最优完井参数，这些参数对生产有积极影响，并有利于降低单位成本，例如段间距、泵送桥塞射孔固井设计、注入速率、每英尺水平段支撑剂质量及每英尺水平段液量[42]。\n\
    \n#### 预测性维护\n\n上游油气行业使用了大量设备。所有设备在最终失效前都有一定的运行寿命。超过 90%的生产油井需要人工举升方法来提高产量。*电潜泵*（ESP）被广泛用于人工举升，使其成为确保油井持续产油的关键部件。\n\
    \n尽管是上游作业中的关键设备之一，但 ESP 的故障率非常高[43] [44]。这些故障通常是随机发生的，并导致油井产量损失。据估计，ESP 故障每年导致数亿桶原油产量损失或延迟。以往的研究采用*主成分分析*（PCA）方法，利用完整的历史数据来检测\
    \ ESP 故障并预测设备在失效前的剩余使用寿命。即将发生的故障通常表现为 PCA 数据点远离原点。将基于机器学习模型的这些预测与工程原理相结合，可以在 ESP\
    \ 问题发生之前很久就检测到问题，并制定预防措施，从而产生显著的经济效益[45] [46]。\n\n## 行业趋势\n\n到目前为止，我们已经讨论了机器学习在上游油气行业的几种应用。现在，我们通过分析研究发表趋势（见图\
    \ 1-6），来整体分析油气行业和机器学习行业的一些趋势。\n\n为了分析行业趋势，我们在谷歌学术上使用了不同的搜索查询，以了解油气行业内机器学习社区以及整个机器学习社区的发表趋势是如何演变的。以下有趣的趋势已经显现。\n\
    \n*   在 2008 年，整个研究社区中，*人工智能*一词的主导地位被*机器学习*一词超越。油气行业在 2018 年也观察到了类似的交叉点。这表明油气行业采用机器学习术语的时间滞后了十年。\n\
    \n    ![../images/480430_1_En_1_Chapter/480430_1_En_1_Fig6_HTML.jpg](img/480430_1_En_1_Fig6_HTML.jpg)\n\
    \n    图 1-6\n\n    基于谷歌学术关键词搜索结果数量（a）油气行业，以及 b）所有行业中与机器学习、深度学习和人工智能相关的出版物）得出的\
    \ 1991 年至 2019 年趋势。2019 年的引用次数是根据 2019 年 3 月的数据估算的。\n\n*   2012 年之后，*人工智能*一词在整个研究社区中的流行度急剧下降。这种下降推动了*机器学习*和*深度学习*这两个术语使用量的增长。2019\
    \ 年可能标志着油气行业开始出现类似趋势。\n\n*   整个研究社区在 2010 年观察到的*深度学习*模式，大约在 2015 年开始在油气行业出现，滞后了将近五年。\n\
    \n*   对于整个研究社区而言，*机器学习*在 2017 年出现急剧下降。大约在同一时间，*深度学习*的兴起仍在继续。\n\n基于这些观察，可以得出以下结论。\n\
    \n*   与整个行业相比，油气行业对机器学习和深度学习的采用滞后了大约五到十年。\n\n*   目前，该行业对机器学习和深度学习的采用正在上升。\n\n\
    *   在不久的将来，机器学习和深度学习的增长应会持续。在某个时间点，深度学习将在流行度上超越机器学习。\n\n如果你还在犹豫是否值得花时间学习机器学习而不是深度学习，答案是肯定的。深度学习是机器学习的一个子领域。在第\
    \ 3 章中，我们将讨论机器学习和深度学习的基础知识。这些技术在油气行业的采用率有巨大的增长潜力。\n\n## 总结\n\n在本章中，我们概述了油气行业的不同环节。我们还比较了上游油气行业数据采集与集成技术的时间线，以及机器学习算法的历史演变。此外，我们概述了机器学习在一些上游行业问题中的应用。我们希望你现在对上游油气行业有了一个总体了解，知道机器学习可以在哪些方面提供有价值的解决方案。在接下来的章节中，我们将选择其中一些问题，并看看如何使用真实数据集为这些问题构建机器学习解决方案。在此之前，接下来的几章将专门介绍\
    \ Python 编程、机器学习和深度学习概念的概述。\n"
- fmt: '# 2. Python Programming Primer


    In the previous chapter, we discussed some challenges in the oil and gas industry,
    where machine learning can provide data-driven insight and solutions. However,
    before you can implement those solutions, you need to learn how to code the applicable
    machine learning algorithms. This makes understanding a computer programming language
    necessary before diving into machine learning.


    There are several programming languages that are used for developing machine learning
    solutions and applications across industries. `Python`, `R`, `Java`, `C/C++`,
    `Julia`, `Scala`, `Go`, and `Lua` are among some of the leading languages used
    for developing machine learning algorithms and applications. Out of these languages,
    `Python` had the largest community of machine learning practitioners as of 2019.
    Will this change over time? Perhaps another programming language will overtake
    `Python` in terms of popularity in the distant future. We refrain from getting
    into a debate about which programming language is better or worse, as that is
    not the intention of this book. It should be acknowledged that each programming
    language has its own merits and demerits. However, it makes practical sense to
    learn `Python` when working with machine learning algorithms, given the rich machine
    learning ecosystem and vibrant community that `Python` offers.


    `Python` has the following features.


    * **Platform independent**. `Python` code written on one platform can run on another
    platform. It means, if you wrote code on `Windows` operating system, you do not
    need to rewrite it if you wanted to run it on the `Linux` operating system. `Python`
    has been ported to almost all commonly used platforms. However, there may be some
    minor tweaks needed for functionalities related to the operating system and file
    system.


    * **Interpreted**. You do not need to compile the `Python` code explicitly before
    running it. `Python` code is executed by an interpreter, which takes care of converting
    `Python` code to byte code.


    * **High-level**. While writing a `Python` code, you do not need to worry about
    intricate system-level details, such as how to allocate or free memory during
    program execution. `Python` provides an abstraction for a large variety of general-purpose
    functions so that you can focus more on programming logic than the system or hardware-level
    details.


    * **Open source**. `Python` is freely distributed, even for commercial purposes.
    Anyone can see and make changes to `Python` source code. A large community of
    developers is constantly contributing new functionalities and features to the
    rich `Python` ecosystem for general-purpose computing, and machine learning.


    * **Object-oriented**. `Python` supports an object-oriented programming paradigm,
    where you can define data structure and behavior of real-world entities using
    a set of variables and functions. We provide more details about this later in
    this chapter.


    * **Dynamically typed**. When you define a variable in `Python`, you don’t need
    to worry about defining its data type. In simple words, you don’t need to describe
    whether a variable is an integer or a real number with decimals (`float`). `Python`
    dynamically assigns data types to variables.


    * **Conversational syntax**. `Python` syntax is intuitive and conversational.
    Just to give an example, if you want to see if a number exists in a list of numbers,
    you may write `if 5 in [1, 2, 3, 4, 5]`, and the result is `True`.


    * **Easy to learn**. The features of `Python` make it an easy-to-learn programming
    language. While mastering `Python` may take significant effort, getting started
    with `Python` has a shorter learning curve as compared to most other programming
    languages mentioned earlier in this chapter.


    Before we can start writing code in `Python`, we need to install `Python` and
    set up the programming environment. The next section walks you through the process
    of installing `Python` on your computer.


    ## Installation and Environment Setup


    There are many options to choose from when it comes to selecting an installer
    for `Python`. For this book, we recommend getting the most recent `Python 3.x`
    installer for the operating system installed on your computer, from the Anaconda
    distribution download website [[2](#480430_1_En_2_Chapter.xhtml#Par135)]. Anaconda
    distribution has most of the required `Python` libraries, and it comes with the
    added benefit of package management, which ensures that the versions of different
    libraries installed in your `Python` environment are compatible with each other.
    Detailed installation instructions are provided in [[3](#480430_1_En_2_Chapter.xhtml#Par136)].


    Once you have installed Anaconda distribution successfully, we suggest that you
    downgrade `Python` version to `3.6` by executing the following set of commands
    from Anaconda Prompt, which can be accessed from the program/start menu and is
    also shown in Figure [2-1](#480430_1_En_2_Chapter.xhtml#Fig1).


    ![../images/480430_1_En_2_Chapter/480430_1_En_2_Fig1_HTML.jpg](images/480430_1_En_2_Chapter/480430_1_En_2_Fig1_HTML.jpg)


    Figure 2-1


    Installation of `Python` version `3.6` using Anaconda prompt


    ```

    > conda update --all

    > conda install python=3.6

    ```


    These steps ensure that you have the `Python` version `3.6`, which is required
    to install some of the machine learning libraries used later in Chapter [3](#480430_1_En_3_Chapter.xhtml).
    At this point, you should have all the `Python` libraries necessary to work through
    the rest of this chapter. Now, let’s get familiar with the Jupyter Notebooks.


    ## Jupyter Notebooks


    A Jupyter Notebook, or simply *notebook*, provides an interactive way to write
    and execute `Python` code in a web-based interface. Notebooks also allow you to
    write markdowns, which makes it easier to share information about the code. If
    you want to make an attractive notebook, you can include images and other formatted
    text in the markdown cells. However, we are going to keep our focus on the `Python`
    code. To launch a new Jupyter Notebook for this chapter, navigate to the directory
    containing data and book source code in the command prompt or terminal, and use
    the following command:


    ```

    > jupyter notebook

    ```


    You should see an Internet browser window opening with a dashboard, as shown in
    Figure [2-2](#480430_1_En_2_Chapter.xhtml#Fig2).


    ![../images/480430_1_En_2_Chapter/480430_1_En_2_Fig2_HTML.jpg](images/480430_1_En_2_Chapter/480430_1_En_2_Fig2_HTML.jpg)


    Figure 2-2


    Jupyter Notebook dashboard being displayed in a web browser


    Once you have successfully launched the notebook dashboard, locate and click the
    `New` button on the right-hand side of the dashboard, and select `Python 3` under
    Notebook:. You should see a notebook opening in a new browser tab, as shown in
    Figure [2-3](#480430_1_En_2_Chapter.xhtml#Fig3).


    ![../images/480430_1_En_2_Chapter/480430_1_En_2_Fig3_HTML.jpg](images/480430_1_En_2_Chapter/480430_1_En_2_Fig3_HTML.jpg)


    Figure 2-3


    A new Jupyter Notebook being displayed in a web browser


    *Congratulations!* You have created your first Jupyter Notebook. In the web-based
    interface, you can see the menubar with different tabs, such as `File`, `Edit`,
    and so forth. Below the menubar, a toolbar provides the option to create new cells
    (denoted by the button with the `+` sign), which may be a code cell, a markdown
    cell, or other depending upon the selection made in the toolbar dropdown with
    the relevant options. While code cells contain regular `Python` code, markdown
    cells may contain a plain or formatted text description of the functionality being
    developed in the notebook. A cell can be executed by hitting `Ctrl+Enter`, or
    `Alt+Enter`. If you hit `Ctrl+Enter`, the code or markdown in the current cell
    is executed. However, if you hit `Alt+Enter`, a new cell is inserted below the
    current cell in addition to the execution of the code or markdown in the current
    cell.'
