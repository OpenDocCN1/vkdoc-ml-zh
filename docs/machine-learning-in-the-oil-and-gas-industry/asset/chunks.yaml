    ## 总结


    Python 是一门庞大的编程语言，需要不止一本书才能涵盖其所有编程概念；然而，在本章中，我们提供了一个简要的介绍。我们希望您已经了解了基本的数据结构、控制流以及一些标准库。本章为本书提供了必要的编程基础。我们强烈建议您参考原始的
    Python 文档以及本章提到的其他资源。这些资源为不断发展的 Python 编程概念和库提供了最新的描述和解释清晰的示例。


    # 3. 机器学习和深度学习概念概述


    在本章中，我们重点探索机器学习和深度学习算法的领域。前一章的数据集在本章中也会用到。此外，我们还将介绍一些新的公开数据集，用于构建机器学习和深度学习模型。在上一章中，您学习了
    Python 编程的基本概念。在本章中，我们将开始使用 Python 编程和相关库来探索数据，并进行数据整理以清理数据，使其能够用作不同机器学习模型的输入。本章分为七个主要部分，从机器学习概述开始。


    本节之后是机器学习应用相关的一些通用概念和最佳实践。后续部分将深入探讨探索性数据分析、监督学习、回归和分类算法以及无监督学习算法。另有专门章节介绍深度学习和超参数优化概念及其在特定石油和天然气行业问题中的应用。


    ## 机器学习


    机器学习是一个领域，在该领域中，计算机通过算法进行编程，使其能够从经验中学习和适应，从而在使用指标评估时改进某项任务，而不是明确告知其结果 [1]。这个定义通过一个简单示例进行解释：任务是识别手写数字，指标是使用人类标注的手写数字图像数据库（作为经验）正确分类的数字百分比。“学习”部分利用大量数据使计算机能够理解底层模式。


    随着计算能力的进步和高效机器的出现，过去几年中机器学习算法的效率有了显著提高。机器学习已成功应用的一些领域包括图像识别、文本分析（例如垃圾邮件过滤）、情感分析或信息提取、视频游戏和机器人技术。每一天，机器学习的新应用都在不断涌现。


    ### 近期进展


    机器学习领域的最新进展体现在自动驾驶汽车和自主车辆上，它们拥有多个传感器，可以高频收集实时数据。传感器数据由预训练的机器学习算法处理，为自动驾驶汽车或自主车辆提供“智能”。类似技术也用于激光地形测绘、路径规划和自适应视觉。


    机器学习的另一个成功应用在于自动语音识别和语言翻译器，这些功能在智能设备中很常见。基于生成对抗网络（GAN）原理构建的生成模型是机器学习最新进展的另一个例子，通过专门的深度学习模型，可以重建或生成逼真的人脸。

    '
- fmt: '### Machine Learning Categories


    Machine learning algorithms can be divided into three broad categories.


    - **Supervised learning:** In supervised learning, the desired output or response
    variable is known, and the machine learning algorithm provides a mapping between
    the input features and output variable. The two major subcategories of supervised
    learning are regression and classification problems, which are dictated by the
    type of output variable. When the output variable is continuous, it falls into
    the regression category. On the other hand, for classification problems, the output
    variable contains multiple classes or labels. In supervised learning, the model
    training process continues with the evaluation of error and making improvements
    until a desired level of accuracy is achieved.


    - **Unsupervised learning:** In unsupervised learning, there is no explicit output
    variable, and the relationships are generated based on the data provided to the
    algorithm. Some of the algorithms belonging to this category can reveal hidden
    structures and relationships between the input features. Some of the examples
    of unsupervised learning include clustering, dimensionality reduction algorithms,
    and associative rule learning.


    - **Reinforcement learning:** This category of algorithms is designed in such
    a way that there is a reward or penalty associated with the sequence of decisions
    made by the algorithm. A reward or penalty helps the algorithm learn the set of
    decisions it should make to achieve a defined objective. These algorithms are
    modeled using the Markov decision process (MDP). Reinforcement learning is often
    considered “semi-supervised” learning, but in an uncertain and potentially complex
    environment, the algorithm employs a trial and error approach to find solutions
    by being either penalized or rewarded for the actions it performs. Robotics for
    industrial automation is an example of reinforcement learning applications.


    As discussed in Chapter [1](#480430_1_En_1_Chapter.xhtml), we keep the discussion
    limited to supervised and unsupervised learning algorithms in this chapter.


    ### Model Training Considerations


    With the availability of a vast number of algorithms in the data science toolkits,
    sometimes it becomes challenging to understand which algorithm must be used for
    solving a problem. Many algorithms may solve the same problem, and learn the relationship
    between the input features and output variable. However, the technique and learning
    process adopted by different algorithms may be significantly different.


    An algorithm can outperform other algorithms when certain model parameters are
    changed. The model training process involves additional parameters called *hyperparameters*,
    which may include the following.


    - The number of iterations for model training.

    - The fraction of training data (batch size) that is used during each iteration.

    - The fraction of estimation error propagated to change model parameters (learning
    rate).


    The iterative process of tuning these hyperparameters for learning optimal model
    parameters is known as *hyperparameter optimization*. We discuss a simple technique
    for hyperparameter optimization in a later section of this chapter.


    In addition to optimal model parameters, the selection of optimal number and type
    of input features can also improve the accuracy of a model. This makes feature
    engineering and feature selection very important aspects of the machine learning
    process.


    It should be noted that we are providing a basic overview and a sample code implementation
    of selected machine learning algorithms in this section. A thorough understanding
    of each algorithm requires a comprehensive review of each technique, which is
    not possible in a single book chapter. We encourage you to explore and understand
    each algorithm and its associated model parameters and hyperparameters in depth
    before applying them to real-world problems. A list of parameters associated with
    each algorithm is found in the official documentation of the respective machine
    learning library.


    Each machine learning algorithm has three primary components associated with it:
    *representation, optimization,* and *evaluation* [[2](#480430_1_En_3_Chapter.xhtml#Par228)].
    The functions are represented in the form of numerical, symbolic, instance-based,
    or probabilistic graph models [[3](#480430_1_En_3_Chapter.xhtml#Par229)]. To improve
    the performance of the algorithm, optimization methods, such as gradient descent,
    dynamic programming, or evolutionary computation, are employed. The evaluation
    of these models is made through statistical metrics, which may include computations
    of precision, recall, and root-mean-squared error (RMSE).


    ### Machine Learning Libraries


    `Scikit-learn` is one of the most popular open source machine learning libraries
    in Python, which is built on other open source Python libraries, including `NumPy`,
    `SciPy`, and `Matplotlib`. `Scikit-learn` was originally developed in 2007 as
    a part of the Google Summer of Code project. It provides the implementation of
    a wide range of supervised and unsupervised learning algorithms with a Python
    programming interface.


    `TensorFlow` is another open source software library developed by Google for numerical
    computations, which is highly popular for machine learning applications, such
    as shallow artificial neural networks and deep learning. `TensorFlow` allows the
    creation of dataflow graphs using *tensors*, which are multidimensional arrays
    through which computation occurs. The library is built to support parallel runs
    on multiple CPUs and GPUs and provides wrappers for many programming languages,
    such as Python, C++, and Java. In this book, we use the `TensorFlow 2.x` release.


    `Keras`, which means *horn* in Greek, is an open source high-level neural network
    library, which is very user friendly, modular, and easy to work with Python. It
    does not handle low-level computation the way `TensorFlow` does but uses a backend
    engine to perform computations for the development of models. `Keras` uses the
    `TensorFlow` backend by default.


    There are many other open source libraries, such as `Theano`, `PyTorch`, `OpenCV`,
    and `Apache Spark ML`, available for developing machine learning models. However,
    we chose `TensorFlow` as the library of choice due to wide community adoption,
    and completeness.


    We do not provide the mathematical details of the algorithms. We stay focused
    on the hands-on implementation of machine learning algorithms using standard Python
    libraries. Please see the “Further Reading” section at the end of this book chapter
    to find some useful resources, which help improve understanding of the mathematical
    foundations of machine learning algorithms discussed in this chapter.


    **Note**


    The main Python libraries used in this chapter include `NumPy`, `SciPy`, `Matplotlib`,
    `scikit-learn`, `Keras`, `TensorFlow 2.x`, `XGBoost`, `LightGBM`, and `Hyperopt`.
    Some of these libraries should be already present in the standard Anaconda installation.
    For the missing libraries, please follow the installation instructions from the
    help pages of individual libraries. The installation process may vary significantly
    based on the operating system (e.g., Windows or Linux), the hardware on the computer
    being used (with or without NVIDIA GPUs), and so forth. We suggest that you find
    appropriate installers based on your operating system and hardware, and install
    the required libraries before proceeding with the rest of this chapter.'
