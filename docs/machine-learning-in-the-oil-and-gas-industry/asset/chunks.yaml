    #### 随机森林回归


    *随机森林*是一种基于决策树集成的算法。该算法应用了本章前面讨论过的装袋（bagging）方法。随机森林算法对输入特征和训练数据都应用装袋方法。这意味着，对于随机森林模型中生长的每棵决策树，都会随机选择输入特征的一个子集和训练数据的一个子集来训练该决策树。该算法并行训练多棵决策树。


    决策树算法存在过拟合问题。这是由于使用单棵树造成的，它几乎记住了整个训练数据，而无法泛化。然而，通过对特征和训练数据进行装袋，随机森林算法解决了过拟合问题，从而能够提供稳健的预测模型。从随机森林回归获得的结果显示出比之前讨论的算法更好的预测精度。通过查看图
    3-13 中的图可以验证这一观察结果。此处展示了一个示例代码实现。


