    ## Supervised Learning


    As we discussed at the beginning of this chapter, the problems where known input
    predicts the variable output falls under the supervised learning category. If
    the output is quantitative or continuous, it leads to solving a regression problem.
    Whereas, if the output is qualitative or discrete/categorical, it is a classification
    problem [[10](#480430_1_En_3_Chapter.xhtml#Par236)]. In other words, the objective
    is to learn a function *f*, which represents the systematic information that is
    provided by the input variables to predict or make inference about the response
    or dependent (output) variable [[7](#480430_1_En_3_Chapter.xhtml#Par233)].


    In this section, we present code snippets of vanilla implementation of various
    regression and classification algorithms. The objective is to get you acquainted
    with different algorithms by providing a starting point. A later section in the
    chapter presents a hyperparameter tuning example, which can be adopted for any
    of the machine learning algorithms discussed in this chapter.


    After providing a brief description and code snippets of different algorithms,
    a brief analysis is provided to understand the performance of each algorithm.
    However, it should be noted that these algorithm implementations are not optimized
    for performance; therefore, fine-tuned models using these algorithms may exhibit
    better performance than shown here using vanilla implementation.


    ### Regression


    Regression is a subtype of supervised learning problems, where the output is a
    quantitative or continuous variable. In the example of petrophysical data we have
    been working with, KLOGH is selected as the output variable. All other features
    are treated as independent input variables. Hence the objective of a regression
    problem is to find the optimal function *f*, which can make accurate predictions
    of KLOGH using all other variables as input features.


    ![$$ KLOGH=f\Big( BVW, CARB\_ FLAG, COAL\_ FLAG, PHIF, RHOFL, RHOMA, $$](images/480430_1_En_3_Chapter/480430_1_En_3_Chapter_TeX_Equa.png)


    ![$$ RW, SAND\_ FLAG, SW, TEMP, VSH\Big). $$](images/480430_1_En_3_Chapter/480430_1_En_3_Chapter_TeX_Equ10.png)


    (3.10)


    Various machine learning algorithms are briefly discussed in this section without
    going into their mathematical details, or hyperparameter optimization. A minimal
    implementation of the algorithms is shown in this section, and we recommend that
    you delve deeper into each of these algorithms by following the suggestions provided
    in the “Further Reading” section at the end of this chapter.


    The scikit-learn and TensorFlow machine learning libraries are used to implement
    the algorithms with Python. The end-to-end code for the examples shown in this
    chapter is provided in the Jupyter notebook available in the code repository of
    the book. The Jupyter notebook also contains some basic functions, which are defined
    to generate accuracy metrics, plot regression curves, and generate scatter plots
    of the predictions.


    #### Multiple Linear Regression


    Multiple linear regression, or simply multiple regression, is the simplest regression
    algorithm. In this algorithm, numeric coefficients are assigned to each input
    feature, and the output variable is predicted as the sum of the values obtained
    by multiplying feature value with the respective numeric coefficient. The training
    process of this algorithm tries to minimize the residual sum of squares between
    the observed and model-predicted output values. The following code snippet shows
    a sample implementation of this algorithm.


    ```

    # Multiple Linear Regression

    from sklearn.linear_model import LinearRegression

    lin_reg = LinearRegression()

    lin_reg.fit(X_train, y_train)  # training the algorithm

    print(lin_reg.intercept_)  # intercept

    print(lin_reg.coef_)  # coefficients

    # Prediction on test data

    y_pred_lin = lin_reg.predict(X_test)

    ```


    **Results**


    ```

    Mean Absolute Error: 283.89717843775026

    Mean Squared Error: 245181.5892137209

    Root Mean Squared Error: 495.15814566027376

    R Squared: 0.1488228559603506

    ```


