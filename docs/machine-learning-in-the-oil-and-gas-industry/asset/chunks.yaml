  raw: '#### Artificial Neural Network


    Artificial neural networks are built on the principle of decision-making capability
    of neurons in the human brain. These are the building blocks of more sophisticated
    deep learning networks. The neural network architecture consists of an input layer,
    one or more hidden layers, and an output layer. Each layer is made of neurons,
    where computations take place.


    In a later section of this chapter, we discuss artificial neural networks and
    their application in deep learning in some more detail. In the following code
    example, a multilayer perceptron model is built, which uses the principle of backpropagation
    of error as a primary learning mechanism.


    During the backpropagation of error, the estimated errors in model prediction
    are propagated back to adjust the neural network model parameters, and updated
    model parameters are calculated. This iterative training process continues until
    a certain condition for model accuracy, or training duration is satisfied. Figure
    [3-15](#480430_1_En_3_Chapter.xhtml#Fig15) shows the plots based on prediction
    results obtained by the neural network model built using the following code .


    ```

    # Multi-Layer Perceptron – Regression

    import tensorflow as tf

    from tensorflow import keras

    from tensorflow.keras import layers

    def build_model():

    ann_reg = keras.Sequential([

    layers.Dense(32, activation="relu", input_shape=[len(X_train.keys())]),

    layers.Dense(32, activation="relu"),

    layers.Dense(1) ])

    optimizer = tf.keras.optimizers.RMSprop(0.001)

    ann_reg.compile(loss=''mse'', optimizer=optimizer, metrics=[''mse''])

    return ann_reg

    ```


    **Results**


    ```

    Mean Absolute Error: 80.5055592187044

    Mean Squared Error: 51228.191722683405

    Root Mean Squared Error: 226.33645690140906

    R Squared: 0.8221552194654382

    ```


    The accuracy of the basic neural network model built here may not seem as good
    as some of the simpler models discussed earlier in this chapter. As the complexity
    of machine learning models increases, the task of training them adequately becomes
    more challenging. To train a *deep* neural network model adequately, we need to
    follow the process of hyperparameter optimization, which is discussed later in
    this chapter .


