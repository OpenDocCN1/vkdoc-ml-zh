  trans: '

    自 21 世纪初以来，油气行业在数据采集领域取得了显著的技术进步。除了海上地震勘探获取的海量数据外，非常规油气行业的蓬勃发展也成为了大量数据的来源。此外，计算硬件的发展，例如基于图形处理单元（GPU）的计算机，极大地提升了计算能力。借助快速计算硬件与海量训练数据的结合，近年来开发的机器学习算法已能够在无需任何人工监督的情况下，识别图像和视频中的物体。另一方面，一类新型算法——生成对抗网络（GAN）——已经能够生成几乎无法与真实照片区分的人脸图像。有趣的是，GAN
    也被有效地应用于地震图像重建中[11]。


    对这两个行业的里程碑回顾显示，它们在数据采集、数字化以及从海量数据中学习的能力方面都取得了显著进展。在本章的后续部分，我们将简要回顾机器学习在上游行业不同环节的应用。首先，我们简要概述特定上游行业环节中可用的不同类型数据，然后讨论将这些数据与机器学习算法结合以解决上游行业问题的案例。对于那些没有机器学习背景的读者来说，在学习这些算法在油气行业的应用之前，先对它们有一个初步了解是很重要的。因此，在本书接下来的章节中，我们将首先详细介绍这些机器学习算法的细节。然后，我们将展示这些算法如何用于解决行业特定问题的示例。在本章中，你只需理解存在不同类型的机器学习算法，并且它们已被应用于解决各种行业相关问题即可。


    ### 地球科学


    地球科学可以被理解为涵盖地质学、地球物理学和岩石物理学的一门学科。在以下小节中，我们将讨论一些与地球科学相关的问题，这些问题已通过应用机器学习算法得到解决。


    #### 地球物理建模


    地球物理学家处理地震数据。地震数据可以是二维、三维或四维（描述时间演化）。由于数据量庞大，地震数据集最适合用于需要大量数据进行充分训练的先进机器学习算法，例如
    CNN。以下讨论一些可通过应用机器学习来解决的地球物理学问题。


    ##### 自动断层解释


    断层解释是地震解释中的一个关键步骤。断层由不同的地下运动机制形成，导致结构不连续性。在考虑目标区域存在断层后，需要做出某些操作决策。在传统工作流程中，断层解释是一个耗时的过程。卷积神经网络可能有助于将断层解释作为一个计算机视觉问题进行公式化和求解。然而，生成大量代表地震图像及其对应断层位置的标记数据来训练
    CNN 模型并不总是可行的。不过，最近的研究已经确立了用最小训练数据集训练先进 CNN 变体的方法，同时能在提供的地震图像中对断层位置进行高度精确的逐像素预测[12]
    [13]。


    ##### 自动盐体识别


    地震解释中的另一项关键任务是识别地下环境中的盐体。在传统工作流程中，目视拾取盐/沉积物边界是进行盐体识别的标准方法。这是一个耗时的手动过程，且可能受到个人偏见的影响。基于先进
    CNN 的分类，结合残差学习，在描绘盐体方面已展现出高精度。这些基于 CNN 的算法的结果与手动解释的盐体显示出良好的一致性。这些结果表明了应用 CNN 进行自动盐体识别的潜力[14]。


    ##### 地震插值


    获取高分辨率、规则采样的地震数据常常受到物理或经济条件的限制。这导致了欠采样的地震数据集。此外，数据质量问题（如坏道或死道）的存在，给依赖高分辨率、高质量地震图像的勘探和生产活动带来了额外挑战。应对这些挑战可以使地球科学家、油藏工程师及其他行业专业人士提高其模型的预测能力。


    近年来，生成对抗网络已被用于地震图像的插值。地震插值有助于重建坏道和死道。它也可以用作地震数据的分辨率增强工具。使用生成对抗网络进行地震插值的结果使其成为经典方法的一个有趣替代方案[11]。


    ##### 地震反演


    地震反演过程将地震数据转换为描述油藏的定量岩石属性估计值。在最近的研究中，GAN 已被结合作为创建地下地质结构及其岩石物理属性的*先验*模型。生成的结构和属性信息被用于辅助地震反演[15]。这是
    GAN 在地震处理领域的另一个有趣应用。


    #### 地质建模


    地质建模是在目标区域的地表及地下生成详细的二维或三维物理属性模型的过程。建模过程使用了地表的地质观测数据、该区域钻探井的不同类型测井数据以及地震数据。以下讨论一些在地质建模中的机器学习应用。


    ##### 岩石物理建模


    岩石物理建模对于了解油藏中油气储层的结构和属性至关重要。神经网络已被成功应用于创建油气藏中岩石物理属性分布的详细表示，这有时被称为*神经克里金法*[16]
    [17]。近年来，深度神经网络已被应用于生成详细的二维和三维模型或油藏[18] [19]。这些研究证明了机器学习方法在构建详细的岩石物理属性模型方面的有效性。

