    学习曲线，展示了多层感知器随轮次变化的训练损失


    这个例子向我们展示了MLP可以生成一个用于识别图像的模型，其正确率约为70%。然而，MLP并非专门用于图像识别任务的算法。接下来，我们将讨论一种专门用于图像识别和其他通用计算机视觉应用的深度神经网络架构。


    ### 卷积神经网络（CNN）


    只有当图像像素在2D或3D上下文中被一起观察时，才能实现物体的视觉识别。我们使用MLP进行图像分类任务。尽管MLP的表现比抛硬币要好，但它并没有生成可用于任何实际应用的预测。这种较低的准确率源于MLP在查看图像时缺乏空间上下文。


    卷积神经网络（CNN）是专门的神经网络，它通过执行允许在学习过程中包含空间上下文的计算来学习识别物体。CNN由卷积层构建而成。虽然训练CNN的大部分方面与训练MLP相似，但神经网络架构有显著不同。


    图[3-25](#480430_1_En_3_Chapter.xhtml#Fig25)总结了与CNN架构相关的一些重要概念。在CNN的卷积层中，卷积滤波器遍历图像以提取图像特征，这有助于识别给定图像所属的类别。


    ![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig25_HTML.jpg](images/480430_1_En_3_Chapter/480430_1_En_3_Fig25_HTML.jpg)


    图3-25


    (a) 图像和卷积滤波器、(b) 卷积操作、(c) 步长、(d) 图像周围的零填充，以及 (e) 卷积层上特征提取的概念性表示的示意图


    以下是CNN相关的一些重要概念，如图[3-25](#480430_1_En_3_Chapter.xhtml#Fig25)所示。


    *   **滤波器：** 一个方形权重矩阵通常代表卷积层中的一个滤波器。CNN训练过程的主要目标之一是学习卷积滤波器的最优权重。


    *   **卷积：** 在卷积操作期间，计算图像重叠像素与滤波器之间逐元素乘积的总和。该值被分配给重叠图像块的中心像素（见图[3-25](#480430_1_En_3_Chapter.xhtml#Fig25)-b）。


    *   **步长：** 滤波器可以一次移动一个像素来遍历图像，或者它可以在中间跳过几个像素。滤波器在图像上遍历时一次移动的像素数称为**步长**（见图[3-25](#480430_1_En_3_Chapter.xhtml#Fig25)-c）。


    *   **填充：** 当滤波器遍历图像时，由于边缘处没有重叠的单元格，它会减小图像的尺寸。在某些需要保持图像尺寸的场景中，可以在图像边缘用零进行填充（见图[3-25](#480430_1_En_3_Chapter.xhtml#Fig25)-d）。对于一个尺寸为*W*
    × *W*的图像，被尺寸为*F* × *F*的滤波器以步长*S*遍历，并且图像边缘填充了*P*个单元格，输出图像的尺寸可以通过![$$ \left[\frac{W-K+2P}{S}\right]+1\.
    $$](images/480430_1_En_3_Chapter/480430_1_En_3_Chapter_TeX_IEq3.png)计算得出。


    当图像通过多个卷积层处理时，滤波器会提取出图像中的区分性特征，使得更容易将样本数据中的一个类别与其他类别区分开来（见图[3-25](https://doi.org/10.1007/978-1-4842-6094-4_2Fig#25)-e）。以下代码片段展示了用于对SFO数据集中的图像进行分类的CNN模型。


    ```

    model = Sequential()

    model.add(Conv2D(96, (5, 5), activation="relu",

    input_shape=(IMG_DIM, IMG_DIM, 1)))

    model.add(MaxPooling2D((2, 2)))

    model.add(Conv2D(128, (5, 5), activation="relu"))

    model.add(MaxPooling2D((2, 2)))

    model.add(Conv2D(128, (5, 5), activation="relu"))

    model.add(MaxPooling2D((2, 2)))

    model.add(Conv2D(64, (5, 5), activation="relu"))

    model.add(Flatten())

    model.add(Dense(64, activation="relu"))

    model.add(Dense(32, activation="relu"))

    model.add(Dense(3, activation="softmax"))

    ```'
  raw: '*   A *dense* input layer with 1024 nodes. Seven hidden layers with 512, 256,
    128, 64, 32, 16, and 8 nodes respectively. These nodes are called *dense* because
    every node in these layers is connected to every node in the previous and next
    layer providing dense connectivity (see Figure [3-22](#480430_1_En_3_Chapter.xhtml#Fig22)).
    Finally, there’s an output layer with three nodes. All nodes (except for the output
    layer) have the ReLU activation function. The weights on input and hidden layers
    are initialized using the `he_normal` initializer.


    *   Regularization occurs when a penalty is imposed for large changes in the model
    parameters (weights and biases) during the model training. It provides a safeguard
    against overfitting. The extent of the penalty imposed can be tuned using a regularization
    parameter, which is usually a small numerical value. In the MLP model shown, we
    used L2 regularization with a regularization parameter of 0.02.


    *   The output layer in the model uses the softmax activation function to output
    estimated classification probabilities.


    *   The model uses the `Adadelta` optimizer , which uses a stochastic gradient
    descent method with an adaptive learning rate. While some other optimizers require
    a predefined learning rate, the `Adadelta` optimizer computes the learning rate
    adaptively. The optimizer uses `sparse_categorical_crossentropy` as the loss function,
    which is a variation of previously discussed categorical cross-entropy for the
    scenario, where each object can belong to only one of the sample classes.


    The following code snippet is used for training the preceding MLP model.


    ```

    # Early-stopping callback using validation

    earlystop_callback = EarlyStopping(monitor=''val_accuracy'',

    min_delta=0.0001, patience=50)

    # Save the best model

    ckpt_path = ''./models/dnn.h5''

    ckpt_callback = ModelCheckpoint(filepath=ckpt_path, mode="max",

    monitor=''val_accuracy'', verbose=1,

    save_best_only=True)

    # Train the model

    history = model.fit(X_train, y_train, epochs=500, batch_size=BATCH_SIZE, validation_data=(X_valid,
    y_valid),

    callbacks=[earlystop_callback, ckpt_callback],

    verbose=1)

    ```


    Important components of the model training process are as follows.


    *   **Epochs:** An epoch corresponds to the number of training iterations it takes
    for the algorithm to process all the samples provided in the training data once.
    The MLP model here is expected to train for 500 epochs.


    *   **Early-stopping:** This concept uses a validation dataset to constantly monitor
    the training process. The `min_delta` parameter defines a minimum validation accuracy
    improvement. If model accuracy does not improve beyond `min_delta` within the
    number of training epochs defined by the `patience` parameter, training is stopped.
    This code implementation always saves the model whenever the previous best validation
    accuracy is improved. The model that provided the best validation accuracy at
    the end of training can be used later for generating predictions.


    Figure [3-24](#480430_1_En_3_Chapter.xhtml#Fig24) shows the evolution of loss
    function for the training and validation dataset over the training epochs. The
    MLP model trained with the process was used for generating predictions on the
    test dataset. The model generated predictions for salt, fault, and other classes
    with the following accuracy.


    ```

    Test Accuracy: 0.713

    ```


    The model accuracy can be improved to some extent by optimizing hyperparameters.


    ![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig24_HTML.jpg](images/480430_1_En_3_Chapter/480430_1_En_3_Fig24_HTML.jpg)


    Figure 3-24


    Learning curve showing training loss for a multilayer perceptron with the number
    of epochs


    This example shows us that MLP can generate a model for identifying images, which
    was correct about 70% of the time. However, MLP is not an algorithm specialized
    for the image recognition task. Next, we discuss a deep neural network architecture,
    which is specialized in image recognition and other generic computer vision applications.


    ### Convolutional Neural Network (CNN)


    Visual identification of objects is only possible when image pixels are seen together
    in a 2D or 3D context. We used MLP for image classification tasks. Although MLP
    performed better than the flip of a coin, it did not generate predictions, which
    can be used in any realistic application. This lower accuracy stems from the fact
    that MLP looks at the images without a spatial context.


    Convolutional neural networks, or CNNs, are specialized neural networks that learn
    to identify objects by performing computations, which allow inclusion of spatial
    context in the learning process. CNNs are built using convolutional layers. While
    most of the aspects of training a CNN remain similar to MLP training, the neural
    network architecture differs significantly.


    Figure [3-25](#480430_1_En_3_Chapter.xhtml#Fig25) summarizes some important concepts
    related to CNN architecture. In the convolutional layers of a CNN, convolutional
    filters traverse the images to extract the image features, which helps identify
    the class that a given image belongs to.


    ![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig25_HTML.jpg](images/480430_1_En_3_Chapter/480430_1_En_3_Fig25_HTML.jpg)


    Figure 3-25


    Schematic depiction of (a) an image and convolutional filter, (b) convolutional
    operation, (c) stride, (d) zero padding around the image, and (e) conceptual representation
    of feature extraction happening over convolutional layers


    The following are some of the important concepts related to the CNN, as shown
    in Figure [3-25](#480430_1_En_3_Chapter.xhtml#Fig25).


    *   **Filter:** A square weight matrix often represents a filter in a convolutional
    layer. One of the main objectives of the CNN training process is to learn optimal
    weights for the convolutional filters.


    *   **Convolution:** During the convolution operation, a sum of element-wise multiplication
    between the overlapping pixels of the image and the filter is computed. This value
    is assigned to the central pixel of the overlapping image patch (see Figure [3-25](#480430_1_En_3_Chapter.xhtml#Fig25)-b).


    *   **Stride:** The filter can traverse the image by moving one pixel at a time,
    or it may skip a few pixels in between. The number of pixels that filter moves
    at a time while traversing over the image is called *stride* (see Figure [3-25](#480430_1_En_3_Chapter.xhtml#Fig25)-c).


    *   **Padding:** When a filter traverses over the image, it reduces the size of
    the image because of the non-availability of overlapping cells at the edges. In
    certain scenarios, where it is desirable to preserve the image size, the image
    can be padded on the edges (see Figure [3-25](#480430_1_En_3_Chapter.xhtml#Fig25)-d)
    with zeros. For an image of size *W* × *W*, being traversed by a filter of size
    *F* × *F*, with a traversal stride *S*, and *P* cells padding the image edges,
    the size of the output image can be calculated by ![$$ \left[\frac{W-K+2P}{S}\right]+1\.
    $$](images/480430_1_En_3_Chapter/480430_1_En_3_Chapter_TeX_IEq3.png)


    As an image is processed through multiple convolutional layers, the filters bring
    out distinguishing features in the image that make it easier to identify one class
    from the other classes present in the sample data (see Figure [3-25](https://doi.org/10.1007/978-1-4842-6094-4_2Fig#25)-e).
    The following code snippet shows the CNN model that is used for classifying images
    in the SFO dataset.


    ```

    model = Sequential()

    model.add(Conv2D(96, (5, 5), activation="relu",

    input_shape=(IMG_DIM, IMG_DIM, 1)))

    model.add(MaxPooling2D((2, 2)))

    model.add(Conv2D(128, (5, 5), activation="relu"))

    model.add(MaxPooling2D((2, 2)))

    model.add(Conv2D(128, (5, 5), activation="relu"))

    model.add(MaxPooling2D((2, 2)))

    model.add(Conv2D(64, (5, 5), activation="relu"))

    model.add(Flatten())

    model.add(Dense(64, activation="relu"))

    model.add(Dense(32, activation="relu"))

    model.add(Dense(3, activation="softmax"))

    ```'
  trans: '

    *   一个包含 1024 个节点的**密集**输入层。七个隐藏层，节点数分别为 512、256、128、64、32、16 和 8。这些节点被称为**密集**层，是因为这些层中的每个节点都与前一层和后一层的每个节点相连，从而提供了密集连接（见图
    3-22）。最后，是一个包含三个节点的输出层。所有节点（输出层除外）都使用 ReLU 激活函数。输入层和隐藏层的权重使用`he_normal`初始化器进行初始化。


    *   正则化是指在模型训练过程中，当模型参数（权重和偏置）发生较大变化时施加惩罚。它提供了一种防止过拟合的保护措施。惩罚的程度可以通过正则化参数进行调整，该参数通常是一个较小的数值。在所示的
    MLP 模型中，我们使用了 L2 正则化，正则化参数为 0.02。


