- fmt: '### Massive Data Collection with Social and Human Sensors


    The oil and gas industry is behind other industries (e.g., finance, medical, and
    marketing) regarding large-scale wireless sensors [[7](#480430_1_En_8_Chapter.xhtml#Par150)].
    These sensors may come from various sources: connected wearable devices, social
    networks, multi-domain collaboration, or any network of IoT (Internet-of-Things)
    devices.


    ### Policymaking in AI


    As machine learning and artificial intelligence take more roles in society and
    corporate worlds, the need to create policies by governments and organizations
    becomes more obvious [[8](#480430_1_En_8_Chapter.xhtml#Par151)]. Government policies
    and global cooperation agreements could accelerate (or deaccelerate) dramatically
    the progress and adoption of machine learning and artificial intelligence in all
    levels of society, including health, food, services, energy, transport and education.


    ### Adoption of AI by Government Organizations


    Governments face numerous challenges in the adoption of AI [[9](#480430_1_En_8_Chapter.xhtml#Par152)],
    including effective use of data, people skills, AI ecosystem, legacy culture,
    and procurement mechanisms. However, a change in the AI adoption rate by governments,
    such as the UAE, could imply tremendous implications in the development of machine
    learning/artificial intelligence for the oil and gas industry. There is a great
    correlation between citizen satisfaction and government adoption rates [[10](#480430_1_En_8_Chapter.xhtml#Par153)].


    ## Machine Learning and Artificial Intelligence Technology Promises


    There is no doubt that machine learning and artificial intelligence have progressed
    exponentially over the last decade [[11](#480430_1_En_8_Chapter.xhtml#Par154)].
    This accelerated pace suggests that the associated science and techniques will
    continue to grow in the next decade as well [[12](#480430_1_En_8_Chapter.xhtml#Par155)].


    AI will take normal roles in our daily lives [[13](#480430_1_En_8_Chapter.xhtml#Par156)],
    including the oil and gas industry. AI will play a key role in solving key engineering
    challenges of the next decade [[14](#480430_1_En_8_Chapter.xhtml#Par157)]; particularly,
    it will solve many challenges in drilling [[15](#480430_1_En_8_Chapter.xhtml#Par158)],
    production, and reservoir engineering.


    ### Deep Learning


    The performance of machine learning models increases as data availability increases.
    Deep neural networks have the potential to leverage more data. The following are
    examples of deep learning applications.


    - Automating drilling operations requires the correct event classification of
    time-series data. An offline model based on semantic segmentation in parallel
    to a CNN-based inference model can classify and predict rig states in a real-time
    drilling analytics system with 99% accuracy [[16](#480430_1_En_8_Chapter.xhtml#Par159)].


    - Hydraulic fracture operations continue to improve thanks to machine learning
    and AI-assisted complex event detection. These events include fracture stage start
    and end, ball seat operation identification, and categorization of periods of
    pump rate. A deep learning application based on CNN and U-Net architecture provides
    real-time automated interpretations of hydraulic fracture events [[17](#480430_1_En_8_Chapter.xhtml#Par160)].


    - Log interpretation is frequently regarded as a time-consuming task with subjective
    results adding unnecessary uncertainties to reservoir studies. Automated petrophysical
    interpretation using multiple modeling techniques (i.e., model stacking for supervised
    classification) looks promising for reducing subsurface model study time-cycles
    and enhancing prediction quality [[18](#480430_1_En_8_Chapter.xhtml#Par161)].


    - Identifying lithology and fluids from visual inspection of drill cuttings is
    required for hydrocarbon detection, well placement, subsurface navigation, and
    ultimately optimizing field development costs. However, such a task is usually
    perceived as low-added-value because it relies on subjective interpretation. The
    use of CNN for visual recognition has become popular in recent years in this area.


    - Classifying cutting volume at a rig site in real time is achieved using deep-learning
    techniques [[19](#480430_1_En_8_Chapter.xhtml#Par162)]. Normalization and principal-component
    analyses (PCAs) are conducted before every video frame is fed into the classification
    model.


    - Drill cutting image classification is difficult because of the large similarity
    between the image classes. A Bayesian-optimized ensemble of CNN performs superior
    to other known methods, particularly given the huge parameter space [[20](#480430_1_En_8_Chapter.xhtml#Par163)].


    ### Reinforcement Learning


    Reinforcement learning (RL) has tremendous potential where there is a large amount
    of data. RL is hungry for data. An application for waterflooding optimization
    was presented using deep reinforcement learning based on well data [[21](#480430_1_En_8_Chapter.xhtml#Par164)].
    AI agents can learn the reservoir behavior by using the available data as pressure
    and phase monitoring. Trained agents can predict how the change in policies they
    make, affects the objective function.


    ### Multiphysics Models


    Traditional static-based and flow-based upscaling methods to generate equivalent-continuum
    models from the discrete-fracture model (DFM) present both low accuracy and high
    computational cost. Detailed fluid flow models that can run as fast as data-driven
    models have always been of interest and value in the oil and gas industry. A physics-based
    deep learning approach for the upscaling of high-resolution images of fractured
    media-constructed equivalent continuum models [[22](#480430_1_En_8_Chapter.xhtml#Par165)].


    ### The Future of AI


    Due to the programmed ability of AI to process information, there is an agreement
    that, in the future, AI will provide more contextual information [[23](#480430_1_En_8_Chapter.xhtml#Par166)]
    (see Table 8-1).


    **Table 8-1** Various Waves of Artificial Intelligence (After [[23](#480430_1_En_8_Chapter.xhtml#Par166)])


    | Main AI Wave | 1st Wave (<2000) | 2nd Wave (last decade) | 3rd Wave (future)
    |

    | --- | --- | --- | --- |

    | Describe | Categorize | Explain |

    | --- | --- | --- |

    | | Handcrafted Knowledge | Statistical Learning | Contextual Adaptation |

    | Main Scope | Knowledge structure defined by humans; Specifics explored by the
    algorithm | Statistical models for specific problem domains, trained on data |
    Contextual explanatory models for classes of real-world phenomena |

    | Capabilities | Enables reasoning over narrowly defined problems. No learning
    capability and poor handling of uncertainty | Nuanced classification and prediction
    capabilities. No contextual capability and minimal reasoning ability | Model to
    drive decisions. The model generates explanations of how a test character might
    have been created |


    ### Explainable AI


    As machine learning/artificial intelligence models increase their performance,
    it becomes increasingly difficult to understand and explain them. The objective
    of explainable AI is to generate self-explained machine learning models that have
    equivalent superior performance (i.e., high accuracy in prediction) while enabling
    individuals to understand and trust these models [[24](#480430_1_En_8_Chapter.xhtml#Par167)].'
