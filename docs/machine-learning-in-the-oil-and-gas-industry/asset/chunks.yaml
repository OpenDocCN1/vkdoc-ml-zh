    y_valid),

    callbacks=[earlystop_callback, ckpt_callback],

    verbose=1)

    ```


    模型训练过程的重要组件如下。


    *   **Epochs（轮次）：** 一个 epoch 对应于算法处理一次训练数据中所有样本所需的训练迭代次数。这里的 MLP 模型预计训练 500 个
    epoch。


    *   **Early-stopping（早停）：** 此概念使用验证数据集持续监控训练过程。`min_delta`参数定义了最小验证准确率提升。如果模型准确率在`patience`参数定义的训练轮次数内没有超过`min_delta`的提升，则停止训练。此代码实现会在每次超过之前的最佳验证准确率时保存模型。在训练结束时提供最佳验证准确率的模型可用于后续生成预测。


    图 3-24 展示了训练和验证数据集在训练轮次中损失函数的变化。使用该过程训练的 MLP 模型用于对测试数据集生成预测。该模型对盐层、断层和其他类别的预测准确率如下。


    ```

    Test Accuracy: 0.713

    ```


