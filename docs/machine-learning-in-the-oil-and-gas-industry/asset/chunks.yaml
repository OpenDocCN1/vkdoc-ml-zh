- fmt: '# Summary


    In this chapter, we used a machine learning method that provides a tool equivalent
    to the kriging technique. We used an open source data set to train the Gaussian
    process regression model. During recent years, there have been several new developments
    in the area of spatial interpolation. The most notable are *generative adversarial
    networks* (GANs). In the oil and gas industry, GANs have been used for the interpolation
    of seismic images [[5](#480430_1_En_5_Chapter.xhtml#Par50)]. However, it may be
    worthwhile to take a step back and assess the applicability of these methods in
    the geomodeling perspective.


    Often, the biggest challenge facing the geoscientists is the availability of good
    data from the well logs. During the initial field development phase, the data
    from well logs is scarce. In such scenarios, the applicability of algorithms,
    such as GAN, is questionable given the large amounts of data required for training
    them. However, in the scenarios where well logs from hundreds of wells are available,
    it may be worthwhile to evaluate the applicability of deep learning–based techniques
    [[6](#480430_1_En_5_Chapter.xhtml#Par51)]. However, in a normal scenario, Gaussian
    process regression presents a good choice of algorithm for petrophysical properties
    interpolation.


    ## Effect of Parameter Alpha


    The results shown in this chapter were generated using an `alpha` parameter value
    of 0.75 while training the `GaussianProcessRegressor` model.


    - Try using different values of the `alpha` parameter to see how it changes the
    output. You will see that the `GaussianProcessRegressor` score keeps improving
    as you lower the value of `alpha`, but its ability to predict property values
    away from the wells will diminish.

    - If you have access to a realistic 3D grid model in `.GRDECL` format, try to
    use the code provided with the book for that 3D grid and see whether you can generate
    good results using a `GaussianProcessRegressor`.


    # 6. Reservoir Engineering


    The oil and gas industry has been solving problems related to automation and optimization
    from the very beginning. Modern technology and data-driven algorithms have provided
    the industry with an additional mechanism to solve problems and gain insights.
    Machine learning applications in the oilfield are observed in drilling engineering
    for ROP optimization [[1](#480430_1_En_6_Chapter.xhtml#Par57)], differential pipe
    sticking [[2](#480430_1_En_6_Chapter.xhtml#Par58)], identification of sweet spots
    [[3](#480430_1_En_6_Chapter.xhtml#Par59)], petrophysical modeling [[4](#480430_1_En_6_Chapter.xhtml#Par60)],
    reservoir fluid property estimation [[5](#480430_1_En_6_Chapter.xhtml#Par61)],
    subsurface characterization [[6](#480430_1_En_6_Chapter.xhtml#Par62)], reservoir
    simulation [[7](#480430_1_En_6_Chapter.xhtml#Par63)], production engineering [[8](#480430_1_En_6_Chapter.xhtml#Par64)],
    and completions engineering [[9](#480430_1_En_6_Chapter.xhtml#Par65)] to name
    a few.


    Some studies have tried to combine traditional statistical methods with machine
    learning [[10](#480430_1_En_6_Chapter.xhtml#Par66)] to improve the performance
    of completion jobs and overall production. A hot topic in recent years is the
    optimization of completion design to mitigate fracture hits [[11](#480430_1_En_6_Chapter.xhtml#Par67)],
    which is found to be critical for unconventional plays [[12](#480430_1_En_6_Chapter.xhtml#Par68)].
    Due to the existing heterogeneity and uncertainty in the reservoir, many have
    raised issues on pure physics-based models [[13](#480430_1_En_6_Chapter.xhtml#Par69)],
    which pushes our attention to data-driven solutions to complement those studies.
    Modern computational power has also enabled the applications of neural networks
    and deep learning-based solutions for solving problems in the oil and gas industry.
    Multiple studies have tried to use this learning technique to solve problems like
    bit-bounce detection [[14](#480430_1_En_6_Chapter.xhtml#Par70)], production data
    analysis [[15](#480430_1_En_6_Chapter.xhtml#Par71)], seismic horizon interpretation
    [[16](#480430_1_En_6_Chapter.xhtml#Par72)], and more.


    Applications of machine learning can be divided into two categories [[12](#480430_1_En_6_Chapter.xhtml#Par68)].
    The first category relies on production data, and the second category includes
    completions, operations, and other reservoir parameters. This chapter is based
    on the first category, in which publicly available production data is used for
    the analysis.


    In the field of petroleum engineering, one of the primary responsibilities of
    a reservoir engineer is the ability to quantify the reservoir’s performance. This
    is performed using *decline curve analysis* (DCA), where the production rates
    are monitored against time, and predictions are made on oil or gas volumes, which
    can be produced by the reservoir. DCA plays an important role and is one of the
    most valuable techniques in a reservoir engineer’s toolbox because it provides
    a way to estimate the initial hydrocarbon in place and the hydrocarbon reserves
    at the time of abandonment, and to forecast future production until economic limits
    are reached. Forecasts made using this approach are often used to report reserves
    to the US Securities and Exchange Commission (SEC), and hence they hold high importance
    in the field of petroleum economics.


    With the increased adoption of machine learning-based solutions in the oil and
    gas industry, there has been an effort to improve decline curve analysis to make
    more accurate forecasts. One of the reasons behind the increasing application
    of machine learning is the massive amount of data, which helps build reservoir
    models and perform history match. The conventional methods of reservoir engineering
    and reservoir modeling are costly and time-consuming, hence leading our attention
    to data-driven methods that provide estimates with similar or improved accuracy.


    This chapter introduces problems in the field of reservoir engineering, which
    can be solved using machine learning. Subsequent sections are dedicated to scraping
    a publicly available dataset and developing forecasting models for decline curve
    analysis.


    Traditional forms of statistical analysis that use Arps decline methods and time
    series-based analysis to forecast production are introduced in this chapter. The
    forecasted results from different approaches are discussed. This is only a brief
    description, and the readers are encouraged to try other methods, like recurrent
    neural networks (RNNs) and long-short term memory (LSTM), to forecast oil and
    gas production, which have been shown to provide predictions with higher accuracy
    [[17](#480430_1_En_6_Chapter.xhtml#Par73)].'
