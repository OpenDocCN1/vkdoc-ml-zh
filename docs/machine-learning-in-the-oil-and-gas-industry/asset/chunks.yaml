    \   Implement data analytics and business processes to automate asset *exception-based\
    \ surveillance* (EBS), focusing on critical well status.\n\n    *   Implement\
    \ machine learning models to continuously search for optimum asset operating envelope,\
    \ considering uncertainty.\n\n    *   Implement an automated AI-assisted complex\
    \ decision-making engine with an automated routine-action recommendation.\n\n\
    *   **Challenge**: Demonstrating a commitment to environmental concerns while\
    \ providing a maximum return to shareholders.\n\n    **Mitigation Options**\n\
    \    *   Enable routine HSE inspections with permanent instrumentation processing,\
    \ video surveillance with digital image processing including drone and satellite\
    \ images, and robotics with human interactions, focusing on critical events.\n\
    \n    *   Implement analytics processes that involve multi-objective constrained\
    \ optimization objective functions looking at better fuels and profitable products.\n\
    \n*   **Challenge**: Delivering a safer workplace with less human-intensive actions\
    \ and decision-making processes. Enable operations and processes run 24/7 with\
    \ very high availability, reducing human-power requirements.\n\n    **Mitigation\
    \ Options**\n    *   Automate production monitoring and oilfield operations\n\n\
    \    *   Enable routine HSE inspections including the use of connected wearable\
    \ safety devices in critical areas\n\n    *   Enable autonomous and remote control\
    \ of routine actions: choke, gas-lift, frequency, and so forth\n\n## Barriers\
    \ to Adopting Machine Learning\n\nThese barriers may come into play before, during,\
    \ and after any machine learning and artificial intelligence project execution\
    \ (see Figure [8-2](#480430_1_En_8_Chapter.xhtml#Fig2)). These barriers, when\
    \ properly identified, will be mitigated as they jeopardize sustainability and\
    \ may kill the idea at any point in the project execution. They have been captured\
    \ from experience and various references across the literature.\n\n### Knowledge\
    \ and Skills Gaps\n\nUnderstanding gaps in people skills is paramount for sustainable\
    \ implementations of machine learning and artificial intelligence solutions. Multidisciplinary\
    \ knowledge gaps, lack of machine learning and artificial intelligence skills,\
    \ digital literacy, and anxieties over job elimination are some of the barriers\
    \ to the broader adoption of these technologies in the industry.\n\n#### The Knowledge\
    \ Gap Between Data Scientists and Petroleum Engineers\n\nPetroleum engineering\
    \ is a science that is often forced to make decisions in the presence of little\
    \ data availability; this has created a large body of knowledge for statistics,\
    \ uncertainty management, and analytics. However, modern machine learning and\
    \ advanced data analytics techniques in upstream are in their infancy stages.\n\
    \nIn addition, individuals with advanced data science skills may not be well conversant\
    \ with the engineering practices of the oil and gas industry.\n\nThe way to mitigate\
    \ this challenge is to have people who are knowledgeable in both domains and pursue\
    \ cross-domain training.\n\n![../images/480430_1_En_8_Chapter/480430_1_En_8_Fig2_HTML.jpg](images/480430_1_En_8_Chapter/480430_1_En_8_Fig2_HTML.jpg)\n\
    \nFigure 8-2\n\nBarriers to adopting machine learning and artificial intelligence\
    \ in the oil and gas industry\n\n#### Lack of Machine Learning and Artificial\
    \ Intelligence Skills\n\nOil and gas professionals are not conventionally trained\
    \ to handle advanced machine learning and artificial intelligence technologies.\
    \ As it is seen historically in many operators and services companies, a small\
    \ fraction of professionals opt to get self-trained to address the application\
    \ of new technologies. This is no different in machine learning and artificial\
    \ intelligence, where only a few can understand the full application of such techniques.\n\
    \nLack of machine-learning skills is a key obstacle, and it impedes organizations\
    \ to fully exploit the value of their data.\n\nLow availability and poor adequacy\
    \ of the new workforce intensify industry sustainability goals. Young professionals\
    \ may not have the required level of competencies to address the impending challenges\
    \ and require long times to get trained\n\nWith the pressure to reduce cost and\
    \ manpower, there is a need for recruiting different types of employees or a new\
    \ type or generation of the workforce that makes greater use of artificial intelligence\
    \ applications.\n\n#### Lack of Digital Literacy\n\nPetroleum engineers and management\
    \ professionals can cope with a limited amount of digital knowledge. However,\
    \ when talking about machine learning and artificial intelligence, individuals\
    \ need to have a broader vocabulary, a deeper understanding of computers and knowledge\
    \ of digital systems. This involves general knowledge on how to build a digital solution\
    \ including all its components: defining the problem objectives, use cases, algorithm,\
    \ workflow, data, and hardware and software requirements.\n\nScaling machine learning\
    \ and artificial intelligence solutions to a wider user-based production environment\
    \ is a more complex task. We believe that emerging generations will have more\
    \ digital literacy and abilities to absorb more data in the digital world.\n\n\
    New generations will adapt to and request more data-driven applications.\n\n####\
    \ Anxieties of Job Elimination\n\nHistorically, all industrial revolutions have\
    \ implied some form of workforce adaptation to other skill requirements.\n\nAs\
    \ identified by the skills gap, there is a genuine concern that someday machines\
    \ will get super-smart and that digital transformation lead by machine learning\
    \ and artificial intelligence will massively eliminate jobs. This further creates\
    \ a negative response toward machine learning and artificial intelligence applications.\n\
    \n### Technical Challenges\n\nOn the technical side, some obstacles can be easily\
    \ removed with time, which includes access to machine learning resources (data,\
    \ software, and hardware), lack of best practices for data use, and IT environment\
    \ alignment.\n\n#### Access to Data, Software, and Hardware Resources\n\nThe oil\
    \ and gas industry may not have the infrastructure needed to run advanced data\
    \ analytics in most of its operations. Data is typically located in the places\
    \ where it is not leveraged (i.e., in the field operations where there is little\
    \ knowledge about how to use data).\n\nCybersecurity constraints also pose an\
    \ obstacle; it brings project delays until data manipulation workflows are fully\
    \ understood by corporate IT personnel. Too restrictive IT policies prevent users\
    \ from collaborating and sharing knowledge about machine learning applications.\
    \ These policies also block users from downloading and executing open source software\
    \ and programming languages, such as R and Python.\n\n#### Best Practice and Standards\
    \ for Data Collection and Use\n\nAlthough there are numerous open source resources\
    \ for machine learning and artificial intelligence applications, there is no established\
    \ best practice nor standard operating procedure for gathering and using data."
  trans: "\n### 技术挑战与缓解措施\n\n以下重点介绍了最相关的技术挑战及建议的缓解方案。\n\n*   **挑战**：需要持续管理（监控、优化和控制）资产性能。石油和天然气生产需要持续了解油藏、油井和设施；然而，这些目标必须在资源有限的情况下实现，而现有资源只能看到运营的一小部分。这是由于缺乏能够深入洞察工艺状态的传感器和技术。\n\
    \n    **缓解方案**\n    *   实施数据分析和业务流程，实现资产*基于异常的监控*（EBS）自动化，重点关注关键井况。\n\n    * \
    \  实施机器学习模型，在考虑不确定性的情况下持续搜索最优资产运行包络线。\n\n    *   实施一个具备自动化常规操作建议功能的、由人工智能辅助的复杂决策引擎。\n\
    \n*   **挑战**：在向股东提供最大回报的同时，展示对环境问题的承诺。\n\n    **缓解方案**\n    *   通过永久性仪表处理、包含无人机和卫星图像在内的数字图像处理视频监控，以及人机交互机器人技术，实现常规\
    \ HSE 检查的自动化，重点关注关键事件。\n\n    *   实施涉及多目标约束优化目标函数的分析流程，以寻求更优质的燃料和高利润产品。\n\n* \
    \  **挑战**：打造更安全的工作场所，减少人力密集型操作和决策过程。实现运营和流程的 7x24 小时高可用性运行，降低人力需求。\n\n    **缓解方案**\n\
    \    *   实现生产监控和油田作业的自动化\n\n    *   实现常规 HSE 检查，包括在关键区域使用联网可穿戴安全设备\n\n    *  \
    \ 实现常规操作的自主和远程控制：节流阀、气举、频率等\n\n## 采用机器学习的障碍\n\n这些障碍可能出现在任何机器学习和人工智能项目执行之前、期间和之后（见图\
    \ 8-2）。这些障碍一旦被正确识别，就应予以缓解，因为它们会危及可持续性，并可能在项目执行的任何阶段扼杀创意。这些障碍是根据经验及文献中的各种参考资料总结得出的。\n\
    \n### 知识与技能差距\n\n了解人员技能方面的差距对于可持续地实施机器学习和人工智能解决方案至关重要。多学科知识差距、缺乏机器学习和人工智能技能、数字素养不足以及对失业的焦虑，是这些技术在行业内更广泛采用的一些障碍。\n\
    \n#### 数据科学家与石油工程师之间的知识差距\n\n石油工程是一门经常被迫在数据匮乏的情况下做出决策的科学；这催生了大量关于统计学、不确定性管理和分析的知识体系。然而，上游领域中的现代机器学习和高级数据分析技术仍处于起步阶段。\n\
    \n此外，拥有高级数据科学技能的个人可能并不熟悉石油和天然气行业的工程实践。\n\n缓解这一挑战的方法是培养精通两个领域的人才，并开展跨领域培训。\n\n\
    ![../images/480430_1_En_8_Chapter/480430_1_En_8_Fig2_HTML.jpg](img/480430_1_En_8_Fig2_HTML.jpg)\n\
    \n图 8-2\n\n石油和天然气行业采用机器学习和人工智能的障碍\n\n#### 缺乏机器学习和人工智能技能\n\n石油和天然气专业人员通常未接受过处理高级机器学习和人工智能技术的培训。正如历史上许多运营商和服务公司所见，只有一小部分专业人员选择通过自学来应对新技术的应用。机器学习和人工智能领域也不例外，只有少数人能理解此类技术的完整应用。\n\
    \n缺乏机器学习技能是一个关键障碍，它阻碍了组织充分利用其数据的价值。\n\n新劳动力的可用性低和适应性差加剧了行业的可持续性目标。年轻专业人员可能不具备应对即将到来的挑战所需的能力水平，并且需要较长时间进行培训。\n\
    \n在降低成本和人力压力的驱动下，需要招聘不同类型的员工，或者培养能够更充分利用人工智能应用的新型或新一代劳动力。\n\n#### 缺乏数字素养\n\n石油工程师和管理专业人员能够应对有限程度的数字知识。然而，当谈到机器学习和人工智能时，个人需要拥有更广泛的词汇量、对计算机更深入的理解以及数字系统知识。这涉及构建数字解决方案的通用知识，包括其所有组成部分：定义问题目标、用例、算法、工作流程、数据以及硬件和软件需求。\n\
    \n将机器学习和人工智能解决方案扩展到更广泛的基于用户的生产环境是一项更复杂的任务。我们相信，新兴一代将拥有更高的数字素养和吸收数字世界中更多数据的能力。\n\
    \n新一代将适应并要求更多数据驱动的应用。\n\n#### 对失业的焦虑\n\n从历史上看，所有工业革命都意味着劳动力需要适应其他技能要求。\n\n正如技能差距所揭示的那样，人们确实担心有一天机器会变得超级智能，由机器学习和人工智能主导的数字化转型将大规模地消除工作岗位。这进一步引发了人们对机器学习和人工智能应用的负面反应。\n\
    \n### 技术挑战\n\n在技术方面，一些障碍会随着时间推移而轻易消除，这包括获取机器学习资源（数据、软件和硬件）、缺乏数据使用的最佳实践以及 IT 环境的一致性。\n\
    \n#### 获取数据、软件和硬件资源\n\n石油和天然气行业可能缺乏在其大部分运营中运行高级数据分析所需的基础设施。数据通常位于无法被充分利用的地方（例如，在那些对如何使用数据知之甚少的现场作业中）。\n\
    \n网络安全限制也构成了障碍；它会导致项目延迟，直到企业 IT 人员完全理解数据操作工作流程。过于严格的 IT 策略会阻止用户协作和分享有关机器学习应用的知识。这些策略还会阻止用户下载和执行开源软件和编程语言，例如\
    \ R 和 Python。\n\n#### 数据收集和使用的最佳实践与标准\n\n尽管有大量用于机器学习和人工智能应用的开源资源，但对于数据的收集和使用，既没有既定的最佳实践，也没有标准的操作程序。\n"
- fmt: '#### Weak Alignment with Standard IT Environment


    Although many software resources are open source, the lack of corporate IT environment
    supporting machine learning and artificial intelligence applications has typically
    been a concern at the time of new initiatives.


    Although there is an increasing number of commercial solutions that allow an easy
    transition from innovation to a software development and production environment
    (`DevOps`), there is still a concern to interface with existing legacy applications
    and the need for sustaining the solution from an enterprise architecture point
    of view [[4](#480430_1_En_8_Chapter.xhtml#Par147)].


    ### Managing the Transition


    Managing change properly could make us winners. These transition elements include
    the proper identification of the use case, shaking the status-quo, providing context
    on why we should embrace it, letting go of power, and embedding the solutions
    in the existing business process.


    #### Poor Identification of Use Case


    Identifying the problem that the new solution is attempting to solve is a key
    step in any new application development project. Poor identification of the required
    use case may later destroy the efforts in machine learning application development
    and bring frustration to the team.


    #### Making the Change


    Being in the comfort zone makes it difficult for new applications to get into
    the marketplace and displace traditional applications. Shaking the status quo
    makes it harder for inventive applications to enter the mainstream.


    #### Psychological Factors: Why Should I Use It?


    A set of psychological factors influence any new technology adoption. These factors
    include rigid mindsets, risk aversion, early-adopter hesitance, lack of trust,
    not-invented-here attitude, jealousy, social norms, previous experiences, and
    organizational level factors, such as leadership and culture [[5](#480430_1_En_8_Chapter.xhtml#Par148)].


    Studies show that explicit propensity to trust and implicit attitude toward automation
    did not significantly correlate [[6](#480430_1_En_8_Chapter.xhtml#Par149)]. Therefore,
    considering the analogy with machine learning and artificial intelligence, a combination
    of the psychological factors prevents the adoption of new applications.


    #### Letting Go of Power


    Artificial intelligence applications use data in a more democratized way, including
    distributing data insights across the organization, which may jeopardize the power
    position of many individuals. Retaining control over specific datasets is common
    malpractice across industries.


    #### Embedding Change in the Normal Way of Doing Business


    One challenge is the management of change that these new applications may imply
    for the organization.


    The management of change is of two types: (1) a new machine learning application
    that is changing a process that is already in place, and it is just making it
    more effective; and (2) a new application that creates a brand-new process. In
    both cases, the identified use case should clearly define the business process
    and governance in which the new application delivers value.


    ### Commercial Barriers


    Organizations face barriers on the commercial side because of not leaving some
    space for innovation, lacking business acumen, and lacking a proper business model
    and market preparedness to create a win-win situation between vendors and customers.


    #### No Space for Innovation


    Operators are typically in charge of operation and maintenance budgets, and they
    are pressured to keep them low and within the targets. On the other side, operators
    may not have any incentive in developing a new application that would dramatically
    change their way of working. This hinders any opportunity for innovation on machine
    learning/artificial intelligence technology application, which may ultimately
    add value to the bottom line.


    #### Lack of Business Acumen


    There is no value-added case sufficiently strong to support the capital expenditure
    on new applications. Often, engineers and operators lack financial acumen to formulate
    a business case.


    In addition, it is difficult setting up proper success measurements or defining
    financial returns targets in terms of quantifiable production or revenue gains.


    In consequence, organizations may not be prepared with proper budget line items,
    which allows them to pursue a machine learning project.


    #### Business Models and Market Preparedness


    Because machine learning and artificial intelligence applications come as new
    market offerings, not all software vendors have a full grasp on how the business
    models for their tools/solutions should look like.


    This may include conversations about charging per seat vs. per asset basis, fixed
    fee vs. pro-bono basis, perpetual vs. leasing, transaction count vs. `CPU`/`GPU`
    count, volume discounts, and so forth.


    These conversations may create conflicts between technology vendors and customers,
    which may embark on long discussions, sometimes damaging relationships.


    ## Digital Transformation of the Oil and Gas Industry Enabled by Machine Learning
    and Artificial Intelligence


    Machine learning and artificial intelligence may enable the digital transformation
    of the oil and gas industry if various contributing factors become a reality,
    including more talented people in machine learning/artificial intelligence professions,
    expanded wellsite sensing capabilities, increased use of wearable devices, implementation
    of better regulations, and increased use of artificial intelligence tools in government
    organizations.


    ### People Skills


    There are places in the oil and gas industry where machines could not easily replace
    the human contribution. The future petroleum engineer, released from traditional
    mundane tasks, would need to focus more on creative work, including innovative
    porous media recovery mechanisms, ground-breaking business models for the role
    of hydrocarbon in society, new uses of environmentally friendly materials, cost-effective
    facility life extension options, and so on.


    #### The Talent Requirements for the Future


    In the future, the hydrocarbon industry, enabled by digitization, analytics, and
    AI, will demand a more complex and innovative mindset and skillset. This will
    enable the ingestion of analytic insights from multiple domains. Collectively,
    it could promise the offer of a safer and more profitable industry, with fewer
    working hours and better work and personal life balance for employees.


    In dealing with the digital world of today, energy professionals will carry a
    set of skills, including computing upgrades, system maintenance, and data manipulation
    that ranges from exploratory data analysis to programming of exception-based surveillance
    rules (see Figure [8-3](#480430_1_En_8_Chapter.xhtml#Fig3)).


    ![../images/480430_1_En_8_Chapter/480430_1_En_8_Fig3_HTML.jpg](images/480430_1_En_8_Chapter/480430_1_En_8_Fig3_HTML.jpg)


    Figure 8-3


    The digital geoscientist and petroleum engineer of the future


    ### Contributing Factors to Further Advancement of Machine Learning


    Several contributing technologies and legal frameworks may change dramatically
    the way machine learning and artificial intelligence are adopted in the oil and
    gas industry. These create additional opportunities for machine learning as well
    as open new paradigms in well and reservoir modeling and interpretation.


    #### Well and Reservoir Sensing Technologies


    Future increased availability of sensing technologies, including along- and beyond-the-wellbore
    acoustic and electromagnetic, will enable both saturation and pressure changes
    to be tracked in time and space. This shall open new challenging avenues for data
    analytics and AI.'
