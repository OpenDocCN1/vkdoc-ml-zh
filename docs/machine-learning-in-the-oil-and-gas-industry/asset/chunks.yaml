    ### 根本原因分析 (RCA)


    应用技术分析方法和诊断手段，以确定性能高于或低于预期的原因。目标是识别约束条件，例如液体产量是受油藏产能、油井生产潜力还是设施处理能力的限制。


    由于上一步（特征工程）中识别出的某些症状存在模糊性，RCA 的结果通常是概率性的，指出最可能的原因，同时也列出可能的替代原因。


    一种已知的根本原因识别方法是**贝叶斯网络**。一个用于确定井下泵性能下降最可能原因的例子，是通过贝叶斯网络模型来完成的，该模型考虑了观测数据和实时测量值。这些观测值可以是独立的（例如，泵排量和油藏压力），但也可以通过因果关系相关联（例如，井口压力和产量）。


    在这个例子中，关于泵、油藏、流体、测量到的液体下降速率和井口压力的信息，被用来确定最可能的原因是**气体吸入**；然而，这并不完全排除机械问题和可能的过度泵磨损（例如，由于泵内进入砂粒）。


    ### 推荐改进性能的措施


    一个高层次的油井“健康评分”可以根据油井传感器和其他测量数据中识别出的特征来计算。还可以计算其他评分来量化问题的严重程度（即问题评分）、油井修复或改进后的机会大小（即潜力评分）等。为一口井计算的所有评分汇总后得出一个最终评分。这个最终评分可以被视为健康评分；数值越小，表明该井出现严重问题的可能性越低。然后可以根据最终评分对油井进行排序，为日常运营提供优先级列表。


    对于生产系统中的每个要素（例如，每口井、每个设施），都可以获得计算得出的事件、条件和推荐措施。某个事件发生的可能性乘以该事件影响的严重程度（安全问题、产量损失、时间损失）的结果，就是该事件的评分。


    基于效用定义（例如，最大化产量、最小化损失、增加净现值、减少时间损失等），会提出决策建议来解决前序步骤中识别出的问题。该建议可能是概率性的。总体效用值是各种子效用的组合；因此，必须为每个组织甚至每个项目建立一个统一的评估体系，以便能够比较货币和非货币目标。


    ### 预测油井性能不佳


    预测油井性能不佳时遇到的挑战之一，源于在生产早期阶段，产量快速下降的迹象非常少。然而，通过使用无监督机器学习技术，例如聚类算法，有可能识别出那些在若干年后可能表现出石油产量下降的油井。一种基于聚类的方法如图
    7-8 所示。


    ![../images/480430_1_En_7_Chapter/480430_1_En_7_Fig8_HTML.jpg](img/480430_1_En_7_Fig8_HTML.jpg)


    图 7-8


    一种基于聚类的、用于识别未来产量下降可能性高的油井的方法论


    考虑许多油井在生产早期阶段（例如，最初的 24 个月）的日产量数据，用于计算这些油井的累计产油量。此外，通过使用所考虑时间段结束时该井的累计产量，将每口井的累计产油量归一化为
    1。然后，这两个累计产量图可以分别创建油井聚类。基于累计产油量的聚类，如图 7-9（左）所示，产生了三个不同的油井类别。


    ![../images/480430_1_En_7_Chapter/480430_1_En_7_Fig9_HTML.jpg](img/480430_1_En_7_Fig9_HTML.jpg)


    图 7-9


    累计产油量聚类（左）和归一化累计产量聚类（右）显示出不同的油井群组


    *   低累计产油量井（蓝色线）

    *   中累计产油量井（红色线）

    *   高累计产油量井（绿色线）


    同样，基于归一化累计产油量的聚类也显示了三个类别的油井（见图 7-9 右）。黑色虚线显示了每个时间点的聚类均值。观察聚类均值可以清楚地看到，这三个聚类代表了以下三种不同的生产趋势：


    *   产量递减（蓝色线），聚类均值斜率递减

    *   产量稳定（红色线），聚类均值斜率几乎恒定

    *   产量递增（绿色线），聚类均值斜率递增


    通过结合基于累计产油量和归一化累计产油量的聚类，识别出九个不同的油井类别，每个类别对应累计产油量和产量趋势类别的组合（例如，高累计产量—产量递增趋势，低累计产量—产量递减趋势等）。


    此外，从所分析的产量数据来看，相当数量的油井在五年或更长时间范围内出现了严重的产量下降。对于这九个类别中的每一个，通过考虑该类别中的油井总数以及未来出现严重产量下降的油井数量，计算了产量严重下降的概率。表
    7-2 总结了计算出的油井在未来五年内停产的概率。


    可以很容易地观察到，在本研究考虑的时间范围内，“高累计产量”聚类中的油井，无论它们属于哪个产量趋势类别，都没有显示出停产的可能性。


    表 7-2


    五年内停产井的概率


    | 产量趋势 → | 递减趋势 | 稳定趋势 | 递增趋势 |

    | --- | --- | --- | --- |

    | 累计产量 ↓ |

    | --- |

    | **低** | 0.258 | **0.308** | **0.357** |

    | **中** | 0.12 | 0.14 | 0.19 |

    | **高** | 0.000 | 0.000 | 0.000 |

    | 平均含水率与停产井概率相关系数：0.719563 |


    此外，在考虑的时间范围内，低累计产量且产量稳定或递增的类别中的油井，显示出显著更高的停产概率。基于这些观察，建议对于所研究的油田，应密切监测那些累计产油量低且产量稳定或递减的新井。根据最初
    24 个月的产量数据，属于这两个类别的油井应优先进行更频繁的监测活动和增产修井作业。


    *   输入数据：“Well_Monthly_Production.csv”

    *   输出：“油井停产的概率”

    *   Python 代码：“Chapter07_Well_Failure_Clustering_using_KMeans.ipynb”

    *   方法：k-means 聚类

