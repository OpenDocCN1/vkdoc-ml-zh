    #### 多项逻辑回归


    逻辑回归是一种分类技术，用于解决二分类问题。二分类相当简单：如果一个样本不属于某一类，则它必然属于另一类。逻辑回归使用 Sigmoid 函数（见图 3-21）。该函数在输入值发生微小变化时，其输出值会从
    0 急剧变化到 1。Sigmoid 函数的这一特性有助于对属于两个不同类别的样本数据进行分类。对于涉及两个以上类别的分类问题，*多项逻辑回归*是基本的多类分类算法之一。该算法使用*softmax*函数，其表达式如下：


    ![$$ {f}_{softmax}\left({z}^i\right)=\frac{e^{z_i}}{\sum \limits_{j=1}^k{e}^{z_j}},
    $$](img/480430_1_En_3_Chapter_TeX_Equ12.png)


    (3.12)


    其中，*k* 是多类分类问题中的类别数量，*i* 是当前针对输入 *z*^(*i*) 计算 softmax 函数的类别。Softmax 函数也会从 0 到
    1 发生非常迅速的变化，但它具备处理多个类别的能力。简单来说，softmax 函数提供了样本属于 *k* 个类别中任一类的概率。多项逻辑回归也称为*softmax
    回归*。以下代码片段展示了使用该算法进行多类分类的示例实现。


    ```

    from sklearn.linear_model import LogisticRegression

    clf_logreg = LogisticRegression()

    clf_logreg.fit(X_train, y_train)

    # 对测试数据进行预测

    y_pred_logreg = clf_logreg.predict(X_test)

    # 准确率指标

    clf_metrics(y_test, y_pred_logreg)

    ```


    **结果**


    ```

    Classification Accuracy Score: 0.6480938416422287

    Classification Report:

    precision    recall  f1-score   support

    F-MOUTHBAR       0.40      0.05      0.08        87

    F-TIDAL BAR       0.53      0.86      0.66       119

    F-TIDAL CHANNEL       0.82      0.85      0.84       135

    accuracy                           0.65       341

    macro avg       0.59      0.58      0.53       341

    weighted avg       0.61      0.65      0.58       341

    ```


    分类准确率的结果以分类报告的形式呈现，其中精确率、召回率和 F1 分数作为分类器预测能力的量化指标。该算法对 F-TIDAL CHANNEL 类别的预测精确率较高，但对样本数量较少的类别预测精确率不佳。


    需要注意的是，当数据集中某个类别的样本数量远多于其他类别时，某些分类器的表现可能不佳。在*样本不平衡*的情况下，对训练数据进行重采样以使各类别样本数量相等，可能有助于提高分类算法的精确率和准确率。


    #### 支持向量分类器


    之前，我们讨论了支持向量和核技巧。*支持向量分类器*使用了类似的概念。为了执行分类，该算法构建了最优超平面，以分离属于不同类别的样本。其二维等效表示可以看作是一条划分属于两个不同类别的点簇的直线。该算法使用一个正则化参数，该参数决定了分隔超平面的间隔（回顾
    *ϵ*）。结果表明，该算法无法有效识别样本数量较少的类别。


    ```

    from sklearn.svm import SVC

    clf_svc = SVC()

    clf_svc.fit(X_train, y_train)

    # 对测试数据进行预测

    y_pred_svc = clf_svc.predict(X_test)

    # 准确率指标

    clf_metrics(y_test, y_pred_svc)

    ```


    **结果**


    ```

    Classification Accuracy Score: 0.6217008797653959

    Classification Report:

    precision    recall  f1-score   support

    F-MOUTHBAR       0.00      0.00      0.00        87

    F-TIDAL BAR       0.50      0.87      0.64       119

    F-TIDAL CHANNEL       0.80      0.81      0.80       135

    accuracy                           0.62       341

    macro avg       0.43      0.56      0.48       341

    weighted avg       0.49      0.62      0.54       341

    ```


    #### 决策树分类器


    决策树分类器算法采用的方法与之前讨论的决策树回归类似。在回归算法中，预测是通过对样本所属的终端叶节点中的值取平均来生成的。而在分类问题中，属于某个终端树节点的所有样本都被归类为其中一个类别。


    在模型训练过程中，该算法试图最小化熵（随机性）并最大化信息增益。一个经过充分训练且无随机性的树，其任何给定终端叶节点中的所有样本都只属于一个样本类别。结果表明，尽管存在样本不平衡问题，该算法在不同岩性类别上仍能提供高精确率和准确率。


    ```

    from sklearn.tree import DecisionTreeClassifier

    clf_dt = DecisionTreeClassifier()

    clf_dt.fit(X_train, y_train)

    # 对测试数据进行预测

    y_pred_dt = clf_dt.predict(X_test)

    # 准确率指标

    clf_metrics(y_test, y_pred_dt)

    ```


    **结果**


    ```

    Classification Accuracy Score: 0.9853372434017595

    Classification Report :

    precision    recall  f1-score   support

    F-MOUTHBAR       0.98      0.98      0.98        87

    F-TIDAL BAR       0.99      0.97      0.98       119

    F-TIDAL CHANNEL       0.99      1.00      0.99       135

    accuracy                           0.99       341

    macro avg       0.98      0.98      0.98       341

    weighted avg       0.99      0.99      0.99       341

    ```


    #### 随机森林分类器


    随机森林分类器的工作原理与我们之前讨论的随机森林回归完全相同。唯一的区别在于，在分类算法中，会生长出一片由决策树分类器组成的森林，最终的预测是基于*投票*而非取平均值来生成的。


    在投票方法中，集成预测中出现频率最高的类别被选为最终输出。该算法还提供了预测样本属于任一类别概率的灵活性。选择这两种输出方法中的哪一种取决于具体问题。示例代码实现和分类结果表明，该算法提供的预测具有高精确率和准确率。


    ```

    from sklearn.ensemble import RandomForestClassifier

    clf_rf = RandomForestClassifier()

    clf_rf.fit(X_train, y_train)

    # 对测试数据进行预测

    y_pred_rf = clf_rf.predict(X_test)

    # 准确率指标

    clf_metrics(y_test, y_pred_rf)

    ```


    **结果**


