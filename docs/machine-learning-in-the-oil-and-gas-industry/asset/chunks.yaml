    ### Classification


    Classification is a subcategory of supervised learning, where output variables
    are discrete or categorical. For the example discussed in this chapter, `LITHOTYPE`
    is the only categorical variable, and hence is used as the output variable. The
    objective of the classification algorithms is to find function *f*, which can
    map the features to predict different lithotype categories accurately.


    ![$$ LITHOTYPE=f\Big( BVW, CARB\_ FLAG, COAL\_ FLAG, PHIF, RHOFL, RHOMA, RW, $$](images/480430_1_En_3_Chapter/480430_1_En_3_Chapter_TeX_Equb.png)


    ![$$ SAND\_ FLAG, SW, TEMP, VSH, KLOGH\Big). $$](images/480430_1_En_3_Chapter/480430_1_En_3_Chapter_TeX_Equ11.png)


