- fmt: '# Exploration and Appraisal


    Finding the exact location of oil and gas deposits under the earth’s surface is
    an activity as challenging as finding a needle in the haystack. Over the last
    century, scientific understanding of the earth’s subsurface structure has improved
    significantly. Geological surveys provide geological maps or models of the structure
    under the earth’s surface. In conjunction with geophysical surveys, these models
    help in generating a detailed understanding of subsurface structure.


    Geophysical surveys can be of various types, depending on the techniques used
    for the survey, such as magnetic, electromagnetic, gravimetric, and seismic surveys,
    and so forth. In recent years, seismic surveys have proven to be the most reliable
    in locating potential oil and gas deposits. Seismic surveys can be conducted onshore
    (land) or offshore (marine).


    Underlying principles of seismic imaging are similar to ultrasound imaging of
    the human body. The process of acquiring a seismic survey involves a source of
    acoustic energy. These sources can be large vibrator trucks on land and airguns
    in the case of a marine seismic. The acoustic waves reflected from different subsurface
    structures are received by geophones or hydrophones (very sensitive microphones)
    near the earth or water surface. 3D and 4D seismic surveys are among the most
    voluminous datasets in the oil and gas industry, sometimes reaching petabytes
    in size. The information from these seismic surveys helps identify subsurface
    structural features, and potential oil and gas deposits.


    Geologists have a detailed understanding of the earth’s depositional environment,
    which helps them understand how different rock layers (strata) are arranged under
    the earth’s surface. Geologists use their deep knowledge of basin and sequence
    stratigraphy, along with the information from the interpretation of seismic data,
    to pinpoint locations where oil can be found.


    Once potential locations of the petroleum reserves are identified with a certain
    level of confidence, the operating oil and gas company acquires a lease of the
    oil and gas block. Based on a combination of geophysical and geological understanding,
    exploratory wells (also called *wildcat wells*) are drilled to verify potential
    oil and gas reserve locations. If oil is found in the first wildcat well, reservoir
    engineers get involved in the field appraisal process.


    During this process, more appraisal wells are drilled around the original wildcat
    well. Different well logs and core logs are gathered from the exploration wells,
    which are further used for developing a more detailed understanding of the discovered
    oil and gas reserve.


    Geologists and petrophysicists use geological models along with the data from
    well logs to build detailed 3D reservoir models of physical properties in the
    region of interest, a process known as *petrophysical modeling*. Petrophysical
    properties, such as porosity (void fraction in the rocks, which can store or transport
    oil and gas), and oil and water saturation, are computed in the region of interest.
    These detailed petrophysical models help calculate a probabilistic estimate of
    the total available and recoverable volume of oil and gas in the discovered petroleum
    reservoir.


    # Field Development Planning


    Once exploration and appraisal activities are over, reservoir engineers and geoscientists
    (geologists, and geophysicists) come together to develop a detailed plan for further
    development of the oil and gas producing field. All the information and insight
    gained from the exploration and appraisal phase—including the detailed reservoir
    models—are taken into account. Decisions taken during this stage include identification
    of precise locations for drilling the wells, detailed design for optimal placement
    of the wells, design of well completion (including perforations and stimulation
    required).


    Facilities engineers, reservoir engineers, and production engineers also develop
    a detailed facility design required to process the oil and gas (e.g., separators
    to isolate oil, water, and gas). A field development plan also includes the strategy
    for transporting produced oil and gas to storage or processing facilities. Once
    the field development plan is approved, the process of constructing facilities,
    drilling wells, and completing them as per the specifications provided in the
    field development plan begins.


    # Drilling and Completion


    The process of drilling focuses on creating pathways for oil and gas to flow from
    the oil and gas reservoirs to the earth’s surface. Drilling is a high risk and
    high capital expenditure (CAPEX) operation. Rental fees and other related charges
    for a deepwater offshore drilling rig may be close to US $1 million per day. As
    a ballpark figure, a single offshore well may cost from US $100 million to $200
    million—or more in deep waters. The cost of drilling a well onshore (land) may
    range from US $5 million to $8 million [[4](#480430_1_En_1_Chapter.xhtml#Par133)].


    During drilling operations, a drill bit is attached to the lowest end of the drill
    string, which is a long column of sequentially attached drill pipes made of steel
    or aluminum alloy. The top end of the drill string is attached to a drive (a mechanical
    device), which provides torque to the drill string.


    As a result of this torque, the drill bit attached to the bottom of the drill
    string rotates and cuts through the rocks to create a wellbore. During the drilling
    operations, drilling mud is flown through the drill pipe to cool down the drill
    bit. Drilling mud also facilitates the removal of rock cuttings produced during
    the drilling process.


    During the process of drilling, the drill string is retrieved periodically, and
    the wellbore is stabilized by cementing and lining with casing. The casing is
    high strength hollow steel pipe, which in conjunction with cementing, strengthens
    the wellbore, and keeps wellbore from collapsing. In addition to providing structural
    strength, the casing also ensures that chemical fluids used during the drilling
    process don’t contaminate the nearby aquifers and groundwater sources.


    Following the cementing, and running casing in the wellbore, production tubings
    are run into the wellbore. Tubings are hollow corrosion-resistant stainless-steel
    pipes always smaller in diameter than the casing, which are held inside the casing
    through packing devices. Tubing provides oil and gas passage from the bottom of
    the well (bottomhole) to the surface and protects the casing from corrosion and
    other possible wear and tear.


    Once the casing and tubing are in place, perforations are created in the casing
    or casing and tubing to facilitate the flow of oil and gas from the reservoir
    rock into the wellbore. In addition to perforations, the completion activities
    may also include hydraulic fracturing and other production stimulation activities.


    During hydraulic fracturing, water is injected inside the wellbore at very high
    pressure. The high pressure creates fractures in the rocks and creates additional
    pathways for oil and gas to flow from the reservoir to the wellbore. Proppants
    are small diameter sand particles, which are used during the fracturing process
    to ensure that fractures remain open. Proppant movement is supported by diverter,
    which are chemical compounds to facilitate the flow of proppant particles from
    the wellbore to inside the fractures.


    Once all completion activities specified in the field development plan are completed,
    the well begins to produce oil and gas. It should be noted that activities mentioned
    in the last three pages may sometimes take five to ten years before the first
    drop of oil is produced from the well.'
