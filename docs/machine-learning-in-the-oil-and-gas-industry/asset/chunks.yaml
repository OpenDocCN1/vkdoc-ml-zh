    import numpy as np

    np.random.seed(seed_value) # Set Numpy random seed

    import tensorflow as tf

    tf.random.set_seed(seed_value) # Set TensorFlow random seed

    ```'
  trans: '

    ### 数据划分：训练集、验证集与测试集


    正如我们刚刚讨论的，过拟合是机器学习模型训练过程中遇到的主要挑战之一。这是由于模型学习了训练数据中的细微细节或噪声所致。在这种情况下，模型开始记忆训练数据。这会导致模型在训练数据上表现良好，但对于未见过的数据，其准确率会显著下降。为了解决过拟合问题并帮助模型更具*泛化*能力，划分数据集被视为一个必要步骤。根据经验法则，数据集通常被分为三个观测集：训练数据、验证数据和测试数据[6]，其定义如下。


    *   **训练数据：** 用于模型训练过程的观测子集。算法使用该数据集来学习机器学习模型的参数。


    *   **验证数据：** 一个观测子集，用于在训练过程中评估模型的预测性能。通过验证数据观察到的预测误差趋势，有助于确定充分训练所需的迭代次数。在典型的模型训练中，通过迭代训练过程，训练集和验证集的预测误差都应持续下降。然而，如果我们观察到某个点，训练数据的预测误差持续下降，但验证数据的预测误差开始上升，则应停止训练。验证误差开始上升的点，标志着过拟合的开始。


    *   **测试数据：** 该数据子集仅用于评估完全训练好的模型的性能。测试数据上的预测准确率，是模型在真实场景中遇到未见数据时性能的指标。


    以下代码片段展示了使用 scikit-learn 工具进行数据集划分的应用。


    ```

    from sklearn.model_selection import train_test_split

    X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42)

    ```


    ### 模型评估指标


    为了理解模型在未见数据集上的泛化程度，并评估其性能，使用一个可以据此评估模型性能的量化指标至关重要。


    在本节中，我们将讨论一些用于量化模型预测准确率的评估指标，并据此选择性能最佳的算法。这些指标也取决于问题的类型。对于回归模型中的定量结果，一些常用的指标包括决定系数（*R*²）和均方根误差（RMSE）。*R*²
    使用以下公式计算。


    ![$$ {R}²=1-\frac{S{S}_{res}}{S{S}_{tot}}. $$](img/480430_1_En_3_Chapter_TeX_Equ3.png)


    (3.3)


    *SS*[*res*] 是残差平方和，*SS*[*tot*] 是总平方和，其数学计算公式如下。


    ![$$ S{S}_{res}=\sum {\left({y}_i-{y}_{reg}\right)}², $$](img/480430_1_En_3_Chapter_TeX_Equ4.png)


    (3.4)


    ![$$ S{S}_{tot}=\sum {\left({y}_i-\overline{y}\right)}²\. $$](img/480430_1_En_3_Chapter_TeX_Equ5.png)


    (3.5)


    这里，*y*[*i*] 是每个数据点的值，![$$ \overline{y} $$](img/480430_1_En_3_Chapter_TeX_IEq1.png)
    是平均值，*y*[*reg*] 是回归模型预测的值。


    另一方面，RMSE 指标使用以下公式计算。


    ![$$ RMSE=\sqrt{\sum \limits_{i=1}^n\frac{{\left(\hat{y_i}-{y}_i\right)}²}{N}},
    $$](img/480430_1_En_3_Chapter_TeX_Equ6.png)


    (3.6)


    其中 ![$$ \hat{y_i} $$](img/480430_1_En_3_Chapter_TeX_IEq2.png) 是回归模型预测的值，*N* 是观测数量。


    对于分类问题，模型准确率定义为正确预测数量与总预测数量的比率。对于一个包含 *N* 个不同类别的分类问题，还会使用*混淆矩阵*或*误差矩阵*，它是一个 *N*×*N*
    的矩阵，主对角线上包含 *N* 个正确分类，其余可能的错误位于非对角线元素上。该矩阵提供了一种可视化方法来评估机器学习模型在分类问题上的性能。图 3-1 展示了二分类（两个类别）混淆矩阵的示例。


    ![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig1_HTML.jpg](img/480430_1_En_3_Fig1_HTML.jpg)


    图 3-1


    混淆矩阵示意图，其中 P = 正类，N = 负类，TP = 真正例；FP = 假正例；TN = 真负例；FN = 假负例


    基于该矩阵，可以确定一些准确率指标，包括精确率、召回率和 F1 分数。


    #### 精确率


    精确率定义为对于给定类别，真正例（正确预测）样本数量与预测为该类别的总样本数量的比率。高精确率输出表明，在模型预测属于给定类别的样本中，大多数样本确实属于该类。


    ![$$ Precision=\frac{True\ Positive}{True\ Positive+ False\ Positive}. $$](img/480430_1_En_3_Chapter_TeX_Equ7.png)


    (3.7)


    #### 召回率


    召回率定义为真正例样本数量与属于该类别的总样本数量的比率。高召回率表明，属于给定类别的样本中，被错误分类为其他类别的样本非常少。


    ![$$ Recall=\frac{True\ Positive}{True\ Positive+ False\ Negative}. $$](img/480430_1_En_3_Chapter_TeX_Equ8.png)


    (3.8)


    #### F1 分数


    F1 分数提供了精确率和召回率的调和平均值。在模型选择过程中，会在多个分类算法中选择具有最高 F1 分数的模型。


    ![$$ F1=2\times \frac{Precision\times Recall}{Precision+ Recall}. $$](img/480430_1_En_3_Chapter_TeX_Equ9.png)


    (3.9)


    ### 可复现的机器学习


    机器学习算法为一系列工业相关问题提供了比传统方法更好的预测能力。然而，对于工业应用而言，确保模型训练和模型生成的预测结果能够完全复现至关重要。有时，即使使用相同的数据集和相同的算法，也可能难以复现结果并获得相同的性能。


    这些差异可归因于多种原因，例如权重的随机初始化、数据集的随机打乱以及多种机器学习算法的随机性。为了解决这个问题，在机器学习算法实现中仔细设置*随机种子*，可以让我们向实现可复现性迈进一步。以下代码片段展示了为操作系统环境变量、Python
    随机模块、NumPy 和 TensorFlow 设置随机种子的一些示例。


    ```

    seed_value = 42

    # 使用环境变量设置 Python 随机种子

    os.environ[''PYTHONHASHSEED'']=str(seed_value)

    import random

    # 使用 Python 随机模块设置 Python 随机种子

    random.seed(seed_value)

    import numpy as np

    np.random.seed(seed_value) # 设置 Numpy 随机种子

    import tensorflow as tf

    tf.random.set_seed(seed_value) # 设置 TensorFlow 随机种子

    ```

    '
- fmt: '### Bagging vs. Boosting


    So far, we have discussed the selection of a single machine learning model to
    provide optimum and reproducible performance. However, in real-world scenarios,
    a single model based on an algorithm may not be able to provide the best solution.
    *Ensemble learning* was introduced to address this challenge; it happens when
    multiple machine learning models are trained using the same algorithm to provide
    a more powerful and robust predictive model.


    The idea is to combine multiple weak learners to create a strong learning ensemble,
    which can provide higher accuracy than a single machine learning model. Bagging
    and boosting are two of the most common techniques in this category. They help
    with reducing noise, variance (i.e., avoiding overfitting), or bias (i.e., avoiding
    underfitting). Before defining these concepts, it is important to understand *bootstrapping*,
    which is a resampling technique used in statistics. During bootstrapping, several
    samples are drawn randomly from a provided dataset with a replacement. A bootstrap
    can quantify the uncertainty associated with a statistical learning method [[7](#480430_1_En_3_Chapter.xhtml#Par233)].


    *Bagging* is the short form of *bootstrap aggregation*. While encountering high
    variance (overfitting) in some machine learning algorithms, such as decision trees,
    bagging is extremely useful where homogenous weak learners (i.e., models with
    poor performance) are combined by training them in parallel, and a prediction
    is provided through an averaging (regression) or voting (classification) process.
    This process leads to a more robust model, as well as reduces the chances of overfitting.


    *Boosting*, on the other hand, learns from an ensemble of homogenous weak learners,
    but sequentially and adaptively. This approach tries to minimize the bias (underfitting)
    by training a model based on a previously trained model with poor performance,
    as opposed to reducing variance (overfitting) in bagging. In other words, bagging
    uses an equally-weighted average for generating predictions, while boosting uses
    a composite of multiple learners to provide a model with better performance.


    ### Model Interpretability


    In the field of statistics and machine learning, it is well known that an overly
    complex model might not always be the optimum solution to a problem. This is primarily
    because of the loss of model interpretability, as the model gets more complex.
    Interpretability is critical for many industries, where the model output is required
    to be explained, and model inference is the priority. For example, in a deep neural
    network with multiple layers and multiple neurons, it might be difficult to explain
    the effect of a specific input feature on the output.


    This contrasts with a decision-tree based approach, or an even simpler linear
    regression model, where changes to a parameter are directly mapped to changes
    in the output variable. A significant amount of effort is devoted to better understand
    complex machine learning algorithms; however, it remains an area of ongoing research.


    ## Exploratory Data Analysis (EDA)


    In a real-world scenario, data is usually never available in a perfect format,
    ready to be fed to a machine learning model. The first step for a machine learning
    project involves carrying out an exploratory data analysis (EDA), which includes
    steps to detect inconsistencies, check assumptions, determine relationships among
    explanatory variables, as well as understand the relationship between features
    [[8](#480430_1_En_3_Chapter.xhtml#Par234)].


    Exploratory data analysis is a critical process in understanding and preparing
    data for a machine learning model. Some of the steps in EDA include variable identification,
    univariate and bivariate analysis, treatment of missing values, removal of outliers,
    and transformation or creation of additional variables. The purpose of EDA lies
    in better understanding the data and its assumptions, improving its quality, and
    generating hypotheses of the analysis by finding clues about the tendencies of
    the data [[9](#480430_1_En_3_Chapter.xhtml#Par235)]. This involves using summary
    statistics and visualization techniques to answer questions about the provided
    data.


    A brief exploratory analysis for the oil and gas data used in Chapter [2](#480430_1_En_2_Chapter.xhtml)
    is performed in this section. We continue the analysis from the previous chapter,
    where the data from the two wells were merged. The merged dataset is used as an
    input, and a dataframe is generated to perform EDA. The following code output
    shows the size of a merged dataframe.


    ```

    Shape of the dataset (rows, columns): (5127, 15)

    ```


    The dataframe consists of multiple NA values, as shown in Figure [3-2](#480430_1_En_3_Chapter.xhtml#Fig2),
    which are required to be removed for cleaning the dataset. As observed from the
    figure, there are multiple columns with 236 missing values across multiple features,
    which need to be treated. In this case, instead of imputation (i.e., replacing
    missing values), the values are dropped since the NA occurs for the same set of
    data points. Once NA values are removed from the dataset, the new shape of the
    dataframe becomes the following.


    ![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig2_HTML.jpg](images/480430_1_En_3_Chapter/480430_1_En_3_Fig2_HTML.jpg)


    Figure 3-2


    Histogram of missing or NA values in the dataset


    ```

    Shape of the dataset (rows, columns): (4818, 15)

    ```


    The next step is to investigate the descriptive statistics of the features in
    the dataset. Figure [3-3](#480430_1_En_3_Chapter.xhtml#Fig3) shows descriptive
    statistics of the dataframe.


    ![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig3_HTML.jpg](images/480430_1_En_3_Chapter/480430_1_En_3_Fig3_HTML.jpg)


    Figure 3-3


    Descriptive statistics of the dataframe


    The next step is to look for the distribution of features. In Figure [3-4](#480430_1_En_3_Chapter.xhtml#Fig4),
    some of the features are shown as an example. `VSH (V/V)` is one of the features,
    which displays skewness, possibly due to the occurrence of a wider range of less
    frequent values or occurrence of an outlier. A simple way to observe the presence
    of outliers is through a box plot. Figure [3-5](#480430_1_En_3_Chapter.xhtml#Fig5)
    shows an example of a box plot for the same set of features. Again, looking into
    the feature `VSH (V/V)`, you can see that a few points lie much farther outside
    the upper quartile range. In this section, the outlier analysis is not covered.
    However, you may take an additional filtering step to remove any existing outliers
    from the data.


    ![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig5_HTML.jpg](images/480430_1_En_3_Chapter/480430_1_En_3_Fig5_HTML.jpg)


    Figure 3-5


    Box plots of features in the dataset to identify the presence of outliers


    ![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig4_HTML.jpg](images/480430_1_En_3_Chapter/480430_1_En_3_Fig4_HTML.jpg)


    Figure 3-4


    Distribution of certain features in the dataset with multimodal and skewed behavior'
