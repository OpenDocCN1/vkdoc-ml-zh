    ### Tuples


    Enclosed within curved brackets (`()`), tuples are very similar to a list, with
    a primary difference being their immutable nature (unchangeable). Tuples usually
    contain a heterogeneous sequence of elements accessed via unpacking or indexing.
    The elements are ordered and separated by a comma, just like a list. Elements
    are accessed in the same way as a list and the indexing starts with 0 as well.
    Similar to lists, negative indexes can access the elements of a tuple where the
    last element has an index of –1, the second last is –2, and so on. Some of the
    methods available for a tuple include `count()` and `index()`. Advantages of using
    a tuple instead of a list include fast execution compared to an equivalent list
    as well as situations where we do not want the data to be modified.


    ```

