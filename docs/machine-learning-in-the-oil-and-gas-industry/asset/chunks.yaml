  trans: "\n### 流程挑战与缓解措施\n\n以下重点列出了与流程相关的主要挑战及建议的缓解方案。\n\n*   **挑战**：企业持续面临提升盈利能力的压力，主要通过减少人力资源来降低成本，但这导致工作时间比平时更长，工作场所的安全性降低。未来一代将不得不以更少的资源完成更多的工作，从而在单位时间内产生更多成果，并降低单位成本。\n\
    \n    **缓解措施**\n    *   使用机器人化操作实现钻井现场作业自动化，并利用高级数据分析进行事件检测，重点关注异常关键事件（例如，卡钻和井漏）。\n\
    \n    *   实现生产监控自动化，增加对井场参数的持续数据分析，同时通过基于异常的监控（EBS）实现常规油井分析，重点关注关键井况。\n\n    *\
    \   实施油井和油藏性能分析，以主动识别机会，同时专注于高附加值活动 [2]。\n\n    *   通过自动化的常规操作建议，实现人工智能辅助的复杂决策。\n\
    \n*   **挑战**：管理停机时间。油气产能的一个关键组成部分是设施需要关闭的时间以及无法达到预期产能的情况。一个关键挑战是尽可能将这些时间段保持得低且可预测。意外、计划外的停机时间可能会显著增加单位运营成本。\n\
    \n    **缓解措施**\n    *   实施数据分析和业务流程，以预测意外事件、跟踪停机时间、产量损失（即*产量延迟*），以及计划内与计划外停机的原因。\n\
    \n    *   实施事件分类，以便对所有计划外停机事件进行根本原因分析（RCA）。\n\n*   **挑战**：业务流程脱节，以及由于“筒仓思维”带来的挑战，导致职能组织设计困难。对于一些综合性的油气公司，关键业务流程通常在跨职能以及职能内部之间脱节。\n\
    \n    **缓解措施**\n    *   实施跨职能的关键绩效指标（KPI），并使用业务分析仪表板在组织的多个层级共享这些指标。\n\n    * \
    \  定义跨职能共享的关键角色和职责，并进行共享。\n\n*   **挑战**：在上游层面，生产运营、油藏管理、油田开发和钻井通常是相互脱节的职能。这阻碍了对提升业务绩效机会的全局优化。是修复一口高含水井更好，还是钻一口新的泄油井更好？\n\
    \n    **缓解措施**\n    *   实施一个集成的油井性能提升机会识别与排序流程，该流程涉及多目标约束下的全局优化目标函数，兼顾短期和长期目标。\n\
    \n    *   基于集成的、符合物理原理的方法，利用深度学习实现更快、更可靠的预测。\n\n*   **挑战**：在公司层面，上游和下游有着截然不同的关键绩效指标（KPI）。尽管原油销售利润更高，但增加收入的潜力通常受市场规模限制；因此，增加利润的选择是在不损害上游义务的前提下，最大化下游产品的收入。\n\
    \n    **缓解措施**\n    *   实施公司层面的计划和排程流程，该流程涉及多目标约束下的全局优化，兼顾短期和长期目标。这包括使用无梯度方法和先进的进化优化技术。\n\
    \n### 人员挑战与缓解措施\n\n以下重点列出了与人员相关的主要挑战及建议的缓解方案。\n\n*   **挑战**：新劳动力的可用性低且素质不足，加剧了可持续性目标的实现难度。年轻专业人员可能不具备应对即将到来的挑战所需的能力水平，并且需要很长时间才能得到培训。\n\
    \n    **缓解措施**\n    *   在本科和研究生课程中纳入混合型学术大纲。\n\n    *   提供公共数据集，使学生和研究界能够熟悉典型数据集，为行业设定标准分析和机器学习问题的期望。\n\
    \n    *   实施*企业文档管理*（EDM）和利用*自然语言处理*（NLP）的知识搜索，通过更好的技术信息共享和知识利用来优化资源利用。\n\n  \
    \  *   实施机器人工程师助手：支持 NLP 和语音识别的聊天机器人，可访问大型知识库。\n\n    *   更快地教育新一代掌握最重要的内容（例如，创建侧重于机器学习和数据分析的本科油气项目）。\n\
    \n*   **挑战**：地下学科与数字学科之间的分离。通常，大多数工程和地质学科，特别是那些拥有最丰富油田经验的人员，缺乏解决涉及数据和流程自动化问题的数字化导向。\n\
    \n    **缓解措施**\n    *   为新员工实施短期在职培训项目，涵盖油气行业中机器学习和人工智能的关键方面。\n\n    *   促进技术与数字专业之间的交叉任职项目。\n\
    \n*   **挑战**：管理跨多学科团队和组织中的“筒仓思维”是各行业长期存在的挑战 [3]。在这种情况下，个人和团队缺乏共同目标，阻碍了他们共享关键数据和信息。这种心态最终会影响效率和员工士气。\n\
    \n    **缓解措施**\n    *   实施协作项目管理，使正在进行的工作具有可见性。\n\n    *   奖励团队合作，支持那些提出新想法的人、分享经验教训的人，以及保护和分享知识的人。\n\
    \n    *   提供知识共享和思想培育的环境。\n\n*   **挑战**：管理计划外和临时性工作，需要人员偏离其原有职责，从而影响公司目标的实现。如果这成为常态，则表明职能设计有误和/或可用（人力）资源在数量和质量上不足。\n\
    \n    **缓解措施**\n    *   实施数据分析和业务流程，以跟踪临时性工作以及计划内与计划外停机的原因。\n"
- fmt: "### Technology Challenges and Mitigations\n\nThe following highlights the\
    \ most relevant technology challenges and suggested mitigating options.\n\n- **Challenge**:\
    \ Requirement to continuously manage (monitor, optimize, and control) asset performance.\
    \ Oil and gas production requires a continuous understanding of the reservoir,\
    \ wells, and facilities; however, these need to be achieved with a limited amount\
    \ of resources, which are only able to see a fraction of the operation. This is\
    \ due to a lack of sensors and technologies that allow an in-depth view of the\
    \ process state.\n\n    **Mitigation Options**\n    - Implement data analytics\
    \ and business processes to automate asset *exception-based surveillance* (`EBS`),\
    \ focusing on critical well status.\n    - Implement machine learning models to\
    \ continuously search for optimum asset operating envelope, considering uncertainty.\n\
    \    - Implement an automated AI-assisted complex decision-making engine with\
    \ an automated routine-action recommendation.\n\n- **Challenge**: Demonstrating\
    \ a commitment to environmental concerns while providing a maximum return to shareholders.\n\
    \n    **Mitigation Options**\n    - Enable routine HSE inspections with permanent\
    \ instrumentation processing, video surveillance with digital image processing\
    \ including drone and satellite images, and robotics with human interactions,\
    \ focusing on critical events.\n    - Implement analytics processes that involve\
    \ multi-objective constrained optimization objective functions looking at better\
    \ fuels and profitable products.\n\n- **Challenge**: Delivering a safer workplace\
    \ with less human-intensive actions and decision-making processes. Enable operations\
    \ and processes run 24/7 with very high availability, reducing human-power requirements.\n\
    \n    **Mitigation Options**\n    - Automate production monitoring and oilfield\
    \ operations.\n    - Enable routine HSE inspections including the use of connected\
    \ wearable safety devices in critical areas.\n    - Enable autonomous and remote\
    \ control of routine actions: choke, gas-lift, frequency, and so forth.\n\n##\
    \ Barriers to Adopting Machine Learning\n\nThese barriers may come into play before,\
    \ during, and after any machine learning and artificial intelligence project execution\
    \ (see Figure [8-2](#480430_1_En_8_Chapter.xhtml#Fig2)). These barriers, when\
    \ properly identified, will be mitigated as they jeopardize sustainability and\
    \ may kill the idea at any point in the project execution. They have been captured\
    \ from experience and various references across the literature.\n\n### Knowledge\
    \ and Skills Gaps\n\nUnderstanding gaps in people skills is paramount for sustainable\
    \ implementations of machine learning and artificial intelligence solutions. Multidisciplinary\
    \ knowledge gaps, lack of machine learning and artificial intelligence skills,\
    \ digital literacy, and anxieties over job elimination are some of the barriers\
    \ to the broader adoption of these technologies in the industry.\n\n#### The Knowledge\
    \ Gap Between Data Scientists and Petroleum Engineers\n\nPetroleum engineering\
    \ is a science that is often forced to make decisions in the presence of little\
    \ data availability; this has created a large body of knowledge for statistics,\
    \ uncertainty management, and analytics. However, modern machine learning and\
    \ advanced data analytics techniques in upstream are in their infancy stages.\n\
    \nIn addition, individuals with advanced data science skills may not be well conversant\
    \ with the engineering practices of the oil and gas industry.\n\nThe way to mitigate\
    \ this challenge is to have people who are knowledgeable in both domains and pursue\
    \ cross-domain training.\n\n![../images/480430_1_En_8_Chapter/480430_1_En_8_Fig2_HTML.jpg](images/480430_1_En_8_Chapter/480430_1_En_8_Fig2_HTML.jpg)\n\
    \nFigure 8-2\n\nBarriers to adopting machine learning and artificial intelligence\
    \ in the oil and gas industry\n\n#### Lack of Machine Learning and Artificial\
    \ Intelligence Skills\n\nOil and gas professionals are not conventionally trained\
    \ to handle advanced machine learning and artificial intelligence technologies.\
    \ As it is seen historically in many operators and services companies, a small\
    \ fraction of professionals opt to get self-trained to address the application\
    \ of new technologies. This is no different in machine learning and artificial\
    \ intelligence, where only a few can understand the full application of such techniques.\n\
    \nLack of machine-learning skills is a key obstacle, and it impedes organizations\
    \ to fully exploit the value of their data.\n\nLow availability and poor adequacy\
    \ of the new workforce intensify industry sustainability goals. Young professionals\
    \ may not have the required level of competencies to address the impending challenges\
    \ and require long times to get trained.\n\nWith the pressure to reduce cost and\
    \ manpower, there is a need for recruiting different types of employees or a new\
    \ type or generation of the workforce that makes greater use of artificial intelligence\
    \ applications.\n\n#### Lack of Digital Literacy\n\nPetroleum engineers and management\
    \ professionals can cope with a limited amount of digital knowledge. However,\
    \ when talking about machine learning and artificial intelligence, individuals\
    \ need to have a broader vocabulary, a deeper understanding of computers and knowledge\
    \ of digital systems. This involves general knowledge on how to build a digital\
    \ solution including all its components: defining the problem objectives, use\
    \ cases, algorithm, workflow, data, and hardware and software requirements.\n\n\
    Scaling machine learning and artificial intelligence solutions to a wider user-based\
    \ production environment is a more complex task. We believe that emerging generations\
    \ will have more digital literacy and abilities to absorb more data in the digital\
    \ world.\n\nNew generations will adapt to and request more data-driven applications.\n\
    \n#### Anxieties of Job Elimination\n\nHistorically, all industrial revolutions\
    \ have implied some form of workforce adaptation to other skill requirements.\n\
    \nAs identified by the skills gap, there is a genuine concern that someday machines\
    \ will get super-smart and that digital transformation lead by machine learning\
    \ and artificial intelligence will massively eliminate jobs. This further creates\
    \ a negative response toward machine learning and artificial intelligence applications.\n\
    \n### Technical Challenges\n\nOn the technical side, some obstacles can be easily\
    \ removed with time, which includes access to machine learning resources (data,\
    \ software, and hardware), lack of best practices for data use, and IT environment\
    \ alignment.\n\n#### Access to Data, Software, and Hardware Resources\n\nThe oil\
    \ and gas industry may not have the infrastructure needed to run advanced data\
    \ analytics in most of its operations. Data is typically located in the places\
    \ where it is not leveraged (i.e., in the field operations where there is little\
    \ knowledge about how to use data).\n\nCybersecurity constraints also pose an\
    \ obstacle; it brings project delays until data manipulation workflows are fully\
    \ understood by corporate IT personnel. Too restrictive IT policies prevent users\
    \ from collaborating and sharing knowledge about machine learning applications.\
    \ These policies also block users from downloading and executing open source software\
    \ and programming languages, such as `R` and `Python`.\n\n#### Best Practice and\
    \ Standards for Data Collection and Use\n\nAlthough there are numerous open source\
    \ resources for machine learning and artificial intelligence applications, there\
    \ is no established best practice nor standard operating procedure for gathering\
    \ and using data."
