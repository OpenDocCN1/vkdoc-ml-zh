    *   该模型使用`Adadelta`优化器，该优化器采用具有自适应学习率的随机梯度下降方法。虽然其他一些优化器需要预定义学习率，但`Adadelta`优化器会自适应地计算学习率。该优化器使用`sparse_categorical_crossentropy`作为损失函数，这是之前讨论的分类交叉熵在每种对象只能属于样本类别中一个类别的情况下的变体。


    以下代码片段用于训练上述 MLP 模型。


    ```

    # 使用验证集进行早停的回调

    earlystop_callback = EarlyStopping(monitor=''val_accuracy'',

    min_delta=0.0001, patience=50)

    # 保存最佳模型

    ckpt_path = ''./models/dnn.h5''

    ckpt_callback = ModelCheckpoint(filepath=ckpt_path, mode="max",

    monitor=''val_accuracy'', verbose=1,

    save_best_only=True)

    # 训练模型

