    $$](img/480430_1_En_5_Chapter_TeX_Equ4.png)


    (5.4)


    在公式 5.4 中，*l*[*x*]、*l*[*y*] 和 *l*[*z*] 分别表示 *x*、*y* 和 *z* 方向上的长度尺度或变差函数变程。此外，`GaussianProcessRegressor`
    的 scikit-learn 实现提供了一个超参数 `alpha`，它代表图 5-1 中变差函数模型的块金方差（*n*）。需要注意的是，这里讨论的方法假设样本均值为零。这可以通过在
    scikit-learn 中使用 `StandardScaler` 来实现。清单 5-2 展示了使用 `GaussianProcessRegressor`
    对 *permx* 进行插值的实现。


    ```

    from sklearn.preprocessing import StandardScaler

    from sklearn.gaussian_process import GaussianProcessRegressor

    from sklearn.gaussian_process.kernels import RBF

    x_scaler = StandardScaler()

    X_scaled = x_scaler.fit_transform(X)

    y_scaler = StandardScaler()

    y_scaled = y_scaler.fit_transform(np.array(y).reshape(-1, 1))

    kernel = RBF([5.e-1, 5.e-3, 5.e-3], (1.e-3, 1.e0))

    gpr = GaussianProcessRegressor(kernel=kernel,

    alpha=0.75,

    n_restarts_optimizer=10,

    normalize_y=False,

    random_state=12345)

    y_scaled = y_scaled.flatten()

    gpr.fit(X_scaled, y_scaled)

    pred, sigma = gpr.predict(X_scaled, return_std=True)

    pred = y_scaler.inverse_transform(pred.reshape(1, -1))

    print(''GPR Fit Score: %f'' % gpr.score(X_scaled, y_scaled))

    GPR Fit Score: 0.708586653049732

    清单 5-2

    用于远离井点属性值估计的高斯过程回归代码片段

    ```


    在代码示例中，我们将数据转换为具有零均值和单位方差。具有单位方差也有助于我们选择 `alpha` 参数作为样本方差的一个分数。较小的 `alpha` 值会使数据在井点位置拟合得非常好，从而获得更高的拟合分数。您可以尝试使用不同的
    `alpha` 值，观察拟合分数和整体预测结果如何变化。


    代码中的 RBF 核具有三个长度尺度，这表明正在使用各向异性核（变差函数）。在长度尺度列表之后，RBF 核中的参数是一个元组，定义了长度尺度的上限和下限。在训练过程中，优化算法会在定义的上限和下限范围内选择最佳拟合的长度尺度。使用清单
    5-2 中生成的模型，可以预测井点位置的 *permx* 值。如图 5-5 所示，这些估计值的方差较低。


    此外，还使用训练好的模型预测了 SPE 5 模型所有网格单元中的 *permx* 值。图 5-6 显示了估计的均值预测及其对应的方差。可以观察到，井点附近的估计值方差较低。随着我们远离井点，得到的预测值和方差等于根据导出的测井曲线数据计算出的均值和方差值，如表
    5-2 所示。根据图 5-4 中观察到的变差函数模型，我们预期会出现这种情况，其中块金方差与基台值相比显著，表明导出的测井曲线数据相关性较低。


    ![../images/480430_1_En_5_Chapter/480430_1_En_5_Fig6_HTML.jpg](img/480430_1_En_5_Fig6_HTML.jpg)


    图 5-6


    使用训练好的高斯过程回归模型 (a) 预测所有 SPE 9 网格单元的 permx 值及 (b) 对应的估计方差


    ![../images/480430_1_En_5_Chapter/480430_1_En_5_Fig5_HTML.jpg](img/480430_1_En_5_Fig5_HTML.jpg)


    图 5-5


    使用高斯过程回归 (a) 预测 SPE 9 井点位置的 permx 值及 (b) 对应的估计方差

