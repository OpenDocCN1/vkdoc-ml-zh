    ### Random Forest Regression


    A *random forest* is an algorithm based on an ensemble of decision trees. This
    algorithm applies bagging, which was discussed earlier in this chapter. A random
    forest algorithm applies bagging to both the input features and the training data.
    This means that for each decision tree grown in a random forest model, a subset
    of input features, and the training data is randomly selected to train that decision
    tree. The algorithm trains multiple decision trees in parallel.


    The decision tree algorithm suffers from the problem of overfitting. This happens
    due to the use of a single tree, which almost memorizes the entire training data
    and fails to generalize. However, with the bagging of features and training data,
    this problem of overfitting is addressed in the random forest algorithm, which
    can provide a robust predictive model. The results obtained from the random forest
    regression show better prediction accuracy than the previously discussed algorithms.
    This observation can be verified by looking at the plots in Figure [3-13](#480430_1_En_3_Chapter.xhtml#Fig13).
    A sample code implementation is shown here.


    ```

    # Random Forest – Regression

    from sklearn.ensemble import RandomForestRegressor

    rf_reg = RandomForestRegressor(random_state=42)

    rf_reg.fit(X_train, y_train)

    # Prediction on test data

    y_pred_rf = rf_reg.predict(X_test)

