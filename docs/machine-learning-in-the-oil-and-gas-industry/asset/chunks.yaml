    #### 支持向量回归


    支持向量回归基于支持向量机。该方法通过允许一定的误差范围对每个数据点执行回归。对于每个数据点 *y*，预测值落在 (*y* + *ϵ*) 到 (*y* -
    *ϵ*) 的范围内都是可以接受的。在图 3-9 中，误差范围 *ϵ* 由两个支持向量描绘，并允许模型调优的灵活性。


    ![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig9_HTML.jpg](img/480430_1_En_3_Fig9_HTML.jpg)


    图 3-9


    描绘带有误差范围 *ϵ* 的支持向量的示意图


    除了误差范围，该算法还利用了*核技巧*。核技巧将非线性的低维空间投影到高维空间。在高维空间中，可以将原始的非线性问题表示为线性问题。scikit-learn
    中有多种核函数可用于支持向量回归的实现，包括 `''linear''`、`''sigmoid''`、`''rbf''` 和 `''polynomial''`。


    由于数据集中存在非线性，本例选择了径向基函数（`''rbf''`）核，也称为*高斯核*。以下代码片段展示了一个示例实现。


    ```

    # Support Vector Regression (SVR)

    from sklearn.svm import SVR

    svr_reg = SVR(kernel=''rbf'', C=100, gamma=0.1, epsilon=.1)

    svr_reg.fit(X_train, y_train)

    # Prediction on test data

    y_pred_svr = svr_reg.predict(X_test)

