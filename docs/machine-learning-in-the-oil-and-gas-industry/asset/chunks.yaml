- fmt: '# Basic Object-Oriented Programming


    While working on a project, often, situations are encountered where a block of
    code is required to be executed in a repeated manner with different arguments.
    The code is organized in much more reusable pieces, which are known as *functions*.
    In Python, they could be created by using `def` or `lambda` statements. An example
    of where a function can convert units is shown next. Every time we need to convert
    the units again, we can simply call the function and pass the new argument.


    ```

    # function to convert units for mud weight

    def unit_conversion(a):

    """

    This function is used to convert units of mud weight.

    Input: Mud Weight in kg/m3

    Output: Mud Weight in ppg or psi/ft or specific gravity

    """

    print(''The entered mud weight in kg/m3 is:'', a)

    mw_ppg = a * 0.0083454

    mw_psift = a * 0.000434

    sp_gravity = a * 0.001

    print(''Mud Weight in ppg:'', mw_ppg)

    print(''Mud Weight in psi/ft:'', mw_psift)

    print(''Specific Gravity:'', sp_gravity)

    # enter the input for mud weight in kg/m3

    mud_weight = 1250

    unit_conversion(mud_weight)

    ```


    *Output*


    ```

    The entered mud weight in kg/m3 is: 1250

    Mud Weight in ppg: 10.43175

    Mud Weight in psi/ft: 0.5425

    Specific Gravity: 1.25

    ```


    When we are using only functions as blocks of statements within code, it is called
    a procedure-oriented way of programming. However, there is another way of writing
    more complicated and organized programs, commonly known as *object-oriented programming*
    (OOP). Data and functionality (i.e., properties and behavior) are wrapped inside
    a class and object, which are the two main aspects of OOP. A class creates user-defined
    data structures with information related to a particular characteristic. It can
    be thought of as a blueprint that can be filled out with different instances.
    Different objects are created within a class that contains attributes. An example
    of a simple class is shown next. The example illustrates how a “well” can be a
    class with its API number, Basin, and Production as attributes. For a more detailed
    description of classes, we recommended that you refer to [[11](#480430_1_En_2_Chapter.xhtml#Par143)].


    ```

    class well():

    # class attribute

    well_type = ''oil well''

    # initializer

    def __init__(self, api, basin, oil_prod, gas_prod):

    self.api = api

    self.basin = basin

    self.oil_prod = oil_prod # BBL

    self.gas_prod = gas_prod # MCF

    # instance method

    def boe_calc(self):

    boe = self.oil_prod + self.gas_prod/5.8

    return boe

    # instantiating the class

    well_1 = well(12345, ''Williston'', 1000, 5000)

    # calling a method of the class

    print(well_1.boe_calc()) # boe production of well_1

    well_2 = well(78910, ''Permian'', 2000, 6000)

    print(well_2.boe_calc()) # boe production of well_2

    ```


    *Output*


    ```

    1862.0689655172414

    3034.4827586206898

    # access the instance attributes

    print(''API for first well is:'', well_1.api, ''and its in'', well_1.basin, ''Basin'')

    if well_1.well_type == ''oil well'':

    print("{0} belongs to {1} category".format(well_1.api, well_1.well_type))

    ```


    *Output*


    ```

    API for first well is: 12345 and its in Williston Basin

    12345 belongs to oil well category

    ```


    ## Python Libraries


    In the following section, some of the most popular libraries are briefly discussed.
    This includes `pandas`, `NumPy`, and `Matplotlib`. One of the other commonly used
    Python libraries is `scikit-learn`, which is used for machine learning. It is
    explained in later chapters.


    ### pandas: Data Analysis Library


    `pandas` is an open source library. It is derived from the term *panel data*,
    which is commonly used for data analysis in multidimensional structured datasets.
    `pandas` can take multiple formats of a data file as input. Some of the examples
    include `.csv`, `.xlsx`, `.json`, `.html`, as well as many other commonly used
    formats. The data can then be arranged in the form of a dataframe consisting of
    rows and columns. Once data is converted into a dataframe, multiple different
    methods can be used for data exploration. It is also possible to obtain statistical
    information like mean, median, and standard deviation from the dataframe itself.


    A dataset from the Volve field in the North Sea is used as an example in this
    chapter. Once the data is imported, a brief *exploratory data analysis* (EDA)
    is carried out by looking into the datatypes and descriptive statistics. The data
    is cleaned by dropping NA values, although a more thorough EDA process includes
    multiple steps, such as data imputation, outlier analysis, as well as preliminary
    feature selection. Another dataset with the same header information, but for a
    different well, is also imported, and the two dataframes are merged.


    This dataset has the following petrophysical information available for analysis.


    *   Well Count: 2

    *   Well Name: 15/9-19 A and 15/9-19 BT2

    *   BVW (V/V): Bulk volume water

    *   CARB_FLAG (UNITLESS)

    *   COAL_FLAG (UNITLESS)

    *   KLOGH (mD)

    *   PHIF (V/V): Fracture porosity

    *   RHOFL (G/CM3): Bulk density fluid

    *   RHOMA (G/CM3): Bulk density matrix

    *   RW (OHMM): Water resistivity

    *   SAND_FLAG (UNITLESS)

    *   SW (V/V): Water saturation

    *   TEMP (DEGC): Temperature in degree C

    *   VSH (V/V): Shale volume

    *   LITHOTYPE: Rock characteristics


    ```

    import pandas as pd

    #import the .csv file as a dataframe

    data = pd.read_csv(''data/15_9-19_A_CPI_LITHO.csv'')

    # data is imported as a table with rows and columns

    data # entire dataset

    ```


    *Output*


    ![../images/480430_1_En_2_Chapter/480430_1_En_2_Figa_HTML.jpg](images/480430_1_En_2_Chapter/480430_1_En_2_Figa_HTML.jpg)


    The following code snippet obtains the index and the different columns that constitute
    the dataframe. In order to access the elements/columns, either column names or
    numerical indexes can be used.


    ```

    print(data.index)

    print(data.columns)

    ```


    *Output*


    ```

    RangeIndex(start=0, stop=3008, step=1)

    Index([''COMMON_WELL_NAME'', ''DEPTH (M)'', ''BVW (V/V)'', ''CARB_FLAG (UNITLESS)'',

    ''COAL_FLAG (UNITLESS)'', ''KLOGH (MD)'', ''PHIF (V/V)'', ''RHOFL (G/CM3)'',

    ''RHOMA (G/CM3)'', ''RW (OHMM)'', ''SAND_FLAG (UNITLESS)'', ''SW (V/V)'',

    ''TEMP (DEGC)'', ''VSH (V/V)'', ''LITHOTYPE''],

    dtype=''object'')

    ```


    It is important to understand 1D (series) and 2D (dataframe) operations, which
    are defined next.


    *   **Series**: An array where an index is assigned to a value

    *   **Dataframe**: A 2D array where an index is assigned to multiple values and
    can include multiple columns


    If you want to merge datasets from different sources, it is possible to combine
    them in multiple ways. A brief description of the different parameters used in
    the syntax is provided next.


    ```

    pd.merge(left, right, how, on)

    ```


    Here, the first two parameters indicate the first and second dataframe, which
    are required to be merged. These are often referred to as *left* and *right* dataframes.
    The parameter defines the type of merge to be performed, which could be one of
    the following.


    *   `how = ''outer''` allows you to take the union of datasets and append them
    together.

    *   `how = ''inner''` allows you to take the intersection of datasets and keep
    only the common values

    *   `how = ''left''`. All indexes of the left dataframe are included. If there
    are indexes that are not present in the ‘left’ dataframe, they will not be included
    in the merged dataset.

    *   `how = ''right''`. All indexes of the right dataframe are included. If there
    are indexes that are not present in the ‘right’ dataframe, they will not be included
    in the merged dataset.


    The keyword `on` decides if the dataframes are merged on a particular ID that
    is a unique identifier (for example, the API number in oil and gas wells).


    ```

    # Merging data from another file

    # Using the data from another well and merging the dataframes

    data2 = pd.read_csv(''data/15_9-19_BT2_CPI_LITHO.csv'')

    data_combined = pd.merge(data, data2, how="outer", on = None)

    ```'
