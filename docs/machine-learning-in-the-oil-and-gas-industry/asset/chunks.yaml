- fmt: '### NumPy: Scientific Computing


    This is a library in Python which is commonly used for scientific computing, using
    multidimensional array objects. Creating a NumPy array is a straightforward process.
    Examples of NumPy arrays creation using different methods are shown next.


    ```python

    # import the library

    import numpy as np

    array1 = np.array([1,2,3,4])

    array2 = np.array([1,None,''Python'',4.19])

    array3 = np.array([[(1,3.14,6),(1,2,3)], [(100,200,300), (99,9.9,0.99)]])

    # evenly spaced values - step value

    array4 = np.arange(5, 20, 4)

    # evenly spaced values - number of samples

    array5 = np.linspace(0,100,9)

    array6 = np.random.randint(10, size=6)  # One-dimensional array

    print(array1)

    print(array2)

    print(array3)

    print(array4)

    print(array5)

    print(array6)

    ```


    *Output*


    ```

    [1 2 3 4]

    [1 None ''Python'' 4.19]

    [[[  1\.     3.14   6\.  ]

    [  1\.     2\.     3\.  ]]

    [[100\.   200\.   300\.  ]

    [ 99\.     9.9    0.99]]]

    [ 5  9 13 17]

    [  0\.   12.5  25\.   37.5  50\.   62.5  75\.   87.5 100\. ]

    [6 7 3 6 1 1]

    ```


    NumPy supports mathematical manipulations (addition, logarithm, etc.) and sorting
    of arrays. A simple example is shown in the following code snippet. To get a comprehensive
    understanding of the available NumPy operations, we encourage you to refer to
    the NumPy documentation [[12](#480430_1_En_2_Chapter.xhtml#Par145)].


    ```python

    # array mathematics - two different methods

    print(array1 + array4)

    print(np.add(array1, array4))

    print(np.log(array1))

    # sorting an array

    array6.sort(axis=0)

    print(array6)

    ```


    *Output*


    ```

    [ 6 11 16 21]

    [ 6 11 16 21]

    [0\.         0.69314718 1.09861229 1.38629436]

    [1 1 3 6 6 7]

    print("Number of Dimensions: ", array3.ndim)

    print("Array shape:", array3.shape)

    print("Array size: ", array3.size)

    ```


    *Output*


    ```

    Number of Dimensions:  3

    Array shape: (2, 2, 3)

    Array size:  12

    ```


    Accessing elements in NumPy arrays via indexing is very similar to accessing an
    element in the list. For a multidimensional array, elements can be accessed using
    a comma-separated tuple of indices. A *slicing operation* is also very similar.
    Some of the other more commonly used array manipulation routines are also available
    in NumPy, which are described in NumPy array manipulation documentation [[13](#480430_1_En_2_Chapter.xhtml#Par146)].
    Some simple array manipulation examples are shown next.


    ```python

    i = np.append(array6, [25,26,27])

    print(i)

    concat = np.concatenate((array1, array2), axis=0)

    print(concat)

    mean_val = np.mean(array5)

    print(mean_val)

    ```


    *Output*


    ```

    [ 1  1  3  6  6  7 25 26 27]

    [1 2 3 4 1 None ''Python'' 4.19]

    50.0

    ```


