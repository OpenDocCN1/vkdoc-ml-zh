    ### 时间序列的平稳性要求


    在使用时间序列建模算法时，我们需要确保数据是平稳的。平稳时间序列是指其统计属性（如均值、方差和自相关）随时间保持恒定 [31]。通过使用数学变换（例如对数变换），可以将数据转换为平稳时间序列的形式。迪基-福勒检验可用于判断时间序列是否平稳
    [32]。


    API 编号为 33025021780000 的油井示例中的递减曲线显示了时间趋势（在递减曲线分析中通常为下降趋势）和季节性，这使得局部均值成为时间的函数。这证明了递减曲线的非平稳性质，如图
    6-8 所示。采用指数加权移动平均法来去除数据中的时间趋势。经过变换后，数据失去了趋势，并呈现出接近恒定的滚动均值。


    ![../images/480430_1_En_6_Chapter/480430_1_En_6_Fig8_HTML.jpg](img/480430_1_En_6_Fig8_HTML.jpg)


    图 6-8


    石油产量数据显示出递减趋势，且滚动均值变化，表明存在非平稳行为


    通过使用差分法，可以同时去除数据中的季节性和趋势。在该方法中，将特定时间点的观测值与前一个观测值相减。一阶差分可以使用 pandas 库在 Python 中实现，是去除季节性的有效方法。其实现如图
    6-9 所示，该图显示了应用变换后趋势和季节性的消失。


    ![../images/480430_1_En_6_Chapter/480430_1_En_6_Fig9_HTML.jpg](img/480430_1_En_6_Fig9_HTML.jpg)


    图 6-9


    使用对数变换去除趋势和季节性，从而得到局部稳定的均值


    执行统计相关性分析是为了理解两个变量之间关系的强度。这引出了*自相关函数*（ACF）和*偏自相关函数*（PACF）。ACF 定义为时间序列中两个值之间的相关系数，它可以衡量当前时间
    *t* 的观测值与先前时间的观测值之间的线性关系 [33]。如果对时间序列进行变换并得到相关系数，则得到 PACF，它通常有助于确定自回归模型的阶数。对于所讨论的示例，ACF
    和 PACF 图如图 6-10 所示。


    ![../images/480430_1_En_6_Chapter/480430_1_En_6_Fig10_HTML.jpg](img/480430_1_En_6_Fig10_HTML.jpg)


    图 6-10


    用于理解变量间相关性的 ACF 和 PACF 图


    ### ARIMA 组件


    如果你分解*自回归积分滑动平均*（即 ARIMA）建模算法，该缩写的每个组成部分都有其自身的定义。ARIMA 对时间序列数据进行建模以进行预测（即预测序列中的未来点），其方式如下所述
    [34] [36]。


    *   考虑了数据中的增长/衰退模式（因此称为*自回归*组件）

    *   考虑了数据中增长/衰退的变化率（因此称为*积分*组件）

    *   考虑了连续时间点之间的噪声（因此称为*滑动平均*组件）


    这些组件中的每一个都在模型中作为参数明确指定。ARIMA 使用标准符号 (*p*, *d*, *q*)，其中参数被替换为整数值，以快速指示所使用的特定 ARIMA
    模型 [35] [37]。ARIMA 模型的参数定义如下。


    *   ***p***。模型中包含的滞后观测值数量，也称为*滞后阶数*

    *   ***d***。原始观测值进行差分的次数，也称为*差分阶数*

    *   ***q***。滑动平均窗口的大小，也称为*滑动平均阶数*


    自相关函数和偏自相关函数（ACF 和 PACF）有助于确定这些参数的起始值。通过观察图 6-10，我们可以观察到 ACF 和 PACF 在特定数量的滞后（显示在
    *x* 轴上）之后急剧下降。通过分析这种下降的滞后，我们可以估计 ARIMA 模型的参数。自回归部分的参数 *p* 使用 PACF 确定，而 ACF 则提供模型滑动平均部分的参数
    *q*。基于图 6-10 中的观察结果，我们将使用参数 *p*=2、*d*=1 和 *q*=2 的 ARIMA 模型。接下来，我们展示从自回归模型（见图 6-11）、滑动平均模型（见图
    6-12）以及组合的 ARIMA 模型（见图 6-13）获得的残差平方和（RSS）图。


