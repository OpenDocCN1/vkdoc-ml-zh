    #### 高斯朴素贝叶斯分类


    高斯朴素贝叶斯算法基于**贝叶斯定理**，并假设多个输入特征独立地对样本属于特定类别的概率做出贡献。该算法假设与每个类别相关的连续特征服从高斯分布或正态分布。


    通过使用最大似然原理，该算法可以预测样本点属于特定类别的概率。该算法也属于基础分类算法的范畴，但其性能优于其他基础分类算法，例如多项逻辑回归。以下代码片段展示了该算法的示例实现和分类结果。


    ```

    from sklearn.naive_bayes import GaussianNB

    clf_gnb = GaussianNB()

    clf_gnb.fit(X_train, y_train)

    # 对测试数据进行预测

    y_pred_gnb = clf_gnb.predict(X_test)

    # 准确率指标

    clf_metrics(y_test, y_pred_gnb)

    ```


