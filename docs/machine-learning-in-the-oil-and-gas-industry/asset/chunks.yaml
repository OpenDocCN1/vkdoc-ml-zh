    ### Dictionary


    Enclosed within curly brackets (`{}`), a dictionary is another composite datatype
    which is also sometimes known as an associative array and consists of a collection
    of key-value pairs. It has certain similarities with a list since both datatypes
    are mutable, dynamic (increase or decrease size) and can be nested (dictionary
    within a dictionary). The primary difference lies in the way elements are accessed.
    Dictionary elements are accessed via keys instead of the index position. A dictionary
    can also be created using a built-in function, `dict()`, as shown in the following
    example. One of the restrictions for a dictionary is that a given "key" can only
    appear once. Some of the commonly used methods for a dictionary include `clear()`,
    `items()`, `keys()`, `values()`, and `pop()`.


    ```

    # dictionary

    dict1 = {

    ''Texas'': ''Permian Basin'',

    ''Colorado'': '' DJ Basin'',

    ''North Dakota'': ''Williston Basin''

    }

    # nested dictionary

    dict2 = dict(

    USA = {''Exxon'', ''Chevron'', ''Conoco''},

