- fmt: '### U-Net Implementation


    A code snippet representing a U-Net model is shown here. It consists of a contracting
    path and an expanding path, similar to the architecture shown in Figure [4-12](#480430_1_En_4_Chapter.xhtml#Fig12).
    The main idea behind U-Net is to supplement the contracting layers, where the
    contraction that happens by pooling are replaced either by upsampling or transposed
    convolution layers. This is defined in the model architecture listed in the following
    code:


    ```

    def UNet(input_image, n_filters=16, dropout=0.5, batchnorm=True):

    # Encoder

    c1 = conv2d_block(input_image, n_filters=n_filters*1, kernel_size=3, batchnorm=batchnorm)

    p1 = MaxPooling2D((2, 2)) (c1)

    p1 = Dropout(dropout*0.5)(p1)

    c2 = conv2d_block(p1, n_filters=n_filters*2, kernel_size=3, batchnorm=batchnorm)

    p2 = MaxPooling2D((2, 2)) (c2)

    p2 = Dropout(dropout)(p2)

    c3 = conv2d_block(p2, n_filters=n_filters*4, kernel_size=3, batchnorm=batchnorm)

    p3 = MaxPooling2D((2, 2)) (c3)

    p3 = Dropout(dropout)(p3)

    c4 = conv2d_block(p3, n_filters=n_filters*8, kernel_size=3, batchnorm=batchnorm)

    p4 = MaxPooling2D(pool_size=(2, 2)) (c4)

    p4 = Dropout(dropout)(p4)

    c5 = conv2d_block(p4, n_filters=n_filters*16, kernel_size=3, batchnorm=batchnorm)

    # Decoder

    u6 = Conv2DTranspose(n_filters*8, (3, 3), strides=(2, 2), padding="same") (c5)

    u6 = concatenate([u6, c4])

    u6 = Dropout(dropout)(u6)

    c6 = conv2d_block(u6, n_filters=n_filters*8, kernel_size=3, batchnorm=batchnorm)

    u7 = Conv2DTranspose(n_filters*4, (3, 3), strides=(2, 2), padding="same") (c6)

    u7 = concatenate([u7, c3])

    u7 = Dropout(dropout)(u7)

    c7 = conv2d_block(u7, n_filters=n_filters*4, kernel_size=3, batchnorm=batchnorm)

    u8 = Conv2DTranspose(n_filters*2, (3, 3), strides=(2, 2), padding="same") (c7)

    u8 = concatenate([u8, c2])

    u8 = Dropout(dropout)(u8)

    c8 = conv2d_block(u8, n_filters=n_filters*2, kernel_size=3, batchnorm=batchnorm)

    u9 = Conv2DTranspose(n_filters*1, (3, 3), strides=(2, 2), padding="same") (c8)

    u9 = concatenate([u9, c1], axis=3)

    u9 = Dropout(dropout)(u9)

    c9 = conv2d_block(u9, n_filters=n_filters*1, kernel_size=3, batchnorm=batchnorm)

    outputs = Conv2D(1, (1, 1), activation="sigmoid") (c9)

    model = Model(inputs=[input_img], outputs=[outputs])

    return model

    model.compile(optimizer=Adam(), loss="binary_crossentropy", metrics=["accuracy"])

    callbacks = [

    EarlyStopping(patience=10, verbose=1),

    ModelCheckpoint(''./model/model-tgs-salt.h5'', verbose=1, save_best_only=True,
    save_weights_only=True)

    ]

    results = model.fit(X_train, y_train, batch_size=16, epochs=25, callbacks=callbacks,
    validation_data=(X_valid, y_valid))

    ```


    The Jupyter notebook accompanying this chapter provides step-by-step code for
    training a simple U-Net model using the dataset from Kaggle.


    ### Interpretation Results


    We conclude this practical example with a brief discussion of results. The network
    was trained with `Adam` optimizer on a dataset of 4,000 image patches, of which
    10% was held out as a validation dataset. The model was trained for 25 epochs
    with early-stopping, and the best model was saved for generating prediction for
    the validation dataset. A few visualizations from the predictions generated for
    the samples in the validation set are shown in Figure [4-14](#480430_1_En_4_Chapter.xhtml#Fig14).
    As can be seen from the probabilities in the two example samples, the model has
    learnt to predict the boundary between salt and sediment. These probabilities
    can be thresholded to obtain predictions for a given image patch.


    An important thing to note is that the neural network model has been trained on
    patches. However, this trained model is often applied on migrated images. As described
    in the previous section, the migrated images are three dimensional volumes. In
    order to obtain a salt mask, inference is done patchwise and the probabilities
    are summed by ensuring weights are divided in an appropriate manner. This can
    be achieved by a simple moving window algorithm that infers each patch in a line
    individually. Salt mask resulting from the application of such a workflow is shown
    in Figure [4-15](#480430_1_En_4_Chapter.xhtml#Fig15).


    Generalization of deep neural networks for the purpose of seismic interpretation
    is a challenge. A discussion of these challenges is beyond the scope of this introductory
    chapter.


    ![../images/480430_1_En_4_Chapter/480430_1_En_4_Fig15_HTML.jpg](images/480430_1_En_4_Chapter/480430_1_En_4_Fig15_HTML.jpg)


    Figure 4-15


    Comparison of interpretation from U-Net and ground truth labeled by interpreters


    ![../images/480430_1_En_4_Chapter/480430_1_En_4_Fig14_HTML.jpg](images/480430_1_En_4_Chapter/480430_1_En_4_Fig14_HTML.jpg)


    Figure 4-14


    Predictions of U-Net on the image patches. (left to right) Seismic image, recorded
    labels, predicted probabilities and predicted labels. Probabilities are obtained
    by the application of sigmoid layer and labels are obtained by thresholding the
    probabilities


    ## A Sampling of Problems


    We focused on the problem of interpreting salt from seismic images in this chapter.
    However, several other applications of machine learning have been published in
    the geophysics community. We give a sampling of problems in geophysics and seismic
    data processing with a selection of references.


    Facies classification is an important topic at the core of reservoir property
    estimation. It is crucial to classify lithologies and facies to build a detailed
    understanding of the depositional environments encountered in the wellbore. This
    is an extremely important problem in exploration. Several authors have explored
    this problem in detail. A good introduction to the application of machine learning
    in facies classification can be found in references [[8](#480430_1_En_4_Chapter.xhtml#Par52)]
    and [[9](#480430_1_En_4_Chapter.xhtml#Par53)].


    Inversion for reservoir properties is another important area of application. Reference
    [[10](#480430_1_En_4_Chapter.xhtml#Par54)] provides an example using a physics-guided
    convolutional neural network to estimate reservoir properties. Another commonly
    studied problem is the process of interpreting faults from seismic images. Reference
    [[11](#480430_1_En_4_Chapter.xhtml#Par55)] presents an example to interpret faults
    in 3D using segmentation performed by 3D convolutional neural networks.


    ## Summary


    In this chapter, we offered an overview of geophysics and seismic data processing.
    We focused on the problem of salt interpretation and gave an overview of other
    important problems in geophysics. Given the nature of image data that is available
    in the seismic imaging community, the problems are amenable for application of
    ideas from the computer vision community. Several problems in this area are multidisciplinary,
    and this chapter offered an overview of a variety of them.'
  raw: '### U-Net Implementation


    A code snippet representing a U-Net model is shown here. It consists of a contracting
    path and an expanding path, similar to the architecture shown in Figure [4-12](#480430_1_En_4_Chapter.xhtml#Fig12).
    The main idea behind U-Net is to supplement the contracting layers, where the
    contraction that happens by pooling are replaced either by upsampling or transposed
    convolution layers. This is defined in the model architecture listed in the following
    code:


    ```

    def UNet(input_image, n_filters=16, dropout=0.5, batchnorm=True):

    # Encoder

    c1 = conv2d_block(input_image, n_filters=n_filters*1, kernel_size=3, batchnorm=batchnorm)

    p1 = MaxPooling2D((2, 2)) (c1)

    p1 = Dropout(dropout*0.5)(p1)

    c2 = conv2d_block(p1, n_filters=n_filters*2, kernel_size=3, batchnorm=batchnorm)

    p2 = MaxPooling2D((2, 2)) (c2)

    p2 = Dropout(dropout)(p2)

    c3 = conv2d_block(p2, n_filters=n_filters*4, kernel_size=3, batchnorm=batchnorm)

    p3 = MaxPooling2D((2, 2)) (c3)

    p3 = Dropout(dropout)(p3)

    c4 = conv2d_block(p3, n_filters=n_filters*8, kernel_size=3, batchnorm=batchnorm)

    p4 = MaxPooling2D(pool_size=(2, 2)) (c4)

    p4 = Dropout(dropout)(p4)

    c5 = conv2d_block(p4, n_filters=n_filters*16, kernel_size=3, batchnorm=batchnorm)

    # Decoder

    u6 = Conv2DTranspose(n_filters*8, (3, 3), strides=(2, 2), padding="same") (c5)

    u6 = concatenate([u6, c4])

    u6 = Dropout(dropout)(u6)

    c6 = conv2d_block(u6, n_filters=n_filters*8, kernel_size=3, batchnorm=batchnorm)

    u7 = Conv2DTranspose(n_filters*4, (3, 3), strides=(2, 2), padding="same") (c6)

    u7 = concatenate([u7, c3])

    u7 = Dropout(dropout)(u7)

    c7 = conv2d_block(u7, n_filters=n_filters*4, kernel_size=3, batchnorm=batchnorm)

    u8 = Conv2DTranspose(n_filters*2, (3, 3), strides=(2, 2), padding="same") (c7)

    u8 = concatenate([u8, c2])

    u8 = Dropout(dropout)(u8)

    c8 = conv2d_block(u8, n_filters=n_filters*2, kernel_size=3, batchnorm=batchnorm)

    u9 = Conv2DTranspose(n_filters*1, (3, 3), strides=(2, 2), padding="same") (c8)

    u9 = concatenate([u9, c1], axis=3)

    u9 = Dropout(dropout)(u9)

    c9 = conv2d_block(u9, n_filters=n_filters*1, kernel_size=3, batchnorm=batchnorm)

    outputs = Conv2D(1, (1, 1), activation="sigmoid") (c9)

    model = Model(inputs=[input_img], outputs=[outputs])

    return model

    model.compile(optimizer=Adam(), loss="binary_crossentropy", metrics=["accuracy"])

    callbacks = [

    EarlyStopping(patience=10, verbose=1),

    ModelCheckpoint(''./model/model-tgs-salt.h5'', verbose=1, save_best_only=True,
    save_weights_only=True)

    ]

    results = model.fit(X_train, y_train, batch_size=16, epochs=25, callbacks=callbacks,
    validation_data=(X_valid, y_valid))

    ```


    The Jupyter notebook accompanying this chapter provides step-by-step code for
    training a simple U-Net model using the dataset from Kaggle.


    ### Interpretation Results


    We conclude this practical example with a brief discussion of results. The network
    was trained with Adam optimizer on a dataset of 4,000 image patches, of which
    10% was held out as a validation dataset. The model was trained for 25 epochs
    with early-stopping, and the best model was saved for generating prediction for
    the validation dataset. A few visualizations from the predictions generated for
    the samples in the validation set are shown in Figure [4-14](#480430_1_En_4_Chapter.xhtml#Fig14).
    As can be seen from the probabilities in the two example samples, the model has
    learnt to predict the boundary between salt and sediment. These probabilities
    can be thresholded to obtain predictions for a given image patch.


    An important thing to note is that the neural network model has been trained on
    patches. However, this trained model is often applied on migrated images. As described
    in the previous section, the migrated images are three dimensional volumes. In
    order to obtain a salt mask, inference is done patchwise and the probabilities
    are summed by ensuring weights are divided in an appropriate manner. This can
    be achieved by a simple moving window algorithm that infers each patch in a line
    individually. Salt mask resulting from the application of such a workflow is shown
    in Figure [4-15](#480430_1_En_4_Chapter.xhtml#Fig15).


    Generalization of deep neural networks for the purpose of seismic interpretation
    is a challenge. A discussion of these challenges is beyond the scope of this introductory
    chapter.


    ![../images/480430_1_En_4_Chapter/480430_1_En_4_Fig15_HTML.jpg](images/480430_1_En_4_Chapter/480430_1_En_4_Fig15_HTML.jpg)


    Figure 4-15


    Comparison of interpretation from U-Net and ground truth labeled by interpreters


    ![../images/480430_1_En_4_Chapter/480430_1_En_4_Fig14_HTML.jpg](images/480430_1_En_4_Chapter/480430_1_En_4_Fig14_HTML.jpg)


    Figure 4-14


    Predictions of U-Net on the image patches. (left to right) Seismic image, recorded
    labels, predicted probabilities and predicted labels. Probabilities are obtained
    by the application of sigmoid layer and labels are obtained by thresholding the
    probabilities


    ## A Sampling of Problems


    We focused on the problem of interpreting salt from seismic images in this chapter.
    However, several other applications of machine learning have been published in
    the geophysics community. We give a sampling of problems in geophysics and seismic
    data processing with a selection of references.


    Facies classification is an important topic at the core of reservoir property
    estimation. It is crucial to classify lithologies and facies to build a detailed
    understanding of the depositional environments encountered in the wellbore. This
    is an extremely important problem in exploration. Several authors have explored
    this problem in detail. A good introduction to the application of machine learning
    in facies classification can be found in references [[8](#480430_1_En_4_Chapter.xhtml#Par52)]
    and [[9](#480430_1_En_4_Chapter.xhtml#Par53)].


    Inversion for reservoir properties is another important area of application. Reference
    [[10](#480430_1_En_4_Chapter.xhtml#Par54)] provides an example using a physics-guided
    convolutional neural network to estimate reservoir properties. Another commonly
    studied problem is the process of interpreting faults from seismic images. Reference
    [[11](#480430_1_En_4_Chapter.xhtml#Par55)] presents an example to interpret faults
    in 3D using segmentation performed by 3D convolutional neural networks.


    ## Summary


    In this chapter, we offered an overview of geophysics and seismic data processing.
