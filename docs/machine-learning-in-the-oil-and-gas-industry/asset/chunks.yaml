- fmt: '### Root Cause Analysis (RCA)


    Technical analysis methods and diagnoses are applied to identify the causes of
    why the performance may be above or below expectations. The objective is to identify
    the constraint, such as whether the liquid production is limited by reservoir
    deliverability, by well production potential, or by facility processing limits.


    Due to the ambiguity of some of the symptoms as identified in the previous step
    (feature engineering), the outcome of RCA is typically probabilistic, indicating
    the most likely causes but also possible alternative causes.


    One known method of a root cause identification is `Bayesian Network`. An example
    for determining the most likely cause for declining downhole pump performance
    is determined by the `Bayesian Network` model which considers the observations
    and real-time measurements. The observations can be independent (e.g., pumpage
    and reservoir pressure) but can also be linked by a causal relationship (e.g.,
    wellhead pressure and production rates).


    In this example, the information about the pump, reservoir, fluid, measuring dropping
    liquid rates, and wellhead pressures, are used to determine the most likely cause
    which is gas ingestion; however, this does not entirely exclude mechanical problems
    and possible excessive pump wear (e.g., due to sand in the pump).


    ### Recommending Actions to Improve Performance


    A high-level well “health score” can be calculated from features identified in
    well sensors and other measurement data. Additional scores can be calculated to
    quantify the problem severity (i.e., problem score), the size of the opportunity
    if the well is fixed or improved (i.e., potential score), and so on. All scores
    that are calculated for a well are summed up to yield a final score. The final
    score can be considered a health score; the smaller the value, the less likely
    it is that the well shows a severe issue. The wells can then be ranked by the
    final score to give a list of priorities for the daily operations.


    The calculated events, conditions, and recommended actions are availed for each
    element in the production system (e.g., for each well, for each facility). The
    result of how likely an event occurs multiplied by how severe the impact of an
    event may be (safety issue, lost production, lost time) is a score for a certain
    event.


    Based on a definition of utility (e.g., maximize production, minimize losses,
    increase net present value, reduce lost time, etc.), decisions are suggested to
    solve the problems as identified in previous steps. The suggestion may be probabilistic.
    The overall utility value is a combination of various sub-utilities; therefore,
    a unified evaluating system must be established for every organization or even
    for every project, which allows a comparison of monetary and nonmonetary targets.


    ### Predicting Poor Well Performance


    One of the challenges encountered in predicting poor well performance stems from
    the fact that there are very few indications of a rapid decline in production
    during the early stages of production. However, by using unsupervised machine
    learning techniques, such as clustering algorithms, it could be possible to identify
    the wells, which may exhibit diminished oil production over a certain number of
    years. A methodology for a clustering-based approach is shown in Figure [7-8](#480430_1_En_7_Chapter.xhtml#Fig8).


    ![../images/480430_1_En_7_Chapter/480430_1_En_7_Fig8_HTML.jpg](images/480430_1_En_7_Chapter/480430_1_En_7_Fig8_HTML.jpg)


    Figure 7-8


    A clustering-based methodology for identifying wells with a high probability of
    diminished production in future


    The daily production data from many wells during the early stages of production
    (e.g., the initial 24 months) is considered for computing cumulative oil production
    from the wells. Additionally, cumulative oil production from each well is normalized
    to 1 by using the cumulative production from the well at the end of the duration
    being considered. These two cumulative production plots can then create well clusters
    separately. The clustering based on cumulative oil production, shown in Figure
    [7-9](#480430_1_En_7_Chapter.xhtml#Fig9) (left), leads to three distinct categories
    of wells.


    ![../images/480430_1_En_7_Chapter/480430_1_En_7_Fig9_HTML.jpg](images/480430_1_En_7_Chapter/480430_1_En_7_Fig9_HTML.jpg)


    Figure 7-9


    Clustering of cumulative oil production (left) and normalized cumulative production
    exhibits distinct well clusters (right)


    *   Low cumulative production wells (blue lines)

    *   Medium cumulative production wells (red lines)

    *   High cumulative production wells (green lines)


    Also, clustering based on normalized cumulative oil production shows three categories
    of wells (see Figure [7-9](#480430_1_En_7_Chapter.xhtml#Fig9) right). The black
    dotted lines show the cluster mean values for each instance of time. Observing
    the cluster mean, it becomes clear that these three clusters denote following
    three different production trends:


    *   Declining production rate (blue lines), with decreasing slope of the cluster
    mean

    *   Steady production rate (red lines), with an almost constant slope of the cluster
    mean

    *   Increasing production rate (green lines), with an increasing slope of the
    cluster mean


    By combining the clustering based on the cumulative oil production and normalized
    cumulative oil production, nine distinct well categories are identified, each
    belonging to a combination of cumulative oil production and production rate category
    (e.g., high cumulative production—increasing production rate, low cumulative production—declining
    production rate, etc.).


    Furthermore, the number of wells from the production data analyzed demonstrated
    a critical decline in oil production over five years or longer time horizon. For
    each of the nine categories, the probability of a critical decline in oil production
    was calculated by considering the total number of wells in that category and the
    number of wells showing a critical decline in the future. Table [7-2](#480430_1_En_7_Chapter.xhtml#Tab2)
    summarizes the computed probability that a well will be dead within the next five
    years.


    It can be readily observed that the wells in the “high cumulative production”
    cluster did not show any probability of becoming inactive within the time horizon
    considered in this study, irrespective of the production rate cluster they belonged
    to.


    Table 7-2


    Probability of Dead Well in Five years


    | Production Rate → | Declining Rate | Steady Rate | Increasing Rate |

    | --- | --- | --- | --- |

    | Cumulative Production ↓ |

    | --- |

    | **Low** | 0.258 | **0.308** | **0.357** |

    | **Medium** | 0.12 | 0.14 | 0.19 |

    | **High** | 0.000 | 0.000 | 0.000 |

    | Average Water Cut and Dead Well Probability Correlation Coefficient: 0.719563
    |


    Additionally, wells in the categories with low cumulative production along with
    steady or increasing production rates demonstrated significantly higher probabilities
    of becoming inactive within the time horizon considered. Based on these observations,
    it is suggested that for the studied oil field, the new wells with low cumulative
    oil production along with steady or declining production rates should be monitored
    carefully. The wells falling in these two categories based on the first 24 months
    production data can be prioritized for the more frequent surveillance activities
    and production enhancement workover activities.


    *   Input data: `Well_Monthly_Production.csv`

    *   Output: `Probability of a well becoming inactive`

    *   Python code: `Chapter07_Well_Failure_Clustering_using_KMeans.ipynb`

    *   Method: `k-means` clustering'
