    # 3. Overview of Machine Learning and Deep Learning Concepts


    In this chapter, we focus on exploring the realms of machine learning and deep
    learning algorithms. Datasets from the previous chapter are used in this chapter
    as well. In addition, we introduce some new public datasets to build machine learning
    and deep learning models. In the previous chapter, you learned the basic concepts
    of Python programming. In this chapter, we start using Python programming and
    related libraries to explore the data and doing data wrangling to clean it so
    that it can be used as an input for different machine learning models. The chapter
    is divided into seven broad sections, starting with the overview of machine learning.


    This section is followed by some general concepts and best practices related to
    machine learning applications. The subsequent sections provide insight into exploratory
    data analysis, supervised learning, regression and classification algorithms,
    and unsupervised learning algorithms. Separate sections are dedicated to deep
    learning and hyperparameter optimization concepts and their application to selected
    oil and gas industry problems.


    ## Machine Learning


    Machine learning is the field where computers are algorithmically programmed to
    learn and adapt themselves from experience to improve at a task when evaluated
    using a metric, rather than explicitly being told about the outcome [[1](#480430_1_En_3_Chapter.xhtml#Par227)].
    This definition is explained with the simple example of a task in which the objective
    is to recognize handwritten digits, and the metric is the percentage of digits
    correctly classified using the database of human-labeled images of handwritten
    digits serving as experience. The “learning” part utilizes large amounts of data
    to enable the computer to understand underlying patterns.


    With advancements in computational power and highly efficient machines, there
    has been a significant improvement in the efficiency of machine learning algorithms
    over the past few years. Some of the areas where machine learning has been successfully
    applied include image recognition, textual analysis (e.g., spam filtering), sentiment
    analysis or information extraction, video games, and robotics. With every passing
    day, more applications of machine learning are emerging.


    ### Recent Advances


    Recent advancements in the field of machine learning are seen in self-driving
    cars and autonomous vehicles, which have multiple sensors to gather real-time
    data at high frequency. The sensor data is processed by pre-trained machine learning
    algorithms, which provide “intelligence” to a self-driving car or an autonomous
    vehicle. Similar technology is also used in laser terrain mapping, path planning,
    and adaptive vision.


    Another successful application of machine learning lies in automatic speech recognition,
    and language translators, which are commonly used in smart devices. Generative
    models built on the principle of generative adversarial networks (GAN) serve as
    another example of the most recent advances in machine learning, where reconstruction
    or generation of realistic human faces is possible using specialized deep learning
    models.'
