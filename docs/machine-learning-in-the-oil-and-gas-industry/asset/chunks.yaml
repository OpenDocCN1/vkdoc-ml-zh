- fmt: '### *k*-Nearest Neighbors (*k*-NN)


    *k*-nearest neighbors (*k*-NN) is a nonparametric algorithm based on the similarity
    measure (e.g., distance functions, such as Euclidian distance between two samples,
    or Hamming distance between the binary vectors). The algorithm uses the similarity
    measure to find *k* nearest neighboring points in the sample data, and based on
    the most frequently occurring class among these *k* neighbors, predicts the output
    category.


    One of the input parameters for this algorithm is the number of neighbors that
    are searched in the proximity to a sample point with an unknown category. The
    sample implementation and results of this algorithm demonstrate a reasonable performance.
    However, it does not perform as well as the previously discussed tree-based algorithms.


    ```

    from sklearn.neighbors import KNeighborsClassifier

    clf_knn = KNeighborsClassifier()

    clf_knn.fit(X_train, y_train)

    # Prediction on test data

    y_pred_knn = clf_knn.predict(X_test)

    # Accuracy Metrics

    clf_metrics(y_test, y_pred_knn)

    ```


    **Results**


    ```

    Classification Accuracy Score: 0.8592375366568915

    Classification Report:

    precision    recall  f1-score   support

    F-MOUTHBAR       0.83      0.75      0.79        87

    F-TIDAL BAR       0.86      0.85      0.86       119

    F-TIDAL CHANNEL       0.87      0.94      0.90       135

    accuracy                           0.86       341

    macro avg       0.86      0.85      0.85       341

    weighted avg       0.86      0.86      0.86       341

    ```


    ### Gaussian Naive Bayes Classification


    The Gaussian Naive Bayes algorithm is based on *Bayes’ theorem* with an assumption
    that multiple input features independently contribute to the probability of a
    sample belonging to a particular class. This algorithm assumes a Gaussian or normal
    distribution of the continuous features associated with each of the classes.


    By using the principle of maximum likelihood, the algorithm can predict the probability
    that a sample point belongs to a particular class. This algorithm also falls under
    the category of basic classification algorithms but performs better than other
    basic classification algorithms, such as multinomial logistic regression. A sample
    implementation and classification results of this algorithm are shown in the following
    code snippet.


    ```

    from sklearn.naive_bayes import GaussianNB

    clf_gnb = GaussianNB()

    clf_gnb.fit(X_train, y_train)

    # Prediction on test data

    y_pred_gnb = clf_gnb.predict(X_test)

    # Accuracy Metrics

    clf_metrics(y_test, y_pred_gnb)

    ```


    **Results**


    ```

    Classification Accuracy Score: 0.6099706744868035

    Classification Report:

    precision    recall  f1-score   support

    F-MOUTHBAR       0.40      0.54      0.46        87

    F-TIDAL BAR       0.61      0.34      0.44       119

    F-TIDAL CHANNEL       0.77      0.89      0.82       135

    accuracy                           0.61       341

    macro avg       0.59      0.59      0.57       341

    weighted avg       0.62      0.61      0.60       341

    ```


    ### Linear Discriminant Analysis


    Linear discriminant analysis (LDA) also works under the assumption of Gaussian
    distribution of input features. Also, the algorithm assumes that each feature
    has the same variance. In this algorithm, input features are transformed, such
    that there is minimal overlap between the values of the input features for two
    distinct classes. This is achieved by performing the transformation, which maximizes
    the distance between the statistical means of the features for any two distinct
    classes in the sample. The algorithm provides the probability of a sample point
    belonging to a particular class.


    LDA is a simple algorithm, which can perform reasonably for a small dataset. However,
    if the training data contains input features with overlapping statistical means,
    the algorithm is not able to distinguish samples belonging to different classes.
    The following code snippet and results demonstrate the better performance of LDA
    on the multiclass classification problem when compared to other basic algorithms
    (i.e., Gaussian Naïve Bayes, and multinomial logistic classifier).


    ```

    from sklearn.discriminant_analysis import LinearDiscriminantAnalysis

    clf_lda = LinearDiscriminantAnalysis()

    clf_lda.fit(X_train, y_train)

    # Prediction on test data

    y_pred_lda = clf_lda.predict(X_test)

    # Accuracy Metrics

    clf_metrics(y_test, y_pred_lda)

    ```


    **Results**


    ```

    Classification Accuracy Score: 0.7800586510263929

    Classification Report :

    precision    recall  f1-score   support

    F-MOUTHBAR       0.73      0.56      0.64        87

    F-TIDAL BAR       0.71      0.82      0.76       119

    F-TIDAL CHANNEL       0.87      0.89      0.88       135

    accuracy                           0.78       341

    macro avg       0.77      0.76      0.76       341

    weighted avg       0.78      0.78      0.78       341

    ```


    ### Comparison of Classification Models


    For the classification models that we built in this section, F1-scores are used
    as a metric to compare their performance. Based on the results for the test dataset,
    decision tree, and random forest classifiers are among the best performing classification
    models, as shown in Table [3-2](#480430_1_En_3_Chapter.xhtml#Tab2). Further tuning
    of these models is expected to change these accuracy results.


    **Table 3-2** Classification Models and F1-Scores


    | Classification Model | F1-Score |

    | --- | --- |

    | Multinomial Logistic Regression | 0.648 |

    | Support Vector Classifier | 0.621 |

    | Decision Tree Classifier | 0.985 |

    | Random Forest Classifier | 0.988 |

    | *k*-NN | 0.859 |

    | Gaussian Naive Bayes | 0.609 |

    | Linear Discriminant Analysis | 0.780 |


    ## Unsupervised Learning


    So far, we discussed the problems related to supervised learning, where the machine
    learning algorithm tries to map input features in the training data to the corresponding
    output variable. In unsupervised learning problems, there is no associated output
    variable to be mapped to the input features. Instead, unsupervised machine learning
    algorithms work by finding hidden relationships and/or patterns in the training
    data. Two of the broad categories of unsupervised learning problems include clustering
    and dimensionality reduction. We discuss both categories of algorithms and show
    example implementations.


    ### Clustering


    In this category of unsupervised learning, algorithms try to find clusters with
    similar characteristics in the sample data. Clustering algorithms work very well
    on the sample data, where relatively distinct groups of the sample population
    are present. Once the clustering algorithm is trained, any new observation is
    predicted to belong to one of the clusters, which the algorithm had identified
    based on the original sample data.'
