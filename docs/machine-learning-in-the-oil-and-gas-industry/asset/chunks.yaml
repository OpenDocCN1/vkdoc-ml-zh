    A production-ready machine learning project requires a carefully architected machine
    learning pipeline. The model itself is only one of the many components in the
    end-to-end pipeline. Some of the other components of machine learning workflow
    include data collection, data verification and preprocessing, feature extraction,
    model selection, training and validation, prediction, evaluation, and deployment.
    Our focus in this chapter is on building machine learning models.


    ## General Concepts


    In this section, we discuss general concepts, which apply to most of the machine
    learning model building exercises.


    ### Data Preprocessing: Normalization and Standardization


    For building a machine learning model, we need to preprocess the data so that
    it is adequate for the computational stability of the machine learning algorithm.
    An important step in data preprocessing involves rescaling the input features
    and output variable (for regression problems) to make their ranges consistent
    before feeding them as an input to the machine learning algorithm. To understand
    this concept, let’s consider an example with different data ranges in input features
    or output variables. During the training process, we may have an input feature
    with a large range, such as cumulative production (range from 1000 bbls to 100,000
    bbls). Whereas, another feature may have a very small range, such as porosity
    (range from 0.05 to 0.60).


    During the iterative training process, the model parameters (e.g., coefficients
    or weights) associated with the input feature with large values differ significantly
    from those associated with the small values. Also, if the output variable has
    a very large range, the error metric, such as RMSE, can result in very large values.
    When this large error value is used to adjust the model parameters, which are
    already significantly large, it is possible that during the iterative update of
    model parameters, some values go beyond the numerical limit that the computer
    can handle. This may result in computational instability, eventually causing poor
    performance during the learning process. High sensitivity to input values can
    also cause severe generalization errors [[4](#480430_1_En_3_Chapter.xhtml#Par230)].


    While working with data having multiple features in different units and ranges,
    it is important to preprocess the data for faster training, leading to a reduction
    in overfitting and more accurate predictions. As an example, this is observed
    during convergence in gradient descent optimization process [[5](#480430_1_En_3_Chapter.xhtml#Par231)].


    There are multiple methods, such as standardization, normalization, and scaling
    available in the scikit-learn library, which can help process the data efficiently.
    The choice of preprocessing method depends on the algorithm and the parameter
    optimization process. A word of caution; these terms are often used interchangeably,
    depending on the customs within various fields.


    #### Normalization


    Normalization is a process of rescaling the data from the original range so that
    values lie in the range of 0 to 1 or –1 to 1\. This method can be applied when
    the approximate upper and lower bounds of the data are known, data has few or
    no outliers present, and the data has a nearly uniform distribution. One of the
    utilities for scaling the data is `MinMaxScaler()` provided by the scikit-learn
    library, which uses the following equation.


    ![$$ {X}_{norm}=\frac{X- Xmin}{Xmax- Xmin}. $$](images/480430_1_En_3_Chapter/480430_1_En_3_Chapter_TeX_Equ1.png)


    (3.1)


    #### Standardization (Z-Score Normalization)


    When the features are rescaled to have the properties of a standard normal distribution
    (Gaussian distribution with a bell-shaped curve) with zero mean and unit standard
    deviation, the process is called *standardization* . This is important when a
    machine learning algorithm is used because it assumes that the input data is normally
    distributed. In this approach, rescaled values are calculated by using the following
    equation.


    ![$$ z=\frac{x-\mu }{\sigma }, $$](images/480430_1_En_3_Chapter/480430_1_En_3_Chapter_TeX_Equ2.png)


    (3.2)


    *where z* is the standard z-score, *x* is the input data, *μ* is the sample mean
    of input data, and *σ* is the standard deviation from the mean. This method can
    be used in cases where the feature distribution does not contain extreme outliers.


    ### Underfitting or Overfitting


    When we train the machine learning models, one of the main objectives is to use
    it for generating predictions for the unseen data. An adequately trained model
    should demonstrate the same level of prediction accuracy for unseen data, which
    it had shown for the training data. However, in certain scenarios, the model may
    not be able to perform well on the unseen data. This may be caused due to underfitting
    or overfitting of the model.


    *   **Underfitting:** When the training process is stopped too early, or the model
    is insufficiently exposed to training data. In such a scenario, the model is not
    able to learn general patterns present in the training data. Poor prediction accuracy
    on both the training data and unseen data is an indicator of underfitting.


    *   **Overfitting:** One may choose to train a model using all the data available
    in a training dataset for a larger number of iterations so that it learns all
    the patterns present in the training data. As a result, the model can demonstrate
    very high accuracy on the training data. However, the model is so fine-tuned to
    the training data that it loses its ability to generalize beyond the training
    data it has seen. In such scenarios, the model exhibits poor prediction accuracy
    for unseen data, even though it was able to generate predictions for training
    data with high accuracy. This kind of scenario indicates model overfitting.


    It is important to ensure that model does not suffer from either underfitting
    or overfitting. Machine learning model should be adequately trained so that it
    can generate predictions for unseen data with reasonable accuracy. In other terms,
    a machine learning model should be able to *generalize*.'
  trans: '

    ### 机器学习流水线


    机器学习流水线是一系列处理单元（包括进程、线程、例程和函数）以流程图形式排列而成，用于将数据从一种表示形式转换为另一种表示形式。构建机器学习流水线的目标是在注重可重复性和灵活性的同时提升模块化程度。


    一个可用于生产环境的机器学习项目需要精心设计的机器学习流水线。模型本身只是端到端流水线中的众多组件之一。机器学习工作流程的其他组件包括数据收集、数据验证与预处理、特征提取、模型选择、训练与验证、预测、评估以及部署。本章的重点是构建机器学习模型。


    ## 通用概念


    在本节中，我们将讨论适用于大多数机器学习模型构建实践的通用概念。


    ### 数据预处理：归一化与标准化


    为了构建机器学习模型，我们需要对数据进行预处理，以确保机器学习算法的计算稳定性。数据预处理中的一个重要步骤是重新缩放输入特征和输出变量（针对回归问题），使其范围保持一致，然后再将其作为输入提供给机器学习算法。为了理解这一概念，我们考虑一个输入特征或输出变量具有不同数据范围的示例。在训练过程中，我们可能会遇到一个范围很大的输入特征，例如累计产量（范围从
    1000 桶到 100,000 桶）。而另一个特征的范围可能非常小，例如孔隙度（范围从 0.05 到 0.60）。


    在迭代训练过程中，与较大值输入特征相关联的模型参数（例如系数或权重）会与较小值输入特征对应的参数存在显著差异。此外，如果输出变量的范围非常大，那么误差指标（如
    RMSE）可能会产生非常大的数值。当使用这个较大的误差值来调整已经相当大的模型参数时，在模型参数的迭代更新过程中，某些值可能会超出计算机能够处理的数值极限。这可能导致计算不稳定，最终导致学习过程中的性能不佳。对输入值的高度敏感还可能引发严重的泛化误差[4]。


    在处理具有不同单位和范围的多个特征的数据时，对数据进行预处理以实现更快的训练至关重要，这有助于减少过拟合并获得更准确的预测。例如，在梯度下降优化过程的收敛中就可以观察到这一点[5]。


    scikit-learn 库中提供了多种方法，例如标准化、归一化和缩放，可以帮助高效地处理数据。预处理方法的选择取决于算法和参数优化过程。需要提醒的是：这些术语在不同领域的习惯用法中经常互换使用。


    #### 归一化


    归一化是将数据从原始范围重新缩放，使其值落在 0 到 1 或-1 到 1 范围内的过程。当已知数据的近似上下界、数据中几乎没有或没有异常值、且数据分布接近均匀分布时，可以应用此方法。scikit-learn
    库提供的用于缩放数据的工具之一是`MinMaxScaler()`，它使用以下公式。


    ![$$ {X}_{norm}=\frac{X- Xmin}{Xmax- Xmin}. $$](img/480430_1_En_3_Chapter_TeX_Equ1.png)


    (3.1)


    #### 标准化（Z 分数归一化）


    当特征被重新缩放，使其具有均值为零、标准差为一的标准正态分布（钟形曲线的高斯分布）特性时，这个过程称为*标准化*。当机器学习算法假设输入数据呈正态分布时，这一点非常重要。在这种方法中，重新缩放后的值通过以下公式计算。


    ![$$ z=\frac{x-\mu }{\sigma }, $$](img/480430_1_En_3_Chapter_TeX_Equ2.png)


    (3.2)


    *其中*z 是标准 Z 分数，*x*是输入数据，*μ*是输入数据的样本均值，*σ*是均值标准差。此方法适用于特征分布中不包含极端异常值的情况。


    ### 欠拟合或过拟合


    当我们训练机器学习模型时，主要目标之一是将其用于对未见过的数据进行预测。一个训练充分的模型应该对未见过的数据展现出与训练数据相同的预测精度。然而，在某些情况下，模型可能无法在未见过的数据上表现良好。这可能是由模型的欠拟合或过拟合引起的。


    *   **欠拟合：** 当训练过程过早停止，或者模型接触训练数据不足时，就会发生欠拟合。在这种情况下，模型无法学习到训练数据中存在的通用模式。在训练数据和未见过的数据上预测精度都很差，是欠拟合的指标。


    *   **过拟合：** 人们可能会选择使用训练数据集中的所有可用数据对模型进行大量迭代训练，以便模型学习到训练数据中存在的所有模式。结果，模型可能在训练数据上展现出非常高的精度。然而，模型对训练数据调整得过于精细，以至于失去了对未见过的数据进行泛化的能力。在这种情况下，即使模型能够以高精度对训练数据进行预测，它对未见过的数据的预测精度也很差。这种情况表明模型过拟合。


    确保模型既不欠拟合也不过拟合非常重要。机器学习模型应该得到充分训练，以便能够以合理的精度对未见过的数据进行预测。换句话说，机器学习模型应该能够进行*泛化*。

    '
- fmt: '### Data Splitting: Training, Validation, and Test Datasets


    As we just discussed, overfitting is one of the big challenges encountered during
    the training of machine learning models. This is a result of training the model
    on minute details/noise present in the training data. In such scenarios, the model
    begins to memorize the training data. This leads to good performance on training
    data, but the accuracy of the model significantly drops for unseen data. To account
    for overfitting and help the models become more *generalized*, splitting the dataset
    is considered a necessary step. As a rule of thumb, a dataset is often broken
    down into three sets of observations: training, validation, and test data [[6](#480430_1_En_3_Chapter.xhtml#Par232)],
    which are defined as follows.


    - **Training data:** A subset of observations used for the model training process.
    This dataset is used by the algorithm to learn the parameters of the machine learning
    model.

    - **Validation data:** A subset of observations, which is used for evaluating
    the prediction performance of the model during the training process. The trend
    observed in prediction errors using the validation data can help in identifying
    the number of iterations for adequate training. In a typical model training, the
    prediction error should keep on decreasing for both the training and validation
    dataset through the iterative training process. However, if we observe a point
    where prediction error continues to decrease for the training data but starts
    to increase for the validation data, training should be stopped. The point from
    where the validation error begins to increase indicates the beginning of overfitting.

    - **Test data:** This is the subset of data that is only used to assess the performance
    of a fully trained model. The prediction accuracy on the test data is an indicator
    of the model’s performance on unseen data encountered in a real-world scenario.


    The following code snippet shows the application of a scikit-learn utility for
    splitting the dataset.


    ```

    from sklearn.model_selection import train_test_split

    X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42)

    ```


    ### Model Evaluation Metrics


    To understand how well the model generalizes on an unseen dataset, and to evaluate
    its performance, it is important to use a quantitative metric based on which model
    performance can be evaluated.


    In this section, we discuss some evaluation metrics to quantify the prediction
    accuracy of a model, based on which best-performing algorithm is selected. The
    metrics are also dependent on the type of problem. For quantitative outcomes in
    a regression model, some of the commonly used metrics include the coefficient
    of determination (`R²`), and root-mean-squared error (`RMSE`). `R²` is calculated
    using the following equation.


    ![$$ {R}^2=1-\frac{S{S}_{res}}{S{S}_{tot}}. $$](images/480430_1_En_3_Chapter/480430_1_En_3_Chapter_TeX_Equ3.png)


    (3.3)


    `SS[res]` is the residual sum of squares, and `SS[tot]` is the total sum of squares
    mathematically calculated using the following expressions.


    ![$$ S{S}_{res}=\sum {\left({y}_i-{y}_{reg}\right)}^2, $$](images/480430_1_En_3_Chapter/480430_1_En_3_Chapter_TeX_Equ4.png)


    (3.4)


    ![$$ S{S}_{tot}=\sum {\left({y}_i-\overline{y}\right)}^2\. $$](images/480430_1_En_3_Chapter/480430_1_En_3_Chapter_TeX_Equ5.png)


    (3.5)


    Here, `y[i]` is the value of each data point, `ȳ` is the mean value, and `y[reg]`
    is the value predicted by the regression model.


    On the other hand, the `RMSE` metric is calculated by using the following equation.


    ![$$ RMSE=\sqrt{\sum \limits_{i=1}^n\frac{{\left(\hat{y_i}-{y}_i\right)}^2}{N}},
    $$](images/480430_1_En_3_Chapter/480430_1_En_3_Chapter_TeX_Equ6.png)


    (3.6)


    where `ŷ[i]` is the value predicted by the regression model, and `N` is the number
    of observations.


    For classification problems, the model accuracy is defined as the ratio of the
    number of correct predictions to the total number of predictions. For a classification
    problem with `N` different classes, a *confusion matrix* or an *error matrix*
    is also used, which is an `N × N` matrix containing `N` correct classifications
    on major diagonal and rest of the possible errors on off-diagonal entries. This
    matrix provides a visual approach to evaluate the performance of a machine learning
    model for classification problems. An illustration of a confusion matrix for binary
    classification (two classes) is shown in Figure [3-1](#480430_1_En_3_Chapter.xhtml#Fig1).


    ![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig1_HTML.jpg](images/480430_1_En_3_Chapter/480430_1_En_3_Fig1_HTML.jpg)


    Figure 3-1


    An illustration of confusion matrix, where P = positive, N = negative, TP = true
    positive; FP = false positive; TN = true negative; FN = false negative


    Based on the matrix, some accuracy metrics can be determined, which include precision,
    recall, and F1-score.


    #### Precision


    Precision is defined as the ratio of the number of true positive (correctly predicted)
    samples for a given class to the total number of samples predicted to be of that
    class. A high precision output indicates that out of the samples predicted to
    belong to a given class by the model, most of the samples belonged to that class.


    ![$$ Precision=\frac{True\ Positive}{True\ Positive+ False\ Positive}. $$](images/480430_1_En_3_Chapter/480430_1_En_3_Chapter_TeX_Equ7.png)


    (3.7)


    #### Recall


    Recall is defined as the ratio of the number of true positive samples to the total
    number of samples belonging to that class. A high recall indicates that very few
    samples belonging to a given class were misclassified as belonging to another
    class.


    ![$$ Recall=\frac{True\ Positive}{True\ Positive+ False\ Negative}. $$](images/480430_1_En_3_Chapter/480430_1_En_3_Chapter_TeX_Equ8.png)


    (3.8)


    #### F1-Score


    The F1-score provides a harmonic mean of precision and recall. During model selection,
    the model with the highest F1-score is selected among multiple classification
    algorithms.


    ![$$ F1=2\times \frac{Precision\times Recall}{Precision+ Recall}. $$](images/480430_1_En_3_Chapter/480430_1_En_3_Chapter_TeX_Equ9.png)


    (3.9)


    ### Reproducible Machine Learning


    Machine learning algorithms provide a better predictive capability to a set of
    an industrially relevant problem than their conventional counterparts. However,
    for industrial adoption, it is important to ensure that the model training and
    predictions generated by the models are exactly reproducible. Sometimes, even
    while working on the same dataset and same algorithm, it may be difficult to reproduce
    the results and obtain the same performance.


    These discrepancies can be attributed to several reasons, such as random initialization
    of weights, random shuffling of datasets, and stochastic nature of several machine
    learning algorithms. To address this issue, carefully setting the *random seed*
    as a part of machine learning algorithm implementation can take us one step closer
    to achieving reproducibility. Some examples of setting a random seed for an operating
    system environment variable, Python random module, NumPy, and TensorFlow, are
    shown in the following code snippet.


    ```

    seed_value = 42

    # Set Python random seed using environment variable

    os.environ[''PYTHONHASHSEED'']=str(seed_value)

    import random

    # Set Python random seed using Python random module

    random.seed(seed_value)

    import numpy as np

    np.random.seed(seed_value) # Set Numpy random seed

    import tensorflow as tf

    tf.random.set_seed(seed_value) # Set TensorFlow random seed

    ```'
