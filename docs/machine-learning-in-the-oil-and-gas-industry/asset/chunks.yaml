    for the operating system installed on your computer, from the Anaconda distribution
    download website [[2](#480430_1_En_2_Chapter.xhtml#Par135)]. Anaconda distribution
    has most of the required Python libraries, and it comes with the added benefit
    of package management, which ensures that the versions of different libraries
    installed in your Python environment are compatible with each other. Detailed
    installation instructions are provided in [[3](#480430_1_En_2_Chapter.xhtml#Par136)].


    Once you have installed Anaconda distribution successfully, we suggest that you
    downgrade Python version to 3.6 by executing the following set of commands from
    Anaconda Prompt, which can be accessed from the program/start menu and is also
    shown in Figure [2-1](#480430_1_En_2_Chapter.xhtml#Fig1).


    ![../images/480430_1_En_2_Chapter/480430_1_En_2_Fig1_HTML.jpg](images/480430_1_En_2_Chapter/480430_1_En_2_Fig1_HTML.jpg)


    Figure 2-1


    Installation of Python version 3.6 using Anaconda prompt


    ```

    > conda update --all

    > conda install python=3.6

    ```


    These steps ensure that you have the Python version 3.6, which is required to
    install some of the machine learning libraries used later in Chapter [3](#480430_1_En_3_Chapter.xhtml).
    At this point, you should have all the Python libraries necessary to work through
    the rest of this chapter. Now, let’s get familiar with the Jupyter Notebooks.


    ## Jupyter Notebooks


    A Jupyter Notebook, or simply *notebook*, provides an interactive way to write
    and execute Python code in a web-based interface. Notebooks also allow you to
    write markdowns, which makes it easier to share information about the code. If
    you want to make an attractive notebook, you can include images and other formatted
    text in the markdown cells. However, we are going to keep our focus on the Python
    code. To launch a new Jupyter Notebook for this chapter, navigate to the directory
    containing data and book source code in the command prompt or terminal, and use
    the following command:


    ```

    > jupyter notebook

    ```


    You should see an Internet browser window opening with a dashboard, as shown in
    Figure [2-2](#480430_1_En_2_Chapter.xhtml#Fig2).


    ![../images/480430_1_En_2_Chapter/480430_1_En_2_Fig2_HTML.jpg](images/480430_1_En_2_Chapter/480430_1_En_2_Fig2_HTML.jpg)


    Figure 2-2


    Jupyter Notebook dashboard being displayed in a web browser


    Once you have successfully launched the notebook dashboard, locate and click the
    New button on the right-hand side of the dashboard, and select **Python 3** under
    Notebook:. You should see a notebook opening in a new browser tab, as shown in
    Figure [2-3](#480430_1_En_2_Chapter.xhtml#Fig3).


    ![../images/480430_1_En_2_Chapter/480430_1_En_2_Fig3_HTML.jpg](images/480430_1_En_2_Chapter/480430_1_En_2_Fig3_HTML.jpg)


    Figure 2-3


    A new Jupyter Notebook being displayed in a web browser


    *Congratulations!* You have created your first Jupyter Notebook. In the web-based
    interface, you can see the menubar with different tabs, such as File, Edit, and
    so forth. Below the menubar, a toolbar provides the option to create new cells
    (denoted by the button with the **+** sign), which may be a code cell, a markdown
    cell, or other depending upon the selection made in the toolbar dropdown with
    the relevant options. While code cells contain regular Python code, markdown cells
    may contain a plain or formatted text description of the functionality being developed
    in the notebook. A cell can be executed by hitting Ctrl+Enter, or Alt+Enter. If
    you hit Ctrl+Enter, the code or markdown in the current cell is executed. However,
    if you hit Alt+Enter, a new cell is inserted below the current cell in addition
    to the execution of the code or markdown in the current cell.'
  trans: '

    # 2. Python 编程入门


    在上一章中，我们讨论了石油和天然气行业面临的一些挑战，而机器学习可以提供数据驱动的洞察和解决方案。然而，在实施这些解决方案之前，你需要学习如何编写适用的机器学习算法代码。这使得在深入机器学习之前，必须先理解一门计算机编程语言。


    有多种编程语言可用于跨行业开发机器学习解决方案和应用。Python、R、Java、C/C++、Julia、Scala、Go 和 Lua 是用于开发机器学习算法和应用的领先语言中的一部分。在这些语言中，截至
    2019 年，Python 拥有最大的机器学习从业者社区。这种情况会随时间改变吗？也许在遥远的未来，另一种编程语言会在受欢迎程度上超越 Python。我们避免陷入关于哪种编程语言更好或更差的争论，因为这并非本书的意图。应该承认，每种编程语言都有其自身的优点和缺点。然而，鉴于
    Python 提供的丰富机器学习生态系统和活跃社区，在学习机器学习算法时学习 Python 具有实际意义。


    Python 具有以下特性。


    *   **平台无关性**。在一个平台上编写的 Python 代码可以在另一个平台上运行。这意味着，如果你在 Windows 操作系统上编写了代码，若想在
    Linux 操作系统上运行，无需重写。Python 已被移植到几乎所有常用的平台。不过，对于与操作系统和文件系统相关的功能，可能需要进行一些微小的调整。


    *   **解释型语言**。你无需在运行 Python 代码之前显式地编译它。Python 代码由解释器执行，解释器负责将 Python 代码转换为字节码。


    *   **高级语言**。在编写 Python 代码时，你无需担心复杂的系统级细节，例如在程序执行期间如何分配或释放内存。Python 为大量通用函数提供了抽象，使你能够更多地关注编程逻辑，而不是系统或硬件级别的细节。


    *   **开源**。Python 是免费分发的，甚至可用于商业目的。任何人都可以查看和修改 Python 源代码。一个庞大的开发者社区不断为丰富的 Python
    生态系统贡献新的功能和特性，用于通用计算和机器学习。


    *   **面向对象**。Python 支持面向对象的编程范式，你可以使用一组变量和函数来定义现实世界实体的数据结构和行为。我们将在本章后面提供更多细节。


    *   **动态类型**。在 Python 中定义变量时，你无需担心定义其数据类型。简单来说，你不需要描述一个变量是整数还是带小数的实数（浮点数）。Python
    会动态地为变量分配数据类型。


    *   **会话式语法**。Python 语法直观且具有会话风格。举个例子，如果你想查看一个数字是否存在于一个数字列表中，你可以编写 `if 5 in [1,
    2, 3, 4, 5]`，结果将是 `True`。


    *   **易于学习**。Python 的特性使其成为一种易于学习的编程语言。虽然精通 Python 可能需要付出巨大努力，但与本章前面提到的大多数其他编程语言相比，入门
    Python 的学习曲线更短。


    在我们开始用 Python 编写代码之前，我们需要安装 Python 并设置编程环境。下一节将引导你在计算机上完成 Python 的安装过程。


    ## 安装与环境设置


    在选择 Python 安装程序时，有很多选项可供选择。对于本书，我们建议从 Anaconda 发行版下载网站 [2] 获取适用于你计算机操作系统的最新 Python
    3.x 安装程序。Anaconda 发行版包含了大部分所需的 Python 库，并且还附带包管理的额外好处，这确保了安装在 Python 环境中的不同库的版本彼此兼容。详细的安装说明在
    [3] 中提供。


    成功安装 Anaconda 发行版后，我们建议你通过从 Anaconda Prompt（可以从程序/开始菜单访问，如图 2-1 所示）执行以下命令集，将 Python
    版本降级到 3.6。


    ![../images/480430_1_En_2_Chapter/480430_1_En_2_Fig1_HTML.jpg](img/480430_1_En_2_Fig1_HTML.jpg)


    图 2-1


    使用 Anaconda Prompt 安装 Python 3.6 版本


    ```

    > conda update --all

    > conda install python=3.6

    ```


    这些步骤确保你拥有 Python 3.6 版本，这是安装稍后在第 3 章中使用的一些机器学习库所必需的。至此，你应该拥有完成本章剩余部分所需的所有 Python
    库。现在，让我们熟悉一下 Jupyter Notebook。


    ## Jupyter Notebook


    Jupyter Notebook，或简称为 *notebook*，提供了一种在基于 Web 的界面中交互式编写和执行 Python 代码的方式。Notebook
    还允许你编写 Markdown，这使得共享有关代码的信息更加容易。如果你想制作一个吸引人的 notebook，可以在 Markdown 单元格中包含图像和其他格式化文本。但是，我们将把重点放在
    Python 代码上。要为本章启动一个新的 Jupyter Notebook，请在命令提示符或终端中导航到包含数据和本书源代码的目录，并使用以下命令：


    ```

    > jupyter notebook

    ```


    你应该会看到一个互联网浏览器窗口打开，并显示一个仪表板，如图 2-2 所示。


    ![../images/480430_1_En_2_Chapter/480430_1_En_2_Fig2_HTML.jpg](img/480430_1_En_2_Fig2_HTML.jpg)


    图 2-2


    在 Web 浏览器中显示的 Jupyter Notebook 仪表板


    成功启动 notebook 仪表板后，找到并单击仪表板右侧的 New 按钮，然后在 Notebook: 下选择 **Python 3**。你应该会看到一个新的
    notebook 在一个新的浏览器标签页中打开，如图 2-3 所示。


    ![../images/480430_1_En_2_Chapter/480430_1_En_2_Fig3_HTML.jpg](img/480430_1_En_2_Fig3_HTML.jpg)


    图 2-3


    在 Web 浏览器中显示的一个新的 Jupyter Notebook


    *恭喜！* 你已经创建了你的第一个 Jupyter Notebook。在基于 Web 的界面中，你可以看到带有不同选项卡的菜单栏，例如 File、Edit
    等。在菜单栏下方，工具栏提供了创建新单元格的选项（由带有 **+** 符号的按钮表示），该单元格可以是代码单元格、Markdown 单元格或其他类型，具体取决于工具栏下拉菜单中相关选项的选择。代码单元格包含常规的
    Python 代码，而 Markdown 单元格则可以包含对 notebook 中正在开发的功能的纯文本或格式化文本描述。可以通过按 Ctrl+Enter
    或 Alt+Enter 来执行单元格。如果按 Ctrl+Enter，当前单元格中的代码或 Markdown 将被执行。但是，如果按 Alt+Enter，除了执行当前单元格中的代码或
    Markdown 之外，还会在当前单元格下方插入一个新单元格。

