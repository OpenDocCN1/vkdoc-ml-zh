    ### Dimensionality Reduction


    Dimensionality reduction is an abstract concept, which is very useful for analyzing
    the datasets with an extremely high number of features. Dimensionality reduction
    is often performed to obtain better input features for machine learning algorithms.
    It improves computational efficiency without sacrificing much on the prediction
    capability of the models. Dimensionality reduction also removes the collinearity,
    which may exist between different features in the original data. Principal component
    analysis is an algorithm in this category.


    #### Principal Component Analysis


    Using the orthogonal transformation of features, *principal component analysis*
    (PCA) provides a statistical approach to reduce the number of dimensions in the
    input data by converting multiple linearly dependent features into linearly independent
    variables. These linearly independent variables are called *principal components*,
    which are orthogonal to each other.


    The first principal component explains maximum variance in the dataset, which
    further reduces with each succeeding component. This method comes with a caveat
    that the principal components often turn out to be less interpretable than the
    original features. It is to be noted that PCA is sensitive to scaling, and hence
    it is important to scale the features using methods discussed earlier in this
    chapter.


    Using the same dataset that we used earlier in this chapter, the following implementation
    shows that the first four principal components can explain approximately 86% of
    the sample variance.


    ```

    from sklearn.decomposition import PCA

    pca = PCA()

    X_train = pca.fit_transform(X_train)

    X_test = pca.transform(X_test)

    explained_variance = pca.explained_variance_ratio_

    print(explained_variance)

    ```


    **Results**


    ```

    Explained Variance

    [4.32302153e-01 2.49297862e-01 1.06117586e-01 7.90285832e-02

    4.83399458e-02 3.41638092e-02 2.32342217e-02 1.67907297e-02

    6.98516043e-03 2.81954933e-03 9.13677877e-04 6.64565466e-06

    7.64286168e-08]

    ```


    After the calculation of principal components, we use random forest classification
    to understand how reducing the number of input features following PCA affects
    the accuracy of machine learning models. Here, we compare the accuracy of predictions
    with all 12 features, with the prediction generated using the first four principal
    components. From the following code implementation results, reducing the number
    of input features to the first four principal components does not reduce prediction
    accuracy significantly.


    ```

    # Random Forest with entire data

    classifier = RandomForestClassifier(random_state=42)

    classifier.fit(X_train, y_train)

    # Predicting the Test set results

    y_pred = classifier.predict(X_test)

    print(confusion_matrix(y_test, y_pred))

    print(accuracy_score(y_test, y_pred))

    Accuracy with all features: 0.9377289377289377

    # Random Forest with only 4 components

    classifier_4comp = RandomForestClassifier(random_state=42)

    classifier_4comp.fit(X_train_4comp, y_train)

    # Predicting the Test set results

    y_pred_4comp= classifier_4comp.predict(X_test_4comp)

    print(confusion_matrix(y_test, y_pred_4comp))

    print(accuracy_score(y_test, y_pred_4comp))

    Accuracy with only first 4 principal components: 0.8974358974358975

    ```


