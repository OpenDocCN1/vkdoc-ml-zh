- fmt: '# Managing Rate Dependent Water Cut


    On many occasions, water cut (`WCT`) and gas/oil ratios (`GOR`) are rate-dependent
    phenomena that can be minimized at reduced rates. These phenomena can be the results
    of a higher mobility phase viscous fingering and/or coning.


    Water coning occurs when oil-water contact surface under the well forms a cone-shaped
    profile due to well’s pressure drawdown, overcoming oil/water gravity segregation.
    After a water breakthrough, coning increases water cut and reduces oil production
    and recovery significantly [[14](#480430_1_En_7_Chapter.xhtml#Par143)]. An operator
    may produce the well at a rate resulting in no water or gas breakthrough. This
    maximum production at a steady-state condition is known as the *critical oil rate*.
    Critical oil-rate guidelines restrict the short-term benefits; therefore, it is
    important to calculate it wisely, particularly in naturally fractured reservoirs
    (`NFRs`).


    Since `NFRs` with bottom-water drive are notorious for instant water-breakthrough
    and extremely high water cut, producing oil well below critical oil production
    rate may become non-economical when the rate is too low. So, there is a need to
    study the feasibility of critical oil rate production in `NFRs` [[14](#480430_1_En_7_Chapter.xhtml#Par143)].


    ## Predicting Critical Oil Rate


    A critical oil rate predictor was developed by modeling a wide variety of `NFRs`
    with bottom-water using a dual-porosity-dual-permeability (`DPDP`) model implemented
    on a commercial simulator [[15](#480430_1_En_7_Chapter.xhtml#Par144)]. Simulated
    input data showed that the critical oil rate for a few `NFRs` could be as high
    as 200 bopd, which is economical.


    The following steps were carried out in the development of a semi-analytical model
    of critical oil rate [[14](#480430_1_En_7_Chapter.xhtml#Par143)].


    1. Simplified the `NFR` by representing the fracture-network as an equivalent
    continuous porous media.

    2. Verified Chaperon’s mechanistic model [[16](#480430_1_En_7_Chapter.xhtml#Par145)]
    of critical rate with the simulated critical-rate values of `NFR` after replacing
    the permeability of matrix with an equivalent permeability of `NFR`.

    3. Calibrated the resulting mechanistic model statistically using a designed series
    of simulated experiments representing a wide variety of `NFRs`, to include the
    ignored physical effects.


    These steps resulted in a statistically calibrated mechanistic model [[16](#480430_1_En_7_Chapter.xhtml#Par145)]
    for critical oil rate in `NFRs` (`q[cr, fr]`), which can be written as Equation
    [7.2](#480430_1_En_7_Chapter.xhtml#Equ2).


    ```

    q_{cr, fr}=0.0783\times 10^{-4}\frac{k_{f,m}h_o^2}{B_o\mu_o}(\Delta \rho)\left(1-\left(\frac{h_{op}}{h_o}\right)^2\right)f\left(\frac{r_e}{h_o}\sqrt{\frac{k_{fv}}{k_{fh}}}\right)

    ```


    (7.2)


    Where, `k[f, m] = k[fh] + k[mh]`


    Where, `k[fh]` is the effective fracture permeability, md; `k[mh]` is the matrix
    permeability, md; `k[f, m]` is the average permeability of the `NFR`, md; `h[o]`
    is the oil-zone thickness, ft; `r[e]` is the reservoir radius, ft; `μ[o]` is the
    oil viscosity, cp; `B[o]` is the oil formation volume factor; `h[op]` is the perforated
    interval, ft; `k_{fv}/k_{fh}` is the anisotropy ratio of the fracture network;
    `q[cr, fr]` is the critical oil rate of on-fracture well in `NFR`.


    For determining the empirical component of the model (Equation [7.1](#480430_1_En_7_Chapter.xhtml#Equ1)),
    `f(r_e/h_o * sqrt(k_{fv}/k_{fh}))`, we design the series of simulated experiments
    by varying well-reservoir properties, including effective fracture permeability,
    matrix permeability, mobility ratio, reservoir radius, anisotropy ratio, and penetration
    ratio [[17](#480430_1_En_7_Chapter.xhtml#Par146)]. The Box-Behnken experimental
    design [[18](#480430_1_En_7_Chapter.xhtml#Par147)] [[19](#480430_1_En_7_Chapter.xhtml#Par148)],
    a three-level factorial design, creates the matrix of simulated experiments, which
    capture nonlinear effects while minimizing the number of experiments. To set-up
    the regression model, Equation 7-2 is rewritten in the form of a normalized critical
    rate `q̂_{cr, fr}`, as in (Equation [7.3](#480430_1_En_7_Chapter.xhtml#Equ3)).


    ```

    \hat{q_{cr, fr}}=\frac{q_{cr, fr}}{0.0783\times 10^{-4}\frac{k_{f,m}h_o^2}{B_o\mu_o}(\Delta
    \rho)\left(1-\left(\frac{h_{op}}{h_o}\right)^2\right)}=f\left(\frac{r_e}{h_o}\sqrt{\frac{k_{fv}}{k_{fh}}}\right)

    ```


    (7.3)'
