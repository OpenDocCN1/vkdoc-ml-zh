    inverse problem associated with it can be found in reference [[2](#480430_1_En_4_Chapter.xhtml#Par46)].


    A model for acoustic wave equation can be defined by the partial differential
    equation system shown in Figure [4-3](#480430_1_En_4_Chapter.xhtml#Fig3).


    ![../images/480430_1_En_4_Chapter/480430_1_En_4_Fig3_HTML.jpg](images/480430_1_En_4_Chapter/480430_1_En_4_Fig3_HTML.jpg)


    Figure 4-3


    Acoustic Wave Equation


    In the above system of equations, *u*(x, *t*) is the pressure field that is recorded
    by the hydrophones, *c*(x) is the wavespeed of sound waves (compressional waves)
    in the subsurface and *f*(x[s], *t*) is the source signature for the experiment
    described in the previous section. The system is solved with an appropriate set
    of initial conditions and boundary conditions.


    In the mathematical and geophysical literature, this linear system is called a
    forward problem as it gives the definition of a physical system for modeling the
    wave field, given the definition of wave speed in the earth''s subsurface. This
    is a well-studied and well defined problem with several centuries of academic history
    behind it. The interested reader is suggested to consult reference [[3](#480430_1_En_4_Chapter.xhtml#Par47)],
    and the references therein.


    However, the objective of seismic imaging is to solve the inverse of the problem
    as defined by the system above. The objective is to find a model that explains
    the data that has been recorded (Figure [4-4](#480430_1_En_4_Chapter.xhtml#Fig4)).
    Unlike the forward problem which is a linear problem, the inverse problem is a
    strongly nonlinear problem that is challenging to solve. Further, the solution
    to the inverse problem is non-unique. Non-uniqueness implies several models can
    reasonably explain the data that has been recorded.


    ![../images/480430_1_En_4_Chapter/480430_1_En_4_Fig4_HTML.jpg](images/480430_1_En_4_Chapter/480430_1_En_4_Fig4_HTML.jpg)


    Figure 4-4


    Inverse problem


    Figure [4-5](#480430_1_En_4_Chapter.xhtml#Fig5) shows the comparison of two broad
    classes of problems that form the discipline of seismic imaging. The problem of
    imaging is accurate positioning of reflectors while the problem of inversion is
    estimating a subsurface model (velocity and anisotropic properties) that explain
    the data that has been recorded in the subsurface.


    ![../images/480430_1_En_4_Chapter/480430_1_En_4_Fig5_HTML.jpg](images/480430_1_En_4_Chapter/480430_1_En_4_Fig5_HTML.jpg)


    Figure 4-5


    Imaging and Inversion


    ### Physical Properties of Sedimentary Rocks


    In sedimentary rocks , compressional velocity varies significantly, and heterogeneity
    is observed on all scales. Figure [4-6](#480430_1_En_4_Chapter.xhtml#Fig6) shows
    the velocity profile from a well from onshore United States. The variation in
    velocity can be observed on various scales, varying across several orders of magnitude
    - from micrometers to millimeters to kilometers.


    ![../images/480430_1_En_4_Chapter/480430_1_En_4_Fig6_HTML.jpg](images/480430_1_En_4_Chapter/480430_1_En_4_Fig6_HTML.jpg)


    Figure 4-6


    Multiscale heterogeneity of rock properties (Data courtesy: TGS)


    In order to study the nonlinear inverse problem defined in the equation system
    shown in Figure [4-4](#480430_1_En_4_Chapter.xhtml#Fig4), a perturbation approach
    is used to study the scattering caused by the subsurface. Born approximation is
    a technique originally used in quantum mechanics to study scattering by an extended
    body. It is shown to be accurate when the size of the scatterers is small compared
    to the wavelength. Interested readers are referred to the reference [[2](#480430_1_En_4_Chapter.xhtml#Par46)].


    Velocity model can be separated according to scales. A smooth macromodel that
    contains the long-scale component of velocity. Typically, this is in the form
    of a smooth background. The scatterers are represented in the form of an oscillatory
    perturbation above the smooth background, which represents the high-frequency
    component of the velocity. This model of the subsurface models single scattering
    only. In other words, these model the primary reflected waves. A careful treatment
    of Born approximation is beyond the scope of this introductory discussion on seismic
    imaging. The interested reader is referred to reference [[2](#480430_1_En_4_Chapter.xhtml#Par46)]
    for details.'
  trans: '

    ## 地震反射实验


    地震波在地球内部的反射和折射现象，最早是在记录地震产生的地震波的地震仪上观测到的。地震反射实验的基本原理是向地下发射波，并用数千个传感器进行记录。图 4-1
    展示了一个用于在海洋环境中采集反射数据的实验示意图。使用爆炸性能源发射波，这些波会从地下的不同界面反射回来。来自关键地层的这些反射波被传感器记录下来。如图中所示，数千个传感器由拖缆拖曳。


    ![../images/480430_1_En_4_Chapter/480430_1_En_4_Fig1_HTML.jpg](img/480430_1_En_4_Fig1_HTML.jpg)


    **图 4-1**


    海洋地震反射实验示意图（来源：美国国家科学基金会）


    图 4-2 展示了一个由地震实验记录的样本记录示例。这种类型的数据记录被称为“炮集记录”，因为它对应于一次爆炸，并记录了由此产生的反射波。对于一个典型的海洋实验，在一个区域内会采集数千个这样的炮集记录。


    ![../images/480430_1_En_4_Chapter/480430_1_En_4_Fig2_HTML.jpg](img/480430_1_En_4_Fig2_HTML.jpg)


    **图 4-2**


    炮集：由单个地震实验捕获的数据（来源：地震成像导论）


    地震处理的目标是利用如图 4-2 所示的传感器数据，生成地下的图像，并估算地球的物理属性。通常，目标是估算穿过地球的压缩波的速度，因为该速度是波长尺度上储层属性的一个替代指标。将这些炮集记录转换为地球图像的过程称为成像。在生成地下图像的过程中，通过一个称为地球模型构建的过程来估算地下属性也至关重要。关于地震采集问题及其各种挑战的概述，请参考文献
    [1]。


    ## 反问题：成像与速度模型构建


    记录 PB 级地震数据的目标是获取地球地下的图像，并估算地下的物理属性。用于模拟地下波传播的最小模型由声波方程给出。存在更复杂的模型用于精确模拟波传播，但这些模型超出了本入门章节的范围。关于基于波动方程的成像及其相关反问题的优秀数学概述，可参考文献
    [2]。


    声波方程的模型可以通过图 4-3 所示的偏微分方程组来定义。


    ![../images/480430_1_En_4_Chapter/480430_1_En_4_Fig3_HTML.jpg](img/480430_1_En_4_Fig3_HTML.jpg)


    **图 4-3**


    声波方程


    在上述方程组中，*u*(x, *t*) 是水听器记录的压力场，*c*(x) 是地下声波（压缩波）的波速，*f*(x[s], *t*) 是上一节所述实验的震源子波。该方程组需结合适当的初始条件和边界条件来求解。


    在数学和地球物理学文献中，这个线性系统被称为正问题，因为它给出了一个物理系统的定义，用于在给定地下波速定义的情况下模拟波场。这是一个经过充分研究且定义明确的问题，拥有数个世纪的学术历史。感兴趣的读者可查阅参考文献
    [3] 及其中的参考文献。


    然而，地震成像的目标是求解上述系统所定义问题的反问题。其目标是找到一个能够解释已记录数据的模型（图 4-4）。与线性问题的正问题不同，反问题是一个强非线性问题，求解起来颇具挑战性。此外，反问题的解是非唯一的。非唯一性意味着可能存在多个模型都能合理地解释已记录的数据。


    ![../images/480430_1_En_4_Chapter/480430_1_En_4_Fig4_HTML.jpg](img/480430_1_En_4_Fig4_HTML.jpg)


    **图 4-4**


    反问题


    图 4-5 展示了构成地震成像学科的两大类问题的比较。成像问题是精确确定反射体的位置，而反演问题是估算一个能够解释地下已记录数据的地下模型（速度和各向异性属性）。


    ![../images/480430_1_En_4_Chapter/480430_1_En_4_Fig5_HTML.jpg](img/480430_1_En_4_Fig5_HTML.jpg)


    **图 4-5**


    成像与反演


    ### 沉积岩的物理性质


    在沉积岩中，压缩波速度变化显著，并且在所有尺度上都能观察到非均质性。图 4-6 显示了来自美国陆上某口井的速度剖面。可以在不同尺度上观察到速度的变化，其变化范围跨越多个数量级——从微米到毫米再到公里。


    ![../images/480430_1_En_4_Chapter/480430_1_En_4_Fig6_HTML.jpg](img/480430_1_En_4_Fig6_HTML.jpg)


    **图 4-6**


    岩石属性的多尺度非均质性（数据来源：TGS）


    为了研究图 4-4 所示方程组中定义的非线性反问题，采用微扰方法来研究地下引起的散射。Born 近似是一种最初用于量子力学中研究扩展体散射的技术。当散射体尺寸相对于波长较小时，该近似被证明是准确的。感兴趣的读者可参考文献
    [2]。


    速度模型可以根据尺度进行分离。一个平滑的宏观模型包含了速度的长尺度分量。通常，这表现为一个平滑的背景。散射体则以平滑背景之上的振荡微扰形式表示，代表了速度的高频分量。这种地下模型仅模拟单次散射。换句话说，这些模型模拟了主要的反射波。对
    Born 近似的详细处理超出了本次地震成像入门讨论的范围。有关详细信息，感兴趣的读者可参考文献 [2]。

    '
- fmt: '### Imaging and Inversion


    The objective of this section is to offer an insight into the process of velocity
    estimation, and imaging scatterers in the subsurface. Given the data recorded
    on the subsurface and a smooth background velocity model, the goal of imaging
    is to find the reflectivity of the subsurface. This is a linear inverse problem,
    and several methods exist to image the scatterers in the subsurface.


    To accurately identify the reflectors in the subsurface, it is also essential
    to have an accurate velocity model. Given the data recorded on the surface, the
    goal of velocity inversion is to find a smooth background velocity model that
    explains the data recorded on the surface. This is a much harder problem than
    imaging, and is strongly nonlinear. In practice, the process of estimating reflectors
    and updating the velocity model is solved in an iterative loop till certain criteria
    are met.


    The linear inversion problem for positioning the reflectors in the subsurface
    is approximated in practice. The mathematical details are beyond the scope of
    this introductory material on imaging. An approximate inverse is computed and
    this process is called as `migration`. There are several migration algorithms
    that are currently used, including, Kirchhoff migration, reverse time migration,
    wave equation migration, etc. The goal is to backward propagate the receiver wavefield
    and forward propagate the source wavefield, and the image is the cross-correlation
    of the wavefields at various values of `timelag`. The resulting zero lag value
    is the image (Figure [4-7](#480430_1_En_4_Chapter.xhtml#Fig7)).


    ![../images/480430_1_En_4_Chapter/480430_1_En_4_Fig7_HTML.jpg](images/480430_1_En_4_Chapter/480430_1_En_4_Fig7_HTML.jpg)


    Figure 4-7


    Overview of migration


    A common technique to estimate the velocity properties of the subsurface is to
    use a method called as Full Waveform Inversion. It is an iterative method to match
    the data recorded on the surface in a certain frequency range. This technique
    computes the smooth part of the velocity model, and like most strongly nonlinear
    optimization problems is very sensitive to the choice of the initial model. Owing
    to the bandlimited nature of the data, this approach results in a smooth solution
    and cannot resolve structures on all scales. Reference [[4](#480430_1_En_4_Chapter.xhtml#Par48)]
    describes the challenges of building a velocity model in the Gulf of Mexico. A
    velocity model obtained from Full Waveform Inversion at Atlantis Field in Gulf
    of Mexico from reference [[4](#480430_1_En_4_Chapter.xhtml#Par48)] is shown in
    Figure [4-8](#480430_1_En_4_Chapter.xhtml#Fig8).


    ![../images/480430_1_En_4_Chapter/480430_1_En_4_Fig8_HTML.jpg](images/480430_1_En_4_Chapter/480430_1_En_4_Fig8_HTML.jpg)


    Figure 4-8


    Velocity model derived from full waveform inversion [4]


    Due to the bandlimited nature of the data, an accurate starting model is important
    to solve this optimization problem to avoid being stuck at a local minima. The
    optimization problem is formulated with the assumption that the observed and predicted
    waveforms are within half a wavelength at the lowest frequency. However, lack
    of low frequency information in seismic data results in cycle-skipping, which
    results in the problem getting stuck at local minima instead of reaching the global
    minima. This problem is harder to solve in basins, such as, the Gulf of Mexico,
    which contains velocity contrasts owing to the presence of complex structures
    of salt that make the optimization problem challenging to solve (Figure [4-9](#480430_1_En_4_Chapter.xhtml#Fig9)).


    ![../images/480430_1_En_4_Chapter/480430_1_En_4_Fig9_HTML.jpg](images/480430_1_En_4_Chapter/480430_1_En_4_Fig9_HTML.jpg)


    Figure 4-9


    Challenges of lack of low frequency


    ### Overcoming Low Frequency Challenges


    Over the last several years, there has been rapid technological growth in seismic
    acquisition technology. There has been a marked improvement in the range of coverage
    and azimuths (angles) over the course of last two decades -- near azimuth acquisition,
    wide azimuth acquisition, full azimuth acquisition are some examples of the operational
    innovations over the last couple of decades. Further, there have been several
    attempts to broaden the frequency range of acquisition over the last several years.
    Low frequency data is crucial as it helps avoid the optimization problem being
    stuck at a local minima. Hence, several attempts have been made in the last few
    years to acquire low frequency data. But, acquisition technologies are extremely
    expensive and can be a challenge to implement on a sufficiently large scale. However,
    in cases where low frequency data is not available, starting with better initial
    velocities and having an *a priori* structure of the velocity model helps in accelerating
    the convergence.


    Salt interpretation is a challenging task in the building of velocity models for
    building the structure. The state-of-the-art methods in salt interpretation involve
    using manual interpretation by a trained team of geologists and domain experts,
    who serve to impose their knowledge of geological priors on the inverse problem.
    However, given the iterative nature of the inverse problem, it is required for
    the interpreters to pick the structure of the salt after every single application
    of imaging. The process of picking the structure of the salt is a time intensive
    problem that is critical to building accurate seismic velocity models.'
