    #### 人工神经网络


    人工神经网络建立在人脑神经元决策能力原理之上，它们是更复杂的深度学习网络的基础构建模块。神经网络架构包含一个输入层、一个或多个隐藏层以及一个输出层。每一层都由神经元构成，计算就在这些神经元中进行。


    在本章稍后的部分，我们将更详细地讨论人工神经网络及其在深度学习中的应用。在以下代码示例中，构建了一个多层感知器模型，该模型将误差反向传播原理作为主要学习机制。


    在误差反向传播过程中，模型预测中的估计误差会被反向传播，以调整神经网络模型参数，并计算出更新后的模型参数。这个迭代训练过程会持续进行，直到满足模型精度或训练时长的特定条件。图
    3-15 展示了基于以下代码构建的神经网络模型所获得的预测结果图。


    ```

    # 多层感知器 – 回归

    import tensorflow as tf

    from tensorflow import keras

    from tensorflow.keras import layers

    def build_model():

    ann_reg = keras.Sequential([

    layers.Dense(32, activation="relu", input_shape=[len(X_train.keys())]),

    layers.Dense(32, activation="relu"),

    layers.Dense(1) ])

    optimizer = tf.keras.optimizers.RMSprop(0.001)

    ann_reg.compile(loss=''mse'', optimizer=optimizer, metrics=[''mse''])

    return ann_reg

    ```


    **结果**


    ```

    平均绝对误差: 80.5055592187044

    均方误差: 51228.191722683405

    均方根误差: 226.33645690140906

    R 平方: 0.8221552194654382

    ```


    这里构建的基础神经网络模型的精度，可能不如本章前面讨论的一些更简单的模型。随着机器学习模型复杂度的增加，充分训练它们的任务也变得更加具有挑战性。为了充分训练一个*深度*神经网络模型，我们需要遵循超参数优化的流程，这将在本章后面讨论。


    ![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig15_HTML.jpg](img/480430_1_En_3_Fig15_HTML.jpg)


    图 3-15


    人工神经网络回归结果，以回归图和散点图形式展示


