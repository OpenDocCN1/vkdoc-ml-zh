    这个例子向我们展示了 MLP 可以生成一个用于识别图像的模型，其正确率约为 70%。然而，MLP 并非专门用于图像识别任务的算法。接下来，我们将讨论一种专门用于图像识别和其他通用计算机视觉应用的深度神经网络架构。


    ### 卷积神经网络（CNN）


    只有在 2D 或 3D 上下文中同时观察图像像素时，才能实现物体的视觉识别。我们使用 MLP 进行图像分类任务。尽管 MLP 的表现比抛硬币要好，但它生成的预测无法用于任何实际应用。这种较低的准确率源于
    MLP 在查看图像时缺乏空间上下文。


    卷积神经网络（CNN）是一种专门的神经网络，它通过执行允许在学习过程中包含空间上下文的计算来学习识别物体。CNN 是使用卷积层构建的。虽然训练 CNN 的大部分方面与训练
    MLP 相似，但神经网络架构存在显著差异。


    图 3-25 总结了与 CNN 架构相关的一些重要概念。在 CNN 的卷积层中，卷积滤波器遍历图像以提取图像特征，这有助于识别给定图像所属的类别。


    ![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig25_HTML.jpg](img/480430_1_En_3_Fig25_HTML.jpg)


    图 3-25


    (a) 图像和卷积滤波器，(b) 卷积操作，(c) 步长，(d) 图像周围的零填充，以及 (e) 在卷积层上进行的特征提取的概念性表示


    以下是图 3-25 中所示与 CNN 相关的一些重要概念。


    *   **Filter（滤波器）：** 一个方形权重矩阵通常代表卷积层中的一个滤波器。CNN 训练过程的主要目标之一是学习卷积滤波器的最优权重。


    *   **Convolution（卷积）：** 在卷积操作期间，计算图像重叠像素与滤波器之间逐元素乘积的总和。该值被分配给重叠图像块的中心像素（见图 3-25-b）。


    *   **Stride（步长）：** 滤波器可以一次移动一个像素来遍历图像，或者可以跳过中间的几个像素。滤波器在图像上遍历时一次移动的像素数称为*步长*（见图
    3-25-c）。


    *   **Padding（填充）：** 当滤波器遍历图像时，由于边缘处没有重叠单元，它会减小图像的尺寸。在某些需要保持图像尺寸的场景中，可以在图像边缘填充零（见图
    3-25-d）。对于大小为*W* × *W*的图像，由大小为*F* × *F*的滤波器以步长*S*遍历，并在图像边缘填充*P*个单元，输出图像的尺寸可通过![$$
    \left[\frac{W-K+2P}{S}\right]+1\. $$](images/480430_1_En_3_Chapter/480430_1_En_3_Chapter_TeX_IEq3.png)计算。


    当图像通过多个卷积层处理时，滤波器会提取出图像中的区分性特征，使得更容易将样本数据中的一个类别与其他类别区分开来（见图[3-25](https://doi.org/10.1007/978-1-4842-6094-4_2Fig#25)-e）。以下代码片段展示了用于对
    SFO 数据集中的图像进行分类的 CNN 模型。


    ```

    model = Sequential()

    model.add(Conv2D(96, (5, 5), activation="relu",

    input_shape=(IMG_DIM, IMG_DIM, 1)))

    model.add(MaxPooling2D((2, 2)))

    model.add(Conv2D(128, (5, 5), activation="relu"))

    model.add(MaxPooling2D((2, 2)))

    model.add(Conv2D(128, (5, 5), activation="relu"))

    model.add(MaxPooling2D((2, 2)))

    model.add(Conv2D(64, (5, 5), activation="relu"))

    model.add(Flatten())

    model.add(Dense(64, activation="relu"))

    model.add(Dense(32, activation="relu"))

    model.add(Dense(3, activation="softmax"))

    ```

