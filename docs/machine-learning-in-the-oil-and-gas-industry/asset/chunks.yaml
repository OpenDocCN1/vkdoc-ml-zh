    ## 基本面向对象编程


    在项目开发过程中，经常会遇到需要用不同参数重复执行某段代码的情况。代码被组织成更可复用的模块，这些模块被称为*函数*。在 Python 中，可以通过 `def`
    或 `lambda` 语句创建函数。下面展示了一个用于单位转换的函数示例。每次需要再次转换单位时，只需调用该函数并传入新参数即可。


    ```

    # 用于转换泥浆重量单位的函数

    def unit_conversion(a):

    """

    该函数用于转换泥浆重量单位。

    输入：泥浆重量（kg/m3）

    输出：泥浆重量（ppg 或 psi/ft 或比重）

    """

    print(''输入的泥浆重量（kg/m3）为：'', a)

    mw_ppg = a * 0.0083454

    mw_psift = a * 0.000434

    sp_gravity = a * 0.001

    print(''泥浆重量（ppg）：'', mw_ppg)

    print(''泥浆重量（psi/ft）：'', mw_psift)

    print(''比重：'', sp_gravity)

    # 输入泥浆重量（kg/m3）

    mud_weight = 1250

    unit_conversion(mud_weight)

    ```


    *输出*


    ```

    输入的泥浆重量（kg/m3）为：1250

    泥浆重量（ppg）：10.43175

    泥浆重量（psi/ft）：0.5425

    比重：1.25

    ```


    当我们在代码中仅将函数作为语句块使用时，这被称为面向过程的编程方式。然而，还有另一种编写更复杂、更有组织程序的方法，通常被称为*面向对象编程*（OOP）。数据和功能（即属性和行为）被封装在类和对象中，这是
    OOP 的两个主要方面。类创建了与特定特征相关的用户自定义数据结构。它可以被看作一个蓝图，可以用不同的实例来填充。在类内部创建包含属性的不同对象。下面展示了一个简单类的示例。该示例说明了如何将“井”作为一个类，其属性包括
    API 编号、盆地和产量。关于类的更详细描述，建议参考 [11]。


    ```

    class well():

    # 类属性

    well_type = ''oil well''

    # 初始化器

    def __init__(self, api, basin, oil_prod, gas_prod):

    self.api = api

    self.basin = basin

    self.oil_prod = oil_prod # 桶

    self.gas_prod = gas_prod # 千立方英尺

    # 实例方法

    def boe_calc(self):

    boe = self.oil_prod + self.gas_prod/5.8

    return boe

    # 实例化类

    well_1 = well(12345, ''Williston'', 1000, 5000)

    # 调用类的方法

    print(well_1.boe_calc()) # well_1 的桶油当量产量

    well_2 = well(78910, ''Permian'', 2000, 6000)

    print(well_2.boe_calc()) # well_2 的桶油当量产量

    ```


    *输出*


    ```

    1862.0689655172414

    3034.4827586206898

    # 访问实例属性

    print(''第一口井的 API 编号为：'', well_1.api, ''，位于'', well_1.basin, ''盆地'')

    if well_1.well_type == ''oil well'':

    print("{0} 属于 {1} 类别".format(well_1.api, well_1.well_type))

    ```


    *输出*


    ```

    第一口井的 API 编号为：12345，位于 Williston 盆地

    12345 属于 oil well 类别

    ```


    ## Python 库


    在接下来的部分中，将简要讨论一些最流行的库，包括 pandas、NumPy 和 Matplotlib。另一个常用的 Python 库是 scikit-learn，用于机器学习，将在后续章节中介绍。


    ### pandas：数据分析库


    pandas 是一个开源库，其名称源于术语*面板数据*，常用于多维结构化数据集的数据分析。Pandas 可以接受多种格式的数据文件作为输入，例如 .csv、.xlsx、.json、.html
    以及其他许多常用格式。数据随后可以组织成由行和列组成的数据框形式。一旦数据转换为数据框，就可以使用多种不同的方法进行数据探索。还可以从数据框本身获取统计信息，如均值、中位数和标准差。


    本章以北海 Volve 油田的一个数据集为例。导入数据后，通过查看数据类型和描述性统计进行简要的*探索性数据分析*（EDA）。通过删除 NA 值来清理数据，尽管更全面的
    EDA 过程包括多个步骤，例如数据插补、异常值分析以及初步特征选择。还会导入另一个具有相同标题信息但属于不同井的数据集，并将两个数据框合并。


    该数据集包含以下可供分析的岩石物理信息。


    *   井数：2


    *   井名：15/9-19 A 和 15/9-19 BT2


    *   BVW (V/V)：总体积含水率


    *   CARB_FLAG (无量纲)


    *   COAL_FLAG (无量纲)


    *   KLOGH (mD)


    *   PHIF (V/V)：裂缝孔隙度


    *   RHOFL (G/CM3)：流体体积密度


    *   RHOMA (G/CM3)：骨架体积密度


    *   RW (OHMM)：水电阻率


    *   SAND_FLAG (无量纲)


    *   SW (V/V)：含水饱和度


    *   TEMP (DEGC)：温度（摄氏度）


    *   VSH (V/V)：泥质含量


    *   LITHOTYPE：岩石特征


    ```

    import pandas as pd

    # 将 .csv 文件作为数据框导入

    data = pd.read_csv(''data/15_9-19_A_CPI_LITHO.csv'')

    # 数据以包含行和列的表形式导入

    data # 整个数据集

    ```


    *输出*


    ![../images/480430_1_En_2_Chapter/480430_1_En_2_Figa_HTML.jpg](img/480430_1_En_2_Figa_HTML.jpg)


    以下代码片段获取构成数据框的索引和不同列。要访问元素/列，可以使用列名或数字索引。


    ```

    print(data.index)

    print(data.columns)

    ```


    *输出*


    ```

    RangeIndex(start=0, stop=3008, step=1)

    Index([''COMMON_WELL_NAME'', ''DEPTH (M)'', ''BVW (V/V)'', ''CARB_FLAG (UNITLESS)'',

    ''COAL_FLAG (UNITLESS)'', ''KLOGH (MD)'', ''PHIF (V/V)'', ''RHOFL (G/CM3)'',

    ''RHOMA (G/CM3)'', ''RW (OHMM)'', ''SAND_FLAG (UNITLESS)'', ''SW (V/V)'',

    ''TEMP (DEGC)'', ''VSH (V/V)'', ''LITHOTYPE''],

    dtype=''object'')

    ```


    理解一维（序列）和二维（数据框）操作非常重要，下面将对其进行定义。


    *   **序列**：一个数组，其中索引被分配给一个值


    *   **数据框**：一个二维数组，其中索引被分配给多个值，并且可以包含多个列


    如果你想合并来自不同来源的数据集，可以通过多种方式组合它们。下面简要介绍语法中使用的不同参数。


    ```

    pd.merge(left, right, how, on)

    ```


    这里，前两个参数表示需要合并的第一个和第二个数据框，通常称为*左*数据框和*右*数据框。`how` 参数定义要执行的合并类型，可以是以下之一。


    *   how = ‘outer’ 允许你取数据集的并集并将它们附加在一起。


    *   how = ‘inner’ 允许你取数据集的交集，仅保留共同的值。


    *   how = ‘left’。包含左数据框的所有索引。如果某些索引不存在于‘左’数据框中，则它们不会包含在合并后的数据集中。


    *   how = ‘right’。包含右数据框的所有索引。如果某些索引不存在于‘右’数据框中，则它们不会包含在合并后的数据集中。


    关键字 `on` 决定数据框是否基于某个唯一标识符（例如，油气井的 API 编号）进行合并。


    ```

    # 从另一个文件合并数据

    # 使用另一口井的数据并合并数据框

    data2 = pd.read_csv(''data/15_9-19_BT2_CPI_LITHO.csv'')

    data_combined = pd.merge(data, data2, how="outer", on = None)

    ```

