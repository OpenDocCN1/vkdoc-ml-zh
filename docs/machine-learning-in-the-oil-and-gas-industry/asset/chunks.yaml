- fmt: '### Multilayer Perceptron (MLP)


    A multilayer perceptron (MLP) is the most basic kind of deep learning algorithm.
    Neurons are the basic building blocks of deep neural networks, including MLP.
    Figure [3-20](#480430_1_En_3_Chapter.xhtml#Fig20) shows a schematic representation
    of a neuron. Neurons compute a weighted sum of the input values by using the weights
    associated with the input and then apply a nonlinear *activation function* (`f`)
    to the weighted sum. Nonlinear transformations performed by the neurons provide
    MLP and other deep neural networks capability of modeling highly nonlinear processes,
    which occur in a lot of natural occurrences, and industry problems. Neurons are
    also known as *neural network nodes*.


    ![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig20_HTML.jpg](images/480430_1_En_3_Chapter/480430_1_En_3_Fig20_HTML.jpg)


    Figure 3-20: Schematic depiction of computations in a neuron of artificial neural
    network


    The neurons may use several activation functions to perform nonlinear transformations.
    The sigmoid function and hyperbolic tangent function are among the classically
    used activation functions. Some of the more advanced activation functions include
    the *rectified linear unit* (ReLU), leaky ReLU, and exponential LU. A comparison
    of functional forms and shapes of these traditional and modern nonlinear activation
    functions [[11](#480430_1_En_3_Chapter.xhtml#Par237)] is shown in Figure [3-21](#480430_1_En_3_Chapter.xhtml#Fig21).
    These functions are easy to differentiate (continuous and differentiable). This
    quality makes these functions computationally efficient during the gradient calculations,
    which are an important part of training deep neural networks.


    ![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig21_HTML.jpg](images/480430_1_En_3_Chapter/480430_1_En_3_Fig21_HTML.jpg)


    Figure 3-21: Comparison of traditional and modern activation functions [[11](#480430_1_En_3_Chapter.xhtml#Par237)]


    Figure [3-22](#480430_1_En_3_Chapter.xhtml#Fig22) shows a schematic depiction
    of an MLP. The following components constitute this kind of deep neural network.


    ![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig22_HTML.jpg](images/480430_1_En_3_Chapter/480430_1_En_3_Fig22_HTML.jpg)


    Figure 3-22: Schematic representation of a multilayer perceptron


    - **Input layer:** This layer contains nodes, which facilitate the intake of input
    features to the neural network, apply nonlinear transformations.

    - **Hidden layers:** These layers contain neurons or nodes with a nonlinear activation
    function. The hidden layer is represented by a weight matrix (`W`), and a bias
    vector (`b`). The dimensions of matrix `W` and vector `b` depend on the number
    of nodes in the layers. For example, the input layer, which connects with `m`
    input (feature matrix `X`) and broadcasts values to `n` nodes in the first hidden
    layer, has a weight matrix with dimension `m × n`. Also, the bias vector `b` has
    `n` elements. The output from this layer is `f(WX + b)`, where `f` is the activation
    function.

    - **Output layer:** The output layer connects with the last hidden layer, and
    ensures that the neural network provides output consistent with the problem formulation.
    For example, if the neural network is being trained for classifying a dataset
    with `k` distinct classes, the output layer computes `k` distinct values, and
    then apply a softmax function to each of these `k` values. In the described scenario,
    each of the elements in the output corresponds to the probability of the sample
    belonging to one of the `k` classes.

    - **Optimizer:** The optimizer facilitates updates of weight matrix `W` and bias
    vector `b` for the neural network layers by using the backpropagation of errors.


    The optimizer uses a loss function to evaluate the accuracy of the predicted values.
    In regression problems, this loss function can be RMSE. However, in classification
    problems, a relatively complex loss function may be required. In a classification
    problem, the output layer provides `k` probability values (`y`). If an object
    belongs to only one of the object classes, which is the case for most of the real-world
    classification tasks, one of these `k` values should be close to 1 for the optimal
    performance of the classifier. Labels are one-hot encoded to convert class labels
    to probabilities. For example, in a problem with `k=3` classes, classes 1, 2,
    and 3 are represented as one-hot vectors (`p`) `[1, 0, 0]`, `[0, 1, 0]`, and `[0,
    0, 1]`, respectively. A loss function, such as categorical cross-entropy, uses
    these values to provide quantitative estimation of error, which is useful in iteratively
    updating neural network model parameters (i.e., weights and biases). By using
    the output vector (`y`) and one-hot encoded label vector (`p`), the categorical
    cross-entropy can be computed using the following equation.


    ![$$ crossentropy=\sum \limits_{i=1}^k-{p}_i\log \left({y}_i\right). $$](images/480430_1_En_3_Chapter/480430_1_En_3_Chapter_TeX_Equ13.png)


    (3.13)


