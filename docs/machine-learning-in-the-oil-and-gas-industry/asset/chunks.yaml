    来自 SFO（盐体/断层/其他）数据集的一些样本图像


    机器学习社区中有一些标准的图像数据集，通常用于评估分类模型。这些数据集包括手写数字集合（MNIST）、日常生活中遇到的物体集合（CIFAR10）等等。在本章中，我们使用公共领域和
    Kaggle 上可用的地震勘测数据创建了一个数据集。该数据集（昵称为 *SFO 数据集*）包含 1,500 张属于三个类别（盐体、断层和其他）的地震图像。我们使用
    MLP 对该数据集中的图像进行分类。以下代码片段展示了使用 TensorFlow 库实现 MLP 模型的方法。


    ```

    # 定义一个深度神经网络模型

    reg_param = 0.02 # L2 正则化的正则化参数

    model = Sequential()

    model.add(Dense(1024, activation="relu", kernel_initializer="he_normal", kernel_regularizer=l2(l=reg_param),

    input_shape=(n_features,)))

    model.add(Dense(512, activation="relu", kernel_initializer="he_normal",

    kernel_regularizer=l2(l=reg_param)))

    model.add(Dense(256, activation="relu", kernel_initializer="he_normal",

    kernel_regularizer=l2(l=reg_param)))

    model.add(Dense(128, activation="relu", kernel_initializer="he_normal",

    kernel_regularizer=l2(l=reg_param)))

    model.add(Dense(64, activation="relu", kernel_initializer="he_normal",

    kernel_regularizer=l2(l=reg_param)))

    model.add(Dense(32, activation="relu", kernel_initializer="he_normal",

    kernel_regularizer=l2(l=reg_param)))

    model.add(Dense(16, activation="relu", kernel_initializer="he_normal",

    kernel_regularizer=l2(l=reg_param)))

    model.add(Dense(8, activation="relu", kernel_initializer="he_normal",

    kernel_regularizer=l2(l=reg_param)))

    model.add(Dense(3, activation="softmax"))

    # 编译模型

    model.compile(optimizer=''Adadelta'', loss="sparse_categorical_crossentropy",
    metrics=[''accuracy''])

    ```


    上述神经网络模型的实现包含以下组件。

    '
- fmt: '*   一个具有1024个节点的**密集**输入层。七个隐藏层，节点数分别为512、256、128、64、32、16和8。这些节点被称为**密集**层，因为每一层中的每个节点都与前一层和后一层的每个节点相连，提供了密集连接（见图[3-22](#480430_1_En_3_Chapter.xhtml#Fig22)）。最后，是一个包含三个节点的输出层。所有节点（输出层除外）都使用`ReLU`激活函数。输入层和隐藏层的权重使用`he_normal`初始化器进行初始化。


    *   正则化是指在模型训练期间，对模型参数（权重和偏置）的大幅变化施加惩罚。它提供了防止过拟合的保护措施。惩罚的程度可以通过正则化参数进行调整，该参数通常是一个较小的数值。在所示的MLP模型中，我们使用了L2正则化，正则化参数为0.02。


    *   模型中的输出层使用`softmax`激活函数来输出估计的分类概率。


    *   该模型使用`Adadelta`优化器，它采用具有自适应学习率的随机梯度下降方法。虽然其他一些优化器需要预定义的学习率，但`Adadelta`优化器会自适应地计算学习率。该优化器使用`sparse_categorical_crossentropy`作为损失函数，这是之前讨论过的分类交叉熵的一种变体，适用于每个对象只能属于样本类别中一个类别的情况。


    以下代码片段用于训练上述MLP模型。


    ```

    # Early-stopping callback using validation

    earlystop_callback = EarlyStopping(monitor=''val_accuracy'',

    min_delta=0.0001, patience=50)

    # Save the best model

    ckpt_path = ''./models/dnn.h5''

    ckpt_callback = ModelCheckpoint(filepath=ckpt_path, mode="max",

    monitor=''val_accuracy'', verbose=1,

    save_best_only=True)

    # Train the model

    history = model.fit(X_train, y_train, epochs=500, batch_size=BATCH_SIZE, validation_data=(X_valid,
    y_valid),

    callbacks=[earlystop_callback, ckpt_callback],

    verbose=1)

    ```


    模型训练过程的重要组件如下。


    *   **Epochs（轮次）：** 一个轮次对应于算法处理一次训练数据中所有样本所需的训练迭代次数。这里的MLP模型预计训练500个轮次。


    *   **Early-stopping（早停）：** 此概念使用验证数据集持续监控训练过程。`min_delta`参数定义了最小验证准确率提升。如果模型准确率在由`patience`参数定义的训练轮次数内没有超过`min_delta`，则停止训练。此代码实现会在每次超过先前最佳验证准确率时保存模型。在训练结束时提供最佳验证准确率的模型可用于后续生成预测。


    图[3-24](#480430_1_En_3_Chapter.xhtml#Fig24)展示了训练和验证数据集在训练轮次上的损失函数演变。使用该过程训练的MLP模型被用于对测试数据集生成预测。该模型对盐、断层和其他类别的预测准确率如下。


    ```

