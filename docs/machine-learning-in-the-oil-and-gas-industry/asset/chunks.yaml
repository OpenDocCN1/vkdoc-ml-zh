    ## 使用 Arps 经验模型进行递减曲线分析


    在本节中，我们重点介绍递减曲线分析，这是一种油藏工程师用于预测油井或气井未来产量的技术。其结果用于确定*估算最终采收率*（EUR）。最常用的方程形式是递减参数、产量和时间之间的经验关系，如先前研究[29]所述，并且至今仍被广泛使用。作为现代生产数据分析的一个组成部分，该过程还包括流态表征、采收率系数估算以及地质储量估算。


    使用此方法进行递减曲线分析的方程将在下一节中展示。这种传统的图形方法没有理论基础，并且隐含地假设井的整个生命周期内操作条件恒定。Arps 模型已成功应用于达到*边界主导流*（BDF）的井中。


    需要注意的是，大多数非常规井尚未达到边界主导流，并且在瞬态期本身就表现出急剧递减：这种方法也不使用压力数据。文中展示了一个井的示例，其中使用参数*qi*、*b*和*Di*拟合曲线，并采用双曲方程。利用拟合曲线对
    2019 年期间进行了预测。


    为了匹配历史数据并进行预测，我们使用了基于 Python 的开源库 SciPy。SciPy 提供了`scipy.optimize.leastsq`[30]的封装函数——`curve_fit()`。该函数使用非线性最小二乘法来拟合函数并确定必要的系数。`curve_fit`方法至少需要三个参数。


    𝑝𝑜𝑝𝑡, 𝑝𝑐𝑜𝑣 = 𝑐𝑢𝑟𝑣𝑒_fit (𝑓𝑢𝑛𝑐, 𝑇, 𝑄).6.1)


    函数调用中的第一个参数是一个函数。任何函数都可以像其他变量一样传递给它。在我们的案例中，函数是指数型、双曲型或调和型，它可以接受自变量（例如，递减曲线示例中的时间）以及任何其他拟合参数。例如，在双曲函数中，需要传递*qi*、*b*和*Di*；而在指数函数中，由于*b*=0，只需要*qi*和*Di*。除了函数定义外，还需要传递自变量和需要拟合的观测数据。L2
    范数可以通过将实际值与曲线拟合预测值进行比较来确定拟合质量。


    𝐸𝑟𝑟𝑜𝑟𝐿2 = ∑|(𝑡) − 𝑞𝑜𝑏𝑠(𝑡)|²(6.2)


    ### 方程与描述


    递减曲线分析中使用的每种函数形式都具有特定特征。这里我们讨论不同类型递减曲线的一些显著特征。


    #### 指数递减


    在这种递减类型中，产量与累积产量之间，以及产量对数与*x*轴上的时间之间，均呈现直线关系。递减率是恒定的。根据此方程得出的预测结果给出了最小的*估算最终采收率*（EUR），产量可通过以下方程计算。


    ![$$ q=\frac{q_i}{e^{D_it}}. $$](img/480430_1_En_6_Chapter_TeX_Equ1.png)


    (6.3)


    #### 双曲递减


    这是最常见的 Arps 方程，因为在现实场景中很少遇到直线图。对于常规油藏（边界主导流是主要流态的情况），递减率不是恒定的，而递减指数因子*b*介于 0 和
    1 之间，通常通过非线性曲线拟合方法确定。在非常规油藏中观察到*b*因子值更高。这种情况的一个例子是瞬态线性流，其中*b*=2。表现出双曲递减的油藏的产量可通过以下方程获得。


    ![$$ q=\frac{q_i}{{\left(1+b{D}_it\right)}^{\frac{1}{b}}}. $$](img/480430_1_En_6_Chapter_TeX_Equ2.png)


    (6.4)


    #### 调和递减


    这被认为是*b*=1 时双曲递减的一个特例。在这种情况下，递减率与产量成正比。产量对数与累积产量的半对数图呈现一条直线。产量可使用以下方程计算。


    ![$$ q=\frac{q_i}{1+{D}_it}. $$](img/480430_1_En_6_Chapter_TeX_Equ3.png)


    (6.5)


    ### 结果


    对井进行了历史拟合，结果如图 6-5 所示。


    ![../images/480430_1_En_6_Chapter/480430_1_En_6_Fig5_HTML.jpg](img/480430_1_En_6_Fig5_HTML.jpg)


    图 6-5


    使用 Arps 递减曲线模型的历史拟合结果


    对于两口示例井，双曲方程提供了更好的拟合。尽管对于第二口井，双曲方程和调和方程都显示出相似的历史拟合效果。


    使用模型参数，可以通过改变方程中的时间*t*来预测石油产量。图 6-6 显示了对这两口井额外 5000 天的预测结果。


    ![../images/480430_1_En_6_Chapter/480430_1_En_6_Fig6_HTML.jpg](img/480430_1_En_6_Fig6_HTML.jpg)


    图 6-6


    使用 Arps 递减曲线模型的预测结果


    ### 验证


    使用包含 2019 年起产量的测试数据集来验证递减曲线模型预测的性能。这些数据未用于训练经验模型，旨在验证模型的性能。图 6-7 包含了双曲曲线性能与实际数据的比较。


    在此示例中，确定了一个常见的精度指标——均方根误差（RMSE）——以量化双曲模型预测的准确性。


    ```

    RMSE - 双曲模型: 81.419 bbl/d

    ```


    ![../images/480430_1_En_6_Chapter/480430_1_En_6_Fig7_HTML.jpg](img/480430_1_En_6_Fig7_HTML.jpg)


    图 6-7


    实际数据与包含测试数据（即 2019 年起的产量）的双曲预测之间的比较


    ## 基于时间序列的 ARIMA 模型预测


    理解时间序列数据趋势并进行预测的另一种方法包括分析历史数据的统计趋势。本章使用了一种常见模型——ARIMA（*自回归积分滑动平均模型*）。在此特定分析中，需要将日期列转换为
    datetime 数据类型，以便于时间数据的处理。

