- fmt: '### Multinomial Logistic Regression


    Logistic regression is a classification technique, which is used in binary classification
    problems. Binary classification is quite simple. If a sample doesn’t belong to
    one class, it must belong to the other. Logistic regression uses the sigmoid function
    (see Figure [3-21](#480430_1_En_3_Chapter.xhtml#Fig21)). The sigmoid function
    changes from 0 to 1 for a very small change in the input value. This property
    of sigmoid function helps in classifying data with samples belonging to two distinct
    classes. For classification problems involving more than two classes, *multinomial
    logistic regression* is one of the basic multiclass classification algorithms.
    This algorithm uses a *softmax* function, which is expressed by the following
    equation.


    ![$$ {f}_{softmax}\left({z}^i\right)=\frac{e^{z_i}}{\sum \limits_{j=1}^k{e}^{z_j}},
    $$](images/480430_1_En_3_Chapter/480430_1_En_3_Chapter_TeX_Equ12.png)


    (3.12)


    where `k` = number of classes in a multiclass classification problem, and `i`
    is the class for which softmax function is being computed corresponding to the
    input `z`^(`i`). Softmax function also changes very rapidly from 0 to 1, but it
    has the capability of handling multiple classes. In simple terms, softmax function
    provides a probability that a sample belongs to either of the `k` classes. Multinomial
    logistic regression is also known as *softmax regression*. The following code
    snippet shows an example implementation of multiclass classification using this
    algorithm.


    ```

    from sklearn.linear_model import LogisticRegression

    clf_logreg = LogisticRegression()

    clf_logreg.fit(X_train, y_train)

    # Prediction on test data

    y_pred_logreg = clf_logreg.predict(X_test)

    # Accuracy Metrics

    clf_metrics(y_test, y_pred_logreg)

    ```


    **Results**


    ```

    Classification Accuracy Score: 0.6480938416422287

    Classification Report:

    precision    recall  f1-score   support

    F-MOUTHBAR       0.40      0.05      0.08        87

    F-TIDAL BAR       0.53      0.86      0.66       119

    F-TIDAL CHANNEL       0.82      0.85      0.84       135

    accuracy                           0.65       341

    macro avg       0.59      0.58      0.53       341

    weighted avg       0.61      0.65      0.58       341

    ```


    The results for the classification accuracy are shown in the form of a classification
    report, where precision, recall, and F1-score are shown as the quantitative indicators
    of the classifier’s predictive capability. The algorithm predicts F-TIDAL CHANNEL
    class with higher precision but doesn’t provide good precision for the classes
    with a lower population.


    It should be noted that some of the classifiers don’t work very well with the
    data, where one class has more samples than the others. In a *population imbalance*
    scenario, resampling the training data to make a population of classes equal may
    help in improving the precision and accuracy of the classification algorithm.


    ### Support Vector Classifier


    Earlier, we discussed support vectors and the kernel trick. The *support vector
    classifier* uses similar concepts. To perform classification, this algorithm constructs
    optimal hyperplanes that separate the samples belonging in different categories.
    An equivalent 2D representation can be thought of as a line dividing the cluster
    of points belonging to two separate categories. The algorithm uses a regularization
    parameter, which dictates the margin (recall `ϵ`) that separates the hyperplanes.
    The results indicate that this algorithm is unable to identify the classes with
    a lower population.


    ```

    from sklearn.svm import SVC

    clf_svc = SVC()

    clf_svc.fit(X_train, y_train)

    # Prediction on test data

    y_pred_svc = clf_svc.predict(X_test)

    # Accuracy Metrics

    clf_metrics(y_test, y_pred_svc)

    ```


    **Results**


    ```

    Classification Accuracy Score: 0.6217008797653959

    Classification Report:

    precision    recall  f1-score   support

    F-MOUTHBAR       0.00      0.00      0.00        87

    F-TIDAL BAR       0.50      0.87      0.64       119

    F-TIDAL CHANNEL       0.80      0.81      0.80       135

    accuracy                           0.62       341

    macro avg       0.43      0.56      0.48       341

    weighted avg       0.49      0.62      0.54       341

    ```


    ### Decision Tree Classifier


    The decision tree classifier algorithm follows a similar approach, as discussed
    earlier for the decision tree regression. In a regression algorithm, the predictions
    were generated by averaging the values in the terminal leaf node, to which a sample
    belongs. In a classification problem, all samples belonging to a terminal tree
    node are classified as one of the categories.


    During the model training, the algorithm tries to minimize entropy (randomness)
    and maximize the information gain. An adequately trained tree with no randomness
    has all samples belonging to only one of the sample classes in any given terminal
    leaf node. The results show that despite population imbalance, this algorithm
    provides high precision and accuracy across the lithotype categories.


    ```

    from sklearn.tree import DecisionTreeClassifier

    clf_dt = DecisionTreeClassifier()

    clf_dt.fit(X_train, y_train)

    # Prediction on test data

    y_pred_dt = clf_dt.predict(X_test)

    # Accuracy Metrics

    clf_metrics(y_test, y_pred_dt)

    ```


    **Results**


    ```

    Classification Accuracy Score: 0.9853372434017595

    Classification Report :

    precision    recall  f1-score   support

    F-MOUTHBAR       0.98      0.98      0.98        87

    F-TIDAL BAR       0.99      0.97      0.98       119

    F-TIDAL CHANNEL       0.99      1.00      0.99       135

    accuracy                           0.99       341

    macro avg       0.98      0.98      0.98       341

    weighted avg       0.99      0.99      0.99       341

    ```


    ### Random Forest Classifier


    Random forest classifier works on the exactly similar concept, which we discussed
    for the random forest regression. The only difference is that in a classification
    algorithm, a forest of decision tree classifiers is grown, and the final prediction
    is generated based on the *voting* instead of averaging.


    In the voting approach, the class that appears with the highest frequency in the
    ensemble predictions is selected as the final output. The algorithm also provides
    the flexibility of predicting probabilities of a sample belonging to any of the
    sample classes. The selection of one of these two output methods depends on the
    problem at hand. A sample code implementation and classification results show
    high precision and accuracy of predictions provided by this algorithm.


    ```

    from sklearn.ensemble import RandomForestClassifier

    clf_rf = RandomForestClassifier()

    clf_rf.fit(X_train, y_train)

    # Prediction on test data

    y_pred_rf = clf_rf.predict(X_test)

    # Accuracy Metrics

    clf_metrics(y_test, y_pred_rf)

    ```


    **Results**


    ```

    Classification Accuracy Score: 0.9882697947214076

    Classification Report:

    precision    recall  f1-score   support

    F-MOUTHBAR       0.99      0.98      0.98        87

    F-TIDAL BAR       0.99      0.98      0.99       119

    F-TIDAL CHANNEL       0.99      1.00      0.99       135

    accuracy                           0.99       341

    macro avg       0.99      0.99      0.99       341

    weighted avg       0.99      0.99      0.99       341

    ```'
