  trans: '

    ##### 岩相分类


    岩相可理解为具有独特特征的一类岩石。了解油气藏中的岩相分布有助于识别更可能产出油气岩石的区域。近年来，应用深度神经网络的机器学习方法在基于测井岩石物理性质[20]以及远离井位的随机兴趣点[19]进行岩相分类方面，已展现出合理的准确性。


    ### 油藏工程


    油藏工程师能够获取地球科学家使用的几乎所有数据。他们还掌握其负责油田的油气产量和作业历史数据。他们利用多种多样的数据来制定从油藏乃至整个油田经济最优地开采油气的方案。接下来将讨论一些机器学习已展现出潜在优势的油藏工程活动。


    #### 油田开发规划


    在油田开发规划期间，油藏工程师利用现有井的数据。基于对现有井数据的分析，他们决定新井的布井位置。具体而言，这是非常规油气资源开发中的标准做法。已有多种方法尝试应用机器学习，基于历史数据来规划新井。


    其中一种方法是通过应用主成分分析（PCA）进行降维，随后采用回归方法来预测拟建新井的生产潜力[21]。基于机器学习方法的分析也证明了其揭示隐藏模式的能力，这些模式在高维空间中不易被察觉。通过识别这些模式，可以识别出预期表现相似的井。进一步的分析可以揭示表现相似井的共同属性、表现不佳井性能欠佳的根本原因，以及在新井中避免类似不良性能的措施[22]。


    #### 辅助历史拟合


    历史拟合过程遵循一个迭代方案来调整油藏参数。当历史拟合结果与观测到的油藏表现达到合理匹配时，该过程即收敛。在非均质性强、复杂性高的油藏中，历史拟合可能是一个耗时且计算成本高昂的过程。近年来，基于人工神经网络的方法已被应用于油藏历史拟合[23]。这类方法采用完全数据驱动的代理模型，显著降低了计算成本。与全尺寸数值油藏模拟器相比，代理油藏模型的计算成本仅为其一小部分。这种计算成本的降低使得历史拟合过程变得非常高效[24]。


    #### 产量预测与储量估算


    预测生产井的石油产量是油藏工程师的主要职责之一。基于生成的产量预测，可以做出关于未来油田开发活动的决策。产量预测有助于估算可采储量和进行经济评价。传统上，数值模拟和递减曲线分析（DCA）技术被广泛用于产量预测。这些技术需要了解油藏行为，并且在模拟复杂物理过程方面缺乏灵活性。


    近年来，使用前馈神经网络[25][26]和循环神经网络的机器学习方法已在单井和多井的产量预测中证明了其有效性和准确性。这些机器学习方法使得无论资产是否拥有大量作业历史信息，其预测过程都变得高效且准确[27]。


    ### 钻井与完井


    海上钻井是一项高风险、高资本支出的作业。深水海上钻井每天的成本可能高达 100 万美元，而在深水钻井场景下，单口井的成本可能高达数亿美元。鉴于这些事实，采用机器学习模型的自动化可以显著提高钻井作业的操作安全性，同时降低钻井成本。接下来将讨论机器学习在钻井与完井活动中的一些应用，这些应用展示了在提高操作安全性和成本效益方面的巨大潜力。


    #### 自动化事件识别与分类


    上游资产通过人工生成的作业报告和传感器数据（如钻压、立管压力、转速等）创造有价值的见解。只有当数据质量足够，且信息得到正确解释、存储和使用时，才能实现这种价值。报告和数据为推导井事件提供了基础。井事件的例子包括：生产时间（例如，钻进）、非生产时间或
    NPT（例如，卡钻、粘滑振动、井眼清洁、管柱故障、井漏、底部钻具组合涡动、过大扭矩和摩阻、低机械钻速、钻头磨损、地层损害、井眼失稳等），以及隐性损失时间或
    ILT（例如，缓慢的接单根、次优钻进和起下钻）。


    多年来，钻井和完井作业一直得到广泛数据收集过程的支持。在过去的二十年里，随着井下传感器和远程通信能力的加入，钻井和完井作业期间出现了广泛的实时数据收集过程。当前的挑战是从实时数据中识别事件并获取见解，以防止
    NPT 和 ILT。传统上，每日钻井报告（DDR）一直是描述井场关键作业和事件详细日志的权威来源；然而，它们受制于人为偏差，并且使用不一致的文本格式和术语。自动化事件识别与分类的目标是，在能够实现最佳和安全钻井作业的时间范围内，查明并纠正钻井过程中出现的问题[28]。


    已经提出了各种机器学习技术，通过检测事件发生时钻井参数的变化趋势来自动识别和分类钻井事件。钻井事件是使用定义的专家规则、阈值和标准[29]，以及回归和分类方法[30]，从海量
    DDR 和实时钻井数据库中提取的。也有研究尝试最大化 DDR 和实时数据的价值[31]。


    #### 非生产时间（NPT）最小化


    钻井作业中的非生产时间（NPT）可能由多种原因引起。由于钻井设备租赁费用高昂，因此存在经济激励来最小化此类非生产时间。井涌和卡钻是导致非生产时间的两个最重要问题。接下来将讨论一种用于预测这些问题发生概率的机器学习方法。

    '
- fmt: '### Early Kick Detection


    *Kick* is an event where gas suddenly starts to seep in from the formation into
    the wellbore. As gas enters the wellbore, it starts ascending to the surface.
    The upward movement of gas shows up as the increased volume of mud at the surface,
    accompanied by increased mud flow rate out of the well.


    `Kick` is a dangerous event, and remedies to the aftereffects of such events prove
    to be expensive. The earlier a kick is detected, the sooner the crew on drilling
    rig can take necessary corrective actions. However, traditional alarm systems
    either suffer from many false alarms or are ineffective at identifying a kick
    accurately. The application of machine learning algorithms provides accurate estimates
    of mud volumes and flow rates during the drilling process. It also significantly
    reduces the frequency of false alarms. This helps the drilling crew in taking
    effective corrective actions promptly [[32](#480430_1_En_1_Chapter.xhtml#Par161)].


    ### Stuck Pipe Prediction


    In certain scenarios during the drilling operations, the drill pipe may get stuck
    inside the wellbore. Once the drill pipe gets stuck, drilling operations are put
    on hold until a remedy is performed. Stuck pipe problem is one of the biggest
    contributors to non-productive time during drilling operations. To predict the
    nonlinear behavior surrounding the stuck pipe events, artificial neural networks
    optimized by particle swarm optimization algorithm have shown high accuracy in
    predicting the possibility of a stuck pipe event ahead of time. Predictions obtained
    from this machine learning approach, together with sound engineering judgments,
    has the potential of preventing stuck pipe events [[33](#480430_1_En_1_Chapter.xhtml#Par162)].


    ## Autonomous Drilling Rigs


    Large offshore drilling rigs are often located in remote locations and can generate
    up to 1 or 2 terabytes of data every day. Transmitting such large amounts of data
    generated by an offshore rig in one day using a 2 Mbps satellite link takes 12
    days or more [[34](#480430_1_En_1_Chapter.xhtml#Par163)]. Therefore, any critical
    data-driven decision making needs to take place on the offshore drilling rig itself.
    Autonomous drilling rigs combine machine learning, `IIoT`, and robotics. Also,
    the decision making on the rig needs edge computing devices (devices with electronic
    circuits embedding machine learning and other algorithms) installed at the rig.
    The sophisticated machinery and a large number of sensors on the drilling rig
    provide all the relevant information for decision making. The data acquired by
    the `IIoT` devices can be consumed by machine learning algorithms running on the
    edge computing devices. Finally, recommendations from the algorithms transmitted
    back to drilling operators or robots result in the final action. The objectives
    of autonomous drilling rigs include the following.


    *   Drilling at optimal rates (rate of penetration or `ROP` optimization) [[35](#480430_1_En_1_Chapter.xhtml#Par164)].

    *   Minimizing non-productive time (`NPT`), for example, predicting the possibility
    of stuck pipe ahead of time, and increasing probability of success of different
    remedial actions (25% of total `NPT` during drilling operations is attributed
    to stuck pipes) [[33](#480430_1_En_1_Chapter.xhtml#Par162)].

    *   Operational safety, for example, early kick detection to ensure the safety
    of human lives and preserving the ecosystem [[32](#480430_1_En_1_Chapter.xhtml#Par161)].


    ## Production Engineering


    As oil and gas fields mature, reservoir and well conditions change continuously,
    and most likely toward deterioration. As a result, production declines rapidly
    due to an increase in water cut (fraction or percentage of water present in oil),
    lift equipment inefficiencies, lack of sufficient reservoir pressure support,
    or surface backpressure bottlenecks, among many others. Reservoir and field decline
    may be a result of individual well production decline, as well as the rapid increase
    of inactive strings (non-producing wells).


    Drilling new wells or the intervention of existing ones are needed to manage production
    decline. To improve production through an existing well, reservoir and production
    engineers plan and execute workover jobs consisting of squeeze cement, well integrity,
    fishing jobs, and zone isolation to optimize and maintain oil production.


    The role of production engineering is to ensure reservoir production delivers
    within the existing boundaries of the approved field development plan, including
    the number of wells, facilities capacity, and limited expenditures. The responsibilities
    of a production engineer may include the following.


    *   Plan, gather, and interpret production surveillance data.

    *   Build, maintain, and exploit the use of models for well performance management.

    *   Establish well-operating envelopes and set points.

    *   Identify, rank, implement, and assess production enhancement opportunities,
    including well workovers.


    ### Workover Opportunity Candidate Recognition


    Under certain scenarios during its lifetime, a well may not be able to operate
    and produce satisfactorily. Identifying such wells, and performing interventional
    and remedial activities (also called *workover*) to bring the well performance
    to satisfactory levels has shown significant economic impact. Expert systems have
    been used in the oil and gas industry for decades, with processes ranging from
    data integration and cleansing over problem detection to ranking candidates according
    to production gains, costs, risk, and net present value. Novel systems leveraging
    data analytics, machine learning and reasoning tools like Bayesian Belief Networks
    [[36](#480430_1_En_1_Chapter.xhtml#Par165)] [[37](#480430_1_En_1_Chapter.xhtml#Par166)]
    have been proposed and used to detect production problems with likelihoods of
    occurrence for various problems in wells, reservoirs or facilities. These systems
    assist in differentiating root causes and prioritizing different countermeasures
    at hand. These screening logics work as a repeatable and automated process, which
    can be scheduled or can be executed on demand.


    ### Production Optimization


    The objective of production optimization is to manage and ensure asset goals profitably
    using all available information up to that point to predict outcomes with confidence
    and to make decisions that produce optimal outcomes, and implement such decisions
    until the next decision-making point in time. The increasing availability of real-time
    downhole measurements and remotely activated valves in the oilfields has made
    field-wide optimization of operations in real-time a distinct possibility [[38](#480430_1_En_1_Chapter.xhtml#Par167)].
    With more real-time data and measurements, it’s possible to build machine learning
    models, which could be updated with the availability of new data. While the term
    real-time optimization (`RTO`) is certainly not new, and `RTO` is practiced in
    elements of production operations, the extent to which `RTO` is now feasible in
    the day to day production operations has increased dramatically.


    ### Infill Drilling


    Infill drilling refers to additional drainage locations that are selected in a
    later stage of the field development cycle to increase the well-reservoir contact
    area. The objective of infill drilling is to accelerate or improve recovery factors
    from wells, which might have bypassed oil and gas reservoirs in their drainage
    area. Selecting infill well candidates requires a careful analysis to verify,
    quantify, and locate such bypassed reservoir locations. Numerous data-driven methods
    have been developed to forecast production for potential sidetracks providing
    a set of criteria to select the most suitable well to sidetrack, leveraging all
    associated uncertainties and linking to a stochastic economic analysis [[39](#480430_1_En_1_Chapter.xhtml#Par168)].'
