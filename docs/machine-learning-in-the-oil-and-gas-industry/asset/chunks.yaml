  raw: '### Formulation


    The Gaussian process (GP) is a collection of random variables, where any finite
    collection of those variables has a multivariate normal distribution. If we have
    a single random variable with the Gaussian (also normal) distribution, and we
    plot it, we get a bell-shaped curve. If we have two random variables with similar
    distributions, by plotting them on the *x* and *y* axes, we get the shape of a
    bell. That’s a multivariate normal distribution with two random variables. We
    can imagine three random variables that satisfy the condition, and so on.


    Now, let’s say there are some points *X*, where observed property values are given
    by *f*(*X*) or simply *f*. Also, based on this information, for a set of points *X*^∗,
    we are trying to estimate *f*(*X*^∗) or *f*^∗. This means that we are trying to
    calculate the probability distribution *p*(*f*^∗| *f*). Under the assumption of
    a zero mean, we can approximate *f*(*X*) as following [[4](#480430_1_En_5_Chapter.xhtml#Par49)].


    ![$$ f(X)\sim N\left(0,K\left(\theta, X,{X}^{\prime}\right)\right), $$](images/480430_1_En_5_Chapter/480430_1_En_5_Chapter_TeX_Equ2.png)


    (5.2)


    *where N* denotes a normal distribution with a zero mean, and *K*(*θ*, *X*, *X*^′)
    represents the covariance matrix between all observed data point pairs (*X*, *X*^′).
    The covariance matrix ensures that the values in close proximity to the input
    generate output values, which are also close to each other. The estimated mean
    values at points *X*^∗ is given by


    ![$$ y=K\left(\theta, {X}^{\ast },X\right)K{\left(\theta, X,{X}^{\prime}\right)}^{-1}f(X).
    $$](images/480430_1_En_5_Chapter/480430_1_En_5_Chapter_TeX_Equ3.png)


    (5.3)


    In Equation [5.3](#480430_1_En_5_Chapter.xhtml#Equ3), a new term *K*(*θ*, *X*^∗,
    *X*) appears. This term accounts for the covariance between the observed data
    points (in our case exported well logs), and the points where we are trying to
    get property estimates. If we draw a parallel between kriging and Gaussian process
    regression, the covariance matrix is similar to the analytical variogram shown
    in Figure [5-1](#480430_1_En_5_Chapter.xhtml#Fig1). In Gaussian process regression,
    covariance function is implemented using the previously discussed *kernel trick*
    . The most commonly used kernel is the Radial-basis function (RBF) kernel.


    ### Radial-Basis Function (RBF) Kernel


    The RBF kernel is also known as the *squared exponential* kernel . This kernel
    is parameterized by length-scale parameters, which are similar to the variogram
    range shown in Figure [5-1](#480430_1_En_5_Chapter.xhtml#Fig1). The RBF kernel
    can have a single length scale and provide an equivalent to omnidirectional (isotropic)
    variogram, or it may have the same number of dimensions as the input providing
    an equivalent to the anisotropic variogram. The functional form of the RBF kernel
    is given by


    ![$$ k\left(x,y,z\right)=\exp \left(-\frac{1}{2}d{\left(\frac{x}{l_x},\frac{y}{l_y},\frac{z}{l_z}\right)}^2\right).
    $$](images/480430_1_En_5_Chapter/480430_1_En_5_Chapter_TeX_Equ4.png)


    (5.4)


    In Equation [5.4](#480430_1_En_5_Chapter.xhtml#Equ4) *l*[*x*], *l*[*y*], and *l*[*z*]
    represent length-scales or variogram ranges in the *x*, *y*, and *z* directions.
    Also, the `GaussianProcessRegressor` scikit-learn implementation provides a hyperparameter,
    `alpha`, which represents the nugget variance (*n*) of the variogram model in
    Figure [5-1](#480430_1_En_5_Chapter.xhtml#Fig1). It is important to note that
    the method discussed here assumes a zero sample mean. This can be achieved by
    using `StandardScaler` in scikit-learn. Listing [5-2](#480430_1_En_5_Chapter.xhtml#PC2)
    shows an implementation of the interpolation of *permx* using `GaussianProcessRegressor`.


    ```

    from sklearn.preprocessing import StandardScaler

    from sklearn.gaussian_process import GaussianProcessRegressor

    from sklearn.gaussian_process.kernels import RBF

    x_scaler = StandardScaler()

    X_scaled = x_scaler.fit_transform(X)

    y_scaler = StandardScaler()

    y_scaled = y_scaler.fit_transform(np.array(y).reshape(-1, 1))

    kernel = RBF([5.e-1, 5.e-3, 5.e-3], (1.e-3, 1.e0))

    gpr = GaussianProcessRegressor(kernel=kernel,

    alpha=0.75,

    n_restarts_optimizer=10,

    normalize_y=False,

    random_state=12345)

    y_scaled = y_scaled.flatten()

    gpr.fit(X_scaled, y_scaled)

    pred, sigma = gpr.predict(X_scaled, return_std=True)

    pred = y_scaler.inverse_transform(pred.reshape(1, -1))

    print(''GPR Fit Score: %f'' % gpr.score(X_scaled, y_scaled))

    GPR Fit Score: 0.708586653049732

    Listing 5-2

    Code Snippet for Gaussian Process Regression for Property Value Estimation Away
    from Wells

    ```


    In the code sample, we transformed the data to have zero mean and unit variance.
    Having unit variance also helps us choose the `alpha` parameter as a fraction
    of sample variance. A smaller value of `alpha` fits the data at the well locations
    extremely well, and we’ll get a higher fit score. You can try experimenting with
    different values of `alpha` to see how the fit score and overall predictions change.


    The RBF kernel in the code has three length scales, which indicates an anisotropic
    kernel (variogram) is being used. The parameters in the RBF kernel after the list
    of length scales is a tuple defining upper and lower bounds of the length-scales.
    During the training process, the optimization algorithms choose the best fitting
    length-scales within the defined upper and lower bounds. Using the model generated
    in Listing [5-2](#480430_1_En_5_Chapter.xhtml#PC2), values of *permx* are predicted
    at the well locations. The estimates have low variance, as shown in Figure [5-5](#480430_1_En_5_Chapter.xhtml#Fig5).


    Further, the *permx* values at all grid cells of the SPE 5 model are also predicted
    using the trained model. Figure [5-6](#480430_1_En_5_Chapter.xhtml#Fig6) shows
    the estimated mean predictions and corresponding variances. It can be observed
    that the estimates around the wells have a low variance. As we move far away from
    the wells, we get predictions and variances, which are equal to the mean and variance
    values calculated from the exported well log data as shown in Table [5-2](#480430_1_En_5_Chapter.xhtml#Tab2).
    We expected that this would happen based on the variogram models observed in Figure
    [5-4](#480430_1_En_5_Chapter.xhtml#Fig4), where nugget variance was significant
    when compared to sill, indicating low correlation in the exported well log data.


    ![../images/480430_1_En_5_Chapter/480430_1_En_5_Fig6_HTML.jpg](images/480430_1_En_5_Chapter/480430_1_En_5_Fig6_HTML.jpg)


