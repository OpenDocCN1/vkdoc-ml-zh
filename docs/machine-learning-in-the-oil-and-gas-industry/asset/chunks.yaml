    ### 循环神经网络（RNN）


    循环神经网络（`RNN`）提供了一种专门的架构，能够对序列（包括时间序列数据）进行建模。图[3-27](#480430_1_En_3_Chapter.xhtml#Fig27)展示了`RNN`架构的示意图。


    ![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig27_HTML.jpg](images/480430_1_En_3_Chapter/480430_1_En_3_Fig27_HTML.jpg)


    **图 3-27** RNN 架构示意图


    `RNN`是一系列基础神经网络模型，其中每个模型都从序列中单个步骤的输入和输出中学习。如果我们将这个序列中的模型折叠成一个单一的模型，该模型将其输出作为输入，并不断更新模型参数，我们就得到了如图[3-27](#480430_1_En_3_Chapter.xhtml#Fig27)（最右侧）所示的`RNN`架构。


    然而，这种学习模型参数（权重和偏置）的方法存在稳定性问题。有时，由于误差梯度较大，模型权重从序列中的一个步骤到下一个步骤的变化可能过大。梯度在序列的多个步骤中累积可能导致权重更新过大，从而使值超出计算机能处理的数值范围。这被称为**梯度爆炸**问题。


    另一方面，如果误差梯度在序列的多个步骤中过小，累积这些梯度可能导致值接近于零。在这种情况下，模型停止更新权重，无法学习。这被称为**梯度消失**问题。


    存在一些专门的架构来解决梯度爆炸和梯度消失问题。在讨论其中一种专门算法之前，我们先看看用于构建时间序列预测模型的时间序列数据。


    图[3-28](#480430_1_En_3_Chapter.xhtml#Fig28)展示了由`Equinor`（[`https://data.equinor.com`](https://data.equinor.com)）提供的`Volve`数据集中两口井的日产量（左图）和累计产量（右图）数据。我们将使用这些数据，基于最近几周的产量数据来生成次日产量预测。


    ![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig28_HTML.jpg](images/480430_1_En_3_Chapter/480430_1_En_3_Fig28_HTML.jpg)


    **图 3-28** 从 Volve 数据集中选取的两口井的日产量（左图）和累计产量（右图）数据图


    #### 长短期记忆网络（LSTM）


    我们讨论了在训练`RNN`模型时遇到的梯度爆炸和梯度消失问题。长短期记忆网络（`LSTM`）是一种通过控制信息从序列中的一个步骤流向下一步骤来解决这些问题的架构。`LSTM`模型被表示为一个带有信息流调节“门”的单元（见图[3-29](#480430_1_En_3_Chapter.xhtml#Fig29)）。`LSTM`模型中的单元状态变量保留了序列（或正在建模的时间序列）的长期记忆。这些门包括以下内容。


    ![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig29_HTML.jpg](images/480430_1_En_3_Chapter/480430_1_En_3_Fig29_HTML.jpg)


    **图 3-29** 长短期记忆（LSTM）单元架构示意图


    *   **遗忘门：** 该门基于当前单元输入和上一序列步骤的输出（隐藏状态）的组合来收集学习到的信息。然后，使用`sigmoid`函数决定应丢弃多少信息。`sigmoid`函数提供介于`0`和`1`之间的值，其中`1`表示保留所有信息，`0`表示丢弃所有信息。


    *   **输入门：** 该门也使用当前单元输入和上一序列步骤的输出。输入门使用`sigmoid`函数学习应保留多少信息用于更新单元状态。相同的输入会通过`tanh`激活函数。输入门提供介于`0`和`1`之间的值，而`tanh`提供介于`-1`和`1`之间的值。这两者的组合用于更新单元状态。


    *   **输出门：** 输出门使用的输入与前两个门类似。它使用`sigmoid`函数学习计算模型输出所需的信息量。应用于单元状态（序列的长期记忆）的`tanh`激活函数与从输出门接收到的值的组合，提供了单元的输出。


    以下代码片段展示了使用`TensorFlow`实现`LSTM`架构的示例。使用过去`14`天的累计产量数据来预测次日的累计产量。该实现包含两个堆叠的`LSTM`层，其后是一个全连接层，以及一个包含单个节点（一个输出变量）的输出层。我们使用`Adadelta`优化器，并最小化均方误差（`MSE`）指标来训练`LSTM`模型。该实现还使用了基于验证数据的早停法（此处未显示）。


    ```

    model = Sequential()

    model.add(LSTM(NUM_HIDDEN, activation="relu", return_sequences=True, input_shape=(LOOKBACK,
    1)))

    model.add(LSTM(NUM_HIDDEN, activation="relu", return_sequences=False))

    model.add(Dense(NUM_HIDDEN))

    model.add(Dense(1))

    model.compile(optimizer=''Adadelta'', loss="mse")

    ```


    图[3-30](#480430_1_En_3_Chapter.xhtml#Fig30)（左图）显示了观测到的测试数据的归一化累计产量，以及`LSTM`模型预测的累计产量。图[3-30](#480430_1_En_3_Chapter.xhtml#Fig30)（右图）显示了测试数据的观测值与`LSTM`预测值的交叉图。结果表明，尽管在油井生产的早期阶段存在一些不匹配，但`LSTM`模型具有良好的预测能力。一个工业相关的实现会输出未来多天的产量——我们鼓励您使用提供的代码来实现这一点。


    ![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig30_HTML.jpg](images/480430_1_En_3_Chapter/480430_1_En_3_Fig30_HTML.jpg)


    **图 3-30** 测试数据及对应的 LSTM 模型对累计产量的预测图（左图），以及测试数据观测值与 LSTM 预测累计产量的交叉图（右图）


    ## 超参数优化


    我们之前提到，超参数优化有助于提高模型精度。在本节中，我们将演示一个优化过程的简单代码示例。但在深入实现细节之前，让我们先了解超参数的定义。'
