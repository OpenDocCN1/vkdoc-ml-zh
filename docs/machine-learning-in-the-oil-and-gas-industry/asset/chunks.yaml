- fmt: '# Facies Classification


    Facies can be understood as a class of rock with distinct characteristics. Understanding
    of facies distribution in an oil and gas reservoir can help in identifying the
    regions, which are more likely to have oil and gas producing rocks. In the recent
    years, machine learning approaches applying deep neural networks have shown reasonable
    accuracy in classifying facies based on the petrophysical properties from the
    well logs [[20](#480430_1_En_1_Chapter.xhtml#Par149)], and at random points of
    interest away from the wells [[19](#480430_1_En_1_Chapter.xhtml#Par148)].


    ## Reservoir Engineering


    Reservoir engineers have access to almost all the data used by geoscientists.
    They also have hydrocarbon production and operational history data for the field
    they are responsible for. They use a diverse variety of data to develop a plan
    for economically optimal exploitation of oil and gas from the reservoir, and the
    whole oilfield at large. Some of the reservoir engineering activities, where machine
    learning has shown potential benefits, are discussed next.


    ### Field Development Planning


    During the field development planning, reservoir engineers use data from the existing
    wells. Based on the analysis of data from existing wells, they decide the placement
    of new wells. Specifically, this is a standard practice in the development of
    unconventional oil and gas resources. There have been several approaches to applying
    machine learning to plan new wells based on historical data.


    One such approach used dimensionality reduction by applying principal component
    analysis (`PCA`), followed by regression methods to predict the production potential
    of new proposed wells [[21](#480430_1_En_1_Chapter.xhtml#Par150)]. The analysis
    based on machine learning methods has also demonstrated the capability of uncovering
    hidden patterns, which are not easily noticed in a high dimensional space. By
    identifying these patterns, it’s demonstrated that the wells expected to behave
    similarly can be identified. Further analysis can reveal common properties of
    wells exhibiting similar behavior, the underlying reasons for poor performance
    in the wells not behaving satisfactorily, and measures to avoid similar poor performance
    in the new wells [[22](#480430_1_En_1_Chapter.xhtml#Par151)].


    ### Assisted History Matching


    The process of history matching follows an iterative scheme for tuning reservoir
    parameters. The process converges when a reasonable match between the history-matched
    and observed reservoir performance is achieved. In the reservoirs with high heterogeneity,
    and complexity, history matching may be a time-consuming process with a high computational
    cost. In recent years, artificial neural network-based methodologies have been
    applied to reservoir history matching [[23](#480430_1_En_1_Chapter.xhtml#Par152)].
    Such methodologies employ fully data-driven proxy models, which reduce the computational
    cost significantly. The proxy reservoir models run at a fraction of computational
    cost when compared to a full-scale numerical reservoir simulator. This reduction
    in computational cost makes the process of history matching highly efficient [[24](#480430_1_En_1_Chapter.xhtml#Par153)].


    ### Production Forecasting and Reserve Estimation


    Forecasting oil production from the oil-producing wells is among the main responsibilities
    of reservoir engineers. Based on the generated production forecast, decisions
    about future field development activities are taken. Production forecasting helps
    in the estimation of available reserves and economic evaluation. Traditionally
    numerical simulations and decline curve analysis (`DCA`) techniques are extensively
    used for production forecasting. These techniques require knowledge of the reservoir
    behavior and lack flexibility for modeling complex physics.


    In recent years, machine learning methodologies using feed-forward neural networks
    [[25](#480430_1_En_1_Chapter.xhtml#Par154)] [[26](#480430_1_En_1_Chapter.xhtml#Par155)],
    and recurrent neural networks have demonstrated their effectiveness and accuracy
    in a production forecast of single and multiple wells. These machine learning
    approaches make the process of forecasting efficient and accurate for the assets
    with or without significant operational history information [[27](#480430_1_En_1_Chapter.xhtml#Par156)].


    ## Drilling and Completion


    Offshore drilling is a high-risk and high-CAPEX operation. Deepwater offshore
    drilling may cost as much as US $1 million per day, and a single well may cost
    hundreds of millions of dollars in a deepwater drilling scenario. Provided these
    facts, automation employing machine learning models can improve operational safety
    in the drilling operations significantly, and bring the drilling costs down simultaneously.
    Some of the applications of machine learning in the drilling and completion activities,
    which demonstrate the significant promise of improved operational safety, and
    cost benefits, are discussed next.


    ### Automated Event Recognition and Classification


    Upstream assets create valuable insights from manually generated operator reports
    and sensor data, such as weight on bit, standpipe pressure, rotation frequency,
    and so forth. Such value can be achieved if and only if data is of adequate quality
    and information is properly interpreted, stored, and used. Reports and data provide
    the basis for deriving well events. Examples of well events include productive
    time (e.g., drilling hole), non-productive time or `NPT` (e.g., stuck pipe, stick-slip
    vibration, hole cleaning, pipe failures, loss of circulation, bottomhole assembly
    whirl, excessive torque and drag, low rate of penetration, bit wear, formation
    damage, and borehole instability, etc.), and invisible lost time or `ILT` (e.g.,
    slow pipe connection, suboptimal drilling, and tripping).


    For many years, drilling and completion operations have been supported with extensive
    data collection processes. In the last two decades, with the inclusion of downhole
    sensors and telecommunication capabilities, there is a broad spectrum of real-time
    data collection processes that occur during drilling and completion operations.
    The current challenge is to identify events from real-time data and derive insights
    to prevent `NPT` and `ILT`. Traditionally, daily drilling reports (`DDR`) have
    been the source of truth for describing detailed log of key operations and events
    occurring at the rig site; however, they are subject to human bias, and they use
    inconsistent text formats and nomenclature. The objective of automated event recognition
    and classification is to pinpoint and rectify problems that occur in the drilling
    process [[28](#480430_1_En_1_Chapter.xhtml#Par157)] and within a time frame that
    enables optimum and safe drilling operation.


    Various machine learning techniques have been proposed to automatically identify
    and classify drilling events by detecting the changing trend of drilling parameters
    when the events happen. Drilling events are extracted from massive `DDR` and real-time
    drilling databases using defined expert rules, thresholds, and criteria [[29](#480430_1_En_1_Chapter.xhtml#Par158)],
    as well as regression and classification methods [[30](#480430_1_En_1_Chapter.xhtml#Par159)].
    There have also been attempts to maximize the value from `DDR` and real-time data
    [[31](#480430_1_En_1_Chapter.xhtml#Par160)].


    ### Non-Productive Time (NPT) Minimization


    Non-productive time (`NPT`) in the drilling operations may arise out of multiple
    reasons. Due to the high rental fees of drilling equipment, there’s an economic
    incentive for minimizing such non-productive time. Kicks and stuck pipe are among
    two of the most significant problems leading to non-productive time. A machine
    learning approach to predict the incidence of these problems is discussed next.'
