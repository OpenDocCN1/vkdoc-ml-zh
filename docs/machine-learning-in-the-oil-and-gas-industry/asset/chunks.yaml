    and ARIMA, were discussed. Production data from a well in North Dakota was used
    as an example; the information was scraped from a public website. Decline curve
    analysis using the Arps method is the conventional form of forecasting used in
    the field of reservoir engineering. The time series–based approach using ARIMA
    is statistically oriented and provides a machine learning flavor to the production
    forecasting problem. The application of these two methods shows their effectiveness
    in solving the problem. We encourage you to apply these methods in your day-to-day
    production forecasting.


    # 7. Production Engineering


    Production engineering deals with the analysis of field data and models to make
    decisions on how to optimally maintain the well and surface production facilities’
    performance. This chapter covers selected topics of production modeling using
    machine learning methodologies. The topics include model identification for predicting
    well rates, identification of early actions to achieve optimal production rates,
    and identification of the producing wells, which may benefit from the workover
    activities.


    ## Production Engineering Overview


    Production optimization encompasses various activities, including measuring, analyzing,
    modeling, prioritizing, and implementing actions to enhance productivity and profitability.
    Production engineers broadly consider multiple options to improve production system
    conditions technically, economically, and environmentally. As an example of an
    upstream integrated production system from the source reservoir to the point of
    sales, Figure [7-1](#480430_1_En_7_Chapter.xhtml#Fig1) shows the schematic of
    a coalbed gas production system from the reservoir interface up to the sales point
    [[1](#480430_1_En_7_Chapter.xhtml#Par130)].


    ![../images/480430_1_En_7_Chapter/480430_1_En_7_Fig1_HTML.jpg](images/480430_1_En_7_Chapter/480430_1_En_7_Fig1_HTML.jpg)


    Figure 7-1


    Integrated gas-water production system [[1](#480430_1_En_7_Chapter.xhtml#Par130)]


    The relationship of flowing pressure as a function of liquid rate describes the
    steady-state well performance at any point in time (Figure [7-2](#480430_1_En_7_Chapter.xhtml#Fig2)).
    The outcomes of well optimization may be to enhance productivity in the reservoir
    (left), which results in higher liquid rates at higher flowing pressure and/or
    to reduce the restrictions in the outflow (right), which increases liquid rates
    at lower flowing pressures.


    ![../images/480430_1_En_7_Chapter/480430_1_En_7_Fig2_HTML.png](images/480430_1_En_7_Chapter/480430_1_En_7_Fig2_HTML.png)


    Figure 7-2


    Rate increase along inflow and outflow performance curves


    With the introduction of digital automation over the last couple of decades, a
    mature technology framework exists for enabling both one-off and continuous oil
    and gas field optimization [[2](#480430_1_En_7_Chapter.xhtml#Par131)]. Continuous
    optimization requires the integration of field hardware (e.g., downhole sensors,
    remotely activated completions, surface facilities) and computer algorithms enabling
    decision making, including data processing, virtual sensing, pattern recognition,
    and physics model integration.


    Production engineering typically addresses the following questions through data
    analysis and physics modeling.


    - Is the asset (reservoir, well, facility) producing up to its full potential?

    - What is the surveillance data revealing about asset health conditions?

    - What is the production limiting factor?

    - What is the most likely cause of production loss/deferral?

    - What is the most effective action to arrest decline, and restore or increase
    production?

    - If an action is taken, would it be successful, profitable, and sustainable?


    Production engineering is a continuous process for enhancing technical and financial
    performance in the oil and gas fields. The goal is to maximize the effective production
    system capacity at the minimum cost and effort. This cyclic process involves routine
    data acquisition, analyze data and integrate information, options analysis and
    decision, and detailed engineering and execution (see Figure [7-3](#480430_1_En_7_Chapter.xhtml#Fig3)).


    ![../images/480430_1_En_7_Chapter/480430_1_En_7_Fig3_HTML.jpg](images/480430_1_En_7_Chapter/480430_1_En_7_Fig3_HTML.jpg)


    Figure 7-3


    Production engineering key processes


    A large variety and volume of data are captured through routine surveillance programs,
    which are assimilated to identify abnormal events by exception. Accordingly, production
    engineers analyze and integrate all acquired data for assessing the status, modeling
    system performance and establishing the optimum operating envelope of wells and
    facilities. Such analysis allows tagging of key performance labels for well and
    facilities.


    - Based on flowing status: active healthy, active unhealthy, and inactive

    - Based on expected performance: as expected, above or below expected performance

    - Based on problem identification: none, precursor event, problem, failure

    - Based on potential and constrained capacity: reservoir, wells, facilities, legal,
    planned maintenance'
