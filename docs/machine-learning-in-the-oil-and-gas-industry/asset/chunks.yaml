- fmt: '# Decline Curve Analysis Using the Arps Empirical Model


    In this section, we focus on a decline curve analysis, which is a technique used
    by reservoir engineers to generate a forecast of future production rates of an
    oil or gas well. The results then determine the *estimated ultimate recovery*
    (EUR). The most commonly used equations are in the form of the empirical relationship
    between decline parameters, rate, and time as provided in a previous study [[29](#480430_1_En_6_Chapter.xhtml#Par85)],
    and are still commonly used. An integral component of modern production data analysis,
    the process also includes flow regime characterization, recovery factor estimation,
    and estimation of fluid-in-place.


    The equations for decline curve analysis using this method are shown in the following
    section. This traditional graphical approach does not have a theoretical basis,
    and implicitly assumes constant operating conditions for the life of the well.
    Arps model has been successfully used in wells that have reached *boundary dominated
    flow* (BDF).


    A note of caution regarding the majority of unconventional wells that have not
    reached boundary dominated flow and show steep declines in the transient period
    itself: This approach does not use pressure data either. An example of a well
    is shown where a curve is fit using parameters for *qi*, *b*, and *Di*, and a
    hyperbolic equation is used. A forecast is made for the 2019 period using the
    fitted curve.


    To match historical data and make predictions, SciPy, a Python-based open source
    library, is used. SciPy provides a wrapper function—`curve_fit()` around `scipy.optimize.leastsq`
    [[30](#480430_1_En_6_Chapter.xhtml#Par86)]. This function uses a nonlinear least-squares
    method to fit a function and determine the necessary coefficients. The `curve_fit`
    method takes in three parameters at least.


    ```

    popt, pcov = curve_fit(func, T, Q)

    ```


    (6.1)


    The first argument in the function call is a function. Any function can be passed
    to it as if it’s any other variable. The function in our case is exponential,
    hyperbolic, or harmonic, and can take independent variable (e.g., time for the
    decline curve example) as well as any other fitting parameter. For example, in
    a hyperbolic function, *qi*, *b*, and *Di* are passed, whereas in an exponential
    function, only *qi* and *Di* are required since *b*=0. Apart from the function
    definition, independent variable and observed data is also passed, which is required
    to be fit. An L2 norm can determine the quality of the fit where the actual value
    is compared to the curve-fitting prediction.


    ```

    Error_L2 = Σ|q(t) - q_obs(t)|²

    ```


    (6.2)


    ## Equations and Descriptions


    Each type of functional form used in decline curve analysis has specific features.
    Here we discuss some of the salient features for different types of decline curves.


    ### Exponential Decline


    In this type of decline, a straight line is observed between flow rate and cumulative
    production, as well as between the logarithms of rate against time on the *x*-axis.
    The decline rate is constant. Predictions from this equation yield the minimum
    *estimated ultimate recovery* (EUR), and the rate can be calculated by using the
    following equation.


    ![$$ q=\frac{q_i}{e^{D_it}}. $$](images/480430_1_En_6_Chapter/480430_1_En_6_Chapter_TeX_Equ1.png)


    (6.3)


    ### Hyperbolic Decline


    This is the most common Arps equation since straight-line plots are rarely encountered
    in real-life scenarios. The decline rate is not constant while the decline exponent
    factor *b* lies between 0 and 1 for conventional reservoirs (cases in which boundary
    dominated flow is the dominant flow regime), and is often determined by nonlinear
    curve fitting approach. Higher values of *b* factor have been observed in unconventional
    reservoirs. An example of such a case is a transient linear flow, where *b*=2.
    The rate for reservoirs exhibiting hyperbolic decline can be obtained by using
    the following equation.


    ![$$ q=\frac{q_i}{{\left(1+b{D}_it\right)}^{\frac{1}{b}}}. $$](images/480430_1_En_6_Chapter/480430_1_En_6_Chapter_TeX_Equ2.png)


    (6.4)


    ### Harmonic Decline


    This is considered to be a special case of hyperbolic decline with a *b*=1. In
    this case, the decline rate is directly proportional to the flow rate. A semi-log
    plot with a logarithm of flow rate against cumulative production shows a straight
    line. The flow rate can be calculated using the following equation.


    ![$$ q=\frac{q_i}{1+{D}_it}. $$](images/480430_1_En_6_Chapter/480430_1_En_6_Chapter_TeX_Equ3.png)


    (6.5)


    ## Results


    History matching for the wells was performed, and the results are shown in Figure
    [6-5](#480430_1_En_6_Chapter.xhtml#Fig5).


    ![../images/480430_1_En_6_Chapter/480430_1_En_6_Fig5_HTML.jpg](images/480430_1_En_6_Chapter/480430_1_En_6_Fig5_HTML.jpg)


    Figure 6-5


    History match results using Arps decline curve model


    For both example wells, the hyperbolic equation provides a better match. Although
    for the second well, hyperbolic and harmonic equations both show similar history
    match.


    Using the model parameters, forecasts for oil production rates could be made by
    changing the time, *t*, in the equations. Figure [6-6](#480430_1_En_6_Chapter.xhtml#Fig6)
    shows the results for forecasts made for the two wells for an additional 5000
    days.


    ![../images/480430_1_En_6_Chapter/480430_1_En_6_Fig6_HTML.jpg](images/480430_1_En_6_Chapter/480430_1_En_6_Fig6_HTML.jpg)


    Figure 6-6


    Forecasted results using Arps decline curve model


    ## Validation


    A test dataset which includes production from 2019 onwards is used to validate
    the performance of forecasts from the decline curve model. This data has not been
    used to train the empirical models and serves the purpose of validating the performance
    of the model. Figure [6-7](#480430_1_En_6_Chapter.xhtml#Fig7) includes the comparison
    of hyperbolic curve performance with the actual data.


    A common accuracy metric—root-mean-squared error (RMSE)—is determined in this
    example to quantify the accuracy of predictions from the hyperbolic model.


    ```

    RMSE - Hyperbolic Model: 81.419 bbl/d

    ```


    ![../images/480430_1_En_6_Chapter/480430_1_En_6_Fig7_HTML.jpg](images/480430_1_En_6_Chapter/480430_1_En_6_Fig7_HTML.jpg)


    Figure 6-7


    Comparison between actual data and hyperbolic forecast which includes the test
    data (i.e., production from 2019 onward)


    # Time Series–Based Forecasting Using the ARIMA Model


    Another method for understanding the trend of the time series data and forecasting
    includes analyzing statistical trends from historical data. A common model, ARIMA
    (*autoregressive integrated moving average*), is used in this chapter. In this
    particular analysis, the date column needs to be converted to `datetime` datatype
    for easier manipulation of time data.'
