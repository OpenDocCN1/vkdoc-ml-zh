- fmt: "### What Are Hyperparameters?\n\nHyperparameters are the variables, which\
    \ are used during the machine learning algorithm-training process to learn the\
    \ best model parameters. In other words, hyperparameters are the parameters, which\
    \ help in learning optimal model parameters. Some examples of hyperparameters\
    \ include the following.\n\n- The number of layers in a neural network\n- The\
    \ number of nodes in the neural network layers\n- The type of activation function\
    \ for the neural network nodes\n- The number of iterations or epochs for model\
    \ training\n- The choice of “kernel” type in kernel-based methods\n- The regularization\
    \ parameter\n- The type of neural network weight initialization\n- The tolerance\
    \ for early-stopping (`min_delta`)\n- The number of epochs to wait before early-stopping\
    \ (`patience`)\n\nWhile the name of this approach suggests that it is only applicable\
    \ for optimizing hyperparameters, in certain scenarios, it can also tune model\
    \ parameters. We demonstrate this using a code example.\n\n#### Using Hyperopt\
    \ for Hyperparameter Optimization\n\nWe are using Hyperopt, a Python library,\
    \ to demonstrate the hyperparameter optimization process. We demonstrate the process\
    \ using a support vector classifier algorithm. We used the lithotype classification\
    \ data and built a vanilla classifier. Accuracy of this vanilla classifier serves\
    \ as a baseline to evaluate the improvement in model performance as a result of\
    \ the hyperparameter optimization process. The following code snippet shows vanilla\
    \ classifier implementation and corresponding classification accuracy.\n\n```\n\
    svc = SVC()\nsvc.fit(X_train, y_train)\n# Prediction on test data\ny_pred = svc.predict(X_test)\n\
    # Accuracy Metrics\nclf_metrics(y_test, y_pred)\nClassification Accuracy Score:\
    \ 0.8621700879765396\n```\n\nHyperopt uses an objective function, which is minimized\
    \ to compute optimal values of model parameters and hyperparameters. In the following\
    \ example, an accuracy score from k-fold cross-validation multiplied by –1, is\
    \ used as the objective function. The objective function is minimized by iteratively\
    \ adjusting the hyperparameters and model parameters over 50 iterations. Some\
    \ important aspects of the implementation include the following.\n\n- **K-fold\
    \ cross-validation:** In this method, training data is split into *k* subsets\
    \ or folds. By using these k-folds, *k* separate models are trained. Each model\
    \ is trained by holding one of the k-folds for validation (validation fold) at\
    \ a time and using remaining k-1 folds for training the model. The accuracy score\
    \ for k-fold cross-validation is computed by averaging accuracy scores of individual\
    \ models on the data in the respective validation fold.\n- **Parameter space:**\
    \ Defines the range of values that model parameters and hyperparameters associated\
    \ with the model can assume.\n- **Hyperparameters:** In this example, the type\
    \ of kernel is a hyperparameter. The constant *C*, degree of the polynomial, and\
    \ gamma are model parameters. This is an example where both hyperparameters and\
    \ model parameters are being optimized at the same time.\n\nThe following code\
    \ snippet shows the approach for finding an optimal kernel, and corresponding\
    \ parameters for the support vector classifier model.\n\n```\ndef objective(params):\n\
    svc = SVC(**params)\nreturn -1\\. * cross_val_score(svc, X_train, y_train).mean()\n\
    kernels = ['rbf','poly','rbf','sigmoid']\nspace = {'C':hp.lognormal('C', 0, 1),\n\
    'kernel':hp.choice('kernel', kernels),\n'degree':hp.choice('degree', range(1,\
    \ 15)),\n'gamma':hp.uniform('gamma', 1e-2, 1e2)\n}\ntrials = Trials()\nbest_svc\
    \ = fmin(objective, space, algo=tpe.suggest, max_evals=50, trials=trials)\nprint(best_svc)\n\
    {'C': 1751.5444736790396, 'degree': 11, 'gamma': 5.899864955354083, 'kernel':\
    \ 0}\n```\n\nAfter the determination of the best kernel type, and model parameters,\
    \ the best model is used for generating predictions on the test data.\n\n```\n\
    svc = SVC(C=best_svc['C'],\nkernel=kernels[best_svc['kernel']],\ndegree=best_svc['degree'],\n\
    gamma=best_svc['gamma'])\nsvc.fit(X_train, y_train)\n# Prediction on test data\n\
    y_pred = svc.predict(X_test)\n# Accuracy Metrics\nclf_metrics(y_test, y_pred)\n\
    Classification Accuracy Score: 0.9618768328445748\n```\n\nThe example shows that\
    \ hyperparameter optimization using the Hyperopt library improves model classification\
    \ accuracy from 0.86 to 0.96. A similar process can be applied for improving the\
    \ accuracy of any other machine learning or deep learning algorithm by implementing\
    \ an appropriate objective function.\n\n## Summary\n\n> *I didn’t come here to\
    \ tell you how this is going to end. I came here to tell you how it’s going to\
    \ begin.*\n> \n> —Neo in *The Matrix* [[12](#480430_1_En_3_Chapter.xhtml#Par238)]\n\
    \nMachine learning and deep learning are vast topics. In this chapter, we attempted\
    \ to provide an overview of several concepts related to machine learning and deep\
    \ learning algorithms. Our focus was on providing simple code implementation of\
    \ each algorithm using open source datasets. However, we acknowledge that mastering\
    \ these concepts requires further study and continued practice. Please refer to\
    \ the next steps recommended in the “Further Reading” section. In the following\
    \ chapters, we are going to build some interesting machine learning applications\
    \ for oil and gas industry-related problems by applying the concepts that we discussed\
    \ in this chapter.\n\n# 4. Geophysics and Seismic Data Processing\n\nIn the previous\
    \ chapters, we gained an understanding of Python programming, learned concepts\
    \ of machine learning and deep learning, and implemented some of these concepts\
    \ using Python. The focus of this chapter is to give an overview of the applications\
    \ of machine learning in the field of geophysics. The primary objective of exploration\
    \ workflows is the use of seismic data processing to build earth models to estimate\
    \ the reservoir properties. This is a mature and well-studied problem, with several\
    \ decades of academic and industrial research behind the science of seismic imaging\
    \ and reservoir property estimation.\n\nMachine Learning in exploration geophysics\
    \ has a long history almost coinciding with the rise and ebb in machine learning\
    \ in the last few decades. Applications in exploration geophysics workflows are\
    \ many and plenty. It is beyond the scope of this chapter to explain each of them\
    \ in detail. The approach of this chapter is to offer an overview of the seismic\
    \ imaging process, and discuss in detail about the challenging problem of salt\
    \ interpretation. The chapter will conclude with a brief summary of several other\
    \ problems and pointers to relevant literature in exploration and interpretation\
    \ workflows."
  raw: "### What Are Hyperparameters?\n\nHyperparameters are the variables, which\
    \ are used during the machine learning algorithm-training process to learn the\
    \ best model parameters. In other words, hyperparameters are the parameters, which\
    \ help in learning optimal model parameters. Some examples of hyperparameters\
    \ include the following.\n\n*   The number of layers in a neural network\n\n*\
    \   The number of nodes in the neural network layers\n\n*   The type of activation\
    \ function for the neural network nodes\n\n*   The number of iterations or epochs\
    \ for model training\n\n*   The choice of “kernel” type in kernel-based methods\n\
    \n*   The regularization parameter\n\n*   The type of neural network weight initialization\n\
    \n*   The tolerance for early-stopping (`min_delta`)\n\n*   The number of epochs\
    \ to wait before early-stopping (`patience`)\n\nWhile the name of this approach\
    \ suggests that it is only applicable for optimizing hyperparameters, in certain\
    \ scenarios, it can also tune model parameters. We demonstrate this using a code\
    \ example.\n\n#### Using Hyperopt for Hyperparameter Optimization\n\nWe are using\
    \ Hyperopt, a Python library, to demonstrate the hyperparameter optimization process.\
    \ We demonstrate the process using a support vector classifier algorithm. We used\
    \ the lithotype classification data and built a vanilla classifier. Accuracy of\
    \ this vanilla classifier serves as a baseline to evaluate the improvement in\
    \ model performance as a result of the hyperparameter optimization process. The\
    \ following code snippet shows vanilla classifier implementation and corresponding\
    \ classification accuracy.\n\n```\nsvc = SVC()\nsvc.fit(X_train, y_train)\n# Prediction\
    \ on test data\ny_pred = svc.predict(X_test)\n# Accuracy Metrics\nclf_metrics(y_test,\
    \ y_pred)\nClassification Accuracy Score: 0.8621700879765396\n```\n\nHyperopt\
    \ uses an objective function, which is minimized to compute optimal values of\
    \ model parameters and hyperparameters. In the following example, an accuracy\
    \ score from k-fold cross-validation multiplied by –1, is used as the objective\
    \ function. The objective function is minimized by iteratively adjusting the hyperparameters\
    \ and model parameters over 50 iterations. Some important aspects of the implementation\
    \ include the following.\n\n*   **K-fold cross-validation:** In this method, training\
    \ data is split into *k* subsets or folds. By using these k-folds, *k* separate\
    \ models are trained. Each model is trained by holding one of the k-folds for\
    \ validation (validation fold) at a time and using remaining k-1 folds for training\
    \ the model. The accuracy score for k-fold cross-validation is computed by averaging\
    \ accuracy scores of individual models on the data in the respective validation\
    \ fold.\n\n*   **Parameter space:** Defines the range of values that model parameters\
    \ and hyperparameters associated with the model can assume.\n\n*   **Hyperparameters:**\
    \ In this example, the type of kernel is a hyperparameter. The constant *C*, degree\
    \ of the polynomial, and gamma are model parameters. This is an example where\
    \ both hyperparameters and model parameters are being optimized at the same time.\n\
    \nThe following code snippet shows the approach for finding an optimal kernel,\
    \ and corresponding parameters for the support vector classifier model.\n\n```\n\
    def objective(params):\nsvc = SVC(**params)\nreturn -1\\. * cross_val_score(svc,\
    \ X_train, y_train).mean()\nkernels = ['rbf','poly','rbf','sigmoid']\nspace =\
    \ {'C':hp.lognormal('C', 0, 1),\n'kernel':hp.choice('kernel', kernels),\n'degree':hp.choice('degree',\
    \ range(1, 15)),\n'gamma':hp.uniform('gamma', 1e-2, 1e2)\n}\ntrials = Trials()\n\
    best_svc = fmin(objective, space, algo=tpe.suggest, max_evals=50, trials=trials)\n\
    print(best_svc)\n{'C': 1751.5444736790396, 'degree': 11, 'gamma': 5.899864955354083,\
    \ 'kernel': 0}\n```\n\nAfter the determination of the best kernel type, and model\
    \ parameters, the best model is used for generating predictions on the test data.\n\
    \n```\nsvc = SVC(C=best_svc['C'],\nkernel=kernels[best_svc['kernel']],\ndegree=best_svc['degree'],\n\
    gamma=best_svc['gamma'])\nsvc.fit(X_train, y_train)\n# Prediction on test data\n\
    y_pred = svc.predict(X_test)\n# Accuracy Metrics\nclf_metrics(y_test, y_pred)\n\
    Classification Accuracy Score: 0.9618768328445748\n```\n\nThe example shows that\
    \ hyperparameter optimization using the Hyperopt library improves model classification\
    \ accuracy from 0.86 to 0.96\\. A similar process can be applied for improving\
    \ the accuracy of any other machine learning or deep learning algorithm by implementing\
    \ an appropriate objective function.\n\n## Summary\n\n> *I didn’t come here to\
    \ tell you how this is going to end. I came here to tell you how it’s going to\
    \ begin.*\n> \n> —Neo in *The Matrix* [[12](#480430_1_En_3_Chapter.xhtml#Par238)]\n\
    \nMachine learning and deep learning are vast topics. In this chapter, we attempted\
    \ to provide an overview of several concepts related to machine learning and deep\
    \ learning algorithms. Our focus was on providing simple code implementation of\
    \ each algorithm using open source datasets. However, we acknowledge that mastering\
    \ these concepts requires further study and continued practice. Please refer to\
    \ the next steps recommended in the “Further Reading” section. In the following\
    \ chapters, we are going to build some interesting machine learning applications\
    \ for oil and gas industry-related problems by applying the concepts that we discussed\
    \ in this chapter.\n\n# 4. Geophysics and Seismic Data Processing\n\nIn the previous\
    \ chapters, we gained an understanding of Python programming, learned concepts\
    \ of machine learning and deep learning, and implemented some of these concepts\
    \ using Python. The focus of this chapter is to give an overview of the applications\
    \ of machine learning in the field of geophysics. The primary objective of exploration\
    \ workflows is the use of seismic data processing to build earth models to estimate\
    \ the reservoir properties. This is a mature and well-studied problem, with several\
    \ decades of academic and industrial research behind the science of seismic imaging\
    \ and reservoir property estimation.\n\nMachine Learning in exploration geophysics\
    \ has a long history almost coinciding with the rise and ebb in machine learning\
    \ in the last few decades. Applications in exploration geophysics workflows are\
    \ many and plenty. It is beyond the scope of this chapter to explain each of them\
    \ in detail. The approach of this chapter is to offer an overview of the seismic\
    \ imaging process, and discuss in detail about the challenging problem of salt\
