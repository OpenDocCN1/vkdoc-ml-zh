    ## 管理依赖产量的含水率


    在许多情况下，含水率（WCT）和气油比（GOR）是依赖产量的现象，可以通过降低产量来最小化。这些现象可能是高迁移率相粘性指进和/或锥进的结果。


    当井底油水接触面因井底压降而形成锥形剖面，克服了油水重力分异时，就会发生水锥。水突破后，锥进会增加含水率，并显著降低产油量和采收率[14]。作业者可以以不导致水或气突破的产量进行生产。这种稳态条件下的最大产量称为*临界产油量*。临界产油量准则限制了短期收益；因此，明智地计算它至关重要，尤其是在天然裂缝性油藏（NFR）中。


    由于具有底水驱动的天然裂缝性油藏以瞬时水突破和极高含水率而闻名，当产量过低时，在临界产油量以下生产油井可能变得不经济。因此，有必要研究在天然裂缝性油藏中进行临界产油量生产的可行性[14]。


    ### 预测临界产油量


    通过使用商业模拟器[15]上实现的双重孔隙-双重渗透率（DPDP）模型，对多种具有底水的天然裂缝性油藏进行建模，开发了一个临界产油量预测器。模拟输入数据表明，少数天然裂缝性油藏的临界产油量可高达
    200 桶/天，这是经济的。


    在开发临界产油量的半解析模型[14]过程中，执行了以下步骤。


    1.  通过将裂缝网络表示为等效的连续多孔介质，简化了天然裂缝性油藏。


    2.  在用天然裂缝性油藏的等效渗透率替换基质渗透率后，用天然裂缝性油藏的模拟临界产量值验证了 Chaperon 的临界产量机理模型[16]。


    3.  使用代表多种天然裂缝性油藏的设计系列模拟实验，对所得机理模型进行统计校准，以纳入被忽略的物理效应。


    这些步骤得出了一个经统计校准的天然裂缝性油藏临界产油量机理模型[16]（*q*[*cr*, *fr*]），可写为方程 7.2。


    ![$$ {q}_{cr, fr}=0.0783\times {10}^{-4}\frac{{\mathrm{k}}_{\mathrm{f},\mathrm{m}}{h}_o²}{B_o{\mu}_o}\left(\Delta
    \rho \right)\left(1-{\left(\frac{h_{op}}{h_o}\right)}²\right)f\left(\frac{{\mathrm{r}}_{\mathrm{e}}}{{\mathrm{h}}_{\mathrm{o}}}\sqrt{\frac{{\mathrm{k}}_{fv}}{{\mathrm{k}}_{fh}}}\right).
    $$](img/480430_1_En_7_Chapter_TeX_Equ2.png)


    (7.2)


    其中，k[f, m] = k[fh] + k[mh]


    其中，k[fh] 是有效裂缝渗透率，毫达西；k[mh] 是基质渗透率，毫达西；k[f, m] 是天然裂缝性油藏的平均渗透率，毫达西；h[o] 是油层厚度，英尺；r[e]
    是油藏半径，英尺；*μ*[*o*] 是原油粘度，厘泊；*B*[*o*] 是原油地层体积系数；*h*[*op*] 是射孔段长度，英尺；![$$ \frac{{\mathrm{k}}_{fv}}{{\mathrm{k}}_{fh}}
    $$](img/480430_1_En_7_Chapter_TeX_IEq1.png)是裂缝网络的各向异性比；*q*[*cr*, *fr*] 是天然裂缝性油藏中裂缝井的临界产油量。


    为了确定模型的经验分量（方程 7.1）![$$ f\left(\frac{{\mathrm{r}}_{\mathrm{e}}}{{\mathrm{h}}_{\mathrm{o}}}\sqrt{\frac{{\mathrm{k}}_{fv}}{{\mathrm{k}}_{fh}}}\right)
