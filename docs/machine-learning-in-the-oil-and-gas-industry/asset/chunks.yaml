    ## 监督学习


    正如我们在本章开头所讨论的，已知输入预测变量输出的问题属于监督学习范畴。如果输出是定量或连续的，则属于回归问题。而如果输出是定性或离散/分类的，则属于分类问题[[10](#480430_1_En_3_Chapter.xhtml#Par236)]。换句话说，目标是学习一个函数`f`，它表示由输入变量提供的系统信息，用于预测或推断响应（输出）变量[[7](#480430_1_En_3_Chapter.xhtml#Par233)]。


    在本节中，我们提供了各种回归和分类算法的简单实现代码片段。目的是通过提供一个起点，让您熟悉不同的算法。本章后面的一节将介绍一个超参数调优示例，该示例可适用于本章讨论的任何机器学习算法。


    在简要描述并提供了不同算法的代码片段后，我们进行了简要分析以了解每种算法的性能。但需要注意的是，这些算法实现并未针对性能进行优化；因此，使用这些算法进行微调的模型可能会表现出比此处简单实现更好的性能。


    ### 回归


    回归是监督学习问题的一个子类型，其输出是定量或连续变量。在我们一直使用的岩石物理数据示例中，`KLOGH`被选为输出变量。所有其他特征都被视为独立的输入变量。因此，回归问题的目标是找到最优函数`f`，该函数能够使用所有其他变量作为输入特征，准确预测`KLOGH`。


    ![$$ KLOGH=f\Big( BVW, CARB\_ FLAG, COAL\_ FLAG, PHIF, RHOFL, RHOMA, $$](images/480430_1_En_3_Chapter/480430_1_En_3_Chapter_TeX_Equa.png)


    ![$$ RW, SAND\_ FLAG, SW, TEMP, VSH\Big). $$](images/480430_1_En_3_Chapter/480430_1_En_3_Chapter_TeX_Equ10.png)


    (3.10)


    本节简要讨论了各种机器学习算法，但未深入探讨其数学细节或超参数优化。本节展示了这些算法的最小实现，我们建议您按照本章末尾“进一步阅读”部分提供的建议，深入了解每种算法。


    使用`scikit-learn`和`TensorFlow`机器学习库，通过`Python`实现这些算法。本章示例的端到端代码可在本书代码仓库中的`Jupyter`笔记本中找到。该`Jupyter`笔记本还包含一些基本函数，这些函数用于生成精度指标、绘制回归曲线以及生成预测结果的散点图。


    #### 多元线性回归


    多元线性回归，或简称为多元回归，是最简单的回归算法。在该算法中，为每个输入特征分配数值系数，输出变量被预测为特征值乘以相应系数后所得值的总和。该算法的训练过程试图最小化观测值与模型预测输出值之间的残差平方和。以下代码片段展示了该算法的一个示例实现。


    ```

    # Multiple Linear Regression

    from sklearn.linear_model import LinearRegression

    lin_reg = LinearRegression()

    lin_reg.fit(X_train, y_train)  # training the algorithm

    print(lin_reg.intercept_)  # intercept

    print(lin_reg.coef_)  # coefficients

    # Prediction on test data

    y_pred_lin = lin_reg.predict(X_test)

    ```


    **结果**


    ```

    Mean Absolute Error: 283.89717843775026

    Mean Squared Error: 245181.5892137209

    Root Mean Squared Error: 495.15814566027376

    R Squared: 0.1488228559603506

    ```


    多元线性回归的回归图如图[3-8](#480430_1_En_3_Chapter.xhtml#Fig8)所示，同时还包括测试数据集中`KLOGH`预测值的比较。从测试数据的观测值与预测值的回归图可以看出，线性模型未能捕捉到输入特征与输出变量之间的非线性映射。可以得出结论，该算法过于简单，无法解决该问题，并且存在严重的偏差（欠拟合）。


    ![../images/480430_1_En_3_Chapter/480430_1_En_3_Fig8_HTML.jpg](images/480430_1_En_3_Chapter/480430_1_En_3_Fig8_HTML.jpg)


    图3-8：多元线性回归结果，以回归图和散点图形式展示'
