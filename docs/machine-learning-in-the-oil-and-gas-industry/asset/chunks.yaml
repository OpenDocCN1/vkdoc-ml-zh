    ## Recommending Optimum Well Spacing in NFRs


    Ultimate water cut defines the theoretical maximum water cut in a reservoir with
    water coning, which determines the maximum economically producible oil in a bottom-water
    reservoir. During the production of such reservoirs, there is an initial rapid
    increase in water cut during the water cone buildup stage, which is later followed
    by the stabilization of water cut (ultimate water cut) in an uncontained oil-zone
    (infinite oil-zone). However, in a multi-well reservoir where each well is bounded
    by a nonflow boundary (NFB), water cut would never stabilize but is replaced by
    a slow water cut increase/advancement rate. This is because of the depletion of
    oil in a limited boundary reservoir resulting in a slow increase of water cut.


    If the well’s drainage area is large enough that the size exceeds the lateral
    length of the water cone (at the end of water cone buildup (expansion) stage),
    the late-time, water cut, slow-advancement stage for the NFB system is controlled
    mostly by the oil-pay depletion, as the effect of the water cone expansion becomes
    negligible and can be ignored.


    Late-time water cut may render the oil production non-economical, so the well’s
    recovery is mostly controlled by the time when the cone expansion ends. This implies
    that the optimum well’s drainage radius should be equal to the lateral length
    of the water cone, which enables the well’s maximum oil recovery. This concept
    is demonstrated in Figure [7-10](#480430_1_En_7_Chapter.xhtml#Fig10). This minimum
    inter-well spacing is defined as threshold well spacing, or two times the threshold
    drainage radius of a well [[14](#480430_1_En_7_Chapter.xhtml#Par143)].


    ![../images/480430_1_En_7_Chapter/480430_1_En_7_Fig10_HTML.jpg](images/480430_1_En_7_Chapter/480430_1_En_7_Fig10_HTML.jpg)


    **Figure 7-10** Threshold drainage radius equal to the water cone lateral length
    (threshold radius) enabling maximum well recovery'
