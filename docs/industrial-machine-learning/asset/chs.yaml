  ### 强化学习的一个实现


  你将使用深度 Q 学习算法。Q 学习是一种基于策略的学习算法，其函数通过神经网络进行估计。


  你首先会了解什么是“推车杆”问题，然后继续编写解决方案的代码。


  当我还是个孩子的时候，我记得我会拿起一根棍子，试着用一只手让它保持平衡。我和朋友们过去常常比赛，谁平衡的时间更长，谁就能得到“奖励”——一块巧克力！


  让我们来编写代码吧！


  为了设置代码，你首先需要安装一些东西。打开名为 `Chapter-009-015-Q-Learn-01.ipynb` 的 Jupyter Notebook。


  你需要安装以下内容：


  ```

  pip install keras-rl

  pip install h5py

  pip install gym

  ```


  让我们开始构建你的 Q 学习过程：


  ```

  import numpy as np

  import gym

  from keras.models import Sequential

  from keras.layers import Dense, Activation, Flatten

  from keras.optimizers import Adam

  from rl.agents.dqn import DQNAgent

  from rl.policy import EpsGreedyQPolicy

  from rl.memory import SequentialMemory

  ENV_NAME = ''CartPole-v0''

  ```


  你必须获取环境并提取推车杆问题中可用的动作数量。


  ```

  env = gym.make(ENV_NAME)

  np.random.seed(20)

  env.seed(20)

  nb_actions = env.action_space.n

  ```


  你需要创建一个单隐藏层的神经网络模型来支持环境的动作。


  ```

  model = Sequential()

  model.add(Flatten(input_shape=(1,) + env.observation_space.shape))

  model.add(Dense(16))

  model.add(Activation(''relu''))

  model.add(Dense(nb_actions))

  model.add(Activation(''linear''))

  ```


  现在你可以查看你的模型了。


  ```

  print(model.summary())

  ```


  接下来，你配置并编译我们的智能体。


  我建议你使用 Epsilon 贪婪策略，并将记忆设置为顺序记忆，因为你必须存储你的推车杆执行的动作结果以及每个动作获得的奖励。


  ```

  policy = EpsGreedyQPolicy()

  memory = SequentialMemory(limit=50000, window_length=1)

  dqn = DQNAgent(model=model, nb_actions=nb_actions, memory=memory, nb_steps_warmup=10,
  target_model_update=1e-2, policy=policy)

  dqn.compile(Adam(lr=1e-3), metrics=[''mae''])

  现在是时候执行训练过程了。

  ```


