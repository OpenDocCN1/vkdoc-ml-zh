  机器学习可以每秒监控数百万个测量值，并确定谁需要何种医疗响应。这种始终在线的医疗服务将成为未来医疗护理的常态。当前的医疗工作人员将成为处理复杂或未知医疗紧急情况的人机回环中的一环。这些医疗干预措施将直接颠覆当今世界人们的生活方式。


