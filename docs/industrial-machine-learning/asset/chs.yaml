  ### 值得信赖的机器人顾问


  想象一下，你拥有一位真正理解你个人复杂需求、目标和风险承受能力的虚拟财务顾问。它会主动采取行动，为你保障应得的未来。它会不知疲倦地全年无休、每天 24 小时工作；通过你授权其访问的个人数据流，来理解你不断变化的生活方式。它会发现节省保险费用的机会，并为你的投资找到更好的回报。


  几乎所有与我接触的公司都在开发某种聊天机器人来与客户互动。许多客户甚至不知道回答他们问题或处理他们交互的，是 IML 解决方案还是真人。


  ## 流内分析 (ISA)


  如今的机器学习往往是一种“开环”系统——例如，离线收集海量数据，批量处理，并生成洞察以供最终行动，而这通常需要数天时间。


  一种新兴的 IML 业务用例类别被称为“流内分析”(ISA)。你使用 IML 在数据从现实世界到达的瞬间进行处理，并快速生成洞察。由于处理过程是实时的，响应时间仅为毫秒级。


  目前，行动可能是在离线状态下采取的，而行动的效果并不会立即反馈到学习过程中。IML 的下一步是走向近实时，根据观察到的行动，在需要时立即以正确的行动做出响应。


  ## 自适应机器学习


  你所追求的系统是自适应机器学习 (AML)，其中“时间”至关重要。实时应用使用传感器、软体机器人甚至硬体机器人，通过向生态系统做出“正确”的行动响应来立即为你赋能，然后衡量该“行动”的即时成功。适应生态系统变化的能力，甚至更胜一筹的是引发变化的能力，至关重要。一个成功的
  AML 解决方案对其管理的闭环系统拥有 95% 的控制权。


