  ### 齿轮


  齿轮是一种带齿的机器轮或圆柱体，它与另一个带齿的部件啮合，以传递运动或改变速度或方向。这个基本原理为你的机器学习提供了操纵现实世界的机械能力。


  我将为你提供关于此过程的基本见解。


  根据 ISO（国际标准化组织）指南，模数被指定为表示齿轮齿尺寸的单位。


  ### 警告


  其他尺寸标注方法也在使用中！请检查以确保齿轮正确匹配。


  ```

  模数 (m)

  m = 1 (p = 3.1416)

  m = 2 (p = 6.2832)

  m = 4 (p = 12.566)

  ```


  如果将模数乘以圆周率 π，就可以得到齿距 (p)。


  齿距是相邻齿上对应点之间的距离。


  ### 提示


  只有齿距相同的齿轮才能一起使用。


  p = π × 模数 = πm


