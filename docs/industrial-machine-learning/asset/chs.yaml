  微维度


  ### 提示


  我使用标准数据仓库原则加上机器学习，用机器学习成果来增强传统数据仓库。


  微维度是数据仓库与数据科学之间的交付纽带。


  ##### 桥接维度


  桥接维度允许在两个维度之间创建多对多关系，以处理一个维度通过同一组键被多次链接的情况。参见图 13-20。


  ![../images/466154_1_En_13_Chapter/466154_1_En_13_Fig20_HTML.png](img/466154_1_En_13_Fig20_HTML.png)


  图 13-20


  桥接维度


  这种桥接常见于数据维度之间存在复杂关系的情况。我发现，当聚类分类存在重叠，或者由于不确定性导致特定实体在任意时间点可能属于多个维度时，这种情况很常见。


  ### 警告


  请谨慎使用这些维度，因为它们可能会扩展到巨大的维度空间，对处理能力要求很高。


