  ### 运营管理层


  #### 机器学习定义与管理


  框架的这一部分存储了所有机器学习算法，随时准备部署到 RIF 中以处理数据湖。此部分保存了 IML 的所有预配置技术，并由数据科学家通过深入研发构建而成。


  #### 参数


  参数部分是数据科学家存储所有设置的地方，旨在为特定类型的数据提供高效且有效的解决方案。


  #### 调度


  IML 的所有调度都集中存储在一个中央调度器中，以确保数据科学家能够单一视图查看 RIF 中所有已调度的 IML 流程。


  #### 监控


  此部分包含所有为 RIF 提供监控能力的程序，以确保 IML 在可用资源下高效且有效地运行。


  #### 通信


  此部分包含中央通信流程，支持经批准且集中支持的通信渠道。


  通信类型可以是与流程直接握手的直接通信，也可以通过电子邮件、短信或使用 Kafka 流式传输的消息传递。


  #### 告警


  此部分处理 IML 流程中的所有告警。系统根据预先约定的容错级别处理任何错误或警告的通信。


  #### 代码管理


  此部分存储系统的所有通用代码。这确保了在评估处理过程中有统一的代码用于数据比对。


  #### 工作单元


  此部分处理物理工作站（物理或虚拟）的所有配置，以确保 IML 为 IML 算法和技术的特定工作负载创建合适的工作单元。


  ### 审计、平衡与控制层


  #### 执行统计


  此部分存储 IML 流程的数据，并支持创建机器学习算法来预测 IML 何时会失败或需要何种工作负载。我将其称为“数据科学之上的数据科学”。


