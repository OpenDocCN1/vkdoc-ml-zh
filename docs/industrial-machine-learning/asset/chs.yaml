  y = data[''spots'']

  mn = int(y.min()) - 10

  mx = int(y.max()) + 10

  plt.plot(y, "k.")

  xlabelstr="自 " + str(xm) + " 以来的月份数"

  y_av = movingaverage(y, 10)

  plt.plot(y_av,"r")

  plt.xlim(mn,mx)

  plt.xlabel(xlabelstr)

  plt.ylabel("太阳黑子数量")

