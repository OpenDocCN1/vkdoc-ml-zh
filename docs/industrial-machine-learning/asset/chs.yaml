  ### 谱双聚类算法


  双聚类、块聚类、共聚类或双模式聚类是一种数据挖掘技术，它允许同时对矩阵的行和列进行聚类。


  数据使用 `make_checkerboard` 函数生成，然后进行打乱，并传递给谱双聚类算法。打乱后的矩阵的行和列会被重新排列，以显示算法找到的双聚类。


