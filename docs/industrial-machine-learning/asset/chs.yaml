  ### 图像分析


  对于人类医疗提供者来说，图像分析非常耗时，但机器学习算法分析 3D 扫描的速度可以比当前能力快一千倍。这种近乎实时的评估可以为正在手术的外科医生提供关键输入。带有机器学习的先进健康传感器将推动下一代放射学工具的发展，服务于医疗保健提供者和远程医疗机器人。患者可以使用他们的手机摄像头发送皮疹、割伤或瘀伤的照片，以立即确定需要何种护理才能进行有效治疗。


  IML 简化了复杂的医疗保健世界，IML 工具可以支持人类医疗提供者负责更快的服务、诊断问题以及分析数据以识别可能预示疾病的趋势或遗传信息。节省几分钟可能意味着挽救生命，机器学习不仅对医疗保健具有变革性，对每一个与
  IML 相连的患者也是如此。




  ### 农业


  地球人口的增长正逼近引发全球性饥荒的水平。全球人口预计将在 2030 年达到 85 亿，2050 年增至 97 亿，2100 年达到 112 亿（[`https://www.un.org/en/sections/issues-depth/population/`](https://www.un.org/en/sections/issues-depth/population/)）。由此导致的饥荒将是大范围的粮食短缺，其成因包括战争、通货膨胀、作物歉收、人口失衡或政府政策等多种因素。


  #### 土地测绘


  IML 利用农场的电子围栏来捕获数据，并通过农业中的特定传感器开发所需的投入要素。如今，借助能够检测土地质量并提升耕作质量的广域传感器，土地利用测绘已成为可能。


  电子围栏可以控制特定作物在哪些区域能够或不能生长。它能让农民了解其耕作土地所缺失的元素，从而通过补充必要的养分来支持特定作物的生长。它还能在农民之间分享关于问题和解决方案的知识，使耕作成为
  IML 与农民之间的协作。


  #### 活动日历


  IML 使农业机器人能够在一个农场学习如何提高产量以实现更好的耕作，然后将这些学习成果传递给所有机器人。现在，可以通过自适应学习为每种作物制定量身定制的耕作计划。


  #### 农民管理系统


  一个集成的农业平台通过将农民与买家和卖家直接连接起来，为农民赋能。这个闭环流程需要合适的传感器来输入需求和收获后的反馈。


  你为 IML 提供的输入越多，整体粮食生产的效果就越好。


  #### 集装箱农场


  在集装箱中垂直种植香草和蔬菜正成为农业领域的一个新兴趋势。


  通过借助 IML 流程改造 40 英尺长的集装箱，我们现在能够利用这样一个集装箱，每年产出相当于五英亩传统农田的作物；而且速度更快，用水量仅为传统农田的 1%。鱼菜共生系统结合了水产养殖（养殖鱼类和其他水生动物）和水培（无土栽培植物），并与
  IML 相结合，在提高未来生存所需作物的种植能力方面取得了普遍良好的产量。我曾见过集装箱在地下室里生产食物，而无需使用一杯传统土壤。这将改变人类未来的生存方式。


