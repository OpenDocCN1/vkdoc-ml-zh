  ### 预测


  TensorFlow 目前是机器学习生态系统中的主要工作主力。我预测这个库及其配套生态系统将在 2025 年成为领先系统。


  在开始运行接下来的示例之前，理解以下术语很重要：


  **Epoch（周期）**


  一个 epoch 是对给定数据样本的一次完整迭代。epoch 的数量是算法将要循环或迭代的次数。epoch 的数量直接影响训练步骤的结果。epoch 太少可能导致你的算法只达到局部最小值，但你使用的
  epoch 越多，当达到全局最小值或至少更好的局部最小值时，结果会更好。


  **Layers（层）**


  机器学习模型是通过组合和堆叠称为层的逻辑链来组装的。将具有精确功能目的的层分离出来，可以得到更简单、更可复用的层。


  TensorFlow 提供了一组预配置的、有用的通用层，为你的机器学习支持一个高效且有效的处理环境。


  你的模型将由这些层创建的多个有用操作层组成。


  **Estimators（估计器）**


  估计器是 TensorFlow 最具可扩展性和面向生产环境的模型类型，它使你能够使用预制的估计器，从而将你的处理工作提升到比基础 TensorFlow 支持更高的概念层面。这是
  TensorFlow 取得巨大成功的一个特性。


  **Checkpoints（检查点）**


  检查点是在训练期间创建的模型版本，并保存以备后用。这对于确定新模型相对于旧模型的成功程度非常有用。


