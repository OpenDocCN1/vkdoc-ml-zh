  跨行业数据挖掘标准流程 (CRISP-DM)


  ### CRISP-DM 中各角色的职责是什么？


  #### ![../images/466154_1_En_5_Chapter/466154_1_En_5_Figd_HTML.gif](img/466154_1_En_5_Figd_HTML.gif)
  数据科学家


  数据科学家帮助团队选择并实施最高效、最有效的算法和机器学习方法。数据科学家将数据转化为可操作的见解。


  #### ![../images/466154_1_En_5_Chapter/466154_1_En_5_Fige_HTML.gif](img/466154_1_En_5_Fige_HTML.gif)
  数据工程师


  数据工程师帮助团队提取、转换所需数据并将其加载到数据科学结构中，同时开发用于建模的数据特征。


  #### ![../images/466154_1_En_5_Chapter/466154_1_En_5_Figf_HTML.gif](img/466154_1_En_5_Figf_HTML.gif)
  DevOps


  DevOps 通过自动化、持续测试和集成，确保受控、管理有序地发布到生产环境，从而持续获得高效且有效的投资回报。


  ### CRISP-DM 循环


  参见图 5-15。


  ### 业务理解


  CRISP-DM 的第一个阶段要求你详细了解业务的需求。你很可能会收到关于业务真实需求的相互竞争或冲突的要求。如果这个阶段没有 100% 正确完成，你最终最多只能为错误的问题提供正确的答案。确保你收集了所有相关的功能性和非功能性需求，以全面了解业务的期望。


  #### 项目的预期产出是什么？


  此时需要检查的主要事项是确定业务需求的优先级，并将相关的预期产出进行聚类，以提高团队数据科学和数据工程能力的吞吐量。


  ### 注意


  我使用敏捷 Scrum 风格的项目管理方法，首先将所有期望的产出放入待办事项列表中。然后，我们作为一个团队，将待办事项列表处理成合乎逻辑的工作冲刺。


  在流程的这一点上，你的工作列表已经确定。


  ##### 设定目标


  在此阶段，你必须从业务角度找到主要目标。这个核心或主要目标是你必须始终回答的唯一答案。


  示例：如果你的主要目标是：“如何阻止高价值客户流失？”


  你所有的目标都必须支持这一个问题。


  次要目标可能是：


  *   谁是我的高价值客户？


  *   他们为什么离开？


  *   我该如何阻止他们？


  系统目标必须支持这些主要问题。


  *   需要哪些数据？


  *   数据是什么格式？


  ##### 制定项目计划


  机器学习解决方案需要与其他任何项目相同的项目计划。此时，应用你标准的项目管理规则。我通常使用敏捷项目流程，因为它对我的客户很有效。


  ##### 业务成功标准


  你必须确定业务认为项目成功的最低标准。


  我使用 SMART 标准：


  *   **具体性** – 精确说明你要实现的目标。例如，减少 1,000 名客户流失就是好的。


  *   **可衡量性** – 所需结果是否可以量化？你能确定状态是什么吗？


  *   **可实现性** – 目标是否可能实现？每月阻止 100,000 名客户流失不是一个合理的目标。


  *   **现实性** – 确保目标是可以实现的。


  *   **时限性** – 必须有一个达成目标的时间期限。


  #### 评估当前状况


  对当前业务状况的各个方面进行详细的事实调查。确保每个人都接受你的调查结果是起始基线。


  确保所有相关人员都理解这些标准。


  #### 确定数据目标


  确定机器学习过程的详细目标。始终与业务需求相关联。


  #### 业务成功标准


  描述项目的预期产出，这些产出有助于实现业务目标。


  **数据科学、数据工程和机器学习的成功标准**


  用技术术语定义项目成功结果的标准。为此，请解释你将如何衡量以及衡量哪些成功标准。


  #### 制定项目计划


  为所有数据处理目标制定一个预期计划，并说明这些目标如何帮助实现业务目标。你的计划应指定在项目剩余阶段要执行的步骤，包括初步选择机器学习工具和开发新技术。


  ### 数据理解


  CRISP-DM 流程的第二阶段是确定数据和元数据的真实状态。理解数据的来源（数据来自哪里？）和谱系（在你使用数据之前，对数据进行了哪些处理？）。


  #### 探索数据


  这包括你将使用的查询、数据可视化和报告。这些可能包括：


  关键属性的分布（例如，预测任务的目标属性）


  成对或少量属性之间的关系


  简单聚合的结果


  重要子群体的属性


  简单的统计分析


  这些分析必须有助于或完善数据描述和质量报告，并为进一步分析所需的转换和其他数据准备步骤提供输入。


  ##### 数据探索报告


  对所有数据子集执行结构化的数据探索和检查。


  #### 验证数据质量


  检查数据质量，解决诸如以下问题：


  *   数据是否完整（是否涵盖了所有必需的项目）？


  *   基础数据是否正确，还是包含错误？如果存在错误，错误有多普遍？


  *   数据中是否存在缺失值？如果存在，它们是如何表示的，出现在哪里，有多普遍？


  ##### 数据质量报告


  生成数据质量验证报告。通常，数据质量问题的解决方案在很大程度上取决于数据和业务知识。


  ### 数据准备


  #### 选择你的数据


  决定你将用于分析的数据。


  ##### 包含/排除的理由


  确定要包含或排除的数据，以及这些决定的详细信息。


  #### 清理你的数据


  通过清理数据质量，你将减少下游分析技术处理中的工作量，例如通过建模估算缺失数据。


  ##### 数据清理报告


  描述你为解决数据质量问题所做的决定和采取的行动。


  ##### 特征工程


  规划`特征工程`，以提取由一个或多个现有属性构建的新属性。




  ### 建模


  #### 选择建模技术


  作为建模的第一步，你需要选择将要使用的具体建模技术。尽管在业务理解阶段你可能已经选定了一个工具，但在此阶段，你需要确定具体的建模技术，例如，使用 C5.0 构建决策树，或使用反向传播生成神经网络。如果应用了多种技术，请为每种技术分别执行此任务。


  ##### 测试设计


  规划模型的训练、测试和评估。规划将样本数据集处理为训练集、测试集和验证集所需的操作。


  ##### 构建模型


  在准备好的数据集上运行模型，以创建一个或多个模型。


  ##### 参数设置


  任何模型都有可以调整的特定参数。列出这些参数及其选定的值，并说明选择这些参数设置的理由。


  ##### 模型


  这些是建模工具实际生成的模型。


  ##### 模型评估


  总结所生成模型的结果（例如，从准确率方面），并对其质量进行相互排序。


  ##### 修订参数设置


  在模型评估中规划改进，修订参数设置，并为下一次建模运行进行调整。迭代进行模型构建和评估，直到你确信已经找到了最佳模型。


  ### 评估


  #### 数据科学与机器学习结果评估


  根据业务成功标准总结评估结果，包括关于项目是否已达到初始业务目标的最终陈述。


  #### 获批模型


  在根据业务成功标准评估模型后，满足一系列标准的已生成模型将成为获批模型。


  #### 流程回顾


  总结流程回顾，并突出显示被遗漏以及应重复执行的活动。


  #### 确定后续步骤


  规划评估和流程回顾；现在你需要决定如何推进。


  ### 部署


  总结你的部署策略，包括必要的步骤以及如何执行这些步骤。


  #### 监控与维护计划


  总结监控与维护策略，包括必要的步骤以及如何执行这些步骤。


  #### 经验文档


  总结在项目过程中获得的重要经验。


  干得不错；你已经完成了 CRISP-DM 方法论的全部内容。


