  ### 高斯混合模型


  高斯混合模型是一种概率模型，它假设所有数据点都是由有限个具有未知参数的高斯分布混合生成的。可以将混合模型视为对 K-Means 聚类的泛化，它除了考虑潜在高斯分布的中心点外，还整合了数据的协方差结构信息。


  示例：


  打开名为 `Chapter-006-006-Gaussian-Mixture-01.ipynb` 的 Jupyter notebook。


  你将使用 Rose series 7 数据集来解释高斯模型。


  该解决方案遍历了四种不同的协方差参数：


  *   `‘full’` - 每个分量拥有自己的一般协方差矩阵。

  *   `‘tied’` - 所有分量共享同一个一般协方差矩阵。

  *   `‘diag’` - 每个分量拥有自己的对角协方差矩阵。

  *   `‘spherical’` - 每个分量拥有自己的单一方差。


