  #### 马修斯相关系数 (MCC)


  现在我将向你展示如何计算机器学习中的一个指标，称为“马修斯相关系数”（MCC）。


  MCC 是观察到的分类与预测分类之间的相关系数。


  ![$$ MCC=\frac{\left( TP. TN\right)-\left( FP. FN\right)}{\sqrt{\left( TP+ FP\right)\left(
  TP+ FN\right)\left( TN+ FP\right)\left( TN+ FN\right)}} $$](img/466154_1_En_3_Chapter_TeX_Equbd.png)


  示例：


  ![$$ MCC=\frac{\left( TP. TN\right)-\left( FP. FN\right)}{\sqrt{\left( TP+ FP\right)\left(
  TP+ FN\right)\left( TN+ FP\right)\left( TN+ FN\right)}} $$](img/466154_1_En_3_Chapter_TeX_Eqube.png)


  ![$$ =\frac{(7.85)-(5.3)}{\sqrt{\left(7+5\right)\left(7+3\right)\left(85+5\right)\left(85+3\right)}}
  $$](img/466154_1_En_3_Chapter_TeX_Equbf.png)


