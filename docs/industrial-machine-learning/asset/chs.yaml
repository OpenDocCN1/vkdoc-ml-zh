  是一个 SISO 模型，而 G3 是一个采样时间匹配的 MIMO 模型；因此，允许将 G1 与 G3 的每个元素相乘。对于 MIMO 模型的乘法，遵循矩阵乘法规则，因此使用矩阵乘法运算符
