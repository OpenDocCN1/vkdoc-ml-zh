  #### 处理工具


  处理工具是作为 RIF 中 IML 算法和技术的处理能力的通用接口的工具。相同的 IML 算法可以从一个处理引擎移植到另一个处理引擎，以确保未来的能力。


  ### 业务层


  该层包含业务需求（功能性和非功能性）。


  我还将在此层中存储我准备的所有子模型，以确保我对它们的开发拥有一套完整的业务和技术文档。


  该层中存储以下内容。


  #### 业务需求


  业务需求是交付后能提供价值的规范；它从系统最终用户的角度定义了拟议机器学习生态系统的特性。




  ### 警告


  请记住，你构建的算法是为了支持更大的业务目标。


  #### 太阳模型


  太阳模型是一系列技术图表，用于在数据科学家与其客户之间沟通数据科学需求。


  ##### 外伸维度


  外伸维度（图 13-18）通过将一个较小的维度直接通过外键附加到主公共维度上，从而扩展公共数据特征。


  示例：所有日期，如出生日期、离校日期、毕业日期等，现在都可以通过公共特征进行扩展，这些特征有助于机器学习找到共同的相关性。


  ![../images/466154_1_En_13_Chapter/466154_1_En_13_Fig18_HTML.jpg](img/466154_1_En_13_Fig18_HTML.jpg)


  图 13-18


  外伸维度


  ##### 微维度


  微维度通过将一组新的数据维度特征链接到该维度的主键上，从而引入这些特征。


  微维度用于通过机器学习实现分类、聚类或预测，从而支持数据科学。参见图 13-19。


  ![../images/466154_1_En_13_Chapter/466154_1_En_13_Fig19_HTML.png](img/466154_1_En_13_Fig19_HTML.png)


