  ## 状态特征创建


  下一步是识别模型中的特征。


  我建议你为你的模型拍一张照片，然后为每一个独特的特征打上标签。


  以下是已标记的车辆模型（图 9-16）。


  ![../images/466154_1_En_9_Chapter/466154_1_En_9_Fig16_HTML.jpg](img/466154_1_En_9_Fig16_HTML.jpg)


  图 9-16


  车辆模型


  现在，我将引导你了解我所识别的特征。


  ***特征 1：***


  *   变道特征是一个二元传感器，因为该传感器只报告 0 或 1 的值。


  ***特征 2：***


  *   盲点传感器特征是一个二元传感器，其值也为 0 或 1。


  ***特征 3：***


  *   泊车传感器特征是一个五级传感器，其值在 0.0 到 1.0 之间。

  *   它在车辆内部通过一组 LED 灯进行报告，显示你与后方物体的相对距离。

  *   第二个输出是，当权重正确时，1.0 对应五米距离，误差为正负十分之一米。


  ***特征 4：***


  *   碰撞传感器特征是一个十级传感器，其值也在 0.0 到 1.0 之间。

  *   第二个输出是，当权重校正正确时，1.0 对应十五米距离，误差为正负四分之一米。


  ***特征 5：***


  *   车道检测器特征是一个四级传感器，其值也在 0.0 到 1.0 之间。

  *   第二个输出是，当权重正确时，1.0 对应十五米距离，误差为正负四分之一米。


  ***特征 6：***


  *   交通检测器特征是一个五级传感器，其值也在 0.0 到 1.0 之间。

  *   第二个输出是，当权重正确时，1.0 对应十五米距离，误差为正负四分之一米。


  ***特征 7：***


  *   巡航传感器特征是一个五级传感器，其值在 -1.0 到 1.0 之间。

  *   如果巡航控制系统检测到值 < 0.0，传感器报告 0.0，并开始降低车辆速度以使其回到 0.0；如果值 > 0.0，速度将增加，直到达到正确速度。


  现在你有了七个特征，因此有七个维度来提供关于模型整体状态的信息。


  ## 奖励函数


  奖励是一个七阶段奖励公式。七个特征分别返回奖励。你可以在此处使用七乘七相关算法来检查传感器之间是否存在显著相关性。


  ### 警告


  在现实世界中，这个过程已经进行了多年，使用了数百万小时的驾驶训练数据，但仍然会出现异常值。


  预测是，一个能够突然解决未知输入导致意外结果问题的算法，将立即对大多数强化学习系统的能力造成重大颠覆。


  ## 动作生成


  所应用的动作范围从警告灯到主动改变车辆速度，甚至施加制动。车道检测甚至可以将车辆带回道路。


  ### 警告


  不止一个可能的动作可能导致相同的结果，或者导致环境完全失败的灾难性负奖励。


  我建议将你的动作保持为小的增量步骤，而不是大的激进改变。


  ## 最终模型


  我希望你现在明白，一些现实世界项目的模型可能会迅速演变成数百甚至数千个特征、状态和动作。


  ### 建议


  我至少创建三个具有不同基础特征的模型，然后检查建议动作中的相关性，以验证整个系统的动作。这样，你就不容易达到灾难性的失败状态。


  ## 逆向强化学习


  逆向强化学习（IRL）是从观察到的行为中推导出奖励函数的过程。普通的“强化学习”涉及使用奖励和惩罚来学习行为，而在 IRL 中，方向是相反的。


  这种建模过程允许系统尝试任何新动作，然后计算一个二元结果来决定是否重复该建议动作。


  这是一个在处理大量可能动作列表时使用的简单模型。


  例如，为了防止车辆驶离道路，汽车可以施加制动或转动方向盘。在 IRL 中，车辆会分别尝试每个单独选项以及它们的组合，以了解单个动作或动作组合的结果。所有动作的总和，即行为，会得到奖励。


  这减少了奖励测量的数量。在大型现实项目中效果很好。


  IRL 也用于进化计算中，以开发能够自动发现环境建模的动作和奖励。这将在第 10 章中详细讨论。


  ## 深度强化学习


  深度学习是机器学习领域内一条新的研究路径。深度学习背后的核心知识是创建由多层表示组成的架构，以学习高级抽象。深度学习的基础在于，模型能够处理复杂的特征集，因为它将复杂的特征交互作为一系列较小的交互来处理，并返回一个净结果。


  一个典型的深度学习人工神经网络使用 IRL 模型，通过反向传播来确定哪些动作取得了最大效果。反向传播是人工神经网络中使用的一种方法，用于计算网络中权重计算所需的梯度。反向传播是“误差的反向传播”的简称，因为误差在输出端计算，并向后分布到网络的各层。它通常用于训练深度神经网络。


  这种通过深度神经网络学习实现的训练，开创性地将多种方法与深度强化学习相结合，从而产生了第一批在多个具有挑战性的领域达到人类水平性能的人工智能体。


  你现在可以创建能够通过选择好动作而非坏动作来持续进行价值判断的智能体。这种知识由一个 Q 网络表示，该网络估计智能体在采取特定动作后可以期望获得的总奖励。


  随着越来越多的现实世界问题被这些由数万个输入特征、数千个隐藏层以及输出端仅有一个或少数几个系统行为组成的庞大深度学习模型所解决，该领域正在加速发展。


  这是一个在未来几年将带来许多伟大成果的领域。


  ## 多智能体强化学习


  多智能体强化学习是指一个系统的观察结果被传递给另一个系统模型，以增强其状态和奖励收集的概念。例如，可以部署两个车辆相互通信，告知对方它们将要采取某个动作。另一种选择是，环境默认从其各自的角度将状态传递给个体。一个例子是，道路上的压力激活部件通过激活另一个智能体可以检测到的信号，来防止车辆驶离道路。


  例如，在一个智慧城市中，“车辆的巡航控制系统与城市的交通系统交互，以确保城市内更顺畅的交通流。或者，重型货物车辆会被引导绕行，避开那些对于其负载来说太低的桥梁。多智能体世界是物联网（IoT）的核心世界。物联网革命将把数十亿个智能体连接成一个由传感器和状态记录器组成的单一集群。


  在未来五年内，多智能体环境将成为系统的常态。


  你的机器学习将需要能够处理这些工业化规模的物联网系统，结合我在第 6 章和第 7 章中讨论的新机器人能力，这将在未来十年内从物理上改变世界。




