  tn, fp, fn, tp = confusion_matrix(y_true, y_pred).ravel()

  tpr = tp / (tp+fn)

  print(''True positive rate:'', tpr)

  tnr = tn / (tn+fp)

  print(''True negative rate :'', tnr)

  bm=tpr+tnr-1

  print(''Bookmaker Informedness:'', bm)

