  #### 朴素贝叶斯


  朴素贝叶斯分类器基于贝叶斯定理，并假设预测变量之间相互独立。


  ##### 高斯朴素贝叶斯


  GaussianNB 实现了用于分类的高斯朴素贝叶斯算法。它假设特征的可能性服从高斯分布：


  ![$$ P\left({x}_i|y\right)=\frac{1}{\sqrt{2{\pi \sigma}_y²}}\exp \left(-\frac{{\left({x}_i-{\mu}_y\right)}²}{2{\sigma}_y²}\right)
  $$](img/466154_1_En_4_Chapter_TeX_Equa.png)


  参数 *σ*[*y*] 和 *μ*[*y*] 通过最大似然估计得出。


  在您的 Jupyter 软件中打开示例 Jupyter Notebook：Chapter 004 Example 007.ipynb。


