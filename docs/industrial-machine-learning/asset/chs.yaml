  ### 地球与火星时差


  你必须明白，在旅途中，两个行星的日计数时间差会逐渐拉大，因此你需要追踪这个差异：


  我建议你添加一个名为“地球与火星时差”的特征，来追踪由于两颗行星日长不同而产生的时间偏移。


  ```

  def findgap(et,mt):

  gaptime = et-mt

  return gaptime

  dateDF[''EarthMarsGap''] = dateDF.apply(lambda row:findgap(row[''EarthTime''],row[''MarsTime'']),
  axis=1)

  ```


