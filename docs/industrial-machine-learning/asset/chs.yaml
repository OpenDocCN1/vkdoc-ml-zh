  ### 高斯过程回归


  在概率论和统计学中，高斯过程是一种随机过程，其任意有限个随机变量的集合都服从多元正态分布，也就是说，任意有限个值的线性组合都服从正态分布。高斯过程的分布是随机变量的联合分布，也是连续域（例如时间或空间）内函数的分布。


  涉及高斯过程的机器学习算法使用惰性学习和点之间的相似性度量（核函数），根据训练数据预测未见点的值。


  示例：


  在你的 Jupyter 软件中打开示例 Jupyter Notebook：Chapter 005 Example 007.ipynb。


  我使用了 `sklearn.gaussian_process.GaussianProcessRegressor` 引擎。


  我使用这个机器学习过程也是为了演示，向函数 y = 1.968 ∗ (x ∗ np.cos(x)) 的观测值中添加噪声如何提高正确预测值的概率。


  对于 A 部分，你只需直接使用观测值，即无噪声。


  ```

  gp = GaussianProcessRegressor(kernel=kernel,

  optimizer=''fmin_l_bfgs_b'',

  alpha=1e-10,

  n_restarts_optimizer=10,

  random_state=0)

  ```


  在 B 部分，你通过 Tikhonov 正则化将噪声添加到 `GaussianProcessRegressor` 引擎的 alpha 超参数中：


  ```

  y = f(X).ravel(); dy = 0.5 + 1.0 * np.random.random(y.shape);

  noise = np.random.normal(0, dy); y += noise

  gp = GaussianProcessRegressor(kernel=kernel,

  optimizer=''fmin_l_bfgs_b'',

  alpha=dy ** 2,

  n_restarts_optimizer=10,

  random_state=0)

  ```


