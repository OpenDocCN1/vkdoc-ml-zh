  ## 动态规划


  动态规划 (DP) 既是一种数学优化方法，也是一种计算机编程方法。


  DP 通过将“复杂问题”分解为子集，然后解决已发现的子问题，同时利用已发现的信息来解决更困难的原始复杂问题。


  您只需将问题分解为更小的可解问题，并整合结果来解决更大的问题。使用 DP，您通常将结果存储在表中以跟踪进度。


  DP 是一种强大的技术，它允许您在 O(n²) 或 O(n³) 时间内解决不同类型的问题，而朴素方法则需要指数时间。


