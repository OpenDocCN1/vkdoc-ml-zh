  必须遵守以下规则：


  *   每次只能移动一个圆盘。

  *   每次移动只能移动某根柱子最顶端的圆盘。

  *   该圆盘可以放在另一根柱子上，前提是该柱子为空，或者该柱子最顶端的圆盘比要移动的圆盘大。


