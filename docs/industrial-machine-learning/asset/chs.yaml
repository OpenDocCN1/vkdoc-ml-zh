  ### 聚类 K-Means


  #### Voronoi 单元


  K-means 聚类是一种向量量化方法，最初来自信号处理，在数据挖掘的聚类分析中很流行。K-means 聚类旨在将 n 个观测值划分为 k 个聚类，其中每个观测值属于具有最近均值的聚类，该均值作为该聚类的原型。这导致数据空间被划分为
  Voronoi 单元。


  打开名为 `Chapter-006-002-Clustering-K-Means-01-02.ipynb` 的 Jupyter notebook。


