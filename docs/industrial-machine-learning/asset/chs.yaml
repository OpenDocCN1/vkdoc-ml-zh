  ##### 多项式朴素贝叶斯


  MultinomialNB 实现了用于多项分布数据的朴素贝叶斯算法，它是文本分类中使用的两种经典朴素贝叶斯变体之一（其中数据通常表示为词向量计数，尽管在实践中
  tf-idf 向量也被认为效果良好）。


  该分布由每个类别 *y* 的向量 *θ*[*y*] = (*θ*[*y*1], …, *θ*[*yn*]) 参数化，其中 *n* 是特征数量（在文本分类中，即词汇表大小），而
  *θ*[*yi*] 是特征 *i* 出现在属于类别 *y* 的样本中的概率 *P*(*x*[*i*]| *y*)。


  参数 *θ*[*y*] 通过最大似然估计的平滑版本（即相对频率计数）来估计：


  ![$$ {\hat{\theta}}_{yi}=\frac{N_{yi}+\alpha }{N_y+\alpha n} $$](img/466154_1_En_4_Chapter_TeX_Equb.png)


  其中 *N*[*yi*] = ∑[*x* ∈ *T*]*x*[*i*] 是特征 *i* 在训练集 *T* 中类别 *y* 的样本中出现的次数，而 ![$$ {N}_y={\sum}_{i=1}^{\mid
  T\mid }{N}_{yi} $$](img/466154_1_En_4_Chapter_TeX_IEq1.png) 是类别 *y* 所有特征的总计数。


  平滑先验 *α* ≥ 0 用于处理学习样本中未出现的特征，并防止在后续计算中出现零概率。设置 *α* = 1 称为拉普拉斯平滑，而 *α* < 1 称为利德斯通平滑。


