  ### 硬机器人的解剖结构


  每个机器人的解剖结构都是独一无二的，这为每个机器人创造了一个独特的环境。深入了解每个机器人的能力至关重要。


  软机器人的改动通常非常容易，因为它们可以在较短的开发周期内进行更改和重新部署。


  然而，硬机器人存在局限性，因为所使用的物理机器人或机器人组不易改变其形状或性能特征。见图 12-11。


