  ### 贝叶斯统计


  贝叶斯统计是统计学领域中的一种理论，基于概率的贝叶斯解释，其中概率表达了对某个事件的相信程度，这种程度会随着新信息的收集而改变，而不是基于频率或倾向性的固定值。


  #### 伯努利试验


  伯努利试验是一种只有两种结果的随机实验，通常标记为“成功”或“失败”，其中每次试验成功的概率完全相同。成功的概率由 θ 表示，θ 是介于 0 和 1 之间的一个数。因此
  θ∈[0,1]。


