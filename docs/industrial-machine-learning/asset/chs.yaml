  #### 平衡


  本节主动平衡 IML 系统资源，以确保在分配的资源内最有效、最高效地完成 IML 处理。当你的云提供商按使用量收费时，这一节在 IML 中变得越来越重要，因为很容易上线那些在云上执行时效率不高的资源。


  #### 控制


  本节是 IML 进程的主动控制器，因为现代 IML 系统高度超订，而控制器通过完全控制整个进程，使你能够用有限的资源处理所有 IML 进程。


  #### 拒绝与错误处理


  本节处理 IML 进程产生的任何拒绝和错误。本节中的进程应能从系统中的任何拒绝和错误中恢复。


  ### 工具层


  这些是支持其他层的通用组件。


  #### 维护工具


  维护工具旨在执行特定的维护任务。这些工具通常由 AI 进程驱动，该进程将使用机器学习来激活这些工具。




