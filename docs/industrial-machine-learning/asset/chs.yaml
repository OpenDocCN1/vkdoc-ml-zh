  和 David Kjerrumgaard（Apress，2016 年）。


  *   *《实用数据科学：构建技术栈将数据湖转化为业务资产指南》*，作者：Andreas François Vermeulen（Apress，2018 年）。


  我现在将更详细地介绍这些概念。


  #### 数据剖析


  数据剖析是对当前信息源中可访问的数据进行探索性调查的过程，并通过一系列数据科学流程收集统计数据或揭示关于这些数据的摘要信息。


  ### 提示


  数据剖析是核心流程，它将为你提供关于数据的真实信息。


  数据剖析还将揭示数据中的洞察，这些洞察可以确定特定类别的机器学习算法是否适合解决数据科学家提交给它的数据。


  #### 数据可追溯性


  可追溯性，在处理链可追溯性中，是指识别、跟踪和追溯数据流程元素的能力，这些元素沿着处理链从原始数据移动到完整的数据科学洞察。


  此过程会生成两份重要报告。


  ##### 数据来源


  这精确地说明了数据的来源，并向使用你结果的业务人员阐明了原始来源的有效性。


  示例：提取自 2019-01-10 06:00 的伦敦 CRM – 意味着不包含来自纽约的数据，也不包含伦敦 06:00 之后的数据。


  ### 警告


  缺乏数据来源可能会因缺乏信任而使出色的机器学习结果变得毫无用处。


  ##### 数据沿袭


  数据沿袭指的是数据随时间推移所经历的来源和转换。基本上，数据沿袭讲述了特定数据片段的故事。这使您能够了解数据的来源，以及它在何时何地与其他数据分离和合并。


  ### 提示


  请记住包含机器学习洞察的来源和沿袭信息，这将为你的结果奠定信任基础。


  至此，五个系统层介绍完毕。我将在第 15 章中解释如何在实际解决方案中使用它们。


  现在，我将向你介绍用于存储数据以持久化你的 IML 数据工程和数据科学的数据湖。


  ## 六个数据湖区域


  共有六个数据湖区域（图 13-21）。


  ![../images/466154_1_En_13_Chapter/466154_1_En_13_Fig21_HTML.jpg](img/466154_1_En_13_Fig21_HTML.jpg)


  图 13-21


  数据湖区域


  ### 工作区


  ![../images/466154_1_En_13_Chapter/466154_1_En_13_Figs_HTML.jpg](img/466154_1_En_13_Figs_HTML.jpg)


  工作区是数据湖中的一个临时区域，IML 流程在处理数据以生成洞察的过程中，可以在此短期存储结果。


  ### 警告


  此区域中的数据应始终被视为不正确、不完整和不准确的，除非你在当前运行的 IML 生态系统批次中自己创建了这些数据。


  ### 提示


  始终在工作区中每个批次运行前后执行清理操作，以确保数据湖高效且有效。


  我有一个个人应用的比例：如果工作区超过数据湖的 10%，则说明你没有正确使用它。如果我发现超出此配额，我将开始调查为何使用了如此多的临时空间。


  ### 原始区域


  ![../images/466154_1_En_13_Chapter/466154_1_En_13_Figt_HTML.jpg](img/466154_1_En_13_Figt_HTML.jpg)


  原始区域是所有数据湖外部数据的入口点。原始区域是多个数据提取处理解决方案的终点。


  此区域中数据的唯一要求是每个数据集都有其唯一的标识符。数据集本身的内容与该区域无关。


  此区域中的所有数据都是读取时定义模式。


  可选的额外功能如下：


  *   每个数据集都包含一个唯一可识别的源系统 ID。


  *   每个数据集的完整元数据描述。


  *   对该区域活动的完整审计。


  数据集可以通过以下任何途径到达：


  *   批量上传 – 这是进入数据湖最常见的途径。


  *   通过消息系统（如 Apache Kafka ([`http://kafka.apache.org/`](http://kafka.apache.org/)
  )、Apache NIFI ([`https://nifi.apache.org/`](https://nifi.apache.org/)) 或 Apache
  Flink ([`https://flink.apache.org/`](https://flink.apache.org/))）进行流式传输。


  *   通过物联网流程。


  ### 注意


  原始区域应始终独立于其他数据工程工作，即，它绝不应持有或阻塞数据的处理。


  ### 警告


  在执行 IML 处理时，切勿从原始区域删除数据。请使用单独的独立清理策略。


  请记住，特定类型的数据可能只有有限的有效生命周期。示例：如果一张安全卡允许某人进入特定房间，并且该操作被记录为该人现在在该房间内。那么逻辑上可以接受的是，如果一周后此人仍在房间内，则数据存在错误。




  ### 结构化区域


  ![../images/466154_1_En_13_Chapter/466154_1_En_13_Figu_HTML.jpg](img/466154_1_En_13_Figu_HTML.jpg)


  结构化区域用于将原始数据转换为增强型数据源。该区域的数据采用统一格式，以辅助下一区域的处理能力。所有数据质量问题都在此区域解决。


  结构化区域是经过处理的原始数据的存储空间，处理方式是通过识别与所处理数据集相关的元数据。此时，这些数据在每个数据集级别上都携带一个唯一 ID，以及详细的数据类型和字段名称。


  结构化区域中数据集的格式通常是一种，或尽可能少的几种格式。


  其设计理念是将整个结构化区域的数据简化为一种通用格式。


  ### 提示


  像 HDF5（[`https://www.hdfgroup.org/`](https://www.hdfgroup.org/)）这样的数据格式在此环境中表现良好，因为它可以同时存储数据和元数据。


  #### HDF5


  HDF5 是一种用于存储和管理数据的数据模型、库和文件格式。它支持无限多种数据类型，专为灵活高效的 I/O 以及处理海量复杂数据而设计。HDF5 具有可移植性和可扩展性，允许应用程序在使用中不断演进。参见图
  13-22。


  ![../images/466154_1_En_13_Chapter/466154_1_En_13_Fig22_HTML.jpg](img/466154_1_En_13_Fig22_HTML.jpg)


  图 13-22


  HDF5 生态系统


  你需要从示例目录 Chapter 013 加载以下 Jupyter Notebook：打开 Chapter 013/000-RIF/100-Functional-Layer/100-Retrieve/08-03-Retrieve-04-Location-HDF5-01.ipynb


  你可以看到简单的 Python 命令：


  ```

  locationDF.to_hdf(fullRealName1, format="fixed", key="location", index=False, encoding=''utf-8'')

  ```


  这为系统启用了 HDF5 格式。


  #### Parquet


  Apache Parquet 是一种列式存储格式，可供 Hadoop 生态系统中的任何项目使用。


  `(`[`https://parquet.apache.org/`](https://parquet.apache.org/)`)`


  你研究这种格式的主要原因是它在 Hadoop 生态系统中被广泛使用。


  使用它将确保将来你可以从本地环境迁移到云生态系统，而无需更改格式。


  你可能需要一个额外的库来启用 Parquet 引擎。我通常使用 pyarrow，因为它是云生态系统中最常用的引擎。


  ```

  conda install -c conda-forge pyarrow

  ```


  我将指导你了解 Parquet 的两种选项。


  你需要从示例目录 Chapter 013 加载以下 Jupyter Notebook：


  打开 Chapter 013/000-RIF/100-Functional-Layer/100-Retrieve/08-03-Assess-04-Location-Parquet-01.ipynb


  你可以看到简单的 Python 命令：


  ```

  locationDF.to_parquet(fullRealName1, engine="auto", compression="snappy")

  ```


  以及


  ```

  locationDF.to_parquet(fullRealName2, engine="auto", compression="gzip")

  ```


  这为系统启用了 Parquet 格式。


  ### 警告


  Snappy 压缩的文件大小是 GZip 压缩文件大小的 1.496 倍。因此，如果可能，请使用 GZip。这种文件大小的缩减将使你能够在需要更多磁盘之前，在数据湖中存储更多数据。


  我对结构化区域的介绍到此结束，后续内容将在第 15 章继续。


  ### 策展区域


  ![../images/466154_1_En_13_Chapter/466154_1_En_13_Figv_HTML.jpg](img/466154_1_En_13_Figv_HTML.jpg)


  策展区域是整个数据湖中当前的“***唯一事实来源***”。该区域中的数据仓库和数据仓库实现了来自结构化区域的数据源的整合与合并。“实时”数据科学模型的结果存储在此区域。


  ### 消费区域


  ![../images/466154_1_En_13_Chapter/466154_1_En_13_Figw_HTML.jpg](img/466154_1_En_13_Figw_HTML.jpg)


  消费区域是存储用于业务洞察的不同数据集市的地方，供最终用户可视化其业务洞察。


  这是大多数业务人员提问的主要区域。


  ### 分析区域


  ![../images/466154_1_En_13_Chapter/466154_1_En_13_Figx_HTML.jpg](img/466154_1_En_13_Figx_HTML.jpg)


  分析区域是数据湖的“沙盒”。此区域用于设计、开发和训练新的创新数据科学和机器学习解决方案，之后 DevOps 会将新版本的 IML 移交给策展区域。


  ### 提示


  按照计划的和按需的更新周期，将策展区域设置为分析区域，因为你不希望在创新性 IML 工作进行到一半时发生意外更新。我通常在每个为期 10 天的冲刺周期的第二个周期开始时执行一次更新，且该周期不与月末在同一周，因为这样我的团队有一个月的时间来完成工作，并且不会在繁忙的月末冲刺期间因更新而感到压力。


  这是 IML 使用的最后一个数据湖区域。


  ### Delta Lake


  我将简要讨论一个已发布为开源的新创新处理引擎。


  Delta Lake 是一个开源存储层，为 Apache Spark™ 和大数据工作负载带来了 ACID 事务。（参见 [`https://delta.io/`](https://delta.io/)）


  提醒一下，ACID（原子性、一致性、隔离性和持久性）是数据湖事务的一组属性，旨在即使在处理过程中发生错误或失败时也能保证有效性。


  这对于将数据湖用作 IML 生态系统的核心数据存储来说是一个重大推动。


  ### 提示


  我将使用标准文件目录讨论接下来的概念，但我也会引用如何使用 Delta Lake 执行相同操作。


  你需要：


  *   pip install --upgrade pyspark 然后 pyspark --packages io.delta:delta-core_2.12:0.1.0


  *   打开 Chapter 013/000-RIF/100-Functional-Layer/100-Retrieve/08-03-Assess-04-Location-Parquet-01.ipynb


