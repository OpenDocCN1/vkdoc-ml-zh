  ### 循环神经网络（RNN）


  循环神经网络（RNN）是一类人工神经网络，其节点之间的连接沿序列形成有向图。这使得它能够针对时间序列展现出时间动态行为。与前馈神经网络不同，RNN 可以利用其内部状态来处理输入序列。这赋予了它们记忆先前行为以及如何根据这些知识进行调整的能力。


  这使得它们适用于诸如非分割的连续手写识别或语音识别等任务。


