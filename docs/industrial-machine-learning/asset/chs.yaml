  ##### 伯努利朴素贝叶斯


  `BernoulliNB` 将朴素贝叶斯训练和分类算法应用于服从多元伯努利分布的数据；也就是说，可能存在多个特征，但每个特征都被假定为二元值（伯努利，布尔）变量。该类要求样本被表征为二元值特征向量；如果提供了任何其他类型的数据，`BernoulliNB`
  实例可能会对其输入进行二值化处理（取决于 `binarize` 参数）。


  伯努利朴素贝叶斯的决策规则基于：


  ![$$ P\left({x}_i|y\right)=P\left(i|y\right){x}_i+\left(1-P\left(i|y\right)\right)\left(1-{x}_i\right)
  $$](img/466154_1_En_4_Chapter_TeX_Equc.png)


  这与多项朴素贝叶斯的规则不同，因为它明确惩罚了作为类别 *y* 指示符的特征 *i* 的未出现情况，而多项变体则会简单地忽略未出现的特征。在文本分类的情况下，可以使用词出现向量（而非词频向量）来训练和使用此分类器。


  `BernoulliNB` 在某些数据集上可能表现更好，尤其是那些包含较短文档的数据集。如果时间允许，建议对两种模型都进行评估。


