  ##### Alpha 数据集


  加载中心点位置数据。


  ```

  locationHubName1 = os.path.join(pathDL,''300-Curated-Zone'', ''Hub'', ''Location'',
  ''Hub-Location.csv.gz'')

  location1DF=pd.read_csv(locationHubName1, header=0, encoding=''utf-8'', compression="gzip")

  location1DF.index.name = ''ID''

