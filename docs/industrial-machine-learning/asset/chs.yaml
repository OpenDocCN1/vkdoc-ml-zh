  结果：


  结果用于调查议员是否会选择合作组建联盟（C）还是背叛（D）。当政党在选举中未能获得明确多数席位时，这种测试很常见。


  假设 A 党的收益如下：


  *   当 B 合作且 A 合作时，A 获得 3 个单位的政治收益

  *   当 B 合作且 A 背叛时，A 获得 5 个单位的政治收益

  *   当 B 背叛且 A 合作时，A 获得 0 个单位的政治收益

  *   当 B 背叛且 A 背叛时，A 获得 1 个单位的政治收益


