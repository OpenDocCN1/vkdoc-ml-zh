  ### 处理不平衡数据集


  不平衡的类别让“准确率”失去了意义。这是机器学习（尤其是分类任务）中一个非常常见的问题，通常出现在各类别观测值比例悬殊的数据集中。


  标准的准确率不再能可靠地衡量模型性能，这使得模型训练变得更加棘手。


  我将通过展示如何预处理数据集以修复数据结构中的不平衡问题，来教你如何处理这些不准确的数据集。


  在我们的第一个示例中，我们将解释这些目标变量如何包含三个类别。


