  ## 提升（元算法）


  机器学习术语“提升”指的是一系列将弱学习器转化为强学习器的算法。当特征无法为算法产生足够强的学习器时，这些算法就非常有用。提升算法使用一组低准确率的分类器来创建一个高准确率的分类器。


  其基本概念（图 5-1）是将机器学习链接成一个处理链，以获得改进的结果。


