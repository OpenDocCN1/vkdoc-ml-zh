  ##### 线性判别分析投影


  LDA 使用具有线性决策边界的分类器和贝叶斯规则。


  ```

  X_lda = discriminant_analysis.LinearDiscriminantAnalysis(n_components=2).fit_transform(X2,
  y)

  ```


  （参见结果：表 4-1。）


  我们只是将之前用于图形的同一个机器学习求解器应用到了图像上；这正是这些机器学习求解器的强大之处。


  ##### 等距映射嵌入


  等距映射嵌入通过对数据集进行等距映射，使用非线性降维方法。


  ```

  X_iso = manifold.Isomap(n_neighbors, n_components=2).fit_transform(X)

  ```


  （参见结果：表 4-1。）


  ##### 局部线性嵌入（LLE）


  局部线性嵌入（LLE）寻求数据的低维投影，同时保留局部邻域内的距离。


  ###### LLE 嵌入


  ```

  clf = manifold.LocallyLinearEmbedding(n_neighbors, n_components=2, method="standard",
  eigen_solver="auto")

  ```


  （参见结果：表 4-1。）


  ###### 修正 LLE 嵌入


  LLE 的一个公认问题是正则化问题。当邻居数量大于输入维度时，定义每个局部邻域的矩阵会出现秩亏。修正 LLE 成功解决了这个问题。


  ```

  clf = manifold.LocallyLinearEmbedding(n_neighbors, n_components=2, method="modified",
  eigen_solver="auto")

  ```


  （参见结果：表 4-1。）


  ###### Hessian LLE 嵌入


  Hessian 特征映射是解决 LLE 相同正则化问题的另一种方法。


  ```

  clf = manifold.LocallyLinearEmbedding(n_neighbors, n_components=2, method="hessian",
  eigen_solver="dense")

  ```


  （参见结果：表 4-1。）


  ###### 局部切空间对齐（LTSA）嵌入


  局部切空间对齐（LTSA）在算法上与 LLE 类似，但 LTSA 并非像 LLE 那样专注于保留邻域距离，而是通过其切空间来刻画每个邻域的局部几何结构，并执行全局优化以对齐这些局部切空间，从而学习嵌入。


  ```

  clf = manifold.LocallyLinearEmbedding(n_neighbors, n_components=2, method="ltsa",
  eigen_solver="dense")

  ```


  （参见结果：表 4-1。）


  ###### 多维缩放（MDS）嵌入


  多维缩放（MDS）寻求数据的低维表示，其中距离间接映射到呈现给模型的原始高维空间中的距离。


  ```

  clf = manifold.MDS(n_components=2, n_init=1, max_iter=100)

  ```


  （参见结果：表 4-1。）


  这是 LLE 风格嵌入模型中的最后一个。


  ##### 完全随机树嵌入


  完全随机树的集成是一种将数据集无监督转换为高维稀疏表示的方法。


  ```

  hasher = ensemble.RandomTreesEmbedding(n_estimators=200, random_state=0, max_depth=5)

  pca = decomposition.TruncatedSVD(n_components=2)

  ```


  （参见结果：表 4-1。）


  ##### 谱嵌入


  用于非线性降维的谱嵌入会创建一个由指定函数定义的亲和矩阵，并使用拉普拉斯特征映射将谱分解与相应的图关联起来。最终的转换由每个数据点的特征向量值决定。


  ```

  embedder = manifold.SpectralEmbedding(n_components=2, random_state=0, eigen_solver="arpack")

  ```


  （参见结果：表 4-1。）


  ##### t-分布随机邻域嵌入（t-SNE）


  t-SNE 是一种用于可视化高维数据的实现方法。它将数据点之间的相似性转化为联合概率，并试图最小化低维嵌入与高维数据联合概率之间的 Kullback-Leibler
  散度。


  ```

  tsne = manifold.TSNE(n_components=2, init="pca", random_state=0)

  ```


  （参见结果：表 4-1。）




