  “汉诺塔”游戏使用三根柱子。若干圆盘按从下到上递减的顺序叠放在一根柱子上，即最大的圆盘在底部，最小的在顶部，这些圆盘构成一个锥形塔。游戏的目标是将整座圆盘塔从一根柱子移动到另一根柱子上。见图
  9-3。


