  #### 神经网络


  神经网络是一个相互连接的节点群，类似于人脑中庞大的神经元网络。在人工神经网络中，每个节点代表一个人工神经元，箭头则表示从一个人工神经元的输出到另一个神经元输入的连接。


  神经网络能够模拟人类的决策过程。目前，网络的能力大多只是决策过程的简化版本。当前，神经网络经过训练，可以对现实世界的决策处理进行一种狭窄的投影。


  例如，神经网络可以被训练来识别不同的图片，然后用于识别闭路电视监控画面中相似的图像。


  我将使用以下决策过程：假设大楼入口处有两扇门；安全状态的规则是：只要有一扇门打开即可。因此，如果两扇门都关闭，则无法进入；或者如果两扇门都打开，则表明出现错误，需要派遣保安。


  在你的 Jupyter 软件中打开示例 Jupyter Notebook：Chapter 004 Example 023A.ipynb。


