  ## 使用数据湖的 R-A-P-T-O-R 数据科学流程


  ### 什么是 R-A-P-T-O-R？


  它代表检索-评估-处理-转换-组织-报告。参见图 5-16。


  ![../images/466154_1_En_5_Chapter/466154_1_En_5_Fig16_HTML.jpg](img/466154_1_En_5_Fig16_HTML.jpg)


  图 5-16


  R-A-P-T-O-R 引擎


  快速信息工厂的 R-A-P-T-O-R 引擎引导数据从数据湖出发，依次经过数据管道阶段：检索（导入外部数据源）、评估（数据质量）、处理（合并）、转换（单一事实版本）、组织（特征工程）和报告（业务洞察）。


  R-A-P-T-O-R 引擎（图 5-16）在数据于数据湖的不同区域之间分布时对其进行转换。


  ![../images/466154_1_En_5_Chapter/466154_1_En_5_Figg_HTML.jpg](img/466154_1_En_5_Figg_HTML.jpg)


  将数据从源系统检索到数据工程环境中。这是源系统中的原始数据。


  ![../images/466154_1_En_5_Chapter/466154_1_En_5_Figh_HTML.jpg](img/466154_1_En_5_Figh_HTML.jpg)


  评估检索到的数据，以识别任何数据质量问题，并修复数据，确保获得更高质量的数据科学数据源。


  ![../images/466154_1_En_5_Chapter/466154_1_En_5_Figi_HTML.jpg](img/466154_1_En_5_Figi_HTML.jpg)


  处理评估阶段的数据，合并同类数据，以生成当前的“单一事实版本”。


  ![../images/466154_1_En_5_Chapter/466154_1_En_5_Figj_HTML.jpg](img/466154_1_En_5_Figj_HTML.jpg)


  将当前“单一事实版本”的快照转换为存储历史的数据仓库。数据特征工程在此处生成数据科学辅助资料。


  ![../images/466154_1_En_5_Chapter/466154_1_En_5_Figk_HTML.jpg](img/466154_1_En_5_Figk_HTML.jpg)


  将“数据仓库”组织成一系列数据集合，供数据科学模型处理。生成数据仓库、数据集市、训练集、测试集和结果数据集。


  ![../images/466154_1_En_5_Chapter/466154_1_En_5_Figl_HTML.jpg](img/466154_1_En_5_Figl_HTML.jpg)


  将数据科学的结果作为每个数据科学案例预先批准的可交付成果进行报告，供标准报告工具使用。




  ## 什么是数据湖？


  数据湖是一个用于存储海量原始数据的存储库。它以原生格式存储数据，以备未来之需。在本书中，您将了解到为什么这对于实际的数据科学和工程解决方案至关重要。与采用写时模式（schema-on-write）的数据仓库将数据存储在预定义的数据库、表和记录结构中不同，数据湖采用限制较少的读时模式（schema-on-read）架构来存储数据。数据湖中的每个数据元素都会被分配一个独特的标识符，并附带一组全面的元数据标签。


  数据湖通常使用分布式数据对象存储来部署，以实现读时模式结构。这意味着业务分析和数据挖掘工具无需复杂的模式即可访问数据。使用读时模式方法，您可以按原样加载数据，并立即开始从中获取价值。


  我将在第 6、7、8 和 9 章中详细讨论并说明使用读时模式存储方法的原因。


  我们部署到云端的方案是一种经济高效的解决方案，它使用 Amazon Simple Storage Service (Amazon S3) 来存储数据湖的基础数据。


  我将演示如何切实可行地使用云技术来配置您的数据科学工作。不过，本书中的示例无需上云，因为它们可以轻松地在笔记本电脑上处理。


  ![../images/466154_1_En_5_Chapter/466154_1_En_5_Fig17_HTML.jpg](img/466154_1_En_5_Fig17_HTML.jpg)


  图 5-17


  数据湖六大区域


  这种方法可以利用现有的技术栈，从而降低风险和成本。


  ### 数据湖区域


  参见图 5-17。


  ![../images/466154_1_En_5_Chapter/466154_1_En_5_Figm_HTML.jpg](img/466154_1_En_5_Figm_HTML.jpg)


  原始区域是所有数据湖外部数据的入口点。它是多个数据提取处理解决方案的端点。


  ![../images/466154_1_En_5_Chapter/466154_1_En_5_Fign_HTML.jpg](img/466154_1_En_5_Fign_HTML.jpg)


  结构化区域用于将原始数据转换为增强型数据源。该区域的数据采用统一格式，以辅助下一区域的处理能力。任何数据质量问题都在此区域解决。


  ![../images/466154_1_En_5_Chapter/466154_1_En_5_Figo_HTML.jpg](img/466154_1_En_5_Figo_HTML.jpg)


  策展区域是整个数据湖当前的单一事实来源。该区域中的数据仓库和数据仓库能够整合和合并来自结构化区域的数据源。“活跃”的数据科学模型结果存储在此区域。


  ![../images/466154_1_En_5_Chapter/466154_1_En_5_Figp_HTML.jpg](img/466154_1_En_5_Figp_HTML.jpg)


  消费区域是存储用于业务洞察的不同数据集市的地方，供最终用户可视化其业务洞察。这是大多数业务人员提出问题的首要区域。


  ### 提示


  消费区域是唯一根据已批准的服务级别协议（SLA）向活跃客户群开放的区域，以确保系统的其余部分能够进行适当的维护和能力的演进。


  ![../images/466154_1_En_5_Chapter/466154_1_En_5_Figq_HTML.jpg](img/466154_1_En_5_Figq_HTML.jpg)


  分析区域是数据湖的“沙盒”。该区域用于设计、开发和训练新颖的数据科学和机器学习解决方案，然后由 DevOps 将其转移到策展区域。


  ## 什么是数据仓库？


  数据仓库建模由 Dan Linstedt 设计，是一种数据库建模方法，其结构旨在控制来自多个操作系统的数据的长期历史存储。


  数据仓库化过程将读时模式的数据湖转换为写时模式的数据仓库。


  数据仓库被设计为读时模式查询请求，然后针对数据湖执行。


  我也见过将结果存储为写时模式格式，以便为将来的查询持久化结果。


  这两种技术的细节将在第 8 章中讨论。目前，我只期望您理解构建数据仓库所需的基本结构。


  该结构由三种基本数据结构构建而成：中心表、链接表和附属表。


  让我们检查一下这些特定的数据结构，以阐明它们为何是必需的。


  ### 中心表


  中心表包含一个独特的业务键列表，这些键的变更倾向较低。中心表为每个中心表项包含一个代理键，以及业务键来源的元数据分类。


  中心表是您数据仓库的核心支柱，我将在第 9 章中更详细地讨论如何以及为何使用这种结构。


  ### 链接表


  业务键之间的关联或事务使用链接表进行建模。这些表本质上是多对多连接表，并带有特定的附加元数据。


  链接表是中心表之间的单一关系，以确保准确记录业务关系，从而为实际业务完成数据模型。


  在第 9 章中，我将解释您为何需要特定的关系以及如何实现。


  ### 附属表


  中心表和链接表构成了模型的结构，但不存储数据的任何时间特征或描述性特征。这些特征存储在被称为附属表的专用表中。


  附属表是存储业务特征全面信息层次的结构，通常是整个数据仓库数据结构中容量最大的部分。在第 9 章中，我将解释这些结构为何以及如何如此有效地对实际业务特征进行建模。


  中心表、链接表和附属表的适当组合支持数据科学家构建和存储必要的业务关系。作为数据建模师，这是一项非常受欢迎的技能。


  向这种写时模式数据结构的转换将在第 9 章中详细讨论，以指出特定结构为何支持处理方法。


  我将在第 9 章中解释……您为何需要特定的中心表、链接表和附属表。


