  ### 火星时钟


  下一个特征更复杂，但计算火星时钟使用了类似的原理：


  ```

  def marstime(s):

  #设置为 24 小时 39 分钟 35 秒

  marsdayseconds = (24∗60∗60)+(39∗60)+35

  marsday = round(s/marsdayseconds,6)

  return marsday

  dateDF[''MarsTime''] = dateDF.apply(lambda row: marstime(row[''SecondsSinceLaunch'']),
  axis=1)

  ```




  ### 地球时钟


  下一个特征是关于我们自身行星——地球——日长的修正。我们的平均日长小于 24 小时，因此才有了闰年。任务必须考虑到这一点。


  ```

  def earthtime(s):

  # 设置为 23 小时 56 分钟 4 秒

  earthdayseconds = (23∗60∗60)+(59∗60)+4

  earthday = round(s/earthdayseconds,6)

  return earthday

  dateDF[''EarthTime''] = dateDF.apply(lambda row:earthtime(row[''SecondsSinceLaunch'']),
  axis=1)

  ```


