  ### 深度学习引擎


  深度学习引擎是自动 IML 的核心，它监控并控制多个快速信息工厂，以处理数据科学和数据工程需求。


  #### 量子


  基本引擎由***大量***优化的处理器组成，这些处理器作为无服务器、基于云的数据集成代理运行，使用***群体原则***，能够以最小的数据操作来操纵跨工厂的数据实体。该处理引擎使用***量子原则***，能够同时并行处理通过多个工厂的多个数据流。


  这产生了一个***有向无环图 (DAG)***，它通过在***快速信息工厂***之间共享数据来***放大***净处理吞吐量。


  ### 提示


  我创建了一个处理引擎，它以 Python 代码作为输出。是的，我有一个可以编写数据科学和机器学习代码的 Python 系统。


  我将仅从概念上提及这个进化代码生成器，因为它目前仍在开发和测试中，之后才能与大众分享。


  ### 注意


  一旦我解决了这个问题，我将用更多细节更新本节。


  #### 通用


  处理过程由您作为数据科学家和机器学习工程师建立的一套***系统化***且***精确***的规则所指导。


  核心设计是，您仅启用特定类型的机器学习，或设计一个***强化学习***算法，该算法使用***进化编程***来发现适用于您数据湖原始区域中每个数据集的所需机器学习。


  #### 有界


  处理域仅支持一套***有界***的***规则集***，因为它具有***有限种群***。这个有限种群导致了一个在处理需求上可预测的域，因为域中的每一步都针对***有效性***和***效率***进行了单独优化。


  #### 引擎


  核心是一个***数据处理设备***，它将数据转化为知识，并采用人在回路中来学习如何学习新的数据集。其优势在于，通过***有界规则***和***量子处理计划***对数据进行整合，确保了在引擎控制下的众多数据工厂具有***高度有效***且***高效***的处理特性。


  我希望您留意这些自动编码平台，因为我预测在未来五年内，大部分的机器学习将被工业化，然后由这些代理创建。


  然而，在此之前，您仍然需要人在回路中的帮助来解决业务洞察问题。


  我建议您阅读本章的其余部分，以了解您的需求需要何种类型的人工帮助。它还将指出您在整体机器学习生态系统中的位置。


  ## 哪种类型的机器学习？


  机器学习需要高度专业化的专家才能使其完美运行。现在，我将向您介绍一些您在机器学习生态系统中会听到的通用职位描述。


  ### 数据分析师


  #### 职位描述


  您的工作是将数据转化为可执行的业务洞察。您通常是技术团队与业务战略、销售或营销团队之间的桥梁。数据可视化将成为您日常工作的重要组成部分。


  #### 为何重要


  高技术人员通常难以理解数据分析师为何如此重要，但他们确实是连接业务的纽带。需要有人将经过训练和测试的模型以及大量用户数据调整为易于理解的格式，以便围绕它们设计业务战略和洞察。数据分析师有助于确保数据科学团队不会浪费时间解决无法带来业务价值的问题。


  #### 要求


  您将使用的技术包括 Python、SQL、Tableau 和 Excel。您还需要具备良好的沟通能力。


  #### 问题


  您将处理的问题听起来像这样：


  *   “是什么推动了我们银行卡的增长数据？”


  *   “我们如何向管理层阐明，银行手续费的新一轮上涨正在导致客户流失？”




  ### 数据工程师


  #### 职位描述


  你将负责管理处理大量数据的公司的数据管道。这意味着要确保数据能够高效地从其源头被收集和检索，并在需要时进行清洗和预处理。


  #### 重要性


  如果你只处理过存储在 .csv 或 .txt 文件中相对较小（<5 Gb）的数据集，可能很难理解为什么会有人全职从事构建和维护数据管道的工作。


  原因如下：1) 一个 100 Gb 的数据集无法放入你电脑的内存（RAM）中，因此通常需要其他方式将其输入模型；2) 如此大量的数据可能需要极长的处理时间，并且为了完成所需的处理任务，通常必须不必要地将数据存储在交换空间中。


  管理如此庞大的存储量需要专业的技术知识。这正是你的用武之地。


  #### 技术要求


  你将使用的技术包括 Apache Spark、Hadoop 和/或 Hive，以及 Kafka。你很可能需要具备扎实的 SQL 和数据库设计基础。你将是系统和生态系统的构建者。


  #### 问题


  你将处理的问题听起来像这样：


  *   “如何构建一个能够每秒处理 100,000 个请求的管道？”


  *   “如何在不将所有数据加载到内存的情况下清洗这个数据集？”


  *   “我需要使用 Cuda GPU 来处理我的数据吗？”


  ### 数据科学家


  #### 职位描述


  你的工作将是清洗和探索数据集，并做出能够带来商业价值的预测。你的日常工作将涉及训练和优化模型，并经常将其部署到生产环境中。


  #### 重要性


  当你有一堆数据，大到人类无法解析，但又宝贵到不容忽视时，你需要某种方法从中提取易于理解的见解。这就是数据科学家的基本工作：将数据集转化为易于理解的结论。


  #### 技术要求


  你将使用的技术包括 Python、scikit-learn、Pandas、SQL，可能还有 Flask、Spark 和/或 TensorFlow/PyTorch。一些数据科学职位纯粹是技术性的，但大多数职位会要求你具备一定的商业头脑，这样你就不会最终去解决那些没人关心的问题。


  你需要理解你所使用的每个机器学习算法的详细响应，因为你需要知道在什么设置下，哪些参数能以高效率和高效能提供最优解决方案。


  #### 问题


  你将处理的问题听起来像这样：


  *   “我们到底有多少种不同的用户类型？”


  *   “我们能构建一个模型来预测哪些产品会卖给哪些用户吗？”


  *   “你能对我的网络聊天数据进行情感分析吗？”


  ### 提示


  数据科学家的角色将变得非常重要或相关，以至于董事会成员将负责机器学习及其对业务和客户的影响。


  ### 机器学习研究员


  #### 职位描述


  你的工作将是寻找新的方法来解决数据科学和深度学习中的挑战性问题。你不会使用现成的解决方案，而是会自己创造解决方案。他们是 IML 工作坊中研发部门的一部分。


  ### 提示


  我预测，随着机器学习在未来五年内成为主流，这类人才将非常抢手。


  #### 技术要求


  你将使用的技术包括 Python、TensorFlow/PyTorch（和/或企业级深度学习框架）以及 SQL。


  #### 问题


  你将处理的问题范围广泛：


  “如何将我们模型的准确率提高到更接近当前最优水平？”


  “自定义优化器是否有助于减少训练时间？”


  “如何改变数据工程需求以获得更好的结果？”


  我在这里列出的五个职位描述并非在所有情况下都独立存在。例如，在早期创业公司，数据科学家可能还必须兼任数据工程师和/或数据分析师。但大多数工作会更明确地属于这些类别之一——而且公司越大，这些类别就越适用。


  总的来说，要记住的是，为了获得录用，你最好构建一个更专注的技能组合：如果你想成为数据分析师，就不要学习 TensorFlow；如果你想成为机器学习研究员，就不要优先学习
  PySpark。


  ### 机器学习工程师


  职位描述：你的工作将是构建、优化机器学习模型并将其部署到生产环境。你通常会将机器学习模型视为 API 或组件，并将其集成到某种全栈应用或硬件中，但也可能需要你自己设计模型。


  技术要求：你将使用的技术包括 Python、JavaScript、scikit-learn、TensorFlow/PyTorch（和/或企业级深度学习框架）以及
  SQL 或 MongoDB（通常用于应用数据库）。


  你将处理的问题听起来像这样：


  *   “如何将这个 Keras 模型集成到我们的 JavaScript 应用中？”


  *   “如何降低我们推荐系统的预测时间和预测成本？”


  ## 你学到了什么？


  你应该对 RIF 有了一个基本的设计思路。


  你需要理解，该处理过程包含六个不同的超级处理步骤，以确保机器学习有效、高效且可复现。


  将传统机器学习转变为 IML，仅仅是应用一个可重复的标准流程，你和你的同事可以轻松地遵循它，为你的客户和你们自己取得成功。


  ## 下一步是什么？


