- '# 13. 第四次工业革命（4IR）


  让我们先回顾一下第一、第二和第三次工业革命，然后再深入探讨第四次。


  ***第一次工业革命（1IR）*** 利用 ***水力和蒸汽动力*** 实现了 ***生产机械化***。典型的农业、乡村文明转变为制造业和城市文明。由于蒸汽机的发展，钢铁和纺织业迅速兴起。这一项发现将人们从土地推向了工厂。蒸汽机始于
  1698 年，到 1733 年，英国仅有 104 台蒸汽机在使用。1753 年，它传到了美国，至今仍有蒸汽机在运行。它来了，并持续改变着周围的世界。


  ***第二次工业革命（2IR）*** 利用 ***电力*** 实现了 ***大规模生产***。它从 1870 年持续到 1914 年。它简单地利用了钢铁、石油和电力，并用电能创造了至今仍在全球产生影响的大规模生产。它催生了电话、电灯、留声机和内燃机。后者导致了人员和货物
  ***不受限制地流通*** 的 ***更快速移动***。


  ***第三次工业革命（3IR）*** 利用 ***电子和信息技术*** 实现了 ***生产自动化***。这场 ***数字革命*** 将技术从模拟电子和机械设备推进到数字技术。自
  1980 年以来，它催生了个人电脑、互联网以及信息和通信技术（ICT）产业。这导致了人与机器之间的 ***即时通信***。


  ***第四次工业革命（4IR）*** 建立在第三次工业革命的基础上，这是一场数字革命，其特点是 ***技术融合***，这种融合正在 ***模糊***  ***物理、数字和生物领域***
  之间的界限。


  您正站在一场 ***技术*** 和 ***社会革命*** 的边缘，这场革命将从根本上改变人类生活、工作和相互交往的方式。就其规模、范围和复杂性而言，这场变革将与人类历史上经历的一切形成鲜明对比。当前
  4IR 面临的问题是 ***速度***、***范围*** 和 ***系统影响***。当前突破性进展的速度在历史上没有先例。


  当我将 4IR 与 1IR、2IR 甚至 3IR 进行比较时，4IR 正以 ***指数级速度*** 发展，而非以往近乎线性的速度。此外，它正在 ***颠覆***
  每个国家的几乎所有行业。这些变革的广度和深度迫使生产、管理和权威的整个系统发生转变。


  4IR 现在正在 ***直接动摇当前的现实世界流程***。


  4IR 被预测为人类未来进化道路上的下一步。与之前的几次革命一样，4IR 有潜力提高全球收入水平，并改善世界各地人口的生活质量。到目前为止，从中获益最多的是那些能够负担得起并接入数字世界的消费者，但全球组织为连接未联网人群而开展的新活动将迅速改变这种接入不足的状况。4IR
  正在挑战工业化机器学习（IML）的应用，并将影响您体验和影响周围世界的方式。


  ## 使能技术


  第四次工业革命（4IR）的标志是多个领域新兴技术的突破，包括机器人技术、人工智能（AI）、纳米技术、量子计算、生物技术、物联网（IoT）、3D 打印和自动驾驶汽车。这些技术具有巨大的潜力，能够实时连接数十亿人上网，从根本上提高企业和组织的效率，并通过更好的资产管理帮助再生自然环境。


  制造商需要了解增材制造（如 3D 打印）、机器人和自主生产、人工智能、虚拟现实、分析学以及材料科学的进步。


  4IR 由多个领域的新兴技术突破驱动，涵盖机器人技术、人工智能、生物技术、物联网、3D 打印、量子计算、纳米技术和自主交通工具。


  ### 全机器人闭环制造单元


  闭环制造是 IML 用于监控制造过程和精度要求的众多方法和必要条件的技术。


  我使用以下步骤：


  1.  为所需的制造方法规划工序的顺序和迭代。


  2.  预制造作为更大开发项目一部分的较小模块。可重复的质量是成功的衡量标准。整个系统必须按照标准并在公差范围内构建。为每个步骤和模块获取关键绩效指标（KPI）。


  3.  测量过程中每个 KPI 的实际值是必要条件。传感器在组织的这一层级至关重要。


  4.  计算所需 KPI 与测量 KPI 之间的显著差距。如果显著差距小于所需精度，则停止。完美型的 KPI 成本极高。


  5.  通过使用自适应学习近乎实时地纠正质量，以所需的质量持续生产产品。


  6.  根据需要从步骤 3 重复多次，以交付您所需的产品。




  ### 提示


  处理制造业问题时，务必首先明确范围，因为若没有固定范围就试图实现闭环制造，最终得到的解决方案将缺乏所有必要的输入和输出。随后，范围的缺失会导致无法形成闭环单元。


  三维打印是该领域的一项重大进步，因为这种单一类型的制造工具能够适应制造各种组件，而无需进行重大的重新装备。我预测，未来我们将看到更多按需生产而非大规模制造的产品；超个性化将是制造业的下一步发展方向。


  ### 机器学习的模块化构建


  通过自适应学习和机器人技术，IML（集成机器学习）的应用得以借助 3D 打印实现。你可以让自己能够分析机器学习规则设定的未来预测需求，并在那一刻完成物理交付。


  模块化构建描述了流程中的重要元素，旨在标准化并创建可供机器学习工厂随时使用的通用子组件。预制造通用组件的优势在于，你能够利用 IML 预测所需内容，然后工业化生产所需的通用部件。多年来我发现，如果你将大部分
  IML 步骤准备为更高质量的通用组件，并将其作为通用工具库，那么通过将合适的组件组装成单独的解决方案来执行特定的机器学习任务，将更容易交付你的解决方案。


  ### 提示


  在将解决方案的初稿作为定制方案部署时，我发现任何高质量的 IML 中，80%都只是通用的预设计解决方案，仅需少量个性化调整。


  据预测，到 2020 年，全球工业制造业领域将在物联网技术上花费约 8900 亿美元。这些物联网传感器将生成越来越多的数据，使你能够利用 IML 开发数据湖。你将需要增加对生成高效
  IML 解决方案的必要投资，以满足这一需求。


  ## 当今世界的颠覆者


  你拥有具备自适应学习能力的 IML、人工智能、机器人技术、物联网、3D 打印、纳米技术、生物技术、材料科学、能源存储和量子计算，用以改进你和你客户周围的解决方案。我已经向你介绍了来自
  IML 学习的知识库，这将使你能够帮助你的客户利用这些颠覆性技术来改善你们周围的世界。


  那么，我现在将讨论 IML 生态系统中一些最活跃的解决方案。你只需从小处着手，并在进步过程中不断发展你的技能。你只能通过实践和努力磨练现有技能来学习。


  以下是我看到的一些当前解决方案，它们正在我所工作的领域带来巨大变革。


  ### 机器辅助机器人手术


  IML 在医疗保健领域的预计价值为 400 亿美元，它创造出了能够分析术前医疗记录数据以在手术中引导外科医生器械（[`https://www.davincisurgery.com/`](https://www.davincisurgery.com/)）的机器人，这可以使患者的住院时间减少
  21%。机器人辅助手术被认为是“微创”的，因此患者无需从大切口愈合。通过人工智能，IML 机器人可以利用历史手术数据来为新的手术技术提供建议。对骨科患者的研究表明，与外科医生单独操作相比，人工智能辅助的机器人手术导致的并发症减少了五倍。


  在眼科手术中使用 IML 驱动的机器人，造就了最先进的手术机器人；达芬奇机器人使医生能够以比传统方法更强的控制力执行多方面的程序。


  心脏外科医生在手术中借助一种微型机器人，该机器人通过胸部的一个小切口进入，在心脏表面进行标测和治疗，以探索特定独特的心脏，并调整学习以适应特定的手术。


  ### 虚拟护理助手


  虚拟护理助手的引入现在能够主动与患者互动，将患者引导至最有效的护理环境；虚拟护理助手每年可为医疗保健行业节省 200 亿美元。


  具有主动自适应学习能力的 IML 现在充当着全天候可用的虚拟护士；它们可以回答问题，通过物联网监控患者，并提供快速答复。如今，虚拟护理助手的最佳应用允许患者和护理提供者在门诊之间进行更频繁的沟通，以防止再次入院或不必要的医院就诊。虚拟护理助手可以通过语音和人工智能进行健康检查。


  我预测，IML 在机器人技术中作为虚拟护理助手的应用将增加机器学习的部署。


  ### 辅助临床判断或诊断


  带有辅助算法的 IML 分析了人们所说的话、语气和背景噪音，并检测出心脏骤停（[`https://www.resuscitationjournal.com`](https://www.resuscitationjournal.com)），成功率达到
  93%，而人类仅为 73%。


  IML 使用深度学习算法表明，在识别乳腺癌转移时，诊断现在可以胜过人类。这些算法将检查来自患者历史诊断的健康研究中的医疗记录、习惯和遗传信息。


  我建议，随着对历史健康数据访问的改善，IML 算法将增强未来的健康服务。


  ### 工作流程与行政任务


  IML 有助于行政任务的自动化。你未来部署的 IML 将能够改善客户所需的日常流程。凭借你到目前为止在本书中获得的理解，你可以通过使用监督学习和无监督学习来增强客户的解决方案，从而实现高质量的解决方案。


