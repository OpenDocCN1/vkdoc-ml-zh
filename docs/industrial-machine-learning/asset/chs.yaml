  ![$$ =0.035 $$](img/466154_1_En_3_Chapter_TeX_Equbx.png)


  通常，这会被报告为 LR- 为 0.035。


  良好的 LR- 应小于 0.1。


  如果 LR+ 或 LR- 接近 1，则模型存在问题或无法正常工作。


