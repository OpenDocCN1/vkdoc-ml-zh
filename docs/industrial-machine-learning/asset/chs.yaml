  # 创建三个任务，长度分别为 1、2 和 3

  mail, food, hole = S.Task(''steal_mail'',1), S.Task(''eat_food'',2), S.Task(''dig_hole'',3)

  # 将任务分配给资源，可以是 Angus 或 Jock，

  # % 运算符用于连接任务和资源

  mail += Angus|Jock

  food += Angus|Jock

  hole += Angus|Jock

  # 求解并打印结果

  S.use_makespan_objective()

  solvers.mip.solve(S,msg=1)

