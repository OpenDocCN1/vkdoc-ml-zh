  这段代码演示了日志记录甚至可以在跨线程进程中工作，这对于并行处理机器学习解决方案非常有用。


  ```

  import logging

  import threading

  import time

  def worker(arg):

  while not arg[''stop'']:

  logging.debug(''Hi from Worker Process'')

  time.sleep(0.5)

  def main():

  logging.basicConfig(level=logging.DEBUG, format=''%(relativeCreated)6d %(threadName)s
  %(message)s'')

  info = {''stop'': False}

  thread = threading.Thread(target=worker, args=(info,))

  thread.start()

  l=0

  while True:

  try:

  logging.debug(''Hello from Main Process'')

  time.sleep(0.75)

  l+=1

  if l > 10:

  info[''stop''] = True

  break

  except KeyboardInterrupt:

  info[''stop''] = True

  break

  thread.join()

  if __name__ == ''__main__'':

  print(''Start'')

  time.sleep(0.2)

  main()

  time.sleep(1)

  print(''Done'')

  ```


