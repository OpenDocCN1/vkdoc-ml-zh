  ## 快速信息工厂生态系统


  快速信息工厂生态系统是我用于个人处理开发的一套技术惯例。本书的处理路径将基于此构建，但你并非必须完全使用它。我在本章中讨论的工具对你来说没有使用限制。你可以根据自己特定生态系统的需要，以任何配置或组合方式使用这些工具。


  我建议你开始着手构建自己的生态系统，或者直接采用我的。你已经具备了熟悉并熟练部署一套工具的前提条件。


