  ### SimPy


  SimPy 是一个基于标准 Python 的、以进程为基础的离散事件仿真框架。


  SimPy 中的进程由 Python 生成器函数定义，例如，可用于对客户、车辆或代理等主动组件进行建模。SimPy 还提供了多种类型的共享资源，用于对有限容量的拥堵点（如服务器、收银台和隧道）进行建模。


  仿真可以“尽可能快”地运行，也可以实时（挂钟时间）运行，或者通过手动逐步触发事件来运行。SimPy 库可通过以下命令安装：


  ```

  安装 SimPy

  conda install -c mutirri/label/anaconda simpy

  ```


  #### 基本仿真器设置


  现在，我将指导你如何构建并测试你的第一个仿真。


  基本的仿真将模拟四个进程。


  *   **极快处理器** - 每四分之一秒运行一次


  *   **快速处理器** - 每半秒运行一次


  *   **慢速处理器** - 每秒运行一次


  *   **极慢处理器** - 每两秒运行一次


  打开第 9 章示例中的 Jupyter Notebook，文件名为：Chapter-014-07-Basic-Sim-01.ipynb


  ```

  import simpy

  def clock(env, name, tick):

  while True:

  print(''%6.2f > %s'' % (env.now, name))

  yield env.timeout(tick)

  env = simpy.Environment()

  env.process(clock(env, ''very fast'', 0.25))

  env.process(clock(env, ''fast'', 0.5))

  env.process(clock(env, ''slow'', 1))

  env.process(clock(env, ''very slow'', 2))

  env.run(until=3)

  ```


  你的运行结果如下：


  ```

  0.00 > very fast

  0.00 > fast

  0.00 > slow

  0.00 > very slow

  0.25 > very fast

  0.50 > fast

  0.50 > very fast

  0.75 > very fast

  1.00 > slow

  1.00 > fast

  1.00 > very fast

  1.25 > very fast

  1.50 > fast

  1.50 > very fast

  1.75 > very fast

  2.00 > very slow

  2.00 > slow

  2.00 > fast

  2.00 > very fast

  2.25 > very fast

  2.50 > fast

  2.50 > very fast

  2.75 > very fast

  ```


