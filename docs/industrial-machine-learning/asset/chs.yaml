  ## 建模环境


  我想解释一个通用术语，叫做“模拟器”。


  “模拟是对一个系统内一组真实世界过程随时间运行的模仿。”


  本质上，一个系统有多个输入，它对选定的输入应用近似的数学函数，并返回以数据形式呈现的输出，这些数据可以被可视化，以观察系统在那一刻正在做什么。


