  ## 异常检测


  异常检测是一种用于识别不符合预期行为的异常模式（称为离群点）的技术。简单来说，它们不符合常规或行为异常。


  异常通常可以分为以下几种类型。


  ### 点异常


  如果单个数据实例与总体中其他数据的值相差太远，则该实例是异常的。


  业务用例：


  基于“消费金额”检测信用卡欺诈。


  ### 上下文异常


  异常性是上下文相关的。这种类型的异常在时间序列数据中很常见。


  业务用例：


  在假期期间每天在食物上花费 150.00 美元是正常的，但在其他时间可能很奇怪。


  突然开始在你从未去过的地方花钱，或者在一个不切实际的时间段内在两个地点花钱，都属于上下文异常。




  ### 集体异常


  一组数据实例共同帮助检测异常。


  业务用例：


  有人试图意外地将数据从远程机器复制到本地主机，这种异常会被标记为潜在的网络攻击。


