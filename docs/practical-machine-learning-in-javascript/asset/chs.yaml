  \n## 5.3 硬件数据\n\n作为本章的最后一部分，也是本书包含代码示例的最后一部分，我们将探讨一些更高级和实验性的内容。接下来的几页将重点介绍如何使用硬件生成的数据，并构建一个自定义机器学习模型来检测手势。\n\
  \n通常，在处理硬件时，我会使用 Arduino 或 Raspberry Pi 等微控制器；然而，为了让可能没有此类设备的读者也能轻松上手，下一节将使用另一种内置硬件组件的设备——您的手机！\n\
  \n这假设您拥有一部至少配备加速度计和陀螺仪的现代手机。\n\n为了在 JavaScript 中访问这些数据，我们将使用通用传感器 API。\n\n这个 API\
  \ 相当新且具有实验性，目前仅在 Chrome 浏览器中得到支持，因此如果您决定编写以下代码示例，请确保使用 Chrome 作为浏览器。\n\n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig52_HTML.jpg](img/496132_1_En_5_Fig52_HTML.jpg)\n\
  \n图 5-52\n\n通用传感器 API 的浏览器支持情况。来源：[`https://caniuse.com/#search=sensor%20api`](https://caniuse.com/#search=sensor%2520api)\n\
  \n为了构建我们的手势分类器，我们将访问并记录手机中加速度计和陀螺仪的数据，将这些数据保存到项目中的文件中，创建一个机器学习模型，对其进行训练，并对新的实时数据进行预测。\n\
  \n为了实现这一点，我们需要一点 Node.js、使用 socket.io 的 Web 套接字、通用传感器 API 和 TensorFlow.js。\n\n如果您不熟悉其中某些技术，请不要担心，我将解释每个部分并提供您可以跟随的代码示例。\n\
  \n### 5.3.1 Web 传感器 API\n\n由于本节使用硬件数据，我们需要做的第一件事是验证我们能否访问正确的数据。\n\n如前所述，我们需要记录陀螺仪和加速度计的数据。\n\
  \n陀螺仪提供有关设备方向及其角速度的详细信息，而加速度计则专注于提供加速度数据。\n\n即使我们只需要使用其中一个传感器，但我认为结合陀螺仪和加速度计的数据可以提供更精确的运动信息，并且对手势识别很有帮助。\n\
  \n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig54_HTML.jpg](img/496132_1_En_5_Fig54_HTML.jpg)\n\
  \n图 5-54\n\n手机上的陀螺仪轴。来源：[`https://www.sitepoint.com/using-device-orientation-html5/`](https://www.sitepoint.com/using-device-orientation-html5/)\n\
  \n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig53_HTML.jpg](img/496132_1_En_5_Fig53_HTML.jpg)\n\
  \n图 5-53\n\n手机上的加速度计轴。来源：[`https://developers.google.com/web/fundamentals/native-hardware/device-orientation`](https://developers.google.com/web/fundamentals/native-hardware/device-orientation)\n\
  \n\n\n### 5.3.2 访问传感器数据\n\n要使用通用传感器 API 访问数据，我们首先需要声明几个变量：一个用于引用 `requestAnimationFrame`\
  \ 语句以便稍后取消它，另外两个用于存储陀螺仪和加速度计的数据。\n\n```\nlet dataRequest;\nlet gyroscopeData = {\n\
  x: '',\ny: '',\nz: ''\n}\nlet accelerometerData = {\nx: '',\ny: '',\nz: ''\n}\n\
  代码清单 5-59\n在 index.js 中。声明用于存储硬件数据的变量\n```\n\n然后，要访问手机传感器数据，你需要实例化一个新的 `Gyroscope`\
  \ 和 `Accelerometer` 接口，使用 `reading` 事件监听器获取设备运动的 x、y、z 坐标，并调用 `start` 方法开始追踪。\n\n\
  ```\nfunction initSensors() {\nlet gyroscope = new Gyroscope({frequency: 60});\n\
  gyroscope.addEventListener('reading', e => {\ngyroscopeData.x = gyroscope.x;\ngyroscopeData.y\
  \ = gyroscope.y;\ngyroscopeData.z = gyroscope.z;\n});\ngyroscope.start();\nlet accelerometer\
  \ = new Accelerometer({frequency: 60});\naccelerometer.addEventListener('reading',\
  \ e => {\naccelerometerData.x = accelerometer.x;\naccelerometerData.y = accelerometer.y;\n\
  accelerometerData.z = accelerometer.z;\n});\naccelerometer.start();\n}\n代码清单 5-60\n\
  在 index.js 中。获取加速度计和陀螺仪数据\n```\n\n最后，由于我们只对执行特定手势时记录数据感兴趣，因此我们只需要在用户通过 `touchstart`\
  \ 事件按压手机屏幕时调用上述函数。我们还应该在 `touchend` 事件中取消它。\n\n```\nfunction getData() {\nlet data\
  \ = {\nxAcc: accelerometerData.x,\nyAcc: accelerometerData.y,\nzAcc: accelerometerData.z,\n\
  xGyro: gyroscopeData.x,\nyGyro: gyroscopeData.y,\nzGyro: gyroscopeData.z,\n};\n\
  document.body.innerHTML = JSON.stringify(data);\ndataRequest = requestAnimationFrame(getData);\n\
  }\nwindow.onload = function () {\ninitSensors();\ndocument.body.addEventListener(\"\
  touchstart\", (e) => {\ngetData();\n});\ndocument.body.addEventListener(\"touchend\"\
  , (e) => {\ncancelAnimationFrame(dataRequest);\n});\n};\n代码清单 5-61\n在 index.js 中。使用\
  \ touchstart 事件监听器开始显示数据\n```\n\n此时，如果你想检查这段代码的输出，你需要使用像 ngrok 这样的工具在手机上访问页面，例如，创建一个到本地主机的隧道。\n\
  \n你应该看到的是，当你按下屏幕时，实时的加速度计和陀螺仪数据会显示在屏幕上，当你松开手指时，数据将不再更新。\n\n此时，我们将数据显示在页面上，以便我们可以再次确认一切按预期工作。\n\
  \n然而，我们真正需要的是在记录手势时将这些数据存储到文件中。为此，我们将需要使用 Web Socket 将数据从前端发送到后端服务器，后端服务器将负责将数据写入我们应用程序文件夹中的文件。\n\
  \n### 5.3.3 设置 Web Socket\n\n为了设置 Web Socket，我们将使用 socket.io。\n\n到目前为止，在之前的所有示例中，我们只使用了\
  \ HTML 和 JavaScript 文件，没有任何后端。\n\n如果你之前从未编写过任何 Node.js 代码，你需要安装它以及 **npm** 或 **yarn**，以便能够安装包。\n\
  \n设置好这两个工具后，在你的项目文件夹根目录下的终端中，输入 `npm init` 来生成一个 `package.json` 文件，该文件将包含有关项目的一些详细信息。\n\
  \n生成 `package.json` 文件后，在终端中输入 `npm install socket.io` 来安装该包。\n\n完成后，在你的 HTML 文件中添加以下\
  \ script 标签。\n\n```\n代码清单 5-62\n在 HTML 文件中导入 socket.io 脚本\n```\n\n现在，你应该能够在前端使用\
  \ socket.io 了。在你的 JavaScript 文件中，首先使用 `const socket = io()` 实例化它。\n\n如果你在设置包时遇到任何问题，请随时参考官方文档。\n\
