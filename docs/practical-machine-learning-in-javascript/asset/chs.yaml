  \ { width: 257, height: 200 },\nquantBytes: 2\n});\n代码清单 5-44\n使用 ResNet50 架构加载模型\n\
  ```\n\n如果你对这些不同的参数感到有些困惑，不用担心，在入门阶段，使用提供的默认参数是完全可行的。如果你想了解更多关于它们的信息，可以在 TensorFlow\
  \ 官方文档中找到更详细的说明。\n\n模型加载完成后，你就可以专注于进行姿态预测了。\n\n#### 预测\n\n要从模型获取预测结果，你主要需要调用模型上的\
  \ `estimateSinglePose` 方法。\n\n```\nconst pose = await net.estimateSinglePose(image,\
