  \        const activation = net.infer(img, \"conv_preds\");\n        const result\
  \ = await classifier.predictClass(activation);\n        predictionParagraph.innerText\
  \ = `\n          预测结果: ${classes[result.label]},\n          置信度: ${result.confidences[result.label]}`;\n\
  \        img.dispose();\n      }\n      await tf.nextFrame();\n    }\n  }\n}\n\n\
