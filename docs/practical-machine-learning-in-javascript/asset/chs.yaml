  \ TensorFlow.js 进行分类，我们就不再需要它了，因此应该释放它所占用的内存。\n\n为此，TensorFlow.js 提供了 `dispose`\
  \ 方法，你可以像这样使用它。\n\n```\nimg.dispose();\n清单 3-8\n使用 dispose 方法释放一些内存\n\n我们已经介绍了物体检测逻辑的主要部分。然而，游戏的第一部分是提示你找到特定的物体并拍照。\n\
