  在开始之前，重要的是要知道本章不会深入探讨如何使用 Kubernetes 集群、配置负载均衡器等来设置你自己的机器学习流水线，因为这通常是 DevOps 或基础设施团队的任务。然而，理解将机器学习模型投入生产环境所面临的挑战非常重要，因此我们将解释其中一些挑战，并介绍一些不同的工具，如果你没有机会与专门的团队合作，这些工具应该能帮助你将机器学习添加到生产应用程序中。


  ## 6.1 挑战


  将机器学习投入生产环境会带来一系列与我们之前可能遇到的不同的挑战。


  在本书中构建的个人项目中，我们是唯一的用户，并且所有内容都在本地运行。我们更多地处于概念验证阶段。在生产环境中，应用程序不仅会被数百、数千甚至数百万用户使用，而且还会由多个团队构建。因此，你的系统必须能够适应并处理更多的挑战。




  ### 6.1.1 可扩展性


  将机器学习模型投入生产的目的，是使其成为用户日常交互的应用程序的一部分。因此，它必须能够处理潜在的大量请求。


  无论是初创公司还是大型企业，运行机器学习模型都需要大量的 CPU、GPU 和内存，这意味着你必须确保系统能够支持为所有用户运行模型。


  ### 6.1.2 高可用性


  你曾经参与过以及将要参与的大多数 Web 应用程序，都期望能够 7x24 小时可用，以响应用户请求。


  如果你决定在这些系统中加入机器学习模型，那么这些模型也需要具备高可用性。


  无论你是决定更新模型、将其扩展到更广泛的用户群体，还是测试新工具，在实验过程中确保模型仍能正常运行都至关重要。


  ### 6.1.3 可观测性


  我们工作的系统非常不稳定。很多事情都可能以多种方式快速变化。用户界面会随着新功能的发布而改变，不同地理位置可能出现用户访问高峰，第三方服务商可能发生故障，等等。


  这种不稳定性意味着需要密切监控模型及其预测结果。这不仅是要验证模型能否成功生成预测，还需要定期检查输入和输出是否正确。


  ### 6.1.4 可复用性


  根据你在应用程序中构建和运行的模型，有时考虑其可复用性非常重要。


  例如，Booking.com 公司在生产环境中运行着多个模型，其中包括一个用于判断酒店是否适合家庭入住的模型。


  基于不同的标准，该模型既可以在酒店详情页中突出显示适合家庭入住的酒店，也可以在搜索结果页面中作为筛选条件。就像前端应用程序中不同的 UI 组件可以复用一样，构建模型使其能够在不同页面上复用，可以确保你最大限度地利用它们。


  创建和测试机器学习模型是一项耗时的任务，模型复用可以使这项投入更具成效。


  此外，可复用性确保了模型可以在面临类似问题的不同团队之间共享，从而避免浪费时间从头开始重新创建模型。


  现在，我们简要介绍了将机器学习模型产品化所面临的一些挑战，接下来让我们看看机器学习项目的生命周期。


  ## 6.2 机器学习生命周期


  下图是 Martin Fowler 推广的“机器学习持续交付”（CD4ML）概念的直观指南。


  在此图中，我们可以看出六个不同的阶段：


  **模型构建** 涉及理解问题、准备数据、提取特征以及编写创建模型的初始代码。


  **模型评估与实验** 涉及特征选择、超参数调优、算法比较以及针对不同解决方案进行整体实验。


  **模型产品化** 是从实验或研究阶段过渡到为部署做准备的一步。


  **测试** 侧重于确保我们即将部署到生产环境的模型和代码按预期运行，并且其结果与第二阶段（评估与实验）中观察到的结果一致。


  **部署** 是将模型投入生产环境。


  最后，**监控与可观测性** 旨在确保模型在生产环境中按预期运行。


  标准软件项目生命周期与机器学习项目的主要区别之一，在于这些阶段重复的方式。


  正如从最后一个阶段（监控与可观测性）指回第一个阶段（模型构建）的箭头所示，我们应该根据模型在生产环境中的表现所收集到的信息，来做出关于模型的决策。


  **模型应根据这些信息进行更新或弃用。**


  根据你的应用程序，模型需要定期用新数据进行重新训练，以避免过时。


  例如，像 AutoScout24 这样帮助用户在线出售车辆的平台，会使用机器学习根据品牌、生产年份和型号等参数，预测人们出售汽车的价格范围。


  如果他们不定期用真实用户数据重新训练模型，其预测很快就会过时，无法代表用户车辆在市场上的真实价值。结果，人们可能会因为价格未根据当前市场调整而低价出售车辆，或者难以售出。


  这种用新数据重新训练模型的循环可以手动或自动完成。


  此外，并非所有这些阶段都必须由同一位工程师执行。


  模型构建和实验的前两个阶段可以（并且/或者应该）由数据科学家或机器学习工程师完成。后续阶段应由 DevOps 工程师或具有将应用程序部署到生产环境经验的软件工程师负责，如下图所示。


  看到生命周期中不同部分由不同类型的工程师负责，这引出了我们接下来要讨论的机器学习系统。




  ## 6.3 机器学习系统


  在本书中，我们讨论了很多关于如何使用预训练模型和生成预测的内容；然而，机器学习系统由更多的组件构成。


  例如，如果你找不到适合你应用的预训练模型，并决定自己创建，那么你还需要考虑数据收集、验证、特征提取和监控，如下图所示。


  在生产环境中使用机器学习模型需要你设置特定的流水线。


  你的模型不仅需要被提供服务，还需要考虑如何收集新数据并重新训练模型，使其不会过时，以及监控什么和如何监控等。


  幸运的是，你不需要自己构建所有这些组件。像 TensorFlow Extended (TFX) 这样的平台提供了用于部署生产级 ML 流水线的端到端解决方案。


  TFX 包含不同的组件，可以帮助你设置机器学习流水线，例如 TensorFlow Data Validation 帮助你理解数据，TensorFlow Transform
  帮助你预处理数据并根据需要转换格式，以及 TensorFlow Serving 支持模型版本管理并确保高并发模型的高性能。


  使用此类平台的好处是，你的大部分 ML 流水线可以在一个平台上设置，从而降低设置和维护的复杂性，并且能够利用 Google 专业团队的工作成果，让你对系统的性能和可靠性更有信心。


  以下是一个典型的 TFX 流水线示例。


  为了更好地理解 TFX 的功能，让我们逐一了解这些组件：


  *   首先，**ExampleGen** 是初始输入组件，它消费外部文件并将数据导入流水线。


  *   **StatisticsGen** 负责计算数据集的统计信息，这些信息将用于生成模式。


  *   **SchemaGen** 生成包含输入数据信息的模式，例如每个特征的数据类型，或者该特征是否必须每次都存在。下图展示了一个模式可能的样子。


  *   **ExampleValidator** 用于识别训练数据中的异常。


  *   **Transform** 将实际使用 SchemaGen 组件生成的模式，对 ExampleGen 发出的数据进行特征工程，生成一个 SavedModel
  实例，供后续组件使用。


  *   **Trainer** 使用 Python TensorFlow API 来训练模型。


  *   **Tuner** 进行超参数调优，即为模型选择一组最优参数。


  *   **Evaluator** 对模型结果进行分析，确保模型适合推送到生产环境。


  *   **InfraValidator** 负责在模型服务基础设施中验证模型。它会启动一个沙盒化的模型服务器，并检查模型是否可以加载和查询。


  *   **Pusher** 是将经过验证的模型推送到部署目标的组件。


  如果这看起来有点复杂，这完全正常。正如我在本章开头提到的，我不期望任何阅读本书的人能立刻理解机器学习流水线中所需的所有组件。


  由于你不太可能需要自己搭建一个这样的流水线，这里提供这些信息主要是为了让你了解，在部署自定义模型时，设置系统所涉及的组件。


  现在我们已经简要了解了标准 TFX 流水线的样子，让我们回过头来更广泛地讨论流水线。构建流水线的必要性是什么？


  如果我们回顾本节开头的图片，创建模型的机器学习代码实际上只代表了系统的一小部分。


  其余部分由数据收集、自动化、测试、分析等元素组成，你需要将 DevOps 原则应用于 ML 系统。


  这类系统的工作方式类似于软件系统，你需要它可靠且开发周期短，但在以下方面有所不同：


  **技能多样性**：如果你在一个使用机器学习模型的生产应用上工作，你的团队可能包括数据科学家，他们需要与系统交互，但可能没有软件实践的经验或知识。你的系统必须考虑到这一点，提供
  ML 研究人员可以使用的组件。


  **模型服务**：在生产环境中服务模型似乎有三种不同的方式。可以是**嵌入式模型**，将其视为与应用程序打包在一起的依赖项；**模型即服务 (MAAS)**，将模型封装在可以独立部署和更新的单独服务中；以及**模型即数据**，模型也是独立的，但在运行时作为数据被摄入。


  **实验追踪**：机器学习模型在推送到生产环境之前会经历大量实验，导致大量代码被丢弃且从未部署。因此，追踪正在进行的各种实验以避免重复非常重要。


  **监控**：尽管标准软件项目通常也会使用监控和日志系统，但监控机器学习模型略有不同。我们不仅需要监控模型在接收到输入数据时是否生成预测，还需要使用以下指标捕获关于模型行为的数据——**模型输入**（追踪输入模型的数据）、**输出的可解释性**（理解模型如何做出预测）、模型输出本身，以及**模型公平性**（分析输出是否存在偏见）。


  **测试**：可以在机器学习工作流中引入不同类型的测试。我们可以通过查看错误率和准确率来测试模型质量，通过与生成的模式进行比较来测试数据的有效性，甚至尝试测试模型偏见和公平性。以下是机器学习系统的测试金字塔示例。


  尽管这类系统可能由基础设施团队负责，但作为开发者，你仍然应该参与设置应用程序与模型交互的方式。


  因此，你需要问自己以下问题：


  *   如何编写一个能从模型生成预测的 API？


  *   如何最好地将该 API 部署到生产环境？


  *   需要收集什么样的数据？


  *   API 应该返回什么信息？


  现在我们已经简要介绍了机器学习系统的不同组件，让我们来看看目前可用的一些工具，这些工具可以让你更轻松地在生产环境中使用机器学习。


  ## 6.4 工具


  在最后一节中，我们将快速介绍一些工具，如果你希望在生产应用中添加机器学习功能，但又不想设置复杂的系统，可以使用这些工具。




  ### 6.4.1 预训练模型


  希望你在完成本书中的项目后，已经熟悉了如何在 TensorFlow.js 中使用预训练模型。


  到目前为止，我们使用了 MobileNet 图像分类模型、PoseNet、毒性分类器、语音命令、Facemesh、Handpose 以及问答模型；不过，还有更多模型可供探索。


  事实上，如果你决定进一步探索，你会发现还存在面部地标检测模型、目标检测模型、人体分割模型等。


  然而，预训练模型并不一定需要由 TensorFlow.js 团队开发才能用于 TensorFlow.js。


  通常使用 Python 创建的 Keras 模型可以保存为不同格式，并转换为 TensorFlow.js 的 Layers 格式，以便通过该框架加载。


  因此，如果你找到一个感兴趣的开源模型，可以随时检查它是否能转换为与 TensorFlow.js 兼容的格式，以便在 JavaScript 应用程序中加载。


  ### 6.4.2 API


  为了让开发者更容易在生产应用中实现机器学习，像亚马逊、谷歌和微软这样的科技公司一直在开发以 API 形式提供的机器学习服务。


  例如，亚马逊目前拥有多个 API，用于图像和视频分析、个性化推荐、实时翻译、高级文本分析、聊天机器人和欺诈预防等服务。


  例如，亚马逊目前提供的 API 包括：


  *   **Comprehend**：用于高级文本分析

  *   **CodeGuru**：用于自动化代码审查

  *   **Lex**：用于聊天机器人

  *   **Textract**：用于文档分析

  *   **Detector**：用于欺诈预防

  *   **Recognition**：用于图像和视频分析

  *   **Polly**：用于文本转语音


  谷歌云提供的 API 包括：


  *   **Vision AI**：用于获取图像洞察、检测目标、人脸和文本

  *   **Video Intelligence API**：用于识别存储和流式视频中的目标、地点和动作

  *   **Speech-to-Text API**：用于将语音准确转换为文本


  微软则拥有一套名为认知服务的工具，其 API 包括内容审核服务、QnA Maker、说话人识别服务（可根据音频识别和验证说话人身份），以及围绕图像和文本识别的类似
  API。


  ### 6.4.3 服务平台


  最后，如果你更倾向于构建和提供自定义模型，这里有一些旨在简化此过程的工具。


  谷歌云 AI 平台、亚马逊云服务以及微软都提供了更完整的解决方案，用于部署你的自定义机器学习项目；不过，还有其他模型服务平台可供选择，例如开源项目 BentoML、Seldon
  或 KI labs 的 kaos。


  尽管团队可能倾向于依赖谷歌、微软或亚马逊的工具，但这些平台通常无法提供你在选择工具时所需的自由度。它们会优化自身产品的使用，有时还会使与其他第三方工具的集成变得复杂。


  此外，根据你的应用规模，使用这些平台可能会造成过度设计。


  总的来说，在将机器学习模型投入生产时，有多种选择。然而，由于大多数公司尚未涉足这一领域，相关标准尚未确立，并且很可能会不断演变。因此，如果你对这个领域感兴趣并想了解更多，绝对应该进行一些额外的研究和实验。


  '
- "# 7. 机器学习中的偏见\n\n在我看来，如果不提及机器学习中的偏见这个话题，这本书就不算完整。\n\n当我们赋予计算机生成预测的能力，并依赖这些预测来构建人们会与之交互的生产应用时，花时间思考使用这项技术的后果和影响至关重要。\n\
  \n在最后一章中，我们将讨论不同类型的偏见、为什么这是一个问题，以及如何在我们的机器学习系统中将其最小化。\n\n## 7.1 什么是偏见？\n\n如果我们参考牛津词典的定义，偏见是：\n\
  \n> *一种强烈支持或反对某一群体或某一方的感觉，通常并非基于公正的判断。*\n> \n> ——引用来源：[`www.oxfordlearnersdictionaries.com/definition/english/bias_1?q=bias`](http://www.oxfordlearnersdictionaries.com/definition/english/bias_1%253Fq%253Dbias)\n\
  \n在数据科学领域，可能存在不同类型的偏见，包括：\n\n*   **确认偏误**：当执行数据分析的人想要证明一个预设的假设，并故意从分析中排除特定变量，直到得出想要的结论时，就可能发生这种情况。\n\
  \n*   **选择偏误或样本偏误**：当所使用的数据样本不能很好地反映总体情况时，就会发生这种情况。\n\n*   **偏见偏误**：由受文化或其他刻板印象影响的训练数据导致的结果。例如，如果我们根据网上找到的图像训练一个算法来识别工作中的人，很多图像显示男性在编程，而女性在厨房。结果，模型会预测男性更可能是程序员，而女性是厨师，这是不正确的，并且复制了网上存在的偏见。\n\
  \n如果你不熟悉机器学习中的偏见这个话题，你可能会想知道为什么这是一个问题。\n\n人类在许多方面都存在偏见；我们可能对人或情况做出毫无根据的假设，从而导致歧视。然而，当这种偏见进入我们日常生活中使用的、旨在为我们做出决策或关于我们做出决策的产品或系统时，可能会产生不应被忽视的、可怕的广泛后果。\n\
  \n让我们看一些例子。\n\n## 7.2 机器学习中偏见的例子\n\n在接下来的几页中，我们将看两个在真实应用中使用有偏见机器学习模型的例子。\n\n###\
  \ 7.2.1 性别偏见\n\n几年前，谷歌翻译因其翻译结果揭示了算法的性别偏见而登上新闻。当将一些土耳其语单词翻译成英语时，土耳其语中涵盖所有单数第三人称的代词“o”被翻译成了英语中带有性别区分的代词，导致了以下有偏见的结果。\n\
  \n![../images/496132_1_En_7_Chapter/496132_1_En_7_Fig1_HTML.jpg](img/496132_1_En_7_Fig1_HTML.jpg)\n\
  \n图 7-1\n\n谷歌翻译显示有偏见的结果\n\n如上图所示，尽管土耳其语没有为每个术语指定特定性别，但谷歌翻译猜测了一个特定性别，导致了刻板印象，例如将“医生”一词与代词“他”匹配，将“护士”与“她”匹配。\n\
  \n谷歌现已更新其算法，通过为单个单词同时显示女性和男性的翻译，来试图防止此类偏见的发生。\n\n![../images/496132_1_En_7_Chapter/496132_1_En_7_Fig2_HTML.jpg](img/496132_1_En_7_Fig2_HTML.jpg)\n\
  \n图 7-2\n\n谷歌翻译显示包含多个代词的结果\n\n尽管这是一种改进，但错误不一定在于算法本身，而很可能是由于用于训练它的数据可能包含有偏见的信息。\n\
  \n此外，同时显示“她”和“他”代词并没有考虑到使用“他们”代词的人群，而为了达到更好的公平性，应该将其包含在内。\n\n\n\n### 7.2.2 种族偏见\n\
  \n过去几年中，有偏见的机器学习算法最具影响力的例子之一，是一款名为 COMPAS 的 AI 驱动软件。\n\n法官在法庭上使用该软件，根据对 137 项调查问题的回答，生成风险评估并预测哪些罪犯最有可能再次犯罪。\n\
  \n使用该算法的问题在于，人们发现，当它的预测出错时，对黑人和白人罪犯显示的结果是不同的。\n\n黑人罪犯被标记为高风险，即使他们再次犯罪的可能性较低；而白人罪犯被标记为低风险，即使他们再次犯罪的可能性更高。\n\
  \n![../images/496132_1_En_7_Chapter/496132_1_En_7_Fig3_HTML.jpg](img/496132_1_En_7_Fig3_HTML.jpg)\n\
  \n图 7-3\n\nCOMPAS 软件结果\n\n这种错误预测被用于司法系统本身已经是一个严重的问题，但其使用规模之大更令人担忧。\n\n考虑到美国每年监禁大量人口，人们只能想象错误定罪的数量之多。\n\
  \n此外，由于 COMPAS 背后的公司 Northpointe 拒绝披露其算法的细节，研究人员无法评估其不公正的程度。\n\n以上只是机器学习算法中可能引入偏见的两个例子。不幸的是，还有更多此类情况，我建议深入探讨这个主题。\n\
  \n## 7.3 潜在解决方案\n\n尽管机器学习中的偏见无法完全根除，但仍有一些方法可以将其最小化。\n\n### 7.3.1 界定问题\n\n在构建模型和生成预测之前，数据科学家需要确定他们试图解决什么问题。正是在这个阶段，就可能发现一些偏见。如果你正在为一家希望自动评估人们“信用度”的信贷公司构建模型，那么关于“值得获得信贷的人”的定义本身，就可能已经包含了某些不公和歧视。\n\
  \n例如，一家公司可以决定要最大化其利润率，这意味着信用度将基于客户的富裕程度，因为他们可能会申请更大的贷款。或者，它也可以决定更侧重于最大化贷款合同的数量，无论客户是否负担得起。\n\
  \n总的来说，问题在于这些决策是出于商业目标，而非公平性，尽管它们最终会以多种方式影响真实的人。\n\n如果算法预测发放次级贷款是最大化利润的有效方式，那么即使这不是公司的直接意图，它最终也会陷入掠夺性行为。\n\
  \n### 7.3.2 收集数据\n\n这可能是偏见进入机器学习模型更常见的例子，并且可能以两种方式出现。\n\n#### 对现实的不正确呈现\n\n你可能听说过这样的案例：收集的数据不能代表现实，导致机器学习模型产生错误的预测。\n\
  \n例如，在人脸识别中，如果算法训练时使用的浅肤色人脸图像多于深肤色人脸图像，那么生成的模型必然更擅长识别浅肤色人脸。\n\n为了尝试防止这种歧视，在将数据输入算法之前对其进行分析，可以让你了解其质量以及生成更公平预测的潜力。\n\
  \n通常，如果你决定使用预训练模型，应该有一个文档化的链接供你查看所使用的数据集。如果找不到，我会向分享该模型的公司或个人索取。\n\n如果你无法验证数据的质量，我建议寻找其他模型。\n\
  \n如果你找到了原始数据集，并注意到它缺乏多样性，不能很好地代表现实，你可以选择不使用基于这些数据训练的模型，或者你也可以选择利用它，收集一些额外的、更多样化的数据，并应用迁移学习来生成一个新的、偏见更少的模型，用于你的应用程序。\n\
  \n如果你选择自己收集数据，而不是依赖现有模型，我建议你首先分析在你的特定情况下多样性意味着什么，你的模型要解决什么问题，它将用于哪些人群，你计划使用哪些来源来收集数据，这些来源是否能代表现实，等等。\n\
  \n分析工作对于尽早发现潜在问题或担忧，并构建一个能最大限度减少偏见持续存在的模型至关重要。\n\n#### 反映现有偏见\n\n收集数据时的第二个问题在于使用了包含现有偏见的数据。\n\
  \n一些公司使用其内部的历史数据来训练机器学习模型，以实现任务自动化。\n\n例如，在几年前（2018 年），亚马逊意识到其内部的 AI 招聘工具对女性存在偏见。\n\
  \n他们使用过去 10 年收集的求职申请数据，对新候选人进行 0 到 5 星的评分。然而，由于亚马逊雇佣的大多数人是男性，模型推断出男性候选人更受青睐。\n\n\
  通过查看历史招聘数据并分析数千份简历，该模型的逻辑是亚马逊不喜欢简历中出现“女性”这个词。\n\n结果，任何包含这个词的简历，例如“女子队队长”或“就读于女子学院”，其评分都低于未提及该词的简历。\n\
  \n尽管这在 2018 年成为了新闻，但亚马逊早在 2015 年就意识到其新系统并非以性别中立的方式对候选人进行评分。\n\n防止此类歧视的一种方法与前面章节相关，即分析你正在使用的数据。数据是内部的并不意味着它没有偏见。然而，考虑到这些数据是过去\
  \ 10 年收集的，我们同意手动分析的数据量可能太大。我仍然建议收集一组随机样本，并让人们评估其公平性和多样性。\n\n此外，当使用模型执行像招聘这样重要的任务时，我希望在使用之前已经对模型进行了一些测试。招聘中的偏见是一个众所周知的问题，并且可能以多种形式出现。因此，如果你决定构建或使用依赖机器学习的招聘软件，我建议针对不同的偏见进行测试，从性别到教育背景，再到种族等等。\n\
  \n\n\n### 7.3.3 数据准备\n\n另一个可能引入偏见的地方是数据准备阶段。即使你已经分析过数据，并确保其具有多样性且能反映实际应用环境的真实情况，准备阶段同样需要关注。\n\
  \n这一阶段涉及选择你希望算法在学习与生成预测时考虑的属性，与其说是一门科学，不如说更像一门艺术。\n\n通常，需要对属性和参数进行一些实验来微调模型。\n\n\
  然而，你也需要确保在追求高准确率的同时不会引入偏见。虽然调整属性对准确率的影响是可衡量的，但对偏见的影响却并非如此。\n\n以亚马逊的招聘工具为例，属性可能包括候选人的性别、教育水平、工作年限、编程语言、地理位置等。\n\
  \n例如，在招聘工程师时，一个人的性别根本不应成为考量因素，因此应将其排除在模型训练属性之外。\n\n一个人的地理位置只有在公司无法提供签证赞助以支持其搬迁时才有意义。\n\
  \n因此，为了最大限度地实现公平，用于对候选人进行排名的模型应考虑影响其技能水平的属性，包括工作年限和编程语言。\n\n它也可以使用教育水平，但这可能会对有机会接受高等教育的人产生偏见。\n\
  \n在科技行业，许多非常优秀的开发者并没有走计算机科学学位这条路，因此将教育水平作为属性可能会导致这些人排名较低，而实际上他们拥有合适的技能，会成为出色的员工。\n\
  \n希望这个例子能说明数据准备阶段的重要性，无论你是否已经花时间确保所使用的数据集具有多样性。\n\n### 7.3.4 团队多样性\n\n最后，减少机器学习中的偏见也取决于开发模型的团队构成。\n\
  \n我们每个人都有偏见，而弥补多样性不足的一个有效方法就是提高团队的多样性。\n\n你可以想象，如果开发人脸识别模型的团队中有更多非白人成员，那么该模型中发现的问题本可以避免。\n\
  \n这不仅有助于测试模型的预测结果，确保其在多样化的面孔中保持高准确率，还能改进整个流程。\n\n在之前的问题定义、数据收集和准备阶段，拥有不同背景、生活经历等的人将带来益处。潜在问题可以及早提出，并在追求高准确率的同时，影响更公平模型的开发。\n\
  \n这不仅是伦理挑战，也是技术挑战。一个人脸识别模型如果主要对浅肤色人群准确，那它到底有多好？如果机器学习的目标是开发具有最高准确率的模型，那么真正的技术挑战在于在多样化的样本中实现高准确率。\n\
  \n## 7.4 挑战\n\n不幸的是，尽管上一节提到了一些减少机器学习偏见的潜在解决方案，但这个问题很难解决，并且可能仍会持续存在一段时间。\n\n在本节中，我们将探讨减少偏见所面临的几个挑战。\n\
  \n**未知因素**\n\n偏见是在系统的哪个环节引入的，有时并不明确。即使你使用了多样化的数据集，并确保使用的属性不会改变预测的公平性，有时也很难理解模型是如何得出某个结果的。\n\
  \n以亚马逊及其存在性别偏见的招聘工具为例，一旦他们意识到模型会通过“女性”等词语来降低候选人排名，他们就更新了模型以忽略明确的性别词汇；然而，这还不够。他们后来发现，更新后的系统仍然会捕捉到男性简历中更常见的隐含性别词汇，例如“执行”和“捕获”，并据此做出决策。\n\
  \n**公平是相对的**\n\n机器学习偏见方面的另一个挑战是，并非所有人都认同什么是公平或不公平。不幸的是，在人工智能领域，技术方面的工作比伦理方面的工作要多，因此在设计合乎伦理的人工智能应用时，目前还没有真正的标准、法规和政策。\n\
  \n像谷歌这样的公司正在分享他们在开发人工智能解决方案时的原则，其他公司也可以决定采纳；然而，这些不应被视为法规。例如，到目前为止，谷歌的人工智能原则包括以下针对人工智能应用的目标：\n\
  \n*   对社会有益\n*   避免制造或强化不公平的偏见\n*   为安全而构建和测试\n*   对人们负责\n*   融入隐私设计原则\n*   坚持高标准的科学卓越性\n\
  *   其用途应符合这些原则\n\n尽管这是一个好的开端，但我们希望政府能尽快出台关于机器学习模型开发和使用以及如何评估其公平性的真正法规，这样我们才有希望避免有偏见的系统被广泛部署。\n\
  \n在本章中，我们简要介绍了一些存在偏见的机器学习模型被使用的例子及其后果，以及一些可能的解决方案。\n\n如果你有兴趣了解更多关于这个话题的内容，我强烈推荐你阅读凯西·奥尼尔的《数学杀伤性武器》和萨菲亚·诺布尔的《算法压迫》，作者在这些书中更深入地探讨了这个引人入胜的主题。\n\
