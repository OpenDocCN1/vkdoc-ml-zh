  \n\n\n### 5.2.3 PoseNet\n\n最后，我们要介绍的最后一个身体追踪模型叫做 PoseNet。\n\nPoseNet 是一个姿态检测模型，可以估计图像或视频中的单一人体姿态或多个人体姿态。\n\
  \n与 Facemesh 和 Handpose 模型类似，PoseNet 追踪用户身体关键点的位置。\n\n以下是这些关键点可视化的示例。\n\n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig48_HTML.jpg](img/496132_1_En_5_Fig48_HTML.jpg)\n\
  \n图 5-48\n\nPoseNet 检测到的关键点可视化。来源：[`https://github.com/tensorflow/tfjs-models/tree/master/posenet`](https://github.com/tensorflow/tfjs-models/tree/master/posenet)\n\
  \n该身体追踪模型可以检测 17 个关键点及其二维坐标，并通过部位 ID 进行索引。\n\n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig49_HTML.jpg](img/496132_1_En_5_Fig49_HTML.jpg)\n\
  \n图 5-49\n\n关键点列表及其 ID。来源：[`https://github.com/tensorflow/tfjs-models/tree/master/posenet`](https://github.com/tensorflow/tfjs-models/tree/master/posenet)\n\
  \n尽管该模型也专门用于通过网络摄像头输入追踪人体，但在代码中使用它的方式与我们之前章节介绍的两个模型略有不同。\n\n#### 导入和加载模型\n\n导入和加载模型的方式与本书中大多数代码示例遵循相同的标准。\n\
  \n```\nconst net = await posenet.load();\n代码清单 5-42\n在 JavaScript 中加载模型\n```\n\n\
  ```\n\n代码清单 5-41\n在 HTML 中导入 TensorFlow.js 和 PoseNet 模型\n```\n\n这种加载 PoseNet 的默认方式使用了一个基于\
  \ MobileNetV1 架构的更快、更小的模型。速度提升的代价是精度降低。\n\n如果你想尝试调整参数，也可以这样加载模型。\n\n```\nconst net\
  \ = await posenet.load({\narchitecture: 'MobileNetV1',\noutputStride: 16,\ninputResolution:\
