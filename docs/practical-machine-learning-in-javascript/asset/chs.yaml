  \n***代码清单 4-36.*** 完整的 JavaScript 代码\n\n在我们刚刚浏览的代码示例中，问题是通过用户必须手动输入的输入字段捕获的。然而，还有其他方法可以使用另一个\
  \ Web API 来获取相同类型的信息。\n\n在我们刚刚浏览的代码示例中，问题是通过用户必须手动输入的输入字段捕获的。然而，还有其他方法可以使用另一个 Web\
  \ API 来获取相同类型的信息。\n\n\n\n##### 从 Web Speech API 获取输入数据\n\n要让这个项目更具交互性，一种方法是允许人们通过语音提问，而不是在键盘上打字。\n\
  \n支持语音识别的 Web API 是 Web Speech API。使用这个 API，我们可以为项目添加语音转文字功能，甚至如果需要答案也被朗读出来，还可以通过\
  \ SpeechSynthesis 添加文字转语音功能。\n\n添加此功能所需的代码量相对较少。考虑到我们已经完成了应用程序的核心部分，它只会影响捕获用户输入的部分。\n\
  \n要开始使用 Web Speech API，你需要在 JavaScript 文件中包含以下几行代码。\n\n```\nvar SpeechRecognition\
  \ = SpeechRecognition || webkitSpeechRecognition;\nvar SpeechRecognitionEvent =\
  \ SpeechRecognitionEvent || webkitSpeechRecognitionEvent;\n清单 4-37\n使用 Web Speech\
  \ API 的初始设置\n```\n\n这些代码行将允许你访问语音识别接口。\n\n然后，要开始使用这个接口，你需要使用以下代码创建一个语音识别实例。\n\n\
  ```\nconst recognition = new SpeechRecognition();\n清单 4-38\n实例化一个新的 SpeechRecognition\
  \ 实例\n```\n\n在开始识别之前，你可以在识别实例上设置一些参数。就我个人而言，我设置了以下参数。\n\n```\nrecognition.continuous\
  \ = false;\nrecognition.lang = \"en-US\";\nrecognition.interimResults = false;\n\
  清单 4-39\n可选参数\n```\n\n第一个参数表示监听和识别不是连续的，这意味着每次你想听取用户的提问时，都需要用户进行交互。将其设置为 `false`\
  \ 允许你仅在用户想要与界面交互时才进行监听，而不是持续不断地监听。\n\n第二个设置是请求识别的语言。如果未设置，它将默认使用 HTML 文档根元素中 `lang`\
  \ 属性定义的语言。\n\n目前，可用于 SpeechRecognition API 的语言列表包括\n\n![../images/496132_1_En_4_Chapter/496132_1_En_4_Figf_HTML.gif](img/496132_1_En_4_Figf_HTML.gif)![../images/496132_1_En_4_Chapter/496132_1_En_4_Figg_HTML.gif](img/496132_1_En_4_Figg_HTML.gif)![../images/496132_1_En_4_Chapter/496132_1_En_4_Figh_HTML.gif](img/496132_1_En_4_Figh_HTML.gif)![../images/496132_1_En_4_Chapter/496132_1_En_4_Figi_HTML.gif](img/496132_1_En_4_Figi_HTML.gif)\n\
  \n最后，第三个设置 `interimResults` 设置为 `false` 表示我只对获取识别的最终结果感兴趣，而不是我说话时的所有中间结果。\n\n设置完这些属性后，我们可以使用\
  \ `recognition.start()` 开始识别。\n\n如果你尚未在网页上启用麦克风，系统会提示你启用，否则麦克风将开始监听输入。\n\n要访问识别结果，你需要调用\
  \ `onresult` 方法，如下所示。\n\n```\nrecognition.onresult = function (event) {\nif (event.results[0][0]){\n\
  var result = event.results[0][0].transcript;\n}\nconsole.log(\"result\", result);\n\
  };\n清单 4-40\n从 Web Speech API 获取结果\n```\n\n调用 `onresult` 会返回一个回调函数，其中包含一个具有以下结构的事件对象。\n\
  \n![../images/496132_1_En_4_Chapter/496132_1_En_4_Fig17_HTML.jpg](img/496132_1_En_4_Fig17_HTML.jpg)\n\
  \n图 4-17\n\n调用 onresult 方法的输出\n\n查看这个输出有助于理解我们在前面代码示例中设置 `result` 变量的方式：`event.results[0][0].transcript`。\n\
  \n另一个我们可以调用的有用方法是 `onspeechend`。\n\n**onspeechend** 在检测到语音停止时触发。为了避免在不必要时运行识别，我们可以使用\
  \ `onspeechend` 来完全停止识别。\n\n```\nrecognition.onspeechend = function () {\nrecognition.stop();\n\
  };\n清单 4-41\n当 API 检测到用户已停止说话时停止识别的代码示例\n```\n\n综合起来，语音识别的代码示例如下：\n\n```\nvar SpeechRecognition\
  \ = SpeechRecognition || webkitSpeechRecognition;\nvar SpeechRecognitionEvent =\n\
  SpeechRecognitionEvent || webkitSpeechRecognitionEvent;\nvar recognition = new SpeechRecognition();\n\
  const startSpeechRecognition = () => {\nrecognition.continuous = false;\nrecognition.lang\
  \ = \"en-US\";\nrecognition.interimResults = false;\nrecognition.onspeechend = ()\
  \ => recognition.stop();\nrecognition.onresult = function (event) {\nif (event.results[0][0])\
  \ var result = event.results[0][0].transcript;\nconsole.log(\"result\", result);\n\
  };\nrecognition.start();\n};\nstartSpeechRecognition();\n```\n\n仅用 20 行 JavaScript\
  \ 代码，一个 Web 应用程序就可以监听用户的语音命令！\n\n如果你想将其添加到我们之前构建的项目中，可以在我们为“提问”按钮添加点击事件监听器的地方实现。\n\
  \n你可以点击按钮时触发语音识别，监听用户的语音输入，并将其输入到模型中，而不是使用输入字段中写入的输入，就像我们发送书面输入字符串一样。\n\n假设你已经从之前的代码示例中添加了\
  \ SpeechRecognition 实例的基本设置，那么你需要对项目代码进行的唯一更改就是在监听 `askButton` 元素点击事件的函数中。\n\n```\n\
  askButton.onclick = async () => {\nrecognition.start();\nrecognition.onresult =\
  \ async (event) => {\nif (event.results[0][0]) {\nvar result = event.results[0][0].transcript;\n\
  }\ninputQuestion = result;\nconst answers = await model.findAnswers(inputQuestion,\
  \ figureData);\ndisplayAnswer(answers);\ndocument.getElementsByTagName(\"input\"\
  )[0].value = \"\";\n};\n};\n清单 4-42\n使用 QNA 模型的用户语音命令\n```\n\n当用户点击按钮时，此代码启动语音识别，并在获得结果时，将最终转录文本存储在\
  \ `inputQuestion` 变量中。这个变量在项目的原始代码中已经被发送到 `findAnswers` 方法，但现在它包含了来自用户语音命令的输入。\n\
  \n需要对 UI 进行一些更改以反映此功能变化（例如，输入字段可能不再需要），但总的来说，从书面输入到语音输入所需的更改只需几行代码！\n\n最后，如果你想更进一步，让输出在屏幕上显示的同时还能被朗读给用户听，你可以使用以下三行代码来实现。\n\
  \n```\nlet speechSynth = window.speechSynthesis;\nvar result = new SpeechSynthesisUtterance(answers[0].text);\n\
  speechSynth.speak(result);\n清单 4-43\n使用 SpeechSynthesis Web API 将输出预测朗读出来的代码示例\n\
  ```\n\n这三行代码创建了一个 `speechSynthesis` 实例，执行一个传递模型答案的语音请求，并调用 `speak` 方法让语音服务将信息朗读出来。\n\
  \n默认的语音听起来相当机械，但可以设置一些参数来改变这一点。我在这里不详细说明，但请随意查阅 MDN Web 文档中关于 Web Speech API 的更多信息。\n\
  \n如果你想进一步探索这个 API，最后要记住的一点是，**浏览器支持并非 100%**。目前，它在 Chrome 和 Edge 上支持良好，但在 Safari\
  \ 和 Firefox 上则不然。\n\n尽管它仍然相当实验性，但如果你感兴趣，我鼓励你去研究一下。\n\n本章包含了很多信息。\n\n\n\n我们探讨了自然语言处理的基础知识、不同类型的文本分类工具、各种应用场景，以及如何使用\
  \ TensorFlow.js 实现情感分析、毒性分类和问答系统，还尝试了通过语音命令获取文本数据来运行预测。\n\n如果这是你第一次接触机器学习，这些信息量可能会让你感到有些不知所措。然而，正如任何新事物都需要时间去理解一样，你可以随时休息一下，如果想的话，稍后再回来阅读本章。\n\
  \n下一章将深入探讨如何将机器学习应用于其他类型的数据输入。\n\n"
- "# 5. 输入数据实验\n\n在前几章中，我们探讨了如何将机器学习与图像和文本数据结合，用于目标检测与分类，以及情感分析、毒性分类和问答系统。\n\n这些可能是机器学习最常见的应用示例。然而，这个列表并不详尽，还有更多类型的输入数据可以使用。\n\
  \n在本章中，我们将探索不同类型的数据输入，并构建几个实验性项目，以理解如何将机器学习应用于音频和硬件数据，以及使用专注于身体和动作识别的模型。\n\n## 5.1\
  \ 音频数据\n\n当你第一次读到“音频数据”这个词时，你可能会认为本书的这一部分将专注于音乐；然而，我将更广泛地探讨声音的使用。\n\n我们通常不会经常思考这一点，但我们周围有很多东西会发出声音，这些声音为我们提供了关于环境背景的信息。\n\
  \n例如，雷声能让你无需看窗外就知道天气可能不好，或者你可以在看到飞机之前就识别出它飞过的声音，甚至听到海浪声表明你可能靠近海洋，等等。\n\n在不知不觉中，识别和理解这些声音的含义影响着我们的日常生活和行动。听到敲门声表明可能有人在门外等你开门，或者做饭时听到水沸腾的声音表明水已经准备好让你往里面倒东西了。\n\
  \n利用声音数据和机器学习可以帮助我们利用声音的丰富特性来识别某些人类活动，并增强现有的智能系统，如 Siri、Alexa 等。\n\n这就是所谓的**声学活动识别**。\n\
  \n考虑到我们周围许多设备都配备了麦克风，这项技术有着广阔的应用前景。\n\n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig1_HTML.jpg](img/496132_1_En_5_Fig1_HTML.jpg)\n\
  \n图 5-1\n\n配备麦克风的个人设备示意图\n\n到目前为止，我们中有些人可能正在使用的智能系统能够识别单词来触发命令，但它们对周围发生的事情一无所知；你的手机不知道你在浴室里，你的\
  \ Alexa 设备不知道你可能在厨房里，等等。然而，它们本可以做到这一点，并且这可以用来创造更个性化、更有用的数字体验。\n\n在我们深入本章的实践部分，并了解如何使用\
  \ TensorFlow.js 在 JavaScript 中构建此类系统之前，先了解声音的基本原理以及它如何被转换成我们可以在代码中使用的数据，会很有帮助。\n\
  \n### 5.1.1 什么是声音？\n\n声音是空气分子的振动。\n\n如果你曾经把扬声器的音量开得很大，你可能会注意到它们会随着音乐来回移动。这种运动推动空气粒子，改变气压，从而产生声波。\n\
  \n说话时也会发生同样的现象。当你说话时，你的声带振动，扰动周围的空气分子，改变气压，从而产生声波。\n\n下图可以说明这一现象。\n\n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig2_HTML.jpg](img/496132_1_En_5_Fig2_HTML.jpg)\n\
  \n图 5-2\n\n声波工作原理示意图。来源：[`www.researchgate.net/figure/Sound-as-a-pressure-wave-The-peaks-represent-times-when-air-molecules-are-clustered_fig2_215646583`](http://www.researchgate.net/figure/Sound-as-a-pressure-wave-The-peaks-represent-times-when-air-molecules-are-clustered_fig2_215646583)\n\
  \n当你敲击音叉时，它会开始振动。这种来回运动将改变周围的气压。向前运动会产生高压，向后运动则会产生低压区域。这种运动的重复会产生波。\n\n在接收端，我们的耳膜随着气压的变化而振动，这种振动随后被转换成电信号发送到大脑。\n\
  \n那么，如果声音是气压的变化，我们如何将声波转换成可以在设备上使用的数据呢？\n\n为了能够解释声音数据，我们的设备使用麦克风。\n\n存在不同类型的麦克风，但总的来说，这些设备都有一个振膜或薄膜，当受到声波引起的气压变化时，它会振动。\n\
  \n这些振动会移动麦克风内部线圈附近的磁铁，从而产生微小的电流。然后，你的计算机会将这个信号转换成代表音量和频率的数字。\n\n\n\n### 5.1.2 访问音频数据\n\
  \n在 JavaScript 中，允许开发者访问计算机麦克风数据的 Web API 是 **Web Audio API**。\n\n如果你从未使用过此 API，完全没关系；我们将介绍你需要设置好一切的主要步骤。\n\
  \n首先，我们需要访问全局 `window` 对象上的 `AudioContext` 接口，并确保能够通过 `getUserMedia` 获取访问音频和视频输入设备的权限。\n\
  \n```\nwindow.AudioContext = window.AudioContext || window.webkitAudioContext;\n\
  navigator.getUserMedia = navigator.getUserMedia || navigator.webkitGetUserMedia;\n\
  清单 5-1\n在 JavaScript 中设置使用 Web Audio API\n```\n\n这段代码示例考虑了跨浏览器兼容性。\n\n然后，要开始监听来自麦克风的输入，我们需要等待用户在页面上的操作，例如点击。\n\
  \n一旦用户与网页交互，我们就可以实例化一个音频上下文，允许访问计算机的音频输入设备，并使用一些 Web Audio API 内置方法来创建音源和分析器，并将两者连接起来以开始获取数据。\n\
  \n```\ndocument.body.onclick = async () => {\nconst audioctx = new window.AudioContext();\n\
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });\nconst\
  \ source = audioctx.createMediaStreamSource(stream);\nanalyser = audioctx.createAnalyser();\n\
  analyser.smoothingTimeConstant = 0;\nsource.connect(analyser);\nanalyser.fftSize\
  \ = 1024;\ngetAudioData();\n};\n清单 5-2\n在点击时设置音频上下文的 JavaScript 代码示例\n```\n\n在上面的代码示例中，我们使用\
  \ `navigator.mediaDevices.getUserMedia` 来获取麦克风的访问权限。如果你之前构建过使用音频或视频输入设备的应用程序，你可能对编写\
  \ `navigator.getUserMedia()` 很熟悉；然而，这已被弃用，你现在应该使用 `navigator.mediaDevices.getUserMedia()`。\n\
  \n使用旧方式编写仍然有效，但不推荐，因为它可能在未来几年内不再被支持。\n\n基本设置完成后，`getAudioData` 函数会过滤来自设备的原始数据，仅获取频率数据。\n\
  \n```\nconst getAudioData = () => {\nconst freqdata = new Uint8Array(analyser.frequencyBinCount);\n\
  analyser.getByteFrequencyData(freqdata);\nconsole.log(freqdata);\nrequestAnimationFrame(getAudioData);\n\
  };\n清单 5-3\n过滤原始数据以获取我们将使用的频率数据的函数\n```\n\n我们还调用了 `requestAnimationFrame` 来持续调用此函数，并用实时数据更新我们记录的数据。\n\
  \n总而言之，你可以在不到 25 行 JavaScript 代码中访问来自麦克风的实时数据！\n\n```\nwindow.AudioContext = window.AudioContext\
  \ || window.webkitAudioContext;\nnavigator.getUserMedia = navigator.getUserMedia\
  \ || navigator.webkitGetUserMedia;\nlet analyser;\ndocument.body.onclick = async\
  \ () => {\nconst audioctx = new window.AudioContext();\nconst stream = await navigator.mediaDevices.getUserMedia({\
  \ audio: true });\nconst source = audioctx.createMediaStreamSource(stream);\nanalyser\
  \ = audioctx.createAnalyser();\nanalyser.smoothingTimeConstant = 0;\nsource.connect(analyser);\n\
  analyser.fftSize = 1024;\ngetAudioData();\n};\nconst getAudioData = () => {\nconst\
  \ freqdata = new Uint8Array(analyser.frequencyBinCount);\nanalyser.getByteFrequencyData(freqdata);\n\
  console.log(freqdata);\nrequestAnimationFrame(getAudioData);\n};\n清单 5-4\n在 JavaScript\
  \ 中从麦克风获取输入数据的完整代码示例\n```\n\n这段代码的输出是一个我们记录在浏览器控制台中的原始数据数组。\n\n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig3_HTML.jpg](img/496132_1_En_5_Fig3_HTML.jpg)\n\
  \n图 5-3\n\n上述代码示例返回的数据截图\n\n这些数组代表了构成计算机麦克风所录制声音的频率。默认采样率为 44,100Hz，这意味着我们每秒获得约\
  \ 44,000 个数据样本。\n\n在之前展示的格式（整数数组）中，寻找模式以识别某种活动类型似乎相当困难。我们实际上无法区分说话、大笑、播放音乐等之间的差异。\n\
  \n为了帮助理解这些原始频率数据，我们可以将其转化为可视化内容。\n\n\n\n### 5.1.3 音频数据可视化\n\n声音的可视化有多种方式。你可能熟悉的两种方式是波形图或频率图。\n\
  \n波形可视化器表示声波随时间变化的位移。\n\n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig4_HTML.jpg](img/496132_1_En_5_Fig4_HTML.jpg)\n\
  \n图 5-4\n\n波形可视化示意图。来源：[*https://css-tricks.com/making-an-audio-waveform-visualizer-with-vanilla-javascript/*](https://css-tricks.com/making-an-audio-waveform-visualizer-with-vanilla-javascript/)\n\
  \nx 轴（水平轴）是时间单位，y 轴（垂直轴）是频率。声音在特定时间段内发生，并由多个频率组成。\n\n这种声音可视化方式过于简单，难以识别模式。正如你在上图中看到的，构成声音的所有频率都被缩减为一条单线。\n\
  \n频率图是一种可视化方式，它表示波形在给定时间内重复的次数。\n\n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig5_HTML.jpg](img/496132_1_En_5_Fig5_HTML.jpg)\n\
  \n图 5-5\n\n频率图可视化示意图\n\n你可能对这种音频可视化方式很熟悉，因为它可能是最常见的一种。\n\n这种可视化方式或许能让你对节拍有所了解，因为它能显示重复次数，或者通过\
  \ y 轴显示音量来了解声音的响度，但也仅此而已。\n\n这种可视化方式无法提供足够的信息来识别和分类我们正在可视化的声音。\n\n另一种更有用的可视化类型称为**声谱图**。\n\
  \n声谱图就像声音的图片。它显示了构成声音的频率从低到高的变化，以及它们如何随时间变化。它是信号频谱的可视化表示，有点像声音的热力图。\n\n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig6_HTML.jpg](img/496132_1_En_5_Fig6_HTML.jpg)\n\
  \n图 5-6\n\n声谱图示意图\n\ny 轴是频率范围，x 轴是时间长度。这些轴看起来与我们之前提到的另外两种可视化类型相似，但不同的是，我们不再将所有频率表示为一条单线，而是表示整个频谱。\n\
  \n在声谱图中，第三个轴也很有用，即**振幅**。声音的振幅可以理解为音量。颜色越亮，声音越响。\n\n将声音可视化为声谱图，对于寻找有助于我们识别和分类声音的模式要有效得多。\n\
  \n例如，下面是我说话时声谱图输出的截图。\n\n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig7_HTML.jpg](img/496132_1_En_5_Fig7_HTML.jpg)\n\
  \n图 5-7\n\n说话时拍摄的声谱图示意图\n\n仅凭这一点，可能还无法让你理解为什么声谱图是更有用的可视化方式。下面是我拍手三次时拍摄的另一张声谱图截图。\n\
  \n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig8_HTML.jpg](img/496132_1_En_5_Fig8_HTML.jpg)\n\
  \n图 5-8\n\n拍手三次时拍摄的声谱图示意图\n\n希望这开始变得更有意义了！如果你比较这两张声谱图，可以清楚地区分两种活动：说话和拍手。\n\n如果你愿意，可以尝试可视化更多声音，比如咳嗽声、电话铃声、马桶冲水声等等。\n\
  \n总的来说，主要结论是：声谱图帮助我们更清晰地看到各种声音的特征，并区分不同的活动。\n\n如果我们能通过查看声谱图截图做出这种区分，那么我们有理由相信，将这些数据用于机器学习算法，也能在寻找模式和分类这些声音方面发挥作用，从而构建一个活动分类器。\n\
  \n一个更广泛的利用声谱图进行活动分类的例子，来自美国卡内基梅隆大学发表的一篇研究论文。在他们题为“Ubicoustics: Plug-and-Play Acoustic\
  \ Activity Recognition”（无处不在的声学：即插即用的声学活动识别）的论文中，他们为从使用电锯到附近车辆行驶等各种活动创建了声谱图。\n\n\
  ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig9_HTML.jpg](img/496132_1_En_5_Fig9_HTML.jpg)\n\
  \n图 5-9\n\n卡内基梅隆大学研究中收集的声谱图。来源：[*http://www.gierad.com/projects/ubicoustics/*](http://www.gierad.com/projects/ubicoustics/)\n\
  \n因此，在深入探讨将声音与机器学习结合使用之前，我们先来了解一下如何将使用 Web Audio API 记录在控制台中的麦克风实时数据转换为声谱图。\n\n\n\
  \n#### 创建频谱图\n\n在我们之前编写的代码示例中，我们创建了一个 `getAudioData` 函数，该函数从原始数据中获取频率数据，并将其记录到浏览器的控制台中。\n\
  \n```\nconst getAudioData = () => {\nconst freqdata = new Uint8Array(analyser.frequencyBinCount);\n\
  analyser.getByteFrequencyData(freqdata);\nconsole.log(freqdata);\nrequestAnimationFrame(getAudioData);\n\
  };\n清单 5-5\n从原始数据中获取频率数据的 getAudioData 函数\n```\n\n在我们编写 `console.log` 语句的位置，我们将添加用于创建可视化的代码。\n\
  \n为此，我们将使用 Canvas API，因此我们需要先在 HTML 文件中添加一个 canvas 元素，如下所示。\n\n```\n清单 5-6\n在 HTML\
  \ 文件中添加 canvas 元素\n```\n\n在我们的 JavaScript 中，我们将能够访问这个元素，并使用 Canvas API 中的一些方法来绘制我们的可视化。\n\
  \n```\nvar canvas = document.getElementById(\"canvas\");\nvar ctx = canvas.getContext(\"\
  2d\");\n清单 5-7\n在 JavaScript 中获取 canvas 元素及其上下文\n```\n\n此可视化的主要概念是绘制随时间变化的频谱，因此我们需要获取当前的\
  \ canvas，并在每次获取到新的实时数据时重新绘制它。\n\n```\nimagedata = ctx.getImageData(1, 0, canvas.width\
  \ - 1, canvas.height);\nctx.putImageData(imagedata, 0, 0);\n清单 5-8\n从 canvas 元素获取图像数据并重新绘制\n\
  ```\n\n然后，我们需要遍历从 Web Audio API 获取的频率数据，并将它们绘制到 canvas 上。\n\n```\nfor (var i = 0;\
  \ i < freqdata.length; i++) {\nlet value = (2 * freqdata[i]) / 255;\nctx.beginPath();\n\
  ctx.strokeStyle = `rgba(${Math.max(0, 255 * value)}, ${Math.max(\n0,\n255 * (value\
  \ - 1)\n)}, 54, 255)`;\nctx.moveTo(canvas.width - 1, canvas.height - i * (canvas.height\
  \ / freqdata.length));\nctx.lineTo(\ncanvas.width - 1,\ncanvas.height -\n(i * (canvas.height\
  \ / freqdata.length) +\ncanvas.height / freqdata.length)\n);\nctx.stroke();\n}\n\
  清单 5-9\n遍历频率数据并将其绘制到 canvas 上\n```\n\n在这个 for 循环内部，我们使用 `beginPath` 方法来指示我们将要在 canvas\
  \ 上开始绘制某些内容。\n\n然后，我们调用 `strokeStyle` 并传入一个动态值，该值将代表用于显示声音振幅的颜色。\n\n之后，我们调用 `moveTo`\
  \ 将可视化内容向左移动 1 个像素，为在屏幕最右侧绘制新的输入数据留出空间，该绘制通过 `lineTo` 完成。\n\n最后，我们调用 `stroke` 方法来绘制线条。\n\
  \n总的来说，我们的 `getAudioData` 函数应该如下所示。\n\n```\nconst getAudioData = () => {\nfreqdata\
  \ = new Uint8Array(analyser.frequencyBinCount);\nanalyser.getByteFrequencyData(freqdata);\n\
  console.log(freqdata);\nimagedata = ctx.getImageData(1, 0, canvas.width - 1, canvas.height);\n\
  ctx.putImageData(imagedata, 0, 0);\nfor (var i = 0; i < freqdata.length; i++) {\n\
  let value = (2 * freqdata[i]) / 255;\nctx.beginPath();\nctx.strokeStyle = `rgba(${Math.max(0,\
  \ 255 * value)}, ${Math.max(\n0,\n255 * (value - 1)\n)}, 54, 255)`;\nctx.moveTo(\n\
  canvas.width - 1,\ncanvas.height - i * (canvas.height / freqdata.length)\n);\nctx.lineTo(\n\
  canvas.width - 1,\ncanvas.height -\n(i * (canvas.height / freqdata.length) +\ncanvas.height\
  \ / freqdata.length)\n);\nctx.stroke();\n}\nrequestAnimationFrame(getAudioData);\n\
  };\n清单 5-10\n完整的 getAudioData 函数\n```\n\n你可能会想，理解如何创建频谱图为什么重要。主要原因在于，它正是用于机器学习算法训练数据的内容。\n\
  \n我们不是像在浏览器控制台中记录的那样使用原始数据，而是使用生成的频谱图图片，将声音问题转化为图像问题。\n\n过去几年中，图像识别和分类技术取得了长足的进步，并且与图像数据一起使用的算法已被证明性能非常出色。\n\
  \n此外，将声音数据转化为图像意味着我们可以用更少的数据量来训练模型，从而缩短所需的时间。\n\n实际上，Web Audio API 的默认采样率是 44KHz，这意味着它每秒收集\
  \ 44,000 个数据样本。\n\n如果我们录制 2 秒的音频，单个样本就有 88,000 个数据点。\n\n可以想象，随着我们需要录制更多的样本，最终输入到机器学习算法的数据量会非常庞大，训练时间也会很长。\n\
  \n另一方面，作为图片提取的频谱图可以轻松地调整为更小的尺寸，例如最终可能只有 28x28 像素的图像，这样对于一个 2 秒的音频片段，就只对应 784 个数据点。\n\
  \n现在，我们已经介绍了如何在 JavaScript 中从麦克风访问实时数据，以及如何将其转换为频谱图可视化，从而让我们看到不同的声音如何产生视觉上不同的模式。接下来，让我们探讨如何训练一个机器学习模型来创建一个分类器。\n\
  \n\n\n### 5.1.4 训练分类器\n\n我们不会为此创建自定义机器学习算法，而是使用一个专门处理声音数据的 **Teachable Machine**\
  \ 实验。你可以在 [`https://teachablemachine.withgoogle.com/train/audio`](https://teachablemachine.withgoogle.com/train/audio)\
  \ 找到它。\n\n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig10_HTML.jpg](img/496132_1_En_5_Fig10_HTML.jpg)\n\
  \n**图 5-10**  \nTeachable Machine 界面\n\n该项目允许我们在一个界面内、在浏览器中录制声音数据样本、为其添加标签、训练机器学习算法、测试输出结果并导出模型！\n\
  \n首先，我们需要使用下图中红色高亮区域录制 20 秒的背景噪音。\n\n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig11_HTML.jpg](img/496132_1_En_5_Fig11_HTML.jpg)\n\
  \n**图 5-11**  \n背景噪音部分高亮显示的 Teachable Machine 界面\n\n然后，我们可以开始为希望模型后续识别的任何声音录制一些样本。\n\
  \n最少需要录制 8 个样本，每个样本时长 2 秒。\n\n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig12_HTML.jpg](img/496132_1_En_5_Fig12_HTML.jpg)\n\
  \n**图 5-12**  \n自定义部分高亮显示的 Teachable Machine 界面\n\n由于该实验使用迁移学习来快速重新训练一个已经用声音数据训练过的模型，我们需要使用与原始模型训练时相同的格式。\n\
  \n8 个样本是最低要求，但如果你愿意，可以录制更多样本。样本越多越好。不过，别忘了这也会影响训练所需的时间。\n\n录制好样本并添加标签后，你可以在浏览器中开始实时训练，并确保不要关闭浏览器窗口。\n\
  \n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig13_HTML.jpg](img/496132_1_En_5_Fig13_HTML.jpg)\n\
  \n**图 5-13**  \nTeachable Machine 界面 – 训练模型\n\n完成此步骤后，你应该能在实验的最后一步看到一些实时预测结果。在导出模型之前，你可以尝试重复你录制的声音来验证预测的准确性。如果觉得准确度不够，可以录制更多样本并重新开始训练。\n\
  \n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig14_HTML.jpg](img/496132_1_En_5_Fig14_HTML.jpg)\n\
  \n**图 5-14**  \nTeachable Machine 界面 – 运行实时预测\n\n如果你准备继续，可以将模型上传到 Google 的某些服务器并获得一个链接，或者下载已创建的机器学习模型。\n\
  \n如果你想更深入地了解其后台工作原理、机器学习模型是如何创建的等，我建议查看 GitHub 上的源代码！\n\n尽管我非常喜欢像 Teachable Machine\
  \ 这样的界面，因为它们能让任何人快速上手和实验，但查看源代码可以揭示一些重要的细节。例如，下图就是我如何意识到该项目使用了迁移学习。\n\n在浏览代码以了解机器学习模型是如何创建以及训练是如何进行的过程中，我注意到了以下代码片段。\n\
  \n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig15_HTML.jpg](img/496132_1_En_5_Fig15_HTML.jpg)\n\
  \n**图 5-15**  \nTeachable Machine 开源 GitHub 仓库中的代码示例\n\n在第 793 行，我们可以看到调用了 `addExample`\
  \ 方法。这与本书专门讨论图像识别的章节中使用的方法相同，当时我们利用迁移学习，用新的输入图像快速训练了一个图像分类模型。\n\n如果你决定不通过 Teachable\
  \ Machine 界面，而是自行尝试重新创建这个模型，注意到这些细节非常重要。\n\n现在我们已经完成了训练过程，可以编写代码来生成预测了。\n\n\n\n\
  ### 5.1.5 预测\n\n在开始编写代码之前，我们需要导入 TensorFlow.js 和语音指令模型。\n\n```\n清单 5-11\n在 HTML\
  \ 文件中导入 TensorFlow.js 和语音指令模型\n```\n\n正如我之前提到的，这个实验使用了迁移学习，因此我们需要导入一个已经用音频数据训练好的语音指令模型，以便更简单、更快速地入门。\n\
  \n该语音指令模型最初是为了识别和分类口语词汇（如“是”、“否”、“上”、“下”）而训练的。然而，在这里，我们将其用于活动产生的声音，因此其准确性可能不如在样本中使用口语词汇时那么高。\n\
  \n**在阅读其余代码示例之前，请确保你已从 Teachable Machine 平台下载了训练好的模型，解压缩后，将其添加到你的应用程序文件夹中。**\n\n\
  **以下代码示例将假设你的模型存储在应用程序根目录下名为 `activities-model` 的文件夹中。**\n\n总的来说，你的文件结构应该类似于这样：\n\
  \n*   activities-model/\n    *   metadata.json\n\n*   model.json\n\n*   weights.bin\n\
  \n*   index.html\n\n*   index.js\n\n在我们的 JavaScript 文件中，我们需要创建一个函数来加载模型并开始实时预测，但在此之前，我们可以创建两个变量来保存模型和元数据文件的路径。\n\
  \n```\nlet URL = \"http://localhost:8000/activities-model/\";\nconst modelURL =\
  \ `${URL}/model.json`;\nconst metadataURL = `${URL}metadata.json`;\n清单 5-12\n引用模型及其元数据的变量\n\
  ```\n\n你可能已经注意到，我在前面的代码中使用了 `localhost:8000`；不过，你可以随意更改端口，并且如果决定将应用程序发布到生产环境，请务必更新此地址。\n\
  \n然后，我们需要加载模型，并确保在继续之前模型已加载完成。\n\n```\nconst model = window.speechCommands.create(\n\
  \"BROWSER_FFT\",\nundefined,\nmodelURL,\nmetadataURL\n);\nawait model.ensureModelLoaded();\n\
  清单 5-13\n加载模型\n```\n\n模型准备就绪后，我们可以通过调用模型上的 `listen` 方法来运行实时预测。\n\n```\nmodel.listen(\n\
  (prediction) => {\npredictionCallback(prediction.scores);\n},\nmodelParameters\n\
  );\n清单 5-14\n实时预测\n```\n\n总的来说，`setupModel` 函数应该如下所示。\n\n```\nasync function setupModel(URL,\
  \ predictionCB) {\npredictionCallback = predictionCB;\nconst modelURL = `${URL}/model.json`;\n\
  const metadataURL = `${URL}metadata.json`;\nmodel = window.speechCommands.create(\n\
  \"BROWSER_FFT\",\nundefined,\nmodelURL,\nmetadataURL\n);\nawait model.ensureModelLoaded();\n\
  const modelParameters = {\ninvokeCallbackOnNoiseAndUnknown: true, // 即使只检测到背景噪音也运行\n\
  includeSpectrogram: true,\noverlapFactor: 0.5, // 每秒采样音频的频率，0.5 表示每秒两次\n};\nmodel.listen(\n\
  (prediction) => {\npredictionCallback(prediction.scores);\n},\nmodelParameters\n\
  );\n}\n清单 5-15\n完整代码示例\n```\n\n调用此函数时，每次模型有预测结果时，都会在回调中包含预测数据。\n\n```\ndocument.body.onclick\
  \ = () => {\nsetupModel(URL, (data) => {\nconsole.log(data)\n});\n}\n清单 5-16\n调用函数\n\
  ```\n\n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig16_HTML.jpg](img/496132_1_En_5_Fig16_HTML.jpg)\n\
  \n图 5-16\n\n调用函数时返回的数据示例\n\n这个包含预测结果的数组按使用的标签排序。在前面的示例中，我使用了六个不同的标签来训练模型，因此返回的每个数组都包含六个值。\n\
  \n在每个数组中，最接近 1 的值代表预测的标签。\n\n为了将预测的数据与正确的标签匹配，我们可以创建一个包含训练时所用标签的数组，并在调用 `setupModel`\
  \ 函数时使用它。\n\n```\nconst labels = [\n\"Coughing\",\n\"Phone ringing\",\n\"Speaking\"\
  ,\n\"_background_noise_\",\n];\nlet currentPrediction;\ndocument.body.onclick =\
  \ () => {\nsetupModel(URL, (data) => {\nlet maximum = Math.max(...data);\nif (maximum\
  \ > 0.7) {\nlet maxIndex = data.indexOf(maximum);\ncurrentPrediction = labels[maxIndex];\n\
  console.log(currentPrediction);\n}\n});\n}\n清单 5-17\n将分数映射到标签\n```\n\n用不到 100 行的\
  \ JavaScript 代码，我们就能够加载并运行一个可以对实时音频输入进行分类的机器学习模型！\n\n```\nlet model, predictionCallback;\n\
  let URL = \"http://localhost:8000/activities-model/\";\nconst labels = [\n\"Coughing\"\
  ,\n\"Phone ringing\",\n\"Speaking\",\n\"_background_noise_\",\n];\nlet currentPrediction,\
  \ previousPrediction;\ncurrentPrediction = previousPrediction;\ndocument.body.onclick\
  \ = () => {\nsetupModel(URL, (data) => {\nlet maximum = Math.max(...data);\nif (maximum\
  \ > 0.7) {\nlet maxIndex = data.indexOf(maximum);\ncurrentPrediction = labels[maxIndex];\n\
  console.log(currentPrediction);\n}\n});\n};\nasync function setupModel(URL, predictionCB)\
  \ {\nconst modelURL = `${URL}/model.json`;\nconst metadataURL = `${URL}metadata.json`;\n\
  model = window.speechCommands.create(\n\"BROWSER_FFT\",\nundefined,\nmodelURL,\n\
  metadataURL\n);\nawait model.ensureModelLoaded();\n// 这告诉模型在监听音频时如何运行\nconst modelParameters\
  \ = {\ninvokeCallbackOnNoiseAndUnknown: true, // 即使只检测到背景噪音也运行\nincludeSpectrogram:\
  \ true, // 让我们访问数值音频数据\noverlapFactor: 0.5, // 每秒采样音频的频率，0.5 表示每秒两次\n};\nmodel.listen(\n\
  (prediction) => {\npredictionCallback(prediction.scores);\n},\nmodelParameters\n\
  );\n}\n清单 5-18\n完整代码示例\n```\n\n### 5.1.6 迁移学习 API\n\n在上一节中，为了简单起见，我们介绍了如何使用 Teachable\
  \ Machine 实验录制声音样本并训练模型。但是，如果你想在自己的应用程序中实现此功能，并让用户自己运行相同的过程，则可以使用迁移学习 API。\n\n此\
  \ API 允许你构建自己的界面，并调用 API 端点来录制样本、训练模型以及运行实时预测。\n\n\n\n#### 录制样本\n\n让我们想象一个非常简单的网页界面，上面有几个按钮。\n\
  \n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig17_HTML.jpg](img/496132_1_En_5_Fig17_HTML.jpg)\n\
  \n图 5-17\n\n包含几个按钮元素的网页界面\n\n其中一些按钮用于收集样本数据，一个按钮用于开始训练，最后一个按钮用于触发实时预测。\n\n首先，我们需要一个包含这六个按钮的\
  \ HTML 文件，以及两个用于导入 TensorFlow.js 和语音指令模型的脚本标签。\n\n```\n\n语音识别\n\n红色\n蓝色\n绿色\n背景\n\
  训练\n预测\n\n列表 5-19\nHTML 文件\n```\n\n在 JavaScript 文件中，在能够运行这些操作之前，我们需要创建模型，确保其已加载，并向我们的模型传递一个主标签，以创建一个包含我们音频样本的集合。\n\
  \n```\nconst init = async () => {\nconst baseRecognizer = speechCommands.create(\"\
  BROWSER_FFT\");\nawait baseRecognizer.ensureModelLoaded();\ntransferRecognizer =\
  \ baseRecognizer.createTransfer(\"colors\");\n};\n列表 5-20\n设置识别器\n```\n\n然后，我们可以在按钮上添加事件监听器，以便在点击时收集样本。为此，我们需要在识别器上调用\
  \ `collectExample` 方法，并向其传递一个我们希望用于标记样本的字符串。\n\n```\nconst redButton = document.getElementById(\"\
  red\");\nredButton.onclick = async () => await transferRecognizer.collectExample(\"\
  red\");\n列表 5-21\n收集样本\n```\n\n要开始训练，我们在识别器上调用 `train` 方法。\n\n```\nconst trainButton\
  \ = document.getElementById(\"train\");\ntrainButton.onclick = async () => {\nawait\
  \ transferRecognizer.train({\nepochs: 25,\ncallback: {\nonEpochEnd: async (epoch,\
  \ logs) => {\nconsole.log(`Epoch ${epoch}: loss=${logs.loss}, accuracy=${logs.acc}`);\n\
  },\n},\n});\n};\n列表 5-22\n训练\n```\n\n最后，要在训练后对实时音频输入进行分类，我们调用 `listen` 方法。\n\n```\n\
  const predictButton = document.getElementById(\"predict\");\npredictButton.onclick\
  \ = async () => {\nawait transferRecognizer.listen(\n(result) => {\nconst words\
  \ = transferRecognizer.wordLabels();\nfor (let i = 0; i < words.length; ++i) {\n\
  console.log(`score for word '${words[i]}' = ${result.scores[i]}`);\n}\n},\n{ probabilityThreshold:\
  \ 0.75 }\n);\n};\n列表 5-23\n预测\n```\n\n总而言之，这个代码示例看起来如下所示。\n\n```\nlet transferRecognizer;\n\
  const init = async () => {\nconst baseRecognizer = speechCommands.create(\"BROWSER_FFT\"\
  );\nawait baseRecognizer.ensureModelLoaded();\ntransferRecognizer = baseRecognizer.createTransfer(\"\
  colors\");\n};\ninit();\nconst redButton = document.getElementById(\"red\");\nconst\
  \ backgroundButton = document.getElementById(\"background\");\nconst trainButton\
  \ = document.getElementById(\"train\");\nconst predictButton = document.getElementById(\"\
  predict\");\nredButton.onclick = async () => await transferRecognizer.collectExample(\"\
  red\");\nbackgroundButton.onclick = async () =>\nawait transferRecognizer.collectExample(\"\
  _background_noise_\");\ntrainButton.onclick = async () => {\nawait transferRecognizer.train({\n\
  epochs: 25,\ncallback: {\nonEpochEnd: async (epoch, logs) => {\nconsole.log(`Epoch\
  \ ${epoch}: loss=${logs.loss}, accuracy=${logs.acc}`);\n},\n},\n});\n};\npredictButton.onclick\
  \ = async () => {\nawait transferRecognizer.listen(\n(result) => {\nconst words\
  \ = transferRecognizer.wordLabels();\nfor (let i = 0; i < words.length; ++i) {\n\
  console.log(`score for word '${words[i]}' = ${result.scores[i]}`);\n}\n},\n{ probabilityThreshold:\
  \ 0.75 }\n);\n};\n列表 5-24\n完整代码示例\n```\n\n### 5.1.7 应用\n\n尽管我目前用于代码示例的例子（说话和咳嗽）可能看起来很简单，但这项技术当前的使用方式展示了它有多么有趣。\n\
  \n#### 健康\n\n2020 年 7 月，苹果公司宣布发布其 watchOS 的新版本，其中包含一个应用程序，当用户洗手时会触发倒计时。根据公共卫生官员关于避免\
  \ COVID-19 传播的建议，该应用程序使用手表的麦克风检测流水声，并触发 20 秒倒计时。\n\n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig19_HTML.jpg](img/496132_1_En_5_Fig19_HTML.jpg)\n\
  \n图 5-19\n\nApple Watch 上的倒计时界面\n\n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig18_HTML.jpg](img/496132_1_En_5_Fig18_HTML.jpg)\n\
  \n图 5-18\n\n用户洗手时触发的倒计时\n\n根据前几页展示的代码示例，可以使用 JavaScript 和 TensorFlow.js 构建类似的应用程序。\n\
  \n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig20_HTML.jpg](img/496132_1_En_5_Fig20_HTML.jpg)\n\
  \n图 5-20\n\n使用 TensorFlow.js 构建的类似倒计时界面原型\n\n#### 生物多样性研究与保护\n\n这项技术我最喜欢的应用之一是在生物多样性研究和濒危物种保护方面。\n\
  \n这方面一个很好的例子是“雨林连接”组织。\n\n该组织利用旧手机及其内置麦克风来检测森林中电锯的声音，并提醒护林员注意潜在的非法砍伐活动。\n\n通过使用太阳能电池板并将设备安装在树上，他们可以持续监控周围发生的情况并进行实时预测。\n\
  \n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig21_HTML.jpg](img/496132_1_En_5_Fig21_HTML.jpg)\n\
  \n图 5-21\n\n由太阳能电池板和二手手机组成的安装实例。来源：[`https://www.facebook.com/RainforestCx/`](https://www.facebook.com/RainforestCx/)\n\
  \n如果你对这个项目感兴趣，他们还有一个名为“雨林连接”的移动应用程序，如果你想去看看，可以在其中实时聆听来自森林的自然之声！\n\n这项技术的另一个用途是保护虎鲸。谷歌、雨林连接组织和加拿大渔业与海洋部\
  \ (DFO) 合作，利用生物声学监测来追踪、监控和观察萨利希海中动物的行为。\n\n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig22_HTML.jpg](img/496132_1_En_5_Fig22_HTML.jpg)\n\
  \n图 5-22\n\n追踪虎鲸的网页界面。来源：[`https://venturebeat.com/2020/01/28/googles-ai-powers-real-time-orca-tracking-in-vancouver-bay/`](https://venturebeat.com/2020/01/28/googles-ai-powers-real-time-orca-tracking-in-vancouver-bay/)\n\
  \n\n\n#### 网页无障碍\n\n你可能尚未注意到，另一项应用已在你熟悉的某个服务中实现。事实上，如果你正在使用 YouTube，你可能遇到过**实时环境声音字幕**。\n\
  \n如果你曾在 YouTube 视频上开启过字幕，你可能会知道，视频底部会叠加显示说话内容。\n\n然而，视频中包含的信息远不止转录文本所能呈现的内容。\n\n\
  事实上，对于没有听力障碍的人来说，他们也能从视频中获取额外信息，例如背景音乐或雨声等环境声音。\n\n如果字幕只显示说话内容，对于有听力障碍的人来说，可能会遗漏大量信息。\n\
  \n大约三年前，也就是 2017 年，YouTube 推出了实时环境声音字幕功能。该功能利用声音识别技术，将视频音轨中检测到的环境声音细节添加到字幕中。\n\n\
  以下是一个示例。\n\n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig23_HTML.jpg](img/496132_1_En_5_Fig23_HTML.jpg)\n\
  \n图 5-23\n\nYouTube 上的实时环境声音字幕示例\n\n上述截图来自 Janelle Monae 和 Pharrell Williams 的一次访谈，其中字幕功能已开启。\n\
  \n说话内容按预期显示，但我们也能看到诸如 [掌声] 这样的环境声音。\n\n现在，有听力障碍的人有机会获得比单纯对话更多的视频信息。\n\n目前，YouTube\
  \ 视频中可检测到的环境声音包括：\n\n*   掌声\n*   音乐播放\n*   笑声\n\n这看起来可能不算多，但同样，如果我们从未考虑过一些残障人士在这些平台上的体验，我们就会认为这是理所当然的。\n\
  \n此外，考虑到这项功能大约在三年前就已实现，这表明像谷歌这样的科技巨头一直在积极探索利用机器学习处理音频数据的潜力，并致力于寻找有用的应用场景。\n\n###\
  \ 5.1.8 局限性\n\n现在我们已经介绍了如何在 JavaScript 中尝试声音活动识别以及一些不同的应用，了解此类技术的一些局限性对于更好地理解其真正的机遇至关重要。\n\
  \n#### 数据的质量与数量\n\n如果你决定从头开始构建一个类似的声音活动识别系统，并且在不使用迁移学习和 TensorFlow.js 的语音指令模型的情况下编写自己的模型，那么你将需要收集比使用\
  \ Teachable Machine 时所需的最少 8 个样本多得多的声音样本。\n\n要收集大量样本，你可以选择自己录制，或者从专业音频库购买。\n\n另一个要点是务必检查所录制数据的质量。例如，如果你想检测吸尘器运行的声音，请确保没有背景噪音，并且吸尘器的声音在音轨中清晰可辨。\n\
  \n从单个样本生成多个数据样本的一个技巧是，使用音频编辑软件更改单个音频源的某些参数，以创建其多个版本。例如，你可以修改混响、音高等。\n\n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig24_HTML.jpg](img/496132_1_En_5_Fig24_HTML.jpg)\n\
  \n图 5-24\n\n声音转换。Gierad Laput, Karan Ahuja, Mayank Goel, and Chris Harrison. 2018.\
  \ Ubicoustics: Plug-and-Play Acoustic Activity Recognition. In The 31st Annual ACM\
  \ Symposium on User Interface Software and Technology (UIST '18). ACM, New York,\
  \ NY, USA, 213-224. DOI: [`https://doi.org/10.1145/3242587.3242609`](https://doi.org/10.1145/3242587.3242609)\n\
  \n#### 单一活动\n\n目前，这项技术似乎能有效识别单一声音。\n\n例如，如果你训练模型识别某人说话的声音以及流水的声音，并且你将系统放置在厨房中，用户一边说话一边洗碗，那么系统预测的活动将只是返回结果中得分最高的那个。\n\
  \n然而，由于系统持续运行，它可能会在这两种活动之间感到困惑。它可能会在“说话”和“流水”之间交替，直到其中一种活动停止。\n\n如果你构建的应用需要检测可能同时发生的活动所产生的声音，这无疑会成为一个问题。\n\
  \n例如，假设你通常一边淋浴一边播放音乐，并且你构建了一个能检测两种活动的应用：淋浴流水声和说话声。\n\n你希望每当检测到淋浴流水声时就能触发一个计时器，这样你就可以避免长时间淋浴以节约用水。\n\
  \n你还希望当检测到有人在浴室说话时，能降低扬声器的音量。\n\n由于这两种活动可能同时发生（你可以在淋浴时说话），系统可能会在这两种活动之间感到困惑，前一秒检测到淋浴流水声，下一秒又检测到有人在说话。\n\
  \n结果就是，扬声器会启动一秒又停止一秒，计时器也会启动一秒又停止一秒。这肯定不会带来理想的体验。\n\n然而，这并不意味着利用声音活动识别构建应用没有潜力，只是意味着我们需要设法克服这一局限性。\n\
  \n此外，目前正在进行一些研究，旨在开发能够同时处理多种活动检测的系统。我们将在接下来的几页中探讨这一点。\n\n\n\n#### 用户体验\n\n谈到用户体验，像这样的新技术总会带来一些挑战。\n\
  \n首先，是**隐私**问题。\n\n让设备持续监听用户，总会引发一些担忧：数据存储在哪里？如何使用？是否安全？等等。\n\n考虑到一些发布物联网设备的公司并不总是将安全性放在首位，这些担忧非常正常。\n\
  \n因此，消费者对这些设备的采用速度可能会慢于预期。\n\n隐私和安全不仅应该内置于这些系统中，还应该以清晰的方式传达给用户，以安抚他们，并让他们感到对自己的数据有掌控力。\n\
  \n其次，另一个挑战在于教会用户**新的** **交互方式**。\n\n例如，尽管大多数现代手机都内置了语音助手，但通过询问 Siri 或 Google 来获取信息并非主要的交互方式。\n\
  \n这可能是由于多种原因造成的，包括隐私问题、技术本身的局限性，但人们也有难以改变的习惯。\n\n此外，考虑到这项技术目前尚不完善，当用户尝试几次后没有得到预期的回应时，他们很容易放弃。\n\
  \n缓解这个问题的一个方法是发布小型应用程序来分析用户的反应并进行调整。苹果在其新的 watchOS 中实现的水检测功能就是一个例子。\n\n最后，创建自定义声学活动识别系统的一大挑战在于**样本数据的收集和用户的训练**。\n\
  \n尽管你可以构建并发布一个能检测水龙头流水声的应用程序，因为大多数家庭中水龙头产生的声音很可能相似，但其他一些声音并不那么常见。\n\n因此，让用户能够使用这项技术，就需要让他们录制自己的样本并训练模型，这样他们才有机会拥有一个定制化的应用程序。\n\
  \n然而，由于机器学习算法需要用大量数据进行训练才能有机会产生准确的预测，这需要用户付出大量努力，并且很可能不会成功。\n\n幸运的是，一些研究人员正在试验解决这些问题的方案。\n\
  \n现在，尽管这项技术存在一些限制，但解决方案也开始出现。\n\n例如，在保护用户隐私方面，Bjørn Karmann 开发的一个名为 Project Alias\
  \ 的开源项目试图为语音助手用户赋能。\n\n该项目是一个 DIY 附加组件，由树莓派微控制器、扬声器和麦克风模块组成，全部封装在一个 3D 打印的外壳中，旨在阻止\
  \ Amazon Alexa 和 Google Home 等语音助手持续监听用户。\n\n通过一个移动应用程序，用户可以训练 Alias 对自定义的唤醒词或声音做出反应。一旦训练完成，Alias\
  \ 就可以控制家庭助手并为你激活它。当你不使用时，这个附加组件会通过向助手的麦克风发出白噪音来阻止其监听。\n\n由于 Alias 的神经网络在本地运行，用户的隐私得到了保护。\n\
  \n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig26_HTML.jpg](img/496132_1_En_5_Fig26_HTML.jpg)\n\
  \n图 5-26\n\nProject Alias 组件。来源：[`https://bjoernkarmann.dk/project_alias`](https://bjoernkarmann.dk/project_alias)\n\
  \n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig25_HTML.jpg](img/496132_1_En_5_Fig25_HTML.jpg)\n\
  \n图 5-25\n\nProject Alias。来源：[`https://bjoernkarmann.dk/project_alias`](https://bjoernkarmann.dk/project_alias)\n\
  \n另一个名为 Synthetic Sensors 的项目，旨在创建一个能够同时准确预测多种声音的系统。\n\n该项目由卡内基梅隆大学的一个研究团队开发，涉及一个由多个传感器组成的定制硬件，包括加速度计、麦克风、温度传感器、运动传感器和颜色传感器。\n\
  \n利用从这些传感器收集的原始数据，研究人员创建了多个堆叠的声谱图，并训练算法来检测多种活动产生的模式，例如：\n\n*   微波炉门关闭\n*   电锯运行\n\
  *   水壶开启\n*   水龙头流水\n*   马桶冲水\n\n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig28_HTML.jpg](img/496132_1_En_5_Fig28_HTML.jpg)\n\
  \n图 5-28\n\nProject Synthetic Sensors 的声谱图与活动识别示例。Gierad Laput, Yang Zhang, and\
  \ Chris Harrison. 2017. Synthetic Sensors: Towards General-Purpose Sensing. In Proceedings\
  \ of the 2017 CHI Conference on Human Factors in Computing Systems (CHI '17). ACM,\
  \ New York, NY, USA, 3986-3999. DOI: [`https://doi.org/10.1145/3025453.3025773`](https://doi.org/10.1145/3025453.3025773)\n\
  \n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig27_HTML.jpg](img/496132_1_En_5_Fig27_HTML.jpg)\n\
  \n图 5-27\n\nProject Synthetic Sensors 硬件。Gierad Laput, Yang Zhang, and Chris Harrison.\
  \ 2017. Synthetic Sensors: Towards General-Purpose Sensing. In Proceedings of the\
  \ 2017 CHI Conference on Human Factors in Computing Systems (CHI '17). ACM, New\
  \ York, NY, USA, 3986-3999. DOI: [`https://doi.org/10.1145/3025453.3025773`](https://doi.org/10.1145/3025453.3025773).\n\
  \n最后，在用户体验方面，一个名为 Listen Learner 的研究项目旨在让用户能够以最小的努力收集数据并训练模型来识别自定义声音。\n\n该项目的全称是\
  \ Listen Learner: Automatic Class Discovery and One-Shot Interaction for Activity\
  \ Recognition（活动识别的自动类别发现与一次性交互）。\n\n它旨在提供高分类准确率，同时最大限度地减少用户负担。其方法是持续监听环境中的声音，按相似声音的聚类进行分类，并在收集到足够多的相似样本后询问用户这是什么声音。\n\
  \n研究结果表明，该系统能够准确、自动地学习声学事件（例如，97% 的精确率，87% 的召回率），同时遵循用户对非侵入式交互行为的偏好。\n\n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig29_HTML.jpg](img/496132_1_En_5_Fig29_HTML.jpg)\n\
  \n图 5-29\n\nWu, J., Harrison, C., Bigham, J. and Laput, G. 2020. Automated Class\
  \ Discovery and One-Shot Interactions for Acoustic Activity Recognition. In Proceedings\
  \ of the 38th Annual SIGCHI Conference on Human Factors in Computing Systems. CHI\
  \ '20. ACM, New York, NY. 来源：[`www.chrisharrison.net/index.php/Research/ListenLearner`](https://www.chrisharrison.net/index.php/Research/ListenLearner)\n\
  \n## 5.2 身体与运动追踪\n\n在了解了如何将机器学习应用于音频数据之后，让我们来看看另一种输入类型，即身体追踪。\n\n在本节中，我们将使用来自网络摄像头的身体运动数据，并借助三个不同的\
  \ TensorFlow.js 模型进行处理。\n\n\n\n### 5.2.1 面部网格模型\n\n我们将要实验的第一个模型叫做面部网格模型。这是一个专注于人脸识别的机器学习模型，能够预测用户面部\
  \ 486 个 3D 面部特征点的位置，并返回这些点的 x、y、z 坐标。\n\n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig31_HTML.jpg](img/496132_1_En_5_Fig31_HTML.jpg)\n\
  \n图 5-31\n\n关键点映射图。来源：[`https://github.com/tensorflow/tfjs-models/tree/master/facemesh`](https://github.com/tensorflow/tfjs-models/tree/master/facemesh)\n\
  \n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig30_HTML.jpg](img/496132_1_En_5_Fig30_HTML.jpg)\n\
  \n图 5-30\n\n使用面部网格模型进行面部追踪的可视化示例。来源：[`https://github.com/tensorflow/tfjs-models/tree/master/facemesh`](https://github.com/tensorflow/tfjs-models/tree/master/facemesh)\n\
  \n这个人脸识别模型与其他面部追踪 JavaScript 库（如`face-tracking.js`）的主要区别在于，TensorFlow.js 模型旨在近似人脸的表面几何形状，而不仅仅是某些关键点的\
  \ 2D 位置。\n\n该模型在 3D 环境中提供坐标，从而能够近似面部特征的深度，并且即使在用户三维旋转面部时也能追踪关键点的位置。\n\n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig32_HTML.jpg](img/496132_1_En_5_Fig32_HTML.jpg)\n\
  \n图 5-32\n\n使用网络摄像头和 3D 可视化的关键点。来源：[`https://storage.googleapis.com/tfjs-models/demos/facemesh/index.html`](https://storage.googleapis.com/tfjs-models/demos/facemesh/index.html)\n\
  \n#### 加载模型\n\n要开始使用该模型，我们需要在 HTML 文件中使用以下两行代码来加载它。\n\n```\n\n清单 5-25\n在 HTML 文件中导入\
  \ TensorFlow.js 和面部网格模型\n```\n\n由于我们将使用网络摄像头的视频流来检测人脸，我们还需要在文件中添加一个视频元素。\n\n总而言之，你所需的最基本的\
  \ HTML 代码如下所示。\n\n```\n\n面部网格模型\n\n清单 5-26\n所需的核心 HTML 代码\n```\n\n然后，在你的 JavaScript\
  \ 代码中，你需要使用以下代码加载模型和网络摄像头视频流。\n\n```\nlet model;\nlet video;\nconst init = async\
  \ () => {\nmodel = await facemesh.load();\nvideo = await loadVideo();\nmain(); //\
  \ 该函数将在下一个代码示例中声明。\n}\nconst loadVideo = async () => {\nconst video = await setupCamera();\n\
  video.play();\nreturn video;\n};\nconst setupCamera = async () => {\nif (!navigator.mediaDevices\
  \ || !navigator.mediaDevices.getUserMedia) {\nthrow new Error(\n\"浏览器 API navigator.mediaDevices.getUserMedia\
  \ 不可用\"\n);\n}\nvideo = document.querySelector(\"video\");\nvideo.width = window.innerWidth;\n\
  video.height = window.innerHeight;\nconst stream = await navigator.mediaDevices.getUserMedia({\n\
  audio: false,\nvideo: {\nfacingMode: \"user\",\nwidth: window.innerWidth,\nheight:\
  \ window.innerHeight,\n},\n});\nvideo.srcObject = stream;\nreturn new Promise(\n\
  (resolve) => (video.onloadedmetadata = () => resolve(video))\n);\n};\n清单 5-27\n\
  加载模型并设置网络摄像头视频流\n```\n\n#### 预测\n\n一旦模型和视频准备就绪，我们就可以调用`main`函数来查找输入流中的面部特征点。\n\n\
  ```\nasync function main() {\nconst predictions = await model.estimateFaces(\ndocument.querySelector(\"\
  video\")\n);\nif (predictions.length > 0) {\nconsole.log(predictions);\nfor (let\
  \ i = 0; i < predictions.length; i++) {\nconst keypoints = predictions[i].scaledMesh;\n\
  // 记录面部关键点。\nfor (let i = 0; i < keypoints.length; i++) {\nconst [x, y, z] = keypoints[i];\n\
  console.log(`关键点 ${i}: [${x}, ${y}, ${z}]`);\n}\n}\n}\n}\n清单 5-28\n查找面部特征点的函数\n\
  ```\n\n在浏览器控制台中，此代码示例的输出如下所示。\n\n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig34_HTML.jpg](img/496132_1_En_5_Fig34_HTML.jpg)\n\
  \n图 5-34\n\n控制台中循环语句的输出\n\n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig33_HTML.jpg](img/496132_1_En_5_Fig33_HTML.jpg)\n\
  \n图 5-33\n\n控制台中特征点的输出\n\n正如我们在前面两张截图中看到的，返回的预测结果包含了大量信息。\n\n注释按特征点区域组织，按字母顺序排列，并包含\
  \ x、y、z 坐标的数组。\n\n边界框包含两个主要键，`bottomRight`和`topLeft`，用于指示视频流中检测到的人脸位置的边界。这两个属性包含一个只有\
  \ x 和 y 两个坐标的数组，因为 z 轴在这种情况下没有用处。\n\n最后，`mesh`和`scaledMesh`属性包含了所有特征点的坐标，对于在屏幕上渲染\
  \ 3D 空间中的所有点非常有用。\n\n#### 完整代码示例\n\n总而言之，用于设置模型、视频流并开始预测特征点位置的 JavaScript 代码应如下所示。\n\
  \n```\nlet video;\nlet model;\nconst init = async () => {\nvideo = await loadVideo();\n\
  await tf.setBackend(\"webgl\");\nmodel = await facemesh.load();\nmain();\n};\nconst\
  \ loadVideo = async () => {\nconst video = await setupCamera();\nvideo.play();\n\
  return video;\n};\nconst setupCamera = async () => {\nif (!navigator.mediaDevices\
  \ || !navigator.mediaDevices.getUserMedia) {\nthrow new Error(\n\"浏览器 API navigator.mediaDevices.getUserMedia\
  \ 不可用\"\n);\n}\nvideo = document.querySelector(\"video\");\nvideo.width = window.innerWidth;\n\
  video.height = window.innerHeight;\nconst stream = await navigator.mediaDevices.getUserMedia({\n\
  audio: false,\nvideo: {\nfacingMode: \"user\",\nwidth: window.innerWidth,\nheight:\
  \ window.innerHeight,\n},\n});\nvideo.srcObject = stream;\nreturn new Promise(\n\
  (resolve) => (video.onloadedmetadata = () => resolve(video))\n);\n};\ninit();\n\
  async function main() {\nconst predictions = await model.estimateFaces(\ndocument.querySelector(\"\
  video\")\n);\nif (predictions.length > 0) {\nconsole.log(predictions);\nfor (let\
  \ i = 0; i < predictions.length; i++) {\nconst keypoints = predictions[i].scaledMesh;\n\
  // 记录面部关键点。\nfor (let i = 0; i < keypoints.length; i++) {\nconst [x, y, z] = keypoints[i];\n\
  console.log(`关键点 ${i}: [${x}, ${y}, ${z}]`);\n}\n}\n}\nrequestAnimationFrame(main);\n\
  }\n清单 5-29\n完整的 JavaScript 代码示例\n```\n\n\n\n#### 项目实践\n\n为了将这段代码示例付诸实践，我们来构建一个快速原型，让用户能够通过前后倾斜头部来滚动页面。\n\
  \n我们将能够复用之前编写的大部分代码，并做一些小修改，利用检测到的某些关键点来触发滚动。\n\n我们用来检测头部运动的具体关键点是 `lipsLowerOuter`，更准确地说，是其\
  \ z 轴。\n\n查看注释对象中所有可用的属性，`lipsLowerOuter` 是最接近下巴的一个，因此我们可以观察该区域 z 坐标的预测变化，来判断头部是向后倾斜（下巴前移）还是向前倾斜（下巴后移）。\n\
  \n为此，在我们的 `main` 函数中，一旦获得预测结果，我们可以添加以下代码行。\n\n```\nif (predictions[0].annotations.lipsLowerOuter)\
  \ {\nlet zAxis = predictions[0].annotations.lipsLowerOuter[9][2];\nif (zAxis > 5)\
  \ {\n// 向下滚动\nwindow.scrollTo({\ntop: (scrollPosition += 10),\nleft: 0,\nbehavior:\
  \ \"smooth\",\n});\n} else if (zAxis < -5) {\n// 向上滚动\nwindow.scrollTo({\ntop: (scrollPosition\
  \ -= 10),\nleft: 0,\nbehavior: \"smooth\",\n});\n}\n}\n代码清单 5-30\n当 z 轴变化时触发滚动\n\
  ```\n\n在这段代码示例中，我声明了一个名为 `zAxis` 的变量，用于存储我想要追踪的 z 坐标值。为了获取这个值，我查看了注释对象的 `lipsLowerOuter`\
  \ 属性中包含的坐标数组。\n\n根据返回的注释对象，我们可以看到 `lipsLowerOuter` 属性包含 10 个数组，每个数组有 3 个值。\n\n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig35_HTML.jpg](img/496132_1_En_5_Fig35_HTML.jpg)\n\
  \n图 5-35\n\n返回的注释及其 lipsLowerOuter 值\n\n这就是为什么前面的代码示例使用 `predictions[0].annotations.lipsLowerOuter[9][2]`\
  \ 来访问 z 坐标。\n\n我决定访问 `lipsLowerOuter` 属性的最后一个元素（[9]）及其第三个值（[2]），即该部分的 z 坐标。\n\n\
  值 5 是通过反复试验并观察哪个阈值适用于这个特定项目而选定的。这并不是一个每次使用 Facemesh 模型都必须采用的标准值。相反，我是在记录了 `zAxis`\
  \ 变量，并在浏览器控制台中观察到我前后倾斜头部时其值的变化后，才决定将其作为适合我的正确阈值。\n\n然后，假设你在代码中更早地声明了 `scrollPosition`\
  \ 并为其设置了一个值（我个人将其设为 0），那么当你向后倾斜头部时，将触发“向上滚动”事件；当你向前倾斜头部时，将触发“向下滚动”事件。\n\n最后，我将 `behavior`\
  \ 属性设置为 `\"smooth\"`，以实现平滑滚动，在我看来，这能创造更好的体验。\n\n如果你没有向 HTML 文件中添加任何内容，那么你还看不到任何效果，所以别忘了添加足够的文本或图片，以便测试一切是否正常！\n\
  \n在不到 75 行的 JavaScript 代码中，我们加载了一个人脸识别模型，设置了视频流，运行预测以获取面部关键点的 3D 坐标，并编写了一些逻辑，以便在向后或向前倾斜头部时触发向上或向下滚动！\n\
  \n```\nlet video;\nlet model;\nconst init = async () => {\nvideo = await loadVideo();\n\
  await tf.setBackend(\"webgl\");\nmodel = await facemesh.load();\nmain();\n};\nconst\
  \ loadVideo = async () => {\nconst video = await setupCamera();\nvideo.play();\n\
  return video;\n};\nconst setupCamera = async () => {\nif (!navigator.mediaDevices\
  \ || !navigator.mediaDevices.getUserMedia) {\nthrow new Error(\n\"浏览器 API navigator.mediaDevices.getUserMedia\
  \ 不可用\"\n);\n}\nvideo = document.querySelector(\"video\");\nvideo.width = window.innerWidth;\n\
  video.height = window.innerHeight;\nconst stream = await navigator.mediaDevices.getUserMedia({\n\
  audio: false,\nvideo: {\nfacingMode: \"user\",\nwidth: window.innerWidth,\nheight:\
  \ window.innerHeight,\n},\n});\nvideo.srcObject = stream;\nreturn new Promise(\n\
  (resolve) => (video.onloadedmetadata = () => resolve(video))\n);\n};\ninit();\n\
  let scrollPosition = 0;\nasync function main() {\nconst predictions = await model.estimateFaces(\n\
  document.querySelector(\"video\")\n);\nif (predictions.length > 0) {\nif (predictions[0].annotations.lipsLowerOuter)\
  \ {\nzAxis = predictions[0].annotations.lipsLowerOuter[9][2];\nif (zAxis > 5) {\n\
  // 向下滚动\nwindow.scrollTo({\ntop: (scrollPosition += 10),\nleft: 0,\nbehavior: \"\
  smooth\",\n});\n} else if (zAxis < -5) {\n// 向上滚动\nwindow.scrollTo({\ntop: (scrollPosition\
  \ -= 10),\nleft: 0,\nbehavior: \"smooth\",\n});\n}\n}\n}\nrequestAnimationFrame(main);\n\
  }\n代码清单 5-31\n完整的 JavaScript 代码\n```\n\n这个模型专门用于检测面部关键点。接下来，我们将研究另一个模型，用于检测用户手部的关键点。\n\
  \n### 5.2.2 Handpose\n\n我们要尝试的第二个模型叫做 Handpose。该模型专门用于识别用户手部 21 个 3D 关键点的位置。\n\n\
  以下是该模型输出结果的一个示例，该结果使用 Canvas API 在屏幕上可视化。\n\n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig37_HTML.jpg](img/496132_1_En_5_Fig37_HTML.jpg)\n\
  \n图 5-37\n\nHandpose 可视化的关键点。来源：[`https://github.com/tensorflow/tfjs-models/tree/master/handpose`](https://github.com/tensorflow/tfjs-models/tree/master/handpose)\n\
  \n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig36_HTML.jpg](img/496132_1_En_5_Fig36_HTML.jpg)\n\
