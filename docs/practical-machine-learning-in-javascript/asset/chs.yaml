  ### 1.4.3 社会公益


  对于使用机器学习解决某些问题（例如在司法系统中）的后果，人们日益感到担忧；然而，将其用于社会公益也潜力巨大。


  无论是用于动物保护还是防止森林砍伐，机器学习在这一领域的应用都非常令人兴奋。


  一些项目旨在保护濒危物种，例如从不列颠哥伦比亚省到华盛顿州的萨利希海中的虎鲸（也称为逆戟鲸）。由于仅剩约 73 头，谷歌与加拿大渔业和海洋部（DFO）以及雨林连接组织合作，利用深度神经网络追踪和监测虎鲸的行为。


  通过训练机器学习模型识别虎鲸的声音，系统可以实时检测到这种动物的存在并向专家发出警报。例如，这种系统可以帮助监测动物的健康状况，并在发生石油泄漏等事件时保护它们。


  雨林连接组织的另一个项目旨在利用机器学习和旧手机来防止非法砍伐森林。


  这些设备全天候监控森林的声音，将所有音频数据发送到云端，并使用 TensorFlow 实时分析，以识别电锯、运木卡车以及所有非法活动的声音，从而向当地人发出警报。


  ![../images/496132_1_En_1_Chapter/496132_1_En_1_Fig8_HTML.jpg](img/496132_1_En_1_Fig8_HTML.jpg)


  图 1-8


  雨林连接组织反非法砍伐项目工作原理的可视化表示。来源：[www.​ted.​com/​talks/​topher_​white_​what_​can_​save_​the_​rainforest_​your_​used_​cell_​phone#t-289131](http://www.ted.com/talks/topher_white_what_can_save_the_rainforest_your_used_cell_phone%2523t-289131)


  还有更多有趣的项目专注于利用机器学习的可能性来帮助社会公益事业。尽管这不是本书的重点，但如果你有意为此做出贡献，我鼓励你进行更深入的研究。




  ### 1.4.4 艺术


  当你想深入了解机器学习时，艺术可能并非你首先关注的领域；然而，我确实认为其重要性在技术领域被严重低估了。


  艺术领域往往比其他任何领域都更快地尝试最新的技术创新。


  关注机器学习如何以创意方式被运用，能让我们了解这项技术能走多远。


  不仅要让自己接触艺术家的作品，我还建议你亲自尝试构建创意应用。


  花些时间以创意方式将某项技术应用到你的项目中，会让你有机会探索该工具中你可能从未想过的部分。


  ![../images/496132_1_En_1_Chapter/496132_1_En_1_Fig9_HTML.jpg](img/496132_1_En_1_Fig9_HTML.jpg)


  图 1-9


  来自 Memo Akten 艺术项目“学习观看”的样本。来源：[*www.memo.tv/portfolio/gloomy-sunday/*](http://www.memo.tv/portfolio/gloomy-sunday/)


  创造力可以帮助你发现所使用工具的新用例、机遇和局限。


  尤其是在机器学习这样一个仍有大量未知的领域，提出关于可能性的新想法有着巨大的潜力。


  机器学习以创意方式运用的一些例子，体现在 Memo Akten 等艺术家的作品中。在他的项目“学习观看”中，他使用深度神经网络和实时摄像头输入，试图根据其之前所见来理解当前所见。


  一个模型已经用海洋图像进行了训练。它从摄像头输入（左侧）获得新数据，进行分析，并尝试根据其训练数据来理解其含义。结果就是模型“看到”了什么，即模型如何根据其已知信息来理解新输入。


  另一个例子是谷歌 Magenta 团队的工作，他们致力于构建能够自行生成音乐片段的机器学习模型。这类工作可以彻底改变人类在音乐制作中使用技术的方式。


  ## 1.5 总结


  在介绍了机器学习的一些通用理论概念之后，是时候开始深入一些更实际的内容，并讨论作为前端开发者如何开始构建人工智能项目了。


