  \ UI 要求你寻找一部手机，你需要确保模型已经用手机图片训练过，这样它才能检测到正确的物体。\n\n\n\n幸运的是，在仓库 [`https://github.com/tensorflow/tfjs-models/blob/master/mobilenet/src/imagenet_classes.ts`](https://github.com/tensorflow/tfjs-models/blob/master/mobilenet/src/imagenet_classes.ts)\
  \ 中可以找到 mobilenet 模型能够识别的对象类别列表。\n\n如果在你的应用中导入这个列表，你的代码就可以遍历这个包含 1000 个条目的对象，并在用户界面中随机显示一个，要求用户在周围找到这个物体。\n\
