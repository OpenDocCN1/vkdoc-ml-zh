- fmt: '# 1.1 What is machine learning?


    Over the past few years, you’ve probably heard the words “machine learning” many
    times, but what is it exactly? Is it the same thing as artificial intelligence?
    What about deep learning? Neural networks? Models?


    Before diving deeper into the tools, algorithms, and what can be built, let’s
    start by defining some of these terms to gain a common understanding of what machine
    learning is and is not.


    Artificial intelligence, machine learning, and deep learning are all related terms.
    However, they’re not exactly the same thing, they’re more like subsets of each
    other.


    ![../images/496132_1_En_1_Chapter/496132_1_En_1_Fig1_HTML.jpg](images/496132_1_En_1_Chapter/496132_1_En_1_Fig1_HTML.jpg)


    Figure 1-1


    This graph is a representation of how artificial intelligence, machine learning,
    and deep learning connect


    **Artificial intelligence** is the umbrella term for everything related to the
    expression of “intelligence” by computers. This can include speech recognition
    (the understanding of human speech), autonomous cars, or strategic gaming (the
    ability for computers to play strategic games like Go or Chess).


    **Machine learning** represents the technology itself: all the practices and set
    of tools to give the ability to computers to find patterns in data without being
    explicitly programmed.


    This includes the different types of learning and algorithms available such as
    supervised learning, Naive Bayes, K-nearest neighbors, and so on that we will
    cover in the next few chapters.


    This technology is used to train computers to make their own predictions based
    on a developed understanding of historical data.


    What this means is that we’re not telling computers exactly what to look for;
    instead, we feed algorithms a lot of data previously collected and let them find
    patterns and correlations in this dataset to draw future conclusions and probabilities
    when given new data.


    For example, if we want to use machine learning to help us calculate the probability
    of a person having cancer based on their CT scans, we would build a dataset of
    hundreds of thousands, or even millions, of CT scans from diverse patients around
    the world. We would label this data between CT scans of cancerous patients and
    scans of healthy patients. We would then feed all this data to machine learning
    algorithms and let them find patterns in those medical images to try and develop
    an accurate understanding of what a cancerous scan looks like.


    Then, using the model generated by all this training, we would be able to use
    it on a new scan that wasn’t part of the training data, and generate a probability
    of a patient having cancer or not.


    Finally, **deep learning** is a specific tool or method. It is related to another
    term you might be familiar with, called **artificial neural networks**. Deep learning
    is the subset of machine learning that uses algorithms inspired by the structure
    and function of the brain.


    The concept of neural networks in machine learning is not new, but the term deep
    learning is more recent.


    Essentially, this method allows the training of large neural networks in the aim
    to make revolutionary advances in machine learning and AI.


    Deep learning has been taking off over the past few years mainly thanks to advancements
    in computing power and the amount of data we are now collecting.


    In comparison to other machine learning algorithms, deep learning ones have a
    performance that continues to improve as we increase the amount of data we feed
    them, which makes them more scalable where others plateau.


    A representation of this can be found in this slide from a talk by Andrew Ng at
    ExtractConf 2015 entitled “What data scientists should know about deep learning.”


    ![../images/496132_1_En_1_Chapter/496132_1_En_1_Fig2_HTML.jpg](images/496132_1_En_1_Chapter/496132_1_En_1_Fig2_HTML.jpg)


    Figure 1-2


    This slide illustrates how deep learning scales compared to other machine learning
    algorithms. Source: [https://​www.​slideshare.​net/​ExtractConf](https://www.slideshare.net/ExtractConf)


    As you can see in the preceding graph, the main differential characteristic of
    deep learning algorithms is their ability to scale and increase performance with
    more data.


    The term “deep” learning generally refers to the amount of layers used in the
    neural networks. If this does not totally make sense right now, we’ll cover the
    concept of layers a bit later in this book.


    Now that we know more about the difference between these terms, this book is going
    to be focusing mainly on machine learning, the technology. We’ll be diving a little
    bit into deep learning as we look into different techniques but we’ll touch on
    broader aspects of the technology as well.


    We’ve defined the different names sometimes interchangeably used to talk about
    intelligence expressed by computers, but what about other important idioms like
    “neural networks,” “algorithms,” and “models”?


    We are probably going to mention them along the book, so let’s spend the next
    few paragraphs defining them.


    Let’s start with **algorithms** as this is the one you might be the most familiar
    with as it is already used in traditional programming.


    An algorithm can be defined as a set of rules or instructions to solve a particular
    problem or perform a computation.


    In software engineering, examples of algorithms you might have heard of or used
    would be the quicksort algorithm, the Dijkstra algorithm, binary search, and so
    on. Each algorithm was created to solve a particular problem.


    When it comes to machine learning algorithms, they solve different types of problems
    but the concept is the same; each algorithm, it being a support vector machine
    (SVM) or a long short-term memory (LSTM) algorithm, is only a mathematical function
    that solves a specific problem.


    **Neural networks** are a set of deep learning algorithms designed to mimic the
    way the brain works.


    The same way the brain is made of a giant network of connected neurons, neural
    networks are made of layers of interconnected nodes called artificial neurons.


    A visual way of representing these networks might be like the following graph.


    ![../images/496132_1_En_1_Chapter/496132_1_En_1_Fig3_HTML.jpg](images/496132_1_En_1_Chapter/496132_1_En_1_Fig3_HTML.jpg)


    Figure 1-3


    This graph is a representation of the different layers in a neural network


    In neural networks, there are usually three main parts, an **input layer** that
    represents the input data you want to generate a prediction for (e.g., an image
    you want to apply object detection to, a piece of text you want to get the sentiment
    for, etc.), a certain number of **hidden layers**, and an **output layer** that
    represents your prediction.


    This is a very high-level explanation of how neural networks work, but the most
    important part to understand is that they are made of a large number of interconnected
    nodes, organized in layers, that get activated or not during the training process
    depending on the outcome generated by neurons in the previous layer, in a similar
    way different neurons in the brain fire when given specific inputs.


    Finally, **models**. In machine learning, models represent the output of a training
    session. When the training process is happening, algorithms are “learning” to
    draw conclusions from patterns they find in data; once the training steps are
    done, the output is a model.


    Models are mathematical functions that can take new inputs as parameters and produce
    a prediction as output.'
