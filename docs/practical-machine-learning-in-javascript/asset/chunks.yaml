    例如，图像分类模型通过数千张带标签的图像进行训练，以识别数据中的模式并预测某些实体（如猫、狗、汽车、人等）的存在。当在新应用中使用图像分类模型时，你可以输入一张可能不属于训练数据集的新图像，模型会根据训练过程中的学习成果，对这张它从未“见过”的图像中的内容生成预测。


    在训练过程结束时，你通常会使用不属于训练数据集的新输入来测试模型，以检验所生成预测的有效性。


    既然我们已经定义了几个在深入机器学习时会遇到的重要术语，我认为有必要快速说明一下机器学习**不是**什么。


    希望前几段内容已经更清楚地表明，机器学习在未输入预先收集的数据时，是无法生成预测的。


    就像我们人类无法识别从未接触过的新物体或实体一样，算法也需要先获得某种信息，才能识别新的输入。


    例如，我第一次听说 3D 打印机时，很难想象它是什么样子。当我真正看到并操作了一台之后，我才理解了它是什么，并且能够识别出未来的同类物品。


    人脑处理这个过程非常迅速，但算法需要更多的数据进行训练，才能逐步理解物体是什么。


    由于算法本质上是数学函数，因此对于未来人工智能发展的相关报道，我们应当持保留态度。


    尽管人工智能系统性能强大，但它们仍然需要在我们预先收集的大量数据上进行训练。因此，我认为机器学习应用的机会在于**增强**人类，而非**取代**人类。


    医疗领域就是一个例子。我并不特别相信人工智能系统会取代医生，但我们已经看到机器学习如何通过处理海量医学图像，在 CT 扫描和核磁共振成像中识别和诊断疾病来帮助医生，有时其准确率甚至超过医疗专业人员。


    通过这种方式依赖机器学习模型，我们有望更快地诊断和帮助患者。


    同样重要的是要记住，计算机并不真正理解其所处理信息的上下文。从社会角度来看，某些需要解决的问题非常复杂，可能不应该仅依靠机器学习来解决。我们将在本书末尾更详细地讨论伦理与人工智能的话题。


    ## 1.2 机器学习的类型


    通过机器学习解决的问题通常属于三大类别之一：监督学习、无监督学习和强化学习。


    你可能也听说过半监督学习，但本书不会涉及。


    了解你试图解决的问题类型很重要，因为它将决定你要使用哪些算法、如何准备数据以及会得到什么样的输出。


    首先，让我们从最流行的一种开始：**监督学习**。


    ### 1.2.1 监督学习


    监督学习是利用**特征**和**标签**在数据中发现模式的能力。


    这里我们引入了两个与数据相关的新术语，在继续之前需要先定义它们。


    使用数据集时，**特征**代表每个条目的特性，而**标签**则是你如何定义这些条目。让我们用一个例子来实践一下。


    假设你想卖掉自己的房子，但不确定市场上最具竞争力的价格是多少，而你恰好拥有一个大型数据集，其中包含你所在城市所有房屋及其价格的信息。


    在这种情况下，**特征**就是每栋房屋的详细信息（卧室数量、浴室数量、楼层数、房屋类型、是否有阳台、花园等），而**标签**就是它们的价格。


    它可能看起来像下面这样。


    表 1-1


    此表展示了一个带标签数据集的示例


    | 价格 | 卧室数量 | 浴室数量 | 楼层数 | 阳台 | 花园 |

    | --- | --- | --- | --- | --- | --- |

    | **$1,500,000** | 3 | 2 | 2 | 无 | 有 |

    | **$500,000** | 1 | 1 | 1 | 有 | 无 |

    | **$750,000** | 1 | 1 | 1 | 无 | 有 |

    | **$1,700,000** | 4 | 2 | 2 | 无 | 有 |

    | **$700,000** | 2 | 1 | 1 | 无 | 无 |

    | **$850,000** | 2 | 1 | 1 | 有 | 有 |

    | **$525,000** | 1 | 1 | 1 | 无 | 无 |

    | **$2,125,000** | 5 | 3 | 3 | 有 | 有 |

    | **$645,000** | 1 | 1 | 1 | 有 | 有 |


    真实的数据集会有更多的条目和更多的特征，但这只是一个用来解释特征和标签概念的示例。


    利用这些带标签的数据，我们可以使用机器学习来预测你的房子应该以什么价格挂牌上市。


    例如，根据上述数据，如果你的房子有 1 间卧室、1 间浴室、没有阳台但有花园，那么它的价格会更接近 75 万美元，而不是 100 万美元。


    在这个简单的例子中，我们可以通过查看数据手动完成，但在实际情况下，数据量会大得多，使用机器学习能够比人类更快地完成计算。


    监督学习问题的其他例子包括：预测一封电子邮件是否为垃圾邮件、根据历史比赛数据预测一支运动队获胜的概率、预测保险索赔欺诈的概率。


    总之，监督学习是基于**带标签的数据**进行预测。

    '
- fmt: '### 1.2.2 Unsupervised learning


    Another common type of learning is called unsupervised learning. Contrary to supervised
    learning, unsupervised learning is the creation of predictions based on unlabelled
    data. What this means is that we rely only on the set of features.


    If we think about our previous dataset of houses, it means we would remove the
    column `Price` and would end up only with the data about the characteristics of
    each house.


    If we reuse the scenario of wanting to predict the price at which we should sell
    our house, you might be wondering, how can we predict this price if our data is
    not labelled (does not contain any price)?


    This is where the importance of thinking about the problem you are trying to solve
    and paying attention to the data you possess comes into play.


    With unsupervised learning, we are not trying to predict a single outcome, or
    answer a specific question, but instead, identify trends.


    In our house problem, our question was `How much can I sell my house for?` where
    we would expect a specific price as an outcome. However, as mentioned previously
    in this book, a machine learning algorithm cannot really predict a price if the
    dataset it was fed with during training did not contain any price.


    Therefore, this is not the type of situation where we would use unsupervised learning.


    As unsupervised learning is about identifying trends and classifying data into
    groups, a good example of problems that would fall into this space would be predicting
    customer behavior.


    With this type of problem, we are not trying to answer a question with a specific
    answer; instead, we are trying to classify data into different categories so we
    can create clusters of entities with similar features.


    Using our example of predicting customer behavior, by gathering data about each
    customer, we can use machine learning to find behavioral correlation between customers
    and find buying patterns that would help in applications such as advertising.


    Gathering and using data about where you shop, at what time, how many times a
    week, what you buy, and so on, we can draw conclusions about your gender, age,
    socioeconomic background, and more, which can then be used to predict what you
    might be likely to buy based on the cluster you belong to.


    You might be familiar with a real-world application of this type of prediction
    if you’ve been exposed to music recommendation on Spotify or product recommendation
    on Amazon.


    Based on your listening and buying habits, companies gather data and use machine
    learning to cluster customers into groups, and based on what other people like
    you have listened to, they propose recommendations of songs or products you might
    like.


    ### 1.2.3 Reinforcement learning


    A third type of learning is called reinforcement learning. If you’re reading this
    book, you are likely just getting started with machine learning so you probably
    won’t be using it at first.


    Reinforcement learning is mostly used for applications such as self-driving cars,
    games with AI players, and so on where the outcome involves more of a behavior
    or set of actions.


    It relies on the concept of reward and penalty and the relationship between an
    `agent` and an `environment`.


    We can imagine the scenario of a game of Pong where the environment is the game
    and the agent is a player. Actions from the player change the state of the game.
    Changing the position of the paddles influences where the ball goes and eventually
    results in the player winning or losing.


    When a sequence of actions results in the player winning, the system gets some
    kind of reward to indicate that this particular set of interactions resulted in
    achieving the goal of the training process, creating an AI player that can win
    a game by itself.


    The training process then continues, iterating over different sets of interactions,
    getting rewards when winning (+1 point), a penalty when losing (-1 point), and
    correcting itself to develop an understanding of how to win the game against another
    player over time.


    This type of learning does not rely on a preexisting dataset used to feed an algorithm.


    Instead, it uses a set of goals and rules (e.g., the paddle can only go up and
    down, the goal is to win against the other player, etc.) to learn by itself the
    correct behavior to optimize its opportunities to achieve the set goal.


    Reinforcement learning lets the system explore an environment and make its own
    decisions.


    This type of learning often demands a very long training process involving a huge
    amount of steps. One of the issues resides in the fact that, when receiving a
    penalty for losing a game, the system assumes that the entire sequence of actions
    taken in the round caused it to lose. As a result, it will avoid taking all these
    steps again instead of identifying which steps in the action sequence contributed
    to losing.


    ### 1.2.4 Semi-supervised learning


    Finally, let’s talk briefly about semi-supervised learning.


    Semi-supervised learning sits between supervised and unsupervised learning. As
    mentioned in the last few pages, supervised learning deals with labelled data
    and unsupervised learning uses unlabelled data.


    Sometimes, when using a large dataset of unlabelled data, we can proceed to label
    a subset of it and use semi-supervised learning to do what is called pseudo-labelling.


    What this means is that we’re going to manually label a portion of our dataset
    and let the algorithm label the rest to end up with a fully labelled set.


    For example, if we have a collection of hundreds of thousands of images of cats
    and dogs that are not already labelled, we can label a part of it ourselves and
    feed it to a semi-supervised learning algorithm that is going to find patterns
    in these images and is going to be able to take the rest of the unlabelled dataset
    as input and attach the label `cat` or `dog` to each new image, resulting in all
    the data being labelled.


    This technique allows us to generate a labelled dataset much faster than having
    to do it manually so we can then proceed to use supervised learning on it.


    Understanding which type of learning your problem falls into is usually one of
    the first steps.


    Now that we’ve covered the main ones, let’s look into some of the most well-known
    algorithms.


    ## 1.3 Algorithms


    As with standard programming, machine learning uses algorithms to help solve problems.


    However, it is not essential to understand the implementation of all algorithms
    before being able to use them. The most important is to learn which type of learning
    they belong to and the type of data they are the most efficient with.


    If you compare it with web programming, there are a lot of different JavaScript
    frameworks available, and you don’t necessarily need to understand their source
    code to be able to build your applications using them. What you need to know,
    however, is if they support the features you need.


    In the context of machine learning, some algorithms are very good at working with
    image data, while others are better at handling text data.


    Let’s dive into some of them.'
