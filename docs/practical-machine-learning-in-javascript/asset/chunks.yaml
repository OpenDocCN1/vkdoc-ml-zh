    go beyond speech recognition toward activity recognition.


    Leveraging the device’s microphone, you can use machine learning algorithms and
    sound data to predict what a user is currently doing or which room they are in.
    Accessing this information would allow us to build more personalized smart systems.
    You could imagine listening to a recipe using a Google Home, following step by
    step, and the device would be able to pause automatically when it recognizes that
    you are chopping something, or using a whisk, and so on based on recognizing patterns
    in the sound data it is receiving.


    ![../images/496132_1_En_1_Chapter/496132_1_En_1_Fig7_HTML.jpg](images/496132_1_En_1_Chapter/496132_1_En_1_Fig7_HTML.jpg)


    Figure 1-7


    Examples of spectrograms representing the sound data produced by different activities.
    Source: [*www.gierad.com/projects/ubicoustics/*](http://www.gierad.com/projects/ubicoustics/)


    ### 1.4.3 Social good


    There is a rising fear in the consequences of using machine learning to solve
    certain problems, for example, in the justice system; however, there is also a
    lot of potential of using it for social good.


    Either it be for animal protection or to prevent deforestation, the applications
    of machine learning in this space are very exciting.


    Some projects aim to protect endangered species like the killer whales (also known
    as orcas) in the Salish Sea, from British Columbia to Washington State. With only
    about 73 of them left, Google partnered with Fisheries and Oceans Canada (DFO),
    as well as Rainforest Connection, to track and monitor orca’s behavior using deep
    neural networks.


    Teaching a machine learning model to recognize orca sounds, it can then detect
    the presence of the animal and alert experts in real time. This type of system
    can help monitor the animals’ health and protect them in the event of an oil spill,
    for example.


    Another project by Rainforest Connection aims to prevent illegal deforestation
    using machine learning and used cell phones.


    The devices monitor the sounds of the forest, 24 hours a day, send all the audio
    data to the cloud, and, using TensorFlow, analyze it in real time to identify
    chainsaws, logging trucks, and all sounds of illegal activity to alert locals.


    ![../images/496132_1_En_1_Chapter/496132_1_En_1_Fig8_HTML.jpg](images/496132_1_En_1_Chapter/496132_1_En_1_Fig8_HTML.jpg)


    Figure 1-8


    Visual representation of how the Rainforest Connection project against illegal
    deforestation works. Source: [www.​ted.​com/​talks/​topher_​white_​what_​can_​save_​the_​rainforest_​your_​used_​cell_​phone#t-289131](http://www.ted.com/talks/topher_white_what_can_save_the_rainforest_your_used_cell_phone%2523t-289131)


    There are plenty more interesting projects focusing on leveraging the possibilities
    of machine learning to help social causes. Even though this is not the focus of
    this book, I encourage you to do further research if this is something you would
    like to contribute to.'
  trans: '

    ### 1.4.1 医疗保健


    在介绍系统如何用于检测 CT 扫描中的疾病时，我曾提到一个在医疗保健领域应用机器学习的例子。


    除了通过图像分析进行诊断外，该领域的其他应用还包括个性化治疗和个人记录的“数据整理”。


    临床数据并非总是数字化的，许多表格和处方仍然是手写的；即使数据是数字化的，每个医疗系统也会定制自己的电子健康记录（EHR），导致一家医院收集的数据与另一家医院收集的数据存在差异。


    数据整理是指捕获、组织和分类数据的概念。利用光学字符识别（OCR），系统可以扫描手写文档、解析单词，并使用一种称为“实体提取”的技术来理解这些单词及其之间的语义关系。


    这样一来，医疗文档可以自动保存到数据库中，并遵循统一的格式，从而便于将来进行搜索、分析或使用。


    一些最大的科技公司将其研究中心的很大一部分用于开发该领域的创新解决方案。


    例如，微软正在开展一些研究项目，如 Project InnerEye，该项目旨在将放射影像转化为测量工具。该项目的目标是利用机器学习算法，在 3D 放射影像中自动检测肿瘤，并生成精确的手术计划和导航。


    IBM 有一个名为 IBM Watson for Oncology 的项目，可帮助医生识别患者病历中的关键信息，从而探索个性化的治疗方案。


    谷歌为快速医疗互操作性资源（FHIR）标准开发了一种协议缓冲区，旨在统一医疗数据的存储方式，以便开发人员能够构建可供任何医疗机构使用的机器学习系统。


    ![../images/496132_1_En_1_Chapter/496132_1_En_1_Fig6_HTML.jpg](img/496132_1_En_1_Fig6_HTML.jpg)


    图 1-6


    使用患者健康记录构建的时间线示例。来源：[*https://ai.googleblog.com/2018/05/deep-learning-for-electronic-health.html*](https://ai.googleblog.com/2018/05/deep-learning-for-electronic-health.html)


    上述可视化图表展示了患者健康记录数据的时间线。每个灰色圆点代表存储在开放数据标准 FHIR 中的一条数据。深度学习模型随后可以分析这些数据以进行预测。


    ### 1.4.2 家庭自动化


    你可能最熟悉的机器学习应用是在家庭自动化领域。


    你可能听说过，甚至可能拥有一些使用机器学习的物联网设备，例如 Amazon Alexa 或 Google Home。


    这些设备使用语音识别算法和自然语言处理（NLP）来识别你所说的词语、分析意图，并提供尽可能准确的响应。


    值得一提的是，“联网”设备和“智能”设备之间存在区别。物联网可以定义为一个由“物”组成的互联网络，意味着设备之间通常通过 Wi-Fi 或蓝牙相互连接。


    然而，有些设备仅仅是联网的，例如 Philips Hue 灯泡，你可以通过手机远程控制它。它不使用任何机器学习算法来产生输出；它只能开关或改变颜色。


    另一方面，像 Nest 恒温器这样的设备则属于“智能设备”的范畴。它实现了更复杂的功能，因为它会随着时间的推移真正学习你的行为。当你在一段时间内（有时甚至是在同一天内）改变家里的温度时，它会学习你的习惯并自动适应。


    就像 Philips Hue 一样，它也可以让你使用手机在任何地方进行控制，但额外的学习部分是机器学习在家庭自动化中应用的一个例子。


    一些研究中心正在致力于改进像 Google Home 这样的设备，使其超越语音识别，迈向活动识别。


    利用设备的麦克风，你可以使用机器学习算法和声音数据来预测用户当前正在做什么，或者他们身处哪个房间。获取这些信息将使我们能够构建更个性化的智能系统。你可以想象一下，用
    Google Home 听一个菜谱，一步步跟着做，当设备识别出你正在切东西、使用打蛋器等动作时，它能够根据接收到的声音数据中的模式识别，自动暂停播放。


    ![../images/496132_1_En_1_Chapter/496132_1_En_1_Fig7_HTML.jpg](img/496132_1_En_1_Fig7_HTML.jpg)


    图 1-7


    代表不同活动产生的声音数据的声谱图示例。来源：[*www.gierad.com/projects/ubicoustics/*](http://www.gierad.com/projects/ubicoustics/)


    ### 1.4.3 社会公益


    对于使用机器学习解决某些问题（例如在司法系统中）的后果，人们日益感到担忧；然而，将其用于社会公益也潜力巨大。


    无论是用于动物保护还是防止森林砍伐，机器学习在这一领域的应用都非常令人兴奋。


    一些项目旨在保护濒危物种，例如从不列颠哥伦比亚省到华盛顿州的萨利希海中的虎鲸（也称为逆戟鲸）。由于仅剩约 73 头，谷歌与加拿大渔业和海洋部（DFO）以及雨林连接组织合作，利用深度神经网络追踪和监测虎鲸的行为。


    通过训练机器学习模型识别虎鲸的声音，系统可以实时检测到这种动物的存在并向专家发出警报。例如，这种系统可以帮助监测动物的健康状况，并在发生石油泄漏等事件时保护它们。


    雨林连接组织的另一个项目旨在利用机器学习和旧手机来防止非法砍伐森林。


    这些设备全天候监控森林的声音，将所有音频数据发送到云端，并使用 TensorFlow 实时分析，以识别电锯、运木卡车以及所有非法活动的声音，从而向当地人发出警报。


    ![../images/496132_1_En_1_Chapter/496132_1_En_1_Fig8_HTML.jpg](img/496132_1_En_1_Fig8_HTML.jpg)


    图 1-8


    雨林连接组织反非法砍伐项目工作原理的可视化表示。来源：[www.​ted.​com/​talks/​topher_​white_​what_​can_​save_​the_​rainforest_​your_​used_​cell_​phone#t-289131](http://www.ted.com/talks/topher_white_what_can_save_the_rainforest_your_used_cell_phone%2523t-289131)


    还有更多有趣的项目专注于利用机器学习的可能性来帮助社会公益事业。尽管这不是本书的重点，但如果你有意为此做出贡献，我鼓励你进行更深入的研究。

