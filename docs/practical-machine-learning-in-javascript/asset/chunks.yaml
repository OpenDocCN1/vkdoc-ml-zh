- fmt: '### Predictions


    After importing the tools we need, the code to run the prediction on a piece of
    text is actually pretty small!


    We need to load the model and call the `classify()` function with the sentences
    we want to run the predictions on as argument, like the following.


    ```

    toxicity.load().then((model) => {

    const sentences = [''this is really the most useless talk I have ever watched.''];

    model.classify(sentences).then((predictions) => {

    return predictions;

    });

    });

    ```


    *Listing 4-16 Loading the model and classifying new sentences*


    For a sentence like the one shown in the preceding code sample, the predictions
    return as the following array.


    ![../images/496132_1_En_4_Chapter/496132_1_En_4_Fig1_HTML.jpg](images/496132_1_En_4_Chapter/496132_1_En_4_Fig1_HTML.jpg)


    *Figure 4-1 Array of predictions returned by the preceding code sample*


    At first, you could think that it means the sentence “this is really the most
    useless talk I have ever watched” has been predicted to belong to the `identity_attack`
    label; however, that’s not it.


    The way the predictions come back with this particular model is as an array of
    objects that contain data for each label, ordered by alphabetical order.


    It can be a bit confusing, as other models used with TensorFlow.js usually produce
    predictions ordered by score.


    To get a better understanding, let’s get a deeper look into the predictions array
    that we logged earlier.


    ![../images/496132_1_En_4_Chapter/496132_1_En_4_Fig2_HTML.jpg](images/496132_1_En_4_Chapter/496132_1_En_4_Fig2_HTML.jpg)


    *Figure 4-2 Detailed view of the array of predictions returned by the preceding
    code sample*


    This screenshot represents the four first entries in the predictions array. As
    we can see, they are ordered alphabetically by label.


    To understand which label is the correct one for the input text, we need to look
    at the `probabilities` array and the `match` value.


    The `probabilities` array contains two values, the first representing the probability
    of the label being falsy, meaning the input text not being classified with that
    label, and the second value representing the probability of the label being truthy,
    meaning the input text is classified as being this type of toxic content.


    The `match` value is a more straightforward representation. If its value is `true`,
    it means the text corresponds to that label; if `false`, it doesn’t.


    Sometimes, the value of `match` is set to `null`. This happens when neither of
    the predictions exceeds the threshold provided.


    By default, this threshold is not required and has a value of `0.85`. However,
    it can be set to another value and passed to the model as an argument, like so.


    ```

    const threshold = 0.7;

    toxicity.load(threshold).then((model) => {

    const sentences = [

    "This is really the most useless talk I have ever watched.",

    ];

    model.classify(sentences).then((predictions) => {

    return predictions;

    });

    });

    ```


    *Listing 4-17 Passing a threshold as argument to the model*


    This threshold is used to determine the value of the `match` property.


    If the first value in the `probabilities` array exceeds the threshold, `match`
    is set to `false`; if instead the second value exceeds the threshold, `match`
    is set to `true`. And, as explained before, if none of the probabilities values
    exceed the threshold, `match` is set to `null`.


    Labels can also be passed as another argument to the model if you only care about
    certain ones and not all 7.


    For example, if we wanted to detect only text that would be classified with the
    label `identity_attack`, we would be passing this label as well.


    ```

    const threshold = 0.7;

    // Labels have to be passed as an array, even if you only pass a single one.

    toxicity.load(threshold, ["identity_attack"]).then((model) => {

    const sentences = [

    "This is really the most useless talk I have ever watched.",

    ];

    model.classify(sentences).then((predictions) => {

    return predictions;

    });

    });

    ```


    *Listing 4-18 Passing a label as argument to the model*


    Providing the labels you are only interested in will return filtered predictions.


    ![../images/496132_1_En_4_Chapter/496132_1_En_4_Fig3_HTML.jpg](images/496132_1_En_4_Chapter/496132_1_En_4_Fig3_HTML.jpg)


    *Figure 4-3 Predictions array returned after passing a specific label*


    Similarly to the sentiment classifier built in the previous section of this chapter,
    the accuracy of the predictions depends a lot on the data used to train the model.


    TensorFlow.js’s toxicity model was trained on a dataset of about 2 million user-generated
    online news comments published from 2015 to 2017.


    An interesting aspect of this is that datasets are often originally labelled by
    humans, meaning people have to go through all the entries and label each of them
    with a corresponding label based on a set of labels provided.


    In the case of the data used for the toxicity model, it means that people had
    to go through 2 million pieces of text, and label each of them with the label
    they thought would be the closest to the type of toxicity the comment belonged
    to, based on the labels `identity_attack`, `insult`, `obscene`, `severe_toxicity`,
    `sexual_explicit`, `threat`, and `toxicity`.


    One potential issue with this is that different people have different opinions
    about what they might classify as an `insult` or not, or what they would label
    as `toxicity` instead of `severe_toxicity`, which adds a certain level of bias
    into the data that is going to be used to train the model.


    So, not only the accuracy of the prediction depends on the quality of the data
    gathered (the online comments), it also depends on how they were labelled.


    If you are in a position where you can inspect the data that was used to train
    a model you are using in your application, I would really recommend to do it.


    Now that we went through a couple of examples of what can be done with sentiment
    analysis with TensorFlow.js, let’s look into some potential applications.


    ## 4.4 Applications


    A lot of the content we produce and share is text content. From news articles
    and blog posts to comments, chatbots interactions, social media updates, and so
    on, this vast amount of text data could offer some really interesting new opportunities,
    if used with machine learning.'
