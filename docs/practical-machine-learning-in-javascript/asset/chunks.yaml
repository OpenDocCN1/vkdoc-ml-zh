- fmt: '# Web Accessibility


    Another application you might not have noticed is currently implemented in a service
    you probably know. Indeed, if you are using YouTube, you may have come across
    **live ambient sound captioning**.


    If you have ever activated captions on a YouTube video, you may know of spoken
    words being displayed as an overlay at the bottom. However, there are more information
    in a video than what can be found in the transcripts. Indeed, people without hearing
    impairment benefit from having access to additional information in the form of
    contextual sounds like music playing or the sound of rain in a video. Only displaying
    spoken words in captions can cut quite a lot of information out for people with
    hearing impairment.


    About 3 years ago, in 2017, YouTube released live ambient sound captioning that
    uses acoustic recognition to add to the captions details about ambient sounds
    detected in the soundtrack of a video. Here is an example.


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig23_HTML.jpg](images/496132_1_En_5_Chapter/496132_1_En_5_Fig23_HTML.jpg)


    **Figure 5-23** Example of live ambient sound captioning on YouTube


    The preceding screenshot is taken from an interview between Janelle Monae and
    Pharrell Williams where the captions are activated. Spoken words are displayed
    as expected, but we can also see ambient sounds like `[Applause]`. People with
    hearing impairment can now have the opportunity to get more information about
    the video than only dialogues.


    At the moment, the ambient sounds that can be detected on YouTube videos include:


    - Applause

    - Music playing

    - Laughter


    It might not seem like much, but again, this is something we take for granted
    if we never have to think about the experience some people with disabilities have
    on these platforms. Besides, thinking this feature has been implemented about
    3 years ago already shows that a major technology company like Google has been
    actively exploring the potential of using machine learning with audio data and
    has been working on finding useful applications.


    ## 5.1.8 Limits


    Now that we covered how to experiment with acoustic activity recognition in JavaScript
    and a few different applications, it is important to be aware of some of the limitations
    of such technology to have a better understanding of the real opportunities.


    ### Quality and quantity of the data


    If you decide to build a similar acoustic activity recognition system from scratch
    and write your own model without using transfer learning and the speech commands
    model from TensorFlow.js, you are going to need to collect a lot more sound samples
    than the minimum of 8 required when using Teachable Machine. To gather a large
    amount of samples, you can either decide to record them yourself or buy them from
    a professional audio library.


    Another important point is to make sure to check the quality of the data recorded.
    If you want to detect the sound of a vacuum cleaner running, for example, make
    sure that there is no background noise and that the vacuum cleaner can be clearly
    heard in the audio track.


    One tip to generate samples of data from a single one is to use an audio editing
    software to change some parameters of a single audio source to create multiple
    versions of it. You can, for example, modify the reverb, the pitch, and so on.


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig24_HTML.jpg](images/496132_1_En_5_Chapter/496132_1_En_5_Fig24_HTML.jpg)


    **Figure 5-24** Transforming sounds. Gierad Laput, Karan Ahuja, Mayank Goel, and
    Chris Harrison. 2018. Ubicoustics: Plug-and-Play Acoustic Activity Recognition.
    In The 31st Annual ACM Symposium on User Interface Software and Technology (UIST
    ''18). ACM, New York, NY, USA, 213-224. DOI: [`https://doi.org/10.1145/3242587.3242609`](https://doi.org/10.1145/3242587.3242609)


    ### Single activity


    At the moment, this technology seems to be efficient in recognizing a single sound
    at once. For example, if you trained your model to recognize the sound of someone
    speaking as well as the sound of running water, if you placed your system in the
    kitchen and the user was speaking as well as washing the dishes, the activity
    predicted would only be the one with the highest score in the predictions returned.
    However, as the system runs continuously, it would probably get confused between
    the two activities. It would probably alternate between “speaking” and “running
    water” until one of the activities stopped.


    This would definitely become a problem if you built an application that can detect
    sounds produced by activities that can be executed at the same time. For example,
    let’s imagine you usually play music while taking a shower and you built an application
    that can detect two activities: the sound of the shower running and speaking.
    You want to be able to trigger a counter whenever it detects that the shower is
    running so you can avoid taking long showers and save water. You also want to
    be able to lower the sound of your speakers when it detects that someone is speaking
    in the bathroom.


    As these two activities can happen at the same time (you can speak while taking
    a shower), the system could get confused between the two activities and detect
    the shower running for a second and someone speaking the next. As a result, it
    would start and stop the speakers one second, and start/stop the counter the next.
    This would definitely not create an ideal experience.


    However, this does not mean that there is no potential in building applications
    using acoustic activity recognition, it only means that we would need to work
    around this limitation. Besides, some research is being done around developing
    systems that can handle the detection of multiple activities at once. We will
    look into it in the next few pages.'
