    a word to a common base form.


    As related words can have similar meanings, these tools help reduce them to a
    single one.


    For example:


    *   “Eat”, “Eats”, “Eating” becomes “Eat”.


    *   “Computer”, “Computers”, “Computer’s” becomes “Computer”.


    The result of this mapping would look something like this:


    “They are all **eating** in front of their **computers**” => “They are all **eat**
    in front of their **computer**”.


    This kind of technique is helpful for use cases where we would want to find results
    for more than an exact input, for example, with search engines.


    When we execute a search, we generally are interested in getting relevant results,
    not only for the exact search terms that we used but also for other possible forms
    of these words.


    For example, if I run a search using the words “Hike Europe”, I’m also interested
    in results that will have the word “hikes” and “hiking” or “hikers”, and so on.'
