  trans: '

    #### 预测


    在导入所需的工具后，用于对一段文本运行预测的代码实际上非常简洁！


    我们需要加载模型，并调用 `classify()` 函数，将我们想要运行预测的句子作为参数传入，如下所示。


    ```

    toxicity.load().then((model) => {

    const sentences = [''this is really the most useless talk I have ever watched.''];

    model.classify(sentences).then((predictions) => {

    return predictions;

    });

    });

    代码清单 4-16

    加载模型并对新句子进行分类

    ```


    对于前面代码示例中所示的句子，预测结果返回为以下数组。


    ![../images/496132_1_En_4_Chapter/496132_1_En_4_Fig1_HTML.jpg](img/496132_1_En_4_Fig1_HTML.jpg)


    图 4-1


    前面代码示例返回的预测结果数组


    起初，你可能会认为这意味着句子 “this is really the most useless talk I have ever watched” 被预测属于
    “identity_attack” 标签；然而，事实并非如此。


    这个特定模型返回预测结果的方式是：以一个对象数组的形式呈现，其中包含每个标签的数据，并按字母顺序排列。


    这可能会有点令人困惑，因为 TensorFlow.js 使用的其他模型通常按分数高低返回预测结果。


    为了更好地理解，让我们更深入地看看之前记录的预测结果数组。


    ![../images/496132_1_En_4_Chapter/496132_1_En_4_Fig2_HTML.jpg](img/496132_1_En_4_Fig2_HTML.jpg)


    图 4-2


    前面代码示例返回的预测结果数组的详细视图


    这张截图展示了预测结果数组中的前四个条目。正如我们所见，它们按标签的字母顺序排列。


    要理解哪个标签对于输入文本是正确的，我们需要查看 “probabilities” 数组和 “match” 值。


    “probabilities” 数组包含两个值，第一个值代表标签为假（即输入文本未被分类为该标签）的概率，第二个值代表标签为真（即输入文本被分类为此类有害内容）的概率。


    “match” 值则是一种更直接的表示。如果其值为 “true”，表示文本与该标签对应；如果为 “false”，则表示不对应。


    有时，“match” 的值会被设置为 “null”。当两个预测值均未超过提供的阈值时，就会发生这种情况。


    默认情况下，此阈值并非必需，其值为 0.85。但是，可以将其设置为其他值，并作为参数传递给模型，如下所示。


    ```

    const threshold = 0.7;

    toxicity.load(threshold).then((model) => {

    const sentences = [

    "This is really the most useless talk I have ever watched.",

    ];

    model.classify(sentences).then((predictions) => {

    return predictions;

    });

    });

    代码清单 4-17

    将阈值作为参数传递给模型

    ```


    此阈值用于确定 “match” 属性的值。


    如果 “probabilities” 数组中的第一个值超过阈值，则 “match” 设置为 “false”；如果第二个值超过阈值，则 “match” 设置为
    “true”。并且，如前所述，如果两个概率值均未超过阈值，则 “match” 设置为 “null”。


    如果你只关心某些特定标签，而不是全部 7 个，也可以将标签作为另一个参数传递给模型。


    例如，如果我们只想检测会被分类为 “identity_attack” 标签的文本，我们也需要传递这个标签。


    ```

    const threshold = 0.7;

    // 即使只传递一个标签，也必须以数组形式传递。

    toxicity.load(threshold, ["identity_attack"]).then((model) => {

    const sentences = [

    "This is really the most useless talk I have ever watched.",

    ];

    model.classify(sentences).then((predictions) => {

    return predictions;

    });

    });

    代码清单 4-18

    将标签作为参数传递给模型

    ```


    仅提供你感兴趣的标签将返回过滤后的预测结果。


    ![../images/496132_1_En_4_Chapter/496132_1_En_4_Fig3_HTML.jpg](img/496132_1_En_4_Fig3_HTML.jpg)


    图 4-3


    传递特定标签后返回的预测结果数组


    与本章前一节构建的情感分类器类似，预测的准确性在很大程度上取决于用于训练模型的数据。


    TensorFlow.js 的有害内容模型是在一个包含约 200 万条用户生成的在线新闻评论的数据集上训练的，这些评论发布于 2015 年至 2017 年。


    有趣的一点是，数据集通常最初由人工标注，这意味着人们需要遍历所有条目，并根据提供的一组标签，为每个条目打上相应的标签。


    就用于有害内容模型的数据而言，这意味着人们需要处理 200 万条文本，并根据 “identity_attack”、“insult”、“obscene”、“severe_toxicity”、“sexual_explicit”、“threat”
    和 “toxicity” 这些标签，为每条文本打上他们认为最接近该评论所属有害类型的标签。


    这样做的一个潜在问题是，不同的人对于什么可以归类为 “insult” 或不是 “insult”，或者什么应该标记为 “toxicity” 而不是 “severe_toxicity”
    有不同的看法，这给将要用于训练模型的数据增加了一定程度的偏差。


    因此，预测的准确性不仅取决于收集到的数据（在线评论）的质量，还取决于这些数据是如何被标注的。


    如果你有机会检查应用程序中使用的模型所训练的数据，我强烈建议你这样做。


    现在，我们已经了解了几个使用 TensorFlow.js 进行情感分析的示例，接下来让我们看看一些潜在的应用。


    ## 4.4 应用


    我们产生和分享的很多内容都是文本内容。从新闻文章、博客文章到评论、聊天机器人交互、社交媒体更新等等，这些海量的文本数据如果与机器学习结合使用，可以提供一些非常有趣的新机遇。

    '
- fmt: '### Cognitive Assistants and Computer Therapy


    Whether in the form of chatbots or voice assistants like Siri, certain conversational
    agents could benefit from integrating sentiment analysis.


    In the past few years, some companies have tried to develop systems to provide
    psychological help and coaching in the form of chatbots. These companies focus
    on offering tailored advice and support in the aim of allowing people to do some
    kind of DIY cognitive behavioral therapy (CBT). CBT uses structured exercises
    to encourage a person to question and change their habits of thought. This step-by-step
    format seems well suited for chatbots.


    Companies like Orexo, Woebot, Pear, and Wysa personalize their services to each
    person based on their answers to questions. Orexo focuses on helping users change
    their drinking habits by asking a set of questions about current behavioral patterns
    and tailoring a program based on the answers provided. Woebot, a chatbot built
    on Stanford research, aims at making mental healthcare accessible to everyone,
    by providing personalized expert-crafted tools to learn about yourself and improve
    your mood whenever you need it.


    ![../images/496132_1_En_4_Chapter/496132_1_En_4_Fig4_HTML.jpg](images/496132_1_En_4_Chapter/496132_1_En_4_Fig4_HTML.jpg)


    **Figure 4-4** Screenshot of the application Woebot


    Pear Therapeutics is a company at the intersection of biology and software that
    aims at creating the next generation of therapeutics. It has released two digital
    services called `reSET` and `reSET-0` that intend to provide support and CBT to
    people with substance abuse disorders.


    Wysa, an AI-based “emotionally intelligent” chatbot, provides self-care exercises
    organized in packs to help deal with issues such as managing your mood, overcoming
    loneliness, improving sleep, and so on. Unlike other applications, it also gives
    you the opportunity to pay for a real session with a professional therapist within
    the app.


    ![../images/496132_1_En_4_Chapter/496132_1_En_4_Fig6_HTML.jpg](images/496132_1_En_4_Chapter/496132_1_En_4_Fig6_HTML.jpg)


    **Figure 4-6** Screenshot of the self-care packs found in the application Wysa


    ![../images/496132_1_En_4_Chapter/496132_1_En_4_Fig5_HTML.jpg](images/496132_1_En_4_Chapter/496132_1_En_4_Fig5_HTML.jpg)


    **Figure 4-5** Screenshot of the home screen of the application Wysa


    Some of these applications even got approved by the FDA, the Food and Drug Administration
    in the United States. Another one of them is a game called `EndeavorRx` by Akili
    Interactive, which trials showed it can help children with ADHD (attention deficit
    hyperactivity disorder) improve their level of attention. This game was built
    based on research to deliver sensory and motor stimuli to selectively target and
    activate specific cognitive neural systems in the brain.


    Even though these applications do not replace face-to-face interactions with a
    therapist, one of their benefits is their constant availability. Getting a daily
    consultation with a real doctor would be very costly and time-consuming; however,
    a digital one on your phone can make it easier to keep track of your progress
    and provide help in urgent moments. Besides, there are probably not enough clinicians
    available to help the amount of people in need. For example, the chatbot Woebot
    exchanges about 4.7 million messages with people per week; there just wouldn’t
    be enough practitioners to handle that.


    Even though there is potential in these self-help digital services, it is very
    important to remember that the technology is not perfect. As machine learning
    algorithms get better at analyzing and understanding all information contained
    in the way we communicate, there can only be improvements in the future, but for
    now, a lot of these applications have limited abilities and should be used with
    that in mind. If this is a space you are interested in, I would highly recommend
    to try a few of these applications to get a better sense of the features and interactions
    currently available.


    ### Social Media Monitoring


    Another interesting opportunity is in improving users’ interactions on social
    media by providing some kind of monitoring tool. If you are regularly using any
    social media platform like Facebook or Twitter, you are probably familiar with
    the toxicity of some of the content users decide to share, either in the form
    of status updates or comments on your posts. This type of toxic interactions can
    have a negative psychological impact on people, which could be avoided using sentiment
    analysis.


    At the moment, if anyone is interacting in a toxic way with you on a platform,
    you do not really have the option to avoid it. You might decide to ignore it,
    but only after you’ve seen the content at least once, which often already impacts
    you negatively. However, if every piece of content shared was first run by a machine
    learning model to detect the level of toxicity, social media platforms could provide
    warnings about the content the user is about to see, and let them decide if they
    want to view it or not. The same way content described as “adult content” is often
    hidden behind some kind of warning, platforms could empower users to make their
    own decisions.


    More recently, Twitter has released warnings on tweets considered to be potentially
    spreading incorrect information about the disease COVID-19.


    ![../images/496132_1_En_4_Chapter/496132_1_En_4_Fig7_HTML.jpg](images/496132_1_En_4_Chapter/496132_1_En_4_Fig7_HTML.jpg)


    **Figure 4-7** Examples of warnings displayed on tweets that were potentially
    spreading wrong information. Source: [www.vox.com/recode/2020/5/11/21254889/twitter-coronavirus-covid-misinformation-warnings-labels](https://www.vox.com/recode/2020/5/11/21254889/twitter-coronavirus-covid-misinformation-warnings-labels)


    Users could still click “View” if they wanted to read the content, but were warned
    that it was potentially harmful, as it was going against guidance from public
    health experts.


    Additionally, this technique could also be used to attempt to prevent the sharing
    of toxic content by providing a warning to the person about to post. When using
    social media platforms, you could imagine an icon next to the usual “Add emojis”
    or “Add pictures” icon that would get into an active state if the tweet a user
    is about to send, or post they are about to share, was classified as being toxic.
    This would not stop anyone from sharing but would provide people with an opportunity
    to take a step back and think twice about the impact of their words on other people.


    Both of these opportunities do not completely resolve the issue of toxic content
    on the Internet but use machine learning and sentiment analysis as a help to make
    the Web a safer place.'
