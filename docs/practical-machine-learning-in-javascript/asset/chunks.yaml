    为了实现逻辑，我们可以创建一个新函数，将其命名为 `addExample`。这个函数将从网络摄像头捕获一张图像，将其转换为张量，用图像张量及其标签重新训练
    `mobilenet` 模型，将该示例添加到 KNN 分类器，并释放张量。


