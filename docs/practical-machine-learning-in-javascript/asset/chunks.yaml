  trans: "\n### 5.1.5 预测\n\n在开始编写代码之前，我们需要导入 TensorFlow.js 和语音指令模型。\n\n```\n清单 5-11\n\
    在 HTML 文件中导入 TensorFlow.js 和语音指令模型\n```\n\n正如我之前提到的，这个实验使用了迁移学习，因此我们需要导入一个已经用音频数据训练好的语音指令模型，以便更简单、更快速地入门。\n\
    \n该语音指令模型最初是为了识别和分类口语词汇（如“是”、“否”、“上”、“下”）而训练的。然而，在这里，我们将其用于活动产生的声音，因此其准确性可能不如在样本中使用口语词汇时那么高。\n\
    \n**在阅读其余代码示例之前，请确保你已从 Teachable Machine 平台下载了训练好的模型，解压缩后，将其添加到你的应用程序文件夹中。**\n\
    \n**以下代码示例将假设你的模型存储在应用程序根目录下名为 `activities-model` 的文件夹中。**\n\n总的来说，你的文件结构应该类似于这样：\n\
    \n*   activities-model/\n    *   metadata.json\n\n*   model.json\n\n*   weights.bin\n\
    \n*   index.html\n\n*   index.js\n\n在我们的 JavaScript 文件中，我们需要创建一个函数来加载模型并开始实时预测，但在此之前，我们可以创建两个变量来保存模型和元数据文件的路径。\n\
    \n```\nlet URL = \"http://localhost:8000/activities-model/\";\nconst modelURL\
    \ = `${URL}/model.json`;\nconst metadataURL = `${URL}metadata.json`;\n清单 5-12\n\
    引用模型及其元数据的变量\n```\n\n你可能已经注意到，我在前面的代码中使用了 `localhost:8000`；不过，你可以随意更改端口，并且如果决定将应用程序发布到生产环境，请务必更新此地址。\n\
    \n然后，我们需要加载模型，并确保在继续之前模型已加载完成。\n\n```\nconst model = window.speechCommands.create(\n\
    \"BROWSER_FFT\",\nundefined,\nmodelURL,\nmetadataURL\n);\nawait model.ensureModelLoaded();\n\
    清单 5-13\n加载模型\n```\n\n模型准备就绪后，我们可以通过调用模型上的 `listen` 方法来运行实时预测。\n\n```\nmodel.listen(\n\
    (prediction) => {\npredictionCallback(prediction.scores);\n},\nmodelParameters\n\
    );\n清单 5-14\n实时预测\n```\n\n总的来说，`setupModel` 函数应该如下所示。\n\n```\nasync function setupModel(URL,\
    \ predictionCB) {\npredictionCallback = predictionCB;\nconst modelURL = `${URL}/model.json`;\n\
    const metadataURL = `${URL}metadata.json`;\nmodel = window.speechCommands.create(\n\
    \"BROWSER_FFT\",\nundefined,\nmodelURL,\nmetadataURL\n);\nawait model.ensureModelLoaded();\n\
    const modelParameters = {\ninvokeCallbackOnNoiseAndUnknown: true, // 即使只检测到背景噪音也运行\n\
    includeSpectrogram: true,\noverlapFactor: 0.5, // 每秒采样音频的频率，0.5 表示每秒两次\n};\nmodel.listen(\n\
    (prediction) => {\npredictionCallback(prediction.scores);\n},\nmodelParameters\n\
    );\n}\n清单 5-15\n完整代码示例\n```\n\n调用此函数时，每次模型有预测结果时，都会在回调中包含预测数据。\n\n```\ndocument.body.onclick\
    \ = () => {\nsetupModel(URL, (data) => {\nconsole.log(data)\n});\n}\n清单 5-16\n\
    调用函数\n```\n\n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig16_HTML.jpg](img/496132_1_En_5_Fig16_HTML.jpg)\n\
    \n图 5-16\n\n调用函数时返回的数据示例\n\n这个包含预测结果的数组按使用的标签排序。在前面的示例中，我使用了六个不同的标签来训练模型，因此返回的每个数组都包含六个值。\n\
    \n在每个数组中，最接近 1 的值代表预测的标签。\n\n为了将预测的数据与正确的标签匹配，我们可以创建一个包含训练时所用标签的数组，并在调用 `setupModel`\
    \ 函数时使用它。\n\n```\nconst labels = [\n\"Coughing\",\n\"Phone ringing\",\n\"Speaking\"\
    ,\n\"_background_noise_\",\n];\nlet currentPrediction;\ndocument.body.onclick\
    \ = () => {\nsetupModel(URL, (data) => {\nlet maximum = Math.max(...data);\nif\
    \ (maximum > 0.7) {\nlet maxIndex = data.indexOf(maximum);\ncurrentPrediction\
    \ = labels[maxIndex];\nconsole.log(currentPrediction);\n}\n});\n}\n清单 5-17\n将分数映射到标签\n\
    ```\n\n用不到 100 行的 JavaScript 代码，我们就能够加载并运行一个可以对实时音频输入进行分类的机器学习模型！\n\n```\nlet\
    \ model, predictionCallback;\nlet URL = \"http://localhost:8000/activities-model/\"\
    ;\nconst labels = [\n\"Coughing\",\n\"Phone ringing\",\n\"Speaking\",\n\"_background_noise_\"\
    ,\n];\nlet currentPrediction, previousPrediction;\ncurrentPrediction = previousPrediction;\n\
    document.body.onclick = () => {\nsetupModel(URL, (data) => {\nlet maximum = Math.max(...data);\n\
    if (maximum > 0.7) {\nlet maxIndex = data.indexOf(maximum);\ncurrentPrediction\
    \ = labels[maxIndex];\nconsole.log(currentPrediction);\n}\n});\n};\nasync function\
    \ setupModel(URL, predictionCB) {\nconst modelURL = `${URL}/model.json`;\nconst\
    \ metadataURL = `${URL}metadata.json`;\nmodel = window.speechCommands.create(\n\
    \"BROWSER_FFT\",\nundefined,\nmodelURL,\nmetadataURL\n);\nawait model.ensureModelLoaded();\n\
    // 这告诉模型在监听音频时如何运行\nconst modelParameters = {\ninvokeCallbackOnNoiseAndUnknown:\
    \ true, // 即使只检测到背景噪音也运行\nincludeSpectrogram: true, // 让我们访问数值音频数据\noverlapFactor:\
    \ 0.5, // 每秒采样音频的频率，0.5 表示每秒两次\n};\nmodel.listen(\n(prediction) => {\npredictionCallback(prediction.scores);\n\
    },\nmodelParameters\n);\n}\n清单 5-18\n完整代码示例\n```\n\n### 5.1.6 迁移学习 API\n\n在上一节中，为了简单起见，我们介绍了如何使用\
    \ Teachable Machine 实验录制声音样本并训练模型。但是，如果你想在自己的应用程序中实现此功能，并让用户自己运行相同的过程，则可以使用迁移学习\
    \ API。\n\n此 API 允许你构建自己的界面，并调用 API 端点来录制样本、训练模型以及运行实时预测。\n"
- fmt: '### Recording samples


    Let’s imagine a very simple web interface with a few buttons.


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig17_HTML.jpg](images/496132_1_En_5_Chapter/496132_1_En_5_Fig17_HTML.jpg)


    Figure 5-17: Web interface with a few button elements


    Some of these buttons are used to collect sample data, one button to start the
    training and the last one to trigger the live predictions.


    To get started, we need an HTML file with these six buttons and two script tags
    to import TensorFlow.js and the Speech Commands model.


    ```

    Speech recognition


    Red

    Blue

    Green

    Background

    Train

    Predict


    Listing 5-19: HTML file

    ```


    In the JavaScript file, before being able to run these actions, we need to create
    the model, ensure it is loaded, and pass a main label to our model to create a
    collection that will contain our audio samples.


    ```

    const init = async () => {

    const baseRecognizer = speechCommands.create("BROWSER_FFT");

    await baseRecognizer.ensureModelLoaded();

    transferRecognizer = baseRecognizer.createTransfer("colors");

    };

    Listing 5-20: Set up the recognizers

    ```


    Then, we can add event listeners on our buttons so they will collect samples on
    click. For this, we need to call the `collectExample` method on our recognizer
    and pass it a string we would like the sample to be labelled with.


    ```

    const redButton = document.getElementById("red");

    redButton.onclick = async () => await transferRecognizer.collectExample("red");

    Listing 5-21: Collecting samples

    ```


    To start the training, we call the `train` method on the recognizer.


    ```

    const trainButton = document.getElementById("train");

    trainButton.onclick = async () => {

    await transferRecognizer.train({

    epochs: 25,

    callback: {

    onEpochEnd: async (epoch, logs) => {

    console.log(`Epoch ${epoch}: loss=${logs.loss}, accuracy=${logs.acc}`);

    },

    },

    });

    };

    Listing 5-22: Training

    ```


    And finally, to classify live audio inputs after training, we call the `listen`
    method.


    ```

    const predictButton = document.getElementById("predict");

    predictButton.onclick = async () => {

    await transferRecognizer.listen(

    (result) => {

    const words = transferRecognizer.wordLabels();

    for (let i = 0; i < words.length; ++i) {

    console.log(`score for word ''${words[i]}'' = ${result.scores[i]}`);

    }

    },

    { probabilityThreshold: 0.75 }

    );

    };

    Listing 5-23: Predict

    ```


    Altogether, this code sample looks like the following.


    ```

    let transferRecognizer;

    const init = async () => {

    const baseRecognizer = speechCommands.create("BROWSER_FFT");

    await baseRecognizer.ensureModelLoaded();

    transferRecognizer = baseRecognizer.createTransfer("colors");

    };

    init();

    const redButton = document.getElementById("red");

    const backgroundButton = document.getElementById("background");

    const trainButton = document.getElementById("train");

    const predictButton = document.getElementById("predict");

    redButton.onclick = async () => await transferRecognizer.collectExample("red");

    backgroundButton.onclick = async () =>

    await transferRecognizer.collectExample("_background_noise_");

    trainButton.onclick = async () => {

    await transferRecognizer.train({

    epochs: 25,

    callback: {

    onEpochEnd: async (epoch, logs) => {

    console.log(`Epoch ${epoch}: loss=${logs.loss}, accuracy=${logs.acc}`);

    },

    },

    });

    };

    predictButton.onclick = async () => {

    await transferRecognizer.listen(

    (result) => {

    const words = transferRecognizer.wordLabels();

    for (let i = 0; i < words.length; ++i) {

    console.log(`score for word ''${words[i]}'' = ${result.scores[i]}`);

    }

    },

    { probabilityThreshold: 0.75 }

    );

    };

    Listing 5-24: Full code sample

    ```


    ### 5.1.7 Applications


    Even though the examples I have used so far for our code samples (speaking and
    coughing) might have seemed simple, the way this technology is currently being
    used shows how interesting it can be.


    #### Health


    In July 2020, Apple announced the release of a new version of their watchOS that
    included an application triggering a countdown when the user washes their hands.
    Related to the advice from public health officials around avoiding the spread
    of COVID-19, this application uses the watch’s microphone to detect the sound
    of running water and trigger the 20 seconds countdown.


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig19_HTML.jpg](images/496132_1_En_5_Chapter/496132_1_En_5_Fig19_HTML.jpg)


    Figure 5-19: Interface of the countdown on the Apple Watch


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig18_HTML.jpg](images/496132_1_En_5_Chapter/496132_1_En_5_Fig18_HTML.jpg)


    Figure 5-18: Countdown triggered when the user washes their hands


