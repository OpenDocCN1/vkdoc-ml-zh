  raw: '#### Recording samples


    Let’s imagine a very simple web interface with a few buttons.


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig17_HTML.jpg](images/496132_1_En_5_Chapter/496132_1_En_5_Fig17_HTML.jpg)


    Figure 5-17


    Web interface with a few button elements


    Some of these buttons are used to collect sample data, one button to start the
    training and the last one to trigger the live predictions.


    To get started, we need an HTML file with these six buttons and two script tags
    to import TensorFlow.js and the Speech Commands model.


    ```


    Speech recognition


    Red

    Blue

    Green

    Background

    Train

    Predict


    Listing 5-19

    HTML file

    ```


    In the JavaScript file, before being able to run these actions, we need to create
    the model, ensure it is loaded, and pass a main label to our model to create a
    collection that will contain our audio samples.


    ```

    const init = async () => {

    const baseRecognizer = speechCommands.create("BROWSER_FFT");

    await baseRecognizer.ensureModelLoaded();

    transferRecognizer = baseRecognizer.createTransfer("colors");

    };

    Listing 5-20

    Set up the recognizers

    ```


    Then, we can add event listeners on our buttons so they will collect samples on
    click. For this, we need to call the `collectExample` method on our recognizer
    and pass it a string we would like the sample to be labelled with.


    ```

    const redButton = document.getElementById("red");

    redButton.onclick = async () => await transferRecognizer.collectExample("red");

    Listing 5-21

    Collecting samples

    ```


    To start the training, we call the `train` method on the recognizer.


    ```

    const trainButton = document.getElementById("train");

    trainButton.onclick = async () => {

    await transferRecognizer.train({

    epochs: 25,

    callback: {

    onEpochEnd: async (epoch, logs) => {

    console.log(`Epoch ${epoch}: loss=${logs.loss}, accuracy=${logs.acc}`);

    },

    },

    });

    };

    Listing 5-22

    Training

    ```


    And finally, to classify live audio inputs after training, we call the `listen`
    method .


    ```

    const predictButton = document.getElementById("predict");

    predictButton.onclick = async () => {

    await transferRecognizer.listen(

    (result) => {

    const words = transferRecognizer.wordLabels();

    for (let i = 0; i < words.length; ++i) {

    console.log(`score for word ''${words[i]}'' = ${result.scores[i]}`);

    }

    },

    { probabilityThreshold: 0.75 }

    );

    };

    Listing 5-23

    Predict

    ```


    Altogether, this code sample looks like the following.


    ```

    let transferRecognizer;

    const init = async () => {

    const baseRecognizer = speechCommands.create("BROWSER_FFT");

    await baseRecognizer.ensureModelLoaded();

    transferRecognizer = baseRecognizer.createTransfer("colors");

    };

    init();

    const redButton = document.getElementById("red");

    const backgroundButton = document.getElementById("background");

    const trainButton = document.getElementById("train");

    const predictButton = document.getElementById("predict");

    redButton.onclick = async () => await transferRecognizer.collectExample("red");

    backgroundButton.onclick = async () =>

    await transferRecognizer.collectExample("_background_noise_");

    trainButton.onclick = async () => {

    await transferRecognizer.train({

    epochs: 25,

    callback: {

    onEpochEnd: async (epoch, logs) => {

    console.log(`Epoch ${epoch}: loss=${logs.loss}, accuracy=${logs.acc}`);

    },

    },

    });

    };

    predictButton.onclick = async () => {

    await transferRecognizer.listen(

    (result) => {

    const words = transferRecognizer.wordLabels();

    for (let i = 0; i < words.length; ++i) {

    console.log(`score for word ''${words[i]}'' = ${result.scores[i]}`);

    }

    },

    { probabilityThreshold: 0.75 }

    );

    };

    Listing 5-24

    Full code sample

    ```


    ### 5.1.7 Applications


