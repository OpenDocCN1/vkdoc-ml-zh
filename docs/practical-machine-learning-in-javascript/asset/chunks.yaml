    ### 5.3.5 Creating and training the model


    This part of the code is a bit arbitrary as there are multiple ways to create
    models and to pick values for parameters. However, you can copy the following
    code as a starting point and play around with different values later to see how
    they impact the accuracy of the model.


    ```javascript

    const createModel = async (featureTrain, labelTrain, featureTest, labelTest) =>
    {

    const params = { learningRate: 0.1, epochs: 40 };

    // Instantiate a sequential model

    const model = tf.sequential();

    // Add a few layers

    model.add(

    tf.layers.dense({

    units: 10,

    activation: "sigmoid",

    inputShape: [featureTrain.shape[1]],

    })

    );

    model.add(tf.layers.dense({ units: numClasses, activation: "softmax" }));

    model.summary();

    const optimizer = tf.train.adam(params.learningRate);

    model.compile({

    optimizer: optimizer,

    loss: "categoricalCrossentropy",

    metrics: ["accuracy"],

    });

    // Train the model with our features and labels

    await model.fit(featureTrain, labelTrain, {

    epochs: params.epochs,

    validationData: [featureTest, labelTest],

    });

    // Save the model in our file system.

    await model.save("file://model");

    return model;

    };

