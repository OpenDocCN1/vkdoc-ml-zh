  trans: '

    ### 2.2.1 使用预训练模型


    在本书的第一章中，我们将“模型”一词定义为一个数学函数，它可以根据训练过的数据，接收新参数来进行预测。


    如果这个定义对你来说仍然有些令人困惑，那么在讨论这第一个特性时将其置于具体语境中，希望能让它变得更清晰一些。


    在机器学习中，为了能够预测结果，我们需要一个模型。然而，并不需要你自己构建这个模型。完全可以使用所谓的“预训练模型”。


    “预训练”一词意味着该模型已经使用特定类型的输入数据进行了训练，并且是为特定目的而开发的。


    例如，你可以找到一些专注于目标检测和识别的开源预训练模型。这些模型已经输入了数百万张物体图像，经历了完整的训练过程，并且在预测新实体时应该具有令人满意的准确度。


    创建这些模型的公司或机构将其开源，以便开发者可以在他们的应用程序中使用它们，并有机会更快地构建机器学习项目。


    正如你可以想象的，收集数据、格式化数据、标注数据、尝试不同算法和参数的过程可能需要大量时间，因此能够通过使用预训练模型来替代这项工作，可以腾出大量时间来专注于构建应用程序。


    目前可用于 TensorFlow.js 的预训练模型包括身体分割、姿态估计、目标检测、图像分类、语音命令识别和情感分析。


    在你的应用程序中使用预训练模型相对容易。


    在下面的代码示例中，我们将使用 mobilenet 目标检测模型来预测新图像中的实体。


    ```

    const img = document.getElementById("img");

    const model = await mobilenet.load();

    const predictions = await model.classify(img);

    return predictions;

    清单 2-14

    使用 mobilenet 模型对图像进行分类

    ```


    在实际应用中，这段代码需要事先引入 TensorFlow.js 库和 mobilenet 预训练模型，但在接下来的几章中，当我们深入构建实际项目时，会展示更完整的代码示例。


    前面的示例首先获取应包含我们要预测图像的 HTML 元素。下一步是异步加载 mobilenet 模型。


    模型可能体积相当大，有时达几兆字节，因此需要使用 `async/await` 来加载，以确保在你运行预测时，此操作已完全完成。


    一旦模型准备就绪，你就可以在其上调用 `classify()` 方法，并将你的 HTML 元素传入，该方法将返回一个预测数组。


    在一个使用猫的图像的示例中，预测的输出将类似于这样。


    ![../images/496132_1_En_2_Chapter/496132_1_En_2_Fig3_HTML.jpg](img/496132_1_En_2_Fig3_HTML.jpg)


    图 2-3


    将 mobilenet 模型应用于前面猫的图片后，图像分类的结果


    ![../images/496132_1_En_2_Chapter/496132_1_En_2_Fig2_HTML.jpg](img/496132_1_En_2_Fig2_HTML.jpg)


    图 2-2


    一张猫的图片


    使用 `classify()` 的结果始终是一个包含三个对象的数组，每个对象包含两个键：*className* 和 *probability*。


    className 是一个字符串，包含模型根据其先前训练过的数据对新输入进行分类的标签或类别。


    probability 是一个介于 0 和 1 之间的浮点值，表示输入数据属于该 className 的可能性，0 表示不可能，1 表示非常可能。


    它们按降序排列，因此数组中的第一个对象是最有可能为真的预测。


    在前面的输出中，模型预测图像包含一只“虎斑猫”的可能性为 70%。


    其余预测的概率值下降得相当显著，有 21% 的可能性包含一只“斑猫”，以及大约 0.02% 的可能性包含一个“领结”。


    通常，你会关注预测中返回的第一个值，因为它具有最高的概率；然而，70% 实际上并不算高。


    在机器学习中，你的目标是使用预测时获得尽可能高的概率。在这种情况下，我们只是预测了图像中存在一只猫，但在实际应用中，你可以想象，有 30% 的概率预测出错误的结果是不可接受的。


    为了改进这一点，通常我们会进行所谓的“超参数调优”并重新训练模型。


    **超参数调优** 是调整和优化生成模型时所用参数的过程。它可能包括在神经网络中添加层、改变批量大小等等，并观察这些变化对模型性能和准确度的影响。


    然而，当使用预训练模型时，你将无法做到这一点，因为你唯一能访问的是输出的模型，而不是用于创建它的代码。


    这是使用预训练模型带来的局限性之一。


    当使用这些模型时，你无法控制它们是如何创建的以及如何修改它们。你通常无法访问训练过程中使用的数据集，因此无法确定它是否能满足你应用程序的要求。


    此外，你还面临着继承该公司或机构偏见的风险。


    如果你的应用程序涉及实现面部识别，并且你决定使用一个开源的预训练模型，你无法确定这个模型是在一个多样化的人群数据集上训练的。结果，你可能会在不知情的情况下，通过使用它们来支持某些偏见。


    过去曾出现过问题，面部识别模型仅在白种人身上表现良好，而忽略了大量深色皮肤的用户群体。


    尽管已经做了工作来修复这个问题，但我们仍经常听到机器学习模型做出有偏见的预测，因为用于训练它们的数据不够多样化。


    如果你决定在生产应用程序中使用预训练模型，我认为事先做一些研究是很重要的。

    '
- fmt: '### 2.2.2 Transfer learning


    The second feature available in `TensorFlow.js` is called “transfer learning.”


    `Transfer learning` is the ability to reuse a model developed for a task, as the
    starting point for a model on a second task.


    If you imagine an object recognition model that has been pre-trained on a dataset
    you don’t have access to, the function at the core of the model is to recognize
    entities in images. Using transfer learning, you can leverage this model to create
    a new one which function will be the same, but trained using your custom input
    data.


    Transfer learning is a way to generate a semicustomized model. You are still not
    able to modify the model itself, but you can feed it your own data, which can
    improve the accuracy of the predictions.


    If we reuse our example from the previous section where we used a pre-trained
    model to detect the presence of a cat in a picture, we could see that the prediction
    came back with the label “tiger cat.” This means that the model was trained with
    images labelled as such, but what if we want to detect something very different,
    like Golden Wattles (Australian flowers)?


    The first step would be to search for the list of classes the model can predict
    and see if it contains these flowers. If it does, it means the model can be used
    directly, just like shown in the previous section.


    However, if it was not trained with images of Golden Wattles, it will not be able
    to detect them until we generate a new model using transfer learning.


    To do this, a part of the code is similar to the samples shown in the previous
    section as we still need to start with the pre-trained model, but we introduce
    some new logic.


    We need to start by importing a K-nearest neighbors classifier to our application,
    alongside `TensorFlow.js` and the `mobilenet` pre-trained model.


    ```

    Listing 2-15

    Importing TensorFlow.js, mobilenet, and a KNN classifier

    ```


    Doing so gives us access to a `knnClassifier` object.


    To instantiate it, we need to call the `create` method.


    ```

    const classifier = knnClassifier.create();

    Listing 2-16

    Instantiating the KNN classifier

    ```


    This classifier is going to be used to enable us to make predictions from custom
    input data, instead of only using the pre-trained model.


    The main steps in this process involve doing what is called `inference` on the
    model, which means applying the `mobilenet` model to new data, adding these examples
    to the classifier, and predicting the classes.


    ```

    const img = await webcam.capture();

    const activation = model.infer(img, ''conv_preds'');

    classifier.addExample(activation, classId);

    Listing 2-17

    Adding example data to a KNN classifier

    ```


    The preceding code sample is incomplete, but we will cover it more in depth in
    the following chapters, when we focus on implementing transfer learning in an
    application.


    The most important here is to understand that we save an image from the webcam
    feed in a variable, use it as new data on the model, and add this as an example
    with a class (label) to the classifier, so the end result is a model that is able
    to recognize not only the data similar to the one used in the initial training
    process of the `mobilenet` model but also our new samples.


    Feeding a single new image and example to the classifier is not enough for it
    to be able to accurately recognize our new input data; therefore, this step has
    to be repeated multiple times.


    Once you think your classifier is ready, you can predict inputs like this.


    ```

    const img = await webcam.capture();

    const activation = model.infer(img, ''conv_preds'');

    const result = await classifier.predictClass(activation);

    const classes = ["A", "B", "C"];

    const prediction = classes[result.label];

    Listing 2-18

    Classifying a new image

    ```


    The first steps are the same, but instead of adding the example to the classifier,
    we use the `predictClass` method to return a result of what it thinks the new
    input is.


    We will go more in depth about transfer learning in the next chapter.


    ### 2.2.3 Creating, training, and predicting


    Finally, the third feature allows you to create the model yourself, run the training
    process, and use it, all in JavaScript.


    This feature is more complex than the two previous ones but will be covered more
    deeply in Chapter [5](#496132_1_En_5_Chapter.xhtml), when we build an application
    using a model we will create ourselves.


    It is important to know that creating a model yourself requires a trial and error
    approach.


    There is not a single way to solve a problem, and if you decide to go down that
    path, you will need to experiment a lot with different algorithms, parameters,
    and so on.


    The most common type of model used is a sequential model that you can create with
    a list of layers.


    An example of such model could look like this.


    ```

    const model = tf.sequential();

    model.add(tf.layers.conv2d({

    inputShape: [28, 28, 1],

    kernelSize: 5,

    filters: 8,

    strides: 1,

    activation: ''relu'',

    kernelInitializer: ''VarianceScaling''

    }));

    model.add(tf.layers.maxPooling2d({

    poolSize: [2, 2],

    strides: [2, 2]

    }));

    model.add(tf.layers.conv2d({

    kernelSize: 5,

    filters: 16,

    strides: 1,

    activation: ''relu'',

    kernelInitializer: ''VarianceScaling''

    }));

    Listing 2-19

    Creating a model

    ```


    We start by instantiating it using `tf.sequential` and add multiple different
    layers to it.


    This step is a bit arbitrary in the sense that choosing the type and number of
    layers, as well as the parameters passed to the layers, is more of an art than
    a science.


    Your model will probably not be perfect the first time you write it and will require
    multiple changes before you end up with a result that will be the most performant.


    One important thing to keep in mind is to provide an `inputShape` parameter in
    the first layer of your model to indicate the shape of the data the model is going
    to be trained on. The subsequent layers do not need it.


    After creating the model, the next step is to train it with data. This step is
    done using the `fit` method.


    ```

    await model.fit(data, label, options);

    Listing 2-20

    Fitting a model with data

    ```


    In general, before calling this method, you split your data into batches to train
    your model little by little. An entire dataset is often too big to be used at
    once, so dividing it into batches is important.


    The `options` parameter passed into the function is an object containing information
    about the training process. You can specify the number of `epochs`, which is when
    the entire dataset is passed through the neural network, and also the batch size,
    which represents the number of training examples present in a single batch.


    As the dataset is split up in batches passed in the `fit` method, we also need
    to think about the number of `iterations` needed to train the model with the full
    dataset.


    For example, if our dataset contains 1000 examples and our batch size is 100 examples
    at a time, it will take 10 iterations to complete 1 epoch.


    Therefore, we will need to loop and call our `fit` method 10 times, updating the
    batched data each time.


    Once the model is fully trained, it can be used for predictions using the `predict`
    method.


    ```

    const prediction = model.predict(data);

    Listing 2-21

    Predicting

    ```


    There is more to cover about this feature, but we will look into it further with
    our practical example in the next few chapters.


    # 3. Building an image classifier


    In this chapter, we are going to dive deeper into the features of `TensorFlow.js`
    by building a couple of web applications that detect objects in images.


    There will be more complete code samples with explanations, so you get a better
    understanding of how to implement machine learning into your projects.'
  raw: '### 2.2.2 Transfer learning


    The second feature available in TensorFlow.js is called “transfer learning .”


    **Transfer learning** is the ability to reuse a model developed for a task, as
    the starting point for a model on a second task.


    If you imagine an object recognition model that has been pre-trained on a dataset
    you don’t have access to, the function at the core of the model is to recognize
    entities in images. Using transfer learning, you can leverage this model to create
    a new one which function will be the same, but trained using your custom input
    data.


    Transfer learning is a way to generate a semicustomized model. You are still not
    able to modify the model itself, but you can feed it your own data, which can
    improve the accuracy of the predictions.


    If we reuse our example from the previous section where we used a pre-trained
    model to detect the presence of a cat in a picture, we could see that the prediction
    came back with the label “tiger cat.” This means that the model was trained with
    images labelled as such, but what if we want to detect something very different,
    like Golden Wattles (Australian flowers)?


    The first step would be to search for the list of classes the model can predict
    and see if it contains these flowers. If it does, it means the model can be used
    directly, just like shown in the previous section.


    However, if it was not trained with images of Golden Wattles, it will not be able
    to detect them until we generate a new model using transfer learning.


    To do this, a part of the code is similar to the samples shown in the previous
    section as we still need to start with the pre-trained model, but we introduce
    some new logic.


    We need to start by importing a K-nearest neighbors classifier to our application,
    alongside TensorFlow.js and the mobilenet pre-trained model.


    ```


    Listing 2-15

    Importing TensorFlow.js, mobilenet, and a KNN classifier

    ```


    Doing so gives us access to a `knnClassifier` object.


    To instantiate it, we need to call the `create` method.


    ```

    const classifier = knnClassifier.create();

    Listing 2-16

    Instantiating the KNN classifier

    ```


    This classifier is going to be used to enable us to make predictions from custom
    input data, instead of only using the pre-trained model.


    The main steps in this process involve doing what is called **inference** on the
    model, which means applying the mobilenet model to new data, adding these examples
    to the classifier, and predicting the classes.


    ```

    const img = await webcam.capture();

    const activation = model.infer(img, ''conv_preds'');

    classifier.addExample(activation, classId);

    Listing 2-17

    Adding example data to a KNN classifier

    ```


    The preceding code sample is incomplete, but we will cover it more in depth in
    the following chapters, when we focus on implementing transfer learning in an
    application.


    The most important here is to understand that we save an image from the webcam
    feed in a variable, use it as new data on the model, and add this as an example
    with a class (label) to the classifier, so the end result is a model that is able
    to recognize not only the data similar to the one used in the initial training
    process of the mobilenet model but also our new samples.


    Feeding a single new image and example to the classifier is not enough for it
    to be able to accurately recognize our new input data; therefore, this step has
    to be repeated multiple times.


    Once you think your classifier is ready, you can predict inputs like this.


    ```

    const img = await webcam.capture();

    const activation = model.infer(img, ''conv_preds'');

    const result = await classifier.predictClass(activation);

    const classes = ["A", "B", "C"];

    const prediction = classes[result.label];

    Listing 2-18

    Classifying a new image

    ```


    The first steps are the same, but instead of adding the example to the classifier,
    we use the `predictClass` method to return a result of what it thinks the new
    input is.


    We will go more in depth about transfer learning in the next chapter.


    ### 2.2.3 Creating, training, and predicting


    Finally, the third feature allows you to create the model yourself, run the training
    process, and use it, all in JavaScript.


    This feature is more complex than the two previous ones but will be covered more
    deeply in Chapter [5](#496132_1_En_5_Chapter.xhtml), when we build an application
    using a model we will create ourselves.


    It is important to know that creating a model yourself requires a trial and error
    approach.


    There is not a single way to solve a problem, and if you decide to go down that
    path, you will need to experiment a lot with different algorithms, parameters,
    and so on.


    The most common type of model used is a sequential model that you can create with
    a list of layers.


    An example of such model could look like this.


    ```

    const model = tf.sequential();

    model.add(tf.layers.conv2d({

    inputShape: [28, 28, 1],

    kernelSize: 5,

    filters: 8,

    strides: 1,

    activation: ''relu'',

    kernelInitializer: ''VarianceScaling''

    }));

    model.add(tf.layers.maxPooling2d({

    poolSize: [2, 2],

    strides: [2, 2]

    }));

    model.add(tf.layers.conv2d({

    kernelSize: 5,

    filters: 16,

    strides: 1,

    activation: ''relu'',

    kernelInitializer: ''VarianceScaling''

    }));

    Listing 2-19

    Creating a model

    ```


    We start by instantiating it using `tf.sequential` and add multiple different
    layers to it.


    This step is a bit arbitrary in the sense that choosing the type and number of
    layers, as well as the parameters passed to the layers, is more of an art than
    a science.


    Your model will probably not be perfect the first time you write it and will require
    multiple changes before you end up with a result that will be the most performant.


    One important thing to keep in mind is to provide an `inputShape` parameter in
    the first layer of your model to indicate the shape of the data the model is going
    to be trained on. The subsequent layers do not need it.


    After creating the model, the next step is to train it with data. This step is
    done using the `fit` method.


    ```

    await model.fit(data, label, options);

    Listing 2-20

    Fitting a model with data

    ```


    In general, before calling this method, you split your data into batches to train
    your model little by little. An entire dataset is often too big to be used at
    once, so dividing it into batches is important.


    The options parameter passed into the function is an object containing information
    about the training process. You can specify the number of **epochs**, which is
    when the entire dataset is passed through the neural network, and also the batch
    size, which represents the number of training examples present in a single batch.


    As the dataset is split up in batches passed in the `fit` method, we also need
    to think about the number of **iterations** needed to train the model with the
    full dataset.


    For example, if our dataset contains 1000 examples and our batch size is 100 examples
    at a time, it will take 10 iterations to complete 1 epoch.


    Therefore, we will need to loop and call our `fit` method 10 times, updating the
    batched data each time.


    Once the model is fully trained, it can be used for predictions using the `predict`
    method.


    ```

    const prediction = model.predict(data);

    Listing 2-21

    Predicting

    ```


    There is more to cover about this feature, but we will look into it further with
    our practical example in the next few chapters.


    # 3. Building an image classifier


    In this chapter, we are going to dive deeper into the features of TensorFlow.js
    by building a couple of web applications that detect objects in images.


    There will be more complete code samples with explanations, so you get a better
    understanding of how to implement machine learning into your projects.'
  trans: '

    ### 2.2.2 迁移学习


    TensorFlow.js 中可用的第二个特性称为“迁移学习”。


    **迁移学习**是指能够重复使用为某项任务开发的模型，并将其作为另一项任务模型的起点。


    想象一个对象识别模型，它已经在一个你无法访问的数据集上进行了预训练，该模型的核心功能是识别图像中的实体。利用迁移学习，你可以利用这个模型创建一个新模型，其功能相同，但使用你自定义的输入数据进行训练。


    迁移学习是一种生成半定制化模型的方法。你仍然无法修改模型本身，但可以向其提供你自己的数据，这可以提高预测的准确性。


    如果我们沿用上一节中使用的例子，即使用一个预训练模型来检测图片中是否存在猫，我们可以看到预测结果返回了标签“虎斑猫”。这意味着该模型是用标记为“虎斑猫”的图像进行训练的。但是，如果我们想检测一些非常不同的东西，比如金合欢（澳大利亚花卉）呢？


    第一步是搜索该模型可以预测的类别列表，看看是否包含这些花卉。如果包含，则意味着可以直接使用该模型，就像上一节展示的那样。


    然而，如果模型没有用金合欢的图像进行训练，那么在我们使用迁移学习生成新模型之前，它将无法检测到它们。


    为此，部分代码与上一节展示的示例类似，因为我们仍然需要从预训练模型开始，但我们会引入一些新的逻辑。


    我们需要首先将 K 近邻分类器导入到我们的应用程序中，同时导入 TensorFlow.js 和 mobilenet 预训练模型。


    ```

    清单 2-15

    导入 TensorFlow.js、mobilenet 和 KNN 分类器

    ```


    这样做使我们能够访问一个 `knnClassifier` 对象。


    要实例化它，我们需要调用 `create` 方法。


    ```

    const classifier = knnClassifier.create();

    清单 2-16

    实例化 KNN 分类器

    ```


    这个分类器将用于使我们能够根据自定义输入数据进行预测，而不仅仅是使用预训练模型。


    此过程的主要步骤包括对模型进行所谓的**推理**，这意味着将 mobilenet 模型应用于新数据，将这些示例添加到分类器，并预测类别。


    ```

    const img = await webcam.capture();

    const activation = model.infer(img, ''conv_preds'');

    classifier.addExample(activation, classId);

    清单 2-17

    向 KNN 分类器添加示例数据

    ```


    上面的代码示例是不完整的，但我们将在后续章节中更深入地介绍它，届时我们将专注于在应用程序中实现迁移学习。


    这里最重要的是要理解，我们从网络摄像头流中保存一张图像到一个变量中，将其作为模型的新数据使用，并将其作为一个带有类别（标签）的示例添加到分类器中，这样最终得到的模型不仅能够识别与
    mobilenet 模型初始训练过程中使用的数据相似的数据，还能识别我们的新样本。


    仅向分类器提供一张新的图像和一个示例，不足以让它准确识别我们的新输入数据；因此，这一步需要重复多次。


    一旦你认为你的分类器准备好了，你可以像这样预测输入。


    ```

    const img = await webcam.capture();

    const activation = model.infer(img, ''conv_preds'');

    const result = await classifier.predictClass(activation);

    const classes = ["A", "B", "C"];

    const prediction = classes[result.label];

    清单 2-18

    分类新图像

    ```


    前几步是相同的，但这里不是将示例添加到分类器，而是使用 `predictClass` 方法来返回分类器认为新输入是什么的结果。


    我们将在下一章更深入地探讨迁移学习。


    ### 2.2.3 创建、训练和预测


    最后，第三个特性允许你自行创建模型、运行训练过程并使用它，所有这些都在 JavaScript 中完成。


    这个特性比前两个更复杂，但将在第 5 章中更深入地介绍，届时我们将使用我们自己创建的模型来构建一个应用程序。


    重要的是要知道，自己创建模型需要采用试错的方法。


    解决问题的方法不止一种，如果你决定走这条路，你将需要大量尝试不同的算法、参数等。


    最常用的模型类型是顺序模型，你可以通过一系列层来创建它。


    这种模型的一个示例如下所示。


    ```

    const model = tf.sequential();

    model.add(tf.layers.conv2d({

    inputShape: [28, 28, 1],

    kernelSize: 5,

    filters: 8,

    strides: 1,

    activation: ''relu'',

    kernelInitializer: ''VarianceScaling''

    }));

    model.add(tf.layers.maxPooling2d({

    poolSize: [2, 2],

    strides: [2, 2]

    }));

    model.add(tf.layers.conv2d({

    kernelSize: 5,

    filters: 16,

    strides: 1,

    activation: ''relu'',

    kernelInitializer: ''VarianceScaling''

    }));

    清单 2-19

    创建模型

    ```


    我们首先使用 `tf.sequential` 实例化它，然后向其添加多个不同的层。


    这一步在某种程度上是随意的，因为选择层的类型和数量，以及传递给层的参数，与其说是科学，不如说是一门艺术。


    你的模型在第一次编写时可能并不完美，需要多次修改才能得到性能最佳的结果。


    需要记住的一件重要事情是，在模型的第一层中提供一个 `inputShape` 参数，以指示模型将要训练的数据的形状。后续层则不需要。


    创建模型后，下一步是用数据训练它。这一步使用 `fit` 方法完成。


    ```

    await model.fit(data, label, options);

    清单 2-20

    用数据拟合模型

    ```


    通常，在调用此方法之前，你需要将数据分成批次，以逐步训练模型。整个数据集通常太大，无法一次性使用，因此将其分成批次很重要。


    传递给函数的 `options` 参数是一个包含训练过程信息的对象。你可以指定**周期**的数量，即整个数据集通过神经网络的次数，还可以指定**批次大小**，即单个批次中存在的训练样本数量。


    由于数据集被分割成批次传递给 `fit` 方法，我们还需要考虑使用完整数据集训练模型所需的**迭代**次数。


    例如，如果我们的数据集包含 1000 个样本，并且我们的批次大小是每次 100 个样本，那么完成 1 个周期需要 10 次迭代。


    因此，我们需要循环并调用我们的 `fit` 方法 10 次，每次更新批次数据。


    一旦模型完全训练好，就可以使用 `predict` 方法进行预测。


    ```

    const prediction = model.predict(data);

    清单 2-21

    预测


    关于这个特性还有更多内容需要介绍，但我们将在接下来的几章中通过实际示例进一步探讨。


    # 3. 构建图像分类器


    在本章中，我们将通过构建几个检测图像中对象的 Web 应用程序，更深入地探讨 TensorFlow.js 的特性。


    这里将提供更完整的代码示例并附有解释，以便你更好地理解如何将机器学习应用到你的项目中。

    '
- fmt: '### 3.1 Using a pre-trained model


    The first project we are going to build is a quick game in which you are prompted
    to find specific objects around you, take a picture of them using your device’s
    camera, and check if the machine learning model recognizes them.


    The output is going to be as follows:


    ![../images/496132_1_En_3_Chapter/496132_1_En_3_Fig1_HTML.jpg](images/496132_1_En_3_Chapter/496132_1_En_3_Fig1_HTML.jpg)


    **Figure 3-1** Snapshot of the image classification project


    At the core of this project is the same object detection model we talked about
    previously, called `mobilenet`.


    This model is pre-trained using the open source ImageNet database made of images
    organized in 1000 different classes. What this means is that the model is able
    to recognize 1000 different objects based on the data it has been trained with.


    To start this project, we need to import both TensorFlow.js and the `mobilenet`
    model. There are two ways to do this. Either you can import them using script
    tags in your HTML file.


    ```

    Listing 3-1

    Importing TensorFlow.js and mobilenet

    ```


    Or, if you are using a front-end framework, for example, React.js, you can install
    TensorFlow.js in your dependencies and then import it in a JavaScript file.


    In your terminal:


    ```

    npm install @tensorflow/tfjs @tensorflow-models/mobilenet

    yarn add @tensorflow/tfjs @tensorflow-models/mobilenet

    Listing 3-2

    Installing the TensorFlow.js and mobilenet modules

    ```


    In your JavaScript file:


    ```

    import "@tensorflow/tfjs";

    Import "@tensorflow-models/mobilenet";

    Listing 3-3

    Importing the modules

    ```


    Importing these two files gives us access to the `tf` and `mobilenet` objects.


    The first step we need to take is **load the model** in the app.


    ```

    async function app(){

    const model = await model.load();

    }

    Listing 3-4

    Loading the model

    ```


    ![../images/496132_1_En_3_Chapter/496132_1_En_3_Fig2_HTML.jpg](images/496132_1_En_3_Chapter/496132_1_En_3_Fig2_HTML.jpg)


    **Figure 3-2** Console output of a model


    Models being pretty heavy files, they can take a few seconds to load and therefore
    should be loaded using `async/await`. If you are curious to know what this object
    contains, you can log it and look at its properties. Please remember that you
    do not have to understand every property in the object to be able to use it.


    One of the properties that could be interesting, however, is the `inputs` property
    in `model`.


    ![../images/496132_1_En_3_Chapter/496132_1_En_3_Fig3_HTML.jpg](images/496132_1_En_3_Chapter/496132_1_En_3_Fig3_HTML.jpg)


    **Figure 3-3** Console output of a model


    This property shows us the type of input used to train the model. In this case,
    we can see that images were used, which makes sense considering this is an object
    detection model. More importantly, we can see the shape of the data used in the
    training process.


    The `shape` attribute reveals the value `[-1, 224, 224, 3]`, which means that
    the images fed to the model were RGB images (the value 3 at the end of the array
    represents the number or channels) of size 224*224 pixels. This value is particularly
    interesting for the next part of this chapter, where we will look at doing transfer
    learning with the `mobilenet` model.


    Feel free to explore the model further.


    The next step to build this application is to allow TensorFlow.js to have access
    to the input from the webcam to be able to run predictions and detect objects.
    As our project uses the device’s webcam, we have a `<video>` element in our HTML.


    In JavaScript, we need to access this element and use one of TensorFlow’s methods
    to create an object from the data API that can capture images as tensors.


    ```

    const webcamElement = document.getElementsByTagName("video")[0];

    const webcam = await tf.data.webcam(webcamElement);

    Listing 3-5

    Instantiating a webcam object

    ```


    These two lines are still part of the setup process of our application. At the
    moment, we only loaded the model and created this `webcam` variable that will
    transform snapshots from the camera to tensors.


    Now, to implement the logic, we need to start by adding a simple button to our
    HTML. It will be used to trigger the image capture on click.


    ```

    SNAP

    Listing 3-6

    Button to capture an image

    ```


    In our JavaScript file, we need to access this element, use the `onclick` event
    listener, and use TensorFlow.js to capture an image, and classify it.


    ```

    const captureButton = document.getElementsByClassName("capture-image")[0];

    captureButton.onclick = async () => {

    const img = await webcam.capture();

    const predictions = await model.classify(img);

    return predictions;

    };

    Listing 3-7

    Classifying an image

    ```


    To capture an image from the video feed, TensorFlow.js has a `capture()` built-in
    method that needs to be called on the object previously created using `tf.data.webcam`.
    It allows to transform a single image directly into a tensor so it can then easily
    be used with other TensorFlow.js operations.


    After capturing an image, we generate predictions by passing it in `mobilenet.classify`.
    This will return an array of predictions.


    For example, this picture taken of a plastic bottle will return the following
    array of predictions.


    ![../images/496132_1_En_3_Chapter/496132_1_En_3_Fig5_HTML.jpg](images/496132_1_En_3_Chapter/496132_1_En_3_Fig5_HTML.jpg)


    **Figure 3-5** Prediction result printed in the console


    ![../images/496132_1_En_3_Chapter/496132_1_En_3_Fig4_HTML.jpg](images/496132_1_En_3_Chapter/496132_1_En_3_Fig4_HTML.jpg)


    **Figure 3-4** Live object classification


    As you can see, the first prediction, the one the model is the most confident
    about, has a label of “pop bottle, soda bottle”. It successfully detected the
    presence of a bottle in the image; however, the probability is really poor, even
    though it is the correct result.


    The fact that the level of confidence in the prediction is only 30% is probably
    due to the background behind the object. The more complex the background is, the
    harder it is going to be for the model to be able to find the object in the image
    and classify it. This issue is more related to the field of computer vision itself
    than a framework problem.


    As the following image demonstrates, if you try taking the same picture on a clearer
    background, the quality of the predictions seems to be much better.


    ![../images/496132_1_En_3_Chapter/496132_1_En_3_Fig6_HTML.png](images/496132_1_En_3_Chapter/496132_1_En_3_Fig6_HTML.png)


    **Figure 3-6** Prediction results on a clearer background


    Not only is the probability much higher, at almost 89%, but the following predictions
    are also more accurate. In the first example, the second prediction was “vacuum
    cleaner”, which is far from accurate, but here, it comes back with “water bottle”,
    which is a result much closer to the truth.


    This limitation is definitely something you should take into consideration if
    you are planning on integrating object detection into your application. Thinking
    about the context in which your project will be used is important to avoid a bad
    user experience.


    Finally, there is one last step in this process. We need to clear up the memory
    we aren’t going to need anymore. Once the image is captured and fed to TensorFlow.js
    to be classified, we don’t need it anymore and therefore should free up the memory
    it is taking.


    To do so, TensorFlow.js provides the `dispose` method that you use like this.


    ```

    img.dispose();

    Listing 3-8

    Free some memory with the dispose method

    ```


    We’ve covered the main part of the logic around object detection. However, the
    first part of the game is to be prompted to find specific objects to take a picture
    of. This code is not TensorFlow.js specific and can be a simple UI that asks you
    to find a new object every time you’ve successfully found the previous one.


    However, if your UI asks you to find a mobile phone, you would need to make sure
    the model has been trained with pictures of mobile phones so it can detect the
    correct object.'
  raw: '## 3.1 Using a pre-trained model


    The first project we are going to build is a quick game in which you are prompted
    to find specific objects around you, take a picture of them using your device’s
    camera, and check if the machine learning model recognizes them.


    The output is going to be as follows:


    ![../images/496132_1_En_3_Chapter/496132_1_En_3_Fig1_HTML.jpg](images/496132_1_En_3_Chapter/496132_1_En_3_Fig1_HTML.jpg)


    Figure 3-1


    Snapshot of the image classification project


    At the core of this project is the same object detection model we talked about
    previously, called **mobilenet** .


    This model is pre-trained using the open source ImageNet database made of images
    organized in 1000 different classes.


    What this means is that the model is able to recognize 1000 different objects
    based on the data it has been trained with.


    To start this project, we need to import both TensorFlow.js and the mobilenet
    model.


    There are two ways to do this. Either you can import them using script tags in
    your HTML file.


    ```


    Listing 3-1

    Importing TensorFlow.js and mobilenet

    ```


    Or, if you are using a front-end framework, for example, React.js, you can install
    TensorFlow.js in your dependencies and then import it in a JavaScript file.


    In your terminal:


    ```

