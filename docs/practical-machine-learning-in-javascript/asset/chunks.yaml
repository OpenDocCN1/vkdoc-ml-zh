    ### 5.3.6 实时预测


    在最后一步中，让我们创建一个名为 `predict.js` 的新 JavaScript 文件。


    我们将创建一个名为“`/predict`”的新端点，提供我们的 `index.html` 文件，使用类似的 Web Socket 代码将手机的运动数据发送到服务器，并运行实时预测。


    第一个小修改是在前端代码的初始 `index.js` 文件中。我们需要将运动数据以字符串形式发送，替换为以下数据。


    ```

    let data = {

    xAcc: accelerometerData.x,

    yAcc: accelerometerData.y,

    zAcc: accelerometerData.z,

    xGyro: gyroscopeData.x,

    yGyro: gyroscopeData.y,

    zGyro: gyroscopeData.z,

    };

    socket.emit("motion data", data);

    代码清单 5-80

    在 index.js 中。更新通过 Web Socket 发送的运动数据的格式

    ```


    由于实时数据需要输入到模型中，因此发送一个数字对象比重复我们在训练过程中使用的格式化方式更简单。


    然后，我们的 `predict.js` 文件将与 `server.js` 文件非常相似，只是多了一个 `predict` 函数，该函数将实时数据输入模型并生成关于手势的预测。


    ```

    const tf = require("@tensorflow/tfjs-node");

    const express = require("express");

    const app = express();

    var http = require("http").createServer(app);

    const io = require("socket.io")(http);

    let liveData = [];

    let predictionDone = false;

    let model;

    const gestureClasses = ["letterA", "letterB", "letterC"];

    // 创建新端点

    app.use("/predict", express.static(__dirname + "/"));

    io.on("connection", async function (socket) {

    // 加载模型

    model = await tf.loadLayersModel("file://model/model.json");

    socket.on("motion data", function (data) {

    predictionDone = false;

    // 这确保数据与训练时使用的形状相同。600 代表 6 个值（加速度计和陀螺仪的 x、y、z），采集 100 次。

    if (liveData.length  {

    tf.tidy(() => {

    const inputData = newSampleData;

    // 从实时数据创建张量

    const input = tf.tensor2d([inputData], [1, 600]);

    const predictOut = model.predict(input);

    // 获取最高概率

    const winner = gestureClasses[predictOut.argMax(-1).dataSync()[0]];

    console.log(winner);

    });

    };

    http.listen(process.env.PORT || 3000);

    代码清单 5-81

    在 predict.js 中。predict.js 文件的完整代码

    ```


    如果你使用 `node predict.js` 运行上述代码示例，在手机上访问“`/predict`”页面，并执行我们训练过的三个手势之一。按住屏幕时，一旦松开屏幕，你应该会在终端中看到一个预测结果！


    运行实时预测时，你可能会遇到以下错误。当手势执行过快，采集的数据量低于我们的 600 个值时，就会发生这种情况，这意味着数据的形状不正确，模型无法使用。如果稍微慢一点重试，应该就能正常工作。


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig57_HTML.jpg](img/496132_1_En_5_Fig57_HTML.jpg)


    图 5-57


    手势执行过快时可能出现的错误


    现在我们的实时预测已经可以工作，你可以继续修改用于创建模型的一些参数，看看它们如何影响预测结果，或者训练不同的手势，甚至使用 Web Socket 将预测结果发送回前端，以创建一个交互式应用程序。本节的最后部分的主要目标是涵盖创建自己的机器学习模型所涉及的步骤。


    在过去的几页中，我们学习了如何使用通用传感器 API 访问硬件数据，设置服务器和 Web Socket 进行通信和共享数据，将运动数据保存到文件中，处理和转换数据，以及创建、训练和使用模型来预测实时手势！


    希望这能让你更好地了解机器学习和 TensorFlow.js 所提供的所有可能性。


    然而，如果你是新手，这包含了很多新信息，尤其是最后这一部分相当高级且具有实验性，所以我不期望你完全理解并感到完全舒适。


    如果你感兴趣，可以随时回顾代码示例，慢慢来，并尝试构建一些小原型。


    # 6. 生产环境中的机器学习


    现在，希望你对于使用机器学习和构建基于不同模型与输入的应用程序感到更加得心应手，接下来让我们讨论将机器学习模型和系统投入生产环境所涉及的不同方面。


    ![../images/496132_1_En_6_Chapter/496132_1_En_6_Fig8_HTML.jpg](img/496132_1_En_6_Fig8_HTML.jpg)


    图 6-8


    kaos 的功能。来源：[`​ki-labs.​com/​kaos/​#features`](https://ki-labs.com/kaos/%2523features)


    ![../images/496132_1_En_6_Chapter/496132_1_En_6_Fig7_HTML.jpg](img/496132_1_En_6_Fig7_HTML.jpg)


    图 6-7


    测试金字塔示例。来源：[`martinfowler.com/articles/cd4ml.html`](https://martinfowler.com/articles/cd4ml.html)


    ![../images/496132_1_En_6_Chapter/496132_1_En_6_Fig6_HTML.jpg](img/496132_1_En_6_Fig6_HTML.jpg)


    图 6-6


    机器学习系统的组件。来源：[`​cloud.​google.​com/​solutions/​machine-learning/​mlops-continuous-delivery-and-automation-pipelines-in-machine-learning`](https://cloud.google.com/solutions/machine-learning/mlops-continuous-delivery-and-automation-pipelines-in-machine-learning)


    ![../images/496132_1_En_6_Chapter/496132_1_En_6_Fig5_HTML.jpg](img/496132_1_En_6_Fig5_HTML.jpg)


    图 6-5


    示例模式。来源：[www.​tensorflow.​org/​tfx/​guide/​schemagen](https://www.tensorflow.org/tfx/guide/schemagen)


    ![../images/496132_1_En_6_Chapter/496132_1_En_6_Fig4_HTML.jpg](img/496132_1_En_6_Fig4_HTML.jpg)


    图 6-4


    标准 TFX 流水线


    ![../images/496132_1_En_6_Chapter/496132_1_En_6_Fig3_HTML.jpg](img/496132_1_En_6_Fig3_HTML.jpg)


    图 6-3


    机器学习系统的组件。来源：[`​cloud.​google.​com/​solutions/​machine-learning/​mlops-continuous-delivery-and-automation-pipelines-in-machine-learning`](https://cloud.google.com/solutions/machine-learning/mlops-continuous-delivery-and-automation-pipelines-in-machine-learning)


    ![../images/496132_1_En_6_Chapter/496132_1_En_6_Fig2_HTML.jpg](img/496132_1_En_6_Fig2_HTML.jpg)


    图 6-2


    每个阶段的工程师类型。


    ![../images/496132_1_En_6_Chapter/496132_1_En_6_Fig1_HTML.jpg](img/496132_1_En_6_Fig1_HTML.jpg)


    图 6-1


    机器学习持续交付的阶段。来源：[`martinfowler.com/articles/cd4ml.html`](https://martinfowler.com/articles/cd4ml.html)


    在开始之前，重要的是要知道本章不会深入探讨如何使用 Kubernetes 集群、配置负载均衡器等来设置你自己的机器学习流水线，因为这通常是 DevOps 或基础设施团队的任务。然而，理解将机器学习模型投入生产环境所面临的挑战非常重要，因此我们将解释其中一些挑战，并介绍一些不同的工具，如果你没有机会与专门的团队合作，这些工具应该能帮助你将机器学习添加到生产应用程序中。


    ## 6.1 挑战


    将机器学习投入生产环境会带来一系列与我们之前可能遇到的不同的挑战。


    在本书中构建的个人项目中，我们是唯一的用户，并且所有内容都在本地运行。我们更多地处于概念验证阶段。在生产环境中，应用程序不仅会被数百、数千甚至数百万用户使用，而且还会由多个团队构建。因此，你的系统必须能够适应并处理更多的挑战。

