- fmt: '### Getting input data from the Web Speech API


    A way to make this project even more interactive would be to allow people to ask
    their questions using their own voice rather than typing on their keyboard.


    The Web API that enables speech recognition is the Web Speech API. Using this
    API, we can add speech-to-text functionality to this project and even text-to-speech
    with `SpeechSynthesis`, if we want the answers to also be read out loud.


    The amount of code needed to add this feature is relatively small. Considering
    we already went through the core of the application, it will only impact the part
    that captures user’s input.


    To start using the Web Speech API, you need to include the following lines in
    your JavaScript file.


    ```

    var SpeechRecognition = SpeechRecognition || webkitSpeechRecognition;

    var SpeechRecognitionEvent = SpeechRecognitionEvent || webkitSpeechRecognitionEvent;

    Listing 4-37

    Initial setup to use the Web Speech API

    ```


    These lines will allow you to have access to the speech recognition interface.


    Then, to start using this interface, you need to create a speech recognition instance
    using the following.


    ```

    const recognition = new SpeechRecognition();

    Listing 4-38

    Instantiate a new SpeechRecognition instance

    ```


    Before starting the recognition, you can set a few parameters on your `recognition`
    instance. Personally, I set the following ones.


    ```

    recognition.continuous = false;

    recognition.lang = "en-US";

    recognition.interimResults = false;

    Listing 4-39

    Optional parameters

    ```


    The first one indicates that the listening and recognition is not continuous,
    meaning you will need a user interaction every time you want to listen to a question
    from the user. Setting it to `false` allows you to listen only when the user means
    to interact with the interface, instead of listening nonstop.


    The second setting is the language of the recognition for the request. If unset,
    it will default to use the language of the HTML document root element, defined
    in your `lang` attribute.


    At the moment, the list of languages available to use with the `SpeechRecognition`
    API includes


    ![../images/496132_1_En_4_Chapter/496132_1_En_4_Figf_HTML.gif](images/496132_1_En_4_Chapter/496132_1_En_4_Figf_HTML.gif)![../images/496132_1_En_4_Chapter/496132_1_En_4_Figg_HTML.gif](images/496132_1_En_4_Chapter/496132_1_En_4_Figg_HTML.gif)![../images/496132_1_En_4_Chapter/496132_1_En_4_Figh_HTML.gif](images/496132_1_En_4_Chapter/496132_1_En_4_Figh_HTML.gif)![../images/496132_1_En_4_Chapter/496132_1_En_4_Figi_HTML.gif](images/496132_1_En_4_Chapter/496132_1_En_4_Figi_HTML.gif)


    Finally, the third setting `interimResults` set to `false` indicates I am only
    interested in getting the last result of the recognition, and not all interim
    results while I am speaking.


    After setting these attributes, we can start the recognition using `recognition.start()`.


    If you have not enabled the microphone on the web page already, you will be prompted
    to do so, but otherwise, the microphone will start listening for inputs.


    To have access to the results of the recognition, you need to call the `onresult`
    method, like this.


    ```

    recognition.onresult = function (event) {

    if (event.results[0][0]){

    var result = event.results[0][0].transcript;

    }

    console.log("result", result);

    };

    Listing 4-40

    Getting results from the Web Speech API

    ```


    Calling `onresult` returns a callback with an event object of the following shape.


    ![../images/496132_1_En_4_Chapter/496132_1_En_4_Fig17_HTML.jpg](images/496132_1_En_4_Chapter/496132_1_En_4_Fig17_HTML.jpg)


    Figure 4-17


    Output of calling the `onresult` method


    Looking at this output helps make sense of the way we are setting the `result`
    variable in the preceding code sample: `event.results[0][0].transcript`.


    Another useful method we can call is `onspeechend`.


    `onspeechend` is triggered when speech has stopped being detected. To avoid running
    recognition when not needed, we can use `onspeechend` to stop the recognition
    entirely.


    ```

    recognition.onspeechend = function () {

    recognition.stop();

    };

    Listing 4-41

    Code sample to stop the recognition when the API has detected that the user has
    stopped talking

    ```


    Put together, the code sample for speech recognition looks like this:


    ```

    var SpeechRecognition = SpeechRecognition || webkitSpeechRecognition;

    var SpeechRecognitionEvent =

    SpeechRecognitionEvent || webkitSpeechRecognitionEvent;

    var recognition = new SpeechRecognition();

    const startSpeechRecognition = () => {

    recognition.continuous = false;

    recognition.lang = "en-US";

    recognition.interimResults = false;

    recognition.onspeechend = () => recognition.stop();

    recognition.onresult = function (event) {

    if (event.results[0][0]) var result = event.results[0][0].transcript;

    console.log("result", result);

    };

    recognition.start();

    };

    startSpeechRecognition();

    ```


    In only 20 lines of JavaScript, a web application can listen to a user’s voice
    commands!


    If you wanted to add this to the project we built previously, you could implement
    it where we added the event listener for clicks on the “ask” button.


    Instead of using the input written in the input field, you could trigger the speech
    recognition on click, listen to the user’s voice input, and feed that to the model,
    the same way we sent our written input string.


    Imagining you already added the basic setup of the `SpeechRecognition` instance
    from the code sample just earlier, the only change you would need to do to the
    project code would be in the function listening for clicks on the `askButton`
    element.


    ```

    askButton.onclick = async () => {

    recognition.start();

    recognition.onresult = async (event) => {

    if (event.results[0][0]) {

    var result = event.results[0][0].transcript;

    }

    inputQuestion = result;

    const answers = await model.findAnswers(inputQuestion, figureData);

    displayAnswer(answers);

    document.getElementsByTagName("input")[0].value = "";

    };

    };

    Listing 4-42

    User voice commands with the QNA model

    ```


    When the user clicks the button, this code starts the speech recognition and,
    on result, stores the final transcript in the `inputQuestion` variable. This variable
    was already sent to the `findAnswers` method in the original code for this project,
    but now it contains input from the user’s speech command.


    A few changes would need to be done to the UI to reflect this functionality change
    (e.g., the input field is not necessarily needed anymore), but overall, the change
    we had to make to go from a written input to a spoken one only took a few lines
    of code!


    Finally, if you wanted to go a little step further and have the output being read
    out loud to the user on top of being displayed on the screen, you can do so with
    the following three lines.


    ```

    let speechSynth = window.speechSynthesis;

    var result = new SpeechSynthesisUtterance(answers[0].text);

    speechSynth.speak(result);

    Listing 4-43

    Code sample to get the output prediction read out loud using the SpeechSynthesis
    Web API

    ```


    These three lines create a `speechSynthesis` instance, execute a speech request
    passing the answer from the model, and call the `speak` method to make the speech
    service read the information out loud.


    The default voice feels pretty robotic but a few parameters can be set to change
    this. I will not go into details here, but feel free to look at the MDN Web Docs
    for the Web Speech API for more information.


    One last thing to keep in mind if you want to explore this API further is that
    the browser support is not at 100%. At the moment, it seems to be well supported
    on Chrome and Edge, but not Safari and Firefox.


    Even though it is still pretty experimental, I would encourage you to look into
    it if you are interested.


    This chapter contained a lot of information.'
