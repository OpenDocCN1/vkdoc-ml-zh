  trans: '

    ### 1.2.2 无监督学习


    另一种常见的学习类型称为**无监督学习**。与监督学习相反，无监督学习是基于**未标记数据**进行预测。这意味着我们**仅依赖特征集**。


    回想一下之前关于房屋的数据集，这意味着我们要移除“价格”这一列，最终只保留每栋房屋特征的数据。


    如果沿用预测房屋售价的场景，你可能会疑惑：如果数据没有标签（不包含任何价格信息），我们该如何预测价格呢？


    这正是思考你要解决的问题以及关注你所拥有数据的重要性所在。


    在无监督学习中，我们并非试图预测单一结果或回答特定问题，而是识别趋势。


    在我们的房屋问题中，问题是“我的房子能卖多少钱？”，我们期望得到一个具体的价格作为结果。然而，正如本书前面提到的，如果训练时输入的数据集不包含任何价格信息，机器学习算法实际上无法预测价格。


    因此，这种情况并不适合使用无监督学习。


    由于无监督学习旨在识别趋势并将数据分类到不同组别，一个适合此类问题的典型例子是**预测客户行为**。


    对于这类问题，我们并非试图回答一个具有特定答案的问题；相反，我们试图将数据分类到不同类别，以便创建具有相似特征的实体集群。


    以预测客户行为为例，通过收集每位客户的数据，我们可以利用机器学习来发现客户之间的行为相关性，并找出购买模式，这些模式有助于广告等应用。


    收集并使用关于你在哪里购物、什么时间购物、每周购物几次、购买什么商品等数据，我们可以推断出你的性别、年龄、社会经济背景等信息，然后根据你所属的客户群体来预测你可能购买的商品。


    如果你接触过 Spotify 上的音乐推荐或 Amazon 上的产品推荐，你可能对这类预测的实际应用有所了解。


    根据你的收听和购买习惯，公司收集数据并利用机器学习将客户分群，然后根据与你相似的其他人的收听或购买记录，向你推荐你可能喜欢的歌曲或产品。


    ### 1.2.3 强化学习


    第三种学习类型称为**强化学习**。如果你正在阅读本书，很可能刚开始接触机器学习，所以一开始可能不会用到它。


    强化学习主要用于自动驾驶汽车、带有 AI 玩家的游戏等应用场景，这些场景的结果更多地涉及一种行为或一系列动作。


    它依赖于奖励和惩罚的概念，以及“智能体”与“环境”之间的关系。


    我们可以想象一个乒乓球游戏的场景：环境是游戏本身，智能体是玩家。玩家的动作会改变游戏的状态。改变球拍的位置会影响球的走向，并最终导致玩家获胜或失败。


    当一系列动作导致玩家获胜时，系统会获得某种奖励，以表明这组特定的交互实现了训练过程的目标，从而创建一个能够自主赢得比赛的 AI 玩家。


    训练过程会持续进行，迭代不同的交互组合，在获胜时获得奖励（+1 分），在失败时受到惩罚（-1 分），并自我修正，逐渐学会如何在与另一个玩家的对战中获胜。


    这种学习类型不依赖于预先存在的数据集来输入算法。


    相反，它使用一组目标和规则（例如，球拍只能上下移动，目标是击败对手等），通过自主学习正确的行为，以最大化实现设定目标的机会。


    强化学习让系统能够探索环境并自行做出决策。


    这种学习类型通常需要非常漫长的训练过程，涉及海量的步骤。其中一个问题在于，当因输掉游戏而受到惩罚时，系统会假定该回合中采取的所有动作序列都导致了失败。因此，它会避免再次采取所有这些步骤，而不是识别出动作序列中哪些步骤导致了失败。


    ### 1.2.4 半监督学习


    最后，我们简要谈谈半监督学习。


    半监督学习介于监督学习和无监督学习之间。正如前几页所述，监督学习处理标记数据，而无监督学习使用未标记数据。


    有时，当使用一个大型未标记数据集时，我们可以先对其中的一部分进行标记，然后利用半监督学习进行所谓的**伪标记**。


    这意味着我们将手动标记数据集的一部分，然后让算法标记剩余部分，最终得到一个完全标记的数据集。


    例如，如果我们有数十万张未标记的猫和狗的图片集合，我们可以自己标记其中一部分，然后将其输入半监督学习算法。该算法会在这些图片中寻找模式，并能够将剩余的未标记数据集作为输入，为每张新图片贴上“猫”或“狗”的标签，从而使所有数据都被标记。


    这种技术使我们能够比完全手动标记更快地生成标记数据集，然后我们就可以在此基础上进行监督学习。


    理解你的问题属于哪种学习类型通常是第一步。


    现在我们已经介绍了主要的几种类型，接下来让我们看看一些最著名的算法。


    ## 1.3 算法


    与标准编程一样，机器学习使用算法来帮助解决问题。


    然而，在使用算法之前，并不一定要理解所有算法的实现细节。最重要的是要了解它们属于哪种学习类型，以及它们最擅长处理哪种数据类型。


    如果将其与 Web 编程进行比较，市面上有很多不同的 JavaScript 框架，你并不一定需要理解它们的源代码才能使用它们构建应用程序。然而，你需要知道的是，它们是否支持你所需的功能。


    在机器学习领域，有些算法非常擅长处理图像数据，而另一些则更擅长处理文本数据。


    让我们深入了解其中一些算法。

    '
- fmt: '### 1.3.1 Naive Bayes


    The `Naive Bayes` algorithm is a supervised learning classification algorithm.
    It predicts the probability of different classes based on various attributes and
    prior knowledge. It is mostly used in text classification and with problems having
    multiple classes. It is considered highly scalable and requires less training
    data than other algorithms.


    A practical example of a problem that could be solved with `Naive Bayes` would
    be around filming a TV series. Unless all of the plot happens indoors, the production
    of the show will be impacted by environmental factors such as the weather, humidity
    level, temperature, wind, season, and so on. As parts of a TV show are not filmed
    in order, we could use machine learning to help us find the best days certain
    parts of the show should be filmed on, based on the requirements of certain scenes.
    Gathering a dataset of weather attributes and whether or not an outdoor scene
    was filmed, we would be able to predict the probability of being able to film
    a new scene on a future day.


    This algorithm is called "Naive" as it makes the assumption that all the variables
    in the dataset are not correlated to each other. For example, a rainy day does
    not have to also be windy or a high level of humidity does not have to correlate
    to a high temperature.


    ### 1.3.2 K-nearest neighbors


    Another popular algorithm is called `K-nearest neighbors`. This algorithm is a
    classification algorithm that assumes that similar things exist in close proximity
    to each other, so near each other.


    A good way to illustrate this is with an example graph. When working on machine
    learning problems, you can visualize data like this.


    ![../images/496132_1_En_1_Chapter/496132_1_En_1_Fig4_HTML.jpg](images/496132_1_En_1_Chapter/496132_1_En_1_Fig4_HTML.jpg)


    Figure 1-4


    This illustration represents a visualization generated by using a `K-nearest neighbors`
    classification algorithm. Source: [https://machinelearningmastery.com/tutorial-to-implement-k-nearest-neighbors-in-python-from-scratch/](https://machinelearningmastery.com/tutorial-to-implement-k-nearest-neighbors-in-python-from-scratch/)


    In the preceding visualization, we can see that the data plotted ends up creating
    some kind of organized clusters. Similar data points exist close to each other.
    The `K-nearest neighbors` algorithm (`KNN`) works on this idea of similarity to
    classify new data.


    When using this algorithm, we need to define a value for "K" that will represent
    the amount of closest data points (neighbors) we will take into consideration
    to help us classify a new entry. For example, if we pick the value `K = 10`, when
    we want to predict the class for a new entry, we look at the 10 closest neighbors
    and their class. The class that has the highest amount of neighbors to our new
    data point is the class that is predicted to be the correct one.


    A practical example for this would be in predicting customer behavior or likelihood
    to buy certain items. A supermarket chain has access to data from people''s purchases
    and could use unsupervised learning to organize customers into clusters based
    on their buying habits. Examples of clusters could be customers who are single
    vs. those who have a family, or customers who belong to a bracket of certain ages
    (young vs. old). Considering that people have, in general, similar buying habits
    to people in the same cluster, using the `K-nearest neighbors` algorithm would
    be useful in predicting what kind of products people would be likely to buy and
    use this information for advertising.


    ### 1.3.3 Convolutional neural networks


    `Convolutional neural network`, also known as `ConvNet` or `CNN`, is an algorithm
    that performs really well at classifying images. It can be used for problems such
    as object detection and face recognition.


    Unlike humans, computers process images as an array of pixels which length would
    be equal to `height * width * dimension`. A RGB image of 16x16 pixels would be
    interpreted as a matrix of `16*16*3` so an array of 768 values.


    A classic example of a problem solved using a `CNN` is using the `MNIST` dataset
    of handwritten digits.


    ![../images/496132_1_En_1_Chapter/496132_1_En_1_Fig5_HTML.jpg](images/496132_1_En_1_Chapter/496132_1_En_1_Fig5_HTML.jpg)


    Figure 1-5


    This is a representation of how a convolutional network works, from an input image
    to hidden layers, and outputting a number. Source: [https://towardsdatascience.com/mnist-handwritten-digits-classification-using-a-convolutional-neural-network-cnn-af5fafbc35e9](https://towardsdatascience.com/mnist-handwritten-digits-classification-using-a-convolutional-neural-network-cnn-af5fafbc35e9)


    The preceding image illustrates how a convolutional neural network would predict
    the number handwritten in the input image. It would start by transforming the
    image into an array of 2352 values (`28*28*3`) to transform a 3D input into a
    1D one. It would then run the data into different layers and filters of the neural
    network to end up with an output layer of 10 options, as the digit to predict
    would be between 0 and 9. The output of the prediction would be a probability
    for each entry of the output layer, and the entry with the highest probability
    would be the correct one.


    If the problem you are trying to solve involves a dataset of images, you probably
    want to play around with a `CNN` algorithm.


    These three algorithms fall into different categories. `Naive Bayes` belongs to
    Bayesian algorithms, `K-nearest neighbors` to instance-based algorithms, and `convolutional
    neural networks` (`CNN`) to deep learning algorithms.


    There are a lot more categories and algorithms to explore; however, covering all
    of them is not the goal of this book. As you dive deeper into machine learning
    and build your own applications, you should definitely look into more of them
    as you experiment. There is not always a single solution to a problem, so learning
    about different algorithms will allow you to find the one best suited to what
    you are trying to achieve.


    ## 1.4 Applications


    Some applications were mentioned in the last few pages of this book when attempting
    to illustrate concepts with examples; however, there are many more use cases for
    machine learning in various fields.'
  raw: '### 1.3.1 Naive Bayes


    The Naive Bayes algorithm is a supervised learning classification algorithm.


    It predicts the probability of different classes based on various attributes and
    prior knowledge.


    It is mostly used in text classification and with problems having multiple classes.
    It is considered highly scalable and requires less training data than other algorithms.


    A practical example of problem that could be solved with Naive Bayes would be
    around filming a TV series.


    Unless all of the plot happens indoors, the production of the show will be impacted
    by environmental factors such as the weather, humidity level, temperature, wind,
    season, and so on.


    As parts of a TV show are not filmed in order, we could use machine learning to
    help us find the best days certain parts of the show should be filmed on, based
    on the requirements of certain scenes.


    Gathering a dataset of weather attributes and whether or not an outdoor scene
    was filmed, we would be able to predict the probability of being able to film
    a new scene on a future day.


    This algorithm is called “Naive” as it makes the assumption that all the variables
    in the dataset are not correlated to each other.


    For example, a rainy day does not have to also be windy or a high level of humidity
    does not have to correlate to a high temperature.


