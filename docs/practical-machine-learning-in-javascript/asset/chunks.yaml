- fmt: "### 4.4.3 Automation tools\n\nThere are some situations in our professional\
    \ lives where some tasks are still done manually that could be automated using\
    \ sentiment analysis, to free up some time to focus on more interesting challenges.\
    \ An example of this is around product feedback from customers.\n\nIf you work\
    \ for a product company, you might be familiar with asking your customers for\
    \ feedback on the product you are building. This feedback is often stored as a\
    \ spreadsheet of data, stored in `Google Sheets`, databases, or other platform.\
    \ The company’s employees then usually go through all this data to understand\
    \ customers’ needs, complaints, and so on. These tasks can take a lot of time;\
    \ however, sentiment analysis could be used to apply a first filter to the data\
    \ and group them by feedback that seems positive, negative, and neutral. People\
    \ should still read the data manually to get a better understanding of customers’\
    \ thoughts, but it could give an idea of the overall sentiment around the product.\n\
    \nAnother type of survey where this approach could be useful is in internal company\
    \ surveys. When the leadership of a company wants to know how employees are feeling\
    \ about their work, the culture, or their overall experience, a survey is shared\
    \ to collect feedback. Some surveys are rather simple with mainly check boxes\
    \ where people answer questions or statements by selecting “Strongly agree”, “Agree”,\
    \ “Disagree”, or “Strongly disagree”; however, some other surveys give employees\
    \ an opportunity to express themselves further, in their own words. The latter\
    \ would be a good use case for sentiment analysis. After collecting feedback from\
    \ everyone, all the data could be fed to a sentiment analysis model to determine\
    \ the overall feeling of employees toward the company.\n\nSimilarly to the previous\
    \ example of product surveys, the feedback should still be read and analyzed manually,\
    \ but getting a first insight over the data may influence the first decisions.\
    \ If the prediction comes back as overly negative, it is probably important to\
    \ act on the feedback as soon as possible to avoid getting to the point where\
    \ employees decide to leave the company.\n\nFinally, another scenario where sentiment\
    \ analysis could be used for automation is in helping a support team triage tickets\
    \ based on the toxicity of customer’s complaints. This approach could also be\
    \ used by developer experience teams that usually have to keep track of what is\
    \ said about a company on social media. Using a `Toxicity Classifier` or sentiment\
    \ analysis classifier to run an initial check on the data can help prioritize\
    \ which customers’ feedback should be dealt with, with more urgency.\n\nAll in\
    \ all, using sentiment analysis as an automation tool does not replace entirely\
    \ the work that should be done by people, it only provides a help to gain some\
    \ early insights and guide decisions. In addition to sentiment analysis, other\
    \ types of techniques are also available to gain a deeper understanding of text\
    \ data.\n\n## 4.5 Other types of text classification tools\n\nEven though sentiment\
    \ analysis provides some useful information about data collected, it can also\
    \ be paired with other types of text classification tools to generate better predictions\
    \ and extract more meaningful insights.\n\n### 4.5.1 Intent analysis\n\nIntent\
    \ analysis, also called intent classification, goes a step further by trying to\
    \ analyze and understand the user’s intention behind a message and identify whether\
    \ it relates to an opinion, news, marketing, query, complaint, suggestion, and\
    \ so on. It also helps categorize customers’ intents by topics such as `Purchase`,\
    \ `Downgrade`, `Demo request`, and so on.\n\nTo do this, a model needs to be trained\
    \ with existing data collected from users and labelled with the different intents\
    \ we would like to use for future predictions. It works a bit similarly to the\
    \ `Toxicity Classifier` I talked about previously in this chapter, but instead\
    \ of using labels such as `\"severe_toxicity\"` or `\"threat\"`, the model would\
    \ be trained with labels such as `\"Purchase\"`, `\"Need for information\"`, `\"\
    Cancellation\"`, and so on. Feeding this labelled data from real customers’ comments,\
    \ requests, and complaints to an algorithm would allow it to find patterns of\
    \ vocabulary used, semantics, arrangements of words in a sentence, used by people\
    \ when expressing similar intents.\n\n### 4.5.2 Named Entity Recognition\n\nNamed\
    \ entity recognition (NER), also known as entity identification, entity chunking,\
    \ or entity extraction, extracts entities such as people, locations, organizations,\
    \ and dates from text.\n\nFor example, if we take the following sample paragraph\
    \ from the Rosa Parks’ Wikipedia page:\n\n> *Rosa Louise McCauley Parks (February\
    \ 4, 1913 –* October 24, 2005*) was an American* [activist](https://en.wikipedia.org/wiki/Activism)\
    \ *in the* [civil rights movement](https://en.wikipedia.org/wiki/Civil_rights_movement)\
    \ *best known for her pivotal role in the* [Montgomery bus boycott](https://en.wikipedia.org/wiki/Montgomery_bus_boycott)*.\
    \ The* [United States Congress](https://en.wikipedia.org/wiki/United_States_Congress)\
    \ *has called her \"the first lady of civil rights\" and \"the mother of the freedom\
    \ movement.”*\n> \n> —Quote source: [`https://en.wikipedia.org/wiki/Rosa_Parks`](https://en.wikipedia.org/wiki/Rosa_Parks)\n\
    \nNamed entity recognition would allow us to extract and classify the following\
    \ terms:\n\n* **Person**: Rosa Louise McCauley Parks\n* **Location**: Montgomery,\
    \ United States\n* **Date**: February 4, 1913, October 24, 2005\n* **Organization**:\
    \ United States Congress\n\nNER models have a wide range of applications including\
    \ automatic summarizing of resumes to aim at simplifying the recruitment process\
    \ by automatically scanning a huge amount of documents and shortlist candidates\
    \ based on terms found in them.\n\n### 4.5.3 Text summarization\n\nAs the name\
    \ indicates, text summarization is a technique usually used to create an accurate\
    \ summary that captures the main pieces of information in a longer text. These\
    \ summaries allow people to navigate content more effectively by reducing reading\
    \ time and helping in the selection process of research documents.\n\nThe goal\
    \ of this technique is not only to capture the main words of a document and generate\
    \ a shorter sentence, but also to create something that reads fluently as a new\
    \ stand-alone piece of content. It should result in a summary that is as good\
    \ as those a human would write.\n\nExamples of day-to-day text summarization we\
    \ are already familiar with include:\n\n* News headlines\n* Notes from meetings\n\
    * Synopses\n* Biographies\n\nFor automatic text summarization using machine learning,\
    \ there exist two approaches: extractive and abstractive.\n\n**Extractive text\
    \ summarization** is the process of selecting phrases in a source document to\
    \ generate a summary. It involves ranking the relevance of phrases in the source\
    \ and only selecting the ones that are the most relevant to the meaning of the\
    \ document.\n\n**Abstractive text summarization** involves generating brand-new\
    \ phrases that convey the most critical information from the source document.\
    \ It uses advanced natural language processing techniques to interpret and examine\
    \ the text and produce shorter sentences in a new way.\n\n### 4.5.4 Question Answering\
    \ with TensorFlow.js\n\nQuestion Answering is a discipline within the field of\
    \ natural language processing that is concerned with building systems that automatically\
    \ answer questions posed by humans in a natural language. A machine learning model\
    \ takes a passage and a question as input and is able to return a segment of the\
    \ passage that is likely to answer the question asked, as output.\n\nIn the next\
    \ few pages, we are going to use the `MobileBERT` model, a lightweight version\
    \ of the `BERT` (Bidirectional Encoder Representations from Transformers) model\
    \ from Google, to build a system capable of answering questions submitted by humans\
    \ based on a set of paragraphs."
