    如果我们想保持快速且简单，可以就此打住，并认定仅凭这一项检查就能确定“石头”手势。然而，如果我们希望对手势识别更有把握，可以对中指、无名指和小指重复同样的过程。


    拇指会稍有不同，因为其折叠方式，我们需要检查 x 坐标的差值，而不是 y 坐标。


    对于**“布”手势**，由于所有手指都伸展，我们可以检查每根手指的指尖 y 坐标是否都小于其指根 y 坐标。


    以下代码可用于验证这一点。


    ```

