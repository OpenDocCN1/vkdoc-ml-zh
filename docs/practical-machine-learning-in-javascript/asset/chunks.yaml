    Then, to access the phone’s sensors data, you will need to instantiate a new `Gyroscope`
    and `Accelerometer` interface, use the `reading` event listener to get the x,
    y, and z coordinates of the device’s motion, and call the `start` method to start
    the tracking.


    ```

    function initSensors() {

    let gyroscope = new Gyroscope({frequency: 60});

    gyroscope.addEventListener(''reading'', e => {

    gyroscopeData.x = gyroscope.x;

    gyroscopeData.y = gyroscope.y;

    gyroscopeData.z = gyroscope.z;

    });

    gyroscope.start();

    let accelerometer = new Accelerometer({frequency: 60});

    accelerometer.addEventListener(''reading'', e => {

    accelerometerData.x = accelerometer.x;

    accelerometerData.y = accelerometer.y;

    accelerometerData.z = accelerometer.z;

    });

    accelerometer.start();

    }

    Listing 5-60

    In index.js. Get accelerometer and gyroscope data

    ```


    Finally, as we are interested in recording data when we are executing a specific
    gesture, we need to call the preceding function only when the user is pressing
    on the mobile screen with the `touchstart` event. We also should cancel it on
    `touchend`.


    ```

    function getData() {

    let data = {

    xAcc: accelerometerData.x,

    yAcc: accelerometerData.y,

    zAcc: accelerometerData.z,

    xGyro: gyroscopeData.x,

    yGyro: gyroscopeData.y,

    zGyro: gyroscopeData.z,

    };

    document.body.innerHTML = JSON.stringify(data);

    dataRequest = requestAnimationFrame(getData);

    }

    window.onload = function () {

    initSensors();

    document.body.addEventListener("touchstart", (e) => {

    getData();

    });

    document.body.addEventListener("touchend", (e) => {

    cancelAnimationFrame(dataRequest);

    });

    };

