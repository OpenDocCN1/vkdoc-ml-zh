    1958 年被美国国家航空航天局（NASA）取代。她职业生涯的大部分时间都在弗吉尼亚州汉普顿的兰利研究中心度过。1951 年，她开始在实行种族隔离的西区计算部门担任计算机。她参加了高级工程课程，并于
    1958 年成为 NASA 第一位黑人女性工程师。在 NASA 工作 34 年后，杰克逊获得了最高级别的工程师头衔。她意识到如果不成为主管，就无法获得进一步晋升。她接受降职，成为联邦女性计划（隶属于
