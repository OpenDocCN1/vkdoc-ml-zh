- fmt: '### 5.1.2 Accessing audio data


    In JavaScript, the Web API that lets developers access data coming from the computer’s
    microphone is the Web Audio API.


    If you have never used this API before, it’s totally fine; we are going to go
    through the main lines you need to get set up everything.


    To start, we need to access the `AudioContext` interface on the global `window`
    object, as well as making sure we can get permission to access an audio and video
    input device with `getUserMedia`.


    ```

    window.AudioContext = window.AudioContext || window.webkitAudioContext;

    navigator.getUserMedia = navigator.getUserMedia || navigator.webkitGetUserMedia;

    Listing 5-1

    Setup to use the Web Audio API in JavaScript

    ```


    This code sample takes into consideration cross-browser compatibility.


    Then, to start listening to input coming from the microphone, we need to wait
    for a user action on the page, for example, a click.


    Once the user has interacted with the web page, we can instantiate an audio context,
    allow access to the computer’s audio input device, and use some of the Web Audio
    API built-in methods to create a source and an analyzer and connect the two together
    to start getting some data.


    ```

    document.body.onclick = async () => {

    const audioctx = new window.AudioContext();

    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

    const source = audioctx.createMediaStreamSource(stream);

    analyser = audioctx.createAnalyser();

    analyser.smoothingTimeConstant = 0;

    source.connect(analyser);

    analyser.fftSize = 1024;

    getAudioData();

    };

    Listing 5-2

    JavaScript code sample to set up the audio context on click

    ```


    In the preceding code sample, we are using `navigator.mediaDevices.getUserMedia`
    to get access to the microphone. If you have ever built applications that were
    using audio or video input devices before, you might be familiar with writing
    `navigator.getUserMedia()`; however, this is deprecated and you should now be
    using `navigator.mediaDevices.getUserMedia()`.


    Writing it the old way will still work but is not recommended as it will probably
    not be supported in the next few years.


    Once the basic setup is done, the `getAudioData` function filters the raw data
    coming from the device to only get the frequency data.


    ```

    const getAudioData = () => {

    const freqdata = new Uint8Array(analyser.frequencyBinCount);

    analyser.getByteFrequencyData(freqdata);

    console.log(freqdata);

    requestAnimationFrame(getAudioData);

    };

    Listing 5-3

    Function to filter through the raw data to get the frequency data we will use

    ```


    We also call `requestAnimationFrame` to continuously call this function and update
    the data we are logging with live data.


    Altogether, you can access live data from the microphone in less than 25 lines
    of JavaScript!


    ```

    window.AudioContext = window.AudioContext || window.webkitAudioContext;

    navigator.getUserMedia = navigator.getUserMedia || navigator.webkitGetUserMedia;

    let analyser;

    document.body.onclick = async () => {

    const audioctx = new window.AudioContext();

    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

    const source = audioctx.createMediaStreamSource(stream);

    analyser = audioctx.createAnalyser();

    analyser.smoothingTimeConstant = 0;

    source.connect(analyser);

    analyser.fftSize = 1024;

    getAudioData();

    };

    const getAudioData = () => {

    const freqdata = new Uint8Array(analyser.frequencyBinCount);

    analyser.getByteFrequencyData(freqdata);

    console.log(freqdata);

    requestAnimationFrame(getAudioData);

    };

    Listing 5-4

    Complete code sample to get input data from the microphone in JavaScript

    ```


    The output from this code is an array of raw data we are logging in the browser’s
    console.


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig3_HTML.jpg](images/496132_1_En_5_Chapter/496132_1_En_5_Fig3_HTML.jpg)


    Figure 5-3


    Screenshot of the data returned by the preceding code sample


    These arrays represent the frequencies that make up the sounds recorded by the
    computer’s microphone. The default sample rate is 44,100Hz, which means we get
    about 44,000 samples of data per second.


    In the format shown earlier (arrays of integers), finding patterns to recognize
    some type of activity seems pretty difficult. We wouldn’t really be able to identify
    the difference between speaking, laughing, music playing, and so on.


    To help make sense of this raw frequency data, we can turn it into visualizations.'
