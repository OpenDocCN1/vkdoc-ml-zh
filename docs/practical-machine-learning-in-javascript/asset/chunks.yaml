  raw: '#### Predicting key points


    Once the model is loaded and the webcam feed is set up, we can run predictions
    and detect keypoints when a hand is placed in front of the webcam.


    To do this, we can copy the `main()` function we created when using Facemesh,
    but replace the expression `model.estimateFaces` with `model.estimateHands`.


    As a result, the main function should be as follows.


    ```

    async function main() {

    const predictions = await model.estimateHands(

    document.querySelector("video")

    );

    if (predictions.length > 0) {

    console.log(predictions);

    }

    requestAnimationFrame(main);

    }

    Listing 5-34

    Run predictions and log the output

    ```


    The output of this code will log the following data in the browser’s console.


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig38_HTML.jpg](images/496132_1_En_5_Chapter/496132_1_En_5_Fig38_HTML.jpg)


    Figure 5-38


    Output when detecting hands


    We can see that the format of this data is very similar to the one when using
    the Facemesh model!


    This makes it easier and faster to experiment as you can reuse code samples you
    have written in other projects. It allows developers to get set up quickly to
    focus on experimenting with the possibilities of what can be built with such models,
    without spending too much time in configuration.


    The main differences that can be noticed are the properties defined in annotations,
    the additional `handInViewConfidence` property, and the lack of `mesh` and `scaledMesh`
    data.


    The `handInViewConfidence` property represents the probability of a hand being
    present. It is a floating value between 0 and 1\. The closer it is to 1, the more
    confident the model is that a hand is found in the video stream.


    At the moment of writing this book, this model is able to detect only one hand
    at a time. As a result, you cannot build applications that would require a user
    to use both hands at once as a way of interacting with the interface.


    #### Full code sample


    To check that everything is working properly, here is the full JavaScript code
    sample needed to test your setup.


    ```

    let video;

    let model;

    const init = async () => {

    video = await loadVideo();

    await tf.setBackend("webgl");

    model = await handpose.load();

    main();

    };

    const loadVideo = async () => {

    const video = await setupCamera();

    video.play();

    return video;

    };

    const setupCamera = async () => {

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {

    throw new Error(

    "Browser API navigator.mediaDevices.getUserMedia not available"

    );

    }

    video = document.querySelector("video");

    video.width = window.innerWidth;

    video.height = window.innerHeight;

    const stream = await navigator.mediaDevices.getUserMedia({

    audio: false,

    video: {

    facingMode: "user",

    width: window.innerWidth,

    height: window.innerHeight,

    },

    });

    video.srcObject = stream;

    return new Promise(

    (resolve) => (video.onloadedmetadata = () => resolve(video))

    );

    };

    init();

    async function main() {

    const predictions = await model.estimateHands(

    document.querySelector("video")

    );

    if (predictions.length > 0) {

    console.log(predictions);

    }

    requestAnimationFrame(main);

    }

    Listing 5-35

    Full code sample

    ```


    #### Project


    To experiment with the kind of applications that can be built with this model,
    we’re going to build a small “Rock Paper Scissors” game.


    To understand how we are going to recognize the three gestures, let’s have a look
    at the following visualizations to understand the position of the keypoints per
    gesture.


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig39_HTML.jpg](images/496132_1_En_5_Chapter/496132_1_En_5_Fig39_HTML.jpg)


    Figure 5-39


    “Rock” gesture visualized


    The preceding screenshot represents the “rock” gesture. As we can see, all fingers
    are folded so the tips of the fingers should be further in their z axis than the
    keypoint at the end of the first phalanx bone for each finger.


    Otherwise, we can also consider that the y coordinate of the finger tips should
    be higher than the one of the major knuckles, keeping in mind that the top of
    the screen is equal to 0 and the lower the keypoint, the higher the y value.


    We’ll be able to play around with the data returned in the annotations object
    to see if this is accurate and can be used to detect the “rock” gesture.


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig40_HTML.jpg](images/496132_1_En_5_Chapter/496132_1_En_5_Fig40_HTML.jpg)


    Figure 5-40


    “Paper” gesture visualized


    In the “paper” gesture, all fingers are straight so we can use mainly the y coordinates
    of different fingers. For example, we could check if the y value of the last point
    of each finger (at the tips) is less than the y value of the palm or the base
    of each finger.


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig41_HTML.jpg](images/496132_1_En_5_Chapter/496132_1_En_5_Fig41_HTML.jpg)


    Figure 5-41


    “Scissors” gesture visualized


    Finally, the “scissors” gesture could be recognized by looking at the space in
    x axis between the index finger and the middle finger, as well as the y coordinate
    of the other fingers.


    If the y value of the tip of the ring finger and little finger is lower than their
    base, they are probably folded.


    Reusing the code samples we have gone through in the previous sections, let’s
    look into how we can write the logic to recognize and differentiate these gestures.


    If we start with the **“rock” gesture**, here is how we could check if the y coordinate
    of each finger is higher than the one of the base knuckle.


    ```

    let indexBase = predictions[0].annotations.indexFinger[0][1];

    let indexTip = predictions[0].annotations.indexFinger[3][1];

    if (indexTip > indexBase) {

    console.log("index finger folded");

    }

    Listing 5-36

    Logic to check if the index finger is folded

    ```


    We can start by declaring two variables, one to store the y position of the base
    of the index finger and one for the tip of the same finger.


    Looking back at the data from the annotations object when a finger is present
    on screen, we can see that, for the index finger, we get an array of 4 arrays
    representing the x, y, and z coordinates of each key point.


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig42_HTML.jpg](images/496132_1_En_5_Chapter/496132_1_En_5_Fig42_HTML.jpg)


    Figure 5-42


    Output data when a hand is detected


    The y coordinate in the first array has a value of about 352.27 and the y coordinate
    in the last array has a value of about 126.62, which is lower, so we can deduce
    that the first array represents the position of the base of the index finger,
    and the last array represents the keypoint at the tip of that finger.


    We can test that this information is correct by writing the `if` statement shown
    earlier that logs the message “index finger folded” if the value of `indexTip`
    is higher than the one of `indexBase`.


    And it works!


    If you test this code by placing your hand in front of the camera and switch from
    holding your index finger straight and then folding it, you should see the message
    being logged in the console!'
