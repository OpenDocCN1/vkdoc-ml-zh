- fmt: "### 5.3.6 Live predictions\n\nFor this last step, let’s create a new JavaScript\
    \ file called `predict.js`.\n\nWe are going to create a new endpoint called `/predict`,\
    \ serve our `index.html` file, use similar web sockets code to send motion data\
    \ from our phone to our server, and run live predictions.\n\nA first small modification\
    \ is in our initial `index.js` file in our front-end code. Instead of sending\
    \ the motion data as a string, we need to replace it with the following data.\n\
    \n```\nlet data = {\n  xAcc: accelerometerData.x,\n  yAcc: accelerometerData.y,\n\
    \  zAcc: accelerometerData.z,\n  xGyro: gyroscopeData.x,\n  yGyro: gyroscopeData.y,\n\
    \  zGyro: gyroscopeData.z,\n};\nsocket.emit(\"motion data\", data);\n```\n\nAs\
    \ the live data is going to have to be fed to the model, it is easier to send\
    \ an object of numbers rather than go through the same formatting we went during\
    \ the training process.\n\nThen, our `predict.js` file is going to look very similar\
    \ to our `server.js` file at the exception of an additional `predict` function\
    \ that feeds live data to the model and generate a prediction about the gesture.\n\
    \n```\nconst tf = require(\"@tensorflow/tfjs-node\");\nconst express = require(\"\
    express\");\nconst app = express();\nvar http = require(\"http\").createServer(app);\n\
    const io = require(\"socket.io\")(http);\nlet liveData = [];\nlet predictionDone\
    \ = false;\nlet model;\nconst gestureClasses = [\"letterA\", \"letterB\", \"letterC\"\
    ];\n// Create new endpoint\napp.use(\"/predict\", express.static(__dirname + \"\
    /\"));\nio.on(\"connection\", async function (socket) {\n  // Load the model\n\
    \  model = await tf.loadLayersModel(\"file://model/model.json\");\n  socket.on(\"\
    motion data\", function (data) {\n    predictionDone = false;\n    // This makes\
    \ sure the data has the same shape as the one used during training. 600 represents\
    \ 6 values (x,y,z for accelerometer and gyroscope), collected 100 times.\n   \
    \ if (liveData.length < 600) {\n      liveData.push(data.xAcc, data.yAcc, data.zAcc,\
    \ data.xGyro, data.yGyro, data.zGyro);\n    } else {\n      if (!predictionDone)\
    \ {\n        predictionDone = true;\n        predict([...liveData]);\n       \
    \ liveData = [];\n      }\n    }\n  });\n});\nconst predict = (newSampleData)\
    \ => {\n  tf.tidy(() => {\n    const inputData = newSampleData;\n    // Create\
    \ a tensor from live data\n    const input = tf.tensor2d([inputData], [1, 600]);\n\
    \    const predictOut = model.predict(input);\n    // Access the highest probability\n\
    \    const winner = gestureClasses[predictOut.argMax(-1).dataSync()[0]];\n   \
    \ console.log(winner);\n  });\n};\nhttp.listen(process.env.PORT || 3000);\n```\n\
    \nIf you run the preceding code sample using `node predict.js`, visit the page\
    \ on `/predict` on your phone, and execute one of the three gestures we trained.\
    \ While holding the screen down, you should see a prediction in the terminal once\
    \ you release the screen!\n\nWhen running live predictions, you might come across\
    \ the following error. This happens when a gesture is executed too fast and the\
    \ amount of data collected was lower than our 600 value, meaning the data does\
    \ not have the correct shape for the model to use it. If you try again a bit slower,\
    \ it should be working.\n\n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig57_HTML.jpg](images/496132_1_En_5_Chapter/496132_1_En_5_Fig57_HTML.jpg)\n\
    \nFigure 5-57: Possible error when a gesture is executed too fast\n\nNow that\
    \ our live predictions work, you could move on to changing some parameters used\
    \ to create the model to see how it impacts the predictions, or train different\
    \ gestures, or even send the prediction back to the front end using web sockets\
    \ to create an interactive application. The main goal of this last section was\
    \ to cover the steps involved into creating your own machine learning model.\n\
    \nOver the last few pages we learned to access hardware data using the Generic\
    \ Sensor API, set up a server and web sockets to communicate and share data, save\
    \ motion data into files, process and transform it, as well as create, train,\
    \ and use a model to predict live gestures!\n\nHopefully it gives you a better\
    \ idea of all the possibilities offered by machine learning and TensorFlow.js.\n\
    \nHowever, it was a lot of new information if you are new to it, especially this\
    \ last section was quite advanced and experimental, so I would not expect you\
    \ to understand everything and feel completely comfortable yet.\n\nFeel free to\
    \ go back over the code samples, take your time, and play around with building\
    \ small prototypes if you are interested.\n\n# 6. Machine learning in production\n\
    \nNow that you hopefully feel more comfortable experimenting with machine learning\
    \ and building applications using different models and inputs, let’s talk about\
    \ the different aspects of putting machine learning models and systems into production.\n\
