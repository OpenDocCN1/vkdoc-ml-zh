- fmt: '我们了解了自然语言处理的基础知识、不同类型的文本分类工具、各种应用场景，以及如何使用`TensorFlow.js`实现情感分析、毒性分类和问答系统，还尝试了将语音命令作为获取文本数据进行预测的一种方式。


    如果这是你第一次涉足机器学习，这些信息量可能会让你感到有些不知所措。然而，就像任何新事物都需要时间去理解一样，如果需要，你可以随时休息一下，稍后再回到本章。


    下一章将深入探讨如何将机器学习与其他类型的数据输入结合使用。


    # 5. 输入实验


    在前面的章节中，我们了解了如何使用机器学习处理图像和文本数据，以进行目标检测和分类，以及情感分析、毒性分类和问答系统。


    这些可能是机器学习最常见的应用示例。然而，这个列表并不详尽，还有更多类型的输入数据可以使用。


    在本章中，我们将探索不同类型的数据输入，并构建几个实验性项目，以理解如何将机器学习用于音频和硬件数据，以及使用专注于身体和动作识别的模型。


    ## 5.1 音频数据


    当你第一次读到“音频数据”这个词时，你可能会认为本书的这一部分将专注于音乐；然而，我将更广泛地探讨声音的使用。


    我们通常不会经常思考这一点，但我们周围有很多东西会发出声音，这些声音为我们提供了关于环境的情境信息。


    例如，雷声能帮助你了解天气可能不好，而无需你向窗外看；或者你可以在看到飞机之前就识别出它飞过的声音；甚至听到海浪的声音表明你可能靠近海洋，等等。


    在不知不觉中，识别和理解这些声音的含义影响着我们的日常生活和行动。听到敲门声表明可能有人在门外等你开门，或者你在做饭时听到水沸腾的声音，表明水已经准备好让你往里面倒东西了。


    利用声音数据和机器学习可以帮助我们利用声音的丰富特性来识别某些人类活动，并增强当前的智能系统，如`Siri`、`Alexa`等。


    这就是所谓的**声学活动识别**。


    考虑到我们周围许多设备都配备了麦克风，这项技术有很大的应用前景。


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig1_HTML.jpg](images/496132_1_En_5_Chapter/496132_1_En_5_Fig1_HTML.jpg)


    图 5-1


    配备麦克风的个人设备示意图


    到目前为止，我们中有些人可能正在使用的智能系统能够识别单词以触发命令，但它们对周围发生的事情没有理解；你的手机不知道你在浴室里，你的`Alexa`设备不知道你可能在厨房里，等等。然而，它们可以做到这一点，并且这可以用来创建更个性化和更有用的数字体验。


    在我们进入本章的实践部分，并了解如何使用`TensorFlow.js`在`JavaScript`中构建此类系统之前，先了解声音的基本原理以及它如何被转换成我们可以在代码中使用的数据，这将很有帮助。


    ### 5.1.1 什么是声音？


    声音是空气分子的振动。


    如果你曾经把扬声器的音量开得很大，你可能会注意到它们会随着音乐来回移动。这种运动推动空气粒子，改变气压，产生声波。


    同样的现象也发生在语音中。当你说话时，你的声带振动，扰动周围的空气分子，改变气压，产生声波。


    下图可以说明这种现象。


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig2_HTML.jpg](images/496132_1_En_5_Chapter/496132_1_En_5_Fig2_HTML.jpg)


    图 5-2


    声波工作原理示意图。来源：[`www.researchgate.net/figure/Sound-as-a-pressure-wave-The-peaks-represent-times-when-air-molecules-are-clustered_fig2_215646583`](http://www.researchgate.net/figure/Sound-as-a-pressure-wave-The-peaks-represent-times-when-air-molecules-are-clustered_fig2_215646583)


    当你敲击音叉时，它会开始振动。这种来回运动将改变周围的气压。向前运动会产生高压，向后运动会产生低压区域。这种运动的重复会产生波。


    在接收端，我们的耳膜随着气压的变化而振动，这种振动随后被转换成电信号发送到大脑。


    那么，如果声音是气压的变化，我们如何将声波转换成可以在设备上使用的数据呢？


    为了能够解释声音数据，我们的设备使用麦克风。


    存在不同类型的麦克风，但总的来说，这些设备都有一个振膜或薄膜，当暴露于声波引起的气压变化时，它会振动。


    这些振动使麦克风内部线圈附近的磁铁移动，从而产生微小的电流。然后，你的计算机会将这个信号转换成代表音量和频率的数字。'
  raw: 'We looked into the basics of natural language processing, different types
    of text classification tools, various applications, and also how to implement
    sentiment analysis, toxicity classification, and question answering using TensorFlow.js,
    as well as experimenting with voice commands as a way to get text data to run
    predictions on.


    If this is the first time you are diving into machine learning, this amount of
    information can feel a little bit overwhelming. However, as everything new takes
    time to understand, feel free to take breaks and come back to this chapter later
    on if you want.


    The following chapter will dive into using other kind of data inputs with machine
    learning.


    # 5. Experimenting with inputs


    In the previous chapters, we looked into how to use machine learning with images
    and text data to do object detection and classification, as well as sentiment
    analysis, toxicity classification and question answering.


    These are probably the most common examples of what machine learning can do. However,
    this list is not exhaustive and many more inputs can be used.


    In this chapter, we’re going to explore different kinds of input data and build
    a few experimental projects to understand how to use machine learning with audio
    and hardware data, as well as using models focused on body and movement recognition.


    ## 5.1 Audio data


    When you first read the words “audio data,” you might think that this section
    of the book is going to focus on music; however, I am going to dive into using
    sound more generally.


    We don’t really think about it often but a lot of things around us produce sounds
    that give us contextual information about our environment.


    For example, the sound of thunder helps you understand the weather is probably
    bad without you having to look out the window, or you can recognize the sound
    of a plane passing by before you even see it, or even hearing the sound of waves
    indicates you are probably close to the ocean, and so on.


    Without realizing, recognizing, and understanding the meaning of these sounds
    impacts our daily lives and our actions. Hearing a knock on your door indicates
    someone is probably behind waiting for you to open it, or hearing the sound of
    boiling water while you are cooking suggests that it is ready for you to pour
    something in it.


    Using sound data and machine learning could help us leverage the rich properties
    of sounds to recognize certain human activities and enhance current smart systems
    such as Siri, Alexa, and so on.


    This is what is called **acoustic activity recognition** .


    Considering a lot of the devices we surround ourselves with possess a microphone,
    there is a lot of opportunities for this technology.


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig1_HTML.jpg](images/496132_1_En_5_Chapter/496132_1_En_5_Fig1_HTML.jpg)


    Figure 5-1


    Illustration of personal devices that possess a microphone


    So far, the smart systems some of us may be using recognize words to trigger commands,
    but they have no understanding of what is going on around them; your phone does
    not know you are in the bathroom, your Alexa device does not know you might be
    in the kitchen, and so on. However, they could and this could be used to create
    more tailored and useful digital experiences.


    Before we dive into the practical part of this chapter and see how to build such
    systems in JavaScript using TensorFlow.js, it is helpful to start by understanding
    the basics of what sound is, and how it is translated to data we can use in code.


    ### 5.1.1 What is sound?


    Sound is the vibration of air molecules.


    If you have ever turned the volume of speakers really loud, you might have noticed
    that they end up moving back and forth with the music. This movement pushes on
    air particles, changing the air pressure and creating sound waves.


    The same phenomenon happens with speech. When you speak, your vocal cords vibrate,
    disturbing air molecules around and changing the air pressure, creating sound
    waves.


    A way to illustrate this phenomenon is with the following image.


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig2_HTML.jpg](images/496132_1_En_5_Chapter/496132_1_En_5_Fig2_HTML.jpg)


    Figure 5-2


    Illustration of how sound waves work. Source: [`www.researchgate.net/figure/Sound-as-a-pressure-wave-The-peaks-represent-times-when-air-molecules-are-clustered_fig2_215646583`](http://www.researchgate.net/figure/Sound-as-a-pressure-wave-The-peaks-represent-times-when-air-molecules-are-clustered_fig2_215646583)


    When you hit a tuning fork, it will start vibrating. This back and forth movement
    will change the surrounding air pressure. The movement forward will create a higher
    pressure and the movement backward will create a region of lower pressure. The
    repetition of this movement will create waves.


    On the receiver side, our eardrums vibrate with the changes of pressure and this
    vibration is then transformed into an electrical signal sent to the brain.


    So, if sound is a change in air pressure, how do we transform a sound wave into
    data we can use with our devices?


    To be able to interpret sound data, our devices use microphones.


    There exist different types of microphones, but in general, these devices have
    a diaphragm or membrane that vibrates when exposed to changes of air pressure
    caused by sound waves.


    These vibrations move a magnet near a coil inside the microphone that generate
    a small electrical current. Your computer then converts this signal into numbers
    that represent both volume and frequency.'
