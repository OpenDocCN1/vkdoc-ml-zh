  trans: "\n### 5.1.4 训练分类器\n\n我们不会为此创建自定义机器学习算法，而是使用一个专门处理声音数据的 **Teachable Machine**\
    \ 实验。你可以在 [`https://teachablemachine.withgoogle.com/train/audio`](https://teachablemachine.withgoogle.com/train/audio)\
    \ 找到它。\n\n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig10_HTML.jpg](img/496132_1_En_5_Fig10_HTML.jpg)\n\
    \n**图 5-10**  \nTeachable Machine 界面\n\n该项目允许我们在一个界面内、在浏览器中录制声音数据样本、为其添加标签、训练机器学习算法、测试输出结果并导出模型！\n\
    \n首先，我们需要使用下图中红色高亮区域录制 20 秒的背景噪音。\n\n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig11_HTML.jpg](img/496132_1_En_5_Fig11_HTML.jpg)\n\
    \n**图 5-11**  \n背景噪音部分高亮显示的 Teachable Machine 界面\n\n然后，我们可以开始为希望模型后续识别的任何声音录制一些样本。\n\
    \n最少需要录制 8 个样本，每个样本时长 2 秒。\n\n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig12_HTML.jpg](img/496132_1_En_5_Fig12_HTML.jpg)\n\
    \n**图 5-12**  \n自定义部分高亮显示的 Teachable Machine 界面\n\n由于该实验使用迁移学习来快速重新训练一个已经用声音数据训练过的模型，我们需要使用与原始模型训练时相同的格式。\n\
    \n8 个样本是最低要求，但如果你愿意，可以录制更多样本。样本越多越好。不过，别忘了这也会影响训练所需的时间。\n\n录制好样本并添加标签后，你可以在浏览器中开始实时训练，并确保不要关闭浏览器窗口。\n\
    \n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig13_HTML.jpg](img/496132_1_En_5_Fig13_HTML.jpg)\n\
    \n**图 5-13**  \nTeachable Machine 界面 – 训练模型\n\n完成此步骤后，你应该能在实验的最后一步看到一些实时预测结果。在导出模型之前，你可以尝试重复你录制的声音来验证预测的准确性。如果觉得准确度不够，可以录制更多样本并重新开始训练。\n\
    \n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig14_HTML.jpg](img/496132_1_En_5_Fig14_HTML.jpg)\n\
    \n**图 5-14**  \nTeachable Machine 界面 – 运行实时预测\n\n如果你准备继续，可以将模型上传到 Google 的某些服务器并获得一个链接，或者下载已创建的机器学习模型。\n\
    \n如果你想更深入地了解其后台工作原理、机器学习模型是如何创建的等，我建议查看 GitHub 上的源代码！\n\n尽管我非常喜欢像 Teachable Machine\
    \ 这样的界面，因为它们能让任何人快速上手和实验，但查看源代码可以揭示一些重要的细节。例如，下图就是我如何意识到该项目使用了迁移学习。\n\n在浏览代码以了解机器学习模型是如何创建以及训练是如何进行的过程中，我注意到了以下代码片段。\n\
    \n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig15_HTML.jpg](img/496132_1_En_5_Fig15_HTML.jpg)\n\
    \n**图 5-15**  \nTeachable Machine 开源 GitHub 仓库中的代码示例\n\n在第 793 行，我们可以看到调用了 `addExample`\
    \ 方法。这与本书专门讨论图像识别的章节中使用的方法相同，当时我们利用迁移学习，用新的输入图像快速训练了一个图像分类模型。\n\n如果你决定不通过 Teachable\
    \ Machine 界面，而是自行尝试重新创建这个模型，注意到这些细节非常重要。\n\n现在我们已经完成了训练过程，可以编写代码来生成预测了。\n"
- fmt: "### 5.1.5 Predictions\n\nBefore we can start writing this code, we need to\
    \ import TensorFlow.js and the speech commands model.\n\n```\nListing 5-11\nImport\
    \ TensorFlow.js and the speech commands model in an HTML file\n```\n\nAs I mentioned\
    \ earlier, this experiment uses transfer learning, so we need to import the speech\
    \ commands model that has already been trained with audio data to make it simpler\
    \ and faster to get started.\n\nThe speech commands model was originally trained\
    \ to recognize and classify spoken words, like “yes”, “no”, “up”, and “down”.\
    \ However, here, we are using it with sounds produced by activities, so it might\
    \ not be as accurate as if we were using spoken words in our samples.\n\nBefore\
    \ going through the rest of the code samples, make sure you have downloaded your\
    \ trained model from the Teachable Machine platform, unzipped it, and added it\
    \ to your application folder.\n\nThe following code samples will assume that your\
    \ model is stored in a folder called `activities-model` at the root of your application.\n\
    \nOverall, your file structure should look something like this:\n\n*   `activities-model/`\n\
    \    *   `metadata.json`\n*   `model.json`\n*   `weights.bin`\n*   `index.html`\n\
    *   `index.js`\n\nIn our JavaScript file, we will need to create a function to\
    \ load our model and start the live predictions, but before, we can create two\
    \ variables to hold the paths to our model and metadata files.\n\n```\nlet URL\
    \ = \"http://localhost:8000/activities-model/\";\nconst modelURL = `${URL}/model.json`;\n\
    const metadataURL = `${URL}metadata.json`;\nListing 5-12\nVariables to refer to\
    \ the model and its metadata\n```\n\nYou may have noticed that I used `localhost:8000`\
    \ in the preceding code; however, feel free to change the port and make sure to\
    \ update this if you decide to release your application to production.\n\nThen,\
    \ we need to load the model and ensure it is loaded before we continue.\n\n```\n\
    const model = window.speechCommands.create(\n\"BROWSER_FFT\",\nundefined,\nmodelURL,\n\
    metadataURL\n);\nawait model.ensureModelLoaded();\nListing 5-13\nLoading the model\n\
    ```\n\nOnce the model is ready, we can run live predictions by calling the `listen`\
    \ method on the model.\n\n```\nmodel.listen(\n(prediction) => {\npredictionCallback(prediction.scores);\n\
    },\nmodelParameters\n);\nListing 5-14\nLive predictions\n```\n\nAltogether, the\
    \ `setupModel` function should look like this.\n\n```\nasync function setupModel(URL,\
    \ predictionCB) {\npredictionCallback = predictionCB;\nconst modelURL = `${URL}/model.json`;\n\
    const metadataURL = `${URL}metadata.json`;\nmodel = window.speechCommands.create(\n\
    \"BROWSER_FFT\",\nundefined,\nmodelURL,\nmetadataURL\n);\nawait model.ensureModelLoaded();\n\
    const modelParameters = {\ninvokeCallbackOnNoiseAndUnknown: true, // run even\
    \ when only background noise is detected\nincludeSpectrogram: true,\noverlapFactor:\
    \ 0.5, // how often per second to sample audio, 0.5 means twice per second\n};\n\
    model.listen(\n(prediction) => {\npredictionCallback(prediction.scores);\n},\n\
    modelParameters\n);\n}\nListing 5-15\nFull code sample\n```\n\nWhen called, this\
    \ function will contain the predictions data in the callback invoked every time\
    \ the model has a prediction.\n\n```\ndocument.body.onclick = () => {\nsetupModel(URL,\
    \ (data) => {\nconsole.log(data)\n});\n}\nListing 5-16\nCalling the function\n\
    ```\n\n![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig16_HTML.jpg](images/496132_1_En_5_Chapter/496132_1_En_5_Fig16_HTML.jpg)\n\
    \nFigure 5-16\n\nExample of data returned when calling the function\n\nThis array\
    \ containing the results of the prediction is ordered by label used. In the previous\
    \ example, I had trained the model with six different labels so each array returned\
    \ contained six values.\n\nIn each array, the value closest to 1 represents the\
    \ label predicted.\n\nTo match the data predicted with the correct label, we can\
    \ create an array containing the labels we used for training and use it when calling\
    \ the `setupModel` function.\n\n```\nconst labels = [\n\"Coughing\",\n\"Phone\
    \ ringing\",\n\"Speaking\",\n\"_background_noise_\",\n];\nlet currentPrediction;\n\
    document.body.onclick = () => {\nsetupModel(URL, (data) => {\nlet maximum = Math.max(...data);\n\
    if (maximum > 0.7) {\nlet maxIndex = data.indexOf(maximum);\ncurrentPrediction\
    \ = labels[maxIndex];\nconsole.log(currentPrediction);\n}\n});\n}\nListing 5-17\n\
    Mapping scores to labels\n```\n\nIn less than 100 lines of JavaScript, we are\
    \ able to load and run a machine learning model that can classify live audio input!\n\
    \n```\nlet model, predictionCallback;\nlet URL = \"http://localhost:8000/activities-model/\"\
    ;\nconst labels = [\n\"Coughing\",\n\"Phone ringing\",\n\"Speaking\",\n\"_background_noise_\"\
    ,\n];\nlet currentPrediction, previousPrediction;\ncurrentPrediction = previousPrediction;\n\
    document.body.onclick = () => {\nsetupModel(URL, (data) => {\nlet maximum = Math.max(...data);\n\
    if (maximum > 0.7) {\nlet maxIndex = data.indexOf(maximum);\ncurrentPrediction\
    \ = labels[maxIndex];\nconsole.log(currentPrediction);\n}\n});\n};\nasync function\
    \ setupModel(URL, predictionCB) {\nconst modelURL = `${URL}/model.json`;\nconst\
    \ metadataURL = `${URL}metadata.json`;\nmodel = window.speechCommands.create(\n\
    \"BROWSER_FFT\",\nundefined,\nmodelURL,\nmetadataURL\n);\nawait model.ensureModelLoaded();\n\
    // This tells the model how to run when listening for audio\nconst modelParameters\
    \ = {\ninvokeCallbackOnNoiseAndUnknown: true, // run even when only background\
    \ noise is detected\nincludeSpectrogram: true, // give us access to numerical\
    \ audio data\noverlapFactor: 0.5, // how often per second to sample audio, 0.5\
    \ means twice per second\n};\nmodel.listen(\n(prediction) => {\npredictionCallback(prediction.scores);\n\
    },\nmodelParameters\n);\n}\nListing 5-18\nFull code sample\n```\n\n### 5.1.6 Transfer\
    \ learning API\n\nIn the previous section, we covered how to record sound samples\
    \ and train the model using the Teachable Machine experiment, for simplicity.\
    \ However, if you are looking to implement this in your own application and let\
    \ users run this same process themselves, you can use the transfer learning API.\n\
    \nThis API lets you build your own interface and call API endpoints to record\
    \ samples, train the model, and run live predictions."
