  trans: '

    #### 用户体验


    谈到用户体验，像这样的新技术总会带来一些挑战。


    首先，是**隐私**问题。


    让设备持续监听用户，总会引发一些担忧：数据存储在哪里？如何使用？是否安全？等等。


    考虑到一些发布物联网设备的公司并不总是将安全性放在首位，这些担忧非常正常。


    因此，消费者对这些设备的采用速度可能会慢于预期。


    隐私和安全不仅应该内置于这些系统中，还应该以清晰的方式传达给用户，以安抚他们，并让他们感到对自己的数据有掌控力。


    其次，另一个挑战在于教会用户**新的** **交互方式**。


    例如，尽管大多数现代手机都内置了语音助手，但通过询问 Siri 或 Google 来获取信息并非主要的交互方式。


    这可能是由于多种原因造成的，包括隐私问题、技术本身的局限性，但人们也有难以改变的习惯。


    此外，考虑到这项技术目前尚不完善，当用户尝试几次后没有得到预期的回应时，他们很容易放弃。


    缓解这个问题的一个方法是发布小型应用程序来分析用户的反应并进行调整。苹果在其新的 watchOS 中实现的水检测功能就是一个例子。


    最后，创建自定义声学活动识别系统的一大挑战在于**样本数据的收集和用户的训练**。


    尽管你可以构建并发布一个能检测水龙头流水声的应用程序，因为大多数家庭中水龙头产生的声音很可能相似，但其他一些声音并不那么常见。


    因此，让用户能够使用这项技术，就需要让他们录制自己的样本并训练模型，这样他们才有机会拥有一个定制化的应用程序。


    然而，由于机器学习算法需要用大量数据进行训练才能有机会产生准确的预测，这需要用户付出大量努力，并且很可能不会成功。


    幸运的是，一些研究人员正在试验解决这些问题的方案。


    现在，尽管这项技术存在一些限制，但解决方案也开始出现。


    例如，在保护用户隐私方面，Bjørn Karmann 开发的一个名为 Project Alias 的开源项目试图为语音助手用户赋能。


    该项目是一个 DIY 附加组件，由树莓派微控制器、扬声器和麦克风模块组成，全部封装在一个 3D 打印的外壳中，旨在阻止 Amazon Alexa 和 Google
    Home 等语音助手持续监听用户。


    通过一个移动应用程序，用户可以训练 Alias 对自定义的唤醒词或声音做出反应。一旦训练完成，Alias 就可以控制家庭助手并为你激活它。当你不使用时，这个附加组件会通过向助手的麦克风发出白噪音来阻止其监听。


    由于 Alias 的神经网络在本地运行，用户的隐私得到了保护。


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig26_HTML.jpg](img/496132_1_En_5_Fig26_HTML.jpg)


    图 5-26


    Project Alias 组件。来源：[`https://bjoernkarmann.dk/project_alias`](https://bjoernkarmann.dk/project_alias)


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig25_HTML.jpg](img/496132_1_En_5_Fig25_HTML.jpg)


    图 5-25


    Project Alias。来源：[`https://bjoernkarmann.dk/project_alias`](https://bjoernkarmann.dk/project_alias)


    另一个名为 Synthetic Sensors 的项目，旨在创建一个能够同时准确预测多种声音的系统。


    该项目由卡内基梅隆大学的一个研究团队开发，涉及一个由多个传感器组成的定制硬件，包括加速度计、麦克风、温度传感器、运动传感器和颜色传感器。


    利用从这些传感器收集的原始数据，研究人员创建了多个堆叠的声谱图，并训练算法来检测多种活动产生的模式，例如：


    *   微波炉门关闭

    *   电锯运行

    *   水壶开启

    *   水龙头流水

    *   马桶冲水


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig28_HTML.jpg](img/496132_1_En_5_Fig28_HTML.jpg)


    图 5-28


    Project Synthetic Sensors 的声谱图与活动识别示例。Gierad Laput, Yang Zhang, and Chris Harrison.
    2017. Synthetic Sensors: Towards General-Purpose Sensing. In Proceedings of the
    2017 CHI Conference on Human Factors in Computing Systems (CHI ''17). ACM, New
    York, NY, USA, 3986-3999. DOI: [`https://doi.org/10.1145/3025453.3025773`](https://doi.org/10.1145/3025453.3025773)


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig27_HTML.jpg](img/496132_1_En_5_Fig27_HTML.jpg)


    图 5-27


    Project Synthetic Sensors 硬件。Gierad Laput, Yang Zhang, and Chris Harrison. 2017.
    Synthetic Sensors: Towards General-Purpose Sensing. In Proceedings of the 2017
    CHI Conference on Human Factors in Computing Systems (CHI ''17). ACM, New York,
    NY, USA, 3986-3999. DOI: [`https://doi.org/10.1145/3025453.3025773`](https://doi.org/10.1145/3025453.3025773).


    最后，在用户体验方面，一个名为 Listen Learner 的研究项目旨在让用户能够以最小的努力收集数据并训练模型来识别自定义声音。


    该项目的全称是 Listen Learner: Automatic Class Discovery and One-Shot Interaction for
    Activity Recognition（活动识别的自动类别发现与一次性交互）。


    它旨在提供高分类准确率，同时最大限度地减少用户负担。其方法是持续监听环境中的声音，按相似声音的聚类进行分类，并在收集到足够多的相似样本后询问用户这是什么声音。


    研究结果表明，该系统能够准确、自动地学习声学事件（例如，97% 的精确率，87% 的召回率），同时遵循用户对非侵入式交互行为的偏好。


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig29_HTML.jpg](img/496132_1_En_5_Fig29_HTML.jpg)


    图 5-29


    Wu, J., Harrison, C., Bigham, J. and Laput, G. 2020. Automated Class Discovery
    and One-Shot Interactions for Acoustic Activity Recognition. In Proceedings of
    the 38th Annual SIGCHI Conference on Human Factors in Computing Systems. CHI ''20.
    ACM, New York, NY. 来源：[`www.chrisharrison.net/index.php/Research/ListenLearner`](https://www.chrisharrison.net/index.php/Research/ListenLearner)


    ## 5.2 身体与运动追踪


    在了解了如何将机器学习应用于音频数据之后，让我们来看看另一种输入类型，即身体追踪。


    在本节中，我们将使用来自网络摄像头的身体运动数据，并借助三个不同的 TensorFlow.js 模型进行处理。

    '
- fmt: '### 5.2.1 Facemesh


    The first model we are going to experiment with is called `Facemesh`. It is a
    machine learning model focused on face recognition that predicts the position
    of 486 3D facial landmarks on a user’s face, returning points with their `x`,
    `y`, and `z` coordinates.


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig31_HTML.jpg](images/496132_1_En_5_Chapter/496132_1_En_5_Fig31_HTML.jpg)


    Figure 5-31


    Map of the keypoints. Source: [`https://github.com/tensorflow/tfjs-models/tree/master/facemesh`](https://github.com/tensorflow/tfjs-models/tree/master/facemesh)


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig30_HTML.jpg](images/496132_1_En_5_Chapter/496132_1_En_5_Fig30_HTML.jpg)


    Figure 5-30


    Example of visualization of face tracking with `Facemesh`. source: [`https://github.com/tensorflow/tfjs-models/tree/master/facemesh`](https://github.com/tensorflow/tfjs-models/tree/master/facemesh)


    The main difference between this face recognition model and other face tracking
    JavaScript libraries like `face-tracking.js` is that the TensorFlow.js model intends
    to approximate the surface geometry of a human face and not only the 2D position
    of some key points.


    This model provides coordinates in a 3D environment which allows to approximate
    the depth of facial features as well as tracking the position of key points even
    when the user is rotating their face in three dimensions.


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig32_HTML.jpg](images/496132_1_En_5_Chapter/496132_1_En_5_Fig32_HTML.jpg)


    Figure 5-32


    Key points using the webcam and in a 3D visualization. Source: [`https://storage.googleapis.com/tfjs-models/demos/facemesh/index.html`](https://storage.googleapis.com/tfjs-models/demos/facemesh/index.html)


    #### Loading the model


    To start using the model, we need to load it using the two following lines in
    your HTML file.


    ```

    Listing 5-25

    Importing TensorFlow.js and Facemesh in an HTML file

    ```


    As we are going to use the video feed from the webcam to detect faces, we also
    need to add a video element to our file.


    Altogether, the very minimum HTML you need for this is as follows.


    ```

    Facemesh


    Listing 5-26

    Core HTML code needed

    ```


    Then, in your JavaScript code, you need to load the model and the webcam feed
    using the following code.


    ```

    let model;

    let video;

    const init = async () => {

    model = await facemesh.load();

    video = await loadVideo();

    main(); // This will be declared in the next code sample.

    }

    const loadVideo = async () => {

    const video = await setupCamera();

    video.play();

    return video;

    };

    const setupCamera = async () => {

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {

    throw new Error(

    "Browser API navigator.mediaDevices.getUserMedia not available"

    );

    }

    video = document.querySelector("video");

    video.width = window.innerWidth;

    video.height = window.innerHeight;

    const stream = await navigator.mediaDevices.getUserMedia({

    audio: false,

    video: {

    facingMode: "user",

    width: window.innerWidth,

    height: window.innerHeight,

    },

    });

    video.srcObject = stream;

    return new Promise(

    (resolve) => (video.onloadedmetadata = () => resolve(video))

    );

    };

    Listing 5-27

    Load the model and set up the webcam feed

    ```


    #### Predictions


    Once the model and the video are ready, we can call our `main` function to find
    facial landmarks in the input stream.


    ```

    async function main() {

    const predictions = await model.estimateFaces(

    document.querySelector("video")

    );

    if (predictions.length > 0) {

    console.log(predictions);

    for (let i = 0; i < predictions.length; i++) {

    const keypoints = predictions[i].scaledMesh;

    // Log facial keypoints.

    for (let i = 0; i < keypoints.length; i++) {

    const [x, y, z] = keypoints[i];

    console.log(`Keypoint ${i}: [${x}, ${y}, ${z}]`);

    }

    }

    }

    }

    Listing 5-28

    Function to find face landmarks

    ```


    The output of this code sample in the browser’s console returns the following.


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig34_HTML.jpg](images/496132_1_En_5_Chapter/496132_1_En_5_Fig34_HTML.jpg)


    Figure 5-34


    Output of loop statement in the console


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig33_HTML.jpg](images/496132_1_En_5_Chapter/496132_1_En_5_Fig33_HTML.jpg)


    Figure 5-33


    Output of the landmarks in the console


    As we can see in the preceding two screenshots, the predictions returned contain
    an important amount of information.


    The annotations are organized by landmark areas, in alphabetical order and containing
    arrays of `x`, `y`, and `z` coordinates.


    The bounding box contains two main keys, `bottomRight` and `topLeft`, to indicate
    the boundaries of the position of the detected face in the video stream. These
    two properties contain an array of only two coordinates, `x` and `y`, as the `z`
    axis is not useful in this case.


    Finally, the `mesh` and `scaledMesh` properties contain all coordinates of the
    landmarks and are useful to render all points in 3D space on the screen.


    #### Full code sample


    Altogether, the JavaScript code to set up the model, the video feed, and start
    predicting the position of landmarks should look like the following.


    ```

    let video;

    let model;

    const init = async () => {

    video = await loadVideo();

    await tf.setBackend("webgl");

    model = await facemesh.load();

    main();

    };

    const loadVideo = async () => {

    const video = await setupCamera();

    video.play();

    return video;

    };

    const setupCamera = async () => {

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {

    throw new Error(

    "Browser API navigator.mediaDevices.getUserMedia not available"

    );

    }

    video = document.querySelector("video");

    video.width = window.innerWidth;

    video.height = window.innerHeight;

    const stream = await navigator.mediaDevices.getUserMedia({

    audio: false,

    video: {

    facingMode: "user",

    width: window.innerWidth,

    height: window.innerHeight,

    },

    });

    video.srcObject = stream;

    return new Promise(

    (resolve) => (video.onloadedmetadata = () => resolve(video))

    );

    };

    init();

    async function main() {

    const predictions = await model.estimateFaces(

    document.querySelector("video")

    );

    if (predictions.length > 0) {

    console.log(predictions);

    for (let i = 0; i < predictions.length; i++) {

    const keypoints = predictions[i].scaledMesh;

    // Log facial keypoints.

    for (let i = 0; i < keypoints.length; i++) {

    const [x, y, z] = keypoints[i];

    console.log(`Keypoint ${i}: [${x}, ${y}, ${z}]`);

    }

    }

    }

    requestAnimationFrame(main);

    }

    Listing 5-29

    Full JavaScript code sample

    ```'
