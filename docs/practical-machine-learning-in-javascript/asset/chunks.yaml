- fmt: '### 5.2.3 PoseNet


    Finally, the last body tracking model we are going to talk about is called PoseNet.


    PoseNet is a pose detection model that can estimate a single pose or multiple
    poses in an image or video.


    Similarly to the Facemesh and Handpose models, PoseNet tracks the position of
    keypoints in a user’s body.


    The following is an example of these key points visualized.


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig48_HTML.jpg](images/496132_1_En_5_Chapter/496132_1_En_5_Fig48_HTML.jpg)


    Figure 5-48


    Visualization of the keypoints detected by PoseNet. Source: [`https://github.com/tensorflow/tfjs-models/tree/master/posenet`](https://github.com/tensorflow/tfjs-models/tree/master/posenet)


    This body tracking model can detect 17 keypoints and their 2D coordinates, indexed
    by part ID.


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig49_HTML.jpg](images/496132_1_En_5_Chapter/496132_1_En_5_Fig49_HTML.jpg)


    Figure 5-49


    List of keypoints and their ID. Source: [`https://github.com/tensorflow/tfjs-models/tree/master/posenet`](https://github.com/tensorflow/tfjs-models/tree/master/posenet)


    Even though this model is also specialized in tracking a person’s body using the
    webcam feed, using it in your code is a little bit different from the two models
    we covered in the previous sections.


    #### Importing and loading the model


    Importing and loading the model follows the same standard as most of the code
    samples in this book.


    ```

    const net = await posenet.load();

    Listing 5-42

    Loading the model in JavaScript

    ```


    ```

    Listing 5-41

    Import TensorFlow.js and the PoseNet model in HTML

    ```


    This default way of loading PoseNet uses a faster and smaller model based on the
    MobileNetV1 architecture. The trade-off for speed is a lower accuracy.


    If you want to experiment with the parameters, you can also load it this way.


    ```

    const net = await posenet.load({

    architecture: ''MobileNetV1'',

    outputStride: 16,

    inputResolution: { width: 640, height: 480 },

    multiplier: 0.75

    });

    Listing 5-43

    Alternative ways of loading the model

    ```


    If you want to try the second configuration available, you can indicate that you’d
    like to use the other model based on the ResNet50 architecture that has better
    accuracy but is a larger model, so will take more time to load.


    ```

    const net = await posenet.load({

    architecture: ''ResNet50'',

    outputStride: 32,

    inputResolution: { width: 257, height: 200 },

    quantBytes: 2

    });

    Listing 5-44

    Loading the model using the ResNet50 architecture

    ```


    If you feel a bit confused by the different parameters, don’t worry, as you get
    started, using the default ones provided is completely fine. If you want to learn
    more about them, you can find more information in the official TensorFlow documentation.


    Once the model is loaded, you can focus on predicting poses.


    #### Predictions


    To get predictions from the model, you mainly need to call the `estimateSinglePose`
    method on the model.


    ```

    const pose = await net.estimateSinglePose(image, {

    flipHorizontal: false

    });

    Listing 5-45

    Predicting single poses

    ```


    The `image` parameter can either be some `imageData`, an HTML image element, an
    HTML canvas element, or an HTML video element. It represents the input image you
    want to get predictions on.


    The `flipHorizontal` parameter indicates if you would like to flip/mirror the
    pose horizontally. By default, its value is set to `false`.


    If you are using videos, it should be set to `true` if the video is by default
    flipped horizontally (e.g., when using a webcam).


    The preceding code sample will set the variable `pose` to a single pose object
    that will contain a confidence score and an array of keypoints detected, with
    their 2D coordinates, the name of the body part, and a probability score.


    The following is an example of the object that will be returned.


    ```

    {

    "score": 0.32371445304906,

    "keypoints": [

    {

    "position": {

    "y": 76.291801452637,

    "x": 253.36747741699

    },

    "part": "nose",

    "score": 0.99539834260941

    },

    {

    "position": {

    "y": 71.10383605957,

    "x": 253.54365539551

