    预测置信度仅为 30% 的事实可能是由于物体背后的背景造成的。背景越复杂，模型就越难在图像中找到物体并对其进行分类。


    这个问题更多地与计算机视觉领域本身有关，而不是框架问题。


    如下图所示，如果你尝试在更清晰的背景下拍摄同一张照片，预测质量似乎会好得多。


