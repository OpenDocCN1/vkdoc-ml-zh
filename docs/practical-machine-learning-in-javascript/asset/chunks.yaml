  trans: '

    ### 1.3.1 朴素贝叶斯


    朴素贝叶斯算法是一种监督学习分类算法。


    它基于各种属性和先验知识来预测不同类别的概率。


    该算法主要用于文本分类以及涉及多类别的问题。它被认为具有高度可扩展性，并且相比其他算法所需的训练数据更少。


    一个可以用朴素贝叶斯解决的实际问题示例，与电视剧拍摄有关。


    除非所有剧情都发生在室内，否则剧集制作会受到环境因素的影响，例如天气、湿度、温度、风力、季节等。


    由于电视剧的各个部分并非按顺序拍摄，我们可以利用机器学习，根据特定场景的要求，帮助我们找到最适合拍摄某些剧集的日子。


    通过收集包含天气属性以及是否拍摄了室外场景的数据集，我们就能预测未来某天拍摄新场景的可能性。


    该算法之所以被称为“朴素”，是因为它假设数据集中的所有变量彼此之间都不相关。


    例如，下雨天不一定伴有大风，高湿度也不一定与高温相关。


    ### 1.3.2 K-近邻算法


    另一种流行的算法称为**K-近邻算法**。


    这是一种分类算法，它假设相似的事物彼此邻近存在。


    用一个示例图表可以很好地说明这一点。在处理机器学习问题时，你可以像这样将数据可视化。


    ![../images/496132_1_En_1_Chapter/496132_1_En_1_Fig4_HTML.jpg](img/496132_1_En_1_Fig4_HTML.jpg)


    图 1-4


    此图展示了使用 K-近邻分类算法生成的可视化结果。来源：[`​machinelearningm​astery.​com/​tutorial-to-implement-k-nearest-neighbors-in-python-from-scratch/​`](https://machinelearningmastery.com/tutorial-to-implement-k-nearest-neighbors-in-python-from-scratch/)


    在上面的可视化图中，我们可以看到绘制的数据最终形成了某种有组织的聚类。相似的数据点彼此靠近。


    K-近邻算法（KNN）正是基于这种相似性思想来对新数据进行分类。


    使用此算法时，我们需要定义一个“K”值，该值代表我们将考虑用来帮助分类新条目的最近数据点（邻居）的数量。


    例如，如果我们选择 K = 10，那么当我们想要预测一个新条目的类别时，我们会查看其最近的 10 个邻居及其类别。在我们的新数据点中，拥有最多邻居的那个类别，就是被预测为正确的类别。


    这方面的一个实际例子是预测客户行为或购买特定商品的可能性。


    一家连锁超市可以获取人们的购买数据，并可以使用无监督学习根据客户的购买习惯将其组织成不同的聚类。


    聚类的例子可能包括单身客户与有家庭的客户，或者属于特定年龄段（年轻与年长）的客户。


    考虑到人们通常与同一聚类中的人具有相似的购买习惯，使用 K-近邻算法将有助于预测人们可能倾向于购买哪种类型的产品，并利用这些信息进行广告宣传。


    ### 1.3.3 卷积神经网络


    卷积神经网络，也称为 ConvNet 或 CNN，是一种在图像分类方面表现非常出色的算法。它可用于解决诸如物体检测和人脸识别等问题。


    与人类不同，计算机将图像处理为像素数组，其长度等于高度 * 宽度 * 维度。一张 16x16 像素的 RGB 图像将被解释为一个 16*16*3 的矩阵，即一个包含
    768 个值的数组。


    使用 CNN 解决的一个经典示例是利用 MNIST 手写数字数据集。


    ![../images/496132_1_En_1_Chapter/496132_1_En_1_Fig5_HTML.jpg](img/496132_1_En_1_Fig5_HTML.jpg)


    图 1-5


    这是卷积网络工作原理的示意图，从输入图像到隐藏层，最后输出一个数字。来源：[`​towardsdatascien​ce.​com/​mnist-handwritten-digits-classification-using-a-convolutional-neural-network-cnn-af5fafbc35e9`](https://towardsdatascience.com/mnist-handwritten-digits-classification-using-a-convolutional-neural-network-cnn-af5fafbc35e9)


    上图说明了卷积神经网络如何预测输入图像中手写的数字。


    它首先将图像转换为一个包含 2352 个值（28*28*3）的数组，从而将 3D 输入转换为 1D 输入。然后，它将数据送入神经网络的不同层和滤波器，最终得到一个包含
    10 个选项的输出层，因为要预测的数字在 0 到 9 之间。


    预测的输出将是输出层中每个条目的概率，概率最高的条目即为正确结果。


    如果你要解决的问题涉及图像数据集，那么你可能需要尝试使用 CNN 算法。


    这三种算法分属不同类别。朴素贝叶斯属于贝叶斯算法，K-近邻属于基于实例的算法，而卷积神经网络（CNN）属于深度学习算法。


    还有更多类别的算法有待探索；然而，涵盖所有算法并非本书的目标。随着你更深入地研究机器学习并构建自己的应用程序，在实验过程中，你绝对应该进一步了解它们。一个问题通常不止一种解决方案，因此学习不同的算法将使你能够找到最适合你目标的那一种。


    ## 1.4 应用


    在本书前几页尝试用示例说明概念时，已经提到了一些应用；然而，机器学习在各个领域还有更多的用例。

    '
- fmt: '### 1.4.1 Healthcare


    An example of using machine learning in healthcare was introduced when I talked
    about how systems can be used to detect diseases in CT scans.


    Apart from making diagnoses from image analysis, other applications in this field
    include treatment personalization and “data wrangling” of personal records.


    Clinical data is not always digital, with a lot of forms and prescriptions still
    being handwritten; and if it is digital, each health system customizes their Electronic
    Health Records (EHR), making the data collected in one hospital different from
    the data collected at others.


    Data wrangling is the concept of capturing, organizing, and triaging data. Using
    Optical Character Recognition (OCR), a system could scan a handwritten document,
    parse words, and use a technique called “entity extraction” to understand them
    and their semantical relationship to each other.


    This way, medical documents can be automatically saved in a database, respecting
    the same format, which makes it easier to search, analyze, or use in the future.


    A few of the biggest tech companies dedicate a part of their research center to
    the development of innovative solutions in this space.


    Microsoft, for example, is working on a few research projects like project InnerEye,
    that aims to turn radiological images into measuring devices. Using machine learning
    algorithms, the goal of this project is to automatically detect tumors in 3D radiological
    images, as well as generating precise surgery planning and navigation.


    IBM has a project called IBM Watson for Oncology that helps physicians identify
    key information in a patient’s medical record to help explore personalized treatment
    options.


    Google has developed a protocol buffer for the Fast Healthcare Interoperability
    Resources (FHIR) standard that aims at homogenizing the way medical data is stored,
    so developers can build machine learning systems that can be used by any healthcare
    institution.


    ![../images/496132_1_En_1_Chapter/496132_1_En_1_Fig6_HTML.jpg](images/496132_1_En_1_Chapter/496132_1_En_1_Fig6_HTML.jpg)


    Figure 1-6


    Example of timeline built using patient’s health records. Source: [*https://ai.googleblog.com/2018/05/deep-learning-for-electronic-health.html*](https://ai.googleblog.com/2018/05/deep-learning-for-electronic-health.html)


    The preceding visualization represents a timeline of patient’s health record data.
    Each gray dot is a piece of data stored in the open data standard FHIR. A deep
    learning model can then analyze this data to make predictions.


    ### 1.4.2 Home automation


    The application for machine learning you might be the most familiar with is in
    home automation.


    You probably have heard of, or may even possess, some Internet of Things devices
    that use machine learning such as the Amazon Alexa or Google Home.


    These devices use speech recognition algorithms and natural language processing
    (NLP) to identify the words you are saying, analyze the intent, and provide the
    most accurate response possible.


    Something worth mentioning is that there is a difference between a “connected”
    device and a “smart” one. The Internet of Things can be defined as a network of
    connected “things,” meaning that devices are connected to each other, usually
    via Wi-Fi or Bluetooth.


    However, some devices are simply connected, such as the Philips Hue light bulb,
    that you can control remotely from your phone. It does not use any machine learning
    algorithm to produce any output; it only turns on and off or changes color.


    On the other hand, devices like the Nest thermostat would fall into the category
    of “smart devices.” It implements a more complex functionality as it really learns
    from your behavior over time. As you change the temperature of your house over
    a period of time, sometimes even during the same day, it learns your habits and
    adapts automatically.


    Just like the Philips Hue, it also lets you control it from anywhere using your
    phone, but the additional learning part is an example of using machine learning
    in home automation.


    Some research centers are working on improving devices like the Google Home to
    go beyond speech recognition toward activity recognition.


    Leveraging the device’s microphone, you can use machine learning algorithms and
    sound data to predict what a user is currently doing or which room they are in.
    Accessing this information would allow us to build more personalized smart systems.
    You could imagine listening to a recipe using a Google Home, following step by
    step, and the device would be able to pause automatically when it recognizes that
    you are chopping something, or using a whisk, and so on based on recognizing patterns
    in the sound data it is receiving.


    ![../images/496132_1_En_1_Chapter/496132_1_En_1_Fig7_HTML.jpg](images/496132_1_En_1_Chapter/496132_1_En_1_Fig7_HTML.jpg)


    Figure 1-7


    Examples of spectrograms representing the sound data produced by different activities.
    Source: [*www.gierad.com/projects/ubicoustics/*](http://www.gierad.com/projects/ubicoustics/)


    ### 1.4.3 Social good


    There is a rising fear in the consequences of using machine learning to solve
    certain problems, for example, in the justice system; however, there is also a
    lot of potential of using it for social good.


    Either it be for animal protection or to prevent deforestation, the applications
    of machine learning in this space are very exciting.


    Some projects aim to protect endangered species like the killer whales (also known
    as orcas) in the Salish Sea, from British Columbia to Washington State. With only
    about 73 of them left, Google partnered with Fisheries and Oceans Canada (DFO),
    as well as Rainforest Connection, to track and monitor orca’s behavior using deep
    neural networks.


    Teaching a machine learning model to recognize orca sounds, it can then detect
    the presence of the animal and alert experts in real time. This type of system
    can help monitor the animals’ health and protect them in the event of an oil spill,
    for example.


    Another project by Rainforest Connection aims to prevent illegal deforestation
    using machine learning and used cell phones.


    The devices monitor the sounds of the forest, 24 hours a day, send all the audio
    data to the cloud, and, using TensorFlow, analyze it in real time to identify
    chainsaws, logging trucks, and all sounds of illegal activity to alert locals.


    ![../images/496132_1_En_1_Chapter/496132_1_En_1_Fig8_HTML.jpg](images/496132_1_En_1_Chapter/496132_1_En_1_Fig8_HTML.jpg)


    Figure 1-8


    Visual representation of how the Rainforest Connection project against illegal
    deforestation works. Source: [www.​ted.​com/​talks/​topher_​white_​what_​can_​save_​the_​rainforest_​your_​used_​cell_​phone#t-289131](http://www.ted.com/talks/topher_white_what_can_save_the_rainforest_your_used_cell_phone%2523t-289131)


    There are plenty more interesting projects focusing on leveraging the possibilities
    of machine learning to help social causes. Even though this is not the focus of
    this book, I encourage you to do further research if this is something you would
    like to contribute to.'
