    为了这个小型演示的目的，我在 HTML 文件的按钮元素中硬编码了三位工程师的名字；但是，如果你要构建包含更多条目的内容，或者这些条目是动态生成的，你也可以在
    JavaScript 中动态替换按钮的内容。


    ```

    你想了解谁？


