    \ net.infer(img, \"conv_preds\");\n      const result = await classifier.predictClass(activation);\n\
    \      predictionParagraph.innerText = `\n        预测结果: ${classes[result.label]},\n\
    \        置信度: ${result.confidences[result.label]}`;\n      img.dispose();\n  \
    \  }\n    await tf.nextFrame();\n  }\n}\n代码清单 3-17\nrunPredictions 函数\n```\n\n\
    在上面的示例中，我们将逻辑包装在一个 `while` 循环中，因为我们希望持续预测来自网络摄像头的输入；但是，如果你希望仅在点击某个元素后才获取预测结果，也可以将其替换为\
    \ `onclick` 事件。\n\n如果分类器已经用新样本进行了训练，我们将重复两个步骤：从网络摄像头捕获图像，并将其与 mobilenet 模型一起使用。\n\
    \n```\nconst img = await webcam.capture();\nconst activation = net.infer(img,\
