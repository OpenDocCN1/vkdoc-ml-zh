    在此阶段，一旦用户点击开始按钮，我们将隐藏此内容，以显示三个可用选项。


    ##### 步骤 2：选择页面


    ![../images/496132_1_En_4_Chapter/496132_1_En_4_Fig15_HTML.jpg](img/496132_1_En_4_Fig15_HTML.jpg)


