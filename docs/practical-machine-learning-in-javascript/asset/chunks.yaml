- fmt: '### 2.1.2 Accessing data in tensors


    Once a tensor is created, you can get its values using `tf.array()` or `tf.data()`.


    `tf.array()` returns the multidimensional array of values, and `tf.data()` returns
    the flattened data.


    ```

    const tensor = tf.tensor2d([[1, 2, 3], [4, 5, 6]]);

    const array = tensor.array().then(values => console.log("array: ": values));

    // array: [ [1, 2, 3], [4, 5, 6] ]

    const data = tensor.data().then(values => console.log("data: ", values));

    // data: Float32Array [1, 2, 3, 4, 5, 6];

    Listing 2-7

    Accessing data in tensors

    ```


    As you can see in the preceding example, these two methods return a promise.


    In JavaScript, a promise is a proxy for a value that is not created yet at the
    time the promise is called. Promises represent operations that have not completed
    yet, so they are used with asynchronous actions to supply a value at some point
    in the future when the action has completed.


    However, a synchronous version is also provided using `arraySync()` and `dataSync()`.


    ```

    const tensor = tf.tensor2d([[1, 2, 3], [4, 5, 6]]);

    const values = tensor.arraySync();

    console.log("values: ": values); // values: [ [1, 2, 3], [4, 5, 6] ]

    const data = tensor.dataSync()

    console.log("data: ", values); // data: Float32Array [1, 2, 3, 4, 5, 6];

    Listing 2-8

    Accessing data in tensors synchronously

    ```


    It is not recommended to use them in production applications as they will cause
    performance issues.


    ### 2.1.3 Operations on tensors


    In the previous section, we learned that tensors are data structures that allow
    us to store data in a way TensorFlow.js can work with. We saw how to create them,
    shape them, and access their values.


    Now, let’s look into some of the different operations that allow us to manipulate
    them.


    These operations can be organized into categories. Some of them allow you to do
    arithmetic on a tensor, for example, adding multiple tensors together, other operations
    focus on doing logical operations such as evaluating if a tensor is greater than
    another, and others provide a way to do basic maths, like computing the square
    of all elements in a tensor.


    The full list of operations is available at [`https://js.tensorflow.org/api/latest/#Operations`](https://js.tensorflow.org/api/latest/%2523Operations).


    Here’s an example of how to use these operations.


    ```

    const tensorA = tf.tensor([1, 2, 3, 4]);

    const tensorB = tf.tensor([5, 6, 7, 8]);

    const tensor = tf.add(tensorA, tensorB); // [6, 8, 10, 12]

    // or

    // const tensor = tensorA.add(tensorB);

    Listing 2-9

    Example of operation on a tensor

    ```


    In this example, we’re adding two tensors together. If you’re looking at the first
    value of `tensorA`, which is 1, and the first value of `tensorB`, which is 5,
    adding 1 + 5 does result in the number 6, which is the first value of our final
    tensor.


    To be able to use this kind of operations, your tensors have to have the same
    **shape** but not necessarily the same **rank**.


    If you remember from the last few pages, the shape is the amount of values in
    each dimension of the tensor, when the rank is the amount of dimensions.


    Let’s illustrate this with another example.


    ```

    const tensorA = tf.tensor2d([[1, 2, 3, 4]]);

    const tensorB = tf.tensor([5, 6, 7, 8]);

    const tensor = tf.add(tensorA, tensorB); // [[6, 8, 10, 12],]

    Listing 2-10

    Example of operation on a tensor

    ```


    In this case, `tensorA` is now a 2D tensor, but `tensorB` is still one dimensional.


    The result of adding the two is now a tensor with the same values as before but
    with a different number of dimensions.


    However, if we try to add multiple tensors with different shapes, it will result
    in an error.


    ```

    const tensorA = tf.tensor([1, 2, 3, 4]);

    const tensorB = tf.tensor([5, 6, 7]);

    const tensor = tf.add(tensorA, tensorB);

    // Error: Operands could not be broadcast together with shapes 3 and 4.

    Listing 2-11

    Error generated when using an incorrect shape

    ```


    What this error is telling us is that this operand cannot be used with these two
    tensors, as one of them has four elements, and the other only three.


    Tensors are immutable, so these operations will not mutate the original tensors,
    but will instead always return a new `tf.Tensor`.


    ### 2.1.4 Memory


    Finally, when working with tensors, you need to explicitly clear up memory using
    `dispose()` or `tf.dispose()`.


    ```

    const tensor = tf.tensor([1, 2, 3, 4]);

    tensor.dispose();

    // or

    tf.dispose(tensor);

    Listing 2-12

    Using the dispose method

    ```


    Another way to manage memory is using `tf.tidy()` when chaining operations.


    As tensors are immutable, the result of each operation is a new tensor. To avoid
    having to call dispose on all the tensors you generate, using `tf.tidy()` allows
    you to only keep the last one generated from all your operations and dispose of
    all the others.


    ```

    const tensorA = tf.tensor([1, 2, 3, 4]);

    const tensor = tf.tidy(() => {

    return tensorA.square().neg();

    });

    console.log(tensor.dataSync()); // [-1, -4, -9, -16]

    Listing 2-13

    Using the tidy method

    ```


    In this example, the result of `square()` is going to be disposed, whereas the
    result of `neg()` won’t as it returns the value of the function.


    Now that we have covered what is at the core of TensorFlow.js and how to work
    with tensors, let’s look into the different features offered by the library to
    get a better idea of what is possible.


    ## 2.2 Features


    In this subchapter, we are going to explore the three main features currently
    available in TensorFlow.js. This includes using a pre-trained model; doing transfer
    learning, which means retraining a model with custom input data; and doing everything
    in JavaScript, meaning, creating a model, training it, and running predictions,
    all in the browser.


    We will cover these features from the simplest to use to the most complex.'
