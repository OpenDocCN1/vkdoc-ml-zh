    ## 5.3 Hardware data


    For the last section of this chapter and the last part of the book that will contain
    code samples, we are going to look into something a bit more advanced and experimental.
    The next few pages will focus on using data generated by hardware and build a
    custom machine learning model to detect gestures.


    Usually, when working with hardware, I use microcontrollers such as Arduino or
    Raspberry Pi; however, to make it more accessible to anyone reading this book
    that might not have access to such material, this next section is going to use
    another device that has built-in hardware components, your mobile phone!


    This is assuming you possess a modern mobile phone with at least an accelerometer
    and gyroscope.


    To have access to this data in JavaScript, we are going to use the Generic Sensor
    API.


    This API is rather new and experimental and has browser support only in Chrome
    at the moment, so if you decide to write the following code samples, make sure
    to use Chrome as your browser.


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig52_HTML.jpg](images/496132_1_En_5_Chapter/496132_1_En_5_Fig52_HTML.jpg)


    Figure 5-52: Browser support for the Generic Sensor API. Source: [`https://caniuse.com/#search=sensor%20api`](https://caniuse.com/#search=sensor%2520api)


    To build our gesture classifier, we are going to access and record data from the
    accelerometer and gyroscope present in your phone, save this data into files in
    your project, create a machine learning model, train it, and run predictions on
    new live data.


    To be able to do this, we are going to need a little bit of Node.js, web sockets
    with socket.io, the Generic Sensor API, and TensorFlow.js.


    If you are unfamiliar with some of these technologies, don’t worry, I’m going
    to explain each part and provide code samples you should be able to follow.


    ### 5.3.1 Web Sensors API


    As we are using hardware data in this section, the first thing we need to do is
    verify that we can access the correct data.


    As said a little earlier, we need to record data from the gyroscope and accelerometer.


    The gyroscope gives us details about the orientation of the device and its angular
