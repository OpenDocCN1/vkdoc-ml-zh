  raw: '### 5.3.6 Live predictions


    For this last step, let’s create a new JavaScript file called `predict.js` .


    We are going to create a new endpoint called ‘`/predict`’, serve our index.html
    file, use similar web sockets code to send motion data from our phone to our server,
    and run live predictions.


    A first small modification is in our initial `index.js` file in our front-end
    code. Instead of sending the motion data as a string, we need to replace it with
    the following data.


    ```

    let data = {

    xAcc: accelerometerData.x,

    yAcc: accelerometerData.y,

    zAcc: accelerometerData.z,

    xGyro: gyroscopeData.x,

    yGyro: gyroscopeData.y,

    zGyro: gyroscopeData.z,

    };

    socket.emit("motion data", data);

    Listing 5-80

    In index.js. Update the shape of the motion data sent via web sockets

    ```


    As the live data is going to have to be fed to the model, it is easier to send
    an object of numbers rather than go through the same formatting we went during
    the training process.


    Then, our `predict.js` file is going to look very similar to our `server.js` file
    at the exception of an additional `predict` function that feeds live data to the
    model and generate a prediction about the gesture.


    ```

    const tf = require("@tensorflow/tfjs-node");

    const express = require("express");

    const app = express();

    var http = require("http").createServer(app);

    const io = require("socket.io")(http);

    let liveData = [];

    let predictionDone = false;

    let model;

    const gestureClasses = ["letterA", "letterB", "letterC"];

    // Create new endpoint

    app.use("/predict", express.static(__dirname + "/"));

    io.on("connection", async function (socket) {

    // Load the model

    model = await tf.loadLayersModel("file://model/model.json");

    socket.on("motion data", function (data) {

    predictionDone = false;

    // This makes sure the data has the same shape as the one used during training.
    600 represents 6 values (x,y,z for accelerometer and gyroscope), collected 100
    times.

    if (liveData.length  {

    tf.tidy(() => {

    const inputData = newSampleData;

    // Create a tensor from live data

    const input = tf.tensor2d([inputData], [1, 600]);

    const predictOut = model.predict(input);

    // Access the highest probability

    const winner = gestureClasses[predictOut.argMax(-1).dataSync()[0]];

    console.log(winner);

    });

    };

    http.listen(process.env.PORT || 3000);

    Listing 5-81

    In predict.js. Complete code for the predict.js file

    ```


    If you run the preceding code sample using `node predict.js`, visit the page on
    `''/predict''` on your phone, and execute one of the three gestures we trained.
    While holding the screen down, you should see a prediction in the terminal once
    you release the screen!


    When running live predictions, you might come across the following error. This
    happens when a gesture is executed too fast and the amount of data collected was
    lower than our 600 value, meaning the data does not have the correct shape for
    the model to use it. If you try again a bit slower, it should be working.


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig57_HTML.jpg](images/496132_1_En_5_Chapter/496132_1_En_5_Fig57_HTML.jpg)


    Figure 5-57


    Possible error when a gesture is executed too fast


    Now that our live predictions work, you could move on to changing some parameters
    used to create the model to see how it impacts the predictions, or train different
    gestures, or even send the prediction back to the front end using web sockets
    to create an interactive application. The main goal of this last section was to
    cover the steps involved into creating your own machine learning model.


    Over the last few pages we learned to access hardware data using the Generic Sensor
    API, set up a server and web sockets to communicate and share data, save motion
    data into files, process and transform it, as well as create, train, and use a
    model to predict live gestures!


    Hopefully it gives you a better idea of all the possibilities offered by machine
    learning and TensorFlow.js.


    However, it was a lot of new information if you are new to it, especially this
    last section was quite advanced and experimental, so I would not expect you to
    understand everything and feel completely comfortable yet.


    Feel free to go back over the code samples, take your time, and play around with
    building small prototypes if you are interested.


    # 6. Machine learning in production


    Now that you hopefully feel more comfortable experimenting with machine learning
    and building applications using different models and inputs, let’s talk about
    the different aspects of putting machine learning models and systems into production.


    ![../images/496132_1_En_6_Chapter/496132_1_En_6_Fig8_HTML.jpg](images/496132_1_En_6_Chapter/496132_1_En_6_Fig8_HTML.jpg)


    Figure 6-8


    Features of kaos. Source: [https://​ki-labs.​com/​kaos/​#features](https://ki-labs.com/kaos/%2523features)


    ![../images/496132_1_En_6_Chapter/496132_1_En_6_Fig7_HTML.jpg](images/496132_1_En_6_Chapter/496132_1_En_6_Fig7_HTML.jpg)


    Figure 6-7


    Example of test pyramid. Source: [*https://martinfowler.com/articles/cd4ml.html*](https://martinfowler.com/articles/cd4ml.html)


    ![../images/496132_1_En_6_Chapter/496132_1_En_6_Fig6_HTML.jpg](images/496132_1_En_6_Chapter/496132_1_En_6_Fig6_HTML.jpg)


    Figure 6-6


    Components of a machine learning system. Source: [https://​cloud.​google.​com/​solutions/​machine-learning/​mlops-continuous-delivery-and-automation-pipelines-in-machine-learning](https://cloud.google.com/solutions/machine-learning/mlops-continuous-delivery-and-automation-pipelines-in-machine-learning)


    ![../images/496132_1_En_6_Chapter/496132_1_En_6_Fig5_HTML.jpg](images/496132_1_En_6_Chapter/496132_1_En_6_Fig5_HTML.jpg)


    Figure 6-5


    Example schema. Source: [www.​tensorflow.​org/​tfx/​guide/​schemagen](https://www.tensorflow.org/tfx/guide/schemagen)


    ![../images/496132_1_En_6_Chapter/496132_1_En_6_Fig4_HTML.jpg](images/496132_1_En_6_Chapter/496132_1_En_6_Fig4_HTML.jpg)


    Figure 6-4


    Standard TFX pipeline


    ![../images/496132_1_En_6_Chapter/496132_1_En_6_Fig3_HTML.jpg](images/496132_1_En_6_Chapter/496132_1_En_6_Fig3_HTML.jpg)


    Figure 6-3


    Components of a machine learning system. Source: [https://​cloud.​google.​com/​solutions/​machine-learning/​mlops-continuous-delivery-and-automation-pipelines-in-machine-learning](https://cloud.google.com/solutions/machine-learning/mlops-continuous-delivery-and-automation-pipelines-in-machine-learning)


    ![../images/496132_1_En_6_Chapter/496132_1_En_6_Fig2_HTML.jpg](images/496132_1_En_6_Chapter/496132_1_En_6_Fig2_HTML.jpg)


    Figure 6-2


    Types of engineers per phase.


    ![../images/496132_1_En_6_Chapter/496132_1_En_6_Fig1_HTML.jpg](images/496132_1_En_6_Chapter/496132_1_En_6_Fig1_HTML.jpg)


    Figure 6-1


    Phases of Continuous Delivery for Machine Learning. Source: [`https://martinfowler.com/articles/cd4ml.html`](https://martinfowler.com/articles/cd4ml.html)


    Before we start, it is important to know that this chapter is not going to be
    a deep dive into how to set up a machine learning pipeline yourself using Kubernetes
    clusters, configuring load balancers, and so on, as this is in general a task
    taken on by a DevOps or infrastructure teams. However, it is important to understand
    the challenges that come with productionizing machine learning models, so we are
    instead going to explain some of them, as well as introduce a few different tools
    that should help you add machine learning in your production applications if you
    do not have the opportunity to work with a dedicated team.


    ## 6.1 Challenges


    Putting machine learning in production creates a different set of challenges than
    the ones we might have had so far.


    In the personal projects we have built in this book, we were the only user and
    we were running everything locally. We were more in a proof-of-concept phase.
    In production, not only an application will be used by hundreds, thousands, or
    even millions of users, it will also be built by multiple teams. As a result,
    your system will have to be able to adapt and handle more challenges.'
