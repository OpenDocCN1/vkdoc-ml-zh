    file, start by instantiating it with `const socket = io()`.


    If you have any issue with setting up the package, feel free to refer to the official
    documentation.


    Then, in our event listener for `touchstart`, we can use `socket.io` to send data
    to the server with the following data.


    ```

    socket.emit("motion data", `${accelerometerData.x} ${accelerometerData.y} ${accelerometerData.z}
    ${gyroscopeData.x} ${gyroscopeData.y} ${gyroscopeData.z}`);

