    如果所有手指都伸展，我们记录消息“paper gesture!”。


    如果一切正常，你应该能够将手放在摄像头前，所有手指伸展，并在浏览器的控制台中看到日志。


    如果你切换到其他手势，则应记录消息“other gesture”。


