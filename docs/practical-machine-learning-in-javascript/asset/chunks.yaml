  trans: '

    ### 7.2.2 种族偏见


    过去几年中，有偏见的机器学习算法最具影响力的例子之一，是一款名为 COMPAS 的 AI 驱动软件。


    法官在法庭上使用该软件，根据对 137 项调查问题的回答，生成风险评估并预测哪些罪犯最有可能再次犯罪。


    使用该算法的问题在于，人们发现，当它的预测出错时，对黑人和白人罪犯显示的结果是不同的。


    黑人罪犯被标记为高风险，即使他们再次犯罪的可能性较低；而白人罪犯被标记为低风险，即使他们再次犯罪的可能性更高。


    ![../images/496132_1_En_7_Chapter/496132_1_En_7_Fig3_HTML.jpg](img/496132_1_En_7_Fig3_HTML.jpg)


    图 7-3


    COMPAS 软件结果


    这种错误预测被用于司法系统本身已经是一个严重的问题，但其使用规模之大更令人担忧。


    考虑到美国每年监禁大量人口，人们只能想象错误定罪的数量之多。


    此外，由于 COMPAS 背后的公司 Northpointe 拒绝披露其算法的细节，研究人员无法评估其不公正的程度。


    以上只是机器学习算法中可能引入偏见的两个例子。不幸的是，还有更多此类情况，我建议深入探讨这个主题。


    ## 7.3 潜在解决方案


    尽管机器学习中的偏见无法完全根除，但仍有一些方法可以将其最小化。


    ### 7.3.1 界定问题


    在构建模型和生成预测之前，数据科学家需要确定他们试图解决什么问题。正是在这个阶段，就可能发现一些偏见。如果你正在为一家希望自动评估人们“信用度”的信贷公司构建模型，那么关于“值得获得信贷的人”的定义本身，就可能已经包含了某些不公和歧视。


    例如，一家公司可以决定要最大化其利润率，这意味着信用度将基于客户的富裕程度，因为他们可能会申请更大的贷款。或者，它也可以决定更侧重于最大化贷款合同的数量，无论客户是否负担得起。


    总的来说，问题在于这些决策是出于商业目标，而非公平性，尽管它们最终会以多种方式影响真实的人。


    如果算法预测发放次级贷款是最大化利润的有效方式，那么即使这不是公司的直接意图，它最终也会陷入掠夺性行为。


    ### 7.3.2 收集数据


    这可能是偏见进入机器学习模型更常见的例子，并且可能以两种方式出现。


    #### 对现实的不正确呈现


    你可能听说过这样的案例：收集的数据不能代表现实，导致机器学习模型产生错误的预测。


    例如，在人脸识别中，如果算法训练时使用的浅肤色人脸图像多于深肤色人脸图像，那么生成的模型必然更擅长识别浅肤色人脸。


    为了尝试防止这种歧视，在将数据输入算法之前对其进行分析，可以让你了解其质量以及生成更公平预测的潜力。


    通常，如果你决定使用预训练模型，应该有一个文档化的链接供你查看所使用的数据集。如果找不到，我会向分享该模型的公司或个人索取。


    如果你无法验证数据的质量，我建议寻找其他模型。


    如果你找到了原始数据集，并注意到它缺乏多样性，不能很好地代表现实，你可以选择不使用基于这些数据训练的模型，或者你也可以选择利用它，收集一些额外的、更多样化的数据，并应用迁移学习来生成一个新的、偏见更少的模型，用于你的应用程序。


    如果你选择自己收集数据，而不是依赖现有模型，我建议你首先分析在你的特定情况下多样性意味着什么，你的模型要解决什么问题，它将用于哪些人群，你计划使用哪些来源来收集数据，这些来源是否能代表现实，等等。


    分析工作对于尽早发现潜在问题或担忧，并构建一个能最大限度减少偏见持续存在的模型至关重要。


    #### 反映现有偏见


    收集数据时的第二个问题在于使用了包含现有偏见的数据。


    一些公司使用其内部的历史数据来训练机器学习模型，以实现任务自动化。


    例如，在几年前（2018 年），亚马逊意识到其内部的 AI 招聘工具对女性存在偏见。


    他们使用过去 10 年收集的求职申请数据，对新候选人进行 0 到 5 星的评分。然而，由于亚马逊雇佣的大多数人是男性，模型推断出男性候选人更受青睐。


    通过查看历史招聘数据并分析数千份简历，该模型的逻辑是亚马逊不喜欢简历中出现“女性”这个词。


    结果，任何包含这个词的简历，例如“女子队队长”或“就读于女子学院”，其评分都低于未提及该词的简历。


    尽管这在 2018 年成为了新闻，但亚马逊早在 2015 年就意识到其新系统并非以性别中立的方式对候选人进行评分。


    防止此类歧视的一种方法与前面章节相关，即分析你正在使用的数据。数据是内部的并不意味着它没有偏见。然而，考虑到这些数据是过去 10 年收集的，我们同意手动分析的数据量可能太大。我仍然建议收集一组随机样本，并让人们评估其公平性和多样性。


    此外，当使用模型执行像招聘这样重要的任务时，我希望在使用之前已经对模型进行了一些测试。招聘中的偏见是一个众所周知的问题，并且可能以多种形式出现。因此，如果你决定构建或使用依赖机器学习的招聘软件，我建议针对不同的偏见进行测试，从性别到教育背景，再到种族等等。

    '
- fmt: '### 7.3.3 Data preparation


    Another place where bias can be introduced is when preparing the data. Even if
    you have analyzed your data and made sure that it is diverse and represents the
    reality of the environment it is going to be used for, the preparation stage also
    needs some attention.


    This phase involves selecting attributes you want your algorithm to consider when
    learning and generating predictions and can be described as more of an art than
    a science.


    Often, some experimentations with attributes and parameters are needed to fine-tune
    a model.


    However, you also need to make sure that reaching high accuracy does not also
    introduce bias. While the impact of experimenting with attributes on accuracy
    is measurable, its impact on bias isn’t.


    In the case of the recruitment tool at Amazon, attributes could have been candidates’
    gender, education level, years of experience, programming languages, geographical
    location, and so on.


    For the purpose of hiring someone as an engineer, for example, a person’s gender
    should not matter at all so should be omitted as an attribute to train the model.


    A person’s geographical location would only matter if the company cannot sponsor
    visas to relocate.


    As a result, to maximize fairness, a model trained to rank candidates should take
    into consideration attributes impacting their skill level, including years of
    experience and programming languages.


    It could also use education level, but this could introduce some bias toward people
    who have had the privilege of getting higher education.


    In the technology industry, many very good developers have not taken the path
    of getting a computer science degree, so using this as an attribute could result
    in ranking people lower even though, in practice, they possess the right skills
    and would be great employees.


    Hopefully this example demonstrates how important the data preparation phase is,
    no matter if you have already spent some time making sure the dataset you are
    using is diverse.


    ### 7.3.4 Team diversity


    Finally, minimizing bias in machine learning also lies in the makeup of the teams
    working on developing models.


    We all have biases, and an efficient way to mitigate diversity deficits is in
    improving diversity in your teams.


    You can imagine that issues found in facial recognition models would have been
    prevented if the teams working on them included more non-white people.


    Not only would this help in testing the predictions of a model to make sure their
    accuracy is high across a diverse set of faces, it would also improve the overall
    process.


    Previous phases of framing the problem, collecting, and preparing the data would
    benefit from people with different backgrounds, life experiences, and so on. Potential
    issues could be raised early and influence the development of a more fair model
    while still working toward high accuracy.


    Not only is this an ethical challenge but also a technical one. How good really
    is a facial recognition model if it’s mostly accurate when used on light-skinned
    people? If the goal of machine learning is to develop models with the highest
    accuracy, then the real technical challenge is in high accuracy across a diverse
    set of samples.


    ## 7.4 Challenges


    Unfortunately, even though the previous section stated a few of the potential
    solutions to reduce bias in machine learning, this issue is a difficult one to
    fix and will probably still be present for a while.


    In this section, we are going to go through a few challenges of mitigating bias.


    **Unknowns**


    It can be unclear where bias was introduced in a system. Even if you work with
    a diverse dataset, make sure to use attributes that do not alter the fairness
    of the predictions; it is sometimes difficult to understand how a model generated
    a certain result.


    In the case of Amazon and its gender-biased recruiting tool, once they realized
    that the model was picking up words like “women’s” to rank candidates lower, they
    updated their model to ignore explicitly gendered words; however, that was not
    enough. They later discovered that the updated system was still picking up on
    implicitly gendered words that were more commonly found on men’s resumes, such
    as “executed” and “captured”, and was using this to made decisions.


    **Fairness is relative**


    Another challenge when it comes to bias in machine learning is around the fact
    that not everyone agrees on what is considered fair or unfair. Unfortunately,
    more work has been done on the technical side than on the ethics side of AI, so
    there are no real standards, regulations, and policies at this point when it comes
    to designing ethical AI applications.


    Some companies like Google are sharing their principles when it comes to developing
    AI solutions that other companies can also decide to adopt; however, these should
    not be considered regulations. For example, so far, Google’s AI principles include
    the following objectives for AI applications:


    *   Be socially beneficial

    *   Avoid creating or reinforcing unfair bias

    *   Be built and tested for safety

    *   Be accountable to people

    *   Incorporate privacy design principles

    *   Uphold high standards of scientific excellence

    *   Be made available for uses that accord with these principles


    Even though these are a good start, we should hope that governments will soon
    provide real regulations around the development and use of machine learning models
    and how to assess their fairness, so we can hope to avoid the widespread implementation
    of biased systems.


    In this chapter, we covered briefly some examples of situations where biased machine
    learning models were used and the consequences, as well as some possible solutions.


    If you are interested in learning more about this topic, I would highly recommend
    you read the books *Weapons of Math Destruction* by Cathy O’Neil and *Algorithms
    of Oppression* by Safiya Noble, in which the authors cover this fascinating subject
    in much more depth.'
  raw: '### 7.3.3 Data preparation


    Another place where bias can be introduced is when preparing the data. Even if
    you have analyzed your data and made sure that it is diverse and represents the
    reality of the environment it is going to be used for, the preparation stage also
    needs some attention.


    This phase involves selecting attributes you want your algorithm to consider when
    learning and generating predictions and can be described as more of an art than
    a science.


    Often, some experimentations with attributes and parameters are needed to fine-tune
    a model.


    However, you also need to make sure that reaching high accuracy does not also
    introduce bias. While the impact of experimenting with attributes on accuracy
    is measurable, its impact on bias isn’t.


    In the case of the recruitment tool at Amazon, attributes could have been candidates’
    gender, education level, years of experience, programming languages, geographical
    location, and so on.


    For the purpose of hiring someone as an engineer, for example, a person’s gender
    should not matter at all so should be omitted as an attribute to train the model.


    A person’s geographical location would only matter if the company cannot sponsor
    visas to relocate.


    As a result, to maximize fairness, a model trained to rank candidates should take
    into consideration attributes impacting their skill level, including years of
    experience and programming languages.


    It could also use education level, but this could introduce some bias toward people
    who have had the privilege of getting higher education.


    In the technology industry, many very good developers have not taken the path
    of getting a computer science degree, so using this as an attribute could result
    in ranking people lower even though, in practice, they possess the right skills
    and would be great employees.


    Hopefully this example demonstrates how important the data preparation phase is,
    no matter if you have already spent some time making sure the dataset you are
    using is diverse.


    ### 7.3.4 Team diversity


    Finally, minimizing bias in machine learning also lies in the makeup of the teams
    working on developing models.


    We all have biases, and an efficient way to mitigate diversity deficits is in
    improving diversity in your teams.


    You can imagine that issues found in facial recognition models would have been
    prevented if the teams working on them included more non-white people.


    Not only would this help in testing the predictions of a model to make sure their
    accuracy is high across a diverse set of faces, it would also improve the overall
    process.


    Previous phases of framing the problem, collecting, and preparing the data would
    benefit from people with different backgrounds, life experiences, and so on. Potential
    issues could be raised early and influence the development of a more fair model
    while still working toward high accuracy.


    Not only is this an ethical challenge but also a technical one. How good really
    is a facial recognition model if it’s mostly accurate when used on light-skinned
    people? If the goal of machine learning is to develop models with the highest
    accuracy, then the real technical challenge is in high accuracy across a diverse
    set of samples.


    ## 7.4 Challenges


    Unfortunately, even though the previous section stated a few of the potential
    solutions to reduce bias in machine learning, this issue is a difficult one to
    fix and will probably still be present for a while.


    In this section, we are going to go through a few challenges of mitigating bias.


    **Unknowns**


    It can be unclear where bias was introduced in a system. Even if you work with
    a diverse dataset, make sure to use attributes that do not alter the fairness
    of the predictions; it is sometimes difficult to understand how a model generated
    a certain result.


    In the case of Amazon and its gender-biased recruiting tool, once they realized
    that the model was picking up words like “women’s” to rank candidates lower, they
    updated their model to ignore explicitly gendered words; however, that was not
    enough. They later discovered that the updated system was still picking up on
    implicitly gendered words that were more commonly found on men’s resumes, such
    as “executed” and “captured”, and was using this to made decisions.


    **Fairness is relative**


    Another challenge when it comes to bias in machine learning is around the fact
    that not everyone agrees on what is considered fair or unfair. Unfortunately,
    more work has been done on the technical side than on the ethics side of AI, so
    there are no real standards, regulations, and policies at this point when it comes
    to designing ethical AI applications.


    Some companies like Google are sharing their principles when it comes to developing
    AI solutions that other companies can also decide to adopt; however, these should
    not be considered regulations. For example, so far, Google’s AI principles include
    the following objectives for AI applications:


    *   Be socially beneficial


    *   Avoid creating or reinforcing unfair bias


    *   Be built and tested for safety


    *   Be accountable to people


    *   Incorporate privacy design principles


    *   Uphold high standards of scientific excellence


    *   Be made available for uses that accord with these principles


    Even though these are a good start, we should hope that governments will soon
    provide real regulations around the development and use of machine learning models
    and how to assess their fairness, so we can hope to avoid the widespread implementation
    of biased systems.


    In this chapter, we covered briefly some examples of situations where biased machine
    learning models were used and the consequences, as well as some possible solutions.


    If you are interested in learning more about this topic, I would highly recommend
    you read the books *Weapons of Math Destruction* by Cathy O’Neil and *Algorithms
    of Oppression* by Safiya Noble, in which the authors cover this fascinating subject
    in much more depth.'
  trans: '

    ### 7.3.3 数据准备


    另一个可能引入偏见的地方是数据准备阶段。即使你已经分析过数据，并确保其具有多样性且能反映实际应用环境的真实情况，准备阶段同样需要关注。


    这一阶段涉及选择你希望算法在学习与生成预测时考虑的属性，与其说是一门科学，不如说更像一门艺术。


    通常，需要对属性和参数进行一些实验来微调模型。


    然而，你也需要确保在追求高准确率的同时不会引入偏见。虽然调整属性对准确率的影响是可衡量的，但对偏见的影响却并非如此。


    以亚马逊的招聘工具为例，属性可能包括候选人的性别、教育水平、工作年限、编程语言、地理位置等。


    例如，在招聘工程师时，一个人的性别根本不应成为考量因素，因此应将其排除在模型训练属性之外。


    一个人的地理位置只有在公司无法提供签证赞助以支持其搬迁时才有意义。


    因此，为了最大限度地实现公平，用于对候选人进行排名的模型应考虑影响其技能水平的属性，包括工作年限和编程语言。


    它也可以使用教育水平，但这可能会对有机会接受高等教育的人产生偏见。


    在科技行业，许多非常优秀的开发者并没有走计算机科学学位这条路，因此将教育水平作为属性可能会导致这些人排名较低，而实际上他们拥有合适的技能，会成为出色的员工。


    希望这个例子能说明数据准备阶段的重要性，无论你是否已经花时间确保所使用的数据集具有多样性。


    ### 7.3.4 团队多样性


    最后，减少机器学习中的偏见也取决于开发模型的团队构成。


    我们每个人都有偏见，而弥补多样性不足的一个有效方法就是提高团队的多样性。


    你可以想象，如果开发人脸识别模型的团队中有更多非白人成员，那么该模型中发现的问题本可以避免。


    这不仅有助于测试模型的预测结果，确保其在多样化的面孔中保持高准确率，还能改进整个流程。


    在之前的问题定义、数据收集和准备阶段，拥有不同背景、生活经历等的人将带来益处。潜在问题可以及早提出，并在追求高准确率的同时，影响更公平模型的开发。


    这不仅是伦理挑战，也是技术挑战。一个人脸识别模型如果主要对浅肤色人群准确，那它到底有多好？如果机器学习的目标是开发具有最高准确率的模型，那么真正的技术挑战在于在多样化的样本中实现高准确率。


    ## 7.4 挑战


    不幸的是，尽管上一节提到了一些减少机器学习偏见的潜在解决方案，但这个问题很难解决，并且可能仍会持续存在一段时间。


    在本节中，我们将探讨减少偏见所面临的几个挑战。


    **未知因素**


    偏见是在系统的哪个环节引入的，有时并不明确。即使你使用了多样化的数据集，并确保使用的属性不会改变预测的公平性，有时也很难理解模型是如何得出某个结果的。


    以亚马逊及其存在性别偏见的招聘工具为例，一旦他们意识到模型会通过“女性”等词语来降低候选人排名，他们就更新了模型以忽略明确的性别词汇；然而，这还不够。他们后来发现，更新后的系统仍然会捕捉到男性简历中更常见的隐含性别词汇，例如“执行”和“捕获”，并据此做出决策。


    **公平是相对的**


    机器学习偏见方面的另一个挑战是，并非所有人都认同什么是公平或不公平。不幸的是，在人工智能领域，技术方面的工作比伦理方面的工作要多，因此在设计合乎伦理的人工智能应用时，目前还没有真正的标准、法规和政策。


    像谷歌这样的公司正在分享他们在开发人工智能解决方案时的原则，其他公司也可以决定采纳；然而，这些不应被视为法规。例如，到目前为止，谷歌的人工智能原则包括以下针对人工智能应用的目标：


    *   对社会有益

    *   避免制造或强化不公平的偏见

    *   为安全而构建和测试

    *   对人们负责

    *   融入隐私设计原则

    *   坚持高标准的科学卓越性

    *   其用途应符合这些原则


    尽管这是一个好的开端，但我们希望政府能尽快出台关于机器学习模型开发和使用以及如何评估其公平性的真正法规，这样我们才有希望避免有偏见的系统被广泛部署。


    在本章中，我们简要介绍了一些存在偏见的机器学习模型被使用的例子及其后果，以及一些可能的解决方案。


    如果你有兴趣了解更多关于这个话题的内容，我强烈推荐你阅读凯西·奥尼尔的《数学杀伤性武器》和萨菲亚·诺布尔的《算法压迫》，作者在这些书中更深入地探讨了这个引人入胜的主题。

