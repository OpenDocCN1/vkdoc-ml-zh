- fmt: '#### Stop words


    Stop words are words that can add a lot of noise and are considered irrelevant
    in a text. They are filtered out before or after processing a text.


    Examples of stop words include “and”, “the”, and “a”, but there is no definitive
    list as it will vary based on language and application.


    After filtering out a text for stop words, a sentence like “They are meeting at
    the station tomorrow at 10am” would end up being `[“They”, “are”, “meeting”, “station”,
    “tomorrow”, “10am”]`.


    As we can see, the sentence did not lose any meaning after removing the stop words.


    As machine learning operations can be time-consuming, removing words that do not
    change the semantic meaning of a text can improve performance without impacting
    negatively the accuracy of the predictions.


    ## 4.3 Implementing sentiment analysis in TensorFlow.js


    Now that we have covered some of the basics of natural language processing, let’s
    work on a couple of applications implementing sentiment analysis in JavaScript
    using `TensorFlow.js`.


    ### 4.3.1 Positive, negative, and neutral


    As a first project, let’s build an application that can predict the overall sentiment
    of a piece of text and classify it between three categories: positive, negative,
    and neutral.


    #### Importing the model


    The first thing you need to do, similar to the other projects in the previous
    chapter, is importing the `TensorFlow.js` library, either as a script tag or npm
    package.


    ```

    Listing 4-2

    Importing TensorFlow.js as a script tag in an HTML file

    ```


    Or


    ```

    const tf = require(''@tensorflow/tfjs'');

    Listing 4-3

    Importing TensorFlow.js as a package in a JavaScript file

    ```


    #### Loading the model


    Then, we need to load the pre-trained model and its metadata. For this, we can
    create two different functions.


    ```

    const loadMetadata = async () => {

    const url = ''https://storage.googleapis.com/tfjs-models/tfjs/sentiment_cnn_v1/metadata.json'';

    const metadata = await fetch(url);

    return metadata.json();

    };

    Listing 4-5

    Function named loadMetadata to load the machine learning metadata

    ```


    ```

    const loadModel = async () => {

    const url = `https://storage.googleapis.com/tfjs-models/tfjs/sentiment_cnn_v1/model.json`;

    const model = await tf.loadLayersModel(url);

    return model;

    };

    Listing 4-4

    Function named loadModel to load the machine learning model

    ```


    #### Predictions


    Now that we have the main tools we need to run the prediction, we also need to
    write some helper functions that will turn our input text into vectors, like we
    talked about in the previous section of this chapter.


    Input text cannot be fed to an algorithm as a string, as machine learning models
    primarily work with numbers, so let’s look into how to execute vectorization in
    JavaScript.


    To turn a string into a fixed-length vector, we need to start by breaking it down
    into an array which elements will be all the substrings.


    ```

    const text = ''Hello world'';

    const trimmed = text

    .trim()

    .toLowerCase()

    .replace(/(\.|\,|\!|\?)/g, "")

    .split(" ");

    Listing 4-6

    Code sample to vectorize a string in JavaScript

    ```


    This piece of code will turn a string like “I learned a lot from this talk” into
    `[“i”, “learned”, “a”, “lot”, “from”, “this”, “talk”]`.


    We start by calling the `trim()` function to remove potential whitespace at the
    beginning and end of the string. We then make everything lowercase, remove all
    punctuation, and split it into an array of substrings using the space character
    as separator.


    Once this is done, we need to turn this array into an array of numbers using the
    metadata we loaded just previously.


    This metadata is a JSON file with the sample data used to train the model we are
    loading into our application. It contains about 20,000 words.


    The goal of this step is to map each word in our string to an index from the file,
    with the following code.


    ```

    const loadMetadata = async () => {

    const metadata = await fetch(

    "https://storage.googleapis.com/tfjs-models/tfjs/sentiment_cnn_v1/metadata.json"

    );

    return metadata.json();

    };

    const sequence = trimmed.map(async(word) => {

    const metadata = await loadMetadata();

    const wordIndex = metadata.word_index[word];

    if (typeof wordIndex === "undefined") {

    return 2; //oov index

    }

    return wordIndex + metadata.index_from;

    });

    Listing 4-7

    Code sample to map words to their index in the metadata file

    ```


    What this code sample does is loop through the array of substrings we created
    previously and see if each element exists in the metadata. If it does, it sets
    the variable `wordIndex` to the index found in the metadata; otherwise, if the
    word from our input text was not found in the data used to train the model, it
    sets the value of `wordIndex` to 2.


    This number 2 is going to be our index for **out-of-vocabulary** (OOV) words.


    After this step, this sequence variable will look something like the following
    sample.


    ```

    [13, 12037, 6, 176, 39, 14, 740]

    Listing 4-8

    Sample output produced by the code earlier

    ```


    These numbers are the indices of each word in our metadata file. As we can see,
    the number 2 is not present, which means that each word in the sentence “I learned
    a lot from this talk” was present in the dataset used to train the model.


    Before we can use this to run predictions and get the overall sentiment, we need
    to do one last step of transforming the data.


    As explained previously, when training a machine learning model, you need to make
    sure that the data used has the same shape.


    For example, if you were working with images, you could not use images of different
    sizes (280x280 pixels, then 1200x800 pixels, etc.) in your dataset.


    The same principle applies to text data. Our example text “I learned a lot from
    this talk” has a length of 7; however, our model has been trained with vectors
    which length were 100.


    This value can be found in the `metadata.json` file as the value of the property
    `max_len`.


    What this means is that the longest piece of string in the dataset used to train
    the model contained 100 words.


    As we need to work with fixed-length vectors, we need to transform our vector
    of length 7 to a vector of length 100.


    To do this, we need to write a function that will prepend a certain amount of
    0s until the length of the vector equals 100.


    After the code sample in Listing [4-7](#496132_1_En_4_Chapter.xhtml#PC7), you
    can write the following function.'
