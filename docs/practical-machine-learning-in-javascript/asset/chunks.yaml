    Import "@tensorflow-models/mobilenet";

    Listing 3-3

    Importing the modules

    ```


    Importing these two files gives us access to the `tf` and `mobilenet` objects.


    The first step we need to take is **load the model** in the app.


    ```

    async function app(){

    const model = await model.load();

    }

    Listing 3-4

    Loading the model

    ```


    ![../images/496132_1_En_3_Chapter/496132_1_En_3_Fig2_HTML.jpg](images/496132_1_En_3_Chapter/496132_1_En_3_Fig2_HTML.jpg)


    Figure 3-2


    Console output of a model


    Models being pretty heavy files, they can take a few seconds to load and therefore
    should be loaded using `async/await`.


    If you are curious to know what this object contains, you can log it and look
    at its properties.


    Please remember that you do not have to understand every property in the object
    to be able to use it.


    One of the properties that could be interesting, however, is the *inputs* property
    in *model*.


    ![../images/496132_1_En_3_Chapter/496132_1_En_3_Fig3_HTML.jpg](images/496132_1_En_3_Chapter/496132_1_En_3_Fig3_HTML.jpg)


    Figure 3-3


    Console output of a model


    This property shows us the type of input used to train the model. In this case,
    we can see that images were used, which makes sense considering this is an object
    detection model. More importantly, we can see the shape of the data used in the
    training process.


    The shape attribute reveals the value `[-1, 224, 224, 3]`, which means that the
    images fed to the model were RGB images (the value 3 at the end of the array represents
    the number or channels) of size 224*224 pixels.


    This value is particularly interesting for the next part of this chapter, where
    we will look at doing transfer learning with the mobilenet model.


    Feel free to explore the model further.


    The next step to build this application is to allow TensorFlow.js to have access
    to the input from the webcam to be able to run predictions and detect objects.


    As our project uses the device’s webcam, we have a `<video>` element in our HTML.


    In JavaScript, we need to access this element and use one of TensorFlow’s methods
    to create an object from the data API that can capture images as tensors.


    ```

    const webcamElement = document.getElementsByTagName("video")[0];

    const webcam = await tf.data.webcam(webcamElement);

    Listing 3-5

    Instantiating a webcam object

    ```


    These two lines are still part of the setup process of our application. At the
    moment, we only loaded the model and created this `webcam` variable that will
    transform snapshots from the camera to tensors.


    Now, to implement the logic, we need to start by adding a simple button to our
    HTML. It will be used to trigger the image capture on click.


    ```

    SNAP

    Listing 3-6

    Button to capture an image

    ```


    In our JavaScript file, we need to access this element, use the onclick event
    listener, and use TensorFlow.js to capture an image, and classify it.


    ```

    const captureButton = document.getElementsByClassName("capture-image")[0];

    captureButton.onclick = async () => {

    const img = await webcam.capture();

    const predictions = await model.classify(img);

    return predictions;

    };

    Listing 3-7

    Classifying an image

    ```


    To capture an image from the video feed, TensorFlow.js has a `capture()` built-in
    method that needs to be called on the object previously created using `tf.data.webcam`.


    It allows to transform a single image directly into a tensor so it can then easily
    be used with other TensorFlow.js operations.


    After capturing an image, we generate predictions by passing it in `mobilenet.classify`.


    This will return an array of predictions.


    For example, this picture taken of a plastic bottle will return the following
    array of predictions.


    ![../images/496132_1_En_3_Chapter/496132_1_En_3_Fig5_HTML.jpg](images/496132_1_En_3_Chapter/496132_1_En_3_Fig5_HTML.jpg)


    Figure 3-5


