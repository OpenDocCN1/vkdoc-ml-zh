    would only be the one with the highest score in the predictions returned.


    However, as the system runs continuously, it would probably get confused between
    the two activities. It would probably alternate between “speaking” and “running
    water” until one of the activities stopped.


    This would definitely become a problem if you built an application that can detect
    sounds produced by activities that can be executed at the same time.


    For example, let’s imagine you usually play music while taking a shower and you
    built an application that can detect two activities: the sound of the shower running
    and speaking.


    You want to be able to trigger a counter whenever it detects that the shower is
    running so you can avoid taking long showers and save water.


    You also want to be able to lower the sound of your speakers when it detects that
    someone is speaking in the bathroom.


    As these two activities can happen at the same time (you can speak while taking
    a shower), the system could get confused between the two activities and detect
    the shower running for a second and someone speaking the next.


    As a result, it would start and stop the speakers one second, and start/stop the
    counter the next. This would definitely not create an ideal experience.


    However, this does not mean that there is no potential in building applications
    using acoustic activity recognition, it only means that we would need to work
    around this limitation.


    Besides, some research is being done around developing systems that can handle
    the detection of multiple activities at once. We will look into it in the next
    few pages.'
  trans: '

    #### 网页无障碍


    你可能尚未注意到，另一项应用已在你熟悉的某个服务中实现。事实上，如果你正在使用 YouTube，你可能遇到过**实时环境声音字幕**。


    如果你曾在 YouTube 视频上开启过字幕，你可能会知道，视频底部会叠加显示说话内容。


    然而，视频中包含的信息远不止转录文本所能呈现的内容。


    事实上，对于没有听力障碍的人来说，他们也能从视频中获取额外信息，例如背景音乐或雨声等环境声音。


    如果字幕只显示说话内容，对于有听力障碍的人来说，可能会遗漏大量信息。


    大约三年前，也就是 2017 年，YouTube 推出了实时环境声音字幕功能。该功能利用声音识别技术，将视频音轨中检测到的环境声音细节添加到字幕中。


    以下是一个示例。


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig23_HTML.jpg](img/496132_1_En_5_Fig23_HTML.jpg)


    图 5-23


    YouTube 上的实时环境声音字幕示例


    上述截图来自 Janelle Monae 和 Pharrell Williams 的一次访谈，其中字幕功能已开启。


    说话内容按预期显示，但我们也能看到诸如 [掌声] 这样的环境声音。


    现在，有听力障碍的人有机会获得比单纯对话更多的视频信息。


    目前，YouTube 视频中可检测到的环境声音包括：


    *   掌声

    *   音乐播放

    *   笑声


    这看起来可能不算多，但同样，如果我们从未考虑过一些残障人士在这些平台上的体验，我们就会认为这是理所当然的。


    此外，考虑到这项功能大约在三年前就已实现，这表明像谷歌这样的科技巨头一直在积极探索利用机器学习处理音频数据的潜力，并致力于寻找有用的应用场景。


    ### 5.1.8 局限性


    现在我们已经介绍了如何在 JavaScript 中尝试声音活动识别以及一些不同的应用，了解此类技术的一些局限性对于更好地理解其真正的机遇至关重要。


    #### 数据的质量与数量


    如果你决定从头开始构建一个类似的声音活动识别系统，并且在不使用迁移学习和 TensorFlow.js 的语音指令模型的情况下编写自己的模型，那么你将需要收集比使用
    Teachable Machine 时所需的最少 8 个样本多得多的声音样本。


    要收集大量样本，你可以选择自己录制，或者从专业音频库购买。


    另一个要点是务必检查所录制数据的质量。例如，如果你想检测吸尘器运行的声音，请确保没有背景噪音，并且吸尘器的声音在音轨中清晰可辨。


    从单个样本生成多个数据样本的一个技巧是，使用音频编辑软件更改单个音频源的某些参数，以创建其多个版本。例如，你可以修改混响、音高等。


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig24_HTML.jpg](img/496132_1_En_5_Fig24_HTML.jpg)


    图 5-24


    声音转换。Gierad Laput, Karan Ahuja, Mayank Goel, and Chris Harrison. 2018. Ubicoustics:
    Plug-and-Play Acoustic Activity Recognition. In The 31st Annual ACM Symposium
    on User Interface Software and Technology (UIST ''18). ACM, New York, NY, USA,
    213-224. DOI: [`https://doi.org/10.1145/3242587.3242609`](https://doi.org/10.1145/3242587.3242609)


    #### 单一活动


    目前，这项技术似乎能有效识别单一声音。


    例如，如果你训练模型识别某人说话的声音以及流水的声音，并且你将系统放置在厨房中，用户一边说话一边洗碗，那么系统预测的活动将只是返回结果中得分最高的那个。


    然而，由于系统持续运行，它可能会在这两种活动之间感到困惑。它可能会在“说话”和“流水”之间交替，直到其中一种活动停止。


    如果你构建的应用需要检测可能同时发生的活动所产生的声音，这无疑会成为一个问题。


    例如，假设你通常一边淋浴一边播放音乐，并且你构建了一个能检测两种活动的应用：淋浴流水声和说话声。


    你希望每当检测到淋浴流水声时就能触发一个计时器，这样你就可以避免长时间淋浴以节约用水。


    你还希望当检测到有人在浴室说话时，能降低扬声器的音量。


    由于这两种活动可能同时发生（你可以在淋浴时说话），系统可能会在这两种活动之间感到困惑，前一秒检测到淋浴流水声，下一秒又检测到有人在说话。


    结果就是，扬声器会启动一秒又停止一秒，计时器也会启动一秒又停止一秒。这肯定不会带来理想的体验。


    然而，这并不意味着利用声音活动识别构建应用没有潜力，只是意味着我们需要设法克服这一局限性。


    此外，目前正在进行一些研究，旨在开发能够同时处理多种活动检测的系统。我们将在接下来的几页中探讨这一点。

    '
- fmt: '#### User experience


    When it comes to user experience, there are always some challenges with new technologies
    like this one.


    First of all, **privacy**. Having devices listening to users always raises some
    concerns about where the data is stored, how it is used, is it secure, and so
    on. Considering that some companies releasing Internet of Things devices do not
    always put security first in their products, these concerns are very normal. As
    a result, the adoption of these devices by consumers can be slower than expected.
    Not only privacy and security should be baked in these systems, it should also
    be communicated to users in a clear way to reassure them and give them a sense
    of empowerment over their data.


    Secondly, another challenge is in teaching users **new interactions**. For example,
    even though most modern phones now have voice assistants built-in, getting information
    from asking Siri or Google is not the primary interaction. This could be for various
    reasons including privacy and limitations of the technology itself, but people
    also have habits that are difficult to change. Besides, considering the current
    imperfect state of this technology, it is easy for users to give up after a few
    trials, when they do not get the response they were looking for. A way to mitigate
    this would be to release small applications to analyze users’ reactions to them
    and adapt. The work Apple did by implementing the water detection in their new
    watchOS is an example of that.


    Finally, one of the big challenges of creating a custom acoustic activity recognition
    system is in the **collection of sample data and training by the users**. Even
    though you can build and release an application that detects the sound of a faucet
    running because there’s a high probability that it produces a similar sound in
    most homes, some other sounds are not so common. As a result, empowering users
    to use this technology would involve letting them record their own samples and
    train the model so they can have the opportunity to have a customized application.
    However, as machine learning algorithms need to be trained with a large amount
    of data to have a chance to produce accurate predictions, it would require a lot
    of effort from users and would inevitably not be successful. Luckily, some researchers
    are experimenting with solutions to these problems.


    Now, even though there are some limits to this technology, solutions also start
    to appear. For example, in terms of protecting users’ privacy, an open source
    project called Project Alias by Bjørn Karmann attempts to empower voice assistant
    users. This project is a DIY add-on made with a Raspberry Pi microcontroller,
    a speaker, and microphone module, all in a 3D printed enclosure that aims at blocking
    voice assistants like Amazon Alexa and Google Home from continuously listening
    to people. Through a mobile application, users can train Alias to react on a custom
    wake word or sound. Once it is trained, Alias can take control over the home assistant
    and activate it for you. When you don’t use it, the add-on will prevent the assistant
    from listening by emitting white noise into their microphone. Alias’s neural network
    being run locally, the privacy of the user is protected.


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig26_HTML.jpg](images/496132_1_En_5_Chapter/496132_1_En_5_Fig26_HTML.jpg)


    Figure 5-26


    Project Alias components. Source: [*https://bjoernkarmann.dk/project_alias*](https://bjoernkarmann.dk/project_alias)


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig25_HTML.jpg](images/496132_1_En_5_Chapter/496132_1_En_5_Fig25_HTML.jpg)


    Figure 5-25


    Project Alias. Source: [`https://bjoernkarmann.dk/project_alias`](https://bjoernkarmann.dk/project_alias)


    Another project, called Synthetic Sensors, aims at creating a system that can
    accurately predict multiple sounds at once. Developed by a team of researchers
    at the Carnegie Mellon University, this project involves a custom-built piece
    of hardware made of multiple sensors, including an accelerometer, microphone,
    temperature sensor, motion sensor, and color sensor. Using the raw data collected
    from these sensors, researchers created multiple stacked spectrograms and trained
    algorithms to detect patterns produced by multiple activities such as:


    *   Microwave door closed

    *   Wood saw running

    *   Kettle on

    *   Faucet running

    *   Toilet flushing


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig28_HTML.jpg](images/496132_1_En_5_Chapter/496132_1_En_5_Fig28_HTML.jpg)


    Figure 5-28


    Project Synthetic Sensors example of spectrograms and activities recognition.
    Gierad Laput, Yang Zhang, and Chris Harrison. 2017. Synthetic Sensors: Towards
    General-Purpose Sensing. In Proceedings of the 2017 CHI Conference on Human Factors
    in Computing Systems (CHI ''17). ACM, New York, NY, USA, 3986-3999. DOI: [`https://doi.org/10.1145/3025453.3025773`](https://doi.org/10.1145/3025453.3025773)


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig27_HTML.jpg](images/496132_1_En_5_Chapter/496132_1_En_5_Fig27_HTML.jpg)


    Figure 5-27


    Project Synthetic Sensors hardware. Gierad Laput, Yang Zhang, and Chris Harrison.
    2017. Synthetic Sensors: Towards General-Purpose Sensing. In Proceedings of the
    2017 CHI Conference on Human Factors in Computing Systems (CHI ''17). ACM, New
    York, NY, USA, 3986-3999. DOI: [`https://doi.org/10.1145/3025453.3025773`](https://doi.org/10.1145/3025453.3025773).


    Finally, in terms of user experience, a research project called Listen Learner
    aims at allowing users to collect data and train a model to recognize custom sounds,
    with minimal effort. The full name of the project is Listen Learner, Automatic
    Class Discovery and One-Shot Interaction for Activity Recognition. It aims at
    providing high classification accuracy, while minimizing user burden, by continuously
    listening to sounds in its environment, classifying them by cluster of similar
    sounds, and asking the user what the sound is after having collected enough similar
    samples. The result of the study shows that this system can accurately and automatically
    learn acoustic events (e.g., 97% precision, 87% recall), while adhering to users’
    preferences for nonintrusive interactive behavior.


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig29_HTML.jpg](images/496132_1_En_5_Chapter/496132_1_En_5_Fig29_HTML.jpg)


    Figure 5-29


    Wu, J., Harrison, C., Bigham, J. and Laput, G. 2020. Automated Class Discovery
    and One-Shot Interactions for Acoustic Activity Recognition. In Proceedings of
    the 38th Annual SIGCHI Conference on Human Factors in Computing Systems. CHI ''20.
    ACM, New York, NY. Source: [`www.chrisharrison.net/index.php/Research/ListenLearner`](https://www.chrisharrison.net/index.php/Research/ListenLearner)


    ## Body and movement tracking


    After looking at how to use machine learning with audio data, let’s look into
    another type of input, that is, body tracking. In this section, we are going to
    use data from body movements via the webcam using three different `Tensorflow.js`
    models.'
