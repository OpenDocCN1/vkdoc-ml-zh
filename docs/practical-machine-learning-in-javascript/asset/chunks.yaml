    # 4. Text classification and sentiment analysis


    In the previous chapter, we focused on using image data to learn more about machine
    learning and build an image classifier. In this chapter, we are going to talk
    about using text data, cover a few concepts of natural language processing, and
    build a few experiments around sentiment analysis.


    ## 4.1 What is sentiment analysis?


    Sentiment analysis, also sometimes referred to as sentiment classification, opinion
    mining, or emotion AI, is the process of interpreting and categorizing emotions
    expressed in a piece of text to determine the overall sentiment of the person
    writing it – either positive, negative, or neutral.


    It uses natural language processing to identify, extract, and study affective
    states and subjective information.


    Natural language processing, or NLP, is a branch of artificial intelligence which
    objective is to program computers to process, analyze, and make sense of natural
    language data.


    Giving computers the ability to understand the nuances of human language is a
    complicated task. It is not only about identifying and extracting keywords in
    a sentence, but about analyzing and interpreting the meaning behind those words,
    for example, being able to recognize figures of speech, detect irony, and so on.


    In this chapter, we will mainly focus on classifying pieces of text data into
    three categories: positive, negative, and neutral, as well as looking into toxicity
    detection.


    Before diving into how to implement sentiment analysis in JavaScript with TensorFlow.js,
    let’s try to understand more about the mechanics of this technique.


    ## 4.2 How does natural language processing work?


    The way we express ourselves carries a lot of contextual information. From our
    selection of words to our tone, the extent of our vocabulary, and the way we construct
    our sentences, human language is extremely complex but also rich enough to reveal
    a lot about us.


    To allow computers to develop an understanding of language and its intricacies,
    natural language processing uses a few different techniques and algorithms. Let’s
    start by defining some concepts.


    ### 4.2.1 Common concepts – Basics of NLP


    Before diving into how to implement some natural language processing in JavaScript,
    let’s cover some basic concepts.'
