- fmt: '### 6.1.1 Scalability


    The purpose of putting machine learning models in production is to make it part
    of the application your users are interacting with every day. As a result, it
    should be able to handle a potential large amount of requests.


    Either it be for a startup or a large corporation, running machine learning models
    requires a lot of CPUs, GPUs, and RAM, meaning you will have to make sure your
    system can support running the model for all users.


    ### 6.1.2 High availability


    Most web applications you have worked on and will work on are expected to be available
    24/7 to serve user requests.


    If you decide to add machine learning models to these systems, they will also
    need to have a high availability.


    No matter if you decide to update a model, scale it to a wider audience, or test
    new tools, it is very important to make sure the model is still running properly
    as you experiment.


    ### 6.1.3 Observability


    The systems we work on are very volatile. Things can change very fast in many
    ways. Your user interface changes as you release new features, spikes of users
    can happen in different geographical locations, third-party providers can fail,
    and so on.


    Such volatility means that models and their predictions should be watched closely.
    Not only is it about verifying that the model is not failing to generate predictions,
    it is also about regularly checking if the inputs and outputs are correct.


    ### 6.1.4 Reusability


    Depending on the models you have built and are running in your application, it
    is sometimes important to think about their reusability.


    For example, the company booking.com runs multiple models in production including
    one to determine if a hotel is family-friendly.


    Based on different criteria, a model can highlight family-friendly hotels in both
    the details page of a hotel or as a filter in the results page. Similarly to how
    different UI components can be reusable across a front-end application, building
    your models so they can be reused on different pages can ensure that you are making
    the most of them.


    Creating and testing a machine learning model being a time-consuming task, model
    reutilization makes this investment more productive.


    Moreover, reusability ensures that models can be shared between different teams
    facing similar problems and can avoid wasting time re-creating models from scratch.


    Now that we’ve briefly covered a few of the challenges presented by productionizing
    machine learning models, let’s look into the life cycle of a ML project.


    ## 6.2 Machine learning life cycle


    The following diagram is a visual guide for the concept of Continuous Delivery
    for Machine Learning (CD4ML) popularized by Martin Fowler.


    In this diagram, we can see outlined six different phases:


    **Model building** is about understanding the problem, preparing the data, extracting
    features, and writing the initial code to create the model.


    **Model evaluation and experimentation** is about selecting features, hyperparameter
    tuning, comparing algorithms, and overall experimenting with different solutions.


    **Productionizing the model** is the step that goes from experimentation or research
    to preparing it for deployment.


    **Testing** focuses on ensuring that the model and the code we are about to deploy
    to production behave as we expect, and that the results match the ones observed
    during the second phase of evaluation and experimentation.


    **Deployment** is getting the model into production.


    Finally, **monitoring and observability** is about ensuring that the model behaves
    as expected in the production environment.


    One of the main differences between a standard software project life cycle and
    a machine learning project is in the way these phases should repeat.


    As the arrow suggests from the last phase (Monitoring and Observability) back
    to the first one (Model Building), we should make decisions about our models based
    on information collected after seeing how it behaves in production.


    **Models should be updated or abandoned based on this information.**


    Based on your application, your model needs to be regularly retrained with new
    data to avoid becoming obsolete.


    For example, a platform like AutoScout24 that helps users sell their vehicles
    online uses machine learning to predict the price range at which people should
    sell their car, based on a few parameters including the brand, the year of production,
    and the model.


    If they do not retrain their model regularly with real user data, their prediction
    will quickly be out of date and not represent the real value of their users’ vehicle
    on the market. As a result, people could either undersell or struggle to sell
    their car because the prices are not adjusted to the current market.


    This cycle that retrains the model with new data can be done manually or automatically.


    Also, not all of these phases have to be executed by the same engineers.


    The first two phases of model building and experimentation can and/or should be
    done by data scientists or machine learning engineers. The following phases should
    be undertaken by DevOps engineers or software engineers with experience in deploying
    applications to production, like the following image illustrates.


    Seeing how different parts of this life cycle are separated by types of engineer
    leads us to talk about machine learning systems'
  raw: '### 6.1.1 Scalability


    The purpose of putting machine learning models in production is to make it part
    of the application your users are interacting with every day. As a result, it
    should be able to handle a potential large amount of requests.


    Either it be for a startup or a large corporation, running machine learning models
    requires a lot of CPUs, GPUs, and RAM, meaning you will have to make sure your
    system can support running the model for all users.


    ### 6.1.2 High availability


    Most web applications you have worked on and will work on are expected to be available
    24/7 to serve user requests.


    If you decide to add machine learning models to these systems, they will also
    need to have a high availability.


    No matter if you decide to update a model, scale it to a wider audience, or test
    new tools, it is very important to make sure the model is still running properly
    as you experiment.


    ### 6.1.3 Observability


    The systems we work on are very volatile. Things can change very fast in many
    ways. Your user interface changes as you release new features, spikes of users
    can happen in different geographical locations, third-party providers can fail,
    and so on.


    Such volatility means that models and their predictions should be watched closely.
    Not only is it about verifying that the model is not failing to generate predictions,
    it is also about regularly checking if the inputs and outputs are correct.


    ### 6.1.4 Reusability


    Depending on the models you have built and are running in your application, it
    is sometimes important to think about their reusability.


    For example, the company booking.com runs multiple models in production including
    one to determine if a hotel is family-friendly.


    Based on different criteria, a model can highlight family-friendly hotels in both
    the details page of a hotel or as a filter in the results page. Similarly to how
    different UI components can be reusable across a front-end application, building
    your models so they can be reused on different pages can ensure that you are making
    the most of them.


    Creating and testing a machine learning model being a time-consuming task, model
    reutilization makes this investment more productive.


    Moreover, reusability ensures that models can be shared between different teams
    facing similar problems and can avoid wasting time re-creating models from scratch.


    Now that we’ve briefly covered a few of the challenges presented by productionizing
    machine learning models, let’s look into the life cycle of a ML project.


    ## 6.2 Machine learning life cycle


    The following diagram is a visual guide for the concept of Continuous Delivery
    for Machine Learning (CD4ML) popularized by Martin Fowler.


    In this diagram, we can see outlined six different phases:


    **Model building** is about understanding the problem, preparing the data, extracting
    features, and writing the initial code to create the model.


    **Model evaluation and experimentation** is about selecting features, hyperparameter
    tuning, comparing algorithms, and overall experimenting with different solutions.


    **Productionizing the model** is the step that goes from experimentation or research
    to preparing it for deployment.


    **Testing** focuses on ensuring that the model and the code we are about to deploy
    to production behave as we expect, and that the results match the ones observed
    during the second phase of evaluation and experimentation.


    **Deployment** is getting the model into production.


    Finally, m**onitoring and observability** is about ensuring that the model behaves
    as expected in the production environment.


    One of the main differences between a standard software project life cycle and
    a machine learning project is in the way these phases should repeat.


    As the arrow suggests from the last phase (Monitoring and Observability) back
    to the first one (Model Building), we should make decisions about our models based
    on information collected after seeing how it behaves in production.


    **Models should be updated or abandoned based on this information.**


    Based on your application, your model needs to be regularly retrained with new
    data to avoid becoming obsolete.


    For example, a platform like AutoScout24 that helps users sell their vehicles
    online uses machine learning to predict the price range at which people should
    sell their car, based on a few parameters including the brand, the year of production,
    and the model.


    If they do not retrain their model regularly with real user data, their prediction
    will quickly be out of date and not represent the real value of their users’ vehicle
    on the market. As a result, people could either undersell or struggle to sell
    their car because the prices are not adjusted to the current market.


    This cycle that retrains the model with new data can be done manually or automatically.


    Also, not all of these phases have to be executed by the same engineers.


    The first two phases of model building and experimentation can and/or should be
    done by data scientists or machine learning engineers. The following phases should
    be undertaken by DevOps engineers or software engineers with experience in deploying
    applications to production, like the following image illustrates.


    Seeing how different parts of this life cycle are separated by types of engineer
    leads us to talk about machine learning systems'
  trans: '

    ### 6.1.1 可扩展性


    将机器学习模型投入生产的目的，是使其成为用户日常交互的应用程序的一部分。因此，它必须能够处理潜在的大量请求。


    无论是初创公司还是大型企业，运行机器学习模型都需要大量的 CPU、GPU 和内存，这意味着你必须确保系统能够支持为所有用户运行模型。


    ### 6.1.2 高可用性


    你曾经参与过以及将要参与的大多数 Web 应用程序，都期望能够 7x24 小时可用，以响应用户请求。


    如果你决定在这些系统中加入机器学习模型，那么这些模型也需要具备高可用性。


    无论你是决定更新模型、将其扩展到更广泛的用户群体，还是测试新工具，在实验过程中确保模型仍能正常运行都至关重要。


    ### 6.1.3 可观测性


    我们工作的系统非常不稳定。很多事情都可能以多种方式快速变化。用户界面会随着新功能的发布而改变，不同地理位置可能出现用户访问高峰，第三方服务商可能发生故障，等等。


    这种不稳定性意味着需要密切监控模型及其预测结果。这不仅是要验证模型能否成功生成预测，还需要定期检查输入和输出是否正确。


    ### 6.1.4 可复用性


    根据你在应用程序中构建和运行的模型，有时考虑其可复用性非常重要。


    例如，Booking.com 公司在生产环境中运行着多个模型，其中包括一个用于判断酒店是否适合家庭入住的模型。


    基于不同的标准，该模型既可以在酒店详情页中突出显示适合家庭入住的酒店，也可以在搜索结果页面中作为筛选条件。就像前端应用程序中不同的 UI 组件可以复用一样，构建模型使其能够在不同页面上复用，可以确保你最大限度地利用它们。


    创建和测试机器学习模型是一项耗时的任务，模型复用可以使这项投入更具成效。


    此外，可复用性确保了模型可以在面临类似问题的不同团队之间共享，从而避免浪费时间从头开始重新创建模型。


    现在，我们简要介绍了将机器学习模型产品化所面临的一些挑战，接下来让我们看看机器学习项目的生命周期。


    ## 6.2 机器学习生命周期


    下图是 Martin Fowler 推广的“机器学习持续交付”（CD4ML）概念的直观指南。


    在此图中，我们可以看出六个不同的阶段：


    **模型构建** 涉及理解问题、准备数据、提取特征以及编写创建模型的初始代码。


    **模型评估与实验** 涉及特征选择、超参数调优、算法比较以及针对不同解决方案进行整体实验。


    **模型产品化** 是从实验或研究阶段过渡到为部署做准备的一步。


    **测试** 侧重于确保我们即将部署到生产环境的模型和代码按预期运行，并且其结果与第二阶段（评估与实验）中观察到的结果一致。


    **部署** 是将模型投入生产环境。


    最后，**监控与可观测性** 旨在确保模型在生产环境中按预期运行。


    标准软件项目生命周期与机器学习项目的主要区别之一，在于这些阶段重复的方式。


    正如从最后一个阶段（监控与可观测性）指回第一个阶段（模型构建）的箭头所示，我们应该根据模型在生产环境中的表现所收集到的信息，来做出关于模型的决策。


    **模型应根据这些信息进行更新或弃用。**


    根据你的应用程序，模型需要定期用新数据进行重新训练，以避免过时。


    例如，像 AutoScout24 这样帮助用户在线出售车辆的平台，会使用机器学习根据品牌、生产年份和型号等参数，预测人们出售汽车的价格范围。


    如果他们不定期用真实用户数据重新训练模型，其预测很快就会过时，无法代表用户车辆在市场上的真实价值。结果，人们可能会因为价格未根据当前市场调整而低价出售车辆，或者难以售出。


    这种用新数据重新训练模型的循环可以手动或自动完成。


    此外，并非所有这些阶段都必须由同一位工程师执行。


    模型构建和实验的前两个阶段可以（并且/或者应该）由数据科学家或机器学习工程师完成。后续阶段应由 DevOps 工程师或具有将应用程序部署到生产环境经验的软件工程师负责，如下图所示。


    看到生命周期中不同部分由不同类型的工程师负责，这引出了我们接下来要讨论的机器学习系统。

    '
- fmt: '## 6.3 Machine learning systems


    In this book, we have talked a lot about how to use pre-trained models and generate
    predictions; however, machine learning systems are made up of a lot more components.


    For example, if you cannot find a pre-trained models for your application and
    decide to create your own, you will also need to think about data collection,
    verification, feature extraction, and monitoring, as the following figure shows.


    Using a machine learning model in production requires you to set up a certain
    pipeline. Not only your model needs to be served, but you will need to think about
    how to collect new data and retrain your model so it does not become obsolete,
    how and what to monitor, and so on.


    Luckily, you do not need to build all of these components yourself. Platforms
    like TensorFlow Extended (`TFX`) offer an end-to-end solution for deploying production
    ML pipelines. `TFX` includes different components that can help you set up a machine
    learning pipeline like `TensorFlow Data Validation` to help you understand your
    data, `TensorFlow Transform` to help you preprocess your data and convert it between
    formats as needed, and `TensorFlow Serving` to support model versioning and ensuring
    high performance with concurrent models.


    The benefit of using such platforms is that most of your ML pipeline can be set
    up in a single platform, reducing complexity in the setup and maintenance, as
    well as being able to leverage the work of dedicated teams at Google, to give
    you more confidence in the performance and reliability of your system.


    The following is an example of a typical `TFX` pipeline.


    To get a better understanding of what `TFX` can do, let’s go through each of these
    components:


    *   First, `ExampleGen` is the initial input component that consumes external
    files and ingests the data into the pipeline.

    *   `StatisticsGen` is in charge of calculating statistics for the dataset that
    will be used to generate a schema.

    *   `SchemaGen` generates the schema that contains information about your input
    data, for example, data types for each feature or if the feature has to be present
    every time. An example of what a schema could look like is shown in the following
    image.

    *   `ExampleValidator` is used to identify anomalies in the training data.

    *   `Transform` will actually use the schema generated from the `SchemaGen` component
    and perform feature engineering on the data emitted from `ExampleGen` to generate
    a `SavedModel` instance that will be used by the following component.

    *   `Trainer` uses the Python TensorFlow API to train models.

    *   `Tuner` does hyperparameter tuning, meaning it chooses a set of optimal parameters
    to use with a model.

    *   `Evaluator` performs analysis on the results of your model to ensure that
    it is good to be pushed to production.

    *   `InfraValidator` is responsible for validating the model in the model serving
    infrastructure. It launches a sand-boxed model server with the model and checks
    if it can be loaded and queried.

    *   `Pusher` is the component pushing a validated model to a deployment target.


    If this seems a bit complicated, it is totally normal. As I mentioned at the beginning
    of this chapter, I would not expect any person reading this book to understand
    straight away all the components needed in a machine learning pipeline. As it
    is unlikely that you will have to set one up yourself, this information is mainly
    presented so you get an idea of the components involved in setting up a system
    when working with deploying a custom model.


    Now that we briefly went over what a standard `TFX` pipeline looks like, let’s
    go back and talk about pipelines more broadly. What are the necessities of building
    a pipeline?


    If we look back at the image at the beginning of this section, the machine learning
    code to create the model actually represents a very small portion of the system.
    The rest is composed of elements such as data collection, automation, testing,
    analysis, and so on, where you need to apply DevOps principles to ML systems.


    This kind of system works similarly to a software system in the sense that you
    need it to be reliable and have short development cycles but differs in the following
    ways:


    **Diversity of skills**: If you work on a production application that uses machine
    learning models, your team will likely involve data scientists that will need
    to interact with the system but may not have experience or knowledge of software
    practices. Your system will have to take this into account by having components
    ML researchers can use.


    **Model serving**: There seems to be three different ways to serve models in production.
    It can either be done with an **embedded model** where you treat it as a dependency
    packaged with the application, a **model as a service (MAAS)** where the model
    is wrapped in a separate service that can be deployed and updated independently,
    and a **model as data** where the model is also independent but ingested as data
    at runtime.


    **Experiment tracking**: Machine learning models go through a lot of experimentation
    before being pushed to production, resulting in a lot of the code being thrown
    away and never being deployed. As a result, it is important to keep track of the
    different experiments being undertaken to avoid repeating them.


    **Monitoring**: Even though monitoring and logging systems are usually also used
    in standard software projects, monitoring machine learning models is a bit different.
    Not only do we need to monitor that the model generates predictions when given
    input data, we also need to capture data about how our model is behaving using
    the following metrics – **model inputs** (track what data is being fed to the
    model), **interpretability of outputs** (understanding how models are making predictions),
    model outputs themselves, and **model fairness** (analysis outputs for bias).


    **Testing**: Different types of tests can be introduced in a machine learning
    workflow. We can test the model quality by looking at error rates and accuracy,
    the validity of the data by comparing it to schemas generated, or even attempt
    to test model bias and fairness. The following is an example of test pyramid for
    machine learning systems.


    Even though this kind of system might be the responsibility of an infrastructure
    team, as a developer, you should still be involved in setting up a way for the
    application to interact with the model. As a result, you will have to ask yourself
    questions such as the following:


    *   How to write an API that will generate predictions from the model?

    *   How to best deploy that API to production?

    *   What kind of data needs to be collected?

    *   What information should the API return?


    Now that we briefly covered the different components of a machine learning system,
    let’s go through some of the tools currently available to make the use of machine
    learning in production easier.


    ## 6.4 Tools


    In this last section, we are going to quickly cover some tools you can use if
    you want to add machine learning in a production application without having to
    set up a complex system.'
