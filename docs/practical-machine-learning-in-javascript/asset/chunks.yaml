- fmt: '### Step 1: Loading page


    ![../images/496132_1_En_4_Chapter/496132_1_En_4_Fig14_HTML.jpg](images/496132_1_En_4_Chapter/496132_1_En_4_Fig14_HTML.jpg)


    **Figure 4-14** Home page of the project


    Loading a pre-trained machine learning model into your application will always
    have an impact on performance as they tend to be quite heavy. As a result, it
    is important to think in advance about what kind of user experience you want to
    create to improve the perceived performance.


    This could include loading the model in the background early on, so by the time
    the user gets to the experience, it is loaded and ready to be used; or providing
    a loading animation to indicate that the user needs to wait for the interface
    to be usable.


    The latter is not the best option as the user clearly is forced to wait before
    being able to interact with the experience; however, in the case of this project,
    this is the method we are going to use, as the only feature of the application
    is the interaction with the model.


    To display this loading state, we have a button element in our HTML file that
    has a default state of disabled, to prevent the user from trying to run predictions
    before the model is available.


    ```

    Hidden figures


    Using machine learning, learn about 3 NASA engineers by asking questions about
    their lives!


    Loading...


    Listing 4-26

    HTML code sample to show some intro text and a button with initial loading state

    ```


    Then, in the JavaScript file, we can start loading the model as soon as the page
    loads and change the state of the button once the model is ready.


    ```

    let model;

    const loadModel = async () => await qna.load();

    const init = async () => {

    model = await loadModel();

    const startButton = document.querySelector(".intro button");

    startButton.removeAttribute("disabled");

    startButton.innerHTML = "Start";

    };

    init();

    Listing 4-27

    JavaScript code sample to load the model and update the state of the button when
    the model is loaded

    ```


    The preceding code sample shows that, as soon as the `loadModel` function has
    finished loading the model, we remove the disabled state of the button to make
    it interactive and change its content to “Start” to indicate that the user can
    start the experience.


    At this stage, once the user clicks the start button, we hide this content to
    show the three options available.


    ### Step 2: Selection page


    ![../images/496132_1_En_4_Chapter/496132_1_En_4_Fig15_HTML.jpg](images/496132_1_En_4_Chapter/496132_1_En_4_Fig15_HTML.jpg)


    **Figure 4-15** Page to select the engineer to learn more about


    For the purpose of this small demo, I hard-coded the name of the three engineers
    in the button elements in the HTML file; however, if you were building something
    with more entries, or if they were dynamically generated, you could also replace
    the content of the buttons dynamically in JavaScript.


    ```

    Who would you like to learn about?


    Katherine Johnson

    Dorothy Vaughan

    Mary Jackson


    Listing 4-28

    HTML code sample with buttons containing the name of the three NASA engineers

    ```


    In our JavaScript file, we need to add an event listener for clicks on these buttons
    and fetch the JSON data.


    To avoid loading all content at once, I created a JSON file for each person, so
    that the code is going to fetch only the data the user has asked for.


    As a result, I have three JSON files that I named:


    *   `dorothyVaughan.json`

    *   `katherineJohnsons.json`

    *   `maryJackson.json`


    This way, when the user clicks one of the three buttons, the following code will
    execute the fetching and prepare for the following prediction page.


    ```

    const engineers = {

    "Katherine Johnson": "katherineJohnson",

    "Dorothy Vaughan": "dorothyVaughan",

    "Mary Jackson": "maryJackson",

    };

    figureButtons.forEach(button => {

    button.onclick = e => {

    const dataFile = engineers[e.target.textContent];

    fetch(`${window.location.href}${dataFile}.json`)

    .then(response => response.json())

    .then(data => {

    figureData = data;

    const label = document.getElementsByTagName("label")[0];

    label.innerHTML = `What would you like to know about ${e.target.textContent}?`;

    });

    };

    });

    Listing 4-29

    JavaScript code to fetch data when clicking one of the buttons

    ```


    In the preceding code sample, I started by creating an object to map the names
    displayed in the UI to the names of the associated JSON file.


    Then, for each of the three buttons, I listen for click events, look at the content
    of the button clicked to get the name of the JSON file, and use the `fetch` function
    to get the data and store it in a `figureData` variable.


    I also use the name of the person the user has chosen, to display it in the title
    “What would you like to know about…”.


    There is a bit more code related to showing and hiding HTML elements as we go
    through the pages, but I will share the complete code for this project at the
    end of this chapter.


    Now that we know which person the user is interested in knowing more about, and
    we’ve fetched the related data, let’s move on to the prediction page.'
