    \ 函数。\n\n我们将按钮索引传递给该函数，因此，例如当我们点击“上”按钮时，类别 ID 将为 0。\n\n这样，每当我们点击四个按钮中的一个，就会向分类器添加一个示例，并附带相应的类别\
