    ## 3.2 迁移学习


    使用预训练模型非常有用，可以让你非常快速地构建项目，但如果你发现自己需要更定制化的内容，很快就会达到其局限性。


    在本小节中，我们将利用前几页编写的部分代码，并对其进行调整，以使用自定义输入数据。


    我们将从网络摄像头收集自定义数据样本，以构建一个能够识别我们头部运动的模型。这可以用作界面的潜在控制方式，因此你可以想象使用该模型通过上下倾斜头部来滚动网页，或者使用相同的动作来导航地图。


    这个项目将专注于训练模型识别新样本并测试其预测。


    你在接下来几页中阅读的代码将生成一个界面，其中包含用于收集新数据的按钮，以及一个用于运行预测的额外按钮。结果将显示在页面上，供你验证模型的准确性。


