    ## 3.2 Transfer learning


    Using a pre-trained model is really useful, allowing you to build projects very
    fast, but you can quickly reach its limits if you find yourself needing something
    more customized.


    In this subchapter, we are going to leverage some parts of the code we wrote in
    the last few pages, and adapt them to use custom input data.


    We’re going to collect custom data samples from our webcam to build a model that
    can recognize our head movements. This can then be used as potential controls
    for interfaces, so you could imagine using this model to scroll a web page by
    tilting your head up and down or using the same movements to navigate a map.


    This project is going to focus on training the model to recognize new samples
    and testing its predictions.


    The code you’ll read in the next few pages will produce an interface with buttons
    to collect new data and an additional button to run the predictions. The result
    will be shown on the page for you to verify the accuracy of your model.


