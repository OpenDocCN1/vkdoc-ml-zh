  trans: "\n### 6.4.1 预训练模型\n\n希望你在完成本书中的项目后，已经熟悉了如何在 TensorFlow.js 中使用预训练模型。\n\n\
    到目前为止，我们使用了 MobileNet 图像分类模型、PoseNet、毒性分类器、语音命令、Facemesh、Handpose 以及问答模型；不过，还有更多模型可供探索。\n\
    \n事实上，如果你决定进一步探索，你会发现还存在面部地标检测模型、目标检测模型、人体分割模型等。\n\n然而，预训练模型并不一定需要由 TensorFlow.js\
    \ 团队开发才能用于 TensorFlow.js。\n\n通常使用 Python 创建的 Keras 模型可以保存为不同格式，并转换为 TensorFlow.js\
    \ 的 Layers 格式，以便通过该框架加载。\n\n因此，如果你找到一个感兴趣的开源模型，可以随时检查它是否能转换为与 TensorFlow.js 兼容的格式，以便在\
    \ JavaScript 应用程序中加载。\n\n### 6.4.2 API\n\n为了让开发者更容易在生产应用中实现机器学习，像亚马逊、谷歌和微软这样的科技公司一直在开发以\
    \ API 形式提供的机器学习服务。\n\n例如，亚马逊目前拥有多个 API，用于图像和视频分析、个性化推荐、实时翻译、高级文本分析、聊天机器人和欺诈预防等服务。\n\
    \n例如，亚马逊目前提供的 API 包括：\n\n*   **Comprehend**：用于高级文本分析\n*   **CodeGuru**：用于自动化代码审查\n\
    *   **Lex**：用于聊天机器人\n*   **Textract**：用于文档分析\n*   **Detector**：用于欺诈预防\n*   **Recognition**：用于图像和视频分析\n\
    *   **Polly**：用于文本转语音\n\n谷歌云提供的 API 包括：\n\n*   **Vision AI**：用于获取图像洞察、检测目标、人脸和文本\n\
    *   **Video Intelligence API**：用于识别存储和流式视频中的目标、地点和动作\n*   **Speech-to-Text API**：用于将语音准确转换为文本\n\
    \n微软则拥有一套名为认知服务的工具，其 API 包括内容审核服务、QnA Maker、说话人识别服务（可根据音频识别和验证说话人身份），以及围绕图像和文本识别的类似\
    \ API。\n\n### 6.4.3 服务平台\n\n最后，如果你更倾向于构建和提供自定义模型，这里有一些旨在简化此过程的工具。\n\n谷歌云 AI 平台、亚马逊云服务以及微软都提供了更完整的解决方案，用于部署你的自定义机器学习项目；不过，还有其他模型服务平台可供选择，例如开源项目\
    \ BentoML、Seldon 或 KI labs 的 kaos。\n\n尽管团队可能倾向于依赖谷歌、微软或亚马逊的工具，但这些平台通常无法提供你在选择工具时所需的自由度。它们会优化自身产品的使用，有时还会使与其他第三方工具的集成变得复杂。\n\
    \n此外，根据你的应用规模，使用这些平台可能会造成过度设计。\n\n总的来说，在将机器学习模型投入生产时，有多种选择。然而，由于大多数公司尚未涉足这一领域，相关标准尚未确立，并且很可能会不断演变。因此，如果你对这个领域感兴趣并想了解更多，绝对应该进行一些额外的研究和实验。\n\
    \n# 7. 机器学习中的偏见\n\n在我看来，如果不提及机器学习中的偏见这个话题，这本书就不算完整。\n\n当我们赋予计算机生成预测的能力，并依赖这些预测来构建人们会与之交互的生产应用时，花时间思考使用这项技术的后果和影响至关重要。\n\
    \n在最后一章中，我们将讨论不同类型的偏见、为什么这是一个问题，以及如何在我们的机器学习系统中将其最小化。\n\n## 7.1 什么是偏见？\n\n如果我们参考牛津词典的定义，偏见是：\n\
    \n> *一种强烈支持或反对某一群体或某一方的感觉，通常并非基于公正的判断。*\n> \n> ——引用来源：[`www.oxfordlearnersdictionaries.com/definition/english/bias_1?q=bias`](http://www.oxfordlearnersdictionaries.com/definition/english/bias_1%253Fq%253Dbias)\n\
    \n在数据科学领域，可能存在不同类型的偏见，包括：\n\n*   **确认偏误**：当执行数据分析的人想要证明一个预设的假设，并故意从分析中排除特定变量，直到得出想要的结论时，就可能发生这种情况。\n\
    \n*   **选择偏误或样本偏误**：当所使用的数据样本不能很好地反映总体情况时，就会发生这种情况。\n\n*   **偏见偏误**：由受文化或其他刻板印象影响的训练数据导致的结果。例如，如果我们根据网上找到的图像训练一个算法来识别工作中的人，很多图像显示男性在编程，而女性在厨房。结果，模型会预测男性更可能是程序员，而女性是厨师，这是不正确的，并且复制了网上存在的偏见。\n\
    \n如果你不熟悉机器学习中的偏见这个话题，你可能会想知道为什么这是一个问题。\n\n人类在许多方面都存在偏见；我们可能对人或情况做出毫无根据的假设，从而导致歧视。然而，当这种偏见进入我们日常生活中使用的、旨在为我们做出决策或关于我们做出决策的产品或系统时，可能会产生不应被忽视的、可怕的广泛后果。\n\
    \n让我们看一些例子。\n\n## 7.2 机器学习中偏见的例子\n\n在接下来的几页中，我们将看两个在真实应用中使用有偏见机器学习模型的例子。\n\n###\
    \ 7.2.1 性别偏见\n\n几年前，谷歌翻译因其翻译结果揭示了算法的性别偏见而登上新闻。当将一些土耳其语单词翻译成英语时，土耳其语中涵盖所有单数第三人称的代词“o”被翻译成了英语中带有性别区分的代词，导致了以下有偏见的结果。\n\
    \n![../images/496132_1_En_7_Chapter/496132_1_En_7_Fig1_HTML.jpg](img/496132_1_En_7_Fig1_HTML.jpg)\n\
    \n图 7-1\n\n谷歌翻译显示有偏见的结果\n\n如上图所示，尽管土耳其语没有为每个术语指定特定性别，但谷歌翻译猜测了一个特定性别，导致了刻板印象，例如将“医生”一词与代词“他”匹配，将“护士”与“她”匹配。\n\
    \n谷歌现已更新其算法，通过为单个单词同时显示女性和男性的翻译，来试图防止此类偏见的发生。\n\n![../images/496132_1_En_7_Chapter/496132_1_En_7_Fig2_HTML.jpg](img/496132_1_En_7_Fig2_HTML.jpg)\n\
    \n图 7-2\n\n谷歌翻译显示包含多个代词的结果\n\n尽管这是一种改进，但错误不一定在于算法本身，而很可能是由于用于训练它的数据可能包含有偏见的信息。\n\
    \n此外，同时显示“她”和“他”代词并没有考虑到使用“他们”代词的人群，而为了达到更好的公平性，应该将其包含在内。\n"
- fmt: '### 7.2.2 Racial bias


    One of the most impactful examples of biased machine learning algorithm used in
    the past few years is with a software powered by AI called `COMPAS`.


    This software has been used by judges in courtrooms to generate risk assessments
    and forecast which criminals are most likely to reoffend based on responses to
    137 survey questions.


    The issue with using this algorithm is that it was discovered that, when it was
    wrong about its predictions, the results were displaying differently for black
    and white offenders.


    Black offenders were labelled as higher risk even though their chance of reoffending
    was lower, whereas white offenders were labelled as lower risk even though they
    had a higher probability to reoffend.


    ![../images/496132_1_En_7_Chapter/496132_1_En_7_Fig3_HTML.jpg](images/496132_1_En_7_Chapter/496132_1_En_7_Fig3_HTML.jpg)


    Figure 7-3


    `COMPAS` software results


    The fact that such erroneous predictions were used in the justice system is already
    a serious issue, but the scale at which it was used makes this even more concerning.


    Considering the United States imprisons a large number of people each year, one
    can only imagine the amount of incorrect convictions.


    Besides, as the company behind `COMPAS`, called Northpointe, refused to disclose
    the details of their algorithm, it made it impossible for researchers to evaluate
    the extent of its unfairness.


    These are only two examples of situations where bias can be introduced in machine
    learning algorithms. There are unfortunately plenty more and I would recommend
    to dive deeper into the topic.


    ## 7.3 Potential solutions


    Even though bias in machine learning cannot be completely eradicated, there are
    a few options to minimize it.


    ### 7.3.1 Framing the problem


    Before working on building a model and generating predictions, data scientists
    need to decide what problem they are trying to solve. It is already at this stage
    that some bias can be found. If you are building a model for a credit company
    that wants to automatically evaluate the “creditworthiness” of people, there are
    already decisions made around the concept what defines someone who is worthy of
    getting a credit that might embed some unfairness and discrimination.


    For example, a company can decide that it wants to maximize its profit margins,
    meaning creditworthiness will be based on how rich a client is as they will probably
    contract bigger loans. Otherwise, it can also decide that it would rather focus
    on maximizing the amount of loans contracted, no matter if clients can afford
    them or not.


    Overall the issue lies within the fact that these decisions are made with business
    objectives in mind, and not fairness, even though they will end up impacting real
    people in many ways.


    If an algorithm predicted that the giving subprime loans was an effective way
    to maximize profit, the company would end up engaging in predatory behavior even
    if it wasn’t the direct intention.


    ### 7.3.2 Collecting the data


    This may be a more frequent example of how bias makes its way into machine learning
    models and can show up in two ways.


    #### Incorrect representation of reality


    You may have heard of cases where collecting data that was unrepresentative of
    reality caused a machine learning model to generate incorrect predictions.


    For example, in face recognition, if an algorithm is trained with more images
    representing people with light-skinned faces than dark-skinned faces, the model
    created will inevitably be better at recognizing light-skinned faces.


    To try to prevent this kind of discrimination, analyzing the data you are using
    before feeding it to an algorithm will give you an idea of its quality and its
    potential in generating more fair predictions.


    In general, if you decide to use a pre-trained model, there should be a link documented
    for you to have a look at the dataset used. If you cannot find it, I would request
    it to the company or person sharing the model.


    If you are unable to verify the quality of the data, I would advise to find a
    different model.


    If you found the original dataset and noticed that it was lacking diversity and
    was not a good representation of reality, you could either decide not to use the
    model trained using this data, or you could decide to leverage it, collect some
    additional, more diverse data, and apply transfer learning to generate a new,
    less biased model to use in your application.


    If you take the route of collecting your own data and not rely on some existing
    model, I would advise to start by analyzing what diversity means in your particular
    case, what problem is your model going to solve, who will it be used on, what
    sources are you planning on using to collect the data, are these sources representative
    of reality, and so on.


    The analysis work is essential to raise potential issues or concerns early and
    build a model that will minimize the perpetuation of biases.


    #### Reflection of existing prejudices


    A second issue when it comes to collecting data is in using some that contains
    existing prejudices.


    Some companies use some of their internal historical data to train machine learning
    models to automate tasks.


    For example, a couple of years ago in 2018, Amazon realized that their internal
    AI recruiting tool was biased against women.


    They had been using data gathered for the past 10 years of job applications to
    rate new candidates from 0 to 5 stars. However, as most people hired to work at
    Amazon were males, the model had deduced that male candidates were preferable.


    Looking at historical hiring data and analyzing thousands of resumes, the model’s
    logic was that Amazon did not like resumes with the word “women” in it.


    As a result, any resume that was containing this word, for example, “Captain of
    the women’s team” or “Studied at a women’s college,” was getting a lower rating
    than the ones not mentioning it.


    Even though this made the news in 2018, Amazon had realized its new system was
    not rating candidates in a gender-neutral way, since 2015.


    A way to prevent this type of discrimination is related to the section earlier,
    analyzing the data you are using. The fact that data is internal does not mean
    it is unbiased. However, considering that this data had been collected over the
    past 10 years, we can agree that it might be too much data to analyze manually.
    I would still advise to collect a random set of samples and have people assess
    their fairness and diversity.


    Besides, when using a model for a task as important as hiring, I would hope that
    some testing of the model was done before using it. Bias in hiring is a well-known
    issue and can take many forms. As a result, if you decide to build or use a recruitment
    software that relies on machine learning, I would advise to test it for different
    biases, from gender to educational background, to ethnicity, and so on.'
