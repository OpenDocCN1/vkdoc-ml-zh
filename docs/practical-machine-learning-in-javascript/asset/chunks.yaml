    ### Visualizing keypoints


    So far, we’ve mainly used `console.log` to be able to see the results coming back
    from the model. However, you might want to visualize them on the page to make
    sure that the body tracking is working and that the keypoints are placed in the
    right position.


    To do this, we are going to use the Canvas API.


    We need to start by adding a HTML canvas element to the HTML file. Then, we can
    create a function that will access this element and its context, detect the poses,
    and draw the keypoints.


    Accessing the canvas element and its context is done with the following lines.


    ```

    const canvas = document.getElementById("output");

    const ctx = canvas.getContext("2d");

    canvas.width = window.innerWidth;

    canvas.height = window.innerHeight;

    ```


    *Listing 5-53 — Accessing the canvas element*


    Then, we can create a function that will call the `estimateSinglePose` method
    to start the detection, draw the video on the canvas, and loop through the keypoints
    found to render them on the canvas element.


    ```

    async function poseDetectionFrame() {

    const pose = await net.estimateSinglePose(video, {

    flipHorizontal: true

    });

    ctx.clearRect(0, 0, videoWidth, videoHeight);

    ctx.save();

    ctx.scale(-1, 1);

    ctx.translate(-videoWidth, 0);

    ctx.drawImage(video, 0, 0, window.innerWidth, window.innerHeight);

    ctx.restore();

    drawKeypoints(pose.keypoints, 0.5, ctx);

    drawSkeleton(pose.keypoints, 0.5, ctx);

    requestAnimationFrame(poseDetectionFrame);

    }

    ```


    *Listing 5-54 — Start the detection, draw the webcam feed on a canvas element,
    and render the keypoints*


    The `drawKeypoints` and `drawSkeleton` functions use some of the Canvas API methods
    to draw circles and lines at the coordinates of the keypoints detected.


    ```

    const color = "aqua";

    const lineWidth = 2;

    const toTuple = ({ y, x }) => [y, x];

    function drawPoint(ctx, y, x, r, color) {

    ctx.beginPath();

    ctx.arc(x, y, r, 0, 2 * Math.PI);

    ctx.fillStyle = color;

    ctx.fill();

    }

    function drawSegment([ay, ax], [by, bx], color, scale, ctx) {

    ctx.beginPath();

    ctx.moveTo(ax * scale, ay * scale);

    ctx.lineTo(bx * scale, by * scale);

    ctx.lineWidth = lineWidth;

    ctx.strokeStyle = color;

    ctx.stroke();

    }

    function drawSkeleton(keypoints, minConfidence, ctx, scale = 1) {

    const adjacentKeyPoints = posenet.getAdjacentKeyPoints(

    keypoints,

    minConfidence

    );

    adjacentKeyPoints.forEach((keypoints) => {

    drawSegment(

    toTuple(keypoints[0].position),

    toTuple(keypoints[1].position),

    color,

    scale,

    ctx

    );

    });

    }

    function drawKeypoints(keypoints, minConfidence, ctx, scale = 1) {

    for (let i = 0; i < keypoints.length; i++) {

    const keypoint = keypoints[i];

    if (keypoint.score < minConfidence) {

    continue;

    }

    const { y, x } = keypoint.position;

    drawPoint(ctx, y * scale, x * scale, 3, color);

    }

    }

    ```


    *Listing 5-55 — Some helper functions to draw the keypoints onto the canvas element*


    The `poseDetectionFrame` function should be called once the video and model are
    loaded.


    Altogether, the full code sample should look like the following.'
