  trans: '

    ### 5.1.3 音频数据可视化


    声音的可视化有多种方式。你可能熟悉的两种方式是波形图或频率图。


    波形可视化器表示声波随时间变化的位移。


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig4_HTML.jpg](img/496132_1_En_5_Fig4_HTML.jpg)


    图 5-4


    波形可视化示意图。来源：[*https://css-tricks.com/making-an-audio-waveform-visualizer-with-vanilla-javascript/*](https://css-tricks.com/making-an-audio-waveform-visualizer-with-vanilla-javascript/)


    x 轴（水平轴）是时间单位，y 轴（垂直轴）是频率。声音在特定时间段内发生，并由多个频率组成。


    这种声音可视化方式过于简单，难以识别模式。正如你在上图中看到的，构成声音的所有频率都被缩减为一条单线。


    频率图是一种可视化方式，它表示波形在给定时间内重复的次数。


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig5_HTML.jpg](img/496132_1_En_5_Fig5_HTML.jpg)


    图 5-5


    频率图可视化示意图


    你可能对这种音频可视化方式很熟悉，因为它可能是最常见的一种。


    这种可视化方式或许能让你对节拍有所了解，因为它能显示重复次数，或者通过 y 轴显示音量来了解声音的响度，但也仅此而已。


    这种可视化方式无法提供足够的信息来识别和分类我们正在可视化的声音。


    另一种更有用的可视化类型称为**声谱图**。


    声谱图就像声音的图片。它显示了构成声音的频率从低到高的变化，以及它们如何随时间变化。它是信号频谱的可视化表示，有点像声音的热力图。


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig6_HTML.jpg](img/496132_1_En_5_Fig6_HTML.jpg)


    图 5-6


    声谱图示意图


    y 轴是频率范围，x 轴是时间长度。这些轴看起来与我们之前提到的另外两种可视化类型相似，但不同的是，我们不再将所有频率表示为一条单线，而是表示整个频谱。


    在声谱图中，第三个轴也很有用，即**振幅**。声音的振幅可以理解为音量。颜色越亮，声音越响。


    将声音可视化为声谱图，对于寻找有助于我们识别和分类声音的模式要有效得多。


    例如，下面是我说话时声谱图输出的截图。


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig7_HTML.jpg](img/496132_1_En_5_Fig7_HTML.jpg)


    图 5-7


    说话时拍摄的声谱图示意图


    仅凭这一点，可能还无法让你理解为什么声谱图是更有用的可视化方式。下面是我拍手三次时拍摄的另一张声谱图截图。


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig8_HTML.jpg](img/496132_1_En_5_Fig8_HTML.jpg)


    图 5-8


    拍手三次时拍摄的声谱图示意图


    希望这开始变得更有意义了！如果你比较这两张声谱图，可以清楚地区分两种活动：说话和拍手。


    如果你愿意，可以尝试可视化更多声音，比如咳嗽声、电话铃声、马桶冲水声等等。


    总的来说，主要结论是：声谱图帮助我们更清晰地看到各种声音的特征，并区分不同的活动。


    如果我们能通过查看声谱图截图做出这种区分，那么我们有理由相信，将这些数据用于机器学习算法，也能在寻找模式和分类这些声音方面发挥作用，从而构建一个活动分类器。


    一个更广泛的利用声谱图进行活动分类的例子，来自美国卡内基梅隆大学发表的一篇研究论文。在他们题为“Ubicoustics: Plug-and-Play Acoustic
    Activity Recognition”（无处不在的声学：即插即用的声学活动识别）的论文中，他们为从使用电锯到附近车辆行驶等各种活动创建了声谱图。


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig9_HTML.jpg](img/496132_1_En_5_Fig9_HTML.jpg)


    图 5-9


    卡内基梅隆大学研究中收集的声谱图。来源：[*http://www.gierad.com/projects/ubicoustics/*](http://www.gierad.com/projects/ubicoustics/)


    因此，在深入探讨将声音与机器学习结合使用之前，我们先来了解一下如何将使用 Web Audio API 记录在控制台中的麦克风实时数据转换为声谱图。

    '
- fmt: '### Creating a spectrogram


    In the code sample we wrote earlier, we created a `getAudioData` function that
    was getting the frequency data from the raw data and was logging it to the browser’s
    console.


    ```

    const getAudioData = () => {

    const freqdata = new Uint8Array(analyser.frequencyBinCount);

    analyser.getByteFrequencyData(freqdata);

    console.log(freqdata);

    requestAnimationFrame(getAudioData);

    };

    Listing 5-5

    getAudioData function to get frequency data from raw data

    ```


    Where we wrote our `console.log` statement, we are going to add the code to create
    the visualization.


    To do this, we are going to use the Canvas API, so we need to start by adding
    a canvas element to our HTML file like so.


    ```

    Listing 5-6

    Adding a canvas element to the HTML file

    ```


    In our JavaScript, we are going to be able to access this element and use some
    methods from the Canvas API to draw our visualization.


    ```

    var canvas = document.getElementById("canvas");

    var ctx = canvas.getContext("2d");

    Listing 5-7

    Getting the canvas element and context in JavaScript

    ```


    The main concept of this visualization is to draw the spectrum of frequencies
    as they vary with time, so we need to get the current canvas and redraw over it
    every time we get new live data.


    ```

    imagedata = ctx.getImageData(1, 0, canvas.width - 1, canvas.height);

    ctx.putImageData(imagedata, 0, 0);

    Listing 5-8

    Getting the image data from the canvas element and redrawing over it

    ```


    Then, we need to loop through the frequency data we get from the Web Audio API
    and draw them onto the canvas.


    ```

    for (var i = 0; i < freqdata.length; i++) {

    let value = (2 * freqdata[i]) / 255;

    ctx.beginPath();

    ctx.strokeStyle = `rgba(${Math.max(0, 255 * value)}, ${Math.max(

    0,

    255 * (value - 1)

    )}, 54, 255)`;

    ctx.moveTo(canvas.width - 1, canvas.height - i * (canvas.height / freqdata.length));

    ctx.lineTo(

    canvas.width - 1,

    canvas.height -

    (i * (canvas.height / freqdata.length) +

    canvas.height / freqdata.length)

    );

    ctx.stroke();

    }

    Listing 5-9

    Looping through frequency data and drawing it onto the canvas

    ```


    Inside this for loop, we use the `beginPath` method to indicate that we are going
    to start drawing something onto the canvas.


    Then, we call `strokeStyle` and pass it a dynamic value that will represent the
    colors used to display the amplitude of the sound.


    After that, we call `moveTo` to move the visualization 1 pixel to the left and
    leave space for the new input to be drawn onto the screen at the far right, drawn
    with `lineTo`.


    Finally, we call the `stroke` method to draw the line.


    Altogether, our `getAudioData` function should look something like this.


    ```

    const getAudioData = () => {

    freqdata = new Uint8Array(analyser.frequencyBinCount);

    analyser.getByteFrequencyData(freqdata);

    console.log(freqdata);

    imagedata = ctx.getImageData(1, 0, canvas.width - 1, canvas.height);

    ctx.putImageData(imagedata, 0, 0);

    for (var i = 0; i < freqdata.length; i++) {

    let value = (2 * freqdata[i]) / 255;

    ctx.beginPath();

    ctx.strokeStyle = `rgba(${Math.max(0, 255 * value)}, ${Math.max(

    0,

    255 * (value - 1)

    )}, 54, 255)`;

    ctx.moveTo(

    canvas.width - 1,

    canvas.height - i * (canvas.height / freqdata.length)

    );

    ctx.lineTo(

    canvas.width - 1,

    canvas.height -

    (i * (canvas.height / freqdata.length) +

    canvas.height / freqdata.length)

    );

    ctx.stroke();

    }

    requestAnimationFrame(getAudioData);

    };

    Listing 5-10

    Full getAudioData function

    ```


    You might be wondering why it is important to understand how to create spectrograms.
    The main reason is that it is what is used as training data for the machine learning
    algorithm.


    Instead of using the raw data the way we logged it in the browser’s console, we
    instead use pictures of spectrograms generated to transform a sound problem into
    an image one.


    Advancements in image recognition and classification have been really good over
    the past few years, and algorithms used with image data have been proven to be
    very performant.


    Also, turning sound data into an image means that we can deal with a smaller amount
    of data to train a model, which would result in a shorter amount of time needed.


    Indeed, the default sample rate of the Web Audio API is 44KHz, which means that
    it collects 44,000 samples of data per second.


    If we record 2 seconds of audio, it is 88,000 points of data for a single sample.


    You can imagine that as we need to record a lot more samples, it would end up
    being a very large amount of data being fed to a machine learning algorithm, which
    would take a long time to train.


    On the other hand, a spectrogram being extracted as a picture can be easily resized
    to a smaller size, which could end up being only a 28x28 pixel image, for example,
    which would result in 784 data points for a 2-second audio clip.


    Now that we covered how to access live data from the microphone in JavaScript
    and how to transform it into a spectrogram visualization, allowing us to see how
    different sounds create visually different patterns, let’s look into how to train
    a machine learning model to create a classifier.'
  raw: '#### Creating a spectrogram


    In the code sample we wrote earlier, we created a `getAudioData` function that
    was getting the frequency data from the raw data and was logging it to the browser’s
    console.


    ```

    const getAudioData = () => {

    const freqdata = new Uint8Array(analyser.frequencyBinCount);

    analyser.getByteFrequencyData(freqdata);

    console.log(freqdata);

    requestAnimationFrame(getAudioData);

    };

    Listing 5-5

    getAudioData function to get frequency data from raw data

    ```


    Where we wrote our `console.log` statement, we are going to add the code to create
    the visualization.


    To do this, we are going to use the Canvas API, so we need to start by adding
    a canvas element to our HTML file like so.


    ```

    Listing 5-6

    Adding a canvas element to the HTML file

    ```


    In our JavaScript, we are going to be able to access this element and use some
    methods from the Canvas API to draw our visualization.


    ```

    var canvas = document.getElementById("canvas");

    var ctx = canvas.getContext("2d");

    Listing 5-7

    Getting the canvas element and context in JavaScript

    ```


    The main concept of this visualization is to draw the spectrum of frequencies
    as they vary with time, so we need to get the current canvas and redraw over it
    every time we get new live data.


    ```

    imagedata = ctx.getImageData(1, 0, canvas.width - 1, canvas.height);

    ctx.putImageData(imagedata, 0, 0);

    Listing 5-8

    Getting the image data from the canvas element and redrawing over it

    ```


    Then, we need to loop through the frequency data we get from the Web Audio API
    and draw them onto the canvas.


    ```

    for (var i = 0; i < freqdata.length; i++) {

    let value = (2 * freqdata[i]) / 255;

    ctx.beginPath();

    ctx.strokeStyle = `rgba(${Math.max(0, 255 * value)}, ${Math.max(

    0,

    255 * (value - 1)

    )}, 54, 255)`;

    ctx.moveTo(canvas.width - 1, canvas.height - i * (canvas.height / freqdata.length));

    ctx.lineTo(

    canvas.width - 1,

    canvas.height -

    (i * (canvas.height / freqdata.length) +

    canvas.height / freqdata.length)

    );

    ctx.stroke();

    }

    Listing 5-9

    Looping through frequency data and drawing it onto the canvas

    ```


    Inside this for loop, we use the `beginPath` method to indicate that we are going
    to start drawing something onto the canvas.


    Then, we call `strokeStyle` and pass it a dynamic value that will represent the
    colors used to display the amplitude of the sound.


    After that, we call `moveTo` to move the visualization 1 pixel to the left and
    leave space for the new input to be drawn onto the screen at the far right, drawn
    with `lineTo`.


    Finally, we call the `stroke` method to draw the line.


    Altogether, our `getAudioData` function should look something like this.


    ```

    const getAudioData = () => {

    freqdata = new Uint8Array(analyser.frequencyBinCount);

    analyser.getByteFrequencyData(freqdata);

    console.log(freqdata);

    imagedata = ctx.getImageData(1, 0, canvas.width - 1, canvas.height);

    ctx.putImageData(imagedata, 0, 0);

    for (var i = 0; i < freqdata.length; i++) {

    let value = (2 * freqdata[i]) / 255;

    ctx.beginPath();

    ctx.strokeStyle = `rgba(${Math.max(0, 255 * value)}, ${Math.max(

    0,

    255 * (value - 1)

    )}, 54, 255)`;

    ctx.moveTo(

    canvas.width - 1,

    canvas.height - i * (canvas.height / freqdata.length)

    );

    ctx.lineTo(

    canvas.width - 1,

    canvas.height -

    (i * (canvas.height / freqdata.length) +

    canvas.height / freqdata.length)

    );

    ctx.stroke();

    }

    requestAnimationFrame(getAudioData);

    };

    Listing 5-10

    Full getAudioData function

    ```


    You might be wondering why it is important to understand how to create spectrograms.
    The main reason is that it is what is used as training data for the machine learning
    algorithm.


    Instead of using the raw data the way we logged it in the browser’s console, we
    instead use pictures of spectrograms generated to transform a sound problem into
    an image one.


    Advancements in image recognition and classification have been really good over
    the past few years, and algorithms used with image data have been proven to be
    very performant.


    Also, turning sound data into an image means that we can deal with a smaller amount
    of data to train a model, which would result in a shorter amount of time needed.


    Indeed, the default sample rate of the Web Audio API is 44KHz, which means that
    it collects 44,000 samples of data per second.


    If we record 2 seconds of audio, it is 88,000 points of data for a single sample.


    You can imagine that as we need to record a lot more samples, it would end up
    being a very large amount of data being fed to a machine learning algorithm, which
    would take a long time to train.


    On the other hand, a spectrogram being extracted as a picture can be easily resized
    to a smaller size, which could end up being only a 28x28 pixel image, for example,
    which would result in 784 data points for a 2-second audio clip.


    Now that we covered how to access live data from the microphone in JavaScript
    and how to transform it into a spectrogram visualization, allowing us to see how
    different sounds create visually different patterns, let’s look into how to train
    a machine learning model to create a classifier.'
  trans: '

    #### 创建频谱图


    在我们之前编写的代码示例中，我们创建了一个 `getAudioData` 函数，该函数从原始数据中获取频率数据，并将其记录到浏览器的控制台中。


    ```

    const getAudioData = () => {

    const freqdata = new Uint8Array(analyser.frequencyBinCount);

    analyser.getByteFrequencyData(freqdata);

    console.log(freqdata);

    requestAnimationFrame(getAudioData);

    };

    清单 5-5

    从原始数据中获取频率数据的 getAudioData 函数

    ```


    在我们编写 `console.log` 语句的位置，我们将添加用于创建可视化的代码。


    为此，我们将使用 Canvas API，因此我们需要先在 HTML 文件中添加一个 canvas 元素，如下所示。


    ```

    清单 5-6

    在 HTML 文件中添加 canvas 元素

    ```


    在我们的 JavaScript 中，我们将能够访问这个元素，并使用 Canvas API 中的一些方法来绘制我们的可视化。


    ```

    var canvas = document.getElementById("canvas");

    var ctx = canvas.getContext("2d");

    清单 5-7

    在 JavaScript 中获取 canvas 元素及其上下文

    ```


    此可视化的主要概念是绘制随时间变化的频谱，因此我们需要获取当前的 canvas，并在每次获取到新的实时数据时重新绘制它。


    ```

    imagedata = ctx.getImageData(1, 0, canvas.width - 1, canvas.height);

    ctx.putImageData(imagedata, 0, 0);

    清单 5-8

    从 canvas 元素获取图像数据并重新绘制

    ```


    然后，我们需要遍历从 Web Audio API 获取的频率数据，并将它们绘制到 canvas 上。


    ```

    for (var i = 0; i < freqdata.length; i++) {

    let value = (2 * freqdata[i]) / 255;

    ctx.beginPath();

    ctx.strokeStyle = `rgba(${Math.max(0, 255 * value)}, ${Math.max(

    0,

    255 * (value - 1)

    )}, 54, 255)`;

    ctx.moveTo(canvas.width - 1, canvas.height - i * (canvas.height / freqdata.length));

    ctx.lineTo(

    canvas.width - 1,

    canvas.height -

    (i * (canvas.height / freqdata.length) +

    canvas.height / freqdata.length)

    );

    ctx.stroke();

    }

    清单 5-9

    遍历频率数据并将其绘制到 canvas 上

    ```


    在这个 for 循环内部，我们使用 `beginPath` 方法来指示我们将要在 canvas 上开始绘制某些内容。


    然后，我们调用 `strokeStyle` 并传入一个动态值，该值将代表用于显示声音振幅的颜色。


    之后，我们调用 `moveTo` 将可视化内容向左移动 1 个像素，为在屏幕最右侧绘制新的输入数据留出空间，该绘制通过 `lineTo` 完成。


    最后，我们调用 `stroke` 方法来绘制线条。


    总的来说，我们的 `getAudioData` 函数应该如下所示。


    ```

    const getAudioData = () => {

    freqdata = new Uint8Array(analyser.frequencyBinCount);

    analyser.getByteFrequencyData(freqdata);

    console.log(freqdata);

    imagedata = ctx.getImageData(1, 0, canvas.width - 1, canvas.height);

    ctx.putImageData(imagedata, 0, 0);

    for (var i = 0; i < freqdata.length; i++) {

    let value = (2 * freqdata[i]) / 255;

    ctx.beginPath();

    ctx.strokeStyle = `rgba(${Math.max(0, 255 * value)}, ${Math.max(

    0,

    255 * (value - 1)

    )}, 54, 255)`;

    ctx.moveTo(

    canvas.width - 1,

    canvas.height - i * (canvas.height / freqdata.length)

    );

    ctx.lineTo(

    canvas.width - 1,

    canvas.height -

    (i * (canvas.height / freqdata.length) +

    canvas.height / freqdata.length)

    );

    ctx.stroke();

    }

    requestAnimationFrame(getAudioData);

    };

    清单 5-10

    完整的 getAudioData 函数

    ```


    你可能会想，理解如何创建频谱图为什么重要。主要原因在于，它正是用于机器学习算法训练数据的内容。


    我们不是像在浏览器控制台中记录的那样使用原始数据，而是使用生成的频谱图图片，将声音问题转化为图像问题。


    过去几年中，图像识别和分类技术取得了长足的进步，并且与图像数据一起使用的算法已被证明性能非常出色。


    此外，将声音数据转化为图像意味着我们可以用更少的数据量来训练模型，从而缩短所需的时间。


    实际上，Web Audio API 的默认采样率是 44KHz，这意味着它每秒收集 44,000 个数据样本。


    如果我们录制 2 秒的音频，单个样本就有 88,000 个数据点。


    可以想象，随着我们需要录制更多的样本，最终输入到机器学习算法的数据量会非常庞大，训练时间也会很长。


    另一方面，作为图片提取的频谱图可以轻松地调整为更小的尺寸，例如最终可能只有 28x28 像素的图像，这样对于一个 2 秒的音频片段，就只对应 784 个数据点。


    现在，我们已经介绍了如何在 JavaScript 中从麦克风访问实时数据，以及如何将其转换为频谱图可视化，从而让我们看到不同的声音如何产生视觉上不同的模式。接下来，让我们探讨如何训练一个机器学习模型来创建一个分类器。

    '
- fmt: '### 5.1.4 Training the classifier


    Instead of creating a custom machine learning algorithm for this, we are going
    to use instead one of the Teachable Machine experiments dedicated to sound data.
    You can find it at [`https://teachablemachine.withgoogle.com/train/audio`](https://teachablemachine.withgoogle.com/train/audio).


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig10_HTML.jpg](images/496132_1_En_5_Chapter/496132_1_En_5_Fig10_HTML.jpg)


    Figure 5-10


    Teachable Machine interface


    This project allows us to record samples of sound data, label them, train a machine
    learning algorithm, test the output, and export the model all within a single
    interface and in the browser!


    To start, we need to record some background noise for 20 seconds using the section
    highlighted in red in the following figure.


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig11_HTML.jpg](images/496132_1_En_5_Chapter/496132_1_En_5_Fig11_HTML.jpg)


    Figure 5-11


    Teachable Machine interface with background noise section highlighted


    Then, we can start to record some samples for whatever sound we would like the
    model to recognize later on.


    The minimum amount of samples is 8 and each of them needs to be 2 seconds long.


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig12_HTML.jpg](images/496132_1_En_5_Chapter/496132_1_En_5_Fig12_HTML.jpg)


    Figure 5-12


    Teachable Machine interface with custom section highlighted


    As this experiment uses transfer learning to quickly retrain a model that has
    already been trained with sound data, we need to work with the same format the
    original model was trained with.


    Eight samples is the minimum but you can record more if you’d like. The more samples,
    the better. However, don’t forget that it will also impact the amount of time
    the training will take.


    Once you have recorded your samples and labelled them, you can start the live
    training in the browser and make sure not to close the browser window.


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig13_HTML.jpg](images/496132_1_En_5_Chapter/496132_1_En_5_Fig13_HTML.jpg)


    Figure 5-13


    Teachable Machine interface – training the model


    When this step is done, you should be able to see some live predictions in the
    last step of the experiment. Before you export the model, you can try to repeat
    the sounds you recorded to verify the accuracy of the predictions. If you don’t
    find it accurate enough, you can record more samples and restart the training.


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig14_HTML.jpg](images/496132_1_En_5_Chapter/496132_1_En_5_Fig14_HTML.jpg)


    Figure 5-14


    Teachable Machine interface – running live predictions


    If you are ready to move on, you can either upload your model to some Google servers
    and be provided with a link to it, or download the machine learning model that
    was created.


    If you’d like to get a better understanding of how it works in the background,
    how the machine learning model is created, and so on, I’d recommend having a look
    at the source code available on GitHub!


    Even though I really like interfaces like Teachable Machine as they allow anyone
    to get started and experiment quickly, looking at the source code can reveal some
    important details. For example, the next image is how I realized that this project
    was using transfer learning.


    While going through the code to see how the machine learning model was created
    and how the training was done, I noticed the following sample of code.


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig15_HTML.jpg](images/496132_1_En_5_Chapter/496132_1_En_5_Fig15_HTML.jpg)


    Figure 5-15


    Sample from the open source GitHub repository of Teachable Machine


    On line 793, we can see that the method `addExample` is called. This is the same
    method we used in the chapter of this book dedicated to image recognition when
    we used transfer learning to train an image classification model quickly with
    new input images.


    Noticing these details is important if you decide to experiment with re-creating
    this model on your own, without going through the Teachable Machine interface.


    Now that we went through the training process, we can write the code to generate
    the predictions.'
