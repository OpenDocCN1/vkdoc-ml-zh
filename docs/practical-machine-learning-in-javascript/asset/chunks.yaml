- fmt: "### 6.4.1 Pre-trained models\n\nHopefully, after going through the projects\
    \ in this book, you are familiar with using pre-trained models with `TensorFlow.js`.\n\
    \nSo far, we used the `MobileNet` image classification model, `PoseNet`, the `Toxicity\
    \ Classifier`, speech commands, `Facemesh`, `Handpose`, and the `Question Answering`\
    \ model; however, there are a few more.\n\nIndeed, if you decide to explore further,\
    \ you will see that there also exist a face landmark detection model, an object\
    \ detection model, a body segmentation model, and a few more.\n\nHowever, pre-trained\
    \ models do not have to be developed by the `TensorFlow.js` team to be usable\
    \ with `TensorFlow.js`.\n\n`Keras` models typically created using Python can be\
    \ saved in different formats and converted to `TensorFlow.js` Layers format to\
    \ be loaded with the framework.\n\nAs a result, if you find an open source model\
    \ you are interested in working with, feel free to check if it can be converted\
    \ to the format that works with `TensorFlow.js` so you can load it in a JavaScript\
    \ application.\n\n### 6.4.2 APIs\n\nTo make it easier for developers to implement\
    \ machine learning in production applications, technology companies like Amazon,\
    \ Google, and Microsoft have been working on developing ML services available\
    \ as APIs.\n\nFor example, Amazon currently has multiple APIs for services including\
    \ image and video analysis, personalized recommendations, real-time translation,\
    \ advanced text analysis, chatbots, and fraud prevention.\n\nFor example, Amazon\
    \ currently has APIs including:\n\n* `Comprehend` for advanced text analysis\n\
    * `CodeGuru` for automated code reviews\n* `Lex` for chatbots\n* `Textract` for\
    \ document analysis\n* `Detector` for fraud prevention\n* `Recognition` for image\
    \ and video analysis\n* `Polly` for text to speech\n\nGoogle Cloud offers APIs\
    \ such as:\n\n* **Vision AI**: To get image insights, detect objects, faces, and\
    \ text\n* **Video intelligence API**: To recognize objects, places, and actions\
    \ in stored and streaming video\n* **Speech-to-text API**: To accurately convert\
    \ speech into text\n\nAnd Microsoft has a suite of tools called Cognitive Services\
    \ with APIs including a content moderator service, a `QnA Maker`, a speaker recognition\
    \ service that can identify and verify the people speaking based on audio, and\
    \ similar APIs around image and text recognition.\n\n### 6.4.3 Serving platforms\n\
    \nFinally, if you are more interested in building and serving a custom model,\
    \ here are some tools that aim at making it simpler.\n\nThe Google Cloud AI platform\
    \ as well as Amazon Web Services and Microsoft offer more complete solutions for\
    \ you to serve your custom machine learning projects; however, other model serving\
    \ platforms can be found such as the open source `BentoML`, `Seldon`, or `kaos`\
    \ by KI labs.\n\nEven though teams may be tempted to rely on tools from Google,\
    \ Microsoft, or Amazon, these platforms do not often give you the freedom you\
    \ may want in picking your tooling. They optimize for the use of their own offerings\
    \ and sometimes make it complicated to integrate with other third-party tools.\n\
    \nBesides, depending on the size of your application, using these platforms may\
    \ be overengineering.\n\nOverall, there are multiple options available when it\
    \ comes to productionizing machine learning models. However, as this is still\
    \ something most companies are not doing, the standards are not set and will probably\
    \ evolve. As a result, if this is an area you are interested in learning more\
    \ about, you should definitely do some extra research and experimentation.\n\n\
    # 7. Bias in machine learning\n\nIn my opinion, this book would not be complete\
    \ without mentioning the topic of bias in machine learning.\n\nAs we give the\
    \ ability to computers to generate predictions and rely on them in production\
    \ applications that people will interact with, it is essential to spend some time\
    \ thinking about the consequences and impact of using this technology.\n\nIn this\
    \ last chapter, we are going to talk about the different types of biases, why\
    \ this is an issue and what can be done to minimize it in our machine learning\
    \ systems.\n\n## 7.1 What is bias?\n\nIf we refer to the definition from the Oxford\
    \ dictionary, bias is\n\n> *a strong feeling in favour of or against one group\
    \ of people, or one side in an argument, often not based on fair judgement.*\n\
    > \n> —Quote source: [`www.oxfordlearnersdictionaries.com/definition/english/bias_1?q=bias`](http://www.oxfordlearnersdictionaries.com/definition/english/bias_1%253Fq%253Dbias)\n\
    \nWhen it comes to data science, there can be different types of biases, including:\n\
    \n* **Confirmation bias**: This can happen when the person performing the data\
    \ analysis wants to prove a predetermined assumption and will intentionally exclude\
    \ particular variables from an analysis until it comes to the wanted conclusion.\n\
    \n* **Selection bias or sample bias**: This happens when the sample of data used\
    \ is not a good reflection of the population.\n\n* **Prejudice bias**: Result\
    \ of training data that is influenced by cultural or other stereotypes. For example,\
    \ if we train an algorithm to recognize people at work based on images found online,\
    \ a lot of them show men coding, for example, and women in the kitchen. As a result,\
    \ the model will be predicting men as being more likely coders and women cook,\
    \ which is incorrect and replicating biases found online.\n\nIf you are not familiar\
    \ with the topic of bias in machine learning, you might be wondering why it is\
    \ a problem.\n\nHumans are biased in many ways; we can make unfounded assumptions\
    \ about people or situations that can lead to discrimination. However, when this\
    \ bias makes it into products or systems used in our daily lives and developed\
    \ to make decisions for us and about us, this can have terrible widespread consequences\
    \ that should not be ignored.\n\nLet’s look at some examples.\n\n## 7.2 Examples\
    \ of bias in machine learning\n\nOver the next couple of pages, we are going to\
    \ look at two examples of situations where biased machine learning models were\
    \ used in real applications.\n\n### 7.2.1 Gender bias\n\nA few years ago, Google\
    \ Translate made the news with translations that were revealing the algorithms’\
    \ gender bias. When translating some words from the Turkish language to English,\
    \ the one pronoun “o”, which covers every kind of singular third person in Turkish,\
    \ was translated to a gendered pronoun in English, resulting in the following\
    \ biased results.\n\n![../images/496132_1_En_7_Chapter/496132_1_En_7_Fig1_HTML.jpg](images/496132_1_En_7_Chapter/496132_1_En_7_Fig1_HTML.jpg)\n\
    \nFigure 7-1\n\nGoogle Translate showing biased results\n\nAs you can see in the\
    \ preceding image, even though the Turkish language did not specify a certain\
    \ gender for each term, Google Translate guessed a particular one, resulting in\
    \ stereotypes such as matching the word “doctor” with the pronoun “he” and the\
    \ word “nurse” with “she”.\n\nGoogle has now updated their algorithm to try to\
    \ prevent such biases from happening by now displaying both feminine and masculine\
    \ translations for a single word.\n\n![../images/496132_1_En_7_Chapter/496132_1_En_7_Fig2_HTML.jpg](images/496132_1_En_7_Chapter/496132_1_En_7_Fig2_HTML.jpg)\n\
    \nFigure 7-2\n\nGoogle Translate showing results with multiple pronouns\n\nEven\
    \ though this is an improvement, the fault was not necessarily on the algorithm\
    \ itself but most likely due to the fact that the data used to train it probably\
    \ contained biased information.\n\nBesides, displaying both “she” and “he” pronouns\
    \ does not take into account people who use the pronoun “they”, which should be\
    \ included to achieve better fairness."
