    要从视频流中捕获图像，TensorFlow.js 有一个内置的 `capture()` 方法，需要在之前使用 `tf.data.webcam` 创建的对象上调用它。


    它允许将单个图像直接转换为张量，以便随后可以轻松地与其他 TensorFlow.js 操作一起使用。


