    ExtractConf 2015 entitled “What data scientists should know about deep learning.”


    ![../images/496132_1_En_1_Chapter/496132_1_En_1_Fig2_HTML.jpg](images/496132_1_En_1_Chapter/496132_1_En_1_Fig2_HTML.jpg)


    Figure 1-2


    This slide illustrates how deep learning scales compared to other machine learning
    algorithms. Source: [https://​www.​slideshare.​net/​ExtractConf](https://www.slideshare.net/ExtractConf)


    As you can see in the preceding graph, the main differential characteristic of
    deep learning algorithms is their ability to scale and increase performance with
    more data.


    The term “deep” learning generally refers to the amount of layers used in the
    neural networks. If this does not totally make sense right now, we’ll cover the
    concept of layers a bit later in this book.


    Now that we know more about the difference between these terms, this book is going
    to be focusing mainly on machine learning, the technology. We’ll be diving a little
    bit into deep learning as we look into different techniques but we’ll touch on
    broader aspects of the technology as well.


    We’ve defined the different names sometimes interchangeably used to talk about
    intelligence expressed by computers, but what about other important idioms like
    “neural networks,” “algorithms,” and “models”?


    We are probably going to mention them along the book, so let’s spend the next
    few paragraphs defining them.


    Let’s start with **algorithms** as this is the one you might be the most familiar
    with as it is already used in traditional programming.


    An algorithm can be defined as a set of rules or instructions to solve a particular
    problem or perform a computation.


    In software engineering, examples of algorithms you might have heard of or used
    would be the quicksort algorithm, the Dijkstra algorithm, binary search, and so
    on. Each algorithm was created to solve a particular problem.


    When it comes to machine learning algorithms, they solve different types of problems
    but the concept is the same; each algorithm, it being a support vector machine
    (SVM) or a long short-term memory (LSTM) algorithm, is only a mathematical function
    that solves a specific problem.


    **Neural networks** are a set of deep learning algorithms designed to mimic the
    way the brain works.


    The same way the brain is made of a giant network of connected neurons, neural
    networks are made of layers of interconnected nodes called artificial neurons.


    A visual way of representing these networks might be like the following graph.


    ![../images/496132_1_En_1_Chapter/496132_1_En_1_Fig3_HTML.jpg](images/496132_1_En_1_Chapter/496132_1_En_1_Fig3_HTML.jpg)


    Figure 1-3


    This graph is a representation of the different layers in a neural network


    In neural networks, there are usually three main parts, an **input layer** that
    represents the input data you want to generate a prediction for (e.g., an image
    you want to apply object detection to, a piece of text you want to get the sentiment
    for, etc.), a certain number of **hidden layers**, and an **output layer** that
    represents your prediction.


    This is a very high-level explanation of how neural networks work, but the most
    important part to understand is that they are made of a large number of interconnected
    nodes, organized in layers, that get activated or not during the training process
    depending on the outcome generated by neurons in the previous layer, in a similar
    way different neurons in the brain fire when given specific inputs.


    Finally, **models**. In machine learning, models represent the output of a training
    session. When the training process is happening, algorithms are “learning” to
    draw conclusions from patterns they find in data; once the training steps are
    done, the output is a model.


    Models are mathematical functions that can take new inputs as parameters and produce
    a prediction as output.'
  trans: '

    ## 1.1 什么是机器学习？


    在过去的几年里，你可能已经多次听到“机器学习”这个词，但它到底是什么？它和人工智能是一回事吗？深度学习呢？神经网络呢？模型呢？


    在深入探讨工具、算法以及能构建什么之前，我们先来定义其中一些术语，以便对机器学习是什么、不是什么达成共识。


    人工智能、机器学习和深度学习都是相关的术语。然而，它们并不完全相同，更像是彼此的子集。


    ![../images/496132_1_En_1_Chapter/496132_1_En_1_Fig1_HTML.jpg](img/496132_1_En_1_Fig1_HTML.jpg)


    图 1-1


    此图展示了人工智能、机器学习和深度学习之间的关系


    **人工智能**是一个总称，涵盖与计算机展现“智能”相关的所有内容。这包括语音识别（对人类语言的理解）、自动驾驶汽车或策略游戏（计算机玩围棋或国际象棋等策略游戏的能力）。


    **机器学习**代表技术本身：所有实践和工具集，用于赋予计算机在没有明确编程的情况下从数据中发现模式的能力。


    这包括不同类型的学习和可用算法，例如监督学习、朴素贝叶斯、K-近邻等，我们将在接下来的几章中介绍这些内容。


    这项技术用于训练计算机，使其基于对历史数据的理解来做出自己的预测。


    这意味着我们并不是告诉计算机要寻找什么；相反，我们向算法提供大量先前收集的数据，让它们在这个数据集中发现模式和相关性，以便在获得新数据时得出未来的结论和概率。


    例如，如果我们想利用机器学习来帮助我们根据一个人的 CT 扫描结果计算其患癌概率，我们会构建一个包含来自全球不同患者的数十万甚至数百万份 CT 扫描结果的数据集。我们会将这些数据标记为癌症患者的
    CT 扫描和健康患者的扫描。然后，我们将所有这些数据输入机器学习算法，让它们在这些医学图像中寻找模式，试图对癌症扫描图像的样子形成准确的理解。


    然后，利用通过所有这些训练生成的模型，我们就能将其应用于一份不属于训练数据的新扫描结果，并生成患者是否患癌的概率。


    最后，**深度学习**是一种特定的工具或方法。它与你可能熟悉的另一个术语有关，即**人工神经网络**。深度学习是机器学习的一个子集，它使用的算法灵感来源于大脑的结构和功能。


    机器学习中神经网络的概念并不新鲜，但“深度学习”这个术语是最近才出现的。


    本质上，这种方法允许训练大型神经网络，旨在推动机器学习和人工智能领域的革命性进步。


    深度学习在过去几年中蓬勃发展，主要得益于计算能力的提升以及我们现在收集的数据量。


    与其他机器学习算法相比，深度学习算法的性能会随着我们输入数据量的增加而持续提升，这使得它们在其它算法达到瓶颈时更具可扩展性。


    在 Andrew Ng 于 2015 年 ExtractConf 上题为“数据科学家应该了解的深度学习知识”的演讲幻灯片中可以找到这种关系的体现。


    ![../images/496132_1_En_1_Chapter/496132_1_En_1_Fig2_HTML.jpg](img/496132_1_En_1_Fig2_HTML.jpg)


    图 1-2


    这张幻灯片说明了深度学习与其他机器学习算法相比的可扩展性。来源：[`​www.​slideshare.​net/​ExtractConf`](https://www.slideshare.net/ExtractConf)


    如上图所示，深度学习算法的主要区别特征在于它们能够随着数据量的增加而扩展并提升性能。


    “深度”学习通常指神经网络中使用的层数。如果现在还不能完全理解，我们将在本书稍后部分介绍层的概念。


    既然我们已经更清楚地了解了这些术语之间的区别，本书将主要关注机器学习这项技术。在探讨不同技术时，我们会稍微涉足深度学习，但也会触及该技术的更广泛方面。


    我们已经定义了那些有时被互换使用、用来描述计算机展现智能的不同术语，但其他重要的术语如“神经网络”、“算法”和“模型”呢？


    我们可能会在本书中多次提到它们，所以接下来用几段话来定义它们。


    我们从**算法**开始，因为这是你可能最熟悉的一个，它已经在传统编程中使用了。


    算法可以定义为一组规则或指令，用于解决特定问题或执行计算。


    在软件工程中，你可能听说过或使用过的算法示例包括快速排序算法、迪杰斯特拉算法、二分查找等。每个算法都是为了解决特定问题而创建的。


    对于机器学习算法而言，它们解决不同类型的问题，但概念是相同的；每个算法，无论是支持向量机（SVM）还是长短期记忆网络（LSTM）算法，都只是一个解决特定问题的数学函数。


    **神经网络**是一组旨在模仿大脑工作方式的深度学习算法。


    就像大脑由巨大的互联神经元网络组成一样，神经网络由称为人工神经元的互联节点层组成。


    这些网络的可视化表示可能如下图所示。


    ![../images/496132_1_En_1_Chapter/496132_1_En_1_Fig3_HTML.jpg](img/496132_1_En_1_Fig3_HTML.jpg)


    图 1-3


    此图展示了神经网络中的不同层


    在神经网络中，通常有三个主要部分：一个**输入层**，代表你想要为其生成预测的输入数据（例如，你想要应用目标检测的图像，你想要获取情感倾向的文本等）；一定数量的**隐藏层**；以及一个代表你预测结果的**输出层**。


    这是对神经网络工作原理的非常高级的解释，但需要理解的最重要部分是，它们由大量互联节点组成，这些节点按层组织，在训练过程中会根据前一层神经元产生的结果而被激活或不激活，类似于大脑中不同的神经元在接收到特定输入时会触发。


    最后是**模型**。在机器学习中，模型代表一次训练过程的输出。当训练过程进行时，算法正在“学习”从数据中发现的模式中得出结论；一旦训练步骤完成，输出就是一个模型。


    模型是数学函数，可以将新的输入作为参数，并产生预测作为输出。

    '
- fmt: '例如，图像分类模型已经通过数千张带标签的图像进行训练，以识别数据中的模式并预测某些实体（如猫、狗、汽车、人等）的存在。当在新应用中使用图像分类模型时，你可以向它输入一张可能不属于训练数据集的新图像，模型会根据训练过程中的学习成果，对这张它从未“见过”的图像中的内容生成预测。


    在训练过程结束时，你通常会使用不属于训练数据集的新输入来测试模型，以检验所生成预测的有效性。


    现在我们已经定义了一些在深入机器学习时会遇到的重要术语，我认为有必要快速了解一下机器学习**不是**什么。


    希望前几段内容已经更清楚地说明，机器学习无法在没有预先收集数据的情况下生成预测。


    就像我们人类无法识别从未接触过的新物体或实体一样，算法也需要在获得某种信息之后，才能识别新的输入。


    例如，我第一次听说3D打印机时，很难想象它是什么样子。当我真正看到并操作了一台3D打印机后，我才理解了它是什么，并且能够识别出未来的同类物体。


    大脑处理这个过程非常快，但算法需要更多的数据进行训练，才能形成对物体是什么的理解。


    由于算法本质上是数学函数，因此对于未来人工智能发展的相关文章，我们需要持保留态度。


    尽管人工智能系统性能强大，但它们仍然需要在我们预先收集的大量数据上进行训练。因此，我认为机器学习应用的机会在于**增强**人类，而不是**取代**人类。


    医疗领域就是一个例子。我并不特别相信人工智能系统会取代医生，但我们已经看到机器学习如何帮助医生：它能够处理海量的医学图像，并在CT扫描和核磁共振成像中识别和诊断疾病，有时准确率甚至高于医疗专业人员。


    通过这种方式依赖机器学习模型，我们有望更快地诊断和帮助患者。


    同样重要的是要记住，计算机并不真正理解它们所处理信息的上下文。某些需要解决的社会问题非常复杂，可能不应该仅依靠机器学习来解决。我们将在本书末尾更详细地讨论伦理与人工智能的话题。


    ## 1.2 机器学习的类型


    使用机器学习解决的问题通常属于以下三大类别之一：监督学习、无监督学习和强化学习。


    你可能还听说过半监督学习，但本书不会涉及它。


    了解你试图解决的问题属于哪种类型非常重要，因为它将决定你要使用哪些算法、如何准备数据以及会得到什么样的输出。


    首先，让我们从最流行的一种开始：**监督学习**。


    ### 1.2.1 监督学习


    监督学习是利用**特征**和**标签**在数据中发现模式的能力。


    这里我们引入了两个与数据相关的新术语，在继续之前需要先定义它们。


    在使用数据集时，**特征**代表每个条目的特征，而**标签**是你对这些条目的定义方式。让我们用一个例子来实践一下。


    假设你想卖掉你的房子，但不确定什么价格在市场上最具竞争力，而你手头有一个大型数据集，包含你所在城市所有房屋及其价格的信息。


    在这种情况下，**特征**就是每栋房子的详细信息（卧室数量、浴室数量、楼层数、房屋类型、是否有阳台、花园等），而**标签**就是它们的价格。


    它可能看起来像下面这样。


    表1-1


    此表展示了一个带标签数据集的示例


    | 价格 | 卧室数量 | 浴室数量 | 楼层数 | 阳台 | 花园 |

    | --- | --- | --- | --- | --- | --- |

    | **$1,500,000** | 3 | 2 | 2 | 无 | 有 |

    | **$500,000** | 1 | 1 | 1 | 有 | 无 |

    | **$750,000** | 1 | 1 | 1 | 无 | 有 |

    | **$1,700,000** | 4 | 2 | 2 | 无 | 有 |

    | **$700,000** | 2 | 1 | 1 | 无 | 无 |

    | **$850,000** | 2 | 1 | 1 | 有 | 有 |

    | **$525,000** | 1 | 1 | 1 | 无 | 无 |

    | **$2,125,000** | 5 | 3 | 3 | 有 | 有 |

    | **$645,000** | 1 | 1 | 1 | 有 | 有 |


    真实的数据集会有更多的条目，并且会收集更多的特征，但这只是一个用来解释特征和标签概念的示例。


    利用这些带标签的数据，我们可以使用机器学习来预测你的房子应该以什么价格投放市场。


    例如，根据上述数据，如果你的房子有1间卧室、1间浴室、没有阳台但有花园，那么它的价格会更接近75万美元，而不是100万美元。


    在这个快速示例中，我们可以通过查看数据手动完成，但在实际情况下，数据量会大得多，使用机器学习能够比人类更快地完成计算。


    监督学习问题的其他示例包括：预测一封电子邮件是否为垃圾邮件、根据历史比赛数据预测一支运动队获胜的概率、预测保险索赔欺诈的概率。


    总之，监督学习是基于**带标签的数据**进行预测。'
  raw: 'For example, image classification models have been trained with thousands
    of labelled images to recognize patterns in the data and predict the presence
    of certain entities (e.g., cats, dogs, cars, people, etc.). When using an image
    classification model in a new application, you would be able to feed it a new
    image that might not have been part of the training dataset, and have it generate
    a prediction of what might be in this image it has never “seen” before based on
    the learnings from the training process.


    At the end of the training process, you generally test your model with new input
    that was not part of the training dataset to test the validity of the prediction
    generated.


    Now that we’ve defined a few of the important terms you’ll come across when diving
    into machine learning, I think it is important to go quickly over what machine
    learning **is not**.


    Hopefully, the last few paragraphs made it more clear that machine learning is
    not able to generate predictions without being fed some pregathered data.


    The same way we, as humans, cannot recognize a new object or entity we’ve never
    been exposed to, an algorithm also needs to be given some kind of information
    before being able to identify a new input.


    For example, the first time I heard about 3D printers, I was struggling to be
    able to visualize what it was. When I finally saw and interacted with one, I then
    had an understanding of what the object was and was able to recognize future ones.


    The brain does this very fast, but algorithms need a lot more data to be trained
    with before being able to develop an understanding of what objects are.


    Because algorithms are basically mathematical functions, it is important to take
    with a grain of salt what you can read about the evolution of AI in the future.


    As performant as it can be, AI systems still need to be trained on a lot of data
    we have to previously gather. As a result, I believe the opportunity of machine
    learning applications resides in **augmenting** humans rather than **replacing**
    them.


    An example of that would be in the field of healthcare. I don’t particularly believe
    that AI systems will replace doctors, but we’re already seeing how machine learning
    helps them by being able to process a massive amount of medical images and identify
    and diagnose diseases in CT scans and MRIs, sometimes with higher accuracy than
    healthcare professionals.


    By relying on machine learning models this way, we can hope to diagnose and help
    people faster.


    It is also important to remember that computers don’t have a real understanding
    of the context of the information they are working with. Certain problems we need
    to solve are very complex from a societal point of view and should probably not
    be solved using machine learning only. We will cover a bit more about the topic
    of ethics and AI toward the end of this book.


    ## 1.2 Types of machine learning


    Problems solved using machine learning usually fall into one of the three main
    categories: supervised learning, unsupervised learning, and reinforcement learning.


    You might also hear about semi-supervised learning, but this book is not going
    to cover it.


    Knowing which type of problem you are trying to solve is important because it
    will determine which algorithms you’ll want to use, how you will prepare your
    data, and what kind of output you will get.


    First of all, let’s start with the most popular one, **supervised learning**.


    ### 1.2.1 Supervised learning


    Supervised learning is the ability to find patterns in data using both **features**
    and **labels**.


    Here, we just introduced two new data-related terms we need to define before we
    keep going.


    When using a dataset, **features** represent the characteristics of each entry
    and **labels** are how you would define these entries. Let’s use an example to
    put this in practice.


    Let’s say you want to sell your house but are not sure about what price would
    be the most competitive on the market, but you have access to a large dataset
    containing information about all the houses and their price, in the city you live
    in.


    In this case, the **features** would be details about each house (number of bedrooms,
    bathrooms, floors, type of house, does it have a balcony, garden, etc.), and the
    **labels** would be their price.


    It could look something like this.


    Table 1-1


    This table represents an example of a labelled dataset


    | Price | Number of bedrooms | Number of bathrooms | Number of floors | Balcony
    | Garden |

    | --- | --- | --- | --- | --- | --- |

    | **$1,500,000** | 3 | 2 | 2 | No | Yes |

    | **$500,000** | 1 | 1 | 1 | Yes | No |

    | **$750,000** | 1 | 1 | 1 | No | Yes |

    | **$1,700,000** | 4 | 2 | 2 | No | Yes |

    | **$700,000** | 2 | 1 | 1 | No | No |

    | **$850,000** | 2 | 1 | 1 | Yes | Yes |

    | **$525,000** | 1 | 1 | 1 | No | No |

    | **$2,125,000** | 5 | 3 | 3 | Yes | Yes |

    | **$645,000** | 1 | 1 | 1 | Yes | Yes |


    A real dataset would have many more entries and more features would be gathered,
    but this is only an example to illustrate the concept of features and labels.


    Using this labelled data, we can use machine learning to predict the price at
    which your house should be put on the market for.


    For example, based on the preceding data, if your house had 1 bedroom, 1 bathroom,
    no balcony but a garden, its price would be closer to about $750,000 than $1,000,000.


    In this quick example, we can do it manually by looking at the data, but in a
    real-life situation, the amount of data would be much larger, and using machine
    learning would be able to do this calculation much faster than humans.


    Some other examples of supervised learning problems include predicting if an email
    is spam or not, predicting the probability of a sports team winning based on previous
    game data, predicting the probability of an insurance claim being fraudulent.


    In summary, supervised learning is the creation of predictions based on **labelled
    data** .'
