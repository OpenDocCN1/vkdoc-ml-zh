    ### 5.3.3 Setting up web sockets


    To set up web sockets, we are going to use `socket.io`.


    So far, in all previous examples, we only worked with HTML and JavaScript files
    without any back end.


    If you have never written any Node.js before, you will need to install it as well
    as `npm` or `yarn` to be able to install packages.


    Once you have these two tools set up, at the root of your project folder, in your
    terminal, write `npm init` to generate a `package.json` file that will contain
    some details about the project.


    Once your `package.json` file is generated, in your terminal, write `npm install
    socket.io` to install the package.


    Once this is done, add the following script tag in your HTML file.


    ```

