    These arrays represent the frequencies that make up the sounds recorded by the
    computer’s microphone. The default sample rate is 44,100Hz, which means we get
    about 44,000 samples of data per second.


    In the format shown earlier (arrays of integers), finding patterns to recognize
    some type of activity seems pretty difficult. We wouldn’t really be able to identify
    the difference between speaking, laughing, music playing, and so on.


    To help make sense of this raw frequency data, we can turn it into visualizations.'
  trans: '

    ### 5.1.2 访问音频数据


    在 JavaScript 中，允许开发者访问计算机麦克风数据的 Web API 是 **Web Audio API**。


    如果你从未使用过此 API，完全没关系；我们将介绍你需要设置好一切的主要步骤。


    首先，我们需要访问全局 `window` 对象上的 `AudioContext` 接口，并确保能够通过 `getUserMedia` 获取访问音频和视频输入设备的权限。


    ```

    window.AudioContext = window.AudioContext || window.webkitAudioContext;

    navigator.getUserMedia = navigator.getUserMedia || navigator.webkitGetUserMedia;

    清单 5-1

    在 JavaScript 中设置使用 Web Audio API

    ```


    这段代码示例考虑了跨浏览器兼容性。


    然后，要开始监听来自麦克风的输入，我们需要等待用户在页面上的操作，例如点击。


    一旦用户与网页交互，我们就可以实例化一个音频上下文，允许访问计算机的音频输入设备，并使用一些 Web Audio API 内置方法来创建音源和分析器，并将两者连接起来以开始获取数据。


    ```

    document.body.onclick = async () => {

    const audioctx = new window.AudioContext();

    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

    const source = audioctx.createMediaStreamSource(stream);

    analyser = audioctx.createAnalyser();

    analyser.smoothingTimeConstant = 0;

    source.connect(analyser);

    analyser.fftSize = 1024;

    getAudioData();

    };

    清单 5-2

    在点击时设置音频上下文的 JavaScript 代码示例

    ```


    在上面的代码示例中，我们使用 `navigator.mediaDevices.getUserMedia` 来获取麦克风的访问权限。如果你之前构建过使用音频或视频输入设备的应用程序，你可能对编写
    `navigator.getUserMedia()` 很熟悉；然而，这已被弃用，你现在应该使用 `navigator.mediaDevices.getUserMedia()`。


    使用旧方式编写仍然有效，但不推荐，因为它可能在未来几年内不再被支持。


    基本设置完成后，`getAudioData` 函数会过滤来自设备的原始数据，仅获取频率数据。


    ```

    const getAudioData = () => {

    const freqdata = new Uint8Array(analyser.frequencyBinCount);

    analyser.getByteFrequencyData(freqdata);

    console.log(freqdata);

    requestAnimationFrame(getAudioData);

    };

    清单 5-3

    过滤原始数据以获取我们将使用的频率数据的函数

    ```


    我们还调用了 `requestAnimationFrame` 来持续调用此函数，并用实时数据更新我们记录的数据。


    总而言之，你可以在不到 25 行 JavaScript 代码中访问来自麦克风的实时数据！


    ```

    window.AudioContext = window.AudioContext || window.webkitAudioContext;

    navigator.getUserMedia = navigator.getUserMedia || navigator.webkitGetUserMedia;

    let analyser;

    document.body.onclick = async () => {

    const audioctx = new window.AudioContext();

    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

    const source = audioctx.createMediaStreamSource(stream);

    analyser = audioctx.createAnalyser();

    analyser.smoothingTimeConstant = 0;

    source.connect(analyser);

    analyser.fftSize = 1024;

    getAudioData();

    };

    const getAudioData = () => {

    const freqdata = new Uint8Array(analyser.frequencyBinCount);

    analyser.getByteFrequencyData(freqdata);

    console.log(freqdata);

    requestAnimationFrame(getAudioData);

    };

    清单 5-4

    在 JavaScript 中从麦克风获取输入数据的完整代码示例

    ```


    这段代码的输出是一个我们记录在浏览器控制台中的原始数据数组。


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig3_HTML.jpg](img/496132_1_En_5_Fig3_HTML.jpg)


    图 5-3


    上述代码示例返回的数据截图


    这些数组代表了构成计算机麦克风所录制声音的频率。默认采样率为 44,100Hz，这意味着我们每秒获得约 44,000 个数据样本。


    在之前展示的格式（整数数组）中，寻找模式以识别某种活动类型似乎相当困难。我们实际上无法区分说话、大笑、播放音乐等之间的差异。


    为了帮助理解这些原始频率数据，我们可以将其转化为可视化内容。

    '
- fmt: '### 5.1.3 Visualizing audio data


    There are different ways to visualize sound. A couple of ways you might be familiar
    with are waveforms or frequency charts.


    Waveform visualizers represent the displacement of sound waves over time.


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig4_HTML.jpg](images/496132_1_En_5_Chapter/496132_1_En_5_Fig4_HTML.jpg)


    Figure 5-4


    Illustration of a waveform visualization. Source: [*https://css-tricks.com/making-an-audio-waveform-visualizer-with-vanilla-javascript/*](https://css-tricks.com/making-an-audio-waveform-visualizer-with-vanilla-javascript/)


    On the x axis (the horizontal one) is the unit of time and on the y axis (vertical
    one) is the frequencies. Sound happens over a certain period of time and is made
    of multiple frequencies.


    This way of visualizing sound is a bit too minimal to be able to identify patterns.
    As you can see in the illustration earlier, all frequencies that make up a sound
    are reduced to a single line.


    Frequency charts are visualizations that represent a measure of how many times
    a waveform repeats in a given amount of time.


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig5_HTML.jpg](images/496132_1_En_5_Chapter/496132_1_En_5_Fig5_HTML.jpg)


    Figure 5-5


    Illustration of a frequency chart visualization


    You might be familiar with this type of audio visualization as they are probably
    the most common one.


    This way of visualizing can maybe give you some insights about a beat as it represents
    repetitions or maybe about how loud the sound is as the y axis shows the volume,
    but that’s about it.


    This visualization does not give us enough information to be able to recognize
    and classify sounds we are visualizing.


    Another type of visualization that is much more helpful is called a spectrogram.


    A spectrogram is like a picture of a sound. It shows the frequencies that make
    up the sound from low to high and how they change over time. It is a visual representation
    of the spectrum of frequencies of a signal, a bit like a heat map of sound.


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig6_HTML.jpg](images/496132_1_En_5_Chapter/496132_1_En_5_Fig6_HTML.jpg)


    Figure 5-6


    Illustration of a spectrogram


    On the y axis is the spectrum of frequencies and, on the x axis, the amount of
    time. The axes seem similar to the two other type of visualizations we mentioned
    previously, but instead of representing all frequencies in a single line, we represent
    the whole spectrum.


    In a spectrogram, a third axis can be helpful too, the amplitude. The amplitude
    of a sound can be described as the volume. The brighter the color, the louder
    the sound.


    Visualizing sounds as spectrograms is much more helpful in finding patterns that
    would help us recognize and classify sounds.


    For example, next is a screenshot of the output of a spectrogram running while
    I am speaking.


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig7_HTML.jpg](images/496132_1_En_5_Chapter/496132_1_En_5_Fig7_HTML.jpg)


    Figure 5-7


    Illustration of a spectrogram taken while speaking


    By itself, this might not help you understand why spectrograms are more helpful
    visualizations. The following is another screenshot of a spectrogram taken while
    I was clapping my hands three times.


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig8_HTML.jpg](images/496132_1_En_5_Chapter/496132_1_En_5_Fig8_HTML.jpg)


    Figure 5-8


    Illustration of a spectrogram taken while clapping my hands three times


    Hopefully, it starts to make more sense! If you compare both spectrograms, you
    can clearly distinguish between the two activities: speaking and clapping my hands.


    If you wanted, you could try to visualize more sounds like coughing, your phone
    ringing, toilets flushing, and so on.


    Overall, the main takeaway is that spectrograms help us see the signature of various
    sounds more clearly and distinguish them between different activities.


    If we can make this differentiation by looking at a screenshot of a spectrogram,
    we can hope that using this data with a machine learning algorithm will also work
    in finding patterns and classify this sounds to build an activity classifier.


    A broader example of using spectrograms for activity classification is from a
    research paper published by the Carnegie Mellon University in the United States.
    In their paper titled “Ubicoustics: Plug-and-Play Acoustic Activity Recognition,”
    they created spectrograms for various activities from using a chainsaw, to a vehicle
    driving nearby.


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig9_HTML.jpg](images/496132_1_En_5_Chapter/496132_1_En_5_Fig9_HTML.jpg)


    Figure 5-9


    Spectrograms collected from the research by the Carnegie Mellon University. Source:
    [*http://www.gierad.com/projects/ubicoustics/*](http://www.gierad.com/projects/ubicoustics/)


    So, before we dive into using sound with machine learning, let’s go through how
    we can turn the live data from the microphone that we logged in the console using
    the Web Audio API to a spectrogram.'
