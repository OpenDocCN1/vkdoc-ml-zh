    coughing) might have seemed simple, the way this technology is currently being
    used shows how interesting it can be.


    #### Health


    In July 2020, Apple announced the release of a new version of their watchOS that
    included an application triggering a countdown when the user washes their hands.
    Related to the advice from public health officials around avoiding the spread
    of COVID-19, this application uses the watch’s microphone to detect the sound
