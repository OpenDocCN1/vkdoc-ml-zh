    \ feedback on the product you are building.\n\nThis feedback is often stored as\
    \ a spreadsheet of data, stored in Google Sheets, databases, or other platform.\n\
    \nThe company’s employees then usually go through all this data to understand\
    \ customers’ needs, complaints, and so on. These tasks can take a lot of time;\
    \ however, sentiment analysis could be used to apply a first filter to the data\
    \ and group them by feedback that seems positive, negative, and neutral.\n\nPeople\
    \ should still read the data manually to get a better understanding of customers’\
    \ thoughts, but it could give an idea of the overall sentiment around the product.\n\
    \nAnother type of survey where this approach could be useful is in internal company\
    \ surveys.\n\nWhen the leadership of a company wants to know how employees are\
    \ feeling about their work, the culture, or their overall experience, a survey\
    \ is shared to collect feedback.\n\nSome surveys are rather simple with mainly\
    \ check boxes where people answer questions or statements by selecting “Strongly\
    \ agree”, “Agree”, “Disagree”, or “Strongly disagree”; however, some other surveys\
    \ give employees an opportunity to express themselves further, in their own words.\n\
    \nThe latter would be a good use case for sentiment analysis. After collecting\
    \ feedback from everyone, all the data could be fed to a sentiment analysis model\
    \ to determine the overall feeling of employees toward the company.\n\nSimilarly\
    \ to the previous example of product surveys, the feedback should still be read\
    \ and analyzed manually, but getting a first insight over the data may influence\
    \ the first decisions. If the prediction comes back as overly negative, it is\
    \ probably important to act on the feedback as soon as possible to avoid getting\
    \ to the point where employees decide to leave the company.\n\nFinally, another\
    \ scenario where sentiment analysis could be used for automation is in helping\
    \ a support team triage tickets based on the toxicity of customer’s complaints.\
    \ This approach could also be used by developer experience teams that usually\
    \ have to keep track of what is said about a company on social media.\n\nUsing\
    \ a Toxicity Classifier or sentiment analysis classifier to run an initial check\
    \ on the data can help prioritize which customers’ feedback should be dealt with,\
    \ with more urgency.\n\nAll in all, using sentiment analysis as an automation\
    \ tool does not replace entirely the work that should be done by people, it only\
    \ provides a help to gain some early insights and guide decisions.\n\nIn addition\
    \ to sentiment analysis, other types of techniques are also available to gain\
    \ a deeper understanding of text data.\n\n## 4.5 Other types of text classification\
    \ tools\n\nEven though sentiment analysis provides some useful information about\
    \ data collected, it can also be paired with other types of text classification\
    \ tools to generate better predictions and extract more meaningful insights.\n\
    \n### 4.5.1 Intent analysis\n\nIntent analysis, also called intent classification,\
    \ goes a step further by trying to analyze and understand the user’s **intention**\
    \ behind a message and identify whether it relates to an opinion, news, marketing,\
    \ query, complaint, suggestion, and so on. It also helps categorize customers’\
    \ intents by topics such as Purchase, Downgrade, Demo request, and so on.\n\n\
    To do this, a model needs to be trained with existing data collected from users\
    \ and labelled with the different intents we would like to use for future predictions.\n\
    \nIt works a bit similarly to the Toxicity Classifier I talked about previously\
    \ in this chapter, but instead of using labels such as “severe_toxicity” or “threat”,\
    \ the model would be trained with labels such as “Purchase”, “Need for information”,\
    \ “Cancellation”, and so on.\n\nFeeding this labelled data from real customers’\
    \ comments, requests, and complaints to an algorithm would allow it to find patterns\
    \ of vocabulary used, semantics, arrangements of words in a sentence, used by\
    \ people when expressing similar intents.\n\n### 4.5.2 Named Entity Recognition\n\
    \nNamed entity recognition (NER) , also known as entity identification, entity\
    \ chunking, or entity extraction, extracts entities such as people, locations,\
    \ organizations, and dates from text.\n\nFor example, if we take the following\
    \ sample paragraph from the Rosa Parks’ Wikipedia page:\n\n> *Rosa Louise McCauley\
    \ Parks (February 4, 1913 –* October 24, 2005*) was an American* [activist](https://en.wikipedia.org/wiki/Activism)\
    \ *in the* [civil rights movement](https://en.wikipedia.org/wiki/Civil_rights_movement)\
    \ *best known for her pivotal role in the* [Montgomery bus boycott](https://en.wikipedia.org/wiki/Montgomery_bus_boycott)*.\
    \ The* [United States Congress](https://en.wikipedia.org/wiki/United_States_Congress)\
    \ *has called her \"the first lady of civil rights\" and \"the mother of the freedom\
    \ movement.”*\n> \n> —Quote source: [`https://en.wikipedia.org/wiki/Rosa_Parks`](https://en.wikipedia.org/wiki/Rosa_Parks)\n\
    \nNamed entity recognition would allow us to extract and classify the following\
    \ terms:\n\n*   **Person**: Rosa Louise McCauley Parks\n\n*   **Location**: Montgomery,\
    \ United States\n\n*   **Date**: February 4, 1913, October 24, 2005\n\n*   **Organization**:\
    \ United States Congress\n\nNER models have a wide range of applications including\
    \ automatic summarizing of resumes to aim at simplifying the recruitment process\
    \ by automatically scanning a huge amount of documents and shortlist candidates\
    \ based on terms found in them.\n\n### 4.5.3 Text summarization\n\nAs the name\
    \ indicates, text summarization is a technique usually used to create an accurate\
    \ summary that captures the main pieces of information in a longer text.\n\nThese\
    \ summaries allow people to navigate content more effectively by reducing reading\
    \ time and helping in the selection process of research documents.\n\nThe goal\
    \ of this technique is not only to capture the main words of a document and generate\
    \ a shorter sentence, but also to create something that reads fluently as a new\
    \ stand-alone piece of content. It should result in a summary that is as good\
    \ as those a human would write.\n\nExamples of day-to-day text summarization we\
    \ are already familiar with include\n\n*   News headlines\n\n*   Notes from meetings\n\
    \n*   Synopses\n\n*   Biographies\n\nFor automatic text summarization using machine\
    \ learning, there exist two approaches: **extractive** and **abstractive**.\n\n\
    **Extractive text summarization** is the process of selecting phrases in a source\
    \ document to generate a summary. It involves ranking the relevance of phrases\
    \ in the source and only selecting the ones that are the most relevant to the\
    \ meaning of the document.\n\n**Abstractive text summarization** involves generating\
    \ brand-new phrases that convey the most critical information from the source\
    \ document. It uses advanced natural language processing techniques to interpret\
    \ and examine the text and produce shorter sentences in a new way.\n\n### 4.5.4\
    \ Question Answering with TensorFlow.js\n\nQuestion Answering is a discipline\
    \ within the field of natural language processing that is concerned with building\
    \ systems that automatically answer questions posed by humans in a natural language.\n\
    \nA machine learning model takes a passage and a question as input and is able\
    \ to return a segment of the passage that is likely to answer the question asked,\
    \ as output.\n\nIn the next few pages, we are going to use the MobileBERT model,\
    \ a lightweight version of the BERT (Bidirectional Encoder Representations from\
    \ Transformers) model from Google, to build a system capable of answering questions\
    \ submitted by humans based on a set of paragraphs."
  trans: "\n### 4.4.3 自动化工具\n\n在我们的职业生涯中，有些任务仍然需要手动完成，而这些任务本可以使用情感分析实现自动化，从而腾出时间专注于更有趣的挑战。一个例子是关于客户对产品的反馈。\n\
    \n如果你在一家产品公司工作，你可能熟悉向客户征求对你正在构建的产品的反馈。\n\n这些反馈通常以电子表格的形式存储，保存在 Google Sheets、数据库或其他平台中。\n\
    \n然后，公司的员工通常会浏览所有这些数据，以了解客户的需求、投诉等。这些任务可能会花费大量时间；然而，情感分析可用于对数据进行初步筛选，并根据反馈是正面、负面还是中性进行分组。\n\
    \n人们仍然需要手动阅读数据，以更好地理解客户的想法，但这可以让你对产品的整体情感倾向有一个大致了解。\n\n另一种可以使用这种方法的调查类型是公司内部调查。\n\
    \n当公司领导层想了解员工对工作、文化或整体体验的感受时，会分享一份调查问卷来收集反馈。\n\n有些调查相当简单，主要是复选框，人们通过选择“非常同意”、“同意”、“不同意”或“非常不同意”来回答问题或陈述；然而，另一些调查则给员工提供了用自己的话进一步表达的机会。\n\
    \n后者将是情感分析的一个很好的用例。在收集了所有人的反馈后，所有数据都可以输入情感分析模型，以确定员工对公司的整体感受。\n\n与之前的产品调查示例类似，反馈仍然需要手动阅读和分析，但对数据进行初步洞察可能会影响最初的决策。如果预测结果过于负面，那么尽快根据反馈采取行动可能很重要，以避免发展到员工决定离开公司的地步。\n\
    \n最后，情感分析可用于自动化的另一个场景是，帮助支持团队根据客户投诉的毒性程度对工单进行分类。这种方法也可以用于开发者体验团队，他们通常需要跟踪社交媒体上关于公司的言论。\n\
    \n使用毒性分类器或情感分析分类器对数据进行初步检查，有助于确定哪些客户的反馈需要更紧急地处理。\n\n总而言之，将情感分析用作自动化工具并不能完全取代人们应该做的工作，它只是提供帮助，以便获得一些早期洞察并指导决策。\n\
    \n除了情感分析之外，还有其他类型的技术可用于更深入地理解文本数据。\n\n## 4.5 其他类型的文本分类工具\n\n尽管情感分析提供了关于所收集数据的一些有用信息，但它也可以与其他类型的文本分类工具结合使用，以生成更好的预测并提取更有意义的见解。\n\
    \n### 4.5.1 意图分析\n\n意图分析，也称为意图分类，更进一步，它试图分析和理解用户信息背后的**意图**，并识别其是否与意见、新闻、营销、查询、投诉、建议等相关。它还有助于按主题（如购买、降级、演示请求等）对客户意图进行分类。\n\
    \n为此，需要使用从用户那里收集的现有数据来训练模型，并用我们希望在将来预测中使用的不同意图进行标记。\n\n它的工作方式与我本章前面提到的毒性分类器有些相似，但模型不是使用“严重毒性”或“威胁”等标签进行训练，而是使用“购买”、“需要信息”、“取消”等标签进行训练。\n\
    \n将来自真实客户评论、请求和投诉的这些标记数据输入算法，将使其能够找到人们在表达类似意图时使用的词汇模式、语义以及句子中单词的排列方式。\n\n### 4.5.2\
    \ 命名实体识别\n\n命名实体识别（NER），也称为实体识别、实体分块或实体提取，从文本中提取人物、地点、组织和日期等实体。\n\n例如，如果我们从罗莎·帕克斯的维基百科页面中选取以下示例段落：\n\
    \n> *罗莎·路易丝·麦考利·帕克斯（1913 年 2 月 4 日 – 2005 年 10 月 24 日）是美国*[民权运动](https://en.wikipedia.org/wiki/Civil_rights_movement)*中的一位*[活动家](https://en.wikipedia.org/wiki/Activism)*，以其在*[蒙哥马利巴士抵制运动](https://en.wikipedia.org/wiki/Montgomery_bus_boycott)*中的关键作用而闻名。*[美国国会](https://en.wikipedia.org/wiki/United_States_Congress)*称她为“民权第一夫人”和“自由运动之母”。*\n\
    > \n> ——引用来源：[`https://en.wikipedia.org/wiki/Rosa_Parks`](https://en.wikipedia.org/wiki/Rosa_Parks)\n\
    \n命名实体识别将使我们能够提取并分类以下术语：\n\n*   **人物**：罗莎·路易丝·麦考利·帕克斯\n\n*   **地点**：蒙哥马利，美国\n\n\
    *   **日期**：1913 年 2 月 4 日，2005 年 10 月 24 日\n\n*   **组织**：美国国会\n\nNER 模型具有广泛的应用，包括自动总结简历，旨在通过自动扫描大量文档并根据其中找到的术语筛选候选人，从而简化招聘流程。\n\
    \n### 4.5.3 文本摘要\n\n顾名思义，文本摘要是一种通常用于创建准确摘要的技术，该摘要能捕捉较长文本中的主要信息。\n\n这些摘要通过减少阅读时间并帮助筛选研究文档，使人们能够更有效地浏览内容。\n\
    \n该技术的目的不仅仅是捕捉文档中的主要词语并生成较短的句子，而是要创建一种读起来流畅、可作为独立新内容的东西。它应该产生一个与人类撰写的摘要同样出色的摘要。\n\
    \n我们日常熟悉的文本摘要示例包括：\n\n*   新闻标题\n\n*   会议记录\n\n*   剧情简介\n\n*   传记\n\n对于使用机器学习的自动文本摘要，存在两种方法：**抽取式**和**生成式**。\n\
    \n**抽取式文本摘要**是从源文档中选择短语以生成摘要的过程。它涉及对源文档中短语的相关性进行排序，并仅选择那些与文档含义最相关的短语。\n\n**生成式文本摘要**涉及生成全新的短语，以传达源文档中最关键的信息。它使用先进的自然语言处理技术来解释和检查文本，并以新的方式生成更短的句子。\n\
    \n### 4.5.4 使用 TensorFlow.js 进行问答\n\n问答是自然语言处理领域中的一个学科，涉及构建能够自动回答人类用自然语言提出的问题的系统。\n\
    \n机器学习模型将一段文本和一个问题作为输入，并能够返回该文本中可能回答所提问题的一个片段作为输出。\n\n在接下来的几页中，我们将使用 MobileBERT\
    \ 模型（来自 Google 的 BERT（来自 Transformer 的双向编码器表示）模型的轻量级版本）来构建一个系统，该系统能够基于一组段落回答人类提交的问题。\n"
- fmt: '#### Importing the model


    To set up our project, we need to start by importing TensorFlow.js and the model.


    ```

    const qna = require(''@tensorflow-models/qna'');

    ```


    *Listing 4-20: Importing TensorFlow.js and the QNA model as package in a JavaScript
    file*


    ```

    Or

    ```


    *Listing 4-19: Importing TensorFlow.js and the QNA model in an HTML file*


    If you decide to use it as an NPM module, you do not need to import the `@tensorflow/tfjs`
    library; however, you will need to make sure you have installed the peer dependencies
    for `tfjs-core` and `tfjs-converter`.


    #### Loading the model


    Once the model is imported, we need to load it in our application. Two options
    are available to do this.


    First, you can load it without providing a config object.


    ```

    const model = await qna.load();

    ```


    *Listing 4-21: Default way to load the model*


    This way of loading the model is the one you should probably use if you want to
    use Google’s Question Answering model hosted on the Google Cloud Platform (GCP)
    provider.


    If you live in an area or country that does not have access to the model hosted
    on GCP, you can provide a configuration object that will contain the custom URL
    of the model hosted on your own servers.


    ```

    const config = { modelUrl: "https://yourown-server/qna/model.json" };

    const customModel = await qna.load(config);

    ```


    *Listing 4-22: Loading the model using custom configurations*


    These two ways of loading the model will return a model object that we can call
    methods on to predict our answers.


    #### Predictions


    Generating answers is done using the `findAnswers()` method on the model object.
    This method accepts two arguments: the first one is the question the user would
    like to ask, and the second is the associated passage that content needs to be
    extracted from.


    ```

    const answers = await model.findAnswers(question, passage);

    ```


    *Listing 4-23: Generating predictions*


    **These two parameters need to be strings.**


    The `answers` variable that will hold the results of the predictions will be an
    array of elements with the following shape:


    ```

    [

    {

    text: "Angela Davis",

    startIndex: 1143,

    endIndex: 1156,

    score: 0.8380282521247864

    }

    ]

    ```


    The `text` property represents the answer to the question the person would have
    asked. The `score` is the confidence level for the prediction. The higher it is,
    the more confident the model is that this answer is correct. The `startIndex`
    and `endIndex` represent the indices of the starting and ending character where
    the expression was found in the passage.


    #### Complete example


    Let’s put all these code samples together, reuse one of our examples from the
    previous sections, and ask questions about Rosa Parks.


    ```

    const init = async () => {

    const passage = "Rosa Louise McCauley Parks (February 4, 1913 – October 24, 2005)
    was an American activist in the civil rights

    movement best known for her pivotal role in the Montgomery bus boycott. The United
    States Congress has called her ''the first lady of civil rights'' and ''the mother
    of the freedom movement''";

    const question = "When was Rosa born?";

    const model = await qna.load();

    const answers = await model.findAnswers(question, passage);

    console.log(answers);

    };

    init();

    ```


    *Listing 4-25: JavaScript code in the `index.js` file*


    ```

    Question Answering

    ```


    *Listing 4-24: HTML code*


    This code will log the following output in your browser’s console.


    ![../images/496132_1_En_4_Chapter/496132_1_En_4_Fig8_HTML.jpg](images/496132_1_En_4_Chapter/496132_1_En_4_Fig8_HTML.jpg)


    *Figure 4-8: Prediction output in the browser’s console to the question “When
    was Rosa born?”*


    As we can see in the preceding screenshot, the answers come back as an array of
    five elements. The one with the highest score is “February 4, 1913”, which is
    the correct answer to the question “When was Rosa born?”!


    Also, if we observe the subsequent predictions, they are all somewhat correct
    as they contain either a part of the birth date or the birth and death dates.


    We could think maybe we just got lucky on that one, so let’s try another question,
    for example: “Who was Rosa Parks?”.


    When asking this question, we get the following answers.


    ![../images/496132_1_En_4_Chapter/496132_1_En_4_Fig9_HTML.jpg](images/496132_1_En_4_Chapter/496132_1_En_4_Fig9_HTML.jpg)


    *Figure 4-9: Prediction output in the browser’s console to the question “Who was
    Rosa Parks?”*


    This time, our answers array contains only two objects. However, these predictions
    are correct!


    An interesting aspect of this is that our question mentioned “Rosa Parks”, whereas
    our passage mentioned her full name “Rosa Louise McCauley Parks”, and the model
    was still able to understand who our question was about.


    This is pretty impressive and has huge potential, but, as with every machine learning
    model, it has its limits.


    For example, when changing the question to “How was Rosa Parks called?”, expecting
    the answers “the first lady of civil rights” or “the mother of the freedom movement”,
    the predictions array came back empty, meaning the model could not find answers
    to this question in the passage.


    However, when modifying the question a little bit to be more precise (“What did
    the United States Congress call Rosa Parks?”), the model managed to provide the
    right answers – the first one being this.


    ![../images/496132_1_En_4_Chapter/496132_1_En_4_Fig10_HTML.jpg](images/496132_1_En_4_Chapter/496132_1_En_4_Fig10_HTML.jpg)


    *Figure 4-10: First prediction output in the browser’s console to the question
    “What did the United States Congress call Rosa Parks?”*


    Unfortunately, asking the question this way would have probably required a certain
    kind of knowledge from the user. A person unfamiliar with the details of Rosa
    Parks’ life would have most likely asked the question in a similar format to “What
    was Rosa Parks called?”, which returned no answer.


    #### Building an interactive education tool


    In the preceding code samples, we only used this model to log the results in the
    browser’s developer tools. However, let’s use this code to build an interactive
    education tool, in which users would be able to learn about historical figures,
    using Question Answering.


    For this project, to make it simpler, we’re going to store data about a few preselected
    people in our code base as JSON files. If you are not familiar with it, JSON stands
    for JavaScript Object Notation and refers to a file format for storing data.


    If you wanted to go a step further, you could try to use the MediaWiki API to
    let users request for any public figure they would want and fetch data dynamically.


    The following application is going to have information about three historical
    figures, let the user decide which one they would like to learn more about, and
    provide an input field to ask different questions to display the answer with the
    highest probability, predicted by the machine learning model.


    The final state of this project is going to contain three screens and look something
    like this.


    ![../images/496132_1_En_4_Chapter/496132_1_En_4_Fig13_HTML.jpg](images/496132_1_En_4_Chapter/496132_1_En_4_Fig13_HTML.jpg)


    *Figure 4-13: Page to ask questions and display the best answer predicted*


    ![../images/496132_1_En_4_Chapter/496132_1_En_4_Fig12_HTML.jpg](images/496132_1_En_4_Chapter/496132_1_En_4_Fig12_HTML.jpg)


    *Figure 4-12: Page to select the public figure to learn more about*


    ![../images/496132_1_En_4_Chapter/496132_1_En_4_Fig11_HTML.jpg](images/496132_1_En_4_Chapter/496132_1_En_4_Fig11_HTML.jpg)


    *Figure 4-11: Home page of the project*


    As you may have noticed, I kept the design very minimal because I want to focus
    on the functionality. The important takeaway from this project is how to create
    a quick user interface using the Question Answering model.


    Now that you have a better idea of what we are about to build, let’s dive into
    the different features and code samples.'
