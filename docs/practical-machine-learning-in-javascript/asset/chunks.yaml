  trans: '

    ### 2.1.2 访问张量中的数据


    创建张量后，你可以使用 `tf.array()` 或 `tf.data()` 获取其值。


    `tf.array()` 返回值的多维数组，而 `tf.data()` 返回扁平化后的数据。


    ```

    const tensor = tf.tensor2d([[1, 2, 3], [4, 5, 6]]);

    const array = tensor.array().then(values => console.log("array: ": values));

    // array: [ [1, 2, 3], [4, 5, 6] ]

    const data = tensor.data().then(values => console.log("data: ", values));

    // data: Float32Array [1, 2, 3, 4, 5, 6];

    清单 2-7

    访问张量中的数据

    ```


    如上述示例所示，这两个方法返回一个 promise。


    在 JavaScript 中，promise 是一个值的代理，该值在 promise 被调用时尚未创建。Promise 表示尚未完成的操作，因此它们与异步操作一起使用，以便在操作完成后的未来某个时间点提供值。


    不过，也提供了使用 `arraySync()` 和 `dataSync()` 的同步版本。


    ```

    const tensor = tf.tensor2d([[1, 2, 3], [4, 5, 6]]);

    const values = tensor.arraySync();

    console.log("values: ": values); // values: [ [1, 2, 3], [4, 5, 6] ]

    const data = tensor.dataSync()

    console.log("data: ", values); // data: Float32Array [1, 2, 3, 4, 5, 6];

    清单 2-8

    同步访问张量中的数据

    ```


    不建议在生产应用中使用它们，因为这会导致性能问题。


    ### 2.1.3 张量上的操作


    在上一节中，我们了解到张量是一种数据结构，允许我们以 TensorFlow.js 可以处理的方式存储数据。我们学习了如何创建、重塑张量以及访问其值。


    现在，让我们来看看一些允许我们操作张量的不同操作。


    这些操作可以按类别组织。其中一些允许你对张量进行算术运算，例如将多个张量相加；其他操作侧重于逻辑运算，例如评估一个张量是否大于另一个张量；还有一些操作提供了进行基本数学运算的方法，例如计算张量中所有元素的平方。


    完整的操作列表可在 [`https://js.tensorflow.org/api/latest/#Operations`](https://js.tensorflow.org/api/latest/%2523Operations)
    找到。


    以下是如何使用这些操作的示例。


    ```

    const tensorA = tf.tensor([1, 2, 3, 4]);

    const tensorB = tf.tensor([5, 6, 7, 8]);

    const tensor = tf.add(tensorA, tensorB); // [6, 8, 10, 12]

    // 或

    // const tensor = tensorA.add(tensorB);

    清单 2-9

    张量操作示例

    ```


    在这个示例中，我们将两个张量相加。如果你查看 tensorA 的第一个值（即 1）和 tensorB 的第一个值（即 5），1 + 5 的结果确实是 6，也就是最终张量的第一个值。


    要使用这类操作，你的张量必须具有相同的**形状**，但不一定需要相同的**秩**。


    如果你还记得前几页的内容，形状是张量每个维度中的值的数量，而秩是维度的数量。


    让我们用另一个示例来说明这一点。


    ```

    const tensorA = tf.tensor2d([[1, 2, 3, 4]]);

    const tensorB = tf.tensor([5, 6, 7, 8]);

    const tensor = tf.add(tensorA, tensorB); // [[6, 8, 10, 12],]

    清单 2-10

    张量操作示例

    ```


    在这种情况下，tensorA 现在是一个二维张量，但 tensorB 仍然是一维的。


    两者相加的结果现在是一个张量，其值与之前相同，但维度数量不同。


    然而，如果我们尝试添加具有不同形状的多个张量，将会导致错误。


    ```

    const tensorA = tf.tensor([1, 2, 3, 4]);

    const tensorB = tf.tensor([5, 6, 7]);

    const tensor = tf.add(tensorA, tensorB);

    // 错误：操作数无法与形状 3 和 4 一起广播。

    清单 2-11

    使用错误形状时生成的错误

    ```


    这个错误告诉我们，这个操作数不能与这两个张量一起使用，因为其中一个有四个元素，而另一个只有三个。


    张量是不可变的，因此这些操作不会改变原始张量，而是始终返回一个新的 `tf.Tensor`。


    ### 2.1.4 内存


    最后，在使用张量时，你需要使用 `dispose()` 或 `tf.dispose()` 显式清理内存。


    ```

    const tensor = tf.tensor([1, 2, 3, 4]);

    tensor.dispose();

    // 或

    tf.dispose(tensor);

    清单 2-12

    使用 dispose 方法

    ```


    另一种管理内存的方法是在链式操作时使用 `tf.tidy()`。


    由于张量是不可变的，每个操作的结果都是一个新张量。为了避免对你生成的所有张量调用 dispose，使用 `tf.tidy()` 允许你只保留所有操作中生成的最后一个张量，并释放所有其他张量。


    ```

    const tensorA = tf.tensor([1, 2, 3, 4]);

    const tensor = tf.tidy(() => {

    return tensorA.square().neg();

    });

    console.log(tensor.dataSync()); // [-1, -4, -9, -16]

    清单 2-13

    使用 tidy 方法

    ```


    在这个示例中，`square()` 的结果将被释放，而 `neg()` 的结果则不会，因为它返回了函数的值。


    现在我们已经介绍了 TensorFlow.js 的核心内容以及如何使用张量，接下来让我们看看该库提供的不同功能，以便更好地了解其可能性。


    ## 2.2 功能


    在本小节中，我们将探讨 TensorFlow.js 当前可用的三个主要功能。这包括使用预训练模型；进行迁移学习，即使用自定义输入数据重新训练模型；以及完全在
    JavaScript 中完成所有操作，即在浏览器中创建模型、训练模型并运行预测。


    我们将按照从最简单到最复杂的顺序介绍这些功能。

    '
- fmt: '### 2.2.1 Using a pre-trained model


    In the first chapter of this book, we defined the term “model” as a mathematical
    function that can take new parameters to make predictions based on the data it
    had been trained with.


    If this definition is still a bit confusing to you, hopefully putting it into
    context while talking about this first feature is going to make it a bit clearer.


    In machine learning, to be able to predict an outcome, we need a model. However,
    it is not necessary to have built the model yourself. It is totally fine to use
    what is called “pre-trained models.”


    The term “pre-trained” means that this model has already been trained with a certain
    type of input data and has been developed for a specific purpose.


    For example, you can find some open source pre-trained models focused on object
    detection and recognition. These models have already been fed with millions of
    images of objects, have gone through all the training process, and should now
    have a satisfying level of accuracy when predicting new entities.


    Companies or institutions creating these models make them open source so developers
    can use them in their application and have the opportunity to build machine learning
    projects much faster.


    As you can imagine, the process of gathering data, formatting it, labelling it,
    experimenting with different algorithms and parameters can take a lot of time,
    so being able to substitute this work by using a pre-trained model frees up a
    lot of time to focus on building applications.


    Pre-trained models currently available to use with `TensorFlow.js` include body
    segmentation, pose estimation, object detection, image classification, speech
    command recognition, and sentiment analysis.


    Using a pre-trained model in your application is relatively easy.


    In the following code sample, we’re going to use the `mobilenet` object detection
    model to predict an entity in a new image.


    ```

    const img = document.getElementById("img");

    const model = await mobilenet.load();

    const predictions = await model.classify(img);

    return predictions;

    ```


    *Listing 2-14* Classifying an image using the `mobilenet` model


    In a real application, this code would need to require the `TensorFlow.js` library
    and `mobilenet` pre-trained model beforehand, but more complete code samples will
    be shown in the next few chapters as we dive into building actual projects.


    The preceding sample starts by getting the HTML element that should contain the
    image we would like to predict. The next step is to load the `mobilenet` model
    asynchronously.


    Models can be of a rather large size, sometimes a few megabytes, so they need
    to be loaded using `async/await` to make sure that this operation is fully finished
    by the time you run the prediction.


    Once the model is ready, you can call the `classify()` method on it, in which
    you pass your HTML element, that will return an array of predictions.


    In an example where you would be using an image of a cat, the output of the prediction
    would look similar to this.


    ![../images/496132_1_En_2_Chapter/496132_1_En_2_Fig3_HTML.jpg](images/496132_1_En_2_Chapter/496132_1_En_2_Fig3_HTML.jpg)


    *Figure 2-3* Result of the image classification from the `mobilenet` model applied
    to the picture of the cat earlier


    ![../images/496132_1_En_2_Chapter/496132_1_En_2_Fig2_HTML.jpg](images/496132_1_En_2_Chapter/496132_1_En_2_Fig2_HTML.jpg)


    *Figure 2-2* A picture of a cat


    The result of using `classify()` is always an array of three objects containing
    two keys: `className` and `probability`.


    The `className` is a string containing the label, or class, the model has categorized
    the new input in, based on the data it has been previously trained with.


    The `probability` is a float value between 0 and 1 that represents the likelihood
    of the input data belonging to the `className`, 0 being not likely and 1 being
    very likely.


    They are organized in descending order so the first object in the array is the
    prediction the most likely to be true.


    In the output earlier, the model predicts that the image contains a “tiger cat”
    with 70% likelihood.


    The rest of the predictions have a probability value that drops quite significantly,
    with 21% chance that it contains a “tabby cat” and about 0.02% probability that
    it contains a “bow tie.”


    In general, you would focus on the first value returned in the predictions, as
    it has the highest probability; however, 70% is actually not that high.


    In machine learning, you aim to have the highest probability possible when using
    predictions. In this case, we only predicted the existence of a cat in an image,
    but in real applications, you can imagine that a 30% chance of having predicted
    an incorrect output is not acceptable.


    To improve this, in general, we would do what is called “hyperparameter tuning”
    and retrain the model.


    **Hyperparameter tuning** is the process of tweaking and optimizing the parameters
    used when generating a model. It could be adding layers in a neural network, changing
    the batch size, and so on and seeing the effect of these changes on the performance
    and accuracy of the model.


    However, when using a pre-trained model, you would not have the ability to do
    this, as the only thing you have access to is the output model, not the code written
    to create it.


    This is one of the limits that comes with using pre-trained models.


    When using these models, you have no control over how they were created and how
    to modify them. You usually don’t have access to the dataset used in the training
    process, so you cannot be sure that it will meet the requirements for your application.


    Besides, you take the risk of inheriting the company’s or institution’s biases.


    If your application involves implementing facial recognition and you decide to
    use an open source pre-trained model, you cannot be sure this model was trained
    on a diverse dataset of people. As a result, you may be unknowingly supporting
    certain biases by using them.


    There had been issues in the past with facial recognition models only performing
    well on white people, leaving behind a huge group of users with darker skin.


    Even though work has been done to fix this, we regularly hear about machine learning
    models making biased predictions because the data used to train them was not diverse
    enough.


    If you decide to use a pre-trained model in a production application, I believe
    it’s important to do some research beforehand.'
