  raw: '#### Project


    To put this code sample into practice, let’s build a quick prototype to allow
    users to scroll down a page by tilting their head back and forth.


    We are going to be able to reuse most of the code written previously and make
    some small modifications to trigger a scroll using some of the landmarks detected.


    The specific landmark we are going to use to detect the movement of the head is
    the `lipsLowerOuter` and more precisely its z axis.


    Looking at all the properties available in the annotations object, using the `lipsLowerOuter`
    one is the closest to the chin, so we can look at the predicted changes of z coordinate
    for this area to determine if the head is tilting backward (chin moving forward)
    or forward (chin moving backward).


    To do this, in our `main` function, once we get predictions, we can add the following
    lines of code.


    ```

    if (predictions[0].annotations.lipsLowerOuter) {

    let zAxis = predictions[0].annotations.lipsLowerOuter[9][2];

    if (zAxis > 5) {

    // Scroll down

    window.scrollTo({

    top: (scrollPosition += 10),

    left: 0,

    behavior: "smooth",

    });

    } else if (zAxis < -5) {

    // Scroll up

    window.scrollTo({

    top: (scrollPosition -= 10),

    left: 0,

    behavior: "smooth",

    });

    }

    }

    Listing 5-30

    Triggering scroll when z axis changes

    ```


    In this code sample, I declare a variable that I call `zAxis` to store the value
    of the z coordinate I want to track. To get this value, I look into the array
    of coordinates contained in the `lipsLowerOuter` property of the annotations object.


    Based on the annotation objects returned, we can see that the `lipsLowerOuter`
    property contains 10 arrays of 3 values each.


    ![../images/496132_1_En_5_Chapter/496132_1_En_5_Fig35_HTML.jpg](images/496132_1_En_5_Chapter/496132_1_En_5_Fig35_HTML.jpg)


    Figure 5-35


    Annotations returned with lipsLowerOuter values


    This is why the code sample shown just earlier was accessing the z coordinates
    using `predictions[0].annotations.lipsLowerOuter[9][2]`.


    I decided to access the last element ([9]) of the `lipsLowerOuter` property and
    its third value ([2]), the z coordinate of the section.


    The value 5 was selected after trial and error and seeing what threshold would
    work for this particular project. It is not a standard value that you will need
    to use every time you use the Facemesh model. Instead, I decided it was the correct
    threshold for me to use after logging the variable `zAxis` and seeing its value
    change in the browser’s console as I was tilting my head back and forth.


    Then, assuming that you declared `scrollPosition` earlier in the code and set
    it to a value (I personally set it to 0), a “scroll up” event will happen when
    you tilt your head backward and “scroll down” when you tilt your head forward.


    Finally, I set the property `behavior` to “smooth” so we have some smooth scrolling
    happening, which, in my opinion, creates a better experience.


    If you did not add any content to your HTML file, you won’t see anything happen
    yet though, so don’t forget to add enough text or images to be able to test that
    everything is working!


