  raw: '## Scope


    When writing a function, we can define an object within the function itself or
    relate to an object created externally by the function. In the first case, we
    speak of a *global variable*; in the second case, a *local variable*. With respect
    to a function, we therefore have three elements:


    1.  **Formal parameters:** the arguments present in the definition of the function


    2.  **Local variables:** which are defined by evaluating expressions in the body
    of the function and have visibility only within the function itself


    3.  **Global variables:** which do not belong to either the first or the second
    group, but are looked for outside the function


    So far we have worked with global variables, defining them first and then applying
    various operations through some functions. In the following case, however, let’s
    define a global test variable external to the function and a local test function
    within the function. The function calls the local variable.


    ```

    >>> test = "hello"

    >>>     def fun1():

    ...       test = "hi"

    ...       print(test)

    >>> fun1()

    hi

    ```


    In this next case, however, let’s refer to a variable external to the function
    itself. In so doing, the calculation is performed correctly:


    ```

    num1 = 5

    def fun2():

    global num1

    num2 = num1 + 1

    print(num2)

    fun2(num1)


    ```


    ## Summary


    In this chapter we examined conditional instructions, which are structures used
    to manage conditions when we create functions. We also looked at extending our
    functions.


    # 6. Other Basic Concepts


    In this chapter, we learn about some important programming concepts (such as modules
    and methods), list comprehension and class creation, regular expressions, and
    management of errors and exceptions.


    ## Object-oriented Programming


    As mentioned, Python is an object-oriented programming language, so let’s look
    at some basic concepts of object-oriented programming. Some important concepts
    are


    *   Objects


    *   Classes


    *   Inheritance


    ### More on Objects


    Objects are all the data structures we have created, from smaller ones containing
    only a single number to larger ones containing large datasets. We apply objects
    to operations using features or methods that are preinstalled in libraries, that
    we ’import, or that we create.


    ### Classes


    As far as the class concept is concerned, this is a new topic for us in this book;
    one we have not yet examined. Python allows us to create structures linked to
    our needs through the class concept. Classes are abstract representations of an
    object that we can fill with real instances from time to time. When a new class
    is defined, we can define instances of that class. A class is defined by its own
    characteristics. For example, if we create a Dog class, we can stipulate that
    it be defined by features such as the shape of the head, muzzle, hair type (short
    or long), and so on. A Book class could include features such as book genre, the
    number of pages, the main topic, the type of cover, ISBN and so on.


    ### Inheritance


    Another concept behind object-oriented programming is inheritance. It is possible
    to create new classes from existing classes. New classes inherit the characteristics
    of the original classes, but they can extend them with new features. Inheritance
    is convenient, because it allows us to extend old classes without having to change
    them. Inheritance can be single and multiple. Through single inheritance, a subclass
    can inherit member data and methods from one existing class; in the case of multiple
    inheritance, a subclass can inherit characteristics from more than one existing
    class.


    Let’s look at a simple example that creates a Cat class.


    ```

    >>> class Cat:

    ... def __init__(self, name, color, age, race):

    ...     self.name = name

    ...     self.color = color

    ...     self.age = age

    ...     self.race = race

    ```


    Cat is defined by name, color, age, and breed. We can create a cat instance:


    ```

    >>> cat1 = Cat("Fuffy", "white", 3, "tabby")

    ```


    which let’s see its features:


    ```

    >>> print(cat1.name)

    Fuffy

    >>> print(cat1.color)

    white

    ```


    We can modify the class by adding methods:


    ```

    >>> class Cat:

    ... def __init__(self, name, color, age, race):

    ...     self.name = name

    ...     self.color = color

    ...     self.age = age

    ...     self.race = race

    ... def cry(self):

    ...     print("meow")

    ... def purr(self):

    ...     print("purr")

    # we create a cat instance with this new class

    >>> cat2 = Cat("Candy", "Red", "6", "Balinese")

    ```


    Now we can query the instance not only on the basis of the features, as we did
    in the first example,


    ```

    >>> print(cat2.age)


    ```


    but also by using the methods:


    ```

    >>> cat2.cry()

    meow

    >>> cat2.purr()

    purr

    ```


    Let’s create a subclass for tabby, a cat breed, so it inherits its features.


    ```

    >>> class tabby(Cat):

    ...     def character(self):

    ...         print("warm")

    # we create a tabby instance

    >>> tabby1 = tabby("Pallina", "black", 4, "tabby")

    >>> tabby1.purr()

    purr

    >>> tabby1.character()

    warm

    ```


    Thus we can query the instance not only with regard to the characteristics of
    the tabby subclass but also with regard to the existing Cat class.


    ## Modules


    Modules are collections of functions that are generally related to a given topic
    (graphics, data analysis). Forms can belong to one of the following categories:


    *   Python modules


    *   Precompiled modules


    *   Built-in modules


    To use a module, we must first import it by using the import instruction:


    ```

    import ...

    ```


    For instance,


    ```

    import numpy

    ```


    Using “”import,”” we imported the entire module.


    However, we can import part of a module:


    ```

    from ... import ...

    ```


    For example,


    ```

    from matplotlib import cm

    ```


    To simplify and speed up the writing of code, we can import a form with another
    name:


    ```

    import numpy as np

    ```


    We can then check our modules with the following command:


    ```

    help(''modules'')

    ```


    After a module is imported—say, in Jupyter—we can access the help section by displaying
    all the methods of that particular module by pressing the Tab key (Figure [6-1](#469457_1_En_6_Chapter.xhtml#Fig1)).


    ![../images/469457_1_En_6_Chapter/469457_1_En_6_Fig1_HTML.jpg](images/469457_1_En_6_Chapter/469457_1_En_6_Fig1_HTML.jpg)


    Figure 6-1


    pandas’ methods on Jupyter


    In addition, we can import very specific elements of a module. For instance:


    ```

    from math import sqrt

    ```


    In this case, we are not importing the entire module—only the function for the
    square root. In this case, we don’t need to call sqrt as a method of the **math**
    module. We can call the square root directly:


    ```

    >>> sqrt(9)

    3.0

    ```


    If we import the entire module, we must specify sqrt as the math module method:


    ```

    >>> import math

    >>> math.sqrt(12)

    3.4641016151377544

    ```


    Some programming languages, such as Anaconda, install a whole series of modules
    and packages automatically (Figure [6-2](#469457_1_En_6_Chapter.xhtml#Fig2)).
    However, if we need to install a particular module, we can do it from the computer
    terminal by typing:


    ![../images/469457_1_En_6_Chapter/469457_1_En_6_Fig2_HTML.jpg](images/469457_1_En_6_Chapter/469457_1_En_6_Fig2_HTML.jpg)


    Figure 6-2


    Installing a package on the computer


    ```

    $ pip install nome_modulo

    ```


    As you can see in Figure [6-2](#469457_1_En_6_Chapter.xhtml#Fig2), we are on the
    terminal, not in a Python window, because as the “>>>” symbol is missing at the
    prompt. The “$” symbol indicates that the terminal is being used.


    Depending on the package we are installing (for example, from GitHub), we may
    find different instructions for installation in the package documentation itself.
    Packages are a collection of modules, often on the same subject. For instance,
    SciPy and NumPy contain dozens of data analysis modules.'
  trans: '

    ## 作用域


    编写函数时，我们可以在函数内部定义一个对象，也可以关联一个由函数在外部创建的对象。第一种情况称为*全局变量*；第二种情况称为*局部变量*。因此，对于一个函数，我们涉及三个要素：


    1.  **形式参数：** 函数定义中存在的参数


    2.  **局部变量：** 通过在函数体内计算表达式来定义，并且仅在函数内部可见


    3.  **全局变量：** 既不属于第一类也不属于第二类，而是在函数外部查找的变量


    到目前为止，我们一直使用全局变量，先定义它们，然后通过某些函数应用各种操作。然而，在下面的例子中，我们定义一个函数外部的全局测试变量和一个函数内部的局部测试变量。函数调用的是局部变量。


    ```

    >>> test = "hello"

    >>>     def fun1():

    ...       test = "hi"

    ...       print(test)

    >>> fun1()

    hi

    ```


    然而，在下一个例子中，我们引用的是函数外部的变量。这样操作，计算可以正确执行：


    ```

    num1 = 5

    def fun2():

    global num1

    num2 = num1 + 1

    print(num2)

    fun2(num1)


    ```


    ## 总结


    在本章中，我们学习了条件指令，这些是在创建函数时用于管理条件的结构。我们还探讨了如何扩展函数。


    # 6. 其他基本概念


    在本章中，我们将学习一些重要的编程概念（如模块和方法）、列表推导式和类创建、正则表达式，以及错误和异常的管理。


    ## 面向对象编程


    如前所述，Python 是一种面向对象的编程语言，因此让我们来看看面向对象编程的一些基本概念。一些重要的概念包括：


    *   对象


    *   类


    *   继承


    ### 关于对象的更多内容


    对象是我们创建的所有数据结构，从仅包含单个数字的小型结构到包含大型数据集的大型结构。我们通过使用库中预装、我们导入或我们创建的特性或方法来对操作应用对象。


    ### 类


    就类的概念而言，这对我们来说是本书中的一个新主题；我们之前尚未探讨过。Python 允许我们通过类的概念创建与我们的需求相关的结构。类是对象的抽象表示，我们可以随时用真实的实例来填充它。当定义一个新类时，我们可以定义该类的实例。一个类由其自身的特性来定义。例如，如果我们创建一个
    Dog 类，我们可以规定它由诸如头部形状、口鼻部、毛发类型（短毛或长毛）等特性来定义。一个 Book 类可以包含诸如书籍类型、页数、主要主题、封面类型、ISBN
    等特性。


    ### 继承


    面向对象编程的另一个概念是继承。可以从现有的类创建新的类。新类继承原始类的特性，但它们可以通过新特性来扩展这些类。继承很方便，因为它允许我们扩展旧类而无需修改它们。继承可以是单继承和多继承。通过单继承，子类可以从一个现有类继承成员数据和方法；在多继承的情况下，子类可以从多个现有类继承特性。


    让我们看一个创建 Cat 类的简单示例。


    ```

    >>> class Cat:

    ... def __init__(self, name, color, age, race):

    ...     self.name = name

    ...     self.color = color

    ...     self.age = age

    ...     self.race = race

    ```


    Cat 由名称、颜色、年龄和品种定义。我们可以创建一个猫的实例：


    ```

    >>> cat1 = Cat("Fuffy", "white", 3, "tabby")

    ```


    让我们查看它的特性：


    ```

    >>> print(cat1.name)

    Fuffy

    >>> print(cat1.color)

    white

    ```


    我们可以通过添加方法来修改类：


    ```

    >>> class Cat:

    ... def __init__(self, name, color, age, race):

    ...     self.name = name

    ...     self.color = color

    ...     self.age = age

    ...     self.race = race

    ... def cry(self):

    ...     print("meow")

    ... def purr(self):

    ...     print("purr")

    # 我们用这个新类创建一个猫的实例

    >>> cat2 = Cat("Candy", "Red", "6", "Balinese")

    ```


    现在，我们不仅可以像第一个示例那样基于特性来查询实例，


    ```

    >>> print(cat2.age)


    ```


    还可以使用方法：


    ```

    >>> cat2.cry()

    meow

    >>> cat2.purr()

    purr

    ```


    让我们为虎斑猫（一种猫的品种）创建一个子类，这样它就能继承其特性。


    ```

    >>> class tabby(Cat):

    ...     def character(self):

    ...         print("warm")

    # 我们创建一个虎斑猫实例

    >>> tabby1 = tabby("Pallina", "black", 4, "tabby")

    >>> tabby1.purr()

    purr

    >>> tabby1.character()

    warm

    ```


    因此，我们不仅可以查询与虎斑猫子类相关的特性，还可以查询与现有 Cat 类相关的特性。


    ## 模块


    模块是通常与特定主题（图形、数据分析）相关的函数集合。形式可以属于以下类别之一：


    *   Python 模块


    *   预编译模块


    *   内置模块


    要使用一个模块，我们必须首先使用 `import` 指令导入它：


    ```

    import ...

    ```


    例如，


    ```

    import numpy

    ```


    使用 `import`，我们导入了整个模块。


    然而，我们可以导入模块的一部分：


    ```

    from ... import ...

    ```


    例如，


    ```

    from matplotlib import cm

    ```


    为了简化和加快代码编写速度，我们可以用另一个名称导入一个形式：


    ```

    import numpy as np

    ```


    然后，我们可以使用以下命令检查我们的模块：


    ```

    help(''modules'')

    ```


    导入模块后（例如，在 Jupyter 中），我们可以通过按 Tab 键显示该特定模块的所有方法来访问帮助部分（图 6-1）。


    ![../images/469457_1_En_6_Chapter/469457_1_En_6_Fig1_HTML.jpg](img/469457_1_En_6_Fig1_HTML.jpg)


    图 6-1


    Jupyter 上的 pandas 方法


    此外，我们可以导入模块中非常具体的元素。例如：


    ```

    from math import sqrt

    ```


    在这种情况下，我们没有导入整个模块——只导入了平方根函数。在这种情况下，我们不需要将 `sqrt` 作为 **math** 模块的方法来调用。我们可以直接调用平方根：


    ```

    >>> sqrt(9)

    3.0

    ```


    如果我们导入整个模块，我们必须将 `sqrt` 指定为 math 模块的方法：


    ```

    >>> import math

    >>> math.sqrt(12)

    3.4641016151377544

    ```


    一些编程语言，如 Anaconda，会自动安装一系列模块和包（图 6-2）。然而，如果我们需要安装一个特定的模块，我们可以从计算机终端通过输入以下命令来完成：


    ![../images/469457_1_En_6_Chapter/469457_1_En_6_Fig2_HTML.jpg](img/469457_1_En_6_Fig2_HTML.jpg)


    图 6-2


    在计算机上安装包


    ```

    $ pip install nome_modulo

    ```


    如图 6-2 所示，我们在终端中，而不是在 Python 窗口中，因为提示符处缺少 `>>>` 符号。`$` 符号表示正在使用终端。


    根据我们正在安装的包（例如，来自 GitHub），我们可能会在包文档本身中找到不同的安装说明。包是模块的集合，通常涉及同一主题。例如，SciPy 和 NumPy
    包含数十个数据分析模块。

