- fmt: '### pandas: Merging Two Datasets


    There are many ways to combine two data frames. We can delete overlapping cases,
    juxtapose two files, and join new cases or new variables. Let’s look at some pandas
    examples. First, we need to create sample data frames:


    ```

    >>> df1 = pd.DataFrame({''id'': [''A'', ''B'', ''C'', ''D''], ''var1'' : [37,
    36, 43, 23], ''var2'': [120, 117, 230, 315]})

    >>> df1

    id  var1  var2

    0  A    37   120

    1  B    36   117

    2  C    43   230

    3  D    23   315

    >>> df2 = pd.DataFrame({''id'': [''A'', ''B'', ''C'', ''D''], ''var3'' : [12,
    16, 13, 18], ''var4'': [75, 54, 21, 36]})

    >>> df2

    id  var3  var4

    0  A    12    75

    1  B    16    54

    2  C    13    21

    3  D    18    36

    >>> df3 = pd.DataFrame({''id'': [''A'', ''A'', ''B'', ''B''], ''var3'' : [2, 6,
    3, 8], ''var4'': [7, 5, 2, 6]})

    id  var3  var4

    0  A     2     7

    1  A     6     5

    2  B     3     2

    3  B     8     6

    ```


    The easiest way to merge two datasets is to use the `.append()` method:


    ```

    >>> df1.append(df2)

    id  var1   var2  var3  var4

    0  A  37.0  120.0   NaN   NaN

    1  B  36.0  117.0   NaN   NaN

    2  C  43.0  230.0   NaN   NaN

    3  D  23.0  315.0   NaN   NaN

    0  A   NaN    NaN  12.0  75.0

    1  B   NaN    NaN  16.0  54.0

    2  C   NaN    NaN  13.0  21.0

    3  D   NaN    NaN  18.0  36.0

    >>> df3.append(df1)

    id  var1   var2  var3  var4

    0  A   NaN    NaN   2.0   7.0

    1  A   NaN    NaN   6.0   5.0

    2  B   NaN    NaN   3.0   2.0

    3  B   NaN    NaN   8.0   6.0

    0  A  37.0  120.0   NaN   NaN

    1  B  36.0  117.0   NaN   NaN

    2  C  43.0  230.0   NaN   NaN

    3  D  23.0  315.0   NaN   NaN

    ```


    As you can see, the two datasets are juxtaposed every time, without the system
    taking into account and adjusting the index. To merge more than two datasets,
    we can use `.concat()`:


    ```

    >>> pd.concat([df1, df2, df3])

    id  var1   var2  var3  var4

    0  A  37.0  120.0   NaN   NaN

    1  B  36.0  117.0   NaN   NaN

    2  C  43.0  230.0   NaN   NaN

    3  D  23.0  315.0   NaN   NaN

    0  A   NaN    NaN  12.0  75.0

    1  B   NaN    NaN  16.0  54.0

    2  C   NaN    NaN  13.0  21.0

    3  D   NaN    NaN  18.0  36.0

    0  A   NaN    NaN   2.0   7.0

    1  A   NaN    NaN   6.0   5.0

    2  B   NaN    NaN   3.0   2.0

    3  B   NaN    NaN   8.0   6.0

    ```


    In this way, we concatenated the datasets horizontally. We can also concatenate
    them vertically by specifying the axis as 1 (in the previous example, the axis
    was not specified so it defaulted to zero):


    ```

    >>> pd.concat([df1, df2, df3], axis = 1)

    # the code above and this line below will give us the same result

    >>> pd.concat([df1, df2, df3], axis = ''columns'')

    id  var1  var2 id  var3  var4 id  var3  var4

    0  A    37   120  A    12    75  A     2     7

    1  B    36   117  B    16    54  A     6     5

    2  C    43   230  C    13    21  B     3     2

    3  D    23   315  D    18    36  B     8     6

    ```


    We can combine two datasets in an even more advanced way, starting from two tables
    that have some rows and columns in common, and merging them through shared data.
    The pandas function that allows us to make this type of join is `merge()`. First,
    we need to create two datasets:


    ```

    >>> stud1 = pd.DataFrame({''ID'': [1,2,3,4,5], ''names'' : [''John'', ''Greta'',
    ''Francis'', ''Laura'', ''Charles''], ''Logic'': [28, 27, 23, 25, 30]})

    >>> stud2 = pd.DataFrame({''ID'': [1,6,3,4,7], ''names'' : [''John'', ''Kate'',
    ''Francis'', ''Laura'', ''Simon''], ''Analysis'': [23, 24, 28, 29, 22]})

    # by default, the merge() function extracts common cases to the two datasets,
    so it is ''inner'' by default. Inner join selects records that have matching values
    in both datasets

    >>> pd.merge(stud1, stud2, on = ''ID'')

    ID  Logic  names_x  Analysis  names_y

    0   1     28     John        23     John

    1   3     23  Francis        28  Francis

    2   4     25    Laura        29    Laura

    ```


    There are other means of merging two datasets: `''left''`, `''right''`, and `''outer''`.
    We use the dataset index—in this case, the `ID` column—as a key (index) to merge
    the datasets.


    ```

    >>> print(pd.merge(stud1, stud2, on = ''ID'', how = ''left''))

    ID  Logic  names_x  Analysis  names_y

    0   1     28     John      23.0     John

    1   2     27    Greta       NaN      NaN

    2   3     23  Francis      28.0  Francis

    3   4     25    Laura      29.0    Laura

    4   5     30  Charles       NaN      NaN

    ```


    The `''left''` parameter allows us to merge the second dataset into the first,
    taking only the cases of the first dataset and the cases that are common to the
    second and the first dataset.


    ```

    >>> print(pd.merge(stud1, stud2, on = ''ID'', how = ''right''))

    ID  Logic  names_x  Analysis  names_y

    0   1   28.0     John        23     John

    1   3   23.0  Francis        28  Francis

    2   4   25.0    Laura        29    Laura

    3   6    NaN      NaN        24     Kate

    4   7    NaN      NaN        22    Simon

    ```


    The `''right''` parameter allows to merge the first dataset into the second, taking
    only the cases of the second and those that are common to the second and the first
    at the same time.


    ```

    >>> print(pd.merge(stud1, stud2, on = ''ID'', how = ''outer''))

    ID  Logic  names_x  Analysis  names_y

    0   1   28.0     John      23.0     John

    1   2   27.0    Greta       NaN      NaN

    2   3   23.0  Francis      28.0  Francis

    3   4   25.0    Laura      29.0    Laura

    4   5   30.0  Charles       NaN      NaN

    5   6    NaN      NaN      24.0     Kate

    6   7    NaN      NaN      22.0    Simon

    ```


    When we use `''outer''`, we merge the cases of the two data frames, holding only
    a copy of the double cases, but without losing data from one of the two initial
    datasets.


    ### pandas: Basic Statistics


    The pandas library has a lot of methods for statistics, which we can use to get
    descriptive statistical information. As always, we use our data frame:


    ```

    >>> df = pd.DataFrame({''Names'': [''Simon'', ''Kate'', ''Francis'', ''Laura'',
    ''Mary'', ''Julian'', ''Rosie''],

    ''Height'':[180, 165, 170, 164, 163, 175, 166],

    ''Weight'':[85, 65, 68, 45, 43, 72, 46],

    ''Pref_food'':[''steak'', ''pizza'', ''pasta'', ''pizza'', ''vegetables'',''steak'',''seafood''],

    ''Sex'':[''m'', ''f'',''m'',''f'', ''f'', ''m'', ''f'']})

    # some information on numeric data

    >>> df.describe()

    Height     Weight

    count    7.000000   7.000000

    mean   169.000000  60.571429

    std      6.377042  16.154021

    min    163.000000  43.000000

    25%    164.500000  45.500000

    50%    166.000000  65.000000

    75%    172.500000  70.000000

    max    180.000000  85.000000

    # we can also rearrange the statistics with the .transpose method to make it more
    readable

    >>> df.describe().transpose()

    count        mean        std    min    25%    50%    75%    max

    Height    7.0  169.000000   6.377042  163.0  164.5  166.0  172.5  180.0

    Weight    7.0   60.571429  16.154021   43.0   45.5   65.0   70.0   85.0

    # value counts

    >>> df.count()

    Height    7

    Names     7

    Food      7

    Sex       7

    Weight    7

    dtype: int64

    # median calculation

    >>> df[''Height''].median()

    166.0

    # average calculation

    >>> df[''Height''].mean()

    169.0

    # minimum value

    >>> df[''Height''].min()


    # maximum value

    >>> df[''Height''].max()


    ```


    Table [8-1](#469457_1_En_8_Chapter.xhtml#Tab1) provides a summary of statistical
    methods.


    **Table 8-1** Statistical Methods


    | Method | Description |

    | --- | --- |

    | `.describe` | Provides some descriptive statistics |

    | `.count` | Returns the number of values per variable |

    | `.mean` | Returns the average |

    | `.median` | Returns the median |

    | `.mode` | Returns the mode |

    | `.min` | Returns the lowest value |

    | `.max` | Returns the highest value |

    | `.std` | Returns the standard deviation |

    | `.var` | Returns the variance |

    | `.skew` | Returns skewness |

    | `.kurt` | Returns kurtosis |


    ## Summary


    In this chapter, we learned some easier ways to import and manage our data using
    pandas—one of the most important libraries for data manipulation and data science.
    In Chapter [9](#469457_1_En_9_Chapter.xhtml), we examine another package that
    is important for data manipulation: NumPy.


    # 9. SciPy and NumPy


    Although pandas is a very important package for data analysis, it can work in
    conjunction with two other packages: SciPy and NumPy.'
