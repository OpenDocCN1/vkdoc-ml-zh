    ```


    Attributes or methods are nothing more than actions we can take on that particular
    object, such as adding an item to a list, as we saw in Chapter [3](#469457_1_En_3_Chapter.xhtml):


    ```

    >>> test1.append("pippo")

    >>> test1

    [''object1'', ''object2'', ''object3'', ''object4'', ''object5'', ''pippo'']

    ```


    We can use the type() function, which shows the type of object inserted inside
    it.


    ```

    >>> type(test1)


    ```


    It is important to remember that when bracketing an object (such as a list, tuple,
    dictionary, and so on) using the dir() function, we get a list of actions we can
    assign to that particular object.


    When we work with packages and functions written by other data scientists, it
    is useful to obtain information about their functions and their parameters. Let’s
    see how to do this.


    ## Obtain Function Information


    Within a function, we can find all the parameters specific to that function. To
    get information about a function and its parameters, type


    ```

    >>> help(print)

    Help on built-in function print in module builtins:

    print(...)

    print(value, ..., sep='' '', end="\n", file=sys.stdout, flush=False)

    Prints the values to a stream, or to sys.stdout by default.

    Optional keyword arguments:

    file:  a file-like object (stream); defaults to the current sys.stdout.

    sep:   string inserted between values, default a space.

    end:   string appended after the last value, default a newline.

    flush: whether to forcibly flush the stream.

    # the help() function is only available for Python3

    ```


    Thus, we get a series of information about that function. To quit, press q. We
    can also get help regarding a particular method:


    ```

    >>> help(test1.append)

    Help on built-in function append:

    append(...)

    L.append(object) -- append object to end

    ```


    You can find the built-in functions for Python 2.7 at [`https://docs.python.org/2/library/functions.html`](https://docs.python.org/2/library/functions.html)
    . You can find the built-in features for version 3 at [`https://docs.python.org/3/library/functions.html`](https://docs.python.org/3/library/functions.html)
    .


    If you are using Jupyter, you can display the methods by pressing the Tab key.
    Press Shift+Tab to display the parameters of a function (Figures [4-1](#469457_1_En_4_Chapter.xhtml#Fig1)
    and [4-2](#469457_1_En_4_Chapter.xhtml#Fig2)).


    ![../images/469457_1_En_4_Chapter/469457_1_En_4_Fig2_HTML.jpg](images/469457_1_En_4_Chapter/469457_1_En_4_Fig2_HTML.jpg)


    Figure 4-2


    Parameters of a function in Jupyter 2


    ![../images/469457_1_En_4_Chapter/469457_1_En_4_Fig1_HTML.jpg](images/469457_1_En_4_Chapter/469457_1_En_4_Fig1_HTML.jpg)


    Figure 4-1


    Methods in Jupyter 1


    When using Spyder, the information in Figures [4-3](#469457_1_En_4_Chapter.xhtml#Fig3)
    and [4-4](#469457_1_En_4_Chapter.xhtml#Fig4) appears automatically.


    ![../images/469457_1_En_4_Chapter/469457_1_En_4_Fig4_HTML.jpg](images/469457_1_En_4_Chapter/469457_1_En_4_Fig4_HTML.jpg)


    Figure 4-4


    Parameters of a function in Spyder 1


    ![../images/469457_1_En_4_Chapter/469457_1_En_4_Fig3_HTML.jpg](images/469457_1_En_4_Chapter/469457_1_En_4_Fig3_HTML.jpg)


    Figure 4-3


    Methods in Spyder 1


    ## Create Your Own Functions


    In addition to using the default features or importing them from other libraries,
    we can also create our own functions. As mentioned, functions are pieces of code
    that tell Python how to do something. A function has three parts: name, parameters,
    and body (Figure [4-5](#469457_1_En_4_Chapter.xhtml#Fig5)). The statement that
    allows us to create a function is def:


    ![../images/469457_1_En_4_Chapter/469457_1_En_4_Fig5_HTML.jpg](images/469457_1_En_4_Chapter/469457_1_En_4_Fig5_HTML.jpg)


    Figure 4-5


    How to write a function


    ```

    >>> def goal_fun(x):

    ...        "''(x) -> y

    ...        here we will write the documentation of the function, then

    what the function performs

    ...

    "''

    ...        return(x+y)

    ```


    Let’s create a function that sums the number 5 to any x value:


    ```

    >>> def sum1(x):

    ...        "''sum x to 5

    ...        ""

    ...        return(x+5)

    >>> sum1(10)


    >>> sum1(130)


    ```


    In this function, we entered one parameter, but we can enter more than one:


    ```

    >>> def mult_xy(x, y):

    ...     "''multiply x and y

    ...     ""

    ...     return(x*y)

    >>> mult_xy(5,6)


    ```


    To help us see the path taken by one of our functions, we can use online tools
    such as Python Tutor ( [`http://pythontutor.com/`](http://pythontutor.com/) ).'
