    ### 创建训练集和测试集


    在机器学习中，我们通常从一个 `.csv` 格式的数据集开始。从这个文件中，我们将创建 4 个部分。Scikit-learn 允许我们做的一件事是创建训练数据集和测试数据集。在机器学习中，我们通常从一个带标签的数据集开始，并将其分成两部分：一部分用于训练（约占数据集的
    70%–80%），用于训练算法；另一部分用于测试（剩余的 20%–30%），用于测试数据算法的有效性。这个特性使我们能够将实际数据与算法预测的数据进行比较，并查看它们的效果。训练集和测试集也分为两部分：一部分包含我们将用于创建模型的变量，另一部分包含我们想要学习预测的变量。


    ```

    >>> from sklearn.model_selection import train_test_split

    >>> x_train, x_test, y_train, y_test = train_test_split(x, y, test_size = 0.3)

    # 我们只需要指定测试数据集的百分比——在本例中为 30% (0.3)

    ```


    例如，如果我们将其应用于鸢尾花数据集，我们可以创建四个对象：一个包含鸢尾花数据集四个变量和 70% 案例的训练对象，一个包含其余元素（30%）的测试对象，以及一个始终被分成两部分的标签或目标变量。


    ```

    >>> x_train, x_test, y_train, y_test = train_test_split(iris.data, iris.target,
    test_size = 0.3)

    ```


    让我们检查一下创建的各种对象的大小：


    ```

