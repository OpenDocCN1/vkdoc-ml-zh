- fmt: "# Save and Run Your Own Modules and Files\n\nWe’ve seen how to create `.py`\
    \ scripts and put them in a work directory, which we can find by importing the\
    \ `os` module and typing the following:\n\n```\n>>> import os\n>>> os.getcwd()\n\
    ```\n\nWe can create a file from any text editor, which we must rename so it includes\
    \ `.py`:\n\n```\nexample_script.py\n```\n\nAfter the script is placed in the work\
    \ directory, we run it by typing:\n\n```\n# type on the computer terminal\n$ python\
    \ example_script.py\n```\n\nIf the script is not in the work directory, we need\
    \ to change the directory from the computer terminal:\n\n```\n# type on the terminal\n\
    $ cd directory_address\n```\n\nFor instance:\n\n```\n# type on the terminal\n\
    $ cd /~/Downloads\n```\n\nAfter the directory has changed, proceed as we did earlier:\n\
    \n```\n$ python example_script.py\n```\n\nThe Python shell is convenient for testing\
    \ on the fly, but for a complex script, it is always better to write it using\
    \ an editor and then run it that way, or copy the script and run it in the Python\
    \ shell.\n\n## Summary\n\nWriting functions is a very important task for a data\
    \ scientist. Languages such as R have a large number of packages and functions\
    \ for every statistical need. With Python, however, we often need to write our\
    \ functions, as detailed in this chapter. In Chapter [5](#469457_1_En_5_Chapter.xhtml),\
    \ we look at more tools that we can use to build a useful function.\n\n# 5. Conditional\
    \ Instructions and Writing Functions\n\nIn this chapter we explore the ways to\
    \ create a function and a loop in Python. We may need to create a loop to iterate\
    \ an action over a list, or to create a function to extract some cases from a\
    \ dataset. Writing functions is very important to automating data analysis.\n\n\
    ## Conditional Instructions\n\nConditional instructions are structures used to\
    \ manage conditions when we create a function. Depending on certain values or\
    \ the results of an operation, we implement different actions on our data using\
    \ the following conditional instructions.\n\n- `if`\n- `elif`\n- `else`\n\nThese\
    \ structures, along with those for creating loops, are indispensable for creating\
    \ features that allow us to create special instructions, such as performing recursive\
    \ operations on multiple rows of a dataset, establishing conditions, and so on.\n\
    \n### `if`\n\nLet’s look at some examples of the uses of `if`:\n\n```\n>>> x =\
    \ 5\n>>> y = 7\n>>> if x < y:\n...     print(\"x is less than y\")\nx is less\
    \ than y\n```\n\nNow let’s create objects and set a condition. The previous condition\
    \ is fulfilled and the required sentence is printed.\n\n```\n>>> z = 700\n>>>\
    \ h = 20\n>>> if h > z:\n...        print(\"h is bigger than z\")\n```\n\nIn this\
    \ second case, the condition is not fulfilled, therefore nothing is printed.\n\
    \n### `if` + `else`\n\n`if` can also work with `else` to give us more flexibility.\
    \ For instance:\n\n```\n>>> z = 700\n>>> h = 20\n>>> if h > z:\n...        print(\"\
    h is bigger than z\")\n... else:\n...        print(\"h is not bigger than z\"\
    )\nh is not bigger than z\n```\n\n### `elif`\n\nWe reach maximum flexibility for\
    \ `if` by using `elif`, which establishes intermediate conditions in a function.\
    \ For instance, let’s create a program that asks us what our score was. We then\
    \ fit this into a scoring class, which we call `result`. Let us proceed as follows\
    \ using Python2 (we might need to enter the encoding):\n\n```\n#!/usr/bin/env\
    \ python\n# -*- coding: utf-8 -*-\n>>> print \"Enter your score: \"\n>>> mark\
    \ = int(raw_input())\n>>> if 90 <= mark <= 100:\n...    output = \"A\"\n... elif\
    \ 80 <= mark <= 89:\n...    output = \"B\"\n... elif 70 <= mark <= 79:\n...  \
    \  output = \"C\"\n... elif 60 <= mark <= 69:\n...    output = \"D\"\n... elif\
    \ mark <= 59:\n...    output = \"F\"\n... else:\n...    print \"I don't understand,\
    \ try again\"\n... print \"Your result is \" + output\n```\n\nWe can save the\
    \ script (I named it `mark2`, and you can find it in the code folder or create\
    \ by yourself by opening a `.txt` file and renaming it with a `.py` extension)\
    \ and proceed by running it from Jupyter as shown in Figure [5-1](#469457_1_En_5_Chapter.xhtml#Fig1).\n\
    \n![../images/469457_1_En_5_Chapter/469457_1_En_5_Fig1_HTML.jpg](images/469457_1_En_5_Chapter/469457_1_En_5_Fig1_HTML.jpg)\n\
    \nFigure 5-1\n\nRunning `mark2` in Jupyter\n\n### Caution\n\nPython2 and Python3\
    \ manage user input differently.\n\nIn Python 3, we simply use `input()` instead\
    \ of `raw_input()`:\n\n```\n>>> print(\"Enter your score: \")\n>>> score = int(input())\n\
    >>> if 90 <= score <= 100:\n...    output = \"A\"\n... elif 80 <= score <= 89:\n\
    ...    output = \"B\"\n... elif 70 <= score <= 79:\n...    output = \"C\"\n...\
    \ elif 60 <= score <= 69:\n...    output = \"D\"\n... elif score <= 59:\n... \
    \   output = \"F\"\n... else:\n...    print(\"I don't understand, try again\"\
    )\n... print(\"Your result is \" + output)\n```\n\nEnter your score:\n\n```\n\n\
    ```\n\nYour result is B\n\n## Loops\n\nLoops identify structures that allow you\
    \ to repeat a certain portion of code, for a number of times or under certain\
    \ conditions. The most important instructions in Python that allow you to tweak\
    \ actions are:\n\n- `for`\n- `while`\n- `continue` and `break`\n\n### `for`\n\n\
    The Python instruction `for` allows the definition of iterations. `for` is an\
    \ iterator, so it is able to go through a sequence and perform actions on it,\
    \ or perform operations. The format of `for` instructions is as follows:\n\n```\n\
    for item in object:\n    run action on item\n```\n\nFor instance:\n\n```\n# we\
    \ create an object (in this case, a tuple) and print every element\n>>> x = (1,2,3,4,5,6,7)\n\
    # check the type of object\ntype(x)\n\n>>> for n in x:\n...        print(n)\n\n\
    # we create an object and, for each element of the object, we print a sentence\
    \ together with the element\n>>> x = (1,2,3,4,5,6,7)\n>>> for n in x:\n...   \
    \ print(\"this is the number\", n)\n(\"this is the number\", 1)\n(\"this is the\
    \ number\", 2)\n(\"this is the number\", 3)\n(\"this is the number\", 4)\n(\"\
    this is the number\", 5)\n(\"this is the number\", 6)\n(\"this is the number\"\
    , 7)\n# we can also print the elements of a string\n>>> string1 = \"example\"\n\
    >>> for s in string1:\n...        print(s)\ne\nx\na\nm\np\nl\ne\n>>> for s in\
    \ string1:\n...        print(s.capitalize())\nE\nX\nA\nM\nP\nL\nE\n>>> for s in\
    \ string1:\n...        print(s*5)\neeeee\nxxxxx\naaaaa\nmmmmm\nppppp\nlllll\n\
    eeeee\n```\n\nWhat happens if, for example, we have a list that contains sublists\
    \ and we want to print some of its elements? Let’s look at an example:\n\n```\n\
    # we create a list containing pairs of elements\n>>> list1 = [(5,7), (9,2), (2,3),\
    \ (14,27)]\n>>> list1\n[(5, 7), (9, 2), (2, 3), (14, 27)]\n```\n\nWe want to print\
    \ only the first element of each of the pairs, as shown in Figure [5-2](#469457_1_En_5_Chapter.xhtml#Fig2).\n\
    \n![../images/469457_1_En_5_Chapter/469457_1_En_5_Fig2_HTML.jpg](images/469457_1_En_5_Chapter/469457_1_En_5_Fig2_HTML.jpg)\n\
    \nFigure 5-2\n\nPrint the first element only\n\n```\n>>> for (el1, el2) in list1:\n\
    ...     print el1\n```\n\nIf we want to, we can also carry out operations on couples—for\
    \ example:\n\n```\n>>> for (el1, el2) in list1:\n...        print el1+el2\n\n\
    # In Python3, we add parentheses to the function print()\n>>> for (el1, el2) in\
    \ list1:\n...        print(el1+el2)\n```\n\nAs for dictionaries, we can proceed\
    \ as follows:\n\n```\n>>> dict1 = {\"k1\":1, \"k2\":2, \"k3\":3}\n>>> for key,\
    \ value in dict1.items():\n...     print(\"the key value \" + str( key ) + \"\
    \ is \" + str( value ))\nthe key value k3 is 3\nthe key value k2 is 2\nthe key\
    \ value k1 is 1\n```\n\nClearly, we can also print a single key or the only value:\n\
    \n```\n# python2\n>>> for key, value in dict1.items(): print key\nk3\nk2\nk1\n\
    >>> for key, value in dict1.items(): print value\n\n# python3\n>>> for key, value\
    \ in dict1.items(): print(key)\nk3\nk2\nk1\n>>> for key, value in dict1.items():\
    \ print(value)\n```"
  raw: '## Save and run Your Own Modules and Files


    We’ve seen how to create .py scripts and put them in a work directory, which we
    can find by importing the **os** module and typing the following:


    ```

    >>> import os

    >>> os.getcwd()

    ```


    We can create a file from any text editor, which we must rename so it includes
    .py:


    ```

    example_script.py

    ```


    After the script is placed in the work directory, we run it by typing


    ```

    # type on the computer terminal

    $ python example_script.py

    ```


    If the script is not in the work directory, we need to change the directory from
    the computer terminal:


    ```

    # type on the terminal

    $ cd directory_address

    ```


    For instance,


    ```

    # type on the terminal

    $ cd /~/Downloads

    ```


    After the directory has changed, proceed as we did earlier:


    ```

    $ python example_script.py

    ```


    The Python shell is convenient for testing on the fly, but for a complex script,
    it is always better to write it using an editor and then run it that way, or copy
    the script and run it in the Python shell.


    ## Summary


    Writing functions is a very important task for a data scientist. Languages such
