    For instance, `SciPy` can be used to measure probability density on a number or
    distribution:


    ```

    >>> from scipy.stats import norm

    >>> norm.pdf(5)

    1.4867195147342979e-06

    ```


    or an allotment function:


    ```

    >>> norm.cdf(x)

    ```


    `SciPy` features very technical modules. For the purposes of this book, we are
