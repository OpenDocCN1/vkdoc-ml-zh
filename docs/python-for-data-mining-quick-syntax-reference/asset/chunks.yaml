- fmt: '### NumPy: Generating Random Numbers and Seeds


    To generate random numbers, we need to import the NumPy package.


    ```

    >>> import numpy as np

    ```


    We can generate a random number as follows:


    ```

    >>> np.random.rand()

    0.992777076172216

    # or specify in parentheses the number of rows and columns to be generated automatically

    >>> np.random.rand(2,3)

    array([[ 0.39352349,  0.57116926,  0.88967038],

    [ 0.76375617,  0.24620255,  0.17408501]])

    ```


    We can create multidimensional arrays of random numbers:


    ```

    # to a size (10 is the upper limit from which the distribution is extracted)

    >>> np.random.randint(10, size= 8)

    array([5, 8, 3, 7, 6, 8, 5, 3])

    # next we create an array with four cases and five variables

    >>> np.random.randint(10, size=(4, 5))

    array([[4, 7, 1, 9, 8],

    [7, 4, 0, 3, 7],

    [3, 6, 9, 3, 4],

    [4, 7, 3, 3, 9]])

    # and then we create a three-dimensional array

    >>> np.random.randint(10, size=(4, 5, 6))

    array([[[7, 6, 1, 0, 1, 2],

    [3, 2, 3, 2, 9, 2],

    [5, 5, 6, 5, 0, 2],

    [1, 6, 2, 1, 9, 0],

    [1, 5, 3, 1, 3, 6]],

    [[0, 1, 9, 3, 4, 3],

    [2, 6, 6, 6, 6, 2],

    [2, 3, 7, 6, 2, 5],

    [1, 7, 7, 7, 0, 3],

    [3, 8, 6, 4, 1, 6]],

    [[1, 1, 2, 3, 2, 6],

    [0, 8, 1, 8, 1, 7],

    [7, 4, 3, 1, 6, 7],

    [7, 3, 1, 9, 8, 8],

    [9, 0, 1, 7, 2, 7]],

    [[3, 3, 2, 2, 5, 6],

    [4, 9, 3, 7, 4, 4],

    [8, 6, 3, 3, 7, 0],

    [9, 7, 0, 5, 2, 0],

    [3, 3, 9, 5, 2, 9]]])

    # with random.rand() we generate real numbers; with random.randint() we generate
    whole numbers

    ```


    We can set a seed to be sure to generate the same random numbers and then repeat
    the examples:


    ```

    >>> np.random.seed(12345)

    >>> np.random.rand()

    0.9296160928171479

    >>> np.random.rand()

    0.3163755545817859

    >>> np.random.seed(12345)

    >>> np.random.rand()

    0.9296160928171479

    >>> np.random.rand()

    0.3163755545817859

    ```


    We can generate random numbers using integers with `random.randint()`:


    ```

    >>> print(random.randint(0, 100))


    >>> print(random.randint(0, 100))


    # 0 and 100 are the limits within which we can extract elements. In this case,
    the number 100 cannot be extracted. This means that if we want to simulate, for
    example, crapshooting, we set the limits between 1 and 7.

    ```


    We can also create an object and extract the elements randomly:


    ```

    >>> test1 = ["object1", "object2", "object3", "object4", "object5"]

    >>> print(random.choice(test1))

    object2

    >>> print(random.choice(test1))

    object4

    ```


    We can create another random object using `np.random.randn()`, which generates
    a normal distribution.


    ```

    >>> x = np.random.randn(1000)

    # we import matplotlib (described in Chapter 10)

    >>> import matplotlib.pyplot as plt

    # and create a histogram of the x object

    >>> plt.hist(x, bins = 100)

    # we display the histogram

    >>> plt.show()

    ```


    NumPy can also be used to generate random datasets, like the one plotted in Figure
    [9-1](#469457_1_En_9_Chapter.xhtml#Fig1). But, we must also load the pandas package.
    We’ve already loaded the NumPy package, so let’s proceed as follows:


    ![../images/469457_1_En_9_Chapter/469457_1_En_9_Fig1_HTML.jpg](images/469457_1_En_9_Chapter/469457_1_En_9_Fig1_HTML.jpg)


    **Figure 9-1** Plot of a casual dataset created with NumPy and pandas


    ```

    # we import pandas

    >>> import pandas as pd

    ```


    We create a data frame using the pandas `DataFrame()` function. We identify a
    function immediately as belonging to a package, because the function is a method
    of that package:


    ```

    package_name.function_name()

    # we use the DataFrame () function of the pandas (pd) package to create the datagram,
    and the random.randn() function of the Numpy package (np) to generate random data.
    In brackets, we first put the number of cases to be generated (in this case, 10)
    followed by the number of variables (in this case, 5)

    >>> rdf = pd.DataFrame(np.random.randn(10,5))

    >>> rdf

    0         1         2         3         4

    0  0.669980  0.626433 -0.693932 -0.841258 -0.165200

    1  0.108567 -0.743791  0.367369  0.645242 -0.297283

    2  1.674781  0.241534 -0.403371  0.175751  0.274626

    3 -2.339962 -0.083003 -1.387095  1.559257 -1.025012

    4  0.383104  0.968755  0.236508  0.186294  0.094319

    5  0.956150 -1.366423  0.694575 -0.107877  1.727657

    6 -0.699931 -1.184346  0.581632  0.333015 -1.137382

    7  0.867757 -0.872935  0.417772 -0.045722  0.432780

    8 -0.685488  1.046816  0.465459 -0.446164  0.227635

    9 -0.019854  0.643384  1.459784  0.559970 -0.358676

    ```


    If we recreate a data frame using the same instructions, we will almost certainly
    get different data. To get the same data, we need to use a function that allows
    us to set a seed. In this way, we replicate the data.


    ```

    # we set the seed

    >>> np.random.seed(12345)

    # we create the data frame

    >>> rdf = pd.DataFrame(np.random.randn(10,5))

    # we visualize the data frame

    rdf

    0         1         2         3         4

    0 -0.204708  0.478943 -0.519439 -0.555730  1.965781

    1  1.393406  0.092908  0.281746  0.769023  1.246435

