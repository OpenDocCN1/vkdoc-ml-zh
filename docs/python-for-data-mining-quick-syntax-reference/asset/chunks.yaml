    >>> metrics.explained_variance_score(y_test, pred)

    ```


    ### K-Nearest Neighbors


    The k-nearest neighbor algorithm is a supervised algorithm used for data prediction
    and data mining. It is also used for pattern recognition (such as facial recognition),
    for identifying patterns in genetic code, for identifying illnesses, and for film
    and music recommendation systems. The logic behind the k-neighbor algorithm can
    be summed up in the Latin phrase “*Similes cum similar bus facillime congregantur*”—meaning,
    “similar ones gather together easily.” In short, we use the algorithm to analyze
    cases in a dataset to find similar elements. New cases are then aggregated to
    newly formed groups, depending on how close they are to a group and how far from
    one another. The k-neighbor algorithm then calculates the distance of the unclassified
    item to the others, and assigns it the closest class of element (or elements,
    k). k is nothing more than the number of close observations that we can use to
    determine the class of an item with an unknown class. For example, if we set k
    equal to two, we assign the class to the item based on its two closest elements.
    If we set it equal to three, we get the three closest elements, and so on.


    ```

    # we cannot use the k-neighbor algorithm on the iris dataset, so from this point
    onward, we limit ourselves to giving an idea of the code for the various classification
    models

    >>> from sklearn.neighbors import KNeighborsClassifier

    >>> knn = KNeighborsClassifier(n_neighbors = 3)

    >>> x_train = from the dataset we will use the variables except the label

    >>> y_train = the test labels

    >>> x_test = new data

    >>> y_test = new data labels

    >>> knn.fit(x_train, y_train)

    >>> new_pred = knn.predict(x_new)

    >>> print(new_pred)

    ```


    When dealing with classification, we use methods other than those of regression
    to test the adequacy of a model:


    ```

    >>> from sklearn.metrics import classification_report, confusion_matrix

    >>> print(confusion_matrix(y_test, y_pred))

    >>> print(classification_report(y_test, y_pred))

