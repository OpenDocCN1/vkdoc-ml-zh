    ### `continue`和`break`


    `continue`和`break`是两条允许你结束循环或继续执行下一次迭代的指令。让我们看一个`continue`的例子：


    ```python

    # we create a list

    >>> list1 = [''item1'', ''item2'', ''item3'', ''cat'', ''item4'', ''item5'']

    # we create a for loop that prints each items in the list

    >>> for item in list1:

    ...    if item in list1:

    ...        if item == ''cat'':

    ...            continue

    ...    print(item)

    item1

    item2

    item3

    item4

    item5

    # the for loop must skip the element that is unlike the others; to get this result,
    we use continue, thus "skipping"'' the element

    ```


    `break`的工作方式类似，但与`continue`不同，它会中断`for`循环：


    ```python

    >>> for item in list1:

    ...    if item in list1:

    ...        if item == ''cat'':

    ...            break

    ...    print(item)

    item1

    item2

    item3

    ```


    ### `range()`


