    5   -1.133354

    6    0.804213

    dtype: float64

    # 检查其中一个创建的结构

    >>> type(s45)

    >>> pandas.core.series.Series

    # 我们删除序列中的一些元素

    >>> >>> del(s45[5])

    >>> s45

    a   -0.227393

    b   -1.079208

    c    0.101591

    d    0.157502

    e    1.541307

    f   -0.182501

