    ### pandas：数据操作


    我们已经了解了如何创建分组以及操作数据框。现在，让我们通过 pandas 来学习更多的操作元素。首先，导入 pandas 并创建一个小的数据集：


    ```

    >>> df2 = pd.DataFrame({''Names'': [''Simon'', ''Kate'', ''Francis'', ''Laura'',
    ''Mary'', ''Julian'', ''Rosie'', ''Simon'', ''Laura''],

