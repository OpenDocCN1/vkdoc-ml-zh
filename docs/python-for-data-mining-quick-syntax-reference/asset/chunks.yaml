    ### pandas：数据导入与导出


    pandas 库在从你的计算机导入各种格式（包括 .csv）的文件方面也非常重要：


    ```

    import pandas as pd

    >>> df2 = pd.read_csv("file_address.csv")

    # 我们可以通过指定第一行不包含变量名来导入文件

    >>> df2 = pd.read_csv("file_address.csv", header = None)

    # 或者通过指定哪一行包含变量名

    >>> df2 = pd.read_csv("file_address.csv", header = 0)

    >>> df2 = pd.read_csv("file_address.csv", header = 1)

    # 我们也可以指定列名

    >>> df2 = pd.read_csv("file_address.csv", names = [''var1'', ''var2'', ''var3'',
    ''var4''])

    # 或者只导入部分列

    >>> df2 = pd.read_csv("file_address.csv", usecols = [1,2,3])

    # 我们还可以指定分隔数据的元素

    >>> df2 = pd.read_csv("file_address.csv", sep = " ")

    # 现在我们可以查看数据框的前几条记录

    >>> df2.head()

    # 或者后几条

    >>> df2.tail()

    # 我们使用括号来指定要显示的记录数

    >>> df2.head(9)

    >>> df2.tail(5)

    # 并且我们可以查看数据集的摘要信息

    >>> df2.describe()

    >>> df2.info()

    >>> df.dtypes() # 它告诉我们数据类型

    ```


    `pd.read_csv()` 函数也可以用来从网络导入文件。UCI 机器学习仓库（[`archive.ics.uci.edu/ml/index.php`](https://archive.ics.uci.edu/ml/index.php)）提供了许多用于机器学习的数据集。


    让我们看一个鸢尾花数据集。图 8-1 到 8-3 以及以下步骤帮助我们导航到其选项卡并复制包含数据集的链接。


    ![../images/469457_1_En_8_Chapter/469457_1_En_8_Fig3_HTML.jpg](img/469457_1_En_8_Fig3_HTML.jpg)


    图 8-3


    UCI 机器学习网站上的鸢尾花数据集，点击“Data Folder”访问包含数据集的页面


    ![../images/469457_1_En_8_Chapter/469457_1_En_8_Fig2_HTML.jpg](img/469457_1_En_8_Fig2_HTML.jpg)


    图 8-2


    *UCI 机器学习网站上的鸢尾花数据集*


    ![../images/469457_1_En_8_Chapter/469457_1_En_8_Fig1_HTML.jpg](img/469457_1_En_8_Fig1_HTML.jpg)


    图 8-1


    UCI 机器学习网站上的鸢尾花数据集，点击“Iris”获取描述页面


    首先，我们复制包含数据集的链接。


    ```

    # 我们导入 pandas

    >>> import pandas as pd

    # 我们创建一个包含数据集的对象，并使用 pd.read_csv() 导入它

    >>> iris = pd.read_csv("https://archive.ics.uci.edu/ml/machine-learning-databases/iris/iris.data")

    # 我们通过使用 .head() 函数显示一些记录来检查数据准确性

    >>> iris.head(3)

    5.1  3.5  1.4  0.2  Iris-setosa

    0  4.9  3.0  1.4  0.2  Iris-setosa

    1  4.7  3.2  1.3  0.2  Iris-setosa

    2  4.6  3.1  1.5  0.2  Iris-setosa

    ```


    我们使用的 pandas 函数 `pd.read_csv()` 的结构还包括我们在此次导入中未使用的其他参数：


    *   **filepath** 文件的地址（在计算机上或外部）


    *   **sep = '',''** 分隔数据的分隔符，例如逗号或分号


    *   **dtype=** 指定列格式的方法


    *   **header=** 第一行中的变量名（如果有）


    *   **skiprows=** 仅导入部分记录的方法——例如，`skiprows = 50` 从第 51 条记录开始读取数据


    *   **index_col=** 将某一列设置为数据索引的方法


    *   **skip_blank_lines=** 移除数据集中任何空行的方法


    *   **na_filter=** 识别数据集中缺失值的方法，如果设置为 False，则将其移除


    ```

    pd.read_csv( filepath, sep = '','', dtype = None, skiprows = None, index_col =
    None, skip_blank_lines = True, na_filter = True)

    ```


    此外，**usecols=** 参数可用于仅导入数据集中的少数几列。例如，假设我们有图 8-4 中所示的小型数据集，我们想从中提取以下变量：


    ![../images/469457_1_En_8_Chapter/469457_1_En_8_Fig4_HTML.jpg](img/469457_1_En_8_Fig4_HTML.jpg)


    图 8-4


    数据集 students.csv


    ```

    >>> df3 = pd.read_csv("~students.csv",usecols =["ID", "mark1"], index_col= ["ID"])

    # 我们验证数据

    df3

    mark1

    ID

    1    17.0

    2    24.0

    3    17.0

    4    27.0

    5    30.0

    6    30.0

    7    23.0

    8    17.0

    9    21.0

    10   24.0

    11   24.0

    12   25.0

    13   24.0

    14    NaN

    15   22.0

    16   30.0

    17   29.0

    18   29.0

    19    NaN

    # 正确，我们只加载了 ''mark1'' 变量

    ```


    一个对应的函数是 `df.to_csv(“filename”)`，它允许我们将一个 .csv 文件写入我们的工作目录。我们可以指定 **index=False**
    参数来避免将索引与数据一起下载。


    作为此文件导入函数的替代方案，我们可以使用 `pd.read_table(filepath, sep = ‘,’)` 函数，该函数同时设置了文件路径（filepath）和分隔符。


    pandas 的其他功能允许我们读取 Excel 的 .xls 或 .xlsx 文件。为此，我们使用一个通用公式：


    ```

    df = pd.read_excel(filepath, "sheet_name")

    ```


    在这种情况下，我们不仅必须指定文件的地址，还必须指定 Excel 文件是否包含多个数据表，以及我们要从中读取数据的工作表名称。与 .csv 类似，对于 Excel
    格式，我们也有一个公式允许我们在计算机的工作目录中写入一个 Excel 文件：`df.to_excel()`。pandas 包还包含一个用于读取 JSON
    文件的函数——`pd.read_json()`——并且还允许我们通过 `pd.read_html(url)` 函数访问网络数据，以及通过 `pd.to_html()`
    将数据框转换为 HTML 表格。


    让我们看一个创建和导出 JSON 文件的示例：


    ```

    >>> jf = pd.DataFrame(np.arange(16).reshape(4,4), index = [''A'', ''B'', ''C'',
    ''D''], columns = [''var1'', ''var2'', ''var3'', ''var4''])

    >>> jf

    var1  var2  var3  var4

    A     0     1     2     3

    B     4     5     6     7

    C     8     9    10    11

    D    12    13    14    15

    >>> jf.to_json(''jf.json'')

    # 剩下的就是检查文件是否已正确创建在我们的工作目录中

    ```

