    ## Numbers


    The numbers in Python can be any of the following:


    - Integers, or `int`

    - Floating points, or `float`

    - Complex

    - Booleans—that is, `True` or `False`


    Let’s look at some examples:


    ```

    # create an object containing an integer (int)

    >>> n1 = 19

    >>> type(n1)


    # a float

    >>> n2 = 7.5

    >>> type(n2)


    # a Boolean (True/False)

    >>> n3 = True

    >>> type(n3)


    # a complex number

    >>> n4 = 3j

    >>> type(n4)

    ```


    ## Container Objects


    At the heart of Python are the various types of objects that can be created (Table
    [3-1](#469457_1_En_3_Chapter.xhtml#Tab1)).


    **Table 3-1** Python Container Objects


    | Container | Delimited by |

    | --- | --- |

    | Tuples | `( )` |

    | Lists | `[ ]` |

    | Dictionaries | `{ }` |

    | Sets | `{ }` |

    | Strings | `""""` |


    Let’s examine each of them in turn.'
  raw: '### Comparison and Membership Operators


    In Python we also have comparison operators (comparators) and membership operators
    (Table [2-3](#469457_1_En_2_Chapter.xhtml#Tab3)).


    Table 2-3


    Comparison and Membership Operators


    | Operator | Description |

    | --- | --- |

    | > | Greater than |

    | < | Less than |

    | == | Equal to |

    | >= | Greater than or equal to |

    | <= | Less than or equal to |

    | != | Different |

    | is | Identity |

    | is not | Non identity |

    | in | Exists in |

    | not in | Does not exist in |


    These operators are used to test relationships between objects. For example,


    ```

    # we create two objects

    >>> x = 5

    >>> y = 10

    # let us verify that x is greater than y

    >>> x > y

    False

    # the output is a logical vector that tells us x is not greater than y

    # let us see if x is less than y

    >>> x >> z = 5

    # let us verify with the equality operator whether z is equal to x

    >>> z == x

    True

    # in this case, the output is positive

    # let us verify whether z is different from y

    >>> z != y

    True

    # in this case, the output is also positive

    # let us create a tuple

    >>> v1 = (1,2,3,4,5,6,7)

    # and verify whether the number 2 is in the tuple

    >>> 2 in v1

    True

    # let us verify whether the number 8 is NOT in tuple v1

    >>> 8 not in v1

    True

    # let us verify whether the number 7 is NOT in tuple v1

    >>> 7 not in v1

    False

    ```


    Python compares text strings lexicographically using, for example, the ASCII value
    of the characters. We cannot compare strings and numbers because we would throw
    an error.


    ### Bitwise Operators


    The bitwise operators shown in Table [2-4](#469457_1_En_2_Chapter.xhtml#Tab4)
    are useful when specifying more than one condition. An example is when we need
    to extract data from an object, such as a dataset.


    Table 2-4


    Bitwise Operators


    | Operator | Description |

    | --- | --- |

    | & or **and** | And |

    | &#124; or **or** | Or |

    | ^ | Xor |

    | ~ | Bitwise not |

    | << | Left shift |

    | >> | Right shift |


    Bitwise operators can be used together with comparators. Let’s look at some examples:


    ```

    >>> 3  3

    True

    # and also

    >>> 3  3

    True

    # here is an example with or (|)

    >>> 3  3

    True

    # at least one of the statements must be valid

    >>> 3 == 4 or 4 > 3

    True

    ```


    ### Assignment Operators


    Assignment operators are used to assign a name to a given object (Table [2-5](#469457_1_En_2_Chapter.xhtml#Tab5)).


    Table 2-5


    Assignment Operators


    | Operator | Description | Example |

    | --- | --- | --- |

    | = | Basic assignment operator | x = 5 + 6 |

    | += | Adds an element and assigns the result to the name | x += y (corresponds
    to x = x + y) |

    | -= | Subtracts an element and assigns the result to the name | x -= y (corresponds
    to x = x – y) |

    | /= | Divides an element and assigns the result to the name | x /= y (corresponds
    to x = x/y) |

    | *= | Multiplies an element and assigns the result to the name | x *= y (corresponds
    to x = x * y) |

    | %= | Modulo and reassignment | x %= y (corresponds to x = x % y) |

    | **= | Exponentiation and reassignment | x **= y (corresponds to x = x ** y)
    |

    | //= | Floor division and reallocation | x//=y (corresponds to x = x//y) |


    Let’s look at some examples:


    ```

    # we create an x object with the value 10

    >>> x = 10

    # sum x and overwrite the variable x again with the same name

    >>> x = x + 5

    >>> x


    # let''s try "+="

    >>> x += 5

    >>> x


    # and now "-="

    >>> x -= 5

    >>> x


    # now let''s use the operator "*="

    >>> x *= 3

    >>> x


    # and the operator "/="

    >>> x /= 3

    >>> x


    # then the operator "**="

    >>> x **= 2

    >>> x


    # and finally the operator "//="

    >>> x //= 2

    >>> x


    ```


    Each time, Python performs the operation and records the result in the x object.


    ## Operator Order


    When it comes to mathematical operators, we must be aware that there is an order
    priority that must be observed when case brackets are not inserted. This is similar
    to mathematical operations in which multiplication takes precedence over addition.
    Table [2-6](#469457_1_En_2_Chapter.xhtml#Tab6) lists some of the priority rules
    that govern the order of operations.


    Table 2-6


    Priority Rules for Operators


    | Operator | Priority (highest to lowest) |

    | --- | --- |

    | ** | Exponentiation has the highest priority |

    | - | Denial |

    | * / // % | Multiplication, division, modulo, floor division |

    | + - | Addition and subtraction |

    | >> << | Bitwise right and left |

    | & | Bitwise AND |

    | ^ &#124; | Bitwise OR |

    | <=, >, <, >= | Less than, more than, smaller, bigger than |

    | == != | Equal, different |

    | = += -= *= /= %= **= //= | Assignment operators |

    | is / is not | Comparison |

    | in / not in | Comparison |

    | not / or / and | Comparison |


    ## Indentation


    Python uses indentation to limit blocks of instructions, which makes the code
    more readable. Code blocks are thus defined by indentation. Typically an indentation
    corresponds to four spaces.


    Let’s look at an example of indentation in a function:


    ```

    >>> def multiply_xy(x, y):

    ...   "''let''s multiply x and y

    ...   "''

    ...   return(x*y)

    >>> multiply_xy(5,6)


    ```


    ## Quotation Marks


    Quotation marks in R are used primarily to define strings. They can be single,
    double, or triple. Triple quotation marks are used to wrap words and insert comments
    on multiple lines. An example of this is when we wish to include documentation
    within a function we are creating.


    ```

    >>> ex1 = ''single quote''

    >>> ex2 = "double quote"

    >>> ex3 = """

    text string 1

    text string 2

    text string 3

    """

    ```


    We examine string management in Chapter [5](#469457_1_En_5_Chapter.xhtml).


    ## Summary


    In this chapter, we studied commenting and operators. When we write code for data
    analysis, it is important that we include comments not only as a reminder to ourselves
    but also as a guide for other programmers. Operators, and their ranking, help
    us create and define our code.


    # 3. Basic Objects and Structures


    One of the most important features of Python is managing data structures. Let’s
    take a look at them.


    ## Numbers


    The numbers in Python can be any of the following:


    *   Integers, or int


    *   Floating points, or float


    *   Complex


    *   Booleans—that is, True or False


    Let’s look at some examples:


    ```

    # create an object containing an integer (int)

    >>> n1 = 19

    >>> type(n1)


    # a float

    >>> n2 = 7.5

    >>> type(n2)


    # a Boolean (True/False)

    >>> n3 = True

    >>> type(n3)


    # a complex number

    >>> n4 = 3j

    >>> type(n4)


    ```


    ## Container Objects


    At the heart of Python are the various types of objects that can be created (Table
    [3-1](#469457_1_En_3_Chapter.xhtml#Tab1)).


    Table 3-1


    Python Container Objects


    | Container | Delimited by |

    | --- | --- |

    | Tuples | ( ) |

    | Lists | [ ] |

    | Dictionaries | { } |

    | Sets | { } |

    | Strings | """" |


    Let’s examine each of them in turn.'
