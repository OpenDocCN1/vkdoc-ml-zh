    \ |\n| Tuples | ![../images/469457_1_En_3_Chapter/469457_1_En_3_Figc_HTML.jpg](images/469457_1_En_3_Chapter/469457_1_En_3_Figc_HTML.jpg)\
    \ |\n| Sets | ![../images/469457_1_En_3_Chapter/469457_1_En_3_Figd_HTML.jpg](images/469457_1_En_3_Chapter/469457_1_En_3_Figd_HTML.jpg)\
    \ |\n| Strings | ![../images/469457_1_En_3_Chapter/469457_1_En_3_Fige_HTML.jpg](images/469457_1_En_3_Chapter/469457_1_En_3_Fige_HTML.jpg)\
    \ |\n\nLet’s look at more examples. We start first with a list, which is a mutable\
    \ object:\n\n```\n# we create a list\n>>> list1 = [\"jan\", \"feb\", \"mar\",\
    \ \"apr\"]\n# we check the type of object\n>>> type(list1)\n\n# and check the\
    \ ID of the created list\n>>> id(list1)\n\n# we add an element\n>>> list1.append(\"\
    oct\")\n# we reprint the list\n>>> list1\n['jan', 'feb', 'mar', 'apr', 'oct']\n\
    # and check the ID again\n>>> id(list1)\n\n# as you can see, the ID is identical\n\
    ```\n\nNow, let’s create a tuple, which is an immutable object:\n\n```\n>>> tuple1\
    \ = (1,2,3,4)\n# we check the object class\n>>> type(tuple1)\n\n# and verify the\
    \ ID\n>>> id(tuple1)\n\n# we then try to add an element\n>>> tuple1.append(5)\n\
    Traceback (most recent call last):\nFile \"\", line 1, in \nAttributeError: 'tuple'\
    \ object has no attribute 'append'\n# we recreate the tuple that also contains\
    \ the last object\n>>> tuple1 = (1,2,3,4,5)\n# and print its contents\n>>> tuple1\n\
    (1, 2, 3, 4, 5)\n# and verify the ID\n>>> id(tuple1)\n\n# as seen, we did not\
    \ overwrite the first object; we created a second object with the same name (the\
    \ first tuple1 object is no longer available)\n```\n\nLast, let’s examine some\
    \ examples with strings, which are immutable :\n\n```\n# we create a string\n\
    >>> string1 = \"a b c d e f g\"\n# and try to replace the first element \"a\"\
    \ with \"x\" String1 [0] = 'x'\nTraceback (most recent call last):\nFile \"\"\
    , line 1, in \nTypeError: 'str' object does not support item assignment\n# we\
    \ get an error\n```\n\n## Converting Formats\n\nWe can transform one structure\
    \ to another quite easily with the help of some functions.\n\n```\n# let's create\
    \ some objects\n>>> tuple1 = (1,2,3,4,5)\n>>> list1 = [\"jan\", \"feb\", \"mar\"\
    , \"apr\"]\n>>> string1 = \"2017\"\n>>> int1 = 67\n# we check the type of objects\n\
    >>> type(tuple1)\n\n>>> type(list1)\n\n>>> type(string1)\n\n>>> type(int1)\n\n\
    ```\n\nTo convert formats, we use the following functions :\n\n```\n# list() converts,\
    \ for example, a tuple to a list\n>>> convt1 = list(tuple1)\n# it is necessary\
    \ to save the result to a new object; let's do it again and recheck the type\n\
    >>> type(convt1)\n\n# from list to tuple\n>>> conv_to_list = tuple(list1)\n>>>\
    \ type(conv_to_list)\n\n# from string to integer\n>>> conv_to_int = int(string1)\n\
    >>> type(conv_to_int)\n\n```\n\n## Summary\n\nIn this chapter we learned how to\
    \ create and manipulate the most important basic data structures in Python. An\
    \ object-oriented programming language like Python is based on two main features:\
    \ objects and actions. In this chapter we learned more about the objects; in Chapter\
    \ [4](#469457_1_En_4_Chapter.xhtml), we focus on actions by creating functions.\n\
    \n# 4. Functions\n\nAn object-based programming language is structured around\
    \ two major concepts: objects and functions. An object is everything we create\
    \ in a work session using a programming language such as Python. Functions allow\
    \ us to assign one or more actions to these objects. Let’s learn how to create\
    \ a function.\n\n## Some words about functions in Python\n\nWith Python, we basically\
    \ have two types of functions:\n\n1.  The built-in functions that are part of\
    \ Python and are loaded automatically when we run Python\n\n2.  The functions\
    \ we can build and use (user defined)\n\nA function is a piece of code that performs\
    \ one or more operations on an object and returns an output result. Functions\
    \ are especially useful when we have to do the same thing over multiple objects.\
    \ We can do this without repeating the same line of code several times.\n\nThe\
    \ two types of functions are also supported by those in the many libraries available\
    \ for installation on Python. Whenever we need a particular function (or a package,\
    \ that is a family of functions), we can install it and use it. Anaconda does\
    \ not allow us to install many of the packages we need because they already exist\
    \ in the suite.\n\nIf a package is not included in Anaconda, we can always install\
    \ it using generic terms:\n\n```\n$ conda install package_name\n```\n\nOr, we\
    \ can use pip:\n\n```\n$ pip install package_name\n```\n\nIn any case, the exact\
    \ wording for installing a package is always included in the official documentation\
    \ of the package itself."
  trans: "\n## 不可变性\n\n如前所述，不可变性是某些 Python 结构的一个特性：一旦创建，该结构便无法修改（见表 3-2）。我们可以重复使用一个名称，并用另一个对象覆盖该结构，但就所有意图和目的而言，它将是不同的。\n\
    \n表 3-2\n\n数据结构与不可变性\n\n| 结构 | 是否可变 |\n| --- | --- |\n| 列表 | ![../images/469457_1_En_3_Chapter/469457_1_En_3_Figa_HTML.jpg](img/469457_1_En_3_Figa_HTML.jpg)\
    \ |\n| 字典 | ![../images/469457_1_En_3_Chapter/469457_1_En_3_Figb_HTML.jpg](img/469457_1_En_3_Figb_HTML.jpg)\
    \ |\n| 元组 | ![../images/469457_1_En_3_Chapter/469457_1_En_3_Figc_HTML.jpg](img/469457_1_En_3_Figc_HTML.jpg)\
    \ |\n| 集合 | ![../images/469457_1_En_3_Chapter/469457_1_En_3_Figd_HTML.jpg](img/469457_1_En_3_Figd_HTML.jpg)\
    \ |\n| 字符串 | ![../images/469457_1_En_3_Chapter/469457_1_En_3_Fige_HTML.jpg](img/469457_1_En_3_Fige_HTML.jpg)\
    \ |\n\n让我们看更多示例。首先从列表开始，它是一个可变对象：\n\n```\n# 我们创建一个列表\n>>> list1 = [\"jan\", \"\
    feb\", \"mar\", \"apr\"]\n# 检查对象的类型\n>>> type(list1)\n\n# 并检查所创建列表的 ID\n>>> id(list1)\n\
    \n# 我们添加一个元素\n>>> list1.append(\"oct\")\n# 重新打印列表\n>>> list1\n['jan', 'feb', 'mar',\
    \ 'apr', 'oct']\n# 再次检查 ID\n>>> id(list1)\n\n# 如你所见，ID 是相同的\n```\n\n现在，让我们创建一个元组，它是一个不可变对象：\n\
    \n```\n>>> tuple1 = (1,2,3,4)\n# 检查对象类\n>>> type(tuple1)\n\n# 并验证 ID\n>>> id(tuple1)\n\
    \n# 然后尝试添加一个元素\n>>> tuple1.append(5)\nTraceback (most recent call last):\nFile\
    \ \"\", line 1, in \nAttributeError: 'tuple' object has no attribute 'append'\n\
    # 我们重新创建包含最后一个对象的元组\n>>> tuple1 = (1,2,3,4,5)\n# 并打印其内容\n>>> tuple1\n(1, 2, 3,\
    \ 4, 5)\n# 并验证 ID\n>>> id(tuple1)\n\n# 如所见，我们并没有覆盖第一个对象；而是创建了第二个同名对象（第一个 tuple1\
    \ 对象不再可用）\n```\n\n最后，让我们检查一些字符串示例，它们是不可变的：\n\n```\n# 我们创建一个字符串\n>>> string1 =\
    \ \"a b c d e f g\"\n# 并尝试将第一个元素 \"a\" 替换为 \"x\" String1 [0] = 'x'\nTraceback\
    \ (most recent call last):\nFile \"\", line 1, in \nTypeError: 'str' object does\
    \ not support item assignment\n# 我们得到一个错误\n```\n\n## 格式转换\n\n借助一些函数，我们可以相当轻松地将一种结构转换为另一种结构。\n\
    \n```\n# 让我们创建一些对象\n>>> tuple1 = (1,2,3,4,5)\n>>> list1 = [\"jan\", \"feb\", \"\
    mar\", \"apr\"]\n>>> string1 = \"2017\"\n>>> int1 = 67\n# 检查对象的类型\n>>> type(tuple1)\n\
    \n>>> type(list1)\n\n>>> type(string1)\n\n>>> type(int1)\n\n```\n\n要转换格式，我们使用以下函数：\n\
    \n```\n# list() 可以将例如元组转换为列表\n>>> convt1 = list(tuple1)\n# 需要将结果保存到一个新对象中；让我们再做一次并重新检查类型\n\
    >>> type(convt1)\n\n# 从列表转换为元组\n>>> conv_to_list = tuple(list1)\n>>> type(conv_to_list)\n\
    \n# 从字符串转换为整数\n>>> conv_to_int = int(string1)\n>>> type(conv_to_int)\n\n```\n\n\
    ## 总结\n\n在本章中，我们学习了如何创建和操作 Python 中最重要的基本数据结构。像 Python 这样的面向对象编程语言基于两个主要特性：对象和操作。在本章中，我们更多地了解了对象；在第\
    \ 4 章中，我们将通过创建函数来专注于操作。\n\n# 4. 函数\n\n基于对象的编程语言围绕两个主要概念构建：对象和函数。对象是我们在使用 Python\
    \ 等编程语言的工作会话中创建的一切。函数允许我们为这些对象分配一个或多个操作。让我们学习如何创建一个函数。\n\n## 关于 Python 函数的一些说明\n\
    \n使用 Python，我们基本上有两种类型的函数：\n\n1.  内建函数，它们是 Python 的一部分，并在我们运行 Python 时自动加载\n\n\
    2.  我们可以构建和使用的函数（用户自定义）\n\n函数是一段代码，它对一个对象执行一个或多个操作并返回输出结果。当我们必须对多个对象执行相同操作时，函数尤其有用。我们可以做到这一点，而无需多次重复相同的代码行。\n\
    \n这两种类型的函数也得到许多可用于安装到 Python 的库中函数的支持。每当我们需要一个特定的函数（或一个包，即一组函数）时，我们可以安装它并使用它。Anaconda\
    \ 不允许我们安装许多我们需要的包，因为它们已经存在于该套件中。\n\n如果某个包未包含在 Anaconda 中，我们始终可以使用通用术语安装它：\n\n\
    ```\n$ conda install package_name\n```\n\n或者，我们可以使用 pip：\n\n```\n$ pip install\
    \ package_name\n```\n\n无论如何，安装包的确切措辞始终包含在该包本身的官方文档中。\n"
- fmt: '### Some Predefined Built-in Functions


    Default functions are within the `builtins` module. Although there are many, some
    of the most commonly used ones are `dir`, `help`, `type`, and `print`. We can
    display them by typing:


    ```

    >>> dir(__builtins__)

    [''ArithmeticError'', ''AssertionError'', ''AttributeError'', ''BaseException'',
    ''BlockingIOError'', ''BrokenPipeError'', ''BufferError'', ''BytesWarning'', ''ChildProcessError'',
    ''ConnectionAbortedError'', ''ConnectionError'', ''ConnectionRefusedError'', ''ConnectionResetError'',
    ''DeprecationWarning'', ''EOFError'', ''Ellipsis'', ''EnvironmentError'', ''Exception'',
    ''False'', ''FileExistsError'', ''FileNotFoundError'', ''FloatingPointError'',
    ''FutureWarning'', ''GeneratorExit'', ''IOError'', ''ImportError'', ''ImportWarning'',
    ''IndentationError'', ''IndexError'', ''InterruptedError'', ''IsADirectoryError'',
    ''KeyError'', ''KeyboardInterrupt'', ''LookupError'', ''MemoryError'', ''NameError'',
    ''None'', ''NotADirectoryError'', ''NotImplemented'', ''NotImplementedError'',
    ''OSError'', ''OverflowError'', ''PendingDeprecationWarning'', ''PermissionError'',
    ''ProcessLookupError'', ''RecursionError'', ''ReferenceError'', ''ResourceWarning'',
    ''RuntimeError'', ''RuntimeWarning'', ''StopAsyncIteration'', ''StopIteration'',
    ''SyntaxError'', ''SyntaxWarning'', ''SystemError'', ''SystemExit'', ''TabError'',
    ''TimeoutError'', ''True'', ''TypeError'', ''UnboundLocalError'', ''UnicodeDecodeError'',
    ''UnicodeEncodeError'', ''UnicodeError'', ''UnicodeTranslateError'', ''UnicodeWarning'',
    ''UserWarning'', ''ValueError'', ''Warning'', ''ZeroDivisionError'', ''__build_class__'',
    ''__debug__'', ''__doc__'', ''__import__'', ''__loader__'', ''__name__'', ''__package__'',
    ''__spec__'', ''abs'', ''all'', ''any'', ''ascii'', ''bin'', ''bool'', ''bytearray'',
    ''bytes'', ''callable'', ''chr'', ''classmethod'', ''compile'', ''complex'', ''copyright'',
    ''credits'', ''delattr'', ''dict'', ''dir'', ''divmod'', ''enumerate'', ''eval'',
    ''exec'', ''exit'', ''filter'', ''float'', ''format'', ''frozenset'', ''getattr'',
    ''globals'', ''hasattr'', ''hash'', ''help'', ''hex'', ''id'', ''input'', ''int'',
    ''isinstance'', ''issubclass'', ''iter'', ''len'', ''license'', ''list'', ''locals'',
    ''map'', ''max'', ''memoryview'', ''min'', ''next'', ''object'', ''oct'', ''open'',
    ''ord'', ''pow'', ''print'', ''property'', ''quit'', ''range'', ''repr'', ''reversed'',
    ''round'', ''set'', ''setattr'', ''slice'', ''sorted'', ''staticmethod'', ''str'',
    ''sum'', ''super'', ''tuple'', ''type'', ''vars'', ''zip'']

    ```


    The `dir()` function is important because it allows us to display a list of the
    attributes or methods of the objects we insert inside it. For example:


    ```

    >>> test1 = ["object1", "object2", "object3", "object4", "object5"]

    >>> dir(test1)

    [''__add__'', ''__class__'', ''__contains__'', ''__delattr__'', ''__delitem__'',
    ''__delslice__'', ''__doc__'', ''__eq__'', ''__format__'', ''__ge__'', ''__getattribute__'',
    ''__getitem__'', ''__getslice__'', ''__gt__'', ''__hash__'', ''__iadd__'', ''__imul__'',
    ''__init__'', ''__iter__'', ''__le__'', ''__len__'', ''__lt__'', ''__mul__'',
    ''__ne__'', ''__new__'', ''__reduce__'', ''__reduce_ex__'', ''__repr__'', ''__reversed__'',
    ''__rmul__'', ''__setattr__'', ''__setitem__'', ''__setslice__'', ''__sizeof__'',
    ''__str__'', ''__subclasshook__'', ''append'', ''count'', ''extend'', ''index'',
    ''insert'', ''pop'', ''remove'', ''reverse'', ''sort'']

    ```


    Attributes or methods are nothing more than actions we can take on that particular
    object, such as adding an item to a list, as we saw in Chapter [3](#469457_1_En_3_Chapter.xhtml):


    ```

    >>> test1.append("pippo")

    >>> test1

    [''object1'', ''object2'', ''object3'', ''object4'', ''object5'', ''pippo'']

    ```


    We can use the `type()` function, which shows the type of object inserted inside
    it:


    ```

    >>> type(test1)

    ```


    It is important to remember that when bracketing an object (such as a list, tuple,
    dictionary, and so on) using the `dir()` function, we get a list of actions we
    can assign to that particular object.


    When we work with packages and functions written by other data scientists, it
    is useful to obtain information about their functions and their parameters. Let’s
    see how to do this.


    ## Obtain Function Information


    Within a function, we can find all the parameters specific to that function. To
    get information about a function and its parameters, type:


    ```

    >>> help(print)

    Help on built-in function print in module builtins:

    print(...)

    print(value, ..., sep='' '', end="\n", file=sys.stdout, flush=False)

    Prints the values to a stream, or to sys.stdout by default.

    Optional keyword arguments:

    file:  a file-like object (stream); defaults to the current sys.stdout.

    sep:   string inserted between values, default a space.

    end:   string appended after the last value, default a newline.

    flush: whether to forcibly flush the stream.

    # the help() function is only available for Python3

    ```


    Thus, we get a series of information about that function. To quit, press `q`.
    We can also get help regarding a particular method:


    ```

    >>> help(test1.append)

    Help on built-in function append:

    append(...)

    L.append(object) -- append object to end

    ```


    You can find the built-in functions for Python 2.7 at [`https://docs.python.org/2/library/functions.html`](https://docs.python.org/2/library/functions.html).
    You can find the built-in features for version 3 at [`https://docs.python.org/3/library/functions.html`](https://docs.python.org/3/library/functions.html).


    If you are using Jupyter, you can display the methods by pressing the `Tab` key.
    Press `Shift+Tab` to display the parameters of a function (Figures [4-1](#469457_1_En_4_Chapter.xhtml#Fig1)
    and [4-2](#469457_1_En_4_Chapter.xhtml#Fig2)).


    ![../images/469457_1_En_4_Chapter/469457_1_En_4_Fig2_HTML.jpg](images/469457_1_En_4_Chapter/469457_1_En_4_Fig2_HTML.jpg)


    Figure 4-2


    Parameters of a function in Jupyter 2


    ![../images/469457_1_En_4_Chapter/469457_1_En_4_Fig1_HTML.jpg](images/469457_1_En_4_Chapter/469457_1_En_4_Fig1_HTML.jpg)


    Figure 4-1


    Methods in Jupyter 1


    When using Spyder, the information in Figures [4-3](#469457_1_En_4_Chapter.xhtml#Fig3)
    and [4-4](#469457_1_En_4_Chapter.xhtml#Fig4) appears automatically.


    ![../images/469457_1_En_4_Chapter/469457_1_En_4_Fig4_HTML.jpg](images/469457_1_En_4_Chapter/469457_1_En_4_Fig4_HTML.jpg)


    Figure 4-4


    Parameters of a function in Spyder 1


    ![../images/469457_1_En_4_Chapter/469457_1_En_4_Fig3_HTML.jpg](images/469457_1_En_4_Chapter/469457_1_En_4_Fig3_HTML.jpg)


    Figure 4-3


    Methods in Spyder 1


    ## Create Your Own Functions


    In addition to using the default features or importing them from other libraries,
    we can also create our own functions. As mentioned, functions are pieces of code
    that tell Python how to do something. A function has three parts: name, parameters,
    and body (Figure [4-5](#469457_1_En_4_Chapter.xhtml#Fig5)). The statement that
    allows us to create a function is `def`:


    ![../images/469457_1_En_4_Chapter/469457_1_En_4_Fig5_HTML.jpg](images/469457_1_En_4_Chapter/469457_1_En_4_Fig5_HTML.jpg)


    Figure 4-5


    How to write a function


    ```

    >>> def goal_fun(x):

    ...        "''(x) -> y

    ...        here we will write the documentation of the function, then

    what the function performs

    ...

    "''

    ...        return(x+y)

    ```


    Let’s create a function that sums the number 5 to any `x` value:


    ```

    >>> def sum1(x):

    ...        "''sum x to 5

    ...        ""

    ...        return(x+5)

    >>> sum1(10)


    >>> sum1(130)


    ```


    In this function, we entered one parameter, but we can enter more than one:


    ```

    >>> def mult_xy(x, y):

    ...     "''multiply x and y

    ...     ""

    ...     return(x*y)

    >>> mult_xy(5,6)


    ```


    To help us see the path taken by one of our functions, we can use online tools
    such as Python Tutor ([`http://pythontutor.com/`](http://pythontutor.com/)).'
