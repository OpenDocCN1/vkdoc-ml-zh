- fmt: '# Methods


    In Python, everything is an object and, depending on the type to which it belongs,
    different methods (or functions) can be applied to each object. Methods are sort
    of like functions, but they are related to particular classes. This means that
    lists have their own methods, tuples have different methods, and so on. Each method
    performs an operation on an object, similar to a function.


    Depending on the tool we use to program or for our Python data analyses, we may
    have some suggestions on methods associated with a particular object. This is
    the case when using Spyder and Jupiter. Figure [6-3](#469457_1_En_6_Chapter.xhtml#Fig3)
    displays an example of methods for an object using Spyder; Figure [6-4](#469457_1_En_6_Chapter.xhtml#Fig4)
    shows the methods using Jupyter.


    ![../images/469457_1_En_6_Chapter/469457_1_En_6_Fig4_HTML.jpg](images/469457_1_En_6_Chapter/469457_1_En_6_Fig4_HTML.jpg)


    Figure 6-4 Example on Jupyter


    ![../images/469457_1_En_6_Chapter/469457_1_En_6_Fig3_HTML.jpg](images/469457_1_En_6_Chapter/469457_1_En_6_Fig3_HTML.jpg)


    Figure 6-3 Example on Spyder


    An example of a function is `print()`; an example of a method is `.upper()`. Let’s
    look at an example:


    ```

    >>> string1 = "this is a string"

    >>> print(string1)

    this is a string

    >>> string1.upper()

    "THIS IS A STRING"

    ```


    To get information about a specific method, we use the `help()` function. For
    example, we can create a list and activate help with the `.append` method:


    ```

    >>> x = [1,2,3,4,5,6]

    >>> help(x.append)

    ```


    ![../images/469457_1_En_6_Chapter/469457_1_En_6_Fig5_HTML.jpg](images/469457_1_En_6_Chapter/469457_1_En_6_Fig5_HTML.jpg)


    Figure 6-5 Output of the code above


    # List Comprehension


    List comprehension is a syntax construct that allows us to create new lists from
    other lists. Let’s create a list and then apply a function to the elements of
    another list. We can do this using a `for` loop:


    ```

    # we create a number list

    >>> numbers = [12, 23, 34, 57, 89, 97]

    # in Python2

    # using the for loop we add the number 10 to each item on the list

    >>> for i in range(len(numbers)):

    ...         numbers[i] = numbers[i] + 10

    >>> numbers

    [22, 33, 44, 67, 99, 107]

    # we can create a new list by adding a certain number even through the list comprehension

    # we will overwrite the first list, number, with a new one where every item is
    added to 10 using Python3

    >>> numbers = [number + 10 for number in numbers]

    [32, 43, 54, 77, 109, 117]

    # the way we call each element of the list is random

    >>> numbers = [n + 10 for n in numbers]

    >>> numbers

    [42, 53, 64, 87, 119, 127]

    ```


    Thus, list comprehension allows us to simplify an iteration that turns our list
    into a new one. We can apply list comprehension to a list of numbers, as we just
    saw, we can also apply it to strings. For example, we can iterate the operation
    and turn everything in it into uppercase type:


    ```

    >>> strings = [''this'', ''is'' ,''a'', ''string'']

    >>> strings2 = [string.upper() for string in strings]

    >>> strings2

    [''THIS'', ''IS'', ''A'', ''STRING'']

    ```


    # Regular Expressions


    Imagine trying to search for a word in a text document. When we do the search,
    it returns all instances of the word we are looking for. However, if we do this
    type of search, we may skip some occurrences—for example, if they start with an
    uppercase letter or if they are followed or preceded by punctuation. If the word
    we are looking for also exists within another word, we must also consider the
    empty spaces of the word itself to find it.


    The use of regular expressions, also known as *regex*, makes it much easier to
    identify all these options. Regular expressions are patterns that allow us to
    describe generic strings, which make this type of search more elaborate. They
    are very useful for searching, replacing, or extracting strings or substrings.
    Regular expressions can, for example, be used to extract dates, e-mail addresses,
    and physical mail addresses, because they do not just extract the single e-mail
    address. For example, we can insert an e-mail address in a search box with a structure
    similar to `address@email.com`, which identifies the structure of an e-mail address
    and extracts multiple e-mail addresses from the same document according to its
    structure.


    In Python, regular expressions are handled via the module `re`, which we can import:


    ```

    >>> import re

    # we create a sample string

    >>> str1 = "Try searching for a word using regular expressions and the Python
    module kernel"

    ```


    We search for an occurrence using `re.search()`:


    ```

    >>> re.search(''word'', str1)


    # this result tells us that the word we were looking for is present in the string

    # to get the same result in its simplest form, save the previous line of code
    in an object and query it with the bool() function:

    >>> exre1 = re.search(''word'', str1)

    >>> bool(exre1)

    True

    ```


    We can search for an occurrence by using `.findall()`:


    ```

    >>> re.findall(''Try'', str1)

    [''Try'']

    # if the item is not present, we receive an empty list

    >>> re.findall(''some'', str1)

    []

    # this function is case sensitive, so "''some"'' is different from "''Some"''

    ```


    We can also divide a string into the elements that comprise it:


    ```

    >>> re.split('' '', str1)

    [''Try'', ''searching'', ''for'', ''a'', ''word'', ''using'', ''regular'', ''expressions'',
    ''and'', ''the'', ''Python'', ''module'', ''kernel'']

    # in the previous code, we used a space as a splitting element; next we split
    the string into words using the conjunction '' and '' (and insert spaces on either
    side to avoid searching for internal recurrences of a word)

    >>> re.split('' and '', str1)

    [''Try searching for a word using regular expressions'', ''the Python module kernel'']

    # we get the previous result by dividing the string in two according to the position
    of the conjunction "''and''"

    ```


    Regular expression symbols (such as `*`, `+`, and `?`) allow us to search for
    a character one or more times, or followed by other letters.'
