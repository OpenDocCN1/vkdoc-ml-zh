    ### pandas：数据框（DataFrame）


    pandas 中最重要的结构是 DataFrame，它扩展了 Series 的功能，使我们能够管理数据集。让我们用 pandas 创建一个小的数据框：


    ```

    # 我们导入 pandas

    >>> import pandas as pd

    # 我们使用 DataFrame 函数从计算机创建或导入数据集或文件

    # 要获取特定函数的帮助，我们输入

    >>> help(pd.DataFrame())

    Help on DataFrame in module pandas.core.frame object:

    # class DataFrame(pandas.core.generic.NDFrame)

    |  Two-dimensional size-mutable, potentially heterogeneous

    |  tabular data structure with labeled axes (rows and columns).

    |  Arithmetic operations align on both row and column labels.

    |  Can be thought of as a dict-like container for Series objects.

    |  The primary pandas data structure

    |

    |  Parameters

    |  _ _ _ _ _ _ _ _ _ _

    |  data : numpy ndarray (structured or homogeneous), dict, or

    |  DataFrame

    |      Dict can contain Series, arrays, constants, or list-like

    |      objects

    |  index : Index or array-like

    |      Index to use for resulting frame. Will default to

    |      np.arange(n) if no indexing information part of input

    |      data and no index provided

    |  columns : Index or array-like

    |      Column labels to use for resulting frame. Will default to

    |      np.arange(n) if no column labels are provided

    |  dtype : dtype, default None

    ```


    ```

    # 我们创建第一个数据集

    >>> df1 = pd.DataFrame({''Names'': [''Simon'', ''Kate'', ''Francis'', ''Laura'',
    ''Mary'', ''Julian'', ''Rosie''],

    ''Height'':[180, 165, 170, 164, 163, 175, 166],

    ''Weight'':[85, 65, 68, 45, 43, 72, 46],

    ''Pref_food'':[''steak'', ''pizza'', ''pasta'', ''pizza'', ''vegetables'',''steak'',''seafood''],

    ''Sex'':[''m'', ''f'',''m'',''f'', ''f'', ''m'', ''f'']})

    # 注意：我们不能创建名称中包含空格的变量；例如，我们可以创建变量 ''Var_1''，但将变量命名为 ''Var 1'' 会返回错误

    # 我们打印数据框

    >>> df1

    Height    Names   Pref_food Sex  Weight

    0     180    Simon       steak   m      85

    1     165     Kate       pizza   f      65

    2     170  Francis       pasta   m      68

    3     164    Laura       pizza   f      45

    4     163     Mary  vegetables   f      43

    5     175   Julian       steak   m      72

    6     166    Rosie     seafood   f      46

    # 对数据进行统计分析可能很有用，我们可以使用 .describe() 方法来实现

    >>> df1.describe()

    Height     Weight

    count    7.000000   7.000000

    mean   169.000000  60.571429

    std      6.377042  16.154021

    min    163.000000  43.000000

    25%    164.500000  45.500000

    50%    166.000000  65.000000

    75%    172.500000  70.000000

    max    180.000000  85.000000

    # 我们可以查看变量名

    >>> df1.columns

    Index([''Height'', ''Names'', ''Pref_food'', ''Sex'', ''Weight''],

    dtype=''object'')

    ```


    此时，我们可以继续设置一个变量——在本例中是 ''Names''——作为索引，方法如下：


    ```

    >>> df1.set_index(''Names'')

    ```


    ![../images/469457_1_En_8_Chapter/469457_1_En_8_Figb_HTML.jpg](img/469457_1_En_8_Figb_HTML.jpg)


    ```

    # 为了巩固索引，我们使用参数 inplace = True

    >>> df1.set_index(''Names'', inplace = True)

    # 我们可以按如下方式重置索引：

    >>> df1.reset_index()

    ```


    我们可以继续探索数据。


    ```

    # 我们检查案例数和变量数

    >>> print(df1.shape)

    (7, 4)

    # 并确定变量类型

    >>> print(df1.dtypes)

    Height        int64

    Pref_food    object

    Sex          object

    Weight        int64

    dtype: object

    ```


    同样，我们可以使用 `head()` 和 `tail()` 函数查看第一个和最后一个元素。我们可能希望指定要显示的案例数量。在这种情况下，我们会使用括号：


    ```

    >>> df1.head()

    >>> df1.tail(3)

    ```


    我们还可以使用 `.info()` 方法获取有关变量的信息：


    ```

    >>> df1.info()


    RangeIndex: 7 entries, 0 to 6

    Data columns (total 5 columns):

    Height       7 non-null int64

    Names        7 non-null object

    Pref_food    7 non-null object

    Sex          7 non-null object

    Weight       7 non-null int64

    dtypes: int64(2), object(3)

    memory usage: 360.0+ bytes

    ```


    然后，我们可以根据其中一个变量重新排列数据：


    ```

    >>> df1.sort_values(by = ''Weight'')

    ```


    ![../images/469457_1_En_8_Chapter/469457_1_En_8_Figc_HTML.jpg](img/469457_1_En_8_Figc_HTML.jpg)


    ```

    # 我们根据体重重新排列了数据，从最低值到最高值。要反转这些值，从最高到最低，我们将 ascending 参数指定为 False

    >>> df1.sort_values(by = ''Weight'', ascending = False)

    ```


    ![../images/469457_1_En_8_Chapter/469457_1_En_8_Figd_HTML.jpg](img/469457_1_En_8_Figd_HTML.jpg)


    ```

    # 如果数据集中有任何缺失值（特别是在用作索引的变量中），我们可以通过以下方式将它们全部放在显示的开头或结尾

    >>> df1.sort_values(by = ''Weight'', na_position = "last")

    >>> df1.sort_values(by = ''Weight'', na_position = "first")

    # 要按索引重新排列数据集，我们可以使用 sort_index 而不是 sort_values，以升序或降序方式对数据进行排序

    >>> df1.sort_index()

    >>> df1.sort_index(ascending= False)

    ```


    ![../images/469457_1_En_8_Chapter/469457_1_En_8_Fige_HTML.jpg](img/469457_1_En_8_Fige_HTML.jpg)


    让我们看一些从数据框中切片项目的示例：


    ```

    # 从第一列开始（Python 从 0 开始计数，所以我们使用第 0 列），让我们切片前三个案例：

    >>> df1[:3]

    Names    Height Pref_food Sex  Weight

    0     Simon      180      steak   m      85

    1      Kate      165      pizza   f      65

    2   Francis      170      pasta   m      68

    # 或者从第四个案例切片到末尾

    >>> df1[4:]

    Names   Heigth   Pref_food Sex  Weight

    4      Mary    163  vegetables   f      43

    5      Julian  175       steak   m      72

    6      Rosie   166     seafood   f      46

    # 或者切片其中一列

    >>> df1[''Names'']

    0      Simon

    1       Kate

    2    Francis

    3      Laura

    4       Mary

    5     Julian

    6      Rosie

    Name: Names, dtype: object

    # 通过使用单层方括号，就像我们刚才做的那样，我们可以像提取 Series 一样提取一个变量

    # 这是另一种方法

    >>> df1.Names

    0      Simon

    1       Kate

    2    Francis

    3      Laura

    4       Mary

    5     Julian

    6      Rosie

    Name: Names, dtype: object

    # 第三种方法是使用双层方括号来选择数据框

    >>> df1[[''Names'']]

    ```


    ![../images/469457_1_En_8_Chapter/469457_1_En_8_Figf_HTML.jpg](img/469457_1_En_8_Figf_HTML.jpg)


    ```

    # 我们也可以选择更多列

    >>> df1[[''Names'', ''Sex'']]

    ```


    我们可以选择特定元素的某个变量的值——例如，第三个值：


    ```

    >>> df1[''Sex''][2]

    ''m''

    # 或者某些变量的某些值

    >>> df1[''Names''][1:4]

    1       Kate

    2    Francis

    3      Laura

    Name: Names, dtype: object

    ```


    要从数据框中选择项目，我们还可以使用 `.loc`、`.iloc` 和 `.ix` 方法：


    *   **.loc：** 通过索引工作

    *   **.iloc：** 通过位置提取

    *   **.ix：** 两者都考虑


    ```

    # .loc

    >>> df1.loc[1]

    Names         Kate

    Height         165

    Pref_food    pizza

    Sex              f

    Weight          65

    Name: 1, dtype: object

    # 我们可以提取从第一个到第四个的元素

    >>> df1.loc[:3]

    # .iloc

    # 我们可以提取第一个案例和第三个变量中的元素

    >>> df1.iloc[0,2]

    ''steak''

    # .iloc 的替代方法是 .iat 方法

    >>> df1.iat[1,3]

    ''f''

    # .at 和 .iat 方法基于索引

    >>> df1.at[2,''Sex'']

    ''m''

    #  逗号左边，我们指示要提取的案例；右边，指示列或变量（表格未显示）。要提取所有元素，我们使用冒号

    # 如果我们想每隔一个案例提取一次呢？

    >>> df1[::2]

    ```

    '
- fmt: '![../images/469457_1_En_8_Chapter/469457_1_En_8_Figg_HTML.jpg](images/469457_1_En_8_Chapter/469457_1_En_8_Figg_HTML.jpg)


    Through Boolean operators we can specify extracting conditions. For instance,
    we can extract the cases of the dataset in which the height of the subjects (`Height`)
    is greater than 170:


    ```

    >>> df1[df1.Height > 170]

    Names  Height  Pref_food  Sex  Weight

    0    Simon  180         steak    m      85

    5   Julian  175         steak    m      72

    ```


    We can also specify multiple conditions, such as extracting all females who weigh
    more than 163:


    ```

    >>> df1[(df1.Height > 163) & (df1.Sex == ''f'')]

    ```


    Alternatively, we can also use the `.query()` method:


    ```

    >>> df1.query("Sex != ''f''")

    Names  Height  Pref_food Sex  Weight

    0     Simon     180      steak   m      85

    2   Francis     170      pasta   m      68

    5    Julian     175      steak   m      72

    ```


    Now let’s look at how to rename a column:


    ```

    >>> df1 = df1.rename(columns = {''Pref_food'': ''Food''})

    >>> df1.head(2)

    Names  Height   Food  Sex  Weight

    0   Simon  180      steak   m      85

    1   Kate   165      pizza   f      65

    ```


    We can create a copy of our data frame:


    ```

    >>> df2 = df1.copy()

    >>> df2

    ```


    ![../images/469457_1_En_8_Chapter/469457_1_En_8_Figh_HTML.jpg](images/469457_1_En_8_Chapter/469457_1_En_8_Figh_HTML.jpg)


    We can also add a column. For example, let’s add a column to the `df2` dataset
    that contains height in centimeters:


    ```

    >>> df2[''new_col''] = df2.Height/100

    >>> df2

    Names  Heigth        Food Sex  Weight  new_col

    0    Simon     180       steak   m      85     1.80

    1    Kate      165       pizza   f      65     1.65

    2    Francis   170       pasta   m      68     1.70

    3    Laura     164       pizza   f      45     1.64

    4    Mary      163  vegetables   f      43     1.63

    5    Julian    175       steak   m      72     1.75

    6    Rosie     166     seafood   f      46     1.66

    ```


    We can also add a column using the `.insert()` method. The first element, `5`,
    marks the location where we want to insert the new column (the sixth position),
    the second is the name of the new column, and the third is the value of the new
    column:


    ```

    >>> df2.insert(5, column = ''new_col2'', value = df2.Height/100)

    >>> print(df2.head(2))

    Names  Heigth Pref_food Sex  Weight  new_col2  new_col

    0   Simon  180        steak   m      85      1.80     1.80

    1   Kate   165        pizza   f      65      1.65     1.65

    ```


    Let’s return to the `df1` dataset without additions. By using `.groupby()`, we
    can also aggregate the dataset around one or more variables.


    ```

    >>> df1.groupby(''Sex'')


    ```


    We can create an object that contains aggregated groups according to the `Sex`
    variable:


    ```

    >>> grouped1 = df1.groupby(''Sex'')

    # to view the groups, we use group_name.groups

    >>> grouped1.groups

    {''f'': [1, 3, 4, 6], ''m'': [0, 2, 5]}

    ```


    We can visualize the number of cases labeled in one way or another.


    ```

    # to see the cases, proceed as follows

    >>> for names, groups in grouped1:

    ...    print(names)

    ...    print(groups)

    ```


    ![../images/469457_1_En_8_Chapter/469457_1_En_8_Figi_HTML.jpg](images/469457_1_En_8_Chapter/469457_1_En_8_Figi_HTML.jpg)


    ```

    # note that we only get data belonging to a group

    >>> grouped1.get_group(''f'')

    # we can aggregate cases according to two variables

    >>> grouped2 = df1.groupby([''Sex'', ''Pref_food''])

    >>> grouped2.groups

    {(''f'', ''pizza''): [1, 3],

    (''f'', ''seafood''): [6],

    (''f'', ''vegetables''): [4],

    (''m'', ''pasta''): [2],

    (''m'', ''steak''): [0, 5]}

    # we can also determine how many cases fall into each of the groups

    >>> grouped2.size()

    Sex  Pref_food

    f    pizza         2

    seafood       1

    vegetables    1

    m    pasta         1

    steak         2

    dtype: int64

    # we can obtain some descriptive statistics about the data

    >>> grouped2.describe()

    ```


    ![../images/469457_1_En_8_Chapter/469457_1_En_8_Figj_HTML.jpg](images/469457_1_En_8_Chapter/469457_1_En_8_Figj_HTML.jpg)


    We can also count the frequency of a variable using the `.value_counts()` method.


    ```

    >>> df1[''Sex''].value_counts()

    f    4

    m    3

    Name: Sex, dtype: int64

    ```


    Returning to the `df1` dataset, we can acquire information about the variables
    using the `.info()` method.


    ```

    >>> print(df1)

    >>> df1.info()

    ```


    With the `.astype()` method, we can change the nature of a variable. For example,
    we can overwrite a variable from `int` (a numeric variable) to an object variable,
    such as a string:


    ```

    >>> df1[''Weight''] = df1[''Weight''].astype(''object'')

    >>> df1.info()


    RangeIndex: 7 entries, 0 to 6

    Data columns (total 5 columns):

    Height       7 non-null int64

    Names        7 non-null object

    Pref_food    7 non-null object

    Sex          7 non-null object

    Weight       7 non-null object

    dtypes: int64(1), object(4)

    memory usage: 360.0+ bytes

    ```


    We can delete cases and variables with the `.drop()` method:


    ```

    >>> df1.drop(0)

    ```


    ![../images/469457_1_En_8_Chapter/469457_1_En_8_Figk_HTML.jpg](images/469457_1_En_8_Chapter/469457_1_En_8_Figk_HTML.jpg)


    ```

    # if, on the other hand, we set and consolidate the index, we eliminate the case
    based on the value of the index

    >>> df1.set_index(''Names'', inplace = True)

    >>> df1.drop("Laura")

    Height   Pref_food Sex  Weight

    Names

    Simon       180       steak   m      85

    Kate        165       pizza   f      65

    Francis     170       pasta   m      68

    Mary        163  vegetables   f      43

    Julian      175       steak   m      72

    Rosie       166     seafood   f      46

    # we can remove more than one element at a time

    >>> print(df1.drop(["Mary", "Francis"]))

    # or remove an entire column

    # to do this, we must specify axis 1 (the default axis 0 indicates rows)

    >>> df1.drop("Height", axis = 1)

    Names     Pref_food Sex  Weight

    Simon         steak   m      85

    Kate          pizza   f      65

    Francis       pasta   m      68

    Laura         pizza   f      45

    Mary     vegetables   f      43

    Julian        steak   m      72

    Rosie       seafood   f      46

    ```


    To remove multiple columns, include them in a list:


    ```

    >>> df.drop(["column1", "column2"], axis = 1)

    # instead of specifying the axis as 1, we can also specify "columns"

    >>> df.drop(["column1", "column2"], axis = "columns")

    ```


    The `pandas` package also allows us to create cross-tabs with the same function.
    For instance, in the `df1` dataset, we can create a cross-tab that correlates
    gender with favorite food:


    ```

    >>> pd.crosstab(df1.Sex, df1.Pref_food)

    Pref_food  pasta  pizza  seafood  steak  vegetables

    Sex

    f              0      2        1      0           1

    m              1      0        0      2           0

    ```


    When we add the `margins` parameter, we also get the row with the totals:


    ```

    >>> pd.crosstab(df1.Sex, df1.Pref_food, margins = True)

    Pref_food  pasta  pizza  seafood  steak  vegetables  All

    Sex

    f              0      2        1      0           1    4

    m              1      0        0      2           0    3

    All            1      2        1      2           1    7

    ```'
