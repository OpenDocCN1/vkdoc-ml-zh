    ```

    >>> import pandas as pd

    ```


    As you can see, we import the package by creating a shortcut: `pd`. To call a
    pandas function at this point, we simply write


    ```

    pd.function_name()

    ```


    We can also import specific structures, such as `Series` and `DataFrames`:


    ```

    >>> from pandas import Series, DataFrame

    ```


    In this case, when we call up or create one of these two structures, we need not
    specify `pd` at the beginning.


    The first pandas structure is `Series`—a one-dimensional array characterized by
    an index. Let’s create our first series:


    ```

    >>> series1 = Series([25, 27, 28, 30],

    index = ["student1", "student2", "student3", "student4"])

    >>> print(series1)

    student1    25

    student2    27

    student3    28

    student4    30

    dtype: int64

    # we then use the .describe() function to get some statistical information about
    the series

    >>> series1.describe()

    count     4.000000

    mean     27.500000

    std       2.081666

    min      25.000000

    25%      26.500000

    50%      27.500000

    75%      28.500000

    max      30.000000

    dtype: float64

    ```


    Let’s look at the first element of the series:


    ```

    >>> series1[0]

    ```


    `25`


    We can also extract multiple elements:


    ```

    >>> series1[[2,3]]

    student3    28

    student4    30

    dtype: int64

    ```


    Or elements from the index:


    ```

    >>> series1["student1"]


    >>> series1[["student1", "student4"]]

    student1    25

    student4    30

    dtype: int64

    ```


    The `.index` method allows us to index the series:


    ```

    >>> series1.index

    Index([''student1'', ''student2'', ''student3'', ''student4''], dtype="object")

    ```


    We can also verify the presence of an element in a series:


    ```

    >>> ''student2'' in series1

    True

    ```


    If we did not import series and data frames separately, we can create a series
