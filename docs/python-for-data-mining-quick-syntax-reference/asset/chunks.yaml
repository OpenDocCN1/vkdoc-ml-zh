- fmt: "# Errors and Exceptions\n\nErrors and exceptions in Python are nothing more\
    \ than abnormal or unexpected events that change the normal running of our code.\
    \ An exception may be the result of invalid inputs (for example, we ask users\
    \ to enter a number and they enter a letter), hardware issues, or files or objects\
    \ are not found. There are three main types of errors:\n\n1. Syntactic\n2. Semantic\n\
    3. Logical\n\nSyntax errors are mistakes we make when writing code. They are either\
    \ spelling mistakes or syntax errors in the code.\n\n```\n# example of a syntax\
    \ error message due to the absence of the quotation mark at the bottom of the\
    \ string\n>>> print 'Hello World\nFile \"\", line 1\nprint 'Hello World\n^\nSyntaxError:\
    \ EOL while scanning string literal\n```\n\nErrors and exceptions usually cause\
    \ error messages, which we can then use to identify the error and determine whether\
    \ we can remedy it by modifying the code or handling an exception.\n\nWhen we\
    \ expect an exception to occur (called a *handled exception*), the way to remedy\
    \ it is to write suitable code. Unexpected exceptions are called *unhandled exceptions*.\n\
    \nTo handle errors and exceptions in Python, we typically use `try()`, `except()`,\
    \ and `raise()`.\n\nFor example, let’s sum two items that cannot be summed, such\
    \ as a number and a string:\n\n```\n>>> 37 + 'string'\nTypeError             \
    \                    Traceback (most recent call last)\n in ()\n----> 1 37 + 'string'\n\
    TypeError: unsupported operand type(s) for +: 'int' and 'str'\n# clearly, the\
    \ result is an error\n```\n\nLet’s look at the type of error in the message: `TypeError`.\
    \ We need to create a way to handle this error. For example, let’s ask users to\
    \ enter two numbers and then return the sum of the two numbers.\n\n```\n>>> try:\n\
    ... num1 = int(input('enter a number: '))\n... num2 = int(input('enter a second\
    \ number '))\n... print(num1 + num2)\nexcept TypeError:\n... print(\"There is\
    \ something wrong! Check again!\")\n>>> enter a number: 37\n>>> enter a second\
    \ number 25\n```\n\nWe managed the `TypeError` error. If users insert two numbers,\
    \ they are summed correctly.\n\nLet’s see what happens if an incorrect value is\
    \ entered rather than a number:\n\n```\n>>> try:\n... num1 = int(input('enter\
    \ a number: '))\n... num2 = int(input('enter a second number '))\n... print(num1\
    \ + num2)\nexcept TypeError:\n... print(\"There is something wrong! Check again!\"\
    )\n>>> enter a number: 37\n>>> enter a second number string\nValueError      \
    \                          Traceback (most recent call last)\n in ()\n1 try:\n\
    2     num1 = int(input('enter a number: '))\n----> 3     num2 = int(input('enter\
    \ a second number '))\n4     print(num1 + num2)\n5 except TypeError:\nValueError:\
    \ invalid literal for int() with base 10: 'string'\n```\n\nThere is a problem!\
    \ We managed the `TypeError` error, but now there is a different error. We can\
    \ handle this as follows:\n\n```\n>>> try:\n... num1 = int(input('enter a number:\
    \ '))\n... num2 = int(input('enter a second number '))\n... print(num1 + num2)\n\
    except TypeError:\n... print(\"There is something wrong! Check again!\")\nexcept\
    \ ValueError:\n... print(\"There is something wrong! Check again!\")\nenter a\
    \ number: 37\nenter a second number string\nThere is something wrong! Check again!\n\
    ```\n\nOr, we manage the exception with `Exception`:\n\n```\n>>>try:\n... num1\
    \ = int(input('enter a number: '))\n... num2 = int(input('enter a second number\
    \ '))\n... print(num1 + num2)\nexcept Exception:\n... print(\"There is something\
    \ wrong! Check again!\")\n>>> enter a number: 37\n>>> enter a second number test\n\
    There is something wrong! Check again!\n```\n\n`Exception` is a class of basic\
    \ errors that includes most errors. Other common types, as we just saw, are `TypeError`\
    \ and `ValueError`, but there are others: `AttributeError`, `EOFError`, `IOError`,\
    \ `IndexError`, `KeyError`, `KeyboardInterrupt`, `NameError`, `StopIteration`,\
    \ and `ZeroDivisionError`.\n\n## Summary\n\nIn this chapter we studied basic concepts\
    \ of programming in Python: modules and methods, list comprehension and class\
    \ creation, regular expressions, and errors and exceptions. In Chapter [7](#469457_1_En_7_Chapter.xhtml),\
    \ we learn about importing files.\n\n# 7. Importing Files\n\nImporting a file\
    \ to Python is important to learning how to manage datasets. In this chapter we\
    \ examine the basics. We can import many types of data to Python: from the most\
    \ canonical format (`.csv`) or Excel data formats, to text formats for text mining,\
    \ and to binary files such as images, video and audio. First, let’s look at some\
    \ basic ways to import files. Sometimes the process for doing so may seem a bit\
    \ tricky. The `pandas` package, which we examine in Chapter [8](#469457_1_En_8_Chapter.xhtml),\
    \ makes importing datasets for analysis much easier.\n\nThe basic structure for\
    \ importing files is as follows:\n\n```\nfile1 = open(\"file.name\", mode)\n```\n\
    \n`mode` represents the way we open a file. The most important ways are:\n\n-\
    \ Read only (`\"r\"`)\n- Write (`\"w\"`)\n- Append some text at the end of the\
    \ document (`\"a\"`)\n- Read and write (`\"r+\"`)\n\nWe use the `open()` function\
    \ to open the file. If the file does not exist, it is created in the work directory.\n\
    \n```\n# we open (or create) the file\n>>> file1 = open(\"file1.txt\",\"w\")\n\
    # at the moment, the file was created in our work directory but it is empty\n\
    # we are in write mode; we then add text this way\n>>> file1.write(\"Add line\
    \ n.1 to the file1\")\n# we close the file\n>>> file1.flush()\n>>> file1.close()\n\
    # we open the file in read mode\n>>> file1 = open(\"file1.txt\", \"r\")\n# we\
    \ create an object that contains our file and display it with the print() function\n\
    >>> text1 = file1.read()\n>>> print(text1)\nAdd line 1 to file1\n# we close the\
    \ file\n>>> file1.close()\n# we reopen the file in write mode\n>>> file1 = open(\"\
    file1.txt\",\"w\")\n# if we write the new text now, the line we had written previously\
    \ is replaced\n>>> file1.write(\"Let's replace the first line with this new one\"\
    )\n# we test\n>>> file1.flush()\n>>> file1.close()\n>>> file1 = open(\"file1.txt\"\
    , \"r\")\n>>> text2 = file1.read()\n>>> print(text2)\nLet's replace the first\
    \ line with this new one\n>>> file1.close()\n# to add text without overwriting,\
    \ we open the file in append mode\n>>> file1 = open(\"file1.txt\", \"a\")\n>>>\
    \ file1.write(\"\\n Add a second line to this new version of the file\")\n>>>\
    \ file1.close()\n>>> file1 = open(\"file1.txt\", \"r\")\n>>> text3 = file1.read()\n\
    >>> print(text3)\nWe replace the first line with this new one\nAdd a second line\
    \ to this new version of the file\n# we can verify the length of the text with\
    \ the len() function\nlen(text3)\n```\n\nWe can also create a small function that\
    \ reads every line of the file:\n\n```\n>>> file1 = open(\"file1.txt\", \"r\"\
    )\n>>> for line in file1:\n...        print(line, end = \"\")\n```\n\nOr proceed\
    \ as follows:\n\n```\n>>> with open(\"file1.txt\", \"a\") as file:\n...      \
    \  file1.write(\"this is the third line\")\n```\n\nTable [7-1](#469457_1_En_7_Chapter.xhtml#Tab1)\
    \ provides a summary of the modes used to open a file.\n\n**Table 7-1** Modes\
    \ for Opening a File\n\n| Mode | Description |\n| --- | --- |\n| `'r'` | Read\
    \ only, default mode |\n| `'rb'` | Read only in binary format |\n| `'r+'` | Read\
    \ and write |\n| `'rb+'` | Read and write in binary format |\n| `'w'` | Write\
    \ |\n| `'wb'` | Write in binary format only. Overwrites an existing file. If the\
    \ file does not exist, a new one is created. |\n| `'w+'` | Read and write. Overwrites\
    \ an existing file. If the file does not exist, a new one is created. |\n| `'wb+'`\
    \ | Read and write in binary format. Overwrites an existing file. If the file\
    \ does not exist, a new one is created. |\n| `'a'` | Adds to an existing file\
    \ without overwriting. If the file does not exist, a new one is created. |\n|\
    \ `'ab'` | Adds to an existing file or creates a new binary file |\n| `'a+'` |\
    \ Reads, adds, and overwrites a new file (or creates a new one) |\n| `'ab+'` |\
    \ Reads and adds in binary format; overwrites a new file or creates a new one\
    \ |"
