    ## Introduction


    **Translated by Nicola Menicacci**


    Python is an interpreted, interactive, and object-oriented language. It features
    a library of functions, is extendable (as it can be used to create new modules
    easily), and is available for all operating systems. For these and other reasons,
    it is also one of the most used programming languages when it comes to data mining
    and machine learning.


    My goal is to accompany you as you start to study this programming language, show
    you basic concepts, and then help you move on to data mining. We’ll begin by looking
    at how to use Python and its structures, how to install Python, and how to determine
    which tools are best suited for data analysis, and then switch to an introduction
    to data mining packages. *Python for Data Mining Quick Syntax Reference* is an
    introductory book. It provides guidance—from taking your first programming steps
    with Python, to manipulating and importing datasets, to examining examples of
    data analysis. It does not explain fully topics such as machine learning and statistics
    using Python, which are beyond the scope of this volume.


    ## Who This Book Is For


    This book is intended for those of you who want to gain a better understanding
    of the Python programming language from a data analysis perspective. We will start
    by reviewing Python’s basic concepts, then focus on the most used packages for
    data analysis. To download the code, to delve more deeply into some topics, and
    to acquire more practical information about Python and data mining, please visit
    my website ( [**Datawiring.me**](http://datawiring.me/) ). From the site’s home
    page, you can subscribe to my newsletter to receive updates about the latest in
    Python coding and other news. My advice for those of you who are beginning programmers
    is to write the code manually to gain a greater understanding of it.


    ## How This Book Is Organized


    *Python for Data Mining Quick Syntax Reference* consists of 11 chapters. In Chapter
    [1](#469457_1_En_1_Chapter.xhtml) , we look at some basic installation concepts
    and the tools available for programming in Python. We also examine differences
    between Python2 and Python3 and learn how to set up a work folder.


    In Chapter [2](#469457_1_En_2_Chapter.xhtml) , we study some basic concepts about
    creating objects, entering comments, and reserving words for the system; and look
    at the various types of operators that are part of the grammar of the Python programming
    language.


    In Chapter [3](#469457_1_En_3_Chapter.xhtml) , we extend our work with basic Python
    structures—such as tuples, lists, dictionaries, sets, strings, and files—and learn
    how to create and convert them.


    In Chapter [4](#469457_1_En_4_Chapter.xhtml) , we create small, basic functions
    and learn how to save them.


    Chapter [5](#469457_1_En_5_Chapter.xhtml) deals with conditional instructions
    that allow us to extend the power of a function. In addition, we review other
    important functions as well.


    In Chapter [6](#469457_1_En_6_Chapter.xhtml) , we investigate basic concepts related
    to object-oriented programming and examine the concepts of modules, methods, and
    error handling.


    Chapter [7](#469457_1_En_7_Chapter.xhtml) is dedicated to importing files using
    some of the basic features we have learned. We learn how to open and edit text
    files in `.csv` format, in addition to various other formats.


    Chapters [8](#469457_1_En_8_Chapter.xhtml) through [11](#469457_1_En_11_Chapter.xhtml)
    explain Python’s most important data mining packages: NumPy and SciPy for mathematical
    functions and random data generation, pandas for dataframe management and data
    import, Matplotlib for drawing charts, and scikit-learn for machine learning.
    With regard to scikit-learn, the discussion is limited to basic coverage of the
    code of the various algorithms. Because of the complexity of the topic, we do
    not examine the details for the various techniques.


    ### About the Author and About the Technical Reviewer


    ### About the Author


    ### About the Technical Reviewer


    # 1. Getting Started


    Python is one of the most important programming languages used in data science.
    In this chapter, you’ll learn how to install Python and review some of the integrated
    development environments (IDEs) used for data analysis. You’ll also learn how
    to set up a working directory on your computer.


    ## Installing Python


    Python2 and Python3 can be downloaded easily from [`https://www.python.org/downloads/`](https://www.python.org/downloads/)
    (Figure [1-1](#469457_1_En_1_Chapter.xhtml#Fig1)) and then installed. Note that
    if you are working on a Unix system using a Mac or Linux, Python is preinstalled.
    Simply type `python` to load the program.


    ![../images/469457_1_En_1_Chapter/469457_1_En_1_Fig1_HTML.jpg](images/469457_1_En_1_Chapter/469457_1_En_1_Fig1_HTML.jpg)


    Figure 1-1 Python home page


    From the [python.org](http://python.org/) ( [http://python.org/](http://python.org/)
    ) website, click Downloads then select the appropriate version to use based on
    your operating system. Then, follow the on-screen instructions to install Python.'
