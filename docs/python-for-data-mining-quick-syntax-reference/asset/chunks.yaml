    >>> import pandas as pd

    ```


    如你所见，我们通过创建一个简写 `pd` 来导入该包。此时，要调用 pandas 函数，我们只需编写


    ```

    pd.function_name()

    ```


    我们也可以导入特定的结构，例如 Series 和 DataFrames：


    ```

    >>> from pandas import Series, DataFrame

    ```


    在这种情况下，当我们调用或创建这两个结构之一时，开头无需指定“pd”。


    第一个 pandas 结构是 Series——一种由索引标识的一维数组。让我们创建第一个序列：


    ```

    >>> series1 = Series([25, 27, 28, 30],

    index = ["student1", "student2", "student3", "student4"])

    >>> print(series1)

    student1    25

    student2    27

    student3    28

    student4    30

    dtype: int64

    # 然后我们使用 .describe() 函数获取关于该序列的一些统计信息

    >>> series1.describe()

    count     4.000000

    mean     27.500000

    std       2.081666

    min      25.000000

    25%      26.500000

    50%      27.500000

    75%      28.500000

    max      30.000000

    dtype: float64

    ```


    让我们查看序列的第一个元素：


    ```

    >>> series1[0]

    ```


    `25`


    我们也可以提取多个元素：


    ```

    >>> series1[[2,3]]

    student3    28

    student4    30

    dtype: int64

    ```


    或者通过索引提取元素：


    ```

    >>> series1["student1"]


    >>> series1[["student1", "student4"]]

    student1    25

    student4    30

    dtype: int64

    ```


    `.index` 方法允许我们对序列进行索引：


    ```

    >>> series1.index

    Index([''student1'', ''student2'', ''student3'', ''student4''], dtype="object")

    ```


    我们还可以验证序列中是否存在某个元素：


    ```

    >>> ''student2'' in series1

    True

    ```


    如果我们没有单独导入 series 和 data frames，我们可以通过指定使用 pandas 库来创建一个序列：


    ```

    >>> series2 = pd.Series([40, 20, 35, 70],

    index = ["price1", "price2", "price3", "price4"])

    # 如果我们没有以 pd 别名导入 pandas，我们可以指定完整的包名

    >>> pandas.Series([40, 20, 35, 70],

    index = ["price1", "price2", "price3", "price4"])

    ```


    pandas 序列由索引标记。如果我们不指定索引，它会自动创建：


    ```

    >>> series3 = Series([25, 27, 28, 30])

    series3

    0    25

    1    27

    2    28

    3    30

    dtype: int64

    ```


    要替换序列中的某些元素，我们使用 `.replace` 方法。


    ```

    >>> series3.replace([25, 27], [125, 127])

    0    125

    1    127

    2     28

    3     30

    dtype: int64

    ```


    让我们创建另一个序列：一个包含随机数的序列。为此，我们需要加载 NumPy 库：


    ```

    >>> import numpy as np

    # 我们创建一个随机数序列

    >>> series4 = pd.Series(np.random.randn(7))

    # 打印它并检查索引

    series4

    0   -0.227393

    1   -1.079208

    2    0.101591

    3    0.157502

    4    1.541307

    5   -0.182501

    6   -0.247327

    dtype: float64

    # 我们可以使用 .index() 方法修改索引

    >>> series4.index = [''a'', ''b'', ''c'', ''d'', ''e'', ''f'', ''g'']

    # 并再次检查索引

    series4

    a   -0.227393

    b   -1.079208

    c    0.101591

    d    0.157502

    e    1.541307

    f   -0.182501

    g   -0.247327

    dtype: float64

    # 我们创建另一个随机序列

    >>> series5 = pd.Series(np.random.randn(7))

    # 然后使用 .concat() 方法合并这两个序列

    >>> s45 = pd.concat([series4, series5])

    # 打印创建的序列

    >>> s45

    a   -0.227393

    b   -1.079208

    c    0.101591

    d    0.157502

    e    1.541307

    f   -0.182501

    g   -0.247327

    0   -0.610507

    1    0.282318

    2   -1.142692

    3   -1.081449

