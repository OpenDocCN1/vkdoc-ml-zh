    Hi!\n```\n\nA string can be composed of single words, parts of sentences, or whole\
    \ sentences. Be careful when using single quotes because they may create confusion,\
    \ for example, with apostrophes:\n\n```\n>>> string3 = 'I'd like to code in Python'\n\
    File \"\", line 1\nstring3 = 'I'd like to code in Python'\n^\nSyntaxError: invalid\
    \ syntax\n>>> string4 = \"I'd like to code in Python\"\n>>> string4\n\"I'd like\
    \ to code in Python\"\n```\n\nHowever, we can include quotation marks with a backslash\
    \ as follows:\n\n```\n>>> haml = \"Hamlet said: \\\"to be or not to be ...\\\"\
    . Oratio answered \"\n>>> haml\n'Hamlet said: \"to be or not to be ...\". Oratio\
    \ answered '\n```\n\nThere are some control characters that could be also useful.\
    \ For example, “\\n” indicates a new line:\n\n```\n>>> haml2 = \"Hamlet said:\
    \ to be or not to be \\n Oratio answered ...\"\n>>> print(haml2)\nHamlet said:\
    \ to be or not to be\nOratio answered ...\n```\n\nIn addition, “\\t” indicates\
    \ a tab:\n\n```\n>>> haml3 = \"Hamlet said: to be or not to be \\t Oratio answered\
    \ ...\"\n>>> print(haml3)\nHamlet said: to be or not to be   Oratio answered ...\n\
    ```\n\nOperators that can be used when referring to strings, including the concatenation\
    \ operator “+”:\n\n```\n>>> string1 + string2\n'Hi!Hello'\n```\n\nOr repetition\
    \ operator “*”:\n\n```\n>>> string1*10\n'Hi!Hi!Hi!Hi!Hi!Hi!Hi!Hi!Hi!Hi!'\n```\n\
    \nWe can enter three quotation marks to mark the beginning and end of a string\
    \ that extends over several lines:\n\n```\n>>> string5 = \"\"\"I'd\n... like\n\
    ... to\n... code\n... in Python\n... \"\"\"\n>>> print(string5)\nI'd\nlike\nto\n\
    code\nin Python\n```\n\nWe verify the class of a string with the type() function:\n\
    \n```\n>>> type(string1)\n\n```\n\nAnd check the length with the `len()` function:\n\
    \n```\n>>> len(string1)\n\n```\n\nTo verify the object id, we use the id() function:\n\
    \n```\n>>> id(string1)\n\n```\n\nWe can also display parts of a string:\n\n```\n\
    >>> string1[0]\n'H'\n>>> string2[2]\n'l'\n>>> string4[-1]\n'n'\n>>> haml[1:10]\n\
    'amlet sai'\n>>> haml[5:]\n't said: \"to be or not to be ...\". Oratio answered\
    \ '\n>>> haml[:10]\n'Hamlet sai'\n>>> haml[:-2]\n'Hamlet said: \"to be or not\
    \ to be ...\". Oratio answere'\n# the following notation is used to reverse a\
    \ string (or even just a part of it)\n>>> haml[::-1]\n' derewsna oitarO .\"...\
    \ eb ot ton ro eb ot\" :dias telmaH'\n```\n\nThe most important functions associated\
    \ with strings allow you to start, for example, an uppercase string. We can do\
    \ this by using the capitalize() method:\n\n```\n>>> string6 = \"let's do a little\
    \ test\"\n>>> string6.capitalize()\n\"Let's do a little test\"\n```\n\nOther functions\
    \ allow you to put an entire string in uppercase or lowercase letters:\n\n```\n\
    >>> string6.upper()\n\"LET'S DO A LITTLE TEST\"\n>>> string7 = string6.upper()\n\
    >>> string7\n\"LET'S DO A LITTLE TEST\"\n>>> string7.lower()\n\"let's do a little\
    \ test\"\n```\n\nThe .find method, the .index method, and the .count method are\
    \ used to look for one or more characters in a string:\n\n```\n>>> string7.find(\"\
    TT\")\n\n>>> string7.index('D')\n\n>>> string7.count('L')\n\n```\n\nThe strip()\
    \ functions removes blank spaces at the beginning and end of a string:\n\n```\n\
    >>> string8 = \"     test     \"\n>>> string8.strip()\n'test'\n```\n\nThe replace()\
    \ function allows us to replace part of a string with another element:\n\n```\n\
    >>> string9 = \"Let's do some tests\"\n>>> string9.replace(\"some\", \"a couple\
    \ of\")\n\"Let's do a couple of tests\"\n```\n\nWe can verify the presence of\
    \ a substring in our string like this:\n\n```\n>>> \"do\" in string9\nTrue\n>>>\
    \ \"ueioua\" in string9\nFalse\n```\n\nWith the split() function, we can break\
    \ a string into a list of multiple elements:\n\n```\n>>> string9.split()\n[\"\
    Let's\", 'do', 'a', 'little', 'test']\n```\n\nThe join() function allows us to\
    \ group a list into a single string:\n\n```\n>>> \"-\".join([\"03\", \"01\", \"\
    2017\"])\n'03-01-2017'\n```\n\nIn the previous example, a hyphen has been inserted\
    \ as a separator. The following example does not include a separator. The items\
    \ are thus listed consecutively:\n\n```\n>>> \"\".join([\"a\", \"b\", \"c\", \"\
    d\"])\n'abcd'\n# in this case we insert a space\n>>> \" \".join([\"a\", \"b\"\
    , \"c\", \"d\"])\n'a b c d'\n```\n\nStrings are subject to immutability—meaning,\
    \ they cannot be modified. Even if we can always reuse a name and overwrite it\
    \ with another object inside it, but it will be a different object for all it\
    \ means. Let’s look at an example:\n\n```\n# we create a string\n>>> string1 =\
    \ \"a b c d e f g\"\n# we try to replace the first element \"a\" with \"x\"\n\
    >>> string1[0] = 'x'\nTraceback (most recent call last):\nFile \"\", line 1, in\
    \ \nTypeError: 'str' object does not support item assignment\n# as you can see,\
    \ we get an error because we can't change the string this way\n```\n\nThe % modulus\
    \ operator allows advanced string formatting. The % operator is used to search\
    \ in the string for elements preceded by % and replaces them with the value or\
    \ values contained in the list that follows it. The % symbol must be followed\
    \ by a character that indicates the type of data we are entering in the string.\
    \ To print the contents of two strings, we use “%s” like this:\n\n```\n# we create\
    \ a first string\n>>> string1 = 'test'\n# if we want to print this part of the\
    \ text and merge our string, we enter %s before closing the quotation marks and\
    \ then insert % (string)\n>>> print 'my string says: %s' %(string1)\nmy string\
    \ says: test\n```\n\nWe can use a loop to scroll a string:\n\n```\n>>> for letter\
    \ in string1: print(letter)\n...\nt\ne\ns\nt\n```\n\nWe can count the number of\
    \ letters in a string:\n\n```\n>>> word = \"string test\"\n>>> count = 0\n>>>\
    \ for letter in word :\n...        count = count + 1\n...        print(count)\n\
    \n```\n\n### Caution\n\nPython2 and Python3 manage strings a bit differently.\
    \ In Python3, in fact, print() is a function and requires parentheses.\n\n```\n\
    # string management in Python2\n>>> print 'Hello world'\nHello world\n# string\
    \ management in Python3\n>>> print 'Hello world'\nFile \"\", line 1\nprint 'Hello\
    \ world'\n^\nSyntaxError: Missing parentheses in call to 'print'\n>>> print('Hello\
    \ world')\nHello world\n# to handle strings in Python2 as they are handled in\
    \ Python3, we can import the future module:\n# use of future module in Python2\n\
    >>> from __future__ import print_function\n>>> print('Hello world')\nHello world\n\
    ```\n\n## Files\n\nIn addition to the features we examined, we also typically\
    \ import files to analyze from our computer or from the Internet. Files are often\
    \ structured as dataframes, but we can also import images, audio, binary, text,\
    \ or other proprietary formats, such as SPSS, SAS, a database, and so on. We learn\
    \ how to import the simplest formats, such as .csv, in Chapter [6](#469457_1_En_6_Chapter.xhtml)."
  trans: "\n## 字符串\n\n字符串是由单引号或双引号括起来的字符序列。它们是**不可变**对象，但可以重复和组合，也可以提取部分内容。我们这样编写字符串：\n\
    \n```\n>>> string1 = \"Hi!\"\n# 并打印它\n>>> string1\n'Hi!'\n# 或者用单引号这样写\n>>> string2\
    \ = 'Hello'\n>>> string2\n'Hello'\n# 我们可以通过写变量名或使用 print() 函数来打印字符串\n>>> print(string1)\n\
    Hi!\n```\n\n字符串可以由单个单词、句子片段或完整句子组成。使用单引号时要小心，因为它们可能会造成混淆，例如与撇号一起使用时：\n\n```\n\
    >>> string3 = 'I'd like to code in Python'\nFile \"\", line 1\nstring3 = 'I'd\
    \ like to code in Python'\n^\nSyntaxError: invalid syntax\n>>> string4 = \"I'd\
    \ like to code in Python\"\n>>> string4\n\"I'd like to code in Python\"\n```\n\
    \n不过，我们可以用反斜杠来包含引号，如下所示：\n\n```\n>>> haml = \"Hamlet said: \\\"to be or not to\
    \ be ...\\\". Oratio answered \"\n>>> haml\n'Hamlet said: \"to be or not to be\
    \ ...\". Oratio answered '\n```\n\n还有一些控制字符也很有用。例如，“\\n”表示换行：\n\n```\n>>> haml2\
    \ = \"Hamlet said: to be or not to be \\n Oratio answered ...\"\n>>> print(haml2)\n\
    Hamlet said: to be or not to be\nOratio answered ...\n```\n\n此外，“\\t”表示制表符：\n\n\
    ```\n>>> haml3 = \"Hamlet said: to be or not to be \\t Oratio answered ...\"\n\
    >>> print(haml3)\nHamlet said: to be or not to be   Oratio answered ...\n```\n\
    \n引用字符串时可以使用的运算符，包括连接运算符“+”：\n\n```\n>>> string1 + string2\n'Hi!Hello'\n```\n\n\
    或重复运算符“*”：\n\n```\n>>> string1*10\n'Hi!Hi!Hi!Hi!Hi!Hi!Hi!Hi!Hi!Hi!'\n```\n\n我们可以输入三个引号来标记跨越多行的字符串的开始和结束：\n\
    \n```\n>>> string5 = \"\"\"I'd\n... like\n... to\n... code\n... in Python\n...\
    \ \"\"\"\n>>> print(string5)\nI'd\nlike\nto\ncode\nin Python\n```\n\n我们使用 `type()`\
    \ 函数验证字符串的类：\n\n```\n>>> type(string1)\n\n```\n\n并使用 `len()` 函数检查长度：\n\n```\n\
    >>> len(string1)\n\n```\n\n要验证对象 ID，我们使用 `id()` 函数：\n\n```\n>>> id(string1)\n\n\
    ```\n\n我们还可以显示字符串的一部分：\n\n```\n>>> string1[0]\n'H'\n>>> string2[2]\n'l'\n>>> string4[-1]\n\
    'n'\n>>> haml[1:10]\n'amlet sai'\n>>> haml[5:]\n't said: \"to be or not to be\
    \ ...\". Oratio answered '\n>>> haml[:10]\n'Hamlet sai'\n>>> haml[:-2]\n'Hamlet\
    \ said: \"to be or not to be ...\". Oratio answere'\n# 以下表示法用于反转字符串（或仅反转其一部分）\n\
    >>> haml[::-1]\n' derewsna oitarO .\"... eb ot ton ro eb ot\" :dias telmaH'\n\
    ```\n\n与字符串相关的最重要的函数允许你执行例如将字符串首字母大写的操作。我们可以通过使用 `capitalize()` 方法来实现：\n\n```\n\
    >>> string6 = \"let's do a little test\"\n>>> string6.capitalize()\n\"Let's do\
    \ a little test\"\n```\n\n其他函数允许你将整个字符串转换为大写或小写字母：\n\n```\n>>> string6.upper()\n\
    \"LET'S DO A LITTLE TEST\"\n>>> string7 = string6.upper()\n>>> string7\n\"LET'S\
    \ DO A LITTLE TEST\"\n>>> string7.lower()\n\"let's do a little test\"\n```\n\n\
    `.find` 方法、`.index` 方法和 `.count` 方法用于在字符串中查找一个或多个字符：\n\n```\n>>> string7.find(\"\
    TT\")\n\n>>> string7.index('D')\n\n>>> string7.count('L')\n\n```\n\n`strip()`\
    \ 函数用于删除字符串开头和结尾的空白字符：\n\n```\n>>> string8 = \"     test     \"\n>>> string8.strip()\n\
    'test'\n```\n\n`replace()` 函数允许我们用另一个元素替换字符串的一部分：\n\n```\n>>> string9 = \"Let's\
    \ do some tests\"\n>>> string9.replace(\"some\", \"a couple of\")\n\"Let's do\
    \ a couple of tests\"\n```\n\n我们可以像这样验证字符串中是否存在子字符串：\n\n```\n>>> \"do\" in string9\n\
    True\n>>> \"ueioua\" in string9\nFalse\n```\n\n使用 `split()` 函数，我们可以将字符串拆分为包含多个元素的列表：\n\
    \n```\n>>> string9.split()\n[\"Let's\", 'do', 'a', 'little', 'test']\n```\n\n\
    `join()` 函数允许我们将一个列表组合成一个字符串：\n\n```\n>>> \"-\".join([\"03\", \"01\", \"2017\"\
    ])\n'03-01-2017'\n```\n\n在前面的示例中，插入了连字符作为分隔符。以下示例不包含分隔符。因此，这些项目是连续列出的：\n\n```\n\
    >>> \"\".join([\"a\", \"b\", \"c\", \"d\"])\n'abcd'\n# 在这个例子中，我们插入一个空格\n>>> \"\
    \ \".join([\"a\", \"b\", \"c\", \"d\"])\n'a b c d'\n```\n\n字符串具有不可变性——这意味着它们不能被修改。即使我们总是可以重复使用一个名称并用另一个对象覆盖它，但就其所有含义而言，它将是一个不同的对象。让我们看一个例子：\n\
    \n```\n# 我们创建一个字符串\n>>> string1 = \"a b c d e f g\"\n# 我们尝试将第一个元素 \"a\" 替换为 \"\
    x\"\n>>> string1[0] = 'x'\nTraceback (most recent call last):\nFile \"\", line\
    \ 1, in \nTypeError: 'str' object does not support item assignment\n# 如你所见，我们收到一个错误，因为我们无法以这种方式更改字符串\n\
    ```\n\n`%` 模运算符允许高级字符串格式化。`%` 运算符用于在字符串中搜索以 `%` 开头的元素，并用其后列表中包含的一个或多个值替换它们。`%`\
    \ 符号后面必须跟一个字符，该字符指示我们正在输入字符串的数据类型。要打印两个字符串的内容，我们像这样使用 `%s`：\n\n```\n# 我们创建第一个字符串\n\
    >>> string1 = 'test'\n# 如果我们想打印这段文本并合并我们的字符串，我们在结束引号前输入 %s，然后插入 % (string)\n>>>\
    \ print 'my string says: %s' %(string1)\nmy string says: test\n```\n\n我们可以使用循环来遍历字符串：\n\
    \n```\n>>> for letter in string1: print(letter)\n...\nt\ne\ns\nt\n```\n\n我们可以计算字符串中的字母数量：\n\
    \n```\n>>> word = \"string test\"\n>>> count = 0\n>>> for letter in word :\n...\
    \        count = count + 1\n...        print(count)\n\n```\n\n### 注意\n\nPython2\
    \ 和 Python3 对字符串的管理略有不同。实际上，在 Python3 中，`print()` 是一个函数，需要括号。\n\n```\n# Python2\
    \ 中的字符串管理\n>>> print 'Hello world'\nHello world\n# Python3 中的字符串管理\n>>> print\
    \ 'Hello world'\nFile \"\", line 1\nprint 'Hello world'\n^\nSyntaxError: Missing\
    \ parentheses in call to 'print'\n>>> print('Hello world')\nHello world\n# 为了像在\
    \ Python3 中那样处理 Python2 中的字符串，我们可以导入 future 模块：\n# Python2 中 future 模块的使用\n>>>\
    \ from __future__ import print_function\n>>> print('Hello world')\nHello world\n\
    ```\n\n## 文件\n\n除了我们检查过的功能之外，我们通常还会从计算机或互联网导入文件进行分析。文件通常被结构化为数据框，但我们也可以导入图像、音频、二进制、文本或其他专有格式，例如\
    \ SPSS、SAS、数据库等。我们将在第 6 章学习如何导入最简单的格式，例如 `.csv`。\n"
- fmt: "# Immutability\n\nAs mentioned, immutability is a characteristic of some Python\
    \ structures: Once created, the structure cannot be modified (see Table [3-2](#469457_1_En_3_Chapter.xhtml#Tab2)).\
    \ We can reuse a name and overwrite the structure with another object inside it,\
    \ but it will be different for all intents and purposes.\n\nTable 3-2\n\nData\
    \ Structures and Immutability\n\n| Structure | Mutable |\n| --- | --- |\n| Lists\
    \ | ![../images/469457_1_En_3_Chapter/469457_1_En_3_Figa_HTML.jpg](images/469457_1_En_3_Chapter/469457_1_En_3_Figa_HTML.jpg)\
    \ |\n| Dictionaries | ![../images/469457_1_En_3_Chapter/469457_1_En_3_Figb_HTML.jpg](images/469457_1_En_3_Chapter/469457_1_En_3_Figb_HTML.jpg)\
    \ |\n| Tuples | ![../images/469457_1_En_3_Chapter/469457_1_En_3_Figc_HTML.jpg](images/469457_1_En_3_Chapter/469457_1_En_3_Figc_HTML.jpg)\
    \ |\n| Sets | ![../images/469457_1_En_3_Chapter/469457_1_En_3_Figd_HTML.jpg](images/469457_1_En_3_Chapter/469457_1_En_3_Figd_HTML.jpg)\
    \ |\n| Strings | ![../images/469457_1_En_3_Chapter/469457_1_En_3_Fige_HTML.jpg](images/469457_1_En_3_Chapter/469457_1_En_3_Fige_HTML.jpg)\
    \ |\n\nLet’s look at more examples. We start first with a list, which is a mutable\
    \ object:\n\n```\n# we create a list\n>>> list1 = [\"jan\", \"feb\", \"mar\",\
    \ \"apr\"]\n# we check the type of object\n>>> type(list1)\n\n# and check the\
    \ ID of the created list\n>>> id(list1)\n\n# we add an element\n>>> list1.append(\"\
    oct\")\n# we reprint the list\n>>> list1\n['jan', 'feb', 'mar', 'apr', 'oct']\n\
    # and check the ID again\n>>> id(list1)\n\n# as you can see, the ID is identical\n\
    ```\n\nNow, let’s create a tuple, which is an immutable object:\n\n```\n>>> tuple1\
    \ = (1,2,3,4)\n# we check the object class\n>>> type(tuple1)\n\n# and verify the\
    \ ID\n>>> id(tuple1)\n\n# we then try to add an element\n>>> tuple1.append(5)\n\
    Traceback (most recent call last):\nFile \"\", line 1, in \nAttributeError: 'tuple'\
    \ object has no attribute 'append'\n# we recreate the tuple that also contains\
    \ the last object\n>>> tuple1 = (1,2,3,4,5)\n# and print its contents\n>>> tuple1\n\
    (1, 2, 3, 4, 5)\n# and verify the ID\n>>> id(tuple1)\n\n# as seen, we did not\
    \ overwrite the first object; we created a second object with the same name (the\
    \ first tuple1 object is no longer available)\n```\n\nLast, let’s examine some\
    \ examples with strings, which are immutable:\n\n```\n# we create a string\n>>>\
    \ string1 = \"a b c d e f g\"\n# and try to replace the first element \"a\" with\
    \ \"x\" String1 [0] = 'x'\nTraceback (most recent call last):\nFile \"\", line\
    \ 1, in \nTypeError: 'str' object does not support item assignment\n# we get an\
    \ error\n```\n\n# Converting Formats\n\nWe can transform one structure to another\
    \ quite easily with the help of some functions.\n\n```\n# let's create some objects\n\
    >>> tuple1 = (1,2,3,4,5)\n>>> list1 = [\"jan\", \"feb\", \"mar\", \"apr\"]\n>>>\
    \ string1 = \"2017\"\n>>> int1 = 67\n# we check the type of objects\n>>> type(tuple1)\n\
    \n>>> type(list1)\n\n>>> type(string1)\n\n>>> type(int1)\n\n```\n\nTo convert\
    \ formats, we use the following functions:\n\n```\n# list() converts, for example,\
    \ a tuple to a list\n>>> convt1 = list(tuple1)\n# it is necessary to save the\
    \ result to a new object; let's do it again and recheck the type\n>>> type(convt1)\n\
    \n# from list to tuple\n>>> conv_to_list = tuple(list1)\n>>> type(conv_to_list)\n\
    \n# from string to integer\n>>> conv_to_int = int(string1)\n>>> type(conv_to_int)\n\
    \n```\n\n# Summary\n\nIn this chapter we learned how to create and manipulate\
    \ the most important basic data structures in Python. An object-oriented programming\
    \ language like Python is based on two main features: objects and actions. In\
    \ this chapter we learned more about the objects; in Chapter [4](#469457_1_En_4_Chapter.xhtml),\
    \ we focus on actions by creating functions.\n\n# 4. Functions\n\nAn object-based\
    \ programming language is structured around two major concepts: objects and functions.\
    \ An object is everything we create in a work session using a programming language\
    \ such as Python. Functions allow us to assign one or more actions to these objects.\
    \ Let’s learn how to create a function.\n\n## Some words about functions in Python\n\
    \nWith Python, we basically have two types of functions:\n\n1. The built-in functions\
    \ that are part of Python and are loaded automatically when we run Python\n\n\
    2. The functions we can build and use (user defined)\n\nA function is a piece\
    \ of code that performs one or more operations on an object and returns an output\
    \ result. Functions are especially useful when we have to do the same thing over\
    \ multiple objects. We can do this without repeating the same line of code several\
    \ times.\n\nThe two types of functions are also supported by those in the many\
    \ libraries available for installation on Python. Whenever we need a particular\
    \ function (or a package, that is a family of functions), we can install it and\
    \ use it. Anaconda does not allow us to install many of the packages we need because\
    \ they already exist in the suite.\n\nIf a package is not included in Anaconda,\
    \ we can always install it using generic terms:\n\n```\n$ conda install package_name\n\
    ```\n\nOr, we can use `pip`:\n\n```\n$ pip install package_name\n```\n\nIn any\
    \ case, the exact wording for installing a package is always included in the official\
    \ documentation of the package itself."
