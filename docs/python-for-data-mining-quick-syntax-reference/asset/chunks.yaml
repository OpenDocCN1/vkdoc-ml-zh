    ### NumPy：生成随机数与设置种子


    要生成随机数，我们需要导入 NumPy 包。


    ```

    >>> import numpy as np

    ```


    我们可以按如下方式生成一个随机数：


    ```

    >>> np.random.rand()

    0.992777076172216

    # 或者在括号内指定要自动生成的行数和列数

    >>> np.random.rand(2,3)

    array([[ 0.39352349,  0.57116926,  0.88967038],

    [ 0.76375617,  0.24620255,  0.17408501]])

    ```


    我们可以创建多维随机数数组：


    ```

    # 指定大小（10 是抽取分布的上限）

    >>> np.random.randint(10, size= 8)

    array([5, 8, 3, 7, 6, 8, 5, 3])

    # 接下来，我们创建一个包含四个案例和五个变量的数组

    >>> np.random.randint(10, size=(4, 5))

    array([[4, 7, 1, 9, 8],

    [7, 4, 0, 3, 7],

    [3, 6, 9, 3, 4],

    [4, 7, 3, 3, 9]])

    # 然后我们创建一个三维数组

    >>> np.random.randint(10, size=(4, 5, 6))

    array([[[7, 6, 1, 0, 1, 2],

    [3, 2, 3, 2, 9, 2],

    [5, 5, 6, 5, 0, 2],

    [1, 6, 2, 1, 9, 0],

    [1, 5, 3, 1, 3, 6]],

    [[0, 1, 9, 3, 4, 3],

    [2, 6, 6, 6, 6, 2],

    [2, 3, 7, 6, 2, 5],

    [1, 7, 7, 7, 0, 3],

    [3, 8, 6, 4, 1, 6]],

    [[1, 1, 2, 3, 2, 6],

    [0, 8, 1, 8, 1, 7],

    [7, 4, 3, 1, 6, 7],

    [7, 3, 1, 9, 8, 8],

    [9, 0, 1, 7, 2, 7]],

    [[3, 3, 2, 2, 5, 6],

    [4, 9, 3, 7, 4, 4],

    [8, 6, 3, 3, 7, 0],

    [9, 7, 0, 5, 2, 0],

    [3, 3, 9, 5, 2, 9]]])

    # 使用 random.rand() 生成实数；使用 random.randint() 生成整数

    ```


    我们可以设置一个种子，以确保生成相同的随机数，然后重复示例：


    ```

    >>> np.random.seed(12345)

    >>> np.random.rand()

    0.9296160928171479

    >>> np.random.rand()

    0.3163755545817859

    >>> np.random.seed(12345)

    >>> np.random.rand()

    0.9296160928171479

    >>> np.random.rand()

    0.3163755545817859

    ```


    我们可以使用 `random.randint()` 生成整数随机数：


    ```

    >>> print(random.randint(0, 100))


    >>> print(random.randint(0, 100))


    # 0 和 100 是我们可以抽取元素的界限。在这种情况下，数字 100 不能被抽取。这意味着，如果我们想模拟例如射击游戏，我们可以将界限设置在 1 和 7
    之间。

    ```


    我们也可以创建一个对象并随机抽取元素：


    ```

    >>> test1 = ["object1", "object2", "object3", "object4", "object5"]

    >>> print(random.choice(test1))

    object2

    >>> print(random.choice(test1))

    object4

    ```


    我们可以使用 `np.random.randn()` 创建另一个随机对象，它会生成一个正态分布。


    ```

    >>> x = np.random.randn(1000)

    # 我们导入 matplotlib（在第 10 章中描述）

    >>> import matplotlib.pyplot as plt

    # 并创建 x 对象的直方图

    >>> plt.hist(x, bins = 100)

    # 我们显示直方图

    >>> plt.show()

    ```


    NumPy 也可以用来生成随机数据集，例如图 9-1 中绘制的那个。但是，我们还需要加载 pandas 包。我们已经加载了 NumPy 包，所以让我们按如下步骤进行：


    ![../images/469457_1_En_9_Chapter/469457_1_En_9_Fig1_HTML.jpg](img/469457_1_En_9_Fig1_HTML.jpg)


    图 9-1


    使用 NumPy 和 pandas 创建的随机数据集图


    ```

    # 我们导入 pandas

    >>> import pandas as pd

    ```


    我们使用 pandas 的 `DataFrame()` 函数创建一个数据框。我们可以立即识别出一个函数属于哪个包，因为该函数是该包的一个方法：


    ```

    package_name.function_name()

    # 我们使用 pandas (pd) 包的 DataFrame() 函数来创建数据框，并使用 Numpy 包 (np) 的 random.randn() 函数来生成随机数据。在括号中，我们首先放入要生成的案例数（本例中为
    10），然后是变量数（本例中为 5）

    >>> rdf = pd.DataFrame(np.random.randn(10,5))

    >>> rdf

    0         1         2         3         4

    0  0.669980  0.626433 -0.693932 -0.841258 -0.165200

    1  0.108567 -0.743791  0.367369  0.645242 -0.297283

    2  1.674781  0.241534 -0.403371  0.175751  0.274626

    3 -2.339962 -0.083003 -1.387095  1.559257 -1.025012

    4  0.383104  0.968755  0.236508  0.186294  0.094319

    5  0.956150 -1.366423  0.694575 -0.107877  1.727657

    6 -0.699931 -1.184346  0.581632  0.333015 -1.137382

    7  0.867757 -0.872935  0.417772 -0.045722  0.432780

    8 -0.685488  1.046816  0.465459 -0.446164  0.227635

    9 -0.019854  0.643384  1.459784  0.559970 -0.358676

    ```


    如果我们使用相同的指令重新创建一个数据框，几乎肯定会得到不同的数据。为了获得相同的数据，我们需要使用一个允许我们设置种子的函数。这样，我们就可以复制数据。


    ```

    # 我们设置种子

    >>> np.random.seed(12345)

    # 我们创建数据框

    >>> rdf = pd.DataFrame(np.random.randn(10,5))

    # 我们可视化数据框

    rdf

    0         1         2         3         4

    0 -0.204708  0.478943 -0.519439 -0.555730  1.965781

    1  1.393406  0.092908  0.281746  0.769023  1.246435

    2  1.007189 -1.296221  0.274992  0.228913  1.352917

    3  0.886429 -2.001637 -0.371843  1.669025 -0.438570

    4 -0.539741  0.476985  3.248944 -1.021228 -0.577087

    5  0.124121  0.302614  0.523772  0.000940  1.343810

    6 -0.713544 -0.831154 -2.370232 -1.860761 -0.860757

    7  0.560145 -1.265934  0.119827 -1.063512  0.332883

    8 -2.359419 -0.199543 -1.541996 -0.970736 -1.307030

    9  0.286350  0.377984 -0.753887  0.331286  1.349742

    # 我们重新插入相同的种子

    >>> np.random.seed(12345)

    # 我们重新创建一个数据集

    >>> rdf2 = pd.DataFrame(np.random.randn(10,5))

    # 生成的数据是相同的

    >>> rdf2

    0         1         2         3         4

    0 -0.204708  0.478943 -0.519439 -0.555730  1.965781

    1  1.393406  0.092908  0.281746  0.769023  1.246435

    2  1.007189 -1.296221  0.274992  0.228913  1.352917

    3  0.886429 -2.001637 -0.371843  1.669025 -0.438570

    4 -0.539741  0.476985  3.248944 -1.021228 -0.577087

    5  0.124121  0.302614  0.523772  0.000940  1.343810

    6 -0.713544 -0.831154 -2.370232 -1.860761 -0.860757

    7  0.560145 -1.265934  0.119827 -1.063512  0.332883

    8 -2.359419 -0.199543 -1.541996 -0.970736 -1.307030

    9  0.286350  0.377984 -0.753887  0.331286  1.349742

    >>> np.random.seed(12345)

    >>> rdf = pd.DataFrame(np.random.rand(10,5))

    >>> rdf

    0         1         2         3         4

    0 -0.204708  0.478943 -0.519439 -0.555730  1.965781

    1  1.393406  0.092908  0.281746  0.769023  1.246435

    2  1.007189 -1.296221  0.274992  0.228913  1.352917

    3  0.886429 -2.001637 -0.371843  1.669025 -0.438570

    4 -0.539741  0.476985  3.248944 -1.021228 -0.577087

    5  0.124121  0.302614  0.523772  0.000940  1.343810

    6 -0.713544 -0.831154 -2.370232 -1.860761 -0.860757

    7  0.560145 -1.265934  0.119827 -1.063512  0.332883

    8 -2.359419 -0.199543 -1.541996 -0.970736 -1.307030

    9  0.286350  0.377984 -0.753887  0.331286  1.349742

    ```


    请注意，我们完全随机的变量没有名称；它们仅由数字标识。让我们更改列名：


    ```

    # 我们创建一个包含变量名称的列表

    >>> var_names = [''var1'', ''var2'', ''var3'', ''var4'', ''var5'']

    # 我们使用 .columns 方法

    >>> rdf2.columns = var_names

    # 我们检查数据框的前几个案例

    >>> rdf2.head(2)

    var1      var2      var3      var4      var5

    0 -0.204708  0.478943 -0.519439 -0.555730  1.965781

    1  1.393406  0.092908  0.281746  0.769023  1.246435

    # 变量名称是正确的

    ```


    我们可以使用其他 NumPy 函数获取其他类型的分布。


    ```

    # 二项分布

    >>> rdf_bin = pd.DataFrame(np.random.binomial(100, 0.5, (10,5)))

    >>> rdf_bin

    0   1   2   3   4

    0  47  56  48  42  53

    1  43  56  51  56  46

    2  50  42  40  55  46

    3  46  43  54  51  53

    4  41  48  47  45  42

    5  53  55  51  50  58

    6  51  57  46  53  48

    7  56  53  46  54  54

    8  53  50  52  53  46

    9  50  46  54  57  56

    # 泊松分布

    >>> rdf_poi = pd.DataFrame(np.random.poisson(100, (10,5)))

    >>> rdf_poi

    0    1    2    3    4

    0  109  107   98  111   95

    1  115  109  101  108   95

    2  105   97  102  100   94

    3   94   93   94  122   96

    4  117   85  135   90   83

    5  103  106  105   93  116

    6  111   95  100   95   80

    7   81   75   84   93  101

    8  105  109  104  104  113

    9   97  120   90   98   95

    # 均匀分布

    >>> rdf_un = pd.DataFrame(np.random.uniform(1, 100,(10,5)))

    >>> rdf_un

    0          1          2          3          4

    0  49.139046  98.433411  60.777590  76.202858  68.767153

    1  93.309206  95.028762  99.021002  13.489383  97.683461

    2  23.681460  19.419586  51.411931  53.519271  28.981285

    3  31.705992  31.678553  27.372500  59.749684  22.496303

    4  40.835909  29.567563  18.210241  23.345639  98.875500

    5  43.971084  82.990738  57.678770  65.538128  73.244077

    6  39.737081  39.893383  86.095572  81.191942  83.817845

    7  19.610805  36.600078  48.716414  96.641192  56.768005

    8  82.922981   8.534653  55.760657  55.246106  90.638916

    9  37.579379  90.215102  14.922471  10.818199  97.345143

    ```


    我们如何保存在 NumPy 中创建的数据框或数组？首先，我们创建一个数据框


    ```

    >>> tos = pd.DataFrame(np.random.randn(10,5))

    ```


    然后使用 NumPy 的 `save()` 函数保存它。


    ```

    >>> np.save(''tos_saved'', tos)

    # 我们可以在工作目录中检查它

    ```


    要加载我们保存的文件，我们使用 NumPy 中的 `load()` 函数。


    ```

    >>> load1 = np.load(''tos_saved.npy'')

    ```


    NumPy 包含其他高级数学模块，例如用于线性代数的 `numPy.linalg`，用于傅里叶变换的 `fft`，以及许多用于财务分析的函数，例如利息和期货计算。你可以在
    [`https://docs.scipy.org/doc/`](https://docs.scipy.org/doc/) 找到关于 NumPy 功能的所有必要文档。

