    ### Support Vector Machine


    Support Vector Machine (SVM) is used to determine the boundary between items belonging
    to two different classes, then projecting them into multidimensional space to
    discern the hyperplane that maximizes margins between the two sets of data.


    ```

    >>> from sklearn.svm import SVC

    >>> clf = svm.SVC(kernel=''linear'', C=1).fit(x_train, y_train)

    >>> clf.score(x_test, y_test)

    >>> from sklearn.model_selection import cross_val_predict

    >>> pred = cross_val_predict(clf, iris.data, iris.target, cv=10)

    >>> metrics.accuracy_score(iris.target, pred)

    ```


    ### Decision Trees


    The basic idea behind a decision tree is a *divide et impera* model, in which
    at each step we can reduce variability between nodes. Let’s us start with the
    entire dataset, which is then divided into smaller groups that are based more
    homogeneously and intrinsically on internal characteristics.


    ```

    >>> from sklearn.tree import DecisionTreeClassifier

    >>> dtc = DecisionTreeClassifier()

    >>> dtc = dtc.fit(x_train, y_train)

    >>> pred = dtc.predict(y_test)

    >>> sklearn.metrics.confusion_matrix(y_test, pred)

    >>> sklearn.metrics.accuracy_score(y_test, pred)

    >>> sklearn.metrics.classification_report(y_test, pred)

    ```


    ### KMeans


    KMeans is an unsupervised method of classification, which means we do not have
    a label to guide us during classification. For this reason, we choose to use clustering
    as a helpful exploratory analysis method, because it allows us to group elements
    of a dataset based on how similar or dissimilar they are.


    Clustering includes a set of methods that allows segmentation of a heterogeneous
    population into homogeneous subgroups. Of all the clustering methods available,
    KMeans is one of the important ones. The basic concept of clustering is based
    on the fact that we divide the items of a set into homogeneous groups without
    labeling them initially. Label-free data must be grouped in such a way that they
    are not only homogeneous within their clusters, but also heterogeneous to other
    elements of the other clusters. After we split our clustered items, we can classify
    new items as belonging to either cluster of the first dataset.


    ```

    >>> from sklearn.cluster import KMeans

    >>> kmeans = KMeans(n_clusters=4)

    >>> kmeans.fit(df)

    >>> pred = kmeans.predict(df)

    >>> pred

    ```


