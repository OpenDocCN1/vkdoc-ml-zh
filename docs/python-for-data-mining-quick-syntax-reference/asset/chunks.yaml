    The `iris` dataset is made up of petals and sepals of three different types of
    iris: *versicolor*, *virginica*, and *setosa*. It contains 150 equally divided
    cases on three types of flowers, and five variables.


    In the previous chapters we saw how to import a dataset in `.csv` from an external
    file on our local computer or from a website using a link. `Scikit-learn` also
    includes some of the most used dataset for data mining, like `iris` and `Boston`.
    The format used in `Scikit-learn` can result a little bit confusing for a beginner.
    All the dataset is included in a same object, but not in a tabular format like
    the `.csv` files we examined in the previous chapters. Datasets in `Scikit-learn`
    contain data in array format, the target or label (the variable we want to predict)
    and some other informations, like variable description (in the `DESCR` object)
    and the columns names in two distinct objects: `feature_names` for the variables,
    and `target_names` for the target or label.


    ```

    >>> type(iris)

    sklearn.datasets.base.Bunch

    >>> iris.keys()

    dict_keys([''data'', ''target'', ''target_names'', ''DESCR'', ''feature_names''])

    ```


    We can display the actual dataset:


