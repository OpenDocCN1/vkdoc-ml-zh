    ### 回归


    回归分析用于解释变量 y（称为*响应变量*或*因变量*）与一个或多个自变量之间的关系。


    为了计算回归，让我们从 Scikit-learn 导入正确的模型：


    ```

    >>> from sklearn.linear_model import LinearRegression

    # 我们通过创建回归模型的副本来简化工作

    >>> lr = LinearRegression()

