    # 6. Other Basic Concepts


    In this chapter, we learn about some important programming concepts (such as modules
    and methods), list comprehension and class creation, regular expressions, and
    management of errors and exceptions.


    ## Object-oriented Programming


    As mentioned, Python is an object-oriented programming language, so let’s look
    at some basic concepts of object-oriented programming. Some important concepts
    are:


    - Objects

    - Classes

    - Inheritance


    ### More on Objects


    Objects are all the data structures we have created, from smaller ones containing
    only a single number to larger ones containing large datasets. We apply objects
    to operations using features or methods that are preinstalled in libraries, that
    we import, or that we create.


    ### Classes


    As far as the class concept is concerned, this is a new topic for us in this book;
    one we have not yet examined. Python allows us to create structures linked to
    our needs through the class concept. Classes are abstract representations of an
    object that we can fill with real instances from time to time. When a new class
    is defined, we can define instances of that class. A class is defined by its own
    characteristics. For example, if we create a `Dog` class, we can stipulate that
    it be defined by features such as the shape of the head, muzzle, hair type (short
    or long), and so on. A `Book` class could include features such as book genre,
    the number of pages, the main topic, the type of cover, ISBN and so on.


    ### Inheritance


    Another concept behind object-oriented programming is inheritance. It is possible
    to create new classes from existing classes. New classes inherit the characteristics
    of the original classes, but they can extend them with new features. Inheritance
    is convenient, because it allows us to extend old classes without having to change
    them. Inheritance can be single and multiple. Through single inheritance, a subclass
    can inherit member data and methods from one existing class; in the case of multiple
    inheritance, a subclass can inherit characteristics from more than one existing
    class.


    Let’s look at a simple example that creates a `Cat` class.


    ```

    >>> class Cat:

    ... def __init__(self, name, color, age, race):

    ...     self.name = name

    ...     self.color = color

    ...     self.age = age

    ...     self.race = race

    ```


    `Cat` is defined by name, color, age, and breed. We can create a cat instance:


    ```

    >>> cat1 = Cat("Fuffy", "white", 3, "tabby")

    ```


    which let’s see its features:


    ```

    >>> print(cat1.name)

    Fuffy

    >>> print(cat1.color)

    white

    ```


    We can modify the class by adding methods:


    ```

    >>> class Cat:

    ... def __init__(self, name, color, age, race):

    ...     self.name = name

    ...     self.color = color

    ...     self.age = age

    ...     self.race = race

    ... def cry(self):

    ...     print("meow")

    ... def purr(self):

    ...     print("purr")

    # we create a cat instance with this new class

    >>> cat2 = Cat("Candy", "Red", "6", "Balinese")

    ```


    Now we can query the instance not only on the basis of the features, as we did
    in the first example,


    ```

    >>> print(cat2.age)

    ```


    but also by using the methods:


    ```

    >>> cat2.cry()

    meow

    >>> cat2.purr()

    purr

    ```


    Let’s create a subclass for tabby, a cat breed, so it inherits its features.


    ```

    >>> class tabby(Cat):

    ...     def character(self):

    ...         print("warm")

    # we create a tabby instance

    >>> tabby1 = tabby("Pallina", "black", 4, "tabby")

    >>> tabby1.purr()

    purr

    >>> tabby1.character()

    warm

    ```


    Thus we can query the instance not only with regard to the characteristics of
    the `tabby` subclass but also with regard to the existing `Cat` class.


    ## Modules


    Modules are collections of functions that are generally related to a given topic
    (graphics, data analysis). Forms can belong to one of the following categories:


    - Python modules

    - Precompiled modules

    - Built-in modules


    To use a module, we must first import it by using the `import` instruction:


    ```

    import ...

    ```


    For instance,


    ```

    import numpy

    ```


    Using `import`, we imported the entire module.


    However, we can import part of a module:


    ```

    from ... import ...

    ```


    For example,


    ```

    from matplotlib import cm

    ```


    To simplify and speed up the writing of code, we can import a form with another
    name:


    ```

    import numpy as np

    ```


    We can then check our modules with the following command:


    ```

    help(''modules'')

    ```


    After a module is imported—say, in Jupyter—we can access the help section by displaying
    all the methods of that particular module by pressing the Tab key (Figure [6-1](#469457_1_En_6_Chapter.xhtml#Fig1)).


    ![../images/469457_1_En_6_Chapter/469457_1_En_6_Fig1_HTML.jpg](images/469457_1_En_6_Chapter/469457_1_En_6_Fig1_HTML.jpg)


    Figure 6-1 pandas’ methods on Jupyter


    In addition, we can import very specific elements of a module. For instance:


    ```

    from math import sqrt

    ```


    In this case, we are not importing the entire module—only the function for the
    square root. In this case, we don’t need to call `sqrt` as a method of the `math`
    module. We can call the square root directly:


    ```

    >>> sqrt(9)

    3.0

    ```


    If we import the entire module, we must specify `sqrt` as the `math` module method:


    ```

    >>> import math

    >>> math.sqrt(12)

    3.4641016151377544

    ```


    Some programming languages, such as Anaconda, install a whole series of modules
    and packages automatically (Figure [6-2](#469457_1_En_6_Chapter.xhtml#Fig2)).
    However, if we need to install a particular module, we can do it from the computer
