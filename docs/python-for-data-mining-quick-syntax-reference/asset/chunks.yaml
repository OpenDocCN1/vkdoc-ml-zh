    # 5. Conditional Instructions and Writing Functions


    In this chapter we explore the ways to create a function and a loop in Python.
    We may need to create a loop to iterate an action over a list, or to create a
    function to extract some cases from a dataset. Writing functions is very important
    to automating data analysis.


    ## Conditional Instructions


    Conditional instructions are structures used to manage conditions when we create
    a function. Depending on certain values or the results of an operation, we implement
    different actions on our data using the following conditional instructions.


    *   **if**


    *   **elif**


    *   **else**


    These structures, along with those for creating loops, are indispensable for creating
    features that allow us to create special instructions, such as performing recursive
    operations on multiple rows of a dataset, establishing conditions, and so on.


    ### if


    Let’s look at some examples of the uses of **if**:


    ```

    >>> x = 5

    >>> y = 7

    >>> if x >> x is less than y

    ```


    Now let’s create objects and set a condition. The previous condition is fulfilled
    and the required sentence is printed.


    ```

    >>> z = 700

    >>> h = 20

    >>> if h > z:

    ...        print("h is bigger than z")

    ```


    In this second case, the condition is not fulfilled, therefore nothing is printed.


    ### if + else


    **if** can also work with **else** to give us more flexibility. For instance,


    ```

    >>> z = 700

    >>> h = 20

    >>> if h > z:

    ...        print("h is bigger than z")

    ...else:

    ...        print("h is not bigger than z")

    h is not bigger than z

    ```


    ### elif


    We reach maximum flexibility for if by using **elif** , which establishes intermediate
    conditions in a function. For instance, let’s create a program that asks us what
    our score was. We then fit this into a scoring class, which we call *result*.
    Let us proceed as follows using Python2 (we might need to enter the encoding):


    ```

    #!/usr/bin/env python

    # -*- coding: utf-8 -*-

    >>> print "Enter your score: "

    >>> mark = int(raw_input())

    >>> if 90 <= mark <= 100:

    ...    output = "A"

    ...elif 80 <= mark <= 89:

    ...    output = "B"

    ...elif 70 <= mark <= 79:

    ...    output = "C"

    ...elif 60 <= mark <= 69:

    ...    output = "D"

    ...elif mark <= 59:

    ...    output = "F"

    ...else:

    ...    print "I don''t understand, try again"

    ...print "Your result is " + output

    ```


    We can save the script (I named it mark2, and you can find it in the code folder
    or create by yourself by opening a .txt file and renaming it with a .py extension)
    and proceed by running it from Jupyter as shown in Figure [5-1](#469457_1_En_5_Chapter.xhtml#Fig1).


