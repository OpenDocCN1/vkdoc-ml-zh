    ## 数据源


    为了开始数据挖掘和机器学习，我们将使用大量数据集来理解算法的工作原理。许多数据挖掘数据集可以从加州大学尔湾分校（UCI）的在线商店下载。UCI 网站（ [`http://archive.ics.uci.edu/ml/index.php`](http://archive.ics.uci.edu/ml/index.php)
    ）（图 11-2）包含了所有最常用的数据科学数据集，例如鸢尾花、波士顿、葡萄酒、短信垃圾邮件收集等，以及更多数据集（ [`http://archive.ics.uci.edu/ml/datasets.html`](http://archive.ics.uci.edu/ml/datasets.html)
    ）。


    ![../images/469457_1_En_11_Chapter/469457_1_En_11_Fig2_HTML.jpg](img/469457_1_En_11_Fig2_HTML.jpg)


    图 11-2


    UCI 网站上的部分数据集


    最近，甚至 Kaggle 也开始鼓励数据科学家发布数据集（ [`https://www.kaggle.com/datasets`](https://www.kaggle.com/datasets)
    ），以促进数据科学家之间的交流（图 11-3）。


    ![../images/469457_1_En_11_Chapter/469457_1_En_11_Fig3_HTML.jpg](img/469457_1_En_11_Fig3_HTML.jpg)


    图 11-3


    Kaggle 网站上的部分数据集


    正如我们所见，Scikit-learn 包也包含可以导入的数据集。有关 scikit-learn 及其特色数据集的更多信息，您可以浏览包文档，网址为 [`http://scikit-learn.org/stable/datasets/`](http://scikit-learn.org/stable/datasets/)
    。


    一个名为 *datareader* 的 pandas 包模块，提供了从某些在线来源提取数据的工具（ [`https://pandas-datareader.readthedocs.io/en/latest/remote_data.html#google-finance`](https://pandas-datareader.readthedocs.io/en/latest/remote_data.html#google-finance)
    ），特别是那些处理股票交易所存储库的来源，例如雅虎财经和谷歌财经。


