    ## Loops


    Loops identify structures that allow you to repeat a certain portion of code,
    for a number of times or under certain conditions. The most important instructions
    in Python that allow you to tweak actions are


    *   **for**


    *   **while**


    *   **continue and break**


    ### for


    The Python instruction **for** allows the definition of iterations. **for** is
    an iterator, so it is able to go through a sequence and perform actions on it,
    or perform operations. The format of **for** instructions is as follows:


    ```

    for item in object:

    run action on item

    ```


    For instance,


    ```

    # we create an object (in this case, a tuple) and print every element

    >>> x = (1,2,3,4,5,6,7)

    # check the type of object

    type(x)


    >>> for n in x:

    ...        print(n)


    # we create an object and, for each element of the object, we print a sentence
    together with the element

    >>> x = (1,2,3,4,5,6,7)

    >>> for n in x:

    ...    print("this is the number", n)

    ("this is the number", 1)

    ("this is the number", 2)

    ("this is the number", 3)

    ("this is the number", 4)

    ("this is the number", 5)

    ("this is the number", 6)

    ("this is the number", 7)

    # we can also print the elements of a string

    >>> string1 = "example"

    >>> for s in string1:

    ...        print(s)

    e

    x

    a

    m

    p

    l

    e

    >>> for s in string1:

    ...        print(s.capitalize())

    E

    X

    A

    M

    P

    L

    E

    >>> for s in string1:

    ...        print(s*5)

    eeeee

    xxxxx

    aaaaa

    mmmmm

    ppppp

    lllll

    eeeee

    ```


    What happens if, for example, we have a list that contains sublists and we want
