- fmt: '# Work Directory


    A work directory stores our scripts and our files. It is where Python automatically
    looks when we ask it to import a file or run a script. To set up a work directory,
    type the following in the Python shell:


    ```

    >>> import os

    >>>> os.getcwd()

    ''~/mypc''

    # to edit the work directory, we use the following notation, inserting the new
    directory in parentheses

    >>> os.chdir("/~/Python_script")

    # then we determine whether it is correct

    >>> os.getcwd()

    ''~/Python_script''

    ```


    Now, when we want to import a file in our workbook, we simply type the name of
    the file followed by the extension, all surrounded by double quotation marks:


    ```

    "file_name.extension"

    ```


    For instance,


    ```

    "dataframe_data_collection1.csv"

    ```


    Python checks whether there is a file with that name inside that folder and imports
    it. The same thing happens when we save a Python file by typing it on a computer.
    Python automatically puts it in that folder. Even when we run a Python script,
    as we will see, we have to access the folder where the script (the work directory
    or another one) is located directly from the terminal.


    If we want to import a file that is not in the work directory but is elsewhere
    on our computer or on the Web, we do this by entering the full file address:


    ```

    complete_address.file_name.extension"

    ```


    For instance,


    ```

    "/~/dataframe_data1.csv"

    ```


    Now let’s make sure that you understand the difference between using a the terminal
    and starting a session in our favorite programming language.


    ## Using a Terminal


    To run Python scripts, we first open a terminal window, as shown in Figure [1-8](#469457_1_En_1_Chapter.xhtml#Fig8).


    ![../images/469457_1_En_1_Chapter/469457_1_En_1_Fig8_HTML.jpg](images/469457_1_En_1_Chapter/469457_1_En_1_Fig8_HTML.jpg)


    Figure 1-8


    My terminal


    As you can see, the dollar symbol (`$`) is displayed, not the Python shell symbol
    (`>>>`). To view a list of our folders and files, use the `ls` command (Figure
    [1-9](#469457_1_En_1_Chapter.xhtml#Fig9)).


    ![../images/469457_1_En_1_Chapter/469457_1_En_1_Fig9_HTML.jpg](images/469457_1_En_1_Chapter/469457_1_En_1_Fig9_HTML.jpg)


    Figure 1-9


    List of resources on my computer


    At this point, we can move to the `Python_test` folder by typing


    ```

    cd Python_test

    ```


    In that folder, I find my Python scripts—that is, the `.py` files I can run by
    typing


    ```

    python test.py

    ```


    `test.py` is the name of the script I am going to run.


    ## Summary


    In this chapter we learned how to install Python and I reviewed some of the various
    IDEs we can use for data analysis. We also examined Python2 and Python3, and learned
    how to set up a work directory on a terminal.


    # 2. Introductory Notes


    In this chapter we examine Python objects and operators, and learn how to write
    comments in our code. Including comments in your code is very important for two
    reasons. First, they serve as a reminder of our thought processes on the work
    we did weeks or months after we’ve created a script. Second, they help other programmers
    understand why we did what we did.


    ## Objects in Python


    In Python, any item is considered an object, a container to place data. Python
    objects include tuples, lists, sets, dictionaries, and containers. Python processing
    is based on objects.


    Each object is distinguished by three properties:


    1. A name

    2. A type

    3. An ID


    Object names consist of alphanumeric characters and underscores—in other words,
    all characters from A through Z, a through z, 0 through 9, and `_`. “Type” is
    the type of object, such as string, numeric, or Boolean. “ID” is a number that
    identifies the object uniquely.


    Objects remain inside computer memory and can be retrieved. When no longer needed,
    a garbage-collecting feature frees up the space.


    Some IDs and types are assigned automatically. With regard to names, however,
    note there are some names that cannot be used for objects.


    ## Reserved Terms for the System


    Python has a set of words that is reserved for the system and cannot be used in
    names for objects or functions. These words are the following:


    > `and`, `as`, `assert`, `break`, `class`, `continue`, `def`, `del`, `elif`, `else`,
    `except`, `exec`, `False`, `finally`, `for`, `from`, `global`, `if`, `import`,
    `in`, `is`, `lambda`, `None`, `not`, `or`, `pass`, `print`, `raise`, `return`,
    `True`, `try`, `while`, `with`, `yield`


    In addition, object names in R are subject to some rules:


    * They must begin with a letter or underscore.

    * They must contain only letters, numbers, and underscores.

    * They are case sensitive. For example, a test object is not the same as a TEST
    object or a Test object.


    ## Entering Comments in the Code


    In Python, any comment preceded by the `#` symbol is not read by the program as
    code; it is ignored. This feature is useful for commenting on code and refreshing
    our memories later. Comments can be written both in the code and to the side.


    ```

    # comment no. 1

    >>> print("Hello World") # comment no. 2

    ```


    To write a comment on multiple lines, we can also use three quotation marks, like
    this:


    ```

    """

    comment line 1

    comment line 2

    comment line 3

    """

    ```


    ## Types of Data


    Python data are various types and are summarized in Table [2-1](#469457_1_En_2_Chapter.xhtml#Tab1).


    Table 2-1


    Python Data Types


    | Data Type | Example |

    | --- | --- |

    | Integer (`int`) | 1, 20, –19 |

    | Float | 1.7, 12.54 |

    | Complex | 657.23e+34 |

    | String (`str`) | "Hello World", ''string1'', """ string2 """ |

    | List | `list = [''a'', ''b'', ''c'' ]` |

    | Tuple | `tuple = (''Laura'', 29, ''Andrea'', 4)` |

    | Dictionary | `dictionary = {''name'' : ''Simon'', ''key'': ''D007''}` |


    To determine object type, we use the `type()` function:


    ```

    # we create an x object

    >>> x = 1

    >>> type(x)


    # a y object

    >>> y = 20.75

    >>> type(y)


    # and a z object

    >>> z = "test"

    >>> type(z)

    ```


    ## File Format


    After you create a script in Python, you need to save it with a `.py` extension.
    Typically, when it comes to complex scripts, you create a script on an editor
    that you then run. A `.py` script can be written using any one of the different
    editors discussed earlier—even a normal text editor—and then can be renamed with
    `.py` extension.


    ## Operators


    Python includes a series of operators that are divided into several groups:


    * Mathematical

    * Comparison

    * Membership

    * Bitwise

    * Assignment

    * Logical

    * Identity


    Beside these operators, there is also a hierarchy that marks the order in which
    they are used. Operators are very important for arithmetic, or even to extract
    some data with specific characteristics.


    ### Mathematical Operators


