- fmt: '### pandas: Importing and Exporting Data


    The `pandas` library is also very important with regard to importing files from
    your computer in various formats, including `.csv`:


    ```

    import pandas as pd

    >>> df2 = pd.read_csv("file_address.csv")

    # we can import a file by specifying that the first line does NOT contain variable
    names

    >>> df2 = pd.read_csv("file_address.csv", header = None)

    # or by specifying which row contains variable names

    >>> df2 = pd.read_csv("file_address.csv", header = 0)

    >>> df2 = pd.read_csv("file_address.csv", header = 1)

    # we can also specify column names

    >>> df2 = pd.read_csv("file_address.csv", names = [''var1'', ''var2'', ''var3'',
    ''var4''])

    # or we can import only a part of the columns

    >>> df2 = pd.read_csv("file_address.csv", usecols = [1,2,3])

    # we can also specify the element separating our data

    >>> df2 = pd.read_csv("file_address.csv", sep = " ")

    # we can now take a look at the first records of the data frame

    >>> df2.head()

    # or the last

    >>> df2.tail()

    # we use parentheses to specify the number of cases to be displayed

    >>> df2.head(9)

    >>> df2.tail(5)

    # and we can see a summary of the dataset

    >>> df2.describe()

    >>> df2.info()

    >>> df.dtypes() # it tells us our data type

    ```


    The `pd.read_csv()` function can also be used to import files from the Web. The
    UCI machine learning repository ( [https://archive.ics.uci.edu/ml/index.php](https://archive.ics.uci.edu/ml/index.php)
    ) features several data sets used for machine learning.


    Let’s look at an iris dataset. Figures [8-1](#469457_1_En_8_Chapter.xhtml#Fig1)
    through [8-3](#469457_1_En_8_Chapter.xhtml#Fig3) and the following steps help
    us navigate to its tab and copy the link featuring the dataset.


    ![../images/469457_1_En_8_Chapter/469457_1_En_8_Fig3_HTML.jpg](images/469457_1_En_8_Chapter/469457_1_En_8_Fig3_HTML.jpg)


    Figure 8-3


    Iris dataset on the UCI machine learning web site click on ‘Data Folder’ to access
    the page containing the dataset


    ![../images/469457_1_En_8_Chapter/469457_1_En_8_Fig2_HTML.jpg](images/469457_1_En_8_Chapter/469457_1_En_8_Fig2_HTML.jpg)


    Figure 8-2


    *Iris dataset on the UCI machine learning web site*


    ![../images/469457_1_En_8_Chapter/469457_1_En_8_Fig1_HTML.jpg](images/469457_1_En_8_Chapter/469457_1_En_8_Fig1_HTML.jpg)


    Figure 8-1


    Iris dataset on the UCI machine learning web site click on ‘Iris’ to get description
    page


    First, we copy the link featuring the dataset.


    ```

    # we import pandas

    >>> import pandas as pd

    # we create an object featuring the dataset, which we are importing with pd.read_csv()

    >>> iris = pd.read_csv("https://archive.ics.uci.edu/ml/machine-learning-databases/iris/iris.data")

    # we check data accuracy by displaying some occurrences using the function .head()

    >>> iris.head(3)

    5.1  3.5  1.4  0.2  Iris-setosa

    0  4.9  3.0  1.4  0.2  Iris-setosa

    1  4.7  3.2  1.3  0.2  Iris-setosa

    2  4.6  3.1  1.5  0.2  Iris-setosa

    ```


    The structure of the pandas function we used, `pd.read_csv()`, also includes other
    arguments we did not use for this import:


    *   **filepath** the address of the file (on the computer or externally)

    *   **sep = '',''** the separator dividing data, such as a comma or semicolon

    *   **dtype=** a means of specifying column format

    *   **header=** names of variables in the first line, if any

    *   **skiprows=** a means of importing only one part of cases—for example, `skiprows
    = 50` reads data from the 51st case onward

    *   **index_col=** a means of setting a column as a data index

    *   **skip_blank_lines=** a means of removing any blank lines in the dataset

    *   **na_filter=** a means of identifying the missing values in the dataset and,
    if set to `False`, removing them


    ```

    pd.read_csv( filepath, sep = '','', dtype = None, skiprows = None, index_col =
    None, skip_blank_lines = True, na_filter = True)

    ```


    In addition, the **usecols=** argument can be used to import only a few columns
    in a dataset. For instance, let’s say we have the small dataset shown in Figure
    [8-4](#469457_1_En_8_Chapter.xhtml#Fig4), from which we want to extract the following
    variables:


    ![../images/469457_1_En_8_Chapter/469457_1_En_8_Fig4_HTML.jpg](images/469457_1_En_8_Chapter/469457_1_En_8_Fig4_HTML.jpg)


    Figure 8-4


    Dataset students.csv


    ```

    >>> df3 = pd.read_csv("~students.csv",usecols =["ID", "mark1"], index_col= ["ID"])

    # we verify data

    df3

    mark1

    ID

    1    17.0

    2    24.0

    3    17.0

    4    27.0

    5    30.0

    6    30.0

    7    23.0

    8    17.0

    9    21.0

    10   24.0

    11   24.0

    12   25.0

    13   24.0

    14    NaN

    15   22.0

    16   30.0

    17   29.0

    18   29.0

    19    NaN

    # correctly, we only loaded the ''mark1'' variable

    ```


    One specular function is `df.to_csv("filename")`, which allows us to write a `.csv`
    file into our work directory. We can specify the `index=False` argument to avoid
    downloading the index together with data.


    As an alternative to this file import function, we can use the `pd.read_table(filepath,
    sep = '','')` function, which sets both the file path (`filepath`) and the separator.


    Other pandas features allow us to read Excel `.xls` or `.xlsx` files. To do this,
    we use a generic formula:


    ```

    df = pd.read_excel(filepath, "sheet_name")

    ```


    In this case, not only must we specify the address of the file, but also whether
    the Excel file features more than one data sheet, and the name of the sheet from
    which we want to read data. As with `.csv`, for Excel formats we also have a formula
    that allows us to write an Excel file in the work directory of our computer: `df.to_excel()`.
    The pandas package also contains a function for reading files in JSON—`pd.read_json()`—and
    also allows us to access Web data via the `pd.read_html(url)` function and to
    convert a data frame to an HTML table via `pd.to_html()`.


    Let’s look at an example of creating and exporting a file in JSON:


    ```

    >>> jf = pd.DataFrame(np.arange(16).reshape(4,4), index = [''A'', ''B'', ''C'',
    ''D''], columns = [''var1'', ''var2'', ''var3'', ''var4''])

    >>> jf

    var1  var2  var3  var4

    A     0     1     2     3

    B     4     5     6     7

    C     8     9    10    11

    D    12    13    14    15

    >>> jf.to_json(''jf.json'')

    # all that is left is to check that the file has been created correctly in our
    work directory

    ```'
