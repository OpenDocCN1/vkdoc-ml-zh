    引言


    **翻译：Nicola Menicacci**


    Python 是一种解释型、交互式、面向对象的语言。它拥有一个函数库，可扩展（因为可以轻松创建新模块），并且适用于所有操作系统。由于这些及其他原因，它也是数据挖掘和机器学习中最常用的编程语言之一。


    我的目标是陪伴你开始学习这种编程语言，向你展示基本概念，然后帮助你过渡到数据挖掘。我们将首先了解如何使用 Python 及其结构，如何安装 Python，以及如何确定哪些工具最适合数据分析，然后转向介绍数据挖掘包。*《Python
    数据挖掘快速语法参考》* 是一本入门书籍。它提供指导——从使用 Python 迈出编程第一步，到操作和导入数据集，再到检查数据分析示例。它不会全面解释诸如使用
    Python 进行机器学习和统计学等主题，这些超出了本书的范围。


    ## 本书面向的读者


    本书面向那些希望从数据分析角度更好地理解 Python 编程语言的读者。我们将从回顾 Python 的基本概念开始，然后重点介绍最常用的数据分析包。要下载代码、更深入地研究某些主题以及获取有关
    Python 和数据挖掘的更多实用信息，请访问我的网站（[**Datawiring.me**](http://datawiring.me/)）。从网站首页，你可以订阅我的新闻通讯，以接收有关
    Python 编码最新动态和其他新闻的更新。对于初学编程的读者，我的建议是手动编写代码以加深理解。


    ## 本书的组织结构


    *《Python 数据挖掘快速语法参考》* 包含 11 章。在第 1 章中，我们将了解一些基本的安装概念以及用于 Python 编程的工具。我们还将探讨 Python2
    和 Python3 之间的差异，并学习如何设置工作文件夹。


    在第 2 章中，我们将学习一些关于创建对象、输入注释以及为系统保留字的基本概念；并了解构成 Python 编程语言语法一部分的各种运算符类型。


    在第 3 章中，我们将扩展对基本 Python 结构（如元组、列表、字典、集合、字符串和文件）的使用，并学习如何创建和转换它们。


    在第 4 章中，我们将创建小型的基本函数，并学习如何保存它们。


    第 5 章涉及条件指令，这些指令使我们能够扩展函数的功能。此外，我们还将回顾其他一些重要函数。


    在第 6 章中，我们将研究面向对象编程的基本概念，并探讨模块、方法和错误处理的概念。


    第 7 章专门介绍使用我们已学习的一些基本功能导入文件。我们将学习如何打开和编辑 .csv 格式的文本文件，以及其他各种格式。


    第 8 章到第 11 章解释了 Python 最重要的数据挖掘包：用于数学函数和随机数据生成的 NumPy 和 SciPy，用于数据框管理和数据导入的 pandas，用于绘制图表的
    Matplotlib，以及用于机器学习的 scikit-learn。关于 scikit-learn，讨论仅限于各种算法代码的基本覆盖。由于该主题的复杂性，我们不详细研究各种技术的细节。


    ### 关于作者和技术审稿人


    ### 关于作者


    ### 关于技术审稿人


    # 1. 开始入门


    Python 是数据科学中使用的最重要的编程语言之一。在本章中，你将学习如何安装 Python，并回顾一些用于数据分析的集成开发环境（IDE）。你还将学习如何在计算机上设置工作目录。


    ## 安装 Python


    Python2 和 Python3 可以轻松地从 [`https://www.python.org/downloads/`](https://www.python.org/downloads/)（图
    1-1）下载并安装。请注意，如果你在使用 Mac 或 Linux 的 Unix 系统上工作，Python 是预装的。只需输入“python”即可加载程序。


    ![../images/469457_1_En_1_Chapter/469457_1_En_1_Fig1_HTML.jpg](img/469457_1_En_1_Fig1_HTML.jpg)


    图 1-1


    Python 主页


    从 [python.org](http://python.org/)（[`python.org/`](http://python.org/)）网站，点击“Downloads”，然后根据你的操作系统选择要使用的适当版本。然后，按照屏幕上的说明安装
    Python。


