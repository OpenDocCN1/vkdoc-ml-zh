    ## Other Formats


    We’ve now seen how to import files and data using some of the most common formats
    in Python. Other formats include the following:


    *   `lxml` —particularly the `objectify` module—allows you to import files into
    XML.

    *   `SQLite3` allows you to import SQL databases.

    *   `PyMongo` allows you to manage Mongo databases

    *   `feedparser` allows you to process feeds in many formats, including RSS

    *   `xlrd` allows you to import files into Excel (note, however, that `pandas`
    is much easier to use)


    ## Summary


    Importing a file and a dataset in multiple formats is one of the most important
    things in data analysis. The procedures described in this chapter are important
    because we don’t need a library to import files and data. We can use the basic
    functions in Python.


    # 8. pandas


    In Chapter [7](#469457_1_En_7_Chapter.xhtml), we learned how to import a generic
    file using basic functions. Here we explore `pandas`—one of the most important
    libraries for dataset management.


    ## Libraries for Data Mining


    From this point onward, including the following chapters, we examine the most
    important and most used data mining libraries:


    *   **pandas:** imports, manages, and manipulates data frames in various formats,
    extracts part of the data, combines two data frames, and also contains some basic
    statistical functions

    *   **NumPy:** a package for scientific computing, contains several high-level
    mathematical and algebraic functions, and random number generation; and allows
    the creation of arrays

    *   **Matplotlib:** a library that allows the creation charts from datasets

    *   **SciPy:** contains more than 60 statistical functions related to mathematical
    and statistical analysis

    *   **scikit-learn:** the most important tool for machine learning and data analysis.


    ## pandas


    In this chapter, we move away from discussions of Python structures and start
    to look at the most important data mining packages, beginning with the `pandas`
    library.


    `pandas` is an open-source Python library that contains various tools for importing,
    managing, and manipulating data. It has a number of high-level features for manipulating,
    reorganizing and scanning structured data, including slicing, managing missing
    values, restructuring data, extracting dataset parts, and importing and data parsing
    from the Web. `pandas` is one of the most important data mining libraries. We
    can


    *   Read and import structured data

    *   Organize and manipulate them

    *   Calculate some basic statistics


    We can import the whole library:


    ```

    >>> import pandas as pd

    ```


    or import only primary structures in `pandas`, which are `Series` and `DataFrame`:


    ```

    >>> from pandas import Series, DataFrame

    ```


    As we shall see, `pandas`, `NumPy`, `SciPy`, and `Matplotlib` typically work together.
    I present them in the best possible way—separately at first—to effect clarity.'
