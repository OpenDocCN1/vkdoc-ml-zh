    ## User Input


    The `input` function (`raw_input` in Python2) is used to let us talk to a program
    that has to handle responses depending on the type of input (we studied this when
    setting functions). In Python2, we handle user input with the `raw_input()` function:


    ```python

    >>> name = raw_input("What is your name? ")

    What is your name? Valentina

    >>> print(name)

    Valentina

    >>> print("Nice to meet you, " + name)

    Nice to meet you, Valentina

    ```


    ### Caution


    Python2 and Python3 handle user input differently.


    In Python3, we use `input()` instead of `raw_input()`:


    ```python

    >>> name = input("What is your name? ")

    What is your name? Valentina

    >>> print(name)

    Valentina

    >>> print("Nice to meet you, " + name)

    Nice to meet you, Valentina

    ```


    When input is entered in this way, it is read as a string. So, for example, if
    we want to enter a number, we have to write the code a bit differently. We must
    specify that what we are entering must be read as a number:


    ```python

    >>> num1 = input(''add a number: '')

    >>> num2 = input(''add a second number '')

    >>> print(num1 + num2)

    # the result will be an integer number resulting from the addition and depending
    from the number you choose:

    ```


    Numbers are not summed; they are attached, as happens with two strings. To add
    them, specify that the value we are entering is a number, and proceed as follows:


    ```python

    >>> num1 = int(input(''enter a number: ''))

    >>> num2 = int(input(''add a second number ''))

    >>> print(num1 + num2)

    ```'
