    ### K-近邻算法


    K-近邻算法是一种用于数据预测和数据挖掘的有监督算法。它也用于模式识别（例如面部识别）、识别遗传密码中的模式、识别疾病以及电影和音乐推荐系统。K-近邻算法背后的逻辑可以用拉丁短语“*Similes
    cum similar bus facillime congregantur*”来概括，意思是“物以类聚”。简而言之，我们使用该算法分析数据集中的案例以找到相似的元素。然后，新案例根据它们与某个组的接近程度以及彼此之间的距离被聚合到新形成的组中。K-近邻算法然后计算未分类项与其他项的距离，并将其分配给最近的元素（或元素，k）的类别。k
    只不过是我们可以用来确定未知类别项类别的邻近观测值的数量。例如，如果我们将 k 设置为 2，我们根据其两个最近的元素将类别分配给该项。如果将其设置为 3，我们得到三个最近的元素，依此类推。


    ```

    # 我们不能在鸢尾花数据集上使用 K-近邻算法，因此从现在开始，我们仅限于给出各种分类模型代码的概念

    >>> from sklearn.neighbors import KNeighborsClassifier

    >>> knn = KNeighborsClassifier(n_neighbors = 3)

    >>> x_train = 从数据集中，我们将使用除标签之外的变量

    >>> y_train = 测试标签

    >>> x_test = 新数据

    >>> y_test = 新数据标签

    >>> knn.fit(x_train, y_train)

    >>> new_pred = knn.predict(x_new)

    >>> print(new_pred)

    ```


    在处理分类问题时，我们使用不同于回归的方法来测试模型的充分性：


    ```

    >>> from sklearn.metrics import classification_report, confusion_matrix

    >>> print(confusion_matrix(y_test, y_pred))

    >>> print(classification_report(y_test, y_pred))

    ```

