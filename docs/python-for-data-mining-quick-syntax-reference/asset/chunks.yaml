    ### pandas：缺失值


    现在让我们看看如何处理包含缺失数据的数据集。导入 pandas 后，我们加载一个包含缺失值的数据集：


    ```

    >>> import pandas as pd

    >>> df_missing = pd.read_csv(''df_missing.csv'')

