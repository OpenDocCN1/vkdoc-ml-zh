    ### 比较运算符与成员运算符


    在 Python 中，我们还有比较运算符和成员运算符（表 2-3）。


    表 2-3


    比较运算符与成员运算符


    | 运算符 | 描述 |

    | --- | --- |

    | > | 大于 |

    | < | 小于 |

    | == | 等于 |

    | >= | 大于或等于 |

    | <= | 小于或等于 |

    | != | 不等于 |

    | is | 是 |

    | is not | 不是 |

    | in | 存在于 |

    | not in | 不存在于 |


    这些运算符用于测试对象之间的关系。例如：


    ```

    # 我们创建两个对象

    >>> x = 5

    >>> y = 10

    # 让我们验证 x 是否大于 y

    >>> x > y

    False

    # 输出是一个逻辑向量，告诉我们 x 不大于 y

    # 让我们看看 x 是否小于 y

    >>> x >> z = 5

    # 让我们用相等运算符验证 z 是否等于 x

    >>> z == x

    True

    # 在这种情况下，输出是肯定的

    # 让我们验证 z 是否不等于 y

    >>> z != y

    True

    # 在这种情况下，输出也是肯定的

    # 让我们创建一个元组

    >>> v1 = (1,2,3,4,5,6,7)

    # 并验证数字 2 是否在元组中

    >>> 2 in v1

    True

    # 让我们验证数字 8 是否不在元组 v1 中

    >>> 8 not in v1

    True

    # 让我们验证数字 7 是否不在元组 v1 中

    >>> 7 not in v1

    False

    ```


    Python 会按字典顺序比较文本字符串，例如使用字符的 ASCII 值。我们不能比较字符串和数字，因为会引发错误。


    ### 位运算符


    表 2-4 中所示的位运算符在指定多个条件时非常有用。例如，当我们需要从对象（如数据集）中提取数据时。


    表 2-4


    位运算符


    | 运算符 | 描述 |

    | --- | --- |

    | & 或 **and** | 与 |

    | &#124; 或 **or** | 或 |

    | ^ | 异或 |

    | ~ | 按位取反 |

    | << | 左移 |

    | >> | 右移 |


    位运算符可以与比较运算符一起使用。让我们看一些例子：


    ```

    >>> 3  3

    True

    # 以及

    >>> 3  3

    True

    # 这里是一个使用 or (|) 的例子

    >>> 3  3

    True

    # 至少有一个语句必须为真

    >>> 3 == 4 or 4 > 3

    True

    ```


    ### 赋值运算符


    赋值运算符用于为给定对象分配一个名称（表 2-5）。


    表 2-5


    赋值运算符


    | 运算符 | 描述 | 示例 |

    | --- | --- | --- |

    | = | 基本赋值运算符 | x = 5 + 6 |

    | += | 加后赋值 | x += y (对应 x = x + y) |

    | -= | 减后赋值 | x -= y (对应 x = x – y) |

    | /= | 除后赋值 | x /= y (对应 x = x/y) |

    | *= | 乘后赋值 | x *= y (对应 x = x * y) |

    | %= | 取模后赋值 | x %= y (对应 x = x % y) |

    | **= | 幂运算后赋值 | x **= y (对应 x = x ** y) |

    | //= | 整除后赋值 | x//=y (对应 x = x//y) |


    让我们看一些例子：


    ```

    # 我们创建一个值为 10 的 x 对象

    >>> x = 10

    # 对 x 求和并用相同名称覆盖变量 x

    >>> x = x + 5

    >>> x


    # 让我们试试 "+="

    >>> x += 5

    >>> x


    # 现在试试 "-="

    >>> x -= 5

    >>> x


    # 现在使用运算符 "*="

    >>> x *= 3

    >>> x


    # 以及运算符 "/="

    >>> x /= 3

    >>> x


    # 然后是运算符 "**="

    >>> x **= 2

    >>> x


    # 最后是运算符 "//="

    >>> x //= 2

    >>> x


    ```


    每次，Python 都会执行操作并将结果记录在 x 对象中。


    ## 运算符优先级


    谈到数学运算符时，我们必须意识到存在一个优先级顺序，当没有插入括号时必须遵守。这类似于数学运算，其中乘法优先于加法。表 2-6 列出了一些管理运算顺序的优先级规则。


    表 2-6


    运算符优先级规则


    | 运算符 | 优先级（从高到低） |

    | --- | --- |

    | ** | 幂运算具有最高优先级 |

    | - | 负号 |

    | * / // % | 乘法、除法、取模、整除 |

    | + - | 加法和减法 |

    | >> << | 按位右移和左移 |

    | & | 按位与 |

    | ^ &#124; | 按位或 |

    | <=, >, <, >= | 小于、大于、小于、大于 |

    | == != | 等于、不等于 |

    | = += -= *= /= %= **= //= | 赋值运算符 |

    | is / is not | 比较 |

    | in / not in | 比较 |

    | not / or / and | 比较 |


    ## 缩进


    Python 使用缩进来限定指令块，这使得代码更具可读性。因此，代码块由缩进定义。通常，一个缩进对应四个空格。


    让我们看一个函数中缩进的例子：


    ```

    >>> def multiply_xy(x, y):

    ...   "''让我们将 x 和 y 相乘

    ...   "''

    ...   return(x*y)

    >>> multiply_xy(5,6)


    ```


    ## 引号


    在 Python 中，引号主要用于定义字符串。它们可以是单引号、双引号或三引号。三引号用于包裹文字并在多行中插入注释。例如，当我们希望在正在创建的函数中包含文档时。


    ```

    >>> ex1 = ''单引号''

    >>> ex2 = "双引号"

    >>> ex3 = """

    文本字符串 1

    文本字符串 2

    文本字符串 3

    """

    ```


    我们将在第 5 章中研究字符串管理。


    ## 总结


    在本章中，我们学习了注释和运算符。当我们编写数据分析代码时，包含注释不仅是为了提醒自己，也是为了给其他程序员提供指导，这一点很重要。运算符及其优先级帮助我们创建和定义代码。


    # 3. 基本对象与结构


    Python 最重要的特性之一是管理数据结构。让我们来看看它们。


    ## 数字


    Python 中的数字可以是以下任何一种：


    *   整数，即 int


    *   浮点数，即 float


    *   复数


    *   布尔值——即 True 或 False


    让我们看一些例子：


    ```

    # 创建一个包含整数 (int) 的对象

    >>> n1 = 19

    >>> type(n1)


    # 一个浮点数

    >>> n2 = 7.5

    >>> type(n2)


    # 一个布尔值 (True/False)

    >>> n3 = True

    >>> type(n3)


    # 一个复数

