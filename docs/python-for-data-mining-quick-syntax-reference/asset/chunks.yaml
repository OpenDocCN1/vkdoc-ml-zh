- fmt: '# Editor and IDEs


    There are many ways to use a programming language such as Python. To start, type
    the word `python` followed immediately by its version number. There is no space
    before the number. For example, in Figure [1-2](#469457_1_En_1_Chapter.xhtml#Fig2),
    I’ve typed `python2`.


    ![../images/469457_1_En_1_Chapter/469457_1_En_1_Fig2_HTML.jpg](images/469457_1_En_1_Chapter/469457_1_En_1_Fig2_HTML.jpg)


    Figure 1-2


    Terminal with Python open


    Writing code this way may prove to be somewhat cumbersome, so we use text editors
    or IDEs to facilitate the process.


    There are many editors (those that are free and those that can be purchased) that
    differ in their completeness, scalability, and ease of use. Some are simple and
    some are more advanced. The most used editors include Sublime Text, [Text Wrangler](http://www.barebones.com/)
    ( [http://www.barebones.com/](http://www.barebones.com/) ), [Notepad++](http://notepad-plus-plus.org/download/v7.3.1.html)
    ( [http://notepad-plus-plus.org/download/v7.3.1.html](http://notepad-plus-plus.org/download/v7.3.1.html)
    ) (for Windows), or [TextMate](http://macromates.com/) ( [http://macromates.com/](http://macromates.com/)
    ) (for Mac).


    As for Python-specific IDEs, [Wingware](http://wingware.com/) ( [http://wingware.com/](http://wingware.com/)
    ), [Komodo](http://www.activestate.com/komodo-ide) ( [http://www.activestate.com/komodo-ide](http://www.activestate.com/komodo-ide)
    ), PyCharm, and [Emacs](http://www.gnu.org/software/emacs/) ( [http://www.gnu.org/software/emacs/](http://www.gnu.org/software/emacs/)
    ) are popular, but there are plenty of others. They provide tools to simplify
    work, such as self-completion, auto-editing and auto-indentation, integrated documentation,
    syntax highlighting, and code folding (the ability to hide some pieces of code
    while you work on others), and to support debugging.


    Spyder (which is included in [Anaconda](http://www.continuum.io/downloads) ( [http://www.continuum.io/downloads](http://www.continuum.io/downloads)
    )) and [Jupyter](http://jupyter.readthedocs.io/en/latest/) ( [http://jupyter.readthedocs.io/en/latest/](http://jupyter.readthedocs.io/en/latest/)
    ), that you can download from the website [www.anaconda.com](https://www.anaconda.com),
    are the IDEs used most in data science, along with Canopy. A useful tool in Jupyter
    is nbviewer, which allows the exchange of Jupyter’s `.ipynb` files, and can be
    downloaded from [`http://nbviewer.jupyter.org`](http://nbviewer.jupyter.org).
    nbviewer can also be linked to GitHub.


    As for Anaconda, which is a very useful tool because it also features Jupyter,
    it can be downloaded from [http://www.continuum/](http://www.continuum/). A partial
    list of resources installed with Anaconda (which contains more than 100 packets
    for data mining, math, data analysis, and algebra) is presented in Figure [1-3](#469457_1_En_1_Chapter.xhtml#Fig3).
    You can view the complete list by opening a terminal window shown in Figure [1-3](#469457_1_En_1_Chapter.xhtml#Fig3)
    and then typing:


    ![../images/469457_1_En_1_Chapter/469457_1_En_1_Fig3_HTML.jpg](images/469457_1_En_1_Chapter/469457_1_En_1_Fig3_HTML.jpg)


    Figure 1-3


    Part of the resources installed with Anaconda


    ```

    conda list

    ```


    We can program with Python using one or more of these tools, depending on our
    habits and what we want to do. Spyder (Figure [1-4](#469457_1_En_1_Chapter.xhtml#Fig4))
    and Jupyter (Figure [1-5](#469457_1_En_1_Chapter.xhtml#Fig5)) are very common
    for data mining. Both can be used and installed individually. For example, Jupyter
    can be tested using http://try.jupyter.org/. However, both Spyder and Jupyter
    are available after Anaconda is installed.


    ![../images/469457_1_En_1_Chapter/469457_1_En_1_Fig5_HTML.jpg](images/469457_1_En_1_Chapter/469457_1_En_1_Fig5_HTML.jpg)


    Figure 1-5


    Example of open script on Jupyter IDE


    ![../images/469457_1_En_1_Chapter/469457_1_En_1_Fig4_HTML.jpg](images/469457_1_En_1_Chapter/469457_1_En_1_Fig4_HTML.jpg)


    Figure 1-4


    Spyder home screen


    Python code can be run directly from a computer terminal or saved as a `.py` file
    and then run from these other editors. As mentioned earlier, `>>>` (displayed
    in Figure [1-6](#469457_1_En_1_Chapter.xhtml#Fig6)) tells us we are running Python
    code.


    ![../images/469457_1_En_1_Chapter/469457_1_En_1_Fig6_HTML.jpg](images/469457_1_En_1_Chapter/469457_1_En_1_Fig6_HTML.jpg)


    Figure 1-6


    The command prompt in Python


    To follow the examples presented in this book, I recommend you install Anaconda
    (Figure [1-7](#469457_1_En_1_Chapter.xhtml#Fig7)) from the **Anaconda.com** web
    site and use Jupyter. Because Anaconda automatically includes (and installs) a
    set of packages and modules that we will use later, we won’t have to install packages
    or modules separately thereafter; we’ll already have them loaded and ready to
    use.


    ![../images/469457_1_En_1_Chapter/469457_1_En_1_Fig7_HTML.jpg](images/469457_1_En_1_Chapter/469457_1_En_1_Fig7_HTML.jpg)


    Figure 1-7


    Anaconda’s main screen


    ## Differences between Python2 and Python3


    Python was released in two different versions: Python2 and Python3. Python2 was
    born in 2000 (currently, the latest release is 2.7) and its support is expected
    to continue until 2020. It is the historical and most complete version.


    Python3 was released in 2008 (current version is 3.6). There are many libraries
    in Python3, but not all of them have been converted from Python2 for Python3.


    The two versions are very similar but feature some differences. One example includes
    mathematical operations:


    ```

    >>> 5/2

    2.5

    Listing 1-2

    Mathematical Operations in Python 3.5.2

    ```


    ```

    >>> 5/2


    # Python2 performs division by breaking the decimal.

    Listing 1-1

    Mathematical Operations in Python 2.7

    ```


    To get the correct result in Python2, we have to specify the decimal as


    ```

    >>> 5.0/2

    2.5

    # or like this

    >>> 5/2.0

    2.5

    # or specify we are talking about a decimal (float)

    >>> float(5)/2

    2.5

    ```


    To keep the two versions of Python together, you can also import Python into a
    form called *future*, which allows you to import Python3 functions into Python2:


    ```

    >>> from __future__ import division

    >>> 5/2

    2.5

    ```


    For a closer look at the differences between the two versions of Python, access
    [this online resource](http://sebastianraschka.com/Articles/2014_python_2_3_key_diff.html)
    ( [http://sebastianraschka.com/Articles/2014_python_2_3_key_diff.html](http://sebastianraschka.com/Articles/2014_python_2_3_key_diff.html)
    ).


    Why choose one version of Python over the other? Python2 is the best-defined and
    most stable version, whereas Python3 represents the future of the language, although
    the two versions may not always coincide. In the first part of this book, I highlight
    the differences between the two versions. However, beginning with Chapter [7](#469457_1_En_7_Chapter.xhtml)
    and moving to the end of the book, we will use Python3.


    Let’s start by setting up a work directory. This directory will house our files.'
