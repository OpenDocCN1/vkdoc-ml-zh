    ## Python2 与 Python3 的区别


    Python 发布了两个不同版本：Python2 和 Python3。Python2 诞生于 2000 年（目前最新版本是 2.7），其支持预计将持续到 2020
    年。它是历史最悠久、最完整的版本。


    Python3 于 2008 年发布（当前版本是 3.6）。Python3 中有许多库，但并非所有库都已从 Python2 转换到 Python3。


    这两个版本非常相似，但存在一些差异。一个例子包括数学运算：


    ```

    >>> 5/2

    2.5

    列表 1-2

    Python 3.5.2 中的数学运算

    ```


    ```

    >>> 5/2


    # Python2 执行除法时会截断小数部分。

    列表 1-1

    Python 2.7 中的数学运算

    ```


    要在 Python2 中获得正确结果，我们必须指定小数，如下所示：


    ```

    >>> 5.0/2

    2.5

    # 或者这样

    >>> 5/2.0

    2.5

    # 或者指定我们谈论的是小数（浮点数）

    >>> float(5)/2

    2.5

    ```


    为了同时兼容这两个 Python 版本，你还可以将 Python 导入一种称为 *future* 的形式，它允许你将 Python3 的函数导入到 Python2
    中：


    ```

    >>> from __future__ import division

    >>> 5/2

    2.5

    ```


    要更深入地了解这两个 Python 版本之间的差异，请访问[这个在线资源](http://sebastianraschka.com/Articles/2014_python_2_3_key_diff.html)（[`sebastianraschka.com/Articles/2014_python_2_3_key_diff.html`](http://sebastianraschka.com/Articles/2014_python_2_3_key_diff.html)）。


    为什么选择某个 Python 版本而不是另一个？Python2 是定义最完善、最稳定的版本，而 Python3 代表了该语言的未来，尽管这两个版本可能并不总是完全一致。在本书的第一部分，我会强调这两个版本之间的差异。然而，从第
    7 章开始到本书结尾，我们将使用 Python3。


