    \n```\n# we open (or create) the file\n>>> file1 = open(\"file1.txt\",\"w\")\n\
    # at the moment, the file was created in our work directory but it is empty\n\
    # we are in write mode; we then add text this way\n>>> file1.write(\"Add line\
    \ n.1 to the file1\")\n# we close the file\n>>> file1.flush()\n>>> file1.close()\n\
    # we open the file in read mode\n>>> file1 = open(\"file1.txt\", \"r\")\n# we\
    \ create an object that contains our file and display it with the print() function\n\
    >>> text1 = file1.read()\n>>> print(text1)\nAdd line 1 to file1\n# we close the\
    \ file\n>>> file1.close()\n# we reopen the file in write mode\n>>> file1 = open(\"\
    file1.txt\",\"w\")\n# if we write the new text now, the line we had written previously\
    \ is replaced\n>>> file1.write(\"Let's replace the first line with this new one\"\
    )\n# we test\n>>> file1.flush()\n>>> file1.close()\n>>> file1 = open(\"file1.txt\"\
    , \"r\")\n>>> text2 = file1.read()\n>>> print(text2)\nLet's replace the first\
    \ line with this new one\n>>> file1.close()\n# to add text without overwriting,\
    \ we open the file in append mode\n>>> file1 = open(\"file1.txt\", \"a\")\n>>>\
    \ file1.write(\"\\n Add a second line to this new version of the file\")\n>>>\
    \ file1.close()\n>>> file1 = open(\"file1.txt\", \"r\")\n>>> text3 = file1.read()\n\
    >>> print(text3)\nWe replace the first line with this new one\nAdd a second line\
    \ to this new version of the file\n# we can verify the length of the text with\
    \ the len function()\nlen(text3)\n\n```\n\nWe can also create a small function\
    \ that reads every line of the file:\n\n```\n>>> file1 = open(\"file1.txt\", \"\
    r\")\n>>> for line in file1:\n...        print(line, end = \"\")\n```\n\nOr proceed\
    \ as follows:\n\n```\n>>> with open(\"file1.txt\", \"a\") as file:\n...      \
    \  file1.write(\"this is the third line\")\n```\n\nTable [7-1](#469457_1_En_7_Chapter.xhtml#Tab1)\
    \ provides a summary of the modes used to open a file.\n\nTable 7-1\n\nModes for\
    \ Opening a File\n\n| Mode | Description |\n| --- | --- |\n| ‘r’ | Read only,\
    \ default mode |\n| ‘rb’ | Read only in binary format |\n| ‘r+’ | Read and write\
    \ |\n| ‘rb+’ | Read and write in binary format |\n| ‘w’ | Write |\n| ‘wb’ | Write\
    \ in binary format only. Overwrites an existing file. If the file does not exist,\
    \ a new one is created. |\n| ‘w+’ | Read and write. Overwrites an existing file.\
    \ If the file does not exist, a new one is created. |\n| ‘wb+’ | Read and write\
    \ in binary format. Overwrites an existing file. If the file does not exist, a\
    \ new one is created. |\n| ‘a’ | Adds to an existing file without overwriting.\
    \ If the file does not exist, a new one is created. |\n| ‘ab’ | Adds to an existing\
    \ file or creates a new binary file |\n| ‘a+’ | Reads, adds, and overwrites a\
    \ new file (or creates a new one) |\n| ‘ab+’ | Reads and adds in binary format;\
    \ overwrites a new file or creates a new one |"
  trans: "\n## 错误与异常\n\nPython 中的错误与异常无非是改变我们代码正常运行的异常或意外事件。异常可能是无效输入（例如，我们要求用户输入数字，但他们输入了字母）、硬件问题或找不到文件或对象的结果。主要有三种类型的错误：\n\
    \n1.  语法错误\n2.  语义错误\n3.  逻辑错误\n\n语法错误是我们编写代码时犯的错误。它们要么是拼写错误，要么是代码中的语法错误。\n\n\
    ```\n# 由于字符串末尾缺少引号而导致的语法错误消息示例\n>>> print 'Hello World\nFile \"\", line 1\nprint\
    \ 'Hello World\n^\nSyntaxError: EOL while scanning string literal\n```\n\n错误和异常通常会导致错误消息，然后我们可以使用这些消息来识别错误，并确定我们是否可以通过修改代码或处理异常来补救它。\n\
    \n当我们预期会发生异常时（称为*已处理异常*），补救方法是编写合适的代码。意外的异常称为*未处理异常*。\n\n为了处理 Python 中的错误和异常，我们通常使用\
    \ `try()`、`except()` 和 `raise()`。\n\n例如，让我们对两个无法相加的项目求和，例如一个数字和一个字符串：\n\n```\n\
    >>> 37 + 'string'\nTypeError                                 Traceback (most recent\
    \ call last)\n in ()\n----> 1 37 + 'string'\nTypeError: unsupported operand type(s)\
    \ for +: 'int' and 'str'\n# 显然，结果是一个错误\n```\n\n让我们看看消息中的错误类型：TypeError。我们需要创建一种方法来处理此错误。例如，让用户输入两个数字，然后返回这两个数字的和。\n\
    \n```\n>>> try:\n... num1 = int(input('enter a number: '))\n... num2 = int(input('enter\
    \ a second number '))\n... print(num1 + num2)\nexcept TypeError:\n... print(\"\
    There is something wrong! Check again!\")\n>>> enter a number: 37\n>>> enter a\
    \ second number 25\n\n```\n\n我们处理了 TypeError 错误。如果用户输入两个数字，它们会被正确求和。\n\n让我们看看如果输入了不正确的值而不是数字会发生什么：\n\
    \n```\n>>> try:\n... num1 = int(input('enter a number: '))\n... num2 = int(input('enter\
    \ a second number '))\n... print(num1 + num2)\nexcept TypeError:\n... print(\"\
    There is something wrong! Check again!\")\n>>> enter a number: 37\n>>> enter a\
    \ second number string\nValueError                                Traceback (most\
    \ recent call last)\n in ()\n1 try:\n2     num1 = int(input('enter a number: '))\n\
    ----> 3     num2 = int(input('enter a second number '))\n4     print(num1 + num2)\n\
    5 except TypeError:\nValueError: invalid literal for int() with base 10: 'string'\n\
    ```\n\n有问题！我们处理了 TypeError 错误，但现在出现了一个不同的错误。我们可以按如下方式处理：\n\n```\n>>> try:\n...\
    \ num1 = int(input('enter a number: '))\n... num2 = int(input('enter a second\
    \ number '))\n... print(num1 + num2)\nexcept TypeError:\n... print(\"There is\
    \ something wrong! Check again!\")\nexcept ValueError:\n... print(\"There is something\
    \ wrong! Check again!\")\nenter a number: 37\nenter a second number string\nThere\
    \ is something wrong! Check again!\n```\n\n或者，我们使用 Exception 来管理异常：\n\n```\n>>>try:\n\
    ... num1 = int(input('enter a number: '))\n... num2 = int(input('enter a second\
    \ number '))\n... print(num1 + num2)\nexcept Exception:\n... print(\"There is\
    \ something wrong! Check again!\")\n>>> enter a number: 37\n>>> enter a second\
    \ number test\nThere is something wrong! Check again!\n```\n\nException 是一个基本错误的类，它包含了大多数错误。正如我们刚才看到的，其他常见类型是\
    \ TypeError 和 ValueError，但还有其他类型：AttributeError、EOFError、IOError、IndexError、KeyError、KeyboardInterrupt、NameError、StopIteration\
    \ 和 ZeroDivisionError。\n\n## 总结\n\n在本章中，我们学习了 Python 编程的基本概念：模块和方法、列表推导式和类创建、正则表达式以及错误和异常。在第\
    \ 7 章中，我们将学习导入文件。\n\n# 7. 导入文件\n\n将文件导入 Python 对于学习如何管理数据集非常重要。在本章中，我们将研究基础知识。我们可以将多种类型的数据导入\
    \ Python：从最规范的格式（.csv）或 Excel 数据格式，到用于文本挖掘的文本格式，再到二进制文件，如图像、视频和音频。首先，让我们看看一些导入文件的基本方法。有时这样做的方法可能看起来有点棘手。我们在第\
    \ 8 章中研究的 pandas 包使导入数据集进行分析变得更加容易。\n\n导入文件的基本结构如下：\n\n```\nfile1 = open(\"file.name\"\
    , mode)\n```\n\n“mode” 代表我们打开文件的方式。最重要的方式有：\n\n*   只读（“r”）\n*   写入（“w”）\n*   在文档末尾追加一些文本（“a”）\n\
    *   读写（“r+”）\n\n我们使用 `open()` 函数来打开文件。如果文件不存在，它会在工作目录中被创建。\n\n```\n# 我们打开（或创建）文件\n\
    >>> file1 = open(\"file1.txt\",\"w\")\n# 此时，文件已在我们的工作目录中创建，但它是空的\n# 我们处于写入模式；然后我们这样添加文本\n\
    >>> file1.write(\"Add line n.1 to the file1\")\n# 我们关闭文件\n>>> file1.flush()\n\
    >>> file1.close()\n# 我们以读取模式打开文件\n>>> file1 = open(\"file1.txt\", \"r\")\n# 我们创建一个包含我们文件的对象，并使用\
    \ print() 函数显示它\n>>> text1 = file1.read()\n>>> print(text1)\nAdd line 1 to file1\n\
    # 我们关闭文件\n>>> file1.close()\n# 我们以写入模式重新打开文件\n>>> file1 = open(\"file1.txt\",\"\
    w\")\n# 如果我们现在写入新文本，之前写入的行将被替换\n>>> file1.write(\"Let's replace the first line\
    \ with this new one\")\n# 我们测试\n>>> file1.flush()\n>>> file1.close()\n>>> file1\
    \ = open(\"file1.txt\", \"r\")\n>>> text2 = file1.read()\n>>> print(text2)\nLet's\
    \ replace the first line with this new one\n>>> file1.close()\n# 要添加文本而不覆盖，我们以追加模式打开文件\n\
    >>> file1 = open(\"file1.txt\", \"a\")\n>>> file1.write(\"\\n Add a second line\
    \ to this new version of the file\")\n>>> file1.close()\n>>> file1 = open(\"file1.txt\"\
    , \"r\")\n>>> text3 = file1.read()\n>>> print(text3)\nWe replace the first line\
    \ with this new one\nAdd a second line to this new version of the file\n# 我们可以使用\
    \ len() 函数验证文本的长度\nlen(text3)\n\n```\n\n我们还可以创建一个读取文件每一行的小函数：\n\n```\n>>> file1\
    \ = open(\"file1.txt\", \"r\")\n>>> for line in file1:\n...        print(line,\
    \ end = \"\")\n```\n\n或者按如下方式进行：\n\n```\n>>> with open(\"file1.txt\", \"a\") as\
    \ file:\n...        file1.write(\"this is the third line\")\n```\n\n表 7-1 总结了用于打开文件的模式。\n\
    \n表 7-1\n\n打开文件的模式\n\n| 模式 | 描述 |\n| :--- | :--- |\n| ‘r’ | 只读，默认模式 |\n| ‘rb’\
    \ | 以二进制格式只读 |\n| ‘r+’ | 读写 |\n| ‘rb+’ | 以二进制格式读写 |\n| ‘w’ | 写入 |\n| ‘wb’ | 仅以二进制格式写入。覆盖现有文件。如果文件不存在，则创建一个新文件。\
    \ |\n| ‘w+’ | 读写。覆盖现有文件。如果文件不存在，则创建一个新文件。 |\n| ‘wb+’ | 以二进制格式读写。覆盖现有文件。如果文件不存在，则创建一个新文件。\
    \ |\n| ‘a’ | 追加到现有文件而不覆盖。如果文件不存在，则创建一个新文件。 |\n| ‘ab’ | 追加到现有文件或创建新的二进制文件 |\n|\
    \ ‘a+’ | 读取、追加并覆盖新文件（或创建一个新文件） |\n| ‘ab+’ | 以二进制格式读取和追加；覆盖新文件或创建一个新文件 |\n"
