    ![../images/469457_1_En_11_Chapter/469457_1_En_11_Figa_HTML.jpg](images/469457_1_En_11_Chapter/469457_1_En_11_Figa_HTML.jpg)


    ### Creation of Training and Testing Datasets


    In machine learning we typically start from a dataset in a `.csv` format. From
    this file we will create 4 pieces. One thing that `Scikit-learn` allows us to
    do is to create a training dataset and a testing dataset. In machine learning,
    we typically start with a labeled dataset and divide it into two parts: one for
    training (about 70%–80% of the dataset), which is used to train the algorithm;
    and one for testing (the remaining 20%–30%), which is used to test the efficacy
    of the data algorithm. This feature allows us to compare actual data with those
    predicted by the algorithm and see how they work. Training and testing datasets
    are also divided in two parts: one with the variables that we will use to create
    a model, and one with the variable we want to learn to predict.


    ```

    >>> from sklearn.model_selection import train_test_split

    >>> x_train, x_test, y_train, y_test = train_test_split(x, y, test_size = 0.3)

    # we only need to specify the percentage of the test dataset—in this case, 30%
    (0.3)

    ```


    If we apply this to our `iris` dataset, for example, we can create four objects:
    a training object that contains four variables of the `iris` dataset and 70% of
    the cases, a test object that contains the rest of the elements (30%), and a label
    or target variable, which is always divided in two.


    ```

    >>> x_train, x_test, y_train, y_test = train_test_split(iris.data, iris.target,
    test_size = 0.3)

    ```


    Let’s check the size of the various objects created:


    ```

    >>> x_train.data.shape

    (105, 4)

    >>> x_test.data.shape

    (45, 4)

    >>> y_train.data.shape

    (105,)

    >>> y_test.data.shape

    (45,)

    ```


    ### Preprocessing


    `Scikit-learn` permits preprocessing of data (although we do not need to do so
    with the `iris` dataset).


    ```

    >>> from sklearn import preprocessing

    # iris_scaled = pd.DataFrame(preprocessing.scale(iris_data))

    ```


    ### Regression


    Regression analysis is used to explain the relationship between a variable, `y`,
    called a *response variable* or *dependent variable*, and one or more independent
    variables.


    To calculate the regression, let’s import the correct model from `Scikit-learn`:


    ```

    >>> from sklearn.linear_model import LinearRegression

    # we simplify the work a bit by creating a copy of the regression model

    >>> lr = LinearRegression()

    # we create the model using the training objects

    >>> lr.fit(x_train, y_train)

    # we view the coefficients

    >>> print(lr.intercept_)

    >>> lr.coef_

    # we predict the membership for the test objects

    >>> pred = lr.predict(x_test)

    >>> print(pred)

    ```


    Now let’s look at the code that allows us to apply metrics to measure model efficacy:


    ```

    >>> from sklearn import metrics

    >>> print(''MAE'', metrics.mean_absolute_error(y_test, pred))

    >>> print(''MSE'', metrics.mean_squared_error(y_test, pred))

    >>> print(''RMSE'', np.sqrt(metrics.mean_squared_error(y_test, pred)))

    >>> metrics.explained_variance_score(y_test, pred)

    ```


    ### K-Nearest Neighbors


    The k-nearest neighbor algorithm is a supervised algorithm used for data prediction
    and data mining. It is also used for pattern recognition (such as facial recognition),
    for identifying patterns in genetic code, for identifying illnesses, and for film
    and music recommendation systems. The logic behind the k-neighbor algorithm can
    be summed up in the Latin phrase “*Similes cum similar bus facillime congregantur*”—meaning,
    “similar ones gather together easily.” In short, we use the algorithm to analyze
    cases in a dataset to find similar elements. New cases are then aggregated to
    newly formed groups, depending on how close they are to a group and how far from
    one another. The k-neighbor algorithm then calculates the distance of the unclassified
    item to the others, and assigns it the closest class of element (or elements,
    `k`). `k` is nothing more than the number of close observations that we can use
    to determine the class of an item with an unknown class. For example, if we set
    `k` equal to two, we assign the class to the item based on its two closest elements.
    If we set it equal to three, we get the three closest elements, and so on.


    ```

    # we cannot use the k-neighbor algorithm on the iris dataset, so from this point
    onward, we limit ourselves to giving an idea of the code for the various classification
    models

    >>> from sklearn.neighbors import KNeighborsClassifier

    >>> knn = KNeighborsClassifier(n_neighbors = 3)

    >>> x_train = from the dataset we will use the variables except the label

    >>> y_train = the test labels

    >>> x_test = new data

    >>> y_test = new data labels

    >>> knn.fit(x_train, y_train)

    >>> new_pred = knn.predict(x_new)

    >>> print(new_pred)

    ```


    When dealing with classification, we use methods other than those of regression
    to test the adequacy of a model:


    ```

    >>> from sklearn.metrics import classification_report, confusion_matrix

    >>> print(confusion_matrix(y_test, y_pred))

    >>> print(classification_report(y_test, y_pred))

    ```'
