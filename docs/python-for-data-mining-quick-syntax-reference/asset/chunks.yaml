    ### Creation of Training and Testing Datasets


    In machine learning we tipically start from a dataset in a .csv format. From this
    file we will create 4 pieces. One thing that Scikit-learn allows us to do is to
    create a training dataset and a testing dataset. In machine learning, we typically
    start with a labeled dataset and divide it into two parts: one for training (about
    70%–80% of the dataset), which is used to train the algorithm; and one for testing
    (the remaining 20%–30%), which is used to test the efficacy of the data algorithm.
    This feature allows us to compare actual data with those predicted by the algorithm
    and see how they work. Training and testing datasets are also divised in two parts:
    one with the variables that we will use to create a model, and one with the variable
    we want to learn to predict.


    ```

    >>> from sklearn.model_selection import train_test_split

    >>> x_train, x_test, y_train, y_test = train_test_split(x, y, test_size = 0.3)

    # we only need to specify the percentage of the test dataset—in this case, 30%
    (0.3)

    ```


    If we apply this to our iris dataset, for example, we can create four objects:
    a training object that contains four variables of the iris dataset and 70% of
    the cases, a test object that contains the rest of the elements (30%), and a label
    or target variable, which is always divided in two.


    ```

    >>> x_train, x_test, y_train, y_test = train_test_split(iris.data, iris.target,
    test_size = 0.3)

    ```


    Let’s check the size of the various objects created:


    ```

    >>> x_train.data.shape

    (105, 4)

    >>> x_test.data.shape

    (45, 4)

    >>> y_train.data.shape

    (105,)

    >>> y_test.data.shape

    (45,)

    ```


