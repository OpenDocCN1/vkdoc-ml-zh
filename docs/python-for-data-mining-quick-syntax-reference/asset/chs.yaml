- '# 11. Scikit-learn


  Scikit-learn 是 Python 机器学习中最重要且最常用的包之一。它提供了许多用于各种预测算法的函数。在本章中，我们将研究 Scikit-learn
  包中包含的一些算法。鉴于该主题的广度，所呈现的示例反映了最常用的模型。那些没有机器学习基础知识的读者可能会发现理解本章中介绍的一些技术比较困难，这些技术不会详细解释。


  ## 什么是机器学习？


  机器学习是数据分析的一个分支，它将以特定方式构建的数据集转化为可应用于新数据的预测。机器学习利用我们已有的数据来预测未来的行为。机器学习技术是数据挖掘领域的一场真正革命，它们对各种应用领域都产生了巨大影响。


  机器学习广泛应用于日常使用的许多应用程序中。像亚马逊、Netflix、谷歌、苹果和 Facebook 这样的大公司出于各种原因使用机器学习算法。例如，Facebook
  使用机器学习来识别图像中的人脸；亚马逊和 Netflix 分析客户的偏好（你最后查看或购买的商品），以推荐可能符合你兴趣的新产品。


  例如，谷歌在翻译和自动驾驶中使用机器学习，或者根据我们的习惯以及我们在每周特定日子常去的地方，来建议交通较少的路线。机器学习还帮助我们区分垃圾邮件和非垃圾邮件，通常使用概率方法或结合多种方法（例如，将概率方法添加到关键词和用户定义的规则中）。


  苹果和微软使用机器学习为我们提供语音助手，帮助我们仅通过语音操作手机或平板电脑。其他公司目前正在完善人工智能方法、自动驾驶等。


  当 IBM 开发的超级计算机 Watson 参加 *Jeopardy!* 问答节目时，机器学习领域获得了更广泛的关注。


  机器学习也被用于预测选举结果，最早由科学家 Nate Silver 在 2012 年 10 月发布美国大选预测，其结果与实际数据非常接近。


  预测性数据挖掘用于医疗保健领域。患者数据和临床记录可以帮助识别那些患某些疾病（如糖尿病或心脏病）风险较高的人群。例如，DNA 分析和基因检测试剂盒已被用于检测导致或与某些类型癌症（包括乳腺癌）相关的基因。


  机器学习最古老的应用之一是手写识别——特别是手写地址和邮政编码。识别基于每个手写数字的各种出现情况，使用神经网络（由贝尔实验室进行）。


  机器学习及其相关主题（如深度学习和人工智能）的研究每天都在进步，并处于计算领域的前沿。像 Kaggle 这样的网站每隔几天就会发布内容，订阅者在此期间尝试解决给定的问题。最著名的
  Kaggle 竞赛是由 Netflix 宣布的。2006 年，Netflix 为推荐系统悬赏 100 万美元。设计出的系统并未被 Netflix 采用，因为它过于复杂且计算成本高昂。


  让我们来看看 Scikit-learn 包中的各种模块和技术。




  ### 导入 Scikit-learn 内置数据集


  首先，scikit-learn 包中包含一些数据集，我们可以像这样导入它们：


  ```

  >>> from sklearn import datasets

  ```


  要导入其中一个数据集，请输入：


  ```

  >>> iris = datasets.load_iris()

  ```


  鸢尾花数据集由三种不同鸢尾花的花瓣和花萼组成：*杂色鸢尾*、*弗吉尼亚鸢尾*和*山鸢尾*。它包含 150 个均匀分布在三种花卉上的案例，以及五个变量。


  在前面的章节中，我们了解了如何从本地计算机的外部文件或通过链接从网站导入 `.csv` 格式的数据集。Scikit-learn 还包含一些最常用的数据挖掘数据集，例如鸢尾花和波士顿房价数据集。Scikit-learn
  中使用的格式对于初学者来说可能会有些令人困惑。所有数据集都包含在同一个对象中，但并非像我们在前几章中检查的 `.csv` 文件那样的表格格式。Scikit-learn
  中的数据集包含数组格式的数据、目标或标签（我们想要预测的变量）以及其他一些信息，例如变量描述（在 `DESCR` 对象中）和列名，这些信息分布在两个不同的对象中：`feature_names`
  用于变量，`target_names` 用于目标或标签。


