  ### NumPy：生成随机数与设置种子


  要生成随机数，我们需要导入 NumPy 包。


  ```

  >>> import numpy as np

  ```


  我们可以按如下方式生成一个随机数：


  ```

  >>> np.random.rand()

  0.992777076172216

  # 或者在括号内指定要自动生成的行数和列数

  >>> np.random.rand(2,3)

  array([[ 0.39352349,  0.57116926,  0.88967038],

  [ 0.76375617,  0.24620255,  0.17408501]])

  ```


  我们可以创建多维随机数数组：


  ```

  # 指定大小（10 是抽取分布的上限）

  >>> np.random.randint(10, size= 8)

  array([5, 8, 3, 7, 6, 8, 5, 3])

  # 接下来，我们创建一个包含四个案例和五个变量的数组

  >>> np.random.randint(10, size=(4, 5))

  array([[4, 7, 1, 9, 8],

  [7, 4, 0, 3, 7],

  [3, 6, 9, 3, 4],

  [4, 7, 3, 3, 9]])

  # 然后我们创建一个三维数组

  >>> np.random.randint(10, size=(4, 5, 6))

  array([[[7, 6, 1, 0, 1, 2],

  [3, 2, 3, 2, 9, 2],

  [5, 5, 6, 5, 0, 2],

  [1, 6, 2, 1, 9, 0],

  [1, 5, 3, 1, 3, 6]],

  [[0, 1, 9, 3, 4, 3],

  [2, 6, 6, 6, 6, 2],

  [2, 3, 7, 6, 2, 5],

  [1, 7, 7, 7, 0, 3],

  [3, 8, 6, 4, 1, 6]],

  [[1, 1, 2, 3, 2, 6],

  [0, 8, 1, 8, 1, 7],

  [7, 4, 3, 1, 6, 7],

  [7, 3, 1, 9, 8, 8],

  [9, 0, 1, 7, 2, 7]],

  [[3, 3, 2, 2, 5, 6],

  [4, 9, 3, 7, 4, 4],

  [8, 6, 3, 3, 7, 0],

  [9, 7, 0, 5, 2, 0],

  [3, 3, 9, 5, 2, 9]]])

  # 使用 random.rand() 生成实数；使用 random.randint() 生成整数

  ```


  我们可以设置一个种子，以确保生成相同的随机数，然后重复示例：


  ```

  >>> np.random.seed(12345)

  >>> np.random.rand()

  0.9296160928171479

  >>> np.random.rand()

  0.3163755545817859

  >>> np.random.seed(12345)

  >>> np.random.rand()

  0.9296160928171479

  >>> np.random.rand()

  0.3163755545817859

  ```


  我们可以使用 `random.randint()` 生成整数随机数：


  ```

  >>> print(random.randint(0, 100))


  >>> print(random.randint(0, 100))


  # 0 和 100 是我们可以抽取元素的界限。在这种情况下，数字 100 不能被抽取。这意味着，如果我们想模拟例如射击游戏，我们可以将界限设置在 1 和 7 之间。

  ```


  我们也可以创建一个对象并随机抽取元素：


  ```

  >>> test1 = ["object1", "object2", "object3", "object4", "object5"]

  >>> print(random.choice(test1))

  object2

  >>> print(random.choice(test1))

  object4

  ```


  我们可以使用 `np.random.randn()` 创建另一个随机对象，它会生成一个正态分布。


  ```

  >>> x = np.random.randn(1000)

  # 我们导入 matplotlib（在第 10 章中描述）

  >>> import matplotlib.pyplot as plt

  # 并创建 x 对象的直方图

  >>> plt.hist(x, bins = 100)

  # 我们显示直方图

  >>> plt.show()

  ```


