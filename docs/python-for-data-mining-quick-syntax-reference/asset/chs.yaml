  ## 饼图


  现在让我们看看如何创建饼图：饼图可用于展示某事物的构成（例如市场）。要绘制饼图，我们可以使用 `plt.pie()` 函数：


  ```

  >>> plt.pie(x)

  ```


  该图如图 10-14 所示。


  ![../images/469457_1_En_10_Chapter/469457_1_En_10_Fig14_HTML.jpg](img/469457_1_En_10_Fig14_HTML.jpg)


  图 10-14


  一个基础饼图


  我们可以通过编辑其颜色来自定义它：


  ```

  # 我们创建一个颜色调色板

  >>> col1 = ["yellow", "red", "purple", "orange"]

  # 我们将新颜色应用到图表中

  >>> plt.pie(x, colors = col1)

