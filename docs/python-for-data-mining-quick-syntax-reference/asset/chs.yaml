  ## 创建你自己的函数


  除了使用默认特性或从其他库导入之外，我们还可以创建自己的函数。如前所述，函数是告诉 Python 如何执行某事的代码片段。一个函数包含三个部分：名称、参数和主体（图
  4-5）。允许我们创建函数的语句是 `def`：


  ![../images/469457_1_En_4_Chapter/469457_1_En_4_Fig5_HTML.jpg](img/469457_1_En_4_Fig5_HTML.jpg)


  图 4-5


  如何编写函数


  ```

  >>> def goal_fun(x):

  ...        "''(x) -> y

  ...        here we will write the documentation of the function, then

  what the function performs

  ...

  "''

  ...        return(x+y)

  ```


  让我们创建一个将数字 5 加到任何 x 值上的函数：


  ```

  >>> def sum1(x):

  ...        "''sum x to 5

  ...        ""

  ...        return(x+5)

  >>> sum1(10)


  >>> sum1(130)


  ```


  在这个函数中，我们输入了一个参数，但我们可以输入多个参数：


  ```

  >>> def mult_xy(x, y):

  ...     "''multiply x and y

  ...     ""

  ...     return(x*y)

  >>> mult_xy(5,6)


  ```


