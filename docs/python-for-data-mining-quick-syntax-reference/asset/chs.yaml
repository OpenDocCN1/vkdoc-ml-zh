  图 5-2


  仅打印第一个元素


  ```

  >>> for (el1, el2) in list1:

  ...     print el1


  ```


  如果我们愿意，还可以对元素对执行操作——例如：


  ```

  >>> for (el1, el2) in list1:

  ...        print el1+el2


