  ## 使用条件指令扩展函数


  我们刚刚学习的条件和循环指令使我们能够扩展编写函数的能力。让我们看一个例子：


  ```

  # 我们创建一个示例函数

  >>> def ex1(x):

  ...        y = 0

  ...        while(y >> ex1(0)

  ''Stop now!''

  ex1(5)

  Add one!

  Add one!

