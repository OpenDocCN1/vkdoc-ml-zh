  8  85  94.0  37.0   65.0  60

  9  98   0.0  19.0   43.0  32

  ```


  我们也可以用单词替换缺失值，例如“missing”：


  ```

  >>> df_missing.fillna(''missing'')

  A        B        C        D   E

  0  15       96       74       31  50

  1  41       27       74      279  57

  2  21       32  missing       99  96

