  })

  >>> print(df4)

  Date Type  Value

  0  2017-01-01    x    185

  1  2017-01-01    x    265

  2  2017-01-02    y    168

  3  2017-01-01    x    245

  4  2017-01-02    y    143

  5  2017-01-02    x    172

  6  2017-01-03    z    346

  7  2017-01-02    y    285

  8  2017-01-03    z    145

  9  2017-01-03    y    128

  >>> print(pd.pivot_table(df4, index = "Date", values = "Value", columns = "Type"))

  Type                 x           y      z

  Date

  2017-01-01  231.666667         NaN    NaN

  2017-01-02  172.000000  198.666667    NaN

  2017-01-03         NaN  128.000000  245.5

