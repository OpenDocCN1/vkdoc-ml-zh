  如前所述，使用插补方法，我们可以用另一个值替换缺失值。让我们将所有缺失值替换为一个固定值——在本例中为零：


  ```

  >>> df_missing.fillna(0)

  A     B     C      D   E

  0  15  96.0  74.0   31.0  50

  1  41  27.0  74.0  279.0  57

  2  21  32.0   0.0   99.0  96

