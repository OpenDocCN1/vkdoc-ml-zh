- '# 5. 条件指令与编写函数


  在本章中，我们将探索在 Python 中创建函数和循环的方法。我们可能需要创建循环来对列表中的元素重复执行某个操作，或者创建函数来从数据集中提取某些案例。编写函数对于自动化数据分析非常重要。


  ## 条件指令


  条件指令是我们在创建函数时用于管理条件的结构。根据特定的值或操作的结果，我们使用以下条件指令对数据执行不同的操作。


  *   **if**


  *   **elif**


  *   **else**


  这些结构，连同用于创建循环的结构，对于创建允许我们执行特殊指令（例如对数据集的多行执行递归操作、建立条件等）的功能是必不可少的。


  ### if


  让我们看一些使用 **if** 的示例：


  ```

  >>> x = 5

  >>> y = 7

  >>> if x < y:

  ...        print("x is less than y")

  x is less than y

  ```


  现在让我们创建对象并设置一个条件。前面的条件满足，因此打印了所需的语句。


  ```

  >>> z = 700

  >>> h = 20

  >>> if h > z:

  ...        print("h is bigger than z")

  ```


  在第二个例子中，条件不满足，因此没有打印任何内容。


  ### if + else


  **if** 也可以与 **else** 一起使用，为我们提供更大的灵活性。例如：


  ```

  >>> z = 700

  >>> h = 20

  >>> if h > z:

  ...        print("h is bigger than z")

  ...else:

  ...        print("h is not bigger than z")

  h is not bigger than z

  ```


  ### elif


  通过使用 **elif**，我们可以实现 **if** 的最大灵活性，它在函数中建立中间条件。例如，让我们创建一个程序，询问我们的分数是多少。然后我们将它归入一个评分等级，我们称之为
  *result*。让我们使用 Python2 按如下步骤操作（我们可能需要输入编码）：


  ```

  #!/usr/bin/env python

  # -*- coding: utf-8 -*-

  >>> print "Enter your score: "

  >>> mark = int(raw_input())

  >>> if 90 <= mark <= 100:

  ...    output = "A"

  ...elif 80 <= mark <= 89:

  ...    output = "B"

  ...elif 70 <= mark <= 79:

  ...    output = "C"

  ...elif 60 <= mark <= 69:

  ...    output = "D"

  ...elif mark <= 59:

  ...    output = "F"

  ...else:

  ...    print "I don''t understand, try again"

  ...print "Your result is " + output

  ```


  我们可以保存脚本（我将其命名为 mark2，你可以在代码文件夹中找到它，或者通过打开一个 .txt 文件并将其重命名为 .py 扩展名来自行创建），然后从 Jupyter
  运行它，如图 5-1 所示。


