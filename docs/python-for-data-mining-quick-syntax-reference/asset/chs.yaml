- '# 4. 函数


  基于对象的编程语言围绕两个主要概念构建：对象和函数。对象是我们在使用 Python 等编程语言的工作会话中创建的一切。函数允许我们为这些对象分配一个或多个操作。让我们学习如何创建一个函数。


  ## 关于 Python 函数的一些说明


  使用 Python，我们基本上有两种类型的函数：


  1.  内建函数，它们是 Python 的一部分，并在我们运行 Python 时自动加载


  2.  我们可以构建和使用的函数（用户自定义）


  函数是一段代码，它对一个对象执行一个或多个操作并返回输出结果。当我们必须对多个对象执行相同操作时，函数尤其有用。我们可以做到这一点，而无需多次重复相同的代码行。


  这两种类型的函数也得到许多可用于安装到 Python 的库中函数的支持。每当我们需要一个特定的函数（或一个包，即一组函数）时，我们可以安装它并使用它。Anaconda
  不允许我们安装许多我们需要的包，因为它们已经存在于该套件中。


  如果某个包未包含在 Anaconda 中，我们始终可以使用通用术语安装它：


  ```

  $ conda install package_name

  ```


  或者，我们可以使用 pip：


  ```

  $ pip install package_name

  ```


  无论如何，安装包的确切措辞始终包含在该包本身的官方文档中。




  ### 一些预定义的内置函数


  默认函数位于 **builtins** 模块中。虽然数量众多，但最常用的一些包括 **dir**、**help**、**type** 和 **print**。我们可以通过输入以下内容来显示它们：


  ```

  >>> dir(__builtins__)

  [''ArithmeticError'', ''AssertionError'', ''AttributeError'', ''BaseException'',
  ''BlockingIOError'', ''BrokenPipeError'', ''BufferError'', ''BytesWarning'', ''ChildProcessError'',
  ''ConnectionAbortedError'', ''ConnectionError'', ''ConnectionRefusedError'', ''ConnectionResetError'',
  ''DeprecationWarning'', ''EOFError'', ''Ellipsis'', ''EnvironmentError'', ''Exception'',
  ''False'', ''FileExistsError'', ''FileNotFoundError'', ''FloatingPointError'', ''FutureWarning'',
  ''GeneratorExit'', ''IOError'', ''ImportError'', ''ImportWarning'', ''IndentationError'',
  ''IndexError'', ''InterruptedError'', ''IsADirectoryError'', ''KeyError'', ''KeyboardInterrupt'',
  ''LookupError'', ''MemoryError'', ''NameError'', ''None'', ''NotADirectoryError'',
  ''NotImplemented'', ''NotImplementedError'', ''OSError'', ''OverflowError'', ''PendingDeprecationWarning'',
  ''PermissionError'', ''ProcessLookupError'', ''RecursionError'', ''ReferenceError'',
  ''ResourceWarning'', ''RuntimeError'', ''RuntimeWarning'', ''StopAsyncIteration'',
  ''StopIteration'', ''SyntaxError'', ''SyntaxWarning'', ''SystemError'', ''SystemExit'',
  ''TabError'', ''TimeoutError'', ''True'', ''TypeError'', ''UnboundLocalError'',
  ''UnicodeDecodeError'', ''UnicodeEncodeError'', ''UnicodeError'', ''UnicodeTranslateError'',
  ''UnicodeWarning'', ''UserWarning'', ''ValueError'', ''Warning'', ''ZeroDivisionError'',
  ''__build_class__'', ''__debug__'', ''__doc__'', ''__import__'', ''__loader__'',
  ''__name__'', ''__package__'', ''__spec__'', ''abs'', ''all'', ''any'', ''ascii'',
  ''bin'', ''bool'', ''bytearray'', ''bytes'', ''callable'', ''chr'', ''classmethod'',
  ''compile'', ''complex'', ''copyright'', ''credits'', ''delattr'', ''dict'', ''dir'',
  ''divmod'', ''enumerate'', ''eval'', ''exec'', ''exit'', ''filter'', ''float'',
  ''format'', ''frozenset'', ''getattr'', ''globals'', ''hasattr'', ''hash'', ''help'',
  ''hex'', ''id'', ''input'', ''int'', ''isinstance'', ''issubclass'', ''iter'', ''len'',
