  trans: "\n当代码的控制流从 `try` 块跳转到 `except` 块时，我们开始挠头。图 4-2 简单展示了用于构建此聊天机器人的状态机可能的样子。\
    \  \n![](img/image-fhk2k9em.png)  \n––––––––  \n图 4-2. 订票聊天机器人的状态图表示  \n\n观察我们的状态图，它可能适用于正常对话场景，比如用户正在查找电影票、汽车票或火车票，或者在询问电影票后想要预订汽车票。但如果用户同时询问汽车票和电影票呢？你可能会说，我们可以在已经嵌套的代码中再添加几个\
    \ `if...else` 语句来处理这种情况。如果你是一名优秀的开发者，编写一个状态机的输入输出或扩展决策树并不会花费太多时间。但请思考一下这种情况：当这些条件开始呈指数级增长，你必须不断添加用例来处理它们，并且它们开始相互干扰时，该怎么办？\
    \  \n\n我们的大脑运作方式是通过学习和再学习。如果一个孩子不知道火会对自己造成什么伤害，他会去触摸它；但当火灼伤他时，他就不会再碰了。他会强化一个事实：火是有害的。奖励机制也是如此——当你做某事并得到回报时，你会将“做某事会带来奖励或更好的奖励”这一事实关联起来，然后你倾向于再次这样做。这在机器学习中被称为**强化学习**，即机器通过执行动作并理解结果来学习如何在特定情境中表现。强化学习有时并非最佳方法，例如在数据不足以学习、数据质量不足以学习奖励场景等情况下。\
    \  \n\n图 4-3 是一张示意图，帮助你理解 Rasa Core 如何在 Rasa 技术栈中完美契合，以及它与我们一直在学习的 Rasa NLU 各自扮演的角色。\
    \  \n![](img/image-5lijm842.png)  \n图 4-3. 展示 Rasa NLU 和 Rasa Core 工作原理的示意图  \n\
    \n借助 Rasa Core，我们可以指定机器人应该说或做的所有事情。这些被称为**动作**。一个动作可能是向用户打招呼、查询数据库，或者通过某个网络服务或\
    \ API 检索信息。  \n\nRasa Core 提供了训练概率模型的功能，以根据用户的历史对话预测需要执行什么动作。想象一下，如果没有 ML 模型，你需要编写数百个用例来确定应该发送或执行什么响应或动作。简单来说，Rasa\
    \ Core 为你解决了这个问题。  \n\n让我们看看在第 3 章构建 OnlineEatsBot 时，我们创建的用户与机器人的并排对话。  \n![](img/image-k35fw6pl.png)\
    \  \n用户  \nOnlineEatsBot  \n![](img/image-l83ltg41.png)  \n你好，onlineeats  \n你好！有什么可以帮你的吗？\
    \  \n我想点餐  \n好的，今天想点什么？一个鸡肉汉堡  \n好的。您的最终金额是 3.99 美元  \n![](img/image-he8wx5vt.png)\
    \  \n谢谢  \n非常感谢  \n\n这段对话非常简单，即使没有 ML 模型也能完成，尽管我们确实使用了训练好的模型来识别其中的意图和实体。  \n\n\
    现在，你脑海中可能会浮现一个有趣的问题：“如果我希望我的机器人能够更改订单呢？如果我希望我的机器人能够删除或增加食品数量呢？”因此，正如讨论过的，添加更多用例、更多复杂性、更多意图及其表述、更多代码中的\
    \ `if...else` 来处理边界情况——但当你为企业构建聊天机器人时，你必须通过它来扩展业务以产生更多收入。所有软件系统都这样做，而那些不这样做的系统则无法生存。关键在于，我们不能一直修改和部署代码。\
    \  \n\n因此，与其在每次出现情况时处理所有用例并重复操作，我们可以借助 Rasa Stack 采取 ML 路线来解决这个问题。Rasa Stack 会根据用户的上下文和对话状态告诉我们机器人下一步应该做什么。由于模型会根据先前对话数据的上下文自行学习，机器人更容易保持对话的自然和用户友好性，而不是从四五个固定句子中随机选择。\
    \  \n\nRasa 建议数据较少或没有数据的用户使用交互式学习。我们将在本章后面进一步了解交互式学习。  \n\n在真正开始使用 Rasa Stack\
    \ 编写机器人的核心部分之前，我们首先需要理解几个概念。  \n\n### 理解 Rasa 概念  \n\n在完全将这些概念应用于代码之前，理解几个与 Rasa\
    \ 相关的特定概念非常重要。在本节中，我们将学习 Rasa NLU 中一些重要且非常实用的概念。请确保你完全理解这些概念，因为我们将在使用 Rasa 的领域文件格式构建第一个内部聊天机器人时用到它们。如果我们不理解这些概念的含义，那么下一步将难以进行。\
    \  \n\n#### 动作  \n\n顾名思义，这是一个可以执行的特定动作。根据 Rasa 文档，它指的是“响应对话而采取的动作”。  \n\n例如，如果用户询问今天的星座运势，我们的机器人可以执行“GetTodaysHoroscope”动作。让我们看看“GetTodaysHoroscope”动作在代码中是什么样子。\
    \  \n\n```python\nfrom rasa_core.actions import Action\nfrom rasa_core.events\
    \ import SlotSet\n\nclass GetTodaysHoroscope(Action):\n    def name(self):\n \
    \       return \"get_todays_horoscope\"\n\n    def run(self, dispatcher, tracker,\
    \ domain):\n        # type: (Dispatcher, DialogueStateTracker, Domain) -> List[Event]\n\
    \        user_horoscope_sign = tracker.get_slot('horoscope_sign')\n        \"\"\
    \"编写你的逻辑，根据某些 API 调用或数据库检索，获取给定星座的今日运势详情\"\"\"\n        return [SlotSet(\"horoscope_sign\"\
    , user_horoscope_sign)]\n```\n\n`name` 方法返回动作的名称，我们将在领域文件中将其作为自定义方法名引用。\n"
- fmt: "# The `run` Method\n\nThe `run` method does the main job for getting the action\
    \ done—i.e., the core business logic resides here. As you can see, it takes three\
    \ parameters: `dispatcher`, `tracker`, and `domain`. Let’s understand these parameters\
    \ one by one:\n\n- `dispatcher`: the dispatcher is used to send messages back\
    \ to our users. We can use `dispatcher.utter_message()` to achieve the same.\n\
    - `tracker`: the state tracker for the current user. We can access slot values\
    \ using `tracker.get_slot(slot_name)`, and to get the most recent user message\
    \ we can use `tracker.latest_message.text`.\n- `domain`: the bot’s domain. We’ll\
    \ discuss in more detail about the domain later in the chapter.\n\n> **Note**:\
    \ The `run` method returns a list of events instances.\n\n---\n\n# Slots\n\nSlots\
    \ are the ones who make the bot responsible for working like a human. Slots are\
    \ like a storage space where the information given by the user can be stored or\
    \ a pre-fetched information from a database or an API can also be used.\n\nThere\
    \ are different slot types for different use-cases:\n\nFor example, in our use-case\
    \ where we want to build a `HoroscopeBot`, we may want to use the slot type as\
    \ text for the `horoscope_sign` provided by the user.\n\nDepending on what type\
    \ of slot you want to keep, Rasa provides some predefined slot types.\n\nOther\
    \ than text, Rasa has the following slot types:\n\n- **Boolean** ⇒ Used for True/False\n\
    - **Categorical** ⇒ Used for situations where you have to pick one of some values\n\
    - **Float** ⇒ Used for continuous values\n- **List** ⇒ Used for list of values\n\
    - **Featurized** ⇒ Used for internal value storage that doesn’t affect the conversation\n\
    \n# Templates\n\nTemplates is a word you must have heard in your life at least\
    \ once, while finding a template for sending an e-mail, for preparing a document,\
    \ for building a portfolio website, or to follow a process.\n\nTemplates in Rasa\
    \ are used for utterances. An utterance template contains a set of preset text\
    \ to be sent to the user when some action is triggered. By having the same name\
    \ of the action as the utterance or by an action with custom code, we can send\
    \ our formatted message in templates to the user.\n\nA simple representation of\
    \ templates inside the domain file may look like the following:\n\n```\ntemplates:\n\
    \  utter_greet:\n    - \"hello {name}\"  # name can be filled by a slot of same\
    \ name or by custom code\n  utter_goodbye:\n    - \"goodbye\"\n    - \"take care\"\
    \  # multiple templates allow the bot to randomly pick from them\n  utter_default:\n\
    \    - \"Sorry, I didn’t get that.\"\n```\n\nNow, that we have gone through the\
    \ three concepts of actions, slots, and templates and we already know what intents\
    \ and entities are as part of our learning from Chapter 3, we are now ready to\
    \ dive deep into Rasa and start writing code for our first chatbot.\n\n# Creating\
    \ Domain File for the Chatbot\n\nThe first and foremost task to do while building\
    \ a chatbot using Rasa stack is to create a domain file.\n\nAs per the documentation\
    \ of Rasa, “The Domain defines the universe in which your bot operates. It specifies\
    \ the intents, entities, slots, and actions your bot should know about. Optionally,\
    \ it can also include templates for the things your bot can say.”\n\nNow, you\
    \ know why we had to be prepared for this situation previously by understanding\
    \ Rasa core concepts. Let’s create a `DefaultDomain` file with a YAML definition.\
    \ Rasa uses `.yml` files to define the domain format.\n\nOriginally YAML supposedly\
    \ meant Yet Another Markup Language, depicting its use as a markup language, but\
    \ it was changed later to be understood as YAML Ain’t Markup Language, a recursive\
    \ acronym, to differentiate its purpose as data-oriented rather than a document\
    \ markup language.\n\nNow, let’s go back to our `rasa-nlu` Jupyter Notebook directory\
    \ and start creating the files. Note that we can write all our code in separate\
    \ files using a command line and use an editor to edit it. I find Jupyter Notebook\
    \ more interactive and easily accessible to browse through the files. Whatever\
    \ you are comfortable with, go with that, but it is good to know most of the features\
    \ that Jupyter Notebook provides.\n\nGo to the main `horoscope_bot` directory\
    \ and create a file, let’s call it `horoscope_domain.yml`. The following is the\
    \ content of `horoscope_domain.yml` for our bot:\n\n```\nslots:\n  horoscope_sign:\n\
    \    type: text\n  DD:\n    type: text\n  MM:\n    type: text\n  subscribe:\n\
    \    type: bool\n\nintents:\n  - greeting\n  - get_horoscope\n  - subscription\n\
    \  - dob_intent\n\nentities:\n  - horoscope_sign\n  - DD\n  - MM\n  - subscribe\n\
    \  - dob_intent\n\ntemplates:\n  utter_greet:\n    - 'Hello! How are you doing\
    \ today?'\n  utter_ask_horoscope_sign:\n    - 'What is your horoscope sign?'\n\
    \  utter_ask_dob:\n    - 'What is your DOB in DD-MM format?'\n  utter_subscribe:\n\
    \    - 'Do you want to subscribe for daily updates?'\n\nactions:\n  - utter_greet\n\
    \  - utter_ask_horoscope_sign\n  - utter_ask_dob\n  - utter_subscribe\n  - get_todays_horoscope\n\
    \  - subscribe_user\n```\n\nAs you can see, the domain file is comprised of five\
    \ important parts: intents, entities, slots, and templates, which we discussed\
    \ earlier.\n\nNote that for every template, there is an `utterAction` defined,\
    \ such as `utter_greet`, and we must have a template defined in the template section\
    \ with the same name.\n\nAs you can see in our example, there are mainly five\
    \ actions defined, where the first three actions are just for uttering a template\
    \ text to the user, but the last two actions require us to either retrieve the\
    \ data from the database or make an API call to get the horoscope for the day\
    \ and return it back to the user.\n\nIn the case of `subscribe_user` action as\
    \ well, we need to do an operation where we add the current user to the subscribe\
    \ list in the database. These user-defined actions are called custom actions.\
    \ To have such custom actions, we need to write what the bot is supposed to do\
    \ when these actions are triggered.\n\nIn the next section we are going to learn\
    \ how to write custom actions."
