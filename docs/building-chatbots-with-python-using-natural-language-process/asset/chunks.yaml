  trans: "\n无论你是新手、中级开发者，还是经验丰富的领域专家，都必须了解在构建聊天机器人时，开发者可以利用哪些资源。  \n\n### 开发者的视角 \
    \ \n\n你是否曾因必须更新电脑、手机或正在使用的其他应用的操作系统才能使用新功能而感到烦恼？如果每次使用新功能都不需要频繁更新应用呢？或者说，与其拥有多个应用，不如用一个应用来完成目前多个应用能做的绝大部分事情？\
    \  \n\n对开发者而言，构建机器人是一件有趣的事。这就像教你的孩子走路、说话、懂规矩和做事。你乐于让它变得更智能、更自主。从开发者的角度来看，聊天机器人是一个非常重要的知识领域。\
    \  \n\n### 功能发布与错误修复  \n\n你可以轻松地为聊天机器人添加大量功能，而无需让用户更新你的聊天机器人应用。如果你发布了一个带有某些错误的应用版本，就必须修复它并再次提交到\
    \ AppStore 等待审核，而最重要的是，用户最终还得更新应用。如果他们不更新，客户就会不断抱怨问题，这会导致所有人的生产力下降。在聊天机器人中，一切都是基于\
    \ API 的，所以你只需在后端修复问题，将更改部署到生产环境，然后——哇哦，问题就为用户解决了，无需任何担忧。你还能从用户报告的错误中节省大量时间。  \n\
    \n想象一下，你构建了一个用于查找餐厅的机器人，后来又想添加搜索酒店、航班等功能。用户只需轻松请求此类信息，你的后端聊天机器人系统就会处理一切。  \n\n\
    假设你正在构建一个 Facebook Messenger 聊天机器人，你可以直接从后端控制几乎所有内容，包括用户在应用中看到的界面。在 Facebook Messenger\
    \ 机器人中，你可以选择用户是点击按钮来回答“是/否”，还是直接输入简单的文本。  \n\n### 市场需求  \n\n2016 年，全球 54% 的开发者首次涉足聊天机器人开发。为企业构建一个能正常运行的简单聊天机器人有着巨大的需求，而企业正在寻找能够为他们构建机器人的开发者。一旦你读完本书的第\
    \ 3 章，我敢打赌你就能轻松开始向企业出售你的服务。你也可以通过为你擅长的领域引入一个聊天机器人，来创办自己的初创公司。能够端到端地构建聊天机器人是一项全新的技能，这也是聊天机器人开发者的平均市场薪酬非常可观的原因。\
    \  \n\n聊天机器人日益增长的需求可以从 Facebook 等开发者平台上正在开发的机器人数量中看出。Facebook 的 Messenger 平台上每月有\
    \ 10 万个活跃的机器人，而且这个数字还在增长。  \n\n你会惊讶地发现，Messenger 在 2015 年 4 月拥有 6 亿用户，到 2016 年\
    \ 6 月增长到 9 亿，2016 年 7 月达到 10 亿，2017 年 4 月达到 12 亿。  \n\n### 学习曲线  \n\n无论你是前端/后端背景，还是对编程知之甚少，在构建或学习构建聊天机器人的过程中，都有无限的机会学习新事物。在这个过程中，你会学到很多东西。例如，你会更深入地了解人机交互（HCI），它探讨的是计算机技术的设计与使用，重点关注人与计算机之间的界面。你将学习如何构建或使用\
    \ API 或 Web 服务，以及如何使用第三方 API，如 Google API、Twitter API、Uber API 等。你将拥有大量机会学习自然语言处理、机器学习、消费者行为，以及许多其他技术和非技术方面的知识。\
    \  \n\n### 受聊天机器人影响的行业  \n\n让我们快速浏览一下哪些行业将从聊天机器人中获益最多。Mindbowser 与 Chatbots Journal\
    \ 联合进行的一项研究，收集了来自 300 多位参与者的数据，他们来自众多行业，包括在线零售、航空、物流、供应链、电子商务、酒店、教育、技术、制造以及市场营销与广告。如果我们看一下图\
    \ 1-5 中的图表，很明显，电子商务、保险、医疗保健和零售是从聊天机器人中获益最多的行业。这些行业高度依赖客户服务团队以高效的方式做出响应，从而节省时间。鉴于聊天机器人在这方面表现出色，很明显它将在这些行业中迅速普及。\
    \  \n\n![](img/image-xxrx1yed.png)  \n\n**图 1-5. 将从聊天机器人中获益最多的主要行业**  \n\n目前，聊天机器人仍在以不同形式在较新的领域中获得关注。未来\
    \ 5 到 10 年对于聊天机器人向那些没有使用经验的行业推广至关重要。  \n\n### 聊天机器人简史  \n\n让我们简要回顾一下聊天机器人的发展历程。了解聊天机器人技术从何而来以及如何形成，这一点非常重要。\
    \  \n\n聊天机器人无疑在最近才流行起来，但为此付出的努力是基于数十年对该技术的研究。聊天机器人的历史一定会让你惊叹于我们自起步以来已经走了多远。  \n\
    \n**1950 年**  \n图灵测试由艾伦·图灵提出。这是一种测试机器能否表现出与人类相当或无法区分的智能行为的测试。  \n\n**1966 年**\
    \  \n第一个聊天机器人 Eliza 由约瑟夫·魏泽鲍姆创建，被设计成一名治疗师。它通过使用“模式匹配”和替换方法来模拟对话，给用户一种机器人能够理解的错觉。"
- fmt: '# 聊天机器人发展简史与适用问题分析


    ## 早期发展（1972-1995）


    1972年，由精神病学家兼斯坦福科学家肯尼斯·科尔比（Kenneth Colby）开发的计算机程序`Parry`模拟了偏执型精神分裂症患者的行为。


    1981年，英国程序员罗洛·卡彭特（Rollo Carpenter）创建了`Jabberwocky`聊天机器人。该项目始于1981年，并于1997年在互联网上发布。该聊天机器人的目标是“以有趣、娱乐和幽默的方式模拟自然的人类聊天”。


    1985年，无线机器人玩具`Tomy Chatbot`会重复录制在其磁带上的任何信息。


    1992年，由Creative Labs为MS-DOS创建的聊天机器人`Dr. Sbaitso`以数字化语音模拟心理学家与用户“交谈”。用户反复的咒骂和畸形输入会导致`Dr.
    Sbaitso`在重置自身之前因“`PARITY ERROR`”而“崩溃”。


    1995年，诺贝尔奖得主理查德·华莱士（Richard Wallace）开发了`A.L.I.C.E`（人工语言互联网计算机实体）。


    ## 技术演进（1996-2010）


    1996年，由杰森·哈钦斯（Jason Hutchens）开发的`Hex`基于`Eliza`，并在1996年赢得了罗布纳奖。


    2001年，由ActiveBuddy开发的智能机器人`Smarterchild`广泛分布于全球即时通讯和短信网络。最初的实现迅速扩展，可即时提供新闻、天气、股票信息、电影时间、黄页列表和详细的体育数据，以及各种工具（个人助理、计算器、翻译器等）。


    2006年，`Watson`的想法源于一次餐桌讨论；它被设计用于参加电视节目《Jeopardy!》。最初，它只能答对约15%的问题，但后来`Watson`能够定期击败人类选手。


    2010年，智能个人助理`Siri`作为iPhone应用推出，随后集成到iOS系统中。`Siri`是SRI国际人工智能中心的一个衍生项目。其语音识别引擎由Nuance
    Communications提供，`Siri`使用先进的机器学习技术来运行。


    ## 现代智能助手（2012-2017）


    2012年，谷歌推出了`Google Now`聊天机器人。其最初代号为“`Majel`”，取自吉恩·罗登贝瑞（Gene Roddenberry）的妻子、在《星际迷航》系列中为计算机系统配音的玛婕尔·巴雷特（Majel
    Barrett）；它也被称为“`assistant`”。


    2014年，亚马逊发布了`Alexa`。单词“`Alexa`”包含一个带有X的硬辅音，因此可以被更高精度地识别。这是亚马逊选择此名称的主要原因。


    2015年，微软创建了虚拟助手`Cortana`。`Cortana`可以设置提醒、识别自然语音，并使用必应搜索引擎的信息回答问题。它得名于《光环》视频游戏系列中的一个虚构人工智能角色。


    2016年4月，Facebook宣布为Messenger推出机器人平台，包括用于构建与用户交互的聊天机器人的API。后续增强功能包括机器人能够参与群组、预览屏幕，以及通过Messenger的摄像头功能进行二维码扫描，将用户直接引导至机器人。


    2016年5月，谷歌在其开发者大会上发布了亚马逊Echo的竞品——支持语音的机器人`Google Home`。它使用户能够通过语音命令与各种服务进行交互。


    2017年，`Woebot`是一个自动化的对话代理，可帮助用户监测情绪、了解自我并改善心情。`Woebot`结合了自然语言处理技术、心理学专业疗法（认知行为疗法）、出色的写作技巧和幽默感来治疗抑郁症。


    ## 使用聊天机器人可以解决哪些问题？


    当你不了解机器人的范围，或者不想将其限制在回答查询时，这个问题会变得具有挑战性。


    记住聊天机器人能做的事情是有限度的，这一点非常重要。我们总感觉自己在与一个非常智能的类人事物交谈，但特定的机器人是经过设计和训练的，只能以特定方式行事并解决特定问题。它不能做所有事情，至少目前如此。未来无疑是光明的。


    因此，我们需要判断你的问题陈述是否真的适合构建一个机器人。


    如果以下三个问题的答案都是肯定的，那么你就可以开始了。


    ### 问题能否通过简单的问答或来回沟通解决？


    在解决任何对你来说非常陌生的问题时，不要试图成为英雄，这一点非常重要。你应该始终致力于限制问题的范围。先构建基本功能，然后在此基础上进行扩展。不要在第一个版本中就试图让它变得复杂。这在软件开发中是行不通的。


    想象一下，如果马克·扎克伯格（Mark Zuckerberg）一开始就花时间构建Facebook的所有功能，比如标记朋友、点赞按钮、评论点赞、更好的消息系统、直播、评论反应等——这些功能在Facebook拥有超过100万注册用户并获得融资时都还不存在。如果他当初先构建这些功能再发布平台，他真的能成功吗？


    因此，我们应该始终只创建当前需要的功能，而不要过度设计。


    现在，回到第一个问题：“问题能否通过简单的问答或来回沟通解决？”


    你只需要限制你的范围，答案就会是肯定的。我们并非限制自己不去解决复杂问题，而是限制自己不要一次性解决所有复杂问题。


    > “你必须让每一个细节都完美。而且你必须限制数量。”

    > ——杰克·多西（Jack Dorsey）


    ### 问题是否包含需要分析或获取数据的高度重复性事务？


    这个问题很重要，因为无论是从商业角度还是开发者角度来看，聊天机器人的作用和使命就是让使用它的人更高效、更有生产力。如何做到这一点？通过消除用户自己执行重复性事务的需求。'
  raw: '1972   Parry, a computer program by psychiatrist and Stanford scientist Kenneth
    Colby, modeled the behavior of a paranoid schizophrenic.   1981   The Jabberwocky
    chatbot was created by British programmer Rollo Carpenter. It started in 1981
    and launched on internet in 1997\.   The aim of this chatbot was to “simulate
    natural human chat in an interesting, entertaining and humorous manner.”   1985
      The wireless robot toy, Tomy Chatbot, repeats any message recorded on its tape.
      1992   Dr. Sbaitso, a chatbot created by Creative Labs for MS-DOS, “conversed”
    with the user as if it were a psychologist in a digitized voice. Repeated swearing
    and malformed input from the users caused Dr. Sbaitso to “break down” in a “PARITY
    ERROR” before it could reset itself.   1995   A.L.I.C.E (Artificial Linguistic
    Internet Computer Entity) was developed by Nobel Prize winner Richard Wallace. 
    1996   Hex, developed by Jason Hutchens, was based on Eliza and won the Loebner
    Prize in 1996\.   2001   Smarterchild, an intelligent bot developed by ActiveBuddy,
    was widely distributed across global instance messaging and SMS networks. The
    original implementation quickly   grew to provide instant access to news, weather,
    stock information, movie times, yellow pages listings, and detailed sports data,
    as well as a variety of tools (personal assistant, calculators, translator, etc.).
      2006   The idea of Watson was coined from a dinner table; it was being designed
    to compete on the TV show “Jeopardy.” In its first pass it could only get about
    15 percent of answers correct, but later Watson was able to beat human contestants
    on a regular basis.   2010   Siri, an intelligent personal assistant, was launched
    as an iPhone app and then integrated as a part of the iOS. Siri is a spin-out
    from the SRI International Artificial Intelligence Center. Its speech recognition
    engine was provided by Nuance Communications, and Siri uses advanced machine learning
    technologies to function.   2012   Google launched the Google Now chatbot. It
    was originally codenamed “Majel” after Majel Barrett, the wife of Gene Roddenberry
    and the voice of computer systems in the Star Trek franchise; it was also codenamed
    as “assistant.”   2014   Amazon released The word “Alexa” has a hard consonant
    with the X, and therefore it can be recognized with higher precision. This was
    the primary reason Amazon chose this name.  2015   Cortana, a virtual assistant
    created by Microsoft. Cortana can set reminders, recognize natural voice, and
    answer questions using information from the Bing search engine. It was named after
    a fictional artificial intelligence character in the Halo video game series.  
    2016   In April 2016, Facebook announced a bot platform for Messenger, including
    APIs to build chatbots to interact with users. Later enhancements done included
    bots being able to participate in groups, preview screens, and QR scan capability
    through Messenger’s camera functionality to take users directly to the bot.


    In May 2016, Google unveiled its Amazon Echo competitor voice-enabled bot called
    Google Home at the company’s developer conference. It enables users to speak voice
    commands to interact with various services.   2017   Woebot is an automated conversational
    agent that helps you monitor mood, learn about yourself, and makes you feel better.
    Woebot uses a combination of NLP techniques, psychological expertise therapy [CBT]),
    excellent writing, and a sense of humor to treat depression.What Kind of Problems
    Can I Solve Using Chatbots?   This question becomes challenging when you don’t
    know the scope of your bot or don’t want to limit it to answer queries.   It’s
    very important to remember that there is a limit to what chatbots can do. It always
    feels that we are talking to a human-like thing that is very intelligent, but
    the specific bot is designed and trained to behave in a certain way and solve
    a specific problem only. It cannot do everything, at least as of now. The future
    is definitely bright.   So, we come to the question of finding out if your problem
    statement is really good to go and you can build a bot around it.   If the answer
    to all of these three questions is yes, then you are good to go.  Can the Problem
    be Solved by Simple Question and Answer or Back-and-Forth Communication?   It’s
    really important to not try to be a hero when solving any problem that is very
    new to you. You should always aim to keep the problem scope limited. Build the
    basic   functionality and then add on top of it. Don’t try to make it complex
    in the first cut itself. It doesn’t work in software.   Imagine Mark Zuckerberg
    thinking out loud and spending time building all the features of Facebook at the
    start. Tagging a friend, having a like button, liking a user comment, better messaging,
    live video, reactions on comments, etc.—these features didn’t exist even when
    Facebook was funded with over 1 million registered users on the platform. Would
    he have really succeeded if he would have gone on to first build these features
    and then launch the platform?   So, we should always try to create features only
    needed at the moment without having to over-engineer things.   Now, coming back
    to the first question, “Can the problem be solved by simple question and answer
    or back-and-forth communication?”   You just have to keep your scope limited and
    your answer will be yes. We are not at all limiting ourselves to solving complex
    problems but definitely limiting ourselves to solving a complex problem all in
    one go.   “You have to make every single detail perfect. And you have to limit
    the number of   —Jack Dorsey   Does It Have Highly Repetitive Issues That Require
    Either Analyzing or Fetching of Data?   This question is important because either
    from a business perspective or a developer’s perspective, what chatbot does and
    is made to do is to make people using it efficient and productive. And how do
    you do that? By removing the need of a user to do repetitive things themselves.'
  trans: "\n1972 年，由精神病学家兼斯坦福科学家肯尼斯·科尔比开发的计算机程序帕里（Parry），模拟了偏执型精神分裂症患者的行为。  \n1981\
    \ 年，英国程序员罗洛·卡彭特创建了 Jabberwocky 聊天机器人。该项目始于 1981 年，并于 1997 年在互联网上推出。该聊天机器人的目标是“以有趣、娱乐且幽默的方式模拟自然的人类对话”。\
    \  \n1985 年，无线机器人玩具 Tomy Chatbot 能够重复录制在其磁带上的任何信息。  \n1992 年，Creative Labs 为 MS-DOS\
    \ 系统开发的聊天机器人 Dr. Sbaitso，以数字化语音模拟心理学家与用户“交谈”。用户反复的咒骂和畸形输入会导致 Dr. Sbaitso 在重置前因“奇偶校验错误”而“崩溃”。\
    \  \n1995 年，诺贝尔奖得主理查德·华莱士开发了 A.L.I.C.E（人工语言互联网计算机实体）。  \n1996 年，杰森·哈钦斯开发的 Hex\
    \ 基于 Eliza，并赢得了 1996 年的勒布纳奖。  \n2001 年，ActiveBuddy 开发的智能机器人 Smarterchild 广泛分布于全球即时通讯和短信网络。其原始实现迅速扩展，可即时提供新闻、天气、股票信息、电影时间、黄页列表、详细体育数据以及多种工具（个人助理、计算器、翻译器等）。\
    \  \n2006 年，沃森（Watson）的想法诞生于一次餐桌讨论；它被设计用于参加电视节目《危险边缘》。最初，它只能答对约 15%的问题，但后来沃森能够稳定击败人类选手。\
    \  \n2010 年，智能个人助理 Siri 作为 iPhone 应用推出，随后集成到 iOS 系统中。Siri 源自 SRI 国际人工智能中心，其语音识别引擎由\
    \ Nuance Communications 提供，并利用先进的机器学习技术运行。  \n2012 年，谷歌推出了 Google Now 聊天机器人。其最初代号为“Majel”，取自《星际迷航》系列中计算机系统的配音演员、吉恩·罗登贝瑞的妻子马杰尔·巴雷特；它也曾被代号为“assistant”。\
    \  \n2014 年，亚马逊发布了“Alexa”一词。该词包含硬辅音“X”，因此能被更高精度地识别，这也是亚马逊选择此名称的主要原因。  \n2015 年，微软创建了虚拟助手\
    \ Cortana。Cortana 可以设置提醒、识别自然语音，并利用必应搜索引擎的信息回答问题。其名称源自《光环》电子游戏系列中的虚构人工智能角色。  \n\
    2016 年，2016 年 4 月，Facebook 宣布为 Messenger 推出机器人平台，包括用于构建与用户交互的聊天机器人的 API。后续增强功能包括机器人能够参与群组、预览屏幕，以及通过\
    \ Messenger 的摄像头功能实现二维码扫描，将用户直接引导至机器人。\n\n2016 年 5 月，谷歌在其开发者大会上发布了与亚马逊 Echo 竞争的语音控制机器人\
    \ Google Home。它允许用户通过语音命令与各种服务进行交互。  \n2017 年，Woebot 是一款自动化对话代理，可帮助您监测情绪、了解自我，并让您感觉更好。Woebot\
    \ 结合了自然语言处理技术、心理学专业疗法（认知行为疗法）、出色的写作技巧和幽默感来治疗抑郁症。  \n我能用聊天机器人解决哪些问题？  \n当你不了解机器人的能力范围，或不想将其局限于回答查询时，这个问题就变得具有挑战性。\
    \  \n记住聊天机器人的能力有限非常重要。我们总感觉是在与一个非常智能的类人事物交谈，但特定的机器人是经过设计和训练，以特定方式行事并仅解决特定问题的。它无法做到所有事情，至少目前如此。未来无疑是光明的。\
    \  \n那么，我们回到这个问题：如何判断你的问题陈述是否真的适合构建一个机器人？  \n如果以下三个问题的答案都是“是”，那么你就可以着手进行了。  \n\
    问题能否通过简单的问答或来回沟通解决？  \n在解决任何对你来说非常陌生的问题时，切勿试图充当英雄，这一点至关重要。你应始终力求限制问题的范围。先构建基本功能，然后在此基础上进行扩展。不要在初版就试图使其复杂化。这在软件开发中行不通。\
    \  \n想象一下，如果马克·扎克伯格一开始就花时间构建 Facebook 的所有功能，比如标记朋友、点赞按钮、评论点赞、更好的消息系统、直播、评论反应等——这些功能甚至在\
    \ Facebook 获得融资、平台拥有超过 100 万注册用户时都还不存在。如果他先构建所有这些功能再推出平台，他真的能成功吗？  \n因此，我们应始终只创建当前所需的功能，避免过度设计。\
    \  \n现在，回到第一个问题：“问题能否通过简单的问答或来回沟通解决？”  \n你只需限制范围，答案就会是“是”。我们并非限制自己不去解决复杂问题，而是限制自己不要一次性解决所有复杂问题。\
    \  \n“你必须让每一个细节都完美。同时你必须限制……的数量。”  \n——杰克·多西  \n问题是否包含需要分析或获取数据的高度重复性事务？  \n这个问题很重要，因为无论从商业角度还是开发者角度来看，聊天机器人的作用和设计目的都是让使用者更高效、更有生产力。如何做到这一点？通过消除用户自己执行重复性事务的需求。\n"
- fmt: "# Chatbots: Automation and Problem Solving\n\nChatbots are definitely more\
    \ capable of just automating some highly repetitive stuff, but you will always\
    \ find that most of the chatbots primarily try to solve the same issue—be it by\
    \ learning under supervision (read: “By Supervised Learning”) or self-teaching\
    \ (read: “By Un-supervised Learning”).\n\n## Can Your Bot’s Task be Automated\
    \ and Fixed?\n\nUnless you are thinking of building a chatbot just for your learning\
    \ purpose, you should make sure the problem you are trying to solve can be automated.\
    \ Machines have started to learn and do things themselves, but still it’s a very\
    \ nascent stage. What you think can’t be automated now may be automated in a few\
    \ years.\n\n## A QnA Bot\n\nOne of the good examples of a problem statement for\
    \ building a chatbot could be a QnA Bot. Imagine a bot that is trained to understand\
    \ various user questions whose answers are already available on an FAQ page of\
    \ a website. If you go back and try to find the answer of the aforementioned three\
    \ questions, the answer will be yes. See Figure 1-6 and you will find what an\
    \ FAQ bot is doing.\n\n![](image-9r593nut.png)\n\n––––––––\n\nFigure 1-6. FAQ\
    \ chatbot example\n\nThese are nothing but very repetitive questions that customers\
    \ of a particular store may call and ask or try to find answers to by going to\
    \ a website and navigating through the pages. Think when you have a chatbot like\
    \ this and it answers your question like a human in seconds and even does more\
    \ than you could imagine. This is just a little of what chatbots are capable of.\n\
    \nNow, let’s try to analyze the aforementioned three questions and their answers\
    \ in case of QnA Bot.\n\n- **Can the problem be solved by simple question and\
    \ answer or back-and-forth communication?**  \n  Yes, FAQs are nothing but simple\
    \ frequently asked questions and their relative answers. There may be a context-based\
    \ FAQ, but unless you are solving a multidomain problem using chatbots, you won’t\
    \ be having this problem. There could be a situation where two or more questions\
    \ may seem similar, but you can always design the bot to ask a question back to\
    \ the user when it’s doubtful.\n\n- **Does it have highly repetitive issues that\
    \ require either analyzing or fetching of data?**  \n  Yes, FAQs require us to\
    \ fetch the data from the database and show it all at once in the website or possibly\
    \ dynamically. But the user has to go through all questions one by one to find\
    \ the question he/she is looking for and then see its answer. Lots of combing\
    \ through the UI before the consumer actually gets his/her answer... or maybe\
    \ not. Why not let our bot do that for us?\n\n- **Can your bot’s task be automated\
    \ and fixed?**  \n  Yes, an FAQ bot would need to get the question, analyze the\
    \ question, fetch information from the database, and give it back to the user.\
    \ There is nothing here that can’t be done using coding. And also, the process\
    \ it pretty much fixed won’t change in real-time.\n\n## Starting With Chatbots\n\
    \nThere are three steps one should follow before building chatbots. We’ll discuss\
    \ each one of them briefly here.\n\nThink about all the scenarios or tasks you\
    \ want your chatbot to be able to do, and gather all related questions in different\
    \ forms that can be asked to do those tasks. Every task that you want your chatbot\
    \ to do will define an intent. Each question that you list or intent can be represented\
    \ in multiple ways. It depends on how the user expresses it.\n\nFor example:\n\
    - `Alexa, Switch off the light.`\n- `Alexa, Would you please switch off the light?`\n\
    - `Can you please switch off the light?`\n\nA user may use any of these sentences\
    \ to instruct the bot to switch off the light. All of these have the same intent/task\
    \ to switch off the light, but they are being asked in different ways.\n\nWrite\
    \ all your logic to keep the user tied to the flow that you have chosen after\
    \ you recognize the user’s intent. For example, suppose you are building a bot\
    \ to book a doctor’s appointment. Then you ask your user to give a phone number,\
    \ name, and specialist, and then you show the slots and then book it. In this\
    \ case you can expect the user to know these details and not try to accommodate\
    \ all the things in the bot itself, like a specialist for an ear problem is called\
    \ an ENT. However, doing this is not a big deal. So, again it comes back to deciding\
    \ the scope of your bot, depending on the time and resource you have to build\
    \ the application.\n\n## Decision Trees in Chatbots\n\nIf you know about decision\
    \ trees, then that’s very good because you will be needing that knowledge frequently\
    \ when designing the flow of your chatbots. But if you don’t know about the decision\
    \ trees, then just Googling would help you learn this simple concept widely used\
    \ in Computer Science.\n\n### Using Decision Trees in Chatbots\n\nIn the context\
    \ of chatbots, a decision tree simply assists us in finding the exact answer to\
    \ a user’s question.\n\n> A decision tree is a decision support tool that uses\
    \ a tree-like graph or model of decisions and their possible consequences, including\
    \ chance event outcomes, resource costs, and utility. It is one way to display\
    \ an algorithm that only contains conditional control statements.  \n> —Wikipedia\n\
    \nThe most difficult part when building a chatbot is to keep track of `if...else`\
    \ code blocks. The greater the number of decisions to make, the more frequently\
    \ `if...else` comes up in the code. But at the same time these blocks are required\
    \ to encode the complex conversational flows. If the problem is complex and requires\
    \ a lot of `if...else` in real-life, then that will require code to adjust in\
    \ the same way.\n\n### How Does a Decision Tree Help?\n\nDecision trees are simple\
    \ to write and understand, but they are a powerful representation of the solution\
    \ made for the problem in question. They inherit a unique capability to help us\
    \ understand a lot of things.\n\n- Help in creating a full picture of the problem\
    \ at hand. Looking at the decision tree, we can easily understand what’s missing\
    \ or what needs to be modified.\n- Helps debug faster."
