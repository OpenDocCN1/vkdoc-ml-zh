  trans: "\n观察我们训练好的模型在这方面的表现将会很有趣。我们不能仅仅以文本形式向用户随意输出内容；它必须是有意义的。  \n**为什么应该使用 Rasa\
    \ NLU？**  \nRasa NLU 并非只是另一个包含一堆方法来完成某些任务的库。它具备构建你能想象到的几乎任何类型聊天机器人的能力。Rasa 为你带来了神奇的能力：训练机器理解文本的含义，而不是让你编写规则来理解它。\
    \  \n让我们看看以下几点，了解为什么应该使用 Rasa NLU：  \n\n- Rasa NLU 是一个积极维护的项目，并且拥有一个良好的社区来支持它。\
    \  \n- 如果我们不想将用户的敏感数据分享给第三方，就必须使用像 Rasa NLU 这样的开源工具从头构建聊天机器人。这样，所有数据都保留并在我们自己的服务器上进行处理。\
    \  \n- 依赖第三方服务来训练数据并查找用户话语的意图，需要你调用可能并不总是可靠的 API。如果他们的服务器宕机，你的聊天机器人应用会怎样？  \n\
    - 使用 Rasa NLU 构建聊天机器人将使你完全掌控你的聊天机器人。你可以根据自己的意愿，使用你想要的数据来训练、调整和优化它。借助 Rasa NLU，我们可以试验哪种机器学习算法最适合我们的数据集，而不是依赖固定的算法。\
    \  \n\n**直接深入 Rasa NLU**  \n在本节中，我们将直接进入实践部分，尝试安装 Rasa 栈，并通过训练数据开始构建我们的机器学习模型。我们将使用一些更酷的开源库来让我们的工作更轻松。\
    \  \n\n**安装 Rasa**  \n要安装 Rasa，请运行以下 pip 命令，我们在之前的章节中曾用该命令安装 spaCy。请注意，我们将使用 Rasa\
    \ 版本 0.13.2。  \n\n```\npip install rasa-nlu==0.13.2\n```\n\nRasa NLU 有多个组件用于分类意图和识别实体。\
    \  \nRasa 的不同组件有各自独立的依赖项。  \n当我们训练模型时，Rasa NLU 会检查所有必需的依赖项是否已安装。如果你想安装完整使用 Rasa\
    \ 库所需的所有依赖项，可以执行以下步骤：  \n\n```\ngit clone https://github.com/RasaHQ/rasa_nlu.git\
    \ #克隆仓库\ncd rasa_nlu #进入 rasa 目录\npip install -r alt_requirements/requirements_full.txt\
    \ #安装完整依赖项\n```\n\n第一步可能需要一些时间。请像大地一样耐心等待，直到它完成。  \n\n**在 Rasa 中决定管道**  \n管道不过是一组用于训练模型的算法。Rasa\
    \ NLU 有两个广泛使用的管道，分别称为 `spacy_sklearn` 和 `tensorflow_embedding`。让我们对两者都稍作了解。  \n\
    \n**spacy_sklearn**  \n- `spacy_sklearn` 管道利用了来自 GloVe 算法或 Facebook AI 团队开发的名为\
    \ fastText 的算法的预训练词向量。  \n- `spacy_sklearn` 在以下场景中表现非常出色：假设你有一个话语，比如“What is the\
    \ weather in Boston?”，当我们用相同的话语示例训练模型，然后要求它预测“What is the weather in London?”的意图时，我们的模型现在足够智能，能够知道“Boston”和“London”这两个词是相似的，并且它们属于同一个意图。\
    \  \n- 这个管道对于小数据集非常有用。  \n\n**tensorflow_embedding**  \n- `tensorflow_embedding`\
    \ 管道不像 `spacy_sklearn` 那样使用任何预训练的词向量，而是根据我们自己提供的数据集自行调整。  \n- `tensorflow_embedding`\
    \ 管道的好处在于，我们的词向量将根据我们的领域而定。  \n- 为了用一个例子解释 `tensorflow_embedding` 的工作原理，在英语中，“play”这个词可能与“a\
    \ sport”或“an activity of enjoyment or recreation”密切相关，并且它可能看起来与“an act”这个词非常不同。在戏剧领域，“play”和“an\
    \ act”密切相关，其中“play”的意思是“a form of literature written by a playwright”，因此非常有必要告诉我们的模型学习特定于我们的领域，而不要因为某些预训练模型而混淆。\
    \  \n\n**从头训练和构建聊天机器人**  \n如果你已经阅读过本书的第 3 章，你一定熟悉我们使用 Dialogflow 构建的“食品订购聊天机器人”。你一定了解意图、实体以及聊天机器人对最终用户的响应。\
    \  \n类似地，在本章中，我们将以一个聊天机器人的用例为例，从头开始构建它。你不一定需要使用相同的示例。请随意找到你自己的用例，按照本章的步骤操作，并在本章结束时构建你自己的聊天机器人。\
    \  \n我们将构建一个星座运势机器人，它能够理解用户查询并告诉他们当天的星座运势。那么，让我们开始吧。  \n\n**构建星座运势机器人**  \n在这个使用开源库\
    \ Rasa NLU 完全自行构建聊天机器人的示例中，我们将构建一个星座运势机器人。让我们确定这个聊天机器人的范围，看看它能做什么以及可以做什么。  \n\n\
    - 星座运势机器人应该能够理解问候语并用问候语回复。  \n- 机器人应该能够理解用户是否在询问星座运势。  \n- 如果用户没有提供星座，机器人应该能够询问用户的星座。\
    \  \n- 如果用户不知道自己的星座，机器人应该询问用户的出生日期并为他们找到星座。  \n- 机器人应该能够订阅/取消订阅用户以获取每日星座运势。  \n\
    - 机器人应该能够从现有的响应中学习，以制定新的响应。  \n- 机器人应该能够处理用户的拼写错误。  \n\n我们的机器人在这里要做的任务相当简单。  \n"
- fmt: "# Possible intents\n\n- **Greeting Intent**: User starting with a greeting\n\
    - **Get Horoscope Intent**: User asking for horoscope\n- **User’s Horoscope Intent**:\
    \ User telling the horoscope sign\n- **User’s DOB Intent**: User telling his/her\
    \ DOB\n- **Subscription Intent**: User asking for subscription\n\nDepending on\
    \ the way you design your bot and write code, you may or may not need all of the\
    \ above intents or you may need to define some extra intents as well to cover\
    \ all the use-cases we want our bot to do. As we move forward in this chapter,\
    \ we’ll try to build the bot that does the basic task of giving a horoscope; later\
    \ as a part of the exercise, we can add more use-cases to it.\n\nWell, this is\
    \ pretty much what we have been doing so far to recognize the possible intents\
    \ based on a simple possible conversation between a bot and a user.\n\n## Conversation\
    \ Script Between the Horoscope Bot and the User\n\nLet’s create a possible conversation\
    \ script between our chatbot and the user. As mentioned in the first chapter,\
    \ writing a conversation script is like preparing a software requirement document\
    \ before building the software. It may change later but gives you an overall view\
    \ of what’s going to happen in the final chatbot application.\n\nThe following\
    \ is what our conversation between the user and the bot looks like:\n\n- **User**:\
    \ Hello\n- **Horoscope Bot**: Hello! Hope you are doing well.\n- **User**: I want\
    \ to know my horoscope.\n- **Horoscope Bot**: Sure, may I know your horoscope\
    \ sign?\n- **User**: Capricorm\n- **Horoscope Bot**: Sorry, did you mean Capricorn?\n\
    - **User**: Yes.\n- **Horoscope Bot**: Alright, Here is your horoscope for today.\
    \ Chances are that you’ll feel upbeat and positive today. Share this energy with\
    \ others who feel less than content. Your attitude can have a profound effect\
    \ on friends, partners, spouse, and children. Neighbors and extended family can\
    \ pick up on your spirit without you even realizing it. If someone is hurt or\
    \ angry, be encouraging. Everything will eventually work out.\n- **Horoscope Bot**:\
    \ Would you like to subscribe for the daily updates? If yes, just say subscribe.\n\
    - **User**: Yes, please subscribe.\n- **Horoscope Bot**: Great, you are subscribed\
    \ now. Have a good day.\n\nThis conversation is just to have a fair idea of how\
    \ our chatbot conversation is going to look. We may or may not want to change\
    \ the flow of the conversation based on our needs.\n\nWe can have our chatbot\
    \ model itself trained to prepare a valid response instead of writing a bunch\
    \ of `if...else` statements.\n\n## Preparing Data for Chatbot\n\n`Rasa NLU` has\
    \ multiple ways of defining the intents and their entities on our custom data.\
    \ It supports data in markdown, in JSON as a single file, or as a directory containing\
    \ multiple files.\n\nWe are going to discuss the most difficult, but highly scalable,\
    \ method first. Creating JSON files is difficult by hand but programmatically\
    \ very easy and scalable.\n\n### Creating Data for Model in JSON Format\n\nThe\
    \ JSON format of the data that `Rasa NLU` expects has a top-level object called\
    \ with the keys and. The most important one with which we are going to be working\
    \ is `common_examples`. The following is the skeleton form of how our JSON data\
    \ is going to look:\n\n```json\n{\n  \"rasa_nlu_data\": {\n    \"common_examples\"\
    : [],\n    \"regex_features\": [],\n    \"entity_synonyms\": []\n  }\n}\n```\n\
    \nThe `common_examples` key in our JSON data is the central place that’ll be used\
    \ to train our model. We will be adding all our training examples in the `common_examples`\
    \ array.\n\n`regex_features` is a tool to help the intent classifier recognize\
    \ entities or intents and improve the accuracy of intent classification.\n\nLet’s\
    \ start writing our JSON file. Let’s call it `data.json`.\n\n1. Create a folder\
    \ called `horoscope_bot`.\n2. Change the current working directory to `horoscope_bot`.\n\
    3. Start Jupyter Notebook (`jupyter notebook`).\n4. Create a new folder called\
    \ `data`.\n5. Click on the `data` folder and go to “Text File” under New menu\
    \ in Jupyter Notebook.\n6. Click on the name of the file created and change the\
    \ name to `data.json` and write your intents for your chatbots.\n\nFor Steps 5\
    \ and 6, feel free to use your favorite editors like Sublime, Notepad++, PyCharm,\
    \ etc., to work with the JSON file.\n\nThis following is what my `data.json` under\
    \ `data` folder looks like:\n\n```json\n{\n  \"rasa_nlu_data\": {\n    \"common_examples\"\
    : [\n      {\n        \"text\": \"Hello\",\n        \"intent\": \"greeting\",\n\
    \        \"entities\": []\n      },\n      {\n        \"text\": \"I want to know\
    \ my Horoscope\",\n        \"intent\": \"get_horoscope\",\n        \"entities\"\
    : []\n      },\n      {\n        \"text\": \"Can you please tell me my horoscope?\"\
    ,\n        \"intent\": \"get_horoscope\",\n        \"entities\": []\n      },\n\
    \      {\n        \"text\": \"Please subscribe me\",\n        \"intent\": \"subscription\"\
    \n      }\n    ],\n    \"regex_features\": [],\n    \"entity_synonyms\": []\n\
    \  }\n}\n```\n\nWell as you can see, it looks very clumsy to prepare this by hand.\
    \ You must be remembering the nice and easy method we had in Dialogflow. So, let’s\
    \ check a cool and interesting tool for creating training data in the format that\
    \ Rasa expects. It was created by Polgár András, and it’s also pretty much good\
    \ for inspecting and modifying existing data that we prepared earlier. This tool\
    \ saves a lot of time if you are working on a small project where you have to\
    \ create the data by hand. It’s always a good idea to visualize the data in any\
    \ application you are building that is completely data-driven.\n\nSo, just save\
    \ the earlier `data.json` file we created until we extend the data collection\
    \ using a better method.\n\n### Visualizing and Modifying Rasa’s JSON Data Format\n\
    \nIn this section we’ll make use of a tool called `Rasa NLU trainer` to visualize\
    \ our data (i.e., the data that we have created so far). This tool helps us in\
    \ annotating the data as well. If you remember when the Dialogflow interface was\
    \ explained in Chapter 3, it was so easy to define entities, their names, and\
    \ the types. We are going to do the same using an open-source tool."
