    我们学到的这些内容在构建聊天机器人时非常重要，这样我们就知道如何解析用户输入，以便在代码内部编写业务逻辑时使其有意义。聊天机器人 NLP 中值得了解的内容


    在本节中，我们将学习几个有趣的主题，当你计划编写自己的自定义 NLP 方法来处理某些场景时，这些主题经常会派上用场。请务必仔细阅读它们，因为在你最不期待的时候，它们往往是最需要的。我们将简要讨论聊天机器人场景中的分词和正则表达式的使用。


    分词


    分词是 NLP 中简单但基础的概念之一，我们将文本分割成有意义的片段。spaCy 首先对文本进行分词（即将其分割成单词，然后是标点符号和其他内容）。你可能会想到一个问题：为什么我不能直接使用
    Python 语言内置的 split 方法来进行分词？Python 的 split 方法只是一个原始方法，用于根据分隔符将句子分割成标记。它不考虑任何含义，而分词则试图同时保留含义。


    让我们尝试一些代码，看看分词是如何工作的。


    示例 1：


    doc = nlp(u''Brexit is the impending withdrawal of the U.K. from the European
    Union.'')


    for token in doc: print(token.text)


    输出：


    Brexit is the impending withdrawal of the U.K. from the EuropeanUnion


    如果你看到上面的输出，U.K. 在分词过程后作为一个单独的单词出现，这是有道理的，因为 U.K. 是一个国家名称，将其拆分是错误的。即使如此，如果你对 spaCy
    的分词不满意，你可以在完全依赖 spaCy 的分词方法之前，使用其 add_special_case 方法添加自己的规则。


    正则表达式


    你一定已经了解正则表达式及其用法。本书假设你已熟悉一般的正则表达式。在本节中，我们只是要浏览一些示例，看看正则表达式在构建聊天机器人时如何发挥优势并变得有用。


    文本分析和处理本身就是一个庞大的主题。有时单词以某种方式组合在一起，使得机器极难理解和训练。正则表达式可以作为机器学习模型的一种回退方案。它具有模式匹配的能力，可以确保我们正在处理的数据是正确的还是错误的。第
    1 章“聊天机器人历史”部分讨论的大多数早期聊天机器人都高度依赖模式匹配。


    让我们看下面两个非常容易理解的示例。我们将尝试使用正则表达式从这两个句子中提取信息。

    '
- fmt: "# 排版后的文本\n\n`Book me a metro from Airport Station to Hong Kong Station. Book\
    \ me a cab from Hong Kong Airport to AsiaWorld-Expo.` Here is the code:\n\n```\n\
    sentence1 = \"Book me a metro from Airport Station to Hong Kong Station.\"\nsentence2\
    \ = \"Book me a cab to Hong Kong Airport from AsiaWorld-Expo.\"\n\nimport re\n\
    \nfrom_to = re.compile('.* from (.*) to (.*)')\n\nto_from = re.compile('.* to\
    \ (.*) from (.*)')\n\nfrom_to_match = from_to.match(sentence2)\nto_from_match\
    \ = to_from.match(sentence2)\n\nif from_to_match and from_to_match.groups():\n\
    \    _from = from_to_match.groups()[0]\n    _to = from_to_match.groups()[1]\n\
    \    print(\"from_to pattern matched correctly. Printing values\\n\")\n    print(\"\
    From: {}, To: {}\".format(_from, _to))\n\nelif to_from_match and to_from_match.groups():\n\
    \    _to = to_from_match.groups()[0]\n    _from = to_from_match.groups()[1]\n\
    \    print(\"to_from pattern matched correctly. Printing values\\n\")\n    print(\"\
    From: {}, To: {}\".format(_from, _to))\n```\n\nOutput:\n\n```\nto_from pattern\
    \ matched correctly. Printing values\nFrom: AsiaWorld-Expo., To: Hong Kong Airport\n\
    ```\n\nTry changing the `sentence2` to `sentence1` and see if the code works well\
    \ to identify the pattern. Given the power of machine learning these days, regular\
    \ expression and pattern-matching has taken a back step, but make sure you brush\
    \ up a bit about it as it may be needed at any time to parse specific details\
    \ from words, sentences, or text documents.\n\n## Summary\n\nAt this point you\
    \ must have fair idea of why we need to know NLP before starting to build chatbots.\
    \ In this chapter, we learned about the `spaCy` module in Python, its features,\
    \ and how to install it. We dived into various methods of NLP, which is extensively\
    \ used while building chatbots. We learned about POS tagging, the difference between\
    \ stemming and lemmatization, entity recognition, noun-chunking, and finding similarity\
    \ between sets of words.\n\nWe executed code for all of these concepts and learned\
    \ all of this by doing and not just reading, which is what this book emphasizes.\
    \ We brushed up on basics of tokenization and regular expressions as well. We\
    \ are good to go on and build our chatbot in the next chapter using a freely available\
    \ tool called Dialogflow. We will learn how to train our chatbot to understand\
    \ and extract information given by the user in the next chapter.\n\n# CHAPTER\
    \ 3\n\n––––––––\n\n## Building Chatbots the Easy Way\n\nBuilding chatbots the\
    \ easy way has been written keeping in mind that sometimes you don’t want to build\
    \ everything from scratch and just want to get things done. This chapter doesn’t\
    \ require you to do lots of coding but still gives you a fair idea of how to build\
    \ chatbots in an easy way and make it public.\n\nThe reason why this chapter becomes\
    \ more important for learning to build chatbots is because the software world\
    \ moves too fast to be adapted. Sometimes we need to build applications very quickly,\
    \ and we try to look for tools available in open-source libraries that can be\
    \ used to quickly build applications, without the need of re-inventing the wheels.\n\
    \nSometimes we are not good enough at coding to build everything from scratch.\
    \ Even though we want to build applications from scratch, we can’t because the\
    \ learning curve will be so steep for a newbie.\n\nThis chapter will help you\
    \ to build chatbots very quickly and make them public for the world to use.\n\n\
    We are going to try a tool formerly known as Api.ai. Now it is known as Dialogflow.\n\
    \n### Introduction to Dialogflow\n\nDialogflow gives users new methods to interact\
    \ with their product by building engaging voice- and text-based conversational\
    \ interfaces, such as voice apps and chatbots.\n\nDialogflow is powered by AI.\
    \ It helps you connect with users on your website, mobile app, the Google Assistant,\
    \ Amazon Alexa, Facebook Messenger, and other popular platforms and devices.\n\
    \nThe following diagram from Dialogflow shows how they handle a user request.\n\
    \n––––––––\n\n63\n\n![](image-7r6ovgla.png)\n\n*Figure 3-1. Working diagram of\
    \ Dialogflow architecture*\n\nHere is what happens:\n\n- User talks to the input\
    \ device.\n- User query goes into the Dialogflow engine.\n- Dialogflow tries to\
    \ recognize the intent.\n- Based on the intent, a fulfillment is done and data\
    \ is returned from database.\n- Response is returned to the intent.\n- Response\
    \ is converted into actionable data.\n- User’s request for information is given\
    \ back to the output device.\n\nThere is a concept of agents in Dialogflow that\
    \ are best described as Natural Language Understanding (NLU) modules. These can\
    \ be included in your app, product, or service and transform natural user requests\
    \ into actionable data. This transformation occurs when a user input matches one\
    \ of the intents inside your agent.\n\nAgents can also be designed to manage a\
    \ conversation flow in a specific way. This can be done with the help of contexts,\
    \ intent priorities, slot filling, responsibilities, and fulfillment via webhook.\n\
    \n### Getting Started\n\nKnowing what we have learned so far was and is important\
    \ because free tools and packages available in open source don’t always help in\
    \ building a full-fledged chatbot application.\n\nMany times, you may come across\
    \ a situation when you want to build everything yourself so that you have more\
    \ control over your application. We will learn those in the next chapter and use\
    \ the previously learned NLP techniques as well.\n\nThis chapter is all about\
    \ creating a chatbot as a proof of concept and making it ready for the world to\
    \ use with minimal programming or no programming experience.\n\n### Building a\
    \ Food-Ordering Chatbot\n\nWe are going to create a chatbot with help of Dialogflow\
    \ for a specific restaurant. Let’s name it In short we can call it OnlineEats\
    \ product. You can choose any other use-case for which you want to build the chatbot.\
    \ For this chapter we are going to build a food-ordering chatbot.\n\n#### Deciding\
    \ the Scope\n\nLet’s decide the scope of this chatbot—that is, what it can do\
    \ and to what extent.\n\n- It should be able to greet the user dynamically."
