  trans: "\n由于我们将通过添加一些新代码来进行一些更改，因此最好将两个项目分开存放。于是，我创建了一个新文件夹，并将我的 horoscope_bot 文件夹粘贴到了其中。现在，我所有的模型文件、数据集和代码文件都已复制过来，可以直接用于部署。\n\
    \nRasa 的凭证管理  \nRasa 提供了一种在单一位置管理所有凭证的方法。你可能只有一个模型，但希望它能部署在 Facebook、Slack、Telegram\
    \ 等多个不同平台上。所有这些第三方平台在连接时都需要使用一些凭证。这些凭证存储在一个名为 `credentials.yml` 的 YAML 文件中。让我们在项目目录\
    \ `horoscope_bot` 文件夹中创建一个名为 `credentials.yml` 的文件，并将我们的 Facebook 凭证添加进去。如果你不知道如何获取这些凭证，可以先创建这个文件，在本章下一节中，你将找到获取\
    \ Facebook 凭证的步骤。\n\n––––––––  \n© Sumit Raj 2019  \nS. Raj, 《构建聊天机器人》 https://doi.org/10.1007/978-1-4842-4096-0_5\
    \  \n155  \n\n`credentials.yml` 的内容如下所示：\n\n```yaml\nfacebook:\n  verify: \"horoscope-bot\"\
    \n  secret: \"bfe5a34a8903e745e32asd18\"\n  page-access-token: \"HPaCAbJJ1JmQ7qDedQKdjEAAbO4iJKr7H9nx4rEBAAuFk4Q3g\
    \ PQcNT0wtD\"\n```\n\n这些凭证是虚拟凭证；你的 Facebook 应用的令牌或密钥的长度以及字符类型可能有所不同。\n\n如果你正在处理一个大型项目，需要将聊天机器人集成到多个平台，并且希望项目更具可维护性，那么最好使用\
    \ `credentials.yml`。我强烈建议你维护一个 `credentials.yml` 文件，特别是当你是一家企业，并试图构建一个能在 Facebook、Slack、Twitter、Telegram\
    \ 或你自己的网站等多个平台上以相同方式运行的机器人时。在这种情况下，管理密钥和机密信息会变得更加容易。\n\n管理应用级密钥的一个好方法是将密钥存储为环境变量，并编写代码从操作系统环境中读取密钥值或任何其他敏感信息。请记住，将任何类型的密钥放在代码中从来都不是一个好主意。\n\
    \n你也可以在服务器上创建一个点（.）env 文件，并从该文件中读取密钥，该文件不会在你的代码仓库中被追踪。\n\n为了简单起见，我们将在部署的独立脚本中使用访问密钥和密钥。我们将使其易于理解，以便你首先能够构建机器人，然后可以尝试扩展它，最重要的是，你可以考虑安全层面的问题。\n\
    \n如果你需要将机器人部署到多个平台，并希望使用 `credentials.yml` 来维护不同的凭证，那么你可以通过传递一个额外的参数来使用它。例如，要在运行\
    \ rasa core 时使用上述名为 `credentials.yml` 的凭证文件，你可以使用以下命令：\n\n```bash\npython -m rasa_core.run\
    \ -d models/dialogue -u models/nlu/current —port 5002—credentials credentials.yml\n\
    ```\n\n了解这一点对于大型企业级聊天机器人的开发很有帮助，但如前所述，在接下来的示例中，我们将直接在脚本中使用凭证。\n\n在 Facebook 上部署聊天机器人\
    \  \n在本节中，我们首先将使用 Heroku 在云端部署我们的聊天机器人。Heroku 是一种平台即服务（PaaS），使开发人员能够完全在云端构建、运行和操作应用程序。Heroku\
    \ 的好处在于，我们可以轻松地让我们的应用程序在 https 上运行，而无需太多麻烦。在我们学习和测试聊天机器人时，无需去购买 SSL 证书。需要 https\
    \ 的原因是一些平台（如 Facebook）不允许开发者使用非 https 的 URL 作为回调 URL。\n\n我们将逐步执行一系列步骤，成功地将我们的聊天机器人作为\
    \ Web 服务部署到云端。一旦成功完成，将其与 Slack、Telegram 等不同平台集成将变得容易得多。那么，让我们开始吧。\n\n在 Heroku\
    \ 上创建应用  \n让我们开始吧：\n\n1.  在 Heroku 上注册，创建一个应用，并将其命名为 something-actions，因为这将是我们动作服务器应用。请查看图\
    \ 5-1 中的截图，你可以为你的动作服务器指定一个唯一的名称，该名称应在 Heroku 上可用。一旦该名称可用，你可以点击“创建应用”按钮来创建动作服务器应用。\n\
    2.  如果你的名称不可用，可以随意将其命名为你想要的任何名称，但尽量使用有意义的名称。\n\n![](img/image-n247gcw0.png)  \n\
    图 5-1. 在 Heroku 上创建名为 horoscopebot1212-actions 的动作服务器应用\n\n在本地系统上设置 Heroku  \n\
    在你的本地操作系统上安装 Heroku CLI。请参考此链接：https://  \n如果你使用的是 macOS，请使用以下命令：\n\n```bash\n\
    brew install heroku/brew/heroku\n```\n\n在 Facebook 上创建并设置应用  \n为了能够将我们的聊天机器人部署到\
    \ Facebook，首先我们需要拥有 Facebook 应用的凭证。为了获取 Facebook 凭证，我们需要像在第三章中那样设置一个 Facebook\
    \ 应用和一个页面。\n\n前往 https://developers.facebook.com/，如果你还没有应用，请创建一个。我们为 OnlineEatsBot\
    \ 创建了一个；现在我们将为 HoroscopeBot 创建一个。输入详细信息并点击“创建应用 ID”。查看图 5-2，了解如何输入你的机器人的显示名称和你的联系邮箱。\n\
    \n![](img/image-fgm7gv0c.png)  \n图 5-2. 为开发者创建 Facebook 应用\n\n应用创建完成后，进入“设置”下的“基本”选项，点击“应用密钥”旁边的“显示”按钮。这就是你的\
    \ `fb_secret` 密钥。请参考图 5-3，了解具体在哪里获取你的 `fb_secret` 密钥。\n\n![](img/image-vr4x4kow.png)\
    \  \n图 5-3. 从 Facebook 应用获取应用密钥\n\n进入应用的仪表板，向下滚动到“添加产品”。点击“添加产品”，然后添加 Messenger（点击“设置”）。查看图\
    \ 5-4。\n"
- fmt: "[](image-o6zbzdpu.png)  \n**Figure 5-4.** Adding Messenger as product to Facebook\
    \ app\n\nUnder settings for Messenger, when you scroll down to the Token Generation\
    \ section you will get a link to create a new page for your app. If you don’t\
    \ have a page already, then create it or choose a page from the “Select a page”\
    \ dropdown. The “Page Access Token” is your `fb_access_token` here. Refer Figure\
    \ 5-5.\n\nYou can go to the following link to create a brand new page for your\
    \ bot project:  \n`https://www.facebook.com/pages/creation/`\n\n![](image-xgmdmdzg.png)\
    \  \n**Figure 5-5.** Generating token for Facebook Messenger App\n\nRight after\
    \ the Token Generation section, under Webhooks, click on “Setup Webhooks.” Refer\
    \ Figure 5-6.\n\n![](image-osfgpga4.png)  \n**Figure 5-6.** Setting up Facebook\
    \ Webhooks\n\nNext, choose a verify token, which we’ll need to use later. The\
    \ verify token can be any random string. This will be your `fb_verify_token`.\
    \ Check Figure 5-7 to understand where to add the verification token in Facebook\
    \ app. Now, leave the callback URL section blank as it is. Don’t close the browser;\
    \ just leave it—we’ll come back here again.\n\n![](image-gr9qu751.png)  \n**Figure\
    \ 5-7.** Adding verify token to Facebook webhook setup\n\nKeep `fb_verify`, `fb_secret`\
    \ and `fb_access_token` handy to connect your bot to Facebook.\n\n## Creating\
    \ and Deploying Rasa Actions Server App on Heroku\n\nIn this step we are going\
    \ to use our actions Heroku app for our Rasa action’s server. We need to have\
    \ two different applications, as we cannot run two web applications in a single\
    \ Heroku app. Go to your command line and execute the following set of commands\
    \ from your project directory as directed.\n\nCreate a new folder called `actions_app`\
    \ and get into the directory:\n\n```\nmkdir actions_app\ncd actions_app\n```\n\
    \nCopy your `actions.py` from main project directory to `actions_app` directory.\n\
    \nCreate a `requirements.txt` file with the following contents. `requirements.txt`\
    \ will tell the Heroku app to install the packages with their versions.\n\n```\n\
    rasa-core-sdk==0.11.0\nrequests==2.18.4\n```\n\nCreate a file named `Procfile`\
    \ with the following contents. `Procfile` is the file for which Heroku understands\
    \ what to do in order to crank up the applications.\n\n```\nweb: python -m rasa_core_sdk.endpoint—actions\
    \ actions\n—port $PORT\n```\n\na) Run the below set of commands:\n\n```\n$ heroku\
    \ login\n$ git init\n$ heroku git:remote -a <your-heroku-app-name>\n$ heroku buildpacks:set\
    \ heroku/python\n$ heroku config:set PORT=5055\n$ git add .\n$ git commit -am\
    \ \"deploy my bot\"\n$ git push heroku master\n```\n\nAfter the last command,\
    \ Heroku will install all our packages needed as per the `requirements.txt` file.\
    \ If your app is successfully deployed, you should be getting logs similar to\
    \ the following:\n\n```\nremote:\nremote:——-> Discovering process types\nremote:\
    \ Procfile declares types -> web\nremote:\nremote:——-> Compressing...\nremote:\
    \ Done: 48.3M\nremote:——-> Launching...\nremote: Released v4\nremote: https://horoscopebot1212-actions.herokuapp.com/\
    \ deployed to Heroku\nremote:\nremote: Verifying deploy... done.\nTo https://git.heroku.com/horoscopebot1212-actions.git\n\
    \ * [new branch] master -> master\n```\n\nAt this point, we will just verify whether\
    \ our app is responding to public requests. In order to do that let’s hit the\
    \ app url appended by “webhook.”\n\nApp url in my case is `https://horoscopebot1212-actions.herokuapp.com/`\
    \ so I’ll go and check if my action’s server is responding.\n\nI go to this url\
    \ and as expected, it comes back saying method not allowed, like in Figure 5-8,\
    \ which is totally fine and means that app is responding correctly as per the\
    \ user request.\n\n![](image-8wj00i4p.png)  \n**Figure 5-8.** Verifying action\
    \ server endpoint\n\n## Creating Rasa Chatbot API App\n\nIn this step we will\
    \ follow some steps and commands similar to what we just did, but this is a new\
    \ app we’ll create that will be our main app for dialog management. So, let’s\
    \ do it. First come back to the main project directory (i.e., in `horoscope_bot`)\
    \ and create a file name and add the following contents to it:\n\n```\nweb: python\
    \ -m spacy download en && python facebook.py\n```\n\n## Creating a Standalone\
    \ Script for Facebook Messenger Chatbot\n\nCreate a file name `facebook.py` in\
    \ the same project directory. The contents of the Python file should be as given\
    \ here:\n\n```python\nfrom rasa_core.channels.facebook import FacebookInput\n\
    from rasa_core.agent import Agent\nfrom rasa_core.interpreter import RasaNLUInterpreter\n\
    import os\nfrom rasa_core.utils import EndpointConfig\n\n# load your trained agent\n\
    interpreter = RasaNLUInterpreter(\"models/nlu/default/horoscopebot/\")\nMODEL_PATH\
    \ = \"models/dialog\"\naction_endpoint = EndpointConfig(url=\"https://horoscopebot1212-actions.herokuapp.com/webhook\"\
    )\nagent = Agent.load(MODEL_PATH, interpreter=interpreter)\ninput_channel = FacebookInput(\n\
    \    fb_verify=\"YOUR_FB_VERIFY_TOKEN\",\n    # you need tell facebook this token,\
    \ to confirm your URL\n    fb_secret=\"YOUR_FB_SECRET\",\n    # your app secret\n\
    \    fb_access_token=\"YOUR_FB_ACCESS_TOKEN\"\n    # token for the page you subscribed\
    \ to\n)\n# set serve_forever=False if you want to keep the server running\ns =\
    \ agent.handle_channels([input_channel], int(os.environ.get('PORT', 5004)), serve_forever=True)\n\
    ```\n\nMake sure to replace the `fb_secret`, and `fb_access_token` variable values\
    \ in this code with what we kept in Step 3.\n\nCreate a new `requirements.txt`\
    \ file and add all the packages and their versions needed for this project. My\
    \ `requirements.txt` looks like the following; for your project the requirements\
    \ may differ, but these requirements should be fine if you are following the same\
    \ bot example in this chapter.\n\n```\nrasa-core==0.11.1\nrasa-core-sdk==0.11.0\n\
    rasa-nlu==0.13.2\ngunicorn==19.9.0\nrequests==2.18.4\nspacy==2.0.11\nsklearn-crfsuite==0.3.6\n\
    ```\n\nNow let’s create a new app again in Heroku like we did earlier. Go to your\
    \ Heroku dashboard and create a new app as shown in Figure 5-9.\n\n![](image-28x4ogbv.png)\
    \  \n**Figure 5-9.**"
  raw: '[](image-o6zbzdpu.png)  Figure 5-4. Adding Messenger as product to Facebook
    app   Under settings for Messenger, when you scroll down to the Token Generation
    section you will get a link to create a new page for your app. If you don’t have
    a page already, then create it or choose a page from the “Select a page” dropdown.
    The “Page Access Token”   is your fb_access_token here. Refer Figure 5-5\.   
    You can go to the following link to create a brand new page for your bot project:
    https://www.facebook.com/pages/creation/  ![](image-xgmdmdzg.png)  Figure 5-5.
    Generating token for Facebook Messenger App   Right after the Token Generation
    section, under Webhooks, click on “Setup Webhooks.” Refer Figure 5-6\.  ![](image-osfgpga4.png) 
    Figure 5-6. Setting up Facebook Webhooks   Next, choose a verify token, which
    we’ll need to use later. The verify token can be any random string. This will
    be your   Check Figure 5-7 to understand where to add the   verification token
    in facebook app. Now, leave the callback URL section blank as it is. Don’t close
    the browser; just leave it—we’ll come back here again.   ![](image-gr9qu751.png) 
    Figure 5-7. Adding verify token to Facebook webhook setup   Keep fb_verify, fb_secret
    and fb_access_token handy to connect your bot to Facebook.   Creating and Deploying
    Rasa Actions Server App on Heroku   In this step we are going to use our actions
    Heroku app for our Rasa action’s server. We need to have two different applications,
    as we cannot run two web applications in a single Heroku app. Go to your command
    line and execute the following set of commands from your project directory as
    directed.   Create a new folder called actions_app and get into the directory:
      mkdir actions_app cd actions_app   Copy your actions.py from main project directory
    to actions_app directory.    Create a requirements.txt file with the following
    contents. requirements.txt will tell the Heroku app to install the packages with
    their versions.   rasa-core-sdk==0.11.0 requests==2.18.4   Create a file named
    Procfile with the following contents. Procfile is the file for which Heroku understands
    what to do in order to crank up the applications.   web: python -m rasa_core_sdk.endpoint—actions
    actions   —port $PORT   a)  Run the below set of commands:   $ heroku login  
    $ git init   $ heroku git:remote -a <your-heroku-app-name></your-heroku-app-name> 
    $ heroku buildpacks:set heroku/python   $ heroku config:set PORT=5055   $ git
    add .   $ git commit -am "deploy my bot"   $ git push heroku master   After the
    last command, Heroku will install all our packages needed as per the requirements.txt
    file. If your app is successfully deployed, you should be getting logs similar
    to the following:   remote:   remote:——-> Discovering process types remote: Procfile
    declares types -> web remote:   remote:——-> Compressing... remote: Done: 48.3M
    remote:——-> Launching... remote: Released v4   remote: https://horoscopebot1212-actions.herokuapp.


    com/ deployed to Heroku    remote:   remote: Verifying deploy... done.   To https://git.heroku.com/horoscopebot1212-actions.git
      *  [new branch] master -> master   At this point, we will just verify whether
    our app is responding to public requests. In order to do that let’s hit the app
    url appended by “webhook.”   App url in my case is https://horoscopebot1212-actions.herokuapp.com/
    so I’ll   go and check if my action’s server is responding.   I go to this url
    and as expected, it comes back saying method not allowed, like in Figure 5-8,
    which is totally   fine and means that app is responding correctly as per the
    user request.  ![](image-8wj00i4p.png)  Figure 5-8. Verifying action server endpoint
      Creating Rasa Chatbot API App   In this step we will follow some steps and commands
    similar to what we just did, but this is a new app we’ll create that will be our
    main app for dialog management. So, let’s do   it. First come back to the main
    project directory (i.e., in horoscope_bot) and create a file name and add the
    following contents to it:   web: python -m spacy download en && python facebook.py 
    Creating a Standalone Script for Facebook Messenger Chatbot   Create a file name
    facebook.py in the same project directory. The contents of the Python file should
    be as given here:   from rasa_core.channels.facebook import FacebookInput from
    rasa_core.agent import Agent   from rasa_core.interpreter import RasaNLUInterpreter
    import os   from rasa_core.utils import EndpointConfig   # load your trained agent
      interpreter = RasaNLUInterpreter("models/nlu/default/horoscopebot/") MODEL_PATH
    = "models/dialog"   action_endpoint = EndpointConfig(url="https://horoscopebot1212-actions.
    herokuapp.com/webhook")   agent = Agent.load(MODEL_PATH, interpreter=interpreter)
    input_channel = FacebookInput(   fb_verify="YOUR_FB_VERIFY_TOKEN",   # you need
    tell facebook this token, to confirm your URL fb_secret="YOUR_FB_SECRET",  # your
    app secret fb_access_token="YOUR_FB_ACCESS_TOKEN"   # token for the page you subscribed
    to   )   # set serve_forever=False if you want to keep the server running   s
    = agent.handle_channels([input_channel], int(os.environ.get(''PORT'', 5004)),
    serve_forever=True)   Make sure to replace the fb_secret, and fb_access_token
    variable values in this code with what we kept in Step 3.   Create a new requirements.txt
    file and add all the packages and their versions needed for this project. My requirements.txt
    looks like the following; for your project the requirements may differ, but these
    requirements should be fine if you are following the same bot example in this
    chapter.  rasa-core==0.11.1 rasa-core-sdk==0.11.0 rasa-nlu==0.13.2 gunicorn==19.9.0
    requests==2.18.4 spacy==2.0.11   sklearn-crfsuite==0.3.6   to install our packages
    in the server.   Now let’s create a new app again in Heroku like we did earlier.
    Go to your Heroku dashboard and create a new app as shown in Figure 5-9\.  ![](image-28x4ogbv.png) 
    Figure 5-9.'
  trans: "\n[](image-o6zbzdpu.png) **图 5-4.** 将 Messenger 作为产品添加到 Facebook 应用\n\n\
    在 Messenger 的设置中，向下滚动到“令牌生成”（Token Generation）部分，你会看到一个为你的应用创建新页面的链接。如果你还没有页面，请创建一个，或者从“选择页面”（Select\
    \ a page）下拉菜单中选择一个页面。“页面访问令牌”（Page Access Token）就是你的 `fb_access_token`。请参考图 5-5。\n\
    \n你可以通过以下链接为你的机器人项目创建一个全新的页面：https://www.facebook.com/pages/creation/\n\n![](img/image-xgmdmdzg.png)\
    \ **图 5-5.** 为 Facebook Messenger 应用生成令牌\n\n在“令牌生成”部分之后，紧接着在“Webhooks”下，点击“设置\
    \ Webhooks”（Setup Webhooks）。请参考图 5-6。\n\n![](img/image-osfgpga4.png) **图 5-6.**\
    \ 设置 Facebook Webhooks\n\n接下来，选择一个验证令牌（verify token），我们稍后会用到它。验证令牌可以是任意随机字符串。这将是你的\
    \ `fb_verify`。请查看图 5-7，了解在 Facebook 应用中添加验证令牌的位置。现在，暂时将回调 URL（callback URL）部分留空。不要关闭浏览器；先放在一边——我们稍后会回到这里。\n\
    \n![](img/image-gr9qu751.png) **图 5-7.** 将验证令牌添加到 Facebook webhook 设置\n\n请将 `fb_verify`、`fb_secret`\
    \ 和 `fb_access_token` 放在手边，以便将你的机器人连接到 Facebook。\n\n**在 Heroku 上创建并部署 Rasa Actions\
    \ 服务器应用**\n\n在这一步中，我们将使用我们的 actions Heroku 应用作为 Rasa action 的服务器。我们需要两个不同的应用，因为我们无法在单个\
    \ Heroku 应用中运行两个 Web 应用。打开命令行，按照指示从你的项目目录执行以下一组命令。\n\n创建一个名为 `actions_app` 的新文件夹并进入该目录：\n\
    \n```\nmkdir actions_app\ncd actions_app\n```\n\n将 `actions.py` 从主项目目录复制到 `actions_app`\
    \ 目录。\n\n创建一个包含以下内容的 `requirements.txt` 文件。`requirements.txt` 将告诉 Heroku 应用安装指定版本的包。\n\
    \n```\nrasa-core-sdk==0.11.0\nrequests==2.18.4\n```\n\n创建一个名为 `Procfile` 的文件，内容如下。`Procfile`\
    \ 是 Heroku 用来理解如何启动应用的文件。\n\n```\nweb: python -m rasa_core_sdk.endpoint—actions\
    \ actions\n—port $PORT\n```\n\na) 运行以下命令集：\n\n```\n$ heroku login\n$ git init\n\
    $ heroku git:remote -a <your-heroku-app-name>\n$ heroku buildpacks:set heroku/python\n\
    $ heroku config:set PORT=5055\n$ git add .\n$ git commit -am \"deploy my bot\"\
    \n$ git push heroku master\n```\n\n执行完最后一条命令后，Heroku 将根据 `requirements.txt` 文件安装我们所需的所有包。如果你的应用成功部署，你应该会看到类似于以下的日志：\n\
    \n```\nremote:\nremote:——-> Discovering process types\nremote: Procfile declares\
    \ types -> web\nremote:\nremote:——-> Compressing...\nremote: Done: 48.3M\nremote:——->\
    \ Launching...\nremote: Released v4\nremote: https://horoscopebot1212-actions.herokuapp.com/\
    \ deployed to Heroku\nremote:\nremote: Verifying deploy... done.\nTo https://git.heroku.com/horoscopebot1212-actions.git\n\
    \ * [new branch] master -> master\n```\n\n此时，我们将验证我们的应用是否响应公共请求。为此，让我们访问附加了“webhook”的应用\
    \ URL。\n\n我的应用 URL 是 https://horoscopebot1212-actions.herokuapp.com/，所以我会去检查我的\
    \ action 服务器是否在响应。\n\n我访问这个 URL，正如预期的那样，它返回“方法不允许”（method not allowed），如图 5-8\
    \ 所示，这完全没问题，意味着应用正在根据用户请求正确响应。\n\n![](img/image-8wj00i4p.png) **图 5-8.** 验证 action\
    \ 服务器端点\n\n**创建 Rasa 聊天机器人 API 应用**\n\n在这一步中，我们将遵循一些与我们刚才所做的类似的步骤和命令，但这是一个我们将创建的新应用，它将是我们用于对话管理的主应用。那么，让我们开始吧。首先回到主项目目录（即\
    \ `horoscope_bot` 目录），创建一个文件并添加以下内容：\n\n```\nweb: python -m spacy download en\
    \ && python facebook.py\n```\n\n**为 Facebook Messenger 聊天机器人创建独立脚本**\n\n在同一项目目录中创建一个名为\
    \ `facebook.py` 的文件。Python 文件的内容应如下所示：\n\n```python\nfrom rasa_core.channels.facebook\
    \ import FacebookInput\nfrom rasa_core.agent import Agent\nfrom rasa_core.interpreter\
    \ import RasaNLUInterpreter\nimport os\nfrom rasa_core.utils import EndpointConfig\n\
    \n# 加载你训练好的 agent\ninterpreter = RasaNLUInterpreter(\"models/nlu/default/horoscopebot/\"\
    )\nMODEL_PATH = \"models/dialog\"\n\naction_endpoint = EndpointConfig(url=\"https://horoscopebot1212-actions.herokuapp.com/webhook\"\
    )\n\nagent = Agent.load(MODEL_PATH, interpreter=interpreter)\ninput_channel =\
    \ FacebookInput(\n    fb_verify=\"YOUR_FB_VERIFY_TOKEN\",\n    # 你需要告诉 Facebook\
    \ 这个令牌，以确认你的 URL\n    fb_secret=\"YOUR_FB_SECRET\",\n    # 你的应用密钥\n    fb_access_token=\"\
    YOUR_FB_ACCESS_TOKEN\"\n    # 你所订阅页面的令牌\n)\n\n# 如果你希望保持服务器运行，请设置 serve_forever=False\n\
    s = agent.handle_channels([input_channel], int(os.environ.get('PORT', 5004)),\
    \ serve_forever=True)\n```\n\n请确保将此代码中的 `fb_secret` 和 `fb_access_token` 变量值替换为我们在步骤\
    \ 3 中保存的值。\n\n创建一个新的 `requirements.txt` 文件，并添加此项目所需的所有包及其版本。我的 `requirements.txt`\
    \ 文件如下所示；对于你的项目，依赖项可能有所不同，但如果你遵循本章中相同的机器人示例，这些依赖项应该没问题。\n\n```\nrasa-core==0.11.1\n\
    rasa-core-sdk==0.11.0\nrasa-nlu==0.13.2\ngunicorn==19.9.0\nrequests==2.18.4\n\
    spacy==2.0.11\nsklearn-crfsuite==0.3.6\n```\n\n以便在服务器中安装我们的包。\n\n现在，让我们像之前一样在\
    \ Heroku 中再次创建一个新应用。转到你的 Heroku 仪表板，创建一个新应用，如图 5-9 所示。\n\n![](img/image-28x4ogbv.png)\
    \ **图 5-9.**\n"
- fmt: '# Creating Dialog Management App in Heroku


    Once you have created the app, you can now go to your project root directory and
    run the following set of commands from the command line in your project folder:


    ```

    $ git init

    $ heroku git:remote -a <your-heroku-app-name>

    $ heroku buildpacks:set heroku/python

    $ heroku config:set PORT=5004

    $ git add .

    $ git commit -am "deploy my bot"

    $ git push heroku master

    ```


    If you get a runtime error after deployment, it may look like below:


    ```

    ValueError: You may be trying to read with Python 3 a joblib pickle generated
    with Python 2. This feature is not supported by joblib.

    ```


    This will mainly happen if you are using Python 2.x version. Heroku, by default,
    uses Python 3.x version. So, in case you want to use Python 2.x, you need to perform
    the steps below to resolve the above error. Change Python 3.6 to Python-2.7.15.
    To do this:


    Create a file `runtime.txt` under root app directory of your project. Open the
    `runtime.txt` and add the following line `python-2.7.15` and then save it. Heroku
    will use the aforementioned Python version only to build your project.


    Once the successful deployment is done, you will see a URL Heroku gives saying
    the app deployed to `<url>`.


    ```

    remote: Compressing source files... done.

    remote: Building source:

    remote:

    remote:------> Python app detected

    remote:------> Installing requirements with pip

    remote:

    remote:------> Discovering process types

    remote: Procfile declares types -> web

    remote:

    remote:------> Compressing...

    remote: Done: 254M

    remote:------> Launching...

    remote: Released v17

    remote: https://horoscopebot1212.herokuapp.com/ deployed to Heroku

    remote:

    remote: Verifying deploy... done.

    To https://git.heroku.com/horoscopebot1212.git cd3eb1b..c0e081d master -> master

    ```


    This deployment is going to take a little time, so be patient as much as you can—you
    are about to see magic. If you didn’t get any error messages, then you have successfully
    deployed your chatbot to Heroku on cloud to make it work with Facebook Messenger.


    Let’s verify if it works.


    ## Verifying the Deployment of Our Dialog Management App on Heroku


    To verify if our dialog management app is successfully deployed on Heroku, we’ll
    be doing the following steps.


    Take the URL given by Heroku and append this endpoint to it:


    `/webhooks/facebook/webhook?hub.verify_token=YOUR_FB_VERIFY_TOKEN`


    Make sure to use the correct verify token that you used for webhooks settings
    in Facebook. The complete URL for me looks like the below:


    `https://horoscopebot1212.herokuapp.com/webhooks/facebook/webhook?hub.verify_token=my-secret-verify-token`


    Go to the browser and paste the entire URL, and it should return your `hub.challenge`
    value back if your `hub.verify_token` is correct. Your complete URL will look
    like the following:


    `https://horoscopebot1212.herokuapp.com/webhooks/facebook/webhook?hub.verify_token=YOUR_FB_VERIFY_TOKEN&hub.challenge=`


    If you get the message `successfully_verified` in the browser then your app is
    successfully deployed and working.


    ## Integrating Webhook With Facebook


    Now let’s go back to our Facebook app configuration. We’ll go to the point where
    we left off in Step 3 and add our callback URL. Make sure to check the `messages`
    in Subscription Fields. Check Figure 5-10 for reference.


    ![](image-r2nilzgl.png)


    Figure 5-10. Facebook Messenger webhooks configuration


    Click on “Verify and Save.” Facebook will match the verify token using the above
    URL, meaning the server, or say our app will only respond to requests that have
    the correct verify token. Once the verify token matches, the webhook subscription
    will get activated for our app.


    Next, select a page to which you can subscribe your webhook to the page events,
    under the Webhooks section on the page. Click on subscribe (see Figure 5-11).


    ![](image-4lwl9u3o.png)


    Figure 5-11. Subscribe webhook to Facebook page events


    All done! Time to test our Horoscope Bot on Facebook.


    ## Post-Deployment Verification: Facebook Chatbot


    In normal software development scenarios, people build software, test it, and
    then deploy and do PDV (post-deployment verification). We’ll also be doing something
    similar, and we’ll do a PDV for our chatbot after our successful deployment on
    Facebook Messenger. This is important because, as you learned, the chatbot has
    a part where it needs to connect to the actions server to respond to some intent
    requests of the user.


    PDV is like a sanity testing to see that the health of the app is good overall.
    If you are building a bot that uses 10 to 15 different vendors’ APIs, then it’s
    a must to check all scenarios where your bot hits the action server and uses the
    API to return data back to the user.


    So, go to your messenger app or Facebook in your computer browser and search for
    your bot to start talking.


    Figures 5-12.1 through 5-12.3 show what my Horoscope Bot does and tells me.


    ![](image-p6wgksu5.png)


    Figure 5-12.1. Horoscope_Bot Facebook


    ![](image-4k5409xr.png)


    Figure 5-12.2. Horoscope_Bot Facebook


    ![](image-bv7usr2q.png)


    Figure 5-12.3. Horoscope_Bot Facebook


    Voila! Our first in-house-built chatbot app is deployed on the web and can be
    accessed via the Facebook Messenger platform. So, go ahead and share it with your
    family, friends, colleagues, and the entire world.


    # Deploying the Chatbot on Slack


    In this section we’ll be deploying our chatbot to Slack. Slack is a team collaboration
    tool widely popular among developers and corporations. If you are not a social
    media person, then you might need Slack’s help to talk to your chatbot using an
    interface. So, let’s dive into building our first in-house Slack chatbot.


    In order to deploy our Horoscope Chatbot to Slack, we’ll be writing a standalone
    script just like we did in the case of Facebook.


    ## Creating a Standalone Script for Slack Chatbot


    Create a new file called `slack.py` in your project’s directory. Contents of the
    file `slack.py`.'
