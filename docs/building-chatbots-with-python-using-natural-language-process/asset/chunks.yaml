    \ Webhooks 应显示“完成”状态。请确保选择一个页面，以便您订阅该页面的 Webhook 事件。\n\n**测试 Messenger 机器人**\n\
    \n为了让我们的机器人可供测试，我们需要将应用设为公开：\n\n在 Facebook 开发者控制台的左侧菜单中，点击“应用审核”。点击“将 <您的应用名称>\
    \ 设为公开？”下方的开关。如果出现“无效的隐私政策 URL”提示，请点击对话框中的“基础设置”链接，如果尚未填写，请先为“隐私政策 URL”输入任意 URL，然后点击“保存更改”。现在，返回“应用审核”页面，再次尝试将应用切换为公开。\n\
    \n系统会提示您为应用选择一个类别。从列表中选择“教育”。您也可以自由选择最适合您机器人的类别。点击“确认”按钮，如图 3-19 所示。\n\n  ![](img/image-hlss6emz.png) \
    \ \n图 3-19. 将您的 Facebook 应用设为公开\n\n我们还需要为我们的页面创建一个用户名。这是用户在使用我们的机器人时进行聊天的用户名。要设置用户名，请点击页面“关于”部分下的“创建页面\
    \ @用户名”链接，如图 3-20 所示。这有助于您仅使用一个简短名称来分享您的页面或机器人。\n\n ![](img/image-q6oqwien.png) \
    \ \n图 3-20. 创建您的 Facebook 机器人页面用户名\n\n让我们在 Facebook Messenger 上测试我们之前在 Dialogflow\
    \ 网站上测试过的相同机器人流程。您应该能够通过参考图 3-21.1 至图 3-21.4 看到我的 Facebook Messenger 机器人是如何响应的。\n\
    \n ![](img/image-g64dgtqj.png)  \n图 3-21.1. Facebook Messenger OnlineEatsBot 演示界面\
    \ I\n\n ![](img/image-wvlzfznn.png)  \n图 3-21.2. Facebook Messenger OnlineEatsBot\
    \ 演示界面 II\n\n ![](img/image-eq4dd3f9.png)  \n图 3-21.3. Facebook Messenger OnlineEatsBot\
    \ 演示界面 III\n\n ![](img/image-58kk3pbo.png)  \n图 3-21.4. Facebook Messenger OnlineEatsBot\
    \ 演示界面 IV\n\n各位，这就是我们构建机器人的方法。\n\n第 4 章会更加有趣。在第 4 章中，我们将尝试在不依赖 Dialogflow API\
    \ 或仪表板的情况下实现相同的功能。\n\n能够完全掌控自己所拥有的一切总是好的，不是吗？\n\n**注意：** 您可以前往您的账户设置，直接导出或导入智能体。您可以下载\
    \ zip 文件。您可以使用此 zip 文件将其导入 Dialogflow，并体验我们在本章中构建的聊天机器人。\n\n您一定在想，如果我想实时处理订单，并使用供应商/餐厅的\
    \ API 查找订单状态并相应地回复用户，该怎么办？这可以是您想要进行的任何 API 调用——实时检索数据并制定机器人的响应。在结束本章并为下一章做准备之前，是时候了解如何做到这一点了。\n\
    \n让我们来了解 Dialogflow 中一个叫做 **Fulfillment** 的功能。\n\n为了获取用户请求的实时信息，我们需要开发一些 API 或使用现有的\
    \ API。要使用 Dialogflow 实现这一点，我们需要进行设置，这包括部署一个服务并调用 API。\n\n我们不会深入探讨构建 API 和如何部署的细节，但如果您曾经尝试使用过任何\
    \ Google 或 Facebook 的 API，您至少应该熟悉如何调用它们。\n\n我构建了一个基于 Flask 的小型 API，并将其部署到了 Heroku。我将用它来实现\
    \ fulfillment，该 API 只需在 URL 中接收任何 `order_id`，并返回一个随机的 `order_status`。如果您不熟悉 Heroku，请不要担心，您可以在本地系统上运行提供的代码并进行测试。在接下来的章节中，我们将使用\
    \ Heroku 部署大量应用程序，届时您可以学习与之相关的知识。\n\n在代码中，您可以了解如何解析 `order_identity`、`intentName`\
    \ 等。在此处查找代码：`flask_onlineeats_demo.zip`\n\n请求 URL：`https://radiant-bayou-76095.herokuapp.com/onlineeatsbot/`\n\
    \n`api/v1.0/order_status/`\n\n因此，在 Dialogflow Fulfillment 中，会将来自意图的 JSON 响应 POST\
    \ 到此 URL，您需要解析该响应以获取相关的实体及其值，并执行特定的操作。\n\n您也可以尝试将示例 Flask 应用代码部署到 Heroku，并在您的机器人中拥有自己的\
    \ fulfillment 端点。\n\n现在，Dialogflow 会将启用了 webhook 调用的意图的 JSON 响应 POST 到我们的端点。该端点包含解析\
    \ `order_id` 实体并根据其采取行动的代码。目前，该代码仅从列表中返回一个随机选择的状态。\n\n要测试 API 是否正常工作，请前往 POSTMAN\
    \ 并使用图 3-22 中的示例数据进行测试。如果您在本地运行 Flask 应用，请使用本地 URL。\n\n ![](img/image-k7cauxpl.png) \
    \ \n图 3-22. 在 POSTMAN 中测试部署在 Heroku 上的 fulfillment API\n\n**启用 Webhook**\n\n那么，让我们前往\
    \ Dialogflow 中的 fulfillment 页面，尝试启用 webhook（见图 3-23）。\n\n ![](img/image-z444ejmj.png) \
    \ \n图 3-23. 在 Dialogflow 中为 fulfillment 设置 webhook\n\n请确保您已为 `user_order_id` 意图启用了\
    \ webhook 调用（见图 3-24）。\n\n ![](img/image-bdz453lo.png)  \n图 3-24. 为特定意图启用 webhook\
    \ 调用\n\nDialogflow 会将一个 JSON 主体 POST 到您的 webhook URL，该主体将类似于图 3-25。\n\n ![](img/image-cmdfozwp.png) \
    \ \n––––––––\n\n图 3-25.\n"
- fmt: "# Incoming JSON Data from Dialogflow to Our Webhook Endpoint\n\n## Checking\
    \ the Response\n\n`Dialogflow` expects a response from your web service in the\
    \ format shown in Figure 3-26 whenever they POST an intent’s JSON response (shown\
    \ in Figure 3-25) to your web service.\n\n![](image-l7se7exx.png)\n\n*Figure 3-26.\
    \ Response from the webhook URL expected by Dialogflow*\n\nIf you are thinking\
    \ that your API’s response should be exactly in the same format as Figure 3-26,\
    \ then relax—that’s not the case. Your intent won’t throw errors because all of\
    \ the keys in the JSON body are optional.\n\nHere is how my API response looks\
    \ and works perfectly:\n\n```json\n{\n  \"fulfillmentText\": \"Order ID: 9999.\
    \ It's on the way\",\n  \"payload\": {\n    \"facebook\": {\n      \"text\": \"\
    Order ID: 9999. It's on the way\"\n    }\n  }\n}\n```\n\nWhen I try to hit the\
    \ same API again I get a different order status text but with the same format\
    \ expected by `Dialogflow` engine.\n\n```json\n{\n  \"fulfillmentText\": \"Order\
    \ ID: 9999. Rider has picked up your food, please wait for another 10-15 minutes\"\
    ,\n  \"payload\": {\n    \"facebook\": {\n      \"text\": \"Order ID: 9999. Rider\
    \ has picked up your food, please wait for another 10-15 minutes\"\n    }\n  }\n\
    }\n```\n\n`fulfillmentText` is the key that matters for the agent to reply something\
    \ back to the user.\n\nNow, try the bot with the public URL or in the `Dialogflow`\
    \ agent itself to see the responses coming from the API instead of the default\
    \ static responses we added earlier.\n\nThis is how we can integrate an external\
    \ API or our own API using `Dialogflow`’s fulfillment feature into our chatbot\
    \ to make things dynamic and real-time.\n\n## Summary\n\nIn this chapter we learned\
    \ about `Dialogflow` and how to use `Dialogflow` to build a chatbot. We learned\
    \ to define intents and their respective entities. We built a simple food ordering\
    \ chatbot that understands the order food intent from the user and also understands\
    \ what food items the user has asked for as well as the quantity. We also enhanced\
    \ our chatbot to let users ask about the status of their order and take their\
    \ order ID from them and formulate a response with different order statuses.\n\
    \nWe also learned about fulfillment in `Dialogflow`, where we pulled the status\
    \ of the order from our own API and gave the response to the user based on that.\
    \ We learned to create a web demo of our chatbot, and we also integrated our bot\
    \ with Messenger. At this point, you should have a fair idea of how a chatbot\
    \ works end-to-end.\n\nIn the next chapter we are going to try the harder way\
    \ of building chatbots. Yes, you heard it right. We are going to remove the dependency\
    \ from tools like `Dialogflow` and build everything ourselves programmatically.\
    \ Let’s get ready for the next chapter, because that is going to be even more\
    \ fun when you have built everything from scratch yourself. It’s like training\
    \ and taming your own chatbots.\n\nSee you in the next chapter.\n\n# Chapter 4\
    \ – Building Chatbots the Hard Way\n\n“Building Chatbots the Hard Way” is not\
    \ too hard to learn.\n\nIt’s the hard way of building chatbots to have full control\
    \ over your own chatbots. If you want to build everything yourself, then you take\
    \ the hard route. The harder route is hard when you go through it but beautiful\
    \ and clear when you look back.\n\n> It is a rough road that leads to the heights\
    \ of greatness.\n> —Lucius Annaeus Seneca\n\nIf you know Python well and have\
    \ a bit of understanding on how to setup packages, etc., you won’t have any issues\
    \ learning this chapter. If you are a developer, it should be easy for you. If\
    \ you are a manager or non-technical person, you can still do the steps one-by-one\
    \ as mentioned in each section and get things done. I strongly recommend everyone\
    \ complete this chapter so that you learn core things about building chatbots.\n\
    \nThis chapter not only teaches you to build chatbots from scratch but also shows\
    \ you how core machine learning (ML) works with NLP with the help of `Rasa NLU`.\
    \ As mentioned in the first chapter on this book, it is always good to have decision\
    \ trees when you are building chatbots. In this chapter, we’ll barely be using\
    \ any rules, but ML is not at that stage yet to be 100 percent reliable. So, this\
    \ decision is based completely on your use-case and whether you want to apply\
    \ some business logic along with your ML models or not. Sometimes, your ML model\
    \ may work so well that you don’t need any heuristics at all. But in my experience,\
    \ when you go on to sell your chatbots or commercialize them, you have to be a\
    \ little careful. No functionality is better than having a functionality that\
    \ doesn’t make sense.\n\nWe’ll be using an open-source library called `Rasa NLU`\
    \ for learning how to build chatbots from scratch without using any cloud services\
    \ like `Dialogflow`, `Watson`, `wit.ai`, etc. Remember `Rasa NLU` is a very sophisticated\
    \ library and has lots of features in it. We are only going to touch upon the\
    \ concepts and features that are important for us to build our chatbot.\n\n##\
    \ What Is Rasa NLU?\n\n`Rasa NLU` is an NLP library for intent classification\
    \ and entity extraction in chatbots. It helps you build and write custom NLP for\
    \ your chatbots.\n\nThere are two parts of `Rasa` that we’ll be covering in this\
    \ chapter.\n\n- **Rasa NLU**: With `Rasa NLU` we’ll be learning to prepare our\
    \ training data for our chatbot, writing configuration files, choosing a pipeline\
    \ and training the model. Lastly, we will be predicting the intent of a text using\
    \ our model. We’ll also be learning how to parse entities using `Rasa NLU`.\n\n\
    - **Rasa Core**: In the second part we’ll be learning to train the `Rasa Core`\
    \ dialog management model to prepare responses back to the user. This section\
    \ becomes very important when you have a variety of intents in your chatbot and\
    \ their follow-up questions or responses. Instead of writing lots of conditions\
    \ in our decision tree and spending hours debugging it in case of a big enterprise-level\
    \ application, it’s better to teach the model to create responses."
