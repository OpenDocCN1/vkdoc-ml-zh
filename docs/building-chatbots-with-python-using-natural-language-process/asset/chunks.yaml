    \ 所示，spaCy 会尝试下载一些核心文件，并将它们作为 Python 包安装。\n\n![](img/image-cb122h8q.png)\n**注意**！`!`（感叹号操作符）仅在\
    \ Jupyter Notebook 中有效。要直接从终端安装 spaCy 模型，你需要去掉 `!`（感叹号操作符）；否则会导致错误。\n\n![](img/image-pgmlux7j.png)\n\
    \n[1] https://www.python.org/downloads/\n[2] https://packaging.python.org/tutorials/installing-packages/#installing-from-pypi\n\
    [3] http://docs.python-guide.org/en/latest/dev/virtualenvs/\n\n构建聊天机器人的 NLP 基础方法\n\
    \n要想精通某件事并高效地完成它，打好基础非常重要。要构建聊天机器人，我们需要了解 NLP 的基础方法。这些方法帮助我们分解输入并理解其含义。在下一节中，我们将学习一些最常用的\
    \ NLP 方法，这些方法不仅能帮助你精通 NLP，还能帮助你构建出色的聊天机器人。我们处理输入文本的能力越强、效率越高，就越能更好地回应用户。\n\n词性标注\n\
    \n词性标注是一个过程，你读取一些文本，并为每个单词或标记分配词性，例如名词、动词、形容词等。\n\n当你想要识别给定句子中的某个实体时，词性标注变得极其重要。第一步是进行词性标注，看看我们的文本包含什么。\n\
    \n让我们通过一些真实的词性标注示例来动手实践。\n\n示例 1：\nnlp = spacy.load('en') # 将 spaCy en 模型加载到 Python\
    \ 对象中\ndoc = nlp(u'I am learning how to build chatbots') # 创建一个 doc 对象\nfor token\
    \ in doc:\n    print(token.text, token.pos_) # 打印文本和词性\n\n输出：\n('I', 'PRON')\n\
    ('am', 'VERB')\n('learning', 'VERB')\n('how', 'ADV')\n('to', 'PART')\n('build',\
    \ 'VERB')\n('chatbots', 'NOUN')\n\n示例 2：\ndoc = nlp(u'I am going to London next\
    \ week for a meeting.')\nfor token in doc:\n    print(token.text, token.pos_)\n\
    \n('I', 'PRON')\n('am', 'VERB')\n('going', 'VERB')\n('to', 'ADP')\n('London',\
    \ 'PROPN')\n('next', 'ADJ')\n('week', 'NOUN')\n('for', 'ADP')\n('a', 'DET')\n\
    ('meeting', 'NOUN')\n('.', 'PUNCT')\n"
- fmt: "As we can see, when we print the tokens from the returned `Doc` object from\
    \ the method `nlp`, which is a container for accessing the annotations, we get\
    \ the POS tagged with each of the words in the sentence. These tags are the properties\
    \ belonging to the word that determine the word is used in a grammatically correct\
    \ sentence. We can use these tags as the word features in information filtering,\
    \ etc.\n\nLet’s try to take another example where we try to explore different\
    \ attributes of the token coming from `Doc` object.\n\n### Example 3:\n```\ndoc\
    \ = nlp(u'Google release \"Move Mirror\" AI experiment that matches your pose\
    \ from 80,000 images')\nfor token in doc:\n    print(token.text, token.lemma_,\
    \ token.pos_, token.tag_, token.dep_, token.shape_, token.is_alpha, token.is_stop)\n\
    ```\n\n### Example 4:\n```\ndoc = nlp(u'I am learning how to build chatbots')\n\
    for token in doc:\n    print(token.text, token.lemma_, token.pos_, token.tag_,\
    \ token.dep_, token.shape_, token.is_alpha, token.is_stop)\n```\n\nRefer to the\
    \ below table to find out the meaning of each attribute we printed in the code.\n\
    \n![](image-fze3xtb3.png)\n\n- **TEXT**: Actual text or word being processed\n\
    - **lemma**: root form of the word being processed\n- **pos**: part-of-speech\
    \ of the word\n- **tag**: they express the part-of-speech (e.g., Verb) and some\
    \ amount of morphological information (e.g., that the verb is past tense).\n-\
    \ **dep**: syntactic dependency (i.e., the relation between tokens)\n- **shape**:\
    \ shape of the word (e.g., the capitalization, punctuation, digits format)\n-\
    \ **alpha**: is the token an alpha character?\n- **stop**: is the word a stop\
    \ word or part of a stop list?\n\nYou can refer the below table to understand\
    \ what each POS attribute values of the token object mean. This list gives a detailed\
    \ idea of part-of-speech tags assigned by spaCy’s models.\n\nSo why is POS tagging\
    \ needed for chatbots?\n\nAnswer: to reduce the complexity of understanding a\
    \ text that can’t be trained or is trained with less confidence. By use of POS\
    \ tagging, we can identify parts of the text input and do string matching only\
    \ for those parts. For example, if you were to find if a location exists in a\
    \ sentence, then POS tagging would tag the location word as `NOUN`, so you can\
    \ take all the `NOUN`s from the tagged list and see if it’s one of the locations\
    \ from your preset list or not.\n\n## Stemming and Lemmatization\n\nStemming is\
    \ the process of reducing inflected words to their word stem, base form. A stemming\
    \ algorithm reduces the words “saying” to the root word “say,” whereas “presumably”\
    \ becomes `presum`. As you can see, this may or may not always be 100% correct.\n\
    \nLemmatization is closely related to but lemmatization is the algorithmic process\
    \ of determining the lemma of a word based on its intended meaning. For example,\
    \ in English, the verb “to walk” may appear as “walk,” “walked,” “walks,” or “walking.”\
    \ The base form, “walk,” that one might look up in a dictionary, is called the\
    \ lemma for the word. spaCy doesn’t have any in-built stemmer, as lemmatization\
    \ is considered more correct and productive.\n\n### Difference between Stemming\
    \ and Lemmatization\n\n- Stemming does the job in a crude, heuristic way that\
    \ chops off the ends of words, assuming that the remaining word is what we are\
    \ actually looking for, but it often includes the removal of derivational affixes.\n\
    - Lemmatization tries to do the job more elegantly with the use of a vocabulary\
    \ and morphological analysis of words. It tries its best to remove inflectional\
    \ endings only and return the dictionary form of a word, known as the lemma.\n\
    \nThough few libraries provide methods for stemming as well as lemmatization,\
    \ it’s always a best practice to use lemmatization to get the root word correctly.\n\
    \nLet’s try to explore lemmatization by taking some of the examples:\n\n### Example\
    \ 1:\n```\nfrom spacy.lemmatizer import Lemmatizer\nfrom spacy.lang.en import\
    \ LEMMA_INDEX, LEMMA_EXC, LEMMA_RULES\nlemmatizer = Lemmatizer(LEMMA_INDEX, LEMMA_EXC,\
    \ LEMMA_RULES)\nlemmatizer('chuckles', 'NOUN') # 2nd param is token's part-of-speech\
    \ tag\n```\nOutput:\n```\n[u'chuckle']\n```\n\n### Example 2:\n```\nlemmatizer('blazing',\
    \ 'VERB')\n```\nOutput:\n```\n[u'blaze']\n```\n\n### Example 3:\n```\nlemmatizer('fastest',\
    \ 'ADJ')\n```\nOutput:\n```\n[u'fast']\n```\n\nIf you want to see the comparison\
    \ between a stemmer and lemmatizer, then you need to install one of the most popular\
    \ libraries for Python: Natural Language Toolkit (NLTK). spaCy has gained popularity\
    \ very recently, but it was NLTK that made every NLP enthusiast take a plunge\
    \ into the ocean of NLP and its techniques.\n\nCheck the following example where\
    \ we try to use two stemming techniques provided by NLTK. First, we try to get\
    \ the stem of the word “fastest” using `PorterStemmer` and then using `SnowBallStemmer`."
