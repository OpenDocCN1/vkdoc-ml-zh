    this is coming from.   We’ll try to understand how we have been doing things so
    far for building the chatbots and how this is going to be changed forever.   Let’s
    take an example:   If we were to build a simple chatbot that would help users
    book flight/bus/movie/ train tickets, the easiest way would be to create a state
    machine or decision trees, write a bunch of if...else, and it would be done. This
    would work but wouldn’t scale. If a customer is having a good experience initially
    with something, they want to use it more. By some heuristics, we can show a chatbot
    to be intelligent but not for very long.'
  trans: "\n编写 Python 代码训练模型并进行预测  \n让我们打开一个新的`.ipynb`文件，开始编写代码。将 ipynb 文件命名为`rasa-nlu.ipynb`。请确保已针对您使用的\
    \ Python 版本成功安装了`rasa-nlu==0.13.2`。  \n\n以下是我们使用`data.json`和`config.json`在 Python\
    \ 中加载数据，并通过`tensorflow_embedding`管道训练模型的代码。  \n\n```python\nfrom rasa_nlu.training_data\
    \ import load_data\nfrom rasa_nlu.model import Trainer\nfrom rasa_nlu import config\n\
    from rasa_nlu.model import Interpreter\n\ndef train_horoscopebot(data_json, config_file,\
    \ model_dir):\n    training_data = load_data(data_json)\n    trainer = Trainer(config.load(config_file))\n\
    \    trainer.train(training_data)\n    model_directory = trainer.persist(model_dir,\
    \ fixed_model_name='horoscopebot')\n\ndef predict_intent(text):\n    interpreter\
    \ = Interpreter.load('./models/nlu/default/horoscopebot')\n    result = interpreter.parse(text)\n\
    \    print(result)\n```\n\n在代码的第一部分，我们从`rasa_nlu`包中导入了所有必要的库。然后定义了两个方法：`train_horoscopebot`和`predict_intent`。第一个方法根据给定的数据、配置文件（`config_file`）和模型存储目录（`model_directory`）来训练模型；第二个方法使用`rasa_nlu`中的`Interpreter`模型加载预训练好的模型文件，使用户能够预测任何新的文本示例。\n\
    \n**训练模型**  \n我们运行以下代码片段，调用`train_horoscopebot`方法并传入相应参数：  \n\n```python\ntrain_horoscopebot('./data/data.json',\
    \ 'config.json', './models/nlu')\n```\n\n在`rasa-nlu.ipynb`中运行此代码后，我们将得到类似如下的输出：\
    \  \n\n```\nEpochs: 300/300 [00:01<00:00, 175.69it/s, loss=0.075, acc=1.000]\n\
    ```\n\n训练聊天机器人模型的代码会创建一个`models`文件夹，您可以通过 Jupyter 或文件资源管理器/访达应用查看。它会在我们指定的模型目录路径下生成一系列索引、元数据和\
    \ pickle 文件。\n\n**从模型进行预测**  \n让我们调用该方法，传入一段文本，看看训练好的模型表现如何：  \n\n```python\n\
    predict_intent(\"I am looking for my horoscope for today. I am wondering if you\
    \ can tell me that.\")\n```\n\n该方法会直接打印输出结果。对于上述文本，我的输出如下所示：  \n\n```\nINFO:tensorflow:Restoring\
    \ parameters from ./models/nlu/default/horoscopebot/intent_classifier_tensorflow_embedding.ckpt\n\
    \n{\n  \"intent\": {\n    \"name\": \"get_horoscope\",\n    \"confidence\": 0.9636583924293518\n\
    \  },\n  \"entities\": [],\n  \"intent_ranking\": [\n    {\n      \"name\": \"\
    get_horoscope\",\n      \"confidence\": 0.9636583924293518\n    },\n    {\n  \
    \    \"name\": \"dob_intent\",\n      \"confidence\": 0.03462183475494385\n  \
    \  },\n    {\n      \"name\": \"greeting\",\n      \"confidence\": 0\n    },\n\
    \    {\n      \"name\": \"subscription\",\n      \"confidence\": 0\n    }\n  ],\n\
    \  \"text\": \"I am looking for my horoscope for today. I am wondering if you\
    \ can tell me that.\"\n}\n```\n\n哇！是不是很神奇？我们的模型以 96%的置信度预测出了这段文本的意图。您可以在提供的 ipynb\
    \ 文件中看到，我们的模型在预测其他意图方面也表现良好。\n\n这就是 tensorflow 和机器学习整体的力量。毋庸置疑，`rasa_nlu`库让这一切变得如此简单可信。所以，是时候回顾一下了——如果您还记得本书的第\
    \ 3 章，那么您一定记得，每当我们添加一个新示例时，Dialogflow 都会重新训练模型。它实际上在幕后做着和我们刚才一样的事情。我们当时无法更改模型或调整任何参数，但现在我们完全可以掌控这一切。\n\
    \n既然我们已经成功使用 tensorflow 构建并训练了一个模型，并且也对其进行了测试，接下来我们将进入对话管理的下一个主题。我建议您测试一下您的机器人可能面临的所有场景，这样您就能了解模型在哪些方面表现不佳，并据此添加更多数据或在必要时调整参数。\n\
    \n另外请记住，只有当训练数据发生变化时，才需要重新训练模型。如果训练数据没有变化，我们可以加载现有的训练模型，持续对新示例进行预测。\n\n**使用 Rasa\
    \ Core 进行对话管理**  \n在本节中，我们将通过训练另一个用于 Rasa Core 对话管理的模型来亲自动手实践。请记住，此时我们已经有了一个可以预测文本意图的模型，我们可以编写一些\
    \ Python 代码来生成回复，并回复给客户。但是，如果我们想为机器人添加更多意图呢？在功能众多的大型应用中，这种方式是否可扩展？答案是否定的。这时，Rasa\
    \ Core 的对话管理功能就派上用场了。\n\n如果您曾在任何平台上使用过任何机器人，您一定见过它在某些情况下失败。是的，我们都经历过这种情况，而且这种情况至今仍然存在——如今的机器人往往无法妥善管理对话的上下文，也无法跟上对话的节奏。借助\
    \ Rasa Core 基于机器学习的对话框架，我们可以轻松解决这个问题。\n\nRasa Core 在企业级应用中久经考验，被成千上万的开发者使用，因为它生产就绪、易于使用和扩展，而且最重要的是，它是开源的。\n\
    \n**进一步了解 Rasa Core 和对话系统**  \n在我们真正进入 Rasa Core 对话管理模型的编码部分之前，理解其来源和适用场景非常重要。\n\
    \n我们将尝试理解迄今为止我们构建聊天机器人的方式，以及这种方式将如何被彻底改变。\n\n举个例子：  \n如果我们想构建一个简单的聊天机器人，帮助用户预订机票/巴士票/电影票/火车票，最简单的方法是创建一个状态机或决策树，编写一堆`if...else`语句，然后就可以完成了。这种方法虽然可行，但无法扩展。如果客户最初对某件事有良好的体验，他们就会想更多地使用它。通过一些启发式方法，我们可以让聊天机器人显得智能，但这种智能无法持久。"
- fmt: "# When the control flow of the code goes from `try` block to `except` block,\
    \ we start scratching our heads.\n\nFigure 4-2 is a simple representation of how\
    \ a state machine for building this chatbot may look.\n\n![](image-fhk2k9em.png)\n\
    \n**Figure 4-2. State diagram representation for ticket booking chatbot**\n\n\
    If we look at our state diagram, it may work for a normal conversation where the\
    \ user is looking for movie, bus, or train tickets or wants to book a bus ticket\
    \ after asking for movie tickets. What if the user asks for both bus and movie\
    \ tickets together? You may say that we can add a couple more `if...else` statements\
    \ in our already nested code to handle that. If you are a good developer, it won’t\
    \ take you much time to write an in-out from a state machine or extend your decision\
    \ tree. But think of the situation when these conditions start growing exponentially\
    \ and you have to keep adding cases to handle that and they start interfering\
    \ with each other as well.\n\nOur brain works in a way where we learn and relearn.\
    \ If a kid doesn’t know what a fire is going to do to them, they touch it, but\
    \ when it hurts them, they do not do it again. They reinforce a fact that it’s\
    \ harmful. It works similarly in the case of rewards—when you do something and\
    \ get something, you associate a fact that doing something brings rewards or better\
    \ rewards and then you intend to do that again. This is called reinforcement learning\
    \ in ML, where a machine learns how to behave in a particular situation by performing\
    \ actions and understanding the results. Reinforcement learning is sometimes not\
    \ the best approach, such as in situations where data is not sufficient to be\
    \ learned, data quality is not good to learn the reward scenarios, etc.\n\nFigure\
    \ 4-3 is a diagram to help you understand how Rasa Core fits well within the Rasa\
    \ Stack and its role along with Rasa NLU, which we have been learning so far.\n\
    \n![](image-5lijm842.png)\n\n**Figure 4-3. Diagram representing the working of\
    \ Rasa NLU and Rasa Core**\n\nWith Rasa Core, we can specify all of the things\
    \ our bot is supposed to say or do. These are called actions. One action might\
    \ be to say a greeting to the user or to query a database, or it could be to retrieve\
    \ some information using some web service or API.\n\nRasa Core provides the facility\
    \ to train our probabilistic model to predict what action has to be taken based\
    \ on the historical conversation of the user or users. Imagine doing it without\
    \ an ML model and writing hundreds of use-cases to figure out what response or\
    \ action should be sent or executed. In simple terms, Rasa Core solves this problem\
    \ for you.\n\nLet’s look at the side-by-side user vs. bot conversation that we\
    \ built in Chapter 3 while building an OnlineEatsBot.\n\n![](image-k35fw6pl.png)\n\
    \n**User** | **OnlineEatsBot**\n--- | ---\n![](image-l83ltg41.png) hello onlineeats\
    \ | hello! how may i help you?\ni am looking to order food | sure, What would\
    \ you like to order today?\none chicken burger | done. your final amount is $3.99\n\
    ![](image-he8wx5vt.png) thank you | thanks a lot\n\nThis conversation is pretty\
    \ much simple and can be done without any ML model as well, even though we did\
    \ use a trained model to recognize the intent and entities in it.\n\nNow, the\
    \ interesting question that will come to your mind is, “What if I want my bot\
    \ to be able to change the order? What if I want my bot to be able to remove or\
    \ add more quantity of the food items?” So, as discussed, add more use-cases,\
    \ more complexity, more intents and their utterances, more `if...else` in code\
    \ to handle corner-cases, but when you are building a chatbot for a business you\
    \ have to scale it to generate more revenue through it. All software systems do\
    \ that, and those who don’t fail to survive. The bottom line is, we can’t keep\
    \ changing and deploying the code.\n\nSo, instead of handling all the cases as\
    \ they occur and repeatedly doing it, we can take the ML route to tackle this\
    \ problem, with the help of Rasa Stack, which will tell us what the bot should\
    \ do next based on the user’s context and the state of the conversation. Since\
    \ the model learns itself based on the context of the previous conversation data,\
    \ it becomes easier for the bot to keep the conversation more natural and user-friendly\
    \ rather than randomly choosing from four to five fixed sentences.\n\nRasa recommends\
    \ users with little or no data use interactive learning. We’ll get to know more\
    \ about interactive learning later in this chapter.\n\nBefore we actually start\
    \ using Rasa Stack to write the core part of our bot, first we need to understand\
    \ a few concepts.\n\n## Understanding Rasa Concepts\n\nIt’s really important that\
    \ we understand a few specific concepts related to Rasa before actually trying\
    \ to use them in code completely. In this section we’ll be learning a few important\
    \ and very useful concepts of Rasa NLU. Make sure you understand these concepts\
    \ completely, as we will be using them in building our first in-house chatbot\
    \ using Rasa’s domain file format. If we do not understand what these concepts\
    \ mean, then it’ll be difficult to take the next step.\n\n### Action\n\nAs the\
    \ name suggests, it’s a specific action that can be taken. As per Rasa documentation,\
    \ it says, action to be taken in response to a dialog.\n\nFor example, if a user\
    \ asks the horoscope for today, our bot could execute the `GetTodaysHoroscope`\
    \ action. Let’s see how a `GetTodaysHoroscope` action would look in form of a\
    \ code.\n\n```python\nfrom rasa_core.actions import Action\nfrom rasa_core.events\
    \ import SlotSet\n\nclass GetTodaysHoroscope(Action):\n    def name(self):\n \
    \       return \"get_todays_horoscope\"\n\n    def run(self, dispatcher, tracker,\
    \ domain):\n        # type: (Dispatcher, DialogueStateTracker, Domain) -> List[Event]\n\
    \        user_horoscope_sign = tracker.get_slot('horoscope_sign')\n        \"\"\
    \"Write your logic to get today’s horoscope details\n        for the given Horoscope\
    \ sign based on some API calls or retrieval from the database\"\"\"\n        return\
    \ [SlotSet(\"horoscope_sign\", user_horoscope_sign)]\n```\n\nThe `name` method\
    \ returns the name of the Action that we’ll refer to in the domain file as custom\
    \ method name."
