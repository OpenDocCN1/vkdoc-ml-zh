  trans: "\n企业将聊天机器人视为这一代营销工具之一的时代已经到来。  \n• **可访问性**：它们易于访问。消费者可以打开网站并开始提问或解决疑问，无需拨打电话号码，也无需遵循\
    \ IVR 中那种“按 1 选这个，按 2 选那个”的繁琐流程。只需提供基本信息，他们就能快速切入正题。  \n• **效率**：客户可以坐在办公室的办公桌前，或客厅的沙发上，一边看比赛，一边查询信用卡申请状态、查找食品订单状态，或就任何问题提出投诉。如果你让客户变得高效且富有成效，他们就会开始喜欢你。聊天机器人正是如此，并有助于提升业务。\
    \  \n• **可用性**：聊天机器人每周 7 天、每天 24 小时可用。它们永远不会像人类员工那样向你请假或感到疲倦。它们每次都会以同样的效率和性能执行相同或新的任务。当你仅仅为了获取一条信息，却听到某个客服电话说“请在上午\
    \ 9:00 至下午 6:00 之间致电我们”时，你一定会感到沮丧。你的聊天机器人永远不会这么说。  \n• **可扩展性**：一个聊天机器人 => 100\
    \ 万名员工。你明白吗？是的，如果你的聊天机器人能完成客户所需的任务，它可以毫不费力地同时处理数十万条客户查询。你无需让客户排队等待客服代表空闲。  \n\
    • **成本**：毋庸置疑，它为企业节省了大量成本。谁不喜欢省钱呢？当聊天机器人能为你做到这一点时，你没有理由不喜欢它们。  \n• **洞察力**：你的销售代表可能无法记住用户的行为，也无法为你提供关于消费者行为模式的独家见解，但你的聊天机器人可以利用最新的机器学习和数据科学技术做到这一点。\
    \  \n\n**聊天机器人带来收入**  \n聊天机器人已被证明能够成功为企业带来更多收入。与竞争对手相比，那些开始提供聊天机器人支持或创建新聊天机器人来支持客户查询的企业，在市场上表现更佳。\
    \  \n\n根据 stanfy.com 上的一篇博文，1-800-Flowers.com 在推出其 Facebook 聊天机器人后的头两个月内报告称，其\
    \ Messenger 订单中超过 70% 来自新客户。这些新客户通常也比公司典型的购物者更年轻，因为他们已经熟悉 Facebook Messenger 应用。这显著增加了他们的年收入。\
    \  \n聊天机器人最大的附加价值之一在于将其用于挖掘潜在客户。你可以直接在客户注意力所在之处（即时通讯应用）接触到潜在客户，并向他们展示你最新的产品、服务或商品。\
    \  \n\n当客户想要购买产品/服务时，他们可以在聊天机器人内完成购买，包括支付流程。像 1-800flowers.com、eBay 和 Fynd 这样的聊天机器人已经证明了这一点。\
    \  \n——Julien Blancher，Recast.AI 联合创始人  \n\n在 ChatbotsLife 创始人 Stefan Kojouharov\
    \ 的一篇文章中，他提到了不同公司如何通过聊天机器人赚取比没有它们时更多的钱。他说：  \n电子商务领域已经开始以多种方式使用聊天机器人，这些方式正在迅速增加其利润。让我们看看早期的成功案例：\
    \  \n• **1–800-Flowers**：报告称其超过 70% 的 Messenger 订单来自新客户！  \n• **Sephora**：通过其\
    \ Facebook Messenger 聊天机器人，将预约化妆服务增加了 11%。  \n• **Nitro Café**：通过其 Messenger 聊天机器人将销售额提高了\
    \ 20%，该机器人专为轻松下单、直接支付和即时双向沟通而设计。  \n• **Sun's Soccer**：在特定的足球赛事报道期间，聊天机器人将近 50%\
    \ 的用户引导回其网站；在其最佳时期，43% 的聊天机器人订阅者点击了链接。  \n• **Asos**：使用 Messenger 聊天机器人将订单量增加了\
    \ 300%，并获得了 250% 的广告支出回报率，同时覆盖人数增加了 3.5 倍。  \n\n图 1-2 试图让你了解为什么聊天机器人与收入之间存在直接关联。让我们看看图\
    \ 1-2 来了解一些相关信息。  \n\n![](img/image-g8ms8ck2.png)  \n图 1-2. 聊天机器人带来收入  \n\n**聊天机器人使用概览**\
    \  \n我们将尝试了解聊天机器人因其易用性和提供的效率而对消费者有多么有用。在这个炙手可热的 IT 时代，每个人都希望事事快速，而使用聊天机器人能让你的工作每天都更轻松、更快捷。它以一种不会重复显而易见的事情的方式实现个性化；这让我们重新思考软件的传统用法。图\
    \ 1-3 提供了一个图示，应该能让你对聊天机器人的使用有一个清晰的概念。  \n\n![](img/image-orlx4uxf.png)  \n图 1-3.\
    \ 消费者使用聊天机器人概览  \n\n**客户偏爱聊天机器人**  \n聊天机器人不仅仅是现代时代的软件。聊天机器人就像我们的个人助理，他们理解我们，并且可以进行微调配置。他们记得我们的好恶，并且永远不会因为忘记我们已经教过的东西而让我们失望，这就是每个人都喜欢聊天机器人的原因。下次你见到一个人或你的客户时，别忘了问问他们更喜欢传统软件还是新的尖端聊天机器人。让我们看看图\
    \ 1-4，了解客户在人机交互中偏爱聊天机器人而非其他软件系统的原因。  \n\n![](img/image-euic3jzw.png)  \n图 1-4.\
    \ 客户偏爱聊天机器人  \n\n在本章的下一节中，我们将讨论为什么聊天机器人是新兴开发者的下一个重大机遇。  \n"
- fmt: 'Whether you are a newer or a mid-level developer or an experienced SME, you
    must understand what is available to developers when building chatbots.


    ## The Developer’s Perspective


    Have you ever felt the pain when you have to update the OS of your computer or
    phone or any other app that you might be using in order to use new features? What
    if there is not much need to update the app every time to use new features? Or
    say, instead of having multiple apps, one could have one single app that did most
    of the things currently done by multiple apps? Bots for developers are fun to
    build. It’s like teaching your kid to walk, talk, behave, and do things. You love
    making it more intelligent and self-sufficient. From a developer’s perspective,
    chatbots are a very important subject to know about.


    ## Feature Releases and Bug Fixes


    Lots of features can be added to the chatbot painlessly without having your users
    update your chatbot app. It might be a pain in the neck if you released a version
    of the app with some bug, and you have to fix it and release again in the AppStore
    for approval, and, most importantly, the users will have to update the app after
    all. If they don’t update, then the customer will keep complaining about the issue,
    which results in productivity loss for everyone. In chatbots, everything is API-based,
    so you just fix the issue in the backend, deploy the changes in PRODUCTION, and
    woaah—issue fixed for your users without any worry. You save lots of time from
    user-reported bugs as well.


    Imagine you built a bot to find restaurants and later you wanted to add the capability
    of searching for hotels, flights, etc. Users can easily just request such information,
    and your backend chatbot system will take care of everything.


    Suppose you are building a Facebook Messenger chatbot; you can control almost
    everything, including what interface the user sees in his app, directly from your
    backend. In Facebook Messenger bots, you can choose whether the user gets to click
    on a button to say Yes/No or just enters simple text.


    ## Market Demand


    Fifty-four percent of the developers worldwide worked on chatbots for the first
    time in 2016. There is a huge demand for building a simple chatbot that works
    for companies, and they are looking for developers who can build it for them.
    Once you have completed Chapter 3 of this book I bet you can start selling your
    services to companies easily. You can also do your own startup in an area of your
    expertise by introducing a chatbot for that domain. Being able to build a chatbot
    end-to-end is a new skill to have, and that’s the reason average market pay is
    also very good for chatbot developers.


    The growing demand for chatbots can be seen in the number of chatbots being developed
    on developer platforms like Facebook. Facebook has 100,000 monthly active bots
    on the Messenger platform, and counting.


    You will be amazed to know that Messenger had 600 million users in April 2015,
    growing to 900 million in June 2016, 1 billion in July 2016, and 1.2 billion in
    April 2017.


    ## Learning Curve


    Whether you are from a frontend/backend background or know very little programming,
    there is immense possibility to learn new things when you are building or learning
    to build a chatbot. In this process you will learn about many things. For example,
    you get to learn more about Human Computer Interaction (HCI), which talks about
    the design and use of computer technology, focused on the interfaces between people
    and computers. You will be learning how to build or use APIs or web services,
    using third-party APIs like Google APIs, Twitter APIs, Uber APIs, etc. You will
    have immense opportunity to learn about Natural Language Processing, machine learning,
    consumer behavior, and many other technical and non-technical things.


    ## Industries Impacted by Chatbots


    Let’s have a quick look at the industries that will benefit most from chatbots.
    A research study by Mindbowser in association with Chatbots Journal collected
    data from 300+ individuals who participated from a wide array of industries including
    online retail, aviation, logistics, supply chain, e-commerce, hospitality, education,
    technology, manufacturing, and marketing & advertising. If we look at the chart
    in Figure 1-5, it is pretty much evident that e-commerce, insurance, healthcare,
    and retail are the industries benefiting most from chatbots. These industries
    rely heavily upon the responsiveness of the customer care team in an efficient
    manner that saves time. Given the fact that chatbot is good at that, it is evident
    that it will hail in these industries pretty quickly.


    ![](image-xxrx1yed.png)


    **Figure 1-5.** Top industries that will benefit most from chatbots


    At this point of time, the chatbots are still getting traction in newer sectors
    in different forms. The next 5 to 10 years will be very much crucial for chatbots
    to spread the word in different industries that have no experience working with
    chatbots.


    ## Brief Timeline of Chatbots


    Let’s look at the brief history of the timeline of how chatbots were formulated.
    It’s very important to know where chatbot technology came from and how it was
    shaped.


    Chatbots have certainly gained popularity recently but the efforts are being made
    using decades of work with this technology. The history of chatbots will certainly
    amaze you regarding how far we have come since we started.


    ### 1950


    The Turing test was developed by Alan Turing. It was a test of a machine’s ability
    to exhibit intelligent behavior equivalent to, or indistinguishable from, that
    of a human.


    Eliza, the first chatbot, was created by Joseph Weizenbaum, designed to be a therapist.
    It used to simulate a conversation by using a “pattern matching” and substitution
    methodology that gave users an illusion of understanding on the part of the bot.'
