  trans: "\n`run` 方法负责执行动作的主要工作——即核心业务逻辑位于此处。如你所见，它接受三个参数：`dispatcher`、`tracker` 和\
    \ `domain`。让我们逐一理解这些参数：\n\n• `dispatcher`：调度器用于向用户发送消息。我们可以使用 `dispatcher.utter_message()`\
    \ 来实现这一点。\n• `tracker`：当前用户的状态追踪器。我们可以使用 `tracker.get_slot(slot_name)` 访问槽值，要获取最近的用户消息，可以使用\
    \ `tracker.latest_message.text`。\n• `domain`：机器人的领域。我们将在本章后面更详细地讨论领域。\n\n![](img/image-bt9rkmuc.png)\n\
    \n**注意**：`run` 方法返回一个事件实例列表。\n\n![](img/image-vbahuoun.png)\n\n––––––––\n\n###\
    \ 槽位\n\n槽位是让机器人能够像人类一样工作的关键。槽位就像一个存储空间，可以存储用户提供的信息，也可以使用从数据库或 API 预取的信息。\n\n针对不同的用例，有不同类型的槽位：\n\
    \n例如，在我们构建 HoroscopeBot 的用例中，我们可能希望将用户提供的 `horoscope_sign` 的槽位类型设置为文本。\n\n根据你想要保留的槽位类型，Rasa\
    \ 提供了一些预定义的槽位类型。\n\n除了文本类型，Rasa 还有以下槽位类型：\n\n• **布尔型** ⇒ 用于真/假值\n• **类别型** ⇒ 用于需要从几个值中选择一个的情况\n\
    • **浮点型** ⇒ 用于连续值\n• **列表型** ⇒ 用于值列表\n• **特征化型** ⇒ 用于不影响对话的内部值存储\n\n### 模板\n\n\
    “模板”这个词你在生活中一定至少听过一次，比如在寻找发送电子邮件的模板、准备文档的模板、构建个人作品集网站的模板，或者遵循某个流程时。\n\nRasa 中的模板用于话语。一个话语模板包含一组预设文本，当某个动作被触发时，这些文本会被发送给用户。通过使动作的名称与话语相同，或者通过一个包含自定义代码的动作，我们可以将模板中格式化后的消息发送给用户。\n\
    \n领域文件中模板的简单表示可能如下所示：\n\n```\ntemplates:\n  utter_greet:\n    - \"你好，{name}。{name}\
    \ 可以通过同名槽位或自定义代码填充\"\n  utter_goodbye:\n    - \"再见\"\n    - \"保重。多个模板允许机器人从中随机选择\"\
    \n  utter_default:\n    - \"抱歉，我没有理解您的意思。\"\n```\n\n现在，我们已经了解了动作、槽位和模板这三个概念，并且通过第\
    \ 3 章的学习已经知道了意图和实体是什么，我们准备深入 Rasa，开始为我们的第一个聊天机器人编写代码。\n\n### 为聊天机器人创建领域文件\n\n\
    使用 Rasa 技术栈构建聊天机器人时，首要任务就是创建一个领域文件。\n\n根据 Rasa 的文档：“领域定义了你的机器人运行所在的宇宙。\n\n它指定了你的机器人应该知道的意图、实体、槽位和动作。可选地，它还可以包含机器人可以说的话的模板。”\n\
    \n现在，你明白为什么我们之前要提前理解 Rasa 核心概念来为这种情况做准备了吧。让我们创建一个使用 YAML 定义的 `DefaultDomain` 文件。Rasa\
    \ 使用 `.yml` 文件来定义领域格式。\n\n最初，YAML 被认为是“Yet Another Markup Language”（另一种标记语言）的缩写，表明其作为标记语言的用途，但后来被改为理解为“YAML\
    \ Ain't Markup Language”（YAML 不是标记语言），这是一个递归缩写，目的是将其用途区分为面向数据，而不是文档标记语言。\n\n现在，让我们回到我们的\
    \ `rasa-nlu` Jupyter Notebook 目录，开始创建文件。请注意，我们可以使用命令行将所有代码写在单独的文件中，并使用编辑器进行编辑。我发现\
    \ Jupyter Notebook 更具交互性，并且浏览文件更方便。选择你习惯的方式即可，但了解 Jupyter Notebook 提供的大部分功能是件好事。\n\
    \n进入主 `horoscope_bot` 目录，创建一个文件，我们将其命名为 `horoscope_domain.yml`。\n\n以下是我们机器人的 `horoscope_domain.yml`\
    \ 文件内容：\n\n```\nslots:\n  horoscope_sign:\n    type: text\n  DD:\n    type: text\n\
    \  MM:\n    type: text\n  subscribe:\n    type: bool\n\nintents:\n  - greeting\n\
    \  - get_horoscope\n  - subscription\n  - dob_intent\n\nentities:\n  - horoscope_sign\n\
    \  - DD\n  - MM\n  - subscribe\n  - dob_intent\n\ntemplates:\n  utter_greet:\n\
    \    - '你好！今天过得怎么样？'\n  utter_ask_horoscope_sign:\n    - '你的星座是什么？'\n  utter_ask_dob:\n\
    \    - '你的出生日期是什么（DD-MM 格式）？'\n  utter_subscribe:\n    - '你想订阅每日更新吗？'\n\nactions:\n\
    \  - utter_greet\n  - utter_ask_horoscope_sign\n  - utter_ask_dob\n  - utter_subscribe\n\
    \  - get_todays_horoscope\n  - subscribe_user\n```\n\n如你所见，领域文件由五个重要部分组成：意图、实体、槽位、模板和动作，这些我们之前都讨论过。\n\
    \n请注意，每个模板都对应一个 `utterAction` 定义，例如 `utter_greet`，并且我们必须在模板部分定义一个同名的模板。\n\n正如在我们的示例中所见，主要定义了五个动作，其中前三个动作仅用于向用户说出模板文本，但最后两个动作需要我们要么从数据库检索数据，要么进行\
    \ API 调用来获取当天的星座运势并将其返回给用户。\n\n对于 `subscribe_user` 动作也是如此，我们需要执行一个操作，将当前用户添加到数据库的订阅列表中。这些用户定义的动作被称为自定义动作。要实现这样的自定义动作，我们需要编写当这些动作被触发时机器人应该执行的操作。\n\
    \n在下一节中，我们将学习如何编写自定义动作。"
- fmt: "# Writing Custom Actions of the Chatbot\n\nAs we know, whenever an `UtterAction`\
    \ is triggered, our bot will respond back with the utter text defined in the template\
    \ for that Action. But what happens when some custom action is triggered? In this\
    \ section we’ll write Python code to create custom actions, which we can use to\
    \ make API calls or pretty much any kind of thing that you can do with Python.\n\
    \nLet’s create a new file called `actions.py` in our project directory (i.e.,\
    \ in our case inside `horoscope_bot` folder).\n\n```python\nfrom __future__ import\
    \ absolute_import\nfrom __future__ import division\nfrom __future__ import print_function\n\
    from __future__ import unicode_literals\n\nimport requests\n\nfrom rasa_core_sdk\
    \ import Action\nfrom rasa_core_sdk.events import SlotSet\n\n\nclass GetTodaysHoroscope(Action):\n\
    \    def name(self):\n        return \"get_todays_horoscope\"\n\n    def run(self,\
    \ dispatcher, tracker, domain):\n        # type: (Dispatcher, DialogueStateTracker,\
    \ Domain) -> List[Event]\n        user_horoscope_sign = tracker.get_slot('horoscope_sign')\n\
    \        base_url = \"http://horoscope-api.herokuapp.com/horoscope/{day}/{sign}\"\
    \n        url = base_url.format(**{'day': \"today\", 'sign': user_horoscope_sign})\n\
    \        # http://horoscope-api.herokuapp.com/horoscope/today/capricorn\n    \
    \    res = requests.get(url)\n        todays_horoscope = res.json()['horoscope']\n\
    \        response = \"Your today's horoscope:\\n{}\".format(todays_horoscope)\n\
    \        dispatcher.utter_message(response)\n        return [SlotSet(\"horoscope_sign\"\
    , user_horoscope_sign)]\n```\n\nAs we can see, there are two methods in our action\
    \ called `GetTodaysHoroscope`. The first method `name()` just returns the name\
    \ of the action. The other method is `run()` and, as discussed earlier, is the\
    \ method that actually does the task by executing the business logic that we write.\n\
    \nIn our method we are making use of an open-source API with code hosted on github.\
    \ The API url looks like this:\n\n`http://horoscope-api.herokuapp.com/horoscope/today/capricorn`\n\
    \nwhich returns the data in JSON format:\n\n```json\n{\n    \"date\": \"2018-08-29\"\
    ,\n    \"horoscope\": \"You will be overpowered with nostalgia and may long to\
    \ get in touch with old pals. And as Ganesha says, chances are that you may take\
    \ a liking to your ex-lover, while simultaneously strengthening your social standing.\
    \ All in all, the day will be a productive one.\",\n    \"sunsign\": \"capricorn\"\
    \n}\n```\n\nAs you can see in the `run()` method, we convert the response from\
    \ the API to Python JSON object and then access the `'horoscope'` key from the\
    \ JSON to get the actual horoscope. After getting the actual horoscope from the\
    \ JSON, we formulate a response and dispatch it back to the user using the `dispatcher`\
    \ object and its method, `utter_message`.\n\nAt the end we set the slot using\
    \ `SlotSet` method. `SlotSet` is like saving the variables that you figured out\
    \ from user’s responses so that you can use them any time in your code during\
    \ the flow of the conversation.\n\n![](image-p5zdooqk.png)\n\n**Note:** Using\
    \ the above API we can get today’s horoscope by providing the horoscope sign.\
    \ You are free to use your own API or database. You just need to replace the API\
    \ call with some other source that you want to use.\n\n![](image-ddknj6ax.png)\n\
    \nJust like we added the `GetTodaysHoroscope` action in the `actions.py` file,\
    \ we’ll also add `SubscribeUser` action as well. We are not going to use any database\
    \ to store the user subscription preferences, but when you are building a chatbot\
    \ for real users, you may have to have `user_ids` that you can link with their\
    \ subscriptions in the database.\n\nThe following is how the `SubscribeUser` action\
    \ looks:\n\n```python\nclass SubscribeUser(Action):\n    def name(self):\n   \
    \     return \"subscribe_user\"\n\n    def run(self, dispatcher, tracker, domain):\n\
    \        # type: (Dispatcher, DialogueStateTracker, Domain) -> List[Event]\n \
    \       subscribe = tracker.get_slot('subscribe')\n        if subscribe == \"\
    True\":\n            response = \"You're successfully subscribed\"\n        if\
    \ subscribe == \"False\":\n            response = \"You're successfully unsubscribed\"\
    \n        dispatcher.utter_message(response)\n        return [SlotSet(\"subscribe\"\
    , subscribe)]\n```\n\nLike this, we can write as many custom actions as needed.\n\
    \n## The Next Step is the Data\n\nRasa’s dialog management model is trained on\
    \ actual conversations that users and the chatbot do. The important point here\
    \ is that those conversations have to be converted into a story format.\n\nA story\
    \ is nothing but an actual conversation between a user and a chatbot where user\
    \ inputs are converted into intents and entities while responses being returned\
    \ from the chatbot are treated as actions that the chatbot is supposed to trigger\
    \ when it’s required.\n\nOne of the examples of how a real conversation between\
    \ a user and a chatbot may look as a story is given in the table below.\n\n###\
    \ Scenario I\n\n![](image-2p6f243l.png)\n\n| User | HoroscopeBot |\n|------|--------------|\n\
    | hello there! | `utter_greet` |\n| i want to know my horoscope for today | `utter_ask_horoscope_sign`\
    \ |\n| My sign is Capricorn | `actions.gettodayshoroscope` |\n| Can you subscribe\
    \ me for updates? | `actions.subscribeuser` |\n\n### Scenario II\n\n![](image-lse3cu7y.png)\n\
    \n| User | HoroscopeBot |\n|------|--------------|\n| hello there! | `utter_greet`\
    \ |\n| i want to know my horoscope for today | `utter_ask_horoscope_sign` |\n\
    | i don’t know my sign | `utter_ask_dob` |\n| 12-12 | `actions.gettodayshoroscope`\
    \ |\n\nWe haven’t yet covered the scenario in the code where the user doesn’t\
    \ know his horoscope sign but knows his DOB. Here, our code needs some modification\
    \ to get the `DATE` and `MONTH` entities when `horoscope_sign` value is not found.\n\
    \nWe could use DD-MM values to check the horoscope sign and then call the `GetTodaysHoroscope`\
    \ method explicitly or train the model in that way.\n\n## Data Preparation for\
    \ Training the Bot\n\nIt’s always important to have good quality data before doing\
    \ any kind of ML. For training our chatbot we also need data; the conversation\
    \ between a user and a chatbot is the data on which we need to train our models.\
    \ Sometimes it becomes difficult to find a dataset freely on the web that fits\
    \ our own need.\n\nWe should spend the time we need to get the data gathered.\
    \ We can ask our friends and family to provide us the sample conversation text\
    \ of how they would interact with a kind of bot you are building. Some people\
    \ create sample example apps for the same and crowd-source the data. So, better\
    \ the data, better the model, and better the chatbot responses.\n\nWhen it comes\
    \ to preparing the data, Rasa leaves no stone unturned and comes with a cool feature\
    \ called **interactive learning**. It helps you in generating story data easily\
    \ and also trains the dialog management model as we keep adding the story data.\
    \ You can call it real-time ML training. So, as we keep on adding our story data,\
    \ we get to know if our model is producing correct output or not. Most importantly\
    \ we get to see if the model is improving or degrading when we add new stories.\
    \ In most cases it will get better because we’ll be kind of doing the reinforcement\
    \ learning where we tell the ML model to unlearn and relearn—pretty much what\
    \ human beings do.\n\n## Creating Story Data\n\nAs we know, story data is just\
    \ a way of conversation between a user and a chatbot on how it would lead to a\
    \ logical end. In general, all chatbots are designed to help users with a set\
    \ of predefined things; stories just represent how they are done.\n\nWe’ll try\
    \ to prepare some simple dialogs in the format that Rasa expects. These dialogs\
    \ will be stateless—that is, they do not depend on previous dialogs. We will be\
    \ using our handmade stateless stories for interactive learning.\n\nWe’ll take\
    \ a couple of minutes to just hand-curate a few stories that we know of, so that\
    \ we get acclimatized with how story data is created.\n\nLet’s first create a\
    \ file named `stories.md` in our `data` folder."
