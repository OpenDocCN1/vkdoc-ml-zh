  raw: 'Your own custom chatbot on your own website ![](image-iwsheqsj.png)  Figure
    5-20.2. Your own custom chatbot on your own website   Using Heroku’s custom domain
    name features, one can easily point the same app to their own website’s name,
    like Do that when you feel your chatbot is good enough to be opened to the entire
    world for profit or non-profit purposes.   So, that’s all folks! That’s how chatbots
    are built with Python using Natural Language Processing and machine learning.
    I hope this chapter along with the previous chapters was helpful to you and you
    could learn the practical approach toward learning and building chatbots.Summary
      In this chapter, we learned how to deploy our own app to our own servers using
    Heroku. We learned how to integrate our chatbot with Facebook using Facebook’s
    developer platform. We also learned to create a custom chatbot for a Slack app
    and tested it as well. Finally, as promised at the end of chapter-III, removing
    all dependencies from any social media platform platform, we created our own UI
    and deployed it on Heroku and tested it. We saw it working like a charm—it worked
    while training it. As we have a basic model  up and working, now you can handle
    cases where chatbot doesn’t work well. Determine if it’s an issue related to data
    or training, actions server, or custom code handling. Once you find the root case,
    fix that, deploy again, and check to see if chatbot improves. We build big software
    by starting small.   I am looking forward to hearing from you and curious to know
    what chatbot you built after going through this book. I will be happy to help
    you anytime if you are stuck on any concepts, code execution, or deployment.  
    Thanks and Cheers.  Index   A   Automated and fixed bot, 18   B   Business perspective,
