  trans: "\npy 的代码将如下所示：  \n```python\nfrom rasa_core.channels.slack import SlackInput\n\
    from rasa_core.agent import Agent\nfrom rasa_core.interpreter import RasaNLUInterpreter\n\
    import os\nfrom rasa_core.utils import EndpointConfig\n\n# 加载你训练好的智能体\ninterpreter\
    \ = RasaNLUInterpreter(\"models/nlu/default/horoscopebot/\")\nMODEL_PATH = \"\
    models/dialogue\"\n\naction_endpoint = EndpointConfig(url=\"https://horoscopebot1212-actions.herokuapp.com/webhook\"\
    )\n\nagent = Agent.load(MODEL_PATH, interpreter=interpreter, action_endpoint=action_endpoint)\n\
    \ninput_channel = SlackInput(\n    slack_token=\"YOUR_SLACK_TOKEN\",\n    # 这是\
    \ `bot_user_o_auth_access_token`\n    slack_channel=\"YOUR_SLACK_CHANNEL\"\n \
    \   # 机器人发布消息的频道名称（可选）\n)\n\n# 如果希望保持服务器运行，请设置 serve_forever=False\ns = agent.handle_channels([input_channel],\
    \ int(os.environ.get('PORT', 5004)), serve_forever=True)\n```\n`facebook.py` 和\
    \ `slack.py` 的主要区别在于我们创建的 `input_channel` 对象。Rasa 提供了多种内置渠道，如 Facebook、Slack、Mattermost、Telegram、Twilio、RocketChat\
    \ 和 Microsoft Bot Framework，我们可以直接使用它们轻松地将同一个机器人部署到不同渠道。\n\n如你所见，我们需要在脚本中添加 `slack_token`\
    \ 和 `slack_channel`。就像我们之前在 Facebook 开发者平台上创建 Facebook 应用一样，我们同样需要在 Slack 上创建一个应用。\n\
    \n让我们逐步操作：\n\n访问此网址 https://api.slack.com/slack-apps，然后点击“Create App”按钮。请参考图 5-13。\n\
    \n![](img/image-xffek5ca.png)  \n––––––––  \n图 5-13. 在 Slack 中创建应用\n\n下一步是创建一个机器人用户。要创建机器人用户，请在“Add\
    \ features and functionality”下点击“Bots”。在新页面中，你将看到“Add a Bot User”选项。查看图 5-14，了解如何添加详细信息并创建机器人用户。\n\
    \n![](img/image-pxpymnpf.png)  \n图 5-14. 在 Slack 中为你的机器人命名\n\n根据你正在构建的聊天机器人填写详细信息。显示名称可以是你喜欢的任何名称；默认用户名必须唯一，你可以保持原样。将最后一个选项切换为“始终将我的机器人显示为在线”，是为了让机器人始终以用户身份显示为可用状态。这正是聊天机器人的意义所在——人类无法\
    \ 24/7 在线，但聊天机器人可以，因此我们开启此功能。确保点击“保存更改”。返回“Basic Information”选项卡。点击“Install your\
    \ app to your workspace”。应用将要求确认身份。请像授权其他应用一样进行授权。查看图 5-15，了解授权界面的样式。\n\n![](img/image-9kwu09sz.png)\
    \  \n图 5-15. 授权你的 Slack 应用\n\n你会在“Add features and functionality”下看到“Bots”和“Permissions”选项卡旁边带有绿色对勾，这意味着我们的机器人和应用已良好集成。这表明我们到目前为止进展顺利。\n\
    \n转到你的“OAuth & Permissions”部分，复制“Bot User OAuth Access Token”。将复制的令牌粘贴到我们的 Python\
    \ 脚本中。按你喜欢的方式指定频道名称。如果你希望机器人向某个频道发布消息，则可以指定频道名称。我指定了 `@slackbot`。如果你不设置 `slack_channel`\
    \ 关键字参数，消息将直接回复给发送者。\n\n**编辑你的 Procfile**\n\n在这一步中，我们不会创建新的 Procfile，因为我们使用的是相同的代码库。我们将修改现有的\
    \ Procfile 为以下内容，使其适用于我们的 Slack 机器人。因此，我们只需将脚本文件名从 `facebook.py` 改为 `slack.py`，以便\
    \ Heroku 使用该文件启动应用。\n\n```\nweb: python -m spacy download en && python slack.py\n\
    ```\n\n**最终将 Slack 机器人部署到 Heroku**\n\n为了最终将我们的新 Slack 机器人部署到 Heroku，我们将从命令行运行一组类似的\
    \ Heroku 命令来部署我们的应用。\n\n```\n$ git init\n$ heroku git:remote -a <your-heroku-app-name>\n\
    $ git add .\n$ git commit -am \"deploy my bot\"\n$ git push heroku master\n```\n\
    \n**订阅 Slack 事件**\n\n现在，点击选项卡，通过切换屏幕上的按钮来激活事件订阅功能。输入用于 Slack 的 Heroku 应用 webhook\
    \ URL。\n\n如果你的应用已使用修改后的 Procfile 正确部署到 Heroku，那么你的 Slack webhook URL 将是 `app_url\
    \ + /webhooks/slack/webhook`，如下所示：\n\n```\nhttps://horoscopebot1212.herokuapp.com/webhooks/slack/webhook\n\
    ```\n\n在 Slack 向上述 URL 发送一个包含 `challenge` 参数的 HTTP POST 请求后，你将看到一个已验证的对勾标记，并且我们的端点必须使用该\
    \ `challenge` 值进行响应。这类似于我们在构建 Facebook 聊天机器人的密钥时讨论的内容。查看图 5-16 以了解更多信息。\n\n![](img/image-qfsuuebc.png)\
    \  \n图 5-16. 为你的机器人激活事件订阅\n\n**订阅机器人事件**\n\n在这一步中，我们只需向下滚动事件订阅页面，进入“Subscribe\
    \ to Bot Events”部分，然后点击“Add Bot User Event”。参考图 5-17 了解导航位置。\n\n![](img/image-uicpdf46.png)\
    \  \n图 5-17. 订阅机器人事件\n\n订阅机器人事件实际上就是声明机器人需要响应的事件。我们这里只演示两种场景：第一，当有人提及机器人的名字时（即\
    \ `@bot_name`）；第二，当有人直接向机器人发送消息时（即 `message.im`）。\n\n现在，点击“保存更改”，你就完成了。是时候像上一节测试\
    \ Facebook 聊天机器人那样，测试我们的 Slack 聊天机器人了。\n\n**部署后验证：Slack 机器人**\n\n让我们回到用于创建应用的工作区，在左侧的“Apps”下找到你的机器人。尝试与它对话，看看它是否正常工作。我的机器人表现相当不错，能为我提供今天的星座运势，读起来很有趣。如果你还没能走到这一步，请查看图\
    \ 5-18，了解我的 Slack 机器人是如何响应的。\n\n![](img/image-uicpdf46.png)  \n图 5-18. Slack 机器人的响应示例\n"
- fmt: "# 排版后的内容\n\n![](image-6l69pxto.png) Figure 5-18. Testing the Slack chatbot\n\
    \nSo, folks we are done with our Slack Bot. In the next section, we’ll be deploying\
    \ our bot to our own UI. Building your own UI may require some front-end skills,\
    \ but do not worry—we have plans for that.\n\n## Deploying the Chatbot on Your\
    \ Own\n\nWell the caption sounds cool, doesn’t it? So far, we have been deploying\
    \ our chatbot on the web using Facebook or Slack, or we could have used Telegram,\
    \ etc., but now it’s time to deploy everything on our own—our own servers, our\
    \ own data, and our own configured model using our own user interface. If you\
    \ are an organization or a budding entrepreneur, you may have your bot idea on\
    \ Facebook, Twitter, or Slack, but you would always want it to be working on your\
    \ own websites as well so that your brand value increases more and more as the\
    \ user base increases.\n\nIn this section we are going to use all our hard work\
    \ so far to finally build a chatbot, which is fully functional and independent\
    \ from any third-party API calls or tools like Dialogflow, wit.ai, Watson, etc.\
    \ You will have all the control in the world to tweak your chatbot the way you\
    \ want and, most importantly, scale it the way you want to millions of people\
    \ easily.\n\nSo, let’s get started.\n\nThe first step is to ensure that two of\
    \ our apps that we have deployed so far in the previous sections are up and running.\
    \ You already know how to do a basic sanity check. You always need your dialog\
    \ manager app and actions app to be running to use your chatbot model on any platform.\n\
    \nNow, in the same project directory where we have been creating `facebook.py`\
    \ and `slack.py`, we’ll create a new file called `myown_chatbot.py`. The scripts\
    \ created previously, like `facebook.py` and `slack.py`, are standalone scripts\
    \ that we created so that we can just tell Heroku in a command which script to\
    \ run to crank up the application. Now, we are creating our own script that will\
    \ expose the request/response between a user and the chatbot via REST APIs.\n\n\
    Deploying your own chatbot has two parts. In the first part, we’ll be writing\
    \ a script to create a custom channel and deploy it as REST APIs. In the second\
    \ part, we need our own UI, because so far, we have been using Facebook’s and\
    \ Slack’s chat screens for the conversations.\n\n### Writing a Script for Your\
    \ Own Chatbot Channel\n\nThis script is similar to what we have learned and written\
    \ so far, but it needs us to override some of the existing methods of `rasa_core`\
    \ so that we can define our own rule for API authentication. I have done the basic\
    \ string check for token verification in the following code. This is not suggested\
    \ for production-level systems, so make sure to write that part with care if you\
    \ are building a chatbot for larger systems.\n\nCreate a new file named `myown_chatbot.py`\
    \ and add the following contents to it:\n\n```python\nimport os\n\nfrom rasa_core.channels.rasa_chat\
    \ import RasaChatInput\nfrom rasa_core.agent import Agent\nfrom rasa_core.interpreter\
    \ import RasaNLUInterpreter\nfrom rasa_core.utils import EndpointConfig\n\n# load\
    \ your trained agent\n\ninterpreter = RasaNLUInterpreter(\"models/nlu/default/horoscopebot/\"\
    )\nMODEL_PATH = \"models/dialogue\"\n\naction_endpoint = EndpointConfig(url=\"\
    https://horoscopebot1212-actions.herokuapp.com/webhook\")\nagent = Agent.load(MODEL_PATH,\
    \ interpreter=interpreter, action_endpoint=action_endpoint)\n\nclass MyNewInput(RasaChatInput):\n\
    \    def _check_token(self, token):\n        if token == 'mysecret':\n       \
    \     return {'username': 'user'}\n        logger.info(\"Failed to check token:\
    \ {}.\".format(token))\n        return None\n\ninput_channel = MyNewInput(url='https://horoscopebot1212.herokuapp.com')\n\
    # set serve_forever=False if you want to keep the server running\ns = agent.handle_channels([input_channel],\
    \ int(os.environ.get('PORT', 5004)), serve_forever=True)\n```\n\nA couple of points\
    \ to be noted here:\n\n- `_check_token` method in `rasa_core` basically looks\
    \ like the following, which makes an API call to get the user object. This primarily\
    \ does the job of user-level authentication/authentication. In the earlier overridden\
    \ method, we have kept it simple to make it work and understand its usage.\n\n\
    ```python\ndef _check_token(self, token):\n    url = \"{}/users/me\".format(self.base_url)\n\
    \    headers = {\"Authorization\": token}\n    logger.debug(\"Requesting user\
    \ information from auth server {}.\".format(url))\n    result = requests.get(url,\
    \ headers=headers, timeout=DEFAULT_REQUEST_TIMEOUT)\n    if result.status_code\
    \ == 200:\n        return result.json()\n    logger.info(\"Failed to check token:\
    \ {}. Content: {}\".format(token, request.data))\n    return None\n```\n\n- Using\
    \ Rasa’s own `_check_token` method may require you to write one API or web service\
    \ that accepts the request and returns the response in the specified way.\n- Make\
    \ sure to change the action’s server endpoint to your own url.\n- Remember the\
    \ `mysecret` string in the code will be used to make the API calls later.\n\n\
    ### Writing the Procfile and Deploying to the Web\n\nBy this time you must be\
    \ pretty familiar with creating Procfiles for Heroku deployment. We’ll again use\
    \ our existing `Procfile` and do the modifications there to deploy our API-based\
    \ chatbot to the web. Feel free to create a new `Procfile` after creating backups\
    \ of existing ones.\n\nThe following is what my `Procfile` content looks like:\n\
    \n```\nweb: python -m spacy download en && python myown_chatbot.py\n```\n\nOnce\
    \ you are done, just execute the next set of commands that we already learned\
    \ while deploying our Facebook Messenger and Slack Bot.\n\n```\n$ git init\n$\
    \ heroku git:remote -a <your-heroku-app-name>\n$ git add .\n$ git commit -am \"\
    deploy my bot\"\n$ git push heroku master\n```\n\nAfter the last command you will\
    \ get some logs from Heroku related to deployment version, changes made to the\
    \ app, etc.\n\n### Verifying Your Chatbot APIs\n\nAfter getting a successful message\
    \ for deployment, let’s test if our chatbot APIs are working or not. In order\
    \ to quickly do the sanity testing, hit the following url:\n\n`<your-basic-app-url>/webhooks/rasa/`\n\
    \nExample: `https://horoscopebot1212.herokuapp.com/webhooks/rasa/`"
