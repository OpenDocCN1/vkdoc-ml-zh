  trans: "\n', 'PUNCT') 如我们所见，当打印从 `nlp` 方法返回的 `Doc` 对象（一个用于访问注释的容器）中的词元时，我们会得到句子中每个单词的词性标注。这些标签是单词的属性，决定了该单词在语法正确的句子中的用法。我们可以将这些标签用作信息过滤等任务中的单词特征。\n\
    \n让我们再举一个例子，尝试探索来自 `Doc` 对象的词元的不同属性。\n\n**示例 3：**\n\n```python\ndoc = nlp(u'Google\
    \ release \"Move Mirror\" AI experiment that matches your pose from 80,000 images')\n\
    for token in doc:\n    print(token.text, token.lemma_, token.pos_, token.tag_,\
    \ token.dep_, token.shape_, token.is_alpha, token.is_stop)\n```\n\n**示例 4：**\n\
    \n```python\ndoc = nlp(u'I am learning how to build chatbots')\nfor token in doc:\n\
    \    print(token.text, token.lemma_, token.pos_, token.tag_, token.dep_, token.shape_,\
    \ token.is_alpha, token.is_stop)\n```\n\n请参考下表，了解我们在代码中打印的每个属性的含义。\n\n| 属性 | 含义\
    \ |\n| :--- | :--- |\n| `TEXT` | 正在处理的实际文本或单词 |\n| `lemma` | 正在处理的单词的词根形式 |\n\
    | `pos` | 单词的词性 |\n| `tag` | 表达词性（例如，动词）和一些形态信息（例如，动词是过去时态） |\n| `dep` | 句法依存关系（即词元之间的关系）\
    \ |\n| `shape` | 单词的形状（例如，大小写、标点、数字格式） |\n| `alpha` | 该词元是否为字母字符？ |\n| `stop`\
    \ | 该单词是否为停用词或停用词列表的一部分？ |\n\n你可以参考下表来理解词元对象的每个词性属性值的含义。此列表详细说明了 spaCy 模型分配的词性标签。\n\
    \n那么，为什么聊天机器人需要词性标注呢？\n\n**答案：** 为了降低理解文本的复杂性，这些文本可能无法被训练，或者训练置信度较低。通过使用词性标注，我们可以识别文本输入中的部分，并仅对这些部分进行字符串匹配。例如，如果你想判断一个句子中是否存在某个地点，词性标注会将地点词标记为\
    \ `NOUN`，这样你就可以从标注列表中提取所有名词，并检查它是否在你预设的地点列表中。\n\n### 词干提取与词形还原\n\n**词干提取** 是将屈折词简化为其词干、基本形式的过程。词干提取算法会将单词\
    \ “saying” 简化为词根 “say”，而 “presumably” 则变为 “presum”。如你所见，这不一定总是 100% 正确。\n\n**词形还原**\
    \ 与词干提取密切相关，但词形还原是根据单词的预期含义来确定其词元的算法过程。例如，在英语中，动词 “to walk” 可能以 “walk”、“walked”、“walks”\
    \ 或 “walking” 的形式出现。可以在字典中查到的基本形式 “walk” 被称为该单词的词元。spaCy 没有内置的词干提取器，因为词形还原被认为更准确、更高效。\n\
    \n### 词干提取与词形还原的区别\n\n-   **词干提取** 以一种粗糙、启发式的方式工作，通过切掉单词的结尾，假设剩下的单词就是我们实际要找的，但它通常包括去除派生词缀。\n\
    -   **词形还原** 试图通过使用词汇表和单词的形态分析来更优雅地完成这项工作。它尽力只去除屈折词尾，并返回单词的词典形式，即词元。\n\n尽管少数库同时提供了词干提取和词形还原的方法，但最佳实践始终是使用词形还原来正确获取词根。\n\
    \n让我们通过一些例子来探索词形还原：\n\n**示例 1：**\n\n```python\nfrom spacy.lemmatizer import Lemmatizer\n\
    from spacy.lang.en import LEMMA_INDEX, LEMMA_EXC, LEMMA_RULES\nlemmatizer = Lemmatizer(LEMMA_INDEX,\
    \ LEMMA_EXC, LEMMA_RULES)\nlemmatizer('chuckles', 'NOUN') # 第二个参数是词元的词性标签\n```\n\
    \n**输出：**\n\n```python\n[u'chuckle']\n```\n\n**示例 2：**\n\n```python\nlemmatizer('blazing',\
    \ 'VERB')\n```\n\n**输出：**\n\n```python\n[u'blaze']\n```\n\n**示例 3：**\n\n```python\n\
    lemmatizer('fastest', 'ADJ')\n```\n\n**输出：**\n\n```python\n[u'fast']\n```\n\n\
    如果你想比较词干提取器和词形还原器，那么你需要安装 Python 最流行的库之一：自然语言工具包（NLTK）。spaCy 最近才流行起来，但正是 NLTK\
    \ 让每一位 NLP 爱好者投身于 NLP 及其技术的海洋。\n\n请查看以下示例，我们尝试使用 NLTK 提供的两种词干提取技术。首先，我们尝试使用 `PorterStemmer`\
    \ 获取单词 “fastest” 的词干，然后使用 `SnowBallStemmer`。\n"
- fmt: "Both of them give the same result—that is, “fastest”— but when we do the lemmatization\
    \ using spaCy’s method, it gives us “fast” as the stem of “fastest,” which is\
    \ more meaningful and correct.\n\n```\nfrom nltk.stem.porter import *\nfrom nltk.stem.snowball\
    \ import SnowballStemmer\nporter_stemmer = PorterStemmer()\nsnowball_stemmer =\
    \ SnowballStemmer(\"english\")\n```\n\n`fastest` `fastest`\n\n![](image-2wwgueqv.png)\n\
    \nBe sure to install the `nltk` package using `pip3` before trying to run this\
    \ code.\n\n![](image-b5592gcd.png)\n\nSince you are pretty much aware what stemming\
    \ or lemmatization does in NLP, you should be able to understand that whenever\
    \ you come across a situation where you need the root form of the word, you need\
    \ to do lemmatization there. For example, it is often used in building search\
    \ engines. You must have wondered how Google gives you the articles in search\
    \ results that you meant to get even when the search text was not properly formulated.\n\
    \nThis is where one makes use of lemmatization. Imagine you search with the text,\
    \ “will the next season of Game of Thrones be”. Now, suppose the search engine\
    \ does simple document word frequency matching to give you search results. In\
    \ this case, the aforementioned query probably won’t match an article with a caption\
    \ of “Thrones next season release date.”\n\nIf we do the lemmatization of the\
    \ original question before going to match the input with the documents, then we\
    \ may get better results.\n\nWe’ll try to test this theory as well in upcoming\
    \ sections.\n\n## Named-Entity Recognition\n\nNamed-entity recognition, also known\
    \ by other names like entity identification or entity extraction, is a process\
    \ of finding and classifying named entities existing in the given text into pre-defined\
    \ categories.\n\nThe NER task is hugely dependent on the knowledge base used to\
    \ train the NE extraction algorithm, so it may or may not work depending upon\
    \ the provided dataset it was trained on.\n\nspaCy comes with a very fast entity\
    \ recognition model that is capable of identifying entity phrases from a given\
    \ document. Entities can be of different types, such as person, location, organization,\
    \ dates, numerals, etc. These entities can be accessed through the `.ents` property\
    \ of the `doc` object.\n\nLet’s try to find named-entities by taking some examples\
    \ with the help of spaCy’s powerful NER tagging capability.\n\n### Example 1:\n\
    \n```\nmy_string = u\"Google has its headquarters in Mountain View, California\
    \ having revenue amounted to 109.65 billion US dollars\"\ndoc = nlp(my_string)\n\
    for ent in doc.ents:\n    print(ent.text, ent.label_)\n```\n\nOutput:\n\n```\n\
    ('Google', 'ORG')\n('Mountain View', 'GPE')\n('California', 'GPE')\n('109.65 billion\
    \ US dollars', 'MONEY')\n```\n\nWe can see how beautifully and automagically the\
    \ spaCy model could easily identify that the word `Google` as an organization,\
    \ `Mountain View` and `California` are geopolitical entities, and in the given\
    \ sentence we are talking about `109.65 billion US dollars`, which is actually\
    \ about money.\n\nLet’s try to explore some more examples.\n\n### Example 2:\n\
    \n```\nmy_string = u\"Mark Zuckerberg born May 14, 1984 in New York is an American\
    \ technology entrepreneur and philanthropist best known for co-founding and leading\
    \ Facebook as its chairman and CEO.\"\ndoc = nlp(my_string)\nfor ent in doc.ents:\n\
    \    print(ent.text, ent.label_)\n```\n\nOutput:\n\n```\n('Mark Zuckerberg', 'PERSON')\n\
    ('May 14, 1984', 'DATE')\n('New York', 'GPE')\n('American', 'NORP')\n('Facebook',\
    \ 'ORG')\n```\n\n### Example 3:\n\n```\nmy_string = u\"I usually wake up at 9:00\
    \ AM. 90% of my daytime goes in learning new things.\"\ndoc = nlp(my_string)\n\
    for ent in doc.ents:\n    print(ent.text, ent.label_)\n```\n\nOutput:\n\n```\n\
    ('9:00 AM', 'TIME')\n('90%', 'PERCENT')\n```\n\nAs you can see, the entity extractor\
    \ can easily extract the time information from the given string. Also, as you\
    \ can see, the entity extractor not just tries to identify the number but also\
    \ the exact percentage value.\n\nAs per the documentation by spaCy, models trained\
    \ on the OntoNotes corpus support the following entity types.\n\n![](image-vqesjz8o.png)\n\
    \n| TYPE | DESCRIPTION |\n| :--- | :--- |\n| `PERSON` | People, including fictional\
    \ |\n| `NORP` | Nationalities or religious or political groups |\n| `FAC` | Buildings,\
    \ airports, highways, bridges, etc. |\n| `ORG` | Companies, agencies, institutions,\
    \ etc. |\n| `GPE` | Countries, cities, states |\n| `LOC` | Non-GPE locations,\
    \ mountain ranges, bodies of water |\n| `PRODUCT` | Objects, vehicles, foods,\
    \ etc. (not services) |\n| `EVENT` | Named hurricanes, battles, wars, sports events,\
    \ etc. |\n| `WORK_OF_ART` | Titles of books, songs, etc. |\n| `LAW` | Named documents\
    \ made into laws |\n| `LANGUAGE` | Any named language |\n| `DATE` | Absolute or\
    \ relative dates or periods |\n| `TIME` | Times smaller than a day |\n| `PERCENT`\
    \ | Percentage, including “%” |\n| `MONEY` | Monetary values, including unit |\n\
    | `QUANTITY` | Measurements, such as weight or distance |\n| `ORDINAL` | “first,”\
    \ “second,” etc. |\n| `CARDINAL` | Numerals that do not fall under another type\
    \ |\n\n![](image-ml6ege4k.png)\n\nWhenever we intend to build a conversational\
    \ agent or chatbot in simple terms, we always have a domain in mind. For example,\
    \ we want the chatbot to book a doctor’s appointment, order food, pay a bill,\
    \ fill out a banking application, handle e-Commerce, etc. The chatbot could be\
    \ solving a combination of these problems as well. By finding out the entity in\
    \ the question, one can get a fair idea of the context in which the question was\
    \ asked.\n\nLet’s try to understand this by taking an example of two sentences\
    \ with similar words and different meanings.\n\n```\nmy_string1 = u\"Imagine Dragons\
    \ are the best band.\"\nmy_string2 = u\"Imagine dragons come and take over the\
    \ city.\"\ndoc1 = nlp(my_string1)\ndoc2 = nlp(my_string2)\nfor ent in doc1.ents:\n\
    \    print(ent.text, ent.label_)\n```\n\nThe above `for` loop over `doc1` object\
    \ gives an output:\n\n```\n('Imagine Dragons', 'ORG')\n```\n\nAwesome, isn’t it?\
    \ It’ll become more intriguing when you come to realize that the entity recognizer\
    \ doesn’t recognize any entity in `my_string2`. Run the following code and `doc2`\
    \ doesn’t produce any output.\n\n```\nfor ent in doc2.ents:\n    print(ent.text,\
    \ ent.label_)\n```\n\nNow, imagine you were to extract the context of the above\
    \ two strings in a live environment. What would you do? With the help of entity\
    \ recognition, one can easily figure out the context of the statement and intelligently\
    \ take the conversation further."
