- fmt: '# Chatbot Components and Terminology


    People initially used `wit.ai`, as it was free and `Dialogflow` was not, but later
    on `Dialogflow` became free as well.


    - `https://www.luis.ai/` - A machine learning-based service to build natural language
    into apps, bots, and IoT devices. Quickly create enterprise-ready, custom models
    that continuously improve.

    - `http://botkit.ai` - Visual conversation builder with built-in stats and metrics.
    Can be easily integrated with Facebook, Microsoft, IBM Watson, Slack, Telegram,
    etc.


    ## Components of a Chatbot and Terminologies Used


    Components of a chatbot system are very few. In this section we’ll be briefly
    discussing the components of a chatbot that you will come across in the later
    chapters. Having a basic theoretical understanding of any system before diving
    deep is always helpful. You should have a fair idea after this section about technical
    terminologies used while building chatbots using Python. These terminologies will
    be used frequently in coming chapters when we actually start building our chatbots.


    ### Intent


    When a user interacts with a chatbot, what is his intention to use the chatbot/what
    is he asking for? For example, when a user says, “Book a movie ticket,” to a chatbot,
    we as humans can understand that the user wants to book a movie ticket. This is
    intent for a bot. It could be named `intent`. Another example could be when a
    user says, “I want to order food,” or “Can you help me order food?” These could
    be named `intent`. Likewise, you can define as many intents as you want.


    ### Entities


    Intents have metadata about the intent called entities. In the example, “Book
    a movie ticket,” booking a ticket could be an intent and the entity is `movie`,
    which could have been something else as well, like `flight`, `concert`, etc. You
    can have general entities labeled for use throughout the intents. Entities could
    represent as a quantity, count, or volume. Intents can have multiple entities
    as well.


    For example: “Order me a shoe of size 8.” There could be two entities here:

    - Category: `Shoe`

    - Size: `8`


    ### Utterances


    Utterances are nothing but different forms of the same question/intent your user
    may show.


    - Remember we discussed the switching off the light intent? That was an example
    of how a user can use different utterances for the same intent.

    - It is suggested to have an optimum 10 utterances per intent and a minimum of
    5, but this is not restricted.


    ### Training the Bot


    Training essentially means to build a model that will learn from the existing
    set of defined intents/entities and utterances on how to categorize the new utterances
    and provide a confidence score along with it. When we train the system using utterances,
    this is called supervised learning. We will soon be learning more about doing
    this practically.


    ### Confidence Score


    Every time you try to find what intent an utterance may belong to, your model
    will come up with a confidence score. This score tells you how confident your
    machine learning model is about recognizing the intent of the user.


    That’s all we wanted to cover in the first chapter of “Introduction to Chatbots.”
    You must have a fair idea about chatbots from a business perspective and from
    a technical perspective. We walked through the lane of history belonging to chatbots.
    It’s quite fascinating how far chatbots have evolved.


    We learned about how chatbots have evolved over a period of time and why chatbots
    are a must for a business to grow in this cutthroat competition. We learned about
    the different chatbot frameworks and also got to know about the terminology used
    for chatbots by example. We’ll be using them in the coming chapters. You should
    be at a stage now where you know what kind of chatbot you want to build and how
    it would behave when built.


    Do all your write-ups and decision trees, if needed, and after we have learned
    the basics of Natural Language Understanding in the next chapter, we can quickly
    start building our chatbot. Don’t worry even if you don’t have anything in mind.
    We’ll try to build a cool chatbot step by step with all the concepts learned in
    the upcoming chapters. See you in the next chapter.


    # Chapter 2 – Natural Language Processing for Chatbots


    This chapter is to get you started with Natural Language Processing (NLP) using
    Python needed to build chatbots. You will learn the basic methods and techniques
    of NLP using an awesome open-source library called `spaCy`. If you are a beginner
    or intermediate to the Python ecosystem, then do not worry, as you’ll get to do
    every step that is needed to learn NLP for chatbots. This chapter not only teaches
    you about the methods in NLP but also takes real-life examples and demonstrates
    them with coding examples. We’ll also discuss why a particular NLP method may
    be needed for chatbots. Note that NLP in itself is a skill.


    We’ll be closely taking a look at POS tagging, stemming, entity detection, stopwords,
    dependency parsing, and noun chunks and finding similarity between words. All
    of these methods will be very helpful for you when you are building chatbots of
    your use-case. There are a lot more NLP methods than the ones covered in this
    chapter. Based on your need for the chatbot you are building, you can try to learn
    them. The `spaCy` library that we are going to learn to use by the end of this
    chapter will give you enough idea on how to scale your knowledge base of NLP and
    its understanding. So, let’s get started and first try to understand NLP for chatbots
    in the next section.


    ## Why Do I Need to Know Natural Language Processing to Build a Chatbot?


    To understand the answer to this question, let’s first understand Natural Language
    Processing (NLP). Natural Language Processing (NLP) is a field of Artificial Intelligence
    that enables computers to analyze and understand the human language.


