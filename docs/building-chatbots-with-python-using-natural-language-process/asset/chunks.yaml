  trans: "\n在本书中，我们将学习如何利用机器人构建自然的对话体验，以及如何教会机器人理解我们的自然语言，并让它通过单一界面为我们执行任务。机器人本质上不过是一种足够智能的机器，能够理解你的请求，然后以其他软件系统可理解的方式重新组织你的请求，以便请求你所需的数据。\n\
    \n聊天机器人的普及程度\n\n聊天机器人已经像近期任何事物一样流行起来。让我们看看图 1-1，它描绘了聊天机器人的兴起，并尝试理解为何构建聊天机器人的需求如此巨大。\
    \  \n![](img/image-l0ray8ei.png)  \n图 1-1. Y 轴上的数字代表全球所有类别中相对于图表最高点的搜索兴趣  \n\n\
    脑海中浮现的简单答案是：它并非复杂的软件，任何人都可以使用。当我们构建软件时，会针对使用它的受众进行设计，但当它被其他人使用时，就会变得困难且难以操作。在构建聊天机器人时，我们牢记它将供所有年龄段的人使用。这种情况只发生在聊天机器人身上，即软件试图表现得像个笨拙的人（但它很聪明），并让用户保持其本来的样子。在所有其他软件中，你会发现你需要了解某些术语，或者逐渐学会如何最优地使用它，但聊天机器人并非如此。如果你知道如何与人交谈，那么使用聊天机器人就不会有任何问题。\n\
    \n对聊天机器人的需求持续增长。然而，目前还没有太多研究通过实证来探究使用聊天机器人背后的动机。在最近的一项研究中，一份在线问卷询问了来自美国、年龄在 16\
    \ 至 55 岁之间的聊天机器人用户，描述他们在日常生活中使用聊天机器人的需求。调查显示，“生产力”是使用聊天机器人的主要动机因素。\n\nPython 之禅及其为何适用于聊天机器人？\n\
    \n我记得 Python 之禅中说过：“简单优于复杂”，这一点在软件的许多地方都适用。\n\nPython 之禅是影响 Python 编程语言设计的 20\
    \ 条软件原则的集合。\n\n——蒂姆·彼得斯\n\n想知道 Python 之禅是什么吗？请尝试以下步骤。\n\n如果你已经在电脑上安装了 Python。只需进入你的\
    \ Python 解释器并导入：\n\nPython 2.7.15 (default, May 1 2018, 16:44:08)  \n[GCC 4.2.1\
    \ Compatible Apple LLVM 9.1.0 (clang-902.0.39.1)] on darwin  \nType \"help\",\
    \ \"copyright\", \"credits\" or \"license\" for more information.  \n\n>>> import\
    \ this  \n\nPython 之禅，作者：蒂姆·彼得斯  \n\n优美优于丑陋。  \n明确优于隐晦。  \n简单优于复杂。  \n复杂优于繁琐。\
    \  \n扁平优于嵌套。  \n稀疏优于密集。  \n可读性很重要。  \n特殊情况不足以特殊到  \n打破规则。  \n\n尽管实用性胜过纯粹性。  \n\
    错误永远不应悄无声息地通过。  \n除非明确地保持沉默。  \n面对歧义，拒绝猜测的诱惑。  \n应该有一种——最好只有一种——显而易见的方法来做这件事。\
    \  \n尽管这种方法起初可能并不明显，除非你是荷兰人。  \n现在做胜过永远不做。  \n尽管永远不做通常比 *立刻* 做要好。  \n如果实现难以解释，那是个坏主意。\
    \  \n如果实现易于解释，那可能是个好主意。  \n命名空间是一个绝妙的主意——让我们更多地使用它们吧！  \n\n你可能无法理解以上所有观点与聊天机器人的关联，但你肯定能理解其中的大部分。\n\
    \n好了，回到我们的主题。我记得从 Orkut 背景转向使用 Facebook 用户界面时遇到了困难。如果你从未使用过 Orkut，你可能无法理解，但请试着想想你生活中开始使用某个新软件或应用程序时，难以掌握其要领的情况。也许是从\
    \ Windows 切换到 MacOS/Linux，或者反之？当你使用一个新应用程序时，你需要学习一些东西，并且需要时间来适应它，了解它的功能和运作方式。有时，即使使用多年后，你才了解到应用程序的某些功能。如果你使用的是\
    \ MacOS，  \n试试 Shift + Option + 音量上/下键，看看会发生什么。如果你之前不知道这个功能，请告诉我它是否让你感到惊讶。\n\n\
    在聊天机器人的情况下，用户与服务器或后端系统之间的通信非常简单。就像使用消息应用程序与另一个人交谈一样。  \n你只需输入你想要的内容，机器人就应该能够要么给你想要的东西，要么指导你如何获得它。换句话说，它应该通过提供链接或文档来为你指明\
    \  \n正确的信息。如今，机器人甚至能够从文章和文档中挖掘信息并提供给用户。\n\n谷歌、Facebook 和 IBM 等公司在人工智能方面取得的重大进展，以及\
    \ Amazon Lex、wit.ai、api.ai、luis.ai、IBM Watson、Amazon Echo 等机器学习服务，导致了此类机器人的非凡增长和需求。\n\
    \n聊天机器人的必要性\n\n现在，我们将尝试从两个不同的角度来审视在这个快速发展的信息创建和检索时代对聊天机器人的需求和必要性：商业角度和开发者角度。因此，如果你是产品经理、销售经理，或者来自市场营销或任何直接驱动业务的相关领域，那么你不应跳过聊天机器人的商业视角。它将为你清晰地描绘出，当今企业需要采用这项技术来驱动更多收入。\n\
    \n商业视角\n\n我们将尝试审视聊天机器人的商业视角。对于企业来说，拥有一个聊天机器人，或者将大量事务迁移由聊天机器人处理，是否有利？\n"
- fmt: '# Chatbots as Marketing Tools


    The time has already come for businesses to treat chatbots as one of the marketing
    tools of this generation.


    - **Accessibility**: They are easily accessible. The consumer can open the website
    and start asking questions or begin resolving their queries without having to
    dial a number and follow the ugly way of “Press 1 for this and Press 2 for that”
    in the IVR. They can quickly get to the point with just a basic set of information.

    - **Efficiency**: Customers can sit at their desk in their office or on a couch
    in their living room while watching a game and get their status of a credit card
    application, find their food order status, or raise a complaint about any issue.
    If you make customers efficient and productive, they start loving you. Bots do
    exactly that and help boost business.

    - **Availability**: Chatbots are available 24 hours per day, 7 days per week.
    They would never ask you for leaves or get tired like human employees. They will
    do the same tasks or new tasks every time with the same efficiency and performance.
    You must get frustrated when some customer care phone number says, “Please call
    us between 9:00 AM and 6:00 PM,” just for a piece of information. Your bots would
    never say this.

    - **Scalability**: One Bot => 1 million employees. You see this? Yes, if your
    bot can do what a customer needs, it can easily handle hundreds of thousands of
    customer queries at the same time without breaking a sweat. You don’t need to
    keep your customers waiting in queue until the customer representative becomes
    free.

    - **Cost**: Needless to say it saves a hell of a lot of cost for the business.
    Who doesn’t like to save money? When bots do that for you, there is no reason
    why you shouldn’t like them.

    - **Insights**: Your sales representative might not be able to remember the behavior
    of the user and give you exclusive insight about the consumer behavioral pattern,
    but your bots can using latest techniques of machine learning and data science.


    ## Chatbots Bring Revenue


    Chatbots have proven to be successful in bringing more revenue to the business.
    Businesses starting with chatbot support or creating a new chatbot to support
    customer queries are doing well in the market compared to their competitors.


    As per one of the blogposts on `stanfy.com`, in the first 2 months after introducing
    its Facebook chatbot, `1-800-Flowers.com` reported that more than 70 percent of
    its Messenger orders were from new customers. These new customers were also generally
    younger than the company’s typical shopper, as they were already familiar with
    the Facebook Messenger app. This significantly increased their annual revenue.
    One of the greatest added values of chatbots is using them for generating prospects.
    You can reach your potential clients directly where their attention is (messengers)
    and present them your newest products, services or goods.


    When a customer would like to purchase a product/service, he/she can make the
    purchase within the chatbot, including the payment process. Bots, like `1-800flowers.com`,
    eBay, and Fynd have already proved that.


    —Julien Blancher, Co-Founder @ Recast.AI


    In an article by Stefan Kojouharov, founder of `ChatbotsLife`, he mentions how
    different companies are making more money than they would have without chatbots.
    He says,


    The e-commerce space has begun using chatbots in a number of ways that are quickly
    adding dollars to their bottom line. Let’s look at the early success stories:


    - **1–800-Flowers**: reported that more than 70 percent of its Messenger orders
    derived from new customers!

    - **Sephora**: increased their makeover appointments by 11 percent via their Facebook
    Messenger chatbot.

    - **Nitro Café**: increased sales by 20 percent with their Messenger chatbot,
    which was designed for easy ordering, direct payments, and instant two-way communication.

    - **Sun’s Soccer**: chatbots drove nearly 50 percent of its users back to their
    site throughout specific soccer coverage; 43 percent of chatbot subscribers clicked
    through during their best period.

    - **Asos**: increased orders by 300 percent using Messenger chatbots and got a
    250 percent return on Spend while reaching 3.5 times more people.


    Figure 1-2 tries to give you an idea of why there is a direct correlation between
    chatbots and revenue. Lets have a look at Figure 1-2 to get some idea about that.


    ![](image-g8ms8ck2.png)


    Figure 1-2. Chatbot brings revenue


    ## A Glimpse of Chatbot Usage


    We will try to look at how useful chatbot has been for consumers due to its usability
    and the efficiency it provides. Everybody in this burning IT age wants to be fast
    in everything, and using chatbots makes your jobs easier and faster every day.
    It is personalized in a way as to not repeat obvious things; this makes us re-think
    about traditional usage of software. Figure 1-3 provides an illustration that
    should give you a fair idea about chatbot usage.


    ![](image-orlx4uxf.png)


    Figure 1-3. A glimpse of Chatbot usage by consumers


    ## Customers Prefer Chatbots


    Chatbots are not just software in the modern era. Chatbots are like our personal
    assistants who understand us and can be microconfigured. They remember our likes
    and dislikes and never tend to disappoint us by forgetting what we taught them
    already, and this is the reason why everyone loves chatbot. Next time you meet
    a person or meet your customer, don’t forget to ask if they prefer conventional
    software or the new cutting-edge chatbots. Lets have a look at Figure 1-4 to understand
    the reasons why customers prefer chatbots compared to other software systems for
    human computer interactions.


    ![](image-euic3jzw.png)


    Figure 1-4. Customers prefer chatbots


    In the next section of this chapter we are going to discuss why chatbots are the
    next big thing for budding developers.'
