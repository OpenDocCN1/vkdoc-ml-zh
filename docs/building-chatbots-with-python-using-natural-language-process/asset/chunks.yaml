    停用词   停用词是指像 a、to 和 also 这类我们有时希望在进一步处理前从文档中过滤掉的词语。停用词通常词汇内容很少，没有太多实际意义。以下是 Reuters-RCV1
    语料库中常见的 25 个语义上非选择性的停用词列表。  a  an  and  are  as   at  be  by   for from  has 
    he   in    is    it    its      of    on that  the  to    was      were    will 
      with   让我们进入一些代码，尝试理解其工作原理。   要查看 spaCy 中定义为停用词的所有单词，可以运行以下代码行：   from spacy.lang.en.stop_words
    import STOP_WORDS print(STOP_WORDS)   你应该会看到类似这样的输出：   set([''all'', ''six'',
    ''just'', ''less'', ''being'', ''indeed'', ''over'', ''move'',   ''anyway'', ''fifty'',
    ''four'', ''not'', ''own'', ''through'', ''using'', ''go'', ''only'', ''its'',
    ''before'', ''one'', ''whose'', ''how'',   ..........................................................................
      .........................................................................  
    ...........................................................................  
    ........................................................................   ''whereby'',
    ''third'', ''i'', ''whole'', ''noone'', ''sometimes'', ''well'', ''together'',
      ''yours'', ''their'', ''rather'', ''without'', ''so'', ''five'', ''the'', ''otherwise'',
    ''make'', ''once''])   spaCy 的停用词列表中定义了大约 305 个停用词。如果需要，你始终可以定义自己的停用词并覆盖现有列表。
      要判断一个词是否为停用词，可以使用 spaCy 的 `nlp` 对象。我们可以使用 `nlp` 对象的 `is_stop` 属性。   示例 1：  
    nlp.vocab[u''is''].is_stop   输出：   True  nlp.vocab[u''hello''].is_stop   输出：  
    False   示例 3：   nlp.vocab[u''with''].is_stop   输出：   True   停用词是文本清理中非常重要的一部分。它有助于在我们尝试进行实际处理以理解文本含义之前，移除无意义的数据。
      假设你正在构建一个机器人，通过评估用户情绪来让人们开心。此时，需要分析用户输入文本中的情感，以便制定正确的回应。在这里，在开始进行基本的情感分析之前，我们应该移除数据中以停用词形式存在的噪声。
      依存句法分析   依存句法分析是 spaCy 中更优美且强大的功能之一，它快速且准确。该解析器还可用于句子边界检测，并允许你遍历基本名词短语或“语块”。
      spaCy 的这一功能为你提供了一个解析树，它解释了单词或短语之间的父子关系，并且与单词出现的顺序无关。   让我们看一个例子，你需要解析以下句子：  
    帮我订一张从班加罗尔到果阿的机票   示例 1：   doc = nlp(u''Book me a flight from Bangalore to Goa'')
    blr, goa = doc[5], doc[7]   list(blr.ancestors)   输出：   [from, flight, Book]  
    上述输出可以告诉我们，用户希望预订从班加罗尔出发的航班。让我们尝试列出 `goa.ancestors` 对象的祖先：   list(goa.ancestors)
      输出：   [to, flight, Book]   这个输出可以告诉我们，用户希望预订前往果阿的航班。   依存句法分析中的祖先是什么？   祖先是指该词元的句法后代中最右边的词元。就像上面例子中，对于对象
    `blr`，其祖先是 `from`、`flight` 和 `Book`。   请记住，你始终可以使用 `ancestors` 属性列出文档对象项的祖先。  
    list(doc[4].ancestors) #doc[4]==flight   上述代码将输出：   [flight, Book]   要以编程方式检查一个文档对象项是否是另一个文档对象项的祖先，我们可以这样做：
      doc[3].is_ancestor(doc[5])   上述代码返回 `True`，因为 `doc[3]`（即 `flight`）是 `doc[5]`（即
    `Bangalore`）的祖先。你可以尝试更多类似的例子，以更好地理解依存句法分析和祖先的概念。   如果我们尝试思考在构建聊天机器人时可能遇到的实际场景，可能会遇到像这样的句子：
      我想订一辆出租车去酒店，并在餐厅订一张桌子。   在这个句子中，了解请求了哪些任务以及它们的目标地点在哪里（即用户是想订出租车去酒店，还是……）非常重要。
      让我们尝试使用以下代码来实现这一点：  示例 1：   doc = nlp(u''Book a table at the restaurant and
    the taxi to the hotel'') tasks = doc[2], doc[8] #(table, taxi)   tasks_target
    = doc[5], doc[11] #(restaurant, hotel)   for task in tasks_target:   for tok in
    task.ancestors: if tok in tasks:   print("Booking of {} belongs to {}".format(tok,
    task))   break   输出：   Booking of table belongs to restaurant Booking of taxi
    belongs to hotel   依存句法分析中的子节点是什么？   子节点是指该词元的直接句法依存项。我们可以像之前使用 `children` 属性一样，查看一个词的子节点。
      list(doc[3].children)   将输出   [a, from, to]   依存句法分析的交互式可视化   第一次完全理解依存句法分析的概念非常困难。spaCy
    提供了一种极其简单且交互式的方式来理解其依存句法分析。spaCy v2.0+ 有一个可视化模块，我们可以将 `Doc` 对象或 `Doc` 对象列表传递给
    `displaCy`，并调用 `displaCy` 的 `serve` 方法来运行 Web 服务器。   图 2-5 展示了依存句法分析的交互式可视化效果。
      ![](img/image-cdxz1g76.png)  Figure 2-5. 依存句法分析的交互式可视化   你也可以生成图 2-5 中的依存句法分析可视化。要创建这样的可视化，请运行以下代码，然后在浏览器中访问
    http://localhost:5000。   让我们尝试对我们关于任务及其目标地点的示例进行可视化。

