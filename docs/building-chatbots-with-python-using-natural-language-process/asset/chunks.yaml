  trans: "\n从 Dialogflow 传入我们 Webhook 端点的 JSON 数据  \n检查响应  \n每当 Dialogflow 将意图的 JSON\
    \ 响应（如图 3-25 所示）POST 到你的 Web 服务时，它期望你的 Web 服务返回如图 3-26 所示格式的响应。  \n![](img/image-l7se7exx.png)\
    \  \n图 3-26. Dialogflow 期望的 Webhook URL 响应  \n\n如果你认为你的 API 响应必须与图 3-26 的格式完全一致，那么请放心——事实并非如此。你的意图不会抛出错误，因为\
    \ JSON 主体中的所有键都是可选的。  \n\n以下是我的 API 响应及其完美运行的样子：  \n\n{  \n\"fulfillmentText\"\
    : \"订单 ID：9999。正在途中\",  \n\"payload\": {  \n\"facebook\": {  \n\"text\": \"订单\
    \ ID：9999。正在途中\"  \n}  \n}  \n}  \n\n当我再次调用同一个 API 时，会得到不同的订单状态文本，但格式与 Dialogflow\
    \ 引擎期望的相同。  \n\n{  \n\"fulfillmentText\": \"订单 ID：9999。骑手已取到您的食物，请再等 10-15 分钟\"\
    ,  \n\"payload\": {  \n\"facebook\": {  \n\"text\": \"订单 ID：9999。骑手已取到您的食物，请再等\
    \ 10-15 分钟\"  \n}  \n}  \n}  \n\n`fulfillmentText` 是智能体向用户回复内容的关键。  \n\n现在，使用公共\
    \ URL 或在 Dialogflow 智能体本身中测试机器人，查看来自 API 的响应，而不是我们之前添加的默认静态响应。  \n\n这就是我们如何利用\
    \ Dialogflow 的 fulfillment 功能，将外部 API 或我们自己的 API 集成到聊天机器人中，从而实现动态和实时交互。  \n\n\
    总结  \n在本章中，我们学习了 Dialogflow 以及如何使用 Dialogflow 构建聊天机器人。我们学习了如何定义意图及其对应的实体。我们构建了一个简单的食品订购聊天机器人，它能理解用户的订餐意图，还能识别用户点了哪些食品以及数量。我们还增强了聊天机器人的功能，让用户可以查询订单状态，获取订单\
    \ ID，并根据不同的订单状态生成回复。  \n\n我们还学习了 Dialogflow 中的 fulfillment，通过它从我们自己的 API 获取订单状态，并据此向用户提供回复。我们学会了为聊天机器人创建\
    \ Web 演示，并将其与 Messenger 集成。至此，你应该对聊天机器人的端到端工作原理有了清晰的认识。  \n\n在下一章中，我们将尝试更困难的方式来构建聊天机器人。是的，你没听错。我们将摆脱对\
    \ Dialogflow 等工具的依赖，以编程方式自行构建一切。让我们为下一章做好准备，因为当你从头开始构建一切时，那将会更加有趣。这就像训练和驯服你自己的聊天机器人。\
    \  \n\n我们下一章见。  \n\n第 4 章  \n––––––––  \n以更困难的方式构建聊天机器人  \n\n“以更困难的方式构建聊天机器人”并不难学。\
    \  \n\n这是为了完全掌控你自己的聊天机器人而采取的困难方式。如果你想自己构建一切，那么你就选择了这条艰难的道路。这条更艰难的路，当你走过时觉得困难，但当你回首时，却会发现它美丽而清晰。\
    \  \n\n这是一条通往伟大高度的崎岖之路。  \n——塞内卡  \n\n如果你熟悉 Python，并且对如何安装包等有一定了解，那么学习本章内容不会有任何问题。如果你是开发者，这应该很容易。如果你是管理者或非技术人员，你仍然可以按照每个章节中提到的步骤逐一操作，并完成任务。我强烈建议每个人都完成本章，这样你就能学到构建聊天机器人的核心知识。\
    \  \n\n本章不仅教你从头构建聊天机器人，还展示了在 Rasa NLU 的帮助下，核心机器学习（ML）如何与自然语言处理（NLP）协同工作。正如本书第一章所述，在构建聊天机器人时，拥有决策树总是好的。在本章中，我们几乎不会使用任何规则，但机器学习尚未达到\
    \ 100% 可靠的阶段。因此，这个决定完全取决于你的用例，以及你是否希望在机器学习模型之外应用一些业务逻辑。有时，你的机器学习模型可能运行得非常好，以至于你根本不需要任何启发式规则。但根据我的经验，当你去销售或商业化你的聊天机器人时，你必须多加小心。没有功能总比拥有一个毫无意义的功能要好。\
    \  \n\n我们将使用一个名为 Rasa NLU 的开源库，学习如何在不使用 Dialogflow、Watson、wit.ai 等云服务的情况下，从头构建聊天机器人。请记住，Rasa\
    \ NLU 是一个非常复杂的库，包含许多功能。我们只会涉及对我们构建聊天机器人重要的概念和功能。  \n\n什么是 Rasa NLU？  \nRasa NLU\
    \ 是一个用于聊天机器人意图分类和实体提取的 NLP 库。它帮助你为聊天机器人构建和编写自定义的 NLP。  \n\n本章将涵盖 Rasa 的两个部分。 \
    \ \n• Rasa NLU：使用 Rasa NLU，我们将学习为聊天机器人准备训练数据、编写配置文件、选择管道以及训练模型。最后，我们将使用模型预测文本的意图。我们还将学习如何使用\
    \ Rasa NLU 解析实体。  \n• Rasa Core：在第二部分中，我们将学习训练 Rasa Core 对话管理模型，以准备向用户回复。当你的聊天机器人包含多种意图及其后续问题或回复时，这一部分变得非常重要。与其在决策树中编写大量条件，并在大型企业级应用出现问题时花费数小时调试，不如教会模型如何生成回复。\
    \  \n"
- fmt: '# Why Should I Use Rasa NLU?


    It’ll be interesting to see how well our trained model performs in doing that.
    We can’t just spit out anything to the user in the form of text; it should make
    sense.


    Rasa NLU is not just any other library with a bunch of methods to do some things.
    It has the capability of building almost any kind of chatbot that you can imagine.
    Rasa brings you the magical capability of training the machine to understand the
    meaning of a text rather than you writing rules to understand it.


    Let’s look at the following points on why we should use Rasa NLU:


    - Rasa NLU is an actively maintained project and has a good community to support
    it.

    - If we don’t want to share our user’s sensitive data with a third party, we must
    use open-source tools like Rasa NLU to build chatbots from scratch. This way all
    the data remains and gets processed on our own servers.

    - Depending on third-party services for training your data and finding the intents
    of user utterances will require you to call APIs that may not always be reliable.
    What happens to your chatbot application if their server is down?

    - Using Rasa NLU for building chatbots will give you full command over your chatbots.
    You can train, tune, and optimize it the way you want with the data you want.
    With Rasa NLU we can experiment with which ML algorithm works best for our dataset
    rather than depending on a fixed algorithm.


    # Diving Straight Into Rasa NLU


    In this section we’ll dive straight into the hands-on part and try installing
    the Rasa stack and start working on building our ML models by training our data.
    We’ll be using some of the cooler open-source libraries to make our lives easier.


    ## Installing Rasa


    To install Rasa, run the following `pip` command that we tried in previous chapters
    for installing spaCy. Note that we’ll be using Rasa version 0.13.2.


    ```

    pip install rasa-nlu==0.13.2

    ```


    Rasa NLU has multiple components for classifying intents and recognizing entities.


    Different components of Rasa have their own sets of dependencies. When we train
    our model, Rasa NLU checks that all the required dependencies are installed. If
    you want to install the full requirements needed to entirely use the Rasa library,
    you can execute the following steps:


    ```

    git clone https://github.com/RasaHQ/rasa_nlu.git #Clone the repo

    cd rasa_nlu #Get into the rasa directory


    pip install -r alt_requirements/requirements_full.txt #Install full requirements

    ```


    The first step may take some time. Be as patient as earth until it completes.


    ## Deciding a Pipeline in Rasa


    Pipeline is nothing but a set of algorithms to be used to train your model. Rasa
    NLU has two widely used pipelines called `spacy_sklearn` and `tensorflow_embedding`.
    Let’s learn a bit about both.


    ### `spacy_sklearn`


    - `spacy_sklearn` pipeline makes use of pre-trained word vectors from either GloVe
    algorithm or an algorithm developed by the Facebook AI team called fastText.

    - `spacy_sklearn` works amazingly well in situations where, suppose you have an
    utterance like, “What is the weather in Boston?” When we train our model on the
    same utterance example and then ask it to predict the intent for, “What is the
    weather in London?” our model is now intelligent enough to know that both the
    words “Boston” and “London” are similar, and they belong to the same intent.

    - This pipeline is very useful with small sets of data.


    ### `tensorflow_embedding`


    - `tensorflow_embedding` pipeline doesn’t make use of any pre-trained word vectors
    like `spacy_sklearn`, but it adjusts itself as per our own provided dataset.

    - The good thing about `tensorflow_embedding` pipeline is that our word vectors
    will be as per our domain.

    - To explain how `tensorflow_embedding` works with an example, in English language,
    the word “play” may be closely related to “a sport” or “an activity of enjoyment
    or recreation,” and it may seem it very different from the words “an act.” In
    a theater domain, “play” and “an act” are closely related, where “play” means
    “a form of literature written by a playwright,” and it is very necessary to tell
    our model to learn specific to our domain and not get confused due to some pre-trained
    model.


    # Training and Building a Chatbot From Scratch


    If you have gone through Chapter 3 of this book, you must be familiar with the
    “Food Ordering Chatbot” we built using Dialogflow. You must be aware of intents,
    entities, and responses back to the end user by a chatbot.


    Similarly, we are going to take a use-case of a chatbot and build it from scratch
    in this chapter. You need not necessarily use the same example. Feel free to find
    a use-case of your own, follow the steps in this chapter, and build your own chatbot
    at the completion of this chapter.


    We are going to build a horoscope bot that understands user queries and tells
    them their horoscope for the day. So, let’s get started.


    ## Building a Horoscope Bot


    In this example of building a chatbot completely on our own using the open-source
    library Rasa NLU, we are going to build a Horoscope Bot. Let’s decide the scope
    of this chatbot and see what it does and can do.


    - The Horoscope Bot should be able to understand greetings and reply with a greeting.

    - The bot should be able to understand if the user is asking for a horoscope.

    - The bot should be able to ask the horoscope sign of the user if the user doesn’t
    provide it.

    - If the user doesn’t know his/her horoscope sign, the bot should ask the user’s
    date of birth (DOB) and find it for them.

    - The bot should subscribe/unsubscribe the user to get the daily horoscope.

    - The bot should learn from existing responses to formulate a new response.

    - The bot should be able to handle spelling mistakes by the user.


    It is pretty simple what our bot is supposed to do here.'
