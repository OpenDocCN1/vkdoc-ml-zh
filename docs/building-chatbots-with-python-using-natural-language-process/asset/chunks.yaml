  trans: '

    可能的意图   • 问候意图：用户以问候开始对话   • 获取星座意图：用户询问星座运势   • 用户星座意图：用户告知其星座   • 用户出生日期意图：用户告知其出生日期
      • 订阅意图：用户请求订阅   根据你设计机器人和编写代码的方式，你可能需要或不需要上述所有意图，或者你可能还需要定义一些额外的意图，以涵盖我们希望机器人完成的所有用例。随着本章内容的深入，我们将尝试构建一个能够完成提供星座运势基本任务的机器人；稍后作为练习的一部分，我们可以为其添加更多用例。
      嗯，这基本上就是我们到目前为止，基于机器人和用户之间一个简单的可能对话，来识别可能意图所做的事情。   星座运势机器人与用户之间的对话脚本   让我们为聊天机器人和用户之间创建一个可能的对话脚本。正如第一章所述，编写对话脚本就像在构建软件之前准备一份软件需求文档。它之后可能会改变，但能让你对最终聊天机器人应用程序中将要发生的事情有一个整体的了解。
      以下是我们用户与机器人之间对话的样子：   用户：你好   星座运势机器人：你好！希望你一切顺利。   用户：我想知道我的星座运势。   星座运势机器人：当然，可以告诉我你的星座吗？
      用户：摩羯座（拼写错误）   星座运势机器人：抱歉，你是指摩羯座吗？   用户：是的。   星座运势机器人：好的，这是你今天的星座运势。今天你可能会感到乐观和积极。将这种能量分享给那些感到不太满足的人。你的态度可能会对朋友、伴侣、配偶和孩子产生深远的影响。邻居和亲戚可能会在你没有意识到的情况下感受到你的精神。如果有人受伤或生气，请给予鼓励。一切最终都会好起来的。
      星座运势机器人：你想订阅每日更新吗？如果愿意，只需说“订阅”。   用户：是的，请帮我订阅。   星座运势机器人：太好了，你现在已经订阅了。祝你有美好的一天。
      这个对话只是为了让我们大致了解聊天机器人对话的样子。我们可能会也可能不会根据需求更改对话流程。   我们可以让我们的聊天机器人模型自行训练以准备有效的响应，而不是编写一堆
    if...else 语句。   为聊天机器人准备数据   Rasa NLU 有多种方式在我们的自定义数据上定义意图及其实体。它支持 Markdown 格式、JSON
    格式（作为单个文件）或包含多个文件的目录格式的数据。   我们将首先讨论最困难但高度可扩展的方法。手动创建 JSON 文件很困难，但通过编程方式创建则非常容易且可扩展。


    以 JSON 格式为模型创建数据   Rasa NLU 期望的 JSON 格式数据有一个顶层对象，包含键和。   我们将要使用的最重要的键是 common_。以下是我们
    JSON 数据的基本结构：   {   "rasa_nlu_data": {   "common_examples": [], "regex_features"
    : [], "entity_synonyms": []   }   }   我们 JSON 数据中的 common_examples 键是用于训练我们模型的核心位置。我们将把所有训练示例添加到
    common_examples 数组中。   regex_features 是一个帮助意图分类器识别实体或意图，并提高意图分类准确性的工具。   让我们开始编写我们的
    JSON 文件。我们将其命名为 data.json。   创建一个名为的文件夹。将当前工作目录更改为 horoscope_bot。启动 Jupyter Notebook
    #jupyter notebook。创建一个名为的新文件夹。点击 data 文件夹，然后在 Jupyter Notebook 的“新建”菜单下进入“文本文件”。点击创建的文件名称，将其更改为
    data.json，并为你的聊天机器人编写意图。   对于步骤 5 和 6，你可以随意使用你喜欢的编辑器，如 Sublime、Notepad++、PyCharm
    等来处理 JSON 文件。   以下是我的 data 文件夹下 data.json 文件的内容：   {   "rasa_nlu_data": { "common_examples":
    [   {   "text": "Hello",   "intent": "greeting", "entities": []   },   {   "text":
    "I want to know my Horoscope",   "intent": "get_horoscope", "entities": []   },
      {   "text": "Can you please tell me my horoscope?",   "intent": "get_horoscope",
    "entities": []   },   {   "text": "Please subscribe me",   "intent": "subscription"
      }   ],   "regex_features": [],   "entity_synonyms": []   }   }   嗯，如你所见，手动准备这个看起来很笨拙。你一定还记得我们在
    Dialogflow 中使用的那个又好又简单的方法。那么，让我们看看一个很酷且有趣的工具，用于创建 Rasa 期望格式的训练数据。它由 Polgár András
    创建，对于检查和修改我们之前准备的现有数据也非常有用。如果你正在处理一个需要手动创建数据的小项目，这个工具可以节省大量时间。在你构建的任何完全由数据驱动的应用程序中，可视化数据总是一个好主意。
      所以，先保存我们之前创建的 data.json 文件，直到我们使用更好的方法来扩展数据收集。   可视化和修改 Rasa 的 JSON 数据格式   在本节中，我们将使用一个名为
    Rasa NLU trainer 的工具来可视化我们的数据（即我们到目前为止创建的数据）。这个工具也帮助我们标注数据。如果你还记得第三章中解释的 Dialogflow
    界面，定义实体、实体名称和类型非常容易。我们将使用一个开源工具来做同样的事情。

    '
- fmt: "# Rasa NLU Trainer\n\n`Rasa NLU trainer`是一个非常方便的工具，可以直接在浏览器中编辑训练数据。处理JSON数据很棘手，也容易出错。借助这个便捷工具，我们可以轻松地向训练数据中添加更多示例或编辑现有示例，从而节省大量手动标注数据的时间。\n\
    \n`rasa-nlu-trainer`是一个基于JavaScript的工具，因此我们需要在系统上安装`node.js`才能运行它。这只需要不到5分钟的时间。按照以下步骤进行设置：\n\
    \n1.  访问`https://www.npmjs.com/get-npm`并下载`node.js`。\n2.  按照网站上的指导，在系统上安装该软件包。\n\
    3.  安装完成后，打开一个新的终端/命令行界面，输入`npm`以检查它是否正常工作。\n\n我安装了LTS版本`8.11.4`。安装完成后，运行以下命令来安装`rasa-nlu-trainer`：\n\
    \n```\nsudo npm i -g rasa-nlu-trainer\n```\n\n成功安装此命令后，您将看到类似于以下的日志：\n\n```\n\
    [fsevents] Success: \"/usr/local/lib/node_modules/rasa-nlu-trainer/ node_modules/fsevents/lib/binding/Release/node-v57-darwin-x64/fse.node\"\
    \ already installed\nPass—update-binary to reinstall or—build-from-source to recompile\n\
    npm WARN slick-carousel@1.8.1 requires a peer of jquery@>=1.8.0 but none is installed.\
    \ You must install peer dependencies yourself.\n+ rasa-nlu-trainer@0.2.7 added\
    \ 492 packages in 10.14s\n```\n\n即使您的消息看起来与此不同，只要没有抛出任何错误，就无需担心。我们稍后就会知道`rasa-nlu-trainer`是否成功安装并能正常工作。\n\
    \n让我们在终端中进入之前创建的数据文件夹，并运行以下命令：\n\n```\nrasa-nlu-trainer\n```\n\n输入此命令将在端口`55703`上启动一个本地服务器，并在默认浏览器中打开它。它看起来会像图4-1所示。\n\
    \n![](image-xqb2tv9c.png)\n\n图4-1. 本地主机上的`rasa-nlu-trainer`\n\n如您所见，`data.json`中的所有现有数据都被这个出色的工具拾取，供我们删除或编辑。我们还可以从这里添加新的示例，它会不断扩展`data.json`文件。\n\
    \n我建议您向意图中添加更多数据，以便更好地训练模型。如果您正在尝试构建本章中介绍的同一个聊天机器人，可以从出版商提供的源代码压缩包或仓库中获取这个`data.json`。\n\
    \n就像我们在第3章中使用Dialogflow在话语中选择实体来定义它们一样，我们可以使用此工具执行相同的操作，并为实体命名以便后续解析。因此，点击示例的切换按钮，选择文本，并通过为其命名来添加一个实体。\n\
    \n我在定义的每个意图中添加了五到六个话语示例。我们添加的示例越多，模型训练得越好，准确率也越高。\n\n如果您现在查看`data.json`文件，会发现它已经自动添加了更多示例。\n\
    \n因此，请继续验证您的`data.json`文件，看看是否已包含从`rasa-nlu-trainer` UI添加的所有示例。您还会注意到，在`data.json`文件中，您可能使用`rasa-nlu-trainer`\
    \ UI定义的实体被捕获在`common_examples`列表中，并带有`start`和`end`键，这告诉模型特定实体值在示例中的起始和结束位置。\n\n\
    同一个字典对象还描述了我们定义的实体值及其名称。对于我们的示例，它看起来如下：\n\n```\n{\n  \"text\": \"19-01\",\n  \"\
    intent\": \"dob_intent\",\n  \"entities\": [\n    {\n      0,\n      2,\n    \
    \  \"value\": \"19\",\n      \"entity\": \"DD\"\n    },\n    {\n      3,\n   \
    \   5,\n      \"value\": \"01\",\n      \"entity\": \"MM\"\n    }\n  ]\n}\n```\n\
    \n## 训练聊天机器人模型\n\n在本节中，我们将基于准备好的数据训练一个模型。由于我们使用Jupyter Notebook进行文件创建和管理，我们将创建一个新的`.ipynb`文件，并开始编写Python代码，通过选择本章前面讨论过的某个流水线来训练我们的模型。\n\
    \n### 创建配置文件\n\n让我们再次以与之前使用Jupyter创建文件相同的方式创建一个JSON文件，并将其命名为`config.json`。我们将其放在数据文件夹之外（即项目目录`horoscope_bot`中）。\n\
    \n向其中添加以下配置：\n\n```\n{\n  \"pipeline\": \"tensorflow_embedding\",\n  \"path\"\
    : \"./models/nlu\",\n  \"data\": \"./data/data.json\"\n}\n```\n\n如您所见，`config.json`文件中包含一些重要的配置参数。让我们尝试理解它们。\n\
    \n-   `pipeline`：指定将使用哪些特征提取器来处理文本消息并提取必要信息。在我们的例子中，我们使用的是`tensorflow_embedding`。\n\
    -   `path`：本质上是训练后保存模型的目录。我们将模型保存在`/models/nlu`文件夹中。\n-   `data`：需要指定的路径，基本上是训练数据所在的位置。\n\
    \n完成`config.json`文件后，让我们继续编写一些Python代码来训练我们的机器学习模型。\n\n![](image-ai5wtx8d.png)\n\
    \n您也可以使用`.yml`文件作为配置文件，如下所示。您可以在GitHub仓库中找到示例`config.yml`文件。\n\n-   示例1：\n\n```\n\
    language: \"en\"\npipeline: \"tensorflow_embedding\"\n```\n\n-   示例2：\n\n```\n\
    language: \"en\"\npipeline:\n  - name: \"nlp_spacy\"\n  - name: \"tokenizer_spacy\"\
    \n  - name: \"intent_entity_featurizer_regex\"\n  - name: \"intent_featurizer_spacy\"\
    \n  - name: \"ner_crf\"\n  - name: \"ner_synonyms\"\n```\n\n![](image-5lnb5yze.png)\n\
    \n```\n  - name: \"intent_classifier_sklearn\"\n```\n\n所有传入的消息都按照定义的组件顺序进行处理。定义的组件按顺序逐一运行，因此被称为处理流水线。不同的组件用于不同的目的，例如实体提取、意图分类、预处理等。\n\
    \n这种格式的好处是，我们可以以清晰的方式指定Rasa预定义的流水线。"
  raw: 'Rasa NLU trainer is a very nice and handy tool to edit our training data right
    from our browser itself. Handling JSON data is tricky and also can lead to errors.
    With this handy tool we can easily add more examples to our training data or edit
    the existing ones. It saves a lot of time from manually annotating the data. rasa-nlu-trainer
    is a javascript- based tool, so we would need to install node.js to run this tool
    on our system. It doesn’t take more than 5 minutes to do that. Let’s get this
    set up by following these steps:   Go to https://www.npmjs.com/get-npm and download
    node.js. Install the package on your system as guided on the website. Once installed,
    go to a fresh terminal/command line interface on your system and type “npm” to
    see if it works.   I have installed LTS version 8.11.4\. Once installed, run the
    following command to install rasa-nlu-trainer:   sudo npm i -g rasa-nlu-trainer
      After the successful installation this command, you’ll see logs similar to the
    following:   [fsevents] Success: "/usr/local/lib/node_modules/rasa-nlu-trainer/
    node_modules/fsevents/lib/binding/Release/node-v57-darwin-x64/fse.node" already
    installed   Pass—update-binary to reinstall or—build-from-source to recompile
      npm WARN slick-carousel@1.8.1 requires a peer of jquery@>=1.8.0 but none is
    installed. You must install peer dependencies yourself.   + rasa-nlu-trainer@0.2.7
    added 492 packages in 10.14s  Even if your message doesn’t look like this, as
    long as it doesn’t throw any errors then don’t worry. We’ll get to know in a moment
    if our rasa-nlu-trainer is successfully installed and works well.   Let’s go to
    our data folder that we created earlier in our terminal and run the following
    command:   rasa-nlu-trainer   Typing this command will crank up a local server
    on port 55703 and open it in the default browser. It will look something like
    Figure 4-1\.  ![](image-xqb2tv9c.png)  Figure 4-1. rasa-nlu-trainer in localhost
      As you can see, all of our existing data from data.json is picked by this amazing
    tool for us to delete or edit and we can also add new examples from here and it
    will keep on extending the data.json file.   I would suggest that you add more
    data to your intents for better training of the model. You can get this data.json
    in the source code zip or repo provided by the publisher, if you are trying to
    build the same chatbot explained in this chapter.   Just as we selected the entities
    within utterances to define them in Chapter 3 using Dialogflow, we can do the
    same using this tool and give names to our entities for parsing later. So, click
    on the toggle button of the example, select the text, and add an entity by giving
    it a name.   I have added five to six utterance examples in each of the intents
    I have defined. The more examples we add, the better it is for the model to be
    trained and provide better accuracy.   If you look at the data.json file now,
    it will have more examples automatically added to it.


    So, go ahead and verify your data.json file to see if you have all your added
    examples from rasa-nlu-trainer UI.  You’ll also notice in the data.json file that
    the entities you might have defined using the rasa-nlu-trainer UI are captured
    in the common_examples list as having start and end keys, which tells the model
    at what point the particular entity value starts in the example and when it ends.
      The same dictionary object also depicts the value of the entity and the name
    of the entity we defined. For our example, it looks like the following:   {  
    "text": "19-01",   "intent": "dob_intent", "entities": [   {   0,   2,   "value":
    "19",   "entity": "DD"   },   {   3,   5,   "value": "01",   "entity": "MM"  
    }   ]   }   Training the Chatbot Model   In this section we are going to train
    a model on the data we prepared. As we used Jupyter Notebook for our file creation
    and management, we will be creating a new .ipynb and start writing our Python
    code to train our model by choosing one of the pipelines we discussed earlier
    in this chapter.  Creating a Configuration File   Let’s create a JSON file again
    in the same way we created one earlier using Jupyter and name it Let’s keep it
    outside our data folder (i.e., in the horoscope_bot that is our project directory).
      Add the following configuration to it:   {   "pipeline":"tensorflow_embedding",
    "path":"./models/nlu", "data":"./data/data.json"   }   As you can see, there are
    some important configuration parameters done in our   config.json file. Let’s
    try to understand them.   •  Pipeline is going to specify what featurizers or
    feature extractors are going to be used to crunch text messages and extract necessary
    information. In our case, we are using   •  path is essentially the directory
    where we keep our model after the training. We are going to keep our model in
    the /models/nlu folder.   •  data is the path we need to specify; it’s basically
    where our training data sits.   As we are done with our config.json file, let’s
    move on to some Python code to train our ML model.  ![](image-ai5wtx8d.png)  ––––––––
      you can also use .yml file as config files like below. you can get the example
    config.yml files in github repo.   •  Example 1:   language: "en"   pipeline:
    "tensorflow_embedding"    •  Example 2:   language: "en" pipeline:   -  name:
    "nlp_spacy"   -  name: "tokenizer_spacy"   -  name: "intent_entity_featurizer_regex"
      -  name: "intent_featurizer_spacy"   -  name: "ner_crf"   -  name: "ner_synonyms"
     ![](image-5lnb5yze.png) -  name: "intent_classifier_sklearn"   All incoming messages
    are processed as per the sequence of components defined. The defined components
    are run in a sequential manner, one by one, and hence are called the processing
    pipeline. Different components are used for different purposes, such as entity
    extraction, intent classification, pre-processing, etc.   The benefit of such
    a format is that we can specify the predefined pipelines by Rasa in a clear manner.'
  trans: "\nRasa NLU 训练器是一个非常便捷的工具，可以直接在浏览器中编辑训练数据。处理 JSON 数据既棘手又容易出错。借助这个便捷工具，我们可以轻松地向训练数据中添加更多示例或编辑现有示例，从而节省大量手动标注数据的时间。rasa-nlu-trainer\
    \ 是一个基于 JavaScript 的工具，因此我们需要安装 node.js 才能在系统上运行它。安装过程不超过 5 分钟。让我们按照以下步骤进行设置：\n\
    \n前往 https://www.npmjs.com/get-npm 下载 node.js。按照网站指引在系统上安装该软件包。安装完成后，打开一个新的终端/命令行界面，输入“npm”来检查是否安装成功。\n\
    \n我安装了 LTS 版本 8.11.4。安装完成后，运行以下命令来安装 rasa-nlu-trainer：\n\nsudo npm i -g rasa-nlu-trainer\n\
    \n成功安装此命令后，您将看到类似以下的日志：\n\n[fsevents] Success: \"/usr/local/lib/node_modules/rasa-nlu-trainer/\
    \ node_modules/fsevents/lib/binding/Release/node-v57-darwin-x64/fse.node\" already\
    \ installed\n\nPass—update-binary to reinstall or—build-from-source to recompile\n\
    \nnpm WARN slick-carousel@1.8.1 requires a peer of jquery@>=1.8.0 but none is\
    \ installed. You must install peer dependencies yourself.\n\n+ rasa-nlu-trainer@0.2.7\
    \ added 492 packages in 10.14s\n\n即使您的消息与此不同，只要没有抛出任何错误，就无需担心。我们稍后就会知道 rasa-nlu-trainer\
    \ 是否成功安装并能正常工作。\n\n让我们在终端中进入之前创建的数据文件夹，并运行以下命令：\n\nrasa-nlu-trainer\n\n输入此命令将在端口\
    \ 55703 上启动一个本地服务器，并在默认浏览器中打开它。界面将类似于图 4-1。\n\n![](img/image-xqb2tv9c.png)\n\n\
    图 4-1. 本地主机中的 rasa-nlu-trainer\n\n如您所见，data.json 中的所有现有数据都被这个出色的工具加载，供我们删除或编辑，我们也可以从这里添加新的示例，它会不断扩展\
    \ data.json 文件。\n\n我建议您为意图添加更多数据，以便更好地训练模型。如果您正在尝试构建本章中介绍的同一聊天机器人，可以从出版商提供的源代码压缩包或仓库中获取这个\
    \ data.json 文件。\n\n就像我们在第 3 章中使用 Dialogflow 在话语中选择实体进行定义一样，我们可以使用此工具进行相同的操作，并为实体命名以便后续解析。因此，点击示例的切换按钮，选择文本，并通过命名来添加一个实体。\n\
    \n我在定义的每个意图中都添加了五到六个话语示例。我们添加的示例越多，模型训练效果就越好，准确率也越高。\n\n现在查看 data.json 文件，您会发现它自动添加了更多示例。\n\
    \n因此，请继续验证您的 data.json 文件，确认其中包含了您从 rasa-nlu-trainer UI 添加的所有示例。您还会注意到，在 data.json\
    \ 文件中，您可能使用 rasa-nlu-trainer UI 定义的实体被捕获在 common_examples 列表中，并带有 start 和 end\
    \ 键，这告诉模型特定实体值在示例中的起始和结束位置。\n\n同一个字典对象还描述了实体的值和我们定义的实体名称。对于我们的示例，它看起来如下：\n\n{\n\
    \  \"text\": \"19-01\",\n  \"intent\": \"dob_intent\",\n  \"entities\": [\n  \
    \  {\n      0,\n      2,\n      \"value\": \"19\",\n      \"entity\": \"DD\"\n\
    \    },\n    {\n      3,\n      5,\n      \"value\": \"01\",\n      \"entity\"\
    : \"MM\"\n    }\n  ]\n}\n\n训练聊天机器人模型\n\n在本节中，我们将基于准备好的数据训练一个模型。由于我们使用 Jupyter\
    \ Notebook 进行文件创建和管理，我们将创建一个新的 .ipynb 文件，并开始编写 Python 代码，通过选择本章前面讨论的其中一个管道来训练我们的模型。\n\
    \n创建配置文件\n\n让我们再次以之前使用 Jupyter 创建文件的方式创建一个 JSON 文件，并将其命名为 config.json。将其放在数据文件夹之外（即项目目录\
    \ horoscope_bot 中）。\n\n向其中添加以下配置：\n\n{\n  \"pipeline\": \"tensorflow_embedding\"\
    ,\n  \"path\": \"./models/nlu\",\n  \"data\": \"./data/data.json\"\n}\n\n如您所见，config.json\
    \ 文件中配置了一些重要的参数。让我们尝试理解它们。\n\n*   pipeline 指定将使用哪些特征化器或特征提取器来处理文本消息并提取必要信息。在我们的例子中，我们使用的是\
    \ tensorflow_embedding。\n*   path 本质上是训练后保存模型的目录。我们将模型保存在 /models/nlu 文件夹中。\n\
    *   data 是需要指定的路径，即训练数据所在的位置。\n\n完成 config.json 文件后，让我们继续编写一些 Python 代码来训练我们的机器学习模型。\n\
    \n![](img/image-ai5wtx8d.png)\n\n––––––––\n\n您也可以使用 .yml 文件作为配置文件，如下所示。您可以在 GitHub\
    \ 仓库中找到示例 config.yml 文件。\n\n*   示例 1：\n\nlanguage: \"en\"\npipeline: \"tensorflow_embedding\"\
    \n\n*   示例 2：\n\nlanguage: \"en\"\npipeline:\n  - name: \"nlp_spacy\"\n  - name:\
    \ \"tokenizer_spacy\"\n  - name: \"intent_entity_featurizer_regex\"\n  - name:\
    \ \"intent_featurizer_spacy\"\n  - name: \"ner_crf\"\n  - name: \"ner_synonyms\"\
    \n\n![](img/image-5lnb5yze.png)\n\n  - name: \"intent_classifier_sklearn\"\n\n\
    所有传入的消息都按照定义的组件顺序进行处理。定义的组件按顺序逐一运行，因此被称为处理管道。不同的组件用于不同的目的，例如实体提取、意图分类、预处理等。\n\n\
    这种格式的好处是，我们可以以清晰的方式指定 Rasa 预定义的管道。\n"
- fmt: "# Writing Python Code to Train the Model and Predict\n\nLet’s open up a new\
    \ `.ipynb` file and start writing our code. Let’s name the `ipynb` as `rasa-nlu.ipynb`.\
    \ Make sure you have already successfully installed `rasa-nlu==0.13.2` for the\
    \ Python version you are using.\n\nThe following is what our code looks like to\
    \ use our `data.json` and `config.json` in Python and train a model using `tensorflow_embedding`\
    \ pipeline.\n\n```python\nfrom rasa_nlu.training_data import load_data\nfrom rasa_nlu.model\
    \ import Trainer\nfrom rasa_nlu import config\nfrom rasa_nlu.model import Interpreter\n\
    \ndef train_horoscopebot(data_json, config_file, model_dir):\n    training_data\
    \ = load_data(data_json)\n    trainer = Trainer(config.load(config_file))\n  \
    \  trainer.train(training_data)\n    model_directory = trainer.persist(model_dir,\
    \ fixed_model_name='horoscopebot')\n\ndef predict_intent(text):\n    interpreter\
    \ = Interpreter.load('./models/nlu/default/horoscopebot')\n    result = interpreter.parse(text)\n\
    \    print(result)\n```\n\nIn the first section of the code, we import all the\
    \ necessary libraries needed from `rasa_nlu` package. Then we define two methods\
    \ called `train_horoscopebot` and `predict_intent`, where the first method trains\
    \ the model given the `data`, `config_file`, and `model_directory` (place to store\
    \ the models), and `predict_intent` method uses the `Interpreter` model from `rasa_nlu`\
    \ to load the pre-trained model files and gives the user the ability to predict\
    \ any new text examples.\n\n## Training the Model\n\nWe run the below snippet\
    \ to call our `train_horoscopebot` method with the respective parameters:\n\n\
    ```python\ntrain_horoscopebot('./data/data.json', 'config.json', './models/nlu')\n\
    ```\n\nAfter running this code in our `rasa-nlu.ipynb`, we will get an output\
    \ like this:\n\n```\nEpochs: 300/300 [00:01<00:00, 175.69it/s, loss=0.075, acc=1.000]\n\
    ```\n\nThe code for training the chatbot model will create the `models` folder,\
    \ which you can see using Jupyter or using your file explorer or finder app. It\
    \ will create a bunch of index, meta, and pickle files at the model directory\
    \ destination we provided.\n\n## Predicting From the Model\n\nLet’s call the method\
    \ by passing a text to see how our trained model performs:\n\n```python\npredict_intent(\"\
    I am looking for my horoscope for today. I am wondering if you can tell me that.\"\
    )\n```\n\nThe method itself prints the output. For the above text, my output looks\
    \ like the following:\n\n```\nINFO:tensorflow:Restoring parameters from ./models/nlu/default/horoscopebot/intent_classifier_tensorflow_embedding.ckpt\n\
    ```\n\n```json\n{\n  \"intent\": {\n    \"name\": \"get_horoscope\",\n    \"confidence\"\
    : 0.9636583924293518\n  },\n  \"entities\": [],\n  \"intent_ranking\": [\n   \
    \ {\n      \"name\": \"get_horoscope\",\n      \"confidence\": 0.9636583924293518\n\
    \    },\n    {\n      \"name\": \"dob_intent\",\n      \"confidence\": 0.03462183475494385\n\
    \    },\n    {\n      \"name\": \"greeting\",\n      \"confidence\": 0\n    },\n\
    \    {\n      \"name\": \"subscription\",\n      \"confidence\": 0\n    }\n  ],\n\
    \  \"text\": \"I am looking for my horoscope for today. I am wondering if you\
    \ can tell me that.\"\n}\n```\n\nWow! Isn’t it magical? Our model has predicted\
    \ this text with a confidence of 96 percent. You can see in the provided `ipynb`\
    \ file that our model does well in predicting other intents as well.\n\nThis is\
    \ the power of `tensorflow` and ML overall. Needless to say, `rasa_nlu` library\
    \ makes it so easy to believe. So, it’s time for you go back in retrospection,\
    \ and if you remember Chapter 3 of this book, then you must remember whenever\
    \ we used to add a new example, the Dialogflow used to re-train the model. It\
    \ was actually doing the same as we just did, behind the scenes. We couldn’t have\
    \ changed the model or tuned any parameter there, but we can do that all now with\
    \ full control.\n\nNow that we have successfully built and trained a model using\
    \ `tensorflow` and tested it as well, we’ll move on to the next topic of Dialog\
    \ Management. I would request you test all the scenarios your bot might be facing\
    \ so that you know the points where your model is not performing well and, accordingly,\
    \ you can add more data or tune the parameters if needed.\n\nAlso, remember that\
    \ you only need to re-train the model whenever there is a change in the training\
    \ data. If there is no change in the training data, we can load the existing training\
    \ model to keep predicting on new examples.\n\n# Dialog Management Using Rasa\
    \ Core\n\nIn this section we are going to get our hands dirty by training another\
    \ model for Rasa Core dialog management. Remember, at this point we have a model\
    \ ready to predict the intent of the text, we can write some Python code to formulate\
    \ responses, and we can reply back to the customer. But what if we want to add\
    \ more intents to our bot? Is that scalable in the case of a bigger application\
    \ with lots of features? The answer is no. Here dialog management from Rasa Core\
    \ comes to the rescue.\n\nIf you have ever tried to use any bot on any platform,\
    \ you must have seen it failing in certain conditions. Yes, we all have been there\
    \ and it still exists as today’s bot fails to manage the contexts of the conversation\
    \ miserably or follow the suit of conversation. With the help of Rasa Core’s ML-based\
    \ dialog framework we can fix this issue easily.\n\nRasa Core is well-proven for\
    \ enterprise-level applications and used by thousands of developers because it\
    \ is production-ready, easy to use and extend, and, most importantly, open source.\n\
    \n## Understanding More on Rasa Core and Dialog System\n\nBefore we actually move\
    \ to the coding part of Rasa Core for our dialog management model, it’s really\
    \ important to understand why and where this is coming from.\n\nWe’ll try to understand\
    \ how we have been doing things so far for building the chatbots and how this\
    \ is going to be changed forever.\n\nLet’s take an example:\n\nIf we were to build\
    \ a simple chatbot that would help users book flight/bus/movie/train tickets,\
    \ the easiest way would be to create a state machine or decision trees, write\
    \ a bunch of `if...else`, and it would be done. This would work but wouldn’t scale.\
    \ If a customer is having a good experience initially with something, they want\
    \ to use it more. By some heuristics, we can show a chatbot to be intelligent\
    \ but not for very long."
