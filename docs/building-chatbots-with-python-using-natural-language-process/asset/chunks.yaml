    1,   "food_items_entity1": "chicken dumpling", "quantity2": 2,   "food_items_entity2":
    "spring rolls"   }   We can easily write some Python code to convert the JSON
    to our intended format we discussed.  ![](image-o40kuvnl.png)  ––––––––  ![](image-5lnb5yze.png)
    Just test your python skills and try to write a code that reads a Json like the
    preceding and returns the quantity and food item belonging to it in another Json
    format we discussed earlier.   Understanding and Replying Back to the User   Now,
    next in the conversation is to make the bot reply back to the user that the order
    is understood along with any new information. New information could be the generated
    order_id, the order amount, or the expected delivery time. These things will be
    populated at your server end, and you can formulate it with the bot’s response
    to give it back to the user.'
  trans: "\n请帮我点餐  我想点中餐 我想点餐  你能帮我点餐吗？请帮我点餐好吗？  我想点餐  我想点泰餐  我想点中餐  现在，我们已经构建了意图来识别上述用户表达或相关用户表达。接下来，是时候使用意图的默认回复向用户添加回复了。\n\
    \n为意图添加默认回复\n\n我们将添加三种可能的回复，一旦检测到 `place_order_intent`，就会返回给用户。\n\n当然，您今天想点什么？没问题，您今天想吃点什么？\n\
    好的，我会尽力帮您。您今天想吃点什么？\n\n现在，下一步是等待用户输入他想要的食物并解析这些食物。现在我们将创建一个新的意图，告诉我们用户实际想要点什么（即食物项目）。\n\
    \n我们创建一个名为 `items_description` 的新意图\n\n首先，我们添加标准的用户表达。\n\n一个鸡肉饺子和两个春卷。\n\n当我们添加用户表达后，我们可以选择特定的词语，将其指定为意图的实体。这可以是数量、日期或时间、地点等预定义的实体，但我们也可以通过点击弹出框右下角的“创建新实体”按钮来创建自己的实体。\n\
    \n高亮显示话语中你想要设为实体的词语。之后，会弹出创建我们自己的实体的对话框。\n\n在这个例子中，我们应该能够以一种易于阅读的格式解析数据，以便我们可以使用任何编程语言来使用它。JSON\
    \ 格式是当今跨平台应用中我们能拥有的最佳格式。Dialogflow 默认以 JSON 格式返回数据，可以解析成类似下面代码的样子。始终建议尽可能保持数据最小化；不要因为提供过多数据而使\
    \ API 响应过载。请记住，所有这些在规模化时都是要花钱的。\n\n{\n  \"food_items\": {\n    \"chicken dumpling\"\
    : 1,\n    \"Spring rolls\": 2\n  }\n}\n\n项目描述意图及其所属实体\n\n我们可以选择“一”和“二”，并将它们定义为\
    \ `@sys.number`，这其实就是数据类型。我们将创建一个名为 `food_items_entity` 的新实体来识别食物项目。\n\n如果你查看图\
    \ 3-6，你会发现我们有一个名为 `food_items_` 的实体，但当我们选择词语时，我们将参数命名为 `food_items_entity1`，对于食物数量也是如此，它是一个数字，我们将第一个和第二个参数分别命名为\
    \ `quantity1` 和 `quantity2`。![](img/image-zv0s5e11.png) 图 3-6. 项目描述意图\n\n我们在这里定义的内容将帮助我们理解在意图被触发后我们将收到的\
    \ JSON 响应。我们应该拥有所有这些值，以便继续推进聊天机器人的流程。\n\n所以，选择整个词语或词语组合，然后点击“创建”。会出现一个新屏幕来创建实体；只需输入这个新实体的名称并保存。\n\
    \n现在，回到我们的 `items_description` 意图，你应该会看到类似图 3-6 的内容。\n\n继续在训练短语中添加更多的用户表达，并在其中定义实体。\n\
    \n到目前为止，我们已经添加了四个话语，它们看起来是这样的。我们将尽可能多地添加，以便我们的智能体在意图分类方面的准确性更高。\n\nDialogflow\
    \ 还有一个共享智能体训练数据的功能。本书中使用的训练数据可以通过 Apress 网站 https://github.com/Apress/building-\
    \ 访问。正如你在图 3-7 中看到的，我们尝试在我们的 Dialogflow 智能体的项目描述意图中添加更多示例。![](img/image-0szok150.png)\
    \ 图 3-7. 在项目描述意图中添加更多话语\n\n现在，此时一旦我们保存了意图，并且我们的智能体完成了模型训练。如果我们在右侧输入以下句子，我们应该能够看到如下的\
    \ JSON 响应：\n\n一个鸡肉饺子和两个春卷\n\n来自意图的响应：\n\n{\n  \"id\": \"e8cf4a44-6ec9-49ae-9da8-a5542a80d742\"\
    ,\n  \"timestamp\": \"2018-04-01T21:22:42.846Z\",\n  \"lang\": \"en\",\n  \"result\"\
    : {\n    \"source\": \"agent\",\n    \"resolvedQuery\": \"One chicken dumpling\
    \ and two spring rolls\",\n    \"action\": \"\",\n    \"actionIncomplete\": false,\n\
    \    \"parameters\": {\n      \"quantity1\": 1,\n      \"food_items_entity1\"\
    : \"chicken dumpling\",\n      \"quantity2\": 2,\n      \"food_items_entity2\"\
    : \"spring rolls\"\n    },\n    \"contexts\": [],\n    \"metadata\": {\n     \
    \ \"intentId\": \"0b478407-1b37-4f9a-8779-1866714dd44f\",\n      \"webhookUsed\"\
    : \"false\",\n      \"webhookForSlotFillingUsed\": \"false\",\n      \"intentName\"\
    : \"items_description\"\n    },\n    \"fulfillment\": {\n      \"speech\": \"\"\
    ,\n      \"messages\": [\n        {\n          \"type\": 0,\n          \"speech\"\
    : \"\"\n        }\n      ]\n    },\n    \"score\": 1\n  },\n  \"status\": {\n\
    \    \"code\": 200,\n    \"errorType\": \"success\",\n    \"webhookTimedOut\"\
    : false\n  },\n  \"sessionId\": \"e1ee1860-06a7-4ca1-acae-f92c6e4a023e\"\n}\n\n\
    如果你查看 JSON 响应的参数部分，我们会看到\n\n{\n  \"quantity1\": 1,\n  \"food_items_entity1\":\
    \ \"chicken dumpling\",\n  \"quantity2\": 2,\n  \"food_items_entity2\": \"spring\
    \ rolls\"\n}\n\n我们可以轻松地编写一些 Python 代码，将 JSON 转换为我们之前讨论的目标格式。![](img/image-o40kuvnl.png)\
    \ –––––––– ![](img/image-5lnb5yze.png) 只需测试你的 Python 技能，尝试编写一段代码，读取像上面这样的 JSON，并返回数量及其所属的食物项目，格式为我们之前讨论的另一种\
    \ JSON 格式。\n\n理解并回复用户\n\n现在，对话的下一步是让机器人回复用户，告知订单已理解，并附带任何新信息。新信息可以是生成的订单 ID、订单金额或预计送达时间。这些信息将在你的服务器端填充，你可以将其与机器人的回复整合在一起，返回给用户。\n"
- fmt: 'Now, let’s try to add the order amount in our case; to do that, we can use
    Dialogflow’s Default Response feature and add this inside the intent. Let’s hardcode
    the amount for now, as this amount will vary depending on the food items, their
    quantity, or the restaurant. Later in the chapter, we’ll discuss how to make it
    dynamic by invoking an API. The interesting thing here is that we can access the
    params we got from the intent (i.e., the food items and their quantities). Responses
    can contain references to parameter We’ll understand this in a moment. If a parameter
    is present in the parameter table, we can use the following format to refer to
    its value in the ‘Text response’ field: `$parameter_name`. We can use this params
    in the default response so that the bot confirms the order back to the user. Add
    “Your final amount is XYZ and your order is placed for `$quantity1` `$food_items_entity1`
    and `$quantity2` `$food_items_entity2`” as the response.


    ![](image-e3k48jco.png)


    **Note**: in case our intent is not able to parse the food items or their quantity,
    we need to give a different default response asking to explain what our bot couldn’t
    understand or to at least confirm. We already learned how to add default response
    to an intent in the section “Adding Default Response to the Intent.”


    ![](image-qmq86w97.png)


    ## Order Status Intent


    Now, let’s create the `order_status` intent, where the user may be trying to ask
    for the status of the order after the order is placed. Figure 3-8 provides some
    training phrases we added for order status intent, and we name the intent.


    ![](image-tjq5cnao.png)


    **Figure 3-8.** Creating order status intent


    Now, let’s try some random order status asking utterances and see if our agent
    is intelligent enough to identify the intent. I tried, “received my food” and
    voila—my agent got it perfectly right that it’s an `order_status` intent. See
    the `resolvedQuery` and its `intentName` in the JSON in Figure 3-9.


    ![](image-vk1swy7t.png)


    **Figure 3-9.** JSON response from Dialogflow after query is resolved


    ## User_Order_ID Intent


    Now, next is to ask the user for Order ID, so let’s set the default response of
    this intent to ask the following question: “Can you please help me with your order
    ID?” Now, the user will be giving their order ID, and our task is to identify
    that and give a response again. So, for that we need to create another intent
    to identify when the user is talking about the order ID. Note that the intents
    we are creating are pretty much independent of each other. In this case we know
    that the user is going to give the order ID, and it will mostly be right. If it’s
    wrong you can always go back to the user and ask again. We should also note that
    in some cases, `order_id` and phone number both may be integers. In such cases,
    we need to do some validation, like number of digits in `order_id` or phone number.


    Also, based on the context of the previous question, you can figure out if the
    user is giving an `order_id` or a phone number. As discussed in Chapter 1, we
    can always use decision trees for better flow management of the chatbot. Also
    we can programmatically keep track that after `order_status` intent we ask for
    the order ID, and the user will be sending some order ID (some number), which
    is easier to parse in code rather than creating a new intent altogether. In this
    example, we’ll create `user_order_id` intent, as there is no conflict as such.
    Now, we create a new intent called `user_order_id`.


    Figure 3-10 shows how our `user_order_id` intent looks.


    ![](image-4dqimuvw.png)


    **Figure 3-10.** Defining the user order ID intent in our agent


    I tested a couple of expressions, and it works well to classify them correctly
    as `user_order_id` intent. Always test using the Dialogflow console to see if
    your intent is behaving as expected. Now, let’s set the default response of `user_order_id`
    intent to the following response from the bot: “Order Status for Order ID: `$order_id`.
    The delivery guy is in your locality, your food will arrive in about 5 minutes.”
    We are again using the parameter parsed from the `user_order_id` intent to prepare
    a reply to the user.


    ## User_Thanks Intent


    Next, the user will possibly be thanking, if not something else, so we create
    a new intent called `user_thanks` to identify different ways the user is saying
    thank you. This is important because once the user says thank you in some way
    or another, our bot should reply the same. We shouldn’t just expect the user to
    say thanks after the delivery status default response and reply blindly but try
    to identify it using custom intents. Figure 3-11 shows how our `user_thanks` intent
    looks.


    ![](image-edwfh2o7.png)


    **Figure 3-11.** Defining an intent when the user says thank you


    Now, it’s time to say thank you to the user using the default response feature
    and mark this intent as the end of the conversation. Let’s add some text like,
    “a lot for your cooperation,” as our default response. We can add more such responses
    so that the bot should look more realistic (see Figure 3-12).


    ![](image-qxmpjjff.png)


    **Figure 3-12.** Adding a response against a user’s intent in the agent


    Look at Figure 3-12 and see that we have enabled this intent as the end of conversation.
    If we try to integrate our bot with Google Assistant, then enabling this means
    to close the microphone in Google Assistant when intent is finished. Now at this
    point we have created our bot, built it as per our initial design and script,
    and trained it. Now, it’s time to deploy it on web and see how it looks.


    ## Deploying Dialogflow Chatbot on the Web


    In this part, we are going to integrate our bot with various platforms like Facebook
    Messenger, Twitter, Slack, etc., and see if they work. There are many more platforms
    where you can integrate this bot easily. We will test our bot with Web Demo and
    Facebook Messenger for now.'
