    ```\n\n这是我们写在`train_initialize.py`文件中的代码。现在，在我们进入下一个代码文件之前，让我们先尝试理解其中的重要点。\n\n\
    首先，我们从`__future__`模块导入了一些方法。Python 中的`__future__`语句有特殊用途，它们会改变 Python 模块的解析方式，并改变现有方法的行为。\n\
    \n好奇心强？在 Python 解释器中尝试以下代码：\n\n```python\nfrom __future__ import braces\n```\n\
    \n从`rasa_core`模块导入`utils`方法来配置日志记录。从`agent`模块导入`Agent`类来创建代理对象。`KerasPolicy`和`MemoizationPolicy`将作为策略参数传递给`Agent`类。\n\
    \n- `configure_colored_logging`：`utils.py`中定义的实用方法，用于使用 Python 的`coloredlogs`包进行彩色日志记录。\n\
