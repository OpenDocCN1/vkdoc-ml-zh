  trans: "\n帮我预订一张从机场站到香港站的地铁票。再帮我叫一辆从香港机场到亚洲国际博览馆的出租车。以下是代码：  \nsentence1 = \"Book\
    \ me a metro from Airport Station to Hong Kong Station.\"  \nsentence2 = \"Book\
    \ me a cab to Hong Kong Airport from AsiaWorld-Expo.\"  \n\nimport re  \n\nfrom_to\
    \ = re.compile('.* from (.*) to (.*)')  \n\nto_from = re.compile('.* to (.*) from\
    \ (.*)')  \n\nfrom_to_match = from_to.match(sentence2)  \nto_from_match = to_from.match(sentence2)\
    \  \n\nif from_to_match and from_to_match.groups():  \n  _from = from_to_match.groups()[0]\
    \  \n  _to = from_to_match.groups()[1]  \n  print(\"from_to pattern matched correctly.\
    \ Printing values\\n\")  \n  print(\"From: {}, To: {}\".format(_from, _to))  \n\
    \nelif to_from_match and to_from_match.groups():  \n  _to = to_from_match.groups()[0]\
    \  \n  _from = to_from_match.groups()[1]  \n  print(\"to_from pattern matched\
    \ correctly. Printing values\\n\")  \n  print(\"From: {}, To: {}\".format(_from,\
    \ _to))  \n\n输出：  \n\nto_from pattern matched correctly. Printing values  \nFrom:\
    \ AsiaWorld-Expo., To: Hong Kong Airport  \n\n尝试将 sentence2 改为 sentence1，看看代码是否能正确识别模式。\
    \  \n尽管如今机器学习功能强大，正则表达式和模式匹配已退居次位，但请务必温习一下相关知识，因为随时可能需要用它从单词、句子或文本文档中解析特定细节。 \
    \ \n\n总结  \n\n至此，你应该已经清楚为什么在开始构建聊天机器人之前需要了解 NLP。在本章中，我们学习了 Python 中的 spaCy 模块、它的特性以及如何安装它。我们深入探讨了\
    \ NLP 的各种方法，这些方法在构建聊天机器人时被广泛使用。我们学习了词性标注、词干提取与词形还原的区别、实体识别、名词组块化以及查找词组之间的相似性。\
    \  \n\n我们为所有这些概念编写了代码，并通过实践而非仅仅阅读来学习它们——这正是本书所强调的。我们还复习了分词和正则表达式的基础知识。我们已经准备好进入下一章，使用一个名为\
    \ Dialogflow 的免费工具来构建我们的聊天机器人。在下一章中，我们将学习如何训练我们的聊天机器人来理解和提取用户提供的信息。  \n\n第 3 章\
    \  \n\n––––––––  \n\n轻松构建聊天机器人  \n\n“轻松构建聊天机器人”这一章的编写考虑到有时你不想从头开始构建一切，只想快速完成任务。本章不需要你编写大量代码，但仍能让你清楚地了解如何以简单的方式构建聊天机器人并将其发布。\
    \  \n\n本章之所以对学习构建聊天机器人更为重要，是因为软件世界变化太快，需要快速适应。有时我们需要快速构建应用程序，并尝试寻找开源库中可用的工具，以便无需重新发明轮子就能快速构建应用。\
    \  \n\n有时我们的编码能力不足以从头构建一切。即使我们想从头构建应用，也可能因为学习曲线对新入门者来说过于陡峭而无法实现。  \n\n本章将帮助你快速构建聊天机器人，并将其发布供全世界使用。\
    \  \n\n我们将尝试使用一个以前称为 Api.ai 的工具，现在它被称为 Dialogflow。  \n\nDialogflow 简介  \n\nDialogflow\
    \ 通过构建引人入胜的语音和文本对话界面（如语音应用和聊天机器人），为用户提供了与其产品互动的新方法。  \n\nDialogflow 由人工智能驱动。它帮助你与网站、移动应用、Google\
    \ Assistant、Amazon Alexa、Facebook Messenger 以及其他流行平台和设备上的用户建立连接。  \n\n以下来自 Dialogflow\
    \ 的图表展示了它们如何处理用户请求。  \n\n––––––––  \n\n63  \n\n![](img/image-7r6ovgla.png)  \n\
    \n图 3-1. Dialogflow 架构工作示意图  \n\n流程如下：  \n\n用户与输入设备对话。用户查询进入 Dialogflow 引擎。Dialogflow\
    \ 尝试识别意图。根据意图执行 fulfillment，并从数据库返回数据。响应返回给意图。响应被转换为可操作的数据。用户的信息请求被返回给输出设备。  \n\
    \nDialogflow 中有一个“代理”的概念，最好将其描述为自然语言理解（NLU）模块。这些模块可以集成到你的应用、产品或服务中，将用户的自然语言请求转换为可操作的数据。当用户输入与代理中的某个意图匹配时，就会发生这种转换。\
    \  \n\n代理还可以被设计为以特定方式管理对话流程。这可以通过上下文、意图优先级、槽位填充、职责以及通过 webhook 进行 fulfillment\
    \ 来实现。  \n\n入门指南  \n\n了解我们目前所学的内容过去和现在都很重要，因为开源中提供的免费工具和包并不总能帮助你构建一个完整的聊天机器人应用。\
    \  \n\n很多时候，你可能会遇到想要自己构建一切的情况，以便对应用拥有更多控制权。我们将在下一章学习这些内容，并同时使用之前学到的 NLP 技术。  \n\
    \n本章的全部内容是关于创建一个概念验证型的聊天机器人，并使其在几乎不需要编程经验或无需编程的情况下准备好供全世界使用。  \n\n构建一个订餐聊天机器人\
    \  \n\n我们将借助 Dialogflow 为一家特定餐厅创建一个聊天机器人。我们将其命名为 OnlineEats 产品。你也可以选择其他任何你想构建聊天机器人的用例。在本章中，我们将构建一个订餐聊天机器人。\
    \  \n\n确定范围  \n\n让我们确定这个聊天机器人的范围——即它能做什么以及做到什么程度。  \n\n• 它应该能够动态地向用户打招呼。  \n"
- fmt: '# Building a Food Ordering Chatbot


    Let’s also level-set the expectation of the chatbot in terms of the minimum things
    we should be able to see it doing. For that, let’s create a script of a conversation
    between our chatbot and the user. This helps us to stick to the plan to getting
    a basic working chatbot ready, assuming the user is doing the conversation in
    a nice and correct manner.


    - It should be able to understand the menu items and their quantity requested.

    - Chatbot should be able to place an order on the user’s behalf.

    - Give the user the status of the order when asked.


    ## Listing Intents


    Here we list the intents we want our chatbot to train with so that it can understand
    those intents when asked by the user.


    ### Intents


    - **Default welcome intent**: when the user messages the chatbot

    - **Place order intent**: when the user asks the bot to order food

    - **Item description intent**: when the user tells what item and quantity they
    want

    - **Order status**: when the user wants to know his order status

    - **Order_ID**: the bot needs to understand the user’s order ID for tracking.

    - **User thanks**: when the user thanks the bot


    ## Listing Entities


    We’ll try to list all possible entities for all intents here. Later in the chapter
    we’ll see them being defined for whichever intent they are applicable.


    ### Entities


    - **food_items**: what food does the user want to order?

    - **quantities**: what is the quantity of the food item the user is willing to
    order?

    - **order_id**: order_id of the place order for user


    ## Chatbot and User Conversation Script


    ```

    User: Hello

    OnlineEatsBot: Hello and Welcome! How may I help you?

    User: I am looking to order Chinese food.

    OnlineEatsBot: Sure, what would you like to order today?

    User: One chicken dumpling and two spring rolls.

    OnlineEatsBot: Done. Your final amount is XYZ, and your order is placed for 1
    Chicken dumpling and 2 spring rolls.

    User: I haven’t received my order yet. Where is my food?

    OnlineEatsBot: Can you please help me with your order ID?

    User: 123456

    OnlineEatsBot: Order Status for Order ID: 123456. The delivery guy is in your
    locality, your food will arrive in about 5 minutes.

    User: Thanks.

    OnlineEatsBot: Thanks a lot for your cooperation.

    ```


    Now that we have written a basic script to follow to build our chatbot, we’ll
    now dive into Dialogflow.


    ## Getting Started With Dialogflow


    Let’s follow these steps to create an account in Dialogflow and then create an
    agent. (An agent is nothing but another name for a chatbot.)


    1. Create an account at and log in to the account.

    2. Create an agent.


    ![](image-h773tmys.png)


    **Figure 3-2.** Creating a new agent in Dialogflow


    Enter the details, like name of the agent, time zone, default language, and Google
    Project that you want to choose or create a new Google project.


    3. Create intents.


    If you see Figure 3-3, you will see that we are given two intents already.


    - **Default fallback intent**: Fallback intents are triggered if a user’s input
    is not matched by any of the regular intents or enabled built-in small talk. When
    you create a new agent, a default fallback intent is created automatically. You
    can modify or delete it if you wish.

    - **Default welcome intent**: We can extend this welcome intent for our own chatbots.
    You should add some of your own user expressions and default responses.


    ![](image-dfb2ywfd.png)


    **Figure 3-3.** Creating intents in Dialogflow


    Before we create our own intents, let’s first add some utterances in default welcome
    intent and make it ready using the following steps:


    - Click on the default welcome intent.

    - Add your own user expressions in Training Phrases.

    - Click on SAVE.


    When we click on save, the machine learning models behind the scenes run and train
    the data that we gave (i.e., the user expressions). Training the data means letting
    the machine understand what kind of intent it is based on the data that we provide
    and being able to predict when we give any new data to it. For example, if we
    look at Figure 3-4, where we have defined five user expressions that the machine
    already knows belong to “welcome intent,” what if the user says “Hello there,”
    which is not defined anywhere? The machine will still categorize “Hello there”
    as default welcome as the features used in training and the machine for welcome
    intent are similar in the new user expression.


    ![](image-xpujxk7c.png)


    **Figure 3-4.** Defining a default welcome or greeting intent in Dialogflow


    Let’s try to see if the welcome intent works for us. With Dialogflow we can do
    that in the dashboard itself. See Figure 3-5.


    ![](image-ru8shcrc.png)


    **Figure 3-5.** Testing the welcome intent in Dialogflow


    ## Points to Remember When Creating Intents


    Let’s look at some of the points important to know while creating intents on Dialogflow.


    - Dialogflow’s intent also has the facility to have a default response of every
    intent. A default response is a response given back to the user every time that
    intent is recognized. In our example, when a user says “Hello there,” we get “Hello!”
    as the response from the bot.

    - If you want to you can add more responses or delete existing ones, having more
    than one response makes the bot look realistic so that it doesn’t reply with the
    same response every time and feels human to the user talking to the bot.

    - Intents in Dialogflow also have the capability of being marked as the end of
    the conversation. In other words, you can let the bot assume that the user will
    not be participating in the conversation anymore, and the bot can do the necessary
    action, based on this information, to end the conversation.


    ## Creating Intents and Adding Utterances


    Now that we have created the welcome intent, let’s create the order I named it.


    The following are my user expressions that I entered:


    - I want food

    - I want to order food asap

    - Can you please take my order for food?'
