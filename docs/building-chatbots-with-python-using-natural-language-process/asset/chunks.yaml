- fmt: "Take my order please. I want to place an order for Chinese food. I want to\
    \ place an order. Would you please help me to order food? Can you please order\
    \ food for me? I want to order food. I am looking to order Thai food. I am looking\
    \ to order Chinese food.\n\nNow, we have built the intent to identify the aforementioned\
    \ user expressions or related user expressions. Now, it’s time to add a response\
    \ back to the user using default response to the intent.\n\n## Adding Default\
    \ Response to the Intent\n\nWe’ll be adding three possible responses that will\
    \ be given back to the user once `place_order_intent` is encountered.\n\n- Sure,\
    \ What would you like to order today?\n- Definitely, What would you like to have\
    \ today?\n- Certainly, I’ll try to help you with that. What are you feeling like\
    \ eating today?\n\nNow, the next step is to wait for the user to input the items\
    \ he wants and parse the items. Now we’ll create a new intent that tells us what\
    \ the user actually intends to order (i.e., the food items).\n\nWe create a new\
    \ intent named `items_description`.\n\nFirst, we add our standard user expression.\n\
    \n- One chicken dumpling and two spring rolls.\n\nWhen we add the user expression\
    \ then we can select specific words that we want to specify as entities of the\
    \ intent. This could be quantity, date or time, location, etc., which are predefined,\
    \ but we can create our own entities by clicking on the Create New button on the\
    \ bottom right after we get the pop-up box.\n\nHighlight the word in the utterance\
    \ for which you want to make that selected word an entity. After that, it opens\
    \ the pop-up box to create our own entity.\n\nIn this example, we should be able\
    \ to parse the data in a nice readable format so that we can use that using any\
    \ programming language. JSON format is the best format we can have in today’s\
    \ cross-platform applications. Dialogflow returns the data in JSON format by default,\
    \ which can be parsed to look something like the following code. It’s always suggested\
    \ to keep your data as minimal as possible; don’t overwhelm the API response by\
    \ giving too much data. Remember all of these at scale cost money.\n\n```json\n\
    {\n  \"food_items\": {\n    \"chicken dumpling\": 1,\n    \"Spring rolls\": 2\n\
    \  }\n}\n```\n\n## Item Description Intent and Belonging Entities\n\nWe can select\
    \ `One` and `Two` and define them as `@sys.number`, which is nothing but the data\
    \ type. We’ll create a new entity called `food_items_entity` to identify food\
    \ items.\n\nIf you look at Figure 3-6, you’ll find that we have ENTITY named as\
    \ `food_items_` but when we select the words, then we name the parameters as `food_items_entity1`\
    \ and this is similar for the food quantity, which is a number where we name the\
    \ first and second parameters as `quantity1` and `quantity2`, respectively.\n\n\
    ![](image-zv0s5e11.png)\n\nFigure 3-6. Item description intent\n\nWhat we define\
    \ here will help us understand the JSON response, which we’ll be getting after\
    \ intent is triggered. We should have all these values there to move forward with\
    \ the chatbot flow.\n\nSo, select the entire word or combination of words and\
    \ click on Create. A new screen will come to create entities; just enter the name\
    \ for this new entity and save.\n\nNow, come back to our intent for `items_description`\
    \ and you should see something like Figure 3-6.\n\nKeep adding more user expression\
    \ in the training phrases, and keep defining the entities within it.\n\nWe have\
    \ added four utterances so far, and this is how they look. We’re going to add\
    \ as many as possible so that our agent’s accuracy for intent classification is\
    \ better.\n\nDialogflow also has a feature to share the agent’s training data.\
    \ Training data used in this book can be accessed via Apress website, https://github.com/Apress/building-\
    \ As you can see in the Figure 3-7 where we try to add some more examples in the\
    \ item description intent in our dialogflow agent.\n\n![](image-0szok150.png)\n\
    \nFigure 3-7. Adding more utterances in item description intent\n\nNow, at this\
    \ point once we have saved our intent, and our agent has finished training the\
    \ models. If we enter the following sentence on the right side, we should be able\
    \ to see the following JSON response:\n\n- One chicken dumpling and two spring\
    \ rolls\n\nResponse from the intent:\n\n```json\n{\n  \"id\": \"e8cf4a44-6ec9-49ae-9da8-a5542a80d742\"\
    ,\n  \"timestamp\": \"2018-04-01T21:22:42.846Z\",\n  \"lang\": \"en\",\n  \"result\"\
    : {\n    \"source\": \"agent\",\n    \"resolvedQuery\": \"One chicken dumpling\
    \ and two spring rolls\",\n    \"action\": \"\",\n    \"actionIncomplete\": false,\n\
    \    \"parameters\": {\n      \"quantity1\": 1,\n      \"food_items_entity1\"\
    : \"chicken dumpling\",\n      \"quantity2\": 2,\n      \"food_items_entity2\"\
    : \"spring rolls\"\n    },\n    \"contexts\": [],\n    \"metadata\": {\n     \
    \ \"intentId\": \"0b478407-1b37-4f9a-8779-1866714dd44f\",\n      \"webhookUsed\"\
    : \"false\",\n      \"webhookForSlotFillingUsed\": \"false\",\n      \"intentName\"\
    : \"items_description\"\n    },\n    \"fulfillment\": {\n      \"speech\": \"\"\
    ,\n      \"messages\": [\n        {\n          \"type\": 0,\n          \"speech\"\
    : \"\"\n        }\n      ]\n    },\n    \"score\": 1\n  },\n  \"status\": {\n\
    \    \"code\": 200,\n    \"errorType\": \"success\",\n    \"webhookTimedOut\"\
    : false\n  },\n  \"sessionId\": \"e1ee1860-06a7-4ca1-acae-f92c6e4a023e\"\n}\n\
    ```\n\nIf you look at the parameters section of the JSON response we see\n\n```json\n\
    {\n  \"quantity1\": 1,\n  \"food_items_entity1\": \"chicken dumpling\",\n  \"\
    quantity2\": 2,\n  \"food_items_entity2\": \"spring rolls\"\n}\n```\n\nWe can\
    \ easily write some Python code to convert the JSON to our intended format we\
    \ discussed.\n\n![](image-o40kuvnl.png)\n\n––––––––\n\n![](image-5lnb5yze.png)\n\
    \nJust test your python skills and try to write a code that reads a Json like\
    \ the preceding and returns the quantity and food item belonging to it in another\
    \ Json format we discussed earlier.\n\n## Understanding and Replying Back to the\
    \ User\n\nNow, next in the conversation is to make the bot reply back to the user\
    \ that the order is understood along with any new information. New information\
    \ could be the generated `order_id`, the order amount, or the expected delivery\
    \ time. These things will be populated at your server end, and you can formulate\
    \ it with the bot’s response to give it back to the user."
