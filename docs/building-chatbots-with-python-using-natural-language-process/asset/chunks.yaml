  trans: '

    聊天机器人显然不仅仅能自动化一些高度重复的工作，但你总会发现，大多数聊天机器人主要试图解决同一个问题——无论是通过监督学习（即：“有监督学习”）还是自我学习（即：“无监督学习”）。


    你的机器人任务能否被自动化并固定下来？

    除非你只是为了学习目的而构建聊天机器人，否则你应该确保你试图解决的问题是可以自动化的。机器已经开始学习和自行处理事务，但这仍处于非常初级的阶段。你现在认为无法自动化的事情，可能在几年后就能实现。


    问答机器人

    构建聊天机器人的一个很好的问题示例就是问答机器人。想象一个经过训练的机器人，它能理解用户提出的各种问题，而这些问题的答案已经存在于网站的常见问题解答（FAQ）页面上。


    如果你回过头去尝试回答前面提到的三个问题，答案都是肯定的。


    参见图 1-6，你会发现一个 FAQ 机器人在做什么。


    ![](img/image-9r593nut.png)


    ––––––––


    图 1-6. FAQ 聊天机器人示例


    这些无非是某个特定商店的客户可能会打电话询问，或者通过访问网站并浏览页面来寻找答案的重复性问题。


    想象一下，当你拥有这样一个聊天机器人时，它能像人类一样在几秒钟内回答你的问题，甚至能做得比你想象的更多。这只是聊天机器人能力的一小部分。


    现在，让我们尝试针对问答机器人来分析前面提到的三个问题及其答案。


    • 这个问题能否通过简单的问答或来回沟通来解决？

    是的，FAQ 无非就是一些常见问题及其相关答案。可能存在基于上下文的 FAQ，但除非你使用聊天机器人解决多领域问题，否则你不会遇到这个问题。可能会出现两个或多个问题看起来相似的情况，但你总是可以设计机器人在有疑问时向用户反问一个问题。


    • 它是否包含需要分析或获取数据的高度重复性问题？

    是的，FAQ 要求我们从数据库中获取数据，并在网站上一次性显示出来，或者可能动态显示。但用户必须逐一浏览所有问题，才能找到他/她正在寻找的问题，然后查看其答案。在用户真正得到答案之前，需要大量浏览用户界面……或者也许不需要。为什么不让我们机器人来做这件事呢？


    • 你的机器人任务能否被自动化并固定下来？

    是的，一个 FAQ 机器人需要获取问题、分析问题、从数据库中提取信息，并将其返回给用户。这里没有任何事情是无法通过编码完成的。而且，这个过程基本上是固定的，不会实时变化。


    开始构建聊天机器人

    在构建聊天机器人之前，应该遵循三个步骤。


    我们在此简要讨论每一个步骤。


    思考你希望聊天机器人能够处理的所有场景或任务，并收集所有可以用于执行这些任务的不同形式的相关问题。你希望聊天机器人执行的每一个任务都会定义一个意图。你列出的每个问题或意图都可以用多种方式表示。这取决于用户如何表达它。


    例如：

    Alexa，关灯。

    Alexa，请你关一下灯好吗？

    你能关一下灯吗？

    用户可能会使用这些句子中的任何一个来指示机器人关灯。所有这些句子都有相同的意图/任务——关灯，但它们是以不同的方式被提出的。


    在你识别出用户的意图后，编写所有逻辑，将用户引导到你已选择的流程中。


    例如，假设你正在构建一个用于预约医生的机器人。那么你要求用户提供电话号码、姓名和专科医生，然后你显示可预约的时间段，最后进行预约。


    在这种情况下，你可以期望用户知道这些细节，并且不要试图在机器人本身中容纳所有事情，比如耳朵问题的专科医生被称为耳鼻喉科医生。然而，做到这一点并非难事。所以，这又回到了决定机器人范围的问题上，这取决于你构建应用程序所拥有的时间和资源。


    聊天机器人中的决策树

    如果你了解决策树，那非常好，因为在设计聊天机器人的流程时，你会经常用到这个知识。但如果你不了解决策树，只需谷歌一下就能帮助你学习这个在计算机科学中广泛使用的简单概念。


    在聊天机器人中使用决策树

    在聊天机器人的上下文中，决策树只是帮助我们找到用户问题的确切答案。


    决策树是一种决策支持工具，它使用树状图或模型来表示决策及其可能的结果，包括偶然事件的结果、资源成本和效用。它是展示仅包含条件控制语句的算法的一种方式。


    ——维基百科


    构建聊天机器人时最困难的部分是跟踪 `if...else` 代码块。需要做出的决策越多，代码中 `if...else` 出现的频率就越高。但同时，这些代码块是编码复杂对话流程所必需的。如果问题很复杂，并且在现实生活中需要大量的
    `if...else`，那么代码也需要以同样的方式进行调整。


    决策树如何提供帮助？


    决策树易于编写和理解，但它们是对所讨论问题的解决方案的有力表示。它们具有独特的能力，可以帮助我们理解很多事情。


    • 帮助构建当前问题的完整图景。查看决策树，我们可以轻松理解缺少什么或需要修改什么。

    • 帮助更快地进行调试。

    '
- fmt: "决策树就像一本简短的圣经，或者说，是软件需求规格说明文档的可视化表示。开发人员、产品经理或领导层可以引用它来解释预期行为，或在需要时进行任何更改。\n\
    \n人工智能尚未达到能够通过大量数据训练并以100%准确率执行的阶段。它仍然需要大量通过编写业务逻辑和规则来进行的人工干预。在让机器学习和执行变得有些困难的地方，决策树就能派上用场。\n\
    \n让我们通过一个简单的例子来理解它如何帮助构建聊天机器人。查看一个聊天机器人的示例图，它首先询问用户是在找T恤还是牛仔裤，然后根据输入，流程图通过提出更多问题，进一步提供与产品相关的选项。你不需要创建一个完整的决策树，但在开始构建聊天机器人之前，你绝对应该在每一步都定义好问题流程。\n\
    \n假设你正在构建一个类似的、帮助人们在线购买服装的聊天机器人。你要做的第一件事就是制作一个类似的决策树或流程图，以帮助你的聊天机器人在正确的时间提出恰当的问题。这对于设定每一步的范围以及在该阶段需要完成的任务至关重要。当你实际编写第一个聊天机器人的代码时，你将需要状态图或一个简单的流程图。请记住，在创建像图1-7这样的图表时，不要过于严格；尽可能保持简单，然后再添加扩展功能。这种流程的好处是开发时间将会缩短，并且后续功能将是松散耦合的，并开始作为组件变得有意义。就像在示例中，在创建了基本功能之后，你还可以添加颜色选择、价格范围、评级和折扣选项。\n\
    \n![image-ze30fr6z.png]\n\n图1-7. 一个用于在线购买服装的服装聊天机器人的简单表示\n\n根据你的需求，你肯定可以在之前的用例中添加更多内容。但你必须确保不要让自己和用户都感到过于复杂。\n\
    \n决策树不仅有助于让用户遵循流程，而且是一种非常有效的方法，可以识别客户可能以问题形式提出的下一个意图。\n\n因此，你的机器人将按照你构建的决策树提出一系列问题。每个节点通过聊天机器人的意图来缩小客户的目标范围。\n\
    \n假设你正在为一家金融机构（比如银行）创建一个聊天机器人，它可以在身份验证后根据你的请求进行转账。在这种情况下，你的机器人可能首先想要验证账户详细信息，并要求用户确认金额，然后机器人可能会要求验证目标账户名称、账号、账户类型等。\n\
    \n除非你已经验证了用户的账户余额大于请求金额，否则你不能也不应该调用`OTP`（一次性密码）API。\n\n我们所有人以及客户都会遇到这种情况。当他们的提问没有得到正确回答时，他们会感到沮丧。为你的聊天机器人使用决策树，肯定会比不使用它们时为用户带来更好的体验。\n\
    \n很多时候，你会发现通过编程方式解决某些意图会遇到问题。所以，底线是，如果你无法通过编程方式解决某些问题，那就通过设计来解决它。\n\n查看图1-8，其中机器人正在尝试进行健康测验，并想知道抗生素是否对所有疾病都有效。\n\
    \n![image-slqbaqob.png]\n\n图1-8. 通过设计解决用例的示例\n\n由于预期答案是布尔值（`True`/`False`），你只需给用户提供两个按钮供其点击，而不是让他们输入并等待纠正他们的错误。\n\
    \n这是通过设计来解决，而不是编写大量代码来处理意外的用户输入。在构建聊天机器人时，你会遇到很多场景，只需提供按钮，你就能快速了解用户的意图。理解这些场景并为用户提供按钮很重要，这既是为了你自己的方便，也是为了那些在明显可选答案的情况下无需输入的用户。\n\
    \n最佳聊天机器人/机器人框架\n\n*   `https://woebot.io/`\n    *   可以追踪你的情绪\n    *   帮助你感觉更好\n\
    \    *   通过观察你的情绪模式为你提供见解\n    *   教你如何保持积极和精力充沛\n*   `https://qnamaker.ai/`\n\
    \    *   在几分钟内基于常见问题解答、URL和结构化文档构建、训练和发布一个简单的问答机器人。\n    *   使用熟悉的聊天界面测试和完善回复。\n\
    *   `https://dialogflow.com/`\n    *   以前被称为`api.ai`，在聊天机器人爱好者中广受欢迎。\n    *  \
    \ 通过构建由人工智能驱动的、引人入胜的语音和文本对话界面，为用户提供与你的产品互动的新方式。\n    *   在Google Assistant、Amazon\
    \ Alexa、Facebook Messenger和其他流行平台和设备上与用户连接。\n    *   分析并理解用户的意图，以帮助你以最有用的方式做出回应。\n\
    *   `https://core.rasa.ai`\n    *   一个用于构建对话式软件的框架。\n    *   你可以用Python代码实现你的机器人可以执行的操作。\n\
    \    *   你的机器人的逻辑不是基于一堆`if...else`语句，而是基于在示例对话上训练的概率模型。\n*   `https://wit.ai`\n\
    \    *   `Wit.ai`使开发人员能够轻松构建你可以与之对话或发短信的应用程序和设备。\n    *   在推出后21个月内被Facebook收购，`wit.ai`团队为Facebook内部的自然语言处理引擎做出了贡献。\n\
    \    *   你可以使用`wit.ai`来构建聊天机器人、家庭自动化等。\n    *   `Wit.ai`的工作方式与`Dialogflow`类似，但功能不如`Dialogflow`丰富。"
  raw: 'Decision trees are like a short bible or, say, a visual representation of
    a software requirement specification   document, which can be referred by developers,
    product managers, or leadership to explain the expected behavior or make any changes
    if needed.   •  AI is still not at that stage that it can be trained with lots
    of data and perform with 100 percent accuracy. It still requires a lot of hand-
    holding by writing business logic and rules. Decision trees help wherever it becomes
    a little tough to ask a machine to learn and do it.    Let’s take a simple example
    and try to understand how it helps in building chatbots. Look at the example diagram
    for a chatbot that starts with a question of whether the user is looking for a
    t-shirt or jeans, and based on the input the diagram flow goes further to give
    options related to the product by asking more questions. You don’t need to create
    a full-fledged decision tree, but you should definitely have a flow of questions
    defined at every step before starting to build chatbots.   Suppose you were building
    a similar chatbot that helps people buy apparel online. The first thing you would
    do is to make a similar decision tree or a flowchart to help your chatbot ask
    appropriate questions at the right time. This is really needed to set the scope
    of each step and what needs to be done at that stage. You will need the state
    diagrams   or a simple flowchart later when you actually code your first chatbot.
    Remember to not be too stringent while creating a diagram like Figure 1-7; keep
    it as simple as possible and then add the extended functionalities later. The
    benefit of such a process is the development time will be cut down, and later
    on the functionality will be loosely coupled and would start making sense as components.
    Like in the example, after creating the basic functionality, you can add color
    choices, price range, ratings, and discount options as well. ![](image-ze30fr6z.png) 
    Figure 1-7. A simple representation of an apparel chatbot for buying clothes online
      There are definitely more things you can add to the earlier use-case depending
    upon your requirements. But you have to make sure that you don’t make it too complex
    for yourself as well as for the user.   A decision tree not only helps you to
    keep the user tied to the flow but also is a very effective way to identify the
    next intent that might be coming in the form of a question from the customer.
      So, your bot will ask a series of questions following the decision tree that
    you have built. Each node narrows down on the customer’s goal through chatbot
    intents.   Suppose you were creating a chatbot for a financial institution—say,
    a bank—that can do a money transfer based on your request after authentication.
    In this case, your bot may first want to verify the account details and ask the
    user to confirm the amount, and then the bot may ask to validate target account
    name, account number, account type, etc.


    You cannot or would not want to invoke an OTP (one-time password) API unless you
    have validated if the user’s account balance is more than the requested amount.
      It happens with all of us and with customers as well. They get frustrated when
    their questions are not answered correctly. Using decision trees for your chatbot
    will definitely make the experience better for your users than it would be if
    your didn’t use them.   Lots of times you will find issues solving some intents
    programmatically. So, the bottom line is, you can’t solve something programmatically
    then solve it by design.”   Look at Figure 1-8 where the bot is trying to take
    a health quiz and wants to know if antibiotics can work for everything.  ![](image-slqbaqob.png) 
    Figure 1-8. Example of solving a use-case by design   Since the answer is expected
    to be a Boolean (True/False), you give just two buttons for the user to click
    instead of letting them type and wait to fix their mistake.   This is solving
    by design rather than writing lots of code that will be handling unexpected user
    inputs. You will have so many scenarios while building the chatbots where by just
    giving buttons, you will be able to quickly know the intent of the user. It’s
    important to understand such scenarios and provide buttons both for your own convenience
    as well as for users who don’t need to type in obvious cases of optional answers.The
    Best Chatbots/Bot Frameworks   •  https://woebot.io/   •  Can track your mood
      •  Helps you feel better   •  Gives you insights by seeing your mood pattern
      •  Teaches you how to be positive and high-energy   •  https://qnamaker.ai/
      •  Build, train, and publish a simple question-and-answer bot based on FAQ,
    URLs, and structured documents in minutes.   •  Test and refine responses using
    a familiar chat interface.   •  https://dialogflow.com/   •  Formerly known as
    api.ai and widely popular among chatbot enthusiasts.   •  Give users new ways
    to interact with your product by building engaging voice-and text-based conversational
    interfaces powered by AI.   •  Connect with users on the Google Assistant, Amazon
    Alexa, Facebook Messenger, and other popular platforms and devices.   •  Analyzes
    and understands the user’s intent to help you respond in the most useful way.
      •  https://core.rasa.ai   •  A framework for building conversational software
      •  You can implement the actions your bot can take in Python code.   •  Rather
    than a bunch of if...else statements, the logic of your bot is based on a probabilistic
    model trained on example conversations.    •  https://wit.ai   •  Wit.ai makes
    it easy for developers to build applications and devices that you can talk or
    text to.   •  Acquired by Facebook within 21 months of its launch, wit.ai team
    contributes toward Facebook’s own NLP engine inside Facebook.   •  You can use
    wit.ai for building chatbots, home automation, etc.   •  Wit.ai is similar to
    the way Dialogflow works but is not as feature- rich as Dialogflow.'
