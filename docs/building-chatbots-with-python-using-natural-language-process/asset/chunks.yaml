  trans: "\n两者得出的结果相同，都是“fastest”，但当我们使用 spaCy 的方法进行词形还原时，它给出的“fastest”的词干是“fast”，这更有意义且更正确。\
    \  \nfrom nltk.stem.porter import *  \nfrom nltk.stem.snowball import SnowballStemmer\
    \  \nporter_stemmer = PorterStemmer()  \nsnowball_stemmer = SnowballStemmer(\"\
    english\")  \n\nfastest fastest  \n![](img/image-2wwgueqv.png)  \n在尝试运行此代码之前，请务必使用\
    \ pip3 安装 nltk 包。  \n![](img/image-b5592gcd.png)  \n既然你已经很清楚词干提取或词形还原在自然语言处理中的作用，那么你应该能够理解，每当遇到需要单词词根形式的情况时，就需要进行词形还原。例如，它常用于构建搜索引擎。你一定好奇过，即使搜索文本表述不规范，谷歌是如何在搜索结果中给出你想要的文章的。\
    \  \n\n这正是词形还原发挥作用的地方。想象一下，你用文本“will the next season of Game of Thrones be”进行搜索。\
    \  \n现在，假设搜索引擎只是通过简单的文档词频匹配来提供搜索结果。在这种情况下，上述查询很可能无法匹配到标题为“Thrones next season\
    \ release date”的文章。  \n\n如果在将输入与文档匹配之前，先对原始问题进行词形还原，那么我们可能会得到更好的结果。  \n我们将在后续章节中尝试验证这一理论。\
    \  \n\n命名实体识别  \n\n命名实体识别，也称为实体识别或实体抽取，是一个在给定文本中查找命名实体并将其分类到预定义类别的过程。  \n\nNER\
    \ 任务在很大程度上依赖于用于训练命名实体提取算法的知识库，因此其效果可能因训练所用的数据集而异。  \n\nspaCy 自带一个非常快速的实体识别模型，能够从给定文档中识别出实体短语。实体可以是不同类型，例如人物、地点、组织、日期、数字等。这些实体可以通过\
    \  \ndoc 对象的 `.ents` 属性进行访问。  \n\n让我们借助 spaCy 强大的 NER 标注功能，通过一些示例来尝试查找命名实体。  \n\
    \n示例 1：  \n\nmy_string = u\"Google has its headquarters in Mountain View, California\
    \ having  \nrevenue amounted to 109.65 billion US dollars\"  \ndoc = nlp(my_string)\
    \  \nfor ent in doc.ents: print(ent.text, ent.label_)  \n输出：  \n\n('Google', 'ORG')\
    \  \n('Mountain View', 'GPE')  \n('California', 'GPE')  \n('109.65 billion US\
    \ dollars', 'MONEY')  \n\n我们可以看到，spaCy 模型能够多么出色且自动地识别出单词“Google”是一个组织，“Mountain\
    \ View”和“California”是地缘政治实体，并且在给定的句子中，我们谈论的是 1096.5 亿美元，这实际上与金钱有关。  \n\n让我们尝试探索更多示例。\
    \  \n\n示例 2：  \n\nmy_string = u\"Mark Zuckerberg born May 14, 1984 in New York\
    \ is an American technology entrepreneur and philanthropist best known for co-founding\
    \ and leading Facebook as its chairman and CEO.\"  \ndoc = nlp(my_string)  \n\
    for ent in doc.ents: print(ent.text, ent.label_)  \n输出：  \n\n('Mark Zuckerberg',\
    \ 'PERSON')  \n('May 14, 1984', 'DATE')  \n('New York', 'GPE')  \n('American',\
    \ 'NORP')  \n('Facebook', 'ORG')  \n\n示例 3：  \n\nmy_string = u\"I usually wake\
    \ up at 9:00 AM. 90% of my daytime goes in learning new things.\"  \ndoc = nlp(my_string)\
    \ for ent in doc.ents:  \nprint(ent.text, ent.label_)  \n输出：  \n\n('9:00 AM',\
    \ 'TIME')  \n('90%', 'PERCENT')  \n\n如你所见，实体提取器可以轻松地从给定字符串中提取时间信息。同时，你还可以看到实体提取器不仅试图识别数字，还能识别出确切的百分比值。\
    \  \n\n根据 spaCy 的文档，在 OntoNotes 语料库上训练的模型支持以下实体类型。  \n![](img/image-vqesjz8o.png)\
    \  \n类型  描述  \n![](img/image-6pqq9ss9.png)  \n包括虚构的  \n或宗教或政治团体  \n机场、高速公路、桥梁等。\
    \  \n机构、组织等。  \n城市、州  \n地点、山脉、水域  \n车辆、食物等（不包括服务）  \n飓风、战役、战争、体育赛事等。  \n书籍、歌曲等。\
    \  \n已制定为法律的文件  \n已命名的语言  \n或相对日期或时间段  \n小于一天的时间  \n包括“%”  \n数值，包括重量或距离的单位  \n\
    “第一”、“第二”等。  \n![](img/image-4a4rgtio.png)  \n不属于其他类型的实体  \n![](img/image-ml6ege4k.png)\
    \  \n\n每当我们打算构建一个对话代理或聊天机器人（简单来说）时，我们心中总会有一个领域。例如，我们希望聊天机器人能够预约医生、订餐、支付账单、填写银行申请表、处理电子商务等。聊天机器人也可能解决这些问题的组合。通过找出问题中的实体，我们可以大致了解提出问题的上下文。\
    \  \n\n让我们通过两个包含相似词语但含义不同的句子示例来理解这一点。  \n\nmy_string1 = u\"Imagine Dragons are\
    \ the best band.\"  \nmy_string2 = u\"Imagine dragons come and take over the city.\"\
    \  \n\ndoc1 = nlp(my_string1)  \ndoc2 = nlp(my_string2)  \n\nfor ent in doc1.ents:\
    \ print(ent.text, ent.label_)  \n\n上述对 doc1 对象的 for 循环输出：  \n\n('Imagine Dragons',\
    \ 'ORG')  \n\n很厉害，不是吗？当你意识到实体识别器在字符串中未识别出任何实体时，这会变得更加有趣。运行以下代码，doc2 不会产生任何输出。\
    \  \n\nfor ent in doc2.ents: print(ent.text, ent.label_)  \n\n现在，想象一下你需要在实时环境中提取上述两个字符串的上下文。你会怎么做？借助实体，可以轻松判断语句的上下文，并智能地推动对话继续进行。\
    \  \n"
- fmt: "# Stop Words\n\nStop words are words like `a`, `to` and `also` that we sometimes\
    \ want to filter out of a document before further processing. Stop words usually\
    \ have little lexical content and do not hold much of a meaning. Below is a list\
    \ of 25 semantically non-selective stop words that are common in Reuters-RCV1:\
    \ `a`, `an`, `and`, `are`, `as`, `at`, `be`, `by`, `for`, `from`, `has`, `he`,\
    \ `in`, `is`, `it`, `its`, `of`, `on`, `that`, `the`, `to`, `was`, `were`, `will`,\
    \ `with`.\n\nLet’s get into some code and try to understand how things work.\n\
    \nTo see all the words defined as stop words in spaCy you can run the following\
    \ lines of code:\n\n```\nfrom spacy.lang.en.stop_words import STOP_WORDS\nprint(STOP_WORDS)\n\
    ```\n\nYou should see something like:\n\n```\nset(['all', 'six', 'just', 'less',\
    \ 'being', 'indeed', 'over', 'move',\n'anyway', 'fifty', 'four', 'not', 'own',\
    \ 'through', 'using', 'go', 'only', 'its', 'before', 'one', 'whose', 'how',\n\
    ..........................................................................\n.........................................................................\n\
    ...........................................................................\n\
    ........................................................................\n'whereby',\
    \ 'third', 'i', 'whole', 'noone', 'sometimes', 'well', 'together',\n'yours', 'their',\
    \ 'rather', 'without', 'so', 'five', 'the', 'otherwise', 'make', 'once'])\n```\n\
    \nThere are about 305 stop words defined in spaCy’s stop words list. You can always\
    \ define your own stop words if needed and override the existing list.\n\nTo see\
    \ if a word is a stop word or not, you can use the `nlp` object of spaCy. We can\
    \ use the `nlp` object’s `is_stop` attribute.\n\n**Example 1:**\n\n```\nnlp.vocab[u'is'].is_stop\n\
    ```\n\n**Output:**\n\n```\nTrue\n```\n\n```\nnlp.vocab[u'hello'].is_stop\n```\n\
    \n**Output:**\n\n```\nFalse\n```\n\n**Example 3:**\n\n```\nnlp.vocab[u'with'].is_stop\n\
    ```\n\n**Output:**\n\n```\nTrue\n```\n\nStop words are a very important part of\
    \ text clean up. It helps removal of meaningless data before we try to do actual\
    \ processing to make sense of the text.\n\nSuppose you are in a situation where\
    \ you are building a bot to make people happy by assessing their mood. Now, one\
    \ needs to analyze the sentiment in the text input by the user so that correct\
    \ response can be formulated. Here, before begging to do basic sentiment analysis,\
    \ we should remove the noise in the data that exists in the form of stop words.\n\
    \n# Dependency Parsing\n\nDependency parsing is one of the more beautiful and\
    \ powerful features of spaCy that is fast and accurate. The parser can also be\
    \ used for sentence boundary detection and lets you iterate over base noun phrases,\
    \ or “chunks.”\n\nThis feature of spaCy gives you a parsed tree that explains\
    \ the parent-child relationship between the words or phrases and is independent\
    \ of the order in which words occur.\n\nLet’s take an example where you have to\
    \ parse the following sentence:\n\n`Book me a flight from Bangalore to Goa`\n\n\
    **Example 1:**\n\n```\ndoc = nlp(u'Book me a flight from Bangalore to Goa')\n\
    blr, goa = doc[5], doc[7]\n```\n\n```\nlist(blr.ancestors)\n```\n\n**Output:**\n\
    \n```\n[from, flight, Book]\n```\n\nThe above output can tell us that user is\
    \ looking to book the flight from Bangalore. Let’s try to list the ancestors of\
    \ `goa.ancestors` object:\n\n```\nlist(goa.ancestors)\n```\n\n**Output:**\n\n\
    ```\n[to, flight, Book]\n```\n\nThis output can tell us that the user is looking\
    \ to book the flight to Goa.\n\n## What Are Ancestors in Dependency Parsing?\n\
    \nAncestors are the rightmost token of this token’s syntactic descendants. Like\
    \ in the above example for the object `blr` the ancestors were `from`, `flight`,\
    \ and `Book`.\n\nRemember you can always list the ancestors of a `doc` object\
    \ item using `ancestors` attribute.\n\n```\nlist(doc[4].ancestors) #doc[4]==flight\n\
    ```\n\nThe above code will output:\n\n```\n[flight, Book]\n```\n\nTo check if\
    \ a `doc` object item is an ancestor of another `doc` object item programmatically,\
    \ we can do the following:\n\n```\ndoc[3].is_ancestor(doc[5])\n```\n\nThe above\
    \ returns `True` because `doc[3]` (i.e., `flight`) is an ancestor of `doc[5]`\
    \ (i.e., `Bangalore`). You can try more examples like this to get a better understanding\
    \ of dependency parsing and the ancestors concept.\n\nIf we try to think of a\
    \ real-world scenario that we might actually face while trying to build a chatbot,\
    \ we may come across some sentence like:\n\n`I want to book a cab to the hotel\
    \ and a table at a restaurant.`\n\nIn this sentence, it’s important to know what\
    \ tasks are requested and where they are targeted (i.e., whether the user wants\
    \ to book a cab to the hotel or the restaurant).\n\nLet’s try to do that using\
    \ the following code:\n\n**Example 1:**\n\n```\ndoc = nlp(u'Book a table at the\
    \ restaurant and the taxi to the hotel')\ntasks = doc[2], doc[8] #(table, taxi)\n\
    tasks_target = doc[5], doc[11] #(restaurant, hotel)\n\nfor task in tasks_target:\n\
    \    for tok in task.ancestors:\n        if tok in tasks:\n            print(\"\
    Booking of {} belongs to {}\".format(tok, task))\n            break\n```\n\n**Output:**\n\
    \n```\nBooking of table belongs to restaurant\nBooking of taxi belongs to hotel\n\
    ```\n\n## What Are Children in Dependency Parsing?\n\nChildren are immediate syntactic\
    \ dependents of the token. We can see the children of a word by using `children`\
    \ attribute just like we used `ancestors`.\n\n```\nlist(doc[3].children)\n```\n\
    \nwill output:\n\n```\n[a, from, to]\n```\n\n## Interactive Visualization for\
    \ Dependency Parsing\n\nIt’s very difficult to understand the complete dependency\
    \ parsing concept for the first time. spaCy gives an extremely easy and interactive\
    \ way to understand its dependency parsing. spaCy v2.0+ has a visualization module\
    \ where we can pass a `Doc` or a list of `Doc` objects to `displaCy` and call\
    \ `serve` method of `displaCy` to run the web server.\n\nFigure 2-5 shows how\
    \ the interactive visualization will look for dependency parsing.\n\n![](image-cdxz1g76.png)\n\
    \n*Figure 2-5. Interactive visualization for dependency parsing*\n\nYou can also\
    \ generate the dependency parsing visualization in Figure 2-5. To create a visualization\
    \ like this, run the following code and then go to `http://localhost:5000` in\
    \ your browser.\n\nLet’s try to do the visualization of our example of tasks and\
    \ the target of the tasks."
