    True  ![](img/image-hgge6eze.png)  ––––––––   现在，我们的机器人已经理解了意图并解析了其中的实体，是时候回复用户说“您已成功订阅”了，太棒了——我们收到了机器人的消息：
      您已成功订阅   就是这样！你可以成功地自己构建一个内部聊天机器人。作为练习的一部分，我建议你添加我们为 HoroscopeBot 讨论过的所有用例，看看它是否有效。当我们到目前为止所做的一切都运行良好时，尝试添加更多的用例和功能。
