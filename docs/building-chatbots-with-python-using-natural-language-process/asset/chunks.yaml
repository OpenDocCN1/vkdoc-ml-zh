    ## Testing the Bot


    Testing the bot is a part of our interactive learning process. We keep checking
    all the possible scenarios initially thought for the bot and train it accordingly.
    I tested Horoscope Bot for some other scenarios and trained it accordingly. The
    following is one of them that is a bit different than what we did earlier in this
    chapter.


    ### Test Case 1


    Let’s run the first test:


    User: Hello there!


    HoroscopeBot: Hello! What can I do for you?


    User: What’s the horoscope for Capricorn today?


    HoroscopeBot: Your today’s horoscope: The journey from defeat to success is driven
    by optimism. You will be very optimistic today—about your work, future, and everything
    that can lead you to success, says Ganesha. You will also be very careful while
    dealing with day-to-day work, and will capitalize on every opportunity that can
    get you a step closer to your goals. Determination and good luck is all you need
    to realize your dreams; you will have both today.


    HoroscopeBot: Do you want to subscribe for daily updates?


    User: Please subscribe me.


    HoroscopeBot: You’re successfully subscribed.


    As you can see in this conversation between the user and the chatbot, we tested
    if the bot handles the scenario where the user himself provides the `horoscope_sign`
    while asking for the horoscope for the day itself. The bot does well in this case
    and ends up asking for a subscription and, based on the user response, takes appropriate
    action.


    You should do a sanity testing of the bot’s conversation to determine if normal
    flow is working or not.


    I also tested the story we mentioned in our `stories.md` file when a user directly
    asked for a subscription and it worked as well.


    ### Test Case 2


    Now the second:


    User: Hi


    HoroscopeBot: Hello! What can I do for you?


    User: Subscribe me please for daily updates.


    HoroscopeBot: You’re successfully subscribed.


    I will be adding a couple of more new stories as well so that the bot works flawlessly.


    But as of now we have a fully working bot. In the second version of the code on
    github you will also find the bot to be correcting the spelling mistakes for horoscope
    sign, retrieving horoscope sign based on user’s DOB, saying a goodbye message,
    etc. I strongly recommend you check the code on how it is done and provide your
    feedback. But before that, give a thought to how it’ll be done and where the changes
    will go. We have knowingly not mentioned the code for the other use-cases in this
    chapter, so that it doesn’t become fussy while you are concentrating on learning
    the tricks of the trade.


    You can download the latest Python code and Jupyter Notebooks from our github
    repo and try to install the correct packages to run it. You will find more use-cases
    handled in the code as discussed in this chapter.


    ## Summary


    In this chapter, we learned about Rasa-NLU and why Rasa-NLU is better than any
    other open-source tool available on the market. We learned how to configure pipelines
    by using `tensorflow`, `sklearn`, and `keras` in our pipeline configurations.


    We learned to create everything from scratch on our local system without being
    dependent on any services requiring you to use their APIs, like Dialogflow, `wit.ai`,
    etc. We also learned how to create stories and how to train an NLU model and a
    dialog model and use them both using Rasa Core to build a bot by training using
    the coolest feature, interactive learning. We also got a fair idea of how to create
    training data easily and annotate that easily with help of the open-source tools
    like `rasa-nlu-trainer`. I hope this chapter was more interactive for you than
    any other chapter. If you are not having a feeling of achievement, then brace
    yourself for the next chapter, where we’ll be actually taking it live to our audiences
    and showing the world what bots are capable of. We’ll be learning to integrate
    the chatbot from this chapter to various platforms like Facebook and Slack using
    our own web servers.


    Keep training your bot until in the next chapter we take it live. See you in the
    next chapter.


    # CHAPTER 5 – Deploying Your Chatbot


    In this chapter we’ll learn how to deploy our chatbots on the web. There are various
    ways and channels through which one can deploy or expose their chatbot web application
    to the outside world. For an example, we can expose our HoroscopeBot with NLU
    and dialog model on Facebook and Slack as they provide you a user interface already.
    You may also want to have your own web app that exactly runs on your own server.
    We will also explore how to deploy a chatbot on our own servers using our own
    user interface by the end of this chapter.


    ## First Steps


    The first step is to create a copy of your existing chatbot you built in Chapter
    4 and make a new copy so that you have a backup with you.'
