      You should see something like:   set([''all'', ''six'', ''just'', ''less'',
    ''being'', ''indeed'', ''over'', ''move'',   ''anyway'', ''fifty'', ''four'',
    ''not'', ''own'', ''through'', ''using'', ''go'', ''only'', ''its'', ''before'',
    ''one'', ''whose'', ''how'',   ..........................................................................
      .........................................................................  
    ...........................................................................  
    ........................................................................   ''whereby'',
    ''third'', ''i'', ''whole'', ''noone'', ''sometimes'', ''well'', ''together'',
      ''yours'', ''their'', ''rather'', ''without'', ''so'', ''five'', ''the'', ''otherwise'',
    ''make'', ''once''])   There are about 305 stop words defined in spaCy’s stop
    words list. You can always define your own stop words if needed and override the
    existing list.   To see if a word is a stop word or not, you can use the nlp object
    of spaCy. We can use   the nlp object’s is_stop attribute.   Example 1:   nlp.vocab[u''is''].is_stop
      Output:   True  nlp.vocab[u''hello''].is_stop   Output:   False   Example 3:
      nlp.vocab[u''with''].is_stop   Output:   True   Stop words are a very important
    part of text clean up. It helps removal of meaningless data before we try to do
    actual processing to make sense of the text.   Suppose you are in a situation
    where you are building a bot to make people happy by assessing their mood. Now,
    one needs to analyze the sentiment in the text input by the user so that correct
    response can be formulated. Here, before begging to do basic sentiment analysis,
    we should remove the noise in the data that exists in the form of stop words.
      Dependency Parsing   Dependency parsing is one of the more beautiful and powerful
    features of spaCy that is fast and accurate. The parser can also be used for sentence
    boundary detection and lets you iterate over base noun phrases, or “chunks.”  
    This feature of spaCy gives you a parsed tree that explains the parent-child relationship
    between the words or phrases and is independent of the order in which words occur.
      Let’s take an example where you have to parse the following sentence:   Book
    me a flight from Bangalore to Goa   Example 1:   doc = nlp(u''Book me a flight
    from Bangalore to Goa'') blr, goa = doc[5], doc[7]   list(blr.


    ancestors)  Output:   [from, flight, Book]   The above output can tell us that
    user is looking to book the flight from Bangalore. Let’s try to list the ancestors
    of goa.ancestors object:   list(goa.ancestors)   Output:   [to, flight, Book]
      This output can tell us that the user is looking to book the flight to Goa.
      What Are Ancestors in Dependency Parsing?   Ancestors are the rightmost token
    of this token’s syntactic descendants. Like in the above example for the object
    blr the ancestors were from, flight, and Book.   Remember you can always list
    the ancestors of a doc object item using ancestors   attribute.   list(doc[4].ancestors)
    #doc[4]==flight   The above code will output:   [flight, Book]   To check if a
    doc object item is an ancestor of another doc object item programmatically, we
    can do the following:   doc[3].is_ancestor(doc[5])   The above returns True because
    doc[3] (i.e., flight) is an ancestor of doc[5] (i.e., Bangalore). You can try
    more examples like this to get a better understanding of   dependency parsing
    and the ancestors concept.   If we try to think of a real-world scenario that
    we might actually face while trying to build a chatbot, we may come across some
    sentence like   I want to book a cab to the hotel and a table at a restaurant.
      In this sentence, it’s important to know what tasks are requested and where
    they are targeted (i.e., whether the user wants to book a cab to the hotel or
    the   Let’s try to do that using the following code:  Example 1:   doc = nlp(u''Book
    a table at the restaurant and the taxi to the hotel'') tasks = doc[2], doc[8]
    #(table, taxi)   tasks_target = doc[5], doc[11] #(restaurant, hotel)   for task
    in tasks_target:   for tok in task.ancestors: if tok in tasks:   print("Booking
    of {} belongs to {}".format(tok, task))   break   Output:   Booking of table belongs
    to restaurant Booking of taxi belongs to hotel   What Are Children in Dependency
    Parsing?   Children are immediate syntactic dependents of the token. We can see
    the children of a word by using children attribute just like we used   list(doc[3].children)
      will output   [a, from, to]   Interactive Visualization for Dependency Parsing
      It’s very difficult to understand the complete dependency parsing concept for
    the first time. spaCy gives an extremely easy and interactive way to understand
    its dependency   parsing. spaCy v2.0+ has a visualization module where we can
    pass a Doc or a list of Doc   objects to displaCy and call serve method of displaCy
    to run the web server.   Figure 2-5 shows how the interactive visualization will
    look for dependency parsing.   ![](image-cdxz1g76.png)  Figure 2-5. Interactive
    visualization for dependency parsing   You can also generate the dependency parsing
    visualization in Figure 2-5\. To create a visualization like this, run the following
    code and then go to http://localhost:5000 in your browser.   Let’s try to do the
    visualization of our example of tasks and the target of the tasks.'
