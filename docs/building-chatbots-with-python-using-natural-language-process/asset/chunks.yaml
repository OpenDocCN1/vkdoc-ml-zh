  trans: "\n一旦触发任何动作，它就会执行该动作并根据方法给出响应。动作服务器端点的默认端口是 localhost 上的 5055。如果你想更改它，可以在命令行中添加\
    \ `--port` 参数。\n\n一个快速的问题浮现在脑海中：为什么？为什么我需要一个单独的服务器来处理这个？为什么我们不能直接使用纯 Python？是的，我们可以使用纯\
    \ Python，但假设你要用其他语言开发所需的动作，或者你已经有一些以 API 形式暴露的动作。现在，你只需要进入我们已经创建好的 `endpoints.yml`\
    \ 文件，用它来指定你的动作服务器应该从哪里使用，以及你的 `core_endpoint` 服务器应该在哪里。在生产系统中，这两个服务器可以是拥有完全不同\
    \ URL 的不同服务器。\n\n现在，当我们运行下一个脚本（其中引用了我们的 `endpoints.yml` 文件）时，Rasa 将读取该文件并获取我们\
    \ `action_server` 的配置，该服务器已经根据我们之前的配置启动并运行。\n\n```\naction_endpoint:\n  url: http://localhost:5055/webhook\n\
    ```\n\n让我们在一个新的命令行终端中运行 `train_online.py`。\n\n```\n$python3 train_online.py\n\
