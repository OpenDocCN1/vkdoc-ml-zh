  trans: "\n编写聊天机器人的自定义动作  \n众所周知，每当触发一个 UtterAction 时，我们的机器人会根据该动作模板中定义的文本来回复。但当某个自定义动作被触发时会发生什么呢？在本节中，我们将编写\
    \ Python 代码来创建自定义动作，这些动作可用于调用 API 或执行任何 Python 能实现的操作。  \n\n让我们在项目目录（即本例中的`horoscope_bot`文件夹）中创建一个名为`actions.py`的新文件。\
    \  \n\n```python\nfrom __future__ import absolute_import\nfrom __future__ import\
    \ division\nfrom __future__ import print_function\nfrom __future__ import unicode_literals\n\
    \nimport requests\n\nfrom rasa_core_sdk import Action\nfrom rasa_core_sdk.events\
    \ import SlotSet\n\nclass GetTodaysHoroscope(Action):\n    def name(self):\n \
    \       return \"get_todays_horoscope\"\n\n    def run(self, dispatcher, tracker,\
    \ domain):\n        # type: (Dispatcher, DialogueStateTracker, Domain) -> List[Event]\n\
    \        user_horoscope_sign = tracker.get_slot('horoscope_sign')\n        base_url\
    \ = \"http://horoscope-api.herokuapp.com/horoscope/{day}/{sign}\"\n        url\
    \ = base_url.format(**{'day': \"today\", 'sign': user_horoscope_sign})\n     \
    \   # http://horoscope-api.herokuapp.com/horoscope/today/capricorn\n        res\
    \ = requests.get(url)\n        todays_horoscope = res.json()['horoscope']\n  \
    \      response = \"Your today's horoscope:\\n{}\".format(todays_horoscope)\n\
    \        dispatcher.utter_message(response)\n        return [SlotSet(\"horoscope_sign\"\
    , user_horoscope_sign)]\n```\n\n如我们所见，`GetTodaysHoroscope`动作中包含两个方法。第一个方法`name`仅返回动作的名称。另一个方法是`run`，如前所述，它通过执行我们编写的业务逻辑来实际完成任务。\
    \  \n\n在我们的方法中，我们使用了一个代码托管在 GitHub 上的开源 API。该 API 的 URL 格式如下：  \n\n`http://horoscope-api.herokuapp.com/horoscope/today/capricorn`\
    \  \n\n它以 JSON 格式返回数据：  \n\n```json\n{\n    \"date\": \"2018-08-29\",\n    \"\
    horoscope\": \"You will be overpowered with nostalgia and may long to get in touch\
    \ with old pals. And as Ganesha says, chances are that you may take a liking to\
    \ your ex-lover, while simultaneously strengthening your social standing. All\
    \ in all, the day will be a productive one.\",\n    \"sunsign\": \"capricorn\"\
    \n}\n```\n\n正如你在`run`方法中所见，我们将 API 的响应转换为 Python JSON 对象，然后从 JSON 中访问`'horoscope'`键以获取实际运势。获取到\
    \ JSON 中的运势后，我们构建响应，并使用`dispatcher`对象及其`utter_message`方法将其发送回用户。最后，我们使用`SlotSet`方法设置槽位。`SlotSet`类似于保存从用户响应中提取的变量，以便在对话流程中随时在代码中使用它们。\
    \  \n\n![](img/image-p5zdooqk.png)  \n\n**注意**：使用上述 API，只需提供星座标识即可获取今日运势。你可以自由使用自己的\
    \ API 或数据库，只需将 API 调用替换为你想要使用的其他数据源即可。  \n\n![](img/image-ddknj6ax.png)  \n\n\
    就像我们在`actions.py`文件中添加了`GetTodaysHoroscope`动作一样，我们也将添加`SubscribeUser`动作。我们不打算使用数据库来存储用户的订阅偏好，但在为真实用户构建聊天机器人时，你可能需要用户\
    \ ID，以便在数据库中将其与订阅信息关联起来。  \n\n以下是`SubscribeUser`动作的代码：  \n\n```python\nclass SubscribeUser(Action):\n\
    \    def name(self):\n        return \"subscribe_user\"\n\n    def run(self, dispatcher,\
    \ tracker, domain):\n        # type: (Dispatcher, DialogueStateTracker, Domain)\
    \ -> List[Event]\n        subscribe = tracker.get_slot('subscribe')\n        if\
    \ subscribe == \"True\":\n            response = \"You're successfully subscribed\"\
    \n        if subscribe == \"False\":\n            response = \"You're successfully\
    \ unsubscribed\"\n        dispatcher.utter_message(response)\n        return [SlotSet(\"\
    subscribe\", subscribe)]\n```\n\n像这样，我们可以根据需要编写任意数量的自定义动作。  \n\n下一步是数据。Rasa 的对话管理模型是基于用户与聊天机器人之间的实际对话进行训练的。这里的关键点是，这些对话必须转换为故事格式。\
    \  \n\n故事本质上就是用户与聊天机器人之间的实际对话，其中用户输入被转换为意图和实体，而聊天机器人返回的响应则被视为机器人在需要时应触发的动作。  \n\
    \n下表给出了一个示例，展示了用户与聊天机器人之间的真实对话如何以故事形式呈现。  \n\n**场景一**  \n\n![](img/image-2p6f243l.png)\
    \  \n\n| 用户 | HoroscopeBot |\n|------|--------------|\n| hello there! | utter_greet\
    \ |\n| i want to know my horoscope for today | utter_ask_horoscope_sign |\n| My\
    \ sign is Capricorn | actions.gettodayshoroscope |\n| Can you subscribe me for\
    \ updates? | actions.subscribeuser |\n\n**场景二**  \n\n![](img/image-lse3cu7y.png)\
    \  \n\n| 用户 | HoroscopeBot |\n|------|--------------|\n| hello there! | utter_greet\
    \ |\n| i want to know my horoscope for today | utter_ask_horoscope_sign |\n| i\
    \ don’t know my sign | utter_ask_dob |\n| 12-12 | actions.gettodayshoroscope |\n\
    \n我们尚未在代码中处理用户不知道星座但知道出生日期的场景。在这种情况下，我们的代码需要修改，以便在未找到`horoscope_sign`值时获取`DATE`和`MONTH`实体。\
    \  \n\n我们可以使用 DD-MM 值来检查星座，然后显式调用`GetTodaysHoroscope`方法，或者以这种方式训练模型。  \n\n**训练机器人的数据准备**\
    \  \n\n在进行任何机器学习之前，拥有高质量的数据始终很重要。训练聊天机器人也需要数据；用户与聊天机器人之间的对话就是我们训练模型所需的数据。有时，在网络上免费找到适合自己需求的数据集并不容易。\
    \  \n\n我们应该花必要的时间来收集数据。我们可以请朋友和家人提供样本对话文本，展示他们如何与你正在构建的这类机器人互动。有些人会为此创建示例应用程序并众包数据。因此，数据越好，模型越好，聊天机器人的响应也越好。\
    \  \n\n在数据准备方面，Rasa 不遗余力，并提供了一个名为**交互式学习**的酷炫功能。它可以帮助你轻松生成故事数据，并在我们不断添加故事数据的同时训练对话管理模型。你可以称之为实时机器学习训练。因此，随着我们不断添加故事数据，我们可以了解模型是否产生了正确的输出。最重要的是，当我们添加新故事时，我们可以看到模型是在改进还是退化。在大多数情况下，它会变得更好，因为我们实际上是在进行强化学习，告诉机器学习模型忘记并重新学习——这与人类的行为非常相似。\
    \  \n\n**创建故事数据**  \n\n正如我们所知，故事数据只是用户与聊天机器人之间对话的一种表示方式，展示了对话如何导向逻辑终点。通常，所有聊天机器人都旨在帮助用户完成一组预定义的任务；故事只是展示了这些任务是如何完成的。\
    \  \n\n我们将尝试以 Rasa 期望的格式准备一些简单的对话。这些对话将是**无状态的**——也就是说，它们不依赖于之前的对话。我们将使用手工制作的无状态故事进行交互式学习。\
    \  \n\n我们将花几分钟时间手工整理一些我们知道的故事，以便熟悉故事数据的创建方式。  \n\n首先，在我们的`data`文件夹中创建一个名为`stories.md`的文件。\
    \  \n"
- fmt: "# 故事定义与交互学习\n\n## 故事示例\n\n```\n## story_001\n* greeting\n  - utter_greet\n\
    * get_horoscope\n  - utter_ask_horoscope_sign\n* get_horoscope{\"horoscope_sign\"\
    : \"Capricorn\"}\n  - slot{\"horoscope_sign\": \"Aries\"}\n  - get_todays_horoscope\n\
    \  - utter_subscribe\n\n## story_002\n* greeting\n  - utter_greet\n* get_horoscope{\"\
    horoscope_sign\": \"Capricorn\"}\n  - slot{\"horoscope_sign\": \"Cancer\"}\n \
    \ - get_todays_horoscope\n  - utter_subscribe\n* subscription\n  - slot{\"subscribe\"\
    : \"True\"}\n  - subscribe_user\n\n## Horoscope query with horoscope_sign\n* greeting\n\
    \  - utter_greet\n* get_horoscope\n  - utter_ask_horoscope_sign\n* get_horoscope{\"\
    horoscope_sign\": \"capricorn\"}\n  - slot{\"horoscope_sign\": \"capricorn\"}\n\
    \  - get_todays_horoscope\n  - slot{\"horoscope_sign\": \"capricorn\"}\n  - utter_subscribe\n\
    * subscription{\"subscribe\": \"True\"}\n  - slot{\"subscribe\": \"True\"}\n \
    \ - subscribe_user\n  - slot{\"subscribe\": true}\n\n## Horoscope with sign provided\n\
    * greeting\n  - utter_greet\n* get_horoscope{\"horoscope_sign\": \"leo\"}\n  -\
    \ slot{\"horoscope_sign\": \"leo\"}\n  - get_todays_horoscope\n  - slot{\"horoscope_sign\"\
    : \"leo\"}\n  - utter_subscribe\n* subscription{\"subscribe\": \"True\"}\n  -\
    \ slot{\"subscribe\": \"True\"}\n  - subscribe_user\n  - slot{\"subscribe\": true}\n\
    \n## When user directly asks for subscription\n* greeting\n  - utter_greet\n*\
    \ subscription{\"subscribe\": \"True\"}\n  - slot{\"subscribe\": \"True\"}\n \
    \ - subscribe_user\n  - slot{\"subscribe\": true}\n```\n\n如果你盯着这些故事看几分钟，它们会向你坦白它们的含义；理解发生了什么并不困难。前两个故事的主要区别在于：在第一个故事中，用户没有提及他的星座，机器人应该询问星座，然后继续故事。在第二个故事中，用户自己告诉星座，然后以订阅对话结束故事。我们添加了更多故事来覆盖更多用例。欢迎你在同一个文件中添加自己的故事。\n\
    \n基本上，故事是 Markdown 文件，我们可以按照前面展示的 Markdown 格式编写任意数量的故事。手动完成这项任务似乎有点困难。因此，我们将学习如何使用\
    \ Rasa 自己的交互式学习工具来生成更多类似的故事。\n\n让我们开始吧。\n\n## 交互式学习\n\n到目前为止，我们一直在零散地讨论交互式学习，但现在是时候实际编写一些代码并付诸实践了。交互式学习是\
    \ Rasa 最酷的功能之一，它让机器学习部分变得有趣且简单。它分为两部分：第一部分，我们通过使用各种策略提供初始数据集来训练模型；第二部分，我们以交互方式测试模型、纠正模型并重新训练模型。\n\
    \n## 训练聊天机器人代理模型\n\n让我们在主项目目录中创建一个名为`train_initialize.py`的新文件。`train_initialize.py`的内容如下：\n\
    \n```python\nfrom __future__ import absolute_import\nfrom __future__ import division\n\
    from __future__ import print_function\nfrom __future__ import unicode_literals\n\
    \nfrom rasa_core import utils\nfrom rasa_core.agent import Agent\nfrom rasa_core.policies.keras_policy\
    \ import KerasPolicy\nfrom rasa_core.policies.memoization import MemoizationPolicy\n\
    from rasa_core.policies.sklearn_policy import SklearnPolicy\n\nif __name__ ==\
    \ '__main__':\n    utils.configure_colored_logging(loglevel=\"DEBUG\")\n    training_data_file\
    \ = './data/stories.md'\n    model_path = './models/dialogue'\n    agent = Agent(\"\
