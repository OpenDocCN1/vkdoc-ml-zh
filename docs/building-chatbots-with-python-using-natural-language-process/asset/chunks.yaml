- fmt: '# Table of Contents


    - 175 Subscribe to Slack Events

    - 175 Subscribe to Bot Events

    - 176 Post-Deployment Verification: Slack Bot

    - 177 Deploying the Chatbot on Your Own

    - 178 Writing a Script for Your Own Chatbot Channel

    - 179 Writing the `Procfile` and Deploying to the Web

    - 181 Verifying Your Chatbot APIs

    - 181 Creating the Chatbot UI

    - 183 Summary

    - 187 About the Author


    ## About the Author


    Sumit Raj is a techie at heart, who loves coding and building applications. He
    is a Python expert with a keen interest in Machine Learning and Natural Language
    Processing. He believes in the idea of writing code that directly impacts the
    revenue of the company.


    Sumit has worked in multiple domains, such as personal finance management, real
    estate, e-commerce, and revenue analytics, to build multiple scalable applications.
    He has helped various early age startups with their initial design and architecture
    of the product, which was later funded by investors and governments. He comes
    with a good experience of cutting-edge technologies used in high-volume internet/enterprise
    applications for scalability, performance tuning, and optimization and cost-reduction.


    He has been mentoring students/developers on Python programming all across the
    globe. He has mentored over 1000 students and professionals using various online
    and offline platforms and channels on programming languages, data science, and
    for career counseling. Sumit likes to be a part of technical meetups, conferences,
    and workshops. He never likes to miss a chance to attend hackathons. His love
    for building applications and problem solving has won him multiple awards and
    accolades. He is regularly invited to speak at premier educational institutes
    of India. He is also a speaker at PyLadies meetup group, ladies who code in Python,
    which is led by one of the former director of PSF (Python Software Foundation).


    In his free time, he likes to write on his blog and answer questions on computer
    programming, chatbots, Python/Django, career advice, and web development on Quora,
    having over 1 million views together. Feel free to A2A on his Quora profile.


    Currently, Sumit is working as Senior Solutions Architect at GeoSpark R&D in Bangalore,
    India, building a developer platform for location tracking.


    ––––––––


    ## About the Technical Reviewer


    Nitin Solanki has extensive experience in Natural Language Processing, Machine
    Learning, and Artificial Intelligence Chatbot development. He has developed AI
    chatbots in various domains, such as healthcare, e-commerce, education and law
    firms, and more.


    He has experience working on NLP libraries, data mining, data cleansing, feature
    engineering, data analytics and visualization, and machine learning algorithms.
    Nitin loves to make things simple and automated. In his spare time, his mind starts
    chattering about ideas to make money. Therefore, he keeps his mind busy in exploring
    technologies and in writing codes.


    ## Acknowledgments


    This book is an outcome of most sincere hard work that I have done in my career.
    Lots of sleepless nights have gone into the completion of this book. I will be
    grateful to my father and mother for my entire life because they made me who am
    I am today. I want to thank my brother Nitish and sister Prity for always being
    there and sharing the high level of understanding and emotions without being told.


    This acknowledgment can’t be completed without thanking the awesome Apress Team,
    including Nikhil and Divya, who have been so patient and supportive of me from
    the acquisition through the publication of the book. They are the best people
    to work with. Special thanks to Matt for all the guidance I needed for my first
    book and continued feedback at every step to improve the book. Huge thanks to
    Nitin for technically reviewing the book and suggesting the edits.


    ## Introduction


    This book has been written with immense care to keep the teachings from this book
    very pragmatic and results-oriented. Building chatbots is not just about completing
    a tutorial or following a few steps—it’s a skill in itself. This book will certainly
    not bore you with lots of text and process to be read; rather, it takes the learning-by-doing
    approach. You must have used at least one chatbot to do something in your life
    by now. Whether you are a programmer or not, once you go through this book you
    will find the building blocks of chatbots, and all the mysteries will be uncovered.
    Building chatbots may seem difficult from the outside, but this book makes it
    so easy for you. Our brain is not designed to directly process the complex concepts;
    rather, we learn step-by-step. When you are reading this book, from the first
    chapter through the last chapter, you will find how clearly things are progressing.
    Although you can directly go to any chapter, I highly recommend you start from
    the first chapter, as it is bound to bolster your thoughts.


    This book is like a web series where you won’t be able to resist the next chapter
    after completing one. Any chatbot that you interact with after going through this
    book will create a picture in your mind on how that chatbot is designed and built
    internally.


    ## Who This Book Is For


    This book will serve as a great resource for learning the concepts related to
    chatbots and learning how to build them.'
