  trans: "\n拉杰，《构建聊天机器人》——现在，要执行自然语言处理（NLP），或者说自然语言理解（NLU），我们有很多方法，接下来将逐一讨论。你刚才听到了一个新术语“自然语言理解”吗？\
    \  \n简单来说，NLU 是 NLP 这个大概念的一个子集，就像机器学习、深度学习、NLP 和数据挖掘是人工智能（AI）这个大概念的子集一样。AI 是一个总称，泛指任何能执行智能任务的计算机程序。\
    \  \n一个实用的经验法则是：用 NLU 这个术语来表达机器理解人类提供的自然语言形式的能力。  \n现在，回到“构建聊天机器人是否真的需要了解 NLP”这个问题——答案是“既是也不是”。困惑吗？你没听错，并不是说如果你不懂\
    \ NLP 的方法和技术就完全无法构建聊天机器人，但你的能力范围会受到一定限制。你将无法在扩展应用的同时保持代码的整洁。当你的聊天机器人还只能行走和奔跑时，NLP\
    \ 能赋予它飞翔的翅膀。  \n对普通人来说，聊天机器人不过是一种与另一端智能机器交流的方式。这种机器可以是基于语音的，也可以是基于文本的，用户会用自己的语言提供输入，在计算机科学中，这种语言通常被称为自然语言。\
    \  \n我们知道，并没有什么黑箱能凭空施展魔法，让一切完美运行。大家应该明白，AI 中并没有什么“人工”的智能；实际上，幕后运行的是由杰出人士编写的机器学习和深度学习算法。机器尚未达到能像人类一样思考并拥有自身智能的阶段。如今的\
    \ AI 系统——它们的行为和表现方式——都是我们如何训练它们的结果。  \n因此，为了理解用户的自然语言（无论是什么语言，也无论输入形式是文本、语音还是图像等），我们必须编写算法并运用\
    \ NLP 技术。NLP 被视为聊天机器人的大脑，它处理原始数据，进行数据清洗和整理，然后准备采取适当的行动。  \nNLP 本身是一个庞大的主题，需要时间和毅力才能完全掌握，但作为聊天机器人开发者，有一些方法是必须了解的，我们将在本章中学习这些方法。\
    \  \n\n### 什么是 spaCy？\n\nspaCy 是一个用于高级 NLP 的开源软件库，由 Matthew Honnibal 用 Python\
    \ 和 Cython 编写。它提供了直观的 API，用于访问由深度学习模型训练出的方法。  \nspaCy 提供了世界上最快的句法解析器。直接引用 spaCy\
    \ 的文档，他们有一些令人惊叹的基准测试结果，如下所示。  \n\n#### spaCy 的基准测试结果\n\n2015 年的两篇同行评审论文证实，spaCy\
    \ 提供了世界上最快的句法解析器，并且其准确率与最佳可用方案相差不到 1%。  \n少数更准确的系统速度则慢了 20 倍甚至更多。让我们看看图 2-1，它展示了\
    \ spaCy 与其他库在速度和准确率方面的基准测试结果。  \n\n![](img/image-u7ymy8ji.png)  \n\n**图 2-1. spaCy\
    \ 基准测试结果**  \n\nspaCy 还为多种语言提供了统计神经网络模型，例如英语、德语、西班牙语、葡萄牙语、法语、意大利语、荷兰语以及多语言命名实体识别（NER）。它还为其他多种语言提供了分词功能。此表显示了由\
    \ Choi 等人进行的速度基准测试，因此将 spaCy v2.x 在不同硬件上的基准测试结果进行对比并不公平。这就是为什么你看不到 spaCy v2.x\
    \ 的速度列数值。  \n\n### spaCy 提供了什么？\n\nspaCy 声称主要提供三项功能，并且在这些方面极具帮助。让我们来看看这些功能，并理解为什么人们应该将\
    \ spaCy 作为进行 NLP 的首选模块。  \n\n#### 世界上最快的库\n\nspaCy 在提取大规模信息方面表现极为出色。它借助 Cython\
    \ 库，从零开始编写，对内存管理极为谨慎。  \n\n#### 完成任务\n\nspaCy 的设计理念是“完成任务”。它帮助我们实现真实的 NLP 场景。清晰的文档为开发者和计算语言学爱好者节省了大量时间，并提高了他们的工作效率。它安装起来就像其他\
    \ Python 包一样简单。  \n\n#### 深度学习\n\nspaCy 是开源社区中可用于处理深度学习算法文本的最佳库之一。它与 TensorFlow、PyTorch、scikit-learn、Gensim\
    \ 以及 Python 的其他相关技术无缝协作。深度学习开发者可以轻松地为一系列 NLP/NLU 问题构建语言上复杂的统计模型。  \n\n### spaCy\
    \ 的特性\n\n没有其他 NLP 库能像 spaCy 一样提供极其广泛的 API 来完成几乎所有任务。这个库最棒的地方在于它持续进化，变得越来越好。让我们先睹为快，看看\
    \ spaCy 官方网站上列出的特性：  \n\n- 非破坏性分词  \n- 命名实体识别  \n- 支持 28 种以上语言  \n- 针对 8 种语言的\
    \ 13 个统计模型  \n- 预训练词向量  \n- 易于集成的深度学习  \n- 词性标注  \n- 带标签的依存句法分析  \n- 基于句法的句子分割\
    \  \n- 用于句法和 NER 的内置可视化工具  \n- 便捷的字符串到哈希映射  \n- 导出为 numpy 数据数组  \n- 高效的二进制序列化\
    \  \n- 简便的模型打包与部署  \n- 最先进的速度  \n- 稳健、经过严格评估的准确率  \n\n现在，让我们深入探索这个用于 Python NLP\
    \ 的出色模块：spaCy。  \n\n### 安装与先决条件\n\n在我们真正深入 spaCy 和代码片段之前，请确保你的操作系统上已安装 Python。如果没有，请参考\
    \ [1]。"
- fmt: "# 安装与配置\n\n您可以使用任何您熟悉的 Python 版本。如今大多数系统都预装了默认的 Python 2.7.x 版本。本章我们将使用 Python\
    \ 3。因此，如果您想使用 Python 3，请从 [Python 官网](https://www.python.org/downloads/) 下载并安装到您的操作系统上。如果您已经安装了\
    \ Python 2，也可以使用它；可能需要进行一些微小的代码调整。\n\n我们将通过 `pip` [2] 安装 `spaCy`。我们将使用虚拟环境 [3]，并将\
    \ `spaCy` 安装到用户目录中。\n\n如果您使用的是 macOS/OSX/Linux，请按照以下步骤操作：\n\n- 步骤 1：`python3 -m\
    \ pip install -U virtualenv`\n- 步骤 2：`virtualenv venv -p /usr/local/bin/python3`\
    \ # 请确保使用您自己操作系统中 Python 3 可执行文件的路径。\n- 步骤 3：`source venv/bin/activate`\n- 步骤\
    \ 4：`pip3 install -U spacy` # 我们将使用 `spaCy` 2.0.11 版本。\n\n最后一步可能需要一些时间，请耐心等待。\n\
    \n如果您使用的是 Windows，只需将步骤 3 改为：`venv\\Scripts\\activate`\n\n现在，我们将在已激活的虚拟环境中安装 Jupyter\
    \ Notebook。使用 Jupyter Notebook 比标准 Python 解释器更简单、更高效。在接下来的章节中，我们将在 Jupyter Notebook\
    \ 中执行所有代码片段。\n\n要安装 Jupyter Notebook，请运行以下 `pip` 命令：\n\n`pip3 install jupyter`\n\
    \n此命令将在您的系统中安装 Jupyter Notebook。\n\n此时，您应该已经在虚拟环境中安装了 `spaCy` 和 Jupyter Notebook。让我们验证一下是否全部安装成功。\n\
    \n进入您的命令行界面，输入以下命令，您应该会看到一个服务器启动，并在默认浏览器中打开一个 URL。\n\n`$ jupyter notebook`\n\n\
    默认 URL 是 `http://localhost:8888`。它应该看起来像图 2-2 所示。\n\n如图 2-2 所示，点击“New”，然后选择“Python\
    \ 3”。\n\n它将在当前浏览器中打开一个新标签页，并为您创建一个新的笔记本，您可以在其中运行 Python 代码。\n\n您可以执行任何 Python\
    \ 代码、导入库、绘制图表以及编写 Markdown 单元格。\n\n![](image-uhyiyuwc.png)  \n图 2-2. Jupyter Notebook\
    \ 初览\n\n输入 `import spacy`，然后通过点击“Run”按钮或按 `Shift + Enter` 运行该单元格。它应该看起来像图 2-3\
    \ 所示。\n\n![](image-7redyxr3.png)  \n图 2-3. 验证 spaCy 安装\n\n如果步骤 3 没有抛出任何错误消息，那么您已成功在系统上安装了\
    \ `spaCy` 模块。您应该在笔记本中看到已安装的 `spaCy` 版本。如果您想安装相同版本的 `spaCy`，可以在通过 `pip` 安装时指定版本。\n\
    \n`pip3 install –U spacy==2.0.11`\n\n## 什么是 spaCy 模型？\n\n`spaCy` 模型就像其他任何机器学习或深度学习模型一样。模型是算法的产物，或者说，是在使用机器学习算法训练数据后创建的对象。\n\
    \n`spaCy` 拥有许多这样的模型，我们可以像下载其他 Python 包一样，直接下载并放入程序中使用。\n\n现在，我们将以 Python 包的形式安装\
    \ `spaCy` 模型。\n\n为此，我们将在笔记本中利用其魔法命令运行以下命令。通过在 shell 命令前加上 `!`（感叹号），我们也可以从 Jupyter\
    \ Notebook 中运行 shell 命令。让我们看看它是如何工作的。\n\n`!python3 -m spacy download en`\n\n在使用\
    \ Jupyter Notebook 下载 `spaCy` 模型时，您可能会遇到权限问题。请前往您的终端并运行以下命令：\n\n`sudo python3\
    \ –m download en`\n\n请参考图 2-4。\n\n![](image-nidzrono.png)  \n图 2-4. 下载 spaCy 模型\n\
    \n如图 2-4 所示，`spaCy` 会尝试下载一些核心文件，并将它们作为 Python 包安装。\n\n![](image-cb122h8q.png)\
    \  \n注意：`!`（感叹号操作符）仅在 Jupyter Notebook 中有效。要直接从终端安装 `spaCy` 模型，您需要去掉 `!`（感叹号操作符）；否则会导致错误。\n\
    \n![](image-pgmlux7j.png)\n\n[1] https://www.python.org/downloads/  \n[2] https://packaging.python.org/tutorials/installing-packages/#installing-from-pypi\
    \  \n[3] http://docs.python-guide.org/en/latest/dev/virtualenvs/\n\n# 构建聊天机器人的\
    \ NLP 基础方法\n\n要想成为某个领域的专家并高效地完成工作，打好基础非常重要。要构建聊天机器人，我们需要了解 NLP 的基础方法。这些方法帮助我们分解输入内容并理解其含义。在下一节中，我们将学习一些最常用的\
    \ NLP 方法，这些方法不仅能让您精通 NLP，还能帮助您构建出色的聊天机器人。我们越能更好、更高效地处理输入文本，就越能更好地响应用户。\n\n## 词性标注\n\
    \n词性标注是一个过程，您读取一些文本，并为每个单词或标记分配词性，例如名词、动词、形容词等。\n\n当您想要识别给定句子中的某个实体时，词性标注变得极其重要。第一步是进行词性标注，查看文本中包含什么内容。\n\
    \n让我们通过一些真实的词性标注示例来动手实践。\n\n### 示例 1：\n\n```\nnlp = spacy.load('en') # 将 spaCy\
    \ en 模型加载到 Python 对象中\ndoc = nlp(u'I am learning how to build chatbots') # 创建一个\
    \ doc 对象\nfor token in doc:\n    print(token.text, token.pos_) # 打印文本和词性\n```\n\
    \n输出：\n\n```\n('I', 'PRON')\n('am', 'VERB')\n('learning', 'VERB')\n('how', 'ADV')\n\
    ('to', 'PART')\n('build', 'VERB')\n('chatbots', 'NOUN')\n```\n\n### 示例 2：\n\n\
    ```\ndoc = nlp(u'I am going to London next week for a meeting.')\nfor token in\
    \ doc:\n    print(token.text, token.pos_)\n```\n\n输出：\n\n```\n('I', 'PRON')\n\
    ('am', 'VERB')\n('going', 'VERB')\n('to', 'ADP')\n('London', 'PROPN')\n('next',\
    \ 'ADJ')\n('week', 'NOUN')\n('for', 'ADP')\n('a', 'DET')\n('meeting', 'NOUN')\n\
    ('.', 'PUNCT')\n```"
  raw: 'You can use whichever version of Python you are comfortable with. Most of
    the systems today come pre-installed with default Python version 2.7.x. We’ll
    be using Python 3 in this chapter. So, if you want to use Python 3, please install
    Python 3 on your   operating system by downloading it from If you   have Python
    2 installed already, you can use that as well; it may or may not need minor code
    changes.   We will install spaCy via pip [2].   We are going to use a virtual
    environment [3] and install spaCy into a user directory.    If you are on macOS/OSX/Linux,
    follow these steps:   Step 1: python3 -m pip install -U virtualenv   Step 2: virtualenv
    venv -p /usr/local/bin/python3 #Make sure you use your own OS path for python
    3 executable.   Step 3: source venv/bin/activate   Step 4: pip3 install -U spacy
