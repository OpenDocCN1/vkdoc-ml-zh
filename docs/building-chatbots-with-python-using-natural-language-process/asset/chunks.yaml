- fmt: "# 排版后的内容\n\n从`spacy`导入`displacy`  \n`doc = nlp(u'Book a table at the restaurant\
    \ and the taxi to the hotel')`  \n`displacy.serve(doc, style='dep')`\n\n运行这段代码将产生如图2-6所示的输出。如果你得到类似的结果，那么请转到浏览器的另一个标签页并输入。\n\
    \n我们得到了代码中该字符串的依存句法分析可视化结果（如图2-7所示）。\n\n![](image-kl81sy6k.png)  \n图2-6. 在本地主机上启动依存句法分析服务器\n\
    \n![](image-x09lcgrh.png)  \n图2-7. 依存句法分析示例\n\n让我们再举一个依存句法分析的例子，假设用户正在询问以下句子：\n\
    \n`What are some places to visit in Berlin and stay in Lubeck?`\n\n我们将首先创建如下所示的对象：\n\
    \n`doc = nlp(u\"What are some places to visit in Berlin and stay in Lubeck\")`\n\
    \n现在，我们获取正在讨论的地点以及用户想要执行的动作：\n\n```\nplaces = [doc[7], doc[11]] #[Berlin, Lubeck]\n\
    actions = [doc[5], doc[9]] #[visit, stay]\n```\n\n既然你已经了解词性标注和实体抽取，你可以轻松地自动获取地点和动作。\n\
    \n现在我们有了地点，让我们遍历每个地点的所有祖先节点，并检查是否有任何祖先节点出现在动作列表中。在动作列表中找到的地点的第一个父节点，应该是该地点对应的动作。\n\
    \n```\nfor place in places:\n    for tok in place.ancestors:\n        if tok in\
    \ actions:\n            print(\"User is referring {} to {}\").format(place, tok)\n\
    \            break\n```\n\n输出：\n\n```\nUser is referring: Berlin to visit\nUser\
    \ is referring: Lubeck to stay\n```\n\n正如我们在这些示例中所看到的，依存句法分析使得理解用户所指的内容变得相当容易。我们看到，即使在两个不同任务的情况下，我们也能很好地推断出用户的期望，并据此制定下一步的回应。\n\
    \n## 依存句法分析在聊天机器人中的用途是什么？\n\n当从头构建聊天机器人时，依存句法分析是最重要的部分之一。当你想要弄清楚用户输入给聊天机器人的文本含义时，它变得更为重要。可能存在这样的情况：你尚未训练你的聊天机器人，但你仍然不想失去客户，或者像一台愚蠢的机器一样回复。在这些情况下，依存句法分析确实有助于发现关系，并更详细地解释用户可能正在询问的内容。\n\
    \n如果我们列出依存句法分析有助于解决的问题，可能包括：\n\n- 它有助于找出语法正确句子中单词之间的关系。\n- 它可用于句子边界检测。\n- 它在判断用户是否同时谈论多个上下文时非常有用。\n\
    \n你可能会想，如果你的机器人用户说了任何语法不正确的句子，或者在输入某些内容时使用了短信简写，该怎么办？正如第1章所讨论的，你必须对这些情况保持警惕，并使用NLP技术相应地处理它们。\n\
    \n你需要编写自己的自定义NLP来理解用户或聊天机器人的上下文，并据此识别用户可能犯的语法错误。\n\n总而言之，你必须为这样的场景做好准备：用户会输入垃圾值或语法不正确的句子。你无法一次性处理所有此类场景，但你可以通过添加自定义NLP代码或通过设计限制用户输入来不断改进你的聊天机器人。\n\
    \n## 名词块\n\n名词块或NP-分块基本上是“基础名词短语”。我们可以说它们是扁平短语，以名词作为其中心词。你可以将名词块视为一个名词以及描述该名词的词语。\n\
    \n让我们尝试一个例子来更好地理解它。\n\n示例1：\n\n```\ndoc = nlp(u\"Boston Dynamics is gearing up\
    \ to produce thousands of robot dogs\")\nlist(doc.noun_chunks)\n```\n\n输出：\n\n\
    ```\n[Boston Dynamics, thousands, robot dogs]\n```\n\n尽管从给定句子中获取名词块有很大帮助，但`spaCy`还提供了其他可能有用的属性。让我们尝试探索其中一些。\n\
    \n示例2：\n\n```\ndoc = nlp(u\"Deep learning cracks the code of messenger RNAs and\
    \ protein- coding potential\")\nfor chunk in doc.noun_chunks:\n    print(chunk.text,\
    \ chunk.root.text, chunk.root.dep_, chunk.root.head.text)\n```\n\n输出：\n\n```\n\
    Output: Output: Output: Output: Output:\n```\n\n正如我们从这张表中看到的，我们得到了名词块及其属性。下表将帮助你理解每一列。\n\
    \n![](image-sg3uojzz.png)  \n列 | 含义\n\n![](image-799hypjo.png)  \n原始名词块\n\n根词：将名词块与剩余解析连接起来的原始单词\n\
    \n根关系：将根词连接到其中心词的关系\n\n![](image-utqty86m.png)  \n根中心词：根词标记的中心词\n\n## 查找相似度\n\n\
    查找两个单词之间的相似度是你在使用NLP时经常会遇到的一个用例。有时，判断两个单词是否相似变得相当重要。在构建聊天机器人时，你经常会遇到这样的情况：你不仅要找到外观相似的单词，还要找到两个单词在逻辑上的关联程度。`spaCy`使用高质量的词向量，通过`GloVe`算法（全局词向量表示）来查找两个单词之间的相似度。\n\
    \n`GloVe`是一种用于获取单词向量表示的无监督学习算法。`GloVe`算法使用语料库中聚合的全局词-词共现统计来训练模型。\n\n让我们尝试使用`token`的`vector`属性来查看`spaCy`向量中的实际值。\n\
    \n```\ndoc = nlp(u'How are you doing today?')\nfor token in doc:\n    print(token.text,\
    \ token.vector[:5])\n```\n\n输出：\n\n```\n(u'How', array([-0.29742685, 0.73939574,\
    \ -0.04001453, 0.44034013, 2.8967502 ], dtype=float32))\n(u'are', array([-0.23435134,\
    \ -1.6145049 , 1.0197453 , 0.9928169 , 0.28227055], dtype=float32))\n(u'you',\
    \ array([ 0.10252178, -3.564711  , 2.4822793 , 4.2824993 , 3.590245  ], dtype=float32))\n\
    (u'doing', array([-0.6240922 , -2.0210216 , -0.\n```"
  raw: 'from spacy import displacy   doc = nlp(u''Book a table at the restaurant and
    the taxi to the hotel'') displacy.serve(doc, style=''dep'')   Running this code
    will have output like that in Figure 2-6\. If you get something similar, then
    go to another tab of your browser and enter   We get a visualization of dependency
    parsing for this string in the code (shown in Figure 2-7).  ![](image-kl81sy6k.png) 
    Figure 2-6. Starting dependency parsing server on localhost  ![](image-x09lcgrh.png) 
    Figure 2-7. Example of dependency parsing  Let’s take one more example of dependency
    parsing where we assume a user is asking the following sentence:   What are some
    places to visit in Berlin and stay in Lubeck?   We will first create the object
    as shown here:   doc = nlp(u"What are some places to visit in Berlin and stay
    in Lubeck")   Now, we get the places being talked about and the actions the user
    wants:   places = [doc[7], doc[11]] #[Berlin, Lubeck] actions = [doc[5], doc[9]]
    #[visit, stay]   Since you already know POS tagging and entity extraction, you
    can easily get the places and actions automatically.   Now that we have the places,
    let’s iterate through each of its ancestors and check if any ancestors are found
    in actions. The first parent of place found in the list of actions should be the
    action for the place in question.   for place in places:   for tok in place.ancestors:
    if tok in actions:   print("User is referring {} to {}").format(place, tok) break
      Output:   User is referring: Berlin to visit User is referring: Lubeck to stay
      As we see in these examples, dependency parsing makes it quite easy to understand
    what the user is referring to. We saw that in the case of two different tasks
    as well, we can pretty figure out the expectation and, based on that, formulate
    the next response.   What Is the Use of Dependency Parsing in Chatbots?   Dependency
    parsing is one the most important parts when building chatbots from scratch. It
    becomes far more important when you want to figure out the meaning of a text input
    from your user to your chatbot. There can be cases when you haven’t trained your
    chatbots, but still you don’t want to lose your customer or reply like a dumb
    machine.  In these cases, dependency parsing really helps to find the relation
    and explain a bit more about what the user may be asking for.   If we were to
    list things for which dependency parsing helps, some might be:   •  It helps in
    finding relationships between words of grammatically correct sentences.   •  It
    can be used for sentence boundary detection.   •  It is quite useful to find out
    if the user is talking about more than one context simultaneously.   You must
    be wondering, what if your bot user says any grammatically incorrect sentence
    or uses any SMS textspeak while giving input about something? As discussed in
    Chapter 1, you have to be cautious about these situations and handle them accordingly
    using NLP techniques.


    You need to write your own custom NLP to understand the context of the user  
    or your chatbot and, based on that, identify the possible grammatical mistakes
    a user can make.   All in all, you must be ready for such scenarios where a user
    will input garbage values or grammatically incorrect sentences. You can’t handle
    all such scenarios at once, but you can keep improving your chatbot by adding
    custom NLP code or by limiting user input by design.   Noun Chunks   Noun chunks
    or NP-chunking are basically “base noun phrases.” We can say they are flat phrases
    that have a noun as their head. You can think of noun chunks as a noun with the
    words describing the noun.   Let’s try to take an example and understand it better.
      Example 1:   doc = nlp(u"Boston Dynamics is gearing up to produce thousands
    of robot dogs")   list(doc.noun_chunks)   Output:   [Boston Dynamics, thousands,
    robot dogs]  Though having noun chunks from a given sentence helps a lot, spaCy
    provides other attributes that can be helpful too. Let’s try to explore some of
    those.   Example 2:   doc = nlp(u"Deep learning cracks the code of messenger RNAs
    and protein- coding potential")   for chunk in doc.noun_chunks:   print(chunk.text,
    chunk.root.text, chunk.root.dep_, chunk.root.head.text)   Output:   Output: Output:
    Output: Output: Output:   As we can see from this table we get the noun chunks
    and their attributes. The following table will help you understand each column.
     ![](image-sg3uojzz.png)  Column Meaning  ![](image-799hypjo.png)  of the original
    noun chunk   Root of the original word that connects the noun chunk with remaining
    parse   Root relation that connects the root to its head  ![](image-utqty86m.png)
    Root head of the root token’s head   Finding Similarity   Finding similarity between
    two words is a use-case you will find most of the time working with NLP. Sometimes
    it becomes fairly important to find if two words are similar. While building chatbots
    you will often come to situations where you don’t have to just find similar-looking
    words but also how closely related two words are logically.  spaCy uses high-quality
    word vectors to find similarity between two words using   GloVe algorithm (Global
    Vectors for Word Representation).   GloVe is an unsupervised learning algorithm
