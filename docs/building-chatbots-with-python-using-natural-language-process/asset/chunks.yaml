- fmt: 'Those who will find this book useful include:


    - Python web developers looking to expand their knowledge or career into chatbots
    development

    - Students and aspiring programmers wanting to acquire a new skill set by hands-on
    experience to showcase something and stand out in the crowd

    - Natural Language enthusiasts looking to learn how to build a chatbot from scratch

    - Budding entrepreneurs with a great idea but not enough technical feasibility
    information on how to go about making a chatbot

    - Product/Engineering managers planning for a chatbot-related project


    ## How Do I Approach This Book?


    Remember this book is not written like other books are written. This book is written
    keeping in mind that once you are done with this book, you can build a chatbot
    yourself or teach someone how to build a chatbot. It’s very important to keep
    a few points in mind before approaching this book like any other book:


    - This book covers almost everything that you need to build a chatbot, rather
    than what exists.

    - This book is about spending more time in doing things on your system, with this
    book by your side. Make sure you execute each code snippet and try to write the
    code; do not copy and paste.

    - Make sure you follow the steps as they appear in the book; don’t worry if you
    don’t understand something. You will get to know about that later in the chapter.

    - Use the source code and Jupyter Notebook provided with this book for your reference.


    ## What Will You Learn in This Book?


    ### Chapter 1: The Beloved Chatbots


    In this chapter you will get to know about things related to chatbots from both
    a business and developer’s perspective. This chapter sets the tone for getting
    our hands dirty with chatbots concepts and converting them into code. Hopefully,
    you will have a reason why you should definitely build a chatbot for yourself
    or your company by the end of this chapter.


    ### Chapter 2: Natural Language Processing for Chatbots


    In this chapter you will learn about what tools and methods to use when NLP is
    needed for chatbots. This chapter not only teaches you about the method in NLP
    but also takes real-life examples and demonstrates with coding examples. This
    chapter also discusses why a particular NLP method may be needed in chatbots.
    Note that NLP in itself is a skill to have.


    ### Chapter 3: Building Chatbots the Easy Way


    In this chapter you will learn about building a chatbot in a nice and easy manner
    using tools like Dialogflow. If you are a non-programmer, you will surely like
    it, as it requires little or no programming skills.


    ### Chapter 4: Building Chatbots the Hard Way


    In this chapter, you will learn about building chatbots in a manner that people
    want to build. The title says the hard way, but once you have completed the previous
    chapter, you will be wanting more, as this chapter will teach how to build chatbots
    in-house from scratch and how to train chatbots using machine learning algorithms.


    ### Chapter 5: Deploying Your Chatbot


    This chapter is purely designed to give your chatbot app a final push. When you
    have come through the easy and hard way of building a chatbot, you will surely
    not want to keep it to yourself. You will learn how to showcase your chatbots
    to the world using Facebook and Slack and, finally, integrate them on your own
    website.


    ## Chapter 1 – The Beloved Chatbots


    When you begin to build a chatbot, it’s very important to understand what chatbots
    do and what they look like.


    You must have heard of Siri, IBM Watson, Google Allo, etc. The basic problem that
    these bots try to solve is to become an intermediary and help users become more
    productive. They do this by allowing the user to worry less about how information
    will be retrieved and about the input format that may be needed to attain specific
    data. Bots tend to become more and more intelligent as they handle user data input
    and gain more insights from it. Chatbots are successful because they give you
    exactly what you want.


    Does it irritate you or frustrate you when you have to enter the same name, e-mail
    ID, address, and pincode every time on different websites? Imagine a single bot
    that does your tasks—say, ordering food from different vendors, shopping online
    from various e-commerce companies, or booking a flight or train tickets—and you
    don’t have to provide the same e-mail ID, shipping address, or payment information
    every time.


    The bot has the capability to know this information already and is intelligent
    enough to retrieve what is needed when you ask it in your own language or in what
    is known in computer science as Natural Language.


    Chatbots development is way easier than it was a few years ago, but chatbots did
    exist decades ago as well; however, the popularity of chatbots has increased exponentially
    in last few years.


    If you are a technical person or have some idea of how a web application or mobile
    application works, then you must have heard the term APIs. Any kind of data that
    you need today is available to be consumed in the form of APIs provided by different
    service providers and institutions. If you are looking for weather information,
    booking tickets, ordering food, getting flight information, converting one language
    to another, or posting on Facebook or Twitter, all of this can be done using APIs.
    These APIs are used by web- or mobile-based applications to do these tasks. Chatbots
    can also use these APIs to achieve the same tasks based on our requests.


    The reason Chatbots get an edge over traditional methods of getting things done
    online is you can do multiple things with the help of a chatbot. It’s not just
    a chatbot, it’s like your virtual personal assistant. You can think of being able
    to book a hotel room on booking.com as well as booking a table in a nearby restaurant
    of the hotel, but you can do that using your chatbot. Chatbots fulfill the need
    of being multipurpose and hence save a lot of time and money.'
