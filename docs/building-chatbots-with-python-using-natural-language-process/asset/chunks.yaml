    patiently.   If you are on Windows ,just change the Step 3 to   venv\Scripts\activate
      Now, we are going to install Jupyter Notebook inside our virtual environment,
    which we activated in the Step 3\. Using Jupyter Notebook is much easier and more
    productive than standard Python interpreter. We will be executing all the snippets
    in Jupyter Notebook in the coming chapters.   To install Jupyter Notebook, run
    the following pip command:   pip3 install jupyter   This command will install
    Jupyter Notebook in your system.   At this point you should have spaCy and Jupyter
    Notebook installed in your virtualenv. Let’s verify if everything was successfully
    installed.   Go to your command line interface and type the following and you
    should see a server being started and opening a url in your default browser.  
    $ jupyter notebook   The default url is It should look something like Figure 2-2\.
      Click on New as shown in Figure 2-2, and choose Python 3\.   It will open a
    new tab in your current browser and create a new notebook for you, where you can
    play with the Python code.   You can execute any Python code, import libraries,
    plot charts, and markdown cells.   ![](image-uhyiyuwc.png)  Figure 2-2. Jupyter
    Notebook first look   Type import spaCy and run the cell by clicking on “Run”
    button or by pressing Shift + Enter. It should look something like Figure 2-3\.
     ![](image-7redyxr3.png)  Figure 2-3. Verifying spaCy installation   If Step 3
    doesn’t throw any error messages, then you have successfully installed the spaCy
    module on your system. You should see your installed spaCy version in your notebook.
    If you want to install the same version of spaCy then you can specify the version
    while installing spaCy via pip.   pip3 install –U spacy==2.0.11   What Are SpaCy
    Models?   SpaCy models are just like any other machine learning or deep learning
    models. A model is a yield of an algorithm or, say, an object that is created
    after training data using a machine learning algorithm.


    spaCy has lots of such models that can be placed directly in our program by downloading
    it just like any other Python package.   Now, we are going to install spaCy models
    as Python packages.    To do that, we’ll run the following command in the notebook
    by taking use of notebook’s magic command. By prefixing! [Exclamation Operator]
    before the shell command, we can run shell commands as well from Jupyter Notebooks.
    Let’s see how it looks.   !python3 -m spacy download en   You might get a permission
    issue while using Jupyter Notebook to download spaCy models for Python Go to your
    terminal and run the following command:   sudo python3 –m download en   See Figure
    2-4 for reference.  ![](image-nidzrono.png)  Figure 2-4. Downloading spaCy models
      As you can see in Figure 2-4, spaCy tries to download some core files and installs
    them as Python packages.  ![](image-cb122h8q.png)  Note ! [exclamation operator]
    works only in Jupyter Notebook. to install spaCy models directly from the terminal,
    you need to remove! [exclamation operator];   otherwise it will result into an
    error.  ![](image-pgmlux7j.png)  [1]  https://www.python.org/downloads/   [2] 
    https://packaging.python.org/tutorials/installing- packages/#installing-from-pypi
      [3]  http://docs.python-guide.org/en/latest/dev/virtualenvs/Fundamental Methods
    of NLP for Building Chatbots   It’s really important to be good at basics to be
    an expert at something and do it effectively and efficiently. To build chatbots,
    we need to know the fundamental methods of   NLP. These methods help us break
    the input into chunks and make sense of it. In the next section, we are going
    to learn some of the most used NLP methods that will not just help you be good
    at NLP but also good at building cool chatbots. The more we can process the input
    text better and more efficiently, the better we can respond to the user.   POS
    Tagging   Part-of-speech tagging is a process where you read some text and assign
    parts of speech to each word or token, such as noun, verb, adjective, etc.   POS
    tagging becomes extremely important when you want to identify some entity in a
    given sentence. The first step is to do POS tagging and see what our text contains.
      Let’s get our hands dirty with some of the examples of real POS tagging.   Example
    1:   nlp = spacy.load(''en'') #Loads the spacy en model into a python object doc
    = nlp(u''I am learning how to build chatbots'') #Creates a doc object for token
    in doc:   print(token.text, token.pos_) #prints the text and POS   Output:   (''I'',
    ''PRON'')   (''am'', ''VERB'')   (''learning'', ''VERB'')   (''how'', ''ADV'')
      (''to'', ''PART'')   (''build'', ''VERB'')   (''chatbots'', ''NOUN'')   Example
    2:   doc = nlp(u''I am going to London next week for a meeting.'') for token in
    doc:   print(token.text, token.pos_)    (''I'', ''PRON'')   (''am'', ''VERB'')
      (''going'', ''VERB'')   (''to'', ''ADP'')   (''London'', ''PROPN'')   (''next'',
    ''ADJ'')   (''week'', ''NOUN'')   (''for'', ''ADP'')   (''a'', ''DET'')   (''meeting'',
