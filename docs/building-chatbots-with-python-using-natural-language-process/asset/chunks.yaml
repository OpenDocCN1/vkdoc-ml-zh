  trans: "\n人们最初使用 wit.ai，因为它免费，而 Dialogflow 当时并非如此，但后来 Dialogflow 也免费了。  \n• https://www.luis.ai/\
    \  \n• 一种基于机器学习的服务，用于将自然语言构建到应用、机器人和物联网设备中。  \n• 快速创建可投入企业级应用、持续改进的自定义模型。  \n\
    • http://botkit.ai  \n• 可视化对话构建器  \n• 内置统计和指标  \n• 可轻松集成到 Facebook、Microsoft、IBM\
    \ Watson、Slack、Telegram 等平台。  \n\n**聊天机器人的组成部分及常用术语**  \n聊天机器人系统的组成部分很少。在本节中，我们将简要讨论在后续章节中会遇到的聊天机器人组件。\
    \  \n在深入探讨任何系统之前，对其有基本的理论理解总是有益的。通过本节，你应该能对使用 Python 构建聊天机器人时所用的技术术语有一个清晰的认识。这些术语将在后续章节中频繁使用，届时我们将真正开始构建聊天机器人。\
    \  \n\n**意图**  \n当用户与聊天机器人交互时，他使用聊天机器人的目的是什么/他在询问什么？  \n例如，当用户对聊天机器人说“预订一张电影票”时，作为人类，我们能理解用户想要预订一张电影票。这就是机器人的意图。它可以被命名为意图。\
    \  \n另一个例子是，当用户说“我想点餐”或“你能帮我点餐吗？”这些都可以被命名为意图。同样，你可以根据需要定义任意数量的意图。  \n\n**实体**\
    \  \n意图包含关于意图的元数据，称为实体。在“预订一张电影票”的例子中，预订票是意图，而实体是“电影”，它也可能是其他东西，比如航班、音乐会等。  \n\
    你可以标记通用实体，以便在所有意图中使用。实体可以表示数量、计数或体积。意图也可以有多个实体。  \n例如：给我订一双 8 码的鞋。这里可能有两个实体： \
    \ \n类别：鞋  \n尺码：8  \n\n**表述**  \n表述不过是用户可能展示的同一问题/意图的不同形式。  \n• 还记得我们讨论过的关灯意图吗？那是用户如何为同一意图使用不同表述的一个例子。\
    \  \n• 建议每个意图有 10 个最佳表述，最少 5 个，但这并非硬性限制。  \n\n**训练机器人**  \n训练本质上意味着构建一个模型，该模型将从现有定义的意图/实体和表述中学习，以对新表述进行分类，并同时提供置信度分数。\
    \  \n当我们使用表述训练系统时，这被称为监督学习。我们很快将学习如何实际操作。  \n\n**置信度分数**  \n每当你尝试判断一个表述可能属于哪个意图时，你的模型都会给出一个置信度分数。\
    \  \n这个分数告诉你，你的机器学习模型对识别用户意图的自信程度。  \n\n以上就是我们在“聊天机器人简介”第一章中想要涵盖的全部内容。从商业角度和技术角度，你现在应该对聊天机器人有了清晰的认识。我们回顾了聊天机器人的历史发展脉络。聊天机器人的进化程度令人着迷。\
    \  \n我们了解了聊天机器人如何随着时间的推移而演变，以及为什么在如此激烈的竞争中，聊天机器人是企业发展的必备工具。我们学习了不同的聊天机器人框架，并通过示例了解了聊天机器人的术语。我们将在后续章节中使用这些知识。你现在应该已经清楚自己想构建哪种聊天机器人，以及它构建完成后的行为表现。\
    \  \n如果需要，请完成你的所有文档和决策树。在下一章学习了自然语言理解的基础知识后，我们就可以快速开始构建聊天机器人了。  \n即使你心中没有任何想法，也不必担心。我们将利用后续章节学到的所有概念，一步步构建一个很酷的聊天机器人。\
    \  \n下一章见。  \n\n**第 2 章**  \n––––––––  \n**用于聊天机器人的自然语言处理**  \n本章旨在让你开始使用 Python\
    \ 进行自然语言处理（NLP），这是构建聊天机器人所需的技能。你将学习使用一个名为 spaCy 的优秀开源库进行 NLP 的基本方法和技术。如果你是 Python\
    \ 生态系统的初学者或中级用户，请不要担心，因为你会逐步完成学习聊天机器人 NLP 所需的每一步。本章不仅教你 NLP 的方法，还会结合现实生活中的例子，并通过代码示例进行演示。我们还将讨论为什么特定的\
    \ NLP 方法可能对聊天机器人是必需的。请注意，NLP 本身是一项技能。  \n我们将仔细研究词性标注、词干提取、实体检测、停用词、依存句法分析、名词块以及词语间的相似度查找。所有这些方法在你构建特定用例的聊天机器人时都会非常有帮助。\
    \  \n本章涵盖的 NLP 方法之外还有很多。根据你正在构建的聊天机器人的需求，你可以尝试学习它们。到本章结束时，我们将学习使用的 SpaCy 库将为你提供足够的思路，来扩展你的\
    \ NLP 知识库和理解。那么，让我们开始吧，首先在下一节中尝试理解用于聊天机器人的 NLP。  \n\n**为什么我需要了解自然语言处理才能构建聊天机器人？**\
    \  \n要理解这个问题的答案，我们首先来了解自然语言处理（NLP）。  \n自然语言处理（NLP）是人工智能的一个领域，它使计算机能够分析和理解人类语言。\
    \  \n\n29  \n© Sumit Raj 2019  \nS.\n"
- fmt: '# Raj, Building Chatbots with


    Now, to perform NLP or, say, Natural Language Understanding (NLU), we have lots
    of methods that we are going to discuss next. You heard a new term Natural Language
    Understanding is that now? In simple terms, NLU is a subset of a bigger picture
    of NLP, just like machine learning, deep learning, NLP, and data mining are a
    subset of a bigger picture of Artificial Intelligence (AI), which is an umbrella
    term for any computer program that does something smart.


    A good rule of thumb is to use the term NLU to express a machine’s ability to
    understand the natural language in a form provided by humans.


    Now, coming to the question of whether you really need to know NLP to build a
    chatbot—the answer is both Yes and No. Confused? You heard it right, it’s not
    that you can’t build a chatbot at all if you don’t know the method and techniques
    of NLP, but your scope will be somewhat limited. You won’t be able to scale the
    application and keep the code clean at the same time. NLP gives your chatbot the
    wings to fly when it can’t just walk and run.


    Chatbots for a common person are nothing but a way to communicate with some intelligent
    machine at the other end. This machine can be either voice-based or text-based,
    where the user will provide input in their own language, which in computer science
    is generally called natural language.


    We know that there is no black box that does the magic, and everything works just
    fine. One should know that there is nothing artificial in AI; it’s actually machine
    learning and deep learning algorithms written by great people, running under the
    hood. Machines haven’t reached a stage where they can think as similar as humans
    to have their own intelligence. AI systems today—what they do and the way they
    behave—are the outcome of how we have trained them.


    So, to understand the natural language of the user in whatsoever language it may
    be, or whatever input form it may be (text, voice, image, etc.), we have to write
    algorithms and use techniques of NLP. NLP is considered the brain of chatbots
    that processes the raw data, does the munging, cleans it, and then prepares to
    take appropriate actions.


    NLP in itself is a huge topic and requires time and perseverance to learn completely,
    but there are few methods that are necessary for a chatbot developer to know,
    which we are going to learn in this chapter.


    ## What Is spaCy?


    spaCy is an open-source software library for advanced NLP, written in Python and
    Cython, built by Matthew Honnibal. It provides intuitive APIs to access its methods
    trained by deep learning models.


    spaCy offers the fastest syntactic parser in the world. Taken directly from spaCy’s
    documentation, they have some amazing benchmarking results, which are shown below.


    ### Benchmarks Results of spaCy


    Two peer-reviewed papers in 2015 confirmed that spaCy offers the fastest syntactic
    parser in the world and that its accuracy is within 1% of the best available.


    The few systems that are more accurate are 20 times slower or more. Let''s try
    to look at Figure 2-1 which shows spaCy benchmarking results based on its speed
    and accuracy compared to other libraries.


    ![](image-u7ymy8ji.png)


    Figure 2-1. spaCy benchmarking results


    spaCy also offers statistical neural network models for a wide range of languages
    like English, German, Spanish, Portuguese, French, Italian, Dutch, and multi-language
    NER. It also provides tokenization for various other languages. This table shows
    speed benchmarked by Choi et al., so it wouldn’t be fair to compare spaCy v2.x
    benchmarked on different hardware. This is the reason you do not see the speed
    column value for spaCy v2.x.


    ## What Does spaCy Provide?


    There are three primary things that spaCy claims to provide and with which it
    is extremely helpful. Let’s try to look at those and understand why one should
    know and use spaCy as a go-to module for doing NLP.


    ### World’s Fastest Library


    spaCy does extremely well at extracting large-scale information. It is written
    from scratch with utmost care for memory with help of the Cython library.


    ### Get Things Done


    spaCy is designed with “get things done” in mind. It helps us in accomplishing
    real-world NLP scenarios. The clean documentation saves a lot of time for developers
    and computational linguistics enthusiasts and makes them more productive. It’s
    easy to install, just like any other Python package.


    ### Deep Learning


    spaCy is one of the best libraries available in the open-source community to process
    text for deep-learning algorithms. It collaborates seamlessly with TensorFlow,
    PyTorch, scikit-learn, Gensim, and the rest of Python’s related technologies.
    Deep learning developers can easily construct linguistically sophisticated statistical
    models for a range of NLP/NLU problems.


    ## Features of spaCy


    No other NLP library provides an extremely wide range of APIs to do almost everything,
    which is what spaCy does. The best things about this library is it is continuously
    evolving and getting better and better. Let’s have a sneak peek at the features
    of spaCy as mentioned on their official website:


    - Non-destructive tokenization

    - Named entity recognition

    - Support for 28+ languages

    - 13 statistical models for 8 languages

    - Pre-trained word vectors

    - Easy deep-learning integration

    - Part-of-speech tagging

    - Labeled dependency parsing

    - Syntax-driven sentence segmentation

    - Built-in visualizers for syntax and NER

    - Convenient string-to-hash mapping

    - Export to numpy data arrays

    - Efficient binary serialization

    - Easy model packaging and deployment

    - State-of-the-art speed

    - Robust, rigorously evaluated accuracy


    Now, let’s dive into this awesome module for NLP in Python: spaCy.


    ## Installation and Prerequisites


    Before we actually dive into spaCy and code snippets, make sure you have Python
    installed on your OS. If not, refer to [1].'
