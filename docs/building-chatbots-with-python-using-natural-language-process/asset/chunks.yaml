  trans: "\n在 Heroku 上创建对话管理应用  \n创建应用后，你可以进入项目根目录，在项目文件夹中通过命令行运行以下一组命令：  \n\n$ git\
    \ init  \n$ heroku git:remote -a <你的-heroku-应用名称>  \n$ heroku buildpacks:set heroku/python\
    \  \n$ heroku config:set PORT=5004  \n$ git add .  \n$ git commit -am \"部署我的机器人\"\
    \  \n$ git push heroku master  \n\n如果部署后遇到运行时错误，可能类似于以下内容：  \n\nValueError: You\
    \ may be trying to read with Python 3 a joblib pickle generated with Python 2.\
    \ This feature is not supported by joblib.  \n\n这通常发生在你使用 Python 2.x 版本时。Heroku\
    \ 默认使用 Python 3.x 版本。因此，如果你想使用 Python 2.x，需要执行以下步骤来解决上述错误：将 Python 3.6 改为 Python-2.7.15。具体操作如下：\
    \  \n\n在项目的根应用目录下创建一个 `runtime.txt` 文件。打开 `runtime.txt`，添加以下内容 `python-2.7.15`，然后保存。Heroku\
    \ 将仅使用上述 Python 版本来构建你的项目。  \n\n成功部署后，你会看到 Heroku 提供一个 URL，显示应用已部署到 <url>。</url>\
    \  \n\nremote: Compressing source files... done.  \nremote: Building source: \
    \ \nremote:  \nremote:——-> Python app detected  \nremote:——-> Installing requirements\
    \ with pip  \nremote:  \nremote:——-> Discovering process types  \nremote: Procfile\
    \ declares types -> web  \nremote:  \nremote:——-> Compressing...  \nremote: Done:\
    \ 254M  \nremote:——-> Launching...  \nremote: Released v17  \nremote: https://horoscopebot1212.herokuapp.com/\
    \ deployed to Heroku  \nremote:  \nremote: Verifying deploy... done.  \n\nTo https://git.heroku.com/horoscopebot1212.git\
    \ cd3eb1b..c0e081d master -> master  \n\n这次部署需要一些时间，请尽量保持耐心——你即将见证奇迹。如果没有收到任何错误信息，那么你已经成功将聊天机器人部署到\
    \ Heroku 云端，使其能与 Facebook Messenger 配合工作。  \n\n让我们验证一下它是否正常工作。  \n验证我们的对话管理应用在\
    \ Heroku 上的部署  \n\n为了验证我们的对话管理应用是否成功部署在 Heroku 上，我们将执行以下步骤：  \n\n获取 Heroku 提供的\
    \ URL，并在其后添加以下端点：  \n\n/webhooks/facebook/webhook?hub.verify_token=你的 _FB_  \n\
    请确保使用你在 Facebook 的 webhooks 设置中使用的正确验证令牌。对我来说，完整的 URL 如下所示：  \nhttps://horoscopebot1212.herokuapp.com/webhooks/facebook/webhook?hub.verify_token=my-secret-verify-\
    \  \n\n转到浏览器并粘贴整个 URL，如果你的 `hub.verify_token` 正确，它应该返回你的 `hub.challenge` 值。你的完整\
    \ URL 将如下所示：  \nhttps://horoscopebot1212.herokuapp.com/webhooks/facebook/webhook?hub.verify_token=你的\
    \ _FB_ 验证令牌&hub.  \n\n如果你在浏览器中看到 `successfully_verified` 消息，则说明你的应用已成功部署并正常运行。\
    \  \n\n将 Webhook 与 Facebook 集成  \n\n现在让我们回到 Facebook 应用配置。我们将从步骤 3 中断的地方继续，添加我们的回调\
    \ URL。请确保在“订阅字段”中勾选“消息”。参考图 5-10。  \n![](img/image-r2nilzgl.png)  \n图 5-10. Facebook\
    \ Messenger webhooks 配置  \n\n点击“验证并保存”。Facebook 将使用上述 URL 匹配验证令牌，这意味着服务器（或者说我们的应用）只会响应具有正确验证令牌的请求。一旦验证令牌匹配，webhook\
    \ 订阅将为我们的应用激活。  \n\n接下来，选择一个页面，你可以在该页面的 Webhooks 部分下将 webhook 订阅到页面事件。点击“订阅”（见图\
    \ 5-11）。  \n![](img/image-4lwl9u3o.png)  \n图 5-11. 将 webhook 订阅到 Facebook 页面事件\
    \  \n\n全部完成！是时候在 Facebook 上测试我们的星座机器人了。  \n部署后验证：Facebook 聊天机器人  \n\n在正常的软件开发场景中，人们构建软件、测试它，然后部署并进行\
    \ PDV（部署后验证）。我们也将做类似的事情，在成功部署到 Facebook Messenger 后，对我们的聊天机器人进行 PDV。这很重要，因为正如你所了解的，聊天机器人有一部分需要连接到动作服务器，以响应用户的某些意图请求。\
    \  \n\nPDV 类似于冒烟测试，用于检查应用的整体健康状况。如果你正在构建一个使用 10 到 15 个不同供应商 API 的机器人，那么必须检查所有场景，即机器人访问动作服务器并使用\
    \ API 向用户返回数据的情况。  \n\n因此，请前往你的 Messenger 应用或电脑浏览器中的 Facebook，搜索你的机器人并开始对话。  \n\
    \n图 5-12.1 到 5-12.3 展示了我的星座机器人的功能及反馈。  \n\n![](img/image-p6wgksu5.png)  \n图 5-12.1.\
    \ Horoscope_Bot Facebook  \n![](img/image-4k5409xr.png)  \n图 5-12.2. Horoscope_Bot\
    \ Facebook  \n![](img/image-bv7usr2q.png)  \n图 5-12.3. Horoscope_Bot Facebook\
    \  \n\n瞧！我们第一个内部构建的聊天机器人应用已部署到网络上，并可通过 Facebook Messenger 平台访问。所以，快去与你的家人、朋友、同事以及全世界分享吧。\
    \  \n\n在 Slack 上部署聊天机器人  \n\n在本节中，我们将把聊天机器人部署到 Slack。Slack 是一款团队协作工具，在开发者和企业中广受欢迎。如果你不热衷于社交媒体，那么你可能需要借助\
    \ Slack 通过界面与你的聊天机器人对话。那么，让我们开始构建第一个内部 Slack 聊天机器人吧。  \n\n为了将我们的星座聊天机器人部署到 Slack，我们将像处理\
    \ Facebook 时那样编写一个独立脚本。  \n\n为 Slack 聊天机器人创建独立脚本  \n\n在你的项目目录中创建一个名为 `slack.py`\
    \ 的新文件。文件内容为 `slack.`\n"
- fmt: "```python\nfrom rasa_core.channels.slack import SlackInput\nfrom rasa_core.agent\
    \ import Agent\nfrom rasa_core.interpreter import RasaNLUInterpreter\nimport os\n\
    from rasa_core.utils import EndpointConfig\n\n# load your trained agent\ninterpreter\
    \ = RasaNLUInterpreter(\"models/nlu/default/horoscopebot/\")\nMODEL_PATH = \"\
    models/dialogue\"\naction_endpoint = EndpointConfig(url=\"https://horoscopebot1212-actions.herokuapp.com/webhook\"\
    )\nagent = Agent.load(MODEL_PATH, interpreter=interpreter, action_endpoint=action_endpoint)\n\
    input_channel = SlackInput(\n    slack_token=\"YOUR_SLACK_TOKEN\",\n    # this\
    \ is the `bot_user_o_auth_access_token`\n    slack_channel=\"YOUR_SLACK_CHANNEL\"\
    \n    # the name of your channel to which the bot posts (optional)\n)\n# set serve_forever=False\
    \ if you want to keep the server running\ns = agent.handle_channels([input_channel],\
    \ int(os.environ.get('PORT', serve_forever=True)))\n```\n\nThe primary difference\
    \ between `facebook.py` and `slack.py` is the `input_channel` object that we create.\
    \ Rasa provides various in-built channels like Facebook, Slack, Mattermost, Telegram,\
    \ Twilio, RocketChat, and Microsoft Bot Framework, which we can use directly to\
    \ deploy the same bot on various channels easily.\n\nAs you can see, we need to\
    \ add a `slack_token` and `slack_channel` to be added into our script. As we had\
    \ to create a Facebook application on Facebook’s developer platform, similarly\
    \ we’ll have to create an app on Slack as well.\n\nLet’s do this step by step:\n\
    \nGo to this url `https://api.slack.com/slack-apps` and click on the button “Create\
    \ App.” Refer Figure 5-13.\n\n![](image-xffek5ca.png)\n\nFigure 5-13. Creating\
    \ an application in Slack\n\nThe next step is to create a Bot User. To create\
    \ a bot user, click on Bots under “Add features and functionality.” In the new\
    \ page you will get an option to “Add a Bot User.” Check Figure 5-14 to see how\
    \ to add details and add a bot user.\n\n![](image-pxpymnpf.png)\n\nFigure 5-14.\
    \ Giving a name to your bot on Slack\n\nFill in the details as per the chatbot\
    \ you are building. Display name can be anything that you like; default username\
    \ has to be unique; you can let it be as it is. Toggling the last option to always\
    \ show my bot as online is to always show the bot to be available as a user. This\
    \ is what chatbots are meant for—humans can’t be available 24/7, but chatbots\
    \ can, so we turn on this feature. Make sure you click on save changes. Go back\
    \ to the “Basic Information” tab. Click “Install your app to your workspace.”\
    \ The app will ask to confirm the identity. Please authorize it like you do for\
    \ any other app. Check Figure 5-15 which shows how the authorization would look\
    \ like.\n\n![](image-9kwu09sz.png)\n\nFigure 5-15. Authorizing your Slack app\n\
    \nYou will find the Bots and Permissions tab under “Add features and functionality”\
    \ with a green checkmark, which means our bot and app are well-integrated. This\
    \ is a sign that we are doing good so far.\n\nGo to your OAuth & Permissions section,\
    \ and copy Bot User OAuth Access Token. Paste the copied token into our Python\
    \ script. Give a channel name as you like. If you want your bot to post to a channel,\
    \ then you can give a channel name. I have given `@slackbot`. If you do not set\
    \ the `slack_channel` keyword argument, messages will be delivered back to the\
    \ user who sent them.\n\n## Editing your Procfile\n\nIn this step we won’t be\
    \ creating any new Procfile, as we are working with the same codebase. We’ll be\
    \ changing our existing Procfile to the following to make it work for our slack\
    \ bot. So, we just change the name of the script file from `facebook.py` to `slack.py`\
    \ so that Heroku uses the given file to start up the application.\n\n```\nweb:\
    \ python -m spacy download en && python slack.py\n```\n\n## Final Deployment of\
    \ Slack Bot to Heroku\n\nTo finally deploy our new Slack bot to Heroku, we’ll\
    \ be running a similar set of Heroku commands from command line to deploy our\
    \ application.\n\n```\n$ git init\n$ heroku git:remote -a <your-heroku-app-name>\n\
    $ git add .\n$ git commit -am \"deploy my bot\"\n$ git push heroku master\n```\n\
    \n## Subscribe to Slack Events\n\nNow, click on the tab and activate the events\
    \ subscriptions functionality by toggling the button on the screen. Enter the\
    \ Heroku app’s webhook url for Slack.\n\nIf your app was deployed on Heroku properly\
    \ with the modified Procfile, your webhook url for Slack will be `app_url + /webhooks/slack/webhook`,\
    \ which looks like the following:\n\n`https://horoscopebot1212.herokuapp.com/webhooks/slack/webhook`\n\
    \nYou will see a verified tick mark after Slack sends a HTTP POST request to the\
    \ above URL with a challenge parameter, and our endpoint must respond with the\
    \ challenge value. This is similar to what we discussed while building Facebook\
    \ chatbot’s secret token. Check Figure 5-16 to understand more.\n\n![](image-qfsuuebc.png)\n\
    \nFigure 5-16. Activate event subscriptions for your bot\n\n## Subscribe to Bot\
    \ Events\n\nIn this step we’ll simply scroll down the events subscriptions page\
    \ and go to the “Subscribe to Bot Events” section, and click on “Add Bot User\
    \ Event.” Take reference of Figure 5-17 to understand where to navigate.\n\n![](image-uicpdf46.png)\n\
    \nFigure 5-17. Subscribe to bot events\n\nSubscribe to bot events is nothing but\
    \ declaring the events for which the bot has to reply. We’ll only be demonstrating\
    \ two scenarios here: first, when somebody mentions the bot’s name (i.e., `@bot_name`),\
    \ and second, when somebody directly sends the bot the message (i.e., direct message).\n\
    \nNow, click on save changes, and you are done. It’s time to test our Slack chatbot\
    \ like we did in the previous section for Facebook.\n\n## Post-Deployment Verification:\
    \ Slack Bot\n\nLet’s go to our workspace we used to create the app, and under\
    \ Apps on the left side you will find your bot. Try to talk to it and see if it\
    \ does well. My bot does pretty well to give me my horoscope for today, which\
    \ is good to read. If you have not been able to come till this point then check\
    \ Figure 5-18 to see how my Slack bot responds.\n\n![](image-xxx.png)"
