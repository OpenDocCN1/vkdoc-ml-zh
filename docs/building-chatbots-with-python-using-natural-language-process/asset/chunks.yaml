    在你的网站上拥有你自己的定制聊天机器人 ![](img/image-iwsheqsj.png) 图 5-20.2. 在你的网站上拥有你自己的定制聊天机器人
      利用 Heroku 的自定义域名功能，你可以轻松地将同一个应用指向你自己的网站名称，比如当你觉得你的聊天机器人已经足够好，可以面向全世界用于盈利或非盈利目的时，就可以这样做。
      那么，各位朋友，这就是全部内容了！这就是如何使用 Python 结合自然语言处理和机器学习来构建聊天机器人的方法。我希望本章以及前面的章节对你有所帮助，并且你能够学到构建聊天机器人的实用方法。总结
      在本章中，我们学习了如何使用 Heroku 将我们自己的应用部署到我们自己的服务器上。我们学习了如何使用 Facebook 的开发者平台将我们的聊天机器人与
    Facebook 集成。我们还学习了为 Slack 应用创建一个自定义聊天机器人，并对其进行了测试。最后，正如在第三章末尾所承诺的，我们摆脱了对任何社交媒体平台的依赖，创建了我们自己的用户界面，并将其部署在
    Heroku 上并进行了测试。我们看到它运行得非常好——在训练它的时候它就能正常工作。既然我们已经有了一个基本模型并使其运行起来，现在你可以处理聊天机器人工作不佳的情况了。确定问题是与数据或训练有关，还是与动作服务器或自定义代码处理有关。一旦找到根本原因，修复它，重新部署，然后检查聊天机器人是否有所改进。我们通过从小处着手来构建大型软件。
      我期待收到你的来信，并且很好奇你在读完这本书后构建了什么样的聊天机器人。如果你在任何概念、代码执行或部署上遇到困难，我将随时乐意帮助你。   感谢与致敬。索引
