    \ install –U spacy==2.0.11\n\n什么是 spaCy 模型？\n\nspaCy 模型就像其他任何机器学习或深度学习模型一样。模型是算法的产物，或者说，是使用机器学习算法训练数据后创建的对象。\n\
    \nspaCy 有很多这样的模型，我们可以像下载其他 Python 包一样，直接下载并放入程序中使用。\n\n现在，我们将以 Python 包的形式安装 spaCy\
