    让我们进入 Dialogflow 账户中的“集成”页面，并启用 Web 演示。您将看到一个类似图 3-13 的弹出窗口。点击弹出窗口中的链接。  ![](img/image-bausuqgs.png) 
    图 3-13. Dialogflow 的 Web 演示链接   您将看到类似图 3-14.1 至 3-14.4 的内容。我用我们编写的对话测试了我的机器人，它运行得非常好。 ![](img/image-ydo5kk3s.png) 
    图 3-14.1. OnlineEatsBot 演示对话界面 I   ![](img/image-ujlb4gxh.png)  ––––––––   图 3-14.2.
    OnlineEatsBot 演示对话界面 II ![](img/image-8drbgfzt.png)  图 3-14.3. OnlineEatsBot 演示对话界面
    III   ![](img/image-8sa7mfs8.png)  图 3-14.4. OnlineEatsBot 演示对话界面 IV  除此之外，我们还可以使用弹出窗口中的
    iframe 代码，将这个机器人嵌入到我们自己的网站上。   在此处与我的 OnlineEatsBot 对话：   https://bot.dialogflow.com/c9b3f731-599e-4396-a35f-0d77497b46ef
      也请将您自己的机器人分享给您的朋友和家人，看看他们如何以合理的方式与机器人互动。如果您的聊天机器人没有按预期工作，请尝试修复它。将 Dialogflow
    聊天机器人集成到 Facebook Messenger   在本节中，我们将尝试将同一个聊天机器人集成到 Facebook Messenger，这样我们 Facebook
    平台上的用户也可以使用它，而无需访问我们的网站。   让我们回到 Dialogflow 控制面板中的“集成”页面，启用 Facebook Messenger
    图标，然后点击它，这将弹出一个与之前类似的弹出窗口。   在这里，我们需要前往 Facebook，注册一个应用，并获取所需的令牌。   •  验证令牌（任意字符串，仅供您自己使用）
      •  页面访问令牌（输入在 Facebook 开发者控制台中生成的令牌）   Dialogflow 的 Facebook 集成非常有用，可以基于 Dialogflow
    技术，轻松创建一个带有 NLU（自然语言理解）功能的 Facebook Messenger 机器人。   设置 Facebook   为了让我们的机器人在
    Facebook 上以同样的方式工作，我们需要执行以下操作：   如果您还没有 Facebook 账户，请创建一个。创建一个 Facebook 页面，您可以将机器人添加到该页面。
      当用户访问您的 Facebook 页面并向您发送消息时，他们将直接与您的机器人对话。创建 Facebook 应用   以下是创建应用的步骤：   登录
    Facebook 开发者平台。点击右上角的“我的应用”。点击“添加新应用”，输入名称和联系电子邮件地址。点击“创建应用 ID”，如下方图 3-15 所示。
     ![](img/image-2xschawz.png)  图 3-15. 在 Facebook 开发者平台创建新应用   在下一页，点击 Messenger
    选项的“设置”按钮。在“令牌生成”部分，选择我们希望机器人连接的 Facebook 页面（见图 3-16）。  ![](img/image-f4vrjckm.png) 
    图 3-16. 通过为您的机器人选择 Facebook 页面来生成令牌  这将生成一个页面访问令牌。请妥善保管此令牌，因为我们稍后需要在 Dialogflow
    中输入它。


    设置 Dialogflow 控制台   以下是步骤：   点击 Dialogflow 控制台左侧菜单中的“集成”选项，如果尚未启用，请打开 Facebook
    Messenger。在打开的弹出窗口中，输入以下信息，如图 3-17“设置 Dialogflow 并与 Facebook Messenger 集成”所示：
      •  验证令牌：这可以是您想要的任何字符串，仅供您自己使用。   •  页面访问令牌：输入在 Facebook 开发者控制台中生成的令牌。   点击“开始”按钮。
     ![](img/image-qgh02y0m.png)  图 3-17. 设置 Dialogflow 并与 Facebook Messenger 集成 
    您应该会看到一条消息，显示“机器人已启动”。这意味着我们已经准备就绪。   您可能想知道什么是回调 URL、验证令牌和页面访问令牌。让我们来理解一下这些概念。
      回调 URL   回调 URL 就是一个可公开访问的 URL，Facebook 会将来自您 Facebook 页面的任何实时请求 POST 到这个 URL。
      假设您正尝试在 OnlineEats 上为您的食物付款，然后您被重定向到银行的支付页面。现在，OnlineEats 必须向银行提供一个回调 URL，以便银行在支付完成后可以将用户重定向回去。
      在这里，Facebook 不会进行任何重定向，而是会获取用户在该页面聊天框中发送的所有内容，并将其 POST 到 webhook 或回调 URL。  
    现在，一旦我们在服务器上收到消息，我们就进行意图分类和实体解析，然后制定您想要回复给用户的内容。   验证令牌   验证令牌是在验证订阅时发送到您端点的一个任意字符串。需要它的原因是为了确保我们的服务器知道该请求是由
    Facebook 发出的，并且与我们刚刚配置的订阅相关。   假设其他人知道了您的 webhook，并冒充 Facebook 发布消息，那么 verify_token
    就会发挥作用，您将验证来源是否正确。基于此令牌，您还可以处理来自多个来源的 POST 请求，因为可以为不同的来源定义不同的令牌，但使用相同的回调 URL。
      访问令牌   Facebook API 需要页面访问令牌来管理 Facebook 页面。每个页面、管理员和应用都有唯一的令牌，并且这些令牌有到期时间。
     ![](img/image-zy8fk6r7.png)  注意 请准备好回调 URL 和验证令牌，以便现在配置 webhook。  ![](img/image-vat5073j.png) 
    配置 Webhooks   要配置我们机器人的 webhook，让我们回到 Facebook 开发者控制台：   当您点击控制面板时，在“添加产品”部分的
    webhooks 下点击“设置”按钮。如果您尚未订阅 webhooks，您将看到一个“订阅此对象”的选项。点击此选项会弹出一个新窗口，然后输入以下信息：  
    •  回调 URL：这是 Facebook Messenger 集成页面上提供的 URL。   •  验证令牌：这是您创建的令牌。

