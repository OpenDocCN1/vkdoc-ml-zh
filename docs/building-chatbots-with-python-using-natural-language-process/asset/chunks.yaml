  trans: "\n[](image-6l69pxto.png) 图 5-18. 测试 Slack 聊天机器人\n\n好了，各位，我们的 Slack 机器人就完成了。在下一节中，我们将把机器人部署到我们自己的用户界面上。构建自己的用户界面可能需要一些前端技能，但别担心——我们对此已有计划。\n\
    \n## 将聊天机器人部署到自有平台\n\n这个标题听起来很酷，对吧？到目前为止，我们一直在使用 Facebook 或 Slack 将聊天机器人部署到网络上，或者我们也可以使用\
    \ Telegram 等平台，但现在，是时候将一切部署到我们自己的平台上了——我们自己的服务器、我们自己的数据，以及使用我们自己的用户界面配置的模型。\n\n\
    如果你是一个组织或初出茅庐的企业家，你可能在 Facebook、Twitter 或 Slack 上有了机器人的想法，但你总是希望它也能在你自己的网站上运行，这样随着用户群的增加，你的品牌价值也会越来越高。\n\
    \n在本节中，我们将利用到目前为止的所有努力，最终构建一个功能完备且独立于任何第三方 API 调用或工具（如 Dialogflow、wit.ai、Watson\
    \ 等）的聊天机器人。你将拥有完全的控制权，可以随心所欲地调整你的聊天机器人，最重要的是，可以轻松地将其扩展到数百万用户。\n\n那么，让我们开始吧。\n\n\
    第一步是确保我们在前面章节中部署的两个应用程序正在运行。你已经知道如何进行基本的健康检查。你始终需要运行你的对话管理器应用和动作应用，以便在任何平台上使用你的聊天机器人模型。\n\
    \n现在，在我们之前创建 `facebook.py` 和 `slack.py` 的同一个项目目录中，我们将创建一个名为 `myown_chatbot.py`\
    \ 的新文件。之前创建的脚本，如 `facebook.py` 和 `slack.py`，是我们创建的独立脚本，这样我们就可以在命令中告诉 Heroku 运行哪个脚本来启动应用程序。现在，我们正在创建自己的脚本，该脚本将通过\
    \ REST API 暴露用户与聊天机器人之间的请求/响应。\n\n部署你自己的聊天机器人分为两部分。第一部分，我们将编写一个脚本来创建自定义频道，并将其部署为\
    \ REST API。第二部分，我们需要自己的用户界面，因为到目前为止，我们一直在使用 Facebook 和 Slack 的聊天界面进行对话。\n\n##\
    \ 为你的自有聊天机器人频道编写脚本\n\n这个脚本与我们迄今为止学习和编写的脚本类似，但它需要我们覆盖 `rasa_core` 的一些现有方法，以便我们可以定义自己的\
    \ API 认证规则。在下面的代码中，我对令牌验证进行了基本的字符串检查。这不建议用于生产级系统，因此，如果你正在为大型系统构建聊天机器人，请务必谨慎编写该部分。\n\
    \n创建一个名为 `myown_chatbot.py` 的新文件，并向其中添加以下内容：\n\n```python\nimport os\n\nfrom rasa_core.channels.rasa_chat\
    \ import RasaChatInput\nfrom rasa_core.agent import Agent\n\nfrom rasa_core.interpreter\
    \ import RasaNLUInterpreter\nfrom rasa_core.utils import EndpointConfig\n\n# 加载你训练好的智能体\n\
    \ninterpreter = RasaNLUInterpreter(\"models/nlu/default/horoscopebot/\")\nMODEL_PATH\
    \ = \"models/dialogue\"\n\naction_endpoint = EndpointConfig(url=\"https://horoscopebot1212-actions.herokuapp.com/webhook\"\
    )\nagent = Agent.load(MODEL_PATH, interpreter=interpreter, action_endpoint=action_endpoint)\n\
    \nclass MyNewInput(RasaChatInput):\n    def _check_token(self, token):\n     \
    \   if token == 'mysecret':\n            return {'username': 'admin'}\n      \
    \  logger.info(\"Failed to check token: {}.\".format(token))\n        return None\n\
    \ninput_channel = MyNewInput(url='https://horoscopebot1212.herokuapp.com')\n#\
    \ 如果希望保持服务器运行，请设置 serve_forever=False\ns = agent.handle_channels([input_channel],\
    \ int(os.environ.get('PORT', 5004)), serve_forever=True)\n```\n\n这里需要注意几点：\n\n\
    *   `rasa_core` 中的 `_check_token` 方法基本上如下所示，它会发起一个 API 调用来获取用户对象。这主要完成用户级认证/鉴权的工作。在我们重写的方法中，我们保持简单，以便使其工作并理解其用法。\n\
    \n    ```python\n    def _check_token(self, token):\n        url = \"{}/users/me\"\
    .format(self.base_url)\n        headers = {\"Authorization\": token}\n       \
    \ logger.debug(\"Requesting user information from auth server {}.\".format(url))\n\
    \        result = requests.get(url, headers=headers, timeout=DEFAULT_REQUEST_TIMEOUT)\n\
    \        if result.status_code == 200:\n            return result.json()\n   \
    \     logger.info(\"Failed to check token: {}. Content: {}\".format(token, request.data))\n\
    \        return None\n    ```\n\n*   使用 Rasa 自己的 `_check_token` 方法可能需要你编写一个 API\
    \ 或 Web 服务，该服务接受请求并以指定方式返回响应。\n*   确保将动作的服务器端点更改为你自己的 URL。\n*   记住，代码中的 `mysecret`\
    \ 字符串稍后将用于发起 API 调用。\n\n## 编写 Procfile 并部署到 Web\n\n到现在为止，你一定已经非常熟悉为 Heroku 部署创建\
    \ Procfile 了。我们将再次使用现有的 Procfile 并进行修改，以将基于 API 的聊天机器人部署到 Web。在备份现有文件后，可以随意创建一个新的\
    \ Procfile。\n\n以下是我的 Procfile 内容：\n\n```\nweb: python -m spacy download en &&\
    \ python myown_chatbot.py\n```\n\n完成后，只需执行我们在部署 Facebook Messenger 和 Slack 机器人时已经学会的下一组命令。\n\
    \n```bash\n$ git init\n$ heroku git:remote -a <your-heroku-app-name>\n$ git add\
    \ .\n$ git commit -am \"deploy my bot\"\n$ git push heroku master\n```\n\n执行完最后一条命令后，你将收到来自\
    \ Heroku 的一些日志，内容涉及部署版本、对应用所做的更改等。\n\n## 验证你的聊天机器人 API\n\n在收到部署成功的消息后，让我们测试一下我们的聊天机器人\
    \ API 是否正常工作。为了快速进行健康检查，请访问以下 URL：\n\n`<your-basic-app-url>/webhooks/rasa/`\n\n\
    例如：`https://horoscopebot1212.herokuapp.com/webhooks/rasa/`\n"
- fmt: "# 排版后的内容\n\n打开`com/webhooks/rasa/`这个URL，浏览器应返回类似如下的响应。如果返回状态为\"ok\"，那么一切就绪——放松、坐好，开始调试。\n\
    \n```\n{\"status\":\"ok\"}\n```\n\n有时仅凭这个验证可能不够，因此我们通过实际测试来检查聊天机器人是否能正确识别意图并给出相应回复。\n\
    \n我将使用`POSTMAN`工具（`POSTMAN`是一个非常好用的基于GUI的API测试工具）。你可以使用任何你熟悉的工具。我们只需测试聊天机器人应该理解和响应的其中一个意图。我测试了问候意图，它完美地工作了。机器人返回了预期的响应，如图5-19所示。\n\
    \n![](image-93k59juh.png)\n\n图5-19. 在POSTMAN中测试聊天机器人API\n\n## 创建聊天机器人UI\n\n正如我们在第二步中讨论的，我们需要有自己的UI来为用户与聊天机器人之间的对话提供一个友好的界面。如果你是前端开发者，或者团队中有前端开发者，你可以轻松地将我们构建的聊天机器人API交给他们，前端团队应该能够轻松地将其集成到他们的聊天机器人UI中。他们可以使用常规的HTTP调用来消费这些API。WebSocket是实现聊天机器人的更好方式，但这不在本书的讨论范围内。\n\
    \n如果你不熟悉HTML/CSS/JavaScript等前端技术，那么我推荐阅读《Pro HTML5 with CSS, JavaScript, and Multimedia》（Apress,\
    \ 2017）。\n\n为了方便我们的读者——或者应该说学习者——我们创建了一个聊天机器人和用户对话所需的基本UI。你可以在GitHub或Apress的网站上找到完整的可运行代码。我将告诉你使其适用于你的机器人所需的配置。\n\
    \n下载本章代码后，你会在主文件夹内找到一个名为`Go to this folder`的文件夹，然后进入`assets -> js -> script.js`文件。\n\
    \n将以下JavaScript代码行修改为你自己的端点URL。如果你的应用名称不同，那么下面的URL在你的情况下也会不同。在JavaScript代码中使用你自己的URL和令牌，如下面的URL所示。\n\
    \n```\nvar baseUrl = \"https://horoscopebot1212.herokuapp.com/webhooks/rasa/ webhook?token=YOUR-SECRET\"\
    ;\n```\n\n保存文件，在浏览器中打开`index.html`文件，你就能看到一个现成的聊天机器人UI。但是，从本地提供的简单HTML页面进行API调用会引发CORS问题。因此，为了避免这种情况，我们将对现有的`myown_chatbot.py`进行一些修改，以便从Heroku应用本身提供HTML服务。\n\
    \n将你的`myown_chatbot.py`修改为以下内容，然后我们将讨论所做的修改。\n\n```python\nimport os\n\nfrom rasa_core.channels.rasa_chat\
    \ import RasaChatInput\n\nfrom rasa_core.channels.channel import CollectingOutputChannel,\
    \ UserMessage\nfrom rasa_core.agent import Agent\n\nfrom rasa_core.interpreter\
    \ import RasaNLUInterpreter\nfrom rasa_core.utils import EndpointConfig\n\nfrom\
    \ rasa_core import utils\nfrom flask import render_template, Blueprint, jsonify,\
    \ request\n\n# load your trained agent\n\ninterpreter = RasaNLUInterpreter(\"\
    models/nlu/default/horoscopebot/\")\nMODEL_PATH = \"models/dialogue\"\n\naction_endpoint\
    \ = EndpointConfig(url=\"https://horoscopebot1212-actions.herokuapp.com/webhook\"\
    )\n\nagent = Agent.load(MODEL_PATH, interpreter=interpreter, action_endpoint=action_endpoint)\n\
    \nclass MyNewInput(RasaChatInput):\n    @classmethod\n    def name(cls):\n   \
    \     return \"rasa\"\n\n    def _check_token(self, token):\n        if token\
    \ == 'secret':\n            return {'username': 1234}\n        else:\n       \
    \     print(\"Failed to check token: {}.\".format(token))\n            return\
    \ None\n\n    def blueprint(self, on_new_message):\n        templates_folder =\
    \ os.path.join(os.path.dirname(os.path.abspath(__file__)), 'myown_chatbot')\n\
    \        custom_webhook = Blueprint('custom_webhook', __name__, template_folder=templates_folder)\n\
    \n        @custom_webhook.route(\"/\", methods=['GET'])\n        def health():\n\
    \            return jsonify({\"status\": \"ok\"})\n\n        @custom_webhook.route(\"\
    /chat\", methods=['GET'])\n        def chat():\n            return render_template('index.html')\n\
    \n        @custom_webhook.route(\"/webhook\", methods=['POST'])\n        def receive():\n\
    \            sender_id = self._extract_sender(request)\n            text = self._extract_message(request)\n\
    \            should_use_stream = utils.bool_arg(\"stream\", default=False)\n \
    \           if should_use_stream:\n                return Response(\n        \
    \            self.stream_response(on_new_message, text, sender_id),\n        \
    \            content_type='text/event-stream')\n            else:\n          \
    \      collector = CollectingOutputChannel()\n                on_new_message(UserMessage(text,\
    \ collector, sender_id))\n                return jsonify(collector.messages)\n\
    \n        return custom_webhook\n\ninput_channel = MyNewInput(url='https://horoscopebot1212.herokuapp.com')\n\
    # set serve_forever=False if you want to keep the server running\ns = agent.handle_channels([input_channel],\
    \ int(os.environ.get('PORT', 5004)), serve_forever=True)\n```\n\n以下是我们所做的修改：\n\
    \n- 在我们的类中重写了现有的`name`和`blueprint`方法，这让我们可以创建自己的端点，同时也赋予我们定义其行为的自由。\n- 我们创建了一个新的端点`/chat`，并提供了`index.html`文件，这其实就是聊天机器人的UI。因此，这将成为我们聊天机器人的主页链接。\n\
    - 我们导入了一些必要的类和方法，例如`utils`和`UserMessage`，以使一切正常工作。\n\n保存文件，并使用以下命令将更改再次部署到我们的Heroku应用：\n\
    \n```\n$ git add .\n$ git commit -am \"deploy my bot\"\n$ git push heroku master\n\
    ```\n\n部署成功后——瞧！我们的机器人已经准备好与全世界分享了，它使用两个Heroku应用：一个用于对话管理，一个用于动作执行。\n\n在浏览器中打开以下URL，我们应该能看到自定义的聊天机器人UI：\n\
    \n`https://horoscopebot1212.herokuapp.com/webhooks/rasa/chat`\n\n图5-20.1和5-20.2展示了我的聊天机器人在对话过程中的样子。\n\
    \n![](image-foi29c75.png)\n\n图5-20.1."
