  trans: "\n在浏览器中打开 `com/webhooks/rasa/` 这个网址，应该会得到类似如下的响应。如果返回的状态是“ok”，那么一切就绪——放松、坐好，开始调试吧。\
    \  \n`{\"status\":\"ok\"}`  \n\n有时仅凭这种验证可能还不够，所以让我们通过实际测试来检查聊天机器人是否能正确识别意图并据此给出响应。\
    \  \n\n我将使用 POSTMAN 工具（POSTMAN 是一款非常优秀的基于 GUI 的 API 测试工具）。你也可以使用任何自己熟悉的工具。我们只需测试聊天机器人应该理解和响应的其中一个意图。我测试了问候意图，效果非常好。机器人返回了预期的响应，如图\
    \ 5-19 所示。  \n\n![](img/image-93k59juh.png)  \n\n图 5-19. 在 POSTMAN 中测试聊天机器人 API\
    \  \n\n### 创建聊天机器人 UI  \n\n正如我们在第二步中讨论的，我们需要拥有自己的 UI，为聊天机器人和用户之间的对话提供一个友好的界面。如果你是前端开发人员，或者团队中有前端开发人员，你可以轻松地将我们目前构建的聊天机器人\
    \ API 交给他们，前端团队应该能够轻松地将其集成到他们的聊天机器人 UI 中。他们可以使用常规的 HTTP 调用来消费这些 API。WebSocket\
    \ 是实现聊天机器人的更好方式，但这不在本书的讨论范围内。  \n\n如果你不熟悉 HTML/CSS/JavaScript 等前端技术，那么我推荐阅读《Pro\
    \ HTML5 with CSS, JavaScript, and Multimedia》（Apress, 2017）。  \n\n为了方便我们的读者——或者更准确地说，学习者——我们创建了一个聊天机器人和用户对话所需的基本\
    \ UI。你可以在 GitHub 或 Apress 网站上找到完整的可运行代码。我只会告诉你需要如何配置才能让它为你的机器人工作。  \n\n下载本章的代码后，你会在主文件夹内找到一个名为\
    \ `Go to this folder` 的文件夹，然后进入 `assets -> js -> script.js` 文件。  \n\n将下面这行 JavaScript\
    \ 代码中的 URL 替换为你自己的端点 URL。如果你的应用名称不同，那么下面的 URL 也会有所不同。请使用你自己的 URL，并在 JavaScript\
    \ 代码中包含令牌，如下面的 URL 所示：  \n\n```javascript\nvar baseUrl = \"https://horoscopebot1212.herokuapp.com/webhooks/rasa/webhook?token=YOUR-SECRET\"\
    ;\n```\n\n保存文件，然后在浏览器中打开 `index.html` 文件，你应该能立即看到一个可用的聊天机器人 UI。但是，从本地提供的简单 HTML\
    \ 页面发起 API 调用会引发 CORS 问题。因此，为了避免这种情况，我们将对现有的 `myown_chatbot.py` 进行一些修改，使其能够直接从我们的\
    \ Heroku 应用提供 HTML 服务。  \n\n将你的 `myown_chatbot.py` 修改为以下内容，然后我们将讨论所做的更改：  \n\n\
    ```python\nimport os\n\nfrom rasa_core.channels.rasa_chat import RasaChatInput\n\
    \nfrom rasa_core.channels.channel import CollectingOutputChannel, UserMessage\n\
    from rasa_core.agent import Agent\n\nfrom rasa_core.interpreter import RasaNLUInterpreter\n\
    from rasa_core.utils import EndpointConfig\n\nfrom rasa_core import utils\nfrom\
    \ flask import render_template, Blueprint, jsonify, request\n\n# 加载你训练好的智能体\n\
    interpreter = RasaNLUInterpreter(\"models/nlu/default/horoscopebot/\")\nMODEL_PATH\
    \ = \"models/dialogue\"\n\naction_endpoint = EndpointConfig(url=\"https://horoscopebot1212-actions.herokuapp.com/webhook\"\
    )\n\nagent = Agent.load(MODEL_PATH, interpreter=interpreter, action_endpoint=action_endpoint)\n\
    \nclass MyNewInput(RasaChatInput):\n    @classmethod\n    def name(cls):\n   \
    \     return \"rasa\"\n\n    def _check_token(self, token):\n        if token\
    \ == 'secret':\n            return {'username': 1234}\n        else:\n       \
    \     print(\"Failed to check token: {}.\".format(token))\n            return\
    \ None\n\n    def blueprint(self, on_new_message):\n        templates_folder =\
    \ os.path.join(os.path.dirname(os.path.abspath(__file__)), 'myown_chatbot')\n\
    \        custom_webhook = Blueprint('custom_webhook', __name__, template_folder=templates_folder)\n\
    \n        @custom_webhook.route(\"/\", methods=['GET'])\n        def health():\n\
    \            return jsonify({\"status\": \"ok\"})\n\n        @custom_webhook.route(\"\
    /chat\", methods=['GET'])\n        def chat():\n            return render_template('index.html')\n\
    \n        @custom_webhook.route(\"/webhook\", methods=['POST'])\n        def receive():\n\
    \            sender_id = self._extract_sender(request)\n            text = self._extract_message(request)\n\
    \            should_use_stream = utils.bool_arg(\"stream\", default=False)\n \
    \           if should_use_stream:\n                return Response(\n        \
    \            self.stream_response(on_new_message, text, sender_id),\n        \
    \            content_type='text/event-stream')\n            else:\n          \
    \      collector = CollectingOutputChannel()\n                on_new_message(UserMessage(text,\
    \ collector, sender_id))\n                return jsonify(collector.messages)\n\
    \n        return custom_webhook\n\ninput_channel = MyNewInput(url='https://horoscopebot1212.herokuapp.com')\n\
    # 如果你希望保持服务器运行，请设置 serve_forever=False\ns = agent.handle_channels([input_channel],\
    \ int(os.environ.get('PORT', 5004)), serve_forever=True)\n```\n\n以下是我们所做的更改： \
    \ \n\n-   在我们的类中重写了现有的 `name` 和 `blueprint` 方法，这让我们能够创建自己的端点，并自由定义其行为。  \n-  \
    \ 我们创建了一个新的端点 `/chat`，并提供了 `index.html` 文件，该文件正是聊天机器人的 UI。因此，这将成为我们聊天机器人的主页链接。\
    \  \n-   我们导入了一些必要的类和方法，例如 `utils` 和 `UserMessage`，以确保一切正常运行。  \n\n保存文件，然后使用以下命令将更改再次部署到我们的\
    \ Heroku 应用：  \n\n```bash\n$ git add .\n$ git commit -am \"deploy my bot\"\n$\
    \ git push heroku master\n```\n\n部署成功后——瞧！我们的机器人已经准备好与全世界分享了。它通过两个 Heroku 应用协同工作：一个用于对话管理，另一个用于执行动作。\
    \  \n\n在浏览器中打开以下 URL，我们应该能看到自定义的聊天机器人 UI：  \n\n`https://horoscopebot1212.herokuapp.com/webhooks/rasa/chat`\
    \  \n\n图 5-20.1 和 5-20.2 展示了我的聊天机器人在对话过程中的样子。  \n\n![](img/image-foi29c75.png)\
    \  \n\n图 5-20.1.  \n"
- fmt: "# Your Own Custom Chatbot on Your Own Website\n\n![Figure 5-20.2](image-iwsheqsj.png)\n\
    \n**Figure 5-20.2.** Your own custom chatbot on your own website\n\nUsing Heroku’s\
    \ custom domain name features, one can easily point the same app to their own\
    \ website’s name. Do that when you feel your chatbot is good enough to be opened\
    \ to the entire world for profit or non-profit purposes.\n\nSo, that’s all folks!\
    \ That’s how chatbots are built with Python using Natural Language Processing\
    \ and machine learning. I hope this chapter along with the previous chapters was\
    \ helpful to you and you could learn the practical approach toward learning and\
    \ building chatbots.\n\n## Summary\n\nIn this chapter, we learned how to deploy\
    \ our own app to our own servers using Heroku. We learned how to integrate our\
    \ chatbot with Facebook using Facebook’s developer platform. We also learned to\
    \ create a custom chatbot for a Slack app and tested it as well. Finally, as promised\
    \ at the end of chapter-III, removing all dependencies from any social media platform,\
    \ we created our own UI and deployed it on Heroku and tested it. We saw it working\
    \ like a charm—it worked while training it. As we have a basic model up and working,\
    \ now you can handle cases where chatbot doesn’t work well. Determine if it’s\
    \ an issue related to data or training, actions server, or custom code handling.\
    \ Once you find the root cause, fix that, deploy again, and check to see if chatbot\
    \ improves. We build big software by starting small.\n\nI am looking forward to\
    \ hearing from you and curious to know what chatbot you built after going through\
    \ this book. I will be happy to help you anytime if you are stuck on any concepts,\
    \ code execution, or deployment.\n\nThanks and Cheers.\n\n## Index\n\n### A\n\
