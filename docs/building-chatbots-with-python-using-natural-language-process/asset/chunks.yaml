- fmt: 'Go to `Messenger ➤ Settings ➤ Setup Webhooks`. You will get a pop-up like
    Figure 3-18. Add your callback url and verify the token.


    ![](image-yb07js9b.png)


    Figure 3-18. Setting up webhooks in Facebook for Dialogflow bot


    Check the `messages` and `messaging_postbacks` options under Subscription Fields.
    You can definitely choose whichever is needed for your use-case. Click the Verify
    and Save button. Check Figure 3-18 for reference.


    You’ll be taken back to the settings page and Webhooks should have a “Complete”
    status. Make sure to select a page to which you can subscribe your webhook for
    page events.


    ## Testing the Messenger Bot


    To be able to make our bot available for testing, we’ll need to make our app public:


    Click on App Review in the left menu of the Facebook Developer Console. Click
    on the switch under Make `<your APP Name>` public? If you get an Invalid Privacy
    Policy URL prompt, then go to the Basic Settings link in the dialog box and, if
    you haven’t already, put any URL for the Privacy Policy URL, for the time being
    and then click on Save Changes. Now, go back to the App Review page and try to
    switch the app to public again.


    You’ll be prompted to choose a category for your app. Choose Education from the
    list. Feel free to choose whichever suits your bot best. Click the Confirm button
    as shown in the Figure 3-19, Making your facebook app public.


    ![](image-hlss6emz.png)


    Figure 3-19. Making your facebook app public


    We will also need to create a username for our page. This is the username users
    will chat with when using our bot. To set the username, click the Create Page
    @Username link under the About section of your page, as shown in Figure 3-20.
    This is helpful to share your page or bot with people using just a short name.


    ![](image-q6oqwien.png)


    Figure 3-20. Creating your Facebook bot''s page username


    Let’s test the same flow of our bot on Facebook Messenger that we tested on Dialogflow’s
    website. You should be able to see how my Facebook Messenger bot responded by
    referring from Figure 3-21.1 up-to Figure 3-21.4.


    ![](image-g64dgtqj.png)


    Figure 3-21.1. Facebook Messenger OnlineEatsBot Demo Screen I


    ![](image-wvlzfznn.png)


    Figure 3-21.2. Facebook Messenger OnlineEatsBot Demo Screen II


    ![](image-eq4dd3f9.png)


    Figure 3-21.3. Facebook Messenger OnlineEatsBot Demo Screen III


    ![](image-58kk3pbo.png)


    Figure 3-21.4. Facebook Messenger OnlineEatsBot Demo Screen IV


    And that, folks, is how we build our bot.


    Chapter 4 is going be even more interesting. In Chapter 4, we will try to achieve
    the same without having to depend on Dialogflow’s API or dashboard.


    It’s always good when you have full control over everything you have, isn’t it?


    **Note:** You can go to your account settings and export an agent or import other
    agents directly. You can download the zip file. You can use this zip to import
    this into Dialogflow and play with the chatbot we built in this chapter.


    You must be wondering, what if I wanted to make the order placement in real-time
    and find the order status using APIs of the vendor/restaurant and reply to the
    user accordingly? It could be any API call you want to make—retrieve the data
    in real-time and formulate the bot’s response. It’s time to know how to do that
    before we wrap up this chapter and get ready for the next one.


    Let’s learn about something called in Dialogflow.`Fulfillment`


    In order to get some real-time information requested by a user, we need to develop
    some API or use existing ones. To achieve that using Dialogflow, we would need
    to set up which requires deploying a service and calling an API.


    We will not go into the nitty-gritty of building APIs and how to deploy it but
    if you have ever tried using any Google or Facebook APIs, you should be familiar
    with at least how to call them.


    I have built a small Flask-based API and deployed it to Heroku. I will be using
    it for fulfillment, which just takes any `order_id` in the url and returns a random
    `order_status`. If you are not familiar with Heroku, then do not worry, you can
    run the code provided on your local system and test it. In the upcoming chapter,
    we’ll be deploying lots of application using Heroku where you can learn things
    related to it.


    In the code you can read how `order_identity`, `intentName`, etc., are parsed.
    Find the code here: `flask_onlineeats_demo.zip`


    Request URL: `https://radiant-bayou-76095.herokuapp.com/onlineeatsbot/`


    `api/v1.0/order_status/`


    So, in Dialogflow Fulfillment will POST the JSON response from the intent to this
    URL, which you would need to parse to get the relevant entities and their values
    and do specific actions.


    You can also try to deploy the sample Flask App code on Heroku and have your own
    endpoint working in your bot for fulfillment.


    Now, Dialogflow will POST the JSON response of the intent for which the webhook
    call is enabled on our endpoint. It has the code to parse the `order_id` entity
    and take actions based on that. Currently, the code only returns a randomly chosen
    status from a list.


    To test if the API is working, go to POSTMAN and test it using the sample data
    in Figure 3-22. If you are running the Flask app on local, then use the local
    url.


    ![](image-k7cauxpl.png)


    Figure 3-22. Testing the fulfillment API deployed on heroku in POSTMAN


    ## Enabling Webhook


    So, let’s go to the fulfillment page in Dialogflow and try to enable webhook (see
    Figure 3-23).


    ![](image-z444ejmj.png)


    Figure 3-23. Setting up webhook for fulfillment in Dialogflow


    Make sure you have enabled webhook call for `user_order_id` intent (see Figure
    3-24).


    ![](image-bdz453lo.png)


    Figure 3-24. Enabling webhook call for specific intent


