  trans: '

    • 它应能理解菜单项及其请求的数量。

    • 聊天机器人应能代表用户下单。

    • 当用户询问时，能提供订单状态。


    列出意图

    在此，我们列出希望聊天机器人训练的意图，以便它在用户询问时能够理解这些意图。


    意图

    • 默认欢迎意图：当用户向聊天机器人发送消息时触发

    • 下单意图：当用户要求机器人点餐时触发

    • 商品描述意图：当用户告知所需商品和数量时触发

    • 订单状态：当用户想了解订单状态时触发

    • 订单 ID：机器人需要理解用户的订单 ID 以进行追踪。

    • 用户感谢：当用户感谢机器人时触发


    列出实体

    我们将在此尝试列出所有意图可能涉及的实体。在后续章节中，我们将看到这些实体如何根据适用的意图进行定义。


    实体

    • food_items：用户想点哪些食物？

    • quantities：用户想点的食物数量是多少？

    • order_id：为用户下单的订单 ID


    构建食品订购聊天机器人

    让我们也设定聊天机器人的期望值，明确它至少应能完成哪些基本任务。为此，我们编写一个聊天机器人与用户之间的对话脚本。这有助于我们坚持计划，在假设用户以友好且正确的方式进行对话的前提下，准备好一个能基本运行的聊天机器人。


    聊天机器人与用户对话脚本：

    用户：你好

    OnlineEatsBot：你好，欢迎光临！有什么可以帮您的吗？

    用户：我想点中餐。

    OnlineEatsBot：好的，您今天想点什么？

    用户：一份鸡肉饺子，两份春卷。

    OnlineEatsBot：完成。您的总金额为 XYZ，已为您下单：1 份鸡肉饺子，2 份春卷。

    用户：我还没收到我的订单。我的食物在哪？

    OnlineEatsBot：请提供您的订单 ID 好吗？

    用户：123456

    OnlineEatsBot：订单 ID：123456 的订单状态。配送员已在您所在区域，您的食物大约 5 分钟内送达。

    用户：谢谢。

    OnlineEatsBot：非常感谢您的配合。


    现在我们已经编写了一个基本脚本来指导构建聊天机器人，接下来我们将深入探讨 Dialogflow。


    Dialogflow 入门

    让我们按照以下步骤在 Dialogflow 中创建账户，然后创建一个代理。（代理其实就是聊天机器人的另一种说法。）


    在 Dialogflow 创建账户并登录。

    创建一个代理。

    ![](img/image-h773tmys.png)

    图 3-2. 在 Dialogflow 中创建新代理


    输入详细信息，如代理名称、时区、默认语言以及您想选择或新建的 Google 项目。


    创建意图。

    查看图 3-3，您会发现系统已经提供了两个意图。


    • 默认回退意图：如果用户的输入与任何常规意图或启用的内置闲聊都不匹配，则会触发回退意图。创建新代理时，会自动创建一个默认回退意图。您可以根据需要修改或删除它。

    • 默认欢迎意图：我们可以扩展此欢迎意图用于自己的聊天机器人。您应该添加一些自己的用户表述和默认响应。

    ![](img/image-dfb2ywfd.png)

    图 3-3. 在 Dialogflow 中创建意图


    在创建我们自己的意图之前，让我们先在默认欢迎意图中添加一些表述，并按照以下步骤使其就绪：


    点击默认欢迎意图。

    在“训练短语”中添加您自己的用户表述。

    点击“保存”。


    当我们点击保存时，后台的机器学习模型会运行并训练我们提供的数据（即用户表述）。训练数据意味着让机器根据我们提供的数据理解这是什么类型的意图，并能够在接收到新数据时进行预测。例如，查看图
    3-4，我们定义了五个用户表述，机器已知这些表述属于“欢迎意图”。如果用户说“Hello there”（该表述未在任何地方定义），会发生什么？机器仍会将“Hello
    there”归类为默认欢迎意图，因为训练中使用的特征以及机器对欢迎意图的理解与新用户表述中的特征相似。

    ![](img/image-xpujxk7c.png)

    图 3-4. 在 Dialogflow 中定义默认欢迎或问候意图


    让我们测试一下欢迎意图是否有效。使用 Dialogflow，我们可以在仪表板中直接进行测试。见图 3-5。

    ![](img/image-ru8shcrc.png)

    图 3-5. 在 Dialogflow 中测试欢迎意图


    创建意图时的注意事项

    让我们了解一些在 Dialogflow 中创建意图时的重要知识点。


    • Dialogflow 的意图还具备为每个意图设置默认响应的功能。默认响应是每次识别到该意图时返回给用户的响应。在我们的示例中，当用户说“Hello there”时，我们会从机器人那里得到“Hello!”作为响应。

    • 如果您愿意，可以添加更多响应或删除现有响应。拥有多个响应能让机器人看起来更真实，这样它就不会每次都回复相同的内容，让与机器人对话的用户感觉更人性化。

    • Dialogflow 中的意图还可以标记为对话结束。换句话说，您可以让机器人假设用户将不再参与对话，机器人可以根据此信息执行必要操作来结束对话。


    创建意图并添加表述

    现在我们已经创建了欢迎意图，接下来创建下单意图，我将其命名为“下单意图”。


    以下是我输入的用户表述：

    我想要食物

    我想尽快点餐

    你能帮我点餐吗？

