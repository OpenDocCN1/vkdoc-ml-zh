    \  \n\n在训练模型时，你可以更改故事文件的来源（使用上述文件），也可以将新生成的故事复制粘贴到原始的 `stories.md` 文件中。现在，我将把这些故事复制粘贴到原始的\
    \ `stories.md` 文件中。在测试或再次进行交互式学习之前，请务必重新运行模型。\n\n## 测试机器人\n\n测试机器人是我们交互式学习过程的一部分。我们会不断检查最初为机器人设想的所有可能场景，并据此进行训练。我测试了**星座运势机器人**的其他一些场景，并进行了相应训练。以下是其中一个场景，与我们本章前面所做的略有不同。\n\
    \n### 测试用例 1\n\n让我们运行第一个测试：\n\n**用户**：你好！  \n**HoroscopeBot**：你好！有什么可以帮你的吗？  \n\
    **用户**：今天摩羯座的运势如何？  \n**HoroscopeBot**：你今天的星座运势：  \n\n> 从失败到成功的旅程是由乐观驱动的。今天你会非常乐观——关于你的工作、未来以及一切能引领你走向成功的事情，Ganesha\
    \ 说。在处理日常工作时，你也会非常细心，并会抓住每一个能让你离目标更近一步的机会。实现梦想所需的只是决心和好运；今天你两者都将拥有。\n\n**HoroscopeBot**：你想订阅每日更新吗？\
    \  \n**用户**：请帮我订阅。  \n**HoroscopeBot**：您已成功订阅。\n\n正如你在用户和聊天机器人之间的这段对话中所看到的，我们测试了机器人是否能够处理用户自己在询问当日运势时提供星座名称的场景。在这种情况下，机器人处理得很好，最终会询问是否订阅，并根据用户的回复采取相应行动。\n\
    \n你应该对机器人的对话进行健全性测试，以确定正常流程是否正常工作。\n\n我还测试了 `stories.md` 文件中提到的故事——当用户直接要求订阅时——它也运行良好。\n\
    \n### 测试用例 2\n\n现在进行第二个测试：\n\n**用户**：嗨  \n**HoroscopeBot**：你好！有什么可以帮你的吗？  \n**用户**：请帮我订阅每日更新。\
    \  \n**HoroscopeBot**：您已成功订阅。\n\n我还会添加一些新的故事，以便机器人能够完美运行。\n\n但到目前为止，我们已经有了一个功能完整的机器人。在\
    \ GitHub 上的第二个版本代码中，你还会发现机器人能够纠正星座名称的拼写错误、根据用户的出生日期获取星座、发送告别消息等功能。我强烈建议你查看代码的实现方式并提供反馈。但在那之前，先思考一下如何实现以及改动会放在哪里。我们有意没有在本章中提及其他用例的代码，以免在你专注于学习行业技巧时感到混乱。\n\
    \n你可以从我们的 GitHub 仓库下载最新的 Python 代码和 Jupyter Notebook，并尝试安装正确的包来运行它。你会发现代码中处理了更多本章讨论的用例。\n\
    \n## 总结\n\n在本章中，我们学习了 Rasa-NLU，以及为什么 Rasa-NLU 比市场上任何其他开源工具更好。我们学习了如何通过在我们的管道配置中使用\
    \ tensorflow、sklearn 和 keras 来配置管道。\n\n我们学习了如何在本地系统上从头开始创建一切，而不依赖于任何需要使用其 API\
    \ 的服务（如 Dialogflow、wit.ai 等）。我们还学习了如何创建故事，如何训练 NLU 模型和对话模型，并使用 Rasa Core 将它们结合起来，通过最酷的功能——交互式学习——来训练构建机器人。我们还大致了解了如何借助\
    \ rasa-nlu-trainer 等开源工具轻松创建和标注训练数据。我希望这一章对你来说比其他任何章节都更具互动性。如果你还没有成就感，那么请准备好迎接下一章，我们将真正把它带给我们的观众，并向世界展示机器人的能力。我们将学习如何将本章的聊天机器人集成到\
    \ Facebook 和 Slack 等不同平台，使用我们自己的 Web 服务器。\n\n继续训练你的机器人，直到下一章我们将其上线。下一章见。\n\n##\
    \ 第五章  \n––––––––  \n部署你的聊天机器人  \n\n在本章中，我们将学习如何将我们的聊天机器人部署到网络上。有多种方式和渠道可以将聊天机器人\
    \ Web 应用部署或暴露给外部世界。例如，我们可以将带有 NLU 和对话模型的 HoroscopeBot 部署到 Facebook 和 Slack 上，因为它们已经提供了用户界面。你可能也希望拥有一个完全运行在自己服务器上的\
    \ Web 应用。在本章结束时，我们还将探讨如何使用自己的用户界面将聊天机器人部署到我们自己的服务器上。\n\n### 第一步\n\n第一步是复制你在第 4\
    \ 章中构建的现有聊天机器人，并创建一个新副本，以便你有一个备份。"
- fmt: "Since we will be doing some changes by adding some new code, let’s keep both\
    \ the projects separate. So, I created a new folder called and pasted my `horoscope_bot`\
    \ folder in there. So, now all my model files, datasets, and code files are copied,\
    \ which I can directly use for deployment.\n\n## Rasa’s Credential Management\n\
    \nRasa provides a way to manage all your credentials at one place. You may have\
    \ one single model, but you may want it to be deployed on various other platforms\
    \ like Facebook, Slack, Telegram, etc. All of these third-party platforms need\
    \ some credentials to be used while connecting. These credentials are stored in\
    \ a YAML file called `credentials.yml`. Let’s create a file named `credentials.yml`\
    \ file in our project directory `horoscope_bot` folder and add our Facebook credentials\
    \ there. If you don’t know how to get that then just create the file for now,\
    \ and in the next section of this chapter you can find the steps to get Facebook\
    \ credentials.\n\n––––––––  \n© Sumit Raj 2019  \nS. Raj, Building Chatbots with\
    \ https://doi.org/10.1007/978-1-4842-4096-0_5  \n155\n\nContents of `credentials.yml`\
    \ will look like this:\n\n```yaml\nfacebook:\n  verify: \"horoscope-bot\"\n  secret:\
    \ \"bfe5a34a8903e745e32asd18\"\n  page-access-token: \"HPaCAbJJ1JmQ7qDedQKdjEAAbO4iJKr7H9nx4rEBAAuFk4Q3g\
    \ PQcNT0wtD\"\n```\n\nThese credentials are dummy credentials; the length of the\
    \ token or secret and characters type may differ for your Facebook app.\n\nIf\
    \ you are working on a big project where you are integrating your chatbot on various\
    \ platforms and you want to make the project more maintainable, then it’s best\
    \ to make use of `credentials.yml`. I highly recommend you maintain a `credentials.yml`\
    \ if you are a business and trying to build a bot that works on various platforms\
    \ like Facebook, Slack, Twitter, Telegram, or your own website in the same way.\
    \ Managing keys and secrets becomes easier in this case.\n\nA good way to manage\
    \ application-level secret keys is to store the keys as environment variables\
    \ and write the code to read the values of secret keys or any other sensitive\
    \ information from the operating system’s environment itself. Remember, it’s never\
    \ a good idea to keep any kind of keys inside your code.\n\nYou can also create\
    \ a dot (`.env`) file on your server and read keys from this file, which is not\
    \ tracked anywhere in your code repository.\n\nFor the sake of simplicity, we\
    \ are going to use the access keys and secret keys in our standalone scripts for\
    \ deployment. We are going to make it simple to understand so that you are first\
    \ able to build the bot, then you can try to scale it, and most importantly you\
    \ can think about security-level issues.\n\nIn case you need to deploy your bot\
    \ on multiple platforms and want to use `credentials.yml` to maintain different\
    \ credentials, then you can use it by passing an extra argument. For an example\
    \ to use the above credentials file named `credentials.yml` while running `rasa_core`,\
    \ you can use the below command.\n\n```bash\npython -m rasa_core.run -d models/dialogue\
    \ -u models/nlu/current —port 5002—credentials credentials.yml\n```\n\nIt is good\
    \ to know for bigger enterprise-level chatbots development, but as discussed,\
    \ we’ll be using the credentials directly in our script in our upcoming examples.\n\
    \n## Deploying the Chatbot on Facebook\n\nIn this section we are first going to\
    \ deploy our chatbot using Heroku in the cloud. Heroku is a platform-as-a-service\
    \ (PaaS) that enables developers to build, run, and operate applications entirely\
    \ in the cloud. The benefit of Heroku is that we can easily get our app running\
    \ on `https` without much pain. We don’t need to go and buy SSL certificates while\
    \ we are learning and testing our chatbots. The reason why `https` is required\
    \ is because some platforms like Facebook do not allow developers to use non-`https`\
    \ URLs as callback URLs.\n\nWe’ll be following a set of steps one-by-one to successfully\
    \ deploy our chatbot as a web service in the cloud. Once we have done that successfully,\
    \ it will be way easier to integrate it with different platforms like Slack, Telegram,\
    \ etc. So, let’s start.\n\n### Creating an App on Heroku\n\nLet’s get started:\n\
    \n1. Sign up on Heroku, create an app, and name it `something-actions`, as this\
    \ is going to be our actions server app. Have a look at the screenshot in Figure\
    \ 5-1, where you can give a unique name for your actions server, which should\
    \ be available on Heroku. Once that name seems available, you can click on the\
    \ **Create app** button to create the actions server app.\n\nFeel free to name\
    \ it anything you want if your name is not available, but always try to give meaningful\
    \ names.\n\n![](image-n247gcw0.png)  \n**Figure 5-1.** Creating the action server\
    \ app on Heroku with the name `horoscopebot1212-actions`\n\n### Setting Up Heroku\
    \ on Your Local System\n\nInstall Heroku CLI on your local operating system. Refer\
    \ to this link: [https://](https://). If you are on macOS, use the following command:\n\
    \n```bash\nbrew install heroku/brew/heroku\n```\n\n### Creating and Setting Up\
    \ an App at Facebook\n\nTo be able to deploy our chatbot on Facebook, first we\
    \ need to have credentials of the Facebook app. In order to get the Facebook credentials,\
    \ we need to set up a Facebook app and a page, like we did in one of our Chapter\
    \ 3.\n\nGo to [https://developers.facebook.com/](https://developers.facebook.com/)\
    \ and create an app if you don’t have one already. We created one for our `OnlineEatsBot`;\
    \ now we’ll create one for `HoroscopeBot`. Enter the details and click on **Create\
    \ App ID**. Check Figure 5-2 to see how to enter the display name of your bot\
    \ and your contact email.\n\n![](image-fgm7gv0c.png)  \n**Figure 5-2.** Creating\
    \ app on Facebook for developers\n\nOnce your app is created, go to **Basic**\
    \ under **Settings**, and click on the **Show** button under **App Secret**. This\
    \ is your `fb_secret` key. Refer to Figure 5-3 to see where exactly you will get\
    \ your `fb_secret` key.\n\n![](image-vr4x4kow.png)  \n**Figure 5-3.** Getting\
    \ App Secret from Facebook's app\n\nGo to the dashboard for the app and scroll\
    \ down to “Add a Product.” Click **Add Product** and then add **Messenger** (click\
    \ on **Set Up**). Check Figure 5-4."
