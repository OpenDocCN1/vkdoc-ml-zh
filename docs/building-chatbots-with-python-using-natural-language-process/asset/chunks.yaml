- fmt: "您可以使用以下命令安装`rasa_core`：`pip install rasa_core==0.11.1`。如果您正在学习本书中的聊天机器人示例，请确保仅安装上述版本，因为Rasa可能不向后兼容。他们正在迅速推出更新、更优化的方法。\n\
    \n您也可以从GitHub仓库安装`rasa_core`的最新开发版。只需执行以下命令集，这些命令将直接从GitHub获取最新代码，然后再进行安装。\n\n\
    ```\ngit clone https://github.com/RasaHQ/rasa_core.git\ncd rasa_core\npip install\
    \ -r requirements.txt\npip install -e .\n```\n\n让我们尝试运行此代码文件，根据给定的参数训练我们的模型。\n\
    \n```\n$python train_initialize.py\n```\n\n您也可以使用Jupyter的魔术命令，直接从Jupyter Notebook运行此脚本，如下所示：\n\
    \n```\n!python train_initialize.py #Use python3 if you have installed rasa for\
    \ python3\n```\n\n对于像我们这样的小型数据集，模型训练大约需要25到30秒。我在策略列表中除了`MemorizationPolicy`和`KerasPolicy`之外，还添加了`SklearnPolicy`来训练我的模型。不同的策略各有其优势。请阅读更多关于它们的信息，以了解哪种策略更适合您的用例；对于我的数据集，`SklearnPolicy`有时似乎比`KerasPolicy`表现更好。\n\
    \n脚本执行完毕后，您应该会看到类似以下的成功消息：\n\n```\n2018-08-30 04:24:31 Done fitting keras policy\
    \ model\n2018-08-30 04:24:31 Creating states and action examples from collected\
    \ trackers (by MaxHistoryTrackerFeaturizer)... Processed trackers: 96/96 [00:00<00:00,\
    \ 898.31it/s, # actions=75]\n2018-08-30 04:24:31 Created 75 action examples.\n\
    2018-08-30 04:24:31 Done fitting sklearn policy model\n2018-08-30 04:24:31 Model\
    \ directory models/nlu exists and contains old model files. All files will be\
    \ overwritten.\n2018-08-30 04:24:31 Persisted model to '/Users/sumit/apress_all/Chapter\
    \ IV/horoscope_bot/models/nlu'\n```\n\n您还会发现根据模型名称创建了几个文件夹。请确保它们位于您在脚本中指定的`model_path`中。以下是我在`model_path`文件夹中看到的文件夹/文件：\n\
    \n```\npolicy_0_MemoizationPolicy\npolicy_1_KerasPolicy\npolicy_2_SklearnPolicy\n\
    domain.json\ndomain.yml\nPolicy_metadata.json\n```\n\n如果您已验证模型已成功完成执行并已持久化到本地系统，那么我们就可以进入下一步的交互式训练了。\n\
    \n## 通过强化学习进行实时训练\n\n在本节中，我们将编写更多代码来训练我们的对话模型，并在模型输出不正确时重新训练它。\n\n因此，当我们的机器人做错事时，我们会立即介入，通过告诉模型什么是正确的，让它知道其预测是错误的。\n\
    \n无需停止，模型会自行重新训练，完成后，用户与机器人之间的交互会被捕获到一个文件中，并添加到我们现有的训练数据中。它的工作方式更像是每一步都有一个反馈系统，而不是等待最后的单一奖励。\n\
    \n下一步是创建一个名为`endpoints.yml`的新文件，内容如下。\n\n我们将在Python代码文件`train_online.py`中使用此文件。通过此配置，我们可以将Rasa方法暴露为HTTP\
    \ API。\n\n```\naction_endpoint:\n  url: http://localhost:5055/webhook\n  #nlg:\n\
    \  #  url: http://localhost:5056/nlg\ncore_endpoint:\n  url: http://localhost:5005\n\
    ```\n\n现在，让我们为在线/交互式训练创建`train_online.py`。\n\n```\nfrom __future__ import absolute_import\n\
    from __future__ import division\nfrom __future__ import print_function\nfrom __future__\
    \ import unicode_literals\nimport logging\n\nfrom rasa_core import utils, train\n\
    from rasa_core.training import online\nfrom rasa_core.interpreter import NaturalLanguageInterpreter\n\
    \nlogger = logging.getLogger(__name__)\n\ndef train_agent(interpreter):\n    return\
    \ train.train_dialog_model(domain_file=\"horoscope_domain.yml\",\n           \
    \                         stories_file=\"data/stories.md\",\n                \
    \                    output_path=\"models/dialog\",\n                        \
    \            nlu_model_path=interpreter,\n                                   \
    \ endpoints=\"endpoints.yml\",\n                                    max_history=2,\n\
    \                                    kwargs={\"batch_size\": 50,\n           \
    \                                 \"epochs\": 200,\n                         \
    \                   \"max_training_samples\": 300\n                          \
    \                  })\n\nif __name__ == '__main__':\n    utils.configure_colored_logging(loglevel=\"\
    DEBUG\")\n    nlu_model_path = \"./models/nlu/default/horoscopebot\"\n    interpreter\
    \ = NaturalLanguageInterpreter.create(nlu_model_path)\n    agent = train_agent(interpreter)\n\
    \    online.serve_agent(agent)\n```\n\n`max_history`是模型要跟踪的状态数量。\n\n在运行最终脚本之前，我们应该了解并准备好一个叫做`rasa-nlu-sdk`的东西。\n\
    \n## `rasa-nlu-sdk`\n\nRasa NLU栈附带`rasa-nlu-sdk`，这是一个用于开发Rasa Core自定义动作的Python\
    \ SDK。对于我们的聊天机器人示例，我们需要定义一些自定义动作，例如调用API获取今日运势，或执行数据库写入操作以将用户添加到订阅列表。\n\n好消息是他们有一个单独的库，我们可以使用`pip`安装它。让我们使用以下命令安装它：\n\
    \n```\npip install rasa-core-sdk==0.11.0\n```\n\n现在，我们需要打开终端的新标签页或一个新的命令行，并在我们的项目目录（即`actions.py`文件所在的位置）中执行以下命令：\n\
    \n```\npython -m rasa_core_sdk.endpoint --actions actions\n```\n\n```\nINFO:__main__\
    \ :Starting action endpoint server...\nINFO:rasa_core_sdk.executor:Registered\
    \ function for 'get_todays_horoscope'.\nINFO:rasa_core_sdk.executor:Registered\
    \ function for 'subscribe_user'.\nINFO:__main__  :Action endpoint is up and running.\
    \ on ('0.0.0.0', 5055)\n```\n\n此命令将启动一个动作服务器，该服务器将监听模型预测的任何自定义动作。"
  raw: 'You can install rasa_core using the following command:   pip install rasa_core==0.11.1
      If you are following the chatbot example in this book, then make sure you installed
    the aforementioned version only, as Rasa may not be backward-compatible. They
    are rapidly coming up with newer and more optimized methods. ![](image-6akh0l3c.png) 
    you can also install the bleeding edge version of rasa_core from the github repo.
    you just have to execute the following set of commands, which will take the latest
    code from github directly before installing.   git clone https://github.com/RasaHQ/rasa_core.git
    cd rasa_core  ![](image-5lnb5yze.png) pip install -r requirements.txt pip install
    -e .   Let’s try to run this code file to train our model as per the given parameters.
      $python train_initialize.py   You can also run this script from Jupyter Notebook
    itself using Jupyter’s magic command, as shown here:   !python train_initialize.py
    #Use python3 if you have installed rasa for python3   It should take about 25
    to 30 seconds for the model to be trained on such a small dataset as ours. I added
    SklearnPolicy in the list of policies along with   MemorizationPolicy and KerasPolicy
    to train my model. Different policies have their own benefits. Read more about
    them to know which may work better for your use-case; for my dataset SklearnPolicy
    seems to be performing better than the KerasPolicy at times.   After the script
    is done executing you should see some successful messages like these:   2018-08-30
    04:24:31 Done fitting keras policy model   2018-08-30 04:24:31 Creating states
    and action examples from collected trackers (by MaxHistoryTrackerFeaturizer)...
    Processed trackers: 96/96 [00:00<00:00, 898.31it/s, # actions=75]   2018-08-30
    04:24:31 Created 75 action examples.   2018-08-30 04:24:31 Done fitting sklearn
    policy model  2018-08-30 04:24:31 Model directory models/nlu exists and contains
    old model files. All files will be overwritten.   2018-08-30 04:24:31 Persisted
    model to ''/Users/sumit/apress_all/Chapter IV/horoscope_bot/models/nlu''   You
    will also find a couple of folders created as per their model name. Make sure
    you have them in the model_path you gave in the script. Below are the folders/files
    I see inside my model_path folder.   policy_0_MemoizationPolicy policy_1_KerasPolicy
    policy_2_SklearnPolicy domain.json   domain.yml Policy_metadata.json   If you
    have validated that your model has successfully completed the execution and has
    persisted the model in your local system, then we are good to go to the next step
    of interactive training.   Real-Time Training by Reinforcement   In this section
    we are going to write some more code to train our dialog model and retrain when
    it gives incorrect output.   So, when our bot does something wrong we immediately
    jump in and let the model know that its prediction is wrong by telling it what
    is right.


    Without having to stop, the model retrains itself, and once we are done, the interaction
    between the user and the bot gets captured to a file and added to our existing
    training data. It works more like a feedback system in every step, rather than
    waiting for a single reward at the end.   The next step is to create a new file
    called endpoints.yml with the below contents.   We’ll be using this file in our
    Python code file train_online.py. With this configuration   we can expose the
    Rasa method as HTTP APIs.   action_endpoint:   url: http://localhost:5055/webhook
      #nlg:   # url: http://localhost:5056/nlg  core_endpoint:   url: http://localhost:5005
      Now, let’s create train_online.py for our online/interactive training purposes.
      from future from future from future from future    import logging   import absolute_import
    import division   import print_function import unicode_literals   from rasa_core
    import utils, train from rasa_core.training import online   from rasa_core.interpreter
    import NaturalLanguageInterpreter   logger = logging.getLogger( name ) def train_agent(interpreter):
      return train.train_dialog_model(domain_file="horoscope_domain.yml",   stories_file="data/stories.md",
    output_path="models/dialog", nlu_model_path=interpreter, endpoints="endpoints.yml",
    max_history=2, kwargs={"batch_size": 50,   "epochs": 200,   "max_training_samples":
    300   })   if name == '' main '':   utils.configure_colored_logging(loglevel="DEBUG")
      nlu_model_path = "./models/nlu/default/horoscopebot" interpreter = NaturalLanguageInterpreter.create(nlu_model_path)
    agent = train_agent(interpreter)   online.serve_agent(agent)    max_history is
    the number of states to keep track of by the model.   Before we go on to run our
    final script, we should know and make   ourselves ready for something called rasa-nlu-sdk.
      rasa-nlu-sdk   Rasa NLU stack comes up with rasa-nlu-sdk, which is a Python
    SDK for the development of custom actions for Rasa Core. As for our chatbot example,
    we need to define a few custom actions, like hitting the API to get today’s horoscope
    or maybe a database writing operations to add the user to the subscribe list.
      The good news is they have a separate library for this, and we can install that
    using pip. Let’s install that using the following command:   pip install rasa-core-sdk==0.11.0
      Now, we need to go to another tab of our terminal or a fresh command line and
    execute the following command in our project directory (the place where our actions.py
    file is): python -m rasa_core_sdk.endpoint—actions actions   INFO: main :Starting
    action endpoint server... INFO:rasa_core_sdk.executor:Registered function for
    ''get_todays_horoscope''. INFO:rasa_core_sdk.executor:Registered function for
    ''subscribe_user''.   INFO:  main  :Action endpoint is up and running. on (''0.0.0.0'',
    5055)   This command will start an action server that will be listening to any
    custom action predicted by the model.'
  trans: "\n你可以使用以下命令安装 rasa_core：`pip install rasa_core==0.11.1`。如果你正在学习本书中的聊天机器人示例，请确保只安装上述版本，因为\
    \ Rasa 可能不向后兼容。他们正在快速推出更新、更优化的方法。![](img/image-6akh0l3c.png) 你也可以从 GitHub 仓库安装\
    \ rasa_core 的最新开发版。只需执行以下命令集，这些命令会在安装前直接从 GitHub 获取最新代码。\n\n```\ngit clone https://github.com/RasaHQ/rasa_core.git\n\
    cd rasa_core\n```\n\n![](img/image-5lnb5yze.png)\n\n```\npip install -r requirements.txt\n\
    pip install -e .\n```\n\n让我们尝试运行这个代码文件，根据给定的参数训练我们的模型。\n\n```\n$python train_initialize.py\n\
    ```\n\n你也可以在 Jupyter Notebook 中直接使用 Jupyter 的魔法命令来运行此脚本，如下所示：\n\n```\n!python\
    \ train_initialize.py #如果你为 python3 安装了 rasa，请使用 python3\n```\n\n在像我们这样的小数据集上训练模型大约需要\
    \ 25 到 30 秒。我在策略列表中除了 `MemorizationPolicy` 和 `KerasPolicy` 之外，还添加了 `SklearnPolicy`\
    \ 来训练我的模型。不同的策略各有其优势。请阅读更多相关内容，了解哪种策略更适合你的用例；对于我的数据集，`SklearnPolicy` 有时似乎比 `KerasPolicy`\
    \ 表现更好。\n\n脚本执行完毕后，你应该会看到一些类似这样的成功消息：\n\n```\n2018-08-30 04:24:31 Done fitting\
    \ keras policy model\n2018-08-30 04:24:31 Creating states and action examples\
    \ from collected trackers (by MaxHistoryTrackerFeaturizer)... Processed trackers:\
    \ 96/96 [00:00<00:00, 898.31it/s, # actions=75]\n2018-08-30 04:24:31 Created 75\
    \ action examples.\n2018-08-30 04:24:31 Done fitting sklearn policy model\n2018-08-30\
    \ 04:24:31 Model directory models/nlu exists and contains old model files. All\
    \ files will be overwritten.\n2018-08-30 04:24:31 Persisted model to '/Users/sumit/apress_all/Chapter\
    \ IV/horoscope_bot/models/nlu'\n```\n\n你还会发现根据模型名称创建了几个文件夹。请确保它们位于你在脚本中指定的 `model_path`\
    \ 中。以下是我在 `model_path` 文件夹中看到的文件夹/文件：\n\n```\npolicy_0_MemoizationPolicy\npolicy_1_KerasPolicy\n\
    policy_2_SklearnPolicy\ndomain.json\ndomain.yml\nPolicy_metadata.json\n```\n\n\
    如果你已验证模型已成功完成执行并持久化到本地系统中，那么我们就可以进入下一步的交互式训练了。\n\n### 通过强化学习进行实时训练\n\n在本节中，我们将编写更多代码来训练我们的对话模型，并在模型输出不正确时重新训练它。\n\
    \n因此，当我们的机器人做错事时，我们会立即介入，通过告诉它正确的答案来让模型知道它的预测是错误的。\n\n无需停止，模型会自行重新训练，一旦我们完成，用户与机器人之间的交互会被捕获到一个文件中，并添加到我们现有的训练数据中。它更像是在每一步都进行反馈，而不是在最后等待单一的奖励。\n\
    \n下一步是创建一个名为 `endpoints.yml` 的新文件，内容如下。\n\n我们将在 Python 代码文件 `train_online.py`\
    \ 中使用这个文件。通过此配置，我们可以将 Rasa 方法暴露为 HTTP API。\n\n```yaml\naction_endpoint:\n  url:\
    \ http://localhost:5055/webhook\n  #nlg:\n  #  url: http://localhost:5056/nlg\n\
    core_endpoint:\n  url: http://localhost:5005\n```\n\n现在，让我们为在线/交互式训练创建 `train_online.py`。\n\
    \n```python\nfrom __future__ import absolute_import\nfrom __future__ import division\n\
    from __future__ import print_function\nfrom __future__ import unicode_literals\n\
    import logging\n\nfrom rasa_core import utils, train\nfrom rasa_core.training\
    \ import online\nfrom rasa_core.interpreter import NaturalLanguageInterpreter\n\
    \nlogger = logging.getLogger(__name__)\n\ndef train_agent(interpreter):\n    return\
    \ train.train_dialog_model(domain_file=\"horoscope_domain.yml\",\n           \
    \                         stories_file=\"data/stories.md\",\n                \
    \                    output_path=\"models/dialog\",\n                        \
    \            nlu_model_path=interpreter,\n                                   \
    \ endpoints=\"endpoints.yml\",\n                                    max_history=2,\n\
    \                                    kwargs={\"batch_size\": 50,\n           \
    \                                 \"epochs\": 200,\n                         \
    \                   \"max_training_samples\": 300\n                          \
    \                  })\n\nif __name__ == '__main__':\n    utils.configure_colored_logging(loglevel=\"\
    DEBUG\")\n    nlu_model_path = \"./models/nlu/default/horoscopebot\"\n    interpreter\
    \ = NaturalLanguageInterpreter.create(nlu_model_path)\n    agent = train_agent(interpreter)\n\
    \    online.serve_agent(agent)\n```\n\n`max_history` 是模型要跟踪的状态数量。\n\n在我们继续运行最终脚本之前，我们应该了解并准备好一个叫做\
    \ `rasa-nlu-sdk` 的东西。\n\n### rasa-nlu-sdk\n\nRasa NLU 栈附带 `rasa-nlu-sdk`，这是一个用于开发\
    \ Rasa Core 自定义动作的 Python SDK。对于我们的聊天机器人示例，我们需要定义一些自定义动作，比如调用 API 获取今日星座运势，或者执行数据库写入操作以将用户添加到订阅列表。\n\
    \n好消息是他们有一个单独的库，我们可以使用 pip 安装它。让我们使用以下命令安装它：\n\n```\npip install rasa-core-sdk==0.11.0\n\
    ```\n\n现在，我们需要打开终端的另一个标签页或一个新的命令行，并在我们的项目目录（即 `actions.py` 文件所在的位置）中执行以下命令：\n\n\
    ```\npython -m rasa_core_sdk.endpoint --actions actions\n```\n\n```\nINFO:__main__\
    \ :Starting action endpoint server...\nINFO:rasa_core_sdk.executor:Registered\
    \ function for 'get_todays_horoscope'.\nINFO:rasa_core_sdk.executor:Registered\
    \ function for 'subscribe_user'.\nINFO:__main__  :Action endpoint is up and running.\
    \ on ('0.0.0.0', 5055)\n```\n\n此命令将启动一个动作服务器，该服务器将监听模型预测的任何自定义动作。\n"
- fmt: "一旦任何动作被触发，它就会执行该动作并根据方法给出响应。动作服务器端点的默认端口是`localhost`上的`5055`。如果你想更改它，可以在命令行中添加`--port`参数。\n\
    \n一个快速的问题浮现在脑海中：为什么？为什么我需要一个单独的服务器来处理这个？为什么我们不能使用纯`Python`？是的，我们可以使用纯`Python`，但假设你需要用其他语言开发所需的动作，或者你已经有一些以API形式暴露的动作。现在，你只需要转到我们已经创建的`endpoints.yml`文件，并使用它来指定你的动作服务器应该从哪里使用，以及你的`core_endpoint`服务器应该在哪里。在生产系统中，这两个服务器可以是拥有完全不同URL的不同服务器。\n\
    \n现在，当我们运行下一个脚本（其中我们提到了`endpoints.yml`文件）时，`Rasa`将读取该文件并获取我们`action_server`的配置，该服务器已经根据我们之前的配置启动并运行。\n\
    \n```\naction_endpoint:\n  url: http://localhost:5055/webhook\n```\n\n让我们在一个新的命令行终端中运行`train_online.py`。\n\
    \n```\n$python3 train_online.py\n```\n\n在对话模型成功训练后，我们会收到类似这样的消息：\n\n```\n2018-08-30\
    \ 07:09:37 Done fitting keras policy model\n2018-08-30 07:09:37 Model directory\
    \ models/nlu exists and contains old model files. All files will be overwritten.\n\
    2018-08-30 07:09:37 Persisted model to '/Users/ sumit/apress_all/Chapter IV/horoscope_bot/models/nlu'\n\
    2018-08-30 07:09:37 Rasa Core server is up and running on http://localhost:5005\n\
    Bot loaded. Type a message and press enter (use '/stop' to exit).\n127.0.0.1 -\
    \ - [2018-08-30 07:09:37] \"GET /domain HTTP/1.1\" 200 996 0.001847\n```\n\n现在，你可以开始与刚刚诞生的机器人对话了。从此刻起，如何训练它完全掌握在你手中。每当它回应错误或意外内容时，你都可以纠正它。\n\
    \n让我们这样做，看看它是否有所改进。我输入“Hi”作为第一条消息，机器人返回了以下内容：\n\n![](image-7ecctrux.png)\n\n聊天历史：\n\
    ```\nbot did: action_listen\nuser said: hi\nwhose intent is: {'confidence': 0.8472929307505297,\
    \ 'name': 'greeting'}\nwe currently have slots: DD: None, MM: None, horoscope_sign:\
    \ None, subscribe: None\n```\n\n![](image-9mjeu5ug.png)\n\n机器人想要根据意图执行`[utter_greet]`。这是正确的吗？\n\
    - 是\n- 否，意图正确但动作错误\n- 意图错误\n- 将当前对话导出为故事并退出\n\n![](image-7v9v4a1a.png)\n\n––––––––\n\
    \n现在，机器人正在告诉我它根据用户所说以及它如何理解用户意图所采取的行动。同时，它还给了我们四个选项。我们稍后会讨论这个。\n\n机器人在这里执行的动作是`action_listen`，意思是它只是在等待用户输入一些内容，这没问题。\n\
    \n![](image-ddulzx5j.png)\n\n机器人说意图`{'confidence': 0.8472929307505297`是正确的，所以我们将按`1`，意思是机器人理解的内容和尝试执行的操作是正确的。\n\
    \n```\n1\n```\n\n聊天历史：\n```\nbot did: action_listen\nuser said: hi\nwhose intent\
    \ is: {'confidence': 0.8472929307505297, 'name': 'greeting'}\nbot did: utter_greet\n\
    we currently have slots: DD: None, MM: None, horoscope_sign: None, subscribe:\
    \ None\n```\n\n![](image-1po5qft0.png)\n\n机器人想要执行`[action_listen]`。这是正确的吗？\n-\
    \ 是\n- 否，动作错误\n- 将当前对话导出为故事并退出\n\n![](image-cze4ugxv.png)\n\n就这样，我们的机器人至少正确地问候了用户。如果你看到上述响应，你实际上可以检查我们的机器人做了什么；在我们训练它时，它会一直跟踪所有这些信息。\n\
    \n```\nbot did: utter_greet\n```\n\n现在，机器人说下一步是等待并监听用户将要说什么（即等待用户输入）。这是正确的吗？是的，这是正确的，所以我们再次按`1`，机器人会向用户给出提示。\n\
    \n我输入：“What's my horoscope for today?”\n\n![](image-wfn7jr3v.png)\n\n聊天历史：\n```\n\
    bot did: action_listen\nuser said: hi\nwhose intent is: {'confidence': 0.8472929307505297,\
    \ 'name': 'greeting'}\nbot did: utter_greet\nbot did: action_listen\nuser said:\
    \ what's my horoscope for today?\nwhose intent is: {'confidence': 0.8902154738608781,\
    \ 'name': 'get_horoscope'}\nwe currently have slots: DD: None, MM: None, horoscope_sign:\
    \ None, subscribe: None\n```\n\n![](image-di6r7rol.png)\n\n机器人想要根据意图执行`[utter_ask_horoscope_sign]`。这是正确的吗？\n\
    - 是\n- 否，意图正确但动作错误\n- 意图错误\n- 将当前对话导出为故事并退出\n\n![](image-ircjvvxo.png)\n\n现在，机器人非常准确地识别出意图是`get_horoscope`，准确率达到89%，这相当不错。机器人还说它想要执行`utter_ask_horoscope_sign`，这再次是正确的，因为用户还没有提到任何星座，并且插槽仍然是`None`，如图所示。\n\
    \n我们再次按`1`。\n\n![](image-dxmmb4au.png)\n\n––––––––\n\n聊天历史：\n```\nbot did: action_listen\n\
    user said: hi\nwhose intent is: {'confidence': 0.8472929307505297, 'name': 'greeting'}\n\
    bot did: utter_greet\nbot did: action_listen\nuser said: what's my horoscope for\
    \ today?\nwhose intent is: {'confidence': 0.8902154738608781, 'name': 'get_horoscope'}\n\
    bot did: utter_ask_horoscope_sign\nwe currently have slots: DD: None, MM: None,\
    \ horoscope_sign: None, subscribe: None\n```\n\n![](image-2qsqsiik.png)\n\n机器人想要执行`[action_listen]`。这是正确的吗？\n\
    - 是\n- 否，动作错误\n- 将当前对话导出为故事并退出\n\n![](image-1noclubl.png)\n\n––––––––\n\n现在，机器人询问是否是时候等待用户输入了。是的，用户需要提供星座。我们再次按`1`，当提示时，我们输入“Capricorn”作为输入。\n\
    \n![](image-yw1229ra.png)\n\n––––––––\n\n聊天历史：\n```\nbot did: action_listen\n\
    user said: hi\nwhose intent is: {'confidence': 0.\n```"
  raw: 'As soon as any action is triggered, it will execute it and give the response
    as per the method.   The default port for the action server endpoint is 5055 on
    localhost. If you want to change it, you can add pass —port argument in the command
    line.   A quick question comes to mind: why? Why do I need a separate server for
    that?   Why can’t we use plain Python? Yes, we can use plain Python, but suppose
    you were to develop the required actions in any other language or you have some
    actions already   exposed as APIs. Now, you just need to go to endpoints.yml,
    which we already created,   and use that to mention from where your action server
    should be used and where your core_endpoint server should be. In a production
    system both can be different servers having altogether different urls.  Now, when
    we run our next script where we mentioned our endpoints.yml file, Rasa will read
    the file and get the configuration for our action_server, which is already up
    and running as per the configuration we did earlier.   action_endpoint:   url:
    http://localhost:5055/webhook   Let’s run the train_online.py in a fresh command
    line terminal.   $python3 train_online.py   After a successful training of the
    dialog model, we’ll be getting a message like this:   2018-08-30 07:09:37 Done
    fitting keras policy model   2018-08-30 07:09:37 Model directory models/nlu exists
    and contains old model files. All files will be overwritten.   2018-08-30 07:09:37
    Persisted model to ''/Users/ sumit/apress_all/Chapter IV/horoscope_bot/models/nlu''
      2018-08-30 07:09:37 Rasa Core server is up and running on http://localhost:5005
      Bot loaded. Type a message and press enter (use ''/stop'' to exit).   127.0.0.1
    - - [2018-08-30 07:09:37] "GET /domain HTTP/1.1" 200 996 0.001847   Now, here
    you can start talking to your bot that has just been born. From here it’s solely
    in your hands how you train it. You can correct it whenever it responds something
    bad or unexpected.   Let’s do that and see if it improves.   I enter “Hi” as the
    first message and the bot returns the following:  ![](image-7ecctrux.png)  Chat
    history:   bot did: action_listen user said: hi   whose intent is: {''confidence'':
    0.8472929307505297, ''name'': ''greeting''}    we currently have slots: DD: None,
    MM: None, horoscope_sign: None, subscribe: None  ![](image-9mjeu5ug.png)  The
    bot wants to [utter_greet] due to the intent. Is this correct?   Yes No, intent
    is right but the action is wrong The intent is wrong   Export current conversations
    as stories and quit  ![](image-7v9v4a1a.png)  ––––––––   Now, the bot is telling
    me what it did based on what the user said and how he understands it. Now, it
    also gives us four options. We’ll talk about that in a moment.   What bot_did
    here is action_listen meaning; it was just waiting for the user to enter something,
    which is fine.  ![](image-ddulzx5j.png) Bot says the intent {‘confidence’: 0.


    8472929307505297, which is correct,  so we’ll press 1, meaning what the bot is
    understanding and trying to do it correct. 1   Chat history:   bot did: action_listen
    user said: hi   whose intent is: {''confidence'': 0.8472929307505297, ''name'':
    ''greeting''} bot did: utter_greet   we currently have slots: DD: None, MM: None,
    horoscope_sign: None, subscribe: None  ![](image-1po5qft0.png)  The bot wants
    to [action_listen]. Is this correct?   Yes. No, the action is wrong.   current
    conversations as stories and quit ![](image-cze4ugxv.png)   And there you are,
    our bot at least greeted the user properly. If you see the aforementioned response,
    you can actually check what our bot did; it keeps track of all this while we train
    it.   bot did: utter_greet   Now, the bot says that the next thing is to wait
    and listen to what the user is going to say (i.e., waiting for the user input).
    Is this correct? Yes, that’s correct, so we press 1 again and the bot gives a
    prompt to the user.   I enter, “What’s my horoscope for today?”  ![](image-wfn7jr3v.png) 
