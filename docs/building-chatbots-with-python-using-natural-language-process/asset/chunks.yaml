    ## Integrate Dialogflow Chatbot on Facebook Messenger


    In this section we’ll try to integrate our same chatbot to Facebook Messenger
    so that our users on the Facebook platform can also use it without having to come
    to our website.


    Let’s go back to the `Integrations` page in the Dialogflow dashboard and enable
    the `Facebook Messenger` icon, and then click on that, which should bring up a
    similar pop-up as before.


    Here we need to go to Facebook, register an app, and get the required token.


    - `Verify Token` (any string and is solely for your purposes)

    - `Page Access Token` (Enter the token generated in the Facebook Developer Console)


    The Dialogflow Facebook integration is very helpful to easily create a Facebook
    Messenger bot with NLU, based on the Dialogflow technology.


    ### Setting Up Facebook


    To make our bot work the same way it worked in Facebook, we would need to do the
    following:


    Create a Facebook account, if you haven’t. Create a Facebook page to which you
    can add your bot.


    When a user visits your Facebook page and sends you a message, they''ll be talking
    to your bot directly.


    #### Creating a Facebook App


    The following are the steps to create an app:


    1. Log into the Facebook Developer.

    2. Click on `My Apps` in the upper right-hand corner.

    3. Click on `Add a New App` and enter a name and contact e-mail address.

    4. Click `Create App ID` as shown in the Figure 3-15 below.


    ![](image-2xschawz.png)


    Figure 3-15. Creating a new app at Facebook Developer Platform


    On the next page, click the `Set Up` button for the `Messenger` option. Under
    the `Token Generation` section, let’s choose the Facebook page to which we want
    our bot to connect (see Figure 3-16).


    ![](image-f4vrjckm.png)


    Figure 3-16. Generating token by selecting your Facebook page for your bot


    This will generate a `Page Access Token`. Keep this token handy, as we’ll need
    to enter it in Dialogflow.


    ### Setting Up the Dialogflow Console


    Here are the steps:


    Click on the `Integrations` option in your Dialogflow console in the left menu
    and switch on `Facebook Messenger` if you haven’t already. In the pop-up that
    opens, enter the following information as shown in the Figure 3-17 (Setting up
    and integrating Dialogflow with Facebook Messenger):


    - `Verify Token`: this can be any string that you want and for your own purposes

    - `Page Access Token`: enter the token generated in the Facebook Developer Console


    Click the `Start` button.


    ![](image-qgh02y0m.png)


    Figure 3-17. Setting up and integrating Dialogflow with Facebook Messenger


    You should get a message saying, “Bot was started.” That means we are good to
    go.


    You must be wondering what a `callback URL`, `Verify Token`, and `Page Access
    Token` are. Let’s try to understand those.


    #### Callback URLs


    A `callback URL` is nothing but a publicly accessible URL where Facebook will
    `POST` any real-time requests coming from your Facebook page.


    Suppose you are trying to make payment for your food on `OnlineEats` and then
    you are redirected to a bank’s payment page. Now, `OnlineEats` must be giving
    a `callback URL` to banks to which they can redirect the user after payment is
    done.


    Here Facebook will not do any redirection but will take everything that our user
    messages in the page’s chatbox and `POST` that to the webhook or `callback URL`.


    Now, once we get the message on our server we do our intent classification and
    entities parsing and then formulate what you want to reply back to the user.


    #### Verify Token


    A `verify token` is an arbitrary string sent to your endpoint when the subscription
    is verified. The reason why it’s needed is to ensure that our server knows that
    the request is being made by Facebook and relates to the subscription we just
    configured.


    Suppose somebody else gets to know your webhook and posts messages posing as Facebook,
    then `verify_token` will come into the picture, and you will verify if the source
    is correct or not. Based on this token you can handle `POST` requests from multiple
    sources as well because there will be different tokens defined for different sources
    but the same `callback url`.


    #### Access Tokens


    Facebook APIs require `Page Access Tokens` to manage Facebook pages. They are
    unique to each page, admin, and app and have an expiration time.


    ![](image-zy8fk6r7.png)


    **Note:** Keep the `callback url` and `Verify token` handy for configuring the
    webhook now.


    ![](image-vat5073j.png)


    ### Configuring Webhooks


    To configure our bot’s webhook, let’s go back to the Facebook Developer Console:


    Click the `Setup` button under the `Add a product` section for webhooks when you
    click on the dashboard. If you have not already subscribed to webhooks, then you
    will get an option saying “subscribe to this object.” Click on this to get a new
    pop-up and enter the following information:


    - `Callback URL`: this is the URL provided on the Facebook Messenger integration
    page.

    - `Verify Token`: this is the Token you created.'
