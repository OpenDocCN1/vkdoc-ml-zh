    before approaching this book like any other book:   •  This book covers almost
    everything that you need to build a chatbot, rather than what exists.   •  This
    book is about spending more time in doing things on your system, with this book
    by your side. Make sure you execute each code snippet and try to write the code;
    do not copy and paste.   •  Make sure you follow the steps as they appear in the
    book; don’t worry if you don’t understand something. You will get to know about
    that later in the chapter.   •  Use the source code and Jupyter Notebook provided
    with this book for your reference.What Will You Learn in This Book?   Chapter
    1: The Beloved Chatbots In this chapter you will get to know about things related
    to chatbots from both a business and developer’s perspective. This chapter sets
    the tone for getting our hands dirty with chatbots concepts and converting them
    into code. Hopefully, you will have a reason why you should definitely build a
    chatbot for yourself or your company by the end of this chapter.   Chapter 2:
    Natural Language Processing for Chatbots In this chapter you will learn about
    what tools and methods to use when NLP is needed for chatbots. This chapter not
    only teaches you about the method in NLP but also takes real-life examples and
      xviii  InTroduCTIon   demonstrates with coding examples. This chapter also discusses
    why a particular NLP method may be needed in chatbots. Note that NLP in itself
    is a skill to have.   Chapter 3: Building Chatbots the Easy Way In this chapter
    you will learn about building a chatbot in a nice and easy manner using tools
    like Dialogflow. If you are a non- programmer, you will surely like it, as it
    requires little or no programming skills.   Chapter 4: Building Chatbots the Hard
    Way In this chapter, you will learn about building chatbots in a manner that people
    want to build. The title says the hard way, but once you have completed the previous
    chapter, you will be wanting more, as this chapter will teach how to build chatbots
    in-house from scratch and how to train chatbots using machine learning algorithms.


    Chapter 5: Deploying Your Chatbot This chapter is purely designed to give your
    chatbot app a final push. When you have come through the easy and hard way of
    building a chatbot, you will surely not want to keep it to yourself. You will
    learn how to showcase your chatbots to the world using Facebook and Slack and,
    finally, integrate them on your own website.  CHAPTER 1   ––––––––   The Beloved
    Chatbots   When you begin to build a chatbot, it’s very important to understand
    what chatbots do and what they look like.   You must have heard of Siri, IBM Watson,
    Google Allo, etc. The basic problem that these bots try to solve is to become
    an intermediary and help users become more   productive. They do this by allowing
    the user to worry less about how information will be retrieved and about the input
    format that may be needed to attain specific data. Bots tend to become more and
    more intelligent as they handle user data input and gain more insights from it.
    Chatbots are successful because they give you exactly what you want.   Does it
    irritate you or frustrate you when you have to enter the same name, e-mail ID,
    address, and pincode every time on different websites? Imagine a single bot that
    does your tasks—say, ordering food from different vendors, shopping online from
    various e-commerce companies, or booking a flight or train tickets—and you don’t
    have to provide the same e-mail ID, shipping address, or payment information every
    time.   The bot has the capability to know this information already and is intelligent
    enough to retrieve what is needed when you ask it in your own language or in what
    is known in computer science as Natural Language.   Chatbots development is way
    easier than it was a few years ago, but chatbots did exist decades ago as well;
    however, the popularity of chatbots has increased exponentially in last few years.
      If you are a technical person or have some idea of how a web application or
    mobile application works, then you must have heard the term APIs. Any kind of
    data that   you need today is available to be consumed in the form of APIs provided
    by different service providers and institutions. If you are looking for weather
    information, booking tickets, ordering food, getting flight information, converting
    one language to another, or posting on Facebook or Twitter, all of this can be
    done using APIs. These APIs are used by web- or mobile-based applications to do
    these tasks. Chatbots can also use these APIs to achieve the same tasks based
    on our requests.   1  The reason Chatbots get an edge over traditional methods
    of getting things done online is you can do multiple things with the help of a
    chatbot. It’s not just a chatbot, it’s like your virtual personal assistant. You
    can think of being able to book a hotel room on booking.com as well as booking
    a table in a nearby restaurant of the hotel, but you can do that using your chatbot.
    Chatbots fulfill the need of being multipurpose and hence save a lot of time and
    money.'
  trans: "\n以下读者会发现本书非常实用：  \n• 希望将知识或职业拓展至聊天机器人开发的 Python 网页开发者  \n• 希望通过动手实践获取新技能、展示成果并脱颖而出的学生和有抱负的程序员\
    \  \n• 希望学习如何从零构建聊天机器人的自然语言爱好者  \n• 拥有绝妙创意但缺乏构建聊天机器人技术可行性信息的初创企业家  \n• 正在规划聊天机器人相关项目的产品/工程经理\
    \  \n\n**如何阅读本书？**  \n请记住，本书的写作方式与其他书籍不同。本书的编写理念是：当你读完本书后，能够独立构建聊天机器人，或教会他人如何构建。在开始阅读本书前，请务必牢记以下几点：\
    \  \n• 本书涵盖构建聊天机器人所需的大部分内容，而非泛泛而谈现有技术。  \n• 本书鼓励你花更多时间在系统上动手实践，让本书成为你的得力助手。请务必执行每个代码片段并尝试编写代码，不要直接复制粘贴。\
    \  \n• 请严格按照书中步骤操作；如果遇到不理解的内容不必担心，后续章节会为你解答。  \n• 使用本书附带的源代码和 Jupyter Notebook\
    \ 作为参考。  \n\n**你将学到什么？**  \n**第 1 章：备受喜爱的聊天机器人**  \n本章将从商业和开发者双重视角，带你了解聊天机器人的相关知识。本章将为动手实践聊天机器人概念并将其转化为代码奠定基础。希望读完本章后，你能找到为自己或公司构建聊天机器人的充分理由。\
    \  \n\n**第 2 章：聊天机器人的自然语言处理**  \n本章将学习在聊天机器人中应用自然语言处理（NLP）时所需的工具和方法。本章不仅教授 NLP\
    \ 方法，还会结合真实案例，通过代码示例进行演示。同时讨论为何聊天机器人需要特定的 NLP 方法。请注意，NLP 本身就是一项值得掌握的技能。  \n\n\
    **第 3 章：轻松构建聊天机器人**  \n本章将学习如何使用 Dialogflow 等工具，以简单优雅的方式构建聊天机器人。如果你是非程序员，一定会喜欢本章，因为它几乎不需要编程技能。\
    \  \n\n**第 4 章：硬核构建聊天机器人**  \n本章将学习人们真正想要的聊天机器人构建方式。标题虽为“硬核”，但完成前一章后，你会渴望更多内容——本章将教你如何从零内部构建聊天机器人，以及如何使用机器学习算法训练它们。\
    \  \n\n**第 5 章：部署你的聊天机器人**  \n本章专为你的聊天机器人应用提供最后冲刺。当你经历了轻松与硬核两种构建方式后，一定不想让成果只停留在自己手中。你将学习如何通过\
    \ Facebook 和 Slack 向世界展示你的聊天机器人，并最终将其集成到自己的网站上。  \n\n**第 1 章**  \n––––––––  \n\
    **备受喜爱的聊天机器人**  \n\n当你开始构建聊天机器人时，理解它们的功能和形态至关重要。  \n\n你一定听说过 Siri、IBM Watson、Google\
    \ Allo 等。这些机器人试图解决的基本问题是：成为用户与信息之间的中介，帮助用户提高效率。它们通过让用户减少对信息检索方式和输入格式的担忧来实现这一点——用户无需担心获取特定数据需要何种输入格式。随着处理用户数据输入并从中获取更多洞察，机器人会变得越来越智能。聊天机器人之所以成功，是因为它们能精准提供你所需的内容。\
    \  \n\n你是否曾因每次在不同网站上重复输入姓名、邮箱、地址和邮编而感到烦躁？想象一下，一个机器人能替你完成所有任务——比如从不同供应商订餐、在多家电商平台购物、预订机票或火车票——而你无需每次都提供相同的邮箱、收货地址或支付信息。\
    \  \n\n机器人已经具备这些信息，并且足够智能，当你用自然语言（计算机科学中称为“自然语言”）提问时，它能自动检索所需内容。  \n\n聊天机器人的开发比几年前简单得多，但聊天机器人其实几十年前就已存在；不过，近几年来其受欢迎程度呈指数级增长。\
    \  \n\n如果你具备技术背景，或了解网页应用/移动应用的工作原理，那么你一定听说过 API 这个术语。如今你需要的任何数据，都可以通过不同服务提供商和机构提供的\
    \ API 来获取。无论是查询天气、预订门票、订餐、获取航班信息、语言翻译，还是在 Facebook 或 Twitter 上发帖，所有这些都可以通过 API\
    \ 实现。网页或移动应用正是利用这些 API 来完成任务的。聊天机器人同样可以基于我们的请求，使用这些 API 实现相同的功能。  \n\n聊天机器人之所以比传统在线方式更具优势，是因为你可以借助它同时完成多项任务。它不仅仅是一个聊天机器人，更像是你的虚拟个人助理。你可以想象：在\
    \ booking.com 上预订酒店房间的同时，还能预订酒店附近餐厅的座位——而这一切都可以通过你的聊天机器人完成。聊天机器人满足了多功能需求，从而节省了大量时间和金钱。\
    \  \n"
- fmt: "# In This Book\n\nIn this book we are going to learn how to build natural\
    \ conversational experiences using bots and how to teach a bot to understand our\
    \ natural language and make it do tasks for us from a single interface. Bots in\
    \ general are nothing but a machine that is intelligent enough to understand your\
    \ request and then formulate your request in such a way that is understandable\
    \ by other software systems to request the data you need.\n\n## Popularity of\
    \ Chatbots Usage\n\nChatbots have become popular just as anything from the recent\
    \ past. Let’s try looking at Figure 1-1, which depicts the rise of chatbots, and\
    \ also try to understand why there is a huge demand for building chatbots.\n\n\
    ![](image-l0ray8ei.png)\n\nFigure 1-1. Numbers on Y-axis represent search interest\
    \ relative to the highest point on the chart across all categories worldwide\n\
    \nThe simple answer that comes to mind is that it’s not a complex software and\
    \ can be used by anyone. When we build software we target the audience who will\
    \ be using it, but when it’s used by anyone else, it becomes difficult and unusable.\
    \ When we build chatbots we keep in mind that it will be used by people of all\
    \ age groups. This happens only in case of chatbots, where the software tries\
    \ to behave like a dumb person (but it’s intelligent) and lets the user be who\
    \ he or she is. In all other software, you will find that you should be aware\
    \ of some terminologies or gradually be aware of how to optimally make use of\
    \ it, but that’s not the case with chatbots. If you know how to talk to a person,\
    \ you won’t have any issue using a chatbot.\n\nThere is a continuous growing demand\
    \ for chatbots. However, there has not been much research that has empirically\
    \ tried finding out the motivations behind using chatbots. In a recent study,\
    \ an online questionnaire asked chatbot users ages 16 to 55 years from the US\
    \ to describe their need for using chatbots in their daily lives. The survey revealed\
    \ the “productivity” to be the primary motivational factor for using chatbots.\n\
    \n## The Zen of Python and Why It Applies to Chatbots?\n\nI remember the Zen of\
    \ Python, which says, “Simple is better than Complex,” and that applies so many\
    \ places in software.\n\nThe Zen of Python is a collection of 20 software principles\
    \ that influences the design of Python Programming Language.\n\n—Tim Peters\n\n\
    Want to know is Zen of Try the below steps.\n\nIf you already have Python installed\
    \ on your computer. Just go to your Python interpreter and import\n\n```\nPython\
    \ 2.7.15 (default, May 1 2018, 16:44:08)\n[GCC 4.2.1 Compatible Apple LLVM 9.1.0\
    \ (clang-902.0.39.1)] on darwin\nType \"help\", \"copyright\", \"credits\" or\
    \ \"license\" for more information.\n>>> import this\n```\n\nThe Zen of Python,\
    \ by Tim Peters\n\nBeautiful is better than ugly.  \nExplicit is better than implicit.\
    \  \nSimple is better than complex.  \nComplex is better than complicated.  \n\
    Flat is better than nested.  \nSparse is better than dense.  \nReadability counts.\
    \  \nSpecial cases aren't special enough to break the rules.  \nAlthough practicality\
    \ beats purity.  \nErrors should never pass silently.  \nUnless explicitly silenced.\
    \  \nIn the face of ambiguity, refuse the temptation to guess.  \nThere should\
    \ be one—and preferably only one—obvious way to do it.  \nAlthough that way may\
    \ not be obvious at first unless you're Dutch.  \nNow is better than never.  \n\
    Although never is often better than *right* now.  \nIf the implementation is hard\
    \ to explain, it's a bad idea.  \nIf the implementation is easy to explain, it\
    \ may be a good idea.  \nNamespaces are one honking great idea—let's do more of\
    \ those!\n\nYou may not able to make sense of all points above relating to chatbots\
    \ but surely you can most of them.\n\nWell, coming back to our topic, I remember\
    \ finding difficulty starting to use Facebook User Interface while coming from\
    \ Orkut background. If you have never used Orkut, you would not understand it,\
    \ but just try thinking of a situation in your life where you started using some\
    \ new software or application and you had a hard time getting the hang of it.\
    \ Maybe switching from Windows to MacOS/Linux or vice versa? When you use a new\
    \ application, you need to learn a few things, and it takes time to get used to\
    \ it and to know what it does and how it works. It does happen at times that you\
    \ come to know some features of the application even after years of using it.\
    \ If you are on MacOS, try `Shift + Option + Volume Up/Down` and see what happens.\
    \ Let me know if it amazed you, if you didn’t know it already.\n\nIn the case\
    \ of chatbots, the communication between the user and the server or backend system\
    \ is pretty simple. It’s just like talking to some other person using a messaging\
    \ app. You just type what you want, and the bot should be able to either give\
    \ you what you want or should guide you how to get that. In other words, it should\
    \ point you to the correct information by giving you a link or document. The time\
    \ has come where bots are able to even dig up the information from an article\
    \ and document and provide it to the users.\n\nSignificant progress in AI by companies\
    \ like Google, Facebook, and IBM and by machine learning services like Amazon\
    \ Lex, wit.ai, api.ai, luis.ai, IBM Watson, Amazon Echo, etc. has led to the extraordinary\
    \ growth and demand of such robots.\n\n## The Need for Chatbots\n\nNow, we will\
    \ try to look at the need and demand of chatbots in this fast-growing information\
    \ creation and retrieval age from two different perspectives: the business standpoint\
    \ and the developer’s perspective. So, if you are a product manager, sales manager,\
    \ or from marketing or any related domain that drives the business directly, then\
    \ you should not skip the business perspective of the chatbots. It will give you\
    \ a clear picture that businesses today need to adopt this technology to drive\
    \ more revenue.\n\n### The Business Perspective\n\nWe will try to look at the\
    \ business perspective of the chatbots. Is it good for a business to have a chatbot\
    \ or to migrate lots of stuff to be done by chatbots?"
