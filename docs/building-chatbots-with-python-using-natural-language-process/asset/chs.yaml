  \ 集成  您应该会看到一条消息，显示“机器人已启动”。这意味着我们已经准备就绪。   您可能想知道什么是回调 URL、验证令牌和页面访问令牌。让我们来理解一下这些概念。\
  \   回调 URL   回调 URL 就是一个可公开访问的 URL，Facebook 会将来自您 Facebook 页面的任何实时请求 POST 到这个 URL。\
  \   假设您正尝试在 OnlineEats 上为您的食物付款，然后您被重定向到银行的支付页面。现在，OnlineEats 必须向银行提供一个回调 URL，以便银行在支付完成后可以将用户重定向回去。\
  \   在这里，Facebook 不会进行任何重定向，而是会获取用户在该页面聊天框中发送的所有内容，并将其 POST 到 webhook 或回调 URL。  \
  \ 现在，一旦我们在服务器上收到消息，我们就进行意图分类和实体解析，然后制定您想要回复给用户的内容。   验证令牌   验证令牌是在验证订阅时发送到您端点的一个任意字符串。需要它的原因是为了确保我们的服务器知道该请求是由\
  \ Facebook 发出的，并且与我们刚刚配置的订阅相关。   假设其他人知道了您的 webhook，并冒充 Facebook 发布消息，那么 verify_token\
  \ 就会发挥作用，您将验证来源是否正确。基于此令牌，您还可以处理来自多个来源的 POST 请求，因为可以为不同的来源定义不同的令牌，但使用相同的回调 URL。\
  \   访问令牌   Facebook API 需要页面访问令牌来管理 Facebook 页面。每个页面、管理员和应用都有唯一的令牌，并且这些令牌有到期时间。\
  \  ![](img/image-zy8fk6r7.png)  注意 请准备好回调 URL 和验证令牌，以便现在配置 webhook。  ![](img/image-vat5073j.png) \
  \ 配置 Webhooks   要配置我们机器人的 webhook，让我们回到 Facebook 开发者控制台：   当您点击控制面板时，在“添加产品”部分的\
  \ webhooks 下点击“设置”按钮。如果您尚未订阅 webhooks，您将看到一个“订阅此对象”的选项。点击此选项会弹出一个新窗口，然后输入以下信息：  \
  \ •  回调 URL：这是 Facebook Messenger 集成页面上提供的 URL。   •  验证令牌：这是您创建的令牌。\n\n\n\n前往 Messenger\
