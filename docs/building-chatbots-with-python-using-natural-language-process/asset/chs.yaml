  \n理解并回复用户\n\n现在，对话的下一步是让机器人回复用户，告知订单已理解，并附带任何新信息。新信息可以是生成的订单 ID、订单金额或预计送达时间。这些信息将在你的服务器端填充，你可以将其与机器人的回复整合在一起，返回给用户。\n\
  \n\n\n现在，让我们尝试在我们的案例中添加订单金额；为此，我们可以使用 Dialogflow 的**默认回复**功能，并将其添加到意图中。我们先对金额进行硬编码，因为该金额会根据食品种类、数量或餐厅而有所不同。在本章后面，我们将讨论如何通过调用\
  \ API 使其动态化。有趣的是，我们可以访问从意图中获取的参数（即食品种类及其数量）。回复中可以包含对参数的引用，我们稍后会理解这一点。如果参数表中存在某个参数，我们可以使用以下格式在“文本回复”字段中引用其值：`$parameter_name`。我们可以在默认回复中使用这些参数，以便机器人向用户确认订单。添加“您的最终金额为\
  \ XYZ，您的订单已下达，包含 $quantity1 份 $food_items_entity1 和 $quantity2 份 $food_items_entity2”作为回复。![](img/image-e3k48jco.png)\
  \ 注意，如果我们的意图无法解析食品种类或其数量，我们需要给出一个不同的默认回复，要求用户解释机器人无法理解的内容，或者至少进行确认。我们已经在“向意图添加默认回复”一节中学习了如何向意图添加默认回复。![](img/image-qmq86w97.png)\n\
  \n––––––––\n\n**订单状态意图**\n\n现在，让我们创建 `order_status` 意图，用户可能在订单下达后尝试询问订单状态。图 3-8\
  \ 展示了一些我们为订单状态意图添加的训练短语，我们将该意图命名为 ![](img/image-tjq5cnao.png) 图 3-8. 创建订单状态意图 现在，让我们尝试一些随机的询问订单状态的语句，看看我们的智能体是否足够智能，能够识别出该意图。我尝试了一下，收到了我的食物，瞧——我的智能体完美地识别出这是一个\
  \ `order_status` 意图。请参见图 3-9 中 JSON 的 `resolvedQuery` 和 `intentName`。![](img/image-vk1swy7t.png)\n\
  \n––––––––\n\n图 查询解析后来自 Dialogflow 的 JSON 回复\n\n**用户订单 ID 意图**\n\n接下来，需要向用户询问订单\
  \ ID，因此我们将此意图的默认回复设置为提出以下问题：您能提供您的订单 ID 吗？现在，用户将提供他们的订单 ID，我们的任务是识别它并再次给出回复。为此，我们需要创建另一个意图，用于识别用户何时在谈论订单\
  \ ID。请注意，我们正在创建的这些意图彼此之间相当独立。在这种情况下，我们知道用户将提供订单 ID，而且这很可能是正确的。如果错误，你总是可以返回给用户并再次询问。我们还应注意，在某些情况下，订单\
  \ ID 和电话号码可能都是整数。在这种情况下，我们需要进行一些验证，例如订单 ID 或电话号码的位数。此外，根据前一个问题的上下文，你可以判断用户是在提供订单\
  \ ID 还是电话号码。如第 1 章所述，我们始终可以使用决策树来更好地管理聊天机器人的流程。我们还可以通过编程方式跟踪：在 `order_status` 意图之后，我们询问订单\
  \ ID，用户将发送一些订单 ID（某个数字），这在代码中解析比创建一个全新的意图更容易。在本例中，我们将创建 `user_order_id` 意图，因为不存在此类冲突。现在，我们创建一个名为\
