  \n要想精通某件事并高效地完成它，打好基础非常重要。要构建聊天机器人，我们需要了解 NLP 的基础方法。这些方法帮助我们分解输入并理解其含义。在下一节中，我们将学习一些最常用的\
  \ NLP 方法，这些方法不仅能帮助你精通 NLP，还能帮助你构建出色的聊天机器人。我们处理输入文本的能力越强、效率越高，就越能更好地回应用户。\n\n词性标注\n\
  \n词性标注是一个过程，你读取一些文本，并为每个单词或标记分配词性，例如名词、动词、形容词等。\n\n当你想要识别给定句子中的某个实体时，词性标注变得极其重要。第一步是进行词性标注，看看我们的文本包含什么。\n\
  \n让我们通过一些真实的词性标注示例来动手实践。\n\n示例 1：\nnlp = spacy.load('en') # 将 spaCy en 模型加载到 Python\
  \ 对象中\ndoc = nlp(u'I am learning how to build chatbots') # 创建一个 doc 对象\nfor token\
  \ in doc:\n    print(token.text, token.pos_) # 打印文本和词性\n\n输出：\n('I', 'PRON')\n('am',\
  \ 'VERB')\n('learning', 'VERB')\n('how', 'ADV')\n('to', 'PART')\n('build', 'VERB')\n\
  ('chatbots', 'NOUN')\n\n示例 2：\ndoc = nlp(u'I am going to London next week for a\
  \ meeting.')\nfor token in doc:\n    print(token.text, token.pos_)\n\n('I', 'PRON')\n\
  ('am', 'VERB')\n('going', 'VERB')\n('to', 'ADP')\n('London', 'PROPN')\n('next',\
  \ 'ADJ')\n('week', 'NOUN')\n('for', 'ADP')\n('a', 'DET')\n('meeting', 'NOUN')\n\
  ('.', 'PUNCT')\n\n\n\n', 'PUNCT') 如我们所见，当打印从 `nlp` 方法返回的 `Doc` 对象（一个用于访问注释的容器）中的词元时，我们会得到句子中每个单词的词性标注。这些标签是单词的属性，决定了该单词在语法正确的句子中的用法。我们可以将这些标签用作信息过滤等任务中的单词特征。\n\
  \n让我们再举一个例子，尝试探索来自 `Doc` 对象的词元的不同属性。\n\n**示例 3：**\n\n```python\ndoc = nlp(u'Google\
  \ release \"Move Mirror\" AI experiment that matches your pose from 80,000 images')\n\
  for token in doc:\n    print(token.text, token.lemma_, token.pos_, token.tag_, token.dep_,\
  \ token.shape_, token.is_alpha, token.is_stop)\n```\n\n**示例 4：**\n\n```python\n\
  doc = nlp(u'I am learning how to build chatbots')\nfor token in doc:\n    print(token.text,\
  \ token.lemma_, token.pos_, token.tag_, token.dep_, token.shape_, token.is_alpha,\
  \ token.is_stop)\n```\n\n请参考下表，了解我们在代码中打印的每个属性的含义。\n\n| 属性 | 含义 |\n| :--- | :---\
  \ |\n| `TEXT` | 正在处理的实际文本或单词 |\n| `lemma` | 正在处理的单词的词根形式 |\n| `pos` | 单词的词性 |\n\
  | `tag` | 表达词性（例如，动词）和一些形态信息（例如，动词是过去时态） |\n| `dep` | 句法依存关系（即词元之间的关系） |\n| `shape`\
  \ | 单词的形状（例如，大小写、标点、数字格式） |\n| `alpha` | 该词元是否为字母字符？ |\n| `stop` | 该单词是否为停用词或停用词列表的一部分？\
  \ |\n\n你可以参考下表来理解词元对象的每个词性属性值的含义。此列表详细说明了 spaCy 模型分配的词性标签。\n\n那么，为什么聊天机器人需要词性标注呢？\n\
  \n**答案：** 为了降低理解文本的复杂性，这些文本可能无法被训练，或者训练置信度较低。通过使用词性标注，我们可以识别文本输入中的部分，并仅对这些部分进行字符串匹配。例如，如果你想判断一个句子中是否存在某个地点，词性标注会将地点词标记为\
  \ `NOUN`，这样你就可以从标注列表中提取所有名词，并检查它是否在你预设的地点列表中。\n\n### 词干提取与词形还原\n\n**词干提取** 是将屈折词简化为其词干、基本形式的过程。词干提取算法会将单词\
  \ “saying” 简化为词根 “say”，而 “presumably” 则变为 “presum”。如你所见，这不一定总是 100% 正确。\n\n**词形还原**\
  \ 与词干提取密切相关，但词形还原是根据单词的预期含义来确定其词元的算法过程。例如，在英语中，动词 “to walk” 可能以 “walk”、“walked”、“walks”\
  \ 或 “walking” 的形式出现。可以在字典中查到的基本形式 “walk” 被称为该单词的词元。spaCy 没有内置的词干提取器，因为词形还原被认为更准确、更高效。\n\
  \n### 词干提取与词形还原的区别\n\n-   **词干提取** 以一种粗糙、启发式的方式工作，通过切掉单词的结尾，假设剩下的单词就是我们实际要找的，但它通常包括去除派生词缀。\n\
  -   **词形还原** 试图通过使用词汇表和单词的形态分析来更优雅地完成这项工作。它尽力只去除屈折词尾，并返回单词的词典形式，即词元。\n\n尽管少数库同时提供了词干提取和词形还原的方法，但最佳实践始终是使用词形还原来正确获取词根。\n\
  \n让我们通过一些例子来探索词形还原：\n\n**示例 1：**\n\n```python\nfrom spacy.lemmatizer import Lemmatizer\n\
  from spacy.lang.en import LEMMA_INDEX, LEMMA_EXC, LEMMA_RULES\nlemmatizer = Lemmatizer(LEMMA_INDEX,\
  \ LEMMA_EXC, LEMMA_RULES)\nlemmatizer('chuckles', 'NOUN') # 第二个参数是词元的词性标签\n```\n\
  \n**输出：**\n\n```python\n[u'chuckle']\n```\n\n**示例 2：**\n\n```python\nlemmatizer('blazing',\
  \ 'VERB')\n```\n\n**输出：**\n\n```python\n[u'blaze']\n```\n\n**示例 3：**\n\n```python\n\
  lemmatizer('fastest', 'ADJ')\n```\n\n**输出：**\n\n```python\n[u'fast']\n```\n\n如果你想比较词干提取器和词形还原器，那么你需要安装\
  \ Python 最流行的库之一：自然语言工具包（NLTK）。spaCy 最近才流行起来，但正是 NLTK 让每一位 NLP 爱好者投身于 NLP 及其技术的海洋。\n\
  \n请查看以下示例，我们尝试使用 NLTK 提供的两种词干提取技术。首先，我们尝试使用 `PorterStemmer` 获取单词 “fastest” 的词干，然后使用\
  \ `SnowBallStemmer`。\n\n\n\n两者得出的结果相同，都是“fastest”，但当我们使用 spaCy 的方法进行词形还原时，它给出的“fastest”的词干是“fast”，这更有意义且更正确。\
  \  \nfrom nltk.stem.porter import *  \nfrom nltk.stem.snowball import SnowballStemmer\
  \  \nporter_stemmer = PorterStemmer()  \nsnowball_stemmer = SnowballStemmer(\"english\"\
  )  \n\nfastest fastest  \n![](img/image-2wwgueqv.png)  \n在尝试运行此代码之前，请务必使用 pip3 安装\
  \ nltk 包。  \n![](img/image-b5592gcd.png)  \n既然你已经很清楚词干提取或词形还原在自然语言处理中的作用，那么你应该能够理解，每当遇到需要单词词根形式的情况时，就需要进行词形还原。例如，它常用于构建搜索引擎。你一定好奇过，即使搜索文本表述不规范，谷歌是如何在搜索结果中给出你想要的文章的。\
  \  \n\n这正是词形还原发挥作用的地方。想象一下，你用文本“will the next season of Game of Thrones be”进行搜索。\
  \  \n现在，假设搜索引擎只是通过简单的文档词频匹配来提供搜索结果。在这种情况下，上述查询很可能无法匹配到标题为“Thrones next season release\
  \ date”的文章。  \n\n如果在将输入与文档匹配之前，先对原始问题进行词形还原，那么我们可能会得到更好的结果。  \n我们将在后续章节中尝试验证这一理论。\
  \  \n\n命名实体识别  \n\n命名实体识别，也称为实体识别或实体抽取，是一个在给定文本中查找命名实体并将其分类到预定义类别的过程。  \n\nNER 任务在很大程度上依赖于用于训练命名实体提取算法的知识库，因此其效果可能因训练所用的数据集而异。\
  \  \n\nspaCy 自带一个非常快速的实体识别模型，能够从给定文档中识别出实体短语。实体可以是不同类型，例如人物、地点、组织、日期、数字等。这些实体可以通过\
  \  \ndoc 对象的 `.ents` 属性进行访问。  \n\n让我们借助 spaCy 强大的 NER 标注功能，通过一些示例来尝试查找命名实体。  \n\n\
  示例 1：  \n\nmy_string = u\"Google has its headquarters in Mountain View, California\
  \ having  \nrevenue amounted to 109.65 billion US dollars\"  \ndoc = nlp(my_string)\
  \  \nfor ent in doc.ents: print(ent.text, ent.label_)  \n输出：  \n\n('Google', 'ORG')\
  \  \n('Mountain View', 'GPE')  \n('California', 'GPE')  \n('109.65 billion US dollars',\
  \ 'MONEY')  \n\n我们可以看到，spaCy 模型能够多么出色且自动地识别出单词“Google”是一个组织，“Mountain View”和“California”是地缘政治实体，并且在给定的句子中，我们谈论的是\
  \ 1096.5 亿美元，这实际上与金钱有关。  \n\n让我们尝试探索更多示例。  \n\n示例 2：  \n\nmy_string = u\"Mark Zuckerberg\
  \ born May 14, 1984 in New York is an American technology entrepreneur and philanthropist\
  \ best known for co-founding and leading Facebook as its chairman and CEO.\"  \n\
  doc = nlp(my_string)  \nfor ent in doc.ents: print(ent.text, ent.label_)  \n输出：\
  \  \n\n('Mark Zuckerberg', 'PERSON')  \n('May 14, 1984', 'DATE')  \n('New York',\
  \ 'GPE')  \n('American', 'NORP')  \n('Facebook', 'ORG')  \n\n示例 3：  \n\nmy_string\
  \ = u\"I usually wake up at 9:00 AM. 90% of my daytime goes in learning new things.\"\
  \  \ndoc = nlp(my_string) for ent in doc.ents:  \nprint(ent.text, ent.label_)  \n\
  输出：  \n\n('9:00 AM', 'TIME')  \n('90%', 'PERCENT')  \n\n如你所见，实体提取器可以轻松地从给定字符串中提取时间信息。同时，你还可以看到实体提取器不仅试图识别数字，还能识别出确切的百分比值。\
  \  \n\n根据 spaCy 的文档，在 OntoNotes 语料库上训练的模型支持以下实体类型。  \n![](img/image-vqesjz8o.png)\
  \  \n类型  描述  \n![](img/image-6pqq9ss9.png)  \n包括虚构的  \n或宗教或政治团体  \n机场、高速公路、桥梁等。\
  \  \n机构、组织等。  \n城市、州  \n地点、山脉、水域  \n车辆、食物等（不包括服务）  \n飓风、战役、战争、体育赛事等。  \n书籍、歌曲等。\
  \  \n已制定为法律的文件  \n已命名的语言  \n或相对日期或时间段  \n小于一天的时间  \n包括“%”  \n数值，包括重量或距离的单位  \n“第一”、“第二”等。\
  \  \n![](img/image-4a4rgtio.png)  \n不属于其他类型的实体  \n![](img/image-ml6ege4k.png)  \n\
  \n每当我们打算构建一个对话代理或聊天机器人（简单来说）时，我们心中总会有一个领域。例如，我们希望聊天机器人能够预约医生、订餐、支付账单、填写银行申请表、处理电子商务等。聊天机器人也可能解决这些问题的组合。通过找出问题中的实体，我们可以大致了解提出问题的上下文。\
  \  \n\n让我们通过两个包含相似词语但含义不同的句子示例来理解这一点。  \n\nmy_string1 = u\"Imagine Dragons are the\
  \ best band.\"  \nmy_string2 = u\"Imagine dragons come and take over the city.\"\
  \  \n\ndoc1 = nlp(my_string1)  \ndoc2 = nlp(my_string2)  \n\nfor ent in doc1.ents:\
  \ print(ent.text, ent.label_)  \n\n上述对 doc1 对象的 for 循环输出：  \n\n('Imagine Dragons',\
  \ 'ORG')  \n\n很厉害，不是吗？当你意识到实体识别器在字符串中未识别出任何实体时，这会变得更加有趣。运行以下代码，doc2 不会产生任何输出。  \n\
  \nfor ent in doc2.ents: print(ent.text, ent.label_)  \n\n现在，想象一下你需要在实时环境中提取上述两个字符串的上下文。你会怎么做？借助实体，可以轻松判断语句的上下文，并智能地推动对话继续进行。\
  \  \n\n\n\n停用词   停用词是指像 a、to 和 also 这类我们有时希望在进一步处理前从文档中过滤掉的词语。停用词通常词汇内容很少，没有太多实际意义。以下是\
  \ Reuters-RCV1 语料库中常见的 25 个语义上非选择性的停用词列表。  a  an  and  are  as   at  be  by   for\
  \ from  has  he   in    is    it    its      of    on that  the  to    was     \
  \ were    will    with   让我们进入一些代码，尝试理解其工作原理。   要查看 spaCy 中定义为停用词的所有单词，可以运行以下代码行：\
  \   from spacy.lang.en.stop_words import STOP_WORDS print(STOP_WORDS)   你应该会看到类似这样的输出：\
  \   set(['all', 'six', 'just', 'less', 'being', 'indeed', 'over', 'move',   'anyway',\
  \ 'fifty', 'four', 'not', 'own', 'through', 'using', 'go', 'only', 'its', 'before',\
  \ 'one', 'whose', 'how',   ..........................................................................\
  \   .........................................................................  \
  \ ...........................................................................  \
  \ ........................................................................   'whereby',\
  \ 'third', 'i', 'whole', 'noone', 'sometimes', 'well', 'together',   'yours', 'their',\
  \ 'rather', 'without', 'so', 'five', 'the', 'otherwise', 'make', 'once'])   spaCy\
  \ 的停用词列表中定义了大约 305 个停用词。如果需要，你始终可以定义自己的停用词并覆盖现有列表。   要判断一个词是否为停用词，可以使用 spaCy 的 `nlp`\
  \ 对象。我们可以使用 `nlp` 对象的 `is_stop` 属性。   示例 1：   nlp.vocab[u'is'].is_stop   输出：   True \
  \ nlp.vocab[u'hello'].is_stop   输出：   False   示例 3：   nlp.vocab[u'with'].is_stop\
  \   输出：   True   停用词是文本清理中非常重要的一部分。它有助于在我们尝试进行实际处理以理解文本含义之前，移除无意义的数据。   假设你正在构建一个机器人，通过评估用户情绪来让人们开心。此时，需要分析用户输入文本中的情感，以便制定正确的回应。在这里，在开始进行基本的情感分析之前，我们应该移除数据中以停用词形式存在的噪声。\
  \   依存句法分析   依存句法分析是 spaCy 中更优美且强大的功能之一，它快速且准确。该解析器还可用于句子边界检测，并允许你遍历基本名词短语或“语块”。\
  \   spaCy 的这一功能为你提供了一个解析树，它解释了单词或短语之间的父子关系，并且与单词出现的顺序无关。   让我们看一个例子，你需要解析以下句子：  \
  \ 帮我订一张从班加罗尔到果阿的机票   示例 1：   doc = nlp(u'Book me a flight from Bangalore to Goa')\
  \ blr, goa = doc[5], doc[7]   list(blr.ancestors)   输出：   [from, flight, Book]  \
  \ 上述输出可以告诉我们，用户希望预订从班加罗尔出发的航班。让我们尝试列出 `goa.ancestors` 对象的祖先：   list(goa.ancestors)\
  \   输出：   [to, flight, Book]   这个输出可以告诉我们，用户希望预订前往果阿的航班。   依存句法分析中的祖先是什么？   祖先是指该词元的句法后代中最右边的词元。就像上面例子中，对于对象\
  \ `blr`，其祖先是 `from`、`flight` 和 `Book`。   请记住，你始终可以使用 `ancestors` 属性列出文档对象项的祖先。  \
  \ list(doc[4].ancestors) #doc[4]==flight   上述代码将输出：   [flight, Book]   要以编程方式检查一个文档对象项是否是另一个文档对象项的祖先，我们可以这样做：\
  \   doc[3].is_ancestor(doc[5])   上述代码返回 `True`，因为 `doc[3]`（即 `flight`）是 `doc[5]`（即\
  \ `Bangalore`）的祖先。你可以尝试更多类似的例子，以更好地理解依存句法分析和祖先的概念。   如果我们尝试思考在构建聊天机器人时可能遇到的实际场景，可能会遇到像这样的句子：\
  \   我想订一辆出租车去酒店，并在餐厅订一张桌子。   在这个句子中，了解请求了哪些任务以及它们的目标地点在哪里（即用户是想订出租车去酒店，还是……）非常重要。\
  \   让我们尝试使用以下代码来实现这一点：  示例 1：   doc = nlp(u'Book a table at the restaurant and the\
  \ taxi to the hotel') tasks = doc[2], doc[8] #(table, taxi)   tasks_target = doc[5],\
  \ doc[11] #(restaurant, hotel)   for task in tasks_target:   for tok in task.ancestors:\
  \ if tok in tasks:   print(\"Booking of {} belongs to {}\".format(tok, task))  \
  \ break   输出：   Booking of table belongs to restaurant Booking of taxi belongs to\
  \ hotel   依存句法分析中的子节点是什么？   子节点是指该词元的直接句法依存项。我们可以像之前使用 `children` 属性一样，查看一个词的子节点。\
  \   list(doc[3].children)   将输出   [a, from, to]   依存句法分析的交互式可视化   第一次完全理解依存句法分析的概念非常困难。spaCy\
  \ 提供了一种极其简单且交互式的方式来理解其依存句法分析。spaCy v2.0+ 有一个可视化模块，我们可以将 `Doc` 对象或 `Doc` 对象列表传递给\
  \ `displaCy`，并调用 `displaCy` 的 `serve` 方法来运行 Web 服务器。   图 2-5 展示了依存句法分析的交互式可视化效果。\
  \   ![](img/image-cdxz1g76.png)  Figure 2-5. 依存句法分析的交互式可视化   你也可以生成图 2-5 中的依存句法分析可视化。要创建这样的可视化，请运行以下代码，然后在浏览器中访问\
  \ http://localhost:5000。   让我们尝试对我们关于任务及其目标地点的示例进行可视化。\n\n\n\nfrom spacy import\
  \ displacy  \ndoc = nlp(u'Book a table at the restaurant and the taxi to the hotel')\
  \  \ndisplacy.serve(doc, style='dep')  \n\n运行这段代码将产生如图 2-6 所示的输出。如果你得到类似的结果，请转到浏览器的另一个标签页并输入\
  \  \n\n我们会得到代码中该字符串的依存句法分析可视化结果（如图 2-7 所示）。  \n\n![](img/image-kl81sy6k.png)  \n\
  图 2-6. 在 localhost 上启动依存句法分析服务器  \n\n![](img/image-x09lcgrh.png)  \n图 2-7. 依存句法分析示例\
  \  \n\n我们再举一个依存句法分析的例子，假设用户正在询问以下句子：  \n\nWhat are some places to visit in Berlin\
  \ and stay in Lubeck?  \n\n我们首先创建如下所示的对象：  \n\ndoc = nlp(u\"What are some places\
  \ to visit in Berlin and stay in Lubeck\")  \n\n现在，我们获取正在讨论的地点以及用户想要执行的操作：  \n\n\
  places = [doc[7], doc[11]] #[Berlin, Lubeck]  \nactions = [doc[5], doc[9]] #[visit,\
  \ stay]  \n\n由于你已经了解词性标注和实体提取，你可以轻松自动地获取地点和操作。  \n\n现在我们有了地点，让我们遍历每个地点的所有祖先节点，并检查是否有任何祖先节点出现在操作列表中。在操作列表中找到的地点的第一个父节点，应该是该地点对应的操作。\
  \  \n\nfor place in places:  \n    for tok in place.ancestors:  \n        if tok\
  \ in actions:  \n            print(\"User is referring {} to {}\").format(place,\
  \ tok)  \n            break  \n\n输出：  \n\nUser is referring: Berlin to visit  \n\
  User is referring: Lubeck to stay  \n\n正如我们在这些示例中所看到的，依存句法分析使得理解用户所指的内容变得相当容易。我们发现在两个不同任务的情况下，我们也能很好地推断出用户的期望，并据此制定下一步的回应。\
  \  \n\n**依存句法分析在聊天机器人中的用途是什么？**  \n\n从头构建聊天机器人时，依存句法分析是最重要的部分之一。当你想要弄清楚用户输入给聊天机器人的文本含义时，它变得更为重要。有时你可能尚未训练你的聊天机器人，但你仍然不想失去客户，或者像一台愚蠢的机器一样回复。\
  \  \n\n在这些情况下，依存句法分析确实有助于发现关系，并更详细地解释用户可能正在询问的内容。  \n\n如果要列出依存句法分析有助于解决的问题，可能包括：\
  \  \n\n• 它有助于找出语法正确句子中单词之间的关系。  \n• 它可用于句子边界检测。  \n• 它在判断用户是否同时谈论多个上下文时非常有用。  \n\
  \n你可能会想，如果你的机器人用户在输入信息时说了任何语法不正确的句子，或者使用了短信简写，该怎么办？正如第 1 章所讨论的，你必须对这些情况保持警惕，并使用\
  \ NLP 技术相应地处理它们。  \n\n你需要编写自己的自定义 NLP 来理解用户或聊天机器人的上下文，并据此识别用户可能犯的语法错误。  \n\n总而言之，你必须为诸如用户输入垃圾值或语法错误句子等场景做好准备。你无法一次性处理所有此类场景，但你可以通过添加自定义\
  \ NLP 代码或通过设计限制用户输入来不断改进你的聊天机器人。  \n\n**名词组块**  \n\n名词组块或 NP 组块基本上是“基础名词短语”。我们可以说它们是扁平短语，以名词为核心。你可以将名词组块视为名词及其修饰词。\
  \  \n\n让我们尝试一个例子来更好地理解它。  \n\n示例 1：  \n\ndoc = nlp(u\"Boston Dynamics is gearing\
  \ up to produce thousands of robot dogs\")  \nlist(doc.noun_chunks)  \n\n输出：  \n\
  \n[Boston Dynamics, thousands, robot dogs]  \n\n虽然从给定句子中提取名词组块很有帮助，但 spaCy 还提供了其他可能有用的属性。让我们尝试探索其中一些。\
  \  \n\n示例 2：  \n\ndoc = nlp(u\"Deep learning cracks the code of messenger RNAs and\
  \ protein- coding potential\")  \nfor chunk in doc.noun_chunks:  \n    print(chunk.text,\
  \ chunk.root.text, chunk.root.dep_, chunk.root.head.text)  \n\n输出：  \n\nOutput:\
  \ Output: Output: Output: Output: Output:  \n\n正如我们从这张表中看到的，我们得到了名词组块及其属性。下表将帮助你理解每一列的含义。\
  \  \n\n![](img/image-sg3uojzz.png)  \n列名 含义  \n\n![](img/image-799hypjo.png)  \n\
  原始名词组块的文本  \n\n将名词组块与其余解析连接起来的原始单词的词根  \n\n将词根连接到其头节点的词根关系  \n\n![](img/image-utqty86m.png)\
  \  \n词根头节点的词根头  \n\n**查找相似度**  \n\n查找两个词之间的相似度是你在处理 NLP 时经常会遇到的一个用例。有时，判断两个词是否相似变得相当重要。在构建聊天机器人时，你经常会遇到不仅需要找到外观相似的词，还需要找到两个词在逻辑上关联程度的情况。\
  \  \n\nspaCy 使用高质量的词向量，通过 GloVe 算法（全局词向量表示）来查找两个词之间的相似度。  \n\nGloVe 是一种用于获取词向量表示的无监督学习算法。GloVe\
  \ 算法使用语料库中聚合的全局词-词共现统计信息来训练模型。  \n\n让我们尝试使用 token 的 `vector` 属性来查看 spaCy 向量中的实际值。\
  \  \n\ndoc = nlp(u'How are you doing today?')  \nfor token in doc:  \n    print(token.text,\
  \ token.vector[:5])  \n\n输出：  \n\n(u'How', array([-0.29742685, 0.73939574, -0.04001453,\
  \ 0.44034013, 2.8967502 ], dtype=float32))  \n(u'are', array([-0.23435134, -1.6145049\
  \ , 1.0197453 , 0.9928169 , 0.28227055], dtype=float32))  \n(u'you', array([ 0.10252178,\
  \ -3.564711 , 2.4822793 , 4.2824993 , 3.590245 ], dtype=float32))  \n(u'doing',\
  \ array([-0.6240922 , -2.0210216 , -0.\n\n\n\n91014993, 2.7051923 , 4.189252 ],\
  \ dtype=float32))(u'today', array([ 3.5409122 , -0.62185854, 2.6274266 , 2.0504875\
  \ , 0.20191991], dtype=float32)) (u'?', array([ 2.8914998 , -0.25079122, 3.3764176\
  \ , 1.6942682 , 1.9849057 ], dtype=float32)) 看到这个输出，它并没有太多意义和含义。从应用的角度来看，最重要的是不同单词的向量有多相似——也就是单词本身的含义。\n\
  \n为了在 spaCy 中查找两个单词之间的相似度，我们可以执行以下操作。\n\n示例 1：\n\nhello_doc = nlp(u\"hello\") hi_doc\
  \ = nlp(u\"hi\") hella_doc = nlp(u\"hella\")\n\nprint(hello_doc.similarity(hi_doc))\
  \ print(hello_doc.similarity(hella_doc)) 输出：\n\n0.7879069442766685\n\n0.4193425861242359\n\
  \n如果你看到单词 hello，它与单词 hi 更相关、更相似，尽管单词 hello 和 hella 之间只有一个字符的差异。\n\n我们再举一个句子的例子，了解\
  \ spaCy 如何进行相似度比较。还记得我们在前面章节中提到的《权力的游戏》例子吗？我们将尝试用它来查看相似度。\n\n代码：\n\nGoT_str1 = nlp(u\"\
  When will next season of Game of Thrones be releasing?\") GoT_str2 = nlp(u\"Game\
  \ of Thrones next season release date?\") GoT_str1.similarity(GoT_str2)\n\n输出：\n\
  \n0.785019122782813\n\n正如我们在本例中看到的，两个句子之间的相似度约为 79%，这足以说明这两个句子非常相似，事实也确实如此。这可以帮助我们在构建应用时节省大量编写自定义代码的时间。因此，我们得出一个事实：spaCy\
  \ 使用词向量为我们提供两个单词之间有意义的相似度，而不仅仅是查看它们的拼写或字母。\n\n我们将举一个非常简单的例子，尝试找出单词之间的相似度。\n\nexample_doc\
  \ = nlp(u\"car truck google\")\n\nfor t1 in example_doc: for t2 in example_doc:\
  \ similarity_perc = int(t1.similarity(t2) * 100) print \"Word {} is {}% similar\
  \ to word {}\".format(t1.text, similarity_perc, t2.text)\n\n输出：\n\nWord car is 100%\
  \ similar to word car Word car is 71% similar to word truck Word car is 24% similar\
  \ to word google Word truck is 71% similar to word car Word truck is 100% similar\
  \ to word truck Word truck is 36% similar to word google Word google is 24% similar\
  \ to word car Word google is 36% similar to word truck\n\nWord google is 100% similar\
  \ to word google\n\n当我们打算构建任何高度依赖 NLP 实现的应用时，查找单词或句子之间的相似度变得非常重要。如果你曾经使用过 StackOverFlow，每当我们尝试提出新问题时，它都会尝试列出平台上已经提出的类似问题。这是查找两组句子之间相似度可能有所帮助的最佳示例之一。spaCy\
  \ 基于已训练模型查找两个单词之间相似度的置信度，完全取决于所采用的一般假设类型。\n\n在构建聊天机器人时，查找相似度在以下情况下会非常有用：\n\n• 构建推荐型聊天机器人时\n\
  • 去除重复内容\n• 构建拼写检查器\n\n我们学到的这些内容在构建聊天机器人时非常重要，这样我们就知道如何解析用户输入，以便在代码内部编写业务逻辑时使其有意义。聊天机器人\
  \ NLP 中值得了解的内容\n\n在本节中，我们将学习几个有趣的主题，当你计划编写自己的自定义 NLP 方法来处理某些场景时，这些主题经常会派上用场。请务必仔细阅读它们，因为在你最不期待的时候，它们往往是最需要的。我们将简要讨论聊天机器人场景中的分词和正则表达式的使用。\n\
  \n分词\n\n分词是 NLP 中简单但基础的概念之一，我们将文本分割成有意义的片段。spaCy 首先对文本进行分词（即将其分割成单词，然后是标点符号和其他内容）。你可能会想到一个问题：为什么我不能直接使用\
  \ Python 语言内置的 split 方法来进行分词？Python 的 split 方法只是一个原始方法，用于根据分隔符将句子分割成标记。它不考虑任何含义，而分词则试图同时保留含义。\n\
  \n让我们尝试一些代码，看看分词是如何工作的。\n\n示例 1：\n\ndoc = nlp(u'Brexit is the impending withdrawal\
  \ of the U.K. from the European Union.')\n\nfor token in doc: print(token.text)\n\
  \n输出：\n\nBrexit is the impending withdrawal of the U.K. from the EuropeanUnion\n\
  \n如果你看到上面的输出，U.K. 在分词过程后作为一个单独的单词出现，这是有道理的，因为 U.K. 是一个国家名称，将其拆分是错误的。即使如此，如果你对 spaCy\
  \ 的分词不满意，你可以在完全依赖 spaCy 的分词方法之前，使用其 add_special_case 方法添加自己的规则。\n\n正则表达式\n\n你一定已经了解正则表达式及其用法。本书假设你已熟悉一般的正则表达式。在本节中，我们只是要浏览一些示例，看看正则表达式在构建聊天机器人时如何发挥优势并变得有用。\n\
  \n文本分析和处理本身就是一个庞大的主题。有时单词以某种方式组合在一起，使得机器极难理解和训练。正则表达式可以作为机器学习模型的一种回退方案。它具有模式匹配的能力，可以确保我们正在处理的数据是正确的还是错误的。第\
  \ 1 章“聊天机器人历史”部分讨论的大多数早期聊天机器人都高度依赖模式匹配。\n\n让我们看下面两个非常容易理解的示例。我们将尝试使用正则表达式从这两个句子中提取信息。\n\
  \n\n\n帮我预订一张从机场站到香港站的地铁票。再帮我叫一辆从香港机场到亚洲国际博览馆的出租车。以下是代码：  \nsentence1 = \"Book me\
  \ a metro from Airport Station to Hong Kong Station.\"  \nsentence2 = \"Book me\
  \ a cab to Hong Kong Airport from AsiaWorld-Expo.\"  \n\nimport re  \n\nfrom_to\
  \ = re.compile('.* from (.*) to (.*)')  \n\nto_from = re.compile('.* to (.*) from\
  \ (.*)')  \n\nfrom_to_match = from_to.match(sentence2)  \nto_from_match = to_from.match(sentence2)\
  \  \n\nif from_to_match and from_to_match.groups():  \n  _from = from_to_match.groups()[0]\
  \  \n  _to = from_to_match.groups()[1]  \n  print(\"from_to pattern matched correctly.\
  \ Printing values\\n\")  \n  print(\"From: {}, To: {}\".format(_from, _to))  \n\n\
  elif to_from_match and to_from_match.groups():  \n  _to = to_from_match.groups()[0]\
  \  \n  _from = to_from_match.groups()[1]  \n  print(\"to_from pattern matched correctly.\
  \ Printing values\\n\")  \n  print(\"From: {}, To: {}\".format(_from, _to))  \n\n\
  输出：  \n\nto_from pattern matched correctly. Printing values  \nFrom: AsiaWorld-Expo.,\
  \ To: Hong Kong Airport  \n\n尝试将 sentence2 改为 sentence1，看看代码是否能正确识别模式。  \n尽管如今机器学习功能强大，正则表达式和模式匹配已退居次位，但请务必温习一下相关知识，因为随时可能需要用它从单词、句子或文本文档中解析特定细节。\
  \  \n\n总结  \n\n至此，你应该已经清楚为什么在开始构建聊天机器人之前需要了解 NLP。在本章中，我们学习了 Python 中的 spaCy 模块、它的特性以及如何安装它。我们深入探讨了\
  \ NLP 的各种方法，这些方法在构建聊天机器人时被广泛使用。我们学习了词性标注、词干提取与词形还原的区别、实体识别、名词组块化以及查找词组之间的相似性。  \n\
  \n我们为所有这些概念编写了代码，并通过实践而非仅仅阅读来学习它们——这正是本书所强调的。我们还复习了分词和正则表达式的基础知识。我们已经准备好进入下一章，使用一个名为\
  \ Dialogflow 的免费工具来构建我们的聊天机器人。在下一章中，我们将学习如何训练我们的聊天机器人来理解和提取用户提供的信息。  \n\n第 3 章 \
  \ \n\n––––––––  \n\n轻松构建聊天机器人  \n\n“轻松构建聊天机器人”这一章的编写考虑到有时你不想从头开始构建一切，只想快速完成任务。本章不需要你编写大量代码，但仍能让你清楚地了解如何以简单的方式构建聊天机器人并将其发布。\
  \  \n\n本章之所以对学习构建聊天机器人更为重要，是因为软件世界变化太快，需要快速适应。有时我们需要快速构建应用程序，并尝试寻找开源库中可用的工具，以便无需重新发明轮子就能快速构建应用。\
  \  \n\n有时我们的编码能力不足以从头构建一切。即使我们想从头构建应用，也可能因为学习曲线对新入门者来说过于陡峭而无法实现。  \n\n本章将帮助你快速构建聊天机器人，并将其发布供全世界使用。\
  \  \n\n我们将尝试使用一个以前称为 Api.ai 的工具，现在它被称为 Dialogflow。  \n\nDialogflow 简介  \n\nDialogflow\
  \ 通过构建引人入胜的语音和文本对话界面（如语音应用和聊天机器人），为用户提供了与其产品互动的新方法。  \n\nDialogflow 由人工智能驱动。它帮助你与网站、移动应用、Google\
  \ Assistant、Amazon Alexa、Facebook Messenger 以及其他流行平台和设备上的用户建立连接。  \n\n以下来自 Dialogflow\
  \ 的图表展示了它们如何处理用户请求。  \n\n––––––––  \n\n63  \n\n![](img/image-7r6ovgla.png)  \n\n\
  图 3-1. Dialogflow 架构工作示意图  \n\n流程如下：  \n\n用户与输入设备对话。用户查询进入 Dialogflow 引擎。Dialogflow\
  \ 尝试识别意图。根据意图执行 fulfillment，并从数据库返回数据。响应返回给意图。响应被转换为可操作的数据。用户的信息请求被返回给输出设备。  \n\n\
  Dialogflow 中有一个“代理”的概念，最好将其描述为自然语言理解（NLU）模块。这些模块可以集成到你的应用、产品或服务中，将用户的自然语言请求转换为可操作的数据。当用户输入与代理中的某个意图匹配时，就会发生这种转换。\
  \  \n\n代理还可以被设计为以特定方式管理对话流程。这可以通过上下文、意图优先级、槽位填充、职责以及通过 webhook 进行 fulfillment 来实现。\
  \  \n\n入门指南  \n\n了解我们目前所学的内容过去和现在都很重要，因为开源中提供的免费工具和包并不总能帮助你构建一个完整的聊天机器人应用。  \n\n\
  很多时候，你可能会遇到想要自己构建一切的情况，以便对应用拥有更多控制权。我们将在下一章学习这些内容，并同时使用之前学到的 NLP 技术。  \n\n本章的全部内容是关于创建一个概念验证型的聊天机器人，并使其在几乎不需要编程经验或无需编程的情况下准备好供全世界使用。\
  \  \n\n构建一个订餐聊天机器人  \n\n我们将借助 Dialogflow 为一家特定餐厅创建一个聊天机器人。我们将其命名为 OnlineEats 产品。你也可以选择其他任何你想构建聊天机器人的用例。在本章中，我们将构建一个订餐聊天机器人。\
  \  \n\n确定范围  \n\n让我们确定这个聊天机器人的范围——即它能做什么以及做到什么程度。  \n\n• 它应该能够动态地向用户打招呼。  \n\n\n\
  \n• 它应能理解菜单项及其请求的数量。\n• 聊天机器人应能代表用户下单。\n• 当用户询问时，能提供订单状态。\n\n列出意图\n在此，我们列出希望聊天机器人训练的意图，以便它在用户询问时能够理解这些意图。\n\
  \n意图\n• 默认欢迎意图：当用户向聊天机器人发送消息时触发\n• 下单意图：当用户要求机器人点餐时触发\n• 商品描述意图：当用户告知所需商品和数量时触发\n\
  • 订单状态：当用户想了解订单状态时触发\n• 订单 ID：机器人需要理解用户的订单 ID 以进行追踪。\n• 用户感谢：当用户感谢机器人时触发\n\n列出实体\n\
  我们将在此尝试列出所有意图可能涉及的实体。在后续章节中，我们将看到这些实体如何根据适用的意图进行定义。\n\n实体\n• food_items：用户想点哪些食物？\n\
  • quantities：用户想点的食物数量是多少？\n• order_id：为用户下单的订单 ID\n\n构建食品订购聊天机器人\n让我们也设定聊天机器人的期望值，明确它至少应能完成哪些基本任务。为此，我们编写一个聊天机器人与用户之间的对话脚本。这有助于我们坚持计划，在假设用户以友好且正确的方式进行对话的前提下，准备好一个能基本运行的聊天机器人。\n\
  \n聊天机器人与用户对话脚本：\n用户：你好\nOnlineEatsBot：你好，欢迎光临！有什么可以帮您的吗？\n用户：我想点中餐。\nOnlineEatsBot：好的，您今天想点什么？\n\
  用户：一份鸡肉饺子，两份春卷。\nOnlineEatsBot：完成。您的总金额为 XYZ，已为您下单：1 份鸡肉饺子，2 份春卷。\n用户：我还没收到我的订单。我的食物在哪？\n\
  OnlineEatsBot：请提供您的订单 ID 好吗？\n用户：123456\nOnlineEatsBot：订单 ID：123456 的订单状态。配送员已在您所在区域，您的食物大约\
  \ 5 分钟内送达。\n用户：谢谢。\nOnlineEatsBot：非常感谢您的配合。\n\n现在我们已经编写了一个基本脚本来指导构建聊天机器人，接下来我们将深入探讨\
  \ Dialogflow。\n\nDialogflow 入门\n让我们按照以下步骤在 Dialogflow 中创建账户，然后创建一个代理。（代理其实就是聊天机器人的另一种说法。）\n\
  \n在 Dialogflow 创建账户并登录。\n创建一个代理。\n![](img/image-h773tmys.png)\n图 3-2. 在 Dialogflow\
  \ 中创建新代理\n\n输入详细信息，如代理名称、时区、默认语言以及您想选择或新建的 Google 项目。\n\n创建意图。\n查看图 3-3，您会发现系统已经提供了两个意图。\n\
  \n• 默认回退意图：如果用户的输入与任何常规意图或启用的内置闲聊都不匹配，则会触发回退意图。创建新代理时，会自动创建一个默认回退意图。您可以根据需要修改或删除它。\n\
  • 默认欢迎意图：我们可以扩展此欢迎意图用于自己的聊天机器人。您应该添加一些自己的用户表述和默认响应。\n![](img/image-dfb2ywfd.png)\n\
  图 3-3. 在 Dialogflow 中创建意图\n\n在创建我们自己的意图之前，让我们先在默认欢迎意图中添加一些表述，并按照以下步骤使其就绪：\n\n点击默认欢迎意图。\n\
  在“训练短语”中添加您自己的用户表述。\n点击“保存”。\n\n当我们点击保存时，后台的机器学习模型会运行并训练我们提供的数据（即用户表述）。训练数据意味着让机器根据我们提供的数据理解这是什么类型的意图，并能够在接收到新数据时进行预测。例如，查看图\
  \ 3-4，我们定义了五个用户表述，机器已知这些表述属于“欢迎意图”。如果用户说“Hello there”（该表述未在任何地方定义），会发生什么？机器仍会将“Hello\
  \ there”归类为默认欢迎意图，因为训练中使用的特征以及机器对欢迎意图的理解与新用户表述中的特征相似。\n![](img/image-xpujxk7c.png)\n\
  图 3-4. 在 Dialogflow 中定义默认欢迎或问候意图\n\n让我们测试一下欢迎意图是否有效。使用 Dialogflow，我们可以在仪表板中直接进行测试。见图\
  \ 3-5。\n![](img/image-ru8shcrc.png)\n图 3-5. 在 Dialogflow 中测试欢迎意图\n\n创建意图时的注意事项\n\
  让我们了解一些在 Dialogflow 中创建意图时的重要知识点。\n\n• Dialogflow 的意图还具备为每个意图设置默认响应的功能。默认响应是每次识别到该意图时返回给用户的响应。在我们的示例中，当用户说“Hello\
  \ there”时，我们会从机器人那里得到“Hello!”作为响应。\n• 如果您愿意，可以添加更多响应或删除现有响应。拥有多个响应能让机器人看起来更真实，这样它就不会每次都回复相同的内容，让与机器人对话的用户感觉更人性化。\n\
  • Dialogflow 中的意图还可以标记为对话结束。换句话说，您可以让机器人假设用户将不再参与对话，机器人可以根据此信息执行必要操作来结束对话。\n\n创建意图并添加表述\n\
  现在我们已经创建了欢迎意图，接下来创建下单意图，我将其命名为“下单意图”。\n\n以下是我输入的用户表述：\n我想要食物\n我想尽快点餐\n你能帮我点餐吗？\n\
  \n\n\n请帮我点餐  我想点中餐 我想点餐  你能帮我点餐吗？请帮我点餐好吗？  我想点餐  我想点泰餐  我想点中餐  现在，我们已经构建了意图来识别上述用户表达或相关用户表达。接下来，是时候使用意图的默认回复向用户添加回复了。\n\
  \n为意图添加默认回复\n\n我们将添加三种可能的回复，一旦检测到 `place_order_intent`，就会返回给用户。\n\n当然，您今天想点什么？没问题，您今天想吃点什么？\n\
  好的，我会尽力帮您。您今天想吃点什么？\n\n现在，下一步是等待用户输入他想要的食物并解析这些食物。现在我们将创建一个新的意图，告诉我们用户实际想要点什么（即食物项目）。\n\
  \n我们创建一个名为 `items_description` 的新意图\n\n首先，我们添加标准的用户表达。\n\n一个鸡肉饺子和两个春卷。\n\n当我们添加用户表达后，我们可以选择特定的词语，将其指定为意图的实体。这可以是数量、日期或时间、地点等预定义的实体，但我们也可以通过点击弹出框右下角的“创建新实体”按钮来创建自己的实体。\n\
  \n高亮显示话语中你想要设为实体的词语。之后，会弹出创建我们自己的实体的对话框。\n\n在这个例子中，我们应该能够以一种易于阅读的格式解析数据，以便我们可以使用任何编程语言来使用它。JSON\
  \ 格式是当今跨平台应用中我们能拥有的最佳格式。Dialogflow 默认以 JSON 格式返回数据，可以解析成类似下面代码的样子。始终建议尽可能保持数据最小化；不要因为提供过多数据而使\
  \ API 响应过载。请记住，所有这些在规模化时都是要花钱的。\n\n{\n  \"food_items\": {\n    \"chicken dumpling\"\
  : 1,\n    \"Spring rolls\": 2\n  }\n}\n\n项目描述意图及其所属实体\n\n我们可以选择“一”和“二”，并将它们定义为 `@sys.number`，这其实就是数据类型。我们将创建一个名为\
  \ `food_items_entity` 的新实体来识别食物项目。\n\n如果你查看图 3-6，你会发现我们有一个名为 `food_items_` 的实体，但当我们选择词语时，我们将参数命名为\
  \ `food_items_entity1`，对于食物数量也是如此，它是一个数字，我们将第一个和第二个参数分别命名为 `quantity1` 和 `quantity2`。![](img/image-zv0s5e11.png)\
  \ 图 3-6. 项目描述意图\n\n我们在这里定义的内容将帮助我们理解在意图被触发后我们将收到的 JSON 响应。我们应该拥有所有这些值，以便继续推进聊天机器人的流程。\n\
  \n所以，选择整个词语或词语组合，然后点击“创建”。会出现一个新屏幕来创建实体；只需输入这个新实体的名称并保存。\n\n现在，回到我们的 `items_description`\
  \ 意图，你应该会看到类似图 3-6 的内容。\n\n继续在训练短语中添加更多的用户表达，并在其中定义实体。\n\n到目前为止，我们已经添加了四个话语，它们看起来是这样的。我们将尽可能多地添加，以便我们的智能体在意图分类方面的准确性更高。\n\
  \nDialogflow 还有一个共享智能体训练数据的功能。本书中使用的训练数据可以通过 Apress 网站 https://github.com/Apress/building-\
  \ 访问。正如你在图 3-7 中看到的，我们尝试在我们的 Dialogflow 智能体的项目描述意图中添加更多示例。![](img/image-0szok150.png)\
  \ 图 3-7. 在项目描述意图中添加更多话语\n\n现在，此时一旦我们保存了意图，并且我们的智能体完成了模型训练。如果我们在右侧输入以下句子，我们应该能够看到如下的\
  \ JSON 响应：\n\n一个鸡肉饺子和两个春卷\n\n来自意图的响应：\n\n{\n  \"id\": \"e8cf4a44-6ec9-49ae-9da8-a5542a80d742\"\
