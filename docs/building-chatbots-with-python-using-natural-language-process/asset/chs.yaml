  \ 492 packages in 10.14s\n\n即使您的消息与此不同，只要没有抛出任何错误，就无需担心。我们稍后就会知道 rasa-nlu-trainer\
  \ 是否成功安装并能正常工作。\n\n让我们在终端中进入之前创建的数据文件夹，并运行以下命令：\n\nrasa-nlu-trainer\n\n输入此命令将在端口\
  \ 55703 上启动一个本地服务器，并在默认浏览器中打开它。界面将类似于图 4-1。\n\n![](img/image-xqb2tv9c.png)\n\n图\
  \ 4-1. 本地主机中的 rasa-nlu-trainer\n\n如您所见，data.json 中的所有现有数据都被这个出色的工具加载，供我们删除或编辑，我们也可以从这里添加新的示例，它会不断扩展\
  \ data.json 文件。\n\n我建议您为意图添加更多数据，以便更好地训练模型。如果您正在尝试构建本章中介绍的同一聊天机器人，可以从出版商提供的源代码压缩包或仓库中获取这个\
  \ data.json 文件。\n\n就像我们在第 3 章中使用 Dialogflow 在话语中选择实体进行定义一样，我们可以使用此工具进行相同的操作，并为实体命名以便后续解析。因此，点击示例的切换按钮，选择文本，并通过命名来添加一个实体。\n\
  \n我在定义的每个意图中都添加了五到六个话语示例。我们添加的示例越多，模型训练效果就越好，准确率也越高。\n\n现在查看 data.json 文件，您会发现它自动添加了更多示例。\n\
  \n因此，请继续验证您的 data.json 文件，确认其中包含了您从 rasa-nlu-trainer UI 添加的所有示例。您还会注意到，在 data.json\
  \ 文件中，您可能使用 rasa-nlu-trainer UI 定义的实体被捕获在 common_examples 列表中，并带有 start 和 end 键，这告诉模型特定实体值在示例中的起始和结束位置。\n\
  \n同一个字典对象还描述了实体的值和我们定义的实体名称。对于我们的示例，它看起来如下：\n\n{\n  \"text\": \"19-01\",\n  \"intent\"\
  : \"dob_intent\",\n  \"entities\": [\n    {\n      0,\n      2,\n      \"value\"\
  : \"19\",\n      \"entity\": \"DD\"\n    },\n    {\n      3,\n      5,\n      \"\
  value\": \"01\",\n      \"entity\": \"MM\"\n    }\n  ]\n}\n\n训练聊天机器人模型\n\n在本节中，我们将基于准备好的数据训练一个模型。由于我们使用\
  \ Jupyter Notebook 进行文件创建和管理，我们将创建一个新的 .ipynb 文件，并开始编写 Python 代码，通过选择本章前面讨论的其中一个管道来训练我们的模型。\n\
  \n创建配置文件\n\n让我们再次以之前使用 Jupyter 创建文件的方式创建一个 JSON 文件，并将其命名为 config.json。将其放在数据文件夹之外（即项目目录\
  \ horoscope_bot 中）。\n\n向其中添加以下配置：\n\n{\n  \"pipeline\": \"tensorflow_embedding\"\
  ,\n  \"path\": \"./models/nlu\",\n  \"data\": \"./data/data.json\"\n}\n\n如您所见，config.json\
  \ 文件中配置了一些重要的参数。让我们尝试理解它们。\n\n*   pipeline 指定将使用哪些特征化器或特征提取器来处理文本消息并提取必要信息。在我们的例子中，我们使用的是\
  \ tensorflow_embedding。\n*   path 本质上是训练后保存模型的目录。我们将模型保存在 /models/nlu 文件夹中。\n* \
  \  data 是需要指定的路径，即训练数据所在的位置。\n\n完成 config.json 文件后，让我们继续编写一些 Python 代码来训练我们的机器学习模型。\n\
  \n![](img/image-ai5wtx8d.png)\n\n––––––––\n\n您也可以使用 .yml 文件作为配置文件，如下所示。您可以在 GitHub\
  \ 仓库中找到示例 config.yml 文件。\n\n*   示例 1：\n\nlanguage: \"en\"\npipeline: \"tensorflow_embedding\"\
  \n\n*   示例 2：\n\nlanguage: \"en\"\npipeline:\n  - name: \"nlp_spacy\"\n  - name:\
  \ \"tokenizer_spacy\"\n  - name: \"intent_entity_featurizer_regex\"\n  - name: \"\
  intent_featurizer_spacy\"\n  - name: \"ner_crf\"\n  - name: \"ner_synonyms\"\n\n\
  ![](img/image-5lnb5yze.png)\n\n  - name: \"intent_classifier_sklearn\"\n\n所有传入的消息都按照定义的组件顺序进行处理。定义的组件按顺序逐一运行，因此被称为处理管道。不同的组件用于不同的目的，例如实体提取、意图分类、预处理等。\n\
  \n这种格式的好处是，我们可以以清晰的方式指定 Rasa 预定义的管道。\n\n\n\n编写 Python 代码训练模型并进行预测  \n让我们打开一个新的`.ipynb`文件，开始编写代码。将\
  \ ipynb 文件命名为`rasa-nlu.ipynb`。请确保已针对您使用的 Python 版本成功安装了`rasa-nlu==0.13.2`。  \n\n\
  以下是我们使用`data.json`和`config.json`在 Python 中加载数据，并通过`tensorflow_embedding`管道训练模型的代码。\
  \  \n\n```python\nfrom rasa_nlu.training_data import load_data\nfrom rasa_nlu.model\
  \ import Trainer\nfrom rasa_nlu import config\nfrom rasa_nlu.model import Interpreter\n\
  \ndef train_horoscopebot(data_json, config_file, model_dir):\n    training_data\
  \ = load_data(data_json)\n    trainer = Trainer(config.load(config_file))\n    trainer.train(training_data)\n\
  \    model_directory = trainer.persist(model_dir, fixed_model_name='horoscopebot')\n\
  \ndef predict_intent(text):\n    interpreter = Interpreter.load('./models/nlu/default/horoscopebot')\n\
  \    result = interpreter.parse(text)\n    print(result)\n```\n\n在代码的第一部分，我们从`rasa_nlu`包中导入了所有必要的库。然后定义了两个方法：`train_horoscopebot`和`predict_intent`。第一个方法根据给定的数据、配置文件（`config_file`）和模型存储目录（`model_directory`）来训练模型；第二个方法使用`rasa_nlu`中的`Interpreter`模型加载预训练好的模型文件，使用户能够预测任何新的文本示例。\n\
  \n**训练模型**  \n我们运行以下代码片段，调用`train_horoscopebot`方法并传入相应参数：  \n\n```python\ntrain_horoscopebot('./data/data.json',\
  \ 'config.json', './models/nlu')\n```\n\n在`rasa-nlu.ipynb`中运行此代码后，我们将得到类似如下的输出：\
  \  \n\n```\nEpochs: 300/300 [00:01<00:00, 175.69it/s, loss=0.075, acc=1.000]\n```\n\
  \n训练聊天机器人模型的代码会创建一个`models`文件夹，您可以通过 Jupyter 或文件资源管理器/访达应用查看。它会在我们指定的模型目录路径下生成一系列索引、元数据和\
  \ pickle 文件。\n\n**从模型进行预测**  \n让我们调用该方法，传入一段文本，看看训练好的模型表现如何：  \n\n```python\npredict_intent(\"\
  I am looking for my horoscope for today. I am wondering if you can tell me that.\"\
  )\n```\n\n该方法会直接打印输出结果。对于上述文本，我的输出如下所示：  \n\n```\nINFO:tensorflow:Restoring parameters\
  \ from ./models/nlu/default/horoscopebot/intent_classifier_tensorflow_embedding.ckpt\n\
  \n{\n  \"intent\": {\n    \"name\": \"get_horoscope\",\n    \"confidence\": 0.9636583924293518\n\
  \  },\n  \"entities\": [],\n  \"intent_ranking\": [\n    {\n      \"name\": \"get_horoscope\"\
  ,\n      \"confidence\": 0.9636583924293518\n    },\n    {\n      \"name\": \"dob_intent\"\
  ,\n      \"confidence\": 0.03462183475494385\n    },\n    {\n      \"name\": \"\
  greeting\",\n      \"confidence\": 0\n    },\n    {\n      \"name\": \"subscription\"\
  ,\n      \"confidence\": 0\n    }\n  ],\n  \"text\": \"I am looking for my horoscope\
  \ for today. I am wondering if you can tell me that.\"\n}\n```\n\n哇！是不是很神奇？我们的模型以\
  \ 96%的置信度预测出了这段文本的意图。您可以在提供的 ipynb 文件中看到，我们的模型在预测其他意图方面也表现良好。\n\n这就是 tensorflow\
  \ 和机器学习整体的力量。毋庸置疑，`rasa_nlu`库让这一切变得如此简单可信。所以，是时候回顾一下了——如果您还记得本书的第 3 章，那么您一定记得，每当我们添加一个新示例时，Dialogflow\
  \ 都会重新训练模型。它实际上在幕后做着和我们刚才一样的事情。我们当时无法更改模型或调整任何参数，但现在我们完全可以掌控这一切。\n\n既然我们已经成功使用 tensorflow\
  \ 构建并训练了一个模型，并且也对其进行了测试，接下来我们将进入对话管理的下一个主题。我建议您测试一下您的机器人可能面临的所有场景，这样您就能了解模型在哪些方面表现不佳，并据此添加更多数据或在必要时调整参数。\n\
  \n另外请记住，只有当训练数据发生变化时，才需要重新训练模型。如果训练数据没有变化，我们可以加载现有的训练模型，持续对新示例进行预测。\n\n**使用 Rasa\
  \ Core 进行对话管理**  \n在本节中，我们将通过训练另一个用于 Rasa Core 对话管理的模型来亲自动手实践。请记住，此时我们已经有了一个可以预测文本意图的模型，我们可以编写一些\
  \ Python 代码来生成回复，并回复给客户。但是，如果我们想为机器人添加更多意图呢？在功能众多的大型应用中，这种方式是否可扩展？答案是否定的。这时，Rasa\
  \ Core 的对话管理功能就派上用场了。\n\n如果您曾在任何平台上使用过任何机器人，您一定见过它在某些情况下失败。是的，我们都经历过这种情况，而且这种情况至今仍然存在——如今的机器人往往无法妥善管理对话的上下文，也无法跟上对话的节奏。借助\
  \ Rasa Core 基于机器学习的对话框架，我们可以轻松解决这个问题。\n\nRasa Core 在企业级应用中久经考验，被成千上万的开发者使用，因为它生产就绪、易于使用和扩展，而且最重要的是，它是开源的。\n\
  \n**进一步了解 Rasa Core 和对话系统**  \n在我们真正进入 Rasa Core 对话管理模型的编码部分之前，理解其来源和适用场景非常重要。\n\
  \n我们将尝试理解迄今为止我们构建聊天机器人的方式，以及这种方式将如何被彻底改变。\n\n举个例子：  \n如果我们想构建一个简单的聊天机器人，帮助用户预订机票/巴士票/电影票/火车票，最简单的方法是创建一个状态机或决策树，编写一堆`if...else`语句，然后就可以完成了。这种方法虽然可行，但无法扩展。如果客户最初对某件事有良好的体验，他们就会想更多地使用它。通过一些启发式方法，我们可以让聊天机器人显得智能，但这种智能无法持久。\n\
  \n\n当代码的控制流从 `try` 块跳转到 `except` 块时，我们开始挠头。图 4-2 简单展示了用于构建此聊天机器人的状态机可能的样子。  \n![](img/image-fhk2k9em.png)\
  \  \n––––––––  \n图 4-2. 订票聊天机器人的状态图表示  \n\n观察我们的状态图，它可能适用于正常对话场景，比如用户正在查找电影票、汽车票或火车票，或者在询问电影票后想要预订汽车票。但如果用户同时询问汽车票和电影票呢？你可能会说，我们可以在已经嵌套的代码中再添加几个\
  \ `if...else` 语句来处理这种情况。如果你是一名优秀的开发者，编写一个状态机的输入输出或扩展决策树并不会花费太多时间。但请思考一下这种情况：当这些条件开始呈指数级增长，你必须不断添加用例来处理它们，并且它们开始相互干扰时，该怎么办？\
  \  \n\n我们的大脑运作方式是通过学习和再学习。如果一个孩子不知道火会对自己造成什么伤害，他会去触摸它；但当火灼伤他时，他就不会再碰了。他会强化一个事实：火是有害的。奖励机制也是如此——当你做某事并得到回报时，你会将“做某事会带来奖励或更好的奖励”这一事实关联起来，然后你倾向于再次这样做。这在机器学习中被称为**强化学习**，即机器通过执行动作并理解结果来学习如何在特定情境中表现。强化学习有时并非最佳方法，例如在数据不足以学习、数据质量不足以学习奖励场景等情况下。\
  \  \n\n图 4-3 是一张示意图，帮助你理解 Rasa Core 如何在 Rasa 技术栈中完美契合，以及它与我们一直在学习的 Rasa NLU 各自扮演的角色。\
  \  \n![](img/image-5lijm842.png)  \n图 4-3. 展示 Rasa NLU 和 Rasa Core 工作原理的示意图  \n\n\
  借助 Rasa Core，我们可以指定机器人应该说或做的所有事情。这些被称为**动作**。一个动作可能是向用户打招呼、查询数据库，或者通过某个网络服务或 API\
  \ 检索信息。  \n\nRasa Core 提供了训练概率模型的功能，以根据用户的历史对话预测需要执行什么动作。想象一下，如果没有 ML 模型，你需要编写数百个用例来确定应该发送或执行什么响应或动作。简单来说，Rasa\
  \ Core 为你解决了这个问题。  \n\n让我们看看在第 3 章构建 OnlineEatsBot 时，我们创建的用户与机器人的并排对话。  \n![](img/image-k35fw6pl.png)\
  \  \n用户  \nOnlineEatsBot  \n![](img/image-l83ltg41.png)  \n你好，onlineeats  \n你好！有什么可以帮你的吗？\
  \  \n我想点餐  \n好的，今天想点什么？一个鸡肉汉堡  \n好的。您的最终金额是 3.99 美元  \n![](img/image-he8wx5vt.png)\
  \  \n谢谢  \n非常感谢  \n\n这段对话非常简单，即使没有 ML 模型也能完成，尽管我们确实使用了训练好的模型来识别其中的意图和实体。  \n\n现在，你脑海中可能会浮现一个有趣的问题：“如果我希望我的机器人能够更改订单呢？如果我希望我的机器人能够删除或增加食品数量呢？”因此，正如讨论过的，添加更多用例、更多复杂性、更多意图及其表述、更多代码中的\
  \ `if...else` 来处理边界情况——但当你为企业构建聊天机器人时，你必须通过它来扩展业务以产生更多收入。所有软件系统都这样做，而那些不这样做的系统则无法生存。关键在于，我们不能一直修改和部署代码。\
  \  \n\n因此，与其在每次出现情况时处理所有用例并重复操作，我们可以借助 Rasa Stack 采取 ML 路线来解决这个问题。Rasa Stack 会根据用户的上下文和对话状态告诉我们机器人下一步应该做什么。由于模型会根据先前对话数据的上下文自行学习，机器人更容易保持对话的自然和用户友好性，而不是从四五个固定句子中随机选择。\
  \  \n\nRasa 建议数据较少或没有数据的用户使用交互式学习。我们将在本章后面进一步了解交互式学习。  \n\n在真正开始使用 Rasa Stack 编写机器人的核心部分之前，我们首先需要理解几个概念。\
  \  \n\n### 理解 Rasa 概念  \n\n在完全将这些概念应用于代码之前，理解几个与 Rasa 相关的特定概念非常重要。在本节中，我们将学习 Rasa\
  \ NLU 中一些重要且非常实用的概念。请确保你完全理解这些概念，因为我们将在使用 Rasa 的领域文件格式构建第一个内部聊天机器人时用到它们。如果我们不理解这些概念的含义，那么下一步将难以进行。\
  \  \n\n#### 动作  \n\n顾名思义，这是一个可以执行的特定动作。根据 Rasa 文档，它指的是“响应对话而采取的动作”。  \n\n例如，如果用户询问今天的星座运势，我们的机器人可以执行“GetTodaysHoroscope”动作。让我们看看“GetTodaysHoroscope”动作在代码中是什么样子。\
  \  \n\n```python\nfrom rasa_core.actions import Action\nfrom rasa_core.events import\
  \ SlotSet\n\nclass GetTodaysHoroscope(Action):\n    def name(self):\n        return\
  \ \"get_todays_horoscope\"\n\n    def run(self, dispatcher, tracker, domain):\n\
  \        # type: (Dispatcher, DialogueStateTracker, Domain) -> List[Event]\n   \
  \     user_horoscope_sign = tracker.get_slot('horoscope_sign')\n        \"\"\"编写你的逻辑，根据某些\
  \ API 调用或数据库检索，获取给定星座的今日运势详情\"\"\"\n        return [SlotSet(\"horoscope_sign\",\
  \ user_horoscope_sign)]\n```\n\n`name` 方法返回动作的名称，我们将在领域文件中将其作为自定义方法名引用。\n\n\n\n\
  `run` 方法负责执行动作的主要工作——即核心业务逻辑位于此处。如你所见，它接受三个参数：`dispatcher`、`tracker` 和 `domain`。让我们逐一理解这些参数：\n\
  \n• `dispatcher`：调度器用于向用户发送消息。我们可以使用 `dispatcher.utter_message()` 来实现这一点。\n• `tracker`：当前用户的状态追踪器。我们可以使用\
  \ `tracker.get_slot(slot_name)` 访问槽值，要获取最近的用户消息，可以使用 `tracker.latest_message.text`。\n\
  • `domain`：机器人的领域。我们将在本章后面更详细地讨论领域。\n\n![](img/image-bt9rkmuc.png)\n\n**注意**：`run`\
  \ 方法返回一个事件实例列表。\n\n![](img/image-vbahuoun.png)\n\n––––––––\n\n### 槽位\n\n槽位是让机器人能够像人类一样工作的关键。槽位就像一个存储空间，可以存储用户提供的信息，也可以使用从数据库或\
  \ API 预取的信息。\n\n针对不同的用例，有不同类型的槽位：\n\n例如，在我们构建 HoroscopeBot 的用例中，我们可能希望将用户提供的 `horoscope_sign`\
  \ 的槽位类型设置为文本。\n\n根据你想要保留的槽位类型，Rasa 提供了一些预定义的槽位类型。\n\n除了文本类型，Rasa 还有以下槽位类型：\n\n•\
  \ **布尔型** ⇒ 用于真/假值\n• **类别型** ⇒ 用于需要从几个值中选择一个的情况\n• **浮点型** ⇒ 用于连续值\n• **列表型** ⇒\
  \ 用于值列表\n• **特征化型** ⇒ 用于不影响对话的内部值存储\n\n### 模板\n\n“模板”这个词你在生活中一定至少听过一次，比如在寻找发送电子邮件的模板、准备文档的模板、构建个人作品集网站的模板，或者遵循某个流程时。\n\
  \nRasa 中的模板用于话语。一个话语模板包含一组预设文本，当某个动作被触发时，这些文本会被发送给用户。通过使动作的名称与话语相同，或者通过一个包含自定义代码的动作，我们可以将模板中格式化后的消息发送给用户。\n\
  \n领域文件中模板的简单表示可能如下所示：\n\n```\ntemplates:\n  utter_greet:\n    - \"你好，{name}。{name}\
  \ 可以通过同名槽位或自定义代码填充\"\n  utter_goodbye:\n    - \"再见\"\n    - \"保重。多个模板允许机器人从中随机选择\"\
  \n  utter_default:\n    - \"抱歉，我没有理解您的意思。\"\n```\n\n现在，我们已经了解了动作、槽位和模板这三个概念，并且通过第\
  \ 3 章的学习已经知道了意图和实体是什么，我们准备深入 Rasa，开始为我们的第一个聊天机器人编写代码。\n\n### 为聊天机器人创建领域文件\n\n使用\
  \ Rasa 技术栈构建聊天机器人时，首要任务就是创建一个领域文件。\n\n根据 Rasa 的文档：“领域定义了你的机器人运行所在的宇宙。\n\n它指定了你的机器人应该知道的意图、实体、槽位和动作。可选地，它还可以包含机器人可以说的话的模板。”\n\
  \n现在，你明白为什么我们之前要提前理解 Rasa 核心概念来为这种情况做准备了吧。让我们创建一个使用 YAML 定义的 `DefaultDomain` 文件。Rasa\
  \ 使用 `.yml` 文件来定义领域格式。\n\n最初，YAML 被认为是“Yet Another Markup Language”（另一种标记语言）的缩写，表明其作为标记语言的用途，但后来被改为理解为“YAML\
  \ Ain't Markup Language”（YAML 不是标记语言），这是一个递归缩写，目的是将其用途区分为面向数据，而不是文档标记语言。\n\n现在，让我们回到我们的\
  \ `rasa-nlu` Jupyter Notebook 目录，开始创建文件。请注意，我们可以使用命令行将所有代码写在单独的文件中，并使用编辑器进行编辑。我发现\
  \ Jupyter Notebook 更具交互性，并且浏览文件更方便。选择你习惯的方式即可，但了解 Jupyter Notebook 提供的大部分功能是件好事。\n\
  \n进入主 `horoscope_bot` 目录，创建一个文件，我们将其命名为 `horoscope_domain.yml`。\n\n以下是我们机器人的 `horoscope_domain.yml`\
  \ 文件内容：\n\n```\nslots:\n  horoscope_sign:\n    type: text\n  DD:\n    type: text\n\
  \  MM:\n    type: text\n  subscribe:\n    type: bool\n\nintents:\n  - greeting\n\
  \  - get_horoscope\n  - subscription\n  - dob_intent\n\nentities:\n  - horoscope_sign\n\
  \  - DD\n  - MM\n  - subscribe\n  - dob_intent\n\ntemplates:\n  utter_greet:\n \
  \   - '你好！今天过得怎么样？'\n  utter_ask_horoscope_sign:\n    - '你的星座是什么？'\n  utter_ask_dob:\n\
  \    - '你的出生日期是什么（DD-MM 格式）？'\n  utter_subscribe:\n    - '你想订阅每日更新吗？'\n\nactions:\n\
  \  - utter_greet\n  - utter_ask_horoscope_sign\n  - utter_ask_dob\n  - utter_subscribe\n\
  \  - get_todays_horoscope\n  - subscribe_user\n```\n\n如你所见，领域文件由五个重要部分组成：意图、实体、槽位、模板和动作，这些我们之前都讨论过。\n\
  \n请注意，每个模板都对应一个 `utterAction` 定义，例如 `utter_greet`，并且我们必须在模板部分定义一个同名的模板。\n\n正如在我们的示例中所见，主要定义了五个动作，其中前三个动作仅用于向用户说出模板文本，但最后两个动作需要我们要么从数据库检索数据，要么进行\
  \ API 调用来获取当天的星座运势并将其返回给用户。\n\n对于 `subscribe_user` 动作也是如此，我们需要执行一个操作，将当前用户添加到数据库的订阅列表中。这些用户定义的动作被称为自定义动作。要实现这样的自定义动作，我们需要编写当这些动作被触发时机器人应该执行的操作。\n\
  \n在下一节中，我们将学习如何编写自定义动作。\n\n\n编写聊天机器人的自定义动作  \n众所周知，每当触发一个 UtterAction 时，我们的机器人会根据该动作模板中定义的文本来回复。但当某个自定义动作被触发时会发生什么呢？在本节中，我们将编写\
  \ Python 代码来创建自定义动作，这些动作可用于调用 API 或执行任何 Python 能实现的操作。  \n\n让我们在项目目录（即本例中的`horoscope_bot`文件夹）中创建一个名为`actions.py`的新文件。\
  \  \n\n```python\nfrom __future__ import absolute_import\nfrom __future__ import\
  \ division\nfrom __future__ import print_function\nfrom __future__ import unicode_literals\n\
  \nimport requests\n\nfrom rasa_core_sdk import Action\nfrom rasa_core_sdk.events\
  \ import SlotSet\n\nclass GetTodaysHoroscope(Action):\n    def name(self):\n   \
  \     return \"get_todays_horoscope\"\n\n    def run(self, dispatcher, tracker,\
  \ domain):\n        # type: (Dispatcher, DialogueStateTracker, Domain) -> List[Event]\n\
  \        user_horoscope_sign = tracker.get_slot('horoscope_sign')\n        base_url\
  \ = \"http://horoscope-api.herokuapp.com/horoscope/{day}/{sign}\"\n        url =\
  \ base_url.format(**{'day': \"today\", 'sign': user_horoscope_sign})\n        #\
  \ http://horoscope-api.herokuapp.com/horoscope/today/capricorn\n        res = requests.get(url)\n\
  \        todays_horoscope = res.json()['horoscope']\n        response = \"Your today's\
  \ horoscope:\\n{}\".format(todays_horoscope)\n        dispatcher.utter_message(response)\n\
  \        return [SlotSet(\"horoscope_sign\", user_horoscope_sign)]\n```\n\n如我们所见，`GetTodaysHoroscope`动作中包含两个方法。第一个方法`name`仅返回动作的名称。另一个方法是`run`，如前所述，它通过执行我们编写的业务逻辑来实际完成任务。\
  \  \n\n在我们的方法中，我们使用了一个代码托管在 GitHub 上的开源 API。该 API 的 URL 格式如下：  \n\n`http://horoscope-api.herokuapp.com/horoscope/today/capricorn`\
  \  \n\n它以 JSON 格式返回数据：  \n\n```json\n{\n    \"date\": \"2018-08-29\",\n    \"horoscope\"\
  : \"You will be overpowered with nostalgia and may long to get in touch with old\
  \ pals. And as Ganesha says, chances are that you may take a liking to your ex-lover,\
  \ while simultaneously strengthening your social standing. All in all, the day will\
  \ be a productive one.\",\n    \"sunsign\": \"capricorn\"\n}\n```\n\n正如你在`run`方法中所见，我们将\
  \ API 的响应转换为 Python JSON 对象，然后从 JSON 中访问`'horoscope'`键以获取实际运势。获取到 JSON 中的运势后，我们构建响应，并使用`dispatcher`对象及其`utter_message`方法将其发送回用户。最后，我们使用`SlotSet`方法设置槽位。`SlotSet`类似于保存从用户响应中提取的变量，以便在对话流程中随时在代码中使用它们。\
  \  \n\n![](img/image-p5zdooqk.png)  \n\n**注意**：使用上述 API，只需提供星座标识即可获取今日运势。你可以自由使用自己的\
  \ API 或数据库，只需将 API 调用替换为你想要使用的其他数据源即可。  \n\n![](img/image-ddknj6ax.png)  \n\n就像我们在`actions.py`文件中添加了`GetTodaysHoroscope`动作一样，我们也将添加`SubscribeUser`动作。我们不打算使用数据库来存储用户的订阅偏好，但在为真实用户构建聊天机器人时，你可能需要用户\
  \ ID，以便在数据库中将其与订阅信息关联起来。  \n\n以下是`SubscribeUser`动作的代码：  \n\n```python\nclass SubscribeUser(Action):\n\
  \    def name(self):\n        return \"subscribe_user\"\n\n    def run(self, dispatcher,\
  \ tracker, domain):\n        # type: (Dispatcher, DialogueStateTracker, Domain)\
  \ -> List[Event]\n        subscribe = tracker.get_slot('subscribe')\n        if\
  \ subscribe == \"True\":\n            response = \"You're successfully subscribed\"\
  \n        if subscribe == \"False\":\n            response = \"You're successfully\
  \ unsubscribed\"\n        dispatcher.utter_message(response)\n        return [SlotSet(\"\
  subscribe\", subscribe)]\n```\n\n像这样，我们可以根据需要编写任意数量的自定义动作。  \n\n下一步是数据。Rasa 的对话管理模型是基于用户与聊天机器人之间的实际对话进行训练的。这里的关键点是，这些对话必须转换为故事格式。\
  \  \n\n故事本质上就是用户与聊天机器人之间的实际对话，其中用户输入被转换为意图和实体，而聊天机器人返回的响应则被视为机器人在需要时应触发的动作。  \n\n\
  下表给出了一个示例，展示了用户与聊天机器人之间的真实对话如何以故事形式呈现。  \n\n**场景一**  \n\n![](img/image-2p6f243l.png)\
  \  \n\n| 用户 | HoroscopeBot |\n|------|--------------|\n| hello there! | utter_greet\
  \ |\n| i want to know my horoscope for today | utter_ask_horoscope_sign |\n| My\
  \ sign is Capricorn | actions.gettodayshoroscope |\n| Can you subscribe me for updates?\
  \ | actions.subscribeuser |\n\n**场景二**  \n\n![](img/image-lse3cu7y.png)  \n\n| 用户\
  \ | HoroscopeBot |\n|------|--------------|\n| hello there! | utter_greet |\n| i\
  \ want to know my horoscope for today | utter_ask_horoscope_sign |\n| i don’t know\
  \ my sign | utter_ask_dob |\n| 12-12 | actions.gettodayshoroscope |\n\n我们尚未在代码中处理用户不知道星座但知道出生日期的场景。在这种情况下，我们的代码需要修改，以便在未找到`horoscope_sign`值时获取`DATE`和`MONTH`实体。\
  \  \n\n我们可以使用 DD-MM 值来检查星座，然后显式调用`GetTodaysHoroscope`方法，或者以这种方式训练模型。  \n\n**训练机器人的数据准备**\
  \  \n\n在进行任何机器学习之前，拥有高质量的数据始终很重要。训练聊天机器人也需要数据；用户与聊天机器人之间的对话就是我们训练模型所需的数据。有时，在网络上免费找到适合自己需求的数据集并不容易。\
  \  \n\n我们应该花必要的时间来收集数据。我们可以请朋友和家人提供样本对话文本，展示他们如何与你正在构建的这类机器人互动。有些人会为此创建示例应用程序并众包数据。因此，数据越好，模型越好，聊天机器人的响应也越好。\
  \  \n\n在数据准备方面，Rasa 不遗余力，并提供了一个名为**交互式学习**的酷炫功能。它可以帮助你轻松生成故事数据，并在我们不断添加故事数据的同时训练对话管理模型。你可以称之为实时机器学习训练。因此，随着我们不断添加故事数据，我们可以了解模型是否产生了正确的输出。最重要的是，当我们添加新故事时，我们可以看到模型是在改进还是退化。在大多数情况下，它会变得更好，因为我们实际上是在进行强化学习，告诉机器学习模型忘记并重新学习——这与人类的行为非常相似。\
  \  \n\n**创建故事数据**  \n\n正如我们所知，故事数据只是用户与聊天机器人之间对话的一种表示方式，展示了对话如何导向逻辑终点。通常，所有聊天机器人都旨在帮助用户完成一组预定义的任务；故事只是展示了这些任务是如何完成的。\
  \  \n\n我们将尝试以 Rasa 期望的格式准备一些简单的对话。这些对话将是**无状态的**——也就是说，它们不依赖于之前的对话。我们将使用手工制作的无状态故事进行交互式学习。\
  \  \n\n我们将花几分钟时间手工整理一些我们知道的故事，以便熟悉故事数据的创建方式。  \n\n首先，在我们的`data`文件夹中创建一个名为`stories.md`的文件。\
  \  \n\n\n\n## story_001   *  greeting   -  utter_greet   *  get_horoscope   -  utter_ask_horoscope_sign\
  \   *  get_horoscope{\"horoscope_sign\": \"Capricorn\"}   -  slot{\"horoscope_sign\"\
  : \"Aries\"}   -  get_todays_horoscope   -  utter_subscribe   ## story_002   * \
  \ greeting   -  utter_greet   *  get_horoscope{\"horoscope_sign\": \"Capricorn\"\
  }   -  slot{\"horoscope_sign\": \"Cancer\"}   -  get_todays_horoscope   -  utter_subscribe\
  \   *  subscription   -  slot{\"subscribe\": \"True\"}   -  subscribe_user   ##\
  \ 带星座查询的星座运势   *  greeting   -  utter_greet   *  get_horoscope   -  utter_ask_horoscope_sign\
  \   *  get_horoscope{\"horoscope_sign\": \"capricorn\"}   -  slot{\"horoscope_sign\"\
  : \"capricorn\"}   -  get_todays_horoscope   -  slot{\"horoscope_sign\": \"capricorn\"\
  }   -  utter_subscribe   *  subscription{\"subscribe\": \"True\"}   -  slot{\"subscribe\"\
  : \"True\"}   -  subscribe_user   -  slot{\"subscribe\": true}   ## 用户提供星座的情况  \
  \ *  greeting   -  utter_greet   *  get_horoscope{\"horoscope_sign\": \"leo\"} \
  \  -  slot{\"horoscope_sign\": \"leo\"}   -  get_todays_horoscope   -  slot{\"horoscope_sign\"\
  : \"leo\"}   -  utter_subscribe   *  subscription{\"subscribe\": \"True\"}   - \
  \ slot{\"subscribe\": \"True\"}   -  subscribe_user   -  slot{\"subscribe\": true}\
  \   ## 用户直接请求订阅   *  greeting   -  utter_greet   *  subscription{\"subscribe\":\
  \ \"True\"}   -  slot{\"subscribe\": \"True\"}   -  subscribe_user   -  slot{\"\
  subscribe\": true}   如果你盯着这些故事看几分钟，它们就会向你坦白它们的含义；理解发生了什么应该不难。前两个故事的主要区别在于，第一个故事中用户没有提及自己的星座，机器人需要询问星座，然后继续故事。在第二个故事中，用户自己说出了星座，然后以订阅对话结束故事。我们添加了更多故事来覆盖更多用例。欢迎你在同一个文件中添加自己的故事。\
  \  \n\n所以，基本上故事就是 markdown 文件，我们可以按照前面展示的 markdown 格式在其中编写任意数量的故事。手动完成这项工作似乎有点困难。因此，我们将尝试学习如何使用\
  \ Rasa 自己的交互式学习工具来生成更多类似的故事。  \n\n让我们开始吧。  \n\n交互式学习  \n\n到目前为止，我们一直在零散地讨论交互式学习，但现在是时候实际编写一些代码并付诸实践了。交互式学习是\
  \ Rasa 最酷的功能之一，它让机器学习部分变得既有趣又简单。它分为两部分：第一部分，我们通过使用各种策略提供初始数据集来训练模型；第二部分，我们以交互方式测试模型、纠正模型并重新训练模型。\
  \  \n\n训练聊天机器人代理模型  \n\n让我们在主项目目录中创建一个名为 `train_initialize.py` 的新文件。`train_initialize.py`\
  \ 的内容如下：  \n\n```python\nfrom __future__ import absolute_import\nfrom __future__\
  \ import division\nfrom __future__ import print_function\nfrom __future__ import\
  \ unicode_literals\n\nfrom rasa_core import utils\nfrom rasa_core.agent import Agent\n\
  from rasa_core.policies.keras_policy import KerasPolicy\nfrom rasa_core.policies.memoization\
  \ import MemoizationPolicy\nfrom rasa_core.policies.sklearn_policy import SklearnPolicy\n\
  \nif __name__ == '__main__':\n    utils.configure_colored_logging(loglevel=\"DEBUG\"\
  )\n    training_data_file = './data/stories.md'\n    model_path = './models/dialogue'\n\
  \    agent = Agent(\"horoscope_domain.yml\",\n                  policies=[MemoizationPolicy(),\
  \ KerasPolicy()])\n    training_data = agent.load_data(training_data_file)\n   \
  \ agent.train(\n        training_data,\n        augmentation_factor=50,\n      \
  \  epochs=500,\n        batch_size=10,\n        validation_split=0.2\n    )\n  \
  \  agent.persist(model_path)\n```\n\n这就是我们在 `train_initialize.py` 文件中编写的代码。现在，在我们进入下一个代码文件之前，让我们先尝试理解其中的要点。\
  \  \n\n首先，我们从 `future` 模块中导入了一些方法。Python 中的 `future` 语句有特殊用途，它们会改变 Python 模块的解析方式，并改变现有方法的行为。\
  \  \n\n好奇吗？在 Python 解释器中尝试以下代码：  \n\n```python\nfrom __future__ import braces\n\
  ```\n\n从 `rasa_core` 模块导入 `utils` 方法以配置日志记录。从 `agent` 模块导入 `agent` 类以创建代理对象。`KerasPolicy`、`MemorizationPolicy`\
  \ 将作为策略参数传递给 `agent` 类。  \n\n-   `configure_colored_logging`：`utils.py` 中定义的实用方法，用于使用\
  \ Python 的 `coloredlogs` 包进行彩色日志记录。  \n-   `Agent`：Rasa 定义的一个类，它提供了一个接口来使用最重要的 Rasa\
  \ Core 功能，例如训练、处理消息、加载对话模型、获取下一个动作以及处理渠道。  \n-   `load_data`：从给定路径加载训练数据。  \n- \
  \  `train`：使用提供的文件中的数据训练给定的策略/策略组合。  \n-   `training_data`：由 `load_data` 方法返回的对象。这其实就是我们的训练数据文件。\
  \  \n-   `augmentation_factor`：告诉 Rasa 在给定初始故事集的情况下应创建多少个虚拟故事。10 倍因子是训练数据生成器增强轮次的启发式方法。\
  \  \n-   `epochs`：1 个 epoch 是在整个训练数据集上完成的一个完整训练周期。即训练数据的前向和后向传递的总次数。  \n-   `batch_size`：告诉你在每次传递中使用的训练样本数量。100\
  \ 个样本，`batch_size` 为 10，需要 10 个 epoch 才能遍历整个数据集。  \n-   `validation_split`：用于验证模型无偏准确率的数据百分比。\
  \  \n-   `persist`：此方法用于将代理对象持久化到给定目录中以便重用。  \n\n此时，你应该非常清楚每个方法的作用以及代码内部发生了什么。 \
  \ \n\n在运行脚本之前，请确保在执行此脚本之前已安装 `rasa_core` 库。\n\n\n\n你可以使用以下命令安装 rasa_core：`pip install\
  \ rasa_core==0.11.1`。如果你正在学习本书中的聊天机器人示例，请确保只安装上述版本，因为 Rasa 可能不向后兼容。他们正在快速推出更新、更优化的方法。![](img/image-6akh0l3c.png)\
  \ 你也可以从 GitHub 仓库安装 rasa_core 的最新开发版。只需执行以下命令集，这些命令会在安装前直接从 GitHub 获取最新代码。\n\n```\n\
  git clone https://github.com/RasaHQ/rasa_core.git\ncd rasa_core\n```\n\n![](img/image-5lnb5yze.png)\n\
  \n```\npip install -r requirements.txt\npip install -e .\n```\n\n让我们尝试运行这个代码文件，根据给定的参数训练我们的模型。\n\
  \n```\n$python train_initialize.py\n```\n\n你也可以在 Jupyter Notebook 中直接使用 Jupyter\
  \ 的魔法命令来运行此脚本，如下所示：\n\n```\n!python train_initialize.py #如果你为 python3 安装了 rasa，请使用\
  \ python3\n```\n\n在像我们这样的小数据集上训练模型大约需要 25 到 30 秒。我在策略列表中除了 `MemorizationPolicy`\
  \ 和 `KerasPolicy` 之外，还添加了 `SklearnPolicy` 来训练我的模型。不同的策略各有其优势。请阅读更多相关内容，了解哪种策略更适合你的用例；对于我的数据集，`SklearnPolicy`\
  \ 有时似乎比 `KerasPolicy` 表现更好。\n\n脚本执行完毕后，你应该会看到一些类似这样的成功消息：\n\n```\n2018-08-30 04:24:31\
  \ Done fitting keras policy model\n2018-08-30 04:24:31 Creating states and action\
  \ examples from collected trackers (by MaxHistoryTrackerFeaturizer)... Processed\
  \ trackers: 96/96 [00:00<00:00, 898.31it/s, # actions=75]\n2018-08-30 04:24:31 Created\
  \ 75 action examples.\n2018-08-30 04:24:31 Done fitting sklearn policy model\n2018-08-30\
  \ 04:24:31 Model directory models/nlu exists and contains old model files. All files\
  \ will be overwritten.\n2018-08-30 04:24:31 Persisted model to '/Users/sumit/apress_all/Chapter\
  \ IV/horoscope_bot/models/nlu'\n```\n\n你还会发现根据模型名称创建了几个文件夹。请确保它们位于你在脚本中指定的 `model_path`\
  \ 中。以下是我在 `model_path` 文件夹中看到的文件夹/文件：\n\n```\npolicy_0_MemoizationPolicy\npolicy_1_KerasPolicy\n\
  policy_2_SklearnPolicy\ndomain.json\ndomain.yml\nPolicy_metadata.json\n```\n\n如果你已验证模型已成功完成执行并持久化到本地系统中，那么我们就可以进入下一步的交互式训练了。\n\
  \n### 通过强化学习进行实时训练\n\n在本节中，我们将编写更多代码来训练我们的对话模型，并在模型输出不正确时重新训练它。\n\n因此，当我们的机器人做错事时，我们会立即介入，通过告诉它正确的答案来让模型知道它的预测是错误的。\n\
  \n无需停止，模型会自行重新训练，一旦我们完成，用户与机器人之间的交互会被捕获到一个文件中，并添加到我们现有的训练数据中。它更像是在每一步都进行反馈，而不是在最后等待单一的奖励。\n\
  \n下一步是创建一个名为 `endpoints.yml` 的新文件，内容如下。\n\n我们将在 Python 代码文件 `train_online.py` 中使用这个文件。通过此配置，我们可以将\
  \ Rasa 方法暴露为 HTTP API。\n\n```yaml\naction_endpoint:\n  url: http://localhost:5055/webhook\n\
  \  #nlg:\n  #  url: http://localhost:5056/nlg\ncore_endpoint:\n  url: http://localhost:5005\n\
  ```\n\n现在，让我们为在线/交互式训练创建 `train_online.py`。\n\n```python\nfrom __future__ import\
  \ absolute_import\nfrom __future__ import division\nfrom __future__ import print_function\n\
  from __future__ import unicode_literals\nimport logging\n\nfrom rasa_core import\
  \ utils, train\nfrom rasa_core.training import online\nfrom rasa_core.interpreter\
  \ import NaturalLanguageInterpreter\n\nlogger = logging.getLogger(__name__)\n\n\
  def train_agent(interpreter):\n    return train.train_dialog_model(domain_file=\"\
  horoscope_domain.yml\",\n                                    stories_file=\"data/stories.md\"\
  ,\n                                    output_path=\"models/dialog\",\n        \
  \                            nlu_model_path=interpreter,\n                     \
  \               endpoints=\"endpoints.yml\",\n                                 \
  \   max_history=2,\n                                    kwargs={\"batch_size\":\
  \ 50,\n                                            \"epochs\": 200,\n          \
  \                                  \"max_training_samples\": 300\n             \
  \                               })\n\nif __name__ == '__main__':\n    utils.configure_colored_logging(loglevel=\"\
  DEBUG\")\n    nlu_model_path = \"./models/nlu/default/horoscopebot\"\n    interpreter\
  \ = NaturalLanguageInterpreter.create(nlu_model_path)\n    agent = train_agent(interpreter)\n\
  \    online.serve_agent(agent)\n```\n\n`max_history` 是模型要跟踪的状态数量。\n\n在我们继续运行最终脚本之前，我们应该了解并准备好一个叫做\
  \ `rasa-nlu-sdk` 的东西。\n\n### rasa-nlu-sdk\n\nRasa NLU 栈附带 `rasa-nlu-sdk`，这是一个用于开发\
  \ Rasa Core 自定义动作的 Python SDK。对于我们的聊天机器人示例，我们需要定义一些自定义动作，比如调用 API 获取今日星座运势，或者执行数据库写入操作以将用户添加到订阅列表。\n\
  \n好消息是他们有一个单独的库，我们可以使用 pip 安装它。让我们使用以下命令安装它：\n\n```\npip install rasa-core-sdk==0.11.0\n\
  ```\n\n现在，我们需要打开终端的另一个标签页或一个新的命令行，并在我们的项目目录（即 `actions.py` 文件所在的位置）中执行以下命令：\n\n\
  ```\npython -m rasa_core_sdk.endpoint --actions actions\n```\n\n```\nINFO:__main__\
  \ :Starting action endpoint server...\nINFO:rasa_core_sdk.executor:Registered function\
  \ for 'get_todays_horoscope'.\nINFO:rasa_core_sdk.executor:Registered function for\
  \ 'subscribe_user'.\nINFO:__main__  :Action endpoint is up and running. on ('0.0.0.0',\
  \ 5055)\n```\n\n此命令将启动一个动作服务器，该服务器将监听模型预测的任何自定义动作。\n\n\n\n一旦触发任何动作，它就会执行该动作并根据方法给出响应。动作服务器端点的默认端口是\
  \ localhost 上的 5055。如果你想更改它，可以在命令行中添加 `--port` 参数。\n\n一个快速的问题浮现在脑海中：为什么？为什么我需要一个单独的服务器来处理这个？为什么我们不能直接使用纯\
  \ Python？是的，我们可以使用纯 Python，但假设你要用其他语言开发所需的动作，或者你已经有一些以 API 形式暴露的动作。现在，你只需要进入我们已经创建好的\
  \ `endpoints.yml` 文件，用它来指定你的动作服务器应该从哪里使用，以及你的 `core_endpoint` 服务器应该在哪里。在生产系统中，这两个服务器可以是拥有完全不同\
  \ URL 的不同服务器。\n\n现在，当我们运行下一个脚本（其中引用了我们的 `endpoints.yml` 文件）时，Rasa 将读取该文件并获取我们 `action_server`\
  \ 的配置，该服务器已经根据我们之前的配置启动并运行。\n\n```\naction_endpoint:\n  url: http://localhost:5055/webhook\n\
  ```\n\n让我们在一个新的命令行终端中运行 `train_online.py`。\n\n```\n$python3 train_online.py\n```\n\
  \n在对话模型成功训练后，我们会收到类似这样的消息：\n\n```\n2018-08-30 07:09:37 Done fitting keras policy\
  \ model\n2018-08-30 07:09:37 Model directory models/nlu exists and contains old\
  \ model files. All files will be overwritten.\n2018-08-30 07:09:37 Persisted model\
  \ to '/Users/ sumit/apress_all/Chapter IV/horoscope_bot/models/nlu'\n2018-08-30\
  \ 07:09:37 Rasa Core server is up and running on http://localhost:5005\nBot loaded.\
  \ Type a message and press enter (use '/stop' to exit).\n127.0.0.1 - - [2018-08-30\
  \ 07:09:37] \"GET /domain HTTP/1.1\" 200 996 0.001847\n```\n\n现在，你可以开始与刚刚诞生的机器人对话了。从此刻起，如何训练它完全掌握在你手中。每当它回应错误或意外内容时，你都可以纠正它。\n\
