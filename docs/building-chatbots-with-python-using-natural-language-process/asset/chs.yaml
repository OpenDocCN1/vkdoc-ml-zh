  \n瞧！我们第一个内部构建的聊天机器人应用已部署到网络上，并可通过 Facebook Messenger 平台访问。所以，快去与你的家人、朋友、同事以及全世界分享吧。\
  \  \n\n在 Slack 上部署聊天机器人  \n\n在本节中，我们将把聊天机器人部署到 Slack。Slack 是一款团队协作工具，在开发者和企业中广受欢迎。如果你不热衷于社交媒体，那么你可能需要借助\
  \ Slack 通过界面与你的聊天机器人对话。那么，让我们开始构建第一个内部 Slack 聊天机器人吧。  \n\n为了将我们的星座聊天机器人部署到 Slack，我们将像处理\
  \ Facebook 时那样编写一个独立脚本。  \n\n为 Slack 聊天机器人创建独立脚本  \n\n在你的项目目录中创建一个名为 `slack.py`\
  \ 的新文件。文件内容为 `slack.`\n\n\n\npy 的代码将如下所示：  \n```python\nfrom rasa_core.channels.slack\
  \ import SlackInput\nfrom rasa_core.agent import Agent\nfrom rasa_core.interpreter\
  \ import RasaNLUInterpreter\nimport os\nfrom rasa_core.utils import EndpointConfig\n\
  \n# 加载你训练好的智能体\ninterpreter = RasaNLUInterpreter(\"models/nlu/default/horoscopebot/\"\
  )\nMODEL_PATH = \"models/dialogue\"\n\naction_endpoint = EndpointConfig(url=\"https://horoscopebot1212-actions.herokuapp.com/webhook\"\
  )\n\nagent = Agent.load(MODEL_PATH, interpreter=interpreter, action_endpoint=action_endpoint)\n\
  \ninput_channel = SlackInput(\n    slack_token=\"YOUR_SLACK_TOKEN\",\n    # 这是 `bot_user_o_auth_access_token`\n\
  \    slack_channel=\"YOUR_SLACK_CHANNEL\"\n    # 机器人发布消息的频道名称（可选）\n)\n\n# 如果希望保持服务器运行，请设置\
  \ serve_forever=False\ns = agent.handle_channels([input_channel], int(os.environ.get('PORT',\
  \ 5004)), serve_forever=True)\n```\n`facebook.py` 和 `slack.py` 的主要区别在于我们创建的 `input_channel`\
  \ 对象。Rasa 提供了多种内置渠道，如 Facebook、Slack、Mattermost、Telegram、Twilio、RocketChat 和 Microsoft\
  \ Bot Framework，我们可以直接使用它们轻松地将同一个机器人部署到不同渠道。\n\n如你所见，我们需要在脚本中添加 `slack_token` 和\
  \ `slack_channel`。就像我们之前在 Facebook 开发者平台上创建 Facebook 应用一样，我们同样需要在 Slack 上创建一个应用。\n\
  \n让我们逐步操作：\n\n访问此网址 https://api.slack.com/slack-apps，然后点击“Create App”按钮。请参考图 5-13。\n\
  \n![](img/image-xffek5ca.png)  \n––––––––  \n图 5-13. 在 Slack 中创建应用\n\n下一步是创建一个机器人用户。要创建机器人用户，请在“Add\
  \ features and functionality”下点击“Bots”。在新页面中，你将看到“Add a Bot User”选项。查看图 5-14，了解如何添加详细信息并创建机器人用户。\n\
  \n![](img/image-pxpymnpf.png)  \n图 5-14. 在 Slack 中为你的机器人命名\n\n根据你正在构建的聊天机器人填写详细信息。显示名称可以是你喜欢的任何名称；默认用户名必须唯一，你可以保持原样。将最后一个选项切换为“始终将我的机器人显示为在线”，是为了让机器人始终以用户身份显示为可用状态。这正是聊天机器人的意义所在——人类无法\
  \ 24/7 在线，但聊天机器人可以，因此我们开启此功能。确保点击“保存更改”。返回“Basic Information”选项卡。点击“Install your\
  \ app to your workspace”。应用将要求确认身份。请像授权其他应用一样进行授权。查看图 5-15，了解授权界面的样式。\n\n![](img/image-9kwu09sz.png)\
  \  \n图 5-15. 授权你的 Slack 应用\n\n你会在“Add features and functionality”下看到“Bots”和“Permissions”选项卡旁边带有绿色对勾，这意味着我们的机器人和应用已良好集成。这表明我们到目前为止进展顺利。\n\
  \n转到你的“OAuth & Permissions”部分，复制“Bot User OAuth Access Token”。将复制的令牌粘贴到我们的 Python\
  \ 脚本中。按你喜欢的方式指定频道名称。如果你希望机器人向某个频道发布消息，则可以指定频道名称。我指定了 `@slackbot`。如果你不设置 `slack_channel`\
  \ 关键字参数，消息将直接回复给发送者。\n\n**编辑你的 Procfile**\n\n在这一步中，我们不会创建新的 Procfile，因为我们使用的是相同的代码库。我们将修改现有的\
  \ Procfile 为以下内容，使其适用于我们的 Slack 机器人。因此，我们只需将脚本文件名从 `facebook.py` 改为 `slack.py`，以便\
  \ Heroku 使用该文件启动应用。\n\n```\nweb: python -m spacy download en && python slack.py\n\
  ```\n\n**最终将 Slack 机器人部署到 Heroku**\n\n为了最终将我们的新 Slack 机器人部署到 Heroku，我们将从命令行运行一组类似的\
  \ Heroku 命令来部署我们的应用。\n\n```\n$ git init\n$ heroku git:remote -a <your-heroku-app-name>\n\
  $ git add .\n$ git commit -am \"deploy my bot\"\n$ git push heroku master\n```\n\
  \n**订阅 Slack 事件**\n\n现在，点击选项卡，通过切换屏幕上的按钮来激活事件订阅功能。输入用于 Slack 的 Heroku 应用 webhook\
  \ URL。\n\n如果你的应用已使用修改后的 Procfile 正确部署到 Heroku，那么你的 Slack webhook URL 将是 `app_url\
  \ + /webhooks/slack/webhook`，如下所示：\n\n```\nhttps://horoscopebot1212.herokuapp.com/webhooks/slack/webhook\n\
  ```\n\n在 Slack 向上述 URL 发送一个包含 `challenge` 参数的 HTTP POST 请求后，你将看到一个已验证的对勾标记，并且我们的端点必须使用该\
  \ `challenge` 值进行响应。这类似于我们在构建 Facebook 聊天机器人的密钥时讨论的内容。查看图 5-16 以了解更多信息。\n\n![](img/image-qfsuuebc.png)\
  \  \n图 5-16. 为你的机器人激活事件订阅\n\n**订阅机器人事件**\n\n在这一步中，我们只需向下滚动事件订阅页面，进入“Subscribe to\
  \ Bot Events”部分，然后点击“Add Bot User Event”。参考图 5-17 了解导航位置。\n\n![](img/image-uicpdf46.png)\
  \  \n图 5-17. 订阅机器人事件\n\n订阅机器人事件实际上就是声明机器人需要响应的事件。我们这里只演示两种场景：第一，当有人提及机器人的名字时（即 `@bot_name`）；第二，当有人直接向机器人发送消息时（即\
  \ `message.im`）。\n\n现在，点击“保存更改”，你就完成了。是时候像上一节测试 Facebook 聊天机器人那样，测试我们的 Slack 聊天机器人了。\n\
  \n**部署后验证：Slack 机器人**\n\n让我们回到用于创建应用的工作区，在左侧的“Apps”下找到你的机器人。尝试与它对话，看看它是否正常工作。我的机器人表现相当不错，能为我提供今天的星座运势，读起来很有趣。如果你还没能走到这一步，请查看图\
  \ 5-18，了解我的 Slack 机器人是如何响应的。\n\n![](img/image-uicpdf46.png)  \n图 5-18. Slack 机器人的响应示例\n\
  \n\n\n[](image-6l69pxto.png) 图 5-18. 测试 Slack 聊天机器人\n\n好了，各位，我们的 Slack 机器人就完成了。在下一节中，我们将把机器人部署到我们自己的用户界面上。构建自己的用户界面可能需要一些前端技能，但别担心——我们对此已有计划。\n\
  \n## 将聊天机器人部署到自有平台\n\n这个标题听起来很酷，对吧？到目前为止，我们一直在使用 Facebook 或 Slack 将聊天机器人部署到网络上，或者我们也可以使用\
  \ Telegram 等平台，但现在，是时候将一切部署到我们自己的平台上了——我们自己的服务器、我们自己的数据，以及使用我们自己的用户界面配置的模型。\n\n\
  如果你是一个组织或初出茅庐的企业家，你可能在 Facebook、Twitter 或 Slack 上有了机器人的想法，但你总是希望它也能在你自己的网站上运行，这样随着用户群的增加，你的品牌价值也会越来越高。\n\
  \n在本节中，我们将利用到目前为止的所有努力，最终构建一个功能完备且独立于任何第三方 API 调用或工具（如 Dialogflow、wit.ai、Watson\
  \ 等）的聊天机器人。你将拥有完全的控制权，可以随心所欲地调整你的聊天机器人，最重要的是，可以轻松地将其扩展到数百万用户。\n\n那么，让我们开始吧。\n\n\
  第一步是确保我们在前面章节中部署的两个应用程序正在运行。你已经知道如何进行基本的健康检查。你始终需要运行你的对话管理器应用和动作应用，以便在任何平台上使用你的聊天机器人模型。\n\
  \n现在，在我们之前创建 `facebook.py` 和 `slack.py` 的同一个项目目录中，我们将创建一个名为 `myown_chatbot.py` 的新文件。之前创建的脚本，如\
  \ `facebook.py` 和 `slack.py`，是我们创建的独立脚本，这样我们就可以在命令中告诉 Heroku 运行哪个脚本来启动应用程序。现在，我们正在创建自己的脚本，该脚本将通过\
  \ REST API 暴露用户与聊天机器人之间的请求/响应。\n\n部署你自己的聊天机器人分为两部分。第一部分，我们将编写一个脚本来创建自定义频道，并将其部署为\
  \ REST API。第二部分，我们需要自己的用户界面，因为到目前为止，我们一直在使用 Facebook 和 Slack 的聊天界面进行对话。\n\n## 为你的自有聊天机器人频道编写脚本\n\
  \n这个脚本与我们迄今为止学习和编写的脚本类似，但它需要我们覆盖 `rasa_core` 的一些现有方法，以便我们可以定义自己的 API 认证规则。在下面的代码中，我对令牌验证进行了基本的字符串检查。这不建议用于生产级系统，因此，如果你正在为大型系统构建聊天机器人，请务必谨慎编写该部分。\n\
  \n创建一个名为 `myown_chatbot.py` 的新文件，并向其中添加以下内容：\n\n```python\nimport os\n\nfrom rasa_core.channels.rasa_chat\
  \ import RasaChatInput\nfrom rasa_core.agent import Agent\n\nfrom rasa_core.interpreter\
  \ import RasaNLUInterpreter\nfrom rasa_core.utils import EndpointConfig\n\n# 加载你训练好的智能体\n\
  \ninterpreter = RasaNLUInterpreter(\"models/nlu/default/horoscopebot/\")\nMODEL_PATH\
  \ = \"models/dialogue\"\n\naction_endpoint = EndpointConfig(url=\"https://horoscopebot1212-actions.herokuapp.com/webhook\"\
  )\nagent = Agent.load(MODEL_PATH, interpreter=interpreter, action_endpoint=action_endpoint)\n\
  \nclass MyNewInput(RasaChatInput):\n    def _check_token(self, token):\n       \
  \ if token == 'mysecret':\n            return {'username': 'admin'}\n        logger.info(\"\
  Failed to check token: {}.\".format(token))\n        return None\n\ninput_channel\
  \ = MyNewInput(url='https://horoscopebot1212.herokuapp.com')\n# 如果希望保持服务器运行，请设置\
  \ serve_forever=False\ns = agent.handle_channels([input_channel], int(os.environ.get('PORT',\
  \ 5004)), serve_forever=True)\n```\n\n这里需要注意几点：\n\n*   `rasa_core` 中的 `_check_token`\
  \ 方法基本上如下所示，它会发起一个 API 调用来获取用户对象。这主要完成用户级认证/鉴权的工作。在我们重写的方法中，我们保持简单，以便使其工作并理解其用法。\n\
  \n    ```python\n    def _check_token(self, token):\n        url = \"{}/users/me\"\
  .format(self.base_url)\n        headers = {\"Authorization\": token}\n        logger.debug(\"\
  Requesting user information from auth server {}.\".format(url))\n        result\
  \ = requests.get(url, headers=headers, timeout=DEFAULT_REQUEST_TIMEOUT)\n      \
  \  if result.status_code == 200:\n            return result.json()\n        logger.info(\"\
  Failed to check token: {}. Content: {}\".format(token, request.data))\n        return\
  \ None\n    ```\n\n*   使用 Rasa 自己的 `_check_token` 方法可能需要你编写一个 API 或 Web 服务，该服务接受请求并以指定方式返回响应。\n\
  *   确保将动作的服务器端点更改为你自己的 URL。\n*   记住，代码中的 `mysecret` 字符串稍后将用于发起 API 调用。\n\n## 编写\
  \ Procfile 并部署到 Web\n\n到现在为止，你一定已经非常熟悉为 Heroku 部署创建 Procfile 了。我们将再次使用现有的 Procfile\
  \ 并进行修改，以将基于 API 的聊天机器人部署到 Web。在备份现有文件后，可以随意创建一个新的 Procfile。\n\n以下是我的 Procfile 内容：\n\
  \n```\nweb: python -m spacy download en && python myown_chatbot.py\n```\n\n完成后，只需执行我们在部署\
  \ Facebook Messenger 和 Slack 机器人时已经学会的下一组命令。\n\n```bash\n$ git init\n$ heroku git:remote\
  \ -a <your-heroku-app-name>\n$ git add .\n$ git commit -am \"deploy my bot\"\n$\
  \ git push heroku master\n```\n\n执行完最后一条命令后，你将收到来自 Heroku 的一些日志，内容涉及部署版本、对应用所做的更改等。\n\
  \n## 验证你的聊天机器人 API\n\n在收到部署成功的消息后，让我们测试一下我们的聊天机器人 API 是否正常工作。为了快速进行健康检查，请访问以下 URL：\n\
  \n`<your-basic-app-url>/webhooks/rasa/`\n\n例如：`https://horoscopebot1212.herokuapp.com/webhooks/rasa/`\n\
  \n\n\n在浏览器中打开 `com/webhooks/rasa/` 这个网址，应该会得到类似如下的响应。如果返回的状态是“ok”，那么一切就绪——放松、坐好，开始调试吧。\
  \  \n`{\"status\":\"ok\"}`  \n\n有时仅凭这种验证可能还不够，所以让我们通过实际测试来检查聊天机器人是否能正确识别意图并据此给出响应。\
  \  \n\n我将使用 POSTMAN 工具（POSTMAN 是一款非常优秀的基于 GUI 的 API 测试工具）。你也可以使用任何自己熟悉的工具。我们只需测试聊天机器人应该理解和响应的其中一个意图。我测试了问候意图，效果非常好。机器人返回了预期的响应，如图\
  \ 5-19 所示。  \n\n![](img/image-93k59juh.png)  \n\n图 5-19. 在 POSTMAN 中测试聊天机器人 API\
  \  \n\n### 创建聊天机器人 UI  \n\n正如我们在第二步中讨论的，我们需要拥有自己的 UI，为聊天机器人和用户之间的对话提供一个友好的界面。如果你是前端开发人员，或者团队中有前端开发人员，你可以轻松地将我们目前构建的聊天机器人\
  \ API 交给他们，前端团队应该能够轻松地将其集成到他们的聊天机器人 UI 中。他们可以使用常规的 HTTP 调用来消费这些 API。WebSocket 是实现聊天机器人的更好方式，但这不在本书的讨论范围内。\
  \  \n\n如果你不熟悉 HTML/CSS/JavaScript 等前端技术，那么我推荐阅读《Pro HTML5 with CSS, JavaScript,\
  \ and Multimedia》（Apress, 2017）。  \n\n为了方便我们的读者——或者更准确地说，学习者——我们创建了一个聊天机器人和用户对话所需的基本\
  \ UI。你可以在 GitHub 或 Apress 网站上找到完整的可运行代码。我只会告诉你需要如何配置才能让它为你的机器人工作。  \n\n下载本章的代码后，你会在主文件夹内找到一个名为\
  \ `Go to this folder` 的文件夹，然后进入 `assets -> js -> script.js` 文件。  \n\n将下面这行 JavaScript\
  \ 代码中的 URL 替换为你自己的端点 URL。如果你的应用名称不同，那么下面的 URL 也会有所不同。请使用你自己的 URL，并在 JavaScript 代码中包含令牌，如下面的\
  \ URL 所示：  \n\n```javascript\nvar baseUrl = \"https://horoscopebot1212.herokuapp.com/webhooks/rasa/webhook?token=YOUR-SECRET\"\
  ;\n```\n\n保存文件，然后在浏览器中打开 `index.html` 文件，你应该能立即看到一个可用的聊天机器人 UI。但是，从本地提供的简单 HTML\
  \ 页面发起 API 调用会引发 CORS 问题。因此，为了避免这种情况，我们将对现有的 `myown_chatbot.py` 进行一些修改，使其能够直接从我们的\
  \ Heroku 应用提供 HTML 服务。  \n\n将你的 `myown_chatbot.py` 修改为以下内容，然后我们将讨论所做的更改：  \n\n```python\n\
  import os\n\nfrom rasa_core.channels.rasa_chat import RasaChatInput\n\nfrom rasa_core.channels.channel\
  \ import CollectingOutputChannel, UserMessage\nfrom rasa_core.agent import Agent\n\
  \nfrom rasa_core.interpreter import RasaNLUInterpreter\nfrom rasa_core.utils import\
  \ EndpointConfig\n\nfrom rasa_core import utils\nfrom flask import render_template,\
  \ Blueprint, jsonify, request\n\n# 加载你训练好的智能体\ninterpreter = RasaNLUInterpreter(\"\
  models/nlu/default/horoscopebot/\")\nMODEL_PATH = \"models/dialogue\"\n\naction_endpoint\
  \ = EndpointConfig(url=\"https://horoscopebot1212-actions.herokuapp.com/webhook\"\
  )\n\nagent = Agent.load(MODEL_PATH, interpreter=interpreter, action_endpoint=action_endpoint)\n\
  \nclass MyNewInput(RasaChatInput):\n    @classmethod\n    def name(cls):\n     \
  \   return \"rasa\"\n\n    def _check_token(self, token):\n        if token == 'secret':\n\
  \            return {'username': 1234}\n        else:\n            print(\"Failed\
  \ to check token: {}.\".format(token))\n            return None\n\n    def blueprint(self,\
  \ on_new_message):\n        templates_folder = os.path.join(os.path.dirname(os.path.abspath(__file__)),\
  \ 'myown_chatbot')\n        custom_webhook = Blueprint('custom_webhook', __name__,\
  \ template_folder=templates_folder)\n\n        @custom_webhook.route(\"/\", methods=['GET'])\n\
  \        def health():\n            return jsonify({\"status\": \"ok\"})\n\n   \
  \     @custom_webhook.route(\"/chat\", methods=['GET'])\n        def chat():\n \
  \           return render_template('index.html')\n\n        @custom_webhook.route(\"\
  /webhook\", methods=['POST'])\n        def receive():\n            sender_id = self._extract_sender(request)\n\
  \            text = self._extract_message(request)\n            should_use_stream\
  \ = utils.bool_arg(\"stream\", default=False)\n            if should_use_stream:\n\
  \                return Response(\n                    self.stream_response(on_new_message,\
  \ text, sender_id),\n                    content_type='text/event-stream')\n   \
  \         else:\n                collector = CollectingOutputChannel()\n       \
  \         on_new_message(UserMessage(text, collector, sender_id))\n            \
  \    return jsonify(collector.messages)\n\n        return custom_webhook\n\ninput_channel\
  \ = MyNewInput(url='https://horoscopebot1212.herokuapp.com')\n# 如果你希望保持服务器运行，请设置\
  \ serve_forever=False\ns = agent.handle_channels([input_channel], int(os.environ.get('PORT',\
  \ 5004)), serve_forever=True)\n```\n\n以下是我们所做的更改：  \n\n-   在我们的类中重写了现有的 `name` 和\
  \ `blueprint` 方法，这让我们能够创建自己的端点，并自由定义其行为。  \n-   我们创建了一个新的端点 `/chat`，并提供了 `index.html`\
  \ 文件，该文件正是聊天机器人的 UI。因此，这将成为我们聊天机器人的主页链接。  \n-   我们导入了一些必要的类和方法，例如 `utils` 和 `UserMessage`，以确保一切正常运行。\
  \  \n\n保存文件，然后使用以下命令将更改再次部署到我们的 Heroku 应用：  \n\n```bash\n$ git add .\n$ git commit\
  \ -am \"deploy my bot\"\n$ git push heroku master\n```\n\n部署成功后——瞧！我们的机器人已经准备好与全世界分享了。它通过两个\
  \ Heroku 应用协同工作：一个用于对话管理，另一个用于执行动作。  \n\n在浏览器中打开以下 URL，我们应该能看到自定义的聊天机器人 UI：  \n\n\
  `https://horoscopebot1212.herokuapp.com/webhooks/rasa/chat`  \n\n图 5-20.1 和 5-20.2\
  \ 展示了我的聊天机器人在对话过程中的样子。  \n\n![](img/image-foi29c75.png)  \n\n图 5-20.1.  \n\n\n\n\
  在你的网站上拥有你自己的定制聊天机器人 ![](img/image-iwsheqsj.png) 图 5-20.2. 在你的网站上拥有你自己的定制聊天机器人  \
  \ 利用 Heroku 的自定义域名功能，你可以轻松地将同一个应用指向你自己的网站名称，比如当你觉得你的聊天机器人已经足够好，可以面向全世界用于盈利或非盈利目的时，就可以这样做。\
  \   那么，各位朋友，这就是全部内容了！这就是如何使用 Python 结合自然语言处理和机器学习来构建聊天机器人的方法。我希望本章以及前面的章节对你有所帮助，并且你能够学到构建聊天机器人的实用方法。总结\
  \   在本章中，我们学习了如何使用 Heroku 将我们自己的应用部署到我们自己的服务器上。我们学习了如何使用 Facebook 的开发者平台将我们的聊天机器人与\
  \ Facebook 集成。我们还学习了为 Slack 应用创建一个自定义聊天机器人，并对其进行了测试。最后，正如在第三章末尾所承诺的，我们摆脱了对任何社交媒体平台的依赖，创建了我们自己的用户界面，并将其部署在\
  \ Heroku 上并进行了测试。我们看到它运行得非常好——在训练它的时候它就能正常工作。既然我们已经有了一个基本模型并使其运行起来，现在你可以处理聊天机器人工作不佳的情况了。确定问题是与数据或训练有关，还是与动作服务器或自定义代码处理有关。一旦找到根本原因，修复它，重新部署，然后检查聊天机器人是否有所改进。我们通过从小处着手来构建大型软件。\
  \   我期待收到你的来信，并且很好奇你在读完这本书后构建了什么样的聊天机器人。如果你在任何概念、代码执行或部署上遇到困难，我将随时乐意帮助你。   感谢与致敬。索引\
