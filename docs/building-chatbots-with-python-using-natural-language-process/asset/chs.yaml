  \n## 测试机器人\n\n测试机器人是我们交互式学习过程的一部分。我们会不断检查最初为机器人设想的所有可能场景，并据此进行训练。我测试了**星座运势机器人**的其他一些场景，并进行了相应训练。以下是其中一个场景，与我们本章前面所做的略有不同。\n\
  \n### 测试用例 1\n\n让我们运行第一个测试：\n\n**用户**：你好！  \n**HoroscopeBot**：你好！有什么可以帮你的吗？  \n\
  **用户**：今天摩羯座的运势如何？  \n**HoroscopeBot**：你今天的星座运势：  \n\n> 从失败到成功的旅程是由乐观驱动的。今天你会非常乐观——关于你的工作、未来以及一切能引领你走向成功的事情，Ganesha\
  \ 说。在处理日常工作时，你也会非常细心，并会抓住每一个能让你离目标更近一步的机会。实现梦想所需的只是决心和好运；今天你两者都将拥有。\n\n**HoroscopeBot**：你想订阅每日更新吗？\
  \  \n**用户**：请帮我订阅。  \n**HoroscopeBot**：您已成功订阅。\n\n正如你在用户和聊天机器人之间的这段对话中所看到的，我们测试了机器人是否能够处理用户自己在询问当日运势时提供星座名称的场景。在这种情况下，机器人处理得很好，最终会询问是否订阅，并根据用户的回复采取相应行动。\n\
  \n你应该对机器人的对话进行健全性测试，以确定正常流程是否正常工作。\n\n我还测试了 `stories.md` 文件中提到的故事——当用户直接要求订阅时——它也运行良好。\n\
  \n### 测试用例 2\n\n现在进行第二个测试：\n\n**用户**：嗨  \n**HoroscopeBot**：你好！有什么可以帮你的吗？  \n**用户**：请帮我订阅每日更新。\
  \  \n**HoroscopeBot**：您已成功订阅。\n\n我还会添加一些新的故事，以便机器人能够完美运行。\n\n但到目前为止，我们已经有了一个功能完整的机器人。在\
  \ GitHub 上的第二个版本代码中，你还会发现机器人能够纠正星座名称的拼写错误、根据用户的出生日期获取星座、发送告别消息等功能。我强烈建议你查看代码的实现方式并提供反馈。但在那之前，先思考一下如何实现以及改动会放在哪里。我们有意没有在本章中提及其他用例的代码，以免在你专注于学习行业技巧时感到混乱。\n\
  \n你可以从我们的 GitHub 仓库下载最新的 Python 代码和 Jupyter Notebook，并尝试安装正确的包来运行它。你会发现代码中处理了更多本章讨论的用例。\n\
  \n## 总结\n\n在本章中，我们学习了 Rasa-NLU，以及为什么 Rasa-NLU 比市场上任何其他开源工具更好。我们学习了如何通过在我们的管道配置中使用\
  \ tensorflow、sklearn 和 keras 来配置管道。\n\n我们学习了如何在本地系统上从头开始创建一切，而不依赖于任何需要使用其 API 的服务（如\
  \ Dialogflow、wit.ai 等）。我们还学习了如何创建故事，如何训练 NLU 模型和对话模型，并使用 Rasa Core 将它们结合起来，通过最酷的功能——交互式学习——来训练构建机器人。我们还大致了解了如何借助\
  \ rasa-nlu-trainer 等开源工具轻松创建和标注训练数据。我希望这一章对你来说比其他任何章节都更具互动性。如果你还没有成就感，那么请准备好迎接下一章，我们将真正把它带给我们的观众，并向世界展示机器人的能力。我们将学习如何将本章的聊天机器人集成到\
  \ Facebook 和 Slack 等不同平台，使用我们自己的 Web 服务器。\n\n继续训练你的机器人，直到下一章我们将其上线。下一章见。\n\n## 第五章\
  \  \n––––––––  \n部署你的聊天机器人  \n\n在本章中，我们将学习如何将我们的聊天机器人部署到网络上。有多种方式和渠道可以将聊天机器人 Web\
  \ 应用部署或暴露给外部世界。例如，我们可以将带有 NLU 和对话模型的 HoroscopeBot 部署到 Facebook 和 Slack 上，因为它们已经提供了用户界面。你可能也希望拥有一个完全运行在自己服务器上的\
  \ Web 应用。在本章结束时，我们还将探讨如何使用自己的用户界面将聊天机器人部署到我们自己的服务器上。\n\n### 第一步\n\n第一步是复制你在第 4 章中构建的现有聊天机器人，并创建一个新副本，以便你有一个备份。\n\
  \n\n由于我们将通过添加一些新代码来进行一些更改，因此最好将两个项目分开存放。于是，我创建了一个新文件夹，并将我的 horoscope_bot 文件夹粘贴到了其中。现在，我所有的模型文件、数据集和代码文件都已复制过来，可以直接用于部署。\n\
  \nRasa 的凭证管理  \nRasa 提供了一种在单一位置管理所有凭证的方法。你可能只有一个模型，但希望它能部署在 Facebook、Slack、Telegram\
  \ 等多个不同平台上。所有这些第三方平台在连接时都需要使用一些凭证。这些凭证存储在一个名为 `credentials.yml` 的 YAML 文件中。让我们在项目目录\
  \ `horoscope_bot` 文件夹中创建一个名为 `credentials.yml` 的文件，并将我们的 Facebook 凭证添加进去。如果你不知道如何获取这些凭证，可以先创建这个文件，在本章下一节中，你将找到获取\
  \ Facebook 凭证的步骤。\n\n––––––––  \n© Sumit Raj 2019  \nS. Raj, 《构建聊天机器人》 https://doi.org/10.1007/978-1-4842-4096-0_5\
  \  \n155  \n\n`credentials.yml` 的内容如下所示：\n\n```yaml\nfacebook:\n  verify: \"horoscope-bot\"\
  \n  secret: \"bfe5a34a8903e745e32asd18\"\n  page-access-token: \"HPaCAbJJ1JmQ7qDedQKdjEAAbO4iJKr7H9nx4rEBAAuFk4Q3g\
  \ PQcNT0wtD\"\n```\n\n这些凭证是虚拟凭证；你的 Facebook 应用的令牌或密钥的长度以及字符类型可能有所不同。\n\n如果你正在处理一个大型项目，需要将聊天机器人集成到多个平台，并且希望项目更具可维护性，那么最好使用\
  \ `credentials.yml`。我强烈建议你维护一个 `credentials.yml` 文件，特别是当你是一家企业，并试图构建一个能在 Facebook、Slack、Twitter、Telegram\
  \ 或你自己的网站等多个平台上以相同方式运行的机器人时。在这种情况下，管理密钥和机密信息会变得更加容易。\n\n管理应用级密钥的一个好方法是将密钥存储为环境变量，并编写代码从操作系统环境中读取密钥值或任何其他敏感信息。请记住，将任何类型的密钥放在代码中从来都不是一个好主意。\n\
  \n你也可以在服务器上创建一个点（.）env 文件，并从该文件中读取密钥，该文件不会在你的代码仓库中被追踪。\n\n为了简单起见，我们将在部署的独立脚本中使用访问密钥和密钥。我们将使其易于理解，以便你首先能够构建机器人，然后可以尝试扩展它，最重要的是，你可以考虑安全层面的问题。\n\
  \n如果你需要将机器人部署到多个平台，并希望使用 `credentials.yml` 来维护不同的凭证，那么你可以通过传递一个额外的参数来使用它。例如，要在运行\
  \ rasa core 时使用上述名为 `credentials.yml` 的凭证文件，你可以使用以下命令：\n\n```bash\npython -m rasa_core.run\
  \ -d models/dialogue -u models/nlu/current —port 5002—credentials credentials.yml\n\
  ```\n\n了解这一点对于大型企业级聊天机器人的开发很有帮助，但如前所述，在接下来的示例中，我们将直接在脚本中使用凭证。\n\n在 Facebook 上部署聊天机器人\
  \  \n在本节中，我们首先将使用 Heroku 在云端部署我们的聊天机器人。Heroku 是一种平台即服务（PaaS），使开发人员能够完全在云端构建、运行和操作应用程序。Heroku\
  \ 的好处在于，我们可以轻松地让我们的应用程序在 https 上运行，而无需太多麻烦。在我们学习和测试聊天机器人时，无需去购买 SSL 证书。需要 https\
  \ 的原因是一些平台（如 Facebook）不允许开发者使用非 https 的 URL 作为回调 URL。\n\n我们将逐步执行一系列步骤，成功地将我们的聊天机器人作为\
  \ Web 服务部署到云端。一旦成功完成，将其与 Slack、Telegram 等不同平台集成将变得容易得多。那么，让我们开始吧。\n\n在 Heroku 上创建应用\
  \  \n让我们开始吧：\n\n1.  在 Heroku 上注册，创建一个应用，并将其命名为 something-actions，因为这将是我们动作服务器应用。请查看图\
  \ 5-1 中的截图，你可以为你的动作服务器指定一个唯一的名称，该名称应在 Heroku 上可用。一旦该名称可用，你可以点击“创建应用”按钮来创建动作服务器应用。\n\
  2.  如果你的名称不可用，可以随意将其命名为你想要的任何名称，但尽量使用有意义的名称。\n\n![](img/image-n247gcw0.png)  \n\
  图 5-1. 在 Heroku 上创建名为 horoscopebot1212-actions 的动作服务器应用\n\n在本地系统上设置 Heroku  \n在你的本地操作系统上安装\
  \ Heroku CLI。请参考此链接：https://  \n如果你使用的是 macOS，请使用以下命令：\n\n```bash\nbrew install\
  \ heroku/brew/heroku\n```\n\n在 Facebook 上创建并设置应用  \n为了能够将我们的聊天机器人部署到 Facebook，首先我们需要拥有\
  \ Facebook 应用的凭证。为了获取 Facebook 凭证，我们需要像在第三章中那样设置一个 Facebook 应用和一个页面。\n\n前往 https://developers.facebook.com/，如果你还没有应用，请创建一个。我们为\
  \ OnlineEatsBot 创建了一个；现在我们将为 HoroscopeBot 创建一个。输入详细信息并点击“创建应用 ID”。查看图 5-2，了解如何输入你的机器人的显示名称和你的联系邮箱。\n\
  \n![](img/image-fgm7gv0c.png)  \n图 5-2. 为开发者创建 Facebook 应用\n\n应用创建完成后，进入“设置”下的“基本”选项，点击“应用密钥”旁边的“显示”按钮。这就是你的\
  \ `fb_secret` 密钥。请参考图 5-3，了解具体在哪里获取你的 `fb_secret` 密钥。\n\n![](img/image-vr4x4kow.png)\
  \  \n图 5-3. 从 Facebook 应用获取应用密钥\n\n进入应用的仪表板，向下滚动到“添加产品”。点击“添加产品”，然后添加 Messenger（点击“设置”）。查看图\
  \ 5-4。\n\n\n\n[](image-o6zbzdpu.png) **图 5-4.** 将 Messenger 作为产品添加到 Facebook 应用\n\
  \n在 Messenger 的设置中，向下滚动到“令牌生成”（Token Generation）部分，你会看到一个为你的应用创建新页面的链接。如果你还没有页面，请创建一个，或者从“选择页面”（Select\
  \ a page）下拉菜单中选择一个页面。“页面访问令牌”（Page Access Token）就是你的 `fb_access_token`。请参考图 5-5。\n\
  \n你可以通过以下链接为你的机器人项目创建一个全新的页面：https://www.facebook.com/pages/creation/\n\n![](img/image-xgmdmdzg.png)\
  \ **图 5-5.** 为 Facebook Messenger 应用生成令牌\n\n在“令牌生成”部分之后，紧接着在“Webhooks”下，点击“设置 Webhooks”（Setup\
  \ Webhooks）。请参考图 5-6。\n\n![](img/image-osfgpga4.png) **图 5-6.** 设置 Facebook Webhooks\n\
  \n接下来，选择一个验证令牌（verify token），我们稍后会用到它。验证令牌可以是任意随机字符串。这将是你的 `fb_verify`。请查看图 5-7，了解在\
  \ Facebook 应用中添加验证令牌的位置。现在，暂时将回调 URL（callback URL）部分留空。不要关闭浏览器；先放在一边——我们稍后会回到这里。\n\
  \n![](img/image-gr9qu751.png) **图 5-7.** 将验证令牌添加到 Facebook webhook 设置\n\n请将 `fb_verify`、`fb_secret`\
  \ 和 `fb_access_token` 放在手边，以便将你的机器人连接到 Facebook。\n\n**在 Heroku 上创建并部署 Rasa Actions\
  \ 服务器应用**\n\n在这一步中，我们将使用我们的 actions Heroku 应用作为 Rasa action 的服务器。我们需要两个不同的应用，因为我们无法在单个\
  \ Heroku 应用中运行两个 Web 应用。打开命令行，按照指示从你的项目目录执行以下一组命令。\n\n创建一个名为 `actions_app` 的新文件夹并进入该目录：\n\
  \n```\nmkdir actions_app\ncd actions_app\n```\n\n将 `actions.py` 从主项目目录复制到 `actions_app`\
  \ 目录。\n\n创建一个包含以下内容的 `requirements.txt` 文件。`requirements.txt` 将告诉 Heroku 应用安装指定版本的包。\n\
  \n```\nrasa-core-sdk==0.11.0\nrequests==2.18.4\n```\n\n创建一个名为 `Procfile` 的文件，内容如下。`Procfile`\
  \ 是 Heroku 用来理解如何启动应用的文件。\n\n```\nweb: python -m rasa_core_sdk.endpoint—actions\
  \ actions\n—port $PORT\n```\n\na) 运行以下命令集：\n\n```\n$ heroku login\n$ git init\n\
  $ heroku git:remote -a <your-heroku-app-name>\n$ heroku buildpacks:set heroku/python\n\
  $ heroku config:set PORT=5055\n$ git add .\n$ git commit -am \"deploy my bot\"\n\
  $ git push heroku master\n```\n\n执行完最后一条命令后，Heroku 将根据 `requirements.txt` 文件安装我们所需的所有包。如果你的应用成功部署，你应该会看到类似于以下的日志：\n\
  \n```\nremote:\nremote:——-> Discovering process types\nremote: Procfile declares\
  \ types -> web\nremote:\nremote:——-> Compressing...\nremote: Done: 48.3M\nremote:——->\
  \ Launching...\nremote: Released v4\nremote: https://horoscopebot1212-actions.herokuapp.com/\
  \ deployed to Heroku\nremote:\nremote: Verifying deploy... done.\nTo https://git.heroku.com/horoscopebot1212-actions.git\n\
  \ * [new branch] master -> master\n```\n\n此时，我们将验证我们的应用是否响应公共请求。为此，让我们访问附加了“webhook”的应用\
  \ URL。\n\n我的应用 URL 是 https://horoscopebot1212-actions.herokuapp.com/，所以我会去检查我的 action\
  \ 服务器是否在响应。\n\n我访问这个 URL，正如预期的那样，它返回“方法不允许”（method not allowed），如图 5-8 所示，这完全没问题，意味着应用正在根据用户请求正确响应。\n\
  \n![](img/image-8wj00i4p.png) **图 5-8.** 验证 action 服务器端点\n\n**创建 Rasa 聊天机器人 API\
  \ 应用**\n\n在这一步中，我们将遵循一些与我们刚才所做的类似的步骤和命令，但这是一个我们将创建的新应用，它将是我们用于对话管理的主应用。那么，让我们开始吧。首先回到主项目目录（即\
  \ `horoscope_bot` 目录），创建一个文件并添加以下内容：\n\n```\nweb: python -m spacy download en &&\
  \ python facebook.py\n```\n\n**为 Facebook Messenger 聊天机器人创建独立脚本**\n\n在同一项目目录中创建一个名为\
  \ `facebook.py` 的文件。Python 文件的内容应如下所示：\n\n```python\nfrom rasa_core.channels.facebook\
  \ import FacebookInput\nfrom rasa_core.agent import Agent\nfrom rasa_core.interpreter\
  \ import RasaNLUInterpreter\nimport os\nfrom rasa_core.utils import EndpointConfig\n\
  \n# 加载你训练好的 agent\ninterpreter = RasaNLUInterpreter(\"models/nlu/default/horoscopebot/\"\
  )\nMODEL_PATH = \"models/dialog\"\n\naction_endpoint = EndpointConfig(url=\"https://horoscopebot1212-actions.herokuapp.com/webhook\"\
  )\n\nagent = Agent.load(MODEL_PATH, interpreter=interpreter)\ninput_channel = FacebookInput(\n\
  \    fb_verify=\"YOUR_FB_VERIFY_TOKEN\",\n    # 你需要告诉 Facebook 这个令牌，以确认你的 URL\n\
  \    fb_secret=\"YOUR_FB_SECRET\",\n    # 你的应用密钥\n    fb_access_token=\"YOUR_FB_ACCESS_TOKEN\"\
  \n    # 你所订阅页面的令牌\n)\n\n# 如果你希望保持服务器运行，请设置 serve_forever=False\ns = agent.handle_channels([input_channel],\
  \ int(os.environ.get('PORT', 5004)), serve_forever=True)\n```\n\n请确保将此代码中的 `fb_secret`\
  \ 和 `fb_access_token` 变量值替换为我们在步骤 3 中保存的值。\n\n创建一个新的 `requirements.txt` 文件，并添加此项目所需的所有包及其版本。我的\
  \ `requirements.txt` 文件如下所示；对于你的项目，依赖项可能有所不同，但如果你遵循本章中相同的机器人示例，这些依赖项应该没问题。\n\n```\n\
  rasa-core==0.11.1\nrasa-core-sdk==0.11.0\nrasa-nlu==0.13.2\ngunicorn==19.9.0\nrequests==2.18.4\n\
  spacy==2.0.11\nsklearn-crfsuite==0.3.6\n```\n\n以便在服务器中安装我们的包。\n\n现在，让我们像之前一样在 Heroku\
  \ 中再次创建一个新应用。转到你的 Heroku 仪表板，创建一个新应用，如图 5-9 所示。\n\n![](img/image-28x4ogbv.png) **图\
  \ 5-9.**\n\n\n\n在 Heroku 上创建对话管理应用  \n创建应用后，你可以进入项目根目录，在项目文件夹中通过命令行运行以下一组命令：  \n\
