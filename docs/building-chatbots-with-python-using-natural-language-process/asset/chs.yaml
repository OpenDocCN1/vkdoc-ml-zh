  \ PDV（部署后验证）。我们也将做类似的事情，在成功部署到 Facebook Messenger 后，对我们的聊天机器人进行 PDV。这很重要，因为正如你所了解的，聊天机器人有一部分需要连接到动作服务器，以响应用户的某些意图请求。\
  \  \n\nPDV 类似于冒烟测试，用于检查应用的整体健康状况。如果你正在构建一个使用 10 到 15 个不同供应商 API 的机器人，那么必须检查所有场景，即机器人访问动作服务器并使用\
  \ API 向用户返回数据的情况。  \n\n因此，请前往你的 Messenger 应用或电脑浏览器中的 Facebook，搜索你的机器人并开始对话。  \n\n\
  图 5-12.1 到 5-12.3 展示了我的星座机器人的功能及反馈。  \n\n![](img/image-p6wgksu5.png)  \n图 5-12.1.\
