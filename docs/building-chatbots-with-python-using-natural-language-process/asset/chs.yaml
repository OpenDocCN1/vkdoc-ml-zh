  \n能够完全掌控自己所拥有的一切总是好的，不是吗？\n\n**注意：** 您可以前往您的账户设置，直接导出或导入智能体。您可以下载 zip 文件。您可以使用此\
  \ zip 文件将其导入 Dialogflow，并体验我们在本章中构建的聊天机器人。\n\n您一定在想，如果我想实时处理订单，并使用供应商/餐厅的 API 查找订单状态并相应地回复用户，该怎么办？这可以是您想要进行的任何\
  \ API 调用——实时检索数据并制定机器人的响应。在结束本章并为下一章做准备之前，是时候了解如何做到这一点了。\n\n让我们来了解 Dialogflow 中一个叫做\
  \ **Fulfillment** 的功能。\n\n为了获取用户请求的实时信息，我们需要开发一些 API 或使用现有的 API。要使用 Dialogflow 实现这一点，我们需要进行设置，这包括部署一个服务并调用\
  \ API。\n\n我们不会深入探讨构建 API 和如何部署的细节，但如果您曾经尝试使用过任何 Google 或 Facebook 的 API，您至少应该熟悉如何调用它们。\n\
  \n我构建了一个基于 Flask 的小型 API，并将其部署到了 Heroku。我将用它来实现 fulfillment，该 API 只需在 URL 中接收任何\
  \ `order_id`，并返回一个随机的 `order_status`。如果您不熟悉 Heroku，请不要担心，您可以在本地系统上运行提供的代码并进行测试。在接下来的章节中，我们将使用\
  \ Heroku 部署大量应用程序，届时您可以学习与之相关的知识。\n\n在代码中，您可以了解如何解析 `order_identity`、`intentName`\
  \ 等。在此处查找代码：`flask_onlineeats_demo.zip`\n\n请求 URL：`https://radiant-bayou-76095.herokuapp.com/onlineeatsbot/`\n\
  \n`api/v1.0/order_status/`\n\n因此，在 Dialogflow Fulfillment 中，会将来自意图的 JSON 响应 POST\
  \ 到此 URL，您需要解析该响应以获取相关的实体及其值，并执行特定的操作。\n\n您也可以尝试将示例 Flask 应用代码部署到 Heroku，并在您的机器人中拥有自己的\
  \ fulfillment 端点。\n\n现在，Dialogflow 会将启用了 webhook 调用的意图的 JSON 响应 POST 到我们的端点。该端点包含解析\
  \ `order_id` 实体并根据其采取行动的代码。目前，该代码仅从列表中返回一个随机选择的状态。\n\n要测试 API 是否正常工作，请前往 POSTMAN\
  \ 并使用图 3-22 中的示例数据进行测试。如果您在本地运行 Flask 应用，请使用本地 URL。\n\n ![](img/image-k7cauxpl.png) \
  \ \n图 3-22. 在 POSTMAN 中测试部署在 Heroku 上的 fulfillment API\n\n**启用 Webhook**\n\n那么，让我们前往\
  \ Dialogflow 中的 fulfillment 页面，尝试启用 webhook（见图 3-23）。\n\n ![](img/image-z444ejmj.png) \
  \ \n图 3-23. 在 Dialogflow 中为 fulfillment 设置 webhook\n\n请确保您已为 `user_order_id` 意图启用了\
  \ webhook 调用（见图 3-24）。\n\n ![](img/image-bdz453lo.png)  \n图 3-24. 为特定意图启用 webhook\
  \ 调用\n\nDialogflow 会将一个 JSON 主体 POST 到您的 webhook URL，该主体将类似于图 3-25。\n\n ![](img/image-cmdfozwp.png) \
  \ \n––––––––\n\n图 3-25.\n\n\n\n从 Dialogflow 传入我们 Webhook 端点的 JSON 数据  \n检查响应  \n\
  每当 Dialogflow 将意图的 JSON 响应（如图 3-25 所示）POST 到你的 Web 服务时，它期望你的 Web 服务返回如图 3-26 所示格式的响应。\
  \  \n![](img/image-l7se7exx.png)  \n图 3-26. Dialogflow 期望的 Webhook URL 响应  \n\n\
  如果你认为你的 API 响应必须与图 3-26 的格式完全一致，那么请放心——事实并非如此。你的意图不会抛出错误，因为 JSON 主体中的所有键都是可选的。 \
  \ \n\n以下是我的 API 响应及其完美运行的样子：  \n\n{  \n\"fulfillmentText\": \"订单 ID：9999。正在途中\"\
  ,  \n\"payload\": {  \n\"facebook\": {  \n\"text\": \"订单 ID：9999。正在途中\"  \n}  \n\
  }  \n}  \n\n当我再次调用同一个 API 时，会得到不同的订单状态文本，但格式与 Dialogflow 引擎期望的相同。  \n\n{  \n\"fulfillmentText\"\
  : \"订单 ID：9999。骑手已取到您的食物，请再等 10-15 分钟\",  \n\"payload\": {  \n\"facebook\": {  \n\
  \"text\": \"订单 ID：9999。骑手已取到您的食物，请再等 10-15 分钟\"  \n}  \n}  \n}  \n\n`fulfillmentText`\
  \ 是智能体向用户回复内容的关键。  \n\n现在，使用公共 URL 或在 Dialogflow 智能体本身中测试机器人，查看来自 API 的响应，而不是我们之前添加的默认静态响应。\
  \  \n\n这就是我们如何利用 Dialogflow 的 fulfillment 功能，将外部 API 或我们自己的 API 集成到聊天机器人中，从而实现动态和实时交互。\
  \  \n\n总结  \n在本章中，我们学习了 Dialogflow 以及如何使用 Dialogflow 构建聊天机器人。我们学习了如何定义意图及其对应的实体。我们构建了一个简单的食品订购聊天机器人，它能理解用户的订餐意图，还能识别用户点了哪些食品以及数量。我们还增强了聊天机器人的功能，让用户可以查询订单状态，获取订单\
  \ ID，并根据不同的订单状态生成回复。  \n\n我们还学习了 Dialogflow 中的 fulfillment，通过它从我们自己的 API 获取订单状态，并据此向用户提供回复。我们学会了为聊天机器人创建\
  \ Web 演示，并将其与 Messenger 集成。至此，你应该对聊天机器人的端到端工作原理有了清晰的认识。  \n\n在下一章中，我们将尝试更困难的方式来构建聊天机器人。是的，你没听错。我们将摆脱对\
  \ Dialogflow 等工具的依赖，以编程方式自行构建一切。让我们为下一章做好准备，因为当你从头开始构建一切时，那将会更加有趣。这就像训练和驯服你自己的聊天机器人。\
  \  \n\n我们下一章见。  \n\n第 4 章  \n––––––––  \n以更困难的方式构建聊天机器人  \n\n“以更困难的方式构建聊天机器人”并不难学。\
  \  \n\n这是为了完全掌控你自己的聊天机器人而采取的困难方式。如果你想自己构建一切，那么你就选择了这条艰难的道路。这条更艰难的路，当你走过时觉得困难，但当你回首时，却会发现它美丽而清晰。\
  \  \n\n这是一条通往伟大高度的崎岖之路。  \n——塞内卡  \n\n如果你熟悉 Python，并且对如何安装包等有一定了解，那么学习本章内容不会有任何问题。如果你是开发者，这应该很容易。如果你是管理者或非技术人员，你仍然可以按照每个章节中提到的步骤逐一操作，并完成任务。我强烈建议每个人都完成本章，这样你就能学到构建聊天机器人的核心知识。\
  \  \n\n本章不仅教你从头构建聊天机器人，还展示了在 Rasa NLU 的帮助下，核心机器学习（ML）如何与自然语言处理（NLP）协同工作。正如本书第一章所述，在构建聊天机器人时，拥有决策树总是好的。在本章中，我们几乎不会使用任何规则，但机器学习尚未达到\
  \ 100% 可靠的阶段。因此，这个决定完全取决于你的用例，以及你是否希望在机器学习模型之外应用一些业务逻辑。有时，你的机器学习模型可能运行得非常好，以至于你根本不需要任何启发式规则。但根据我的经验，当你去销售或商业化你的聊天机器人时，你必须多加小心。没有功能总比拥有一个毫无意义的功能要好。\
  \  \n\n我们将使用一个名为 Rasa NLU 的开源库，学习如何在不使用 Dialogflow、Watson、wit.ai 等云服务的情况下，从头构建聊天机器人。请记住，Rasa\
  \ NLU 是一个非常复杂的库，包含许多功能。我们只会涉及对我们构建聊天机器人重要的概念和功能。  \n\n什么是 Rasa NLU？  \nRasa NLU\
  \ 是一个用于聊天机器人意图分类和实体提取的 NLP 库。它帮助你为聊天机器人构建和编写自定义的 NLP。  \n\n本章将涵盖 Rasa 的两个部分。  \n\
  • Rasa NLU：使用 Rasa NLU，我们将学习为聊天机器人准备训练数据、编写配置文件、选择管道以及训练模型。最后，我们将使用模型预测文本的意图。我们还将学习如何使用\
  \ Rasa NLU 解析实体。  \n• Rasa Core：在第二部分中，我们将学习训练 Rasa Core 对话管理模型，以准备向用户回复。当你的聊天机器人包含多种意图及其后续问题或回复时，这一部分变得非常重要。与其在决策树中编写大量条件，并在大型企业级应用出现问题时花费数小时调试，不如教会模型如何生成回复。\
  \  \n\n\n\n观察我们训练好的模型在这方面的表现将会很有趣。我们不能仅仅以文本形式向用户随意输出内容；它必须是有意义的。  \n**为什么应该使用 Rasa\
  \ NLU？**  \nRasa NLU 并非只是另一个包含一堆方法来完成某些任务的库。它具备构建你能想象到的几乎任何类型聊天机器人的能力。Rasa 为你带来了神奇的能力：训练机器理解文本的含义，而不是让你编写规则来理解它。\
  \  \n让我们看看以下几点，了解为什么应该使用 Rasa NLU：  \n\n- Rasa NLU 是一个积极维护的项目，并且拥有一个良好的社区来支持它。 \
  \ \n- 如果我们不想将用户的敏感数据分享给第三方，就必须使用像 Rasa NLU 这样的开源工具从头构建聊天机器人。这样，所有数据都保留并在我们自己的服务器上进行处理。\
  \  \n- 依赖第三方服务来训练数据并查找用户话语的意图，需要你调用可能并不总是可靠的 API。如果他们的服务器宕机，你的聊天机器人应用会怎样？  \n- 使用\
  \ Rasa NLU 构建聊天机器人将使你完全掌控你的聊天机器人。你可以根据自己的意愿，使用你想要的数据来训练、调整和优化它。借助 Rasa NLU，我们可以试验哪种机器学习算法最适合我们的数据集，而不是依赖固定的算法。\
  \  \n\n**直接深入 Rasa NLU**  \n在本节中，我们将直接进入实践部分，尝试安装 Rasa 栈，并通过训练数据开始构建我们的机器学习模型。我们将使用一些更酷的开源库来让我们的工作更轻松。\
  \  \n\n**安装 Rasa**  \n要安装 Rasa，请运行以下 pip 命令，我们在之前的章节中曾用该命令安装 spaCy。请注意，我们将使用 Rasa\
  \ 版本 0.13.2。  \n\n```\npip install rasa-nlu==0.13.2\n```\n\nRasa NLU 有多个组件用于分类意图和识别实体。\
  \  \nRasa 的不同组件有各自独立的依赖项。  \n当我们训练模型时，Rasa NLU 会检查所有必需的依赖项是否已安装。如果你想安装完整使用 Rasa\
  \ 库所需的所有依赖项，可以执行以下步骤：  \n\n```\ngit clone https://github.com/RasaHQ/rasa_nlu.git\
  \ #克隆仓库\ncd rasa_nlu #进入 rasa 目录\npip install -r alt_requirements/requirements_full.txt\
  \ #安装完整依赖项\n```\n\n第一步可能需要一些时间。请像大地一样耐心等待，直到它完成。  \n\n**在 Rasa 中决定管道**  \n管道不过是一组用于训练模型的算法。Rasa\
  \ NLU 有两个广泛使用的管道，分别称为 `spacy_sklearn` 和 `tensorflow_embedding`。让我们对两者都稍作了解。  \n\n\
  **spacy_sklearn**  \n- `spacy_sklearn` 管道利用了来自 GloVe 算法或 Facebook AI 团队开发的名为 fastText\
  \ 的算法的预训练词向量。  \n- `spacy_sklearn` 在以下场景中表现非常出色：假设你有一个话语，比如“What is the weather\
  \ in Boston?”，当我们用相同的话语示例训练模型，然后要求它预测“What is the weather in London?”的意图时，我们的模型现在足够智能，能够知道“Boston”和“London”这两个词是相似的，并且它们属于同一个意图。\
  \  \n- 这个管道对于小数据集非常有用。  \n\n**tensorflow_embedding**  \n- `tensorflow_embedding`\
  \ 管道不像 `spacy_sklearn` 那样使用任何预训练的词向量，而是根据我们自己提供的数据集自行调整。  \n- `tensorflow_embedding`\
  \ 管道的好处在于，我们的词向量将根据我们的领域而定。  \n- 为了用一个例子解释 `tensorflow_embedding` 的工作原理，在英语中，“play”这个词可能与“a\
  \ sport”或“an activity of enjoyment or recreation”密切相关，并且它可能看起来与“an act”这个词非常不同。在戏剧领域，“play”和“an\
  \ act”密切相关，其中“play”的意思是“a form of literature written by a playwright”，因此非常有必要告诉我们的模型学习特定于我们的领域，而不要因为某些预训练模型而混淆。\
  \  \n\n**从头训练和构建聊天机器人**  \n如果你已经阅读过本书的第 3 章，你一定熟悉我们使用 Dialogflow 构建的“食品订购聊天机器人”。你一定了解意图、实体以及聊天机器人对最终用户的响应。\
  \  \n类似地，在本章中，我们将以一个聊天机器人的用例为例，从头开始构建它。你不一定需要使用相同的示例。请随意找到你自己的用例，按照本章的步骤操作，并在本章结束时构建你自己的聊天机器人。\
  \  \n我们将构建一个星座运势机器人，它能够理解用户查询并告诉他们当天的星座运势。那么，让我们开始吧。  \n\n**构建星座运势机器人**  \n在这个使用开源库\
  \ Rasa NLU 完全自行构建聊天机器人的示例中，我们将构建一个星座运势机器人。让我们确定这个聊天机器人的范围，看看它能做什么以及可以做什么。  \n\n\
  - 星座运势机器人应该能够理解问候语并用问候语回复。  \n- 机器人应该能够理解用户是否在询问星座运势。  \n- 如果用户没有提供星座，机器人应该能够询问用户的星座。\
  \  \n- 如果用户不知道自己的星座，机器人应该询问用户的出生日期并为他们找到星座。  \n- 机器人应该能够订阅/取消订阅用户以获取每日星座运势。  \n\
  - 机器人应该能够从现有的响应中学习，以制定新的响应。  \n- 机器人应该能够处理用户的拼写错误。  \n\n我们的机器人在这里要做的任务相当简单。  \n\n\
  \n\n可能的意图   • 问候意图：用户以问候开始对话   • 获取星座意图：用户询问星座运势   • 用户星座意图：用户告知其星座   • 用户出生日期意图：用户告知其出生日期\
  \   • 订阅意图：用户请求订阅   根据你设计机器人和编写代码的方式，你可能需要或不需要上述所有意图，或者你可能还需要定义一些额外的意图，以涵盖我们希望机器人完成的所有用例。随着本章内容的深入，我们将尝试构建一个能够完成提供星座运势基本任务的机器人；稍后作为练习的一部分，我们可以为其添加更多用例。\
  \   嗯，这基本上就是我们到目前为止，基于机器人和用户之间一个简单的可能对话，来识别可能意图所做的事情。   星座运势机器人与用户之间的对话脚本   让我们为聊天机器人和用户之间创建一个可能的对话脚本。正如第一章所述，编写对话脚本就像在构建软件之前准备一份软件需求文档。它之后可能会改变，但能让你对最终聊天机器人应用程序中将要发生的事情有一个整体的了解。\
  \   以下是我们用户与机器人之间对话的样子：   用户：你好   星座运势机器人：你好！希望你一切顺利。   用户：我想知道我的星座运势。   星座运势机器人：当然，可以告诉我你的星座吗？\
  \   用户：摩羯座（拼写错误）   星座运势机器人：抱歉，你是指摩羯座吗？   用户：是的。   星座运势机器人：好的，这是你今天的星座运势。今天你可能会感到乐观和积极。将这种能量分享给那些感到不太满足的人。你的态度可能会对朋友、伴侣、配偶和孩子产生深远的影响。邻居和亲戚可能会在你没有意识到的情况下感受到你的精神。如果有人受伤或生气，请给予鼓励。一切最终都会好起来的。\
  \   星座运势机器人：你想订阅每日更新吗？如果愿意，只需说“订阅”。   用户：是的，请帮我订阅。   星座运势机器人：太好了，你现在已经订阅了。祝你有美好的一天。\
  \   这个对话只是为了让我们大致了解聊天机器人对话的样子。我们可能会也可能不会根据需求更改对话流程。   我们可以让我们的聊天机器人模型自行训练以准备有效的响应，而不是编写一堆\
  \ if...else 语句。   为聊天机器人准备数据   Rasa NLU 有多种方式在我们的自定义数据上定义意图及其实体。它支持 Markdown 格式、JSON\
  \ 格式（作为单个文件）或包含多个文件的目录格式的数据。   我们将首先讨论最困难但高度可扩展的方法。手动创建 JSON 文件很困难，但通过编程方式创建则非常容易且可扩展。\n\
  \n以 JSON 格式为模型创建数据   Rasa NLU 期望的 JSON 格式数据有一个顶层对象，包含键和。   我们将要使用的最重要的键是 common_。以下是我们\
  \ JSON 数据的基本结构：   {   \"rasa_nlu_data\": {   \"common_examples\": [], \"regex_features\"\
  \ : [], \"entity_synonyms\": []   }   }   我们 JSON 数据中的 common_examples 键是用于训练我们模型的核心位置。我们将把所有训练示例添加到\
  \ common_examples 数组中。   regex_features 是一个帮助意图分类器识别实体或意图，并提高意图分类准确性的工具。   让我们开始编写我们的\
  \ JSON 文件。我们将其命名为 data.json。   创建一个名为的文件夹。将当前工作目录更改为 horoscope_bot。启动 Jupyter Notebook\
  \ #jupyter notebook。创建一个名为的新文件夹。点击 data 文件夹，然后在 Jupyter Notebook 的“新建”菜单下进入“文本文件”。点击创建的文件名称，将其更改为\
  \ data.json，并为你的聊天机器人编写意图。   对于步骤 5 和 6，你可以随意使用你喜欢的编辑器，如 Sublime、Notepad++、PyCharm\
  \ 等来处理 JSON 文件。   以下是我的 data 文件夹下 data.json 文件的内容：   {   \"rasa_nlu_data\": { \"\
  common_examples\": [   {   \"text\": \"Hello\",   \"intent\": \"greeting\", \"entities\"\
  : []   },   {   \"text\": \"I want to know my Horoscope\",   \"intent\": \"get_horoscope\"\
  , \"entities\": []   },   {   \"text\": \"Can you please tell me my horoscope?\"\
  ,   \"intent\": \"get_horoscope\", \"entities\": []   },   {   \"text\": \"Please\
  \ subscribe me\",   \"intent\": \"subscription\"   }   ],   \"regex_features\":\
  \ [],   \"entity_synonyms\": []   }   }   嗯，如你所见，手动准备这个看起来很笨拙。你一定还记得我们在 Dialogflow\
  \ 中使用的那个又好又简单的方法。那么，让我们看看一个很酷且有趣的工具，用于创建 Rasa 期望格式的训练数据。它由 Polgár András 创建，对于检查和修改我们之前准备的现有数据也非常有用。如果你正在处理一个需要手动创建数据的小项目，这个工具可以节省大量时间。在你构建的任何完全由数据驱动的应用程序中，可视化数据总是一个好主意。\
  \   所以，先保存我们之前创建的 data.json 文件，直到我们使用更好的方法来扩展数据收集。   可视化和修改 Rasa 的 JSON 数据格式   在本节中，我们将使用一个名为\
  \ Rasa NLU trainer 的工具来可视化我们的数据（即我们到目前为止创建的数据）。这个工具也帮助我们标注数据。如果你还记得第三章中解释的 Dialogflow\
  \ 界面，定义实体、实体名称和类型非常容易。我们将使用一个开源工具来做同样的事情。\n\n\n\nRasa NLU 训练器是一个非常便捷的工具，可以直接在浏览器中编辑训练数据。处理\
  \ JSON 数据既棘手又容易出错。借助这个便捷工具，我们可以轻松地向训练数据中添加更多示例或编辑现有示例，从而节省大量手动标注数据的时间。rasa-nlu-trainer\
  \ 是一个基于 JavaScript 的工具，因此我们需要安装 node.js 才能在系统上运行它。安装过程不超过 5 分钟。让我们按照以下步骤进行设置：\n\n\
  前往 https://www.npmjs.com/get-npm 下载 node.js。按照网站指引在系统上安装该软件包。安装完成后，打开一个新的终端/命令行界面，输入“npm”来检查是否安装成功。\n\
  \n我安装了 LTS 版本 8.11.4。安装完成后，运行以下命令来安装 rasa-nlu-trainer：\n\nsudo npm i -g rasa-nlu-trainer\n\
  \n成功安装此命令后，您将看到类似以下的日志：\n\n[fsevents] Success: \"/usr/local/lib/node_modules/rasa-nlu-trainer/\
