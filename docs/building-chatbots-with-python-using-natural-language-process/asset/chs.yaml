  \ Dialogflow 当时并非如此，但后来 Dialogflow 也免费了。  \n• https://www.luis.ai/  \n• 一种基于机器学习的服务，用于将自然语言构建到应用、机器人和物联网设备中。\
  \  \n• 快速创建可投入企业级应用、持续改进的自定义模型。  \n• http://botkit.ai  \n• 可视化对话构建器  \n• 内置统计和指标\
  \  \n• 可轻松集成到 Facebook、Microsoft、IBM Watson、Slack、Telegram 等平台。  \n\n**聊天机器人的组成部分及常用术语**\
  \  \n聊天机器人系统的组成部分很少。在本节中，我们将简要讨论在后续章节中会遇到的聊天机器人组件。  \n在深入探讨任何系统之前，对其有基本的理论理解总是有益的。通过本节，你应该能对使用\
  \ Python 构建聊天机器人时所用的技术术语有一个清晰的认识。这些术语将在后续章节中频繁使用，届时我们将真正开始构建聊天机器人。  \n\n**意图** \
  \ \n当用户与聊天机器人交互时，他使用聊天机器人的目的是什么/他在询问什么？  \n例如，当用户对聊天机器人说“预订一张电影票”时，作为人类，我们能理解用户想要预订一张电影票。这就是机器人的意图。它可以被命名为意图。\
  \  \n另一个例子是，当用户说“我想点餐”或“你能帮我点餐吗？”这些都可以被命名为意图。同样，你可以根据需要定义任意数量的意图。  \n\n**实体**  \n\
  意图包含关于意图的元数据，称为实体。在“预订一张电影票”的例子中，预订票是意图，而实体是“电影”，它也可能是其他东西，比如航班、音乐会等。  \n你可以标记通用实体，以便在所有意图中使用。实体可以表示数量、计数或体积。意图也可以有多个实体。\
  \  \n例如：给我订一双 8 码的鞋。这里可能有两个实体：  \n类别：鞋  \n尺码：8  \n\n**表述**  \n表述不过是用户可能展示的同一问题/意图的不同形式。\
  \  \n• 还记得我们讨论过的关灯意图吗？那是用户如何为同一意图使用不同表述的一个例子。  \n• 建议每个意图有 10 个最佳表述，最少 5 个，但这并非硬性限制。\
  \  \n\n**训练机器人**  \n训练本质上意味着构建一个模型，该模型将从现有定义的意图/实体和表述中学习，以对新表述进行分类，并同时提供置信度分数。 \
  \ \n当我们使用表述训练系统时，这被称为监督学习。我们很快将学习如何实际操作。  \n\n**置信度分数**  \n每当你尝试判断一个表述可能属于哪个意图时，你的模型都会给出一个置信度分数。\
  \  \n这个分数告诉你，你的机器学习模型对识别用户意图的自信程度。  \n\n以上就是我们在“聊天机器人简介”第一章中想要涵盖的全部内容。从商业角度和技术角度，你现在应该对聊天机器人有了清晰的认识。我们回顾了聊天机器人的历史发展脉络。聊天机器人的进化程度令人着迷。\
  \  \n我们了解了聊天机器人如何随着时间的推移而演变，以及为什么在如此激烈的竞争中，聊天机器人是企业发展的必备工具。我们学习了不同的聊天机器人框架，并通过示例了解了聊天机器人的术语。我们将在后续章节中使用这些知识。你现在应该已经清楚自己想构建哪种聊天机器人，以及它构建完成后的行为表现。\
  \  \n如果需要，请完成你的所有文档和决策树。在下一章学习了自然语言理解的基础知识后，我们就可以快速开始构建聊天机器人了。  \n即使你心中没有任何想法，也不必担心。我们将利用后续章节学到的所有概念，一步步构建一个很酷的聊天机器人。\
  \  \n下一章见。  \n\n**第 2 章**  \n––––––––  \n**用于聊天机器人的自然语言处理**  \n本章旨在让你开始使用 Python\
  \ 进行自然语言处理（NLP），这是构建聊天机器人所需的技能。你将学习使用一个名为 spaCy 的优秀开源库进行 NLP 的基本方法和技术。如果你是 Python\
  \ 生态系统的初学者或中级用户，请不要担心，因为你会逐步完成学习聊天机器人 NLP 所需的每一步。本章不仅教你 NLP 的方法，还会结合现实生活中的例子，并通过代码示例进行演示。我们还将讨论为什么特定的\
  \ NLP 方法可能对聊天机器人是必需的。请注意，NLP 本身是一项技能。  \n我们将仔细研究词性标注、词干提取、实体检测、停用词、依存句法分析、名词块以及词语间的相似度查找。所有这些方法在你构建特定用例的聊天机器人时都会非常有帮助。\
  \  \n本章涵盖的 NLP 方法之外还有很多。根据你正在构建的聊天机器人的需求，你可以尝试学习它们。到本章结束时，我们将学习使用的 SpaCy 库将为你提供足够的思路，来扩展你的\
  \ NLP 知识库和理解。那么，让我们开始吧，首先在下一节中尝试理解用于聊天机器人的 NLP。  \n\n**为什么我需要了解自然语言处理才能构建聊天机器人？**\
  \  \n要理解这个问题的答案，我们首先来了解自然语言处理（NLP）。  \n自然语言处理（NLP）是人工智能的一个领域，它使计算机能够分析和理解人类语言。 \
  \ \n\n29  \n© Sumit Raj 2019  \nS.\n\n\n\n拉杰，《构建聊天机器人》——现在，要执行自然语言处理（NLP），或者说自然语言理解（NLU），我们有很多方法，接下来将逐一讨论。你刚才听到了一个新术语“自然语言理解”吗？\
  \  \n简单来说，NLU 是 NLP 这个大概念的一个子集，就像机器学习、深度学习、NLP 和数据挖掘是人工智能（AI）这个大概念的子集一样。AI 是一个总称，泛指任何能执行智能任务的计算机程序。\
  \  \n一个实用的经验法则是：用 NLU 这个术语来表达机器理解人类提供的自然语言形式的能力。  \n现在，回到“构建聊天机器人是否真的需要了解 NLP”这个问题——答案是“既是也不是”。困惑吗？你没听错，并不是说如果你不懂\
  \ NLP 的方法和技术就完全无法构建聊天机器人，但你的能力范围会受到一定限制。你将无法在扩展应用的同时保持代码的整洁。当你的聊天机器人还只能行走和奔跑时，NLP\
  \ 能赋予它飞翔的翅膀。  \n对普通人来说，聊天机器人不过是一种与另一端智能机器交流的方式。这种机器可以是基于语音的，也可以是基于文本的，用户会用自己的语言提供输入，在计算机科学中，这种语言通常被称为自然语言。\
  \  \n我们知道，并没有什么黑箱能凭空施展魔法，让一切完美运行。大家应该明白，AI 中并没有什么“人工”的智能；实际上，幕后运行的是由杰出人士编写的机器学习和深度学习算法。机器尚未达到能像人类一样思考并拥有自身智能的阶段。如今的\
  \ AI 系统——它们的行为和表现方式——都是我们如何训练它们的结果。  \n因此，为了理解用户的自然语言（无论是什么语言，也无论输入形式是文本、语音还是图像等），我们必须编写算法并运用\
  \ NLP 技术。NLP 被视为聊天机器人的大脑，它处理原始数据，进行数据清洗和整理，然后准备采取适当的行动。  \nNLP 本身是一个庞大的主题，需要时间和毅力才能完全掌握，但作为聊天机器人开发者，有一些方法是必须了解的，我们将在本章中学习这些方法。\
  \  \n\n### 什么是 spaCy？\n\nspaCy 是一个用于高级 NLP 的开源软件库，由 Matthew Honnibal 用 Python 和\
  \ Cython 编写。它提供了直观的 API，用于访问由深度学习模型训练出的方法。  \nspaCy 提供了世界上最快的句法解析器。直接引用 spaCy 的文档，他们有一些令人惊叹的基准测试结果，如下所示。\
  \  \n\n#### spaCy 的基准测试结果\n\n2015 年的两篇同行评审论文证实，spaCy 提供了世界上最快的句法解析器，并且其准确率与最佳可用方案相差不到\
  \ 1%。  \n少数更准确的系统速度则慢了 20 倍甚至更多。让我们看看图 2-1，它展示了 spaCy 与其他库在速度和准确率方面的基准测试结果。  \n\n\
  ![](img/image-u7ymy8ji.png)  \n\n**图 2-1. spaCy 基准测试结果**  \n\nspaCy 还为多种语言提供了统计神经网络模型，例如英语、德语、西班牙语、葡萄牙语、法语、意大利语、荷兰语以及多语言命名实体识别（NER）。它还为其他多种语言提供了分词功能。此表显示了由\
  \ Choi 等人进行的速度基准测试，因此将 spaCy v2.x 在不同硬件上的基准测试结果进行对比并不公平。这就是为什么你看不到 spaCy v2.x 的速度列数值。\
  \  \n\n### spaCy 提供了什么？\n\nspaCy 声称主要提供三项功能，并且在这些方面极具帮助。让我们来看看这些功能，并理解为什么人们应该将 spaCy\
  \ 作为进行 NLP 的首选模块。  \n\n#### 世界上最快的库\n\nspaCy 在提取大规模信息方面表现极为出色。它借助 Cython 库，从零开始编写，对内存管理极为谨慎。\
  \  \n\n#### 完成任务\n\nspaCy 的设计理念是“完成任务”。它帮助我们实现真实的 NLP 场景。清晰的文档为开发者和计算语言学爱好者节省了大量时间，并提高了他们的工作效率。它安装起来就像其他\
  \ Python 包一样简单。  \n\n#### 深度学习\n\nspaCy 是开源社区中可用于处理深度学习算法文本的最佳库之一。它与 TensorFlow、PyTorch、scikit-learn、Gensim\
  \ 以及 Python 的其他相关技术无缝协作。深度学习开发者可以轻松地为一系列 NLP/NLU 问题构建语言上复杂的统计模型。  \n\n### spaCy\
  \ 的特性\n\n没有其他 NLP 库能像 spaCy 一样提供极其广泛的 API 来完成几乎所有任务。这个库最棒的地方在于它持续进化，变得越来越好。让我们先睹为快，看看\
  \ spaCy 官方网站上列出的特性：  \n\n- 非破坏性分词  \n- 命名实体识别  \n- 支持 28 种以上语言  \n- 针对 8 种语言的 13\
  \ 个统计模型  \n- 预训练词向量  \n- 易于集成的深度学习  \n- 词性标注  \n- 带标签的依存句法分析  \n- 基于句法的句子分割  \n\
  - 用于句法和 NER 的内置可视化工具  \n- 便捷的字符串到哈希映射  \n- 导出为 numpy 数据数组  \n- 高效的二进制序列化  \n- 简便的模型打包与部署\
  \  \n- 最先进的速度  \n- 稳健、经过严格评估的准确率  \n\n现在，让我们深入探索这个用于 Python NLP 的出色模块：spaCy。  \n\
