  ## 门控循环单元


  RNN 和 LSTM 在过去十年中变得非常流行，这推动了更多序列建模架构的普及。其中一种架构是由 Cho 等人在 2014 年提出的门控循环单元（GRU）。GRU
  的结构如图 15-13 所示。


  ![](img/516449_1_En_15_Fig13_HTML.jpg)


  图 15-13


  门控循环单元的结构


  GRU 引入了更新门（Update Gate）来决定应添加或丢弃哪些新信息，以及重置门（Reset Gate）来丢弃部分过去的信息。这些机制与 LSTM 类似，但缺少输出门，且使用的参数更少，因此训练速度相对更快。它们在音乐建模、语音建模和自然语言处理（NLP）中非常流行。PyTorch
  在 `nn.GRU()` 中提供了 GRU 的实现。


