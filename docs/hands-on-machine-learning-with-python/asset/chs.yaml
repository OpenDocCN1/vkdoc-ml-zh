  结果将如图 11-9 所示。我们希望改变图像的色彩空间，并将其转换为 K-means 可以处理的形状。我们将使用 `cv2.cvtColor()` 来转换图像，然后进行重塑。


  ![](img/516449_1_En_11_Fig9_HTML.jpg)


  图 11-9


  使用 `imshow()` 在 Python 中显示的图像


  ```

  image = cv2.cvtColor(original_image, cv2.COLOR_BGR2RGB)

  pixel_values = image.reshape((-1, 3))

  pixel_values = np.float32(pixel_values)

  ```


  OpenCV 提供了其 K-means 实现，该实现需要将图像像素作为样本、簇的数量以及指定算法何时停止的终止条件。


  ```

  criteria = (cv2.TERM_CRITERIA_EPS + cv2.TERM_CRITERIA_MAX_ITER, 100, 0.2)

  ```


  现在，我们可以使用 `cv2.kmeans()` 生成簇。我们建议你更改 K 的值，并观察输出如何变化。


  ```

  K=5

  _, labels, (centers) = cv2.kmeans(pixel_values, K, None, criteria, 10, cv2.KMEANS_RANDOM_CENTERS)

  ```


  这将为图片中的每个像素分配一个簇（共五个）。`centers` 将是一个包含五行三列的数组，代表每个簇的平均颜色。`labels` 包含簇标签（一个从 0 到
  5 的数字），代表图像中每个像素被分配到的簇。


  我们将进行一些小的修改，以便将簇中心值转换为可以表示为 RGB 颜色的整数。


  ```

  centers = np.uint8(centers)

  labels = labels.flatten()

  ```


  现在，我们可以绘制分割后的图像。


  ```

  segmented_image = centers[labels.flatten()]

  segmented_image = segmented_image.reshape(image.shape)

  plt.figure(figsize=(10,10))

  plt.imshow(segmented_image)

  plt.show()

  ```


