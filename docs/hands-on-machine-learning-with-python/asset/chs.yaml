  ![](img/516449_1_En_7_Fig7_HTML.jpg)


  图 7-7


  显示在鸢尾花数据集上训练后生成的决策树


  树的每个内部节点显示一个关于某个参数的条件，基于该条件，我们遍历右子树或左子树。叶节点包含一个包含三个元素的值对象。这显示了最终到达该叶节点的训练样本中，每个类别各有多少个。例如，最左边的叶节点包含
  value = [0,36,0]，这意味着 36 个训练样本属于 Iris Versicolor，没有样本属于 Iris Setosa 或 Iris Virginica。因此，如果在预测过程中有任何样本最终到达此叶节点，它将被预测为多数类，此处是
  Versicolor。


  决策树既可用于分类，也可用于回归。如果你想构建一个回归树，你可以使用 `sklearn.tree.DecisionTreeRegressor`，并将 `y_train`
  准备为连续值的数组（或序列），而不是类别标签。


