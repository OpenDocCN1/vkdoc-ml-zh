- '# 3. 数据可视化入门


  我们在上一章学习了 NumPy 的基础知识。本章将重点学习 NumPy 库的更多函数。我们还将学习用于数据可视化的 Matplotlib 库的基础知识。与上一章一样，本章也将包含大量的动手编程练习。本章涵盖以下主题：


