  \n## 总结\n\n在本章中，我们获得了人工智能和机器学习的宏观图景，探索了机器学习开发流程，并理解了 Scikit-learn API 的基础知识。下一节的其他章节将详细讨论机器学习算法，并探讨如何调整工具以获得最佳结果的见解。我们将从下一章开始，讨论在开始训练过程之前，如何处理各种格式的数据。\n\
