  在本章中，我们学习了回归和分类方法，即线性回归、逻辑回归和决策树。这些是你可以用来创建预测系统的一些基本监督学习方法。我们将深入探讨这些方法，并发现各种更全面地评估这些模型并对其进行调优的方法，以获得最佳可能的结果。


