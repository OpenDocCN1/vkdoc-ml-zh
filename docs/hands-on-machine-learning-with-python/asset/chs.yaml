  ![](img/516449_1_En_11_Fig4_HTML.jpg)


  图 11-4


  沿两个主成分表示的鸢尾花数据集


  大规模数据集在各个学科中越来越普遍。为了解释这些数据集，我们需要降低维度，以保留最相关的数据。我们可以使用 PCA 来减少变量数量，避免多重共线性，或者避免相对于观测数量而言预测变量过多的问题。


  特征降维是机器学习中一个关键的预处理步骤。因此，PCA 是预处理的重要步骤，对于数据压缩和去噪非常有用。它通过寻找一组比原始变量集更小的新变量来降低数据集的维度。


  ## 聚类


  聚类是一套简单但非常高效的无监督学习方法，有助于将数据分组到有意义的组中，从而揭示潜在的规律。想象一下，你所在组织的人力资源总监要求你将所有员工分成五组——这样公司领导层就可以决定每个组的员工应该报名参加哪些培训项目。在这类问题中，你希望创建这样的分组，使得
  (1) 同一组中的所有员工彼此之间大致相似，并且 (2) 不同组的员工彼此之间应有显著差异。这种需要将数据分成不同片段的问题，就称为聚类。


  在这个问题中，我们没有预定义的员工类别。我们没有一个标签让算法学习如何找到映射关系，就像我们在几种分类算法中看到的那样。在这里，算法学习的是基于距离度量来划分数据。


  在接下来的小节中，我们将首先学习一种非常流行的聚类方法，并查看其在 Python 中的实现。我们还将讨论聚类作为利用图像处理或计算机视觉的人工智能应用中的一个步骤的另一种应用。然后，我们将研究另一种能够检测任意形状聚类的聚类方法。


  ### 使用 K-Means 进行聚类


  K-means 是一种基于质心的聚类划分方法。K-means 旨在创建 k 个聚类并将数据点分配其中，使得簇内相似度高，簇间相似度低。该算法基于最小化惯性（即簇内平方和）的概念。惯性由下式给出：


  ![$$ \sum \limits_{i=0}^n\underset{\mu_j\in C}{\min}\left({\left\Vert {x}_i-{\mu}_j\right\Vert}²\right)
  $$](img/516449_1_En_11_Chapter_TeX_Equc.png)


  该算法首先选择 K 个随机点，这些点在此将被称为最终聚类的质心。然后，算法进入多次迭代来优化聚类。


  在每次迭代中，对于每个数据点，算法通过计算该点与所有质心的距离来找到最近的质心，并将其分配到该聚类。一旦所有点都被分配到聚类中，就会通过计算所有点（在所有维度上）的平均值来得到一个新的质心。这个过程会一直持续，直到聚类中心或聚类分配不再发生变化，或者达到固定的迭代次数。


  该算法从随机初始化的聚类中心开始。因此，并不总能保证良好的收敛性。在实践中，一个好的做法是使用随机初始化的聚类中心多次重复聚类算法，并对最终的聚类分布进行采样。




  ### Python 中的 K-Means 算法


  Scikit-learn 提供了 K-means 算法的高效实现。


  默认情况下，初始聚类中心的选择基于一种称为 **k-means++** 的算法。该算法首先在数据点中均匀随机选择一个聚类中心。然后迭代计算所有点与中心之间的距离。下一个聚类中心的选择基于加权概率分布，其中某个点被选中的概率与其到最近中心的平方距离分布成正比。重复此过程，直到选出
  k 个点。这种方法通常能显著提升 k-means 算法的最终性能。当然，你也可以直接提供 k 个中心点。


  让我们生成一个包含某种聚类形状的合成数据集。Scikit-learn 在 `sklearn.datasets` 中提供了此类函数。图 11-5 展示了一个散点图，其中包含清晰可辨的数据聚类。


  ![](img/516449_1_En_11_Fig5_HTML.jpg)


  图 11-5


  随机生成的聚类数据


  ```

  from sklearn.datasets import make_blobs

  X, y = make_blobs(n_samples=500, centers=5, n_features=2, random_state=2)

  plt.scatter(X[:,0], X[:,1], edgecolor=''k'')

  ```


  要执行 K-means 聚类，我们需要从 sklearn.clustering 中导入 KMeans。其用法与 sklearn 中用于监督学习的标准函数类似。


  ```

  from sklearn.cluster import KMeans

  kmeans = KMeans(n_clusters=5)

  kmeans.fit(X)

  ```


  这里，最后一行代码指示算法根据提供的数据学习聚类。要找到每个点的聚类标签，我们可以使用 predict 方法。


  ```

  y = kmeans.predict(X)

  ```


  或者，你也可以使用以下一行代码同时完成拟合和预测：


  ```

  y = kmeans.fit_predict(X)

  ```


  y 将是一个一维数组，包含从 0 到 4 的数字，每个数字代表由此生成的五个聚类之一。你可以使用以下代码获取聚类中心：


  ```

  kmeans.cluster_centers_

  >> array([[-3.99782236, -4.6960255 ],

  [-5.92952036,  2.24987809],

  [ 1.08160065, -1.26589927],

  [-1.28478773, -9.3769836 ],

  [-1.48976417, -3.56531061]])

  ```


  由于数据是二维的，因此有五个二维聚类中心。数据点根据距离它们最近的聚类中心进行分配。


  让我们看看生成的聚类。我们将为生成的 500 个点创建一个散点图，并根据它们所属的聚类分配颜色。我们还将使用不同的颜色（黑色）和标记来绘制聚类中心。


  ```

  plt.scatter(X[:,0], X[:,1], c=y)

  plt.scatter(kmeans.cluster_centers_[:,0], kmeans.cluster_centers_[:,1], c=''black'',
  marker=''+'')

  ```


  ![](img/516449_1_En_11_Fig6_HTML.jpg)


  图 11-6


  K-means 生成的五个聚类


  如图 11-6 所示，中间的团块根据此聚类模型被分成了三部分。然而，凭直觉可以看出，这些部分并非清晰可分，因此应该只有一个更大的聚类来合并这三部分。让我们看看如果只生成三个聚类，会形成什么样的聚类。


