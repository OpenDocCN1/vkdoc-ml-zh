  ## 频繁模式挖掘


  频繁模式挖掘（FP mining）是一个非常流行的问题，在零售和电子商务领域有广泛应用。FP mining 试图基于数据集中同时出现的项目组合，发现数据中重复出现的（频繁）模式。如果你有来自零售店或超市的交易数据集，你可以找到通常一起购买的商品的模式，例如牛奶和面包。每笔交易可能包含一个或多个购买的商品。FP
  mining 算法为我们提供了一种方法，来查找属于同一交易的最常重复出现的商品组合。




  ### 市场购物篮分析


  在此背景下，一个常用术语是**市场购物篮分析**。这是一个发现通常被一起购买的物品的过程。在零售管理领域，其应用可以帮助决策者确定产品应放置的位置。经常一起购买的物品可以彼此靠近放置，而在某些刻意设计的情况下，也可以彼此远离，这样顾客就不得不穿过其他货架，这可能会促使他们购买超出原本需求的商品。


  市场购物篮分析也用于向上销售或交叉销售。这有助于根据顾客过去的购买行为，通过向顾客提供超出其购买意愿的商品来识别零售机会。


  此类算法基于寻找关联规则来运作，即经常一起购买的物品集合，并附带一个表示支持度的数字和一个表示规则置信度的水平。


  ```

  洗发水 => 护发素 [支持度 = 2%, 置信度 = 60%]

  ```


  支持度为 2% 意味着在所有交易中，有 2% 的交易显示洗发水和护发素被一起购买。置信度为 60% 意味着购买洗发水的顾客中有 60% 也购买了护发素。


  如果关联规则同时满足最小支持度阈值和最小置信度阈值，则被认为是有趣的。这些阈值由领域专家设定，或通过一系列对结果进行仔细分析的迭代过程来确定。


  Apriori 算法是一种迭代算法，它逐步构建一个项集列表。它的核心思想是：频繁项集的所有子集也必须是频繁的。这被称为**先验性质**。这意味着，如果存在一个不太频繁的项集，例如
  [洗发水, 蟑螂喷雾]，它不满足支持度阈值。如果向该项集中添加一个物品，得到 [洗发水, 蟑螂喷雾, 面包]，它出现的频率并不会比之前的项集更高。


  Apriori 算法首先确定事务数据库中项集的支持度。所有支持度值高于最小或选定支持度值的事务都会被考虑。接着，寻找所有子集中置信度值高于阈值或最小置信度的规则。


  Apriori 算法的计算成本很高。在大多数实际案例中，库存可能包含数千种（或更多数量级）商品。另一个常见问题是，当为了检测某些关联而降低支持度阈值时，也会增加无意义关联的数量。


  另一种名为 **FP-growth** 的算法在大多数用于挖掘频繁项集的软件包中都有实现。它首先将表示频繁项的数据库压缩成一种树状结构，该结构保留了项集的关联信息。然后，它将压缩后的数据集划分为一组条件数据库，每个数据库与一个频繁项相关联。随后，这些数据库被分别挖掘。对于较大的数据集，FP-growth
  算法比 Apriori 算法快得多。


  ### Python 中的频繁模式挖掘


  Mlxtend（机器学习扩展）是一个 Python 库，它为 Python 的科学计算栈添加了额外的工具和扩展。对于本实验，你需要使用 `pip install`
  来安装 mlxtend。


  ```

  %pip install mlxtend

  import pandas as pd

  import numpy as np

  import mlxtend

  ```


  我们创建了一个 CSV 文件，其中包含每笔交易中购买的物品。


  ```

  0,1,2,3,4,5,6

  Bread,Wine,Eggs,Meat,Cheese,Butter,Diaper

  Bread,Cheese,Meat,Diaper,Wine,Milk,Butter

  Cheese,Meat,Eggs,Milk,Wine,,

  Cheese,Meat,Eggs,Milk,Wine,,

  ```


  我们在此代码中使用的数据集包含大约 315 笔交易，每行一笔交易。我们可以加载 CSV 文件并识别所有交易中存在的唯一物品。


  ```

  df = pd.read_csv("fpdata.csv")

  items = set()

  for i in df:

  items.update(df[''''+str(i)+''''].unique())

  items.remove(np.nan)

  import mlxtend

  from mlxtend.frequent_patterns import apriori, association_rules

  ```


  现在，我们将按照前几章介绍的方法，将数据集转换为独热编码形式。这里提供一种替代方法来完成同样的操作。编码后的数据框将类似于图 11-15 中所示的截图。


  ```

  item_list = sorted(items)

  encoded_vals = []

  i=0

  for index, row in df.iterrows():

  labels = dict()

  uncommons = list(items - set(row))

  commons = set(row).intersection(items)

  for item in commons:

  labels[item] = 1

  for item in uncommons:

  labels[item] = 0

  encoded_vals.append(labels)

  one_hot_encoded_dataframe = pd.DataFrame(encoded_vals)

  one_hot_encoded_dataframe

  ```


  ![](img/516449_1_En_11_Fig15_HTML.jpg)


  图 11-15


  Apriori 算法实现所期望的独热编码数据框


  `mlxtend.frequent_patterns` 中的 Apriori 算法和关联规则实现期望这种格式。我们可以生成一个列表


  ```

  from mlxtend.frequent_patterns import apriori, association_rules

  freq_items = apriori(one_hot_encoded_dataframe, min_support = 0.2, use_colnames=True)

  freq_items[''sup_count''] = freq_items[''support'']*315

  freq_items

  ```


  这将打印出所有找到的、在数据集中具有至少 20% 最小支持度的项集列表。截断后的截图如图 11-16 所示。结果从单一项集开始，这些项集意义不大，因为它们只是这些物品在数据集中的出现频率。然而，在第
  9 行之后，你可以看到两个项集，它们展示了有趣的购买模式，比如面包和奶酪。后面的行显示了三个更有意义的项集。你可以调整 `min_support` 参数来查看更多项集。


  ![](img/516449_1_En_11_Fig16_HTML.jpg)


  图 11-16


  Apriori 算法检测到的频繁项集及其支持度计数


  我们还可以打印关联规则列表及其相关的置信度分数。


  ```

  rules = association_rules(freq_items, metric="confidence", min_threshold=0.5)

  rules

  ```


  这将显示有趣的规则，如图 11-17 所示。


  ![](img/516449_1_En_11_Fig17_HTML.jpg)


