  from sklearn.metrics import mean_squared_error, mean_absolute_errorprint(mean_squared_error(results_table[''Actual
  Salary''], results_table[''Predicted Salary'']))

  print(math.sqrt(mean_squared_error(results_table[''Actual Salary''], results_table[''Predicted
  Salary''])))

  print(mean_absolute_error(results_table[''Actual Salary''], results_table[''Predicted
  Salary'']))

  ```


  Scikit-learn 还提供了 R 平方值，用于衡量模型能够解释因变量中多少变异性。R 平方是衡量线性回归拟合优度的常用指标。从数学上讲，它等于 1 减去预测误差的平方和除以总平方和。其值通常在
  0 到 1 之间，其中 1 代表理论上最佳模型。


  ```

  from sklearn.metrics import r2_score

  print ("R Squared: %.2f" % r2_score(y, reg.predict(X)))

  ```


  输出结果为：


  ```

  R Squared: 0.75

