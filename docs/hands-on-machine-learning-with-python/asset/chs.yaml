  ## CNN 的深度网络


  CNN 最初于 20 世纪 90 年代中期被提出，但由于当时计算基础设施的技术水平有限，其应用范围受到限制。在过去十年中，CNN 通过包含多个卷积层的深度网络，在复杂分类数据集上表现出高性能，从而再次受到关注。


  其中，Alex Krizhevsky 的网络（称为 AlexNet）被认为是最受欢迎且最具影响力的论文之一，它为计算机视觉指明了未来方向。该网络用于对 ImageNet
  进行分类，ImageNet 是一个包含数千个类别图像的大型数据库。图 14-19 展示了 AlexNet 的结构，该图发表于原始论文中。


  ![](img/516449_1_En_14_Fig19_HTML.jpg)


  图 14-19


  AlexNet 示意图


  AlexNet 包含高度优化的二维卷积 GPU 实现，该实现用于五个卷积层，随后是最大池化层和一个密集网络。输出层是一个 100 单元的层，用于生成在 1000
  个类别标签上的分布。他们利用了 Hinton 等人近期推广的 dropout 层，其概率为 0.5，以克服过拟合。这种 dropout 被认为可以迫使神经元不依赖特定其他神经元的存在，从而学习更鲁棒的特征。


  ## 总结


  在本章中，我们学习了一种高度专业化的神经网络架构，称为卷积神经网络（CNN），并将其应用于图像分类示例。在下一章中，我们将研究另一种架构，该架构由于实现了保持状态的内存，因此对文本和语音等序列数据非常有效。这些循环神经网络（RNN）根据其应用场景的不同而有不同类型。


