  ![](img/516449_1_En_14_Fig6_HTML.jpg)


  图 14-6


  用于检测图像中模式的滤波器


  在彩色图像中，每幅图像都是一个 3 x r x h 的三维数组，其中 r 是行数，h 是以像素为单位的图像高度。有三个大小为 r x h 的矩阵通道，分别代表图像的红色、绿色和蓝色通道。对于这种情况，内核也必须是三通道内核。因此，如果我们有一个二维的
  3x3 内核，现在我们将有一个大小为 3x3x3 的内核，其中我们将内核的各个层应用于图像的每个通道。


