  引言


  我们长期以来一直计划合作撰写一本关于机器学习的书。自从大约十年前我们开始学习这些主题以来，这个领域已经极大地发展和扩展。我们意识到，作为终身学习者，在任何领域的初始几步都需要一个更清晰的来源来明确指明道路。这还需要一套简洁的解释，以及偶尔通过阅读、学习和运用所学知识来扩展学习体验的想法。我们在学术生涯和软件开发、数据科学及机器学习的职业生涯中长期使用
  Python。通过这本书，我们非常谦逊地尝试为绝对初学者编写一本关于机器学习主题的逐步指南。本书的每一章都包含所用概念的讲解、代码示例、代码示例的说明以及输出的截图。


  第一章涵盖了在不同平台上搭建 Python 环境。第二章涵盖了 NumPy 和 Ndarrays。第三章探讨了使用 Matplotlib 进行可视化。第四章向我们介绍了
  Pandas 数据科学库。所有这些初始章节都构建了编程和基本数据处理的基础，这是学习机器学习的先决条件之一。


  下一节讨论传统的机器学习方法。在第五章中，我们从机器学习领域的鸟瞰视角开始，接着安装 Scikit-learn，并提供一个使用 Scikit-learn 的简短快速的机器学习解决方案示例。第六章详细阐述了帮助你理解和将结构化、文本及图像数据转换为机器学习库可接受格式的方法。在第七章中，我们介绍监督学习方法，从用于回归问题的线性回归和用于分类问题的逻辑回归与决策树开始。在每个实验中，我们还展示了如何使用决策边界图绘制算法已学到的可视化结果。第八章深入探讨了机器学习模型的进一步微调。我们解释了一些衡量模型性能的想法、过拟合和欠拟合的问题，以及处理这些问题和提升模型性能的方法。第九章继续讨论监督学习方法，特别关注朴素贝叶斯和支持向量机。第十章解释了集成学习方法，这些解决方案结合多个更简单的模型以产生比它们单独提供更好的性能。在第十一章中，我们讨论无监督学习方法，特别关注降维、聚类和频繁模式挖掘方法。每个部分都包含一个使用
  Scikit-learn 实现所讨论方法的完整示例。


  最后一节从第十二章介绍神经网络和深度学习的基本概念开始。我们介绍了一个非常流行的开源机器学习框架 PyTorch，它将在后续章节的示例中使用。第十三章从人工神经网络的解释开始，深入讨论了前馈和反向传播的理论基础，接着简要讨论了损失函数并给出了一个简单神经网络的示例。在下半部分，我们解释了如何创建一个能够识别手写数字的多层神经网络。在第十四章中，我们讨论了卷积神经网络，并通过一个图像分类的示例进行实践。第十五章讨论了循环神经网络，并引导你完成一个序列建模问题。在最后的第十六章中，我们讨论了规划、管理和工程化机器学习及数据科学项目的策略。我们还讨论了一个使用深度学习进行情感分析的简短端到端示例。


  如果你是这个主题的新手，我们强烈建议你按顺序阅读各章，因为概念是层层递进的。请跟随所有代码部分，并随意修改和调整代码结构、数据集和超参数。如果你已经了解某些主题，可以随意跳到你感兴趣的主题，并仔细阅读相关章节。祝你学习愉快。


