- '# 13. 前馈神经网络


  人工神经网络（ANN）是受大脑神经元启发而构建的相互连接的计算单元集合，由此创建的程序能够学习结构化、文本、语音或视觉数据中的模式。人工神经网络中的基本计算单元被认为类似于（或者更确切地说，受启发于）一种神经细胞，它从多个来源接收输入信号，对其进行运算，并根据给定条件激活，然后将信号传递给与其相连的其他神经元。图
  13-1 展示了生物神经元与人工神经元之间的象征性联系。


  ![](img/516449_1_En_13_Fig1_HTML.jpg)


  **图 13-1**


  生物神经元与人工神经元的比较


  正如神经元聚集在一起形成大脑的各个部分，共同负责识别某些模式或执行某个动作一样，人工神经网络也由大量这样的单元组成。正如我们在前一章中看到的，神经元或计算单元组合来自多个来源的信号，应用一个激活函数，并将处理后的信号传递给与其相连的其他神经元。在实际应用中，可能存在数十到数百万个神经元，它们可以被训练，根据训练数据中的输入和期望输出值来运行和激活。


  在本章中，我们将研究神经网络，其中计算单元的层彼此连接，直到一个输出层。在这些网络中，输入信号在每一层被运算并前馈，而训练过程则比较输出并回溯所需的更改，以开发出更好的神经网络。


  本章涵盖的概念构成了更先进的深度神经网络架构的基础。我们将讨论通过一个称为反向传播的过程来训练神经网络，该过程基于梯度下降。我们将使用 PyTorch 为回归和分类问题创建神经网络。


  ## 前馈神经网络


  前馈神经网络是人工神经网络的一种简单形式，其中计算单元将值逐步向输出端传递，并以一种高效的方式组合它们，从而得到改进的结果。前馈神经网络中的计算单元将信息向前传播（没有循环或反向链接），经过隐藏节点，然后到达输出节点。图
  13-2 展示了一个简单的前馈神经网络示例。


  ![](img/516449_1_En_13_Fig2_HTML.jpg)


  **图 13-2**


  一个简单的前馈神经网络


  ### 训练神经网络


  反向传播是训练神经网络的过程。反向传播大致基于自 20 世纪 60 年代以来一直在使用的技术，尽管它在 1986 年由 Rumelhart、Hinton 和 Williams
  明确定义，随后在 1987 年由 Yann LeCun 进行了研究。在此期间，神经网络领域出现了几项有前景的工作，它们构成了当今深度学习领域的基础，尽管由于当时有限的计算基础设施，它们未能引起公众的广泛关注。后来，大约在
  2010 年代，计算机处理器和图形处理器（GPU）的成本急剧下降，从而促进了已有数十年历史的模型的改进和新颖神经网络架构的创建，进而推动了它们在语音识别、计算机视觉和自然语言处理中的应用。


  #### 梯度下降


  神经网络的训练需要一个称为**梯度下降**的过程，这是一种用于寻找损失函数或成本函数最小值（或最大值）的迭代算法。想象一个回归问题（类似于我们在第 7 章中看到的），其中基于一个连续输入变量来确定一个连续输出变量。在大多数实际情况下，预测输出（如图
  13-3 中的线所示）不会与实际（期望）输出完全相同。这种差异称为误差或残差，学习算法的目标是最小化总残差或残差的某种其他聚合。


  ![](img/516449_1_En_13_Fig3_HTML.jpg)


  **图 13-3**


  回归模型中的误差


  学习过程倾向于学习一条直线的方程参数，形式为 *y* = *w*[0] + *w*[1]*x*[1] + *w*[2]*x*[2] + ⋯。为了简化我们的示例，我们将只关注一个变量，因此得到
  *y* = *w*[0] + *w*[1]*x*[1]。解决此类问题的方法之一是梯度下降。在这个例子中，我们定义一个优化函数，这里是一个成本函数，它显示了模型的结果与训练数据中实际值的差距。在线性回归中，我们可以使用均方误差，即模型预测值与实际值之差的平方的平均值。


  ![$$ J=\frac{1}{n}\sum \limits_{i=1}^n{\left({pred}_i-{y}_i\right)}² $$](img/516449_1_En_13_Chapter_TeX_Equa.png)


  梯度下降背后的思想是，训练良好的模型应该是成本函数最小化的模型。每一组可能的斜率（w[0], w[1],…）都会产生一个不同的模型。图 13-4 显示了成本相对于某个斜率（例如
  w[1]）的变化。


  ![](img/516449_1_En_13_Fig4_HTML.jpg)


  **图 13-4**


  梯度下降算法旨在找到使成本最小化的参数


  我们的目标是找到一个能产生最小成本的斜率。你可以在图中看到曲线最低点对应的点。梯度下降算法从一个随机初始化的值开始，并根据该点处成本相对于斜率的偏导数所给出的斜率，算法会进行如下更改：


  ![$$ \frac{\partial (cost)}{\partial m}=\frac{1}{n}\frac{\partial }{\partial m}{\left({pred}_i-{y}_i\right)}²
  $$](img/516449_1_En_13_Chapter_TeX_Equb.png)


  这可以简化为：


  ![$$ \frac{\partial (cost)}{\partial m}=\frac{-2}{n}x\left({pred}_i-{y}_i\right)
  $$](img/516449_1_En_13_Chapter_TeX_Equc.png)


  这表示 *m* 值的更新，理想情况下应导向一个成本较低的模型。这个过程是反向传播算法的基础，通过正确选择损失函数，我们可以训练神经网络来解决更复杂的问题。


  如果我们将这个想法转化为神经网络的术语，梯度下降为我们提供了一种方法来更新单层神经网络的权重，就像我们在前一章中看到的那样。




  #### 反向传播


  在多层级网络中，此方法可直接应用于最终层，我们可以在该层找到实际值（或目标值）与预测值之间的差异；然而，这无法应用于隐藏层，因为我们没有任何目标值可供比较。为了持续更新神经网络中所有单个细胞的权重，我们计算最终层的误差，并将该误差从最后一层反向传播到第一层。这个过程被称为反向传播。


  让我们考虑一个简化的神经网络，它包含一个隐藏层，如图 13-5 所示。我们只有三个节点：第一个代表输入，第二个是隐藏层，它根据权重 w[1] 和偏置 b[1]
  对输入执行计算，第三个是输出层，它也根据权重 w[2] 和偏置 b[2] 对隐藏层的输出执行计算。


  ![](img/516449_1_En_13_Fig5_HTML.jpg)


  图 13-5

  含一个隐藏层的简化神经网络


  这里，第一个节点接收输入并将其转发给第二个节点，即隐藏层。隐藏层将权重 w[1] 应用于输入并加上偏置 b[1]，从而产生 w[1]x[k]+b[1]，然后对其应用激活函数
  *f*。因此，隐藏层的输出是 *f*(w[1]x[k]+b[1])。


  隐藏层的输出被转发作为第三个单元的输入。这将乘以 w[2] 并加上偏置 b[2]。因此，第三个单元的输入是 w[2] *f*(w[1]x[k]+b[1]) +
  b[2]。


  当对其应用激活函数 *g* 时，它产生输出 *g*(w[2] *f*(w[1]x[k]+b[1]) + b[2])，这就是预测输出，在图 13-5 中也表示为
  ŷ[k]。


  这个前向传播过程在训练阶段的每次迭代中都会发生。一旦我们知道训练数据集中所有项的预测值，我们就可以找到损失函数或代价函数。为了解释这一点，我们继续使用上一节定义的相同损失函数。


  ![$$ J=\frac{1}{n}\sum \limits_{\mathrm{k}=1}^n{\left({\hat{\mathrm{y}}}_k-{y}_k\right)}²,
  $$](img/516449_1_En_13_Chapter_TeX_Equ1.png)


  （其中）


  ![$$ {\hat{\mathrm{y}}}_k=g\left(\ {w}_2\ f\left({w}_1{x}_k+{b}_1\right)+{b}_2\right)
  $$](img/516449_1_En_13_Chapter_TeX_Equd.png)


  我们知道，可以计算损失函数关于 w[1] 的导数来更新 w[1]，以便在下一次迭代中减少整体损失。


  ![$$ \frac{\partial (J)}{\partial {w}_1}=\frac{1}{n}\sum \limits_{k=1}^n2\left({\hat{\mathrm{y}}}_k-{y}_k\right)\frac{\partial
  {\hat{\mathrm{y}}}_k}{\partial {w}_1} $$](img/516449_1_En_13_Chapter_TeX_Eque.png)


  这引出了另一个量，使用链式法则求解如下：


  ![$$ \frac{\partial {\hat{\mathrm{y}}}_k}{\partial {w}_1}={g}^{\prime}\left(\ {w}_2\
  f\left({w}_1{x}_k+{b}_1\right)+{b}_2\right)\ \left\{{w}_2{f}^{\prime}\left({w}_1{x}_k+{b}_1\right)\
  \left({x}_k\right)\right\} $$](img/516449_1_En_13_Chapter_TeX_Equf.png)


  或者


  ![$$ \frac{\partial {\hat{\mathrm{y}}}_k}{\partial {w}_1}={w}_2{x}_k{f}^{\prime}\left({w}_1{x}_k+{b}_1\right)\
  {g}^{\prime}\left(\kern0.5em f\left({w}_1{x}_k+{b}_1\right)+{b}_2\right) $$](img/516449_1_En_13_Chapter_TeX_Equg.png)


  我们可以找到关于 w[2] 的偏导数，如下所示：


  ![$$ \frac{\partial (J)}{\partial {w}_2}=\frac{1}{n}\sum \limits_{k=1}^n2\left({\hat{\mathrm{y}}}_k-{y}_k\right)\frac{\partial
  {\hat{\mathrm{y}}}_k}{\partial {w}_2} $$](img/516449_1_En_13_Chapter_TeX_Equh.png)


  ![$$ \frac{\partial {\hat{\mathrm{y}}}_k}{\partial {w}_2}=\left\{f\left({w}_1{x}_k+{b}_1\right)\right\}\
  {g}^{\prime}\left(\ {w}_2\ f\left({w}_1{x}_k+{b}_1\right)+{b}_2\right) $$](img/516449_1_En_13_Chapter_TeX_Equi.png)


  因此，在更复杂的网络中，我们可以继续沿反向方向计算偏导数。我们会注意到，有一些量我们之前已经计算过，例如前面例子中的 *f*(*w*[1]*x*[*k*] +
  *b*[1])。你可以看到，在每次迭代中，中间值和输出值在前向传递过程中被计算出来，随后是从输出层开始，使用梯度下降更新权重的过程，并向后移动直到所有权重都被更新。这被称为反向传播。


  ### 损失函数


  在前面的解释中，我们使用了一个称为均方误差（MSE）的损失函数。由于其性质，这种损失函数适用于输出为连续变量的回归问题。根据手头的问题，你还可以使用其他几种常见的损失函数。


  #### 均方误差（MSE）


  该函数计算实际值与预测值之间误差的平方和的平均值。它会对模型的大误差进行惩罚，而忽略小误差。这也被称为 L2 损失。对于两个值 y 和 ŷ（通常分别是期望输出和预测输出），每个训练样本的误差分量由下式给出：


  ![$$ loss\left(y,\hat{y}\right)={\left(y-\hat{y}\right)}² $$](img/516449_1_En_13_Chapter_TeX_Equj.png)


  #### 平均绝对误差


  不考虑平方，我们可以简单地查看误差的绝对值之和，并在整个数据集上取平均值。这也被称为 L1 损失，并且它对异常值具有鲁棒性。


  ![$$ loss\left(y,\hat{y}\right)=\mid y-\hat{y}\mid $$](img/516449_1_En_13_Chapter_TeX_Equk.png)


  #### 负对数似然损失


  在简单的分类问题中，负对数似然损失是一个高效的选择，它鼓励模型以高概率正确预测，并在模型以较低概率预测正确类别时对其进行惩罚。


  ![$$ loss\left(y,\hat{y}\right)=-\mathit{\log}(y) $$](img/516449_1_En_13_Chapter_TeX_Equl.png)


  #### 交叉熵损失


  这是一个适用于分类问题的函数。它会惩罚模型以高概率产生错误输出。在训练具有 *C* 个类别的分类问题时，它是最常用的损失函数之一。


  ![$$ loss\left(y,\hat{y}\right)=-\sum ylog\ \hat{y} $$](img/516449_1_En_13_Chapter_TeX_Equm.png)


  #### 铰链损失


  在希望学习非线性嵌入的问题中，铰链损失根据输入张量 *x* 和标签张量 *y*（包含 1 或 -1）来衡量损失。这通常用于衡量两个输入是相似还是不相似。


  ![$$ loss\left(x,y\right)=\left\{\begin{array}{c}x, if\ y=1\\ {}\max \left\{0,\Delta
  -x\right\}, if\ y=-1\ \end{array}\right. $$](img/516449_1_En_13_Chapter_TeX_Equn.png)


  关于 PyTorch 中定义的更多损失函数，你可以查阅官方文档。^(¹³)




  ## 用于回归的 ANN


  让我们使用 PyTorch 创建一个用于回归问题的简单神经网络。首先，创建一个包含一个自变量 (X) 和一个因变量 (y) 的简单数据集，其中 X 和 y 之间可能存在近似线性的关系。我们将创建形状为
  [20,1] 的张量，表示 20 个输入值和 20 个输出值。输出图如图 13-6 所示。


  ![](img/516449_1_En_13_Fig6_HTML.jpg)


  图 13-6


  随机生成的回归样本


  ```

  from matplotlib import pyplot

  import torch

  import torch.nn as nn

  x = torch.randn(20,1)

  y = x + torch.randn(20,1)/2

  pyplot.scatter(x,y)

  pyplot.show()

  ```


  数据已准备就绪。该模型是一个简单的顺序模型，它将包含一个输入层，后跟一个激活函数，以及另一个输出层。


  ```

  model = nn.Sequential(

  nn.Linear(1,1),

  nn.ReLU(),

  nn.Linear(1,1)

  )

  ```


  激活函数是应用于加权输入 *f*(*w*[*i*]*x*[*i*]) 的函数 *f*。ReLU，即修正线性单元，是一个简单的函数，对于任何负输入，它输出 0；对于正输入，它输出不变的输入值。我们将在下一节讨论
  ReLU 和其他激活函数。


  因为我们只有一个输入变量，我们期望学习两个权重：w[1] 和 b。为便于实现，我们将 b 称为 w[0]。对于输入线性层和输出线性层，将各有两个权重集，因此总共有四个随机初始化的权重，我们需要在训练过程中学习它们。让我们查看模型参数，以了解将要学习的数量。


  ```

  list(model.parameters())

  Out: [Parameter containing:

  tensor([[-0.7681]], requires_grad=True),

  Parameter containing:

  tensor([0.2275], requires_grad=True),

  Parameter containing:

  tensor([[0.1391]], requires_grad=True),

  Parameter containing:

  tensor([-0.1167], requires_grad=True)]

  ```


  现在，我们可以开始学习权重的过程，该过程使用定义为优化器的方法来最小化损失函数。但是，请记住，PyTorch 要求数据以张量的形式存在。让我们快速 (1) 将数据缩放到
  0`–`1 范围内，并且 (2) 转换为张量。


  ```

  x = (x-x.min())/(x.max()-x.min())

  y = (y-y.min())/(y.max()-y.min())

  ```


  现在，我们需要初始化均方误差 (MSE) 损失函数和一个优化器，该优化器将使用随机梯度下降来更新权重。


  ```

  lossfunction = nn.MSELoss()

  optimizer = torch.optim.SGD(model.parameters(), lr=0.05)

  ```


  在初始化优化器时，我们定义了一个学习率为 0.05。这会影响权重更新的速度（快或慢）。


  学习过程需要多次迭代，分为三个步骤：


  1.  前向传播：使用当前的权重集计算输出。


  2.  损失计算：将输出与实际值进行比较。


  3.  反向传播：使用损失来更新权重。


  这里，我们使用一个 for 循环来迭代 50 个周期。在此过程中，我们还将跟踪损失，以便稍后可视化误差如何随周期变化。


  ```

  loss_history = []

  for epoch in range(50):

  pred = model(x)

  loss = lossfunction(pred, y)

  loss_history.append(loss)

  optimizer.zero_grad()

  loss.backward()

  optimizer.step()

  ```


  经过 50 次迭代后，我们期望损失足够低，以产生不错的结果。让我们通过绘制 `loss_history` 图表来可视化损失的变化。我们必须记住，由 lossfunction()
  产生的损失对象也将包含作为张量的数据，我们需要将其分离，以便 Matplotlib 可以处理它。


  ![](img/516449_1_En_13_Fig7_HTML.jpg)


  图 13-7


  随着模型训练更多周期，损失减少，并在某点后收敛


  ```

  import matplotlib.pyplot as plt

  plt.plot([x.detach() for x in loss_history], ''o-'', markerfacecolor=''w'', linewidth=1)

  plt.plot()

  ```


  从图 13-7 可以明显看出，损失在第十个周期之前迅速下降，之后误差变得非常低，梯度减小，进一步的变化变慢——直到大约第 30 个周期，之后损失保持不变，权重的变化微乎其微。


  ![](img/516449_1_En_13_Fig8_HTML.jpg)


  图 13-8


  简单神经网络预测的实际值和输出


  让我们看看系统产生的结果。由此产生的结果如图 13-8 所示。


  ```

  predictions = model(x)

  plt.plot(x, y, ''rx'', label="实际值")

  plt.plot(x, predictions.detach(), ''bo'', label="预测值")

  plt.legend()

  plt.show()

  ```


  这个过于简单的单层神经网络对于可以使用相当直接的统计解决方案的问题，可能并不总能给出最佳结果。尽管图表显示损失明显减少，但最终的回归线可能不会像你期望的那样紧密拟合。你可以多次定义模型并训练它，以观察由于随机初始化而产生的差异。


  有了这个模型，你现在就可以处理更复杂的神经网络架构了。我们将首先构建一个具有不同激活函数的多层神经网络，并使用我们迄今为止使用的相同数据集来对鸢尾花进行分类。


  ## 激活函数


  神经网络中的每个计算单元接收输入，乘以权重，加上偏置，并在将其转发到下一层之前对其应用激活函数。这成为下一层计算单元的输入。在此示例中，我们使用了修正线性单元
  (ReLU)，对于输入 x，如果 x>0，则返回 x；否则返回 0。因此，如果一个单元的加权计算产生负值，ReLU 会将其设为 0，这将成为下一层的输入。如果输入为零或负数，激活函数的导数为
  0，否则为 1。


  已经定义了许多激活函数。以下是一些你可能经常看到使用的激活函数。


  ### ReLU 激活函数


  修正线性单元是一个简单高效的函数，如果输入为正，则原样输出；对于负输入则不激活；因此，它修正了传入的信号。它在计算上快速、非线性且可微。其定义如下：


  ![$$ ReLU(x)=\max \left(0,x\right) $$](img/516449_1_En_13_Chapter_TeX_Equo.png)


  然而，由于在负输入的情况下，神经元完全不影响输出，其对输出的贡献变为零，因此在反向传播期间无法学习。这通过 ReLU 的一个变体（称为**带泄露的 ReLU**）得到了解决。


  图 13-9 显示了 ReLU 和带泄露的 ReLU 的图形。


  ![$$ LeakyReLU(x)=\mathit{\max}\left(0,x\right)+ negative\_ slope\ast \mathit{\min}\left(0,x\right)
  $$](img/516449_1_En_13_Chapter_TeX_Equp.png)


  ![](img/516449_1_En_13_Fig9_HTML.jpg)


  图 13-9


  ReLU 和带泄露的 ReLU 激活函数


  带泄露的 ReLU 为负信号产生一个相对较小的输出，这可以通过更改 negative_slope 来配置。




  ### Sigmoid 激活函数


  Sigmoid 函数输出介于 0 和 1 之间的值，对于负输入，输出值接近 0；对于正输入，输出值接近 1。当输入为 0 时，输出为 0.5。你可以在图 13-10
  中看到 Sigmoid 激活函数的图像。该函数非常适合分类问题，如果用于输出层，介于 0 和 1 之间的输出值可以解释为概率。


  ![$$ Sigmoid(x)=\frac{1}{1+\mathit{\exp}\left(-x\right)} $$](img/516449_1_En_13_Chapter_TeX_Equq.png)


  ![](img/516449_1_En_13_Fig10_HTML.jpg)


  图 13-10


  Sigmoid 和 tanh 激活函数


  然而，Sigmoid 的计算成本更高。如果输入值过大或过小，可能导致神经网络停止学习。这个问题被称为梯度消失问题。


  ### Tanh 激活函数


  Tanh 函数与 Sigmoid 函数类似，但输出介于 -1 和 1 之间，对于负输入，输出值接近 -1；对于正输入，输出值接近 1。该函数经过原点 (0,0)。Tanh
  函数的图像如图 13-10 所示。你可以看到，虽然这两个函数看起来相似，但 tanh 函数有显著不同。


  ![$$ \mathit{\tanh}(x)=\frac{\mathit{\exp}(x)-\mathit{\exp}\left(-x\right)}{\mathit{\exp}(x)+\mathit{\exp}\left(-x\right)}
  $$](img/516449_1_En_13_Chapter_TeX_Equr.png)


  尽管形状相似，但 tanh 函数的梯度远强于 Sigmoid 函数。它也用于我们希望将负输入作为负输出传递的层。


  如果向 Sigmoid 函数提供一个非常大的负输入，输出值将接近零，因此在反向传播过程中，权重更新会非常缓慢。在这种情况下，Tanh 函数能改善网络的性能。


  ## 多层人工神经网络


  我们可以通过 (1) 在层中添加更多计算单元以及 (2) 添加更多层来使网络稍大一些。我们可以通过修改上一个示例中指定层的方式来调整网络。


  ```

  model = nn.Sequential(

  nn.Linear(1,8),

  nn.ReLU(),

  nn.Linear(8,4),

  nn.Sigmoid(),

  nn.Linear(4,1),

  )

  ```


  这里，我们定义了一个输入层，它接收一个输入并将其转发到具有八个单元的层。随后是 ReLU 激活函数，然后进入具有八个单元的层，该层再转发到具有四个单元的另一个层。接着是
  Sigmoid 激活函数，最后转发到具有一个单元的输出层。


  如果需要，我们可以修改输出层使其包含多个单元。让我们处理一个之前见过的多类分类问题。鸢尾花数据集包含来自三种鸢尾花品种的样本。我们可以在输出层创建三个单元，这些单元将指示一个鸢尾花样本属于三个类别之一的概率。


