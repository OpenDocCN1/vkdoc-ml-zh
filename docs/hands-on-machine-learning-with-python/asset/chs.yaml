  正如我们之前所见，我们需要找到序列的片段。例如，数据来自某个从周日开始的特定周。在文本数据中，n-gram（最常见的是二元组和三元组）非常流行，尽管最近字符片段和字符
  n-gram 也适用于可以使用 RNN/LSTM 解决的问题。


  我们将创建一个函数，该函数接受一个 NumPy 数组和一个定义序列长度的整数，并返回指定序列长度的片段。例如，序列长度为 3 的`[1,2,3,4,5,6]`应创建片段`[1,2,3]`、`[2,3,4]`、`[3,4,5]`和`[4,5,6]`。但是，在这个问题中，我们还需要预测下一个元素；也就是说，`1,2,3`后面应该跟`4`。这些片段会略有不同，如图
  15-10 所示。


  ![](img/516449_1_En_15_Fig10_HTML.jpg)


  **图 15-10**

  用于预测下一个项目的长序列窗口或片段


  以下是其中一种可能的实现方式。


  ```

  def chunkify(data, seq_length):

  chunks = []

  targets = []

  for i in range(len(data)-seq_length-1):

  chunks.append(data[i:(i+seq_length)])

  targets.append(data[i+seq_length])

  return np.array(chunks),np.array(targets)

  ```


  序列中的每个数字都是一个数据元素；因此，你可以将数组重塑为 nx1 的形状。这样，我们就可以继续调用：


  ```

  chunkify([[1],[2],[3],[4],[5],[6]],3)

  Out:

  (array([[[1],

  [2],

  [3]],

  [[2],

  [3],

  [4]]]),

  array([[4],

  [5]]))

  ```


  数据的预处理还需要将数据缩放到合适的值。我们可以使用`MinMaxScaler`。我们将使用 80%的数据作为训练集，并保持序列长度为 5。


  ```

  sc = MinMaxScaler()

  training_data = sc.fit_transform(data.values.copy())

  seq_length = 5

  x, y = chunkify(training_data, seq_length)

  train_size = int(len(y) * 0.8)

  test_size = len(y) - train_size

  ```


  在进一步操作之前，我们需要将数据集转换为张量。我们可以将索引`train_size`之前的片段和目标转换为张量，以便与 PyTorch 网络一起使用。


  ```

  dataX = Variable(torch.Tensor(np.array(x)))

  dataY = Variable(torch.Tensor(np.array(y)))

  trainX = Variable(torch.Tensor(np.array(x[0:train_size])))

  trainY = Variable(torch.Tensor(np.array(y[0:train_size])))

  testX = Variable(torch.Tensor(np.array(x[train_size:len(x)])))

  testY = Variable(torch.Tensor(np.array(y[train_size:len(y)])))

  ```


  在网络中，我们将定义一个 LSTM 层，后跟一个全连接层。在 PyTorch 中，LSTM 在`torch.nn`中定义。它接受诸如输入大小、隐藏状态特征大小和循环层数等参数。如果指定了`num_layers`，模型将堆叠相应数量的
  LSTM，使得第一个 LSTM 的输出提供给第二个 LSTM，依此类推。由于这是一个回归问题，损失函数可以是均方误差，这在回归问题中被广泛使用。


  让我们创建一个模型类。我们需要定义各个层。我们将保持结构简单，包含一个 LSTM 层，后跟全连接输出。在`forward()`方法中，我们将首先创建一个初始化为零的隐藏状态和细胞记忆。LSTM
  的输出将应用于全连接层，并作为输出返回。


  ```

  class CovidPrediction(nn.Module):

  def __init__(self, num_classes, input_size, hidden_size, num_layers):

  super(CovidPrediction, self).__init__()

  self.num_classes = num_classes

  self.num_layers = num_layers

  self.input_size = input_size

  self.hidden_size = hidden_size

  self.seq_length = seq_length

  self.lstm = nn.LSTM(input_size=input_size, hidden_size=hidden_size, num_layers=num_layers,
  batch_first=True)

  self.fully_connected = nn.Linear(hidden_size, num_classes)

  def forward(self, x):

  h0 = Variable(torch.zeros(self.num_layers, x.size(0), self.hidden_size))

  c0 = Variable(torch.zeros(self.num_layers, x.size(0), self.hidden_size))

  ula, (h_out, _) = self.lstm(x, (h0, c0))

  h_out = h_out.view(-1, self.hidden_size)

  out = self.fully_connected(h_out)

  return out

  ```


  我们可以在这里看到模型的结构：


  ```

  model = CovidPrediction(1, 1, 4, 1)

  print(model)

  Out:

  CovidPrediction(

  (lstm): LSTM(1, 4, batch_first=True)

  (fully_connected): Linear(in_features=4, out_features=1, bias=True)

  )

  ```


  这个模型相当简单。让我们定义损失函数和优化器，并运行训练循环。


  ```

  num_epochs = 1000

  learning_rate = 0.01

  model = CovidPrediction(1, 1, 4, 1)

  criterion = torch.nn.MSELoss()

  optimizer = torch.optim.Adam(model.parameters(), lr=learning_rate)

  for epoch in range(num_epochs):

  outputs = model(trainX)

  loss = criterion(outputs, trainY)

  loss.backward()

  optimizer.step()

  if epoch % 100 == 0:

  print("Iteration: %d, loss:%f" % (epoch, loss.item()))

  ```


