  CNN 的网络都能轻松达到 99%或更高的准确率。在苹果公司（截至 2021 年中）工作的、被广泛引用的深度学习研究员伊恩·古德费洛曾在社交媒体上评论道：“机器学习社区非但没有转向比
  MNIST 更难的数据集，反而比以往更深入地研究它。”这促使人们探索其他数据集，而 Zalando 十类别服装分类数据集很快引起了公众的注意。


