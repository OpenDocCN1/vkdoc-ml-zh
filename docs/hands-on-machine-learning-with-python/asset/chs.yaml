  图 11-10 中的图像显示了每个像素根据其颜色被分配到的五个簇。K-means 是一种非常简单但高效且流行的图像分割技术。


  #### 使用 DBSCAN 进行聚类


  还有其他几种聚类算法，在簇预计不会以球形均匀分布的情况下更为有用。为了找到这些具有明显非球形形状的簇，我们可以使用基于密度的方法，该方法将簇建模为由稀疏区域分隔的密集区域。


  DBSCAN，即具有噪声的基于密度的空间聚类应用，就是这样一种方法，它试图将数据点密度大于预定阈值的空间区域合并起来。


  DBSCAN 需要一个预定的距离，称为 eps（epsilon），它表示被视为同一簇一部分的点之间的距离，以及 min_samples，它表示在 eps 距离内必须存在的数据点数量，以形成一个密集的簇区域。这些参数有助于控制算法对噪声的容忍度以及应被视为簇的分布形状。


  DBSCAN 通过定位预期密度区域中存在的点来迭代地扩展簇。图 11-11 显示了从空间某个确定区域内的三个点开始的扩展过程。


  ![](img/516449_1_En_11_Fig11_HTML.jpg)


  图 11-11


  DBSCAN 通过邻近的点扩展簇


