  ### 准备模型


  我们首先需要将数据集转换为张量。可以使用`torch.from_numpy()`创建张量，然后通过`TensorDataset()`将数据值和标签打包在一起。接着，我们可以定义`DataLoaders`来加载数据，以便进行更大规模的实验。


  ```

  import torch

  import torch.nn as nn

  import torch.nn.functional as F

  from torch.utils.data import TensorDataset, DataLoader

  # 创建张量数据集

  train_data = TensorDataset(torch.from_numpy(X_train), torch.from_numpy(y_train))

  valid_data = TensorDataset(torch.from_numpy(X_test), torch.from_numpy(y_test))

  batch_size=50

  train_loader = DataLoader(train_data, shuffle=True, batch_size=batch_size)

  valid_loader = DataLoader(valid_data, shuffle=True, batch_size=batch_size)

  ```


  该模型是一个简单的模型，包含一个输入层，接着是 LSTM 层，最后是一个带 sigmoid 激活函数的单单元输出层。我们将使用 dropout 层进行基本正则化，以避免过拟合。


  输入层是一个嵌入层，其形状表示批次大小、层大小和序列长度。在模型类中，`forward()`方法将实现前向传播计算。我们还将实现`init_hidden()`方法，将
  LSTM 的隐藏状态初始化为零。隐藏状态存储了 RNN 根据当前序列中先前标记的预测结果而得到的内部状态，以维持序列内的记忆概念。然而，重要的是，当我们读取下一条评论的第一个标记时，状态应被重置，然后由后续标记更新和使用。具体实现如下：


  ```

  class SentimentAnalysisModel(nn.Module):

  def __init__(self, no_layers, vocab_size, hidden_dim, embedding_dim, drop_prob=0.5):

  super(SentimentAnalysisModel,self).__init__()

  self.output_dim = output_dim

  self.hidden_dim = hidden_dim

  self.no_layers = no_layers

  self.vocab_size = vocab_size

  self.embedding = nn.Embedding(vocab_size, embedding_dim)

  self.lstm = nn.LSTM(input_size=embedding_dim, hidden_size=self.hidden_dim, num_layers=no_layers,
  batch_first=True)

  self.dropout = nn.Dropout(0.3)

  self.fc = nn.Linear(self.hidden_dim, output_dim)

  self.sig = nn.Sigmoid()

  def forward(self,x,hidden):

  batch_size = x.size(0)

  embeds = self.embedding(x)

  lstm_out, hidden = self.lstm(embeds, hidden)

  lstm_out = lstm_out.contiguous().view(-1, self.hidden_dim)

  out = self.dropout(lstm_out)

  out = self.fc(out)

  sig_out = self.sig(out)

  sig_out = sig_out.view(batch_size, -1)

  sig_out = sig_out[:, -1] # 获取最后一批标签

  return sig_out, hidden

  def init_hidden(self, batch_size):

  '''''' 初始化隐藏状态 ''''''

  h0 = torch.zeros((self.no_layers, batch_size, self.hidden_dim)).to(device)

  c0 = torch.zeros((self.no_layers, batch_size, self.hidden_dim)).to(device)

  hidden = (h0,c0)

  return hidden

  ```


  现在我们可以初始化模型对象了。超参数可以单独定义，以便后续微调模型。`no_layers`用于定义 RNN 的堆叠层数。`vocab_size`会递增，以调整嵌入层的形状，使其能够容纳填充评论中的
  0 值。`output_dim`为 1，表示输出层只有一个节点，该节点包含一个可视为评论正面概率的数字。`hidden_dim`用于指定 LSTM 中隐藏状态的大小。


  ```

  no_layers = 2

  vocab_size = len(vocab) + 1

  embedding_dim = 64

  output_dim = 1

  hidden_dim = 256

  model = SentimentAnalysisModel (no_layers,  vocab_size, hidden_dim, embedding_dim,
  drop_prob=0.5)

  model.to(device)

  print(model)

  ```


