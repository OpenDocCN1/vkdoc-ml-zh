  卷积神经网络（CNN）是一种前馈神经网络，其包含具有专门功能的层，通过将滤波器在输入图像的小区域上滑动来应用滤波器，从而生成激活图。回想一下，常规的前馈网络由单个计算单元或神经元组成，训练过程需要反向传播来学习它们的权重和偏置。每个计算单元使用点积将输入与权重结合，并将其传递给一个非线性函数，该函数产生一个输出。这个输出通常用作下一层神经元的输入，直到我们到达输出层。CNN
  的开发核心在于，通过在其至少一个层中使用称为卷积的数学运算来寻找图像中的特征。


