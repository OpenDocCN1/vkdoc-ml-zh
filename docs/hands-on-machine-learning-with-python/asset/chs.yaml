  ## 卷积操作


  图像中的每个像素并非独立的数据源，而是依赖于其周围的像素——通常通过相似的值（相似的颜色或强度）来表现同一物体的连续性，或通过颜色或亮度值的急剧变化来表现物体的突变边界。卷积使我们能够通过一组预定义的、作用于图像的内核来捕捉这些特征。


  卷积是一种数学运算，它将一个内核（或滤波器）应用于输入数据（通常是图像）的一部分以生成一个元素，然后滑过整个图像，最终生成一幅修改后的图像。考虑如图 14-1
  所示的矩阵和滤波器。


  ![](img/516449_1_En_14_Fig1_HTML.jpg)


  图 14-1


  使用 4 x 4 矩阵和 2 x 2 滤波器进行的部分卷积操作


  4x4 矩阵与一个 2x2 滤波器进行运算，这导致滤波器映射到矩阵的左上角部分。这会生成一个单一值，作为输出保存在结果矩阵的某个单元格中，如图 14-1 所示。然后滤波器向右滑动，对图像的下一部分执行类似的计算，如图
  14-2 所示。


  ![](img/516449_1_En_14_Fig2_HTML.jpg)


  图 14-2


  使用 4 x 4 矩阵和 2 x 2 滤波器进行的后续卷积操作


  此过程持续进行，直到原始矩阵的所有值都被填充完毕，如图 14-3 所示。


  ![](img/516449_1_En_14_Fig3_HTML.jpg)


  图 14-3


  使用 4 x 4 矩阵和 2 x 2 滤波器的卷积操作结果


  由于结果矩阵小得多，我们有时会添加填充，以使结果图像与原始图像尺寸相近。因此，我们可能会从如图 14-4 所示的填充矩阵开始。


  ![](img/516449_1_En_14_Fig4_HTML.jpg)


  图 14-4


  确保卷积结果形状相同的填充


  滤波器本质上会滤除所有与滤波器包含的模式无关的内容。我们希望学习滤波器，以便根据给定的数据集发现模式。简单来说，卷积就是一个滑动的模式查找器。在图像处理软件中，有一些标准滤波器可以提供常见的特效，如锐化、模糊、边缘检测等。图
  14-5 展示了一个简单的例子。


