  现在，我们可以使用 opencv 在 Python 中加载图像，具体如下：


  ```

  import numpy as np

  import cv2

  import matplotlib.pyplot as plt

  original_image = cv2.imread("C:\\Data\\Wikimedia Images\\port_campbell.jpg")

  plt.figure(figsize=(10,10))

  plt.imshow(original_image)

