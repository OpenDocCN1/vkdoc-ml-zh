  \ 和 2，分别对应 Iris setosa、Iris virginica 和 Iris versicolor）的边界线。在最后一行，我们使用预测器的 `predict()`\
  \ 方法，根据已学习的模型打印出原始数据集的预测目标值。你将看到类似如下的输出：\n\n```\narray([0, 0, 0, 0, 0, 0, 0, 0,\
