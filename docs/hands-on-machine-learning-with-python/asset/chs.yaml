- '# 1. 开始使用 Python 3 和 Jupyter Notebook


  我希望各位都已阅读过引言和目录。这一点非常重要，因为如果你是完全的初学者，请不要跳过本章。整个机器学习和人工智能领域都需要扎实掌握该领域使用的工具和框架。本章作为本书将要涵盖的
  Python 机器学习编程的基础章节。它将向新手读者介绍 Python 编程语言、科学 Python 生态系统以及用于 Python 编程的 Jupyter Notebook。


  以下是本章我们将学习的内容列表：


  *   Python 3 编程语言


  *   安装 Python


  *   Python 模式


  *   Pip3 工具


  *   科学 Python 生态系统


  *   Python 实现与发行版


  学习完本章后，我们将能够熟练地在 Windows 和 Debian Linux 系统上进行安装、运行程序以及使用 Jupyter notebook。


  ## Python 3 编程语言


  Python 3 是一种现代编程语言。它兼具面向对象和过程式编程的特性。它可以在多种平台上运行。普通读者最容易接触到的平台是 macOS、Windows 和各种
  Linux 发行版。Python 可以在所有这些平台上运行。其主要优势在于，在一个平台上编写的代码无需进行重大修改（平台特定代码除外）即可在另一个平台上运行。你可以在
  [`www.python.org/`](http://www.python.org/) 阅读更多关于 Python 的信息。


  ### Python 编程语言的历史


  ABC 语言是 Python 编程语言的前身。ABC 语言的灵感来源于 ALGOL 68 和 SETL 编程语言。Python 编程语言由吉多·范罗苏姆（Guido
  Van Rossum）在 20 世纪 80 年代末的圣诞假期期间作为业余项目创建。他当时在荷兰国家数学与计算机科学研究所（Centrum Wiskunde &
  Informatica）工作。范罗苏姆毕业于阿姆斯特丹大学计算机科学专业。他曾就职于谷歌和 Dropbox。目前，他在微软工作。


  Python 有两个主要且不兼容的版本：Python 2 和 Python 3。Python 2 目前已不再积极开发和维护。整个编程世界正逐渐从 Python
  2 切换到 Python 3。本书中的所有演示都将使用 Python 3。从现在起，每当我们使用**Python**这个词时，都指的是**Python 3**。


  #### Python 编程语言的哲学


  Python 编程语言的哲学被称为**Python 之禅**，可以在 [`www.python.org/dev/peps/pep-0020/`](http://www.python.org/dev/peps/pep-0020/)
  查阅。以下是该 PEP（Python 增强提案）中的要点。其中一些很有趣。


  1.  优美胜于丑陋。


  2.  显式胜于隐式。


  3.  简单胜于复杂。


  4.  复杂胜于凌乱。


  5.  扁平胜于嵌套。


  6.  稀疏胜于密集。


  7.  可读性很重要。


  8.  特殊情况也不足以特殊到打破规则。


  9.  尽管实用性胜过纯粹性。


  10. 错误不应被静默忽略。


  11. 除非明确需要静默。


  12. 面对歧义，拒绝猜测的诱惑。


  13. 应该有一种——最好只有一种——显而易见的方式来做这件事。


  14. 尽管这种方式一开始可能并不明显，除非你是荷兰人。


  15. 现在做胜于永不开始。


  16. 尽管永不开始通常比*立刻*开始要好。


  17. 如果实现难以解释，那可能是个坏主意。


  18. 如果实现易于解释，那可能是个好主意。


  19. 命名空间是个绝妙的主意——让我们更多地使用它们吧！


  这些是几十年来影响 Python 编程语言发展并持续发挥作用的通用哲学指南。


  ### Python 的应用领域


  Python 被用于各种应用程序。例如：


  1.  教育


  2.  自动化


  3.  科学计算


  4.  计算机视觉


  5.  动画


  6.  物联网


  7.  网页开发


  8.  桌面和移动应用


  9.  管理


  我们可以在 [`www.python.org/about/apps/`](http://www.python.org/about/apps/) 详细了解所有应用。许多组织使用
  Python 创建了应用程序。我们可以在 [`www.python.org/success-stories/`](http://www.python.org/success-stories/)
  阅读所有这些成功案例。现在，让我们开始我们自己的旅程。


