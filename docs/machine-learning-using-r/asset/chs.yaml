  \ R 通过其 Hadoop streaming 库与 Hadoop 集成，该库内置于 `rhdfc` 和 `rmr2` 包中。出于演示目的，这种集成可能没问题，但在实际生产系统中，它可能不是一个健壮的解决方案。其他编程语言如\
  \ Java、Scala 和 Python 具有健壮的生产级代码完整性，并且与 Hadoop 框架紧密耦合。在接下来的章节中，我们将介绍 Hive、Pig 和\
  \ HBase 的基础知识，并以一个使用 Spark 的实际示例作为结束。\n\n\n\n### 10.2.2 Hive\n\n在适应像 Hadoop 这样的大数据技术时，所需的最关键的范式转变是能够像在关系型数据库管理系统（RDBMS）中使用\
  \ SQL（结构化查询语言）那样，熟练地读取、写入和转换数据。RDBMS 具有结构良好的表设计，这些表被分组到遵循预定义模式的数据库中。只要正确遵循 SQL 语法、逻辑和模式，查询任何表都很容易。这些数据库在数据仓库中得到了良好的管理。\n\
  \n现在，为了便于轻松查询存储在 HDFS 中的数据，需要一个与 HDFS 紧密耦合，同时又能提供与传统 RDBMS 相同查询能力的数据仓库工具。Apache\
  \ Hive 的开发正是将这一思想置于其设计原则的核心。尽管底层存储是 HDFS，但数据可以按照定义良好的模式进行结构化。在 Hadoop 生态系统的所有其他工具中，Hive\
  \ 是业界使用最广泛的组件。关于 Hive 架构和设计的高级技术讨论超出了本书的范围；然而，我们将在此处提供入门材料，以便您能够将大数据与更宏大的体系联系起来。\n\
  \n市场上有许多工具可以帮助处理公司内部来自各种来源的大规模数据，并将其放入一个通用的数据平台（Hive 是此类数据平台中必不可少的数据处理引擎），然后该平台可供公司内的分析师、产品经理、开发人员、运营分析师等使用。Qubole\
  \ Data Service 就是提供此类处理服务的平台之一。它还提供了一个用于编写在 Hive 上运行的 SQL 查询的图形用户界面。\n\n**注意：**\n\
