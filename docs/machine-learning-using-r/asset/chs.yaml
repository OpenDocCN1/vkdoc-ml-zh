  ```\n\n测试集准确率 = 95%\n\n```\nsvm_pred_test <-predict(svm.model, test_data[,-11])\n\
  CrossTable(test_data$V11, svm_pred_test,\nprop.chisq =FALSE, prop.c =FALSE, prop.r\
  \ =FALSE,\ndnn =c('actual default', 'predicted default'))\nCell Contents\n|-------------------------|\n\
  |                       N |\n|         N / Table Total |\n|-------------------------|\n\
  Total Observations in Table:  233\n| predicted default\nactual default |       \
