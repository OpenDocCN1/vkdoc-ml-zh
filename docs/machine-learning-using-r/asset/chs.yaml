  所有变量及其水平的 p 值都是显著的。这意味着我们拟合的模型中，变量与因变量之间存在显著关系。现在我们来计算该模型的分类矩阵。这是通过平衡特异性和敏感度的方法实现的。这些指标的详细信息在第\
  \ 6 章中给出，我们在此进行简要说明，并利用这些指标为从概率到类别的分类找到一个良好的截断点。\n\n```\n#安装并加载包\nlibrary(pROC)\n\
  #应用 roc 函数\ncut_off <-roc(response=train$choice, predictor=Model_logistic$fitted.values)\n\
