  \  0.60352\nStoreArea             5.462e+01  7.550e+00   7.234 9.06e-13 ***\nStreetHouseFront\
  \      1.353e+02  6.042e+01   2.240  0.02529 *\nBasementArea          2.145e+01\
  \  3.004e+00   7.140 1.74e-12 ***\nLawnArea              1.026e+00  1.721e-01  \
  \ 5.963 3.39e-09 ***\nRating2              -8.385e+02  4.816e+04  -0.017  0.98611\n\
