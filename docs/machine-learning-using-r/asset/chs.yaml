  ### 8.3.2 手动网格搜索


  本节将讨论用于手动网格搜索优化的模型细节。


  *   *响应变量*：`ProductChoice`


  *   *预测变量*：`MembershipPoints`、`CustomerAge`、`PurchaseTenure`、`CustomerPropensity`
  和 `LastPurchaseDuration`


  *   *误差计算*：交叉验证


  *   *模型类型*：学习向量量化（LVQ）


  ```

  '
- '# Tune algorithm parameters using a manual grid search.

  seed <-917;

  dataset <-Data

  ```


  此处，我们设置 `trainControl` 函数，其中 `method="repeatedCV"` 表示使用重复交叉验证，搜索 `method = "grid"`
  表示在 `grid` 定义的网格中进行搜索。


  ```

  '
