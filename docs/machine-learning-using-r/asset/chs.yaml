  \ \"B000LQOCH0\" \"B000UA0QIQ\" ...\n    $ UserId                : chr  \"A3SGXH7AUHU8GW\"\
  \ \"A1D87F6ZCVE5NK\" \"ABXLMWJIXXAIN\" \"A395BORC6FGVXV\" ...\n    $ ProfileName\
  \           : chr  \"delmartian\" \"dll pa\" \"Natalia Corres \\\"Natalia Corres\\\
  \"\" \"Karl\" ...\n    $ HelpfulnessNumerator  : int  1 0 1 3 0 0 0 0 1 0 ...\n\
  \    $ HelpfulnessDenominator: int  1 0 1 3 0 0 0 0 1 0 ...\n    $ Score       \
  \          : Factor w/ 5 levels \"1\",\"2\",\"3\",\"4\",..: 5 1 4 2 5 4 5 5 5 5\
  \ ...\n    $ Time                  : int  1303862400 1346976000 1219017600 1307923200\
  \ 1350777600 1342051200 1340150400 1336003200 1322006400 1351209600 ...\n    $ Summary\
  \               : chr  \"Good Quality Dog Food\" \"Not as Advertised\" \"\\\"Delight\\\
  \" says it all\" \"Cough Medicine\" ...\n    ```\n\n2.  数据准备\n\n```\n    library(caTools)\n\
  \    # 随机分割数据，仅使用数据集的 10%\n    set.seed(90)\n    split =sample.split(fine_food_data$Score,\
  \ SplitRatio =0.05)\n    fine_food_data =subset(fine_food_data, split ==TRUE)\n\
  \    select_col <-c(\"UserId\",\"ProductId\",\"Score\")\n    fine_food_data_selected\
  \ <-fine_food_data[,select_col]\n    rownames(fine_food_data_selected) <-NULL\n\
  \    fine_food_data_selected$Score =as.numeric(fine_food_data_selected$Score)\n\
  \    # 移除重复项\n    fine_food_data_selected <-unique(fine_food_data_selected)\n  \
  \  ```\n\n3.  创建评分矩阵\n\n我们将使用一个名为 `dcast` 的函数，根据亚马逊美食评论数据集中的评论评分来创建评分矩阵：\n\n```\n\
  \    library(recommenderlab)\n    # 评分矩阵\n    RatingMat <-dcast(fine_food_data_selected,UserId\
  \ ~ProductId, value.var =\"Score\")\n    User=RatingMat[,1]\n    Product=colnames(RatingMat)[2:ncol(RatingMat)]\n\
  \    RatingMat[,1] <-NULL\n    RatingMat <-as.matrix(RatingMat)\n    dimnames(RatingMat)\
  \ =list(user = User , product = Product)\n    realM <-as(RatingMat, \"realRatingMatrix\"\
  )\n    ```\n\n4.  探索评分矩阵\n\n```\n    # 评分分布\n    hist(getRatings(realM), breaks=15,\
  \ main =\"评分分布\", xlab =\"评分\", col =\"grey\")\n    ```\n\n![../images/416805_2_En_6_Chapter/416805_2_En_6_Fig53_HTML.jpg](img/416805_2_En_6_Fig53_HTML.jpg)\n\
  \n图 6-53\n\n用户的原始评分\n\n```\n"
