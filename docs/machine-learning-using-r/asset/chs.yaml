  由 Deepayan Sarkar 撰写、Springer（2008）出版的《*Lattice: 使用 R 进行多元数据可视化*》（可通过 SpringerLink
  获取）一书，对气泡图进行了全面分析。如果你想更深入地理解这种可视化方式，请参考此书。


  图 4-20 中的气泡图展示了 2007 年预期寿命与人均 GDP 之间的关系。气泡的大小表示该大洲各国的人口数量。气泡越大，人口越多。你可以看到，由于印度和中国的存在，亚洲包含多个大型气泡；而欧洲则主要由人口较少的国家组成，且人均
