  \n```\nks.test(data$OutsBal,stratified_sample_10_percent$OutsBal,alternative=\"\
  two.\nsided\")\nTwo-sample Kolmogorov-Smirnov test\ndata:  data$OutsBal  and  stratified_sample_10_percent$OutsBal\n\
  D = 0.00073844, p-value = 0.7045\nalternative hypothesis: two-sided\n```\n\n图 3-12\
  \ 展示了样本和总体未结余额分布的直方图。视觉比较清晰地表明样本能够代表总体。\n\n![../images/416805_2_En_3_Chapter/416805_2_En_3_Fig12_HTML.jpg](img/416805_2_En_3_Fig12_HTML.jpg)\n\
  \n图 3-12\n\n总体与分层样本分布\n\n```\npar(mfrow =c(1,2))\nhist(data$OutsBal, breaks=50,\
  \ col=\"red\", xlab=\"Outstanding Balance\",\nmain=\"Population \")\nhist(stratified_sample_10_percent$OutsBal,\
  \ breaks=50, col=\"green\",\nxlab=\"Outstanding Balance\",\nmain=\"Stratified Sample\"\
  )\n```\n\n图 3-12 中的分布图再次强调了检验结果：总体和分层随机样本具有相同的分布。分层随机样本能够代表总体。\n\n关键点：\n\n*   当你希望确保样本中数据点的比例与总体保持一致时，应使用分层抽样。这不仅保证了代表性，还确保了所有层在样本中都有体现。\n\
  \n*   分层抽样还可以帮助你系统地设计每个层的记录比例，从而可以根据业务需求设计分层抽样计划来改变代表性。例如，当你对二项响应函数进行建模，且数据集中事件率或\
  \ 1 的比例非常小时，你可以从层（0 或 1 响应）中进行分层随机抽样，并尝试通过抽样提高 1 的比例，以方便建模。\n\n\n\n### 3.11.5 整群抽样\n\
  \n很多时候，总体中包含在统计上显著的异质性群体。在这种情况下，首先识别这些异质性群体，然后规划抽样策略就显得尤为重要。这种技术在市场营销和活动策划人员中很受欢迎，因为他们经常处理总体中异质性群体的特征。\n\
  \n整群抽样可以通过两种方式进行：\n\n*   *单阶段抽样*：所选群组中的所有元素都包含在样本中。例如，你想研究某个群组中占主导地位的特定总体特征，那么你可能需要先识别该群组及其元素，然后抽取该群组的所有单元。\n\
  \n*   *两阶段抽样*：从所选群组中随机抽取一部分元素纳入样本。这种方法类似于分层抽样，但区别在于，这里的群组是父级单元，而前者中的是层。层变量本身可能根据度量尺度被划分为多个群组。\n\
  \n对于固定的样本量，当总体中的大部分变异存在于组内而非组间时，整群抽样能获得更好的结果。选择抽样方法并非总是直截了当的。很多时候，整群抽样的每个样本点成本低于其他抽样方法。在这种成本约束下，整群抽样可能是一个不错的选择。\n\
  \n指出层与群组之间的区别很重要。虽然两者都是总体的重叠子集，但它们在许多方面有所不同。\n\n*   在样本中，所有层都会被代表；而在整群抽样中，只有一部分群组被包含在样本中。\n\
  \n*   当层内单元在内部是同质时，分层抽样效果最佳。然而，对于整群抽样，当群组内元素在内部是异质时，效果最佳。\n\n优点：\n\n*   数据收集成本低于其他方法，因为关注的目标群组在收集和存储上成本更低，且管理成本也更低。\n\
  \n*   整群抽样以群组块的形式考虑大型总体。由于这些群组/集群规模很大，采用任何其他技术都会非常困难。只有当我们处理的是包含统计上显著群组的大型总体时，整群抽样才可行。\n\
  \n*   使用其他抽样方法可以观察到估计值变异性的降低，但这并非总是理想情况。\n\n缺点：\n\n*   *抽样误差*：由于抽样过程的设计，抽样误差较高。群组研究中受试者数量与同等可靠、随机抽样的非群组研究中受试者数量之比称为*设计效应*，这导致了较高的抽样误差。\n\
  \n*   *抽样偏差*：在整群抽样中，所选样本将被视为整个总体的代表，如果该群组存在有偏见的意见，那么整个总体就会被推断为持有相同意见。实际情况可能并非如此。\n\
  \n在向你展示整群抽样之前，让我们通过按国际交易对数据进行子集划分，人为地在数据中创建一些群组。我们将使用一个关于国际交易的条件语句来对数据进行子集划分。在这里，你可以看到我们人为地创建了五个群组。\n\
  \n```\n# 在我解释整群抽样之前，让我们尝试对数据进行子集划分，以便有清晰的样本来解释整群抽样的重要性\n# 将数据子集划分为 5 个子组\nData_Subset_Clusters_1\
  \ 2&IntTransc 10&IntTransc 18&IntTransc 26&IntTransc 34)\nData_Subset_Clusters\n\
  ```\n\n我们明确地基于国际交易创建了群组。创建这些群组是为了展示整群抽样。\n\n单阶段整群抽样意味着从五个群组中随机选择群组进行分析。而两阶段抽样则意味着随机选择几个群组，然后从中进行分层随机抽样。在图\
  \ 3-13 中，我们首先使用 k-means（在第 [6](http://dx.doi.org/10.1007/978-1-4842-4215-5_6) 章中详细讨论）创建群组，然后应用分层抽样，假设群组是层变量。\n\
  \nk-means 函数基于基于质心的 k-means 聚类方法创建群组。由于我们明确创建了五个群组，我们将调用 k-means 根据国际交易值形成五个群组。我们已经知道该函数会像上一步那样精确地给出五个群组。这仅用于说明目的。在实际情况中，你需要找出总体数据中存在的群组。\n\
  \n```\n# 现在我们将 Data_Subset_Clusters 视为我们的总体\nlibrary(stats)\nkmeans_clusters <-kmeans(Data_Subset_Clusters$IntTransc,\
  \ 5, nstart =25)\ncat(\"群组中心是 \",kmeans_clusters$centers)\n群组中心是 59.11837 22.02696\
  \ 38.53069 47.98671 5.288112\n```\n\n![../images/416805_2_En_3_Chapter/416805_2_En_3_Fig13_HTML.jpg](img/416805_2_En_3_Fig13_HTML.jpg)\n\
  \n图 3-13\n\n按国际交易数量划分的五类输入数据分段\n\n接下来，我们随机抽取一部分记录以便清晰地绘图，因为绘制大量记录会不清晰（见图 3-13）。\n\
  \n```\nset.seed(937)\n# 为了绘图，我们只从总数据中随机选择 100000 条记录。\nlibrary(splitstackshape)\n\
  PlotSample<-Data_Subset_Clusters[sample(nrow(Data_Subset_ Clusters),size=100000,\
  \ replace =TRUE, prob =NULL),]\nplot(PlotSample$IntTransc, col = kmeans_clusters$cluster)\n\
  points(kmeans_clusters$centers, col =1:5, pch =8)\n```\n\n```\ncluster_sample_combined<-cbind(Data_Subset_Clusters,kmeans_clusters$cluster)\n\
  setnames(cluster_sample_combined,\"V2\",\"ClusterIdentifier\")\n```\n\n现在，我们向你展示每个群组汇总的记录数量。请注意这些数字，因为我们将在两阶段整群抽样中用到它们。样本在各群组中的比例将保持一致。\n\
  \n```\nprint(\"每个群组的记录数汇总\")\n[1] \"每个群组的记录数汇总\"\ntable(cluster_sample_combined$ClusterIdentifier)\n\
  1      2      3      4      5\n67871 128219  75877  44771 974893\n```\n\n这里，我们假设群组标识符是层变量，并使用\
  \ `stratified()` 函数分别抽取占层总体 10% 的样本。\n\n```\nset.seed(937)\nlibrary(splitstackshape)\n\
  cluster_sample_10_percent<-stratified(cluster_sample_combined,group=c(\"Clust\n\
  erIdentifier\"),size=0.1,replace=FALSE)\n```\n\n这一步创建了两阶段整群样本，即从每个群组中随机选择 10% 的记录。让我们绘制带有群组中心的群组图（见图\
  \ 3-14）。\n\n![../images/416805_2_En_3_Chapter/416805_2_En_3_Fig14_HTML.jpg](img/416805_2_En_3_Fig14_HTML.jpg)\n\
  \n图 3-14\n\n由 K-means 形成的群组（星号代表群组的质心）\n\n```\nprint(\"绘制来自群组的随机样本的群组图\")\n[1] \"\
  绘制来自群组的随机样本的群组图\"\nplot(cluster_sample_10_percent$IntTransc, col = kmeans_clusters$cluster)\n\
  points(kmeans_clusters$centers, col =1:5, pch =8)\n```\n\n接下来是群组样本的频率分布。回头看看，它与用于聚类的总体比例相同。整群抽样第二阶段的分层抽样确保了数据点的比例保持不变，即层大小的\
  \ 10%。\n\n\n\n```\nprint(\"Summary of no. of records per clusters\")\n[1] \"Summary\
  \ of no. of records per clusters\"\ntable(cluster_sample_10_percent$ClusterIdentifier)\n\
  1     2     3     4     5\n6787 12822  7588  4477 97489\n```\n\n现在，我们展示整群抽样如何影响未结余额的分布，并与总体和整群样本进行比较。\n\
  \n```\npopulation_summary <-summarise(group_by(data,CardType),OutstandingBalan\n\
  ce_Population=mean(OutsBal))\nWarning in gmean(OutsBal): Group 1 summed to more\
  \ than type 'integer'\ncan hold so the result has been coerced to 'numeric' automatically,\
  \ for\nconvenience.\ncluster_summary<-summarise(group_by(cluster_sample_10_percent,CardType),Outs\n\
  tandingBalance_Cluster=mean(OutsBal))\nsummary_mean_compare<-merge(population_summary,cluster_summary,\
  \ by=\"CardType\")\nprint(summary_mean_compare)\nSource: local data table [4 x 3]\n\
  CardType OutstandingBalance_Population\n1 American Express                     \
  \ 3820.896\n2         Discover                      4962.420\n3       MasterCard\
  \                      3818.300\n4             Visa                      4584.042\n\
  Variables not shown: OutstandingBalance_Cluster (dbl)\n```\n\n该摘要展示了基于国际交易的整群抽样如何影响未结余额的均值。为了进行可视化检查，我们将在图\
  \ 3-15 中创建直方图。您将看到分布受到的影响微乎其微。这可能是因为我们创建的群组假设国际交易桶是同质的，因此对未结余额没有产生重大影响。为了确保这一点，建议您执行\
  \ `t.test()` 来检验均值是否显著相同。\n\n![../images/416805_2_En_3_Chapter/416805_2_En_3_Fig15_HTML.jpg](img/416805_2_En_3_Fig15_HTML.jpg)\n\
  \n图 3-15\n\n整群总体与整群随机样本分布\n\n```\npar(mfrow =c(1,2))\nhist(data$OutsBal, breaks=50,\
  \ col=\"red\", xlab=\"Outstanding Balance\",\nmain=\"Histogram for Population Data\"\
  )\nhist(cluster_sample_10_percent$OutsBal, breaks=50, col=\"green\",\nxlab=\"Outstanding\
  \ Balance\",\nmain=\"Histogram for Cluster Sample Data \")\n```\n\n换句话说，整群抽样与分层抽样相同；唯一的区别在于，分层变量存在于数据中，是数据的内在属性，而在整群抽样中，我们首先识别群组，然后从这些群组中进行随机抽样。\n\
  \n关键点：\n\n*   仅当总体中存在强有力的群组证据，并且您有充分的业务理由来证明这些群组及其对建模结果的影响时，才应进行整群抽样。\n\n*   不应将整群抽样与分层抽样混淆。在分层抽样中，层是根据数据集中的属性形成的，而群组则是基于总体中主体通过某种关系（例如，与质心的距离、相同的多变量特征等）的相似性创建的。在实施整群抽样时需特别注意，群组必须存在，并且应具有同质性的业务依据。\n\
  \n### 3.11.6 自助抽样法\n\n在统计学中，自助法（Bootstrapping）是任何依赖于有放回随机抽样的抽样方法、检验或度量。理论上，你可以在自助法中创建无限大小的总体进行抽样。这是一个统计学中的高级主题，广泛应用于需要从样本估计值中计算统计抽样度量（例如均值、方差、偏差等）的情况。\n\
  \n自助法允许使用随机抽样方法估计几乎任何统计量的抽样分布。刀切法（Jackknife）先于现代自助法技术出现。参数的刀切法估计量是通过反复剔除一个观测值并计算估计值来获得的。当所有观测点都被遍历后，将这些估计值的平均值作为估计量。对于样本量为\
  \ N 的情况，也可以通过汇总样本中每个 N-1 估计值来得到刀切法估计量。理解刀切法很重要，因为它为样本度量估计的自助法方法提供了基本思路。\n\n参数的刀切法估计量可以通过估计每个子样本的参数，并省略第\
  \ i 个观测值来估计先前未知的参数值（例如 ![$$ \\overline{x_i} $$](img/416805_2_En_3_Chapter_TeX_IEq9.png)\
  \ ）来获得。\n\n![$$ {\\overline{x}}_i=\\frac{1}{n-1}\\kern0.1em \\sum \\limits_{j\\\
  ne i}^n{x}_j $$](img/416805_2_En_3_Chapter_TeX_Equh.png)\n\n刀切法技术可用于估计估计量的方差。\n\n\
  ![$$ {\\mathrm{Var}}_{\\left(\\mathrm{jackknife}\\right)}=\\frac{n-1}{n\\kern0.1em\
  \ }\\kern0.1em \\sum \\limits_{i=1}^n{\\left({\\overline{x}}_i-{\\overline{x}}_{(.)}\\\
  right)}² $$](img/416805_2_En_3_Chapter_TeX_Equi.png)\n\n其中 ![$$ {\\overline{x}}_i\
  \ $$](img/416805_2_En_3_Chapter_TeX_IEq10.png) 是基于省略第 i 个观测值的参数估计量，而 ![$$ {\\overline{x}}_{(.)}\
  \ $$](img/416805_2_En_3_Chapter_TeX_IEq11.png) 是基于所有子样本的估计量。\n\n1977 年，斯坦福大学的 B.\
  \ Efron 发表了他著名的论文《Bootstrap Methods: Another Look at the Jackknife》。这篇论文首次详细阐述了自助法在各种样本度量估计问题中的应用。从统计学角度看，该论文试图解决以下问题：给定一个来自未知概率分布\
  \ F 的随机样本 X= (x[1],x[2],…X[n])，根据观测数据 x 估计某个预先指定的随机变量 R(X,F) 的抽样分布。我们留待您自行探索该方法的统计细节。\n\
  \n当您不知道总体的分布（或者甚至没有总体）时，自助法可以方便地为抽样估计创建假设检验。自助法技术将从样本获得的经验分布中抽取数据。如果一组观测值可以被假定来自独立同分布的总体，则可以通过构建多个有放回的重采样（大小与观测数据集相等）来实现。当我们数据集较小且不确定估计量的分布以进行假设检验时，这种方法非常有用。\n\
  \n优点：\n\n*   易于实现；它提供了一种简单的方法来计算复杂未知抽样分布的标准误差和置信区间。\n*   随着计算能力的提高，自助法的结果会变得更好。\n\
  *   自助法的一个流行应用是检查估计值的稳定性。\n\n缺点：\n\n*   自助法是渐近一致的，但不能提供有限样本一致性。\n*   这是一种高级技术，因此您需要充分了解从自助法方法得出的估计值的假设和性质。\n\
  \n在我们的 R 示例中，我们将展示如何使用自助法来估计总体参数，并围绕该估计值创建置信区间。这有助于检查参数估计的稳定性并执行假设检验。我们将基于一个与业务相关的线性回归方法创建示例。\n\
  \n\n\n### 注意\n\n当样本量非常小且难以找到实际总体分布时，自助法技术更适用于估计问题。\n\n首先，我们在总体数据上拟合一个线性回归模型（不含截距）。该模型将以响应变量作为待研究变量，预测变量为国内交易次数进行拟合。商业直觉表明，未偿还余额应与国内交易次数呈正相关。自变量与因变量之间的正相关意味着线性回归系数的符号应为正。\n\
  \n我们得到的系数是来自总体的真实估计值。这是总体参数估计值，因为它是在计算整个总体。\n\n```\nset.seed(937)\nlibrary(boot)\n\
  # 现在我们需要想要估计的函数\n# 首先拟合一个线性模型，并从总体数据中获知真实估计值\nsummary(lm(OutsBal ~0 +DomesTransc,\
  \ data = data))\nCall:\nlm(formula = OutsBal ~ 0 + DomesTransc, data = data)\nResiduals:\n\
  Min     1Q Median     3Q    Max\n-7713  -1080   1449   4430  39091\nCoefficients:\n\
  Estimate Std. Error t value Pr(>|t|)\nDomesTransc 77.13469    0.03919    1968  \
  \ <2e-16 ***\n\nSignif. codes:  0 '***' 0.001 '**' 0.01 '*' 0.05 '.' 0.1 ' ' 1\n\
  Residual standard error: 4867 on 9999999 degrees of freedom\nMultiple R-squared:\
  \ 0.2792, Adjusted R-squared: 0.2792\nF-statistic: 3.874e+06 on 1 and 9999999 DF,\
  \ p-value: < 2.2e-16\n```\n\n你可以看到在总体数据上拟合的线性回归模型摘要。现在我们将抽取总体的一小部分样本（抽样比例 = 10000/10,000,000\
  \ = 1/1000）。因此，我们的挑战是从一个非常小的数据集中估计国内交易次数的系数。\n\n在此背景下，抽样可以被视为一个过程，即从一组小值中创建更大的样本集，以获取估计值真实分布的估计。\n\
  \n```\nset.seed(937)\n# 假设我们只有 10000 个数据点，并且必须对国内交易系数的重要性进行假设检验。\n# 由于数据集很小，我们将使用自助法来创建系数的分布，\n\
  # 然后创建一个置信区间来检验假设。\nsample_10000 <-data[sample(nrow(data),size=10000, replace =FALSE,\
  \ prob =NULL),]\n```\n\n现在我们有一个小样本可供使用。让我们定义一个名为 `Coeff` 的函数，它将返回国内交易变量的系数。\n\n\
  它有三个参数：\n\n*   `data`：这是你想要进行自助法处理的小数据集。在我们的例子中，这是包含 10,000 条记录的样本数据集。\n\n*   `b`：一个随机的索引框架，每次调用函数时用于选择数据。这将确保每次从模型中选取数据集时，都是从输入数据中随机选择的。\n\
  \n*   `formula`：这是一个可选字段。但这将是模型的函数形式，将由线性回归进行估计。\n\n这里我们只是将公式合并到了 `return` 语句中。\n\
  \n```\n# 返回 DomesTransc 系数的函数\nCoeff =function(data,b,formula){\n# b 是自助法样本的随机索引\n\
  d =data[b,]\nreturn(lm(OutsBal ~0 +DomesTransc, data = d)$coefficients[1])\n# 这是\
  \ beta 系数\n}\n```\n\n现在我们可以开始自助法了，因此我们将使用 `boot` 库中的 `boot()` 函数。这是一个非常强大的函数，适用于参数和非参数自助法。我们认为这是一个高级主题，不会涵盖此函数的细节。感兴趣的读者建议阅读\
  \ CRAN 上的函数文档。\n\n我们在此示例中使用的输入是：\n\n*   `data`：这是我们在上一步创建的小样本数据。\n\n*   `statistics`：这是一个函数，将返回感兴趣参数的估计值。这里，我们的函数\
  \ `Coeff` 将返回国内交易系数的值。\n\n*   `R`：这是你想要创建的自助法样本数量。一个通用的经验法则是，你拥有的自助法样本越多，置信带就越窄。\n\
  \n### 注意\n\n对于此示例，我们考虑使用较少的样本数量，以确保置信带较宽，并了解我们能在多大置信度下看到来自总体的原始估计值。\n\n这里我们使用 `R=50`\
  \ 调用该函数。\n\n```\nset.seed(937)\n# R 是自助法样本的数量\nbootbet =boot(data=sample_10000,\
  \ statistic=Coeff, R=50)\nnames(bootbet)\n[1] \"t0\"        \"t\"        \"R\" \
  \         \"data\"       \"seed\"\n[6] \"statistic\" \"sim\"      \"call\"     \
  \  \"stype\"      \"strata\"\n[11] \"weights\"\n```\n\n现在绘制系数估计值的直方图和 QQ 图（见图 3-16）。\n\
  \n![../images/416805_2_En_3_Chapter/416805_2_En_3_Fig16_HTML.jpg](img/416805_2_En_3_Fig16_HTML.jpg)\n\
  \n图 3-16\n\n估计系数的直方图和 QQ 图\n\n```\nplot(bootbet)\n```\n\n现在，我们绘制参数估计值的直方图。我们可以在图\
  \ 3-17 中看到，自助法样本揭示了参数的分布。我们可以围绕此分布构建置信区间并进行假设检验。\n\n![../images/416805_2_En_3_Chapter/416805_2_En_3_Fig17_HTML.jpg](img/416805_2_En_3_Fig17_HTML.jpg)\n\
  \n图 3-17\n\n来自自助法的参数估计值直方图\n\n```\nhist(bootbet$t, breaks =5)\n```\n\n这里我们计算了自助法估计值的均值和方差。假设系数分布是正态分布，你可以围绕均值创建一个针对真实值的置信带。\n\
  \n```\nmean(bootbet$t)\n[1] 76.77636\nvar(bootbet$t)\n[,1]\n[1,] 2.308969\n```\n\
  \n此外，为了展示该分布叠加在先前参数的正态分布上的效果，请执行以下操作：\n\n```\nx <-bootbet$t\nh<-hist(x, breaks=5,\
  \ col=\"red\", xlab=\"自助法估计值\",\nmain=\"带正态曲线的直方图\")\nxfit<-seq(min(x),max(x),length=40)\n\
  yfit<-dnorm(xfit,mean=mean(bootbet$t),sd=sqrt(var(bootbet$t)))\nyfit <-yfit*diff(h$mids[1:2])*length(x)\n\
  lines(xfit, yfit, col=\"blue\", lwd=2)\n```\n\n在图 3-18 中，你可以看到我们已经能够找到系数的分布，因此可以对其进行假设检验。这也为我们提供了真实系数的近似估计。如果你仔细观察，这个想法与\
  \ Jackknife 最初提出的非常接近。借助更强的计算能力，我们只是将该方法的范围从均值和标准差扩展到了任何参数估计。\n\n![../images/416805_2_En_3_Chapter/416805_2_En_3_Fig18_HTML.jpg](img/416805_2_En_3_Fig18_HTML.jpg)\n\
  \n图 3-18\n\n带正态密度函数的直方图\n\n以下代码对系数的自助法值执行 `t.test()`，并与来自总体数据的真实系数估计值进行比较。这将告诉我们，从一个较小的样本中，我们得到的估计值与真实值有多接近，以及我们能在多大置信度下接受或拒绝自助法得到的系数。\n\
  \n```\nt.test(bootbet$t, mu=77.13)\nOne Sample t-test\ndata: bootbet$t\nt = -1.6456,\
  \ df = 49, p-value = 0.1062\nalternative hypothesis: true mean is not equal to 77.13\n\
  95 percent confidence interval:\n76.34452 77.20821\nsample estimates:\nmean of x\n\
  76.77636\n```\n\n关键点：\n\n*   自助法是一种强大的技术，当我们对参数分布知之甚少且只有小数据集可用时，它会派上用场。\n\n*   这种技术本质上是高级的，并涉及许多假设，因此需要适当的统计知识才能使用自助法技术。\n\
  \n\n\n## 3.12  蒙特卡洛方法：接受-拒绝法\n\n在现代，蒙特卡洛方法已成为统计学中一个独立的研究领域。蒙特卡洛方法利用计算密集型的随机抽样技术来估计潜在参数。该技术对于无法求得精确解的随机方程至关重要。蒙特卡洛技术在金融领域非常流行，特别是在金融工具估值和预测方面。\n\
  \n在统计学中，接受-拒绝法是从某个分布中抽取观测样本的基本技术。该方法从一个分布中进行随机抽样，并根据预设条件决定接受或拒绝该观测值。因此，它属于蒙特卡洛方法的广泛范畴。\n\
  \n在此方法中，我们首先通过观察累积概率分布来估计数据集的**经验分布**（即经验密度函数：EDF）。得到 EDF 后，我们为另一个已知分布设定参数。这个已知分布将覆盖\
  \ EDF。\n\n现在，我们开始从已知分布中抽样，如果观测值落在 EDF 范围内则接受，否则拒绝。换句话说，拒绝抽样可以通过以下步骤执行：\n\n1.  从提议分布中抽取一个点（记为\
  \ x）。\n\n2.  在该样本点 x 处画一条垂直线，直至提议分布的曲线（见图 3-19）。\n\n3.  沿着这条线从 0 到最大值（PDF）均匀抽样，其中\
  \ PDF 代表概率密度函数。如果样本值大于最大值，则拒绝；否则接受。\n\n该方法帮助我们根据已知分布抽取任意分布的样本。这些方法在金融产品估值和其他随机过程的随机微积分中非常流行。\n\
  \n为了说明此方法，我们将从参数为 (3,10) 的贝塔分布中抽取一个样本。贝塔分布如图 3-19 所示。\n\n```\ncurve(dbeta(x, 3,10),0,1)\n\
  ```\n\n![../images/416805_2_En_3_Chapter/416805_2_En_3_Fig19_HTML.jpg](img/416805_2_En_3_Fig19_HTML.jpg)\n\
  \n图 3-19\n\n贝塔分布图\n\n我们首先创建一个包含 5000 个介于 0 和 1 之间的随机值的样本。然后，我们计算这 5000 个随机值样本对应的贝塔密度。\n\
  \n```\nset.seed(937)\nsampled <-data.frame(proposal =runif(5000,0,1))\nsampled$targetDensity\
  \ <-dbeta(sampled$proposal, 3,10)\n```\n\n现在，我们计算提议分布（贝塔 PDF）的最大概率密度。一旦我们获得了 5000\
  \ 个案例的最大密度和样本密度，我们就开始通过拒绝法进行抽样，如下所示。生成一个介于 0 和 1 之间的随机数：\n\n```\n如果该值大于我们为预先已知的贝塔分布计算的样本密度，则拒绝该值作为来自贝塔分布的样本\n\
  maxDens =max(sampled$targetDensity, na.rm = T)\nsampled$accepted =ifelse(runif(5000,0,1)\
  \ <sampled$targetDensity /maxDens,\nTRUE, FALSE)\n```\n\n图 3-20 显示了贝塔(3,10)的 EDF\
  \ 图以及样本数据集的直方图。我们可以看到，通过接受位于红线（即贝塔分布的 PDF）下方的随机数中的值，我们成功创建了所需的样本。\n\n![../images/416805_2_En_3_Chapter/416805_2_En_3_Fig20_HTML.jpg](img/416805_2_En_3_Fig20_HTML.jpg)\n\
  \n图 3-20\n\n通过拒绝法抽样\n\n```\nhist(sampled$proposal[sampled$accepted], freq = F, col\
  \ =\"grey\", breaks =100)\ncurve(dbeta(x, 3,10),0,1, add =T, col =\"red\")\n```\n\
  \n## 3.13  本章小结\n\n在本章中，我们介绍了不同的抽样技术，并展示了这些抽样技术如何减少需要处理的数据量，同时保留数据的属性。适用于任何总体的最佳抽样方法是简单随机无放回抽样。\n\
  \n我们还讨论了自助抽样法，这是一个重要的概念，因为你可以使用此方法估计任何参数的分布。最后，我们展示了通过拒绝法进行抽样的示例，该方法允许我们从已知分布创建任何分布。该技术基于蒙特卡洛模拟，在金融服务领域非常流行。\n\
  \n本章在减少应用于机器学习算法的数据量方面发挥着重要作用，从而保持总体方差不变。\n\n在下一章中，我们将通过可视化来研究数据的属性。如果我们使用适当的抽样，从样本中观察到的可视化和趋势将与从总体中观察到的一致。\n\
  \n"
- '# 4. R 语言数据可视化


  *数据可视化*是创建和研究数据的视觉表示以获取有意义见解的过程。


  数据可视化专门处理对给定数据中信息的可视化。这可以包括多种类型的图表、图形、颜色和线图。数据可视化是呈现数据的有效方式，因为它改变了感知与认知之间的平衡，从而更充分地利用大脑的能力。我们编码信息的方式对于建立通往大脑认知的直接通路至关重要。可视化中用于编码信息的核心工具是颜色、大小、形状和数字。


  数据科学的第一步是理解数据；只有在此之后，我们才开始考虑模型和算法。将数据可视化作为数据科学过程不可或缺的一部分有许多好处。数据可视化的一些直接好处包括：


  *   识别数据中的风险点，启动诊断

  *   追踪和识别不同属性之间的关系

  *   观察趋势和异常以理解原因

  *   将复杂冗长的电子表格和数据库总结为视觉艺术

  *   拥有一种易于使用且极具影响力的方式来存储和呈现信息等


  市场上有许多付费的可视化软件套件和按需云应用程序，只需点击一下按钮即可创建有意义的可视化。然而，我们将探索用于在 R 中创建可视化的开源包和工具的强大功能。


  任何类型的数据可视化从根本上都依赖于数据呈现的四个关键要素，即**比较、关系、分布**和**构成**。*比较*用于查看多个项目在某个时间点的差异，或查看变量在一段时间内的相对变化。*关系*要素有助于发现两个或多个变量在数值增减时的相关性。散点图和气泡图是此类中的一些示例。*分布*图表（如柱状图和线形直方图）显示数据的分布情况。例如，可以轻松发现向左或向右偏斜的数据。*构成*指的是具有多个组件的堆叠图表，例如饼图或堆叠柱状图/面积图。在我们的
  PEBE 机器学习流程中，可视化在探索阶段起着关键作用。


  可视化通过利用数据的力量，成为讲述故事的辅助工具。有大量示例表明，简单的图表就能呈现出即使使用复杂的统计学也难以发现的模式。在本章中，我们将通过合适的示例探讨数据呈现的四个要素，并强调可视化在更好地理解数据直至最细微细节方面所发挥的重要作用。



  ## 4.1 ggplot2 包简介


  R 语言开发者在可视化工具库中创建了一个丰富的集合。由于是开源的，这些包会随着新功能的加入而快速更新。R 语言可视化工具的另一个显著发展是，开发者已经能够创建出可以复制某些高计算量
  3D 图和模型输出的函数。


  `ggplot2` 是由 Hadley Wickham 于 2005 年创建的数据可视化包。它实现了 Leland Wilkinson 的图形语法——一种将图表分解为语义组件（如标度和图层）的通用数据可视化方案。同样重要的是，我们多次使用过的另一个强大的绘图函数是
  `plot()`。


  本章还会用到其他一些包，你可以进一步探索它们。其中一些包括 `googleVis()`、`ggmap()`、`ggrepel()`、`waterfall()`
  和 `rCharts()`。这些包都强烈推荐使用。


  ## 4.2 世界发展指标


  优秀的数据可视化是用数字讲述故事。


  在本章中，我们将通过一些示例讨论图表类型。本章有一半的内容讨论用于构建可视化的经济指标。具体的图表和图形将结合世界银行的发展指标数据进行讨论。世界银行收集数据以监测全球的经济指标。有关数据和经济学原理的详细信息，请访问
  [`http://www.worldbank.org/`](http://www.worldbank.org/)。


  以下部分是对核心指标的简要介绍。后续章节将展示用于理解其含义和影响的合适可视化方法。社会科学家在各个领域利用世界银行的许多数据进行了大量优秀的研究。我们精选了其中一些非常有影响力的研究成果，并将数据的真正精髓呈现出来。当我们从一个示例过渡到另一个示例时，将重点强调正确的可视化类型以及如何从数据中提取含义，而无需查看
  CSV 或 Excel 文件中成百上千的行和列。世界银行网站上也提供了许多此类可视化图表；然而，在本书中，你将学习如何使用 R 语言中的 ggplot 包来生成不同的图形、图表和绘图。本书没有采用传统的先学习图形语法再讨论大量可视化理论的方法，而是选择了一个主题（世界银行的发展指标），并通过讲故事的方式带你开启一段旅程。


  ## 4.3 折线图


  *折线图*是一种基本的可视化图表类型，其中信息通过一系列称为*标记*的数据点显示，这些数据点由线段连接。折线图用于显示变量多个类别中的趋势。例如，图 4-1 显示了根据最近报告的
  GDP 数据排名前 10 的国家多年来的国内生产总值（GDP）增长情况。它有助于在单个图表中可视化所有这些国家的 GDP 增长趋势。


  ```

  library(reshape)

  library(ggplot2)

  GDP <-read.csv("Dataset/Total GDP 2015 Top 10.csv")

  names(GDP) <-c("Country", "2010","2011","2012","2013","2014","2015")

  ```


  以下代码使用了一个非常重要的函数 `melt()`，该函数在后续章节中也会重复使用。


  `melt` 函数接收宽格式的数据，并将一组列堆叠到单个数据列中。你可以将其理解为熔化当前维度以获得更简单的维度。`Melt()` 在 `reshape2()`
  包中可用。在以下代码中，重新整理数据集后，你将把它缩减为三列。这些列是相同信息沿多列的堆叠版本。`melt()` 函数只能熔化分类属性；数值属性会被聚合。


  ```

  GDP_Long_Format <-melt(GDP, id="Country")

  names(GDP_Long_Format) <-c("Country", "Year","GDP_USD_Trillion")

  ```


  以下代码在 `ggplot()` 函数的输出上堆叠了可视化的各个图层（见图 4-1）。建议你参考 ggplot 文档以获取更多选项。


  ![../images/416805_2_En_4_Chapter/416805_2_En_4_Fig1_HTML.jpg](img/416805_2_En_4_Fig1_HTML.jpg)


  图 4-1


  基于 GDP 排名前 10 的国家的折线图


  ```

  ggplot(GDP_Long_Format, aes(x=Year, y=GDP_USD_Trillion, group=Country)) +

  geom_line(aes(colour=Country)) +

  geom_point(aes(colour=Country),size =5) +

  theme(legend.title=element_text(family="Times",size=20),

  legend.text=element_text(family="Times",face ="italic",size=15),

  plot.title=element_text(family="Times", face="bold", size=20),

  axis.title.x=element_text(family="Times", face="bold", size=12),

  axis.title.y=element_text(family="Times", face="bold", size=12)) +

  xlab("Year") +

  ylab("GDP (in trillion USD)") +

  ggtitle("Gross Domestic Product - Top 10 Countries")

  ```


  显然，在前 10 名中，美国处于领先地位，其次是中国和日本。因此，无需查看数据，我们就能从该可视化中看到丰富的信息。现在，你脑海中浮现的下一个问题是，是什么导致一个国家的
  GDP 上升或下降？让我们尝试了解这些国家的 GDP 中有多少百分比来自农业（见图 4-2）、服务业（见图 4-3）和工业（见图 4-4）。


  ```

  # Agriculture

  Agri_GDP <-read.csv("Dataset/Agriculture - Top 10 Country.csv")

  ```


  同样，我们将数据熔化为更少的列数以便于绘图。


  ```

  Agri_GDP_Long_Format <-melt(Agri_GDP, id ="Country")

  names(Agri_GDP_Long_Format) <-c("Country", "Year", "Agri_Perc")

  Agri_GDP_Long_Format$Year <-substr(Agri_GDP_Long_Format$Year, 2,length(Agri_GDP_Long_Format$Year))

  ```


  应用 `ggplot2()` 选项创建图表如下：


  ![../images/416805_2_En_4_Chapter/416805_2_En_4_Fig2_HTML.jpg](img/416805_2_En_4_Fig2_HTML.jpg)


  图 4-2


  基于农业对 GDP 贡献百分比排名前 10 的国家的折线图




  ```

  ggplot(Agri_GDP_Long_Format, aes(x=Year, y=Agri_Perc, group=Country)) +

  geom_line(aes(colour=Country)) +

  geom_point(aes(colour=Country),size =5) +

  theme(legend.title=element_text(family="Times",size=20),

  legend.text=element_text(family="Times",face ="italic",size=15),

  plot.title=element_text(family="Times", face="bold", size=20),

  axis.title.x=element_text(family="Times", face="bold", size=12),

  axis.title.y=element_text(family="Times", face="bold", size=12)) +

  xlab("Year") +

  ylab("Agriculture % Contribution to GDP") +

  ggtitle("Agriculture % Contribution to GDP - Top 10 Countries")

  ```


  虽然像印度和巴西这样的国家，在考察 GDP 总量时并未跻身前三，但在农业领域却名列前茅（中国也位列前三）。这表明这些国家的经济对农业的依赖程度。


  ![../images/416805_2_En_4_Chapter/416805_2_En_4_Fig3_HTML.jpg](img/416805_2_En_4_Fig3_HTML.jpg)


  图 4-3


  一张折线图，展示了服务业对 GDP 贡献占比排名前十的国家


  ```

  # Service

  Service_GDP <-read.csv("Services - Top 10 Country.csv")

  Service_GDP_Long_Format <-melt(Service_GDP, id ="Country")

  names(Service_GDP_Long_Format) <-c("Country", "Year", "Service_Perc")

  Service_GDP_Long_Format$Year <-substr(Service_GDP_Long_Format$Year,

  2,length(Service_GDP_Long_Format$Year))

  ggplot(Service_GDP_Long_Format, aes(x=Year, y=Service_Perc, group=Country)) +

  geom_line(aes(colour=Country)) +

  geom_point(aes(colour=Country),size =5) +

  theme(legend.title=element_text(family="Times",size=20),

  legend.text=element_text(family="Times",face ="italic",size=15),

