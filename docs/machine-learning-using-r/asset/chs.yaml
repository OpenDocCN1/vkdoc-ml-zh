  \n## 6.14 模型构建检查清单\n\n在本章结束之前，我们整理了一份检查清单，列出了你在着手任何机器学习项目之前需要解决的问题。每当需要选择机器学习算法或决定将机器学习应用于新问题时，对可用数据的评估是整个过程中最重要的部分。在进一步行动之前，请先过一遍这份全面的检查清单：\n\
  \n*   你在这个问题中想要实现什么？目标是预测、估算一个值、寻找模式，还是仅仅进行探索？\n*   数据集中每个变量的类型是什么？是全部数值型、分类型，还是混合型？\n\
  *   你是否已经确定了响应（输出）变量和预测（输入）变量？\n*   数据中是否存在大量缺失值和异常值？\n*   假设不使用机器学习算法，你会如何解决这个问题？是否有可能通过简单的统计和可视化来探索数据，从而在不使用机器学习的情况下找到问题的答案？\n\
  *   箱线图、直方图或散点图是否揭示了数据中的任何有趣见解？\n*   你是否计算了所有数值变量的标准差、四分位数、均值和相关性度量？它们是否显示了任何有趣的信息？\n\
  *   你的数据集有多大？你的问题需要使用全部数据，还是一个小样本就足够了？\n*   是否有足够的计算资源（内存、存储和 CPU）来运行任何机器学习算法？\n\
  *   你认为当前的数据是否会很快过时，机器学习模型在构建后不久是否需要更新？\n*   是否有计划基于最终的机器学习模型构建一个数据产品？\n\n这份检查清单听起来可能有点长；然而，如果你在开始构建机器学习模型之前就弄清楚这些问题的答案，你可能会节省\
  \ 40%-60%的时间。\n\n## 6.15 总结\n\n像机器学习这样的领域之所以广阔，是因为多年来它在许多学科和行业中得到了应用。多年来工具和技术的进步，使得机器学习更接近甚至是没有太多统计学背景的普通用户。这促进了机器学习中方法的实际应用，以及许多以机器学习为中心的产品和设计的发展。我们正处在一个激动人心的时代，身处机器学习领域，它提供了无限的机会。精通机器学习的专家在许多行业都备受青睐。机器学习成为每个行业和产品核心的时代已经不远了，届时不仅仅是使用一组逻辑语句编写软件，而是融入一个能够适应不断变化需求的学习算法。\n\
  \n脚注 1   2\n\n\n\n# 7. 机器学习模型评估\n\n模型评估是开发任何机器学习解决方案中最重要的步骤。在模型开发的这个阶段，我们衡量模型性能，并决定是继续使用该模型，还是像我们在第[1](http://dx.doi.org/10.1007/978-1-4842-4215-5_1)章中描述的机器学习流程\
  \ PEBE 那样，重新审视之前的所有步骤。在许多情况下，我们甚至可能根据性能指标完全放弃整个模型。PEBE 的这一阶段对于任何基于机器学习的项目的成功都起着非常关键的作用。\n\
  \n模型评估的核心思想是最小化测试数据上的误差，而误差可以通过多种方式定义。在最直观的意义上，误差是数据中预测变量的实际值与机器学习模型预测值之间的差异。误差指标并非总是通用的，某些特定问题需要创造性地使用适合该问题和领域知识的误差指标。\n\
  \n这里需要强调的是，用于训练模型的误差指标可能与评估误差指标不同。例如，对于一个分类模型，你可能使用了 `LogLoss` 误差指标，但在评估模型时，你可能希望使用混淆矩阵来查看分类率。\n\
  \n在本章中，我们将阐述评估模型背后的基本思想，并详细讨论一些方法。\n\n本章的学习目标如下：\n\n*   模型性能与评估简介\n*   群体稳定性指标\n\
  *   连续输出的模型评估\n*   离散输出的模型评估\n*   概率技术\n*   高级指标（如 Kappa 误差指标）的说明\n\n## 7.1 数据集\n\
  \n本章使用的数据集与我们在第[6](http://dx.doi.org/10.1007/978-1-4842-4215-5_6)章中介绍的数据集相同，用于解释基于回归的方法和分类问题的机器学习技术。让我们快速回顾一下它们，然后就可以进入概念部分了。\n\
