  \ 5.452043e-03\n    [4,] 0.0254099375 9.620333e-01 1.255677e-02\n    [5,] 0.0344305970\
  \ 9.474942e-01 1.807525e-02\n    Closest hard clustering :\n    [1] 1 2 2 2 2 2\
