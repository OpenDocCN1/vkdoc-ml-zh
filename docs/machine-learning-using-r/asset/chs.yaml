  \n1.  给定一组 N 个训练观测值，通过有放回的均匀采样生成 m 个新的训练集 D[i]，每个训练集大小为 n（其中 n << N）。这种采样称为自助采样。（更多详情请参见第\
  \ 3 章。）\n\n2.  使用这 m 个训练集，拟合 m 个模型，并通过平均输出（回归）或多数投票（分类）来合并输出结果。\n\n某些版本的算法可能使用比原始数据集更少的属性样本集，例如随机森林。下面我们使用装袋\
