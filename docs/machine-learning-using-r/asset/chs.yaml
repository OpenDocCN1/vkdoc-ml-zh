  ## 4.19 小结


  数据可视化同时是一门艺术和科学。展示什么信息源于科学推理，而如何展示则取决于大脑的认知能力。事实证明，大脑处理图像的速度快于处理数字，因此，对于专业人士而言，将信息压缩成有意义的可视化图形而非冗长的数据流变得至关重要。


  在本章中，我们讨论了许多类型的可视化图表，它们可以用来围绕数据所传达的信息构建故事。我们从世界银行的数据开始，展示了如何使用折线图和柱状图追踪关键指标的变化。我们还了解了直方图和密度图如何通过观察整体水平，避免我们做出以偏概全的推断，因为直方图展示了数据内部的分布情况。饼图是展示各个组成部分贡献度的好方法。箱线图则用于展示数据集中的极端值。总的来说，相关性图、热力图以及最后的气泡图，在它们相对紧凑的图表空间内所展示的丰富信息方面，有许多共同之处。尽管存在相似性，你仍需谨慎选择正确的图表来呈现你的数据。


  瀑布图用于展示如何以更直观的方式捕捉信息的顺序流动。与瀑布图类似的是桑基图，但绘制目的不同。桑基图在流程可视化中展示了不同组成部分之间的连接属性。树状图在聚类分析和分析对象间的相似性方面有特定用途。时间序列图对于时间索引数据非常重要；使用时间序列图，你可以看到在经济衰退年份，三个国家的
  GDP 增长如何变为负值。


  另一种流行的图表是同期群分析图。这类图表在分析特定人群随时间推移的关键特征变化方面非常流行。我们使用了一个信用卡的例子，其中展示了从信用卡发放之日起，不同时期的不同同期群。最后，也是功能最强大的图表之一，是空间地图。它们是在地图上呈现信息的方式。任何带有地理标签的数据都可以使用空间地图来呈现。总的来说，R
  语言拥有可扩展的库来创建强大的可视化效果。


  在选择合适的可视化技术之前，理解你的演示受众是至关重要的。如前所述，数据可视化范围广泛，我们将在本书中持续使用许多此类图表和图形。


  在下一章中，我们将探讨数据探索的另一个方面：特征工程。如果我们有成百上千个变量或特征，我们如何决定哪个特定特征对于构建机器学习模型是有用的？这些问题将在第[6](http://dx.doi.org/10.1007/978-1-4842-4215-5_6)章中得到解答，为开始构建我们的机器学习模型奠定基础。


  '
- "# 5. 特征工程\n\n在机器学习中，特征工程是一个涵盖建模现实问题时统计和商业判断两方面的总括性术语。特征工程这个术语的提出，是为了强调为机器学习算法选择特征集所需的领域知识的重要性。这也是大多数机器学习专业人士称其为非正式流程的原因之一。\n\
  \n为了量化响应变量与预测变量之间有意义的关联，我们需要了解特征的个体属性以及它们之间如何相互作用。描述性统计和特征分布让我们深入了解它们是什么以及它们在数据集中如何表现。\n\
  \n本章的学习目标如下：\n\n*   特征工程简介\n*   特征排序\n*   变量子集选择\n*   降维\n\n本章包含一些动手实践的例子，将通用的统计方法应用于特征工程领域内的这些概念。本章后半部分将讨论一些例子，展示商业批判性思维如何帮助特征选择。\n\
  \n本章中的示例基于贷款违约数据。数据包含给定贷款的损失。每笔贷款的损失按 1 到 100 分级。对于全额收回贷款的情况，贷款损失值设为 0，这意味着该贷款没有违约。损失为\
  \ 60 意味着只收回了 40%的贷款。该数据用于构建违约预测模型。\n\n数据特征名称已被匿名化，以便将重点放在特征间关系的统计量化上。在金融服务行业中，有一些与贷款违约相关的关键术语：违约概率（PD）、违约风险敞口（EAD）和违约损失率（LGD）。虽然本章的重点是展示统计方法如何运作，但我们鼓励你将其与你的业务问题进行类比，在这种情况下，贷款违约可以作为一个很好的参考点。\n\
  \n\n\n## 5.1 特征工程简介\n\n随着技术的进步，现在只需花费很少的成本就能收集大量数据。在许多情况下，为了改进建模输出，我们会将来自第三方来源、外部开源数据的大量数据与内部数据合并。这为机器学习算法创造了庞大的特征集。从机器学习的角度来看，我们考虑集中的所有特征可能并非都重要，即使它们都很重要，也可能不需要全部特征就能达到模型预测的置信水平。\n\
  \n另一个方面是时间和复杂性；机器学习算法是资源密集型的，并且随着模型中每个特征的增加，时间呈指数级增长。数据科学家必须在复杂性与最终模型精度的收益之间取得平衡。\n\
  \n为了完全理解特征工程的概念，我们必须关注两个独立但相互支持的过程：\n\n*   特征选择（或变量选择）\n*   业务/领域知识\n\n前者是统计密集型的，并提供经验证据，说明为什么某个特征或特征集对机器学习算法很重要。这是基于可量化且可比较的指标，这些指标要么独立于响应变量，要么不独立。后者则更多地是运用业务逻辑，以确保特征有意义，并提供业务所寻求的正确见解。\n\
  \n例如，假设失业率被用于识别某个地区的贷款违约。对于该数据集，失业率可能在 95% 的置信水平下不显著，但在 90% 的置信水平下显著。如果业务部门认为失业率是一个重要变量，那么我们可能希望在变量选择中创建一个例外，即在放宽统计约束的条件下纳入失业率。\n\
  \n一个稳健且结构化的变量选择所带来的主要好处是：\n\n*   提高模型的预测性能\n*   更快、更简单的机器学习过程\n*   更好地理解底层数据关系\n\
  *   可解释且可实施的机器学习模型/解决方案\n\n前三个好处是直观的，可以联系到我们之前的讨论。让我们花些时间来重视这里的第四点。业务洞察通常源自简单且可解释的模型。机器越复杂，就越难以解释。尝试将特征视为业务行动点。如果所构建的机器包含无法用清晰术语向业务部门解释的特征，那么业务就会失去价值，因为模型输出无法付诸行动。这意味着机器学习的全部目的就丧失了。\n\
  \n你开发的任何模型都必须部署到实际环境中供最终用户使用。对于实际环境，模型中每增加一个特征，就意味着向实际系统增加一个数据输入，而这反过来可能意味着要访问一个全新的数据库。这会在系统内部造成大量的\
  \ IT 系统变更和依赖关系。然后，实施和维护成本必须根据模型的不可替代性以及保留这么多变量的必要性来权衡。如果可以用更少的特征解释相同的基本行为，那么就应该用更少的特征来实施。计算和提供快速结果的敏捷性通常胜过拥有更多特征的更好模型。\n\
  \n特征选择方法大致分为三类：过滤法、包装法和嵌入法。在接下来的几节中，我们将在 5.4 节中通过示例解释这三种方法。\n\n## 5.2 理解数据\n\n本章使用的数据来自一个公开竞赛的信用风险数据。信用风险建模是银行业中最复杂的建模问题之一。构建信用风险模型的过程不仅在数据方面很复杂，还需要深入了解业务和市场动态。\n\
  \n> *信用风险*是指因借款人未能按时还款而可能产生的债务违约风险。\n\n对信用风险建模中的关键术语多一些背景了解，将有助于你将这些数据问题与其他类似的领域问题联系起来。我们简要介绍信用风险建模中的几个关键概念。\n\
  \n*   *还款意愿和还款能力*：信用风险模型试图量化任何借款人的这两个方面。还款能力可以通过研究借款人的财务状况（如收入、财富等变量）来量化，而困难的部分在于衡量还款意愿，我们使用捕捉行为属性的变量（如违约历史、欺诈活动等变量）。\n\
  *   *违约概率 (PD)*：PD 是一个衡量指标，表明借款人在下一时期违约的可能性有多大。该值越高，违约的可能性越大。它是一个介于 0 和 1 之间（包含边界）的度量。银行希望向\
  \ PD 较低的借款人放贷。\n*   *违约损失率 (LGD)*：LGD 是衡量如果借款人在下一时期违约，贷款人可能损失多少的指标。通常，贷款人会持有某种形式的抵押品来限制违约的下行风险。简单来说，这个指标是贷款金额减去抵押品价值。这通常以百分比来衡量。具有高\
  \ LGD 的借款人是风险。\n*   *违约风险敞口 (EAD)*：EAD 是银行/贷款人在当前时间点所面临的风险敞口金额。这是如果借款人现在违约，贷款人可能损失的金额。这是任何银行信用风险部门密切关注的指标之一。\n\
  \n这些术语将帮助你思考如何通过调整特征工程的方式，从相同的数据中挖掘出不同的信息。所有这些指标都可以从相同的贷款违约数据中预测出来，但我们选择特征的方式会有所不同。\n\
  \n### 5.2.1 数据摘要\n\n输入数据的摘要将提供关于数据的重要信息。在本章中，我们需要在应用不同技术之前了解数据的一些特征。为了展示如何应用统计方法，我们选择用于建模的特征集。我们将关注的重要特征如下：\n\
  \n*   因变量的属性\n*   特征可用性：连续型或分类型\n*   设定数据假设\n\n\n\n### 5.2.2 因变量的属性\n\n在我们的数据集中，*loss*\
  \ 是本章图表中用作因变量的变量。建模的目标是信用损失。贷款是信用的一种形式，我们将交替使用信用损失和贷款损失这两个术语。`loss` 变量的取值范围在 0 到\
  \ 100 之间。我们将在本章中查看 `loss` 变量的分布情况。\n\n以下代码加载数据并显示所创建数据集的维度。维度是指记录数乘以特征数。\n\n```\n\
  Input the data and store in data table\nlibrary(data.table)\ndata <-fread (\"Dataset/Loan\
  \ Default Prediction.csv\",header=T, verbose\n=FALSE, showProgress =TRUE)\nRead\
  \ 105471 rows and 771 (of 771) columns from 0.476 GB file in 00:01:02\ndim(data)\n\
  [1] 105471    771\n```\n\n共有 105,471 条记录，包含 771 个属性。在这 771 个属性中，有一个因变量序列和一个主键。我们有\
  \ 769 个特征来为这个信用损失模型构建特征集。\n\n我们知道因变量是损失，其范围在 0 到 100 之间。出于分析目的，我们将把因变量作为连续变量和离散变量进行分析。作为连续变量，我们将查看描述性统计；作为离散变量，我们将查看其分布。\n\
  \n```\n#Summary of the data\nsummary(data$loss)\nMin.  1st Qu.  Median    Mean \
  \ 3rd Qu.     Max.\n0.0000   0.0000  0.0000  0.7996   0.0000 100.0000\n```\n\n记录到的最大损失是\
  \ 100，这相当于说贷款的所有未偿信用额度都损失了。均值接近 0，第一和第三四分位数都是 0。显然，损失不能作为连续变量来处理，因为大部分值都集中在 0 附近。换句话说，违约案例的数量很少。\n\
  \n![../images/416805_2_En_5_Chapter/416805_2_En_5_Fig1_HTML.jpg](img/416805_2_En_5_Fig1_HTML.jpg)\n\
  \n图 5-1\n\n损失分布（包含无违约情况）\n\n```\nhist(data$loss,\nmain=\"Histogram for Loss Distribution\
  \ \",\nxlab=\"Loss\",\nborder=\"blue\",\ncol=\"red\",\nlas=0,\nbreaks=100,\nprob\
  \ =TRUE)\n```\n\n图 5-1 中的损失分布显示，大部分分布中损失等于零。我们可以看到，在这种情况下，将损失作为连续变量是不可能的。因此，我们将把因变量转换为一个二分变量，其中\
  \ 0 代表无违约，1 代表违约。问题将简化为违约预测，我们现在知道后续打算使用哪种机器学习算法。这些先验信息将有助于我们选择合适的特征选择方法以及用于特征选择的指标。\n\
  \n现在让我们看看在发生违约的情况下（即损失不为零），损失是如何分布的（回想一下违约损失率 LGD 的概念）。\n\n![../images/416805_2_En_5_Chapter/416805_2_En_5_Fig2_HTML.jpg](img/416805_2_En_5_Fig2_HTML.jpg)\n\
  \n图 5-2\n\n损失分布（排除无违约情况）\n\n```\n#Sub-set the data into NON Loss and Loss ( e.g.,\
  \ loss > 0)\nsubset_loss 0.\n```\n\n在超过 90% 的情况下，损失低于 25%，因此违约损失率 (LGD) 较低（见图 5-2）。公司可以收回大部分应付款项。为了进一步讨论特征选择，我们将创建一个名为\
  \ `default` 的二分变量，如果损失等于 0，则该变量为 0，否则为 1。\n\n```\ndefault = 0 , there is no default\
  \ and hence no lossdefault = 1, there is a\ndefault\n#Create the default variable\n\
  data[,default :=ifelse(data$loss ==0, 0,1)]\n#Distribution of defaults\ntable(data$default)\n\
  0     1\n95688  9783\n#Event rate is defined as ratio of default cases in total\
  \ population\nprint(table(data$default)*100/nrow(data))\n0         1\n90.724465\
  \  9.275535\n```\n\n因此，我们已经将因变量转换为一个二分变量，我们的特征选择问题将致力于为我们的数据找到最佳的特征集来建模这种违约行为。分布表显示，在我们的数据集中有\
  \ 9.3% 的违约案例。这在模型开发数据中有时被称为*事件率*。\n\n### 5.2.3 特征可用性：连续型或分类型\n\n数据有 769 个特征用于为信用损失建模。我们必须识别出这些特征中有多少是连续型的，多少是分类型的。这将使我们能够恰当地设计特征选择过程，因为许多指标在排序方面不能直接比较，例如，连续变量的相关性度量与分类变量的相关性度量就不同。\n\
  \n### 提示\n\n如果你对某个特征的有效值没有任何先验知识，可以将具有超过 30 个水平的变量视为连续变量，将具有少于 30 个水平的变量视为分类变量。\n\
  \n以下代码片段做了三件事，以确定变量需要被赋予哪种类型的处理方式，即连续型或分类型：\n\n*   从本次分析中移除 id、loss 和 default 指示变量，因为这些变量是标识符或因变量。\n\
  *   找出每个特征中的唯一值；如果唯一值的数量小于或等于 30，则将该特征归入分类集。\n*   如果唯一值的数量大于 30，则将其归为连续变量。\n\n这个想法对我们来说是有效的；但是，你需要对诸如邮政编码（它是一个名义变量）、州（州的数量可能超过\
  \ 30 个，并且它们是字符型）以及其他具有字符值的特征保持谨慎。\n\n```\ncontinuous <-character()\ncategorical\
  \ <-character()\n#Write a loop to go over all features and find unique values\n\
  p<-1\nq<-1\nfor (i in names(data))\n{\nunique_levels =length(unique(data[,get(i)]))\n\
  if(i %in%c(\"id\",\"loss\",\"default\"))\n{\nnext;\n}\nelse\n{\nif (unique_levels\
  \ <=30 |is.character(data[,get(i)]))\n{\n#    cat(\"The feature \", i, \" is a categorical\
  \ variable\")\ncategorical[p] <-i\np=p+1\n# Making the\ndata[[i]] <-factor(data[[i]])\n\
  }\nelse\n{\n#   cat(\"The feature \", i, \" is a continuous variable\")\ncontinuous[q]\
  \ <-i\nq=q+1\n}\n}\n}\n# subtract 1 as one is dependent variable = default\ncat(\"\
  \\nTotal number of continuous variables in feature set \",\nlength(continuous) -1)\n\
  Total number of continuous variables in feature set 717\n# subtract 2 as one is\
  \ loss and one is id\ncat(\"\\nTotal number of categorical variable in feature set\
  \ \",\nlength(categorical) -2)\nTotal number of categorical variable in feature\
  \ set 49\n```\n\n这些迭代将数据分成了分类变量和连续变量，分别包含 49 个和 717 个特征。我们将忽略这些特征的领域特定含义，因为我们的重点是特征选择的统计方面。\n\
  \n### 5.2.4 建立数据假设\n\n为了解释特征选择的不同方面，我们将使用一些假设：\n\n*   我们对特征重要性或领域特定限制没有任何先验知识。\n\
  *   我们想要创建的机器/模型将预测二分变量 `default`。\n*   步骤的顺序仅用于说明；存在多种变体。\n\n\n\n\n## 5.3 特征排序\n\
  \n特征排序是识别特征对模型设定目标解释能力的最常用方法之一。在本例中，目标是预测 0 或 1。解释能力必须通过预定义的指标来量化，这样我们才能对特征进行有序排列。\n\
  \n在我们的问题设定中，可以通过以下步骤获取特征排序：\n\n*   对每个特征拟合一个逻辑模型（第 [6](http://dx.doi.org/10.1007/978-1-4842-4215-5_6)\
  \ 章将更详细地讨论此主题），其中因变量为 `default`。\n\n*   计算基尼系数。此处，基尼系数是我们定义的用于衡量特征解释能力的指标。\n\n*\
  \   使用基尼系数对特征进行排序，基尼系数越高表示特征的解释能力越强。\n\n`MLmetrics` 是一个评估指标集合——包括损失函数、评分函数和效用函数——用于衡量回归、分类和排序性能。这是一个用于计算分类器性能指标的有用包。我们将使用该包中的\
  \ `Gini()` 函数来获取基尼系数。\n\n以下代码片段实现了以下步骤：\n\n*   对数据中的每个特征，使用 `logit` 链接函数拟合一个逻辑回归模型。\n\
  \n*   计算所有数据的基尼系数（你也可以在训练数据上训练，并在测试数据上计算基尼系数）。\n\n*   按基尼系数对所有特征进行排序（从高到低）。\n\n\
  ```\nlibrary(MLmetrics)\nperformance_metric_gini <-data.frame(feature =character(),\
  \ Gini_value =numeric())\n#编写循环遍历所有特征并查找唯一值\nfor (feature in names(data))\n{\nif(feature\
  \ %in%c(\"id\",\"loss\",\"default\"))\n{\nnext;\n}\nelse\n{\ntryCatch({glm_model\
  \ <-glm(default ~get(feature),data=data,family=binomial(l\nink=\"logit\"));\npredicted_values\
  \ <-predict.glm(glm_model,newdata=data,type=\"response\");\nGini_value <-Gini(predicted_values,data$default);\n\
  performance_metric_gini <-rbind(performance_metric_\ngini,cbind(feature,Gini_value));},error=function(e){})\n\
  }\n}\nperformance_metric_gini$Gini_value <-as.numeric(as.character(performance_\n\
  metric_gini$Gini_value))\n#按基尼系数值对特征进行排序\nRanked_Features <-performance_metric_gini[order(-performance_metric_\n\
  gini$Gini_value),]\nprint(\"按基尼系数排序的前 5 个特征\\n\")\n[1] \"按基尼系数排序的前 5 个特征\\n\"\n\
  head(Ranked_Features)\nfeature Gini_value\n710    f766  0.2689079\n389    f404 \
  \ 0.2688113\n584    f629  0.2521622\n585    f630  0.2506394\n269    f281  0.2503371\n\
  310    f322  0.2447725\n```\n\n### 提示\n\n当你在大型数据集上运行循环时，循环可能会因某些错误而停止。为避免这种情况，请考虑使用\
  \ R 语言中的 `trycatch()` 函数。\n\n排序方法告诉我们，按单个预测能力排序的前六个特征分别是 f766、f404、f629、f630、f281\
  \ 和 f322。基尼系数最高的特征为 0.268（即 26.8%）。现在，使用前五个特征集，让我们创建一个逻辑模型并查看相同的性能指标。\n\n以下代码使用前六个特征对数据拟合一个逻辑模型。拟合模型后，它会输出模型的基尼系数。\n\
  \n```\n#使用前 6 个特征（f766、f404、f629、f630、f281 和 f322）创建逻辑模型\nglm_model |z|)\n(Intercept)\
  \ -3.071639   2.160885  -1.421    0.155\nf766        -1.609598   2.150991  -0.748\
