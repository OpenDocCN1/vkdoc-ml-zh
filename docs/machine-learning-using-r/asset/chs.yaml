  hdfs.put("/home/sample.txt","/hadoop_practice")

  [1] TRUE

  ```


  然后定义 Map 和 Reduce 函数。这段代码片段定义了 Map 和 Reduce 函数如何扫描文本文件，并将其*分词*（通常指按分隔符（如空格）拆分给定句子或文档的术语）为用于计数的键值对。


  ```

  '
- '# 一次读取多行

  '
- '# Map 阶段

  map <-function(k,lines) {

  words.list <-strsplit(lines, ''\\s+'')

  words <-unlist(words.list)

  return( keyval(words, 1) )

  }

  '
- '# Reduce 阶段

  reduce <-function(word, counts) {

  keyval(word, sum(counts))

  }

  '
- "# MapReduce 函数\nwordcount <-function (input, output=NULL) {\nmapreduce(input=input,\
  \ output=output, input.format=\"text\", map=map, reduce=reduce)\n}\n```\n\n然后运行单词计数。我们定义的\
  \ `wordcount` 函数现在可以在 Hadoop 上执行了。在调用该函数之前，请确保已设置输入文件所在的基目录以及希望放置 `wordcount` 函数生成输出的目录：\n\
