  \nSignif. codes:  0 '***' 0.001 '**' 0.01 '*' 0.05 '.' 0.1 ' ' 1\nResidual standard\
  \ error: 41660 on 1050 degrees of freedom\nMultiple R-squared:  0.7644, Adjusted\
  \ R-squared:  0.7604\nF-statistic: 189.3 on 18 and 1050 DF,  p-value: < 2.2e-16\n\
  ```\n\n估计的模型有六个自变量，包括四个连续变量（`StoreArea`、`StreetHouseFront`、`BasementArea` 和 `LawnArea`）和两个分类变量（`Rating`\
  \ 和 `SaleType`）。从 `lm()` 函数的结果可以看出，`StoreArea`、`StreetHouseFront`、`BasementArea`\
  \ 和 `LawnArea` 在 95% 的置信水平下是显著的，即统计上显著不为零。而 `SaleType` 的所有水平都不显著，因此统计上它们等于零。较高的评级是显著的，但较低的评级不显著。该模型应剔除\
  \ `SaleType` 并重新估计，以仅保留显著的变量。\n\n现在，我们将通过按房价排序后的序列绘制实际值与预测值的对比图，来查看该模型的拟合效果。\n\n\
  ```\n# 获取拟合值并创建一个包含实际值和预测值的数据框\nactual_predicted <-as.data.frame(cbind(as.numeric(Data_lm_Model$HOUSE_ID),as.numeric(Data_lm_Model$HousePrice),as.numeric(fitted(fitted_Model_multiple))))\n\
  names(actual_predicted) <-c(\"HOUSE_ID\",\"Actual\",\"Predicted\")\n# 按实际房价升序排列房屋\n\
  actual_predicted <-actual_predicted[order(actual_predicted$Actual),]\n# 计算绝对残差，然后求其均值\n\
  library(ggplot2)\n# 绘制测试案例的实际值与预测值对比图\nggplot(actual_predicted,aes(x =1:nrow(Data_lm_Model),color=Series))\
  \ +\ngeom_line(data = actual_predicted, aes(x =1:nrow(Data_lm_Model), y = Actual,\
  \ color =\"Actual\")) +\ngeom_line(data = actual_predicted, aes(x =1:nrow(Data_lm_Model),\
  \ y = Predicted, color =\"Predicted\"))  +xlab('房屋编号') +ylab('房屋销售价格')\n```\n\n\
  图 6-15 展示了按 `HousePrice` 排序后的实际值和预测值。\n\n![../images/416805_2_En_6_Chapter/416805_2_En_6_Fig15_HTML.jpg](img/416805_2_En_6_Fig15_HTML.jpg)\n\
  \n图 6-15\n\n实际值与预测值对比图\n\n我们按升序排列了房价，以便看到更清晰的实际值与预测值对比图。该图显示我们的模型紧密跟随实际价格。存在少数实际值中的异常值/高值情况，模型无法预测，但这没关系，因为我们的模型不受异常值影响。\n\
  \n\n\n### 6.5.4 模型诊断：线性回归\n\n模型诊断是模型选择过程中的一个重要步骤。第 7 章讨论的模型性能评估与模型选择过程之间存在差异。在模型评估中，我们检查模型在未见数据（测试数据）上的表现；而在模型诊断/选择中，我们观察模型拟合本身在数据上的表现。这包括检查参数估计的\
  \ p 值显著性、正态性、自相关性、同方差性、影响点/异常点以及多重共线性。还有其他一些检验方法，用于检查模型在多大程度上符合统计假设、严格外生性、方差分析表等，但在接下来的章节中，我们只关注其中几个。\n\
  \n#### 6.5.4.1 影响点分析\n\n在线性回归中，极端值可能会在估计过程中引发问题。少数高杠杆值会在估计量中引入偏差，并在残差中产生其他异常。因此，识别数据中的影响点非常重要。如果影响点看起来过于极端，我们必须将其作为*异常值*从分析中剔除。\n\
  \n我们将展示的一个特定统计量（以及其他统计量）是库克距离。该方法用于在进行 OLS 估计时，找出数据点影响力的估计值。\n\n库克距离定义如下：\n\n![$$\
  \ {D}_i=\\frac{e_i²}{s²p}\\left[\\frac{h_i}{{\\left(1-{h}_i\\right)}²}\\right],\
  \ $$](images/416805_2_En_6_Chapter/416805_2_En_6_Chapter_TeX_Equn.png)\n\n其中 ![$$\
  \ {s}²\\equiv {\\left(n-p\\right)}^{-1}{\\mathrm{e}}^{\\top}\\mathrm{e} $$](img/416805_2_En_6_Chapter_TeX_IEq3.png)\
  \ 是回归模型的均方误差，![$$ {h}_i\\equiv {\\mathbf{x}}_{\\mathrm{i}}^{\\mathrm{T}}{\\left({\\\
  mathbf{X}}^{\\mathrm{T}}\\mathbf{X}\\right)}^{-1}{\\mathbf{x}}_{\\mathrm{i}} $$](img/416805_2_En_6_Chapter_TeX_IEq4.png)，并且\
  \ ![$$ \\mathrm{e}=\\mathrm{y}-\\widehat{\\mathrm{y}}=\\left(\\mathrm{I}-\\mathrm{H}\\\
  right)y\\kern0.28em \\mathrm{is}\\ \\mathrm{denoted}\\kern0.28em \\mathrm{by}\\\
  kern0.28em {e}_i $$](img/416805_2_En_6_Chapter_TeX_IEq5.png)\n\n简单来说，库克距离衡量的是删除某个给定观测值所带来的影响。这样，如果删除某个观测值导致显著变化，就意味着这些点正在影响回归模型。这些点会被赋予一个较大的库克距离值，并被视为需要进一步调查的对象。\n\
  \n该统计量的临界值可以取为 ![$$ {D}_i&gt;4/n $$](img/416805_2_En_6_Chapter_TeX_IEq6.png)，其中\
  \ *n* 是观测值的数量。如果根据模型中的参数数量进行调整，则临界值可以取为 ![$$ {D}_i&gt;4/\\left(n-k-1\\right) $$](img/416805_2_En_6_Chapter_TeX_IEq7.png)，其中\
  \ *k* 是模型中的变量数量。\n\n```\nlibrary(car);\nInfluential Observations\n# Cook's D plot\n\
  # identify D values > 4/(n-k-1)\ncutoff <-4/((nrow(Data_lm_Model)-length(fitted_Model_multiple$coefficients)-2))\n\
  plot(fitted_Model_multiple, which=4, cook.levels=cutoff)\n```\n\n图 6-16 中的图表显示了数据集中每个观测值的库克距离。\n\
  \n![../images/416805_2_En_6_Chapter/416805_2_En_6_Fig16_HTML.jpg](img/416805_2_En_6_Fig16_HTML.jpg)\n\
  \n图 6-16\n\n每个观测值的库克距离\n\n您可以在图 6-16 的图表中看到，库克距离较高的观测值编号已被突出显示。这些观测值需要进一步调查。\n\n\
  ```\n# Influence Plot\ninfluencePlot(fitted_Model_multiple,    id.method=\"identify\"\
  , main=\"Influence Plot\", sub=\"Circle size is proportional to Cook's Distance\"\
  ,id.location =FALSE)\n```\n\n图 6-17 中的图表展示了库克距离的另一种视图。圆圈大小与库克距离成正比。\n\n![../images/416805_2_En_6_Chapter/416805_2_En_6_Fig17_HTML.jpg](img/416805_2_En_6_Fig17_HTML.jpg)\n\
  \n图 6-17\n\n影响图\n\n此外，异常值检验结果如下所示：\n\n```\n#Outlier Plot\noutlier.test(fitted_Model_multiple)\n\
