  ## 10.5 总结


  在未来，随着基础设施成本下降和数据量增加，扩展规模的需求将成为机器学习流程中的首要任务。每一个基于机器学习构建的应用，都必须首先考虑可扩展的实现思路。随着数据规模开始爆炸式增长，大多数传统的
  RDBMS 系统将很快过时。行业巨头们已经率先迈出第一步，转向支持大规模扩展且能灵活适应业务需求的系统。在不久的将来，当另一波颠覆性技术解决了日益增长的数据量问题时，对高效算法设计的重视以及对量子计算等领域的关注将开始显现。


  我们通过借鉴快速发展的数据科学方法论和技术，全面深入地探索了机器学习的世界。尽管经典文献中已经存在并优雅地解释了绝大部分机器学习模型构建流程，但我们仍感到有必要将机器学习模型构建流程与现代数据科学领域涌现的新思维结合起来。


  我们还尽可能简化了统计学和数学内容，以使机器学习的学习更加实用，并提供了大量额外资源供进一步阅读。诸如抽样、回归模型和深度学习等主题的深度和广度都非常大，每个主题都足以写出一本同等篇幅的书籍。然而，得益于
  CRAN 上丰富的 R 包，这些算法的实际应用才成为可能。


  由于 R 是初学者和高级用户围绕实际问题快速构建机器学习原型的首选编程语言，我们选择使用 R 来演示本书中的所有示例。如果你想将机器学习作为职业或研究工作，那么在计算机科学、统计学和领域知识之间取得良好的平衡将大有裨益。


  # 11. 使用 Keras 和 TensorFlow 进行深度学习


  曾几何时，数据和计算资源非常稀缺，以至于业务应用或 IT 基础设施产生的每一个数据点都不会被存储，应用设计也缺乏数据驱动的思维。如今，时代确实变了，计算和存储资源丰富，我们拥有了“数据优先”的思维，并且每个业务应用都能提供越来越多的数据。大型企业现在的商业模式都建立在从数据推断中产生收入的基础上。在这场数据和计算能力的激增中，最有前景的进步在于我们看待解决复杂问题的方式发生了根本性的改变。


  深度学习源于神经网络等传统机器学习算法，已经存在了几十年，然而，现在正是它回归的最佳时机。本章被收录为本书第二版的最后一章，因为很自然地，我们会将深度学习视为一种可扩展的机器学习算法，它能够处理海量数据。像
  TensorFlow 这样的框架就是为运行这些算法而设计的。


  更正式地说，深度学习算法受到人类认知系统的启发，能够学习复杂的数据表示。深度学习可以是监督式、半监督式和非监督式的。与神经网络类似，深度学习架构由多层神经元构建而成，以实现更好的特征提取。因此，它们创建了多个抽象层次，通常被称为概念层次结构。


  在本章中，我们将重点理解各种深度学习架构——如 Keras 这样的库、TensorFlow 这样的框架，以及深度学习算法在哪些问题上引发了颠覆性的研究和跨越式发展。


  ## 11.1 深度学习简介


  深度学习是机器学习的一个子领域，其根源在于神经网络模型。图 11-1 展示了人工智能（AI）、机器学习（ML）和深度学习（DL）之间的重叠关系。


  ![../images/416805_2_En_11_Chapter/416805_2_En_11_Fig1_HTML.jpg](img/416805_2_En_11_Fig1_HTML.jpg)


  图 11-1


  AI、ML 和 DL 的重叠关系


  对于图像分类，机器学习模型仅被设计用于在给定的特征集上使用线性分类器。然而，线性分类器只能创建简单的区域，比如被超平面分隔的空间。这类线性分类器不擅长检测位置、方向或光照的变化。对于视频、语音和音频，也存在类似的情况。另一方面，深度学习架构包含多层模块堆栈，这些模块通过计算非线性的输入-输出映射来学习。因此，这种架构能够从文本、视频、音频、语音和图像中的高级抽象表示中学习。第
  11.2 节将带你了解流行的深度学习架构及其在各个领域的应用。


  ## 11.2 深度学习架构


  在本节中，我们将讨论一些在实际应用中被广泛使用的流行深度学习架构。然而，考虑到本书的篇幅，我们将把细节限制在最低限度，并在必要时引用适当的资料。深度学习架构正随着来自各个领域的大量研究兴趣而迅速发展。


  ### 11.2.1 卷积神经网络（CNN）


  与传统神经网络相比，卷积神经网络（CNN）将其神经元结构化为三维（宽度、高度和深度），如图 11-2 所示。CNN 的每一层都将三维输入转换为三维输出。在图 11-2
  中，红色的输入层代表图像，因此其宽度和高度就是图像的尺寸，深度为三，分别对应红、绿、蓝三个通道。


  ![../images/416805_2_En_11_Chapter/416805_2_En_11_Fig2_HTML.jpg](img/416805_2_En_11_Fig2_HTML.jpg)


  图 11-2


  神经网络与卷积神经网络对比。来源：[`http://cs231n.github.io/convolutional-networks/`](http://cs231n.github.io/convolutional-networks/)


  图 11-3 展示了 CNN 的基本架构，该架构可扩展到更复杂的架构，如 LeNet、AlexNet、ZF Net、GoogLeNet、VGGNet 和 ResNet
  等。通过使用输入层到输出 softmax 层之间的所有层，网络能够学习给定数据的各种特征，无论模式多么复杂。在许多方面，它确实模仿了人类思维。关于这些架构的更多细节，可参见“CS231n
  卷积神经网络用于视觉识别” [7]。


  ![../images/416805_2_En_11_Chapter/416805_2_En_11_Fig3_HTML.jpg](img/416805_2_En_11_Fig3_HTML.jpg)


  图 11-3


  卷积神经网络。来源：[`https://www.mathworks.com/videos/introduction-to-deep-learning-what-are-convolutional-neural-networks--1489512765771.html`](https://www.mathworks.com/videos/introduction-to-deep-learning-what-are-convolutional-neural-networks%252D%252D1489512765771.html)


  CNN 的架构适用于图像或视频帧中的物体分类和检测。它在计算机视觉从业者中很受欢迎。CNN 架构被广泛应用于基于闭路电视监控的安全监控、MRI 和 CT 扫描中的异常检测、基于人脸识别的应用以及许多其他计算机视觉用例。




  ### 11.2.2 循环神经网络（RNN）


  循环神经网络（RNN）因其基于神经网络的架构和内置的内部记忆功能而迅速流行起来。RNN 的历史可以追溯到 20 世纪 80 年代；然而，与其他深度学习架构一样，随着计算能力变得经济且充裕，其潜力在近年来才得以实现。


  图 11-4 展示了 RNN 与前馈神经网络的区别。RNN 通常处理当前输入，并记住它从先前输入中学到的内容。


  ![../images/416805_2_En_11_Chapter/416805_2_En_11_Fig4_HTML.jpg](img/416805_2_En_11_Fig4_HTML.jpg)


  图 11-4


  前馈神经网络与卷积神经网络。来源：[`https://towardsdatascience.com/recurrent-neural-networks-and-lstm-4b601dd822a5`](https://towardsdatascience.com/recurrent-neural-networks-and-lstm-4b601dd822a5)


  另外需要注意的是，前馈神经网络将一个输入映射到一个输出，而 RNN 可以实现一对多、多对多（翻译）以及多对一（语音分类）的映射。图 11-5 展示了 RNN 中不同类型的映射。


  ![../images/416805_2_En_11_Chapter/416805_2_En_11_Fig5_HTML.jpg](img/416805_2_En_11_Fig5_HTML.jpg)


  图 11-5


  RNN 映射。来源：[`https://towardsdatascience.com/recurrent-neural-networks-and-lstm-4b601dd822a5`](https://towardsdatascience.com/recurrent-neural-networks-and-lstm-4b601dd822a5)


  RNN 能够记住输入中的重要部分，这使得它在处理语音、文本、时间序列、音频和视频等序列数据时表现出色。


  RNN 的一个局限性是其短期记忆。为了解决这个局限，RNN 可以与长短期记忆（LSTM）单元结合，这有效地使其也能够存储长期记忆。这些通常被称为 LSTM 网络。LSTM
  使 RNN 能够在较长时间内记住其输入。这种记忆被设计为一个门控单元（门可以打开或关闭），它可以根据信息的重要性决定存储（开门）或删除（关门）信息。图 11-6
  展示了一个典型的 LSTM 单元。


  ![../images/416805_2_En_11_Chapter/416805_2_En_11_Fig6_HTML.jpg](img/416805_2_En_11_Fig6_HTML.jpg)


  图 11-6


  LSTM 单元。来源：[`https://towardsdatascience.com/recurrent-neural-networks-and-lstm-4b601dd822a5`](https://towardsdatascience.com/recurrent-neural-networks-and-lstm-4b601dd822a5)


  在本章后面，我们将展示一个使用 LSTM 网络解决实际问题的演示，即使用 Quora 重复问题数据集来识别重复文本。


  ### 11.2.3 生成对抗网络（GAN）


  除了第 11.2.1 节中提到的流行的 AlexNet、VGG Net、GoogleNet、ResNet 和 SegNet 架构之外，我们将简要解释生成对抗网络（GAN），这是过去十年机器学习领域发展出的最有趣的想法之一。


  正如文章《生成对抗网络（GAN）初学者指南》[8] 所述，GAN 的潜力巨大，因为它们可以学习模仿任何数据分布。也就是说，可以教会 GAN 在任何领域（图像、音乐、语音和散文）创造出与我们自己的世界惊人相似的世界。从某种意义上说，它们是机器人艺术家，其输出令人印象深刻——甚至令人感动。


  GAN 基于生成算法。在第 6 章中，我们展示了多个判别算法的例子，这些算法试图根据输入特征对输入进行分类。例如，给定糖尿病数据集中的一条患者记录，判断该患者是否患有糖尿病。从数学上讲，这可以表示为
  P(Y|X)，其中 Y 是类别（是或否），X 是输入特征向量。在生成算法中，我们反转这种关系并问：“我们能否生成一个糖尿病患者的所有特征？”换句话说，假设一个人患有糖尿病，我们观察到给定输入特征的可能性有多大？


  因此，在 GAN 中，一个神经网络（我们称之为生成器）生成新的数据实例，而另一个神经网络（判别器）则决定它审查的每个数据实例是否属于实际的训练数据集。


  判别器模型是一个分类器，用于确定给定的图像看起来像是数据集中的真实图像，还是像人工创建的图像。这基本上是一个二元分类器，将采用普通 CNN 的形式。生成器模型接收随机输入值，并通过反卷积神经网络将其转换为图像。图
  11-7 展示了其架构。


  ![../images/416805_2_En_11_Chapter/416805_2_En_11_Fig7_HTML.jpg](img/416805_2_En_11_Fig7_HTML.jpg)


  图 11-7


  GAN 架构。来源：[`https://www.oreilly.com/learning/generative-adversarial-networks-for-beginners`](https://www.oreilly.com/learning/generative-adversarial-networks-for-beginners)


  GAN 在许多方面都是强大的概念，它们确实可以实现只有人类才能想到的能力。想象一下，一个 GAN 模型能够根据详细的文本描述生成逼真的鸟类和花卉图像。研究论文《生成对抗文本到图像合成》[10]
  展示了这一想法。该网络在辅助残障人士、室内装饰、生成创意艺术形式等各个领域都有着巨大的潜力。


  ## 11.3 深度学习工具集


  有许多工具和软件栈可用于在 CPU 或 GPU 硬件上构建深度学习模型。由于深度学习模型计算资源密集，近年来 GPU 的使用越来越多。为深度学习设计的各种软件都考虑到了算法的复杂性和计算需求。在本节中，我们将探讨可用于在真实世界的大规模数据集上构建深度学习模型的各种工具集。


  ### 11.3.1 高级库


  Keras 是开源高级神经网络 API 无可争议的选择，最初用 Python 编写。Keras 很快成为在许多后端引擎（将在下一节讨论）之上构建深度学习架构的事实标准，这些引擎包括
  TensorFlow、CNTK 和 Theano。它同时支持 CNN 和 RNN，并可在 CPU 和 GPU 机器上运行。


  使用 Keras 的详细文档可在 [`https://keras.io/`](https://keras.io/) 找到。


  除了 Keras，我们还有 Apache MXNet，这是一个为深度学习设计的库。尽管 MXNet 是一个全面且灵活的 Python API，但它并未获得开发者社区的足够兴趣以实现广泛使用。在本章的演示中，我们使用
  Keras，因为它提供了与 R 的无缝集成。


  ### 11.3.2 后端引擎或框架


  像 TensorFlow、Theano 和 CNTK 这样的后端引擎通常被称为用于数据流编程的软件库。某些参考资料也将这些引擎描述为机器学习框架。这些后端引擎为神经网络类架构对多维数据数组（如矩阵乘法）执行的操作提供了平台。在像
  TensorFlow 这样的框架中，计算被表示为有状态的数据流图，这使得在处理大量数据时非常高效，并且易于将计算部署到各种平台，如 CPU、GPU 或 TPU。


  在我们的演示中，我们将使用 TensorFlow 框架，它是这些引擎中最流行的。




  ### 11.3.3 硬件能力


  随着各种深度学习库和框架的发展，对更强大、更专业的处理硬件的需求也开始增长。从通用 CPU 到谷歌最新的张量处理单元（TPU），这些专用硬件设计都是根据深度学习网络所涉及的操作类型精心构建的。谷歌的
  TPU 专为高效、更快的输入输出而设计，以缩短模型训练所需的时间。


  图形处理单元（GPU）广泛应用于高清动画渲染和游戏系统，后被重新用于执行高速计算。在当前深度学习工作中，GPU 因其更快的模型训练速度而成为最受青睐的处理单元选择。


  ### 11.3.4 编程语言选择


  多年来，用于构建机器学习和深度学习模型的编程语言选择逐渐向 Python 靠拢。Python 的流行主要归功于其代码已为生产部署做好准备。它稳健可靠，被广泛认为与为速度和优雅而构建的传统编程语言（如
  C/C++）不相上下。


  为了保持全书的一致性，本章的所有演示均采用 R 语言。


  ### 11.3.5 云基础设施


  由于深度学习模型需要大量计算能力，个人基础设施中的普通硬件（如笔记本电脑或台式机）并不具备所需的能力。公共云中有许多选择，例如 Amazon AWS、Google
  Cloud 和 Microsoft Azure。为了本书中的演示，读者可以在 rstudio 博客中选择其中一个选项：[`https://blog.rstudio.com/2018/09/12/getting-started-with-deep-learning-in-r/`](https://blog.rstudio.com/2018/09/12/getting-started-with-deep-learning-in-r/)。


  不过，我们选择了一个示例数据集和问题，它们可以在中等配置的台式机或笔记本电脑系统上正常运行。请记住，所有云平台都涉及相关成本。在使用任何云平台之前，请仔细阅读定价结构。


  ## 11.4 用例：识别 Quora 上的重复问题


  2017 年，Quora 在 Kaggle（一个面向众多数据科学项目的在线平台）竞赛中提供了一个庞大的 Quora 问题对数据集，包含 404,000 个问题对。该竞赛的目标是构建最准确的模型，用于预测哪些问题对是重复的。对于像
  Quora 这样的平台，这将极大地帮助它们进行问题分类、分配等。这个问题对人类思维来说看似非常简单，但当涉及到机器理解一对问题的语义含义时，则涉及一个复杂的学习过程。那么，面对复杂问题，还有什么比深度学习更合适的呢？


  在接下来的 R 语言演示中，我们将引导您实现一个名为“孪生循环架构”的模型。我们要感谢 Daniel Falbel 在[`https://blogs.rstudio.com/tensorflow/posts/2018-01-09-keras-duplicate-questions-quora/`](https://blogs.rstudio.com/tensorflow/posts/2018-01-09-keras-duplicate-questions-quora/)
  [6]上发表的帖子《使用 Keras 对 Quora 重复问题进行分类》。


  ### 11.4.1 环境设置


  首先，我们需要安装 Keras 和 TensorFlow 作为后端。它们提供了数据预处理和模型构建所需的所有库：


  ```

  #安装 Keras

  install.packages("keras")

  library(keras)

  install_keras()

  #安装 TensorFlow 作为 Keras 的后端。默认使用 CPU，但您也可以指定"tensorflow = "gpu"

  install_keras(tensorflow)

  ```


  ### 11.4.2 数据预处理


  为了运行我们的模型，我们需要将数据准备成合适的格式。以下代码使用`keras`库中的`text_tokenizer`和`fit_text_tokenizer`方法将单词标记化为整数：


  ```

  #加载 keras

  library(keras)

  #数据可从以下地址下载

  #https://www.kaggle.com/c/quora-question-pairs/data

  quora_data <- read.csv("quora_duplicate_questions.tsv", sep = "\t", stringsAsFactors
  = FALSE)

  #初始化文本分词器，词汇量上限为 50000

  tokenizer <- text_tokenizer(num_words = 50000)

  #将分词器适配到问题 1 和问题 2 的唯一值上

  tokenizer %>% fit_text_tokenizer(unique(c(quora_data$question1, quora_data$question2)))

  #文本分词器，将每个 question1 和 question2 转换为整数列表

  question1 <- texts_to_sequences(tokenizer, quora_data$question1)

  question2 <- texts_to_sequences(tokenizer, quora_data$question2)

  ```


  在以下代码中，我们计算每个问题（单词数量）的长度。由于所有问题的长度并不相等，我们需要使用从 50001 开始的额外整数对单词列表进行填充（我们在分词过程中使用了整数
  1 到 50000）。填充操作将序列归一化为相同大小，以便我们可以将它们输入模型。


  ```

  library(purrr)

  questions_length <- c(

  map_int(question1, length),

  map_int(question2, length)

  )

  ```


  从分位数可以看出，99%的问题长度最多为 31，因此我们可以选择 15 到 30 之间的填充长度。我们可以先选择 20（稍后也可以调整此参数）。


  ```

  #80%、90%、95%和 99%分位数

  quantile(questions_length, c(0.8, 0.9, 0.95, 0.99))

  80%   90%   95%   99%

  14.00 18.00 23.00 30.01

  '
- "# 填充长度 = 20\nquestion1_padded <- pad_sequences(question1, maxlen = 20, value =\
  \ 50000 + 1)\nquestion2_padded <- pad_sequences(question2, maxlen = 20, value =\
  \ 50000 + 1)\n```\n\n### 11.4.3 基准模型\n\n为了评估这个深度学习模型的优越性，让我们使用逻辑回归构建一个非常粗略的基准模型，并讨论其局限性。\n\
  \n我们将创建两个预测变量（输入变量）：问题 1 中的单词出现在问题 2 中的百分比，反之亦然。然后，我们将使用逻辑回归来预测问题是否为重复（是或否）。\n\n\
  ```\npercentage_words_question1 <- map2_dbl(question1, question2, ~ mean(.x %in%\
  \ .y))\npercentage_words_question2 <- map2_dbl(question2, question1, ~ mean(.x %in%\
  \ .y))\n#创建数据框\nquora_logit_model <- data.frame(\n  is_duplicate = quora_data$is_duplicate,\n\
  \  percentage_words_question1 = percentage_words_question1,\n  percentage_words_question2\
  \ = percentage_words_question2\n) %>% na.omit()\n#使用这些输入变量，我们将创建逻辑模型。我们将取 10%的数据作为验证样本。\n\
  val_sample <- sample.int(nrow(quora_logit_model), size = 0.1 * nrow(quora_logit_model))\n\
  quora_logit_model_train <- quora_logit_model[-val_sample, ]\nquora_logit_model_test\
  \ <- quora_logit_model[val_sample, ]\n#训练逻辑回归模型\nlogit_model <- glm(is_duplicate\
  \ ~ ., data = quora_logit_model_train, family = binomial())\n#在测试集上进行预测\npredictions\
  \ <- predict(logit_model, quora_logit_model_test, type = \"response\")\npredictions_class\
  \ <- ifelse(predictions > 0.5, 1, 0)\n#计算准确率\naccuracy <- mean(predictions_class\
  \ == quora_logit_model_test$is_duplicate)\naccuracy\n## [1] 0.65\n#或者，使用以下代码计算准确率\n\
  accuracy <- table(quora_logit_model$is_duplicate[-val_sample], predict(logit_model,\
  \ type = \"response\") > 0.5) %>%\n  prop.table() %>%\n  diag() %>%\n  sum()\naccuracy\n\
  ## [1] 0.75\n```\n\n我们得到了大约 65%的准确率。这比随机猜测略好。现在让我们看看深度学习模型的表现如何。\n\n### 11.4.4 孪生循环架构\n\
  \n我们将基于研究论文《用于学习句子相似度的孪生循环架构》使用孪生网络来预测问题对是否重复。这是一种特殊类型的神经网络，其中神经网络不是学习对其输入进行分类，而是学习区分两个输入。\n\
  \n\n\n#### 11.4.4.1 长短期记忆网络的孪生适配\n\n针对由成对变长序列组成的标记数据，应用长短期记忆（LSTM）网络来评估问题之间的语义相似度（这与我们在上一节中看到的采用词对词相似度的逻辑回归不同）。\n\
  \n图 11-8 展示了由两个相似神经网络组成的孪生网络，每个网络分别处理两个输入问题中的一个。随后，这两个网络的最后一层被输入到一个对比损失函数中（这与分类问题中通常采用交叉熵损失函数不同）。这两个姊妹网络完全相同，且权重也完全一致。\n\
  \n![../images/416805_2_En_11_Chapter/416805_2_En_11_Fig8_HTML.jpg](img/416805_2_En_11_Fig8_HTML.jpg)\n\
  \n图 11-8\n\n孪生架构。来源：[`https://hackernoon.com/one-shot-learning-with-siamese-networks-in-pytorch-8ddaab10340e`](https://hackernoon.com/one-shot-learning-with-siamese-networks-in-pytorch-8ddaab10340e)\n\
  \n#### 11.4.4.2 构建孪生架构\n\n以下代码将构建孪生架构的各个层。\n\n##### 11.4.4.2.1 模型输入\n\n```\ninput1\
  \ <- layer_input(shape = c(20), name = \"input_question1\")\ninput2 <- layer_input(shape\
  \ = c(20), name = \"input_question2\")\n```\n\n##### 11.4.4.2.2 将问题嵌入向量\n\n```\n\
  word_embedder <- layer_embedding(\ninput_dim = 50000 + 2, # 词汇表大小 + UNK 标记 + 填充值\n\
  output_dim = 128,      # 超参数 - 嵌入维度\ninput_length = 20,     # 填充长度,\nembeddings_regularizer\
  \ = regularizer_l2(0.0001) # 超参数 – 正则化\n)\n```\n\n##### 11.4.4.2.3 LSTM 层\n\n```\n\
  seq_embedder <- layer_lstm(\nunits = 128, # 超参数 -- 序列嵌入维度\nkernel_regularizer =\
  \ regularizer_l2(0.0001) # 超参数 - 正则化\n)\n```\n\n##### 11.4.4.2.4 嵌入层\n\n定义输入向量与嵌入层之间的关系。这里我们在两个输入上使用相同的层和权重——即孪生网络。即使我们交换\
  \ question1 和 question2，该架构也能确保我们不会得到两个不同的输出：\n\n```\nvector1 % word_embedder()\
  \ %>% seq_embedder()\nvector2 % word_embedder() %>% seq_embedder()\n```\n\n#####\
  \ 11.4.4.2.5 余弦相似度\n\n使用余弦相似度。语法表明这是两个向量的点积，未包含归一化部分。\n\n```\ncosine_similarity\
  \ <- layer_dot(list(vector1, vector2), axes = 1)\n```\n\n##### 11.4.4.2.6 Sigmoid\
  \ 层\n\n最后的 sigmoid 层用于输出两个问题相同的概率：\n\n```\noutput %\nlayer_dense(units = 1, activation\
  \ = \"sigmoid\")\n```\n\n### 11.4.5 Keras 模型\n\nKeras 模型根据其输入和输出进行定义。该模型最小化 *logloss*，这相当于使用\
  \ Adam 优化器最小化二元交叉熵。\n\n```\nmodel % compile(\noptimizer = \"adam\",\nmetrics = list(acc\
  \ = metric_binary_accuracy),\nloss = \"binary_crossentropy\"\n)\n```\n\n### 11.4.6\
  \ 模型摘要\n\n```\nsummary(model)\n______________________________________________________________\n\
  Layer (type)        Output Shape  Param  Connected to\n==============================================================\n\
  input_question1 (In (None, 20)    0\n______________________________________________________________\n\
  input_question2 (In (None, 20)    0\n______________________________________________________________\n\
  embedding_3 (Embedd (None, 20, 12 640025 input_question1[0][0]\ninput_question2[0][0]\n\
  ______________________________________________________________\nlstm_3 (LSTM)  \
  \     (None, 128)   131584 embedding_3[0][0]\nembedding_3[1][0]\n______________________________________________________________\n\
  dot_3 (Dot)         (None, 1)     0      lstm_3[0][0]\nlstm_3[1][0]\n______________________________________________________________\n\
  dense_4 (Dense)     (None, 1)     2      dot_3[0][0]\n==============================================================\n\
  Total params: 6,531,842\nTrainable params: 6,531,842\nNon-trainable params: 0\n\
  ______________________________________________________________\n```\n\n### 11.4.7\
  \ 验证样本\n\n模型拟合前的验证样本：\n\n```\nset.seed(1817328)\nval_sample <- sample.int(nrow(question1_padded),\
  \ size = 0.1*nrow(question1_padded))\ntrain_question1_padded <- question1_padded[-val_sample,]\n\
  train_question2_padded <- question2_padded[-val_sample,]\ntrain_for_duplicate <-\
  \ quora_data$is_duplicate[-val_sample]\nval_question1_padded <- question1_padded[val_sample,]\n\
  val_question2_padded <- question2_padded[val_sample,]\nval_is_duplicate <- quora_data$is_duplicate[val_sample]\n\
  ```\n\n### 11.4.8 训练模型\n\n我们使用 `fit()` 函数来训练模型。该函数接收填充后的 question1 和 question2，以及批次大小、训练轮数和验证数据集等参数。\n\
  \n```\nmodel %>% fit(\nlist(train_question1_padded, train_question2_padded),\ntrain_for_duplicate,\n\
  batch_size = 64,\nepochs = 10,\nvalidation_data = list(\nlist(val_question1_padded,\
  \ val_question2_padded),\nval_is_duplicate\n)\n)\nTrain on 363861 samples, validate\
  \ on 40429 samples\nEpoch 1/10\n363861/363861 [==============================] -\
  \ 2010s 6ms/step - loss: 0.5807 - acc: 0.7447 - val_loss: 0.5424 - val_acc: 0.7732\n\
  Epoch 2/10\n363861/363861 [==============================] - 1894s 5ms/step - loss:\
  \ 0.5254 - acc: 0.7835 - val_loss: 0.5150 - val_acc: 0.7900\nEpoch 3/10\n363861/363861\
  \ [==============================] - 1845s 5ms/step - loss: 0.4999 - acc: 0.7986\
  \ - val_loss: 0.5015 - val_acc: 0.7960\nEpoch 4/10\n363861/363861 [==============================]\
  \ - 1841s 5ms/step - loss: 0.4812 - acc: 0.8099 - val_loss: 0.4882 - val_acc: 0.8044\n\
  Epoch 5/10\n363861/363861 [==============================] - 1838s 5ms/step - loss:\
  \ 0.4672 - acc: 0.8175 - val_loss: 0.4844 - val_acc: 0.8069\nEpoch 6/10\n363861/363861\
  \ [==============================] - 1851s 5ms/step - loss: 0.4565 - acc: 0.8233\
  \ - val_loss: 0.4804 - val_acc: 0.8105\nEpoch 7/10\n363861/363861 [==============================]\
  \ - 1859s 5ms/step - loss: 0.4481 - acc: 0.8291 - val_loss: 0.4762 - val_acc: 0.8116\n\
  Epoch 8/10\n363861/363861 [==============================] - 1855s 5ms/step - loss:\
  \ 0.4413 - acc: 0.8338 - val_loss: 0.4767 - val_acc: 0.8147\nEpoch 9/10\n363861/363861\
  \ [==============================] - 1840s 5ms/step - loss: 0.4343 - acc: 0.8385\
  \ - val_loss: 0.4726 - val_acc: 0.8173\nEpoch 10/10\n363861/363861 [==============================]\
  \ - 1847s 5ms/step - loss: 0.4278 - acc: 0.8420 - val_loss: 0.4695 - val_acc: 0.8189\n\
  ```\n\n### 11.4.9 保存模型\n\n我们可以使用 `save_model_hdf5()` 函数保存模型以供推理使用。\n\n```\nsave_model_hdf5(model,\
  \ \"model-question-pairs.hdf5\")\n```\n\n### 11.4.10 模型性能\n\n我们可以观察到，基于 LSTM 的深度学习模型性能远优于我们的基准逻辑回归模型。尽管我们在\
  \ 10 个 epoch 后停止了训练，但似乎如果再多运行 `fit()` 几个 epoch，准确率可能会随着损失下降而进一步提高。图 11-9 中训练数据损失和验证损失两条线的接近程度表明没有出现过拟合或欠拟合的迹象，这是一个好现象。通过观察图\
  \ 11-9 下方的训练和验证准确率图，也可以得出同样的结论。\n\n![../images/416805_2_En_11_Chapter/416805_2_En_11_Fig9_HTML.jpg](img/416805_2_En_11_Fig9_HTML.jpg)\n\
  \n图 11-9\n\n模型拟合过程中的模型性能\n\n\n\n### 11.4.11 进行预测\n\n模型训练完成后，我们可以用它来进行预测。在使用模型进行预测之前，我们需要执行与训练时相同的预处理步骤。评分（score）表示相似度的概率。\n\
  \n```\nlibrary(keras)\nmodel <- load_model_hdf5(\"model-question-pairs.hdf5\", compile\
  \ = FALSE)\ntokenizer <- load_text_tokenizer(\"tokenizer-question-pairs\")\npredict_question_pairs\
  \ <- function(model, tokenizer, question1, question2) {\nquestion1 <- texts_to_sequences(tokenizer,\
  \ list(question1))\nquestion2 <- texts_to_sequences(tokenizer, list(question2))\n\
  question1 <- pad_sequences(question1, 20)\nquestion2 <- pad_sequences(question2,\
  \ 20)\nas.numeric(predict(model, list(question1, question2)))\n}\n```\n\n### 11.4.12\
  \ 预测示例\n\n我们可以传入不同的问句对来观察模型的表现：\n\n```\npredict_question_pairs(\nmodel,\ntokenizer,\n\
  \"什么是机器学习？\",\n\"什么是深度学习？\"\n)\n[1] 0.475016\n#示例 2\npredict_question_pairs(\nmodel,\n\
  tokenizer,\n\"什么是机器学习\",\n\"什么是机器学习算法\"\n)\n[1] 0.499557\n#示例 2\npredict_question_pairs(\n\
  model,\ntokenizer,\n\"什么是机器学习\",\n\"什么是机器学习算法\"\n)\n[1] 0.5062091\n```\n\n我们可以观察到，随着问句之间文本相似度的提高，评分也随之提升。该算法甚至能很好地处理问句的语义含义。然而，为了进一步提高模型的准确率，我们需要增加训练轮数或调整超参数。正如我们在\
  \ PEBE 模型构建流程中讨论的那样，整个模型优化的过程需要反复试错，才能最终确定最佳模型。\n\n我们也鼓励读者探索模型超参数调优，这将进一步提升模型准确率。你可以进一步参考\
  \ Daniel Falbel [11] 关于超参数调优的代码。请记住，超参数调优可能需要大量的计算资源。可以考虑使用本章前面提到的一些云平台。\n\n## 11.5\
  \ 总结\n\n在本书的最后一章中，我们简要介绍了各种深度学习架构，并展示了一个基于自定义 LSTM 深度学习架构的真实世界用例。这种模块化的深度学习架构实验方式使得深度学习领域变得有趣，并引领了解决复杂问题的新浪潮。世界各地的研究人员不断提出众多创新的架构，其数量与日俱增。我们也希望在未来的几年里，各种深度学习模型的实现能够同样适用于\
  \ R 和 Python。\n\n### 索引\n\n### A\n\nAkaike 信息准则 (AIC) 美国统计协会 (ASA) Apache Pig IBM\
