  ```\n\n观察图形，我们可以看到我们选择的截断点将在训练数据上提供最佳分类。我们需要在测试数据上检验这个假设，并使用 0.42 这个截断点记录分类率。\n\n\
  ```\n# 预测测试数据的概率并应用截断点\npredict_prob <- predict(Model_logistic, test, type = \"\
  response\")\nclass_pred <- ifelse(predict_prob > 0.41,1,0)\n#分类表\ntable(test$choice,class_pred)\n\
  class_pred\n     0     1\n0 24605 18034\n1  8364 23134\n#分类率\nsum(diag(table(test$choice,class_pred))/nrow(test))\n\
  [1] 0.6439295\n```\n\n该模型在测试数据上显示出 64%的良好分类率。这表明模型能够很好地捕捉数据中的信号，以区分 0 和 1。\n\n逻辑模型的诊断方法与线性回归模型不同。在以下小节中，我们将探讨逻辑回归的一些常见诊断指标。\n\
  \n### 6.5.9 模型诊断：逻辑回归\n\n一旦我们拟合了模型，就需要对逻辑回归输出进行两步分析：\n\n1.  如果我们对最终的类别分配感兴趣，则应关注分类器，并比较通过分类器对预测概率进行分配后得到的实际类别。\n\
  \n2.  如果我们对概率感兴趣，则应关注那些事件发生几率高且获得高概率的案例。\n\n除此之外，我们还需要查看系数、R 平方等价指标以及其他检验，以验证我们的模型在统计上是否有效。在查看系数时，另一个需要牢记的重要事项是：逻辑回归系数表示预测变量每变化一个单位时`logit`的变化量，这与线性回归不同。\n\
  \n我们将展示如何执行三种诊断检验——沃尔德检验、似然比检验以及偏差/伪 R 平方——以及三种分离度量方法：双变量图、增益/提升图和一致性比率。\n\n####\
  \ 6.5.9.1 沃尔德检验\n\n沃尔德检验类似于线性回归中的 t 检验。它用于评估给定模型中各个预测变量的贡献。\n\n在逻辑回归中，沃尔德统计量为\n\n\
  ![$$ {W}_j=\\frac{\\beta_j²}{S{E}_{\\beta_j}²} $$](img/416805_2_En_6_Chapter_TeX_Equad.png)\n\
  \n其中β是系数，SE 是系数β的标准误差。\n\n沃尔德统计量是回归系数平方与系数标准误差平方的比值，它服从卡方分布。显著的沃尔德统计量意味着该预测变量/自变量在模型中显著。\n\
  \n让我们对`MembershipPoints`执行沃尔德检验，看看它在模型中是否显著。\n\n```\n#沃尔德检验\nlibrary(survey)\nregTermTest(Model_logistic,\"\
  MembershipPoints\", method =\"Wald\")\nMembershipPoints 的沃尔德检验\n在 glm(formula =\
  \ choice ~ MembershipPoints + IncomeClass + CustomerPropensity +\nLastPurchaseDuration,\
  \ family = binomial(link = \"logit\"),\ndata = train)中\nF =  31.64653  on  12  and\
  \  172960  df: p= < 2.22e-16\n```\n\np 值小于 0.05，因此在 95%的置信水平下，我们可以拒绝系数值为零的原假设。因此，`MembershipPoints`是模型中一个统计上显著的变量。\n\
  \n\n\n#### 6.5.9.2 偏差\n\n偏差是通过比较零模型和饱和模型计算得出的。零模型是不包含任何预测变量、仅含截距项的模型，而饱和模型则是包含若干预测变量的拟合模型。在逻辑回归中，偏差用于替代平方和计算。检验统计量（通常记为\
  \ D）是似然比对数的两倍，即两个对数似然值之差的两倍：\n\n偏差\n\n![$$ D=-2\\ln \\frac{\\mathrm{likelihood}\\\
  \ \\mathrm{of}\\ \\mathrm{the}\\ \\mathrm{fitted}\\ \\mathrm{model}}{\\mathrm{likelihood}\\\
  \ \\mathrm{of}\\ \\mathrm{the}\\ \\mathrm{saturated}\\ \\mathrm{model}} $$](img/416805_2_En_6_Chapter_TeX_Equae.png)\n\
  \n偏差统计量 (D) 服从卡方分布。数值越小表示拟合效果越好，因为拟合模型与饱和模型的偏差越小。\n\n以下是偏差分析表。\n\n```\n#Anova table\
  \ of significance\nanova(Model_logistic, test=\"Chisq\")\nAnalysis of Deviance Table\n\
  Model: binomial, link: logit\nResponse: choice\nTerms added sequentially (first\
  \ to last)\nDf Deviance Resid. Df Resid. Dev  Pr(>Chi)\nNULL                   \
  \             172985     235658\nMembershipPoints     12    330.6    172973    \
  \ 235328 < 2.2e-16 ***\nIncomeClass           8    339.1    172965     234989 <\
  \ 2.2e-16 ***\nCustomerPropensity    4  18297.4    172961     216691 < 2.2e-16 ***\n\
  LastPurchaseDuration  1   2826.9    172960     213864 < 2.2e-16 ***\n\nSignif. codes:\
  \  0 '***' 0.001 '**' 0.01 '*' 0.05 '.' 0.1 ' ' 1\n```\n\n所有变量的卡方检验均显著，因为 p 值小于\
  \ 0.05。所有预测变量对模型的贡献都是显著的。\n\n#### 6.5.9.3 伪 R 方\n\n在线性回归中，我们有 R 方度量（详见第 7 章），它衡量模型独立解释的方差比例。逻辑回归中类似的度量称为伪\
  \ R 方。其中最流行的一种使用了似然比，表示如下：\n\n![$$ {R}_{\\mathrm{L}}²=\\frac{D_{\\mathrm{null}}-{D}_{\\\
  mathrm{fitted}}}{D_{\\mathrm{null}}}. $$](img/416805_2_En_6_Chapter_TeX_Equaf.png)\n\
  \n它是零模型偏差与拟合模型偏差之差除以零模型偏差的比值。该度量值越高，模型的解释力越强。本章不讨论其他类似的度量，如 Cox 和 Snell R 方、Nagelkerke\
  \ R 方、McFadden R 方以及 Tjur R 方。这里我们计算模型的伪 R 方。\n\n```\n# R square equivalent for\
  \ logistic regression\nlibrary(pscl)\npR2(Model_logistic)\nllh       llhNull   \
  \         G2      McFadden          r2ML\n-1.069321e+05 -1.178291e+05  2.179399e+04\
  \  9.248135e-02  1.183737e-01\nr2CU\n1.591199e-01\n```\n\n该函数输出的最后三个值分别是 McFadden\
  \ 伪 R 方、最大似然伪 R 方（Cox & Snell）以及 Cragg 和 Uhler 或 Nagelkerke 伪 R 方。R 方值非常低，表明该模型的性能可能并不优于零模型。\n\
  \n#### 6.5.9.4 双变量图\n\n逻辑回归最重要的诊断方法是观察每个单一自变量各水平下实际概率与预测概率的表现。这些图被称为*双变量*图，因为有两个变量——实际值和预测值——针对单一自变量的各个水平进行绘制。该图包含三个重要输入：\n\
  \n*   *实际概率：* 自变量每个类别中目标水平的先验比例。\n*   *预测概率：* 模型给出的概率。\n*   *频数：* 分类变量的频数（观测数量）。\n\
  \n该图本质上告诉我们模型在分类变量不同水平上的表现如何。你也可以通过对连续变量进行分箱处理，将此思路扩展到连续变量。\n\n这些图的另一个优点是，你可以确定数据集中模型在哪个群组上表现更好，以及哪个群组需要进一步研究。这种群组级别的诊断无法通过查看聚合图来实现。\n\
  \n```\n#The function code is provided separately in the appendix\nsource(\"actual_pred_plot.R\"\
  )\nMODEL_PREDICTION <-predict(Model_logistic, Data_Logistic, type ='response');\n\
  Data_Logistic$MODEL_PREDICTION <-MODEL_PREDICTION\n#Print the plots MembershipPoints\n\
  actual_pred_plot  (var.by=as.character(\"MembershipPoints\"),\nvar.response='choice',\n\
  data=Data_Logistic,\nvar.predict.current='MODEL_PREDICTION',\nvar.predict.reference=NULL,\n\
  var.split=NULL,\nvar.by.buckets=NULL,\nsort.factor=FALSE,\nerrorbars=FALSE,\nsubset.to=FALSE,\n\
  barline.ratio=1,\ntitle=\"Actual vs. Predicted Purchase Rates\",\nmake.plot=TRUE\n\
  )\n```\n\n图 6-27 展示了实际值与预测值相对于 `MembershipPoints` 频数图的对比。\n\n![../images/416805_2_En_6_Chapter/416805_2_En_6_Fig27_HTML.jpg](img/416805_2_En_6_Fig27_HTML.jpg)\n\
  \n图 6-27\n\n实际值与预测值相对于 MembershipPoints 的对比图\n\n对于 `MembershipPoints`，实际概率和预测概率相互吻合。这意味着模型预测的概率接近实际值。此外，你可以看到，在这两种情况下，拥有较高\
  \ `MembershipPoints` 的客户选择产品 = 1 的可能性较低，这与实际和预测结果一致。\n\n```\n#Print the plots IncomeClass\n\
  actual_pred_plot  (var.by=as.character(\"IncomeClass\"),\nvar.response='choice',\n\
  data=Data_Logistic,\nvar.predict.current='MODEL_PREDICTION',\nvar.predict.reference=NULL,\n\
  var.split=NULL,\nvar.by.buckets=NULL,\nsort.factor=FALSE,\nerrorbars=FALSE,\nsubset.to=FALSE,\n\
  barline.ratio=1,\ntitle=\"Actual vs. Predicted Purchase Rates\",\nmake.plot=TRUE\n\
  )\n```\n\n图 6-28 展示了实际值与预测值相对于 `IncomeClass` 频数图的对比。\n\n![../images/416805_2_En_6_Chapter/416805_2_En_6_Fig28_HTML.jpg](img/416805_2_En_6_Fig28_HTML.jpg)\n\
  \n图 6-28\n\n实际值与预测值相对于 IncomeClass 的对比图\n\n同样，模型在 `IncomeClass` 上的表现符合预期。该模型能够像实际观测到的比率一样，预测不同收入阶层下的概率。\n\
  \n```\n#Print the plots CustomerPropensity\nactual_pred_plot  (var.by=as.character(\"\
  CustomerPropensity\"),\nvar.response='choice',\ndata=Data_Logistic,\nvar.predict.current='MODEL_PREDICTION',\n\
  var.predict.reference=NULL,\nvar.split=NULL,\nvar.by.buckets=NULL,\nsort.factor=FALSE,\n\
  errorbars=FALSE,\nsubset.to=FALSE,\nbarline.ratio=1,\ntitle=\"Actual vs. Predicted\
  \ Purchase Rates\",\nmake.plot=TRUE\n)\n```\n\n图 6-29 展示了实际值与预测值相对于 `CustomerPropensity`\
  \ 频数图的对比。\n\n![../images/416805_2_En_6_Chapter/416805_2_En_6_Fig29_HTML.jpg](img/416805_2_En_6_Fig29_HTML.jpg)\n\
  \n图 6-29\n\n实际值与预测值相对于 CustomerPropensity 的对比图\n\n模型在 `CustomerPropensity` 上也与观测概率表现出良好的一致性。在对模型中的连续变量进行适当分箱后，也可以绘制类似的图。至少在分类变量上，模型表现良好。\n\
  \n该模型在不同分类变量水平上均显示出良好的预测值与实际值匹配度。从概率尺度来看，这是一个好模型！\n\n\n\n#### 6.5.9.5 累积增益图与提升图\n\
  \n累积增益图和提升图是衡量预测模型有效性的可视化方法。它们包含一条基线以及由预测模型生成的提升曲线。基线与预测（提升）曲线之间的分离程度越大，模型效果越好。\n\
  \n在增益图中：\n\nX 轴：客户百分比\n\nY 轴：正向预测百分比\n\n基线：随机线（x%的客户产生 x%的正向预测）\n\n增益：对应客户百分比的正向响应百分比\n\
  \n在提升图中：\n\nX 轴：客户百分比\n\nY 轴：实际提升度（模型预测结果与无模型结果之比）\n\n```\nlibrary(gains)\nlibrary(ROCR)\n\
  library(calibrate)\nMODEL_PREDICTION <-predict(Model_logistic, Data_Logistic, type\
  \ ='response');\nData_Logistic$MODEL_PREDICTION <-MODEL_PREDICTION;\nlift =with(Data_Logistic,\
  \ gains(actual = Data_Logistic$choice, predicted = Data_Logistic$MODEL_PREDICTION\
  \ , optimal =TRUE));\npred =prediction(MODEL_PREDICTION,as.numeric(Data_Logistic$choice));\n\
  # 用于创建性能对象的函数。所有类型的预测器评估均通过此函数执行。\ngains =performance(pred, 'tpr', 'rpp');\n# tpr:\
  \ 真正率\n# rpp: 正向预测率\nauc =performance(pred, 'auc');\nauc =unlist(slot(auc, 'y.values'));\
  \ # 等同于：auc@y.values[[1]]\nauct =paste(c('AUC = '), round(auc, 2), sep =\")\n#par(mfrow=c(1,2),\
  \ mar=c(6,5,4,2));\nplot(gains, col=\"red\", lwd=2, xaxs=\"i\", yaxs=\"i\", main\
  \ =paste('Gains Chart ', sep =\"),ylab='% of Positive Response', xlab='% of customers/population');\n\
  axis(side =1, pos =0, at =seq(0, 1, by =0.10));\naxis(side =2, pos =0, at =seq(0,\
  \ 1, by =0.10));\nlines(x=c(0,1), y=c(0,1), type=\"l\", col=\"black\", lwd=2,\n\
  ylab='% of Positive Response', xlab='% of customers/population');\nlegend(0.6, 0.4,\
  \ auct, cex =1.1, box.col ='white')\ngains =lift$cume.pct.of.total\ndeciles =length(gains);\n\
  for (j in 1:deciles)\n{\nx =0.1;\ny =as.numeric(as.character(gains[[j]]));\nlines(x\
  \ =c(x*j, x*j),\ny =c(0, y),\ntype ='l', col ='blue', lwd =1);\nlines(x =c(0, 0.1*j),\n\
  y =c(y, y),\ntype ='l', col ='blue', lwd =1);\n# 在指定十分位处添加真正率的精确数值以标注图表。\ntextxy(0,\
  \ y, paste(round(y,2)*100, '%',sep=\"), cex=0.9);\n}\n```\n\n图 6-30 是我们模型的增益图。该图以正向响应百分比为\
  \ Y 轴，以总体百分比为 X 轴绘制。\n\n![../images/416805_2_En_6_Chapter/416805_2_En_6_Fig30_HTML.jpg](img/416805_2_En_6_Fig30_HTML.jpg)\n\
  \n图 6-30\n\n含 AUC 的增益图\n\n```\nplot(lift,\nxlab ='% of customers/population',\n\
  ylab ='Actual Lift',\nmain =paste('Lift Chart \\n', sep =' '),\nxaxt ='n');\naxis(side\
  \ =1, at =seq(0, 100, by =10), las =1, hadj =0.4);\n```\n\n图 6-31 是我们模型的提升图。该图以实际提升度为\
  \ Y 轴，以总体百分比为 X 轴绘制。\n\n![../images/416805_2_En_6_Chapter/416805_2_En_6_Fig31_HTML.jpg](img/416805_2_En_6_Fig31_HTML.jpg)\n\
  \n图 6-31\n\n提升图\n\n增益图显示模型线与基线之间存在良好的分离。这表明模型具有良好的区分能力。此外，AUC 值为 0.7 意味着该模型能够大致区分\
  \ 70%的案例。\n\n提升图显示，对于前 10%的总体，提升度接近 70%。该值应与我们在增益图中观察到的结果一致，只是呈现方式不同。\n\n#### 6.5.9.6\
  \ 一致性与不一致性比率\n\n在任何基于原始概率的分类模型中，都需要一种分类方法来区分这些概率案例。在二元逻辑回归中，这通常通过选择一个临界值，然后创建一个不等式将对象分类为\
  \ 0 或 1 来实现。\n\n为了确保存在这样的临界值且具有良好的区分能力，我们必须检查数据中实际状态为 1 的对象是否比实际状态为 0 的对象具有更高的概率。例如，一对(Yi,Yj)为(0,1)，则预测值(Pi,Pj)应满足\
  \ Pj>Pi，这样我们就可以在 Pj 和 Pi 之间选择一个数值，从而正确地将 1 分类为 1，0 分类为 0。基于此理解，我们可以将数据中所有可能的配对分为三类：\n\
  \n*   *一致对：* 对于(0,1)或(1,0)，对应的概率中 1 的概率大于 0 的概率\n*   *不一致对：* 对于(0,1)或(1,0)，对应的概率中\
  \ 0 的概率大于 1 的概率\n*   **结：** (0,0)和(1,0)配对\n\n一致性比率定义为一致对数量与总配对数的比值。如果我们的模型产生较高的一致性比率，那么它将能够更准确地将对象分类到各个类别中。\n\
  \n```\n# 函数代码单独提供在第六章的 R 代码中\nsource(\"concordance.R\")\n# 调用一致性函数获取这些比率\nconcordance(Model_logistic)\n\
  $Concordance\n[1] 0.7002884\n$Discordance\n[1] 0.2991384\n$Tied\n[1] 0.0005731122\n\
  $Pairs\n[1] 7302228665\n```\n\n一致性为 69.9%，表明模型概率在约 70%的案例上具有良好的区分度。这是一个用于创建 0 和\
  \ 1 分类器的良好模型。\n\n在本节关于逻辑回归模型诊断的内容中，我们大致从两个维度讨论了诊断方法：模型拟合统计量和模型分类能力。模型拟合统计量讨论了 Wald\
  \ 检验（参数估计的显著性检验）、偏差（类似于线性回归中的残差）以及伪 R 平方（相当于线性回归中的 R 平方）。另一组诊断方法用于识别模型是否可用于创建强大的分类器。所包含的检验包括：双变量图（实际概率与预测概率的图）、累积增益图和提升图（展示模型区分两个类别的能力），以及一致性比率（告诉我们是否为分类器找到了良好的临界值）。这些诊断方法为我们提供了模型的重要属性，并帮助建模者改进或重新估计模型。\n\
  \n在下一节中，我们将转向多类分类问题。多类问题是最难解决的问题之一，因为类别数量越多，模糊性越强。在许多情况下，很难创建良好的分类器。我们将讨论使用机器学习进行多类分类的多种方法。多项逻辑回归是进行多类分类的流行方法之一。\n\
  \n\n\n### 6.5.10 多项逻辑回归\n\n当分类问题涉及多个类别时，我们使用多项逻辑回归。在这种情况下，因变量服从多项分布。在后台，我们为每个类别创建一个逻辑模型，然后通过将所有概率之和约束为\
  \ 1 的概率条件，将这些模型合并成一个单一的方程。多项逻辑回归的方程设置如下所示：\n\n![$$ {\\displaystyle \\begin{array}{cc}\\\
  Pr \\left({Y}_i=1\\right)&amp; =\\frac{e^{\\beta_1\\cdot {\\mathrm{X}}_i}}{1+\\\
  sum \\limits_{k=1}^{K-1}{e}^{\\beta_k\\cdot {\\mathrm{X}}_i}}\\\\ {}\\Pr \\left({Y}_i=2\\\
  right)&amp; =\\frac{e^{\\beta_2\\cdot {\\mathrm{X}}_i}}{1+\\sum \\limits_{k=1}^{K-1}{e}^{\\\
  beta_k\\cdot {\\mathrm{X}}_i}}\\\\ {}\\cdots &amp; \\cdots \\\\ {}\\Pr \\left({Y}_i=K-1\\\
  right)&amp; =\\frac{e^{\\beta_{K-1}\\cdot {\\mathrm{X}}_i}}{1+\\sum \\limits_{k=1}^{K-1}{e}^{\\\
  beta_k\\cdot {\\mathrm{X}}_i}}\\end{array}} $$](img/416805_2_En_6_Chapter_TeX_Equag.png)\n\
  \n估计过程对单个`logit`变换有额外的约束，所有`logit`函数的概率之和必须为 1。由于估计必须考虑这个约束，因此估计方法是一个迭代过程。模型的最佳系数是通过对`logLoss`函数进行迭代优化来找到的。\n\
  \n对于我们的购买预测问题，首先我们将在数据上拟合一个逻辑模型。`nnet`包中的`multinom()`函数将用于为我们的多类问题（`ProductChoice`有四个可能的选项）估计逻辑方程。一旦我们得到每个类别的概率，我们将创建一个分类器来为各个案例分配类别。\n\
  \n这里将演示两种分类器方法：\n\n*   *选取最高概率：* 在所有可能的类别中选取概率最高的那个。然而，这种技术存在类别不平衡问题。当高比例类别的先验分布驱动预测概率时，就会出现类别不平衡，从而导致低比例类别永远无法通过预测概率的最大值被分配到该类别。\n\
  \n*   *概率比率：* 我们可以计算预测概率与先验分布的比率，然后根据最高比率选择一个类别。最高比率意味着模型捕捉到了最强的信号，因为概率已经通过先验比例进行了归一化。\n\
  \n让我们拟合一个模型并应用这两种分类器。\n\n```\n#移除包含 NA 的数据。NA 在建模算法中被忽略\nData_Purchase<-na.omit(Data_Purchase_Prediction)\n\
  rownames(Data_Purchase)<-NULL\n#为简化计算进行随机抽样\nData_Purchase_Model <-Data_Purchase[sample(nrow(Data_Purchase),10000),]\n\
  print(\"产品的分布如下\")\n[1] \"产品的分布如下\"\ntable(Data_Purchase_Model$ProductChoice)\n\
  1    2    3    4\n2192 3883 2860 1065\n#拟合一个多项逻辑回归模型\nlibrary(nnet)\nmnl_model <-multinom\
  \ (ProductChoice ~MembershipPoints +IncomeClass +CustomerPropensity +LastPurchaseDuration\
  \ +CustomerAge +MartialStatus, data = Data_Purchase)\n# weights:  44 (30 variable)\n\
  initial  value 672765.880864\niter  10 value 615285.850873\niter  20 value 607471.781374\n\
  iter  30 value 607231.472034\nfinal  value 604217.503433\nconverged\n#显示模型统计摘要\n\
  mnl_model\nCall:\nmultinom(formula = ProductChoice ~ MembershipPoints + IncomeClass\
  \ +\nCustomerPropensity + LastPurchaseDuration + CustomerAge +\nMartialStatus, data\
  \ = Data_Purchase)\nCoefficients:\n(Intercept) MembershipPoints IncomeClass CustomerPropensityLow\n\
  2  0.77137077      -0.02940732  0.00127305            -0.3960318\n3  0.01775506\
  \       0.03340207  0.03540194            -0.8573716\n4 -1.15109893      -0.12366367\
  \  0.09016678            -0.6427954\nCustomerPropensityMedium CustomerPropensityUnknown\n\
  2               -0.2745419                -0.5715016\n3               -0.4038433\
  \                -1.1824810\n4               -0.4035627                -0.9769569\n\
  CustomerPropensityVeryHigh LastPurchaseDuration CustomerAge\n2                 \
  \ 0.2553831           0.04117902 0.001638976\n3                  0.5645137     \
  \      0.05539173 0.005042405\n4                  0.5897717           0.07047770\
  \ 0.009664668\nMartialStatus\n2  -0.033879645\n3  -0.007461956\n4   0.122011042\n\
  Residual Deviance: 1208435\nAIC: 1208495\n```\n\n模型结果显示它在 30 次迭代后收敛。现在让我们查看模型分配的一组样本概率，然后应用第一个分类器，即选取最高概率。\n\
  \n这里，我们应用最高概率分类器，并观察它如何对案例进行分类。\n\n```\n#预测概率\npredicted_test <-as.data.frame(predict(mnl_model,\
  \ newdata = Data_Purchase, type=\"probs\"))\nhead(predicted_test)\n1         2 \
  \        3          4\n1 0.21331014 0.3811085 0.3361570 0.06942438\n2 0.05060546\
  \ 0.2818905 0.4157159 0.25178812\n3 0.21017415 0.4503171 0.2437507 0.09575798\n\
  4 0.24667443 0.4545797 0.2085789 0.09016690\n5 0.09921814 0.3085913 0.4660605 0.12613007\n\
  6 0.11730147 0.3624635 0.4184053 0.10182971\n#基于最高概率进行预测\ntest_result <-apply(predicted_test,1,which.max)\n\
  result <-as.data.frame(cbind(Data_Purchase$ProductChoice,test_result))\ncolnames(result)\
  \ <-c(\"实际类别\", \"预测类别\")\ntable(result$`实际类别`,result$`预测类别`)\n1      2      3\n\
  1    302  91952  12365\n2    248 150429  38028\n3    170  90944  51390\n4     27\
  \  32645  16798\n```\n\n模型对类别 1、2 和 3 的分类效果良好，但对于类别 4，模型甚至没有正确分类一个案例。这是因为分类器（选取最高概率）对绝对概率非常敏感。这被称为*类别不平衡*，在本节开头已讨论过。\n\
  \n现在让我们应用本节开头讨论的第二种方法——概率比率——来进行分类。我们将根据预测概率与先验概率/比例的比率来选择类别。通过这种方式，我们将确保分类器分配的是能提供最大概率提升的类别。换句话说，该比率将通过先验几率对概率进行归一化，从而减少由于先验分布造成的偏差。\n\
  \n```\nprior <-table(Data_Purchase_Model$ProductChoice)/nrow(Data_Purchase_Model)\n\
  prior_mat <-rep(prior,nrow(Data_Purchase_Model))\npred_ratio <-predicted_test/prior_mat\n\
  #基于最高比率进行预测\ntest_result <-apply(pred_ratio,1,which.max)\nresult <-as.data.frame(cbind(Data_Purchase$ProductChoice,test_result))\n\
  colnames(result) <-c(\"实际类别\", \"预测类别\")\ntable(result$`实际类别`,result$`预测类别`)\n1\
  \      2      3      4\n1  21251  64410  18935     23\n2  28087 112480  48078  \
  \   60\n3  13887  77090  51476     51\n4   4620  27848  16958     44\n```\n\n现在你可以看到类别不平衡问题在一定程度上得到了缓解。我们鼓励你尝试其他采样方法来进一步减少这个问题。多项模型在多类分类问题中非常流行；其他用于多类分类的替代算法往往比多项模型更复杂。与朴素贝叶斯分类器相比，多项逻辑回归分类器更常用于自然语言处理和多类问题。\n\
  \n\n\n### 6.5.11 广义线性模型\n\n广义线性模型将普通线性回归的思想扩展到指数族中响应变量的其他分布。\n\n在 GLM 框架中，我们假设因变量由指数族分布生成。指数族包括正态分布、二项分布、泊松分布和伽马分布等。在这种情况下，期望值定义为：\n\
  \n![$$ \\mathrm{E}\\left(\\mathrm{Y}\\right)=\\mu ={g}^{-1}\\left(\\mathrm{X}\\\
  beta \\right) $$](img/416805_2_En_6_Chapter_TeX_Equah.png)\n\n其中 *E(Y)* 是 *Y* 的期望值；*X*β\
  \ 是线性预测器，是未知参数 β 的线性组合；*g* 是链接函数。\n\n模型参数 β 通常使用最大似然估计、最大拟似然估计或贝叶斯技术进行估计。\n\n`glm`\
  \ 函数是一个非常通用的函数，可以容纳响应变量中的多种分布类型：\n\n**glm(formula, family=familytype(link=linkfunction),\
  \ data=)**\n\n*   `binomial, (link = \"logit\")`\n\n    二项分布在现实世界中非常常见。任何具有两种可能结果的问题都可以视为二项分布。一个简单的例子是今天是否会下雨（=1）或不会下雨（=0）。\n\
  \n*   `gaussian, (link= \"identity\")`\n\n    高斯分布是一种连续分布，即正态分布。线性回归中的所有问题都假设因变量服从高斯分布。\n\
  \n*   `Gamma, (link= \"inverse\")`\n\n    一个例子是：“N 个人在等待外卖。服务完他们需要多长时间？”或者工业中机器的故障时间。\n\
  \n*   `poisson, (link = \"log\")`\n\n    这是排队问题中的常见分布。一个例子是“呼叫中心今天会接到多少个电话？”\n\n\
  R 中的 `glm()` 函数也支持以下指数族分布。然而，这些分布在日常活动中并不常见。\n\n```\ninverse.gaussian, (link = \"\
  1/mu²\")\nquasi, (link = \"identity\", variance = \"constant\")\nquasibinomial,\
  \ (link = \"logit\")\nquasipoisson, (link = \"log\")\n```\n\n### 6.5.12 结论\n\n回归是最早的学习算法之一，深受统计学影响，但设计却非常简洁优雅。多年来，随着新应用的出现，回归技术的复杂性和多样性成倍增加。在本书中，我们用了大量篇幅介绍回归，以充分展示广泛使用的回归技术。我们从最基本的简单回归讨论到高级的多项式回归，并重点在\
  \ R 中进行了演示。建议有兴趣的读者进一步参考该主题的一些高级文献，以便更深入地研究回归理论。\n\n我们还详细讨论了回归的模型诊断，这是在实际开发模型时最容易被忽视的主题，但如果处理不当，可能会对应用它的行业造成巨大损害。\n\
  \n在下一节中，我们将介绍一种基于距离的算法——支持向量机，它在高维数据集上可以成为一个非常好的二分类模型。\n\n## 6.6 支持向量机 SVM\n\n在\
  \ R 函数 `libsvm` 的文档（标题为“支持向量机”，作者 David Meyer）中，对 SVM 进行了简洁清晰的描述，涵盖了类别分离、处理重叠类别、处理非线性以及问题解决方案的建模。以下是该文档的摘录：\n\
  \n1.  类别分离\n\n    SVM 寻找分离两个类别的最优超平面。（在二维空间中，超平面是一条直线；在 p 维空间中，超平面是一个维度为 p-1 的平坦仿射子空间。）它通过最大化两个类别最近点之间的间隔来找到最优超平面（见图\
  \ 6-57）。在二维空间中，如图 6-32 所示，位于间隔边界上的点称为支持向量，穿过间隔中点的直线就是最优超平面。\n\n    对于线性可分的数据，一个简单的二维超平面由以下两个方程表示：\n\
  \n![$$ \\overrightarrow{w}\\cdot \\overrightarrow{x} + \\mathrm{b}=1 $$](img/416805_2_En_6_Chapter_TeX_Equai.png)\n\
  \n和\n\n![$$ \\overrightarrow{w}\\cdot \\overrightarrow{x} + \\mathrm{b}=-1 $$](img/416805_2_En_6_Chapter_TeX_Equaj.png)\n\
  \n并满足以下约束条件，以确保每个观测值都位于间隔的正确一侧：\n\n![$$ {\\mathrm{y}}_{\\mathrm{i}}\\left(\\overrightarrow{\\\
  mathrm{w}}\\cdot \\overrightarrow{{\\mathrm{x}}_{\\mathrm{i}}}+\\mathrm{b}\\right)\\\
  ge 1,\\kern2.25em \\mathrm{for}\\kern0.5em \\mathrm{all}\\kern0.5em 1\\le \\mathrm{i}\\\
  le \\mathrm{n}. $$](img/416805_2_En_6_Chapter_TeX_Equak.png)\n\n2.  重叠类别\n\n   \
  \ 如果数据点位于判别间隔的错误一侧，可以降低其权重以减少其影响（在这种情况下，该间隔称为软间隔）。\n\n    可以引入以下称为铰链损失函数的函数来处理这种情况：\n\
  \n![$$ \\max \\left(0,1-{\\mathrm{y}}_{\\mathrm{i}}\\left(\\overrightarrow{w}\\\
  cdot \\overrightarrow{x_i}+\\mathrm{b}\\right)\\right). $$](img/416805_2_En_6_Chapter_TeX_Equal.png)\n\
  \n    如果 ![$$ \\overrightarrow{{\\mathrm{x}}_{\\mathrm{i}}} $$](img/416805_2_En_6_Chapter_TeX_IEq8.png)\
  \ 位于间隔的正确一侧，则该函数值为 0；否则，函数值与到间隔的距离成正比。\n\n3.  非线性\n\n    如果找不到线性分类器，通常使用核函数将观测值投影到更高维的空间，在该空间中观测值变得线性可分。\n\
  \n    一种流行的高斯族核函数是径向基函数。径向基函数（RBF）是一个实值函数，其值仅取决于到原点的距离。该函数可以定义如下：\n\n![$$ \\mathrm{K}\\\
  left(\\mathrm{x},\\mathrm{y}\\right)=\\exp \\left(-\\frac{{\\left|\\left|\\mathrm{x}-\\\
  mathrm{y}\\right|\\right|}²}{2{\\mathrm{s}}²}\\right) $$](img/416805_2_En_6_Chapter_TeX_Equam.png)\n\
  \n    其中 ![$$ {\\left|\\left|\\mathrm{x}-\\mathrm{y}\\right|\\right|}² $$](img/416805_2_En_6_Chapter_TeX_IEq9.png)\
  \ 称为观测值 x 和 y 之间的欧几里得距离的平方。根据数据的不同，还可以使用其他线性、多项式和 sigmoid 核函数。\n\n能够执行所有这些任务的程序称为*支持向量机*。参见图\
  \ 6-32。\n\n![../images/416805_2_En_6_Chapter/416805_2_En_6_Fig32_HTML.jpg](img/416805_2_En_6_Fig32_HTML.jpg)\n\
  \n图 6-32\n\n使用支持向量机进行分类\n\n### 6.6.1 线性 SVM\n\n该问题可以表述为一个二次优化问题，可以通过许多已知技术求解。以下表达式可以转换为二次函数（此主题的讨论超出了本书的范围）。\n\
  \n#### 6.6.1.1 硬间隔\n\n对于硬间隔\n\n最小化 ![$$ \\left\\Vert \\overrightarrow{w}\\right\\\
  Vert $$](img/416805_2_En_6_Chapter_TeX_IEq10.png)，满足约束条件 ![$$ {y}_i\\left(\\overrightarrow{w}\\\
  cdot \\overrightarrow{x_i}-b\\right)\\ge 1,\\mathrm{for}\\kern0.28em i=1,\\dots\
  \ n $$](img/416805_2_En_6_Chapter_TeX_IEq11.png)\n\n\n\n#### 6.6.1.2 软间隔\n\n对于软间隔\n\
  \n最小化 ![$$ \\left[\\frac{1}{n}\\sum \\limits_{i=1}^n\\max \\left(0,1-{y}_i\\left(\\\
  overrightarrow{w}\\cdot \\overrightarrow{x_i}+b\\right)\\right)\\right]+\\lambda\
  \ {\\overrightarrow{w}}², $$](images/416805_2_En_6_Chapter/416805_2_En_6_Chapter_TeX_IEq12.png)\n\
  \n其中\n\n参数 • 决定了在增大间隔与确保 ![$$ {\\overrightarrow{x}}_i $$](img/416805_2_En_6_Chapter_TeX_IEq13.png)\
  \ 位于间隔正确一侧之间的权衡。\n\n### 6.6.2 二分类 SVM 分类器\n\n让我们来看一下乳腺癌数据集中良性和恶性细胞的分类。我们要创建一个二分类器，将细胞分为良性和恶性。\n\
  \n1.  数据摘要\n\n```\n    library(e1071)\n    library(rpart)\n    breast_cancer_data\
  \ <-read.table(\"Dataset/breast-cancer-wisconsin.data.txt\",sep=\",\")\n    breast_cancer_data$V11\
  \ =as.factor(breast_cancer_data$V11)\n    summary(breast_cancer_data)\n    V1  \
  \             V2              V3              V4\n    Min.   :  61634  Min.   :\
  \ 1.000  Min.   : 1.000  Min.   : 1.000\n    1st Qu.: 870688  1st Qu.: 2.000  1st\
  \ Qu.: 1.000  1st Qu.: 1.000\n    Median :1171710  Median : 4.000  Median : 1.000\
  \  Median : 1.000\n    Mean   :1071704  Mean   : 4.418  Mean   : 3.134  Mean   :\
  \ 3.207\n    3rd Qu.: 1238298 3rd Qu.: 6.000  3rd Qu.: 5.000  3rd Qu.: 5.000\n \
  \   Max.   :13454352 Max.   :10.000  Max.   :10.000  Max.   :10.000\n    V5    \
  \           V6               V7            V8\n    Min.   : 1.000   Min.   : 1.000\
  \   1      :402   Min.   : 1.000\n    1st Qu.: 1.000   1st Qu.: 2.000   10     :132\
  \   1st Qu.: 2.000\n    Median : 1.000   Median : 2.000   2      : 30   Median :\
  \ 3.000\n    Mean   : 2.807   Mean   : 3.216   5      : 30   Mean   : 3.438\n  \
  \  3rd Qu.: 4.000   3rd Qu.: 4.000   3      : 28   3rd Qu.: 5.000\n    Max.   :10.000\
  \   Max.   :10.000   8      : 21   Max.   :10.000\n    (Other): 56\n    V9     \
  \         V10         V11\n    Min.   : 1.000   Min.   : 1.000   2:458\n    1st\
  \ Qu.: 1.000   1st Qu.: 1.000   4:241\n    Median : 1.000   Median : 1.000\n   \
  \ Mean   : 2.867   Mean   : 1.589\n    3rd Qu.: 4.000   3rd Qu.: 1.000\n    Max.\
  \   :10.000   Max.   :10.000\n    ```\n\n2.  数据准备\n\n1.  模型构建\n\n```\nsplit data\
  \ into a train and test set\nindex <-1:nrow(breast_cancer_data)\ntest_data_index\
  \ <-sample(index, trunc(length(index)/3))\ntest_data <-breast_cancer_data[test_data_index,]\n\
  train_data <-breast_cancer_data[-test_data_index,]\n```\n\n1.  模型评估\n\n通常，只有当所使用的特征和数据与真实世界非常匹配时，才有可能达到如此高的准确率。在实际场景中，构建这样的数据集很困难，然而，在医疗诊断领域，对准确率的期望总是非常高，因为错误会对人的生命带来重大风险。\n\
  \n训练集准确率 = 100%\n\n```\n    library(gmodels)\n    svm_pred_train <-predict(svm.model,\
  \ train_data[,-11])\n    CrossTable(train_data$V11, svm_pred_train,\n    prop.chisq\
