  Max.   :5644   Max.   :215245   4      :0   ThirdResale :0\n(Other):0\n```\n\n请注意，这三个杠杆点的房价远高于平均值或高密度区域。其中两个观测值的房价分别对应数据集中的最高值和最低值。另一个有趣的现象是，第三个对应于房价中位数的观测值拥有非常高的草坪面积，这无疑是一个影响点。基于此分析，我们可以返回去检查这些是否为数据错误，或者选择在分析中忽略它们。\n\
  \n\n\n#### 6.5.4.2 残差的正态性\n\n*残差*是回归模型诊断的核心。残差的正态性是模型成为有效线性回归模型的重要条件。简单来说，正态性意味着误差/残差是随机噪声，并且我们的模型已经捕获了数据中的所有信号。\n\
  \n线性回归模型给出了在给定 X 值下函数 Y 的条件期望。然而，拟合方程会存在一些残差。我们需要残差的期望服从均值为 0 或可缩减为 0 的正态分布。正态残差意味着模型推断（置信区间、模型预测变量的显著性）是有效的。\n\
  \n学生化残差（可视为归一化值）的分布是判断正态性假设是否成立的一个好方法。但我们可能仍然希望通过正态性检验（如 KS 检验、Shapiro-Wilk 检验、Anderson\
  \ Darling 检验等）来正式检验残差。\n\n此处，我们展示了正态分布的学生化残差图，该图应呈钟形曲线。\n\n```\nlibrary(stats)\n\
  library(IDPmisc)\nLoading required package: grid\nlibrary(MASS)\nsresid <-studres(fitted_Model_multiple)\n\
  #Remove irregular values (NAN/Inf/NAs)\nsresid <-NaRV.omit(sresid)\nhist(sresid,\
  \ freq=FALSE,\nmain=\"Distribution of Studentized Residuals\",breaks=25)\nxfit<-seq(min(sresid),max(sresid),length=40)\n\
  yfit<-dnorm(xfit)\nlines(xfit, yfit)\n```\n\n图 6-18 中的图是使用学生化残差创建的。在上述代码中，残差通过 R\
  \ 中的 `studres()` 函数进行学生化处理。\n\n![../images/416805_2_En_6_Chapter/416805_2_En_6_Fig18_HTML.jpg](img/416805_2_En_6_Fig18_HTML.jpg)\n\
  \n图 6-18\n\n学生化残差的分布\n\n残差图接近正态图，因为其分布呈钟形曲线。然而，我们仍然希望进行正态性的正式检验。我们将展示所有三种正态性检验的结果，但会正式介绍最流行的正态性检验——单样本\
  \ Kolmogorov-Smirnov 检验（KS 检验）的检验统计量。对于其余检验，我们鼓励您查阅此处所用函数的 R 小插图。它指向该主题最合适的参考资料。\n\
  \n现在，让我们正式介绍 KS 检验。对于给定的累积分布函数 F(x)，Kolmogorov–Smirnov 统计量定义为：\n\n![$$ {D}_n=\\\
  underset{x}{\\sup}\\mid {F}_n(x)-F(x)\\mid $$](img/416805_2_En_6_Chapter_TeX_Equo.png)\n\
  \n其中 *sup x* 是距离集合的最大值。\n\nKS 统计量返回残差的经验分布与正态分布之间的最大差异。如果该最大值（`supremum`）大于某个临界值，则我们称该分布不是正态分布（使用检验统计量的\
  \ p 值）。这里我们进行了三个检验以验证结果的一致性：\n\n```\n# test on normality\n#K-S one sample test\n\
  ks.test(fitted_Model_multiple$residuals,pnorm,alternative=\"two.sided\")\nOne-sample\
  \ Kolmogorov-Smirnov test\ndata:  fitted_Model_multiple$residuals\nD = 0.54443,\
  \ p-value < 2.2e-16\nalternative hypothesis: two-sided\n#Shapiro Wilk Test\nshapiro.test(fitted_Model_multiple$residuals)\n\
  Shapiro-Wilk normality test\ndata:  fitted_Model_multiple$residuals\nW = 0.80444,\
  \ p-value < 2.2e-16\n#Anderson Darling Test\nlibrary(nortest)\nad.test(fitted_Model_multiple$residuals)\n\
  Anderson-Darling normality test\ndata:  fitted_Model_multiple$residuals\nA = 29.325,\
  \ p-value < 2.2e-16\n```\n\n这三个检验均认为残差不服从正态分布。p 值均小于 0.05，因此我们可以拒绝分布为正态的原假设。这意味着我们必须回到模型中，看看是什么导致了非正态行为，例如删除或添加某些变量、存在影响点以及其他问题。\n\
  \n#### 6.5.4.3 多重共线性\n\n*多重共线性*本质上是一对自变量中信息过多的问题。当两个或多个变量高度相关时，就会出现这种现象，从而导致模型拟合中的标准误膨胀。为了检验这种现象，我们可以使用相关矩阵，看看它们之间是否存在精度尚可的关系。如果存在，则添加一个变量就足以提供解释因变量所需的信息。\n\
  \n在本节中，我们将使用方差膨胀因子来确定自变量中多重共线性的程度。另一种流行的方法是使用 Colin 指数（条件指数）来检测多重共线性。\n\n用于检测多重共线性的方差膨胀因子（VIF）定义如下：\n\
  \n![$$ \\mathrm{tolerance}=1-{R}_j²,\\kern2.25em \\mathrm{VIF}=\\frac{1}{\\mathrm{tolerance}}\
  \ $$](img/416805_2_En_6_Chapter_TeX_Equp.png)\n\n其中 *R*[*j*]² 是解释变量 *j* 对所有其他解释变量进行回归的判定系数。\n\
  \n通常，基于这些指标检测多重共线性存在的阈值如下：\n\n*   容差小于 0.20\n*   VIF 大于等于 5 表示存在多重共线性问题\n\n解决此问题的简单方法是在模型构建过程中从这些阈值中删除该变量。\n\
  \n```\nlibrary(car)\n# calculate the vif factor\n# Evaluate Collinearity\nprint(\"\
  \ Variance inflation factors are \");\n[1] \" Variance inflation factors are \"\n\
  vif(fitted_Model_multiple);\n# variance inflation factors\nGVIF Df GVIF^(1/(2*Df))\n\
  StoreArea        1.767064  1        1.329309\nStreetHouseFront 1.359812  1     \
  \   1.166110\nBasementArea     1.245537  1        1.116036\nLawnArea         1.254520\
  \  1        1.120054\nRating           1.931826  9        1.037259\nSaleType   \
  \      1.259122  5        1.023309\nprint(\"Tolerance factors are \");\n[1] \"Tolerance\
  \ factors are \"\n1/vif(fitted_Model_multiple)\nGVIF        Df GVIF^(1/(2*Df))\n\
  StoreArea        0.5659106 1.0000000       0.7522703\nStreetHouseFront 0.7353955\
  \ 1.0000000       0.8575521\nBasementArea     0.8028664 1.0000000       0.8960281\n\
  LawnArea         0.7971175 1.0000000       0.8928143\nRating           0.5176450\
  \ 0.1111111       0.9640796\nSaleType         0.7942043 0.2000000       0.9772220\n\
  ```\n\n现在我们在前面的表格中得到了 VIF 值和容差值。我们将按照讨论的 VIF 和容差阈值进行判断。\n\n```\n# Apply the cut-off\
  \ to Vif\nprint(\"Apply the cut-off of 4 for vif\")\n[1] \"Apply the cut-off of\
  \ 4 for vif\"\nvif(fitted_Model_multiple) >4\nGVIF    Df GVIF^(1/(2*Df))\nStoreArea\
  \        FALSE FALSE           FALSE\nStreetHouseFront FALSE FALSE           FALSE\n\
  BasementArea     FALSE FALSE           FALSE\nLawnArea         FALSE FALSE     \
  \      FALSE\nRating           FALSE  TRUE           FALSE\nSaleType         FALSE\
  \  TRUE           FALSE\n# Apply the cut-off to Tolerance\nprint(\"Apply the cut-off\
  \ of 0.2 for vif\")\n[1] \"Apply the cut-off of 0.2 for vif\"\n(1/vif(fitted_Model_multiple))\
  \ <0.2\nGVIF    Df GVIF^(1/(2*Df))\nStoreArea        FALSE FALSE           FALSE\n\
  StreetHouseFront FALSE FALSE           FALSE\nBasementArea     FALSE FALSE     \
  \      FALSE\nLawnArea         FALSE FALSE           FALSE\nRating           FALSE\
  \  TRUE           FALSE\nSaleType         FALSE FALSE           FALSE\n```\n\n您可以观察到，对于我们为多重共线性设置的阈值，GVIF\
  \ 列均为 FALSE。因此，我们可以有把握地说，我们的模型不存在多重共线性问题。因此，标准误没有膨胀，我们可以进行假设检验。\n\n\n\n#### 6.5.4.4\
  \ 残差自相关\n\n相关性定义于两个不同变量之间，而自相关（也称为序列相关）是指一个变量在不同时间点或序列中与自身的相关性。这种关系非常重要，在时间序列建模中相当常用。当观测值具有内在顺序时（例如，按时间、键等索引），自相关就更有意义。如果残差显示其与先前的残差存在确定的关系，即存在自相关，那么噪声并非纯粹随机，这意味着我们仍有更多信息可以提取并纳入模型。\n\
  \n为了检验自相关，我们将使用最流行的方法：德宾-沃森检验。\n\n假设过程已定义均值和方差，德宾-沃森检验的自相关统计量可定义如下：\n\n![$$ R\\\
  left(s,t\\right)=\\frac{\\mathrm{E}\\left[\\left({X}_t-{\\mu}_t\\right)\\left({X}_s-{\\\
  mu}_s\\right)\\right]}{\\sigma_t{\\sigma}_s} $$](images/416805_2_En_6_Chapter/416805_2_En_6_Chapter_TeX_Equq.png)\n\
  \n这可以针对我们的残差自相关重写为 d-德宾-沃森检验统计量：\n\n![$$ d=\\frac{\\sum \\limits_{t=2}^T{\\left({e}_t-{e}_{t-1}\\\
  right)}²}{\\sum \\limits_{t=1}^T{e}_t²} $$](img/416805_2_En_6_Chapter_TeX_Equr.png)\n\
  \n其中，`et` 是与时间 t 处的观测值相关的残差。\n\n要解释该统计量，您可以遵循图 6-19 中概述的规则。\n\n![../images/416805_2_En_6_Chapter/416805_2_En_6_Fig19_HTML.jpg](img/416805_2_En_6_Fig19_HTML.jpg)\n\
  \n图 6-19\n\n德宾-沃森统计量界限\n\n正自相关意味着一个观测值的正误差会增加另一个观测值出现正误差的可能性。而负自相关则相反。在线性回归模型中，正自相关和负自相关都是不期望出现的。在图\
  \ 6-20 中，很明显，如果 d 统计量的值接近 2，我们可以推断残差项中不存在自相关。\n\n检测自相关的另一种方法是绘制 ACF 图并寻找尖峰。\n\n\
  ```\n# 检验自相关误差\ndurbinWatsonTest(fitted_Model_multiple)\nlag Autocorrelation D-W\
  \ Statistic p-value\n1     -0.03814535      2.076011   0.192\nAlternative hypothesis:\
  \ rho != 0\n# ACF 图\nplot(acf(fitted_Model_multiple$residuals))\n```\n\n图 6-20 中的图称为针对不同滞后的自相关函数（ACF）图。该图在时间序列分析中很流行，因为数据是按时间索引的，所以我们在此使用该图作为自相关解释的代理。\n\
  \n![../images/416805_2_En_6_Chapter/416805_2_En_6_Fig20_HTML.jpg](img/416805_2_En_6_Fig20_HTML.jpg)\n\
  \n图 6-20\n\n自相关函数（ACF）图\n\n德宾-沃森统计量显示残差之间无自相关，d 等于 2.07。同时，ACF 图也未显示尖峰。因此，我们可以说残差不存在自相关。\n\
  \n#### 6.5.4.5 同方差性\n\n*同方差性* 意味着序列或向量中的所有随机变量具有有限且恒定的方差。这也称为方差齐性。在线性回归框架中，同方差误差/残差意味着误差的方差与\
  \ *x* 的值无关。这意味着无论 *x* 如何，*y* 的概率分布都具有相同的标准差。\n\n有多种统计检验可用于检查同方差性假设，例如，布罗施-帕甘检验、ARCH\
  \ 检验、巴特利特检验等。在本节中，我们重点关注由 Snedecor 和 Cochran 于 1989 年提出的巴特利特检验。\n\n要执行巴特利特检验，首先我们在总体数据中创建子组。为了说明，我们创建了三个总体数据组，每组分别有\
  \ 400、400 和 269 个观测值。\n\n```\n我们可以在数据中创建三个组，以查看方差是否在这三组之间变化\ngp<-numeric()\nfor(\
  \ i in 1:1069)\n{\nif(i<=400){\ngp[i] <-1;\n}else if(i<=800){\ngp[i] <-2;\n}else{\n\
  gp[i] <-3;\n}\n}\n```\n\n现在我们定义将在巴特利特检验中检验的假设：\n\n`Ho`：所有三个总体方差相同。\n\n`Ha`：至少有两个不同。\n\
  \n这里，我们使用函数 `Bartlett.test()` 执行巴特利特检验：\n\n```\nData_lm_Model$gp <-factor(gp)\n\
  bartlett.test(fitted_Model_multiple$fitted.values,Data_lm_Model$gp)\nBartlett test\
  \ of homogeneity of variances\ndata:  fitted_Model_multiple$fitted.values and Data_lm_Model$gp\n\
  Bartlett's K-squared = 1.3052, df = 2, p-value = 0.5207\n```\n\n巴特利特检验的 p 值大于 0.05，这意味着我们无法拒绝原假设。各子组具有相同的方差，因此方差是同方差的。\n\
  \n这里，我们展示更多用于检验方差的测试。这些仅供参考，以便您可以在需要时复制其他检验。\n\n1.  布罗施-帕甘检验\n\n```\n# 非常数误差方差检验\
  \ - 布罗施-帕甘检验\nncvTest(fitted_Model_multiple)\nNon-constant Variance Score Test\n\
  Variance formula: ~ fitted.values\nChisquare = 2322.866    Df = 1     p = 0\n```\n\
  \n这些结果是一种流行的异方差性检验（称为布罗施-帕甘检验）的结果。p 值为 0，因此您可以拒绝方差是异方差的原假设。\n\n1.  ARCH 检验\n\n```\n\
  # 也展示 ARCH 检验 - 更适用于时间序列模型\nlibrary(FinTS)\nArchTest(fitted_Model_multiple$residuals)\n\
  ARCH LM-test; Null hypothesis: no ARCH effects\ndata:  fitted_Model_multiple$residuals\n\
  Chi-squared = 4.2168, df = 12, p-value = 0.9792\n```\n\n巴特利特检验和 ARCH 检验的结果清楚地表明残差是同方差的。图\
  \ 6-21 中的图是残差与拟合值图。它是一个散点图，x 轴为残差，y 轴为拟合值（估计响应值）。该图用于检测非线性、不等误差方差和异常值。\n\n![../images/416805_2_En_6_Chapter/416805_2_En_6_Fig21_HTML.jpg](img/416805_2_En_6_Fig21_HTML.jpg)\n\
  \n图 6-21\n\n残差与拟合值图\n\n```\n# 绘制残差与拟合值图\nplot(fitted_Model_multiple$residuals,fitted_Model_multiple$fitted.values)\n\
  ```\n\n拟合值与残差的图也未显示任何增加或减少的行为。这意味着残差是同方差的，因为它们不随 x 的值而变化。\n\n\n\n在本节关于模型诊断的内容中，我们探讨了识别回归问题的重要检验和流程。影响点可能会给模型估计带来偏差，并降低模型的性能。我们可以探索几种方法来减轻这个问题，例如对数值进行封顶、创建分箱，或者可能只是将其从分析中移除。残差的正态性很重要，因为我们期望一个好的模型能够捕获数据中的所有信号，并将残差减少到仅为白噪声。自相关是索引数据的一个特征，在这种情况下，如果残差彼此不独立且存在自相关，那么模型性能将会下降。同方差性是另一个重要的诊断指标，它告诉我们因变量的方差是否与预测变量/自变量无关。所有这些诊断都需要在拟合回归模型后进行，以确保模型可靠且在统计上有效，能够应用于实际场景。\n\
  \n现在我们已经测试了线性回归的主要检验，可以继续学习多项式回归了。到目前为止，我们假设因变量和自变量之间的关系是线性的，但在现实生活中可能并非如此。线性关系在所有水平上都表现出相同的比例变化行为。例如，当店铺面积从\
  \ 10 平方英尺变为 20 平方英尺时，`HousePrice` 的增加，与从 2000 平方英尺变为 2010 平方英尺这同样的 10 平方英尺变化所带来的增加并不相同。但线性回归忽略了这一事实，并假设在所有水平上变化相同。\n\
  \n下一节将把线性回归的思想扩展到更高次多项式的关系。\n\n### 6.5.5 多项式回归\n\n线性回归框架可以扩展到变量之间的多项式关系。在多项式回归中，自变量\
  \ *x* 和因变量 *y* 之间的关系被建模为 n 次多项式。\n\n多项式回归模型可以表示如下：\n\n![$$ {y}_i={a}_0+{a}_1{x}_i+{a}_2{x}_i²+\\\
  cdots +{a}_m{x}_i^m+{\\varepsilon}_i\\left(i=1,2,\\dots, n\\right) $$](img/416805_2_En_6_Chapter_TeX_Equs.png)\n\
  \n有许多例子表明数据并非遵循线性依赖关系，而是更高次的关系。一般来说，现实生活中的关系在真正意义上并非线性。线性回归假设因变量只能朝一个方向变化，且每单位自变量的边际变化相同。\n\
  \n例如，`HousePrice` 与 `StoreArea` 呈正相关。这意味着如果 `StoreArea` 增加，`HousePrice` 也会增加。因此，如果\
  \ `StoreArea` 持续增加，`HousePrice` 将以相同的速率（系数）上涨。但是，您是否相信如果 `StoreArea` 太大，`HousePrice`\
  \ 能涨到 100 万？不会的，`StoreArea` 的效用会随着其增加而递减，最终您将看不到 `HousePrice` 有同样的增长。\n\n经济学提供了许多这种二次行为的良好例子，例如价格弹性、收益递减等。同样，在常规规划中，我们也会用到二次及其他高次多项式关系，例如折扣生成、产品定价等。我们将展示一个例子，说明多项式回归如何帮助建模某些多项式关系。\n\
  \n*因变量：* 商品价格\n\n*自变量：* 销售量\n\n一般原则是，如果价格太便宜，人们会认为商品质量不好而不购买；但如果价格太高，人们会因成本考虑而不购买。让我们尝试使用线性和二次回归来量化这种关系。\n\
  \n```\n#因变量：商品价格\ny |t|)\n(Intercept) 2.232652   0.445995   5.006  0.00024 ***\n\
  x           0.007546   0.005463   1.381  0.19046\n\nSignif. codes:  0 '***' 0.001\
  \ '**' 0.01 '*' 0.05 '.' 0.1 ' ' 1\nResidual standard error: 0.3836 on 13 degrees\
  \ of freedom\nMultiple R-squared:  0.128,  Adjusted R-squared:  0.06091\nF-statistic:\
  \ 1.908 on 1 and 13 DF,  p-value: 0.1905\n```\n\n模型摘要显示，多重 R 方仅为 12%，且变量 *x* 在模型中不显著。此外，*x*\
  \ 的系数也不显著，因为 p 值为 0.19。图 6-22 显示了实际值与预测值的散点图，以查看数值是否拟合良好。\n\n![../images/416805_2_En_6_Chapter/416805_2_En_6_Fig22_HTML.jpg](img/416805_2_En_6_Fig22_HTML.jpg)\n\
  \n图 6-22\n\n线性模型的实际值与预测值图\n\n```\nres <-stack(data.frame(Observed =as.numeric(y),\
  \ Predicted =fitted(linear_reg)))\nres <-cbind(res, x =rep(x, 2))\n#使用 lattice 的\
  \ xyplot 函数绘图\nlibrary(\"lattice\")\nxyplot(values ~x, data = res, group = ind,\
  \ auto.key =TRUE)\n```\n\n该图提供了额外的证据，表明从图中看不出线性关系。这些数值并不适合模型预测的线性直线。\n\n现在，我们继续为数据拟合一条二次曲线，看看这是否有助于我们捕捉价格对数量的曲线行为。\n\
  \n```\n#绘制二次关系图\nlinear_reg |t|)\n(Intercept)  6.8737010  1.1648621   5.901 7.24e-05\
  \ ***\nx           -0.1189525  0.0309061  -3.849  0.00232 **\nI(x²)       0.0008145\
  \  0.0001976   4.122  0.00142 **\n\nSignif. codes:  0 '***' 0.001 '**' 0.01 '*'\
  \ 0.05 '.' 0.1 ' ' 1\nResidual standard error: 0.2569 on 12 degrees of freedom\n\
  Multiple R-squared:  0.6391, Adjusted R-squared:  0.5789\nF-statistic: 10.62 on\
  \ 2 and 12 DF,  p-value: 0.002211\n```\n\n模型摘要显示，在我们为 *x* 引入二次项后，多重 R 方提高到了 63%，并且变量\
  \ *x* 和 *x* 平方在统计上均显著。让我们绘制散点图，看看这些值是否很好地拟合了数据。见图 6-23。\n\n![../images/416805_2_En_6_Chapter/416805_2_En_6_Fig23_HTML.jpg](img/416805_2_En_6_Fig23_HTML.jpg)\n\
  \n图 6-23\n\n二次多项式模型的实际值与预测值图\n\n```\nres <-stack(data.frame(Observed =as.numeric(y),\
  \ Predicted =\nfitted(linear_reg)))\nres <-cbind(res, x =rep(x, 2))\n#使用 lattice\
  \ 的 xyplot 函数绘图\nlibrary(\"lattice\")\nxyplot(values ~x, data = res, group = ind,\
  \ auto.key =TRUE)\n```\n\n该模型显示 R 方有所改善，且二次项在模型中显著。该图还显示，二次情况下的拟合效果优于线性情况。这个想法可以扩展到更高次的多项式，但这会导致过拟合。此外，许多过程通常不能用非常高次的多项式很好地表示。如果您计划使用次数超过四的多项式，在解释结果时要非常小心。\n\
  \n\n\n### 6.5.6 逻辑回归\n\n在线性回归中，我们看到因变量是一个具有实数值的连续变量。同时，我们确定误差项需要服从正态分布，回归方程才有效。现在，假设因变量只有两个可能的值（0\
  \ 和 1），换句话说，它服从二项分布，会发生什么？那么误差项就不能服从正态分布，如下所示：\n\n![$$ ei= Binomial(Yi)- Gausssian\\\
  left(\\beta 0+\\beta 1 xi\\right) $$](img/416805_2_En_6_Chapter_TeX_Equt.png)\n\n\
  因此，我们需要转向不同的框架，以适应因变量不服从高斯分布而服从指数族分布的情况。在逻辑回归之后，我们将简要介绍指数分布，并展示如何通过链接函数将其简化为线性形式。逻辑回归对预测变量与分类响应/因变量之间的关系进行建模。例如，我们在第\
  \ 5 章中看到的信用风险问题。预测变量被用来对“违约/未违约”这一二项结果进行建模。\n\n根据分类（响应）变量的类型，逻辑回归可以分为三种类型：\n\n*\
  \   ***二项逻辑回归***：响应变量只有两个可能的值（0/1）。通常，我们估计其为 1 的概率，并根据某个阈值来预测响应变量的状态。\n\n    二项分布的概率质量函数如下：\n\
  \n![$$ f\\left(k;n;p\\right)=\\Pr \\left(X=k\\right)=\\left(\\begin{array}{c}n\\\
  \\ {}k\\end{array}\\right){p}^k{\\left(1-p\\right)}^{n-k} $$](img/416805_2_En_6_Chapter_TeX_Equu.png)\n\
  \n其中 *k* 是成功次数，*n* 是总试验次数，*p* 是单次成功的概率。\n\n*   ***多项逻辑回归***：分类响应变量有三个或更多个值/水平。通常，我们计算每个水平的概率，然后基于某种分类规则（例如，最大概率）来分配响应变量的状态。\n\
  \n    多项分布的概率质量函数如下：\n\n![$$ f\\left({x}_1,\\dots, {x}_k;n,{p}_1,\\dots, {p}_k\\\
  right)=\\Pr \\left({X}_1={x}_1\\kern1em and\\kern1em \\dots \\kern1em and\\kern1em\
  \ {X}_k={x}_k\\right) $$](img/416805_2_En_6_Chapter_TeX_Equv.png)\n\n![$$ =\\Big\\\
  {{\\displaystyle \\begin{array}{l}\\frac{n!}{x_1!\\cdots {x}_k!}{p}_1^{x_1}\\cdots\
  \ {p}_k^{x_k},\\kern4.75em \\mathrm{when}\\kern1em \\sum \\limits_{i=1}^k{x}_i=n\\\
  \\ {}0\\kern11.5em \\mathrm{otherwise},\\end{array}} $$](img/416805_2_En_6_Chapter_TeX_Equw.png)\n\
  \n![$$ for\\kern1em non- negative\\kern1em integers\\kern1em {x}_1,\\dots, {x}_k\
  \ $$](img/416805_2_En_6_Chapter_TeX_Equx.png)\n\n其中 *xi* 是预测变量集，*pk* 是每个类别的概率（比例），*n*\
  \ 是试验次数（样本量）。\n\n*   ***有序逻辑回归***：响应变量是一个具有内在顺序的分类变量。该方法与多项逻辑回归相同，主要区别在于其具有内在的顺序。例如，一个介于\
  \ 1 到 5 之间的评级变量。\n\n让我们来看两个在解释逻辑回归时要用到的重要术语。\n\n### 6.5.7 Logit 变换\n\n对于逻辑回归，我们使用一个变换函数，也称为链接函数，它从自变量中的二项分布创建一个线性函数。用于二项分布的链接函数称为\
  \ `logit` 函数（见图 6-24）。\n\n`logit` 函数 *σ* (*t*) 定义如下：\n\n![$$ \\sigma (t)=\\frac{e^t}{e^t+1}=\\\
  frac{1}{1+{e}^{-t}} $$](img/416805_2_En_6_Chapter_TeX_Equy.png)\n\n`logit` 函数曲线如下所示：\n\
  \n![../images/416805_2_En_6_Chapter/416805_2_En_6_Fig24_HTML.jpg](img/416805_2_En_6_Fig24_HTML.jpg)\n\
  \n图 6-24\n\nLogit 函数\n\n```\ncurve((1/(1+exp(-x))),-10,10,col =\"violet\")\n```\n\
  \n你可以观察到，`logit` 函数的上限为 1，下限为 0。极高的 x 值对函数值影响很小，极低的 x 值也是如此。这样，我们可以看到边界在 0 到 1 的概率尺度之间，以便拟合模型。\n\
  \n在逻辑回归中，我们使用最大似然估计（MLE），而对于多项逻辑回归，我们使用迭代方法来优化 `logLoss` 函数。\n\n然后，`logit` 函数将这种关系转换为优势比的\
  \ `logit`，作为自变量的线性组合。逻辑函数 *g* 的逆函数，即 `logit`（对数优势比），将这种关系映射为线性关系：\n\n![$$ g\\left(F(x)\\\
  right)=\\ln \\left(\\frac{F(x)}{1-F(x)}\\right)={\\beta}_0+{\\beta}_1x $$](img/416805_2_En_6_Chapter_TeX_Equz.png)\n\
  \n在本节中，我们讨论具有二项分类变量的逻辑回归，在后面的部分中，我们将从高层次上探讨如何将此方法扩展到多项分类。\n\n\n\n### 6.5.8 优势比\n\
  \n在第一章中，我们讨论了概率度量，它表示事件发生的可能性。概率值始终介于 0 和 1 之间，其中 0 表示事件绝对不会发生，1 表示事件绝对会发生。\n\n\
  我们将概率优势（或简称为优势）定义为事件发生概率与不发生概率的比值。\n\n```\n事件 A 的优势比 = P(A)/1-P(A)\n事件 A 的劣势比 =\
  \ (1-P(A))/P(A) = 1/事件 A 的优势比\n```\n\n因此，事件 A 的优势比为 2 意味着事件 A 发生的可能性是不发生的 2 倍。该比值可以推广到任意数量的类别，此时其解释变为事件相对于所有可能事件发生的可能性。\n\
  \n优势比是一种表示事件“A”存在/不存在与事件“B”存在/不存在之间关系的方式。对于二元情况，我们可以创建一个示例如下所示：\n\n![$$ 优势比=(A 的优势)/(B\
  \ 的优势) $$](img/416805_2_En_6_Chapter_TeX_Equaa.png)\n\n例如，假设有两种事件结果，A 和 B。事件 A 发生的概率为\
  \ 0.4 (P(A))，事件 B 发生的概率为 0.6 (P(B))。那么事件 A 的优势比为 0.66 (P(A)/1-P(A))，类似地，事件 B 的优势比为\
  \ 1.5 (P(B)/1-P(B))。这意味着事件 B 发生的可能性是不发生的 1.5 倍。\n\n现在，优势比被定义为这些优势的比值，即 B 的优势除以 A\
  \ 的优势 = 1.5/0.66 = 2.27 ~ 2。这表示事件 B 发生的可能性是事件 A 发生的两倍。我们可以观察到这个量是一个相对度量，因此我们在逻辑回归中使用了基准水平的概念。模型中的优势比是相对于基准水平/类别的。\n\
  \n现在，我们可以介绍 `logit` 与优势比之间的关系。逻辑回归本质上对以下方程进行建模，该方程是对事件优势进行 `logit` 变换，然后将我们的问题转换为其线性形式，如下所示：\n\
  \n![$$ \\mathrm{logit}\\left(\\mathrm{E}\\left[{Y}_i|{x}_{1,i},\\dots, {x}_{m,i}\\\
  right]\\right)=\\mathrm{logit}\\left({p}_i\\right)=\\ln \\left(\\frac{p_i}{1-{p}_i}\\\
  right)={\\beta}_0+{\\beta}_1{x}_{1,i}+\\cdots +{\\beta}_m{x}_{m,i} $$](images/416805_2_En_6_Chapter/416805_2_En_6_Chapter_TeX_Equab.png)\n\
  \n因此，在逻辑回归中，优势比是变量的指数化系数，表示事件相对于参考类别/事件的相对可能性。在这里，你可以看到优势比如何转化为逻辑回归的指数化系数。\n\n![$$\
  \ \\mathrm{OR}=\\frac{\\mathrm{odds}\\left(x+1\\right)}{\\mathrm{odds}(x)}=\\frac{\\\
  frac{F\\left(x+1\\right)}{1-F\\left(x+1\\right)}}{\\frac{F(x)}{1-F(x)}}=\\frac{e^{\\\
  beta_0+{\\beta}_1\\left(x+1\\right)}}{e^{\\beta_0+{\\beta}_1x}}={e}^{\\beta_1} $$](img/416805_2_En_6_Chapter_TeX_Equac.png)\n\
  \n#### 6.5.8.1 二项逻辑模型\n\n让我们使用我们的购买预测数据来构建一个逻辑回归模型并查看其诊断结果。在我们的分析中，我们将对数据进行子集划分，仅将\
  \ `ProductChoice` 1 和 3 分别设为 1 和 0。\n\n```\n#加载数据并准备用于逻辑回归的数据集\nData_Purchase_Prediction\
  \ \n143893 106603      0\nData_Logistic$MembershipPoints <-factor(Data_Logistic$MembershipPoints)\n\
  Data_Logistic$IncomeClass <-factor(Data_Logistic$IncomeClass)\nData_Logistic$CustomerPropensity\
  \ <-factor(Data_Logistic$CustomerPropensity)\nData_Logistic$LastPurchaseDuration\
  \ <-as.numeric(Data_Logistic$LastPurchaseDuration)\n```\n\n在开始建模之前，让我们先看看分类变量在因变量上的分布情况。\n\
