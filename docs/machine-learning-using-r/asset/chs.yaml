  \n图 10-7\n\n描述表命令\n\n#### 10.2.2.3 生成数据并存储在本地文件中\n\n现在表已准备好加载一些数据。我们在图 10-8 中展示了生成一些虚拟数据并将其存储在本地目录中名为\
