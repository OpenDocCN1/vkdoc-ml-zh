  \ 和 f281）不显著。这些特征的标准误差非常高。这提示我们这些特征本身高度相关，因此加入模型并未增加价值。如你所见，即使添加了更多变量，基尼系数也没有提高。排名靠前的特征不显著的原因可能是它们都高度相关。为了研究这个多重共线性问题，我们将为这六个特征创建相关矩阵。\n\
  \n```\n#为 6 个特征（f766、f404、f629、f630、f281 和 f322）创建相关矩阵\ntop_6_feature <-data.frame(data$f766,data$f404,data$f629,data$f630,data$f28\n\
  1,data$f322)\ncor(top_6_feature, use=\"complete\")\ndata.f766  data.f404  data.f629\
  \  data.f630  data.f281\ndata.f766  1.0000000  0.9996710  0.6830923  0.6420238 \
  \ 0.8067094\ndata.f404  0.9996710  1.0000000  0.6827368  0.6416069  0.8065005\n\
  data.f629  0.6830923  0.6827368  1.0000000  0.9114775  0.6515478\ndata.f630  0.6420238\
  \  0.6416069  0.9114775  1.0000000  0.6102867\ndata.f281  0.8067094  0.8065005 \
  \ 0.6515478  0.6102867  1.0000000\ndata.f322 -0.7675846 -0.7675819 -0.5536863 -0.5127184\
  \ -0.7280321\ndata.f322\ndata.f766  -0.7675846\ndata.f404  -0.7675819\ndata.f629\
  \  -0.5536863\ndata.f630  -0.5127184\ndata.f281  -0.7280321\ndata.f322   1.0000000\n\
  ```\n\n从相关结构中可以清楚地看出，特征 f766、f404、f630 和 f281 高度相关，因此模型结果显示它们不显著。这个练习表明，虽然特征排序有助于衡量和量化变量的个体能力，但它可能不能直接用作模型开发的变量选择方法。\n\
  \nGuyon 和 Elisseeff 对这种变量排序方法提出了以下批评：\n\n> *[变量排序方法]* *会导致选择冗余的子集。使用更小的互补变量子集可能也能达到相同的性能。*\n\
  \n你可以通过查看相关矩阵和模型中的显著变量来验证这一点。这两个显著变量是互补的，并提供了相似的基尼系数。\n\n## 5.4 变量子集选择\n\n变量子集选择是从中选取一个特征（或变量）子集用于机器学习模型的过程。在上一节中，我们尝试使用变量的个体排序来创建变量子集，但观察到了特征排序作为变量选择方法的局限性。现在，我们正式介绍变量子集选择的过程。我们将从每个大类中讨论一种方法，并使用信用损失数据展示一个示例。我们鼓励你比较结果并评估哪种方法最适合你的机器学习问题。\n\
  \nIsabelle Guyon 和 Andre Elisseeff 对各种变量（或特征）选择方法进行了全面介绍。他们将不同方法的衡量标准称为特征的“有用性”或“相关性”，以确定它们是否有资格成为变量子集的一部分。我们将使用信用损失数据来说明三种主要方法——过滤法、包装法和嵌入法。\n\
  \n\n\n### 5.4.1 过滤法\n\n过滤法利用变量自身的固有属性，忽略机器学习方法本身。该方法适用于每个变量都能增加增量分类能力的分类问题。\n\n\
  ***准则*****：** 衡量特征/特征子集的“相关性”\n\n***搜索***：根据单个特征排名或特征嵌套子集对特征进行排序\n\n***评估*****：**\
  \ 使用统计检验\n\n***统计方法***\n\n1.  信息增益\n2.  卡方检验\n3.  费舍尔分数\n4.  相关系数\n5.  方差阈值\n\n\
  ***结果***\n\n1.  相对更稳健，不易过拟合\n2.  可能无法选出最“有用”的特征集\n\n对于此方法，我们将展示方差阈值方法，其基本概念是：变异性高的变量也包含更多信息。方差阈值是一种简单的基线方法。在此方法中，我们移除所有方差小于某个阈值的变量。此方法会自动移除方差为零的变量。\n\
  \n### 注意\n\n我们数据集中的特征未经标准化，因此无法直接比较方差。我们将使用变异系数（CV）来选择用于模型构建的前五个特征。此外，以下练习仅针对连续特征展示；对于分类变量，请使用卡方检验。\n\
  \n变异系数（CoV），也称为相对标准差，提供了变量离散程度的标准化度量。它定义为变量的标准差与均值的比值：\n\n![$$ {c}_v=\\frac{\\sigma\
  \ }{\\mu } $$](img/416805_2_En_5_Chapter_TeX_Equa.png)\n\n这里，我们计算每个连续变量的均值和方差，然后取它们的比值来计算变异系数（CoV）。然后，特征按变异系数降序排列。\n\
  \n```\n#计算每个变量的方差，并通过除以 mean()来标准化方差\ncoefficient_of_variance <-data.frame(feature\
  \ =character(), cov =numeric())\n#编写循环遍历所有特征并计算方差\nfor (feature in names(data))\n\
  {\nif(feature %in%c(\"id\",\"loss\",\"default\"))\n{\nnext;\n}\nelse if(feature\
  \ %in%continuous)\n{\ntryCatch(\n{cov <-abs(sd(data[[feature]], na.rm =TRUE)/mean(data[[feature]],na.\n\
  rm =TRUE));\nif(cov !=Inf){\ncoefficient_of_variance <-rbind(coefficient_of_variance,cbind(feature,\n\
  cov));} else {next;}},error=function(e){})\n}\nelse\n{\nnext;\n}\n}\ncoefficient_of_variance$cov\
  \ <-as.numeric(as.character(coefficient_of_\nvariance$cov))\n#按变异系数从高到低排序列表\nRanked_Features_cov\
  \ <-coefficient_of_variance[order(-coefficient_of_\nvariance$cov),]\nprint(\"按变异系数排序的前\
  \ 5 个特征\\n\")\n[1] \"按变异系数排序的前 5 个特征\\n\"\nhead(Ranked_Features_cov)\nfeature  \
  \     cov\n295    f338 164.46714\n378    f422 140.48973\n667    f724  87.22657\n\
  584    f636  78.06823\n715    f775  70.24765\n666    f723  46.31984\n```\n\n变异系数按\
  \ CoV 值降序提供了前六个特征。出现在前六位的特征（f338、f422、f724、f636、f775 和 f723）随后被用于拟合二项逻辑模型。我们计算模型的基尼系数，以评估这些变量是否比单个特征更能提升基尼系数，如前所述。\n\
  \n```\n#使用前 6 个特征（f338、f422、f724、f636、f775 和 f723）创建逻辑模型\nglm_model |z|)\n(Intercept)\
  \ -2.206e+00  1.123e-02 -196.426  < 2e-16 ***\nf338        -1.236e-25  2.591e-25\
  \   -0.477    0.633\nf422         1.535e-01  1.373e-02   11.183  < 2e-16 ***\nf724\
  \         1.392e+01  9.763e+00    1.426    0.154\nf636        -1.198e-06  2.198e-06\
  \   -0.545    0.586\nf775         6.412e-02  1.234e-02    5.197 2.03e-07 ***\nf723\
  \        -5.181e+00  4.623e+00   -1.121    0.262\n\nSignif. codes:  0 '***' 0.001\
  \ '**' 0.01 '*' 0.05 '.' 0.1 ' ' 1\n(Dispersion parameter for binomial family taken\
  \ to be 1)\nNull deviance: 59064 on 90687 degrees of freedom\nResidual deviance:\
  \ 58898 on 90681 degrees of freedom\n(14783 observations deleted due to missingness)\n\
  AIC: 58912\nNumber of Fisher Scoring iterations: 6\ncat(\"拟合模型的基尼系数为 \",Gini_value);\n\
  拟合模型的基尼系数为   0.1445109\n```\n\n此方法并未显示前六个特征中显著变量的数量有所改善，即只有两个特征显著——f422 和 f775。此外，模型的整体性能更差，即基尼系数为\
  \ 0.144（仅 14.4%）。为了分析的完整性，让我们为这六个特征创建相关矩阵。我们想看看变量之间是否相关，从而导致其不显著。\n\n```\n#为 6 个特征（f338、f422、f724、f636、f775\
  \ 和 f723）创建相关矩阵\ntop_6_feature <-data.frame(as.double(data$f338),as.double(data$f422),as.\n\
  double(data$f724),as.double(data$f636),as.double(data$f775),as.\ndouble(data$f723))\n\
  cor(top_6_feature, use=\"complete\")\nas.double.data.f338\\. as.double.data.f422.\n\
  as.double.data.f338\\.         1.000000e+00          0.009542857\nas.double.data.f422\\\
  .         9.542857e-03          1.000000000\nas.double.data.f724\\.         4.335480e-02\
  \          0.006249059\nas.double.data.f636\\.        -6.708839e-05          0.011116608\n\
  as.double.data.f775\\.         5.537591e-03          0.050666549\nas.double.data.f723\\\
  .         5.048078e-02          0.005556227\nas.double.data.f724\\. as.double.data.f636.\n\
  as.double.data.f338\\.         0.0433548003        -6.708839e-05\nas.double.data.f422\\\
  .         0.0062490589         1.111661e-02\nas.double.data.f724\\.         1.0000000000\
  \        -1.227539e-04\nas.double.data.f636\\.        -0.0001227539         1.000000e+00\n\
  as.double.data.f775\\.         0.0121451180        -7.070228e-03\nas.double.data.f723\\\
  .         0.9738147134        -2.157437e-04\nas.double.data.f775\\. as.double.data.f723.\n\
  as.double.data.f338\\.         0.005537591          0.0504807821\nas.double.data.f422\\\
  .         0.050666549          0.0055562270\nas.double.data.f724\\.         0.012145118\
  \          0.9738147134\nas.double.data.f636\\.        -0.007070228         -0.0002157437\n\
  as.double.data.f775\\.         1.000000000          0.0190753853\nas.double.data.f723\\\
  .         0.019075385          1.0000000000\n```\n\n你可以清楚地看到，相关结构并未主导特征集，而是单个特征的相关性驱动它们被选入建模子集。这也是意料之中的，因为我们基于\
  \ CoV 选择了变量，而 CoV 独立于任何其他变量。\n\n\n\n### 5.4.2 包装方法\n\n包装方法使用搜索算法来探索可能的特征子集空间，并通过在子集上运行模型来评估每个子集。包装方法计算成本高，且存在对模型过拟合的风险。\n\
  \n***准则*****：** 衡量特征子集的“有用性”\n\n***搜索*****：** 搜索所有特征子集的空间，并选择得分最高的子集\n\n***评估*****：**\
  \ 交叉验证\n\n***统计方法***\n\n1.  递归特征消除\n\n2.  序列特征选择算法\n    1.  序列前向选择\n\n    2.  序列后向选择\n\
  \n    3.  加减-r 选择\n\n    4.  双向搜索\n\n    5.  序列浮动选择\n\n3.  遗传算法\n\n***结果***\n\n\
  1.  为模型构建提供最有用的特征\n\n2.  可能导致过拟合\n\n我们将以序列方法为例进行说明。最流行的序列方法是前向选择和后向选择。两者结合的一种类似变体称为*逐步*方法。\n\
  \n前向变量选择算法的步骤如下：\n\n1.  选择一个仅包含一个变量的模型，该变量能使评估函数取得最大值。\n\n2.  添加下一个能使评估函数值提升最大的变量。\n\
  \n3.  重复步骤 2，直到添加新变量无法再带来提升。\n\n如您所见，这种方法计算密集且需要迭代。重要的是，要针对问题仔细选择一组初始变量。使用所有可用特征可能并不划算。过滤方法有助于将变量列表缩短到包装方法可管理的规模。\n\
  \n为了设置示例，我们从总特征集中选取一个包含 10 个特征的子集。我们从过滤方法输出的连续变量中选取前五个，并从分类变量中随机选取五个。\n\n```\n#从变异系数最高的变量中提取\
  \ 5 个变量（来自过滤方法）(f338,f422,f724,f636 和 f775)\npredictor_set <-c(\"f338\",\"f422\"\
  ,\"f724\",\"f636\",\"f775\")\n#从分类变量集中随机提取 5 个变量（读者也可以对分类变量应用过滤方法，并系统地选择这 5 个变量）\n\
  set.seed(101);\nind <-sample(1:length(categorical), 5, replace=FALSE)\np<-1\nfor\
  \ (i in ind)\n{\npredictor_set [5+p] <-categorical[i]\np=p+1\n}\n#打印我们将使用的 10 个变量集\n\
  print(predictor_set)\n[1] \"f338\" \"f422\" \"f724\" \"f636\" \"f775\" \"f222\"\
  \ \"f33\" \"f309\" \"f303\" \"f113\"\n#将 f33 替换为 f93，因为 f33 没有水平\npredictor_set[7]\
  \ <- \"f93\"\n#打印最终变量列表\nprint(predictor_set)\n[1] \"f338\" \"f422\" \"f724\" \"\
  f636\" \"f775\" \"f222\" \"f93\" \"f309\" \"f303\" \"f113\"\n```\n\n我们准备预测某人在未来一年内违约的概率。我们的目标是根据以下特征选择模型：\n\
  \n*   更少的预测变量更优\n\n*   惩罚包含大量预测变量的模型\n\n*   惩罚拟合效果差的模型\n\n为了衡量这些影响，我们将使用赤池信息准则（AIC）作为评估指标。AIC\
  \ 基于信息论；它衡量一个模型相对于其他模型的质量。在与其他模型比较时，它处理的是模型拟合优度与模型复杂度之间的权衡。模型的复杂度由模型中的变量数量表示，变量越多意味着复杂度越高。\n\
  \n在统计学中，AIC 定义为：\n\nAIC = 2k – 2ln(L) = 2k + 偏差\n\n其中 `k` 是参数（或特征）的数量。\n\n### 注意\n\
  \nAIC 是一个相对度量；因此，它不能告诉你模型在绝对意义上的质量。\n\n为了通过前向选择说明特征选择，我们首先需要开发两个模型，一个包含所有特征，另一个不包含任何特征：\n\
  \n*   *全模型*：包含所有变量的模型。该模型提供了模型复杂度的上限。\n\n*   *空模型*：不包含任何变量，仅包含截距项的模型。该模型提供了模型复杂度的下限。\n\
  \n一旦我们有了这两个模型，就可以基于 AIC 度量开始特征选择。这些模型对于 AIC 作为模型拟合度量至关重要，因为 AIC 将相对于模型中的这些极端情况进行衡量。让我们首先创建一个包含所有预测变量的全模型，并查看其摘要（输出已截断）：\n\
  \n```\n# 创建一个仅包含预测变量和因变量的小型建模数据集\nlibrary(data.table)\ndata_model |z|)\n(Intercept)\
  \ -2.423e+00  3.146e-02 -77.023  < 2e-16 ***\nf338        -1.379e-25  2.876e-25\
  \  -0.480 0.631429\nf422         1.369e-01  1.387e-02   9.876  < 2e-16 ***\nf724\
  \         3.197e+00  1.485e+00   2.152 0.031405 *\nf636        -9.976e-07  1.851e-06\
  \  -0.539 0.589891\nf775         5.965e-02  1.287e-02   4.636 3.55e-06 ***\n......输出已截断\n\
  \nSignif. codes:  0 '***' 0.001 '**' 0.01 '*' 0.05 '.' 0.1 ' ' 1\n(Dispersion parameter\
  \ for binomial family taken to be 1)\nNull deviance: 58874 on 90287 degrees of freedom\n\
  Residual deviance: 58189 on 90214 degrees of freedom\nAIC: 58337\nNumber of Fisher\
  \ Scoring iterations: 12\n```\n\n该输出显示了使用所有 10 个变量构建的全模型的摘要。现在，让我们类似地创建空模型：\n\n\
  ```\n#空模型不使用任何变量\nnull_model |z|)\n(Intercept) -2.19241    0.01107    -198   <2e-16\
  \ ***\n\nSignif. codes:  0 '***' 0.001 '**' 0.01 '*' 0.05 '.' 0.1 ' ' 1\n(Dispersion\
  \ parameter for binomial family taken to be 1)\nNull deviance: 58874 on 90287 degrees\
  \ of freedom\nResidual deviance: 58874 on 90287 degrees of freedom\nAIC: 58876\n\
  Number of Fisher Scoring iterations: 4\n```\n\n在这个阶段，我们已经看到了极端模型的表现：一个包含所有变量的模型，以及一个没有任何变量的模型（基本上是因变量的历史平均值）。有了这些极端模型，我们将以空模型为基础执行前向选择，并开始向其添加变量。\n\
  \n前向选择将在变量子集上迭代进行。注意，第一次迭代的基础模型是 AIC 为 58876 的空模型。下面是可供选择添加到模型中的变量列表。\n\n\n\n```\n\
