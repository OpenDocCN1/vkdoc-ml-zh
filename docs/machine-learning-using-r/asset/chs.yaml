  y 轴上位置很高。类似地，如果你看中国，其拥有世界最多的人口（13.7 亿）和 10.8 万亿美元的 GDP，在图中则表现为 x 轴最右侧的一个点。




  ## 4.6 箱线图


  箱线图是一种紧凑的表示方式，用于展示第 [1](http://dx.doi.org/10.1007/978-1-4842-4215-5_1) 章中描述的五数概括法，即中位数、第一和第三四分位数（第
  25 和第 75 百分位数）以及最小值和最大值。垂直矩形框的上边代表第三四分位数，下边代表第一四分位数。这两点之间的差值称为*四分位距*，它包含了 50%的数据。将矩形分割开的一条线代表中位数。矩形两侧还各有一条延伸线（称为须线），表示第一和第三四分位数之外的变异性。最后，绘制在图中作为线条延伸的点被称为*异常值*。从数值上看，这些点的值超过了变量标准差的两倍。


  ![../images/416805_2_En_4_Chapter/416805_2_En_4_Fig10_HTML.jpg](img/416805_2_En_4_Fig10_HTML.jpg)


  图 4-10


  一个展示前 10 名国家 GDP（万亿美元）的箱线图


