  25281           2002          20297         18255            6138\nWyoming\n\n#样本数据的交叉表频率\n\
  table(stratified_sample_10_percent$State,stratified_sample_10_percent$CardType)\n\
  American Express Discover MasterCard  Visa\nAlabama                      498   \
