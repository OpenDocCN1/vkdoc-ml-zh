  \n图 6-25\n\n购买率与收入等级\n\n图 6-25 中的图表显示，随着收入等级的提高，购买产品 1 的倾向下降。可以为其他变量创建类似的图表，以查看拟合模型后模型概率的预期行为。\n\
  \n\n\n现在我们将清理数据中的缺失值（NA，即缺失值 0），并使用`glm()`函数拟合二元逻辑回归。GLM 代表广义线性回归，能够处理指数族分布。该函数要求用户指明因变量所属的分布族以及要使用的链接函数。我们使用了二项分布族，并以`logit`作为链接函数。\n\
