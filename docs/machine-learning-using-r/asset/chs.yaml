  \         5.4665e-07   5.8382e-04\n799    4.925227         9.7837e-07   1.0449e-03\n\
  235    4.916172         1.0236e-06   1.0932e-03\n487    4.673321         3.3491e-06\
  \   3.5768e-03\n530    4.479709         8.2943e-06   8.8583e-03\n```\n\n如图 6-17\
  \ 所示，观测值编号 342、621 和 1023（对应于 `HOUSE_ID` 412、759 和 1242）是三个主要的影响点。让我们提取这些记录，看看它们具有哪些值。\n\
