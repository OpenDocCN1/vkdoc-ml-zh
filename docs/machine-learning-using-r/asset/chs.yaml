  #### 6.9.2.3 基于分布的聚类


  分布方法是迭代方法，用于优化数据集中聚类的分布。高斯分布就是正态分布。该方法分三步进行：


  1.  首先随机选择高斯参数并将其拟合到一组数据点。


  2.  迭代优化分布参数，以尽可能多地拟合数据点。


  3.  一旦收敛到局部最小值，就可以将数据点分配到更接近该聚类分布的位置。


  尽管该算法会创建复杂的模型，但它确实能捕捉属性之间的相关性和依赖性。其缺点是这些方法通常存在过拟合问题。这里，我们在房屋净值数据上展示一个算法示例。


