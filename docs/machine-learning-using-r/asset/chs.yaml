  \n```\n#Summary of final model with forward selection process\nformula(forwards)\n\
  default ~ f222 + f422 + f113 + f303 + f775 + f724\n```\n\n前向选择方法表明，使用这六个特征（f222、f422、f113、f303、f775\
  \ 和 f724）可以创建出基于 AIC 准则的最佳模型。其他特征选择方法，如后向选择、逐步选择等，可以类似的方式进行。在下一节中，我们将介绍在计算上优于包装器方法的嵌入式方法。\n\
  \n### 5.4.3 嵌入式方法\n\n嵌入式方法与包装器方法类似，因为它们也优化目标函数，通常是一个性能评估函数模型。与包装器方法的不同之处在于，它在模型学习过程中使用了一个内在的模型构建指标。本质上，这是一个搜索问题，但属于引导式搜索，因此计算成本较低。\n\
  \n***准则*****：** 衡量特征子集的“有用性”\n\n***搜索*****：** 在学习过程的引导下，搜索所有特征子集的空间\n\n***评估*****：**\
  \ 交叉验证\n\n***统计方法***\n\n1.  L1（LASSO）正则化\n\n2.  决策树\n\n3.  基于 Gram-Schimdth 正交化的前向选择\n\
  \n4.  梯度下降法\n\n***结果***\n\n1.  与包装器类似，但采用引导式搜索\n\n2.  计算成本更低\n\n3.  更不容易过拟合\n\n\
  对于这种方法，我们将展示一种正则化技术。在机器学习领域，*正则化*是在搜索变量子集空间时引入额外信息以防止过拟合的过程。在本节中，我们将展示用于变量选择的 L1\
  \ 正则化示例。\n\n用于变量选择的 L1 正则化也称为 LASSO（最小绝对收缩和选择算子）。该方法由罗伯特·蒂布希拉尼在他 1996 年发表于《皇家统计学会杂志》的著名论文《通过\
  \ Lasso 进行回归收缩和选择》中提出。\n\n在 L1 或 LASSO 回归中，我们通过添加偏差来增加一个针对复杂度的惩罚项，以降低过拟合程度或模型的方差。因此，要最小化的目标函数如下所示：\n\
  \n正则化成本 = 成本 + 正则化惩罚项\n\n在 LASSO 正则化中，目标函数的一般形式如下：\n\n![$$ \\frac{1}{N}\\kern0.125em\
  \ \\sum \\limits_{i=1}^Nf\\left({x}_i,{y}_i,\\alpha, \\beta \\right) $$](img/416805_2_En_5_Chapter_TeX_Equb.png)\n\
  \n该估计量的 LASSO 正则化版本将是以下问题的解：\n\n![$$ \\underset{\\alpha, \\beta }{\\min}\\frac{1}{N}\\\
  sum \\limits_{i=1}^N\\kern0.125em f\\left({x}_i,{y}_i,\\alpha, \\beta \\right)\\\
  kern0.5em subject\\kern0.5em to\\kern0.5em {\\left|\\left|\\beta \\right|\\right|}_1\\\
  le t $$](img/416805_2_En_5_Chapter_TeX_Equc.png)\n\n其中只有 β 受到惩罚，而 α 可以自由取任何允许的值。添加正则化成本使得我们的目标函数最小化正则化成本。\n\
  \n惩罚逻辑回归的目标函数使用负二项对数似然，如下所示：\n\n![$$ \\underset{\\left({\\beta}_0,\\beta \\right)\\\
  in {\\mathbb{R}}^{p+1}}{\\min }-\\left[\\frac{1}{N}\\sum \\limits_{i=1}^N\\kern0.125em\
  \ {y}_i\\cdot \\left({\\beta}_0+{x}_i^T\\beta \\right)-\\log \\left(1+{e}^{\\left({\\\
  beta}_0+{x}_i^T\\beta \\right)}\\right)\\right]\\kern0.5em +\\lambda \\left[\\left(1-\\\
  alpha \\right){\\left|\\left|\\beta \\right|\\right|}_2²/2+\\alpha {\\left|\\left|\\\
  beta \\right|\\right|}_1\\right]. $$](images/416805_2_En_5_Chapter/416805_2_En_5_Chapter_TeX_Equd.png)\n\
  \n当 p>N 时，逻辑回归常常会出现退化问题，即使当 N 接近 p 时，其行为也可能非常不稳定；弹性网络惩罚项可以缓解这些问题，同时还能进行正则化和变量选择。\n\
  \n我们将在数据集中的一组 10 个连续变量上运行此示例。\n\n\n\n```\n#创建包含因变量和自变量的数据框（移除缺失值）\ndata_model <-na.omit(data)\n\
  y <-as.matrix(data_model$default)\nx <-as.matrix(subset(data_model, select=continuous[250:260]))\n\
  library(\"glmnet\")\n我们将使用包 glmnet() 来展示\n#拟合一个因变量为二项分布族的模型\nfit =glmnet(x,y, family=\"\
  binomial\")\n#拟合模型的摘要\nsummary(fit)\nLength Class     Mode\na0           44    -none-\
  \    numeric\nbeta        440    dgCMatrix S4\ndf           44    -none-    numeric\n\
  dim           2    -none-    numeric\nlambda       44    -none-    numeric\ndev.ratio\
  \    44    -none-    numeric\nnulldev       1    -none-    numeric\nnpasses    \
  \   1    -none-    numeric\njerr          1    -none-    numeric\noffset       \
  \ 1    -none-    logical\nclassnames    2    -none-    character\ncall         \
  \ 4    -none-    call\nnobs          1    -none-    numeric\n```\n\n图 5-3 展示了这 10\
  \ 个变量各自解释的偏差比例之间的关系。\n\n![../images/416805_2_En_5_Chapter/416805_2_En_5_Fig3_HTML.jpg](img/416805_2_En_5_Fig3_HTML.jpg)\n\
  \n图 5-3\n\n每个特征/变量解释的系数和偏差比例\n\n```\n#绘制 glmnet 拟合模型的输出\nplot (fit, xvar=\"dev\"\
  , label=TRUE)\n```\n\n在图 5-3 所示的包含 10 个变量的图中，你可以看到除了#7 和#5 变量外，所有变量的系数均为 0。作为下一步，我们将对我们的拟合进行交叉验证。对于逻辑回归，我们将使用`cv.glmnet`，其参数和用法与高斯分布类似。例如，让我们使用误分类误差作为\
  \ 10 折交叉验证的标准。\n\n```\n#拟合一个交叉验证的二项分布模型\nfit_logistic =cv.glmnet(x,y, family=\"\
  binomial\", type.measure =\"class\")\n#拟合的交叉验证线性模型摘要\nsummary(fit_logistic)\nLength\
  \ Class  Mode\nlambda     43     -none- numeric\ncvm        43     -none- numeric\n\
  cvsd       43     -none- numeric\ncvup       43     -none- numeric\ncvlo       43\
