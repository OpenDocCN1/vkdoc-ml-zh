  ```\n\n二分类 SVM 在乳腺癌数据集上表现异常出色，这是 UCI 机器学习库中对该数据集描述的黄金标准。分类矩阵显示正确分类率为 95%（正确识别了 58.4%\
  \ 的恶性细胞和 36.9% 的良性细胞）。\n\n### 6.6.3 多分类 SVM\n\n我们介绍了 SVM 作为二分类器。然而，SVM 的思想也可以扩展到多分类问题。多分类\
  \ SVM 可以通过创建多个二分类器来用作多分类器。这种方法的工作原理类似于多项逻辑回归的思想，即我们为每一对类别构建一个带有基函数的逻辑模型。\n\n按照同样的思路，我们可以创建一组二分类\
  \ SVM 来进行多分类。实现该方法的步骤如下：\n\n1.  创建二分类器：\n    *   在一个类别与其余类别之间\n\n    *   在每一对类别之间（所有可能的配对）\n\
  \n2.  对于任何新案例，SVM 分类器采用“胜者全得”策略，即分配输出最高的类别。\n\n要实现这种方法，重要的是输出函数经过校准以生成可比较的分数，否则分类会产生偏差。\n\
  \n还有其他用于多分类 SVM 的方法。Crammer 和 Singer 提出了其中一种。他们提出了一种多分类 SVM 方法，该方法将多分类问题转化为一个单一的优化问题，而不是将其分解为多个二分类问题。\n\
  \n我们用房屋价值数据来展示一个简单的例子。房屋净值被分为三类——高、中、低。多分类 SVM 必须将房屋分类到这些类别中。以下是 SVM 多分类器的 R 实现：\n\
  \n```\n# Read the house Worth Data\nData_House_Worth <-read.csv(\"Dataset/House\
  \ Worth Data.csv\",header=TRUE);\nlibrary( 'e1071' )\n#Fit a multiclass SVM\nsvm_multi_model\
  \ <-svm( HouseNetWorth ~StoreArea +LawnArea, Data_House_Worth )\n#Display the model\n\
  svm_multi_model\nCall:\nsvm(formula = HouseNetWorth ~ StoreArea + LawnArea, data\
  \ = Data_House_Worth)\nParameters:\nSVM-Type:  C-classification\nSVM-Kernel:  radial\n\
  cost:  1\ngamma:  0.5\nNumber of Support Vectors:  120\n#get the predicted value\
  \ for all the set\nres <-predict( svm_multi_model, newdata=Data_House_Worth )\n\
  #Classification Matrix\ntable(Data_House_Worth$HouseNetWorth,res)\nres\nHigh Low\
  \ Medium\nHigh    122   1      7\nLow       6 122      7\nMedium    1   7     43\n\
  #Classification Rate\nsum(diag(table(Data_House_Worth$HouseNetWorth,res)))/nrow(Data_House_Worth)\n\
  [1] 0.9082278\n```\n\n多分类 SVM 在房屋价值数据上给出了 90% 的良好分类率。所有类别的预测效果都很好。\n\n\n\n### 6.6.4\
  \ 结论\n\n支持向量机最初是一种非概率二元分类器，后来经过变体也能解决多类问题，已被证明是机器学习中最成功的算法之一。多年来，SVM 涌现出大量应用，其中一些值得关注的应用包括超文本分类、图像分类、字符识别，以及在生物科学领域的众多应用。\n\
  \n本节简要介绍了 SVM，包括其在乳腺癌和房屋价值数据上的二元及多类版本。下一节，我们将讨论决策树算法，这是另一种分类与回归模型，也是许多研究领域中非常流行的方法。\n\
  \n## 6.7 决策树\n\n与基于统计技术的其他机器学习算法不同，决策树是一种非参数模型，对模型没有潜在假设。然而，我们应当谨慎识别哪些问题适合使用决策树，哪些不适合。决策树易于解释和理解的特点使其在众多应用中得以使用，从农业（可根据各种环境变量预测降雨概率）到软件开发（可根据模块细节估算开发工作量）。多年来，基于树的方法在适用性和复杂性方面都发展到了更广泛的范畴。它们既适用于离散响应变量，也适用于连续响应变量，这使其成为分类和回归问题的合适解决方案。\n\
  \n更正式地说，决策树 D 由两种类型的节点组成：\n\n*   **叶节点**，表示由响应变量定义的类别/区域。\n*   **决策节点**，指定对单个属性（预测变量）的某种测试，每个可能的测试结果对应一个分支和子树。\n\
  \n构建好的决策树可用于对观测值进行分类：从顶部的决策节点（称为根节点）开始，采用递归分治方法向下经过其他决策节点，直到遇到叶节点。在深入探讨算法工作原理的细节之前，让我们先熟悉一些度量标准及其在决策树构建过程中的重要性（见图\
  \ 6-33）。\n\n![../images/416805_2_En_6_Chapter/416805_2_En_6_Fig33_HTML.jpg](img/416805_2_En_6_Fig33_HTML.jpg)\n\
  \n图 6-33\n\n包含两个属性和一个类别的决策树\n\n### 6.7.1 决策树的类型\n\n决策树提供两种实现方式，一种用于回归问题，另一种用于分类问题。这意味着你可以将决策树用于分类响应变量和连续响应变量，这使其在机器学习世界中成为一种广受欢迎的方法。接下来，我们简要描述如何使用决策树对这两种问题进行建模。\n\
  \n#### 6.7.1.1 回归树\n\n在响应变量为连续值的问题中，回归树非常有用。它们提供了与线性回归同等的可解释性，除此之外，它们对最终输出具有非常直观的理解，这与问题的领域紧密相关。在图\
  \ 6-33 的先前示例中，构建回归树是为了基于各种阈值递归地将两个特征向量空间分割成不同区域。我们在每次迭代中分割区域的目标是最小化由以下方程定义的残差平方和（RSS）：\n\
  \n![$$ \\sum \\limits_{i:{x}_i\\in {R}_1\\left(j,s\\right)}{\\left( yi-{\\overset{\\\
  frown }{y}}_{R1}\\right)}²+\\sum \\limits_{i:{x}_i\\in {R}_2\\left(j,s\\right)}{\\\
  left( yi-{\\overset{\\frown }{y}}_{R2}\\right)}², $$](img/416805_2_En_6_Chapter_TeX_Equan.png)\n\
  \n总体而言，回归树构建和对新测试数据进行预测涉及以下两个步骤：\n\n*   递归地将特征向量空间（X[1], X[2], …, X[p]）分割成不同且不重叠的区域。\n\
  *   对于落入同一区域的新观测值，其预测值等于该区域中所有训练观测值的平均值。\n\n在 n 维特征向量中，可以使用基尼指数或熵（衡量节点分类能力的指标）来选择正确的特征，以将空间分割成不同区域。方差缩减（本书未涉及）是另一种流行方法，它适当地离散化连续响应变量的范围，以便选择正确的分割阈值。见图\
  \ 6-34。\n\n![../images/416805_2_En_6_Chapter/416805_2_En_6_Fig34_HTML.jpg](img/416805_2_En_6_Fig34_HTML.jpg)\n\
  \n图 6-34\n\n二维特征空间的递归二元分割及其对应的树\n\n我们将在本章后面，使用一种称为分类与回归树（CART）的回归树算法，对本章前面描述的房屋数据集进行演示。\n\
  \n#### 6.7.1.2 分类树\n\n分类树更适用于分类或离散响应变量。以下是分类树与回归树之间的主要区别：\n\n*   在分类树中，我们使用分类错误率来进行分割。\n\
  *   在预测时，我们不使用特定区域中响应变量的平均值，而是使用训练观测值中出现频率最高的类别作为预测方法。\n\n同样，我们可以使用基尼指数或熵作为衡量标准，来选择将观测值分割成不同类别的最佳特征或属性。\n\
  \n在接下来的章节中，我们将讨论一些流行的分类决策树算法，如 ID3 和 C5.0。\n\n### 6.7.2 决策度量\n\n某些度量标准对于构建决策树至关重要。在本节中，我们讨论与节点纯度（随机性或异质性的度量）相关的几个度量标准。在决策树的上下文中，较小的值表示该节点包含来自单个类别的大部分观测值。有两种广泛使用的节点纯度度量标准，以及另一种称为信息增益的度量标准，它使用基尼指数或熵来做出节点分割的决策。\n\
  \n#### 6.7.2.1 基尼指数\n\n基尼指数的计算公式为：\n\n![$$ \\mathrm{G}=\\sum \\limits_{\\mathbf{k}=1}^{\\\
  mathbf{K}}{{\\mathbf{p}}_{\\mathrm{mk}}}^{\\ast}\\left(1-{\\mathbf{p}}_{\\mathrm{mk}}\\\
  right) $$](img/416805_2_En_6_Chapter_TeX_Equao.png)\n\n其中，**p**[**mk**] 是第 m 个区域中来自第\
  \ k 个类别的训练观测值的比例。\n\n为了演示，请看图 6-35。假设你有两个类别，其中 P1 比例的所有训练观测值属于类别 C[1]（三角形），那么 P2\
  \ = 1-P1 属于类别 C[2]（圆形）。基尼指数呈现一条曲线，如图 6-35 所示。\n\n![../images/416805_2_En_6_Chapter/416805_2_En_6_Fig35_HTML.jpg](img/416805_2_En_6_Fig35_HTML.jpg)\n\
  \n图 6-35\n\n基尼指数函数\n\n```\ncurve(x *(1-x) +(1 -x) *x, xlab =\"P\", ylab =\"Gini-Index\"\
  , lwd =5)\n```\n\n\n\n#### 6.7.2.2 熵\n\n熵的计算公式如下：\n\n![$$ \\mathrm{E}=-\\sum \\\
  limits_{\\mathrm{k}=1}^{\\mathrm{K}}{\\mathbf{p}}_{\\mathrm{mk}}\\log 2\\left(1-{\\\
  mathbf{p}}_{\\mathrm{mk}}\\right) $$](img/416805_2_En_6_Chapter_TeX_Equap.png)\n\
  \n熵的曲线大致如下：\n\n![../images/416805_2_En_6_Chapter/416805_2_En_6_Fig36_HTML.jpg](img/416805_2_En_6_Fig36_HTML.jpg)\n\
  \n图 6-36\n\n熵函数\n\n```\ncurve(-x *log2(x) -(1 -x) *log2(1 -x), xlab =\"x\", ylab\
  \ =\"Entropy\", lwd =5)\n```\n\n请注意，这两种度量非常相似，但也存在一些差异：\n\n*   **基尼指数**更适合连续属性，而**熵**则更适用于离散数据。\n\
  *   **基尼指数**在最小化误分类方面表现良好。\n*   **熵**的计算速度略慢于基尼指数，因为它涉及对数运算（尽管在当今计算速度很快的机器上，这一点影响不大）。\n\
  \n#### 6.7.2.3 信息增益\n\n信息增益是一种衡量分裂前后熵变化的指标。它是一种简洁优雅的度量方式，用于判断某个属性的相关性。通常，我们可以将信息增益表示为：\n\
  \n![$$ \\mathrm{IG}=\\left[\\mathrm{G}\\left(\\mathrm{Parent}\\right)-\\mathrm{Average}\\\
  left(\\mathrm{G}\\left(\\mathrm{Children}\\right)\\right)\\right], $$](images/416805_2_En_6_Chapter/416805_2_En_6_Chapter_TeX_Equaq.png)\n\
  \n其中，G(Parent) 是分裂前由某个属性表示的父节点的基尼指数（我们也可以使用熵），G(Children) 是分裂后将生成的子节点的基尼指数。例如，在图\
  \ 6-33 中，所有满足父节点条件 x<0.43 的观测值都是其左子节点，其余的是右子节点。\n\n### 6.7.3 决策树学习方法\n\n在本节中，我们将讨论四种广泛应用于实际数据集的决策树算法。\n\
  \n1.  数据概览\n\n    ```\n    library(C50)\n    library(splitstackshape)\n    library(rattle)\n\
  \    library(rpart.plot)\n    library(data.table)\n    Data_Purchase \n    #Check\
  \ the distribution of data before grouping\n    table(Data_Purchase$ProductChoice)\n\
  \    1      2      3      4\n    106603 199286 143893  50218\n    ```\n\n2.  数据准备\n\
  \n    ```\n    #Pulling out only the relevant data to this chapter\n    Data_Purchase\
  \ <-Data_Purchase[,.(CUSTOMER_ID,ProductChoice,MembershipPoints,IncomeClass,CustomerPropensity,LastPurchaseDuration)]\n\
  \    #Delete NA from subset\n    Data_Purchase <-na.omit(Data_Purchase)\n    Data_Purchase$CUSTOMER_ID\
  \ <-as.character(Data_Purchase$CUSTOMER_ID)\n    #Stratified Sampling\n    Data_Purchase_Model<-stratified(Data_Purchase,\
  \ group=c(\"ProductChoice\"),size=10000,replace=FALSE)\n    print(\"The Distribution\
  \ of equal classes is as below\")\n    [1] \"The Distribution of equal classes is\
  \ as below\"\n    table(Data_Purchase_Model$ProductChoice)\n    1     2     3  \
  \   4\n    10000 10000 10000 10000\n    Data_Purchase_Model$ProductChoice <-as.factor(Data_Purchase_Model$ProductChoice)\n\
  \    Data_Purchase_Model$IncomeClass <-as.factor(Data_Purchase_Model$IncomeClass)\n\
  \    Data_Purchase_Model$CustomerPropensity <-as.factor(Data_Purchase_Model$CustomerPropensity)\n\
  \    #Build the decision tree on Train Data (Set_1) and then test data (Set_2) will\
  \ be used for performance testing\n    set.seed(917);\n    train <-Data_Purchase_Model[sample(nrow(Data_Purchase_Model),size=nrow(Data_Purchase_Model)*(0.7),\
  \ replace =TRUE, prob =NULL),]\n    train <-as.data.frame(train)\n    test <-Data_Purchase_Model[!(Data_Purchase_Model$CUSTOMER_ID\
  \ %in%train$CUSTOMER_ID),]\n    ```\n\n#### 6.7.3.1 迭代二分器 3\n\n数据挖掘和决策理论领域的计算机科学研究人员\
  \ J. Ross Quinlan 发明了最流行的决策树算法 C4.5 和 ID3。以下是 ID3 算法工作原理的简要说明：\n\n1.  使用训练观测值计算每个属性的熵。\n\
  2.  使用熵最小或信息增益最大的属性将观测值分割成子集。\n3.  选定的属性成为决策节点。\n4.  对子集上的剩余属性重复此过程。\n\n为了演示，我们将使用一个名为\
  \ RWeka 的 R 包，它是基于 Weka 工具构建的封装器。Weka 是一个用 Java 编写的、用于数据挖掘任务的机器学习算法集合，包含数据预处理、分类、回归、聚类、关联规则和可视化等工具。`RWeka`\
  \ 包包含接口代码，而 Weka 的 jar 文件则位于一个名为 `RWekajars` 的独立包中。有关 Weka 的更多信息，请参阅 [`http://www.cs.waikato.ac.nz/ml/weka/`](http://www.cs.waikato.ac.nz/ml/weka/)\
  \ 。\n\n在使用 RWeka 包中的 ID3 函数之前，请遵循以下说明。\n\n1.  安装 `RWeka` 包。\n2.  将环境变量 `WEKA_HOME`\
  \ 设置为驱动器上您具有足够访问权限的文件夹位置（例如 `D:\\home`）。\n3.  在 R 控制台中，运行以下两个命令：\n    1.  模型构建\n\
  \n```\n        library(RWeka)\n        WPM(\"refresh-cache\")\n        WPM(\"install-package\"\
  , \"simpleEducationalLearningSchemes\")\n        make classifier\n        ID3 <-make_Weka_classifier(\"\
  weka/classifiers/trees/Id3\")\n        ID3Model <-ID3(ProductChoice ~CustomerPropensity\
  \ +IncomeClass ,\n        data = train)\n        summary(ID3Model)\n        ===\
  \ Summary ===\n        Correctly Classified Instances       9423           33.6536\
  \ %\n        Incorrectly Classified Instances    18577           66.3464 %\n   \
  \     Kappa statistic                          0.1148\n        Mean absolute error\
  \                      0.3634\n        Root mean squared error                 \
  \ 0.4263\n        Relative absolute error                 96.9041 %\n        Root\
  \ relative squared error             98.4399 %\n        Total Number of Instances\
  \            28000\n        === Confusion Matrix ===\n        a    b    c    d \
  \  <-- classified as\n        4061  987  929 1078 |    a = 1\n        3142 1054\
  \ 1217 1603 |    b = 2\n        2127  727 1761 2290 |    c = 3\n        2206  859\
  \ 1412 2547 |    d = 4\n        ```\n\n2.  模型评估\n\n```\n    WPM(\"refresh-cache\"\
  )\n    #looks for a package providing id3\n    WPM(\"install-package\", \"simpleEducationalLearningSchemes\"\
  )\n    #load the package\n    ```\n\n训练集准确率已作为 ID3 模型输出的一部分给出（33% 的实例被正确分类），因此我们在此无需重复。让我们来看看测试集的准确率。\n\
  \n测试集准确率 = 32%。如您所见，准确率并非特别出色。此外，由于数据有四个类别，准确率甚至可能更低。训练集和测试集准确率几乎相等这一事实告诉我们，不存在过拟合的情况。\n\
  \n\n\n```\nlibrary(gmodels)\npurchase_pred_test <-predict(ID3Model, test)\nCrossTable(test$ProductChoice,\
  \ purchase_pred_test,\nprop.chisq =FALSE, prop.c =FALSE, prop.r =FALSE,\ndnn =c('actual\
  \ default', 'predicted default'))\nCell Contents\n|-------------------------|\n\
  |                       N |\n|         N / Table Total |\n|-------------------------|\n\
  Total Observations in Table:  20002\n| predicted default\nactual default |     \
  \ 1 |         2 |         3 |         4 | Row Total |\n---------------|--------|-----------|-----------|-----------|-----------|\n\
  1 |   2849 |       758 |       625 |       766 |      4998 |\n|  0.142 |     0.038\
  \ |     0.031 |     0.038 |           |\n---------------|--------|-----------|-----------|-----------|-----------|\n\
  2 |   2291 |       681 |       872 |      1151 |      4995 |\n|  0.115 |     0.034\
  \ |     0.044 |     0.058 |           |\n---------------|--------|-----------|-----------|-----------|-----------|\n\
  3 |   1580 |       545 |      1151 |      1759 |      5035 |\n|  0.079 |     0.027\
  \ |     0.058 |     0.088 |           |\n---------------|--------|-----------|-----------|-----------|-----------|\n\
  4 |   1594 |       590 |      1066 |      1724 |      4974 |\n|  0.080 |     0.029\
  \ |     0.053 |     0.086 |           |\n---------------|--------|-----------|-----------|-----------|-----------|\n\
  Column Total |   8314 |      2574 |      3714 |      5400 |     20002 |\n---------------|--------|-----------|-----------|-----------|-----------|\n\
  ```\n\nID3 算法的准确率并不理想。一个可能的原因是响应变量中存在多个类别。通常，ID3 算法在处理多类别问题时表现并不出色。\n\n#### 6.7.3.2\
  \ C5.0 算法\n\nJ. Ross Quinlan[3] 在其著作 *C4.5: Programs for Machine Learning* 中，为使用这些算法进行分类任务提出了一系列关键要求，具体如下：\n\
  \n*   *属性-值描述*：一个案例的所有信息都应能通过一组固定的属性（特征）来表达，并且这些属性在不同案例之间不应发生变化。\n\n*   *预定义类别*：与任何监督学习方法一样，案例所属的类别必须预先定义。\n\
  \n*   *离散类别*：类别必须界限分明；一个案例要么属于某个特定类别，要么不属于，并且案例数量必须远多于类别数量。因此，显然，具有连续响应变量的问题并不适合此算法。\n\
  \n*   *充足的数据*：所需数据量受属性数量和类别数量等因素影响。随着这些数量的增加，需要更多数据来构建可靠的模型。\n\n*   *逻辑分类模型*：类别的描述应为逻辑表达式，其基本元素是关于特定属性值的陈述。例如，`IF\
  \ Outlook = \"sunny\" AND Windy = \"false\" THEN class = \"Play\"`。\n\n这里，我们将在购买预测数据集上使用\
  \ C5.0 算法，该算法是 C4.5 的扩展，用于构建决策树。C4.5 是一组用于构建分类模型的计算机程序的统称。以下是 C5.0 的一些新特性，这些特性在\
  \ Ross Quinlan 的网页（[`http://www.rulequest.com/see5-comparison.html`](http://www.rulequest.com/see5-comparison.html)）中有说明。\n\
  \n在经典著作 *Experiments in Induction* 中，Hunt 等人[4] 描述了概念学习系统的多种实现方式。以下是 Hunt 方法的工作原理。\n\
  \n给定一组包含 C[1]、C[2]、…、C[k] 类别的 T 个训练观测值，从宏观层面看，构建决策树涉及以下三种可能性：\n\n1.  T 中的所有观测值都属于单个类别\
  \ C[i]，则 T 的决策树 D 是一个标识类别 C[i] 的叶节点。\n\n2.  T 中不包含任何类别。C5.0 使用该节点父节点中出现频率最高的类别。\n\
  \n3.  T 包含混合类别的观测值。基于单个属性（该属性根据信息增益选择）选择一个节点条件（测试），该条件生成一个划分后的集合 T[1]、T[2]、…、T[n]。\n\
  \n第三种可能性中的分裂在算法中是递归的，重复进行直到所有观测值都被正确分类，或者算法没有更多属性可用于分裂。由于这种分治策略是一种贪心方法，仅根据当前步骤决定分裂，因此可能导致过拟合等情况。为了避免这种情况，采用了一种称为*剪枝*的技术，它可以减少过拟合，并更好地泛化到未见过的数据。幸运的是，您无需担心剪枝问题，因为\
  \ C5.0 算法在构建决策树后，会进行反向迭代，并替换那些不能增加信息增益的分支。\n\n这里，我们将使用购买偏好数据集，基于 `ProductChoice`\
  \ 响应变量，构建一个 C5.0 决策树模型，用于产品选择预测。\n\n1.  模型构建\n\n```\n    model_c50 <-C5.0(train[,c(\"\
  CustomerPropensity\",\"LastPurchaseDuration\", \"MembershipPoints\")],\n    train[,\"\
  ProductChoice\"],\n    control =C5.0Control(CF =0.001, minCases =2))\n    ```\n\n\
  2.  模型摘要\n\n![../images/416805_2_En_6_Chapter/416805_2_En_6_Fig37_HTML.jpg](img/416805_2_En_6_Fig37_HTML.jpg)\n\
  \n图 6-37\n\n购买预测数据集上的 C5.0 决策树\n\n```\nsummary(model_c50)\nCall:\nC5.0.default(x\
  \ = train[, c(\"CustomerPropensity\",\n\"LastPurchaseDuration\", \"MembershipPoints\"\
  )], y =\ntrain[, \"ProductChoice\"], control = C5.0Control(CF = 0.001,\nminCases\
  \ = 2))\nC5.0 [Release 2.07 GPL Edition]      Sun Oct 02 16:09:05 2016\n```\n\n\n\
  由属性 `outcome` 指定的类别\n从 undefined.data 读取了 28000 个案例（4 个属性）\n决策树：\nCustomerPropensity\
  \ 在 {High,VeryHigh} 中：\n:...MembershipPoints  1：\n:   :...LastPurchaseDuration \
  \ 6：\n:       :...CustomerPropensity = High：3 (1665/1083)\n:           CustomerPropensity\
  \ = VeryHigh：4 (2140/1259)\nCustomerPropensity 在 {Low,Medium,Unknown} 中：\n:...MembershipPoints\
