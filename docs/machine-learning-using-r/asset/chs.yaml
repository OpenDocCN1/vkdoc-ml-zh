  \ 56.7 84 49.2 ...\n    $ BasementArea : int  75 504 493 510 445 1148 380 945 1572\
  \ 506 ...\n    $ LawnArea     : num  11.22 9.69 10.19 6.82 10.92 ...\n    $ HouseNetWorth:\
  \ Factor w/ 3 levels \"High\",\"Low\",\"Medium\": 2 3 3 3 3 1 3 1 1 3 ...\n    #remove\
  \ the extra column that are not required for the model\n    Data_House_Worth$BasementArea\
  \ <-NULL\n    ```\n\n2.  模糊 C 均值聚类\n\n请注意，我们向参数 `method` 传递了值 `ucfl`，该值使用无监督模糊竞争学习（UCFL）对模型进行在线更新。\n\
