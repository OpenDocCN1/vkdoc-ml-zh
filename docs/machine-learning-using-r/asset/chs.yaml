  \n### 7.6.2 敏感性与特异性\n\n敏感性和特异性分别用于衡量模型在正类和负类上的表现。这些指标能够帮助你了解模型在正类和负类群体中的表现情况。结合分类矩阵，数学符号有助于阐明这些指标：\n\
  \n*   *敏感性*：测试将实际为`True`的类判定为`True`的概率。也称为真正例率（TPR），在模式识别中称为精确率。敏感性可通过分类矩阵计算（见图\
  \ 7-7）。\n\n    *敏感性，真正例率 = 正确识别的正例数 / 总正例数 = TP/(TP+FN)*\n\n*   *特异性*：测试将实际为`False`的类判定为`False`的概率。也称为真负例率（TNR），在模式识别中称为召回率。特异性可通过分类矩阵计算（见图\
  \ 7-7）。\n\n    *特异性，真负例率 = 正确拒绝的负例数 / 总负例数 = TN/(TN+FP)*\n\n敏感性和特异性是测试本身的特性，底层群体不会影响结果。对于一个好的模型，我们力求最大化\
  \ TPR 和 TNR，而受试者工作特征曲线（ROC）有助于实现这一目标。受试者工作曲线是敏感性与（1-特异性）之间的关系图，该曲线上的最高点提供了能最大化分类率的截断点。我们将在下一节讨论\
  \ ROC 曲线，并将其与优化敏感性和特异性联系起来。\n\n### 注意\n\n敏感性和特异性是按类别计算的。对于多类别问题，我们通常会对各类别的指标取平均值，从而为整个模型得到一个单一数值。为便于说明，我们将通过将类别合并为二分类问题来展示分析过程。鼓励读者将此概念扩展到完整模型。\n\
  \n```\n分析针对 ProductChoice == 1 进行展示\nActual_Class <-ifelse(result$`Actual Class`\
  \ ==1,\"One\",\"Rest\");\nPredicted_Class <-ifelse(result$`Predicted Class` ==1,\
  \ \"One\", \"Rest\");\nss_analysis <-as.data.frame(cbind(Actual_Class,Predicted_Class));\n\
  为 ProductChoice == 1 创建分类矩阵\ncmat_ProductChoice1 <-as.matrix(table(Actual = ss_analysis$Actual_Class,\n\
  Predicted = ss_analysis$Predicted_Class));\nprint(cmat_ProductChoice1)\nPredicted\n\
  Actual  One Rest\nOne  3175 1823\nRest 5753 9251\nclassification_rate_ProductChoice1\
  \ <-sum(diag(cmat_ProductChoice1))/n;\ncat(\"ProductChoice 1 的分类率为 \", classification_rate_\n\
  ProductChoice1)\nProductChoice 1 的分类率为   0.6212379\n计算 TPR 和 TNR\nTPR <-cmat_ProductChoice1[1,1]/(cmat_ProductChoice1[1,1]\
  \ +cmat_\nProductChoice1[1,2]);\ncat(\" 敏感性或真正例率为 \", TPR);\n敏感性或真正例率为  0.6352541\n\
  TNR <-cmat_ProductChoice1[2,2]/(cmat_ProductChoice1[2,1] +cmat_\nProductChoice1[2,2])\n\
  cat(\" 特异性或真负例率为 \", TNR);\n特异性或真负例率为  0.6165689\n```\n\n结果显示，对于`ProductChoice ==\
  \ 1`，我们的模型能够正确分类总计 63%的案例，其中，它能够从“One”群体中识别出 61%的“One”，并从“Rest”群体中识别出 62%的“Rest”。模型在从群体中预测“Rest”方面表现更好。\n\
  \n### 7.6.3 ROC 曲线下面积\n\n受试者工作特征曲线（ROC）是一种图形化表示，展示了二分类器在分类阈值或截断点变化时的性能。如前一节所述，对于一个好的模型，我们希望最大化两个相互依赖的指标——TPR\
  \ 和 TNR——而 ROC 曲线将展示这种关系。该曲线通过在不同截断点或阈值设置下绘制真正例率（TPR）与假正例率（FPR）的关系图来生成。\n\n然而，由于我们使用的是多类分类器，我们并未使用截断点进行分类。鼓励读者针对其他\
  \ ProductChoices/类别，将多类模型重建为二分类模型（一类与其余类），然后使用 ROCR 包的内置函数。\n\n这里我们展示 ROC 曲线和曲线下面积（AUC）值，假设模型只有两个类别：ProductChoice\
  \ “One” 和 “Rest”。如果我们仅使用类别“One”/1 的概率，这将为我们提供一系列截断点尺度。请注意，在以下代码中，我们正在重新创建模型，将多类问题转化为二分类问题。本质上，概率尺度的多项分布以总和为\
  \ 1 的方式在各类别间分配概率，而对于 ROC，我们需要某个类别的全范围概率来调整分类的阈值/截断点值。\n\n为便于说明，我们将使用仅包含两个选择类别（0\
  \ 或 1）的购买预测数据，定义如下：\n\n*   如果客户从包含四种产品的目录中选择产品 1，则定义为 1；这构成我们的正类\n*   如果客户选择除产品\
  \ 1 以外的任何其他产品，则定义为 0；这构成我们的负类\n\n我们根据此定义创建二元逻辑模型。\n\n```\n"
