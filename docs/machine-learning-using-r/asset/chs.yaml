  ### 8.6.2 基于决策树的梯度提升


  对于提升方法，我们将介绍两种最流行的算法：


  *   C5.0：由 Ross Quinlan 开发的决策树


  *   梯度提升机


  以下代码首先创建了一个 C5.0 决策树模型，然后创建了一个 GBM 模型。两个模型准备就绪后，我们将这两个模型组合起来创建一个提升集成模型。


  ```

  library(C50)

  library(gbm)

  dataset <-Data;

  '
- '# 提升算法示例

  control <-trainControl(method="repeatedcv", number=10, repeats=3)

  metric <- "Accuracy"

