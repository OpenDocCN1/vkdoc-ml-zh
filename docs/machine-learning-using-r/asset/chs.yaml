  \            1.750e+05  4.214e+04   4.153 3.54e-05 ***\nRating9               2.482e+05\
  \  4.261e+04   5.825 7.61e-09 ***\nRating10              2.930e+05  4.369e+04  \
  \ 6.708 3.23e-11 ***\nSaleTypeFirstResale   2.146e+04  2.470e+04   0.869  0.38512\n\
  SaleTypeFourthResale  6.725e+03  2.791e+04   0.241  0.80964\nSaleTypeNewHouse  \
  \    2.329e+03  2.424e+04   0.096  0.92347\nSaleTypeSecondResale -5.524e+03  2.465e+04\
