  \ 来设置 Hive。\n\n*   或者，您可以从 Cloudera、Hortonworks 或 MapR 下载虚拟机（也称为沙箱）。这些虚拟机预装了 Hadoop\
  \ 的所有必要工具和组件，可帮助您快速上手。这里有几个选项：Horton VM：[`http://hortonworks.com/products/sandbox/`](http://hortonworks.com/products/sandbox/)\
