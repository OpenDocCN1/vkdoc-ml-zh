  max(Power_Consumption$Datetime)

  ## [1] "2018-08-01"

  #记录消耗的时间间隔 - 假设所有间隔相等

  Power_Consumption$Datetime[3]-Power_Consumption$Datetime[2]

  ## Time difference of 30 days

