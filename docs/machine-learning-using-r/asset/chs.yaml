  \n这些监督学习算法在工业界和许多研究工作中具有广泛的适应性。决策树的底层设计使其易于解释，并且该模型非常直观地与现实世界问题相关联。像 Boosting 和\
  \ Bagging 这样的方法催生了基于决策树的高精度模型。特别是，随机森林现在是许多分类问题中使用最广泛的模型之一。\n\n我们详细讨论了决策树，从最早的决策树模型（如\
  \ ID3）开始，然后介绍了当前的 Bagging CART 和随机森林算法。\n\n在下一节中，我们将讨论本书中的第一个概率模型。贝叶斯模型易于实现，并且足够强大，能够从给定的观测集及其类别标签中捕获大量信息。\n\
  \n## 6.8 朴素贝叶斯方法\n\n朴素贝叶斯是一种基于概率模型的机器学习算法，在其早期用例中用于文本分类。这些方法属于机器学习中贝叶斯算法的广泛类别。文档分类和电子邮件垃圾邮件过滤器等应用是朴素贝叶斯作为分类器算法证明其非常有效的首批领域。该算法的名称源于它依赖于概率论中最强大的概念之一——*贝叶斯定理*、贝叶斯规则或贝叶斯公式。在接下来的章节中，我们将正式介绍理解朴素贝叶斯所需的背景知识，并演示其在我们的购买预测数据集上的应用。\n\
  \n### 6.8.1 条件概率\n\n条件概率在确定一个事件对另一个事件的影响方面起着重要作用。如果已知另一个事件对所研究的事件有影响，它可能会增加或减少该事件的概率。回想一下我们在第\
  \ 1 章中关于 Facebook 附近功能的讨论，我们计算了这个概率：\n\n![$$ \\mathrm{P}\\left(\\mathrm{Visit}\\\
  kern0.5em \\mathrm{Cineplex}\\kern0.5em |\\kern0.5em \\mathrm{Nearby}\\right) $$](img/416805_2_En_6_Chapter_TeX_Equar.png)\n\
  \n换句话说，“你的朋友在电影院附近”这一信息如何影响你去电影院的可能性。\n\n### 6.8.2 贝叶斯定理\n\n贝叶斯定理（或贝叶斯规则、贝叶斯公式）将两个事件之间的条件概率定义为\n\
  \n![$$ \\mathrm{P}\\left(\\mathrm{A}|\\mathrm{B}\\right)=\\frac{\\mathrm{P}\\left(\\\
  mathrm{B}|\\mathrm{A}\\right)\\cdot \\mathrm{P}\\left(\\mathrm{A}\\right)}{\\mathrm{P}\\\
  left(\\mathrm{B}\\right)} $$](img/416805_2_En_6_Chapter_TeX_Equas.png)\n\n其中\n\n\
  P(A) 是先验概率，\n\n![$$ \\mathrm{P}\\left(\\mathrm{A}|\\mathrm{B}\\right) $$](img/416805_2_En_6_Chapter_TeX_IEq14.png)\
  \ 是后验概率，读作在事件 B 发生的条件下事件 A 发生的概率。\n\nP(B) 是边际似然\n\n![$$ \\mathrm{P}\\left(\\mathrm{B}|\\\
  mathrm{A}\\right) $$](img/416805_2_En_6_Chapter_TeX_IEq15.png) 是似然\n\n![$$ \\mathrm{P}\\\
  left(\\mathrm{B}|\\mathrm{A}\\right)\\cdot \\mathrm{P}\\left(\\mathrm{A}\\right)\
  \ $$](img/416805_2_En_6_Chapter_TeX_IEq16.png) 也可以看作是联合概率，表示事件 A 与事件 B 的交集概率；换句话说，就是事件\
  \ A 和事件 B 同时发生的概率。\n\n重新排列贝叶斯定理，我们可以将其写为\n\n![$$ \\mathrm{P}\\left(\\mathrm{A}|\\\
  mathrm{B}\\right)=\\frac{\\mathrm{P}\\left(\\mathrm{B}|\\mathrm{A}\\right)}{\\mathrm{P}\\\
  left(\\mathrm{B}\\right)}\\cdot \\mathrm{P}\\left(\\mathrm{A}\\right) $$](img/416805_2_En_6_Chapter_TeX_Equat.png)\n\
  \n其中项 ![$$ \\mathrm{P}\\left(\\mathrm{B}\\right) $$](img/416805_2_En_6_Chapter_TeX_IEq17.png)\
  \ 表示事件 B 对事件 A 发生概率的影响。\n\n这将构成我们朴素贝叶斯算法的核心。因此，在进入该算法之前，让我们简要理解贝叶斯定理中讨论的三个术语。\n\n\
  ### 6.8.3 先验概率\n\n先验概率或*先验*表示在考虑某些证据之前，某个事件发生的确定性。以同样的 Facebook 附近功能为例，如果你对朋友当前的位置一无所知，他去电影院的可能性有多大？\n\
  \n### 6.8.4 后验概率\n\n以另一个事件为条件的事件 A 发生的概率给出了后验概率。因此，在 Facebook 附近功能中，如果我们知道你的朋友在电影院一英里范围内（定义为附近），他去电影院的可能性如何变化。这种额外的证据有助于提高特定事件的确定性。我们将利用这一基本原理来设计朴素贝叶斯算法。\n\
  \n### 6.8.5 似然与边际似然\n\n如果我们稍微修改第 1 章中的表 1-2，其中你看到了一个关于 Facebook 附近示例的二维列联表（也称为频率表），并将其转换为一个似然表，如表\
  \ 6-6 所示，其中每个单元格中的条目现在是一个条件概率。\n\n**表 6-6** *一个似然表* ![../images/416805_2_En_6_Chapter/416805_2_En_6_Figf_HTML.jpg](img/416805_2_En_6_Figf_HTML.jpg)\n\
  \n查看表 6-6，现在很容易计算出边际似然 P(Nearby)为 12/25 = 0.48。以及似然 P(Nearby | Visit Cineplex)为\
  \ 10/12 = 0.83。正如你所观察到的，边际似然不依赖于另一个事件。\n\n\n\n### 6.8.6 朴素贝叶斯方法\n\n综上所述，我们得到了朴素贝叶斯的最终形式：\n\
  \n![$$ \\mathrm{P}\\left(\\mathrm{Visit}\\kern0.5em \\mathrm{Cineplex}\\kern0.5em\
  \ |\\kern0.5em \\mathrm{Nearby}\\right)=\\frac{\\mathrm{P}\\left(\\mathrm{Nearby}\\\
  kern0.5em |\\kern0.5em \\mathrm{Visit}\\kern0.5em \\mathrm{Cineplex}\\right)\\ast\
  \ \\mathrm{P}\\left(\\mathrm{Visit}\\kern0.5em \\mathrm{Cineplex}\\right)}{\\mathrm{P}\\\
  left(\\mathrm{Nearby}\\right)} $$](img/416805_2_En_6_Chapter_TeX_Equau.png)\n\n\
  进一步推广，假设我们有一个数据集，由向量 ![$$ \\mathrm{x}=\\left({\\mathrm{x}}_1,\\dots, {\\mathrm{x}}_{\\\
  mathrm{n}}\\right) $$](img/416805_2_En_6_Chapter_TeX_IEq18.png) 表示，包含 n 个相互独立的特征（这是朴素贝叶斯中的一个强假设，任何违反此性质的数据集在朴素贝叶斯中表现都会很差），那么一个给定的观测值可以以概率\
  \ ![$$ \\mathrm{p}\\left({\\mathrm{C}}_{\\mathrm{k}}|,{\\mathrm{x}}_1|,\\dots |,{\\\
  mathrm{x}}_{\\mathrm{n}}\\right) $$](img/416805_2_En_6_Chapter_TeX_IEq19.png) 被分类到\
  \ K 个类别 C[k] 中的某一个。\n\n现在，使用贝叶斯定理，我们可以将条件概率写为：\n\n![$$ \\mathrm{p}\\left({\\mathrm{C}}_{\\\
  mathrm{k}}|\\mathrm{x}\\right)=\\frac{\\mathrm{p}\\left({\\mathrm{C}}_{\\mathrm{k}}\\\
  right)\\kern1em \\mathrm{p}\\left(\\mathrm{x}|{\\mathrm{C}}_{\\mathrm{k}}\\right)}{\\\
  mathrm{p}\\left(\\mathrm{x}\\right)} $$](img/416805_2_En_6_Chapter_TeX_Equav.png)\n\
  \n分子 ![$$ p\\left({C}_k\\right)\\kern1em p\\left(x|{C}_k\\right) $$](img/416805_2_En_6_Chapter_TeX_IEq20.png)\
  \ 表示联合概率，可以使用链式法则展开。不过，我们将把这个讨论留给更高级的专题文本。\n\n至此，我们已经讨论了贝叶斯定理如何作为建模现实世界问题的强大工具。此外，可以证明，如果预先计算好似然表，那么实时实现只需进行表查找即可快速计算，朴素贝叶斯会非常有效。朴素贝叶斯简洁优雅，但在建模问题时若能认真考虑其假设，则功能强大。\n\
