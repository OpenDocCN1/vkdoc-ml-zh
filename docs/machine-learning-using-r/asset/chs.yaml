  \n在此方法中，用于演示的 R 代码仅接受名义型或有序型分类预测变量。对于每个预测变量，该算法通过合并不显著的类别来工作，其中如果算法选择 X（基于调整后的 p\
  \ 值）来分割节点，则 X 的每个最终类别将产生一个子节点。\n\n以下算法借鉴自 R 语言中 CHAID 包的文档以及 G. V. Kass（1980）的经典论文《一种用于调查大量分类数据的探索性技术》。\n\
  \n1.  如果 X 只有一个类别，则停止并将调整后的 p 值设为 1。\n2.  如果 X 有两个类别，则转到步骤 8。\n3.  否则，找到 X 的允许类别对（对于有序型预测变量，允许的类别对是两个相邻类别；对于名义型预测变量，则是任意两个类别），该对在统计上差异最小（即最相似）。最相似的一对是指其检验统计量相对于因变量\
  \ Y 给出最大 p 值的类别对。如何在各种情况下计算 p 值将在后续章节中描述。\n4.  对于具有最大 p 值的类别对，检查其 p 值是否大于用户指定的 alpha\
  \ 水平 `alpha2`。如果是，则将该对合并为一个复合类别，从而形成一组新的 X 类别。如果不是，则转到步骤 7。\n5.  （可选）如果新形成的复合类别包含三个或更多原始类别，则在该复合类别内找到\
  \ p 值最小的最佳二元分割。如果其 p 值不大于 alpha 水平 `alpha3`，则执行此二元分割。\n6.  转到步骤 2。\n7.  （可选）任何观测值过少（与用户指定的最小分段大小相比）的类别，将与根据最大\
  \ p 值衡量的最相似的其他类别合并。\n8.  通过应用将在后面讨论的 Bonferroni 调整，为合并后的类别计算调整后的 p 值。\n\n**分割**：在合并步骤中为每个预测变量找到最佳分割。分割步骤选择使用哪个预测变量来最佳地分割节点。通过比较与每个预测变量相关的调整后\
  \ p 值来完成选择。调整后的 p 值在合并步骤中获得。\n\n1.  选择具有最小调整后 p 值（即最显著）的预测变量。\n2.  如果此调整后的 p 值小于或等于用户指定的\
  \ alpha 水平 `alpha4`，则使用此预测变量分割节点。否则，不进行分割，该节点被视为终端节点。\n\n**停止**：停止步骤检查是否应根据以下停止规则停止树生长过程。\n\
  \n1.  如果节点变得纯净，即节点中的所有案例都具有相同的因变量值，则该节点将不再分割。\n2.  如果节点中的所有案例对于每个预测变量都具有相同的值，则该节点将不再分割。\n\
  3.  如果当前树的深度达到用户指定的最大树深度限制值，则树生长过程将停止。\n4.  如果节点的大小小于用户指定的最小节点大小值，则该节点将不再分割。\n5.\
  \  如果分割一个节点导致其子节点的大小小于用户指定的最小子节点大小值，则案例过少（与此最小值相比）的子节点将与根据最大 p 值衡量的最相似子节点合并。但是，如果由此产生的子节点数量为\
  \ 1，则该节点将不再分割。\n6.  如果树的高度为正值且等于最大高度。\n\n现在，让我们在我们的购买预测数据集上进行演示。\n\n### 注意\n\n要使用本节中的代码，请执行以下步骤：\n\
  \n1.  根据您的机器从 [`https://r-forge.r-project.org/R/?group_id=343`](https://r-forge.r-project.org/R/%253Fgroup_id%253D343)\
  \ 下载 `zip` 或 `.tar.gz` 文件。\n2.  将压缩文件的内容解压到一个名为 `CHAID` 的文件夹中，并将其放置在 R 的安装文件夹中。安装文件夹可能类似于\
