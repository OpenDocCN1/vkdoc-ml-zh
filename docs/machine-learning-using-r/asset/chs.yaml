  ### 6.9.3 内部评估


  当基于被聚类的数据来评估聚类结果时，这被称为内部评估。这些方法通常将最高评分分配给能够生成簇内相似度高、簇间相似度低的聚类算法。


  #### 6.9.3.1 邓恩指数


  J. Dunn 于 1974 年在其发表于《控制论杂志》的论文《良好分离的簇与最优模糊划分》中提出了该指数。[7]


  邓恩指数旨在识别密集且分离良好的簇。它被定义为最小簇间距离与最大簇内距离之比。对于每个簇划分，可以使用以下公式计算邓恩指数。


  ![$$ \mathrm{D}=\frac{\underset{1\le \mathrm{i}&lt;j\le n}{\min}\mathrm{d}\left(\mathrm{i},\mathrm{j}\right)}{\underset{1\le
  \mathrm{k}\le \mathrm{n}}{\max }{\mathrm{d}}^{\prime}\left(\mathrm{k}\right)} $$](img/416805_2_En_6_Chapter_TeX_Equay.png)


  其中 *d(i,j)* 表示簇 *i* 和 *j* 之间的距离，*d’(k)* 衡量簇 *k* 的簇内距离。


  ```

  library(clValid)

  #Showing for hierarchical cluster with clusters = 3

  dunn(dist(Data_House_Worth[,2:3]), clusterCut_3)

  [1] 0.009965404

  ```


  邓恩指数的取值范围在 0 到无穷大之间，且应最大化。高值的邓恩分数更理想；此处该值过低，表明这不是一个好的聚类。


  #### 6.9.3.2 轮廓系数


  轮廓系数将同一簇内元素之间的平均距离与其他簇内元素之间的平均距离进行对比。轮廓值高的对象被认为是良好聚类的；轮廓值低的对象可能是离群点。


  ![../images/416805_2_En_6_Chapter/416805_2_En_6_Fig48_HTML.jpg](img/416805_2_En_6_Fig48_HTML.jpg)


  图 6-48


  轮廓图


  ```

  library(cluster)

  #Showing for k-means cluster with clusters = 3

  sk <-silhouette(clusterCut_3,dist(Data_House_Worth[,2:3]))

  plot(sk)

  ```


  图 6-48 中的轮廓图展示了三个簇在轮廓宽度上的表现。


  ### 6.9.4 外部评估


  外部评估类似于对测试数据进行的评估。用于测试的数据不用于训练模型。然后，由专家或某些第三方基准对测试数据进行评估并分配标签。接着，对这些已标记项进行聚类的结果为我们提供了衡量聚类效果优劣的指标。由于该指标依赖于外部输入，因此被称为外部评估。


  如果我们知道实际簇的样子，那么该方法很简单。然后我们就可以进行这些评估。在我们的案例中，我们已经知道房屋价值指标，因此可以计算这些评估指标。实际上，我们的数据在聚类之前已经标记好了，因此我们可以对用于聚类的同一数据进行外部评估。


  #### 6.9.4.1 兰德指数


  兰德指数类似于多类分类问题中的分类率。它衡量的是聚类返回的项与专家（标记）项有多少是共同的，有多少是不同的。如果我们假设专家标签（或外部标签）是正确的，那么该指标衡量的是正确分类率。可以使用以下公式计算[8]：


  ![$$ \mathrm{RI}=\frac{\mathrm{TP}+\mathrm{TN}}{\mathrm{TP}+\mathrm{FP}+\mathrm{FN}+\mathrm{TN}}
  $$](img/416805_2_En_6_Chapter_TeX_Equaz.png)


  其中 *TP* 是真阳性数量，*TN* 是真阴性数量，*FP* 是假阳性数量，*FN* 是假阴性数量。


  ```

  #Unsign result from EM Algo

  library(EMCluster)

  clust <-ret.new$class

  orig <-ifelse(Data_House_Worth$HouseNetWorth == "High",2,

  ifelse(Data_House_Worth$HouseNetWorth == "Low",1,2))

  RRand(orig, clust)

  Rand adjRand  Eindex

  0.7653  0.5321  0.4099

  ```


  兰德指数值较高，为 0.76，表明我们的 EM 方法聚类拟合效果良好。


  #### 6.9.4.2 杰卡德指数


  杰卡德指数与兰德指数类似。杰卡德指数衡量的是外部标签与聚类算法生成的标签之间的重叠程度。杰卡德指数值在 0 到 1 之间变化，0 表示无重叠，1 表示数据集完全相同。杰卡德指数由以下公式定义：


  ![$$ \mathrm{J}\left(\mathrm{A},\mathrm{B}\right)=\frac{\left|\mathrm{A}\cap \mathrm{B}\right|}{\left|\mathrm{A}\cup
  \mathrm{B}\right|}=\frac{\mathrm{TP}}{\mathrm{TP}+\mathrm{FP}+\mathrm{FN}} $$](img/416805_2_En_6_Chapter_TeX_Equba.png)


  其中 *TP* 是真阳性数量，*FP* 是假阳性数量，*FN* 是假阴性数量。


  ```

  #Unsign result from EM Algo

  #Unsign result from EM Algo

  library(EMCluster)

  clust <-ret.new$class

  orig <-ifelse(Data_House_Worth$HouseNetWorth == "High",2,

  ifelse(Data_House_Worth$HouseNetWorth == "Low",1,2))

  Jaccard.Index(orig, clust)

  [1] 0.1024096

  ```


  该指数值较低，表明只有 10% 的值是共同的。这意味着原始标签与聚类标签的重叠程度较低。这不是一个好的聚类形成。




  ### 6.9.5 结论


  这些监督学习算法在工业界和研究中具有广泛的适应性。决策树的基础设计使其易于解释，并且该模型非常直观，易于与现实世界问题建立联系。像提升法和装袋法这类方法，催生了基于决策树的高精度模型。特别是，随机森林如今已成为许多分类问题中广泛使用的模型之一。


  我们详细讨论了决策树，从最初的决策树模型（如 ID3）开始，接着介绍了当代的装袋 CART 和随机森林算法。


  在下一节中，我们将看到关联规则挖掘，它处理事务数据，已在市场购物篮分析中得到应用，并催生了许多强大的推荐算法。


  ## 6.10 关联规则挖掘


  关联规则学习是一种用于发现大型数据库中变量之间有趣关系的方法。它旨在通过使用某些兴趣度度量来识别在数据库中发现的有力规则。基于强规则的概念，Rakesh Agrawal
  等人引入了关联规则，用于发现超市销售点（POS）系统记录的大规模交易数据中产品之间的规律性。


  例如，在超市销售数据中发现的规则 ![$$ \left\{\mathrm{onions},\mathrm{potatoes}\right\}\Rightarrow
  \left\{\mathrm{burger}\right\} $$](img/416805_2_En_6_Chapter_TeX_IEq21.png) 表明，如果顾客同时购买洋葱和土豆，他们很可能也会购买汉堡肉。图书馆是另一个很好的例子，其中规则挖掘在图书管理和库存补充方面发挥着重要作用。Hossain
  和 Rashedur 的论文《基于关联规则挖掘的图书馆资料采购》是一篇很好的读物，可以扩展关联规则挖掘在实际场景中应用的理念。


  ### 6.10.1 关联概念介绍


  事务数据通常是企业丰富的信息来源。在传统模式下，企业从报告和生成仪表盘的角度审视这些数据，以便高管了解其业务健康状况。在 Agrawal 等人的开创性研究论文《挖掘大型数据库中项集之间的关联规则》中，他们提出了使用这些数据的替代方案：


  *   提升商店中某个产品（商品）的销量

  *   停产某个产品的影响

  *   将多个产品捆绑在一起进行促销

  *   在实体超市中更好地规划货架

  *   基于购买模式的客户细分


  考虑市场购物篮数据，其中项集 ![$$ \mathrm{I}= $$](img/416805_2_En_6_Chapter_TeX_IEq22.png) {面包和蛋糕、烘焙用品、饼干、罐装水果、罐装蔬菜、冷冻食品、洗衣用品、除臭皂、果酱涂抹酱}


  数据库 ![$$ \mathrm{D}={\mathrm{T}}_1,{\mathrm{T}}_2,{\mathrm{T}}_3,{\mathrm{T}}_4,{\mathrm{T}}_5
  $$](img/416805_2_En_6_Chapter_TeX_IEq23.png)


  并且 {面包和蛋糕、烘焙用品、果酱涂抹酱} 是项集 I 的一个子集，而 ![$$ \left\{\mathrm{bread}\kern0.5em \mathrm{and}\kern0.5em
  \mathrm{cake},\kern0.5em \mathrm{baking}\kern0.5em \mathrm{needs}\right\}\kern0.5em
  \Rightarrow \left\{\mathrm{Jams}\kern0.5em \mathrm{spreads}\right\} $$](img/416805_2_En_6_Chapter_TeX_IEq24.png)
  是一个典型的规则。


  以下部分描述了一些有用的度量，可以帮助我们迭代算法。


  #### 6.10.1.1 支持度


  支持度是一个项集出现在事务中的比例。我们将其表示为 *supp(X)*，其中 *X* 是一个项集。例如，


  ![$$ \mathit{\operatorname{supp}}\left(\left\{\mathrm{bread}\kern0.5em \mathrm{and}\kern0.5em
  \mathrm{cake},\mathrm{baking}\kern0.5em \mathrm{needs}\right\}\right)=2/5=0.4 $$](img/416805_2_En_6_Chapter_TeX_IEq25.png)
  且 ![$$ \mathit{\operatorname{supp}}\left(\left\{\mathrm{bread}\kern0.5em \mathrm{and}\kern0.5em
  \mathrm{cake}\right\}\right)=3/5=0.6 $$](img/416805_2_En_6_Chapter_TeX_IEq26.png)。


  #### 6.10.1.2 置信度


  支持度有助于理解项集的强度，而置信度则指示规则的强度。例如，在规则 ![$$ \left\{\mathrm{bread}\kern0.5em \mathrm{and}\kern0.5em
  \mathrm{cake},\kern0.5em \mathrm{baking}\kern0.5em \mathrm{needs}\right\}\kern0.5em
  \Rightarrow \left\{\mathrm{Jams}\kern0.5em \mathrm{spreads}\right\} $$](img/416805_2_En_6_Chapter_TeX_IEq27.png)
  中，置信度是在事务同时包含 {面包和蛋糕、烘焙用品}（左侧）的条件下，找到项集 {果酱涂抹酱}（右侧）的条件概率。


  更技术性地讲，置信度定义为


  ![$$ \mathrm{conf}\left(\mathrm{X}\Rightarrow \mathrm{Y}\right)=\frac{\mathit{\operatorname{supp}}\left(\mathrm{X}\cup
  \mathrm{Y}\right)}{\mathit{\operatorname{supp}}\left(\mathrm{X}\right)}, $$](img/416805_2_En_6_Chapter_TeX_Equbb.png)


  规则 ![$$ \left\{\mathrm{bread}\kern0.5em \mathrm{and}\kern0.5em \mathrm{cake},\kern0.5em
  \mathrm{baking}\kern0.5em \mathrm{needs}\right\}\kern0.5em \Rightarrow \left\{\mathrm{Jams}\kern0.5em
  \mathrm{spreads}\right\} $$](img/416805_2_En_6_Chapter_TeX_IEq28.png) 的置信度为 ![$$
  0.2/0.4=0.5 $$](img/416805_2_En_6_Chapter_TeX_IEq29.png)，这意味着当顾客购买 {面包和蛋糕、烘焙用品}
  时，有 50% 的概率他们也会购买 {果酱涂抹酱}。




  #### 6.10.1.3 提升度


  如果一条规则的左侧（LHS）和右侧（RHS）相互独立，即购买一个商品不依赖于另一个商品，那么提升度就是观察到的支持度与预期支持度之间的比值。因此，如果提升度 =
  1，则 LHS 和 RHS 相互独立，这样的规则毫无意义；而如果提升度 > 1，则表明这两个事件相互依赖的程度。


  更技术性的表述如下：


  ![$$ \mathrm{lift}\left(\mathrm{X}\Rightarrow \mathrm{Y}\right)=\frac{\mathit{\operatorname{supp}}\left(\mathrm{X}\cup
  \mathrm{Y}\right)}{\mathit{\operatorname{supp}}\left(\mathrm{X}\right)\times \mathit{\operatorname{supp}}\left(\mathrm{Y}\right)}
  $$](img/416805_2_En_6_Chapter_TeX_Equbc.png)


  规则 ![$$ \left\{\mathrm{bread}\kern0.5em \mathrm{and}\kern0.5em \mathrm{cake},\kern0.5em
  \mathrm{baking}\kern0.5em \mathrm{needs}\right\}\kern0.5em \Rightarrow \left\{\mathrm{Jams}\kern0.5em
  \mathrm{spreads}\right\} $$](img/416805_2_En_6_Chapter_TeX_IEq30.png) 的提升度为 ![$$
  \frac{0.2}{0.4\times 0.4}=1.25 $$](img/416805_2_En_6_Chapter_TeX_IEq31.png)，这意味着购买{面包和蛋糕、烘焙用品}的顾客购买{果酱涂抹酱}的可能性是普通顾客的
  1.25 倍。


  还有其他一些度量指标，如确信度、杠杆率和集体强度；然而，这三个指标在所有文献中被广泛使用，并且足以理解 Apriori 算法。


  对于像这样的小例子，事情可能进展顺利，但在实际应用中，典型的交易数据库非常庞大。Agrawal 等人提出了一种简单而快速的算法来处理大型数据库。


  1.  第一步，生成所有可能的候选项集。

  2.  然后，使用这些候选项集形成规则。

  3.  通常，提升度最高的规则是首选。


  后来，Apriori 算法衍生出许多变体，但其原始形式如下。以下是 Apriori 算法生成候选项集的步骤：


  1.  确定单元素项集（即单个项）的支持度，并丢弃不频繁的项/项集。

  2.  形成包含两个项的候选项集（两个项都必须频繁），确定它们的支持度，并丢弃不频繁的项集。

  3.  形成包含三个项的候选项集（所有包含的项对都必须频繁），确定它们的支持度，并丢弃不频繁的项集。

  4.  继续形成包含四个、五个等项的候选项集，直到没有频繁的候选项集为止。


