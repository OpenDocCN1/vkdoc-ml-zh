  ## 9.2 平稳性检验


  时间序列的平稳性是使用自相关函数（ACF）对时间序列进行推断的重要假设。平稳性意味着任何特定滞后的自相关不随时间变化。


  *自相关*是随机过程中不同时间点时间序列值之间的相关性。


  设 `X` 为一个随机过程，`t` 为任意时间点（对于离散时间过程，`t` 可以是整数；对于连续时间过程，`t` 可以是实数）。那么 `Xt` 是该过程在时间
  `t` 时某次运行产生的值（或实现值）。假设该过程在时间 `t` 的均值为 *μ*[*t*]，方差为 *σ*[*t*]²。则时间 `s` 和 `t` 之间的自相关定义为：


  ![$$ R\left(s,t\right)=\frac{\mathrm{E}\left[\left({X}_t-{\mu}_t\right)\left({X}_s-{\mu}_s\right)\right]}{\sigma_t{\sigma}_s},
  $$](images/416805_2_En_9_Chapter/416805_2_En_9_Chapter_TeX_Equa.png)


  其中 `E` 是期望值算子。


  更正式地说，如果序列 *X*[*t*] 满足以下性质，则称其为（弱）平稳序列：


  1.  对于所有 `t`，均值 E(*x*[*t*]) 相同。

  2.  对于所有 `t`，*x*[*t*] 的方差相同。

  3.  对于所有 `t`，*x*[*t*] 与 *x*[*t* − *h*] 之间的协方差（以及相关性）相同。


  设 *x*[*t*] 表示时间序列在时间 `t` 的值。该序列的 ACF 给出了 *x*[*t*] 与 *x*[*t* − *h*] 在 h = 1, 2, 3
  等时的相关性。理论上，*x*[*t*] 与 *x*[*t* − *h*] 之间的自相关等于：


  ![$$ \frac{\mathrm{Covariance}\left({x}_t,{x}_{t-h}\right)}{\mathrm{Std}.\mathrm{Dev}.\left({x}_t\right)\
  \mathrm{Std}.\mathrm{Dev}.\left({x}_{t-h}\right)}=\frac{\mathrm{Covariance}\left({x}_t,{x}_{t-h}\right)}{\mathrm{Variance}\left({x}_t\right)}
  $$](img/416805_2_En_9_Chapter_TeX_Equb.png)


  第二个公式中的分母之所以成立，是因为平稳序列的标准差在所有时间点上都相同。


  现在我们将介绍用于检验平稳性的迪基-富勒检验，并将其应用于我们的数据集。在应用任何时间序列建模技术之前，必须检查时间序列的平稳性。


  一个简单的 AR(1) 模型是：


  ![$$ {y}_t=\rho {y}_{t-1}+{u}_t\kern0.125em {y}_t=\rho {y}_{t-1}+{u}_t $$](img/416805_2_En_9_Chapter_TeX_Equc.png)


  其中 *y*[*t*] 是感兴趣的变量，*t* 是时间索引，*ρ* 是系数，*u*[*t*] 是误差项。如果 *ρ* = `1`，则存在单位根。在这种情况下，模型是非平稳的。


  迪基-富勒检验用于检验原假设，以确定自回归模型中是否存在单位根。


  该检验主要有三种形式：


  1.  检验单位根：


  ![$$ \varDelta {y}_t=\delta {y}_{t-1}+{u}_t $$](img/416805_2_En_9_Chapter_TeX_Equd.png)


  1.  检验带漂移项的单位根：


  ![$$ \varDelta {y}_t={a}_0+\delta {y}_{t-1}+{u}_t $$](img/416805_2_En_9_Chapter_TeX_Eque.png)


  1.  检验带漂移项和确定性时间趋势的单位根：


  ![$$ \varDelta {y}_t={a}_0+{a}_1t+\delta {y}_{t-1}+{u}_t $$](img/416805_2_En_9_Chapter_TeX_Equf.png)


  还有其他用于检验平稳性的统计检验。常用的有克维亚特科夫斯基-菲利普斯-施密特-辛（KPSS）检验和菲利普斯-佩龙检验。


  ```

  '
- '# 我们将对数据集应用所有三种检验，并查看三种检验的结果

  library(aTSA)

  '
- '# 增广迪基-富勒检验

  stationary.test(Power_Consumption$Average_Consumption, method = c("adf"), nlag =
  12, type = c("Z_rho", "Z_tau"), lag.short = TRUE, output = TRUE)

  ## 增广迪基-富勒检验

  ## 备择假设：平稳

  ##

  ## 类型 1：无漂移项无趋势项

  ##       滞后     ADF  p 值

  ##  [1,]   0 -0.46154   0.505

