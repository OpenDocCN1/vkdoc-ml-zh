  \ 划分了整个总体。每个层代表一组具有相似行为的客户，因为他们来自同一个层。为便于阅读，以下输出已做精简。\n\n```\n#总体数据的交叉表频率\ntable(data$State,data$CardType)\n\
  American Express Discover MasterCard   Visa\nAlabama                    4983   \
