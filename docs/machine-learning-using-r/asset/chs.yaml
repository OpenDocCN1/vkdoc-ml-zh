  ## 4.5 散点图


  *散点图*是一种有助于判断两个变量之间是否存在关系的图表。散点图使用笛卡尔坐标，在 x 轴和 y 轴上展示两个变量。虽然也存在更高维度的散点图，但它们难以可视化，因此二维散点图非常流行。如果增加颜色、形状或大小等维度，我们也可以在二维散点图上呈现两个以上的变量。在本例中，我们将研究世界银行发展指标中的一个人口增长指标。


  任何经济体的实力都源于其人民，而衡量公民在财务、健康、教育以及所有基本生活必需品方面是否安好，是至关重要的。一个强健的经济体，只有在其设计和规划始终将公民置于核心位置时才能建立起来。因此，虽然
  GDP 作为指标象征着国家的增长，但还有许多指标衡量人民如何随着 GDP 的增长而发展。所以，在查看这些指标之前，让我们先尝试使用一些广泛使用的可视化工具（如散点图、箱线图和直方图）来探索数据的基本特征。让我们看看人口增长数据和前十名国家的
  GDP 数据中是否出现了一些模式。


