  #### 6.9.2.2 基于质心的聚类


  以下文字摘自 Hartigan 等人的原始论文《A K-Means Clustering Algorithm》[6]，该文对 k-means 算法的工作原理给出了最精炼和准确的描述：


  *   *K-means 算法的目标是将 N 维空间中的 M 个点划分为 K 个聚类，使得聚类内平方和最小化。要求解在所有划分中具有最小平方和的方案是不切实际的，除非
  M、N 很小且 K = 2。我们转而寻求“局部”最优解，即满足以下条件的解：将任何一个点从一个聚类移动到另一个聚类都不会减少聚类内平方和。*


  其中，聚类内平方和（WCSS）是每个聚类中每个观测值到其质心的距离之和。更技术性地讲，对于一组观测值 (x[1], x[2], …, x[n]) 和一组 k 个聚类
  C = {C[1], C[2], …, C[k]}：


  ![$$ WCSS=\sum \limits_{\mathrm{i}=1}^{\mathrm{k}}\sum \limits_{\mathbf{x}\in {\mathbf{C}}_{\mathbf{i}}}{\left\Vert
  \mathbf{x}-{\mu}_{\mathrm{i}}\right\Vert}² $$](img/416805_2_En_6_Chapter_TeX_Equax.png)


  μ[i] 是 C[i] 中点的均值。


  算法：


  在该算法的最简形式中，包含两个步骤：


  *   **分配**：将每个观测值分配到能使其聚类内平方和（WCSS）最小的聚类。


  *   **更新**：通过计算聚类中所有观测值的均值来更新质心。


  这两个步骤会迭代执行，直到连续两次迭代中的分配不再发生变化，这意味着达到了局部或全局最优点（但并不总是保证）。


  ### 注意


  对于感兴趣的读者，Hartigan 等人在其原始论文中描述了一个七步流程。


  让我们使用 `HouseNetWorth` 数据来展示 k-means 聚类。与层次聚类不同，为了找到 k（聚类数量）的最优值，我们将使用肘部曲线。该曲线展示了作为聚类数量函数的方差解释百分比。


  ![../images/416805_2_En_6_Chapter/416805_2_En_6_Fig43_HTML.jpg](img/416805_2_En_6_Fig43_HTML.jpg)


  图 6-43


  x 轴上为不同 k 值（聚类数量）的肘部曲线


