  \n![../images/416805_2_En_5_Chapter/416805_2_En_5_Fig4_HTML.jpg](img/416805_2_En_5_Fig4_HTML.jpg)\n\
  \n图 5-4\n\n误分类误差与惩罚因子（lambda）的对数\n\n```\n#绘制结果\nplot (fit_logistic)\n```\n\n对于一个好的模型，图\
  \ 5-4 中的红点会呈现上升趋势。这时你就能知道你在数据集中测量的是何种变异性。\n\n我们现在可以从`glmnet()`拟合模型中提取正则化因子。我们提取了变量系数和变量名称。\n\
  \n```\n#打印最小 lambda - 正则化因子\nprint(fit_logistic$lambda.min)\n[1] 0.003140939\nprint(fit_logistic$lambda.1se)\n\
  [1] 0.03214848\n#根据 lambda 最小值，我们可以得到系数\nparam 0,]\nprint(param_embeded)\n1 feature\n\
  f279 8.990477e-03    f279\nf298 2.275977e-02    f298\nf322 1.856906e-01    f322\n\
  f377 1.654554e-04    f377\nf452 1.326603e-04    f452\nf453 1.137532e-05    f453\n\
  f471 1.548517e+00    f471\nf489 1.741923e-02    f489\n```\n\nLASSO 方法最终建议的特征是 f279、f298、f322、f377、f452、f453、f471\
  \ 和 f489。特征选择是一个统计学上非常密集的话题。我们鼓励你阅读更多关于这些方法的内容，并确保所选的方法论适合你试图解决的业务问题。在大多数实际场景中，数据科学家必须设计多种技术的组合，以获得机器学习所需的理想变量集。\n\
  \n## 5.5 主成分分析\n\n近年来，数据科学家可用的数据量和数据类型都呈爆炸式增长。传统的机器学习算法部分因为数据量而失效，但更主要的原因是每个观测值所关联的变量数量。数据的*维度*是指数据中每个观测值所拥有的变量数量。\n\
  \n在机器学习问题中，数据集中每增加一个特征，训练模型所需的数据点数量就会呈指数级增长。学习算法需要海量数据才能在更高维的空间中搜索到正确的模型。在训练样本数量固定的情况下，随着维度的增加，预测能力会下降，这被称为*休斯*现象（以戈登·F·休斯命名）。\n\
  \n降维是一个特征提取的过程，而非特征选择的过程。特征提取是将高维空间中的数据转换到更低维空间的过程。数据转换可以是线性的，如主成分分析（PCA），但也存在许多非线性降维技术。对于多维数据，可以通过多线性子空间学习，利用张量表示进行降维。例如，通过使用\
  \ PCA，你可以将一组变量缩减为一组更少的变量（主成分）来建模，比如，与其使用原始形式的所有 100 个特征，不如使用前 10 个 PCA 因子来构建模型，其性能与完整的实际模型相似。\n\
  \nPCA 基于协方差矩阵；它是一种二阶方法。协方差矩阵是一个矩阵，其第 i 行第 j 列的元素是随机向量中第 i 个和第 j 个元素之间的协方差。\n\n为了说明\
  \ PCA，我们将使用数据中随机选择的 10 个连续变量，创建主成分，并检查它们在解释数据方面的重要性。\n\n以下是主成分分析的步骤：\n\n1.  将数据加载为数据框。\n\
  \n2.  对数据进行归一化/缩放。\n\n3.  应用`prcomp()`函数获取主成分。\n\n这将对给定的数据矩阵执行主成分分析，并将结果作为`prcomp`类的对象返回。\n\
  \n\n\n```\n# 选取 10 个特征的子集\npca_data <-data[,.(f381,f408,f495,f529,f549,f539,f579,f634,f706,f743)]\n\
  pca_data <-na.omit(pca_data)\nhead(pca_data)\nf381 f408   f495       f529  f549\
