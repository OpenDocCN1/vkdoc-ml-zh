  \n## 6.4 回归分析\n\n在前面的章节中，我们一直在为建模技术能够服务于我们的预期目标奠定基础。本章将涉及统计学习和机器学习领域中一些开箱即用的技术。在这个阶段，你可能希望专注于算法方法，而不必过多担心统计假设在机器学习算法中扮演的角色。为了完整性，我们将在第\
  \ 8 章讨论统计学习与机器学习的区别。\n\n回归分析部分将侧重于构建一个思维过程，探讨建模技术如何建立并量化响应变量与预测变量之间的关系。我们将首先识别它们之间关系的强度和类型，并尝试判断这种关系是否可以用某种分布假设（如正态分布）来建模。我们还将讨论一些流行技术的重要诊断特征，并解释它们在模型选择中的意义。\n\
  \n这些技术的核心在于寻找具有统计显著性且不依赖于任何分布假设的关系。这些技术并不建立因果关系（最好用“强关联并非因果关系的证明”这一概念来理解），但能为数据科学家提供指示，说明在给定某些参数假设下数据序列是如何关联的。因果关系的建立取决于对过程的审慎判断和业务理解。\n\
  \n牢记因果关系的概念很重要，因为大多数时候我们的思维过程会偏离模型所量化关系的解释方式。例如，一个统计模型能够量化完全无关的度量之间的关系，比如发电量和啤酒消费量。线性模型能够量化它们之间的关系。但啤酒消费量与发电量有关吗？或者发电量增加意味着啤酒消费量增加吗？除非你非常努力地去证明，否则很难证实。因此，对讨论中的过程有清晰的理解以及具备领域知识至关重要。你必须质疑假设，才能从数据中获取真正的价值。在讨论回归中的相关性及其他概念时，必须牢记这种因果关系的“诅咒”。\n\
  \n任何回归分析都涉及三个关键变量集：\n\n*   **因变量或响应变量 (Y)**：输入序列\n*   **自变量或预测变量 (X)**：输入序列\n* \
  \  **模型参数**：需要由回归模型估计的未知参数\n\n对于多个自变量和一个因变量的情况，这些量可以被视为一个矩阵。\n\n回归关系可以表示为一个函数，该函数从自变量空间映射到因变量空间。这种关系是预测/预报的基础：\n\
  \n![$$ Y\\approx f\\left(\\mathrm{X},\\beta \\right) $$](img/416805_2_En_6_Chapter_TeX_Equa.png)\n\
  \n这种表示法看起来更像数学建模，而统计建模学者对同一关系使用略有不同的表示法：\n\n![$$ E\\left(Y|X\\right)=f\\left(X,\\\
  beta \\right) $$](img/416805_2_En_6_Chapter_TeX_Equb.png)\n\n在统计建模中，回归分析估计的是在已知自变量值条件下因变量的条件期望，这本质上就是给定自变量值时因变量的平均值。在扩展回归概念之前，需要理解的另一个重要概念是参数方法和非参数方法。本节的讨论将基于参数方法，而还存在其他一系列非参数技术。\n\
  \n*   ***参数方法*** 假设样本数据是基于一组固定参数从已知的概率分布中抽取的。例如，线性回归假设正态分布，而逻辑回归假设二项分布等。这一假设使得这些方法也能应用于小数据集。\n\
  *   ***非参数方法*** 不预先假设任何概率分布，而是从底层数据中构建经验分布。这些方法需要大量数据来进行模型估计。存在一个单独的非参数回归分支，这超出了本书的范围，例如核回归、非参数乘法回归（NPMR）等。关于此主题的更多阅读资料，推荐\
  \ Stuart Russell 和 Peter Norvig 所著的《人工智能：一种现代方法》^(²)。\n\n此外，使用参数方法可以让你轻松地围绕估计参数构建置信区间；我们将在模型诊断度量中使用这一点。在本书中，我们将处理两种类型的输入数据——具有正态性假设的连续输入和具有二项分布假设的逻辑回归。此外，还将提供一个关于广义框架的简要入门介绍，供进一步阅读。\n\
  \n\n## 6.5 相关分析\n\n> *统计科学的目标在于发现一些方法，将关于大量相关事实的信息浓缩成简洁且便于讨论的表达形式。*\n> \n> ——弗朗西斯·高尔顿爵士（1822-1911）\n\
  \n相关性可被视为一个更广义的术语，用于表示两个变量之间的统计关系。原则上，相关性提供了变量间关系的单一度量。由于关系量化的方式有多种，因此统计学中存在着多种类型的相关系数。\n\
  \n对于测量线性关系，皮尔逊相关系数是最佳度量。皮尔逊相关系数，也称为皮尔逊*积矩相关系数*，对线性关系敏感。它同样存在于非线性关系中，但在这种情况下无法提供任何有用信息。\n\
  \n假设有两个随机变量 X 和 Y，其均值分别为 μ[*X*] 和 μ[*Y*]，标准差分别为 *σ*[*X*] 和 *σ*[*Y*]。总体相关系数定义为：\n\
  \n![$$ \\rho X,Y=\\frac{\\mathrm{E}\\left[\\left(X-{\\mu}_X\\right)\\left(Y-{\\\
  mu}_Y\\right)\\right]}{\\sigma_X{\\sigma}_Y} $$](images/416805_2_En_6_Chapter/416805_2_En_6_Chapter_TeX_Equc.png)\n\
  \n由此我们可以推断出该度量的两个重要特征：\n\n*   其取值范围在 -1（负相关）到 +1（正相关）之间，这可由柯西-施瓦茨不等式推导得出。\n*   该度量仅在标准差有限且非零时才有定义。\n\
  \n类似地，对于来自总体的样本，该度量定义如下：\n\n![$$ {r}_{xy}=\\frac{\\sum \\limits_{i=1}^n\\left({x}_i-\\\
  overline{x}\\right)\\left({y}_i-\\overline{y}\\right)}{n{s}_x{s}_y}=\\frac{\\sum\
  \ \\limits_{i=1}^n\\left({x}_i-\\overline{x}\\right)\\left({y}_i-\\overline{y}\\\
  right)}{\\sqrt{\\sum \\limits_{i=1}^n{\\left({x}_i-\\overline{x}\\right)}²\\sum\
  \ \\limits_{i=1}^n{\\left({y}_i-\\overline{y}\\right)}²}}, $$](img/416805_2_En_6_Chapter_TeX_Equd.png)\n\
  \n让我们用房价数据创建一些散点图，看看能使用皮尔逊相关系数量化出什么样的关系。\n\n*因变量：* `HousePrice`\n\n*自变量：* `StoreArea`\n\
  \n```\nData_HousePrice <-read.csv(\"Dataset/House Sale Price Dataset.csv\",header=TRUE);\n\
  #Create a vectors with Y-Dependent, X-Independent\ny <-Data_HousePrice$HousePrice;\n\
  x<-Data_HousePrice$StoreArea;\n#Scatter Plot\nplot(x,y, main=\"Scatterplot HousePrice\
  \ vs StoreArea\", xlab=\"StoreArea(sqft)\", ylab=\"HousePrice($)\", pch=19,cex=0.3,col=\"\
  red\")\n#Add a fit line to show the relationship direction\nabline(lm(y~x)) # regression\
  \ line (y~x)\nlines(lowess(x,y), col=\"green\") # lowess line (x,y)\n```\n\n图 6-13\
  \ 展示了 `HousePrice` 与 `StoreArea` 之间的散点图。曲线是局部平滑拟合线。可以看出变量之间存在线性关系。\n\n![../images/416805_2_En_6_Chapter/416805_2_En_6_Fig13_HTML.jpg](img/416805_2_En_6_Fig13_HTML.jpg)\n\
  \n图 6-13\n\nHousePrice 与 StoreArea 之间的散点图\n\n```\n#Report the correlation coefficient\
  \ of this relation\ncat(\"The correlation among HousePrice and StoreArea is  \"\
  ,cor(x,y));\nThe correlation among HousePrice and StoreArea is   0.6212766\n```\n\
  \n从这些图中，我们可以得出以下观察结果：\n\n*   关系呈正方向，因此平均而言，房价随商店面积的增加而上涨。这是一种直观的关系，因此我们可以推断出因果关系。商店空间越大，房屋品质越好，这意味着价格更高。\n\
  *   相关系数为 0.62。在线性尺度上，这是一个中等强度的关系。\n*   曲线是 LOWESS（局部加权散点图平滑）图，显示其与线性回归线差异不大。因此，线性关系值得在模型中进一步探索。\n\
  *   如果仔细观察，在 `StoreArea` = 0 处有一条垂直线。这条垂直线表明，对于没有商店面积的房屋，价格存在差异。我们需要考察驱动房价的其他因素。\n\
  \n我们已经详细讨论了如何找到最适合数据的变量集。因此，在接下来的章节中，我们将不再关注如何得到该模型，而是更多地展示如何在 R 中运行和解释它们。\n\n\n\
  \n### 6.5.1 线性回归\n\n线性回归是一种拟合线性预测函数的过程，用于从基础数据中估计未知参数。通常，该模型预测给定 X 条件下 Y 的条件均值，该均值被假定为\
  \ X 的仿射函数。\n\n> *仿射函数：由于线性回归估计模型包含截距项，因此它不仅仅是 X 的线性函数，而是仿射函数。*\n\n本质上，线性回归模型将帮助你实现以下目标：\n\
  \n*   预测或预报\n*   量化变量之间的关系\n\n前者涉及如果存在某些未知的 X，那么 Y 的期望值是多少；后者则处理历史数据，以可量化的术语（例如参数和\
  \ p 值）说明这些变量之间的关系。\n\n在数学上，简单的线性关系如下所示：\n\n对于一组 *n* 个二元组 ![$$ \\left( xi, yi\\right),i=1,\\\
  dots, n $$](img/416805_2_En_6_Chapter_TeX_IEq1.png)，关系函数描述为：\n\n![$$ {y}_i=\\alpha\
  \ +\\beta {x}_i+{\\varepsilon}_i., $$](img/416805_2_En_6_Chapter_TeX_Eque.png)\n\
  \n线性回归的目标是估计这条直线：\n\n![$$ y=\\alpha +\\beta x $$](img/416805_2_En_6_Chapter_TeX_Equf.png)\n\
  \n其中 *y* 是预测响应（或拟合值），α 是截距，即当自变量为零时的平均响应值，β 是 x 的参数，即 *x* 每变化一个单位时 *y* 的变化量。\n\n\
  有多种方法可以用给定的数据集拟合这条直线。这取决于我们想要最小化的损失函数类型，例如普通最小二乘法、最小绝对偏差法、岭回归等。让我们看看最常用的方法——普通最小二乘法（OLS）。\n\
  \n在 OLS 中，算法最小化平方误差。该最小化问题可以定义如下：\n\n![$$ \\mathrm{Find}\\kern0.5em {\\min}_{\\\
  alpha, \\beta }Q\\left(\\alpha, \\beta \\right),\\kern3.625em \\mathrm{for}Q\\left(\\\
  alpha, \\beta \\right)=\\sum \\limits_{i=1}^n{\\varepsilon}_i²=\\sum \\limits_{i=1}^n{\\\
  left({y}_i-\\alpha -\\beta {x}_i\\right)}² $$](img/416805_2_En_6_Chapter_TeX_Equg.png)\n\
  \n作为一种参数化方法，我们可以得到这个优化问题的闭式解。估计系数（或参数）的闭式解使用以下公式：\n\n![$$ \\overline{\\beta}=\\\
  frac{\\sum {x}_i{y}_i-\\frac{1}{n}\\sum {x}_i\\sum {y}_i}{\\sum {x}_i²-\\frac{1}{n}{\\\
  left(\\sum {x}_i\\right)}²}=\\frac{\\mathrm{Cov}\\left[x,y\\right]}{\\sigma_x²},\\\
  kern1.75em \\overset{\\frown }{\\alpha }=\\overline{y}-\\overline{\\beta}\\overline{x}.\
  \ $$](images/416805_2_En_6_Chapter/416805_2_En_6_Chapter_TeX_Equh.png)\n\n其中，*σ*²[*x*]\
  \ 是 x 的方差。该解的推导过程可在以下网址找到：\n\n[`https://onlinecourses.science.psu.edu/stat414/node/278`](https://onlinecourses.science.psu.edu/stat414/node/278)\
  \ 。\n\n在对残差满足某些假设的条件下，OLS 对线性回归模型具有特殊性质。卡尔·弗里德里希·高斯和安德雷·马尔可夫共同提出了高斯-马尔可夫定理，该定理指出，如果满足以下条件：\n\
  \n*   残差的期望（均值）为零（残差正态性）\n*   残差不相关（无自相关）\n*   残差具有相等方差（同方差性）\n\n那么普通最小二乘估计能给出系数（或参数估计）的最佳线性无偏估计。我们现在解释构成最佳估计量的关键术语，即无偏性、一致性和有效性。\n\
  \n### 6.5.2 简单线性回归\n\n现在我们可以继续使用 OLS 技术来估计线性模型。R 中的 `lm()` 包为我们提供了对线性回归运行 OLS 的能力。`lm()`\
  \ 函数可用于执行回归、单层方差分析和协方差分析。它是 R 基础 `stats()` 包的一部分。\n\n现在，我们将创建一个简单线性回归，并理解如何解释这个简单案例中\
  \ `lm()` 的输出。这里我们使用 OLS 技术对以下内容拟合线性回归模型。\n\n*因变量：* `HousePrice`\n\n*自变量：* `StoreArea`\n\
  \n此外，我们的相关性分析表明这两个变量具有正线性关系，因此我们预期 `StoreArea` 的参数估计值为正。让我们运行并解释结果。\n\n```\n# 拟合模型\n\
  fitted_Model |t|)\n(Intercept) 70677.227   4261.027   16.59   <2e-16 ***\nx    \
  \         232.723      8.147   28.57   <2e-16 ***\n\nSignif. codes:  0 '***' 0.001\
  \ '**' 0.01 '*' 0.05 '.' 0.1 ' ' 1\nResidual standard error: 63490 on 1298 degrees\
  \ of freedom\nMultiple R-squared:  0.386,  Adjusted R-squared:  0.3855\nF-statistic:\
  \   816 on 1 and 1298 DF,  p-value: < 2.2e-16\n```\n\n我们示例的估计方程为：\n\n![$$ y=70677.227+(232.723)x\
  \ $$](img/416805_2_En_6_Chapter_TeX_Equi.png)\n\n其中 *y* 是 `HousePrice`，*x* 是 `StoreArea`。这意味着\
  \ *x*（`StoreArea`）每增加一个单位，*y*（`HousePrice`）将增加 232.72 美元。截距是常数，告诉我们当 `StoreArea`\
  \ 为零时的 `HousePrice`，可以将其视为注册费。\n\n让我们讨论一下 `lm()` 的摘要输出，以便更好地理解模型。同样的解释可以扩展到下一节中的多元线性回归。\n\
  \n*   *Call*：输出在 `lm()` 函数中拟合的模型方程。\n*   *Residuals*：给出残差的四分位距，以及残差的最小值、最大值和中位数。中位数为负意味着至少一半的残差为负，即在超过\
  \ 50% 的预测中，预测值大于实际值。\n*   *Coefficients*：这是一个表格，给出模型参数估计值（或系数）、标准误差、t 值和学生 t 检验的\
  \ p 值。\n*   *Diagnostics*：残差标准误差、多重 R 方、调整 R 方以及用于方差检验的 F 统计量。\n\n扩展 `lm()` 摘要输出中的系数部分非常重要。该输出提供了关于模型预测变量及其系数的重要信息：\n\
  \n*   *Estimate*：该参数的拟合值。该值直接用于模型方程进行预测，并理解与因变量的关系。例如，在我们的模型中，预测变量 x（商店面积）的系数为 232.7。\n\
  *   *Standard Error (std. Error)*：参数估计分布的标准差。换句话说，估计值是系数的均值，其标准差就是标准误差。标准误差可以计算为：\n\
  \n![$$ {S}_{\\overline{x}}=\\frac{s}{\\sqrt{n}} $$](img/416805_2_En_6_Chapter_TeX_Equj.png)\n\
  \n其中 *s* 是样本标准差，*n* 是样本大小。\n\n相对于估计值，标准误差越小，模型估计越好。\n\n*   *t-value and p-value*：学生\
  \ t 检验是一种假设检验，用于检验检验统计量是否服从 t 分布。从统计学上讲，针对每个参数报告的 p 值是单样本 t 检验的 p 值。\n\n我们检验该参数的值在统计上是否显著不为零。如果我们无法拒绝原假设，那么我们可以说相应的参数在我们的模型中不显著。\n\
  \n*   单样本 t 检验的 t 统计量如下：\n\n![$$ t=\\frac{\\overline{x}-{\\mu}_0}{s/\\sqrt{n}} $$](img/416805_2_En_6_Chapter_TeX_Equk.png)\n\
  \n\n\n其中 ![$$ \\overline{x} $$](img/416805_2_En_6_Chapter_TeX_IEq2.png) 是样本均值，*s*\
  \ 是样本的标准差，*n* 是样本量。对于我们的线性模型，*x* 的 t 值为 28.57，p 值约为 0。这意味着 *x* 的估计值不为 0，因此它在模型中具有显著性。\n\
  \n一旦我们理解了模型的形式以及每个预测变量的显著性，我们就会继续查看模型对实际值的拟合情况。这通过绘制实际值与预测值的对比图来完成：\n\n```\nres\
  \ <-stack(data.frame(Observed = y, Predicted =fitted(fitted_Model)))\nres <-cbind(res,\
  \ x =rep(x, 2))\n#使用 lattice 的 xyplot 函数绘图\nlibrary(\"lattice\")\nxyplot(values\
  \ ~x, data = res, group = ind, auto.key =TRUE)\n```\n\n图 6-14 展示了拟合值与实际值的对比。你可以看到，该图显示了模型预测的线性关系，并与原始数据的散点图叠加在一起。\n\
  \n![../images/416805_2_En_6_Chapter/416805_2_En_6_Fig14_HTML.jpg](img/416805_2_En_6_Fig14_HTML.jpg)\n\
  \n图 6-14\n\n实际值与预测值的散点图\n\n现在，这是一个仅包含一个解释变量（`StoreArea`）的模型，但还有其他可用变量与 `HousePrices`\
  \ 显示出显著关系。回归框架允许我们在回归分析中添加多个解释变量或自变量。我们将在下一节介绍多元线性回归。\n\n### 6.5.3 多元线性回归\n\n简单线性回归的思想可以扩展到多个自变量。多元线性回归中的线性关系变为：\n\
  \n![$$ {y}_i={\\beta}_1{x}_{i1}+\\cdots +{\\beta}_p{x}_{ip}+{\\varepsilon}_i={x}_i^T\\\
  beta +{\\varepsilon}_i,\\kern2.5em i=1,\\dots, n, $$](img/416805_2_En_6_Chapter_TeX_Equl.png)\n\
  \n对于多元回归，矩阵表示法非常流行，因为它使得矩阵计算的概念易于解释。\n\n![$$ \\mathrm{y}=\\mathrm{X}\\beta +\\varepsilon,\
  \ $$](img/416805_2_En_6_Chapter_TeX_Equm.png)\n\n在我们之前的示例中，我们只使用了一个变量 `StoreArea`\
  \ 来解释因变量。在多元线性回归中，我们将使用 `StoreArea`、`StreetHouseFront`、`BasementArea`、`LawnArea`、Rating\
  \ 和 `SaleType` 作为自变量，来估计与 `HousePrice` 的线性关系。\n\n最小二乘估计函数保持不变，只是会有新的变量作为预测变量。为了对多个变量进行分析，我们引入了一个额外的数据清洗步骤：缺失值识别。我们要么对缺失值进行插补，要么将其排除在分析之外。我们选择使用\
  \ R 中的 `na.omit()` 函数将其排除。以下代码首先查找缺失的案例，然后将其删除。\n\n```\n# 使用 lm 创建多元线性回归\nData_lm_Model\
  \ <-Data_HousePrice[,c(\"HOUSE_ID\",\"HousePrice\",\"StoreArea\",\"StreetHouseFront\"\
  ,\"BasementArea\",\"LawnArea\",\"Rating\",\"SaleType\")];\n# 下面的函数显示数据中每个变量的缺失值数量\n\
  sapply(Data_lm_Model, function(x) sum(is.na(x)))\nHOUSE_ID       HousePrice    \
  \    StoreArea StreetHouseFront\n0                0                0           \
  \   231\nBasementArea         LawnArea           Rating         SaleType\n0    \
  \            0                0                0\n# 我们选择删除 StreetHouseFront 中对应缺失值的\
  \ 231 个案例。Na.omit 函数将删除这些缺失案例。\nData_lm_Model <-na.omit(Data_lm_Model)\nrownames(Data_lm_Model)\
  \ <-NULL\n# 分类变量需要设置为因子\nData_lm_Model$Rating <-factor(Data_lm_Model$Rating)\nData_lm_Model$SaleType\
  \ <-factor(Data_lm_Model$SaleType)\n```\n\n现在我们已经清理了数据中的缺失值，可以运行 `lm()` 函数来拟合我们的多元线性回归模型。\n\
  \n```\nfitted_Model_multiple <-lm(HousePrice ~StoreArea +StreetHouseFront +BasementArea\
  \ +LawnArea +Rating +SaleType, data =Data_lm_Model)\nsummary(fitted_Model_multiple)\n\
  Call:\nlm(formula = HousePrice ~StoreArea +StreetHouseFront +BasementArea +LawnArea\
  \ +Rating +SaleType, data =Data_lm_Model)\nResiduals:\nMin       1Q   Median   \
