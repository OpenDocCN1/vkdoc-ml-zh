  \ R 客户端用于微软认知服务文本分析 REST API，包括情感分析、主题检测、语言检测和关键短语提取。*必须*在微软认知服务网站 [`https://www.microsoft.com/cognitive-services/`](https://www.microsoft.com/cognitive-services/)\
  \ 注册一个账户，才能获得（免费的）API 密钥。没有 API 密钥，这个包将无法正常工作。\n\n```\n#install.packages(\"mscstexta4r\"\
  )\nlibrary(mscstexta4r)\nWarning: package 'mscstexta4r' was built under R version\
