  \                  4990     1322       8427   5864\n```\n\n**步骤 2：从每个层中进行无放回随机抽样，考虑抽取层大小的\
  \ 10%。**\n\n我们选择最常用的分层抽样方法——比例抽样。我们将从每个层中抽取 10% 的记录。\n\n*函数：* `stratified()`\n\n\
  `stratified` 函数从一个 `data.frame` 或 `data.table` 中抽样，其中一个或多个列可用作“分层”或“分组”变量。结果是一个新的\
  \ `data.table`，其中包含从每个组中抽取的指定数量的样本。标准函数语法如下所示：\n\n*   `group`：此参数允许用户定义层变量。这里我们选择了\
  \ `CardType` 和 `State` 作为层变量。因此，总共将有四个（卡类型）X 52（州）个层供抽样。\n\n*   `size`：通常，size 可以作为一个数字（从每个层中抽取相同数量）或一个抽样分数传递。我们将使用\
  \ 0.1 的抽样分数。其他选项请在控制台中输入 `?stratified` 查看。\n\n*   `replace`：此参数允许你选择有放回或无放回抽样。我们将其设置为\
  \ `FALSE`，表示无放回抽样。\n\n```\nstratified(indt, group, size, select = NULL, replace\
  \ = FALSE, keep.rownames\n= FALSE, bothSets = FALSE, ...)\n```\n\n我们将使用此函数来执行分层随机抽样。\n\
  \n我们也可以使用标准的 `sample()` 函数，按照以下步骤进行分层抽样：\n\n1.  按层变量创建数据的子集。\n\n\n\n2.  计算每个层在抽样比例为\
  \ 0.1 时的样本量。\n\n3.  对每个层按计算出的样本量进行简单随机抽样。\n\n先前的结果与`stratified()`函数的结果将保持一致。但`stratified()`函数的执行速度会更快。建议你自行实现该算法并尝试其他函数。\n\
  \n```\nset.seed(937)\n#我们希望确保抽样保留样本中卡类型的相同比例\n#从每个层中无放回地随机抽取占该层总规模 10%的样本\nlibrary(splitstackshape)\n\
  stratified_sample_10_percent<-stratified(data, group=c(\"CardType\",\"State\"),\n\
  size=0.1,replace=FALSE)\n```\n\n步骤 3：检查样本中数据点的比例是否与总体相同。\n\n以下是通过`CardType, State`进行分层抽样以及交叉制表的输出结果。数值显示，抽样已按相同比例在各层中完成。例如，阿拉巴马州和美国运通的记录数为\
  \ 4980，在分层样本中，阿拉巴马州和美国运通持卡人的数量为总体的 1/10，即 498。对于所有其他层，比例均相同。\n\n```\n#样本中 CardType\
