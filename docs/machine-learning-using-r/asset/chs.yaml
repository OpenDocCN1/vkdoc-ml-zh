  l\",\nylab=\"敏感度\",xlab=\"1-特异性\",col=\"green\",lwd=2,\nmain =\"训练数据的 ROC 曲线\")\n\
  abline(a=0,b=1)\nabline(v = best_t) #在 ROC 曲线上添加最优 t 值\n```\n\n图 6-26 中的图形展示了特异性和敏感度之间的关系。该图也称为\
