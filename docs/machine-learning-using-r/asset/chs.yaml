  \n对于摘要生成，我们将使用从网站加载的文章。算法会尝试逐句对文档进行上下文挖掘，然后从文档中创建一个有序的句子列表，以概括其内容。\n\n```  \n  \
  \  article_lang s growth story since its independence, some others think the countryâs\
  \ performance in the six decades has been abysmal.\"  \n    [2] \"Itâs arguably\
  \ true that the Five-Year Plans did target specific sectors in order to quicken\
  \ the pace of development, yet the outcome hasnât been on expected lines.\"  \n\
  \    [3] \"And, the country is taking its own sweet time to catch up with the developed\
  \ world.\"  \n    [4] \"All efforts are frustrated by lopsided strategies and inept\
  \ implementation of policies.\"  \n    [5] \"India is the worldâs largest democracy.\"\
  \  \n    ```  \n\n摘要表明，这篇文章讨论了印度及其发展之路，并强调了印度的民主制度。\n\n在本章中，我们看到了文本分析在监测人类行为方面的强大能力。我们学习了\
  \ R 语言的基础知识，并学会了使用强大的 API。你可以在自然语言处理领域进行更多探索。\n\n### 6.12.7 结论\n\n我们看到了一个机会：通过基于文本挖掘的预处理和基于\
  \ NLP 算法的模型构建，将结构混乱的字符流和数据批次转化为有意义的信息集。尽管文本挖掘最恰当地归属于自然语言处理（NLP）范畴，而 NLP 本身被视为机器学习的子领域，但用于文本摘要、词性标注的算法大量使用了统计技术。\n\
  \n现在我们进入本章的最后一个主题，讨论如何使机器学习算法更适用于处理数据流这一最前沿的理念。换句话说，算法能够从持续进入系统的数据流中学习，而不是使用一批训练数据。\n\
  \n\n\n## 6.13 在线机器学习算法\n\n在许多实际机器学习模型中，适应现实世界中不断变化的数据是一项关键需求。应对这种变化需求有两种可能的方式：\n\
  \n*   **定期手动更新模型**：根据模型部署后业务变化的速度和频率，定期（可能每周、每月或每年）手动更新模型。例如，用于癌症预测的医学诊断模型。正如你所料，癌症类型随时间变化并不迅速。因此，即使没有更新，这类模型也可以长期使用。然而，当有新的癌症患者数据出现时，可以手动更新模型并重新部署到系统中。\n\
  \n*   **实时更新模型**：随着数据在系统中流动，实时更新模型。例如，如果谷歌完全转向基于机器学习模型的搜索引擎，那么当前使用的启发式算法可能会根据用户输入的搜索查询实时调整。图\
  \ 6-72 展示了新数据流进入系统时在线更新的过程。\n\n    ![../images/416805_2_En_6_Chapter/416805_2_En_6_Fig72_HTML.jpg](img/416805_2_En_6_Fig72_HTML.jpg)\n\
  \n    图 6-72\n\n    *在线机器学习算法* *(来源：* [*http://www.doyensahoo.com/introduction.html*](http://www.doyensahoo.com/introduction.html)\
  \ *)*\n\n图 6-72 展示了预测器如何接收连续输入数据流并从中学习，以及学习模型如何接收反馈更新。\n\n这种基于在线实时学习的方法有许多优点和挑战，主要包括：\n\
  \n*   ***高效且节省空间***：由于无需将大量数据作为批次传递给学习模型，我们可以每次用一个观测值训练模型并更新。这加快了模型训练速度，并优化了存储。如果数据不能提升模型性能，则将其丢弃。\n\
  \n*   ***难以构建管道***：构建这样的在线学习数据管道是一项具有挑战性的任务。一方面，如果数据量和数据流速很高，模型训练可能成为瓶颈。然而，如果模型管道受到控制，则需要大量存储空间。\n\
  \n*   ***模型评估困难***：与批处理不同，批处理中我们有受控的训练和测试数据集，可以用测试数据评估模型；而在在线数据场景下，这是不可能的。在任何给定时刻，我们无法知道模型是否已经见过足够多种类的观测值，从而能够真正按照预期表现。\n\
  \n尽管存在诸多挑战，但随着越来越多的系统成为数据的实时消费者，且适应速度成为首要任务，在线机器学习正成为一个新兴的研究领域。我们将使用 `HouseWorth`\
  \ 数据集，并应用无监督模糊竞争学习的在线更新方法。虽然对该主题的详细讨论超出了本书的范围，但我们将通过一个示例来演示该方法在聚类问题上的出色表现。该方法通过在每次输入信号后（即每个单一观测值后）立即执行更新来工作。\n\
  \n### 6.13.1 模糊 C 均值聚类\n\n这是已知的 k 均值聚类算法的模糊版本，也是一种在线变体（无监督模糊竞争学习）。我们将使用 R 语言中的 `e1071`\
  \ 包，该包在名为 `cmeans` 的函数中实现了该算法。\n\n正如 R 语言文档对该主题的描述，由 *x* 给出的数据通过模糊 c 均值算法的广义版本进行聚类，该算法使用固定点或在线启发式方法来最小化目标函数。\n\
  \n![$$ \\sum \\limits_{\\mathrm{i}=1}^{\\mathrm{n}}\\sum \\limits_{\\mathrm{j}=1}^{\\\
  mathrm{c}}{\\mathrm{w}}_{\\mathrm{i}}{\\mathrm{u}}_{\\mathrm{i}\\mathrm{j}}^{\\\
  mathrm{m}}{\\mathrm{d}}_{\\mathrm{i}\\mathrm{j}} $$](img/416805_2_En_6_Chapter_TeX_Equbm.png)\n\
  \n其中\n\nw[i] 是观测值 i 的权重\n\nu[ij] 是观测值 i 在聚类 j 中的隶属度\n\nd[ij] 是观测值 i 与聚类 j 中心之间的距离\n\
  \n1.  数据准备\n\n```\n    library(ggplot2)\n    Warning: package 'ggplot2' was built\
  \ under R version 3.2.5\n    library(e1071)\n    Warning: package 'e1071' was built\
  \ under R version 3.2.5\n    Data_House_Worth <-read.csv(\"Dataset/House Worth Data.csv\"\
  ,header=TRUE);\n    str(Data_House_Worth)\n    'data.frame':    316 obs. of  5 variables:\n\
