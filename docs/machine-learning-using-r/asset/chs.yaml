  ## 4.8 饼图


  在印度，最低消费群体几乎将其近 53%的钱花在食品和饮料上，而最高消费群体在这方面的支出比例远低于其他群体，仅为 12%。另一方面，他们在住房上的支出占 39%。这明确表明——可支配收入最低的消费群体将大量资金用于食品等基本生存需求，而高收入群体则倾向于购买优质住宅。中等收入群体与高收入群体的情况非常相似，但他们在食品上的支出比例也更大，达到
  21%。


  因此，在印度，房地产和食品行业的企业近年来蓬勃发展，达到了历史新高。凭借 13.1 亿的人口基数，且其中大部分属于最低、低收入或中等收入群体，印度已成为食品行业的机遇之地。


  另一个有趣的领域是交通，其贡献份额最高的是高收入群体，他们通常全年都有旅行计划。这里的交通包括日常通勤以及假日旅行。随着像 Uber 这样的全球性企业解决了世界各地的通勤问题，并且其技术已覆盖印度超过
  28 个城市，这向我们展示了该领域的潜力。见图 4-16。


  ![../images/416805_2_En_4_Chapter/416805_2_En_4_Fig16_HTML.jpg](img/416805_2_En_4_Fig16_HTML.jpg)


