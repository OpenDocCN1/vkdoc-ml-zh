  \ 算法的训练集和测试集准确率分别为 37% 和 36%，在所有算法中表现最佳。虽然这个准确率可能不足以用于任何实际应用，但本示例足以让你充分理解决策树算法的工作原理。我们鼓励你从给定数据集中创建一个仅包含两个类别的子集，然后观察每种算法的表现。\n\
  \n### 6.7.4 集成树\n\n机器学习中的集成模型是大幅提升模型准确率的绝佳方法。在 Kaggle 竞赛中获胜的最佳机器学习算法大多采用了集成方法。其思路很简单：不是在一组观测数据上训练一个模型，而是结合多个模型（或同一模型在训练数据的不同子集上的多次迭代）的力量，共同对同一组观测数据进行训练。第\
  \ 8 章将详细介绍如何使用集成方法提升模型性能；不过，本节我们将重点放在基于决策树的集成模型上。\n\n\n\n#### 6.7.4.1 提升法\n\n提升法是一种机器学习中的集成元算法，有助于减少偏差和方差，并在不同加权训练观测值上拟合一系列弱学习器（更多内容请参见第\
  \ 8 章）。\n\n我们将使用 C5.0 集成模型来演示此技术，该模型是本章前面讨论内容的扩展，通过在 C50 函数调用中添加参数 `trials = 10`\
  \ 实现。这会在模型构建过程中执行 10 次提升迭代。\n\n```\nlibrary(gmodels)\npurchase_pred_train <-predict(ModelC50_boostcv10,\
  \ train)\nCrossTable(train$ProductChoice, purchase_pred_train,\nprop.chisq =FALSE,\
  \ prop.c =FALSE, prop.r =FALSE,\ndnn =c('actual default', 'predicted default'))\n\
