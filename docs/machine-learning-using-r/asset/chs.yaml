  \n图 10-8\n\n生成数据并存储在本地文件中\n\n#### 10.2.2.4 将数据加载到 Hive 表中\n\n一旦我们在本地文件中有了数据，使用命令\
  \ `load data local inpath '/home/training/emp_info' into table emp_info`；我们将把数据加载到\
  \ HDFS 中的 Hive 表 `emp_info` 中（见图 10-9）。\n\n![../images/416805_2_En_10_Chapter/416805_2_En_10_Fig9_HTML.jpg](img/416805_2_En_10_Fig9_HTML.jpg)\n\
  \n图 10-9\n\n将数据加载到 Hive 表中\n\n图 10-10 显示了我们从本地文件系统加载到 HDFS 文件中的数据。\n\n![../images/416805_2_En_10_Chapter/416805_2_En_10_Fig10_HTML.jpg](img/416805_2_En_10_Fig10_HTML.jpg)\n\
  \n图 10-10\n\nHDFS 文件中的数据\n\n#### 10.2.2.5 选择查询\n\n图 10-11 展示了 `select` 查询的两种变体。第一种没有\
  \ `where` 子句，第二种使用了 `where dep = 'A'`。请注意 Hadoop 内置的 MapReduce 框架是如何在 Hive 查询中发挥作用的。这正是我们将\
  \ Hive 等工具与 Hadoop 生态系统关联起来的原因。与单词计数示例相比，这里唯一的区别是我们不需要显式定义任何 Map 或 Reduce 方法；相反，Hive\
  \ 会自动为我们完成这些工作。\n\n![../images/416805_2_En_10_Chapter/416805_2_En_10_Fig11_HTML.jpg](img/416805_2_En_10_Fig11_HTML.jpg)\n\
  \n图 10-11\n\n带和不带 where 子句的 Select 查询\n\n除了这些基本命令，Hive 还支持数据分区、表连接、多重插入、用户定义函数和数据导出。这些功能足以支持将分析型数据库迁移到\
  \ Hive。\n\n### 10.2.3 Apache Pig\n\nApache Pig 是一个用于处理大型数据集的分析平台。用 Pig Latin 编写的\
  \ Pig 程序，由 Pig 的基础设施层编译，生成一系列 MapReduce 程序，从而实现并行处理。它与 Hadoop 的强耦合提供了 HDFS 的存储结构和\
  \ YARN 的进程处理能力。\n\n让我们回顾一下 MapReduce 部分中的单词计数示例，看看如何用一系列 Pig Latin 命令来编写相同的示例。有关\
  \ Pig 设置和使用的详细文档，请参考 [`http://pig.apache.org/docs/r0.16.0/start.html`](http://pig.apache.org/docs/r0.16.0/start.html)。\n\
  \n#### 10.2.3.1 连接到 Pig\n\n`pig -x local` 命令连接到本地文件系统。在终端中直接使用 `pig` 命令将连接到 HDFS。对于我们的单词计数示例，我们将使用本地文件系统，如图\
  \ 10-12 所示。\n\n![../images/416805_2_En_10_Chapter/416805_2_En_10_Fig12_HTML.jpg](img/416805_2_En_10_Fig12_HTML.jpg)\n\
  \n图 10-12\n\n使用本地文件系统连接到 Pig\n\n#### 10.2.3.2 加载数据\n\n命令 `A1 = load '/home/training/wc.txt'\
  \ as (line:chararray);` 将扫描文件并将每一行和字符数组存储起来。`dump A1` 命令将输出以下内容（见图 10-13）：\n\n![../images/416805_2_En_10_Chapter/416805_2_En_10_Fig13_HTML.jpg](img/416805_2_En_10_Fig13_HTML.jpg)\n\
  \n图 10-13\n\n将数据加载到 A1\n\n```\n(Hi All Welcome to Hadoop )\n(Hadoop class integrating\
  \ with R Hadoop)\n```\n\n\n\n#### 10.2.3.3 对每一行进行分词\n\n将每一行分词并存储为列表。`dump A2` 命令将输出以下内容（见图\
  \ 10-14）：\n\n![../images/416805_2_En_10_Chapter/416805_2_En_10_Fig14_HTML.jpg](img/416805_2_En_10_Fig14_HTML.jpg)\n\
  \n图 10-14\n\n对每一行进行分词\n\n```\n({(Hi),(All),(Welcome),(to),(Hadoop)})\n({(Hadoop),(class),(integrating),(with),(R),(Hadoop)})\n\
  ```\n\n#### 10.2.3.4 扁平化处理分词结果\n\n`A3 = foreach A2 generate` `flatten(tokens) as\
  \ words;` 命令将进一步把每个已分词的列表拆分成单个词。`dump A3` 命令将输出以下内容（见图 10-15）：\n\n![../images/416805_2_En_10_Chapter/416805_2_En_10_Fig15_HTML.jpg](img/416805_2_En_10_Fig15_HTML.jpg)\n\
  \n图 10-15\n\n扁平化处理分词结果\n\n```\n(Hi)\n(All)\n(Welcome)\n(to)\n(Hadoop)\n(Hadoop)\n\
  (class)\n(integrating)\n(with)\n(R)\n(Hadoop)\n```\n\n#### 10.2.3.5 对单词进行分组\n\n\
  使用命令 `A4 = group A3 by words;` 将创建一个键值对，其中键是单词，值是该单词在分词列表中出现的次数列表。`dump A4` 命令将输出以下内容（见图\
  \ 10-16）：\n\n![../images/416805_2_En_10_Chapter/416805_2_En_10_Fig16_HTML.jpg](img/416805_2_En_10_Fig16_HTML.jpg)\n\
  \n图 10-16\n\n对单词进行分组\n\n```\n(R,{(R)})\n(Hi,{(Hi)})\n(to,{(to)})\n(All,{(All)})\n\
  (with,{(with)})\n(class,{(class)})\n(Hadoop,{(Hadoop),(Hadoop),(Hadoop)})\n(Welcome,{(Welcome)})\n\
  (integrating,{(integrating)})\n```\n\n#### 10.2.3.6 计数与排序\n\n以下两个命令将生成单词及其在文档中出现次数的键值对，并随后按计数进行排序。\n\
  \n*   A5 = `foreach A4 generate group,COUNT(A3);`\n\n*   A6 = `order A5 by $1 desc;`\n\
  \n`dump A6` 命令将输出以下内容：\n\n```\n(Hadoop,3)\n(R,1)\n(Hi,1)\n(to,1)\n(All,1)\n(with,1)\n\
  (class,1)\n(Welcome,1)\n(integrating,1)\n```\n\n使用 Pig，可以轻松地在大型数据集上创建许多此类涉及选择、过滤、连接、联合、排序、分组和转换的分析工作流。\n\
  \n### 10.2.4 HBase\n\n到目前为止，我们一直在讨论使用预定义模式的行和列的结构化格式来表示数据，这种模式一旦创建，就很难为不断变化的需求进行调整。换句话说，尽管\
  \ Hive 在大型数据集上提供了 RDBMS 的分布式版本，但它仍然要求你遵循固定的数据库模式，并基于该模式将数据存储在仓库中。然而，随着数据的快速变化，我们需要对大型分布式数据进行随机的、实时的读写。在这种情况下，数据库不能再是关系型的；它必须是大数据领域人们所说的\
  \ NoSQL。HBase 的模型源自 Google 的 Bigtable：一个用于在 Google 文件系统（GFS）上存储结构化数据的分布式存储系统。\n\n\
  与传统的 RDBMS 系统（即使存在许多空值以及因规范化导致的跨表冗余数据，也会存储每一行的所有列）相反，HBase 是一种列式存储。这意味着每一行数据都按列族存储。例如，如果你有一个包含名为\
  \ `details` 的列族的员工表，你可以在 `details` 列族下存储 `name`、`age` 和 `qualification` 等列。因此，如果有一个名为\
  \ `address` 的新列，它可以实时添加到 `details` 下。\n\n#### 10.2.4.1 启动 HBase\n\n使用 shell 脚本 `start-hbase.sh`\
  \ 启动 HBase。运行以下三个命令（见图 10-17）：\n\n![../images/416805_2_En_10_Chapter/416805_2_En_10_Fig17_HTML.jpg](img/416805_2_En_10_Fig17_HTML.jpg)\n\
  \n图 10-17\n\n启动 HBase\n\n1.  `cd /usr/lib/hbase/`\n\n2.  `sudo bin/start-hbase.sh`\n\
  \n3.  `hbase shell`\n\n#### 10.2.4.2 创建表并插入数据\n\n以下命令将创建一个名为 `employee` 的表，该表包含两个列族：`details`\
  \ 和 `salary`。并且在 `details` 列族下，将数据插入到 `name` 和 `gender` 列中（见图 10-18）。\n\n1.  `create\
  \ 'employee','details','salary'`\n\n2.  `put 'employee','e1','details:name','karthik'`\n\
  \n3.  `put 'employee','e1','details:gender','m'`\n\n4.  `put 'employee','e1','salary:sal','20000'`\n\
  \n![../images/416805_2_En_10_Chapter/416805_2_En_10_Fig18_HTML.jpg](img/416805_2_En_10_Fig18_HTML.jpg)\n\
  \n图 10-18\n\n创建表并插入数据\n\n#### 10.2.4.3 扫描数据\n\n使用命令 `scan 'employee'`，你可以查看数据在 HBase\
  \ 中的存储方式。每一行对应一个列族下的列值（见图 10-19）。\n\n![../images/416805_2_En_10_Chapter/416805_2_En_10_Fig19_HTML.jpg](img/416805_2_En_10_Fig19_HTML.jpg)\n\
  \n图 10-19\n\n扫描数据\n\n关于 HBase 的全面参考指南，请访问 [`http://hbase.apache.org/book.html#arch.overview`](http://hbase.apache.org/book.html%2523arch.overview)\
  \ 。\n\n### 10.2.5 Spark\n\nSpark 提供了闪电般快速的集群计算（类似于多个节点协同工作的分布式计算）。Spark 拥有先进的基于有向无环图（DAG）的执行引擎，这使得它在内存中的运行速度比\
  \ Hadoop MapReduce 快 100 倍，在磁盘上快 10 倍。与仅支持 Java 的 Hadoop 相反，在 Spark 中，你可以使用 Java、Scala、Python\
  \ 和 R 编写应用程序。如果这还不够，Spark 还提供了 SQL、流处理、机器学习和图库，这些可以以任何方式组合起来创建应用程序管道。除了从 HDFS 访问数据外，在\
  \ Spark 中，你还可以连接到 HBase、Cassandra、S3 以及更多其他数据源。\n\n在本章中，我们使用 SparkR，这是一个轻量级的前端工具，用于从\
  \ R 中使用 Apache Spark。它轻量但功能非常丰富。简而言之，SparkR 提供以下功能：\n\n*   你可以从本地数据框或 Hive 表创建 SparkDataFrame。\n\
  \n*   在 SparkDataFrame 上，可以进行 R 中 `dplyr` 包提供的选择、分组和聚合等操作。\n\n*   你可以直接从 R 对 Hive\
  \ 运行 SQL 查询。\n\n*   它提供了来自 Spark 的 MLlib 库中的一些机器学习算法。\n\n这个强大的工具无疑正在席卷整个行业。不过，我们将把重点放在\
  \ Spark 的机器学习库 MLlib 上。\n\n对于感兴趣的读者，可以在 [`http://spark.apache.org/docs/latest/index.html`](http://spark.apache.org/docs/latest/index.html)\
  \ 找到关于 Spark 的更多详细信息。\n\n\n\n## 10.3 使用 Spark 在 R 中进行机器学习\n\nMLlib 是 Spark 的机器学习（ML）库。其目标是让实用的机器学习变得可扩展且易于使用。从高层来看，它提供了以下工具：\n\
  \n*   *ML 算法：* 常见的机器学习算法，如分类、回归、聚类和协同过滤\n*   *特征化：* 特征提取、转换、降维和选择\n*   *流水线：* 用于构建、评估和调优\
  \ ML 流水线的工具\n*   *持久化：* 保存和加载算法、模型和流水线\n*   *工具：* 线性代数、统计、数据处理等\n\n目前，SparkR 支持以下机器学习算法：\n\
  \n*   广义线性模型\n*   加速失效时间（AFT）生存回归模型\n*   朴素贝叶斯模型和 KMeans 模型\n\n在底层，SparkR 使用 MLlib\
  \ 来训练模型。以下 R 代码取自我们之前的房价预测示例，但这是使用 SparkR 的可扩展版本模型。\n\n注意（针对 Windows 用户）：在运行代码之前，请遵循以下步骤：\n\
  \n1.  从 [`http://spark.apache.org/downloads.html`](http://spark.apache.org/downloads.html)\
  \ 下载为 Hadoop 2.7 及更高版本预构建的 Spark 发行版。\n2.  将文件解压到 `C:-2.0.0-bin-hadoop2.7` 文件夹（你可以选择自己的位置）。\n\
  3.  在 `cmd` 提示符中使用以下命令为 SparkR 库创建符号链接：`mklink /D \"C:Files-3.2.2\" \"C:-2.0.0-bin-hadoop2.7\"\
  `。\n4.  使用 RStudio 或 R 命令行，通过 `library(SparkR)` 进行测试。\n\n让我们深入了解接下来的 R 代码，并理解 SparkR\
  \ 如何帮助使用 Spark 引擎构建可扩展的机器学习模型。请记住，该代码是在只有一个节点的独立 Spark 集群上执行的。只有当相同的代码在拥有大量计算节点的大型企业级\
  \ Spark 集群上运行时，才能看到 Spark 的真正潜力。\n\n### 10.3.1 设置环境变量\n\n以下命令将让 R 知道 Spark 和 Hadoop\
  \ 二进制文件在你机器上的安装位置。请记住，这两个环境变量与你可能在系统属性中设置的环境变量相同（针对 Windows 机器）。\n\n```\n#设置环境变量\n\
  Sys.setenv(SPARK_HOME='C:/Spark/spark-2.0.0-bin-hadoop2.7',HADOOP_HOME='C:/Hadoop-2.3.0')\n\
  .libPaths(c(file.path(Sys.getenv('SPARK_HOME'), 'R', 'lib'),.libPaths()))\nSys.setenv('SPARKR_SUBMIT_ARGS'='\"\
  sparkr-shell\"')\n```\n\n### 10.3.2 初始化 Spark 会话\n\n设置好环境变量后，使用 `spark.driver.memory`、`spark.sql.warehouse.dir`\
  \ 等参数初始化 SparkR 会话，如下面的代码片段所示。此初始化是必需的，以便 R 环境能够连接到本地机器上运行的 Spark。\n\n```\nlibrary(SparkR)\n\
  library(rJava)\n#进入 SparkR 的入口点是 SparkSession，它将你的 R 程序连接到 Spark 集群\nsparkR.session(enableHiveSupport\
  \ =FALSE, appName =\"SparkR-ML\",master =\"local[*]\", sparkConfig =list(spark.driver.memory\
  \ =\"1g\",spark.sql.warehouse.dir=\"C:/Hadoop-2.3.0\"))\nLaunching java with spark-submit\
  \ command C:/Spark/spark-2.0.0-bin-hadoop2.7/bin/spark-submit2.cmd   --driver-memory\
  \ \"1g\" \"sparkr-shell\" C:\\Users\\Karthik\\AppData\\Local\\Temp\\Rtmpuoqh3M\\\
  backend_port1030727b704d\nJava ref type org.apache.spark.sql.SparkSession id 1\n\
  ```\n\n### 10.3.3 加载数据并运行预处理\n\n加载第 6 章介绍的房屋数据，并执行相同的一组预处理步骤，如下面的代码片段所示：\n\n```\n\
  library(data.table)\n#读取房屋数据\nData_House_Price \n#提取相关列并在数据集中分配所需字段\nData_House_Price\
  \ <-Data_House_Price[,.(HOUSE_ID,HousePrice,StoreArea,StreetHouseFront,BasementArea,LawnArea,Rating,SaleType)]\n\
  #省略任何缺失值\nData_House_Price <-na.omit(Data_House_Price)\nData_House_Price$HOUSE_ID\
  \ <-as.character(Data_House_Price$HOUSE_ID)\n```\n\n### 10.3.4 创建 SparkDataFrame\n\
  \n现在，通过将原始数据集 `Data_House_Price` 分割为前三分之二和剩余部分（最后三分之一），分别创建训练和测试 SparkDataFrame。它类似于\
  \ R 中的数据框，有助于存储任何行列形式的表格数据，但在 Spark 中，其实现对于处理网络传输和处理数千个计算节点来说要高效得多。\n\n```\n#Spark\
  \ 数据框 - 训练\ngaussianDF_train <-createDataFrame(Data_House_Price[1:floor(nrow(Data_House_Price)*(2/3)),])\n\
  #Spark 数据框 - 测试\ngaussianDF_test <-createDataFrame(Data_House_Price[floor(nrow(Data_House_Price)*(2/3)\
  \ +1):nrow(Data_House_Price),])\nclass(gaussianDF_train)\n[1] \"SparkDataFrame\"\
  \nattr(,\"package\")\n[1] \"SparkR\"\nclass(gaussianDF_test)\n[1] \"SparkDataFrame\"\
  \nattr(,\"package\")\n[1] \"SparkR\"\n```\n\n### 10.3.5 构建 ML 模型\n\n这本质上是本章的核心。第一个机器学习模型被构建为可扩展以处理大型数据集。`spark.glm`\
  \ 是 Spark 的 MLlib 库中的一个函数，它提供了广义线性模型（GLM）的可扩展实现。理想情况下，语法方面没有任何变化（除了函数名），但在底层，可能有大量的节点协同工作，自动运行\
  \ MapReduce 程序以及 Spark 支持的其他许多操作，以达到最终结果。\n\n```\n"
