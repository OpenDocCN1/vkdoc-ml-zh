  \n### 6.12.5 词云\n\n词云有助于可视化评论中最常使用的词语（见图 6-69）：\n\n![../images/416805_2_En_6_Chapter/416805_2_En_6_Fig69_HTML.jpg](img/416805_2_En_6_Fig69_HTML.jpg)\n\
  \n图 6-69\n\n使用亚马逊食品评论数据集生成的词云\n\n```\nlibrary(SnowballC)\nlibrary(wordcloud)\nfine_food_data_corpus\
  \ <-VCorpus(VectorSource(fine_food_data_selected$Text))\nfine_food_data_text_tdm\
  \ <-TermDocumentMatrix(fine_food_data_corpus, control =list(\ntolower =TRUE,\nremoveNumbers\
  \ =TRUE,\nstopwords =TRUE,\nremovePunctuation =TRUE,\nstemming =TRUE\n))\nwc_tdm\
  \ <- rollup(fine_food_data_text_tdm,2,na.rm=TRUE,FUN=sum)\nmatrix_c <-as.matrix(wc_tdm)\n\
  wc_freq <-sort(rowSums(matrix_c))\nwc_tmdata <-data.frame(words=names(wc_freq),\
  \ wc_freq)\nwc_tmdata <-na.omit(wc_tmdata)\nwordcloud (tail(wc_tmdata$words,100),\
  \ tail(wc_tmdata$wc_freq,100), random.order=FALSE, colors=brewer.pal(8, \"Dark2\"\
  ))\n```\n\n词云是一个简单的探索性工具，用于理解词语使用的总体趋势，这有助于进一步构建直觉和洞察。\n\n### 6.12.6 文本分析：微软认知服务\n\
  \n在本节中，我们将通过从 R 语言内部调用第三方 API，向您介绍强大的文本分析世界。我们使用微软认知服务 API，对一家新闻机构的 Twitter 推送内容进行实时文本分析。\n\
  \n\n\n### 注意\n\n我们选择微软认知服务来展示一些文本分析的真实案例。我们并不推荐任何第三方工具或服务。\n\n微软认知服务是微软提供的一项机器智能服务，其前身为\
  \ Project Oxford。该服务为开发者提供了基于云的 API，用于实现人脸识别、语音识别、文本挖掘、视频流分析等众多高级功能。我们使用其免费开发者服务来展示以下文本分析功能：\n\
  \n*   *情感分析：* 推文的情感倾向是什么？是正面、负面还是中性？\n*   *主题检测：* 讨论的主题是什么？\n*   *语言检测：* 能否根据输入的文本判断其语言？\n\
  *   *摘要生成：* 能否自动将长篇文档总结为易于阅读的摘要？\n\n我们将使用 Twitter 信息流进行情感分析和主题检测，使用某种语言的随机文本进行语言检测，并使用一篇文章进行摘要生成。\n\
  \n要开始这个示例，我们需要在微软认知服务上注册一个账户，并获取一个 API 密钥来使用其 REST API。该密钥可以通过在 [`https://www.microsoft.com/cognitive-services/`](https://www.microsoft.com/cognitive-services/)\
  \ 注册获得。\n\n你还需要一个 Twitter 开发者账户，以便在 R 中设置应用程序来提取推文。你可以通过在 [`https://apps.twitter.com/`](https://apps.twitter.com/)\
  \ 注册来获取 Twitter API 密钥。\n\n首先，我们将使用从 Twitter 应用获取的 API 密钥来设置 `TwitterR` 包。`twitterR()`\
  \ 包提供了与 Twitter Web API 的接口。\n\n```\nlibrary(\"stringr\")\nlibrary(\"dplyr\")\n\
  library(\"twitteR\")\n#getTwitterOAuth(consumer_key, consumer_secret)\nconsumerKey\
  \  https://t.co/dUx77VDXGj\n4                                    IN PICS: Union\
