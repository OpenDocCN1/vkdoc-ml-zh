  主成分分析的优点包括：\n\n*   减少所需的时间和存储空间。\n\n*   消除多重共线性，提升机器学习模型的性能。\n\n*   当数据降至非常低的维度（如\
  \ 2D 或 3D）时，更易于可视化。\n\n我们进一步推荐 Isabelle Guyon 等人的研究论文《变量与特征选择导论》，其中包含涉及特征工程决策过程的全面清单。\n\
  \n## 5.6 总结\n\n特征工程是机器学习模型开发中不可或缺的一部分。通过应用采样技术可以减少数据量。特征选择通过选取最有效的特征来帮助减少数据的宽度。我们深入理解了变量选择的三种核心方法——过滤法、包装法和嵌入法。在本章末尾，我们展示了主成分分析的示例，并学习了\
  \ PCA 如何在不丢失信息本质和价值的情况下降低维度。\n\n下一章是本书的核心，即第[6](http://dx.doi.org/10.1007/978-1-4842-4215-5_6)章。该章将向你展示如何将业务问题引入\
  \ IT 系统，并尝试使用机器学习来解决这些问题。\n\n\n\n"
- "# 6. 机器学习理论与实践\n\n世界正在迅速适应机器学习（ML）的应用。无论是无人驾驶汽车、智能个人助理，还是像围棋和《危险边缘》这样与人类对弈的机器，机器学习无处不在。数据采集的便捷性和易得性，加上强大的计算能力，使得这一领域更有利于研究人员和企业为一些最具挑战性的问题探索数据驱动的解决方案。这引发了一场革命，催生了大量利用机器学习解决医疗、IT、人力资源、汽车、制造业等领域问题的新兴初创公司和工具，并且这个列表还在不断扩展。\n\
  \n在机器学习研究人员、工程师和开发者的共同努力下，复杂机器学习算法与其实现之间的抽象层已达到前所未有的高度。如今，你无需理解机器学习算法背后的统计学知识就能将其应用于真实世界的数据集，只需知道如何使用某个工具就足够了（这有其利弊），这需要你探索和清洗数据，并将其整理成合适的格式。许多大型企业已经推出了某些\
  \ API，提供分析即服务，具备使用机器学习构建预测模型的能力。这并未止步——像谷歌、Facebook 和 IBM 这样的公司已经率先将其部分系统完全开源，这意味着，就像安卓系统彻底改变了移动行业一样，这些机器学习系统也将为下一代全自动机器带来同样的变革。\n\
  \n因此，现在有待观察的是，下一个突破性的、价值数十亿美元的颠覆性创意将从何而来。尽管这一切听起来可能像是一个遥远的梦想，但它正在迅速逼近。过去的二十年里，我们在技术领域见证了谷歌、Twitter、WhatsApp、Facebook\
  \ 以及众多其他公司的崛起。所有这些价值数十亿美元的企业都拥有数据，并利用数据创造出我们几年前还无法想象的种种可能。从计算机视觉到在线地图，已经改变了我们在这个世纪的工作方式。谁能想到，坐在一个地方，你就能找到从一个地方到另一个地方的最佳路线，或者一架无人机就能执行搜索并协助救援行动？这些可能性在几十年前并不存在，但现在它们已成为现实。这一切都是由数据以及我们从数据中学习到的知识所驱动的。未来属于那些拥抱数据力量的企业和个人。\n\
  \n在本章中，我们将深入探讨机器学习这个迷人且令人兴奋的世界，我们力求在理论知识和以工具为中心的实践方面之间保持一个良好的平衡。由于本章是整本书的核心，我们将采用一些真实的行业数据来阐述算法，同时让你理解前几章学到的概念与本章是如何关联的。这意味着，你将开始看到我们在第\
  \ 1 章中提出的机器学习流程 PEBE 将如何发挥关键作用。第 2 章到第 5 章是有效且高效运行机器学习算法的基础和先决条件。我们学习了数据的属性、数据类型、通过可视化发现的隐藏模式、抽样以及创建最佳特征集来应用机器学习算法。本章之后的章节则更多地关注如何衡量模型性能、改进模型，以及哪些技术可以帮助你将机器学习部署到实际的可扩展环境中。\n\
  \n在本章中，我们将简要介绍每个算法的数学背景，然后向你展示如何运行 R 语言并解释结果。以下三种方式将使你能够快速入门机器学习，并以理论与实践的正确结合来学习：\n\
  \n*   **统计学背景：** 我们介绍机器学习概念/算法背后的核心公式/统计概念。由于统计概念会使讨论变得深入，对初学者和中级读者来说相当复杂，我们设计了这些概念的简化版本，并期望感兴趣的读者参考更详细的文献（我们在可能的地方提供了足够的参考资料）。\n\
  \n*   **R 语言演示：** 搭建 R 环境并编写 R 脚本，以处理针对真实世界问题提供的数据集。这种在问题理论和机器学习算法基础之后快速上手 R 编程的方法，是考虑到那些寻求快速原型开发的行业专业人士，以及希望开始机器学习算法实际实现的研究人员。行业专业人士可能倾向于识别其工作领域中的问题陈述，并采用蛮力方法尝试所有可能的机器学习算法，而研究人员则倾向于掌握基础要素，然后再进行实现方面的工作。本章对两者都适用。\n\
  \n*   **真实世界用例：** 我们选择用于解释的数据集。机器学习算法来自为解释概念而策划的真实场景。这意味着我们的示例建立在真实数据之上，确保我们模拟一个真实世界的场景，其中模型结果并不总是很好。有时你会得到好的结果，有时则非常差。一些算法效果最好，一些则在相同数据上不起作用。这种方法将帮助你以相同的基准比较所有同类型的算法，并根据手头的实际问题做出明智的决策。我们不鼓励使用那些在理想情况下解释概念、并制造关于性能的虚假印象的例子，例如，与其选择一个\
  \ R 平方（一种性能指标）为 90%的基于线性回归的例子，我们展示了一个真实案例，其中 R 平方可能低至 30%，并进一步讨论如何改进。这为如何在现实世界中构建机器学习模型提供了一个强有力的案例。然而，在必要之处，我们也从一些流行的数据集中选取了几个标准数据集，以便于解释某些概念。\n\
  \n我们在第 6.2 节中将机器学习算法非常宽泛地划分为不同的类别，并在本章及后续章节中讨论每个组中的一些精选算法。其中一些模块在前面的章节中也有提及，我们认为那些地方更相关。通常，关于该主题的其他书籍会用整本书来专门讨论这些组别；然而，基于我们为机器学习流程提出的\
  \ PEBE 框架，我们将所有机器学习算法整合到一章中，为你提供一份非常必要的机器学习综合指南。\n\n\n\n## 6.1 机器学习类型\n\n在机器学习文献中，有多种方式可以将算法分组以便进行集体研究。以下是两种分组方式：\n\
  \n*   **基于学习类型的分组**：这与训练数据中响应变量（或标签）的类型有关。主要的学习类型包括监督学习、无监督学习、半监督学习和强化学习。\n\n* \
  \  **基于问题类型的分组**：这种分组由模型试图“达成”的目标驱动。每组都有相似的算法方法和原理。我们展示了这种分组及其中的一些流行技术。\n\n机器学习算法应用于特定问题的方式多种多样。因此，对于同一个问题，可能存在许多不同的机器学习模型。第\
  \ 7 章和第 8 章讨论了几种从中选择最佳模型的方法，以及组合多个模型以创建新集成模型的方法。因此，得出最佳的机器学习模型是一门需要大量耐心和反复试验的艺术。图\
  \ 6-1 展示了不同类型的学习及其示例用例。\n\n![../images/416805_2_En_6_Chapter/416805_2_En_6_Fig1_HTML.jpg](img/416805_2_En_6_Fig1_HTML.jpg)\n\
  \n图 6-1\n\n机器学习类型\n\n### 6.1.1 监督学习\n\n监督学习适用于具有响应变量（也称为标签）的数据集。响应变量可以是连续的，也可以是分类的。算法根据提供的预测变量集学习响应变量。例如，如果数据集属于一组患者，每个实例都会有一个响应变量来标识患者是否患有癌症（分类）。或者，在某个州或国家的房价数据集中，响应变量可能是房屋价格。\n\
  \n请记住，清晰地定义问题（当我们稍后在本章讨论实际用例时，定义问题会更清晰）对于我们从正确的方向开始至关重要。此外，如果响应变量是分类的，则问题是分类任务；如果是连续的，则是回归任务。尽管这条规则在大多数情况下基本成立，但某些问题同时包含分类和回归。在银行业，一个重要的模型是预测客户是否会拖欠贷款。使用客户过去的示例进行监督学习，将学习到违约客户与非违约客户的模式。我们将在解释*逻辑回归*（一种监督学习算法）时讨论这个例子。\n\
  \n### 6.1.2 无监督学习\n\n对于没有响应变量的数据集，无法从预测变量中进行学习，换句话说，学习必须是无监督的。学习基于数据集中每行之间的某种相似性或距离度量进行。无监督学习中最常用的技术是*聚类*。其他方法，如关联规则挖掘（ARM），则基于事件的频率，例如市场购物篮中的购买、日志挖掘中的服务器崩溃等。无监督学习的一些应用包括市场营销中的客户细分、社交网络分析、图像分割、气候学等。在本书中，我们使用店铺面积、草坪面积等变量来解释房屋的价值（或价格）。这些数据将与\
  \ k-means 和层次聚类等算法一起使用。\n\n### 6.1.3 半监督学习\n\n在前两种类型中，数据集中要么所有观测值都没有标签，要么所有观测值都有标签。半监督学习处理的是响应变量部分填充的数据集。在许多实际情况下，标记成本相当高，因为这需要熟练的人类专家来完成。因此，当大多数观测值缺少标签而少数观测值有标签时，半监督算法是构建模型的最佳候选。这些方法利用了这样一个想法：即使未标记数据的组成员身份未知，这些数据也携带了关于组参数的重要信息。关于这个主题最广泛的文献由\
  \ Chapelle, O. 等人在《半监督学习》一书中提供（MIT Press, Cambridge, MA）^(¹)。\n\n### 6.1.4 强化学习\n\
  \n监督学习和无监督学习算法都需要干净、准确的数据才能产生最佳结果。此外，数据需要全面，以便处理未见过的实例。例如，如果基于患者病史预测癌症的问题没有包含特定类型癌症的数据，那么该算法在实时部署时会产生许多误报。强化学习是理想的选择，适用于仅提供数据的初始状态作为输入，并且没有单一可能响应，而是有多种可能结果的情况。机器人技术和无人驾驶汽车的创新都源于这类机器学习算法。强化学习算法以迭代方式从环境中持续学习。在此过程中，它从与环境的交互经验中学习，直到探索完所有可能的状态范围。强化学习算法的一些应用包括计算机对弈棋盘游戏（国际象棋、围棋）、机械手和自动驾驶汽车。\n\
  \n对半监督学习和强化学习算法的详细讨论超出了本书的范围；但是，我们会在必要时引用它们。\n\n\n## 6.2 机器学习算法分组\n\n机器学习算法可根据方法相似性和算法输出进行分组。这将有助于你在同一组内为更多样化的问题创建用例。以这种方式组织算法的另一个好处是便于使用\
  \ R 语言库，这些库被设计为将所有相关/相似的函数包含在单个库中。这有助于用户使用单个库探索某个问题的所有选项/诊断方法。随着学术界和工业界不断涌现新的用例，这个列表也在不断扩展。我们指出了本书涵盖了其中哪些算法，并鼓励你从其他来源探索更多内容。\n\
  \n![../images/416805_2_En_6_Chapter/416805_2_En_6_Fig12_HTML.jpg](img/416805_2_En_6_Fig12_HTML.jpg)\n\
  \n图 6-12\n\n文本挖掘算法\n\n*   *文本挖掘：* 也称为文本分析，是自然语言处理的一个子领域，而自然语言处理又是机器学习的一个子领域。它提供了某些算法和方法来处理非结构化的文本数据，这些数据通常来自呼叫中心日志、客户评论等。该组中的算法可以处理高度非结构化的文本数据，以提取洞察和/或创建用于应用机器学习算法的特征。我们将讨论文本摘要、情感分析、词云和主题识别。见图\
  \ 6-12。\n\n![../images/416805_2_En_6_Chapter/416805_2_En_6_Fig11_HTML.jpg](img/416805_2_En_6_Fig11_HTML.jpg)\n\
  \n图 6-11\n\n集成学习\n\n*   *集成学习：* 这是一组通过组合多个机器学习算法的结果而构建的算法。这些方法因其能够提供优越的结果以及可以分解为独立模型在分布式网络上进行训练的可能性而变得非常流行。我们将在第\
  \ 8 章讨论装袋、提升、堆叠和混合集成。见图 6-11。\n\n![../images/416805_2_En_6_Chapter/416805_2_En_6_Fig10_HTML.jpg](img/416805_2_En_6_Fig10_HTML.jpg)\n\
  \n图 6-10\n\n深度学习算法\n\n*   *深度学习：* 这些算法基于复杂的神经结构，可以从海量数据集中抽象出更高级别的信息。它们计算量大且难以训练。简单来说，你可以将它们视为具有多个隐藏层的非常大的神经网络。我们专门用第\
  \ 11 章来介绍深度学习。见图 6-10。\n\n![../images/416805_2_En_6_Chapter/416805_2_En_6_Fig9_HTML.jpg](img/416805_2_En_6_Fig9_HTML.jpg)\n\
  \n图 6-9\n\n人工神经网络\n\n*   *人工神经网络（ANN）：* 受生物神经网络启发，它们足够强大，可以学习非线性关系并识别变量之间的高阶关系。它们可以实现监督和无监督学习过程。传统神经网络与深度学习神经网络（本章稍后讨论）的复杂性之间存在显著差异。本章我们将讨论感知器和反向传播。见图\
  \ 6-9。\n\n![../images/416805_2_En_6_Chapter/416805_2_En_6_Fig8_HTML.jpg](img/416805_2_En_6_Fig8_HTML.jpg)\n\
  \n图 6-8\n\n关联规则挖掘\n\n*   *关联规则挖掘：* 在这些算法中，观察变量之间的关系，并用于量化这种关系，以实现预测和探索性目标。这些方法已被证明对于构建和挖掘大型多维数据集之间的关系非常有用。流行的推荐系统基于关联规则挖掘算法的某些变体。本章我们将讨论\
  \ Apriori 和 Eclet 算法。见图 6-8。\n\n![../images/416805_2_En_6_Chapter/416805_2_En_6_Fig7_HTML.jpg](img/416805_2_En_6_Fig7_HTML.jpg)\n\
  \n图 6-7\n\n聚类算法\n\n*   *聚类算法：* 这些算法通常基于最大化簇内相似性和最小化簇间相似性的简单原理。相似性的度量决定了簇的形成方式。它们在市场营销和人口统计学研究中非常有用。大多数情况下，这些是无监督算法，它们将数据分组以实现最大共性。我们将讨论\
  \ k-means、期望最大化算法和层次聚类。我们还将讨论分布式聚类。见图 6-7。\n\n![../images/416805_2_En_6_Chapter/416805_2_En_6_Fig6_HTML.jpg](img/416805_2_En_6_Fig6_HTML.jpg)\n\
  \n图 6-6\n\n贝叶斯算法\n\n*   *贝叶斯算法：* 这些算法可能不被称为学习算法，因为它们基于贝叶斯定理的先验和后验分布。机器本质上不是通过迭代过程学习，而是利用变量分布的推断。这些方法非常流行且易于解释，主要用于分类和推断测试。本章我们将介绍朴素贝叶斯模型，并引入概率的基本概念来解释它们。见图\
  \ 6-6。\n\n![../images/416805_2_En_6_Chapter/416805_2_En_6_Fig5_HTML.jpg](img/416805_2_En_6_Fig5_HTML.jpg)\n\
  \n图 6-5\n\n决策树算法\n\n*   *基于树的算法：* 这些算法基于应用于实际数据的顺序条件规则。这些规则通常是串行应用的，当满足所有条件时，做出分类决策。这些方法在决策引擎和分类问题中非常流行。它们是快速且分布式的算法。本章我们将讨论\
  \ CART、迭代二分器、CHAID 和 C5.0 等算法，并在第 8 章中使用它们来训练我们的集成模型。见图 6-5。\n\n![../images/416805_2_En_6_Chapter/416805_2_En_6_Fig4_HTML.jpg](img/416805_2_En_6_Fig4_HTML.jpg)\n\
  \n图 6-4\n\n正则化算法\n\n*   *正则化方法：* 正则化方法本质上是回归方法的扩展。正则化算法向损失函数（如第 5 章所述）引入一个惩罚项，以平衡模型的复杂度和结果的改进。在处理具有大量特征和大数据量的数据时，它们是非常强大且有用的技术。我们在第\
  \ 5 章中介绍了 L1 正则化，作为变量子集选择的一种嵌入方法。见图 6-4。\n\n![../images/416805_2_En_6_Chapter/416805_2_En_6_Fig3_HTML.jpg](img/416805_2_En_6_Fig3_HTML.jpg)\n\
  \n图 6-3\n\n基于距离的算法\n\n\n\n*   *基于距离的算法：* 基于距离或基于事件的算法用于学习数据的表示，并创建一种度量标准，以识别对象是否属于目标类别。它们有时被称为基于记忆的学习，因为它们从数据中捕获的一组实例/事件中学习。在第\
  \ 8 章中，我们使用 K 近邻和学习向量量化来创建集成模型。见图 6-3。\n\n![../images/416805_2_En_6_Chapter/416805_2_En_6_Fig2_HTML.jpg](img/416805_2_En_6_Fig2_HTML.jpg)\n\
  \n图 6-2\n\n回归算法\n\n*   *基于回归的方法：* 基于回归的方法在学术界和研究中最为流行且应用广泛。它们易于解释，也易于部署到实际生产环境中。在这类方法中，因变量与一组自变量之间的关系通过概率方法或误差函数最小化来估计。本章将涵盖线性回归、多项式回归和逻辑回归。见图\
  \ 6-2。\n\n所讨论的算法列表在 R、Python 和其他统计软件包中有多种实现。并非所有方法都有现成的 R 包可供实现。某些算法在 R 环境中未得到完全支持，必须通过调用\
