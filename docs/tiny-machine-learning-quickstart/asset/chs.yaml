  ```\n\n应该使用哪些映射？这完全取决于你的数据，这正是绘图派上用场的地方。通过观察每个回归图，你应该能够将数据点分布的*形状*与某个可用函数关联起来。如果是这样，你可以高度聚焦，只对需要它的列应用严格必要的变换。否则，如果你找不到任何好的匹配，就留空，以便尝试所有映射——也许稍后可以添加一个特征选择步骤。\n\
  \n注意\n\n指数算子可能会非常迅速地增长到难以处理的数值！我强烈建议你在此之前始终应用特征缩放。\n\n### 多项式输入组合\n\n有时，当你的特征被放在一起考虑而不是孤立考虑时，它们可能携带重要信息。\n\
  \n例如，假设你想在医疗行业创建一个模型，并且你处理的是患者数据。众所周知，身高和体重单独来看可能不足以判断一个人是否处于良好状态，但结合起来，它们能更好地描述一个人的状况。\n\
  \n多项式特征变换通过将每对列相乘来生成新特征。它还会生成*平方*列（将一列与其自身相乘）。清单 3-7 展示了如何使用它。\n\n|   | h | w |\
  \ h_x_h | w_x_w | h_x_w |\n| --- | --- | --- | --- | --- | --- |\n| **0** | 74 |\
  \ 242 | 5453 | 58512 | 17863 |\n| **1** | 69 | 162 | 4731 | 26345 | 11164 |\n| **2**\
  \ | 74 | 213 | 5492 | 45259 | 15766 |\n| **3** | 72 | 220 | 5145 | 48419 | 15784\
  \ |\n| **4** | 70 | 206 | 4883 | 42580 | 14420 |\n\n```\nfrom tinyml4all.tabular.regression\
  \ import Table\nfrom tinyml4all.tabular.features import Multiply\n# assume the people.csv\
  \ files contains width (w), height (h)\n# and BMI of a group of people\ntable =\
  \ Table.read_csv(\"people.csv\")\ntable.set_targets(column=\"bmi\")\n# if you omit\
  \ the columns parameter,\n# all columns will be considered\nmult = Multiply(columns=[\"\
  w\", \"h\"])\ntable 2 = mult(table)\n清单 3-7\n应用多项式特征扩展\n```\n\n提示\n\n由于乘法可能导致非常大的值，或者如果两列处于完全不同的范围时产生偏斜，建议你先应用特征归一化。\n\
  \n## 回归模型\n\n与分类一样，回归也有许多可用的模型可供选择。它们在描述能力和复杂性上有所不同：在熟悉它们之前，我建议你针对特定项目尝试所有模型，并选择表现最好的一个。本节介绍以下模型。\n\
  \n*   普通最小二乘法或线性回归\n\n*   岭回归\n\n*   套索回归\n\n*   决策树\n\n*   随机森林\n\n### 普通最小二乘法\n\
  \n也称为*线性回归*，回归中最常用的模型是普通最小二乘法（OLS）。它假设样本（记为 *X*）与真实值（记为 *Y*）之间存在线性关系。这种线性关系可以用以下公式以矩阵形式表示。\n\
  \n![$$ Y={W}^T\\cdotp X $$](img/619308_1_En_3_Chapter_TeX_Equc.png)\n\nW ^T 是我们旨在寻找的未知权重矩阵。由于我们通常无法找到该方程的精确解，因此该方法旨在最小化真实值与模型预测值之间的平方误差之和。\n\
  \n![$$ \\mathit{\\operatorname{minimize}}{\\sum}_{i=1}^N{\\left({truth}_i-{pred}_i\\\
  right)}² $$](img/619308_1_En_3_Chapter_TeX_Equd.png)\n\n这个迭代过程应在给定迭代次数后收敛到最优解。清单\
  \ 3-7 是一个如何使用此方法以及本章涵盖的其他方法的示例。\n\n\n\n### 岭回归与套索回归\n\n普通最小二乘法的一个问题是它对权重的幅度没有限制。例如，对于我们的\
  \ RGB 距离项目，可能会得出类似以下的关系式。\n\n![$$ dist=1432r+785g+354b $$](img/619308_1_En_3_Chapter_TeX_Eque.png)\n\
  \n这是一个*可能*存在的合理关系。但在现实场景中，大多数情况下我们可以预期系数的幅度要小得多（取决于输入的尺度），而这些奇怪的数字往往是*过拟合*的迹象。岭回归[1]\
  \ 试图最小化预测误差，同时也尽可能保持权重较低，从而降低过拟合的风险。\n\n套索回归[2] 方法在精神上与岭回归相似，它也试图*正则化*权重参数。岭回归的目标是让权重值尽可能低，而套索回归的目标则是让尽可能多的权重值变为零，从而创建一个*稀疏*解（其中只有少数值非零）。这种特性在存在许多（无关）输入的情况下非常有用。\n\
  \n代码示例请参考列表 3-7。\n\n### 决策树与随机森林\n\n并非所有的回归关系都是线性的（无论是基于原始输入还是其变换版本）。如果你的数据表现出更复杂的关系，前面提到的模型可能效果不佳。一种选择是通过特征工程引入非线性特征。另一种选择是使用高度非线性的模型，如决策树（以及由此扩展的随机森林）。\n\
  \n这些模型在分类场景中的工作方式相同：它们对输入特征生成一系列的分割。每个分割最终输出一个（连续的）数值，而不是一个类别标签（见图 3-7）。\n\n![](img/619308_1_En_3_Fig7_HTML.jpg)\n\
  \n一张说明决策树回归模型的图表。水平轴标记为“数据”，垂直轴标记为“目标”。蓝点代表数据点，红色阶梯线代表决策树输出。红色线以分段常数的方式逼近数据点，展示了决策树如何根据输入数据预测目标值。图例显示蓝点为“数据”，红线为“决策树输出”。\n\
  \n图 3-7\n\n用于回归的决策树\n\n表 3-1 总结了迄今为止列举的模型的特征。\n\n表 3-1\n\n回归模型总结\n\n|   | 优点 | 缺点\
  \ |\n| --- | --- | --- |\n| **普通最小二乘法 (OLS)** | 对线性数据效果好；训练速度快；内存与特征数量呈线性关系 | 可能过拟合；对非线性数据效果不佳\
  \ |\n| **岭回归** | 比 OLS 更不易过拟合 | 对非线性数据效果不佳 |\n| **套索回归** | 比 OLS 更不易过拟合 | 对非线性数据效果不佳\
  \ |\n| **决策树/随机森林** | 对高度非线性数据效果好 | 可能需要调整参数以避免过拟合。不推荐用于非常线性的数据 |\n\n你可以参考列表 3-8\
  \ 来使用这些回归器中的任何一个。\n\n```\nfrom tinyml4all.tabular.regression.models import Linear,\
  \ Ridge, Lasso, DecisionTree, RandomForest\nlinear = Linear()\nridge = Ridge()\n\
  lasso = Lasso()\ntree = DecisionTree()\nrf = RandomForest()\n# 应用上述任意模型\ntable2\
  \ = linear(table)\n# 获取指标\nprint(table2.regression_report())\n+-------+-------+------+------+\n\
  |  MAE   |  RMSE | MAPE  | R²  |\n+-------+-------+------+------+\n| 32.33  | 38.17\
  \ | 43%   | 0.80 |\n+-------+-------+------+------+\n列表 3-8\n将回归模型应用于表格\n```\n\n\
  ## 回归链\n\n在你尝试了迄今为止列举的不同处理算子，并检查了散点图和报告之后，你终于可以组装一个完整的回归链，以产生尽可能最佳的输出（列表 3-9）。\n\
  \n对于本项目中的 RGB 距离数据集，以下由稳健特征缩放、单调函数映射和线性回归组成的链表现相当不错。\n\n```\nfrom tinyml4all.tabular.regression\
  \ import Table, Chain\nfrom tinyml4all.tabular.regression.models import Linear\n\
  from tinyml4all.tabular.features import Scale, Monotonic, Select\ntable = Table.read_csv(\"\
  \"rgb-distance.csv\"\")\ntable.set_targets(column=\"\"distance\"\")\nchain = Chain(\n\
  Scale(\"robust\"),\nMonotonic(),\n# 可选，可能会略微降低精度\n#Select(sequential=\"auto\", estimator=Linear()),\n\
  Linear()\n)\npredictions = chain(table)\nprint(predictions.regression_report())\n\
  +-------+-------+------+------+\n|  MAE   |  RMSE | MAPE  | R²   |\n+-------+-------+------+------+\n\
  | 6.29   |  8.19  | 4%   | 1.00  |\n+-------+-------+------+------+\n列表 3-9\nRGB\
  \ 距离数据集的完整回归链\n```\n\n由于我们的距离以毫米为单位，结果突出显示我们模型的平均绝对误差为 6 毫米。对于我们这个基于环境光与距离之间相当朴素的相关性的简单项目来说，这是一个合理的误差。\n\
  \n如果你不满意，你必须修改你的链组成。由于特征缩放几乎在所有情况下都能改善结果，你应该专注于特征工程部分——也许添加一个多项式组合步骤？模型的选择取决于输入和输出之间的关系是否是线性的。或者基于树的模型会表现更好？\n\
  \n## 部署\n\n当你对回归结果满意后，就该将其移植到 C++了。回归链与分类链没有区别，如列表 3-10 所示。生成的代码是一个独立的类，你可以将其导入任何\
  \ C++项目（不一定是基于 Arduino 的项目）。在进入下一节之前，请将生成的文件复制到你的 Arduino 项目文件夹中！\n\n```\nchain.convert_to(\"\
  c++\", class_name=\"DistanceChain\", save_to=\"\"\"DistanceChain.h\"\"\")\n列表 3-10\n\
  将回归链转换为 C++\n```\n\n\n\n### 如何在 Arduino Sketch 中使用部署\n\n与第 2 章类似，部署草图与采集草图几乎相同：它只增加了少量代码来对输入运行回归。该链接收三个输入：红色、绿色和蓝色光分量。然后，它生成一个单一的连续输出，即估计距离（以毫米为单位）。代码清单\
  \ 3-11 假设你仍然连接着距离传感器，以便你可以将预测值与*实际*距离进行比较。在评估系统的现场性能后，你可以移除距离传感器。（否则，当你已有测量值时，使用估计值将毫无意义！）\n\
  \n```\nNano\n/**\n* 代码清单 3-11\n* 根据 RGB 预测距离\n*\n* 所需硬件：Arduino Nano BLE Sense。\n\
  * 可选硬件：超声波距离传感器 (HC-SR04)\n*/\n#include \n#include \n// 这是代码清单 3-10 中生成的文件\n#include\
  \ \"./DistanceChain.h\"\n// 如果引脚不同，请替换为你自己的引脚\n#define ECHO 2\n#define TRIG 3\n\
  using tinyml4all::printCSV;\ntinyml4all::APDS9960 sensor;\ntinyml4all::Ultrasonic\
  \ ultrasonic(ECHO, TRIG);\ntinyml4all::DistanceChain chain;\nvoid setup() {\nSerial.begin(115200);\n\
  while (!Serial);\nSerial.println(\"根据 RGB 预测距离\");\n// 初始化传感器\n// 如果出现问题，将抛出错误\n\
  sensor.begin();\nultrasonic.begin();\n}\nvoid loop() {\n// 读取 R、G、B\nsensor.readColor();\n\
  // 将数据馈送到回归链\n// 应始终返回 true\nif (!chain(sensor.r, sensor.g, sensor.b))\nreturn;\n\
  // 链输出位于 output.regression.value 中\nSerial.print(\"预测距离：\");\nSerial.print(chain.output.regression.value);\n\
  Serial.print(\" mm\");\n// 如果距离传感器可用，\n// 打印测量值与预测值之间的误差\nuint16_t distance = ultrasonic.millimiters();\n\
  int16_t error = chain.output.regression.value - distance;\nSerial.print(\" (\");\n\
  Serial.print(error);\nSerial.print(\" mm 偏差)\");\nSerial.println();\ndelay(1000);\n\
  }\n代码清单 3-11\n基于 RGB 分量预测距离的 Arduino 草图\n```\n\n如你所见，回归链 API 仍然只包含一个方法：`chain(inputs)`。它在后台运行所有链式步骤，并将结果存储在\
  \ `output.regression.value` 中，在本例中这是一个连续数值。图 3-8 显示了代码清单 3-11 的日志，误差范围从 –4 到 9 毫米。\n\
  \n![](img/619308_1_En_3_Fig8_HTML.jpg)\n\n一个计算机终端窗口显示根据 RGB 数据预测的距离。预测结果包括：57.42\
  \ 毫米（偏差 3 毫米）、65.53 毫米（偏差 -4 毫米）、73.17 毫米（偏差 -2 毫米）、93.94 毫米（偏差 7 毫米）和 72.91 毫米（偏差\
  \ 9 毫米）。界面显示了自动滚动、时间戳以及换行和波特率（115200）设置的选项。\n\n图 3-8\n\n串口监视器上的预测输出\n\n现在，自己尝试一下。将开发板靠近你用于采集训练数据的明亮平坦表面，看看预测距离是否与测量距离匹配。\n\
  \n注意\n\n表面和光照条件必须与采集训练数据时相似，这一点非常重要；否则，结果可能会有很大偏差，甚至完全错误！\n\n## 总结\n\n本章介绍了一些新概念。表格回归的大部分开发周期与分类相同。这就是我们只关注其不同之处的原因：可视化和模型。\n\
  \n散点图用于可视化回归数据。为了对回归数据进行建模，有一些专门针对此任务的新算法，但也有我们已用于分类的算法（决策树和随机森林）的变体。\n\n在 Python\
  \ 中完成工作后，使用 Arduino 框架在微控制器上的部署与第 2 章保持一致。只需调用一次 `chain(inputs)`，即可在后台运行所有必要的计算，并生成我们感兴趣的输出。\n\
  \n现在我们已经完成了表格数据的处理，是时候转向一种新的数据类型了：时间序列。\n\n"
- "# 4. 使用 Edge Impulse 进行时间序列分类\n\n时间序列数据是指时间与测量值同等重要的数据。重新排列样本的顺序将完全颠覆底层的数据模式。时间序列分类的任务是接收一个*批次*（窗口）的输入，并判断整个批次属于哪个类别。\n\
  \n你仍然可以选择在行级别应用一些转换（归一化、分箱），但在时间序列的背景下，特征工程侧重于从每个数据窗口中提取描述性统计信息。\n\n本章介绍如何使用无代码工具\
  \ Edge Impulse [1] 进行时间序列分类。我们将要构建的项目是一个*连续运动*分类器：它根据加速度计数据检测我们正在执行的手势（在几个可用手势中）（见图\
  \ 4-1）。它是许多需要对恒定且重复的数据流进行分类的类似用例的原型。\n\n![](img/619308_1_En_4_Fig1_HTML.jpg)\n\n\
  三个面板展示了手持小型电子设备的不同手部动作。左侧面板标有“摇晃”，箭头表示摇晃动作。中间面板标有“滑动”，箭头表示上下滑动动作。右侧面板标有“挥手”，波浪线表示挥手动作。每个面板都显示一只手握着设备。\n\
  \n图 4-1\n\n连续手势示例\n\n*   逐小时温度变化（多天）\n*   肌肉的 EMG（肌电图）信号\n*   工业环境中的电机转速\n\n以下列表突出了主要步骤。\n\
  \n1.  使用微控制器采集数据。\n2.  使用 Python 在 PC 上加载和检查数据。\n3.  在 Edge Impulse 上创建一个新项目。\n\
  4.  上传 CSV 数据并指定其布局。\n5.  分割训练集和测试集。\n6.  执行特征提取。\n7.  定义并训练神经网络架构。\n8.  在测试集上评估模型性能。\n\
  9.  将模型导出为 Arduino 库格式。\n10. 将 Edge Impulse 模型部署回微控制器。\n\n使用无代码工具可以让你快速轻松地迭代各种模型配置，而无需过多担心技术细节。本章重点介绍时间序列相关概念（窗口、重叠、时域和频域特征）并完成工作。第\
  \ 5 章将更深入地探讨实现细节和优化，以实现更轻量、更快速的部署。\n\n\n\n## 所需硬件\n\n你需要加速度计和陀螺仪的数据来开展工作。一些开发板内置了惯性测量单元，或者你也可以为当前使用的开发板外接一个。常见的模块包括\
  \ MPU92650、MPU6886 和 LSM6DS3。本书的代码示例使用的是内置 LSM9DS1 的 **Arduino Nano BLE Sense**。\n\
  \n*惯性测量单元*（IMU）是一种用于测量运动、方向和速度的传感器模块。它结合了来自多个传感器（加速度计、陀螺仪和磁力计）的数据，以全面理解三维空间中的运动和定位。\n\
  \nIMU 通过以下传感器检测运动和方向的变化。\n\n*   **加速度计**：测量线性加速度（例如，沿 *x*、*y* 和 *z* 轴的运动）。它有助于确定倾斜角度和运动速度，但无法区分重力加速度和实际运动。\n\
  \n*   **陀螺仪**：测量角速度（即绕每个轴的旋转速度）。它有助于跟踪方向变化，但随着时间的推移容易产生漂移。\n\n*   **磁力计**：测量地球磁场以确定绝对航向（类似于指南针）。它有助于校正陀螺仪漂移，但可能受到局部磁场干扰的影响。\n\
  \n通过专用算法融合这些传感器的读数，你可以估算物体在空间中的姿态和航向状态。IMU 传感器通常有三种不同的封装形式。\n\n*   3 轴：仅包含加速度计\n\
  \n*   6 轴：包含加速度计和陀螺仪\n\n*   9 轴：包含加速度计、陀螺仪和磁力计\n\n磁力计常常被忽视，但如果你能负担得起 9 轴模块，仍然应该考虑它，因为它有助于减轻陀螺仪的漂移误差。当与磁铁配合使用时，它也是一个有用的传感器（参见第\
  \ 5 章的项目）。\n\n## 所需软件\n\n你需要在本地计算机上安装第 2 章中详述的软件，因此，如果你不是按顺序阅读本书，请参考该章节。\n\n除此之外，你还需要在\
  \ Edge Impulse 网站上创建一个免费账户。请访问 [`https://studio.edgeimpulse.com/signup`](https://studio.edgeimpulse.com/signup)\
  \ 并完成所需步骤。图 4-2 描述了 Edge Impulse 平台的开发工作流程。\n\n![](img/619308_1_En_4_Fig2_HTML.jpg)\n\
  \n一个流程图，展示了两行相互连接的步骤。顶行包括带有云图标的“数据收集”、带有网络图标的“边缘设备”和带有屏幕图标的“监控”，由箭头连接。底行显示带有服务器图标的“构建”、带有电路板图标的“训练”和带有时钟图标的“优化”。每个步骤由箭头链接，表示一个连续的循环。每个步骤下方的描述性文字解释了操作：构建数据集、训练模型和优化脉冲。\n\
  \n图 4-2\n\nEdge Impulse 开发工作流程\n\n## 捕获数据\n\n如第 2 章所示，你有多种方法从开发板收集数据并将其传输到电脑。\n\n\
  *   从串口监视器复制粘贴\n\n*   使用 Python 从串口读取\n\n*   将数据存储在 SD 卡上\n\n本章利用方法 2，并使用 Python\
  \ 来很好地格式化我们的时间序列数据。从串口复制粘贴虽然更直接，但存在一些缺点。\n\n*   我们将要收集大量数据（约 100 个样本/秒），并且存在串口监视器溢出的风险，从而丢弃旧样本。\n\
  \n*   由于我们的开发板没有内置实时时钟，我们需要手动创建时间戳（我们只能通过调用 `millis()` 获得*相对*时间）。\n\n`tinyml4all`\
  \ Python 库很好地解决了这些问题。\n\n让我们从 Arduino Nano BLE Sense 的草图开始。如果你使用的是不同的开发板，请将 IMU\
  \ 读取逻辑替换为相应的代码（参见代码清单 4-1）。\n\n```\n/**\n* 代码清单 4-1：读取加速度计 + 陀螺仪数据\n*\n* 所需硬件：Arduino\
  \ Nano BLE Sense。\n*/\n#include \n#include \nusing tinyml4all::printCSV;\ntinyml4all::LSM9DS1\
  \ imu;\nvoid setup() {\nSerial.begin(115200);\nwhile (!Serial);\nSerial.println(\"\
  以 CSV 格式收集加速度+陀螺仪数据\");\n// 初始化 IMU 传感器（失败时会抛出错误）\nimu.begin();\n}\nvoid loop()\
  \ {\n// 读取加速度计和陀螺仪\nimu.readAcceleration();\nimu.readGyroscope();\nprintCSV(millis(),\
  \ imu.ax, imu.ay, imu.az, imu.gx, imu.gy, imu.gz);\n// 无手动延迟，默认采样率约为 100 Hz\n}\n\
  代码清单 4-1\n收集 IMU（加速度 + 陀螺仪）数据草图\n```\n\n将草图刷写到开发板后，通过打开串口监视器确认其工作正常（见图 4-3），然后你需要运行读取数据的\
  \ Python 脚本。代码清单 4-2 类似于第 2 章的代码清单 2-3，此处为了方便而列出。唯一的修改在于列的名称。\n\n![](img/619308_1_En_4_Fig3_HTML.jpg)\n\
  \n一个终端窗口，显示正在作为 CSV 文件收集的加速度计和陀螺仪数据。数据包括多行代表传感器读数的数值。界面显示“自动滚动”、“显示时间戳”等选项，以及“换行符”和“波特率”设置为\
  \ 115200 的设置。窗口标题指示设备路径。\n\n图 4-3\n\nIMU 数据收集的串口输出\n\n```\nfrom tinyml4all.time\
  \ import capture_serial\nwhile True:\ngesture = input(\"这是哪个手势？ \")\nduration =\
  \ input(\"要捕获多少秒？ \")\nif not gesture or not duration:\nbreak\ncapture_serial(\n\
  # * 是通配符\nport=\"/dev/cu.usb*\",\n# 与 Arduino 草图匹配\nbaudrate=115200,\nduration=f\"\
  {duration} 秒\",\nsave_to=f\"motion/{gesture}.csv\",\n# 必须与 Arduino 草图中的顺序匹配！\nheadings=\"\
  millis, ax, ay, az, gx, gy, gz\"\n)\n代码清单 4-2\n在 Python 中从串口捕获数据\n```\n\n要运行代码，请在脚本所在文件夹内打开终端，激活\
  \ Python 虚拟环境并输入。\n\n```\n(tinyml)$ python capture_motion.py\n文件夹 motion 不存在：现在创建？[y|n]\
  \ y\n这是哪个手势？ wave\n要捕获多少秒？ 30\n串口已连接\n准备好后按 [Enter] 开始：\n任务将在 3...2...1...开始！\n\
  100%|██████████| 30/30 [00:30<00:00,  1.00s/it]\n已收集 3689 行数据\n```\n\n倒计时结束后，以连续模式执行你想要的手势。连续手势的良好示例包括挥动开发板、画圈移动、摇晃以及来回滑动。为你想要分类的每个手势重复收集过程，每次相应地更改文件名；每个手势收集\
  \ 20-30 秒是一个不错的起点。\n\n提示\n\n第一次开始时，使用有限数量的手势（3-4 个），这样无需过多调整就更容易获得良好结果。成功后，如果需要，以后可以添加更多手势。\n\
  \n注意\n\n请记住记录一个*空闲*类别，即你不执行任何运动；否则，分类器会尝试在已知手势中找到最佳匹配。\n\n完成手势记录后，你的项目中应该有一个包含不同文件的文件夹。\n\
  \n```\n|- your-project-root\n|- capture_motion.py\n|- motion\n|- idle.csv\n|- shake.csv\n\
  |- slide.csv\n|- wave.csv\n```\n\n\n\n### 加载与检查数据\n\n加载时间序列数据与加载表格数据基本相同，正如你在第 2\
  \ 章和第 3 章中所见。主要区别在于我们没有使用`Table`类，而是改用`TimeSeries`类（参见代码清单 4-3）。除此之外，其余部分保持一致。\n\
