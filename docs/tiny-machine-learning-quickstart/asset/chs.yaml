  \ RNN 与运行 MLP 相同，无需修改任何代码。不同之处在于输入向量的创建方式。时间序列通常通过将新读取的样本加入队列并丢弃旧样本来随时间构建。你可以手动处理，但生成的代码可以直接为你处理。\n\
  \n清单 8-4 展示了如何运行导出的 RNN，对 Arduino Nano BLE Sense 内置 IMU 的加速度计数据进行分类。\n\n```\n/**\n\
  * 清单 8-4：使用 LSTM 模型对连续运动进行分类\n*\n* 所需硬件：Arduino Nano BLE Sense\n*/\n#include \"\
