  \ {\nSerial.println(\"无法获取新帧\");\nreturn;\n}\n// 打印帧\ncamera.print();\n// 运行 impulse\n\
  if (!impulse.run(camera)) {\nSerial.println(impulse.error.msg);\nreturn;\n}\nif\
  \ (impulse.count() == 0)\nreturn;\nSerial.print(\"发现 \");\nSerial.print(impulse.count());\n\
  Serial.println(\" 个物体\");\n// 打印物体及其坐标\nfor (int i = 0; i  \");\nSerial.print(object.label);\n\
  Serial.print(\" 位于坐标 \");\n// cx, cy 是物体中心的坐标\nSerial.print(object.cx);\nSerial.print(\"\
  , \");\nSerial.print(object.cy);\nSerial.print(\" (置信度 \");\nSerial.print(object.confidence);\n\
  Serial.println(\")\");\n}\n}\n代码清单 7-4\n用于调试物体检测结果的 Arduino 程序\n```\n\n接下来，创建一个新的\
  \ Python 脚本（见代码清单 7-5）。该脚本类似于代码清单 7-2，但这次不会提示您输入物体名称，因为它仅用于可视化目的。\n\n```\nfrom tinyml4all.image\
  \ import debug_serial\ndebug_serial(\n# * 是匹配任何内容的通配符\nport=\"/dev/cu.usb*\",\n\
  # 必须与 Arduino 程序匹配\nbaudrate=115200 * 2\n)\n代码清单 7-5\n显示物体检测结果\n```\n\n运行该脚本，应会出现一个新窗口，其中包含摄像头流的预览（见图\
  \ 7-12），并且在感兴趣的物体上（如果有）会有一个红点。\n\n![](img/619308_1_En_7_Fig12_HTML.jpg)\n\n一张数字插图，显示一个企鹅玩具，胸前有一个红色圆圈，站在木质表面上。背景是一面白色砖墙、一株小盆栽、一个白色杯子和一个木质人体模型。场景看起来像是通过电脑窗口观看，左上角有一个蓝色标题栏和一个红色关闭按钮。\n\
  \n图 7-12\n\n物体检测结果调试窗口\n\n恭喜！您完成了第一个物体检测项目，也是本书的最后一个动手实践项目。花点时间庆祝您的成就吧。\n\n## 总结\n\
  \n这最后一章“对初学者友好”的章节，利用低代码的 Edge Impulse 平台，在我们配备摄像头的开发板上实现了最先进的实时物体检测。工作流程是线性且直观的：捕获我们感兴趣物体的图像，通过围绕物体绘制边界框的简单\
  \ GUI 进行标注，训练神经网络来完成繁重的工作，然后将网络部署回我们的微控制器。\n\n得益于 `tinyml4all` 库，在开发板上的每个操作都只需几行代码，因此您可以完全控制您的固件。您可以在检测到物体时集成自定义逻辑（例如，激活继电器、打开\
  \ LED），我们甚至可以获取物体的（粗略）位置，用于更高级的应用（例如，云台舵机、自动驾驶机器人）。\n\n最后一章将向前迈出一大步，深入探讨人工神经网络的方方面面：它们如何工作，如何从头开始创建和训练一个神经网络，以及最后如何将其部署回我们的\
  \ Arduino 微控制器，而无需依赖外部平台。\n\n\n\n"
- "# 8. 从零开始学 TensorFlow\n\n到目前为止，我们要么通过手动特征工程和分类器/回归器模型来实现“传统”机器学习，要么利用低代码的 Edge\
  \ Impulse 平台来释放神经网络的威力，而无需深入代码的细枝末节。但本书旨在将你培养成一名熟练的 TinyML 实践者，如果没有一章关于如何通过编写代码来使用神经网络的实践内容，那将是不完整的。\n\
  \n有多个 Python 框架实现了神经网络，其中使用最广泛且唯一能与 Arduino 环境良好集成的框架是 TensorFlow [1]。TensorFlow\
  \ 是由谷歌管理的一个项目，为许多运行最先进深度学习算法的产品提供支持。本章重点介绍四种可以移植到我们嵌入式硬件上的架构：用于表格数据分类的多层感知器、用于时间序列分类的循环神经网络和一维卷积神经网络，以及用于图像分类的二维卷积神经网络。\n\
  \n让我们利用已收集的项目数据（或使用玩具数据集或合成数据），专注于使用 Python 和 `tinyml4all` 包来定义、训练和部署神经网络。\n\n##\
  \ 所需硬件\n\n本章重点教你如何训练和部署神经网络架构。\n\n因此，唯一的硬件要求是一块能够运行 TensorFlow 模型的开发板。出于兼容性便利的考虑，本章中的\
  \ Arduino 代码在以下开发板上都能同样良好地运行。\n\n*   ARM Cortex-M 开发板（Arduino Nano 和 Nicla 系列，Raspberry\
  \ Pi Zero）\n*   ESP32（S3 和非 S3 版本）\n\n如果你使用不同的芯片组，请参考开发板供应商提供的具体文档。\n\n注意\n\nTensorFlow\
  \ 模型需要大量 RAM 才能运行，因此请选择至少具有 256 KB RAM 的开发板（512 KB 更佳）。\n\n## 所需软件\n\n在 Python 方面，除了\
  \ `tinyml4all` 库之外，你还需要 TensorFlow 库。该库默认不包含在内，因为它体积庞大（>100 MB），并且并非所有人都觉得它有用。\n\
  \n要安装它，请打开终端，激活你的虚拟环境，然后输入以下命令。\n\n```\n(tinyml) $ python -m pip install \"tinyml4all[tensorflow]\"\
  \n```\n\n这会安装一个特定版本的 TensorFlow（2.15.1），因为较新的版本无法与本章描述的所有模型兼容。如果你已经安装了更新的版本，则必须降级。\n\
  \n提示\n\n如果你不想（或无法）在你的 PC 上安装 TensorFlow，你可以在 Google Colab（[`https://colab.research.google.com`](https://colab.research.google.com)）中运行以下\
  \ Python 脚本，这是一个来自谷歌的云计算环境。免费版甚至提供了一个 GPU，为你提供强大的算力。\n\n在第一个单元格中运行以下行来设置所有依赖项。\n\
  \n`! python -m pip install \"tinyml4all[tensorflow]\"`\n\n在 Arduino 方面，你必须安装一个额外的库。同样，TensorFlow\
  \ 是一个大型依赖项，在不需要时可能会减慢编译速度，因此它不包含在 `tinyml4all` Arduino 库中。\n\n从 Arduino IDE 打开库管理器，搜索\
  \ `tensorflow-runtime-universal`*，* 并安装它（参见图 8-1）。\n\n![](img/619308_1_En_8_Fig1_HTML.jpg)\n\
  \n该图像显示了一个库管理器界面，其中包含“tensorflow-runtime-universal”的搜索结果。结果包括详细信息，例如作者 Simone Salerno、联系信息、版本\
  \ 1.0.0 和状态“已安装”。它提到了与 Cortex M 和 ESP32 芯片组的兼容性。有一个“更多信息”链接以及按类型和主题筛选的选项。\n\n图 8-1\n\
  \n安装 tensorflow-runtime-universal Arduino 库\n\n## 神经网络结构\n\n神经网络有多种形态。由于本书并非关于深度学习，因此只关注最简单的架构，称为*顺序模型*，其中网络被定义为一连串的*层*。简单来说，层就是*神经元*的集合。\n\
  \n神经元是网络的基本原子组件。神经元有多种类型，每种都封装了不同的计算逻辑。通过利用（可能不同类型的）神经元的集合，整个网络可以对复杂的输入/输出关系进行建模（参见图\
  \ 8-2）。\n\n![](img/619308_1_En_8_Fig2_HTML.jpg)\n\n深度神经网络示意图，显示了一个输入层、多个隐藏层和一个输出层。左侧的输入层由五个节点组成，每个节点都连接到第一个隐藏层中的节点。有三个隐藏层，每个隐藏层有五个节点，与相邻层中的节点相互连接。右侧的输出层也有五个节点，接收来自最后一个隐藏层的连接。箭头指示节点之间的数据流向。\n\
  \n图 8-2\n\n神经网络拓扑示例\n\n每种网络架构都由三个基本部分组成，这些部分始终存在。\n\n*   **输入层**：网络的第一层由其输入表示。这些值来自*外部世界*，实际上不受网络控制。输入值可以是表格数据、音频、时间序列、图像、视频等。输入的特征在于其*形状*（它有多少个维度）。\n\
  *   **输出层**：这是网络的最后一层，包含我们感兴趣的结果。对于分类任务，该层通常包含输入样本属于每个可能类别的概率。对于回归任务，该层包含预测值。因此，输出层的形状在某种程度上也不受我们控制，不能随意配置。\n\
  *   **隐藏层**：这些是位于输入层和输出层之间的所有层。根据网络拓扑，它们可以包含少量或大量层（甚至数十或数百层），所有层类型相同或来自不同类型，具有不同的大小和复杂度。**这是你可以控制的部分。**\
  \ 这部分的作用是让网络学习输入和输出之间的关系。更多的层可以学习更复杂的关系，但代价是需要更多的内存/计算资源。\n\n注意\n\n在使用 TinyML 时，你需要尽可能精简隐藏层，以满足硬件约束。\n\
  \n### 前向传播\n\n给定一个输入样本，通过网络各层产生结果的过程称为*推理*或*前向传播*（这有助于想象网络从左到右水平展开）。数据流是顺序发生的：第一个隐藏层处理输入值。其输出成为第二个隐藏层的输入，依此类推，直到我们到达输出层的末端（*非顺序*架构可能有不同的执行路径）。\n\
  \n\n\n### 反向传播\n\n现在你已经知道如何产生输出，你需要一种方法来训练网络以生成*准确*的输出。这通过*反向传播*（也称为*反向传播算法*）来实现。反向传播的直观逻辑如下。\n\
  \n1.  网络中的每个神经元都以半随机值初始化，因此它们对数据一无所知，处于空白状态。\n\n2.  给定一个输入，你计算其对应的输出。由于网络从未见过这些数据，这个输出很可能是错误的。\n\
  \n3.  然后你计算误差（例如，对于回归问题，当前输出减去期望输出），并回到每一层，说：“在当前状态下，你产生了这个误差。尝试更新你的状态，使误差减小。” 这个更新过程因神经元类型而异。\n\
  \n4.  通过对每个输入样本重复此过程，情况应该会改善。然而，每个输入只展示一次可能不足以让网络正常工作（尤其是当存在许多神经元，其相互作用可能产生级联效应时）。因此，这个过程会重复多次（称为*轮次*）。通常，网络越大，达到良好效果所需的轮次就越多。\n\
  \n这是对神经网络工作原理的非常宽泛的描述。每种特定类型的神经元都有不同的前向和反向（更新）逻辑。让我们探索最常见的神经元和架构。\n\n## 多层感知机\n\n\
  顾名思义，多层感知机（MLP）——也称为*全连接网络*——由许多层*感知机*组成。感知机是一种受人类脑细胞启发的（简化）数学表示（见图 8-3）。\n\n![](img/619308_1_En_8_Fig3_HTML.jpg)\n\
  \n图示说明了一个神经网络模型。输入 \\(1, x_1, x_2, \\ldots, x_m\\) 通过权重 \\(w_0, w_1, w_2, \\ldots,\
  \ w_m\\) 连接到求和节点 \\(\\Sigma\\)。求和结果通过一个非线性激活函数，产生输出 \\(\\hat{y}\\)。下方显示了公式 \\(\\\
  hat{y} = g\\left(w_0 + \\sum_{i=1}^{m} x_i w_i\\right)\\)，表示输入、偏置和非线性激活函数的线性组合。标签包括：输入、权重、求和、非线性和输出。\n\
  \n图 8-3\n\n感知机神经元示意图\n\n简单来说，脑细胞（也称为*神经元*）通过不同强度的连接（*突触*）接收来自其他神经元的信号并进行处理。如果结果超过某个阈值，它们就会产生输出信号（*动作电位*）。1957\
  \ 年，心理学家弗兰克·罗森布拉特 [2] 直觉地想到以简化形式将这种机制复制到电子设备中。今天，感知机的基本原理保持不变。\n\n*   感知机接收来自*外部世界*（例如传感器）或其他神经元的\
  \ *n* 个输入。\n*   每个输入都有一个关联的*权重*。感知机内部的处理包括权重与输入的点积，再加上一个偏移量（称为*偏置*）。\n*   为了模拟动作电位的激发，点积的结果会经过一个*激活函数*，该函数向模型引入非线性。\n\
  \n感知机最重要的元素可能是激活函数。没有它，整个模型无论有多少神经元都将是线性的。通过在每个神经元处引入非线性，模型能够学习更复杂的关系。最常见的激活函数是*修正线性单元*（ReLU），它将所有负值截断为\
  \ 0，如下公式所述。\n\n![$$ ReLU(x)=\\mathit{\\max}\\left(0,x\\right) $$](img/619308_1_En_8_Chapter_TeX_Equa.png)\n\
  \nMLP 的*多层*部分是通过将感知机组一层接一层地堆叠在一个非常规整的拓扑结构中实现的，其中一层的每个神经元都与下一层的每个神经元相连（因此是全连接的，如图\
  \ 8-4 所示）。\n\n![](img/619308_1_En_8_Fig4_HTML.jpg)\n\n具有五层的神经网络示意图。第一层有六个蓝色节点，代表输入层。第二层和第三层各有五个黄色节点，表示隐藏层。第四层有四个紫色节点，第五层有三个绿色节点，代表输出层。每个节点都与相邻层的节点相互连接，说明了数据在网络中的流动。\n\
  \n图 8-4\n\n全连接拓扑\n\n现在，让我们快速举例探讨层数和神经元数量如何影响总权重数。假设我们有一个网络，有十个输入、三个输出，以及三个隐藏层，分别有\
  \ 8、16 和 24 个神经元。你可以轻松计算出构成该网络的总权重数。\n\n*   第一个隐藏层接收 10 个输入，因此每个感知机有 10 个权重 + 1\
  \ 个偏置。有 8 个感知机，所以有 8 * 11 = 88 个权重。\n*   第二个隐藏层接收 8 个输入，因此有 16 * (8 + 1) = 144 个权重。\n\
  *   第三个隐藏层接收 16 个输入，因此有 24 * (16 + 1) = 408 个权重。\n*   输出层接收 24 个输入，有三个神经元，因此有 3\
  \ * (24 + 1) = 75 个权重。\n\n总权重数 = 88 + 144 + 408 + 75 = 715`。\n\n如你所见，随着层数和每层内神经元数量的增加，权重数会迅速增长并累积。你很容易就能找到隐藏层有\
  \ 64 或 128 个神经元的网络，每个隐藏层会产生数千个权重。在你的台式电脑上运行时这可能不是问题，但*它很容易占满微控制器上的可用 RAM*。在为你的项目尝试全连接拓扑时，请务必记住这一点！\n\
  \n作为一个伴随的缺点，同样明显的是，*权重越多*，CPU 必须执行的计算就越多，因此在你的慢速嵌入式硬件上*产生结果所需的时间就越长*。\n\n\n\n###\
  \ 如何训练多层感知机\n\n既然你已经了解了 MLP 的构成，现在是时候在 Python 中创建并训练一个了。由于全连接网络在处理表格数据时表现良好，我们使用一个名为鸢尾花（Iris）[3]的玩具数据集，该数据集通过鸢尾花的萼片和花瓣的宽度与长度来对其种类进行分类（见图\
  \ 8-5）。\n\n![](img/619308_1_En_8_Fig5_HTML.jpg)\n\n三张鸢尾花图片并排展示。第一张图片标注为“杂色鸢尾”，其部分被标注为“花瓣”和“萼片”。第二张图片标注为“山鸢尾”，第三张标注为“维吉尼亚鸢尾”。每朵花都是紫色的，具有不同的形状和特征，背景为绿色。\n\
  \n图 8-5\n\n鸢尾花数据集样本\n\n这是一个非常容易分类的玩具数据集。使用随机森林分类器，无需预处理即可达到 95%或更高的准确率。代码清单 8-1\
  \ 介绍了`MLP`类，并解释了如何添加层、训练网络以及获取分类报告。图 8-6 展示了网络的损失和准确率。\n\n![](img/619308_1_En_8_Fig6_HTML.jpg)\n\
  \n一张标题为“模型损失”的折线图，展示了 30 个训练周期内的训练损失和准确率。蓝色线条代表训练损失，先急剧下降，后逐渐趋于平缓。橙色线条代表准确率，保持相对稳定，略有波动。一条红色水平线标记了损失轴上值为\
  \ 1 的常数。x 轴标注为“训练周期”，y 轴标注为“损失”。\n\n图 8-6\n\nMLP 损失与准确率图\n\n```\nfrom tinyml4all.tensorflow\
  \ import MLP\nfrom tinyml4all.tensorflow.layers import Perceptron\nfrom tinyml4all.datasets\
  \ import Iris\n# Iris 是 tinyml4all.tabular.classification.Table 的一个实例\nprint(Iris)\n\
  # 为鸢尾花数据集实例化一个新网络\nmlp = MLP()\n# 8, 16, 24 是每层感知器的数量\nmlp.add(Perceptron(8))\n\
  mlp.add(Perceptron(16))\nmlp.add(Perceptron(24))\n# 显示网络架构\n# X 是输入数据\n# Y 是标签\n\
  # task 可以是 \"classification\" 或 \"regression\"\nprint(mlp.compile(X=Iris.numeric,\
  \ Y=Iris.targets.values, task=\"classification\"))\nModel: \"sequential\"\n_______________________________________________________________\n\
  Layer (type)                Output Shape              Param #\n===============================================================\n\
  dense (Dense)               (None, 8)                 40\ndense_1 (Dense)      \
  \       (None, 16)                144\ndense_2 (Dense)             (None, 24)  \
  \              408\ndense_3 (Dense)             (None, 3)                 75\n===============================================================\n\
  Total params: 667 (2.61 KB)\nTrainable params: 667 (2.61 KB)\nNon-trainable params:\
  \ 0 (0.00 Byte)\n_______________________________________________________________\n\
  # 训练神经网络并显示准确率图\nmlp.fit(X=Iris.numeric, Y=Iris.targets.values, epochs=50, plot=True)\n\
  # 打印训练集/验证集上的准确率\nmlp.classification_report()\nprecision    recall  f1-score   support\n\
  setosa       1.00      1.00      1.00        50\nversicolor       1.00      0.92\
  \      0.96        50\nvirginica       0.93      1.00      0.96        50\naccuracy\
  \                           0.97       150\nmacro avg       0.98      0.97     \
  \ 0.97       150\nweighted avg       0.98      0.97      0.97       150\n+-------------------+--------+------------+-----------+\n\
  | True vs Predicted  | setosa  | versicolor  | virginica  |\n+-------------------+--------+------------+-----------+\n\
  |       setosa       |   50   |     0      |     0      |\n|     versicolor    \
  \ |   0    |     46     |     4      |\n|     virginica      |   0    |     0  \
  \    |     50     |\n+-------------------+--------+------------+-----------+\n代码清单\
  \ 8-1\n在鸢尾花玩具数据集上训练 MLP\n```\n\n提示\n\n如果你之前使用过 TensorFlow，可能会觉得代码中的类名令人失望。选择这些名称是为了与本书中的文本保持一致，但它们只是内置层的别名。`Perceptron`与`dense`一一对应，`MLP`与`sequential`一一对应。\n\
  \n我想让你注意一件事：我们添加了三个感知器层（分别有 8、16 和 24 个神经元），但网络转储显示多了一个包含三个神经元的密集层。这是为什么？本章展示的所有架构（MLP、RNN、CNN1D\
  \ 和 CNN2D）在构建最终模型之前都会对层进行一些操作。在这种情况下，`MLP`类注入了一个最终层，其神经元数量与类别数量相同（三个，分别对应*山鸢尾*、*维吉尼亚鸢尾*和*杂色鸢尾*），并使用了*softmax*激活函数[4]，该函数生成类别归属概率。\n\
  \n网络的输出并非你可能期望的单个值（指示预测类别），而是一个取值范围从 0 到 1 的向量（概率），每个类别对应一个值。如果你需要单个输出，可以选择概率最高的类别。这种方案允许更细粒度的输出处理，因为如果置信度低于给定阈值，你可以引入一个*不确定*的元类别（就像\
  \ Edge Impulse 在其模型测试页面中所做的那样）。\n\n提示\n\n如果你之前使用过 TensorFlow，可能已经注意到你无需定义损失函数或评估指标：这些都由`task=`\"\
  `classification`\"自动处理。如果你想完全控制`compile()`的参数，你仍然可以提供它们，并且它们会优先于默认值。\n\n#### 内置验证\n\
  \n为了有效训练神经网络，你需要一个验证集。因此，当你调用`fit()`时，会自动在训练集和验证集之间进行划分。默认情况下，80%用于训练，20%用于验证。\n\
  \n如果你愿意，可以手动更改验证比例。\n\n```\n# 使用 30%的数据作为验证集\nmlp.fit(X=Iris.numeric, Y=Iris.targets.values,\
  \ validation_data=0.3, epochs=50, plot=True)\n```\n\n即使不推荐，你也可以完全禁用验证。\n\n```\n\
  mlp.fit(X=Iris.numeric, Y=Iris.targets.values, validation_data=0, epochs=50, plot=True)\n\
  ```\n\n测试集不会自动创建。你可以使用`test_data`参数强制生成测试集划分。\n\n```\n# 使用 20%的数据作为测试集\nmlp.fit(X=Iris.numeric,\
  \ Y=Iris.targets.values, test_data=0.2, epochs=50, plot=True)\n```\n\n或者，如果你有外部定义的测试数据集（例如，从另一个\
  \ CSV 文件加载），你可以使用它来代替。\n\n```\n# 设置外部测试数据集\ntest_dataset = Table.read_csv(\"test_dataset.csv\"\
  )\nX_train = Iris.numeric\nY_train = Iris.targets.values\nX_test = test_dataset.numeric\n\
  Y_test = test_dataset.targets.values\nmlp.fit(X_train, Y_train, test_data=(X_test,\
  \ Y_test), epochs=50, plot=True)\n```\n\n注意\n\n如果在拟合时定义了测试集，评估指标和图表将使用测试集而非验证集。\n\
  \n\n\n### 如何部署多层感知机\n\n要将 MLP 转换为兼容 Arduino 的 C++代码，只需运行以下命令。\n\n```\nmlp.convert_to(\"\
  c++\", save_to=\"IrisMLP.h\")\n```\n\n生成的代码封装了在微控制器上运行 TensorFlow 所需的所有复杂部分，并提供了一个极其简单的\
  \ API（参见清单 8-2）。示例的输出如图 8-7 所示。\n\n![](img/619308_1_En_8_Fig7_HTML.jpg)\n\n一个显示\
  \ TensorFlow MLP 演示输出的终端窗口。第一个预测显示类别“setosa”，置信度为 0.95，setosa、virginica 和 versicolor\
  \ 的得分分别为 0.95、0.03 和 0.02。第二个预测显示类别“virginica”，置信度为 0.98，setosa、virginica 和 versicolor\
  \ 的得分分别为 0.0、0.98 和 0.02。可见“自动滚动”和“显示时间戳”选项，以及“换行”和“清除输出”控件。\n\n图 8-7\n\nMLP 输出示例\n\
  \n```\n#include \"./IrisMLP.h\"\n// ARENA 是为模型预留的内存量。\n// 更大的模型需要更多内存，但没有\n// 计算最优值的公式，\n\
  // 这是一个试错过程\n#define ARENA 20000\ntinyml4all::MLP mlp;\nfloat setosa[] = {5.1, 3.5,\
  \ 1.4, 0.2};\nfloat virginica[] = {7.6, 3.0, 6.6, 2.1};\nfloat versicolor[] = {6.8,\
  \ 2.8, 4.8, 1.4};\nvoid setup() {\nSerial.begin(115200);\nwhile (!Serial);\nSerial.println(\"\
  TensorFlow MLP 演示\");\n// 初始化网络\nmlp.begin();\n}\nvoid loop() {\n// 在给定样本上运行网络\n\
  if (!mlp.predict(setosa)) {\nSerial.println(mlp.error());\nreturn;\n}\n// mlp.label\
  \ 保存预测类别的名称\n// mlp.idx 保存预测类别的数字 ID\n// mlp.value 保存数值输出（仅用于回归任务）\n// mlp.confidence\
  \ 是预测的概率\n//             （范围从 0 到 1）\n// mlp.confidences 是一个数组，包含所有类别的置信度\n//  \
  \        （分类任务中每个类别一个）\n// mlp.outputsAsString 返回每个类别的得分，范围\n//                \
  \ 从 0 到 1（仅用于分类）\nSerial.print(\"预测类别 \");\nSerial.print(mlp.label);\nSerial.print(\"\
  \ 置信度 \");\nSerial.println(mlp.confidence);\nSerial.print(\" > 得分: \");\nSerial.println(mlp.outputsAsString());\n\
  delay(1000);\n}\n清单 8-2\n在 Arduino 上运行 MLP\n```\n\n注意\n\n感知机是一种无处不在的算子。在几乎所有的网络拓扑结构中，它都作为专用算子（如\
  \ LSTM、卷积）与输出层之间的粘合剂出现，通常位于最终层。你会在本章讨论的所有其他类型的网络中找到它。\n\n## 深度学习\n\n第 4 章和第 5 章将时间序列分类视为一个两步过程：（1）从时间序列中提取有意义的特征（使用傅里叶变换或时域描述符），以及（2）使用*表格型*分类器（Edge\
  \ Impulse 上的全连接网络，Python 中的随机森林）对这些特征进行分类。\n\n近年来，随着深度学习技术的普及和易用性提升，另一种方法变得广泛流行：将特征提取嵌入到执行分类的同一个神经网络中。从这个意义上说，存在一个重要的范式转变。以前，我们手动定义*我们认为*可能构成良好特征向量的内容。现在，我们委托机器学习/深度学习模型，通过输入数据集上的训练过程来构建最佳特征。根据数据集和网络类型的不同，这种方法可以比我们手动工作获得更好的准确性。\n\
  \n### 深度学习在 TinyML 环境中的劣势\n\n当然，凡事有利有弊：为了具有如此强的表达能力，网络的规模和复杂性必须增长。在第 4 章中训练的全连接网络仅由两层组成，每层只有几个神经元（因为繁重的工作集中在频谱分析步骤）。这种简单的拓扑结构旨在处理经过大量处理的输入数据，它绝不可能在原始加速度计样本上良好运行。在资源极度受限的\
  \ TinyML 环境中，我们的开发板能否运行一个独立完成所有工作（特征提取+分类）的网络并非必然，因此，根据我们的具体用例仔细评估采用哪种方法，是我们的职责。\n\
  \n话虽如此，为了能够在嵌入式硬件上运行越来越大的模型，已经采用了许多优化措施，因此我们通常可以选择。此外，深度学习使得在我们廉价、节能的硬件上运行复杂的任务成为可能，而仅使用手动特征是不可能实现这些任务的。\n\
  \n接下来，让我们考察两种属于深度学习范畴的网络：循环神经网络和卷积神经网络。\n\n## 循环神经网络与长短期记忆网络\n\n循环神经网络（RNN）具有最适合处理序列数据的特定拓扑结构。它们已成功应用于语言翻译、语音合成、视频分析，以及对我们最重要的时间序列分类。\n\
  \n它们与“常规”网络（例如全连接网络）的不同之处在于，隐藏神经元具有*记忆*。这意味着当新输入到达时，神经元会利用其内部状态来计算输出，然后根据输入和输出更新该状态（*除了*全连接网络和卷积网络传统的权重之外！）。\n\
  \n长短期记忆（LSTM）单元是 RNN 中使用最广泛的神经元类型，因为它们性能卓越。它们被引入是为了解决学习步骤中的技术问题，这些问题曾阻止网络在长时间输入上取得令人满意的结果（梯度消失和梯度爆炸）。在不深入实现细节的情况下，以下是这些神经元工作原理的快速概述。\n\
  \n1.  每个 LSTM 单元都有一个内部状态（类似于感知机中的权重）和一个*记忆状态*（另一组权重）。\n\n2.  当接收到新输入时，它通过结合输入向量和内部状态来计算一个*遗忘向量*。接近\
  \ 0 的值表示记忆状态中对应的元素应该被遗忘；接近 1 的值表示该元素应该被保留。\n\n3.  它还计算一个*候选向量*，该向量指示如何基于新输入更新记忆状态。新的记忆状态被计算为旧状态、遗忘向量和候选向量的加权和。\n\
  \n4.  最终，记忆状态和输入被用来更新内部状态，内部状态在通过激活函数后产生输出。\n\n图 8-8 是 LSTM 单元内部状态的示意图。\n\n![](img/619308_1_En_8_Fig8_HTML.jpg)\n\
  \n长短期记忆（LSTM）单元架构图。它展示了信息通过各种门控的流动：遗忘门（F_t）、输入门（I_t）和输出门（O_t），每个门控都有一个 sigma（σ）激活函数。候选记忆（C̃_t）使用\
  \ tanh 激活函数。单元状态（C_t）和隐藏状态（H_t）通过这些门控进行更新。输入包括先前的记忆（C_{t-1}）、隐藏状态（H_{t-1}）和当前输入（X_t）。该图说明了这些组件如何交互以处理序列数据。\n\
  \n图 8-8\n\nLSTM 内部结构\n\n\n\n### 如何训练循环 LSTM 神经网络\n\n幸运的是，这一过程对最终用户完全透明，并在后台自动处理。使用\
  \ LSTM 单元创建 RNN 网络可通过清单 8-3 实现。让我们在第 4 章收集的连续运动数据集上训练该网络。验证集上的准确率趋势如图 8-9 所示。\n\n\
