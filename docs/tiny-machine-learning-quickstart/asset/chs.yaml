  # 绘制配对图\ntable.pairplot()\n清单 2-14\n表格数据操作总结\n```\n\n## 特征工程\n\n表格数据的显著特征是每个样本完全独立于其他样本，因此可以单独且孤立地处理（与时间序列/音频数据中每个样本与其相邻样本在*时间上*相关，或图像中每个像素与其他像素在*空间上*相关的情况相比）。\n\
  \n然而，表格数据可以在同一个样本内对不同尺度的值进行分组。考虑一个收集温度、湿度和气压的气象站设备：温度范围可能从 –30°C 到 +50°C，相对湿度始终在\
  \ 0–100 范围内（因为是百分比），而气压在海平面附近约为 100,000 帕斯卡。\n\n对于某些分类器来说，尺度的差异可能无关紧要，但对于许多算法来说，所有值都处于同一数量级是强制性的。某些模型甚至可能要求值位于特定范围内（例如，[–1,\
  \ +1] 或 [0, +1]）。\n\n除了这种*特征缩放*操作之外，表格数据的特征工程步骤致力于转换输入数据，以便机器学习模型能够更好地捕捉底层模式。有许多可用的转换方法。本章涵盖了最常见的方法。你不会在单个项目中同时使用所有这些方法。你必须每次都运用自己的判断力，以理解哪种方法最适合你当前的数据集。\n\
  \n`tinyml4all` Python 包为此任务实现了几个不同的算子。为了使这篇介绍尽可能简洁易懂，我们现在只处理与本项目相关的算子。有关更多算子以及此处介绍的算子的更深入解释，请参阅附录\
  \ A。\n\n\n\n## 特征缩放\n\n特征缩放，有时也称为归一化，是一种将每个特征的值域映射到新值域的变换。你可能需要执行此操作，因为机器学习算法要求（或在相同尺度下的数据上表现更好），或者为了更容易比较不同尺度的特征（如气象站的例子）。\n\
  \n根据缩放因子的应用方式，不同形式的特征缩放可分为两类。\n\n*   **基于实例的缩放**仅使用当前样本的数据来实现映射。\n\n*   **基于总体的缩放**首先扫描整个数据集以计算一组统计量（例如，最小值、最大值、均值、标准差），然后使用这些统计量来缩放每个观测值。\n\
  \n最广泛使用的特征缩放策略可能是*最小-最大归一化*。顾名思义，这种归一化首先计算表格数据集中每一列的最小值和最大值。然后，根据以下最小-最大归一化公式，将每个样本的值映射到\
  \ [0, 1] 区间。\n\n![$$ x\\frac{x-\\mathit{\\min}(x)}{\\mathit{\\max}(x)-\\mathit{\\\
  min}(x)} $$](img/619308_1_En_2_Chapter_TeX_Equa.png)\n\n清单 2-15 展示了如何使用 `tinyml4all`\
  \ 包对表格数据集应用最小-最大归一化。\n\n|   | r | g | b |\n| --- | --- | --- | --- |\n| **count**\
  \ | 150 | 150 | 150 |\n| **mean** | 0.4019 | 0.2333 | 0.2344 |\n| **std** | 0.231\
  \ | 0.1098 | 0.1016 |\n| **min** | 0 | 0 | 0 |\n| **25%** | 0.1887 | 0.1618 | 0.1842\
  \ |\n| **50%** | 0.3962 | 0.2157 | 0.2368 |\n| **75%** | 0.5755 | 0.2941 | 0.2895\
  \ |\n| **max** | 1 | 1 | 1 |\n\n```\nfrom tinyml4all.tabular.features import Scale\n\
  minmax = Scale(method=\"minmax\")\ntable 2 = minmax(table)\nListing 2-15\nApply\
  \ Min-Max Normalization to Table\n```\n\n检查输出，你可以看到每一列现在都落在 [0, 1] 区间内（最小值和最大值行），无论它们原始的值域如何。\n\
  \n最小-最大归一化的缺点之一是它对*异常值敏感*。考虑以下值列表，其中 1000 是异常值。\n\n```\n0, 20, 21, 22, 23, 24, 25,\
  \ 1000\n```\n\n经过最小-最大归一化后，列表变为\n\n```\n0, 0.02, 0.021, 0.022, 0.023, 0.024, 0.025,\
  \ 1\n```\n\n即使大部分数据在值 20 附近浮动，异常值的存在也会导致感兴趣范围的“压缩”。如果没有异常值，归一化后的序列将会是：\n\n```\n\
  0, 0.8, 0.84, 0.88, 0.92, 0.96, 1\n```\n\n它的扩散因子要高得多。因此，在应用最小-最大归一化之前，请注意异常值。\n\n\
  注意\n\n最小-最大归一化对异常值敏感！\n\n### 如何识别异常值\n\n如何识别异常值？这就像查看表格摘要一样简单。观察每一列的值从最小值到最大值的变化情况。如果每两行之间的差值大致相同，那么你的数据是均匀分布的。但如果最小值与\
  \ 25% 分位数或 75% 分位数与最大值之间的差值远大于平均值，那么你的列很可能包含异常值。\n\n```\ncolumn_with_outliers\n\
