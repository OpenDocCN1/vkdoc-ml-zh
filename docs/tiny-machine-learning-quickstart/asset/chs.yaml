  数据加载完成后，你可以对其进行绘图。\n\n## 绘制回归数据\n\n在回归的语境下，彩色散点图和配对图（如上一章所见）是没有意义的。它们旨在基于类别归属来可视化数据聚类。然而，回归没有类别这种东西；取而代之的是连续输出。\n\
