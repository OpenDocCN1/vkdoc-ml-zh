  \n### 如何部署一维 CNN\n\n事实证明，在你的 Arduino 草图中运行一维 CNN 与运行 LSTM 网络是相同的。由于它们都处理时间序列，之前适用于\
  \ LSTM 的一切仍然成立。并且由于生成的 API 是相同的，你无需更改任何内容——只需将 `tinyml4all::LSTM` 重命名为 `tinyml4all::CNN1D`\
  \ 即可。\n\n\n\n## 二维卷积神经网络\n\n二维卷积神经网络（2D CNN）处理的是二维数据。二维数据通常指图像。或者，为了拓宽 CNN 的应用范围：*类图像*数据。所谓*类图像*数据，是指排列在二维空间中、且数值限定在特定范围内的数据。\n\
  \n*   **MFCC 特征**：从第 6 章的 Edge Impulse 中提取的特征。像素代表的是随时间变化的频率贡献，而非空间上的光线强度。\n\n*\
  \   **脑电图/肌电图/加速度计数据**：任何随时间收集的*n*维数据都可以重塑为二维窗口（形状为特征数量乘以时间步长）。\n\n*   **温度/距离图**：热成像摄像头（例如\
  \ MLX90640）和网格飞行时间传感器（例如 VL53L5CX）会生成二维输出，其中每个元素代表温度或距离，而非光线。\n\n如果我们抽象化像素的概念，使其涵盖所有类型的数据——而不仅仅是光线——那么所有这些数据都可以渲染成图像，从而成为二维\
  \ CNN 的合适输入。\n\nConv2D 算子背后的直觉是，二维数据在*空间上*是相关的，每个像素与其相邻像素共享一种关系（称为*局部感受野*）。很多时候，这个感受野是一个\
  \ 3×3 或 5×5 的网格。这种关系被编码在 Conv2D 算子的权重（称为*卷积核*）中，并从输入数据集中学习得到。网络可以通过堆叠多个卷积核来学习许多不同的模式（例如，边缘、角点、纹理）。与全连接网络相比，权重的数量大幅减少，更重要的是，这种减少与输入/输出的数量无关。一个形状为\
  \ 3×3 的 Conv2D 算子始终只存储九个权重，无论它应用于 96×96 还是 512×512 的图像。\n\n### 下采样与步长\n\nConv2D\
  \ 层通常放在 CNN 的开头。它们的工作是从图像中提取特征，后续的感知器再聚合这些特征以产生网络的输出。正如相关段落所述，感知器的权重数量随输入数量线性增长。由于图像是非常“密集”的数据类型，通常由数千个像素组成，这在内存、计算时间和精度方面都带来了问题。\n\
  \n让我们考虑一张 128×128 的图像和一个包含 16 个卷积核的 Conv2D 层。这将产生 128 × 128 × 16 = 262,144 个输出。如果在其后堆叠一个包含\
  \ 32 个神经元的全连接层，我们最终会得到约 800 万个权重。然后我们还需要一个输出层，对吧？如果有十个类别，我们还需要 8000 万个权重！希望你能看出这很快就会变成一个难以处理的问题。为了应对这种情况，每个\
  \ CNN 都包含一种*降尺度*策略：图像在网络中越深入，其尺寸就越小。在许多实际架构中，最后一个 Conv2D 层的输出已从 128×128 缩小到 16×16。这种降尺度还带来了其他一些好处。\n\
  \n*   **允许在更深层使用更多卷积核。** 随着层数的深入，提取的特征也越复杂。如果第一层可以提取边缘和角点，那么最后一层通常学会识别形状和简单物体。在更深层拥有更多卷积核意味着可以学习许多不同的形状，这些形状应与预期输出高度相关。\n\
  \n*   **减轻过拟合。** 减少输入数量是防止过拟合的有效方法。\n\n*   **提供平移不变性/噪声抑制。** 通过聚合局部特征，数据中的微小变化被平滑掉，整体特征提取对像素噪声或物体的微小平移不那么敏感。\n\
  \n在 CNN 中实现下采样有两种方法：池化和步长。\n\n#### 池化\n\n池化层紧跟在 Conv2D 层之后堆叠，用于对其输出进行下采样。它的工作是将\
  \ Conv2D 输出的小区域（通常是 2×2）聚合成单个值：此操作有效地将输出图像尺寸减半。最常用的聚合算子是*最大值*，但也可以计算每个块的平均值（见图 8-13）。\n\
  \n![](img/619308_1_En_8_Fig13_HTML.jpg)\n\n一个示意图，展示了在 4x4 数字网格上进行的 2x2 最大池化操作。原始网格包含的值：第一行\
  \ 12, 20, 30, 0；第二行 8, 12, 2, 0；第三行 34, 70, 37, 4；第四行 112, 100, 25, 12。应用最大池化后，得到的\
  \ 2x2 网格显示了每个 2x2 区域的最大值：第一行 20, 30；第二行 112, 37。一个标有“2 x 2 最大池化”的箭头从原始网格指向结果网格。\n\
  \n图 8-13\n\n最大池化算子\n\n在分类任务中，最大池化是首选，因为它能突出最显著的特征，在检测清晰锐利特征（如边缘）至关重要的任务中，通常能带来更好的性能。\n\
  \n#### 步长\n\n第二种降尺度方法是增加 Conv2D 算子本身的*步长*。步长表示卷积核在图像上移动的幅度。默认情况下为 1，但这并非强制。例如，你可以将步长设置为等于卷积核大小，此时卷积发生在不重叠的块上（不要这样做，这只是一个例子！）。\n\
  \n将步长设置为 2 可以有效地将输出图像尺寸减半（见图 8-14）。\n\n![](img/619308_1_En_8_Fig14_HTML.jpg)\n\n\
  示意图展示了图像处理中的卷积操作。一个 7x7 的输入网格包含二进制值，其中高亮显示了一个 3x3 的图像块。该块与一个值为 1 到 9 的 3x3 卷积核滤波器相乘。结果是一个\
  \ 3x3 的输出网格，第一个值计算为 31。该过程演示了如何使用局部感受野和卷积核将输入数据转换为输出。\n\n图 8-14\n\n步长的工作原理\n\n表\
  \ 8-1 总结了最大池化和步长为 2 之间的区别。\n\n表 8-1\n\n池化与步长对比\n\n| 标准 | 最大池化 | 步长为 2 的卷积 |\n| ---\
  \ | --- | --- |\n| **主要优势** | 保留最强特征（最大值）通常性能优于步长 | 训练期间卷积核权重“感知”下采样过程 |\n| **信息保留**\
  \ | 激进地减少数据（可能丢失信息） | 保留更多细微信息（更平滑） |\n| **噪声鲁棒性** | 对噪声更鲁棒（聚焦于最大值） | 可能对噪声或细微偏移更敏感\
  \ |\n| **计算成本** | 需要步长`=`1 的卷积，因此计算量更大 | 计算量仅为步长=1 时的 1/4 |\n| **理想用例** | 强调锐利、突出的特征\
  \ | 逐步下采样，同时保留更多信息 |\n\n在 TinyML 的背景下，我们必须精打细算每一次计算和内存分配，步长相比池化具有以下优势。\n\n*   它沿两个轴所需的计算量减半，使其比全卷积快四倍。\n\
  \n*   它直接生成半尺寸图像，因此存储中间结果所需的内存更少。\n\n\n\n### 如何训练二维卷积神经网络\n\n让我们训练一个二维卷积神经网络，用于对包含猫狗图像的玩具数据集进行分类（列表\
  \ 8-6）。该数据集包含在 *tinyml4all* 包中，共有 100 张图像（每个类别 50 张）。图像尺寸为 128×128，采用 RGB 模式。图 8-15\
  \ 展示了数据集中的一些随机图像。\n\n![](img/619308_1_En_8_Fig15_HTML.jpg)\n\n一张由八张猫狗图像组成的拼贴画。第一行：一只棕白相间狗的特写，一只在田野里的长毛狗，一只坐在沙发上的虎斑猫，以及一只裹着彩色毯子的虎斑猫。第二行：一只在花园中奔跑的狗，一只在草地上奔跑的金毛猎犬，一只坐在灰色背景前的虎斑猫，以及一只在沙发上慵懒躺着的虎斑猫。每只动物都以写实风格呈现。\n\
  \n图 8-15\n\n猫狗示例\n\n注意\n\n这是图像分类，而非目标检测！模型无法定位图像中狗或猫的具体位置。它只能判断图像中呈现的是狗还是猫。\n\n\
  ![](img/619308_1_En_8_Fig16_HTML.jpg)\n\n折线图标题为“模型损失”，展示了 30 个训练周期内的训练损失和准确率。蓝色线条代表训练损失，起始值较高并稳步下降，表明模型性能在提升。橙色线条代表准确率，始终接近\
  \ 1.0，表明在整个训练周期中准确率保持稳定。\n\n图 8-16\n\n二维卷积神经网络的损失与准确率\n\n```\nfrom tinyml4all.tensorflow\
  \ import CNN2D\nfrom tinyml4all.tensorflow.layers import Conv2D, MaxPooling2D, Perceptron\n\
  from tinyml4all.datasets import Pets\ncnn = CNN2D(input_shape=(48, 48))\n# 卷积层 +\
  \ 最大池化层示例\n# 8 是卷积核的数量\ncnn.add(Conv2D(8, kernel_size=3))\ncnn.add(MaxPooling2D())\n\
  # 带步长的卷积层示例\ncnn.add(Conv2D(16, kernel_size=3, strides=2))\n# 步长与最大池化\n# （结果尺寸变为原来的\
  \ 1/4）\ncnn.add(Conv2D(24, kernel_size=3, strides=2))\ncnn.add(MaxPooling2D())\n\
  # 输出层前的全连接层\ncnn.add(Perceptron(32))\n# 显示网络架构\nprint(nn.compile(Pets.X, Pets.Y))\n\
