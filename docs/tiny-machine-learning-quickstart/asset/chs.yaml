  清单 2-22\n为表格对象创建分类流水线\n```\n\n当你第一次在表格上调用链时，它会遍历每个步骤并对其进行拟合（以学习其内部参数）。在初始训练阶段之后，你可以将其应用于任何其他表格：此时，链会记住其参数。它仅对新表格应用相应的转换（参见清单\
  \ 2-23）。\n\n```\ntable1 = Table.read_csv(\"dataset_1.csv\")\ntable2 = Table.read_csv(\"\
  dataset_2.csv\")\nchain = Chain(\nScale(\"minmax\"),\nRandomForest()\n)\n# 在 table1\
  \ 上训练链\nchain(table1)\n# 将链应用于 table2\n# 这将使用在 table1 上学到的参数\n# 例如，使用 table1 的最小值/最大值\n\
  table2_classified = chain(table2)\n清单 2-23\n将分类流水线应用于新数据集\n```\n\n## 部署到 Arduino\n\
