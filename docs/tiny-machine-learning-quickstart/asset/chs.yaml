  \ 2\n#define TRIG 3\nusing tinyml4all::printCSV;\ntinyml4all::APDS9960 sensor;\n\
  tinyml4all::Ultrasonic ultrasonic(ECHO, TRIG);\nvoid setup() {\nSerial.begin(115200);\n\
