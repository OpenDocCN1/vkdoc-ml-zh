  训练用于图像分类的二维卷积神经网络\n```\n\n#### 如何部署二维卷积神经网络\n\n要运行二维卷积神经网络，你需要一个二维输入。这可以是一张图像、随时间变化的传感器数值，或多点传感器读数。不过，在这种情况下，最重要的是\
  \ TensorFlow 运行时*期望一维输入数据*，即使它代表的是二维实体。因此，你必须首先*展平*你的输入，并以*数组*而非矩阵的形式提供。以下是常见数据类型展平技术的示例。\n\
  \n*   **图像**：灰度图像的预期输入格式是*行优先*（第一行的像素，第二行的像素，依此类推）。对于 RGB 图像，格式为 R[1], G[1], B[1],\
  \ R[2], G[2], B[2]，以此类推。灰度情况适用于所有其他类似图像的输入。\n\n*   **随时间变化的传感器**：预期输入格式是*时间优先*（传感器\
  \ A[t=1], 传感器 B[t=1], 传感器 A[t=2], 传感器 B[t=2]）。\n\n基于这些假设，列表 8-7 在一张 48×48 的灰度图像上运行了一个二维卷积神经网络，该图像存储为展平的\
  \ `uint8_t` 数组（类似于你从 ESP32 或 Nicla Vision 摄像头获取的数据）。\n\n```\n#include \"./PetsCNN2D.h\"\
  \n// ARENA 是为模型预留的内存量\n// 更大的模型需要更多内存，但没有\n// 计算最优值的公式\n// 这是一个试错过程\n#define ARENA\
  \ 20000\ntinyml4all::CNN2D cnn;\nuint8_t dog[48*48] = {…};\nuint8_t cat[48*48] =\
  \ {…};\nvoid setup() {\nSerial.begin(115200);\nwhile (!Serial);\nSerial.println(\"\
  TensorFlow 二维卷积神经网络演示\");\ncnn.begin();\n}\nvoid loop() {\n// 对狗图像进行分类\nif (!cnn.predict(dog))\
  \ {\nSerial.println(nn.error());\nreturn;\n}\n// .label 保存预测类别的名称\n// .output 保存数值输出（用于回归）\n\
  //         或类别 ID（用于分类）\n// .outputs 是一个包含所有输出的数组\n//          （对于分类，每个类别一个输出）\n\
  // .runtime_ms 保存预测的持续时间\n// outputsAsString 返回每个类别的得分，范围\n//                 从\
  \ 0 到 1（仅限分类）\nSerial.print(\"期望是狗，预测为 \");\nSerial.print(cnn.label);\nSerial.print(\"\
  ，置信度为 \");\nSerial.println(cnn.confidence);\nSerial.print(\" > 得分: \");\nSerial.println(cnn.outputsAsString());\n\
  // 对猫图像进行分类\nif (!cnn.predict(cat)) {\nSerial.println(cnn.error());\nreturn;\n}\n\
  Serial.print(\"期望是猫，预测为 \");\nSerial.print(cnn.label);\nSerial.print(\"，置信度为 \"\
  );\nSerial.println(cnn.confidence);\nSerial.print(\" > 得分: \");\nSerial.println(nn.outputsAsString());\n\
  delay(1000);\n}\n列表 8-7\n在 Arduino 上运行二维卷积神经网络\n```\n\n## 总结\n\n本章是对微控制器 TensorFlow\
  \ 这一高级主题的实践性介绍。该框架允许你释放神经网络的全部潜力，但正如人们所说，“能力越大，责任越大。”调整一个既能达到令人满意的准确率，又能尽可能精简以便在嵌入式硬件上高效部署的网络拓扑结构，可能是一项艰巨的任务。\n\
  \n神经网络有多种形状和规模，在此我尝试展示最常见的配置，以及那些肯定能在兼容 Arduino 的硬件上运行的配置：用于表格数据的全连接网络、用于时间序列的 LSTM\
  \ 和一维卷积神经网络、用于图像（及类似数据）的二维卷积神经网络。由于 TinyML 是一个不断发展的领域，在不久的将来，应该会有更多替代方案可供你添加到工具集中。\n\
  \n即使需要练习，一旦你积累了经验并开始掌握神经网络的技巧，你将能够在你的开发板上运行令人惊讶的具有挑战性的任务，而无需连接外部 PC 或云服务。这将极大地提升你的生产力，并重新定义小型设备所能实现的可能。\n\
