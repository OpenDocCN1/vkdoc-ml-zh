  \n恭喜，你完成了第一个 TinyML 项目！\n\n### 警告\n\n我想提请你注意一个你可能忽略的细节。将你的颜色传感器对准水果以外的物体——比如墙壁或你的桌子。分类器会预测什么？\n\
  \n你可能会惊讶地发现，分类器仍然预测为其中一种水果。你可能期望分类器会检测到它没有指向任何水果并做出相应响应。遗憾的是，它并非如此工作。回想一下，在分类任务中，类别列表是完全已知的，这意味着模型无法检测到它从未见过的类别。\n\
  \n我们仅在水果类别上训练了模型。它没有\"墙壁\"或\"桌子\"的概念，因此它永远不会预测这些。如果我们想教会分类器识别它没有在看任何水果，我们还必须展示这些情况的数据。\n\
  \n注意\n\n分类器只能识别它们在训练期间见过的情况。如果你有\"无感兴趣对象\"（例如，没有水果）的情况，你需要为其收集数据。\n\n## 总结\n\n本章包含了大量新信息。你学习了如何手动或借助自动化工具从微控制器收集数据；然后你了解了可用的特征工程方法，这些方法使你收集的原始数据更易于后续分类，以及构成机器学习领域的众多模型中的（一部分）。最后一步，你能够将执行端到端分类流水线所需的工具从\
  \ Python 转换为高性能的 C++，以便它们可以导入到任何嵌入式项目中。\n\n下一章也侧重于表格数据。鉴于本章涵盖了分类，下一章将深入探讨回归。\n\n\
  \n\n"
- "# 3. 表格数据回归\n\n表格数据回归与表格数据分类所需的许多步骤相同（即数据采集和特征工程）。两者的区别在于数据绘图和算法选择部分。本章通过一个项目来重点展示回归任务所需的工作流程，但会快速掠过第\
  \ 2 章已涵盖的主题。本章的主要焦点是展示回归的特殊性。\n\n引导我们完成本章的项目是一个根据 RGB 颜色分量推断出的*接近度测量仪*。第 2 章已经证明，颜色分量可用于对有色物体进行分类。然而，颜色分量取决于环境光（光照越强，数值越高）。你可以利用这一现象来*估算*传感器与平坦表面之间的距离：你越靠近表面，电路板和你自己的身体投射在其上的阴影就越多，从而降低检测到的强度。任务是建立颜色强度与距离之间的关系模型（见图\
  \ 3-1）。\n\n![](img/619308_1_En_3_Fig1_HTML.jpg)\n\n一只手握着一块小型电子面包板，上面连接着一个传感器和彩色导线。背景中有模糊的灯光。下方，一个电脑屏幕显示着带有微小误差的预测距离：\"\
  57.42 mm (偏差 3 mm)\"，\"65.53 mm (偏差 4 mm)\"，\"73.17 mm (偏差 2 mm)\"，\"93.94 mm (偏差\
  \ 7 mm)\"，\"72.91 mm (偏差 9 mm)\"。\n\n图 3-1\n\n根据 RGB 分量进行距离预测的结果\n\n完成该项目所需的步骤与第\
  \ 2 章中概述的步骤相同。\n\n1.  收集数据（本例中为 RGB + 距离）。\n2.  加载并检查数据，以发现异常值和不良数据，并理解输入与输出之间的关系（如果存在的话！）。\n\
  3.  执行特征工程以提高建模效果。\n4.  为回归任务训练机器学习模型并评估其性能。\n5.  将整个回归流程转换为 C++，并将代码部署到我们的电路板上。\n\
  \n由于许多方面与你处理表格数据时所见到的相同，本章将重点介绍从分类转变为回归时发生变化的部分。\n\n## 所需硬件\n\n与第 2 章一样，你需要一个颜色传感器来重复使用已有的硬件。除此之外，你还需要一个距离传感器。由于这个玩具项目不需要达到毫米级精度，任何距离传感器（超声波、飞行时间、红外等）都能胜任。\n\
  \nArduino Nano BLE Sense 板内置了一个接近传感器（与检测颜色的传感器相同，都是 APDS），但我发现它在近距离（<5 厘米）下工作不佳，因此我更倾向于连接一个外部超声波传感器（见图\
  \ 3-2）。\n\n![](img/619308_1_En_3_Fig2_HTML.jpg)\n\n该图像分为两个部分，分别标注为\"原理图\"和\"实物图\"\
  。左侧显示了一个 Arduino Uno 连接到 HC-SR04 超声波传感器的原理图，用彩色线条表示接线连接。右侧显示了面包板上的实物设置，包含一个 Arduino\
  \ Nano 和同一个超声波传感器，用彩色杜邦线连接。\n\n图 3-2\n\n超声波电路图\n\n超声波距离传感器使用*声波*来测量到物体的距离。它遵循*飞行时间*原理，测量超声波脉冲传播到物体并返回所需的时间。当\
  \ TRIG 引脚被置为高电平时，传感器通过其发射器以 40 kHz 的频率发射超声波；发射的声波在空气中传播，并遇到路径上的物体后反射。传感器的接收器检测到反射波，并在\
  \ ECHO 引脚上向 Arduino 输出一个高电平信号。从触发到回波所测量的时间，通过空气中的声速（大约每秒 343 米），与物体的距离成正比。\n\n##\
  \ 采集数据\n\n让我们利用第 2 章中的 Python 采集脚本来捕获数据。Arduino 程序与颜色采集程序类似，只是增加了距离读取功能。根据你使用的距离传感器，代码可能会略有不同。代码清单\
  \ 3-1 假设你已经将超声波距离传感器（HC-SR04）连接到引脚 4 和 5。\n\n注意\n\n请将 TRIG 和 ECHO 引脚替换为你自己的引脚！\n\
  \n```\nNano\n/**\n* 代码清单 3-1\n* 以 CSV 格式收集 RGB + 距离数据（无人值守）。\n*\n* 所需硬件：Arduino\
