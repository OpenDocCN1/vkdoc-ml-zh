  \ |\n| ‪ | ‪ | ‪ | ‪ |\n| ‪ | ‪ | ‪ | ‪ |\n\n## 特征选择\n\n第 1 章介绍了特征选择的概念。让我们回顾一下它的目标。\n\
  \n*   防止维度灾难\n\n*   丢弃高度相关（冗余）的特征\n\n*   丢弃不能表征类别（无关）的特征\n\n*   用最少的特征达到尽可能高的指标（例如，准确率、F1\
  \ 分数、RMSE）\n\n执行特征选择的最佳方法是从所有特征开始，然后迭代地一次移除一列。如果分类指标几乎保持不变，那么该特征就不太重要。重复此过程，直到无法保持指标不变，这将产生可能的最佳结果。\n\
  \n如果你有少量特征和一个小型数据集，这条路径可能是可行的。但这个过程通常可能耗时过长，你可能对更快、更近似的替代方案感兴趣。\n\n由于本项目只涉及三个输入变量，特征选择在这里用处不大。由于它在后续章节中会派上用场，让我们快速列举一下可用的选项。\n\
  \n\n\n### 序列特征选择\n\n这是一种穷举方法。它会尝试所有列的组合，最终达到最优结果。根据你想要保留的特征比例，可以逐个剔除特征，或者从一个空列表开始逐个添加特征（选择最能提升指标的那个），哪种方式更快就采用哪种。这由\
  \ `direction` 参数指定。使用这种特定方法，你可以手动选择要保留的结果特征数量，或者依赖自动选择机制为你找到最佳数量（参见代码清单 2-16）。\n\
  \n```\nfrom tinyml4all.tabular.features import Select\n# direction = forward 将从\
  \ 0 个特征增长到 n 个特征\n# direction = backward 将从 N 个特征缩减到 n 个特征\nselect = Select(sequential=\"\
  auto\", direction=\"forward\")\ntable2 = select(table)\nprint(table2.head())\nr\n\
  0  38\n1  40\n2  49\n3  65\n4  54\n代码清单 2-16\n应用序列特征选择\n```\n\n使用自动选择机制后发现，仅 Red\
  \ 列就足以获得良好的分类结果。\n\n### 基于分数的特征选择\n\n一种更快的、无需分类器的特征剔除方法基于单变量统计检验。这些检验会为每一列生成一个分数；该分数代表该特征对于分类任务*看起来*有多重要。我使用了“*看起来*”这个术语，因为你无法确定该变量如何影响你之后将要使用的特定分类器，因此你依赖一种统计方法。在这种情况下，你必须手动选择要保留的列数。没有自动设置（参见代码清单\
  \ 2-17）。\n\n```\n# 1 是要选择的列数\nselect = Select(univariate=1)\ntable2 = select(table)\n\
  print(table2.head())\nr\n0  38\n1  40\n2  49\n3  65\n4  54\n代码清单 2-17\n应用单变量特征选择\n\
  ```\n\n同样，单变量检验也选择了 Red 列。然而，并非每个数据集都如此。\n\n### 递归特征消除 (RFE)\n\nRFE 可以被看作是序列特征选择的一个更快版本。同样，它需要一个分类器来决定递归地剔除哪些特征。该分类器必须满足一个要求：它必须能生成特征重要性分数（并非所有分类器都能做到）。这个分数用于选择对分类结果贡献最小的列。这个过程会递归重复，直到达到所需的特征数量（代码清单\
  \ 2-18）。\n\n```\n# 1 是要选择的列数\nselect = Select(rfe=1)\ntable2 = select(table)\nprint(table2.head())\n\
  r\n0  38\n1  40\n2  49\n3  65\n4  54\n代码清单 2-18\n应用递归特征消除\n```\n\n表 2-2 列出了一些指导原则，你可以参考这些原则来决定在你的特定项目中使用上述哪种方法。\n\
  \n表 2-2\n\n选择最佳特征选择方法的指导原则\n\n|   | 优点 | 缺点 |\n| --- | --- | --- |\n| **单变量** |\
  \ 快速；推荐在开发早期阶段使用 | 不能保证得到最优选择 |\n| **递归** | 比序列方法快；可能收敛到最优解；在中等规模数据集上优于单变量方法 | 在大型数据集上，使用某些分类器时可能会变慢\
  \ |\n| **序列** | 可能收敛到最优解 | 在大型数据集上，使用某些分类器时可能会变慢 |\n\n注意\n\n你也可以使用 `Select(include=[\"\
  r\", \"b\"])` 手动选择要保留的列，或使用 `Select(exclude=[\"g\"])` 手动选择要剔除的列。\n\n回到我们的水果分类项目：让我们考虑哪些特征工程方法看起来最合适。\n\
  \n*   只有三个特征，因此特征选择价值不大。\n*   所有特征都是连续的，离散化意义不大。（我们可以选择应用分箱，但在这种情况下价值不大）。\n*   特征缩放对某些分类器有益（并且没有任何异常值）。\n\
  \n基于这些要点，我们现在只实现最小-最大归一化（参见代码清单 2-19）。\n\n```\nfrom tinyml4all.tabular.classification\
  \ import Table, Chain\nfrom tinyml4all.tabular.features import Scale\ntable = Table.read_csv(\"\
  fruits.csv\")\n# 使用 Chain 来容纳更多步骤的情况\noptimal_chain = Chain(Scale(method=\"minmax\"\
  ))\ntable2 = optimal_chain(table)\n代码清单 2-19\n为我们的水果数据集应用特征工程\n```\n\n## 分类模型\n\n\
  我们微型机器学习工作流程的下一步围绕分类模型展开。这一步训练一个算法来识别每种水果的独特特征。\n\n如果你在特征工程步骤中做得很好，这部分应该会顺利进行。你应该能直接获得可接受的结果，你的重点是优化（即调优）你选择的模型参数，以将准确率/F1\
  \ 分数最大化。某些模型可能需要比其他模型付出更多努力才能展现出良好结果。接下来，让我们讨论 `tinyml4all` 包中可用的分类器，重点介绍在你掌握每种分类器的优缺点并做出明智选择之前应该使用的那些。\n\
  \n以下是每种分类器的主要区别特征。\n\n*   **对特征缩放的鲁棒性/不变性**：某些分类器（例如决策树）无论输入尺度如何都能对数据进行分类（因此可以跳过归一化）。其他分类器（例如逻辑回归）在特征共享相同尺度时效果更好。\n\
  *   **线性/非线性**：某些分类器仅适用于线性可分数据（例如线性 SVM），而其他分类器允许多项式或径向边界（例如带高斯核的 SVM）。还有一些是基于规则的（例如决策树）。\n\
  *   **内存需求**：由于我们的最终目标是将训练好的模型部署到资源受限的设备上，你应该始终记住，我们希望模型尽可能小且运行尽可能快。基于决策树的分类器运行非常快，并且几乎不需要\
  \ RAM（它们被编译成 *if-then-else* 块）。相比之下，其他分类器执行矩阵乘法来计算结果，这意味着它们必须在内存中存储一些权重。因此，它们的内存需求随输入特征数量线性增长（甚至更多）。\n\
  \n`tinyml4all` 包中的所有分类器共享相同的接口，因此你可以在不更改其余代码的情况下将一个分类器替换为另一个。\n\n### 决策树\n\n决策树（见图\
  \ 2-12）可能是最直观的分类器。顾名思义，它创建了一个树形数据结构，逐步对数据集特征进行分割以做出决策。\n\n![](img/619308_1_En_2_Fig12_HTML.jpg)\n\
  \n一个基于天气条件进行户外活动的决策树示意图。第一个决策点询问温度是否高于 30°C。如果否，则检查是否下雨；如果是，则建议待在家里，否则去公园。如果温度高于\
  \ 30°C，则检查天空是否晴朗；如果是，则建议去海滩，否则去公园。\n\n图 2-12\n\n决策树分类器示例\n\n在每一步，算法都必须选择在哪个特征和哪个值上进行分割。这个选择是如何做出的？它是基于信息增益原则进行的（你可以在\
  \ [4] 找到对这个概念的简单介绍）。通俗地说，分割发生在不同类别之间分离程度最大的地方：一个类别在分割后变得越聚集，信息含量增加得越多。\n\n\n\n####\
  \ 优点\n\n决策树因其具备一些理想特性而被广泛应用于许多任务中。\n\n*   **易于理解和解释**：你可以直观地查看一棵树，并清楚理解它为何做出某个分类。\n\
  \n*   **所需数据准备工作少**：你无需进行归一化处理，它开箱即可处理非数值（类别型）数据。你可能只需要评估一下分箱处理是否能提升结果。\n\n*   **内在的特征选择**：不重要的特征会被自动忽略，因为它们不会产生任何显著的信息增益。\n\
  \n*   **推理速度极快**：一旦部署到微控制器上，决策树就会转化为一系列简单的 `if-then-else` 语句，*无需*任何数学计算。\n\n####\
  \ 缺点\n\n当然，决策树并非适用于所有项目，因为它仍然存在以下缺点。\n\n*   **容易过拟合**：学习到的模型可能过于复杂，从而过度拟合训练数据。通过参数调整（例如，限制树的深度）可以轻松缓解这个问题。\n\
  \n*   **不稳定性**：数据中的微小变化可能导致生成完全不同的树。\n\n*   **无法保证最优性**：由于实际实现中会采用一些启发式方法来加速学习过程（否则耗时过长），因此最终得到的树可能并非最优解。\n\
  \n*   **难以学习某些概念**：这是因为决策树不易表达这些概念，例如 XOR（异或）、奇偶校验或多路复用问题。\n\n*   **对不平衡数据集存在偏差**：如果某个类别占主导地位，决策树学习器会生成有偏见的树。建议在使用决策树进行拟合之前先平衡数据集。\n\
  \n### 随机森林\n\n简单来说，*随机森林* [5] 是决策树的集成。随机森林不是训练单个决策树，而是训练许多不同的树，每棵树都在训练集的不同子样本上进行训练：这大大降低了过拟合的风险，并通常能提升集成的整体准确性。\n\
  \n除了在观测样本层面选择训练数据子集外，随机森林还应用了一种称为*特征袋装*的技术，该技术仅向每棵树提供特征的随机子集。这进一步防止了过拟合。因此，给定一个包含\
  \ `n` 个观测样本、每个样本有 `m` 个属性的输入数据集，每棵树接收到的输入是包含 `n`′ 个观测样本、每个样本有 `m`′ 个属性的数据，其中 `n`′`<\
  \ n` 且 `m`′`< m`。\n\n在推理时，每棵树预测自己的输出类别；获得最多投票的类别胜出，并被选为集成预测结果。\n\n#### 优点\n\n* \
  \  与决策树的优点相同\n\n*   开箱即用，准确率很高：随机森林是最直接易用的分类器之一，因为它在几乎无需或只需很少调整的情况下就能表现良好。为树的数量设置一个合理的默认值（10–20\
  \ 棵）就足够了。你始终可以调整内部决策树的参数（如最大深度、分裂逻辑等）以获得顶尖的准确率。\n\n#### 缺点\n\n*   与决策树的缺点相同\n\n\
  *   黑盒模型——与决策树相比，随机森林失去了可解释性，因为由于组合了众多树，你无法再理解它为何预测出某个特定输出。\n\n提示\n\n鉴于其开箱即用的良好准确率以及对许多特征工程预处理步骤不敏感，我建议你将随机森林作为默认分类器。\n\
  \n### 极限梯度提升\n\n极限梯度提升（XGBoost）[6] 自 2014 年推出以来广受欢迎，因为它赢得了许多在线机器学习竞赛。首先，它是一种*梯度提升*技术：与随机森林类似，它结合了多个决策树。与随机森林（*并行*训练树，且每棵树相互独立）不同，梯度提升*串行*训练树。每棵树都基于前一棵树的结果进行训练：在每次迭代中，算法都试图减少损失函数（即模型在训练数据上的表现有多差）。\n\
  \n如何做到？通过从先前模型的错误中学习。XGBoost 的核心思想是级联地建模残差错误，以便最终纠正它们。“极限”一词在极限梯度提升中强调了多项软件优化，这些优化极大地提升了训练时间和预测准确率。\n\
  \n#### 优点\n\n*   与随机森林的优点相同\n\n*   对过拟合非常鲁棒\n\n#### 缺点\n\n*   与随机森林的缺点相同\n\n*  \
  \ 比随机森林慢\n\n### 逻辑回归\n\n尽管名称如此，逻辑回归被用作一种二分类算法。其名称借用于线性回归，线性回归产生的线性模型形式如下面的线性回归输出公式所示。\n\
  \n![$$ {y}_i{w}^T\\cdotp {x}_i $$](img/619308_1_En_2_Chapter_TeX_Equb.png)\n\n*x*[*i*]\
  \ 是输入样本，*w* 是权重向量。这意味着输入样本中的每个值都乘以一个权重，然后累加结果。这会生成一个连续输出（如同回归一样）。\n\n为了从回归过渡到分类，逻辑回归将逻辑函数应用于输出，使其值域变为\
  \ [0, 1]：在二分类情况下，该值表示当前样本属于正类的概率。图 2-13 展示了逻辑函数的图像。\n\n![](img/619308_1_En_2_Fig13_HTML.jpg)\n\
  \nSigmoid 函数 φ(z) = 1 / (1 + e^(-z)) 的图形，显示出一条 S 形曲线。曲线在 z 为负值时接近 0，在 z = 0 附近急剧上升，并在\
  \ z 为正值时趋近于 1。x 轴范围从 -8 到 8，y 轴范围从 0 到 1。\n\n图 2-13\n\nLogit 函数\n\n逻辑回归训练阶段的目标是最小化分类误差，或者反过来说，最大化似然。\n\
  \n以下公式计算第 *i* 个样本属于正类的概率。\n\n![$$ {p}_i= logit\\left({w}^T\\cdotp {x}_i\\right)\
  \ $$](img/619308_1_En_2_Chapter_TeX_Equc.png)\n\n整个数据集的似然通过以下公式计算。\n\n![$$ L(w)={\\\
  sum}_{i=1}^N{y}_i\\mathit{\\ln}\\left({p}_i\\right)+\\left(1-{y}_i\\right)\\mathit{\\\
  ln}\\left(1-{p}_i\\right) $$](img/619308_1_En_2_Chapter_TeX_Equd.png)\n\n*y*[*i*]\
  \ 是样本的真实标签（由于是二分类器，值为 0 或 1）。你可以通过以下直觉来理解该公式：\n\n*   如果 *y*[*i*] 为 1 且 *p*[*i*]\
  \ > 0.5，则似然增加（正确分类）。\n*   如果 *y*[*i*] 为 0 且 *p*[*i*] < 0.5，则似然增加（正确分类）。\n*   如果\
  \ *y*[*i*] 为 1 且 *p*[*i*] < 0.5，则似然减少（错误分类）。\n*   如果 *y*[*i*] 为 0 且 *p*[*i*] > 0.5，则似然减少（错误分类）。\n\
  \n训练结束时，权重向量 *w* 使得全局似然达到最大值，或者说，我们得到了最高数量的正确分类。多分类情况遵循非常相似的模式，但其证明超出了本书的范围。\n\n\
  #### 优点\n\n*   推理时间快（与特征数量呈线性关系）\n*   预测类别归属的概率\n*   权重系数可以指示某个特征对于类别归属的“重要性”\n\n\
  #### 缺点\n\n*   对噪声和异常值敏感\n*   权重的数量随输入数量线性增长\n*   线性模型，因此最好对输入数据进行变换以提高准确率（应用幂、对数、平方根运算）\n\
  *   对相关输入敏感\n*   可能无法收敛到 *w* 的最优值\n\n\n\n### 支持向量机\n\n支持向量机（SVM）是一种二分类算法，通过“一对一”投票机制可适用于多分类问题（参见第\
  \ 1 章）。\n\nSVM 的核心思想是在两个类别之间找到一个具有尽可能大间隔的分离边界，以提供稳健的分类。图 2-14 给出了直观的视觉呈现。\n\n![](img/619308_1_En_2_Fig14_HTML.jpg)\n\
  \n一张说明支持向量机（SVM）分类的示意图。图中显示了两组数据点（蓝色和绿色），它们被一条标记为 \\(w \\cdot x - b = 0\\) 的红色决策边界线分隔。间隔区域由两条虚线标出，分别标记为\
  \ \\(w \\cdot x - b = 1\\) 和 \\(w \\cdot x - b = -1\\)。三个数据点（两个蓝色，一个绿色）被圈出并标记为支持向量。坐标轴标记为\
  \ \\(x_1\\) 和 \\(x_2\\)。间隔宽度表示为 \\(\\frac{2}{||w||}\\)，从原点到决策边界的距离为 \\(\\frac{b}{||w||}\\\
  )。\n\n图 2-14\n\nSVM 分离间隔\n\n该间隔仅由训练集中少数有意义的点计算得出：即*支持向量*。这些点是最难分类的，因为它们位于两个类别的边界上。\n\
  \n然而，在现实世界的数据中，通常很难找到两个类别之间的清晰分界线——很多时候这种分界线甚至根本不存在！为了解决这个问题，SVM 的主要思路是将原始数据投影到更高维度的空间中。例如，如果原始数据是一维的，可以将其投影到二维空间（见图\
  \ 2-15）。\n\n![](img/619308_1_En_2_Fig15_HTML.jpg)\n\n说明 SVM 高维投影的示意图。左侧的“原始数据 1D”显示了一组绿色星形和蓝色圆点沿水平轴线性排列。右侧的“投影数据\
  \ 2D”展示了相同的数据被转换为抛物线形状，绿色星形和蓝色圆点被一条红线分隔。该变换标记为 \\(x \\rightarrow x²\\)。\n\n图 2-15\n\
  \nSVM 向高维空间的投影\n\n其原理是，在这个新的高维空间中，两个类别更容易被清晰地分开。不同的函数可以实现这种投影，其中涉及的数学运算使用了*核技巧*，但这超出了本入门章节的讨论范围。\n\
  \n#### 优点\n\n*   对高维数据有效\n*   仅使用支持向量进行推理\n*   对异常值具有鲁棒性\n\n#### 缺点\n\n*   训练时间随训练样本数量增加而扩展性不佳\n\
  *   在存在大量重叠类别时表现不佳\n*   需要调整多个参数才能获得良好性能\n*   仅适用于数值输入\n*   黑盒模型\n*   当有 `n` 个特征和\
  \ `k` 个支持向量时，需要存储在 RAM 中的权重数量为 `n * k`（`k` 的值越大，表示类别越难分离，每个类别至少有一个支持向量——通常更多）\n\n\
  表 2-3 总结了不同分类器类型的优缺点。\n\n表 2-3\n\n分类器对比\n\n|   | 优点 | 缺点 |\n| --- | --- | --- |\n\
  | **决策树** | 训练和执行速度快；对特征尺度不敏感；部署后内存效率高 | 在不平衡数据集中容易过拟合和产生偏差；可能表现出次优的准确率 |\n| **随机森林**\
  \ | 与决策树优点相同；开箱即用准确率更高 | 不可解释 |\n| **XGBoost** | 与随机森林优点相同；可额外提升几个百分点的准确率 | 训练速度比随机森林慢\
  \ |\n| **逻辑回归** | 推理时间和内存与特征数量呈线性关系 | 推理时间和内存与特征数量呈线性关系；线性模型；对异常值敏感 |\n| **SVM**\
  \ | 对高维数据有效；对异常值具有鲁棒性 | 在大数据集上训练缓慢；需要调整参数才能良好工作；推理时间和内存与特征数量呈超线性关系 |\n\n既然已经列举了可用的分类器，接下来看看如何将它们应用于水果项目（见代码清单\
  \ 2-20）。分类器在 API 上与特征工程步骤并无不同。\n\n|   | r | g | b | 真实标签 | __ 预测标签 __ |\n| --- |\
  \ --- | --- | --- | --- | --- |\n| **0** | 38 | 23 | 18 | orange | orange |\n| **1**\
  \ | 40 | 22 | 18 | orange | orange |\n| **2** | 49 | 25 | 19 | orange | orange |\n\
  | **3** | 65 | 31 | 22 | orange | orange |\n| **4** | 54 | 25 | 18 | orange | orange\
  \ |\n\n```\nfrom tinyml4all.tabular.classification.models import DecisionTree, RandomForest,\
  \ LogisticRegression, SVM\n# 打印给定分类器可设置参数的描述\nprint(help(RandomForest))\n# 训练分类器并进行预测\n\
  rf = RandomForest(n_estimators=20)\ntable2 = rf(table)\n# table.full() 打印数据 + 真实标签\
  \ + 预测标签\nprint(table2.full())\n代码清单 2-20\n训练分类器并进行预测\n```\n\n为了快速检查分类器的整体表现，而无需逐行比较，你可以使用代码清单\
  \ 2-21 中的代码生成一份分类报告。\n\n```\nprint(table2.classification_report())\nprecision  \
  \  recall  f1-score   support\norange       1.00      0.90      0.95        50\n\
  tomato       0.89      1.00      0.94        50\nzucchini       1.00      0.98 \
  \     0.99        50\naccuracy                           0.96       150\nmacro avg\
  \       0.96      0.96      0.96       150\nweighted avg       0.96      0.96  \
  \    0.96       150\n+-------------------+--------+-------+----------+\n| 真实 vs.\
  \ 预测      | orange | tomato | zucchini |\n+-------------------+--------+-------+----------+\n\
  |       orange       |   45   |   5    |    0      |\n|       tomato       |   0\
  \    |   50   |    0      |\n|      zucchini      |   0    |   1    |    49    \
  \ |\n+-------------------+--------+--------+----------+\n代码清单 2-21\n生成分类报告\n```\n\
  \n该报告包含每个类别的详细指标列表（精确率、召回率、F1 分数）、总体准确率以及混淆矩阵。你可以利用这些信息来判断分类器的性能，并比较不同分类器的结果。\n\n\
  \n\n## 分类链\n\n到目前为止，你已经了解了如何在 Python 中独立处理每个组件来执行特征工程和分类。但这些步骤并非孤立存在：你必须始终按相同顺序执行它们，才能获得可重复的结果。如果需要，你可以手动完成这些操作，但为了让这一过程更易于管理，并能够将工作流导出到\
  \ C++，你需要创建一个*链*。\n\n链的核心是一系列按顺序对数据执行的操作。每个操作产生的输出会作为输入传递给下一个操作，直到生成最终结果。`Chain`\
  \ 类可以处理迄今为止描述的任何特征缩放、特征选择和分类操作。清单 2-22 展示了如何为水果数据集实例化一个完整的分类链。\n\n|     | r    \
  \ | g     | b     | truth  | prediction |\n| --- | ----- | ----- | ----- | ------\
  \ | ---------- |\n| **0** | 0,491 | 0,294 | 0,263 | orange | orange     |\n| **1**\
  \ | 0,528 | 0,275 | 0,263 | orange | orange     |\n| **2** | 0,698 | 0,333 | 0,289\
  \ | orange | orange     |\n| **3** | 1     | 0,451 | 0,368 | orange | orange   \
  \  |\n| **4** | 0,792 | 0,333 | 0,263 | orange | orange     |\n\n```\nfrom tinyml4all.tabular.classification\
  \ import Table, Chain\nfrom tinyml4all.tabular.classification.models import RandomForest\n\
