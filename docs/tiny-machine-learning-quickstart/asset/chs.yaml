  \n一个终端窗口显示了一系列 RGB 颜色值与距离测量值配对的数据，格式为 CSV。标题为\"Collect RGB + distance as CSV\"。数据包含多行，每行有四个逗号分隔的数字，分别代表红色、绿色、蓝色值和距离度量。界面包括自动滚动、显示时间戳、换行设置、波特率选择以及清除输出按钮等选项。\n\
  \n图 3-3\n\nRGB 距离采集串口输出\n\n代码清单 3-2 中显示的 Python 脚本是第 2 章中代码清单 2-3 的副本，此处为了方便而列出。唯一的修改是，我们现在持续从电路板轮询数据，而无需询问水果名称和样本数量。\n\
