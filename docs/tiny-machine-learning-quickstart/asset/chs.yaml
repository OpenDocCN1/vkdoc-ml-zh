  \ 轴分别标注为 \"r\"、\"g\" 和 \"b\"，代表不同的变量。y 轴标注为 \"target\"，范围从 50 到 350。每个图都显示了变量与目标之间的正相关关系，数据点聚集在趋势线周围。\n\
  \n图 3-5\n\n表格所有列的回归散点图\n\n通过观察这些图表，你可以看到颜色分量与距离之间存在强相关性，因为所有点都离红线不远，并且它们似乎遵循单调递增的分布（右侧的值大于左侧的值）。如果这些点看起来更稀疏、更分散，那可能是一个信号——表明输入和输出之间可能找不到关系——至少在没有先进行特征工程的情况下是这样。\n\
  \n## 特征工程\n\n许多回归模型在输入与输出之间存在线性关系时表现良好。然而，并非所有数据*本身*都呈现这种关系。可能的情况是，线性关系仍然存在，但存在于输入的单调函数映射或输入的组合之上。\n\
  \n\n### 单调函数映射\n\n什么是*单调函数映射*？\n\n它本质上是一个应用于输入、且能保持其顺序的数学函数（即，如果 `x1 < x2`，那么 `f(x1)\
  \ < f(x2)`）。这个函数可以像幂运算、对数运算或指数运算一样简单。让我们来看一个简单的公式。\n\n![$$ y=3{x}²+5 $$](img/619308_1_En_3_Chapter_TeX_Equa.png)\n\
  \n尽管看起来简单，但线性回归无法对此函数建模。许多用于回归的特征工程算子的作用，就是应用一个或多个映射，使得新特征与输出呈线性相关。\n\n![$$ z={x}²y=3z+5\
  \ $$](img/619308_1_En_3_Chapter_TeX_Equb.png)\n\n此时，大多数可用的回归模型都能以较高的准确度预测输出。在大多数情况下，一系列常见的映射都是适用的。\n\
  \n*   2 次幂、3 次幂、平方根、倒数\n\n*   指数和对数\n\n*   Box-Cox 和 Yeo-Johnson\n\nBox-Cox 和 Yeo-Johnson\
  \ 在附录 A 中讨论，请参考该附录以获取更多信息。清单 3-6 展示了如何将幂变换和指数/对数变换应用于表格数据集。你可以选择仅应用所有可用映射的一个子集，并且仅将其应用于列的一个子集。可用的映射如下（见图\
  \ 3-6）。\n\n![](img/619308_1_En_3_Fig6_HTML.jpg)\n\n该图像展示了六个图表，说明了不同的数学函数。顶行包括：“平方”显示抛物线曲线，“立方”显示更陡峭的曲线，“平方根”显示逐渐上升的曲线。底行包括：“倒数”显示双曲线下降，“对数”显示缓慢上升的曲线，“指数”显示快速上升的曲线。每个图表代表了这些函数的一般形状。\n\
