  \ | --- |\n| **0** | 12:04:36.782244 | -0,018 | -0,021 | ... | 0,977 | -0,427 |\n\
  | **1** | 12:04:36.790244 | -0,019 | -0,021 | ... | 0,977 | -0,488 |\n| **2** |\
