  \ \");\nSerial.println(lstm.outputsAsString());\ndelay(1000);\n}\n清单 8-4\n在加速度计数据上运行\
  \ LSTM 网络\n```\n\n如果你想自行处理输入数组，可以调用 `lstm.predict(inputs)` 替代，其中 *inputs* 是按 `A`[`t=1`]`,\
  \ B`[`t=1`]`, C`[`t=1`]`, A`[`t=2`]`, B`[`t=2`]`, C`[`t=2`], … 顺序排列的输入值数组，其中 `A`、`B`\
  \ 和 `C` 是传感器读数，`t` 是时间步长。\n\n\n\n## 一维卷积神经网络\n\n循环神经网络并非唯一能良好处理序列数据的架构。一维卷积神经网络（1D\
  \ CNN）是（通常）更快、更轻量的替代方案。这类网络不像 LSTM 单元那样具备记忆能力，因此可能不擅长对输入数据中的长期关系进行建模。不过，这通常并非必要，因为最强的关联往往存在于邻近元素之间。\n\
  \n*一维卷积*是一种数学运算，它接收一个输入序列（一组数字）和一个较小的数字集合（权重），称为*滤波器*或*卷积核*，然后将它们组合以生成一个新的序列。图 8-10\
  \ 展示了这一过程。\n\n![](img/619308_1_En_8_Fig10_HTML.jpg)\n\n图示：卷积核大小为 3 的卷积操作。包含权重 \\\
  (w_1\\)、\\(w_2\\) 和 \\(w_3\\) 的卷积核在输入序列 \\(i_1\\) 到 \\(i_6\\) 上滑动。该操作产生输出序列 \\(c_1\\\
  ) 到 \\(c_6\\)。高亮示例显示 \\(c_3\\) 的计算方式为 \\(c_3 = w_1i_2 + w_2i_3 + w_3i_4\\)。\n\n\
  图 8-10\n\n一维卷积\n\n参照图 8-10 所描绘的场景，我们首先考虑输入数组的前三个元素（黄色部分）。每个元素与对应的卷积核元素（绿色部分）相乘，然后将结果求和（紫色单元格）。此操作称为*点积*。\n\
  \n随后，卷积核向右滑动一位，重复相同的操作，这次处理输入中第 2 到第 4 个元素。此过程循环进行，直到卷积核应用于输入的最后三个元素。\n\n最终结果是一个新的序列，它是输入序列的加权聚合。要构建一个一维\
  \ CNN，许多这样的卷积核被封装在一个 Conv1D 层中，并且许多这样的层被依次堆叠。在最后一个 Conv1D 层和输出层之间，一个或多个全连接层将提取的特征进行组合（见图\
  \ 8-11）。学习过程包括寻找最优的卷积核权重，以最大化分类准确率（对于分类任务）或最小化误差（对于回归任务）。\n\n![](img/619308_1_En_8_Fig11_HTML.jpg)\n\
  \n神经网络架构图，带有标注部分。流程从使用“独热编码”的“输入”开始，接着是“隐藏层”，包含“a) 输入层”、“b) 卷积层”（生成“特征图”）、“c) 展平层”和“d)\
  \ 密集-丢弃层”。最后通过“e) 归一化层”得到“输出”。箭头指示数据在各层之间的流动。\n\n图 8-11\n\nConv1D 网络拓扑\n\n### 如何在连续运动数据上训练一维\
  \ CNN\n\n本节以连续运动数据作为时间序列分类的代表性示例。同样的流程适用于任何可以通过 `TimeSeries.read_csv` 或 `TimeSeries.read_csv_folder`\
  \ 加载的数据。代码见清单 8-5，准确率图见图 8-12。\n\n![](img/619308_1_En_8_Fig12_HTML.jpg)\n\n标题为“模型损失”的折线图显示了\
