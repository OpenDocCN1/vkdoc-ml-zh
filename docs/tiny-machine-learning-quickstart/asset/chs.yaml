  wroom-s3\");\n// 为推理模式配置摄像头\ncamera.inferencing();\n// 初始化摄像头\ncamera.begin();\n\
  // 初始化 Edge Impulse 模型\nimpulse.begin();\n}\nvoid loop() {\n// 获取新帧\nif (!camera.grab())\
  \ {\nSerial.println(\"无法获取新帧\");\nreturn;\n}\n// 运行 impulse\nif (!impulse.run(camera))\
  \ {\nSerial.println(impulse.error());\nreturn;\n}\n// 如果没有检测到物体，则返回\nif (impulse.count()\
  \ == 0)\nreturn;\n// 打印检测到的物体数量\nSerial.print(\"发现 \");\nSerial.print(impulse.count());\n\
  Serial.println(\" 个物体\");\n// 打印物体及其坐标\nfor (int i = 0; i  \");\nSerial.print(object.label);\n\
  Serial.print(\" 位于坐标 \");\n// cx, cy 是物体中心的坐标\nSerial.print(object.cx);\nSerial.print(\"\
  , \");\nSerial.print(object.cy);\nSerial.print(\" (置信度 \");\nSerial.print(object.confidence);\n\
  Serial.println(\")\");\n}\n}\n代码清单 7-3\n使用 Edge Impulse 进行物体检测的 Arduino 程序\n```\n\
  \n编译该程序——首次编译需要几分钟时间——然后上传。打开串口监视器，将您感兴趣的物体放在摄像头前。当您将感兴趣的物体放在摄像头前时，您应该会看到检测成功（见图\
  \ 7-11）。\n\n![](img/619308_1_En_7_Fig11_HTML.jpg)\n\n一个终端窗口显示了使用 Edge Impulse 进行物体检测过程的结果。它以不同的置信度识别出位于不同坐标的企鹅：在\
  \ (28, 36) 处置信度为 0.65，在 (20, 36) 处置信度为 0.77，在 (28, 36) 处置信度为 0.78，在 (28, 32) 处置信度为\
  \ 0.83。该界面包括自动滚动、显示时间戳和设置波特率的选项。\n\n图 7-11\n\n推理串口输出\n\n为了让您了解此项目的执行时间，请考虑：一个 ESP32（非\
  \ S3）在 64×64 RGB 帧上运行 MobileNetV2 0.1 模型大约需要 280 毫秒。ESP32 S3 大约需要 35 毫秒。Arduino\
  \ Nicla Vision 更快，只需 20 毫秒！\n\n准确率远未达到 100%，但考虑到传感器质量较差和模型分辨率较低，这是意料之中的。在实现生产固件时，您必须考虑到模型可能会遗漏某些帧或检测到实际上并不存在的物体。\n\
  \n### 可视化调试\n\n在串口监视器上打印检测结果是确认模型工作的最快方法。但是否也可以*直观地*检查结果呢？您能否获得摄像头所见画面以及感兴趣物体所在位置的漂亮预览？是的，当然可以。\n\
  \n以下 Arduino 程序结合了代码清单 7-1 和代码清单 7-3。让我们通过串口连接打印帧*和*预测结果（见代码清单 7-4），以便稍后通过 Python\
  \ 脚本进行分析和显示。\n\n```\n/**\n* 代码清单 7-4：调试物体检测结果\n*\n* 所需硬件：ESP32 摄像头\n*\n* 注意：使用 ESP32\
