  \ -0,024 | ... | 0,916 | -0,61 |\n\n```\nfrom tinyml4all.time.continuous.classification\
  \ import TimeSeries\nts = TimeSeries.read_csv_folder(\"motion\")\nts.label_from_sources(padding=\"\
  1s\")\nprint(ts.head())\n代码清单 4-3\n从文件夹加载所有 CSV 文件\n```\n\n加载多个文件时，务必确保它们的时间戳**不重叠！**\n\
  \n### 绘制时间序列数据\n\n在时间序列数据的上下文中，散点图没有意义。由于时间是一个基础维度，最直观的图表是以时间为 *x* 轴、其他测量值为 *y*\
  \ 轴的折线图。代码清单 4-4 使用不同颜色的线条区分不同测量值，并通过背景色区分不同类别，如图 4-4 所示。\n\n![](img/619308_1_En_4_Fig4_HTML.jpg)\n\
  \n一张标题为“时间序列”的图表，展示了来自四个 CSV 文件（idle、shake、slide、wave）的数据。x 轴表示时间，范围从 12:37:30 到\
  \ 12:39:10，y 轴显示从 -100 到 300 的值。图表包含六条彩色线条，分别代表不同变量：ax、ay、az、gx、gy 和 gz。idle 阶段显示低活动性，shake\
  \ 阶段波动剧烈，slide 阶段活动性适中，wave 阶段波动从低到中等。\n\n图 4-4\n\n时间序列折线图\n\n```\n# 所有参数均为可选\n\
  ts.line(\ntitle=\"连续手势\",\nnormalize=True,\nline_palette=\"magma\",\nbg_palette=\"\
  viridis\"\n)\n代码清单 4-4\n绘制折线图\n```\n\n你可以通过拖拽鼠标在特定区域进行缩放，双击可重置缩放。\n\n## 特征工程\n\n\
  时间序列特征工程聚焦于数据的*窗口*。窗口简单来说就是一组按时间戳关联的读数。\n\n窗口是一种 FIFO（先进先出）数据结构：当新样本到达时，它会被*排队*到窗口末尾。当窗口达到最大长度时，最早的样本会被丢弃，为新样本腾出空间（见图\
  \ 4-5）。\n\n![](img/619308_1_En_4_Fig5_HTML.jpg)\n\n图示说明了一个带有重叠滑动窗口的时间序列。顶部部分显示了时间序列点随时间（范围\
  \ 0 到 15）的分布。下方，重叠的蓝色矩形代表滑动窗口，每个窗口包含时间序列点的一个子集。窗口每次移动一个点，从 0-5 开始，到 10-15 结束，展示了数据如何被分段用于分析。每个窗口内的彩色点代表该段内的数据点。\n\
  \n图 4-5\n\n滚动窗口逻辑\n\n图 4-5 描述了一般情况：每个窗口具有相同的*时长*，但包含的样本数量可能不同（由于信号频率不恒定）。然而在我们的场景中，机器学习模型期望固定数量的输入，因此有两种选择。\n\
  \n*   忽略那些未包含正确样本数量的窗口。\n\n*   考虑具有相同*长度*而非相同时长的窗口。\n\n选项 1 存在若干问题（例如，如果数据以不规则间隔生成，我们可能永远——或几乎永远——无法获得包含正确样本数量的窗口）。选项\
  \ 2 易于实现，并能保证在新样本到达时生成预测（其缺点是假设采样频率恒定——但实际情况可能并非如此）。为简化实现，从现在起，我们假设所有数据窗口共享相同的样本数量。这个数量就是窗口的*长度*。\n\
  \n让我们举一个实际例子。假设你有一个包含十个值的数组。\n\n```\n2, 3, 6, 4, 3, 4, 7, 8, 5, 4\n```\n\n我们可以将这些数据切分成包含五个元素的窗口，步长（窗口向右滑动的距离）为\
  \ 2。结果得到如下所示的窗口。\n\n```\n窗口 1（索引 1 到 5）：2, 3, 6, 4, 3\n窗口 2（索引 3 到 7）：6, 4, 3, 4,\
  \ 7\n窗口 3（索引 5 到 9）：3, 4, 7, 8, 5\n```\n\n给定一个数据窗口，我们可以在两个域中生成特征。\n\n*   **时间域**：将数据“原样”分析为一个数字序列，可以计算其统计矩（最小值、最大值、平均值、标准差等）和形状描述符（峰值数量、高于或低于均值或零的数值计数等）。\n\
  \n*   **频率域**：应用一种变换（傅里叶变换 [2]），将原始数字序列映射到一个新域。在这个新域中，数字表示给定频率对原始信号的重要程度。\n\n还有第三种选择：完全不生成特征。或者更确切地说，让神经网络自行找出特征。你将在第\
  \ 8 章中看到具体应用。\n\n每个域都有其优缺点。\n\n### 时域特征\n\n如果你将窗口数据中的每个测量值视为一个数值序列，就可以借用经典统计学中的许多指标来描述该序列。所有这些指标的总体目标是描述序列的*形状*（见图\
  \ 4-6）。均值、标准差、偏度和峰度等指标通常足以捕捉时间序列的内在特征，并有助于区分不同类别。\n\n![](img/619308_1_En_4_Fig6_HTML.jpg)\n\
  \n该图展示了三个钟形曲线图，分别代表不同类型的数据分布。左侧第一个图表示正偏态，众数位于左侧，中位数紧随其后，均值在最右侧。中间的图显示对称分布，均值、中位数和众数在中心对齐。右侧的图表示负偏态，均值位于左侧，中位数紧随其后，众数在最右侧。\n\
  \n图 4-6\n\n偏态曲线示例\n\n时域特征的优势之一在于它们对数据模式几乎不做任何假设。无论序列多么嘈杂或不规则，你都能获得有意义的指标；它甚至能很好地处理缺失数据。第二个优势是这些指标计算起来简单快速：不涉及复杂数学运算，任何嵌入式\
  \ CPU 都能在微秒级完成此任务。\n\n另一方面，这种简单性有时也可能成为局限，这些指标的描述能力可能不足以捕捉底层数据模式，尤其是在处理重复性、周期性的时间序列时。\n\
  \n\n\n### 频域特征\n\n频域特征不关注序列中的原始数值，而是通过变换将时间值映射到频率域。这一操作由傅里叶变换完成。其背后的理论和数学原理可能有些复杂，超出了本书的讨论范围。在微型机器学习中，对我们重要的是，这一操作所需的计算量远大于经典统计特征。它提取的特征旨在描述构成时间序列的主要频率，而非其形态（见图\
  \ 4-7）。\n\n![](img/619308_1_En_4_Fig7_HTML.jpg)\n\n该图像包含两个图表。顶部图表显示一条红色波形，代表压力随时间的变化，在\
  \ 5 秒内于-4 到 4 单位之间振荡。底部图表显示蓝色频谱，在约 0.5、1 和 2 赫兹处有显著峰值，幅度高达 3000 单位。顶部图表的 x 轴标签为“时间，秒”，y\
  \ 轴标签为“压力”。底部图表的 x 轴标签为“频率，赫兹”。\n\n图 4-7\n时间序列的频率内容\n\n那么，为什么你会倾向于使用频域（或将其与时域结合）呢？\n\
  \n答案是，在处理重复性和周期性模式时，频域特征展现出更强的描述能力。它们通常*密集*得多（产生更多系数），并能可靠地区分不同类别。如果你正在对连续运动进行建模（如本章所述），傅里叶变换是一个绝佳选择。\n\
  \n## 用于连续运动的 Edge Impulse\n\n本节将逐步介绍用于连续运动分类的 Edge Impulse 平台。如第 6 章和第 7 章所述，Edge\
  \ Impulse 也能处理音频数据和图像。熟悉这个工具可以加快你在许多不同项目中的工作流程，所以请花些时间探索它，不要局限于本章的严格要求。\n\nEdge\
  \ Impulse 是一个*低代码*工具：它允许你通过其图形界面生成模型，而无需编写任何代码。你只需要编写代码，将生成的模型集成到你的 Arduino 程序中。对于不想深入研究特征提取和分类复杂细节的初学者来说，这是一个极好的工具。它还提供了内置的快速数据标注工具，因此你无需为此任务使用第三方软件。\n\
  \n前往 [`https://studio.edgeimpulse.com/studio/profile/projects`](https://studio.edgeimpulse.com/studio/profile/projects)\
  \ 并创建一个新项目。将其命名为 `continuous motion`*。*\n\n注意\n\n你可以为项目选择任何你喜欢的名称。（但请保持在 20 个字符以内，因为过长的名称可能会在后续使用\
  \ Arduino IDE 时引起问题）。请记住，你需要稍后修改一些代码以反映名称的更改！\n\n### Edge Impulse 工作流程\n\n在使用 Edge\
  \ Impulse 平台时，你的工作流程非常线性。项目主页上的侧边菜单以（几乎）你必须遵循的确切顺序高亮显示了所有可用步骤（见图 4-8）。\n\n![](img/619308_1_En_4_Fig8_HTML.jpg)\n\
  \n该图像顶部显示 Edge Impulse 标志，下方是一个带有图标和文字的垂直菜单。菜单项包括：仪表盘、设备、数据采集、实验、脉冲设计和版本管理。每个项目都有对应的图标，例如仪表盘对应电脑显示器，设备对应微芯片。\n\
  \n图 4-8\nEdge Impulse 项目菜单\n\n*   **仪表盘**：项目概览，包含指向后续步骤、教程和项目管理操作（例如，删除项目）的快速链接。\n\
  \n*   **设备**：你可以使用串口（通过 EI CLI）、WebUSB 或 Wi-Fi（例如，你的智能手机）连接一个受支持的设备，并直接从此页面捕获数据，而无需像我们之前那样先创建\
  \ CSV 文件。我通常不使用此功能，因为我更喜欢以我偏好的格式处理文件，但它在快速测试时可能会派上用场。\n\n*   **数据采集**：在这里，你可以管理你的数据集。它会跟踪你上传的文件，处理训练/测试集划分，并提供数据预览（对于图像来说非常方便！）。你可以使用上下文菜单执行许多操作（删除、标注、移动样本）。\n\
  \n*   **脉冲设计**：这是整个平台的*核心*。一个*脉冲*相当于第 2 章和第 3 章中看到的处理链。它将特征工程过程和分类（或回归）模型组合在一起。它的任务是接收你的输入数据，并执行所需的计算以获得预期的输出。它由嵌套的步骤组成。\n\
  \n*   **创建脉冲**：一个配置界面，你可以在其中指定要使用的任务类型和特征（分类与回归，频谱特征与原始数据）。\n\n*   **特征提取**：此菜单项的名称会根据你在上一界面中的选择而变化。对于时间序列分类，此项很可能是*频谱特征*。但无论具体项目是什么，此页面都允许配置特征提取步骤的具体参数。\n\
  \n*   **分类器**：在这里，你定义神经网络拓扑结构（可以从头开始，也可以使用支持的参考架构之一），并运行训练。当过程完成时，你会得到一个漂亮的混淆矩阵来检查结果。\n\
  \n*   **实时分类**：如果你之前连接了受支持的设备，现在可以对来自设备的实时数据运行预测，而无需烧录任何固件。在这种情况下，预测是在云端进行的，因此你可以预览模型在真实世界数据上的准确性。\n\
  \n*   **模型测试**：回想一下，*数据采集*步骤处理了训练/测试集的划分。在此页面上，你可以在测试数据集上运行模型，并查看其表现。\n\n*   **部署**：完成在线配置、调优和测试后，就该将训练好的模型导出为\
  \ C++ 代码，以便集成到你的项目中。此页面为许多受支持的开发板和桌面操作系统提供了多种导出选项。\n\n*   **版本管理**：你经常会使用不同的数据集、不同的模型和不同的配置进行实验。你可能希望跟踪所有这些实验，以避免丢失日后可能需要的重要设置。版本管理允许创建项目当前状态的*快照*。然后，你可以放心地进行编辑，因为你知道以后可以恢复到之前的状态，就像什么都没发生过一样。\n\
  \n*   **实验**：这是一个更高级的功能，允许你在相同数据上配置和训练多个脉冲，并比较它们的结果以选择最佳方案。默认情况下，它只列出当前（唯一）脉冲的结果，但当你创建新的脉冲时，它们会以清晰的表格形式列出，便于快速比较。\n\
  \n本书中的项目并未使用该平台的所有功能。以下描述了我们工作流程的步骤。\n\n1.  配置数据格式（这仅在本章中是必要的，因为 CSV 文件中的数据可以以不同的布局排列。图像和音频文件则不言自明）。\n\
  2.  上传数据并划分为训练/测试集。\n3.  定义脉冲结构和参数。\n4.  执行特征提取。\n5.  训练模型。\n6.  部署为 Arduino 库。\n\
  \n\n\n### CSV 布局配置向导\n\nEdge Impulse 常用于音频和图像分类。音频和图像文件不言自明，每个文件都清晰地表明了其含义（以及信息的编码方式）。相比之下，CSV\
  \ 数据可以按多种不同的布局排列，每一行可能包含多种数据类型。因此，您需要先指示 Edge Impulse 如何解释您将要上传的文件，它才能正确地摄取这些数据。\n\
  \n您可以使用 CSV 向导来执行此操作，这是一个引导式配置工具，会逐步要求您定义数据的布局。\n\n提示\n\n有关 CSV 向导配置的视频演示，请参考在线资料。\n\
  \n导航至 **数据采集** ➤ **CSV 向导** 选项卡，并上传您之前捕获的其中一个文件（见图 4-9）。\n\n![](img/619308_1_En_4_Fig9_HTML.jpg)\n\
  \n该图像显示了 Edge Impulse 平台界面，特别是用于上传文件的“CSV 向导”部分。高亮区域包括左侧菜单中的“数据采集”和顶部导航中的“CSV 向导”。主要内容区域显示“CSV\
  \ 向导 - 步骤 1：上传文件”，并附有上传示例 CSV 文件或现有 CSV 向导配置的说明。一个名为“idle.csv”的文件已被选中上传，并可见一个绿色的“上传文件”按钮。\n\
  \n图 4-9\n\nEdge Impulse CSV 向导介绍\n\n确认数据看起来正确，然后进入步骤 3（见图 4-10）。在此，您必须选择以下选项。\n\n\
  ![](img/619308_1_En_4_Fig10_HTML.jpg)\n\n该图像显示了用于配置时间序列数据的 CSV 向导界面。它确认数据为时间序列，格式为每行包含一个读数，传感器值作为列。一个示例表格显示了带有相应温度和湿度读数的时间戳。界面询问是否存在时间戳列，并已选择“是，它是时间戳”。时间戳数据类型设置为“完整时间戳”。一条警告信息指示预期时间戳差异存在不一致，建议覆盖为\
  \ 9 毫秒。一个标有“太好了，让我们看看您的数值”的按钮可见。\n\n图 4-10\n\nEdge Impulse CSV 向导\n\n*   **这是时间序列数据吗？**\
  \ 是的，这是时间序列数据（无论是原始传感器数据还是处理后的特征）。\n\n*   **您的时间序列数据是如何格式化的？** 每行包含一个读数，传感器值作为列。\n\
  \n*   **您有包含时间戳或已用时间的列吗？** 是的，它是时间戳。\n\n*   **您的时间戳列是什么数据类型？** 完整时间戳。\n\n*   **覆盖时间戳差异？**\
  \ ***<您的采样频率>*****。** 如果它警告您差异不一致，请选择正确的值。例如，在我们的项目中，采样率为 120 Hz，因此时间间隔为 8.3 毫秒。您可以四舍五入为\
  \ 9 或 8，这没有区别。\n\n接下来的两个步骤简短且容易（见图 4-11）。\n\n![](img/619308_1_En_4_Fig11_HTML.jpg)\n\
  \nCSV 向导界面，步骤 4，标题为“关于您的数值”。它询问是否存在包含要预测标签的列，选项有“是的，它是”后跟一个下拉菜单，以及“否”，当前已选择“否”。下方询问哪些列包含数值，并提供了“ax”、“ay”、“az”、“gx”、“gy”和“gz”的复选框，所有选项均已勾选。底部有一个标有“下一步，拆分为样本”的按钮。还有一个标有“不同格式？”的链接。\n\
  \n图 4-11\n\nEdge Impulse CSV 向导配置（续）\n\n*   **您是否有包含标签（您想要预测的值）的列？** 没有。\n\n*  \
  \ **哪些列包含您的数值？** 全部勾选。\n\n*   **您希望样本持续多长时间？** 无限制。\n\n现在数据布局已定义，您可以轻松地导入任意数量的文件。\n\
  \n### 上传文件\n\n从菜单返回 **数据采集**，点击 **添加数据** 按钮。选择 **上传数据**，然后选择您在上一步中捕获的文件。保留默认选项的勾选状态（见图\
  \ 4-12）。\n\n![](img/619308_1_En_4_Fig12_HTML.jpg)\n\n该图像显示了一个数据上传界面，包含上传文件的选项。左侧部分允许用户选择单个文件，已选择了三个文件。这些文件被归类为训练数据，标签从文件名推断。右侧部分显示上传输出，确认三个\
  \ CSV 文件成功上传：“left-right.csv”、“up-down.csv”和“idle.csv”。一条消息指示“作业完成”，没有上传失败。右下角有一个“上传数据”按钮。\n\
  \n图 4-12\n\nEdge Impulse 数据上传表单\n\n*   选择单个文件\n\n*   训练\n\n*   从文件名推断\n\n我们将所有文件作为训练数据上传，因为\
  \ Edge Impulse 对 CSV 文件执行训练/测试分割时，会应用自动分割，这无法保持数据正确的时序顺序，也无法配置。手动分割让您能更好地控制此过程，例如决定分割百分比。\n\
  \n### 训练/测试分割\n\n您的数据集面板中应该有几个条目，每个文件对应一个。逐行浏览，点击右侧的三个点。这将打开一个包含操作列表的上下文菜单。点击 **分割样本**\
  \ 以打开分割图形界面。删除所有自动创建的分段，仅定义两个分段：一个用于训练，一个用于测试。第一个（用于训练的）应该更大，以便模型有更多数据可以学习。图 4-13\
  \ 显示了一个示例。\n\n![](img/619308_1_En_4_Fig13_HTML.jpg)\n\n一个标题为“分割样本‘up-down’”的波形图，显示了从\
  \ 0 毫秒到 38594 毫秒时间线上振荡的数据。该图显示了多条彩色线条，代表标记为 ax、ay、az、gx、gy 和 gz 的不同数据点。右侧高亮显示了一个分段，并提供了缩放、添加或删除分段的选项。分段长度设置为\
  \ 1000 毫秒。底部有“取消”和“分割”按钮，以及一个移动样本的选项。\n\n图 4-13\n\nEdge Impulse 训练/测试分割\n\n返回数据采集页面，您应该会在样本列表中看到一个新行。命名遵循\
  \ `<类别标签>.s1` 和 `<类别标签>.s2` 的模式（例如 `idle.s1` 和 `idle.s2`）。s1 是用于训练的样本；s2 是用于测试的样本。点击\
  \ s2 样本右侧的三个点，选择 **移动到测试集**。然后，对您上传的所有样本重复相同的过程（见图 4-14）。\n\n![](img/619308_1_En_4_Fig14_HTML.jpg)\n\
  \n该图像在渐变的蓝紫色背景上显示了两个数据面板。左侧面板显示“已收集数据”，时间为“1 分 50 秒”，并有一个橙色、粉色和黄色的环形图。右侧面板显示“训练/测试分割”，比例为“73%\
  \ / 27%”，并有一个青绿色和绿色的环形图，旁边有一个小的问号图标。\n\n图 4-14\n\nEdge Impulse 数据集统计信息\n\n\n\n###\
  \ 脉冲设计\n\n这里开始实际的分类任务。每种数据类型都有其专属的特征工程模块，你可以通过图形用户界面（GUI）进行可视化配置（见图 4-15）。\n\n![](img/619308_1_En_4_Fig15_HTML.jpg)\n\
  \n该图展示了用于创建脉冲的 Edge Impulse 平台界面。它包括时间序列数据、频谱分析、分类和输出特征等部分。时间序列数据部分有标记为 ax、ay、az、gx、gy、gz\
  \ 的输入轴，窗口大小为 1000 毫秒，窗口增加量为 250 毫秒。频率设置为 104 Hz。频谱分析部分名为“频谱特征”，并已选定输入轴。分类部分名为“分类器”，输入特征为频谱特征。输出特征部分指示了三个特征：静止、左右和上下。界面上突出显示了“保存脉冲”按钮。\n\
  \n图 4-15\n脉冲设计\n\n#### 时间序列数据模块\n\n在我们的时间序列分类案例中，需要配置两个参数。\n\n*   **窗口大小**：每个数据窗口的持续时间。必须以毫秒为单位配置，因为\
  \ Edge Impulse 平台假定你的数据具有固定的采样率（从上传的数据中推断得出）。\n\n*   **窗口增加量**：本章前面部分称之为*偏移*，表示当窗口填满时，窗口应向右滑动多少（同样以毫秒为单位）。\n\
  \n在连续运动中，你应该将窗口持续时间设置为至少能捕获你想要识别的动作的几个重复周期。就本项目而言，1 到 2 秒之间的值效果不错。\n\n#### 频谱分析模块\n\
  \n作为预处理模块，选择**频谱分析**并勾选所有输入轴。在底层，该模块会提取时域特征（如均方根值、偏度和峰度）和频域特征（不同频率下的频谱功率）的混合体。\n\
  \n点击相应按钮保存脉冲后，左侧菜单中会出现一个**频谱特征**条目，你可以在其中配置该模块的许多参数。要正确调整这些参数，需要深入理解 FFT 和其他频域算法的工作原理——这超出了本书的范围——因此目前使用默认设置即可（见图\
  \ 4-16）。如果你后来觉得模型性能不佳，想进一步研究此页面，最直观的可调参数是 *FFT 长度*；增加该值会为 FFT 生成考虑更多数据点，*可能*会提高整体准确率。\n\
  \n![](img/619308_1_En_4_Fig16_HTML.jpg)\n\nEdge Impulse 平台显示频谱特征分析的截图。顶部区域显示原始数据随时间变化的波形图。下方是“参数”部分，包含滤波和分析设置选项，如缩放比例、输入抽取比和\
  \ FFT 长度。右侧显示 DSP 结果，包含两个图表：“滤波后”显示样本数据随时间变化，“频谱功率（对数）”显示频率数据。左侧边栏包含仪表盘、设备和频谱特征等导航选项。\n\
  \n图 4-16\nEdge Impulse 特征提取配置\n\n接下来，点击**保存参数**进入生成特征页面。点击**生成特征**按钮并等待处理完成（此步骤是强制性的；否则后续将无法训练模型）。处理完成后，会显示一个散点图，展示聚类后的数据（类似于第\
  \ 2 章中为表格数据绘制的散点图）。图 4-16 显示了每个类别不同颜色的聚类簇。\n\n#### 学习模块\n\n最后一个需要配置的模块是*学习*模块。目前它的选项相当有限，甚至通过显示推荐的*分类*模块来引导我们，因此选择它并点击**保存脉冲**按钮。\n\
  \n在左侧菜单的**频谱特征**下方会出现一个*分类器*条目。点击它以打开模型训练配置页面。默认提出的拓扑结构是一个包含两个*密集*层、每层神经元数量较少的神经网络。在我的数据集上，将所有选项保留为默认值即可达到接近\
  \ 100% 的分类准确率，这表明提取的特征质量非常高，以至于即使是一个没有任何特殊定制的简单模型也能正确分类（见图 4-17）。\n\n![](img/619308_1_En_4_Fig17_HTML.jpg)\n\
  \n该图显示了一个神经网络训练界面。左侧的“神经网络设置”面板显示了训练设置，例如 30 个训练周期、0.0005 的学习率以及 CPU 作为处理器。神经网络架构包括一个包含\
  \ 78 个特征的输入层、两个分别有 20 和 10 个神经元的密集层，以及一个包含 3 个类别的输出层。界面上可见“开始训练”按钮。右侧的“训练输出”面板显示了模型性能，准确率为\
  \ 98.5%，损失为 0.01。混淆矩阵显示“静止”、“左右”和“上下”类别具有高准确率。指标包括 ROC 曲线下面积 1.00，以及精确率、召回率和 F1\
  \ 分数的加权平均值。数据探索器使用颜色编码的点来可视化正确和错误的分类。\n\n图 4-17\nEdge Impulse 分类\n\n在此页面上工作时，你可能会频繁使用几个重要参数，以下是它们的作用。\n\
  \n*   **训练周期数**：它决定了模型应该学习多长时间。一个合理的默认值是 50。如果准确率较低但看起来在上升（稍后会介绍如何检查），你可以尝试增加此值。\n\
  \n*   **学习率**：它控制模型在每个周期更新权重的幅度。我常用的值是 0.005：较低的值可能会带来更高的准确率，但需要更多的训练周期。请注意，这与默认设置的\
  \ 0.0005 不同（少了一个零）！\n\n\n\n#### 如何检测准确率是否随时间提升？\n\n点击 **保存并训练** 后，模型开始学习。右侧会出现一个\
  \ **训练输出** 区块，训练过程中日志会在此显示。日志内容如下所示。\n\n```\nTraining model...\nTraining on 157\
  \ inputs, validating on 40 inputs\nUsing batch size: 32\nEpoch 1/30\n5/5 - 1s -\
  \ loss: 1.2153 - accuracy: 0.6624 - val_loss: 0.8915 - val_accuracy: 0.6750 - 831ms/epoch\
  \ - 166ms/step\nEpoch 2/30\n5/5 - 0s - loss: 0.7945 - accuracy: 0.6433 - val_loss:\
  \ 0.4627 - val_accuracy: 0.6750 - 34ms/epoch - 7ms/step\nEpoch 3/30\n5/5 - 0s -\
  \ loss: 0.4370 - accuracy: 0.7134 - val_loss: 0.2049 - val_accuracy: 0.9500 - 62ms/epoch\
  \ – 12ms/step\nEpoch 4/30\n5/5 - 0s - loss: 0.2389 - accuracy: 0.9045 - val_loss:\
  \ 0.1047 - val_accuracy: 1.0000 - 29ms/epoch - 6ms/step\nEpoch 5/30\n5/5 - 0s -\
  \ loss: 0.1518 - accuracy: 0.9554 - val_loss: 0.0726 - val_accuracy: 1.0000 - 61ms/epoch\
  \ - 12ms/step\n```\n\n如你所见，每一行都报告了每个周期（epoch）在验证集上的准确率和损失值。你已经知道准确率是什么，但损失值呢？它是一个函数，通过衡量模型预测值与实际目标值之间的差异，来量化神经网络表现的好坏。如果损失值下降，说明模型对数据的学习表征更好。在训练阶段，网络的目标是**最小化**这个值，而不是提高准确率。高模型准确率是低损失值的直接结果——因为模型已经学到了良好的数据表征，能够产生与真实情况匹配的良好预测。\n\
  \n在示例中，验证损失值每一步都在下降：这是模型正在学习的迹象。（由于我们刚开始训练，这是预期中的情况。）如果你查看最后几个周期的日志，会发现损失值几乎保持不变。\n\
  \n```\nEpoch 57/60\n5/5 - 0s - loss: 0.0092 - accuracy: 1.0000 - val_loss: 0.0022\
  \ - val_accuracy: 1.0000 - 61ms/epoch - 12ms/step\nEpoch 58/60\n5/5 - 0s - loss:\
  \ 0.0090 - accuracy: 1.0000 - val_loss: 0.0022 - val_accuracy: 1.0000 - 29ms/epoch\
  \ - 6ms/step\nEpoch 59/60\n5/5 - 0s - loss: 0.0088 - accuracy: 1.0000 - val_loss:\
  \ 0.0021 - val_accuracy: 1.0000 - 61ms/epoch - 12ms/step\nEpoch 60/60\n5/5 - 0s\
  \ - loss: 0.0087 - accuracy: 1.0000 - val_loss: 0.0021 - val_accuracy: 1.0000 -\
  \ 28ms/epoch – 6ms/step\n```\n\n这表明我们训练的周期过多，正在浪费时间，因为模型已经达到了一个*平台期*。更严重的是，对于某些数据集，模型可能开始过拟合，导致准确率下降！\n\
  \n注意\n\n训练模型时，请密切关注验证损失值，以发现过度训练和过拟合的迹象！\n\n第 8 章将深入探讨不同的神经网络架构，但让我们先简要了解一下什么是全连接神经网络（FCNN），以及\
  \ Edge Impulse 中的*密集*层代表什么。\n\n### 全连接神经网络\n\n人工神经网络是一种受人类大脑结构和功能启发的数据结构。神经网络是一个由相互连接的节点或*神经元*组成的复杂系统，用于处理和传输信息。每个神经元接收一个或多个输入，对这些输入执行计算，然后将输出发送给其他神经元。这个过程使网络能够学习并表征数据中的复杂模式。神经元（基本组件）被组织成*层*，一层接一层地堆叠。全连接神经网络的特点是，第\
  \ *n* 层的每个神经元都与第 *n* + 1 层的每个神经元相连（见图 4-18）。\n\n![](img/619308_1_En_4_Fig18_HTML.jpg)\n\
  \n神经网络示意图，各部分已标注。左侧两个绿色圆圈代表输入节点，通过线条连接到中间层五个蓝色圆圈，该层标记为“层”。这些蓝色圆圈又连接到右侧一个黄色圆圈，标记为“输出”。箭头表示信息从输入到输出的流向。\n\
  \n图 4-18\n\n全连接神经网络\n\n#### 感知器的结构\n\n神经元，也称为*感知器*，是全连接神经网络的基本构建块。它由四个主要部分组成。\n\n\
  *   **输入**：神经元从前一层（如果是第一层，则来自输入样本）接收一个或多个输入值。\n*   **权重**：每个输入都关联一个权重，该权重决定了该输入在计算中的重要性。\n\
  *   **偏置**（可选）：每个神经元可以引入一个固定偏移量来调整其输出值。\n*   **激活函数**：当使用线性权重时，该函数引入非线性，使我们能够学习更复杂的关系。\n\
  \n神经元的输出使用以下公式计算。\n\n![$$ output= activation\\left(\\sum \\left( inputs\\cdotp weights\\\
  right)+ bias\\right) $$](img/619308_1_En_4_Chapter_TeX_Equa.png)\n\n#### 什么是密集层？\n\
  \n密集层是由其中神经元数量定义的一组感知器。考虑到全连接，你必须记住，密集层的权重数量随其输入和神经元的数量线性增长。一个具有 20 个输入和 30 个神经元的密集层存储了\
  \ 600 个权重。\n\n现在你已经了解了什么是密集层，以及神经元数量如何影响网络规模，可以随意尝试不同的层组合，直到在规模（越小越好）和准确率（越高越好）之间找到最佳平衡点。\n\
  \n## 测试\n\n如果训练页面上的混淆矩阵符合你的预期，请转到模型测试页面（从左侧菜单进入），以评估模型在训练或验证期间从未见过的样本上的准确率。点击 **全部分类**\
  \ 按钮并等待结果。在最佳情况下，所有行都是绿色的（表示完美预测）。像我们这样的现实场景，结果可能看起来比训练时更差。这完全正常且符合预期。\n\n请记住，你在验证数据上获得的准确率是对模型泛化到新数据真实能力的高估，因此此页面对于决定你是否对模型满意至关重要。完全有可能训练页面上\
  \ 100% 的准确率在测试集上变成 80% 或更低。这可能是过拟合的迹象，你需要采取措施来应对（例如，调整频谱特征步骤或网络架构）。\n\n在我的案例中，测试集上的准确率仍然是\
  \ 100%，因此我继续进行部署。\n\n\n\n## 部署\n\n至此，训练流程已完成，你可以将模型从云端迁移到你的设备上。点击左侧菜单中的**部署**，并将脉冲导出为\
  \ Arduino 库（见图 4-19）。\n\n![](img/619308_1_En_4_Fig19_HTML.jpg)\n\n该图片展示了一个用于配置部署的软件界面。其中包含一个已选中“Arduino\
  \ 库”的搜索栏，以及一个标有“已选部署”并突出显示 Arduino 库的区域。文字说明指出，部署功能可使模型无需联网即可在任何设备上运行，从而最大限度地降低延迟和功耗。此外，还有一个“阅读更多”链接。\n\
  \n图 4-19\n\nEdge Impulse 导出\n\n这将下载一个 ZIP 文件。将压缩包内的内容解压到你的 Arduino IDE 库文件夹中。该库的名称为\
  \ `<项目名称 _inferencing>`（在我的例子中是 `continuous-motion_inferencing`）。\n\n注意\n\n如果你想重命名该库，请记得同时重命名文件夹\
  \ *和* src 文件夹内的 .h 文件。\n\n现在，Edge Impulse 模型已是一个库，是时候修改最初仅用于捕获数据的初始草图，以集成分类部分了。创建一个名为\
  \ `Continuous_Motion_Classification.ino` 的新草图，并粘贴代码清单 4-5 中所示的代码。\n\n注意\n\n代码清单\
  \ 4-5 假设你的库名为 `continuous-motion_inferencing`。如果你生成的库名称不同，请将其替换为正确的名称。\n\n```\n\
  /**\n* 代码清单 4-5：在 IMU 数据上运行 Edge Impulse 模型\n*\n* 所需硬件：Arduino Nano BLE Sense\n\
  */\n// 下一行 *必须* 与 EI Studio 中脉冲设计页面的窗口增量值匹配\n#define EI_CLASSIFIER_SLICES_PER_MODEL_WINDOW\
  \ (1000 / 250)\n#include \n#include \n#include \nusing tinyml4all::printCSV;\ntinyml4all::LSM9DS1\
  \ imu;\ntinyml4all::Impulse impulse;\nvoid setup() {\nSerial.begin(115200);\nwhile\
  \ (!Serial);\nSerial.println(\"使用 Edge Impulse 进行运动分类\");\nimu.begin();\n// 初始化\
  \ EI 模型（失败时会抛出错误）\nimpulse.begin();\n}\nvoid loop() {\n// 读取加速度计和陀螺仪数据\nimu.readAcceleration();\n\
  imu.readGyroscope();\n// 将数据加入队列\nimpulse.queue(\nimu.ax, imu.ay, imu.az,\nimu.gx,\
  \ imu.gy, imu.gz\n);\n// 当数据窗口填满时，运行预测\n// 否则返回\nif (!impulse.isReady())\nreturn;\n\
  Serial.print(\"正在运行预测... \");\n// 运行推理\nif (!impulse.run()) {\nSerial.println(impulse.error());\n\
  return;\n}\n// 打印结果\nSerial.print(\"预测的运动是 \");\nSerial.print(impulse.label());\n\
  Serial.print(\"，置信度为 \");\nSerial.println(impulse.confidence());\n}\n代码清单 4-5\n\
  在加速度计数据上运行脉冲\n```\n\n编译并上传该草图，然后打开串口监视器查看实时预测流（见图 4-20）。\n\n![](img/619308_1_En_4_Fig20_HTML.jpg)\n\
  \n一个终端窗口显示了使用 Edge Impulse 的运动分类结果。文本中反复出现置信度较高的“空闲”预测（以红色高亮显示），随后是置信度各异的“摇晃”预测（以蓝色高亮显示）。界面包含自动滚动、显示时间戳和设置波特率等选项。\n\
  \n图 4-20\n\n推理串行输出\n\n注意\n\n编译时间可能较长。在我的 Intel MacBook Pro 上，需要三到四分钟！\n\n恭喜！你已经完成了第一个\
  \ Edge Impulse 项目。\n\n希望这是一个流畅的过程，你可以在未来的项目中轻松复制。如果你感到迷茫，请回到本章，将其作为参考和分步指南。\n\n\
  注意\n\n生成的模型在我的 Arduino Nano BLE Sense 上运行大约需要 90 毫秒。该值将作为下一章的基准，下一章仅实现时域特征，以比较它们在执行时间上的差异。\n\
  \n请访问在线资料库，观看实时分类的视频演示。\n\n### Edge Impulse 的不足之处\n\nEdge Impulse 是一个很棒的平台。我经常使用它，并且对其生成的模型质量感到惊叹。尽管如此，仍有一些不足之处让我感到困扰（不是平台本身的问题，而是\
  \ Arduino IDE 方面的问题）。\n\n#### 令人痛苦的漫长编译时间\n\nEdge Impulse 底层使用了 TensorFlow。这意味着每次编译项目时，TensorFlow\
  \ 也需要被编译。编译需要时间，因为它本身拥有庞大的代码库。非常长的时间。当你在开发阶段需要频繁修改代码时，这会很快变得令人厌烦。即使在第一次编译之后，当 Arduino\
  \ IDE 创建了一些缓存工件来加速过程时，编译你的草图可能仍需要大约一分钟。\n\n#### 缓存失效问题\n\n假设你训练了一个模型，将其部署到开发板上，发现其性能不佳。然后，你返回\
  \ Edge Impulse，用不同的配置训练一个新模型以提高其准确性。你下载新的 ZIP 库，替换旧的，然后再次编译你的草图。\n\n猜猜结果如何？你仍然在使用旧模型！尽管这有悖常理，但事实确实如此。这是因为\
  \ Arduino IDE 会构建缓存以加速编译过程。这个缓存会一直存在，直到你重启 IDE。由于缓存实现的机制，IDE 无法检测到库中的文件已更改（因为它们都具有相同的名称），因此它会继续重用缓存的版本。要强制使用新版本，你必须完全重启\
  \ IDE。这意味着你必须等待。\n\n*   启动 IDE 所需的时间\n*   首次编译 TensorFlow 所需的时间（3–4 分钟）\n\n我不知道你怎么样，但这种等待严重影响了我的工作效率。\n\
  \n尽管如此，我仍然认为 Edge Impulse 模型是你的 TinyML 项目的一个绝佳选择。\n\n## 总结\n\n时间序列是处理 TinyML 项目时常见的数据类型。它涵盖了所有数据随时间变化的项目（加速度计、温度、EMG），而能够对这些数据进行分类则开辟了广泛的可能性。\n\
  \n本章介绍了 Edge Impulse 平台，这是一个低代码工具，使你能够直观地创建准备部署的高级机器学习模型。在底层，它使用了频域特征（傅里叶变换）和 TensorFlow，从而实现了顶尖的准确性。得益于\
  \ `tinyml4all` Arduino 库，只需几行代码即可将这些模型集成到你的 Arduino 项目中。\n\n下一章将演示如何使用时域特征和“经典”机器学习模型对时间序列数据进行分类。这将产生一个更轻量级的分类流程，其功能足以获得令人满意的结果。\n\
  \n\n\n"
- "# 5. 使用 Python 进行时间序列分类\n\n第 4 章介绍了时间序列分类问题。通过利用 Edge Impulse 这样的低代码工具，我们无需深入傅里叶变换和功率谱特征提取的细节，就成功部署了一个分类模型。此外，用作分类器的神经网络对我们来说就像一个黑盒，我们只需完成配置层数和层宽度的强制性任务（你甚至可以配置\
  \ Python 代码来定义和训练模型，但这属于“专家”模式，超出了这本入门书的范围）。\n\n本章将采用更*偏向代码*的方式，探索如何使用时域特征构建一个优秀的时间序列分类流程，并介绍新的特征工程算子。最后一步，我们将选定的流程导出为纯\
  \ C++ 代码（如第 2 章和第 3 章所示），以便嵌入到任何 Arduino 项目中。\n\n本章的项目是为我们的 PC 制作一个媒体控制板。\n\n以下是您期望从媒体控制设备获得的常见操作。\n\
  \n*   **提高/降低音量**：沿着触控板假想的垂直轴向上（提高）或向下（降低）滑动手指。\n\n*   **下一首/上一首**：沿着触控板假想的水平轴向左（下一首）或向右（上一首）滑动手指。\n\
  \n*   **播放/暂停**：轻触触控板中央。\n\n让我们借助一个小磁铁，在平坦表面（例如桌面）上执行这些手势（见图 5-1）。\n\n![](img/619308_1_En_5_Fig1_HTML.jpg)\n\
  \n图示展示了一个设备的三个触控感应区域。第一个区域标有“下一首”，显示一个表示滑动手势的水平箭头。第二个区域标有“音量+”，显示一个表示向上滑动手势的垂直箭头。第三个区域标有“暂停”，显示表示点击手势的同心圆。每个区域都连接着一块电路板。\n\
  \n图 5-1\n\n手势示例\n\n## 硬件需求\n\n你可以像第 4 章那样，在本项目中使用加速度计和陀螺仪数据，但让我们尝试改变一下所处理数据的性质。这次，我们改用\
  \ Arduino Nano BLE Sense 内置的磁力计。第 4 章提到的许多惯性测量单元（IMU）传感器都内置了这种传感器，因此你不需要外部硬件。一个贴在指尖的小磁铁就能以可测量的方式干扰地球磁场；这种扰动（在\
  \ *x*、*y* 和 *z* 轴上）就成为了我们的输入数据。\n\n对于本项目，你需要以下物品。\n\n*   一个带有磁力计的 IMU（例如 Arduino\
  \ Nano BLE Sense 上的那个）或一个外部磁力计传感器\n\n*   一个小磁铁\n\n*   一个用作触控板的平坦表面\n\n提示\n\n请参考在线资料库，查看本设置的视频演示。\n\
  \n## 捕获数据\n\n本节与第 4 章的类似部分有很多共同点，因为我们仍然在随时间收集传感器数值。然而，第 4 章侧重于*连续运动*，而本项目处理的是*片段式运动*——即只执行一两次、而非连续进行的手势和动作。*不要低估这个差异*，因为正如你稍后将看到的，它意义重大。\n\
  \n以下是从我们的开发板上收集数据的步骤。\n\n1.  读取 IMU（特别是磁力计数据）。\n\n2.  将 CSV 编码的数据打印到串口监视器。\n\n3.\
  \  在 Python 中将数据收集为 CSV 文件。\n\n代码清单 5-1 包含了 Arduino 草图。\n\n```\n/**\n* 代码清单 5-1：读取磁力计数据\n\
  *\n* 所需硬件：Arduino Nano BLE Sense。\n*/\n#include \n#include \nusing tinyml4all::printCSV;\n\
  tinyml4all::LSM9DS1 imu;\nvoid setup() {\nSerial.begin(115200);\nwhile (!Serial);\n\
  Serial.println(\"以 CSV 格式收集磁力计数据\");\n// 初始化 IMU 传感器（失败时会抛出错误）\nimu.begin();\n}\n\
  void loop() {\n// 读取磁力计\nimu.readMagneticField();\nprintCSV(millis(), imu.mx, imu.my,\
  \ imu.mz);\n// 无手动延迟，默认采样率约为 80 Hz\n}\n代码清单 5-1\n收集磁力计数据草图\n```\n\n你可以通过打开串口绘图仪并将磁铁靠近开发板来调试输出。你会看到绘图线根据磁铁的位置而弯曲（见图\
  \ 5-2）。\n\n![](img/619308_1_En_5_Fig2_HTML.jpg)\n\n一张折线图显示了随时间变化的三组数据，分别标为红色的“Collect”、蓝色的“Magnetometer”和绿色的“CSV”。红线显示出显著的波动，有两个突出的峰值；蓝线有中等程度的变化；绿线相对稳定，有轻微下降。x\
  \ 轴代表时间，y 轴显示范围从 -100.0 到 100.0。界面包括一个设置为“115200 波特率”的下拉菜单和一个“发送”按钮。\n\n图 5-2\n\n\
  存在磁铁时磁力计的串口绘图\n\n为了舒适地轻松执行这些操作，请使用胶带将磁铁固定在食指指尖。\n\n确认草图正常工作后，创建一个新的 Python 脚本。代码清单\
  \ 5-2 几乎是代码清单 4-2 的复制品，但调整了列的名称。\n\n```\nfrom tinyml4all.time import capture_serial\n\
  while True:\n# 提示用户输入手势标签和采样时长\ngesture = input(\"这是哪种媒体控制手势？ \")\nduration = input(\"\
  需要捕获多少秒？ \")\n# 当标签或时长为空时退出\nif not gesture or not duration:\nbreak\ncapture_serial(\n\
  # * 是通配符，可匹配任何内容\n# 在 Windows 上，它看起来像 COM1 或类似名称\nport=\"/dev/cu.usb*\",\nbaudrate=115200,\n\
  # 目标文件\nsave_to=f\"media-control/{gesture}.csv\",\nduration=f\"{duration} 秒\",\n\
  # 列的名称\nheadings=\"millis, mx, my, mz\"\n)\n代码清单 5-2\n在 Python 中从串口捕获数据\n```\n\n\
  要运行代码，请在脚本所在文件夹中打开终端，激活虚拟环境，然后输入。\n\n```\n(tinyml)$ python capture_magnetometer.py\n\
  准备好后按 [Enter] 键开始：\n这是哪种媒体控制手势？ volume-up\n需要捕获多少秒？> 60\n任务将在 3...2...1...开始！\n\
  已连接到串口\n100%|██████████| 60/60 [00:60<00:00,  1.00s/it]\n已收集 1085 行数据\n```\n\n注意\n\
  \n始终记得记录一个*空闲*类别！开始记录并保持不动，或者稍微移动一点。\n\n图 5-3 展示了一些记录的手势。除了第一个（*空闲*类别），你应该能在每个子图中看到每个手势重复几次。\n\
  \n![](img/619308_1_En_5_Fig3_HTML.jpg)\n\n一张折线图显示了四个部分，分别标有“idle.csv”、“next.csv”、“tap.csv”和“volumeup.csv”，每个部分都有阴影背景。图表显示了紫色、橙色和粉色三条线，代表不同的数据集。x\
  \ 轴显示从 11:08:35 到 11:09:55 的时间戳，而 y 轴范围从 -400 到 400。紫色线显示出显著的波动，尤其是在“volumeup.csv”部分，表明活动增加。橙色和粉色线变化较小。右上角的图例将颜色标识为“acc”、“gyro”和“mag”。\n\
  \n图 5-3\n\n媒体控制手势的时间序列图\n\n\n\n## 数据标注\n\n虽然这一步在第 4 章中是“自动”完成的，但现在必须手动完成。如果你的数据量很大，这可能会很繁琐，但请记住，数据集准备（收集和标注）通常很耗时。不过，输入数据的质量越高，分类结果的质量也就越高。\n\
  \n`tinyml4all` Python 包附带了一个简单的内置时间序列标注工具，可在浏览器中运行。要启动它，我们首先需要加载时间序列数据（列表 5-3）。\n\
  \n```\n# 注意，包已从连续型\n# 变为事件型！\nfrom tinyml4all.time.episodic.classification import\
  \ TimeSeries\nts = TimeSeries.read_csv_folder(\"media-control\")\n# 运行标注图形界面\nts.label_gui()\n\
  列表 5-3\n加载并标注时间序列数据\n```\n\n一个新的浏览器窗口会打开，显示时间序列的图表以及如何标记感兴趣事件的说明。简而言之，你只需在事件的中间点击一下；就会出现一个标记来确认。对每个事件、每个媒体控制手势重复此过程（见图\
  \ 5-4）。\n\n![](img/619308_1_En_5_Fig4_HTML.jpg)\n\n一张时间序列图，显示了在 11:43:15 到 11:43:50\
  \ 时间段内标记为 mx、my 和 mz 的三条数据线。mx 线为紫色，有尖锐的波峰和波谷，表示数值波动。my 线为橙色，趋势相对稳定，变化较小。mz 线为红色，有规律的尖峰，每个峰值处用黄点标记。背景为浅紫色阴影，底部可见文件名\
  \ \"next.csv\"。\n\n图 5-4\n\n时间序列标注事件\n\n完成标注工作后，复制“输出”选项卡（页面底部）中的内容，粘贴到一个名为 `labels.json`\
  \ 的新文件中（或点击下载图标），并将其移动到 `media-control` 文件夹内。按照此约定，下次加载数据时，`TimeSeries.read_csv_folder`\
  \ 函数会自动拾取这些标签。\n\n注意\n\n你可能会在数据文件夹中发现一个或多个 PKL 文件。它们由 `tinyml4all` 库自动创建，包含时间序列数据的紧凑表示。不要删除它们，因为它们可以在你多次运行代码时加快加载速度。\n\
  \n通过运行列表 5-4 中所示的 Python 代码来确认这一点。\n\n```\nfrom tinyml4all.time.episodic.classification\
  \ import TimeSeries\nts = TimeSeries.read_csv_folder(\"media-control\")\nprint(ts.events)\n\
  事件 [音量增大 (时长=800ms, 数量=24), 音量减小\n(时长=800ms, 数量=22), 下一首 (时长=800ms, 数量=22), 返回\n\
  (时长=800ms, 数量=23),) 轻触 (时长=500ms, 数量=24)]\n列表 5-4\n加载带有标签和事件的时间序列数据\n```\n\n## 特征工程\n\
  \n本章将手动进行时间序列特征工程。在这种情况下，什么才是好的特征？通常，我们希望处理输入数据，以便链末端的分类器能够轻松地对其进行分类。\n\n我们经常处理多维数据（由多次测量组成）：加速度计、陀螺仪和磁力计各由三个通道组成；EMG（肌电图）数据通常由三个或八个通道组成；光传感器输出\
  \ R、G、B 值。让我们单独考虑每个测量值/维度；特征沿着每个维度提取，并且不同维度的值从不混合。因此，本章其余部分将重点分析单个时间序列。对于多维输入数据，我们对每个维度重复相同的分析，并最终将每个维度的特征连接起来，形成一个单一的特征向量。\n\
  \n注意\n\n一些表格数据的特征工程方法也可能适用于时间序列数据。例如，归一化仍然是一项建议执行的操作。而离散化和幂变换（参见附录 A）在这种新背景下则意义不大。\n\
  \n### 统计矩\n\n统计矩是表征函数形状的值。如果你具备一些统计学知识，应该对它们很熟悉。\n\n*   **均值**：数据集的平均值。通过将所有值相加并除以数据点的数量来计算。均值代表数据的集中趋势。\n\
  \n*   **标准差**：衡量数据相对于均值的离散程度。通过计算每个数据点与均值之差的平方的平均值，再取平方根得到。标准差越大，表示数据的变异性越大。\n\n\
  *   **偏度**：衡量数据分布不对称性的指标。正偏度表示分布的尾部向右延伸更多，而负偏度表示向左延伸更多。偏度为零表示对称分布。\n\n*   **峰度**：衡量数据分布*尾部密度*的指标。它描述了与正态分布相比，尾部的厚重程度。高峰度表示存在更多极端异常值（许多样本远离均值），而低峰度则表示异常值较少。正态分布的峰度为\
  \ 3。\n\n这组指标还包括序列的*最小值*和*最大值*。\n\n### 自相关\n\n自相关衡量时间序列在不同时间点与自身的相似程度。它告诉我们时间序列中的当前值与其过去值的相关程度。在自相关中，*滞后*指的是当前观测值与过去观测值之间的时间差。例如，`lag=1`\
  \ 表示将每个数据点与其紧邻的前一个数据点进行比较，`lag=2` 表示将其与两个时间步前的点进行比较，依此类推。\n\n自相关可以是正的（数值随时间趋向于同向移动）或负的（数值趋向于交替方向）。自相关的强度范围从\
  \ –1 到 1，其中 1 表示完全正相关，–1 表示完全负相关，0 表示不相关。它是一个很好的特征描述符，因为它能捕捉短期模式，无论数据的尺度如何（因为它基于差值）。\n\
  \n### 形状指标\n\n最后，其他描述符对于准确分类也可能变得有用。\n\n*   **峰值数量**：序列中有多少个峰值（最小值或最大值）？这个数字越高，序列越不平坦。\n\
  \n*   **高于/低于均值的计数**：有多少样本的值大于/小于均值？\n\n所有这些描述符都可以从单个时间序列中提取。如果时间序列覆盖了数百个样本的持续时间，这些值可能无法捕捉其完整的潜在模式。因此，让我们使用*窗口化*方案，将长的输入片段分解成更短的、重叠的块。\n\
  \n\n\n### 窗口化\n\n窗口化是时间序列分类的核心操作。该过程将一长串数值重新排列成多个固定长度的子列表，然后针对每个窗口计算时域特征。这一过程生成的**特征向量**更密集（能以更精细的粒度捕捉模式），有助于提升分类准确率。定义窗口时，实际上需要配置两个参数。\n\
  \n*   **长度**：一个窗口包含的样本数量\n*   **步长**：窗口填满后，丢弃多少个样本以容纳新样本\n\n步长参数可视为*速率限制*：步长越短，分类频率越高。这能更快响应数据变化，若对输出应用移动平均（避免误分类），效果尤佳。反之，大步长意味着更少的\
  \ CPU 计算量，可腾出时间处理其他任务（如有需要）。\n\n为了获得*更密集*的特征，还可以将数据先切分为中等窗口（例如两秒），再对每个窗口进行二次切分（例如\
  \ 400 毫秒子窗口）。处理复杂输入数据时，这种方法应能提升分类准确率。在本项目中，磁力计采样频率为每秒 80 个样本，事件持续时间不足一秒。二次切分不会产生显著差异，但为演示起见，代码清单\
  \ 5-5 使用了 200 毫秒的子窗口。若设置了子窗口时长，该值即成为窗口步长；否则需手动指定该值。\n\n### 一对多\n\n根据具体项目，可能所有类别共享相同时长（最简单的情况），也可能时长不同（鲜有人提及但现实中常见的情况）。为适配所有项目，`tinyml4all`包将所有片段式时间序列分类任务视为*一对多*问题——即使所有标签长度相同。\n\
  \n回顾第 1 章，一对多意味着训练多个分类器，每个类别对应一个。每个分类器的目标是学习区分目标类别与其他类别（例如本例中的“音量增大”与“非音量增大”）。这会在后台引入大量复杂性，但为了妥善处理不同用例，这是必须的。\n\
  \n## 片段式时间序列分类链\n\n现在所有组件已就绪，是时候组装一个操作链了：对时间序列输入数据进行预处理、重排为窗口、提取特征并分类。\n\n这次，`Chain`类采用了更结构化的格式，模拟所需的不同部分。\n\
  \n*   `pre`（预处理）：无论输入数据标签如何都应用的步骤列表（例如缩放、归一化、分箱）。此为可选。\n*   `chunk`：定义子窗口时长。此为可选。\n\
  *   `features`：负责从每个窗口（或子窗口）提取特征的步骤（或步骤列表）。`tinyml4all`库内置了一些特征提取方法（如本章前述），但也可根据需要自行实现。此为必选。\n\
  *   `ovr`：在数据的二值视图（目标类别 vs. 非目标类别）上执行特征提取后运行的步骤列表。此处放置分类器及任何其他合适的步骤（例如特征选择）。此为必选。\n\
  \n代码清单 5-5 使用以下配置实例化了一个链。\n\n*   最小-最大归一化\n*   200 毫秒子窗口\n*   时域特征提取\n*   特征选择\n\
  *   随机森林分类器\n\n```\nfrom tinyml4all.time.episodic.classification import TimeSeries,\
  \ Chain\nfrom tinyml4all.time.episodic.features import Window\nfrom tinyml4all.time.features\
  \ import Scale, Moments, Autocorrelation, Peaks, CountAboveMean, Select\nfrom tinyml4all.time.models\
  \ import RandomForest\nts = TimeSeries.read_csv_folder(\"media-control\")\nchain\
  \ = Chain(\npre=[Scale(\"minmax\")],\nwindow=Window(chunk=\"250ms\", features=[Moments(),\
  \ Autocorrelation(), Peaks(), CountAboveMean()],\novr=[\nSelect(sequential=\"auto\"\
  ),\nRandomForest()\n]\n)\ntables = chain(ts)\n# 一对多分类生成 N 个二值表\n# 类别为 \"\" 和 \"\
  非\"\nfor table in tables:\nprint(table.classification_report())\nprecision    recall\
  \  f1-score   support\n非音量增大       1.00      1.00      1.00       230\n音量增大    \
  \   1.00      1.00      1.00        26\naccuracy                           1.00\
  \       256\nmacro avg       1.00      1.00      1.00       256\nweighted avg  \
  \     1.00      1.00      1.00       156\n+-------------------+---------------+-----------+\n\
  | 真实值 vs 预测值   | 非音量增大     | 音量增大   |\n+-------------------+---------------+-----------+\n\
  |   非音量增大       |      230      |     0      |\n|     音量增大       |       0     \
  \  |    26      |\n+-------------------+---------------+-----------+\n代码清单 5-5\n\
  片段式时间序列分类流水线\n```\n\n等等，似乎有些不对劲！我们处理的是时间序列，为什么`chain`调用返回的是表格？因为我们从每个数据窗口中提取了一组特征，用少量指标描述了整个数据块。时间仅用于根据时间戳将样本分组到窗口中。特征提取后，时间维度便不再具有实际意义。\n\
  \n注意\n\n使用“传统”机器学习模型时，始终需要将数据重构为表格形式，因为这是这些模型设计处理的数据格式。第 8 章将说明，可以创建直接处理时序数据的神经网络架构。\n\
  \n\n\n## 部署到 Arduino\n\n至此，训练工作流程已完成。我们在强大的台式电脑上实现了特征工程和分类；分类器达到的准确率符合我们的预期。现在轮到*微小*的部分登场了。最后一步是将我们的链最终转换为\
  \ C++，以便将代码导入嵌入式项目。清单 5-6 展示了如何生成此类代码。\n\n```\nchain.convert_to(\"c++\", class_name=\"\
  MediaControlChain\", save_to=\"MediaControlChain.h\")\n清单 5-6\n将时间序列分类流水线从 Python\
  \ 转换为 C++\n```\n\n将生成的文件复制到项目文件夹内，以便在草图中运行分类。然后，上传清单 5-7 中的代码。此草图利用了 Arduino Nano\
  \ BLE Sense 的 USB HID 功能，使开发板能够充当连接到电脑的键盘，模拟按键操作。如果你使用的是不支持此协议的其他开发板，则必须设计不同的执行逻辑（例如，通过串口发送命令，并编写一个在电脑上运行的脚本进行解码，或通过\
  \ BLE 发送）。\n\n```\n/**\n* 清单 5-7：使用时域特征预测媒体控制手势\n*\n* 所需硬件：Arduino Nano BLE Sense\n\
  */\n#include \n#include \n#include \n#include \n// 这是之前生成的文件\n#include \"./MediaControlChain.h\"\
  \ntinyml4all::LSM9DS1 imu;\ntinyml4all::MediaControlChain chain;\nUSBKeyboard keyboard;\n\
  void setup() {\nSerial.begin(115200);\nwhile (!Serial);\nSerial.println(\"预测媒体控制手势\"\
  );\n// 初始化 IMU 传感器\nimu.begin();\n}\nvoid loop() {\n// 读取磁力计\nimu.readMagneticField();\n\
  // 尝试运行预测\n// 如果窗口未满，将返回 false\nif (!chain(imu.mx, imu.my, imu.mz))\nreturn;\n//\
  \ 此处链运行成功\n// chain.output.classification.idx 保存最可能的类别索引\n// chain.output.classification.label\
  \ 保存最可能的类别标签\n// 忽略空闲类别\nif (chain.output.classification.label == \"idle\")\nreturn;\n\
  // 打印推断出的手势\nSerial.print(\"预测到 \");\nSerial.print(chain.output.classification.label);\n\
  Serial.print(\"，置信度为 \");\nSerial.println(chain.output.classification.confidence);\n\
  // 根据标签触发按键\nif (chain.label == \"tap\")\nkeyboard.media_control(KEY_PLAY_PAUSE);\n\
  else if (chain.label == \"next\")\nkeyboard.media_control(KEY_NEXT_TRACK);\n// 以此类推...\n\
  // 可用按键列表，请访问\n// https://github.com/arduino/ArduinoCore-mbed/blob/main/libraries/USBHID/src/USBKeyboard.h\n\
  }\n清单 5-7\n使用手势控制媒体的 Arduino 草图\n```\n\n打开串口监视器，开始执行媒体控制手势。你应该会看到类似于图 5-5 所示的输出。\n\
  \n![](img/619308_1_En_5_Fig5_HTML.jpg)\n\n一个终端窗口显示了对媒体控制手势的预测及其相关置信度。预测结果包括置信度分数为\
  \ 0.89 和 0.87 的“next”，以及分数为 0.83 和 0.79 的“tap”。界面包含自动滚动、显示时间戳和设置波特率的选项。\n\n图 5-5\n\
  \n媒体控制手势预测输出\n\n预测时间约为 4 毫秒。与 Edge Impulse 模型的 90 毫秒相比，你可以体会到这种方法快了多少（缺点是通常准确率较低）。\n\
  \n提示\n\n请参阅在线资料库，获取该项目实际运行的演示视频。\n\n## 总结\n\n本章通过利用一种以代码为中心的工作流程来处理时间序列分类任务，该流程采用了手动事件标记和时域特征。与基于傅里叶变换的低代码方法相比，这需要我们进行更多配置，但结果更轻量且速度更快。\n\
  \n准确率在很大程度上取决于你为训练收集的数据以及你想要分类的事件类型。连续运动因其持续时间长且模式重复而更容易检测。偶发的一次性事件则需要更精细、响应更快的模型，以便近乎实时地快速捕捉变化。这里介绍的链试图实现这样的结果。\n\
  \n下一章将介绍一种新的数据类型：音频。虽然从*技术*上讲，它仍然是一种时间序列（气压随时间的变化），但在实践中，音频因其高频率（通常为 8 或 16 kHz）以及人耳/大脑超越纯粹时间分析的特定解读方式，需要一个量身定制的处理框架。\n\
  \n"
- "# 6. 使用 Edge Impulse 进行音频唤醒词检测\n\n在 TinyML 和音频处理领域，音频唤醒词检测（即*关键词识别*，KWS）已成为实现设备免提交互的关键。从智能音箱到手机，KWS\
  \ 系统持续监听特定的唤醒词或命令。然而，在资源受限的设备上实现这些系统面临着独特的挑战，尤其是在高效处理原始音频数据方面。\n\n到目前为止，你处理的是代表传感器值的数值数据。这些值可以很好地组织成表格格式，无论是否带有时间戳（时间序列）。音频则是一种完全不同的数据类型。即使从技术角度来看，音频仍然是一种时间序列，但其内在含义远不止单纯的波形。人脑可以从音频信号中关联出比常规时间序列多得多的信息，并且我们能够从中检测出声音和词语。\n\
  \n本章致力于使用 Edge Impulse 低代码平台进行音频分类。你将简要了解如何使用数字微控制器捕获音频，哪些特征构成了语音分析的最先进描述符，以及如何从你的开发板检测特定词语。作为本章的参考项目，我们将构建一个广泛使用的语音助手设备（Alexa、Siri、Google\
  \ Home）的克隆版，这些设备仅限于其激活机制。你可以用“Hey Arduino”语音命令唤醒你的 Arduino 开发板，而不是“OK Google”（见图\
  \ 6-1）。\n\n![](img/619308_1_En_6_Fig1_HTML.jpg)\n\n一张桌子上放着键盘、笔记本和一罐笔。文字显示“HEY ARDUINO”，旁边有声波图形。右侧是一个说话的人形剪影。下方是一个\
  \ Arduino 开发板，上面有一个灯泡图标，表示语音激活。\n\n图 6-1\n\n音频唤醒词检测\n\n## 硬件要求\n\n你需要一个麦克风来从 Arduino\
  \ 开发板捕获音频。少数开发板内置了麦克风，包括：\n\n*   Arduino Nano BLE Sense、Arduino RP2040 Connect 和\
  \ Nicla Vision（PDM 接口）\n*   Seeed Studio Wio Terminal 和 LILYGO TTGO 系列（I2S 接口）\n\
  \n如果你没有这些开发板，可以购买一个外部麦克风并根据其要求进行连接。通常，用于 Arduino 开发板的麦克风有两种类型：\n\n*   **PDM（脉冲密度调制）**：音频波形编码在数字脉冲的密度中，需要专门的软件进行解码。它通常只处理单声道音频，每样本\
  \ 16 位。\n*   **I2S（集成电路内置音频总线）**：音频输出已经编码，因此无需进一步处理。Arduino 生态系统中的 I2S 麦克风通常可以处理立体声音频，每样本\
  \ 32 位。\n\n在订购前，请确保你购买的麦克风与你的开发板兼容！\n\n本章其余部分的代码清单假设你使用的是 Arduino Nano BLE Sense。你可以在本书的代码仓库中找到针对不同设备的更多示例。\n\
  \n\n\n## 软件需求\n\n根据你使用的麦克风类型，需要安装相应的 Arduino 库。我提到的 Arduino 板卡自带了 Arduino 核心的官方\
  \ `PDM.h` 库。其他厂商的板卡可能附带类似的库。使用 I2S 麦克风时，通常需要利用内置的 `I2S.h` 库。\n\n`tinyml4all` Arduino\
  \ 库为大多数常见配置提供了一些实用适配器，以消除不同型号之间的差异，但无法保证 100% 覆盖。\n\n在 Python 方面，你只需要 `tinyml4all`\
  \ 包（你应该已经安装好了）。\n\n## 捕获数据\n\n为了构建“Hey Arduino”唤醒词检测的数据集，我们需要对着板卡大声说出这些词至少 30 次并进行录制。这些样本构成了我们的*正*数据集。正如第\
  \ 1 章所强调的，分类任务需要预先知道所有类别。但我们这里只有一个类别，对吧？\n\n并非如此。\n\n事实证明，当处理只有单个*感兴趣类别*的问题时，你可以将其重新构建为一个二分类任务。这两个类别分别是感兴趣类别（“Hey\
  \ Arduino”）和*非*感兴趣/未知类别（除“Hey Arduino”之外的所有声音）。\n\n这个设定很重要，你需要意识到这一点。在训练过程中，你的分类器应该接触到所有可能的输入范围，才能变得可靠。如果你只让它看到有限的案例（例如，“Hey\
  \ Arduino”和静音），你怎么能期望它对一个未知的声音（例如，“谢谢”）做出正确响应呢？\n\n网上许多教程在这一点上都有所欠缺：它们只告诉你录制唤醒词和静音。如果你遵循那条路，模型很可能会对唤醒词以及几乎所有其他声音都做出响应，因为其他声音比静音更接近唤醒词。如果你不想花大量时间自己收集数据，一个可靠的方法是下载一个“野外声音”数据集，其中包含预先录制好的不同声音的音频样本（环境音、合成音或人声；例如，交通堵塞、洗碗机、铃声、动物吼叫声），稍后会重点介绍这一点。\n\
  \n提示\n\n由于这是一个生成式 AI 触手可及的时代，我还会向你展示如何利用文本转语音合成来生成人工训练数据，使你的模型能够更好地泛化到与你不同的声音。\n\
  \n考虑到这一点，在收集了 30 个正样本之后，让我们收集至少相同数量的*负*样本。它们可以是静音、噪音、Spotify 上的歌曲，或者是我们说出的不同于唤醒词的内容。最重要的是，这些样本应尽可能覆盖板卡在部署后、准备等待指定单词被说出时可能接收到的输入范围。\n\
  \n注意\n\n即使不是严格必要，我们也会建立一个包含三个类别的分类任务：*唤醒词、未知*（口语词汇）和*噪音*（环境声音）。这应该有助于模型更好地将相似的样本聚类到它们特定的类别中，而不是将所有内容合并到同一个标签下。\n\
  \n### 音频数据格式\n\n音频数据的传输速度非常快。例如，Arduino Nano BLE Sense 内置麦克风的采样频率为 16 kHz。这意味着每秒必须读取、存储和传输\
  \ 16,000 个值！由于生成的值是 16 位有符号整数（范围从 –32768 到 32767），从板卡传输到 PC 最紧凑的方式是二进制格式。如果我们采用\
  \ ASCII 编码（将它们写成纯数字）和 CSV 格式，每个值最终可能使用多达六个字符（五个数字，一个逗号）：这将浪费大量空间。\n\n这意味着数据捕获的复制粘贴方法被排除了。由于\
  \ Arduino Nano BLE Sense 没有 Wi-Fi 硬件或内置 SD 卡读卡器，我们也将忽略它们。（如果你愿意，仍然可以连接外部 SD 卡读卡器。）\n\
  \n剩下的唯一方法是使用 `tinyml4all` Python 库进行数据摄取。这次，我们不会为每个类别创建一个包含所有数据的单一文件。我们希望为每个音频样本创建一个单独的文件，以便手动检查其质量，并在桌面文件系统中轻松处理。\n\
  \nEdge Impulse 在浏览器中也内置了数据捕获机制。它对于从智能手机捕获数据特别方便，但要使用你的微控制器，你必须安装 Arduino CLI（命令行界面），并且除非你的浏览器支持\
  \ WebUSB 标准，否则你必须安装他们自己的 CLI。我们不会走这条路，但你可以浏览他们的文档以了解更多信息。\n\n### Arduino 草图\n\n\
  本节内容因你的板卡和麦克风而异。代码清单 6-1 适用于带有内置 PDM 麦克风的 Arduino Nano BLE Sense。你可以在本书的代码仓库中找到其他变体的更多示例。\n\
  \n该草图无需修改即可直接运行。你可能感兴趣更改的唯一参数是音量。它接受从 0（最小）到 100（最大）的值。音量越高，录制时你声音的强度就越大。\n\n注意\n\
  \n在高音量（70 及以上）时，你会开始听到失真，所以不要过度。\n\n```\n/**\n* 代码清单 6-1：从 PDM 麦克风收集音频数据。\n*\n*\
  \ 所需硬件：Arduino Nano BLE Sense\n* 所需硬件：或任何带有 PDM 麦克风的板卡\n*            （例如，Nano RP2040\
  \ Connect）\n*/\n#include \n#include \ntinyml4all::PDMicrophone mic;\nvoid setup()\
  \ {\n// 提高串口速度\nSerial.begin(115200 * 2);\nwhile (!Serial);\nSerial.println(\"收集音频数据\"\
  );\n// 参考板卡数据手册了解麦克风频率\n// （例如，Nano RP2040 Connect 频率为 21kHz）\nmic.frequency(\"\
  16 khz\");\n// 音量范围从 0 到 100\nmic.volume(30);\n// 配置麦克风\nmic.begin();\n}\nvoid loop()\
  \ {\n// 等待数据可用\nmic.await();\n// 通过串口发送\nmic.print();\n}\n代码清单 6-1\n用于从 PDM 麦克风捕获音频的\
  \ Arduino 草图\n```\n\n烧录草图后，通过打开串口监视器确认板卡正在通过串口传输音频数据。输出看起来会像乱码，因为它是二进制数据，而不是文本（见图\
  \ 6-2）。重要的是有内容被打印出来。现在，是时候运行 Python 收集器脚本了。\n\n![](img/619308_1_En_6_Fig2_HTML.jpg)\n\
  \n一个显示乱码文本输出的终端窗口，这可能是由于编码或波特率设置不正确造成的。窗口包含自动滚动、显示时间戳和设置波特率（当前为 115200）的选项。界面有用于发送输入和清除输出的按钮。\n\
  \n图 6-2\n\n音频二进制串行输出\n\n\n\n### Python 代码\n\n在运行 Python 脚本（清单 6-2）之前，你必须配置几个参数。\n\
  \n*   你想要捕获的样本数量（不是秒数！）\n*   开发板连接到了哪个端口\n*   音频文件的存储位置\n*   唤醒词的持续时间\n*   捕获音频的频率\n\
  \n注意\n\n请仔细检查 Python 中的频率是否与你的麦克风匹配。例如，Arduino Nano BLE Sense 的采样频率为 16 kHz，而 Arduino\
  \ Nano Rp2040 Connect 的频率为 21 kHz。\n\n请仔细检查 Python 中的波特率是否与 Arduino 代码中的一致！\n\n\
  ```\nfrom tinyml4all.audio import capture_serial\nif __name__ == '__main__':\ncapture_serial(\n\
  # * 是通配符匹配\nport=\"dev/cu.usb*\",\nbaudrate=115200 * 2,\nnum_samples=30,\nword_duration=\"\
  2 seconds\",\nsave_to=\"wakeword\",\nmic_frequency=\"16 khz\"\n)\n清单 6-2\n在 Python\
  \ 中从串口捕获唤醒词\n```\n\n程序会提示你按 `[Enter]` 键确认开始捕获每个样本。确认后，请大声说出你的唤醒词。日志消息会告知你捕获的状态。\n\
  \n捕获非唤醒词的代码是相同的（见清单 6-3）。只需将文件保存到不同的文件夹即可。\n\n```\nfrom tinyml4all.audio import\
  \ capture_serial\nif __name__ == '__main__':\ncapture_serial(\nport=\"dev/cu.usb*\"\
  ,\nbaudrate=115200 * 2,\nnum_samples=30,\nword_duration=\"2 s\",\nsave_to=\"unknown\"\
  ,\nmic_frequency=\"16 khz\"\n)\n清单 6-3\n在 Python 中从串口捕获非唤醒词\n```\n\n运行这两个脚本。你应该会得到两个文件夹，每个文件夹内包含\
  \ 30 个音频文件。音频捕获过程可能并非完美无缺，因此请手动聆听每个样本以确认其质量良好。如果不好，请删除该文件并重新运行脚本。\n\n### 第三方数据集\n\
  \n自行收集数据通常需要大量的时间和精力。即使你收集了少量数据，模型也可能存在泛化能力不佳的风险。以我们的关键词识别项目为例，假设你将想要识别的唤醒词重复了 100\
  \ 次。这看起来是训练模型的合理数据量，对吧？是的，但前提是你能够容忍模型只识别你的声音！\n\n*泛化能力*是指模型识别除你之外其他人说出相同唤醒词的能力。这正是商用家庭助手的工作方式，因为它们面向大众市场。如果你想达到类似的泛化水平，就需要在数据量和多样性上投入更多。\n\
  \n一个快速简便的捷径是在线搜索现有的数据集。数据科学行业在数据共享方面很有帮助，因此网上可能已经存在与你当前项目相关的数据集，例如 Mozilla 的 Common\
  \ Voice（[`https://commonvoice.mozilla.org/en`](https://commonvoice.mozilla.org/en)）。这能极大地加快你的数据收集过程，并让你为数据增加高度的多样性。\n\
  \nEdge Impulse 为关键词识别问题提供了一个数据集 [1]。它包含了数百个 *Yes*、*No*、*Unknown*（既不是 *yes* 也不是 *no*\
  \ 的任何词）和 *Noise*（环境声音）类别的样本。我们对 *Yes* 和 *No* 文件不感兴趣，因为我们有自己的唤醒词，但我们会借用另外两个类别的文件。因此，请导航到数据集页面，下载\
  \ ZIP 文件并将其解压到你的电脑上。\n\n### 合成唤醒词生成\n\n人工智能在过去几年中已变得无处不在。随着大型语言模型的开发，生成式人工智能行业在科学领域正经历着高速增长。事实证明，我们也可以将生成模型用于我们的\
  \ TinyML 项目。\n\n借助当今主流的文本转语音合成工具，我们可以在几秒钟内快速生成大量音调、发音和音高的变体。我已经公开了一个数据集，其中包含数十个“Hey\
  \ Arduino”唤醒词的样本，你可以从本书的代码仓库中下载。\n\n接下来，让我们讨论如何生成这样的数据集。\n\n#### Azure 文本转语音\n\n\
  许多平台都提供文本转语音（TTS）工具。大多数是付费服务，但最大的平台——如 Microsoft Azure 和 Amazon Web Services——都提供免费套餐。`tinyml4all`\
  \ Python 包提供了一个基于 Azure TTS 服务的实现，因此你需要在他们的网站上注册并创建一个免费的云实例 [2]。\n\n完成后，你需要从 Azure\
  \ 仪表板获取两条信息（见图 6-3）。\n\n![](img/619308_1_En_6_Fig3_HTML.jpg)\n\n该图片显示了一个标题为“密钥和终结点”的部分，用于访问\
  \ Azure AI 服务 API。它包括一个标有“显示密钥”的蓝色按钮，以及两个字段“密钥 1”和“密钥 2”，出于安全考虑，两者均被隐藏。下方是设置为“westeurope”的“位置/区域”字段，以及显示为“https://westeurope.api.cognitive.microsoft.com/”的“终结点”字段。一条注释建议安全地存储密钥并定期重新生成。\n\
  \n图 6-3\n\nAzure 仪表板凭据\n\n*   **api_key**：一个用于标识你的字母数字字符串（*key1* 或 *key2* 均可）。\n\
  *   **region**：你的云实例所部署的数据中心。\n\n现在，你可以在几秒钟内生成两个不同的数据集：*唤醒词* 和 *未知词*。\n\n数据集生成过程分为以下几个步骤。\n\
  \n1.  对于输入语言，下载可用的合成语音列表。语音数量可能从英语的 56 种到小众语言的 2 种（男声和女声）不等。使用不同的语音可以使模型对不同人的音调和口音具有鲁棒性。\n\
  \n2.  生成 {语音、音高、语速、音量} 的组合元组，以进一步提高多样性。\n\n3.  使用每种组合从文本合成语音。\n\n对于英语，这可以迅速为给定的文本生成\
  \ 500 多个样本！\n\n##### 如何生成唤醒词数据集\n\n在这种情况下，我们在文本选择上受到限制。当然，我们只能生成我们想要识别的确切关键词。创建一个新的\
  \ Python 脚本，激活你的虚拟环境，并运行清单 6-4 中的代码。脚本运行完成后，你将在指定的文件夹中找到 30 个音频文件（完成时间应少于一分钟）。\n\
  \n注意\n\n请将粗体值替换为你自己的！\n\n```\nfrom tinyml4all.audio import synthesize_speech\nsynthesize_speech(\n\
  api_key=\"\",\nregion=\"\",\nlanguage=\"en-US\",\nsave_to=\"synthetic/wakeword\"\
  ,\ntext=\"Hey Arduino\",\n# 必须与清单 6-2 中的持续时间匹配\nduration=\"2 s\",\nfreq=\"16 khz\"\
  ,\nnum_samples=30,\n# 音高百分比变化\n# 负值表示降低音高\npitches=[0, -15, 15],\n# 语速百分比变化\n# 负值表示减慢\n\
  rates=[0, -10]\n)\n清单 6-4\n生成合成唤醒词\n```\n\n注意\n\n*duration* 和 *freq* 必须与你使用 Arduino\
  \ 开发板捕获真实数据时使用的值一致！\n\n\n\n##### 如何生成未知数据集\n\n在*未知*词汇方面，自由度更高。文本转语音只能合成口语词汇，无法生成环境音，因此我们随机选择一组与唤醒词时长相近的词汇。你可以随意输入尽可能多的变体，以便数据集能覆盖更多真实场景。清单\
  \ 6-5 中的代码与清单 6-4 几乎相同；唯一变化的参数是 `save_to` 文件夹和 `text`。\n\n```\nfrom tinyml4all.audio\
  \ import synthesize_speech\nsynthesize_speech(\napi_key=\"\",\nregion=\"\",\nlanguage=\"\
  en-US\",\nsave_to=\"synthetic/unknown\",\ntext=[\"Hello world\", \"Thank you\",\
  \ \"Good morning\"],\n# 必须与清单 6-2 中的时长匹配\nduration=\"2 s\",\nfreq=\"16 khz\",\n\
  num_samples=50,\n# 音高百分比变化\n# 负值表示降低音高\npitches=[0, -15, 15],\n# 语速百分比变化\n# 负值表示减慢语速\n\
  rates=[0, -10]\n)\n清单 6-5\n生成合成未知词汇\n```\n\n你可以根据需求生成任意数量的合成数据。我建议至少生成 50 个样本。\n\
  \n注意\n\n音频标签是根据文件最内层文件夹名称推断的。因此，请确保录制样本和合成样本共享相同的文件夹名称（*wakeword* 和 *unknown*）！\n\
  \n## 加载并检查数据\n\n批量可视化检查音频数据不如表格数据和时间序列数据直观。尽管单个音频样本可以像时间序列数据一样绘制（尽管只有一个维度——强度），但连续绘制多个样本存在几个缺点：图表会变得非常长（每秒\
  \ 16000 个样本 × 30 个样本 × 每个样本 2 秒，接近 100 万个数据点！），而且你无法轻松比较不相邻的样本。\n\n请记住，评估样本质量的最佳方法是逐个聆听，但你可以尝试通过将样本沿时间轴对齐并叠加绘制，来直观检查唤醒词的相似程度。这样，每个样本应呈现共同模式，异常值也更容易发现。为了便于识别（可能的）异常值，我们生成一个交互式图表（见图\
  \ 6-4），该图表会在你的网页浏览器中打开，并高亮显示鼠标悬停处的样本（见清单 6-6）。\n\n![](img/619308_1_En_6_Fig4_HTML.jpg)\n\
  \n该图像显示了两张比较音频波形的折线图。上方图表标记为“wakeword”，显示了一条密集且波动幅度大的波形，表明有显著的音频活动。下方图表标记为“not_wakeword”，显示了一条密度较低、幅度较小的波形，表明音频活动较少。两张图表均使用从紫色到橙色的渐变来表示强度。x\
  \ 轴代表时间，y 轴代表振幅。\n\n图 6-4\n\n音频样本重叠图\n\n```\nfrom tinyml4all.audio import Album\n\
  album = Album.read_wav_folders(\n\"wakeword\",\n\"unknown\",\n\"synthetic/wakeword\"\
  ,  \"synthetic/unknown\"\n)\n# 绘制样本（重叠）\nalbum.overlap_plot(\npalette=\"magma\"\
  ,\nsamples_per_class=50,\npoints_per_sample=1_000)\n清单 6-6\n从文件夹绘制音频文件（重叠）\n```\n\
  \n如果你仍想将每个样本单独绘制在单个图表中并依次排列，请参考清单 6-7。结果如图 6-5 所示。\n\n![](img/619308_1_En_6_Fig5_HTML.jpg)\n\
  \n一张标题为“音频样本”的波形图显示了两个音频数据段。第一段标记为“wakeword”，以蓝色显示，振幅峰值较高，表示声音较大。第二段标记为“not_wakeword”，以绿色显示，振幅峰值较低，表示声音较安静。x\
  \ 轴代表时间（以样本数计），范围从 0 到 32000；y 轴代表振幅水平，范围从 -1 到 1。左下角的图例通过颜色区分两个音频段。\n\n图 6-5\n\n\
  音频样本顺序图\n\n```\nalbum.sequential_plot(\npalette=\"viridis\",\nsamples_per_class=10,\n\
  points_per_sample=1_000)\n清单 6-7\n从文件夹绘制音频文件（顺序）\n```\n\n在图 6-4 中，两个类别的所有音频样本都沿同一时间轴对齐绘制。尽管每个样本的强度绝对值可能略有不同，但可以清晰地看到重复出现的模式。偶尔可能会有轻微的对齐偏差，但这完全在预期之内。将鼠标光标移到图表上即可高亮显示单个样本。\n\
  \n在图 6-5 中，唤醒词以蓝色显示，未知词以绿色显示。样本之间相互间隔，以提高可读性。你应该能看到唤醒词具有相似的形状（即使录制样本和合成样本之间存在差异）。*未知*样本则彼此不同。（前几个样本是静音，因此强度较低。）\n\
  \n我们的数据看起来不错，没有明显的样本损坏迹象。如果你的数据集并非如此，请删除损坏或明显错误的文件，并重新收集一些好的样本。\n\n### Edge Impulse\
  \ 数据采集\n\n收集到足够数量的高质量数据后，请访问 [`https://edgeimpulse.com`](https://edgeimpulse.com)\
  \ 并创建一个名为 *keyword_spotting* 的新项目。与第 4 章类似，你需要上传文件。这次没有预先配置的向导，你可以直接进入上传表单。分三次上传数据：首先上传*唤醒词*样本，然后上传*未知词*样本，最后上传*噪声*样本（来自之前下载的\
  \ Edge Impulse 合成数据集）。每次上传时，请务必执行以下操作。\n\n![](img/619308_1_En_6_Fig6_HTML.jpg)\n\
  \n该图像显示了一个数据上传界面，包含文件上传选项。已选择“选择文件夹”进行文件选择，并勾选了“自动分割训练集和测试集”进行分类。标签字段已填写为“wakeword”。底部有一个标有“上传数据”的按钮。\n\
  \n图 6-6\n\nEdge Impulse 数据上传表单\n\n1.  手动输入正确的标签。\n\n2.  勾选**自动分割训练集和测试集**复选框（见图\
  \ 6-6）。\n\n注意\n\n请上传你自己的数据以及合成/下载的数据！\n\n## 特征工程\n\n在本书的这个阶段，你应该知道特征工程是机器学习流程中的关键步骤。音频数据也不例外。除了通常的好处（更好的模型学习）之外，这种数据类型还有额外的好处。\n\
  \n*   **降维与计算效率**：原始音频数据包含大量信息，其中许多与关键词检测无关。特征提取有助于降低这种维度，专注于信号最重要的方面，从而创建更紧凑、计算效率更高的表示。\n\
  \n*   **降噪**：通过提取特定特征，我们通常可以将感兴趣的信号与背景噪声分离，从而提高关键词识别系统的鲁棒性。\n\n必须考虑几个因素，因为人类对声音的感知是非线性的。关键词识别的标准特征描述符称为*梅尔频率倒谱系数*（MFCCs），但在理解它们是什么以及如何计算之前，你需要先了解什么是*梅尔频谱图*。\n\
  \n\n\n### 梅尔频谱图\n\n梅尔频谱图是一种考虑人类如何感知不同频率的声音可视化表示。它广泛应用于音频分析和语音识别任务。要理解梅尔频谱图，让我们分解其组成部分及其创建过程。\n\
  \n![](img/619308_1_En_6_Fig7_HTML.jpg)\n\n一张对比图展示了两种频谱图。左侧标注为\"Mel\"的梅尔频谱图显示紫色和绿色强度不等的水平带状区域。右侧标注为\"\
  dB\"的分贝频谱图呈现相似模式但颜色对比不同。两种频谱图均展示了声音频率随时间的变化。\n\n图 6-7\n\n对数压缩前（左）与后（右）的梅尔频谱图\n\n\
  *   **短时傅里叶变换（STFT）**：创建梅尔频谱图的第一步是对音频信号执行 STFT。STFT 是一种分析信号频率内容随时间变化的技术。它通过将信号分割成短时重叠片段（通常每个片段\
  \ 20-40 毫秒），并对每个片段应用傅里叶变换来实现。傅里叶变换将时域信号转换为频域信号，显示存在的频率及其各自的振幅。\n\n*   **频谱图**：STFT\
  \ 的结果是频谱图，一种二维信号表示。横轴代表时间，纵轴代表频率，每个点的强度代表该频率在特定时间点的振幅或能量。为了更直观地理解，你可以将这个矩阵可视化为图像（见图\
  \ 6-7，左图）。\n\n*   **梅尔刻度**：人耳以非线性方式感知音高。我们对低频变化的敏感度高于高频变化。梅尔刻度是一种旨在模仿人类感知的音高感知刻度。它在\
  \ 1000 Hz 以下近似线性，在 1000 Hz 以上呈对数分布。\n\n*   **梅尔滤波器组**：为了将频谱图转换为梅尔频谱图，我们应用一系列称为梅尔滤波器组的三角滤波器。这些滤波器根据梅尔刻度分布，在低频范围内有更多滤波器，在高频范围内则较少。每个滤波器计算特定频率范围内的平均能量，并按滤波器的三角形形状进行加权。\n\
  \n*   **对数压缩（dB）**：应用梅尔滤波器组后，我们对得到的能量取对数。这一步至关重要，因为人类对响度的感知近似对数关系。它有助于压缩频谱图的动态范围，使较安静的声音更可见，并减少响亮声音的主导地位（见图\
  \ 6-7，右图）。\n\n相对于原始 STFT 矩阵，梅尔频谱图的纵轴代表梅尔频带而非线性频率，颜色或强度代表每个时间点每个梅尔频带中对数压缩后的能量。\n\n\
  为什么梅尔频谱图对音频关键词识别如此有效？\n\n*   **感知对齐**：梅尔刻度与人类听觉感知高度一致，聚焦于对语音识别最重要的频率范围。\n\n*   **时频表示**：梅尔频谱图同时捕获时间和频谱信息，这对识别语音模式至关重要。\n\
  \n*   **鲁棒性**：梅尔频谱图对音高和说话者特征的微小变化相对鲁棒。\n\n### 梅尔频率倒谱系数\n\n梅尔频谱图本身已是一个很好的特征描述符。它是一个可以直接输入卷积神经网络（CNN）并取得良好效果的矩阵。MFCC\
  \ 是一个从该矩阵中生成子集（类似于特征选择）的过程。但如果梅尔频谱图已经是有效选项，为什么还要增加另一个步骤？这真的值得吗？\n\n是的，通常值得。MFCC\
  \ 提取实现了两个重要目标。\n\n*   **有效的降维**：降维在第 2 章中介绍过。然而，MFCC 是以一种不同的、特定于音频的方式计算的。它们仅使用*离散余弦变换*（DCT）从原始梅尔频谱图中选择\
  \ 12 到 20 个特征，该变换能生成高度去相关的输出。\n\n*   **噪声鲁棒性提升**：通过丢弃较高频率分量，MFCC 表现出更好的噪声抑制能力。\n\
  \n这个过程的结果是一个 MFCC 值矩阵，其中每列代表一个时间帧，每行对应一个倒谱系数。行数等于保留的系数数量（12–20），列数取决于音频时长和分析中使用的帧率（例如，1\
  \ 秒音频被分割成 40 毫秒的非重叠窗口 = 25 个时间切片）。\n\n## 使用 Edge Impulse 进行音频分类\n\n作为一个低代码工具，Edge\
  \ Impulse 隐藏了 MFCC 的所有实现细节。在\"创建脉冲\"页面上，请进行以下选择。\n\n*   **窗口大小**：应与音频样本匹配（2000 毫秒）。\n\
  \n*   **窗口增量**：应足够大以允许推理运行，但不宜过大以免错过关键词。同时，它应为 1000 的整数除数，以便与`tinyml4all` Arduino\
  \ 库对齐。一个好的默认值是 250 毫秒。\n\n*   **处理模块**：音频（MFCC）。\n\n*   **学习模块**：分类。\n\n接下来，转到侧边菜单上的\
  \ MFCC 页面，配置特征提取器（见图 6-8）。你可以调整一些选项，但在做出任何更改之前，你应该清楚自己在做什么。在我们的案例中，默认设置效果良好，因此我们不会修改此页面。如果你后来发现模型性能不佳，可以随时返回此处。以下是一些可调选项。\n\
  \n*   **系数数量**：可以增加此值以增加保留的特征数量。\n\n*   **帧长和步长**：可以增加帧长并使步长成为其除数，以创建重叠窗口。\n\n*\
  \   **FFT 长度**：较大的值会计算更多系数。由于 FFT 是一项计算成本较高的操作，我建议你尽可能保持此值较低。\n\n保存参数并在下一个选项卡中生成特征；当过程完成时，特征探索器可以让你了解特征聚类的情况。\n\
  \n![](img/619308_1_En_6_Fig8_HTML.jpg)\n\n该图像显示了音频处理参数和结果的用户界面。左侧显示\"原始特征\"，包含数值和标记为\"\
  唤醒词\"的标签。下方列出了梅尔频率倒谱系数的\"参数\"，包括系数数量（13）、帧长（0.02）和滤波器数量（32）等设置。还有一个标记为\"自动调参\"的按钮。右侧的\"\
  DSP 结果\"展示了倒谱系数的热力图和处理后的特征值。下方的\"设备端性能\"显示处理时间为 176 毫秒，峰值 RAM 使用量为 13 KB。\n\n图 6-8\n\
  \nEdge Impulse MFCC 配置\n\n\n\n### 卷积神经网络\n\n我们现在处于分类阶段。第 4 章使用了由两层神经元组成的全连接神经网络。既然我们的特征是一个向量列表，那么那种拓扑结构可能并非最佳解决方案。对于图像分类任务，另一种拓扑结构通常能达到最先进的精度：卷积神经网络（CNN）。\n\
  \n第 8 章将深入探讨 CNN。现阶段，你只需要知道卷积可以在不同的维度深度上发生：1D 和 2D 是最常见的。1D 卷积适用于序列数据（例如，原始时间序列），而\
  \ 2D 卷积适用于矩阵（例如，图像）。\n\n卷积是一种高效的算子，它每次只考虑数据的小区域（称为*补丁*），而不是像全连接网络那样单独处理每个值。一个补丁可以是\
  \ 1D 情况下的一个短序列，也可以是 2D 情况下的一个小矩阵（例如，图像分类任务中常见的值是 3×3 或 5×5）。卷积*滤波器*（也称为*核*，一个与补丁大小相同的系数矩阵）在输入数据的每个区域上滑动，并执行两者之间的点积（即，其系数与补丁值逐元素相乘后的总和），以产生单个输出值（见图\
  \ 6-9）。\n\n![](img/619308_1_En_6_Fig9_HTML.jpg)\n\n图示说明了图像处理中的卷积操作。输入是一个包含二进制值的\
  \ 5x5 网格。一个用蓝色高亮显示的 3x3 图像补丁被提取出来，并与一个值从 1 到 9 的 3x3 核滤波器相乘。结果是一个 3x3 的输出网格，第一行显示值为\
  \ 31、19 和 30。该过程演示了神经网络中卷积层的工作原理。\n\n图 6-9\n\n2D 卷积过程\n\n核系数用随机值初始化；然后学习过程包括更新它们的值，以使分类结果达到最高精度。\n\
  \n从内存角度来看，卷积相比全连接有了巨大的改进，因为需要存储的权重数量与输入大小无关。例如，同一个 3×3 卷积滤波器既适用于 96×96 的图像，也适用于\
  \ 512×512 的图像；它只需要滑动更多次。\n\nMFCC 通常被表示为图像，但从技术上讲，它们并非图像（它们不描绘现实世界的实体，并且向量之间并非真正的“空间”相关）。这就是为什么\
  \ Edge Impulse 允许你为音频分类选择你偏好的架构。对于这种类型的输入数据，1D 卷积是最自然的选择，但你仍然可以将 MFCC 矩阵视为图像并使用\
  \ 2D 卷积。由于 1D 卷积比 2D 更轻量级，并且通常表现出更好的精度，因此默认选择它（见图 6-10）。\n\n![](img/619308_1_En_6_Fig10_HTML.jpg)\n\
  \n该图像显示了一个用户界面部分，标题为“高级训练设置”，包含音频训练和神经网络架构选项。在“音频训练选项”下，数据增强设置包括“添加噪声”、“屏蔽时间带”和“屏蔽频率带”，每个都有无、低或高选项。“屏蔽频率带”设置为低，“扭曲时间轴”已启用。“神经网络架构”部分突出显示了“1D\
  \ 卷积（默认）”作为选定的架构预设。\n\n图 6-10\n\nEdge Impulse 训练配置\n\n你还可以调整几个训练参数以加快训练速度。\n\n*\
  \   **训练周期数**：这决定了模型应该学习多长时间。样本较少时，50 是一个不错的默认值。\n\n*   **学习率**：它控制模型在每个周期更新其权重的程度。我常用的值是\
  \ 0.005（较低的值可能会带来更高的精度，但可能需要更多的训练周期）。\n\n由于我们的数据集有限，我们可以将模型训练少至 30-50 个周期，同时仍能达到非常好的精度，如图\
  \ 6-11 所示。在刚开始并快速迭代模型时，请保持较低的周期数，并监控日志中显示的指标是否随时间改善。如果模型精度从第 30 个周期开始就保持不变（这在简单数据集上经常发生），那么等待\
  \ 100 个周期的训练就是浪费时间。\n\n如果你的训练过程和我的一样，你可能会担心*噪声*和*未知*类别的“低”精度（约 85%）。但请记住，本项目只对唤醒词类别感兴趣。如果模型将未知类别的样本与噪声类别的样本混淆，这对我们来说不是问题！\n\
  \n![](img/619308_1_En_6_Fig11_HTML.jpg)\n\n该图像显示了机器学习模型在验证集上的最后一次训练性能。它包括 86.7%的精度和\
  \ 0.37 的损失。下方是一个混淆矩阵，类别包括：噪声、未知和唤醒词。矩阵显示噪声正确分类率为 87.8%，未知为 84.8%，唤醒词为 100%。F1 分数：噪声为\
  \ 0.87，未知为 0.87，唤醒词为 0.86。\n\n图 6-11\n\nEdge Impulse 混淆矩阵\n\n## 测试\n\n如果训练页面上的混淆矩阵符合你的预期，请转到模型测试页面（从左侧菜单），以评估模型在训练或验证期间从未见过的音频上的精度。点击**全部分类**按钮并等待结果。在最佳情况下，所有行都是绿色的（表示完美预测）。在像我们这样使用合成数据的现实场景中，你可能会得到看起来比训练时更差的结果（见图\
  \ 6-12）。这完全正常且在意料之中。\n\n![](img/619308_1_En_6_Fig12_HTML.jpg)\n\n一个表格显示了用于唤醒词检测的音频样本测试结果。每一行包括样本名称、预期结果、长度、精度和结果列。大多数样本显示\
  \ 100%精度，结果为“1 wakeword”，以绿色高亮显示。两个样本显示 0%精度，结果为“1 noise”和“1 uncertain”，以红色高亮显示。\n\
  \n图 6-12\n\nEdge Impulse 唤醒词检测测试结果\n\n虽然大多数唤醒词被正确识别，但存在一些错误（带有*噪声*标签的行），甚至还有几个*不确定*的分类。这些分类是指检测到唤醒词，但置信度被认为过低而不可靠。你可以通过点击**全部分类**按钮右侧的齿轮图标并选择**设置置信度阈值**来配置“可接受的”置信度。我通常设置为至少\
  \ 0.6。\n\n花些时间手动检查一些错误（点击行右侧的三个点并选择**显示分类**），以理解模型失败的原因，以及被错误分类的样本中是否存在重复模式。如果你觉得模型在精度方面不符合你的期望，请返回训练页面并调整上一节中介绍的参数（模型架构、训练周期数、学习率）。重复此过程，直到获得更好的结果。\n\
  \n提示\n\n如果你无论如何努力调整训练过程仍然无法获得好的结果，原因可能是数据集不佳。花时间收集更多数据，或者将一些分类失败的样本移动到训练集中（点击红色行右侧的三个点并选择**移动到训练集**），然后重新训练模型。\n\
  \n## 部署\n\n以 Arduino 库格式下载模型（参考第 4 章），并将 ZIP 文件解压到你的 Arduino 库文件夹中。如果你将项目命名为`keyword_spotting`，则该库的名称为`keyword_spotting_inferencing`。\n\
  \n\n\n### 连续分类\n\n短时傅里叶变换（STFT）作用于小窗口数据（通常为 20–40 毫秒），其结果用于生成梅尔频谱图。当新数据块到达时，最旧的数据块会被丢弃以腾出空间。为每个数据块重新计算傅里叶变换会浪费时间和资源，因为其结果不会改变。\n\
  \nEdge Impulse 内置了一种机制来处理这种*连续*数据流，你可以利用它实现接近实时的分类速度。要充分利用此技术，请将清单 6-8 中的 `EI_CLASSIFIER_SLICES_PER_MODEL_WINDOW`\
  \ 设置为与你在脉冲设计页面中设置的相同值。\n\n```\n/**\n* 清单 6-8：使用 Edge Impulse 进行音频唤醒词检测\n*\n* 所需硬件：Arduino\
  \ Nano BLE Sense\n*/\n// 下一行 *必须* 与 EI Studio 脉冲设计页面中的窗口增量值匹配\n#define EI_CLASSIFIER_SLICES_PER_MODEL_WINDOW\
  \ (1000 / 250)\n#include \n// 替换为从 Edge Impulse Studio 下载的库的正确名称\n#include \n#include\
  \ \ntinyml4all::PDMicrophone mic;\ntinyml4all::Impulse impulse;\nvoid setup() {\n\
  Serial.begin(115200);\nwhile (!Serial);\nSerial.println(\"使用 Edge Impulse 进行关键词识别\"\
  );\n// 使音量与数据采集时使用的音量匹配！\nmic.frequency(\"16 khz\");\nmic.volume(30);\nmic.begin();\n\
  // 初始化 Edge Impulse 库\nimpulse.begin();\n// 测试期间，可以通过将此值设置为 true 来启用详细输出\nimpulse.verbose(false);\n\
  }\nvoid loop() {\n// 等待音频数据准备就绪\nmic.await();\n// 将数据送入脉冲队列\nif (!impulse.queue(mic))\
  \ {\nSerial.println(impulse.error());\nreturn;\n}\n// 跳过非唤醒词\nif (impulse.label()\
  \ != \"wakeword\")\nreturn;\nSerial.print(\"检测到唤醒词，置信度：\");\nSerial.println(impulse.confidence());\n\
  // 在此处自定义你自己的逻辑\n}\n清单 6-8\n使用 Edge Impulse 进行关键词识别的 Arduino 草图\n```\n\n编译草图（需要几分钟），然后上传。打开串口监视器并大声重复唤醒词。你应该会看到检测成功（见图\
  \ 6-13）。\n\n![](img/619308_1_En_6_Fig13_HTML.jpg)\n\n一个计算机终端窗口显示了使用 Edge Impulse\
  \ 进行关键词识别的结果。它展示了多次检测到唤醒词的实例，置信度分别为：0.91、0.92、0.84 和 0.87。界面包含自动滚动、显示时间戳、换行、波特率设置为\
  \ 115200 以及清除输出按钮等选项。\n\n图 6-13\n\n唤醒词检测输出\n\n推理速度相当不错。单次推理仅需 77 毫秒。并且由于 PDM 麦克风在后台任务中捕获数据，因此没有等待队列，在执行推理时也不会丢失数据块。\n\
  \n一旦这个唤醒词检测项目运行起来，你可以收集更多词语进行分类。也许你可以实现一个本地音乐播放器助手，通过语音检测“播放”、“暂停”和“下一首”来控制你的音响——或者用“白天”和“夜晚”来控制你家的灯光。可能性是无限的。\n\
  \n提示\n\n尽量保持你的唤醒词简短（一到两秒），否则处理时间可能会太长！\n\n## 总结\n\n本章介绍了一种新的数据类型：音频。这是一种非常密集的数据类型（每秒数千个样本），但得益于\
  \ `tinyml4all` 库，我们能够快速收集训练数据。我们还能够利用生成式 AI 在几秒钟内创建合成数据集。\n\nEdge Impulse 低代码平台使得使用高级算法（快速傅里叶变换、梅尔频谱图和\
  \ MFCC）提取复杂特征，并使用卷积神经网络对其进行分类变得轻而易举。\n\n部署过程与第 4 章非常相似。通过复用梅尔频谱图中的先前计算结果，我们得以实现惊人的推理速度：每秒\
  \ 13 次分类（每次分类 77 毫秒）。\n\n下一章将使用 ESP32 摄像头进行实时目标检测，探讨图像处理。\n\n"
- "# 7. 使用 Edge Impulse 进行目标检测\n\n你已经接触到了本书中的最后一种数据类型：图像。图像在我们的日常生活中如此普遍，以至于我们低估了它们的复杂性和信息密度。我们的大脑经过数千年的进化，即使在恶劣的环境条件（弱光、遮挡、模糊等）下也能提取这些信息。训练一个计算机程序来复制同样水平的精度是一项高要求的任务，在许多应用场景中仍不如人类。\n\
  \n尽管如此，该领域已经取得了巨大进步，如今我们拥有许多工具来执行目标检测，即识别图像中感兴趣的目标。这与纯分类不同：对图像进行分类意味着为*整个*图像分配一个标签。而目标检测则是对图像的*区域*进行分类，允许同一张图像中存在多个感兴趣的目标。甚至可以是多个不同类别的目标！\n\
  \n为了降低在资源受限设备上进行目标检测这一难题的门槛，我们再次利用 Edge Impulse 平台。到现在，你应该已经意识到这个平台是多么多功能强大，以及它如何简化了开发过程。本章将训练一个模型来识别一个单一的感兴趣目标——一个玩具企鹅（见图\
  \ 7-1）。熟悉此方法后，你可以扩展项目以识别许多不同的目标，几乎无需修改。\n\n![](img/619308_1_En_7_Fig1_HTML.jpg)\n\
  \n一张桌子上放有键盘、马克杯和一罐铅笔。右侧，一个毛绒企鹅玩具被红色虚线框出，并标有粗体红色文字“PENGUIN”。\n\n图 7-1\n\n目标检测目标\n\
  \n## 硬件要求\n\n你需要一块支持摄像头的开发板。有几款开发板自带摄像头。\n\n*   **基于 Arduino 的**：Nicla Vision、Portenta\
  \ H7 + 视觉扩展板\n\n*   **基于 ESP32 的**：AiThinker、XIAO Sense、TTGO 系列、M5Stack 系列、ESP-EYE\n\
  \n否则，你可以尝试更基础的 OV7670 摄像头，它可以与许多开发板（例如 Arduino Nano BLE Sense 或 Raspberry Pi Zero）配合使用。但我不建议你走这条路，因为其质量低且接线困难。\n\
  \n注意\n\n在寻找 ESP32 摄像头时，请注意至少有两种芯片变体。ESP32 是“第一代”芯片，价格和规格较低。ESP32-S3 是“下一代”芯片：价格稍高，但性能提升巨大。如果可能，请选择\
  \ S3 变体！\n\n## 软件要求\n\n`tinyml4all` Arduino 库为基于 ESP32 和 Arduino 的摄像头提供了实用适配器，因此代码保持不变。如果你打算使用\
  \ OV7670 型号，则需要编写自己的代码来从中捕获帧。\n\n在 Python 方面，你只需要 `tinyml4all` 包（你应该已经安装过了）。\n\n\
  \n\n## 采集数据\n\n要构建目标检测数据集，你需要采集一些图像。多少张图像才能构成一个优质数据集？通常来说，数量越多越好。但根据我的经验，每个目标只需\
  \ 50 张图像就能取得不错的效果。\n\n注意\n\n你需要手动标注采集到的每一张图像，因此请从少量开始，仅在必要时再增加数量！\n\n你在网上找到的许多教程建议使用来自谷歌/互联网的图像来训练模型。另一些教程则建议使用智能手机采集数据。尽管由于模型的泛化特性，这种方法可能效果不错，但我强烈建议你使用与运行推理（即微控制器本身）相同的硬件来采集自己的数据。这样能更好地模拟你的部署场景，通常也能获得更高的准确率。\n\
  \n提示\n\n嵌入式摄像头传感器通常画质较差，且易受环境因素（如光照不足）影响，而智能手机则会自动修正大部分此类问题。在智能手机图像上训练的模型，在嵌入式传感器图像上可能表现不佳。\n\
  \n### 用于采集图像的 Arduino 程序\n\n让我们通过串口发送采集到的帧。如果你愿意，也可以使用 SD 卡（大部分代码无需改动，只需将数据写入文件即可）。代码清单\
  \ 7-1 已在 ESP32-S3 摄像头上测试通过：如果你使用不同型号，请查阅本书代码仓库。\n\n提示\n\n如果使用 ESP32 或 ESP32S3，请从\
  \ Arduino IDE 的“工具”菜单中启用外部 PSRAM 选项。\n\n```\n/**\n* 代码清单 7-1：从摄像头采集图像\n*\n* 所需硬件：ESP32\
  \ 摄像头\n*/\n#include \ntinyml4all::Camera camera;\nvoid setup() {\n// 提高串口速度以实现快速数据传输\n\
  Serial.begin(115200 * 2);\nwhile (!Serial);\nSerial.println(\"采集图像\");\n// 从列表中选择型号\n\
  camera.promptModel();\n// 下次使用时，可以直接通过名称设置\n// camera.setModel(\"aithinker\");\n\
  // 配置摄像头为采集模式\ncamera.collecting();\n// 初始化摄像头（失败时会抛出错误）\ncamera.begin();\n}\nvoid\
  \ loop() {\n// 抓取新帧\nif (!camera.grab()) {\nSerial.println(\"无法抓取新帧\");\nreturn;\n\
  }\n// 将帧数据打印到串口（供 Python 读取）\ncamera.print();\ndelay(1000);\n}\n代码清单 7-1\n通过串口发送图像\n\
  ```\n\n提示\n\n为提高传输速度，串口速率已调高。由于存在一秒的延迟，速度提升并不明显（仅节省几毫秒），但在以更高频率采集图像时会派上用场。\n\n烧录程序后，打开串口监视器确认开发板正在通过串口传输图像数据。输出看起来会像乱码，因为这是二进制数据而非文本。重要的是有内容被打印出来。现在，可以运行\
  \ Python 采集脚本了。\n\n提示\n\n如果初始化摄像头时出现奇怪的错误信息或开发板重启，请仔细检查是否从提示菜单中选择了正确的型号。\n\n###\
  \ 用于读取图像的 Python 代码\n\n在 Python 端，代码与之前章节使用的类似。像往常一样，你需要配置串口、要采集的样本数量以及目标文件夹（代码清单\
  \ 7-2）。程序会显示摄像头预览，以便你在需要时调整摄像头位置（见图 7-2）。\n\n![](img/619308_1_En_7_Fig2_HTML.jpg)\n\
  \n一幅数字插图：木制表面上的企鹅玩具，背景是白色砖墙。右侧有一个木制艺术家人体模型，旁边是一个白色马克杯和一株小绿植。场景仿佛通过电脑窗口观看，左上角有蓝色标题栏和红色“X”按钮。\n\
  \n图 7-2\n\n图像采集预览窗口\n\n```\nfrom tinyml4all.image import capture_serial\nwhile True:\n\
  # 提示用户输入目标名称和图像数量\nobject = input(\"这是什么目标？ \")\nnum_samples = input(\"要采集多少张图像？\
  \ \")\n# 如果目标名称或数量为空则退出\nif not object or not num_samples:\nbreak\ncapture_serial(\n\
  # * 是通配符，可匹配任意内容\n# 在 Windows 上会显示为 COM1 或类似名称\nport=\"/dev/cu.usb*\",\n# 必须与 Arduino\
  \ 程序中的设置一致\nbaudrate=115200 * 2,\nsave_to=f\"objects/{object}\",\nnum_samples=int(num_samples)\n\
  )\n这是什么目标？ penguin\n要采集多少张图像？ 30\n已连接到串口\n100%|██████████| 30/30 [00:33<00:00, \
  \ 1.35 秒/张]\n已断开串口连接\n代码清单 7-2\n通过串口采集图像\n```\n\n将目标放置在正确位置，最好位于画面中央且光照良好，然后完成采集过程。接下来，打开目标文件夹，使用操作系统文件管理器仔细检查图像是否清晰。\n\
  \n你至少需要运行两次采集会话。\n\n*   采集你感兴趣的目标\n*   采集背景数据（无目标）\n\n*背景*数据的作用与第 6 章介绍的*未知*类别相同；它向模型提示目标*不*像什么。请随意采集周围环境的图像，包括椅子、电脑显示器、墙壁和窗户。图像变化越丰富，效果越好。\n\
  \n\n## Edge Impulse 数据采集\n\n收集到足够数量的优质数据后，请前往 [`https://edgeimpulse.com`](https://edgeimpulse.com)\
  \ 并创建一个名为 `object-detection` 的新项目*。*如你在第 6 章所见，必须上传文件才能开始（见图 7-3）。该过程与我们的音频项目完全相同。\n\
  \n![](img/619308_1_En_7_Fig3_HTML.jpg)\n\n数据上传界面的截图。选项包括选择文件夹上传文件，已选择 31 个文件。文件可自动分割为训练集和测试集，或手动分配到训练或测试类别。标签字段已填写\"\
  penguin\"。底部有一个\"上传数据\"按钮。\n\n图 7-3\n\nEdge Impulse 数据上传表单\n\n1.  选择单个文件或整个文件夹。\n\
  \n2.  手动输入正确的标签。\n\n3.  勾选**自动分割为训练集和测试集**复选框。\n\n但先别这么做！在上传你收集的所有图像之前，请先阅读下一段！\n\
  \n你可能会在上传表单处想一次性上传所有文件。这是个糟糕的做法。这是一个目标检测项目，但你尚未在 Edge Impulse 中定义感兴趣的目标是什么。**首先，上传你感兴趣目标的图像**（在我的例子中是企鹅玩具）。上传完成后，系统会提示你是否为目标检测项目（见图\
  \ 7-4）。点击**是***。*\n\n![](img/619308_1_En_7_Fig4_HTML.jpg)\n\n一个弹出窗口，顶部有相机图标，消息为\"\
  检测到图像数据！您是否正在构建目标检测项目？\"消息下方有一条注释：\"您可以在'仪表盘 > 标注方法'下更改此选择。\"底部有两个按钮，分别标有\"是\"和\"\
  否\"。\n\n图 7-4\n\nEdge Impulse 标注方法选择\n\n不要继续上传更多图像，关闭表单并点击顶部菜单中的**标注队列**（见图 7-5）。\n\
  \n![](img/619308_1_En_7_Fig5_HTML.jpg)\n\n界面显示导航标签\"数据集\"、\"数据源\"和\"标注队列\"，其中\"\
  标注队列\"以红色高亮显示，并指示有 18 个项目。\n\n图 7-5\n\nEdge Impulse 标注队列菜单项\n\n一个新窗口打开，你可以在中央看到你的图像，并显示消息：\"\
  使用鼠标在对象周围拖出一个框以添加标签。然后点击**保存标签**以进入下一项。\"这就是你要对所有图像执行的操作：在每个感兴趣的目标周围画一个框，并为其分配正确的标签。如果保持选中**在帧之间跟踪对象**，过程会更快，因为通常你只需对自动定位的边界框进行微调（见图\
  \ 7-6）。\n\n![](img/619308_1_En_7_Fig6_HTML.jpg)\n\n标注界面的图像，显示一张企鹅玩具的照片。企鹅被一个粉色框标出，标签为\"\
  penguin\"。图像上方有一个下拉菜单，选项为\"在帧之间跟踪对象\"。图像下方可见\"删除样本\"和\"保存标签\"按钮。\n\n图 7-6\n\nEdge\
  \ Impulse 边界框绘制工具\n\n提示\n\n如果你一次性上传所有图像，标注队列会混合不同的对象，你将浪费大量时间绘制边界框！\n\n如果你有更多对象，请逐个上传并分别进行标注。完成感兴趣目标的图像后，再上传*背景*图像。然后再次打开标注队列，不绘制任何内容直接点击**保存标签**。由于这是背景，无需高亮任何内容。\n\
  \n## 特征工程\n\n图像分类和目标检测的特征工程是不存在的。或者更准确地说，它已内置于模型中。如第 6 章所述，对于图像而言，参考神经网络架构是*卷积*神经网络。即使很难\"\
  看清\"卷积神经网络中间层究竟发生了什么，但一种直观的定性解释是：随着输入在网络中向前传播，这些滤波器（每层都有许多滤波器）会学习识别越来越复杂的模式和特征。第一层通常学习边缘和角点等基本特征，而更深层则学习识别基本形状和纹理（见图\
  \ 7-7）。\n\n![](img/619308_1_En_7_Fig7_HTML.jpg)\n\n一个由十二个抽象图案组成的网格，每个图案都具有精细、多彩的设计。图案包括波浪线、锯齿形、圆形图案和网格状结构，主色调为紫色、绿色和红色。每个部分都展现出独特的纹理和排列，形成视觉上复杂且充满活力的拼贴画。\n\
  \n图 7-7\n\n二维卷积神经网络内部层的激活图\n\n卷积神经网络的关键在于其建模能力如此高效，以至于它能自行找出如何最好地检测不同类别中的重复模式。几十年前还是手动完成的任务，如今已完全自动化。\n\
  \n\n\n### 脉冲设计\n\n由于针对此类数据的处理和分类模块是固定的（见图 7-8），因此这里你能做的操作不多。但你仍然需要做出两个重要决定。\n\n\
  ![](img/619308_1_En_7_Fig8_HTML.jpg)\n\n该图像显示了一个用于配置图像数据和目标检测设置的用户界面。第一个面板“图像数据”显示了标记为“图像”的输入轴，宽度和高度设置为\
  \ 96，并有一个调整大小模式选项。第二个面板“图像”包含一个用于命名图像和选择输入轴的字段。第三个面板“目标检测（图像）”允许命名目标检测过程、选择输入特征，并将输出特征列为“2（企鹅，玩具）”。最后一个面板“输出特征”确认了输出特征，并包含一个“保存脉冲”按钮。\n\
  \n图 7-8\n\n用于目标检测的 Edge Impulse 设计页面\n\n*   **图像尺寸**：你的摄像头可以以不同分辨率捕捉帧。一个相当常见的分辨率是\
  \ 320×240 像素。尽管与我们日常接触的照片（几百万像素）相比，这个分辨率看起来很小，但它已经处于图像分析光谱的高端范围。大多数“移动端”神经网络（旨在运行在低端\
  \ CPU 上，比如几年前的智能手机或树莓派）处理的是 192×192 或更小的图像。你的开发板甚至可能无法处理那个尺寸！\n\n为了避免内存不足错误，我建议从\
  \ RGB 模式下的 80×80 或灰度模式下的 96×96 尺寸开始。如果模型性能不佳并且你有足够的资源来运行更大的模型，你随时可以稍后回来提高分辨率。我不建议你尝试任何高于\
  \ 128×128 的尺寸。\n\n*   **颜色深度**（在图像页面上）：大多数摄像头可以以 RGB 或灰度模式捕捉图像。即使你捕捉的帧是 RGB 格式，你也可以强制模型以灰度模式处理它们。为什么要这样做？当然是由于内存限制的原因。直观上，你可以预期\
  \ RGB 模型在存储中间结果时需要的内存是灰度模型的三倍，执行时间也是其三倍。除非你的开发板有大量 RAM，否则这可能是难以承受的，并会阻止你的模型正常工作。\n\
  \n在模型配置步骤中，Edge Impulse 提供了两种适合微控制器的替代架构。（它们为树莓派/Jetson Nano/PC 目标提供了更多选项）。\n\n\
  *   FOMO MobileNetV2 **0.1**\n\n*   FOMO MobileNetV2 **0.35**\n\n注意\n\nFOMO 代表“更快目标，更多目标”（Faster\
  \ Objects, More Objects），是 Edge Impulse 团队为其定制的、优化的目标检测实现所起的品牌名称。\n\n首先，这两种模型都源自\
  \ MobileNetV2[1]，这是一种为移动设备（如我们的智能手机）设计的轻量级高效卷积神经网络架构。然而，智能手机的性能仍然比微控制器高出几个数量级（拥有千兆字节的\
  \ RAM，CPU 频率在千兆赫兹范围内），因此该网络对于本书定义的“微型”来说仍然过于庞大。\n\n这就是其名称后面的小数发挥作用的地方。它被称为宽度乘数，用于控制网络中的滤波器数量。正如第\
  \ 6 章简要介绍的，卷积层由许多滤波器（或卷积核）组成。宽度乘数从原始数量开始，对这些滤波器的数量进行缩减。宽度乘数为 0.1 意味着只使用原始滤波器数量的\
  \ 10%；0.35 意味着大约使用三分之一的数量。\n\n巨大的成就在于，网络总权重的减少与该乘数成*二次方*比例。由于卷积层中的权重数量取决于输入通道数、输出通道数和卷积核大小，因此将滤波器数量缩放\
  \ α 倍（0.1 或 0.35）会因以下原因二次方地减少权重数量。\n\n*   输出通道数减少了 α 倍。\n*   后续层的输入通道数也减少了 α 倍。\n\
  *   卷积核大小保持不变。\n\n因此，0.35 变体仅保留了原始 MobileNetV2 权重大约 12%，而 0.1 变体则将大小缩减到*仅为原始大小的\
  \ 1%！* 当然，你可以预期较大的版本会显示出更好的准确性。\n\n选择哪一个取决于几个因素。\n\n*   **内存限制**：资源有限的开发板无法处理较大的版本，这迫使你做出选择。如果你使用\
  \ RGB 图像，请记住问题只会变得更糟。\n*   **时间限制**：如果你正在构建一个近实时项目（例如，自主机器人）并且需要尽可能高的响应速度，那么你更关心的是运行速度快而不是准确性高。另一方面，如果你可以承受花费高达\
  \ 500 毫秒来分析单个帧并且有足够的内存，那么 0.35 版本更可靠。\n\n对于我的项目，我选择了 0.1 变体。如果你的数据集只有高质量的图像，即使使用这个较小的模型，你也可以期待获得高准确性。你可以在目标检测页面（左侧菜单）上通过点击**选择不同的模型**来选择不同的模型，如图\
  \ 7-9 所示。\n\n![](img/619308_1_En_7_Fig9_HTML.jpg)\n\n一个具有三层的神经网络架构图。顶层标记为“输入层”，包含\
  \ 9,216 个特征。中间层显示了一个模型选择选项，当前设置为“FOMO (Faster Objects, More Objects) MobileNetV2\
  \ 0.1”，并有一个标红的“选择不同的模型”选项。底层标记为“输出层”，包含 2 个类别。\n\n图 7-9\n\n选择 FOMO 模型\n\n运行训练，然后转到模型测试页面。\n\
  \n## 测试\n\n如果训练页面上的混淆矩阵符合你的预期，请转到模型测试页面（从左侧菜单）来评估模型在训练或验证期间从未见过的图像上的准确性。点击**全部分类**按钮并等待结果。在最佳情况下，所有行都是绿色的（表示预测正确；见图\
  \ 7-10）。\n\n![](img/619308_1_En_7_Fig10_HTML.jpg)\n\n一个显示三行数据的表格，列标题为“样本名称”、“预期结果”和“F1\
  \ 分数”。每行显示样本名称为“penguin_1700...”，预期结果为“penguin”，F1 分数为“100%”，表明每个样本的分类准确率完美。背景为浅绿色。\n\
  \n图 7-10\n\nEdge Impulse 模型在测试集上的结果\n\n在更复杂的数据集上，更有可能出现一些对象被错误分类——或者根本未被检测到！你应该非常关注这些结果（远比训练页面上的结果重要），因为它们是最可靠的指标，表明模型在部署到从未见过的新图像上时的表现。\n\
  \n花时间手动检查一些错误（点击行右侧的三个点，然后选择**显示分类**）。如果你觉得模型在准确性方面不符合你的期望，请返回训练页面并调整前一章介绍的参数（模型架构、训练周期数、学习率）。重复此过程，直到获得更好的结果。\n\
  \n警告\n\n如果你无论如何努力调整训练过程都无法获得良好的结果，原因可能是数据集不佳。收集更多图像并仔细检查你绘制的边界框是否正确。\n\n\n\n## 部署\n\
  \n要将物体检测模型部署到 Arduino 程序中，请以 Arduino 库格式下载模型（如果不知道如何操作，请参见第 4 章），并将压缩包解压到您的 Arduino\
  \ 库文件夹中。如果您将项目命名为 `object-detection`，则该库的名称为 `object-detection_inferencing`。\n\n\
  创建一个新的 Arduino 项目，并粘贴代码清单 7-3 中的代码。\n\n```\n/**\n* 代码清单 7-3：使用 Edge Impulse 进行物体检测。\n\
