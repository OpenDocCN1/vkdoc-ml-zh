  \  [18, 19, 20, 21, 22, 23]])\n```\n\n\n\n### 一些数组方法\n\nNumPy 数组内置了获取统计汇总数据和执行矩阵运算的方法。清单\
  \ 7.15 展示了生成汇总统计信息的方法。这些方法可以获取最大值、最小值、总和、平均值和标准差。除非指定了轴，否则所有这些方法都会对整个数组产生结果。如果指定了轴值\
  \ `1`，则会生成一个包含每行结果的数组。如果轴值为 `0`，则会为每列生成一个结果数组。\n\n清单 7.15 **内省**\n\n点击此处查看代码图片\n\
