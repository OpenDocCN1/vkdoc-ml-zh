  \ Python 包管理器 `pip` 来完成。\n\n\n\n### 安装与导入 NumPy\n\nNumPy 在 Colab 环境中已预装，你只需导入即可。如果你在\
  \ Colab 之外的环境工作，有几种不同的安装方式（列举于 [`scipy.org/install.html`](https://scipy.org/install.html)），但最常用的方法是使用\
  \ `pip`：\n\n```\npip install numpy\n```\n\n安装好 NumPy 后，你就可以导入它。导入任何库时，都可以使用关键字 `as`\
  \ 来更改它在当前环境中的名称。NumPy 通常在导入时被重命名为 `np`：\n\n```\nimport numpy as np\n```\n\n当库安装并导入后，你就可以通过\
  \ `np` 对象访问 NumPy 的所有功能。\n\n### 创建数组\n\nNumPy 数组是一种数据结构，旨在高效处理大型数据集上的运算。这些数据集可以具有不同的维度，并且可以包含多种数据类型——但不会在同一个对象中混合。NumPy\
  \ 数组被用作许多其他库的输入和输出，也是其他对数据科学至关重要的数据结构（如 Pandas 和 SciPy 中的数据结构）的基础。\n\n你可以从其他数据结构创建数组，或者使用设定好的值进行初始化。清单\
  \ 7.1 演示了创建一维数组的不同方法。你可以看到，数组对象显示为内部包含一个列表作为其数据。数据实际上并非以列表形式存储，但这种表示方式使数组易于阅读。\n\
  \n清单 7.1 **创建数组**\n\n点击此处查看代码图片\n\n```\nnp.array([1,2,3])      # 从列表创建数组\n\narray([1,\
  \ 2, 3])\n\nnp.zeros(3)            # 全零数组\n\narray([0., 0., 0.])\n\nnp.ones(3) \
  \            # 全一数组\n\narray([1., 1., 1.])\n\nnp.empty(3)            # 任意数据的数组\n\
  \narray([1., 1., 1.])\n\nnp.arange(3)           # 从数字范围创建数组\n\narray([0, 1, 2])\n\
  \nnp.arange(0, 12, 3)    # 从数字范围创建数组\n\narray([0, 3, 6, 9])\n\nnp.linspace(0, 21,\
  \ 7)  # 在区间内创建数组\n\narray([ 0\\. ,  3.5,  7\\. , 10.5, 14\\. , 17.5, 21\\. ])\n\
  ```\n\n数组具有维度。一维数组只有一个维度，即元素的数量。对于 `np.array` 方法，其维度与用作输入的列表的维度相匹配。对于 `np.zeros`、`np.ones`\
  \ 和 `np.empty` 方法，维度作为显式参数给出。\n\n`np.arange` 方法生成数组的方式类似于 `range` 序列。生成的维度和值与使用\
  \ `range` 产生的相同。你可以指定起始值、结束值和步长。\n\n`np.linspace` 方法在区间内生成均匀间隔的数字。前两个参数定义区间，第三个参数定义元素数量。\n\
  \n`np.empty` 方法在高效生成大型数组时非常有用。请记住，由于数据是任意的，因此只应在你将替换所有原始数据的情况下使用它。\n\n清单 7.2 展示了数组的一些属性。\n\
  \n清单 7.2 **数组的特征**\n\n点击此处查看代码图片\n\n```\noned = np.arange(21)\n\noned\n\narray([\
