  \n编译正则表达式\n\n总结\n\n问题\n\nA   章末问题答案\n\n索引\n\n## 前言\n\nPython 语言历史悠久，用途广泛。其最初版本由\
  \ Guido van Rossum 于 1989 年开发，作为系统管理工具，用以替代 Bash 脚本和 C 程序。^(1) 自 1991 年公开发布以来，它已发展应用于众多行业，涵盖网页开发、电影、政府、科学和商业等领域。^(2)\n\
  \n我最初在电影行业接触 Python，当时我们用它在不同部门和地点之间自动化数据管理。在过去十年中，Python 已成为数据科学领域的主导工具。\n\n这种主导地位源于两个发展：Jupyter\
  \ notebook 和强大的第三方库。2001 年，Fernando Perez 启动了 IPython 项目，这是一个受 Maple 和 Mathematica\
  \ notebook 启发的交互式 Python 环境。^(3) 到 2014 年，该项目中与 notebook 相关的部分被分离出来，成为 Jupyter 项目。这些\
  \ notebook 在科学和统计工作环境中表现出色。与此发展并行的是，用于科学和统计计算的第三方库也被开发出来。随着应用场景的增多，Python 程序员可用的功能也大幅增长。从打开网络套接字到处理自然语言文本，各种专用包应有尽有，其丰富程度远超初学者的需求。\n\
  \n这个项目是 Noah Gift 的创意。^(4) 在他作为教育工作者的工作中，他发现数据科学的学生缺乏一种资源，来学习他们真正需要的 Python 部分。市面上有很多通用的\
  \ Python 书籍和数据科学书籍，但缺少专门学习入门数据科学所需 Python 知识的资源。这正是我们在此尝试提供的。本书不会教授搭建网页或执行系统管理所需的\
  \ Python 知识。它也不是为了教你数据科学，而是为了教你学习数据科学所需的 Python 知识。\n\n希望这本指南能成为你增长数据科学知识之路上的良伴。\n\
