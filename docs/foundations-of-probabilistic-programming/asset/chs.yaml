  \n## 关于作者\n\n**肯尼迪·贝尔曼**是一位资深软件工程师。他最初在视觉特效行业使用 Python 管理数字资产，此后便广泛使用该语言。他撰写了多本关于\
  \ Python 教育的书籍和培训课程。目前，他在 Envestnet 担任高级数据工程师。\n\n## 第一部分\n\n## 在笔记本环境中学习 Python\n\
  \n## 1\n\n## 笔记本简介\n\n所有动物生而平等，但有些动物比其他动物更平等。\n\n乔治·奥威尔\n\n本章内容\n\n*   运行 Python\
  \ 语句\n\n*   Jupyter 笔记本简介\n\n*   Google Colab 托管笔记本简介\n\n*   文本和代码单元格\n\n*   向 Colab\
  \ 环境上传文件\n\n*   使用系统别名运行 Shell 命令\n\n*   魔法函数\n\n本章介绍 Google Colab 的 Jupyter 笔记本环境，这是初学者入门科学\
  \ Python 开发的绝佳方式。本章首先探讨运行 Python 代码的传统方式。\n\n### 运行 Python 语句\n\n历史上，Python 要么在交互式\
  \ Python shell 中调用，要么通过向解释器提供文本文件来调用。如果您的系统上安装了 Python，您可以在命令行输入 `python` 来打开 Python\
  \ 内置的交互式 shell：\n\n点击此处查看代码图片\n\n```\npython\n\nPython 3.9.1 (default, Mar  7 2021,\
  \ 09:53:19)\n\n[Clang 12.0.0 (clang-1200.0.32.29)] on darwin\n\nType \"help\", \"\
  copyright\", \"credits\" or \"license\" for more information.\n```\n\n**注意**\n\n\
  对于本书中的代码，我们使用 **`粗体文本`** 表示用户输入（您需要键入的代码），使用 `非粗体文本` 表示任何产生的输出。\n\n然后您可以输入 Python\
  \ 语句并按 Enter 键运行它们：\n\n```\nprint(\"Hello\")\n\nHello\n```\n\n如上所示，每条语句的结果会直接显示在该语句行的下方。\n\
  \n当 Python 命令存储在扩展名为 .py 的文本文件中时，您可以在命令行通过键入 **`python`** 后跟文件名来运行它们。例如，如果您有一个名为\
  \ hello.py 的文件，其中包含语句 `print(\"Hello\")`，您可以在命令行中按如下方式调用该文件，并在下一行看到其输出：\n\n```\n\
  python hello.py\n\nHello\n```\n\n对于传统的 Python 软件项目，交互式 shell 足以作为探索语法或进行简单实验的场所。基于文件的代码才是真正进行开发和编写软件的地方。这些文件可以分发到任何需要运行代码的环境中。对于科学计算而言，这两种解决方案都不理想。科学家们希望既能与数据进行交互式互动，又能以基于文档的格式进行持久化和共享。基于笔记本的开发应运而生，填补了这一空白。\n\
  \n### Jupyter 笔记本\n\nIPython 项目是 Python 交互式 shell 的一个功能更丰富的版本。Jupyter 项目源于 IPython\
  \ 项目。Jupyter 笔记本将 Python shell 的交互性与基于文档格式的持久性结合在一起。笔记本是一个可执行文档，它将可执行代码与格式化文本相结合。笔记本由*单元格*组成，其中包含代码或文本。当执行一个代码单元格时，任何输出都会直接显示在该单元格下方。一个代码单元格执行的任何状态更改都会被后续执行的任何单元格共享。这意味着您可以逐个单元格地构建代码，而无需在做出更改时重新运行整个文档。这在探索和实验数据时尤其有用。\n\
  \nJupyter 笔记本已被广泛用于数据科学工作。您可以在本地机器上运行这些笔记本，也可以从托管服务（例如 AWS、Kaggle、Databricks 或 Google\
  \ 提供的服务）上运行。\n\n\n\n### Google Colab\n\nColab（Colaboratory 的简称）是谷歌的托管笔记本服务。使用 Colab\
  \ 是开始学习 Python 的绝佳方式，因为你无需安装任何软件，也无需处理库依赖或环境管理问题。本书的所有示例均使用 Colab 笔记本。要使用 Colab，你必须登录谷歌账号并访问\
  \ [`colab.research.google.com`](https://colab.research.google.com)（参见图 1.1）。在这里，你可以创建新笔记本或打开现有笔记本。现有笔记本可以包括谷歌提供的示例、你之前创建的笔记本，或者你复制到谷歌云端硬盘中的笔记本。\n\
