  \  [ 9],\n\n       [10],\n\n       [11],\n\n       [12],\n\n       [13]]])\n\nA6\
  \ = A4 - A5\n\nA6\n\narray([[[ 0,  1,  2,  3,  4],\n\n       [-1,  0,  1,  2,  3],\n\
  \n       [-2, -1,  0,  1,  2],\n\n       [-3, -2, -1,  0,  1],\n\n       [-4, -3,\
  \ -2, -1,  0],\n\n       [-5, -4, -3, -2, -1],\n\n       [-6, -5, -4, -3, -2]],\n\
  \n      [[-2, -1,  0,  1,  2],\n\n       [-3, -2, -1,  0,  1],\n\n       [-4, -3,\
  \ -2, -1,  0],\n\n       [-5, -4, -3, -2, -1],\n\n       [-6, -5, -4, -3, -2],\n\
  \n       [-7, -6, -5, -4, -3],\n\n       [-8, -7, -6, -5, -4]]])\n\nA6.shape\n\n\
  (2, 7, 5)\n```\n\n\n\n### NumPy 数学运算\n\n除了 NumPy 数组，NumPy 库还提供了许多数学函数，包括三角函数、对数函数和算术函数。这些函数专为\
  \ NumPy 数组设计，并常与其他库中的数据类型结合使用。本节将快速了解 NumPy 的多项式。\n\nNumPy 提供了 `poly1d` 类用于建模一维多项式。要使用此类，你需要从\
  \ NumPy 中导入它：\n\n```\n[1]    1 from numpy import poly1d\n```\n\n然后创建一个多项式对象，将系数作为参数传入：\n\
  \n```\npoly1d((4,5))\n\npoly1d([4, 5])\n```\n\n如果你打印一个 `poly1d` 对象，它会显示多项式的表示形式：\n\
  \n点击此处查看代码图片\n\n```\nc = poly1d([4,3,2,1])\n\nprint(c)\n\n    3     2\n\n4 x + 3\
  \ x + 2 x + 1\n```\n\n如果你为第二个参数提供值 `True`，则第一个参数将被解释为根而不是系数。以下示例模拟了计算 (x – 4)(x\
  \ – 3)(x – 2)(x – 1) 所得的多项式：\n\n点击此处查看代码图片\n\n```\nr = poly1d([4,3,2,1], True)\n\
  \nprint(r)\n\n   4      3      2\n\n1 x - 10 x + 35 x - 50 x + 24\n```\n\n你可以通过将\
  \ x 值作为参数传递给对象本身来求多项式的值。例如，你可以对 x 等于 5 的值求上述多项式的值：\n\n```\nr(5)\n\n24.0\n```\n\n\
  `poly1d` 类允许你在多项式之间进行运算，例如加法和乘法。它还以特殊的类方法形式提供多项式功能。清单 7.21 演示了此类与多项式的使用。\n\n清单 7.21\
  \ **多项式**\n\n点击此处查看代码图片\n\n```\np1 = poly1d((2,3))\n\nprint(p1)\n\n2 x + 3\n\np2\
  \ = poly1d((1,2,3))\n\nprint(p2)\n\n1 x + 2 x + 3\n\nprint(p2*p1)           # 多项式乘法\n\
  \n   3     2\n\n2 x + 7 x + 12 x + 9\n\nprint(p2.deriv())      # 求导\n\n2 x + 2\n\
  \nprint(p2.integ())      # 返回原函数\n\n        3     2\n\n0.3333 x + 1 x + 3 x\n```\n\
  \n`poly1d` 类只是 NumPy 工具包中提供的众多专业数学工具之一。这些工具将与你在后续章节中学到的许多其他专业工具结合使用。\n\n### 本章小结\n\
  \n第三方库 NumPy 是在 Python 中进行数据科学的主力工具。即使你不直接使用 NumPy 数组，你也会遇到它们，因为它们是许多其他库的构建块。诸如\
  \ SciPy 和 Pandas 之类的库直接构建在 NumPy 数组之上。NumPy 数组可以具有多种维度和数据类型。你可以通过控制其数据类型来调整它们以控制内存消耗。它们被设计为对大型数据集高效。\n\
