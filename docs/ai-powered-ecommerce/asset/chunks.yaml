- fmt: '# Returns Orders


    Ecommerce business is growing at a rapid pace and expected to surge by a CAGR
    of 31% from 2023 to 2029 [[1](#630035_1_En_8_Chapter.xhtml#CR1)] and easy return
    policy and cash on delivery option played significant roles. Return rate (% of
    orders returned by the customers) is around 25–40% in India, significantly higher
    compared to global average [[2](#630035_1_En_8_Chapter.xhtml#CR2)]. The ecommerce
    player may end up paying 10–15% of the order value as costs due to returns, which
    can significantly dent their profits [[3](#630035_1_En_8_Chapter.xhtml#CR3), [4](#630035_1_En_8_Chapter.xhtml#CR4)].


    Order returns could be classified into two groups: returned back due to non-delivery
    (Return to Origin – RTO) and second, customer-initiated returns post successful
    delivery.


    Figure [8-3](#630035_1_En_8_Chapter.xhtml#Fig3) illustrates the two types of returns
    in ecommerce: Returns to Origin (RTO), which occur before delivery, and Customer-Initiated
    Returns, which happen after the delivery has been completed.


    ![](images/630035_1_En_8_Chapter/630035_1_En_8_Fig3_HTML.jpg)


    Figure 8-3


    Returns before delivery (RTO) and post delivery (CIR)


    ## Customer-Initiated Returns (CIR)


    Once a product is delivered to the customer, the customer can return if the product
    is eligible for the return and it is within the return window. If the order date
    is Mar 13 and the return window is for seven days, the customer can initiate the
    return by Mar 20 only. For return, the customer needs to visit a mobile app or
    website and initiate the return.


    Typically, the customers are asked to enter a reason for return and provide more
    details. Additionally, in some cases, the platform makes it mandatory for the
    customers to provide a product image if the return reason is a damaged product,
    etc.


    Returns involve logistics cost (forward and reverse), packaging cost, damaged
    product/fake product return costs, in addition to bad customer experience.


    The common return reasons for Footwear and Apparel could be related to fit issues
    (not feeling well), does not look good on me, quality is not satisfactory, look
    and feel is different, or incorrect/defective product received [[4](#630035_1_En_8_Chapter.xhtml#CR4)].
    For home or watches categories, some of the reasons such as “part of order /product
    missing” or “Changed my mind” could be more common. Mix of reasons can vary by
    portfolio or category mix and by platform.


    Figure [8-4](#630035_1_En_8_Chapter.xhtml#Fig4) illustrates the key reasons for
    product returns.


    ![](images/630035_1_En_8_Chapter/630035_1_En_8_Fig4_HTML.jpg)


    Figure 8-4


    Product return reasons


    Return rate for apparel category could be as high as 25% of the order for a given
    period and return rate for watches category could be around 10–12%. For apparel
    and footwear categories, Size or Fit Issue is a significant contributor toward
    returns [[12](#630035_1_En_8_Chapter.xhtml#CR12), [20](#630035_1_En_8_Chapter.xhtml#CR20)].


    Ecommerce platforms need to improve the processes and fortify the platform to
    reduce the return rate. Multiple machine learning and AI models can significantly
    reduce returns. For instance, the platform can offer size recommendations using
    historical data of products kept and returned. These recommendations can range
    from collaborative filtering models to advanced deep learning approaches. Additionally,
    showing the likelihood of returns for each product can help buyers make more informed
    choices. To combat abusive behavior, implementing prompts during the ordering
    process can also help in reducing returns.


    Strategy to manage returns in ecommerce is


    *   **Product Onboarding:** Improving quality of product onboarded such as quality
    of product descriptions, image, and additional details can reduce chances of product
    returns.


    *   **Size Recommendations:** Fit issue is the single biggest contributor of product
    returns, especially for footwear and apparel category for ecommerce. Guiding customers
    with the right size decision can play a critical role.


    *   **Fortify Quality Control and Packaging Process:** For the marketplace model,
    product delivery processes involve multiple handshakes – seller operations, courier
    fleet, last mile delivery, and customers. Putting quality control and capturing
    data at various stages could be of great help in containing product returns related
    to damaged products or wrong product delivery.


    ## Product Content: Creation and Validation


    85% of shoppers consider product information and pictures for their purchase decisions
    [[5](#630035_1_En_8_Chapter.xhtml#CR5)]. AI tools can enable in creating product
    description, generating tags and designing product images [[6](#630035_1_En_8_Chapter.xhtml#CR6)].


    For an ecommerce marketplace, there are hundreds of sellers and probably they
    leverage vendor teams to create, catalog, and upload products on the ecommerce
    platform. Considering a diverse set of resources, a multi-layered validation process
    is required to ensure quality content goes online.


    *   **Product Image Quality Validation:** Review the uploaded product images for
    quality and flag if any of these images are of subquality. This process can be
    automated using computer vision models.


    *   **Product Category Validation:** Leverage AI models for creating product taxonomy
    based on the product images and validate the product hierarchy uploaded.


    *   **Product Description Generator:** Based on the key product taxonomy and search
    keywords, Generative AI models can help in generating accurate and appealing product
    description.


    ## AI-Based Size Recommendations: Enabling Customers with Right Decisions


    Fit or Size recommendation is one of the key challenges in fashion ecommerce.
    When customers are making a purchase decision on the ecommerce platform, they
    need to decide on the size decision. And incorrect decision leads to customers
    returning products, leading to bad customer experience and increased operational
    cost [[8](#630035_1_En_8_Chapter.xhtml#CR8), [11](#630035_1_En_8_Chapter.xhtml#CR11)].
    There are numerous challenges in recommending right size to a customer and some
    of these challenges are


    *   **Data Sparsity and Cold Start**: Customers can be new to platform (cold start),
    new to category (no earlier purchase in footwear, may have purchased apparel),
    and limited customers with multiple transactions across brands and categories.
    For example, only 0.64 co-purchase for brand–brand level, that means most of the
    brands are either not co-purchased or are co-purchased rarely [[11](#630035_1_En_8_Chapter.xhtml#CR11)].


    *   **Inconsistent Sizes across Brands**: Same size could refer to different measurements
    across brands. For example, a men’s US size 8 shoe is 10 inches for a Nike trainer
    while an Adidas trainer measures 10.2 inches [[9](#630035_1_En_8_Chapter.xhtml#CR9)].


    *   **Multiple Purchase Personas**: For the same account (registered customer),
    purchases could be for multiple customer personas. Multiple personas can be identified
    using Gaussian Mixture Model (GMM) [[9](#630035_1_En_8_Chapter.xhtml#CR9)].


    *   **Information missing**: For footwear, the size decision is a multi-factor
    decision, for example, attributes like arch type, shoe width, and shoe type play
    a role in whether a shoe will fit well or not. As per report, most vendors on
    the platform only provide length of the footwear and 80% of the vendors do not
    provide any information on shoe width, shoe arch type etc [[10](#630035_1_En_8_Chapter.xhtml#CR10)].'
