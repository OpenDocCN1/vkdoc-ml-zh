    ## 首页个性化


    几天后，Manisha 再次访问该电商平台，并进入了移动应用的首页。这是她的重复访问。电商平台根据设备 Cookie 识别出她。Cookie 可以存储浏览历史之外的各种数据点，包括位置和设备类型。即使她未登录，首页也会根据从
    Cookie 中提取的数据进行个性化设置。


    电商平台的首页包含几个重要元素：分类导航、主横幅（展示优惠活动的大型视觉区域）以及其他一些小部件或版块。但对于回头客来说，诸如“最近浏览”、“历史购买”和“为你推荐”等个性化小部件会开始向买家推送。


    平台识别出 Manisha 对印度服饰感兴趣，偏爱 Westside 品牌（基于她之前访问中的点击行为），并且她的价格承受能力高于平均水平。系统映射出她的偏好，并拉取带有这些特征标签的主横幅图片。横幅视觉图突出展示了网站品牌，并配有一位身着库尔塔套装的女士形象。同时，分类轮播中的分类顺序也针对她进行了个性化调整。首页内容根据她的兴趣进行调整，让她感到兴奋。


    除了个性化的主横幅和分类外，首页上还可见个性化小部件，包括“最近浏览的商品”和“根据浏览历史推荐的商品”。这些小部件的创建旨在建立与之前访问的连续性，以帮助她完成购买旅程。机器学习算法会识别出当用户浏览
    Manisha 之前访问中浏览过的商品时，通常会被探索或购买的额外商品列表。这些商品帮助她探索平台上可用但相关且个性化的选择。


    这两个个性化小部件是产品推荐的例子，但电商的个性化远不止于产品推荐。着陆页布局、上下文搜索以及展示精选优惠和促销活动，是电商首页个性化的一些额外维度。在动态布局中，首页的颜色和布局会根据买家偏好进行调整，营造出一个熟悉且诱人的空间，感觉就像是为他们量身定制。在上下文搜索中，搜索词的理解会考虑之前的浏览和购买行为。例如，由机器学习驱动的智能搜索能够理解“kurta”这个搜索词，并根据浏览历史将其映射到女式库尔塔套装，根据
    Manisha 对该分类的点击行为，向她展示更多女式库尔塔，而非男式库尔塔。


    对于 Manisha 来说，整个首页都是个性化的，展示了最近浏览的商品、与之前旅程相符的额外选项，并且优惠活动也是为她定制的。这为 Manisha 创造了顺畅的购买旅程，并促使她进行商品探索。


    首页，或称数字门户，在电商中对于创造引人入胜且个性化的体验至关重要。当买家访问首页时，可以专门为他们量身定制，每个小部件都根据他们的个人资料和偏好进行个性化设置。


    例如，如果买家是来自印度南部的男性，首页可以定制为展示与该人群相关的产品分类和推荐。此过程涉及将买家的人口统计和地理详细信息映射到分类表现矩阵。这个矩阵类似于用户-项目交互矩阵，将分类表现与买家细分群体联系起来。它被分解为一个分类特征矩阵和一个买家细分群体特征矩阵。


    为了个性化首页，每个买家根据其个人资料被分配到一个细分群体。然后，将该买家细分群体的特征偏好与分类特征矩阵进行比较。这种比较会识别出相似的分类，然后对这些分类进行排序，以确保最相关的分类出现在首页上。


    此外，首页上的每个小部件和功能——例如横幅、产品推荐和促销内容——都可以进行个性化设置，以提升买家体验。通过根据买家的个人资料和互动动态调整这些元素，电商平台可以提高参与度和满意度。


    现在，我们将探讨一个案例研究，了解印度领先的时尚电商平台 Myntra 如何个性化其店面。他们如何为用户创造个性化体验，以及改进后的旅程带来了什么影响？


    ***案例研究：Myntra 的店面定制*** ******[3***,*** 23***]***


    *印度领先的时尚电商平台 Myntra 正在通过超个性化重新定义购物体验。一个复杂的人工智能引擎将其首页（称为“店面”）转变为为每位顾客精心策划的时尚空间。*


    *Myntra 超越了基本的数据收集，以理解其顾客“时尚品味”的精髓。顾客的“时尚品味”不仅包括偏好的品牌和分类，还包括他们对特定产品属性（如颜色、面料，甚至偏好的版型）的微妙倾向。这种丰富的偏好图景在个性化店面中得到了考虑。*


    *Myntra 的人工智能引擎通过已购商品解读个人风格，提取关键特征，如偏好的品牌、颜色、面料和款式。与每个横幅相关联的特征是根据对横幅和目标商品的点击得出的。通过将顾客的“时尚品味”与每个横幅的精髓相匹配，Myntra
    的人工智能编排出一场店面交响乐，其中每个广告都直接与个人品味对话。*


    *“通过这一改变，同时进入 Myntra 应用商店的两位用户会看到完全不同的商店，以满足他们的时尚购物需求”* **[3*]。*


    *电商平台的首页包含各种小部件，例如横幅、推荐版块和行动号召旅程小部件，每个都包含特定内容。目标是动态排列这些小部件，为个人用户量身定制首页体验。为此，采用了一种称为上下文多臂老虎机的强化学习算法来为每位买家生成个性化布局。*


    *该平台利用联邦架构来最小化延迟，确保快速响应的交互。排名服务通过内存缓存进行管理，这有助于进一步减少响应时间。此外，系统集成了近实时和批量数据管道，以平衡数据的时效性与全面处理的需求。根据性能指标，此服务的
    p99 响应时间为 50 毫秒，表明这是一个高效且响应迅速的系统。*


    个性化是一种在多个触点上吸引客户并为电商业务带来成果的体验。个性化提高了用户访问的转化率以及他们再次光顾的可能性。在下一节中，我们将详细探讨个性化带来的影响。

    '
- fmt: '# Impact of Personalization in Ecommerce


    Personalization has woven itself into the very fabric of ecommerce. Its roots
    go back to the dawn of online shopping, with pioneers like `Amazon` and `eBay`
    leveraging their power in the 1990s. Fast forward to the early 2000s, and recommendation
    engines became go-to tools for personalization. `Amazon`’s collaborative filtering
    algorithms, subtly nudging customers toward the next purchase based on their past
    behavior.


    Enter the 2010s, when the landscape shifted dramatically. Artificial intelligence
    (`AI`) and machine learning (`ML`) became the new sheriffs in town, enabling more
    accurate predictions and real-time adjustments. Personalization moved beyond product
    recommendations, and was used for personalized emails, chatbots, virtual assistants,
    and even dynamic website content, all tailoring the experience to individual preferences.


    The last few years have witnessed a meteoric rise in hyper-personalization. Every
    click and action is dissected and analyzed, shaping product suggestions and content
    in real time. Think of it as a bespoke shopping experience, curated just for a
    user. Technologies like natural language processing (`NLP`) and computer vision
    further refined these strategies, extending personalization to promotions, discounts,
    and loyalty programs.


    Personalization is no longer a differentiation but essential for survival [[4](#630035_1_En_7_Chapter.xhtml#CR4)].
    Customer expectations on personalization is on the rise – 73% of shoppers expect
    brands to understand their unique needs and expectations[[5](#630035_1_En_7_Chapter.xhtml#CR5)].
    A successful personalized program can deliver significant business impact, “20
    percent higher customer-satisfaction rates, a 10 to 15 percent boost in sales-conversion
    rates” [[4](#630035_1_En_7_Chapter.xhtml#CR4)]. According to `McKinsey` research,
    the companies that excel at personalization generate 40% more revenue than average
    players [[5](#630035_1_En_7_Chapter.xhtml#CR5)].


    Great examples of successful personalization programs for the ecommerce platforms
    and across marketing funnels are described below.


    * **BigBasket:** Indian Grocery Platform achieved improved click-through rates
    from 1.8% to 2.5%–3% and a surge (26% uplift) in addition to cart using right
    time push notifications to the customers [[4](#630035_1_En_7_Chapter.xhtml#CR4)].

    * **Multi-Category Ecommerce Marketplace:** A multi-category ecommerce platform
    selling products fashion, footwear, accessories, electronics, and luxury verticals
    leveraged personalization and achieve 2X revenue growth and 35% increase in customer
    engagement [[7](#630035_1_En_7_Chapter.xhtml#CR7)].

    * **Tata CLiQ:** `Tata CLiQ` is an omni-channel marketplace owned by `Tata Unistore
    Limited`, a part of the Indian conglomerate `Tata Group`. Leveraged personalized
    message for cart abandonment campaign, leading to 1.5X boost in Click Through
    Rate (`CTR`) [[8](#630035_1_En_7_Chapter.xhtml#CR8)].

    * **Paytm:** Indian Financial services company, `Paytm`, personalized recommendations
    on its home page and observed a 5.5–6% conversion rate from the `Paytm Mall` homepage
    [[9](#630035_1_En_7_Chapter.xhtml#CR9)].

    * **Sephora:** `Sephora`, founded in 1970 and acquired by `LVMH` in 1997, has
    ~2300 stores in 33 countries worldwide. `Sephora` is investing in `AI` for personalized
    product recommendations [[10](#630035_1_En_7_Chapter.xhtml#CR10)].


    These are just a few published studies that highlight the importance of personalization.
    Personalization is at play across touchpoints in ecommerce.


    With the advent of deep learning and large language models, the nuanced details
    of buyer behavior – such as feedback, clicks, and purchases on ecommerce platforms
    – are captured and represented as embeddings. Vector databases have further enhanced
    the ability to leverage these details almost in real time, enabling highly personalized
    search results and other buyer-specific features on ecommerce platforms. The challenge
    of creating and managing a large number of features for machine learning models
    has been mitigated by the power of deep learning, which can effectively handle
    hundreds of features and scale efficiently.


    In this era of hyper-personalization, the constraints of cluster or segment numbers
    are no longer a limiting factor. Personalization efforts are increasingly focused
    on individual buyer levels, allowing for a more tailored and precise buyer experience.


    In the example of Manisha, she visits again organically, but the ecommerce platform
    cannot rely solely on visitors remembering to return. The marketing team, responsible
    for driving customer engagement from existing customers or visitors, typically
    known as the Relationship Management (`CRM`) team, works on designing campaigns
    to bring back visitors to the platform. Personalized email marketing can significantly
    improve key performance metrics, including open rates (the percentage of recipients
    who open the emails), click-through rates (the percentage of recipients who click
    links within the email to visit the e-commerce platform), and transaction rates
    (the percentage of recipients who ultimately make a purchase on the platform)
    [[6](#630035_1_En_7_Chapter.xhtml#CR6)].'
