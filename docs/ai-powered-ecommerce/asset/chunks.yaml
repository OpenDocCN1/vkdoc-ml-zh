- fmt: '# Ranking: A Deterministic Model


    Performance factors like product views, orders, and sales value, along with efficiency
    attributes such as click-through rate, cart add rate, and conversion rate, could
    be considered for deriving a composite score using a ranking function. These composite
    scores are then used for ranking the products when users like Manisha search for
    printed sarees.


    One of the simpler forms of the ranking function could be a deterministic approach.
    In this method, weights are assigned to each of the performance factors and efficiency
    attributes to develop a composite score. The weights are determined based on the
    business context and criteria, arrived at after discussions with relevant business
    stakeholders. This approach allows for a clear and consistent ranking of products
    based on predefined priorities and objectives.


    Ecommerce platforms like Flipkart run the “Big Billion Days” sale every year,
    during which more discounted products are displayed to users. In the deterministic-based
    composite ranking score approach, higher weights are assigned to the percentage
    discounts on the products to reflect their increased attractiveness.


    Similarly, during festivals, new and trending products are highly sought after.
    In the ranking scores, higher importance is given to new arrivals and trendy products
    to match user preferences and seasonal trends. This adaptive weighting ensures
    that the most relevant products are highlighted based on the current context and
    user interests.


    In the deterministic approach, weights are assigned to pre-identified factors
    based on their importance, and the composite popularity scores for products are
    calculated accordingly. This method can be complex in practice, as products can
    appear on various pages, including brand, category, or search results, and any
    changes in weights affect all these listings. During sales or seasonal events,
    the weights of relevant factors are adjusted to highlight more pertinent products.
    For instance, while newness might typically account for 5% of the score, it could
    be increased to 10% during sales to better represent new arrivals.


    A deterministic approach for ranking products is a simple and transparent method
    for creating composite scores to arrange products, such as in ecommerce search
    results. However, it comes with some challenges and limitations.


    Ecommerce platforms, like Myntra or Amazon, handle hundreds of thousands of search
    query terms, each associated with numerous products to arrange. As discussed in
    the search chapter, search terms are normalized to aggregate similar intent queries
    into the same normalized query. For example, “T-shirt for men” and “Men’s t-shirt”
    can be grouped into the same normalized query.


    However, managing the weights assigned to each normalized query can be quite demanding.
    Additionally, the product performance and efficiency attributes used are based
    on historical data, not necessarily reflecting how they will influence future
    product performance. This limitation makes it difficult to adapt to changing trends
    and user behaviors dynamically.


    # Ranking: A Machine Learning Model


    A supervised machine learning framework can be utilized to create ranking scores
    within each normalized search query. The ranking aims to improve business metrics
    and user experience.


    Labeled ranks are essential for developing a model that ranks products. One method
    for assigning ranks to products for each major search query is based on manual
    review and business knowledge. However, given the volume of search queries, this
    approach can be challenging and a bottleneck.


    A systematic and automated method for assigning ranks to products for each search
    query uses a functional form. This form can combine total sales, order count,
    and conversion rate. Weights can be assigned across products and search queries.
    While the order count may bias toward low-priced items due to their high volumes,
    considering the conversion rate priorities products recommended more frequently
    or displayed to a wider audience, ensuring that popularity is not solely determined
    by price.


    - `Ranks = f(GMV, Orders, Conversion Rate)`


    Weights for these three factors are determined through simulation and analysis,
    taking into account the varying measurement scales of the factors. Scaled values
    are used before applying weights to derive the final values and ranks.


    The ML-based predictive modeling structure employed for the ranking model involved
    creating ranks for three days and utilizing a previous 30-day window to generate
    features.


    ![](images/630035_1_En_6_Chapter/630035_1_En_6_Fig6_HTML.jpg)


    **Figure 6-6** Structure of supervised ranking model development


    To construct these features, a variety of product performance drivers and product
    attributes were employed. The following base features were considered:


    - **Product Characteristics:** Color, Fit Type, Pattern, etc.

    - **Performance Statistics:** Orders, sales value, product views, etc.

    - **Efficiency Ratios:** Cart Add Rate, Conversion rate, etc.

    - **Feedbacks:** Return Rate, ratings, reviews


    Product review data on ecommerce platforms provide valuable insights that can
    enhance popularity ranking models. However, since reviews are textual, they must
    be converted into numerical features before being integrated into the ranking
    model.


    Common methods for feature extraction include calculating sentiment scores, such
    as percentages of positive and negative sentiments, and converting these into
    ranked values (e.g., whether a product falls in the top 20% based on positive
    sentiment). Additionally, natural language processing (NLP) and transformer models
    can identify the top tags associated with products. Features such as the count
    of reviews and positive sentiment scores for these tags are also considered. For
    instance, if a tag frequently highlights product design issues, products associated
    with that tag might be ranked lower.


    In deep learning-based ranking systems, textual reviews can be transformed into
    embeddings using advanced techniques. These embeddings capture the semantic meaning
    of the reviews, allowing the model to use them directly as input. This approach
    enables the ranking system to leverage the nuanced information contained in the
    reviews, such as overall sentiment and context, to improve the accuracy and relevance
    of product rankings.


    The predictive ML model approach leverages the historical features for finding
    relevant ranks in the period ahead.


    ## Case Study: Ranking Search Results for Fashion Products


    ### Context


    Indian fashion ecommerce platform wanted to develop a seamless and personalized
    shopping experience for its buyers. Over 30% of buyers used the platform’s search
    function, with a majority clicking on products displayed in the results. A crucial
    aspect of this experience was effectively ranking search results for fashion products,
    ensuring buyers saw the most relevant and appealing items.'
