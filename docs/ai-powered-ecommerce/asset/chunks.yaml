  trans: '

    ## 减少客户退货——标记平台滥用者


    除了帮助真实客户提供合适的尺码建议以减少退货外，识别并针对平台滥用者采取行动同样重要。


    Appriss Retail 报告发现，网购退货总额高达 410 亿美元，其中 35%（约 140 亿美元）属于退货欺诈 [14]。另一份报告指出，高达 14%
    的退货被证实存在欺诈行为 [15]。


    日益增长的欺诈性退货要求电商平台制定防御措施。严格的退货政策可能因不愉快的退货体验而导致客户流失；因此，找到欺诈客户和交易，并仅针对他们采取行动至关重要。


    *   **退货运费**：在印度某领先的开放市场平台上，基于机器学习模型，平台会预测客户是否可能退货，并显示类似“如果您退货，将被收取运费”的提示；这主要是为了威慑那些有退货意图的客户。


    *   **退货发起时验证**：当客户发起退货流程时，根据预测的滥用风险，平台会强制要求客户上传产品图片。计算机视觉模型会验证退货是虚假还是真实的。


    *   **逆向取件质检**：逆向取件过程中的质量检查涉及在从买家处取回退货商品前对其进行检验。此过程会增加配送员和电商平台的额外工作量和成本。由于这些额外成本，对所有退货都实施质检并不可行。相反，机器学习模型可以优化此流程。通过分析错误退货和真实退货的历史数据，模型可以整合与买家、产品、地理位置等因素相关的特征。当买家发起退货时，模型会根据这些特征评估是否启用质检标记。如果标记被激活，配送合作伙伴会在取件前进行质量检查；否则，将跳过检查。


    ## 无法配送订单与退回发货地交易


    5–8% 的电商交易因无法配送而被退回给卖家。导致交易无法配送的主要原因有两个：客户意图问题（客户无意接收货物，即平台滥用者）和错误的配送地址。


    这些错误地址是导致电商企业产生退回发货地损失的主要原因之一 [16]。


    “错误地址在印度造成的经济影响巨大：根据新兴世界对主要行业的估算，糟糕的地址每年给印度造成 100 至 140 亿美元的损失，约占 GDP 的 0.5%”
    [15]。


    有多种方法可以减少电商平台上的错误地址。一种帮助客户选择地址的选项是使用“谷歌地图”。强制使用此功能存在两个挑战：首先，印度二三线城市的客户可能会觉得使用起来有困难；其次，这可能会对退货率产生负面影响，因为他们可能会随意选择一个地点。总之，由于在订单流程中增加了额外步骤，转化率可能会受到影响，并且平台滥用者可以轻松选择任意地址下单，因为他们本来就没打算收货。


    识别高风险配送地址可以显著降低退回发货地比例并提高配送成功率。通过实施地址验证流程，“可将退回发货地/取消订单的几率降低高达 30%” [16]。


    在我之前任职的公司，我们建立了一个基于机器学习的无法配送地址识别流程，用于识别乱码和无法配送的地址，从而显著降低了退回发货地比例，并减少了错误退货。带有错误地址的交易会被近乎实时地识别出来，并提交审核和处理。考虑到客户服务的重要性，这些交易中只有
    50% 被采取了行动——取消交易、屏蔽客户或仅接受预付交易。而对于另外 50% 的交易，其退回发货地比例高达 3 倍，且退货率和虚假退货率显著更高。


    地址只是一个表象，并非所有客户都有不良意图；他们可能只是不知道如何正确提供地址。因此，客户历史记录在地址处理中可能是一个重要的影响因素。客户退回发货地模型和错误配送地址模型相结合，有助于提高识别平台滥用者的效率并降低退回发货地率。


    ## 取消订单


    订单取消是导致电商平台效率低下的另一个因素。较高的取消率会导致因库存占用而错失销售机会、预付订单的支付网关费用、运营成本（订单处理、拣货和包装）以及物流成本（如果在交给快递合作伙伴后取消）。取消订单还会导致库存信息失真，从而增加整个系统的总成本
    [19]。


    由于成本增加、订单处理和库存占用，取消订单会给卖家带来糟糕的体验。


    根据经验，观察到 4–6% 的交易被客户取消，其中超过一半的取消发生在下单后一小时内。一小时内取消的订单是主要问题之一，并会产生支付费用——约为交易金额的
    1.5%。


    图 8-9 直观展示了订单取消的主要原因及其相对占比。


    ![](img/630035_1_En_8_Fig9_HTML.jpg)


    图 8-9


    订单取消原因


    较长的配送时间或延迟配送，以及产品价格，可能是客户取消订单的驱动因素。但客户通常会选择“我改变了主意”和“我误下了订单”。


    用于改善卖家体验和成本的机器学习预测：一旦订单在电商平台上确认，订单就会被分配给卖家，卖家运营团队开始处理订单。对于在一小时内取消订单可能性较高的客户，订单可以在分配给卖家之前被暂缓一小时。这有助于减少订单处理工作量并改善卖家体验。

    '
- fmt: '# Summary


    The total value of orders on an ecommerce platform is referred to as Gross Merchandising
    Value (`GMV`), while the final value of orders kept by buyers is known as Net
    Merchandising Value (`NMV`). The gap between `GMV` and `NMV` represents costs
    and adverse experiences for partners within the ecommerce ecosystem. Key drivers
    of this gap include cancellations, Return to Origin (`RTO`) orders, customer-initiated
    returns, and fake returns or damages.


    The fulfillment journey involves multiple processes and partners, making technology,
    particularly machine learning and artificial intelligence (`AI`), a cost-effective
    and scalable solution for managing these challenges. Customer Initiated Returns
    (`CIR`), which occur after delivery, can stem from issues like product quality
    or fit. `AI` and ML can mitigate returns by offering personalized fit recommendations
    and virtual try-ons.


    `RTO`, or non-delivery, involves products returned to sellers due to issues such
    as incorrect addresses or buyer unavailability. Machine learning models help reduce
    `RTO` by proactively identifying and addressing problematic orders. Effective
    management of `RTO` is crucial for minimizing associated costs and enhancing ecommerce
    profitability.


    Cancellations, whether initiated by customers or sellers, also pose significant
    challenges. `AI` and ML can assist in managing and reducing the costs associated
    with cancellations. Additionally, these issues often result in negative experiences
    for buyers and sellers, such as frustration from receiving poor-quality products
    or frequent cancellations. Abusive behaviors, like fraudulent returns or incorrect
    shipments, further exacerbate these problems. Machine learning models play a vital
    role in detecting and mitigating such abuses, improving the overall experience
    for all parties involved.


    Leading ecommerce platforms are continuously leveraging and enhancing these technologies
    to improve buyer experience and operational efficiency. By addressing these challenges
    effectively, they aim to optimize processes and drive profitability in the competitive
    ecommerce landscape.'
