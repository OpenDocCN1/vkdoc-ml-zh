    1-4 周这些群体购买产品的数据。采用多模型方法为每个品类创建了产品嵌入向量。随后利用这些嵌入向量来匹配当前的库存商品。然而，这种方法存在局限性，例如无法捕捉新兴趋势。为解决此问题，专家手动策展了额外的新颖产品。*


