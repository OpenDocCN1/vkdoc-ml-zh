- fmt: '# Category Management


    The availability of categories, brands, and products on an ecommerce platform
    creates differentiation for any ecommerce business. For a marketplace ecommerce
    platform, the presence of diverse brands and sellers defines its relevance and
    identity. In the fashion segment, the types of brands and price ranges indicate
    the target group that the platform aims to serve.


    One of the core responsibilities of category managers is identifying brands and
    products that align with the platform’s buyers. Creating a prospective list of
    brands and sellers involves understanding buyer needs, analyzing competitors to
    identify new opportunities and gaps in their product assortments, and distinguishing
    fashion trends and style innovations. Data and AI enable category managers to
    track the competitive landscape, capture buyer needs and preferences, and select
    appropriate trends that align with the buyers. Category managers typically monitor
    key competitor ecommerce platforms, including reviews and top-performing products
    and brands. Natural Language Processing (NLP) can analyze competitors’ product
    descriptions, customer reviews, and social media mentions to provide actionable
    insights, helping them stay informed and make strategic decisions.


    Stitch Fix is a US personal styling company founded by Karina Lake that uses machine
    learning algorithms and human stylists to deliver personalized fashion products
    to its buyers [[5](#630035_1_En_3_Chapter.xhtml#CR5)]. Beyond delivering “the
    right styles to the right people at the right time,” the company has created a
    framework that helps in identifying future styles using algorithms. Some limitations
    of these algorithms are augmented by human insights and experience.


    The process of generating ideas for new styles and deciding on investments involves
    a long gestation and iterative approach. The company tests new items via Style
    Shuffle even before producing and procuring them. This method improves the efficiency
    of producing successful styles and reducing waste [[6](#630035_1_En_3_Chapter.xhtml#CR6)].


    Similarly, other leading ecommerce platforms like Zalando, H&M, and Alibaba are
    using AI for creating new designs, demand forecasting, and optimizing assortments.
    Google, Zalando, and the UK-based production company Stinkdigital have developed
    a predictive “design engine.” This engine leverages AI technologies to enable
    creative decisions, showing color, texture, and style preferences of over 600
    fashion experts [[8](#630035_1_En_3_Chapter.xhtml#CR8)].


    After identifying buyer needs, emerging style trends relevant to the buyers, and
    a list of brands/sellers, the category managers engage the brands for onboarding
    to the ecommerce platform. The journey to onboard a brand involves multiple considerations
    before moving into operational and technology discussions. Identifying potential
    brands for an ecommerce platform involves both art and science. The scientific
    aspect is supported by machine learning methods and performance insights. For
    example, analyzing buyer preferences on the platform and key products from competing
    brands provides valuable data for brand selection. Additionally, Natural Language
    Processing (NLP) can enhance this understanding by evaluating product quality
    and fit based on buyer reviews from competitor websites.


    Brand reputation and product quality are paramount for delivering a better experience
    for buyers on the platform. Typically, a platform has a set of guidelines and
    assessment criteria for onboarding brands that will deliver value to the platform’s
    buyers. Exclusive partnerships or collaborations with brands enable platforms
    to offer unique products, creating a distinct edge over the competitors. The category
    teams evaluate whether the new brands contribute to a healthy mix of new, established,
    popular, and niche brands on the platform.


    In an ecommerce marketplace, commission revenue is a critical component of the
    business model. The platform typically earns a percentage of each transaction
    value, which is negotiated and agreed upon by category management and the brand.
    Category managers play a pivotal role in driving this revenue by strategically
    managing product assortments and brand selections.'
  raw: '## Category Management


    The availability of categories, brands, and products on an ecommerce platform
    creates differentiation for any ecommerce business. For a marketplace ecommerce
    platform, the presence of diverse brands and sellers defines its relevance and
    identity. In the fashion segment, the types of brands and price ranges indicate
    the target group that the platform aims to serve.


    One of the core responsibilities of category managers is identifying brands and
    products that align with the platform’s buyers. Creating a prospective list of
    brands and sellers involves understanding buyer needs, analyzing competitors to
    identify new opportunities and gaps in their product assortments, and distinguishing
    fashion trends and style innovations. Data and AI enable category managers to
    track the competitive landscape, capture buyer needs and preferences, and select
    appropriate trends that align with the buyers. Category managers typically monitor
    key competitor ecommerce platforms, including reviews and top-performing products
    and brands. Natural Language Processing (NLP) can analyze competitors’ product
    descriptions, customer reviews, and social media mentions to provide actionable
    insights, helping them stay informed and make strategic decisions.


    Stitch Fix is a US personal styling company founded by Karina Lake that uses machine
    learning algorithms and human stylists to deliver personalized fashion products
    to its buyers [[5](#630035_1_En_3_Chapter.xhtml#CR5)]. Beyond delivering “the
    right styles to the right people at the right time,” the company has created a
    framework that helps in identifying future styles using algorithms. Some limitations
    of these algorithms are augmented by human insights and experience.


    The process of generating ideas for new styles and deciding on investments involves
    a long gestation and iterative approach. The company tests new items via Style
    Shuffle even before producing and procuring them. This method improves the efficiency
    of producing successful styles and reducing waste [[6](#630035_1_En_3_Chapter.xhtml#CR6)].


