- fmt: '# Overview


    It is the month of October, and in Bengaluru, India, most schools have completed
    mid-term examinations. Leks has two kids, and they are looking forward to a short
    vacation nearby. After online research and discussions, they converged on Pondicherry
    (southern part of India and not very far from Bangalore or Chennai) for the trip.


    Pondicherry was a French colonial settlement in India until 1954, and now a Union
    Territory town bounded by the southeastern Tamil Nadu state. The mustard-colored
    colonial villas and seaside promenade running along the Bay of Bengal are some
    of the exciting parts. They have heard a lot about this place, and all were looking
    forward to their trip.


    Leks and his friends assembled for a dinner, post the mid-term examinations and
    a few days before the travel date. All started sharing their plans for the vacations
    and it was his turn. Leks was impressed with the suggestions that poured in from
    his friends on places to visit in Pondicherry, eateries, places to go, shopping
    destinations, and when to do what.


    If Leks uses a travel portal with a recommendation engine for his annual travels,
    the platform will present curated hotel choices based on his historical preferences
    and budget. Additionally, a generative AI-enabled chatbot can assist with itinerary
    planning, suggesting activities for each day of the trip. Despite these advancements,
    many recommendations remain fragmented. Currently, few platforms offer comprehensive
    end-to-end travel recommendations, covering trip planning, accommodation, restaurant
    suggestions, and activities.


    The friends knew his taste, preferences, budget, and much more. When they suggested
    places to eat, they factored in that Leks and his family are vegetarians. While
    suggesting places and when to visit them, they factored in kids and their love
    for adventure activities.


    We all love to get suggestions and feedback when we are exploring options or making
    choices. We aspire to have a friend that knows about us, has context, and helps
    us in curated choices that align with our interest and preferences.


    What if there is a friend that synthesizes all the information shared with it,
    and for a given context, explores all the options available and creates a curated
    choice for you. This new friend is a virtual friend powered by a new technology
    – Machine Learning and Artificial Intelligence. This “virtual friend” helps all
    of us across ecommerce platforms like Amazon or Myntra and streaming platforms
    like Netflix. This virtual friend is called a recommendation engine.


    Recommendation engines on ecommerce platforms consider past behavior, preferences,
    and purchase history to create curated choices (e.g., prepare product list or
    select a few brands, etc.) that a buyer will be interested in for a given context
    or visit. These engines not only simplify the decision-making process but also
    enhance buyer experience.


    # Recommendation Engines for Ecommerce: Engage Buyers with Curated Choices


    Manisha is a housewife and an online shopping enthusiast as most females are and
    she is a regular shopper at a prominent fashion ecommerce platform in India.


    She opens the ecommerce mobile application (app) and can see a wide range of widgets
    on the app. Today she is interested in exploring the “Kurta set” and decides to
    follow taxonomy-based navigation and starts her shopping journey.


    Figure [5-1](#630035_1_En_5_Chapter.xhtml#Fig1) illustrates the browsing journey
    based on product taxonomy.


    ![](images/630035_1_En_5_Chapter/630035_1_En_5_Fig1_HTML.jpg)


    Figure 5-1


    Product taxonomy or hierarchy


    She can see trendy and popular “Kurta Set” on the category page. These are ranked
    by the popularity-based ranking algorithms, will be discussed in the subsequent
    chapter and the list is personalized for her history and preferences.


    While exploring products, “Similar Products” catches her eye, inviting her to
    explore further. With each click, the platform presents enticing options that
    resonate with her style.


    When she ventures into detailed product pages, she notices “Customers Who Bought
    This Also Bought” and that is guiding her through a maze of choices. The result?
    Her virtual cart brimmed with carefully selected items.


    Even on the cart page, she notices “Style On” and entices her to explore products
    across categories such as Handbag and Sandals and these products matching the
    kurta-set that she has added to the cart. She adds one pair of sandals to the
    cart. This is how the platform engages her with options and she loves shopping.


    On top of it, every time she returns to the platform, the personalized widgets
    “Recommended for You” and “Inspired by Your Browsing History” capture her attention
    and enable her journey on the platform. These unassuming widgets, presenting captivating
    and enticing options to explore further, offer suggestions that seem to align
    seamlessly with her tastes and preferences.


    Month after month, she finds herself captivated by the platform’s suggestions
    and recommendations, investing both time and money.


    Have you ever wondered how ecommerce platforms keep her interested in the platform?
    How do they know what products to recommend to her?


    This is not an isolated story of Manisha but millions of ecommerce buyers worldwide.
    In India, as well as in other parts of the world, millions of buyers visit ecommerce
    platforms such as Amazon, Flipkart, and Tmall (a leading Chinese B2C platform
    with 800 million buyers [[3](#630035_1_En_5_Chapter.xhtml#CR3)]). These buyers
    visit the platforms to find products that meet their needs from among hundreds
    of millions of options available.


    Amazon India offers over 168 M products [[1](#630035_1_En_5_Chapter.xhtml#CR1)]
    and US Amazon and its marketplace sellers have over 350 million products in the
    United States [[2](#630035_1_En_5_Chapter.xhtml#CR2)]. While the vast volume of
    options available caters to diverse needs, navigating through countless choices
    can be time-consuming and frustrating. Taxonomy-based navigation may offer some
    help, but it can also be limited in addressing specific preferences. In such cases,
    search functionality can come to the rescue by allowing users to quickly find
    what they’re looking for based on their specific criteria.


    Leaving users to search and navigate on their own can be costly for ecommerce
    platforms, as it can lead to poor engagement and lower conversion rates. “The
    faster we can assist a user in finding the right product, higher are the chances
    of user conversion” [[11](#630035_1_En_5_Chapter.xhtml#CR11)]. Creating curated
    and personalized choices using recommendation-engine that provides a mechanism
    to get what is relevant to the user, improving buyer experience, engagement, and
    ultimately conversions.'
