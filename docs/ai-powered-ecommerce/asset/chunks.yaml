- fmt: '# Ranking for Similar Product Recommendations


    In the world of online fashion, “similar product” recommendations aren’t just
    window dressing – they’re a conversion-driving powerhouse. Buyers browsing product
    pages (`PDPs`) rely on them like a trusted stylist, to discover their preferred
    products and make purchase decisions. While only 10–20% of Indian fashion ecommerce
    visitors actively engage with these recommendations on the detailed product pages,
    they’re high-intent buyers, primed to buy. That’s why optimizing the order of
    these suggestions is paramount for boosting conversion rates.


    User expectations for “Similar Products” are driven by both the product’s inherent
    features like style, material, and color, and its visual elements like patterns,
    shapes, and colors. Similar Products recommendation engine does product feature
    matching and extracts visual cues from images, and factors in product popularity
    data to dynamically generate relevant product recommendations. This ensures users
    discover items that not only match in product styles but also align with current
    trends, ultimately leading to a more satisfying and engaging shopping experience.


    Similar product recommendations can be refreshed regularly and effectively, even
    when product characteristics (such as color or pattern) remain static. This is
    accomplished by updating implicit factors derived from buyer interactions and
    purchase patterns, which are captured in both the user feature matrix and the
    product feature matrix. As buyer behavior evolves, these updates ensure that recommendations
    adapt dynamically to changing preferences over time. Furthermore, machine learning-based
    ranking systems integrate updated product metrics to continuously refine the products
    shown to buyers. This approach ensures that recommendations remain relevant and
    aligned with current trends and performance data, even in non-personalized contexts.


    On the ecommerce platform, buyers see five “Similar Products” recommendations
    below their chosen products with an option to explore more similar products, as
    shown in the figure below. However, most engagement happens with the default list
    displayed. Therefore, the primary goal is to ensure the top five products in this
    widget are the most relevant and impactful, maximizing business outcomes. This
    involves designing ranking algorithms that optimize the placements of these top
    products for each buyer.


    Figure [6-8](#630035_1_En_6_Chapter.xhtml#Fig8) illustrates a layout example for
    similar product recommendations.


    ![](images/630035_1_En_6_Chapter/630035_1_En_6_Fig8_HTML.jpg)


    **Figure 6-8** Similar product display layout


    Candidate lists of similar product recommendations are generated using image-based
    Similar Product Generation – identify items with similar visual elements, such
    as patterns, colors, and shapes, etc. and Product Attribute-based Similar Product
    Generation – incorporate features based on product descriptions and specifications
    like material, size, or brand.


    The candidate similar products are rearranged using Learning to Rank (`LTR`).
    The model prioritizes products with high recent sales, user ratings, and click-through
    rates, ensuring buyers see products that are not only relevant but also well-received
    by others.


    Learning-to-Rank (`LTR`) models in ecommerce face several challenges due to the
    dynamic nature of the industry. In fashion ecommerce, for example, trends change
    rapidly, and new designs can quickly become popular. However, these new products
    may lack historical data, making it difficult for `LTR` models to effectively
    rank them. Data quality is crucial; biases or inaccuracies in the data can significantly
    impact the model’s outcomes. Furthermore, deep learning-based ranking models,
    while powerful, can suffer from overfitting, especially if they are not adequately
    regularized or if they rely too heavily on historical patterns.


    For example, when a user browses a pair of chunky sneakers on the ecommerce platform,
    the user is shown options that are trending and aligned with the current preferences,
    leading to a more satisfying shopping experience.


    ## Conclusion


    Ranking is fundamental for enabling buyers to find relevant products and for users
    to discover information on digital platforms. Whether it’s an ecommerce platform,
    search engine, or streaming service, the strategic placement of products, content,
    or services through ranking significantly enhances the user experience.


    Google’s pioneering `PageRank` algorithm underscored the potency of ranking systems,
    revolutionizing how we interact with information. Today, ranking is an indispensable
    component of digital success, demanding strategic approaches and continuous optimization.


    Ecommerce thrives on relevance. By presenting the most pertinent products at the
    forefront, platforms enhance the buyer experience, drive conversions, and foster
    loyalty. The importance of ranking is evident across touchpoints, from showing
    a ranked list of options on the homepage to displaying ranked search results and
    browsing pages.


    As the digital landscape evolves and ecommerce platforms take center stage for
    millions of buyers, ranking algorithms play a crucial role in sorting products
    or options on these platforms. Personalized category sequences and widget options
    on the homepage engage users and improve their experience. During the search journey,
    ranked product lists improve click-through rates (`CTR`) and conversions. Search
    ranking is enabled through machine learning (`ML`) and artificial intelligence
    (`AI`) algorithms. Similarly, recommendations and products on listing pages are
    augmented using ranking algorithms on top of identified candidates.


    In the next chapter, the focus is on how personalization elevates the buyer experience.
    In addition to personalized ranking across search and recommendations, personalization
    influences buyer journeys on ecommerce platforms through layout personalization
    and personalized offers and promotions, improving buyer experience and business
    outcomes.


    # 7. Personalization – AI-Crafted Customer Experience'
