- fmt: '### A Brief History on Filtering Algorithms [[8](#630035_1_En_5_Chapter.xhtml#CR8)]


    Researchers at Xerox PARC (Palo Alto Research Center) developed Tapestry in the
    mid-1990s, considered to be the first computerized collaborative filtering system.
    Tapestry enabled hundreds of researchers to annotate news articles with keywords
    or tags. It also made it easier for researchers to collaborate by detecting users
    with similar annotation patterns, indicating shared preferences. Leveraging these
    collaborative patterns, Tapestry filtered and recommended online content to fellow
    researchers [[8](#630035_1_En_5_Chapter.xhtml#CR8), [15](#630035_1_En_5_Chapter.xhtml#CR15)].


    The collaborative nature of Tapestry, where users’ interactions, annotations,
    and preferences are collectively leveraged to filter and recommend content, gave
    rise to the term “collaborative filtering.”


    GroupLens, a research project at the University of Minnesota, made a significant
    contribution to making collaborative filtering mainstream. GroupLens was one of
    the first systems to demonstrate the effectiveness of collaborative filtering
    for recommending a variety of items, including news articles, movies, and music.


    GroupLens provided open source software libraries that made it easy for developers
    to build their own collaborative filtering systems. This helped to accelerate
    the adoption of collaborative filtering technology.


    [Amazon.com](http://amazon.com) was a pioneer in using collaborative filtering
    algorithms to recommend products to its buyers in 1998 [[9](#630035_1_En_5_Chapter.xhtml#CR9)].
    Now recommendation engines are ubiquitous, Alibaba, Amazon, [Booking.com](http://booking.com),
    Facebook, Quora, LinkedIn, Instagram, Netflix, YouTube, Pinterest, Spotify, TikTok,
    Stitch Fix – all of them using recommendation engines to filter and show relevant
    choices to their buyers [[8](#630035_1_En_5_Chapter.xhtml#CR8)].


    Collaborative filtering and content-based filtering are two of the most used recommendation
    algorithms in ecommerce. They can be used to generate personalized product recommendations
    for the buyers. Given the limitations of both content-based and collaborative
    filtering algorithms, hybrid approaches are often adopted, taking into account
    the context and various other considerations.


    Figure [5-4](#630035_1_En_5_Chapter.xhtml#Fig4) illustrates various recommendation
    algorithms, including collaborative filtering, content-based filtering, and hybrid
    approaches.


    ![](images/630035_1_En_5_Chapter/630035_1_En_5_Fig4_HTML.jpg)


    Figure 5-4


    Recommendation algorithms


    Each user/item intersection – each matrix pairing – reveals the degree of user
    preference for that item. For content-based and collaborative filtering recommenders
    alike, the utility matrix is where the search for similarities pays off. “Content-based
    and collaborative filtering recommenders draw upon different types of similarity
    to populate their respective utility matrixes.”


    | Product/Customer | Item 1 | Item 2 | Item 3 | Item 4 | Item 5 |

    | --- | --- | --- | --- | --- | --- |

    | Customer 1 |   | Y |   |   | Y |

    | Customer 2 | Y |   | Y |   | Y |

    | Customer 3 |   | Y |   | Y |   |

    | Customer 4 |   | Y | Y | Y |   |

    | Customer 5 | Y |   | Y | Y | Y |

    | Customer 6 | Y | Y |   |   | Y |


    One way to conceptualize recommendation algorithms is to view them as predicting
    the empty cells of a utility matrix based on available information. In the context
    of ecommerce, this means predicting whether a buyer will purchase or click on
    a product, given their past purchase or click history.


    The machine learning or AI algorithms at Amazon predict a buyer’s behavior with
    5% accuracy, meaning that the buyer clicks on one of the 20 products shown. This
    level of accuracy is remarkable considering the vast number of products available
    on Amazon [[12](#630035_1_En_5_Chapter.xhtml#CR12)].


    ### Collaborative filtering (CF)


    A collaborative filtering is a type of recommendation algorithm that uses choices
    and preferences of other similar buyers to generate personalized product recommendations
    for a particular buyer in an ecommerce setting. Collaborative filtering’s core
    assumption is that the buyers with similar preferences buy similar items or rate
    items similarly. First step in Collaborative filtering algorithms is to identify
    buyers who have similar preferences to the current buyer and then find the products
    that these buyers have shown interest in (e.g., purchased or rated).


    This diagram shows how a collaborative filtering algorithm works to generate personalized
    product recommendations for a buyer.


    *Figure* [*5-5*](#630035_1_En_5_Chapter.xhtml#Fig5) *for showing working of collaborating
    filtering, finding buyers with similar tastes and get some products that they
    explored*


    ![](images/630035_1_En_5_Chapter/630035_1_En_5_Fig5_HTML.jpg)


    Figure 5-5


    Logical view of collaborative filtering approach


    Commonly used similarity measures for identifying similar buyers are Pearson correlation
    coefficient and the cosine similarity. And buyer interaction data (e.g., purchase
    and browse history) is a rich source of buyer behavior and interest in ecommerce;
    hence typically the interaction data is used as input for the similarity calculations.


    Collaborative filtering algorithms are very effective at generating recommendations
    for ecommerce buyers with a lot of interaction data. However, they can be less
    effective for buyers who are familiar with the system (cold start problem) or
    have unique preferences.


    ### Content-Based Filtering


    Content-based filtering is a type of recommendation algorithm that generates personalized
    product recommendations for a particular buyer by identifying features of the
    products that the buyer has purchased in the past and then recommending similar
    products that share those features.


    Content-based recommenders need to create both product profiles and a buyer profile.
    An item profile is a matrix of “items to features” describing key item attributes
    such as brand, category, color, style, material, etc. in ecommerce. Buyer profiles
    rely on the same features as the constructed item profiles to find liking or preferences
    of the buyers toward each of these features. For example, a buyer likes Adidas
    Brand, Men Category, and Blue Color.


    This diagram shows how a content-based filtering algorithm leverages historical
    interactions data to generate personalized product recommendations for a buyer.


    *Figure* [*5-6*](#630035_1_En_5_Chapter.xhtml#Fig6) *for showing the working of
    content-based filtering, finding products similar to buyer purchased products*


    ![](images/630035_1_En_5_Chapter/630035_1_En_5_Fig6_HTML.jpg)


    Figure 5-6


    Logical view of content based filtering approach


    For example, if a buyer has purchased running shoes at a price range of Rs. 2000
    to 3000, a content-based filtering algorithm would recommend other running shoes
    in the same price range.


    Common features used in content-based filtering include brand, price, color, style,
    and category. However, any feature that can be used to describe a product can
    be used in content-based filtering.


    Spotify “model the behavior of every single user on Spotify – their tastes, based
    primarily on their listening habits, what features they use on Spotify and also
    what artists they follow” to create a weekly playlist for each of the users [[8](#630035_1_En_5_Chapter.xhtml#CR8)].


    Content-based filtering is a powerful algorithm and can be used for generating
    personalized product recommendations; ecommerce companies can help buyers by finding
    products that they are most likely to purchase or click.


    Content-based filtering relies heavily on buyers’ past preferences and product
    features. It recommends products like the ones already purchased; hence limiting
    the ability to recommend new products that the buyer may not be aware of (called
    serendipity). Content-based filtering struggles when dealing with new buyers or
    products; cold start problem.'
  raw: '#### A Brief History on Filtering Algorithms [[8](#630035_1_En_5_Chapter.xhtml#CR8)]


    Researchers at Xerox PARC (Palo Alto Research Center) developed Tapestry in the
    mid-1990s, considered to be the first computerized collaborative filtering system.
    Tapestry enabled hundreds of researchers to annotate news articles with keywords
    or tags. It also made it easier for researchers to collaborate by detecting users
    with similar annotation patterns, indicating shared preferences. Leveraging these
    collaborative patterns, Tapestry filtered and recommended online content to fellow
    researchers [[8](#630035_1_En_5_Chapter.xhtml#CR8), [15](#630035_1_En_5_Chapter.xhtml#CR15)].


    The collaborative nature of Tapestry, where users’ interactions, annotations,
    and preferences are collectively leveraged to filter and recommend content, gave
    rise to the term “collaborative filtering.”


    GroupLens, a research project at the University of Minnesota, made a significant
    contribution to making collaborative filtering mainstream. GroupLens was one of
    the first systems to demonstrate the effectiveness of collaborative filtering
    for recommending a variety of items, including news articles, movies, and music.


    GroupLens provided open source software libraries that made it easy for developers
    to build their own collaborative filtering systems. This helped to accelerate
    the adoption of collaborative filtering technology.


    [Amazon.​com](http://amazon.com) was a pioneer in using collaborative filtering
    algorithms to recommend products to its buyers in 1998 [[9](#630035_1_En_5_Chapter.xhtml#CR9)].
    Now recommendation engines are ubiquitous, Alibaba, Amazon, [Booking.​com](http://booking.com),
    Facebook, Quora, LinkedIn, Instagram, Netflix, YouTube, Pinterest, Spotify, TikTok,
    Stitch Fix – all of them using recommendation engines to filter and show relevant
    choices to their buyers [[8](#630035_1_En_5_Chapter.xhtml#CR8)].


    Collaborative filtering and content-based filtering are two of the most used recommendation
    algorithms in ecommerce. They can be used to generate personalized product recommendations
    for the buyers. Given the limitations of both content-based and collaborative
    filtering algorithms, hybrid approaches are often adopted, taking into account
    the context and various other considerations.


    Figure [5-4](#630035_1_En_5_Chapter.xhtml#Fig4) illustrates various recommendation
    algorithms, including collaborative filtering, content-based filtering, and hybrid
    approaches.


    ![](images/630035_1_En_5_Chapter/630035_1_En_5_Fig4_HTML.jpg)


    Figure 5-4


    Recommendation algorithms


    Each user/item intersection – each matrix pairing – reveals the degree of user
    preference for that item. For content-based and collaborative filtering recommenders
    alike, the utility matrix is where the search for similarities pays off. “Content-based
    and collaborative filtering recommenders draw upon different types of similarity
    to populate their respective utility matrixes.”


    | Product/Customer | Item 1 | Item 2 | Item 3 | Item 4 | Item 5 |

    | --- | --- | --- | --- | --- | --- |

    | Customer 1 |   | Y |   |   | Y |

    | Customer 2 | Y |   | Y |   | Y |

    | Customer 3 |   | Y |   | Y |   |

    | Customer 4 |   | Y | Y | Y |   |

    | Customer 5 | Y |   | Y | Y | Y |

    | Customer 6 | Y | Y |   |   | Y |


    One way to conceptualize recommendation algorithms is to view them as predicting
    the empty cells of a utility matrix based on available information. In the context
    of ecommerce, this means predicting whether a buyer will purchase or click on
    a product, given their past purchase or click history.


    The machine learning or AI algorithms at Amazon predict a buyer’s behavior with
    5% accuracy, meaning that the buyer clicks on one of the 20 products shown. This
    level of accuracy is remarkable considering the vast number of products available
    on Amazon [[12](#630035_1_En_5_Chapter.xhtml#CR12)].


    #### Collaborative filtering (CF)


    A collaborative filtering is a type of recommendation algorithm that uses choices
    and preferences of other similar buyers to generate personalized product recommendations
    for a particular buyer in an ecommerce setting. Collaborative filtering’s core
    assumption is that the buyers with similar preferences buy similar items or rate
    items similarly. First step in Collaborative filtering algorithms is to identify
    buyers who have similar preferences to the current buyer and then find the products
    that these buyers have shown interest in (e.g., purchased or rated).


    This diagram shows how a collaborative filtering algorithm works to generate personalized
    product recommendations for a buyer.


    *Figure* [*5-5*](#630035_1_En_5_Chapter.xhtml#Fig5) *for showing working of collaborating
    filtering, finding buyers with similar tastes and get some products that they
    explored*


    ![](images/630035_1_En_5_Chapter/630035_1_En_5_Fig5_HTML.jpg)


    Figure 5-5


    Logical view of collaborative filtering approach


    Commonly used similarity measures for identifying similar buyers are Pearson correlation
    coefficient and the cosine similarity. And buyer interaction data (e.g., purchase
    and browse history) is a rich source of buyer behavior and interest in ecommerce;
    hence typically the interaction data is used as input for the similarity calculations.


    Collaborative filtering algorithms are very effective at generating recommendations
    for ecommerce buyers with a lot of interaction data. However, they can be less
    effective for buyers who are familiar with the system (cold start problem) or
    have unique preferences.


    #### Content-Based Filtering


    Content-based filtering is a type of recommendation algorithm that generates personalized
    product recommendations for a particular buyer by identifying features of the
    products that the buyer has purchased in the past and then recommending similar
    products that share those features.


    Content-based recommenders need to create both product profiles and a buyer profile.
    An item profile is a matrix of “items to features” describing key item attributes
    such as brand, category, color, style, material, etc. in ecommerce. Buyer profiles
    rely on the same features as the constructed item profiles to find liking or preferences
    of the buyers toward each of these features. For example, a buyer likes Adidas
    Brand, Men Category, and Blue Color.


    This diagram shows how a content-based filtering algorithm leverages historical
    interactions data to generate personalized product recommendations for a buyer.


    *Figure* [*5-6*](#630035_1_En_5_Chapter.xhtml#Fig6) *for showing the working of
    content-based filtering, finding products similar to buyer purchased products*


    ![](images/630035_1_En_5_Chapter/630035_1_En_5_Fig6_HTML.jpg)


    Figure 5-6


    Logical view of content based filtering approach


    For example, if a buyer has purchased running shoes at a price range of Rs. 2000
    to 3000, a content-based filtering algorithm would recommend other running shoes
    in the same price range.


    Common features used in content-based filtering include brand, price, color, style,
    and category. However, any feature that can be used to describe a product can
    be used in content-based filtering.


    Spotify “model the behavior of every single user on Spotify – their tastes, based
    primarily on their listening habits, what features they use on Spotify and also
    what artists they follow” to create a weekly playlist for each of the users [[8](#630035_1_En_5_Chapter.xhtml#CR8)].


    Content-based filtering is a powerful algorithm and can be used for generating
    personalized product recommendations; ecommerce companies can help buyers by finding
    products that they are most likely to purchase or click.


    Content-based filtering relies heavily on buyers’ past preferences and product
    features. It recommends products like the ones already purchased; hence limiting
    the ability to recommend new products that the buyer may not be aware of (called
    serendipity). Content-based filtering struggles when dealing with new buyers or
    products; cold start problem.'
  trans: '

    #### 过滤算法简史 [8]


    施乐帕克研究中心（Palo Alto Research Center）的研究人员在 20 世纪 90 年代中期开发了 Tapestry，这被认为是第一个计算机化的协同过滤系统。Tapestry
    使数百名研究人员能够用关键词或标签对新闻文章进行注释。它还通过检测具有相似注释模式的用户（表明有共同偏好），使研究人员更容易进行协作。利用这些协作模式，Tapestry
    为其他研究人员过滤并推荐了在线内容 [8, 15]。


    Tapestry 的协作特性——即集体利用用户的交互、注释和偏好来过滤和推荐内容——催生了“协同过滤”这一术语。


    明尼苏达大学的一个研究项目 GroupLens 为协同过滤成为主流做出了重大贡献。GroupLens 是最早证明协同过滤在推荐各种物品（包括新闻文章、电影和音乐）方面有效性的系统之一。


    GroupLens 提供了开源软件库，使开发人员能够轻松构建自己的协同过滤系统。这有助于加速协同过滤技术的采用。


    [Amazon.​com](http://amazon.com) 是 1998 年率先使用协同过滤算法向其买家推荐产品的先驱之一 [9]。如今，推荐引擎无处不在：阿里巴巴、亚马逊、[Booking.​com](http://booking.com)、Facebook、Quora、LinkedIn、Instagram、Netflix、YouTube、Pinterest、Spotify、TikTok、Stitch
    Fix——所有这些公司都在使用推荐引擎为其买家过滤和展示相关选择 [8]。


    协同过滤和基于内容的过滤是电子商务中最常用的两种推荐算法。它们可用于为买家生成个性化产品推荐。鉴于基于内容的过滤和协同过滤算法都存在局限性，通常会采用混合方法，同时考虑上下文和各种其他因素。


    图 5-4 展示了各种推荐算法，包括协同过滤、基于内容的过滤和混合方法。


    ![](img/630035_1_En_5_Fig4_HTML.jpg)


    图 5-4


    推荐算法


    每个用户/物品的交集——每个矩阵配对——都揭示了用户对该物品的偏好程度。对于基于内容的推荐器和协同过滤推荐器而言，效用矩阵正是寻找相似性产生价值的地方。“基于内容的推荐器和协同过滤推荐器利用不同类型的相似性来填充各自的效用矩阵。”


    | 产品/客户 | 物品 1 | 物品 2 | 物品 3 | 物品 4 | 物品 5 |

    | --- | --- | --- | --- | --- | --- |

    | 客户 1 |   | Y |   |   | Y |

    | 客户 2 | Y |   | Y |   | Y |

    | 客户 3 |   | Y |   | Y |   |

    | 客户 4 |   | Y | Y | Y |   |

    | 客户 5 | Y |   | Y | Y | Y |

    | 客户 6 | Y | Y |   |   | Y |


    理解推荐算法的一种方式是将其视为根据可用信息预测效用矩阵中空白单元格的过程。在电子商务的背景下，这意味着根据买家过去的购买或点击历史，预测买家是否会购买或点击某个产品。


    亚马逊的机器学习或人工智能算法预测买家行为的准确率为 5%，这意味着买家会点击所展示的 20 个产品中的一个。考虑到亚马逊上产品数量庞大，这个准确率已经相当可观了
    [12]。


    #### 协同过滤


    协同过滤是一种推荐算法，它利用其他相似买家的选择和偏好，在电子商务环境中为特定买家生成个性化产品推荐。协同过滤的核心假设是，具有相似偏好的买家会购买相似的物品或以相似的方式对物品进行评分。协同过滤算法的第一步是识别与当前买家具有相似偏好的买家，然后找出这些买家表现出兴趣（例如，购买或评分过）的产品。


    此图展示了协同过滤算法如何为买家生成个性化产品推荐。


    *图* *5-5* *展示了协同过滤的工作原理：寻找品味相似的买家，并获取他们探索过的一些产品*


    ![](img/630035_1_En_5_Fig5_HTML.jpg)


    图 5-5


    协同过滤方法的逻辑视图


    用于识别相似买家的常用相似度度量是皮尔逊相关系数和余弦相似度。而买家交互数据（例如，购买和浏览历史）是电子商务中买家行为和兴趣的丰富来源；因此，交互数据通常被用作相似度计算的输入。


    协同过滤算法在为拥有大量交互数据的电子商务买家生成推荐方面非常有效。然而，对于系统的新用户（冷启动问题）或具有独特偏好的买家，其效果可能较差。


    #### 基于内容的过滤


    基于内容的过滤是一种推荐算法，它通过识别买家过去购买产品的特征，然后推荐具有这些特征的相似产品，从而为特定买家生成个性化产品推荐。


    基于内容的推荐器需要创建产品画像和买家画像。物品画像是一个“物品到特征”的矩阵，描述了电子商务中关键的产品属性，如品牌、类别、颜色、款式、材质等。买家画像依赖于与构建的物品画像相同的特征，以发现买家对每个特征的喜好或偏好。例如，一位买家喜欢阿迪达斯品牌、男士类别和蓝色。


    此图展示了基于内容的过滤算法如何利用历史交互数据为买家生成个性化产品推荐。


    *图* *5-6* *展示了基于内容的过滤的工作原理：寻找与买家已购产品相似的产品*


    ![](img/630035_1_En_5_Fig6_HTML.jpg)


    图 5-6


    基于内容过滤方法的逻辑视图


    例如，如果一位买家购买过价格在 2000 到 3000 卢比之间的跑鞋，那么基于内容的过滤算法会推荐同一价格范围内的其他跑鞋。


    基于内容的过滤中常用的特征包括品牌、价格、颜色、款式和类别。然而，任何可用于描述产品的特征都可以用于基于内容的过滤。


    Spotify “对每个 Spotify 用户的行为进行建模——他们的品味，主要基于他们的收听习惯、他们在 Spotify 上使用的功能以及他们关注的艺术家”，从而为每个用户创建每周播放列表
    [8]。


    基于内容的过滤是一种强大的算法，可用于生成个性化产品推荐；电子商务公司可以通过帮助买家找到他们最有可能购买或点击的产品来提供帮助。


    基于内容的过滤严重依赖于买家过去的偏好和产品特征。它推荐与已购产品相似的产品；因此限制了推荐买家可能不知道的新产品的能力（这被称为“意外发现”）。在处理新买家或新产品时，基于内容的过滤会遇到困难，即冷启动问题。

    '
- fmt: '### Hybrid Recommendation Algorithms


    Hybrid recommendation algorithms combine the strengths of collaborative filtering
    and content-based filtering to recommend products to users that are both relevant
    to their preferences and new to them.


    Combining content-based and collaborative filtering algorithms can enhance recommendation
    systems in various ways. One approach involves blending the recommendations from
    both methods by assigning weights, such as allocating 40% of the recommendations
    to collaborative filtering and the remaining 60% to content-based filtering. Another
    method involves scoring products based on weighted scores from both algorithms
    and presenting the final recommendations accordingly. Contextual factors also
    play a crucial role in determining which approach is more effective. For instance,
    when limited information is available about buyers, content-based recommendations
    may be prioritized. Conversely, for highly engaged users with rich interaction
    data, collaborative filtering tends to deliver more relevant recommendations.


    For the new buyers on the ecommerce platform, hybrid algorithms leverage content-based
    recommendations to address the cold start problem. Hybrid systems also incorporate
    demographic information, user context, and historical data to refine recommendations.


    Similar user-based product recommendations can help in addressing the issue of
    lack of variety in content-based filtering algorithms.


    Here are a few examples on how hybrid algorithms are used by the ecommerce platforms.
    When a buyer visits the homepage of an ecommerce website, a hybrid recommendation
    algorithm can recommend products to them based on their past purchase and browsing
    history, as well as the products that other buyers with similar preferences have
    purchased.


    Also, when a buyer views a detailed product page, a hybrid recommendation algorithm
    can recommend other products that the buyer may be interested in, such as complementary
    products or products from the same brand or category.


    Hybrid recommendation algorithms offer benefits over traditional recommendation
    algorithms, including


    *   **Improved accuracy**: Hybrid recommendation algorithms are typically more
    accurate than traditional recommendation algorithms because they consider a wider
    range of factors.

    *   **Better serendipity**: Hybrid recommendation algorithms are better at recommending
    products that are new to the buyer and that they may not have been aware of on
    their own.

    *   **Reduced cold start problem**: Hybrid recommendation algorithms are less
    affected by the cold start problem than traditional recommendation algorithms
    because they can use content-based filtering to recommend products to new users
    even if they have not interacted with the system much yet.


    ### 4\. Evaluation


    E-commerce platforms like Amazon manage millions of products and rely on recommendation
    engines to deliver highly relevant suggestions to buyers every day. How do you
    evaluate if the recommendation system is doing its job of meeting buyer preferences?


    Ecommerce platforms like Amazon or Myntra show personalized product recommendations
    to millions of their buyers. Evaluating the performance of these recommendation
    systems is a complex task, as the focus and priorities may differ across organizations.
    However, there are few key metrics that can be used, such as accuracy, coverage,
    and novelty. If the objective is to increase user satisfaction, then metrics such
    as buyer engagement (such as clicks and time spent, etc.) and satisfaction may
    be more important than accuracy.


    Before any recommendation algorithm goes live on an ecommerce platform, the output
    is evaluated and some of the evaluation metrics considered are


    *   **Accuracy:** Measures how well the recommendation engine predicts the relevance
    of the products to the buyers.

    *   **Coverage:** Measures proportion of the products getting recommended to the
    buyers.

    *   **Novelty:** Measures the proportion of recommended products that are new
    to the buyers.


    In a commercial setting, business metrics are significantly important. Some of
    the business metrics influenced by the recommendation engine are


    *   **Click-through rate (CTR):** When products are recommended to the buyers,
    how many buyers like and click them. And click through rate helps in measuring
    that and it is the percentage of buyers who click on a recommended product.

    *   **Conversion rate (CVR):** The goal for ecommerce platforms is to sell the
    products to their buyers. That means buyers buy the products that are recommended
    to them. Conversion rate captures proportion of buyers who end up purchasing in
    each of the visits on the ecommerce platform. Conversion rate is the percentage
    of buyers who click on a recommended product and then purchase it.

    *   **Purchase revenue:** Typically, lower per unit price products have higher
    conversion rate. The ecommerce platform also optimizes the recommendations to
    increase overall revenue from the buyer visits. Hence, the total amount of revenue
    generated from recommended products is an important consideration of the evaluating
    recommendation engine.


    Zelano, a fashion ecommerce platform, “Measuring click-through rates is a core
    metric for recommendations, but you cannot forget about tracking gross revenue”
    [[14](#630035_1_En_5_Chapter.xhtml#CR14)].


    Ecommerce platforms like Amazon or Myntra use A/B testing to evaluate the performance
    of different recommendation algorithms and approaches. In A/B testing, it randomly
    assigns buyers to different groups and then shows products based on different
    recommendations. Performance on these metrics is compared for each group to determine
    which recommendation algorithm or approach performs the best. For proper A/B testing,
    each of the groups need to have a large enough buyer base to get statistically
    significant results.


    In 2021, Amazon generated 35% of its sales from recommended products. This means
    that Amazon’s recommendation engine is responsible for billions of dollars in
    revenue each year, and for helping buyers to discover new products that they may
    not have been aware of [[5](#630035_1_En_5_Chapter.xhtml#CR5)].


    Now, a few scenario use-cases are considered and then above recommendation architecture
    components are explained with the steps.'
