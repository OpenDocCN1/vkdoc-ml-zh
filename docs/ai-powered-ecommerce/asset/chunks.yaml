- fmt: '# Home Page Personalization


    After a few days, Manisha returns to the ecommerce platform and lands on the homepage
    of the mobile application. This is her repeat visit. The ecommerce platform recognizes
    her based on the device cookies. The cookies can store various data points beyond
    browsing history, including location and device type and even though she is not
    logged in, the home is personalized based on the extracted data from the cookies.


    A home page on the ecommerce platform has a few important elements – category
    navigation, hero banner (big section with attractive visuals showing casing offer),
    and a few other widgets or sections. But for repeat customers, the personalized
    widgets such as recent views, previous purchases, and recommendations for you
    will start piping up for the buyers.


    Platform recognized that Manisha is interested in Indian wear, her preferences
    for Westside brands (based on the clicks in the previous visits), and her price
    affinity is above average. The system maps her preferences and pulls the hero
    banner images tagged with these characteristics. A banner visual that highlights
    website brands along with a visual of a lady wearing a kurta-set. Also, the sequence
    of the category in the category carousels is personalized for her. The home page
    contents are adopted based on her interest, making it exciting for her.


    In addition to personalized hero banners and categories, personalized widgets
    are visible on the home page, including “Recently Viewed Products” and “Products
    Inspired by Browse History.” These widgets are created with the aim of establishing
    continuity from the previous visit(s) to help her with the purchase journey. Machine
    learning algorithms identify an additional list of products that are typically
    explored or purchased when users browse the products that Manisha had browsed
    in the previous visit(s). These products help her explore additional but relevant
    and personalized choices available on the platform.


    The two personalized widgets are the examples of product recommendations, but
    personalization on ecommerce goes much beyond product recommendations. The landing
    page layout, contextual search, and showing curated offers and promotions are
    few of the additional dimensions of personalizations on the home page for ecommerce.
    In the dynamic layouts, the colors and layout of the home page is adjusted based
    on the buyer preferences, creating a familiar and inviting space that feels like
    it was made just for them. In the contextual search, search terms are understood
    considering previous browse and purchase behaviors. For example, Intelligent search
    powered by machine learning understands and maps “kurta” search term to women
    kurta-set based on browsing history, showing more of woman kurta to Manisha based
    on her clicks for the category instead of man kurtas.


    For Manisha, the full home page is personalized, showing the recently viewed products,
    additional options that are aligned with previous journeys and the offers are
    customized for herself. This creates a smooth purchase journey for Manisha and
    engages her toward product discovery.


    A homepage, or digital front door, is crucial in ecommerce for creating an engaging
    and personalized experience. When buyers visit the homepage, it can be tailored
    specifically to them, with each widget personalized based on their profile and
    preferences.


    For instance, if a buyer is a male from Southern India, the homepage can be customized
    to feature product categories and recommendations relevant to this demographic.
    This process involves mapping the buyer’s demographic and geographic details to
    a category performance matrix. This matrix, akin to the user-item interaction
    matrix, links category performance with buyer segments. It is decomposed into
    a category feature matrix and a buyer segment feature matrix.


    To personalize the homepage, each buyer is assigned to a segment based on their
    profile. The feature affinities of the buyer segment are then compared to the
    category feature matrix. This comparison identifies similar categories, which
    are then ranked to ensure the most relevant categories appear on the homepage.


    Additionally, every widget and feature on the homepage – such as banners, product
    suggestions, and promotional content – can be personalized to enhance the buyer’s
    experience. By dynamically adjusting these elements based on the buyer’s profile
    and interactions, the ecommerce platform can improve engagement and satisfaction.


    Now, we will explore a case study of how a leading fashion ecommerce platform
    in India, Myntra, has personalized its storefront. How have they created a personalized
    experience for their users and what is the impact of the revised journey?


    ## Case Study: Tailoring StoreFront at Myntra [3, 23]


    A leading Indian fashion ecommerce platform, Myntra is redefining the shopping
    experience through hyper-personalization. A sophisticated AI engine that transforms
    their homepage (called “storefront”) into a curated fashion for each individual
    customer.


    Myntra goes beyond basic data gathering to understand the essence of its customers’
    “fashion taste.” Customers’ “fashion taste” encompasses not just preferred brands
    and categories but also their subtle inclinations toward specific product attributes
    like colors, fabrics, and even preferred fits. This rich tapestry of preferences
    is considered in the personalized storefront.


    Myntra’s AI engine deciphers personal style through purchased products, extracting
    key features like preferred brands, colors, fabrics, and styles. Features linked
    to each banner are arrived at based on clicks on the banners and target products.
    By matching customer “fashion taste” with the essence of each banner, Myntra’s
    AI orchestrates a storefront symphony where every ad speaks directly to individual
    taste.


    “With this change, two users who enter the Myntra store on their apps at the same
    time see a completely different store, tailored to meet their fashion shopping
    needs” [3].


    The homepage of an ecommerce platform features various widgets, such as banners,
    recommendation sections, and call-to-action (CTA) journey widgets, each containing
    specific content. The goal is to dynamically arrange these widgets to tailor the
    homepage experience for individual users. To achieve this, a reinforcement learning
    algorithm known as the Contextual Multi-Armed Bandit is employed to generate personalized
    layouts for each buyer.


    The platform utilizes a federated architecture to minimize latency, ensuring fast
    and responsive interactions. The ranking services are managed via an in-memory
    cache, which helps to further reduce response times. Additionally, the system
    integrates both near real-time and batch data pipelines to balance the freshness
    of data with the need for comprehensive processing. According to performance metrics,
    the `p99` response time for this service is 50 milliseconds, indicating a highly
    efficient and responsive system.


    Personalization is an experience to engage customers across the touchpoints and
    deliver outcomes for ecommerce business. Personalization improves conversion for
    the user visits and chances of them coming back. In the next section, we explore
    the impact of personalization in detail.'
