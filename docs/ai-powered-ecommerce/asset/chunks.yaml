- fmt: '# Case Study: Brand Prioritization on Ecommerce Platform


    **Context**: In the rapidly evolving Indian ecommerce market, the identification
    and selection of brands for onboarding is critical to a platform’s success. Using
    market research and competition analysis, the ecommerce marketplace identifies
    a potential list of brands. Some brands also proactively reach out to the platform
    for onboarding. A data-driven approach helps in systematically assessing these
    brands for alignment with the ecommerce marketplace’s objectives.


    **Objectives**: A data-driven framework for category managers to identify high
    performing brands, achieve a balanced mix of established and emerging brands and
    onboard brands that are aligned to buyer preferences and market demands. Tracking
    the performance of these brands and their products on competitor platforms, along
    with analyzing media reports, helps estimate brand performance and provides valuable
    insights.


    **Approach**:


    *   Capturing data – sales, reviews and ratings, social media tractions metrics

    *   Creating key performance indicators (KPIs) such as sales potential, buyer
    satisfaction, and market relevance for each of these brands.

    *   Defining a scoring across these performance measures and aggregating the scores
    to arrive at a composite brand score.

    *   The composite score along with component scores guide category managers in
    evaluating and prioritizing brands for onboarding.


    **Outcome**: The platform has implemented a structured approach to selecting and
    prioritizing brands for onboarding at regular intervals. This method has improved
    sales, product assortment, and the overall buyer experience by ensuring that the
    most relevant and high-potential brands are featured on the platform.


    A long-term relationship with sellers and brands involves creating marketing plans,
    designing optimal pricing strategies, and developing promotional campaigns in
    collaboration with brands. These efforts aim to enhance brand visibility, increase
    buyer engagement, and achieve both the brand’s sales plans (GMV) and the platform’s
    revenue goals.


    In an ecommerce marketplace, the brands or sellers are responsible for product
    inventory, availability, and order processing. Before launching a brand on the
    platform, a technical integration between the ecommerce platform and the brand’s
    order management system is conducted to ensure seamless order processing. Inventory
    integration helps reduce the chances of order cancellations due to product unavailability.
    Flipkart, an Indian ecommerce platform, leverages artificial intelligence in managing
    inventory [[10](#630035_1_En_3_Chapter.xhtml#CR10)]. Payment processing and analytics
    are other typical services and platform integration needs in the marketplace ecommerce
    model. Relevant agreements aim to reduce instances of product cancellations due
    to unavailability or poor quality, as well as delayed order delivery linked to
    slow packaging and handover to delivery partners.


    In summary, category managers drive decisions around brand selection and product
    assortment on category and brand pages and responsibility of product availability
    on the platform. They also work to improve advertising revenue from brands and
    achieve sales targets (GMV and NMV) for the ecommerce platform.


    Category managers track performance across funnels – top, mid, and lower – almost
    in real time to ensure they meet platform business objectives. Some common performance
    metrics are listed below. These metrics capture buyer journeys, identify opportunities
    to improve platform performance, and help in pinpointing any issues. For example,
    if certain visuals or widgets on the homepage are not effective or relevant to
    buyers, it will be reflected in the click-through rate of the widget. Similarly,
    if the conversion rate is lower in the previous hour compared to the expected
    conversion rate, the category managers will work with cross-functional teams to
    identify and rectify the issues.


    For the top funnel, the volume of visitors, click-through rate (CTR) on the home
    and product listing pages, product views (PV), the ratio of product views to visits
    (PV/V), and bounce rate (% of visitors who leave without exploring beyond the
    landing pages) help in assessing the health of the funnel.


    The mid-funnel focuses on buyer engagement, which is heavily influenced by product
    recommendations and personalization. Key metrics used to monitor buyer engagement
    include the cart add rate (% of visitors adding products to the cart), checkout
    rate (proceeding to the payment page), and the ratio of checkout (CO) to cart
    addition (CA).


    Lower funnel performance is tracked using metrics such as conversion rate, order
    count, GMV, and NMV (considering cancellations), average order value, among others.
    These metrics help in making tactical merchandising decisions. For example, if
    the average order value is lower in recent hours, promotional strategies can be
    analyzed and adjusted. Additionally, product assortment and ranking may also play
    a role.


    Figure [3-1](#630035_1_En_3_Chapter.xhtml#Fig1) provides a summary of performance
    statistics for each stage of the funnels.


    ![](images/630035_1_En_3_Chapter/630035_1_En_3_Fig1_HTML.jpg)


    Figure 3-1


    Key performance indicators across marketing funnels


    Data-driven pricing and promotion with AI empower category managers to optimize
    sales and buyer engagement on the platform, balancing growth with profitability
    for the ecommerce platform.


    On marketplace ecommerce platforms, some of the pricing decisions are left to
    the individual brands and sellers. The platform only controls the discounts on
    the top to drive the sales from time to time.


    AI-enabled process controls can help ecommerce platforms to save costs and improve
    buyer experience. The case study below highlights impacts of operations control
    using AI for price and promotions.


    ## Case Study: Price and Promotion Reviews using AI


    **Context**: An Indian fashion ecommerce platform regularly undertakes price revisions
    and promotions to enhance sales and buyer engagement. With thousands of sellers,
    changes are made at an SKU level during sales periods. Discounts vary significantly
    across categories and brands, with some brands imposing limits on discounts while
    others offer substantial discounts seasonally. Managing these variations through
    rules across brands and categories poses a substantial operational challenge.
    Moreover, unintended pricing errors, such as a price changing from 999 to 99,
    can have significant financial impacts and occasionally lead to platform crashes
    during high traffic periods.


    **Problem Statement**: Developing an ML model to review all price revisions and
    flag outliers before approving them


    **Approach**: Using historical price revision data, we identified all price changes
    and flagged outliers through a combination of data analysis and business insights.
    Once labeled data was prepared, a machine learning model was developed to automatically
    detect abnormal price changes.


    **Results**: The revised framework significantly reduced the need for manual review
    of price changes and accelerated the process of implementing price adjustments
    in production or going live.


    Stockouts are a common challenge during ecommerce sales and promotions. Machine
    learning-based forecasting methods can help estimate demand by considering various
    factors such as discount levels, brand interest, and seller activity.


    Regular operational engagement between brands and ecommerce platforms encompasses
    a range of responsibilities: from onboarding new products and enhancing product
    visuals, titles, and descriptions to monitoring demand trends, managing promotions,
    and addressing order management issues such as delayed packaging and increased
    returns.'
