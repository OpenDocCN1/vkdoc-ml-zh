- fmt: '*The diverse and dynamic nature of fashion products, encompassing a wide range
    of styles, brands, colors, sizes, and price points, made it challenging to accurately
    assess their relevance and appeal to individual buyers. The ranked list also needed
    to align with the latest styles and preferences.*


    ***Target Variable***


    *Designing an ML-based ranking system* *required labeled data. However, manually
    ranking product lists for each search term was impractical and costly due to the
    platform’s vast product volume.*


    *Based on the 3-day period, product sales value (GMV), conversion rate, and click
    through rate for the search journeys were considered for these products. Based
    on the business discussions, 60,20, and 20 weights were considered across these
    three factors to arrive at the ranking of the products within each search query.*


    ***Features***


    *For creating features, product performance features were created across the last
    90 days separately for the search journeys and across all journeys. For these
    variables, time-variant features are created to capture trends and patterns.*


    *In addition to performance and popularity features, product intrinsic features
    like sales reviews, ratings, and returns were also considered.*


    ***Model***


    *A gradient-boosted tree algorithm with a list-wise ranking objective function
    was used for developing the ranking of the model. This approach is called Learning
    to Rank Model.*


    ***Evaluation***


    *The model was evaluated using metrics like Precision/Recall @5 and 20, and mean
    reciprocal rank (MRR). Evaluating the model on 10% of platform traffic revealed
    significant improvements in business metrics, with CTR increasing by 2% and conversion
    rate by 0.2%.*


    ## Ranking Algorithms: Learning to Rank (LTR)


    `Learning to Rank (LTR)` is a widely used technique in real-world systems for
    generating ordered lists as a subsequent stage of search and recommendations on
    ecommerce platforms. `LTR` stands out among various base rankers due to its versatility
    and effectiveness. It employs a global scoring function to assess the relevance
    of each item in a candidate set, producing an ordered list based on these scores.


    There are different ways to formulate a loss function, which quantifies the difference
    between predicted rankings and the true rankings. The choice of an appropriate
    loss function is essential for training the model effectively. Three functional
    forms – point-wise, pairwise, and list-wise – are typically used in `Learning
    to Rank` models. Each has its own advantages and challenges.


    `Point-wise learning to rank (LTR)` approaches focus on minimizing the individual
    error between each item’s predicted relevance score and its actual relevance score.


    `Pairwise learning to rank (LTR)` takes a different approach. Instead of focusing
    on individual items, it turns the ranking problem into a binary classification
    task. This involves creating pairs of items from a given ordered list (learning
    examples) and labeling each pair based on their rank.


    Both point-wise and pairwise methods have limitations as they do not consider
    the entire ranked list in their loss functions, leading to suboptimal rankings.


    The list-wise approach addresses these limitations by considering the entire list
    of ranked items as input and utilizing multivariate loss functions to determine
    the optimal ordered list as output. This holistic approach takes into account
    the relative ordering of items, resulting in more accurate and meaningful rankings.


    List-wise ranked lists can be evaluated by a set of metrics. This approach measures
    the quality of the ordering by considering the entire ranking list. These metrics
    are particularly relevant in ecommerce, where users typically focus on the top
    few results in the list.


    *   `Mean Average Precision (MAP)` summarizes the precision at all possible cut-off
    points.


    *   `Mean Reciprocal Rank (MRR)` measures the average reciprocal rank of the first
    relevant item in the ranking list, providing a simple and efficient way to assess
    ranking quality.


    *   `Normalized Discounted Cumulative Gain (NDCG)` considers the position of relevant
    items within the ranking list, with higher positions assigned greater weight.


    Finding relevant products at the top of search results or recommendations significantly
    impacts both the buyer experience and conversion rates. As discussed previously,
    ensuring that the most relevant items are prominently displayed can enhance user
    satisfaction and drive higher sales. `NDCG (Normalized Discounted Cumulative Gain)`
    specifically measures how well the most relevant products are positioned at the
    top of the list. It accounts for the importance of relative positions by applying
    a discount that decreases exponentially as the rank of relevant items goes lower.
    This approach ensures that the metric reflects the greater significance of top-ranked
    items in influencing buyer decisions and achieving better business outcomes such
    as conversion or GMV.


    The power of ranking algorithms extends beyond ecommerce search. They also play
    a vital role in rearranging recommendation lists on ecommerce platforms, tailoring
    them to individual users for a more engaging shopping experience. In the next
    section, we delve deeper into the development of ranking models specifically for
    recommendation systems, exploring techniques and strategies to optimize product
    recommendations and drive user engagement.


    ## Ranking for Recommendations on Ecommerce


    For enhancing the user experience and driving sales, ecommerce platforms employ
    recommendation engines that suggest relevant items to each user. These recommendation
    engines typically consist of two phases: candidate generation and ranking of the
    candidates.


    The candidate generation phase involves identifying a subset of items from the
    vast catalog that are potentially relevant to the user. This process often utilizes
    recommendation engine algorithms, with deep learning frameworks gaining popularity
    due to their ability to handle diverse data types and scale efficiently.


    The ranking phase involves prioritizing the candidate items based on their relevance
    to the user. This is where ranking algorithms come into play. Ranking algorithms
    analyze user data, item characteristics, and contextual factors to determine the
    order in which items should be presented to the user.


