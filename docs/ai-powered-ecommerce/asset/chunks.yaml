  trans: '

    ***挑战**：在时尚品类中，不准确的产品详情和较低的属性填充率给顺畅的买家体验带来了重大障碍。依靠专门团队手动为产品打标签，在可扩展性和一致性方面存在挑战。*


    ***解决方案**：Meesho 的数据科学团队实施了一种基于深度学习的架构，用于自动将产品图像分类到不同类别。对于缺少属性信息的产品，系统会提取相关细节，从而简化产品打标签流程。*


    ***成果**：基于人工智能的可扩展产品分类流程，提升了产品分类体系与数据填充率。深度学习方法在根据图像及其他提供的细节预测产品类别方面非常高效，从而提高了填充率。用户常因各种压力在选择正确类别时出错，并可能跳过非必填字段。准确的产品分类和详情对于搜索和浏览体验至关重要，因此确保信息精确能够提升整体买家体验。这既节省了成本，也缩短了周转时间。*


    产品上线平台后，Maya 需要找到从这些平台获取业务的方法，因为平台上有数百万卖家，而部分买家可能并不了解“Maya 的神秘珠宝”品牌的产品。


    Maya 决定利用推广和广告功能来触达更广泛的受众，以提升她的线上销售额。


    这些平台通常为卖家提供多种功能，例如“赞助商品”。针对选定的关键词，卖家设定出价金额，并根据其产品展示给买家时获得的点击次数向平台付费。这是一种按点击付费（PPC）的广告项目。当顾客搜索这些关键词时，产品就会显示出来。卖家可以通过“赞助品牌”项目推广其品牌，该功能会在搜索结果顶部展示品牌标识及其他详细信息。这能在平台访客中创造更高的可见度和品牌认知度。


    另一个常见选项是，当顾客浏览相关产品类别时，展示推广产品，这能为选定产品带来流量，并提升购买意愿。


    Maya 可以为她的产品确定目标受众和相关关键词列表。她可以利用品牌推广项目，在目标受众中建立品牌认知度，这有助于创造品牌资产和未来销售。为了获得即时的业务成果，她设定了一个每日预算目标，并为十个相关关键词进行出价。


    卖家可能会为产品接到数十个订单，但如果他们无法在配送时限内完成交付，就会因订单取消而导致糟糕的客户体验。顾客会给出差评，卖家还可能面临平台的罚款。


    平台要求卖家更新平台上可售商品的数量（库存），以避免超卖。同时，一旦买家确认订单，卖家即可进行后续步骤——取货、包装，并准备交付。这一流程通常在一个名为订单管理系统（OMS）的系统中完成。一些拥有自有订单管理系统的大型卖家，会与电商平台合作集成这些系统，以实现更快、更自动化的订单详情对接。


    ***案例研究**：为每个产品优先选择卖家*


    ***背景**：在一个开放的市场平台中，可能有数百个卖家销售相同的产品。多次展示相同产品会导致糟糕的客户体验。领先的电商平台会展示单一产品，并从其中一个主要卖家处获取定价详情。*


    ***方法**：基于公平和绩效的卖家选择对于市场平台至关重要，因为这直接影响买家体验和卖家业务。卖家选择会考虑以下因素：使用**卖家绩效**，如平均评分（评分高的卖家权重更高）、订单处理时间；**卖家位置**（靠近客户位置的卖家因配送天数少、配送成本低而获得优先考虑）；以及**产品详情**，如价格（例如，价格越低对买家越有利）和库存（库存越高重要性越高）。当存在多个卖家或卖家店铺时，这些特征与机器学习算法相结合，有助于为每个产品找到合适的卖家。一种常见的用于卖家优先排序的机器学习方法是排序算法，该算法会考虑多种因素，以展示来自顶级卖家的产品。*


    ***成果**：一个自动化且基于绩效的系统，用于在存在多个卖家或卖家店铺时为每个产品选择合适的卖家。*


    除了将订单分配给卖家处理外，系统还会将订单分配给快递合作伙伴。平台可能有多个配送合作伙伴（例如，Blue Dart、Delhivery、XpressBees、Ecom
    Express 等），人工智能/机器学习可以结合配送时限、物流成本和配送绩效等特征来辅助决策。


    “Maya 的神秘珠宝”的推广活动帮助其获得了来自印度各地的订单。她安排了一名人员监控门户网站上的订单并处理这些订单。一旦订单打包完毕并准备发货，信息就会在门户网站上更新。订单被分配给配送合作伙伴，产品便踏上了送达买家的旅程。


    买家收到在平台订购的产品后，对产品质量和配送时效非常满意。他们会在平台上撰写产品评论并给出优秀评分（5 星）。得益于流行度排名（相关性排名）系统，这些产品开始出现在电商平台的自然搜索结果和分类页面中。相关性排名（或流行度排名）由机器学习算法驱动，该算法考虑多种因素，创建排名以将最相关的产品排在顶部。基于机器学习的“学习排序”（LTR）技术和基于深度学习的排序方法被用于提升产品对买家的准确性和相关性。


    Maya 的在线商店——“Maya 的神秘珠宝”正处于增长轨道。她扩充了产品组合，并扩展到珠宝领域内的其他品类。她业务的主要重点是创新设计以推动增长。技术功能和运营流程则由电商平台负责处理。


    线上销售所得款项会根据结算周期，在扣除佣金费用后自动存入银行账户。例如，据报道 Nykaa 对商品价格收取 25% 的佣金 [13]，而 Myntra 的佣金率根据产品类别在
    20% 到 35% 之间 [14]。


    这些平台还为卖家提供关键洞察和分析，以帮助他们更好地在电商平台上管理线上业务。这些洞察涵盖从销售指标（如订单量趋势）到运营指标（如退货率）的各个方面。


    总之，为了赋能电商市场平台上的卖家，需要提供从注册到财务结算的全方位功能。


    图 2-6 展示了电商平台上可供卖家使用的功能，突出了平台的“卖家端”特性。


    ![](img/630035_1_En_2_Fig6_HTML.jpg)


    图 2-6


    卖家端电商平台的关键功能

    '
- fmt: 'In addition to these functionalities, sellers also need key performance statistics
    such as average order value, number of buyers or visitors, and conversion rate
    for their products. Analyzing these metrics helps sellers refine their strategies
    and enhance their business performance on the platform.


    At the heart of every ecommerce platform lies a powerful promise: empower sellers
    and propel their businesses forward. To achieve this, the platform must become
    a well-oiled machine for attracting a steady or growing stream of visitors. Once
    they are there, it needs to captivate their attention with the right products,
    and entice them with strategic discounts and promotions. Finally, when a purchase
    is made, the platform ensures the chosen product reaches the customer swiftly
    and efficiently.


    The upcoming section explores tactics for drawing visitors to the platform and
    steering them toward successful conversions. Buyer journeys on the ecommerce platform
    are segmented into three main funnels. The top funnel focuses on attracting visitors
    to the platform, the mid-funnel engages them through personalization and recommendations,
    and the lower funnel aims to convert visitors into orders.


    ## Top Funnel: Bring Visitors to Platform


    The marketing team at a leading ecommerce company has undertaken a strategic initiative
    to bolster brand recognition and drive mobile app installations. In collaboration
    with an external agency, they have produced a visually captivating television
    advertisement featuring its brand ambassador. This high-impact campaign will run
    for 30 days, reaching an estimated 2-3 million viewers daily. The TV advertisement
    campaign is expected to foster brand awareness and positive brand perception,
    increasing its mobile installs and visitors to their mobile application and website.


    With large reach and mass appeal, brand building and emotional storytelling are
    some of the drivers behind ecommerce spending a large amount on the TV campaigns.
    But, TV advertisements face challenges such as lack of personalization, measurement
    of its effectiveness, higher cost with limited flexibility, and short attention
    span.


    In addition to TV and print media advertisements, the digital campaigns are important
    tools available to the marketing team. A marketing team has a daily target to
    bring a certain volume of visitors and visits to the platform for achieving stiff
    growth targets. There are three segments of visitors on the ecommerce platform
    each day – first time visitors (new visitors), first time shoppers (repeat visitors,
    not shopped earlier) and repeat customers (shopped earlier). The targeted digital
    marketing campaigns are a measurable way to bring visitors across all three groups
    to the platform and help the marketing team deliver on the daily targets.


    The digital performance marketing teams work with business/category and content
    teams to decide on the creatives, visuals, and offer constructs required for a
    digital campaign. Visual contents, format, and layout may be different across
    multiple digital marketing platforms. The visual content teams at leading ecommerce
    platforms have started using Generative Artificial Intelligence-(GenAI)based platforms
    (such as `Midjourney` or `DALL-E`) for generating visual contents for these campaigns.


    ### Case Study: Enhancing Visual Content Creation with Generative AI


    **Problem Statement**: Ecommerce platforms regularly run various sales and promotional
    events. As part of these activities, they frequently refresh the visuals on home
    pages and landing pages to align with promotional themes. Creating new imagery
    for these events is time-consuming and costly, posing a significant challenge
    for design and creative teams in ecommerce.


    **Solution Approach**: The advent of Generative AI platforms, such as `Midjourney`
    and `DALL-E`, has revolutionized the process of creating visual content. These
    AI tools enable ecommerce design and creative teams to expedite the creation of
    refreshing visual content, significantly reducing the time and effort required.
    By leveraging these AI platforms, ecommerce businesses can quickly generate high-quality,
    themed images for their promotions.


    **Benefit**: The use of generative AI significantly reduces the time required
    to create new visual content, allowing for quicker updates and more frequent refreshes.
    Additionally, it helps in reducing the cost of creating images due to the decreased
    manual effort, particularly in creating base images. Now, the main effort goes
    into review and final touch-ups.


    Once appealing and attractive visual content is available, the digital marketing
    team decides to set up the campaign with a goal such as "conversion" for a social
    media campaign on a social media platform with limit on the budget to ensure the
    cost for the company does not go beyond the approved cost for the day.'
