- fmt: '# Size Recommendations: Machine Learning (ML) Model


    Size Recommendation can be modeled as Size Prediction. For example, within the
    Men category, the Footwear Size {UK7, UK8, UK9, UK10, UK11, UK12} can be considered
    as labels.


    Latest transaction for a month could be considered as data for the label and all
    the previous history of the customers could be considered for the features. Figure
    [8-5](#630035_1_En_8_Chapter.xhtml#Fig5) illustrates the structure used for creating
    features and labels in a machine learning-based predictive model.


    ![](images/630035_1_En_8_Chapter/630035_1_En_8_Fig5_HTML.jpg)


    Figure 8-5


    Supervised size prediction


    Some of the features that can be considered are:


    * Frequent size within same category

    * Most recent size within same category

    * Most frequent size across categories

    * Size returned within same category

    * # of purchases

    * Size based on similar users

    * Count of purchase for each sizes (for each category and across categories)


    Once data is prepared by replicating the process across multiple months (called
    cohorts), the data is split into training and testing samples. ML techniques such
    as `XGBoost` or `Random Forest` can be considered to develop ML-based size recommendations.


    The fit recommendation is modeled as size prediction task as an ordinal regression
    problem, where the customer and product true sizes are learned by taking their
    differences and feeding them into a linear model [[9](#630035_1_En_8_Chapter.xhtml#CR9),
    [13](#630035_1_En_8_Chapter.xhtml#CR13)].


    ## Size Recommendation – Skip-gram-Based Model [[10](#630035_1_En_8_Chapter.xhtml#CR10)]


    Myntra is the largest Fashion Ecommerce company in India, it leverages skip-gram-based
    size recommendation. For footwear, it proposes to encode SKUs at category, gender,
    brand, and size levels. For example, SKU with gender “Men” article type “Casual
    Shoes” brand “Vans” and UK size “8” as “Men_Casual_Shoes_Vans_8.” For each of
    these, encoding will be considered as word and multiple purchases combined as
    document. With these words and documents as inputs, we train the `Word2Vec` network.
    The `Word2vec` network would learn the links between different size labels of
    different brands which essentially are of the same shoe measurement.


    For training the model, user level purchase sequences are created by arranging
    purchases with the latest purchase at the end. Each of the word/purchase is represented
    as a latent feature after training `Word2Vec` Model.


    On the website, the platform asks users to provide explicit shoe preference and
    then find latent representation of the preference. For example, if the user has
    filled the shoe preference questionnaire as article type generally worn: Men Casual
    Shoes, preferred brand: Roadster, typical size worn: UK8, we would encode this
    information as a word/purchase preference and fetch the latent vector representation
    of this word/preference. Based on cosine similarity, for the required category
    and brand combination, the size will be recommended.


    At Amazon, they leverage latent features for predicting personalized size [[11](#630035_1_En_8_Chapter.xhtml#CR11)].
    The latent factors for customers and products are related to the physical true
    sizes (e.g., for dimensions like length and width), and are learnt from past product
    purchase and returns data. Specifically, for each (customer, product) purchase
    transaction, our model outputs a score that is a (linear) function of the difference
    between customer and product true sizes, which is then used to predict the outcome.
    We present a construction that reduces a loss function with ordinal outcomes to
    a new loss function with binary outcomes. We define Hinge loss and Logistic loss
    variants, and propose efficient algorithms with linear time complexity for computing
    customer and product true size values that minimize the two loss variants.


    Figure [8-6](#630035_1_En_8_Chapter.xhtml#Fig6) illustrates an example of how
    size recommendations are presented to buyers during the size selection process.


    ![](images/630035_1_En_8_Chapter/630035_1_En_8_Fig6_HTML.jpg)


    Figure 8-6


    Size recommendation example


    It also displays the message “`X UK will fit you best` based on the data from
    customers who buy the same size as you.”


    [[7](#630035_1_En_8_Chapter.xhtml#CR7)] Deep Learning System for Predicting Size
    and Fit is based on content-collaborative methodology for personalized size and
    fit prediction. In this approach, customer and article embeddings are created
    in parallel, discovering implicit properties of individual customers and articles
    for personalized recommendations.


    Figure [8-7](#630035_1_En_8_Chapter.xhtml#Fig7) illustrates the deep learning
    architecture employed for fit size recommendations.


    ![](images/630035_1_En_8_Chapter/630035_1_En_8_Fig7_HTML.jpg)


    Figure 8-7


    Deep learning based size prediction


    Source: A Deep Learning System for Predicting Size and Fit in Fashion ECommerce


    Standard approaches to collaborative filtering solely rely on interaction data
    to model customer behavior [[14](#630035_1_En_8_Chapter.xhtml#CR14)], but for
    a vast majority of customers, such data is sparse. This results in an extremely
    sparse customer–article interaction matrix, which makes it difficult to model
    preferences of every individual customer on a personalized level. Additional information
    in the form of customer and article attributes can, however, help to deal with
    the sparsity and cold-start recommendations.


    ### Recommending Clothes Sizes with Product Size Embeddings (PSE) [[9](#630035_1_En_8_Chapter.xhtml#CR9)]


    Recommending the right size for a clothing item during online shopping remains
    a challenge. While traditional recommender systems suggest similar products based
    on past purchases, accurately recommending size requires considering a customer’s
    body type and fit preferences. This case study explores the Product Size Embedding
    (PSE) model, a neural collaborative filtering approach that leverages implicit
    user behavior data to recommend clothing sizes.


    Product Size Embeddings (PSE) model addresses this challenge by learning size-specific
    embeddings for each product. This approach builds upon the concept of neural collaborative
    filtering, where user and item interactions are used to create latent representations.


    * **Implicit Signals:** PSE utilizes implicit user behavior data such as purchases
    and returns, eliminating the need for explicit user size information.

    * **Learning Size Embeddings:** The model learns a vector representation (embedding)
    for each product-size combination. These embeddings capture the inherent relationship
    between similar body shapes and clothing sizes.

    * **Asymmetric Framework:** For efficiency, the model adopts an asymmetric framework.
    Instead of learning individual user embeddings, it focuses on product representations,
    significantly reducing the number of model parameters.

    * **Multi-class Classification:** PSE formulates size recommendation as a multi-class
    classification problem. Given a user and a product, the model predicts the most
    suitable size for the customer in that specific product.


    Figure [8-8](#630035_1_En_8_Chapter.xhtml#Fig8) visually presents how purchase
    history, including both purchased and non-purchased sizes, is utilized to predict
    the correct size for buyers.


    ![](images/630035_1_En_8_Chapter/630035_1_En_8_Fig8_HTML.jpg)


    Figure 8-8


    Embedding enabled fit prediction


    Source: [`https://ceur-ws.org/Vol-2410/paper13.pdf`](https://ceur-ws.org/Vol-2410/paper13.pdf)


    ### Benefits of PSE


    * **Improved Size Recommendations:** By considering product-specific size information,
    PSE offers more accurate size recommendations compared to traditional methods.

    * **Efficient Model Architecture:** The asymmetric framework reduces the number
    of parameters needed, making the model more efficient to train and deploy.'
