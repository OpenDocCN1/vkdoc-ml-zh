  trans: '

    电商平台上所有产品的热度是通过评估其综合表现来确定的。热度评估会综合考虑**表现**、**潜力**和**效率**等因素，这些因素共同决定了每款产品的热度。


    表现指标涵盖单位销量、销售额和点击量等要素。然而，当产品获得更高的曝光度和更靠前的搜索结果排名时，其表现指标可能会因位置偏差或系统性优势而被放大。因此，仅凭表现指标可能不足以准确评估。


    某些指标可能预示着负面表现，例如产品的高退货率。高退货率可能与多种因素相关，包括尺码不合、质量问题或配送延迟。在评估热度时，应考虑产品退货表现指标，尤其是那些归因于尺码或质量问题的退货。仅基于正面表现的热度评估，可能会让高退货率产品排名靠前，从而导致运营成本增加。


    效率指标衡量产品在推动表现指标方面的有效性。这些指标包括点击率、加购率和转化率等比率，反映了产品在获得机会时实现成果的能力。然而，当基于小样本量时，效率指标可能具有误导性。例如，如果一款产品仅被五位访客浏览并收到一份订单，其转化率看似高达
    20%。但这可能不足以证明该指标的有效性。因此，必须将表现指标与效率指标结合考虑，以确保对产品效果进行全面评估。


    新品通常缺乏成熟的表现和效率指标。然而，这些产品在保持平台新鲜感、激发潜在买家兴趣方面发挥着重要作用。此外，知名品牌拥有自己的忠实受众，并对访客具有吸引力。因此，新颖性、品牌知名度以及点击量和浏览量等因素，可以作为这些产品巨大潜力的指标。


    此外，当某个此前仅在竞争对手电商平台销售的品牌入驻本平台时，该品牌的某些产品可能会吸引用户关注。尽管本平台缺乏其表现数据，但该品牌在竞争对手平台上的产品评分、评论和排名等指标，可以为其潜在热度提供参考。因此，这些指标可纳入本平台评估这些产品热度的考量中。


    最后但同样重要的是，在电商平台（尤其是时尚电商领域）展示产品时，多样性和新颖性是关键考量因素。引入多样化产品和推出新品不仅能丰富购物体验，还能满足买家更广泛的品味和偏好。对多样性和新颖性的重视有助于保持平台的活力和吸引力，鼓励购物者持续探索和发现
    [8]。


    ## 排名函数


    将多个属性组合成一个复合因子，用于对商业产品进行排序的方法称为排名 [1]。在电商中，排名是表现、潜力和效率特征的函数，可用于重新排列产品。这些因素被整合成一个排名分数，决定产品的排序和展示方式。这可以用数学公式表示为：


    *   排名分数 = f(表现, 潜力, 效率)


    在电商中，对产品进行排名需要评估表现、潜力和效率，以确保相关产品获得优先展示。产品浏览量、订单量和销售额等表现指标反映了当前的成功度和热度。新兴的浏览量增长和产品新颖性等潜力指标，则衡量了未来前景和日益增长的兴趣。点击率和转化率等效率指标，评估了产品将机会转化为实际销售的能力。通过整合这些因素，电商平台可以构建一个平衡即时成功与未来潜力的综合排名系统，从而优化产品的可见性和相关性。


    排名的函数形式可以简单到线性模型，也可以复杂到高级算法，具体取决于所采用的特定排名系统。线性模型使用直接的计算方法（通常基于表现指标的加权和）来确定排名。相比之下，复杂算法可能采用先进技术，如机器学习或神经网络，基于多种因素及其交互作用来分析和排名产品。选择线性模型还是复杂模型，取决于排名系统的目标以及实现准确、相关产品排序所需的复杂程度。


    总之，排名函数可以构建为确定性模型或预测性模型。在讨论排名函数形式的细节之前，有必要回顾一下排名及其在电商之外应用的历史背景。


    ### 排名简史


    排名的应用已渗透到我们的数字生活中，影响着我们在各种在线活动中的选择和决策。其历史可追溯到 20 世纪 40 年代，当时排名的概念首次出现在经济学领域。几十年来，排名系统被广泛用于评估大学和学院
    [3]。然而，真正将排名算法推向主流的是谷歌在 1998 年开发的 PageRank 算法 [2, 4, 5]。

    '
- fmt: '### Google PageRank – Revolutionizing Search


    The `PageRank` algorithm, which forms the backbone of Google’s search results
    [[2](#630035_1_En_6_Chapter.xhtml#CR2)], revolutionized the way we retrieve information
    online. By analyzing the links between web pages, `PageRank` assigns a ranking
    score to each page, determining its relevance to a user’s search query.


    “`PageRank` works by counting the number and quality of links to a page to determine
    a rough estimate of how important the website is. The underlying assumption is
    that more important websites are likely to receive more links from other websites”
    [[9](#630035_1_En_6_Chapter.xhtml#CR9)].


    The algorithm’s success inspired other technology giants to incorporate ranking
    algorithms into their platforms, leading to a diverse range of applications.


    Ranking algorithms have infiltrated various aspects of our online experiences,
    shaping our interactions with technology platforms and influencing our decision-making
    processes. Here are a few notable examples, in addition to Google Search and `PageRank`:


    * **Bing Ranking**: Microsoft’s Bing search engine utilizes a sophisticated ranking
    algorithm that considers user relevance, query context, and document quality,
    ensuring users receive relevant and satisfactory search results.

    * **Facebook’s Feed Algorithm**: Facebook’s algorithm determines the most relevant
    stories for users based on likes, shares, and comments, prioritizing content that
    is not only engaging but also resonates within the user’s social circle, influencing
    their online interactions and social experiences.

    * **Amazon Product Ranking Model**: Amazon’s algorithm uses factors such as the
    number of reviews, average rating, and product price to ensure products are ranked
    in a manner that aligns with user preferences, guiding them toward products that
    are likely to meet their needs and expectations.


    These examples illustrate the versatility and adaptability of ranking algorithms,
    which have become indispensable tools in shaping user experiences and influencing
    decision-making processes across the digital landscape.


    In the realm of ecommerce, ranking algorithms play a pivotal role, orchestrating
    the order in which products are displayed, influencing user behavior, purchasing
    decisions, and ultimately, sales success. Unlike classification or regression
    tasks, ranking involves arranging items in an optimal and relevant order based
    on a variety of factors.


    Product ranking plays a crucial role in various aspects of the ecommerce experience.
    Here are some common applications:


    * **Search Results Ranking**: When a user enters a search term, products are displayed
    based on their ranking scores. This ensures the most relevant and appealing products
    appear at the top.

    * **Product Recommendations Reordering**: Recommended products are often reordered
    based on a ranking score that considers user preferences, product popularity,
    and past interactions. This personalizes the shopping experience and increases
    the likelihood of conversion.

    * **Category and Brand PLPs (Product Listing Pages)**: Products on category and
    brand pages are arranged based on their ranking scores. This helps users navigate
    through a large selection and find what they’re looking for more efficiently.


    ## Search Ranking in Ecommerces


    When Manisha searches for “printed sarees” on an ecommerce platform, the search
    functionality matches the search terms with the products. The platform has around
    6000 sarees meeting the search terms. The search page displays 40 products on
    the first page before showing pagination for exploring additional search results.
    The ranking algorithm enables the platform to select the most relevant 40 products
    for the search results landing page. The objective is to improve the relevance
    of these products to the user for a given search term.


    Considering the limited information about Manisha’s preferences and tastes, using
    popularity as an approach to show products could be effective. The assumption
    is that if products are popular, they are liked by many buyers, which increases
    the chances of these products aligning with her preferences as well.


    Ecommerce search enables buyers to discover the products they need from the vast
    ocean of options available on the platform. Even the smallest improvements in
    speed and search result quality can have a significant impact on revenue and user
    experience [[6](#630035_1_En_6_Chapter.xhtml#CR6)].


    The search process involves two stages: the retrieval of products (Search) and
    then displaying the products based on popularity ranking to improve user experience
    and business impact, such as click-through rate and conversion rate. The retrieval
    of relevant products for search terms, covered in the previous chapter, is the
    initial stage.


    Figure [6-5](#630035_1_En_6_Chapter.xhtml#Fig5) visually illustrates the two key
    stages involved in creating an effective search journey on an ecommerce platform.


    ![](images/630035_1_En_6_Chapter/630035_1_En_6_Fig5_HTML.jpg)


    Figure 6-5


    Role of ranking and retrieval in search


    Ranking products based on their popularity is significantly important. Popularity
    is multi-dimensional, involving various performance, efficiency, and product characteristics
    for measuring product popularity.


    Similar to Manisha, thousands of users are searching for “printed sarees” on the
    ecommerce platform. From the retrieved 6000 printed sarees, the top 40 most popular
    products based on historical data are displayed. These products are selected based
    on characteristics such as high search click-through rates, better conversion
    rates, higher clicks, and orders. This approach ensures that the most relevant
    and desirable products are shown to users, enhancing their shopping experience
    and increasing the likelihood of purchase.


    The popularity score can be modeled using either deterministic or probabilistic
    approaches, incorporating performance, potential, and efficiency characteristics
    of products. Probabilistic models, often utilizing machine learning techniques,
    can capture the complex interplay of these factors and deliver more nuanced outcomes.
    Common machine learning methods used for popularity ranking include `XGBoost`
    rankers and deep learning-based ranking models, both of which enhance the accuracy
    and relevance of product rankings.'
