- fmt: '# Browse by Category


    Search is a mechanism that maps a search query to products. This is typically
    enabled by `ML` algorithms. For category/brand browsing, the ranking algorithms
    enable showing popular, relevant, and personalized products on the top for buyers
    to have smooth browsing experience.


    After reaching a set of relevant products, she is looking to explore additional
    products – similar designs and patterns before making a purchase decision. Buyer
    engagement or exploration of products are enriched by a wide array of recommendation
    features – frequently purchased together, “customers who bought this also bought”
    or recommendations for you or similar products.


    In the offline Brick and Mortar shops, when Renuka goes to the retail shop (Brick
    and Mortar), a wide variety of products are displayed in the shop and a sales
    personnel assists her with additional products. The products are available for
    touch and feel for making sense of the quality and material relevant for clothing
    products. Also, trial rooms are available to try the actual products. Some of
    these needs are enabled by providing comprehensive description – covering product
    features, specifications, materials, and high-Quality Images and videos for the
    visual view of the products, enabling customers to feel how the product might
    look on her.


    Considering touch and feel is taken away from the customers on the ecommerce platform,
    Artificial Intelligence and Machine Learning or Virtual Reality (`VR`) and Augmented
    Reality (`AR`) improve their online shopping experience. `AR`/`VR` try-on technology
    enables buyers to experience products in a simulated real-world environment, allowing
    them to see how spectacles will look. For example, when buyers are shopping for
    eyewear, it can show on their faces. Beauty platforms such as Sephora use facial
    recognition and similar `AI` technology to detect features like the eyes and lips,
    allowing customers to see how beauty products will look on their faces. Convolutional
    Neural Networks (`CNNs`), a type of deep learning method, play a crucial role
    in facial recognition by analyzing various nuances in images. For instance, when
    a buyer wants to try a particular shade of lipstick, the deep learning model identifies
    the lips and applies the selected lipstick color in real time. This allows the
    buyers to visualize how the lipstick will look on them.


    IKEA, the world’s largest furniture retailer, created an interactive digital experience
    for the buyers to see the 3D product experience of the furniture items in their
    own context and in real time using the immersive power of virtual reality [[21](#630035_1_En_2_Chapter.xhtml#CR21)].
    In Virtual Reality (`VR`) applications, computer vision models play a crucial
    role in detecting and recognizing objects within the buyer’s physical environment.
    When a new product is selected for placement, `AI` models extract features from
    the images to ensure the product fits accurately within the layout and optimizes
    its placement. This process enhances the realism and functionality of the virtual
    environment, helping buyers visualize how a selected product will look in their
    own spaces considering various other elements of the physical environment.


    After discovering and selecting products on an ecommerce platform, it is crucial
    to engage buyers and guide them through the order completion process. Ensuring
    a smooth and appealing checkout journey is essential for converting interest into
    finalized purchases.


    Offers and coupons are extensively used levers for attracting new buyers, incentivizing
    repeat purchases, and boosting sales [[1](#630035_1_En_2_Chapter.xhtml#CR1)].
    They can also increase cart value by conditioning the offer on the number of items
    or order value. In 2023, 77% of the US population used coupons, and shoppers saved
    more than $3 billion by doing so [[2](#630035_1_En_2_Chapter.xhtml#CR2)]. Indian
    shoppers are similarly inclined to seek offers and promotions when making purchase
    decisions on ecommerce platforms.


    The inefficiency or cost leakage due to lack of proper offer or coupon design
    could be significant. `AI`/`ML` and Analytics power the product bundling or designing
    offer conditions for maximizing return on offer cost. Buyer Segmentation empowers
    targeted promotions and personalized offers. The offers and coupons aligned with
    buyer preferences can increase engagement and conversion rates on the platform.


    In a brick and mortar shop, payments are made only after receiving the product
    and cash is the mode of payment. A remarkable growth of ecommerce has seen many
    challenges on the journey. Firstly, a large segment of the Indian population still
    sees trust deficit in online transactions and access to the financial system remains
    a hurdle [[8](#630035_1_En_2_Chapter.xhtml#CR8)].


    Cash on delivery (`COD`) is a significantly important payment option in ecommerce,
    with 5 out of 10 online transactions being done using this method. While `COD`
    provides convenience to buyers, it also presents challenges for ecommerce businesses,
    including a 35% higher product return rate and increased operational costs for
    cash handling [[9](#630035_1_En_2_Chapter.xhtml#CR9)]. Additionally, `COD` is
    linked to a higher percentage of products returned due to non-delivery, called
    return to origin (`RTO`) transactions.


    To promote trust in online transactions and encourage digital payments, the Indian
    government has implemented initiatives such as “Digital India” and introduced
    `BHIM` (Bharat Interface for Money) to create a robust digital payment infrastructure.
    These efforts aim to reduce reliance on cash transactions and drive the adoption
    of digital payment methods in ecommerce. Cloud technologies are driving large-scale
    initiatives like Digital India by providing cost-effective solutions for delivering
    a wide range of services. These technologies enable efficient scalability, resource
    management, and accessibility, which are essential for the successful implementation
    and operation of such extensive programs.


    For many online shoppers, the time between placing an order and receiving the
    product can be a source of anxiety. The uncertainty surrounding delivery timelines
    can erode trust and discourage purchases. The wait to receive and use the product
    also impacts the overall customer experience in ecommerce. Buyers often have concerns
    or uncertainties about the look and feel of the product. To address these concerns,
    the platforms offer end-to-end tracking and clear visibility about the order journey.
    Additionally, to alleviate concerns about product quality variation or delayed
    delivery/non-delivery, ecommerce platforms provide easy and fast refunds for faster
    purchase decisions.


    Generous return and refund policies serve as a safety net for online shoppers,
    reducing the perceived risk of online purchases. Easy return policies and cash
    on delivery options have played a significant role in the adoption of ecommerce.
    However, they are also linked to a high return rate, which ranges from 25-40%
    in India, significantly higher than the global average [[10](#630035_1_En_2_Chapter.xhtml#CR10)].
    `AI`/`ML` algorithms are helping these platforms combat abuse of these lenient
    return policies and maintain operational efficiency.


    After an order is placed, several actions may occur, including order cancellations
    (by the customer or seller), product returns, or initiation of refunds (if the
    order was pre-paid). Buyers may also have various concerns or questions that they
    want to address with the ecommerce platform. Therefore, having buyer support available
    on the platform and over the telephone is an additional necessity for an ecommerce
    business.'
