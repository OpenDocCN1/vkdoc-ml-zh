- fmt: 'The social media platform in the background runs experiments to assess the
    target users – who find this campaign attractive and relevant before scaling it.
    This is machine learning at play for the social media platform. How do social
    media companies use ML to show ads to the right audience? [[15](#630035_1_En_2_Chapter.xhtml#CR15)]
    Appreciation of these algorithms help the marketing teams in improving effectiveness
    of their campaigns and deliver better outcomes.


    Depending on campaign objectives, promotional messages, and offer construct, the
    call to action may direct customers to either the home page, product listing pages
    (`PLPs`) or detailed product page (`PDP`). The data insights suggest the customers
    with entry pages as Product Detailed Pages (`PDPs`) have higher conversion rates
    as compared to when customers start with product listing pages (`PLPs`).


    Conversion rate on an ecommerce platform is influenced by multiple factors such
    as buyer segment (may be influenced by campaign), level of discounts and promotions,
    assortment, personalization, and buyer journey on the platform. But it is important
    to bring buyers who have higher intent to purchase.


    Social media campaigns bring measurable visitors to the ecommerce platform. The
    attribution of visitors to the campaign and source are done based on `UTM` (Urchin
    Tracking Module) parameters, allowing tracking of campaign source (e.g., Facebook
    ad), campaign medium (e.g., social media), and campaign name (e.g., “Spring Sale”).
    `Facebook SDK` (Software Development Kit) and pixels (often referring to Facebook
    Pixel) are commonly used for tracking and measuring conversions within ecommerce
    mobile apps [[16](#630035_1_En_2_Chapter.xhtml#CR16)].


    An ecommerce company orchestrates a vast network of performance marketing campaigns
    daily or weekly across diverse channels like Facebook, Instagram, and YouTube.
    This strategic and multi-channel approach ensures they reach their target audience
    at every touchpoint.


    The design of these campaigns goes beyond a one-size-fits-all strategy. Some campaigns
    focus on building brand awareness and loyalty. Imagine visually captivating content
    promoting Adidas products, perhaps featuring a special sale or a thematic campaign
    that aligns with the brand’s identity. Additionally, they may run targeted campaigns
    for a select group of key brands across various categories, ensuring maximum visibility
    within the platform’s extensive product selection.


    A data-driven approach empowers the marketing team to systematically construct
    experiments and conduct A/B testing. This allows them to determine the most effective
    strategies for achieving a wide range of campaign goals, from app installs to
    conversions (purchases).


    Social media and social search campaigns can sometimes have a higher cost per
    acquisition (`CPA`) compared to other channels. This is because the cost of conversion
    (measured by the return on ad spend, or `ROAS`) is calculated as the ratio of
    sales generated to the advertising budget spent on acquiring those sales. A well-crafted
    social media advertising strategy might achieve a `ROAS` of 4:1 (meaning for every
    $1 spent, they generate $4 in sales), whereas the average `ROAS` for Google Ads
    campaigns might be 2:1 [[17](#630035_1_En_2_Chapter.xhtml#CR17)].


    Ecommerce companies extend their reach beyond social media and affiliate platforms
    by effectively utilizing their existing customer base. A key tool in this strategy
    is their Customer Relationship Management (`CRM`) program.


    For app users who have opted-in for notifications, targeted push notifications
    deliver personalized offers and promotions. Additionally, the companies leverage
    segmented email and SMS campaigns to re-engage customers who have registered using
    their mobile number or email address. These targeted messages aim to pull buyers
    back to the platform, fostering a steady stream of daily visitors.


    By employing a multi-pronged approach that goes beyond social media acquisition,
    ecommerce companies can effectively nurture existing customer relationships and
    drive repeat business.


    While notifications offer a cost-effective way to reach buyers, bombarding them
    with irrelevant messages can backfire. A constant barrage can lead to notification
    fatigue, causing buyers to opt-out or even uninstall the app. Therefore, a well-planned,
    centralized strategy to manage buyer communication is crucial.


    Imagine a typical ecommerce company with tens of category teams, each with daily
    targets. The temptation to send frequent notifications promoting their specific
    products becomes high. However, this disjointed approach can overwhelm buyers
    who receive a multitude of messages from different departments within the same
    app.


    A centralized strategy ensures a coordinated approach where various category teams
    avoid bombarding the same buyers with redundant messages, leading to opt-out or
    even uninstall the app. Personalizing the content of push notifications can deliver
    a 4x lift on open rates, boosting the 1.5% average open rate seen with generic
    notifications to a much more respectable 5.9% open rate [[18](#630035_1_En_2_Chapter.xhtml#CR18)].


    While SMS and WhatsApp messaging boast low per-contact costs, these advantages
    can be deceptive for ecommerce platforms with millions of registered users. Uncontrolled
    outreach can lead to significant expenses with minimal return on investment (`ROI`)
    due to low message relevance.


    The key lies in data-driven personalization. A well-functioning `CRM` analytics
    and data science team empower the marketing team with AI/ML-powered insights.
    These insights predict which buyers are most likely to respond positively to specific
    product recommendations or promotional offers.


    “Integrating AI into your CRM might create a more efficient sales process. Adding
    an AI-based e-commerce platform, like Customer Data Platforms (`CDPs`) or business
    intelligence (`BI`), will pave your way to personalisation, which will increase
    your average order value (`AOV`) and customer loyalty” [[19](#630035_1_En_2_Chapter.xhtml#CR19)].


    While nurturing existing customers through `CRM` campaigns and performance marketing
    efforts focused on sales is crucial, relying solely on this approach can create
    a diminishing return. Over time, a natural customer churn (customers who stop
    using the platform) inevitably reduce the pool of returning and spending customers.


    To ensure long-term growth, ecommerce platforms need a multi-pronged strategy.
    While retaining existing customers remains important, it’s equally essential to
    continuously expand the app install base and explore new customer segments and
    acquisition channels.


    Digital campaigns optimized for App Installs can attract new users and encourage
    them to download the ecommerce platform’s app. Additionally, the team can look
    beyond existing marketing channels and demographics allowing the platform to tap
    into fresh customer pools. This might involve exploring new social media platforms,
    collaborating with different influencers, or targeting previously unexplored customer
    demographics with tailored messaging.


    Ecommerce companies assess the performance of app install campaigns through key
    metrics like cost per install (`CPI`) and customer acquisition cost (`CAC`).


    While cost-per-install (`CPI`) and customer acquisition cost (`CAC`) are crucial
    metrics for understanding the immediate cost of acquiring new users, they don’t
    tell the whole story. An ecommerce platform might see a significantly higher `CPI`
    for their iOS app install campaigns compared to Android. However, upon analyzing
    post-install behavior, a key insight emerges. iOS users, despite costing slightly
    more to acquire, exhibit higher customer loyalty as measured by repeat purchase
    rates and average order value (`AOV`).'
