  trans: '

    ## 相似产品 – 个性化产品推荐


    相似产品推荐是电商平台最常见的功能之一。当买家进入产品详情页（PDP）时，通常有两种方式查看相似产品推荐：一种是在产品图片上方，另一种是页面下方的组件。


    图 5-9 展示了电商平台上相似产品推荐的呈现示例。


    ![](img/630035_1_En_5_Fig9_HTML.jpg)


    图 5-9


    相似产品


    在时尚电商平台上，约有 20–30% 的买家会访问产品详情页，其中 15% 的买家会浏览相似产品。使用相似产品推荐的买家转化率通常高出 3–4 倍，因为这些买家对购买产品有浓厚兴趣。


    相似产品推荐可以通过基于内容的方法或协同过滤方法生成。在基于内容的过滤中，产品属性（如颜色、图案、面料、袖型、领型等）被用于推荐相似产品。然而，这些特征并非固定不变，因为潮流和偏好会随时间变化。基于内容过滤的另一个挑战是需要对这些属性进行手动标注
    [11]。


    与基于内容的相似度度量不同，物品间协同过滤算法使用买家信号而非分类体系来计算物品间的相似度，其底层考量是共同评分或共同购买。如果同一批买家对某些产品进行了评分或购买，那么这些产品就具有与买家相关的相似潜在因素。


    基于物品的推荐技术（也称为基于模型的方法）通过分析用户-物品矩阵来识别不同物品之间的关系，然后利用这些关系计算前 N 个推荐列表 [16]。亚马逊的“购买此商品的顾客也购买了”功能也是物品间协同过滤的典型应用。


    在印度大型电商平台 Myntra，采用物品间协同过滤方法来生成个性化相似产品推荐 [11]。买家产品交互数据被用于构建效用矩阵——即用户-物品交互矩阵。对于用户-物品交互，系统考虑了三种用户信号：产品点击、加入购物车和结账，然后通过线性分类模型估算产品点击次数、加入购物车次数和结账次数之间的关系
    [10]。


    由于每个买家通常只与海量可选产品中的少数产品进行交互（购买或浏览），该矩阵高度稀疏。这种稀疏性对传统推荐算法构成了挑战，因为传统算法往往难以有效处理大规模稀疏数据集。矩阵分解方法被用于将买家与产品的交互矩阵转换为低维潜在空间。其中一种用于将交互矩阵分解为低维矩阵的方法是交替最小二乘法（ALS）[21]。


    输入的用户-物品交互矩阵被转换为两个稠密矩阵：买家特征矩阵（U）和产品特征矩阵（V）。这些矩阵捕捉了潜在因素或特征，其中 U 捕捉买家偏好，V 包含买家隐含考虑的产品属性。通过将每个买家（买家特征矩阵中的行）与产品（产品特征矩阵中的列）进行比较，我们可以识别买家对不同产品的偏好。


    图 5-10 展示了效用矩阵如何与买家/客户特征矩阵及产品特征矩阵相关联。


    ![](img/630035_1_En_5_Fig10_HTML.jpg)


    图 5-10


    矩阵分解


    利用产品特征向量，通过计算向量间的余弦相似度，将当前产品与目录中其他产品进行比较，从而生成非个性化候选集。然后，选择前 N 个相似产品作为相似产品推荐的候选。


    对于个性化推荐，该论文同时使用了产品间相似度评分和用户-产品相似度评分。这种方法有助于保留上下文信息以及个性化效果。


    除了协同过滤和基于内容过滤这些基础方法外，深度学习框架也被用于解决可扩展性、利用多样化信息以及性能提升等方面的挑战。下一节将概述如何使用深度学习进行协同过滤和基于内容过滤。


    ## 神经协同过滤（NCF）


    协同过滤根据用户过去的行为以及相似用户的行为，向用户推荐相关物品。协同过滤中的矩阵分解（MF）方法将用户-物品交互矩阵分解为表示潜在因素的低维矩阵。然而，MF
    难以捕捉用户与物品之间复杂的非线性关系。


    神经协同过滤（NCF）是一种利用深度学习增强推荐系统的强大方法。通过使用神经网络，NCF 能够捕捉用户与物品之间错综复杂的非线性关系 [13]。这使得 NCF
    能够利用点击和购买等隐式数据，从而生成更准确、更个性化的推荐。最初的 NCF 论文 [17] 引入了使用多层感知机来学习用户-物品交互函数，强调了其在建模复杂用户-物品关系方面的有效性。


    从高层架构来看，NCF 包含三个主要组件：嵌入层、交互层以及输出或预测层。输入的物品和用户向量是分类特征向量，两者拼接后作为嵌入层的输入。这些嵌入表示用户和物品的潜在特征。交互层利用多层神经网络（如多层感知机）来建模用户与物品的交互。用户和物品的嵌入被输入到这些层中，使
    NCF 能够建模传统矩阵分解无法捕捉的复杂非线性关系。


    输出层接收前一层生成的交互表示，并预测用户与物品交互的可能性。该预测通常包含一个分数，用于指示用户点击、加入购物车或购买特定物品的潜在可能性。


    图 5-11 展示了神经协同过滤的功能架构组件。


    ![](img/630035_1_En_5_Fig11_HTML.jpg)


    图 5-11


    神经协同过滤


    来源：[`https://arxiv.org/abs/1708.05031`](https://arxiv.org/abs/1708.05031)


    NCF 使用目标函数（通常是逐点损失或成对损失）来评估其预测准确性。通过持续最小化该损失函数，模型不断学习并优化其参数。观察到的用户交互（点击、购买）会与预测分数进行比较，以判断模型的性能表现。

    '
- fmt: '# Content-Based Filtering Using Deep Learning


    Like Neural Collaborative Filtering (NCF), the traditional content-based filtering
    (CBF) can be augmented by leveraging artificial neural networks and deep learning.
    The traditional CBF struggles to handle the complexities of textual, video, and
    audio data. Deep learning-based models have emerged as a transformative solution,
    enabling the integration of rich item information such as product descriptions,
    specifications, and acoustic features of music into recommendation systems. This
    approach not only enhances recommendation accuracy but also eliminates the need
    for manual feature extraction and data labeling [[18](#630035_1_En_5_Chapter.xhtml#CR18)],
    making it a more efficient and scalable solution for real-world CBF applications.


    In the realm of ecommerce, product descriptions, reviews, and image data can provide
    invaluable insights for recommending similar products to buyers. Deep learning-based
    models have become indispensable tools for effectively processing and utilizing
    this diverse range of data [[19](#630035_1_En_5_Chapter.xhtml#CR19)]. A typical
    deep learning architecture for CBF comprises Feature Extraction Layer (e.g., extracts
    relevant features from the product content), Embedding Layer (e.g., transforms
    product categories, brands, and tags, etc. into numerical representations), Interaction
    Layer (e.g., model interactions using Multi-Layer Perceptron), and Output Layer
    (e.g., comparing interaction with predicted interaction by binary loss function).


    The combination of these components enables deep learning-based CBF models to
    effectively capture and utilize rich item information, leading to more accurate
    and personalized recommendations.


    # Style Up or Complete My Look Using Computer Vision


    In the realm of advanced recommendation algorithms, “Style It Up” or “Complete
    My Look” stands out as a prominent feature. This feature aims to showcase products
    that seamlessly complement a selected product, effectively completing the user’s
    desired look.


    As noted by [[20](#630035_1_En_5_Chapter.xhtml#CR20)], this functionality requires
    a sophisticated model that not only identifies the appropriate product types (articles
    of clothing) to construct a complete outfit but also selects individual items
    that harmonize stylistically, considering factors like brand, price, color, and
    overall theme to create a cohesive ensemble.


    In an ecommerce setting, for instance, a buyer seeking a complementary T-shirt
    to match their uploaded trouser image can utilize the Style Up or Complete my
    Look feature. The image processing component extracts features from the uploaded
    image, identifying relevant aspects such as color, style, and occasion. These
    features are then fed into the recommendation model, which generates a list of
    recommended T-shirts. The buyer can then browse the recommendations and select
    the one that best suits their preferences.


    Overall, Style Up or Complete my Look using Computer Vision emerges as a promising
    feature capable of generating accurate, personalized, and scalable style recommendations
    for users.


    # Conclusion


    Recommendation engines, Machine Learning (ML) and Artificial Intelligence-(AI)based
    methods, are transforming the way we interact with ecommerce platforms, by offering
    a personalized and efficient shopping experience. Amazon has been a pioneer in
    leveraging the recommendations at scale in ecommerce. 35% of Amazon purchase transactions
    are enabled by recommendation systems.


    An array of recommendations use-cases across ecommerce platforms are on the display,
    for example, recommendations for you, frequent purchases together, similar products,
    style up or complete the look. A successful recommendation system requires a multi-faceted
    approach that considers data, algorithm, similarity metric, and evaluation methods.
    Two most common algorithms used in a recommendation engine are collaborative filtering
    and content-based filtering.


    Collaborative filtering leverages past interactions (purchases, ratings, clicks)
    to identify users with similar tastes and recommend items that those similar users
    have preferred. This approach introduces new and interesting options to the users,
    they might not have considered otherwise.


    Content-based filtering considers features like product descriptions, genres,
    categories, and user reviews to recommend items with similar attributes to those
    a user has interacted with in the past. It creates choices that are similar to
    what a user has already interacted with, leading to a higher chance of finding
    these choices relevant.


    Deep learning has been a major success across applications and the recommendation
    systems are not left behind. Both collaborative filtering and content-based filtering
    approaches are augmented with deep learning frameworks. The Neural Collaborative
    Filtering (NCF) has shown remarkable improvement in performance and delivers results
    at scale. Also, deep learning helps expand content-based filtering to be a multi
    model – leverage a variety of data – from images to interaction data for generating
    the recommendations.


    Convolution Neural Network (CNN) architecture is transforming Style Up or Complete
    the Look recommendation use-cases.


    When a long list of choices is aligned with the user’s taste and preferences,
    how to prioritize the most relevant on the top. Arranging choices in order to
    improve buyer experience and business outcome is a common challenge across search,
    recommendations, and category navigation journeys. This challenge is solved using
    a family algorithm called ranking algorithms. This is the topic for the next chapter.


    # 6. Ranking: Science of Sorting in Ecommerce


    ## Introduction


    For a shopping journey on an ecommerce platform, the search feature offers a faster
    way to find desired products. Buyers who employ search tend to convert or place
    orders at a higher conversion rate, around four times higher than those who don’t.
    Buyers who use search functionality typically have a clear purchase intent, and
    search expedites their journey toward finding products. Ranking algorithms further
    enhances this journey by helping them discover the most relevant products more
    efficiently.


    On the other hand, a considerable buyer cohort, especially in the realm of fashion
    ecommerce, consists of “explorers.” These individuals are actively seeking variety
    and options that align with their unique preferences. For this cohort, a virtual
    sales assistant proves indispensable, providing tailored recommendations and suggestions
    for products they may find appealing. Essentially, the recommendation engine serves
    as the virtual sales assistant in fashion ecommerce. In the preceding chapter,
    the process of curating personalized choices for each buyer is deliberated upon.
    In addition, these curated recommendations are further optimized using ranking
    algorithms to enhance relevance for buyers, thereby driving key business outcomes
    such as conversion rates and gross merchandise value (GMV).


    In this chapter, we delve into the concept of a machine learning twin, known as
    ranking, often utilized alongside search or recommendation engines. Ranking plays
    a pivotal role by reordering search results or recommendations, thereby enhancing
    relevance and ultimately improving conversions and GMV. The role of ranking algorithms
    extends beyond merely complementing search and recommendations; they have wide-ranging
    applications in stand-alone scenarios. Ranking algorithms are extensively used
    to prioritize categories on home pages and even to rearrange payment options on
    checkout pages. This chapter focuses on the science behind ranking, including
    the framework for developing ranking models and the processes for creating labeled
    data and features.'
  raw: '## Content-Based Filtering Using Deep Learning


    Like Neural Collaborative Filtering (NCF), the traditional content-based filtering
    (CBF) can be augmented by leveraging artificial neural networks and deep learning.
    The traditional CBF struggles to handle the complexities of textual, video, and
    audio data. Deep learning-based models have emerged as a transformative solution,
    enabling the integration of rich item information such as product descriptions,
    specifications, and acoustic features of music into recommendation systems. This
    approach not only enhances recommendation accuracy but also eliminates the need
    for manual feature extraction and data labeling [[18](#630035_1_En_5_Chapter.xhtml#CR18)],
    making it a more efficient and scalable solution for real-world CBF applications.


    In the realm of ecommerce, product descriptions, reviews, and image data can provide
    invaluable insights for recommending similar products to buyers. Deep learning-based
    models have become indispensable tools for effectively processing and utilizing
    this diverse range of data [[19](#630035_1_En_5_Chapter.xhtml#CR19)]. A typical
    deep learning architecture for CBF comprises Feature Extraction Layer (e.g., extracts
    relevant features from the product content), Embedding Layer (e.g., transforms
    product categories, brands, and tags, etc. into numerical representations), Interaction
    Layer (e.g., model interactions using Multi-Layer Perceptron), and Output Layer
    (e.g., comparing interaction with predicted interaction by binary loss function).


    The combination of these components enables deep learning-based CBF models to
    effectively capture and utilize rich item information, leading to more accurate
    and personalized recommendations.


    ## Style Up or Complete My Look Using Computer Vision


    In the realm of advanced recommendation algorithms, “Style It Up” or “Complete
    My Look” stands out as a prominent feature. This feature aims to showcase products
    that seamlessly complement a selected product, effectively completing the user’s
    desired look.


    As noted by [[20](#630035_1_En_5_Chapter.xhtml#CR20)], this functionality requires
    a sophisticated model that not only identifies the appropriate product types (articles
    of clothing) to construct a complete outfit but also selects individual items
    that harmonize stylistically, considering factors like brand, price, color, and
    overall theme to create a cohesive ensemble.


    In an ecommerce setting, for instance, a buyer seeking a complementary T-shirt
    to match their uploaded trouser image can utilize the Style Up or Complete my
    Look feature. The image processing component extracts features from the uploaded
    image, identifying relevant aspects such as color, style, and occasion. These
    features are then fed into the recommendation model, which generates a list of
    recommended T-shirts. The buyer can then browse the recommendations and select
    the one that best suits their preferences.


    Overall, Style Up or Complete my Look using Computer Vision emerges as a promising
    feature capable of generating accurate, personalized, and scalable style recommendations
    for users.


    ## Conclusion


    Recommendation engines, Machine Learning (ML) and Artificial Intelligence-(AI)based
    methods, are transforming the way we interact with ecommerce platforms, by offering
    a personalized and efficient shopping experience. Amazon has been a pioneer in
    leveraging the recommendations at scale in ecommerce. 35% of Amazon purchase transactions
    are enabled by recommendation systems.


    An array of recommendations use-cases across ecommerce platforms are on the display,
    for example, recommendations for you, frequent purchases together, similar products,
    style up or complete the look. A successful recommendation system requires a multi-faceted
    approach that considers data, algorithm, similarity metric, and evaluation methods.
    Two most common algorithms used in a recommendation engine are collaborative filtering
    and content-based filtering.


    Collaborative filtering leverages past interactions (purchases, ratings, clicks)
    to identify users with similar tastes and recommend items that those similar users
    have preferred. This approach introduces new and interesting options to the users,
    they might not have considered otherwise.


    Content-based filtering considers features like product descriptions, genres,
    categories, and user reviews to recommend items with similar attributes to those
    a user has interacted with in the past. It creates choices that are similar to
    what a user has already interacted with, leading to a higher chance of finding
    these choices relevant.


    Deep learning has been a major success across applications and the recommendation
    systems are not left behind. Both collaborative filtering and content-based filtering
    approaches are augmented with deep learning frameworks. The Neural Collaborative
    Filtering (NCF) has shown remarkable improvement in performance and delivers results
    at scale. Also, deep learning helps expand content-based filtering to be a multi
    model – leverage a variety of data – from images to interaction data for generating
    the recommendations.


    Convolution Neural Network (CNN) architecture is transforming Style Up or Complete
    the Look recommendation use-cases.


    When a long list of choices is aligned with the user’s taste and preferences,
    how to prioritize the most relevant on the top. Arranging choices in order to
    improve buyer experience and business outcome is a common challenge across search,
    recommendations, and category navigation journeys. This challenge is solved using
    a family algorithm called ranking algorithms. This is the topic for the next chapter.


    # 6. Ranking: Science of Sorting in Ecommerce


    ## Introduction


    For a shopping journey on an ecommerce platform, the search feature offers a faster
    way to find desired products. Buyers who employ search tend to convert or place
    orders at a higher conversion rate, around four times higher than those who don’t.
    Buyers who use search functionality typically have a clear purchase intent, and
    search expedites their journey toward finding products. Ranking algorithms further
    enhances this journey by helping them discover the most relevant products more
    efficiently.


    On the other hand, a considerable buyer cohort, especially in the realm of fashion
    ecommerce, consists of “explorers.” These individuals are actively seeking variety
    and options that align with their unique preferences. For this cohort, a virtual
    sales assistant proves indispensable, providing tailored recommendations and suggestions
    for products they may find appealing. Essentially, the recommendation engine serves
    as the virtual sales assistant in fashion ecommerce. In the preceding chapter,
    the process of curating personalized choices for each buyer is deliberated upon.
    In addition, these curated recommendations are further optimized using ranking
    algorithms to enhance relevance for buyers, thereby driving key business outcomes
    such as conversion rates and gross merchandise value (GMV).


    In this chapter, we delve into the concept of a machine learning twin, known as
    ranking, often utilized alongside search or recommendation engines. Ranking plays
    a pivotal role by reordering search results or recommendations, thereby enhancing
    relevance and ultimately improving conversions and GMV. The role of ranking algorithms
    extends beyond merely complementing search and recommendations; they have wide-ranging
    applications in stand-alone scenarios. Ranking algorithms are extensively used
    to prioritize categories on home pages and even to rearrange payment options on
    checkout pages. This chapter focuses on the science behind ranking, including
    the framework for developing ranking models and the processes for creating labeled
    data and features.'
