  trans: '

    ## 相似商品推荐的排序


    在在线时尚领域，“相似商品”推荐并非只是橱窗装饰——它们是推动转化的强大引擎。浏览商品详情页（PDP）的买家依赖它们，就像信赖一位值得信赖的造型师，来发现心仪商品并做出购买决策。虽然只有
    10%–20%的印度时尚电商访客会在商品详情页上积极与这些推荐互动，但他们是购买意向强烈的买家，随时准备下单。因此，优化这些建议的排序对于提升转化率至关重要。


    用户对“相似商品”的期望，既源于商品的内在特征（如款式、材质和颜色），也源于其视觉元素（如图案、形状和色彩）。相似商品推荐引擎会进行商品特征匹配，从图片中提取视觉线索，并结合商品流行度数据，动态生成相关的商品推荐。这确保了用户发现的商品不仅在款式上匹配，而且符合当前潮流，最终带来更令人满意、更具吸引力的购物体验。


    即使商品特征（如颜色或图案）保持不变，相似商品推荐也可以定期且有效地进行刷新。这是通过更新从买家互动和购买模式中推导出的隐式因子来实现的，这些因子同时被捕捉在用户特征矩阵和商品特征矩阵中。随着买家行为的变化，这些更新确保了推荐能够动态适应随时间变化的偏好。此外，基于机器学习的排序系统会整合更新的商品指标，持续优化向买家展示的商品。这种方法确保了推荐即使在非个性化场景下，也能保持相关性并与当前趋势和表现数据保持一致。


    在电商平台上，买家会在所选商品下方看到五条“相似商品”推荐，并可以选择探索更多相似商品，如下图所示。然而，大多数互动都发生在默认显示的列表中。因此，首要目标是确保该组件中的前五个商品是最相关、最具影响力的，从而最大化业务成果。这涉及设计排序算法，为每位买家优化这些顶部商品的展示位置。


    图 6-8 展示了相似商品推荐的布局示例。


    ![](img/630035_1_En_6_Fig8_HTML.jpg)


    图 6-8


    相似商品展示布局


    相似商品推荐的候选列表通过以下方式生成：基于图像的相似商品生成——识别具有相似视觉元素（如图案、颜色和形状等）的商品；以及基于商品属性的相似商品生成——整合基于商品描述和规格（如材质、尺寸或品牌）的特征。


    候选的相似商品使用学习排序（LTR）进行重新排列。该模型优先考虑近期销量高、用户评分高和点击率高的商品，确保买家看到的商品不仅相关，而且受到他人好评。


    由于电商行业的动态特性，学习排序（LTR）模型面临着若干挑战。例如，在时尚电商中，潮流变化迅速，新设计可能很快变得流行。然而，这些新产品可能缺乏历史数据，使得
    LTR 模型难以有效地对它们进行排序。数据质量至关重要；数据中的偏差或不准确会显著影响模型的结果。此外，基于深度学习的排序模型虽然强大，但可能出现过拟合，尤其是在没有充分正则化或过度依赖历史模式的情况下。


    例如，当用户在电商平台上浏览一双厚底运动鞋时，用户会看到符合当前偏好的流行选项，从而获得更令人满意的购物体验。


    ## 结论


    排序对于帮助买家找到相关商品以及用户在数字平台上发现信息至关重要。无论是电商平台、搜索引擎还是流媒体服务，通过排序对商品、内容或服务进行战略性展示，都能显著提升用户体验。


    谷歌开创性的 PageRank 算法凸显了排序系统的威力，彻底改变了我们与信息互动的方式。如今，排序已成为数字成功不可或缺的组成部分，需要战略性的方法和持续的优化。


    电商的繁荣依赖于相关性。通过将最相关的商品置于首位，平台提升了买家体验，推动了转化，并培养了忠诚度。排序的重要性在各个触点上显而易见，从在首页展示排序后的选项列表，到显示排序后的搜索结果和浏览页面。


    随着数字格局的演变，电商平台成为数百万买家的核心舞台，排序算法在整理这些平台上的商品或选项中扮演着关键角色。首页上的个性化品类序列和组件选项能够吸引用户并改善他们的体验。在搜索过程中，排序后的商品列表能提高点击率（CTR）和转化率。搜索排序通过机器学习（ML）和人工智能（AI）算法实现。同样，列表页上的推荐和商品，也会在已识别候选的基础上，通过排序算法进行增强。


    在下一章中，重点将放在个性化如何提升买家体验上。除了在搜索和推荐中进行个性化排序外，个性化还通过布局个性化、个性化优惠和促销活动，影响买家在电商平台上的旅程，从而改善买家体验和业务成果。


    # 7. 个性化——AI 打造的客户体验

    '
- fmt: '# Introduction


    Products on search and category navigation pages are ranked to enhance their relevance
    to buyers, leading to increased engagement and improved business outcomes such
    as higher conversion rates and gross merchandising value (GMV). While ranking
    is generally influenced by product attributes and emerging trends, performance
    can be significantly enhanced through personalization, where products are ranked
    based on individual buyer affinities. This chapter explores the concept of personalized
    ranking and various other use cases of product personalization.


    A recommendation engine is used to achieve personalization, but not all recommendations
    are personalized. For example, similar product recommendations may not be personalized
    to start with, and an additional personalized re-ranking layer is created to personalized
    recommendations for each of the buyers.


    Personalization extends beyond search and recommendations, impacting every step
    of buyer touchpoints in ecommerce and on the ecommerce platform. In this chapter,
    we will explore a few scenarios and how personalization is driving performance
    for ecommerce.


    Mohsin, who owns an apparel fashion outlet in Bangalore, has a regular buyer named
    Jasmin who lives in an apartment complex close by. Jasmin visits the shop and
    requests Mohsin to show her a few dresses for an upcoming wedding. Mohsin, being
    familiar with Jasmin’s style and preferences, as well as exact size, selects a
    set of options and Jasmin picks up one that she likes the most. Jasmin navigates
    through a vast portfolio of options seamlessly, saving her time and facilitating
    faster purchase decisions. This is an example of personalized and contextual knowledge
    creating a smooth user or customer experience.


    While Mohsin’s personalized approach works well for a small number of users. He
    registered with a fashion ecommerce platform. The ecommerce platform has millions
    of daily visitors. The platform should be able to provide a personalized experience
    similar to Mohsin’s. One approach could be that there are thousands of people
    similar to Mohsin who look at all the things users are doing and have done to
    develop the views of the users. As soon as the user logs in to the platform they
    start pushing options and products relevant to each of the users.


    The above approach of creating manual but personalized feed for the users is not
    scalable and highly expensive. And the platform may not even be able to deliver
    a similar level of personalized experience. How artificial intelligence and machine
    learning can help Mohsin/ecommerce to deliver personalized experiences even when
    there are thousands and millions of users?


    Millions of users visit an ecommerce platform daily. How can a fashion ecommerce
    platform accommodate the personalized needs of its millions of daily visitors?


    Jeff Bezos in 1998 mentioned that if there are 4.5 million customers on Amazon
    platform, there should be 4.5 million stores [[1](#630035_1_En_7_Chapter.xhtml#CR1)]
    . That is the vision he had at that point and AI/ML is enabler to his vision.


    Personalization in ecommerce refers to tailoring the shopping experience based
    on user context and preferences. In this chapter, we explore a wide array of personalization
    strategies and examples in an ecommerce environment and examine how they are implemented
    using Artificial Intelligence (AI) and Machine Learning (ML).


    Personalization in ecommerce revolves around using updated buyer information to
    tailor product recommendations and search results. Initially, capturing all relevant
    details about buyers is crucial. Once collected, this information must be accessible
    to algorithms for further processing. These algorithms then use the updated data
    to refine recommendations, search results, and other features based on specific
    objectives.


    The process of capturing, processing, and integrating data into algorithms involves
    various technological components and a well-designed architecture to enable effective
    personalization.


    **Consider a scenario:** Alex is a frequent shopper on an ecommerce platform and
    searches for “blue t-shirts.” His profile, which includes preferences for brands
    and price ranges, is used to tailor the search results. The buyer’s profile is
    stored in a Customer Data Platform (CDP), such as `Elasticsearch`, and is leveraged
    alongside the search query results. The system performs real-time personalized
    re-ranking based on Alex’s profile and the current search results.


    ## Location-Based Personalization


    Manisha sees a TV advertisement and visits an ecommerce platform. This is her
    first visit. The platform recognizes that she is from Bangalore. The home page
    of the website prioritizes the categories that resonate well with the Bangalore
    visitors; this is done based on location. Considering this is her first visit,
    it shows the offers and discounts relevant for the first time visitors. The offer
    is very aggressive and can be availed across categories and brands.


    She clicks on the first option and starts her exploration on the platform. The
    location-based personalization and contextual (first visitor) offer entices Manisha
    to progress to the next steps of the journey.


    She clicks on the women’s Indian wear category (although it was not personalized
    as the system could not recognize the gender) and further explores kurta sets
    within the women’s apparel category. She lands on the “Kurta Set” category and
    finds a list of kurta sets. The kurta sets are prioritized based on popularity
    in the region for her to review and explore the trending products. She wanders
    across products and adds a few to the Wishlist. She stops her exploration journey
    for the day, and leaves a wealth of information about her interest and preferences.


    The platform captures information on what is browsed, purchased, and wish-listed
    across different brands and categories. This rich data becomes the key to understanding
    unique preferences and crafting hyper-personalized experiences [[2](#630035_1_En_7_Chapter.xhtml#CR2)].


    For first-time visitors like Manisha, the platform personalized based on the device
    type (e.g., iOS vs. Android) and/or location-based personalizations. The location
    may not be available if someone visits a website or location tracking is not enabled.'
