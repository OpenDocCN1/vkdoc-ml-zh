  trans: '

    ## 个性化在电子商务中的影响


    个性化已深深融入电子商务的肌理。其根源可追溯至在线购物的黎明时期，亚马逊和 eBay 等先驱在 20 世纪 90 年代便开始利用其力量。快进到 21 世纪初，推荐引擎成为个性化的首选工具。亚马逊的协同过滤算法，根据用户过往行为，巧妙地引导他们进行下一次购买。


    进入 2010 年代，格局发生了剧变。人工智能（AI）和机器学习（ML）成为新的主导力量，实现了更精准的预测和实时调整。个性化不再局限于产品推荐，而是被用于个性化电子邮件、聊天机器人、虚拟助手，甚至动态网站内容，所有这些都旨在根据个人偏好定制体验。


    过去几年，超个性化经历了飞速崛起。每一次点击和操作都被剖析和分析，实时塑造产品建议和内容。可以将其视为一种专为用户量身定制的购物体验。自然语言处理（NLP）和计算机视觉等技术进一步完善了这些策略，将个性化扩展到促销、折扣和忠诚度计划。


    个性化已不再是差异化优势，而是生存的必需品[4]。客户对个性化的期望日益增长——73%的购物者希望品牌能够理解他们独特的需求和期望[5]。一个成功的个性化项目可以带来显著的商业影响，“客户满意度提高
    20%，销售转化率提升 10%至 15%”[4]。根据麦肯锡的研究，擅长个性化的公司比普通公司多创造 40%的收入[5]。


    以下描述了电子商务平台及整个营销漏斗中成功个性化项目的优秀案例。


    *   **BigBasket：** 这家印度生鲜平台通过向客户发送时机精准的推送通知，将点击率从 1.8%提升至 2.5%–3%，并实现了购物车添加量的激增（提升
    26%）[4]。


    *   **多品类电商平台：** 一个销售时尚、鞋类、配饰、电子产品和奢侈品等多个垂直品类的电商平台，利用个性化实现了 2 倍的收入增长和 35%的客户参与度提升[7]。


    *   **Tata CLiQ：** Tata CLiQ 是印度塔塔集团旗下 Tata Unistore Limited 拥有的全渠道市场平台。该平台利用个性化消息进行购物车放弃挽回活动，使点击率（CTR）提升了
    1.5 倍[8]。


    *   **Paytm：** 印度金融服务公司 Paytm 在其首页上提供个性化推荐，观察到 Paytm Mall 首页的转化率达到 5.5–6%[9]。


    *   **丝芙兰：** 丝芙兰成立于 1970 年，于 1997 年被 LVMH 集团收购，在全球 33 个国家拥有约 2300 家门店。丝芙兰正在投资人工智能，用于个性化产品推荐[10]。


    这些只是少数已发表的研究，它们突显了个性化的重要性。个性化在电子商务的各个接触点都发挥着作用。


    随着深度学习和大语言模型的出现，买家行为的细微细节——例如在电商平台上的反馈、点击和购买——被捕获并表示为嵌入向量。向量数据库进一步增强了近乎实时地利用这些细节的能力，从而在电商平台上实现高度个性化的搜索结果和其他针对买家的特定功能。为机器学习模型创建和管理大量特征的挑战已通过深度学习的能力得到缓解，深度学习可以有效地处理数百个特征并进行高效扩展。


    在这个超个性化的时代，集群或细分群体的数量限制不再是制约因素。个性化工作越来越聚焦于单个买家层面，从而提供更具针对性、更精准的买家体验。


    以 Manisha 为例，她再次自然访问了平台，但电商平台不能仅仅依赖访问者记得回来。负责提升现有客户或访问者参与度的营销团队，通常被称为客户关系管理（CRM）团队，其工作是设计活动以吸引访问者返回平台。个性化的电子邮件营销可以显著改善关键绩效指标，包括打开率（打开邮件的收件人百分比）、点击率（点击邮件内链接访问电商平台的收件人百分比）和交易率（最终在平台完成购买的收件人百分比）[6]。

    '
- fmt: '# Personalization in Marketing


    Manisha was engrossed in an ecommerce platform when she received a call from her
    office, abruptly halting her purchase journey. Similar to Manisha, 95–98% of the
    customers drop off from the purchase journey and do not purchase any products
    for the visit on ecommerce platforms.


    Only 1–3% of visitors end up purchasing products, resulting in a conversion rate
    of around 1–3% for fashion ecommerce. The platform sends a notification to Manisha
    a few hours later, reminding her about the products she viewed but did not purchase.
    Manisha clicks on the notification, which takes her back to the products she viewed.
    This is a success of notification to remind and create interest for Manisha to
    re-engage with the platform.


    The marketing team focuses on setting up notifications to enhance customer re-engagement
    efforts. These campaigns run with various messages and promotional offer constructs
    to improve the response for the notification campaigns. Whether visitors will
    respond or click on notifications and reach the platform is not a one-size-fits-all
    scenario but a multi-dimensional one. A machine learning-based framework helps
    the marketing team identify what works for each user. This helps in improving
    notification response rates or click-through rates.


    Manisha resumes her product discovery journey, explores various kurta-sets, mostly
    printed and embroidered and adds products to the cart! This is a significant event
    on the purchase journey, cart add. Around 5–10% ecommerce visitors reach this
    stage. This is called cart add rate or add to cart rate, percentage of visitors
    adding at least one product to the cart. She leaves the product/s in the cart
    and ends her purchase journey.


    A significant count of users, like Manisha, add products to the cart but do not
    purchase anything during the visit. Research suggests that the shopping cart abandonment
    rates in India are around 51%, and some of the reasons are unexpected shipping
    cost, pay on delivery option, product price changes, high product price as compared
    to other ecommerce platforms, lack of product reviews, etc [[14](#630035_1_En_7_Chapter.xhtml#CR14),
    [15](#630035_1_En_7_Chapter.xhtml#CR15)]. Again, the marketing team leverages
    customer relationship management system and process to reach to these users for
    re-engaging them may be via notifications.


    Not all notifications are guaranteed to reach customers, which is why the CRM
    team leverages multiple channels to reach out to visitors. Some of these channels
    include SMS, WhatsApp, etc. While notifications are a low-cost channel, SMS and
    WhatsApp incur some costs (typically 12–15 P per communication). Despite the low
    cost per communication, the overall cost can escalate significantly considering
    millions of users on the ecommerce platforms. Who are the users that should be
    targeted and what channel and how many times?


    The marketing and data science teams collaborate to identify the preferred communication
    channels and determine the offer or product communication to buyers. Buyer segmentation
    and machine learning algorithms help the marketing team improve campaign response
    rates by identifying who clicks and returns to the platform, ultimately leading
    to more purchases. Common intervention touchpoints include product views without
    adding to cart or added products to the cart but not purchased. These customers
    are reached out to via multiple channels such as email, SMS, or WhatsApp.


    Each channel in a marketing strategy has distinct response rates and associated
    costs. Achieving business outcomes, such as increasing visits through CRM campaigns
    while managing costs, requires careful consideration. An optimization framework
    can assist the marketing team by determining the optimal volume of contacts to
    make across each channel, aiming to maximize responses while adhering to budget
    constraints. This approach ensures effective resource allocation and cost management
    while striving to achieve the desired marketing goals.


    ## Case Study: User Re-engagement Powered by Machine Learning (ML) Model


    **Context:** For an ecommerce platform, over 2 million daily visitors. A significant
    percentage of these customers explore products. However, only 8–10% of these customers
    add products to the cart, and many of them do not return by the next few days.
    The platform invests heavily in marketing efforts to attract users to the platform,
    leading these visitors on their own is not a right choice. The focus is on developing
    marketing interventions to re-engage users who explored products but did not add
    them to the cart or make a purchase.


    **Objective:** Developing a machine learning model to predict the likelihood of
    a customer returning when a product is promoted or included in an SMS/WhatsApp
    campaign.


    **Approach:** For model development, users who have browsed at least two products
    in their latest session are selected. The historical data is used to label products
    as 1 if they were explored and purchased, and 0 otherwise. User browsing behavior,
    such as clicks on brands or categories, and time spent on each product, are used
    as features. A machine learning model is then developed to identify products that
    have the highest likelihood of bringing back users to the platform.


    **Outcome:** Improved email response rate for the campaign that has personalized
    products for each campaign.


    An SMS reminds Manisha about the Kurta-set she intended to purchase. She opens
    the ecommerce app and instead of opting for a browsing journey, she prefers the
    search navigation journey this time.'
