    [15](#630035_1_En_7_Chapter.xhtml#CR15)]. Again, the marketing team leverages
    customer relationship management system and process to reach to these users for
    re-engaging them may be via notifications.


    Not all notifications are guaranteed to reach customers, which is why the CRM
    team leverages multiple channels to reach out to visitors. Some of these channels
    include SMS, WhatsApp, etc. While notifications are a low-cost channel, SMS and
    WhatsApp incur some costs (typically 12–15 P per communication). Despite the low
    cost per communication, the overall cost can escalate significantly considering
    millions of users on the ecommerce platforms. Who are the users that should be
    targeted and what channel and how many times?


    The marketing and data science teams collaborate to identify the preferred communication
    channels and determine the offer or product communication to buyers. Buyer segmentation
    and machine learning algorithms help the marketing team improve campaign response
    rates by identifying who clicks and returns to the platform, ultimately leading
    to more purchases. Common intervention touchpoints include product views without
    adding to cart or added products to the cart but not purchased. These customers
    are reached out to via multiple channels such as email, SMS, or WhatsApp.


    Each channel in a marketing strategy has distinct response rates and associated
    costs. Achieving business outcomes, such as increasing visits through CRM campaigns
    while managing costs, requires careful consideration. An optimization framework
    can assist the marketing team by determining the optimal volume of contacts to
    make across each channel, aiming to maximize responses while adhering to budget
    constraints. This approach ensures effective resource allocation and cost management
    while striving to achieve the desired marketing goals.


    *Case Study: User re-engagement powered by Machine Learning (ML) Model*


    *Context: For an ecommerce platform, over 2 million daily visitors. A significant
    percentage of these customers explore products. However, only 8–10% of these customers
    add products to the cart, and many of them do not return by the next few days.
    The platform invests heavily in marketing efforts to attract users to the platform,
    leading these visitors on their own is not a right choice. The focus is on developing
    marketing interventions to re-engage users who explored products but did not add
    them to the cart or make a purchase.*


    *Objective: Developing a machine learning model to predict the likelihood of a
    customer returning when a product is promoted or included in an SMS/WhatsApp campaign.*


    *Approach: For model development, users who have browsed at least two products
    in their latest session are selected. The historical data is used to label products
    as 1 if they were explored and purchased, and 0 otherwise. User browsing behavior,
    such as clicks on brands or categories, and time spent on each product, are used
    as features. A machine learning model is then developed to identify products that
    have the highest likelihood of bringing back users to the platform.*


    *Outcome: Improved email response rate for the campaign that has personalized
    products for each campaign.*


    An SMS reminds Manisha about the Kurta-set she intended to purchase. She opens
    the ecommerce app and instead of opting for a browsing journey, she prefers the
    search navigation journey this time.'
  trans: '

    ## 营销中的个性化


    玛尼莎正全神贯注地浏览一个电商平台，这时她接到了办公室的电话，购物过程戛然而止。和玛尼莎一样，95%–98% 的顾客会在购物过程中流失，不会在访问电商平台时购买任何商品。


    只有 1%–3% 的访客最终会购买商品，这使得时尚电商的转化率大约在 1%–3% 左右。几小时后，平台向玛尼莎发送了一条通知，提醒她曾浏览但未购买的商品。玛尼莎点击了通知，页面将她带回了她之前浏览过的商品。这是一次成功的通知，提醒并激发了玛尼莎重新与平台互动的兴趣。


    营销团队专注于设置通知，以加强客户重新参与的努力。这些活动通过不同的信息和促销优惠结构来运行，以提高通知活动的响应率。访客是否会响应或点击通知并返回平台，并非一个“一刀切”的场景，而是一个多维度的场景。一个基于机器学习的框架帮助营销团队识别出对每个用户有效的方法。这有助于提高通知响应率或点击率。


    玛尼莎重新开始了她的商品发现之旅，浏览了各种库尔塔套装，大多是印花和刺绣款式，并将商品加入了购物车！这是购物过程中的一个重要事件——加入购物车。大约 5%–10%
    的电商访客会到达这个阶段。这被称为加购率，即至少将一件商品加入购物车的访客百分比。她将商品留在了购物车中，结束了她的购物之旅。


    像玛尼莎一样，有相当数量的用户将商品加入购物车，但在访问期间并未购买任何东西。研究表明，印度的购物车放弃率约为 51%，原因包括意外运费、货到付款选项、商品价格变动、与其他电商平台相比价格过高、缺乏商品评价等
    [14, 15]。同样，营销团队利用客户关系管理系统和流程，通过（可能）发送通知来重新吸引这些用户。


    并非所有通知都能保证送达客户，这就是为什么 CRM 团队利用多种渠道来联系访客。其中一些渠道包括短信、WhatsApp 等。虽然通知是一种低成本渠道，但短信和
    WhatsApp 会产生一些费用（通常每条通讯 12–15 分）。尽管每条通讯的成本很低，但考虑到电商平台上的数百万用户，总成本可能会显著增加。应该针对哪些用户？使用什么渠道？以及发送多少次？


    营销和数据科学团队合作，以确定买家偏好的沟通渠道，并决定向买家传达的优惠或商品信息。买家细分和机器学习算法通过识别哪些用户会点击并返回平台，帮助营销团队提高活动响应率，最终促成更多购买。常见的干预接触点包括：浏览商品但未加入购物车，或者已将商品加入购物车但未购买。这些客户会通过电子邮件、短信或
    WhatsApp 等多种渠道进行联系。


    营销策略中的每个渠道都有不同的响应率和相关成本。要实现业务成果，例如通过 CRM 活动增加访问量同时控制成本，需要仔细考量。一个优化框架可以帮助营销团队确定每个渠道的最佳联系数量，旨在遵守预算限制的同时最大化响应率。这种方法确保了有效的资源分配和成本管理，同时努力实现预期的营销目标。


    *案例研究：由机器学习模型驱动的用户重新参与*


    *背景：对于一个电商平台，每日有超过 200 万访客。其中很大一部分客户会浏览商品。然而，只有 8%–10% 的客户会将商品加入购物车，并且其中许多人在接下来的几天内不会返回。该平台在营销工作上投入巨资以吸引用户，放任这些访客流失并非明智之举。重点在于开发营销干预措施，以重新吸引那些浏览过商品但未将其加入购物车或未进行购买的客户。*


    *目标：开发一个机器学习模型，用于预测当某件商品被推广或包含在短信/WhatsApp 活动中时，客户返回的可能性。*


    *方法：在模型开发中，选择那些在最近一次会话中浏览过至少两件商品的用户。利用历史数据，将商品标记为 1（如果被浏览并购买）或 0（否则）。用户的浏览行为，例如对品牌或类别的点击，以及在每件商品上花费的时间，被用作特征。然后开发一个机器学习模型，以识别出最有可能将用户带回平台的商品。*


    *成果：提高了为每个活动提供个性化商品的活动电子邮件响应率。*


    一条短信提醒了玛尼莎她打算购买的库尔塔套装。她打开了电商应用，这次她没有选择浏览式购物，而是更倾向于使用搜索导航。

    '
- fmt: '# Search Personalization


    Manisha leverages the search bar on the ecommerce application and types `"kurta-set"`.
    The search suggests the search term as `"kurta set for women"`, and she starts
    her product purchase journey.


    When the search engine returns the products, the list is personalized considering
    that she has already explored kurta sets with printed and embroidered patterns.
    This makes shopping experience seamless for Manisha as the ecommerce search factors
    in her preference toward a certain type of patterns. The personalized search experience
    for Manisha not only considers the pattern but also various subtle preferences
    such as price range, brand, occasion, or fabric.


    Search personalization leads to faster product discovery for the customers and
    improved shopping experience, leading to increased conversion rate.


    Up to 30% of customers on ecommerce platforms harness the power of search to find
    what they’re looking for, generating over 50% of sales [[13](#630035_1_En_7_Chapter.xhtml#CR13)].
    Optimizing and personalizing search journeys directly impacts both business success
    and customer experience. Research has shown that the position of a product in
    the search results significantly impacts its Click-Through Rate (CTR) [[11](#630035_1_En_7_Chapter.xhtml#CR11)].
    This is where personalized ranking comes into play. By considering individual
    customer data like past purchases, browsing behavior, and contextual factors (location,
    time of day, etc), AI-powered ranking models can curate product listings that
    resonate deeply with each shopper.


    Airbnb, a pioneer in personalization, employs short-term signals (like recent
    clicks and searches) and long-term memory (previous bookings and preferences)
    to craft deeply personalized search results using cutting-edge embeddings. This
    approach has resulted in a remarkable 20% increase in CTR [[12](#630035_1_En_7_Chapter.xhtml#CR12)].


    In addition to search results, home page, and marketing personalizations, there
    are numerous features on ecommerce platforms that can benefit from personalization.
    We all appreciate when results are curated and crafted for our needs, tastes,
    and preferences.


    Before we delve into other examples of personalization on ecommerce platforms,
    let’s explore a whole new world of personalization: the story of Stitch Fix. Stitch
    Fix is a company that designs and delivers fashion products to customers even
    before they place an order.


    ## Design to Delivery Personalization: Stitch Fix – A Personalized Stylist


    Stitch Fix is a leading online clothing subscription service-based company in
    the United States, founded in 2011. It takes personalized experience in ecommerce
    to the next level by bringing algorithms and humans together. With customer information
    around price, size, style, lifestyle, and other preferences, the company designs
    personalized styles for each buyer and delivers products along with a personal
    note [[16](#630035_1_En_7_Chapter.xhtml#CR16)].


    In a nutshell, imagine a carefully curated box of five fashion items, handpicked
    just for a customer by a virtual stylist who knows every detail relevant to the
    buyer, just like a personalized stylist. This isn’t magic; it’s the power of data
    science and human stylists combined [[17](#630035_1_En_7_Chapter.xhtml#CR17)].


    Stitch Fix leverages a treasure trove of data about customer style preferences,
    fit, and past purchases to curate a selection that feels effortlessly personal.
    It’s like having a fashion fairy godmother, whisking away the guesswork and leaving
    you with a box of delights to try on at home. Whether you keep all five treasures
    or simply send some back, the experience is about discovering new favorites and
    refining personal style. The free returns create a closed loop to further refine
    the algorithms and understand more about customers’ tastes and preferences.


    Stitch Fix’s business model is fundamentally centered around personalization,
    creating a unique and tailored experience for each customer. On the other hand,
    most ecommerce platforms augment their features with personalization to deliver
    a better customer experience and achieve positive business outcomes.


    Manisha spends significant time exploring interesting trends on Instagram and
    engaging with the personal network. She notices an interesting product advertisement
    (Paid Social campaign) and clicks on the banner. This redirects her to the ecommerce
    product detailed page (PDP). She explores the products and clicks on the similar
    product widget.'
