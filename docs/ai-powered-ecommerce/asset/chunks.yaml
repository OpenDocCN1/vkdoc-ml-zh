    informal language for the search queries [[3](#630035_1_En_4_Chapter.xhtml#CR3)].


    To overcome these limitations, ecommerce platforms leverage machine learning-powered
    query classification models. These models act as intelligent classifiers, analyzing
    search query terms like “Adidas Men Trainers Running Shoes” and the model predicts
    the most relevant product categories and brand information. This allows the search
    algorithm to efficiently match Jose’s query with the most relevant products in
    the catalog, significantly improving search response times and the overall user
    experience.


    Figure [4-2](#630035_1_En_4_Chapter.xhtml#Fig2) illustrates the high-level process
    of linking search terms to catalog products.


    ![](images/630035_1_En_4_Chapter/630035_1_En_4_Fig2_HTML.jpg)


    Figure 4-2


    Linking search terms to product catalog


    ## Search Queries and Machine Learning


    It is important to note that search queries are often brief, with nearly 45% containing
    fewer than three words. This observation is based on the author’s review of search
    data from an Indian ecommerce platform during a specific period. This suggests
    a significant proportion of buyers might be browsing or exploring the platform
    rather than having a clearly defined search intent. As a result, query classification
    models may encounter limitations in terms of accuracy for these shorter queries.
    Even for brief search queries, BERT and other transformer-based deep learning
    models can effectively classify search terms into relevant product categories.
    These models excel because they utilize not just the words themselves but also
    the semantic meaning behind the queries.


    Additionally, ecommerce platforms leverage in-session clicks and previous searches
    to refine and improve search results, including query classifications. For example,
    if a user frequently clicks on electronics when searching for “Apple,” the system
    may infer that the user is referring to the brand. In contrast, a search for “custard
    apple” would be categorized differently based on contextual clues.


    ***Case Study: Search Term Classification Model***


    ***Context**: An ecommerce platform has three levels of taxonomy to organize apparel
    products. For example, Level 1 is Apparel/Footwear/Home/Beauty and each of the
    Level 1 (e.g., Apparel) will have Level 2 (e.g., Indian Wear, Western Wear, etc.).
    Each of the L2 will have multiple Level 3 categories. There were 3000+ Level 4
    combinations.*


    *All search queries that are not direct brand or category searches, were required
    to be linked to the taxonomy or category hierarchy to improve product matching.*


    ***Objective**: Develop a transformer-based text classification model that links
    each of the search queries to the relevant category hierarchy. This is a multi-label
    classification task.*


    ***Approach**: For the normalized or processed search queries, the category labels
    were assigned based on the click data. If most of the products clicked are related
    to a single category level, assign them as the correct level. High level logic
    used is explained below.*


    *For example, if a search query is linked to over 30% of the clicked products
    related to the single Level 4 value, only that Level 4 and corresponding Level
    3, Level 2 and Level 1 are considered for the label. If clicked products are across
    multiple Level 4, then only Level 3 will be considered.*


    *This process of finding 30% of clicked contributions is started with Level 4,
    but repeated at Level 3 and upward. If over 30% of the products are clicked for
    a particular Level 2, then that level 2 and corresponding L1 will be assigned
    for the label. The process is repeated for Level 1 in the similar way.*


    *Tshirt For Women – > Level 1: Apparel: Level 2: Women Level 3: western wear Level
    4: T Shirt*


    *Woman Dresses – > Level 1: Apparel: Level 2: Women*


    *Once the label dataset is created, a transformer based pre-trained model is used
    for developing the text classification. But the dataset was skewed for some of
    the most shopped or searched categories. To make the dataset balanced, based on
    the product catalog, a list of synthetic search queries were created for the categories
    with lower count of organic search queries.*


    *Model Validation: The trained query classification model was validated on the
    hold out sample and precision, recall, and F1 score values were used for performance
    evaluation.*


    While Jose knew exactly what he wanted and entered a specific search query, it’s
    important to remember that buyer personas based on ecommerce search behavior vary
    greatly.'
  trans: '

    ## 概述


    何塞是一名热爱跑步的人，经常参加班加罗尔的赛事，他需要一双新鞋。和无数其他消费者一样，何塞转向网络来研究他的下一次购买。统计数据显示，相当大比例的买家在访问电商平台之前，会先通过在线搜索来决定要购买的产品[1]。何塞很清楚自己想要什么，他在一家印度热门电商平台的搜索栏中输入了“Adidas
    Men Trainers Running Shoes”，准备开始他的购物之旅。图 4-1 展示了一个电商网站搜索栏的示例。电商平台的移动应用程序上也提供了类似的搜索栏。


    ![](img/630035_1_En_4_Fig1_HTML.jpg)


    图 4-1


    电商搜索


    电商搜索在这些平台中扮演着关键角色，它允许用户在数十亿件商品中导航，找到他们需要的东西。它是销售的重要推动力，与其他渠道相比，它产生的交易占比最大[2]。通常，在时尚电商平台上，20-30%
    的买家每次会话至少使用一次搜索功能，但值得注意的是，他们贡献了总销售额（GMV）的很大一部分（50-60%）。这些精通搜索的买家通常有明确的购买意图，其转化率是平台平均转化率的
    2-3 倍。除了对转化率和整体价值的影响之外，一个有效的搜索功能还能在电商平台上创造无缝且引人入胜的买家体验。因此，搜索是平台策略和用户参与度的关键组成部分。


    当何塞在搜索栏中输入“Adidas Men Trainers Running Shoes”并按下回车键时，电商平台的搜索算法立即启动。搜索算法将搜索查询词与商品标题和描述进行匹配，并显示包含这些搜索词的商品列表。这种方法被称为精确文本匹配。


    电商中的搜索功能已经取得了长足的进步。它从基本的文本匹配发展到高级的语义搜索，如今则由生成式人工智能驱动。


    一个电商平台可能提供数百万种商品。将每一件商品的标题和描述与何塞的查询词（“Adidas Men Trainers Running Shoes”）进行比较，效率会极其低下。这种方法会导致搜索响应时间非常慢，严重影响客户体验。既然何塞的查询明确表明他在寻找鞋子，那么就没有必要检查其他类别（如服装）来匹配商品。


    电商平台依赖商品类别层级结构（也称为分类法）来将数百万种商品组织成清晰、不同的组别。这些分类法对于浏览和导航至关重要。然而，搜索查询本身往往无法完美地归入这些预定义的类别。一种方法是根据关键词对搜索进行分类。但是，由于客户使用各种各样的搜索词，并且他们在搜索查询中通常使用非正式语言，因此管理基于规则的手动分类会变得复杂[3]。


    为了克服这些限制，电商平台利用基于机器学习的查询分类模型。这些模型充当智能分类器，分析诸如“Adidas Men Trainers Running Shoes”之类的搜索查询词，并预测最相关的商品类别和品牌信息。这使得搜索算法能够高效地将何塞的查询与目录中最相关的商品进行匹配，从而显著提高搜索响应时间和整体用户体验。


    图 4-2 说明了将搜索词链接到目录商品的高级流程。


    ![](img/630035_1_En_4_Fig2_HTML.jpg)


    图 4-2


    将搜索词链接到商品目录


    ## 搜索查询与机器学习


    需要注意的是，搜索查询通常很简短，近 45% 的查询包含少于三个词。这一观察结果基于作者对特定时期内某印度电商平台搜索数据的审查。这表明相当大比例的买家可能是在浏览或探索平台，而不是有明确的搜索意图。因此，对于这些较短的查询，查询分类模型在准确性方面可能会遇到限制。即使是简短的搜索查询，BERT
    和其他基于 Transformer 的深度学习模型也能有效地将搜索词分类到相关的商品类别中。这些模型表现出色，因为它们不仅利用了词语本身，还利用了查询背后的语义含义。


    此外，电商平台利用会话内的点击和之前的搜索来优化和改进搜索结果，包括查询分类。例如，如果用户在搜索“Apple”时频繁点击电子产品，系统可能会推断该用户指的是该品牌。相比之下，搜索“custard
    apple”则会根据上下文线索被归入不同的类别。


    ***案例研究：搜索词分类模型***


    ***背景**：一个电商平台使用三个级别的分类法来组织服装商品。例如，第一级是服装/鞋类/家居/美妆，每个第一级（例如，服装）下会有第二级（例如，印度服饰、西式服饰等）。每个第二级下又有多个第三级类别。总共有
    3000 多种第四级组合。*


    *所有非直接品牌或类别搜索的查询，都需要链接到分类法或类别层级结构，以改进商品匹配。*


    ***目标**：开发一个基于 Transformer 的文本分类模型，将每个搜索查询链接到相关的类别层级结构。这是一个多标签分类任务。*


    ***方法**：对于规范化或处理过的搜索查询，根据点击数据分配类别标签。如果点击的大部分商品都与单个类别层级相关，则将其分配为正确的层级。下面解释所使用的高级逻辑。*


    *例如，如果一个搜索查询链接到的点击商品中，超过 30% 与单个第四级值相关，则仅将该第四级及其对应的第三级、第二级和第一级视为标签。如果点击的商品分布在多个第四级中，则仅考虑第三级。*


    *这个寻找 30% 点击贡献的过程从第四级开始，但在第三级及更高级别重复进行。如果某个特定第二级的商品被点击超过 30%，则将该第二级及其对应的第一级分配给标签。该过程以类似方式对第一级重复进行。*


    *Tshirt For Women – > 第一级：服装：第二级：女装 第三级：西式服饰 第四级：T 恤*


    *Woman Dresses – > 第一级：服装：第二级：女装*


    *一旦创建了标签数据集，就使用基于 Transformer 的预训练模型来开发文本分类。但数据集对于某些最常购买或搜索的类别存在偏差。为了使数据集平衡，根据商品目录，为自然搜索查询数量较少的类别创建了一系列合成搜索查询。*


    *模型验证：在保留样本上对训练好的查询分类模型进行了验证，并使用精确率、召回率和 F1 分数值进行性能评估。*


    虽然何塞很清楚自己想要什么，并输入了具体的搜索查询，但重要的是要记住，基于电商搜索行为的买家画像差异很大。

    '
- fmt: '# 电子商务搜索中的查询理解与命名实体识别


    与 Jose 的精准搜索不同，考虑另一位用户 Rashmi，她是一位家庭主妇，正在为即将在公寓举办的活动做准备。她需要一件纱丽，但在做出购买决定之前想探索各种选择。与
    Jose 不同，Rashmi 代表了很大一部分电子商务客户，他们已决定购买某个产品类别，但希望在该类别内获得更广泛的选择。为了满足她的需求，Rashmi 使用了更具探索性的搜索查询：“`Orange
    Sarees Price less than 2000`”。此搜索反映了她希望在特定价格范围内浏览各种橙色纱丽的愿望。


    虽然查询分类模型可以有效地将 Rashmi 的搜索查询（“`Orange Sarees Price less than 2000`”）路由到更广泛的“`Apparel`”部分中的“`Saree`”类别，但挑战依然存在。产品标题和描述可能并不总是明确提及用户心目中的价格或颜色。在文本匹配中准确捕捉价格意图可能特别困难。


    除了对搜索查询进行分类之外，查询理解对于电子商务平台也至关重要。这涉及提取关键实体，如品牌、价格、颜色和其他属性。然而，由于搜索查询的多样性，这个过程可能具有挑战性。


    自然语言处理（`NLP`）通过一种称为命名实体识别（`NER`）的强大技术提供了解决方案。`NER` 就像一个智能解码器，从搜索词中识别和提取相关实体。在时尚电子商务中，`NER`
    模型可以被训练来识别更广泛的、对产品搜索至关重要的实体，包括产品类型（如“`saree`”）、品牌名称、颜色（如“`orange`”）、材质、性别、场合和风格。


    图 [4-3](#630035_1_En_4_Chapter.xhtml#Fig3) 说明了在电子商务搜索查询中识别出的不同实体。


    ![](images/630035_1_En_4_Chapter/630035_1_En_4_Fig3_HTML.jpg)


    **图 4-3** 从搜索查询中提取实体


    对于电子商务搜索，通常利用基于深度学习的预训练模型来构建高效的 `NER` 模型 [[4](#630035_1_En_4_Chapter.xhtml#CR4)]。诸如
    `BERT` 之类的命名实体识别（`NER`）模型在特定于电子商务的自定义数据集上进行训练，以提高其准确性和有效性。准备这些自定义标记数据集可能很耗时，但它能显著改善搜索过程。例如，像“`Apple`”这样的词在某些上下文中可能被识别为品牌，而在其他上下文中则被识别为类别。此外，某些词的变体可能指的是品牌名称，而不是拼写纠正。


    在此场景中，提取了颜色为“`Orange`”和价格低于 2000 的属性。搜索算法在将匹配结果分享给用户（Rashmi）之前，会使用这些属性来应用过滤条件。


    图 [4-4](#630035_1_En_4_Chapter.xhtml#Fig4) 说明了用于将搜索词映射到目录产品的命名实体识别（`NER`）和分类模型的序列。


    ![](images/630035_1_En_4_Chapter/630035_1_En_4_Fig4_HTML.jpg)


    **图 4-4** 从搜索到匹配产品的步骤


    搜索词可以有多种写法，举几个例子：“`Orange sarees below 200`”、“`Orange saree less than 2k`”、“`Orange
    color sarees under 2000`”、“`Saree orange color price below 2000`”、“`Orang Sarees
    for under 2000`”、“`Orange Saree below 2000`”、“`Buy orange saree less than 2000`”、“`Orange
    Sarees < 2000`”、“`2000 below orange saree`”、“`Looking for orange saree < 2000`”。


    搜索可能因单复数、顺序变化、缩写（`2000` 与 `2k`）、拼写错误、使用符号（`<` 表示小于）、拼写变体（如 `sari` 与 `saree` 或
    `color` 与 `colour`）、同义词（`orange` 与 `saffron`）以及更多原因而产生差异。此外，搜索词中可能还存在特殊字符和其他问题。


    在网络搜索中，有 10-15% 的查询是拼写错误的 [[5](#630035_1_En_4_Chapter.xhtml#CR5)]，而对于电子商务搜索，有大量搜索查询是拼写错误的。搜索引擎也会考虑同义词来改进搜索。例如，搜索“`sneakers`”可能还会包含“`athletic
    shoes`”或“`trainers`”的结果。


    搜索词在输入 `NER` 和分类模型之前会经过处理，涉及的处理步骤包括：规范化（转换为小写并移除特殊字符）、词干提取/词形还原（将单词还原为其词根形式，例如
    `running` 变为 `run` 或 `sarees` 变为 `saree`）、拼写纠正（例如 `orang sarees` 变为 `orange sarees`）以及停用词移除（例如移除
    `the`、`an` 或 `for`）。


    在电子商务搜索中，处理后的搜索查询会被考虑用于规范化。查询规范化涉及根据查询的语义含义或点击的目标产品对查询进行分组。此过程识别这些产品之间的相似性。使用产品和类别特征，通过对查询创建的嵌入向量进行
    `K-Means` 聚类，将搜索查询聚类，从而实现更准确和相关的搜索结果。


    处理后的查询经过查询分类和 `NER` 模型，提取出用于产品过滤所需的信息。查询分类模型识别出相关的产品类别：“`Saree`”。而 `NER` 成功提取了关键属性：在此示例中为价格
    `<= 2000` 和颜色 `= "Orange"`。


    ## 案例研究：使用 Transformer 模型的自定义 NER


    **背景**：当客户在搜索查询中使用某些关键词或短语时，他们正在寻找特定的产品。例如，“`Vero Moda Floral Dresses`”查询包含三个特定的用户意图——品牌、图案以及产品类型或类别。管理业务规则或逻辑变得复杂。需求是迁移到基于机器学习的系统。


    **目标**：从搜索查询中提取品牌、颜色、类别和价格实体。


    **方法**：


    电子商务中的一些挑战是歧义性，`AND` 是品牌，但它可能被视为停用词；`w` 是另一个品牌，作为一个单字母词。此外，一些特殊字符或数字是品牌名称的一部分，例如
    `Forever 21`。


    基于过去 90 天的数据，提取了最频繁的 10 万个搜索查询。从这些查询中，排除了那些直接是品牌或类别查询的单词或双词查询。


    对于剩余的搜索查询（约 6 万个），使用基于逻辑的自动化和人工审核框架来创建标签数据。例如，在搜索查询“`Biba Green Kurta Set`”中。


    图 [4-5](#630035_1_En_4_Chapter.xhtml#Fig5) 说明了如何定义实体以创建用于训练 `NER` 模型的标记数据。


    ![](images/630035_1_En_4_Chapter/630035_1_En_4_Fig5_HTML.jpg)


    **图 4-5** 搜索查询中的实体


    用于训练的最终类别是 `S-Brand`、`I-Brand`、`S-Color`、`S-Category`、`I-Category`、`I-Price`。


    一旦有了用于训练自定义 `NER` 的标记数据集，首先在目录数据集上训练一个预训练的 Transformer 模型 `ALBERT`，以便模型能够推断电子商务的上下文。然后，使用交叉熵损失函数针对
    `NER` 标签对模型进行微调。


    ## 验证与评估


    该模型使用分类指标（如召回率（提取的所有相关实体的百分比）和精确率（识别出的正确实体的百分比））在 20% 的测试样本上进行了验证，两个指标均超过 90%。此外，对每日搜索查询进行了规范化，并在排除了品牌或类别名称等直接搜索后，选择了
    5000 个查询样本。由于没有自动化的方法为每个查询中的实体打标签，因此进一步在新数据上评估了该模型，这些新数据包括排除直接搜索词后最常出现的 5000 个查询。'
  raw: 'In contrast to Jose’s targeted search, consider another user, Rashmi, a homemaker
    planning for an upcoming function at her apartment. She needs a saree but wants
    to explore various options before making a purchase decision. Unlike Jose, Rashmi
    represents a significant portion of ecommerce customers who are decided on a product
    category but seek a wider selection within that category. To fulfill her need,
    Rashmi utilizes a more exploratory search query: “Orange Sarees Price less than
    2000.” This search reflects her desire to browse a variety of orange sarees within
    a specific price range.


    While a query classification model can effectively route Rashmi’s search query
    (“Orange Sarees Price less than 2000”) to the “Saree” category within the broader
    “Apparel” section, challenges remain. Product titles and descriptions might not
    always explicitly mention the price or color a user has in mind. Accurately capturing
    price intent within text matches can be particularly difficult.


    Beyond classifying search queries, query understanding is crucial for ecommerce
    platforms. This involves extracting key entities like brands, prices, colors,
    and other attributes. This process, however, can be challenging due to the varied
    nature of search queries.


    Natural Language Processing (NLP) comes to the rescue with a powerful technique
    called Named Entity Recognition (NER). NER acts like an intelligent decoder, identifying
    and extracting relevant entities from search terms. In fashion ecommerce, NER
    models could be trained to recognize a wider range of entities critical for product
    searches, including product type (like “saree”), brand name, color (like “orange”),
    material, gender, occasion, and style.


    Figure [4-3](#630035_1_En_4_Chapter.xhtml#Fig3) illustrates the different entities
    identified within an ecommerce search query.


    ![](images/630035_1_En_4_Chapter/630035_1_En_4_Fig3_HTML.jpg)


    Figure 4-3


    Extracting entities from search query


    For ecommerce search, deep learning-based pre-trained models are commonly leveraged
    to build highly effective NER models [[4](#630035_1_En_4_Chapter.xhtml#CR4)].
    Named Entity Recognition (NER) models, such as BERT, are trained on custom datasets
    specific to ecommerce to enhance their accuracy and effectiveness. Preparing these
    custom-labeled datasets can be time-consuming, but it significantly improves the
    search process. For instance, a word like “Apple” might be identified as a brand
    in some contexts and as a category in others. Additionally, certain word variations
    may refer to brand names rather than spelling corrections


    In this scenario, color as “Orange” and price as less than 2000 is extracted.
    Search algorithms use these attributes for applying filter conditions before sharing
    the matched results to the user – Rashmi.


    Figure [4-4](#630035_1_En_4_Chapter.xhtml#Fig4) illustrates the sequence of Named
    Entity Recognition (NER) and classification models used to map search terms to
    catalog products.


    ![](images/630035_1_En_4_Chapter/630035_1_En_4_Fig4_HTML.jpg)


    Figure 4-4


    Steps from search to matched products


    The search term can be written in various ways and a few examples are – “Orange
    sarees below 200,” “Orange saree less than 2k,” “Orange color sarees under 2000,”
    “Saree orange color price below 2000,” “Orang Sarees for under 2000,” “Orange
    Saree below 2000,” “Buy orange saree less than 2000,” “Orange Sarees < 2000,”
    “2000 below orange saree,” “Looking for orange saree < 2000.”


    The search can be due to singular vs. plural, sequence variation, abbreviation
    (2000 vs. 2k), spelling mistakes, using symbol (< for less than), spelling variations
    (such as sari vs. saree or color vs. colour), synonyms (orange vs. saffron), and
    many more Also, there may be special characters and other issues with search terms.


    10-15% of queries are misspelled [[5](#630035_1_En_4_Chapter.xhtml#CR5)] in web
    search, and for ecommerce search, a significant volume of search queries are misspelled.
    Search engines also consider synonyms to improve search. For example, a search
    for “sneakers” might also include results for “athletic shoes” or “trainers.”


    Search terms are processed before feeding into NER and classification models,
    and the processing steps involved are normalization (converting lowercase and
    remove special characters), stemming/lemmatization (reducing words to their root
    form, e.g., running to run or sarees to saree), spelling correction (e.g., orang
    sarees to orange sarees) and stop word removal (e.g., removing the, an, or for).


    In ecommerce search, the processed search queries are considered for normalization.
    Query normalization involves grouping queries based on their semantic meaning
    or the target products clicked. This process identifies similarities across these
    products. Using product and category features, search queries are clustered with
    K-Means clustering on embedding vectors created for the queries, allowing for
    more accurate and relevant search results.


    The processed query goes through query classification and NER models, and the
    required information for product filtering is extracted. The query classification
    model identifies the relevant product category: “Saree.” And NER successfully
    extracts key attributes: price <= 2000 and color=”Orange” in this example.


    ***Case Study: Custom NER using Transformer Model***


    ***Context**: When customers are using certain keywords or phrases in the search
    query they are looking for specific products. For example, “Vero Moda Floral Dresses”
    query has three specific user intents – brand, pattern, and product type or category.
    Managing business rules or logics, it became complicated to manage. Requirement
    is to migrate to a Machine Learning based system.*


    ***Objective**: Extract Brand, Color, Category and Price entities from the search
    queries.*


    ***Approach**:*


    *Some of the challenges in ecommerce is ambiguity, AND is brand vs. it could be
    considered as a stop word, w is another brand as a single letter. Also some special
    characters or numbers are part of the brand names such as Forever 21.*


    *Based on the last 90 days, the most frequent 100k search queries are extracted.
    From these queries, the single word or two word queries that are direct brand
    or category queries are excluded.*


    *For the remaining search queries (~60k), the logic-based automated and manual
    review-based framework is used to create the label data. For example, in the search
    query “Biba Green Kurta Set.”*


    *Figure* [*4-5*](#630035_1_En_4_Chapter.xhtml#Fig5) *illustrates how entities
    are defined to create labeled data for training NER models.*


    ![](images/630035_1_En_4_Chapter/630035_1_En_4_Fig5_HTML.jpg)


    Figure 4-5


    Entities in search query


    *The final classes used for the training are S-Brand, I-Brand, S-Color, S-Category,
    I-Category, I-Price.*


    *Once the labeled dataset is available for training a custom NER, a pre-trained
    transformer model, ALBERT, was first trained on the catalog dataset so that the
    model is able to infer the context of ecommerce. The model is then fine-tuned
    with a cross entropy loss function for the NER labels.*


    ***Validation and Evaluation***


    The model was validated using classification metrics such as recall (the percentage
    of all relevant entities extracted) and precision (the percentage of identified
    entities that are correct) on a 20% test sample, with both metrics exceeding 90%.
    Additionally, daily search queries were normalized, and a sample of 5000 queries
    was selected after excluding direct searches like brand or category names. As
    there is no automated method for labeling entities in each query, the model was
    further evaluated on new data, which included the top 5000 most frequently occurring
    queries, excluding direct search terms.'
  trans: '

    与 Jose 的目标明确型搜索不同，另一位用户 Rashmi 是一位家庭主妇，正在为即将在家中举办的聚会做准备。她需要一件纱丽，但希望在做出购买决定前探索各种选择。与
    Jose 不同，Rashmi 代表了相当一部分电商客户：他们已确定产品类别，但希望在该类别内获得更广泛的选择。为了满足需求，Rashmi 使用了更具探索性的搜索查询：“橙色纱丽
    价格低于 2000”。这一搜索反映了她希望在特定价格范围内浏览各种橙色纱丽的意愿。


    虽然查询分类模型可以有效地将 Rashmi 的搜索查询（“橙色纱丽 价格低于 2000”）路由到“服装”大类下的“纱丽”类别，但挑战依然存在。产品标题和描述可能并不总是明确提及用户心目中的价格或颜色。在文本匹配中准确捕捉价格意图可能尤为困难。


    除了对搜索查询进行分类，查询理解对于电商平台也至关重要。这涉及提取品牌、价格、颜色和其他属性等关键实体。然而，由于搜索查询的多样性，这一过程可能充满挑战。


    自然语言处理（NLP）提供了一种名为命名实体识别（NER）的强大技术来解决这个问题。NER 就像一个智能解码器，能够从搜索词中识别并提取相关实体。在时尚电商领域，NER
    模型可以经过训练，识别对产品搜索至关重要的更广泛的实体，包括产品类型（如“纱丽”）、品牌名称、颜色（如“橙色”）、材质、性别、场合和风格。


    图 4-3 展示了在电商搜索查询中识别出的不同实体。


    ![](img/630035_1_En_4_Fig3_HTML.jpg)


    图 4-3


    从搜索查询中提取实体


    对于电商搜索，通常利用基于深度学习的预训练模型来构建高效的 NER 模型[4]。诸如 BERT 之类的命名实体识别（NER）模型，会在电商特定的自定义数据集上进行训练，以提高其准确性和有效性。准备这些自定义标记数据集可能很耗时，但这能显著改善搜索过程。例如，“Apple”这个词在某些上下文中可能被识别为品牌，而在其他上下文中则被识别为类别。此外，某些词的变体可能指的是品牌名称，而非拼写纠正。


    在此场景中，提取出了颜色为“橙色”和价格低于 2000 的信息。搜索算法在向用户 Rashmi 展示匹配结果之前，会使用这些属性来应用过滤条件。


    图 4-4 展示了用于将搜索词映射到目录产品的命名实体识别（NER）和分类模型的序列。


    ![](img/630035_1_En_4_Fig4_HTML.jpg)


    图 4-4


    从搜索到匹配产品的步骤


    搜索词可以有多种写法，例如：“Orange sarees below 200”、“Orange saree less than 2k”、“Orange color
    sarees under 2000”、“Saree orange color price below 2000”、“Orang Sarees for under
    2000”、“Orange Saree below 2000”、“Buy orange saree less than 2000”、“Orange Sarees
    < 2000”、“2000 below orange saree”、“Looking for orange saree < 2000”。搜索可能因单复数、词序变化、缩写（2000
    vs. 2k）、拼写错误、使用符号（< 表示小于）、拼写变体（如 sari vs. saree 或 color vs. colour）、同义词（orange
    vs. saffron）以及更多情况而产生差异。此外，搜索词中可能还存在特殊字符和其他问题。


    在网络搜索中，10-15%的查询存在拼写错误[5]，而在电商搜索中，拼写错误的搜索查询占比很大。搜索引擎也会考虑同义词来改善搜索。例如，搜索“sneakers”可能也会包含“athletic
    shoes”或“trainers”的结果。


    搜索词在输入 NER 和分类模型之前会经过处理，涉及的处理步骤包括：规范化（转换为小写并移除特殊字符）、词干提取/词形还原（将单词还原为其词根形式，例如 running
    变为 run，sarees 变为 saree）、拼写纠正（例如 orang sarees 变为 orange sarees）以及停用词移除（例如移除 the、an、for）。


    在电商搜索中，处理后的搜索查询会被考虑用于规范化。查询规范化涉及根据查询的语义含义或点击的目标产品对查询进行分组。此过程识别出这些产品之间的相似性。利用产品和类别特征，通过对查询创建的嵌入向量进行
    K-Means 聚类，将搜索查询聚类，从而获得更准确、更相关的搜索结果。


    处理后的查询会经过查询分类和 NER 模型，并提取出用于产品过滤所需的信息。查询分类模型识别出相关的产品类别：“纱丽”。而 NER 成功提取了关键属性：价格
    <= 2000 和颜色=“橙色”。


    ***案例研究：使用 Transformer 模型的自定义 NER***


    ***背景**：当客户在搜索查询中使用某些关键词或短语时，他们是在寻找特定产品。例如，“Vero Moda Floral Dresses”这个查询包含三个特定的用户意图——品牌、图案以及产品类型或类别。管理业务规则或逻辑变得复杂。需要迁移到基于机器学习的系统。*


    ***目标**：从搜索查询中提取品牌、颜色、类别和价格实体。*


    ***方法**：*


    *电商面临的一些挑战包括歧义性，例如 AND 是品牌，但也可能被视为停用词；w 是另一个品牌，仅为一个字母。此外，一些特殊字符或数字是品牌名称的一部分，例如
    Forever 21。*


    *基于过去 90 天的数据，提取了最频繁的 10 万个搜索查询。从这些查询中，排除了那些直接是品牌或类别查询的单个词或两个词的查询。*


    *对于剩余的搜索查询（约 6 万个），使用基于逻辑的自动化和人工审核相结合的框架来创建标签数据。例如，在搜索查询“Biba Green Kurta Set”中。*


    *图**4-5**说明了如何定义实体以创建用于训练 NER 模型的标签数据。*


    ![](img/630035_1_En_4_Fig5_HTML.jpg)


    图 4-5


    搜索查询中的实体


    *用于训练的最终类别是 S-Brand、I-Brand、S-Color、S-Category、I-Category、I-Price。*


    *一旦有了用于训练自定义 NER 的标记数据集，首先在目录数据集上训练一个预训练的 Transformer 模型 ALBERT，以便模型能够推断电商的上下文。然后，使用针对
    NER 标签的交叉熵损失函数对模型进行微调。*


    ***验证与评估***


    该模型在 20%的测试样本上使用召回率（提取出的所有相关实体的百分比）和精确率（识别出的实体中正确的百分比）等分类指标进行了验证，两项指标均超过 90%。此外，对每日搜索查询进行了规范化，并在排除了品牌或类别名称等直接搜索后，选取了
    5000 个查询样本。由于没有自动化的方法为每个查询中的实体打标签，因此在新数据上对模型进行了进一步评估，这些新数据包括排除直接搜索词后出现频率最高的前 5000
    个查询。

