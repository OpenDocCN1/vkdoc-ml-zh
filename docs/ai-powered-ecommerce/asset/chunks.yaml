  trans: '

    ## 语义搜索


    Rashmi 在搜索橙色纱丽时，会使用诸如“藏红花色纱丽”或“姜黄色纱丽”之类的词语。这凸显了电商搜索中的一个常见挑战：搜索查询的多种变体。在一个平台上，搜索“橙色纱丽”会得到
    1877 个结果，而“藏红花色纱丽”仅显示 1 个结果，“姜黄色纱丽”则没有结果。这种不一致性体现了产品标签化面临的挑战。


    有趣的是，另一个平台能够识别“姜黄”，并在搜索“姜黄色纱丽”时显示黄色纱丽（超过 3000 个结果中的第 1–48 个）。图 4-10 展示了该搜索结果的示例输出。


    ![](img/630035_1_En_4_Fig10_HTML.jpg)


    图 4-10


    语义搜索结果


    电商搜索的关键挑战在于，用户经常在搜索查询中使用非正式语言，而产品标题和描述往往采用更正式的文体。这造成了词汇鸿沟，可能阻碍搜索的准确性 [3]。诸如词干提取和词形还原之类的技术用于匹配具有相似词根的词汇（例如，将“reading
    glasses”匹配到“reading glass”），但这可能导致信息丢失和错误。同样，拼写纠正方法也未必总能捕捉到用户查询中的所有打字错误或拼写错误。这可能导致搜索结果不佳，与用户意图不符
    [7]。


    语义搜索算法融合了搜索词的意图和上下文，以匹配搜索词与产品目录。例如，语义搜索引擎会解释“鞋带”和“系带鞋”这类搜索词。语义搜索架构能够有效处理上义词、同义词、反义词、词形变体和拼写错误
    [7, 8]。


    语义搜索框架依赖于嵌入空间中的稠密向量来捕捉搜索查询和产品的上下文含义。深度学习方法将产品信息转换为这些向量，然后存储起来以供后续检索 [9]。


    类似地，用户的搜索查询也会被转换并存储为向量。最后，当用户输入搜索查询时，系统会将其链接到对应的已存储搜索查询向量，并与产品向量进行比较以识别匹配项。


    RoBERTa 和其他 Transformer 模型在用于创建产品和搜索查询嵌入之前，会针对电商语境进行专门的微调。此微调过程涉及调整模型以理解电商语言和买家行为的细微差别。这些模型生成的嵌入随后用于将新的买家搜索词链接到相关产品，从而提高搜索结果的准确性和相关性。


    图 4-11 展示了使用语义搜索框架将搜索查询与产品匹配所涉及的逻辑步骤。


    ![](img/630035_1_En_4_Fig11_HTML.jpg)


    图 4-11


    语义搜索步骤


    语义搜索算法的三大主要类别 [3]：


    1.  **因子化模型**：这些模型根据搜索查询和产品的内容，独立地将它们转换为低维向量表示（称为嵌入）。这些嵌入捕捉了查询和文档或产品的语义含义，从而实现更准确的语义匹配。


    2.  **潜在因子模型 (LFM)**：潜在因子模型 (LFM) 使用矩阵分解技术来揭示词语与产品（或文档）之间的隐藏关系，而无需直接分析其内容。通过将交互矩阵分解为潜在因子，LFM
    可以揭示潜在的模式和关联。例如，奇异值分解 (SVD) 或非负矩阵分解 (NMF) 等技术可以识别这些潜在因子，这有助于基于隐式交互（而非显式内容分析）来理解和预测买家偏好及产品相似性。


    3.  **交互模型**：交互模型在查询与产品详情（例如，标题和描述文本）之间构建交互矩阵。这些模型使用深度学习模型捕捉查询词与产品详情之间的复杂交互，从而实现更细致的语义匹配。


    ## 用于搜索嵌入的深度学习


    创建搜索查询和产品的向量表示（嵌入）有两种深度学习方法：无监督方法和有监督方法。


    这篇研究论文 [3] 中详细介绍了推荐的有监督方法，该方法利用了一个名为 RoBERTa 的基于 Transformer 的模型。此过程包括两个阶段：


    *   **预训练**：RoBERTa 模型首先在一个大型时尚相关文本数据集（语料库）上进行训练。这种初始训练使模型具备了理解搜索领域相关语言的坚实基础。


    *   **微调**：接下来，模型使用一种称为三元组损失优化的技术进行微调。此方法旨在实现两个目标：减少搜索查询与用户点击产品（视为正匹配）之间的距离，并增加搜索查询与用户未点击的随机产品（视为负匹配）之间的距离。


    微调这些模型需要标注数据，以指示哪些产品与搜索相关，哪些不相关。点击数据在此过程中至关重要，因为它有助于识别正例（买家与之交互的产品）和负例（用户未参与的产品）。搜索后点击某个产品列表表示正匹配，而点击不相关的列表或根本没有点击则表示负匹配。例如，当买家搜索“红色连衣裙”时，被点击的产品被视为正样本，而未点击或不相关的产品则被视为负样本。这种区分有助于训练模型根据用户交互更好地区分相关和不相关的产品。此外，作者建议在定义用于训练/微调预训练模型的正负样本时，引入“窄”查询与“宽”查询的概念。


    最后，通过这个微调模型学习到的查询嵌入和产品嵌入，用于在买家输入搜索查询时检索相关产品。查询嵌入本质上充当了一个参考点，用于在产品目录中查找具有相似含义和特征的产品。

    '
- fmt: '# Conversational Search – Powered by Gen AI


    Current search architecture delivers well for the transactional searches and the
    browse searches. Transactional search involves users who know exactly what they’re
    looking for. For example, a user searching for “printed sarees below 2000” has
    a clear idea of the product and price range. And when users are exploring a particular
    product category but haven’t yet settled on a specific product, it is called the
    “browse searches.” For instance, a user searching for “sarees” might be browsing
    for designs and patterns before deciding on the purchase.


    The current search architecture might have limitations when it comes to inspirational
    searches, where customers are actively seeking ideas and inspiration to inform
    their purchase decisions. For example, a customer searching for “Gift for a toddler
    birthday” or “Dress for a wedding” is looking for product ideas that fit a specific
    context. The current search might struggle to deliver on these broader suggestions,
    potentially limiting itself to exact keyword matches. Ideally, the search engine
    should recommend products and even across categories to provide a more comprehensive
    set of inspirational options.


    Ecommerce platforms are seeing a surge in “digital window shoppers,” similar to
    their brick-and-mortar counterparts. These customers have the time and inclination
    to explore the online world, browsing for new trends and product categories. They
    might be regular visitors to the platform, but their purchases occur less frequently.
    The current search architecture faces limitations when it comes to inspirational
    search and engaging digital window shoppers.


    The current search architecture may fall short for inspiration-based searches
    as it is typically limited to a few specific categories. Both text matching and
    semantic search approaches focus on matching text rather than understanding the
    context or linking products to their usage or applications. Additionally, product
    catalogs often lack updated information on when and how to use products or their
    utility. For instance, catalog descriptions might only include basic details like
    titles or materials, without indicating that silk sarees are more suitable for
    special occasions, while cotton prints might be preferred by the older adults
    and for summer conditions.


    Emerging technologies like conversational search offer a promising solution to
    these challenges. Flipkart, a leading ecommerce in India, launched ChatGPT powered
    chatbot named Flippi in late 2023 and aims to help buyers who face challenges
    in making purchase decisions [[10](#630035_1_En_4_Chapter.xhtml#CR10)]. Flippi
    helps in finding products that suit their needs. Similarly, Amazon announced Rufus,
    a new generative AI-powered conversational shopping experience in the first quarter
    of 2024 [[11](#630035_1_En_4_Chapter.xhtml#CR11)].


    Conversational search allows users to interact with the search engine in a more
    natural, human-like way, using complete sentences and questions. The conversational
    search can include context for understanding user intent and preferences, and
    can facilitate a more open-ended exploration process, helping digital window shoppers
    discover new trends and products.


    ## Summary


    Search serves as a critical funnel for buyer engagement on ecommerce platforms.
    To create truly engaging buyer journeys, leveraging artificial intelligence (AI)
    and machine learning (ML) algorithms is fundamental. From processing search queries
    to linking search terms with products and presenting relevant results, every step
    is enhanced with AI and ML models to improve outcomes. This augmentation helps
    boost conversion rates, as more buyers complete purchases through their search
    journey, and enhances the overall buyer experience.


    Entity recognition can identify important entities within search terms and use
    them for applying filter conditions. For instance, from a search query like “women’s
    running shoes under Rs. 2000,” the algorithm might recognize “women” as the target
    audience, “running shoes” as the product category, and “Rs. 2000” as a price filter.


    Search Term Query Classification based on ML algorithms can classify search terms
    into relevant product categories, helping with efficient matching space and more
    accurate search results.


    Neural Search with Deep Learning: Advanced techniques like neural search, powered
    by deep learning frameworks, allow the system to go beyond exact keyword matching.
    It can grasp the semantic meaning behind a search query, enabling it to retrieve
    products that are conceptually relevant even if they don’t contain the exact keywords
    used by the user.


    In essence, AI and ML algorithms are transforming ecommerce search by making it
    more intelligent, efficient, and user-friendly. This translates into a more engaging
    buyer journey for online shoppers.


    Once buyers are shown the most relevant and/or personalized search results, the
    buyers explore the detailed products before adding to cart and proceed to purchase.
    On the journey, the buyers are engaged by showing complementary, similar products,
    and other products to improve engagement and cart size. These curated choices
    are powered by a family of algorithms called recommendations. In the next chapter,
    the focus shifts to understanding the similarity algorithms that drive engaging
    buyer journeys on ecommerce platforms.


    # 5. Curated Choices Using Art and Science of Recommendations'
