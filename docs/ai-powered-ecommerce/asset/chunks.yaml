- fmt: '### Challenges

    In the fashion category, inaccurate product details and a low attribute fill rate
    pose significant obstacles for a smooth buyer experience. Manually tagging products
    with a dedicated team presented scalability and consistency challenges.


    ### Solution

    Meesho’s data science team has implemented a deep learning-based architecture
    to automatically classify product images into various categories. For products
    lacking attribute information, the system extracts relevant details, streamlining
    the product tagging process.


    ### Outcome

    An Artificial intelligence based scalable product categorization process improves
    the products taxonomy and data fill rate. Deep learning methods are highly effective
    at predicting product categories based on images and other provided details, thereby
    improving the fill rate. Users often make errors in selecting the correct category
    due to various pressures and may skip non-mandatory fields. Accurate product taxonomy
    and details are crucial for the search and browsing experience, so ensuring precise
    information enhances the overall buyer experience. This saves cost and also improves
    turnaround time.


    Once products are on the platform, Maya should find a way to get business from
    these platforms as there are millions of sellers on the platform and some of the
    buyers may not be aware about the products from “Maya’s Mystic Jewellery” brand.


    Maya decides to leverage promotional and advertising functionalities to reach
    a wider audience to grow her online sales.


    There are multiple functionalities typically available for the sellers on these
    platforms such as Sponsored Products. For a selected keyword, the seller sets
    a bid amount and pays to the platform based on the number of clicks on its product
    when shown to the buyers. This is a pay-per-click (PPC) advertising program. When
    customers search for those keywords, the products will be shown. The seller can
    promote their brand via Sponsored Brands program and it features the brand logo
    and other details in the top of search results. This creates higher visibility
    and brand awareness among the platform visitors.


    Another option typically available is to show promoted products when customers
    are browsing related product categories, this drives traffic to the selected products
    and improves the purchase considerations.


    Maya can come up with the target audience for her products and the list of relevant
    keywords. She can leverage brand promotion programs to create awareness about
    the brand among her target audience as this will help in creating brand equity
    and future sales. For immediate business results, she sets a daily budget target
    and bids for ten relevant keywords.


    Sellers can get tens of orders for their products and if they can’t deliver within
    the delivery timeline, it will create bad customer experience due to order cancellations.
    The customers will give bad ratings and there may be penalty charges for the seller
    from the platform.


    The platform demands that sellers update the number of items available (inventory)
    on the platform so that it does not take more orders than the products available.
    Also, as soon as the buyer confirms the order, the order is available for the
    seller to do the next steps – pick up the product, package, and make it ready
    to hand over for delivery. This journey is typically available in the system called
    order management system (OMS). Some large-scale sellers with their own order management
    system work with the ecommerce platform to integrate these systems for faster
    and automated order detail handshake.


    ### Case Study: Prioritized Seller selection for each product


    #### Context

    On an open marketplace platform, hundreds of sellers may be selling the same products.
    Showing the same products multiple times can lead to poor customer experience.
    Leading ecommerce platforms show a single product and pull pricing details from
    one of the prominent sellers.


    #### Approach

    A fare- and performance-based seller selection is important for the marketplace
    as this has a direct impact on buyer experience and seller business. Using **seller
    performance** like average rating – higher rated seller gets higher weightage,
    time to process orders, **seller location** – a seller close to customer location
    will be prioritized due to lower days to deliver and reduced delivery cost, and
    **product details** like price (e.g., lower price is better for buyer) and inventory
    (higher inventory get higher importance) are considered for seller selection.
    These features along with machine learning algorithms help in finding the right
    seller for each of the products when multiple seller or seller stores are available.
    A common machine learning method for seller prioritization is ranking algorithms,
    which consider various factors to showcase products from top sellers.


    #### Outcome

    An automated and performance-based system to select the right seller for each
    of the products with multiple sellers or seller stores


    In addition to allocating order for processing to the seller, the system assigns
    order to courier partner. They may have multiple delivery partners (e.g., Blue
    Dart, Delhivery, XpressBees, Ecom Express, etc.) and AI/ML can enable the decision
    considering delivery timeline, logistic cost, and delivery performance features.


    Promotions for “Maya’s Mystic Jewellery” helps in getting the orders across India.
    She has a person who monitors the portal for the orders and processes these orders.
    Once the orders are packed and ready to ship, the information is updated on the
    portal. The orders are assigned to delivery partners and products are on the way
    to buyers.


    Buyers receive the products ordered on the platform and are very happy with the
    quality of products and delivery timelines. They go on the platform and write
    product reviews and give excellent ratings (5*). These products start showing
    up in organic search and category pages in the commerce platform, thanks to the
    popularity ranking (Relevance Ranking) system. The relevance ranking (or Popularity
    Ranking) is powered by ML algorithms that consider multiple factors and create
    the ranking for arranging most relevant products at the top. Machine Learning-based
    Learning to Rank (LTR) techniques and Deep Learning-based ranking methods are
    employed to enhance the accuracy and relevance of products for the buyers.


    Maya’s online store – “Maya’s Mystic Jewellery” is on the growth trajectory. She
    augments the product portfolio and also expands to other categories within the
    Jewellery segment. The main focus for her business is innovating new designs for
    her to grow the business. The technology functionalities and operational processes
    are taken care of by the ecommerce platform.


    The money from the online sales is credited to the bank account automatically
    as per settlement timeline after deducting commission charges. For example, Nykaa
    reportedly charges 25% commission on the item price [[13]](#630035_1_En_2_Chapter.xhtml#CR13),
    while Myntra’s commission rates range from 20% to 35% based on the product category
    [[14]](#630035_1_En_2_Chapter.xhtml#CR14).


    These platforms also provide sellers with key insights and analytics to better
    manage their online businesses on the ecommerce platform. These insights range
    from sales metrics, such as order volume trends, to operational metrics, such
    as return rates.


    In summary, to empower sellers on an ecommerce marketplace platform, a comprehensive
    range of functionalities is necessary, spanning from registration to financial
    settlement.


    Figure [2-6](#630035_1_En_2_Chapter.xhtml#Fig6) illustrates the functionalities
    available to sellers on an ecommerce platform, highlighting the “Sell Side” features
    of the platform.


    ![](images/630035_1_En_2_Chapter/630035_1_En_2_Fig6_HTML.jpg)


    Figure 2-6


    Key functionalities of seller-side ecommerce platform'
