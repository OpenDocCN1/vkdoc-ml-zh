- fmt: '# Reducing Customer Returns – Flagging Platform Abusers


    In addition to helping the genuine customers with right size recommendations for
    reducing returns, identifying and taking actions against platform abusers are
    equally important to reduce the returns.


    The Appriss Retail report found the returns of online purchases were worth $41
    billion in total, where 35% (about $14 billion) was return frauds [[14](#630035_1_En_8_Chapter.xhtml#CR14)].
    One report suggests that an astonishing 14% of returns have been found to be fraudulent
    [[15](#630035_1_En_8_Chapter.xhtml#CR15)].


    Increased fraudulent returns warrants ecommerce platforms to develop defense against
    these practices. A strict return policy may lead to losing customers due to unpleasant
    return experiences; hence finding fraudulent customers and transactions are important
    to action against them only and proactively.


    - **Delivery Charges on Return**: At one of the leading open marketplace platforms
    in India, based on ML model, it predicts whether a customer is likely to return
    the product, and the platform shows a message something like “If you returned,
    you will be charged shipping fee”; this is more to deter customers who have intention
    to return the product.


    - **Validate at Return Initiation**: When a customer is initiating a return journey,
    based on the predicted abuse, the platform makes it mandatory for the customer
    to upload product images. The computer vision model validates whether the product
    return is fake or genuine.


    - **QC on Reverse Pick Up**: Quality checks (QC) during reverse pickup involve
    inspecting returned products before they are collected from buyers. This process
    adds extra effort and costs for the delivery executives and the ecommerce platform.
    Implementing QC for all returns is not always feasible due to these additional
    costs. Instead, a machine learning model can optimize this process. By analyzing
    historical data on incorrect and genuine returns, the model can incorporate features
    related to buyers, products, geography, and other factors. When a buyer initiates
    a return, the model assesses whether to enable the QC flag based on these features.
    If the flag is activated, the delivery partner performs a quality check before
    pickup; otherwise, the check is omitted.


    ## Non-deliverable Orders and Return to Origin (RTO) Transactions


    5–8% of ecommerce transactions are returned to sellers due to non-delivery. Mainly,
    there are two key contributors of non-delivery of the transactions: customer intent
    issue (customers do not have any intention to accept the delivery, platform abusers)
    and bad delivery addresses.


    These faulty addresses are one of the major reasons behind RTO or Return to Origin
    losses for ecommerce businesses [[16](#630035_1_En_8_Chapter.xhtml#CR16)].


    “The economic impact of bad addresses in India is significant: Emerging World’s
    estimates from the top industries indicate that poor addresses cost India $10–14B
    annually or ~0.5% of the GDP” [[15](#630035_1_En_8_Chapter.xhtml#CR15)].


    There are a number of ways to reduce the bad addresses on the ecommerce platform.
    One option to help customers selecting address is using “Google Map”. There are
    two challenges with making it mandatory, first customers from tier 2 and tier
    3 places in India may find it challenging and the second it may adversely impact
    return rate as they may select any place. In summary, the conversion rate may
    take a hit due to additional steps in the order journey and it can make it easy
    for platform abuser to select any address to place order as they anyway do not
    intend to receive.


    Identifying risky shipping addresses can significantly reduce RTO percentage and
    improve deliverability. “Decrease chances of RTO/cancellation by up to 30%” [[16](#630035_1_En_8_Chapter.xhtml#CR16)]
    by implementing an address validation process.


    At my earlier organization, an ML-based non-deliverable address identification
    process was set up for identifying gibberish and non-deliverable addresses, leading
    to significant reduction in RTO percentage along with reduction in wrong return.
    The transactions with bad addresses were identified in near real time and shared
    for review and actions. Considering focus on customer service, only 50% of these
    transactions were actioned – cancel transaction, block the customer, or accept
    only prepaid transactions. For the other 50%, the RTO percentage was 3X with significantly
    higher returns and fake returns.


    Address is only one symptom, not all customers have wrong intentions; probably
    they are not aware of providing addresses in a correct way. Hence, customer history
    could play a significant impact factor in taking address. Customer RTO Model and
    Bad Delivery Address Model in conjunction helped in improving efficacy of identifying
    platform abusers and reducing RTO rate.


    ## Cancellations


    Order cancellation is another driver of in-efficiency for the ecommerce platform
    The higher percentage of cancellations leads to missed sell due to inventory hold
    out, payment gateway charges for prepaid orders, operational costs (Order processing,
    picking, and packaging), and logistic cost (if cancelled after hand over to courier
    partner). Cancellations also have impact on inventory information distortion,
    leading to increases in total system costs [[19](#630035_1_En_8_Chapter.xhtml#CR19)].


    The cancellations create bad seller experience due to increased costs, order processing,
    and inventory hold off.


    Based on experience, it was observed that 4–6% of the transactions were canceled
    by the customers, and over half of these transactions were cancelled within an
    hour of placing an order. Card Cancellations (within 1 hour) are one of the significant
    and incur payment charges – around 1.5% of the transaction value.


    Figure [8-9](#630035_1_En_8_Chapter.xhtml#Fig9) visualizes the prominent reasons
    for order cancellations and their relative contributions.


    ![](images/630035_1_En_8_Chapter/630035_1_En_8_Fig9_HTML.jpg)


    Figure 8-9


    Order cancellation reasons


    Longer delivery timelines or delayed delivery timelines along with product prices
    could be drivers of customers cancelling. But customers opt to select “I changed
    my mind” and “I placed an order by mistake.”


    ML Prediction for Improving Seller Experience and Cost: Once an order is confirmed
    on the ecommerce platform, the order is allocated to the seller and the seller
    operation team starts order processing. For the customers with higher chances
    of cancelling orders within an hour, the order can be put on hold for an hour
    before being assigned to the seller. This helps in reducing order processing effort
    and bad seller experience.'
