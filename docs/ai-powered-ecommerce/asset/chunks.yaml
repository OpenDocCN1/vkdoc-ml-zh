- fmt: 'The search engine efficiently retrieves all sarees from its vast product catalog
    that meet these specific criteria. This ensures a targeted selection of products
    presented to the user, improving the search experience.


    Figure [4-6](#630035_1_En_4_Chapter.xhtml#Fig6) illustrates the high-level steps
    involved in using normalized search queries to generate the final list of products
    for a search term. Buyer queries are normalized before being processed by the
    query classification model, which helps define the relevant categories for the
    search, and by the Named Entity Recognition (NER) model to extract relevant entities.
    These extracted entities are used to apply filter conditions when retrieving products
    from the catalog. Finally, all matched products are displayed to the users.


    ![](images/630035_1_En_4_Chapter/630035_1_En_4_Fig6_HTML.jpg)


    Figure 4-6


    Approach from normalized search terms to linked product list


    Rashmi searches products using search terms such as “Sarees below 2000.” When
    Rashmi gets the search result, search listing pages (SLPs), she reviews the results
    and decides to search again with a revised search term “printed sarees below 2000”
    and retrieve a list of sarees that matches the search terms.


    Figure [4-7](#630035_1_En_4_Chapter.xhtml#Fig7) displays a sample list of products
    matched to search queries.


    ![](images/630035_1_En_4_Chapter/630035_1_En_4_Fig7_HTML.jpg)


    Figure 4-7


    Search results


    In this scenario, in addition to the three steps discussed – query processing,
    query classification model, and NER model, the search needs text matching of the
    query term such as “printed” in the product title and description.


    ## Search Algorithms – Text Matching


    A heart of ecommerce search is text matching, a method to connect user queries
    with relevant products in the catalog. The domain of finding relevant products
    for a given search query is referred to as information retrieval (IR) and it has
    been studied over decades. The search queries encapsulate customer needs, and
    typically, the information retrieval fetches a collection of products for a search
    query in ecommerce.


    In the textual or lexical match, the algorithms try to match a search query with
    products and derive relevance based on the similarity. The similarity is computed
    as cosine similarity (or similar distance measure) based on frequency of search
    terms (`TF`) and inverse document frequency (`IDF`) vectors. The fundamental aspect
    of text matching, if more often the search terms are present in the product title
    and description, the higher is its relevance but these terms should also be less
    frequent across the products.


    Figure [4-8](#630035_1_En_4_Chapter.xhtml#Fig8) visually illustrates the components
    of text matching, including how search terms are linked to product details and
    the role of `BM25` in ranking the matched products.


    ![](images/630035_1_En_4_Chapter/630035_1_En_4_Fig8_HTML.jpg)


    Figure 4-8


    Text Matching - search terms and product details


    ## Text Matching : BM25 Algorithm


    Search queries are matched with product details in ecommerce systems, and many
    products might contain all the search terms. However, the relevance of these products
    can vary. For instance, if a search term appears frequently in the query or in
    multiple product descriptions, this might indicate higher relevance. Conversely,
    specific or unique terms can help in filtering out less relevant products.


    `BM25` (Best Matching 25) leverages these concepts to rank products effectively.
    It considers the frequency of matching terms and their specificity. For example,
    if a user searches for “high-performance gaming laptop,” products with frequent
    and exact matches for “gaming laptop” will be ranked higher. However, if the term
    “high-performance” appears only in a few product descriptions, those products
    will be evaluated differently compared to others where this term appears more
    frequently.


    `BM25` calculates the relevance of a product based on both term frequency and
    document length, adjusting for how often a term appears and how unique it is across
    the document corpus. This balance helps ensure that products most relevant to
    the search query are prioritized, improving the search experience for users.


    `BM25` (Best Match 25) is a common algorithm used for text matching in ecommerce
    search. This algorithm considers document length and term frequency saturation
    in addition to term frequency (`TF`) and Inverse Document Frequency (`IDF`).


    ### Term Frequency (TF)


    Term Frequency measures occurrences of search terms in product details (e.g.,
    product title and description). It is the relative frequency of search terms.
    For a search term `t` with a product `p` is the ratio of frequency of term `t`
    with the product `p` and count of words in product `p`. It suggests that higher
    occurrence of search term meaning more relevant is the product for a given search
    term. There are a few additional formulations for calculating term frequency (`TF`)
    [[9](#630035_1_En_4_Chapter.xhtml#CR9)].


    ### Inverse Document Frequency (IDF)


    Some search query terms may be very common and may not indicate any particular
    relevance for its occurrences in a given product description. Hence, inverse document
    frequency (`IDF`) is calculated and it measures how much information the search
    term provides specificity to a product. In a way, it measures how common or rare
    it is across all products, it penalizes if it is a common term.


    Typically, search platform is based on Apache Lucene and its variants such as
    Solr and Elasticsearch. The `BM25` implementation in Elasticsearch platform is
    as follows:


    ![](images/630035_1_En_4_Chapter/630035_1_En_4_Figa_HTML.jpg)


    `q[i]` is the i^(th) query term,


    `IDF(q[i])` is the inverse document frequency of the i^(th) query term,


    `f(q[i],D)` is count or frequency of i^(th) query term in document D,


    `fieldLen` is length of the field and


    `avgFieldLen` is the average field length across all the products or documents,


    `k1` and `b` are the parameters.


    Document is equivalent to product details in ecommerce. While text-matching algorithms
    like `BM25` form the backbone of ecommerce search, they can often fall short when
    users express their needs with imprecise language or use synonyms. `BM25` is based
    on statistical measures and does not have a built-in understanding of the semantic
    meaning of terms. The `BM25` algorithm has `k1` and `b` parameters and selecting
    optimal values could be a challenge.


    `BM25` is often preferred over traditional text-matching algorithms like `TF-IDF`
    in ecommerce search due to its advanced handling of term saturation and document
    length variability. Unlike `TF-IDF`, which can overemphasize term frequency and
    lacks length normalization, `BM25` adjusts for diminishing returns of term frequency
    and normalizes for document length. So `BM25` scores are more reliable in pulling
    more relevant products.'
