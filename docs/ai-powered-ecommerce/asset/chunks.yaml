- fmt: '# Overview


    An ecommerce marketplace brings together a wide range of sellers and buyers on
    a common technology platform. This platform facilitates product transactions and
    requires a comprehensive set of features for both buyers and sellers, as discussed
    in the previous chapter.


    An ecommerce platform begins by identifying a set of target groups (TGs) to enable
    transactions. These target buyer groups represent the demographics and buyer segments
    that the platform aims to serve. Understanding the needs and requirements of these
    selected TGs is crucial for tailoring products and offerings for the buyers’ preferences.
    Initially, when an ecommerce platform is new, target groups are defined based
    on market research and the founders’ hypotheses. As the platform grows, machine
    learning methods become pivotal for identifying these groups by analyzing buyer
    purchase patterns and aligning them with buyer needs and personas. One commonly
    used unsupervised machine learning method for this purpose is `K-Means` clustering,
    which groups customers based on similarities in their behavior and attributes.


    Ecommerce merchandising focuses on connecting buyers with the right products on
    the platform. Recommendation methods such as collaborative filtering and matrix
    factorization are commonly used to prioritize products for each buyer’s target
    group based on their browsing and purchase patterns.


    For instance, Myntra, a leading fashion ecommerce company, serves a specific target
    group, while another ecommerce platform, Amazon, is a multi-category platform
    that also sells fashion products. However, the brands and price ranges on these
    platforms are significantly different for the fashion category, and each of them
    targets different buyer segments.


    Myntra targets fashion-conscious buyers, particularly within the medium-income
    group, who are looking for trendy and branded products [[4](#630035_1_En_3_Chapter.xhtml#CR4)].
    The platform creates curated collections and focuses on providing exclusive products
    through partnerships with global brands. Its primary focus is on fashion categories
    across apparel, footwear, and accessories. Additionally, visually appealing design
    is a core focus for the platform [[3](#630035_1_En_3_Chapter.xhtml#CR3)].


    Presenting relevant products to target groups (TGs) and anticipating their needs
    and preferences are key focus areas in merchandising. Data-driven approaches help
    map product needs to specific target groups. ASOS utilizes data to refine its
    target groups and align tailored value propositions to each group effectively
    [[11](#630035_1_En_3_Chapter.xhtml#CR11)]. Personalization and recommendations
    enable the presentation of relevant products to buyers. Monitoring emerging and
    evolving market trends, along with forecasting, provides insights for anticipating
    future product needs for each target group.


    Merchandising in an ecommerce marketplace involves several key activities:


    - **Curating Products:** Creating a curated selection of products from different
    brands and sellers and ensuring the availability of these products are the key
    priorities for the category managers in ecommerce. This is product category management.
    Product curation is a primary responsibility for category managers on an ecommerce
    platform. Machine learning-based recommendation and ranking methods assist them
    in selecting products that drive performance. Category managers continuously monitor
    key performance metrics, such as click-through rate, average order value, and
    conversion rate, to ensure the effectiveness of their product curation strategies.


    - **Presenting Products:** Effectively presenting these products using attractive
    visuals on the platform and creating the right offer construct are the focus of
    site merchandising teams. Subtle variations in visuals can significantly impact
    buyer engagement on ecommerce platforms. The site merchandising team conducts
    various experiments to assess these effects, using statistical tests to measure
    their effectiveness.


    - **Marketing Products:** Promoting products using enticing visuals, offers, and
    promotions across various marketing channels (marketing) to the right target groups
    and to bring them to the platform is among the functions of the marketing teams.
    Artificial Intelligence (AI) and machine learning (ML) methods are key enablers
    for personalizing marketing efforts, particularly for existing buyers. ML techniques
    such as `XGBoost` and `Random Forest` are commonly used to identify which customers
    are most likely to respond to CRM campaigns.


    Ecommerce merchandising is a cross-functional responsibility that spans across
    category management, site merchandising to the marketing functions. Effective
    collaboration across these functions is essential to ensure a seamless shopping
    experience for buyers and to drive successful transactions on the platform.'
