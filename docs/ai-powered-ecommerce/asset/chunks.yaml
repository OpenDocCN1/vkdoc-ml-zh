- fmt: '# Recommendation Engine – Business Impact


    A well-designed recommendation engine can significantly enhance the buyer experience
    on an ecommerce platform. By providing curated product choices tailored to each
    buyer’s preferences and browsing history, a recommendation engine can increase
    buyer engagement, improve conversion rates, and potentially lead to higher transactions
    per order. Additionally, personalized email or WhatsApp campaigns based on recommendation
    engine insights can attract buyers to the platform and foster loyalty. Common
    recommendation algorithms include collaborative filtering, content-based filtering,
    and hybrid algorithms.


    Recommendation Engines are used across industries from healthcare to hotels, in
    addition to ecommerce [[4](#630035_1_En_5_Chapter.xhtml#CR4)]. Recommendation
    engines are utilized across various industries for diverse use cases. In healthcare,
    they offer personalized treatment recommendations based on medical history, symptoms,
    and other relevant information, and suggest candidate drugs based on molecular
    structures and interactions. In the hotel industry, recommendation engines suggest
    hotels based on travel history and guest preferences, and identify up-sell opportunities
    by recommending additional services and amenities. Platforms like Spotify and
    Netflix have harnessed recommendation engines at scale to drive differentiation
    and enhance user experience, setting them apart in their respective markets.


    According to a McKinsey report [[5](#630035_1_En_5_Chapter.xhtml#CR5)], a recommendation
    engine contributes over 35% of purchases for Amazon. When buyers are engaged with
    personalized recommendations on the platform, they have 70% higher conversion
    rate and increased average order values [[5](#630035_1_En_5_Chapter.xhtml#CR5)].


    Research [[5](#630035_1_En_5_Chapter.xhtml#CR5)] indicates that when buyers encounter
    poor recommendations, 38% of US digital shoppers will stop shopping. For a large
    European IP provider Television (IPTV), up to 30% of the recommendations are followed
    by a purchase, with an estimated lift factor (increase in sales) of 15% [[7](#630035_1_En_5_Chapter.xhtml#CR7)].


    Recommendations play a critical role in ecommerce from engaging buyers on the
    platform to increasing conversion rate [[6](#630035_1_En_5_Chapter.xhtml#CR6)].
    Hence, most of the leading platforms have recommendation functionalities ranging
    from showing personalized products to suggesting complementary items.


    A recommendation engine is critical for creating a personalized digital store
    for each buyer. Jeff Bezos envisioned this concept in early 2000, stating, “If
    we have 4.5 million buyers, we shouldn’t have one store, we should have 4.5 million
    stores” [[7](#630035_1_En_5_Chapter.xhtml#CR7)].


    Amazon’s personalized digital store exemplifies the power of recommendation engines
    in action [[9](#630035_1_En_5_Chapter.xhtml#CR9)]. By leveraging a sophisticated
    blend of advanced machine learning techniques, Amazon creates a nearly individualized
    digital storefront for each buyer, whether they are on the website or mobile app.
    When an existing buyer logs in, the homepage is tailored with recommendations
    based on previous purchases, prominently featuring items the buyer may want to
    repurchase. Amazon’s system also takes into account a variety of factors such
    as purchase history, day of the week, location, and other contextual data. This
    comprehensive approach integrates various algorithms, from collaborative filtering
    to deep learning-based recommendations, ensuring that buyers receive highly relevant
    and personalized suggestions.


    How do algorithms create a personalized store for each buyer? What is the science
    behind engaging Manisha across her touchpoints on the ecommerce platform?


    ## The Science of Similarity: Crafting Personalized Choices


    In crafting personalized recommendations, the pivotal question is, how do these
    algorithms enable the diverse use-cases that shape our online experiences?


    At its core, the primary focus is to meticulously curate choices that are deeply
    relevant to each individual buyer and the fundamental principle is similarity.
    Hence, Amit Sharma, a researcher at Microsoft, says on Quora, “recommendation
    systems are nothing but ‘similarity hunters.’” The higher the similarity between
    a buyer preference and a particular choice, the greater the probability that the
    buyer will find it appealing and engaging.


    There is a long list of recommendation scenarios or functionalities on ecommerce,
    a few of these are typically referred to below.


    * **Similar products**: Finding choices similar to the one the buyer is currently
    viewing, enhancing their choices within the same category.

    * **Frequently bought together**: Recommending products that are often purchased
    together. For example, if a buyer adds a smartphone to their cart, it might be
    a screen protector and a case relevant.

    * **Customers Who Bought This Also Bought**: Guiding users by showcasing products
    that were purchased together by other buyers who have also bought this product.

    * **Style on**: Encouraging users to explore additional items by suggesting complementary
    products. For example, if a buyer is exploring a black dress, it might recommend
    a black blazer to complete the look.

    * **Recommended for you**: Personalizing product recommendations based on the
    buyer’s purchase history. It is designed to help buyers discover new products
    that they might be interested in.

    * **Inspired by your browsing history**: This type of recommendation is like the
    “recommended for you” recommendation, but it is more specific to the products
    that the buyer has browsed recently. It is designed to help buyers find products
    that they are already considering.


    Consider the scenario of **Trending Items**: When a product gains momentum, indicating
    that a significant number of buyers are either purchasing or showing interest,
    it becomes a beacon of relevance. This surge in popularity implies that a buyer
    who aligns with the preferences of the broader audience, enhancing the likelihood
    of liking the product. Particularly valuable in the absence of specific buyer
    insights, the trending items serve as a go-to option, tapping into the collective
    pulse of the market.


    **Similar Products**, another intricate facet, comes into play when a buyer exhibits
    interest in a specific product. By showcasing items akin to the one currently
    being explored, the chances of the buyer finding something they like goes up.
    The construction of product similarity is nuanced, considering not only explicit
    data such as historical purchases and browsing but also implicit feedback like
    ratings and reviews. The recommendation engine meticulously evaluates these parameters,
    ensuring that the recommended products resonate with the buyer’s preferences.


    Figure [5-2](#630035_1_En_5_Chapter.xhtml#Fig2) illustrates a simple layout for
    displaying similar product recommendations on a detailed product page of an ecommerce
    platform.


    ![](images/630035_1_En_5_Chapter/630035_1_En_5_Fig2_HTML.jpg)


    Figure 5-2


    Similar product widget


    Delving further into the realm of recommendation, we encounter the concept of
    **Customers Who Bought This Also Bought**. Here, the goal is to unearth new products
    that might captivate the buyer’s interest. The key lies in identifying buyers
    with analogous tastes and preferences. By examining the choices made by these
    similar buyers, the engine extrapolates potential interests of the current buyer.
    The underlying assumption here is profound: similar buyers tend to appreciate
    comparable choices. By aligning the current buyer’s preferences with those of
    their counterparts, the engine expands the horizon of possibilities, presenting
    choices that hold the promise of uncharted fascination.'
