    attributes were employed. The following base features were considered:


    *   **Product Characteristics:** Color, Fit Type, Pattern, etc.


    *   **Performance Statistics:** Orders, sales value, product views, etc.


    *   **Efficiency Ratios:** Cart Add Rate, Conversion rate, etc.


    *   **Feedbacks:** Return Rate, ratings, reviews


    Product review data on ecommerce platforms provide valuable insights that can
    enhance popularity ranking models. However, since reviews are textual, they must
    be converted into numerical features before being integrated into the ranking
    model.


    Common methods for feature extraction include calculating sentiment scores, such
    as percentages of positive and negative sentiments, and converting these into
    ranked values (e.g., whether a product falls in the top 20% based on positive
    sentiment). Additionally, natural language processing (NLP) and transformer models
    can identify the top tags associated with products. Features such as the count
    of reviews and positive sentiment scores for these tags are also considered. For
    instance, if a tag frequently highlights product design issues, products associated
    with that tag might be ranked lower.


    In deep learning-based ranking systems, textual reviews can be transformed into
    embeddings using advanced techniques. These embeddings capture the semantic meaning
    of the reviews, allowing the model to use them directly as input. This approach
    enables the ranking system to leverage the nuanced information contained in the
    reviews, such as overall sentiment and context, to improve the accuracy and relevance
    of product rankings.


    The predictive ML model approach leverages the historical features for finding
    relevant ranks in the period ahead.


    ***Case Study: Ranking Search Results for Fashion Products***


    ***Context***


    *Indian fashion ecommerce platform wanted to develop a seamless and personalized
    shopping experience for its buyers. Over 30% of buyers used the platform’s search
    function, with a majority clicking on products displayed in the results. A crucial
    aspect of this experience was effectively ranking search results for fashion products,
    ensuring buyers saw the most relevant and appealing items.*'
