- fmt: '# Search Result Ranking


    When searched for “printed sarees below 2000” on an ecommerce platform, it returned
    over 30,000 products. And in ecommerce, a significantly large percentages of the
    buyers do not click beyond the first three pages, showing relevant on the top
    improves the buyer engagement on the ecommerce platform. For showing relevant
    products on the top could be done based on Popularity or Personalization ranking.


    Popularity is mainly based on product performance – how popular are they? How
    trendy are these?


    Product popularity in ecommerce cannot be determined by a single metric like views
    or purchases alone. For instance, lower-priced products often attract more views,
    while conversion rates can fluctuate with promotions and discounts. Products displayed
    prominently on listing pages may receive higher click-through rates (CTR) but
    could have lower conversion rates. To address these complexities, a composite
    popularity score is used, combining various metrics to rank products more effectively
    across ecommerce platforms. This score provides a more comprehensive measure of
    a product’s overall popularity and performance.


    A list of product performance attributes along with ranking algorithms can be
    used for the popularity score. A chapter on the ranking algorithm gives detailed
    overview on the process to develop ranking models for sorting the products that
    deliver on customer experience and business performance.


    Ecommerce platforms have significant information about the customer preferences
    especially for the repeat and highly engaged customers. For the customers who
    have purchased sarees earlier, it should prioritize the products with similar
    price range, color patterns, and other attributes. Re-ranking of products based
    on customer preferences is personalization of search results. A detailed approach
    along with the business impact of personalization in ecommerce is discussed in
    the personalization chapter.


    ## Search Architecture in Action: From Query to Results


    Ecommerce platforms often greet users like José and Rashmi with trending searches
    upon entering the search bar. This strategy capitalizes on the idea that terms
    experiencing a surge in popularity are likely to be relevant and interesting to
    a broader audience. Further, improvements can be made by incorporating geo-location
    and gender-based personalization for trending searches. This would allow the platform
    to tailor these suggestions to better reflect the interests of users in specific
    locations or demographic groups.


    Some platforms display a user’s previous search terms, assuming they might revisit
    those searches later. This can be a helpful feature for users who haven’t yet
    made a decision or simply want to pick up where they left off. Also, for some
    category where repeat purchase for the same category or products are common. For
    example, on the grocery platform, showing milk or biscuits.


    For users entering search queries, the search engine employs spell correction
    (typically utilizing an ML-based model) to identify and rectify typos in real
    time and facilitate user experience by retrieving relevant search queries as they
    type. These suggestions, often called “auto-suggestions” or “type-ahead,” are
    displayed for user convenience.


    At Myntra, this approach has demonstrably improved click-through rates (CTR) by
    3%, specifically for users who engage with contextual type-ahead suggestions [[6](#630035_1_En_4_Chapter.xhtml#CR6)].


    For search queries like “printed sarees below 2000,” the search system undergoes
    several steps before delivering results. The first step is pre-processing of the
    query and performing steps like removing special characters, spell corrections,
    or stemming/lemmatization, etc.


    The processed query is fed to NER and query classification models to identify
    key information from the query. The NER model extracted relevant entities such
    as brand, color, pattern, etc. Whereas the query classification model gives the
    category or categories that are relevant to a search term. This includes the product
    type (“sarees”) and relevant attributes like price (“below 2000”).


    Once product category and other attributes are extracted, the system searches
    for products with matching attributes in the product catalog. This might involve
    checking product titles and descriptions. In the final step, the retrieved products
    are ranked based on factors that indicate their relevance to the user’s search.


    Ecommerce search results are sorted based on the ranking model that can prioritize
    either at an overall popularity level or user personalization level.


    It is important to give buyer features to select the products from the pulled
    list of products with the help of a list of relevant filters (facets) that should
    dynamically adjust for each search query. For instance, when a buyer is searching
    for “sarees,” it might prioritize filters like color and fabric, whereas for “t-shirts,”
    it might prioritize neck type. This tailored approach is facilitated by machine
    learning (ML) models powering the facet search functionality. Dynamic facets,
    informed by these models, improve buyer experience by ensuring the displayed filter
    options are highly relevant and directly applicable to the user’s specific search
    query.


    Finally, the buyer is presented with a cohesive search experience, displaying
    the most relevant products alongside the appropriate filter options at the top
    of the page.


    Figure [4-9](#630035_1_En_4_Chapter.xhtml#Fig9) illustrates the key components
    of the ecommerce search ecosystem. It details the journey from a buyer’s search
    query through the processes of matching and ranking products, and highlights the
    functionalities available for further refining search results.


    ![](images/630035_1_En_4_Chapter/630035_1_En_4_Fig9_HTML.jpg)


    Figure 4-9


    Logical search architecture


    Search functionality in ecommerce is a complex ecosystem involving machine learning
    models, business rules, evolving product information, and shifting buyer expectations
    and behaviors. Given these dynamic factors, the performance of search platforms
    is monitored rigorously. Machine learning models are continuously evaluated and
    re-trained, with some updates occurring automatically and others following thorough
    data preparation and deliberation.


    New changes are systematically released and tested on a small percentage of users
    through A/B testing. Once significant improvements are observed, the changes are
    gradually rolled out to a larger user base.'
