    Ecommerce platforms like Amazon or Myntra use A/B testing to evaluate the performance
    of different recommendation algorithms and approaches. In A/B testing, it randomly
    assigns buyers to different groups and then shows products based on different
    recommendations. Performance on these metrics is compared for each group to determine
    which recommendation algorithm or approach performs the best. For proper A/B testing,
    each of the groups need to have a large enough buyer base to get statistically
    significant results.


    In 2021, Amazon generated 35% of its sales from recommended products. This means
    that Amazon’s recommendation engine is responsible for billions of dollars in
    revenue each year, and for helping buyers to discover new products that they may
    not have been aware of [[5](#630035_1_En_5_Chapter.xhtml#CR5)].


    Now, a few scenario use-cases are considered and then above recommendation architecture
    components are explained with the steps.'
  trans: '

    #### 混合推荐算法


    混合推荐算法结合了协同过滤和基于内容过滤的优势，向用户推荐既符合其偏好又具有新颖性的产品。


    结合基于内容与协同过滤的算法可以通过多种方式增强推荐系统。一种方法是为两种方法的推荐结果分配权重，例如将 40%的推荐分配给协同过滤，其余 60%分配给基于内容过滤。另一种方法是根据两种算法的加权得分对产品进行评分，并据此呈现最终推荐结果。上下文因素在决定哪种方法更有效方面也起着关键作用。例如，当买家信息有限时，可能会优先采用基于内容的推荐。相反，对于交互数据丰富的活跃用户，协同过滤往往能提供更相关的推荐。


    对于电商平台上的新买家，混合算法利用基于内容的推荐来解决冷启动问题。混合系统还整合了人口统计信息、用户上下文和历史数据来优化推荐。


    基于相似用户的产品推荐有助于解决基于内容过滤算法中缺乏多样性的问题。


    以下是电商平台使用混合算法的一些示例。当买家访问电商网站首页时，混合推荐算法可以根据其过往的购买和浏览历史，以及其他具有相似偏好的买家购买过的产品，来推荐产品。


    此外，当买家查看某个产品详情页时，混合推荐算法可以推荐买家可能感兴趣的其他产品，例如互补产品，或来自同一品牌或类别的产品。


    混合推荐算法相比传统推荐算法具有以下优势：


    *   **更高的准确性**：混合推荐算法通常比传统推荐算法更准确，因为它们考虑了更广泛的因素。


    *   **更好的惊喜度**：混合推荐算法更擅长推荐买家未曾接触过或可能自己并未意识到的新产品。


    *   **减轻冷启动问题**：混合推荐算法受冷启动问题的影响小于传统推荐算法，因为它们可以利用基于内容的过滤向新用户推荐产品，即使这些用户尚未与系统进行太多交互。


    ### 4\. 评估


    像亚马逊这样的电商平台管理着数百万种产品，并依赖推荐引擎每天向买家提供高度相关的建议。如何评估推荐系统是否满足了买家的偏好？


    像亚马逊或 Myntra 这样的电商平台会向数百万买家展示个性化的产品推荐。评估这些推荐系统的性能是一项复杂的任务，因为不同组织的关注点和优先级可能不同。然而，有一些关键指标可以使用，例如准确性、覆盖率和新颖性。如果目标是提高用户满意度，那么买家参与度（如点击次数和停留时间等）和满意度等指标可能比准确性更重要。


    在任何推荐算法上线电商平台之前，其输出都会经过评估，所考虑的一些评估指标包括：


    *   **准确性**：衡量推荐引擎预测产品与买家相关性的准确程度。


    *   **覆盖率**：衡量被推荐给买家的产品所占的比例。


    *   **新颖性**：衡量推荐给买家的产品中，对买家而言是新产品所占的比例。


    在商业环境中，业务指标至关重要。受推荐引擎影响的一些业务指标包括：


    *   **点击率（CTR）**：当产品被推荐给买家时，有多少买家喜欢并点击它们。点击率有助于衡量这一点，它是指点击推荐产品的买家所占的百分比。


    *   **转化率（CVR）**：电商平台的目标是向买家销售产品。这意味着买家会购买推荐给他们的产品。转化率衡量的是每次访问电商平台时最终完成购买的买家比例。转化率是指点击推荐产品并最终购买该产品的买家所占的百分比。


    *   **购买收入**：通常，单价较低的产品具有更高的转化率。电商平台也会优化推荐，以提高买家访问带来的总收入。因此，由推荐产品产生的总收入是评估推荐引擎的一个重要考量因素。


    时尚电商平台 Zelano 指出：“衡量点击率是推荐系统的核心指标，但你不能忘记追踪总收入” [14]。


    像亚马逊或 Myntra 这样的电商平台使用 A/B 测试来评估不同推荐算法和方法的性能。在 A/B 测试中，平台将买家随机分配到不同组，然后根据不同的推荐结果展示产品。比较每组在这些指标上的表现，以确定哪种推荐算法或方法表现最佳。为了进行正确的
    A/B 测试，每个组都需要有足够大的买家基数，才能获得统计上显著的结果。


    2021 年，亚马逊 35%的销售额来自推荐产品。这意味着亚马逊的推荐引擎每年负责创造数十亿美元的收入，并帮助买家发现他们可能未曾意识到的新产品 [5]。


    现在，我们将考虑几个场景用例，并逐步解释上述推荐架构的组成部分。

    '
- fmt: '# Fashion Ecommerce: Recommendations for You


    `Manisha` is a regular shopper to fashion ecommerce platforms. When she visits
    the platform, she is greeted with a curated list of products under the “Recommendations
    for you” widget. One of the approaches to power this widget is collaborative filtering
    algorithm. Collaborative Filtering (CF) is the most successful recommendation
    technique to date [[10](#630035_1_En_5_Chapter.xhtml#CR10)].


    Fashion ecommerce has an interesting business model, the trends evolve at a rapid
    pace, more products are added each day and there is a huge volume of products
    for any given category.


    Considering each of the products will be purchased by few buyers only, buyer product
    purchase interaction data is hugely sparse. So, one approach could be to leverage
    buyer interest and affinity data. We can create handcrafted features that capture
    buyer interest or indicative of buyer preferences and then collaborative filtering
    algorithms can be leveraged.


    Handcrafted features, curated by domain experts or based on the taxonomy, capture
    nuanced buyer preferences. For example, in fashion ecommerce, the features can
    capture brand affinity, category preferences, price ranges, size preferences,
    color preferences, style attributes, and many more. Additionally, the features
    include demographic data (gender, location), and device-related information (app
    vs. web, iOS vs. Android) related characteristics. The handcrafted features help
    to identify buyer style preferences, which are often difficult to capture using
    traditional interaction (purchase or ratings) data.


    User-Based Collaborative Filtering (UBCF) coupled with handcrafted features offers
    a strategic approach to provide tailored recommendations and address buyer preferences
    effectively. A well-defined user profile can differentiate a more personalized
    or customized recommendation system from a conventional system [[14](#630035_1_En_5_Chapter.xhtml#CR14)].


    In user-based collaborative filtering, the recommendation process involves comparing
    users’ preferences and behaviors. When handcrafted features are involved, creating
    a matrix involves representing users and their features in a structured way. We
    construct a user-feature matrix where each row corresponds to a buyer and each
    column for a feature.


    The values in the matrix indicate the strength or relevance of a particular handcrafted
    feature for a specific user. In a simplified scenario, it can be a binary (0 or
    1) for the presence or absence of a feature.


    In the first step, for the millions of the buyers on the fashion ecommerce platform,
    the handcrafted features, including brand affinity, category preferences, price
    ranges, gender, age, and geographic location, are created. These features are
    transformed into a binary user-feature matrix, where 1 indicates a purchase and
    0 indicates no purchase for the user and feature combinations.


    Once the user–feature matrix is constructed, the next step in collaborative filtering
    is to calculate the similarity between users. This is done to identify the most
    similar buyers based on handcrafted features. And the two common similarity metrics
    used for this purpose are Jaccard similarity and cosine similarity. Nearest neighbor
    algorithms are then used to find the top N most similar buyers to a given user.
    These algorithms identify the users whose preferences are most similar to the
    target user’s preferences.


    Figure [5-7](#630035_1_En_5_Chapter.xhtml#Fig7) illustrates how collaborative
    filtering algorithms compare buyer characteristics to identify similar buyers
    and generate recommendations.


    ![](images/630035_1_En_5_Chapter/630035_1_En_5_Fig7_HTML.jpg)


    Figure 5-7


    Similar buyer identification


    Based on the nearest neighbors, the top N similar buyers are selected. For these
    buyers, all products preferred by them are selected as the consideration set.
    The underlying assumption is that if these buyers are similar in taste and preferences
    to the user under consideration, the products preferred by them will also be of
    interest.


    For the final curated recommendations, the products that are already purchased
    by the user are excluded. This is especially important in the fashion category,
    where buyer may not want to purchase the same product again.


    This approach helps in finding curated fashion products that have been explored
    and liked by similar buyers, providing more personalized and relevant recommendations
    for the buyer/user.


    Figure [5-8](#630035_1_En_5_Chapter.xhtml#Fig8) displays products favored by similar
    buyers, which can be included in the final recommendation set.


    ![](images/630035_1_En_5_Chapter/630035_1_En_5_Fig8_HTML.jpg)


    Figure 5-8


    Recommended product listing


    Recommendation systems based on Collaborative Filtering techniques have successfully
    worked for many scenarios [[14](#630035_1_En_5_Chapter.xhtml#CR14)]. When certain
    users exhibit similar characteristics due to hand-crafted features, adopting User-Based
    Collaborative Filtering for personalized recommendations becomes easier. By preparing
    a user matrix with handcrafted features, sparsity in the data can be reduced.
    Additionally, user–user relationships are leveraged for recommendations, it brings
    novelty into the choices.


    However, there are some challenges associated with this approach. One such challenge
    is overfitting, especially when there are limited user profile features and interaction
    data in ecommerce settings. Another challenge is the computational expense of
    calculating the similarity matrix between all pairs of buyers, which can be prohibitive
    for large datasets.


    The functional and algorithmic foundations of recommendation engines have been
    extensively detailed. However, practical implementation extends beyond the framework
    and algorithms, as recommendations in ecommerce platforms or similar digital ecosystems
    are often delivered in near real time. The complexity involved in generating these
    recommendations necessitates advanced technological innovations and robust ecosystems.


    Generating recommendations for millions of users while considering billions of
    data points requires a system designed for massive scalability. While the book
    focuses on functional and algorithmic aspects, understanding high-level technology
    considerations is also crucial.


    Cloud technology plays a pivotal role in enabling recommendations at scale. The
    architecture choices vary depending on the use case. For instance, similar product
    recommendations might not require full computation in real time, although recommendations
    are served instantaneously. Such systems often apply business rules and product
    availability checks before presenting options to users.


    In contrast, real-time recommendation engines rely on live click data, requiring
    real-time data streaming and significant computational resources. The architecture
    for these systems involves more complex technology components to handle the higher
    demands of real-time processing and scalability.'
