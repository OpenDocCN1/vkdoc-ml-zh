    Throughout this chapter, we delve into the intricacies of revenue generation on
    ecommerce platforms and examine the essential costs embedded within the ecommerce
    business model. At each juncture, we investigate the various applications of artificial
    intelligence (AI) and machine learning (ML), which range from improving buyer
    experience to reducing platform abuses. In today’s AI-driven landscape, while
    the potential of artificial intelligence is widely acknowledged, considerable
    skepticism exists regarding its return on investment. Measuring the return on
    investment (ROI) for each AI/ML project or use case can improve not only acceptability
    but also the profitability of the business.


    By correlating the outcomes of each AI/ML use case with the profit and loss statement,
    we establish a clear framework for gauging and guiding investment decisions toward
    the AI/ML journey.


    Building upon a comprehensive grasp of ecommerce business models, revenue streams,
    cost structures, and profitability factors, the upcoming chapter delves into the
    intricate mechanics of ecommerce platforms. This exploration spans both the buyer
    and seller experiences, with a particular focus on the customer journey – from
    initial engagement on social media to becoming a loyal customer on the ecommerce
    platform. Throughout this journey, we examine how machine learning (ML) and artificial
    intelligence (AI) are enhancing customer experiences, optimizing costs, and mitigating
    operational risks.


    # 2. Ecommerce Platform: Digital Ecosystem of Buying and Selling


    ## Overview


    Ecommerce platforms have revolutionized the way we shop, transforming brick-and-mortar
    stores into digital marketplaces. This is particularly evident in India, a country
    with a diverse population and a rapidly growing Internet user base. Ecommerce
    marketplaces have emerged as a powerful medium for connecting Indian buyers and
    sellers across the nation and beyond [[3](#630035_1_En_2_Chapter.xhtml#CR3)].
    Overall, the eCommerce platform does more than just connect buyers and sellers;
    it facilitates comprehensive commerce through a cloud-based environment and includes
    a variety of additional features. Key features and functionalities of the eCommerce
    platform will be explored in detail later in this chapter.


    Consider an example of Renuka, an IT professional from Mizoram, who works in Bangalore.
    She loves traditional clothing from Mizoram, especially for festivals and special
    occasions. She needs to find shops that sell similar products in Bangalore and
    this is not easy. Coming to the fast-forward world of ecommerce marketplace, Renuka
    can find a variety of traditional Mizoram dresses right up from her mobile and
    laptop. This is the transformation touching the majority of buyers in cities in
    India and across the world.


    There are thousands of similar contexts and needs of buyers that are getting addressed
    via ecommerce platforms. Differentiation of ecommerce is more pronounced for specialized
    and/or hard-to-find products, e.g., organic tea in a small place or luxury branded
    products in smaller cities.


    For an ecommerce marketplace to thrive, it must effectively support and enhance
    various aspects of the buyer’s journey on the platform. This includes offering
    a wide range of relevant products, providing easy access to them, and ensuring
    a seamless process for exploring and completing orders.


    For example, Renuka needs “Bandini Lehenga” and goes to an ecommerce platform
    and starts her shopping journey. She needs a way to reach the relevant products,
    this is facilitated by two ways – search what she needs or leverage category hierarchy
    (product taxonomy), or browse journey. When a buyer uses the search bar like in
    Figure [2-1](#630035_1_En_2_Chapter.xhtml#Fig1), the platform shows the search
    results as listing form – see Figure [2-2](#630035_1_En_2_Chapter.xhtml#Fig2).


    ![](images/630035_1_En_2_Chapter/630035_1_En_2_Fig2_HTML.jpg)


    Figure 2-2


    Search result listings


    ![](images/630035_1_En_2_Chapter/630035_1_En_2_Fig1_HTML.jpg)


    Figure 2-1


    Ecommerce Search


    In addition to the search journey, a buyer can also reach to intended products
    using browse journey, as shown in Figure [2-3](#630035_1_En_2_Chapter.xhtml#Fig3).


    ![](images/630035_1_En_2_Chapter/630035_1_En_2_Fig3_HTML.jpg)


    Figure 2-3


    Category Listing for Browse Journey'
  trans: '

    电商平台在获取新客户或维系现有客户上的支出占其收入的 10-15%[6]。品牌营销（BM）、直接营销（DM）和客户关系管理（CRM）等与维系现有客户相关的成本，是营销成本的关键组成部分。并非所有成本都是可变的，也并非都能归因于每笔交易。


    效果营销（直接营销和 CRM 营销成本）属于可变成本，在计算边际贡献 2 时需予以考虑。


    边际贡献 2（CM 2）= 边际贡献 1（CM 1）– 效果营销。


    在边际贡献 3 中，则需考虑品牌营销成本。


    边际贡献 3（CM 3）= 边际贡献 2（CM 2）– 品牌营销。


    ![](img/630035_1_En_1_Fig5_HTML.jpg)


    图 1-5.


    电商损益结构


    同样，AI/ML 算法可在优化营销决策和提高营销投资回报方面发挥重要作用。


    在计算边际贡献 4（CM 4）时，需考虑包括技术和员工成本在内的固定成本。如前几节所述，机器学习和人工智能有助于优化和降低技术成本的各个组成部分，从而提高边际贡献
    4。


    ## 总结


    电商企业建立在技术平台之上，并采用了多种商业模式，尤其适用于企业对消费者（B2C）场景。平台型电商模式是最成功的商业模式之一，赋能了广泛的买家和卖家。该模式与一系列收入驱动因素和成本流相关联。AI/ML
    用例可以提升收入水平并控制成本。


    将电商平台的销售额转化为盈利能力是电商业务的基石。做出明智的决策和战略干预不仅能提升销售额，还能增强整体盈利能力。通过理解电商企业损益表的关键组成部分，数据科学领导者可以在电商的各个阶段影响决策制定。


    在本章中，我们深入探讨了电商平台收入生成的复杂性，并审视了电商商业模式中固有的基本成本。在每个环节，我们都研究了人工智能（AI）和机器学习（ML）的各种应用，范围从改善买家体验到减少平台滥用。在当今由
    AI 驱动的格局中，尽管人工智能的潜力已得到广泛认可，但对其投资回报仍存在相当大的怀疑。衡量每个 AI/ML 项目或用例的投资回报率（ROI），不仅可以提高其可接受性，还能提升企业的盈利能力。


    通过将每个 AI/ML 用例的结果与损益表相关联，我们建立了一个清晰的框架，用于衡量和引导 AI/ML 旅程中的投资决策。


    在全面理解电商商业模式、收入流、成本结构和盈利因素的基础上，下一章将深入探讨电商平台的复杂机制。这一探索涵盖了买家和卖家体验，并特别关注客户旅程——从在社交媒体上的初次接触到成为电商平台上的忠实客户。在整个旅程中，我们将审视机器学习（ML）和人工智能（AI）如何提升客户体验、优化成本并降低运营风险。


    # 2. 电商平台：买卖的数字生态系统


    ## 概述


    电商平台彻底改变了我们的购物方式，将实体店转变为数字市场。这在印度尤为明显，该国人口多元，互联网用户群体迅速增长。电商平台已成为连接印度国内外买家和卖家的强大媒介[3]。总体而言，电商平台不仅仅是连接买家和卖家；它通过基于云的环境促进全面的商务活动，并包含多种附加功能。本章稍后将详细探讨电商平台的关键特性和功能。


    以来自米佐拉姆邦、在班加罗尔工作的 IT 专业人士 Renuka 为例。她喜爱米佐拉姆邦的传统服饰，尤其是在节日和特殊场合。她需要在班加罗尔找到销售类似产品的商店，这并不容易。进入快节奏的电商平台世界，Renuka
    可以直接通过手机和笔记本电脑找到各种传统的米佐拉姆邦服饰。这是正在触及印度乃至全球大多数城市买家的变革。


    有成千上万类似买家的需求和场景正通过电商平台得到满足。对于特殊和/或难以找到的产品，例如小地方的有机茶或小城市的奢侈品牌产品，电商的差异化作用更为显著。


    一个电商平台要想蓬勃发展，必须有效地支持和增强买家在平台上的旅程的各个方面。这包括提供广泛的相关产品、提供便捷的访问途径，并确保探索和完成订单的无缝流程。


    例如，Renuka 需要一件“Bandini Lehenga”，她进入一个电商平台并开始了她的购物之旅。她需要一种方式找到相关产品，这通过两种方式实现——搜索她需要的商品，或利用品类层级结构（产品分类法）或浏览路径。当买家使用如图
    2-1 所示的搜索栏时，平台会以列表形式显示搜索结果——见图 2-2。


    ![](img/630035_1_En_2_Fig2_HTML.jpg)


    图 2-2


    搜索结果列表


    ![](img/630035_1_En_2_Fig1_HTML.jpg)


    图 2-1


    电商搜索


    除了搜索路径，买家还可以通过浏览路径找到目标产品，如图 2-3 所示。


    ![](img/630035_1_En_2_Fig3_HTML.jpg)


    图 2-3


    浏览路径的品类列表

