  trans: '

    ## 案例研究：电商平台上的品牌优先级排序


    **背景**：在快速发展的印度电商市场中，识别并选择入驻品牌对平台的成功至关重要。通过市场调研和竞争分析，电商平台会识别出一份潜在品牌清单。同时，一些品牌也会主动联系平台寻求入驻。采用数据驱动的方法有助于系统性地评估这些品牌是否与电商平台的目标相符。


    **目标**：为品类经理建立一个数据驱动的框架，以识别高绩效品牌，实现成熟品牌与新兴品牌的均衡组合，并引入符合买家偏好和市场需求的品牌。通过追踪这些品牌及其产品在竞争对手平台上的表现，并结合分析媒体报道，有助于预估品牌绩效并提供有价值的见解。


    **方法**：


    *   捕获数据——销售额、评论与评分、社交媒体热度指标。

    *   为每个品牌创建关键绩效指标（KPI），例如销售潜力、买家满意度和市场相关性。

    *   为这些绩效指标定义评分标准，并汇总得分以得出综合品牌评分。

    *   综合评分及其各项分项评分将指导品类经理评估品牌并确定其入驻的优先级。


    **成果**：该平台已实施一种结构化的方法，定期筛选品牌并确定其入驻优先级。通过确保将最相关、最具潜力的品牌展示在平台上，这种方法提升了销售额、优化了产品组合，并改善了整体买家体验。


    与卖家和品牌建立长期合作关系涉及制定营销计划、设计最优定价策略，以及与品牌合作开展促销活动。这些努力旨在提升品牌知名度、提高买家参与度，并同时实现品牌的销售计划（GMV）和平台的收入目标。


    在电商平台中，品牌或卖家负责产品库存、供货状态和订单处理。在品牌上线前，电商平台与品牌的订单管理系统之间需要进行技术集成，以确保订单处理顺畅。库存集成有助于降低因产品缺货而导致订单取消的可能性。印度电商平台
    Flipkart 利用人工智能进行库存管理 [10]。支付处理和分析是电商平台模式中其他典型的服务和平台集成需求。相关协议旨在减少因产品缺货或质量不佳导致的订单取消，以及因包装和交付给物流伙伴缓慢而导致的订单配送延迟。


    总而言之，品类经理负责在品类页面和品牌页面上做出关于品牌选择和产品组合的决策，并承担平台上产品供应的责任。他们还致力于提高来自品牌的广告收入，并为电商平台实现销售目标（GMV
    和 NMV）。


    品类经理几乎实时地追踪整个漏斗（顶部、中部和底部）的绩效，以确保达成平台业务目标。下面列出了一些常见的绩效指标。这些指标捕捉买家旅程，识别提升平台绩效的机会，并帮助定位任何问题。例如，如果首页上的某些视觉效果或组件对买家无效或不相关，这将会反映在该组件的点击率上。同样，如果前一小时的转化率低于预期转化率，品类经理将与跨职能团队合作，以识别并纠正问题。


    对于顶部漏斗，访客数量、首页和产品列表页的点击率（CTR）、产品浏览量（PV）、产品浏览量/访问量比率（PV/V）以及跳出率（仅浏览着陆页就离开的访客百分比）有助于评估漏斗的健康状况。


    中部漏斗侧重于买家参与度，这很大程度上受产品推荐和个性化推荐的影响。用于监控买家参与度的关键指标包括加购率（将产品加入购物车的访客百分比）、结账率（进入支付页面的比例）以及结账（CO）与加购（CA）的比率。


    底部漏斗的绩效通过转化率、订单数量、GMV、NMV（考虑取消订单）、平均订单价值等指标进行追踪。这些指标有助于做出战术性的商品陈列决策。例如，如果最近几小时的平均订单价值较低，可以分析并调整促销策略。此外，产品组合和排名也可能产生影响。


    图 3-1 总结了漏斗每个阶段的绩效统计数据。


    ![](img/630035_1_En_3_Fig1_HTML.jpg)


    图 3-1


    营销漏斗各阶段的关键绩效指标


    基于人工智能的数据驱动定价和促销策略，使品类经理能够优化平台上的销售和买家参与度，从而在增长与盈利能力之间为电商平台取得平衡。


    在平台型电商平台上，部分定价决策由各个品牌和卖家自行决定。平台仅控制顶部商品的折扣，以不时推动销售。


    基于人工智能的流程控制可以帮助电商平台节省成本并改善买家体验。下面的案例研究重点展示了使用人工智能进行价格和促销运营控制所带来的影响。


    ***案例研究：使用人工智能进行价格和促销审核***


    ***背景**：一家印度时尚电商平台定期进行价格调整和促销活动，以提升销售额和买家参与度。面对数千个卖家，在促销期间，价格调整会在单品（SKU）层面进行。不同品类和品牌的折扣差异很大，有些品牌对折扣设限，而另一些则会在特定季节提供大幅折扣。通过规则来管理跨品牌和品类的这些差异是一项巨大的运营挑战。此外，无意的定价错误，例如价格从
    999 变为 99，可能会产生重大的财务影响，并在高流量时期偶尔导致平台崩溃。*


    ***问题陈述：** 开发一个机器学习模型，用于在批准所有价格调整之前对其进行审核并标记异常值。*


    ***方法**：利用历史价格调整数据，我们识别出所有价格变动，并通过数据分析和业务洞察相结合的方式标记出异常值。准备好标记数据后，我们开发了一个机器学习模型来自动检测异常的价格变动。*


    ***结果**：修订后的框架显著减少了对价格变动进行人工审核的需求，并加速了在生产环境中实施价格调整或上线发布的流程。*


    *缺货是电商销售和促销期间常见的挑战。基于机器学习的预测方法可以通过考虑折扣水平、品牌兴趣和卖家活动等各种因素来帮助预估需求。*


    品牌与电商平台之间的常规运营合作涵盖一系列职责：从新品上架、优化产品图片、标题和描述，到监控需求趋势、管理促销活动，以及处理订单管理问题（如包装延迟和退货增加）。

    '
- fmt: '高退货率对任何电商平台而言都是一项重大挑战，其成因多种多样。这些原因包括产品质量问题、产品描述不准确或过时、尺码不合，或买家利用平台政策进行不当使用。品类团队积极与卖家合作，以识别并缓解平台上与产品质量和详情相关的这些问题。


    人工智能与机器学习被用于审核产品详情，并批准产品上架至电商平台。其中一些模型还会标记假冒和重复产品。


    在引入合适的品牌和产品后，网站 merchandising 团队专注于优化它们在电商平台上的布局和优先级排序。


    ## 电商中的网站 Merchandising


    网站 merchandising 团队在电商中扮演着关键角色，通过战略性的产品展示、布局和促销来影响买家行为并推动销售 [[1](#630035_1_En_3_Chapter.xhtml#CR1)]。通过分析买家群体、购买模式和新兴趋势，merchandising
    团队设计首页和品类页面的布局。他们创建包含特定产品分类的微件，并打造个性化的买家旅程。


    网站 merchandising 通过在首页突出展示精心策划的产品分类来提升整体买家体验并提高转化率。这包括设计跨品类布局、建立品牌旗舰店、策划营销活动、安排促销活动，以及协调搜索功能的改进。该团队与品类经理和营销团队紧密合作，以使
    merchandising 策略与业务目标保持一致。他们根据品类特定的趋势和目标来分配产品分类和促销活动。


    特色微件旨在首页和特定品类页面上展示精心策划的产品分类、特价优惠和促销活动。团队持续监控这些微件的表现，并对其进行迭代以改善业务成果。跟踪的关键指标包括点击率、转化率以及总销售额或商品交易总额（GMV）。


    跨品类布局策略性地将来自互补品类的产品放置在一起，以鼓励买家探索更广泛的产品选择。这些组合是利用分析和数据科学方法设计的，以优化买家参与度和销售额。


    在时尚电商平台中，merchandising 和品类经理与品牌合作创建品牌旗舰店并策划产品分类。这些品牌页面通过各种社交媒体平台进行推广，以提高可见度并吸引流量。Merchandiser
    与营销团队紧密合作，为这些策划好的分类和品牌旗舰店安排促销活动，以最大化其影响力。


    下面的案例研究详细解释了在 AI/ML 支持下，网站 merchandising 如何帮助一家印度时尚电商平台改善业务成果。


    ***案例研究：针对区域性节日的个性化策展***


    ***背景**：印度是一个文化多样性丰富的国家，其各个邦和地区庆祝众多节日。这些节日通常具有特定的文化意义，并吸引特定人口细分群体的人群，即使他们可能分散在不同的地理位置。例如，“杜尔迦女神节”是孟加拉人热烈庆祝的一个重要节日，而孟加拉人在印度各大城市都有相当数量的人口。该电商平台旨在通过向正确的受众展示相关产品，来利用这些特定目标群体的文化相关性和需求。*


    ***目标**：目标是在杜尔迦女神节前几周，在一个时尚电商平台上，为孟加拉人创建一个相关的产品精选集。*


    ***方法**：该平台根据孟加拉用户登录时的地理位置和行为来识别他们。利用计算机视觉和 AI 技术，团队策划了一系列在节日期间对孟加拉人特别有吸引力的产品。这些策划好的产品随后通过引人入胜的视觉效果进行展示，并通过针对性的营销活动在社交媒体平台上进行推广，这些活动专门设计用于吸引孟加拉人及相关买家群体。*'
  raw: 'High return rates represent a significant challenge for any ecommerce platform
    and can stem from various factors. These include product quality issues, inaccurate
    or outdated product descriptions, fit problems, or misuse by buyers exploiting
    platform policies. The category team actively engages with sellers to identify
    and mitigate these issues related to product quality and details on the platform.


    Artificial Intelligence and Machine Learning is leveraged in review of the product
    details and approve products for onboarding for an ecommerce platform. Some of
    these models also flag fake and duplicate products.


    With the right brands and products on board, the site merchandising team focuses
    on optimizing their placement and prioritization within the ecommerce platform.


    ## Site Merchandising in Ecommerce


    The site merchandising team plays a pivotal role in ecommerce, influencing buyer
    behavior and driving sales through strategic product presentation, placement,
    and promotions [[1](#630035_1_En_3_Chapter.xhtml#CR1)]. By analyzing buyer cohorts,
    purchase patterns, and emerging trends, the merchandising team designs layouts
    for home and category pages. They create widgets featuring specific product assortments
    and craft personalized buyer journeys.


    Site merchandising enhances the overall buyer experience and boosts conversions
    by prominently featuring curated product assortments on home pages. This includes
    designing cross-category placements, establishing brand stores, orchestrating
    campaigns, scheduling promotions, and coordinating improvements to search functionalities.
    The team collaborates closely with category managers and marketing teams to align
    merchandising strategies with business objectives. They assign product assortments
    and promotions in alignment with category-specific trends and goals.


    The featured widgets are designed to showcase curated product assortments, special
    offers, and promotional campaigns on home pages and specific category pages. The
    team continuously monitors the performance of these widgets and iterates on them
    to improve business outcomes. Key metrics tracked include click-through rates,
    conversion rates, and overall sales or Gross Merchandise Value (GMV).


    Cross-category placements strategically position products from complementary categories
    to encourage buyers to explore a wider range of offerings. These combinations
    are designed using analytics and data science methods to optimize buyer engagement
    and sales.


    In fashion ecommerce platforms, merchandising and category managers collaborate
    with brands to create brand stores and curate product assortments. These brand
    pages are promoted across various social media platforms to enhance visibility
    and drive traffic. Merchandisers work closely with marketing teams to schedule
    promotions for these curated assortments and brand stores, maximizing their impact.


    The case study below explains details around how site merchandising enabled with
    AI/ML helped an Indian fashion ecommerce platform to improve business outcome.


    ***Case Study: Personalized Curations for Regional Festivals***


    ***Context**: India is a country rich in cultural diversity, with numerous festivals
    celebrated across its various states and regions. These festivals often have specific
    cultural significance and attract people from specific demographic segments, even
    those who may be spread across different geographical locations. For example,
    “Durga Puja” is a major festival celebrated with great enthusiasm by Bengalis,
    who are present in significant numbers across major Indian cities. The ecommerce
    platform aimed to leverage the cultural relevance and needs of these specific
    target groups by showcasing relevant products to the right audiences.*


    ***Objective**: The goal was to create a curated collection of products relevant
    to Bengalis, a few weeks prior to the Durga Puja festival, on a fashion ecommerce
    platform.*


    ***Approach**: The platform identified Bengali users based on their geographical
    location and behavior when they logged in. Utilizing computer vision and AI techniques,
    the team curated a selection of products that would be particularly appealing
    to Bengalis during the festival. These curated products were then showcased with
    captivating visuals and promoted through targeted marketing campaigns across social
    media platforms, specifically designed to attract Bengalis and related buyer segments.*'
