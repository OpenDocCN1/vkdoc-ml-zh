- fmt: '# Curated Product Recommendations


    Leveraging past purchases and browsing behavior, AI can curate a selection of
    products specifically tailored to each visitor’s interests.


    These personalization tactics go beyond a one-size-fits-all approach, transforming
    the digital storefront into a unique curated experience for each customer. This
    level of personalization fosters deeper engagement and significantly enhances
    the customer journey.


    After homepage, significantly high visitors land to category listing pages (`CLPs`)
    and brand listing pages (`BLPs`) due to performance marketing campaigns. `PLPs`
    both `CLPs` and `BLPs` receive visitors for a specific product category or Brand
    interest in mind. This targeted traffic can lead to higher conversion rates compared
    to the homepage, where visitor intent might be broader. The `PLPs` show a curated
    selection of products for a specific category or brand to shorten product discovery
    and expedite decision-making.


    Showing the most relevant products on the top helps the buyers in making the purchase
    decisions faster. Ecommerce platforms leverage relevance ranking to prioritize
    the most relevant products on listing pages (e.g., `PLPs`, `CLPs`, `BLPs`). This
    is powered by machine learning (`ML`) algorithms. These algorithms use a variety
    of factors such as search results clicks, product views, cart addition rate (how
    often a product is added to the cart), conversion rate (how often a viewed product
    is purchased), and Gross Merchandise Value (`GMV`) and many more as input to ranking
    models.


    For logged-in customers, the ranking goes a step further. `ML` algorithms can
    leverage customers’ past purchase history, browsing behavior, and even abandoned
    cart products to personalize the order of products displayed. This level of personalization
    showcases items most likely to resonate with each individual customer, further
    accelerating their decision-making process.


    Visitors on a typical ecommerce journey often encounter products that pique their
    interest on product listing pages (`PLPs`). This can lead them to click for a
    closer look at a specific product, landing them on the product detail page (`PDP`).
    Compelling visuals can entice visitors to click through to reach `PDPs`. Products
    on models (model images) and relevant background have typically higher click through
    rate (`CTR`) and user engagement.


    Additionally, buyers can navigate from product listing pages to Product Detail
    Pages (`PDPs`). Paid search ads or SMS marketing campaigns may direct visitors
    directly to relevant `PDPs`.


    Product Detailed Pages (`PDPs`) are the ultimate destination for purchase decisions
    in ecommerce. `PDPs` are dedicated to showcasing a single product and have a comprehensive
    overview of the product, showcasing the product from various angles with high-quality
    images, clear and concise descriptions that highlight the product’s features,
    benefits, specifications, and materials along with displaying available sizes
    and colors.


    `PDPs` must have clear Call-to-Actions (`CTAs`). The prominent `CTAs` include
    “Add to Cart” and “Buy Now” along with showing information around expected delivery
    date and customer reviews.


    Figure [2-7](#630035_1_En_2_Chapter.xhtml#Fig7) shows typically information shown
    on the detail product page (`PDP`).


    ![](images/630035_1_En_2_Chapter/630035_1_En_2_Fig7_HTML.jpg)


    Figure 2-7


    Product detailed page


    By providing a wealth of product information, engaging content, and clear Call
    to Actions (`CTAs`), the `PDPs` empower visitors to make informed decisions and
    ultimately convert into paying customers.


    For measuring engagement on the platform, `product views per visit` (`PV/V`) –
    higher value indicate higher engagement of visitors in browsing and exploring
    product options, `Cart Addition Rate` (`CAR`), measuring percentage of visitors
    adding at least one product to the cart, and `time spent per session or visitor`
    – tracking average amount of time visitors spend across homepage, product page,
    category page, etc., and longer times indicate deeper engagement with the content.


    Product Detail Pages (`PDPs`) are prime real estate and a well-designed `PDP`
    is for converting interest to a purchase. Multiple recommendation widgets are
    added to craft engaging `PDPs`. These widgets utilize data science and AI to personalize
    recommendations for each visitor. These recommendation widgets are Frequently
    Bought Together, Style It With, or Similar Products.


    A well-curated product list with intuitive filters guides visitors to detailed
    product pages (`PDPs`). High-quality visuals, clear descriptions that highlight
    key benefits, and transparent delivery information on `PDPs` are crucial. These
    combinations effectively build trust and compel visitors to consider adding products
    to their carts. Once customers find the products of their choice, the goal is
    to convert these into a purchase.'
