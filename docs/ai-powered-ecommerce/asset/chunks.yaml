- fmt: '# AI/ML 算法在电商平台中的应用


    `AI/ML`算法优化了从订单分配到基于协同过滤或深度学习算法的个性化推荐等各个方面，对于市场平台而言，这些是机器学习算法的一些常见应用。订单分配是电商运营的关键组成部分，当产品在多个商店或仓库中可用时，它涉及为每个订单确定最佳履行地点。此过程需要仔细考虑库存水平、运输成本和买家偏好等因素，以确保及时高效的订单履行。机器学习，特别是分类和无监督学习技术，在实现明智的订单分配决策中发挥着关键作用。但是，必须承认，其他业务模式可能会产生额外的用例和考量。例如，库存管理对于直销业务模式至关重要，而高质量的需求预测模型对于直销商来说至关重要。


    ## Myntra – 纯市场模式


    `Myntra`是印度领先的时尚电商平台。`Myntra Pure Play Marketplace (MPPM)`是一种履行模式 [[3](#630035_1_En_1_Chapter.xhtml#CR3)]；在这种市场模式下，卖家需支付固定费用、佣金、物流费用（正向和逆向）以及购买`Myntra`品牌和强制包装材料的费用。当客户在`Myntra`应用或网站上下单时，订单通过订单管理系统（`OMS`）集成转发给卖家。卖家打包产品后，`Myntra`向配送合作伙伴发出取件请求，订单随即被取走进行配送。订单履行的责任由`Myntra`承担，通常由其配送合作伙伴`Ekart
    Logistics`完成 [[4](#630035_1_En_1_Chapter.xhtml#CR4)]。图 [1-2](#630035_1_En_1_Chapter.xhtml#Fig2)
    展示了`Myntra`纯市场模式的运作模型。


    ![](images/630035_1_En_1_Chapter/630035_1_En_1_Fig2_HTML.jpg)


    **图 1-2.** Myntra 市场模式


    来源：[`https://browntape.com/what-is-myntra-ppmp/`](https://browntape.com/what-is-myntra-ppmp/)


    卖家还可以使用卖家门户（`Seller Portal`），卖家可以在其中上传产品（目录）、更新折扣、访问运营详情（如订单和履行绩效报告）以及财务报告（如结算和佣金明细）。这是市场电商业务中的卖方平台，将在后续章节中详细讨论。


    ## 市场模式与盈利能力


    市场平台的成功依赖于创收和管理成本之间的微妙平衡。对于这些平台，主要收入来源来自向品牌和卖家收取的佣金。考虑到巨大的日活量和月活跃访问者，卖家也有动力通过购买广告位来利用平台的广告功能，这是这些电商平台的重要收入杠杆。


    ## 收入驱动因素


    市场模式的常见收入驱动因素包括佣金费用（如`Amazon`和`Flipkart`）、广告费用（如`Amazon`）以及平台费用（如`Myntra`和`Tata
    Cliq`）[[1](#630035_1_En_1_Chapter.xhtml#CR1)]。其他收入来源可能包括上架费和配送费（如`Flipkart`和`Amazon`）。


    这些费用的结构可能会随着时间的推移以及不同买家群体而演变或改变。图 [1-3](#630035_1_En_1_Chapter.xhtml#Fig3) 展示了市场电商商业模式中的常见收入驱动因素。


    ![](images/630035_1_En_1_Chapter/630035_1_En_1_Fig3_HTML.jpg)


    **图 1-3.** 电商收入驱动因素


    当买家在市场平台上完成交易时，平台本身通过佣金赚取收入。该佣金是总交易价值（通常称为商品交易总额，`GMV`）的一个百分比。向卖家收取的佣金率可能因行业、产品类别和特定市场平台而异。例如，据报道，`Nykaa`向卖家收取商品价格
    25% 的佣金 [[12](#630035_1_En_1_Chapter.xhtml#CR12)]，而`Myntra`的佣金率根据产品类别在 20% 到 35%
    之间 [[13](#630035_1_En_1_Chapter.xhtml#CR13)]。像`Meesho`这样的平台则不向卖家收取任何佣金 [[10](#630035_1_En_1_Chapter.xhtml#CR10)]。


    一些平台向买家收取每个订单中每件产品的配送费，并征收便利费和/或平台费。这些是额外的基于交易的收入驱动因素，尽管它们与交易金额没有直接关系。


    *   “`Myntra`，印度第二大电商网站，已对每笔订单（无论订单价值多少）收取 10 卢比的费用。此外，如果您不是`Myntra`注册用户且订单价值低于
    1000 卢比，则这是在现有 99 卢比费用之外的额外费用”[[11](#630035_1_En_1_Chapter.xhtml#CR11)]。


    除了佣金收入和交易费用/收费外，市场平台还通过广告创收。这些平台拥有数百万月活跃用户（`MAU`），使其成为寻求推广其产品的品牌和卖家的有吸引力的目的地。根据报告
    [[16](#630035_1_En_1_Chapter.xhtml#CR16)]，`Meesho`拥有超过 1.2 亿平均月活跃用户（`MAU`），并且正在快速增长。这笔广告收入为电商平台提供了重要的额外收入来源。


    这些平台通过利用协同过滤或类似算法来投放个性化广告，从而提高点击率（`CTR`）和广告收入，从而最大化广告收入。此外，它们采用强化学习算法来实时确定最佳广告出价。这些平台使用多臂老虎机算法持续平衡探索（从新数据中学习）和利用（最大化当前收益），以实现持续优化。


    为了在平台上销售广告位，卖家/品牌可以展示横幅广告，或者卖家可以对其产品相关的关键词进行竞价，以确保其产品在搜索结果中突出显示。下面的图 [1-4](#630035_1_En_1_Chapter.xhtml#Fig4)
    展示了一个真实示例，说明电商平台在买家进行搜索时如何展示赞助产品。


    ![](images/630035_1_En_1_Chapter/630035_1_En_1_Fig4_HTML.jpg)


    **图 1-4.** 电商赞助列表示例


    `Flipkart`在 23 财年的广告收入为 3324 亿卢比。这比上一期的 2083 亿卢比有所增长 [[8](#630035_1_En_1_Chapter.xhtml#CR8)]。


    `AI/ML`算法，例如协同过滤和基于深度学习的推荐系统，在优先排序和展示个性化赞助列表方面发挥着至关重要的作用。通过分析用户行为、购买历史和浏览模式，这些算法可以准确预测用户的兴趣和偏好。这使得它们能够向每个用户展示高度相关的广告，从而显著增加点击和潜在购买的可能性
    [[17](#630035_1_En_1_Chapter.xhtml#CR17)]。'
  raw: 'AI/ML algorithms optimize everything from order allocation to personalized
    recommendations based on collaborative filtering or deep learning-based algorithms,
    for marketplace platforms are some of the common applications of machine learning
    algorithms. An order allocation, a critical component of ecommerce operations,
    involves determining the optimal fulfillment location for each order when products
    are available across multiple stores or warehouses. This process requires careful
    consideration of factors such as inventory levels, shipping costs, and buyer preferences
    to ensure timely and efficient order fulfillment. Machine learning, particularly
    classification and unsupervised learning techniques, plays a pivotal role in enabling
    informed order allocation decisions. But, it’s important to acknowledge that additional
    use cases and considerations might emerge for other business models. For example,
    inventory management is crucial for direct selling business models and the quality
    demand forecasting models are critical for the direct sellers.


    ### Myntra – Pure Marketplace Model


    Myntra is a leading Fashion Ecommerce platform in India. Myntra Pure Play Marketplace
    (MPPM) is a fulfillment model [[3](#630035_1_En_1_Chapter.xhtml#CR3)]; in this
    marketplace model, a seller pays fixed fees, commission, logistics fees (forward
    and reverse) and charges for buying Myntra branded and mandated packing material.
    When a customer places an order on the Myntra app or website, the order is forwarded
    to the seller via order management system (OMS) integration. Once the seller packs
    the products, a pick request is placed to the delivery partner by Myntra and the
    order is picked up for the delivery. The order fulfillment is the responsibility
    of Myntra and typically fulfilled by its delivery partner – Ekart Logistics [[4](#630035_1_En_1_Chapter.xhtml#CR4)].
    Figure [1-2](#630035_1_En_1_Chapter.xhtml#Fig2) illustrates the working model
    of the pure play marketplace model at Myntra.


    ![](images/630035_1_En_1_Chapter/630035_1_En_1_Fig2_HTML.jpg)


    Figure 1-2.


    Myntra Marketplace Model


    Source: [`https://browntape.com/what-is-myntra-ppmp/`](https://browntape.com/what-is-myntra-ppmp/)


    The seller is also provided Seller Portal, where the seller is able to upload
    products (catalog), update discounts, get access to operational details such as
    order and fulfillment performance reports and financial reports like settlement
    and commission details. This is a sell-side platform in marketplace ecommerce
    business and discussed at length in the subsequent chapters.


    ## Marketplace Models and Profitability


    The success of marketplace platforms relies on a delicate balance between generating
    revenue and managing costs. For these platforms, the primary revenue stream comes
    from commission that is charged to brands and sellers. Considering the significant
    daily volume and monthly active visitors, sellers are also incentivized to leverage
    the platform’s advertising functionality by purchasing ad space and that is an
    important revenue lever for these ecommerce platforms.


    ## Revenue Drivers


    Common revenue drivers for marketplace models include commission fees (like Amazon
    and Flipkart), advertising charges (like Amazon), and platform fees (like Myntra
    and Tata Cliq) [[1](#630035_1_En_1_Chapter.xhtml#CR1)]. Additional revenue streams
    can include listing fees and delivery fees (like Flipkart and Amazon).


    The structure of these charges may evolve or change over time and across buyer
    segments. Figure [1-3](#630035_1_En_1_Chapter.xhtml#Fig3) shows the common revenue
    drivers in the marketplace ecommerce business model.


    ![](images/630035_1_En_1_Chapter/630035_1_En_1_Fig3_HTML.jpg)


    Figure 1-3.


    E-commerce Revenue Drivers


    When a buyer completes a transaction on a marketplace platform, the platform itself
    earns revenue through a commission. This commission is a percentage of the total
    transaction value, often referred to as Gross Merchandising Value (GMV). The commission
    rate charged to sellers can vary depending on the industry, product category,
    and specific marketplace platform. For example, Nykaa reportedly charges sellers
    a 25% commission on the item price [[12](#630035_1_En_1_Chapter.xhtml#CR12)],
    while Myntra’s commission rates range from 20% to 35% based on the product category
    [[13](#630035_1_En_1_Chapter.xhtml#CR13)]. Some platforms like meesho does not
    charge any commission to the sellers [[10](#630035_1_En_1_Chapter.xhtml#CR10)].


    Some of the platforms charge delivery fees to the buyers for each product in an
    order and also levies convenience and/or platform fee. These are additional transaction-based
    revenue drivers, though these are not directly connected to the transaction amount.


    *   “Myntra, India’s second biggest ecommerce site, has implemented a Rs 10 charge
    on every order irrespective of the order value. Also, if you aren’t a Myntra registered
    user and have an order worth less than Rs 1,000, then this is an additional charge
    to the existing Rs 99 fee”[[11](#630035_1_En_1_Chapter.xhtml#CR11)].


    Beyond commission income and transactional fee/charges, the marketplaces generate
    revenue through advertising. These platforms boast millions of monthly active
    users (MAU), making them attractive destinations for brands and sellers seeking
    to promote their products. According to the report [[16](#630035_1_En_1_Chapter.xhtml#CR16)],
    Meesho has over 120 million average monthly active users (MAUs) and is growing
    at a rapid pace. This advertising income provides a significant additional revenue
    stream for ecommerce platforms.


    These platforms maximize ad revenue by utilizing collaborative filtering or similar
    algorithms to deliver personalized ads that enhance click-through rates (CTR)
    and the ads revenue. Additionally, they employ reinforcement learning algorithms
    to determine optimal ad bids in real time. These platforms continuously balance
    exploration (learning from new data) and exploitation (maximizing current earnings)
    using multi-armed bandit algorithms for ongoing optimization.


    For the selling of ad space on the platform, seller/brand can show banner ads,
    or the sellers can bid on keywords relevant to their products to ensure their
    offerings appear prominently in search results. Figure [1-4](#630035_1_En_1_Chapter.xhtml#Fig4)
    below illustrates a real-life example of how an ecommerce platform displays sponsored
    products when a buyer performs a search.


    ![](images/630035_1_En_1_Chapter/630035_1_En_1_Fig4_HTML.jpg)


    Figure 1-4.


    E-commerce sponsored listing example


    Flipkart’s Advertising revenue was at Rs 3324 crore in FY23\. This is an increase
    from Rs 2083 crore in the previous period [[8](#630035_1_En_1_Chapter.xhtml#CR8)].


    AI/ML algorithms, such as collaborative filtering and deep learning-based recommendation
    systems, play a crucial role in prioritizing and displaying personalized sponsored
    listings. By analyzing user behavior, purchase history, and browsing patterns,
    these algorithms can accurately predict user interests and preferences. This enables
    them to present ads that are highly relevant to each individual user, significantly
    increasing the likelihood of clicks and potential purchases [[17](#630035_1_En_1_Chapter.xhtml#CR17)].'
  trans: '

    对于市场平台而言，AI/ML 算法优化了从订单分配到基于协同过滤或深度学习算法的个性化推荐等各个环节，这些是机器学习算法的一些常见应用。订单分配作为电商运营的关键组成部分，涉及在商品分布于多个门店或仓库时，为每个订单确定最优的履行地点。此过程需要仔细考量库存水平、运输成本和买家偏好等因素，以确保订单的及时高效履行。机器学习，特别是分类和无监督学习技术，在支持明智的订单分配决策中发挥着关键作用。但必须承认，其他商业模式可能会产生额外的用例和考量因素。例如，库存管理对于直销商业模式至关重要，而高质量的需求预测模型对于直销商来说也极为关键。


    ### Myntra – 纯市场模式


    Myntra 是印度领先的时尚电商平台。Myntra 纯市场模式（MPPM）是一种履行模式 [3]；在这种市场模式下，卖家需支付固定费用、佣金、物流费（正向和逆向）以及购买
    Myntra 品牌和强制要求的包装材料的费用。当客户在 Myntra 应用或网站上下单时，订单会通过订单管理系统（OMS）集成转发给卖家。卖家打包商品后，Myntra
    会向配送合作伙伴发出取件请求，订单随即被取走进行配送。订单履行的责任由 Myntra 承担，通常由其配送合作伙伴 Ekart Logistics [4] 完成。图
    1-2 展示了 Myntra 纯市场模式的工作模型。


    ![](img/630035_1_En_1_Fig2_HTML.jpg)


    图 1-2.


    Myntra 市场模式


    来源：[`https://browntape.com/what-is-myntra-ppmp/`](https://browntape.com/what-is-myntra-ppmp/)


    卖家还可以使用卖家门户，通过该门户，卖家能够上传产品（目录）、更新折扣、获取运营详情（如订单和履行绩效报告）以及财务报告（如结算和佣金明细）。这是市场电商业务中的卖方平台，将在后续章节中详细讨论。


    ## 市场模式与盈利能力


    市场平台的成功依赖于创收与成本管理之间的微妙平衡。对于这些平台而言，主要收入来源是向品牌和卖家收取的佣金。考虑到巨大的日活量和月活跃访客数，卖家也有动力利用平台的广告功能购买广告位，这成为这些电商平台重要的收入杠杆。


    ## 收入驱动因素


    市场模式常见的收入驱动因素包括佣金费用（如亚马逊和 Flipkart）、广告费用（如亚马逊）以及平台费用（如 Myntra 和 Tata Cliq）[1]。其他收入来源可能包括上架费和配送费（如
    Flipkart 和亚马逊）。


    这些费用的结构可能会随时间推移以及在不同买家群体间发生变化或调整。图 1-3 展示了市场电商商业模式中的常见收入驱动因素。


    ![](img/630035_1_En_1_Fig3_HTML.jpg)


    图 1-3.


    电商收入驱动因素


    当买家在市场平台上完成交易时，平台本身通过收取佣金来赚取收入。该佣金是交易总额的一个百分比，通常称为商品交易总额（GMV）。向卖家收取的佣金率可能因行业、产品类别和特定市场平台而异。例如，据报道
    Nykaa 向卖家收取商品价格 25% 的佣金 [12]，而 Myntra 的佣金率根据产品类别在 20% 到 35% 之间 [13]。像 Meesho 这样的平台则不向卖家收取任何佣金
    [10]。


    一些平台会向买家收取每个订单中每件产品的配送费，并征收便利费和/或平台费。这些是额外的基于交易的收入驱动因素，尽管它们与交易金额没有直接关联。


    *   “印度第二大电商网站 Myntra 已对每笔订单收取 10 卢比的费用，无论订单金额大小。此外，如果您不是 Myntra 的注册用户，且订单金额低于
    1000 卢比，则需在现有的 99 卢比费用基础上额外支付此费用”[11]。


    除了佣金收入和交易费用/收费外，市场平台还通过广告创收。这些平台拥有数百万的月活跃用户（MAU），使其成为寻求推广产品的品牌和卖家的理想目的地。根据报告 [16]，Meesho
    平均月活跃用户数（MAU）超过 1.2 亿，并且正在快速增长。这笔广告收入为电商平台提供了重要的额外收入来源。


    这些平台通过利用协同过滤或类似算法来投放个性化广告，从而提高点击率（CTR）和广告收入，以此最大化广告收入。此外，它们还采用强化学习算法来实时确定最优广告出价。这些平台使用多臂老虎机算法，在探索（从新数据中学习）和利用（最大化当前收益）之间持续平衡，以实现持续优化。


    对于平台上的广告位销售，卖家/品牌可以展示横幅广告，或者卖家可以针对与其产品相关的关键词进行竞价，以确保其商品在搜索结果中突出显示。下面的图 1-4 展示了一个真实案例，说明当买家进行搜索时，电商平台如何展示赞助商品。


    ![](img/630035_1_En_1_Fig4_HTML.jpg)


    图 1-4.


    电商赞助列表示例


    Flipkart 在 23 财年的广告收入为 3324 亿卢比。这比上一期的 2083 亿卢比有所增长 [8]。


    AI/ML 算法，例如协同过滤和基于深度学习的推荐系统，在优先展示和个性化显示赞助列表方面发挥着至关重要的作用。通过分析用户行为、购买历史和浏览模式，这些算法能够准确预测用户的兴趣和偏好。这使得它们能够向每个用户展示高度相关的广告，从而显著增加点击和潜在购买的可能性
    [17]。

