- fmt: '# The Relevance of Popularity


    The relevance of popularity is determined by evaluating all products on an ecommerce
    platform. Popularity is assessed by considering factors such as performance, potential,
    and efficiency, which collectively contribute to determining the popularity of
    each product.


    The performance metrics encompass factors such as unit sales, sales value, and
    clicks. However, when products receive greater visibility and higher placement
    on product listing pages, their performance metrics may be inflated due to positional
    bias or systematic advantages. Hence, performance measures alone may not be good
    enough.


    A few indicators may signal negative performance, for example, a high buyer-return
    rate for a product. The high return rate might be associated with various factors,
    including fit issues, quality concerns, or delayed delivery. In assessing popularity,
    product return performance metrics should be considered, particularly those attributed
    to fit or quality issues. The only positive performance-based popularity can show
    the products with high return rate up in the list and that leads to increase in
    the operational costs.


    Efficiency measures gauge how effectively a product contributes to driving performance
    metrics. These measures include ratios such as click-through rate, cart add rate,
    and conversion rate, reflecting the product’s ability to deliver outcomes when
    given the opportunity. However, efficiency metrics can be misleading when based
    on small sample sizes. For instance, if a product is viewed by only five visitors
    and receives one order, the conversion rate appears high at 20%. Yet, this may
    not provide sufficient evidence to support the efficacy of the metrics. Therefore,
    it’s essential to consider performance measures alongside efficiency metrics to
    ensure a comprehensive evaluation of a product’s effectiveness.


    New arrivals often lack established performance and efficiency metrics. However,
    these products play a vital role in infusing freshness onto the platform and sparking
    interest among potential buyers. Additionally, well-known brands possess their
    own captive audiences and hold aspirational appeal among visitors. Therefore,
    factors such as newness, brand recognition, along with clicks and views, can serve
    as indicators of great potential for these products.


    Moreover, when a brand previously exclusive to a competitor’s ecommerce platform
    becomes available on a platform, certain products from that brand may capture
    the attention of users. Despite the absence of performance metrics on the ecommerce
    platform, indicators such as product ratings, reviews, and rankings on the competitor
    platform can offer insights into their potential popularity. Therefore, these
    metrics can be factored into assessing the popularity of these products on the
    ecommerce platform.


    Lastly, but certainly not least, diversity and novelty are crucial considerations
    when showcasing products on an ecommerce platform, especially within the realm
    of fashion ecommerce. The inclusion of diverse products and the introduction of
    novel products not only enrich the shopping experience but also cater to a broader
    range of tastes and preferences among buyers. This emphasis on diversity and novelty
    helps keep the platform dynamic and engaging, encouraging continued exploration
    and discovery for shoppers [[8](#630035_1_En_6_Chapter.xhtml#CR8)].


    ## Ranking Function


    A method for combining multiple attributes into a composite factor used for ordering
    products in commerce is referred to as ranking [[1](#630035_1_En_6_Chapter.xhtml#CR1)].
    In ecommerce, ranking is a function of performance, potential, and efficiency
    characteristics that can be used for rearranging products. These factors are integrated
    into a rank score that determines how products are ordered and displayed. This
    can be mathematically represented as


    *   Rank Score = f(Performance, Potential, Efficiency)


    In ecommerce, ranking products involves assessing performance, potential, and
    efficiency to ensure relevant products are prioritized. Performance metrics such
    as product views, orders, and sales amount reflect current success and popularity.
    Potential indicators, like emerging growth in views and the newness of products,
    gauge future prospects and increasing interest. Efficiency measures, including
    click-through rates and conversion rates, evaluate how well products convert opportunities
    into actual sales. By integrating these factors, ecommerce platforms can create
    a comprehensive ranking system that balances immediate success with future potential,
    optimizing product visibility and relevance.


    The functional form for ranking can vary from simple linear models to more complex
    algorithms, depending on the specific ranking system employed. Linear models use
    straightforward calculations to determine ranks, often based on weighted sums
    of performance metrics. In contrast, complex algorithms may incorporate advanced
    techniques, such as machine learning or neural networks, to analyze and rank products
    based on a multitude of factors and interactions. The choice between linear and
    complex models depends on the goals of the ranking system and the sophistication
    required to achieve accurate and relevant product placements.


    In summary, the ranking function can be constructed as either deterministic or
    predictive. Before discussing the details of a ranking functional form, it is
    useful to provide a historical perspective on ranking and its applications beyond
    ecommerce.


    ### Ranking – A Brief History


    The application of ranking has become ubiquitous in our digital lives, influencing
    our choices and decisions across a wide range of online activities. Their history
    dates back to the 1940s, when the concept of ranking emerged in the field of economics.
    For decades, ranking systems have been widely used to evaluate colleges and universities
    [[3](#630035_1_En_6_Chapter.xhtml#CR3)]. However, it was the development of the
    PageRank algorithm by Google in 1998 [[2](#630035_1_En_6_Chapter.xhtml#CR2), [4](#630035_1_En_6_Chapter.xhtml#CR4),
    [5](#630035_1_En_6_Chapter.xhtml#CR5)] that truly propelled ranking algorithms
    into the mainstream.'
