- fmt: '对话式AI可以协助客服团队处理客户请求。某些需求可由全天候（24/7）在线的对话机器人处理。对话式聊天机器人运用自然语言处理（NLP）和机器学习分类模型，根据买家意图对其查询进行分类。一旦意图被确定，聊天机器人会在系统中搜索相关信息，并生成定制化的回复。这种个性化方法确保买家获得最恰当、最有帮助的信息。此外，AI和ML算法能够更准确地提升呼叫量预测和支持人员需求规划，减少对人工和重复性任务的依赖，并实现智能流程自动化。


    呼叫量预测模型可以通过统计和机器学习两种方法开发。像`ARIMA`（自回归积分滑动平均模型）这样的统计模型可以捕捉时间序列数据中的线性趋势和季节性模式。另一方面，诸如`LSTM`（长短期记忆网络）之类的深度学习方法，则非常适合处理时间序列数据中复杂的非线性模式，使其成为呼叫量预测的一个有前景的选择。


    电商平台通过展示来自同行购物者的评论和评分，来利用用户生成内容的力量。这个庞大的同行反馈池在影响买家决策方面起着关键作用。然而，为了确保这些评论的可信度和价值，许多平台在评论上线前会实施审核流程。


    此外，一些平台通过运用自然语言处理（NLP）技术，超越了基础的评论功能。这些方法允许生成评论摘要，突出关键点、积极方面和相关用户标签。这种简洁的格式有助于用户快速掌握特定产品用户评价的整体情感倾向。包括`BERT`、`RoBERTa`和`GPT-3`在内的Transformer模型，对于提升电商平台上的产品评论至关重要。这些先进的语言模型有助于生成简洁的摘要和相关标签，从而显著改善整体用户体验。图[2-4](#630035_1_En_2_Chapter.xhtml#Fig4)展示了产品评论如何被摘要并呈现给买家。


    ![](images/630035_1_En_2_Chapter/630035_1_En_2_Fig4_HTML.jpg)


    图 2-4

    评论中的关键亮点


    总之，为了促进买家在电商平台上的购物旅程，一个典型电商平台的关键部分包括搜索与浏览、优惠与折扣、支付和配送信息。此图概述了引导买家在平台上完成购物体验所必需的基本组件。


    图[2-5](#630035_1_En_2_Chapter.xhtml#Fig5)概述了电商平台上买家可用的典型功能，展示了平台的“买方侧”特性。


    ![](images/630035_1_En_2_Chapter/630035_1_En_2_Fig5_HTML.jpg)


    图 2-5

    买方侧电商平台的关键功能


    虽然从买家角度来看，搜索、导航、产品列表、评论、推荐、支付和订单管理都是电商平台的关键方面，但还有一些重要的功能在幕后运作，以确保无缝的购买体验。这些功能围绕产品和库存管理（如列出产品和确保可用性）、优惠券配置（确定哪些优惠券可用及对谁可用）、产品定价（管理产品价格更新）、订单管理（分配订单处理责任并向相关方传达订单旅程信息）等展开。这些元素属于电商平台的卖方侧，这将是下一节的重点。


    ## 电商平台：数字化赋能卖家


    Mehar是印度喀拉拉邦一个小村庄里一位才华横溢的手工艺品制作者。电商平台让他能够将作品销售给全国观众，这有可能吸引更多顾客，有助于保护印度传统手工艺，并为他的家庭带来更好的收入。这些并非孤例；数百万卖家也通过这些电商市场平台获得了数字化赋能。


    像Flipkart、亚马逊等电商平台正在为全印度的卖家创造民主化的准入机会。它们赋能卖家，使其能够接触到海量买家来展示产品，并发挥他们的专长——更好的设计、创意、有竞争力的价格或差异化的产品。


    这些平台为卖家提供了所有技术功能（如创建产品列表、订单处理、库存管理等），使他们无需担心技术变革或进步即可在线开展业务。甚至无需任何承诺或前期成本。大多数平台会根据卖家从平台获得的业务价值收取佣金。


    这些电商平台还为卖家提供了覆盖全印度的大量受众或买家基础，消除了实体店的局限性，并缩短了业务培育期。


    此外，这些平台使卖家能够在平台上推广他们的产品（通过赞助列表进行产品级推广），或者将他们的页面推广到社交媒体平台。这些电商平台通过自营物流车队或第三方物流合作伙伴来处理配送，使卖家无需担心实际的配送和履行服务。


    以Maya为例，她是一位年轻的女性珠宝设计师。她在拉贾斯坦邦的斋浦尔拥有一家名为“Maya''s Mystic Jewellery”的手工时尚珠宝店。她希望将产品带给更广泛的受众，并决定入驻印度领先的市场平台之一。


    Maya在电商平台注册，并提交了作为卖家所需的所有支持文件。一旦她在平台上注册了品牌，她就会列出所有产品。


    需要清晰简洁的产品详细信息，例如标题、描述、相关关键词和有吸引力的产品视觉效果。从多个角度拍摄的高分辨率照片，包括展示细节和差异的特写镜头，有助于买家做出购买决定。一些卖家会寻求专业机构的帮助，以在平台上正确地列出产品。该平台还具有验证和审核功能，以确保没有虚假或恶意卖家列出产品，从而降低平台风险。AI赋能的电商平台根据上传的产品图片，协助Maya生成产品描述、创建产品分类并填写其他详细信息。此外，基于计算机视觉的方法可以通过创建引人注目的图像和视觉内容来提升买家参与度。


    考虑到这些平台的规模，AI/ML解决方案是管理产品入驻和审核流程的救星。以开放市场平台Meesho为例，看看它如何管理其平台上的产品评论。


    ***案例研究**：Meesho 利用深度学习解决产品标签问题* *[*[12](#630035_1_En_2_Chapter.xhtml#CR12)*]*


    *背景：Meesho是印度第三大市场（市场份额7%），仅次于亚马逊和Flipkart* *[*[11](#630035_1_En_2_Chapter.xhtml#CR11)*]，服务于数百万卖家，主要来自印度较小的城市（三线和四线城市）。这些卖家中的许多人缺乏必要的技术专长，无法使用所需的产品层级（分类法）正确地对产品进行分类。这使得Meesho在用户搜索和浏览时难以展示相关产品。*'
  raw: 'A conversational AI can assist the customer service team in addressing customer
    requests. Certain requirements can be handled by conversational bots, which are
    available 24/7\. Conversational chatbots employ Natural Language Processing (NLP)
    and machine learning classification models to categorize buyer inquiries based
    on their intent. Once the intent is determined, the chatbot searches for relevant
    information within the system and crafts a tailored response. This personalized
    approach ensures the buyer receives the most appropriate and helpful information.
    Moreover, AI and ML algorithms can enhance call volume forecasts and support staff
    requirements with higher accuracy, reduce dependency on manual and repetitive
    tasks, and enable intelligent process automation.


    The call volume forecasting models can be developed using both statistical and
    machine learning approaches. Statistical models like ARIMA (AutoRegressive Integrated
    Moving Average) can capture linear trends and seasonal patterns in time series
    data. On the other hand, deep learning methods such as LSTM (Long Short-Term Memory)
    are well-suited for handling complex, non-linear patterns in time series data,
    making them a promising option for call volume prediction.


    Ecommerce platforms leverage the power of user-generated content by displaying
    reviews and ratings from peer shoppers. This vast pool of peer-to-peer feedback
    plays a crucial role in influencing buyer decision-making. However, to ensure
    the credibility and value of these reviews, many platforms implement a review
    approval process before these go live.


    Furthermore, some platforms go beyond basic reviews by utilizing Natural Language
    Processing (NLP) techniques. These methods allow for the creation of summarized
    reviews, highlighting key points, positive aspects, and relevant user tags. This
    concise format helps users quickly grasp the overall sentiment of user experiences
    for a particular product. Transformer models, including BERT, RoBERTa, and GPT-3,
    are essential for enhancing product reviews on ecommerce platforms. These advanced
    language models facilitate the generation of concise summaries and relevant tags,
    thereby significantly improving the overall user experience. Figure [2-4](#630035_1_En_2_Chapter.xhtml#Fig4)
    shows how product reviews could be summarized and shown to the buyers.


    ![](images/630035_1_En_2_Chapter/630035_1_En_2_Fig4_HTML.jpg)


    Figure 2-4


    Key highlights from reviews


    In summary, to facilitate the customer purchase journey on an ecommerce platform,
    key sections of a typical ecommerce platform include search and browse, offer
    and discounts, payment, and delivery information. This figure provides an overview
    of the fundamental components crucial for guiding buyers through their shopping
    experience on the platform.


    Figure [2-5](#630035_1_En_2_Chapter.xhtml#Fig5) provides an overview of the typical
    functionalities available to buyers on an ecommerce platform, illustrating the
    “Buy Side” features of the platform.


    ![](images/630035_1_En_2_Chapter/630035_1_En_2_Fig5_HTML.jpg)


    Figure 2-5


    Key functionalities of buyer-side ecommerce platform


    While search, navigation, product listings, reviews, recommendations, payments,
    and order management are all critical aspects of an ecommerce platform from the
    buyer’s perspective, there are also essential functionalities working behind the
    scenes to ensure a seamless buying experience. These functionalities revolve around
    products and inventory management (such as listing products and ensuring availability),
    coupon configuration (determining which coupons are available and for whom), product
    pricing (managing product price updates), order management (assigning order processing
    responsibilities and communicating order journey information to relevant parties),
    and more. These elements are part of the seller side of the ecommerce platform,
    which will be the focus of the next section.


    ## Ecommerce Platform: Empowering Sellers Digitally


    Mehar is a talented handicraft maker in a small Indian village in Kerala. Ecommerce
    platforms allow him to sell his creations to a national audience, potentially
    attracting more customers and contributing to the preservation of traditional
    Indian craftsmanship and also get better earnings for his family. These are not
    isolated examples; millions of sellers are also empowered digitally by these ecommerce
    marketplace platforms.


    The ecommerce platforms such as Flipkart, Amazon, and many more are creating democratized
    access for sellers across India. They are empowering sellers to get a vast volume
    of buyers to show their products and offer them what they do the best – better
    designs, creations, competitively priced products, or differentiated products.


    These platforms provide all the technology functionalities (such as creating product
    listing, order processing, inventory management, etc.) for them to do business
    online without any worry of the technology changes or advancements. Even without
    any commitment or up-front costs. Most of these platforms take commission on the
    business values these sellers get from the platform.


    These ecommerce platforms also enable sellers with a wide pull of audiences or
    buyers base across India, eliminating limitations of physical stores and reduced
    gestation period.


    In addition, these platforms enable sellers to promote their products on-platform
    along with product level promotions (via sponsored listing) or they can promote
    their pages to social media platforms. These ecommerce platforms take care of
    delivery either via their own logistics fleet or via third party logistics partners,
    making it easy for the sellers to not worry about the actual delivery and fulfillment
    services.


    Consider the example of Maya, a young woman, who is a jewelry designer. She has
    her own handicraft fashion jewelry shop in Jaipur, Rajasthan with the name “Maya’s
    Mystic Jewellery.”. She wants to take her products to wider audiences and decided
    to be one of the leading marketplace platforms in India.


    Maya registers on the ecommerce platform with all the supporting documents required
    for her to be a seller on the platform. Once she has registered her brand on the
    platform, she lists all the products on the platform.


    Clear and concise product details such as title, description, relevant keywords,
    and attractive product visuals are required. A high-resolution photo from multiple
    angles, including close-ups to showcase details and variations, helps buyers in
    their purchase decisions. Some of the sellers take help of professional agencies
    to properly list products on these platforms. The platform also has validation
    and review functionalities to ensure that none of the fake or malicious sellers
    list their products to reduce risk for these platforms. The AI-enabled ecommerce
    platform assists Maya in generating product descriptions, creating product taxonomy,
    and filling in other details based on the uploaded product images. Additionally,
    computer vision-based methods can enhance buyer engagement by creating compelling
    images and visual content.


    Considering the scale of these platforms, AI/ML solutions are a savior for them
    to manage product onboarding and review processes in check. Consider a case study
    of the open marketplace platform Meesho and how it manages product reviews on
    its platform.


    ***Case Study**: Meesho Tackles Product Tagging with Deep Learning* *[*[12](#630035_1_En_2_Chapter.xhtml#CR12)*]*


    *Context: Meesho, India’s third-largest marketplace (7% market share) behind Amazon
    and Flipkart* *[*[11](#630035_1_En_2_Chapter.xhtml#CR11)*], caters to millions
    of sellers, primarily from smaller Indian cities (Tier 3 and 4). Many of these
    sellers lack the technical expertise to properly categorize their products using
    the required product hierarchy (taxonomy). This makes it difficult for Meesho
    to display relevant products to users during searches and browsing.*'
