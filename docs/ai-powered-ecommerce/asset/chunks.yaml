- fmt: '# Ranking in Ecommerce


    Every day, hundreds of thousands of shoppers visit ecommerce platforms and utilize
    search functionality to find products. Manisha, a regular ecommerce shopper, recently
    wanted to explore sarees on her preferred mobile app. She entered the search term
    “printed saree” and was presented with a message indicating over 77,000 available
    options.


    ![](images/630035_1_En_6_Chapter/630035_1_En_6_Fig1_HTML.jpg)


    Figure 6-1 Display of product counts


    With over 77,000 options available and each page displaying only 50 products,
    it would be overwhelming for Manisha to explore all the choices. This challenge
    is not unique to her search but is common across many queries, as a significant
    proportion of ecommerce searches consist of short phrases, typically fewer than
    four words. Moreover, not all products are equally relevant; some listings may
    be outdated and irrelevant due to evolving fashion trends, while others are trending
    and garnering substantial attention from buyers. What mechanism should be used
    to display the top 50 most relevant products to buyers? The ranking algorithm
    is one such mechanism.


    The ranking system prioritizes and displays the top 40 most relevant products.
    Details of how this ranking is achieved will be explored further in the chapter.


    ![](images/630035_1_En_6_Chapter/630035_1_En_6_Fig2_HTML.jpg)


    Figure 6-2 Navigation and product counts


    Manish explores another ecommerce platform and navigates through its product taxonomy.
    She encounters over 6000 options, but only 40 products are displayed on the first
    page. These 40 products are carefully selected and arranged to ensure they are
    the most relevant to her search.


    The science of arranging these products for the search or navigation is referred
    to as ranking. On the ecommerce platform, the products are ranked in multiple
    ways – Popularity, Price – Low to High, Price – High to Low, New Arrivals, Discount
    – High to Low, Fastest Shopping Time, etc.


    Some of these methods of sorting or ordering are one dimensional. For example,
    arranging by low to high price, showing the product with lowest price on the top
    and maximum price at the bottom. The price is already in the data and sorted accordingly
    before displaying on the web pages. This feature enhances the shopping experience
    by allowing buyers to quickly find products that meet their price criteria. However,
    the complexity lies in ensuring that sorting algorithms efficiently handle large
    inventories and diverse pricing structures. Additionally, sorting by price alone
    does not account for other crucial factors like product popularity, reviews, or
    recent trends, all of which can impact the overall shopping experience.


    ![](images/630035_1_En_6_Chapter/630035_1_En_6_Fig3_HTML.jpg)


    Figure 6-3 Sorting options on an ecommerce


    Source: [`https://www.nykaafashion.com/`](https://www.nykaafashion.com/)


    One of the options of ranking is the arranging based on popularity and is available
    across platforms – Amazon India, Myntra, or Nykaa Fashion, etc. Why is this option
    available? How do you define this popularity?


    Arranging products based on popularity is complex due to the multifaceted nature
    of the term “popularity.” Popularity can be measured by various metrics, including
    the number of clicks a product receives, its growth in visibility, or its overall
    sales volume. These metrics often do not align perfectly; for instance, a product
    with high click-through rates (CTR) may not translate into high sales if it does
    not convert well, while a product with strong sales may not have received as many
    clicks but could have higher buyer satisfaction and alignments. Additionally,
    factors such as lower-priced items often garner more views, and promotional activities
    can significantly impact conversion rates.


    Machine learning models can balance these elements, enabling a comprehensive view
    of product popularity. And this is called popularity score or relevance score.
    This composite popularity score is then used to rank products effectively on ecommerce
    platforms, ensuring that the most relevant and influential products are highlighted
    on product listing pages.


    As demonstrated through Manisha’s search and navigation journeys, a vast array
    of products competes for top placement on ecommerce platforms. With only 40 or
    50 slots available on the first page, selecting the most relevant products requires
    an effective algorithm. This is crucial, as buyers typically explore only a few
    pages before making decisions. Figure [6-4](#630035_1_En_6_Chapter.xhtml#Fig4)
    illustrates how click-through rates (CTR) decline exponentially across subsequent
    pages, highlighting the importance of ensuring that the most pertinent products
    are prominently featured on the initial pages.


    ![](images/630035_1_En_6_Chapter/630035_1_En_6_Fig4_HTML.jpg)


    Figure 6-4 Ranks and click through rate (CTR)


    In web searches, the click-through rate (CTR) experiences a notable decrease from
    the first position (34.2%) to 7.4% for the fifth position [[7](#630035_1_En_6_Chapter.xhtml#CR7)].


    Similarly, both the click-through rate and the conversion rate decrease exponentially
    as the product position shifts, and also from the first page to subsequent pages
    on the ecommerce platform. This trend may be attributed to the presence of relevant
    products at the top, and/or potentially causing browsing visitors to disengage
    if they fail to find relevant products early in their journey.


    The goal is to show the products at higher positions that will increase the likelihood
    of clicks and conversions. However, only a select few products can attain top
    positions. This is pivotal for both buyers, who desire the most relevant products,
    and the ecommerce platform, which seeks to promote products that boost sales and
    conversions.


    When Manisha is unregistered or not logged in, her choices and preferences are
    less understood. However, the platform cannot simply choose products randomly
    for each position. Instead, it should display products based on a mechanism that
    enhances the likelihood of clicks and sales. If products are popular, indicating
    that more buyers find them relevant and useful, there is an increased chance that
    some of these buyers share similar preferences with Manisha, making those products
    relevant to her as well. So, the popularity improves the chances of increasing
    relevance to buyers and also delivering better outcomes for the platform.


    In the ecommerce landscape, product popularity can have different shades based
    on distinct performance characteristics. For example, there are products with
    high order counts, attributed to their longevity in the market and competitive
    pricing below the platform’s average selling price. These items, often low-ticket,
    benefit from substantial discounts. Conversely, newly launched product series,
    endorsed by brands and promoted on social media platforms like Instagram, garner
    high clicks but comparatively lower conversion rates. Despite their popularity,
    these products yield lower order volumes. Luxury brands and products, on the other
    hand, boast higher-priced items with fewer sales, yet generate substantial revenue
    due to their premium nature.


    Selecting the most suitable products for individual buyers in light of these diverse
    scenarios is a complex task. It requires a comprehensive consideration of multiple
    factors such as pricing, discounts, promotions, and brand appeal. Relying on a
    single factor alone is insufficient to determine popularity of the products; popularity
    is a multi-dimensional measure in ecommerce.'
