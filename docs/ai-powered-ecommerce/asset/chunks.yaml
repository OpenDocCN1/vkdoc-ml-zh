  trans: '

    ## 推荐引擎 – 商业影响


    一个精心设计的推荐引擎能够显著提升电商平台上的买家体验。通过根据每位买家的偏好和浏览历史提供精心筛选的产品选择，推荐引擎可以增加买家参与度、提高转化率，并有可能提升每笔订单的交易额。此外，基于推荐引擎洞察的个性化电子邮件或
    WhatsApp 营销活动能够吸引买家访问平台并培养忠诚度。常见的推荐算法包括协同过滤、基于内容的过滤以及混合算法。


    除了电子商务领域，推荐引擎还广泛应用于从医疗保健到酒店等各个行业[4]。推荐引擎被用于不同行业的多种应用场景。在医疗保健领域，它们根据病史、症状及其他相关信息提供个性化治疗建议，并根据分子结构和相互作用推荐候选药物。在酒店行业，推荐引擎根据旅行历史和客人偏好推荐酒店，并通过推荐附加服务和设施来识别追加销售机会。像
    Spotify 和 Netflix 这样的平台已经大规模利用推荐引擎来驱动差异化并提升用户体验，从而在各自的市场中脱颖而出。


    根据麦肯锡的一份报告[5]，推荐引擎为亚马逊贡献了超过 35%的购买量。当买家在平台上与个性化推荐互动时，他们的转化率提高了 70%，并且平均订单价值也有所增加[5]。


    研究[5]表明，当买家遇到糟糕的推荐时，38%的美国数字购物者会停止购物。对于一家大型欧洲 IPTV 提供商来说，高达 30%的推荐会带来后续购买，预估的提升系数（销售额增长）为
    15%[7]。


    推荐在电子商务中扮演着关键角色，从吸引买家参与平台到提高转化率[6]。因此，大多数领先平台都具备推荐功能，范围从展示个性化产品到推荐互补商品。


    推荐引擎对于为每位买家创建个性化的数字商店至关重要。杰夫·贝佐斯在 21 世纪初就构想出了这一概念，他表示：“如果我们有 450 万买家，我们不应该只有一家商店，而应该拥有
    450 万家商店”[7]。


    亚马逊的个性化数字商店体现了推荐引擎的实际威力[9]。通过利用先进机器学习技术的复杂组合，亚马逊为每位买家（无论是在网站还是移动应用上）创建了近乎个性化的数字店面。当现有买家登录时，主页会根据其过往购买记录进行个性化推荐，突出显示买家可能想要再次购买的商品。亚马逊的系统还会考虑多种因素，如购买历史、星期几、位置以及其他情境数据。这种全面的方法整合了从协同过滤到基于深度学习的推荐等多种算法，确保买家获得高度相关且个性化的建议。


    算法是如何为每位买家创建个性化商店的呢？让曼尼莎在电商平台上的各个接触点都参与其中的科学原理是什么？


    ### 相似性科学：打造个性化选择


    在打造个性化推荐时，核心问题是：这些算法如何实现塑造我们在线体验的多样化应用场景？


    其核心重点是为每位个体买家精心筛选出深度相关的选择，而基本原则就是相似性。因此，微软研究员阿米特·夏尔马在 Quora 上表示：“推荐系统无非就是‘相似性猎手’。”买家偏好与特定选择之间的相似度越高，买家觉得它有吸引力并参与其中的可能性就越大。


    电子商务中有大量的推荐场景或功能，下面列举了其中一些典型的例子。


    *   **相似产品**：寻找与买家当前正在查看的产品相似的选择，从而在同一类别中丰富他们的选择。

    *   **经常一起购买**：推荐经常被一起购买的产品。例如，如果买家将智能手机加入购物车，那么屏幕保护膜和保护壳可能就是相关的推荐。

    *   **购买此商品的顾客也购买了**：通过展示其他购买了此商品的买家也一起购买的产品来引导用户。

    *   **搭配风格**：通过推荐互补商品来鼓励用户探索更多商品。例如，如果买家正在浏览一件黑色连衣裙，它可能会推荐一件黑色西装外套来完成整体造型。

    *   **为你推荐**：根据买家的购买历史进行个性化产品推荐。旨在帮助买家发现他们可能感兴趣的新产品。

    *   **根据您的浏览历史推荐**：这种推荐类型类似于“为你推荐”，但更侧重于买家最近浏览过的产品。旨在帮助买家找到他们已经在考虑的产品。


    考虑一下**热门商品**的场景：当一款产品势头正劲，表明有大量买家正在购买或表现出兴趣时，它就成为了相关性的风向标。这种流行度的激增意味着，与更广泛受众偏好一致的买家，喜欢该产品的可能性也会增加。在缺乏特定买家洞察的情况下，热门商品尤其有价值，它作为一种首选选项，能够捕捉市场的集体脉搏。


    **相似产品**是另一个复杂的方面，当买家对特定产品表现出兴趣时便会发挥作用。通过展示与当前正在探索的商品相似的商品，买家找到自己喜欢东西的几率就会增加。产品相似性的构建是微妙的，不仅要考虑历史购买和浏览等显性数据，还要考虑评分和评论等隐性反馈。推荐引擎会仔细评估这些参数，确保推荐的产品与买家的偏好产生共鸣。


    图 5-2 展示了在电商平台的产品详情页上显示相似产品推荐的简单布局。


    ![](img/630035_1_En_5_Fig2_HTML.jpg)


    图 5-2


    相似产品组件


    进一步深入推荐领域，我们遇到了**购买此商品的顾客也购买了**这一概念。这里的目标是发掘可能吸引买家兴趣的新产品。关键在于识别具有相似品味和偏好的买家。通过检查这些相似买家所做的选择，引擎可以推断出当前买家的潜在兴趣。这里的基本假设是深刻的：相似的买家倾向于欣赏相似的选择。通过将当前买家的偏好与其同类买家的偏好对齐，引擎扩展了可能性的范围，呈现出那些有望带来未知吸引力的选择。

    '
- fmt: '# 推荐引擎架构：打造个性化选择


    本质上，推荐引擎的贡献在于其利用买家行为的能力，通过绘制相似性线索，为电子商务平台上的卓越体验创建个性化且引人入胜的选择列表。这些算法基于**相似性科学**，重新定义了我们在电子商务平台上的导航方式，确保呈现的每一个选择不仅是一个选项，更是一份量身定制的邀请，专为个体买家设计。


    借鉴从相似性科学中获得的见解，我们踏上一段旅程，探索关键组件之间的相互作用如何为每位买家编排并提供卓越的选择。


    ## 推荐引擎架构：打造个性化选择


    在推荐引擎领域，数据是石油，是驱动这些系统的燃料。算法在将这些数据编织在一起方面发挥着至关重要的作用，它们使用各种相似性度量来最大化其有效性。创建有效的推荐系统不仅仅是简单地将数据输入算法。评估其性能并持续优化是基于机器学习的推荐系统的一个基本方面。让我们深入探讨在推荐引擎中塑造个性化选择过程的关键组件。这些组件包括：


    1.  数据

    2.  相似性度量

    3.  算法

    4.  评估


    *图* [*5-3*](#630035_1_En_5_Chapter.xhtml#Fig3) *展示了推荐引擎架构和关键组件*


    ![](images/630035_1_En_5_Chapter/630035_1_En_5_Fig3_HTML.jpg)


    **图 5-3** 推荐引擎的概念层面


    ### 1. 数据


    对于电子商务场景，一系列数据点，如点击、搜索、浏览、购买和加入购物车，是理解买家兴趣和行为的基石。这些隐式线索揭示了特定的买家偏好，引导算法做出量身定制的选择。一些平台甚至捕获人口统计和地理属性，从而提供对买家相似性的细致理解。此外，电子商务买家还通过提供数字评分（如星级评分）和对其购买产品的书面评价来提供显式反馈。这种反馈可用于衡量买家是否喜欢某个特定产品或选择。买家与产品的交互——购买/点击和/或评分——对于向买家展示相关选择至关重要，这些交互分别被归类为隐式和显式。


    电子商务目录本身就是一个信息宝库。包含类别、描述、价格和规格的产品详情丰富了推荐过程。具体来说，它增强了诸如“相似产品”之类的结构，提升了引擎呈现紧密相关商品的能力。


    ### 2. 相似性度量


    相似性度量是推荐引擎的关键，它允许根据买家或产品的特征和交互来识别它们之间的相似性。推荐引擎本质上就是一个相似性机器。


    相似性度量的选择取决于数据的性质和推荐结构。根据上下文定制相似性度量可确保计算出的相似性反映关键特征之间的关系。


    相似性度量的选择会显著影响推荐的质量。例如，`cosine similarity`测量两个向量之间的角度，非常适合稀疏数据，如用户-项目评分矩阵。相比之下，`Euclidean
    distance`计算两个数据点之间的直线距离，对于向量具有非零值的密集数据更为相关。它也对数据的量级敏感。在电子商务场景中，处理像产品评分这样的数值数据时，`Euclidean
    distance`可能更有效。然而，对于基于稀疏产品-买家交互矩阵的协同过滤，`cosine similarity`通常因其高效处理稀疏性的能力而产生更好的结果。


    以下是一些常见的相似性度量：


    *   **余弦相似度**：非常适合比较表示为向量的产品或买家，`cosine similarity`测量n维空间中两个非零向量之间的角度。它揭示了它们方向上的相似性，提供了对其兼容性的见解。


    *   **皮尔逊相关系数**：适用于处理不同的评分尺度和缺失值，该度量衡量两组数据点之间的线性相关性。它揭示了关系的强度和方向，有助于理解用户-产品亲和度。


    *   **杰卡德相似度**：专为二元数据（如用户-项目交互）定制，`Jaccard similarity`计算两个集合中非零元素的交集与并集之比。它量化了项目之间的重叠，指示了共享的用户偏好。


    *   **欧几里得距离**：计算n维空间中两点之间的直线距离，`Euclidean distance`量化了表示为坐标的项目或用户之间的不相似性。它辨别空间分离，揭示了偏好的差异性。


    *   **曼哈顿距离**：与`Euclidean distance`不同，`Manhattan distance`测量基于网格的距离，对坐标的绝对差求和。该度量对异常值不太敏感，并能提供对网格中邻近度的稳健理解，从而洞察买家-项目关系。


    根据数据的独特特征和特定的推荐上下文，明智地结合使用这些度量，可确保机器学习算法编排出一曲个性化选择的交响乐，提升电子商务平台上的用户满意度和参与度。


    **为什么 Netflix 推荐引擎使用余弦相似度？**


    Netflix 使用`cosine similarity`来衡量用户和电影之间的相似性。每个用户和电影都被表示为一个向量，电影向量的维度可能包括电影的类型、演员阵容和导演。通常，一个用户只对少数几本书进行评分或评论，导致大多数书籍未被评分；同样，许多书籍也只收到来自一小部分用户的评分。`Cosine
    similarity`非常适合稀疏数据，因为它测量的是向量之间的角度，而不是它们的量级。它关注非零维度，使其适用于高维、稀疏填充的数据，如用户-电影交互。此外，`cosine
    similarity`度量计算效率高。


    ### 3. 算法


    推荐引擎算法使用数据和相似性度量来生成个性化推荐。有许多不同的推荐引擎算法，每种都有其自身的优缺点。两种基础方法是协同过滤和基于内容的过滤。在深入探讨协同过滤和基于内容的过滤的工作原理之前，理解它们在推荐系统背景下的演变非常重要。'
  raw: 'In essence, the recommendation engine’s contribution lies in its ability in
    using buyer behaviors, drawing threads of similarity to create a personalized
    and enchanting choice list for great experience on eCommerce platform. These algorithms,
    grounded in the **science of similarity**, redefine how we navigate across ecommerce
    platforms, ensuring that every choice presented is not just an option but a tailored
    invitation, designed exclusively for the individual buyers.


    Drawing upon the insights gleaned from the science of similarity, we embark on
    a journey to explore how the interplay of key components orchestrates the delivery
    of exceptional choices for each buyer.


    ## Recommendation Engine Architecture: Crafting Personalized Choices


    In the realm of recommendation engines, data is the oil, serving as the fuel that
    powers these systems. Algorithms play a crucial role in weaving this data together,
    using various similarity measures to maximize their effectiveness. Creating effective
    recommender systems goes beyond simply throwing data at algorithms. Evaluation
    of its performance and continuously refining it is a fundamental aspect of machine
    learning-based recommendation systems. Let’s delve deeper into the key components
    that shape the process of creating personalized choices in recommendation engines.
    These components are


    1.  Data


    2.  Similarity measures


    3.  Algorithms


    4.  Evaluation


    *Figure* [*5-3*](#630035_1_En_5_Chapter.xhtml#Fig3) *for showing Recommendation
    Engine Architecture and key components*


    ![](images/630035_1_En_5_Chapter/630035_1_En_5_Fig3_HTML.jpg)


    Figure 5-3


    Conceptual facets of recommendation engine


    ### 1\. Data


    For ecommerce scenarios, an array of data points such as clicks, searches, views,
    purchases, and cart additions serve as the bedrock for understanding buyer interests
    and behaviors. These implicit cues shed light on specific buyer preferences, guiding
    the algorithm toward tailored choices. Some platforms even capture demographic
    and geographic attributes, providing a nuanced understanding of buyer similarities.
    Additionally, Ecommerce buyers also provide explicit feedback by providing numerical
    ratings (such as star ratings) and written reviews for products they have purchased.
    This feedback can be used to measure whether a buyer liked a particular product
    or choice. The interactions of buyers and products – purchase/clicks and/or rating
    are crucial for showing relevant choices to the buyers and these are characterized
    as implicit and explicit, respectively.


    The ecommerce catalog itself stands as a treasure trove of information. Product
    details encompassing categories, descriptions, prices, and specifications, the
    catalog enriches the recommendation process. Specifically, it bolsters constructs
    like “similar products,” enhancing the engine’s ability to present closely related
    items.


    ### 2\. Similarity Measures


    Similarity measures are the linchpin of recommendation engines, allowing for the
    identification of resemblances among buyers or products based on their characteristics
    and interactions. A recommendation engine is nothing but a similarity machine.


    The choice of a similarity measure hinges upon the nature of the data and a recommendation
    construct. Tailoring the similarity measure to the context ensures that calculated
    similarities reflect the relationships across key characteristics.


    The choice of similarity measure can significantly impact the quality of recommendations.
    For instance, cosine similarity measures the angle between two vectors and is
    well-suited for sparse data, such as user-item rating matrices. In contrast, Euclidean
    distance calculates the straight-line distance between two data points and is
    more relevant for dense data where vectors have non-zero values. It is also sensitive
    to the magnitude of the data. In an ecommerce scenario, when dealing with numerical
    data like product ratings, Euclidean distance might be more effective. However,
    for collaborative filtering based on sparse product-buyer interaction matrices,
    cosine similarity often yields better results due to its ability to handle sparsity
    efficiently.


    Here are some common similarity measures:


    *   **Cosine Similarity**: Ideal for comparing products or buyers represented
    as vectors, cosine similarity measures the angle between two non-zero vectors
    in an n-dimensional space. It illuminates the similarity in their directions,
    offering insights into their compatibility.


    *   **Pearson Correlation Coefficient**: Suited for handling different rating
    scales and missing values, this measure gauges the linear correlation between
    two sets of data points. It illuminates the strength and direction of the relationship,
    aiding in understanding user-product affinity.


    *   **Jaccard Similarity**: Tailored for binary data, such as user-item interactions,
    Jaccard similarity calculates the intersection over union of non-zero elements
    in two sets. It quantifies the overlap between items, indicating shared user preferences.


    *   **Euclidean Distance**: Calculating the straight-line distance between two
    points in an n-dimensional space, Euclidean distance quantifies the dissimilarity
    between items or users represented as coordinates. It discerns the spatial separation,
    informing about the dissimilarity of preferences.


    *   **Manhattan Distance**: Unlike Euclidean distance, Manhattan distance measures
    grid-based distances, summing the absolute differences of coordinates. This measure
    is less sensitive to outliers and provides a robust understanding of proximity
    in a grid, offering insights into buyer-item relationships.


    Incorporating these measures judiciously, based on the unique characteristics
    of the data and the specific recommendation context, ensures that the machine
    learning algorithms orchestrate a symphony of personalized choices, enhancing
    user satisfaction and engagement on the ecommerce platform.


    Why is Cosine Similarity used for Netflix Recommendation Engine?


    Netflix uses cosine similarity to measure the similarity between users and movies.
    Each user and movie are represented as a vector, the dimensions of the movie vector
    could include the genres of the movie, the cast of the movie, and the director
    of the movie. Often a user rates or reviews only a handful of books, leaving most
    books unrated and similarly, many books receive ratings from only a small subset
    of users. Cosine similarity is ideal for sparse data because it measures the angle
    between vectors rather than their magnitudes. It focuses on the non-zero dimensions,
    making it suitable for high-dimensional, sparsely populated data like user-movie
    interactions. Also, cosine similarity measure is computational efficient.


    ### 3\. Algorithms


    Recommendation engine algorithms use data and similarity measures to generate
    personalized recommendations. There are many different recommendation engine algorithms,
    each with its own advantages and disadvantages. Two foundational approaches are
    collaborative filtering and content-based filtering. Before delving into the workings
    of collaborative filtering and content-based filtering, it’s important to understand
    their evolution in the context of recommendation systems.'
