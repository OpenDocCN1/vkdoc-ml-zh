- fmt: '# 排版后的内容


    Customers who have had positive past experiences or hold a favorable view of the
    platform are likely to come and shop again, without direct results of any CRM
    or Digital campaigns. Word-of-mouth recommendations and brand campaigns on TV
    or digital channels could be other drivers of organic visitors on the ecommerce
    platform. Typical contributions of direct visits should be moving northward with
    the time for a successful ecommerce. Experience suggests that the direct visitors
    on an ecommerce platform could be between 20-40%.


    Marketing teams play a critical role in attracting the right audience to the ecommerce
    platform within budget constraints. They achieve this through a two-pronged strategy.
    First through budget optimization and second by execution excellence. In budget
    optimization, the focus is to use data-driven tools like Market Mix Modelling,
    for strategically allocating budgets across channels like social search and social
    media and maximizing return on ad spend (`ROAS`) across all digital marketing
    campaigns and other marketing channels. On a daily basis, the marketing teams
    can strive for data and Artificial Intelligence-(`AI`)-based operational excellence
    by well-executed campaigns across social media and social search channels, ensuring
    they deliver targeted messages and a seamless user experience.


    Complementing these efforts, the Customer Relationship Management (`CRM`) team
    and `AI` and machine learning (`ML`)-embedded `CRM` systems play a vital role
    in nurturing existing customers, fostering repeat purchases, and building a loyal
    customer base. By leveraging customer data and purchase history, the `CRM` can
    personalize recommendations, offer targeted promotions, and ultimately convert
    one-time buyers into loyal brand advocates.


    Successful performance marketing, brand building campaigns, and `CRM` efforts
    all work together to cultivate customer awareness and interest. Once these initial
    stages attract visitors to the ecommerce platform, the conversion phase becomes
    critical. Here, the focus shifts to engaging these visitors and guiding them through
    the remaining stages of the marketing funnel.


    ## Mid Funnel: Engaging Visitors with Products


    A customer’s initial touchpoint with an ecommerce platform can happen at homepage,
    product listing pages (`PLPs`), or Product Detailed Pages (`PDPs`). Visitors arriving
    through brand awareness efforts like TV commercials or direct visitors land to
    the homepage, whereas targeted marketing campaigns like paid search ads or social
    media promotions often direct users to relevant product categories or brands listing
    pages (`PLPs`) or specific products pages (`PDPs`).


    The mix of visitors entering through these different pages depends on several
    factors, for example, marketing strategy, platform maturity, or brand awareness.
    The ecommerce platforms with a heavy focus on digital marketing might see a higher
    proportion of visitors entering through `PLPs` or `PDPs` due to targeted campaigns.
    Whereas established platforms like Amazon with strong brand recognition might
    see a larger share of visitors entering through the homepage due to direct traffic.


    Understanding visitor source empowers ecommerce platforms to optimize the customer
    journey from each entry point. For visitors arriving through brand awareness efforts
    (e.g., homepage), prioritizing a visually appealing experience is key. This might
    involve stunning product visuals, engaging widgets, a clear search bar, and intuitive
    category navigation. To measure the effectiveness of the homepage, ecommerce platforms
    track the bounce rate – the percentage of visitors who leave the homepage without
    exploring further. Generally, a bounce rate between 20% and 45% is considered
    a good benchmark for ecommerce websites [[20](#630035_1_En_2_Chapter.xhtml#CR20)].


    In the world of ecommerce, site merchandising teams play a critical role in capturing
    customer attention, especially on the crucial homepage. They act as the architects,
    meticulously configuring the layout and various elements that make up this digital
    storefront. The homepage is like an enticing façade for the platform and site
    merchandising teams carefully curate the key “widgets” that entice visitors to
    explore further. Some of the common widgets are Hero Banner, category navigation,
    or featured brand or offer widgets. Machine learning methods, such as Learning
    to Rank (`LTR`) and collaborative filtering, enhance category sequencing on home
    pages, thereby improving personalization.


    The hero banner serves as the first impression, often showcasing seasonal promotions,
    new product launches, or captivating visuals and featured product or offer widgets
    highlighting specific products, special offers, or brand promotions, strategically
    placed to pique visitor interest.


    Site merchandising teams are embracing the power of `AI` and technology to create
    a more engaging and personalized customer experience on the homepage. `A/B` testing
    remains a cornerstone of their strategy, allowing them to continuously optimize
    layouts and refine elements for maximum impact. Machine learning (`ML`) plays
    a key role in digital storefront design. Based on user clicks and purchases data,
    the algorithm can personalize the order of categories displayed on the homepage
    for each visitor. For example, if “women’s kurta sets” have been trending recently,
    the algorithm might prioritize showcasing them first for visitors with relevant
    browsing and purchase history.


    Imagine a homepage that adapts to each visitor’s unique taste and preferences.
    `AI` can personalize various aspects of the homepage, for example, category sequences,
    featured brands, targeted offers, and curated product recommendations.


    *   **Category Prioritization:** Similar to dynamic category navigation, the most
    relevant categories for each visitor are displayed prominently.


    *   **Featured Brands:** Brands that a customer has interacted with or shown interest
    in can be highlighted on the homepage.


    *   **Targeted Offers:** The offer section can showcase deals and promotions from
    credit cards or stores the customer is more likely to use.'
