- fmt: '# Similar Products – Personalized Product Recommendations


    Similar product recommendations are one of the most common features across ecommerce
    platforms. When buyers reach the product detail page (PDP), there are typically
    two ways to reach similar product recommendations: one option is over the product
    image, and the second a widget lower in the page.


    Figure [5-9](#630035_1_En_5_Chapter.xhtml#Fig9) illustrates an example of how
    similar product recommendations are presented on an ecommerce platform.


    ![](images/630035_1_En_5_Chapter/630035_1_En_5_Fig9_HTML.jpg)


    Figure 5-9


    Similar Products


    Around 20–30% buyers visit product-detailed pages on a fashion ecommerce and 15%
    of these buyers explore similar products. The conversion rate is typically 3–4X
    for the buyers who use the similar product recommendations, as these buyers are
    really interested in purchasing the products.


    Similar product recommendations can be created using either content-based or collaborative
    filtering methods. In content-based filtering, product attributes such as color,
    pattern, fabric, sleeve type, collar type, etc. are used to recommend similar
    products. However, these features are not fixed, as trends and preferences change
    over time. Another challenge with content-based filtering is the manual tagging
    of these attributes [[11](#630035_1_En_5_Chapter.xhtml#CR11)].


    Unlike content-based similarity measures, item–item collaborative filtering algorithms
    use buyer signals instead of a taxonomy to compute item–item similarity and underlying
    considerations are co-rating or co-purchases. If products are rated or purchased
    by the same buyers, these two products have similar latent factors that are relevant
    to the buyers.


    Item-based recommendation techniques (also known as model-based) analyze the user–item
    matrix to identify relations between the different items, and then use these relations
    to compute the list of top-N recommendations [[16](#630035_1_En_5_Chapter.xhtml#CR16)].
    Amazon’s “Customers Who Bought This Also Bought” feature is also a prime demonstration
    of Item–Item Collaborative Filtering in action.


    At Myntra, a large ecommerce platform in India, item–item collaborative filtering
    approach is used for creating personalized similar product recommendations [[11](#630035_1_En_5_Chapter.xhtml#CR11)].
    Buyer product interaction data is used for creating a utility matrix – user–item
    interaction matrix. For user–item interaction, three user signals, i.e., product
    clicks, addition of products to cart, and checkout are considered and then estimate
    the relationship between number of product clicks, add to carts, and checkout
    using a linear classification model [[10](#630035_1_En_5_Chapter.xhtml#CR10)].


    This matrix is highly sparse as each buyer typically interacts (purchase or view)
    with only a handful of products out of the vast array of options available. This
    sparsity poses a challenge for traditional recommendation algorithms, which often
    struggle to handle large and sparse datasets effectively. Matrix factorization
    methods are used to convert buyers and products interaction matrix to a lower-dimensional
    latent space. One of the methods used for decomposing the interaction matrix into
    lower dimensional metrics is Alternating Least Squares (ALS) [[21](#630035_1_En_5_Chapter.xhtml#CR21)].


    The input user–item interaction matrix is transformed into two dense matrices:
    the Buyer Features Matrix (U) and the Product Features Matrix (V). These matrices
    capture latent factors or features, with U capturing buyer preferences and V containing
    product attributes that buyers consider implicitly. By comparing each buyer (row
    in the buyer features matrix) to products (columns in the product features matrix),
    we can identify buyer preferences across products.


    Figure [5-10](#630035_1_En_5_Chapter.xhtml#Fig10) illustrates how the utility
    matrix is connected to both the Buyer/Customer Feature Matrix and the Product
    Feature Matrix.


    ![](images/630035_1_En_5_Chapter/630035_1_En_5_Fig10_HTML.jpg)


    Figure 5-10


    Matrix decomposition


    Using the product feature vectors, a non-personalized candidate is generated by
    comparing the product under considerations to the rest of catalog products using
    cosine similarity between the vectors. Then top N similar products were selected
    as candidates for the similar product recommendations.


    For personalized recommendations, the paper used both product–product similarity
    scores and user–product similarity scores. This approach helps in preserving the
    context as well as the effect of personalization.


    In addition to these fundamental approaches – collaborative filtering and content-based
    filtering, deep learning frameworks are employed to address some of the challenges
    around scalability, leveraging diverse information and performance improvements.
    In the next section, an overview of using deep learning for collaborative filtering
    and content-based filtering are discussed.


    # Neural Collaborative Filtering (NCF)


    Collaborative filtering suggests relevant items to users based on their past interactions
    and the interactions of similar users. The Matrix Factorization (MF) method within
    collaborative filtering breaks down the user–item interaction matrix into lower-dimensional
    matrices representing latent factors. MF struggles to capture complex, non-linear
    relationships between users and items.


    Neural Collaborative Filtering (NCF) is a powerful approach that uses deep learning
    to enhance recommender systems. By employing neural networks, NCF can capture
    intricate, non-linear relationships between users and items [[13](#630035_1_En_5_Chapter.xhtml#CR13)].
    This enables NCF to leverage implicit data such as clicks and purchases, resulting
    in more accurate and personalized recommendations. The original NCF paper [[17](#630035_1_En_5_Chapter.xhtml#CR17)]
    introduced the use of a multi-layer perceptron to learn the user–item interaction
    function, highlighting its effectiveness in modeling complex user–item relationships.


    At a high level, the NCF architecture has three main components – embedding layer,
    interaction layer, and output or prediction layer. The input item and user vectors
    are categorical feature vectors, both are concatenated and used as input to the
    embedding layer. These embeddings represent the latent features of users and items.
    Interaction layer utilizes a multi-layered neural network (like a multi-layer
    perceptron) to model user interactions with items. The user and item embeddings
    are fed into these layers, allowing NCF to model complex, non-linear relationships
    that go beyond what traditional Matrix Factorization can capture.


    The output layer takes the interaction representation generated in the previous
    layer and predicts the likelihood of a user interacting with an item. This prediction
    typically involves a score indicating the potential for a user to click on, add
    to cart, or purchase a particular item.


    Figure [5-11](#630035_1_En_5_Chapter.xhtml#Fig11) illustrates the functional architecture
    components of neural collaborative filtering.


    ![](images/630035_1_En_5_Chapter/630035_1_En_5_Fig11_HTML.jpg)


    Figure 5-11


    Neural collaborative filtering


    Source: [`https://arxiv.org/abs/1708.05031`](https://arxiv.org/abs/1708.05031)


    The NCF utilizes an objective function (often pointwise or pairwise loss) to assess
    its prediction accuracy. By continuously minimizing this loss function, the model
    learns and refines its parameters. The observed user interactions (clicks, purchases)
    are compared with the predicted scores to determine how well the model is performing.'
