  raw: '*At the core of the problem is identifying products similar to those typically
    purchased during Puja, particularly for the targeted buyer segments – Bengalis
    and northeastern buyers across India. Based on insights from category managers
    and domain expertise, relevant categories were identified. For these categories,
    data on products purchased by these segments 1-4 weeks before Puja last year was
    analyzed. A multi-model approach was employed to create product embeddings for
    each category. These embeddings were then used to match current inventory items.
    However, this approach has limitations, such as the inability to capture emerging
    trends. To address this, experts manually curated additional novel products.*


    ***Outcome**: The campaign led to a significant increase in new buyer acquisition
    on the platform, as well as improved conversion rates and sales for the curated
    products during the promotional period. To measure conversion rates, an A/B testing
    approach was employed. Bengali buyer segments were split into two groups: one
    group was shown the curated Product Listing Pages (PLPs), while the other group
    viewed the standard PLPs.*


    India is a country rich in festivals, with celebrations occurring at regular intervals
    throughout the year. During these times, brands often introduce new product lines
    and curate items that are particularly relevant to the festive occasions. For
    example, “Diwali” – the festival of lights – is celebrated widely across India,
    especially in the northern regions. This festival is a prime time for shopping
    for clothes and gifts.


    Fashion ecommerce platforms like Myntra and Amazon create curated collections
    specifically for festival shoppers and promote them extensively. The site merchandising
    teams also reinvent the platform’s presentation or digital stores to align with
    the festival themes, aiming to attract and entice buyers.


    In addition to creating festival-aligned brand stores, the site merchandising
    team collaborates closely with brands and category teams to orchestrate impactful
    end-of-season sales promotions. For example, an Indian ecommerce platform employs
    site merchandising techniques to prominently feature curated product pages, promoting
    end-of-season products across social media platforms. AI-driven behavior insights
    and data analytics enable them to create multiple pages for each brand, ranking
    products with the objective of improving conversions and sales. These pages are
    targeted to appropriate buyer segments through structured look-alike targeting
    campaigns. This strategic approach not only drives increased sales but also heightens
    buyer satisfaction by offering timely discounts on popular products.


    By harnessing data-driven insights and fostering strategic partnerships with brands
    and category teams, ecommerce site merchandising teams optimize product visibility
    and sales performance during pivotal promotional events such as end-of-season
    sales. This iterative process empowers them to continually refine their merchandising
    strategies and achieve exceptional business outcomes.


    The site merchandising team ensures accurate, comprehensive, and high-quality
    product information across the platform. This team acts as a bridge between the
    brand and the buyers, crafting a digital storefront that is both engaging them
    and enticing them to make purchase decisions.


    Curated products with accurate and relevant product descriptions and high-resolution
    images and videos help buyers in making purchase decisions. The team works closely
    with brands/sellers, category managers, and product teams to gather the information
    and present products that are both visually appealing and easy to understand for
    the buyers.


    Buyer behavior and engagement data helps in understanding interest and preferences
    of the buyers on the platform and these insights help site merchandising to implement
    strategies to enhance navigation, improve content relevance, and highlight promotions
    effectively. The team tracks a variety of performance metrics. These metrics include
    click-through rates, conversion rates, bounce rates, average session duration,
    and more. By analyzing these data points, the team can identify areas for improvement
    and implement targeted optimizations. For instance, if a particular category page
    has a high bounce rate, the team might refine the product listings or adjust the
    page layout to make it more engaging. This data-driven approach ensures that the
    site not only meets but exceeds buyers’ expectations.


    Merchandising focuses on presenting products attractively, while marketing involves
    promoting these products to target groups. This combination is essential for optimizing
    buyer engagement and conversions in the ecommerce marketplace platform.


    ## Digital Marketing in Ecommerce


    Ecommerce platforms extensively leverage digital channels and social media to
    attract buyers. Visual merchandising, promotions, and targeted messaging are key
    tools used to capture the attention of users on social media and motivate them
    to visit the ecommerce platforms. These strategies are increasingly data-driven,
    utilizing analytics to understand buyer behavior and preferences.


    Visual marketing is essential for capturing the attention of buyers on social
    media platforms. The use of computer vision and artificial intelligence allows
    for a deeper understanding of how visual presentations influence buyer behavior.
    By enhancing visual content and developing innovative visual strategies, businesses
    can create a more engaging and cohesive shopping experience for buyers [[12](#630035_1_En_3_Chapter.xhtml#CR12)].


    A data driven targeted approach not only enhances the effectiveness of marketing
    campaigns but also improves the overall shopping experience for buyers, leading
    to higher engagement and conversion rates. In the pursuit of data-driven marketing
    decisions, the ecommerce industry commonly employs lookalike modeling, programmatic
    bidding, and the monitoring and measurement of customer acquisition costs and
    return on marketing spend. These strategies help optimize marketing efforts and
    improve overall performance.


    ## Summary


    The category teams collaborate with brands and sellers to enhance product assortment
    and ensure product availability for targeted buyers. The site merchandising teams
    focus on creating visually appealing presentations, providing detailed product
    information, and ensuring a smooth purchase path, all of which contribute to a
    seamless shopping experience on the ecommerce platform. Marketing and promotional
    efforts are then employed to attract buyers to the platform, engaging and enticing
    them to make purchase decisions.


    Personalized search and product recommendations offer a tailored shopping experience
    for each buyer, making it easier for them to find products that suit their preferences.
    Additionally, the use of ranking and sorting algorithms to prioritize various
    widgets based on shopping patterns further enhances user engagement on the platform.


    In the next chapter, we will explore buyer engagement and the role of ecommerce
    search. This feature is a crucial functionality for ecommerce platforms, as it
    facilitates the product discovery journey by reducing the time and effort needed
    for buyers to find products that meet their needs and preferences.


