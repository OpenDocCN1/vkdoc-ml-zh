- fmt: '# The Ecommerce Maze: Navigating the Order Fulfillment Journey


    The moment a buyer makes a payment – “confirm order” – it marks the beginning
    of an exciting journey for the customer’s purchase. But behind the scenes, complex
    actions and steps unfold within the ecommerce platform. This post-confirmation
    odyssey, known as order fulfillment, determines how swiftly and smoothly a product
    reaches its final destination – the customer’s doorstep – or embarks on a return
    trip.


    Post order confirmation, the order is assigned to a customer. The seller verifies
    inventory, picks and packs your order with care, and hands it to a courier or
    delivery partner. The chosen courier partner picks up and delivers the product
    at the customer’s doorstep. This seamless flow represents the ideal order fulfillment
    journey – a testament to efficient operations.


    However, the path from confirmation to delivery isn’t always smooth. Several roadblocks
    can arise, causing inefficiencies and frustration for both customers and sellers.


    Figure [8-1](#630035_1_En_8_Chapter.xhtml#Fig1) illustrates the various stages
    of the post-order placement journey for an ecommerce platform.


    ![](images/630035_1_En_8_Chapter/630035_1_En_8_Fig1_HTML.jpg)


    Figure 8-1


    Journey from order to delivery


    - **Customer Cancellations**: A customer might cancel an order due to second thoughts,
    finding a better deal elsewhere, or other reasons. Insights behind customer cancellations
    help in optimizing product listings and pricing strategies. Customer cancellations
    can stem from various issues such as buyer abuse, price discrepancies, or unexpected
    charges. Enhancing clarity in the buying journey can help mitigate these cancellations.
    Additionally, implementing machine learning-based alerts can assist in identifying
    and reducing instances of platform abuse related to cancellations.


    - **Seller Cancellations**: Seller cancellations are often related to inventory
    discrepancies or pricing anomalies. Inventory issues can be mitigated through
    improved platform integrations that ensure real-time inventory updates. Additionally,
    machine learning systems can help minimize unintentional price changes that contribute
    to seller cancellations.


    - **Not Delivered – Return to Origin (RTO)**: Return to Origin (RTO) orders are
    often associated with incorrect delivery addresses and buyers who are unavailable
    to receive their orders. In some cases, fraudulent buyers may provide false addresses
    with no intention of accepting the delivery. Machine learning models can be employed
    to identify and mitigate these issues, implementing preventive measures to reduce
    the incidence of RTO.


    - **Customer Initiated Returns**: Change of mind, size or fit issues, wrong product,
    or product quality are some of the reasons the customer returns the products.
    Each reason for returns can be addressed through specific strategies. Fit issues
    can be mitigated by recommending the appropriate size based on buyer details or
    by implementing virtual try-on features. Quality concerns can be managed by enhancing
    the review process or engaging in discussions with relevant sellers to ensure
    product standards are met.


    - **Fake Returns**: Some customers may engage in fraudulent activities by returning
    counterfeit or non-original products. Machine learning models can help identify
    and reduce these fake returns by analyzing patterns and anomalies. Additionally,
    implementing quality checks during reverse pickup processes can further help in
    detecting and managing suspicious returns.


    All these can cause huge costs to ecommerce business, leading to inefficiency
    in order delivery journeys. This explains the gap between Gross Merchandise Value
    (GMV) and Net Merchandise Value (NMV). Approximately 30% of Gross Merchandise
    Value (GMV) is lost due to returns and cancellations [[17](#630035_1_En_8_Chapter.xhtml#CR17)].


    ## Efficiency Equation


    `GMV-NMV = Customer Initiated Returns (CIR) + Non-deliverables (RTO) + Cancellations
    (Customers and Sellers) + Others`


    **Customer Initiated Returns (CIR)** refer to the value of products returned by
    buyers for various reasons. Ecommerce platforms generally permit returns within
    a specified period known as the “return window,” which can vary by platform and
    product category. In some cases, returns may not be allowed for certain categories
    or products. The returns happen only after the product delivery.


    The return rate, or CIR rate, is expressed as a percentage of the total GMV (Gross
    Merchandising Value). For instance, a CIR rate of 20% indicates that 20% of the
    total value of ordered products has been returned by buyers. This metric is crucial
    for understanding return trends and managing inventory and customer satisfaction.


    **Return to Origin (RTO)**, also known as Non-Delivery, refers to products that
    could not be delivered to the buyer and are instead returned to the sellers. During
    the delivery process, a delivery executive attempts to reach the buyer at the
    provided address, which includes making phone calls, if necessary. If the delivery
    cannot be completed due to issues such as an incorrect address or the buyer being
    unavailable, the product is returned to the seller (the origin).


    An RTO percentage of 5% indicates that 5% of the GMV (Gross Merchandising Value)
    of ordered products could not be delivered and were sent back to the seller. RTO
    incurs costs for both forward and return shipping and negatively impacts the seller’s
    experience and inventory management.


    **Customer Cancellations** occur between the placement of an order and its delivery.
    The impact of these cancellations varies depending on the payment mode and the
    stage of the order journey. When a buyer decides to cancel an order, several factors
    come into play:


    - **Prepaid Orders:** If the order has been prepaid, it may incur payment gateway
    charges for the ecommerce platform.


    - **Order Processing:** If the seller has already started processing the order,
    this incurs effort and time that is effectively wasted.


    - **Post-Handover:** If the cancellation occurs after the order has been handed
    over to the delivery partner, it involves additional delivery costs.


    A cancellation rate of 5% indicates that cancellations account for 5% of the GMV
    (Gross Merchandising Value) of ordered products. This metric reflects the proportion
    of total orders that were canceled by customers.


    **Seller Cancellations** occur when a seller cancels orders assigned to them for
    delivery. This can happen for several reasons, including inventory shortages or
    pricing discrepancies. While seller cancellations are less frequent compared to
    customer-initiated cancellations, they can still pose challenges in a marketplace
    setting. Marketplace e-commerce platforms such as Flipkart impose order cancellation
    fees on sellers as a measure to discourage cancellations [[18](#630035_1_En_8_Chapter.xhtml#CR18)].


    In addition to the previously mentioned challenges, order fulfillment also incurs
    costs and inefficiencies due to issues such as fake returns, damaged products,
    and items lost in transit. Managing these issues effectively is crucial to minimizing
    waste and optimizing the delivery process.


    Typically, 20–40% of sales values are wasted due to any of these reasons.


    Each of the inefficiency drivers need to be managed effectively to improve the
    efficiency position.


    Figure [8-2](#630035_1_En_8_Chapter.xhtml#Fig2) illustrates the relationship between
    Gross Merchandise Value (GMV) and Net Merchandise Value (NMV), highlighting the
    various factors contributing to inefficiencies in ecommerce.


    ![](images/630035_1_En_8_Chapter/630035_1_En_8_Fig2_HTML.jpg)


    Figure 8-2


    Factors explaining gap between GMV and NMV'
