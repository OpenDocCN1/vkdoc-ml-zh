    像 Myntra 和亚马逊这样的时尚电商平台会专门为节日购物者创建策展系列，并进行广泛推广。网站商品陈列团队还会重新设计平台的展示或数字商店，以契合节日主题，旨在吸引和诱惑买家。


    除了创建与节日一致的品牌商店，网站商品陈列团队还与品牌和品类团队紧密合作，策划有影响力的季末促销活动。例如，一家印度电商平台运用网站商品陈列技术，突出展示策展产品页面，并在社交媒体平台上推广季末产品。基于人工智能驱动的行为洞察和数据分析，他们能够为每个品牌创建多个页面，以提升转化率和销售额为目标对产品进行排序。通过结构化的相似人群拓展活动，这些页面被精准投放给合适的买家群体。这种策略性方法不仅推动了销售增长，还通过提供热门产品的及时折扣，提高了买家满意度。


    通过利用数据驱动的洞察，并与品牌和品类团队建立战略合作伙伴关系，电商网站商品陈列团队在季末销售等关键促销活动期间，优化了产品可见性和销售业绩。这种迭代过程使他们能够不断优化商品陈列策略，并实现卓越的业务成果。


    网站商品陈列团队确保平台上产品信息的准确性、全面性和高质量。该团队充当品牌与买家之间的桥梁，打造一个既能吸引他们又能诱使其做出购买决策的数字店面。


    具有准确、相关产品描述以及高分辨率图片和视频的策展产品，有助于买家做出购买决策。该团队与品牌/卖家、品类经理和产品团队紧密合作，收集信息并呈现对买家而言既视觉吸引又易于理解的产品。


    买家行为和参与度数据有助于了解平台上买家的兴趣和偏好，这些洞察帮助网站商品陈列团队实施策略，以增强导航、提高内容相关性并有效突出促销活动。该团队追踪多种绩效指标，包括点击率、转化率、跳出率、平均会话时长等。通过分析这些数据点，团队可以识别需要改进的领域并实施有针对性的优化。例如，如果某个品类页面的跳出率很高，团队可能会优化产品列表或调整页面布局以使其更具吸引力。这种数据驱动的方法确保网站不仅满足，甚至超越买家的期望。


    商品陈列侧重于有吸引力地展示产品，而营销则涉及向目标群体推广这些产品。这种结合对于在电商市场平台中优化买家参与度和转化率至关重要。


    ## 电商中的数字营销


    电商平台广泛利用数字渠道和社交媒体来吸引买家。视觉陈列、促销和定向信息传递是用于吸引社交媒体用户注意力并激励他们访问电商平台的关键工具。这些策略越来越依赖数据驱动，利用分析来理解买家行为和偏好。


    视觉营销对于在社交媒体平台上吸引买家的注意力至关重要。利用计算机视觉和人工智能可以更深入地理解视觉呈现如何影响买家行为。通过增强视觉内容和开发创新的视觉策略，企业可以为买家创造更具吸引力和连贯性的购物体验[12]。


    数据驱动的定向方法不仅提高了营销活动的有效性，还改善了买家的整体购物体验，从而带来更高的参与度和转化率。在追求数据驱动营销决策的过程中，电商行业普遍采用相似人群建模、程序化竞价，以及监控和衡量客户获取成本与营销支出回报率。这些策略有助于优化营销工作并提升整体绩效。


    ## 总结


    品类团队与品牌和卖家合作，以丰富产品种类并确保目标买家的产品供应。网站商品陈列团队专注于打造视觉吸引人的展示、提供详细的产品信息，并确保顺畅的购买路径，所有这些都有助于在电商平台上实现无缝的购物体验。随后，营销和促销活动被用来吸引买家到平台，吸引并诱使他们做出购买决策。


    个性化搜索和产品推荐为每位买家提供量身定制的购物体验，使他们更容易找到符合自己偏好的产品。此外，利用排序和排名算法根据购物模式优先显示不同的小组件，进一步增强了用户在平台上的参与度。


    在下一章中，我们将探讨买家参与度和电商搜索的作用。此功能是电商平台的关键功能，因为它通过减少买家寻找满足其需求和偏好的产品所需的时间和精力，来促进产品发现之旅。


    # 4. 电商搜索——转化的强大引擎

    '
- fmt: '# Overview


    Jose, an avid runner, who frequently participates in Bangalore’s events, needed
    a new pair of shoes. Like countless others, Jose turned to the web to research
    his next purchase. Statistics show a significant portion of buyers use online
    searches to decide on the products before visiting ecommerce platforms [[1](#630035_1_En_4_Chapter.xhtml#CR1)].
    Knowing exactly what he wanted, Jose typed “Adidas Men Trainers Running Shoes”
    into the search bar of a popular Indian ecommerce platform, ready to begin his
    shopping journey. Figure [4-1](#630035_1_En_4_Chapter.xhtml#Fig1) illustrates
    an example of a search bar on an ecommerce website. A similar search bar is also
    available on the mobile application for ecommerce platforms.


    ![](images/630035_1_En_4_Chapter/630035_1_En_4_Fig1_HTML.jpg)


    Figure 4-1


    E-commerce Search


    Ecommerce search plays a critical role in these platforms, allowing users to navigate
    through billions of products and find what they need. It’s a crucial contributor
    to sales, generating the largest percentage of transactions compared to other
    channels [[2](#630035_1_En_4_Chapter.xhtml#CR2)]. Typically, on fashion ecommerce
    platforms, 20–30% of buyers utilize search at least once per session, yet remarkably,
    they contribute a significant portion (50–60%) of overall sales (GMV). These search-savvy
    buyers often have a clear purchasing intention, leading to a conversion rate 2–3
    times higher than the platform’s average conversion rate. In addition to its impact
    on conversion rates and overall value, an effective search function creates a
    seamless and engaging buyer experience on the ecommerce platform. Therefore, search
    is a crucial component of the platform’s strategy and user engagement.


    As Jose hits enter after typing “Adidas Men Trainers Running Shoes” in the search
    bar, the ecommerce platform’s search algorithms spring into action. The search
    algorithms match the search query terms with product title and descriptions and
    show the list of products that contains the search terms. The method is called
    exact text match.


    Search functionality in ecommerce has come a long way. It has evolved from basic
    text matching to advanced semantic search, now powered by generative artificial
    intelligence.


    An ecommerce platform might offer millions of products. Comparing every single
    product title and description to Jose’s query term (“Adidas Men Trainers Running
    Shoes”) would be incredibly inefficient. This approach would lead to very slow
    search response times, significantly impacting the customer experience. Since
    Jose’s query clearly indicates he’s looking for shoes, so no need to check other
    categories like apparel for matching the products.


    Ecommerce platforms rely on product category hierarchies, also known as taxonomies,
    to organize millions of products into clear and distinct groups. These taxonomies
    are crucial for browsing and navigation. However, search queries themselves often
    don’t neatly fit into these predefined categories. One approach would be to categorize
    searches based on keywords. But managing rule-based manual categorizations becomes
    complex as customers use a wide variety of search terms and they typically use
    informal language for the search queries [[3](#630035_1_En_4_Chapter.xhtml#CR3)].


    To overcome these limitations, ecommerce platforms leverage machine learning-powered
    query classification models. These models act as intelligent classifiers, analyzing
    search query terms like “Adidas Men Trainers Running Shoes” and the model predicts
    the most relevant product categories and brand information. This allows the search
    algorithm to efficiently match Jose’s query with the most relevant products in
    the catalog, significantly improving search response times and the overall user
    experience.


    Figure [4-2](#630035_1_En_4_Chapter.xhtml#Fig2) illustrates the high-level process
    of linking search terms to catalog products.


    ![](images/630035_1_En_4_Chapter/630035_1_En_4_Fig2_HTML.jpg)


    Figure 4-2


    Linking search terms to product catalog


    ## Search Queries and Machine Learning


    It is important to note that search queries are often brief, with nearly 45% containing
    fewer than three words. This observation is based on the author’s review of search
    data from an Indian ecommerce platform during a specific period. This suggests
    a significant proportion of buyers might be browsing or exploring the platform
    rather than having a clearly defined search intent. As a result, query classification
    models may encounter limitations in terms of accuracy for these shorter queries.
    Even for brief search queries, BERT and other transformer-based deep learning
    models can effectively classify search terms into relevant product categories.
    These models excel because they utilize not just the words themselves but also
    the semantic meaning behind the queries.


    Additionally, ecommerce platforms leverage in-session clicks and previous searches
    to refine and improve search results, including query classifications. For example,
    if a user frequently clicks on electronics when searching for “Apple,” the system
    may infer that the user is referring to the brand. In contrast, a search for “custard
    apple” would be categorized differently based on contextual clues.


    ### Case Study: Search Term Classification Model


    **Context**: An ecommerce platform has three levels of taxonomy to organize apparel
    products. For example, Level 1 is Apparel/Footwear/Home/Beauty and each of the
    Level 1 (e.g., Apparel) will have Level 2 (e.g., Indian Wear, Western Wear, etc.).
    Each of the L2 will have multiple Level 3 categories. There were 3000+ Level 4
    combinations.


    All search queries that are not direct brand or category searches, were required
    to be linked to the taxonomy or category hierarchy to improve product matching.


    **Objective**: Develop a transformer-based text classification model that links
    each of the search queries to the relevant category hierarchy. This is a multi-label
    classification task.


    **Approach**: For the normalized or processed search queries, the category labels
    were assigned based on the click data. If most of the products clicked are related
    to a single category level, assign them as the correct level. High level logic
    used is explained below.


    For example, if a search query is linked to over 30% of the clicked products related
    to the single Level 4 value, only that Level 4 and corresponding Level 3, Level
    2 and Level 1 are considered for the label. If clicked products are across multiple
    Level 4, then only Level 3 will be considered.


    This process of finding 30% of clicked contributions is started with Level 4,
    but repeated at Level 3 and upward. If over 30% of the products are clicked for
    a particular Level 2, then that level 2 and corresponding L1 will be assigned
    for the label. The process is repeated for Level 1 in the similar way.


    `Tshirt For Women` -> Level 1: Apparel: Level 2: Women Level 3: western wear Level
    4: T Shirt


    `Woman Dresses` -> Level 1: Apparel: Level 2: Women


    Once the label dataset is created, a transformer based pre-trained model is used
    for developing the text classification. But the dataset was skewed for some of
    the most shopped or searched categories. To make the dataset balanced, based on
    the product catalog, a list of synthetic search queries were created for the categories
    with lower count of organic search queries.


    **Model Validation**: The trained query classification model was validated on
    the hold out sample and precision, recall, and F1 score values were used for performance
    evaluation.


    While Jose knew exactly what he wanted and entered a specific search query, it’s
    important to remember that buyer personas based on ecommerce search behavior vary
    greatly.'
