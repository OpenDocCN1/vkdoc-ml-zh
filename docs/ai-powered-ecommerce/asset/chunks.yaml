  trans: '

    *   **精选产品推荐：** 基于过往购买和浏览行为，人工智能可以为每位访客量身定制符合其兴趣的产品选择。


    这些个性化策略超越了“一刀切”的模式，将数字店面转变为每位顾客独一无二的精选体验。这种程度的个性化能够促进更深层次的互动，并显著提升顾客旅程。


    在首页之后，由于效果营销活动，大量访客会进入分类列表页（CLP）和品牌列表页（BLP）。产品列表页（PLP），包括 CLP 和 BLP，会吸引那些对特定产品类别或品牌感兴趣的访客。与访客意图可能更广泛的首页相比，这种目标明确的流量能带来更高的转化率。PLP
    会针对特定类别或品牌展示精选产品，以缩短产品发现时间并加速决策。


    将最相关的产品展示在顶部，有助于买家更快地做出购买决策。电商平台利用相关性排序，将最相关的产品优先展示在列表页（如 PLP、CLP、BLP）上。这由机器学习（ML）算法驱动。这些算法将搜索结果点击、产品浏览、加购率（产品被加入购物车的频率）、转化率（浏览后购买产品的频率）以及商品交易总额（GMV）等多种因素作为排序模型的输入。


    对于已登录的顾客，排序会更进一步。机器学习算法可以利用顾客的过往购买历史、浏览行为，甚至是被放弃的购物车商品，来个性化调整产品的显示顺序。这种个性化程度能展示出最可能引起每位顾客共鸣的商品，从而进一步加速他们的决策过程。


    在典型的电商旅程中，访客经常会在产品列表页（PLP）上遇到引起他们兴趣的产品。这可能会促使他们点击以更仔细地查看某个特定产品，从而进入产品详情页（PDP）。引人注目的视觉效果能吸引访客点击进入
    PDP。模特展示图（模特图片）和具有相关背景的产品图片通常具有更高的点击率（CTR）和用户参与度。


    此外，买家可以从产品列表页导航至产品详情页（PDP）。付费搜索广告或短信营销活动可能会将访客直接引导至相关的 PDP。


    产品详情页（PDP）是电商中做出购买决策的最终目的地。PDP 专注于展示单一产品，并提供产品的全面概览，通过高质量图片从多个角度展示产品，附有清晰简洁的描述，突出产品的特点、优势、规格和材质，同时显示可用的尺寸和颜色。


    PDP 必须包含清晰的行动号召（CTA）。主要的 CTA 包括“加入购物车”和“立即购买”，同时显示预计送达日期和顾客评价等信息。


    图 2-7 展示了产品详情页（PDP）上通常显示的信息。


    ![](img/630035_1_En_2_Fig7_HTML.jpg)


    图 2-7


    产品详情页


    通过提供丰富的产品信息、引人入胜的内容和清晰的行动号召（CTA），PDP 使访客能够做出明智的决定，并最终转化为付费客户。


    为了衡量平台上的参与度，**每次访问的产品浏览量**（PV/V）——数值越高表示访客在浏览和探索产品选项方面的参与度越高；**加购率（CAR）**——衡量至少将一件产品加入购物车的访客百分比；以及**每次会话或每位访客的停留时间**——追踪访客在首页、产品页、分类页等页面停留的平均时长，时间越长表示对内容的参与度越深。


    产品详情页（PDP）是宝贵的资源，一个设计良好的 PDP 对于将兴趣转化为购买至关重要。为了打造引人入胜的 PDP，会添加多个推荐组件。这些组件利用数据科学和人工智能为每位访客个性化推荐。这些推荐组件包括“经常一起购买”、“搭配推荐”或“相似产品”。


    一个精心策划、带有直观筛选功能的产品列表，能引导访客进入产品详情页（PDP）。PDP 上的高质量视觉效果、突出关键优势的清晰描述以及透明的配送信息至关重要。这些要素的结合能有效建立信任，并促使访客考虑将产品加入购物车。一旦顾客找到了心仪的产品，目标就是将这些兴趣转化为实际购买。

    '
- fmt: '## Lower Funnel: A Path Conversion or Real Outcome


    While adding products to the cart is a significant customer action, the real impact
    comes from order confirmation. These final steps in the ecommerce journey hold
    the most importance for a business’s success.


    In ecommerce, the average add-to-cart rate globally is 7.6% [[4](#630035_1_En_2_Chapter.xhtml#CR4)]
    and on average, ecommerce websites see a conversion rate of 1% to 4% [[5](#630035_1_En_2_Chapter.xhtml#CR5)].
    The conversion rate can vary by industry and geography. For example, for the beauty
    category, the conversion rate is over 5%, but for luxury fashion it could be around
    1% probably due to higher average selling prices (ASP) of the products. It is
    observed that the higher priced products take more visits before a purchase decision.
    `Add to cart rate` is calculated by dividing the number of visitors who have added
    at least one product to their cart by the total number of visitors to the product
    detail page. This metric assesses how effectively the product detail page generates
    interest and prompts users to select the product. `Conversion rate` is determined
    by dividing the number of visitors who complete the purchase after adding products
    to their cart by the total number of visitors who added items to their cart. This
    metric measures the effectiveness of the checkout and payment processes.


    Ecommerce conversion rates thrive on a seamless checkout experience with multiple
    secure payment options (credit cards, debit cards, digital wallets), clear shipping
    information displayed up-front, and a streamlined checkout process with minimal
    steps. Pre-populated shipping addresses and saved payment information for returning
    customers further improve convenience, while offering a variety of trusted payment
    gateways caters to individual preferences and reduces cart abandonment.


    Every buyer who abandons their cart during the ecommerce journey presents a valuable
    learning opportunity. These drop-off points can be analyzed to identify areas
    of improvement across UX/UI design (can we make navigation intuitive and easy
    and product information clear and easy to find?), product details (are product
    descriptions informative and engaging?), pricing and offers (are product prices
    competitive?), costs and charges (is fee and charges getting applied in cart pages?)
    and technical issues (is there any pattern of errors in the technical log?).


    Marketing teams leverage CRM systems to reconnect with customers who abandoned
    their carts with unfinished purchases. Machine learning algorithms play a crucial
    role in these cart abandonment campaigns by personalizing the messaging, product
    recommendations, and overall content for each customer.


    When a buyer is on the journey to purchase, inaccurate delivery addresses are
    a major cause of failed deliveries and lost revenue for ecommerce businesses.
    AI and machine learning algorithms can help mitigate this issue by offering address
    review services during checkout.


    Payment is the final hurdle in the ecommerce journey. Offering a variety of secure
    payment options, including Cash on Delivery (COD), can streamline the checkout
    process and cater to diverse customer preferences.


    In India, for example, the overall payment success rate is around 75% [[7](#630035_1_En_2_Chapter.xhtml#CR7)].
    Interestingly, 33% of failed payments are simply not retried by customers [[6](#630035_1_En_2_Chapter.xhtml#CR6)].
    By leveraging data and machine learning, ecommerce platforms can predict payment
    success rates for different options and priorities for each customer to improve
    first time payment success rate.


    This prediction can be a powerful tool. Imagine informing buyers about payment
    methods with a higher success rate up-front. Additionally, prioritizing the most
    relevant and preferred options at checkout further enhances convenience. Previous
    experience suggests that the personalized payment sequence can improve usage of
    top payment options (an indication of customer experience) and also can help in
    improving adoption of pre-paid options. The payment method success rate for digital
    payments is currently less than 80%. By analyzing recent payment success rates,
    machine learning algorithms can offer better payment recommendations, potentially
    improving the buyer experience and increasing conversion rates.


    ## Summary


    The ecommerce platform empowers sellers with the technology they need to succeed.
    Sellers can list their products, run promotions, process orders, manage inventory,
    and receive secure online payments.


    A marketplace ecommerce platform can host thousands of sellers. Ease of use, automated
    validations, and flexible options create core differentiations. Considering the
    scale, manual processes and linear cost growth pose significant challenges to
    survival for these platforms. This is where the role of Artificial Intelligence
    (AI) and Machine Learning (ML) becomes crucial. AI/ML-enabled processes make the
    platform scalable and cost-effective.


    On the buyer’s side, the platform offers a wide variety of products accessible
    from any mobile device or laptop, with seamless delivery to their doorstep. This
    book covers key functionalities and how these are enabled with Machine Learning
    (ML) and Artificial Intelligence (AI) to ensure a smooth and efficient experience
    for buyers. These functionalities include search, product listings, recommendations,
    personalization, and many more.


    These platforms enable each stage of the funnel: top, mid, and lower. The key
    focus is to understand the applications of AI/ML across these funnels. The top
    funnel focuses on attracting visitors or buyers to the platform, which is primarily
    about marketing.


    Machine Learning (ML) algorithms empower marketing teams to create targeted performance
    marketing campaigns that resonate with specific audience segments. Additionally,
    media mix models can optimize campaign spending and maximize return on investment
    (ROI) for the marketing budget.


    On the platform, a personalized digital storefront tailors the shopping experience
    for each visitor. Relevance ranking and AI-powered recommendations ensure that
    buyers see products they are interested in, keeping them engaged and encouraging
    them to add items to their carts. This is the mid funnel, focused on engaging
    buyers on the platform.


    A frictionless checkout process with secure payment options makes completing a
    purchase quick and convenient for customers. Personalizing the payment sequence
    based on buyer data and utilizing machine learning for address verification can
    significantly improve conversions and order placement. Converting visitors to
    buyers is the focus of the lower funnel in ecommerce.


    With a detailed working overview of the ecommerce platform and buyer journeys
    on the ecommerce, the next focus is to delve deeper into each of the key functionalities.
    The next chapter explores how products, platforms, and promotions come together
    to engage customers on the platform, that is merchandising in ecommerce.


    # 3. Merchandising for Ecommerce Marketplace'
