- fmt: '# Semantic Search


    Rashmi, while looking for orange sarees, uses terms like “Saffron Color Saree”
    or “Haldi Color Saree.” This highlights a common challenge in ecommerce search,
    a multiple variation of search queries. On one platform, searching for “Orange
    Saree” yields 1877 results, while “Saffron Color Saree” shows only 1 result and
    “Haldi Color Saree” produces no results. This inconsistency demonstrates the challenges
    in product tagging.


    Interestingly, another platform recognizes “Haldi” and displays yellow sarees
    (1–48 of over 3000 results) when searching for “Haldi Color Saree.” Figure [4-10](#630035_1_En_4_Chapter.xhtml#Fig10)
    shows the sample output for the search result.


    ![](images/630035_1_En_4_Chapter/630035_1_En_4_Fig10_HTML.jpg)


    Figure 4-10


    Semantic search result


    Key challenges in ecommerce search is that the users often use informal language
    in their search queries, while product titles and descriptions tend to be written
    in a more formal style. This creates a vocabulary gap that can hinder search accuracy
    [[3](#630035_1_En_4_Chapter.xhtml#CR3)]. The techniques like stemming and lemmatization
    are used to match words with similar roots (e.g., “reading glasses” to “reading
    glass”), but these can lead to information loss and errors. Similarly, spell-correction
    methods may not always catch all typos or misspellings in user queries. This can
    lead to poor search results that don’t match the user’s intent [[7](#630035_1_En_4_Chapter.xhtml#CR7)].


    Semantic search algorithms incorporate intent and context of the search terms
    for matching search terms with product catalog. For example, “shoe laces” and
    “laced shoes” search terms are interpreted by the semantic search engine. Semantic
    Search architecture handles hypernyms, synonyms, antonyms, morphological variants,
    and spelling errors in an effective way [[7](#630035_1_En_4_Chapter.xhtml#CR7),
    [8](#630035_1_En_4_Chapter.xhtml#CR8)].


    Semantic search frameworks rely on dense vectors within an embedding space to
    capture the contextual meaning of both search queries and products. Deep learning
    methods convert product information into these vectors, which are then stored
    for later retrieval [[9](#630035_1_En_4_Chapter.xhtml#CR9)].


    Similarly, user search queries are transformed and stored as vectors as well.
    Finally, when a user enters a search query, the system links it to its corresponding
    stored search query vector and compares it against the product vectors to identify
    matches.


    `RoBERTa` and other transformer models are fine-tuned specifically for the ecommerce
    context before being employed to create product and search query embeddings. This
    fine-tuning process involves adapting the models to understand the nuances of
    ecommerce language and buyer behavior. The embeddings generated from these models
    are then used to link new buyer search terms to relevant products, enhancing the
    accuracy and relevance of search results.


    Figure [4-11](#630035_1_En_4_Chapter.xhtml#Fig11) illustrates the logical steps
    involved in matching search queries to products using a semantic search framework.


    ![](images/630035_1_En_4_Chapter/630035_1_En_4_Fig11_HTML.jpg)


    Figure 4-11


    Semantic search steps


    Three main categories of semantic search algorithms [[3](#630035_1_En_4_Chapter.xhtml#CR3)]:


    1.  **Factorized Models**: These models independently convert search queries and
    products into lower-dimensional vector representations (called embeddings) based
    on their content. These embeddings capture the semantic meaning of the queries
    and documents or products, allowing for more accurate semantic matching.


    2.  **Latent Factor Models (LFMs)**: Latent Factor Models (LFMs) use matrix factorization
    techniques to uncover hidden relationships between words and products (or documents)
    without directly analyzing their content. By decomposing interaction matrices
    into latent factors, LFMs can reveal underlying patterns and associations. For
    instance, techniques like Singular Value Decomposition (SVD) or Non-negative Matrix
    Factorization (NMF) identify these latent factors, which helps in understanding
    and predicting buyer preferences and product similarities based on implicit interactions
    rather than explicit content analysis.


    3.  **Interaction Models**: Interaction models build interaction matrices between
    the query and product details (e.g., title and description text). These models
    capture complex interactions between query terms and product details using deep
    learning models, leading to more nuanced semantic matching.


    ## Deep Learning for Search Embeddings


    Two deep learning approaches are used to create vector representations (embeddings),
    for both search queries and products are unsupervised and supervised methods.


    The recommended supervised approach, detailed in this research paper [[3](#630035_1_En_4_Chapter.xhtml#CR3)],
    leverages a transformer-based model called `RoBERTa`. This process involves two
    stages:


    *   **Pre-training:** The `RoBERTa` model is first trained on a large dataset
    of fashion-related text (corpus). This initial training equips the model with
    a strong foundation for understanding language relevant to the search domain.


    *   **Fine-tuning:** Next, the model undergoes fine-tuning using a technique called
    triplet loss optimization. This method aims to achieve two goals: reduce the distance
    between a search query and the product a user clicks on (considered a positive
    match), and increase the distance between a search query and random products a
    user doesn’t click on (considered negative matches).


    Fine-tuning these models requires labeled data to indicate which products are
    relevant for a search and which are not. Click data is crucial for this process,
    as it helps identify positive examples (products buyers interacted with) and negative
    examples (products users did not engage with). Clicks on a product listing after
    a search indicate a positive match, whereas clicks on irrelevant listings or no
    clicks at all suggest negative matches. For example, when buyers search for “Red
    Dress,” products that are clicked are considered positive samples, while non-clicked
    or unrelated products are treated as negative samples. This distinction helps
    in training the model to better differentiate between relevant and irrelevant
    products based on user interactions. Additionally, the authors recommended a concept
    of “narrow” vs. “broad” queries when defining positive and negative samples for
    training/fine-tuning of the pre-trained model.


    Finally, the query and product embeddings learned through this fine-tuned model
    are used to retrieve relevant products when a buyer enters a search query. The
    query embedding essentially acts as a reference point for finding products with
    similar meaning and characteristics within the product catalog.'
