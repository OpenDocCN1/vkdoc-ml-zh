  通过提供丰富的产品信息、引人入胜的内容和清晰的行动号召（CTA），PDP 使访客能够做出明智的决定，并最终转化为付费客户。


  为了衡量平台上的参与度，**每次访问的产品浏览量**（PV/V）——数值越高表示访客在浏览和探索产品选项方面的参与度越高；**加购率（CAR）**——衡量至少将一件产品加入购物车的访客百分比；以及**每次会话或每位访客的停留时间**——追踪访客在首页、产品页、分类页等页面停留的平均时长，时间越长表示对内容的参与度越深。


  产品详情页（PDP）是宝贵的资源，一个设计良好的 PDP 对于将兴趣转化为购买至关重要。为了打造引人入胜的 PDP，会添加多个推荐组件。这些组件利用数据科学和人工智能为每位访客个性化推荐。这些推荐组件包括“经常一起购买”、“搭配推荐”或“相似产品”。


  一个精心策划、带有直观筛选功能的产品列表，能引导访客进入产品详情页（PDP）。PDP 上的高质量视觉效果、突出关键优势的清晰描述以及透明的配送信息至关重要。这些要素的结合能有效建立信任，并促使访客考虑将产品加入购物车。一旦顾客找到了心仪的产品，目标就是将这些兴趣转化为实际购买。




  ## 漏斗底层：路径转化或实际成果


  虽然将商品加入购物车是重要的客户行为，但真正产生影响的环节是订单确认。这些电子商务旅程中的最终步骤对企业的成功至关重要。


  在全球范围内，电子商务的平均加购率为 7.6%[4]，而电商网站的平均转化率在 1%到 4%之间[5]。转化率会因行业和地域而异。例如，美妆品类的转化率超过 5%，但奢侈时尚品类可能只有
  1%左右，这可能是由于产品平均售价较高所致。观察发现，价格越高的产品，在做出购买决策前需要更多的访问次数。**加购率**的计算方式是将至少添加一件商品到购物车的访客数除以产品详情页的总访客数。该指标评估产品详情页激发兴趣并促使用户选择产品的效果。**转化率**的计算方式是将加购后完成购买的访客数除以添加商品到购物车的总访客数。该指标衡量结账和支付流程的有效性。


  电子商务转化率依赖于无缝的结账体验，包括多种安全支付方式（信用卡、借记卡、数字钱包）、预先清晰显示的运费信息，以及步骤精简的结账流程。为回头客预填收货地址和保存支付信息可进一步提升便利性，同时提供多种值得信赖的支付网关能满足不同客户的偏好，并减少购物车放弃率。


  每个在电商旅程中放弃购物车的买家都提供了宝贵的学习机会。可以分析这些流失点，以确定在用户体验/界面设计（导航是否直观易用？产品信息是否清晰易找？）、产品详情（产品描述是否信息丰富且引人入胜？）、定价与优惠（产品价格是否有竞争力？）、费用与收费（费用是否在购物车页面被应用？）以及技术问题（技术日志中是否存在某种错误模式？）等方面的改进空间。


  营销团队利用客户关系管理系统重新联系那些放弃购物车、未完成购买的客户。机器学习算法在这些购物车放弃挽回活动中发挥着关键作用，它能针对每位客户个性化定制消息、产品推荐和整体内容。


  当买家处于购买旅程中时，不准确的收货地址是导致电商企业配送失败和收入损失的主要原因。人工智能和机器学习算法可以通过在结账时提供地址审核服务来帮助缓解这一问题。


  支付是电商旅程中的最后一道关卡。提供多种安全支付方式，包括货到付款，可以简化结账流程并满足不同客户的偏好。


  例如，在印度，整体支付成功率约为 75%[7]。有趣的是，33%的支付失败案例中，客户根本不会重试[6]。通过利用数据和机器学习，电商平台可以预测不同支付选项的成功率，并为每位客户确定优先级，从而提高首次支付成功率。


  这种预测可以成为一个强大的工具。想象一下，预先告知买家哪些支付方式成功率更高。此外，在结账时优先展示最相关和最受偏好的选项，能进一步提升便利性。以往经验表明，个性化的支付顺序可以提高首选支付方式的使用率（这是客户体验的一个指标），也有助于提高预付选项的采用率。目前数字支付的支付方式成功率低于
  80%。通过分析近期的支付成功率，机器学习算法可以提供更好的支付建议，从而可能改善买家体验并提高转化率。


  ## 总结


  电商平台为卖家提供了成功所需的技术。卖家可以上架商品、开展促销、处理订单、管理库存，并接收安全的在线支付。


  一个市场型电商平台可以容纳成千上万的卖家。易用性、自动化验证和灵活的选项构成了核心差异化优势。考虑到规模，人工流程和线性成本增长给这些平台的生存带来了巨大挑战。这正是人工智能和机器学习发挥作用的关键所在。基于人工智能/机器学习的流程使平台具有可扩展性和成本效益。


  在买家方面，该平台提供种类繁多的商品，可通过任何移动设备或笔记本电脑访问，并实现无缝配送到家。本书涵盖了关键功能，以及如何利用机器学习和人工智能来实现这些功能，从而为买家提供顺畅高效的体验。这些功能包括搜索、商品列表、推荐、个性化等。


  这些平台支撑着漏斗的每个阶段：顶层、中层和底层。关键点在于理解人工智能/机器学习在这些漏斗中的应用。顶层漏斗侧重于吸引访客或买家到平台，这主要关乎营销。


  机器学习算法使营销团队能够创建与特定受众群体产生共鸣的精准效果营销活动。此外，媒体组合模型可以优化广告活动支出，并使营销预算的投资回报率最大化。


  在平台上，个性化的数字店面为每位访客量身定制购物体验。相关性排序和基于人工智能的推荐确保买家看到他们感兴趣的商品，保持他们的参与度并鼓励他们将商品加入购物车。这就是中层漏斗，侧重于在平台上吸引买家。


  具备安全支付方式的无摩擦结账流程，使客户能够快速便捷地完成购买。根据买家数据个性化支付顺序，并利用机器学习进行地址验证，可以显著提高转化率和订单完成率。将访客转化为买家是电子商务漏斗底层的重点。


  在详细了解了电商平台及其买家旅程的运作概况后，接下来的重点是深入探讨每个关键功能。下一章将探讨产品、平台和促销如何协同作用，以在平台上吸引客户，即电子商务中的商品销售。


  '
- '# 3. 电子商务市场的商品销售




  ## 概述


  电商市场将众多卖家和买家汇聚在一个共同的技术平台上。该平台促进商品交易，并需要为买卖双方提供一套全面的功能，正如前一章所讨论的。


  电商平台首先需要确定一组目标群体（TGs）来促成交易。这些目标买家群体代表了平台旨在服务的人群统计特征和买家细分市场。理解这些选定目标群体的需求和诉求，对于根据买家偏好定制产品和供应至关重要。最初，当电商平台刚起步时，目标群体是基于市场研究和创始人的假设来定义的。随着平台的发展，机器学习方法在识别这些群体方面变得至关重要，它通过分析买家购买模式，并将其与买家需求和用户画像对齐。一种常用于此目的的无监督机器学习方法是
  K-Means 聚类，它根据客户在行为和属性上的相似性对其进行分组。


  电商商品运营侧重于在平台上将买家与合适的产品连接起来。推荐方法，如协同过滤和矩阵分解，通常用于根据每个买家目标群体的浏览和购买模式，为其优先推荐产品。


  例如，领先的时尚电商公司 Myntra 服务于特定的目标群体，而另一个电商平台 Amazon 则是一个也销售时尚产品的多品类平台。然而，这些平台上时尚品类的品牌和价格区间差异显著，它们各自针对不同的买家细分市场。


  Myntra 的目标客户是注重时尚的买家，尤其是中等收入群体，他们寻求时尚和品牌产品 [4]。该平台策划精选系列，并专注于通过与全球品牌合作提供独家产品。其主要关注点是服装、鞋类和配饰等时尚品类。此外，视觉上吸引人的设计是该平台的核心关注点
  [3]。


  向目标群体（TGs）展示相关产品，并预测他们的需求和偏好，是商品运营中的关键关注领域。数据驱动的方法有助于将产品需求映射到特定的目标群体。ASOS 利用数据来优化其目标群体，并为每个群体有效地调整量身定制的价值主张
  [11]。个性化和推荐功能使得向买家展示相关产品成为可能。监控新兴和不断变化的市场趋势，并结合预测，为预测每个目标群体未来的产品需求提供了洞察。


  电商市场中的商品运营涉及几个关键活动：


  *   **策划产品：** 从不同品牌和卖家中创建精选产品系列，并确保这些产品的可用性，是电商品类经理的首要任务。这就是产品品类管理。产品策划是电商平台上品类经理的主要职责。基于机器学习的推荐和排序方法帮助他们选择能够提升业绩的产品。品类经理持续监控关键绩效指标，如点击率、平均订单价值和转化率，以确保其产品策划策略的有效性。


  *   **展示产品：** 在平台上使用有吸引力的视觉效果有效展示这些产品，并创建合适的优惠结构，是网站商品运营团队的工作重点。视觉效果的细微变化会显著影响买家在电商平台上的参与度。网站商品运营团队进行各种实验来评估这些影响，并使用统计测试来衡量其有效性。


  *   **营销产品：** 通过各种营销渠道，使用诱人的视觉效果、优惠和促销活动，向正确的目标群体推广产品，并将他们吸引到平台，是营销团队的职能之一。人工智能（AI）和机器学习（ML）方法是实现营销个性化（尤其是针对现有买家）的关键推动因素。诸如
  XGBoost 和 Random Forest 等机器学习技术常用于识别哪些客户最有可能对 CRM 活动做出响应。


  电商商品运营是一项跨职能的责任，涵盖品类管理、网站商品运营到营销职能。这些职能之间的有效协作对于确保买家获得无缝的购物体验以及推动平台上的成功交易至关重要。




  ## 品类管理


  电商平台上品类、品牌和产品的丰富程度，为任何电商企业创造了差异化优势。对于市场型电商平台而言，多元化的品牌和卖家构成了其相关性和独特身份。在时尚领域，品牌类型和价格区间则指明了平台旨在服务的目标群体。


  品类经理的核心职责之一，是识别与平台买家需求相契合的品牌和产品。创建潜在品牌和卖家清单，需要理解买家需求、分析竞争对手以发现其产品组合中的新机遇和空白点，并辨别时尚趋势与风格创新。数据和人工智能使品类经理能够追踪竞争格局，捕捉买家的需求和偏好，并选择与买家相符的合适趋势。品类经理通常会监控主要竞争对手的电商平台，包括其评论以及表现最佳的产品和品牌。自然语言处理（NLP）技术可以分析竞争对手的产品描述、客户评论和社交媒体提及内容，提供可操作的洞察，帮助他们掌握信息并做出战略决策。


  Stitch Fix 是一家由卡琳娜·莱克创立的美国个人造型公司，它利用机器学习算法和人类造型师，为其买家提供个性化的时尚产品[5]。除了“在正确的时间将正确的风格送达正确的人”之外，该公司还创建了一个框架，利用算法来识别未来的流行风格。这些算法的一些局限性则通过人类的洞察力和经验来弥补。


  构思新风格并决定投资的过程，需要经历漫长的酝酿和反复迭代。该公司甚至在生产和采购新品之前，就通过 Style Shuffle 对其进行测试。这种方法提高了成功风格的产出效率，并减少了浪费[6]。


  同样，其他领先的电商平台，如 Zalando、H&M 和阿里巴巴，也在利用人工智能进行新设计、需求预测和优化产品组合。谷歌、Zalando 以及总部位于英国的制作公司
  Stinkdigital 共同开发了一个预测性的“设计引擎”。该引擎利用人工智能技术辅助创意决策，展示了超过 600 位时尚专家在颜色、质地和风格上的偏好[8]。


  在识别出买家需求、与之相关的新兴风格趋势以及品牌/卖家清单后，品类经理会与品牌接洽，商讨入驻电商平台事宜。品牌入驻的整个过程在进入运营和技术讨论之前，需要考量多个因素。为电商平台识别潜在品牌既是一门艺术，也是一门科学。科学方面由机器学习方法和绩效洞察提供支持。例如，分析平台上的买家偏好以及竞争对手品牌的关键产品，为品牌选择提供了宝贵的数据。此外，自然语言处理（NLP）可以通过评估来自竞争对手网站买家评论中的产品质量和契合度，来增强这种理解。


  品牌声誉和产品质量对于为平台买家提供卓越体验至关重要。通常，平台会有一套指导方针和评估标准，用于筛选能为平台买家创造价值的入驻品牌。与品牌的独家合作或联盟，使平台能够提供独特产品，从而在与竞争对手的较量中脱颖而出。品类团队会评估新品牌是否有助于平台上新旧品牌、流行品牌与利基品牌之间形成健康的组合。


  在电商市场中，佣金收入是商业模式的关键组成部分。平台通常从每笔交易价值中抽取一定比例的佣金，该比例由品类管理部门与品牌协商确定。品类经理通过战略性地管理产品组合和品牌选择，在推动此项收入方面发挥着关键作用。




  ## 案例研究：电商平台上的品牌优先级排序


  **背景**：在快速发展的印度电商市场中，识别并选择入驻品牌对平台的成功至关重要。通过市场调研和竞争分析，电商平台会识别出一份潜在品牌清单。同时，一些品牌也会主动联系平台寻求入驻。采用数据驱动的方法有助于系统性地评估这些品牌是否与电商平台的目标相符。


  **目标**：为品类经理建立一个数据驱动的框架，以识别高绩效品牌，实现成熟品牌与新兴品牌的均衡组合，并引入符合买家偏好和市场需求的品牌。通过追踪这些品牌及其产品在竞争对手平台上的表现，并结合分析媒体报道，有助于预估品牌绩效并提供有价值的见解。


  **方法**：


  *   捕获数据——销售额、评论与评分、社交媒体热度指标。

  *   为每个品牌创建关键绩效指标（KPI），例如销售潜力、买家满意度和市场相关性。

  *   为这些绩效指标定义评分标准，并汇总得分以得出综合品牌评分。

  *   综合评分及其各项分项评分将指导品类经理评估品牌并确定其入驻的优先级。


  **成果**：该平台已实施一种结构化的方法，定期筛选品牌并确定其入驻优先级。通过确保将最相关、最具潜力的品牌展示在平台上，这种方法提升了销售额、优化了产品组合，并改善了整体买家体验。


  与卖家和品牌建立长期合作关系涉及制定营销计划、设计最优定价策略，以及与品牌合作开展促销活动。这些努力旨在提升品牌知名度、提高买家参与度，并同时实现品牌的销售计划（GMV）和平台的收入目标。


  在电商平台中，品牌或卖家负责产品库存、供货状态和订单处理。在品牌上线前，电商平台与品牌的订单管理系统之间需要进行技术集成，以确保订单处理顺畅。库存集成有助于降低因产品缺货而导致订单取消的可能性。印度电商平台
  Flipkart 利用人工智能进行库存管理 [10]。支付处理和分析是电商平台模式中其他典型的服务和平台集成需求。相关协议旨在减少因产品缺货或质量不佳导致的订单取消，以及因包装和交付给物流伙伴缓慢而导致的订单配送延迟。


  总而言之，品类经理负责在品类页面和品牌页面上做出关于品牌选择和产品组合的决策，并承担平台上产品供应的责任。他们还致力于提高来自品牌的广告收入，并为电商平台实现销售目标（GMV
  和 NMV）。


  品类经理几乎实时地追踪整个漏斗（顶部、中部和底部）的绩效，以确保达成平台业务目标。下面列出了一些常见的绩效指标。这些指标捕捉买家旅程，识别提升平台绩效的机会，并帮助定位任何问题。例如，如果首页上的某些视觉效果或组件对买家无效或不相关，这将会反映在该组件的点击率上。同样，如果前一小时的转化率低于预期转化率，品类经理将与跨职能团队合作，以识别并纠正问题。


  对于顶部漏斗，访客数量、首页和产品列表页的点击率（CTR）、产品浏览量（PV）、产品浏览量/访问量比率（PV/V）以及跳出率（仅浏览着陆页就离开的访客百分比）有助于评估漏斗的健康状况。


  中部漏斗侧重于买家参与度，这很大程度上受产品推荐和个性化推荐的影响。用于监控买家参与度的关键指标包括加购率（将产品加入购物车的访客百分比）、结账率（进入支付页面的比例）以及结账（CO）与加购（CA）的比率。


  底部漏斗的绩效通过转化率、订单数量、GMV、NMV（考虑取消订单）、平均订单价值等指标进行追踪。这些指标有助于做出战术性的商品陈列决策。例如，如果最近几小时的平均订单价值较低，可以分析并调整促销策略。此外，产品组合和排名也可能产生影响。


