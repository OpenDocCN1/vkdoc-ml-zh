- "# 9. 面向生成式 AI 的 MLOps\n\n生成式人工智能代表了更广泛人工智能领域中最迷人且发展最快的领域之一。与专注于分类或预测的传统 AI 模型不同，生成式\
  \ AI 模型会创建新的数据实例。随着近期生成式 AI 的兴起，我们不得不思考如何将 MLOps 流程适配到这类新型 AI 驱动的应用中。在本章中，我们将重点讨论大型语言模型的生产化以及面向生成式\
  \ AI 应用生命周期的 MLOps 实践。\n\n## 理解生成式 AI\n\n生成式 AI 指的是一类能够生成新内容（例如图像、视频、文本甚至音乐）的人工智能系统，这些内容与人类可能产出的内容相似。这类\
  \ AI 基于深度学习算法，这些算法在大量数据（如图像或文本）上进行训练，并利用这些数据生成新内容。其动力来源于在大量数据语料库上预训练的大型模型，通常被称为*基础模型*。\n\
  \n这些主要包括大型语言模型和大型视觉模型。生成式 AI 的主要技术包括生成对抗网络、变分自编码器和基于 Transformer 的模型。\n\n*   **生成对抗网络**：\n\
  \n    生成对抗网络由两个神经网络组成：一个生成器和一个判别器，它们相互竞争。生成器创建虚假数据，而判别器评估其真实性。通过这种对抗过程，生成对抗网络能产生高度逼真的输出。\n\
  \n*   **变分自编码器**：\n\n    变分自编码器将输入数据编码到潜在空间，然后解码以重建原始数据。通过在潜在空间中采样，变分自编码器可以生成新的数据实例。\n\
  \n*   **Transformer**：\n\n    基于 Transformer 的模型，例如 GPT（生成式预训练 Transformer），利用注意力机制，通过根据先前项目提供的上下文预测序列中的下一个项目，来生成文本和其他序列数据。\n\
  \n\n\n### 为何需要基础模型\n\n基础模型（FM）的规模与通用性使其有别于传统机器学习模型，后者通常执行特定任务，例如分析文本情感、对图像进行分类以及预测趋势。\n\
  \n使用传统机器学习模型时，为完成每个特定任务，客户需要收集带标签的数据、训练模型并部署该模型。而使用基础模型，客户无需为每个模型收集带标签数据并训练多个模型，只需使用同一个预训练的基础模型即可适应各种任务。基础模型还可以进行定制，以执行与其业务不同的特定领域功能，且仅需从头训练模型所需数据量和计算量的一小部分。参见图\
  \ 9-1。\n\n![](img/609560_1_En_9_Fig1_HTML.jpg)\n\n图 9-1\n\n传统机器学习模型与基础模型对比\n\n基础模型的常见任务包括文本生成、问答、搜索、文本摘要、文本提取、代码生成、图像生成、音频生成、视频生成等。\n\
  \n### 生成式 AI 的重要性\n\n生成式 AI 的重要性在于其能够创建、创新和增强各种形式的数据。这种能力对多个领域的创造力、效率和问题解决具有深远影响。\n\
  \n#### 创造力与创新\n\n生成式 AI 通过生成艺术、音乐、文学和设计领域的原创内容来激发创造力。艺术家和创作者利用这些模型探索新的艺术方向并创作新颖作品。\n\
  \n#### 数据增强\n\n在机器学习中，生成式 AI 通过使用合成样本扩充数据集来克服数据限制，从而改进模型训练和性能。\n\n#### 自动化与效率\n\n\
  生成式 AI 自动化内容创作和设计流程，提升生产力，并减少与人工创作相关的时间和成本。\n\n#### 个性化\n\n这些模型通过生成定制化的内容、推荐和交互，实现高度个性化的用户体验。\n\
  \n### 生成式 AI 在各行业的应用\n\n生成式 AI 通过在自动化、创造力和问题解决方面开辟新的可能性，正在迅速改变各行各业。通过利用先进的机器学习模型，生成式\
  \ AI 能够生成曾经仅靠人工干预才能实现的内容、设计和解决方案。这项技术通过提升效率、驱动创新以及开辟定制化和个性化的新途径，正在彻底改变各行业的流程。随着生成式\
  \ AI 的持续发展，其应用正日益融入日常业务运营，重塑行业运作方式，并为未来的工作模式奠定基础。\n\n#### 医疗保健\n\n生成式 AI 通过在医学影像、药物发现和个性化医疗方面取得进展，正在彻底改变医疗保健行业。\n\
  \n##### 医学影像\n\n生成对抗网络（GAN）和变分自编码器（VAE）通过生成用于诊断目的的高质量图像来增强医学影像技术。这些模型提高了 MRI 和 CT\
  \ 扫描的分辨率，并协助创建用于训练目的的合成医学图像。\n\n##### 药物发现\n\n生成模型通过生成新药的潜在分子结构来加速药物发现。这减少了识别可行候选药物所需的时间和成本。\n\
  \n##### 个性化医疗\n\n通过分析患者数据，生成式 AI 可以创建个性化治疗方案并预测个体对治疗的反应，从而改善患者预后。\n\n#### 娱乐与媒体\n\
  \n在娱乐和媒体行业，生成式 AI 正在改变内容创作、动画和虚拟体验。\n\n##### 内容创作\n\nAI 生成的文本、音乐和艺术作品使创作者能够探索新想法并更高效地制作内容。例如，AI\
  \ 可以生成剧本草稿、创作音乐或创作视觉艺术作品。\n\n##### 动画与视觉效果\n\n生成模型有助于为电影和视频游戏创建逼真的动画和特效。GAN 可以生成栩栩如生的角色、景观和其他视觉元素。\n\
  \n##### 虚拟现实（VR）与增强现实（AR）\n\n生成式 AI 通过创建沉浸式环境和交互元素来增强 VR 和 AR 体验，使虚拟体验更具吸引力和真实感。\n\
  \n#### 金融\n\n金融行业利用生成式 AI 进行欺诈检测、算法交易和金融预测。\n\n##### 欺诈检测\n\n生成模型识别异常模式并生成合成欺诈场景来训练检测系统，从而提高其准确性和鲁棒性。\n\
  \n##### 算法交易\n\nAI 生成的交易策略分析海量市场数据，以识别有利可图的交易机会并优化投资组合。\n\n##### 金融预测\n\n生成式 AI\
  \ 模型通过分析历史数据和模拟各种场景来预测市场趋势和财务结果，辅助投资者和金融机构的决策。\n\n#### 零售与电子商务\n\n生成式 AI 通过个性化推荐、虚拟试穿和库存管理来增强零售和电子商务领域。\n\
  \n##### 个性化推荐\n\nAI 生成的推荐根据客户的偏好和浏览行为提供量身定制的产品建议，从而提升购物体验。\n\n##### 虚拟试穿\n\n生成模型创建虚拟试衣间，客户可以在其中数字化试穿服装和配饰，从而提高在线购物满意度并减少退货。\n\
  \n##### 库存管理\n\n生成式 AI 预测需求模式并优化库存水平，确保高效的库存管理并减少浪费。\n\n#### 制造业\n\n在制造业中，生成式 AI\
  \ 优化设计流程、预测性维护和供应链管理。\n\n##### 设计优化\n\nAI 生成的设计创建创新的产品原型，并针对性能、成本和可制造性优化现有设计。\n\n\
  ##### 预测性维护\n\n生成模型分析设备数据以预测维护需求并生成维护计划，从而减少停机时间并提高运营效率。\n\n##### 供应链管理\n\n生成式 AI\
  \ 预测供应链中断，并为库存管理、物流和需求预测生成最优策略。\n\n## 为生成式 AI 构建 MLOps 概念\n\n随着生成式 AI 模型复杂性的提升并成为众多应用的核心，对其从开发到部署再到维护的整个生命周期进行精细化管理变得至关重要。生成式\
  \ AI 应用的多方面生命周期带来了重大挑战，需要在各个阶段采用稳健的管理和可扩展的解决方案。\n\n在当今数据驱动的格局中，企业依赖 AI 来推动创新、传递客户价值并保持竞争优势。机器学习（ML）的广泛采用催生了用于可靠、经济高效且大规模管理代码、数据和模型的工具、流程和组织原则的开发。这种综合方法被称为*机器学习运维*（MLOps）。将\
  \ MLOps 扩展到生成式 AI 涵盖了 LLMOps 和 GenAIOps，以应对在生产环境中开发和部署生成式 AI 及大语言模型（LLM）驱动应用所面临的挑战。\n\
  \n\n\n### 现代生成式 AI 应用的生命周期\n\n现代生成式 AI 应用的开发始于一个基础模型，该模型经过预训练阶段来获取基础知识和涌现能力（见图 9-2）。企业需要一种安全的方法来访问\
  \ SaaS 或开源 LLM，以及一种高效的方法，通过全面的提示工程，针对特定用例严格测试这些模型。随后，模型会使用一个由人工生成的提示和响应组成的精选数据集，与人类的偏好、行为和价值观进行对齐，从而提高其遵循指令的精确性。\n\
  \n![](img/609560_1_En_9_Fig2_HTML.jpg)\n\n图 9-2\n\n生成式 AI 应用的生命周期\n\n组织可以选择训练自己的基础模型，或使用预训练好的模型。在定制阶段，基础模型要么通过特定任务的提示进行增强，要么在精选的企业数据集上进行微调。然而，基础模型内嵌的知识仅限于其预训练和微调数据，因此需要持续重新训练以保持时效性——这一过程成本可能很高。定制完成后，模型即可投入实际部署，可以独立运行，也可以作为集成多个基础模型和\
  \ API 的链条的一部分，以提供完整的应用逻辑。在此阶段，必须严格测试整个 AI 系统的准确性、性能和漏洞，并实施防护措施，确保模型输出的精确性、安全性和可靠性。随后，反馈循环闭合，用户通过用户界面进行交互，或通过系统检测进行自动化数据收集。这些反馈用于模型的持续更新和\
  \ A/B 测试，从而提升其对客户的价值。\n\n企业通常会管理众多针对不同用例、业务功能和工作流程定制的生成式 AI 应用。这个 AI 组合需要持续的监控和风险管理，以确保无缝运行、合乎道德的使用，并能迅速响应事件、偏见或性能退化。\n\
  \nGenAIOps 通过自动化加速了从研究到生产的这一过程，优化了开发和运营成本，提升了模型质量，增强了评估过程的稳健性，并确保持续的大规模运营。\n\n将\
  \ AI 想象成一系列嵌套的层次（图 9-3）。在最外层，机器学习（ML）涵盖了智能自动化，其中程序逻辑并非显式编码，而是从数据中推导得出。深入一层，我们会遇到专门的\
  \ AI 类型，例如基于大型语言模型（LLM）或检索增强生成（RAG）框架的类型。同样，也存在确保可重复性、可复用性、可扩展性、可靠性和效率的分层概念。\n\n\
  ![](img/609560_1_En_9_Fig3_HTML.jpg)\n\n图 9-3\n\n生成式 AI 的 MLOps 层次\n\n*   **MLOps**\
  \ 是一个总括性概念，涵盖了在生产环境中进行端到端机器学习系统开发和运营的核心工具、流程和最佳实践。\n\n*   **GenAIOps** 扩展了 MLOps，用于开发和运营生成式\
  \ AI 解决方案。GenAIOps 的显著特征在于对基础模型的管理和交互。\n\n*   **LLMOps** 是 GenAIOps 的一个特定类型，专注于开发和产品化基于\
  \ LLM 的解决方案。\n\n让我们从最底层开始，理解生成式 AI 的全面 MLOps 要素。\n\n### LLMOps\n\nLLM 在商业和媒体领域获得了显著关注，其影响力正\
  \ poised 改变众多行业（图 9-4）。\n\n![](img/609560_1_En_9_Fig4_HTML.jpg)\n\n图 9-4\n\nLLM\
  \ 从开发到生产的工作流程\n\n大型语言模型运维（LLMOps）涵盖了用于在生产环境中运营管理大型语言模型的实践、技术和工具。MLOps 的运营要求通常也适用于\
  \ LLMOps，但训练和部署 LLM 所面临的挑战需要一种独特的方法来应对 LLMOps。\n\n为了有效调整 MLOps 实践，我们必须审视随着 LLM 的引入，机器学习（ML）工作流程和要求是如何演变的。关键考量包括：\n\
  \n*   **计算资源**：训练和微调大型语言模型需要在大量数据集上进行显著更多的计算。为了加速这一过程，会使用 GPU 等专用硬件来执行速度更快的数据并行操作。访问这些专用计算资源对于训练和部署大型语言模型都至关重要。此外，推理成本也凸显了模型压缩和蒸馏技术的重要性。\n\
  \n*   **迁移学习**：与通常从头构建或训练的传统 ML 模型不同，许多大型语言模型从一个基础模型开始，随后使用新数据进行微调，以提升在特定领域的性能。这种微调使得在特定应用中能够获得最先进的结果，同时所需的数据和计算资源更少。\n\
  \n*   **人类反馈**：训练大型语言模型的一个重大进步是通过基于人类反馈的强化学习（RLHF）实现的。鉴于 LLM 任务通常具有开放性，最终用户的反馈对于评估\
  \ LLM 性能至关重要。将这个反馈循环整合到你的 LLMOps 流程中，不仅能简化评估过程，还能为未来微调你的 LLM 提供宝贵的数据。\n\n*   **超参数调优**：在传统\
  \ ML 中，超参数调优主要侧重于提高准确性或其他性能指标。然而，对于 LLM 而言，调优对于最小化训练和推理所需的成本和计算能力也至关重要。调整批量大小和学习率等参数会显著影响训练的速度和费用。因此，虽然经典\
  \ ML 模型和 LLM 都能从管理良好的调优过程中受益，但优先级有所不同，LLM 更强调成本和计算效率。\n\n*   **性能指标**：传统 ML 模型有明确定义的性能指标，如准确率、AUC\
  \ 和 F1 分数，这些指标计算相对简单。然而，评估 LLM 涉及一套不同的标准指标，例如双语评估替补（BLEU）和面向召回率的摘要评估替补（ROUGE）。实施这些指标需要额外的考量。\n\
  \n*   **提示工程**：遵循指令的模型可以处理复杂的提示或指令集。设计这些提示模板对于从 LLM 获得准确可靠的响应至关重要。有效的提示工程可以降低模型幻觉和提示攻击的风险，例如提示注入、敏感数据泄露和越狱。\n\
  \n*   **构建 LLM 链或流水线**：使用 LangChain 或 LlamaIndex 等工具创建的 LLM 流水线，集成了多个 LLM 调用以及与外部系统（如向量数据库或网络搜索）的交互。这些流水线使\
  \ LLM 能够执行复杂任务，例如知识库问答或基于一组文档响应用户查询。因此，LLM 应用开发通常侧重于构建这些流水线，而不是从头开发新的 LLM。\n\n\n\
  \n#### LLMOps 的优势\n\n尽管大语言模型在原型设计阶段使用起来特别直接，但将其集成到商业产品中会带来重大挑战。LLM 开发生命周期包含众多复杂组件，包括数据摄取、数据准备、提示工程、模型微调、部署和监控。此过程还需要数据工程、数据科学和机器学习工程等多个团队之间的协作和无缝交接。保持运营严谨性对于确保这些流程同步且有效至关重要。LLMOps\
  \ 涵盖了整个 LLM 开发生命周期中的实验、迭代、部署和持续改进。LLMOps 的主要优势在于提高效率、可扩展性和降低风险。\n\n*   **效率**：LLMOps\
  \ 使数据团队能够加速模型和管道的开发，生成更高质量的模型，并加快部署到生产环境的速度。\n\n*   **可扩展性**：LLMOps 支持大规模的可扩展性和管理，允许监督、控制、管理和监控数千个模型，以实现持续集成、交付和部署。它确保了\
  \ LLM 管道的可重复性，促进了数据团队之间更紧密的协作，最大限度地减少了与 DevOps 和 IT 的冲突，并加快了发布周期。\n\n*   **风险降低**：鉴于\
  \ LLM 通常需要监管监督，LLMOps 提高了透明度，并允许对此类请求做出更快速的响应，从而确保更好地遵守组织或行业政策。\n\n#### LLMOps 最佳实践\n\
  \n机器学习项目中 LLMOps 的范围可能因项目需求而有很大差异。在某些情况下，LLMOps 可能涵盖从数据准备到管道生产的整个过程，而在其他情况下，它可能只涉及模型部署过程。以下最佳实践可应用于流程的不同阶段：\n\
  \n*   **探索性数据分析 (EDA)**：通过创建可重现、可编辑和可共享的数据集、表格和可视化，为机器学习生命周期迭代地探索、共享和准备数据。\n\n*\
  \   **数据准备和提示工程**：迭代地转换、聚合和去重数据，使其在数据团队之间可访问和共享。迭代地开发提示，以确保对 LLM 的结构化和可靠查询。\n\n\
  *   **模型微调**：利用流行的开源库，如 Hugging Face Transformers、DeepSpeed、PyTorch、TensorFlow 和\
  \ JAX，来微调模型并提升其性能。\n\n*   **模型审查与治理**：跟踪模型和管道的谱系和版本，在其整个生命周期中管理这些工件。使用像 MLflow 这样的开源\
  \ MLOps 平台来发现、共享和协作 ML 模型。\n\n*   **模型推理与服务**：在测试和质量保证中管理模型刷新频率、推理请求时间以及其他生产特定细节。采用\
  \ CI/CD 工具，包括代码仓库和编排器（借鉴 DevOps 原则），来自动化预生产管道。启用带有 GPU 加速的 REST API 模型端点。\n\n* \
  \  **带有人工反馈的模型监控**：建立模型和数据监控管道，并针对模型漂移和恶意用户行为设置警报。\n\n### GenAIOps\n\nGenAIOps 整合了最佳实践来管理所有生成式\
  \ AI 工作负载，涵盖语言、图像和多模态模型。对于生成式 AI，需要重新思考数据整理、模型训练、定制、评估、优化、部署和风险管理的过程。构建生成式 AI 应用程序涉及多个组件，例如\
  \ LLM、数据源、向量存储、提示工程和 RAG。GenAIOps 为构建、测试和部署生成式 AI 应用程序定义了 DataOps、LLMOps 和 DevOps\
  \ 整体管理的运营最佳实践。\n\n#### GenAIOps 自动化面临的挑战\n\n以下是组织为实现成功的 GenAIOps 管道必须克服的一些挑战：\n\n\
  1.  **访问企业数据**：这涉及创建到各种存储解决方案和数据库的连接器，并考虑不同的摄取格式，如文件、表格数据或 API 响应。与传统的 ETL 不同，提取、清洗、掩码和分块技术需要特别关注，尤其是在处理复杂结构（如\
  \ PDF 中的表格）或从网络爬取中移除不需要的 HTML 标签时。\n\n2.  **嵌入算法**：嵌入算法不断演变的特性意味着，试验顶级模型以选择最适合您需求的模型至关重要。否则，可能会对搜索过程产生不利影响。\n\
  \n3.  **查询阶段管理**：此阶段容易受到对抗性行为者的攻击，他们可能试图“越狱”提示或使系统过载，从而影响其他用户并可能导致成本激增。\n\n4.  **分块检索过程**：对于分块检索过程，相似性搜索可能无法检索到足够的信息，或者无法检索到匹配的分块，导致缺乏全面和相关答案所需的上下文。需要高级检索链来用个性化上下文增强提示。（“我的”保险计划有哪些索赔除外？）\n\
  \n5.  **提示效率与提示管理**：开源 LLM 在语言理解方面正在迅速追赶专有 LLM，这在 HuggingFace 上的开放 LLM 排行榜中显而易见\
  \ [1]。因此，编写高效的提示对于获得相关且全面的答案非常重要。糟糕的提示可能会混淆 LLM 或导致不充分的响应。\n\n6.  **理解企业领域**：虽然生成式\
  \ AI 有效地解决了企业中的许多探究性挑战，但 LLM 通常难以掌握单个企业领域的特定细微差别。LLM 是通过抓取万维网在公开可用的数据集上训练的，但企业数据位于防火墙之后；因此，LLM\
  \ 可能无法理解企业内部使用的特定术语，从而导致“我不知道”的响应，或给出与维基百科词典中类似术语相关的响应，进而产生幻觉。\n\n7.  **内容安全**：如果没有适当的护栏，LLM\
  \ 可能会输出有毒或不安全的内容，导致品牌声誉问题。想象一下，为儿童或其他信息不灵通或易受影响的群体构建这些 AI 聊天机器人，他们可能会被错误信息引入歧途。\n\
  \n8.  **用户体验**：大多数生成式 AI 系统不关注最终用户体验。ChatGPT 已经设定了用户体验的标准，但 OpenAI 控制着包括模型在内的端到端管道。缺乏良好的体验，例如流式响应、A/B\
  \ 测试框架、缺乏详尽的用户反馈机制、足够的种子问题或缺乏后续问题，可能会降低用户参与度。\n\n\n\n#### 企业级 GenAIOps 最佳实践\n\n\
  有效的 GenAIOps 运营化需要具备 AI 工程师、安全专家和领域专家等技能。以下是一些最佳实践：\n\n1.  **数据管理**：利用标准存储、数据库和\
  \ SaaS 应用接口，以最小化批量分布式数据复制和增量摄取。为使其适配 LLM，需使用分布式运行时进行数据提取、清洗、脱敏和分块。将源元数据的副本维护到向量存储中，确保下游查询系统能将其用于预过滤，以获得更相关的答案。\n\
  \n2.  **模型选择**：根据您的数据集，为您的用例选择最合适的嵌入模型。在实验阶段，至少尝试排名前两位的嵌入模型技术，以基于人工生成的标准问答对来理解搜索相关性。如果您没有人工生成的问答对，可利用\
  \ LLM 生成的合成问题。\n\n3.  **查询阶段管理**：为防止有意或无意的有害行为，使用合适的分类模型来拦截问题并提供预设回复。监控有害提示的趋势，并采取适当措施迭代改进分类方法。为防止垃圾攻击，启用基于用户和令牌的限流，以限制攻击向量。\n\
  \n4.  **检索优化**：使用用户元数据进行预过滤，为语义搜索生成更窄的结果集，以实现最佳检索。许多向量数据库（如 OpenSearch、MongoDB 和\
  \ Pinecone）都提供混合搜索能力。根据您的源数据集，使用额外的检索链来检索整个或部分文档，为您的 LLM 查询提供充分的上下文。例如，在研发聊天机器人中，如果用户要求总结某篇科学论文，您的检索链必须基于匹配的块来检索整篇论文。\n\
  \n5.  **构建高效的系统提示**：构建系统提示是获得最佳响应的最关键任务。由于缺乏通用的提示框架，请确保遵循基于 LLM 或您的任务（例如对话、总结或分类）最合适的标准。为企业特定用例维护一个最佳实践提示库，以便他人受益。让领域专家参与设计系统提示至关重要，因为他们非常熟悉数据集和预期输出。提供一个提示游乐场，让领域专家可以直观地编写系统提示，包括示例、“禁止”规则和预期的响应格式。提供一个游乐场，以便快速与您企业授权的模型进行比较。维护提示的版本，以便将最佳版本推广到生产环境。\n\
  \n6.  **模型实验**：许多企业从 SaaS 模型提供商（如 Azure OpenAI 或 Amazon Bedrock）开始。开源模型（如 Llama2、Mistral\
  \ 和 MPT 及其变体）正在迅速追赶。针对至少两到三个领先的 SOTA 模型测试您的应用，以了解响应时间、领域理解和响应质量。典型的企业应用可能不需要多头部\
  \ SaaS 模型的复杂功能，因此随着规模扩展，使用开源模型可能同样有效，并提供更好的性价比。为快速测试，构建一个评估脚本，采用“LLM 作为评判者”的方法来比较响应的相关性、全面性和准确性。如果通用模型无法提供相关且全面的响应，则采用领域特定的微调或指令微调技术，并在您的\
  \ RAG 中使用微调后的模型。\n\n7.  **内容安全**：为防止有害、有毒的响应，增强系统提示以指示 LLM 从响应中删除有害内容。使用其他分类器采用额外控制措施，完全阻止有害响应，以确保信任和安全。使用一组标准问题进行自动化测试，确保\
  \ RAG 经过回归测试，以应对 LLM、系统提示或数据中的任何变化。护栏在对抗性或不受支持的输入到达基础模型之前将其拦截，确保输出准确、相关、安全可靠。它们监控和验证对话状态及活动上下文，检测意图，并在执行内容策略的同时做出决策。这些护栏扩展了模型管理所涵盖的基于规则的\
  \ AI 输入/输出预处理/后处理。\n\n8.  **提升用户体验**：最终，用户体验对于提高参与度和吸引新用户至关重要。如果您正在构建对话系统，请添加流式传输，提供适当的反馈选项以便用户对响应进行评分，并自愿提供正确的响应以构建知识库。提供自定义指令、启动对话的引导性问题以及后续问题。生成式\
  \ AI 正在快速发展，因此持续监控用户反馈并整合多模态（图像和文本）等附加功能至关重要。\n\n这些最佳实践使企业能够执行快速原型设计、生产部署和持续监控。生成式\
  \ AI 应用的可观测性能力、评估和集中性能监控，可实现持续的质量改进和企业治理。\n\n### MLOps\n\nMLOps 为机器学习模型在生产环境中的开发、训练、评估、优化、部署、推理和监控建立了结构化框架。MLOps\
  \ 的原则和能力同样适用于生成式 AI，包括以下方面：\n\n*   **基础设施管理**：以编程方式请求、配置和配置计算、存储和网络资源，以访问底层硬件。\n\
  \n*   **数据管理**：处理用于训练和评估的数据收集、摄取、存储、处理和标注。实施基于角色的访问控制；促进数据集搜索、浏览和探索；跟踪数据来源；记录数据日志；对数据集进行版本管理；索引元数据；验证数据质量；并利用数据集卡片和仪表板进行数据可视化。\n\
  \n*   **工作流和管道管理**：将数据准备、模型训练、模型评估、模型优化和模型部署步骤集成到端到端的自动化、可扩展工作流中，利用云资源或本地工作站。\n\n\
  *   **模型管理**：训练、评估和优化用于生产的模型，在集中式模型注册表中使用模型卡片存储和版本化管理模型，评估模型风险，并确保符合标准。\n\n*   **实验管理和可观测性**：跟踪和比较各种机器学习模型实验，包括训练数据、模型和超参数的变化。自动探索可能的模型架构和超参数空间，分析推理期间的模型性能，并监控模型输入和输出是否存在概念漂移。\n\
  \n*   **交互式开发**：管理开发环境，与外部版本控制系统、桌面 IDE 和其他独立开发者工具集成，促进团队协作、任务启动和项目原型设计。\n\n从 MLOps\
  \ 的角度来看，LLM 带来了新的需求，对 MLOps 实践和平台产生了影响。表 9-1 总结了 LLM 的关键特性及其对 MLOps 的影响。\n\n表 9-1\n\
  \nLLM 的关键特性及其对 MLOps 的影响\n\n\n\n| LLM 的关键特性 | 对 MLOps 的影响 |\n| --- | --- |\n| LLM\
  \ 有多种形式：    • 付费 API 背后的通用专有模型    • 从通用到特定应用的开源模型    • 为特定应用微调的自定义模型 | **开发流程：**\
  \ 项目通常采用渐进式开发，从现有的、第三方或开源模型起步，最终形成自定义微调模型。 |\n| 许多 LLM 以通用自然语言查询和指令作为输入。这些查询可以包含精心设计的“提示词”，以引出期望的响应。\
  \ | **开发流程：** 为查询 LLM 设计文本模板通常是开发新 LLM 流水线的重要环节。**打包 ML 制品：** 许多 LLM 流水线会使用现有的 LLM\
  \ 或 LLM 服务端点；为这些流水线开发的 ML 逻辑可能侧重于提示词模板、代理或“链”，而非模型本身。打包并推送到生产环境的 ML 制品通常可能是这些流水线，而非模型。\
  \ |\n| 许多 LLM 可以接收带有示例、上下文或额外信息的提示词，以帮助回答查询。 | **服务基础设施：** 在向 LLM 查询补充上下文时，使用向量数据库等以往不常用的工具来搜索相关上下文非常有价值。\
  \ |\n| LLM 是非常庞大的深度学习模型，大小通常从千兆字节到数百千兆字节不等。 | **服务基础设施：** 许多 LLM 可能需要 GPU 来实现实时模型服务。**成本/性能权衡：**\
  \ 由于更大的模型需要更多计算资源，服务成本更高，因此可能需要采用减小模型大小和计算量的技术。 |\n| LLM 难以通过传统的 ML 指标进行评估，因为通常不存在单一的“正确”答案。\
  \ | **人工反馈：** 由于人工反馈对于评估和测试 LLM 至关重要，因此必须将其更直接地整合到 MLOps 流程中，既用于测试和监控，也用于未来的微调。\
  \ |\n\n*来源：Databricks MLOps 大百科，第 2 版*\n\n## 面向生成式 AI 的 AWS MLOps\n\nAWS 提供了一个广泛的生态系统，支持生成式\
  \ AI 生命周期的每个阶段，从数据准备和模型训练，到生成式 AI 应用的开发、部署和监控。以下是构成 AWS 生成式 AI 格局的关键要素。\n\n### 使用基础模型进行构建\n\
  \nAWS 提供了一条路径，通过新的能力、行业领先的基础模型（FM）的选择以及最具成本效益的基础设施，来加速创新。\n\n#### Amazon Bedrock\n\
  \nBedrock 是一项完全托管的服务，通过单一 API 提供来自领先 AI 公司（如 AI21 Labs、Anthropic、Cohere、Meta、Mistral\
  \ AI、Stability AI 和 Amazon）的一系列高性能基础模型（FM）的访问权限。它提供了一套全面的功能来开发生成式 AI 应用，重点关注安全性、隐私性和负责任的\
  \ AI。借助 Amazon Bedrock，您可以轻松针对特定用例试验和评估顶级 FM，通过微调和检索增强生成（RAG）等技术使用您的数据私下定制它们，并构建能够使用您的企业系统和数据源执行任务的代理。由于\
  \ Amazon Bedrock 是无服务器的，因此无需管理基础设施，您可以使用熟悉的 AWS 服务将生成式 AI 功能安全地集成和部署到您的应用程序中。\n\n\
  ##### 模型选择的灵活性\n\nAmazon Bedrock 帮助您快速适应并利用最新的生成式 AI 创新，轻松访问来自领先 AI 公司（如 AI21 Labs、Anthropic、Cohere、Meta、Mistral\
  \ AI、Stability AI 和 Amazon）的一系列高性能 FM。无论您选择哪种模型，Amazon Bedrock 的单一 API 访问都为您提供了灵活性，可以使用不同的\
  \ FM，并以最少的代码更改升级到最新的模型版本。\n\n##### 安全定制\n\n为了针对特定任务定制模型，您只需几个简单步骤，即可使用您的标记数据集私下微调基础模型（FM）。Amazon\
  \ Bedrock 支持对 Cohere Command、Meta Llama 2、Amazon Titan Text Lite 和 Express、Amazon\
  \ Titan Multimodal Embeddings 以及 Amazon Titan Image Generator 进行微调。为了将 Amazon Titan\
  \ Text 模型适配到您的行业和领域，您可以使用未标记数据进行持续预训练。通过微调和持续预训练，Amazon Bedrock 会创建一份仅您可访问的基础 FM\
  \ 的独立副本，确保您的数据不会用于训练原始基础模型。AWS 允许您通过简单地在 Amazon S3 中指向几个标记示例来私下定制模型，使服务能够仅用 20 个示例就为特定任务微调模型。例如，一家领先时装零售商的内容营销经理需要为新手袋系列制作新颖、有针对性的广告和活动文案，他们可以提供过去活动中表现最佳的标语以及相关产品描述的标记示例。然后，Bedrock\
  \ 将自动为新手袋生成有效的社交媒体、展示广告和网页文案。\n\n*   **生成式 AI 应用的安全性**：使用 Bedrock，您可以完全控制用于为生成式\
  \ AI 应用定制基础模型的数据。您的数据在传输和静态存储时均会加密。此外，您可以通过 AWS Key Management Service (AWS KMS)\
  \ 创建、管理和控制加密密钥。基于身份的策略提供了额外的控制，允许您管理用户和角色在特定资源上以及在特定条件下可以执行的操作。\n\n*   **数据保护与隐私**：Bedrock\
  \ 确保您的数据始终在您的控制之下。当您微调基础模型时，它基于一个私有副本，这意味着您的数据不会与模型提供商共享，也不会用于改进基础模型。您可以使用 AWS PrivateLink\
  \ 从您的 Amazon Virtual Private Cloud (VPC) 到 Amazon Bedrock 建立私有连接，避免将您的 VPC 暴露于互联网流量。此外，Bedrock\
  \ 符合通用标准，包括 ISO、SOC 和 CSA STAR Level 2，符合 HIPAA 资格，并且可以符合 GDPR 要求使用。\n\n*   **治理与可审计性**：Bedrock\
  \ 提供广泛的监控和日志记录功能，以满足您的治理和审计需求。您可以利用 Amazon CloudWatch 跟踪使用指标并创建用于审计的自定义仪表板。此外，AWS\
  \ CloudTrail 可用于监控 API 活动，并在将其他系统集成到您的生成式 AI 应用时排查问题。您还可以选择将元数据、请求和响应存储在您的 Amazon\
  \ Simple Storage Service (Amazon S3) 存储桶和 Amazon CloudWatch Logs 中。为防止滥用，Amazon\
  \ Bedrock 集成了自动滥用检测机制。\n\n### 基础模型训练与托管基础设施\n\n构建基础模型（FM）需要构建、维护和优化大型集群，以便在海量数据上训练具有数百亿到数千亿参数的模型。AWS\
  \ 为生成式 AI 提供了专用加速器。\n\n\n\n#### Amazon SageMaker HyperPod\n\n构建基础模型（FM）需要构建、维护和优化大型集群，以便在海量数据上训练拥有数百亿至数千亿参数的模型。Amazon\
  \ SageMaker HyperPod 简化了为训练基础模型而构建和优化机器学习基础设施这一复杂任务，可将训练时间缩短多达 40%。它预配置了 SageMaker\
  \ 的分布式训练库，使客户能够自动将训练工作负载分布到数千个加速器上，从而提升模型性能。此外，SageMaker HyperPod 通过定期保存检查点来确保 FM\
  \ 训练不中断。如果在训练过程中发生硬件故障，它会自动检测问题、修复或替换故障实例，并从上一个检查点恢复训练，无需人工干预，从而实现连续数周或数月的无中断训练。\n\
  \n#### AWS Trainium 和 AWS Inferentia2\n\n训练大规模 LLM 需要在超过 100 个节点上进行分布式训练，而要弹性获取大型高性能计算集群非常困难。即使您成功获得了所需的加速计算能力，管理超过\
  \ 100 个节点的集群、维持硬件稳定性以及实现模型训练的稳定性和收敛性也极具挑战性。\n\n对于拥有数十亿参数的基础模型的大规模训练，Trainium Trn1\
  \ 和 Trn1n 实例因其特性而成为理想选择。Trn1 实例由先进的 NeuronCore-v2 技术驱动，提供充足的加速器计算能力和内存。Trn1n 实例提供更高的网络带宽（1,600\
  \ Gbps），非常适合注重成本优化的高性能训练。\n\nAWS Inferentia 是 AWS 专门为推理设计的高性能、低成本的机器学习推理加速器。\n\n\
  每个 EC2 Inf2 实例最多可搭载 12 个 Inferentia2 设备，并提供四种实例规格供您选择：Inf2.xlarge、Inf2.8xlarge、Inf2.24xlarge\
  \ 和 Inf2.48xlarge。参见图 9-5。\n\n![](img/609560_1_En_9_Fig5_HTML.jpg)\n\n图 9-5\n\n\
  AWS Inf2 架构\n\nAmazon EC2 Inf2 支持 NeuronLink v2，这是一种低延迟、高带宽的芯片间互连技术，可实现诸如 AllReduce\
  \ 和 AllGather 等高性能集合通信操作。这能够高效地将模型分片到多个 AWS Inferentia2 设备上（例如通过张量并行），从而优化延迟和吞吐量。这对于大型语言模型尤其有用。图\
  \ 9-6 展示了 AWS Inferentia2 设备架构的内部工作原理。\n\n![](img/609560_1_En_9_Fig6_HTML.jpg)\n\
  \n图 9-6\n\nAWS Inf2 设备架构\n\n#### DJLServing\n\nDJLServing 是一个高性能模型服务器，于 2023 年 3\
  \ 月支持 AWS Inferentia2。AWS 提供了一个适用于 LLM/AIGC 用例的容器镜像。DJL 集成了对 Neuron 的 Rubikon 支持，其中包括\
  \ DJLServing 和 transformers-neuronx。这些是容器的核心组件，旨在服务于 transformers 库所支持的 LLM。该容器以及后续的\
  \ DLC，能够利用已安装的 AWS Inferentia 驱动程序和工具包，在 Amazon EC2 Inf2 主机内的 AWS Inferentia 芯片上加载模型。\n\
  \n#### SageMaker 深度学习容器 (DLCs)\n\n大型模型通常超出单个加速器的内存容量。例如，BLOOM-176B 模型可能需要超过 350\
  \ GB 的内存，这超出了当前硬件加速器的能力。这就需要使用 DeepSpeed 和 Hugging Face Accelerate 等库中的模型并行技术，将模型分布到多个加速器上进行推理。SageMaker\
  \ 的大型模型推理容器可与这些库一起使用，以提升模型性能。\n\n#### SageMaker Jumpstart\n\nSageMaker Jumpstart\
  \ 使您能够托管自己的机器学习模型，允许您选择基础设施组件，例如实例规格和部署端点。训练和部署拥有数十亿参数的 LLM 的主要挑战之一是其规模，这使得它们难以装入通常用于深度学习的单个\
  \ GPU 中。这些模型的规模需要高性能计算资源，例如具有大容量内存的专用 GPU。此外，这些模型的规模可能导致计算成本高昂，显著增加训练和推理时间。您可以使用\
  \ Amazon SageMaker JumpStart 在特定领域的数据集上轻松微调大型语言文本生成模型，其方式与在 Amazon SageMaker 上训练和部署任何模型类似。JumpStart\
  \ 目前提供两种微调方式：指令微调和领域自适应微调。\n\n### 在 AWS 上实现生成式 AI 的 MLOps 运营\n\n随着组织越来越多地采用生成式 AI\
  \ 来推动创新和增强决策能力，建立强大的运营框架变得至关重要。通过利用 AWS 全面的工具和服务套件，企业可以无缝地将其生成式 AI 模型投入运营，确保它们在真实应用中提供一致、高质量的输出。\n\
  \n### 使用 Amazon Bedrock 的 LLMOps\n\nAmazon Bedrock 是一项完全托管的服务，通过单一 API 简化了对来自领先\
  \ AI 公司的高性能基础模型（FM）的访问。它使开发人员能够构建和扩展生成式 AI 应用程序，而无需管理底层基础设施的复杂性。它提供以下功能：\n\n*  \
  \ **访问基础模型**：Bedrock 提供来自 Amazon 以及 AI21 Labs、Anthropic 和 Stability AI 等第三方提供商精心挑选的高质量模型，使您能够为特定用例选择最合适的模型，而无需受限于单一提供商。\n\
  \n*   **API 优先方法**：其以 API 为中心的设计确保了与现有工作流和工具的无缝集成，使您能够以最小的干扰将 Bedrock 整合到当前的开发流程中。\n\
  \n*   **微调能力**：Bedrock 使您能够定制模型以满足特定需求，从而提升在特定领域任务上的性能。这对于希望利用专有数据来提升模型性能的组织至关重要。\n\
  \n*   **托管基础设施**：AWS 负责底层基础设施，让您可以专注于模型开发和部署，而无需管理服务器，从而显著降低运行大型语言模型的操作开销。\n\n*\
  \   **内置安全与合规性**：Bedrock 包含企业级安全功能，帮助您满足各种监管标准的合规要求。\n\n参考图 9-2 所示的生成式 AI 应用生命周期，以下部分将详细阐述\
  \ Amazon Bedrock 如何帮助实现 LLMOps。\n\n\n\n#### 选择合适的基础模型\n\nAmazon Bedrock 让您能够访问来自顶尖\
  \ AI 公司（如 AI21 Labs、Anthropic、Cohere、Meta、Mistral AI、Stability AI 和 Amazon）的一系列高性能基础模型。凭借其单一\
  \ API 访问接口，Bedrock 为您提供了使用各种基础模型的灵活性，并且只需对代码进行最小程度的修改即可升级到最新版本。Amazon Bedrock 提供了一套基础模型，能够生成以下模态的输出：\n\
  \n*   **文本**：根据文本输入生成各种文本类型。示例包括聊天、问答、头脑风暴、摘要、代码生成、表格创建、数据格式化和重写。\n\n*   **图像**：根据文本或输入图像生成或修改图像。示例包括图像生成、编辑和变体。\n\
  \n*   **嵌入**：根据文本、图像或两者生成数值向量。这些向量可以与其他嵌入进行比较，以确定语义或视觉相似性。示例包括文本和图像搜索、查询、分类、推荐、个性化和知识库创建。\n\
  \n#### 自定义基础模型\n\n您可以在 Amazon Bedrock 中使用自己的数据，以私密且安全的方式自定义基础模型，从而开发适合您所在领域、组织和用例的应用程序。自定义模型使您能够创建与公司风格、声音和服务相一致的独特用户体验。\n\
  \n微调允许您通过提供特定任务的有标签训练数据集来提高模型准确性，进一步专业化您的基础模型。持续预训练则允许您在由客户管理密钥的安全托管环境中，使用自己的无标签数据来训练模型。此过程增强了模型的领域特异性，在其原始训练之外构建了更强大的知识和适应性。\n\
  \nAmazon Bedrock 目前提供以下自定义方法：\n\n*   **持续预训练**：使用无标签数据对基础模型进行预训练，使其熟悉特定的输入类型。您可以提供特定主题的数据来增强模型的领域知识。此过程会调整模型的参数，以更好地处理输入数据。例如，您可以使用未公开的内部业务文档等私有数据来训练模型。随着更多无标签数据的出现，您可以通过重新训练来进一步增强模型。\n\
  \n*   **微调**：使用有标签数据来训练模型，并提高其在特定任务上的性能。通过提供包含有标签示例的数据集，模型学会为给定的输入生成适当的输出。此过程会调整模型的参数，从而提高其在训练数据集所代表任务上的性能。\n\
  \n#### 提示工程与测试\n\n提示工程涉及优化向大语言模型输入的文本，以获得期望的响应。它有助于大语言模型执行各种任务，如分类、问答、代码生成、创意写作等。提示的质量会显著影响大语言模型生成的响应。Amazon\
  \ Bedrock 提供了一个平台，用于使用其支持的模型创建和测试提示。\n\nAmazon Bedrock 上的大语言模型包含各种推理参数，如温度、令牌长度、Top-P、Top-K\
  \ 以及结束令牌/结束序列。这些参数允许您控制模型的响应。Amazon Bedrock 上的大语言模型在接收到清晰直接的指令时表现最佳，但您也可以尝试不同的提示技巧，例如少样本提示和思维链。Bedrock\
  \ 还为常见任务和用例提供了提示模板，可帮助您入门提示工程。\n\n#### Bedrock 护栏\n\nBedrock 护栏允许您根据特定的用例和负责任的人工智能政策，为生成式人工智能应用程序建立安全防护措施。您可以创建针对不同场景的多个护栏，并将其应用于多个基础模型，从而确保一致的用户体验，并标准化跨生成式人工智能应用程序的安全和隐私控制。\n\
  \n护栏还与 Bedrock 知识库集成，并提供一套全面的策略来保护用户免受不良交互的影响。您可以自定义拒绝主题以避免在应用程序上下文中出现，根据预构建的类别（如仇恨、侮辱、性内容、暴力、不当行为和提示攻击）过滤内容，并定义要屏蔽的冒犯性或不当词语。此外，您可以过滤包含敏感信息（如个人身份信息）的用户输入，或在模型响应中编辑机密信息。护栏可应用于发送给模型的输入以及基础模型生成的内容。\n\
  \n#### 赋予基础模型上下文\n\n借助 Amazon Bedrock 的知识库，您可以为基础模型和代理提供来自公司私有数据源的上下文信息，用于检索增强生成，从而提高响应的相关性、准确性和定制化程度。此功能会自动从各种来源检索文档，将其分割成文本块，将文本转换为嵌入，并将其存储在您的向量数据库中。如果您没有现有的向量数据库，Amazon\
  \ Bedrock 可以为您创建一个 Amazon OpenSearch Serverless 向量存储。或者，您可以指定来自受支持数据库的现有向量存储，包括\
  \ Amazon OpenSearch Serverless、Pinecone 和 Redis Enterprise Cloud，并支持 Amazon Aurora\
  \ 和 MongoDB。\n\n#### 部署 Bedrock 代理\n\n生成式人工智能代理是大型企业通用且强大的资产。它们能提高运营效率、改善客户服务并支持决策，同时降低成本并促进创新。这些代理在自动化各种常规和重复性任务方面特别有效，包括数据录入、客户支持查询和内容创建。此外，它们可以通过将复杂任务分解为更小、可管理的操作，并协调各个步骤来高效执行这些操作，从而管理复杂的多步骤工作流。\n\
  \nAmazon Bedrock 的代理扮演着指挥者的角色，协调基础模型、API 集成、用户对话以及加载了您数据的知识源之间的交互。\n\nAmazon Bedrock\
  \ 的代理和知识库协同工作，提供以下能力：\n\n*   **任务编排**：代理利用基础模型来解释自然语言查询，并将复杂任务分解为更小、可操作步骤。\n\n*\
  \   **交互式数据收集**：代理通过自然对话与用户互动，以收集更多信息。\n\n*   **任务执行**：通过基于 ReAct 提示的一系列推理步骤和操作，代理完成客户请求。\n\
  \n*   **系统集成**：代理通过向集成的公司系统发出 API 调用来执行特定操作。\n\n*   **数据查询**：知识库通过来自客户特定数据源的完全托管式检索增强生成，提高准确性和性能。\n\
  \n*   **来源归属**：代理执行来源归属，通过思维链推理追溯信息或操作的来源。\n\n您可以在 Amazon Bedrock 控制台中或通过向 TSTALIASID\
  \ 发出 API 调用来测试您的代理。根据需要调整配置。使用追踪功能来分析您的代理在每个编排步骤中的推理过程。\n\n一旦您的代理经过充分修改并准备好部署，请创建一个指向代理版本的别名。配置您的应用程序以向代理别名发出\
  \ API 调用，并根据需要通过创建其他版本和别名来持续优化您的代理。参见图 9-7。\n\n![](img/609560_1_En_9_Fig7_HTML.jpg)\n\
  \n图 9-7\n\n使用 Bedrock 代理和知识库的示例解决方案架构\n\n\n\n#### 使用 Amazon Bedrock 进行推理\n\nAmazon\
  \ Bedrock 允许您使用所选的基础模型进行推理。进行推理时，您需要提供以下输入：\n\n*   **提示词**：提供给模型以生成响应的输入\n*   **推理参数**：有助于引导或限制模型响应的可调值\n\
  \n您可以通过以下方式进行模型推理：\n\n*   在用户友好的图形界面中使用任意一种游乐场进行推理。\n*   使用 Converse 和 ConverseStream\
  \ API 构建对话式应用程序。\n*   发送 `InvokeModel` 或 `InvokeModelWithResponseStream` 请求。\n*\
  \   准备一个包含所需配置的提示词数据集，并通过 `CreateModelInvocationJob` 请求运行批量推理。\n\n您可以使用基础模型、自定义模型或预置模型进行推理。要对自定义模型进行推理，您需要首先购买预置吞吐量。使用这些方法，通过不同的提示词和推理参数来测试基础模型的响应。在探索了这些方法之后，您可以配置应用程序，通过调用这些\
  \ API 来运行模型推理。\n\n图 9-8 展示了一个如何从您的应用程序调用 Bedrock API 的简单示例。\n\n![](img/609560_1_En_9_Fig8_HTML.jpg)\n\
  \n图 9-8\n\nBedrock API 调用\n\n#### 监控与治理\n\nAmazon Bedrock 提供广泛的监控和日志记录功能，以满足您的治理和审计需求。您可以使用\
  \ Amazon CloudWatch 监控使用指标，并创建用于审计的自定义仪表板。AWS CloudTrail 允许您跟踪 API 活动，并在将其他系统集成到您的生成式\
  \ AI 应用程序时排查问题。此外，您可以选择将元数据、请求和响应存储在您的 Amazon S3 存储桶和 Amazon CloudWatch Logs 中。\n\
  \n#### 评估与持续改进\n\nAI 领域在不断发展，您的模型、提示词、智能体和应用程序也应如此。Amazon Bedrock 提供以下功能来支持这一点：\n\
  \n*   **模型评估任务**：模型评估在开发的所有阶段都至关重要。Amazon Bedrock 提供了自动评估和人工评估的选项。自动评估使用预定义的指标，如准确性、鲁棒性和毒性。对于主观或自定义指标（例如友好度、风格和品牌语调一致性），您可以轻松设置人工评估工作流。您可以使用自己的数据集并定义自定义评估指标，选择您的内部团队或\
  \ AWS 管理的团队作为评审员。这简化了建立和管理人工评估工作流的过程。\n\n*   **提示词优化**：提示词和提示工程是特定于模型的。给不同模型相同的提示词通常会产生不同的结果。同样，提示工程技巧并非普遍适用于所有模型。在某些情况下，许多为特定\
  \ NLP 任务微调的大型语言模型可能不需要提示词。相反，非常通用的大型语言模型则能从精心设计的提示词中显著受益。跟踪查询和响应，以便进行比较和迭代以改进提示词。考虑开发提示词模板，特别是对于复杂的提示词。如果您的提示词包含用户输入，请采用技术来防止提示词注入，方法是清晰地区分您的指令和用户输入。\n\
  \n#### 管理成本与性能的权衡\n\n大型语言模型的一个主要运营问题是平衡成本和性能，尤其是在推理和服务期间。拥有数亿参数的“小型”大型语言模型和达到数千亿参数的大型模型，其计算成本可能会变得非常高昂。幸运的是，在部署和服务大型语言模型时，有多种方法可以管理和降低这些成本。\n\
  \n*   **从简开始，逐步扩展**：在创建新的基于大型语言模型的应用程序时，快速开发至关重要，因此使用成本较高的选项（如现有模型的付费 API）是可以接受的。随着进展，收集数据，例如查询和响应。这些数据可用于微调一个更小、更具成本效益且您可以拥有的模型。\n\
  \n*   **评估您的成本**：预估您期望的每秒查询次数、请求是否会突发以及每次查询的成本。这些计算将有助于确定项目的可行性，并指导您何时考虑使用内部开源模型进行微调。\n\
  \n*   **通过调整大型语言模型和查询来降低成本**：利用特定于大型语言模型的各种技术来减少计算量和开支。这包括缩短查询、修改推理设置以及使用更小的模型版本。\n\
  \n*   **人工反馈至关重要**：降低成本很简单，但如果没有最终用户的反馈，就很难理解这些变化如何影响结果。\n\n#### AWS Bedrock 上 LLMOps\
  \ 的最佳实践\n\n为了优化您在 AWS Bedrock 上使用 LLMOps 的效果，请遵循以下最佳实践：\n\n1.  **从单一用例开始**：从一个特定的应用程序开始，然后逐步扩展。这种方法有助于您的团队掌握\
  \ Bedrock 的复杂性，而不会感到不知所措。\n\n2.  **利用版本控制**：维护模型版本、提示词和微调数据集的记录。这对于可重复性、审计和确保合规性至关重要。\n\
  \n3.  **自动化常规任务**：使用 AWS Step Functions 或 Lambda 来自动化重复性任务，最大限度地减少人为错误并提高效率。\n\n\
  4.  **为可扩展性做好准备**：随着您的 LLM 应用程序的扩展，设计您的系统以适应增长。这有助于避免未来出现性能瓶颈和重大的架构变更。\n\n5.  **建立全面的监控**：实施全面的监控和警报系统，以便在问题影响用户之前发现并解决它们。\n\
  \n6.  **强调安全与合规**：从一开始就纳入强有力的安全措施，以保护您的组织免受数据泄露并确保符合法规要求。\n\n### 结论\n\n在一个以数据驱动决策和智能自动化为特征的时代，MLOps\
  \ 的重要性毋庸置疑。MLOps 为大规模开发、部署和维护 AI 模型提供了关键框架，确保它们保持准确性并持续提供商业价值。LLMOps 的兴起凸显了生成式 AI\
  \ 的快速进步和专业化需求。然而，从根本上说，LLMOps 是建立在 MLOps 的核心原则之上的。\n\n无论您是在实施传统的机器学习解决方案还是由 LLM\
  \ 驱动的应用程序，四个核心原则始终不变：\n\n1.  **业务目标**：始终与您的业务目标保持一致。\n2.  **以数据为中心**：优先考虑以数据为中心的方法。\n\
  3.  **模块化**：以模块化的方式实施解决方案。\n4.  **自动化**：尽可能努力实现流程自动化。\n\n通过采用全面的 LLMOps 生命周期，组织可以负责任且高效地利用\
  \ AI。这种方法可以建立与用户和利益相关者的信任，确保符合不断变化的法规，并使组织能够将 AI 作为战略资产加以利用，同时管理相关风险。\n\n\n\n"
- "# 10. MLOps 的未来趋势\n\n人工智能时代不仅正在来临，它已经到来，以前所未有的速度重塑着各行各业与社会。随着人工智能的持续演进，其对业务运营、数据管理以及技术基础设施的影响将深远而广泛。在众多变革性技术中，生成式人工智能脱颖而出，成为下一波数据驱动创新的催化剂。它将重新定义企业管理、分析和利用数据的方式，从而推动对先进机器学习运维（MLOps）实践的需求，以跟上这些变化的步伐。见图\
  \ 10-1。\n\n![](img/609560_1_En_10_Fig1_HTML.jpg)\n\n图 10-1\n\nMLOps 流水线\n\n生成式人工智能将彻底改变未来领先企业的数据战略。通过将数据集中在托管服务平台，企业能够获得有效训练和部署大型语言模型（LLM）及其他人工智能系统所需的安全性、治理能力和统一的数据存储库。这种集中化创建了单一事实来源，简化了运营流程并增强了决策能力。\n\
  \n然而，生成式人工智能的兴起也标志着本地数据存储时代的终结。人工智能工作负载的巨大规模和复杂性正推动企业转向基于云的解决方案，后者提供了本地系统无法比拟的可扩展性和灵活性。然而，向云端的迁移也带来了新的挑战，尤其是在安全性和合规性方面。随着组织采用多云策略，他们常常发现自己需要在不同平台上管理分散的数据和模型，而每个平台的安全和治理能力各不相同。这种碎片化使得维持统一的安全态势和满足合规要求变得越来越困难。\n\
  \n在本章中，我们将探讨进入 2025 年及以后 MLOps 的未来趋势。我们将审视企业如何驾驭不断演变的人工智能格局，生成式人工智能带来的挑战与机遇，以及在一个日益复杂的数字世界中维持性能、安全性和合规性所需的策略。本章将深入探讨\
  \ MLOps 在确保组织能够充分利用人工智能潜力，同时降低与这项强大技术相关的风险方面所扮演的关键角色。\n\n## 驾驭生成式人工智能演进的下一波浪潮\n\n\
  随着我们进入生成式人工智能时代，机器学习运维的格局即将迎来变革性的变化。大型语言模型、生成式人工智能和云计算等先进技术的融合，正在重塑组织在生产环境中管理和部署人工智能模型的方式。这种转变不仅需要对生成式人工智能技术有深刻的理解，还需要采用创新的工具和实践来应对现代数据生态系统的复杂性。\n\
  \nMLOps 已从一项小众实践发展成为企业人工智能部署中的关键组成部分。MLOps 与 LLMOps 和 GenAIOps 的融合给现有的 MLOps 范式带来了重大挑战。随着组织越来越多地部署大型语言模型和生成式人工智能模型，在整个生命周期中管理这些模型的复杂性也随之增加。\n\
  \nMLOps 正在开辟自己的道路，以实现大规模人工智能模型管理的自动化和优化。此外，对实时可观测性、健壮数据管道和伦理考量的需求日益增强，这突破了传统 MLOps\
  \ 框架的边界。这种融合需要新的工具和实践，以适应 LLMOps 和 GenOps 的独特需求，同时确保在不同环境中的可扩展性、可靠性和合规性。\n\n这种融合还使组织能够高效地处理分布式异构基础设施的网络需求和硬件配置。随着人工智能在从太空探索到汽车制造等各个行业的应用加速，管理这些复杂性的能力正变得越来越重要。见图\
  \ 10-2。\n\n![](img/609560_1_En_10_Fig2_HTML.jpg)\n\n图 10-2\n\nMLOps 与 LLMOps 和 GenAIOps\
  \ 的融合\n\n### MLOps 与生成式人工智能的融合\n\n生成式人工智能与 MLOps 的融合代表了人工智能模型开发、部署和维护方式的变革性转变。这种融合使得复杂流程的自动化成为可能，从而以前所未有的速度创建和扩展生成式模型。通过整合\
  \ MLOps 实践，组织可以处理训练生成式人工智能模型所需的海量数据集，确保在分布式系统中进行高效管理和部署。这种集成不仅加速了人工智能开发生命周期，还增强了人工智能应用的可靠性和可扩展性。\n\
  \n此外，这种融合通过在 MLOps 框架内嵌入严格的可靠性检查和伦理指南，解决了与生成式人工智能相关的伦理挑战。这确保了人工智能系统不仅有效，而且符合伦理标准，降低了生成有偏见或误导性内容的风险。因此，组织可以更有信心地构建和部署生成式人工智能模型，因为他们知道自己在维护伦理诚信并培养公众信任。生成式人工智能与\
  \ MLOps 之间的这种协同作用，为下一代既强大又负责任的人工智能技术奠定了基础，在推动创新的同时防范潜在风险。\n\nMLOps 与生成式人工智能的这种融合对于高效管理人工智能工作负载至关重要，尤其是在那些快速采用基于人工智能解决方案的行业，例如太空探索、电力与能源、媒体与娱乐以及医疗健康与生命科学。随着人工智能继续渗透到这些行业，对更复杂编排框架的需求正在增长。这些框架专门设计用于处理机器学习生命周期的各个阶段，包括重新训练、重新部署、监控和版本控制。\n\
  \n### 新兴技术在 MLOps 中的作用\n\n随着技术的发展，新兴技术将重新定义 MLOps，推动人工智能运营中的创新、可扩展性和效率。那些战略性地将这些进步整合到其\
  \ MLOps 实践中的组织，将引领下一阶段人工智能驱动的转型，在性能和能力方面树立新的标准。\n\n#### 高性能计算（HPC）的进步\n\n随着人工智能模型变得越来越复杂，对支持大规模机器学习运营的高性能计算的需求比以往任何时候都更加关键。配备先进\
  \ GPU、TPU 和人工智能加速器的高性能计算系统，提供了高效训练和优化海量模型所需的计算能力。高性能计算的这种演进正在推动 MLOps 进入一个新时代，实现更快的模型开发、更准确的预测，以及以前所未有的速度和精度处理不断增长的数据集的能力。\n\
  \n#### 用高速网络革新 MLOps\n\n5G 的出现和 6G 网络的发展将通过提供实时人工智能处理所需的高带宽和低延迟来改变 MLOps。这些下一代网络使得能够无缝访问部署在分布式环境（包括云、边缘和本地系统）中的人工智能模型。这些网络更高的速度和可靠性对于需要即时决策的应用（如自动驾驶汽车、智慧城市和物联网）至关重要。MLOps\
  \ 框架必须不断发展以充分利用这些能力，确保模型能够在边缘和云端有效运行。\n\n\n\n#### 在 MLOps 中驾驭 LLM 与大数据的威力\n\n大型语言模型正在彻底改变我们处理和分析非结构化数据的方式。LLM\
  \ 的兴起需要强大的 MLOps 框架，这些框架能够管理大规模训练、部署和维护这些模型的复杂性。高效且有效地处理海量数据是最大化 LLM 潜力的关键，这催生了\
  \ MLOps 领域内的新工具和方法论。能够将 LLM 无缝集成到其运营中的组织，将在处理大数据并从中获取洞察方面获得竞争优势。\n\n#### 边缘计算：MLOps\
  \ 创新的前沿\n\n边缘计算正迅速成为 MLOps 的基石，它使得 AI 模型能够部署在更靠近数据源的位置，从而减少延迟并提高效率。随着生成海量数据的物联网设备和传感器的激增，在边缘处理信息的能力变得至关重要。MLOps\
  \ 框架正在不断发展，以支持在去中心化环境中部署和管理模型，确保即使在资源受限的环境中也能保持稳健的性能。边缘计算与 MLOps 的集成正在为联邦学习和分布式\
  \ AI 的进步铺平道路。\n\n#### 云服务演进及其对 MLOps 的影响\n\n云技术的持续演进在 MLOps 的发展中扮演着关键角色。诸如无服务器计算之类的创新简化了基础设施管理，使开发人员能够专注于部署和优化\
  \ AI 模型，而无需承担管理硬件的负担。云提供商正在提供越来越多的专业化 AI 服务，从托管模型托管到自动调优，这些服务简化了 MLOps 流程。随着云服务的不断发展，它们将在跨行业高效且有效地扩展\
  \ AI 计划方面变得越来越不可或缺。\n\n### 数据管理中的挑战与机遇\n\n数据管理是任何成功 AI 项目的支柱，随着数据量和复杂性的不断增长，与管理这些数据相关的挑战也变得更加突出。当组织集成大数据生态系统、管理非结构化数据并适应新兴技术时，他们必须应对几个关键挑战。以下是\
  \ MLOps 框架内数据管理方面最关键的挑战：\n\n*   **处理大数据生态系统：** 大数据生态系统的特点是其体量、速度和多样性。管理如此海量的数据需要强大的基础设施和复杂的数据管理策略。挑战在于高效地收集、处理和存储这些数据，以便它们能够有效地用于\
  \ AI 模型。组织需要实施可扩展的数据管道，以处理来自各种来源的数据流入，同时确保数据的完整性和可访问性。\n\n*   **使用 LLM 和生成式 AI 管理非结构化数据：**\
  \ 转向使用大型语言模型和生成式 AI 给数据管理带来了新的复杂性。与结构化数据不同，文本、图像和音频等非结构化数据需要不同的处理技术才能为 AI 模型做好准备。预处理这些数据以提取有意义的特征并确保与\
  \ LLM 的兼容性是一个重大挑战。此外，非结构化数据的异质性增加了另一层复杂性，需要创新的数据集成和标准化解决方案。\n\n*   **数据质量与完整性：**\
  \ 确保数据的质量和完整性对于训练准确可靠的 AI 模型至关重要。低质量的数据可能导致有偏见或不准确的模型，这可能会在现实世界的应用中产生严重后果。数据管理策略必须包括严格的数据验证、清理和规范化流程，以确保用于训练和推理的数据具有最高质量。此外，在分布式系统和数据传输过程中维护数据完整性对于防止数据损坏和确保一致性至关重要。\n\
  \n*   **数据管道的可扩展性：** 随着 AI 模型在复杂性和规模上的增长，为其提供数据的数据管道也必须随之增长。需要可扩展的数据管理解决方案来处理更大数据集和更复杂模型日益增长的需求。这包括优化数据存储、检索和处理技术，以确保数据管道能够适应增长而不会成为瓶颈。组织还必须考虑其基础设施的可扩展性，确保其能够支持\
  \ AI 工作负载日益增长的计算需求。\n\n*   **数据安全与合规性：** 随着数据隐私法规的兴起和数据安全重要性的日益增加，管理敏感数据已成为 MLOps\
  \ 中的一个关键挑战。组织必须实施强大的安全措施来保护数据免受未经授权的访问，并确保符合监管标准。这包括加密静态和传输中的数据、实施访问控制以及进行定期安全审计。此外，组织必须应对数据治理的复杂性，确保数据的使用符合道德和法律要求。\n\
  \n*   **实时数据处理：** 对实时数据处理的需求在 AI 应用中变得越来越重要，尤其是在自动驾驶系统和预测分析等用例中。管理实时数据流需要能够处理高吞吐量、低延迟数据处理的高级数据管理技术。这包括实施分布式处理框架、优化数据摄取管道，以及确保数据被实时处理并可供\
  \ AI 模型使用。\n\n总之，有效的数据管理是成功实施 MLOps 的关键组成部分。随着组织继续拥抱大数据、非结构化数据和新兴技术，他们必须克服数据处理、处理和安全方面的重大挑战。通过应对这些挑战，组织可以确保其\
  \ AI 模型在高质量数据上进行训练，并能够提供准确、可靠且可扩展的解决方案。\n\n\n\n### MLOps 的未来发展方向\n\n展望未来，MLOps 的未来将由人工智能技术的持续演进所塑造，尤其是在大型语言模型、AIOps\
  \ 和下一代网络领域。随着这些技术不断成熟，它们将在人工智能工作负载的管理中实现更高水平的自动化、可扩展性和效率。然而，这也要求组织采用更先进的数据管理、模型版本控制和监控方法，以确保其人工智能系统在日益复杂的环境中保持高性能和可靠性。\n\
  \n*   **增强的模型生命周期管理：** 生成式人工智能模型，特别是大型语言模型和生成对抗网络，远比传统机器学习模型复杂。管理其生命周期——涵盖训练、部署、监控和重新训练等阶段——需要更复杂的工具和流程。MLOps\
  \ 的未来将见证先进框架的发展，这些框架旨在处理生成式人工智能的复杂性，例如持续模型更新、实时推理以及由性能指标或数据漂移触发的自动重新训练。\n\n*   **可扩展性与资源优化：**\
  \ 生成式人工智能模型在训练和推理过程中都需要大量的计算资源。随着这些模型变得更加普遍，MLOps 实践必须适应以优化资源分配并确保可扩展性。这包括实施高性能计算环境、分布式训练框架以及能够处理生成模型所需海量数据的高效数据管理策略。此外，云和边缘计算将在提供必要基础设施以支持大规模部署生成式人工智能方面发挥关键作用。\n\
  \n*   **与自动化机器学习（AutoML）的集成：** 生成式人工智能模型的复杂性需要使用自动化工具来简化开发过程。AutoML 可以自动化模型选择、超参数调优和特征工程等任务，它将日益与\
  \ MLOps 实践相集成。这种集成将使组织能够快速迭代生成模型，减少将新的人工智能解决方案推向市场所需的时间和专业知识。此外，AutoML 可以通过自动化生命周期中的部分环节（从数据预处理到部署）来帮助管理生成模型日益增长的复杂性。\n\
  \n*   **伦理人工智能与治理：** 随着生成式人工智能得到更广泛的应用，围绕伦理、公平性和透明度的担忧将会加剧。MLOps 需要纳入强大的治理框架，以确保生成模型的开发和部署方式符合伦理标准。这包括在\
  \ MLOps 管道中实施用于偏差检测、可解释性和问责制的工具。此外，法规遵从性将成为一个关键考量因素，尤其是在政府和行业机构为人工智能的伦理使用引入新标准的情况下。\n\
  \n*   **高级监控与可观测性：** 生成式人工智能模型的动态特性需要持续的监控和可观测性，以确保它们在生产环境中按预期运行。未来的 MLOps 平台需要提供高级功能，用于实时跟踪模型性能、识别异常和诊断问题。这包括监控数据漂移、模型漂移以及生成输出对下游应用的影响。增强的可观测性工具将提供可操作的见解，从而能够快速响应潜在问题，确保生成式人工智能部署的可靠性和稳健性。\n\
  \n*   **协作与跨学科整合：** 生成式人工智能模型的开发和部署通常需要数据科学家、工程师、领域专家和业务利益相关者之间的协作。MLOps 将越来越侧重于通过提供促进沟通、知识共享和目标对齐的平台和工具，来促进这些学科之间的协作。这种跨学科整合对于确保生成式人工智能模型在遵守技术和伦理标准的同时实现业务目标至关重要。\n\
  \n*   **人工智能模型的个性化与定制：** 生成式人工智能最有前景的应用之一是为用户创造个性化体验。随着生成模型变得越来越复杂，MLOps 将在实现这些模型的定制化以满足特定用户需求方面发挥关键作用。这包括开发能够基于用户数据、偏好和交互来处理模型个性化的管道。此外，MLOps\
  \ 需要确保个性化模型在维护用户隐私和数据安全的同时，保持高性能和准确性。\n\n*   **针对生成式人工智能的专业化 MLOps 工具的出现：** 随着生成式人工智能的持续发展，对针对这些模型独特需求量身定制的专业化\
  \ MLOps 工具的需求将日益增长。这些工具将侧重于模型可解释性、交互式调试以及复杂生成工作流的编排等方面。MLOps 的未来很可能会出现专门为解决生成式人工智能带来的挑战而设计的新平台和解决方案，使组织能够充分利用其潜力。\n\
  \n总之，生成式人工智能的兴起必将深刻影响 MLOps 的未来。通过适应这些先进模型的特定需求，MLOps 实践将不断发展，以确保生成式人工智能在广泛的应用中实现高效、可扩展且合乎伦理的部署。随着我们向前迈进，生成式人工智能与\
  \ MLOps 的融合将为创新开辟新的途径，推动开发能够改变行业并改善我们与技术互动方式的尖端人工智能解决方案。\n\n## MLOps 中的开放问题与挑战\n\
  \n在机器学习和人工智能领域，MLOps 已成为一门关键学科，它将机器学习与传统的软件开发和运维实践相结合，以简化机器学习模型的部署、监控和治理。然而，尽管其重要性日益增长，MLOps\
  \ 仍然是一个相对年轻的领域，这种年轻化伴随着一系列开放问题和挑战，组织必须应对这些挑战，才能成功地将他们的人工智能驱动计划投入运营。\n\n\n\n### 跨学科挑战\n\
  \nMLOps 的主要挑战之一源于在生产环境中成功部署和管理机器学习模型所需工作的跨学科性质。MLOps 项目需要结合数据科学、软件工程和运维领域的技能——这种组合在大多数组织中并不常见。数据科学家通常缺乏软件工程实践的必要知识，例如版本控制、模块化和可扩展性，而这些对于维护和发展\
  \ AI 解决方案至关重要。另一方面，软件工程师可能难以应对机器学习的复杂性，包括特征工程、参数调优和模型选择。同时，运维工程师必须管理支持这些模型所需的复杂基础设施，这项任务要求对应用程序及其运行平台都有深刻理解。\n\
  \n这种专业知识的分散常常导致组织内部形成孤岛，数据科学家、软件工程师和运维团队各自为政，导致目标和优先级不一致。因此，MLOps 项目的成功取决于培养一种协作文化，鼓励跨职能团队共同努力，利用彼此的优势来克服在生产环境中部署机器学习模型所带来的挑战。\n\
  \n### ML/AI 工程中的挑战\n\n新兴技术与 MLOps 的融合带来了重大挑战，需要重新思考传统的 ML 工程方法。为了驾驭这一不断演变的格局，MLOps\
  \ 必须采用更系统化、模块化和可扩展的策略，以适应 AI 应用日益增长的复杂性和需求。\n\n*   **系统化生命周期管理**：AI 应用，尤其是那些利用先进技术的应用，需要更结构化、更高效的生命周期管理方法。传统的软件开发实践往往无法满足\
  \ AI 模型开发、部署和监控的动态和迭代特性。MLOps 必须适应并支持能够处理模型频繁更新、管理版本控制并确保实时稳健监控模型性能的持续集成和持续部署（CI/CD）管道。复杂\
  \ AI 模型（尤其是大语言模型）的出现进一步复杂化了这一过程，因为这些模型在其整个生命周期中都需要大量的计算资源和数据管理策略。\n\n*   **AI 设计的复杂性**：AI\
  \ 系统的设计已变得日益复杂，尤其是随着多模态模型、深度学习架构和分布式系统的兴起。这些设计本质上更难以模块化和维护，这使得 AI 生命周期的开发和运维阶段都变得更加复杂。例如，将多个各自专精于不同任务（如文本处理、图像识别）的\
  \ AI 模型集成到一个统一的系统中，需要组件之间进行精心编排和无缝通信。MLOps 必须提供支持 AI 系统模块化的框架和工具，从而实现更轻松的维护、更新和扩展。\n\
  \n*   **处理新兴技术**：随着高性能计算、边缘计算和高速网络的兴起，MLOps 还必须应对在多样化和分布式环境中部署和管理 AI 模型的挑战。高性能计算能够训练大型模型，但也要求可扩展且高效的资源管理。同样，在边缘设备上部署\
  \ AI 模型会引入限制，例如有限的计算能力和对低延迟处理的需求。MLOps 框架必须能够通过提供高效资源分配、模型优化以及跨云、边缘和本地系统无缝集成的解决方案来应对这些挑战。\n\
  \n*   **保持一致性和可靠性**：AI 创新的快速步伐，加上 AI 设计日益复杂，使得 MLOps 必须保持模型性能的一致性和可靠性。这包括确保模型在更新、扩展和部署到不同环境时仍能准确运行。MLOps\
  \ 必须实施稳健的监控和反馈机制，以检测并解决数据漂移、模型退化及性能瓶颈等问题。此外，随着 AI 系统在关键业务运营中变得愈发不可或缺，MLOps 必须确保模型遵守道德准则和监管要求，这为原本已十分复杂的\
  \ AI 生命周期管理任务又增加了一层责任。\n\n\n\n### 数据管理挑战\n\n数据管理是 MLOps 和 LLMOps 的基石，其重要性怎么强调都不为过。有效的数据管理涵盖多个方面，包括数据质量、访问、准备、标注、验证和集成。这些活动常常被忽视，但却可能消耗项目大量的时间和预算。此外，机器学习模型与其相关数据之间的紧密依赖关系，为基于机器学习的场景中的数据管理增加了另一层复杂性。\n\
  \n大数据时代的到来进一步加剧了 MLOps 中的数据管理难题。在大数据环境中，任务分发、数据移动和批处理等问题变得尤为突出，需要工业界和学术界共同努力来开发解决方案。管理海量数据的复杂性，加上对准确高效处理的需求，使得数据管理成为\
  \ MLOps 中最重大的挑战之一。\n\n*   **处理海量、多样、高速数据的复杂性：** 将大数据集成到 MLOps 框架中，由于数据的海量、多样和高速特性，带来了巨大挑战。管理大型数据集，尤其是那些包含多种数据类型和格式的数据集，需要能够处理高吞吐量并确保数据完整性的健壮架构。此外，数据的快速涌入要求具备实时处理能力，因此实施可扩展的解决方案至关重要，这些方案能够在不影响性能的情况下高效处理和分析数据。\n\
  \n为了应对这些挑战，一个有效的策略是将大数据工作负载分解成更小、更易于管理的子集。通过对数据集进行特征化和分段，组织可以独立地在这些子集上训练模型，从而简化大数据工作负载的复杂性。这种方法不仅使训练过程更高效，还允许并行处理，从而加速整个机器学习流水线。\n\
  \n*   **管理数据集和模型版本的策略：** 在 MLOps 中管理大数据的另一个关键方面是有效处理数据集和模型版本。专门的工具和架构对于跟踪和管理不同版本的数据集和模型至关重要，以确保机器学习生命周期中的一致性和可重复性。专为机器学习设计的版本控制系统，例如\
  \ DVC（数据版本控制），帮助团队保持结构化的数据集管理方法，使他们能够在需要时回退到以前的版本，并确保模型在正确的数据上进行训练。\n\n*   **大数据环境中\
  \ ML 解决方案的编排：** 将大数据与机器学习和 AI 解决方案集成的复杂性，提高了对高级编排工具的需求。这些工具有助于管理训练和推理过程，确保模型在生产环境中高效部署。像\
  \ Kubernetes 和 Apache Airflow 这样的编排框架正被越来越多地采用，以简化这些操作，使开发人员能够专注于模型开发，而基础设施则处理扩展和部署的复杂性。\n\
  \n*   **自动化数据标注与处理已标注数据集：** 除了管理大数据，MLOps 还必须应对已标注数据集的挑战，这对于监督学习模型至关重要。标注数据的稀缺常常阻碍训练过程，导致模型性能欠佳。为了缓解这一问题，正在开发自动化数据标注的新方法，以减少对人工和专家干预的依赖。例如，自动化日志消息的标注可以显著加快已标注数据集的创建，从而实现更快的迭代和模型准确性的提升。\n\
  \n总而言之，在 MLOps 框架内管理大数据是一项复杂但至关重要的任务，需要专门的策略和工具。通过分解工作负载、实施健壮的版本控制以及利用先进的编排框架，组织可以克服与大数据相关的挑战，并确保机器学习模型在生产环境中成功部署。随着\
  \ MLOps 领域的不断发展，这些策略在利用大数据潜力驱动 AI 解决方案方面将变得越来越重要。\n\n### 编排机器学习生命周期\n\n随着生成式 AI、边缘计算以及云计算进步等新兴技术的融合，机器学习生命周期的编排变得充满挑战。当组织努力在分布式环境中高效管理数据和计算资源时，他们面临着一系列需要创新解决方案的新挑战。本节探讨了编排机器学习生命周期的主要挑战以及应对这些挑战所需的策略。\n\
  \n#### 分布式与并行化工作流\n\n随着云和边缘计算的出现，机器学习工作流不再局限于集中式数据中心。相反，它们分布在多个环境中，每个环境都有其独特的计算资源、存储能力和延迟限制。挑战在于如何在这些环境中高效地分发和并行化任务，同时最大限度地减少流量开销、带宽限制和延迟。确保数据在云和边缘设备之间一致且安全地传输，对于维护机器学习模型的完整性和性能至关重要。\n\
  \n#### 边缘计算中的资源约束\n\n边缘计算因其设备运行的受限环境而带来了额外的挑战。这些设备通常计算能力、存储和能源资源有限，使得有效部署和管理机器学习模型变得困难。此外，在边缘环境中保护已部署模型的知识产权和完整性是一个重大问题，因为这些模型可能容易受到篡改或窃取。确保边缘节点与资源更丰富的基础设施设备之间可靠、安全的通信，对于在这些环境中成功开展机器学习项目至关重要。\n\
  \n#### 容器化与依赖管理\n\n容器化已成为在多样化环境中交付机器学习解决方案的流行方法。然而，它也带来了与依赖和文件系统管理相关的挑战。必须仔细管理容器化环境，以确保所有依赖项都正确配置，并且文件系统针对机器学习模型的特定要求进行了优化。此外，在分布式环境中部署容器化的机器学习工作流需要强大的编排工具，这些工具能够处理管理多个容器（每个容器都有其依赖项和配置）的复杂性。\n\
  \n#### 自动化与 AutoML\n\n自动化是在生产环境中部署的机器学习模型实现成熟度和效率的关键因素。诸如 AutoML（自动化机器学习）之类的技术可以自动化机器学习过程的许多方面，包括特征工程、模型选择和超参数调优。然而，在分布式环境中自动化这些过程带来了新的挑战，例如确保为跨不同架构的部署选择性能最佳的模型。平衡高计算资源与更适度架构之间的权衡，对于\
  \ MLOps 项目的成功至关重要。\n\n\n\n#### 跨复杂环境编排 AI 工作负载\n\n在云端和边缘环境中编排 AI 工作负载，需要能够管理从数据准备到模型部署与监控的整个机器学习生命周期的复杂工具和框架。这些工具必须能够应对分布式机器学习工作流的独特挑战，例如确保数据处理的一致性、优化计算资源以及长期维持模型性能。随着\
  \ AI 应用日益复杂，对能够无缝集成现有 MLOps 实践的强大编排工具的需求只会不断增长。\n\n#### 确保安全性与合规性\n\n现代机器学习工作流的分布式特性带来了额外的安全与合规挑战。对于在云端和边缘环境部署机器学习模型的组织而言，保护敏感数据、确保模型完整性以及遵守监管要求是关键的考量因素。MLOps\
  \ 团队必须实施能够应对这些问题的安全措施，同时保持支持新兴技术所需的灵活性和可扩展性。\n\n总之，在新兴技术背景下编排机器学习生命周期面临着诸多挑战，需要创新的解决方案。随着组织持续采用云计算、边缘计算和物联网技术，他们必须投资于能够管理分布式机器学习工作流复杂性的强大编排工具和框架。通过应对这些挑战，MLOps\
  \ 团队可以确保 AI 模型在不同环境中的成功部署与管理，最终推动 AI 应用在现实世界中的进步。\n\n### 硬件与架构挑战\n\n将新兴技术整合到机器学习运维中，会带来一系列硬件与架构方面的挑战，需要创新的解决方案和审慎的考量。随着\
  \ MLOps 不断发展以适应更复杂的模型、分布式环境和多样化的用例，与硬件平台和架构设计相关的复杂性也随之增加。以下是其中一些关键的挑战与考量。\n\n####\
  \ 硬件平台的异构性\n\nMLOps 现在涉及多种多样的硬件平台，从 GPU 和 TPU 到专门的 AI 加速器和边缘设备。每个平台都有其独特的特性、能力和局限性，这使得确保机器学习生命周期不同阶段的兼容性和最佳性能变得颇具挑战。例如，深度神经网络（DNN）可能在一种硬件上表现极佳，但要在另一种硬件上高效运行则可能需要大量的优化。管理和优化跨此类异构环境的机器学习工作流，对\
  \ MLOps 从业者来说是一项重大挑战。\n\n#### 机器学习库的不兼容性\n\n机器学习库与底层硬件之间的不兼容性，进一步加剧了硬件平台的多样性问题。许多机器学习库和框架在设计时都针对特定的硬件架构，这可能导致在尝试跨不同环境部署模型时遇到困难。在涉及同时使用云端资源和边缘设备的场景中，这一挑战尤为突出，因为每种环境都需要不同的配置和优化。要确保跨这些平台的无缝集成和性能，需要对所涉及的软件和硬件都有深入的理解。\n\
  \n#### 架构设计的复杂性\n\n随着机器学习模型日益复杂，支撑它们的架构设计也变得愈发复杂。部署先进的 AI 解决方案通常涉及整合多个组件的复杂架构，例如数据管道、模型训练环境、推理引擎和监控系统。这些组件必须精心编排，以确保整个系统高效可靠地运行。然而，不同机器学习框架在架构设计上的差异又增加了一层复杂性，使得标准化流程和确保性能一致性变得困难。\n\
  \n#### 机器学习工作流中的安全性与隔离性\n\n现代机器学习工作流的分布式特性，尤其是那些跨越云端和边缘环境的工作流，带来了重大的安全挑战。确保敏感数据和知识产权的隔离与保护至关重要，尤其是在机器学习管道的不同组件分布在多个硬件平台上的环境中。这需要强大的安全措施来防止未经授权的访问和篡改，同时维护所使用数据和模型的完整性。此外，必须仔细评估机器学习管道不同组件之间的隔离程度，以防止潜在的安全漏洞并确保可靠运行。\n\
  \n#### 优化资源分配\n\n有效的资源分配对于管理现代机器学习工作流的计算需求至关重要。随着边缘计算的兴起和 AI 模型复杂性的增加，MLOps 必须适应在分布式环境中动态分配资源。这不仅涉及优化\
  \ GPU 和其他加速器的使用，还要确保存储、内存和网络带宽得到高效利用。挑战在于如何在机器学习生命周期的不同阶段（从数据摄取和预处理到模型训练和推理）之间平衡这些资源，同时不损害性能或可扩展性。\n\
  \n#### 架构设计的可扩展性与灵活性\n\n支持机器学习工作流的架构设计必须具有足够的可扩展性和灵活性，以适应 AI 应用日益增长的需求。随着模型变得更大、更复杂，基础设施必须能够扩展以处理增加的工作负载，同时保持性能和效率。这需要周密的规划，并利用容器化和无服务器计算等先进技术，确保基础设施能够适应不断变化的需求。此外，架构必须足够灵活，以支持新兴技术和框架的集成，确保机器学习工作流保持最新状态，并能利用该领域的最新进展。\n\
  \n\n\n#### 高性能计算（HPC）集成\n\n随着机器学习（ML）工作负载日益复杂，管理底层基础设施带来了巨大挑战。高性能计算（HPC）成为应对这些挑战的有力解决方案，它提供了处理大规模机器学习任务（尤其是涉及深度学习和大型语言模型（LLM）的任务）所需的计算能力。然而，利用\
  \ HPC 环境并非没有困难，特别是对于那些可能不熟悉 HPC 环境独特要求和特性的数据科学家而言，这些特性包括专门的硬件配置、并行处理技术以及跨分布式系统管理大型数据集。此外，HPC\
  \ 系统中计算资源的可扩展性必须谨慎管理，以避免瓶颈并确保资源的有效利用。参见图 10-3。\n\n![](img/609560_1_En_10_Fig3_HTML.jpg)\n\
  \n图 10-3\n\n使用 HPC 的机器学习应用示例架构 [1]\n\n以下是使用 HPC 的关键方面：\n\n*   **可扩展性与容器化：** 将 HPC\
  \ 用于机器学习工作负载的关键方面之一是计算资源的可扩展性。随着机器学习模型规模和复杂性的增长，有效扩展资源的能力变得至关重要。容器化已被证明在这方面是一种有前景的解决方案，它能够更高效地在\
  \ HPC 系统上部署 AI 模型。通过将应用程序及其依赖项封装到容器中，这种方法简化了资源扩展和基础设施管理的过程。\n\n*   **云计算与多租户隔离：**\
  \ 虽然 HPC 提供了强大的能力，但云计算提供了一种兼具可扩展性和灵活性的替代方案。云资源可用于补充 HPC 基础设施，使组织能够更动态地管理机器学习工作负载。然而，云资源的使用也带来了多租户隔离等挑战，确保不同工作负载互不干扰至关重要。应对这些挑战需要仔细考虑云架构和资源分配策略。\n\
  \n*   **HPC 与 MLOps 的交汇：** 将 HPC 与 MLOps 实践相结合是有效管理复杂机器学习工作负载的关键。MLOps 专注于机器学习模型的持续集成和部署，它受益于\
  \ HPC 提供的计算能力和可扩展性。然而，这种集成需要对机器学习工作流和 HPC 环境都有深入的理解。通过将 HPC 的优势与 MLOps 的自动化和效率相结合，组织可以构建能够处理最苛刻机器学习任务的稳健流水线。\n\
  \n#### 边缘计算与无服务器架构\n\n除了 HPC 和云计算，边缘计算对于机器学习工作负载也变得越来越重要。通过在边缘设备上部署机器学习任务，组织可以减少延迟并提高实时处理能力。这对于需要即时响应的应用（例如物联网（IoT）生态系统中的应用）尤其重要。然而，边缘设备通常资源有限，因此有必要优化模型以实现低功耗和有限内存下的运行。\n\
  \n无服务器计算在简化基础设施管理方面也发挥着重要作用。通过抽象底层硬件，无服务器架构允许开发者专注于编写代码，而无需担心扩展或资源管理问题。这种方法不仅减少了运营开销，还确保了资源的高效利用，进一步优化了机器学习工作负载的成本和性能。\n\
  \n#### 有效资源管理的框架与工具\n\n为了应对管理机器学习工作负载基础设施的复杂性，专门的框架和工具至关重要。这些解决方案有助于自动化机器学习模型的部署、扩展和监控，确保基础设施能够适应工作负载不断变化的需求。例如，TensorFlow\
  \ Lite 和 Core ML 等框架专为在移动和边缘设备上运行机器学习模型而设计，使开发者能够在资源受限的环境中利用 AI 的力量。\n\n类似地，诸如遗传算法之类的高级算法正在被探索用于优化边缘部署的模型配置。这些算法有助于在模型大小和准确性之间找到平衡，确保机器学习模型能够在低功耗设备上高效运行而不牺牲性能。\n\
  \n管理复杂机器学习工作负载的基础设施是一项多方面的挑战，需要结合 HPC、云计算、边缘计算和无服务器架构。通过利用这些技术并采用合适的框架和工具，组织可以克服扩展、资源管理和延迟方面的挑战，最终实现更高效、更有效的机器学习运维。随着\
  \ MLOps 领域的持续发展，HPC 和其他先进基础设施解决方案在推动 AI 创新和性能方面的作用将变得越来越重要。\n\n### 监控与维护\n\n持续监控对于检测机器学习模型在运行时的性能偏差至关重要。然而，训练后模型的静态特性使其在动态变化的环境中容易退化。这需要定期更新和维护，以确保模型能够对数据变化、组件磨损和偏差做出响应。\n\
  \n监控生产环境对于检测概念漂移等问题至关重要，概念漂移是指输入数据的统计属性随时间变化，导致模型性能下降。然而，为监控定义合适的性能指标是一项挑战，因为这些指标通常针对特定问题，需要仔细考虑以确保它们准确反映业务对误差的容忍度。\n\
  \n持续监控和反馈循环对于长期维持模型性能至关重要。模型一旦部署，就需要监控其性能退化、概念漂移以及其他可能影响其准确性和可靠性的问题。实施自动化监控系统并建立反馈循环，可以及时更新和重新训练模型，确保它们在条件变化时持续交付价值。\n\
  \n大型语言模型融入 AI 工作流极大地重塑了 MLOps 的格局，为模型和性能监控带来了新的机遇和挑战。随着 LLM 的复杂性和使用量不断增长，传统的监控实践必须演进，以确保这些模型保持高效、可靠，并符合道德标准。在接下来的章节中，我们将探讨在\
  \ LLM 兴起的背景下，MLOps 模型与性能监控的关键方面。\n\n#### 模型监控复杂性的增加\n\n拥有数十亿参数的 LLM 引入了远超传统机器学习模型的复杂性。监控这些模型需要能够跟踪广泛性能指标（包括准确性、延迟、吞吐量和资源利用率）的高级工具和技术。挑战在于开发能够提供实时洞察，同时管理\
  \ LLM 产生的海量数据的监控系统。未来的 MLOps 平台很可能会集成更复杂的 AI 驱动监控解决方案，这些方案能够自动检测和诊断性能问题，从而减少人工干预的需求。\n\
  \n\n\n#### 公平性、透明度与可解释性\n\n随着大语言模型成为决策过程中的核心组成部分，围绕公平性、透明度与可解释性的担忧日益凸显。MLOps 现在必须纳入相应机制，以确保这些模型不会延续偏见或产生不公平的结果。这不仅涉及监控大语言模型的输出，还需要理解其底层的决策过程。可解释人工智能（XAI）技术在此背景下至关重要，它能揭示大语言模型如何得出其结论。MLOps\
  \ 团队需要将 XAI 工具集成到工作流程中，以确保模型既透明又负责。\n\n#### 合乎道德且负责任的人工智能部署\n\n大语言模型的兴起也凸显了人工智能部署中的伦理问题，尤其是在心理健康等敏感领域。在生成式人工智能应用中使用大语言模型引发了人们对人工智能生成内容可能造成潜在危害的担忧。MLOps\
  \ 必须纳入稳健的伦理框架，以指导大语言模型的开发、部署和监控。这包括设置自动化检查以防止有害输出，确保符合伦理准则，并建立反馈循环以持续评估大语言模型对用户的影响。\n\
  \n#### 实时性能监控\n\n鉴于大语言模型的动态特性，实时性能监控对于保持模型的准确性和可靠性至关重要。当这些模型部署在生产环境中时，它们会与不断变化的数据流交互，这可能导致性能随时间推移而下降。MLOps\
  \ 平台必须提供实时监控能力，以跟踪关键性能指标（KPI）并在出现任何异常时向团队发出警报。这对于部署在需要及时响应的关键应用中的大语言模型尤为重要。\n\n\
  #### 人在回路监控\n\n虽然自动化是现代 MLOps 的一个关键方面，但大语言模型的兴起需要一种更加以人为中心的监控方法。人在回路（HITL）系统允许人类操作员持续参与监控过程，使他们能够在必要时进行干预，并确保大语言模型在可接受的伦理和性能边界内运行。这种方法在人工智能决策后果可能产生重大影响的应用中尤为重要，例如医疗保健或金融领域。\n\
  \n#### 可扩展性挑战\n\n随着大语言模型在组织内进行规模化部署，确保一致且可靠的监控变得越来越具有挑战性。MLOps 必须解决与监控系统可扩展性相关的问题，特别是在大语言模型可能部署在多个云端和边缘位置的分布式环境中。可扩展的监控解决方案必须能够聚合来自不同来源的数据，并提供模型性能的统一视图。此外，这些解决方案必须能够抵御网络故障，并能够在资源受限的环境中运行。\n\
  \n#### 主动监控与预测性分析\n\n为了提前应对潜在问题，MLOps 必须转向利用预测性分析的主动监控策略。通过分析历史性能数据，预测模型可以预测潜在的退化或故障，从而使团队能够采取预防措施。这种方法对大语言模型尤其有利，因为及早发现问题可以防止重大的下游影响。预测性分析将成为\
  \ MLOps 的基石，使组织能够在人工智能部署中保持高水平的性能和可靠性。\n\n#### 大语言模型可观测性面临的挑战\n\n在大语言模型运维（LLMOps）中，模型可观测性——即监控和理解大语言模型行为的实践——由于这些模型固有的复杂性、规模性和动态性而面临诸多挑战。以下是对这些挑战的详细阐述：\n\
  \n*   **复杂性与规模：**\n    *   **模型规模：** 拥有数十亿参数的大语言模型本身就非常复杂，这使得追踪模型或数据的变化如何影响其整体行为变得困难。这种复杂性会模糊理解并拖慢调试过程。\n\
  \n*   **数据量：** 大语言模型处理并生成海量数据。监控这些操作需要能够处理大规模数据摄取和分析的系统，这通常会在数据管理和解释方面带来重大挑战。\n\n\
  *   **可解释性：**\n    *   **黑箱特性：** 大语言模型如同“黑箱”运作，意味着其决策过程不易理解。这种不透明性使得难以追溯特定输出或行为的成因，阻碍了解释或调整模型推理过程的努力。\n\
  \n*   **归因：** 在模型输出中识别问题或行为的确切来源具有挑战性。这会使模型优化过程复杂化，因为很难确定是模型的哪个部分或哪部分数据导致了次优结果。\n\
  \n*   **动态环境：**\n    *   **数据漂移：** 随着时间的推移，模型遇到的数据可能会发生变化，如果模型不随之更新，就会导致性能下降。这种现象称为数据漂移，需要对模型进行持续监控并可能重新训练。\n\
  \n*   **模型漂移：** 与数据漂移类似，模型漂移是指由于输入模式演变而导致模型性能发生变化。当模型遇到初始训练时不存在的新数据类型时，就可能发生这种情况，需要持续进行调整。\n\
  \n*   **监控粒度：**\n    *   **细粒度监控：** 确定合适的监控粒度具有挑战性。粒度过粗，可能会遗漏关键问题；粒度过细，则可能用过多数据淹没操作员，使其难以提取可操作的见解。\n\
  \n*   **性能指标：**\n    *   **选择指标：** 选择合适的监控指标并非易事。不同的应用可能优先考虑不同的方面，例如准确性、延迟或资源利用率，因此根据具体用例定制指标至关重要。\n\
  \n*   **指标解读：** 即使选择了正确的指标，在大语言模型的背景下解读它们也可能很复杂。理解这些指标如何相互作用以及它们揭示了模型性能的哪些信息，需要深厚的专业知识。\n\
  \n*   **资源约束：**\n    *   **计算资源：** 大规模监控大语言模型需要大量的计算资源，这既昂贵又在后勤上难以管理。确保监控不会成为瓶颈是一个重要问题。\n\
  \n*   **存储资源：** 存储大语言模型生成的海量数据以实现有效的可观测性可能既昂贵又复杂，特别是随着对日志和指标长期存储需求的增长。\n\n*   **实时可观测性：**\n\
  \    *   **延迟：** 由于处理大规模数据固有的延迟，实现实时可观测性颇具挑战。快速检测和响应问题至关重要，但延迟会阻碍这些努力。\n\n*   **流式数据：**\
  \ 持续监控流式数据以评估模型性能，需要能够管理持续信息流而不会出现延迟或数据丢失的稳健基础设施。\n\n\n\n*   **安全与隐私****:**\n  \
  \  *   **敏感数据：** 确保可观测性实践不会危及敏感数据至关重要。大语言模型通常处理敏感信息，可观测性工具的设计必须保护这些数据。\n\n*   **合规性：**\
  \ 在监控模型行为的同时遵守监管要求，增加了另一层复杂性，尤其是在数据安全和隐私受到严格监管的行业。\n\n*   **工具与集成****:**\n    *\
  \   **缺乏标准化：** 目前缺乏专门为 LLMOps 设计的标准化工具，这使得将可观测性集成到现有工作流程中颇具挑战。\n\n*   **集成复杂性：**\
  \ 将可观测性工具与其他系统和流程集成可能很困难，尤其是在已经使用多种工具和平台的环境中。\n\n*   **人为因素****:**\n    *   **需要专业知识：**\
  \ 理解可观测性工具的输出通常需要深厚的机器学习和领域知识，这对经验不足的团队来说可能是一个障碍。\n\n*   **认知过载：** 可观测性工具生成的海量数据和指标可能会让操作员不堪重负，难以聚焦最关键的问题。\n\
  \n应对这些挑战需要结合先进的工具、全面的方法论和深厚的专业知识。克服这些障碍，组织才能确保其大语言模型在其整个生命周期中保持可靠、透明并维持高性能。\n\n\
  ## MLOps 的蓬勃发展领域：现状与未来\n\n将机器学习运维和大语言模型集成到各行各业，正在改变企业和研究机构利用人工智能技术的方式。随着这些方法论的演进，它们不仅重塑了传统行业，还催生了新的创新形式和运营效率。本章探讨了\
  \ MLOps 和 LLMOps 正在产生重大影响的当前繁荣领域，以及这些实践预期将发展的新兴领域。\n\n### 当前繁荣领域\n\nMLOps 是一个新兴领域，已在多个领域取得了显著增长。以下是\
  \ MLOps 中的一些关键领域：\n\n*   **自动化机器学习 (AutoML)****:** AutoML 工具通过自动化特征工程、模型选择和超参数调优等任务，简化了模型开发流程。这使得数据科学家能够专注于更高级别的任务，并加速机器学习模型的部署。AutoML\
  \ 在金融、医疗和零售等行业中的应用日益广泛，在这些行业中，快速部署精确模型可以提供竞争优势。\n\n*   **模型监控与管理：** 随着越来越多的机器学习模型投入生产，对强大的监控和管理解决方案的需求也随之增加。这些工具跟踪模型性能、检测异常并管理版本，确保模型随着时间的推移保持准确和可靠。\n\
  \n在大语言模型时代，对生产环境中的大语言模型进行持续监控以确保其按预期运行至关重要。这包括跟踪性能指标、识别模型漂移，并确保模型的输出符合预期行为。先进的观测性工具正在开发中，以提供对模型行为的洞察，帮助团队随着时间的推移维护和提高模型可靠性。\n\
  \n*   **数据管道自动化：** 高效的数据管道对于成功的机器学习部署至关重要。自动化提取、转换和加载（ETL）流程的工具变得不可或缺，它们能够实现从数据源到模型训练环境的持续数据流。用于训练大语言模型的数据质量对其性能至关重要。LLMOps\
  \ 涉及复杂的数据工程实践，包括数据预处理、数据增强以及创建稳健的数据管道。管理庞大且多样化的数据集，确保其干净、相关且最新，是 LLMOps 中的一个繁荣领域。\n\
  \n*   **可扩展基础设施与云集成****:** 随着云计算的兴起，MLOps 平台正在与云服务集成，为训练和部署模型提供可扩展、灵活的基础设施。这包括使用\
  \ Kubernetes 进行容器编排，以及使用 TensorFlow Extended (TFX)等工具构建端到端的机器学习管道。\n\n在生产环境中高效地服务大语言模型是一个关键关注领域。这包括开发降低延迟、管理资源分配以及确保模型高可用性的方法。模型压缩、量化和蒸馏方面的创新正在帮助大语言模型更易于访问并适用于实时应用。\n\
  \n*   **可解释人工智能与公平性：** 对于能够解释模型决策并确保人工智能系统公平性的工具的需求日益增长。这推动了 MLOps 工具的发展，这些工具能够洞察模型如何做出决策，并帮助识别和减轻偏见。\n\
  \n*   **LLMOps：** 随着大语言模型复杂性的增加，高效训练和微调的需求变得至关重要。组织正专注于优化训练流程、降低计算成本，并确保模型能够在不同环境中进行扩展。分布式训练、混合精度训练以及使用高级优化器等技术在这一领域至关重要。\n\
  \n*   **安全与合规****:** 随着机器学习模型处理日益敏感的数据，对安全 MLOps 实践的需求变得至关重要。这包括加密、访问控制以及遵守 GDPR\
  \ 等法规。对于 LLMOps 而言，随着大语言模型越来越多地用于敏感领域，确保其安全性和符合监管标准是一个不断发展的领域。这包括保护模型免受对抗性攻击、确保数据隐私以及在决策过程中保持透明度。\n\
  \nMLOps 中这些蓬勃发展的领域突显了该学科的持续创新和扩展，因为组织正寻求高效且安全地扩展其机器学习计划。\n\n#### 行业与研究\n\nMLOps\
  \ 和人工智能已在传统行业中获得显著发展，这些行业对人工智能驱动解决方案的需求正在上升。在制造业等领域，预测性维护系统正被部署以最大限度地减少意外设备故障，从而减少停机时间和维护成本。\n\
  \n建筑和施工行业也在拥抱人工智能解决方案，尽管它们在大型项目中的应用仍然具有挑战性。在风电等创新行业中，无线传感器网络对于监控发电系统至关重要。同样，汽车行业正利用\
  \ MLOps，通过将训练任务部署到云和边缘资源上，同时满足严格的网络和隐私要求，来改进自动驾驶应用。\n\n在太空探索领域，人工智能解决方案正被用于增强监控、诊断、预测和图像分析。然而，由于计算和网络资源有限，在航天器上集成人工智能仍然是一个挑战。在医疗保健领域，移动技术的最新进展使得能够在移动设备上开发基于机器学习的患者监控系统，尽管该领域需要进一步研究以应对相关挑战。\n\
  \n物理学等学术领域越来越依赖 MLOps 来处理实验产生的大量数据。例如，引力波物理学和高能物理学正在利用机器学习技术和高性能计算来满足数据存储、传输和计算的需求。\n\
  \n\n\n#### 信息技术\n\n信息技术（IT）行业正站在利用机器学习运维（MLOps）简化 AI 模型部署、管理和监控的最前沿。MLOps 实践已成为\
  \ IT 开发周期中不可或缺的一部分，使得 AI 模型能够无缝集成到现有软件和系统中。这些实践确保了机器学习（ML）模型在生产环境中的可扩展性、可靠性和可维护性，鉴于\
  \ IT 基础设施复杂且动态的特性，这一点至关重要。\n\n生成式 AI 正在迅速改变 IT 行业的各个方面。从自动化代码生成和软件测试，到创建新的数字内容和个性化用户体验，生成式\
  \ AI 正在帮助 IT 专业人员提高生产力和创造力。通过利用生成式 AI，组织可以减少软件开发、测试和内容创建所需的时间和资源，从而带来更高效、更具创新性的\
  \ IT 解决方案。\n\n在软件开发中，MLOps 和生成式 AI 正被用于自动化和优化开发生命周期的各个阶段。例如，MLOps 框架有助于管理软件应用中 AI\
  \ 驱动功能的部署和持续集成/持续部署（CI/CD）。同时，生成式 AI 可以根据高级规范自动生成代码片段、用户界面，甚至整个应用程序，从而加快开发过程并减少人为错误。\n\
  \n### 未来蓬勃发展的领域\n\n随着 MLOps 的持续演进，一些新兴领域和趋势预计将塑造机器学习运维的未来。以下是未来展望的概览：\n\n*   **联邦学习与边缘\
  \ AI：** 随着对数据隐私需求的增长以及物联网设备的普及，联邦学习和边缘 AI 将成为 MLOps 的核心。联邦学习允许模型在不共享数据的情况下跨去中心化设备进行训练，在确保隐私的同时实现边缘端的实时处理。这将需要强大的\
  \ MLOps 框架来管理和监控跨异构环境的去中心化模型训练与部署。\n\n*   **混合云与多云环境下的 MLOps：** 随着组织采用多云和混合云策略，MLOps\
  \ 解决方案需要演进，以管理跨不同云环境的模型部署、监控和扩展。能够提供不同云提供商之间无缝集成和互操作性的工具将变得至关重要，使组织能够优化其 ML 工作负载的成本、性能和合规性。\n\
  \n*   **AI 治理与伦理：** MLOps 的未来将高度关注治理和伦理 AI。随着机器学习模型变得越来越普遍，对确保透明度、公平性和问责制的框架的需求将会增长。MLOps\
  \ 平台需要整合用于偏差检测、可解释性以及遵守 GDPR 和 CCPA 等法规的工具，帮助组织构建和维护值得信赖的 AI 系统。\n\n*   **自动化 MLOps\
  \ 流水线：** MLOps 流水线的自动化将持续进步，实现从开发到生产更快速、更高效的模型部署。这包括自动化特征工程、超参数调优以及针对 ML 模型的持续集成/持续部署（CI/CD）。这些进步将减少所需的手动工作，并加快\
  \ AI 解决方案的上市时间。\n\n*   **AI 赋能 MLOps（AIOps）：** 将 AI 集成到 MLOps 流程中，即 AIOps，将变得更加普遍。AIOps\
  \ 将利用机器学习来优化 ML 流水线的运维，包括自动化异常检测、基础设施预测性维护和智能资源分配。这将带来更具弹性和自愈能力的 MLOps 环境，减少停机时间和运营成本。\n\
  \n*   **量子机器学习（QML）：** 随着量子计算的成熟，其与 MLOps 的整合预计将成为一个新的前沿领域。量子机器学习（QML）有潜力解决当前经典计算机难以处理的复杂问题。MLOps\
  \ 框架需要适应管理量子算法、混合量子-经典模型以及量子计算独特的底层基础设施需求。\n\n*   **实时与自适应 MLOps：** 对实时分析和决策的需求将推动自适应\
  \ MLOps 框架的发展。这些系统将能够基于流式数据动态调整模型，实现实时预测和自动化响应。这在金融、医疗保健和自动驾驶系统等行业尤为重要，因为在这些领域，及时准确的决策至关重要。\n\
  \n*   **MLOps 的可持续性：** 随着环境问题日益突出，可持续性将在 MLOps 的未来中扮演重要角色。组织将专注于优化其 ML 工作负载的能耗，采用模型压缩、高效数据处理和绿色计算实践等技术。MLOps\
  \ 平台将整合工具来监控和减少 AI 运营的碳足迹。\n\n*   **协作与开源 MLOps：** MLOps 的未来将见证组织与开源社区之间更多的合作。开源\
  \ MLOps 工具和框架将继续受到欢迎，为组织提供经济高效且可定制的解决方案。这一趋势还将鼓励最佳实践和创新的分享，加速 MLOps 的整体进步。\n\n*\
  \   **大语言模型（LLM）的可观测性：** 在 LLM 时代，对生产环境中的模型进行持续监控至关重要。先进的观测工具正在开发中，用于跟踪性能指标、识别模型漂移，并确保输出符合预期行为。LLM\
  \ 可观测性在客户服务、内容生成和教育等领域尤为关键，因为这些领域的模型输出直接与最终用户交互。\n\n*   **人在回路（HITL）MLOps：** 尽管自动化取得了进步，但人工监督在\
  \ MLOps 流程中仍然至关重要。人在回路（HITL）MLOps 将专注于将人类专业知识整合到 ML 流水线的关键阶段，例如数据标注、模型验证和伦理决策。这种方法将确保\
  \ AI 系统与人类的价值观和期望保持一致。\n\n这些未来的领域和趋势凸显了 MLOps 的动态特性及其在成功实现 ML 流水线运营化中的关键作用。随着该领域的持续发展，对于希望充分利用\
  \ ML 和 AI 潜力的组织而言，紧跟这些趋势至关重要。以下是一些对 MLOps 和 AI 未来前景广阔的行业。\n\n#### AI 在太空探索中的扩展\n\
  \nAI 在太空探索中的未来前景广阔，预计机载 AI 能力将取得进步。随着计算和网络资源变得更加强大，AI 将在自主太空任务、实时数据分析以及为深空探测开发智能系统方面发挥关键作用。\n\
  \n#### AI 在医疗保健领域的增长\n\n医疗保健行业在 AI 应用方面有望实现显著增长，尤其是在患者监护、诊断和个性化医疗领域。基于 ML 的系统在移动设备上的部署将变得更加普遍，提供实时健康监测并改善患者预后。将大型语言模型集成到医疗数据管理工作流程中，将进一步提高医疗记录和患者护理的效率和准确性。\n\
  \n\n\n#### 创意产业中的生成式人工智能\n\n生成式人工智能正开始对艺术、音乐和设计等创意领域产生深远影响。MLOps 实践对于管理大规模训练和部署生成模型所涉及的复杂工作流程至关重要。生成式人工智能的兴起可能会催生专门针对创意产业独特需求的\
  \ MLOps 框架。\n\n#### 人工智能驱动的自主系统\n\nMLOps 在开发和维护人工智能驱动的自主系统（如自动驾驶汽车和无人机）中正变得越来越重要。这些系统需要实时数据处理和决策能力，这离不开强大的\
  \ MLOps 流水线。随着自主系统日益普及，对能够处理实时、边缘端人工智能复杂性的 MLOps 解决方案的需求也将不断增长。\n\n#### 与边缘计算的集成\n\
  \nMLOps 与边缘计算的集成是另一个新兴趋势。边缘计算允许将人工智能模型部署在更靠近数据源的位置，从而减少延迟并改善实时决策。制造业、物流和智慧城市等行业将越来越依赖支持边缘部署的\
  \ MLOps 框架，以实现更快、更高效的人工智能驱动流程。\n\n## MLOps 的机遇与未来趋势\n\n将机器学习运维整合到现代数据科学实践中，不仅是一个新兴趋势，更是该领域的一次必要演进。随着组织不断扩大其人工智能计划，MLOps\
  \ 提供了一种结构化的方法来管理机器学习模型的复杂生命周期，涵盖从开发、部署到监控和迭代的各个环节。\n\n以下是一些将在未来几年塑造人工智能和数据科学格局的\
  \ MLOps 机遇与未来趋势。\n\n### 行业影响与业务整合\n\nMLOps 因其能够驱动显著商业价值而日益受到认可。然而，要使人工智能解决方案真正产生影响，它们必须无缝集成到更广泛的业务战略中。这需要领导层、高管以及组织中各利益相关者的积极参与。MLOps\
  \ 与业务目标的对齐对于确保人工智能计划不仅在技术上可靠，而且在战略上具有相关性至关重要。随着 MLOps 变得更加普遍，组织内部将越来越需要教育和培训，以弥合数据科学团队与业务领导者之间的差距。这将促成一种更具凝聚力的\
  \ AI 采用方法，使 AI 解决方案的影响能够得到准确衡量，并与业务目标保持一致。\n\n### 人工智能生命周期的进步\n\n人工智能生命周期涵盖了从数据收集、模型开发到部署和监控的所有环节，是任何机器学习项目成功的关键。MLOps\
  \ 的一个主要趋势是持续优化这一生命周期，以提高效率和效果。在 MLOps 中采用持续交付实践对于自动化和简化机器学习工作流程的各个阶段至关重要。此外，将大型语言模型集成到\
  \ MLOps 生命周期中，为创新带来了新的机遇，尤其是在数据管理和自动化领域。为了充分发挥人工智能的潜力，组织需要专注于在整个 AI 生命周期中改善数据的可用性、标准化和集成。\n\
  \n### 云连续体与边缘计算\n\n云连续体（包括从集中式云数据中心到分散式边缘计算设备的一切）是 MLOps 的一个主要关注领域。随着数据科学项目变得越来越复杂，对能够为\
  \ AI 工作负载提供所需计算能力和能效的先进硬件能力的需求也在增长。特别是边缘计算，作为一种将机器学习模型部署到更靠近数据源的方法，正获得越来越多的关注，从而减少延迟并提高可靠性。现场可编程门阵列（FPGA）和其他专用硬件的使用也变得越来越普遍，使得在边缘端能够更高效地处理\
  \ AI 工作负载。随着这些技术的发展，它们将通过支持在多样化环境中进行更具可扩展性和效率的机器学习模型部署，在 MLOps 的未来中发挥关键作用。\n\n###\
  \ 网络与基础设施\n\n网络是 MLOps 预计将取得显著进展的另一个领域。现代网络技术的复杂性（由依赖连接性的设备和服务的数量不断增加所驱动）为应用基于 AI\
  \ 的解决方案提供了巨大机遇。跨异构硬件和软件架构部署机器学习模型，需要能够支持 AI 算法持续监控和重新部署的强大网络解决方案。函数即服务（FaaS）技术正成为实现\
  \ MLOps 模式的关键推动力，允许部署能够根据需求动态扩展的事件驱动型 AI 解决方案。此外，针对机器学习模型和数据集的独特需求，开发更复杂的版本控制系统的需求也日益明显。随着\
  \ MLOps 的成熟，将越来越强调开发能够支持 AI 驱动项目复杂网络和基础设施需求的工具和框架。例如，AlOps 或 LLMOps 可以利用图论来优化网络寿命，利用边缘设备和软件定义网络（SDN）控制器的能力。通过应用遗传算法，它可以进一步最小化网络延迟，从而增强网络基础设施的整体性能和可靠性。\n\
  \n### 数据管理中的机遇\n\n有效的数据管理是成功 AI 计划的基石。随着组织不断积累海量数据，高效管理这些数据的能力变得越来越重要。MLOps 提供了多种改善数据管理实践的机会，包括数据可用性、标准化和集成。通过利用\
  \ MLOps，组织可以确保其数据不仅易于访问，而且质量高，从而能够构建更准确、更可靠的机器学习模型。此外，使用 MLOps 可以帮助组织克服与数据收集、清理和分析相关的挑战，从而实现更有效的决策和创新。\n\
  \n### 自动化在 MLOps 中的作用\n\n自动化是 MLOps 效率提升的关键驱动力。通过自动化重复且耗时的任务，组织可以显著减少开发、部署和维护机器学习模型所需的时间和资源。在自动化的支持下，AI\
  \ 解决方案的持续交付允许更快的模型迭代和部署，使组织能够更迅速地响应不断变化的业务需求。此外，自动化有助于降低错误风险，并提高 AI 解决方案的整体质量。随着\
  \ MLOps 的持续发展，自动化在推动效率和创新方面的作用将变得更加突出。\n\n\n\n### 新兴框架在 MLOps 中的作用\n\n让我们回顾一下即将到来的框架和架构将如何塑造\
  \ AI 与 ML 运营的未来。MLOps 的未来将受到新兴框架和架构的显著影响，这些框架和架构旨在简化和优化机器学习生命周期。这些新兴框架将专注于应对 AI\
  \ 模型日益增长的复杂性、对可扩展性的需求，以及边缘计算、无服务器架构和混合云环境等先进技术的集成。\n\n*   **可扩展性与效率：** 随着机器学习模型变得愈发复杂，数据集持续增长，可扩展性成为关键问题。即将推出的框架将强调计算资源的高效利用，实现在分布式环境中的无缝扩展。这将涉及利用容器化、微服务和无服务器计算，以确保无论底层基础设施如何，模型都能被有效部署和管理。\n\
  \n*   **自动化与集成：** 未来的 MLOps 框架可能会融入更多自动化功能，减少管理端到端机器学习流水线所需的人工工作量。这包括自动化的数据预处理、模型训练、超参数调优和部署。与\
  \ AIOps（人工智能运维）的集成将变得更加普遍，从而在 ML 系统中实现更智能的监控、错误检测和自动修复。\n\n*   **互操作性与灵活性：** 随着组织采用多云和混合云策略，跨不同平台的互操作性需求将变得更加突出。新兴的\
  \ MLOps 框架将专注于提供灵活性，以便在各种云环境中部署和管理模型，确保组织能够根据自身特定需求选择最佳工具和资源，而不会被单一供应商锁定。\n\n* \
  \  **安全性与合规性：** 随着 AI 在敏感和受监管行业中的使用日益增多，安全性和合规性将成为新 MLOps 框架设计中的关键考量因素。这些框架需要融入强大的安全特性，例如加密、访问控制和审计日志记录，同时确保符合行业标准和法规。\n\
  \n*   **边缘与物联网集成：** 边缘计算和物联网的兴起将推动支持在边缘设备上部署 AI 模型的框架的发展。这些框架需要应对边缘环境的独特挑战，例如有限的计算资源、延迟要求以及实时决策的需求。这将为自动驾驶汽车、智慧城市和工业自动化等领域的\
  \ AI 应用开辟新的可能性。\n\n## 前进之路：2025 年及以后\n\n随着机器学习不断发展，围绕它的运营框架（统称为 MLOps）也在快速演进。随着组织越来越多地将机器学习和人工智能作为其业务战略的核心组成部分，对高效、可扩展且自动化的\
  \ MLOps 实践的需求变得愈发关键。展望 2025 年及以后，几大趋势将重塑 MLOps 格局，推动技术创新和运营效率的提升。\n\n### 自动化与 AI\
  \ 驱动运营的增强\n\n自动化将在 MLOps 的未来中扮演核心角色。目前由数据科学家和 ML 工程师执行的许多手动任务——例如模型重新训练、超参数调优和异常检测——预计将实现高度自动化。AI\
  \ 驱动的运营将实现自愈系统，能够在无需人工干预的情况下识别并纠正问题。这不仅会减轻团队的运营负担，还能确保 ML 模型长期保持准确性和可靠性。\n\n在 2025\
  \ 年及以后，我们很可能会看到能够管理整个 ML 生命周期（从数据摄取到模型部署和监控）的自主 MLOps 平台的兴起。这些平台将利用 AI 做出实时决策，优化资源分配并提升整体系统性能。\n\
  \n### 与边缘计算的集成\n\n随着边缘计算日益普及，MLOps 需要适应并管理部署在边缘设备上的 ML 模型。MLOps 与边缘计算的集成将有助于在更接近数据生成源的位置进行实时数据处理和决策。这对于自动驾驶汽车、医疗保健和物联网等行业尤为重要，因为这些领域对低延迟和即时洞察的要求极为关键。\n\
  \n未来，MLOps 平台将扩展其能力以支持分布式的、基于边缘的 ML 模型。这将包括用于管理模型更新、监控性能以及确保跨去中心化设备网络合规性的工具。\n\n\
  ### 强调模型可解释性与伦理\n\n随着决策过程对 AI 的依赖日益加深，模型的可解释性和伦理将受到更多重视。组织需要确保其 ML 模型不仅准确，而且透明且公平。MLOps\
  \ 将演进以融入能够审计模型偏见、解释其预测并确保符合伦理标准的框架和工具。\n\n可以预见，MLOps 的未来创新将包括内置的持续伦理评估能力，确保模型符合监管要求和社会价值观。这对于维持对\
  \ AI 系统的信任至关重要，尤其是在金融、医疗和法律等领域。\n\n\n\n### 可扩展性与超自动化\n\n随着已部署的机器学习模型数量不断增长，MLOps\
  \ 系统的可扩展性将成为一个重要关注点。结合了人工智能、机器学习和自动化工具的超自动化，将是管理这种规模的关键。未来的 MLOps 平台需要支持在多样化环境中无缝部署、监控和管理数千个模型。\n\
  \n可扩展性还将延伸到支持 MLOps 的基础设施。云原生架构、容器化和无服务器计算将在帮助组织高效且经济地扩展其机器学习运营方面发挥重要作用。\n\n随着组织越来越多地采用人工智能驱动的解决方案，对可扩展和自动化流程的需求变得愈发迫切。\n\
  \n*   **大语言模型的可扩展性**：部署需要巨大计算能力和资源的大语言模型，推动了 MLOps 中可扩展性的边界。组织需要确保其基础设施能够处理这些模型日益增长的需求，包括大规模数据处理、分布式训练和实时推理。这不仅需要强大的基于云的解决方案，还需要能够根据工作负载需求无缝地扩展或缩减资源。\n\
  \n*   **超自动化**：超自动化指的是广泛使用人工智能、机器学习和机器人流程自动化等自动化技术来简化流程并消除人工干预。在 MLOps 的背景下，超自动化涉及自动化机器学习生命周期的每个方面——从数据摄取和预处理到模型训练、部署、监控和再训练。对于大语言模型而言，超自动化变得更加关键，因为这些模型可以在海量数据集上进行训练，并在无需人工监督的情况下持续优化。\n\
  \n*   **自动化模型管理**：作为超自动化的一部分，模型版本管理、实验跟踪和部署流水线可以完全自动化，确保性能最佳的模型始终处于生产状态。这减少了管理模型所需的时间和精力，并允许数据科学家和工程师专注于更具战略性的任务。\n\
  \n*   **实时推理与决策**：可扩展性和超自动化实现了实时推理和决策，这是许多人工智能驱动应用的关键要求。借助大语言模型，实时处理和响应数据的能力可以显著增强人工智能系统的有效性，尤其是在金融服务、医疗保健和自主系统等需要及时决策的场景中。\n\
  \n*   **资源优化**：随着大语言模型在规模和复杂性上持续增长，高效的资源利用变得至关重要。超自动化可以帮助优化计算资源的使用，确保以最具成本效益的方式训练和部署模型。这包括根据模型的特定需求自动分配资源，例如在训练时利用\
  \ GPU 集群，在需求低迷期间进行缩减。\n\n*   **持续学习与适应**：超自动化还支持大语言模型的持续学习和适应。通过自动化再训练过程并集成反馈循环，模型可以不断用新数据进行更新，从而随着时间的推移提高其性能。这在数据模式频繁变化的动态环境中尤为重要，模型需要快速适应以保持准确性。\n\
  \n*   **跨云与多云部署**：MLOps 中的可扩展性还涉及跨不同云环境部署模型的能力，利用每个平台的优势。超自动化可以促进跨云和多云部署，确保模型不仅具有可扩展性，而且具有高可用性和弹性。\n\
  \n总之，MLOps 的未来与可扩展性和超自动化的概念紧密相连，尤其是在集成大语言模型的情况下。这些趋势将推动开发更高效、更可靠、更具适应性的人工智能系统，以满足日益由人工智能驱动的世界的需求。拥抱这些趋势的组织将能够更好地利用人工智能的全部潜力，并在市场中保持竞争优势。\n\
  \n### 联邦学习与隐私保护技术的采用\n\n数据隐私问题正促使组织转向联邦学习和其他隐私保护技术。联邦学习允许在无需共享敏感数据的情况下，跨分散的数据源训练模型。这种方法不仅保护了隐私，还使得能够使用更大、更多样化的数据集。\n\
  \nMLOps 平台需要不断发展以支持联邦学习工作流，提供用于协调分布式训练、聚合模型和确保数据隐私的工具。差分隐私技术的集成将进一步提升在不损害个人数据安全的情况下训练稳健模型的能力。\n\
  \n随着围绕人工智能和机器学习的法规日益增多，确保模型符合法律和行业标准将成为大语言模型运维中的一个重要焦点。未来的可观测性工具可能会包含维护详细审计追踪、生成模型决策解释以及确保模型行为的各个方面透明且可问责的功能。MLOps\
  \ 平台将集成这些功能，为管理整个机器学习生命周期的合规性提供全面的解决方案。\n\n\n\n### 高级监控与可观测性\n\n随着机器学习模型日趋复杂并部署于关键应用，高级监控与可观测性将变得至关重要。未来的\
  \ MLOps 工具将提供对模型性能的实时洞察，包括模型漂移、数据质量和资源利用率的详细指标。这些工具将支持对机器学习模型进行主动管理，确保它们在条件变化时仍能满足性能要求。见图\
  \ 10-4。\n\n![](img/609560_1_En_10_Fig4_HTML.jpg)\n\n图 10-4\n\n可观测性的三大支柱\n\n模型可观测性在\
  \ LLMOps 领域正变得日益关键，因为它在确保生产环境中语言模型的最佳性能、可靠性和可信度方面发挥着重要作用。随着大语言模型（LLM）日益复杂并部署于更关键的应用，需要先进的可观测性机制来持续监控、分析和优化其行为。\n\
  \n*   **确保模型性能**\n\n持续监控和基准测试 LLM 性能指标对于确保模型按预期运行至关重要。高级可观测性允许实时跟踪关键性能指标（KPI），并有助于识别随时间推移的性能下降。这确保了模型即使在面对新数据或运行环境时，也能提供一致、高质量的结果。\n\
  \n*   **识别与调试问题**\n\n高级可观测性的主要优势之一是能够进行详细的错误分析和根本原因定位。当 LLM 产生不正确或次优的输出时，可观测性工具可以精确定位问题发生的具体实例，并促进有针对性的调试。这对于维护模型的准确性和可靠性至关重要，尤其是在错误可能造成重大后果的应用中。\n\
  \n*   **维护信任与可靠性**\n\n高级可观测性促进了 LLM 决策过程的透明度，这对于建立最终用户的信任至关重要。通过提供模型如何得出其预测的洞察，可观测性确保利益相关者能够理解和验证输出。此外，在关键应用中，可观测性确保操作员能够对模型的决策负责，这对于维护信任和可靠性至关重要。\n\
  \n*   **适应变化**\n\n可观测性是检测数据漂移和概念漂移的关键，当输入数据分布发生变化或模型的预测不再符合现实世界的概念时，就会发生漂移。高级可观测性允许及时识别这些漂移，从而能够重新训练或微调模型以适应新条件。这种适应性对于长期保持\
  \ LLM 的相关性和准确性至关重要。\n\n*   **法规遵从**\n\n在具有严格监管要求的行业中，高级可观测性通过提供审计追踪和促进可解释性来支持合规性。审计需要模型预测和行为的详细日志，而可解释性功能有助于生成模型决策所需的解释，确保\
  \ LLM 在法律和道德边界内运行。\n\n*   **优化资源**\n\n可观测性在优化计算资源使用方面也发挥着作用。通过突出性能瓶颈和低效环节，组织可以就如何更有效地分配资源做出明智的决策。这不仅提高了\
  \ LLM 运营的效率，还有助于管理与模型部署和维护相关的成本。\n\nLLM 可观测性对于在生产中维护语言模型的性能、可靠性和可信度至关重要。随着 LLM 的不断发展和其应用的扩展，强大的可观测性机制将变得越来越重要，以确保这些模型满足现代\
  \ AI 驱动应用所需的高标准。\n\n随着人工智能领域的发展，可观测性还将扩展到整个机器学习管道，为数据流、模型训练流程和部署管道提供端到端的可见性。这种全局视角对于识别瓶颈、优化性能和维持系统可靠性至关重要。\n\
  \n### 展望 LLMOps 的演进\n\n![](img/609560_1_En_10_Fig5_HTML.jpg)\n\n图 10-5\n\nLLMOps\
  \ 的组成部分\n\n随着我们接近 2025 年，大语言模型运维（LLMOps）的格局预计将迅速演变。随着企业越来越多地采用生成式 AI 和大语言模型，几个关键趋势预计将塑造\
  \ LLMOps 的未来。这些趋势包括数据货币化日益重要、向基于消费的定价模式转变，以及集成外部数据源以增强 AI 能力。本章深入探讨这些新兴趋势，探索它们在未来几年将如何影响\
  \ LLM 的运营化。\n\n#### 数据货币化与 LLM\n\n随着 LLM 的兴起，LLMOps 中最显著的趋势之一是 LLM 和生成式 AI 有潜力为数据货币化带来新的机遇。随着组织积累大量敏感和专有数据，有效管理和利用这些数据的需求日益增长。企业可能会开发内部\
  \ LLM，而不是依赖像 ChatGPT 这样的公共工具，以保护其数据的隐私和安全。例如，一家航运公司可能会从 OpenAI 这样的提供商处购买基础模型，然后用其专有数据进行训练，以创建专门的\
  \ AI 解决方案。然而，对数据的需求并不仅限于内部数据集。\n\n企业领导者越来越认识到获取包含外部数据源的更广泛视角的重要性。为了做出明智的决策，组织必须了解影响其市场的区域趋势、行业基准和其他外部因素。这种对情境信息的需求为企业提供了重大机遇，它们不仅可以消费数据，还可以成为数据提供商。随着对高质量、行业特定数据的需求增长，企业可以通过向渴望洞察的市场出售其数据产品来利用这一趋势。像\
  \ ADP 这样的公司，提供分析不同人群薪资增长情况的数据产品，就是这一趋势的例证。\n\n\n\n#### 按用量计费模式的兴起\n\nLLMOps 领域的另一个新兴趋势是向按用量计费模式转变。传统的软件定价模式，即一次性购买软件包然后每隔几年升级一次，已经演变为订阅模式。如今，随着人工智能和大语言模型的兴起，按用量计费模式正日益受到推崇。在这种模式下，用户根据其访问的数据量或消耗的计算能力付费，使成本与实际使用情况更加紧密地挂钩。\n\
  \n这种转变对于依赖使用多种数据源训练的模型的人工智能服务和应用程序尤为重要。当组织将这些模型整合到其运营中时，数据所有者可以根据其数据被使用的频率获得补偿。这种方法不仅确保了公平性，还鼓励采用基于使用量的模式，这种模式可能比传统的订阅模式更高效、更具成本效益。\n\
  \n然而，对于习惯于固定成本模式的组织来说，向按用量计费模式过渡也带来了挑战。要成功实施这种方法，企业需要了解其使用模式、具备设定预算的能力，以及监控和控制支出的工具。这种转变还将推动创新，因为公司可以快速构建人工智能解决方案的原型，而无需承担大额前期合同的财务承诺。虽然订阅模式在高使用量场景下可能仍然适用，但基于使用量的定价为实验和规模化提供了一个灵活的切入点。\n\
  \n#### 内部大语言模型与外部数据的整合\n\n随着企业越来越多地开发自己的大语言模型，整合外部数据源以增强人工智能能力将日益受到重视。虽然内部大语言模型允许组织根据其特定需求定制人工智能模型，但外部数据为明智决策提供了必要的更广泛背景。例如，一家公司可以用内部销售数据训练其大语言模型，但同时整合外部经济指标以更准确地预测市场趋势。\n\
  \n这一趋势凸显了数据多样性在人工智能中的重要性。通过结合内部和外部数据，组织可以开发出更强大的人工智能模型，从而提供更深入的洞察和更准确的预测。因此，对高质量、特定行业的外部数据的需求将持续增长，为数据提供商创造将其资产变现的机会。\n\
  \n随着 LLMOps 格局的演变，组织必须适应新的运营模式和技术。向数据货币化、按用量计费模式以及整合外部数据源的转变，将要求企业重新思考其人工智能战略。能够有效管理和利用其数据、采用灵活的定价模式并整合多样化数据源的公司，将能够在\
  \ LLMOps 这个新时代中蓬勃发展。\n\n### 在 MLOps 中大规模部署人工智能的伦理考量\n\n随着人工智能持续颠覆各行各业，在机器学习运维环境中大规模部署人工智能带来了重大的伦理挑战。随着人工智能在从医疗保健到金融、电子商务等各个领域变得无处不在，解决伦理问题变得日益关键。人工智能能力的快速发展引发了关于偏见、隐私和法规遵从的复杂问题。MLOps\
  \ 能够以结构化和自动化的方式将机器学习投入运营，在确保大规模伦理化部署人工智能方面发挥着关键作用。\n\n#### 通过 MLOps 解决人工智能算法中的偏见问题\n\
  \n围绕人工智能最紧迫的伦理问题之一是算法偏见。基于有偏见数据训练的人工智能模型可能会延续甚至加剧社会不平等。例如，面部识别技术已被发现对某些人群的误报率更高，而信用评分模型如果历史偏见被嵌入数据中，可能会不公平地使少数群体处于不利地位。\n\
  \nMLOps 可以通过持续监控、自动重新训练和模型透明度提供缓解偏见的解决方案。通过在 MLOps 流程中嵌入偏见检测机制，组织可以确保定期评估模型的公平性。例如，Amazon\
  \ SageMaker Clarify 或 IBM AI Fairness 360 等工具可以检测数据集和模型中的偏见，提供关于不公平结果的见解。MLOps 框架还可以支持包含多样化和代表性数据的自动重新训练过程，有助于解决不断演变的偏见，并确保模型反映当前现实。\n\
  \n另一个重要方面是可解释性。人工智能模型，特别是像深度学习网络这样复杂的模型，通常像黑箱一样运作，使得理解决策过程变得困难。MLOps 可以帮助集成诸如局部可解释模型无关解释（LIME）或沙普利加性解释（SHAP）等可解释性工具，使利益相关者能够理解并信任人工智能的预测。这对于医疗保健等行业至关重要，因为这些行业决策过程的透明度直接影响结果。\n\
  \n#### 大规模人工智能部署中的隐私问题\n\n数据隐私是另一个关键的伦理考量，尤其是在人工智能系统越来越多地处理大量敏感数据的情况下。基于个人或敏感数据（如医疗记录、财务信息或社交媒体互动）训练的人工智能模型，如果数据处理不安全，或者模型在推理过程中无意中泄露个人信息，可能会引发隐私风险。\n\
  \nMLOps 框架提供了几种解决隐私问题的策略。联邦学习是一种新兴技术，它允许人工智能模型在多个去中心化的设备或服务器上进行训练，同时将数据保留在本地。这确保了敏感数据永远不会离开其原始环境，从而降低了隐私风险。此外，差分隐私等技术会向数据中添加噪声，使得难以逆向工程出单个数据点，同时仍能保持模型准确性。\n\
  \n数据治理是 MLOps 可以发挥关键作用的另一个重要领域。MLOps 流程可以强制执行严格的数据管理协议，确保仅使用经过匿名化、加密或适当同意的数据进行模型训练。通过自动化合规性检查，MLOps\
  \ 框架还可以帮助组织遵守严格的隐私法律，如《通用数据保护条例》（GDPR）和《加州消费者隐私法案》（CCPA）。\n\n#### 人工智能部署中的监管挑战\n\
  \n随着人工智能技术变得越来越普及，监管审查也在加强。世界各地的政府和监管机构正在努力解决如何建立确保问责制、公平性和透明度的人工智能治理框架。对于大规模部署人工智能的组织来说，一个重大挑战是确保其模型符合不断演变的区域性和全球性法规。\n\
  \nMLOps 可以通过在整个模型开发生命周期中整合监管检查来促进合规性。自动化的合规性验证，例如确保模型满足数据保护要求或不会参与歧视性行为，可以嵌入到 MLOps\
  \ 流程中。此外，通过维护模型及其训练数据集的版本控制，MLOps 确保了完全的可追溯性——允许组织审计模型的开发历史，并在需要时证明合规性。\n\n此外，许多行业——例如金融和医疗保健——都受到特定法规的约束，这些法规要求在自动化决策系统中实现公平性、透明度和可解释性。MLOps\
  \ 可以通过在模型部署到生产环境之前，根据预定义的伦理和监管标准自动进行模型验证，来帮助将这些法规付诸实践。\n\n\n\n#### 大规模人工智能的伦理影响：一种整体性方法\n\
  \n大规模部署人工智能会带来独特的伦理挑战，需要制定全面的缓解策略。仅仅孤立地解决偏见或隐私问题是不够的；组织需要一种整体性方法，将伦理考量纳入 MLOps 生命周期的每个阶段——从数据收集到模型部署和监控。\n\
  \nMLOps 的未来在于其创建系统的能力，这些系统不仅能优化模型性能，还能确保人工智能的部署符合社会价值观和监管标准。持续监控已部署的模型、整合人工参与流程来审查模型输出，以及为伦理违规行为设置主动预警机制，都是\
  \ MLOps 为实现这一目标可以做出的贡献。\n\n此外，随着人工智能伦理领域的发展，MLOps 需要整合更新的标准和最佳实践——例如算法问责制，它要求对人工智能系统进行定期审计和评估，以确保其得到负责任的使用。技术专家、伦理学家和监管机构之间的合作，对于塑造人工智能部署的未来，使其既能促进创新又能承担伦理责任至关重要。\n\
  \n## 结论\n\nMLOps 的未来特征在于人工智能技术的持续演进，以及对管理人工智能工作负载的更复杂方法日益增长的需求。随着组织不断扩大其人工智能运营规模，他们将需要投资于先进的工具和策略，以确保其人工智能系统在日益复杂的环境中保持高性能、可靠性和安全性。通过拥抱本章概述的趋势和机遇，组织可以为自己在人工智能驱动的未来中取得成功做好准备，释放创新、效率和商业价值的新高度。通过关注这些伦理考量，MLOps\
  \ 可以确保人工智能技术成为对社会产生积极影响的工具，同时防范意外伤害。\n\n本章探讨了 MLOps 的未来趋势，重点介绍了 MLOps 与 AIOps 融合、大型语言模型的兴起以及云和边缘计算的持续演进所带来的挑战与机遇。展望\
  \ 2025 年及以后，很明显，MLOps 将继续在帮助组织充分利用人工智能潜力、在日益激烈的竞争格局中推动创新和增长方面发挥关键作用。\n\n## 来源\n\n\
