  ## Cepsa


  Cepsa 是一家全球性能源公司，业务涉及可持续发展和能源转型领域。在邮轮行业，Cepsa 在巴塞罗那港首次直接供应了第二代生物燃料。


  Cepsa 希望利用机器学习能力，成为能源转型、可持续出行、绿色分子和第二代生物燃料生产领域的领导者。


  Cepsa 已实施机器学习，以解决其所有业务线以及炼油厂各种流程中的复杂挑战。


  ![](img/609560_1_En_8_Figi_HTML.jpg)


  ### 业务目标


  Cepsa 的业务目标是利用各种 AWS 关键服务实施 MLOps 架构。MLOps 服务需覆盖完整的机器学习生命周期，并包含工业设备的预测性维护，以监控和优化其炼油厂的石化流程。


  ### 挑战


  以下是 Cepsa 在实施机器学习解决方案时面临的挑战：


  *   缺乏可供遵循的机器学习实施参考架构


  *   没有模型注册表或版本控制系统


  *   未实施模型监控


  *   缺乏用于性能评估的正确指标


  ### 使用的平台


  Cepsa 的数据科学家和开发人员实施了 AWS MLOps 系统及其各个组件。使用 AWS Cloud 9 编写、运行和调试用于数据整理和机器学习实验的代码，而
  GitHub 则作为 Git 代码仓库。Amazon SageMaker 用于实现从模型训练到在模型注册表中注册输出模型的自动化训练工作流。SageMaker
  模型托管功能用于创建推理端点以管理模型部署。


  AWS Step Functions 用于开发模型训练和部署流程，因为它提供了一个多功能框架，允许我们为每个项目创建特定的工作流，并轻松编排不同的 AWS 服务和组件。


  ![](img/609560_1_En_8_Fig5_HTML.jpg)


  图 8-5


  Cepsa 实施的 MLOps 架构


  ### 解决方案概述


  Cepsa 为 MLOps 实施了以下 AWS 服务：


  *   使用 Amazon SageMaker 构建、训练和部署机器学习模型。


  *   用于训练机器学习模型的数据通过 Amazon API Gateway 从各种数据湖中提取。


  *   API 后端通过 Amazon Athena（一种用于典型 SQL 数据分析的交互式查询引擎）访问存储在 Amazon Simple Storage 引擎（Amazon
  S3）中并在 AWS Glue Data Catalog 中编目的数据。


  *   AWS Step Functions 是一种无服务器低代码可视化工作流服务，用于编排和自动化流程。


  *   Amazon EventBridge 是一种无服务器事件总线。


  *   AWS Lambda 是一种无服务器计算解决方案，使您无需预置或管理服务器即可执行代码。


  *   Cepsa 实施了 Amazon Elastic Container Registry（Amazon ECR），用于存储、管理、共享和部署模型训练中使用的容器镜像。


  *   标准的 SageMaker Scikit-learn 已扩展，包含了项目所需的各种环境变量。


  *   为了实现模型部署自动化，实施了 Amazon EventBridge。


  ### 关键成果


  在实施 Amazon SageMaker 和其他 AWS 组件后，Cepsa 在机器学习实施和结果方面显示出巨大改进。


  *   目前，六个机器学习模型可以自动训练、部署和跟踪，并且每个生产模型已部署了超过 30 个版本的机器学习模型。


  *   当前的 MLOps 架构已扩展到公司内数百个机器学习模型的各个项目。


  *   借助自动化流水线和缩短的引导时间，机器学习项目的平均持续时间减少了 25%。


  *   快速的机器学习项目带来了产量提升，因此预计每年可节省约 30 万欧元。


  *   通过使用 Amazon SageMaker 进行 MLOps，实现了整个机器学习模型生命周期的自动化，以确保更好的模型质量，并实现更快、更频繁的生产部署。


  ## 总结思考


  目标是利用 Amazon 提供的 AWS 服务，无缝地自动化机器学习系统在生产中的部署。需要遵循 AWS 支柱的最佳实践，以实现卓越和非凡的性能。


  我们已经看到许多大型组织通过将 MLOps 实施到 AWS 中来提高性能，这自动化了机器学习生命周期流程。他们的项目能够更快地部署到生产环境，具有更好的性能和效率，上市时间缩短，投资回报率提高。这些是未来技术、理念、业务和组织的几个典范案例研究，可供
  MLOps 改进参考。


