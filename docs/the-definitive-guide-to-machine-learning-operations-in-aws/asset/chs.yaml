  图 7-6\n\nAmazon SageMaker 处理容器\n\n使用 SageMaker Processing 的好处是，您只需在作业运行时为处理实例付费。因此，您可以利用强大的实例而无需过多担心成本。例如，作为一般性建议，对于中等作业（数据量从兆字节到千兆字节），您可以使用\
  \ ml.m5.4xlarge；对于需要大量计算能力的工作负载，使用 ml.c5.18xlarge；当您希望将多个千兆字节的数据加载到内存中进行处理时，使用 ml.r5.8xlarge，并且只需按处理作业的时间付费。有时，您可能会考虑使用更大的实例来更快地完成作业，最终支付的总作业成本反而更低。\n\
  \n#### 用于数据准备的 SageMaker Data Wrangler\n\n借助 SageMaker Data Wrangler，您可以简化数据准备和特征工程，在单个可视化界面中完成数据准备工作流程的每一步——从数据选择和清理到探索、可视化和大规模处理。您可以使用\
  \ SQL 高效地从各种来源选择和导入数据。数据质量和洞察报告允许您自动验证数据质量并检测异常，例如重复行和目标泄露。SageMaker Data Wrangler\
  \ 提供超过 300 种内置数据转换，使您无需编写任何代码即可快速转换数据。其无代码/低代码、自动化和可视化功能有助于提高生产力并降低交互式分析的成本。\n\n\
  #### 用于实现特征可复用的 SageMaker Feature Store\n\n使用 Amazon SageMaker Feature Store 可以通过简化机器学习特征的管理来显著节省成本。它减少了跨团队和项目的重复工作以及重新运行特征工程代码的需求，从而更有效地利用资源。这个完全托管的、专为特定目的构建的存储库允许数据科学家和\
  \ ML 工程师轻松创建、共享和管理特征。其在线存储支持用于实时推理的低延迟检索，而其离线存储则维护用于训练和批量评分的特征值历史记录，确保 ML 开发的效率和成本效益。\n\
  \n### 模型开发\n\n模型训练和调优涉及选择适合用例的机器学习模型，然后进行模型的训练和微调。如前所述，优化模型开发成本依赖于两个关键策略：选择正确的基础设施和优化训练过程。\n\
  \n一般性指导原则是合理调整训练实例的大小，以匹配特定的机器学习算法，从而实现最佳效率和成本节约。利用调试工具来确定最适合训练的资源。简单的模型可能无法从更大的实例中受益，因为它们可能无法有效利用额外的计算资源。在某些情况下，由于\
  \ GPU 通信开销增加，它们甚至可能训练得更慢。建议从小型实例开始，并根据需要扩展。AWS 提供工具和服务，用于在保持性能的同时实现经济高效的模型开发，如下所述。\n\
  \n\n\n#### 合理调整训练实例的规模\n\n使用完全托管的 Amazon SageMaker 训练服务，您可以将训练作业所需的所有组件（如代码、容器和数据）发送到独立的计算基础设施，从而确保训练作业不受\
  \ SageMaker 笔记本实例资源的限制。SageMaker 训练 Python SDK 使您能够根据需要启动训练和调优作业。由于机器学习训练通常计算密集且耗时，这些作业会在远程基础设施上异步运行，因此，如果启动训练作业是您当天最后一项任务，您可以关闭笔记本实例以节省成本。\n\
  \n在选择训练实例时，请考虑以下成本优化因素：\n\n*   **实例系列**：确定最适合您训练的实例类型。优化整体训练成本有时可能意味着选择更大的实例，这可以加快训练速度并降低总成本。评估算法是否能够利用\
  \ GPU 实例。\n\n*   **实例大小**：确定算法运行训练所需的最低计算和内存容量。评估分布式训练是否可行。\n\n*   **实例数量**：对于分布式训练，决定集群所需的实例类型（CPU\
  \ 或 GPU）以及所需的实例数量。\n\n在选择实例系列和类型时，请根据工作负载所使用的特定算法或框架来做决定。图 7-7 简要概述了 SageMaker 上可用的实例系列。有关定价和实例大小的更多详细信息，请参阅\
  \ Amazon SageMaker 定价。\n\n![](img/609560_1_En_7_Fig7_HTML.jpg)\n\n图 7-7\n\nAmazon\
  \ SageMaker 训练实例类型\n\n实例类型如下：\n\n*   **基于 CPU 的实例**：\n    *   **M 系列**：这些实例提供了计算、内存和网络资源的均衡组合，使其成为大多数基于\
  \ CPU 的训练作业的绝佳初始选择。它们提供了均衡的 CPU 和内存比例，并且随着 CPU 核心数量的增加，可用的内存容量也更大。\n\n    *   **C\
  \ 系列**：针对计算密集型工作负载进行了优化，这些实例以经济高效的单位计算成本提供高性能。它们非常适合需要大量处理能力但内存需求较低的训练作业。\n\n* \
  \  **基于 GPU 的实例**：\n    *   **P3 系列**：利用 NVIDIA V100 GPU，P3 系列包括性能最高的单 GPU 实例（P3.2xlarge），非常适合不需要多个\
  \ GPU 的高内存工作负载。此外，P3 实例还提供 4 个和 8 个 GPU 的配置，适用于训练大型模型。\n\n    *   **P4 系列**：云端最强大的\
  \ GPU 实例，基于 NVIDIA A100 GPU，非常适合大型模型和数据集的分布式训练。每个 P4 实例包含 8 个 A100 GPU，每个 GPU 拥有\
  \ 40 GB 内存，并配备第三代 NVLink 以实现快速的多 GPU 训练。\n\n    *   **G4 系列**：与 P3 和 P4 相比，这些实例性能较低，但对于模型开发和训练而言更具成本效益。G4\
  \ 实例配备具有 16 GB GPU 内存的 NVIDIA T4 GPU，基于上一代 NVIDIA Turing 架构。如果需要更多的 vCPU 和更高的系统内存，请考虑使用\
  \ g4dn.(2/4/8/16)xlarge，尤其是在需要更多预处理或后处理的情况下。\n\n    *   **G5 系列**：作为 P3 和 P4 的低成本替代方案，G5\
  \ 实例提供单 GPU 和多 GPU 选项，性能比上一代 G4 实例提升三倍。G5 实例配备 NVIDIA 最新的 A10G 处理器，提供 1、4 和 8 个\
  \ GPU 的配置。\n\n*   **基于 AWS 芯片的实例**：\n    *   **Trainium**：AWS 自研的 Trn1 实例为训练参数超过\
  \ 1000 亿的大型深度学习模型提供了高性能、高性价比的解决方案。最大的实例 trn1.32xlarge 拥有 16 个 Trainium 加速器，配备 512\
  \ GB 加速器内存，可提供高达 3.4 petaflops 的 FP16/BF16 计算能力。这 16 个 Trainium 加速器通过超高速 NeuronLinkv2\
  \ 连接，有助于实现高效的集体通信。\n\n##### 实例合理调整规模的推荐最佳实践\n\n以下是一些最佳实践：\n\n*   如果您使用 SageMaker\
  \ 的内置算法，每个算法都附带了关于使用哪种实例类型进行训练的建议。例如，XGBoost 目前仅兼容 CPU，并且是一个内存密集型算法，而非计算密集型。因此，通用计算实例（如\
  \ M5）比计算优化实例（如 C4）更合适。相反，对于 SageMaker 图像分类算法，建议使用 GPU 实例，如 P3 或 G5。\n\n*   当您使用脚本模式或自定义容器运行自己的算法时，务必确定该框架或算法是支持\
  \ CPU、GPU 还是两者都支持，以便选择合适的实例类型。例如，由于 Scikit-learn 不支持 GPU，使用 G5 或 P3 等 GPU 实例将效率低下且成本高昂，不会带来任何运行时收益。对于基于\
  \ GPU 的训练，您应该分析您的作业，以找到实例数量和运行时间之间的最佳平衡点，从而最大限度地降低成本。Amazon SageMaker Debugger 可以帮助实时分析训练作业，通过识别和消除瓶颈来优化资源利用率，缩短训练时间，并降低机器学习模型的成本。\n\
  \n*   建议从少量实例开始，然后根据您的需求逐步增加。SageMaker 支持使用多个实例训练大型模型。\n\n#### 选择合适的训练数据源\n\n到目前为止，我们已经介绍了实例及其合理调整规模。训练过程中另一个关键方面是数据源及其处理方式。SageMaker\
  \ 支持三种不同的训练数据源：Amazon EFS、Amazon S3 和 Amazon FSx for Lustre。根据您的数据大小及其当前位置，您可以使用图\
  \ 7-8 中的流程图来确定最适合您训练作业的数据源。\n\n![](img/609560_1_En_7_Fig8_HTML.jpg)\n\n图 7-8\n\n\
  选择合适的训练数据源\n\n#### 使用托管竞价训练\n\n训练的另一个重要考虑因素是在按需实例和竞价实例之间进行选择。按需机器学习实例允许您按使用时间以标准费率支付计算容量费用。但是，对于能够容忍中断且不需要特定启停时间的作业，托管竞价训练是一种经济高效的替代方案。与按需实例相比，SageMaker\
  \ 可将训练成本降低高达 90%，并为您管理竞价中断。\n\n托管竞价训练利用 Amazon EC2 竞价实例来运行训练作业，而非按需实例。您可以指定哪些训练作业应使用竞价实例，并设置停止条件，以确定\
  \ SageMaker 将等待作业使用竞价实例运行多长时间。训练期间生成的指标和日志可在 CloudWatch 中查看。\n\n此外，Amazon SageMaker\
  \ 自动模型调优（即超参数调优）可以利用托管竞价训练。竞价实例可能会被中断，从而可能延迟作业完成。为了缓解这种情况，您可以配置托管竞价训练作业以使用检查点。SageMaker\
  \ 会将检查点数据从本地路径复制到 Amazon S3。如果作业被中断，它可以通过从 S3 检索数据，从最后一个检查点恢复，而无需从头开始重新启动。\n\n\n\
  \n#### 缩短训练时间\n\n随着深度学习模型日益复杂，优化和训练它们所需的时间也在增加。例如，训练一个像 RoBERTa 这样的 NLP 模型可能需要数千个\
  \ GPU 小时。尽管存在可用于减少训练时间的技术和优化方法，但实施这些策略需要大量的时间和专业技能，这可能会阻碍创新和人工智能（AI）的更广泛采用。\n\n\
  主要有三种方法可以加速训练：\n\n*   使用更强大的单台机器来处理计算\n*   将计算任务分布到 GPU 实例集群上，以实现并行模型训练\n*   通过减少内存和计算使用量来优化模型代码，使其在\
  \ GPU 上更高效地运行\n\n优化机器学习（ML）代码具有挑战性、耗时且需要专业知识。为了解决这个问题，SageMaker Training Compiler\
  \ 可以自动编译你的 Python 训练代码，并生成针对你特定模型定制的 GPU 内核。此过程可减少内存和计算使用量，从而缩短训练时间并降低成本。\n\n###\
  \ 模型部署\n\n在许多情况下，开发和运行机器学习（ML）应用的基础设施成本中，高达 90% 归因于推理。这是因为构建和训练任务并不频繁，且仅在其持续时间内产生成本，而端点实例必须持续运行（在服务期间）。因此，选择合适的托管方法和实例类型对于最小化\
  \ ML 项目的总成本至关重要。\n\n对于模型部署，首先必须理解你的具体用例。请考虑以下问题：\n\n*   预测的频率是多少？\n*   你的应用是否会处理实时流量，需要向客户端提供实时响应？\n\
  *   在同一个用例中，是否为不同的数据子集训练了多个模型？\n*   预测流量是否有显著变化？\n*   推理延迟是否是关键问题？\n\n通过解决这些问题，你可以确定为部署\
  \ ML 模型制定最有效且最具成本效益的策略。\n\n#### 选择正确的推理选项\n\n推理和实例类型的选择对成本有重大影响。你需要了解延迟要求、同步与异步需求、流量模式以及实时与批处理需求，然后选择满足所有要求的正确推理类型。为你的模型选择合适的实例有助于确保以最低的成本获得性能最佳的实例。\n\
  \n*   **实时推理**：适用于具有可预测流量模式、需要一致延迟和持续可用性的低延迟工作负载。负载大小应小于 6 MB，请求在 60 秒后超时。你按实例使用量付费。\n\
  *   **无服务器推理**：适用于具有间歇性或不可预测流量模式、可以容忍 p99 延迟变化的同步工作负载。无服务器推理会根据你的工作负载自动扩展，因此你无需为空闲资源付费，只需按推理请求的持续时间付费。它支持与实时推理相同的模型和容器，允许你根据需要切换模式。负载大小应小于\
  \ 4 MB，请求在 60 秒后超时。\n*   **异步推理**：专为处理大小高达 1 GB（例如，文本语料库、图像、视频和音频）且对延迟不敏感、对成本敏感的异步工作负载而设计。异步推理包含一个内置请求队列，并允许每个请求的处理时间长达\
  \ 15 分钟。你可以通过使用针对处理速率优化的自动扩缩实例组来控制成本，并可缩减至零以节省额外成本。\n*   **批处理推理**：最适合离线处理大型数据集，无需持久化端点。你仅按批处理推理作业的持续时间支付实例使用费。\n\
  \n图 7-9 提供了一个决策树，可帮助你选择合适的部署策略。\n\n![](img/609560_1_En_7_Fig9_HTML.jpg)\n\n图 7-9\n\
  \n选择合适的部署策略\n\n#### 合理调整模型托管实例集群的规模\n\nAmazon SageMaker Inference Recommender 会自动确定用于推理的最佳计算实例类型、实例数量、容器参数和模型优化，旨在提升性能并降低成本。通过\
  \ SageMaker Studio、AWS 命令行界面（AWS CLI）或 AWS SDK 即可访问，它能在几分钟内为你的 ML 模型提供部署建议。你可以将模型部署到推荐的实例，或在选定的实例类型上运行完全托管的负载测试，而无需管理测试基础设施。负载测试的结果可以在\
  \ SageMaker Studio 中查看，使你能够评估延迟、吞吐量和成本之间的权衡，从而选择最佳的部署配置。\n\n你可以通过 CloudWatch 访问这些建议，也可以在\
  \ SageMaker Studio 中查看。请记住，使用 Inference Recommender 需要与 SageMaker 模型注册表集成。\n\n在考虑\
  \ CloudWatch 指标时：\n\n*   如果你的首要任务是关注吞吐量的整体性价比，则应关注 `CostPerInference` 指标。\n*   如果你需要在延迟和吞吐量之间取得平衡，则应监控\
  \ `ModelLatency` 和 `MaxInvocations` 指标。请注意，`MaxInvocations` 表示吞吐量。\n\n##### 实例合理调整的推荐最佳实践\n\
  \n以下是最佳实践：\n\n*   为深度学习应用选择基于 GPU 的实例来管理峰值负载，如果资源未得到充分利用，可能并不划算。相反，可以考虑使用 Elastic\
  \ Inference，它使你能够为 SageMaker 实例添加低成本的 GPU 加速，从而降低深度学习推理的成本。\n*   考虑在 SageMaker 上使用\
  \ NVIDIA Triton Inference Server 大规模部署 Transformer 模型。NVIDIA Triton Inference Server\
  \ 是一款专为推理服务设计的开源软件，提供优化吞吐量和硬件利用率的功能，同时实现超低（个位数毫秒）的推理延迟。\n*   SageMaker 包含一个自动扩缩功能，可以监控工作负载并动态调整容量，以确保以最低的成本获得一致的性能。随着工作负载需求增加，自动扩缩会添加更多实例；当需求下降时，它会减少实例数量，从而有助于降低计算成本。SageMaker\
  \ 会自动将实例分布到多个可用区以实现高可用性。因此，强烈建议为每个生产端点部署多个实例。如果你使用的是 VPC，请在不同可用区中配置至少两个子网，以允许 Amazon\
  \ SageMaker 有效地分布你的实例。\n\n\n\n#### 将多个模型整合到更少的端点\n\n如果您有多个利用率不足的端点实例，请考虑以下托管选项，将使用量整合到更少的端点实例中：\n\
  \n*   **SageMaker 多模型端点**：多模型端点 (MME) 允许您在单个端点上部署数千个机器学习模型，非常适合具有相似大小和延迟要求的模型。由于并非所有模型都同时保存在内存中，MME\
  \ 是一种经济高效的解决方案，适用于能够处理冷启动的实时推理工作负载。这种可扩展的方法使用共享的托管容器来托管多个模型，与单模型端点相比，提高了端点利用率并降低了托管成本。此外，MME\
  \ 降低了部署开销，因为 Amazon SageMaker 会根据流量模式管理模型加载和扩展。\n\n*   **SageMaker 多容器端点**：多容器端点\
  \ (MCE) 允许您在单个端点上部署多个容器，每个容器可以使用不同的模型或框架。这些容器可以作为推理管道顺序运行，也可以通过直接调用单独访问，从而提高端点利用率并优化成本。使用\
  \ MCE，您可以在一个端点上部署多达 15 个不同的容器，每个容器可能使用不同的机器学习框架。与 MME 不同，MCE 将容器保留在内存中，避免了冷启动问题。容器可以直接调用或按顺序调用，提供了部署的灵活性。\n\
  \n#### 探索经济高效的硬件选项\n\n建议寻找经济高效的基础设施解决方案，用于在生产环境中部署机器学习应用。\n\n*   **SageMaker Neo**：SageMaker\
  \ Neo 通过在 SageMaker 托管中创建优化的推理容器，提升云端推理性能并降低成本。对于边缘推理，它会自动针对指定的操作系统和处理器调整模型，为开发人员节省数月的繁琐工作。SageMaker\
  \ Neo 通过将机器学习模型编译为可执行文件，为云实例和边缘设备优化模型。然后，可以将优化后的模型部署为 SageMaker 端点或部署到支持的边缘设备上，以实现高效的预测。\n\
  \n*   **Amazon EC2 Inf1 实例**：这些实例以云端最低的成本提供高性能的机器学习推理，与当前基于 GPU 的 Amazon EC2 实例相比，吞吐量最高可提升\
  \ 2.3 倍，每次推理的成本最高可降低 70%。Inf1 实例专为机器学习推理应用而设计，配备多达 16 个 AWS Inferentia 芯片，这是 AWS\
  \ 自主研发的高性能推理芯片。这些实例还包含第二代英特尔至强可扩展处理器和高达 100 Gbps 的网络带宽，确保推理任务的高吞吐量。\n\n#### 清理未使用的端点\n\
  \nSageMaker 提供了强大的工具来部署和测试模型，包括使用两个模型变体进行 A/B 测试。您可以将机器学习模型部署为端点，用于实时推理测试。然而，端点有时会无意中保持活动状态，导致不必要的费用。定期审查并在测试完成或没有下游消费者时删除端点至关重要。由于模型工件存储在\
  \ Amazon S3 中，并且借助高效的 MLOps 管道，可以在需要时轻松重新创建端点。此外，您可以使用 CloudWatch Events 和 Lambda\
  \ 函数自动检测和移除空闲端点。例如，您可以设置一个系统，识别在指定时间段（例如过去 24 小时）内未被调用的端点，并自动将其删除。\n\n### 模型监控\n\
  \n深度学习 (DL) 模型的训练过程既昂贵又耗时。数据科学家跟踪模型指标（如训练准确率、训练损失、验证准确率和验证损失）以做出明智的决策至关重要。Amazon\
  \ SageMaker 通过与 CloudWatch 的无缝集成来促进这一点，CloudWatch 提供关于训练作业实例利用率（包括 CPU、内存和 GPU 使用率）的近实时指标。\n\
  \n对于部署，通过监控端点使用情况和优化实例集群大小，确保在生产环境中运行模型时高效使用计算资源至关重要。为您的托管模型实施自动扩展（autoscaling），以根据工作负载变化动态调整实例数量。\n\
  \n## 自动化与工具\n\n自动化和工具在优化 AWS MLOps 成本方面发挥着关键作用。通过自动化重复性任务，例如数据预处理、模型训练和部署，组织可以显著减少管理这些流程所需的手动工作和时间。AWS\
  \ SageMaker 等工具提供了用于自动化模型调优、部署和监控的内置功能，确保高效利用计算资源。自动扩展功能可根据工作负载需求动态调整实例数量，防止过度配置并最大限度地减少闲置资源。此外，通过\
  \ Amazon CloudWatch 等服务进行的自动化监控和告警有助于识别利用率不足的实例，并优化其大小和数量。通过利用这些自动化工具和技术，组织可以在其机器学习运营中实现显著的成本节约，同时保持高性能和可扩展性。以下是一些推荐的最佳实践。\n\
  \n### 评估自动化的成本优势\n\n自动化机器学习模型的部署消除了通常容易出错的手动工作，提高了数据科学家和机器学习工程师的生产力，并加快了产品上市时间。Amazon\
  \ SageMaker 提供了一套专为机器学习运营而构建的工具，简化了模型部署过程。当与 AWS CodePipeline 和 AWS CodeDeploy 集成时，这些工具能够创建用于无缝部署端点的持续交付服务。此外，Amazon\
  \ SageMaker Projects 提供了一个强大的平台，用于编排和管理整个机器学习生命周期，包括模型部署。通过利用这些自动化工具，组织可以简化其机器学习工作流程，确保一致性，降低出错的可能性，并实现更快、更高效的部署，最终实现成本节约和运营效率的提升。\n\
  \n### 利用 AWS 标签增强资源管理和成本跟踪\n\n实施 AWS 标签允许您为 AWS 资源分配标签，帮助您更有效地组织和管理它们。每个标签由一个唯一的键和一个对应的值组成。对于每个资源，标签键必须是唯一的，并且只能有一个关联值。标签在组织资源和利用成本分配标签进行详细的\
  \ AWS 支出跟踪方面至关重要。这些标签使 AWS 能够在您的成本分配报告中组织资源成本，从而更容易对您的 AWS 费用进行分类和监控。AWS 提供两种类型的成本分配标签：AWS\
  \ 生成的标签和用户定义的标签。AWS 生成的标签由 AWS 服务自动创建，而用户定义的标签由您创建，为您标记和跟踪资源提供了灵活性。该系统有助于精确的成本管理，并确保您可以轻松地将成本归因于特定项目、部门或任何其他组织单位，从而改善财务监督和效率。\n\
  \n\n\n### 利用 AWS Budgets 实现全面的成本跟踪与管理\n\nAWS Budgets 是监控和管理 Amazon SageMaker 成本的重要工具，涵盖开发、训练和托管等所有方面。通过设置\
  \ AWS Budgets，您可以密切跟踪支出，确保其保持在预设限额内。AWS Budgets 的关键功能之一是能够设置提醒，当您的实际或预测支出超出预算金额时，系统会通知您。这种主动方法使您能够在成本失控前采取纠正措施。创建预算后，您可以通过\
  \ AWS Budgets 控制台持续跟踪其进度，该控制台提供有关支出模式的详细洞察和可视化信息。此工具不仅有助于维护财务纪律，还能帮助您做出明智决策，以优化机器学习项目中的资源分配和成本效率。通过将\
  \ AWS Budgets 集成到您的财务监督流程中，您可以确保 SageMaker 支出与组织目标和预算限制保持一致。\n\n### 利用 AWS Savings\
  \ Plans\n\nAmazon SageMaker Savings Plans 为 SageMaker 提供了一种灵活的定价模式，作为承诺在一年或三年期限内保持稳定用量（以美元/小时计）的交换。这些计划会自动应用于符合条件的\
  \ SageMaker ML 实例使用，包括 Studio 笔记本、SageMaker 按需笔记本、SageMaker Processing、Amazon SageMaker\
  \ Data Wrangler、SageMaker Training、SageMaker 实时推理和 SageMaker 批量转换，无论实例系列、大小或区域如何。例如，您可以随时将推理工作负载从美国东部（俄亥俄）运行的\
  \ CPU ml.c5.xlarge 实例更改为美国西部（俄勒冈）的 ml.Inf1 实例，并自动继续按 Savings Plan 价格付费。\n\n### 使用\
  \ AWS Cost Explorer 跟踪用量和支出\n\nAWS Cost Explorer 提供预配置视图，显示有关成本趋势的信息，帮助您快速了解成本历史和趋势。它允许您按\
  \ AWS 服务、使用类型、成本分配标签、EC2 实例类型等值进行筛选和分组。如果您使用合并账单，还可以按关联账户进行筛选。此外，您可以设置时间间隔和粒度，并根据历史成本和用量数据预测未来成本。\n\
  \n图 7-10 显示了所选日期范围内按区域分组的每月 SageMaker 成本。\n\n![](img/609560_1_En_7_Fig10_HTML.jpg)\n\
  \n图 7-10\n\n使用 AWS Cost Explorer 分析 Amazon SageMaker 成本\n\n### 监控并提升机器学习模型的投资回报率\
  \ (ROI)\n\n一旦机器学习模型部署到生产环境，建立报告机制来跟踪其交付的价值至关重要。例如，如果模型支持客户获取，您应衡量相比没有模型建议的基线，获取了多少新客户及其支出。如果模型预测维护需求，则跟踪优化维护周期所带来的成本节约。\n\
  \n有效的报告使您能够将机器学习模型产生的价值与其持续运营成本进行比较，从而做出明智的决策。如果 ROI 显著为正，请考虑扩展模型以应对类似挑战。如果 ROI\
  \ 为负，则调查潜在的改进措施，例如通过无服务器推理降低模型延迟，或通过调整模型准确性与复杂性之间的平衡来削减运行时成本。另一种方法是在使用更复杂的模型之前，先使用一个更简单的模型进行分类或过滤案例。\n\
  \n通过持续监控和优化机器学习模型的 ROI，您可以最大化其影响，并确保它们有效促进组织目标的实现。\n\n### 使用全面的日志记录和监控\n\nAmazon\
  \ CloudWatch 是一项全面的监控和管理服务，为 AWS、本地、混合云以及其他云应用程序和基础设施资源提供数据和可操作洞察。它将日志和指标等性能和运营数据整合到一个单一平台，无需单独监控这些元素（例如服务器、网络或数据库）。CloudWatch\
  \ 允许您使用告警、日志和事件数据来监督整个技术栈——应用程序、基础设施、网络和服务——从而自动化操作并缩短平均解决时间 (MTTR)。这种效率释放了宝贵的资源，使您能够专注于构建应用程序和增加业务价值。\n\
  \nCloudWatch 提供可操作的洞察，有助于优化应用程序性能、管理资源利用率以及评估系统范围的运营健康状况。它提供高达一秒粒度的指标和日志数据可见性，将指标数据保留\
  \ 15 个月，并允许进行指标计算。这些功能支持进行历史分析以实现成本优化，并提供实时洞察以增强应用程序和基础设施资源的性能。\n\n### 考虑使用 Spot\
  \ 实例\n\n降低机器学习训练成本的最简单方法之一是使用 Amazon EC2 Spot 实例。与按需费率相比，这些实例以高达 90% 的显著折扣提供对未使用的\
  \ EC2 计算容量的访问。Amazon SageMaker 通过托管 Spot 训练简化了这一过程，使您无需手动设置和管理 Spot 实例即可降低训练成本。SageMaker\
  \ 会自动为您的训练任务预置 Spot 实例，如果 Spot 实例被回收，它会在容量可用时自动恢复训练，确保持续节省高达 90% 的成本。\n\n## 结论\n\
  \n成本优化对于管理机器学习工作负载至关重要，主要因为它能帮助组织保持在预算限制内，并防止因训练和推理所需的高计算能力而导致超支。通过优化成本，组织可以更高效地扩展其机器学习计划，从而能够处理更大的数据集、更复杂的模型和增加的用户需求，而不会增加开支。高效的资源使用，例如选择合适的实例类型和使用\
  \ Spot 实例，可以转化为更低的运营成本和更好的现有基础设施利用率。\n\n此外，成本优化通过降低运营费用提供竞争优势，从而带来更具竞争力的定价和更高的利润率。它通过高效利用资源减少能源消耗和碳足迹，与环境可持续性目标保持一致。有效管理成本还能增强组织的灵活性和敏捷性，使其能够更快地适应不断变化的业务需求。它通过确保支出与交付的价值相匹配来降低财务风险，并通过降低实验和探索新想法的财务障碍来促进创新。总体而言，优化机器学习工作负载成本对于维护财务健康、可扩展性、效率、竞争优势、可持续性、灵活性、风险管理和创新至关重要。\n\
  \n"
- '# 8. MLOps 案例研究


  我们已经深入探讨了 MLOps，包括其演变、原则、生命周期以及 AWS 中 MLOps 各个支柱的最佳实践。现在是时候通过一些具体的案例研究来反思 MLOps
  在现实场景中的实施了。


  在本章中，我们将深入探讨各个组织在实施 MLOps 最佳实践之前所面临的现实挑战案例，并展示他们在实施 MLOps 实践后结果如何得到改善。




  ## Amazon Music


  Amazon Music 提供对其海量歌曲和播客库的无限制访问。他们拥有超过 1 亿首歌曲可供免费流媒体播放，以及数百万个免费播客。每次搜索歌曲、播放列表或播客都充满挑战，尤其是当你不知道确切的标题、艺术家或专辑名称时。


  ![](img/609560_1_En_8_Figa_HTML.jpg)


  ### 业务目标


  在流量高峰期，当数百万活跃用户正在搜索他们心仪的音乐或播客时，需要一个智能且响应迅速的搜索功能来提供良好的客户体验。


  Amazon Music 的业务目标是实现卓越的搜索栏功能，并即时呈现音乐和播客结果。为实现这一目标，Amazon Music 采用了搭载 NVIDIA 的 Amazon
  SageMaker 来优化机器学习训练，并利用了人工智能的力量。


  ### 挑战


  在实施 MLOps 之前，Amazon Music 面临以下挑战：


  *   提供相关且快速的实时搜索结果是一项挑战。


  *   在流量高峰期，搜索栏的功能，如实时拼写检查和向量搜索，难以实现。


  *   人工智能模型的模型训练和推理成本优化是一项挑战。


  ### 使用的平台


  Amazon Music 采用了搭载 NVIDIA Triton 推理服务器和 TensorRT 的 Amazon SageMaker 来优化成本和性能。Amazon
  SageMaker 为机器学习生命周期提供了一整套端到端服务，无需处理任何基础设施问题。Amazon Music 在 AWS 云上以最小的投入构建、训练和部署其机器学习模型。


  ### 解决方案概述


  Amazon Music 实施了以下解决方案：


  *   Amazon SageMaker 使用 NVIDIA A10G Tensor Core GPU、Triton 推理服务器容器和 TensorRT 模型格式来托管
  G5 实例，以实现快速且成本优化的结果。它识别出关于批次大小和精度参数的优化领域，以提高训练深度学习模型的速度、效率和准确性。


  *   SageMaker 为向量搜索或基于嵌入的检索功能实现了实时语义搜索建议。向量搜索是一种机器学习技术，它利用内容的语义来帮助用户找到最相关的内容。


  *   Amazon Music 还使用 BART Transformer 模型实现了快速准确的搜索功能，用于拼写纠正。BART 推理管道的开发通过在 CPU
  上执行预处理（文本分词）和后处理（将分词转换为文本）阶段，而模型执行步骤则在 NVIDIA A10G Tensor Core GPU 上运行。


  ### 关键成果


  以下是 Amazon Music 实施 AWS MLOps 取得的关键成果：


  1.  经过 Amazon SageMaker 优化后，模型训练的 GPU 利用率提升了 54%。


  ![](img/609560_1_En_8_Figb_HTML.jpg)


  1.  在流量高峰期，使用 BART 拼写纠正器后，拼写检查模型的推理延迟减少了 25 毫秒，搜索查询延迟平均降低了 63%。因此，训练时间加快了 12 倍，从而实现了快速且准确的搜索结果。


  ![](img/609560_1_En_8_Figc_HTML.jpg)


  1.  与基于 CPU 的基准相比，使用搭载 NVIDIA A10G GPU 的 SageMaker G5 实例后，Amazon Music 的推理成本降低了
  70%。这提升了 Amazon Music 的性能。


  ![](img/609560_1_En_8_Figd_HTML.jpg)


  1.  借助深度学习神经网络，Amazon Music 为推理应用提供了低延迟和高吞吐量。


  我们可以看到，通过实施搭载 NVIDIA 的 Amazon SageMaker，Amazon Music 的搜索能力、结果获取时间以及成本优化方面都取得了显著改善。


  ## Yara


  Yara 是全球领先的作物营养公司以及环境和农业解决方案提供商。Yara 专注于生产有益于自然的食品，为客户、股东和社会创造价值，并构建更可持续的食品价值链。Yara
  是全球最大的硝酸盐、氨和氮磷钾肥料生产商。


  Yara 的愿景是创造一个没有饥饿的世界，实现气候友好型作物营养、低碳环境足迹的肥料、零排放能源解决方案，以及高质量和低生产成本。成为零排放、低成本的“未来工厂”是
  Yara 的长期目标。


  ![](img/609560_1_En_8_Fige_HTML.jpg)


  ### Yara 的业务目标


  Yara 的业务目标包括优化生产、提高产品质量、增加生产现场可靠性、降低排放、提高工人安全性和效率、自动化手动流程等。为实现这一目标，Yara 成立了一个名为“数字生产”的全球数字部门，以利用其运营过程中产生的大量数据。


  对于像 Yara 这样的生产工厂，能源消耗是主要的成本组成部分，并对盈利能力产生影响。Yara 实施了 Yara 能源负荷曲线（ELC）解决方案来分析其能源消耗性能。能源负荷曲线（ELC）工具会告知我们当前能源消耗何时偏离历史最佳水平，并向操作员提供建议以引导能源消耗。


  现在，主要目标是在全球多个站点实施 ELC 解决方案，并自动化部署和维护流程。


  ### 挑战


  在实施 MLOps 之前，Yara 面临以下挑战：


  1.  Yara 的能源负荷曲线（ELC）需要在全球多个站点和矿山实施。


  2.  所有部署和维护流程都需要自动化，以实现 Yara 的有效生产。


  ### 使用的平台


  Yara 正在使用 Amazon SageMaker 的功能，通过标准化和自动化 MLOps 实践来简化机器学习生命周期。为 Yara 实施了 Amazon SageMaker
  的多个步骤，包括 Amazon 框架容器、模型注册表、模型监控器以及用于数据准备、模型训练、模型评估和注册的 Amazon SageMaker Pipelines。


  ![](img/609560_1_En_8_Figf_HTML.jpg)


  ### 解决方案概述


  图 8-1 展示了为 Yara 设计的 Amazon SageMaker 高级架构。


  ![](img/609560_1_En_8_Fig1_HTML.jpg)


  图 8-1


  为 Yara 设计的 Amazon SageMaker 高级架构


  以下是 Yara 实施的解决方案：


  *   ELC 使用物联网（IoT）传感器从 Yara 的工厂收集数据，以测量指标并训练能源预测模型。在云端，实施了 AWS IoT Greengrass 来从工厂流式传感器传输实时数据。


  *   AWS IoT Greengrass 与 AWS IoT Core 安全地通信，并将 IoT 数据导出到 AWS 云。


  *   AWS IoT SiteWise 是一项托管服务，可大规模收集、组织、搜索和消费来自工业设备的数据。


  *   Yara 使用了 Amazon API Gateway 来创建 API，将传感器数据暴露给 ELC 等应用程序。


  *   ELC 应用程序后端使用 Amazon ECS 交付，并为前端由工厂操作员使用的 ELC 仪表板提供支持。ELC 应用程序负责向工厂操作员提供每小时的能源消耗数据预测。


  ### 关键成果


  在 Yara 实施 MLOps 后，取得了以下主要成果：


  *   Yara 的下一代数字生产平台（DPP）是使用 AWS 构建的，用于实现生产系统的数字化。


  *   DPP 已在 28 个生产站点和两个矿山实施。


  *   AWS 实施的 DPP 作为一个安全的数字核心，用于实现高效、可靠、安全和可持续的生产，以分析并获得新的见解。


  *   对于 Yara 而言，使用 AWS 的 MLOps 显著减少了新工厂接入、向 ELC 推出实时流更新以及用于质量保证的模型监控所需的工作量。




  ## 国民西敏寺银行


  国民西敏寺银行（National Westminster Bank，简称 NatWest）是一家领先的零售、银行及金融服务集团，为英国和爱尔兰的 1900 万客户提供服务。NatWest
  被视为英国四大清算银行之一，拥有超过 960 家分行组成的庞大网络，并提供网上银行服务。NatWest 每月处理约 7.5 亿笔金融交易。NatWest 坚信要激发潜能，并帮助个人、家庭和企业发展。


  ![](img/609560_1_En_8_Figg_HTML.jpg)


  ### NatWest 的业务目标


  实施 MLOps 的业务目标是缩短 NatWest 集团实现业务价值的时间。NatWest 集团大规模运用分析技术，使其成为一家优化的数据驱动型银行。然而，他们的流程本可以更快、更一致。快节奏的金融服务行业竞争非常激烈，要为其
  1900 万客户提供更快捷的服务需要付出巨大努力。NatWest 探索其数据并构建机器学习（ML）解决方案，以确保根据客户需求提供定制化体验。


  为了通过 ML 加速实现业务价值，NatWest 转向亚马逊云服务（AWS），并采用 Amazon SageMaker 作为其核心 ML 技术。Amazon SageMaker
  是一项服务，数据科学家和工程师可以使用它来构建、训练和部署 ML 模型，该服务为几乎任何用例提供完全托管的基础设施、工具和工作流程。NatWest 集团将其 ML
  流程集中在 AWS 上，尽管推出新产品和服务需要数月时间。这也在其数据科学团队中引入了更敏捷的文化。使用 Amazon SageMaker，白板上的一个想法在几个月内就能变成生产环境中可运行的
  ML 解决方案，而此前则需要一年或更长时间。


  ### 挑战


  以下是 NatWest 在实施 MLOps 之前面临的挑战：


  *   员工缺乏当前的培训和职责。对员工进行适当的培训本身就是一项耗时且具有挑战性的任务。

  *   手动流程，如手动交接和治理，导致进展缓慢且迟钝，从而造成实现价值的时间过长。

  *   数据是 ML 运营的首要前提，但访问和发现数据却很困难。

  *   陈旧的技术和过时的环境导致从开发到部署的时间过长。


  ### 使用的平台


  NatWest 集团与 AWS 专业服务团队合作，利用 Amazon SageMaker 创建了一个可扩展、安全且持久的 MLOps 平台。图 8-2 中的高级架构图展示了
  NatWest 业务应用用例如何部署在 AWS 上以构建 ML 解决方案。


  ![](img/609560_1_En_8_Fig2_HTML.jpg)


  图 8-2


  NatWest 的 Amazon SageMaker 高级架构


  ### 解决方案概述


  以下是 NatWest 实施的解决方案：


  *   NatWest 使用 Amazon Simple Storage Service (Amazon S3) 进行简单的数据存储和访问。借助对数据和资源的简单快速访问以及
  ML 工具，构建 ML 用例变得更加轻松快捷。

  *   NatWest 集团使用 AWS Service Catalog 来创建、组织和治理基础设施即代码模板。它将员工的工作流程从两到四周缩短到了几小时。

  *   NatWest 集团拥有 Amazon SageMaker Studio，这是一个基于 Web 的单一可视化界面，可以在其中执行所有 ML 开发步骤。由于其易于使用和配置，因此用户友好、易于学习，并能产生有效的结果。

  *   Amazon SageMaker 集成了 CI/CD 管道工作流程，用于生产就绪的用例开发。它提高了质量，优化了治理和谱系追踪。

  *   借助 Amazon SageMaker Studio，NatWest 实现了更快实现价值的主要目标。


  ### 关键成果


  ![](img/609560_1_En_8_Fig3_HTML.jpg)


  图 8-3


  NatWest 集团实施 MLOps 后的成果


  以下是 NatWest 集团实施 MLOps 后的关键成果：


  *   端到端 ML 解决方案的交付速度加快，从 12 个月缩短到不到 3 个月。

  *   通常需要 5 天的数据发现和访问，现在只需几小时即可完成。

  *   ML 模型部署到生产环境曾需要 6 个多月，现在不到 2 周即可完成。

  *   为最终用户创建了自助服务环境，有助于在一天内解决问题。

  *   实现业务价值的时间显著缩短，这使 NatWest 处于行业领先地位。


  ## 汤森路透


  汤森路透于 1992 年发布了其首个 AI 法律相关搜索服务 Westlaw Is Natural (WIN)，并随着更多 AI 产品和服务的发展而持续增长。汤森路透在全球法律、税务、会计、合规和新闻服务等多个领域产生了数十亿条机器学习洞察。


  随着 AI 服务的大幅增长，汤森路透需要自动化和标准化重复的、无差异化的工程工作。它还需要根据治理标准，在保障敏感数据安全的前提下，轻松访问可扩展的计算资源。


  ![](img/609560_1_En_8_Figh_HTML.jpg)


  ### 业务目标


  汤森路透的业务目标是提升 ML 能力，实施高级 AI 以提取行业洞察，帮助把握当前和未来的成果。汤森路透希望以更高的效率为利益相关者创造更大价值，并通过一流的解决方案预见未来的挑战。


  ### 挑战


  以下是汤森路透面临的挑战：


  *   尽管拥有高素质的工程师，但汤森路透的孤立技术未能提供足够的可见性，以对关键决策预测建立治理。

  *   业务问题未能通过机器学习能力得到妥善处理。

  *   汤森路透的各个团队遵循各自的流程和方法。TR 旨在为其用户提供覆盖整个 ML 生命周期的功能，通过让团队专注于业务目标而非重复无差异化的工程工作，来加速
  ML 项目的交付。

  *   在数据和 AI 解决方案中维持治理标准颇具挑战性。


  ### 使用的平台


  汤森路透的 AI 平台微服务以 Amazon SageMaker 为核心引擎，使用 AWS 无服务器组件处理工作流程，并使用 AWS DevOps 服务处理 CI/CD
  流程。对于实验和训练，实施了 SageMaker Studio，并且在汤森路透的 AI 平台中还实施了其他组件，如 SageMaker 模型注册表、Amazon
  DynamoDB 表、SageMaker 托管服务、SageMaker Model Monitor 和 SageMaker Clarify。


  ![](img/609560_1_En_8_Fig4_HTML.jpg)


  图 8-4


  汤森路透实施的 Amazon SageMaker 架构


  ### 解决方案概述


  汤森路透的企业 AI 平台为 ML 生命周期的每个阶段提供简单且标准化的能力。汤森路透 AI 平台的所有需求被模块化为五大类：


  *   数据服务用于实现对企 业数据资产的便捷、安全访问。

  *   实施 SageMaker Studio 以提供实验工作空间，用于实验和训练 ML 模型。

