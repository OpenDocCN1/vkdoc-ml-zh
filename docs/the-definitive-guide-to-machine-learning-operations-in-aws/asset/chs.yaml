  \n降低数据敏感度\n\n确定哪些数据应被匿名化或去标识化，以降低数据敏感度并进行评估。开发无服务器令牌化系统是隐藏敏感数据并降低未经授权访问可能性的最佳方法。将一段数据转换为称为令牌的随机字符串的过程就是*令牌化*。令牌化利用一个通常称为*令牌库*的数据库，该数据库保存令牌与敏感值之间的连接。接下来，库中的数据通常通过加密进行保护。令牌值可以在各种应用程序中替换原始数据。Amazon\
  \ Cognito 用于客户端身份验证并接收授权令牌。\n\n*   实施强制数据血缘\n\n    数据血缘对于审计、监控和追踪数据来源及其随时间的变化是必要的。必须对训练数据应用完整性检查，以识别因丢失、损坏或篡改而导致的任何意外偏差，从而严格控制数据访问。数据血缘提供了可见性，并有助于追溯数据处理错误的根本原因。其实施方案详述如下：\n\
  \n    追踪任何更新的记录\n\n    Amazon SageMaker ML Lineage Tracker 用于存储从数据准备到模型部署的 ML 工作流步骤信息。\n\
  \n    通过血缘追踪可以提取以下信息：\n    *   可以重现工作流步骤，并追踪模型和数据集的来源。\n\n    *   遵循模型血缘工件以验证合规性，并建立模型治理和审计标准。\n\
  \n    *   将原始数据视为最终的真实来源。\n\n    *   维护模型发现实验的运行历史。\n\n    *   摄取、处理和维护从其派生的数据集的映射。从结果迭代回原始数据元素。\n\
  \n    *   不仅将这些概念应用于数据，还应用于代码、模型、管道和基础设施。验证您可以追踪和审计任何与管道操作、数据或机器学习模型相关的活动。\n\n \
  \       以下示例代码演示了血缘实体的基础知识，以及如何创建和关联不同的血缘实体来追踪您的工作流。您可以进一步遍历不同血缘实体之间的关联。\n\n   \
  \     ```\n        from datetime import datetime\n        from sagemaker.lineage.context\
  \ import Context\n        from sagemaker.lineage.action import Action\n        from\
  \ sagemaker.lineage.association import Association\n        from sagemaker.lineage.artifact\
  \ import Artifact\n        unique_id = str(int(datetime.now().replace(microsecond=0).timestamp()))\n\
  \        print(f\"Unique id is {unique_id}\")\n        # create an example context\n\
  \        # the name must be unique across all other contexts\n        context_name\
  \ = f\"machine-learning-workflow-{unique_id}\"\n        ml_workflow_context = Context.create(\n\
  \        context_name=context_name,\n        context_type=\"MLWorkflow\",\n    \
  \    source_uri=unique_id,\n        # properties services as a method to store metdata\
  \ on lineage entities in additional to Tags\n        properties={\"example\": \"\
  true\"},\n        )\n        ```\n\n    在此代码中，使用 `sagemaker.lineage.context` 创建了\
  \ `context` 实体。创建了一个唯一 ID，并为该上下文在所有其他实体中分配了一个唯一名称，并定义了其属性。\n\n\n\n##### 实施仅保留相关数据\n\
  \n机器学习系统应设计为在整个生命周期内管理数据。系统需要保留与用例相关的数据，过时的数据应在指定时间自动删除。为降低数据暴露风险，应在不同计算环境（如开发和预发布环境）中保存数据，并实施机制以在整个数据中强制执行生命周期管理流程。其实施计划详述如下：\n\
  \n建立数据生命周期计划\n\n每一条数据都会经历一个数据生命周期，从原始状态到处理后的状态，最终用户利用结果做出更明智的决策。\n\n组织在数据生命周期的每个阶段都使用\
  \ AWS 云服务来快速且经济地处理数据。我们需要创建一个数据生命周期计划，以了解运营和调试任务的消费和需求模式；这将最终减少数据蔓延，并从数据中获取更多价值。参见图\
  \ 4-18。\n\n![](img/609560_1_En_4_Fig18_HTML.jpg)\n\n图 4-18\n\n数据生命周期阶段\n\n数据生命周期有五个阶段。\n\
  \n![](img/609560_1_En_4_Fig19_HTML.jpg)\n\n图 4-19\n\nAmazon Comprehend 架构\n\n* \
  \  *数据摄取*\n\n    数据摄取从各种经过验证的高价值数据源（如交易文件、ERP、数据库、Web 日志等）获取数据，并将其导入到可以应用数据分析和机器学习的位置。这些数据文件在\
  \ AWS 云上安全保存并备份。云以经济、安全、持久且最重要的是对广大用户可用的方式存储数据。此阶段可用的 AWS 服务包括 Amazon Kinesis、AWS\
  \ Direct Connect、AWS Snowball/Snowball Edge/Snowmobile、AWS DataSync、Amazon S3 Transfer\
  \ Acceleration、AWS Database Migration Service 和 AWS Storage Gateway。\n\n*   *数据暂存*\n\
  \n    数据暂存涉及在将数据提供给用户之前执行一些内务处理任务。企业以不同方式将数据存储在不同位置，例如数据库、电子表格、文本文件和数据仓库。通过避免不同的存储方法，AWS\
  \ 简化了在 Amazon S3 等单一位置暂存数据或构建数据湖的过程。数据暂存阶段可用的 AWS 服务包括 Amazon S3、Amazon Aurora、Amazon\
  \ RDS 和 Amazon DynamoDB。\n\n*   *数据清洗*\n\n    在数据分析之前，需要对缺陷、损坏数据或不准确数据进行数据清洗。数据清洗涉及以下全部或部分过程：\n\
  \    *   识别损坏或脏数据\n\n    *   为增加分析输出的准确性，添加或编辑脏数据\n\n    *   将语音转换为文本数据\n\n    *\
  \   根据要求的输入翻译文件\n\n    *   将音频和图像数据转换为数字格式进行处理，或包含元数据标签以方便分类和搜索\n\n    最后一步是转换数据，使其针对代码（例如，ETL）进行优化。\n\
  \n    可用于数据清洗的 AWS 服务包括 AWS Glue Data Catalog、AWS Glue (ETL)、Amazon EMR 和 Amazon\
  \ SageMaker Ground Truth。\n\n*   *数据分析与可视化*\n\n    此时，可以发现数据的真正价值。数据工程师和决策者使用分析和可视化工具来预测客户需求、优化运营、修复有缺陷的流程，并进行创新以保持竞争力。当高管和任务负责人能够访问数据时，他们无需依赖昂贵且易出错的猜测。可用于分析和可视化的\
  \ AWS 服务包括 Amazon Athena、Amazon Redshift、Amazon QuickSight、Amazon SageMaker、Amazon\
  \ Comprehend、Amazon Comprehend Medical 和 AWS DeepLens。\n\n*   *数据归档*\n\n    通过简化数据归档，AWS\
  \ 云释放了 IT 团队的资源，使其能够将更多精力投入到数据生命周期的其他阶段。这些存储解决方案带有内置加密，并拥有许多安全认证和合规标准，可立即实现合规。用于数据归档的\
  \ AWS 服务包括 Amazon S3 Glacier、Amazon S3 Glacier Deep Archive 和 AWS Storage Gateway。\n\
  \n*   *隐私设计*\n\n    设计数据时考虑隐私，在保持数据可用性的同时移除不需要的敏感信息。检测个人身份信息（PII）和未来业务问题迭代的特征。AWS\
  \ 提供使用 Amazon Comprehend 的机器学习能力，从各种来源（包括产品评论、社交媒体、支持问题、客户电子邮件等）检测和编辑 PII。参见图 4-19。\n\
  \n以下是 Amazon Comprehend 的主要功能：\n\n*   从文档、客户支持工单、电子邮件、产品评论等文本中发现有价值的见解\n\n*   通过检测文档中的\
  \ PII 实体并从中编辑文本来保护和控制谁有权访问敏感数据\n\n*   通过编辑 PII 实体来保护隐私并遵守当地法规\n\n*   以下示例演示了使用 AWS\
  \ CLI 上的 Amazon Comprehend 执行实时分析的代码。\n\n![](img/609560_1_En_4_Figb_HTML.jpg)\n\n\
  ![](img/609560_1_En_4_Fig20_HTML.jpg)\n\n图 4-20\n\nAmazon EMR 数据加密选项\n\n*   **模型开发**\n\
  \n    模型开发阶段包括模型构建、训练、超参数调优和评估。模型开发下的最佳实践详述如下：\n    *   **实施安全受控的机器学习环境**\n\n  \
  \      机器学习开发和运营环境受到检测性和预防性防护措施的保护。开发环境的配置通过为用户提供自助服务配置来进行持续管理和监控。还为安全受控的机器学习环境实施了事件管理和响应。其实施计划详述如下：\n\
  \n        **分解机器学习工作负载**\n\n        根据组织单位的访问模式分解机器学习工作负载。这将使得可以为每个组（如管理员、数据分析师等）分配访问权限。\n\
  \n        **使用防护措施和服务控制策略（SCP）**\n\n        使用检测性和预防性防护措施以及服务控制策略，为每种类型的机器学习环境强制执行最佳实践。为管理员提供有限的基础设施访问权限以确保安全。\n\
  \n        **验证所有敏感数据**\n\n        应对所有敏感数据进行验证，并通过受限和隔离的环境检查访问权限。确保检查专用资源、网络隔离和服务依赖关系。\n\
  \n        **安全实施机器学习算法**\n\n        必须使用安全且受限的开发环境来实施机器学习算法。遵守公司所需的安全程序，以确保模型训练和容器托管的安全。\n\
  \n    *   **实施安全的节点间集群通信**\n\n        对于节点间集群通信，必须共享系数信息。共享数据必须在节点间保持同步，算法才能正常运行。在传输过程中，数据必须加密。其实施计划详述如下：\n\
  \n        **在 Amazon SageMaker 中启用节点间加密**\n\n        在分布式计算环境中，通过 SageMaker 在 Amazon\
  \ 中启用节点间加密，以自动指示通过横向广域网在节点间传输的数据。为确保训练任务的数据通过加密隧道发送，请加密容器间通信。\n\n        **在 Amazon\
  \ EMR 中启用传输中加密**\n\n        Hadoop 生态系统中有许多应用程序和执行引擎，提供了各种工具来满足您的机器学习和分析工作负载的需求。Amazon\
  \ EMR 具有分布式集群能力，也是运行数据处理、交互式分析和机器学习作业（针对存储在集群本地或 Amazon S3 中的数据）的一个选项。参见图 4-20。\n\
  \n*   前面的代码输出是包含检测到的 PII 实体的 JSON 响应对象。该服务为每个实体返回置信度分数指标、PII 类型和其他参数。\n\n以下是 Amazon\
  \ EMR 的主要功能：\n\n*   Amazon EMR 以不到本地系统一半的成本，更快地运行 PB 级数据分析和大数据应用。\n\n*   使用针对性能优化的开源、可互操作的\
  \ Spark、Hive 和 Presto 版本，获得高达两倍更快的洞察时间。\n\n*   它提供了许多快速简便的数据加密选项。\n\n```\naws emr\
  \ create-security-configuration --name \"MyS3EncryptionConfig\" --security-configuration\
  \ '{\n\"EncryptionConfiguration\": {\n\"EnableInTransitEncryption\": false,\n\"\
  EnableAtRestEncryption\": true,\n\"AtRestEncryptionConfiguration\": {\n\"S3EncryptionConfiguration\"\
  : {\n\"EncryptionMode\": \"SSE-S3\"\n}\n}\n}\n}'\n```\n\n*   以下示例演示了如何使用 Amazon\
  \ EMR 控制台创建安全配置。它展示了构成加密和配置的各种参数的参考。\n\n*   **实施防范数据投毒威胁**\n\n    污染训练数据集的数据投毒是对数据最常见的威胁，因此有必要防范数据注入和篡改。数据注入可能会添加损坏的训练数据，从而导致模型和输出不准确。数据篡改可能会更改数据中的标签或特征，从而导致预测模型不精确且薄弱。安全方法和异常检测算法可以识别损坏的数据和不准确的模型。确保安装的第三方包不包含危险的恶意软件或勒索软件，以保持数据集的不可变性。其实施计划详述如下：\n\
  \n    **仅使用可信数据源进行数据训练**\n\n    在训练之前，验证训练数据的质量，查找显著的异常值和可能错误的标签。必须定期进行审计控制，以保留对活动以及由谁、何时、何地进行了更改的审查。\n\
  \n    **寻找训练数据模式的潜在变化**\n\n    通过监控数据漂移来确定对预测方差的影响。这些偏差可以为针对训练数据的未授权访问以及潜在的数据漂移提供早期预警。\n\
  \n    **识别对结果产生负面影响的模型更新**\n\n    在将重新训练的模型发送到生产环境之前，检查其结果是否与之前的模型迭代不同，以及是否正在恶化。应将历史测试结果和模型迭代作为基线。\n\
  \n    **制定回滚计划**\n\n    始终准备好回滚计划，以防出现故障场景。遵循版本化的训练数据和版本化的模型，以便轻松回滚到已知的良好工作模型。\n\
  \n    **使用低熵分类案例**\n\n        寻找显著的、意外的、低熵的分类变化。留意大的、意外的发展。建立阈值边界，识别您不希望看到的分类，并在重新训练的模型超过这些边界时发出警报。\n\
  \n*   **模型部署**\n\n    在针对机器学习问题框架、数据处理和模型开发、评估和验证实施了所有安全措施之后，现在是时候将模型部署到生产环境并为其实施安全措施了。针对安全的模型和安全的部署环境进行预测和推理。模型部署下的最佳实践详述如下：\n\
  \    *   **实施防范对抗性和恶意活动**\n\n        在需要部署的代码内部和外部增强安全性，以识别可能导致不准确预测的恶意输入。通过仔细检查输入并在将其添加回池之前进行修复，自动检测非法修改。其实施计划详述如下：\n\
  \n        **评估算法的鲁棒性**\n\n        分析您的用例，识别不准确的分类或预测。为了确定算法对操纵输入的敏感程度，使用敏感性分析来评估方法对逐步改变的输入的鲁棒性。\n\
  \n        **从一开始就构建鲁棒性**\n\n        选择多种特征来增强算法对异常值的抵抗力。考虑使用集成模型来增强决策点周围的鲁棒性，并增加决策的多样性。\n\
  \n        **识别重复输入**\n\n        Amazon SageMaker Model Monitor 定期运行处理作业，分析推理数据，以检测对模型的重复输入，从而识别对决策边界的潜在威胁。这可以通过一种称为*模型暴力破解*的技术来完成，攻击者反复尝试少量变量，以查看哪些变量影响决策点并评估特征的重要性。\n\
  \n        **血缘追踪**\n\n        在重新训练替代模型之前，确保在任何模型偏差的情况下，都能追溯到数据，并且如果在不可信或未经验证的输入上重新训练，则进行修剪。我们在\
  \ AWS 的卓越运营部分详细讨论了血缘追踪。\n\n        **使用安全的推理 API 端点**\n\n        托管模型，以便模型消费者可以安全地使用它进行推理。允许用户监控模型交互，限制对底层模型的访问，并使用\
  \ API 建立关系。\n\n*   前面代码的功能是禁用传输中数据加密并启用静态数据加密。此外，它还禁用了本地磁盘加密，并使用“SSE-S3”加密模式激活了\
  \ Amazon S3 加密。\n\n![](img/609560_1_En_4_Fig21_HTML.jpg)\n\n图 4-21\n\nAmazon Macie\n\
  \n*   **模型监控**\n\n    模型监控系统确保持续监控和维护模型，以达到期望的性能水平。模型监控有助于早期检测安全威胁，并允许缓解这些威胁。模型监控下的最佳实践详述如下：\n\
  \    *   **限制对预期合法消费者的访问**\n\n        在部署的模型端点处，需要使用最小权限原则提供受限访问。通过安全的 API 向工作负载环境外部的消费者提供访问权限。其实施计划详述如下：\n\
  \n        **使用安全的推理 API 端点**\n\n        通过托管模型，为模型消费者提供安全的环境来对模型进行推理。允许用户建立关系，限制对底层模型的访问，并通过\
  \ API 提供模型交互监控。\n\n        **安全的推理端点**\n\n        通过仅允许授权人员对机器学习模型进行推理来保护推理点。确保在提供网络限制（例如机器人控制和限制对特定\
  \ IP 范围的访问）时遵循 AWS Well-Architected Framework 的指导。这些 API 调用的 HTTPS 请求应进行签名，以便可以验证请求者的身份，并保护传输中的请求数据。\n\
  \n    *   **监控与数据的人类交互以发现异常活动**\n\n        确保您监控与数据的人类交互。持续审计是否存在异常数据访问、来自异常位置的访问以及超过阈值限制的情况。需要维护数据访问和授权的日志。可以使用支持异常活动警报的各种工具，并将其与数据分类结合使用以评估风险。评估使用有助于监控数据访问事件的服务。其实施计划详述如下：\n\
  \n        **启用数据访问日志记录**\n\n        验证您是否已为任何人类 CRUD（创建、读取、更新和删除）操作启用了数据访问日志记录。此日志应包含谁访问了什么、何时、从何处以及他们采取了什么操作的信息。\n\
  \n        **对数据进行分类**\n\n        AWS 的完全托管数据安全解决方案 Amazon Macie 可保护并分类 Amazon S3\
  \ 中的训练和推理数据。它使用机器学习和模式匹配来自动发现、分类和保护 AWS 中的敏感数据。该服务能够识别敏感数据，包括知识产权和 PII。参见图 4-21。\n\
  \nAmazon Macie 具有以下功能：\n\n*   保护和分类敏感数据\n\n*   在 Amazon S3 中自动、持续且经济高效地大规模发现敏感数据\n\
  \n*   通过可操作的敏感数据报告（在 Amazon S3 中发现）减少分类时间\n\n*   提高对关键业务数据的可见性\n\n**监控与保护**\n\n\
  Amazon GuardDuty 结合了机器学习和来自 AWS 的集成威胁情报，用于监控您的 AWS 账户和工作负载上的恶意和未授权活动。这使得能够通过智能威胁检测来保护\
  \ AWS 账户、工作负载以及存储在 Amazon S3 中的数据，并提供可查看和修复的全面安全发现。参见图 4-22。\n\n![](img/609560_1_En_4_Fig22_HTML.jpg)\n\
  \n图 4-22\n\nAmazon GuardDuty\n\nAmazon GuardDuty 具有以下功能：\n\n*   在整个 Amazon 环境中密切关注潜在危险\n\
  \n*   使用异常检测、行为建模、机器学习（ML）以及来自 AWS 和信誉良好的第三方的威胁情报源来快速发现威胁\n\n*   准确识别危害并在其成为可能影响您业务的更严重问题之前迅速采取行动\n\
  \n*   对 AWS 计算云（Amazon EC2）工作负载、无服务器工作负载和容器工作负载提供端到端的可见性\n\n\n\n## 最终思考\n\n组织正在寻求一个完整的\
  \ MLOps 解决方案，以实现端到端安全的机器学习系统。通过整合 MLSecOps 的五大基本支柱并遵循机器学习安全最佳实践，组织可以防范数据投毒、快速注入攻击、机器学习对抗性攻击、模型反转攻击等安全威胁。随着机器学习安全性的发展，持续的监控和预防措施对于大规模安全机器学习变得愈发重要，以加速组织的增长和收入产出。\n\
  \n"
- "# 5. MLOps 中的 AI/ML 可靠性\n\n可靠性是 MLOps 的第三大支柱。在前面的章节中，我们讨论了 MLOps 中的运营卓越性和安全性。\n\
  \n在本章中，我们将详细讨论 MLOps 中的可靠性、其原则以及可靠性的重要性。我们将涵盖可靠性的三大支柱以及为实现可靠的 MLOps 系统需要实施的最佳实践。我们还将通过代码片段展示它们在\
  \ AWS 中的实现，以供参考。\n\n![](img/609560_1_En_5_Figa_HTML.jpg)\n\n## MLOps 可靠性简介\n\nMLOps\
  \ 中的可靠性是机器学习架构中最佳、最高效、最具弹性的支柱，有助于识别改进领域。它确保在预期情况下，工作负载能够准确、一致且高质量地执行。它涵盖了工作负载在基础设施或服务出现干扰后恢复运行的能力。MLOps\
  \ 工程师实施各种实践，以增强整个机器学习运营生命周期（从数据管道到模型开发再到部署）的可靠性。机器学习系统的可靠性保证了它在正常和未知情况下都能按计划运行。\n\
  \nMLOps 可靠性关乎可用性、弹性和灾难恢复。它涵盖了系统在其整个生命周期内的功能和工作负载测试。在传统的本地部署环境中，由于存在单点故障、自动化程度低和弹性不足，实现可靠性非常困难。可靠性使得工作负载能够按需可用。它还能动态地为系统增加处理能力以匹配需求，并减少因设置错误和临时网络问题造成的中断。\n\
  \n## MLOps 可靠性原则\n\n![](img/609560_1_En_5_Figb_HTML.jpg)\n\n以下是 MLOps 可靠性所基于的四个原则：\n\
  \n*   **坚实基础**\n\n在架构任何可靠的机器学习系统之前，必须有一个坚实的基础。\n\n坚实的基础基础需求并不局限于单个工作负载或项目。一个坚实的基础可以在各种工作负载和项目中实施和使用。\n\
  \n以下是该支柱的关注点：\n    *   **服务配额与约束管理**\n\n在设计规划时，应考虑服务配额和集成服务的约束。配额管理可以防止服务滥用，并有助于避免无意中分配超出所需的资源。规划时应留有足够的空间，以便根据预期的负载请求增长进行扩展。\n\
  \n*   **网络拓扑规划**\n\n工作负载通常存在于多个云环境中，因此有必要设计你的网络拓扑。网络规划对于确保网络的高可用性、冗余性和可扩展性是必要的。这包括考虑系统内部和系统间的连接性、公有和私有\
  \ IP 地址管理以及域名解析等因素。它应该能够应对潜在的故障，并适应未来的增长以及与其他系统及其网络的集成。\n\n*   **弹性工作负载架构**\n\n\
  在跨多个业务领域创建设计服务时，MLOps 工作负载的架构必须具有弹性。软件和基础设施的工作负载设计决策都需要健壮可靠。它应该包含诸如超时、限流、重试、队列管理和紧急控制杆等功能以防止故障。为了更快地扩展和创新，使用持续改进的方法将你的系统分解为分布式服务。\n\
  \n以下是本节的重点：\n    *   **工作负载服务架构设计**\n\n高度可扩展、可靠且具有弹性的工作负载架构是使用面向服务的架构（SOA）或微服务架构设计的。面向服务的架构是通过服务接口使软件组件可重用的实践。SOA\
  \ 接口使用通用的通信标准，允许它们快速集成到新的工作负载中。\n\n微服务架构更进一步，使组件更小、更简单。它们使你能够区分不同服务所需的可用性级别，从而允许你更精确地将投资集中在需要最高可用性级别的微服务上。\n\
  \n*   **交互式分布式系统设计以防止故障**\n\n分布式系统使用通信网络来连接其众多组件，包括服务器和服务。在这些网络中，数据丢失或延迟不得影响工作负载的可靠性。分布式系统的组件协同工作，而不会相互干扰或影响任务。这些实践增加了平均故障间隔时间并防止了故障。\n\
  \n*   **一致的变更管理**\n\n为了实现可靠的工作负载运行，工作负载或其环境的任何变更都必须在整个 MLOps 生命周期中保持一致。这些变更可能与功能部署、安全补丁或任何按需或业务相关的变更有关。\n\
  \n以下是该支柱的关注点：\n    *   **工作负载资源监控**\n\n对各种工作负载资源进行持续监控日志和指标，对于深入了解工作负载的健康状况非常重要。可以配置监控日志和指标，并在超过阈值或发生重大事件时发送警报。监控对于检测故障并自动从中恢复至关重要。\n\
  \n*   **工作负载设计以适应按需变化**\n\n\n\n可靠且可扩展的工作负载能够灵活地根据需要添加、修改或移除资源，以适应任何特定时间点的需求变化。这使得工作负载架构能够可靠地高效处理持续的变化。\n\
  \n*   **变更实施**\n\n在成功运行的操作系统、系统工作负载和已修补的软件上部署新功能，需要进行受控的变更。预测这些变更的影响，以及处理因变更失控而产生的问题，是具有挑战性的。\n\
  \n*   **故障恢复管理**\n\n尽管我们已采取所有措施，MLOps 系统仍存在可能影响工作负载的低级和高级故障。因此，为了构建可靠的工作负载，必须采取一些措施来实现一个可从故障中恢复的弹性\
  \ ML 系统。\n\n以下是本支柱的关注点：\n    *   **数据备份**\n\n数据备份以及应用程序和配置备份对于故障恢复管理至关重要。\n\n* \
  \  **为处理组件故障而设计工作负载**\n\n工作负载必须设计为能够承受组件故障，并具有较低的恢复时间，同时应能满足高可用性需求。\n\n*   **可靠性测试**\n\
  \n对于实时部署环境，确保针对可靠性进行工作负载弹性测试至关重要。可靠性测试是确保工作负载按照功能性和非功能性需求进行设计、运行并提供弹性的方法。\n\n* \
  \  **灾难恢复 (DR) 规划**\n\n灾难恢复规划至关重要，需要提前采取行动。备份您的数据和工作负载资源，并预先安排完成任何冗余任务。灾难恢复侧重于时间恢复，并根据业务价值控制恢复成本。\n\
  \n## MLOps 中可靠性的重要性\n\n在当今现代，机器学习运维 (MLOps) 是机器学习的一个关键方面。MLOps 涉及在生产环境中开发、部署、管理和监控机器学习模型。每个\
  \ MLOps 系统都需要实现一个可靠的机器学习系统。在本文中，我们将讨论可靠性在 MLOps 中的重要性。\n\n*   **持续改进**\n\n    实现可靠的\
  \ ML 系统可以构建弹性的工作负载架构，并使灾难恢复成为可能。它为 MLOps 的持续改进奠定了基础。组织可以通过分析历史数据、趋势和模式，并将其转化为机器学习模型的长期性能，来获得宝贵的见解。这些信息可以指导模型重新训练、特征工程和整体系统增强，以持续提高准确性、效率和鲁棒性。\n\
  \n*   **早期故障检测与调试**\n\n    需要持续监控来检测异常活动。通过主动的系统监控，可以在早期阶段检测到故障。如果发生恶意活动，工程师会领导事件响应行动，以减轻影响、缓解问题并防止其再次发生。\n\
  \n    为了实现可靠系统的功能，需要采取主动的方法来预测挑战、解决问题并在瓶颈影响系统之前识别它们。主动监控和调试问题，而不是被动应对，对于确保问题的早期发现至关重要，从而能够实现快速、可靠且高效的解决。\n\
  \n*   **性能优化**\n\n    可靠的机器学习系统通过分析日志、数据、输出和配置参数，为 ML 模型的性能提供宝贵的见解。深入分析有助于识别系统瓶颈并为其提供解决方案。使用最佳配置优化资源利用率可以提高模型的速度和整体效率。这种性能优化对于达成服务级别协议\
  \ (SLA) 并保证无缝、可靠且响应迅速的用户体验至关重要。\n\n*   **运营弹性**\n\n    MLOps 系统中的可靠性通过监控关键性能配置、高效资源使用以及维护相关信息日志，有助于提高机器学习模型的运营弹性。在主动异常检测和服务中断预防方面，运营弹性有助于即使在不断变化的环境条件或数据模式下也能保持高系统正常运行时间。\n\
  \n*   **系统健康保障**\n\n    一个可靠的 MLOps 系统的最终责任是保障整个机器学习运维生态系统的健康。通过高效管理工作负载资源、规划灾难恢复以及实时排查问题，一个可靠的\
  \ MLOps 系统有助于数据管道、模型和底层基础设施的稳定性、可扩展性和效率。\n\n## MLOps 可靠性的 CAP 定理\n\n我们可以通过理解在分布式\
  \ ML 系统中平衡一致性、可用性和分区容错性的 CAP 定理，来设计一个可靠的 MLOps 系统。\n\nMLOps 系统必须在分布式节点和集群之间维护模型一致性和模型可用性。尽管模型部署在多个环境或区域，MLOps\
  \ 系统也需要确保良好的模型性能。通过在 MLOps 系统中实施 CAP 定理的组件，可以实现高性能且可靠的 MLOps 系统。\n\n在 MLOps 中，为了可靠性，CAP\
  \ 定理需要遵循三个组件：\n\n1.  强一致性\n\n2.  高可用性\n\n3.  分区容错性\n\n## MLOps 可靠性的支柱\n\n![](img/609560_1_En_5_Figc_HTML.jpg)\n\
  \nMLOps 可靠性有三个支柱。\n\n1.  **可用性**\n\n    可用性，也称为*服务可用性*，是指工作负载可供使用并成功执行其约定功能的时间百分比。可用性计算为使用时间可用性占总时间（例如一个月或一年）的百分比。在计划内和计划外的中断中，如果应用程序运行不正常，可用性都会降低。可用性定义如下：\n\
  \n![](img/609560_1_En_5_Figd_HTML.jpg)\n\n1.  **弹性**\n\n    一般而言，弹性是指从意外事故或变化中恢复的能力。在\
  \ MLOps 中，弹性意味着工作负载能够通过动态获取计算资源，从基础设施或服务中断（如配置错误、组件故障、软件错误或网络问题）中恢复。\n\n    在 MLOps\
  \ 中，需要一种弹性策略来监控工作负载资源，并考虑所有业务和技术指标要素，例如通知、自动化、分析等。借助弹性，MLOps 可以生成可扩展、敏捷、健壮且可靠的 ML\
  \ 生产模型。\n\n2.  **灾难恢复 (DR)**\n\n    可靠 MLOps 系统的最后一个支柱是灾难恢复策略，用于在发生灾难事件时恢复工作负载。灾难恢复是应对一次性事件（如自然灾害、重大技术故障或人为危害（如错误或攻击））的过程。\n\
  \n    灾难恢复与可用性不同，可用性计算的是随时间推移处理软件问题、负载峰值和组件故障的平均弹性。它基于在灾难事件（如自然灾害、重大技术故障或人为威胁）中恢复工作负载的策略。\n\
  \n\n\n## 确保机器学习系统可靠性的最佳实践\n\n![](img/609560_1_En_5_Fige_HTML.jpg)\n\n为确保完整的机器学习/人工智能系统的可靠性，需要实施七项最佳实践。\n\
  \n1.  **数据管理自动化**\n\n在 MLOps 生命周期中，数据会以多种方式被管理、处理和转换，以便为机器学习建模做好准备。所有与数据相关的管理都需要自动化，以使系统快速且可靠。\n\
  \n以下是数据管理自动化的关键特性：\n    *   自动化数据管道\n\n*   自动检查数据模式是否存在概念漂移\n\n*   自动化输入数据处理，将其转换为所需格式\n\
  \n*   自动化输入数据转换\n\n*   特征管道自动化\n\n2.  **具备可追溯性的 CI/CD 自动化**\n\n具备可追溯性的 CI/CD 管道自动化可确保可靠部署。管道的自动化\
  \ CI/CD 包括构建、测试和验证数据、模型以及机器学习管道组件的任务，并将模型制品部署到生产环境。\n\n以下是具备可追溯性的 CI/CD 管道自动化的关键点：\n\
  \    *   自动化模型训练管道及所有步骤的追踪\n\n*   在部署机器学习模型及相关制品之前运行自动化测试\n\n*   自动维护的集中式模型仓库\n\n\
  *   机器学习模型的自动化测试与部署\n\n*   模型上线前的自动测试\n\n*   缩短开发周期时间\n\n3.  **特征一致性**\n\n需要保持特征一致性以达到期望的模型输出。如果模型在训练和服务时的输入特征不同，会导致训练/服务偏差。为避免特征偏差，需要持续追踪特征的一致性。\n\
  \n以下是特征一致性的关键特性：\n    *   在训练和推理时检查输入特征。\n\n*   维护训练和服务特征值的日志。\n\n*   对于同一特征，其值在训练和服务过程中应保持一致。\n\
  \n*   检查特征是否存在偏差值。\n\n4.  **模型验证**\n\n在部署任何机器学习模型之前，需要进行模型验证。这能确保模型在未知数据上具有良好的性能。\n\
  \n以下是模型验证的关键特性：\n    *   通过模型管道自动化进行模型验证。\n\n*   测试数据需要独立于训练数据和验证数据。\n\n*   验证模型在偏差、方差、包容性和公平性方面的性能。\n\
  \n*   在部署前验证模型以进行错误检测。\n\n5.  **数据偏差检测与缓解**\n\n持续检查数据偏差以避免数据漂移。在检测和缓解数据偏差时，达到期望的模型输出至关重要。\n\
  \n以下是数据偏差检测与缓解的关键特性：\n    *   对机器学习模型性能进行偏差、方差和公平性测试。\n\n*   模型应力求将偏差降至接近零。\n\n\
  *   数据和机器学习模型的每一次变更都应被追踪。\n\n*   在数据收集阶段使用不同策略缓解数据偏差。\n\n6.  **部署与测试策略**\n\n模型开发完成后，需要执行其部署和测试策略，以便用户能够利用机器学习模型带来的优势。\n\
  \n以下是部署与测试策略的关键特性：\n    *   对关键基础设施进行持续测试。\n\n*   检查系统行为是否存在偏差。\n\n*   检查数据、代码和机器学习模型的稳定性。\n\
  \n*   测试机器学习算法的决策是否符合业务目标。\n\n*   使用 CI/CD 自动化管道在生产环境中快速、可靠地部署模型。\n\n*   应测试完整机器学习管道的集成。\n\
  \n7.  **版本控制管理**\n\n版本控制管理对于追踪数据、代码和机器学习模型的版本至关重要。版本控制有助于追踪数据、代码和模型，还能通过快速回滚到先前版本来复现相同的结果。\n\
  \n以下是版本控制管理的关键特性：\n    *   追踪数据元数据、数据集和特征的不同版本。\n\n*   即使是超参数或配置的微小变化也会被追踪。\n\n\
  *   能够基于先前的特征集轻松满足客户需求。\n\n*   所有涉及机器学习模型的实验都可以被轻松追踪。\n\n## 如何在 AWS 中实现可靠性\n\n![](img/609560_1_En_5_Figf_HTML.jpg)\n\
  \n可靠性是 AWS 良好架构框架的第三个关键支柱。对于每个组织来说，可靠性对于运行一个一致且可靠的系统至关重要。在整个机器学习生命周期中，可靠性支柱保证工作负载能够按预期准确、可靠地执行，实现其预期目的。\n\
  \n实现准确执行有五个可靠性设计原则：自动故障恢复、恢复流程测试、水平扩展以提高聚合工作负载可用性、容量管理以及自动化变更管理。\n\n本节将讨论在 AWS 中实施可靠性支柱所需遵循的最佳实践。\n\
  \n\n\n## 按机器学习生命周期阶段划分的可靠性最佳实践\n\n机器学习生命周期包含六个阶段。AWS 的所有可靠性最佳实践都分布在这些阶段中。让我们详细讨论每个最佳实践。\n\
  \n1.  **业务目标识别**\n\n业务目标识别是机器学习生命周期的第一个阶段。在识别业务目标期间，没有需要遵循的可靠性最佳实践。可靠性最佳实践从生命周期的机器学习问题定义阶段开始。\n\
  \n2.  **机器学习问题定义**\n\n在机器学习生命周期的这个阶段，需要定义机器学习问题。在此阶段，需要决定必须观察哪些数据、如何描述目标变量以及需要预测什么。在此阶段定义性能指标，以优化机器学习模型的性能。\n\
  \n机器学习问题定义下的可靠性最佳实践详述如下：\n    1.  **实施 API 以跟踪来自模型消费应用的变更**\n\n需要跟踪因模型消费而在应用中引入的变更。这些变更通过灵活的\
  \ API 进行跟踪。主要目标是在对现有工作负载能力造成最小或零中断的情况下引入模型。这种灵活的 API 设计有助于最大限度地减少所有下游机器学习应用的变更。其实施计划详述如下：\n\
  \n**采用 API 最佳实践**\n\n为了在不干扰上游交互的情况下引入模型变更，请通过 API 公开您的机器学习端点。确保调用服务能够快速理解您 API 的路由和标志。有必要在公共存储库或文档网站中记录您的\
  \ API 服务。确保在有任何调用服务或您对 API 进行任何更改时，都应通知相关方。\n\n**在 Amazon SageMaker 中部署模型**\n\n\
  Amazon SageMaker 是一个低成本的、完全托管的基础设施，包含工具（面向数据科学家的 IDE 和面向业务分析师的无代码界面），以及经过训练的机器学习\
  \ (ML) 模型的自动化部署，以获得准确的预测。它还在整个机器学习生命周期中整合人工反馈，以达到高性能的机器学习系统。\n\nAmazon SageMaker\
  \ 提供的功能如下：\n        *   SageMaker 托管服务，用于为持久的实时端点一次获取一个预测\n\n*   SageMaker 批量转换，用于获取整个数据集的预测\n\
  \n*   适用于具有冷启动工作负载的无服务器推理\n\n*   在实施机器学习模型时用于资源管理和推理性能优化的工具\n\n**使用 Amazon API Gateway\
  \ 创建 API**\n\nAmazon API Gateway 是一项完全托管的 AWS 服务，用于在任何规模下构建、发布、维护、监控和保护 API。可以使用\
  \ API Gateway 创建 RESTful API 和允许实时双向通信应用的 WebSocket API。API Gateway 支持所有类型的 Web\
  \ 应用以及容器化和无服务器工作负载。\n\n图 5-1 展示了 API Gateway 架构，显示了通过 Amazon API Gateway 构建的 API，它为开发人员提供了构建\
  \ AWS 无服务器应用程序的集成且一致的开发体验。\n\n![](img/609560_1_En_5_Fig1_HTML.jpg)\n\n图 5-1\n\n\
  Amazon API Gateway 架构\n\nAmazon API Gateway 提供的功能如下：\n        *   高效的 API 开发，因为它允许快速测试、迭代和版本发布\n\
  \n*   在任何规模下都具有高性能\n\n*   高成本优化\n\n*   简便的监控服务\n\n*   灵活的安全控制\n\n以下 Python 代码示例演示了如何使用适用于\
  \ Python 的 AWS SDK 和 API Gateway 部署 API：\n\n```\n        class ApiGatewayToService:\n\
  \        def __init__(self, apig_client):\n        self.apig_client = apig_client\n\
  \        self.api_id = None\n        self.root_id = None\n        self.stage = None\n\
  \        def deploy_api(self, stage_name):\n        try:\n        self.apig_client.create_deployment(\n\
  \        restApiId=self.api_id, stageName=stage_name\n        )\n        self.stage\
  \ = stage_name\n        logger.info(\"Deployed stage %s.\", stage_name)\n      \
  \  except ClientError:\n        logger.exception(\"Couldn't deploy stage %s.\",\
  \ stage_name)\n        raise\n        else:\n        return self.api_url()\n   \
  \     ```\n\n此代码初始化一个 API Gateway 客户端，该客户端部署一个 REST API，可以从任何 REST 客户端（例如 Python\
  \ Requests 包或 Postman）调用该 API。它接受参数 `stage_name` 作为输入，并返回已部署 REST API 的基 URL。\n\n\
  1.  **数据处理**\n\n数据处理是机器学习生命周期的第三个阶段，位于模型开发之前。需要处理数据以使其为模型开发做好准备。它包含多个步骤，例如数据收集、数据准备、数据清洗、缺失数据插补、数据缩放和特征工程。可靠性支柱下的数据处理阶段包含两个最佳实践，详述如下：\n\
  \    1.  **实施数据目录使用**\n\n数据目录是基于 Amazon S3 构建的数据湖的关键组件，用于在数据湖 S3 存储桶中发现、准备、移动、集成和处理跨多个数据源的数据。它支持将\
  \ ETL 流程与数据跟踪和版本管理集成，从而提供更高的可靠性和效率。其实施计划详述如下：\n\n**使用 AWS Glue 数据目录**\n\nAWS Glue\
  \ 数据目录用于跟踪已添加到机器学习任务中的数据资产。此外，数据目录描述了数据在输入到数据仓库和数据湖时所进行的转换。提取、转换、加载 (ETL) 服务完全由\
  \ AWS Glue 管理。它使您能够轻松且经济高效地组织数据、清理数据、丰富数据，并在不同的数据源和存储库之间可靠地传输数据。\n\n图 5-4 展示了 AWS\
  \ Glue 数据目录的构建，它是一个数据库，以表的形式存储元数据，包括数据模式、数据位置和运行时指标。\n\n![](img/609560_1_En_5_Fig4_HTML.jpg)\n\
  \n图 5-4\n\nAWS Glue 数据目录\n\n1.  **为机器学习实施微服务策略**\n\n有时，需要将一个大型复杂的业务问题分解为多个具有松散耦合实现的小问题。这可以通过为机器学习模型实施微服务策略而不是单体架构来实现。这种方法有助于分散开发、增强可扩展性、简化变更管理，并减少单个故障对整个工作负载的影响。其实施计划详述如下：\n\
  \n**采用微服务策略**\n\n为了采用微服务策略，需要实施面向服务的架构 (SOA)，其中应用程序被分解为独立的组件。这些组件通过 API 良好连接，并且可以根据使用情况运行，这与将所有功能包含在单个运行时中的单体应用程序不同。参见图\
  \ 5-2。\n\n![](img/609560_1_En_5_Fig2_HTML.jpg)\n\n图 5-2\n\n将单体应用拆分为微服务\n\n\n\n在单体架构中，所有应用程序操作都作为一个单一服务运行，因为它们紧密耦合为一个整体。而在微服务架构中，每个服务都被构建为独立的组件，每个进程独立运行。这些独立服务之间通过轻量级\
  \ API 进行通信。每个服务都可以根据应用程序特定功能的需求进行更新、启动和扩展，无需像单体架构那样扩展整个应用程序。\n\n**使用 AWS 服务开发微服务**\n\
  \nAWS 提供了两种用于开发机器学习微服务的服务。\n    1.  **AWS Lambda**\n\n借助 AWS Lambda，应用程序几乎可以在无需担心服务器或集群的情况下运行。这是一项非常经济高效的服务，因为开发者只需为消耗的计算时间付费。\n\
  \nAWS Lambda 的主要特性如下：\n        *   它是一种经济高效的无服务器计算服务。\n\n*   它能自动大规模快速处理数据和工作流。\n\
  \n*   无需任何基础设施管理和配置即可轻松运行代码。\n\n*   可以通过 AWS Lambda 优化性能和代码执行时间。\n\n以下 Python 代码示例演示了如何使用\
  \ Python 中包含的 AWS SDK 创建 Lambda 函数：\n\n```\n        import boto3\n        import\
  \ botocore\n        def lambda_handler(event, context):\n        print(f'boto3 version:\
  \ {boto3.__version__}')\n        print(f'botocore version: {botocore.__version__}')\n\
  \        ```\n\n上述 Python 代码创建了一个 AWS Lambda，它在包含 Python SDK (Boto3) 的环境中运行，以提供处理事件的运行时。\n\
  \n2.  **AWS Fargate**\n\nAWS Fargate 是一种无服务器容器管理服务，无需配置、扩展虚拟机集群即可运行这些容器。AWS Fargate\
  \ 完全专注于构建应用程序并加速其投入生产的过程。\n\n图 5-3 展示了 AWS Fargate 架构，其中包含一个定义了运行和管理应用程序所需内存及计算资源的镜像。\n\
  \n![](img/609560_1_En_5_Fig3_HTML.jpg)\n\n图 5-3\n\nAWS Fargate 架构\n\nAWS Fargate\
  \ 的主要特性如下：\n        *   它部署和管理的是您的应用程序，而非基础设施。\n\n*   它监控您的应用程序以获取洞察。\n\n*   它通过设计上的工作负载隔离来提高安全性。\n\
  \n*   它通过消除运维开销来优化成本。\n\nAWS Glue Data Catalog 的主要特性如下：\n\n![](img/609560_1_En_5_Fig5_HTML.jpg)\n\
  \n图 5-5\n\nAmazon SageMaker Data Wrangler 架构\n\n1.  **实施数据管道用法**\n\n数据管道用于自动化不同计算和存储服务之间的数据处理、移动、转换、集成和交付过程。因此，数据处理具有高可用性、可重复性和容错性。其实现方案详述如下：\n\
  \n**使用 Amazon SageMaker Data Wrangler 和 Pipelines**\n\n实施自动化数据管道以自动化数据处理和部署需遵循两个步骤。\n\
  \    1.  **Amazon SageMaker Data Wrangler**\n\nSageMaker Data Wrangler 是在将数据导出到\
  \ SageMaker Pipelines 之前，进行数据选择、清洗、处理、探索和可视化的最简单直接的方法。它能够通过可视化界面和自然语言界面扩展到处理 PB\
  \ 级数据。\n\n图 5-5 展示了 Amazon SageMaker Data Wrangler 架构，该架构以可视化方式聚合和准备用于机器学习的数据。\n\
  \n*   自动发现数据并组织数据以构建数据湖。\n\n*   自动提取、转换、准备、清洗和加载数据以进行分析。\n\n*   通过简单的作业调度构建复杂的 ETL\
  \ 管道。\n\n*   自动构建和扩展数据管道并监控作业。\n\nSageMaker Data Wrangler 的关键特性如下：\n\n\n\n1.  **模型开发**\n\
  \n数据处理之后进入模型开发阶段，在此阶段构建、训练、微调并评估模型。在模型开发中，所有模型构建、训练以及发布到预发布和生产环境的过程均通过 CI/CD 流水线实现自动化。模型开发下的可靠性最佳实践详述如下：\n\
  \    1.  **实施具有可追溯性的 CI/CD/CT 自动化**\n\n模型开发中实现可靠性的第一个最佳实践是实施具有可追溯性的 CI/CD/CT 自动化，并将其与机器学习工作负载操作相关联。它提供了对机器学习工作负载的源代码、数据和工件的版本控制。这使得回滚到特定版本变得容易。其实施计划详述如下：\n\
  \n**使用 Amazon SageMaker Pipelines**\n\nAmazon SageMaker Pipelines 是首个专为机器学习工作流构建的服务。它包括持续集成（CI）、持续交付（CD）和持续训练（CT）服务，有助于大规模创建、自动化和管理端到端的机器学习工作流。自动化的\
  \ SageMaker Pipelines 在成本和时间上进行了优化，并通过在发生故障时回滚到所需版本来提供可重复性。\n\n2.  **实施训练与推理之间的特征一致性**\n\
  \n对于模型开发，需要在训练和推理之间拥有可扩展、一致且高可用的特征。这可以通过使用 Amazon SageMaker 特征存储来实现，该存储有助于通过保持训练和推理之间特征的一致性来减少训练-服务偏差。其实施计划详述如下：\n\
  \n**使用 Amazon SageMaker Feature Store**\n\nAmazon SageMaker Feature Store 用于创建、共享和管理机器学习开发的特征。它是一个集中式存储库，存储用于训练和推理的特征及其相关元数据，以便特征易于发现。特征存储的主要特点如下：\n\
  \        *   在线特征存储用于低延迟、实时推理场景。\n\n*   离线特征存储用于训练和批量推理。\n\n*   减少重复的数据处理工作。\n\n\
  *   减少训练-服务偏差。\n\n*   提供特征存储、特征一致性、特征复用、特征目录和特征标准化功能。\n\n*   与支持 MLOps 实践并加快模型部署速度的\
  \ Amazon SageMaker Pipelines 集成。\n\n3.  **实施模型验证保障**\n\n在模型开发阶段，还需要使用相关数据对模型进行验证和保障。用于验证的数据必须是真实且具有代表性的。数据需要包含模型投入生产后可能导致失败的所有可能场景和模式。始终检查推理数据以及训练、验证和测试数据是否存在分布差异。其实施计划详述如下：\n\
  \n**使用 Amazon SageMaker Experiments**\n\nAmazon SageMaker Experiments 用于组织、跟踪、比较和评估机器学习实验。它有助于使用模型在生产中可能遇到的所有模式的数据，对基础模型进行高效的实验、测试和验证。此阶段用于验证的数据包括真实数据和工程数据，以避免模型部署到生产环境时出现错误和故障。使用\
  \ Amazon SageMaker Experiments，模型可以无缝地从实验阶段过渡到生产阶段而不会出现故障。\n\n**使用 Amazon SageMaker\
  \ Model Monitor**\n\nAmazon SageMaker Model Monitor 用于定期测试和监控端点，以发现模型性能的任何偏差。它还监控生产环境中机器学习模型的质量。使用\
  \ Amazon SageMaker Model Monitor：\n        *   易于在早期阶段检测偏差，并相应采取纠正措施。\n\n*   在模型质量出现偏差时发出警报。\n\
  \n*   通过实时端点和批量转换作业定期运行进行持续监控。\n\n*   对异步批量转换作业进行按计划监控。\n\n4.  **实施数据偏差检测与缓解**\n\
  \n数据偏差检测与缓解对于避免不准确的模型结果至关重要。必须在模型训练之前很久的数据准备阶段就建立数据偏差检测方法。一旦模型投入生产，就要持续监控、检测和缓解偏差。创建反馈循环以监控随时间推移的漂移，并启动重新训练过程。其实施计划详述如下：\n\
  \n**使用 Amazon SageMaker Clarify**\n\nAmazon SageMaker Clarify 检测潜在偏差以改进机器学习模型，并解释这些模型如何进行预测。SageMaker\
  \ Clarify 提供的公平性和可解释性功能使您能够构建可信且可理解的 ML 模型。Amazon SageMaker Clarify 有助于完成以下任务：\n\
  \        *   在几分钟内评估基础模型并评估模型预测。\n\n*   评估机器学习生命周期每个阶段可能出现的偏差。数据收集、模型训练、模型调优和模型监控是其中的一些阶段。\n\
  \n*   生成针对潜在风险、合规条款和外部监管机构的模型治理报告。\n\n2.  **模型部署**\n\n一旦模型经过训练、调优、评估和验证，就可以部署到生产环境中。之后，可以针对模型进行结论、预测、预报和推理。模型部署下的可靠性最佳实践详述如下：\n\
  \    1.  **通过自动化流水线实施端点变更**\n\n端点变更可以通过自动化流水线实施，因为手动变更容易出错，且成本和精力高昂。自动化流水线与变更管理跟踪系统集成，以将变更部署到您的模型端点。正如我们之前讨论的，版本化的流水线工件和输入让您可以跟踪修改，并在它们不起作用时立即回滚。其实施计划详述如下：\n\
  \n**使用 Amazon SageMaker Pipelines**\n\nAmazon SageMaker Pipelines 允许您通过易于构建、用户友好的持续集成和持续交付（CI/CD）服务，大规模设计、自动化和监督端到端的机器学习过程。通过\
  \ SageMaker Pipelines 部署变更是一种安全的工程方法，具有一致的 MLOps 流程自动化。\n\n2.  **实施适当的部署与测试策略**\n\
  \n实施适当的部署与测试策略至关重要。必须根据业务需求选择部署和测试策略。\n\n使用性能指标来评估模型性能，以确定何时需要回滚或向前滚动。在为每个模型设计回滚或向前滚动时，请考虑以下因素：\n\
  \        *   模型工件存储在哪里？\n\n*   模型工件是否进行了版本控制？\n\n*   每个版本包含哪些变更？\n\n*   对于已部署的端点，部署的是哪个模型版本？\n\
  \n其实施计划详述如下：\n\n**在 Amazon SageMaker 中进行部署/测试**\n\nAmazon SageMaker 提供了两种选项，用于在生产环境和真实场景中测试和部署更新后的模型。\n\
  \        1.  **使用 Amazon SageMaker 进行蓝/绿部署**\n\n当更新 SageMaker 实时端点时，Amazon SageMaker\
  \ 会自动采用蓝/绿部署，以最大限度地提高端点的可用性。SageMaker 中蓝/绿部署的主要特点如下：\n            *   流量转移模式，可更精细地控制蓝绿集群之间的流量转移。\n\
  \n*   烘焙期是一段预设的时间，用于在进入下一个部署阶段之前监控绿色集群。\n\n\n\n*   自动回滚会启动至蓝色舰队，以维持可用性，从而将风险降至最低。\n\
  \n2.  **使用 Amazon SageMaker 进行金丝雀部署**\n\nAmazon SageMaker 提供金丝雀部署选项，允许您将一小部分流量（金丝雀）转移到绿色舰队，并在一个烘焙期内对其进行监控。如果绿色舰队上的金丝雀部署成功，则剩余流量会从蓝色舰队转移到绿色舰队，随后蓝色舰队停止运行。\n\
  \n以下部分是一个 Python 代码示例，演示如何使用名为 `UpdateEndpoint` 的 API 通过金丝雀流量转移来更新端点。\n\n```\n \
  \           import boto3\n            client = boto3.client(\"sagemaker\")\n   \
  \         response = client.update_endpoint(\n            EndpointName=\"\",\n \
  \           EndpointConfigName=\"\",\n            DeploymentConfig={\n         \
  \   \"BlueGreenUpdatePolicy\": {\n            \"TrafficRoutingConfiguration\": {\n\
  \            \"Type\": \"CANARY\",\n            \"CanarySize\": {\n            \"\
  Type\": \"CAPACITY_PERCENT\",\n            \"Value\": 30\n            },\n     \
  \       \"WaitIntervalInSeconds\": 600\n            },\n            \"TerminationWaitInSeconds\"\
  : 600,\n            \"MaximumExecutionTimeoutInSeconds\": 1800\n            },\n\
  \            \"AutoRollbackConfiguration\": {\n            \"Alarms\": [\n     \
  \       {\n            \"AlarmName\": \"\"\n            }\n            ]\n     \
  \       }\n            }\n            )\n            ```\n\n在更新端点时，您无需在此处提供 `DeploymentConfig`，而是可以使用\
  \ `RetainDeploymentConfig` 选项来保留创建端点时指定的部署配置。将 `RetainDeploymentConfig` 设置为 `True`\
  \ 以保留原始端点部署配置。\n\n**使用 Amazon SageMaker 进行线性部署**\n\n您可以通过线性流量转移，逐步将流量从旧舰队（蓝色舰队）转移到新舰队（绿色舰队）。通过使用多个步骤来转移流量，线性流量转移降低了端点中断的可能性。使用此蓝/绿部署选项，您可以对流量转移进行最精确的控制。\n\
  \n以下 Python 代码示例演示了如何使用名为 `UpdateEndpoint` 的 API 通过线性流量转移来更新端点：\n\nimport boto3\n\
  \nclient = boto3.client(\"sagemaker\")\n\nresponse = client.update_endpoint(\n\n\
  EndpointName=\"<your-endpoint-name>\",\n\nEndpointConfigName=\"<your-config-name>\"\
  ,\n\nDeploymentConfig={\n\n\"BlueGreenUpdatePolicy\": {\n\n\"TrafficRoutingConfiguration\"\
  : {\n\n\"Type\": \"LINEAR\",\n\n\"CanarySize\": {\n\n\"Type\": \"CAPACITY_PERCENT\"\
  ,\n\n\"Value\": 30\n\n},\n\n\"WaitIntervalInSeconds\": 600\n\n},\n\n\"TerminationWaitInSeconds\"\
  : 600,\n\n\"MaximumExecutionTimeoutInSeconds\": 1800\n\n},\n\n\"AutoRollbackConfiguration\"\
  : {\n\n\"Alarms\": [\n\n{\n\n\"AlarmName\": \"<your-cw-alarm>\"\n\n}\n\n]\n\n}\n\
  \n}\n\n)\n\n将 `RetainDeploymentConfig` 设置为 `True` 以在更新时保留原始端点设置。\n\n**使用 Amazon\
  \ SageMaker 进行 A/B 测试**\n\n新模型验证过程中一个有用的最后步骤是，在生产流量下对新模型和旧模型进行 A/B 测试。A/B 测试需要评估模型的多个版本，并比较每个迭代版本的性能表现。如果较新版本的模型性能优于旧版本，则应在生产环境中用更新版本替换旧版本。\n\
  \n3.  **模型监控**\n\n模型监控是机器学习生命周期的最后一个阶段。模型监控系统通过早期检测和缓解措施，确保模型性能保持在最佳水平。模型监控下的可靠性最佳实践详述如下：\n\
  \    1.  **实施模型端点的自动扩缩**\n\n在不断变化的工作负载环境中，需要实施能够确保模型端点可靠处理和自动扩缩的能力。结合端点监控来查找添加或移除资源以满足需求的阈值。如果收到扩缩请求，则会部署一个解决方案来扩缩支持该端点的后端资源。其实施计划详述如下：\n\
  \n**为 Amazon SageMaker 端点配置自动扩缩**\n\n使用 Amazon SageMaker 为您托管的模型配置自动扩缩。自动扩缩可确保您的\
  \ SageMaker 端点在应用程序流量增加时保持相同的服务水平。这是云服务中的一项关键功能，可自动配置新资源来处理系统负载或用户需求的增加。在分布式系统中，自动扩缩会在工作负载减少时移除不必要的实例，从而避免客户为未使用的预置实例付费。\n\
  \n**使用 Amazon Elastic Inference**\n\n借助 Amazon Elastic Inference，可根据应用程序的整体计算和内存需求选择\
  \ AWS 中的 CPU 实例。通过单独配置适当数量的 GPU 驱动推理加速，您可以有效利用资源，并将推理成本降低高达 75%。\n\nAmazon Elastic\
  \ Inference 的主要优势如下：\n        *   推理成本降低 75%。\n\n*   Amazon Elastic Inference 可根据需求提供万亿次浮点运算每秒（TFLOPS）的推理加速。\n\
  \n*   扩展推理量以满足应用程序需求，而无需过度预置容量。\n\n**将 Amazon Elastic Inference 与 EC2 Auto Scaling\
  \ 结合使用**\n\n在 Amazon Elastic Inference 中使用 EC2 Auto Scaling，可在云中为任何工作负载虚拟创建安全且自动扩缩的计算容量。Amazon\
  \ EC2 是 Amazon 提供的一项服务，称为 Amazon Elastic Compute Cloud Web 服务。\n\nEC2 Auto Scaling\
  \ 的主要功能如下：\n        *   可靠、可访问，并可在数分钟内按需扩展。\n\n*   为您的应用程序提供安全计算。\n\n*   其性能可通过灵活的选项进行优化且具有成本效益。\n\
  \n2.  **实施托管版本控制策略。**\n\n所有数据、模型、制品、容器镜像、元数据和端点配置都需要进行版本控制。实施托管版本控制策略对于数据监控以及在发生故障时回滚到所需版本至关重要。确保创建托管模型预测的端点所涉及的每个组件以及端点本身，在线索追踪系统中都是完全可恢复、受版本控制且可追溯的。其实施计划详述如下：\n\
  \n**使用 Amazon SageMaker Projects 实施 MLOps 最佳实践**\n\n使用带有 CI/CD 管道的 Amazon SageMaker\
  \ Projects 来实施 MLOps 最佳实践。Amazon SageMaker Projects 使数据科学家和 MLOps 工程师团队能够就机器学习业务问题进行协作。它是一个由\
  \ Service Catalog 预置的产品，有助于轻松创建端到端的 ML 解决方案。管道执行、已注册模型、端点、数据集、依赖项管理、构建可重现性和代码仓库是\
  \ SageMaker 项目中实体的示例。\n\n每个 SageMaker 项目都被分配了唯一的名称和 ID，它们作为项目中生成的所有 AWS 和 SageMaker\
  \ 资源的标签。使用名称和 ID，可以查看与项目关联的所有实体，如下所述：\n        *   SageMaker Pipelines\n\n*   已注册模型\n\
  \n*   已部署模型（端点）\n\n*   Model Registry\n\n*   数据集\n\n*   Service Catalog 产品\n\n*\
  \   CodePipeline 和 Jenkins 管道\n\n*   CodeCommit 和第三方 Git 仓库\n\n**使用基础设施即代码（IaC）工具**\n\
  \n\n\n使用 Amazon CloudFormation 等 IaC 工具来创建和构建您的基础设施，包括您的模型端点。要对您的基础设施代码进行版本控制，请将您的\
  \ CloudFormation 代码保存在 Git 仓库（如 AWS CodeCommit）中。\n\n**使用 Amazon Elastic Container\
  \ Registry (Amazon ECR)**\n\n使用 Amazon ECR（一个 Docker 容器制品仓库）来存储您的容器。当您更改容器时，Amazon\
  \ ECR 会自动为其生成一个版本哈希，使您能够回滚到早期版本。\n\nAmazon ECR 包含以下五个组件：\n1.  **Amazon ECR 私有注册表**\
  \ 提供给每个 AWS 账户，您可以在其中创建一个或多个仓库。\n\n2.  **授权令牌** 用于在推送和拉取镜像之前，对作为 AWS 用户的 Amazon\
  \ ECR 私有注册表进行身份验证。\n\n3.  **仓库** 包含 Docker 镜像、开放容器倡议（OCI）镜像以及 OCI 兼容的制品。\n\n4. \
  \ **仓库策略** 用于控制对仓库及其内容的访问。\n\n5.  **容器镜像** 可以被推送到您的仓库或从您的仓库拉取。\n\n1.  **Amazon SageMaker\
  \ Pipelines**\n\nAmazon SageMaker Pipelines 是一种自动化方式，用于在您的 ML 工作负载工作流中移动和转换来自 SageMaker\
  \ Data Wrangler 的已处理数据。它自动化了模型部署和管理的过程。当手动移动和转换数据时，可能会出现不准确和不一致的情况。它有助于减少错误并节省时间。\n\
  \nSageMaker Pipelines 的主要特性如下：\n    *   自动化模型开发生命周期。\n\n*   构建并自动化端到端的 MLOps 工作流。\n\
  \n*   根据组织需求轻松大规模管理 ML 工作负载。\n\n2.  **实施自动化数据变更管理**\n\n在数据处理阶段，实施自动化数据变更管理以跟踪训练数据的变化。训练数据的变化通过版本控制技术进行跟踪。在发生故障时，可以回滚到确切的模型版本以重现期望的结果。其实现方案详述如下：\n\
  \n**AWS 上的 MLOps 工作负载编排器**\n\nAWS 上的 MLOps 工作负载编排器提供了一个标准接口，用于管理自动化工具和 ML 管道，以简化机器学习模型的开发和投产。该解决方案的模板允许您上传已训练的模型，通常称为“自带模型”（BYOM）。它设置了管道的编排并监控其运行。它使用\
  \ SageMaker Model Registry 跟踪模型版本、制品、谱系和元数据。该解决方案使得能够大规模复制有效流程，从而提高了敏捷性和效率。\n\n\
  *   它在几分钟内为机器学习建模准备好数据。\n\n*   在模型部署前诊断数据异常，确保模型的高精度。\n\n*   它可以在无需或仅需少量代码的情况下工作。\n\
