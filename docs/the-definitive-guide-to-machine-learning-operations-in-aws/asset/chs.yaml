- "# 1. MLOps 简介\n\n机器学习运维（MLOps）是指将 DevOps 原则应用于机器学习系统。这是一个相对较新的术语，因为如今大多数企业都试图将\
  \ AI/ML 系统整合到其产品和平台中。MLOps 是一门工程学科，旨在统一 ML 系统的开发（dev）与部署/运维（ops），以标准化和简化高性能模型在生产环境中的持续交付。MLOps\
  \ 的目标是以自动化且可重复的方式，在生产环境中提供高质量的机器学习解决方案。\n\nMLOps 包含三个贡献学科：机器学习、DevOps 和数据工程。MLOps\
  \ 是 DevOps 持续构建、部署代码和测试实践在数据工程（数据）和机器学习（模型）上的延伸，如图 1-1 所示。\n\n![](img/609560_1_En_1_Fig1_HTML.jpg)\n\
  \n图 1-1\n\nMLOps\n\n机器学习模型可以使用训练数据离线开发；然而，将其部署到生产环境中可能颇具挑战。MLOps 的工作不仅限于部署模型，还包括在\
  \ ML 系统的每个步骤中持续进行自动化、监控、管理和更新。随着当今数据量的激增和 ML 应用的广泛普及，在 AI 时代，通过 MLOps 实现自动化已成为必然。\n\
  \n## MLOps 组件\n\nMLOps 组件可分为 ML 开发和运维组件，如图 1-2 所示。\n\n![](img/609560_1_En_1_Fig2_HTML.jpg)\n\
  \n图 1-2\n\nML 开发和运维组件\n\n如图所示，所有与数据工程和模型训练相关的组件都属于模型开发范畴。模型开发仅完成了工作的一半。运维则遵循此流程，部署、调度、监控和维护组件属于运维范畴。\n\
  \n## MLOps 的演进\n\n2015 年，随着数据和 Python 库数量的增长，人工智能、机器学习和数据科学达到了顶峰。由于大量算法的可用性，深度学习与神经网络训练的\
  \ ML 模型变得易于使用并开始流行。然而，将这些模型大规模部署到生产环境中仍是一个挑战。只有极少数模型能够投入大量精力和时间进入部署阶段。\n\n2018 年至\
  \ 2019 年，随着容器化的普及，Docker 和 Kubernetes 被用于部署 ML 模型。那个时代被称为 *MLOps 淘金热时代*，因为许多 ML\
  \ 部署平台，如 DataRobot、ClearML、Amazon SageMaker、Kubeflow、Google Cloud Platform 等，都是为了覆盖整个\
  \ ML 系统迭代而构建的。这些平台通过数据分析、模型创建、部署、维护和监控提供自动化。\n\n## MLOps 的必要性？\n\n根据 Algorithma\
  \ 的报告，在所有接受调查的公司中，有 18% 的公司需要 90 天到一年的时间才能将一个 ML 模型部署到生产环境。大约 50% 的公司能在 90 天或更短时间内部署一个模型。见图\
  \ 1-3。\n\n![](img/609560_1_En_1_Fig3_HTML.jpg)\n\n图 1-3\n\n模型部署时间线\n\n根据 Deeplearning.ai\
  \ 的报告，只有 22% 使用机器学习的公司成功部署了模型。\n\n现在问题来了：为什么在生产环境中部署模型如此困难，解决方案又是什么？\n\n通过实施结合了\
  \ DevOps 中常用的 CI/CD 方法的系统性“MLOps”流程，企业可以为解决此问题的每一步创建一个流水线。MLOps 旨在利用自动化、ML 以及对每个模型版本的迭代改进，来简化运行数据科学模型所需的数据、时间、建模和其他资源。\n\
  \n## 理解 MLOps 的广泛阶段\n\nMLOps 的阶段遵循一个迭代增量过程，分为三个广泛阶段：设计 ML 驱动的应用程序、ML 实验与开发，以及 ML\
  \ 运维。让我们更详细地看一下；见图 1-4。\n\n![](img/609560_1_En_1_Fig4_HTML.jpg)\n\n图 1-4\n\nMLOps\
  \ 的详细广泛阶段\n\n1.  **设计**\n\n    设计的第一阶段致力于业务和数据理解、需求工程、机器学习用例优先级排序以及 ML 驱动的应用程序设计。在此阶段，主要目标是利用任何相关数据来识别业务问题，从而为其潜在用户设计机器学习解决方案。\n\
  \n    在设计阶段，首先定义 ML 用例并确定优先级。然后检查数据以训练模型。ML 模型的所有功能性和非功能性需求都用于设计 ML 应用程序的架构、建立模型服务策略，并为未来的\
  \ ML 模型创建测试套件。\n\n    此阶段旨在建立一个强大的基础，以提高机器学习应用程序的交互性和用户的生产力。\n\n2.  **模型开发**\n\n\
  \    设计阶段之后是“ML 实验与开发”阶段。此阶段的目标是交付一个将在生产环境中运行的稳定、高质量的 ML 模型。在此阶段，会实现 ML 模型的概念验证，以验证\
  \ ML 模型对我们问题的适用性。数据工程、ML 模型工程、编码、超参数调优以及模型测试和验证会迭代运行，以识别适合业务问题的 ML 算法。\n\n3.  **运维**\n\
  \n    “ML 运维”阶段的主要目标是将先前开发的 ML 模型部署到生产环境中。部署通过使用既定的 DevOps 实践（如测试、版本控制、持续集成与交付）以及定期监控和触发服务来完成。为了对\
  \ ML 系统进行监控和维护，在此步骤中会完成持续的模型评估。\n\n所有这三个阶段都是迭代的、增量的、相互影响且相互关联的。设计决策会传播到开发阶段，最终开发的模型会影响最终运维阶段的部署。在部署后的一段时间后，如果模型衰退并出现异常行为，那么我们需要回到流程中，要么收集更多数据，要么重新标记训练数据，这会触发\
  \ ML 模型的重新训练。\n\n\n\n## MLOps 原则\n\nMLOps 拥有若干原则，用于成功部署可运行的机器学习应用。\n\n1.  **自动化**\n\
  \n自动化实现了已训练机器学习模型的持续集成、交付和部署。它确保生产模型始终使用最新的训练版本，并能根据快速变化的业务需求处理动态数据。这降低了错误风险，提高了生产力，实现了无缝更新，并缩短了产品上市时间。自动化针对以下流程执行：\n\
  \    *   数据转换\n\n*   特征工程\n\n*   数据工程流水线\n\n*   机器学习模型训练流水线\n\n*   超参数选择\n\n*  \
  \ 用于机器学习模型部署的 CI/CD 流水线\n\n*   构建应用\n\n2.  **版本控制**\n\n版本控制对于确保可复现性和可追溯性至关重要。数据、代码和模型的版本控制是必要的。例如，数据可能发生变化，模型可能随时间衰减，或者环境变化可能需要新数据或新模型，因此维护版本控制非常重要。必须为以下项目维护版本：\n\
  \    *   数据准备流水线\n\n*   数据集\n\n*   特征存储\n\n*   元数据\n\n*   机器学习模型训练流水线\n\n*   超参数\n\
  \n*   实验\n\n*   应用代码\n\n*   配置\n\n3.  **测试**\n\n机器学习系统持续进行数据、特征、模型和基础设施测试。特征流水线、数据流水线和机器学习模型性能都需要测试。基础设施测试则通过集成测试和压力测试完成。测试是交付一流机器学习系统输出的必要条件。需要在以下步骤完成测试：\n\
  \    *   数据验证\n\n*   特征创建单元测试\n\n*   机器学习模型训练流水线的集成测试\n\n*   机器学习模型在投入运营前进行验证\n\n\
  *   生产环境中机器学习模型的新鲜度测试\n\n*   模型治理测试\n\n*   单元测试\n\n*   端到端流水线的集成测试\n\n4.  **部署**\n\
  \n模型部署应基于实验追踪完成，这包括特征存储、机器学习栈的容器化，以及在本地、云端或边缘端运行的能力。部署服务的角色是确保通过编排、日志记录、监控和通知，使机器学习模型、代码和数据保持稳定。部署基于以下特性完成：\n\
  \    *   在开发和生产环境中使用的特征存储\n\n*   机器学习栈的容器化\n\n*   REST API\n\n*   本地、云端或边缘环境\n\n\
  5.  **监控**\n\n持续监控意味着定期评估数据、代码、模型、基础设施资源以及模型性能指标。它有助于检测数据或环境中的潜在错误或变化，从而带来高质量的产品。为了在不断变化的数据、环境和模型衰减的情况下，维持并保持\
  \ MLOps 系统的稳定，持续监控是必要的。持续监控需要持续检查以下流程：\n    *   数据分布变化（训练数据和服务数据）\n\n*   训练和服务特征\n\
  \n*   机器学习模型衰减\n\n*   数值稳定性\n\n*   机器学习模型的计算性能\n\n*   应用在服务数据上的预测质量\n\n6.  **可复现性**\n\
  \n可复现性是指机器学习系统的每个阶段（数据处理、特征工程、模型开发和模型部署）在给定相同输入时，能够复现一个机器学习实验并获得相同结果的能力。一个成功部署的\
  \ MLOps 系统必须能够复现以下列出的项目：\n    *   备份数据\n\n*   数据版本控制\n\n*   提取元数据\n\n*   特征工程版本控制\n\
  \n*   开发和生产环境之间的超参数调优保持一致\n\n*   特征顺序应保持一致\n\n*   相同的集成学习\n\n*   记录模型伪代码\n\n*  \
  \ 开发和生产环境中所有依赖项的版本保持一致\n\n*   开发和生产环境使用相同的技术工具栈\n\n*   提供容器镜像或虚拟机以复现结果\n\n\n\n##\
  \ MLOps 生命周期\n\n到目前为止，我们已经了解了机器学习应用开发的高层级工作流程。现在，我们将详细探讨 MLOps 生命周期，它包含六个主要步骤以及若干子步骤（见图\
  \ 1-5）。\n\n![](img/609560_1_En_1_Fig5_HTML.jpg)\n\n图 1-5\n\nMLOps 生命周期\n\n1.  **业务理解**\n\
  \nMLOps 生命周期始于对机器学习应用的范围、成功标准以及数据质量验证的理解。它通过深入了解业务和需求来确保项目的可行性，然后再进行后续步骤。此阶段执行的任务如下：\n\
  \    *   定义业务目标\n\n*   定义机器学习目标\n\n*   从不同来源收集和验证数据\n\n*   评估项目可行性\n\n2.  **数据工程**\n\
  \n数据工程为模型开发阶段准备数据。它负责数据摄取、数据准备、数据预处理、数据探索与验证、数据版本控制、数据监控以及数据拆分。数据工程下执行的任务如下：\n \
  \   *   数据选择\n\n*   数据合并\n\n*   特征选择\n\n*   类别平衡（数据过采样或欠采样）\n\n*   数据预处理（降噪、数据插补）\n\
  \n*   特征工程（数据构建）\n\n*   数据增强（GANs）\n\n*   数据标准化\n\n*   数据版本控制\n\n*   数据拆分\n\n3.\
  \  **模型开发**\n\n在模型开发阶段，业务目标是将业务目标转化为机器学习模型。模型开发的各个阶段是迭代的，以便能够轻松地融入数据或业务目标的任何变化。在此阶段，会收集模型训练方法的元数据，以便在需要时能够重现。模型开发下执行的各种任务如下：\n\
  \    *   定义模型的质量度量\n\n*   ML 算法选择\n\n*   结合领域知识的模型特化\n\n*   模型训练\n\n*   应用迁移学习（使用预训练模型）\n\
  \n*   模型压缩\n\n*   集成学习\n\n*   超参数调优\n\n*   模型验证\n\n*   记录 ML 模型和实验\n\n4.  **模型评估**\n\
  \n在模型评估阶段，使用模型性能指标在测试数据上评估 ML 模型的性能。这也称为离线测试，用于检查模型的鲁棒性。模型评估下执行的各种任务如下：\n    * \
  \  验证模型性能\n\n*   确定模型鲁棒性\n\n*   做出决策（是否部署模型）\n\n*   评估阶段文档记录\n\n5.  **模型部署**\n\n\
  此阶段旨在将 ML 模型集成到现有的软件系统中。是时候将可工作的 ML 模型成功部署到生产环境中了。模型部署下执行的各种任务如下：\n    *   根据生产环境评估模型\n\
  \n*   模型合规性与集成\n\n*   模型部署\n\n*   用户验收与可用性测试\n\n*   在线模型测试\n\n*   模型版本控制\n\n6. \
  \ **模型监控与维护**\n\n当部署后的模型在未见过的实时数据上运行时，监控和维护模型在实时环境中的性能至关重要。模型性能日志记录、模型性能监控、告警和重训练服务均在模型监控下完成。模型监控与维护下执行的各种任务如下：\n\
  \    *   监控预测模型性能\n\n*   检查是否满足预先指定的成功标准\n\n*   在模型衰退或需求变更时重新训练模型\n\n*   收集并整合新数据\n\
  \n*   对新数据点进行标注\n\n*   重复模型工程和模型评估阶段的任务\n\n*   模型的持续训练、集成和部署\n\n## MLOps 基础设施工具栈\n\
  \n为了操作复杂的 MLOps 生命周期，我们需要一个定义良好的项目结构、流程以及合适的软件工具。这些软件工具被称为 MLOps 基础设施工具栈。MLOps 基础设施栈应包含用于以下任务的工具：\n\
  \n*   数据分析\n\n*   数据、代码和模型版本控制\n\n*   实验管理\n\n*   特征存储\n\n*   代码仓库\n\n*   ML CI/CD\
  \ 流水线\n\n*   元数据存储\n\n*   模型注册中心\n\n*   模型服务\n\n*   生产环境中的模型监控\n\n许多云服务提供商都提供机器学习平台，例如\
  \ AWS 的 SageMaker、Google Cloud 的 AI Platform 以及 AzureML。也可以使用非云系统（如 MLFlow、DVC、Sacred\
  \ 等）为 MLOps 实现内部解决方案。\n\nJupyter Notebooks 和 Python 可用于数据分析和编码。GitLab 可用于代码仓库。\n\
  \n请参考 Valohai 提供的图 1-6 中所示的 MLOps 栈模板。\n\n![](img/609560_1_En_1_Fig6_HTML.jpg)\n\
  \n图 1-6\n\nMLOps 栈模板\n\nMLOps 栈模板旨在将工作流程和架构简化为更易于管理的抽象层级。这可以指导开发团队了解 MLOps 的构建模块，并帮助识别必要的工具链。该栈包含九个组件，各有不同的需求，具体使用取决于你的特定用例。\n\
  \n\n\n## 工具栈组件的作用\n\n让我们来看看 MLOps 栈模板中九个组件的作用：\n\n1.  **数据分析**\n\n    第一步是收集数据并理解其可行性，以便能够将业务目标转化为机器学习任务。在此步骤中，定义机器学习特定的评估指标和业务评估指标也很重要。对于数据访问和分析，可以应用各种编程语言，如\
  \ R、Python、Scala 或 SQL。\n\n2.  **实验**\n\n    为了实现数据分析步骤中定义的所有任务，我们必须运行实验并实施概念验证。这有助于将机器学习技术切实应用于业务目标。在此步骤中，使用不同的数据集和超参数进行实验是必要的。\n\
  \n3.  **特征存储**\n\n    特征工程是在进一步处理之前，将原始数据转换为适合机器学习算法的特征向量格式的过程。特征存储的作用是在不同机器学习项目和各种数据科学团队之间实现特征的可复现性和重用。这是数据工程阶段和模型工程阶段之间的接口。\n\
  \n4.  **代码仓库**\n\n    代码仓库是一个 DevOps 概念，对于稳定的软件交付性能至关重要。维护代码仓库及其版本历史以跟踪代码变更和未来的可复现性非常重要。\n\
  \n5.  **ML 流水线**\n\n    流水线意味着实现一系列操作的构建和执行。模型的持续集成（CI）、持续训练（CT）和持续部署（CD）构成了一个 ML\
  \ 流水线。\n\n6.  **模型注册表**\n\n    模型注册表是模型评估阶段的重要组成部分。如果你在生产环境中有多个模型并且需要跟踪它们，那么模型注册表是必需的。同时，模型注册表通过简化回滚到先前构建的模型的过程，确保了向后兼容性。\n\
  \n7.  **模型服务**\n\n    模型服务是将机器学习模型应用于新输入数据的过程。模型服务作为分布式服务实现，用于对输入请求进行响应预测。\n\n8.\
  \  **模型监控**\n\n    ML 模型部署后，需要持续监控以确保模型质量和预测的正确性。MLOps 栈画布的这一块确保了 ML 系统在生产环境中的成功运行。\n\
  \n9.  **元数据存储**\n\n    元数据存储是 MLOps 栈的最后一块。它是一个用于根据组织的监管要求实施 ML 模型治理过程的模块。ML 治理过程依赖于\
  \ ML 元数据存储组件。\n\n通过理解栈中不同组件的作用，组织将能够根据自身需求轻松决定其工具栈。\n\n## MLOps 挑战\n\n让我们讨论一下 MLOps\
  \ 系统面临的一些挑战，这些挑战为未来的改进开辟了空间。\n\n1.  **不切实际的期望**\n\n    对业务需求和成功标准的分析不足是 MLOps 实施基础层的主要挑战。机器学习是当今的热门词汇，有时这会导致非技术利益相关者在不考虑实际背景细节的情况下产生不切实际的期望。\n\
  \n2.  **数据质量**\n\n    ML 系统对数据质量很敏感，因为数据是 ML 开发和运营的基础。如果输入数据损坏、不完整或不符合要求，将会影响生产环境中的\
  \ ML 模型。\n\n3.  **模型衰减**\n\n    ML 模型的性能会随着时间的推移而衰减。在实时环境中，数据不断变化，这会影响生产环境中模型的性能，而这种变化在训练阶段是无法校准的。\n\
  \n4.  **地域性**\n\n    ML 模型是针对特定人群特征进行训练的，这些特征可能因不同的业务客户而异。在向新客户部署 ML 模型时，必须牢记人群特征以满足质量标准。\n\
  \n5.  **安全性**\n\n    机器学习处理不同项目的敏感数据，这些数据可能会暴露给第三方。确保数据、数据管道和机器学习模型的安全对于行业的长期成功至关重要。安全补丁对于成功将\
  \ ML 模型部署到生产环境至关重要，因为安全性是任何 MLOps 环境中的挑战。\n\n### MLOps 最佳实践\n\n实施这些最佳实践以实现 MLOps\
  \ 的规模化应用。\n\n1.  **组织良好的项目结构**\n\n    组织良好的项目结构在 MLOps 项目中尤为重要。它有助于我们导航、维护、管理和扩展未来的项目。必须为以下内容维护端到端的项目结构：\n\
  \    *   数据和代码文件夹\n\n    *   数据和代码版本控制\n\n    *   ML 模型组织\n\n    *   部署文件组织\n\n\
  2.  **文档**\n\n    在 ML 生命周期的各个步骤中，文档常常被忽略。然而，以一致的风格维护文档以供记录和参考至关重要。以下流程需要文档：\n \
  \   *   数据源记录\n\n    *   标注方法\n\n    *   实验设计\n\n    *   模型选择标准\n\n    *   模型伪代码\n\
  \n    *   整个部署过程\n\n3.  **了解你的工具栈**\n\n    组织用于 MLOps 实施的基础设施工具至关重要。工具取决于需求和组织的选择。了解你的\
  \ MLOps 流水线工具栈是必须的。\n\n4.  **跟踪项目支出**\n\n    通过 MLOps，我们的目标是尽量减少技术债务，但我们不希望支出过高而变得难以承受。在关注技术债务的同时，也要密切关注财务债务。\n\
  \n## MLOps 中的模型治理\n\n模型治理是 MLOps 中的一个新挑战，对于模型在生产环境中的部署至关重要。模型治理应与 MLOps 一起实施，以在整个组织内构建安全稳定的机器学习系统。\n\
  \n模型治理的实施应基于监管的严格程度和模型的数量。以下是 MLOps 系统每个变体中都需要实施模型治理的一些常见方面：\n\n*   全面的模型文档和指标报告。\n\
  \n*   所有模型的版本控制\n\n*   ML 系统的审计\n\n*   数据文档\n\n*   ML 元数据的管理\n\n*   ML 模型的验证\n\n\
  *   模型指标的持续监控和记录\n\n由于 MLOps 正在扩展到不同的垂直领域，构建一个成功部署的 ML 应用程序是一项具有挑战性的任务。通过将所有的 MLOps\
  \ 原则、挑战、最佳实践和治理紧密结合，我们可以在不同的人群特征中成功设计、建模并将 ML 模型部署到生产环境中。\n\n\n\n"
- "# 2. AWS 上 MLOps 的基础\n\n机器学习已从一个小众领域演变为一项变革性技术，它使企业能够做出数据驱动的决策、实现任务自动化并提升客户体验。随着机器学习不断重新定义技术格局，从构思机器学习模型到将其投入运营的过渡正处于关键阶段。MLOps\
  \ 融合了促进机器学习系统开发与运维无缝集成的实践和工具，成为这一变革之旅的关键环节。\n\n在云计算领域，亚马逊云科技作为一股开拓性力量，为部署和管理机器学习工作流提供了强大的平台。本章将作为指引灯塔，引导您掌握在这个动态云环境中驾驭复杂\
  \ MLOps 格局所必需的基本原则和策略。无论您是经验丰富的从业者还是充满热情的新手，请与我们一起揭示构成 AWS 上 MLOps 基石的核心理念，助您在机器学习领域实现卓越运营。\n\
  \n## 机器学习在云中的演进\n\n机器学习在云中的演进代表着从传统的本地机器学习方法向更动态、可扩展且易于访问的基于云的环境的重大转变。向云的迁移也意味着机器学习模型现在可以比以前更快地训练和部署，具有更高的灵活性和更低的成本。云环境具有处理机器学习工作负载固有的大量数据和复杂计算的优势，而无需在基础设施上进行大量前期投资。\n\
  \n亚马逊云科技在这一转变中发挥了关键作用，它提供了一套广泛的工具和服务，专门满足 MLOps 的多样化需求，促进了从模型开发到部署和持续管理的无缝集成。AWS\
  \ 的云原生架构提供了无与伦比的可扩展性，确保机器学习工作流能够适应不同的工作负载和不断变化的需求。\n\n此外，AWS 使从业者能够在安全可靠的环境中利用高级分析、数据存储和计算资源。AWS\
  \ 服务的强大生态系统，加上其对创新的承诺，使其成为寻求高效且有效实施 MLOps 实践的组织的理想选择。\n\n从本质上讲，AWS 上的 MLOps 不仅仅是一种便利的合作关系，更是一种战略对齐，它释放了机器学习的全部潜力，在机器学习工作流的运营化方面提供了无与伦比的灵活性、可扩展性和可靠性。无论您是初创公司还是大型企业，AWS\
  \ MLOps 解决方案都能满足各种需求。\n\n## AWS 上 MLOps 的关键组件\n\n在 AWS 上实施 MLOps 涉及几个关键组件，以确保机器学习模型和应用程序的高效、可扩展且可靠的部署。\n\
  \n### 数据管理与处理\n\n数据是任何机器学习项目的基石。处理步骤的示例包括将数据转换为机器学习算法期望的输入格式、重新缩放和归一化、清理和标记文本等等。然而，大规模数据处理涉及相当大的运营开销：管理像处理集群这样的复杂基础设施、编写代码将所有移动部件连接起来，以及实施安全性和治理。AWS\
  \ 提供了一套满足这些需求的服务，确保可扩展性、安全性和效率。\n\n#### 使用 Amazon S3 的可扩展数据湖\n\n在数据分析领域，公司越来越多地将其分散的数据整合到一个统一的存储库中，通常称为*数据湖*，以促进高级分析和机器学习。然而，随着数据量的增长，挑战也随之而来，使得数据移动变得费力。为了解决这个问题，AWS\
  \ 上引入了一种创新的 Lake House 方法。\n\n与仅仅集成数据湖和数据仓库不同，Lake House 方法涉及将数据湖、数据仓库和专用服务连接成一个连贯的架构。这种方法包括可扩展的数据湖、专用数据服务、无缝数据移动、统一治理，并注重性能和成本效益。\n\
  \nAmazon Simple Storage Service 被认为是构建数据湖的最佳选择，因为它具有无与伦比的持久性、可用性、可扩展性、安全功能、合规性、审计能力、性能以及与合作伙伴的多样化集成选项。\n\
  \n然而，数据湖的建立和管理涉及手动且耗时的任务。AWS 通过 AWS Lake Formation 解决了这一挑战，该解决方案旨在简化在云中构建安全数据湖的过程。Lake\
  \ Formation 收集和编目数据，将其移动到 Amazon S3 数据湖中，利用机器学习算法清理和分类数据，并确保对敏感信息的安全访问。\n\n此外，S3\
  \ 灵活的存储管理功能，如存储类别和生命周期策略，有助于实现经济高效的数据存储。与其他 AWS 分析服务的集成增强了直接查询和分析数据湖中数据的能力，从而简化了机器学习数据处理工作流。下图展示了\
  \ Lake House 方法，显示了分析服务与内部和外部数据存储之间的数据移动。\n\n![](img/609560_1_En_2_Fig1_HTML.jpg)\n\
  \n图 2-1\n\nAWS 上的 Lake House 架构\n\n以数据湖为架构中心，数据工程团队可以应用自己的工具进行分析工作负载。同时，数据科学团队也可以使用自己独立的工具访问相同的数据以进行机器学习工作负载。由不同团队运行的多个独立处理集群可以访问相同的数据，同时将所有团队的原始数据保留在\
  \ Amazon S3 中作为单一事实来源。此外，数据科学团队使用特征存储（例如 Amazon SageMaker Feature Store）来处理转换后的数据，有助于划定与数据工程的边界，并提供特征发现、共享、更新和重用等好处。\n\
  \n#### 使用 Amazon SageMaker 进行数据处理\n\nSageMaker 是一项完全托管的服务，通过汇集一套专为机器学习构建的广泛功能，帮助数据科学家和开发人员快速准备、构建、训练和部署高质量的机器学习模型。对于数据处理和数据准备，有以下功能。\n\
  \n##### SageMaker Data Wrangler\n\nSageMaker Data Wrangler 是 SageMaker 的一项功能，通过\
  \ SageMaker Studio 启用，它使数据科学家和机器学习工程师能够轻松地聚合和准备用于机器学习应用程序的数据，使用可视化界面来加速数据清理、探索和可视化。它允许您轻松连接到各种数据源，例如\
  \ Amazon S3、Amazon Athena 和 Amazon Redshift。SageMaker Data Wrangler 支持“无代码”工作流，您可以在其中应用内置转换，而无需编写代码。\n\
  \n此外，您还可以选择使用 PySpark、Pandas 或 SQL 编写自定义转换。SageMaker Data Wrangler 还包括与其他 SageMaker\
  \ 功能的几个便捷集成，例如用于偏差检测的 SageMaker Clarify、SageMaker Feature Store（前面提到过）和 SageMaker\
  \ Pipelines（专为机器学习构建的 CI/CD）。最后，您可以将整个数据准备工作流导出为可执行的 Python 代码。\n\n\n\n##### SageMaker\
  \ 特征存储\n\n机器学习（ML）开发过程通常始于从数据中提取数据信号（也称为*特征*），以训练机器学习模型。Amazon SageMaker 特征存储让数据科学家、机器学习工程师和普通从业者能够轻松创建、共享和管理用于机器学习开发的特征。特征存储通过减少将原始数据转换为特征以训练机器学习算法所需的重复数据处理和整理工作，加速了这一过程。\n\
  \n此外，数据的处理逻辑只需编写一次，生成的特征即可同时用于训练和推理，从而减少了训练-服务偏差。特征存储是一个集中存储特征及相关元数据的仓库，便于特征的发现和复用。您可以创建在线存储或离线存储。在线存储用于低延迟的实时推理场景，而离线存储则用于训练和批量推理。\n\
  \n图 2-2 展示了如何将特征存储作为机器学习管道的一部分使用。首先，读取原始数据并进行处理。您可以通过流式传输将数据摄取到在线和离线存储中，或通过批量方式直接摄取到离线存储。首先创建一个特征组，并将其配置为在线存储、离线存储或两者兼用。然后，将数据摄取到特征组中并存储在存储中。特征组是一组特征，通过特征存储中的模式定义来描述一条记录。\n\
  \n在线存储主要设计用于支持需要低毫秒级读取延迟和高吞吐量写入的实时预测。离线存储主要用于批量预测和模型训练。离线存储是一个仅追加的存储，可用于存储和访问历史特征数据。离线存储有助于存储和提供用于探索和模型训练的特征。在线存储仅保留最新的特征数据。特征组是可变的，创建后可以演变其模式。\n\
  \n![](img/609560_1_En_2_Fig2_HTML.jpg)\n\n图 2-2\n\nAmazon SageMaker 特征存储\n\n#####\
  \ SageMaker Processing\n\nSageMaker Processing 让您能够在完全托管的基础设施上轻松运行预处理、后处理和模型评估工作负载。预处理可能包括数据验证、数据转换、分析和特征工程。后处理可能包括生成最终结果的步骤。\n\
  \n图 2-3 展示了 Amazon SageMaker 如何启动一个 SageMaker Processing 作业。Amazon SageMaker 获取您的脚本，从\
  \ Amazon Simple Storage Service (Amazon S3) 复制您的数据，然后拉取一个处理容器。处理容器镜像可以是 Amazon SageMaker\
  \ 内置镜像，也可以是您提供的自定义镜像。SageMaker Processing 作业的底层基础设施完全由 Amazon SageMaker 管理。集群资源在作业运行期间进行配置，并在作业完成时清理。处理作业的输出存储在您指定的\
  \ Amazon S3 存储桶中。\n\n![](img/609560_1_En_2_Fig3_HTML.jpg)\n\n图 2-3\n\nAmazon SageMaker\
  \ Processing 容器\n\nApache Spark 作为大规模数据处理的统一分析引擎。Amazon SageMaker 提供预构建的 Docker\
  \ 镜像，其中包含 Apache Spark 和分布式数据处理所需的依赖项。使用 Amazon SageMaker Python SDK，可以通过 Spark\
  \ 框架无缝应用数据转换和特征提取（特征工程）。\n\n您可以使用 `sagemaker.spark.PySparkProcessor` 或 `sagemaker.spark.SparkJarProcessor`\
  \ 类在处理作业中运行 Spark 应用程序。请注意，您可以将 MaxRuntimeInSeconds 设置为最长 5 天的运行时间限制。就执行时间和使用的实例数量而言，简单的\
  \ Spark 工作负载在实例数量与完成时间之间呈现近似线性关系。\n\n以下代码示例展示了如何运行一个调用 PySpark 脚本 *preprocess.py*\
  \ 的处理作业：\n\n```\nfrom sagemaker.spark.processing import PySparkProcessor\nspark_processor\
  \ = PySparkProcessor(\nbase_job_name=\"spark-preprocessor\",\nframework_version=\"\
  2.4\",\nrole=role,\ninstance_count=2,\ninstance_type=\"ml.m5.xlarge\",\nmax_runtime_in_seconds=1200,\n\
  )\nspark_processor.run(\nsubmit_app=\"preprocess.py\",\narguments=['s3_input_bucket',\
  \ bucket,\n's3_input_key_prefix', input_prefix,\n's3_output_bucket', bucket,\n's3_output_key_prefix',\
  \ output_prefix]\n)\n```\n\n类似地，SageMaker Processing 还支持使用 SageMaker Python SDK\
  \ 中的 `SKLearnProcessor` 类进行基于 scikit-learn 的数据处理。以下代码示例展示了笔记本如何使用 `SKLearnProcessor`，通过\
  \ SageMaker 提供和维护的 Docker 镜像（而非您自己的 Docker 镜像）来运行您自己的 scikit-learn 脚本：\n\n```\n\
  from sagemaker.sklearn.processing import SKLearnProcessor\nfrom sagemaker.processing\
  \ import ProcessingInput, ProcessingOutput\nsklearn_processor = SKLearnProcessor(framework_version='0.20.0',\n\
  role=role,\ninstance_type='ml.m5.xlarge',\ninstance_count=1)\nsklearn_processor.run(code='preprocessing.py',\n\
  inputs=[ProcessingInput(\nsource='s3://path/to/my/input-data.csv',\ndestination='/opt/ml/processing/input')],\n\
  outputs=[ProcessingOutput(source='/opt/ml/processing/output/train'),\nProcessingOutput(source='/opt/ml/processing/output/validation'),\n\
  ProcessingOutput(source='/opt/ml/processing/output/test')]\n)\n```\n\n您还可以使用 `FrameworkProcessor`\
  \ 运行指定机器学习框架的处理作业，为您选择的任何机器学习框架提供 Amazon SageMaker 托管的容器。`FrameworkProcessor` 为以下机器学习框架提供预构建容器：Hugging\
  \ Face、MXNet、PyTorch、TensorFlow 和 XGBoost。\n\n此外，您可以安装库以在您自己的处理容器中运行脚本，或者在更高级的场景中，您可以构建自己的处理容器，使其满足在\
  \ Amazon SageMaker 中运行的契约。\n\n##### 与 Amazon EMR 内置集成的单一通用笔记本\n\nSageMaker Processing\
  \ 让您能够大规模运行处理脚本并自动化数据准备工作流程，而与 Amazon EMR 的内置集成则使您能够在单一的通用 SageMaker Studio 笔记本中，以\
  \ PB 级规模进行交互式数据准备和机器学习。它还使您能够从 SageMaker Studio 笔记本监控和调试在 EMR 上运行的 Apache Spark\
  \ 作业。此外，您可以直接从 SageMaker Studio 发现、连接、创建、终止和管理 EMR 集群。\n\n您还可以使用 AWS Service Catalog\
  \ 定义并向选定的数据工作者推出预配置模板，使他们能够直接从 SageMaker Studio 创建 EMR 集群。数据工作者可以直观地浏览一组可供使用的模板，根据其特定工作负载进行自定义，按需创建\
  \ EMR 集群，并直接从 SageMaker Studio 中通过几次点击即可终止它们。您可以使用这些功能来简化数据准备工作流程，并更优化地使用 EMR 集群处理来自\
  \ SageMaker Studio 的交互式工作负载。\n\n\n\n#### ETL 管道的低代码/无代码选项\n\n开发提取、转换、加载（ETL）数据管道是保持数据湖、数据仓库和数据库更新并随时提供业务洞察的最耗时步骤之一。AWS\
  \ 提供了多种用于 ETL 的低代码（或无代码）服务，这些服务采用无服务器架构，能以最低成本实现更快的成果。\n\n表 2-1\n\nDataBrew 与 SageMaker\
  \ Data Wrangler 对比\n\n|   | Glue DataBrew | SageMaker Data Wrangler |\n| --- | ---\
  \ | --- |\n| 处理资源 | 无服务器 | 无服务器 |\n| 内置可视化 | 是 | 是 |\n| 内置转换 | 是 | 是 |\n| 自定义转换\
  \ | 否 | 是 |\n| 偏差检测集成 | 否 | 是 (SageMaker Clarify) |\n| 特征存储集成 | 否 | 是 (SageMaker\
  \ Feature Store) |\n| CI/CD 集成 | 否 | 是 (SageMaker Pipelines) |\n\n*   **Amazon Athena：**\
  \ Amazon Athena 是一种无服务器交互式查询服务，可使用标准 SQL 查询转换数据，并结合 Amazon QuickSight（一种提供无代码内置可视化的无服务器\
  \ BI 工具）使用。在评估这一强大组合时，请考虑您的数据转换是否可以通过 SQL 完成。在可视化方面，QuickSight 的替代方案是使用 PyAthena\
  \ 等库在 SageMaker 笔记本中运行 SQL 查询，并使用 Altair 等声明式可视化库在笔记本中可视化结果（这可能被视为“低代码+”，因为它仍然涉及少量代码）。\n\
  \n*   **AWS Glue：** 另一种低代码方案涉及 AWS Glue，这是一种无服务器 ETL 服务，可对您的数据进行编目，提供内置转换，并支持编写自定义\
  \ PySpark 代码。对于可视化，除了 QuickSight，您还可以将 SageMaker 或 Zeppelin 笔记本附加到 AWS Glue 开发端点。如果\
  \ AWS Glue 内置转换不能完全覆盖所需的数据转换集，则在 Athena 和 AWS Glue 之间进行选择可能取决于团队是倾向于使用标准 SQL 还是\
  \ PySpark 代码来实现自定义转换。\n\n*   **AWS Glue DataBrew：** AWS Glue DataBrew 是一种可视化数据准备工具，使用户无需编写任何代码即可清理和标准化数据。您可以从\
  \ 250 多种现成的转换中进行选择，以自动化数据准备任务，例如过滤异常、将数据转换为标准格式以及纠正无效值。表 2-1 对比了 DataBrew 和 SageMaker\
  \ Data Wrangler。\n\nAWS Glue 在提取、转换、加载（ETL）过程中扮演着关键角色，这对于为机器学习模型准备数据至关重要。它是一种完全托管的\
  \ ETL 服务，简化了为分析准备和转换数据的过程。AWS Glue 自动发现并分类数据，使其在 AWS 环境中可搜索和可查询。\n\nGlue 的无服务器特性允许轻松扩展\
  \ ETL 作业，处理不同数据量，而无需手动配置资源。此外，Glue 与 Amazon Redshift 和 Amazon Athena 等其他 AWS 服务的集成，简化了将数据准备和加载到各种分析和数据仓库服务的过程。\n\
  \n#### 使用 Spark、Python 或 R 的自管理堆栈\n\n另一种选择是“自行构建”解决方案，即通过使用 Amazon Elastic Compute\
  \ Cloud (Amazon EC2) 计算资源，或容器服务 Amazon Elastic Container Service (Amazon ECS) 或\
  \ Amazon Elastic Kubernetes Service (Amazon EKS)，在自管理集群中部署 Spark、Dask 等 Python 框架或基于\
  \ R 的代码。与 SageMaker 的集成最便捷的方式是使用 Amazon SageMaker Python SDK。任何拥有 SageMaker 的 AWS\
  \ Identity and Access Management (IAM) 权限的机器都可以使用 SageMaker Python SDK 调用 SageMaker\
  \ 功能，用于模型构建、训练、调优、部署等。\n\n此选项提供了最大的灵活性，可以混合搭配任何数据处理工具和框架。它还提供了访问最广泛的 EC2 实例类型和存储选项的途径。与\
  \ Amazon EMR 一样，您可以使用 Spot 实例来优化此选项的数据处理成本。此外，类似于前面提到的 SageMaker Savings Plans，您还可以使用\
  \ Amazon EC2 Instance Savings Plans 或 Compute Savings Plans，这些计划不仅适用于 EC2 资源，还适用于无服务器计算\
  \ AWS Lambda 资源和无服务器计算引擎 AWS Fargate 资源。\n\n但是，请记住，对于数据科学家和机器学习工程师的用户友好性而言，此选项要求他们管理底层基础设施，这项任务更适合其他角色。此外，就机器学习特定任务的实用性而言，尽管有许多框架（如\
  \ Spark）和工具可以分层在这些服务之上以简化管理并为机器学习工作负载提供特定功能，但此选项的托管程度仍然远低于前面的选项。它需要更多的人员时间来管理、调优、维护基础设施和依赖关系，并编写代码来填补功能空白。因此，从长远来看，此选项也可能被证明是最昂贵的，并导致最多的工作流摩擦。\n\
  \n总之，您为机器学习工作负载选择的数据处理选项通常取决于您的团队对工具（Spark、SQL、Python 等）的偏好以及编写代码和管理基础设施的倾向。表 2-2\
  \ 总结了几个相关维度的选项。第一列强调处理和相关可视化可能使用单独的服务或功能，第三列指的是用于处理数据而非可视化的资源，可视化往往在较轻量级的资源上运行。\n\
  \n表 2-2\n\nAWS 数据处理选项对比\n\n| ![](img/609560_1_En_2_Figa_HTML.jpg) |\n\n工作负载会随着时间的推移而演变，您不必永远局限于一套工具。您可以根据自己的用例进行混合搭配。当您将\
  \ Amazon S3 置于数据湖的中心，并使用完全托管的 SageMaker 服务处理核心机器学习工作流步骤时，就可以根据需要或愿望轻松切换工具，以适应最新技术。无论您现在选择哪个选项，AWS\
  \ 都提供了灵活性，使您的工具链能够不断发展，以最好地满足当时机器学习工作负载的数据处理需求。\n\n#### 使用 Amazon EMR 进行 Spark 处理\n\
  \n组织通常使用 Spark 进行数据处理，并将其作为数据仓库的基础。Amazon EMR 是一种用于 Hadoop 生态系统集群的托管服务，可简化 Spark\
  \ 集群的设置、调优和维护。数据科学家和机器学习工程师可能会在特定情况下选择在 Amazon EMR 中使用 Spark：\n\n*   **持久集群：** 当\
  \ Spark 已用于数据仓库或其他具有持久集群的应用程序时，Amazon EMR 允许创建持久集群，支持分析应用程序。\n\n*   **端到端 Spark\
  \ 管道：** 如果存在现有的端到端 Spark 管道，并且团队拥有长期运行持久 Spark 集群的专业知识和偏好，那么 Amazon EMR 是一个合适的选择。否则，通常更倾向于使用\
  \ SageMaker 和 AWS Glue 选项。\n\n*   **实例类型：** Amazon EMR 提供多种实例类型，包括 AWS Graviton2\
  \ 处理器和用于成本优化的 Amazon EC2 Spot 实例。\n\n对于使用 Amazon EMR 的可视化，选项包括使用 SageMaker Studio\
  \ 及其内置的 SparkMagic 内核在 SageMaker 内查询、分析和处理数据。或者，Amazon EMR Studio 提供完全托管的 Jupyter\
  \ 笔记本，允许通过 AWS 单点登录登录。请注意，EMR Studio 缺少 SageMaker Studio 中存在的一些特定于 SageMaker 的 UI\
  \ 集成。\n\n\n\n### 模型训练与优化\n\n在 AWS 上的机器学习运维（MLOps）领域，高效且有效的模型训练与优化至关重要。本节将探讨 AWS\
  \ 在提供可扩展训练环境、使用 SageMaker 进行超参数调优以及实现经济高效的模型训练策略方面的能力。\n\n#### AWS 中的可扩展训练环境\n\n\
  可扩展性是机器学习模型训练的关键因素，尤其是在处理大型数据集或复杂算法时。AWS 提供了可扩展的训练环境，能够适应机器学习模型训练的各种需求。Amazon EC2（弹性计算云）和\
  \ Amazon SageMaker 等服务提供了多种实例类型，包括针对 GPU 和 CPU 优化的实例，以满足不同的训练要求。\n\nAmazon EC2 实例，特别是配备\
  \ GPU 的实例，非常适合深度学习任务，能够提供高性能计算能力。AWS 的自动扩展功能允许这些实例根据需求进行扩展或缩减，确保资源的高效利用。此外，Amazon\
  \ SageMaker 支持分布式训练，即将训练任务拆分到多个实例上，从而大幅缩短大型模型的训练时间。\n\n#### SageMaker 的框架支持\n\n\
  SageMaker 的关键特性包括内置算法以及对 TensorFlow 和 PyTorch 等主流机器学习框架的支持。SageMaker 能够扩展以处理大型数据集和复杂算法，使其成为各种机器学习应用的理想选择。其自动模型调优功能，即超参数优化（HPO），通过运行多个具有不同超参数组合的训练任务，帮助找到模型的最佳版本。\n\
  \nSageMaker 为其内置算法以及用于训练和推理的受支持深度学习框架提供了预构建的 Docker 镜像。使用容器，您可以快速可靠地训练机器学习算法并以任意规模部署模型。如果您构建或训练自定义模型，并且需要一个没有预构建镜像的自定义框架，则可以构建自定义容器。\n\
  \n以下决策树说明了上述三个列表中的信息：\n\n*   在 SageMaker 中使用预构建 Docker 容器的用例\n\n*   扩展预构建 Docker\
  \ 容器的用例\n\n*   构建自定义容器的用例\n\n    ![](img/609560_1_En_2_Fig4_HTML.jpg)\n\n    图 2-4\n\
  \n    Amazon SageMaker 框架容器支持\n\n#### 深度学习 AMI\n\nAWS 深度学习 Amazon 机器映像（AMI）提供了预装了\
  \ TensorFlow、PyTorch、Apache MXNet 等流行深度学习框架的机器映像。这些 AMI 针对 AWS 上的高性能和可扩展性进行了优化，减少了深度学习环境的设置时间。\n\
  \n这些 AMI 对于需要大量计算能力的复杂模型尤其有益。它们支持多种 GPU 和 CPU 配置，确保资源的高效利用。AMI 还预装了 CUDA 和 cuDNN\
  \ 库，这对于在 NVIDIA GPU 上执行深度学习任务至关重要。用户还可以自定义并保存自己的 AMI，从而创建可重复用于一致实验的定制环境。\n\n####\
  \ 使用 SageMaker 进行超参数调优\n\n超参数调优是优化机器学习模型以获得更好性能的关键步骤。AWS SageMaker 提供了一项自动模型调优功能，即超参数优化（HPO）。HPO\
  \ 使用贝叶斯优化、随机搜索或网格搜索等过程来找到最佳的超参数组合，从而提高模型准确性。\n\nSageMaker 的 HPO 服务自动化了运行多个训练任务的过程，每个任务使用不同的超参数设置，然后汇总结果以找到最优模型。与手动实验相比，这不仅节省了时间，还确保了模型调优过程更加系统化和科学化。\n\
  \n#### 实验管理\n\n在 MLOps 中，有效管理实验和模型版本对于跟踪和比较不同模型至关重要。AWS SageMaker Experiments 是一个工具，允许用户组织、跟踪、比较和评估机器学习实验及模型版本。\n\
  \nSageMaker Experiments 会自动捕获输入参数、配置和结果，使用户能够重现并追溯其机器学习工作流程中的步骤。这对于理解模型性能并进行迭代改进至关重要。SageMaker\
  \ 与 AWS CodeCommit、CodeBuild 和 CodePipeline 的集成进一步简化了版本控制和持续集成/持续部署（CI/CD）管道，从而增强了\
  \ MLOps 生命周期。\n\n#### 经济高效的模型训练策略\n\n成本优化是 MLOps 生命周期中的一个重要考虑因素，尤其是在资源密集型的模型训练阶段。AWS\
  \ 提供了多种策略来管理和降低成本。\n\n一种方法是利用 Amazon EC2 中的 Spot 实例，这允许用户以低于按需实例的价格使用未使用的 EC2 容量。这对于可以容忍中断的训练任务尤其有利。\n\
  \n另一种策略是利用合适的实例类型组合。例如，在初始密集型训练阶段使用高性能 GPU 实例，然后在强度较低的任务中切换到成本较低的 CPU 实例。\n\nAWS\
  \ 还提供了详细的成本管理工具，如 AWS Cost Explorer 和 AWS Budgets，使用户能够有效跟踪和管理其支出。\n\n总之，AWS 的 MLOps\
  \ 生态系统提供了可扩展性、先进的超参数调优工具和经济高效策略的强大组合。这些能力对于高效且优化地训练机器学习模型至关重要，使组织能够充分发挥其机器学习计划的潜力。\n\
  \n### 自动化模型部署与扩展\n\n有效部署和管理机器学习模型是 AWS 上 MLOps 的一个关键方面。模型部署的关键策略侧重于实时和批量推理、使用 SageMaker\
  \ Endpoints 和 Elastic Inference，以及管理模型延迟和可扩展性。\n\n为了管理扩展需求，AWS Auto Scaling 会监控您的应用程序，并自动调整容量，以最低成本维持稳定、可预测的性能。这对于需求可能波动的机器学习模型至关重要。\n\
  \n\n\n#### 部署策略：实时推理与批量推理\n\n选择实时推理还是批量推理取决于应用的具体需求。实时推理适用于需要即时响应的场景，例如推荐系统或交互式用户界面。AWS\
  \ 通过 Amazon SageMaker 等服务支持实时推理，允许将模型部署为 HTTPS 端点。这些端点能够以低延迟实时响应预测请求。\n\n另一方面，批量推理适用于即时响应不关键、且需要一次性处理大量数据的非交互式场景。AWS\
  \ 通过 Amazon SageMaker Batch Transform 等服务提供批量推理能力。该服务能够高效处理大型数据集，无需实时交互，非常适合每日金融风险评估或图像批量处理等场景。\n\
  \nAmazon SageMaker Endpoints 提供了一种直接的方式来部署机器学习模型以进行实时推理。这些端点是完全托管的实例，负责处理模型部署和扩展的繁重工作。SageMaker\
  \ Endpoints 的主要优势之一是与 AWS Elastic Inference 的集成，允许为 SageMaker 实例附加恰到好处的 GPU 推理加速能力，从而实现经济高效的高性能推理。\n\
  \nAmazon SageMaker 的部署护栏引入了一系列新的部署功能，支持采用复杂的部署策略，以降低在 SageMaker 托管中引入新模型版本时的风险。这些策略针对不同用例量身定制，每种策略都采用独特的方法将推理流量导向一个或多个模型版本。选择特定策略应与机器学习应用的具体需求保持一致。然而，任何策略都应包含监控新模型版本性能的能力，并在需要时自动回滚到先前版本，以最大程度地降低引入存在错误的新模型版本所带来的潜在风险。将这些部署策略整合到\
  \ MLOps 框架中，对于建立一致且可靠的模型部署流程至关重要。所选部署方法的实施应集成到自动化部署管道中。部署护栏可与现有的 SageMaker CreateEndpoint\
  \ 和 UpdateEndpoint API 无缝协作，使您能够轻松修改当前的部署管道设置，以利用这些高级部署功能。\n\n#### Amazon Elastic\
  \ Kubernetes Service (Amazon EKS)\n\n对于希望在容器中部署机器学习模型的用户，Amazon EKS 提供了一个可扩展且高可用的\
  \ Kubernetes 服务。Kubernetes 是用于容器编排的强大工具，而 Amazon EKS 简化了其管理。当您需要在容器化环境中运行机器学习工作负载时，此服务尤其有用。Kubernetes\
  \ 提供了隔离、自动扩展、负载均衡、灵活性和 GPU 支持。这些功能对于运行计算密集、数据密集且难以并行化的机器学习模型至关重要。Kubernetes 部署描述符的声明式语法使得非运维工程师也能轻松地在\
  \ Kubernetes 上训练机器学习模型。\n\n#### 管理模型延迟与可扩展性\n\n模型延迟和可扩展性是部署阶段的关键因素。AWS 提供了多种工具和服务来高效管理这些方面。SageMaker\
  \ Endpoints 中的自动扩展功能允许根据传入请求量自动调整实例数量，确保即使在重负载下也能保持低延迟。\n\n对于延迟敏感型应用，AWS 提供了 Amazon\
  \ Elastic Kubernetes Service (EKS) 和 AWS Fargate 等服务，它们能对部署环境进行精细控制，并优化基础设施以实现尽可能低的延迟。此外，优化模型本身（例如减小其大小或复杂度）也有助于降低延迟。\n\
  \n总之，AWS 提供了一套全面的服务与工具，用于在 MLOps 环境中高效部署模型和进行推理。无论是选择实时推理还是批量推理，利用带有 Elastic Inference\
  \ 的 SageMaker Endpoints 实现经济高效的部署，还是管理延迟和可扩展性，AWS 都提供了强大的解决方案来满足多样化的部署需求。\n\n###\
  \ 持续集成与持续部署 (CI/CD)\n\n在 MLOps 不断发展的格局中，持续集成 (CI) 和持续部署 (CD) 是简化机器学习模型开发与部署流程的基本实践。AWS\
  \ 提供了强大的工具来促进这些实践，从而提高机器学习工作流的效率和可靠性。\n\n#### 使用 AWS CodePipeline 自动化 MLOps\n\n\
  AWS CodePipeline 是一项完全托管的持续交付服务，可帮助自动化发布管道，实现快速可靠的更新。在 MLOps 的背景下，CodePipeline 可以自动化机器学习模型开发和部署的各个阶段，从数据预处理、模型训练到部署和监控。它与其他\
  \ AWS 服务无缝集成，允许创建适合机器学习项目特定需求的自定义管道。\n\n使用 CodePipeline，数据科学家和机器学习工程师可以定义构建、测试和部署其机器学习模型的工作流。例如，一旦模型经过训练和验证，CodePipeline\
  \ 可以自动将其部署到生产环境，例如 Amazon SageMaker 端点。这种自动化减少了人工干预，加速了发布流程，并最大限度地减少了出错的可能性。\n\n\
  #### 使用 AWS CodeBuild 构建 CI/CD 管道\n\nAWS CodeBuild 是一项完全托管的构建服务，可编译源代码、运行测试并生成准备部署的软件包。在\
  \ MLOps 管道中，CodeBuild 可用于自动化任务，例如对机器学习代码运行单元测试、为模型部署构建 Docker 容器，或执行数据验证脚本。\n\n\
  将 CodeBuild 集成到 MLOps CI/CD 管道中，可确保代码和模型工件在标准化环境中得到一致的测试和构建。这种一致性对于可靠且可重复的模型训练和部署至关重要。此外，CodeBuild\
  \ 可以自动扩展以满足不同的构建量，并能同时处理多个构建，从而加快开发过程。\n\n#### 使用 AWS CodeCommit 进行版本控制\n\n版本控制是\
  \ MLOps 的一个重要方面，可确保对机器学习模型、数据集和代码的所有更改都得到有效跟踪和管理。AWS CodeCommit 是一项托管的源代码控制服务，托管安全的基于\
  \ Git 的仓库。它促进了机器学习团队之间的协作，使他们能够高效地跟踪和共享工作。\n\n将 CodeCommit 纳入 MLOps 工作流，使团队能够维护机器学习项目变更的历史记录，在必要时回滚到以前的版本，并管理模型和数据集的不同版本。CodeCommit\
  \ 还与 CodePipeline 和 CodeBuild 集成，为管理从开发到部署的机器学习模型生命周期提供了无缝体验。\n\n总之，在 MLOps 工作流中利用\
  \ AWS CodePipeline、CodeBuild 和 CodeCommit 等服务，使团队能够自动化和简化其 CI/CD 流程。这种自动化不仅加快了模型开发和部署的速度，还确保了机器学习项目更高质量和一致性。\n\
  \n\n\n#### 使用 SageMaker Pipelines 编排机器学习工作流\n\nSageMaker Pipelines 是一项专为机器学习（ML）构建、易于使用的持续集成和持续交付（CI/CD）服务。SageMaker\
  \ Pipelines 与 Amazon SageMaker 直接集成。它提供三个组件来提升机器学习工作流的运营韧性和可复现性：管道、模型注册表和项目。这些工作流自动化组件使您能够轻松扩展能力，在生产环境中构建、训练、测试和部署数百个模型，加快迭代速度，减少因手动编排导致的错误，并构建可重复的机制。\n\
  \nSageMaker 项目引入了 MLOps 模板，可自动配置为您的机器学习开发生命周期启用 CI/CD 能力所需的基础资源。您可以使用多个内置模板，或创建自己的自定义模板。虽然您可以单独使用\
  \ SageMaker Pipelines 来自动化工作流，但将其与 SageMaker 项目结合使用，可自动获得额外的 CI/CD 功能。图 2-5 展示了在典型的\
  \ SageMaker 项目中，SageMaker Pipelines 的三个主要部分如何协同工作。\n\n![](img/609560_1_En_2_Fig5_HTML.jpg)\n\
  \n图 2-5\n\nAmazon SageMaker 管道\n\n#### 使用 AWS Step Functions 运行机器学习管道\n\nAWS 提供广泛的服务来管理和运行机器学习工作流，使您能够根据自己的技能和应用程序选择合适的解决方案。如果您已在使用\
  \ AWS Step Functions 来编排分布式应用的组件，那么您可以使用同一服务来构建和自动化您的机器学习工作流。\n\nAWS Step Functions\
  \ 允许您将多个 AWS 服务协调到无服务器工作流中。对于 MLOps 而言，这意味着可以轻松编排数据预处理、模型训练和部署。通过在 Step Functions\
  \ 中定义状态机，您可以创建健壮且易于维护和监控的机器学习管道。\n\n您可以使用工作流来创建机器学习管道。AWS Data Science Workflows\
  \ SDK 提供了多个 AWS SageMaker 工作流步骤，您可以用它们来构建机器学习管道。您可以创建如下训练和转换步骤：\n\n*   **TrainingStep：**\
  \ 启动一个 SageMaker 训练任务，并将模型工件输出到 S3。\n*   **ModelStep：** 使用来自 S3 的模型工件在 SageMaker\
  \ 上创建一个模型。\n*   **TransformStep：** 启动一个 SageMaker 转换任务。\n*   **EndpointConfigStep：**\
  \ 在 SageMaker 上定义一个端点配置。\n*   **EndpointStep：** 将训练好的模型部署到配置好的端点。\n\n    ![](img/609560_1_En_2_Fig6_HTML.jpg)\n\
  \n    图 2-6\n\n    机器学习管道工作流步骤\n\n最后，您可以使用 `pipeline.create()` 和 `pipeline.execute()`\
  \ 创建并运行工作流。成功运行后，每个状态都会显示为绿色。\n\n![](img/609560_1_En_2_Fig7_HTML.jpg)\n\n图 2-7\n\
  \n机器学习管道工作流成功运行\n\n### 监控、日志记录与模型维护\n\n在机器学习运维领域，持续的维护、监控和日志记录对于确保机器学习模型高效、安全地运行至关重要。本章探讨了\
  \ AWS 服务（如 Amazon CloudWatch、AWS CloudTrail）以及模型重新训练和更新的策略方法如何助力构建稳健的 MLOps 实践。\n\
  \n#### 使用 Amazon CloudWatch 监控模型\n\nAmazon CloudWatch 是一项监控与可观测性服务，旨在提供数据和可操作的洞察，以监控应用程序、响应系统范围的性能变化并优化资源利用率。在\
  \ MLOps 的背景下，CloudWatch 在监控机器学习模型方面发挥着关键作用。它能够跟踪运营指标和日志、设置告警，并对 AWS 资源的变化做出反应。\n\
  \n对于机器学习模型，CloudWatch 可用于监控关键指标，例如预测延迟、错误率以及每个模型的请求数量。这些指标对于理解模型在生产环境中的性能至关重要。此外，CloudWatch\
  \ 允许设置告警，当模型性能偏离定义的阈值时，可以通知团队，从而能够及时干预以保持模型的准确性和效率。\n\n#### 使用 AWS CloudTrail 进行日志记录与审计\n\
  \nAWS CloudTrail 是一项服务，可记录用户、角色或 AWS 服务在 AWS 中执行的操作，从而实现对 AWS 账户的治理、合规性、运营审计和风险审计。在\
  \ MLOps 中，CloudTrail 可用于记录并持续监控与机器学习工作流相关的账户活动。\n\n对 Amazon SageMaker、AWS Lambda\
  \ 和 Amazon S3 等服务的 API 调用进行日志记录，可提供对用户活动和资源变更的可见性。这种详细程度对于安全和合规目的至关重要，使团队能够追踪谁在何时、从何处进行了何种更改。此外，CloudTrail\
  \ 日志可以与 Amazon CloudWatch Logs 集成，用于实时分析，并与其他数据源关联以进行全面审计。\n\n#### 模型重新训练与更新策略\n\
  \n随着时间的推移，保持机器学习模型的准确性和相关性是一项挑战。随着数据的演变，模型可能会变得不那么有效，因此需要重新训练和更新。有效的模型重新训练和更新策略包括：定期根据新数据评估模型性能、实施自动化重新训练管道，以及谨慎管理更新模型的部署。\n\
  \n可以使用 AWS 服务建立自动化重新训练管道，持续评估新数据，并在检测到数据或模型性能发生显著漂移时重新训练模型。此外，可以采用 A/B 测试或金丝雀发布等技术，谨慎地推出更新后的模型，确保它们在实际环境中按预期运行，同时不中断现有服务。\n\
  \n\n\n#### 模型血缘追踪\n\nAmazon SageMaker Model Monitor 是机器学习生态系统中不可或缺的工具，用于解决数据漂移和模型漂移等关键问题，这些问题会显著影响机器学习模型随时间推移的性能表现。当模型输入数据的统计特性发生变化，导致训练数据与模型在生产环境中遇到的新数据不匹配时，就会发生数据漂移。同样，当底层数据模式演变导致模型预测性能下降时，就会发生模型漂移。\n\
  \n在此背景下，模型血缘追踪的重要性不言而喻。它涉及详细记录每个模型版本所使用的数据、特征、参数和环境。这种追踪对于诊断和纠正漂移等问题至关重要，因为它提供了模型开发、训练和修改的清晰历史记录。\n\
  \nSageMaker Model Monitor 通过持续评估模型在生产环境中的性能，有效应对这些挑战。它会自动检测数据质量或模型性能的任何偏差并发出警报，帮助识别数据漂移和模型漂移。通过监控输入模型的数据以及模型做出的预测，确保任何漂移都能被迅速发现和处理。此外，SageMaker\
  \ 与模型血缘追踪工具的集成提供了模型历史的全面视图，有助于快速诊断和解决问题。这种整体方法确保部署在生产环境中的机器学习模型能够随着时间的推移保持可靠和准确的性能，适应数据模式的变化，并维持其相关性和有效性。\n\
  \n总之，使用 Amazon CloudWatch 进行稳健监控、使用 AWS CloudTrail 进行详细日志记录，以及进行策略性的模型重新训练和更新，是在\
  \ AWS 上成功实施 MLOps 策略的关键组成部分。这些实践使企业能够在其运营环境中维护高性能、安全且合规的机器学习模型。\n\n### 结论\n\n虽然\
  \ AWS 为 MLOps 提供了强大的生态系统，但仍有一些挑战需要克服。这些挑战包括成本管理、模型漂移检测和数据版本控制。此外，选择合适的实例类型和存储选项会显著影响机器学习工作负载的性能和成本效益。\n\
  \n总之，AWS 上的 MLOps 提供了一个强大的平台，用于大规模开发、部署和管理机器学习模型。通过利用 AWS 广泛的服务套件并遵循最佳实践，组织可以简化其机器学习工作流程，缩短上市时间，并释放机器学习的全部潜力。\n\
  \n"
- "# 3. MLOps 中的卓越运营\n\n每个企业、技术和运营部门都力求卓越，以达到各自领域的巅峰水平。一种以最低成本实现持续改进、提升效率、提供顶级质量并让客户满意的方法被称为*卓越运营*。本章旨在实现机器学习运营中的卓越运营。\n\
  \n在本章中，我们将深入探讨 MLOps 中的卓越运营及其详细融合。我们将讨论卓越运营的原则、阶段，以及在 MLOps 中实现卓越运营应遵循的最佳实践。我们将学习云中的卓越运营设计原则，并通过代码片段了解在\
  \ AWS 上实现卓越运营的详细过程。\n\n![](img/609560_1_En_3_Figa_HTML.jpg)\n\n## 什么是卓越运营？\n\n卓越运营最初由`Dr.\
  \ Joseph M. Juran`在 20 世纪 70 年代初提出，当时他正在教授日本商业领袖如何提高质量。卓越运营是一种企业管理方法，侧重于长期可持续增长、持续改进组织现有流程、提供顶级质量的产品、赋能员工以及超越客户满意度。它常与持续改进混淆，但卓越运营的内涵远不止于此。\n\
  \n### 卓越运营的原则\n\n以下是卓越运营的原则：\n\n*   质量承诺\n*   创新产品\n*   流程优越性\n*   高水平安全\n*   领导层参与\n\
  *   员工参与\n*   战略方向与聚焦\n*   超越客户期望\n\n### 卓越运营的阶段\n\n为了持续交付卓越的运营，企业需要掌握图 3-1 所示的卓越运营五个阶段。\n\
  \n![](img/609560_1_En_3_Fig1_HTML.png)\n\n图 3-1\n\n卓越运营的阶段\n\n1.  **基础**\n\n   \
  \ 基础是设定标准流程，以一致且可重复的方式交付所有产品和服务。所有流程都必须文档化，并且必须培训员工以成功执行流程。领导层必须关注可接受的费用水平。\n\n\
  2.  **赋能**\n\n    这是有效推动后续所有阶段的关键阶段。理解领导层和员工队伍及其在流程中的参与度，对于推动他们的绩效至关重要。对员工公平且坚定，关注其正确技能发展和高层级个人的领导力发展，以及他们的融合，都在此阶段得到处理。\n\
  \n3.  **有效性**\n\n    在有效性阶段，重点是在承诺的时间范围内，以可接受的质量向客户交付承诺的产品和服务。在正确的时间将正确的资源放在正确的位置，是有效进入下一阶段的关键。\n\
  \n4.  **效率**\n\n    在效率阶段，重点是改进交付给最终客户的产品和服务。为实现此目标，在此阶段需要对技术、质量、员工效率和交付时间缩短进行持续改进和投资。\n\
  \n5.  **执行**\n\n    以正确的服务、正确的人员、正确的技能、准时交付和可控的费用，实现尽可能完美的执行。掌握所有这些方面将带来卓越的执行，从而拥有满意的客户、快乐的员工和不断增长的业务。\n\
  \n## 卓越运营与 MLOps 的融合\n\n持续改进是卓越运营的基础。当卓越运营与 MLOps 相遇时，它会在各个层面带来时间、效率、费用控制和敏捷性的渐进式收益。它强调了弥合开发、部署和运营团队之间差距的重要性，以确保更快、更可靠的产出。\n\
  \n对于 AI 业务的蓬勃发展，仅仅开发机器学习模型是不够的；其无缝部署至关重要，后续的持续监控也同样重要。这是一个完整的循环，需要运营部门让每个齿轮与所有人力及自动化协同顺畅运转。本质上，MLOps\
  \ 中的卓越运营就是确保机器学习系统的所有组件，从数据摄取到模型再到部署，都能和谐地协同工作。正是机器学习、DevOps、MLOps 和卓越运营的合力，确保了这首交响乐的完美演奏。\n\
  \n## MLOps 中卓越运营的最佳实践\n\n以下是在 MLOps 中实施卓越运营的一些最佳实践。\n\n\n\n### 持续集成与持续交付（CI/CD）流水线\n\
  \n持续集成与持续部署（CI/CD）是源自 DevOps 的理念，并在 MLOps 中得以实现，用于自动化机器学习模型的规划、编码、开发、建模、测试、部署和监控流程。它确保对代码或模型的每一次变更都能被无缝地测试、验证、集成和部署，从而减少人工错误并实现快速迭代。\n\
  \n![](img/609560_1_En_3_Figb_HTML.jpg)\n\n持续集成（CI）指的是机器学习流水线，新代码在一端提交，随后对数据、代码、模型及组件进行测试和验证。每当数据、代码或模型更新时，机器学习流水线会重新运行，以进行版本控制、测试和验证。\n\
  \n持续交付（CD）指的是机器学习流水线中负责交付一个准备就绪、可投入生产的新版本，该版本会自动将另一个机器学习模型部署到生产环境中。\n\nMLOps 通过三个层级来实现基于\
  \ CI/CD 流水线的机器学习自动化。\n\n#### 第 0 级：手动流程\n\nMLOps 第 0 级是手动数据科学流程，在机器学习时代初期被采用。该流程是迭代式的，流水线中的每一步，如数据准备、模型训练等，都需手动执行。像\
  \ Jupyter Notebooks 这样的快速应用工具被用于实现手动流程。见图 3-2。\n\n![](img/609560_1_En_3_Fig2_HTML.jpg)\n\
  \n图 3-2\n\n机器学习手动流程\n\n##### 机器学习步骤\n\n在任何机器学习项目中，一旦业务需求及其性能指标确定，将机器学习模型交付到生产环境需遵循以下八个基本步骤：\n\
  \n1.  **数据提取**\n\n    第一步是从不同的数据源中选择并整合相关数据，用于机器学习实施。\n\n2.  **数据分析**\n\n    数据分析对于理解数据至关重要。探索性数据分析（EDA）和特征工程是两种重要的技术。这为决策和理解机器学习模型的行为搭建了平台。\n\
  \n3.  **数据准备**\n\n    为机器学习任务恰当地清洗和准备数据。在此阶段，需要移除不必要的数据、填充缺失值，并将数据拆分为训练集、验证集和测试集。\n\
  \n4.  **模型训练**\n\n    在此阶段，数据科学家在准备好的数据上实施各种机器学习算法来训练模型。超参数调优也在这一步进行，这有助于识别性能最佳的模型。\n\
  \n5.  **模型评估**\n\n    根据项目开始时确定的性能指标对模型进行评估，以衡量模型的质量。\n\n6.  **模型验证**\n\n    对模型进行验证，以判断其是否适合部署。如果其预测性能优于某个基准线，则验证通过。\n\
  \n7.  **模型服务**\n\n    在目标环境中，部署已验证的模型以进行预测。\n\n8.  **模型监控**\n\n    监控模型的预测性能，以便在必要时触发机器学习流程的新一轮迭代。\n\
  \n这些步骤的自动化程度定义了机器学习流程的成熟度级别。在第 0 级，所有机器学习步骤均手动运行，不存在自动化。\n\n##### 第 0 级的挑战\n\n手动流程存在诸多挑战，这催生了对机器学习流水线自动化的需求。\n\
  \n*   生产环境中的倦怠现象\n*   机器学习与运维脱节\n*   发布迭代频率低\n*   缺乏持续集成与持续部署\n*   缺少主动监控系统\n\n\
  #### 第 1 级：机器学习流水线自动化\n\n在 MLOps 第 1 级，实现了自动化流水线，这有助于模型的持续训练（CT）。该级别有助于应对不断变化的环境和输入数据。每当新数据可用或到达预定时间时，就会触发模型重新训练的过程。通过持续训练，实现了模型预测服务的持续交付。此级别的自动化还包括数据与模型验证步骤以及元数据管理。见图\
  \ 3-3。\n\n![](img/609560_1_En_3_Fig3_HTML.jpg)\n\n图 3-3\n\n机器学习流水线自动化\n\n##### 第\
  \ 1 级新增组件\n\n第 1 级新增了以下组件：\n\n*   数据验证\n*   模型验证\n*   特征存储\n*   机器学习元数据存储\n*   机器学习流水线触发器\n\
  \n##### 第 1 级的特征\n\n第 1 级克服了第 0 级的挑战。其主要特征如下：\n\n*   在此级别，步骤之间的转换实现了自动化，从而能够快速进行实验并获得适当结果。这种自动化使得整个流水线能够快速有效地投入生产。\n\
  *   与第 0 级不同，在此级别，整个流水线会循环自动运行，以将训练好的模型交付部署。\n*   当新数据可用时，流水线会触发生产环境中模型的持续训练。\n\
  *   在生产环境中，机器学习流水线持续为基于新数据训练和验证的最新模型提供预测服务。\n*   代码针对不同组件进行模块化，使其可重用、可组合，并可能跨机器学习流水线共享。\n\
  \n##### 第 1 级的挑战\n\n机器学习流水线自动化存在诸多挑战，这催生了对 CI/CD 流水线自动化的需求。\n\n*   部署频率较低\n*   未考虑新的机器学习思路\n\
  *   缺乏持续集成\n\n\n\n#### 第二级：CI/CD 流水线自动化\n\nMLOps 第二级是 MLOps 的最终阶段，在此阶段实现了自动化的 CI/CD\
  \ 系统，用于在生产环境中快速、可靠且频繁地更新机器学习模型部署。在此级别，模型构建、测试、部署和监控机器学习系统的所有步骤均已自动化。新的机器学习想法可以通过持续集成流水线轻松整合。不同的技术组织每天在其不同的服务器上重新训练和重新部署模型。当今时代的智能系统离不开端到端的\
  \ CI/CD 自动化 MLOps 周期。参见图 3-4。\n\n![](img/609560_1_En_3_Fig4_HTML.jpg)\n\n图 3-4\n\
  \n包含 CI/CD 流程的自动化机器学习流水线\n\n##### 第二级的组件\n\n此 MLOps CI/CD 流水线自动化级别包含以下组件：\n\n* \
  \  机器学习流水线编排器\n*   源代码控制\n*   测试与构建服务\n*   流水线部署服务\n*   模型注册表\n*   模型服务\n*   特征存储\n\
  *   机器学习元数据存储\n*   性能监控\n\n##### 机器学习 CI/CD 自动化流水线的阶段\n\n让我们看看如图 3-5 所示的机器学习 CI/CD\
  \ 自动化流水线的各个阶段。\n\n![](img/609560_1_En_3_Fig5_HTML.jpg)\n\n图 3-5\n\nCI/CD 自动化机器学习流水线的阶段\n\
  \n1.  **开发与实验**\n\n    在开发与实验阶段，开发新的算法和新的模型，并对其进行实验。其最终输出是机器学习流水线 CI 下一步的输入。\n\n\
  2.  **流水线持续集成**\n\n    在此阶段，在构建源代码和进行测试的同时，集成需求的各种变更。诸如包、可执行文件和构件等输出组件被部署到机器学习流水线\
  \ CD。\n\n3.  **流水线持续交付**\n\n    在持续交付流水线中，构件和可执行文件被部署到目标环境。\n\n4.  **持续训练**\n\n\
  \    在生产环境中，任何新数据都会自动触发模型训练。这是一个基于计划或响应触发器的持续训练过程。此阶段的输出是新训练的模型，它是模型注册表的输入。\n\n\
  5.  **模型持续交付**\n\n    在此阶段，新训练的模型作为预测服务用于预测。此阶段的输出是需要部署的预测模型。\n\n6.  **监控**\n\n\
  \    监控任何系统都很重要，这样所有付出的辛勤工作才不会白费。在此阶段，基于实时数据收集模型性能的所有统计数据和分分析。此阶段的输出是触发流水线以开始新实验周期的触发器。\n\
  \n数据分析和模型分析步骤对于数据科学家来说，在新实验流水线开始之前仍然是手动过程。借助 CI/CD 系统，新的流水线实现可以自动测试和部署。这些实践可以逐步实施，以帮助改进机器学习系统开发和生产的自动化。\n\
  \n##### 第二级的挑战\n\nCI/CD 流水线自动化也存在一些挑战。\n\n*   人类技能集挑战\n*   机器学习巨大的基础设施成本\n*   运营挑战\n\
  \n### 用于可重现机器学习环境的基础设施即代码\n\n训练和测试机器学习模型需要庞大的基础设施，而手动管理是困难的。MLOps 需要可靠、可扩展、安全且可重现的实践来自动化定义、基础设施配置、部署和管理。为了简化\
  \ MLOps，基础设施即代码通过版本控制系统进行实施和管理，这可以显著加速机器学习模型的开发和部署，同时减少错误和成本。\n\n市场上有多种工具可用于为机器学习环境实施\
  \ IaC，可以根据组织需求进行选择。一些用于为机器学习环境实施 IaC 的流行工具包括 `Databricks Terraform`、`AWS CloudFormation`、`Kubernetes`\
  \ 和 `Google Cloud Deployment Manager`。\n\n#### 什么是基础设施即代码？\n\n基础设施即代码（IaC）是使用代码而非手动过程来定义、管理和配置基础设施的过程。通过\
  \ IaC，开发人员将服务器、网络、数据库和存储等基础设施资源定义为代码。此过程自动化了版本控制、部署和配置管理，从而以最小化的错误实现更快、更一致的结果。图\
  \ 3-6。\n\n![](img/609560_1_En_3_Fig6_HTML.png)\n\n图 3-6\n\n基础设施即代码的工作原理\n\n####\
  \ 用于 MLOps 的基础设施即代码的主要特性\n\n以下是主要特性：\n\n*   **自动化版本控制**\n\n    版本控制指的是跟踪数据、代码、配置和模型中所做的更改。跟踪代码和数据的更改使得在必要时更容易监控、故障排除和轻松恢复数据、代码、配置或模型的先前版本。整个\
  \ MLOps 实施需要一个大型团队，在大型团队环境中工作，版本控制是必需的，因为其自动化使其成为一个超快速的过程。\n\n    有许多开源工具可供用户用于\
  \ MLOps 中的版本控制，例如来自 GitHub 的 Git 大文件存储（LFS）、来自 Databricks 的 MLflow、来自 Pachyderm\
  \ 的 Pachyderm 等等。通过自动化版本控制，您的 MLOps 团队能够更有效地追踪错误、回滚无效的更改，并以更高的透明度和可靠性进行协作。\n\n*\
  \   **自动化机器学习流水线触发**\n\n    MLOps 生产环境通过自动化机器学习流水线触发实现自动化。机器学习流水线可以手动触发，但自动触发有助于节省大量时间和精力。重新训练模型成本高昂，因此最好精心安排流水线。机器学习流水线可以在以下任何一种或所有情况下自动触发：\n\
  \    *   基于计划\n\n        数据科学家通常知道数据变化的频率，因此机器学习系统的频率可以按日、周或月来决定。\n\n    *   在有新的训练数据可用时\n\
  \n        当有大量新的训练数据可用时，可以触发流水线。\n\n    *   在模型性能下降时\n\n        如果模型性能下降，可以重新训练模型。\n\
  \n    *   在发生显著的数据漂移时\n\n        数据漂移对于重新训练模型至关重要且是必要的。\n\n#### 为机器学习环境使用基础设施即代码的好处\n\
  \n以下是好处：\n\n*   可重现性\n*   可扩展性\n*   可靠性\n*   安全性\n*   加速部署\n*   优化成本\n\n\n\n####\
  \ 为 MLOps 实施基础设施即代码的最佳实践\n\n本节涵盖了在机器学习环境中实施 IaC 所需的一些最佳实践。这些实践对于机器学习系统的平稳高效运行至关重要。\n\
  \n*   **代码质量**\n\n    基础设施即代码完全基于代码来消除手动流程。因此，确保 IaC 代码具有高质量至关重要。这可以通过运行测试并以高精度和最小误差验证代码来实现。\n\
  \n*   **模块化**\n\n    模块化是通用的良好编码实践。代码将被分解为小的、可重用的模块，这些模块可以在多种配置中使用。这将降低代码复杂性，从而提高成功率。\n\
  \n*   **版本控制系统**\n\n    为 IaC 维护一个版本控制系统始终是一个好习惯，就像我们为开发代码所做的那样，以便跟踪变更和进行简单的回滚。可以使用像\
  \ Git 和 DVC 这样的版本控制工具来跟踪变更、还原变更，并在训练和部署机器学习模型时重现工作流。\n\n*   **自动化工具**\n\n    像 Databricks\
  \ Terraform、AWS CloudFormation、Kubernetes 等自动化工具，非常适合用于通过简化的基础设施配置来加速机器学习流程的自动化。\n\
  \n*   **合规性监控**\n\n    为模型验证的合规性监控强制执行策略和法规至关重要。这包括维护元数据和注释策略，并应用质量保证标准来帮助团队监控数据、代码、模型和其他参数。不同类型的组织可能有不同的合规性策略。他们需要确保模型以负责任和合乎道德的方式开发和部署。\n\
  \n### MLOps 中的监控与可观测性\n\n监控和可观测性是 MLOps 系统的两个重要组成部分。MLOps 中监控和可观测性的主要目标是确保模型性能在生产环境中不会下降。一旦模型部署完成，它仍然需要持续监控，因为生产环境或数据漂移随时可能影响性能。任何阶段的性能漂移都应触发警报并通知相关负责人。\n\
  \n每个机器学习系统都实施了监控和警报系统，用于跟踪模型的关键性能指标、数据指标和模型退化。有多种监控工具可用，例如 OpenShift、DataRobot、AWS\
  \ Sage Maker 等，可以利用这些工具建立全面的监控管道。\n\n#### MLOps 中需要监控什么？\n\n![](img/609560_1_En_3_Fig7_HTML.png)\n\
  \n图 3-7\n\nMLOps 健康度\n\n监控为机器学习系统中的潜在问题提供实时的健康检查和警报。许多底层监控服务有助于构建良好、成功运行的 MLOps\
  \ 系统。这些监控服务如下：\n\n1.  **监控模型性能**\n\n    在实时生产环境中，确保高模型性能是监控机器学习模型最重要的方面。性能指标根据各种指标（如输入数据、其标签、模型偏差、正确的性能指标和环境因素）来监控模型性能。这高度依赖于生产系统中实时数据的标签。为了监控模型健康度，会实施用于实时可视化的监控仪表板。\n\
  \n2.  **监控输入数据指标**\n\n    用于模型训练的输入数据来源各不相同。此外，数据在用于模型训练之前会经历多次转换。由于如此多的转换和动态变化，数据非常容易出现不一致和错误。在生产环境中使用实时数据时，模型性能会随时间下降。数据、目标变量或转换的任何变化，都会因不可预见的方式导致模型性能随时间漂移。随着时间的推移，模型预测的准确性会降低，需要定期进行监控和警报。\n\
  \n3.  **检测异常值**\n\n    并非所有数据都校准良好；只有训练数据校准良好，这可能导致过拟合。检测异常值是标记异常情况的好方法，这些异常情况的模型预测不可信，也不能用于生产。由于现实世界的数据非常嘈杂且处理不当，无监督异常检测的问题将始终存在，并且始终有监控和改进的空间。\n\
  \n4.  **平台监控**\n\n    自动化的 MLOps 需要庞大的基础设施和设置来定期监控整个平台，为此会维护日志。\n\n5.  **集群监控**\n\
  \n    集群监控对于检查所需数量的集群是否正在运行非常重要。忽视这一点可能导致系统故障或资源浪费。\n\n6.  **仓库监控**\n\n    监控仓库对于了解负载概况及其高效管理至关重要。仓库监控可以准确了解所使用的资源及其效率。\n\
  \n7.  **流式监控**\n\n    流式监控对于实时数据处理、实时数据分析和执行触发操作至关重要。\n\n8.  **安全监控**\n\n    任何\
  \ MLOps 系统都承受不起安全漏洞。系统需要得到保护、监控和关注，以实现高效性能。增强安全监控的安全合规性是时代的需求。\n\n#### MLOps 可观测性\n\
  \n可观测性为机器学习系统提供了更高级别的概览和端到端的可见性。它使工程师能够理解系统行为、检测问题并改进模型性能。它超越了监控和解决已知问题。如果你的系统不能完美运行，你应该能够在最终客户遇到任何麻烦之前检测并解决它。可观测性有助于减少事件的平均检测时间（MTTD）和平均解决时间（MTTR）。MLOps\
  \ 可观测性的目标是持续观察 MLOps 系统中所有应用和基础设施组件的当前状态。\n\n可观测性有助于理解系统的内部行为，这是从外部无法识别的。可观测性结合了指标、事件、日志和追踪，以帮助检测、调查和解决未知问题。通过观察，更容易调试意外行为并避免未来的麻烦。可观测性的基础是收集所有定期记录的、相关的信息，并密切关注任何未知问题。否则，在事件发生后等待调试数据，然后找到解决方案，会严重增加\
  \ MTTR。\n\n在 MLOps 系统中，如果内存利用率超过某个阈值或系统实时响应时间增加，许多此类问题会自动触发警报。它使用图形仪表板来显示日志、事件、追踪和指标，并显示系统发出的警报和告警。\n\
  \n##### MLOps 可观测性的优势\n\n以下是 MLOps 可观测性的优势：\n\n*   可观测性有助于减少许多 MLOps 内部问题的 MTTD\
  \ 和 MTTR。\n\n*   如果模型失败，它可以执行根本原因分析。\n\n*   它在机器学习生命周期的所有步骤收集数据，如指标、事件、日志和追踪。\n\n\
  *   提供交互式和实时的可视化。\n\n*   它成为模型改进的指路明灯。\n\n## MLOps 用例\n\n机器学习和人工智能在当今快速发展的数字世界中扮演着至关重要的角色。许多行业已转向机器学习，从而在现实场景的生产中实现了完整的\
  \ MLOps。\n\n\n\n### NatWest：MLOps 应用案例\n\n![](img/609560_1_En_3_Figc_HTML.jpg)\n\
  \n国民西敏寺银行（通常称为 NatWest）是一家领先的零售、银行和金融服务集团，为英国和爱尔兰的 1900 万客户提供服务。NatWest 被视为英国四大清算银行之一，拥有超过\
  \ 960 家分行的大型网络，并提供网上银行服务。NatWest 每月处理约 7.5 亿笔金融交易。NatWest 坚信要激发潜能，帮助个人、家庭和企业蓬勃发展。\n\
  \n#### NatWest 的业务目标\n\n实施 MLOps 的业务目标是缩短 NatWest 集团实现业务价值的时间。NatWest 集团大规模运用分析技术，使其成为一家优化的数据驱动型银行。但其流程缓慢且不一致。快节奏的金融服务行业竞争非常激烈，为其\
  \ 1900 万客户提供更快捷的服务极具挑战性。NatWest 探索其数据并构建机器学习解决方案，根据客户需求提供定制化体验。\n\n为了通过机器学习加速实现业务价值，NatWest\
  \ 求助于亚马逊云服务，并采用 Amazon SageMaker 作为其核心机器学习技术。Amazon SageMaker 是一项服务，数据科学家和工程师可以使用它来构建、训练和部署机器学习模型，并拥有完全托管的基础设施、工具和工作流程，几乎适用于任何用例。NatWest\
  \ 集团将其机器学习流程集中到 AWS 上，将推出新产品和服务所需的时间缩短了数月。同时，这也为其数据科学团队引入了更敏捷的文化。使用 Amazon SageMaker，白板上的一个想法在几个月内就能变成生产中可运行的机器学习解决方案，而此前则需要一年或更长时间。\n\
  \n#### 挑战\n\n以下是 NatWest 在实施 MLOps 之前面临的挑战：\n\n1.  人员\n\n    员工缺乏当前的培训和职责界定。这是一项艰巨且耗时的任务。\n\
  \n2.  流程\n\n    手动流程（如手动交接和治理）导致进展缓慢、效率低下，从而造成实现价值的时间过长。\n\n3.  数据\n\n    数据是机器学习运营的首要前提，但获取和发现数据并不容易。\n\
  \n4.  技术\n\n    陈旧的技术和过时的环境导致从开发到部署的时间过长。\n\n#### 使用的平台\n\nNatWest 集团与 AWS 专业服务团队合作，使用\
  \ Amazon SageMaker 构建了一个可扩展、安全且可持续的 MLOps 平台。图 3-8 中的高级架构图展示了如何在 AWS 上部署 NatWest\
  \ 业务应用案例以构建机器学习解决方案。\n\n![](img/609560_1_En_3_Fig8_HTML.jpg)\n\n图 3-8\n\nNatWest\
  \ 的 Amazon SageMaker 高级架构\n\n#### 解决方案\n\n以下是 NatWest 实施的各种解决方案：\n\n1.  NatWest\
  \ 使用 Amazon Simple Storage Service 进行简单的数据存储和访问。借助对数据和资源以及机器学习工具的简单快速访问，构建机器学习用例变得更加容易和快捷。\n\
  \n2.  NatWest 集团使用 AWS Service Catalog 来创建、组织和治理基础设施即代码模板。这将员工的工作流程从两到四周缩短到了几小时。\n\
  \n3.  NatWest 集团拥有 Amazon SageMaker Studio，这是一个基于 Web 的单一可视化界面，可以在其中执行所有机器学习开发步骤。由于其易于使用和配置，因此用户友好、易于学习，并能产生有效的结果。\n\
  \n4.  Amazon SageMaker 集成了 CI/CD 管道工作流程，用于生产就绪的用例开发。它提高了质量，优化了治理和沿袭追踪。\n\n5.  借助\
  \ Amazon SageMaker Studio，NatWest 实现了更快实现价值的主要目标。\n\n#### 关键成果\n\n图 3-9 展示了关键成果。\n\
  \n![](img/609560_1_En_3_Fig9_HTML.jpg)\n\n图 3-9\n\nNatWest 集团实施 MLOps 后的成果\n\n以下是\
  \ NatWest 集团实施 MLOps 后的主要关键成果：\n\n*   端到端机器学习解决方案的交付速度加快，时间从 12 个月缩短至不到 3 个月。\n\n\
  *   简化了数据的发现和访问，这通常需要五天时间；现在可以在几小时内完成。\n\n*   机器学习模型部署到生产环境曾需要六个多月；现在可以在不到两周内完成。\n\
  \n*   为最终用户创建了自助服务环境，有助于在一天内解决问题。\n\n*   实现业务价值的时间显著缩短，这使 NatWest 处于行业领先地位。\n\n\
  ### 总结\n\n使用 DevOps 概念自动化机器学习系统在生产中的部署，催生了 MLOps。卓越运营使 MLOps 能够在现实场景中平稳过渡和执行。尽管模型创建和实时部署之间存在差距，但借助\
  \ MLOps 中的卓越运营优势，一切正步入正轨。现在是时候无缝处理数据复杂性、模型构建和系统监控了。目标是通过卓越运营成功地将机器学习模型部署到生产中，以充分享受人工智能技术的全部优势。这可以通过在\
  \ MLOps 中实施本文详述的卓越运营最佳实践，并结合所讨论用例中的理念和 MLOps 实施来实现。\n\n## 如何在 AWS 中实施卓越运营\n\n卓越运营侧重于通过监控成功部署和运行系统。卓越运营旨在通过深入了解工作负载，持续改进流程和程序，以交付卓越的业务价值。为了通过持续改进流程来交付业务价值，AWS\
  \ 中的卓越运营支柱定义了其设计原则、工作领域和最佳实践。让我们详细讨论它们。\n\n## 卓越运营设计原则\n\n云中卓越运营有五个设计原则：\n\n*  \
  \ 将操作流程作为代码执行，并自动响应事件\n\n*   进行小规模、增量、频繁且可逆的变更\n\n*   频繁改进操作流程\n\n*   预测故障并制定缓解措施\n\
  \n*   从所有运营事件和故障中学习\n\n## 云中的卓越运营\n\n云中的卓越运营在四个领域发挥作用：\n\n*   **组织**\n\n要在任何组织中实现卓越运营，理解组织的优先级、运营模式和组织文化以支持和实现业务成果至关重要。\n\
  \n*   **准备**\n\n组织必须理解设计遥测、工作负载和预期行为，以优化整个流程并为卓越运营做好准备。需要构建程序并理解运营就绪状态，以降低部署风险。\n\
  \n*   **运营**\n\n一个组织通过理解其工作负载和运营的健康状况来达到成功的高度。它必须能够识别组织和业务风险，并能够适当地响应这些事件。\n\n*\
  \   **演进**\n\n演进是随着时间的推移持续改进的循环。学习并评估所有运营活动，并实施频繁的小规模增量变更。要随着时间的推移改进运营，必须能够学习、分享和改进。\n\
  \n## 卓越运营最佳实践\n\n卓越运营支柱旨在通过持续改进程序和支撑流程来交付业务价值。卓越运营的关键工作领域包括自动化变更、响应事件以及管理日常运营，同时满足既定标准。本节包含在构建机器学习问题时要考虑的九项最佳实践。\n\
  \n\n\n### 制定模型改进策略\n\n在机器学习模型开发之前，规划模型改进策略至关重要。为了优化模型性能，机器学习实验需要迭代进行。这些实验会用到多种改进技术，例如数据收集、交叉验证、特征工程、深度学习超参数调优以及集成方法。我们先来了解机器学习实验。\n\
  \n#### 理解机器学习实验\n\n完整的机器学习周期是一个迭代过程。你需要尝试数据、特征工程、不同算法和超参数的多种组合，同时观察增量变化对模型准确率的影响。这种迭代实验会随着时间的推移产生数千次模型训练运行和模型版本。经过几次迭代后，很难将当前实验与过去的实验进行比较，以确定进一步改进的增量变化。同时，跟踪所有模型及其性能和输入配置，以便最终得出性能最佳的模型，这一点也很重要。\n\
  \n开发者需要工具来组织、查看、分析和比较迭代的机器学习实验，从而获得比较性洞察并跟踪性能最佳的模型。`Amazon SageMaker Experiments`\
  \ 是一项托管服务工具，它可以大规模地创建、组织、查看、跟踪、分析和比较你的机器学习实验，并涵盖各种模型改进策略（见图 3-10）。\n\n![](img/609560_1_En_3_Fig10_HTML.jpg)\n\
  \n图 3-10\n\nAmazon SageMaker Experiments\n\n#### 实施模型改进策略\n\n我们来讨论如何使用 Amazon SageMaker\
  \ Experiments 实施各种改进策略：\n\n*   **有效的特征选择**\n\n有效的特征选择是构建良好机器学习模型最关键的部分之一。需要利用现有特征迭代地进行特征工程，并移除不重要的特征，以提高模型的准确率和鲁棒性。这不仅关乎添加新的复杂特征，也关乎有效处理现有特征。Amazon\
  \ SageMaker Experiments 可以帮助进行数据清洗和有效的特征选择。\n\n以下示例演示了如何通过构建一个 `sagemaker.sklearn.estimator.sklearn`\
  \ 评估器来创建用于特征选择的 SageMaker Scikit 评估器。该评估器会执行特征选择训练脚本 `sklearn_feature_selection.py`。\n\
  \n```\n    from sagemaker.sklearn.estimator import SKLearn\n    script_path = \"\
  sklearn_feature_selection.py\"\n    model_output_path = os.path.join(\"s3://\",\
  \ bucket, prefix, \"Feature_selection_model/\")\n    sklearn_preprocessor = SKLearn(\n\
  \    entry_point=script_path,\n    role=role,\n    output_path=model_output_path,\n\
  \    instance_type=\"ml.c4.xlarge\",\n    sagemaker_session=None,\n    framework_version=\"\
  1.2-1\",\n    py_version=\"py3\",\n    )\n    sklearn_preprocessor.fit({\"train\"\
  : train_input})\n    ```\n\n下面展示了一个示例文件 “sklearn_feature_selection.py”。\n\n```\n\
  \    from sklearn.feature_selection import f_regression, mutual_info_regression,\
  \ SelectKBest, RFE\n    from sagemaker_containers.beta.framework import (\n    content_types,\
  \ encoders, env, modules, transformer, worker)\n    label_column = 'y'\n    INPUT_FEATURES_SIZE\
  \ = 100\n    y_train = concat_data.iloc[:,number_of_columns_x-1].values\n    X_train\
  \ = concat_data.iloc[:,:number_of_columns_x-1].values\n    '''特征选择管道'''\n    feature_selection_pipe\
  \ = Pipeline([\n    ('svr', RFE(SVR(kernel=\"linear\"))),# 默认：消除 50%\n    ('f_reg',SelectKBest(f_regression,\
  \ k=30)),\n    ('mut_info',SelectKBest(mutual_info_regression, k=10))\n    ])\n\
  \    feature_selection_pipe.fit(X_train,y_train)\n    joblib.dump(feature_selection_pipe,\
  \ os.path.join(args.model_dir, \"model.joblib\"))\n    print(\"模型已保存！\")\n    '''保存选定的特征名称'''\n\
  \    feature_names = concat_data.columns[:-1]\n    feature_names = feature_names[feature_selection_pipe.named_steps['svr'].get_support()]\n\
  \    feature_names = feature_names[feature_selection_pipe.named_steps['f_reg'].get_support()]\n\
  \    feature_names = feature_names[feature_selection_pipe.named_steps['mut_info'].get_support()]\n\
  \    joblib.dump(feature_names, os.path.join(args.model_dir, \"selected_feature_names.joblib\"\
  ))\n    print(\"选定的特征为: {}\".format(feature_names))\n    ```\n\n`sklearn.feature_selection`\
  \ 模块中提供了两种特征选择算法。\n\n**feature_selection.RFE** 是一种递归特征消除（RFE）算法，它通过迭代地考虑更少、更小的特征集来选择特征。\n\
  \n对于 RFE，我们使用支持向量回归（`sklearn.svm.SVR`）作为学习评估器。默认情况下，它几乎会消除总特征的 50%。\n\n**feature_selection.SelectKBest**\
  \ 选择指定指标得分最高的最佳 k 个特征。我们使用 `f_regression` 和 `mutual_info_regression` 作为评分函数，从而得到前\
  \ 10 个特征。\n\n在上述训练脚本中，使用 `sklearn.feature_selection.RFE`、`sklearn.feature_selection.SelectKBest`\
  \ 以及结合 `mutual_info_regression` 的 `SelectKBest` 进行的递归特征消除，被实现在管道中用于特征选择算法。这三个特征选择算法被堆叠到一个\
  \ `sklearn.pipeline.Pipeline` 中，以获取前 10 个选定的特征，这些特征将用于后续的训练目的。\n\n*   **深度学习**\n\
  \n\n\n深度学习算法通过训练大量训练数据来提高准确性。这种机器学习算法基于我们脑细胞（称为*神经元*）的概念，由此产生了人工神经网络（ANN）。Amazon\
  \ SageMaker Experiments 可以训练从简单经典模型到复杂深度学习模型的各种模型，以改善与业务价值相关的性能指标。\n\n以下部分为示例代码，演示了如何使用\
  \ SageMaker Python SDK 通过 TensorFlow 训练深度学习模型。\n\n```\n    from sagemaker.tensorflow\
  \ import TensorFlow\n    tf_estimator = TensorFlow(\n    entry_point=\"tf-train.py\"\
  ,\n    role=\"SageMakerRole\",\n    instance_count=1,\n    instance_type=\"ml.p2.xlarge\"\
  ,\n    framework_version=\"2.2\",\n    py_version=\"py37\",\n    )\n    tf_estimator.fit(\"\
  s3://bucket/path/to/training/data\")\n    ```\n\n在上述代码中，创建了一个 `sagemaker.tensorflow.TensorFlow`\
  \ 评估器实例。名为 `tf-train.py` 的训练脚本通过 SageMaker TensorFlow 评估器执行。该评估器对训练数据进行拟合，这些数据是\
  \ Amazon S3 中训练数据的 S3 URL 路径。\n\n*   **集成方法**\n\n集成方法结合了不同的算法，可以进一步提高准确性。在模型集成中，结合具有不同模型预测和概率的算法非常重要。算法是根据特定的业务用例进行组合的。它通常能提供更好的计算性能，但会带来维护方面的挑战。Amazon\
  \ SageMaker Experiments 可以帮助组织针对不同算法和配置的多次测试，并轻松进行比较。\n\n以下部分为示例代码，演示了如何评估线性学习器、XGBoost\
  \ 以及集成模型在训练、验证和测试数据上的表现。\n\n```\n    # 打印组合模型的 AUC\n    print(\"训练集 AUC - Xgboost\"\
  , round(roc_auc_score(train_labels, preds_train_xgb), 5))\n    print(\"训练集 AUC -\
  \ 线性\", round(roc_auc_score(train_labels, preds_train_lin), 5))\n    print(\"训练集\
  \ AUC - 集成\", round(roc_auc_score(train_labels, ens_train), 5))\n    print(\"=======================================\"\
  )\n    print(\"验证集 AUC - Xgboost\", round(roc_auc_score(val_labels, preds_val_xgb),\
  \ 5))\n    print(\"验证集 AUC - 线性\", round(roc_auc_score(val_labels, preds_val_lin),\
  \ 5))\n    print(\"验证集 AUC - 集成\", round(roc_auc_score(val_labels, ens_val), 5))\n\
  \    print(\"======================================\")\n    print(\"测试集 AUC - Xgboost\"\
  , round(roc_auc_score(test_labels, preds_test_xgb), 5))\n    print(\"测试集 AUC - 线性\"\
  , round(roc_auc_score(test_labels, preds_test_lin), 5))\n    print(\"测试集 AUC - 集成\"\
  , round(roc_auc_score(test_labels, ens_test), 5))\n    ```\n\n作为第一个训练算法，使用 SageMaker\
  \ 的托管式分布式训练框架选择了 XGBoost 算法，然后使用线性学习器对相同的数据进行训练。最终的建模是在训练、验证和测试数据上对 XGBoost 和线性学习器进行集成，并使用\
  \ AUC 性能指标进行评估。\n\n*   **超参数优化**\n\n控制模型训练和拟合过程的模型参数称为*超参数*。迭代优化超参数对于获得一个优秀模型至关重要，以便为性能最佳的模型找到最优参数。可以使用\
  \ Amazon SageMaker 自动化超参数优化过程，通过网格搜索、随机搜索、贝叶斯和 Hyperband 等多种技术达到最佳性能。\n\n以下部分为示例代码，演示了如何使用\
  \ SageMaker XGBoost 管理超参数调优，以及使用随机搜索进行自动模型调优。\n\n```\n    from sagemaker.amazon.amazon_estimator\
  \ import get_image_uri\n    from sagemaker.image_uris import retrieve\n    sess\
  \ = sagemaker.Session()\n    container = retrieve(\"xgboost\", region, \"latest\"\
  )\n    xgb = sagemaker.estimator.Estimator(\n    container,\n    role,\n    base_job_name=\"\
  xgboost-random-search\",\n    instance_count=1,\n    instance_type=\"ml.m4.xlarge\"\
  ,\n    output_path=\"s3://{}/{}/output\".format(bucket, prefix),\n    sagemaker_session=sess,\n\
  \    )\n    xgb.set_hyperparameters(\n    eval_metric=\"auc\",\n    objective=\"\
  binary:logistic\",\n    num_round=10,\n    rate_drop=0.3,\n    tweedie_variance_power=1.4,\n\
  \    )\n    objective_metric_name = \"validation:auc\"\n    hyperparameter_ranges\
  \ = {\n    \"alpha\": ContinuousParameter(0.01, 10, scaling_type=\"Logarithmic\"\
  ),\n    \"lambda\": ContinuousParameter(0.01, 10, scaling_type=\"Logarithmic\"),\n\
  \    }\n    tuner_log = HyperparameterTuner(\n    xgb,\n    objective_metric_name,\n\
  \    hyperparameter_ranges,\n    max_jobs=5,\n    max_parallel_jobs=5,\n    strategy=\"\
  Random\",\n    )\n    tuner_log.fit(\n    {\"train\": s3_input_train, \"validation\"\
  : s3_input_validation},\n    include_cls_metadata=False,\n    job_name=\"xgb-randsearch-\"\
  \ + strftime(\"%Y%m%d-%H-%M-%S\", gmtime()),\n    )\n    ```\n\n在此示例中，我们使用 SageMaker\
  \ Python SDK 来设置和管理超参数调优任务。这里使用了 XGBoost 算法，并通过随机搜索进行超参数调优。首先配置用于超参数调优的训练任务，通过启动\
  \ XGBoost 评估器来发起，然后定义静态超参数和目标。\n\n*   **AutoML 实现**\n\n顾名思义，AutoML 自动化了机器学习工作流程，使您可以花更多时间使用机器学习来改善业务成果。它自动化了繁琐、耗时且重复的工作，例如数据采集、数据清洗、特征工程、模型训练、模型调优、模型部署以及持续的模型监控和更新。Amazon\
  \ SageMaker Autopilot 是一种针对表格格式数据的 AutoML 解决方案。\n\n以下示例演示了如何使用 SageMaker Python\
  \ SDK 创建 Amazon SageMaker Experiments。\n\n```\n    class ExperimentCallback(keras.callbacks.Callback):\n\
  \    \"\"\" \"\"\"\n    def __init__(self, run, model, x_test, y_test):\n    \"\"\
  \"在构造函数中保存参数\"\"\"\n    self.run = run\n    self.model = model\n    self.x_test\
  \ = x_test\n    self.y_test = y_test\n    def on_epoch_end(self, epoch, logs=None):\n\
  \    \"\"\" \"\"\"\n    keys = list(logs.keys())\n    for key in keys:\n    run.log_metric(name=key,\
  \ value=logs[key], step=epoch)\n    print(\"Epoch: {}\\n{} -> {}\".format(epoch,\
  \ key, logs[key]))\n    ```\n\n接下来，在笔记本环境中训练 Keras 模型，该环境按顺序执行任务，将其作为实验进行跟踪，并在最后显示测试数据的准确性。\n\
  \n```\n    from sagemaker.experiments import Run\n    # 运行名称是 `run.init()` 的可选参数\n\
  \    with Run(experiment_name = 'my-experiment') as run:\n    # 定义要记录的参数值\n    run.log_parameter(\"\
  batch_size\", batch_size)\n    run.log_parameter(\"epochs\", epochs)\n    run.log_parameter(\"\
  dropout\", 0.5)\n    # 定义输入工件\n    run.log_file('datasets/input_train.npy', is_output\
  \ = False)\n    run.log_file('datasets/input_test.npy', is_output = False)\n   \
  \ run.log_file('datasets/input_train_labels.npy', is_output = False)\n    run.log_file('datasets/input_test_labels.npy',\
  \ is_output = False)\n    # 本地训练\n    model.fit(\n    x_train,\n    y_train,\n \
  \   batch_size=batch_size,\n    epochs=epochs,\n    validation_split=0.1,\n    callbacks\
  \ = [ExperimentCallback(run, model, x_test, y_test)]\n    )\n    score = model.evaluate(x_test,\
  \ y_test, verbose=0)\n    print(\"测试损失:\", score[0])\n    print(\"测试准确率:\", score[1])\n\
  \    # 定义要记录的指标\n    run.log_metric(name = \"最终测试损失\", value = score[0])\n    run.log_metric(name\
  \ = \"最终测试准确率\", value = score[1])\n    ```\n\n\n\n### 建立血缘追踪系统\n\n建立血缘追踪系统对于跟踪每次发布中文档、环境、模型、数据、代码和基础设施的变更至关重要。一个流畅的追踪系统允许用户回滚到任何先前的版本。当用户需要复现任何先前版本的结果或其中产生的任何问题时，都可以轻松复现。\n\
  \n#### 实施血缘追踪系统\n\n让我们使用 AWS SageMaker 来实施一个血缘追踪系统。\n\n![](img/609560_1_En_3_Fig11_HTML.jpg)\n\
  \n图 3-11\n\n需要追踪的工件\n\n1.  **用于追踪的数据和工件血缘**\n\n为了复现模型，必须追踪用于生产模型的所有工件，以满足监管和控制要求。图\
  \ 3-11 展示了必须被追踪和版本化以复现数据处理、模型训练、配置和模型部署过程的不同工件。\n\n以下工件需要被追踪和版本化：\n\n*   代码版本化\n\
  \n*   数据集版本化\n\n*   容器版本化\n\n*   训练任务版本化\n\n*   模型版本化\n\n*   端点元数据版本化\n\n以下部分是示例代码，演示了如何使用\
  \ SageMaker Python SDK 创建一个 Amazon SageMaker 工件，该工件是 SageMaker 血缘关系的一部分。\n\n```\n\
  from sagemaker.lineage import artifact\nmy_artifact = artifact.Artifact.create(\n\
  artifact_name='MyArtifact',\nartifact_type='S3File',\nsource_uri='s3://...')\nmy_artifact.properties[\"\
  added\"] = \"property\"\nmy_artifact.save()\nfor artfct in artifact.Artifact.list():\n\
  print(artfct)\nmy_artifact.delete(\n```\n\n将 `artifact_name`、`artifact_type` 和 `source_uri`\
  \ 作为输入，用于创建 Amazon SageMaker 工件，并将其保存为 SageMaker 血缘关系的一部分。\n\n1.  **使用 SageMaker\
  \ ML 血缘追踪**\n\n对于机器学习，系统遵循从数据准备到模型部署的 ML 工作流。为了创建和存储关于 ML 工作流步骤的信息，使用了 Amazon SageMaker\
  \ ML 血缘追踪。借助 SageMaker 血缘追踪，可以轻松复现 ML 工作流步骤、数据集血缘关系以及追踪模型。所有这些追踪信息有助于建立模型治理并完美地维护审计标准。\n\
  \nAmazon SageMaker 会自动创建一个端到端的模型训练和部署 ML 工作流，如图 3-12 所示。\n\n![](img/609560_1_En_3_Fig12_HTML.jpg)\n\
  \n图 3-12\n\n血缘元数据\n\n以下是 SageMaker 血缘追踪的特性：\n    *   维护模型发现实验的运行历史。\n\n*   通过追踪模型血缘工件，为审计和合规性验证建立模型治理。\n\
  \n1.  **使用 SageMaker Studio Classic**\n\nAmazon SageMaker Studio Classic 是一个用于端到端\
  \ ML 开发的基于 Web 的界面。它提供了一个用于机器学习的集成开发环境（IDE），用于追踪从上传数据到构建模型再到部署模型的 SageMaker ML 管道的血缘关系。Amazon\
  \ SageMaker Studio Classic 提供了广泛的专业工具，用于执行所有 ML 开发步骤，从准备数据到构建、训练、调试、部署和管理您的机器学习模型。图\
  \ 3-13。\n\n![](img/609560_1_En_3_Fig13_HTML.jpg)\n\n图 3-13\n\nAmazon SageMaker Studio\
  \ 工作流\n\n它是一个统一的、可视化的基于 Web 的界面，客户可以在其中执行以下任务：\n    *   使用 Jupyter Notebooks 编写和执行代码\n\
  \n*   为机器学习大规模准备数据\n\n*   以优化性能构建和训练机器学习模型\n\n*   部署模型并监控以获得最佳性能和成本\n\n*   追踪和调试机器学习实验\n\
  \n*   交付高性能的生产级 ML 模型\n\n1.  **使用 SageMaker Feature Store**\n\nAmazon SageMaker\
  \ Feature Store 是一个专门构建的存储库，您可以在其中存储、共享、访问和管理 ML 模型特征，以便在 ML 应用程序和各个团队之间进行训练、组织和重用。借助\
  \ SageMaker Feature Store，可以轻松地将输入数据处理和转换为 ML 特征。为了支持 MLOps 实践，它构建了特征管道以加快模型部署时间。\n\
  \nSageMaker Feature Store 提供了一个统一的存储库，用于训练期间的离线特征存储以及用于实时推理和批量推理的在线存储。无需编写额外的代码或创建手动流程来保持特征一致性。\n\
  \n来自任何数据源（包括流式和批处理）的特征，例如应用程序日志、服务日志、点击流、传感器以及来自 AWS 或任何其他第三方数据源的表格数据，都可以通过 Amazon\
  \ SageMaker Feature Store 轻松摄取。图 3-14。\n\n![](img/609560_1_En_3_Fig14_HTML.jpg)\n\
  \n图 3-14\n\nAmazon SageMaker Feature Store\n\n以下是 Amazon SageMaker Feature Store\
  \ 的主要特性：\n    *   在将数据摄取到 ML 特征时进行特征处理，并能够通过单行代码从各种来源摄取大量数据。\n\n*   通过 Amazon SageMaker\
  \ Studio 的图形用户界面轻松存储、组织、查找和使用特征。\n\n*   通过确保离线和在线数据集保持同步来实现特征一致性，这一点至关重要，否则可能会对模型准确性产生负面影响。\n\
  \n*   血缘追踪，能够在一个环境中将特征追溯回其数据源并查看特征处理代码，从而增强数据科学家的信心。\n\n*   在需要时检索每个特征的状态。\n\n*\
  \   SageMaker Feature Store 管理数据集和特征管道，以加速 MLOps 生命周期任务并消除重复的特征创建。\n\n*   它实施细粒度的访问控制，以保护特征存储数据，并根据安全和合规角色授予访问权限。\n\
  \n以下部分示例演示了如何使用 SageMaker Python SDK 创建 Amazon SageMaker Feature Store。\n\n```\n\
  \    from sagemaker.feature_store.feature_store import FeatureStore\n    feature_store\
  \ = FeatureStore(sagemaker_session=feature_store_session)\n    result_df, query\
  \ = feature_store.create_dataset(\n    base=base_feature_group,\n    output_path=f\"\
  s3://{s3_bucket_name}\"\n    ).to_dataframe()\n    ```\n\n通过使用 Feature Store Offline\
  \ SDK 预处理数据和训练机器学习模型，可以快速简单地创建可供使用的数据集。无需编写任何 SQL 代码，该 SDK 即可轻松地从 SQL 连接、时间点精确连接和事件时间范围创建数据集。在前面的代码中，`result_df`\
  \ 数据帧是使用 SageMaker Feature Store 创建的。\n\n1.  **使用 SageMaker Pipelines 进行模型构建**\n\
  \nAmazon SageMaker Pipelines 是一个专门构建的工作流编排服务，用于自动化机器学习（ML）管道的所有阶段，从数据预处理到模型监控，通过直观的\
  \ UI 和 Python SDK 进行大规模操作。借助管道，您可以追踪输入数据、其来源以及生成的输出的历史记录。\n\n以下是 Amazon SageMaker\
  \ Pipelines 的主要特性：\n    *   自动化 ML 开发的所有阶段\n\n*   构建端到端的 LLMOP 系统\n\n*   管理工作负载\n\
  \n*   组合、重用和调度 ML 工作流\n\n*   迁移您的机器学习代码\n\n*   自动模型追踪\n\n以下部分是示例代码，演示了如何使用 SageMaker\
  \ Python SDK 在 Amazon SageMaker 中创建 Amazon SageMaker 模型构建管道。\n\n\n\n```\n    from\
  \ sagemaker.workflow.pipeline_context import PipelineSession\n    from sagemaker.workflow.pipeline_context\
  \ import PipelineSession\n    pytorch_estimator = PyTorch(\n    sagemaker_session=PipelineSession(),\n\
  \    role=sagemaker.get_execution_role(),\n    instance_type=\"ml.c5.xlarge\",\n\
  \    instance_count=1,\n    framework_version=\"1.8.0\",\n    py_version=\"py36\"\
  ,\n    entry_point=\"./entry_point.py\",\n    )\n    step = TrainingStep(\n    name=\"\
  MyTrainingStep\",\n    // code just like how you trigger a training job before,\n\
  \    // pipeline session will take care of delaying the start\n    // of the training\
  \ job during pipeline execution.\n    step_args=pytorch_estimator.fit(\n    inputs=TrainingInput(s3_data=\"\
  s3://my-bucket/my-data/train\"),\n    ),\n    displayName=\"MyTrainingStepDisplayName\"\
  ,\n    description=\"This is MyTrainingStep\",\n    cache_config=CacheConfig(...),\n\
  \    retry_policies=[...],\n    depends_on=[...],\n    )\n    pipeline = Pipeline(\n\
  \    name=\"MyPipeline\",\n    steps=[step],\n    sagemaker_session=local_pipeline_session\n\
  \    )\n    pipeline.create(\n    role_arn=sagemaker.get_execution_role(),\n   \
  \ description=\"local pipeline example\"\n    )\n    // pipeline will execute locally\n\
  \    pipeline.start()\n    ```\n\n前面的示例展示了如何构建一个 Pytorch 估算器，并使用 SageMaker 会话启动一个训练作业。这里我们使用的是\
  \ `sagemaker.workflow.pipeline_context.PipelineSession`，它定义了 `sagemaker.workflow.steps.TrainingStep`，该步骤在管道执行期间运行。这就是管道会话\
  \ `sagemaker.workflow.pipeline_context.PipelineSession` 介入并执行整个管道的地方。\n\n1.  **使用\
  \ SageMaker 模型注册表**\n\nAmazon SageMaker 模型注册表用于编目生产模型、管理模型版本、注册和部署模型，以及将元数据与模型关联。模型注册表支持血缘追踪。\n\
  \nSageMaker 模型注册表模型（包）组用于编目包含不同版本模型的生产模型。创建模型组是为了追踪为解决特定问题而训练的所有模型。然后，每个训练好的模型都会作为新的模型版本注册，并添加到模型组中。最后，通过将模型组组织到\
  \ SageMaker 模型注册表集合中，进一步创建不同类别的模型组。图 3-15 展示了 SageMaker 模型注册表的典型工作流程。\n\n![](img/609560_1_En_3_Fig15_HTML.png)\n\
  \n图 3-15\n\nAmazon SageMaker 模型注册表工作流程\n\n以下是 SageMaker 模型注册表的主要功能：\n    *   为生产环境编目模型\n\
  \n*   管理模型版本\n\n*   将元数据指标与模型关联\n\n*   管理模型的审批状态\n\n*   将模型部署到生产环境\n\n*   通过 CI/CD\
  \ 自动化模型部署\n\n### 在机器学习生命周期各阶段建立反馈循环\n\n为了在机器学习生命周期的各个阶段共享成功的开发试验、失败案例以及其他运营活动，建立反馈循环机制至关重要。这有助于在未来的机器学习工作流迭代中实现持续改进。机器学习从业者会在每个阶段分析机器学习实施情况，并随着时间的推移重新审视监控和再训练改进策略。为了达到最优结果，会使用不同的算法、超参数和数据增强方法进行各种模型训练实验。在迭代过程中，记录每个关键的学习成果和流程改进，以供将来参考。\n\
  \n#### 在机器学习生命周期各阶段实施反馈循环\n\n让我们使用 Amazon SageMaker 在机器学习生命周期各阶段实施一个反馈循环。\n\n#####\
  \ 建立 SageMaker 模型监控\n\n第一步是建立 Amazon SageMaker 模型监控系统。机器学习模型的准确性和性能会随时间衰减，这种现象称为*模型漂移*。许多因素都可能导致模型漂移，例如模型特征以及训练数据和推理数据之间的差异。Amazon\
  \ SageMaker 模型监控器会持续监控机器学习模型是否存在模型漂移和概念漂移。如果出现任何偏差，SageMaker 模型监控器会通知您，以便您进行必要的修正。\n\
  \n模型监控的不同入口如下所示。\n\n\n\n###### 使用 Amazon CloudWatch\n\n配置 Amazon CloudWatch 以响应性能变化。如果观察到模型或概念漂移，系统会自动生成通知。监控任务可以按小时或每天等固定间隔定期运行。它们会根据日志和指标生成可操作的洞察报告，并将其发送到\
  \ Amazon CloudWatch 仪表盘和 Amazon S3。\n\nAmazon CloudWatch 收集、分析并可视化在 AWS 上运行的各种应用程序、资源和服务的实时日志、指标和事件数据。所有这些数据都会显示在自动化的\
  \ CloudWatch 仪表盘上，以简化应用程序和基础设施的维护工作。如图 3-16 所示。\n\n![](img/609560_1_En_3_Fig16_HTML.jpg)\n\
  \n图 3-16\n\nAmazon CloudWatch\n\n以下示例代码演示了如何使用 Amazon SageMaker Python SDK 创建 Amazon\
  \ SageMaker CloudWatch 指标，以创建一个 CloudWatch 告警：\n\n```\nalarm_name = \"MODEL_QUALITY_F2_SCORE\"\
  \nalarm_desc = (\n\"当 f2 分数偏离基线约束时触发 CloudWatch 告警\"\n)\nmdoel_quality_f2_drift_threshold\
  \ = (\n0.625  ##有意将此阈值设置得较低，以便快速看到告警。\n)\nmetric_name = \"f2\"\nnamespace = \"aws/sagemaker/Endpoints/model-metrics\"\
  \ncw_client.put_metric_alarm(\nAlarmName=alarm_name,\nAlarmDescription=alarm_desc,\n\
  ActionsEnabled=True,\nMetricName=metric_name,\nNamespace=namespace,\nStatistic=\"\
  Average\",\nDimensions=[\n{\"Name\": \"Endpoint\", \"Value\": endpoint_name},\n\
  {\"Name\": \"MonitoringSchedule\", \"Value\": churn_monitor_schedule_name},\n],\n\
  Period=600,\nEvaluationPeriods=1,\nDatapointsToAlarm=1,\nThreshold=mdoel_quality_f2_drift_threshold,\n\
  ComparisonOperator=\"LessThanOrEqualToThreshold\",\nTreatMissingData=\"breaching\"\
  ,\n)\n```\n\n在上述代码模型中，设置了指标 f2，如果指标“f2 分数”偏离基线阈值 0.625，则会触发 CloudWatch 告警。通过使用 SageMaker\
  \ CloudWatch 控制台，一旦 CloudWatch 告警被触发，您可以采取补救措施，例如自动重新训练模型或更新训练数据集。\n\n###### 使用\
  \ Amazon SageMaker 模型仪表盘\n\nAmazon SageMaker 模型仪表盘从每个模型中提取高级详细信息，并显示其全面的摘要。它是一个用于跟踪、监控和审查模型性能的中央界面，并在出现质量问题时通知您。如果您的模型已部署用于推理，该仪表盘可帮助您实时跟踪模型的性能和端点，如图\
  \ 3-17 所示。\n\n![](img/609560_1_En_3_Fig17_HTML.jpg)\n\n图 3-17\n\nSageMaker 模型工作状态\n\
  \nAmazon SageMaker 模型仪表盘通过以下类型的漂移监控来显示模型监控状态值：\n\n*   监控**数据漂移**以维护数据质量。\n*   监控**模型漂移**以获得最佳的模型质量指标，例如准确率。\n\
  *   监控生产环境中模型的**偏差漂移**。\n*   监控生产环境中模型的**特征归因漂移**。\n\n以下示例演示了如何创建 Amazon SageMaker\
  \ 模型监控器，以从 Amazon SageMaker 端点捕获实时推理数据。\n\n```\nfrom sagemaker.model_monitor import\
  \ DataCaptureConfig\ndata_capture_config = DataCaptureConfig(\nenable_capture=True,\n\
  sampling_percentage=100,\ndestination_s3_uri='s3://path/for/data/capture'\n)\npredictor\
  \ = model.deploy(\ninitial_instance_count=1,\ninstance_type='ml.m4.xlarge',\ndata_capture_config=data_capture_config\n\
  )\n```\n\n为了监控模型数据质量，需要捕获数据，这可以通过使用名为 `DataCaptureConfig` 的新捕获选项来完成。通过此设置在交付到端点时，您可以捕获请求负载、响应负载或两者。\n\
  \n这些负载保存在 `DataCaptureConfig` 中指定的 Amazon S3 位置。可以使用 Amazon S3 中的 `S3Downloader`\
  \ 实用程序查看和下载捕获的数据。\n\n###### 自动化重新训练管道\n\n创建一个 CloudWatch 事件规则，该规则对 SageMaker 模型监控系统发出的事件发出告警。该事件规则可以检测漂移或异常，并启动重新训练管道。\n\
  \n##### 使用 Amazon Augmented AI (A2I)\n\nAmazon Augmented AI (Amazon A2I) 允许您根据特定要求进行人工审核，以建立机器学习\
  \ (ML) 系统的真实基准。A2I 保证了 ML 模型的精度并检查其准确性，模型性能可以与之进行比较。见图 3-18。\n\n![](img/609560_1_En_3_Fig18_HTML.jpg)\n\
  \n图 3-18\n\nAmazon Augmented AI (A2I)\n\n### 审查公平性和可解释性\n\n在 ML 生命周期的每个阶段，金融服务、零售、电子商务、医疗保健、教育和人力资源等领域都期望具备公平性和可解释性。拥有偏见更少、更易于理解的机器学习模型，并满足治理合规性和外部监管要求，这一点非常重要。以下是需要检查以确保公平性和可解释性的法规：\n\
  \n*   目标应该是可解释且更公平的。\n*   机器学习算法应该是一个合乎道德的解决方案。\n*   检查标签和特征中的偏差。\n*   数据应来自多样化的群体，并且易于修改数据以减轻偏差。\n\
  *   需要训练不同数量的模型以减轻偏差。\n*   需要使用相关的公平性指标来评估模型。\n*   模型需要在其需要训练或评估的数据上进行部署。\n*   检查\
  \ ML 解决方案在不同用户之间是否存在不平等的影响。\n\n\n\n#### 实施计划\n\n接下来，我们将介绍一些可用于实施建议的 AWS 服务。\n\n\
  ##### Amazon SageMaker Clarify\n\nAmazon SageMaker Clarify 提供了专用工具，用于更深入地洞察数据和机器学习模型、调试预测，并为机器学习模型预测添加可解释性。SageMaker\
  \ Clarify 有助于在机器学习生命周期的每个阶段识别偏差，并改进准确性和鲁棒性等指标，从而提升模型质量。\n\n对于表格数据、计算机视觉和时间序列模型，SageMaker\
  \ Clarify 提供偏差和可解释性报告，以识别潜在问题，从而有针对性地提高准确性、消除偏差并提升性能。\n\nAmazon SageMaker Clarify\
  \ 在机器学习工作流生命周期的多个阶段运行处理作业，以计算以下分析类型：\n\n*   训练前偏差指标\n*   训练后偏差指标\n*   Shapley 值\n\
  *   部分依赖图 (PDP)\n\nSageMaker Clarify 处理容器作业与包含输入数据集的 Amazon S3 存储桶以及（可选）部署到 SageMaker\
  \ 推理端点的客户模型进行交互，如图 3-19 所示。\n\n![](img/609560_1_En_3_Fig19_HTML.jpg)\n\n图 3-19\n\
  \nAmazon SageMaker Clarify\n\n借助 Shapley 加法解释 (SHAP) 的有效实现，SageMaker Clarify 采用了一种与模型无关的特征归因技术，使您能够执行以下操作：\n\
  \n*   识别治理合规性所需的公平性和可解释性要求。\n*   帮助识别潜在问题，并在机器学习生命周期的每个阶段（如数据收集、训练前、训练后、模型调优和已部署模型的监控）衡量偏差。\n\
  *   确定训练数据在特征、类别或群体段方面是否不平衡。\n*   当模型投入生产时，战略性地监控数据中的偏差。\n*   对于可解释性，最简单的模型效果最好。模型复杂性和可解释性之间始终需要权衡。\n\
  *   生成易于理解且稳健的模型治理报告，面向风险与合规团队以及外部监管机构。\n*   基于数据、模型和监控提供预测的解释。\n\n以下示例代码演示了如何使用\
  \ `Amazon SageMaker Python SDK` 创建一个用于检测偏差的 Amazon SageMaker Clarify。\n\n```\nfrom\
  \ sagemaker import clarify\n# 初始化一个 SageMakerClarifyProcessor 以计算偏差指标和模型解释。\nclarify_processor\
  \ = clarify.SageMakerClarifyProcessor(\nrole=role, instance_count=1, instance_type=\"\
  ml.m5.xlarge\", sagemaker_session=sagemaker_session\n)\nbias_config = clarify.BiasConfig(\n\
  label_values_or_threshold=[1], facet_name=\"Sex\", facet_values_or_threshold=[0],\
  \ group_name=\"Age\"\n)\nclarify_processor.run_bias(\ndata_config=bias_data_config,\n\
  bias_config=bias_config,\nmodel_config=model_config,\nmodel_predicted_label_config=predictions_config,\n\
  pre_training_methods=\"all\",\npost_training_methods=\"all\",\n)\nclarify_processor.run_explainability(\n\
  data_config=explainability_data_config,\nmodel_config=model_config,\nexplainability_config=shap_config,\n\
  )\n```\n\nSageMaker Clarify 帮助您使用 `Bias_config`、`model_config` 和其他参数检测可能的训练前和训练后偏差。BiasConfig\
  \ 包含使用 Clarify 容器检测偏差的配置值。参数 `pre_training_methods` 设置为 \"all\" 以获取所有训练前偏差，参数 `post_training_methods`\
  \ 设置为 \"all\" 以获取所有训练后偏差。Clarify 进程运行 `run_explainability` 来执行可解释性预测。所有偏差报告和可解释性报告都可以在\
  \ SageMaker Studio 中查看。\n\n### 创建跟踪和版本控制机制\n\n在机器学习模型开发中，需要探索并使用不同的数据、算法和参数组合进行迭代。随着每一次增量更改，都需要观察并跟踪不同配置设置下的模型准确性。有时，过多的实验会导致模型开发和演进过程失去跟踪。Amazon\
  \ SageMaker 提供多种服务来跟踪、记录、自动化以及对不同的机器学习流程和改进进行版本控制，以便将来参考和重用。\n\n#### 跟踪、版本控制和自动化的实施计划\n\
  \n让我们使用 Amazon SageMaker 来跟踪、版本控制并自动化机器学习模型开发周期。\n\n##### 使用 SageMaker Experiments\
  \ 跟踪您的机器学习实验\n\n使用 Amazon SageMaker Experiments 可以轻松进行机器学习实验。它有助于创建、管理、分析和比较不同的机器学习实验。SageMaker\
  \ Experiments 自动将所有输入、参数、配置和不同的迭代（作为运行）及其结果进行跟踪。这些迭代运行可以被分配、分组并组织到 SageMaker Experiments\
  \ 中。它还提供了一个可视化界面，用于浏览您当前和过去的实验、比较关键性能指标上的运行情况，并识别与 Amazon SageMaker Studio 集成的最佳性能模型。\n\
  \nSageMaker Experiments 旨在简化创建实验、用试验填充实验、添加跟踪和谱系信息，以及跨实验和试验运行分析的过程。Amazon SageMaker\
  \ Experiments 包含以下组件：\n\n*   实验\n*   试验\n*   试验组件\n*   跟踪器\n\n以下部分是示例代码，演示如何使用 SageMaker\
  \ Python SDK 运行 SageMaker Experiment。\n\n```\nclasssagemaker.experiments.Run(experiment_name,\
  \ run_name=None, experiment_display_name=None, run_display_name=None, tags=None,\
  \ sagemaker_session=None, artifact_bucket=None, artifact_prefix=None)\n```\n\n要运行一个实验实例，需要使用各种配置和日志参数初始化\
  \ `classsagemaker.experiments.Run`，以便在此 Run 对象的上下文中调用训练作业。\n\n\n\n##### 使用 SageMaker\
  \ Processing\n\nAmazon SageMaker Processing 用于数据分析、各类数据处理，以及附带机器学习模型评估的文档处理。它还用于数据验证、特征工程和模型解释。Amazon\
  \ SageMaker Processing 为数据处理工作负载（特征工程、数据验证、模型评估和模型解释）提供了简化且托管的体验。Amazon SageMaker\
  \ Processing API 既可在实验阶段使用，也可在代码部署到生产环境后用于评估性能。\n\nAmazon SageMaker 会启动一个 Processing\
  \ 任务，从 Amazon Simple Storage Service (Amazon S3) 复制数据，然后拉取一个处理容器。Amazon SageMaker\
  \ 完全管理 Processing 任务的底层基础设施。Processing 任务的输出存储在 Amazon S3 存储桶中，如图 3-20 所示。\n\n![](img/609560_1_En_3_Fig20_HTML.jpg)\n\
  \n图 3-20\n\nAmazon SageMaker Processing 任务\n\n以下示例代码演示了如何使用 SageMaker Python SDK\
  \ 运行 SageMaker Processing 任务：\n\n```\nfrom sagemaker.spark.processing import PySparkProcessor\n\
  # 将原始输入数据集上传到唯一的 S3 位置\ntimestamp_prefix = strftime(\"%Y-%m-%d-%H-%M-%S\", gmtime())\n\
  prefix = \"sagemaker/spark-preprocess-demo/{}\".format(timestamp_prefix)\ninput_prefix_abalone\
  \ = \"{}/input/raw/abalone\".format(prefix)\ninput_preprocessed_prefix_abalone =\
  \ \"{}/input/preprocessed/abalone\".format(prefix)\nsagemaker_session.upload_data(\n\
  path=\"./data/abalone.csv\", bucket=bucket, key_prefix=input_prefix_abalone\n)\n\
  # 运行处理任务\nspark_processor = PySparkProcessor(\nbase_job_name=\"sm-spark\",\nframework_version=\"\
  3.1\",\nrole=role,\ninstance_count=2,\ninstance_type=\"ml.m5.xlarge\",\nmax_runtime_in_seconds=1200,\n\
  )\nspark_processor.run(\nsubmit_app=\"./code/preprocess.py\",\narguments=[\n\"--s3_input_bucket\"\
  ,\nbucket,\n\"--s3_input_key_prefix\",\ninput_prefix_abalone,\n\"--s3_output_bucket\"\
  ,\nbucket,\n\"--s3_output_key_prefix\",\ninput_preprocessed_prefix_abalone,\n],\n\
  spark_event_logs_s3_uri=\"s3://{}/{}/spark_event_logs\".format(bucket, prefix),\n\
  logs=False,\n)\n```\n\n`PySparkProcessor` 类通过 `sagemaker.spark.processing.PySparkProcessor`\
  \ 定义。`PySparkProcessor` 类用于定义 Spark 任务并通过 SageMaker Processing 运行它。这是一个通过 `instance_count`\
  \ 和 `instance_type` 参数指定的多节点任务。`Spark_processor` 使用所有输入和输出存储桶参数运行预处理脚本。\n\n#####\
  \ 将 Notebook 实例与 Git 仓库关联\n\nSageMaker Notebook 保存数据处理代码和相关文档。这些 Notebook 实例可以与\
  \ Git 仓库关联，以便在源代码控制环境中保存 Notebook。将 SageMaker Notebook 实例保存到 Git 仓库后，即使停止或删除 Notebook\
  \ 实例，这些 Notebook 也会持久保留。一个 Notebook 实例可以关联一个默认仓库以及最多三个额外的仓库，例如 AWS CodeCommit、GitHub\
  \ 或任何其他 Git 服务器。\n\n将 Notebook 实例与 Git 仓库关联，以便在源代码控制环境中实现持久化、学习和协作。Notebook 实例可以通过两种方式与\
  \ Git 仓库关联：\n\n*   您可以将 Git 仓库作为资源添加到您的 Amazon SageMaker 账户中。然后，您可以输入一个包含凭据的 AWS\
  \ Secrets Manager 密钥，以获取对该仓库的访问权限。通过这种方式，可以访问需要身份验证的仓库。\n\n*   链接一个公开可访问的 Git 仓库，该仓库不是您账户的资源。如果这样做，您将无法提供登录凭据来访问该仓库。\n\
  \n##### 使用 SageMaker Model Registry\n\nAmazon SageMaker Model Registry 用于对模型进行编目、管理和部署。通过创建包含模型不同版本的\
  \ SageMaker Model Registry 模型组来对模型进行编目。每次运行机器学习流水线时都会创建一个模型组，不同的模型版本会在该模型组下注册。\n\
  \n所有为解决特定问题而训练的模型都作为模型版本注册到模型组下。这些模型组可以进一步归类到一个或多个 Model Registry 集合中。一个典型的 SageMaker\
  \ Model Registry 工作流程可能如图 3-21 所示。\n\n![](img/609560_1_En_3_Fig21_HTML.png)\n\n\
  图 3-21\n\nAmazon SageMaker Model Registry 工作流程\n\n以下是 SageMaker Model Registry 的主要功能：\n\
  \n*   为生产环境编目模型。\n\n*   管理模型版本。\n\n*   将训练指标等元数据与模型关联。\n\n*   管理模型的审批状态。\n\n*  \
  \ 将模型部署到生产环境。\n\n*   通过 CI/CD 自动化模型部署。\n\n以下示例代码演示了如何使用 SageMaker Python SDK 创建\
  \ SageMaker 模型组。\n\n```\nimport time\nimport os\nfrom sagemaker import get_execution_role,\
  \ session\nimport boto3\nregion = boto3.Session().region_name\nrole = get_execution_role()\n\
  sm_client = boto3.client('sagemaker', region_name=region)\nmodel_package_group_name\
  \ = \"scikit-iris-detector-\" + str(round(time.time()))\nmodel_package_group_input_dict\
  \ = {\n\"ModelPackageGroupName\" : model_package_group_name,\n\"ModelPackageGroupDescription\"\
  \ : \"Sample model package group\"\n}\ncreate_model_package_group_response = sm_client.create_model_package_group(**model_package_group_input_dict)\n\
  print('ModelPackageGroup Arn : {}'.format(create_model_package_group_response['ModelPackageGroupArn']))\n\
  ```\n\n设置 SageMaker Boto3 客户端以调用 `create_model_package_group` API 操作，并指定名称和描述作为参数来创建模型组。`create_model_package_group`\
  \ 调用的响应是新模型组的 Amazon 资源名称 (ARN)。\n\n### 通过 MLOps 和 CI/CD 自动化运维\n\n为了自动化机器学习工作负载的运维，需要集成适当的\
  \ MLOps 机制以及带有 CI/CD 管道的部署。正如我们之前讨论的，自动化机器学习运维使用基础设施即代码 (IaC) 和配置即代码 (CaC)。这种方法确保开发人员将基础设施和配置视为代码，从而在您的预演和生产部署环境中提供一致性。这实现了对托管基础设施和模型可观测性的版本控制。\n\
  \n#### 自动化运维的实施计划\n\n您可以通过两种方式对应用程序进行建模和配置。\n\n##### 使用 AWS CloudFormation\n\nAWS\
  \ CloudFormation 使您能够通过将 IaC 视为代码来创建、建模、配置和管理 AWS 部署。这可以通过使用模板文件来以可预测且可重复的方式将一组资源作为一个单元（堆栈）进行创建和删除。使用\
  \ AWS CloudFormation，基础设施可以轻松地在全球范围内扩展，并且可以通过单个操作轻松地在多个 AWS 账户和 AWS 区域中配置和管理堆栈。参见图\
  \ 3-22。\n\n![](img/609560_1_En_3_Fig22_HTML.jpg)\n\n图 3-22\n\nAWS CloudFormation\n\
  \n\n\n##### 使用 AWS 云开发工具包 (AWS CDK)\n\nAWS 云开发工具包 (AWS CDK) 是一个开源软件开发框架，用于以代码形式指定云基础设施，并通过\
  \ AWS CloudFormation 进行配置。使用 AWS CDK，您可以使用熟悉的编程语言（如 TypeScript、JavaScript、Python、Java、C#/.Net\
  \ 和 Go）来定义云资源并开发应用程序。\n\nAWS CDK 利用通用编程语言强大的表达能力，在云中开发可靠、可扩展且经济高效的应用程序。AWS CDK 主要由两部分组成：\n\
  \n![](img/609560_1_En_3_Fig23_HTML.jpg)\n\n图 3-23\n\nAWS 云开发工具包 (AWS CDK)\n\n* \
  \  **AWS CDK 构造库：** 一个包含预编写和可重用模块（称为*构造*）的集合，用于以简化的方式快速修改、集成和开发您的基础设施。\n\n*   **AWS\
  \ CDK 工具包：** 一个命令行工具，用于与 CDK 应用程序交互，以创建、管理和部署 AWS CDK 项目。参见图 3-23。\n\n可根据您的 ML 工作流程选择多种\
  \ MLOps 策略。\n\n##### 使用 SageMaker Pipelines 编排工作流程\n\n使用 Amazon SageMaker Pipelines，可以通过\
  \ Python SDK 创建 ML 工作流程。可以使用 Amazon SageMaker Studio 可视化 SageMaker Pipelines，并轻松管理端到端的\
  \ ML 工作流程。Amazon SageMaker Pipelines 会记录 ML 工作流程的每一步，并通过重用工作流程步骤来加快扩展速度。它会为所有模型组件（如训练数据、平台配置、模型参数和学习梯度）创建审计跟踪，以便重新创建模型。\n\
  \n以下示例演示了如何使用 SageMaker Python SDK 创建 SageMaker Pipelines 来编排您的工作流程。\n\n```\nbase_job_prefix\
  \ = \"pipeline-experiment-sample\"\nmodel_package_group_name = \"pipeline-experiment-model-package\"\
  \nprocessing_instance_count = ParameterInteger(\nname=\"ProcessingInstanceCount\"\
  , default_value=1\n)\ntraining_instance_count = ParameterInteger(\nname=\"TrainingInstanceCount\"\
  , default_value=1\n)\nprocessing_instance_type = ParameterString(\nname=\"ProcessingInstanceType\"\
  , default_value=\"ml.m5.xlarge\"\n)\ntraining_instance_type = ParameterString(\n\
  name=\"TrainingInstanceType\", default_value=\"ml.m5.xlarge\"\n)\n```\n\n在前面的代码中，我们指定了允许您在运行时传递参数的管道。这里定义了用于处理和训练的运行时实例计数和类型，以及预定义的默认值。\n\
  \n##### 使用 AWS Step Functions\n\nAmazon SageMaker 使用一个名为 AWS Step Functions Data\
  \ Science SDK 的开源包来自动化机器学习模型的训练。在 AWS Step Functions 中，定义了生产就绪型 ML 工作流程的所有步骤，并设置了启动流程的警报。它允许您复制该工作流程，试验新选项，然后将优化后的工作流程投入生产。\n\
  \n为了大规模编排 AWS 基础设施，可以使用 Python 语言在 AWS Step Functions 中创建多步骤机器学习工作流程。无需单独配置和集成 AWS\
  \ 服务。AWS Step Functions Data Science SDK 提供了一个 Python API，可以创建和调用 Step Functions\
  \ 工作流程。这些工作流程可以直接在 Python 和 Jupyter notebook 中轻松管理和执行。参见图 3-24。\n\n![](img/609560_1_En_3_Fig24_HTML.jpg)\n\
  \n图 3-24\n\nAWS Step Functions\n\n以下是 AWS Step Functions Data Science SDK 的主要功能：\n\
  \n*   直接在 Python 中轻松使用 AWS 基础设施构建和运行机器学习工作流程。\n*   实例化常见的训练管道。\n*   使用模板在 Jupyter\
  \ Notebook 中创建常见的机器学习工作流程。\n\n以下部分是示例代码，演示了如何在 AWS Step Functions Data Science SDK\
  \ 中创建和执行工作流程。\n\n```\nworkflow.create()\nexecution = workflow.execute(inputs={\n\
  \"IsHelloWorldExample\": True\n})\n```\n\n命令 `workflow.create` 用于在 AWS Step Functions\
  \ 中创建工作流程。要执行该工作流程，请在 AWS Step Functions 中执行命令 `workflow.execute`。\n\n##### 使用第三方工具\n\
  \n为了自动化模型训练和开发，可以使用一些与 AWS 服务 API 集成的第三方部署编排工具，例如 Apache Airflow。这个第三方工具，即 Amazon\
  \ Managed Workflows for Apache Airflow (Amazon MWAA)，使用用 Python 编写的有向无环图 (DAG) 来编排您的工作流程。DAG、插件和\
  \ Python 依赖项存放在 Amazon Simple Storage Service (S3) 存储桶中。可以从 AWS 管理控制台、Apache Airflow\
  \ 用户界面 (UI)、命令行界面 (CLI) 或软件开发工具包 (SDK) 运行和监控 DAG。参见图 3-25。\n\n![](img/609560_1_En_3_Fig25_HTML.jpg)\n\
  \n图 3-25\n\nAmazon Managed Workflows for Apache Airflow (Amazon MWAA)\n\nApache\
  \ Airflow 部署提供了可扩展性、可用性和安全性，而不会带来管理底层基础设施的操作负担。\n\n### 建立部署环境指标\n\n衡量已部署环境中机器学习操作的性能至关重要。需要测量各种指标，如内存和\
  \ CPU/GPU 使用率、磁盘利用率、ML 端点调用次数和延迟，以确定性能。\n\n#### 建立部署环境指标的实施计划\n\n让我们制定一个部署环境指标的实施计划。\n\
  \n##### 记录性能相关指标\n\n第一步是使用 AWS 监控和可观测性服务记录性能相关指标。这些指标包括慢查询、各种数据库事务、I/O 延迟、服务延迟、HTTP\
  \ 请求吞吐量以及其他关键数据。\n\n##### 在事件或事故发生时分析指标\n\n每当任何事件触发时，使用监控仪表板和报告来详细了解该事件及其影响。使用监控仪表板来理解和诊断已发生事故的影响非常重要。这些仪表板视图可以深入了解工作负载中未按预期运行的部分。\n\
  \n##### 建立关键绩效指标 (KPI)\n\n建立和识别关键绩效指标 (KPI) 非常重要，这些指标可以指示工作负载是否按预期运行。KPI 因行业而异。电子商务网站可能会选择将购买次数作为其\
  \ KPI，而基于 API 的工作负载可能会将整体响应延迟作为整体性能的指标。\n\n##### 使用监控生成基于警报的通知\n\n使用针对已定义 KPI 的监控指标来自动生成基于警报的通知。当已定义\
  \ KPI 的测量值超出预期范围时，会自动生成这些警报以进行通知。\n\n##### 定期审查指标\n\n定期审查在解决问题和响应不同事件或事故中起关键作用的指标，应成为日常维护的一部分。此外，确定需要添加的任何其他指标也很重要，这些指标有助于识别、解决或预防问题。\n\
  \n##### 主动监控和告警\n\n结合使用 KPI 与告警和监控系统来处理与性能相关的问题。使用警报启动自动操作，以尽可能修复问题。如果无法进行自动响应，则升级警报。使用系统预测预期的\
  \ KPI 值，生成警报，并在 KPI 超过预期值时自动停止或回滚部署。\n\n\n\n##### 使用 Amazon CloudWatch 指标\n\nAmazon\
  \ CloudWatch 旨在观测和监控 AWS、本地及其他云环境中的资源和应用程序。使用适用于 SageMaker 端点的 Amazon CloudWatch\
  \ 指标来确定内存、CPU 使用率和磁盘利用率。设置 CloudWatch 仪表盘以可视化环境指标，并建立 CloudWatch 告警，通过 Amazon SNS\
  \ 发起警报通知，以告知运行时环境中发生的事件。更多详情，请参阅“`使用 Amazon CloudWatch`”一节。\n\n可以在 Amazon CloudWatch\
  \ 中创建两种类型的告警。\n\n*   用于监控单个 CloudWatch 指标的指标告警\n*   一种复合告警，它会考虑您已创建的其他告警的告警状态。\n\
  \n##### 使用 Amazon EventBridge\n\nAmazon EventBridge 是一个跨 AWS 的无服务器事件驱动型应用程序，可帮助您自动接收、过滤、转换、路由、交付和响应事件。当计算环境容量超过定义的阈值时，就会发生这些事件。参见图\
  \ 3-26。\n\n![](img/609560_1_En_3_Fig26_HTML.jpg)\n\n图 3-26\n\nAmazon EventBridge\n\
  \n借助 Amazon EventBridge Scheduler，可以从单一来源创建、触发和管理数百万个事件和任务。\n\n##### 使用 AWS Application\
  \ Cost Profiler\n\n使用 AWS Application Cost Profiler 报告多租户应用程序的精细成本洞察以及每个租户（模型/用户）的成本。它使您能够跟踪软件应用程序使用的共享\
  \ AWS 资源的消耗情况，并报告跨租户群的精细成本细分。\n\n采用共享基础设施方法，您可以在实现规模经济的同时，直接获取跨多个维度的资源消耗综合数据，这为精确的成本分配模型奠定了基础。参见图\
  \ 3-27。\n\n![](img/609560_1_En_3_Fig27_HTML.jpg)\n\n图 3-27\n\nAWS Application Cost\
  \ Profiler\n\n以下是 AWS Application Cost Profiler 的主要功能。\n\n*   成本效益\n*   精确成本分配模型的基础\n\
  *   灵活的数据收集\n*   利润分析\n*   为最终客户定制定价策略\n\nAWS Application Cost Profiler 分析租户元数据，并按日和周生成每个租户的每小时成本细分。您可以按所需频率接收详细数据，并通过编程方式使用这些数据创建自己的仪表盘，以按租户跟踪费用模式和利润率。借助\
  \ Application Cost Profiler，可以调整产品定价、设计和成本数据，以最大限度地提高采用率和盈利能力。\n\n### 启用模型可观测性与跟踪\n\
  \n启用模型可观测性、监控机制和主动跟踪，以识别和避免推理问题。由于不同的漂移，ML 模型的性能会随时间推移而下降。因此，衡量托管在实时推理端点上的底层计算资源的运行健康状况至关重要。建立血缘关系以追溯\
  \ ML 工作流程的所有步骤，并存储所有版本化的输入和模型工件以供分析。\n\n#### 启用模型可观测性与跟踪的实施计划\n\n让我们使用以下资源来启用模型可观测性与跟踪。\n\
  \n##### 使用 Amazon SageMaker Model Monitor\n\nAmazon SageMaker Model Monitor 持续跟踪生产环境中\
  \ Amazon SageMaker ML 模型的质量。它将生产环境中的模型结果与训练结果进行比较，以评估性能。更多详情，请参阅“建立 SageMaker 模型监控”一节。\n\
  \n##### 使用 Amazon CloudWatch\n\nAmazon SageMaker Model Monitor 自动将指标发送到 Amazon CloudWatch，以便您可以收集和分析\
  \ ML 模型的使用统计信息。更多详情，请参阅“使用 Amazon CloudWatch”一节。\n\n##### 使用 SageMaker 模型仪表盘\n\n\
  Amazon SageMaker 模型仪表盘从每个模型中提取高级详细信息并显示其全面摘要。它跟踪托管在实时推理端点上的模型性能，并使用 Amazon SageMaker\
  \ Model Monitor 设置监控。\n\n它可以发现数据质量或模型质量出现退化，或出现任何偏差漂移的模型。更多详情，请参阅“使用 Amazon SageMaker\
  \ 模型仪表盘”一节。\n\n##### 使用 Amazon SageMaker Clarify\n\n当生产环境中出现特征归因或模型偏差漂移时，Amazon\
  \ SageMaker Clarify 会检测并跟踪多种类型的推理。SageMaker Clarify 提供生成模型治理报告的工具，这些报告用于告知合规团队和外部监管机构相关风险。更多详情，请参阅“Amazon\
  \ SageMaker Clarify”一节。\n\n##### 使用 SageMaker ML 血缘跟踪跟踪模型管道\n\n血缘跟踪创建 ML 工作流程的所有步骤，从数据准备到模型部署。它还存储有关所有\
  \ ML 工作流程步骤的信息。它保留模型发现实验的历史记录，并跟踪模型血缘工件以进行审计和合规性验证，从而建立模型治理。更多详情，请参阅“建立血缘跟踪系统”一节。\n\
  \n##### 使用 SageMaker 模型卡\n\nAmazon SageMaker 模型卡用于在一个地方收集模型信息，如业务需求、关键决策以及模型开发和评估过程中的观察结果，以实现简化的治理和报告。目录信息包括模型的预期用途和风险评估、训练规范和指标、评估结果和观察结果，以及额外的标注，如注意事项、建议和自定义信息。\n\
  \n以下是 Amazon SageMaker 模型卡的功能：\n\n*   提供关于应如何使用模型的指导\n*   支持审计活动并收集模型训练和性能的所有详细描述\n\
  *   传达模型如何实现业务目标\n\n##### 使用 Amazon SageMaker 的自动验证功能\n\n借助 Amazon SageMaker 的自动验证功能，您可以通过实时使用相同的真实世界推理请求数据，将新模型的性能与生产模型进行比较。Amazon\
  \ SageMaker 将生产模型收到的相同推理请求路由到新模型。然后，它会生成关键指标上的性能差异，并实时显示在仪表盘上。\n\n### 同步架构与配置\n\n\
  在开发和部署阶段，所有系统和配置的同步是必要的。否则，系统架构的差异可能导致相同算法产生不同的推理结果。确保模型在开发、预发布和生产环境中获得相同范围的准确性至关重要。检查环境间的偏差是必要且正常的。\n\
  \n\n#### 架构与配置同步实施方案\n\n下一节将介绍一些可用于同步和配置的 AWS 服务。\n\n##### 使用 AWS CloudFormation\n\
  \nAWS CloudFormation 能够快速且一致地预配置一组相关的 AWS 和第三方资源，并通过将其视为基础设施即代码来管理其整个生命周期。CloudFormation\
  \ 使用模板将整个堆栈作为单个单元进行创建、更新和删除。AWS CloudFormation 可以轻松管理和预配置堆栈，并在多个 AWS 环境中同步架构和配置。更多详情，请参阅“使用\
  \ AWS CloudFormation”一节。\n\n以下是 AWS CloudFormation 的主要特性：\n\n*   AWS CloudFormation\
  \ 标准化了 AWS 资源的创建方法。\n*   可以使用现有的 CloudFormation 模板重新创建类似的堆栈，从而轻松复制您的 AWS 架构开发、测试和生产环境。\n\
  *   CloudFormation 提供了多种工具来定义参数、映射和条件，并提供定制化功能以提高模板的可重用性。\n*   如果在堆栈创建过程中发生任何错误，CloudFormation\
  \ 会自动回滚已创建或更新的资源。\n*   CloudFormation 以快速、安全且可靠的机制处理故障。\n*   可以轻松创建 CI/CD 管道，将基础设施代码作为软件项目进行管理，并使用\
  \ CloudFormation 自动化部署变更。\n\n##### 使用 Amazon SageMaker Model Monitor\n\nSageMaker\
  \ Model Monitor 使用 Amazon 持续监控生产环境中机器学习模型的质量。通过 SageMaker Model Monitor，将生产模型的结果与训练结果进行比较。如果模型出现任何偏差，则会触发质量警报。及时检测结果偏差使工程师能够采取纠正措施，例如重新训练模型、审计上游系统以及修复质量问题，而无需手动监控模型或构建额外的工具。更多详情，请参阅“建立\
  \ SageMaker 模型监控”一节。\n\nModel Monitor 提供以下类型的监控：\n\n*   监控数据质量的漂移\n*   监控模型指标的漂移\n\
  *   监控生产环境中模型偏差的漂移\n*   监控生产环境中模型特征归因的漂移\n\n"
- "# 4. AI/ML 中的 MLOps 安全\n\n我们已经学习了如何以卓越的运营能力将机器学习模型部署到生产环境。在实现这一里程碑之后，是时候确保整个 ML\
  \ 系统的安全性和保障性了。\n\nMLSecOps 是机器学习运维与安全的融合。在本章中，我们将介绍 MLSecOps 的关键方面、其在 ML 生命周期不同层级的重要性，以及\
  \ ML 系统可能面临的安全挑战。我们还将研究实施 MLSecOps 所需遵循的最佳实践，以及如何在 AWS 中实现它，并提供代码片段作为参考。\n\n机器学习工程师负责确保\
  \ ML 系统的安全，因为系统随着时间的推移在技术上变得越来越先进和智能。ML 系统中的安全至关重要，需要在多个层面实施，以建立安全端到端 ML 系统的基础。在本主题中，我们将了解\
  \ ML 系统中的各种安全挑战、MLSecOps 的支柱，以及实现高度安全和可靠的机器学习生态系统的最佳实践。\n\n## MLOps 安全简介\n\nMLOps\
  \ 中的安全（图 4-1）意味着对 ML 模型、数据和 ML 系统基础设施实施安全措施，以保护它们免受入侵者和漏洞的攻击。ML 模型在训练、调优和部署等不同阶段都容易受到攻击，这可能导致恶意利用、数据泄露或模型结果被篡改。随着\
  \ ML 应用在各个领域和行业的增加，应对其独特的安全挑战变得至关重要。\n\n![](img/609560_1_En_4_Fig1_HTML.jpg)\n\n\
  图 4-1\n\nMLSecOps\n\nMLOps（机器学习运维）与安全运维的融合产生了 MLSecOps（机器学习安全运维）。MLSecOps 通过将传统方法与新实践相结合，将安全置于系统的核心。通过将安全最佳实践和概念融入\
  \ ML 系统，MLSecOps 旨在降低这些风险。以下是 MLSecOps 涉及的关键方面：\n\n*   **威胁建模**\n\n在威胁建模中，识别出 ML\
  \ 系统和数据特有的潜在威胁和漏洞。\n\n*   **数据安全**\n\n数据安全确保用于推理和训练的数据是安全且私密的，包括访问控制、加密和适当的数据处理。\n\
  \n*   **安全编码**\n\n编码实践需要通过多层安全控制、输入验证和清理来确保安全，以防止注入攻击，并通过提供信息性消息的错误处理来确保透明度和可解释性。\n\
  \n*   **模型集成**\n\n这是实施措施以检测和防止对 ML 模型进行未经授权的攻击、更改或篡改的过程。\n\n*   **安全部署**\n\n开发的模型应在不损害安全性和完整性的情况下进行部署，通过应用安全配置和访问控制来实现。\n\
  \n*   **持续监控与检测**\n\n对 ML 系统进行持续监控可以检测数据和模型中的异常。持续的监控和检测有助于识别 ML 系统中的潜在攻击或任何未经授权的活动。\n\
  \n*   **协作与事件响应**\n\n对于安全的 ML 系统，安全团队、工程师和数据科学家必须协作，以符合安全要求和 MLSecOps 最佳实践。他们可以共同制定协议，以快速响应安全事件、调查安全漏洞并从攻击中恢复。\n\
  \n\n\n## MLSecOps 的重要性\n\n机器学习生命周期的每一步都容易受到安全威胁。我们的机器学习系统虽然高度发达且先进，但并非对安全威胁免疫。机器学习生命周期的每个层面都存在威胁，例如数据泄露、敏感信息泄露、模型操纵、输出操纵以及对抗性攻击。与机器学习安全相关的风险多样、复杂且严重，可能导致财务损失和声誉损害。因此，采取主动姿态对于降低这些风险、通过顶级的机器学习安全来保护组织资产至关重要。\n\
  \nMLSecOps 确保了 MLOps 生命周期中不同步骤的安全性。机器学习工程师需要在不同层面进行检查并采取各种行动，以确保机器学习系统的安全。\n\n1.\
  \  **业务理解**\n\n    明确团队成员的职责和角色。\n    *   确保数据科学家项目团队所需的合规级别。\n\n    *   确定所需数据的范围。\n\
  \n2.  **数据工程**\n    *   避免数据泄露。\n\n    *   持续检查来自不可信来源的数据修改。\n\n    *   持续检查敏感信息。\n\
  \n    *   持续检查对抗性攻击。\n\n3.  **模型开发**\n    *   确保用于训练模型的虚拟机或集群的安全性。\n\n    *   避免对机器学习模型的操纵。\n\
  \n    *   检查代码片段中的安全漏洞。\n\n4.  **模型评估**\n    *   持续检查模型输出操纵。\n\n    *   持续检查经过修改的数据输入，以确保获得适当的模型输出。\n\
  \n    *   持续检查来自恶意用户的对抗性行为，以防止机器学习系统被欺骗。\n\n5.  **模型部署**\n    *   确保模型包保存在安全的位置。\n\
  \n    *   在部署模型前检查运行环境。\n\n    *   保护模型加载/卸载的每一个实例的安全。\n\n6.  **监控与维护**\n    * \
  \  识别潜在的逆向工程攻击，保护您的业务价值安全。\n\n    *   检查并验证系统中使用的所有工具和技术。\n\n## 机器学习系统中的安全挑战\n\n\
  人工智能/机器学习系统面临五大主要挑战。\n\n1.  **数据投毒**\n\n数据是机器学习系统的基础。机器学习模型的效率和可预测性与其训练所依据的数据质量成正比。干净、无偏且全面的数据只存在于理想世界中。然而，在现实世界中，数据大多不完整、有偏、包含噪声，并且受到外部力量的投毒。我们有方法来处理不完整、有偏和包含噪声的数据，但投毒数据对机器学习系统的安全来说是一个严重问题。当模型接收到错误数据时，它会学到本不该学的东西。由于机器学习模型习得的模式被扭曲，部署后可能会出现不准确的预测和误报。\n\
  \n数据投毒有四种主要的攻击策略：\n    1.  **标签修改**\n\n在监督学习中，仅对任意数据点的标签进行修改，从而误导训练模型。\n\n2.  **数据修改**\n\
  \n在这种情况下，入侵者无法访问学习算法，但可以访问训练数据，因此他们可以修改训练数据集，从而导致训练模型被破坏。\n\n3.  **数据增强**\n\n在这种情况下，入侵者无法访问训练数据和学习算法，因此他们无法修改训练数据和算法，但可以向训练数据集中添加新数据。通过数据增强，训练模型很容易被破坏。\n\
  \n4.  **逻辑破坏**\n\n当入侵者可以访问学习模型时，他们可以破坏已实现的逻辑。\n\n2.  **规避攻击**\n\n规避攻击也称为对抗性攻击。在推理过程中，对机器学习模型最常见的一种攻击就是对抗性攻击。它可以通过人眼几乎无法察觉的微小变化轻易地欺骗人类。输入中的这种微小变化可以完全扰乱模型，导致机器学习模型对数据进行错误分类。规避攻击的一个典型例子是图像识别系统，在上传前更改图像的一些像素，导致模型无法准确分类结果。请参见图\
  \ 4-2。\n\n![](img/609560_1_En_4_Fig2_HTML.jpg)\n\n图 4-2\n\n对抗性攻击示例\n\n在这个例子中，输入图像像素的微小变化导致将“熊猫”的输入图像错误分类为“长臂猿”。\n\
  \n通过规避攻击，类别输出预测的置信度水平会受到很大影响。修改后的输入会导致错误的模型训练，从而导致新数据的错误分类。\n\n3.  **系统操纵**\n\n\
  大多数机器学习系统在运行期间都连接到互联网。这使得入侵者能够在训练期间攻击机器学习模型，并为其改变模型行为打开了窗口。这属于网络犯罪的范畴。网络攻击可能导致错误的输入和使用被篡改的参数进行训练，从而导致输出结果与预期不同。随着先进的机器学习系统的发展，网络犯罪也在增加，保护机器学习系统免受网络犯罪分子的侵害是一个实时的挑战。\n\
  \n尽管操纵在线机器学习系统并非那么简单，但它非常隐蔽和微妙，以至于受害者甚至不会意识到有其他人正在利用他们的系统。\n\n4.  **迁移学习攻击**\n\n\
  通常，预训练的机器学习模型被用于训练大量数据，因为对于大型数据集，训练时间呈指数级增长。使用这些预训练模型来训练新问题被称为*迁移学习*。这些预训练模型可以根据业务需求进行微调。由于消费者不知道这些预训练模型是使用哪些数据训练的，这为入侵者渗透并通过篡改训练数据来影响模型性能提供了机会。攻击者可以利用这一点，操纵或用恶意模型替换一个真实的模型。\n\
  \n5.  **数据机密性**\n\n在当今的数字世界中，确保数据的隐私和机密性至关重要。网络攻击者不仅会投毒数据，还会从训练数据集中提取现有数据。这被称为*输入推断*或*模型反转*。在数据即将用于机器学习建模之前提取数据，可能会使整个机器学习系统面临风险。\n\
  \n例如，在医疗领域，维护患者个人和医疗记录的隐私是一项重要要求，并且在许多国家受法律约束。泄露这些医疗记录会导致严重的数据信任问题，并对相关组织提出质疑。\n\
  \n\n\n## MLSecOps 的五大支柱\n\nMLSecOps 建立在五大坚实支柱之上（图 4-3）。各类组织通过实施这些 MLSecOps 支柱来建立稳健的安全实践并降低潜在风险。下面我们来详细讨论它们。\n\
  \n![](img/609560_1_En_4_Fig3_HTML.jpg)\n\n图 4-3\n\nMLSecOps 的五大支柱\n\n1.  **供应链安全**\n\
  \n供应链漏洞涉及与机器学习供应链各组件相关的风险，从数据收集到模型部署及其依赖项。供应链安全的关键方面包括：\n    1.  第三方库和依赖项\n\n2.\
  \  各种数据源的完整性\n\n3.  存储、传输和部署过程中的模型工件\n\n4.  硬件组件和基础设施\n\n2.  **机器学习模型溯源**\n\n机器学习模型溯源指的是机器学习系统在整个生命周期中的可追溯性、谱系、演化和可复现性。它涉及维护代码、数据、模型工件、基础设施、元数据和环境的记录，以确立模型的真实性和完整性。模型溯源的关键方面包括：\n\
  \    1.  追踪机器学习模型的版本历史\n\n2.  追踪训练数据、其来源、预处理和转换\n\n3.  记录模型开发步骤，包括特征工程、超参数调优和建模\n\
  \n4.  记录模型部署、环境、配置以及任何后续更新或修改\n\n3.  **模型治理与合规性**\n\nMLOps 与模型治理相互交织，涵盖一系列有助于安全部署机器学习模型的流程和框架。法规的严格程度取决于业务领域、机器学习模型的风险类别以及业务风险。健康与金融行业遵循严格的法规，因为它们面临较高的安全漏洞风险。如果机器学习模型在公司业务概念中扮演重要角色，那么模型治理与合规性需要比机器学习作用不明显的公司更为严格。\n\
  \n模型治理需要从一开始就融入机器学习生命周期的每一个步骤。模型治理涵盖模型的记录、审计、验证、批准和监控。尽管法规的严格程度和模型数量决定了模型治理应如何实施，但所有变体都具有以下共同方面：\n\
  \    1.  包含机器学习元数据的全面模型文档和报告\n\n2.  通过机器学习系统的自动审计来验证机器学习模型\n\n3.  数据隐私、保护、加密和访问控制\n\
  \n4.  持续监控和记录模型指标\n\n5.  遵守《通用数据保护条例》（GDPR）、《健康保险流通与责任法案》（HIPAA）或行业特定指南的法规要求\n\n\
  6.  潜在风险评估、管理、缓解和事件响应计划制定\n\n7.  通过融入道德规则，在机器学习开发过程中提供公平性、减少偏见、明确责任并保持开放性\n\n4.\
  \  **可信赖的人工智能系统**\n\nMLSecOps 专注于构建透明、可靠、负责且可解释的可信赖人工智能系统。它确保机器学习模型在向所有利益相关者保持透明的同时做出无偏见的决策。可信赖人工智能的关键方面包括：\n\
  \    1.  可解释的模型，以便用户理解其预测背后的原因\n\n2.  整个过程中公平且无偏见的结果\n\n3.  一个稳健且有韧性的人工智能系统，以应对安全挑战\n\
  \n4.  持续模型监控和模型性能评估，以识别任何退化或异常\n\n5.  **对抗性机器学习**\n\nMLSecOps 识别并缓解旨在操纵或欺骗机器学习模型的对抗性攻击。通过实施异常检测和对抗性训练等技术，企业可以提高其机器学习系统的韧性。对抗性机器学习的目标是保护机器学习系统免受入侵以及任何试图篡改或利用它们的行为。对抗性机器学习的关键方面包括：\n\
  \    1.  能够抵御对抗性攻击的稳健对抗性机器学习模型\n\n2.  数据或模型行为中的异常检测与缓解\n\n3.  对机器学习模型进行对抗性训练，以提高其应对未知攻击的能力和韧性\n\
  \n4.  通过在线学习和动态模型更新，持续学习并适应新威胁\n\n\n\n## MLSecOps 最佳实践\n\n在本节中，我们旨在提供最佳实践，以最大程度地降低人工智能中的安全风险，并减轻不期望的漏洞。通过遵循图\
  \ 4-4 中展示的实践，机器学习系统将能够释放其全部潜力，确保在所有工业领域中合乎道德且负责任地开发人工智能项目。以下是构建安全可靠的机器学习系统所需遵循的最佳实践。\n\
  \n![](img/609560_1_En_4_Fig4_HTML.jpg)\n\n图 4-4\n\nMLSecOps 最佳实践\n\n1.  **安全数据处理**\n\
  \n安全机器学习操作的第一步是安全数据处理。用于训练和推理的数据需要妥善处理，以保护其免受偏见、投毒、漏洞、盗窃和未经授权的访问。为确保数据安全，需要注意以下关键点：\n\
  \    1.  数据源需要可信，并仅对授权人员设置有限的访问控制。\n\n2.  敏感数据在存储以及整个机器学习生命周期传输过程中都需要进行适当加密。\n\n\
  3.  应定期进行数据访问审计，以检测任何未经授权的活动。\n\n2.  **机器学习模型保护与鲁棒性**\n\n机器学习模型容易受到攻击和操纵，从而导致错误的预测。为了做出无偏见、免受攻击和过拟合影响的正确预测，机器学习模型需要被恰当地设计、训练和保护。确保模型鲁棒性涉及构建能够抵御对抗性攻击、数据投毒和其他威胁的模型。保护机器学习模型并使其鲁棒的关键点如下：\n\
  \    1.  限制对机器学习模型参数和配置的访问控制，以确保模型完整性。\n\n2.  需要实施版本控制机制来跟踪机器学习模型的变更。\n\n3.  定期运行审计并评估模型性能，以检测任何异常、未经授权的活动或安全漏洞。\n\
  \n3.  **模型治理与可审计性**\n\n模型需要根据模型治理和合规性给出的最佳实践和标准进行开发和维护。为防止法律纠纷并维护利益相关者和客户的信心，必须遵守相关法律法规。模型治理和可审计性的关键方面如下：\n\
  \    1.  采用机器学习安全最佳实践，以识别潜在的偏见来源和模型性能瓶颈。\n\n2.  确保模型遵守法律和道德准则。\n\n3.  应强制执行诸如 GDPR\
  \ 或 HIPAA 等监管框架，以保护数据和模型。\n\n4.  **持续监控与告警**\n\n在 MLOps 中，持续监控和告警对于定期评估模型性能、数据输入和输出至关重要。它们有助于检测模型性能的任何变化以及潜在的安全威胁。定期监控有助于识别潜在威胁，并通过发出告警来减轻威胁。以下是持续监控和告警的关键点：\n\
  \    1.  实施关键监控工具，以持续监控机器学习系统的安全性和功能性。\n\n2.  明确定义事件响应程序，以便及时检测和处理安全漏洞。\n\n3.  需要定期进行渗透测试和安全审计，以发现漏洞并评估安全措施的有效性。\n\
  \n5.  **基础设施安全**\n\n基础设施和硬件组件的安全性对于减轻物理攻击的风险至关重要。对基础设施的物理攻击可能导致供应链受损。以下是确保基础设施安全需要考虑的关键点：\n\
  \    1.  必须使用安全的执行环境来保护机器学习模型推理过程。\n\n2.  应使用网络分段将机器学习工作负载与其他系统隔离开来，以减少攻击面。\n\n\
  3.  使用最新的安全补丁更新所有软件和基础设施组件。\n\n## 使用 MLSecOps 实现安全的人工智能\n\n我们现在了解了 MLSecOps、其重要性以及\
  \ MLSecOps 的支柱和最佳实践，是时候有效实施 MLSecOps 了。让我们学习其逐步流程（图 4-5）。\n\n![](img/609560_1_En_4_Fig5_HTML.jpg)\n\
  \n图 4-5\n\n带有安全控制的通用 MLSecOps 架构\n\n### 步骤 1：评估机器学习系统的安全需求\n\n第一步是了解机器学习系统及其安全要求。\n\
  \n1.  识别所使用的所有数据源、机器学习模型和基础设施。\n\n2.  识别潜在风险和威胁。\n\n3.  进行风险评估运行。\n\n4.  为 MLSecOps\
  \ 实施定义明确的安全和缓解目标。\n\n### 步骤 2：建立跨职能安全团队\n\n现在，建立一个跨职能安全团队来实施安全的机器学习系统。\n\n1.  组建一个由数据科学家、机器学习工程师、IT\
  \ 专业人员和安全专家组成的团队。\n\n2.  明确所有团队成员的角色和职责，确保其责任到位。\n\n### 步骤 3：为 MLSecOps 定义策略和程序\n\
  \n在定义了成员的角色和职责之后，为 MLSecOps 定义策略和程序。\n\n1.  制定策略以处理数据处理、模型开发、部署、监控、安全以及所有机器学习特定任务。\n\
  \n2.  制定发生安全漏洞时的事件响应程序。\n\n3.  记录所有 MLSecOps 程序并在团队中进行沟通，以确保一致实施。\n\n### 步骤 4：实施\
  \ MLSecOps 的核心支柱\n\n调整、接纳并实施 MLSecOps 的五大核心支柱，使其适应您组织的数据、模型、机器学习系统和基础设施。\n\n###\
  \ 步骤 5：遵循安全开发生命周期\n\n在开发生命周期中整合安全实践，包括数据预处理、模型训练、验证和部署。\n\n1.  教育从业者实施安全编码实践。\n\n\
  2.  实施数据验证和清理，以防止常见漏洞。\n\n3.  通过安全配置和有限的访问控制来确保部署安全。\n\n### 步骤 6：实施安全监控和事件响应\n\n\
  部署后，建立安全监控系统和事件响应计划。\n\n1.  为机器学习系统部署监控工具，以实时检测异常、对抗性攻击和数据漂移。\n\n2.  定义完整的事件响应程序，包括角色、沟通渠道和升级路径，以确保对安全事件做出迅速有效的响应。\n\
  \n### 步骤 7：实施定期审计和评估\n\n需要进行定期的安全审计和评估，以评估您的 MLSecOps 实施的有效性。\n\n1.  定期进行安全审计，以识别漏洞和改进领域。\n\
  \n2.  随时了解未来可能出现的新威胁，并提前规划缓解策略。\n\n### 步骤 8：开展员工培训与意识提升\n\n为了实施 MLSecOps 最佳实践，组织需要培训其员工，并在组织内传播对\
  \ MLOps 安全指南的认识。\n\n1.  对所有利益相关者进行教育和培训，使其了解 MLOps 的安全风险、各自的角色和职责，以及如何遵循 MLSecOps\
  \ 程序。\n\n2.  传播意识，鼓励员工对潜在安全威胁保持警惕，报告任何可疑活动，并遵守 MLSecOps 策略。\n\n\n\n## 如何在 AWS 中实现安全\n\
  \n安全是 AWS 良好架构框架的关键支柱之一。事实上，安全是每个组织中最关键的元素之一，确保公司的安全策略和标准得到满足至关重要。\n\n安全控制措施，例如多因素用户认证、敏感数据加密、实时审计、日志记录和监控，旨在保护数据和资源的可用性、机密性和完整性。这些管理和技术屏障用于阻止、识别或减轻威胁行为者利用安全漏洞的能力。\n\
  \n在机器学习的完整生命周期中，存在四种类型的安全控制措施：预防性、主动式、检测性和响应性。本节将讨论所有安全控制措施，并重点介绍它们在 AWS 中的实现。\n\
  \n### 按 ML 生命周期阶段划分的安全最佳实践\n\n机器学习生命周期包含六个阶段（图 4-6）。所有 AWS 安全最佳实践都分布在这些阶段中。让我们详细讨论每一个阶段。\n\
  \n![](img/609560_1_En_4_Fig6_HTML.jpg)\n\n图 4-6\n\n机器学习生命周期\n\n#### 业务目标识别\n\n业务目标识别是\
  \ ML 生命周期的第一个也是根本的阶段。在识别业务目标时，牢记安全措施非常重要。正是在这个阶段，您必须定义并确保保护数据、系统隐私、各种权限、软件和许可条款所需的法规。业务目标识别下的最佳实践包括：\n\
  \n*   **实施 ML 数据权限验证、隐私、软件和许可条款**\n\n    此阶段建立一个流程，用于审查整个生命周期中所需的所有软件和 ML 库的隐私和许可协议。这些协议应符合您组织的法律、隐私和安全条款及条件，并且不应给组织的业务计划增加任何限制。其实施计划详述如下：\n\
  \n    **确保并验证 ML 的数据权限**\n\n    确保并验证所有可用于机器学习生命周期的数据相关权限。\n    *   验证预期数据的用途。\n\
  \    *   验证是否需要数据所有者或数据主体提供额外同意。\n    *   制定策略来处理那些后来决定不同意其数据被使用的数据主体。\n    *  \
  \ 出于合规性考虑，确保数据权限文档是最新的。\n\n    **使用生命周期管理策略引导实例**\n\n    编写一个脚本，用于安装必要的包，并在生命周期配置中引用您的包仓库。创建生命周期管理策略是为了管理\
  \ ML 生命周期实例，并自动转换到分层存储。\n\n    **评估包集成**\n\n    在此阶段，为了安全控制，需要对需要外部查找服务的包集成进行评估。\n\
  \n    必要时，根据您的数据隐私要求选择退出数据收集。\n    *   应尽量减少通过信任关系导致的数据暴露。\n    *   审查任何可能收集数据的\
  \ ML 程序的许可协议和隐私政策。\n\n    **使用预构建容器**\n\n    从经过优化、预打包和验证的容器开始，以快速部署 ML 环境。这些预构建的容器支持常用的依赖项，通过优化的模型训练自动提升性能。TensorFlow、PyTorch\
  \ 和 Apache MXNet 是 AWS 深度学习容器中可用的一些深度学习框架库和工具。参见图 4-7。\n\n    ![](img/609560_1_En_4_Fig7_HTML.jpg)\n\
  \n    图 4-7\n\n    AWS 深度学习容器\n\n    AWS 深度学习容器是经过预配置和测试的 Docker 镜像，包含知名深度学习框架的最新迭代版本。借助深度学习容器，您可以快速部署自定义\
  \ ML 环境，而无需从头开始进行环境创建和优化。\n\n#### ML 问题框架构建\n\n本节中的主要业务挑战包括制定机器学习问题的最佳实践，其中标签或目标变量是观察到的内容以及应预测的内容。在机器学习中，确定要预测什么以及如何优化性能非常重要。遵循以下阶段将有助于根据业务需求构建\
  \ ML 问题，例如：\n\n*   定义项目的成功标准。\n*   为项目定义一个可观察且可量化的性能指标，例如准确率、AUC 等。\n*   建立性能指标与业务成果（例如销售额）之间的关系。\n\
  *   确保业务利益相关者理解并同意已定义的性能指标。\n*   为了达到期望的业务成果，通过获取额外数据、微调参数或增加复杂性来迭代模型。\n*   根据输入、期望输出、模型目标以及要优化的性能指标来制定\
  \ ML 问题。\n\nML 问题框架构建下的最佳实践详述如下：\n\n*   **实施设计数据加密和混淆**\n\n*   安全支柱包括在利用云计算增强安全性的同时，保护信息、资产和系统的能力。对于安全的机器学习系统，处理个人身份信息、设计数据加密和保护凭证非常重要。其实施计划详述如下：\n\
  \n    **审计需要特殊处理属性的数据**\n\n    需要对数据进行审计，以找出那些需要特殊安全处理的属性。有三种审计数据并提供安全性的方法。\n\n\
  \    *PII 数据识别和处理*\n\n    个人身份信息 (PII) 和敏感数据需要通过应用高级转换（如编辑、替换、加密和解密）进行特殊处理。由于数据呈指数级增长，企业正在管理海量的异构数据，包括流入其平台的个人身份信息\
  \ (PII)。大规模识别和保护敏感数据已变得更加困难、昂贵和耗时。AWS 提供 Glue DataBrew 用于识别、处理和管理 PII 数据。参见图 4-8。\n\
  \n    ![](img/609560_1_En_4_Fig8_HTML.jpg)\n\n    图 4-8\n\n    AWS Glue DataBrew\
  \ 架构\n\n    AWS Glue DataBrew 通过添加 PII 数据处理转换来促进数据隐私和保护，这些转换允许您对敏感数据执行操作，例如数据脱敏、加密和解密。DataBrew\
  \ 已推出 PII 统计功能，当您在数据集上运行分析作业时，该功能会识别 PII 列并提供其数据统计信息。\n\n##### 设计数据加密\n\n实施设计数据加密和数据脱敏是必要的，这是阻止未经授权的用户读取您的数据和模型工件的第一道防线。数据在传输中和静态时都需要进行加密。客户端数据加密在上传到\
  \ AWS 之前完成，而服务器端数据加密则由接收数据的应用程序或服务在其目的地完成。参见图 4-9。\n\n![](img/609560_1_En_4_Fig9_HTML.jpg)\n\
  \n图 4-9\n\nAWS 加密/解密权限快照\n\n\n\n##### 保护凭证\n\n在进行推理和训练之前，请确保数据得到正确处理、加密并安全存储。AWS\
  \ 建议不要将用于访问数据库的凭证嵌入代码中，而是使用 AWS Secrets Manager 来存储凭证，然后授予您的 SageMaker IAM 角色从笔记本访问\
  \ Secrets Manager 的权限。请参见图 4-10。\n\n![](img/609560_1_En_4_Fig10_HTML.jpg)\n\n图 4-10\n\
  \n在 AWS Secrets Manager 控制台中存储凭证\n\n使用 AWS Secrets Manager 是一种保护凭证免受第三方侵害的安全方式。密钥管理器必须按照指定的计划轮换凭证，以大幅降低密钥被泄露的可能性。\n\
  \n##### 数据处理\n\n数据处理包括数据收集和数据准备（数据处理与特征工程）。数据处理的第一步是数据收集、聚合、摄取和正确标注。在数据预处理阶段，需要完成数据清洗、特征缩放（归一化或标准化）、数据增强和划分。最后一步是特征工程，包括特征选择、新特征创建、特征变换和提取，以获得更好的结果。为了更好地理解和探索数据，需要创建探索性数据分析（EDA）和可视化图表。\n\
  \n![](img/609560_1_En_4_Figa_HTML.jpg)\n\n务必牢记，推理请求必须使用与训练数据相同的流程进行处理。数据定位、数据泄露和对抗性攻击都发生在此阶段。数据处理方面的最佳实践详述如下：\n\
  \n\n\n##### 实施最小权限访问\n\n首要规则是在机器学习生命周期的所有阶段实施最小权限访问，以保护数据、代码、算法、超参数、训练模型、配置和基础设施等资源。为任何项目的运行分配具有专用资源和服务的独立网络环境。其具体实施计划如下：\n\
  \n基于业务角色对个人进行访问限制\n\n需要根据组织中的业务角色来限制访问权限。\n\n*   识别项目中个人的角色。\n\n*   通过将角色映射到所需的访问权限，实施基于角色的身份验证。\n\
  \n*   根据每个项目的需求，授予对私有信息、资源和服务的最小必要权限。\n\n使用账户分离和 AWS Organizations\n\n了解不同用户类型的工作流程，使用账户分离，并通过多账户设计相应地提供基于角色的访问授权，该设计将工作负载划分到开发、测试和生产环境中，并根据数据敏感性和合规性要求应用适当的治理。AWS\
  \ Service Catalog 用于快速部署预置环境。它允许您集中管理云资源，以便在基础设施即代码（IaC）模板的规模上实现治理和合规性要求。它有助于为包含敏感工作负载的数据和存储桶建立标签。这些标签用于在细粒度级别授予个人访问权限。参见图\
  \ 4-11。\n\n![](img/609560_1_En_4_Fig11_HTML.jpg)\n\n图 4-11\n\nAWS Service Catalog\n\
  \nService Catalog 具有以下特性：\n\n*   快速查找和部署经批准的、自助式的云资源。\n*   在跨多个账户的资源上改进治理和合规性的同时，展现出敏捷性。\n\
  *   使用 AWS Service Catalog 的 AppRegistry 获取当前准确的应用定义和相关元数据。\n\n根据访问模式和组织结构分解机器学习工作负载\n\
  \n需要根据组织结构和授权访问来分解机器学习工作负载。\n\n*   分解机器学习工作负载，并根据需要将特定访问权限委派给特定人员，如数据分析师、科学家和管理员。\n\
  *   使用防护机制和服务控制策略（SCP）为每种访问类型和用户组强制执行最佳实践。\n*   将基础设施访问权限限制给管理员。\n*   确保仅使用专门的、隔离的、受限的环境来访问敏感数据。\n\
  \n实施安全的数据和建模环境\n\n现在是时候启用模型开发并保护承载数据的系统了。端到端环境需要是安全的，例如加密训练数据并将其存储在安全的存储库中。在严格安全的云环境中执行数据准备。加密数据从数据存储库移动到严格控制的目标计算实例。其具体实施计划如下：\n\
  \n构建安全的分析环境\n\n在数据准备和特征工程阶段，Amazon AWS 在下面提到的安全环境中提供了许多用于数据分析的服务。\n\n*   Amazon\
  \ SageMaker 是一个托管笔记本环境。\n*   Amazon EMR 是云大数据领域的市场领导者，用于使用 Apache Spark、Apache Hive\
  \ 和 Presto 等开源框架进行 PB 级数据处理、交互式分析和机器学习。\n*   Amazon Athena 提供了一种简化、灵活、无服务器的交互式分析服务，用于就地分析\
  \ PB 级数据。\n*   AWS Glue 是一种无服务器数据集成服务，通过简化的 ETL 管道开发，用于机器学习和应用程序开发，能够高效地发现、准备、移动和集成数据。它支持各种处理框架和工作负载。参见图\
  \ 4-12。\n\n![](img/609560_1_En_4_Fig12_HTML.jpg)\n\n图 4-12\n\nAWS Glue\n\n创建专用的\
  \ AWS IAM 和 KMS 资源\n\n这种方法限制了凭证和密钥的影响范围。创建专用的 AWS Identity and Access Management\
  \ 和 Key Management Service 资源。通过在 Amazon S3 上使用 AWS Lake Formation 实施集中式数据湖，在 AWS\
  \ 中实现对数据和知识产权的版本管理。通过结合使用细粒度的 AWS 服务（如 AWS IAM 策略、S3 存储桶策略、S3 访问日志、Amazon CloudWatch\
  \ 和 AWS CloudTrail），可以实现对 Amazon S3 上数据湖的安全保护、访问和监控。参见图 4-13。\n\n![](img/609560_1_En_4_Fig13_HTML.jpg)\n\
  \n图 4-13\n\nAWS Identity and Access Management\n\n以下是通过 AWS Identity and Access\
  \ Management 实施的各种策略，用于安全管理对 AWS 服务和资源的身份和访问。\n\n*   基于身份的策略\n*   基于资源的策略\n*   权限边界\n\
  *   组织 SCP\n*   访问控制列表（ACL）\n*   会话策略\n\n以下示例演示了如何使用适用于 Python (Boto3) 的 AWS 软件开发工具包（SDK）与\
  \ AWS Identity and Access Management（IAM）配合使用。通过使用 IAM（一种 Web 服务），可以安全地控制 AWS 服务。使用\
  \ IAM，可以在您的 AWS 账户中集中管理权限。以下 Python 代码示例展示了如何使用 `create_key` 函数来使用 `CreateAccessKey`。\n\
  \n```\ndef create_key(user_name):\n\"\"\"\n:param user_name: 用户的名称。\n:return: 创建的访问密钥。\n\
  \"\"\"\ntry:\nkey_pair = iam.User(user_name).create_access_key_pair()\nlogger.info(\n\
  \"已为 %s 创建访问密钥对。密钥 ID 是 %s。\",\nkey_pair.user_name,\nkey_pair.id,\n)\nexcept ClientError:\n\
  logger.exception(\"无法为 %s 创建访问密钥对。\", user_name)\nraise\nelse:\nreturn key_pair\n\
  ```\n\n此代码为指定用户创建一个访问密钥。每个用户最多有两个密钥。\n\n使用 Secrets Manager 和 Parameter Store 保护凭证\n\
  \nSecrets Manager 使您能够将代码中的硬编码密钥（例如凭证）替换为 API 调用，以编程方式解密和检索密钥。应用程序配置变量（例如许可证密钥或\
  \ AMI ID）可以存储在 Parameter Store 中，该服务旨在用于比密钥或密码更广泛的用例。借助 AWS Secrets Manager 和 Parameter\
  \ Store，您可以存储凭证，然后授予您的 SageMaker IAM 角色从笔记本访问 Secrets Manager 的权限。参见图 4-14。\n\n\
  ![](img/609560_1_En_4_Fig14_HTML.jpg)\n\n图 4-14\n\nAWS Secrets Manager\n\n以下是 AWS\
  \ Secrets Manager 的主要特性：\n\n*   使用细粒度策略控制对您的应用、服务和 IT 资源的访问，并安全地保护机密信息。\n*   满足您的安全和合规性需求，密钥会自动轮换。\n\
  *   安全地加密数据库凭证和 API 密钥。\n\n以下示例演示了如何使用适用于 Python (Boto3) 的 AWS SDK 与 AWS Secrets\
  \ Manager 配合使用。Secrets Manager 有助于安全地加密、归档和检索数据库及其他服务的登录凭证。以下代码示例展示了 `get_secret`\
  \ 函数的实现，用于获取密钥值：\n\n```\nclass GetSecretWrapper:\ndef __init__(self, secretsmanager_client):\n\
  self.client = secretsmanager_client\ndef get_secret(self, secret_name):\ntry:\n\
  get_secret_value_response = self.client.get_secret_value(\nSecretId=secret_name\n\
  )\nlogging.info(\"密钥检索成功。\")\nreturn get_secret_value_response[\"SecretString\"\
  ]\nexcept self.client.exceptions.ResourceNotFoundException:\nmsg = f\"请求的密钥 {secret_name}\
  \ 未找到。\"\nlogger.info(msg)\nreturn msg\nexcept Exception as e:\nlogger.error(f\"\
  发生未知错误：{str(e)}。\")\nraise\n```\n\n在此代码中，实现了 `get_secret_value` API 以从 AWS Secrets\
  \ Manager 检索单个密钥。这里，传递了参数 `secret_name`，并返回一个密钥字符串作为输出。\n\n自动化管理配置\n\n自动化管理 Jupyter\
  \ Notebook 实例的所有生命周期配置，这些配置用于安装自定义包、预加载数据集和设置源代码存储库。可以一次性完成更改，然后将更新后的配置应用于多个笔记本实例。这为开发人员、数据科学家和安全团队提供了对系统的灵活性和控制力。AWS\
  \ Service Catalog 用于简化最终用户的配置。\n\n创建私有、隔离的网络环境\n\nAmazon Virtual Private Cloud（Amazon\
  \ VPC）根据需求创建并启用与隔离的安全服务和用户的连接。Amazon SageMaker 笔记本实例部署在 Amazon VPC 中，以启用网络级控制来限制与托管笔记本的通信。VPC\
  \ 流日志捕获进出笔记本实例的网络调用，以便在网络级别实现额外的可见性和控制。VPC 允许查询数据源，例如 Amazon RDS 中的关系数据库或 Amazon\
  \ Redshift 数据仓库。\n\n以下是 Amazon Virtual Private Cloud（Amazon VPC）的主要特性：\n\n*   在您的虚拟网络中实施安全且受监控的连接、筛选流量以及限制实例访问。\n\
  *   节省设置、管理和验证虚拟网络的时间。\n*   通过选择 IP 地址范围、创建子网和配置路由表来自定义虚拟网络，从而管理和控制环境。\n\n限制访问\n\
  \nJupyter Notebook 服务器使得可以通过 Web 访问 EC2 实例上的底层操作系统。这允许您安装额外的软件包或 Jupyter 内核来自定义您的环境。默认情况下，对操作系统具有\
  \ root 访问权限或超级用户权限的用户被授予此访问权限，使他们能够完全控制底层的 EC2 实例。应限制此访问，以防止用户获得 root 权限，同时保留对其本地用户环境的控制。\n\
  \n保护机器学习算法安全\n\n模型和算法使用 Amazon SageMaker 通过容器技术进行训练和托管。创建容器后，将其私有托管到 Amazon Elastic\
  \ Container Repository（Amazon ECR）。参见图 4-15。\n\n![](img/609560_1_En_4_Fig15_HTML.jpg)\n\
  \n图 4-15\n\nAmazon ECR\n\nAmazon Elastic Container Registry（ECR）可以轻松地存储、共享和部署您的容器软件。\n\
  \n*   容器镜像被推送到 Amazon ECR，无需扩展或安装基础设施。\n*   ECR 通过自动加密和基于超文本传输安全协议（HTTPS）的访问控制，帮助安全地下载和共享镜像。\n\
  \n强制执行代码最佳实践\n\n通过使用完全托管的 AWS CodeCommit 存储代码的安全 Git 存储库来强制执行代码最佳实践。参见图 4-16。\n\n\
  ![](img/609560_1_En_4_Fig16_HTML.jpg)\n\n图 4-16\n\nAWS CodeCommit\n\n以下是 AWS CodeCommit\
  \ 的主要特性：\n\n*   安全地托管高度可扩展的私有 Git 存储库，并在 AWS 上靠近构建、预发布和生产环境的地方协作处理代码。\n*   提供可定制的、针对特定用户的\
  \ Git 存储库访问权限，并自动加密传输中的文件。\n*   无需扩展、备份、托管和操作您的源代码控制服务器。\n\n实施用于使用经批准包的包镜像\n\n在机器学习生命周期中会使用多个机器学习\
  \ Python 包，例如 Pandas、PyTorch、Keras、TensorFlow、NumPy 和 Scikit-learn。需要根据确定的标准对这些\
  \ Python 包的许可条款进行业务需求评估。设置一个自动化机制，该机制运行脚本从批准的存储库下载必要的包版本，并通过依赖项检查进行安装。下载包后，需要进行验证以确认包的有效性和安全性。\n\
  \nSageMaker 笔记本支持以下两种包安装工具：\n\n*   conda install\n*   pip install\n\n以下是它们的示例代码：\n\
  \n```\n# 创建一个自定义的 conda 环境\nsource \"$WORKING_DIR/miniconda/bin/activate\"\nKERNEL_NAME=\"\
  custom_python\"\nPYTHON=\"3.6\"\nconda create --yes --name \"$KERNEL_NAME\" python=\"\
  $PYTHON\"\nconda activate \"$KERNEL_NAME\"\npip install --quiet ipykernel\n# 这些行可以根据需要安装的包进行自定义\n\
  conda install --yes numpy\npip install --quiet boto3\n```\n\n在此代码中，numpy 使用 conda\
  \ 安装，boto3 使用 pip 安装。这些代码行可以根据包安装需求进行自定义。\n\n\n\n##### 实施敏感数据隐私保护\n\n在此阶段，敏感数据的识别与分类对于防止意外泄露至关重要。可采用移除、掩码、令牌化、主成分分析（PCA）以及最佳治理实践等策略来保护敏感数据。其实施方案详述如下：\n\
  \n使用自动化机制进行数据分类\n\nAmazon 提供名为 Amazon Macie 的自动化数据分类机制。它能针对您的 S3 存储桶中的敏感数据，提供自动化、持续、智能、经济高效且覆盖整个组织的可见性。以下是\
  \ Amazon Macie 的主要功能：\n\n*   检查个人身份信息（PII）、财务数据和 AWS 凭证。\n\n*   构建并持续维护一个交互式数据地图，显示您的敏感数据存储在\
  \ Amazon S3 中的位置，并为每个存储桶提供敏感度评分。\n\n*   记录特定的 S3 项目。\n\n*   Macie 还会更新关于您 Amazon\
  \ S3 数据的统计数据、清单信息及其他信息。\n\n使用标签\n\n标签用于区分需要保护的敏感资源和模型与那些不需要保护的资源，这些资源包含敏感特征。存储可以通过使用对象标签进行分类。每个标签以键值对的形式工作，其中键和值区分大小写。\n\
  \n以下是标签的主要特性：\n\n*   标签可以在上传新对象时添加，也可以添加到现有对象上。\n\n*   一个对象最多可以关联 10 个标签，每个标签必须具有唯一的标签键。\n\
  \n*   标签键和标签值的长度分别最多为 128 和 256 个 Unicode 字符。Amazon S3 对象标签内部使用 UTF-16 编码。\n\n*\
  \   对象标签实现了细粒度的权限访问控制。\n\n*   对象标签实现了细粒度的对象生命周期管理，允许您在生命周期规则中除了键名前缀之外，还可以定义基于标签的过滤器。\n\
  \n假设您的 S3 存储桶用于存放项目文件。您可以使用值 `Yellow` 和键 `Project` 来标记这些对象，如下所示：\n\n```\nProject=Yellow\n\
  ```\n\n加密敏感数据\n\n敏感数据可以使用以下服务进行加密：\n\n![](img/609560_1_En_4_Fig17_HTML.jpg)\n\n\
