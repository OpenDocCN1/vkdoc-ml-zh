  *   实施模型部署服务，遵循企业 CI/CD 实践，以自动化各种推理部署选项。

  *   已实施 SageMaker Model Monitor 和 SageMaker Clarify，以监控模型偏差、漂移自定义指标计算器以及可解释性等数据监控能力。




  ### 关键成果


  以下是汤森路透通过 Amazon SageMaker 实施 MLOps 后取得的主要成果：


