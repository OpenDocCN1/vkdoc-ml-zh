- fmt: '### Creating the Inference Script


    The training script is used to train the model. But, once the model is trained,
    we need to make predictions, whether with real-time inference as we saw in Chapter
    [6](#495447_1_En_6_Chapter.xhtml) or with the batch transformation that we will
    see in this chapter. We will save the inference script in a file named `predictor.py`.


    The predictor file consists of the following components:


    *   `ScoringService()` class

    *   `ping()` method

    *   `transformation()` method

    *   Any other helper function required


    The `ScoringService()` class consists of two functions. The first function, `get_model()`,
    loads and deserializes the model, while the second method, `predict()`, is responsible
    for making the predictions. Remember, the inference script also uses the same
    folder as the base that the training script uses, `/opt/ml`. The following is
    the script for the `ScoringService()` class:


    ```

    prefix = ''/opt/ml/''

    model_path = os.path.join(prefix, ''model'')

    class ScoringService(object):

    model = None

    @classmethod

    def get_model(cls):

    if cls.model == None:

    with open(os.path.join(model_path, ''randomForest-tree-model.pkl''), ''r'') as
    inp:

    cls.model = pickle.load(inp)

    return cls.model

    @classmethod

    def predict(cls, input):

    clf = cls.get_model()

    return clf.predict(input)

    ```


    The `ping()` method is just used to check whether the Docker container that the
    code is running in is healthy. If it’s not healthy, then it gives a 404 error,
    else 202.


    ```

    @app.route(''/ping'', methods=[''GET''])

    def ping():

    status = 200 if health else 404

    return flask.Response(response=''\n'', status=status, mimetype=''application/json'')

    ```


    `transformation()` is the method that is responsible for reading the test file
    and calling the required methods and classes. One thing to understand here is
    that this entire endpoint generation process is nothing but the creation of an
    API. Once the API is created, the data is sent as a POST request, and then we
    get the predictions as a response. This entire architecture is built using the
    Flask framework.


    The data is sent using the POST method, so to read it, we need the `StringIO()`
    method to decode the data. Once the data is decoded, we can read it with our normal
    Pandas method. The `transformation()` function sends the data to the `predict()`
    function of class `ScoringService()`. The method sends the output back to the
    `transformation()` function. This prediction output is sent back to the host from
    where the API is called, with help from the `StringIO()` function. This finishes
    the entire cycle of endpoints. The following is the code of `transformation()`:


    ```

    @app.route(''/invocations'', methods=[''POST''])

    def transformation():

    data = None

    if flask.request.content_type == ''text/csv'':

    data = flask.request.data.decode(''utf-8'')

    s = StringIO.StringIO(data)

    data = pd.read_csv(s, header=None)

    else:

    return flask.Response(response=''This predictor only supports CSV data'', status=415,
    mimetype=''text/plain'')

    print(''Invoked with {} records''.format(data.shape[0]))

    # Do the prediction

    predictions = ScoringService.predict(data)

    # Convert from numpy back to CSV

    out = StringIO.StringIO()

    pd.DataFrame({''results'':predictions}).to_csv(out, header=False, index=False)

    result = out.getvalue()

    return flask.Response(response=result, status=200, mimetype=''text/csv'')

    ```


    We will use this Python file for making the predictions, but to run the server
    efficiently, we need some configuration files. Let’s explore them in the next
    section.


    ### Configuring the Endpoint Generation Files


    To run the inference server successfully, we need to configure the following files:


    *   `nginx.conf` file

    *   `serve` file

    *   `wsgi.py` file


    Generally we don’t make changes in these files. We create them and then use them
    as is for our predictions. We will not go into the line-by-line details of these
    files, but let’s understand the purpose of each one.


    The Nginx file is used to spin up the server and make the connection between the
    Docker containers deployed on EC2 instances and the client outside or inside the
    SageMaker network possible. Nginx uses a Python framework called Gunicorn that
    helps to set up the HTTP server.


    Serve uses the running Gunicorn server to make the connection between the different
    resources feasible. Specifically, it is used for the following purposes:


    *   Efficiently using the number of CPUs for running the model

    *   Defining the server timeout

    *   Generating logs

    *   Starting the server using Nginx and Gunicorn

    *   Stopping the server if something doesn’t go as expected


    Lastly, the `wsgi.py` file is used to tell the server about our `predictor.py`
    file. We can explore the code in each file in the GitHub repository of this book.
    Remember, these files are really important as without them the server will never
    run; hence, you won’t be able to make predictions. Don’t make changes to these
    files, unless you are pretty sure about what you’re doing.'
