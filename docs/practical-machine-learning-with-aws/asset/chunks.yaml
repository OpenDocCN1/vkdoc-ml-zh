- fmt: '### Continuous Bag of Words Architecture of Word Vectors Generation


    The continuous bag of words (CBOW) method, you could say, is the reverse of skip
    gram. It understands the context and then tries to predict the word in that context.
    For example, if the sentence is “Delhi is the capital of India” and we then write
    “Delhi is the capital,” then it should predict India. The architecture is again
    the same, where we have a hidden layer and an output layer. Each word passed to
    the network is one-hot encoded. See Figure [6-5](#495447_1_En_6_Chapter.xhtml#Fig5).


    ![../images/495447_1_En_6_Chapter/495447_1_En_6_Fig5_HTML.jpg](images/495447_1_En_6_Chapter/495447_1_En_6_Fig5_HTML.jpg)


    Figure 6-5


    CBOW algorithm


    ### SageMaker Application of Blazing Text


    Before starting the coding, we must understand the dataset for which we will be
    generating the word vectors using the blazing text algorithm. The dataset that
    we’ll be using is called the text8 dataset. It is a small, cleaned version of
    the entire Wikipedia text. The entire Wikipedia dump is called wiki9, which is
    then cleaned and converted into fil9. A subset (100 MB) of this cleaned dataset
    is taken and called text8. We can download the dataset from [`http://mattmahoney.net/dc/text8.zip`](http://mattmahoney.net/dc/text8.zip).


    As you may already know by now, the data downloaded must be sent to the S3 bucket
    so that our resources and the algorithm container can access it. We can upload
    the data using the following script:


    ```

    train_channel = prefix + ''/train''

    sess.upload_data(path=''text8'', bucket=bucket, key_prefix=train_channel)

    ```


    Let’s store the path to this dataset in a variable.


    ```

    s3_train_data = ''s3://{}/{}''.format(bucket, train_channel)

    ```


    Remember to define all the required fields before executing this code, namely,
    `bucket`, `role`, etc. We have already seen how to define them in the previous
    sections. We can also look at the GitHub repo to understand the complete code.


    Now that we have stored the data and defined the path, the next step will be to
    initialize the blazing text Docker container.


    ```

    container = sagemaker.amazon.amazon_estimator.get_image_uri(region_name, "blazingtext",
    "latest")

    ```


    Once the container is ready, we have to initialize the instance/resource.


    ```

    bt_model = sagemaker.estimator.Estimator(container,

    role,

    train_instance_count=1,

    train_instance_type=''ml.m4.xlarge'',

    train_volume_size = 5,

    train_max_run = 360000,

    input_mode= ''File'',

    output_path=s3_output_location,

    sagemaker_session=sess)

    ```


    Don’t forget to define the S3 output location before running this code.


    ```

    s3_output_location = ''s3://{}/{}/output''.format(bucket, prefix)

    ```


    All the parameters are self-explanatory, and we already looked at them in the
    previous section. Remember, the `ml.m4.xlarge` instance comes under the free tier.
    So if you want to play around with different algorithms, always use this instance.
    Next, we will set up the algorithm hyperparameters.


    ```

    bt_model.set_hyperparameters(mode="batch_skipgram",

    epochs=5,

    min_count=5,

    sampling_threshold=0.0001,

    learning_rate=0.05,

    window_size=5,

    vector_dim=100,

    negative_samples=5,

    batch_size=11,

    evaluation=True,

    subwords=False)

    ```


    We have already looked at these parts of the algorithm at the start of this section.
    Now we will pass the data as a JSON file to train the algorithm. Before doing
    that, we must tell the algorithm that the data is coming from S3. This information
    was passed in the previous algorithm using JSON. Here we will pass it using the
    following script:


    ```

    train_data = sagemaker.session.s3_input(s3_train_data, content_type=''text/plain'',
    s3_data_type="S3Prefix")

    data_channels = {''train'': train_data}

    bt_model.fit(inputs=data_channels, logs=True)

    ```


    The `logs` parameter will not only train the model but will also show the model
    output in the same Jupyter Notebook. Otherwise, we would have to look at the output
    in the CloudWatch. The next steps will be the same as before. Deploy the model
    and test it.


    ```

    bt_endpoint = bt_model.deploy(initial_instance_count = 1,instance_type = ''ml.m4.xlarge'')

    words = ["awesome", "blazing"]

    payload = {"instances" : words}

    response = bt_endpoint.predict(json.dumps(payload))

    vecs = json.loads(response)

    print(vecs)

    ```


    Here we will get the output, which will be the word vectors generated for the
    words *awesome* and *blazing*. Finally, we will delete the model endpoint.


    ```

    sess.delete_endpoint(bt_endpoint.endpoint)

    ```


    In the next section, we will look at the image classification algorithm in SageMaker.


    ## Exploring the Image Classification Algorithm


    SageMaker’s image classification algorithm is based upon a special convolutional
    neural network architecture called a ResNet. Before looking at the application
    of this algorithm, let’s first explore and understand the ResNet architecture
    used for image classification.


    ### ResNet


    A ResNet is an architecture that is based on the framework of convolutional neural
    networks and used for problem statements such as image classification. To understand
    a ResNet, we must first look at the operation of convolutional neural networks.
    See Figure [6-6](#495447_1_En_6_Chapter.xhtml#Fig6).


    ![../images/495447_1_En_6_Chapter/495447_1_En_6_Fig6_HTML.jpg](images/495447_1_En_6_Chapter/495447_1_En_6_Fig6_HTML.jpg)


    Figure 6-6


    Convolutional neural network, 10.1109/ICEngTechnol.2017.8308186


    A typical CNN consists of the following operations:


    1.  The first operation is the convolution operation, which is also considered
    an application of filters. We apply different filters on the image so that we
    can get different versions of the same image, which helps us understand the image
    perfectly. But, instead of hard-coding the filters, the values of these filters
    are learned using the backpropagation approach.


    2.  The next step is called *pooling* or *subsampling*. Here, we reduce the size
    of the image so that the training time becomes faster. There are different types
    of pooling approaches such as max-pooling, average-pooling, etc.


    3.  The previous two processes are repeated multiple times, and then the final
    pooling operation’s output is given to a fully connected neural network layer.
    Here the major learning happens, and finally the classification task is done.


    A problem with the previous architecture is when the network is made too deep;
    that’s when the backpropagation process suffers. Inside the backpropagation process
    the gradients turn to zero, and hence the learning stops. This phenomenon is called
    *vanishing gradients*. Therefore, to solve this issue during a deep CNN training,
    ResNets come into picture. Figure [6-7](#495447_1_En_6_Chapter.xhtml#Fig7) shows
    the architecture of a ResNet.


    ![../images/495447_1_En_6_Chapter/495447_1_En_6_Fig7_HTML.jpg](images/495447_1_En_6_Chapter/495447_1_En_6_Fig7_HTML.jpg)


    Figure 6-7


    Source: [*https://arxiv.org/pdf/1512.03385.pdf*](https://arxiv.org/pdf/1512.03385.pdf)


    ResNet’s major key is that it allows the flow of gradients in the backward direction.
    Also, the inputs are bypassed every two convolutions. These two workarounds in
    CNNs solve the problem of vanishing gradients. To learn more about ResNet, please
    visit [`https://arxiv.org/pdf/1512.03385.pdf`](https://arxiv.org/pdf/1512.03385.pdf).
    Covered next is the 34-layered residual network.'
