- fmt: '# Overview of Step Functions


    AWS Step Functions is the service provided by Amazon that you can use to create
    workflows and automate them. These workflows consist of AWS resources, algorithms,
    and processing. They may also include resources that are outside AWS. We can use
    Step Functions to create an end-to-end automation framework that helps us in building
    an effective continuous integration and continuous development (CI/CD) DevOps
    pipeline.


    Each component in a step function is called a *state machine*. In this chapter,
    we will be creating multiple state machines, as follows:


    - State machine for training a model

    - State machine for saving the model

    - State machine for configuring endpoints

    - State machine for model deployment


    Then we will combine all the state machines in a sequential format so that the
    entire process can be automated. Figure 9-1 is a small workflow that shows how
    these state machines will be connected.


    ![../images/495447_1_En_9_Chapter/495447_1_En_9_Fig1_HTML.jpg](images/495447_1_En_9_Chapter/495447_1_En_9_Fig1_HTML.jpg)


    Figure 9-1: Steps involved in creating a state machine


    Let’s start the process of creating the previous workflow. The first step will
    be to upgrade the Step Functions package so that we can make sure we are using
    the latest version of the module.


    ## Upgrading Step Functions


    We will simply use `pip` from Python to upgrade the Step Functions package and
    all the dependent packages.


    ```

    python -m pip install --upgrade stepfunctions

    ```


    You can run this either from the terminal or from the Jupyter Notebook as well
    by adding a prefix of exclamation mark (`!`).


    ## Defining the Required Parameters


    Let’s now define the required objects that we will use to run our code. This includes
    the roles, region, bucket, etc.


    ```

    import boto3

    import sagemaker

    import time

    import random

    import uuid

    import logging

    import stepfunctions

    import io

    import random

    from sagemaker.amazon.amazon_estimator import get_image_uri

    from stepfunctions import steps

    from stepfunctions.steps import TrainingStep, ModelStep, TransformStep

    from stepfunctions.inputs import ExecutionInput

    from stepfunctions.workflow import Workflow

    from stepfunctions.template import TrainingPipeline

    from stepfunctions.template.utils import replace_parameters_with_jsonpath


    sagemaker_execution_role = sagemaker.get_execution_role()

    workflow_execution_role = "arn:aws:iam::809912564797:role/himanshu-step-functions"

    session = sagemaker.Session()

    stepfunctions.set_stream_logger(level=logging.INFO)

    region = boto3.Session().region_name

    prefix = ''sagemaker/big-mart-pipeline''

    bucket_path = ''https://s3-{}.amazonaws.com/{}''.format(region, "slytherins-test")

    ```


    As you can see in the code, we require two roles. One is the SageMaker execution
    role, and the second is the workflow execution role. In the next section, we will
    see how to define the role for workflow execution. In addition, we have created
    a SageMaker session and defined the region and S3 bucket location. We have also
    set the Step Functions logger so that whatever important messages are there, we
    will not miss them.


    Now let’s see how we can create the required IAM role for workflow execution.


    ## Setting Up the Required Roles


    We need to set up two things to be able to execute the workflow:


    1. We need to add a policy on the already existing SageMaker role.

    2. We need to create a new Step Functions IAM role.


    ### Adding a Policy to the Existing SageMaker Role


    For the current SageMaker role that we are using to run all the models in this
    entire book, it’s easy to update the policy so that it can access the features
    of Step Functions. In the SageMaker console, we need to click the name of the
    notebook instance that we are using. This will lead us to a page showing the properties
    of the notebook instance. In that page there will be a section named “Permissions
    and encryption.” There you will find your ARN role mentioned for the instance.
    See Figure 9-2.


    ![../images/495447_1_En_9_Chapter/495447_1_En_9_Fig2_HTML.jpg](images/495447_1_En_9_Chapter/495447_1_En_9_Fig2_HTML.jpg)


    Figure 9-2: Selecting the ARN role


    Once you click that role, you’ll move to the IAM role for that ARN. On that page,
    you’ll need to click Attach Policies and search for `AWSStepFunctionsFullAccess`.
    Attach this policy, and now your SageMaker instance is ready to use Step Functions.
    See Figure 9-3.


    ![../images/495447_1_En_9_Chapter/495447_1_En_9_Fig3_HTML.jpg](images/495447_1_En_9_Chapter/495447_1_En_9_Fig3_HTML.jpg)


    Figure 9-3: Attaching policies'
