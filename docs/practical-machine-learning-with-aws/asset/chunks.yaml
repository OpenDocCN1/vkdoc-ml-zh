    ## 探索 XGBoost 算法


    XGBoost 代表*极限梯度提升*。在本节中，我们将首先了解普通的梯度下降算法是如何工作的，以及 XGBoost 如何使其效率更高。我们将把该算法应用于
    Big Mart 数据集的多类分类问题。让我们先来看看这两种算法，以此开始本节内容。


    ### 梯度提升算法


    *提升*是一种属于机器学习中集成树领域的技术。在该算法中，多个决策树被组合起来以给出最终预测。集成树中的其他方法包括装袋和随机森林。提升与这些方法的不同之处在于它组合多个树的方式。当构建第一个决策树（通常是
    CART 决策树）时，所有观测值被赋予相同的权重。模型训练完成后，被应用于同一数据集。然后构建第二个决策树。在这个决策树中，所有在第一个决策树中被错误分类的观测值被赋予更大的权重，而其他观测值则被赋予较小的权重。这是通过增加难以分类的观测值的权重，同时减少所有其他观测值的权重来实现的。这个过程不断重复，最后，最后一个决策树给出最终的预测。因此，可以说每个决策树都受到前一个决策树的*提升*，这就是它被称为*提升*的原因。有不同类型的提升方法，例如
    AdaBoost、梯度提升、Light GBM、XGBoost 等。参见图 6-3。


    ![../images/495447_1_En_6_Chapter/495447_1_En_6_Fig3_HTML.jpg](img/495447_1_En_6_Fig3_HTML.jpg)


    图 6-3


    梯度提升


    在梯度提升中，赋予参数的权重是使用梯度下降方法学习的。首先定义损失函数，对于回归问题可以是均方误差，对于分类问题可以是逻辑函数。每构建一个决策树并将其添加到下一个决策树后，都会最小化这个损失函数。最终目标是使整体损失函数最小化，这反过来为所有观测值提供了最佳的权重值。


    ### XGBoost 算法


    XGBoost 算法基于梯度提升框架。XGBoost 是梯度提升的一个超优化版本，因为它充分利用了计算资源的能力，以至于对于中小型数据集，其性能通常优于神经网络。以下是使用
    XGBoost 的一些主要优点：


    *   支持多线程操作，因此构建的多个树利用了并行化概念，从而我们可以使用大量决策树，以更少的迭代次数获得更准确的预测。


    *   可以通过使用缓存和缓冲区、核外计算等方法来最大化硬件性能。


    *   XGBoost 在决策树中附加了正则化因子，因此可以处理过拟合和欠拟合问题。它同时支持 L1 和 L2 正则化。


    *   XGBoost 通过理解邻近数据自动学习缺失值。


    *   使用一种称为*加权分位数草图*算法的方法找到最佳分割点。


    *   在每个步骤自动执行交叉验证，以找到超参数的最佳值。因此，无需编写自定义代码。


    您可以在 [`https://arxiv.org/pdf/1603.02754.pdf`](https://arxiv.org/pdf/1603.02754.pdf)
    找到 XGBoost 算法的详细概述。

