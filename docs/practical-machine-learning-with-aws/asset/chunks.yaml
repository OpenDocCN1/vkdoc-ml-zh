- fmt: '### Amazon VPC


    Amazon Virtual Private Cloud (`VPC`) is a virtual network that we create so that
    we can segregate certain things from the entire user domain. It acts just like
    a normal cloud, but instead of having separate infrastructures, there is only
    one cloud infrastructure but multiple virtual clouds made over it. For example,
    we can make a separate virtual cloud for the marketing, finance, and operations
    departments. Only its own set of users know what is happening in each cloud, but
    actually all the files that are being stored are on the same storage, which is
    being shared by all the departments. Therefore, each cloud can have its own security
    policies, access levels, etc.


    Amazon `VPC` is the same, except it also provides a scalable AWS architecture.
    Amazon `VPC` has the following components:


    - `Subnet`: Each virtual private cloud can be accessed only by a set of IP addresses.
    Any request coming from an address outside the list is not given access. This
    list is called a `subnet`.

    - `Route table`: As I said, a virtual private cloud has the same underlying infrastructure
    as local cloud. But AWS provides its own features as well. One of the features
    is load balancing, meaning if the load of the server becomes very high, then we
    can divert the traffic to an alternate server. Once we are working in `VPC`, we
    must know the routes to where the traffic needs to be directed. These routes are
    stored in route tables.

    - `Internet gateway`: Through the Internet gateway, all of your virtual private
    clouds are able to contact the underlying EC2 instances.

    - `Endpoint`: If we want to connect our virtual private cloud to any of the services
    provided by AWS, we can just use the `VPC` endpoint service provided by Amazon
    `VPC`.


    Figure [1-9](#495447_1_En_1_Chapter.xhtml#Fig9) shows an architecture where the
    Internet is used for `VPC` usage.


    ![../images/495447_1_En_1_Chapter/495447_1_En_1_Fig9_HTML.jpg](images/495447_1_En_1_Chapter/495447_1_En_1_Fig9_HTML.jpg)


    Figure 1-9


    Amazon `VPC` architecture


    If you look at the architecture in Figure [1-9](#495447_1_En_1_Chapter.xhtml#Fig9),
    you can see that inside `VPC` we have two EC2 instances, each with a public IP
    address and a private IP address. The public IP address is used if you want to
    access the services from outside the `VPC`, while the private one is used to access
    the same services from the inside of `VPC`. You can see that there is a router
    that uses route tables to know different routes and then uses an Internet gateway
    for the access. You also have an IP address and a port number for the `VPC` (`172.31.0.0`
    is the IP address and `16` is the port number in Figure [1-9](#495447_1_En_1_Chapter.xhtml#Fig9)).


    ### Amazon API Gateway


    Before understanding API Gateway, I will give a brief introduction about application
    programming interfaces (APIs). An API is a service that we use to make two or
    more applications talk with each other. For example, when we use Facebook to upload
    an image or a video, we are using the upload API of Facebook, and whenever we
    are liking, commenting, or sharing, we are using another API of Facebook. Therefore,
    in the current development scenario, each small service is developed and then
    converted into an API (the REST API is one of the types of API that is most used)
    and then can be used using the networking protocols. Amazon API Gateway provides
    you with the services to efficiently manage these APIs.


    Amazon API Gateway can be used to create, publish, maintain, monitor, and secure
    different kinds of APIs such as REST, HTTP, or the WebSocket API. These APIs can
    be made not only to have their own applications, but they can also access and
    use different AWS services.


    Figure [1-10](#495447_1_En_1_Chapter.xhtml#Fig10) shows the architecture of API
    Gateway.


    ![../images/495447_1_En_1_Chapter/495447_1_En_1_Fig10_HTML.jpg](images/495447_1_En_1_Chapter/495447_1_En_1_Fig10_HTML.jpg)


    Figure 1-10


    Architecture of API Gateway


    In Figure [1-10](#495447_1_En_1_Chapter.xhtml#Fig10), Amazon CloudWatch is used
    for monitoring the logs of any services provided by AWS and API Gateway in the
    current state. API Gateway Cache provides you with an option to reduce the latency
    by storing the most used components. All the APIs can be connected to different
    services of AWS as well like AWS Lambda, EC2, Kinesis (Used for Live Data Analytics),
    DynamoDB (Cloud Database), etc. It can be used by any third-party applications
    as well.


    ### Amazon CloudFront


    There are a lot of services present on the Web that provide us with a lot of options
    to build websites and serve them to the end users. AWS can be counted as one of
    them, but it provides features that the others don’t provide. AWS gives the option
    of less latency. To understand latency in a little detail, imagine you are opening
    a website whose servers are in India, but you are in North Korea (assuming that
    the Internet is provided to its citizens). Now, since the servers are pretty far
    away, it will take a lot of time to use any service provided by the website. But
    if, instead, the website was deployed in AWS, then instead of using the servers
    present in India, a person would be able to use the servers present in South Korea.
    Because the server is closer to the country, the pages will open faster.


    How does AWS do it? The answer is its service called CloudFront. How does CloudFront
    do that? It does that by using the edge locations provided by AWS. When you make
    a website, it has both static and dynamic content such as HTML pages, CSS and
    JavaScript, etc. So, if a request to use the website comes from the location where
    your server is not present, CloudFront distributes all the contents of the website
    to the Edge Location nearest to the place from where the request was made. Therefore,
    now opening the website becomes faster as the content is being delivered from
    a nearest server. To know more about edge locations, please visit this link: [`https://aws.amazon.com/cloudfront/features/`](https://aws.amazon.com/cloudfront/features/).


    In Figure [1-11](#495447_1_En_1_Chapter.xhtml#Fig11), you can see how CloudFront
    is used for this distribution. Let’s see what each step represents in the image.


    ![../images/495447_1_En_1_Chapter/495447_1_En_1_Fig11_HTML.jpg](images/495447_1_En_1_Chapter/495447_1_En_1_Fig11_HTML.jpg)


    Figure 1-11


    Amazon CloudFront service


    1. All the files that your website is going to use are stored in an AWS service
    like S3, or it can be your own HTTP server. (Steps 1 and 2.)

    2. Now you initiate the CloudFront distribution by providing the link to your
    S3 or HTTP server. (Step 3.)

    3. A domain name, specific to CloudFront, is provided to your distribution. It
    can be changed as well. (Step 4.)

    4. CloudFront sends the configuration of the distribution it has just created
    to all the edge locations present across the world. Here the cache of your files
    is created. (Step 5.)


    ## Conclusion


    This finishes the basic introduction about cloud computing and the Amazon version
    of the cloud: AWS. In this chapter, you saw different concepts related to cloud
    computing and learned about different components of AWS. We have not seen all
    the services of AWS, as there are more than 150 of them. They all cannot be covered
    in a single book, but we have covered all the important ones as far as this book
    is concerned.


    In the next chapter, we will be looking at the security aspects of AWS and different
    types of services provided to make our applications secure.


    # 2. AWS Pricing and Cost Management


    In the previous chapter, we looked at some concepts of cloud computing and explored
    a few of the important services provided by AWS. In this chapter, we will look
    at how AWS charges us for the services it provides and how we can get the best
    out of AWS with the least amount of burden on our pocketbooks as possible.'
