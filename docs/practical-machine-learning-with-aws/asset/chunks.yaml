    ## AWS 身份与访问管理


    正如我们通过 Amazon 管理控制台访问所有 AWS 服务一样，对于所有安全需求，我们也有 AWS 身份与访问管理。所有身份验证或授权都可以通过 IAM
    进行管理。我们可以创建用户、定义角色、授予权限、分配策略以及执行许多其他操作，所有这些都可以在 IAM 中完成。因此，无论是从事机器学习还是 Web 开发，只要是使用
    AWS 的人，都必须了解这项服务。


    想要使用 AWS 服务的人，首先要做的就是创建一个根用户账户。该账户可通过用户名和密码访问，并赋予用户对其已注册的所有服务的无限访问权限。但是，AWS 不鼓励我们始终使用根用户账户登录，因为这可能会危及组织的安全。因此，我们可以使用
    IAM 服务创建不同的用户，而不是使用根用户。这些用户被称为 *IAM 用户*。管理员可以向所有这些用户授予权限，要求他们设置自己的密码，分配不同的策略，从而使整个基础设施既简单又安全。


    为了更好地理解这一点，让我们看一个例子。假设有一个拥有 5000 名员工的组织。其中有董事会、CEO、CTO、总裁、经理、架构师、工程师和其他员工。首先，我们不能给每个人根访问权限，这无需解释。因此，组织可以创建
    IAM 用户。但是，授予高层管理人员的权限与授予层级较低员工的权限是不同的。即使在高层管理中，董事会成员可能只对某些具有仪表盘或可视化支持（例如 Splunk
    仪表盘）的特定服务拥有只读访问权限，而 CTO 则拥有某种根访问权限。同样，工程师将有权访问他们被雇用来使用的服务。机器学习工程师可能有权访问 SageMaker，数据工程师可能有权访问
    EMR 或 DynamoDB，等等。因此，通过这个例子我们可以得出结论：不同的用户需要不同的权限，而所有这些都可以通过 AWS IAM 来实现。


    一旦定义了 IAM 用户，它就会有自己的密码。用户登录后，将只能看到他们有权使用的服务。其他服务会要求提供凭证或拒绝访问。请注意，IAM 用户可能不是真实的人。它可能是一个软件服务。例如，假设一家公司在一个不同的平台上托管了一个网站，但使用了某些
    AWS 服务，如 S3 或 DynamoDB。因此，该网站需要持续与这些服务通信。为了验证正确的软件与 AWS 服务通信，会为这些服务创建一个 IAM 用户，然后该网站使用自己的凭证访问相应的服务。


    但是，组织通常已经拥有自己的基础设施，并且管理层中每个员工都有一个电子邮件 ID 和密码。当员工需要使用 AWS 时，他们将获得一个新的 ID 和密码。这意味着该人员必须记住并保护两个账户：公司账户和
    AWS 账户。如果 AWS 能提供一种方式，让员工只需登录公司账户就能自动登录 AWS 账户，那岂不是太棒了？AWS 确实有解决方案，称为*联合用户*。


    ### AWS 中的用户联合


    如果员工在公司网络中有账户，并且公司在 AWS 网络中也有账户，那么一旦员工登录公司网络，组织就可以将该用户身份联合到 AWS 网络。这样，就减轻了公司员工在
    AWS 内部登录的麻烦。参见图 3-2。


    ![../images/495447_1_En_3_Chapter/495447_1_En_3_Fig2_HTML.jpg](img/495447_1_En_3_Fig2_HTML.jpg)


    图 3-2


    用户联合


    以下是联合的一些特性：


    *   公司网络使用*单点登录* (SSO) 使得联合成为可能。此后，自动登录发生，员工无需再次登录即可进入 Amazon 管理控制台。


    *   即使某人在 Gmail、Facebook、Amazon 等平台拥有账户，这些账户也可用于 SSO。

    '
- fmt: '### How Access Management Is Done in AWS


    In common terminology, *access management* can also be called *authorization*.
    A person or a service that logs in to the AWS account is called a *principal entity*.
    The principal entity is authenticated using `IAM` (it is used to authenticate
    an `IAM` role or a user). Once the authentication is done, the policies attached
    to the particular user or role are checked. These policies help determine what
    permissions are given to the principal entity. They are created and attached to
    different `IAM` identities such as users, roles, or groups. Now, if the principal
    entity sends a request for a service but the permission for the usage of that
    service is not defined in the policies, then the access will be denied. This is
    how access management is done in AWS.


    Policies can be applied based on `IAM` roles, resources, or access control lists.
    An example of a role is a data engineer. All the `IAM` users with the role of
    data engineer will be assigned the same policy. This means everyone in that role
    will be able to access the same resources with the same level of permissions.
    Policies that are applied on resources put restrictions on the usage of a specific
    resource. For example, we can create a policy that gives users the permission
    to read a `DynamoDB` table but not create one. `ACL`s are used when we want to
    apply cross-platform policies.


    An example of a role-based policy is given here. We have defined a JSON file that
    shows the policy defined on `DynamoDB`.


    ```

    {

    "Version": "2012-10-17",

    "Statement": {

    "Effect": "Allow",

    "Action": "dynamodb:*",

    "Resource": "arn:aws:dynamodb:us-east-2:123456789012:table/Books"

    }

    }

    ```


    This gives the user permission to use the `Books` table present in `DynamoDB`.
    This makes it clear that to assign policies, JSON files must be created, and these
    files must be attached to respective entities. Policies not only can be attached
    to specific entities, but to a group of entities as well. These are called *IAM
    groups*; see Figure [3-3](#495447_1_En_3_Chapter.xhtml#Fig3).


    ![../images/495447_1_En_3_Chapter/495447_1_En_3_Fig3_HTML.jpg](images/495447_1_En_3_Chapter/495447_1_En_3_Fig3_HTML.jpg)


    Figure 3-3


    IAM groups


    Figure [3-3](#495447_1_En_3_Chapter.xhtml#Fig3) defines multiple `IAM` users and
    groups them into three `IAM` groups: Admins, Developers, and Test. Now, the policies
    can be applied on the entire group, which gets automatically applied to its members.
    But, one thing to notice here is that if a specific member has not been given
    permission for a service, then even though the group has access to that service,
    the member will still not have permission to access that service.


    Where can we find a summary of all the policies defined? There are three tables
    in the `IAM` console that give us detailed information about policies. These tables
    are as follows:


    - Policy summary

    - Service summary

    - Action summary


    When we open the policy summary, we will see a list of services on which the policies
    have been defined. We can click any of the services to go to that particular service’s
    summary table. The summary table tells all the actions that can be performed on
    that particular service and the permissions attached to those actions. You can
    click any of the actions, and then you can come to the action summary that gives
    the permissions that have been granted to that particular action. Figure [3-4](#495447_1_En_3_Chapter.xhtml#Fig4)
    sums these tables up for you.


    ![../images/495447_1_En_3_Chapter/495447_1_En_3_Fig4_HTML.jpg](images/495447_1_En_3_Chapter/495447_1_En_3_Fig4_HTML.jpg)


    Figure 3-4


    Policy, service, and action summaries


    Policies can be divided into two kinds: identity- and resource-based policies.
    As the names suggest, when the policies are attached to `IAM` roles, users, or
    groups, they are called *identity-based policies*, whereas when we attach them
    to resources such as `S3` buckets or `DynamoDB`, they are called *resource-based
    policies*.


    ### Attribute-Based Access Control


    Before talking about attribute-based access control (ABAC), we must understand
    *AWS tags*. These are some attributes that are attached to `IAM` users, roles,
    groups, or even AWS resources. These tags are useful when we have a big organization
    and we want to make policies for the employees. How are tags useful? Let’s look
    at an example.


    A company making machine learning products has shifted its entire architecture
    to AWS. Now it is making models on Amazon SageMaker, doing data engineering using
    Amazon EMR, making websites, APIs, and doing database management using `DynamoDB`
    and `CloudFormation`, and for security using various other AWS services such as
    `CloudWatch`, `TrustedAdvisor`, etc. Now, let’s also assume that the company has
    about 5,000 employees. Providing `IAM` roles and then attaching policies to every
    employee would be a tedious task. So, what do we do? That’s when tags and ABAC
    come into the picture.


    Imagine two machine learning engineers; one only uses SageMaker and `S3` buckets,
    while the other one uses `EMR` in addition to the services that the other engineer
    uses. The organization can create two tags for different usages. Suppose one tag
    is called *basic-machine-learning*, and the other one is called *advanced-machine-learning*.
    All the machine learning engineers and junior data scientists can be given the
    first tag while defining their `IAM` role. Senior data scientists and solution
    architects can be given the second tag. Now when a junior data scientist tries
    to access `EMR`, the tag is checked, and its respective policies are looked at.
    Immediately the permission will be denied, as the policies are not enough to provide
    this access. But if a solution architect tries to access the same tag which junior
    data scientist accessed, he will be granted the access as the associated policies
    with the tag give the appropriate permission to the person. These tags are also
    called as *attributes*, and hence this process is called *attribute-based access
    control* (ABAC).


    How can we say that the ABAC process is better than the traditional process? Let’s
    look at some of the differences between them. The traditional process is also
    called *role-based access control* (RBAC).


    - The first difference is that in RBAC every time a new resource is added, the
    policies attached to a role or user must be updated—not only for one role, but
    for all the roles. Instead, in ABAC, only the tag needs to be updated.

    - Because of these tags, ABAC has much fewer policies compared to RBAC and hence
    is easier to manage.


    In the second part of this book, we will look at the entire process of creating
    the root credentials and then defining roles, users, groups, etc., using `IAM`.
    In this section, we have covered the theoretical aspects of it. Practically we
    will be looking at the applications in the next section.


    There are some other services that AWS provides to increase the security of the
    applications.


    - AWS WAF

    - AWS Shield

    - AWS Firewall Manager


    Let’s discuss each service one by one.'
