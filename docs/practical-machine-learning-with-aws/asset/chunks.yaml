    # 7. 将 CloudWatch 与 SageMaker 结合使用


    在本章中，我们将详细探讨 AWS 中的 CloudWatch 功能。具体来说，我们将关注 CloudWatch 的两个组件：CloudWatch Logs
    和 CloudWatch Metrics，在使用 SageMaker 时会频繁用到它们。

    '
- fmt: '# Amazon CloudWatch


    `Amazon CloudWatch` is a service provided by Amazon that tracks the resource activities
    of AWS and provides metrics related to it. It also stores the logs that are provided
    by every resource used. Through these logs and metrics, a user can explore the
    performance of an AWS resource being used and what can be done to improve it.


    When it comes to machine learning, especially with `SageMaker`, `CloudWatch Logs`
    gives us the output of containers in which the code is running. As we have already
    seen in the previous chapters, machine learning algorithms run inside a Docker
    container attached to an `EC2` instance. So, the output that originates from these
    containers is not directly visible. To look at this output, we must make some
    adjustments to our code, and then the status can be seen directly in the `Jupyter
    Notebook` in use, or we can use `CloudWatch Logs` to get this output in a step-by-step
    manner. The output can include your model outputs, the reason why your model failed,
    insights into the step-by-step execution, etc. Containers are required for three
    jobs, and hence we have three log groups in machine learning.


    *   Processing Jobs log group

    *   Training Jobs log group

    *   Transform Jobs log group


    We will look at these log groups in detail in the coming sections.


    `CloudWatch Metrics` provides us with information in the form of values to variables.
    For example, when it comes to machine learning, `CloudWatch Metrics` can provide
    values such as the accuracy of a model, precision, error, etc. It can also provide
    metrics related to resources, such as GPU utilization, memory utilization etc.
    We will look at `CloudWatch Metrics` in detail in the coming sections. Figure
    [7-1](#495447_1_En_7_Chapter.xhtml#Fig1) shows the architecture of how CloudWatch
    works.


    ![../images/495447_1_En_7_Chapter/495447_1_En_7_Fig1_HTML.jpg](images/495447_1_En_7_Chapter/495447_1_En_7_Fig1_HTML.jpg)


    Figure 7-1


    Amazon CloudWatch architecture


    By looking at this architecture, we can see that in addition to accessing the
    services through the `Amazon Management Console`, we can integrate alarms through
    `Amazon SNS`, which can be connected to your email. We can also set custom rules
    based on certain criteria. This includes starting, stopping, and terminating a
    process or using features such as autoscaling. Let’s dive deeper into `CloudWatch
    Logs` in the next section.


    ## CloudWatch Logs


    In the `SageMaker` console, on the left side, we have a sidebar that guides us
    through the different operations that are possible in it. We can create notebook
    instances, look at different algorithms that we ran, and analyze the endpoints.
    We can look at the logs of all the services that we have used by viewing the log
    details. Let’s start with the training job–related logs.


    ### Training Jobs


    In the previous chapter, we ran an `XGBoost` model on the Big Mart dataset. Inside
    the `SageMaker` console, if we go to the Training drop-down and select "Training
    jobs" (Figure [7-2](#495447_1_En_7_Chapter.xhtml#Fig2)), we will get a list of
    all the algorithms that we have run (Figure [7-3](#495447_1_En_7_Chapter.xhtml#Fig3)).


    ![../images/495447_1_En_7_Chapter/495447_1_En_7_Fig3_HTML.jpg](images/495447_1_En_7_Chapter/495447_1_En_7_Fig3_HTML.jpg)


    Figure 7-3


    Selecting the job for which the logs need to be analyzed


    ![../images/495447_1_En_7_Chapter/495447_1_En_7_Fig2_HTML.jpg](images/495447_1_En_7_Chapter/495447_1_En_7_Fig2_HTML.jpg)


    Figure 7-2


    Selecting the training job


    We can select the algorithm that we want more details for; in our case, it is
    `XGBoost`. When we click the algorithm, a new page opens with a lot of information
    about the model we ran. For example, it tells about the algorithm specifications
    that we provided while running the model. If we scroll down the page, we will
    come to a section called Monitor (Figure [7-4](#495447_1_En_7_Chapter.xhtml#Fig4)).
    From there we can jump to `CloudWatch Logs`.


    ![../images/495447_1_En_7_Chapter/495447_1_En_7_Fig4_HTML.jpg](images/495447_1_En_7_Chapter/495447_1_En_7_Fig4_HTML.jpg)


    Figure 7-4


    Monitor section


    Click the "View logs" link, and you will see the `CloudWatch` page open. See Figure
    [7-5](#495447_1_En_7_Chapter.xhtml#Fig5).


    ![../images/495447_1_En_7_Chapter/495447_1_En_7_Fig5_HTML.jpg](images/495447_1_En_7_Chapter/495447_1_En_7_Fig5_HTML.jpg)


    Figure 7-5


    Selecting the algorithm for the logs


    As you can see in Figure [7-5](#495447_1_En_7_Chapter.xhtml#Fig5), a lot of options
    are available in the `CloudWatch` console. We are looking at the log groups. As
    you know, because we have selected the training job, this information is present
    at the top of the console (see Figure [7-6](#495447_1_En_7_Chapter.xhtml#Fig6)).


    ![../images/495447_1_En_7_Chapter/495447_1_En_7_Fig6_HTML.jpg](images/495447_1_En_7_Chapter/495447_1_En_7_Fig6_HTML.jpg)


    Figure 7-6


    Path


    When we scroll down, at the bottom we can see the name of the algorithm. We must
    click it to get to the logs (see Figure [7-7](#495447_1_En_7_Chapter.xhtml#Fig7)).


    ![../images/495447_1_En_7_Chapter/495447_1_En_7_Fig7_HTML.jpg](images/495447_1_En_7_Chapter/495447_1_En_7_Fig7_HTML.jpg)


    Figure 7-7


    Visualizing the logs


    You can see that the complete logs related to your algorithm will be present there.
    We get the step-by-step results, which in this case includes the train and validation
    error. You can keep scrolling down until the end of the page to reach the last
    output of the algorithm. This is how you can look at the logs of any training
    algorithm that you have executed.


    Remember, the logs will start appearing only once the container has successfully
    started and the algorithms have started running. If there is a problem with your
    Docker script, then you will not find any logs generated. But, if your code related
    to the algorithm has an error, then you will find the information in the logs
    section, as the container had successfully started, and hence the logs have started
    generating. So, if your model is not running, you can come to the logs to check
    the error in the code. With custom containers, if the logs don’t start running,
    in general the error is probably in the Docker script. We will explore the custom
    containers in the next chapter. Let’s now look at the logs for processing jobs.'
  raw: '## Amazon CloudWatch


    Amazon CloudWatch is a service provided by Amazon that tracks the resource activities
    of AWS and provides metrics related to it. It also stores the logs that are provided
    by every resource used. Through these logs and metrics, a user can explore the
    performance of an AWS resource being used and what can be done to improve it.


    When it comes to machine learning, especially with SageMaker, CloudWatch Logs
    gives us the output of containers in which the code is running. As we have already
    seen in the previous chapters, machine learning algorithms run inside a Docker
    container attached to an EC2 instance. So, the output that originates from these
    containers is not directly visible. To look at this output, we must make some
    adjustments to our code, and then the status can be seen directly in the Jupyter
    Notebook in use, or we can use CloudWatch Logs to get this output in a step-by-step
    manner. The output can include your model outputs, the reason why your model failed,
    insights into the step-by-step execution, etc. Containers are required for three
    jobs, and hence we have three log groups in machine learning.


    *   Processing Jobs log group


    *   Training Jobs log group


    *   Transform Jobs log group


    We will look at these log groups in detail in the coming sections.


    CloudWatch Metrics provides us with information in the form of values to variables.
    For example, when it comes to machine learning, CloudWatch Metrics can provide
    values such as the accuracy of a model, precision, error, etc. It can also provide
    metrics related to resources, such as GPU utilization, memory utilization etc.
    We will look at CloudWatch Metrics in detail in the coming sections. Figure [7-1](#495447_1_En_7_Chapter.xhtml#Fig1)
    shows the architecture of how CloudWatch works.


    ![../images/495447_1_En_7_Chapter/495447_1_En_7_Fig1_HTML.jpg](images/495447_1_En_7_Chapter/495447_1_En_7_Fig1_HTML.jpg)


    Figure 7-1


    Amazon CloudWatch architecture


    By looking at this architecture, we can see that in addition to accessing the
    services through the Amazon Management Console, we can integrate alarms through
    Amazon SNS, which can be connected to your email. We can also set custom rules
    based on certain criteria. This includes starting, stopping, and terminating a
    process or using features such as autoscaling. Let’s dive deeper into CloudWatch
    Logs in the next section.


    ## CloudWatch Logs


    In the SageMaker console, on the left side, we have a sidebar that guides us through
    the different operations that are possible in it. We can create notebook instances,
    look at different algorithms that we ran, and analyze the endpoints. We can look
    at the logs of all the services that we have used by viewing the log details.
    Let’s start with the training job–related logs.


    ### Training Jobs


    In the previous chapter, we ran an XGBoost model on the Big Mart dataset. Inside
    the SageMaker console, if we go to the Training drop-down and select “Training
    jobs” (Figure [7-2](#495447_1_En_7_Chapter.xhtml#Fig2)), we will get a list of
    all the algorithms that we have run (Figure [7-3](#495447_1_En_7_Chapter.xhtml#Fig3)).


    ![../images/495447_1_En_7_Chapter/495447_1_En_7_Fig3_HTML.jpg](images/495447_1_En_7_Chapter/495447_1_En_7_Fig3_HTML.jpg)


    Figure 7-3


    Selecting the job for which the logs need to be analyzed


    ![../images/495447_1_En_7_Chapter/495447_1_En_7_Fig2_HTML.jpg](images/495447_1_En_7_Chapter/495447_1_En_7_Fig2_HTML.jpg)


    Figure 7-2


    Selecting the training job


    We can select the algorithm that we want more details for; in our case, it is
    XGBoost. When we click the algorithm, a new page opens with a lot of information
    about the model we ran. For example, it tells about the algorithm specifications
    that we provided while running the model. If we scroll down the page, we will
    come to a section called Monitor (Figure [7-4](#495447_1_En_7_Chapter.xhtml#Fig4)).
    From there we can jump to CloudWatch Logs.


    ![../images/495447_1_En_7_Chapter/495447_1_En_7_Fig4_HTML.jpg](images/495447_1_En_7_Chapter/495447_1_En_7_Fig4_HTML.jpg)


    Figure 7-4


    Monitor section


    Click the “View logs” link, and you will see the CloudWatch page open. See Figure
    [7-5](#495447_1_En_7_Chapter.xhtml#Fig5).


    ![../images/495447_1_En_7_Chapter/495447_1_En_7_Fig5_HTML.jpg](images/495447_1_En_7_Chapter/495447_1_En_7_Fig5_HTML.jpg)


    Figure 7-5


    Selecting the algorithm for the logs


    As you can see in Figure [7-5](#495447_1_En_7_Chapter.xhtml#Fig5), a lot of options
    are available in the CloudWatch console. We are looking at the log groups. As
    you know, because we have selected the training job, this information is present
    at the top of the console (see Figure [7-6](#495447_1_En_7_Chapter.xhtml#Fig6)).


    ![../images/495447_1_En_7_Chapter/495447_1_En_7_Fig6_HTML.jpg](images/495447_1_En_7_Chapter/495447_1_En_7_Fig6_HTML.jpg)


    Figure 7-6


    Path


    When we scroll down, at the bottom we can see the name of the algorithm. We must
    click it to get to the logs (see Figure [7-7](#495447_1_En_7_Chapter.xhtml#Fig7)).


    ![../images/495447_1_En_7_Chapter/495447_1_En_7_Fig7_HTML.jpg](images/495447_1_En_7_Chapter/495447_1_En_7_Fig7_HTML.jpg)


    Figure 7-7


    Visualizing the logs


    You can see that the complete logs related to your algorithm will be present there.
    We get the step-by-step results, which in this case includes the train and validation
    error. You can keep scrolling down until the end of the page to reach the last
    output of the algorithm. This is how you can look at the logs of any training
    algorithm that you have executed.


    Remember, the logs will start appearing only once the container has successfully
    started and the algorithms have started running. If there is a problem with your
    Docker script, then you will not find any logs generated. But, if your code related
    to the algorithm has an error, then you will find the information in the logs
    section, as the container had successfully started, and hence the logs have started
    generating. So, if your model is not running, you can come to the logs to check
    the error in the code. With custom containers, if the logs don’t start running,
    in general the error is probably in the Docker script. We will explore the custom
    containers in the next chapter. Let’s now look at the logs for processing jobs.'
  trans: '

    ## Amazon CloudWatch


    Amazon CloudWatch 是亚马逊提供的一项服务，用于追踪 AWS 的资源活动并提供相关指标。它还会存储每个所用资源提供的日志。通过这些日志和指标，用户可以了解所用
    AWS 资源的性能，并探索改进方法。


    在机器学习领域，尤其是使用 SageMaker 时，CloudWatch Logs 会提供代码运行所在容器的输出。正如我们在前几章中看到的，机器学习算法运行在附加到
    EC2 实例的 Docker 容器内。因此，这些容器产生的输出无法直接查看。要查看这些输出，我们需要对代码进行一些调整，然后状态就可以直接在所使用的 Jupyter
    Notebook 中看到，或者我们可以使用 CloudWatch Logs 逐步获取这些输出。输出内容可以包括模型输出、模型失败的原因、逐步执行的详细信息等。三个任务都需要容器，因此我们在机器学习中有三个日志组。


    *   Processing Jobs（处理作业）日志组

    *   Training Jobs（训练作业）日志组

    *   Transform Jobs（转换作业）日志组


    我们将在后续章节中详细查看这些日志组。


    CloudWatch Metrics 以变量值的形式向我们提供信息。例如，在机器学习中，CloudWatch Metrics 可以提供模型准确率、精确率、误差等值。它还可以提供与资源相关的指标，例如
    GPU 利用率、内存利用率等。我们将在后续章节中详细查看 CloudWatch Metrics。图 7-1 展示了 CloudWatch 的工作原理架构。


    ![../images/495447_1_En_7_Chapter/495447_1_En_7_Fig1_HTML.jpg](img/495447_1_En_7_Fig1_HTML.jpg)


    图 7-1


    Amazon CloudWatch 架构


    通过查看此架构，我们可以看到，除了通过 Amazon 管理控制台访问服务外，我们还可以通过 Amazon SNS 集成告警，这些告警可以连接到您的电子邮件。我们还可以根据特定条件设置自定义规则。这包括启动、停止和终止进程，或使用自动扩缩等功能。让我们在下一节中更深入地了解
    CloudWatch Logs。


    ## CloudWatch Logs


    在 SageMaker 控制台中，左侧有一个侧边栏，指导我们完成其中可能执行的不同操作。我们可以创建 Notebook 实例、查看我们运行过的不同算法以及分析端点。我们可以通过查看日志详细信息来查看我们使用过的所有服务的日志。让我们从训练作业相关的日志开始。


    ### 训练作业


    在上一章中，我们在 Big Mart 数据集上运行了一个 XGBoost 模型。在 SageMaker 控制台内部，如果我们转到“训练”下拉菜单并选择“训练作业”（图
    7-2），我们将看到所有已运行算法的列表（图 7-3）。


    ![../images/495447_1_En_7_Chapter/495447_1_En_7_Fig3_HTML.jpg](img/495447_1_En_7_Fig3_HTML.jpg)


    图 7-3


    选择需要分析日志的作业


    ![../images/495447_1_En_7_Chapter/495447_1_En_7_Fig2_HTML.jpg](img/495447_1_En_7_Fig2_HTML.jpg)


    图 7-2


    选择训练作业


    我们可以选择想要了解更多细节的算法；在我们的例子中，是 XGBoost。当我们点击该算法时，会打开一个新页面，其中包含有关我们运行的模型的大量信息。例如，它会告诉我们运行模型时提供的算法规范。如果向下滚动页面，我们会看到一个名为“监控”的部分（图
    7-4）。从那里我们可以跳转到 CloudWatch Logs。


    ![../images/495447_1_En_7_Chapter/495447_1_En_7_Fig4_HTML.jpg](img/495447_1_En_7_Fig4_HTML.jpg)


    图 7-4


    监控部分


    点击“查看日志”链接，您将看到 CloudWatch 页面打开。见图 7-5。


    ![../images/495447_1_En_7_Chapter/495447_1_En_7_Fig5_HTML.jpg](img/495447_1_En_7_Fig5_HTML.jpg)


    图 7-5


    选择用于日志的算法


    如图 7-5 所示，CloudWatch 控制台中有许多可用选项。我们正在查看日志组。如您所知，因为我们选择了训练作业，此信息显示在控制台顶部（见图 7-6）。


    ![../images/495447_1_En_7_Chapter/495447_1_En_7_Fig6_HTML.jpg](img/495447_1_En_7_Fig6_HTML.jpg)


    图 7-6


    路径


    当我们向下滚动时，可以在底部看到算法的名称。我们必须点击它才能进入日志（见图 7-7）。


    ![../images/495447_1_En_7_Chapter/495447_1_En_7_Fig7_HTML.jpg](img/495447_1_En_7_Fig7_HTML.jpg)


    图 7-7


    可视化日志


    您可以看到与您的算法相关的完整日志将出现在那里。我们得到逐步的结果，在本例中包括训练误差和验证误差。您可以继续向下滚动到页面末尾，以查看算法的最后输出。这就是如何查看您已执行的任何训练算法的日志。


    请记住，只有在容器成功启动并且算法开始运行后，日志才会开始出现。如果您的 Docker 脚本有问题，那么您将找不到任何生成的日志。但是，如果与算法相关的代码有错误，那么您会在日志部分找到信息，因为容器已成功启动，因此日志已开始生成。因此，如果您的模型没有运行，您可以查看日志以检查代码中的错误。对于自定义容器，如果日志没有开始运行，通常错误可能出在
    Docker 脚本中。我们将在下一章探讨自定义容器。现在，让我们看看处理作业的日志。

