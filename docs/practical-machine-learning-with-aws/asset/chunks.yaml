    #### 磁带网关


    此服务用于数据归档。为此，我们可以使用 Amazon S3 Glacier 或 Deep Archive 作为存储服务。它也可以使用虚拟机在本地部署。图 1-8
    所示的架构展示了磁带网关的工作原理。


    ![../images/495447_1_En_1_Chapter/495447_1_En_1_Fig8_HTML.jpg](img/495447_1_En_1_Fig8_HTML.jpg)


    图 1-8


    磁带网关，存储网关架构


    在架构中可以看到，不同的基础设施将数据存储到各自的 S3 存储桶中。随后，所有 S3 存储桶的数据被合并，然后存储到 Amazon S3 Glacier 中。虚拟磁带本质上只是一种存储数据的方式。就像物理磁带在未使用时是空的，使用时才被填充数据一样，虚拟磁带也可以是空白的，并可根据需要填充数据。


    现在我们已经了解了 AWS 存储服务的运作方式并查看了不同的服务，接下来让我们继续探索计算服务。


    ## AWS 计算服务


    在上一节中，您学习了如何使用 AWS 服务存储数据。在本节中，我们将介绍 AWS 提供的一些计算服务。当我们运行应用程序、玩游戏或开发某些东西时，我们需要系统的计算能力。我们通过
    RAM、处理器、显卡等来衡量计算能力。有时我们可能有较大的系统需求，但由于资金或资源不足而无法满足。这就是 Amazon 为所有计算需求提供不同类型服务的原因。在本节中，我们将讨论以下
    AWS 计算服务：


    *   Amazon EC2


    *   Amazon ECR


    ### Amazon EC2


    弹性计算云 (EC2) 减轻了用户在硬件需求上投资的负担。无论需求如何，EC2 都允许您创建相应数量的虚拟服务器，以便立即处理工作。此外，它不是静态的基础设施，而是动态的。这意味着，如果计算需求突然激增，EC2
    会自动扩展，而不会中断正在进行的进程。


    以下是 EC2 为其用户提供的一些功能：


    *   它提供了一个环境，我们可以在其中进行计算密集型工作。这是在 AWS 称之为*实例*的虚拟计算环境中完成的。

    *   无论您的软件或硬件需求是什么，您都可以使用 Amazon 系统映像 (AMI) 服务进行配置。

    *   它为您启动的所有实例提供安全性。它还提供安全组，帮助用户配置防火墙、端口、IP 范围等。


    此外，还有许多其他服务可以帮助用户进行日常编码和开发工作。


    EC2 提供的实例类型可以分为以下几类：


    *   通用型

    *   计算优化型

    *   内存优化型

    *   存储优化型

    *   加速计算型


    #### 通用型


    这些类型提供了计算能力、存储和网络之间的平衡。它们进一步分为以下几组：


    *   A1

    *   T3

    *   T2

    *   M6g

    *   M5

    *   M5a

    *   M5n

    *   M4


    #### 计算优化型


    当工作需要高计算使用率并需要强大处理器时，您可以使用计算优化型实例。它们可用于媒体任务、科学任务、快速 Web 服务器甚至游戏服务器。它们可以分为以下类型：


    *   C5

    *   C5n

    *   C4


    您可以在 [`https://aws.amazon.com/ec2/instance-types/`](https://aws.amazon.com/ec2/instance-types/)
    找到有关这些组的更多信息。


    #### 内存优化型


    如果工作需要处理大型数据集，您需要内存优化型实例。它们分为以下类型：


    *   R

    *   R5a

    *   R5n

    *   R4

    *   X1e

    *   X1

    *   高内存

    *   z1d


    #### 加速计算型


    对于所有机器学习和深度学习应用，首选这类实例。这些系统速度非常快，精度也非常高。它们可以分为以下类型：


    *   P3

    *   P2

    *   Inf1

    *   G4

    *   G3

    *   F1


    #### 存储优化型


    如果您想处理海量数据集，并希望以更低的延迟实现更快的读写操作，那么这种类型是最佳选择。它们可以分为以下类型：


    *   I3

    *   I3en

    *   D2

    *   H1


    您可以在 [`https://aws.amazon.com/ec2/instance-types/`](https://aws.amazon.com/ec2/instance-types/)
    找到关于每种实例类型的详细信息。


    ### 其他服务


    AWS 还提供与大多数前述实例类型配合使用的其他服务。这样做是为了根据您的使用情况为您提供经济上的优惠。这些服务包括：


    *   按需实例

    *   预留实例

    *   竞价型实例


    如果您认为您的工作不会花费很长时间，比如几天或几个月，那么您可以选择*按需实例*。这些实例按小时计费。无论您需要多大的计算、内存和存储容量，都可以使用，但费用将根据使用的小时数计算。


    *预留实例*适用于长期使用，因此用户可获得的折扣高达按需实例价格的 75%。这还提供了更改类型的选项。


    有时会有大量 EC2 实例未被使用。*竞价型实例*让您能够利用这些实例，与使用按需实例相比，使用竞价型实例可获得高达 90% 的折扣。


    ## Amazon Elastic Container Registry


    近年来，Docker 席卷了整个行业。它允许公司将其基础设施与代码分离。简而言之，Docker 为您提供了一个平台，您可以在该平台上高效地开发和交付代码，而无需担心底层架构。Amazon
    ECR 是一个存储库，用于存放您希望在 AWS 中运行的所有 Docker 镜像。


    一旦您启动了一个 EC2 实例，您就可以选择在该实例上运行任何 Docker 镜像。AWS 有自己的预构建 Docker 镜像可供您导入，或者您也可以将自己定制的
    Docker 镜像上传到 ECR，然后导入到 EC2 实例中。


    Amazon ECR 包含以下组件：


    *   注册表

    *   身份验证令牌

    *   存储库

    *   策略

    *   镜像


    注册表就像一个普通的登记簿，您需要为您上传到 ECR 的每个镜像进行登记。为了确保只有合适的人才能访问 ECR 上传镜像，会使用身份验证令牌。存储库是实际存储您的
    Docker 镜像的地方。镜像就是您实际的 Docker 文件。这些是您创建的包含所有依赖项的文件。您使用镜像将它们存储在 ECR 中，并导入到 EC2 中。


    在后续章节介绍 SageMaker 时，您将详细了解 ECR 的操作。


    ## AWS 网络和内容分发服务


    在本节中，我们将讨论 AWS 在该领域的三个重要服务。


    *   Amazon VPC

    *   Amazon API Gateway

    *   Amazon CloudFront

