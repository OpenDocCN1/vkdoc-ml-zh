    ![../images/495447_1_En_5_Chapter/495447_1_En_5_Fig21_HTML.jpg](images/495447_1_En_5_Chapter/495447_1_En_5_Fig21_HTML.jpg)


    Figure 5-21


    Jobs information in CloudWatch


    We will click the ProcessingJobs section and search for the processing job name
    that we gave to our job. Once we find it, click the link. It will give us some
    output similar to Figure [5-22](#495447_1_En_5_Chapter.xhtml#Fig22).


    ![../images/495447_1_En_5_Chapter/495447_1_En_5_Fig22_HTML.jpg](images/495447_1_En_5_Chapter/495447_1_En_5_Fig22_HTML.jpg)


    Figure 5-22


    Job logs in CloudWatch


    If you have any errors, you can find them listed here as well, based on the processing
    job’s name. That’s why I mentioned before that the name should be unique. There
    are a lot of other sections as well in CloudWatch, but for now they are not important.
    We will explore them when the need arises.


    One thing to remember here is that inside the SageMaker console, you won’t find
    the logs of the processing jobs. That’s why you have to come to CloudWatch to
    find the job. For most training jobs, transformation jobs, etc., you’ll find the
    logs directly in the console of SageMaker—but not for processing jobs.


    ## Conclusion


    This chapter was all about the processing of raw data using SageMaker. In the
    next chapter, we will look at most of the built-in algorithms of SageMaker in
    detail. We will start with the processing of raw data and then move on to training
    the model and saving the model artifacts to an S3 bucket.


    # 6. Building and Deploying Models in SageMaker


    In this chapter, we will be exploring some of SageMaker’s built-in algorithms
    that are widely used in the industry. We will be exploring the algorithms from
    the general domain, natural language processing domain, computer vision domain,
    and forecasting domain.


    ## Exploring the Linear Learner Algorithm


    The linear learner algorithm of SageMaker is similar to the regression algorithms
    in the machine learning domain. We can make multiple linear regression, logistic
    regression, and multinomial logistic regression models using the linear learner
    algorithm. In this section, we will look at how this algorithm can be used for
    linear regression and logistic regression. We will use the Big Mart dataset that
    we used in the previous chapter to apply this algorithm. Before delving into how
    to apply linear learner in SageMaker, let’s take a brief look at linear and logistic
    regression.


    ### Overview of Linear Regression


    Linear regression is one of the most basic yet most important algorithms in machine
    learning. It is used to fit a line (or a curve in the case of nonlinear regression)
    on the observations and then interpolate the fitted line to get the predictions.
    To fit the line, we use an approach that is called *least squares estimations*
    , which gives us our coefficient values. These coefficient values are determined
    in such a way that the mean of the errors is approximately zero. Errors are the
    Euclidean distance of each observation from the fitted line. Figure [6-1](#495447_1_En_6_Chapter.xhtml#Fig1)
    shows simple linear regression used to fit a line.


    ![../images/495447_1_En_6_Chapter/495447_1_En_6_Fig1_HTML.jpg](images/495447_1_En_6_Chapter/495447_1_En_6_Fig1_HTML.jpg)


    Figure 6-1


    Simple linear regression


    Linear regression is used to predict numerical values. There are various versions
    of regression, namely, ridge regression, lasso regression, elastic net regression,
    Gaussian regression, etc.'
