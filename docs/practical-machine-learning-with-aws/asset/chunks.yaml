    ## 使用 SageMaker 的 Scikit-Learn 容器进行预处理


    我们使用 SageMaker 是为了利用其多项优势，尤其是计算能力、API 生成和存储的便捷性。因此，为了实现这些目标，代码必须以特定格式编写。我们将使用上一节中看到的相同代码，但会对整体结构进行一些修改，使其与
    SageMaker 兼容。


    首先，数据应位于 S3 存储桶中。在本章的第一节中，我们已经将`Train.csv`文件放入了存储桶。完成此操作后，我们就可以开始编写代码了。首先，我们将定义用户的角色以及我们使用
    SageMaker 服务的区域。


    ```

    import boto3

    import sagemaker

    from sagemaker import get_execution_role

    region = boto3.session.Session().region_name

    role = get_execution_role()

    ```


    如果我们使用 SageMaker notebook，Boto3 包会尝试自动提取区域名称。如果我们在本地主机 notebook 上工作，则需要自定义定义区域。我们将在本书的最后部分讨论这部分内容。`get_execution_role()`提取用户登录时使用的当前角色。它可以是根用户或
    IAM 角色。


    现在我们已经定义了区域和角色，下一步将是定义我们的 Scikit-Learn 容器。正如本书第一部分所述，SageMaker 基于 Docker 容器运行。所有内置算法本质上都是
    Docker 容器，甚至自定义算法也必须放入 Docker 容器中并上传到 ECR。由于我们将使用 Scikit-Learn 处理数据，SageMaker
    已经为此提供了一个处理容器。我们只需要实例化它，然后使用它即可。


    ```

    from sagemaker.sklearn.processing import SKLearnProcessor

    sklearn_processor = SKLearnProcessor(framework_version=''0.20.0'',

    role=role,

    instance_type=''ml.m5.xlarge'',

    instance_count=1)

    ```


    在前面的代码中，我们创建了一个名为`SKLearnProcessor`的对象。传递的参数指定了要使用的 Scikit-Learn 版本、要传递给实例的 IAM
    角色、要使用的计算实例类型，以及最后要启动的计算实例数量。完成此操作后，我们编写的任何使用 Scikit-Learn 的 Python 脚本都可以在此容器内运行。


