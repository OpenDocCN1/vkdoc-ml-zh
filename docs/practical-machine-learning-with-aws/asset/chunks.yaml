  trans: "\n### 理解 SageMaker 的工作原理\n\n图 4-6 展示了 SageMaker 工作的逐步流程。\n\n此图不仅适用于 SageMaker，也适用于我们构建的任何机器学习模型。它们都遵循相同的过程。以下是该过程遵循的主要步骤：\n\
    \n1.  **获取数据**\n\n    这是构建任何机器学习模型的第一步。一旦我们确定了要解决的问题陈述，就必须收集与之相关的所有数据。数据可以是数据库表、Excel\
    \ 表格、文本文件、Word 文档、图像等格式。当我们了解所有数据源后，需要将这些文件放入一个单一的存储库中，以便模型知道其位置。\n\n2.  **清洗数据**\n\
    \n    我们的数据可能包含空值、异常值、拼写错误的单词、损坏的文件等。在将数据提供给模型之前，需要探索并解决所有这些问题。数据清洗也使用了许多统计方法。\n\
    \n3.  **准备数据**\n\n    一旦数据清洗完毕，就该准备数据了。这包括对数据执行的所有转换、缩放和归一化过程、特征组合或特征拆分等。完成所有这些操作后，必须将其存储在特定位置，以便模型知道干净且准备好的数据文件的引用。\n\
    \n    我们看到的这三个步骤，所有这些操作都可以在 SageMaker Jupyter Notebook 中完成，之后，清洗后的数据可以存储在 S3 存储桶中。\n\
    \n4.  **训练模型**\n\n    数据准备好后，我们需要训练模型。首先要选择需要应用的模型。可以从 SageMaker 提供的内置算法列表中选择模型，也可以通过创建自己的容器并将其上传到\
    \ AWS 或从 AWS 市场购买来使用自定义模型。\n\n    此外，为了训练模型，我们必须决定需要什么样的计算资源。可以根据 RAM 大小或 GPU\
    \ 数量等进行选择。这取决于数据集的大小或模型的复杂程度。\n\n5.  **评估训练好的模型**\n\n    模型在数据集上成功训练后，在将其部署到生产环境之前需要进行评估。为此，可以使用多种指标。对于回归模型，可以使用\
    \ RMSE 分数；而对于分类模型，可以使用精确率和召回率。只有当指标超过设定的阈值时，才能将其推向生产环境。\n\n6.  **将模型部署到生产环境**\n\
    \n    在 SageMaker 中部署模型很容易。通常，在正常情况下，需要制作 API，然后通过端点提供模型服务。所有这些都需要编码。但是，在 SageMaker\
    \ 中，只需最少的编码工作，模型就可以转换为 API 端点，之后就可以开始实时或批量模型推理。此外，部署模型时可以选择另一个计算实例，与训练模型实例相比，该实例通常需要更少的\
    \ RAM 或 GPU。\n\n7.  **监控模型**\n\n    一旦模型开始在生产环境中提供服务，我们可以持续监控模型的性能。我们可以衡量模型在哪些数据点上表现良好，以及在哪些方面表现不佳。这个过程被称为了解*真实情况*。\n\
    \n8.  **当更多数据到来时重复该过程（重新训练）**\n\n    最后，当新数据到来时，可以重新训练模型，并且可以重复所有前面的步骤。所有这些都可以在零停机时间的情况下完成。这意味着旧模型会持续提供服务，直到新模型投入生产。\n\
    \n### SageMaker 中的数据预处理\n\n正如我们在上一节中讨论的，在将数据提供给任何模型之前，我们首先要对其进行清洗和预处理。我们可以通过多种方式在\
    \ SageMaker 中完成此操作。\n\n*   使用 SageMaker Jupyter Notebook 编写 Python 脚本来处理数据\n*\
    \   使用 SageMaker 批量转换脚本在处理数据之前获取推理结果\n*   使用脚本处理器编写数据处理脚本\n\n使用这些方法之一，可以处理数据，然后可以调用任何\
    \ SageMaker 训练模型来对此处理后的数据进行训练。为此，我们可以使用流行的 Python 库，例如 Scikit-Learn 或 TensorFlow。如果您的脚本涉及其他库，则可以将自己的脚本上传到\
    \ Docker 容器中。您将在后续章节中了解更多相关信息。\n\n### SageMaker 中的模型训练\n\n图 4-7 展示了模型训练和模型部署的具体过程。在本节中，我们将讨论训练部分，而在下一节中，我们将介绍部署部分。\n\
    \n![../images/495447_1_En_4_Chapter/495447_1_En_4_Fig7_HTML.jpg](img/495447_1_En_4_Fig7_HTML.jpg)\n\
    \n图 4-7\n\nSageMaker 训练和部署过程\n\n要理解 SageMaker 中的模型训练是如何工作的，我们将查看图像的底部部分。我们可以看到有五个部分对此有贡献。\n\
    \n*   用于训练数据的 S3 存储桶\n*   辅助代码\n*   训练代码\n*   训练代码镜像\n*   用于模型工件的 S3 存储桶\n\n在\
    \ SageMaker 中训练模型被称为*训练作业*。在 SageMaker 中执行的任何算法都需要训练数据存在于 S3 存储桶中。这是因为用于训练模型的计算实例是在模型执行期间动态调用的，并且它们不是持久化的。这意味着一旦作业完成，存储在那里的数据将被删除。因此，我们可以将数据保存在\
    \ S3 中，模型将始终知道通过 S3 URL 从何处获取数据。\n\n用 Python 编写的编码部分包含两个部分。第一部分，辅助代码，帮助您处理数据、获取数据、存储输出等。第二部分，训练代码，通过将所选算法应用于数据来实际为您进行模型训练。\n\
    \n训练代码镜像是存储在 AWS ECR 中的 Docker 容器镜像。它包含执行代码所需的所有包和软件。它还包含您编写的训练和部署脚本。我们将所有需要的东西打包到一个容器中，并将其推送到\
    \ ECR。然后，我们只需将镜像的 URL 传递给所选算法，训练脚本就会自动运行。我们需要理解 SageMaker 是基于 Docker 容器工作的，因此用户在学\
    \ SageMaker 之前必须先了解 Docker。\n\n最后，一旦模型训练完成，模型相关的参数值应存储在 S3 中；如前所述，一旦训练作业完成，计算实例将被删除，因此我们将丢失所有学习到的参数。这就是为什么\
    \ S3 成为存储所有信息的共同点。\n\n这里需要注意的一点是，Docker 镜像是由您构建的，但我们仍然没有选择硬件要求。因此，当我们调用 SageMaker\
    \ 算法并传递诸如 S3 URL 和 Docker 镜像 URL 等参数时，我们才能传递必须选择的实例类型。这些实例是我们在第 1 章中看到的 EC2 实例。一旦我们选择了实例，Docker\
    \ 镜像就会连同训练数据一起下载到该实例上。最后，模型训练开始。\n\n我们将在接下来的章节中探讨在 SageMaker 中训练模型的这些方面。\n"
- fmt: '### Model Deployment in SageMaker


    Once the model training is done, all the learned parameters are stored in the
    S3 bucket and called *model artifacts*. These model artifacts will be used during
    inference (or predictions). In Figure [4-7](#495447_1_En_4_Chapter.xhtml#Fig7)
    the bottom part was the model training part; now we will discuss the upper part,
    which is the model deployment part. It consists of the following sections:


    - URL reference to model artifacts in S3 bucket

    - Helper and inference code

    - Inference code image

    - Endpoint

    - Client


    The helper and inference code consists of processing scripts and prediction scripts.
    Also, it includes the format in which the predictions need to be sent or saved.
    For the predictions, the model artifacts generated during the training part are
    used.


    SageMaker removes the training compute requirements with the deployment compute
    requirements. This is because training may require big instances with stronger
    computational power, but for predictions we do not require that many big instances.
    Hence, the predictions can be done with smaller instances as well. This helps
    save a lot of cost.


    We can use the same Docker image that we built for training a model for the inference
    by just adding a few extra Python scripts that help in deployment. That may include
    using packages such as `Flask`, `Gunicorn`, etc. To start the deployment, we need
    to pass the model artifacts the URL, the ECR image URL, and the compute instance
    that we need. By giving these three parameters, the deployment is made, and an
    endpoint is created.


    The endpoint is a place where we send requests in a particular format, maybe CSV
    or JSON, and get the response from the model. This is called a RESTful API. The
    model that is created is served through this API, and the data on which we want
    predictions is sent as a CSV, row by row, and we get the predictions in the same
    way. These are POST and GET requests. We can expose this endpoint to any client
    objects. It can be a website, a mobile app, an IOT device, or anything else. We
    just need some records sent to the endpoint and to get the predictions.


    Endpoints are used when we make live predictions. Hence, they keep running until
    and unless we manually stop them or add a timeout condition. But suppose we want
    the predictions for a subset of data, maybe 5,000 rows, and we don’t want a live
    endpoint. Then SageMaker supports something called a *batch transform*. Using
    this approach, we provide the same parameters that we provided to deployment code,
    but one extra parameter is provided. It is the link to the data on which inference
    is needed. This data is again stored in S3 and hence downloaded to the instance
    when prediction is required. After the prediction is done, predictions are stored
    in S3, and then the compute instance is stopped immediately. Figure [4-8](#495447_1_En_4_Chapter.xhtml#Fig8)
    shows the process of batch transform in SageMaker.


    ![../images/495447_1_En_4_Chapter/495447_1_En_4_Fig8_HTML.jpg](images/495447_1_En_4_Chapter/495447_1_En_4_Fig8_HTML.jpg)


    Figure 4-8


    Batch processing


    We will look at both the approaches, endpoint generation and batch transform,
    in the upcoming chapters.


    ### Built-in SageMaker Algorithms


    The following are all the algorithms that SageMaker provides:


    - **Blazing text**


    This algorithm is used for problem statements involving text classification. It
    is an optimized version of the `Word2Vec` algorithm and can be used for multiple
    tasks such as sentiment analysis, named entity recognition, etc.


    - **DeepAR forecasting**


    This algorithm is used in the domain of univariate time-series forecasting using
    RNNs. It can be used to train on multiple similar time-series data, and it outperforms
    the ARIMA or exponential smoothing methods in most of the scenarios.


    - **Factorization machines**


    This is a general-purpose algorithm that can be used both for regression and for
    classification tasks. For classification, it only supports binary classification
    problems.


    - **Image classification**


    This is built on ResNet (CNN model) for multilabel classification of images. It
    can be trained from scratch if the dataset available is big; otherwise, transfer
    learning can be applied if the size of the dataset is small.


    - **IP insights**


    This algorithm is used for a special use case—finding the usage patterns for IPv4
    addresses. It can be used to find out whether the IP address from which a user
    is sending a request is anomalous.


    - **K-means**


    This algorithm is used to find clusters of data that are following similar patterns.
    It is an optimized version of the statistical k-means clustering algorithm.


    - **K-nearest neighbor**


    It is used for the classification of data by using an approach finding the nearest
    neighbors. It is an optimized version of the k-nearest neighbor statistical algorithm.


    - **Latent Dirichlet allocation**


    This is an algorithm used to find out topics present inside documents, and hence
    the domain of application is also called *topic modeling*. It is an unsupervised
    learning approach used to find out categories from a bunch of documents.


    - **Linear learner**


    This is a normal simple and multiple linear regression algorithm having the capacity
    to perform logistic regression as well on the classification problems.


    - **Neural topic model**


    This is again a topic modeling approach, where the topics are extracted from a
    bunch of documents by finding out their statistical distributions. This algorithm
    can be used in the domain on text summarization or recommendations.


    - **Object2Vec**


    This is used for generating the vectors for the objects, and it is similar to
    the `Word2Vec` algorithm. The only thing is that it is a generalized version of
    it. Using this approach, a lot of optimized and efficient classification and regression
    can be made giving us better performance.


    - **Object detection**


    Finding and recognizing objects present in an image is the main task of this algorithm.
    It contains a single deep neural network to perform this operation. The framework
    used in this model is single-shot multibox detector (SSD) and uses VGGNet and
    ResNet as a base.


    - **Principal component analysis**


    This is based on finding the importance of variables and then combining variables
    based on the similarity. It is used for the dimensionality reduction of data so
    that the number of variables can be reduced based on combining their importance
    using the concept of eigenvalues and eigenvectors.


    - **Random cut forest**


    This algorithm is used to find patterns present inside the datasets and then find
    those patterns that deviate from all the general patterns present in the dataset.
    For example, why is there an unnecessary spike in time-series data? Why is a particular
    data point not being able to be classified? These are a few of the multiple uses
    of the random cut forest method.


    - **Semantic segmentation**


    This is used for developing computer vision applications. It is a pixel-level
    approach algorithm where each pixel is labeled based on the data. It can be used
    in the domain of self-driving cars, medical imaging, etc.


    - **SeqtoSeq modeling**


    This is used when we have a sequence of input and we have to generate a sequence
    of outputs. For example, we can have sequences of input in German and need to
    translate the sequence into English. Similarly, it can be used for time-series
    data, images, and other text applications. This algorithm uses RNNs and CNNs with
    an attention-based approach.


    - **XGBoost**


    This is one of the highly optimized versions of ensemble trees that uses the concept
    of gradient boosting approach as well as takes the power of multithreading and
    multiprocessing to give awesome inference on the datasets. It is one of the most
    used algorithms, not only in SageMaker but elsewhere.


    We will be seeing most of these algorithms and their practical implementations
    in the upcoming chapters.'
