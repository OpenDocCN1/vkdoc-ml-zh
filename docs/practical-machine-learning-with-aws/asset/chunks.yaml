    \n*   选择正确的虚拟化类型\n\n*   选择是否需要 VPC 支持\n\n*   选择正确的平台\n\n*   选择是否升级硬件要求\n\n对于前三点，我们必须确保升级前后的配置相同。对于最后一点，将整个架构迁移到升级后的\
    \ EC2 实例需要付出努力。我们在前一章讨论了 EC2 实例的不同系列。\n\n#### 什么是虚拟化类型？\n\nAWS 中的 Linux 机器支持两种虚拟化类型：半虚拟化（PV）和硬件虚拟机（HVM）。这两种实例的区别在于操作系统如何启动，以及如何利用\
    \ CPU、存储等额外配置。\n\n#### 合理调整数据库实例规模\n\n最后但同样重要的是，我们可以合理调整数据库实例的规模。为此，必须牢记以下指标：\n\
    \n*   要么向上扩展，要么向下扩展数据库实例，或者存储大小保持不变。\n\n*   我们可以单独更改数据库实例的存储大小。\n\n*   AWS 非常重视许可证。因此，无论个人使用什么数据库，都必须拥有正确的许可证。\n\
    \n*   你可以选择调整数据库实例规模的时间。可以立即执行，也可以在特定时间窗口内执行，例如在维护期间。\n\n至此，我们关于 AWS 中合理调整规模的讨论就结束了。接下来，我们必须了解更多关于预留实例的内容。\n\
    \n### 使用预留实例\n\n预留实例关乎承诺。在购买 AWS 的预留兼容服务时，你必须决定是进行长期承诺，还是你的需求会定期变化。如果是长期承诺，那么你可以选择预留服务，这可以降低该服务的每小时成本。以下是\
    \ AWS 提供的提供预留功能的服务：\n\n*   Amazon EC2\n\n*   Amazon RDS\n\n*   Amazon ElastiCache\n\
    \n*   Amazon RedShift\n\n*   Amazon DynamoDB\n\n使用预留实例时必须绝对确定，因为锁定期要么是一年，要么是三年。这意味着你必须提前支付整整一年或三年的费用。付款完成后，无论你使用该实例多少，都不会像按需实例那样获得退款。因此，一旦你支付了锁定期的费用，你可以获得高达按需实例\
    \ 75% 的折扣，但之后你将无法根据使用模式获得动态定价。\n\n预留实例提供以下付款选项：\n\n*   无预付费用\n\n*   部分预付费用\n\n\
    *   全部预付费用\n\n顾名思义，无预付费用意味着你一开始无需支付任何金额。部分预付费用意味着你可能一开始支付一部分金额，而全部预付费用则意味着你一开始支付全部金额。对于无预付的情况，客户按折扣后的每小时费率收费。但是，由于\
    \ AWS 不确定客户是否会付款，因此需要与他们签订合同协议，并且还会查看这些客户与 AWS 的过往关系。对于部分预付费用，也遵循同样的做法。剩余金额按折扣后的每小时费率收取。\n\
    \n预留实例分为两种类型。\n\n*   标准预留实例\n\n*   可转换预留实例\n\n使用标准预留实例，可以增加实例大小或修改可用区，也可以在预留实例市场中出售。另一方面，可转换预留实例可以与其他可能具有新属性（如实例系列、实例类型、平台等）的可转换实例进行交换。它们不能在市场中出售。\n\
    \n每月可购买的预留实例数量也有限制。对于特定区域，每月可以购买 20 个区域实例和 20 个可用区实例。区域实例是可用于整个区域的实例，而可用区实例是可用于特定可用区的实例。\n\
    \n### 使用竞价实例\n\n正如前一章所讨论的，竞价实例是那些处于闲置状态、目前未为 AWS 产生任何收益的实例。公司可以使用这些实例，并获得高达按需实例\
    \ 90% 的折扣。请记住，这些实例目前是闲置的，但这并不意味着它们会一直闲置。这意味着，每当它们的使用量再次上升时，EC2 会给你两分钟的通知，然后中断你的竞价实例会话。显然，每件好事都有缺点。你的竞价实例被终止的另一种方式是，当你产生的成本超过了设定的阈值。\n\
    \n我们必须了解在哪些场景下应该使用竞价实例。Amazon 建议在以下场景中使用竞价实例：\n\n*   构建容错且灵活的应用程序\n    *   Web\
    \ 服务器\n\n    *   API 后端\n\n    *   CI/CD 流水线（DevOps）\n\n    *   Hadoop 数据处理\n\n\
    *   图像渲染\n\n*   无状态 Web 服务\n\n*   大数据分析\n\n*   并行计算\n\n一旦你拥有按需实例，你可以请求竞价实例来处理应用程序的一些额外功能。为此，你可以通过在\
    \ EC2 中启动向导来请求竞价实例。你只需告知实例数量、实例类型、可用区以及你愿意为此支付的最高价格。\n"
- fmt: '### Using the Cost Explorer


    Once you have decided on the type of service to use, whether reserved, on-demand,
    or spot, you can analyze your usage and costs incurred using a tool provided by
    AWS called the `Cost Explorer`. There are three types of reports that the `Cost
    Explorer` provides to help you: reporting on the usage and cost incurred in the
    past 12 months, forecasting how much you are going to spend in the next three
    months based on your past usage, and getting recommendations as well on the type
    of instances to use.


    If you open the `Cost Explorer` dashboard, it will come with a default view, as
    shown in Figure [2-3](#495447_1_En_2_Chapter.xhtml#Fig3).


    ![../images/495447_1_En_2_Chapter/495447_1_En_2_Fig3_HTML.jpg](images/495447_1_En_2_Chapter/495447_1_En_2_Fig3_HTML.jpg)


    Figure 2-3


    AWS Cost Explorer dashboard


    Looking at the dashboard, we can say that a `Cost Explorer` consists of the following
    components:


    - `Cost Explorer Costs`

    - `Cost Explorer Trends`

    - `Daily Unblended Costs`

    - `Monthly Unblended Costs`

    - `Net Unblended Costs`

    - `Recent Cost Explorer Reports`

    - `Amortized Costs`


    #### Cost Explorer Costs


    This component tells you about two metrics: current cost comparison with the previous
    month’s cost and current forecast comparison with the actuals of the previous
    month. The `Cost Explorer` shows the current cost of the month, until a certain
    date, as a chart and then compares that with the cost incurred for the same period
    in the previous month. It also forecasts for the remaining days of the month and
    then compares that with how much cost was actually incurred in the previous month.
    This helps the user decide on various factors, such as right-sizing, reducing
    the usage, etc.


    #### Cost Explorer Trends


    This section tells you about the cost trend of different services that a user
    is using. It shows the top trends in the dashboard, but the user can drill down
    to look at the trends of all the services and can further drill down to a particular
    service and look at the different costs that have accounted for that trend.


    #### Daily Unblended Cost


    First we must understand what an unblended cost is. It is the cost charged by
    AWS to a user, at a particular moment of time. For example, if AWS charged me
    $100 for using an `EC2` instance at 10:45 a.m., then it will contribute to my
    `Daily Unblended Cost`. Generally, it is considered the most important cost data,
    as it tells you about the cost at the time it occurred. Obviously, you can use
    different filters to change the view of your `Cost Explorer`’s unblended cost
    section. You can download the information as well in the form of a CSV. One thing
    should be clear: unblended cost does not show the refund amount that a user has
    received in a specific period.


    #### Monthly Unblended Cost


    As the name suggests, instead of looking at the `Daily Unblended Cost` information,
    you can change the granularity to a monthly level. This can give you an overall
    picture for the months, and you can then proceed to look at the `Daily Unblended
    Cost` of a specific month where you may find anomalies or you want to investigate
    further.


    #### Net Unblended Cost


    Net cost considers the total cost that has been incurred to you, adjusts for the
    discounts that have been given to you for the same period, and then presents you
    with the information. If a user wants, they can actually include or exclude any
    other adjustments such as refunds or credits given by AWS.


    #### Recent Cost Explorer Reports


    This metric includes a list of all the reports that a user has accessed in the
    past, with timestamps and links to each. You can just click the link and view
    the report again.


    #### Amortized Costs


    Generally amortized cost is a kind of normalized cost information. For example,
    if we consider a month, different service usage costs will be charged daily, and
    we can take a look at that in the unblended cost section. But, if we have taken
    a reserved instance, for example, then probably every first day of the month the
    entire month’s cost will be charged. You will see a sudden spike there in the
    chart. Therefore, instead of dealing with all these sorts of spikes, the information
    can be normalized and distributed, and then it can give us a better overall picture.
    Figure [2-4](#495447_1_En_2_Chapter.xhtml#Fig4) shows us the difference between
    unblended cost and amortized cost perfectly.


    ![../images/495447_1_En_2_Chapter/495447_1_En_2_Fig4_HTML.jpg](images/495447_1_En_2_Chapter/495447_1_En_2_Fig4_HTML.jpg)


    Figure 2-4


    Difference between unblended and amortized costs


    Now that we have looked at how AWS `Cost Explorer` works, let’s explore how AWS
    `Trusted Advisor` works as well.


    ## AWS Trusted Advisor


    As we already know, AWS is the market leader when it comes to cloud computing
    services. Since it has a lot of clients, it knows the usage pattern statistics
    of everyone. Based on that, there are some best practices that AWS has come up
    with. They fall into the following categories:


    - Cost optimization

    - Security

    - Fault tolerance

    - Performance

    - Service limits


    We have already seen some of the factors that influence cost optimization in this
    chapter. We will be talking about the remaining factors in the next chapter. But,
    keeping all these factors in mind, a user can be charged a minimum cost with the
    maximum performance. AWS `Trusted Advisor` takes into consideration all these
    factors and provides its own recommendations that would help users to attain the
    minimum cost possible. How `Trusted Advisor` works is perfectly represented in
    Figure [2-5](#495447_1_En_2_Chapter.xhtml#Fig5).


    ![../images/495447_1_En_2_Chapter/495447_1_En_2_Fig5_HTML.jpg](images/495447_1_En_2_Chapter/495447_1_En_2_Fig5_HTML.jpg)


    Figure 2-5


    AWS Trusted Advisor


    It works just like the antivirus protection software in your personal systems,
    which provide you with the malware and other related insights. Here, instead of
    malware insights, you get insights on the five categories that I specified earlier.
    The insights can look like Figure [2-6](#495447_1_En_2_Chapter.xhtml#Fig6).


    ![../images/495447_1_En_2_Chapter/495447_1_En_2_Fig6_HTML.jpg](images/495447_1_En_2_Chapter/495447_1_En_2_Fig6_HTML.jpg)


    Figure 2-6


    AWS Trusted Advisor insights


    A green check mark specifies things we are doing in the right way. Yellow exclamation
    points are the warnings that need to be catered to or they may lead to problems.
    Red exclamation points mean that the recommendations should be looked at immediately
    as they are already affecting the cost, performance, security, etc.


    The following are some of the benefits of using AWS `Trusted Advisor`:


    - `Trusted Advisor` provides you with live notifications once you log in to your
    AWS account. If you enable it, then it can also send you periodic notifications
    via email.

    - If you want, then you can make changes in the reports generated by `Trusted
    Advisor`. You can include or exclude items.

    - When the `Trusted Advisor` makes a recommendation, it provides a link that takes
    you to the AWS Management Console where you can sort out the warnings.'
