    with open(os.path.join(output_path, ''failure''), ''w'') as s:

    s.write(''Exception during training: '' + str(e) + ''\n'' + trc)

    print(''Exception during training: '' + str(e) + ''\n'' + trc, file=sys.stderr)

    sys.exit(255)

    ```


    We will keep the entire script inside a function called `train().` After reading
    the CSV sheet, we will follow the same procedure we saw in Chapter [5](#495447_1_En_5_Chapter.xhtml).
    Later we will fit the random forest model on the data, which we ran in the previous
    section.


    After all this, we have to save this model because later we will have to make
    predictions using the model. To save the model, we will first serialize it using
    pickle and then save it in the model location. Later, this model will be saved
    in S3.


    Finally, we can run the entire script.


    ```

    if __name__ == ''__main__'':

    train()

    sys.exit(0)

    ```


    We have to use `sys.exit(0)` as it sends the message to SageMaker that the training
    has successfully completed. Save the file with the name `train` and no extension.'
  trans: '

    ## 运行模型


    在将模型应用到 SageMaker 环境之前，我们先在本地用准备好的数据集运行算法，并检查产生的总损失。


    ```

    from sklearn.ensemble import RandomForestRegressor

    rfc = RandomForestRegressor(n_estimators=500)

    ```


    在上面的代码中，我们初始化了 `RandomForestRegressor` 算法，并要求合并 500 棵独立决策树的输出。初始化算法后，我们就可以开始训练模型了。


    ```

    rfc.fit(X_train, y_train)

    ```


    上面的代码将开始训练模型。现在我们可以使用训练好的模型对测试集进行预测。


    ```

    predictions = rfc.predict(X_test)

    ```


    所有预测结果都存储在变量 predictions 中。让我们计算所创建模型的均方根误差。


    ```

    from sklearn.metrics import mean_squared_error

    np.sqrt(mean_squared_error(predictions, y_test))

    ```


    这将给出最终误差的值。在我的例子中，大约是 1054。由于采样原因，不同系统可能输出不同结果。


    ## 转换代码以使用 SageMaker 资源


    现在我们已经成功在本地环境中运行了代码，接下来将对其进行转换，以便能够在 SageMaker 环境中运行。以下是在 SageMaker 中运行自定义模型的步骤：


    1.  将数据存储在 S3 中。


    2.  创建一个训练脚本并将其命名为 `train`。


    3.  创建一个有助于预测的推理脚本。我们将其命名为 `predictor.py`。


    4.  设置文件以帮助生成端点。


    5.  创建一个 Dockerfile，用于构建一个镜像，整个代码将在其中运行。


    6.  编写一个脚本，将 Docker 镜像推送到 Amazon Elastic Container Registry (ECR)。


    7.  使用 SageMaker 和 Boto3 API 来训练和测试模型。


    我们的训练数据已经在 S3 中，因此我们将从创建训练脚本开始。


    ### 创建训练脚本


    我们已经创建了一个训练笔记本。这个训练脚本将与笔记本类似，但我们需要额外考虑一些事项。首先需要记住的是，脚本将在容器内运行。因此，由于脚本在容器内部，而数据来自容器外部的
    S3 存储桶，可能会存在同步问题。此外，算法的结果也应保存在 S3 存储桶中。在创建训练脚本时，我们需要牢记所有这些。


    我们首先应该知道，在容器内部，无论传入什么数据，它都会被存储在 `/opt/ml` 文件夹中。因此，来自 S3 的数据将被下载到该文件夹。所以，我们需要在这个文件夹中创建三个子文件夹：一个用于存储输入，一个用于存储输出，一个用于存储模型。这可以通过使用以下脚本来定义：


    ```

    prefix = ''/opt/ml/''

    input_path = prefix + ''input/data''

    output_path = os.path.join(prefix, ''output'')

    model_path = os.path.join(prefix, ''model'')

    ```


    在数据文件夹中，我们可以有多个文件，例如 `training`、`validation` 或 `testing`。我们也可以有多个文件共同组成一个训练文件。因此，我们也可以进行这种分类。对我们来说，只有一个文件：训练文件。所以，我们将只使用一个通道。


    ```

    channel_name=''training''

    training_path = os.path.join(input_path, channel_name)

    ```


    这使我们的训练脚本能够处理数据。接下来是训练脚本本身。数据将来自 S3。首先我们必须读取它，然后应用我们在第 5 章中看到的所有步骤。要读取文件，我们可以使用以下脚本：


    ```

    input_files = [ os.path.join(training_path, file) for file in os.listdir(training_path)
    ]

    raw_data = [ pd.read_csv(file) for file in input_files ]

    data = pd.concat(raw_data)

    ```


    如果你有多个 CSV 表需要读取，这个脚本也很有帮助。但是，在这种情况下，请记住设置参数 `header=None`。现在我们已经读取了数据，可以开始训练过程了。以下是完整的训练脚本：


    ```

    def train():

    print(''Starting the training.'')

    try:

    # Take the set of files and read them all into a single pandas dataframe

    input_files = [ os.path.join(training_path, file) for file in os.listdir(training_path)
    ]

    if len(input_files) == 0:

    raise ValueError((''There are no files in {}.\n'' +

    ''This usually indicates that the channel ({}) was incorrectly specified,\n''
    +

    ''the data specification in S3 was incorrectly specified or the role specified\n''
    +

    ''does not have permission to access the data.'').format(training_path, channel_name))

    raw_data = [ pd.read_csv(file) for file in input_files ]

    data = pd.concat(raw_data)

    data = data.sample(frac=1)

    for i in data.Item_Type.value_counts().index:

    data.loc[(data[''Item_Weight''].isna()) & (data[''Item_Type''] == i), [''Item_Weight'']]
    = \

    data.loc[data[''Item_Type''] == ''Fruits and Vegetables'', [''Item_Weight'']].mean()[0]

    cat_data = data.select_dtypes(object)

    num_data = data.select_dtypes(np.number)

    cat_data.loc[(cat_data[''Outlet_Size''].isna()) & (cat_data[''Outlet_Type''] ==
    ''Grocery Store''), [''Outlet_Size'']] = ''Small''

    cat_data.loc[(cat_data[''Outlet_Size''].isna()) & (cat_data[''Outlet_Type''] ==
    ''Supermarket Type1''), [''Outlet_Size'']] = ''Small''

    cat_data.loc[(cat_data[''Outlet_Size''].isna()) & (cat_data[''Outlet_Type''] ==
    ''Supermarket Type2''), [''Outlet_Size'']] = ''Medium''

    cat_data.loc[(cat_data[''Outlet_Size''].isna()) & (cat_data[''Outlet_Type''] ==
    ''Supermarket Type3''), [''Outlet_Size'']] = ''Medium''

    cat_data.loc[cat_data[''Item_Fat_Content''] == ''LF'' , [''Item_Fat_Content'']]
    = ''Low Fat''

    cat_data.loc[cat_data[''Item_Fat_Content''] == ''reg'' , [''Item_Fat_Content'']]
    = ''Regular''

    cat_data.loc[cat_data[''Item_Fat_Content''] == ''low fat'' , [''Item_Fat_Content'']]
    = ''Low Fat''

    le = LabelEncoder()

    cat_data = cat_data.apply(le.fit_transform)

    ss = StandardScaler()

    num_data = pd.DataFrame(ss.fit_transform(num_data.drop([''Item_Outlet_Sales''],
    axis=1)), columns = num_data.drop([''Item_Outlet_Sales''],axis=1).columns)

    cat_data = pd.DataFrame(ss.fit_transform(cat_data.drop([''Item_Identifier''],
    axis=1)), columns = cat_data.drop([''Item_Identifier''], axis=1).columns)

    final_data = pd.concat([num_data,cat_data],axis=1)

    X = final_data

    y = data[''Item_Outlet_Sales'']

    from sklearn.model_selection import train_test_split

    X_train, X_test, y_train, y_test = train_test_split(X, y, test_size = 0.1, random_state=5)

    from sklearn.ensemble import RandomForestRegressor

    rfc = RandomForestRegressor(n_estimators=500)

    clf = rfc.fit(X_train, y_train)

    # save the model

    with open(os.path.join(model_path, ''randomForest-tree-model.pkl''), ''w'') as
    out:

    pickle.dump(clf, out)

    print(''Training complete.'')

    except Exception as e:

    trc = traceback.format_exc()

    with open(os.path.join(output_path, ''failure''), ''w'') as s:

    s.write(''Exception during training: '' + str(e) + ''\n'' + trc)

    print(''Exception during training: '' + str(e) + ''\n'' + trc, file=sys.stderr)

    sys.exit(255)

    ```


    我们将整个脚本放在一个名为 `train()` 的函数中。读取 CSV 表后，我们将遵循与第 5 章中相同的过程。之后，我们将随机森林模型拟合到数据上，就像我们在上一节中运行的那样。


    完成所有这些之后，我们必须保存这个模型，因为稍后我们将需要使用该模型进行预测。为了保存模型，我们首先使用 pickle 对其进行序列化，然后将其保存在模型位置。稍后，这个模型将被保存到
    S3 中。


    最后，我们可以运行整个脚本。


    ```

    if __name__ == ''__main__'':

    train()

    sys.exit(0)

    ```


    我们必须使用 `sys.exit(0)`，因为它会向 SageMaker 发送训练已成功完成的消息。将文件保存为 `train`，不带任何扩展名。

