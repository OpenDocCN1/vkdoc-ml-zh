    ## Exploring the XGBoost Algorithm


    XGBoost stands for *extreme gradient boosting*. In this section, we will first
    understand how a normal gradient descent algorithm works and how XGBoost makes
    it much more efficient. We will apply this algorithm on the multiclass classification
    of the Big Mart dataset. Let’s start this section by taking a look at the two
    algorithms.


    ### Gradient Boosting Algorithm


    *Boosting* is a technique that comes inside the domain of ensemble trees in machine
    learning. In this algorithm, multiple decision trees are combined to give the
    final predictions. Other approaches in ensemble trees include bagging and random
    forests. Boosting differs from the other approaches by the way it combines multiple
    trees. When the first decision tree is made (generally its CART decision tree),
    then all the observations are given equal weight. The model, once trained, is
    applied on the same dataset. Then the second decision tree is made. In this decision
    tree, all the observations that were wrongly classified in the first decision
    tree are given more weight, while others are given less weight. This is done by
    increasing the weights of the observations that are difficult to classify while
    reducing the weights of all other observations. This process is repeated, and
    then finally the last decision tree gives us the final predictions. Therefore,
    it is said that each decision tree is boosted by the previous decision trees,
    which is why it’s called *boosting*. There are different kinds of boosting approaches
    such as AdaBoost, gradient boost, light GBM, XGBoost, etc. See Figure [6-3](#495447_1_En_6_Chapter.xhtml#Fig3).


    ![../images/495447_1_En_6_Chapter/495447_1_En_6_Fig3_HTML.jpg](images/495447_1_En_6_Chapter/495447_1_En_6_Fig3_HTML.jpg)


    Figure 6-3


    Gradient boosting


    In gradient boosting, the weights given to the parameters are learned using the
    gradient descent approach. First the loss function is defined, which can be mean
    squared error in case of regression problems, or a logit function in the case
    of classification problems. This loss function is minimized after every decision
    tree is made and added to the next decision tree. The final aim is to minimize
    the overall loss function, which in return gives the best weight values for all
    the observations.


    ### XGBoost Algorithm


    The XGBoost algorithm is based upon the gradient boosting framework. XGBoost is
    a super-optimized version of gradient boosting, as it harnesses the power of computational
    resources so well that for small to medium size datasets, it majorly outperforms
    neural networks. The following are some of the major benefits of using XGBoost:


    - Multithreaded operations are supported, and therefore the multiple trees that
    are built use a parallelization concept, and hence we can utilize large numbers
    of decision trees less often to give us more accurate predictions.

    - Hardware performance can be maximized using approaches such as cache and buffers,
    out-of-core computations, etc.

    - XGBoost attaches regularization factors in decision trees, and hence the problem
    of overfitting and underfitting is taken care of. It supports both L1 and L2 regularization.

    - XGBoost automatically learns the missing values by understanding the neighborhood.

    - Optimal split points are found using an approach called the *weighted quantile
    sketch* algorithm.

    - Cross-validation is performed at each step, automatically, to find the best
    values of the hyperparameters. Therefore, there is no need to write custom code.


    You can find a detailed overview of the XGBoost algorithm at [`https://arxiv.org/pdf/1603.02754.pdf`](https://arxiv.org/pdf/1603.02754.pdf).'
