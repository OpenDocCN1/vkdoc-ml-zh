    # Security in Amazon Web Services


    In this chapter, we will look at the security aspects of AWS. As you know, AWS
    has hundreds of services serving thousands of customers, so a small compromise
    in its security could lead to a huge loss for a particular company and therefore
    even for AWS itself. That’s why AWS has some concrete security practices, along
    with dedicated security services that take care of the entire umbrella of AWS
    features.


    This chapter is dedicated to some of the most important parts of these services.
    By the end of this chapter, you will understand the underlying security of AWS
    and will also be able to implement different security features in the products
    you are using.


    ## The SSR Model of AWS


    When it comes to security, AWS follows the shared security responsibility (SSR)
    model. This model is simple: the responsibility should be shared between the customer
    and AWS. Specifically, AWS is responsible for the security of the entire infrastructure
    that it lends to its customers. The customer, on the other hand, is responsible
    for whatever it keeps in that infrastructure. Figure [3-1](#495447_1_En_3_Chapter.xhtml#Fig1)
    shows the SSR model of AWS.


    ![../images/495447_1_En_3_Chapter/495447_1_En_3_Fig1_HTML.jpg](images/495447_1_En_3_Chapter/495447_1_En_3_Fig1_HTML.jpg)


    **Figure 3-1** Shared security model of AWS


    The following are some of the responsibilities of AWS:


    - AWS takes care of the entire infrastructure, which includes the hardware, software,
    networking, and other facilities that AWS uses to run its services.

    - AWS provides reports about its operations regularly by organizing third-party
    audits. Its compliances, security standards, and regulations are all verified.

    - For most of the services, basic security tasks are also done by AWS, such as
    installing guest operating systems, patching databases, configuring firewalls,
    and doing disaster recovery.


    The following are some of the responsibilities of customers and users:


    - After the services have been booked and the basic security has been taken care
    of by AWS, it is the customer''s responsibility to perform all the necessary security
    configuration and management tasks. This may include updating the OS, installing
    security patches, configuring the firewall, etc.

    - The customer must set up user accounts using the Amazon Identity and Access
    Management (IAM) service. This will allow the customer to give each of its users
    different credentials and hence access to different services.

    - The customer must set up multifactor authentication for each account.


    We will discuss Amazon IAM and multifactor authentication in more depth later
    in this chapter.


    AWS provides high-level security to its customers, which can be grouped into these
    categories:


    - Compliance requirements

    - Physical and environmental security

    - Business continuity management

    - Network security


    ### Compliance


    AWS’s infrastructure is based on several IT security standards, including the
    following:


    - SOC 1/SSAE 16/ISAE 3402 (formerly SAS 70)

    - SOC 2

    - SOC 3

    - FISMA, DIACAP, and FedRAMP

    - DOD CSM Levels 1–5

    - PCI DSS Level 1

    - ISO 9001/ISO 27001/ISO 27017/ISO 27018


    In addition, AWS follows some industry-specific standards:


    - Criminal Justice Information Services (CJIS)

    - Cloud Security Alliance (CSA)

    - Family Educational Rights and Privacy Act (FERPA)

    - Health Insurance Portability and Accountability Act (HIPAA)

    - Motion Picture Association of America (MPAA)


    ### Physical and Environmental Security


    For the physical and environment safety of the infrastructure, AWS follows these
    standards:


    - Only authorized people are allowed inside the premises of AWS data centers,
    even if they are employees of AWS or Amazon.

    - Automatic fire detection sensors and suppressants are installed in the facility.

    - Not only do AWS data centers have a consistent electrical power supply, but
    they also have a powerful UPS so that in case of a power failure, the operations
    never stop.

    - There are temperature control devices installed and continuously monitored by
    personnel so that the optimal temperature is maintained inside the data center.

    - AWS decommissions any hardware following strict norms so that the data is never
    compromised.


    ### Business Continuity Management


    Lots of companies are moving to cloud platforms, and they do not want their business
    operations interrupted because of AWS. When companies move their entire business
    infrastructure to AWS, all of their data resides there. Even a few hours of interruption
    can cause huge losses to companies. Therefore, AWS needs to be stringent in devising
    its infrastructure plan so that this does not happen. To ensure business continuity
    management, AWS has taken a lot of measures.


    - All the data centers of AWS are live 24/7/365. So, if a particular data center
    fails, then the first thing AWS does is to move the data traffic away from the
    affected area.

    - Using AWS, customers can put their data into multiple geographic regions, and
    inside each region the data can be put into multiple availability zones. The availability
    zones are made in such a way that they are independent from all the other availability
    zones in the same region. So, if one of the areas where the availability zone
    is present has a chance of being affected by floods in a specific season, for
    example, then all the remaining availability zones in the same region are put
    in locations that will never be affected by the same flood.

    - Each data center is backed up by UPS and on-site backup generation facilities.
    Also, to further improve the security, power from different gridlines is provided
    inside the facility so that if one fails, the other remains effective.'
