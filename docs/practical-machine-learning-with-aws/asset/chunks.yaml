- fmt: '### SageMaker Application of XGBoost


    Just like in the previous algorithm, the first step will be defining the bucket
    and setting up the path.


    ```python

    import os

    import boto3

    import re

    import sagemaker

    role = sagemaker.get_execution_role()

    region = boto3.Session().region_name

    bucket = ''slytherins-test''

    prefix = ''xgboost''

    bucket_path = ''https://s3-{}.amazonaws.com/{}''.format(region, bucket)

    ```


    We will now follow the same steps of preprocessing the dataset, the steps that
    we saw in the previous section and the previous chapter. We will proceed from
    the part where we have the binned target variable. In the XGBoost algorithm, we
    will be using the CSV dataset, as compared to the previous one where we used RecordIO-Protobuf.
    We will save our data and store it in S3.


    ```python

    data_final.to_csv(''train.csv'', header=None, index=False)

    boto3.Session(region_name=region).resource(''s3'').Bucket(bucket).Object(prefix
    + ''/train.csv'').upload_file(''train.csv'')

    ```


    The next step will be to initialize the Docker image of XGBoost.


    ```python

    from sagemaker.amazon.amazon_estimator import get_image_uri

    container = get_image_uri(region, ''xgboost'', ''1.0-1'')

    ```


    Once the container is initialized, we will initialize the algorithm and run the
    model.


    ```python

    import boto3

    from time import gmtime, strftime

    job_name = ''xgboost-classification-'' + strftime("%Y-%m-%d-%H-%M-%S", gmtime())

    create_training_params = \

    {

    "AlgorithmSpecification": {

    "TrainingImage": container,

    "TrainingInputMode": "File"

    },

    "RoleArn": role,

    "OutputDataConfig": {

    "S3OutputPath": bucket_path + "/" + prefix + "/xgboost"

    },

    "ResourceConfig": {

    "InstanceCount": 1,

    "InstanceType": "ml.m4.xlarge",

    "VolumeSizeInGB": 5

    },

    "TrainingJobName": job_name,

    "HyperParameters": {

    "max_depth":"5",

    "eta":"0.2",

    "gamma":"4",

    "min_child_weight":"6",

    "subsample":"0.7",

    "silent":"0",

    "objective":"multi:softmax",

    "num_round":"50",

    "num_class":"4"

    },

    "StoppingCondition": {

    "MaxRuntimeInSeconds": 3600

    },

    "InputDataConfig": [

    {

    "ChannelName": "train" ,

    "DataSource": {

    "S3DataSource": {

    "S3DataType": "S3Prefix",

    "S3Uri": bucket_path + "/" + prefix + ''/'',

    "S3DataDistributionType": "FullyReplicated"

    }

    },

    "ContentType": "csv",

    "CompressionType": "None"

    },

    {

    "ChannelName": "validation",

    "DataSource": {

    "S3DataSource": {

    "S3DataType": "S3Prefix",

    "S3Uri": bucket_path + "/" + prefix + ''/'',

    "S3DataDistributionType": "FullyReplicated"

    }

    },

    "ContentType": "csv",

    "CompressionType": "None"

    }

    ]

    }

    client = boto3.client(''sagemaker'', region_name=region)

    client.create_training_job(**create_training_params)

    ```


    Let’s understand the previous code.


    1. In the algorithm specification, we will pass the initialized Docker container
    and the type of data. Here we are using a CSV file; hence, the data type will
    be `file`.

    2. In `RoleArn`, we will be passing the IAM role. It is mandatory to pass this
    because it will define what resources we have the access to. We can go to the
    IAM roles section and note the ARN of the roles that we have created there.

    3. `S3OutputPath` defines where in S3 our model files will be stored.

    4. Next, we have to configure our resources. We will specify the resource count,
    resource type, and storage. Remember, the bigger the resource you choose, the
    more the cost you bear. Before deciding on this, visit the Cost Explorer and look
    at the cost of the resource that you want to choose.

    5. Hyperparameters of the XGBoost algorithm need to be set in the next section.

    6. The next section talks about the maximum time you want the resource to run.
    If the running time exceeds that time, the job will automatically stop.

    7. Finally, we pass the input data configuration and type in the last section.


    This JSON format, once filled, spins up the container, and the training starts.
    We can get to know the metrics and logs for the model using Cloud Metrics and
    CloudWatch, which we will look at in the next chapter. Here we will write a script
    that will keep telling us whether the training is in progress. Once the training
    finishes or some error happens, the script informs us.


    ```python

    import time

    status = client.describe_training_job(TrainingJobName=job_name)[''TrainingJobStatus'']

    print(status)

    while status !=''Completed'' and status!=''Failed'':

    time.sleep(60)

    status = client.describe_training_job(TrainingJobName=job_name)[''TrainingJobStatus'']

    print(status)

    ```


    Once the training finishes, we get the output shown here:


    ![../images/495447_1_En_6_Chapter/495447_1_En_6_Figd_HTML.jpg](images/495447_1_En_6_Chapter/495447_1_En_6_Figd_HTML.jpg)


    Just like in the previous section, once the model is trained, we can prepare and
    expose an endpoint that the predictions can use. To expose the endpoint, the following
    script for XGBoost algorithm can be used:


    ```python

    create_endpoint_response = client.create_endpoint(

    EndpointName="xgboost-bigmart-endpoint",

    EndpointConfigName="xgboost-bigmart-config")

    ```


    This will spin up the endpoint, and later the predictions can be made using it.
    Next, we can test the model by using the `invoke_endpoint()` method.


    ```python

    runtime_client = boto3.client(''runtime.sagemaker'', region_name=region)

    response = runtime_client.invoke_endpoint(EndpointName=endpoint_name,

    ContentType=''text/csv'',

    Body=test_data)

    ```


    To read the predictions, we can use following script:


    ```python

    result = response[''Body''].read()

    result = result.decode("utf-8")

    result = result.split('','')

    result = [math.ceil(float(i)) for i in result]

    label = payload.strip('' '').split()[0]

    print (''Label: '',label,''\nPrediction: '', result[0])

    ```


    We can do batch predictions as well, just like the linear learner. You can find
    the code for batch predictions in the GitHub repository. Don’t forget to delete
    the endpoint after the predictions.


    ```python

    client.delete_endpoint(EndpointName=endpoint_name)

    ```


    ## Exploring the Blazing Text Algorithm


    The blazing text algorithm is used for generating word embeddings for the textual
    data. Later these embeddings can be given to any machine learning model to do
    any classification tasks. In this section, we will first understand the blazing
    text algorithm and then apply it on the text8 dataset.


    The blazing text algorithm is a highly optimized version of the word2vec algorithm
    that allows faster training and inference and supports distributed training as
    well. Once the vectors are generated using this algorithm, we can use them for
    different tasks such as text classification, summarization, translation, etc.
    It supports two architectures, similar to that of word2vec.


    * Skip gram architecture

    * Continuous bag of words architecture


    Let’s briefly discuss these architectures.


    ### Skip Gram Architecture of Word Vectors Generation


    The skip gram algorithm is used to generate word vectors by finding words that
    are most similar to each other. This algorithm tries to understand the context
    of a sentence. To do that, it takes a word as input and then tries to predict
    all the words that have similar context. Figure [6-4](#495447_1_En_6_Chapter.xhtml#Fig4)
    shows the architecture, taken from the research paper at [`https://arxiv.org/pdf/1301.3781.pdf`](https://arxiv.org/pdf/1301.3781.pdf)
    (Mikolov el al.)


    ![../images/495447_1_En_6_Chapter/495447_1_En_6_Fig4_HTML.jpg](images/495447_1_En_6_Chapter/495447_1_En_6_Fig4_HTML.jpg)


    Figure 6-4


    Skip gram algorithm


    To understand the context and generate word vectors, a small neural network architecture
    is used with hidden layers that have no activation functions. In the beginning,
    each word is encoded using the one-hot encoding algorithm and then fed to the
    network. A weight is assigned to the hidden layer, whose value is learned through
    a loss function. Once the model is trained, it can be used for generating word
    vectors or directly used for text classification models.'
