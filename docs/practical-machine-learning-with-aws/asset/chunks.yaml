    computing and learned about different components of AWS. We have not seen all
    the services of AWS, as there are more than 150 of them. They all cannot be covered
    in a single book, but we have covered all the important ones as far as this book
    is concerned.


    In the next chapter, we will be looking at the security aspects of AWS and different
    types of services provided to make our applications secure.


    # 2. AWS Pricing and Cost Management


    In the previous chapter, we looked at some concepts of cloud computing and explored
    a few of the important services provided by AWS. In this chapter, we will look
    at how AWS charges us for the services it provides and how we can get the best
    out of AWS with the least amount of burden on our pocketbooks as possible.'
  trans: '

    ### Amazon VPC


    Amazon Virtual Private Cloud（VPC）是一种我们创建的虚拟网络，用于将特定内容与整个用户域隔离开来。它的运作方式类似于普通云，但并非拥有独立的基础设施，而是只有一个云基础设施，并在其上构建多个虚拟云。例如，我们可以为市场部、财务部和运营部分别创建独立的虚拟云。只有各自部门的用户知道每个云中发生了什么，但实际上所有存储的文件都位于同一存储空间，由所有部门共享。因此，每个云都可以拥有自己的安全策略、访问级别等。


    Amazon VPC 也是如此，只不过它还提供了可扩展的 AWS 架构。Amazon VPC 包含以下组件：


    *   *子网*：每个虚拟私有云只能由一组 IP 地址访问。来自列表之外地址的任何请求都将被拒绝访问。这个列表称为*子网*。


    *   *路由表*：如前所述，虚拟私有云与本地云共享相同的基础设施。但 AWS 也提供了自己的功能。其中一项功能是负载均衡，这意味着如果服务器负载变得非常高，我们可以将流量转移到备用服务器。一旦我们在
    VPC 中工作，就必须知道流量需要被导向的路由。这些路由存储在路由表中。


    *   *互联网网关*：通过互联网网关，您的所有虚拟私有云都能够与底层的 EC2 实例通信。


    *   *端点*：如果我们想将虚拟私有云连接到 AWS 提供的任何服务，只需使用 Amazon VPC 提供的 VPC 端点服务即可。


    图 1-9 展示了一个使用互联网进行 VPC 访问的架构。


    ![../images/495447_1_En_1_Chapter/495447_1_En_1_Fig9_HTML.jpg](img/495447_1_En_1_Fig9_HTML.jpg)


    图 1-9


    Amazon VPC 架构


    如果你查看图 1-9 中的架构，可以看到在 VPC 内部有两个 EC2 实例，每个实例都有一个公有 IP 地址和一个私有 IP 地址。如果你想从 VPC 外部访问服务，则使用公有
    IP 地址；而从 VPC 内部访问相同服务时，则使用私有 IP 地址。你可以看到有一个路由器，它使用路由表来了解不同的路由，然后通过互联网网关进行访问。VPC
    还有一个 IP 地址和端口号（在图 1-9 中，IP 地址是 172.31.0.0，端口号是 16）。


    ### Amazon API Gateway


    在理解 API Gateway 之前，我先简要介绍一下应用程序编程接口（API）。API 是一种服务，用于让两个或多个应用程序相互通信。例如，当我们使用 Facebook
    上传图片或视频时，我们使用的是 Facebook 的上传 API；而当我们点赞、评论或分享时，我们使用的是 Facebook 的另一个 API。因此，在当前的开发场景中，每个小服务都被开发出来，然后转换为
    API（REST API 是使用最广泛的 API 类型之一），之后便可以通过网络协议来使用。Amazon API Gateway 为您提供了有效管理这些 API
    的服务。


    Amazon API Gateway 可用于创建、发布、维护、监控和保护不同类型的 API，例如 REST、HTTP 或 WebSocket API。这些
    API 不仅可以拥有自己的应用程序，还可以访问和使用不同的 AWS 服务。


    图 1-10 展示了 API Gateway 的架构。


    ![../images/495447_1_En_1_Chapter/495447_1_En_1_Fig10_HTML.jpg](img/495447_1_En_1_Fig10_HTML.jpg)


    图 1-10


    API Gateway 架构


    在图 1-10 中，Amazon CloudWatch 用于监控当前状态下 AWS 和 API Gateway 提供的任何服务的日志。API Gateway
    缓存通过存储最常用的组件来降低延迟。所有 API 也可以连接到 AWS 的不同服务，例如 AWS Lambda、EC2、Kinesis（用于实时数据分析）、DynamoDB（云数据库）等。它也可以被任何第三方应用程序使用。


    ### Amazon CloudFront


    网络上有很多服务为我们提供了构建网站并将其提供给最终用户的多种选择。AWS 可以算作其中之一，但它提供了其他服务所不具备的功能。AWS 提供了低延迟的选项。为了稍微详细地理解延迟，想象一下你正在打开一个网站，其服务器位于印度，而你却在朝鲜（假设该国为其公民提供互联网）。由于服务器距离很远，使用该网站提供的任何服务都需要很长时间。但是，如果该网站部署在
    AWS 上，那么用户就可以使用位于韩国的服务器，而不是印度的服务器。因为服务器离该国更近，页面加载速度会更快。


    AWS 是如何做到这一点的？答案是其名为 CloudFront 的服务。CloudFront 又是如何做到的呢？它通过使用 AWS 提供的边缘站点来实现。当你创建一个网站时，它包含静态和动态内容，例如
    HTML 页面、CSS 和 JavaScript 等。因此，如果来自你服务器所在位置之外的请求要使用该网站，CloudFront 会将网站的所有内容分发到离请求发起位置最近的边缘站点。因此，由于内容是从最近的服务器交付的，现在打开网站的速度会更快。要了解更多关于边缘站点的信息，请访问此链接：[`https://aws.amazon.com/cloudfront/features/`](https://aws.amazon.com/cloudfront/features/)。


    在图 1-11 中，你可以看到 CloudFront 如何用于这种分发。让我们看看图中的每一步代表什么。


    ![../images/495447_1_En_1_Chapter/495447_1_En_1_Fig11_HTML.jpg](img/495447_1_En_1_Fig11_HTML.jpg)


    图 1-11


    Amazon CloudFront 服务


    1.  你的网站将要使用的所有文件都存储在 AWS 服务（如 S3）中，或者也可以是你自己的 HTTP 服务器。（步骤 1 和 2。）


    2.  现在，你通过提供 S3 或 HTTP 服务器的链接来启动 CloudFront 分发。（步骤 3。）


    3.  一个特定于 CloudFront 的域名会被分配给你的分发。该域名也可以更改。（步骤 4。）


    4.  CloudFront 将刚刚创建的分发配置发送到全球所有的边缘站点。在这里，你的文件缓存被创建。（步骤 5。）


    ## 结论


    至此，我们完成了关于云计算和亚马逊云版本 AWS 的基本介绍。在本章中，你了解了与云计算相关的不同概念，并学习了 AWS 的不同组件。我们并未涵盖 AWS
    的所有服务，因为其数量超过 150 个。一本书无法涵盖所有内容，但就本书而言，我们已经涵盖了所有重要的服务。


    在下一章中，我们将探讨 AWS 的安全方面以及为保护应用程序安全而提供的不同类型的服务。


    # 2. AWS 定价与成本管理


    在上一章中，我们了解了一些云计算的概念，并探索了 AWS 提供的一些重要服务。在本章中，我们将探讨 AWS 如何对其提供的服务收费，以及我们如何以尽可能最小的经济负担，从
    AWS 中获得最大收益。

    '
- fmt: '# Understanding the Pricing of AWS


    As per the documentation, AWS tries to make our lives simpler by charging us the
    same way as we get charged for using electricity or water. This means we pay only
    for whatever we are going to use. When we have an infrastructure present on our
    premises, we have to pay for everything, even if we are not using it. In AWS,
    it is not the same. This is called *pay-as-you-go*.


    In Figures [2-1](#495447_1_En_2_Chapter.xhtml#Fig1) and [2-2](#495447_1_En_2_Chapter.xhtml#Fig2),
    AWS tries to show the difference in pricing between two architectures. When we
    look at Figure [2-1](#495447_1_En_2_Chapter.xhtml#Fig1), we see that even when
    we are not using the infrastructure, the part denoted by the red shaded region,
    we are still paying for it. Hence, in the end, you see that every month the charges
    keep increasing, and by the end of the year you end up paying a lot.


    ![../images/495447_1_En_2_Chapter/495447_1_En_2_Fig1_HTML.jpg](images/495447_1_En_2_Chapter/495447_1_En_2_Fig1_HTML.jpg)


    Figure 2-1


    Pricing in on-premise infrastructure


    Instead, Figure [2-2](#495447_1_En_2_Chapter.xhtml#Fig2) shows that one pays more
    if it uses more, while in the remaining days it is much less. Hence, the cost
    savings in the case of AWS is much more. Another way that AWS helps us to save
    money is by using the reserve functionality provided.


    ![../images/495447_1_En_2_Chapter/495447_1_En_2_Fig2_HTML.jpg](images/495447_1_En_2_Chapter/495447_1_En_2_Fig2_HTML.jpg)


    Figure 2-2


    Pricing in AWS infrastructure


    By *reserved instances*, AWS means that you pay for a service of AWS up front,
    for a longer time of usage. This means the resources and infrastructure required
    for that service at a later time are reserved, and hence no one else can use those
    reserved services and infrastructure. As you are asking to use an entire service
    for a longer amount of time, this means AWS will keep on earning from those services.
    The infrastructure will never be idle in terms of money. Therefore, to make things
    easier for the companies opting for reserved instances, AWS charges them less.
    It is sometimes less than 70 percent of the on-demand instances that we talked
    about in the previous chapter.


    Now, before going into the details of AWS pricing, let’s first look at the AWS
    Free Tier, including what services we can use for free and for how much time.


    ## AWS Free Tier


    AWS offers free services in three areas.


    * Services that are always free

    * Services that are free for around 12 months

    * Services that are available on a trial basis


    The following are some of the services that are always free:


    * `DynamoDB` is free for 25 GB storage.

    * `AWS Lambda` is always free for 1 million requests per month, and up to 3.2
    million of compute time.

    * 1 million objects can be stored in `Amazon Glue` for free.


    The following are some of the services that are free for about 12 months:


    * 5 GB of `Amazon S3`

    * 750 hours of `EC2` instances per month, supporting `t2.micro` and `t3.micro`

    * 50 K units of text in `Amazon Comprehend`


    The following are the services that are available on a trial basis:


    * 250 hours/month of `Amazon SageMaker` using `t2.medium` for two months

    * 50 hours/month of `Amazon SageMaker` using `m4.xlarge` for two months

    * 125 hours/month of hosting in `Amazon SageMaker` for two months


    ## Factors Affecting Pricing in AWS


    AWS calculates pricing based upon these three elements:


    * Computation

    * Storage

    * Data transfer


    AWS doesn’t charge you for the incoming transmission of data or data transmission
    between two or more services of AWS only. But, whatever data goes outside the
    AWS network (an outbound data transmission), it does charge you for that. It depends
    upon the amount of data transferred. The more data, the lower the price per gigabyte.


    As mentioned, for computations the charge is calculated on an hourly basis, and
    for storage it is calculated in gigabytes. Now that we know which factors affect
    AWS pricing, we must know how we can optimize the cost in AWS.


    ## AWS Cost Optimization


    We can create a cost-effective AWS architecture by following the four simple steps
    given here:


    * Right-sizing your services

    * Using reserved instances

    * Using a spot market

    * Using the Cost Explorer


    ### Right-Sizing


    The term *right-sizing* means that you only use a service that you need. This
    means you only use the compute power that you require or only use the storage
    that you need. You must not over-provision it and neither should you compromise
    on the capacity. AWS provides you with services that help you in right-sizing
    through autoscaling, which includes up scaling, down scaling, scaling out, and
    scaling in based on the usage.


    To right-size, the organization should perfectly know the needs and usage pattern
    required and then take advantage of AWS’s elasticity to right-size. Through this,
    the organization can save up to 70 percent of the total cost. Also, one must remember
    that it is not a one-time affair. This means the companies have to periodically
    plan their needs and pattern and make changes accordingly. Therefore, one can
    say that right-sizing is an ongoing process.


    How do you decide when it is the perfect time to perform right sizing again? For
    this, AWS has given us some tools that can be used for making these sorts of decisions.


    * *Amazon CloudWatch*: You can know about the amount of CPU utilized, the throughput
    of the network, the disk I/O operations, etc., and then use this information to
    decide whether revised right-sizing is required.

    * *AWS Cost Optimization*: This provides you with the recommendations about the
    right-sizing based on the current utilization. We will discuss this more in the
    upcoming section.

    * *AWS Cost Explorer*: You can use the Cost Explorer to understand what are the
    prime drivers of the cost incurred to the company. Based on that, the right decisions
    can be made.

    * *AWS Trusted Advisor*: This helps you know more about idle or underutilized
    resources.


    The following are some of the factors that can be taken into consideration while
    deciding about the optimal right-sizing. These factors can be grouped into the
    following categories:


    * Right-sizing based upon performance data

    * Right-sizing based upon usage needs

    * Right-sizing by stopping instances

    * Right-sizing based upon selection of right instance family

    * Right-sizing based upon selection of database instances


    When it comes to the analysis of performance data, one should identify the instances
    that are idle or are underutilized. For this, one can look at the CPU and memory
    usage of the instances. This can be done using `CloudWatch` or any other tools
    mentioned earlier. Amazon recommends that those instances with a maximum CPU or
    memory usage of less than 40 percent for a four-week period can be right-sized.


    When it comes to analyzing the usage needs, one must take into consideration the
    following:


    * If the load remains constant for a longer period of time, we can opt for reserved
    instances, instead of on-demand or spot instances. We will talk about reserved
    instances in detail in the next section.

    * If the load is not constant, but we can say that in approximately equal intervals
    or during specific scenarios the load increases or decreases, then we can use
    the autoscaling features of `AWS EC2` instances.

    * All loads that are considered to be flexible, which means they are used only
    when required and then can be turned off, can use on-demand or spot instances.'
