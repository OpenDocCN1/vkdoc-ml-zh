- fmt: '### Overview of Logistic Regression


    `Logistic regression` is the transformation of `linear regression` in such a way
    that the range of prediction is from 0 to 1. This is done by passing the equation
    of `linear regression` to a `sigmoid` function. Therefore, the straight line that
    we saw in `linear regression` gets converted into an S-shaped curve with an upper
    limit of 1 and a lower limit of 0, as shown in Figure [6-2](#495447_1_En_6_Chapter.xhtml#Fig2).


    ![../images/495447_1_En_6_Chapter/495447_1_En_6_Fig2_HTML.jpg](images/495447_1_En_6_Chapter/495447_1_En_6_Fig2_HTML.jpg)


    Figure 6-2


    Logistic regression


    Once `logistic regression` predicts a value, it is taken as a probability of prediction
    for binary classification use cases. As a default, if prediction exceeds 0.5,
    then a success class is predicted; otherwise, a failure class is predicted. The
    threshold of 0.5 is customizable so that we can attain better precision and recall
    (which will be discussed in detail in the next chapter). `Logistic regression`
    for multiclass classification is called *multinomial logistic regression*, and
    instead of using `sigmoid`, it uses the `softmax` function.


    ### SageMaker Application of Linear Learner


    The first step will be to read the dataset from the S3 bucket, preprocess the
    columns to remove the null values, and apply scaling and encoding. We saw how
    to preprocess the dataset and get to the dependent and independent variables in
    the previous chapter. Therefore, we will start this section directly by applying
    the algorithm on the preprocessed dataset. We will define the role and buckets
    so that `SageMaker` can talk to different services properly.


    ```

    import boto3

    from sagemaker import get_execution_role

    bucket = ''slytherins-test''

    prefix = ''linear-learner''

    role = get_execution_role()

    ```


    Now, we need to decide what algorithm needs to be applied, that is, linear or
    logistic regression. We will start with logistic regression. To make a logistic
    regression model, we need a categorical column. We know that our target variable
    is `Sales`, and it is a numerical column; hence, logistic regression cannot be
    applied. So, we will bin the `Sales` columns into four categories, and then we
    can start applying algorithms.


    ```

    y_binned = pd.cut(y[''Item_Outlet_Sales''], 4, labels=[''A'', ''B'', ''C'', ''D''])

    ```


    The previous code bins `y` into the four categories of `A`, `B`, `C`, and `D`,
    each having an equal range. You can see the output here:


    ![../images/495447_1_En_6_Chapter/495447_1_En_6_Figa_HTML.jpg](images/495447_1_En_6_Chapter/495447_1_En_6_Figa_HTML.jpg)


    Now that we have our categorical column as a target variable, we will apply label
    encoding on it so that each category can be represented by an integer.


    ```

    from sklearn.preprocessing import LabelEncoder

    le = LabelEncoder()

    temp = le.fit(y_binned)

    y_final = temp.transform(y_binned)

    ```


    Now that we have our final target variable defined and stored in `y_final`, we
    will use it to train the model. As mentioned in the previous chapter, `SageMaker`
    runs the algorithm inside Docker containers, and hence the data should be stored
    in an S3 bucket so that the containers can access them. Our next step will be
    to store the data in S3. For our linear learner algorithm, we will use a data
    format called the RecordIO-Protobuf format. Using this data format helps you with
    a faster training time, and you can train models in live data mode (called *pipe
    mode*). We can convert our independent and target variables to RecordIO format
    using the following lines of code:


    ```

    import io

    import numpy as np

    import sagemaker.amazon.common as smac

    vectors = np.array(X.values, dtype="float32")

    labels = np.array(y_final, dtype="float32")

    buf = io.BytesIO()

    smac.write_numpy_to_dense_tensor(buf, vectors, labels)

    buf.seek(0)

    ```


    The previous lines convert the data into RecordIO format and then open the temporary
    file so that it can be directly inserted into S3. A RecordIO file is used by breaking
    a big file into chunks and then using these chunks for analysis. This file helps
    us create streaming jobs in `SageMaker`, which makes the training fast. To send
    it, we will use the next lines of code:


    ```

    key = ''recordio-pb-data''

    boto3.resource(''s3'').Bucket(bucket).Object(os.path.join(prefix, ''train'', key)).upload_fileobj(buf)

    s3_train_data = ''s3://{}/{}/train/{}''.format(bucket, prefix, key)

    print(''uploaded training data location: {}''.format(s3_train_data))

    ```


    This will upload the data to S3 and close the buffer that we created. Now, our
    basic steps are done. All we need to do is to make the connection and train the
    model. The first step will be to initialize our linear learner algorithm Docker
    container.


    ```

    from sagemaker.amazon.amazon_estimator import get_image_uri

    container = get_image_uri(boto3.Session().region_name, ''linear-learner'')

    ```


    After initializing, let’s pass the required parameters for linear learner and
    initialize the algorithm.


    ```

    sess = sagemaker.Session()

    linear = sagemaker.estimator.Estimator(container,

    role,

    train_instance_count=1,

    train_instance_type=''ml.m4.xlarge'',

    output_path=output_location,

    sagemaker_session=sess)

    ```'
