- fmt: "# AWS 成本优化与实例管理\n\n当我们运行笔记本电脑或台式机等常规系统时，会在不使用时将其关闭。AWS 也可以采用同样的做法。所有闲置超过两周的实例都可以被停止或终止。一旦实例被停止，公司就无需再为\
    \ EC2 实例付费。但请记住，每个 EC2 实例都关联着一个 EBS 卷。该卷仍然存在，您仍需为其付费。如果您想终止实例，附加的 EBS 卷也会被删除；因此，EBS\
    \ 将不再产生费用。但是，如果您想重新运行该实例，则需要重新配置以恢复 EBS 卷。最佳方法之一是存储 EBS 卷的快照，这样在终止甚至删除期间，EBS 卷可以以快照的形式作为备份保存。\n\
    \n## 什么是 EBS 卷？\n\n在理解 Amazon Elastic Block Storage (EBS) 之前，我们必须知道什么是块设备。简单来说，*块设备*是一种用于存储信息的设备。因此，所有磁盘驱动器（如\
    \ HDD 或 SSD）都是块设备。它们是平台无关的，这意味着您可以为它们安装任何操作系统，块设备都能正常工作。在块设备内部，存储着您的所有文件，并且可以通过任何实例和操作系统进行访问。\n\
    \n现在，当我们谈论 EBS 时，它允许在 Amazon EC2 实例中使用这种块存储。它为您提供了将多个 EBS 卷附加到单个 EC2 实例，或将一个 EBS\
    \ 卷附加到多个 EC2 实例的功能。\n\n我们可以决定为工作负载选择最合适的实例，也可以根据两个选项进行更改：在同一系列中更改实例，以及将实例更改为不同系列。我们可以根据以下指标在同一系列中将实例更改为另一个实例：\n\
    \n- vCPU 数量\n- 查看内存\n- 查看网络吞吐量\n- 查看附加存储\n\n但是，当我们将实例更改为不同系列中的另一个实例时，我们会考虑以下指标：\n\
    \n- 选择正确的虚拟化类型\n- 选择是否需要 VPC 支持\n- 选择正确的平台\n- 选择是否升级硬件要求\n\n对于前三点，我们必须确保升级前后的配置相同。对于最后一点，将整个架构迁移到升级后的\
    \ EC2 实例需要付出努力。我们在前一章讨论了 EC2 实例的不同系列。\n\n## 什么是虚拟化类型？\n\nAWS 中的 Linux 机器支持两种虚拟化类型：半虚拟化\
    \ (PV) 和硬件虚拟机 (HVM)。这两种实例的区别在于操作系统如何启动以及如何利用额外的配置（如 CPU、存储等）。\n\n## 合理调整数据库实例大小\n\
    \n最后但同样重要的是，我们可以合理调整数据库实例的大小。为此，必须牢记以下指标：\n\n- 您可以向上扩展或向下扩展数据库实例，或者存储大小保持不变。\n\
    - 我们可以单独更改数据库实例的存储大小。\n- AWS 非常重视许可证。因此，无论用户使用什么数据库，都必须拥有正确的许可证。\n- 您可以选择数据库实例的合理调整时间。可以立即执行，也可以在特定时间窗口（如维护期间）执行。\n\
    \n以上结束了我们在 AWS 中关于合理调整大小的讨论。接下来，我们必须了解更多关于预留实例的信息。\n\n## 使用预留实例\n\n预留实例关乎承诺。在您购买\
    \ AWS 的预留兼容服务时，就必须决定是进行长期承诺，还是您的需求会定期变化。如果是长期承诺，那么您可以选择预留服务，这可以降低该服务的每小时成本。以下是\
    \ AWS 提供预留功能的服务：\n\n- Amazon EC2\n- Amazon RDS\n- Amazon ElastiCache\n- Amazon\
    \ RedShift\n- Amazon DynamoDB\n\n使用预留实例时必须绝对确定，因为锁定期要么是一年，要么是三年。这意味着您必须提前支付整整一年或三年的费用。付款完成后，无论您使用实例多少，都不会像按需实例那样获得退款。因此，一旦您支付了锁定期的费用，您可以获得高达按需实例\
    \ 75% 的折扣，但您将无法获得基于使用模式的动态定价。\n\n预留实例提供以下付款选项：\n\n- 无预付费用\n- 部分预付费用\n- 全部预付费用\n\
    \n顾名思义，无预付费用意味着您在开始时无需支付任何金额。部分预付费用意味着您可能在开始时支付一些金额，而全部预付费用意味着您在开始时支付全部金额。对于无预付的情况，客户按折扣后的每小时费率收费。但是，由于\
    \ AWS 不确定客户是否会付款，因此需要与他们签订合同协议，并且还会查看这些客户与 AWS 的过往关系。对于部分预付费用，也遵循同样的做法。剩余金额按折扣后的每小时费率收取。\n\
    \n预留实例分为两种类型：\n\n- 标准预留实例\n- 可转换预留实例\n\n使用标准预留实例，可以增加实例大小或修改可用区，也可以在预留实例市场中出售。另一方面，可转换预留实例可以与其他可能具有新属性（如实例系列、实例类型、平台等）的可转换实例进行交换。它们不能在市场中出售。\n\
    \n每月可购买的预留实例数量也有限制。对于特定区域，每月可以购买 20 个区域实例和 20 个可用区实例。区域实例是适用于整个区域的实例，而可用区实例是适用于特定可用区的实例。\n\
    \n## 使用竞价实例\n\n正如前一章所述，竞价实例是那些处于闲置状态且 AWS 目前未从中产生任何收益的实例。公司可以使用这些实例，并获得高达按需实例\
    \ 90% 的折扣。请记住，由于这些是当前闲置的实例，但这并不意味着它们会一直闲置。这意味着，当它们的使用量再次上升时，EC2 会给您两分钟的通知，然后中断您的竞价实例会话。显然，每件好事都有缺点。您的竞价实例被终止的另一种方式是当您产生的成本超过了定义的阈值。\n\
    \n我们必须了解必须使用竞价实例的场景。Amazon 建议在以下场景中使用竞价实例：\n\n- 构建容错且灵活的应用程序\n    - Web 服务器\n\
    \    - API 后端\n    - CI/CD 管道 (DevOps)\n    - Hadoop 数据处理\n- 图像渲染\n- 无状态 Web 服务\n\
    - 大数据分析\n- 并行计算\n\n一旦您拥有按需实例，您可以请求竞价实例来处理应用程序的一些额外功能。为此，您可以通过在 EC2 中启动向导来请求竞价实例。您只需告知实例数量、实例类型、可用区以及您愿意为此支付的最高价格。"
  raw: "When we run our normal systems such as laptops or desktops, we turn them off\
    \ when not in use. The same thing can be done with AWS. All those instances that\
    \ have been idle for more than two weeks can be stopped or terminated. Once an\
    \ instance is stopped, the company stops paying for the EC2 instance. But remember,\
    \ for every EC2 instance there is an EBS volume associated with it. The volume\
    \ remains alive, and you still keep paying for it. If you want to terminate the\
    \ instance, the attached EBS volume gets deleted as well; hence, there is no cost\
    \ for EBS. But, if you want to rerun that instance, then some re-provisioning\
    \ should be done to get back the EBS volume. One of the best ways can be to store\
    \ the snapshot of EBS volumes so that during termination or even during deletion,\
    \ the EBS volumes can be stored in the form of snapshots as a backup.\n\n####\
    \ What Is an EBS Volume?\n\nBefore understanding Amazon Elastic Block Storage\
    \ (EBS) , we must know what a block device is. A *block device*, in simple terms,\
    \ is a device that is used to store your information. Therefore, all the disk\
    \ drives like HDD or SSD are the block devices. They are platform independent,\
    \ which means you can give them any operating system, and a block device will\
    \ work. Inside a block device all your files are stored and which can be accessed\
    \ using any instance and operating system.\n\nNow, when we talk about EBS, it\
    \ allows this block storage in Amazon EC2 instances. It provides you with the\
    \ feature to attach multiple EBS volumes in one single EC2 instance or one EBS\
    \ volume to multiple EC2 instances.\n\nWe can decide to select the perfect instance\
    \ for our workloads, and we can also change it based on two options: changing\
    \ the instance in the same family and changing the instance to a different family.\
    \ We can change the instance to another instance in the same family based on the\
    \ following metrics:\n\n*   Count of vCPUs\n\n*   Looking at the memory\n\n* \
    \  Looking at network throughput\n\n*   Looking at the attached storage\n\nBut,\
    \ when we change the instance to another instance in a different family, we consider\
    \ the following metrics:\n\n*   Selecting the right virtualization type\n\n* \
    \  Selecting whether you need VPC support\n\n*   Selecting the right platform\n\
    \n*   Selecting whether to upgrade hardware requirements or not\n\nFor the first\
    \ three points, we must be sure that the configuration before the upgrade is the\
    \ same as after the upgrade. For the last point, it must require efforts to move\
    \ the entire architecture to an upgraded EC2 instance. We talked about different\
    \ families of EC2 instances in the previous chapter.\n\n#### What Are Virtualization\
    \ Types?\n\nLinux machines in AWS support two types of virtualization: paravirtual\
    \ (PV) and hardware virtual machine (HVM). The difference between these two instances\
    \ is in how the operating system boots and how it takes advantage of additional\
    \ configurations like CPUs, storage, etc.\n\n#### Right-Sizing Database Instances\n\
    \nLast but not the least, we can right-size the database instances. For this,\
    \ the following metrics must be kept in mind:\n\n*   Either you scale up or you\
    \ scale down your database instances, or the storage size remains the same.\n\n\
    *   We can separately change the storage size of the database instance.\n\n* \
    \  AWS takes licenses seriously. Therefore, whatever database a person is using,\
    \ the right licenses must be there.\n\n*   You can select the right-sizing time\
    \ of your database instances. It can be done immediately or at a specific window\
    \ like during the maintenance time.\n\nThis concludes our discussion about right-sizing\
    \ in AWS. Next, we must learn more about reserved instances.\n\n### Using Reserved\
    \ Instances\n\nReserved instances are all about commitment. While you are purchasing\
    \ the reserve compatible services of AWS, at that time only must you decide whether\
    \ you want to go for a long-term commitment or your requirements will change periodically.\
    \ If it is long-term, then you can opt for reserved services, and this can lead\
    \ to a reduction in hourly cost of that service. The following are the services\
    \ provided by AWS that offer a reserve facility:\n\n*   Amazon EC2\n\n*   Amazon\
    \ RDS\n\n*   Amazon ElastiCache\n\n*   Amazon RedShift\n\n*   Amazon DynamoDB\n\
    \nOne must be absolutely sure to use reserved instances, as the lock-in period\
    \ is either one year or three years. That means you must pay for either the entire\
    \ one year or three years beforehand. After the payment is done, no matter how\
    \ much you use the instance, you will not get any money back, like on-demand instances.\
    \ Therefore, once you pay for the lock-in period, you can get a discount up to\
    \ 75% of that of on-demand instances, but then you will not get dynamic pricing\
    \ for the usage patterns.\n\nReserved instances come up with the following payment\
    \ options:\n\n*   No up-front payment\n\n*   Partial up-front payment\n\n*   All\
    \ up-front payment\n\nAs the names suggest, no up-front payment means you don’t\
    \ pay any amount at the start. Partial up-front payment means you may pay some\
    \ amount at the start, while all up-front payment means that you pay the complete\
    \ amount at the start. For the no up-front scenario, the customers are charged\
    \ at the discounted hourly rate. But, since AWS is not sure whether customers\
    \ are going to pay, it requires a contractual agreement with them, and it also\
    \ looks at the past relationship of those customers with AWS. For partial up-front\
    \ payment, the same thing is followed. The remaining amount is charged at a discounted\
    \ hourly rate.\n\nReserved instances come under two offerings.\n\n*   Standard\
    \ reserved instances\n\n*   Convertible reserved instances\n\nWith standard reserved\
    \ instances, the instances can be increased in size or availability zones can\
    \ be modified, or they can also be sold in the reserved instances marketplace.\
    \ Convertible reserved instances, on the other hand, can be exchanged with other\
    \ convertible instances that may have new attributes such as instance family,\
    \ instance type, platform, etc. They cannot be sold in the marketplace.\n\nThere\
    \ is also a limit on the number of reserved instances that can be purchased in\
    \ a month. For a particular region, 20 regional instances and 20 zonal instances\
    \ can be purchased in a month. A regional instance is an instance that is available\
    \ for a complete region, while a zonal instance is an instance available to a\
    \ specific availability zone.\n\n### Using Spot Instances\n\nAs already discussed\
    \ in the previous chapter, spot instances are those instances that are running\
    \ idle and currently AWS is not generating any money from it. These instances\
    \ can be taken by companies and can achieve discounts up to 90 percent of the\
    \ on-demand instances. Remember, as these are the instances that are currently\
    \ idle, that doesn’t mean they will always be idle. This means that whenever the\
    \ use of them goes up again, EC2 gives you a two-minute notice and then interrupts\
    \ the session of your spot instance. Obviously, every great thing has disadvantages.\
    \ Another way by which your spot instance can be terminated is when the cost incurred\
    \ by you increases the threshold defined.\n\nWe must know about the scenarios\
    \ in which one must use the spot instances. Amazon recommends using the spot instances\
    \ for the following scenarios:\n\n*   Making fault-tolerant and flexible applications\n\
    \    *   Web servers\n\n    *   API back ends\n\n    *   CI/CD pipeline (DevOps)\n\
    \n    *   Hadoop data processing\n\n*   Image rendering\n\n*   Stateless web services\n\
    \n*   Big data analytics\n\n*   Parallel computations\n\nOnce you have an on-demand\
    \ instance, you can ask for spot instances to handle some extra functionalities\
    \ that your application has. For this you can request spot instances by launching\
    \ a wizard in EC2\\. You just need to tell the number of instances, the type of\
    \ instances, the availability zone, and the maximum price that you’re willing\
    \ to pay for the same."
