    ## 结论


    在本章中，您学习了 AWS 如何对其服务收费，以及如何有效利用某些 AWS 服务来最大限度地降低成本。本章有助于您根据自己的预算和需求决定选择哪些服务。


    在下一章中，您将详细了解 AWS 的安全方面。您还将了解 AWS 如何处理容错，以及如何有效地构建一个能够基于组织层级提供 AWS 服务的架构。


    # 3. Amazon Web Services 中的安全性


    在本章中，我们将探讨 AWS 的安全方面。如您所知，AWS 拥有数百种服务，服务于成千上万的客户，因此其安全性上的任何微小疏漏都可能导致特定公司乃至 AWS
    自身的巨大损失。这就是 AWS 拥有一些具体的安全实践以及专门的安全服务来全面照管 AWS 功能的原因。


    本章专门介绍这些服务中一些最重要的部分。学完本章后，您将理解 AWS 的底层安全机制，并且能够在您使用的产品中实施不同的安全功能。


    ## AWS 的 SSR 模型


    在安全方面，AWS 遵循共享安全责任（SSR）模型。这个模型很简单：责任应由客户和 AWS 共同承担。具体来说，AWS 负责其提供给客户的整个基础设施的安全。另一方面，客户则负责其在该基础设施中存放的任何内容。图
    3-1 展示了 AWS 的 SSR 模型。


    ![../images/495447_1_En_3_Chapter/495447_1_En_3_Fig1_HTML.jpg](img/495447_1_En_3_Fig1_HTML.jpg)


    图 3-1


    AWS 的共享安全模型


    以下是 AWS 的部分责任：


    *   AWS 负责整个基础设施，包括 AWS 用于运行其服务的硬件、软件、网络和其他设施。


    *   AWS 通过组织第三方审计定期提供其运营报告。其合规性、安全标准和法规均经过验证。


    *   对于大多数服务，基本的安全任务也由 AWS 完成，例如安装客户操作系统、修补数据库、配置防火墙以及进行灾难恢复。


    以下是客户和用户的部分责任：


    *   在服务被预订且 AWS 处理了基本安全事务后，客户有责任执行所有必要的安全配置和管理任务。这可能包括更新操作系统、安装安全补丁、配置防火墙等。


    *   客户必须使用 Amazon Identity and Access Management (IAM) 服务设置用户账户。这将允许客户为其每个用户提供不同的凭证，从而访问不同的服务。


    *   客户必须为每个账户设置多因素认证。


    我们将在本章后面更深入地讨论 Amazon IAM 和多因素认证。


    AWS 为其客户提供高级别的安全性，这些安全性可以分为以下几类：


    *   合规性要求


    *   物理和环境安全


    *   业务连续性管理


    *   网络安全


    ### 合规性


    AWS 的基础设施基于多项 IT 安全标准，包括：


    *   SOC 1/SSAE 16/ISAE 3402（原 SAS 70）


    *   SOC 2


    *   SOC 3


    *   FISMA、DIACAP 和 FedRAMP


    *   DOD CSM 级别 1–5


    *   PCI DSS 级别 1


    *   ISO 9001/ISO 27001/ISO 27017/ISO 27018


    此外，AWS 还遵循一些行业特定标准。


    *   刑事司法信息服务（CJIS）


    *   云安全联盟（CSA）


    *   家庭教育权利和隐私法案（FERPA）


    *   健康保险流通与责任法案（HIPAA）


    *   美国电影协会（MPAA）


    ### 物理和环境安全


    为了基础设施的物理和环境安全，AWS 遵循以下标准：


    *   只有经过授权的人员才允许进入 AWS 数据中心场所，即使他们是 AWS 或亚马逊的员工也不例外。


    *   设施内安装了自动火灾探测传感器和灭火装置。


    *   AWS 数据中心不仅拥有稳定的电力供应，还配备了强大的 UPS，以便在发生电源故障时，运营永不中断。


    *   数据中心内安装了温度控制设备，并由人员持续监控，以保持最佳温度。


    *   AWS 按照严格规范淘汰任何硬件，以确保数据永不泄露。


    ### 业务连续性管理


    许多公司正在迁移到云平台，他们不希望自己的业务运营因 AWS 而中断。当公司将整个业务基础设施迁移到 AWS 时，他们所有的数据都驻留在那里。即使是几个小时的业务中断也可能给公司造成巨大损失。因此，AWS
    在制定其基础设施计划时必须严格，以防止这种情况发生。为了确保业务连续性管理，AWS 采取了许多措施。


    *   AWS 的所有数据中心全年 365 天、每周 7 天、每天 24 小时运行。因此，如果某个特定数据中心发生故障，AWS 要做的第一件事就是将数据流量从受影响的区域转移出去。


    *   使用 AWS，客户可以将其数据放入多个地理区域，并且在每个区域内，数据可以放入多个可用区。可用区的构建方式使其与同一区域内的所有其他可用区相互独立。因此，例如，如果某个可用区所在的区域在特定季节有可能受到洪水影响，那么同一区域内的所有其他可用区都将被放置在永远不会受到同一洪水影响的场所。


    *   每个数据中心都配备有 UPS 和现场备用发电设施。此外，为了进一步提高安全性，设施内还提供来自不同电网的电力，以便在一条线路发生故障时，另一条线路仍能有效供电。

    '
- fmt: '### Network Security


    As we saw in the previous section, AWS has made its data centers resilient to
    calamities. But, a threat bigger than that is intrusion on the network. As technology
    advances, so do the skills of hackers. So, how does AWS tackle its network security?
    Well, let’s explore some of the measures that AWS has taken to make its network
    secure.


    - There is a firewall that secures your incoming and outgoing traffic. This is
    the most basic yet most powerful first step for network security.

    - AWS has access control lists (ACLs) that contain a set of policies that decides
    who can access what services of AWS and what information goes to which service.
    These ACLs are regularly updated, and they are automatically pushed using the
    AWS tool called `ACLManage`.

    - There can be a lot of entry points from where the information can flow into
    AWS servers, and the same is true with the exit points. Therefore, in such a scenario,
    managing those entry and exit points can become really difficult. Therefore, to
    deal with this issue, AWS has secure access points. Using them, AWS has only a
    limited number of access points through which comprehensive monitoring of all
    incoming and outgoing transmission takes place. These access points are called
    `API endpoints`, and only HTTPS access is allowed to have a secure connection.

    - AWS provides the option of additional security to its customers through Amazon
    VPC. We discussed VPC in Chapter [1](#495447_1_En_1_Chapter.xhtml).

    - For AWS there are two types of clients. One is its regular customers, while
    the other is its own corporate network. AWS doesn’t give any special privileges
    to its corporate network while accessing the AWS services. For AWS employees,
    if they want to access any AWS service first, they have to raise a ticket, and
    if it gets approved, then they can get access. Also, for security purposes, everything
    that the employee does is logged securely.

    - There are many automated monitoring tools that AWS has so that it can monitor
    the server and network usage, scanning the ports for inbound and outbound transmission,
    detecting unauthorized intrusion attempts, etc.


    ## AWS Account Security Features


    In the previous sections, we saw how AWS has made its infrastructure secure. In
    this section, we will look at how AWS makes its customers’ AWS accounts secure.
    The first thing that AWS does is to secure every account with credentials. There
    are different ways in which AWS uses credentials for authentication.


    - Passwords

    - Cryptographic keys

    - Digital signatures

    - Certificates

    - Multifactor authentication


    Once you have created the credentials for your account, it is easy to download
    the report of credentials from the Security Credentials page. The information
    that is included in the report tell us about whether the account uses a password,
    whether the password is retirable, when was the password last changed, when the
    keys were last rotated, and whether multifactor authentication is enabled.


    In AWS we can create multiple access keys and define multiple certificates as
    well. This is done to rotate them continuously for security reasons. When they
    are being rotated and we want business continuity to not be affected, we can use
    concurrent keys and certificates. We can use AWS IAM to rotate the keys. We will
    learn about the keys and certificates in more detail in the next section.


    ### Passwords for Authentication


    If you want to access AWS services, passwords are really important. They grant
    you the first level of access inside AWS. Passwords are created at the time of
    account creation and can be changed any time through the Security Credentials
    page. AWS allows passwords of up to 128 characters, and they must have special
    character combinations to be strong enough.


    If your organization’s infrastructure is entirely hosted on AWS, you can create
    password policies so that new passwords must follow your security policy. This
    assures that the strongest of passwords are created.


    ### Multifactor Authentication


    This is an additional level of security that a customer may opt for. Multifactor
    authentication requires that after the customer has successfully entered the username
    and password, the user will have to provide a specific and unique six-digit code
    for authentication. If that is successful, then the person will be allowed to
    enter the account. This six-digit code is received by the customer to one of its
    authenticated devices. It can be a smartphone, email, or phone number. As the
    person logs in, a code is received that should be entered, and then successful
    login takes place.


    ### Access Keys for API Authentication


    An API is a feature where a request is sent to a piece of code encapsulated behind
    the API and the person receives the output. Now, the coding logic inside an API
    may be allowing the user to access sensitive information. So, the request that
    is sent to these APIs must be authenticated as well, which means only the right
    user must get the access to the API. This is done through a `digital signature`.
    This digital signature is generated by passing the request text and secret access
    key to a hash function responsible for the cryptography. This hash function encrypts
    the message and then sends it to the API. This in turn gets decrypted at the API
    end; the secret key is checked, and then the entry is provided.


    Currently, digital signatures use a protocol named `HMAC-SHA256` that is in its
    fourth version. One more level of security in digital signature verification is
    that a timestamp is added to the request. If the timestamps of the digital signature
    being generated and being received by the API are different by greater than 15
    minutes, the request is denied.


    ### X.509 Certificates


    When we want two or more web services to talk to each other, we use SOAP-based
    requests. To make these sorts of requests secure, we use X.509 certificates. These
    certificates consist of three parts.


    - A public key

    - A private key

    - Additional metadata


    The first step is to generate the digital signature by using the process that
    we looked at in the previous section. Now, we use this digital signature and the
    certificate to send the request. First, AWS tries to verify that the authenticated
    user is sending the request by decrypting the digital signature and verifying
    it. After that, the certificate that has been sent is matched by AWS with the
    certificate uploaded by the authenticated user in their own AWS account. If everything
    is green, the request is sent forward; otherwise, it’s denied.'
  raw: '### Network Security


    As we saw in the previous section, AWS has made its data centers resilient to
    calamities. But, a threat bigger than that is intrusion on the network. As technology
    advances, so do the skills of hackers. So, how does AWS tackle its network security?
    Well, let’s explore some of the measures that AWS has taken to make its network
    secure.


    *   There is a firewall that secures your incoming and outgoing traffic. This
    is the most basic yet most powerful first step for network security.


    *   AWS has access control lists (ACLs) that contain a set of policies that decides
    who can access what services of AWS and what information goes to which service.
    These ACLs are regularly updated, and they are automatically pushed using the
    AWS tool called ACLManage.


    *   There can be a lot of entry points from where the information can flow into
    AWS servers, and the same is true with the exit points. Therefore, in such a scenario,
    managing those entry and exit points can become really difficult. Therefore, to
    deal with this issue, AWS has secure access points. Using them, AWS has only a
    limited number of access points through which comprehensive monitoring of all
    incoming and outgoing transmission takes place. These access points are called
    *API endpoints*, and only HTTPS access is allowed to have a secure connection.


    *   AWS provides the option of additional security to its customers through Amazon
    VPC. We discussed VPC in Chapter [1](#495447_1_En_1_Chapter.xhtml).


    *   For AWS there are two types of clients. One is its regular customers, while
    the other is its own corporate network. AWS doesn’t give any special privileges
    to its corporate network while accessing the AWS services. For AWS employees,
    if they want to access any AWS service first, they have to raise a ticket, and
    if it gets approved, then they can get access. Also, for security purposes, everything
    that the employee does is logged securely.


    *   There are many automated monitoring tools that AWS has so that it can monitor
    the server and network usage, scanning the ports for inbound and outbound transmission,
    detecting unauthorized intrusion attempts, etc.


    ## AWS Account Security Features


    In the previous sections, we saw how AWS has made its infrastructure secure. In
    this section, we will look at how AWS makes its customers’ AWS accounts secure.
    The first thing that AWS does is to secure every account with credentials. There
    are different ways in which AWS uses credentials for authentication.


    *   Passwords


    *   Cryptographic keys


    *   Digital signatures


    *   Certificates


    *   Multifactor authentication


    Once you have created the credentials for your account, it is easy to download
    the report of credentials from the Security Credentials page. The information
    that is included in the report tell us about whether the account uses a password,
    whether the password is retirable, when was the password last changed, when the
    keys were last rotated, and whether multifactor authentication is enabled.


    In AWS we can create multiple access keys and define multiple certificates as
    well. This is done to rotate them continuously for security reasons. When they
    are being rotated and we want business continuity to not be affected, we can use
    concurrent keys and certificates. We can use AWS IAM to rotate the keys. We will
    learn about the keys and certificates in more detail in the next section.


    ### Passwords for Authentication


    If you want to access AWS services, passwords are really important. They grant
    you the first level of access inside AWS. Passwords are created at the time of
    account creation and can be changed any time through the Security Credentials
    page. AWS allows passwords of up to 128 characters, and they must have special
    character combinations to be strong enough.


    If your organization’s infrastructure is entirely hosted on AWS, you can create
    password policies so that new passwords must follow your security policy. This
    assures that the strongest of passwords are created.


    ### Multifactor Authentication


    This is an additional level of security that a customer may opt for. Multifactor
    authentication requires that after the customer has successfully entered the username
    and password, the user will have to provide a specific and unique six-digit code
    for authentication. If that is successful, then the person will be allowed to
    enter the account. This six-digit code is received by the customer to one of its
    authenticated devices. It can be a smartphone, email, or phone number. As the
    person logs in, a code is received that should be entered, and then successful
    login takes place.


    ### Access Keys for API Authentication


    An API is a feature where a request is sent to a piece of code encapsulated behind
    the API and the person receives the output. Now, the coding logic inside an API
    may be allowing the user to access sensitive information. So, the request that
    is sent to these APIs must be authenticated as well, which means only the right
    user must get the access to the API. This is done through a *digital signature*.
    This digital signature is generated by passing the request text and secret access
    key to a hash function responsible for the cryptography. This hash function encrypts
    the message and then sends it to the API. This in turn gets decrypted at the API
    end; the secret key is checked, and then the entry is provided.


    Currently, digital signatures use a protocol named HMAC-SHA256 that is in its
    fourth version. One more level of security in digital signature verification is
    that a timestamp is added to the request. If the timestamps of the digital signature
    being generated and being received by the API are different by greater than 15
    minutes, the request is denied.


    ### X.509 Certificates


    When we want two or more web services to talk to each other, we use SOAP-based
    requests. To make these sorts of requests secure, we use X.509 certificates. These
    certificates consist of three parts.


    *   A public key


    *   A private key


    *   Additional metadata


    The first step is to generate the digital signature by using the process that
    we looked at in the previous section. Now, we use this digital signature and the
    certificate to send the request. First, AWS tries to verify that the authenticated
    user is sending the request by decrypting the digital signature and verifying
    it. After that, the certificate that has been sent is matched by AWS with the
    certificate uploaded by the authenticated user in their own AWS account. If everything
    is green, the request is sent forward; otherwise, it’s denied.'
  trans: '

    ### 网络安全


    正如我们在上一节中所见，AWS 已使其数据中心能够抵御灾难。但比这更大的威胁是网络入侵。随着技术的进步，黑客的技能也在提升。那么，AWS 是如何应对其网络安全问题的呢？好吧，让我们来探讨一下
    AWS 为确保其网络安全而采取的一些措施。


    *   有一个防火墙可以保护你的入站和出站流量。这是网络安全最基本但也是最强大的第一步。


    *   AWS 拥有访问控制列表（ACL），其中包含一组策略，用于决定谁可以访问 AWS 的哪些服务，以及哪些信息流向哪个服务。这些 ACL 会定期更新，并通过名为
    ACLManage 的 AWS 工具自动推送。


    *   信息流入 AWS 服务器可能有很多入口点，出口点也是如此。因此，在这种情况下，管理这些入口和出口点会变得非常困难。为了解决这个问题，AWS 采用了安全接入点。通过使用它们，AWS
    只有有限数量的接入点，通过这些接入点对所有进出传输进行全面监控。这些接入点被称为 *API 端点*，并且只允许 HTTPS 访问以建立安全连接。


    *   AWS 通过 Amazon VPC 为其客户提供额外的安全选项。我们在第 1 章中讨论过 VPC。


    *   对于 AWS 来说，有两种类型的客户端。一种是其常规客户，另一种是其自身的企业网络。AWS 在访问 AWS 服务时不会给予其企业网络任何特殊权限。对于
    AWS 员工，如果他们想访问任何 AWS 服务，首先必须提交一个工单，如果获得批准，他们才能获得访问权限。此外，出于安全目的，员工所做的所有操作都会被安全地记录下来。


    *   AWS 拥有许多自动化监控工具，以便监控服务器和网络使用情况，扫描端口的入站和出站传输，检测未经授权的入侵尝试等。


    ## AWS 账户安全功能


    在前面的章节中，我们了解了 AWS 如何确保其基础设施的安全。在本节中，我们将探讨 AWS 如何确保其客户的 AWS 账户安全。AWS 做的第一件事就是使用凭证保护每个账户。AWS
    使用凭证进行身份验证的方式有多种。


    *   密码


    *   加密密钥


    *   数字签名


    *   证书


    *   多因素身份验证


    一旦你为账户创建了凭证，就可以轻松地从安全凭证页面下载凭证报告。报告中包含的信息告诉我们：账户是否使用了密码、密码是否可轮换、密码上次更改时间、密钥上次轮换时间以及是否启用了多因素身份验证。


    在 AWS 中，我们可以创建多个访问密钥并定义多个证书。这样做是为了出于安全原因持续轮换它们。当它们被轮换时，为了不影响业务连续性，我们可以使用并发的密钥和证书。我们可以使用
    AWS IAM 来轮换密钥。我们将在下一节中更详细地了解密钥和证书。


    ### 用于身份验证的密码


    如果你想访问 AWS 服务，密码非常重要。它们授予你在 AWS 内部的第一级访问权限。密码在创建账户时创建，并可以随时通过安全凭证页面更改。AWS 允许密码长度最多为
    128 个字符，并且必须包含特殊字符组合才能足够强大。


    如果你的组织基础设施完全托管在 AWS 上，你可以创建密码策略，以便新密码必须遵循你的安全策略。这确保了创建最强大的密码。


    ### 多因素身份验证


    这是客户可以选择的一种额外安全级别。多因素身份验证要求客户成功输入用户名和密码后，用户还必须提供一个特定的、唯一的六位数代码进行身份验证。如果验证成功，则该人员将被允许进入账户。这个六位数代码会发送到客户的一个经过身份验证的设备上。它可以是智能手机、电子邮件或电话号码。当人员登录时，会收到一个需要输入的代码，然后才能成功登录。


    ### 用于 API 身份验证的访问密钥


    API 是一种功能，通过它向封装在 API 后的一段代码发送请求，然后人员接收输出。现在，API 内部的编码逻辑可能允许用户访问敏感信息。因此，发送给这些
    API 的请求也必须经过身份验证，这意味着只有正确的用户才能获得 API 的访问权限。这是通过*数字签名*完成的。这个数字签名是通过将请求文本和秘密访问密钥传递给负责加密的哈希函数生成的。这个哈希函数对消息进行加密，然后将其发送给
    API。这反过来在 API 端被解密；检查秘密密钥，然后提供入口。


    目前，数字签名使用名为 HMAC-SHA256 的协议，该协议已发展到第四版。数字签名验证中还有一个安全级别，即在请求中添加时间戳。如果生成的数字签名的时间戳与
    API 接收到的时间戳相差超过 15 分钟，则该请求将被拒绝。


    ### X.509 证书


    当我们希望两个或多个 Web 服务相互通信时，我们使用基于 SOAP 的请求。为了使这类请求安全，我们使用 X.509 证书。这些证书由三部分组成。


    *   公钥


    *   私钥


    *   附加元数据


    第一步是使用我们在上一节中看到的过程生成数字签名。现在，我们使用这个数字签名和证书来发送请求。首先，AWS 尝试通过解密数字签名并验证它来确认是经过身份验证的用户在发送请求。之后，AWS
    会将发送过来的证书与经过身份验证的用户在其自己的 AWS 账户中上传的证书进行匹配。如果一切正常，请求将被转发；否则，请求将被拒绝。

