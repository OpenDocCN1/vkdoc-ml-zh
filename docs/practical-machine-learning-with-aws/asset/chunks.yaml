    ### 逻辑回归概述


    逻辑回归是对线性回归的一种转换，其预测范围被限制在 0 到 1 之间。这是通过将线性回归方程传递给 Sigmoid 函数来实现的。因此，线性回归中的直线会转换为一条上限为
    1、下限为 0 的 S 形曲线，如图 6-2 所示。


    ![../images/495447_1_En_6_Chapter/495447_1_En_6_Fig2_HTML.jpg](img/495447_1_En_6_Fig2_HTML.jpg)


    图 6-2


    逻辑回归


    一旦逻辑回归预测出一个值，该值就会被视为二分类场景下的预测概率。默认情况下，如果预测值超过 0.5，则预测为成功类别；否则预测为失败类别。0.5 这个阈值是可自定义的，这样我们就能获得更好的精确率和召回率（将在下一章详细讨论）。用于多分类的逻辑回归被称为*多项逻辑回归*，它不使用
    Sigmoid 函数，而是使用 Softmax 函数。


    ### 线性学习器的 SageMaker 应用


    第一步是从 S3 存储桶中读取数据集，对列进行预处理以去除空值，并应用缩放和编码。我们在前一章已经了解了如何预处理数据集并获取因变量和自变量。因此，本节我们将直接对预处理后的数据集应用算法。我们将定义角色和存储桶，以便
    SageMaker 能够与不同的服务正常通信。


    ```

    import boto3

    from sagemaker import get_execution_role

    bucket = ''slytherins-test''

    prefix = ''linear-learner''

    role = get_execution_role()

    ```


    现在，我们需要决定应用哪种算法，即线性回归还是逻辑回归。我们将从逻辑回归开始。要构建逻辑回归模型，我们需要一个分类列。我们知道目标变量是`Sales`，它是一个数值列；因此，无法应用逻辑回归。所以，我们将`Sales`列划分为四个类别，然后就可以开始应用算法了。


    ```

    y_binned = pd.cut(y[''Item_Outlet_Sales''], 4, labels=[''A'', ''B'', ''C'', ''D''])

    ```


    上述代码将`y`划分为`A`、`B`、`C`和`D`四个类别，每个类别具有相等的范围。输出结果如下所示：


    ![../images/495447_1_En_6_Chapter/495447_1_En_6_Figa_HTML.jpg](img/495447_1_En_6_Figa_HTML.jpg)


    现在，我们有了分类列作为目标变量，我们将对其应用标签编码，以便每个类别可以用一个整数表示。


    ```

    from sklearn.preprocessing import LabelEncoder

    le = LabelEncoder()

    temp = le.fit(y_binned)

    y_final = temp.transform(y_binned)

    ```


    现在，我们已经定义了最终的目标变量并将其存储在`y_final`中，接下来将用它来训练模型。如前一章所述，SageMaker 在 Docker 容器内运行算法，因此数据应存储在
    S3 存储桶中，以便容器能够访问。下一步是将数据存储到 S3 中。对于我们的线性学习器算法，我们将使用一种称为 RecordIO-Protobuf 格式的数据格式。使用这种数据格式有助于缩短训练时间，并且可以在实时数据模式下训练模型（称为*管道模式*）。我们可以使用以下代码将自变量和目标变量转换为
    RecordIO 格式：


    ```

    import io

    import numpy as np

    import sagemaker.amazon.common as smac

    vectors = np.array(X.values, dtype="float32")

    labels = np.array(y_final, dtype="float32")

    buf = io.BytesIO()

    smac.write_numpy_to_dense_tensor(buf, vectors, labels)

    buf.seek(0)

    ```


    上述代码将数据转换为 RecordIO 格式，然后打开临时文件，以便可以直接插入到 S3 中。RecordIO 文件通过将大文件分割成块，然后使用这些块进行分析。该文件有助于我们在
    SageMaker 中创建流式作业，从而加快训练速度。为了发送数据，我们将使用以下代码：


    ```

    key = ''recordio-pb-data''

    boto3.resource(''s3'').Bucket(bucket).Object(os.path.join(prefix, ''train'', key)).upload_fileobj(buf)

    s3_train_data = ''s3://{}/{}/train/{}''.format(bucket, prefix, key)

    print(''uploaded training data location: {}''.format(s3_train_data))

    ```


    这将把数据上传到 S3 并关闭我们创建的缓冲区。现在，基本步骤已经完成。我们只需要建立连接并训练模型。第一步是初始化我们的线性学习器算法 Docker 容器。


    ```

    from sagemaker.amazon.amazon_estimator import get_image_uri

    container = get_image_uri(boto3.Session().region_name, ''linear-learner'')

    ```


    初始化之后，让我们传递线性学习器所需的参数并初始化算法。


    ```

    sess = sagemaker.Session()

    linear = sagemaker.estimator.Estimator(container,

    role,

    train_instance_count=1,

    train_instance_type=''ml.m4.xlarge'',

    output_path=output_location,

    sagemaker_session=sess)

    ```

