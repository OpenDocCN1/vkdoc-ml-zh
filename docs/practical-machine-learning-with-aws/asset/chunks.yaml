  trans: '

    ## 使用 ScriptProcessor 创建自定义预处理代码


    在上一节中，我们使用了 `SkLearnProcessor`，这是 SageMaker 提供的内置容器。但很多时候，我们编写的代码无法仅在 SageMaker
    预定义的容器中执行。为此，我们必须创建自己的容器。在训练机器学习模型时，我们也会探讨如何创建自己的容器。在本节中，我们将创建一个执行与 `SKlearnProcessor`
    容器相同任务的容器。唯一的区别在于它不是预构建的；我们将从头开始构建它。


    要为处理作业使用自定义容器，我们需要使用 SageMaker 提供的名为 `ScriptProcessor` 的类。在向 `ScriptProcessor`
    提供输入之前，首要任务是创建我们的 Docker 容器并将其推送到 ECR。


    ### 创建 Docker 容器


    为此，我们将创建一个名为 `Dockerfile` 的文件（无扩展名）。在该文件中，我们将下载一个最小操作系统的镜像，然后在其内部安装所需的软件包。因此，我们的最小操作系统将基于
    Linux，并在其中安装 Python、Scikit-Learn 和 Pandas。


    ```

    FROM python:3.7-slim-buster

    RUN pip3 install pandas==0.25.3 scikit-learn==0.21.3

    ENV PYTHONUNBUFFERED=TRUE

    ENTRYPOINT ["python3"]

    ```


    上述脚本必须存在于 `Dockerfile` 中。第一行 `FROM python:3.7-slim-buster` 指定了需要从 Docker Hub 下载的最小操作系统。该操作系统仅包含
    Python 3.7 和运行 Python 所需的最小软件包。但是，我们还需要安装其他软件包。因此，我们使用下一行 `RUN pip3 install pandas==0.25.3
    scikit-learn==0.21.3`。这将安装 Pandas、Scikit-Learn、Numpy 以及其他重要的软件包。下一行 `ENV PYTHONUNBUFFERED=TRUE`
    是一条高级指令，它告诉 Python 立即记录日志消息。这有助于调试。最后一行 `ENTRYPOINT ["python3"]` 指定了我们的 `preprocessing.py`
    文件应如何执行。


    ### 构建并推送镜像


    现在我们的 Docker 文件已准备就绪，我们需要构建此镜像，然后将其推送到 Amazon ECR（一个 Docker 镜像仓库服务）。要构建并推送此镜像，需要以下信息：


    *   账户 ID

    *   仓库名称

    *   区域

    *   分配给镜像的标签


    所有这些信息都可以使用以下脚本进行初始化：


    ```

    import boto3

    account_id = boto3.client(''sts'').get_caller_identity().get(''Account'')

    ecr_repository = ''sagemaker-processing-container''

    tag = '':latest''

    region = boto3.session.Session().region_name

    ```


    一旦我们有了这些信息，就可以首先定义 ECR 仓库地址，然后执行一些命令行脚本来启动该过程。


    ```

    processing_repository_uri = ''{}.dkr.ecr.{}.amazonaws.com/{}''.format(account_id,
    region, ecr_repository + tag)

    # 创建 ECR 仓库并推送 Docker 镜像

    ! docker build -t $ecr_repository docker # 构建镜像

    ! $(aws ecr get-login --region $region --registry-ids $account_id --no-include-email)
    # 登录 AWS

    ! aws ecr create-repository --repository-name $ecr_repository # 创建 ECR 仓库

    ! docker tag {ecr_repository + tag} $processing_repository_uri # 为镜像打标签以区别于其他镜像

    ! docker push $processing_repository_uri # 将镜像推送到 ECR

    ```


    如果一切顺利，您的镜像将成功推送到 ECR。您可以前往 ECR 服务并检查仓库。您可以在图 5-17 中看到视图。


    ![../images/495447_1_En_5_Chapter/495447_1_En_5_Fig17_HTML.jpg](img/495447_1_En_5_Fig17_HTML.jpg)


    图 5-17


    镜像已推送到 ECR


    ### 使用 ScriptProcessor 类


    现在我们的镜像已准备就绪，我们可以开始使用 `ScriptProcessor` 类了。我们将在此容器内执行相同的代码 `preprocessing.py`。就像我们在
    `SKLearnProcessor` 中所做的那样，我们将首先创建该类的对象。


    ```

    from sagemaker.processing import ScriptProcessor, ProcessingInput, ProcessingOutput

    from sagemaker import get_execution_role

    role = get_execution_role()

    script_processor = ScriptProcessor(command=[''python3''],

    image_uri=processing_repository_uri,

    role=role,

    instance_count=1,

    instance_type=''ml.m5.xlarge'')

    ```


    创建对象后，我们可以使用它来运行我们的 `preprocessing.py` 文件。


    ```

    input_data = ''s3://slytherins-test/Train.csv''

    script_processor.run(code=''preprocessing.py'',

    inputs=[ProcessingInput(

    source=input_data,

    destination=''/opt/ml/processing/input'')],

    outputs=[ProcessingOutput(source=''/opt/ml/processing/train'', destination=''s3://slytherins-test/''),

    ProcessingOutput(source=''/opt/ml/processing/test'', destination=''s3://slytherins-test/'')])

    ```


    您会发现代码与 `SKLearnProcessor` 的代码几乎相同。它也会产生相同的输出。最后，处理作业完成后，我们可以用同样的方式再次检查输出。


    ```

    preprocessing_job_description = script_processor.jobs[-1].describe()

    output_config = preprocessing_job_description[''ProcessingOutputConfig'']

    for output in output_config[''Outputs'']:

    if output[''OutputName''] == ''output-1'':

    preprocessed_training_data = output[''S3Output''][''S3Uri'']

    if output[''OutputName''] == ''output-2'':

    preprocessed_test_data = output[''S3Output''][''S3Uri'']

    import pandas as pd

    training_features = pd.read_csv(preprocessed_training_data + ''train_features.csv'',
    nrows=10, header=None)

    print(''Training features shape: {}''.format(training_features.shape))

    training_features.head(n=10)

    ```


    您将获得的输出与图 5-16 中显示的相同。


    在本节中，我们了解了如何创建自己的容器并运行处理脚本。这在许多情况下变得很重要。例如，如果我们想对 NLP 任务使用基于 BERT 的预处理，我们将需要为此创建一个容器，因为
    SageMaker 不提供基于 BERT 的服务。在后续章节中创建训练和推理作业时，我们将进一步探索自定义容器。


    在过去的两个部分中，我们一直在 SageMaker 容器内的 Jupyter Notebook 中工作。但大多数时候，尤其是在生产环境中，我们必须在不同的系统中运行代码。为此，我们将不得不使用
    Boto3 API 进行身份验证和执行。在下一节中，我们将了解如何使用 Boto3 运行我们的自定义脚本。


    ## 使用 Boto3 运行处理作业


    如前所述，我们使用 Boto3 包从任何其他计算机（包括您的本地主机）访问 AWS 的服务。因此，在本节中，我们将使用 Boto3 运行我们在上一节中看到的自定义
    Docker 容器脚本。

    '
- fmt: '### Installing Boto3


    The first step for using Boto3 is to install it inside the localhost environment.
    Along with Boto3, we have to install `awscli`, which will help us in authentication
    with AWS and `s3fs`, which in turn will help us in talking with the S3 bucket.
    To install it, we will be using `pip`, as shown here:


    ```

    pip install boto3

    pip install awscli

    pip install s3fs

    ```


    Once the installation finishes, we need to configure the credentials of AWS. For
    this, we will run the following command:


    ```

    aws configure

    ```


    This will ask you for the following four inputs:


    - AWS access key

    - AWS secret access key

    - Default region name

    - Default output format


    Once we provide this information, we can easily use Boto3 to connect with the
    AWS services. I have already shown you how to get the access key and secret access
    key when creating the IAM roles. The default region name will be `us-east-2`,
    but you can recheck this by looking at the top-right corner of your AWS management
    console. It will tell you the location. As you can see in Figure [5-18](#495447_1_En_5_Chapter.xhtml#Fig18),
    I have passed in the required information.


    ![../images/495447_1_En_5_Chapter/495447_1_En_5_Fig18_HTML.jpg](images/495447_1_En_5_Chapter/495447_1_En_5_Fig18_HTML.jpg)


    Figure 5-18 Setting AWS credentials


    Once this part is done, we can start our Jupyter Notebook (local system notebook)
    and create a notebook using the same environment inside which we have installed
    all the packages and configured AWS.


    ### Initializing Boto3


    Inside the notebook, the first step will be to initialize Boto3. For this we will
    use the following script:


    ```

    import boto3

    import s3fs

    region = boto3.session.Session().region_name

    client = boto3.client(''sagemaker'')

    ```


    In the previous step, the region was set up by you. The same region will be extracted
    and stored inside the variable `region`. Next is to set up Boto3. Boto3 can be
    set up for all the services of AWS. Currently, we will be using SageMaker; hence,
    we will call the class `client` of Boto3 and initialize it with SageMaker (`client
    = boto3.client(''sagemaker'')`).


    ### Making Dockerfile Changes and Pushing the Image


    Now, we will use the Boto3 API to call the processing job method. This will create
    the same processing job that we saw in the previous section. But, minor changes
    will be required, and we will explore them one by one.


    We will use the method `create_processing_job` to run the data processing job.
    To learn more about this method, or all the methods related to SageMaker provided
    by Boto3, you can visit [`https://boto3.amazonaws.com/v1/documentation/api/latest/reference/services/sagemaker.html`](https://boto3.amazonaws.com/v1/documentation/api/latest/reference/services/sagemaker.html).


    But, before that, we have to make some changes in our Docker container and our
    processing Python file. For the Docker container, we will need to copy our `preprocessing.py`
    script inside it so that the Boto3 method can run the script directly. For this
    we will make the following changes to our Dockerfile:


    ```

    FROM python:3.7-slim-buster

    RUN pip3 install pandas==0.25.3 scikit-learn==0.21.3

    ENV PYTHONUNBUFFERED=TRUE

    ENV PATH="/opt/ml/code:${PATH}"

    COPY preprocessing.py /opt/ml/code/preprocessing.py

    WORKDIR /opt/ml/code

    ```


    We have added three new lines to our existing Dockerfile. The line `ENV PATH="/opt/ml/code:${PATH}"`
    sets up the environment path to `/opt/ml/code`. We will be placing our script,
    `preprocessing.py`, inside it with `COPY preprocessing.py /opt/ml/code/preprocessing.py`.
    Finally, we will be making our working directory the same folder: `WORKDIR /opt/ml/code`.
    This is required so that the Docker container will know where the script file
    is present, and it will help in its execution.


    Once we have made changes in the Dockerfile, we will make changes to the script
    that builds the image and pushes it to the ECR. The only change that we need to
    do is add a line that gives the permission to the container to play with the `preprocessing.py`
    script. Otherwise, Docker may not have the permission to open and look at its
    contents.


    ```

    # Create ECR repository and push docker image

    ! chmod +x docker/preprocessing.py # This line gives read and write access to
    the preprocessing script

    ! docker build -t $ecr_repository docker # This builds the image

    ! $(aws ecr get-login --region $region --registry-ids $account_id --no-include-email)
    # Logs in to AWS

    ! aws ecr create-repository --repository-name $ecr_repository # Creates ECR Repository

    ! docker tag {ecr_repository + tag} $processing_repository_uri # Tags the image
    to differentiate it from other images

    ! docker push $processing_repository_uri # Pushes image to ECR

    ```


    Once this step is done, we will be ready to run our Boto3 processing job.'
  raw: '### Installing Boto3


    The first step for using Boto3 is to install it inside the localhost environment.
    Along with Boto3, we have to install `awscli`, which will help us in authentication
    with AWS and s3fs, which in turn will help us in talking with the S3 bucket. To
    install it, we will be using `pip`, as shown here:


    ```

    pip install boto3

    pip install awscli

    pip install s3fs

    ```


    Once the installation finishes, we need to configure the credentials of AWS. For
    this, we will run the following command:


    ```

    aws configure

    ```


    This will ask you for the following four inputs:


    *   AWS access key


    *   AWS secret access key


    *   Default region name


    *   Default output format


    Once we provide this information, we can easily use Boto3 to connect with the
    AWS services. I have already shown you how to get the access key and secret access
    key when creating the IAM roles. The default region name will be us-east-2, but
    you can recheck this by looking at the top-right corner of your AWS management
    console. It will tell you the location. As you can see in Figure [5-18](#495447_1_En_5_Chapter.xhtml#Fig18),
    I have passed in the required information.


    ![../images/495447_1_En_5_Chapter/495447_1_En_5_Fig18_HTML.jpg](images/495447_1_En_5_Chapter/495447_1_En_5_Fig18_HTML.jpg)


    Figure 5-18


    Setting AWS credentials


    Once this part is done, we can start our Jupyter Notebook (local system notebook)
    and create a notebook using the same environment inside which we have installed
    all the packages and configured AWS.


    ### Initializing Boto3


    Inside the notebook, the first step will be to initialize Boto3\. For this we
    will use the following script:


    ```

    import boto3

    import s3fs

    region = boto3.session.Session().region_name

    client = boto3.client(''sagemaker'')

    ```


    In the previous step, the region was set up by you. The same region will be extracted
    and stored inside the variable region. Next is to set up Boto3\. Boto3 can be
    set up for all the services of AWS. Currently, we will be using SageMaker; hence,
    we will call the class client of Boto3 and initialize it with SageMaker (`client
    = boto3.client(''sagemaker'')`).


    ### Making Dockerfile Changes and Pushing the Image


    Now, we will use the Boto3 API to call the processing job method. This will create
    the same processing job that we saw in the previous section. But, minor changes
    will be required, and we will explore them one by one.


    We will use the method `create_processing_job` to run the data processing job.
    To learn more about this method, or all the methods related to SageMaker provided
    by Boto3, you can visit [`https://boto3.amazonaws.com/v1/documentation/api/latest/reference/services/sagemaker.html`](https://boto3.amazonaws.com/v1/documentation/api/latest/reference/services/sagemaker.html).


    But, before that, we have to make some changes in our Docker container and our
    processing Python file. For the Docker container, we will need to copy our `preprocessing.py`
    script inside it so that the Boto3 method can run the script directly. For this
    we will make the following changes to our Dockerfile:


    ```

    FROM python:3.7-slim-buster

    RUN pip3 install pandas==0.25.3 scikit-learn==0.21.3

    ENV PYTHONUNBUFFERED=TRUE

    ENV PATH="/opt/ml/code:${PATH}"

    COPY preprocessing.py /opt/ml/code/preprocessing.py

    WORKDIR /opt/ml/code

    ```


    We have added three new lines to our existing Dockerfile. The line `ENV PATH="/opt/ml/code:${PATH}"`
    sets up the environment path to `/opt/ml/code`. We will be placing our script,
    `preprocessing.py`, inside it with `COPY preprocessing.py /opt/ml/code/preprocessing.py`.
    Finally, we will be making our working directory the same folder: `WORKDIR /opt/ml/code`.
    This is required so that the Docker container will know where the script file
    is present, and it will help in its execution.


    Once we have made changes in the Dockerfile, we will make changes to the script
    that builds the image and pushes it to the ECR. The only change that we need to
