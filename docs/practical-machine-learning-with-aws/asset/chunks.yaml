- fmt: "### Setting Up the Dockerfile\n\nNow that all our script files are ready,\
    \ we have to create a Docker image so that it can be uploaded to ECR and then\
    \ SageMaker can access the code present in it and run it in an EC2 instance attached.\
    \ Let’s first see how to give a structure to the files that we created. Figure\
    \ [8-2](#495447_1_En_8_Chapter.xhtml#Fig2) depicts the structure that we should\
    \ give to the directory, before creating the image.\n\n![../images/495447_1_En_8_Chapter/495447_1_En_8_Fig2_HTML.jpg](images/495447_1_En_8_Chapter/495447_1_En_8_Fig2_HTML.jpg)\n\
    \nFigure 8-2\n\nDirectory structure\n\nWe have already created all the files that\
    \ are present in the `Data` directory. Now, we have to create a `Dockerfile` script,\
    \ which will be run to build the image. Then we will use the `build_and_push.sh`\
    \ file to push the image to ECR.\n\nThese are the steps that we will follow in\
    \ the `Dockerfile`:\n\n1.  Download an image from DockerHub that will have our\
    \ operating system. We will download a minimal version of Ubuntu so that our code\
    \ can run inside it. For this, we will use the following script:\n\n1.  Name the\
    \ person, or the organization, who is maintaining and creating this image. I have\
    \ given my name here. You can use any name you’d like.\n\n```\nFROM ubuntu:16.04\n\
    ```\n\n1.  Run some Ubuntu commands so that we can set up the Python environment\
    \ and update the operating system files. We will also download the server files\
    \ that will be used to run the inference endpoints. You must be familiar with\
    \ Linux commands to understand the script.\n\n    ```\n    RUN apt-get -y update\
    \ && apt-get install -y --no-install-recommends \\\n    wget \\\n    python \\\
    \n    nginx \\\n    ca-certificates \\\n    && rm -rf /var/lib/apt/lists/*\n \
    \   ```\n\n2.  Once the setup is done, we can use `pip` from Python to install\
    \ the important Python packages.\n\n    ```\n    RUN wget https://bootstrap.pypa.io/get-pip.py\
    \ && python get-pip.py && \\\n    pip install numpy==1.16.2 scipy==1.2.1 scikit-learn==0.20.2\
    \ pandas flask gevent gunicorn && \\\n    (cd /usr/local/lib/python2.7/dist-packages/scipy/.libs;\
    \ rm *; ln ../../numpy/.libs/* .) && \\\n    rm -rf /root/.cache\n    ```\n\n\
    3.  Set the environment variables so that Python knows what the default folder\
    \ is that will contain the code. Also, we will set some features of Python. We\
    \ first make sure that timely log messages should be received from the container,\
    \ and then we make sure that once any module is imported in Python, its `.pyc`\
    \ file is not created. This is done using the variables `pythonunbuffered` and\
    \ `pythondontwritebytecode`, respectively.\n\n    ```\n    ENV PYTHONUNBUFFERED=TRUE\n\
    \    ENV PYTHONDONTWRITEBYTECODE=TRUE\n    ENV PATH=\"/opt/program:${PATH}\"\n\
    \    ```\n\n4.  Finally, the instance will instruct to copy our `Data` directory\
    \ files to the default work directory, and then we will change the default work\
    \ directory.\n\n    ```\n    COPY Data /opt/program\n    WORKDIR /opt/program\n\
    \    ```\n\n```\nMAINTAINER Himanshu Singh\n```\n\nThis finishes our `Dockerfile`\
    \ creation. Here is the entire code:\n\n```\nFROM ubuntu:16.04\nMAINTAINER Himanshu\
    \ Singh\nRUN apt-get -y update && apt-get install -y --no-install-recommends \\\
    \nwget \\\npython \\\nnginx \\\nca-certificates \\\n&& rm -rf /var/lib/apt/lists/*\n\
    RUN wget https://bootstrap.pypa.io/get-pip.py && python get-pip.py && \\\npip\
    \ install numpy==1.16.2 scipy==1.2.1 scikit-learn==0.20.2 pandas flask gevent\
    \ gunicorn && \\\n(cd /usr/local/lib/python2.7/dist-packages/scipy/.libs; rm *;\
    \ ln ../../numpy/.libs/* .) && \\\nrm -rf /root/.cache\nENV PYTHONUNBUFFERED=TRUE\n\
    ENV PYTHONDONTWRITEBYTECODE=TRUE\nENV PATH=\"/opt/program:${PATH}\"\nCOPY Data\
    \ /opt/program\nWORKDIR /opt/program\n```\n\nNow, let’s look at the script that\
    \ we will use to push this image to ECR.\n\n### Pushing the Docker Image to ECR\n\
    \nWe will create a shell script file, which will be used first to build the image\
    \ from the `Dockerfile` that we created in the previous section and then to push\
    \ the image to ECR. Let’s look at the step-by-step procedure for this:\n\n1. \
    \ Name the image. We will save the name in a variable.\n\n1.  Give full read and\
    \ write permission to the train and serve files so that once the container is\
    \ started, there are no access denied errors.\n\n    ```\n    chmod +x Data/train\n\
    \    chmod +x Data/serve\n    ```\n\n2.  Get AWS configurations so that there\
    \ is no stoppage when the image is being pushed. We will define the account and\
    \ the region of our AWS. Remember, since we will be running this code from inside\
    \ SageMaker, the information can be automatically fetched. If we are running this\
    \ from your local system or anywhere outside of AWS, then we will have to give\
    \ the custom values.\n\n    ```\n    account=$(aws sts get-caller-identity --query\
    \ Account --output text)\n    region=$(aws configure get region)\n    region=${region:-us-east-2}\n\
    \    ```\n\n3.  Give the path and name to the container. We will use the same\
    \ name that was given in the first step. We will use this path later to push the\
    \ image.\n\n    ```\n    fullname=\"${account}.dkr.ecr.${region}.amazonaws.com/${algorithm_name}:latest\"\
    \n    ```\n\n4.  Check whether the image already exists. If it doesn’t, then a\
    \ new image will be created; otherwise, the same image will be updated.\n\n  \
    \  ```\n    aws ecr describe-repositories --repository-names \"${algorithm_name}\"\
    \ > /dev/null 2>&1\n    if [ $? -ne 0 ]\n    then\n    aws ecr create-repository\
    \ --repository-name \"${algorithm_name}\" > /dev/null\n    fi\n    ```\n\n5. \
    \ Get the login credentials of the AWS account.\n\n```\nalgorithm_name=sagemaker-random-forest\n\
    ```\n\n1.  Build the image with the name already decided, rename it with the full\
    \ name we decided on that contains the ECR address, and then finally push the\
    \ code.\n\n    ```\n    docker build  -t ${algorithm_name} .\n    docker tag ${algorithm_name}\
    \ ${fullname}\n    docker push ${fullname}\n    ```\n\n```\n$(aws ecr get-login\
    \ --region ${region} --no-include-email)\n```\n\nThe following is the entire script\
    \ that should be saved in the file `build_and_push.sh`.\n\n```\nalgorithm_name=sagemaker-random-forest\n\
    chmod +x Container/train\nchmod +x Container/serve\naccount=$(aws sts get-caller-identity\
    \ --query Account --output text)\nregion=$(aws configure get region)\nregion=${region:-us-east-2}\n\
    fullname=\"${account}.dkr.ecr.${region}.amazonaws.com/${algorithm_name}:latest\"\
    \naws ecr describe-repositories --repository-names \"${algorithm_name}\" > /dev/null\
    \ 2>&1\nif [ $? -ne 0 ]\nthen\naws ecr create-repository --repository-name \"\
    ${algorithm_name}\" > /dev/null\nfi\n$(aws ecr get-login --region ${region} --no-include-email)\n\
    docker build  -t ${algorithm_name} .\ndocker tag ${algorithm_name} ${fullname}\n\
    docker push ${fullname}\n```\n\nOnce this step is done, we have to go to the terminal,\
    \ go inside the directory where your `Dockerfile` is present, and then type the\
    \ following:\n\n```\nsh build_and_push.sh\n```\n\nThis will start running the\
    \ script and will successfully upload the image to ECR. You can then go to ECR\
    \ and check whether the image exists. Figure [8-3](#495447_1_En_8_Chapter.xhtml#Fig3)\
    \ shows our image in ECR.\n\n![../images/495447_1_En_8_Chapter/495447_1_En_8_Fig3_HTML.jpg](images/495447_1_En_8_Chapter/495447_1_En_8_Fig3_HTML.jpg)\n\
    \nFigure 8-3\n\nContainer image in ECR\n\nThis finishes the process of creating\
    \ the Docker. Now we will see in the next section how we can use this image to\
    \ train the model in a SageMaker notebook."
