- fmt: '### Creating a New IAM Role for Step Functions


    Once we are done with enabling the instance to execute a Step Functions job, we
    need to create an execution role so that Step Functions is able to execute the
    jobs that are created. For this, again we need to go to the IAM console and create
    this role.


    Go to the IAM console, go to the Roles section, and then click “Create role.”
    See Figure [9-4](#495447_1_En_9_Chapter.xhtml#Fig4).


    ![../images/495447_1_En_9_Chapter/495447_1_En_9_Fig4_HTML.jpg](images/495447_1_En_9_Chapter/495447_1_En_9_Fig4_HTML.jpg)


    Figure 9-4


    Creating roles


    Select the Step Functions service. You may need to search for the service. See
    Figure [9-5](#495447_1_En_9_Chapter.xhtml#Fig5).


    ![../images/495447_1_En_9_Chapter/495447_1_En_9_Fig5_HTML.jpg](images/495447_1_En_9_Chapter/495447_1_En_9_Fig5_HTML.jpg)


    Figure 9-5


    Selecting the Step Functions service


    Now, continue the process and keep clicking Next until you arrive at the section
    where you need to provide the role name. Give any role name you want and then
    click “Create role.” Next, once we have created the role, we need to attach a
    policy to it. Here we will list all the services that the Step Functions service
    is allowed to do. We provide this list in JSON format.


    Click the role that you have just created, and then in the Permissions section
    click “Add inline policy.” See Figure [9-6](#495447_1_En_9_Chapter.xhtml#Fig6).


    ![../images/495447_1_En_9_Chapter/495447_1_En_9_Fig6_HTML.jpg](images/495447_1_En_9_Chapter/495447_1_En_9_Fig6_HTML.jpg)


    Figure 9-6


    Adding inline policies


    Here, you need to add a JSON file on the JSON tab. The file contents are shown
    here:


    ```

    {

    "Version": "2012-10-17",

    "Statement": [

    {

    "Effect": "Allow",

    "Action": [

    "sagemaker:CreateTransformJob",

    "sagemaker:DescribeTransformJob",

    "sagemaker:StopTransformJob",

    "sagemaker:CreateTrainingJob",

    "sagemaker:DescribeTrainingJob",

    "sagemaker:StopTrainingJob",

    "sagemaker:CreateHyperParameterTuningJob",

    "sagemaker:DescribeHyperParameterTuningJob",

    "sagemaker:StopHyperParameterTuningJob",

    "sagemaker:CreateModel",

    "sagemaker:CreateEndpointConfig",

    "sagemaker:CreateEndpoint",

    "sagemaker:DeleteEndpointConfig",

    "sagemaker:DeleteEndpoint",

    "sagemaker:UpdateEndpoint",

    "sagemaker:ListTags",

    "lambda:InvokeFunction",

    "sqs:SendMessage",

    "sns:Publish",

    "ecs:RunTask",

    "ecs:StopTask",

    "ecs:DescribeTasks",

    "dynamodb:GetItem",

    "dynamodb:PutItem",

    "dynamodb:UpdateItem",

    "dynamodb:DeleteItem",

    "batch:SubmitJob",

    "batch:DescribeJobs",

    "batch:TerminateJob",

    "glue:StartJobRun",

    "glue:GetJobRun",

    "glue:GetJobRuns",

    "glue:BatchStopJobRun "

    ],

    "Resource": "*"

    },

    {

    "Effect": "Allow",

    "Action": [

    "iam:PassRole"

    ],

    "Resource": "*",

    "Condition": {

    "StringEquals": {

    "iam:PassedToService": "sagemaker.amazonaws.com"

    }

    }

    },

    {

    "Effect": "Allow",

    "Action": [

    "events:PutTargets",

    "events:PutRule",

    "events:DescribeRule"

    ],

    "Resource": [

    "arn:aws:events:*:*:rule/StepFunctionsGetEventsForSageMakerTrainingJobsRule",

    "arn:aws:events:*:*:rule/StepFunctionsGetEventsForSageMakerTransformJobsRule",

    "arn:aws:events:*:*:rule/StepFunctionsGetEventsForSageMakerTuningJobsRule",

    "arn:aws:events:*:*:rule/StepFunctionsGetEventsForECSTaskRule",

    "arn:aws:events:*:*:rule/StepFunctionsGetEventsForBatchJobsRule"

    ]

    }

    ]

    }

    ```


    Once that’s done, you can review the policy, give it a name, and then create the
    policy. Don’t forget to copy the ARN number of the policy you just created. This
    will help you when creating code in SageMaker.


    ## Setting Up the Training Step


    In the previous section, we completed all the necessary configuration steps to
    run our code to create a pipeline. In this section, we will create the first step:
    `TrainingStep`. The first thing that we will do is to create a dictionary that
    will auto-initialize the training job name, the model name, and the endpoint name.
    We can do so using the following code:


    ```

    names = {

    ''JobName'': str,

    ''ModelName'': str,

    ''EndpointName'': str

    }

    execution_input = ExecutionInput(schema=names)

    ```


    Next, we will create a training step by using the XGBoost container that we already
    learned about in the previous chapters. The first step will be to initialize the
    container.


    ```

    tree = sage.estimator.Estimator(image,

    sagemaker_execution_role, 1, ''ml.m4.xlarge'',

    output_path="s3://{}/output".format("slytherins-test"),

    sagemaker_session=sess)

    ```


    Next, we need to create the training step. This is done by providing the path
    to the input training and validation data.


    ```

    training_step = steps.TrainingStep(

    ''Train Step'',

    estimator=tree,

    data={

    ''train'': sagemaker.s3_input("s3://slytherins-test/Train.csv", content_type=''text/csv''),

    ''validation'': sagemaker.s3_input("s3://slytherins-test/test_data.csv", content_type=''text/csv'')

    },

    job_name=execution_input[''JobName'']

    )

    ```


    Remember, this will not execute the model. Only a step is created here. First,
    we will create all the steps and then combine them and run them sequentially.
    Let’s now decide on the step for saving the model. Once in the pipeline, the previous
    training is finished, and the model artifacts that are generated should be saved.
    That is done using the following code:


    ```

    model_step = steps.ModelStep(

    ''Save model'',

    model=training_step.get_expected_model(),

    model_name=execution_input[''ModelName'']

    )

    ```


    The next step after the model is created is to define the configuration of the
    endpoint. Let’s see that in the next section.


    ## Setting Up the Endpoint Configuration Step


    In this step, we will define what kind of resources are required to deploy the
    endpoint. We have already seen how an endpoint is deployed, so the step that we
    will create here will be self-explanatory.


    ```

    endpoint_config_step = steps.EndpointConfigStep(

    "Create Endpoint Config",

    endpoint_config_name=execution_input[''ModelName''],

    model_name=execution_input[''ModelName''],

    initial_instance_count=1,

    instance_type=''ml.m4.xlarge''

    )

    ```


    Once our configuration is done, we will create the step that will actually deploy
    the endpoint. Let’s see that in the next section.


    ## Setting Up the Endpoint Step


    The following code creates a step that is used for the endpoint deployment:


    ```

    endpoint_step = steps.EndpointStep(

    "Create Endpoint",

    endpoint_name=execution_input[''EndpointName''],

    endpoint_config_name=execution_input[''ModelName'']

    )

    ```


    Once the endpoint is deployed, we can start the inference as we saw in the previous
    sections. Now that we have successfully created all the steps, let’s join them
    together and create a sequence in the next section.


    ## Creating a Chain of the Steps


    To create a chain, we will start with the training step, then move on to the model
    saving step, then configure the endpoint, and finally deploy the model on the
    endpoint configured. We can create this chain using the following code:


    ```

    workflow_definition = steps.Chain([

    training_step,

    model_step,

    endpoint_config_step,

    endpoint_step

    ])

    ```'
