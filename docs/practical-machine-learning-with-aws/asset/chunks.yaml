- fmt: '# AWS Identity and Access Management


    Just like we have the Amazon Management Console to access all the AWS services,
    similarly for all the security requirements we have AWS Identity and Access Management.
    All authentication or authorization can be managed from IAM. We can make users,
    define roles, give permissions, assign policies, and do a lot of other things,
    all from IAM. Hence, this is a service that everyone who is using AWS, either
    for machine learning or for web development, must know about.


    The first thing that a person looking to use AWS services has to do is to create
    a root user account. This account can be accessed through a username and password,
    and it gives the users indefinite access to all the services that it has been
    registered to. But, AWS discourages us from always logging in using the root user
    account as it can compromise the security of the organization. That’s why, instead
    of using the root user, we can create different users using the IAM service. These
    are called IAM users. The admin can give permissions to all these users, ask them
    for their own passwords, assign different policies, and hence make the entire
    infrastructure simple yet secure.


    To understand this in a much better way, let’s look at an example. Suppose there
    is an organization with 5,000 employees. There will be a board of directors, CEO,
    CTO, presidents, managers, architects, engineers, and other employees. First,
    we cannot give everyone root access, which should not require any explanation.
    So, the organization can create IAM users. But, the permissions given to the top-level
    management will be different from the permissions to the employees lower in the
    hierarchy. Even in the top management, maybe the people on the board of directors
    have only read-only access to specific services that have dashboards or visualization
    supports (for example Splunk Dashboard), but a CTO has a kind of root access.
    Similarly, the engineers will have access to the services that they have been
    hired for. Machine learning engineers may have access to SageMaker, data engineers
    may have access to EMR or DynamoDB, and so on. Hence, we can conclude with this
    example that different users require different permissions, and all of this can
    be done using AWS IAM.


    Once an IAM user is defined, it will have its own password. Once the person logs
    in, the user will see only those services they have permission to use. Other services
    will ask for credentials or deny the access. Note that an IAM user may not be
    an actual person. It could be a software service. For example, say a company has
    made a website hosted on a different platform, but uses certain AWS services like
    S3 or DynamoDB. Hence, the website should continuously be talking to these services.
    To authenticate that the right software talks to the AWS services, an IAM user
    is made for these services, and the website accesses the respective services with
    its own credentials.


    But, organizations do already have their own infrastructure, and each employee
    from any hierarchy of management has an email ID and password. When the employee
    has to use AWS, they will have a new ID and password. That means the person will
    have to remember and secure two accounts: the corporate account and the AWS account.
    Wouldn’t it be awesome if AWS provided a way so that an employee just needs to
    log in to the corporate account and automatically get logged in to the AWS account?
    AWS does have a solution for this called federated users.


    ## Federation of Users in AWS


    If an employee has an account in the corporate network and a corporation has an
    account in the AWS network, then once the employee logs in to the corporate network,
    the user identity can be federated by the organization to the AWS network. This
    way, it eases the login hassles for corporate employees inside AWS. See Figure
    [3-2](#495447_1_En_3_Chapter.xhtml#Fig2).


    ![../images/495447_1_En_3_Chapter/495447_1_En_3_Fig2_HTML.jpg](images/495447_1_En_3_Chapter/495447_1_En_3_Fig2_HTML.jpg)


    Figure 3-2


    Federation of users


    The following are some features of federation:


    - Corporate networks use single sign-on (SSO) that makes the federation possible.
    After this, the automated login happens, and the employee reaches the Amazon Management
    Console without having to log in again.

    - Even if a person has accounts in platforms such as Gmail, Facebook, Amazon,
    etc., they can be used for SSO.'
