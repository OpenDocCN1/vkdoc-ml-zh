  trans: "\n### 强化学习\n\n强化学习是机器学习中一个独特的领域，机器通过分析不同的场景来自主学习。其实现方式是：每当机器成功完成一项任务，就给予奖励；如果任务失败，则给予惩罚。机器的目标是获得尽可能多的奖励。通过这种模式，机器能够自动学习在不同场景下如何运作。让我们来看一个例子。\n\
    \n一个机器人想要学习走路。首先，提供给它的环境是一条平坦的道路。每成功迈出一步，可能获得 50 个奖励点，但每摔倒一次，就会被扣除 100 个惩罚点。机器人迈出第一步并摔倒，因此受到了惩罚。它重复尝试多次，并不断摔倒。最终，它迈出一步并且没有摔倒，因此获得了奖励点。这一次，机器人知道了自己做了什么才获得了第一次奖励。现在，它会努力避免每次摔倒，以便获得最大数量的奖励。一旦它训练好自己学会走路，就可以改变环境，并引入多种障碍物。机器人将再次开始探索不同的选项以获取最大奖励。这就是强化学习的过程。\n\
    \n在强化学习中，有两种方法的结合：探索和利用。*探索*意味着机器人应该查看环境中的多种选项，以便学习所有存在的困难。*利用*意味着无论机器人做什么，它都必须持续获得最大数量的奖励点。机器人通过探索并最大化奖励点，从而学会如何在困难情况下运作。强化学习超出了本书的讨论范围，但我们将在本书中详细介绍机器学习的其他方面。\n\
    \n图 4-3 展示了强化学习的过程。\n\n![../images/495447_1_En_4_Chapter/495447_1_En_4_Fig3_HTML.jpg](img/495447_1_En_4_Fig3_HTML.jpg)\n\
    \n图 4-3\n\n强化学习\n\n还有一种机器学习类型需要专门讨论：深度学习。\n\n## 深度学习\n\n我们人类究竟是如何思考的？我们是如何做决定的？显然，大脑是负责的，但它并不完全负责决策。大脑只有在接收到某些信息时才会运作，但要让这些信息到达大脑，还需要其他一些非常微小但重要的组件。这些组件被称为*神经元*。它们是首先接收信息的单元，然后通过一系列神经元，这些信息被传递到大脑，大脑再据此做出决策。这个神经元链被称为*神经网络*或*生物神经网络*。图\
    \ 4-4 展示了一个简单的生物神经元及其组成部分。\n\n![../images/495447_1_En_4_Chapter/495447_1_En_4_Fig4_HTML.jpg](img/495447_1_En_4_Fig4_HTML.jpg)\n\
    \n图 4-4\n\n生物神经元\n\n数学和计算机专家们研究是否有可能模仿这种接收信息然后做出决策的人类行为。这项研究催生了人工神经网络领域，它是深度学习的主要组成部分。这些神经网络的工作方式与生物神经网络类似。它们接收信息，然后通过一系列数学方程，如前向传播和反向传播、梯度下降、激活函数等，做出决策。我们将在本书后面讨论这些内容。\n\
    \n图 4-5 展示了一个人工神经网络，它由隐藏层中的多个人工神经元组成。\n\n![../images/495447_1_En_4_Chapter/495447_1_En_4_Fig5_HTML.jpg](img/495447_1_En_4_Fig5_HTML.jpg)\n\
    \n图 4-5\n\n人工神经网络\n\n现在我们已经对机器学习有了一个总体介绍，接下来让我们探索 AWS 中帮助用户构建机器学习模型的不同服务。\n\n\
    ## AWS 中的机器学习\n\n在本节中，我们将讨论以下 AWS 服务：\n\n*   Amazon SageMaker\n\n*   Amazon Comprehend\n\
    \n*   Amazon Polly\n\n*   Amazon Rekognition\n\n*   Amazon Ground Truth\n\n* \
    \  Amazon Textract\n\n*   Amazon Translate\n\n*   Amazon Transcribe\n\n*   Amazon\
    \ Lex\n\n让我们从探索第一个也是最重要的服务开始：Amazon SageMaker。\n\n## Amazon SageMaker\n\nAmazon\
    \ SageMaker 是跨行业使用的最重要的服务之一。因此，它是本书所有章节的基础，理解该服务至关重要，所以与亚马逊的其他机器学习服务相比，我将对其进行详细解释。\n\
    \n机器学习不仅仅是构建模型；事实上，根据我的经验，与特征工程、数据准备或模型服务相比，花在模型构建上的时间是最少的。SageMaker 通过提供可用于准备数据、构建模型、测试模型并将其部署到生产环境的服务，大大简化了数据科学家的工作。它提供了构建机器学习模型所需的大多数常用算法，如果您想制作任何\
    \ SageMaker 不支持的定制模型，它还可以通过使用自带容器服务来实现。它还提供了分布式训练选项，与单节点运行相比，可以使您的模型运行得更快。\n\n\
    Amazon SageMaker 具有以下功能：\n\n*   **SageMaker Studio**\n\n    这是一个可以构建、训练、验证、处理和部署模型的应用程序。它是一个可以完成所有操作的一站式平台。\n\
    \n*   **SageMaker Ground Truth**\n\n    用于创建带标签的数据集。\n\n*   **Studio Notebooks**\n\
    \n    这是 SageMaker 的最新功能之一，包括单点登录功能、更快的启动时间和一键文件共享。\n\n*   **预处理**\n\n    用于分析和探索数据。它执行特征工程和数据转换，以及为机器学习准备数据所需的所有其他工作。\n\
    \n*   **调试器**\n\n    具有不同的调试用途，例如跟踪在模型训练期间值不断变化的超参数。如果参数或数据出现异常，它甚至可以发出警报。\n\n\
    *   **自动驾驶**\n\n    如果您希望 SageMaker 处理您的模型构建（无论是回归问题还是分类问题），而无需编写一行代码，那么自动驾驶功能就是您要使用的功能。它通常适用于编码经验较少的用户。\n\
    \n*   **强化学习**\n\n    提供了一个运行强化学习算法的接口，该算法基于奖励和惩罚架构运行。\n\n*   **批量转换**\n\n   \
    \ 构建模型后，如果您想对数据子集进行预测或预处理数据子集，可以使用 SageMaker 的批量转换功能。\n\n*   **模型监控**\n\n    用于检查模型质量是保持稳定还是偏离标准模型。\n\
    \n![../images/495447_1_En_4_Chapter/495447_1_En_4_Fig6_HTML.jpg](img/495447_1_En_4_Fig6_HTML.jpg)\n\
    \n图 4-6\n\nSageMaker 流程\n"
- fmt: "### Understanding How SageMaker Works\n\nFigure [4-6](#495447_1_En_4_Chapter.xhtml#Fig6)\
    \ shows the stepwise process of how SageMaker works.\n\nThis diagram is valid\
    \ not only for SageMaker, but for any machine learning models that we make. They\
    \ all undergo the same process. These are the main steps that the process follows:\n\
    \n1. **Fetch data**\n\n   This is the first step for building any machine learning\
    \ model. Once we have decided on the problem statement that we have to solve,\
    \ we have to accumulate all the data related to it. The data can be in the format\
    \ of a database table, Excel sheets, text files, Word documents, images, etc.\
    \ Once we know about all the data sources, these files need to be put inside a\
    \ single repository so that the model knows about the location.\n\n2. **Clean\
    \ the data**\n\n   Our data can have null values, outliers, misspelled words,\
    \ corrupted files, etc. All these things need to be explored and sorted out before\
    \ the data is being given to the model. There are a lot of statistical methods\
    \ as well that are used for data cleaning.\n\n3. **Prepare data**\n\n   Once we\
    \ have made our data clean, it is time to prepare our data. This includes all\
    \ the transformations done on the data, scaling and normalization processes, combination\
    \ of features or splitting of features, etc. After all these things are done,\
    \ it has to be stored at a specific place so that the model knows the reference\
    \ to the clean and prepared data files.\n\n   The first three steps that we have\
    \ seen, all these things can be done inside the SageMaker Jupyter Notebook, and\
    \ after that, the cleaned data can be stored inside an S3 bucket.\n\n4. **Train\
    \ the model**\n\n   Once the data is prepared, we need to train the model. The\
    \ first thing is to select the model that needs to be applied. The models can\
    \ be chosen from the list of built-in algorithms that SageMaker provides, or custom\
    \ models can also be used by making your own containers and uploading them to\
    \ AWS or buying them from the AWS marketplace.\n\n   Also, for training the model,\
    \ we must decide on what kind of computation is required. Selection can be made\
    \ based on the RAM size or number of GPU counts, etc. It is decided based on how\
    \ big the dataset is or how complex the model is.\n\n5. **Evaluate the trained\
    \ model**\n\n   Once the model is successfully trained on the dataset, it needs\
    \ to be evaluated before deploying it for production. For this, multiple metrics\
    \ can be used. For regression models, RMSE scores can be used, while for classification\
    \ models precision and recall can be used. Once the metric crosses the decided\
    \ threshold, only then can it be moved toward production.\n\n6. **Deploy the model\
    \ to production**\n\n   It is easy to deploy the model in SageMaker. Generally,\
    \ in normal scenarios one has to make APIs and then serve the model through an\
    \ endpoint. For all this, coding requirements are necessary. But, in SageMaker,\
    \ with minimal coding efforts the model can be converted into an API endpoint,\
    \ and after that live or batch model inference can be started. Also, to deploy\
    \ the model, another computational instance can be chosen, which generally takes\
    \ less RAM or GPUs as compared to the training model instance.\n\n7. **Monitor\
    \ the model**\n\n   Once the model starts serving in production, we can keep monitoring\
    \ the model’s performance. We can measure for which data points the model is performing\
    \ well, as well as the areas it is not. This process is called knowing the *ground\
    \ truth*.\n\n8. **Repeat the process when more data comes (retraining)**\n\n \
    \  Finally, as and when new data comes, the model can be retrained, and all the\
    \ previous steps can be repeated. All this can be done with zero downtime. This\
    \ means that the old model keeps serving until the new model is put into production.\n\
    \n### Preprocessing of Data in SageMaker\n\nAs we talked about in the previous\
    \ section, before we give the data to any model, we first clean it and preprocess\
    \ it. We can do this in SageMaker in multiple ways.\n\n- Using SageMaker Jupyter\
    \ Notebook to write Python scripts for processing data\n- Using a SageMaker batch\
    \ transform script to process data before getting the inference\n- Using Script\
    \ Processor to write processing script on the data\n\nUsing one of these approaches,\
    \ the data can be processed, and then any of the SageMaker training models can\
    \ be called to do the training on this processed data. We can use popular Python\
    \ libraries such as `Scikit-Learn` or `TensorFlow` for this purpose. If your script\
    \ involves some other libraries, then you can upload your own script inside a\
    \ Docker container. You’ll learn more about this in later chapters.\n\n### Model\
    \ Training in SageMaker\n\nFigure [4-7](#495447_1_En_4_Chapter.xhtml#Fig7) shows\
    \ how exactly model training happens as well as how the model deployment happens.\
    \ In this section, we will talk about the training part, while in the next section\
    \ we will cover the deployment part.\n\n![../images/495447_1_En_4_Chapter/495447_1_En_4_Fig7_HTML.jpg](images/495447_1_En_4_Chapter/495447_1_En_4_Fig7_HTML.jpg)\n\
    \nFigure 4-7\n\nSageMaker training and deployment process\n\nTo understand how\
    \ model training in SageMaker works, we will look at the bottom part of the image.\
    \ We can see that there are five sections contributing to it.\n\n- S3 bucket for\
    \ training data\n- Helper code\n- Training code\n- Training code image\n- S3 bucket\
    \ for model artifacts\n\nTraining a model in SageMaker is called a *training job*.\
    \ Any algorithm that is executed in SageMaker requires the training data to be\
    \ present in an S3 bucket. This is because the compute instances that are used\
    \ for training the model are called dynamically during model execution, and they\
    \ are not persistent. This means the data that is stored there will be deleted\
    \ once the job is done. Hence, we can save the data in S3, and the model will\
    \ always know from where to fetch the data, by means of an S3 URL.\n\nThe coding\
    \ part, which is written in Python, consists of two sections. The first section,\
    \ the helper code, helps you in processing the data, fetching the data, storing\
    \ the output, etc. The second section, the training code, actually does the model\
    \ training for you by applying the selected algorithm on the data.\n\nThe training\
    \ code image is a Docker container image that is stored in the ECR of AWS. It\
    \ contains all the packages and software required for executing your code. It\
    \ also contains your training and deployment scripts that you write. We package\
    \ everything required inside one container and push it to ECR. Then, we just pass\
    \ the URL of the image to the algorithm selected, and automatically the training\
    \ script runs. We need to understand that SageMaker works based on Docker containers,\
    \ and hence it is imperative for users to understand Docker before learning SageMaker.\n\
    \nFinally, once the model training is done, the model-related parameter values\
    \ should be stored in S3; as mentioned, once the training job is done, compute\
    \ instances are deleted, and hence we will lose all our learned parameters. That’s\
    \ why S3 becomes the common point to store all the information.\n\nOne thing to\
    \ notice here is that the Docker image is built by you, but still we have not\
    \ selected the hardware requirements. Therefore, when we call the SageMaker algorithm\
    \ and when we pass the parameters such as the S3 URL and Docker Image URL, then\
    \ only can we pass the type of instance that we have to choose. These instances\
    \ are the EC2 instances that we saw in Chapter [1](#495447_1_En_1_Chapter.xhtml).\
    \ Once we have chosen the instance, the Docker image is downloaded on that instance,\
    \ along with the training data. Finally, the model training starts.\n\nWe will\
    \ look at all these aspects of training the model in SageMaker in the upcoming\
    \ chapters."
