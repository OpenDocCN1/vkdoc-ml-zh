- fmt: '# Introduction to Machine Learning and Artificial Intelligence


    `Machine learning` and `artificial intelligence` are two terms that are used a
    lot in the industry nowadays. Most of the time people think they are synonyms
    of each other with no major differences. However, they are different. `Artificial
    intelligence` is the field of computer science and mathematics that tries to mimic
    human-like behavior and make decisions similar to humans. `Machine learning` can
    be considered a subset of artificial intelligence where we make a machine learn
    through the historical data provided and then use the learned behavior to predict
    an outcome if we get similar information in the future. So, machine learning is
    all about prediction and recommendations, while anything where we enable a machine
    to think like a human is artificial intelligence.


    For example, we converse with Alexa just like it is a human. The Alpha Zero robot
    can defeat chess champions as if it was a super-intelligent human being. Cars
    can now drive automatically without the help of humans, making their own decisions
    live on the road. All these are the examples of artificial intelligence agents,
    because they are behaving just like humans.


    When we try to forecast sales for the next six months, predict whether a stock
    is going to move upward or downward in the coming days, or guess whether a machine
    is able to understand the context of a paragraph and classify whether it is talking
    negatively or positively about certain things, we are talking about machine learning.
    Here we have trained the models by giving past data, and then the machine predicts
    the outcome of the future incoming data.


    Why exactly do we want machines to learn and assist us in our day-to-day lives?
    The following are some of the compelling reasons:


    - We as humans make decisions by learning from our surroundings. But we are limited
    to this exposure to information. Also, the chances of making mistakes as a human
    for new scenarios are high. That’s why we have the saying, “After all, I am only
    human.” Machines, on the other hand, can be given as much information as possible.
    They can be given as much complex information as possible. Hence, after getting
    trained, they can make their own decisions based on the surroundings. Of course,
    we cannot have a machine make decisions independently, but they can assist humans
    in decision-making.


    - In the past, people were making systems that were rule-based. This means if
    a certain scenario occurs, then do this; otherwise, do that. But, today, data
    is becoming complex, and all four Vs of data—volume, veracity, velocity, and variety—are
    at their peak. Therefore, making rule-based systems is next to impossible. Machine
    learning systems help us to understand this complex unstructured data and make
    decisions.


    Machine learning solves these problems with three types of learning.


    - Supervised learning

    - Unsupervised learning

    - Reinforcement learning


    ## Supervised Learning


    Supervised learning is a branch of machine learning where we know exactly what
    has happened in the past, and then we try to predict if the same result will occur
    if some mix of the situation that happened in the past occurs again. For example,
    for the past six years we have collected the rain and snow data for some villages.
    Specifically, we collected different information about humidity, pressure, temperature,
    etc., whenever it rained or snowed. We trained a machine learning model based
    on that data. Now, if we know the humidity, pressure, and temperature information
    for the upcoming days, can we predict that it’s going to rain or snow? This is
    supervised learning.


    In supervised learning terminology, the factors of humidity, pressure, temperature,
    etc., are called the `independent variables`. The factor that we are trying to
    predict, that is, whether it is going to rain or snow, is called the `dependent
    variable`.


    Figure [4-1](#495447_1_En_4_Chapter.xhtml#Fig1) shows a supervised learning framework.
    You can see that there is a supervisor who checks whether the predicted output
    is the same as the expected output. Based on that, an adjustment is made, and
    this adjustment is different for different machine learning algorithms. Finally,
    we get our predicted output.


    ![../images/495447_1_En_4_Chapter/495447_1_En_4_Fig1_HTML.jpg](images/495447_1_En_4_Chapter/495447_1_En_4_Fig1_HTML.jpg)


    Figure 4-1


    Supervised learning


    ## Unsupervised Learning


    In this branch of machine learning, we don’t have a guiding variable, which means
    that the dependent variable is not present. Hence, the main aim of unsupervised
    learning is to first understand the patterns present inside the data and then
    put the data that follows a similar pattern in the same group. Therefore, we can
    have clusters with similar features, or we can have similar products that are
    bought together, etc. Let’s understand this with the help of an example.


    When we go to a retail shop, such as Ikea, we can see a lot of products. We have
    gone there with the intention of buying a specific item. We also buy some other
    items. At the time of billing, the cashier will ask us for our mobile number through
    which they can identify unique customers. Now, since we liked the product, we
    went to the shop again and bought other necessary things. This shop has become
    our favorite one, and all our shopping is done there for three years. Using unsupervised
    machine learning, now the shop can utilize our purchase history and can start
    recommending different products. For example, if we recently bought curtains,
    it may suggest some other decorative items.


    Figure [4-2](#495447_1_En_4_Chapter.xhtml#Fig2) shows the unsupervised learning
    framework. In this diagram you can see that in the Interpretation section a hidden
    pattern of similarity is found, and based on that, similar items are put in the
    same place, as we can see in the output.


    ![../images/495447_1_En_4_Chapter/495447_1_En_4_Fig2_HTML.jpg](images/495447_1_En_4_Chapter/495447_1_En_4_Fig2_HTML.jpg)


    Figure 4-2


    Unsupervised learning


    You can find this sort of example not only in physical shops but also on e-commerce
    websites.'
