  trans: '

    ### SageMaker 图像分类应用


    对于此算法，我们将使用一个名为 Caltech256 的数据集。该数据集包含约 30,000 张图像，涵盖 256 个物体类别。这些类别包括 ak47、蚱蜢、浴缸等。我们可以从
    [`http://www.vision.caltech.edu/Image_Datasets/Caltech256/`](http://www.vision.caltech.edu/Image_Datasets/Caltech256/)
    进一步探索或下载该数据集。


    因此，在本节中，我们的任务是创建一个机器学习算法，将图像分类到这 256 个类别中。我们将从定义角色、区域等开始，这些内容在前面的章节中已经介绍过。接下来，让我们初始化图像分类算法的
    Docker 容器。


    ```

    training_image = get_image_uri(boto3.Session().region_name, ''image-classification'')

    ```


    我们已经将这些图像分成了训练集和验证集。我们可以直接使用这些图像。我们可以从这里下载图像：


    [`http://data.mxnet.io/data/caltech-256/caltech-256-60-train.rec`](http://data.mxnet.io/data/caltech-256/caltech-256-60-train.rec)


    [`http://data.mxnet.io/data/caltech-256/caltech-256-60-val.rec`](http://data.mxnet.io/data/caltech-256/caltech-256-60-val.rec)


    让我们将这些图像移动到我们的 S3 存储桶中。这些图像采用 RecordIO-Protobuf 格式，因为算法只期望这种格式。这次，让我们创建一个将文件上传到
    S3 的函数。


    ```

    def upload_to_s3(channel, file):

    s3 = boto3.resource(''s3'')

    data = open(file, "rb")

    key = channel + ''/'' + file

    s3.Bucket(bucket).put_object(Key=key, Body=data)

    ```


    现在，我们将在存储桶内定义用于保存数据的文件夹。


    ```

    s3_train_key = "image-classification/train"

    s3_validation_key = "image-classification/validation"

    ```


    剩下的就是将图像文件存储到 S3 中。


    ```

    upload_to_s3(s3_train_key, ''caltech-256-60-train.rec'')

    upload_to_s3(s3_validation_key, ''caltech-256-60-val.rec'')

    ```


    让我们定义与算法相关的参数，我们将使用这些参数来训练模型。


    ```

    num_layers = "18"

    image_shape = "3,224,224"

    num_training_samples = "15420"

    num_classes = "257"

    mini_batch_size =  "64"

    epochs = "2"

    learning_rate = "0.01"

    ```


    层数定义了网络的深度。图像形状为 224×224，具有三个通道（RGB）。训练数据集中的图像总数为 15,420。我们总共有 257 个类别，256 个物体，外加一个用于其他物体的额外类别。我们定义了批次大小为
    64，这表示一次将有多少张图像输入网络。我们将周期数定义为 2，这意味着模型将在整个训练数据集上训练两次。最后，学习率选择为 0.1，它将决定收敛并达到局部最小值所需的步数。


    现在我们可以定义算法了。我们已经初始化了容器。


    ```

    s3 = boto3.client(''s3'')

    job_name_prefix = ''imageclassification''

    job_name = job_name_prefix + ''-'' + time.strftime(''-%Y-%m-%d-%H-%M-%S'', time.gmtime())

    training_params = \

    {

    "AlgorithmSpecification": {

    "TrainingImage": training_image,

    "TrainingInputMode": "File"

    },

    "RoleArn": role,

    "OutputDataConfig": {

    "S3OutputPath": ''s3://{}/{}/output''.format(bucket, job_name_prefix)

    },

    "ResourceConfig": {

    "InstanceCount": 1,

    "InstanceType": "ml.p2.xlarge",

    "VolumeSizeInGB": 50

    },

    "TrainingJobName": job_name,

    "HyperParameters": {

    "image_shape": image_shape,

    "num_layers": str(num_layers),

    "num_training_samples": str(num_training_samples),

    "num_classes": str(num_classes),

    "mini_batch_size": str(mini_batch_size),

    "epochs": str(epochs),

    "learning_rate": str(learning_rate)

    },

    "StoppingCondition": {

    "MaxRuntimeInSeconds": 360000

    },

    "InputDataConfig": [

    {

    "ChannelName": "train",

    "DataSource": {

    "S3DataSource": {

    "S3DataType": "S3Prefix ",

    "S3Uri": s3_train,

    "S3DataDistributionType": "FullyReplicated"

    }

    },

    "ContentType": "application/x-recordio",

    "CompressionType": "None"

    },

    {

    "ChannelName": "validation",

    "DataSource": {

    "S3DataSource": {

    "S3DataType": "S3Prefix",

    "S3Uri": s3_validation,

    "S3DataDistributionType": "FullyReplicated"

    }

    },

    "ContentType": "application/x-recordio",

    "CompressionType": "None"

    }

    ]

    }

    ```


    我们之前已经了解了上述 JSON 中的大部分参数，因为我们在 XGBoost 算法中已经介绍过它们。以下是此算法中一些独特的参数：


    *   `ContentType` 是 `application/x-recordio`。正如我之前提到的，图像分类只期望 RecordIO-Protobuf
    数据格式。


    *   `S3DataDistributionType` 是完全复制，这意味着如果我们使用多个实例进行并行训练，那么数据集将被复制到所有实例中。


    *   我们使用的实例类型是 `p2.xlarge`，因为图像分类需要一个带有显卡的实例。请注意，`p2` 和 `p3` 实例并非完全免费，它们是收费的。


    完成算法规范后，我们将开始训练过程。


    ```

    sagemaker = boto3.client(service_name=''sagemaker'')

    sagemaker.create_training_job(**training_params)

    status = sagemaker.describe_training_job(TrainingJobName=job_name)[''TrainingJobStatus'']

    print(status)

    while status !=''Completed'' and status!=''Failed'':

    time.sleep(60)

    status = client.describe_training_job(TrainingJobName=job_name)[''TrainingJobStatus'']

    print(status)

    ```


    如图所示，此代码将启动训练，然后告知我们训练是否成功完成。训练完成后，我们将部署模型并进行预测。同样，该过程与我们之前在之前的算法中看到的相同。


    ```

    endpoint_response= sagemaker.create_endpoint(

    EndpointName="image-classification-caltech-endpoint",

    EndpointConfigName="image-classification-caltech-config")

    ```


    这将花费一些时间来启动端点生成所需的资源。端点生成后，我们就可以开始预测了。


    让我们下载一张图像并用它来测试我们的模型。我们可以下载一张浴缸图像，并检查模型是否能完美预测它。


    ```

    ! wget -O /tmp/test.jpg http://www.vision.caltech.edu/Image_Datasets/Caltech256/images/008.bathtub/008_0007.jpg

    ```


    上一行代码将直接把图像下载到您的系统。如果您的系统不是 Linux，您可以直接访问链接并下载图像。接下来，我们需要读取图像并将其传递给端点。


    ```

    with open(''/tmp/test.jpg'', ''rb'') as f:

    payload = f.read()

    payload = bytearray(payload)

    response = runtime.invoke_endpoint(EndpointName=endpoint_name,

    ContentType=''application/x-image'',

    Body=payload)

    result = response[''Body''].read()

    result = json.loads(result)

    ```


    变量 `result` 包含所有类别的预测概率。我们需要找到概率最大的类别。这意味着如果我们能获得概率最大的参数，那将是我们预测的类别。为此，我们可以使用
    `np.argmax()` 函数。


    ```

    index = np.argmax(result)

    ```


    现在，我们可以使用这个索引来提取标签。我们可以按照数据集中标签的顺序创建一个所有标签的列表，然后传递索引来预测标签。假设我们将所有类别保存在变量 `object_classes`
    中。接下来，我们可以打印预测结果。


    ```

    print("Result: label - " + object_categories[index] + ", probability - " + str(result[index]))

    ```


    您可以在 GitHub 仓库中找到完整的代码。另外，在所有操作完成后，不要忘记删除端点。


    ```

    sage.delete_endpoint(EndpointName=endpoint_name)

    ```


    ## 探索 SeqToSeq 算法


    Amazon 的序列到序列算法基于循环神经网络、卷积神经网络以及编码器-解码器架构，以更有效地理解上下文。下一节将简要概述 RNN 和编码器-解码器架构。

    '
- fmt: '### Recurrent Neural Networks


    When we deal with sequential data or time-based data, it becomes necessary to
    remember a few things from the past and understand how it can be used to predict
    the outcome. This is not possible with using normal artificial neural networks
    or convolutional neural networks. Therefore, a new architecture called `RNN` is
    used whenever we deal with sequential data. Figure [6-8](#495447_1_En_6_Chapter.xhtml#Fig8)
    shows a simple `RNN` architecture.


    ![../images/495447_1_En_6_Chapter/495447_1_En_6_Fig8_HTML.jpg](images/495447_1_En_6_Chapter/495447_1_En_6_Fig8_HTML.jpg)


    Figure 6-8


    Recurrent neural networks


    For example, in text classification, each word of the text is taken, some neural
    network–based computations are applied, and important aspects are stored and then
    passed to the next `RNN` layer. Storage happens in `h`, words are sent through
    `x`, while the output is received through `y`. The words are not directly passed,
    but they are converted into vectors and then passed. We can use algorithms such
    as `word2vec`, `glove`, or blazing text in `SageMaker` to generate these word
    vectors.


    There are various modifications to `RNN`s that solve the shortcomings present
    in the original versions. Two of the most used are long short-term memory (`LSTM`)
    and gated recurrent units (`GRU`).


    ### Encoder-Decoder Architecture


    Figure [6-9](#495447_1_En_6_Chapter.xhtml#Fig9) shows a typical encoder and decoder
    architecture.


    ![../images/495447_1_En_6_Chapter/495447_1_En_6_Fig9_HTML.jpg](images/495447_1_En_6_Chapter/495447_1_En_6_Fig9_HTML.jpg)


    Figure 6-9


    Encoders and decoders


    An encoder is mostly used to not only memorize the past and give accurate predictions
    but also to understand the context of the text passed. We can use normal `RNN`s
    or `LSTM`s and `GRU`s. Once the encoders look at all the word vectors, they generate
    the encoder vectors and pass them to the decoder. The encoder vector suffices
    all the information that the encoder has received, and the decoder uses it to
    make efficient predictions.


    The decoder takes these encoder vectors, feeds them to `RNN`s of its own, and
    then applies a `softmax` activation function to give the output. The best advantage
    of this architecture, apart from understanding the context, is its ability to
    take variable-length input and give variable-length output.


    ### SageMaker Application of SeqToSeq


    Let’s understand the algorithm in more detail by applying it to the machine translation
    use case; that is, let’s translate something from English to German. The first
    few steps will remain the same, as we saw in the previous algorithms.


    ```

    from time import gmtime, strftime

    import time

    import numpy as np

    import os

    import json

    import boto3

    import re

    from sagemaker import get_execution_role

    region_name = boto3.Session().region_name

    bucket = ''slytherins-test''

    prefix = ''seq2seq-E2G''

    role = get_execution_role()

    from sagemaker.amazon.amazon_estimator import get_image_uri

    container = get_image_uri(region_name, ''seq2seq'')

    ```


    So, in the previous steps we have defined the container of the algorithm and defined
    our bucket and the folder inside where the entire model-related files will be
    saved. The next step will be to have a dataset. The `Seq2Seq` algorithm has two
    approaches. In the first, you can use the pretrained model available for the predictions.
    So, for our example, a model already exists that is trained on English to German
    machine translation. Or, we can train the model on our own corpus and then use
    it for the predictions. This process may take a lot of time, but it is the best
    when used for domain-specific translation tasks.


    We will first see how to train the model on a corpus, and then we will use the
    pretrained model for predictions. The data that we will be using is news data.
    We will have files that contain news commentary in English and its translation
    in German. We can get these files from [`http://data.statmt.org/wmt17/translation-task/`](http://data.statmt.org/wmt17/translation-task/).


    Let’s download the data from inside the notebook and create our training and validation
    sets.


    ```

    ! wget http://data.statmt.org/wmt17/translation-task/preprocessed/de-en/corpus.tc.de.gz

    ! wget http://data.statmt.org/wmt17/translation-task/preprocessed/de-en/corpus.tc.en.gz

    ! gunzip corpus.tc.de.gz

    ! gunzip corpus.tc.en.gz

    ! mkdir validation

    ! curl http://data.statmt.org/wmt17/translation-task/preprocessed/de-en/dev.tgz
    | tar xvzf - -C validation

    ```


    The previous files that we have downloaded are big, around 250 MB each. So, if
    we train the model on the entire dataset, it may take days to finish. Therefore,
    we can take a subset of the entire data and use it for training.


    ```

    ! head -n 10000 corpus.tc.en > corpus.tc.en.small

    ! head -n 10000 corpus.tc.de > corpus.tc.de.small

    ```


    The previous subset created has 10,000 rows. We will use this small dataset for
    training. The next step will be to generate English and German vocabulary from
    the previous files. This will use the tokenization and other NLP components to
    generate the vocabulary.


    ```

    %%bash

    python3 create_vocab_proto.py \

    --train-source corpus.tc.en.small \

    --train-target corpus.tc.de.small \

    --val-source validation/newstest2014.tc.en \

    --val-target validation/newstest2014.tc.de

    ```


    The previous Python script takes as input the source English text and target German
    text. It applies the preprocessing to generate the vocabulary. Finally, it saves
    the English and German vocabulary in the validation folder. We use `%%bash` to
    run any command-line scripts inside the notebook. This is a Jupyter magic function.


    Now that our dataset has been created, we need to send it to our `S3` bucket.


    ```

    def upload_to_s3(bucket, prefix, channel, file):

    s3 = boto3.resource(''s3'')

    data = open(file, "rb")

    key = prefix + "/" + channel + ''/'' + file

    s3.Bucket(bucket).put_object(Key=key, Body=data)

    upload_to_s3(bucket, prefix, ''train'', ''train.rec'')

    upload_to_s3(bucket, prefix, ''validation'', ''val.rec'')

    upload_to_s3(bucket, prefix, ''vocab'', ''vocab.src.json'')

    upload_to_s3(bucket, prefix, ''vocab'', ''vocab.trg.json'')

    ```


    The code that we just executed generates two files. One is the vocabulary that
    is generated, and the second is the `RecordIO-Protobuf` version of the data. We
    will upload both of these files to `S3` using the previous code.'
