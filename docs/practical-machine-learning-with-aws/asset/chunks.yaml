  trans: '

    ### 循环神经网络


    在处理序列数据或基于时间的数据时，有必要记住过去的一些信息，并理解如何利用这些信息来预测结果。普通的神经网络或卷积神经网络无法实现这一点。因此，每当处理序列数据时，我们都会使用一种名为
    RNN 的新架构。图 6-8 展示了一个简单的 RNN 架构。


    ![../images/495447_1_En_6_Chapter/495447_1_En_6_Fig8_HTML.jpg](img/495447_1_En_6_Fig8_HTML.jpg)


    图 6-8

    循环神经网络


    例如，在文本分类中，会提取文本中的每个单词，应用一些基于神经网络的计算，存储重要信息，然后将其传递到下一个 RNN 层。存储发生在 `h` 中，单词通过 `x`
    传递，而输出则通过 `y` 接收。单词并非直接传递，而是先转换为向量再传递。我们可以使用诸如 word2vec、glove 或 SageMaker 中的 blazing
    text 等算法来生成这些词向量。


    RNN 有多种变体，用于解决原始版本中存在的缺陷。其中最常用的两种是长短期记忆网络（LSTM）和门控循环单元（GRU）。


    ### 编码器-解码器架构


    图 6-9 展示了一个典型的编码器和解码器架构。


    ![../images/495447_1_En_6_Chapter/495447_1_En_6_Fig9_HTML.jpg](img/495447_1_En_6_Fig9_HTML.jpg)


    图 6-9

    编码器和解码器


    编码器主要用于不仅记住过去并给出准确预测，还要理解所传递文本的上下文。我们可以使用普通的 RNN 或 LSTM 和 GRU。一旦编码器查看了所有词向量，它们就会生成编码器向量并将其传递给解码器。编码器向量包含了编码器接收到的所有信息，解码器利用它来进行有效的预测。


    解码器接收这些编码器向量，将其输入到自己的 RNN 中，然后应用 softmax 激活函数来给出输出。这种架构除了能理解上下文之外，最大的优势在于能够处理可变长度的输入并生成可变长度的输出。


    ### SeqToSeq 在 SageMaker 中的应用


    让我们通过将其应用于机器翻译用例来更详细地理解该算法；也就是说，我们将一些内容从英语翻译成德语。前几个步骤将保持不变，正如我们在之前的算法中看到的那样。


    ```

    from time import gmtime, strftime

    import time

    import numpy as np

    import os

    import json

    import boto3

    import re

    from sagemaker import get_execution_role

    region_name = boto3.Session().region_name

    bucket = ''slytherins-test''

    prefix = ''seq2seq-E2G''

    role = get_execution_role()

    from sagemaker.amazon.amazon_estimator import get_image_uri

    container = get_image_uri(region_name, ''seq2seq'')

    ```


    因此，在前面的步骤中，我们定义了算法的容器，并定义了我们的存储桶以及其中将保存整个模型相关文件的文件夹。下一步是准备数据集。Seq2Seq 算法有两种方法。第一种，你可以使用可用于预测的预训练模型。因此，对于我们的示例，已经存在一个基于英语到德语机器翻译训练好的模型。或者，我们也可以用自己的语料库训练模型，然后将其用于预测。这个过程可能需要大量时间，但在用于特定领域的翻译任务时，这是最佳选择。


    我们将首先了解如何在语料库上训练模型，然后使用预训练模型进行预测。我们将使用的数据是新闻数据。我们将拥有包含英语新闻评论及其德语翻译的文件。我们可以从 [`http://data.statmt.org/wmt17/translation-task/`](http://data.statmt.org/wmt17/translation-task/)
    获取这些文件。


    让我们从 notebook 内部下载数据，并创建我们的训练集和验证集。


    ```

    ! wget http://data.statmt.org/wmt17/translation-task/preprocessed/de-en/corpus.tc.de.gz

    ! wget http://data.statmt.org/wmt17/translation-task/preprocessed/de-en/corpus.tc.en.gz

    ! gunzip corpus.tc.de.gz

    ! gunzip corpus.tc.en.gz

    ! mkdir validation

    ! curl http://data.statmt.org/wmt17/translation-task/preprocessed/de-en/dev.tgz
    | tar xvzf - -C validation

    ```


    我们之前下载的文件很大，每个大约 250 MB。因此，如果我们在整个数据集上训练模型，可能需要数天才能完成。所以，我们可以取整个数据的一个子集用于训练。


    ```

    ! head -n 10000 corpus.tc.en > corpus.tc.en.small

    ! head -n 10000 corpus.tc.de > corpus.tc.de.small

    ```


    上面创建的子集有 10,000 行。我们将使用这个小型数据集进行训练。下一步是根据之前的文件生成英语和德语词汇表。这将使用分词和其他 NLP 组件来生成词汇表。


    ```

    %%bash

    python3 create_vocab_proto.py \

    --train-source corpus.tc.en.small \

    --train-target corpus.tc.de.small \

    --val-source validation/newstest2014.tc.en \

    --val-target validation/newstest2014.tc.de

    ```


    前面的 Python 脚本将源英语文本和目标德语文本作为输入。它应用预处理来生成词汇表。最后，它将英语和德语词汇表保存在验证文件夹中。我们使用 `%%bash`
    在 notebook 内部运行任何命令行脚本。这是一个 Jupyter 魔法函数。


    现在我们的数据集已经创建好了，我们需要将其发送到我们的 S3 存储桶。


    ```

    def upload_to_s3(bucket, prefix, channel, file):

    s3 = boto3.resource(''s3'')

    data = open(file, "rb")

    key = prefix + "/" + channel + ''/'' + file

    s3.Bucket(bucket).put_object(Key=key, Body=data)

    upload_to_s3(bucket, prefix, ''train'', ''train.rec'')

    upload_to_s3(bucket, prefix, ''validation'', ''val.rec'')

    upload_to_s3(bucket, prefix, ''vocab'', ''vocab.src.json'')

    upload_to_s3(bucket, prefix, ''vocab'', ''vocab.trg.json'')

    ```


    我们刚刚执行的代码生成了两个文件。一个是生成的词汇表，另一个是数据的 RecordIO-Protobuf 版本。我们将使用前面的代码将这两个文件都上传到 S3。

    '
- fmt: 'All the basic steps are complete now, and we want to now initialize the algorithm.
    We will do that using the code shown here:


    ```

    job_name = ''seq2seq-E2G''

    print("Training job", job_name)

    create_training_params = \

    {

    "AlgorithmSpecification": {

    "TrainingImage": container,

    "TrainingInputMode": "File"

    },

    "RoleArn": role,

    "OutputDataConfig": {

    "S3OutputPath": "s3://{}/{}/".format(bucket, prefix)

    },

    "ResourceConfig": {

    # Seq2Seq does not support multiple machines. Currently, it only supports single
    machine, multiple GPUs

    "InstanceCount": 1,

    "InstanceType": "ml.m4.xlarge", # We suggest one of ["ml.p2.16xlarge", "ml.p2.8xlarge",
    "ml.p2.xlarge"]

    "VolumeSizeInGB": 5

    },

    "TrainingJobName": job_name,

    "HyperParameters": {

    # Please refer to the documentation for complete list of parameters

    "max_seq_len_source": "60",

    "max_seq_len_target": "60",

    "optimized_metric": "bleu",

    "batch_size": "64", # Please use a larger batch size (256 or 512) if using ml.p2.8xlarge
    or ml.p2.16xlarge

    "checkpoint_frequency_num_batches": "1000",

    "rnn_num_hidden": "512",

    "num_layers_encoder": "1",

    "num_layers_decoder": "1",

    "num_embed_source": "512",

    "num_embed_target": "512"

    },

    "StoppingCondition": {

    "MaxRuntimeInSeconds": 48 * 3600

    },

    "InputDataConfig": [

    {

    "ChannelName": "train",

    "DataSource": {

    "S3DataSource": {

    "S3DataType": "S3Prefix",

    "S3Uri": "s3://{}/{}/train/".format(bucket, prefix),

    "S3DataDistributionType": "FullyReplicated"

    }

    },

    },

    {

    "ChannelName": "vocab",

    "DataSource": {

    "S3DataSource": {

    "S3DataType": "S3Prefix",

    "S3Uri": "s3://{}/{}/vocab/".format(bucket, prefix),

    "S3DataDistributionType": "FullyReplicated "

    }

    },

    },

    {

    "ChannelName": "validation",

    "DataSource": {

    "S3DataSource": {

    "S3DataType": "S3Prefix",

    "S3Uri": "s3://{}/{}/validation/".format(bucket, prefix),

    "S3DataDistributionType": "FullyReplicated"

    }

    },

    }

    ]

    }

    sagemaker_client = boto3.Session().client(service_name=''sagemaker'')

    sagemaker_client.create_training_job(**create_training_params)

    ```


    You can see that the format is the same as that of the XGBoost algorithm and image
    classification algorithm. All the parameters are the same as the algorithms that
    we discussed in the previous sections. Only the hyperparameters are specific to
    this algorithm. Let’s discuss these parameters:


    *   The `max_seq_len_source` and `max_seq_len_target` are the number of characters
    to take as a sequence and pass to the neural network architecture.

    *   The `batch_size` is the number of rows to be passed to the algorithm in one
    go.

    *   The `checkpoint_frequency_num_batches` saves the model after every batch of
    1,000 rows.

    *   The number of hidden layers of a neural network is defined as 512 with one
    encoder architecture unit and one decoder architecture unit. Remember, these units
    are used for understanding the context of the sentences.

    *   The `num_embed_source` and `num_embed_target` define the word vector size
    of each sentence in the dataset. It is set to 512.


    This code will start the execution of the training and will take a lot of hours
    to finish. Remember, this algorithm requires a GPU instance for execution. So,
    whatever instance you select will be chargeable. Choose wisely.


    Now, let’s look at how we can use the pretrained model that already exists and
    do the inference on the test dataset by exposing the endpoint. When we train the
    previous model, we will get three files:


    *   `Model.tar.gz`

    *   `Vocab.src.json`

    *   `Vocab.trg.json`


    So, once you train the model, you can use these files directly. But, for using
    the pretrained model, we will download these files. We can download them from
    here:


    ```

    model_name = "DEMO-pretrained-en-de-model"

    ! curl https://s3-us-west-2.amazonaws.com/seq2seq-data/model.tar.gz > model.tar.gz

    ! curl https://s3-us-west-2.amazonaws.com/seq2seq-data/vocab.src.json > vocab.src.json

    ! curl https://s3-us-west-2.amazonaws.com/seq2seq-data/vocab.trg.json > vocab.trg.json

    ```


