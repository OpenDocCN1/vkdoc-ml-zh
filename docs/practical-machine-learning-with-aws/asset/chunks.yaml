    preprocessed_test_data = output[''S3Output''][''S3Uri'']

    ```


    现在，我们可以通过使用 Pandas 读取数据来检查输出。


    ```

    training_features = pd.read_csv(preprocessed_training_data + ''train_features.csv'',
    nrows=10, header=None)

    print(''训练特征形状: {}''.format(training_features.shape))

    training_features.head(10)

    ```


    这为我们提供了图 5-16 中所示的输出。


    ![../images/495447_1_En_5_Chapter/495447_1_En_5_Fig16_HTML.jpg](img/495447_1_En_5_Fig16_HTML.jpg)


    图 5-16


    处理后的数据


    至此，使用 `SklearnProcessor` 可以完成的整个处理作业就结束了。下一步始终是定义机器学习算法。我们将在接下来的章节中讨论这一点。


    但是，假设我们不想使用 SageMaker 预定义的容器（如 `ScriptProcessor`），而是想创建自己的容器并在其上运行脚本。在这种情况下，我们可以使用
    SageMaker 的一个名为 `ScriptProcessor` 的类。让我们在下一节中探讨这一点。

    '
- fmt: '# Creating Your Own Preprocessing Code Using ScriptProcessor


    In the previous section, we used `SkLearnProcessor`, which is a built-in container
    provided by SageMaker. But, many times, we have to write some code that cannot
    only be executed in a SageMaker’s predefined containers. For that we have to make
    our own containers. We will be looking at making our own containers while training
    a machine learning model as well. In this section, we will make a container that
    performs the same tasks as the `SKlearnProcessor` container. The only difference
    is that it’s not prebuilt; we will build it from scratch.


    To use custom containers for processing jobs, we use a class provided by SageMaker
    named `ScriptProcessor`. Before giving inputs to `ScriptProcessor`, the first
    task is to create our Docker container and push it to ECR.


    ## Creating a Docker Container


    For this we will be creating a file named `Dockerfile` with no extension. Inside
    this we will be downloading an image of a minimal operating system and then install
    our packages inside it. So, our minimal operating system will be Linux based,
    and we will have Python, Scikit-Learn, and Pandas installed inside it.


    ```

    FROM python:3.7-slim-buster

    RUN pip3 install pandas==0.25.3 scikit-learn==0.21.3

    ENV PYTHONUNBUFFERED=TRUE

    ENTRYPOINT ["python3"]

    ```


    The previous script must be present inside the `Dockerfile`. The first line, `FROM
    python:3.7-slim-buster`, tells about the minimal operating system that needs to
    be downloaded from Docker Hub. This only contains Python 3.7 and the minimal packages
    required to run Python. But, we need to install other packages as well. That’s
    why we will use the next line, `RUN pip3 install pandas==0.25.3 scikit-learn==0.21.3`.
    This will install Pandas, Scikit-Learn, Numpy, and other important packages. The
    next line, `ENV PYTHONUNBUFFERED=TRUE`, is an advanced instruction that tells
    Python to log messages immediately. This helps in debugging purposes. Finally,
    the last line, `ENTRYPOINT ["python3"]`, tells about how our `preprocessing.py`
    file should execute.


    ## Building and Pushing the Image


    Now that our Docker file is ready, we need to build this image and then push it
    to Amazon ECR, which is a Docker image repository service. To build and push this
    image, the following information will be required:


    - Account ID

    - Repository name

    - Region

    - Tag given to the image


    All this information can be initialized using the following script:


    ```

    import boto3

    account_id = boto3.client(''sts'').get_caller_identity().get(''Account'')

    ecr_repository = ''sagemaker-processing-container''

    tag = '':latest''

    region = boto3.session.Session().region_name

    ```


    Once we have this information, we can start the process by first defining the
    ECR repository address and then executing some command-line scripts.


    ```

    processing_repository_uri = ''{}.dkr.ecr.{}.amazonaws.com/{}''.format(account_id,
    region, ecr_repository + tag)

    # Create ECR repository and push docker image

    ! docker build -t $ecr_repository docker # This builds the image

    ! $(aws ecr get-login --region $region --registry-ids $account_id --no-include-email)
    # Logs in to AWS

    ! aws ecr create-repository --repository-name $ecr_repository # Creates ECR Repository

    ! docker tag {ecr_repository + tag} $processing_repository_uri # Tags the image
    to differentiate it from other images

    ! docker push $processing_repository_uri # Pushes image to ECR

    ```


    If everything works fine, then your image will successfully be pushed to ECR.
    You can go to the ECR service and check the repository. You can see the view in
    Figure [5-17](#495447_1_En_5_Chapter.xhtml#Fig17).


    ![../images/495447_1_En_5_Chapter/495447_1_En_5_Fig17_HTML.jpg](images/495447_1_En_5_Chapter/495447_1_En_5_Fig17_HTML.jpg)


    Figure 5-17


    Image pushed to ECR


    ## Using a ScriptProcessor Class


    Now that our image is ready, we can start using the `ScriptProcessor` class. We
    will execute the same code, `preprocessing.py`, inside this container. Just like
    how we did in `SKLearnProcessor`, we will create an object of the class first.


    ```

    from sagemaker.processing import ScriptProcessor, ProcessingInput, ProcessingOutput

    from sagemaker import get_execution_role

    role = get_execution_role()

    script_processor = ScriptProcessor(command=[''python3''],

    image_uri=processing_repository_uri,

    role=role,

    instance_count=1,

    instance_type=''ml.m5.xlarge'')

    ```


    Once the object is created, we can use it to run our `preprocessing.py` file.


    ```

    input_data = ''s3://slytherins-test/Train.csv''

    script_processor.run(code=''preprocessing.py'',

    inputs=[ProcessingInput(

    source=input_data,

    destination=''/opt/ml/processing/input'')],

    outputs=[ProcessingOutput(source=''/opt/ml/processing/train'', destination=''s3://slytherins-test/''),

    ProcessingOutput(source=''/opt/ml/processing/test'', destination=''s3://slytherins-test/'')])

    ```


    You will find the code to be almost the same as the `SKLearnProcessor` code. It
    will give the same output as well. Finally, once the processing job is done, we
    can check the output again in the same way.


    ```

    preprocessing_job_description = script_processor.jobs[-1].describe()

    output_config = preprocessing_job_description[''ProcessingOutputConfig'']

    for output in output_config[''Outputs'']:

    if output[''OutputName''] == ''output-1'':

    preprocessed_training_data = output[''S3Output''][''S3Uri'']

    if output[''OutputName''] == ''output-2'':

    preprocessed_test_data = output[''S3Output''][''S3Uri'']

    import pandas as pd

    training_features = pd.read_csv(preprocessed_training_data + ''train_features.csv'',
    nrows=10, header=None)

    print(''Training features shape: {}''.format(training_features.shape))

    training_features.head(n=10)

    ```


    The output that you’ll get will be the same as shown in Figure [5-16](#495447_1_En_5_Chapter.xhtml#Fig16).


    In this section, we saw how we can create our own containers and run processing
    scripts. This becomes important in many situations. For example, if we want to
    use BERT-based preprocessing on an NLP task, we will have to create a container
    for that, as SageMaker doesn’t provide us with BERT-based services. We will be
    exploring more about custom containers while creating training and inference jobs
    in later chapters.


    In the past two sections, we have worked on the Jupyter Notebook inside the SageMaker
    container. But, most of the time, especially during production, we have to run
    the code in a different system. For that we will have to use the Boto3 API for
    the authentication and execution. In the next section, we will see how to use
    Boto3 for running our custom script.


    # Using Boto3 to Run Processing Jobs


    As mentioned, we use the Boto3 package to access the services of AWS from any
    other computer, including your localhost. So, in this section, we will be running
    the custom Docker container script that we saw in the previous section, using
    Boto3.'
