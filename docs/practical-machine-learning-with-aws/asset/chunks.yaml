- fmt: '### Processing Jobs


    In Chapter 5, we saw how to process data using the processing script. We used
    both `Sklearn` containers, and I also showed you how to use a custom container
    for processing. Let’s look at the logs generated by our processing script. To
    do this, we will first open the CloudWatch console from the services list. Once
    we are there, click the `Log Groups` section, the one that we used in the previous
    section. Here, you will find a list of different log groups, as you can see in
    Figure 7-8.


    ![../images/495447_1_En_7_Chapter/495447_1_En_7_Fig8_HTML.jpg](images/495447_1_En_7_Chapter/495447_1_En_7_Fig8_HTML.jpg)


    **Figure 7-8** Log groups


    You can see that in addition to the training job, you will find processing jobs,
    notebook instances, and endpoint logs. Let’s click the processing jobs. You will
    find a list of all the processing jobs that you ran. If you remember the name
    of the job, then it will be easier to find it. That’s why it is always recommended
    to use unique identifiers for all kinds of jobs. Click the latest processing job
    that we ran. Once you click it, you’ll find a list of all the steps output that
    the processing container gave, as shown in Figure 7-9.


    ![../images/495447_1_En_7_Chapter/495447_1_En_7_Fig9_HTML.jpg](images/495447_1_En_7_Chapter/495447_1_En_7_Fig9_HTML.jpg)


    **Figure 7-9** Output of a container


    This is how you can use CloudWatch to get insights about the processing jobs.
    Let’s see what output we get if we click the endpoints that we created. Let’s
    explore the linear learner endpoint (Figure 7-10).


    ![../images/495447_1_En_7_Chapter/495447_1_En_7_Fig10_HTML.jpg](images/495447_1_En_7_Chapter/495447_1_En_7_Fig10_HTML.jpg)


    **Figure 7-10** Exploring the linear learning endpoint


    You can see all the test data that we sent for the predictions, and it is giving
    us JSON format output for that. This is how we can use CloudWatch Logs for our
    jobs. One more section under Logs is `Transform Jobs`, which we will look at in
    the next chapter once we discuss the batch transform job.


    ### CloudWatch Metrics


    Similar to how we can use CloudWatch Logs to view the logs of our jobs, we can
    get the metrics related to the algorithms or resources. Let’s start with understanding
    the metrics related to the training jobs. We will log in to our SageMaker console
    and go to the training jobs page. We will explore the linear learner metrics for
    the classification task that we did on the Big Mart dataset. We will follow the
    same procedure to go to the algorithm page as we saw in CloudWatch Logs. Once
    on that page, instead of clicking to view the logs, we will click to view the
    metrics, as you can see in Figure 7-11.


    ![../images/495447_1_En_7_Chapter/495447_1_En_7_Fig11_HTML.jpg](images/495447_1_En_7_Chapter/495447_1_En_7_Fig11_HTML.jpg)


    **Figure 7-11** Selecting metrics


    Once you click “View Algorithm Metrics,” on the new screen you’ll find different
    metrics available for that algorithm and a graph canvas. It will look like Figure
    7-12.


    ![../images/495447_1_En_7_Chapter/495447_1_En_7_Fig12_HTML.jpg](images/495447_1_En_7_Chapter/495447_1_En_7_Fig12_HTML.jpg)


    **Figure 7-12** Selecting the objective metrics


    In the linear learner algorithm, the metrics that we can see are the loss function,
    the training progress, and the throughput. Let’s look at the loss function final
    value once the training stopped. We can click the `objective_loss` and then click
    “Add to graph.” Next we can move to the “Graphed metrics” option and change the
    period to the time when you finished the training. You can change the graph type
    to `Number`. You will get the output, as shown in Figure 7-13.


    ![../images/495447_1_En_7_Chapter/495447_1_En_7_Fig13_HTML.jpg](images/495447_1_En_7_Chapter/495447_1_En_7_Fig13_HTML.jpg)


    **Figure 7-13** Visualizing objective loss


    Similarly, based upon the dataset, we can access a lot of metrics, as shown in
    Figure 7-14.


    ![../images/495447_1_En_7_Chapter/495447_1_En_7_Fig14_HTML.jpg](images/495447_1_En_7_Chapter/495447_1_En_7_Fig14_HTML.jpg)


    **Figure 7-14** Different kinds of metrics available


    The same procedure can be adopted to get the metrics for any algorithm that has
    been run. Let’s look at some aspects of instance metrics as well. In the instance
    metrics, we can look at the CPU utilization, memory utilization, and disk utilization,
    as shown in Figure 7-15.


    ![../images/495447_1_En_7_Chapter/495447_1_En_7_Fig15_HTML.jpg](images/495447_1_En_7_Chapter/495447_1_En_7_Fig15_HTML.jpg)


    **Figure 7-15** Visualizing metrics


    You can see the metrics changing live if you open CloudWatch during the training
    session.


    ### Conclusion


    In this chapter, you learned how to use CloudWatch to get the logs and metrics
    of different algorithms and resources. In the next chapter, we will look at how
    we can train a custom algorithm and also look at some of the other aspects of
    SageMaker.


    ## Running a Custom Algorithm in SageMaker


    In this chapter, you will see how to run an algorithm of your own, instead of
    using SageMaker’s built-in algorithms. Although SageMaker provides built-in algorithms
    for almost any kind of problem statement, many times we want to run our own custom
    model utilizing the power of SageMaker. We can do so effectively if we have working
    knowledge of Docker and hands-on knowledge of Python. In this chapter, we will
    create a custom random forest model for our Big Mart dataset. We will deploy the
    container in ECR and then train the model using SageMaker. Then we will use the
    model to do real-time inference as well as understand how batch transformation
    is done.


    ### The Problem Statement


    The problem statement is that we will try to predict the sales of an e-commerce
    firm using the random forest algorithm (one of the supervised learning ensemble
    tree algorithms). As it is a regression problem, we will be using the `RandomForestRegressor`
    class of the Scikit-Learn package. We have already explored the dataset in the
    previous chapters; it’s the Big Mart dataset. Figure 8-1 shows the first few rows
    of the dataset.


    ![../images/495447_1_En_8_Chapter/495447_1_En_8_Fig1_HTML.jpg](images/495447_1_En_8_Chapter/495447_1_En_8_Fig1_HTML.jpg)


    **Figure 8-1** Start of the dataset


    Review Chapter 5 if you want to understand the dataset. We already processed the
    data in that chapter and created the training and validate dataset, so we will
    not be repeating that process here. We will continue developing the algorithm
    after the train and test split is done. Please go through Chapter 5 to revise
    the entire process.'
