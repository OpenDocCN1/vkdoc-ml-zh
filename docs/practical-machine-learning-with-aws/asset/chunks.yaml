    ## Preprocessing Using SageMaker’s Scikit-Learn Container


    We use SageMaker to take advantage of multiple things, especially the computation
    power, API generation, and ease of storage. Therefore, to achieve these things,
    the code must be written in a specific format. We will use the same code that
    we saw in the previous section, but we’ll make some changes in the overall structure
    so that it becomes compatible with SageMaker.


    First, the data should be in the S3 bucket. We have already put our `Train.csv`
    file in the bucket, in the first section of this chapter. Once that is done, we
    can start writing our code. First, we will define the role of the user and the
    region in which we are using the SageMaker service.


    ```

    import boto3

    import sagemaker

    from sagemaker import get_execution_role

    region = boto3.session.Session().region_name

    role = get_execution_role()

    ```


    The `boto3` package tries to extract the region name automatically if we are using
    the SageMaker notebook. If we are working from the localhost notebook, then it
    needs to be custom defined. We will look at that part in the last part of this
    book. `get_execution_role()` extracts the current role with which the user has
    signed in. It can be the root user or IAM role.


    Now that we have defined the region and role, the next step will be to define
    our Scikit-Learn container. As mentioned in the first part of the book, SageMaker
    operates on Docker containers. All the built-in algorithms are nothing but Docker
    containers, and even the custom algorithm must be put inside the Docker container
    and uploaded to ECR. Since we will be using Scikit-Learn to process our data,
    already SageMaker has a processing container for that. We just need to instantiate
    it and then use it.


    ```

    from sagemaker.sklearn.processing import SKLearnProcessor

    sklearn_processor = SKLearnProcessor(framework_version=''0.20.0'',

    role=role,

    instance_type=''ml.m5.xlarge'',

    instance_count=1)

    ```


    In the previous code, we created an object called `SKLearnProcessor`. The parameters
    passed tell about the version of Scikit-Learn to use, the IAM role to be passed
    to the instance, the type of compute instance to be used, and finally the number
    of compute instances to be spinned up. Once this is done, any Python script that
    we write and that uses Scikit-Learn can be used inside this container.


    Now, let’s check whether our data is accessible from SageMaker.


    ```

    import pandas as pd

    input_data = ''s3://slytherins-test/Train.csv''

    df = pd.read_csv(input_data)

    df.head()

    ```


    `slytherins-test` is the name of the S3 bucket that we created earlier in the
    chapter. `Train.csv` is the data that we uploaded. If everything works perfectly,
    you’ll get the output shown in Figure [5-14](#495447_1_En_5_Chapter.xhtml#Fig14).


    ![../images/495447_1_En_5_Chapter/495447_1_En_5_Fig14_HTML.jpg](images/495447_1_En_5_Chapter/495447_1_En_5_Fig14_HTML.jpg)


    **Figure 5-14** Data overview


    If you are getting any error, make sure that the bucket as well as the data has
    been given public access. We have talked about this in the previous part of the
    book.


    Now, it’s time to define our processing script that will be run inside the container.
    We have already written this script in the previous part. We will just restructure
    the code and save it inside a file named `preprocessing.py`.'
