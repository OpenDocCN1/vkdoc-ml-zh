    same place, as we can see in the output.


    ![../images/495447_1_En_4_Chapter/495447_1_En_4_Fig2_HTML.jpg](images/495447_1_En_4_Chapter/495447_1_En_4_Fig2_HTML.jpg)


    Figure 4-2


    Unsupervised learning


    You can find this sort of example not only in physical shops but also on e-commerce
    websites.'
  trans: '

    ## 机器学习与人工智能简介


    *机器学习*和*人工智能*是当今业界频繁使用的两个术语。大多数时候，人们认为它们是同义词，没有太大区别。然而，它们是有区别的。*人工智能*是计算机科学和数学的一个领域，它试图模仿人类的行为，并做出与人类相似的决策。*机器学习*可以被视为人工智能的一个子集，我们通过提供的历史数据让机器进行学习，然后在未来遇到类似信息时，利用学到的行为来预测结果。因此，机器学习主要关乎预测和推荐，而凡是能让机器像人类一样思考的领域都属于人工智能。


    例如，我们与 Alexa 对话，就像它是个真人一样。Alpha Zero 机器人能够击败国际象棋冠军，仿佛它是一个超级智能的人类。汽车现在可以在没有人类帮助的情况下自动驾驶，在道路上实时做出自己的决策。所有这些都是人工智能体的例子，因为它们的行为方式与人类无异。


    当我们试图预测未来六个月的销售额，预测某只股票在未来几天是上涨还是下跌，或者判断一台机器能否理解一段文字的语境并分类其谈论某事物是负面还是正面时，我们谈论的就是机器学习。在这里，我们通过提供过去的数据来训练模型，然后机器预测未来输入数据的结果。


    我们究竟为什么希望机器能够学习并协助我们的日常生活？以下是一些令人信服的理由：


    *   我们人类通过从周围环境中学习来做决策。但我们受限于所能接触到的信息。而且，人类在面对新情况时犯错的可能性很高。这就是为什么我们有句俗话：“毕竟，我只是个凡人。”
    另一方面，机器可以被赋予尽可能多的信息。它们可以被赋予尽可能复杂的信息。因此，经过训练后，它们可以根据周围环境做出自己的决策。当然，我们不能让机器独立做出决策，但它们可以协助人类进行决策。


    *   过去，人们构建的是基于规则的系统。这意味着，如果出现某种情况，就执行这个操作；否则，就执行那个操作。但是，如今数据变得复杂，数据的四个 V——体量（Volume）、真实性（Veracity）、速度（Velocity）和多样性（Variety）——都达到了顶峰。因此，构建基于规则的系统几乎是不可能的。机器学习系统帮助我们理解这些复杂的非结构化数据并做出决策。


    机器学习通过三种学习方式来解决这些问题。


    *   监督学习


    *   无监督学习


    *   强化学习


    ### 监督学习


    监督学习是机器学习的一个分支，我们确切地知道过去发生了什么，然后我们尝试预测，如果过去发生的情况以某种组合再次出现，是否会产生相同的结果。例如，在过去的六年里，我们收集了一些村庄的降雨和降雪数据。具体来说，每当降雨或降雪时，我们收集了关于湿度、气压、温度等的不同信息。我们基于这些数据训练了一个机器学习模型。现在，如果我们知道未来几天的湿度、气压和温度信息，我们能预测是否会下雨或下雪吗？这就是监督学习。


    在监督学习的术语中，湿度、气压、温度等因素被称为*自变量*。我们试图预测的因素，即是否会下雨或下雪，被称为*因变量*。


    图 4-1 展示了一个监督学习框架。你可以看到有一个监督者，它检查预测输出是否与期望输出相同。基于此，会进行调整，这种调整对于不同的机器学习算法是不同的。最终，我们得到预测输出。


    ![../images/495447_1_En_4_Chapter/495447_1_En_4_Fig1_HTML.jpg](img/495447_1_En_4_Fig1_HTML.jpg)


    图 4-1


    监督学习


    ### 无监督学习


    在机器学习的这个分支中，我们没有指导变量，这意味着因变量不存在。因此，无监督学习的主要目标是首先理解数据内部存在的模式，然后将遵循相似模式的数据归入同一组。因此，我们可以得到具有相似特征的聚类，或者可以找到经常一起购买的商品等。让我们通过一个例子来理解这一点。


    当我们去一家零售店，比如宜家，我们可以看到很多商品。我们去那里是为了购买某件特定物品。我们也会买一些其他东西。在结账时，收银员会询问我们的手机号码，通过这个号码他们可以识别出独特的顾客。现在，因为我们喜欢这家店，我们再次光顾并购买了其他必需品。这家店成了我们最喜欢的商店，三年来我们所有的购物都在那里完成。利用无监督机器学习，现在这家店可以利用我们的购买历史，并开始推荐不同的商品。例如，如果我们最近买了窗帘，它可能会推荐一些其他的装饰品。


    图 4-2 展示了无监督学习框架。在这个图中，你可以看到在“解释”部分发现了一个隐藏的相似性模式，基于此，相似的项目被放在同一个地方，正如我们在输出中看到的那样。


    ![../images/495447_1_En_4_Chapter/495447_1_En_4_Fig2_HTML.jpg](img/495447_1_En_4_Fig2_HTML.jpg)


    图 4-2


    无监督学习


    你不仅可以在实体店中找到这类例子，在电子商务网站上也能找到。

    '
- fmt: '### Reinforcement Learning


    Reinforcement learning is a unique domain of machine learning where a machine
    tries to learn by itself by analyzing different scenarios. This is done by giving
    the machine rewards for every successful task it does and giving a penalty if
    it fails to do a task. The machine has the aim of getting as many rewards as possible.
    With this model, machines learn to operate in different scenarios automatically.
    Let’s look at an example.


    A robot wants to learn to walk. First the environment provided to it is a plain
    road. For every successful step, maybe 50 reward points are given, but for every
    fall, 100 penalty points are taken. The robot takes the first step and falls,
    so it receives the penalty. It does this multiple times and keeps on falling.
    Finally, it takes a step and doesn’t fall. Hence, it receives reward points. This
    time, the robot knows what it has done to get its first reward. Now, it will try
    not to fall every time so that it can get the maximum number of rewards. Once
    it has trained itself to learn to walk, the environment can be changed, and multiple
    obstacles can be introduced. Again, the robot will start exploring different options
    to get the maximum rewards. This is how reinforcement learning takes place.


    In reinforcement learning, there is a combination of two approaches: exploration
    and exploitation. *Exploration* means that the robot should look at multiple options
    in the environment so that it can learn every difficulty present. *Exploitation*
    means that whatever the robot does, it has to keep getting the maximum number
    of reward points. The robot explores and maximizes the reward points, and hence
    it learns how to operate in tough situations. Reinforcement learning is out of
    the scope of this book, but we will be covering other aspects of machine learning
    in detail in this book.


    Figure [4-3](#495447_1_En_4_Chapter.xhtml#Fig3) shows what a reinforcement learning
    process looks like.


    ![../images/495447_1_En_4_Chapter/495447_1_En_4_Fig3_HTML.jpg](images/495447_1_En_4_Chapter/495447_1_En_4_Fig3_HTML.jpg)


    Figure 4-3


    Reinforcement learning


    There is one more type of machine learning that requires a dedicated discussion:
    deep learning.


    ## Deep Learning


    What do we humans exactly think? How do we make decisions? Obviously, it is the
    brain that is responsible, but it is not entirely responsible for making decisions.
    The brain will only perform when some information reaches it, but to make this
    information reach the brain, there are some other very small yet important components
    responsible. These are called *neurons*. They are the first ones that receive
    the information, and then through a series of neurons, this information is transferred
    to the brain, which in return makes a decision. This chain of neurons is called
    a *neural network* or *biological neural network*. Figure [4-4](#495447_1_En_4_Chapter.xhtml#Fig4)
    shows a simple biological neuron and its components.


    ![../images/495447_1_En_4_Chapter/495447_1_En_4_Fig4_HTML.jpg](images/495447_1_En_4_Chapter/495447_1_En_4_Fig4_HTML.jpg)


    Figure 4-4


    Biological neuron


    Mathematical and computer experts researched whether it is possible to mimic this
    human behavior of receiving information and then making decisions. This research
    led to the field artificial neural networks, which constitutes a major part of
    deep learning. These neural networks perform in a similar way to how a biological
    neural network performs. They receive the information, and then through a series
    of mathematical equations, like forward and backward propagation, gradient descent,
    activation functions, etc., they make the decisions. We will be discussing this
    later in the book.


    Figure [4-5](#495447_1_En_4_Chapter.xhtml#Fig5) shows an artificial neural network
    consisting of multiple artificial neurons present inside hidden layers.


    ![../images/495447_1_En_4_Chapter/495447_1_En_4_Fig5_HTML.jpg](images/495447_1_En_4_Chapter/495447_1_En_4_Fig5_HTML.jpg)


    Figure 4-5


    Artificial neural networks


    Now that we have seen a general introduction to machine learning, let’s explore
    the different services of AWS that help users to build machine learning models.


    ## Machine Learning in AWS


    We will be discussing the following AWS services in this section:


    - Amazon SageMaker

    - Amazon Comprehend

    - Amazon Polly

    - Amazon Rekognition

    - Amazon Ground Truth

    - Amazon Textract

    - Amazon Translate

    - Amazon Transcribe

    - Amazon Lex


    Let’s start by exploring the first, and the most important service, Amazon SageMaker.


    ## Amazon SageMaker


    Amazon SageMaker is one of the most important services used across industries.
    Therefore, it is the base of all the chapters in this book, and understanding
    the service is imperative, so I will be giving a detailed explanation of it compared
    to the other machine learning services of Amazon.


    Machine learning is not about only building a model; in fact, in my experience,
    a minimum amount of time is given to model building as compared to feature engineering,
    data preparation, or model serving. SageMaker makes the life of a data scientist
    much easier by providing services that you can use to prepare data, build models,
    test them, and then deploy them into production environments. It provides most
    of the common algorithms for building your machine learning models, and if you
    want to make any custom model not supported by SageMaker, then it has a facility
    to do so by using a bring-your-own container service. It also provides a distributed
    training option that can make your models run faster, as compared to a single-node
    run.


    Amazon SageMaker comes with following features:


    - **SageMaker Studio**: This is an application where you can build, train, validate,
    process, and deploy the models. It’s a single place to do everything.

    - **SageMaker Ground Truth**: This is used to create a labeled dataset.

    - **Studio Notebooks**: This is one of the latest features of SageMaker that includes
    the single sign-on feature, faster startup time, and one-click file sharing.

    - **Preprocessing**: This is used for analyzing and exploring data. It does feature
    engineering and transformation of data, as well as all the other things required
    to prepare the data for machine learning.

    - **Debugger**: This has different debugging usages, such as tracking the hyperparameters
    whose values keep changing during the model training. It can even alert if something
    abnormal happens with the parameters or with the data.

    - **Auto-pilot**: Without writing a single line of code, if you want SageMaker
    to take care of your model building, either regression or classification problems,
    auto-pilot is the feature to use. It is generally for users who have less coding
    experience.

    - **Reinforcement Learning**: This provides an interface to run a reinforcement
    learning algorithm, which runs on a reward and penalty architecture.

    - **Batch Transform**: After building the model, if you want to get predictions
    on a subset of data or you want to preprocess a subset of data, you can use the
    batch transform feature of SageMaker.

    - **Model Monitor**: This is used to check whether the model quality is persistent
    or deviates from the standard model.


    ![../images/495447_1_En_4_Chapter/495447_1_En_4_Fig6_HTML.jpg](images/495447_1_En_4_Chapter/495447_1_En_4_Fig6_HTML.jpg)


    Figure 4-6


    SageMaker process'
