    ### SageMaker 上的 XGBoost 应用


    与之前的算法类似，第一步是定义存储桶并设置路径。


    ```

    import os

    import boto3

    import re

    import sagemaker

    role = sagemaker.get_execution_role()

    region = boto3.Session().region_name

    bucket = ''slytherins-test''

    prefix = ''xgboost''

    bucket_path = ''https://s3-{}.amazonaws.com/{}''.format(region, bucket)

    ```


    现在，我们将遵循与上一节和上一章中相同的预处理数据集的步骤。我们将从已获得分箱目标变量的部分开始。在 XGBoost 算法中，我们将使用 CSV 数据集，而之前我们使用的是
    RecordIO-Protobuf。我们将保存数据并将其存储在 S3 中。


    ```

    data_final.to_csv(''train.csv'', header=None, index=False)

    boto3.Session(region_name=region).resource(''s3'').Bucket(bucket).Object(prefix
    + ''/train.csv'').upload_file(''train.csv'')

    ```


    下一步是初始化 XGBoost 的 Docker 镜像。


    ```

    from sagemaker.amazon.amazon_estimator import get_image_uri

    container = get_image_uri(region, ''xgboost'', ''1.0-1'')

    ```


    容器初始化后，我们将初始化算法并运行模型。


    ```

    import boto3

    from time import gmtime, strftime

    job_name = ''xgboost-classification-'' + strftime("%Y-%m-%d-%H-%M-%S", gmtime())

    create_training_params = \

    {

    "AlgorithmSpecification": {

    "TrainingImage": container,

    "TrainingInputMode": "File"

    },

    "RoleArn": role,

    "OutputDataConfig": {

    "S3OutputPath": bucket_path + "/" + prefix + "/xgboost"

    },

    "ResourceConfig": {

    "InstanceCount": 1,

    "InstanceType": "ml.m4.xlarge",

    "VolumeSizeInGB": 5

    },

    "TrainingJobName": job_name,

    "HyperParameters": {

    "max_depth":"5",

    "eta":"0.2",

    "gamma":"4",

    "min_child_weight":"6",

    "subsample":"0.7",

    "silent":"0",

    "objective":"multi:softmax",

    "num_round":"50",

    "num_class":"4"

    },

    "StoppingCondition": {

    "MaxRuntimeInSeconds": 3600

    },

    "InputDataConfig": [

    {

    "ChannelName": "train" ,

    "DataSource": {

    "S3DataSource": {

    "S3DataType": "S3Prefix",

    "S3Uri": bucket_path + "/" + prefix + ''/'',

    "S3DataDistributionType": "FullyReplicated"

    }

    },

    "ContentType": "csv",

    "CompressionType": "None"

    },

    {

    "ChannelName": "validation",

    "DataSource": {

    "S3DataSource": {

    "S3DataType": "S3Prefix",

    "S3Uri": bucket_path + "/" + prefix + ''/'',

    "S3DataDistributionType": "FullyReplicated"

    }

    },

    "ContentType": "csv",

    "CompressionType": "None"

    }

    ]

    }

    client = boto3.client(''sagemaker'', region_name=region)

    client.create_training_job(**create_training_params)

    ```


    让我们理解一下前面的代码。


    1.  在算法规范中，我们将传入初始化的 Docker 容器和数据类型。这里我们使用的是 CSV 文件；因此，数据类型将是 `file`。


    2.  在 `RoleArn` 中，我们将传入 IAM 角色。这是必须传入的，因为它将定义我们可以访问哪些资源。我们可以转到 IAM 角色部分，并记下我们在那里创建的角色的
    ARN。


    3.  `S3OutputPath` 定义了我们的模型文件将存储在 S3 中的位置。


    4.  接下来，我们必须配置我们的资源。我们将指定资源数量、资源类型和存储空间。请记住，您选择的资源越大，您承担的成本就越高。在决定之前，请访问成本浏览器并查看您要选择的资源的成本。


    5.  接下来需要设置 XGBoost 算法的超参数。


    6.  下一部分讨论您希望资源运行的最长时间。如果运行时间超过该时间，作业将自动停止。


    7.  最后，我们在最后一部分传入输入数据配置和类型。


    这个 JSON 格式填充完毕后，会启动容器，训练开始。我们可以使用 Cloud Metrics 和 CloudWatch 了解模型的指标和日志，我们将在下一章中介绍这些内容。这里我们将编写一个脚本，该脚本将持续告知我们训练是否正在进行。一旦训练完成或发生错误，脚本会通知我们。


    ```

    import time

    status = client.describe_training_job(TrainingJobName=job_name)[''TrainingJobStatus'']

    print(status)

    while status !=''Completed'' and status!=''Failed'':

    time.sleep(60)

    status = client.describe_training_job(TrainingJobName=job_name)[''TrainingJobStatus'']

    print(status)

    ```


    训练完成后，我们会得到如下所示的输出：


    ![../images/495447_1_En_6_Chapter/495447_1_En_6_Figd_HTML.jpg](img/495447_1_En_6_Figd_HTML.jpg)


    与上一节类似，模型训练完成后，我们可以准备并暴露一个可供预测使用的端点。要暴露端点，可以使用以下 XGBoost 算法脚本：


    ```

    create_endpoint_response = client.create_endpoint(

    EndpointName="xgboost-bigmart-endpoint",

    EndpointConfigName="xgboost-bigmart-config")

    ```


    这将启动端点，之后可以使用它进行预测。接下来，我们可以使用 `invoke_endpoint()` 方法测试模型。


    ```

    runtime_client = boto3.client(''runtime.sagemaker'', region_name=region)

    response = runtime_client.invoke_endpoint(EndpointName=endpoint_name,

    ContentType=''text/csv'',

    Body=test_data)

    ```


    要读取预测结果，可以使用以下脚本：


    ```

    result = response[''Body''].read()

    result = result.decode("utf-8")

    result = result.split('','')

    result = [math.ceil(float(i)) for i in result]

    label = payload.strip('' '').split()[0]

    print (''Label: '',label,''\nPrediction: '', result[0])

    ```


    我们也可以像线性学习器一样进行批量预测。您可以在 GitHub 仓库中找到批量预测的代码。预测完成后，不要忘记删除端点。


    ```

    client.delete_endpoint(EndpointName=endpoint_name)

    ```


    ## 探索 Blazing Text 算法


    Blazing text 算法用于为文本数据生成词嵌入。之后，这些嵌入可以提供给任何机器学习模型来执行分类任务。在本节中，我们将首先了解 blazing text
    算法，然后将其应用于 text8 数据集。


    Blazing text 算法是 word2vec 算法的高度优化版本，它允许更快的训练和推理，并且也支持分布式训练。使用此算法生成向量后，我们可以将它们用于不同的任务，例如文本分类、摘要、翻译等。它支持两种架构，类似于
    word2vec。


    *   跳字（Skip gram）架构


    *   连续词袋（Continuous bag of words）架构


    让我们简要讨论一下这些架构。


    ### 词向量生成的跳字架构


    跳字算法通过查找彼此最相似的词来生成词向量。该算法试图理解句子的上下文。为此，它以一个词作为输入，然后尝试预测所有具有相似上下文的词。图 6-4 展示了该架构，该图取自
    [`https://arxiv.org/pdf/1301.3781.pdf`](https://arxiv.org/pdf/1301.3781.pdf) 的研究论文（Mikolov
    等人）。


    ![../images/495447_1_En_6_Chapter/495447_1_En_6_Fig4_HTML.jpg](img/495447_1_En_6_Fig4_HTML.jpg)


    图 6-4


    跳字算法


    为了理解上下文并生成词向量，使用了一个小型神经网络架构，其隐藏层没有激活函数。最初，每个词都使用独热编码算法进行编码，然后输入到网络中。隐藏层被分配一个权重，其值通过损失函数学习。模型训练完成后，它可以用于生成词向量或直接用于文本分类模型。

