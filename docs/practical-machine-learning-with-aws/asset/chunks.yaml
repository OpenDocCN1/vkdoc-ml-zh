  trans: "\n### 设置 Dockerfile\n\n现在所有脚本文件都已就绪，我们需要创建一个 Docker 镜像，以便将其上传到 ECR，然后 SageMaker\
    \ 可以访问其中的代码，并在附加的 EC2 实例上运行。首先，我们来看看如何为我们创建的文件赋予一个结构。图 8-2 展示了在创建镜像之前，目录应有的结构。\n\
    \n![../images/495447_1_En_8_Chapter/495447_1_En_8_Fig2_HTML.jpg](img/495447_1_En_8_Fig2_HTML.jpg)\n\
    \n图 8-2\n\n目录结构\n\n我们已经创建了 `Data` 目录中的所有文件。现在，我们需要创建一个 `Dockerfile` 脚本，该脚本将被运行以构建镜像。然后，我们将使用\
    \ `build_and_push.sh` 文件将镜像推送到 ECR。\n\n以下是我们将在 `Dockerfile` 中遵循的步骤：\n\n1.  从 DockerHub\
    \ 下载一个包含我们操作系统的镜像。我们将下载一个最小版本的 Ubuntu，以便我们的代码可以在其中运行。为此，我们将使用以下脚本：\n\n1.  指定维护和创建此镜像的个人或组织名称。我在这里给出了我的名字。你可以使用任何你喜欢的名字。\n\
    \n```\nFROM ubuntu:16.04\n```\n\n1.  运行一些 Ubuntu 命令，以便设置 Python 环境并更新操作系统文件。我们还将下载用于运行推理端点的服务器文件。你必须熟悉\
    \ Linux 命令才能理解该脚本。\n\n    ```\n    RUN apt-get -y update && apt-get install -y\
    \ --no-install-recommends \\\n    wget \\\n    python \\\n    nginx \\\n    ca-certificates\
    \ \\\n    && rm -rf /var/lib/apt/lists/*\n    ```\n\n2.  设置完成后，我们可以使用 Python 的\
    \ `pip` 来安装重要的 Python 包。\n\n    ```\n    RUN wget https://bootstrap.pypa.io/get-pip.py\
    \ && python get-pip.py && \\\n    pip install numpy==1.16.2 scipy==1.2.1 scikit-learn==0.20.2\
    \ pandas flask gevent gunicorn && \\\n    (cd /usr/local/lib/python2.7/dist-packages/scipy/.libs;\
    \ rm *; ln ../../numpy/.libs/* .) && \\\n    rm -rf /root/.cache\n    ```\n\n\
    3.  设置环境变量，以便 Python 知道包含代码的默认文件夹。同时，我们还将设置 Python 的一些特性。我们首先确保能够及时从容器接收日志消息，然后确保一旦在\
    \ Python 中导入任何模块，就不会创建其 `.pyc` 文件。这分别通过变量 `pythonunbuffered` 和 `pythondontwritebytecode`\
    \ 来实现。\n\n    ```\n    ENV PYTHONUNBUFFERED=TRUE\n    ENV PYTHONDONTWRITEBYTECODE=TRUE\n\
    \    ENV PATH=\"/opt/program:${PATH}\"\n    ```\n\n4.  最后，实例将指示将我们的 `Data` 目录文件复制到默认工作目录，然后我们将更改默认工作目录。\n\
    \n    ```\n    COPY Data /opt/program\n    WORKDIR /opt/program\n    ```\n\n```\n\
    MAINTAINER Himanshu Singh\n```\n\n至此，我们的 `Dockerfile` 创建完成。以下是完整的代码：\n\n```\n\
    FROM ubuntu:16.04\nMAINTAINER Himanshu Singh\nRUN apt-get -y update && apt-get\
    \ install -y --no-install-recommends \\\nwget \\\npython \\\nnginx \\\nca-certificates\
    \ \\\n&& rm -rf /var/lib/apt/lists/*\nRUN wget https://bootstrap.pypa.io/get-pip.py\
    \ && python get-pip.py && \\\npip install numpy==1.16.2 scipy==1.2.1 scikit-learn==0.20.2\
    \ pandas flask gevent gunicorn && \\\n(cd /usr/local/lib/python2.7/dist-packages/scipy/.libs;\
    \ rm *; ln ../../numpy/.libs/* .) && \\\nrm -rf /root/.cache\nENV PYTHONUNBUFFERED=TRUE\n\
    ENV PYTHONDONTWRITEBYTECODE=TRUE\nENV PATH=\"/opt/program:${PATH}\"\nCOPY Data\
    \ /opt/program\nWORKDIR /opt/program\n```\n\n现在，让我们看看用于将此镜像推送到 ECR 的脚本。\n\n###\
    \ 将 Docker 镜像推送到 ECR\n\n我们将创建一个 shell 脚本文件，该文件首先用于根据我们在上一节中创建的 `Dockerfile` 构建镜像，然后将镜像推送到\
    \ ECR。让我们看看此过程的逐步说明：\n\n1.  命名镜像。我们将名称保存在一个变量中。\n\n1.  为 `train` 和 `serve` 文件授予完全的读写权限，以便容器启动后不会出现访问被拒绝的错误。\n\
    \n    ```\n    chmod +x Data/train\n    chmod +x Data/serve\n    ```\n\n2.  获取\
    \ AWS 配置，以便在推送镜像时不会中断。我们将定义 AWS 的账户和区域。请记住，由于我们将从 SageMaker 内部运行此代码，因此可以自动获取这些信息。如果从本地系统或\
    \ AWS 外部的任何地方运行此代码，则必须提供自定义值。\n\n    ```\n    account=$(aws sts get-caller-identity\
    \ --query Account --output text)\n    region=$(aws configure get region)\n   \
    \ region=${region:-us-east-2}\n    ```\n\n3.  为容器指定路径和名称。我们将使用第一步中给出的相同名称。稍后将使用此路径推送镜像。\n\
    \n    ```\n    fullname=\"${account}.dkr.ecr.${region}.amazonaws.com/${algorithm_name}:latest\"\
    \n    ```\n\n4.  检查镜像是否已存在。如果不存在，则创建新镜像；否则，更新现有镜像。\n\n    ```\n    aws ecr describe-repositories\
    \ --repository-names \"${algorithm_name}\" > /dev/null 2>&1\n    if [ $? -ne 0\
    \ ]\n    then\n    aws ecr create-repository --repository-name \"${algorithm_name}\"\
    \ > /dev/null\n    fi\n    ```\n\n5.  获取 AWS 账户的登录凭据。\n\n```\nalgorithm_name=sagemaker-random-forest\n\
    ```\n\n1.  使用已确定的名称构建镜像，使用包含 ECR 地址的完整名称重命名它，最后推送代码。\n\n    ```\n    docker build\
    \  -t ${algorithm_name} .\n    docker tag ${algorithm_name} ${fullname}\n    docker\
    \ push ${fullname}\n    ```\n\n```\n$(aws ecr get-login --region ${region} --no-include-email)\n\
    ```\n\n以下是应保存在 `build_and_push.sh` 文件中的完整脚本。\n\n```\nalgorithm_name=sagemaker-random-forest\n\
    chmod +x Container/train\nchmod +x Container/serve\naccount=$(aws sts get-caller-identity\
    \ --query Account --output text)\nregion=$(aws configure get region)\nregion=${region:-us-east-2}\n\
    fullname=\"${account}.dkr.ecr.${region}.amazonaws.com/${algorithm_name}:latest\"\
    \naws ecr describe-repositories --repository-names \"${algorithm_name}\" > /dev/null\
    \ 2>&1\nif [ $? -ne 0 ]\nthen\naws ecr create-repository --repository-name \"\
    ${algorithm_name}\" > /dev/null\nfi\n$(aws ecr get-login --region ${region} --no-include-email)\n\
    docker build  -t ${algorithm_name} .\ndocker tag ${algorithm_name} ${fullname}\n\
    docker push ${fullname}\n```\n\n完成此步骤后，我们需要进入终端，进入 `Dockerfile` 所在的目录，然后输入以下命令：\n\
    \n```\nsh build_and_push.sh\n```\n\n这将开始运行脚本，并成功将镜像上传到 ECR。然后，您可以前往 ECR 检查镜像是否存在。图\
    \ 8-3 显示了我们在 ECR 中的镜像。\n\n![../images/495447_1_En_8_Chapter/495447_1_En_8_Fig3_HTML.jpg](img/495447_1_En_8_Fig3_HTML.jpg)\n\
    \n图 8-3\n\nECR 中的容器镜像\n\n至此，创建 Docker 的过程就完成了。在下一节中，我们将了解如何使用此镜像在 SageMaker 笔记本中训练模型。\n"
- fmt: '# Training the Model


    Now we will use a SageMaker notebook to execute a classification model on the
    Big Mart dataset, using the random forest container we just created. Like the
    models that we saw in Chapter [6](#495447_1_En_6_Chapter.xhtml), we have to first
    define the role, then create a SageMaker session, and finally define the account
    and the region in which SageMaker is running.


    ```

    import boto3

    import re

    import os

    import numpy as np

    import pandas as pd

    from sagemaker import get_execution_role

    import sagemaker as sage

    role = get_execution_role()

    sess = sage.Session()

    account = sess.boto_session.client(''sts'').get_caller_identity()[''Account'']

    region = sess.boto_session.region_name

    ```


    The next step will be to get our data location. We have already uploaded our dataset
    in S3 in the previous chapters. Let’s define the path.


    ```

    data_location = ''s3://slytherins-test/Train.csv''

    ```


    Next, we will need to define the path of the custom Docker image that we just
    created and pushed to ECR.


    ```

    image = ''{}.dkr.ecr.{}.amazonaws.com/sagemaker-random-forest:latest''.format(account,
    region)

    ```


    Now that all the initial steps are done, we can start training our model. We will
    first initialize the container with the EC2 instance, image, role, and output
    S3 path, and then we will fit the model.


    ```

    tree = sage.estimator.Estimator(image,

    role, 1, ''ml.m4.xlarge'',

    output_path="s3://{}/output".format("slytherins-test"),

    sagemaker_session=sess)

    tree.fit(data_location)

    ```


    This will start the training job, and then once the job is finished, this will
    tell you the billable time as well. Figure [8-4](#495447_1_En_8_Chapter.xhtml#Fig4)
    shows the output of the training job.


    ![../images/495447_1_En_8_Chapter/495447_1_En_8_Fig4_HTML.jpg](images/495447_1_En_8_Chapter/495447_1_En_8_Fig4_HTML.jpg)


    Figure 8-4


    Output of the training job


    This finishes our training job. We can always look at the detailed logs of the
    algorithm using CloudWatch.


    # Deploying the Model


    Now that we have successfully trained the model, we can deploy it using the following
    line of script:


    ```

    from sagemaker.predictor import csv_serializer

    predictor = tree.deploy(1, ''ml.m4.xlarge'', serializer=csv_serializer)

    ```


    It will take some time to spin up an instance, and then it will be time to start
    our inference.


    # Doing Real-Time Inference


    Let’s use the test dataset of the Big Mart dataset and make predictions using
    the live endpoint we just deployed the model on.


    ```

    predictions = predictor.predict(test_data.values).decode(''utf-8'')

    ```


    Remember, to make these predictions, we need to have an endpoint up and running.
    This means when the endpoint is running, we will have to pay Amazon. But, if we
    want to start the endpoint only to make predictions and then automatically delete
    the endpoint, then we can use the Batch Transformation service in SageMaker. Let’s
    look at this in the next section.


    # Doing Batch Transformation


    To do the batch transformation, the first thing we need to do is to create a model
    that contains the model files that were generated when we trained the model and
    the image of the algorithm. The following is the code using that we can use to
    achieve this:


    ```

    import boto3

    client = boto3.client(''sagemaker'')

    image = ''{}.dkr.ecr.{}.amazonaws.com/sagemaker-random-forest:latest''.format(account,
    region)

    role = get_execution_role()

    primary_container = {

    ''Image'': image,

    ''ModelDataUrl'': ''s3://sagemaker-us-east-2-809912564797/output/sagemaker-random-forest-2020-06-07-07-27-23-190/output/model.tar.gz''

    }

    create_model_response = client.create_model(

    ModelName = ''Random-Forest-BigMart'',

    ExecutionRoleArn = role,

    PrimaryContainer = primary_container)

    ```


    This will package everything, and then we can pass it to the batch transform script
    so that we can start the predictions. To start a batch transform, first we need
    to store the test file in S3. Once we have stored the file, then we need to provide
    its location and the location in S3 where the predictions will be saved. We must
    give a unique name to the job.


    The following is the script that will be used to run the batch transform job:


    ```

    import time

    from time import gmtime, strftime

    batch_job_name = ''RF-Batch-Transform-'' + strftime("%Y-%m-%d-%H-%M-%S", gmtime())

    input_location = ''s3://slytherins-test/test_data.csv''

    output_location = ''s3://{}/{}/output/{}''.format(''slytherins-test'', ''RF-Batch-Transform'',
    batch_job_name)

    request = \

    {

    "TransformJobName": ''Random-Forest-BigMart-1'',

    "ModelName": ''Random-Forest-BigMart'',

    "TransformOutput": {

    "S3OutputPath": output_location,

    "Accept": "text/csv",

    "AssembleWith": "Line"

    },

    "TransformInput": {

    "DataSource": {

    "S3DataSource": {

    "S3DataType": "S3Prefix",

    "S3Uri": input_location

    }

    },

    "ContentType": "text/csv",

    "SplitType": "Line",

    "CompressionType": "None"

    },

    "TransformResources": {

    "InstanceType": "ml.m4.xlarge",

    "InstanceCount": 1

    }

    }

    client.create_transform_job(**request)

    print("Created Transform job with name: ", batch_job_name)

    ```


    Some of the keys used in the previous code are explained here:


    *   `ContentType` tells about the data type of our test dataset. It’s a CSV in
    our case.

    *   `SplitType` tells how different rows are split in our dataset. It is split
    by line in our case.

    *   `CompressionType` tells whether our data is raw or it is a compressed file
    like a TAR file. For us it is a raw CSV file.


    Once we execute the previous code, we can monitor the job progress in the SageMaker
    console. But, if we want to monitor the progress directly in the notebook, we
    can use the following script:


    ```

    try: client.get_waiter(''transform_job_completed_or_stopped'').wait(TransformJobName=''Random-Forest-BigMart-1'')

    finally:

    response = client.describe_transform_job(TransformJobName=''Random-Forest-BigMart-1'')

    status = response[''TransformJobStatus'']

    print("Transform job ended with status: " + status)

    if status == ''Failed'':

    message =response[''FailureReason'']

    print(''Transform failed with the following error: {}''.format(message))

    raise Exception(''Transform job failed'')

    ```


    To look at the job in the SageMaker console, we need to select the batch transform
    option. See Figure [8-5](#495447_1_En_8_Chapter.xhtml#Fig5).


    ![../images/495447_1_En_8_Chapter/495447_1_En_8_Fig5_HTML.jpg](images/495447_1_En_8_Chapter/495447_1_En_8_Fig5_HTML.jpg)


    Figure 8-5


    Batch transform job


    You can use CloudWatch for getting the logs and the metrics. We can find out whether
    the job is completed successfully by looking at the status. See Figure [8-6](#495447_1_En_8_Chapter.xhtml#Fig6).


    ![../images/495447_1_En_8_Chapter/495447_1_En_8_Fig6_HTML.jpg](images/495447_1_En_8_Chapter/495447_1_En_8_Fig6_HTML.jpg)


    Figure 8-6


    Status of the job


    Once the job is completed, we can go to the S3 output location and look at the
    predictions.


    # Conclusion


    In this chapter, you learned how to create custom containers to run the code and
    algorithms that are not present in SageMaker, while using the computational power
    of AWS and services of SageMaker. We can run any kind of custom code by following
    the same procedure.


    In the next chapter, you will learn how we can create an end-to-end pipeline using
    Step Functions.


    # 9. Making an End-to-End Pipeline in SageMaker


    In this chapter, we will see how we can make an end-to-end pipeline of an entire
    machine learning process. We can use a combination of AWS services to automate
    the entire process of machine learning. All the processes that we have seen in
    the previous chapters, from the data processing steps to the endpoint generation,
    can be automated and then be run directly with a click of a button. The only thing
    we need to change is the dataset, but the process remains the same. Let’s see
    how we can automate what we did on the Big Mart dataset in the previous chapters.


    Let’s start by looking at AWS Step Functions.'
