    ## 结论


    在本章中，你学习了如何使用 CloudWatch 获取不同算法和资源的日志和指标。在下一章中，我们将探讨如何训练自定义算法，并了解 SageMaker 的其他一些方面。


    # 8. 在 SageMaker 中运行自定义算法


    在本章中，你将了解如何运行自己的算法，而不是使用 SageMaker 的内置算法。尽管 SageMaker 为几乎任何类型的问题陈述都提供了内置算法，但很多时候我们希望利用
    SageMaker 的强大功能来运行我们自己的自定义模型。如果我们具备 Docker 的实用知识和 Python 的动手经验，就可以有效地做到这一点。在本章中，我们将为
    Big Mart 数据集创建一个自定义的随机森林模型。我们将把容器部署到 ECR 中，然后使用 SageMaker 训练模型。接着，我们将使用该模型进行实时推理，并了解如何进行批量转换。


    ## 问题陈述


    问题陈述是：我们将尝试使用随机森林算法（一种监督学习集成树算法）来预测一家电子商务公司的销售额。由于这是一个回归问题，我们将使用 Scikit-Learn
    包中的 `RandomForestRegressor` 类。我们已经在之前的章节中探索过该数据集；它就是 Big Mart 数据集。图 8-1 显示了数据集的前几行。


    ![../images/495447_1_En_8_Chapter/495447_1_En_8_Fig1_HTML.jpg](img/495447_1_En_8_Fig1_HTML.jpg)


    图 8-1


    数据集的开头


    如果你想了解该数据集，请回顾第 5 章。我们在那一章中已经处理了数据，并创建了训练集和验证集，因此这里不再重复该过程。我们将在完成训练集和测试集划分后继续开发算法。请通读第
    5 章以复习整个过程。

