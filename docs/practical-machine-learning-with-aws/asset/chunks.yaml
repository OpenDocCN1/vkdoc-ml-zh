    if we want to avoid the Python code. You can pass a JSON directly and then decide
    on the sequence. Let’s see the JSON that was generated by Step Functions for our
    code. To look at the JSON code, we have to click the Edit State Machine option.
    You can look at the entire JSON format, as shown in Figure [9-13](#495447_1_En_9_Chapter.xhtml#Fig13).


    ![../images/495447_1_En_9_Chapter/495447_1_En_9_Fig13_HTML.jpg](images/495447_1_En_9_Chapter/495447_1_En_9_Fig13_HTML.jpg)


    Figure 9-13


    Looking at the JSON structure


    ## Conclusion


    In this chapter, you learned how to create an end-to-end pipeline using Step Functions.
    This is useful when creating the entire training and deployment process and when
    retraining models with the new data or with some new configuration. This also
    helps in creating a CI/CD pipeline where we can push the code to Git and then
    use tools such as Jenkins or Bamboo to create these step functions and start the
    execution. Hence, as you push to code to Git, immediately the process of training
    starts. That’s the power of creating a pipeline.


    This finishes our discussion on SageMaker and its services. In the next chapter
    of this book, we will look at some of the use cases of machine learning that can
    be done using other AWS services.


    # Part IIIOther AWS Services


    # 10. Machine Learning Use Cases in AWS


    In this chapter, we will explore three use cases in which AWS can be used to solve
    typical machine learning problems, without writing too much code. We will use
    some of the AWS services besides SageMaker.


    ## Use Case 1: Natural Language Processing Using Amazon Comprehend


    Amazon Comprehend is a service in AWS that can perform various NLP tasks such
    as key entities extraction from text, sentiment analysis, phrases extraction,
    syntax check, language detection, topic modeling, and document classification.
    Amazon Comprehend provides a UI that we can use to train a model without writing
    any code. We can also use the API provided by Comprehend to connect it to the
    scripting language of your choice and then train the model directly from the code.


    In this section, we will explore how we can use Comprehend to analyze the text,
    and then we will create a custom sentiment analysis model using it.'
  trans: '

    ## 定义工作流并启动运行


    现在，上一节中的组件已连接完毕，我们需要提供所有必要的配置，以便该工作流能够执行。这可以通过以下代码实现：


    ```

    workflow = Workflow(

    name=''Big-Mart_Workflow-v1'',

    definition=workflow_definition,

    role=workflow_execution_role,

    execution_input=execution_input

    )

    ```


    完成此操作后，我们只需执行创建的工作流即可。这可以通过以下代码实现：


    ```

    workflow.create()

    execution = workflow.execute(

    inputs={

    ''JobName'': ''regression-{}''.format(uuid.uuid1().hex),

    ''ModelName'': ''regression-{}''.format(uuid.uuid1().hex),

    ''EndpointName'': ''regression-{}''.format(uuid.uuid1().hex)

    }

    )

    ```


    现在，当你执行上述代码时，整个管道将开始运行。要查看管道的图形化展示，可以使用 `render_graph()` 函数。


    ```

    workflow.render_graph()

    ```


    你将看到如图 9-7 所示的管道。


    ![../images/495447_1_En_9_Chapter/495447_1_En_9_Fig7_HTML.jpg](img/495447_1_En_9_Fig7_HTML.jpg)


    图 9-7


    渲染图形


    你还可以使用 `render_progress()` 函数检查当前执行过程的进度。参见图 9-8。


    ![../images/495447_1_En_9_Chapter/495447_1_En_9_Fig8_HTML.jpg](img/495447_1_En_9_Fig8_HTML.jpg)


    图 9-8


    检查进度


    ```

    execution.render_progress()

    ```


    如图中所述，如果任何步骤失败，将以红色显示，否则为绿色。我们将通过进入 Step Functions 控制台来进一步探索此过程。我们将在下一节中了解这一点。


    ## 探索 Step Functions 中的任务


    让我们看看本章创建的工作流在 Step Functions 控制台中是如何显示的。在服务列表中搜索 *Step Functions* 并点击它。这将打开你的控制台。你可以在其中找到本章创建的
    Step Function，如下所示。参见图 9-9。


    ![../images/495447_1_En_9_Chapter/495447_1_En_9_Fig9_HTML.jpg](img/495447_1_En_9_Fig9_HTML.jpg)


    图 9-9


    选择状态机


    点击你的管道名称，然后点击最近运行或正在运行的任务。参见图 9-10。


    ![../images/495447_1_En_9_Chapter/495447_1_En_9_Fig10_HTML.jpg](img/495447_1_En_9_Fig10_HTML.jpg)


    图 9-10


    选择最新任务


    在这里，你可以看到你创建的管道。它将在仪表板中清晰地显示所有步骤。你也可以点击各个组件并查看它们的进度。参见图 9-11。


    ![../images/495447_1_En_9_Chapter/495447_1_En_9_Fig11_HTML.jpg](img/495447_1_En_9_Fig11_HTML.jpg)


    图 9-11


    可视化进度


    如果你点击训练步骤，你可以看到它自己的过程。参见图 9-12。


    ![../images/495447_1_En_9_Chapter/495447_1_En_9_Fig12_HTML.jpg](img/495447_1_En_9_Fig12_HTML.jpg)


    图 9-12


    检查进度状态


    ## 探索可作为输入传递的 JSON 文件


    如果我们想避免使用 Python 代码，还有另一种方法可以在 Step Functions 中创建流程。你可以直接传递一个 JSON，然后决定执行顺序。让我们看看
    Step Functions 为我们的代码生成的 JSON。要查看 JSON 代码，我们必须点击“编辑状态机”选项。你可以查看整个 JSON 格式，如图 9-13
    所示。


    ![../images/495447_1_En_9_Chapter/495447_1_En_9_Fig13_HTML.jpg](img/495447_1_En_9_Fig13_HTML.jpg)


    图 9-13


    查看 JSON 结构


    ## 结论


    在本章中，你学习了如何使用 Step Functions 创建端到端管道。这在创建完整的训练和部署流程，以及使用新数据或新配置重新训练模型时非常有用。这也有助于创建
    CI/CD 管道，我们可以将代码推送到 Git，然后使用 Jenkins 或 Bamboo 等工具创建这些 Step Function 并启动执行。因此，当你将代码推送到
    Git 时，训练过程会立即开始。这就是创建管道的强大之处。


    至此，我们对 SageMaker 及其服务的讨论就结束了。在本书的下一章中，我们将介绍一些可以使用其他 AWS 服务完成的机器学习用例。


    # 第三部分其他 AWS 服务


    # 10. AWS 中的机器学习用例


    在本章中，我们将探讨三个用例，展示如何使用 AWS 解决典型的机器学习问题，而无需编写太多代码。除了 SageMaker，我们还将使用一些其他 AWS 服务。


    ## 用例 1：使用 Amazon Comprehend 进行自然语言处理


    Amazon Comprehend 是 AWS 中的一项服务，可以执行各种 NLP 任务，例如从文本中提取关键实体、情感分析、短语提取、语法检查、语言检测、主题建模和文档分类。Amazon
    Comprehend 提供了一个用户界面，我们可以使用它来训练模型而无需编写任何代码。我们也可以使用 Comprehend 提供的 API 将其连接到您选择的脚本语言，然后直接从代码训练模型。


    在本节中，我们将探讨如何使用 Comprehend 分析文本，然后使用它创建一个自定义情感分析模型。

    '
- fmt: '### Analysis of Text


    From the Amazon Management Console, we can select the Amazon Comprehend service
    and then click `Launch Amazon Comprehend`. Then we will see a section called "Real-time
    analysis." Let''s use this section to analyze some text in real time. The text
    that I have used for analysis is an excerpt from a *Game of Thrones* review: [`https://www.polygon.com/tv/2019/6/3/18634311/game-of-thrones-review-full-tv-series-hbo`](https://www.polygon.com/tv/2019/6/3/18634311/game-of-thrones-review-full-tv-series-hbo).


    The excerpt that we will analyze is as follows:


    > "The series'' ending unleashed a seemingly bottomless geyser of fan discontent
    ranging from mile-long Twitter threads to an honest-to-God petition for HBO to
    remake the eighth season from scratch. The complaints, by and large, feel typical
    to the "Peak TV" era: the uproar you''d expect from the sort of people who''ve
    interpreted Emilia Clarke''s traumatized, brutal Daenerys Targaryen as a one-dimensional
    message about girl power; anger that such and such a character "deserved" some
    specific ending they didn''t receive. Much of it boils down to viewers interpreting
    their own discomfort over the show''s failures."


    Figure [10-1](#495447_1_En_10_Chapter.xhtml#Fig1) shows an "Input text" box. Just
    paste the previous excerpt there and click `Analyze`.


    ![../images/495447_1_En_10_Chapter/495447_1_En_10_Fig1_HTML.jpg](images/495447_1_En_10_Chapter/495447_1_En_10_Fig1_HTML.jpg)


    **Figure 10-1** Inputting text into Comprehend


    Now, let''s see what Comprehend has given us after its analysis. The first thing
    is the list of entities that it has extracted, along with the confidence level.
    See Figure [10-2](#495447_1_En_10_Chapter.xhtml#Fig2).


    ![../images/495447_1_En_10_Chapter/495447_1_En_10_Fig2_HTML.jpg](images/495447_1_En_10_Chapter/495447_1_En_10_Fig2_HTML.jpg)


    **Figure 10-2** Result of analysis


    In Figure [10-2](#495447_1_En_10_Chapter.xhtml#Fig2), you can see that most of
    the entities extracted are correct. Now let''s see what the key phrases are in
    the text that Comprehend feels are important. Click the "Key phrases" tab. Figure
    [10-3](#495447_1_En_10_Chapter.xhtml#Fig3) shows the output.


    ![../images/495447_1_En_10_Chapter/495447_1_En_10_Fig3_HTML.jpg](images/495447_1_En_10_Chapter/495447_1_En_10_Fig3_HTML.jpg)


    **Figure 10-3** Key phrases present in the text


    Some of the phrases are really important, as by reading them we can tell what
    the paragraph is about, as well as its tone. Talking about the tone, let''s look
    at the sentiment of the entire paragraph. For this we will click the `Sentiment`
    tab. Figure [10-4](#495447_1_En_10_Chapter.xhtml#Fig4) shows the sentiment analysis
    of the paragraph.


    ![../images/495447_1_En_10_Chapter/495447_1_En_10_Fig4_HTML.jpg](images/495447_1_En_10_Chapter/495447_1_En_10_Fig4_HTML.jpg)


    **Figure 10-4** Sentiment analysis output


    Here you can see that Comprehend is telling us that the author is mostly neutral
    about *Game of Thrones*. If you read the paragraph, you''ll see the author is
    actually telling about fans who didn''t like the final season, rather than the
    author not liking it. Hence, in this section, Comprehend was able to give us the
    correct picture.


    If you want to empower your scripts with Comprehend, you can use the API that
    it provides. It is beyond the scope of this chapter, but it''s worth trying. You
    can read the Comprehend API documentation to try it.


    Next, let''s see how we can make a custom classification model using Comprehend.
    Here, we will be finding the toxicity level of a bunch of text. The dataset is
    taken from Kaggle, and you can download it from [`www.kaggle.com/c/jigsaw-toxic-comment-classification-challenge/data`](http://www.kaggle.com/c/jigsaw-toxic-comment-classification-challenge/data).


    ### Custom Classification


    The dataset contains a total of eight columns. I have kept only two columns and
    deleted the rest of them, as multiclass classification in Comprehend expects only
    two columns, one of the text and the other of the classes.


    In the Comprehend console, we will click "Custom classification." Then click "Train
    classifier." Figure [10-5](#495447_1_En_10_Chapter.xhtml#Fig5) shows the steps.


    ![../images/495447_1_En_10_Chapter/495447_1_En_10_Fig5_HTML.jpg](images/495447_1_En_10_Chapter/495447_1_En_10_Fig5_HTML.jpg)


    **Figure 10-5** Training a custom classifier


    The first step is to give your training job a name. Follow the instruction for
    the naming convention that Comprehend expects. See Figure [10-6](#495447_1_En_10_Chapter.xhtml#Fig6).


    ![../images/495447_1_En_10_Chapter/495447_1_En_10_Fig6_HTML.jpg](images/495447_1_En_10_Chapter/495447_1_En_10_Fig6_HTML.jpg)


    **Figure 10-6** Naming the classifier


    Next, you have to select a classification mode. Multiclass classification is where
    we have only one column of categories, while multilabel classification is where
    each class can have subcategories as well. We will select the first one, as shown
    in Figure [10-7](#495447_1_En_10_Chapter.xhtml#Fig7).


    ![../images/495447_1_En_10_Chapter/495447_1_En_10_Fig7_HTML.jpg](images/495447_1_En_10_Chapter/495447_1_En_10_Fig7_HTML.jpg)


    **Figure 10-7** Multiclass Comprehend classification


    Next, we have to upload the dataset to an S3 bucket and provide the path. Remember,
    only two columns must be present. See Figure [10-8](#495447_1_En_10_Chapter.xhtml#Fig8).


    ![../images/495447_1_En_10_Chapter/495447_1_En_10_Fig8_HTML.jpg](images/495447_1_En_10_Chapter/495447_1_En_10_Fig8_HTML.jpg)


    **Figure 10-8** Defining the IAM role


    Once you have provided the path, select your IAM role and then click "Train classifier."
    This will start the training of the model. Once your model is trained, you will
    see information similar to Figure [10-9](#495447_1_En_10_Chapter.xhtml#Fig9).


    ![../images/495447_1_En_10_Chapter/495447_1_En_10_Fig9_HTML.jpg](images/495447_1_En_10_Chapter/495447_1_En_10_Fig9_HTML.jpg)


    **Figure 10-9** Model training output


    You can next find the metrics of the trained model under "Classifier performance,"
    as shown in Figure [10-10](#495447_1_En_10_Chapter.xhtml#Fig10).


    ![../images/495447_1_En_10_Chapter/495447_1_En_10_Fig10_HTML.jpg](images/495447_1_En_10_Chapter/495447_1_En_10_Fig10_HTML.jpg)


    **Figure 10-10** Performance of the Comprehend classifier


    You can see that it gives a pretty good result, in terms of accuracy, precision,
    and recall. Next, to use this model, we can create an endpoint and then start
    the inference. Just click the "Create endpoint" button and give it a name to start
    the process. See Figure [10-11](#495447_1_En_10_Chapter.xhtml#Fig11).


    ![../images/495447_1_En_10_Chapter/495447_1_En_10_Fig11_HTML.jpg](images/495447_1_En_10_Chapter/495447_1_En_10_Fig11_HTML.jpg)


    **Figure 10-11** Creation of endpoint


    Once the endpoint is ready, we can go to the real-time analysis section, and this
    time instead of clicking the built-in analysis type, click `Custom` and select
    your endpoint. Next, give any text and it will predict its class, as you can see
    in Figures [10-12](#495447_1_En_10_Chapter.xhtml#Fig12) and [10-13](#495447_1_En_10_Chapter.xhtml#Fig13).


    ![../images/495447_1_En_10_Chapter/495447_1_En_10_Fig13_HTML.jpg](images/495447_1_En_10_Chapter/495447_1_En_10_Fig13_HTML.jpg)


    **Figure 10-13** Insights from the inference


    ![../images/495447_1_En_10_Chapter/495447_1_En_10_Fig12_HTML.jpg](images/495447_1_En_10_Chapter/495447_1_En_10_Fig12_HTML.jpg)


    **Figure 10-12** Inference using the Custom classifier


    Don''t forget to delete the endpoint once the analysis is done, because it''s
    chargeable. This finishes our discussion about the first use case. Next, let''s
    look at a sales forecast model that can be built using another Amazon service
    called Amazon Forecast.'
