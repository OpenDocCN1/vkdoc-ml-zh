- fmt: "### Infrastructure as a Service\n\nAs the name suggests, when a cloud service\
    \ provider gives access to users to the infrastructure that it has built, it is\
    \ considered an IaaS. For example, a cloud provider may give access to virtual\
    \ machines, physical machines, storage devices, etc. For example, we can use Google\
    \ Drive to store information on the cloud, since Google is providing its hard\
    \ drives as a service. AWS also provides machines called EC2 instances that individuals\
    \ can use to do operations that require higher computational power.\n\n### Platform\
    \ as a Service\n\nSometimes, instead of requiring an entire infrastructure, we\
    \ want only a specific development runtime where we can write our code or make\
    \ games or websites. This way the cost of building an entire infrastructure can\
    \ be reduced. This type of service is a PaaS. For example, we can use Google Colaboratory\
    \ for writing Python or R code. In addition, we can use AWS SageMaker to train\
    \ and put a machine learning model into production. There are other service providers\
    \ as well such as Microsoft Azure, Google Cloud Platform, IBM Cloud, etc.\n\n\
    ### Software as a Service\n\nWhen we don’t want the runtime, but we want to use\
    \ a specific software application with its built-in runtime, we don’t need a PaaS,\
    \ which would give us the runtime as well as dependencies and software we’d need\
    \ to install. Hence, there are cloud services that provide specific software for\
    \ specific uses, called SaaS. Examples of SaaS are Amazon Ground Truth, which\
    \ is used for data management, and Office 365 by Microsoft.\n\n### Anything as\
    \ a Service\n\nThe first three types of services have been on the market for quite\
    \ some time, but now, because of the advancement in technology, cloud service\
    \ providers are providing almost anything as a cloud service. For example, we\
    \ can now draw sketches of web pages and give them to Azure, which converts them\
    \ into HTML pages. In addition, you can play online songs by just talking to Alexa,\
    \ which is connected to AWS. All this comes under the umbrella of XaaS.\n\nLet’s\
    \ now dive deeper into a specific cloud service provider, called Amazon Web Services\
    \ (AWS).\n\n## Introduction to Amazon Web Services\n\nAWS provides global cloud\
    \ computing services across many countries and is currently responsible for handling\
    \ the infrastructure of many companies, including small and large enterprises.\
    \ According to the AWS documentation, currently AWS caters to hundreds of thousands\
    \ of businesses in 190 countries.\n\nAWS provides more than 150 services that\
    \ can be used on demand and can be paid for based on the time used. Currently,\
    \ AWS has data servers in a lot of regions, and you can choose to use only one\
    \ region’s server that is closest to your users. The following is the list of\
    \ data servers across the globe:\n\n- **North America**\n    - Ohio (US East)\n\
    \    - Oregon (US West)\n    - Northern California (US West)\n    - Northern Virginia\
    \ (US West)\n    - Gov Cloud (US East and US West)\n    - Canada (Central)\n-\
    \ **South America**\n    - Sao Paulo\n- **Europe/Middle East/Africa**\n    - London\
    \ (Europe)\n    - Stockholm (Europe)\n    - Frankfurt (Europe)\n    - Paris (Europe)\n\
    \    - Bahrain (Middle East)\n    - Ireland (Europe)\n- **Asia Pacific**\n   \
    \ - Singapore (Asia Pacific)\n    - Beijing (Mainland China)\n    - Sydney (Asia\
    \ Pacific)\n    - Tokyo (Asia Pacific)\n    - Seoul (Asia Pacific)\n    - Ningxia\
    \ (Mainland China)\n    - Osaka (Asia Pacific)\n    - Mumbai (Asia Pacific)\n\
    \    - Hong Kong (Asia Pacific)\n\nAs I mentioned, AWS has more than 150 services.\
    \ The question is, how do you access them? Is there a single centralized place\
    \ from where they can be accessed? Well, yes! This place is called the AWS Management\
    \ Console. Let’s look at some of the features of this console and how it is really\
    \ helpful to users.\n\n## AWS Management Console\n\nWith the AWS Management Console\
    \ (AMC), not only can you access the services, but it provides some other cool\
    \ features as well. Some of them are as follows:\n\n- Once you have created an\
    \ account on AWS and logged in to AMS, then your session remains active only for\
    \ 12 hours. After that, you need to log in again. Obviously, this time limit is\
    \ customizable. This feature is provided for security reasons.\n- Not only can\
    \ you access AMS from the Web, but you can use the mobile app as well. The AMS\
    \ app is present both on IOS and on Android devices.\n- AMS provides access to\
    \ different learning resources, articles, documentation, videos, etc., which help\
    \ us in understanding the different services of AWS.\n- You can even customize\
    \ and personalize AMS based on your usage and needs.\n\nAfter logging in to AWS,\
    \ you will see the following features:\n\n- Search button to find specific services\n\
    - Recently visited services by a user\n- List of all the services\n- Links to\
    \ automated workflows\n- Link to learning resources\n\nFigures [1-2](#495447_1_En_1_Chapter.xhtml#Fig2),\
    \ [1-3](#495447_1_En_1_Chapter.xhtml#Fig3), [1-4](#495447_1_En_1_Chapter.xhtml#Fig4),\
    \ and [1-5](#495447_1_En_1_Chapter.xhtml#Fig5) show the different screens of AMS.\n\
    \n![../images/495447_1_En_1_Chapter/495447_1_En_1_Fig5_HTML.jpg](images/495447_1_En_1_Chapter/495447_1_En_1_Fig5_HTML.jpg)\n\
    \nFigure 1-5\n\nList of all services on AMS\n\n![../images/495447_1_En_1_Chapter/495447_1_En_1_Fig4_HTML.jpg](images/495447_1_En_1_Chapter/495447_1_En_1_Fig4_HTML.jpg)\n\
    \nFigure 1-4\n\nAutomation on AMS\n\n![../images/495447_1_En_1_Chapter/495447_1_En_1_Fig3_HTML.jpg](images/495447_1_En_1_Chapter/495447_1_En_1_Fig3_HTML.jpg)\n\
    \nFigure 1-3\n\nLearning resources on AMS\n\n![../images/495447_1_En_1_Chapter/495447_1_En_1_Fig2_HTML.jpg](images/495447_1_En_1_Chapter/495447_1_En_1_Fig2_HTML.jpg)\n\
    \nFigure 1-2\n\nFind Services feature and recently visited services on AMS\n\n\
    We will look at how to log in to AWS and visit AMS in detail in the next section\
    \ about machine learning. Now, let’s move to the next feature of AWS called the\
    \ AWS Command-Line Interface (AWS CLI).\n\n## AWS Command-Line Interface\n\nIf\
    \ AMC gives you a visual interface to access the AWS services, the CLI gives you\
    \ some advanced power to access the same services through the console. It is used\
    \ by advanced developers who have spent some time with AWS. You just need to download\
    \ a single tool, and then you can use it to control different services, write\
    \ scripts, and have control over the automation of services.\n\nAWS provides a\
    \ lot of resources such as reference documents, GitHub repositories, forums, etc.,\
    \ for understanding AWS CLI. Though one can use AWS CLI from the default console\
    \ such as the command prompt of Windows or terminals of Linux and Mac, there is\
    \ a dedicated AWS shell that provides some advanced functionalities. Some of them\
    \ are as follows:\n\n- Autocompletion support\n- Inline documentation of commands\n\
    - OS shell commands, which can also be executed from the same shell\n\nWe will\
    \ be using the CLI a lot when we will cover machine learning in detail. Therefore,\
    \ we will look at its practical aspects directly in that section.\n\nBecause AWS\
    \ provides so many services, covering all of them is not possible in one book.\
    \ Moreover, this book is about machine learning, so it doesn’t make any sense\
    \ to cover every service here. But, we will discuss three services that I think\
    \ are really important and commonly used. The following are the services that\
    \ we are going to discuss here:\n\n- AWS Storage Services\n- AWS Compute Services\n\
    - AWS Networking and Content Delivery Services\n\nLet’s start the discussion with\
    \ the first one, Storage Services."
  raw: "### Infrastructure as a Service\n\nAs the name suggests, when a cloud service\
    \ provider gives access to users to the infrastructure that it has built, it is\
    \ considered an IaaS. For example, a cloud provider may give access to virtual\
    \ machines, physical machines, storage devices, etc. For example, we can use Google\
    \ Drive to store information on the cloud, since Google is providing its hard\
    \ drives as a service. AWS also provides machines called EC2 instances that individuals\
    \ can use to do operations that require higher computational power.\n\n### Platform\
    \ as a Service\n\nSometimes, instead of requiring an entire infrastructure, we\
    \ want only a specific development runtime where we can write our code or make\
    \ games or websites. This way the cost of building an entire infrastructure can\
    \ be reduced. This type of service is a PaaS. For example, we can use Google Colaboratory\
    \ for writing Python or R code. In addition, we can use AWS SageMaker to train\
    \ and put a machine learning model into production. There are other service providers\
    \ as well such as Microsoft Azure, Google Cloud Platform, IBM Cloud, etc.\n\n\
    ### Software as a Service\n\nWhen we don’t want the runtime, but we want to use\
    \ a specific software application with its built-in runtime, we don’t need a PaaS,\
    \ which would give us the runtime as well as dependencies and software we’d need\
    \ to install. Hence, there are cloud services that provide specific software for\
    \ specific uses, called SaaS. Examples of SaaS are Amazon Ground Truth, which\
    \ is used for data management, and Office 365 by Microsoft.\n\n### Anything as\
    \ a Service\n\nThe first three types of services have been on the market for quite\
    \ some time, but now, because of the advancement in technology, cloud service\
    \ providers are providing almost anything as a cloud service. For example, we\
    \ can now draw sketches of web pages and give them to Azure, which converts them\
    \ into HTML pages. In addition, you can play online songs by just talking to Alexa,\
    \ which is connected to AWS. All this comes under the umbrella of XaaS.\n\nLet’s\
    \ now dive deeper into a specific cloud service provider, called Amazon Web Services\
    \ (AWS).\n\n## Introduction to Amazon Web Services\n\nAWS provides global cloud\
    \ computing services across many countries and is currently responsible for handling\
    \ the infrastructure of many companies, including small and large enterprises.\
    \ According to the AWS documentation, currently AWS caters to hundreds of thousands\
    \ of businesses in 190 countries.\n\nAWS provides more than 150 services that\
    \ can be used on demand and can be paid for based on the time used. Currently,\
    \ AWS has data servers in a lot of regions, and you can choose to use only one\
    \ region’s server that is closest to your users. The following is the list of\
    \ data servers across the globe:\n\n*   **North America**\n    *   Ohio (US East)\n\
    \n    *   Oregon (US West)\n\n    *   Northern California (US West)\n\n    * \
    \  Northern Virginia (US West)\n\n    *   Gov Cloud (US East and US West)\n\n\
    \    *   Canada (Central)\n\n*   **South America**\n    *   Sao Paulo\n\n*   **Europe/Middle\
    \ East/Africa**\n    *   London (Europe)\n\n    *   Stockholm (Europe)\n\n   \
    \ *   Frankfurt (Europe)\n\n    *   Paris (Europe)\n\n    *   Bahrain (Middle\
    \ East)\n\n    *   Ireland (Europe)\n\n*   **Asia Pacific**\n    *   Singapore\
    \ (Asia Pacific)\n\n    *   Beijing (Mainland China)\n\n    *   Sydney (Asia Pacific)\n\
    \n    *   Tokyo (Asia Pacific)\n\n    *   Seoul (Asia Pacific)\n\n    *   Ningxia\
    \ (Mainland China)\n\n    *   Osaka (Asia Pacific)\n\n    *   Mumbai (Asia Pacific)\n\
    \n    *   Hong Kong (Asia Pacific)\n\nAs I mentioned, AWS has more than 150 services.\
    \ The question is, how do you access them? Is there a single centralized place\
    \ from where they can be accessed? Well, yes! This place is called the AWS Management\
    \ Console. Let’s look at some of the features of this console and how it is really\
    \ helpful to users.\n\n## AWS Management Console\n\nWith the AWS Management Console\
    \ (AMC), not only can you access the services, but it provides some other cool\
    \ features as well. Some of them are as follows:\n\n*   Once you have created\
    \ an account on AWS and logged in to AMS, then your session remains active only\
    \ for 12 hours. After that, you need to log in again. Obviously, this time limit\
    \ is customizable. This feature is provided for security reasons.\n\n*   Not only\
    \ can you access AMS from the Web, but you can use the mobile app as well. The\
    \ AMS app is present both on IOS and on Android devices.\n\n*   AMS provides access\
    \ to different learning resources, articles, documentation, videos, etc., which\
    \ help us in understanding the different services of AWS.\n\n*   You can even\
    \ customize and personalize AMS based on your usage and needs.\n\nAfter logging\
    \ in to AWS, you will see the following features:\n\n*   Search button to find\
    \ specific services\n\n*   Recently visited services by a user\n\n*   List of\
    \ all the services\n\n*   Links to automated workflows\n\n*   Link to learning\
    \ resources\n\nFigures [1-2](#495447_1_En_1_Chapter.xhtml#Fig2), [1-3](#495447_1_En_1_Chapter.xhtml#Fig3),\
    \ [1-4](#495447_1_En_1_Chapter.xhtml#Fig4), and [1-5](#495447_1_En_1_Chapter.xhtml#Fig5)\
    \ show the different screens of AMS.\n\n![../images/495447_1_En_1_Chapter/495447_1_En_1_Fig5_HTML.jpg](images/495447_1_En_1_Chapter/495447_1_En_1_Fig5_HTML.jpg)\n\
    \nFigure 1-5\n\nList of all services on AMS\n\n![../images/495447_1_En_1_Chapter/495447_1_En_1_Fig4_HTML.jpg](images/495447_1_En_1_Chapter/495447_1_En_1_Fig4_HTML.jpg)\n\
    \nFigure 1-4\n\nAutomation on AMS\n\n![../images/495447_1_En_1_Chapter/495447_1_En_1_Fig3_HTML.jpg](images/495447_1_En_1_Chapter/495447_1_En_1_Fig3_HTML.jpg)\n\
    \nFigure 1-3\n\nLearning resources on AMS\n\n![../images/495447_1_En_1_Chapter/495447_1_En_1_Fig2_HTML.jpg](images/495447_1_En_1_Chapter/495447_1_En_1_Fig2_HTML.jpg)\n\
    \nFigure 1-2\n\nFind Services feature and recently visited services on AMS\n\n\
    We will look at how to log in to AWS and visit AMS in detail in the next section\
    \ about machine learning. Now, let’s move to the next feature of AWS called the\
    \ AWS Command-Line Interface (AWS CLI).\n\n## AWS Command-Line Interface\n\nIf\
    \ AMC gives you a visual interface to access the AWS services, the CLI gives you\
    \ some advanced power to access the same services through the console. It is used\
    \ by advanced developers who have spent some time with AWS. You just need to download\
    \ a single tool, and then you can use it to control different services, write\
    \ scripts, and have control over the automation of services.\n\nAWS provides a\
    \ lot of resources such as reference documents, GitHub repositories, forums, etc.,\
    \ for understanding AWS CLI. Though one can use AWS CLI from the default console\
    \ such as the command prompt of Windows or terminals of Linux and Mac, there is\
    \ a dedicated AWS shell that provides some advanced functionalities. Some of them\
    \ are as follows:\n\n*   Autocompletion support\n\n*   Inline documentation of\
    \ commands\n\n*   OS shell commands, which can also be executed from the same\
    \ shell\n\nWe will be using the CLI a lot when we will cover machine learning\
    \ in detail. Therefore, we will look at its practical aspects directly in that\
    \ section.\n\nBecause AWS provides so many services, covering all of them is not\
    \ possible in one book. Moreover, this book is about machine learning, so it doesn’t\
    \ make any sense to cover every service here. But, we will discuss three services\
    \ that I think are really important and commonly used. The following are the services\
    \ that we are going to discuss here:\n\n*   AWS Storage Services\n\n*   AWS Compute\
    \ Services\n\n*   AWS Networking and Content Delivery Services\n\nLet’s start\
    \ the discussion with the first one, Storage Services."
  trans: "\n### 基础设施即服务（IaaS）\n\n顾名思义，当云服务提供商允许用户访问其构建的基础设施时，这便被视为 IaaS。例如，云提供商可能提供对虚拟机、物理机、存储设备等的访问。比如，我们可以使用\
    \ Google Drive 将信息存储在云端，因为谷歌将其硬盘作为服务提供。AWS 还提供了名为 EC2 实例的机器，个人可以使用它们来执行需要更高计算能力的操作。\n\
    \n### 平台即服务（PaaS）\n\n有时，我们不需要整个基础设施，而只需要一个特定的开发运行时环境，以便编写代码、制作游戏或网站。这样，构建整个基础设施的成本就可以降低。这种类型的服务就是\
    \ PaaS。例如，我们可以使用 Google Colaboratory 来编写 Python 或 R 代码。此外，我们还可以使用 AWS SageMaker\
    \ 来训练机器学习模型并将其投入生产。还有其他服务提供商，如 Microsoft Azure、Google Cloud Platform、IBM Cloud\
    \ 等。\n\n### 软件即服务（SaaS）\n\n当我们不需要运行时环境，但想使用带有内置运行时的特定软件应用程序时，我们就不需要 PaaS（它会提供运行时环境以及我们需要安装的依赖项和软件）。因此，存在一些云服务，它们为特定用途提供特定软件，称为\
    \ SaaS。SaaS 的例子包括用于数据管理的 Amazon Ground Truth 和微软的 Office 365。\n\n### 一切皆服务（XaaS）\n\
    \n前三种服务类型已在市场上存在相当长的时间，但现在，由于技术的进步，云服务提供商几乎将一切事物都作为云服务来提供。例如，我们现在可以绘制网页草图并将其交给\
    \ Azure，Azure 会将其转换为 HTML 页面。此外，你可以通过与连接到 AWS 的 Alexa 对话来播放在线歌曲。所有这些都归入 XaaS 的范畴。\n\
    \n现在，让我们深入了解一个特定的云服务提供商——亚马逊网络服务（AWS）。\n\n## 亚马逊网络服务简介\n\nAWS 在许多国家提供全球云计算服务，目前负责处理许多公司（包括小型和大型企业）的基础设施。根据\
    \ AWS 文档，目前 AWS 为 190 个国家的数十万家企业提供服务。\n\nAWS 提供超过 150 种可按需使用并根据使用时间付费的服务。目前，AWS\
    \ 在许多区域都设有数据服务器，你可以选择仅使用离用户最近的一个区域服务器。以下是全球数据服务器列表：\n\n*   **北美**\n    *   俄亥俄州（美国东部）\n\
    \n    *   俄勒冈州（美国西部）\n\n    *   北加利福尼亚（美国西部）\n\n    *   北弗吉尼亚（美国西部）\n\n    * \
    \  GovCloud（美国东部和美国西部）\n\n    *   加拿大（中部）\n\n*   **南美**\n    *   圣保罗\n\n*   **欧洲/中东/非洲**\n\
    \    *   伦敦（欧洲）\n\n    *   斯德哥尔摩（欧洲）\n\n    *   法兰克福（欧洲）\n\n    *   巴黎（欧洲）\n\n\
    \    *   巴林（中东）\n\n    *   爱尔兰（欧洲）\n\n*   **亚太地区**\n    *   新加坡（亚太地区）\n\n    *\
    \   北京（中国大陆）\n\n    *   悉尼（亚太地区）\n\n    *   东京（亚太地区）\n\n    *   首尔（亚太地区）\n\n \
    \   *   宁夏（中国大陆）\n\n    *   大阪（亚太地区）\n\n    *   孟买（亚太地区）\n\n    *   香港（亚太地区）\n\
    \n正如我所提到的，AWS 拥有超过 150 种服务。问题是，你如何访问它们？是否有一个集中的地方可以访问它们？嗯，是的！这个地方叫做 AWS 管理控制台。让我们看看这个控制台的一些特性，以及它如何真正对用户有帮助。\n\
    \n## AWS 管理控制台\n\n使用 AWS 管理控制台（AMC），你不仅可以访问服务，它还提供了一些其他很酷的功能。其中一些如下：\n\n*   一旦你在\
    \ AWS 上创建了账户并登录到 AMC，你的会话将仅保持 12 小时的活动状态。之后，你需要重新登录。显然，这个时间限制是可定制的。提供此功能是出于安全原因。\n\
    \n*   你不仅可以从 Web 访问 AMC，还可以使用移动应用程序。AMC 应用程序在 iOS 和 Android 设备上都有。\n\n*   AMC\
    \ 提供对不同学习资源、文章、文档、视频等的访问，这有助于我们理解 AWS 的不同服务。\n\n*   你甚至可以根据你的使用情况和需求自定义和个性化 AMC。\n\
    \n登录 AWS 后，你将看到以下功能：\n\n*   用于查找特定服务的搜索按钮\n\n*   用户最近访问的服务\n\n*   所有服务的列表\n\n\
    *   自动化工作流程的链接\n\n*   学习资源的链接\n\n图 1-2、1-3、1-4 和 1-5 展示了 AMC 的不同界面。\n\n![../images/495447_1_En_1_Chapter/495447_1_En_1_Fig5_HTML.jpg](img/495447_1_En_1_Fig5_HTML.jpg)\n\
    \n图 1-5\n\nAMC 上的所有服务列表\n\n![../images/495447_1_En_1_Chapter/495447_1_En_1_Fig4_HTML.jpg](img/495447_1_En_1_Fig4_HTML.jpg)\n\
    \n图 1-4\n\nAMC 上的自动化\n\n![../images/495447_1_En_1_Chapter/495447_1_En_1_Fig3_HTML.jpg](img/495447_1_En_1_Fig3_HTML.jpg)\n\
    \n图 1-3\n\nAMC 上的学习资源\n\n![../images/495447_1_En_1_Chapter/495447_1_En_1_Fig2_HTML.jpg](img/495447_1_En_1_Fig2_HTML.jpg)\n\
    \n图 1-2\n\nAMC 上的查找服务功能和最近访问的服务\n\n我们将在下一节关于机器学习的内容中详细查看如何登录 AWS 并访问 AMC。现在，让我们进入\
    \ AWS 的下一个功能，称为 AWS 命令行界面（AWS CLI）。\n\n## AWS 命令行界面\n\n如果说 AMC 为你提供了访问 AWS 服务的可视化界面，那么\
    \ CLI 则赋予你通过控制台访问相同服务的更高级能力。它由那些已经使用 AWS 一段时间的高级开发人员使用。你只需下载一个工具，然后就可以用它来控制不同的服务、编写脚本，并控制服务的自动化。\n\
    \nAWS 提供了大量资源，如参考文档、GitHub 仓库、论坛等，用于理解 AWS CLI。虽然你可以从默认控制台（如 Windows 的命令提示符或 Linux\
    \ 和 Mac 的终端）使用 AWS CLI，但还有一个专用的 AWS Shell，它提供了一些高级功能。其中一些如下：\n\n*   自动补全支持\n\n\
    *   命令的内联文档\n\n*   操作系统 Shell 命令，也可以从同一个 Shell 中执行\n\n当我们详细讲解机器学习时，会大量使用 CLI。因此，我们将在该部分直接探讨其实际应用。\n\
    \n由于 AWS 提供了如此多的服务，在一本书中涵盖所有内容是不可能的。此外，这本书是关于机器学习的，因此在这里涵盖每一项服务也没有意义。但是，我们将讨论我认为非常重要且常用的三项服务。以下是我们将要讨论的服务：\n\
    \n*   AWS 存储服务\n\n*   AWS 计算服务\n\n*   AWS 网络和内容分发服务\n\n让我们从第一个服务——存储服务开始讨论。\n"
- fmt: "# AWS Storage Services\n\nWhen we work on a cloud platform and use its services,\
    \ obviously we’ll have a lot of data depending on the requirements. For example,\
    \ if we are building a website, then we will have images, videos, and lots of\
    \ other things to store. If we have a machine learning model, then we will have\
    \ terabytes of data to handle. This data can be both structured and unstructured.\
    \ Similarly, for business purposes, we can have multiple Excel sheets or presentations.\
    \ All these data types must be stored somewhere in the cloud, and the cloud platform\
    \ should provide this facility.\n\nAWS provides a lot of options for data storage,\
    \ and we’ll discuss three of them in this section.\n\n- Amazon S3\n- Amazon Elastic\
    \ File System (EFS)\n- AWS Storage Gateway\n\n## Amazon S3\n\nOne of the most\
    \ used services of AWS is Amazon Simple Storage System (S3). It provides you with\
    \ an interface where you can store your data in a similar way to how you store\
    \ it in your local file system. You can create folders and multiple subdirectories\
    \ to organize your data. The following are some of the basic features Amazon S3\
    \ provides:\n\n- It provides scalability, which is currently leading in the industry.\n\
    - It provides real-time data availability.\n- It provides security and optimized\
    \ performance.\n- It has a durability of 99.9999999… percent (11 nines).\n\nS3\
    \ is really simple to use. First let’s understand some of the naming conventions\
    \ used by Amazon S3.\n\n### Buckets\n\nA `bucket` is just like a folder in your\
    \ local file system. It is a container used for storing your files.\n\n### Objects\n\
    \nThe files that you store in S3 are termed `objects`. All the objects are stored\
    \ inside the buckets.\n\n### Keys\n\nEvery object that you store will be given\
    \ a unique identifier called a `key`. Also, not only objects but buckets are provided\
    \ with unique keys.\n\nDoes S3 only provide simple storage, as its name suggests?\
    \ I will say yes and no. Yes, because its main use is storage only, and it is\
    \ really simple. No, because it has lots of other features revolving around the\
    \ storage feature that make it a go-to service for every customer. Let’s see what\
    \ those features are that make S3 so powerful.\n\n- Based on how frequently data\
    \ is being used, S3 provides different types of storage classes.\n  - `S3 STANDARD`:\
    \ Data that needs to be frequently accessed\n  - `S3 STANDARD_IA`: Data that needs\
    \ to be less frequently accessed\n  - `S3 GLACIER`: Data that we want to archive\n\
    - Storage without security is nothing. AWS provides access control to the buckets\
    \ that you have created. You can accomplish this using `policies`. The following\
    \ are the three levels of control based on policies that we can apply:\n  - Who\
    \ can access which bucket?\n  - From which network can the buckets be accessed?\n\
    \  - At what time should the buckets be accessed?\n- You can also create versions\
    \ of your objects. For example, if the same Excel sheet is updated five times,\
    \ then five versions of it can be created.\n\nIn this entire book, Amazon S3 is\
    \ the service that we will be using continuously with machine learning services.\
    \ We will discuss the services in detail in the next section.\n\n## Amazon Elastic\
    \ File System\n\nAmazon Elastic File System (EFS) is an elastic network file system\
    \ that most of the AWS cloud services are compatible with. It is called `elastic`\
    \ because it is scalable as well as shrinkable. If you upload a smaller amount\
    \ of data, then it shrinks its size to accommodate that data. But if you upload\
    \ a larger amount of data, then it can scale up its size. Scaling up can be in\
    \ the petabytes as well. EFS works with the latest version of NFS, which is NFSv4.1.\
    \ Hence, it is compatible with almost everything that you want to develop.\n\n\
    **Tip**\n\nUsing Network File System (NFS), you can store, edit, delete, and perform\
    \ other operations similar to how you perform them in your local system. It is\
    \ a kind of distributed file system that uses `network-attached storage` (NAS).\
    \ The current version of NFS provides advanced features such as strong authentication,\
    \ file caching, and support for Windows File System. NFS can be accessed now on\
    \ global WANs.\n\nJust like S3, EFS provides two kinds of file storage.\n\n- Standard\
    \ Access\n- Infrequent Access\n\nWhen we want to access data frequently, we use\
    \ Standard Access, while infrequently used data can be stored in Infrequent Access\
    \ EFS. Also, just like S3, you can authenticate and authorize data in EFS and\
    \ encrypt it further. Finally, you can add policies, just like S3, for maintaining\
    \ access control.\n\n## AWS Storage Gateway\n\nAWS Storage Gateway is a hybrid\
    \ infrastructure provided by AWS. If you want to use your on-premise infrastructure\
    \ for all your storage needs but still you want some functionality by which you\
    \ can use the cloud storage services of AWS, then Storage Gateway is the best\
    \ solution.\n\nStorage Gateway provides three kinds of solutions.\n\n- File Gateway\n\
    - Volume Gateway\n- Tape Gateway\n\n### File Gateway\n\nUsing this service, all\
    \ the files are stored in S3. It gives you a virtual application with which you\
    \ can manage all your files in S3. Retrieving/storing files is done using protocols\
    \ such as Network File System or Server Message Block. The virtual software that\
    \ we are talking about is nothing but a virtual machine with which you manage\
    \ your files. This can be with VMware ESXi or Microsoft Hyper-V.\n\n### Volume\
    \ Gateway\n\nInstead of files, you can directly store volumes in the cloud that\
    \ you can later mount as Internet Small Computer System Interface (iSCSI). Again,\
    \ the software that is deployed on-premise is a virtual machine. The following\
    \ kinds of volumes are supported:\n\n- Cached volumes\n- Stored volumes\n\nHaving\
    \ cached volumes means storing the data entirely in S3, and then the frequently\
    \ used data is cached in the local system. Figure [1-6](#495447_1_En_1_Chapter.xhtml#Fig6)\
    \ shows the cached volume gateway architecture provided by AWS.\n\n![../images/495447_1_En_1_Chapter/495447_1_En_1_Fig6_HTML.jpg](images/495447_1_En_1_Chapter/495447_1_En_1_Fig6_HTML.jpg)\n\
    \nFigure 1-6 Cached volumes, Storage Gateway architecture\n\nFigure [1-6](#495447_1_En_1_Chapter.xhtml#Fig6)\
    \ is divided into three parts. The left part shows the actual users using the\
    \ local architecture. The middle component is the local infrastructure of an organization.\
    \ The right component has an S3 connection for the data backup.\n\nWhen you store\
    \ your entire data locally and then back up the snapshot versions of this data\
    \ on the cloud, then it is the stored volume support of Volume Gateway. We can\
    \ use this in the case of disaster recovery. For example, if you lose your local\
    \ data, you can download the latest snapshot from the cloud. Again, we use S3\
    \ as the storage service here. Figure [1-7](#495447_1_En_1_Chapter.xhtml#Fig7)\
    \ shows the architecture of a storage volume.\n\n![../images/495447_1_En_1_Chapter/495447_1_En_1_Fig7_HTML.jpg](images/495447_1_En_1_Chapter/495447_1_En_1_Fig7_HTML.jpg)\n\
    \nFigure 1-7 Stored volumes, Storage Gateway architecture\n\nThe architecture\
    \ in Figure [1-7](#495447_1_En_1_Chapter.xhtml#Fig7) is almost the same as Figure\
    \ [1-6](#495447_1_En_1_Chapter.xhtml#Fig6), but instead of storing the entire\
    \ data, we are storing only snapshots of the locally saved data."
  raw: "## AWS Storage Services\n\nWhen we work on a cloud platform and use its services,\
    \ obviously we’ll have a lot of data depending on the requirements. For example,\
    \ if we are building a website, then we will have images, videos, and lots of\
    \ other things to store. If we have a machine learning model, then we will have\
    \ terabytes of data to handle. This data can be both structured and unstructured.\
    \ Similarly, for business purposes, we can have multiple Excel sheets or presentations.\
    \ All these data types must be stored somewhere in the cloud, and the cloud platform\
    \ should provide this facility.\n\nAWS provides a lot of options for data storage,\
    \ and we’ll discuss three of them in this section.\n\n*   Amazon S3\n\n*   Amazon\
    \ Elastic File System (EFS)\n\n*   AWS Storage Gateway\n\n### Amazon S3\n\nOne\
    \ of the most used services of AWS is Amazon Simple Storage System (S3). It provides\
    \ you with an interface where you can store your data in a similar way to how\
    \ you store it in your local file system. You can create folders and multiple\
    \ subdirectories to organize your data. The following are some of the basic features\
    \ Amazon S3 provides:\n\n*   It provides scalability, which is currently leading\
    \ in the industry.\n\n*   It provides real-time data availability.\n\n*   It provides\
    \ security and optimized performance.\n\n*   It has a durability of 99.9999999…\
    \ percent (11 nines).\n\nS3 is really simple to use. First let’s understand some\
    \ of the naming conventions used by Amazon S3.\n\n#### Buckets\n\nA *bucket* is\
    \ just like a folder in your local file system. It is a container used for storing\
    \ your files.\n\n#### Objects\n\nThe files that you store in S3 are termed *objects*.\
    \ All the objects are stored inside the buckets.\n\n#### Keys\n\nEvery object\
    \ that you store will be given a unique identifier called a *key*. Also, not only\
    \ objects but buckets are provided with unique keys.\n\nDoes S3 only provide simple\
    \ storage, as its name suggests? I will say yes and no. Yes, because its main\
    \ use is storage only, and it is really simple. No, because it has lots of other\
    \ features revolving around the storage feature that make it a go-to service for\
    \ every customer. Let’s see what those features are that make S3 so powerful.\n\
    \n*   Based on how frequently data is being used, S3 provides different types\
    \ of storage classes.\n    *   **S3 STANDARD**: Data that needs to be frequently\
    \ accessed\n\n    *   **S3 STANDARD_IA**: Data that needs to be less frequently\
    \ accessed\n\n    *   **S3 GLACIER**: Data that we want to archive\n\n*   Storage\
    \ without security is nothing. AWS provides access control to the buckets that\
    \ you have created. You can accomplish this using *policies*. The following are\
    \ the three levels of control based on policies that we can apply:\n    *   Who\
    \ can access which bucket?\n\n    *   From which network can the buckets be accessed?\n\
    \n    *   At what time should the buckets be accessed?\n\n*   You can also create\
    \ versions of your objects. For example, if the same Excel sheet is updated five\
    \ times, then five versions of it can be created.\n\nIn this entire book, Amazon\
    \ S3 is the service that we will be using continuously with machine learning services.\
    \ We will discuss the services in detail in the next section.\n\n### Amazon Elastic\
    \ File System\n\nAmazon Elastic File System (EFS) is an elastic network file system\
    \ that most of the AWS cloud services are compatible with. It is called *elastic*\
    \ because it is scalable as well as shrinkable. If you upload a smaller amount\
    \ of data, then it shrinks its size to accommodate that data. But if you upload\
    \ a larger amount of data, then it can scale up its size. Scaling up can be in\
    \ the petabytes as well. EFS works with the latest version of NFS, which is NFSv4.1\\\
    . Hence, it is compatible with almost everything that you want to develop.\n\n\
    Tip\n\nUsing Network File System (NFS), you can store, edit, delete, and perform\
    \ other operations similar to how you perform them in your local system. It is\
    \ a kind of distributed file system that uses *network-attached storage* (NAS).\
    \ The current version of NFS provides advanced features such as strong authentication,\
    \ file caching, and support for Windows File System. NFS can be accessed now on\
    \ global WANs.\n\nJust like S3, EFS provides two kinds of file storage.\n\n* \
    \  Standard Access\n\n*   Infrequent Access\n\nWhen we want to access data frequently,\
    \ we use Standard Access, while infrequently used data can be stored in Infrequent\
    \ Access EFS. Also, just like S3, you can authenticate and authorize data in EFS\
    \ and encrypt it further. Finally, you can add policies, just like S3, for maintaining\
    \ access control.\n\n### AWS Storage Gateway\n\nAWS Storage Gateway is a hybrid\
    \ infrastructure provided by AWS. If you want to use your on-premise infrastructure\
    \ for all your storage needs but still you want some functionality by which you\
    \ can use the cloud storage services of AWS, then Storage Gateway is the best\
    \ solution.\n\nStorage Gateway provides three kinds of solutions.\n\n*   File\
    \ Gateway\n\n*   Volume Gateway\n\n*   Tape Gateway\n\n#### File Gateway\n\nUsing\
    \ this service, all the files are stored in S3\\. It gives you a virtual application\
    \ with which you can manage all your files in S3. Retrieving/storing files is\
    \ done using protocols such as Network File System or Server Message Block. The\
    \ virtual software that we are talking about is nothing but a virtual machine\
    \ with which you manage your files. This can be with VMware ESXi or Microsoft\
    \ Hyper-V.\n\n#### Volume Gateway\n\nInstead of files, you can directly store\
    \ volumes in the cloud that you can later mount as Internet Small Computer System\
    \ Interface (iSCSI). Again, the software that is deployed on-premise is a virtual\
    \ machine. The following kinds of volumes are supported:\n\n*   Cached volumes\n\
    \n*   Stored volumes\n\nHaving cached volumes means storing the data entirely\
    \ in S3, and then the frequently used data is cached in the local system. Figure\
    \ [1-6](#495447_1_En_1_Chapter.xhtml#Fig6) shows the cached volume gateway architecture\
    \ provided by AWS.\n\n![../images/495447_1_En_1_Chapter/495447_1_En_1_Fig6_HTML.jpg](images/495447_1_En_1_Chapter/495447_1_En_1_Fig6_HTML.jpg)\n\
    \nFigure 1-6\n\nCached volumes, Storage Gateway architecture\n\nFigure [1-6](#495447_1_En_1_Chapter.xhtml#Fig6)\
    \ is divided into three parts. The left part shows the actual users using the\
    \ local architecture. The middle component is the local infrastructure of an organization.\
    \ The right component has an S3 connection for the data backup.\n\nWhen you store\
    \ your entire data locally and then back up the snapshot versions of this data\
    \ on the cloud, then it is the stored volume support of Volume Gateway. We can\
    \ use this in the case of disaster recovery. For example, if you lose your local\
    \ data, you can download the latest snapshot from the cloud. Again, we use S3\
    \ as the storage service here. Figure [1-7](#495447_1_En_1_Chapter.xhtml#Fig7)\
    \ shows the architecture of a storage volume.\n\n![../images/495447_1_En_1_Chapter/495447_1_En_1_Fig7_HTML.jpg](images/495447_1_En_1_Chapter/495447_1_En_1_Fig7_HTML.jpg)\n\
    \nFigure 1-7\n\nStored volumes, Storage Gateway architecture\n\nThe architecture\
    \ in Figure [1-7](#495447_1_En_1_Chapter.xhtml#Fig7) is almost the same as Figure\
    \ [1-6](#495447_1_En_1_Chapter.xhtml#Fig6), but instead of storing the entire\
    \ data, we are storing only snapshots of the locally saved data."
  trans: "\n## AWS 存储服务\n\n当我们在云平台上工作并使用其服务时，显然会根据需求产生大量数据。例如，如果我们正在构建一个网站，那么我们将需要存储图像、视频和许多其他内容。如果我们有一个机器学习模型，那么我们将需要处理数\
    \ TB 的数据。这些数据可以是结构化的，也可以是非结构化的。同样，出于业务目的，我们可能拥有多个 Excel 表格或演示文稿。所有这些数据类型都必须存储在云中的某个位置，而云平台应提供此功能。\n\
    \nAWS 提供了多种数据存储选项，本节我们将讨论其中三种。\n\n*   Amazon S3\n\n*   Amazon 弹性文件系统 (EFS)\n\n\
    *   AWS Storage Gateway\n\n### Amazon S3\n\nAWS 最常用的服务之一是 Amazon Simple Storage\
    \ System (S3)。它为您提供了一个界面，您可以像在本地文件系统中存储数据一样存储数据。您可以创建文件夹和多个子目录来组织数据。以下是 Amazon\
    \ S3 提供的一些基本功能：\n\n*   它提供可扩展性，目前在行业中处于领先地位。\n\n*   它提供实时数据可用性。\n\n*   它提供安全性和优化的性能。\n\
    \n*   其持久性高达 99.9999999…%（11 个 9）。\n\nS3 使用起来非常简单。首先，让我们了解一些 Amazon S3 使用的命名约定。\n\
    \n#### 存储桶\n\n*存储桶*就像本地文件系统中的一个文件夹。它是一个用于存储文件的容器。\n\n#### 对象\n\n您在 S3 中存储的文件称为*对象*。所有对象都存储在存储桶内。\n\
    \n#### 键\n\n您存储的每个对象都会被赋予一个称为*键*的唯一标识符。此外，不仅对象，存储桶也具有唯一的键。\n\nS3 是否如其名称所示仅提供简单的存储？我的回答是既是也不是。说是，因为它的主要用途仅仅是存储，而且确实非常简单。说不是，因为它围绕存储功能还有许多其他特性，使其成为每个客户的首选服务。让我们看看是哪些特性让\
    \ S3 如此强大。\n\n*   根据数据使用的频率，S3 提供不同类型的存储类别。\n    *   **S3 STANDARD**：需要频繁访问的数据\n\
    \n    *   **S3 STANDARD_IA**：需要较少访问的数据\n\n    *   **S3 GLACIER**：我们希望归档的数据\n\n\
    *   没有安全性的存储毫无意义。AWS 为您创建的存储桶提供访问控制。您可以使用*策略*来实现这一点。以下是我们可以应用的基于策略的三个控制级别：\n \
    \   *   谁可以访问哪个存储桶？\n\n    *   可以从哪个网络访问存储桶？\n\n    *   应该在什么时间访问存储桶？\n\n*   您还可以创建对象的版本。例如，如果同一个\
    \ Excel 表格被更新了五次，那么可以创建它的五个版本。\n\n在整本书中，Amazon S3 是我们将随机器学习服务持续使用的服务。我们将在下一节详细讨论这些服务。\n\
    \n### Amazon 弹性文件系统\n\nAmazon 弹性文件系统 (EFS) 是一个弹性网络文件系统，与大多数 AWS 云服务兼容。它被称为*弹性*，是因为它既可扩展也可收缩。如果您上传的数据量较小，它会缩小其大小以适应这些数据。但如果您上传的数据量较大，它可以扩展其大小。扩展规模可达\
    \ PB 级。EFS 与最新版本的 NFS（即 NFSv4.1）配合使用。因此，它几乎与您想要开发的任何东西兼容。\n\n提示\n\n使用网络文件系统 (NFS)，您可以像在本地系统中执行操作一样，进行存储、编辑、删除和其他操作。它是一种使用*网络附加存储*\
    \ (NAS) 的分布式文件系统。当前版本的 NFS 提供了高级功能，例如强身份验证、文件缓存以及对 Windows 文件系统的支持。现在可以在全球广域网上访问\
    \ NFS。\n\n与 S3 类似，EFS 提供两种文件存储类型。\n\n*   标准访问\n\n*   不频繁访问\n\n当我们想要频繁访问数据时，我们使用标准访问，而不常使用的数据可以存储在\
    \ EFS 的不频繁访问中。此外，与 S3 一样，您可以在 EFS 中对数据进行身份验证和授权，并进一步对其进行加密。最后，您可以像 S3 一样添加策略，以维护访问控制。\n\
    \n### AWS Storage Gateway\n\nAWS Storage Gateway 是 AWS 提供的一种混合基础设施。如果您希望使用本地基础设施来满足所有存储需求，但又希望获得一些功能，以便能够使用\
    \ AWS 的云存储服务，那么 Storage Gateway 是最佳解决方案。\n\nStorage Gateway 提供三种解决方案。\n\n*   文件网关\n\
    \n*   卷网关\n\n*   磁带网关\n\n#### 文件网关\n\n使用此服务，所有文件都存储在 S3 中。它为您提供一个虚拟应用程序，您可以使用它来管理\
    \ S3 中的所有文件。检索/存储文件是通过网络文件系统或服务器消息块等协议完成的。我们所说的虚拟软件不过是一个用于管理文件的虚拟机。这可以基于 VMware\
    \ ESXi 或 Microsoft Hyper-V。\n\n#### 卷网关\n\n您可以直接将卷存储在云中，而不是文件，之后可以将其挂载为 Internet\
    \ 小型计算机系统接口 (iSCSI)。同样，部署在本地的软件是一个虚拟机。支持以下类型的卷：\n\n*   缓存卷\n\n*   存储卷\n\n拥有缓存卷意味着将数据完全存储在\
    \ S3 中，然后经常使用的数据被缓存在本地系统中。图 1-6 显示了 AWS 提供的缓存卷网关架构。\n\n![../images/495447_1_En_1_Chapter/495447_1_En_1_Fig6_HTML.jpg](img/495447_1_En_1_Fig6_HTML.jpg)\n\
    \n图 1-6\n\n缓存卷，Storage Gateway 架构\n\n图 1-6 分为三个部分。左侧部分显示了使用本地架构的实际用户。中间组件是组织的本地基础设施。右侧组件具有用于数据备份的\
    \ S3 连接。\n\n当您将整个数据存储在本地，然后将这些数据的快照版本备份到云端时，这就是卷网关的存储卷支持。我们可以在灾难恢复的情况下使用它。例如，如果您丢失了本地数据，您可以从云端下载最新的快照。同样，我们在这里使用\
    \ S3 作为存储服务。图 1-7 显示了存储卷的架构。\n\n![../images/495447_1_En_1_Chapter/495447_1_En_1_Fig7_HTML.jpg](img/495447_1_En_1_Fig7_HTML.jpg)\n\
    \n图 1-7\n\n存储卷，Storage Gateway 架构\n\n图 1-7 中的架构与图 1-6 几乎相同，但不同之处在于，我们不是存储整个数据，而是仅存储本地保存数据的快照。\n"
- fmt: '### Tape Gateway


    This is used for archiving data. For this we can use Amazon S3 Glacier or Deep
    Archive as the storage service. This can also be deployed locally using virtual
    machines. The architecture given in Figure [1-8](#495447_1_En_1_Chapter.xhtml#Fig8)
    shows how tape gateway works.


    ![../images/495447_1_En_1_Chapter/495447_1_En_1_Fig8_HTML.jpg](images/495447_1_En_1_Chapter/495447_1_En_1_Fig8_HTML.jpg)


    Figure 1-8


    Tape gateway, Storage Gateway architecture


    You can see in the architecture that different infrastructures are storing the
    data in their respective S3 buckets. Later, the data of all the S3 buckets is
    combined and then stored in the Amazon S3 Glacier. Virtual tapes are nothing but
    a means of storing data. Just like how physical tapes were empty and then filled
    at the time when they were used, similarly virtual tapes can also be blank and
    can be filled with data as per your needs.


    Now that we have seen how Storage Services of AWS operates and looked at different
    services, let’s move on and explore the compute services.


    ## AWS Compute Services


    In the previous section, you learned how to store data using AWS services. In
    this section, we will look at some compute services provided by AWS. When we run
    an application, play games, or develop something, we require the computational
    power of the system. We measure this in terms of the RAM, processor, graphics
    card, etc. Sometimes we may have a big system requirement but not be able to get
    it due to lack of money or lack of resources. That is the reason why Amazon provides
    different kinds of services for all computational requirements. In this section,
    we will discuss the following AWS compute services:


    *   Amazon EC2

    *   Amazon ECR


    ### Amazon EC2


    Elastic Component Cloud (EC2) reduces the burden for a user to invest in hardware
    requirements. Whatever the requirement, EC2 allows you to create that many virtual
    servers where immediately the work can be processed. In addition, instead of having
    a static infrastructure, it is dynamic. This means that if a sudden surge in computation
    requirements occurs, EC2 automatically scales itself up, without disrupting the
    ongoing processes.


    The following are some of the features that EC2 gives its users:


    *   It provides an environment where we can do our computation-heavy work. This
    is done in a virtual computing environment with what AWS calls *instances*.

    *   Whatever your software or hardware needs, you can configured them using the
    service Amazon Machine Images (AMIs).

    *   It provides security to all the instances you spin up. It also provides security
    groups that help the user configure firewalls, ports, IP ranges, etc.


    In addition, there are a lot of other services that help the users in their day-to-day
    coding and development life.


    The instance types that EC2 provides can be grouped into the following categories:


    *   General purpose

    *   Compute optimized

    *   Memory optimized

    *   Storage optimized

    *   Accelerated computing


    #### General-Purpose Types


    These types provide a balance of computational power, storage, and networking.
    They are further divided into the following groups:


    *   A1

    *   T3

    *   T2

    *   M6g

    *   M5

    *   M5a

    *   M5n

    *   M4


    #### Compute Optimized


    When the work requires high computational usage and requires heavy processors,
    you can use compute-optimized instances. They can be used for media tasks, scientific
    tasks, fast web servers, or even game servers. They can be grouped into the following
    types:


    *   C5

    *   C5n

    *   C4


    You can find more information about these groups at [`https://aws.amazon.com/ec2/instance-types/`](https://aws.amazon.com/ec2/instance-types/).


    #### Memory Optimized


    If the work requires working with large datasets, you need memory-optimized instances.
    They are grouped into the following types:


    *   R

    *   R5a

    *   R5n

    *   R4

    *   X1e

    *   X1

    *   High Memory

    *   z1d


    #### Accelerated Computing


    For all machine learning and deep learning applications, these kinds of instances
    are preferred. These systems are really fast, and their precision is also very
    high. They can be grouped into the following types:


    *   P3

    *   P2

    *   Inf1

    *   G4

    *   G3

    *   F1


    #### Storage Optimized


    This type is best if you want to work on huge datasets and want less latency with
    faster read and write operations. They can be grouped into the following types:


    *   I3

    *   I3en

    *   D2

    *   H1


    You can find detailed information about every instance types at [`https://aws.amazon.com/ec2/instance-types/`](https://aws.amazon.com/ec2/instance-types/).


    ### Other Services


    AWS also provides other services with most of the previous instance types. This
    is done to give you financial benefits based on your usage. These services include
    the following:


    *   On-demand instances

    *   Reserved instances

    *   Spot instances


    If you think your work is not going to take a lot of time, like for days or months,
    then you can go for *on-demand instances*. These instances are charged on a per-hour
    basis. Whatever compute or memory and storage size you want, you can use that,
    but the payment will be based on the hours used.


    *Reserved instances* are for longer-term usage, and hence the discount that a
    person receives is up to 75 percent of the on-demand instances. This also provides
    options to change types.


    There are times when a lot of EC2 instances get unused. *Spot instances* let you
    take advantage of those instances, and you can get up to a 90 percent discount
    as compared to on-demand instances when using spot instances.


    ## Amazon Elastic Container Registry


    In recent times, Docker has taken the industry by storm. It allows companies to
    separate their infrastructure from their coding. In simple words, Docker provides
    you with a platform where you can develop and ship code efficiently without worrying
    about the underlying architecture. Amazon ECR is a repository for all the Docker
    images that you want to run in AWS.


    Once you spin up an EC2 instance, you have an option to run any Docker image on
    that instance. AWS has its own prebuilt Docker images that you can import, or
    you can have your own custom-made Docker images uploaded on ECR and then imported
    inside the EC2 instance.


    Amazon ECR has the following components:


    *   Registry

    *   Authentication token

    *   Repository

    *   Policy

    *   Image


    The registry is like a normal register, where you want to make an entry to every
    image that you upload to ECR. To make sure that only the right person is able
    to access the ECR for uploading images, authentication tokens are used. The repository
    is the place that actually stores your Docker images. Images are your actual Docker
    files. These are the files that you have created containing all your dependencies.
    You use the image to store them in ECR and import them in EC2.


    You will understand the operations of ECR in detail when we cover SageMaker in
    later chapters.


    ## AWS Networking and Content Delivery Services


    In this section, we will discuss three important services of AWS in this domain.


    *   Amazon VPC

    *   Amazon API Gateway

    *   Amazon CloudFront'
