  trans: '

    ### SageMaker 中的自定义算法


    在上一节中，我们了解了 SageMaker 支持的不同算法。但如果你想使用 SageMaker 不支持的另一种算法，该怎么办？例如，除了 blazing text，如果你想使用
    BERT 模型呢？在这种情况下，我们可以使用自定义 Docker 镜像，用 SageMaker 的术语来说，这被称为*自带模型*。正如你之前所见，我们所需要的只是一个用于训练和推理的
    Docker 镜像、S3 存储桶中的训练文件、输出 S3 存储桶位置等。因此，要让你的自定义模型在 SageMaker 中运行，你需要遵循以下步骤：


    1.  编写训练脚本。


    2.  在 Docker 中安装所有重要包后，在 Docker 容器内测试训练脚本。


    3.  编辑 Docker 内的推理脚本。这很可能是一个用 Python 和 Flask 编写的脚本。


    4.  测试推理脚本。


    5.  一切正常后，将 Docker 镜像连同训练和推理脚本推送到 ECR。


    6.  现在，你可以通过传递 ECR 的 URL 来调用此算法。


    我们将在后续章节中探讨如何在 SageMaker 中创建自定义算法。


    SageMaker 还有许多其他功能，我们将在本书中持续讨论。但就目前而言，这个介绍已经足够。在接下来的章节中，我们将深入探讨 SageMaker 以及如何在其中执行代码和算法。


    现在，让我们探索 AWS 在 SageMaker 之外提供的其他一些机器学习服务。


    ## AWS 的其他机器学习服务


    让我们从查看 Amazon Comprehend 开始本节内容，这是 AWS 中专门用于文本分析的服务。


    ### Amazon Comprehend


    Amazon Comprehend 是 AWS 提供的用于 NLP 相关任务的服务。如果一家公司有一组文档，需要从中提取一些信息以得出特定见解，那么 Amazon
    Comprehend 就是应该使用的服务。同样的任务也可以在 SageMaker 中完成，但 Comprehend 所需的编码量最少。对于编码经验较少的人来说，这是一个理想的解决方案。以下是可以从文档中提取的关键元素：


    *   实体，例如组织、地点、名称等。


    *   文档中的关键短语


    *   句子的语言和情感


    *   句子的语法和句法结构


    除了这些功能之外，还可以构建自定义分类器，根据相似性将文档分类到不同类别。此外，除了可以提取的默认实体之外，还可以从文档中提取自定义实体。这可以通过训练 Amazon
    Comprehend 的基础模型来实现。Amazon Comprehend 的所有 NLP 任务都基于神经网络。这意味着所有执行的任务都是基于深度学习的，并且也可以进行自定义。


    此外，当我们可以根据单词的频率和分布找到所有文档中存在的关键主题时，我们可以使用 Amazon Comprehend 进行主题建模。对于此任务，Amazon
    建议至少使用 1,000 个文档。


    ### Amazon Polly


    Amazon Polly 是 AWS 提供的用于语音合成的服务。你提供给 Polly 的任何文本，它都会转换成逼真的语音。它支持多种语言，并且可以根据我们选择的语音进行自定义。与
    Comprehend 一样，Amazon Polly 的基础也是神经网络。它被称为*神经文本转语音*（NTTS）模型。这就是为什么与竞争对手相比，Polly
    拥有最像人类的声音。


    Polly 的发音准确度超高，并且包括缩写、首字母缩略词扩展以及日期/时间解释；它还支持同形异义词消歧。这意味着拼写相同但根据使用句子不同而含义不同的单词，Polly
    也能理解。这个过程被称为*上下文感知分析*。


    Polly 提供男声和女声，并支持三种英式英语语音和八种美式英语语音。Polly 甚至支持听起来像新闻播音员的语音。


    ### Amazon Rekognition


    Amazon Rekognition 用于理解图像或视频中存在的对象，然后提取它们。这些对象可能包括人物、文本、场景、活动、不当内容等。它具有面部分析、面部比较和面部搜索的能力。与其他服务一样，Amazon
    Rekognition 的后端是深度学习，使用神经网络来理解模式。


    Amazon Rekognition 的开发是持续进行的，这意味着数据会不断更新并输入给模型，标签数量也在增加。这意味着模型对不同类别的准确性会不断提高。Amazon
    Rekognition 的一些常见用例包括：


    *   在图像或视频中搜索是否存在某个对象


    *   使用基于面部特征的认证


    *   理解情感表达，例如快乐、悲伤、热情等


    *   使用人口统计信息，例如性别、地点、类型等


    *   检测视频或图像中的成人和暴力内容


    *   从图像中识别和提取文本内容


    如果针对与问题陈述相关的特定数据集有需要，我们还可以在自定义标签上训练 Amazon Rekognition。


    ### Amazon Translate


    机器翻译是 NLP 的应用之一，我们将一种语言翻译成另一种语言。亚马逊专门为此用例提供了一项服务，它支持多种语言之间的神经机器翻译。这项服务被称为 Amazon
    Translate。


    该服务基于编码器-解码器架构，类似于 BERT 和其他语言模型。在这里，首先使用编码器架构理解输入语言，然后使用解码器架构完成翻译任务。它还使用了一种称为*注意力层*的技术，该技术试图通过理解单词之间的关系来理解句子的上下文。将所有这些与长短期记忆网络（LSTM）等神经网络相结合，就实现了翻译过程。


    ### Amazon Transcribe


    当我们有多个音频文件，并且想要将剪辑中说的任何内容转换为文本时，我们可以使用 Amazon Transcribe。它有多种应用，包括与其他一些亚马逊服务的组合。以下是一些示例：


    *   新闻剪辑可以首先使用 Transcribe 从语音转换为文本，然后使用 Translate 转换为你选择的语言，最后使用 Polly 大声朗读出来。


    *   可以录制和转录客户服务电话。最后，可以使用 Comprehend 来理解转录文本的不同方面。


    *   它可以用于提供实时字幕。


    Amazon Transcribe 可用于根据声音识别说话者。它可以用来区分提问者和回答者，例如在录制的新闻发布会上。此外，如果你觉得 Transcribe
    无法理解某些单词，则可以通过提供自定义词汇表来增加 Transcribe 的词汇量。


    ### Amazon Textract


    Amazon Textract 用于检测 PDF 格式或图像格式文档中存在的文本。它还可以从表格数据或其他类型的文档格式中提取信息，这些格式可以包括财务报表提取、医疗记录提取等应用。与其他服务一样，Textract
    也建立在深度神经网络架构之上，通过访问超过十亿张图像和视频，其权重几乎每天都在更新。Textract 也可用于从表单、CSV 工作表、网站等中提取数据。

    '
- fmt: '# Conclusion


    In this chapter, you got a machine learning–specific overview of AWS. In the next
    chapter, we will be looking at data processing using SageMaker and explore other
    services as well, which will help us in data processing.


    # 5. Data Processing in AWS


    Data processing is one of the first steps of the machine learning pipeline. As
    different sources of data have different formats, it becomes almost impossible
    to handle all the formats inside the model. Hence, we give the data a synchronous
    structure, and then we try to process different unwanted sections of it. These
    sections include the null values, outliers, dummification of categorical columns,
    standardization of numerical columns, etc. We can use SageMaker effectively to
    process the data in all these domains. This chapter assumes that you have knowledge
    about different data processing techniques and their implementation in Python.
    This chapter will be dedicated to using SageMaker to do this.


    ## Preprocessing in Jupyter Notebook


    In between receiving the raw data and feeding the data to the model, there are
    a lot of steps the data goes through. These steps are the data processing steps.
    Data processing includes feature selection, feature transformation, feature imputation,
    feature normalization, etc. Once all these steps are done, we proceed to splitting
    the data into a training set and a validation set, which are finally given to
    the model.


    In this section, we will be looking at some of the basic data processing steps
    that we can follow.


    1. Loading the raw data

    2. Imputing the null values, which means how to replace the null values with some
    actual values.

    3. Splitting the data into categorical and numerical data frames

    4. “Dummifying” categorical data

    5. Imputing the remaining null values

    6. Concatenating the categorical and numerical data frames

    7. Normalizing the final data frame

    8. Splitting the data into train and validation sets


    This chapter assumes that you have hands-on knowledge of Pandas, Numpy, and Scikit-Learn.
    These packages are required for the data processing steps. If not, then it is
    recommended that you explore these packages to get some hands-on experience before
    moving on to learning SageMaker.


    The dataset that we will be using for processing is the Big Mart sales dataset,
    which can be downloaded from Kaggle at [`www.kaggle.com/devashish0507/big-mart-sales-prediction`](http://www.kaggle.com/devashish0507/big-mart-sales-prediction).


    This dataset contains a lot of information related to the sales of items in a
    retail shop. The task is to predict the sales of items. We will not be looking
    at the prediction part in this chapter. Rather, we’ll be exploring only the data
    processing part of the process. Let’s start by reading the train file using the
    Pandas framework.


    ```

    import pandas as pd

    data = pd.read_csv("Train.csv")

    ```


    Now the entire CSV sheet’s columns are saved in a data frame object named `data`.
    Next, let’s explore the top five rows of the dataset.


    ```

    data.head()

    ```


    This is going to give us the output shown in Figure 5-1.


    ![../images/495447_1_En_5_Chapter/495447_1_En_5_Fig1_HTML.jpg](images/495447_1_En_5_Chapter/495447_1_En_5_Fig1_HTML.jpg)


    Figure 5-1: Top five rows of data


    As you can see, there are a lot of other columns as well that are not shown in
    Figure 5-1. So, let’s look at the shape of the data as well as the list of all
    the columns.


    ```

    print(data.shape)

    print("*****************************************************************")

    print(data.columns)

    ```


    This gives us the output shown in Figure 5-2.


    ![../images/495447_1_En_5_Chapter/495447_1_En_5_Fig2_HTML.jpg](images/495447_1_En_5_Chapter/495447_1_En_5_Fig2_HTML.jpg)


    Figure 5-2: Shape of data and columns


    As we can see, there are 8,523 rows and 12 columns. Also, we can see the names
    of all the columns in the list given.


    As we have seen in the steps of processing, the next step is to impute the null
    values. So, let’s take a look at all the columns that have null values.


    ```

    data.isna().sum()

    ```


    This code gives us the output shown in Figure 5-3.


