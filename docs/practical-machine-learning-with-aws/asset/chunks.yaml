  trans: '

    ### 安装 Boto3


    使用 Boto3 的第一步是在本地主机环境中安装它。除了 Boto3，我们还需要安装 `awscli`，它将帮助我们完成与 AWS 的身份验证，以及 `s3fs`，后者将帮助我们与
    S3 存储桶进行通信。我们将使用 `pip` 进行安装，如下所示：


    ```

    pip install boto3

    pip install awscli

    pip install s3fs

    ```


    安装完成后，我们需要配置 AWS 的凭证。为此，我们将运行以下命令：


    ```

    aws configure

    ```


    这将要求您提供以下四项信息：


    *   AWS 访问密钥


    *   AWS 秘密访问密钥


    *   默认区域名称


    *   默认输出格式


    提供这些信息后，我们就可以轻松使用 Boto3 连接到 AWS 服务。我已经向您展示了在创建 IAM 角色时如何获取访问密钥和秘密访问密钥。默认区域名称将是
    `us-east-2`，但您可以通过查看 AWS 管理控制台右上角来重新确认。它会显示您的位置。如图 5-18 所示，我已经传入了所需的信息。


    ![../images/495447_1_En_5_Chapter/495447_1_En_5_Fig18_HTML.jpg](img/495447_1_En_5_Fig18_HTML.jpg)


    图 5-18


    设置 AWS 凭证


    这部分完成后，我们可以启动 Jupyter Notebook（本地系统笔记本），并在我们安装所有包并配置了 AWS 的同一环境中创建一个笔记本。


    ### 初始化 Boto3


    在笔记本中，第一步是初始化 Boto3。为此，我们将使用以下脚本：


    ```

    import boto3

    import s3fs

    region = boto3.session.Session().region_name

    client = boto3.client(''sagemaker'')

    ```


    在上一步中，区域由您设置。相同的区域将被提取并存储在变量 `region` 中。接下来是设置 Boto3。Boto3 可以为 AWS 的所有服务进行设置。目前，我们将使用
    SageMaker；因此，我们将调用 Boto3 的 `client` 类，并用 SageMaker 初始化它（`client = boto3.client(''sagemaker'')`）。


    ### 修改 Dockerfile 并推送镜像


    现在，我们将使用 Boto3 API 调用处理作业方法。这将创建我们在上一节中看到的相同处理作业。但是，需要进行一些小的更改，我们将逐一探讨。


    我们将使用 `create_processing_job` 方法来运行数据处理作业。要了解有关此方法或 Boto3 提供的所有与 SageMaker 相关的方法的更多信息，您可以访问
    [`https://boto3.amazonaws.com/v1/documentation/api/latest/reference/services/sagemaker.html`](https://boto3.amazonaws.com/v1/documentation/api/latest/reference/services/sagemaker.html)。


    但在此之前，我们必须对我们的 Docker 容器和处理 Python 文件进行一些更改。对于 Docker 容器，我们需要将 `preprocessing.py`
    脚本复制到其中，以便 Boto3 方法可以直接运行该脚本。为此，我们将对 Dockerfile 进行以下更改：


    ```

    FROM python:3.7-slim-buster

    RUN pip3 install pandas==0.25.3 scikit-learn==0.21.3

    ENV PYTHONUNBUFFERED=TRUE

    ENV PATH="/opt/ml/code:${PATH}"

    COPY preprocessing.py /opt/ml/code/preprocessing.py

    WORKDIR /opt/ml/code

    ```


    我们在现有的 Dockerfile 中添加了三行新内容。`ENV PATH="/opt/ml/code:${PATH}"` 这一行将环境路径设置为 `/opt/ml/code`。我们将通过
    `COPY preprocessing.py /opt/ml/code/preprocessing.py` 把我们的脚本 `preprocessing.py`
    放置在其中。最后，我们将工作目录设置为同一个文件夹：`WORKDIR /opt/ml/code`。这是必需的，以便 Docker 容器知道脚本文件所在的位置，这将有助于其执行。


    在 Dockerfile 中做出更改后，我们将对构建镜像并将其推送到 ECR 的脚本进行更改。我们需要做的唯一更改是添加一行，授予容器操作 `preprocessing.py`
    脚本的权限。否则，Docker 可能没有权限打开和查看其内容。


    ```

    # 创建 ECR 仓库并推送 Docker 镜像

    ! chmod +x docker/preprocessing.py # 此行授予预处理脚本读写权限

    ! docker build -t $ecr_repository docker # 构建镜像

    ! $(aws ecr get-login --region $region --registry-ids $account_id --no-include-email)
    # 登录 AWS

    ! aws ecr create-repository --repository-name $ecr_repository # 创建 ECR 仓库

    ! docker tag {ecr_repository + tag} $processing_repository_uri # 标记镜像以区别于其他镜像

    ! docker push $processing_repository_uri # 将镜像推送到 ECR

    ```


    完成此步骤后，我们就可以运行 Boto3 处理作业了。

    '
- fmt: '### Creating a Processing Job


    In a nutshell, we need information about four sections to create a processing
    job using `Boto3`.


    - Input data information (`ProcessingInput`)

    - Output data information (`ProcessingOutput`)

    - Resource information (`ProcessingResources`)

    - Container information (`AppSpecification`)


    As you can see in the following code, all the previous information is provided.
    The code is again similar to the code we saw in the previous section; it is just
    that `Boto3` needs information that should be manually put inside it as parameters,
    while when we run the code from inside `SageMaker`, most of the information is
    automatically extracted.


    ```

    response = client.create_processing_job(       # Initialize the method

    ProcessingInputs=[

    {

    ''InputName'': "Training_Input",    # Give Input Job a name

    ''S3Input'': {

    ''S3Uri'': input_data,          # URL from where the data needs to be taken

    ''LocalPath'': ''/opt/ml/processing/input'',     # Local directory where the data
    will be downloaded

    ''S3DataType'': ''S3Prefix'',     # What kind of Data is it?

    ''S3InputMode'': ''File''         # Is it a file or a continuous stream of data?

    }

    },

    ],

    ProcessingOutputConfig={

    ''Outputs'': [

    {

    ''OutputName'': ''Training'',      # Giving Output Name

    ''S3Output'': {

    ''S3Uri'': ''s3://slytherins-test/'',      # Where the output needs to be stored

    ''LocalPath'': ''/opt/ml/processing/train'',   # Local directory where output
    needs to be searched

    ''S3UploadMode'': ''EndOfJob''     # Upload is done when the job finishes

    },

    ''OutputName'': ''Testing'',

    ''S3Output'': {

    ''S3Uri'': ''s3://slytherins-test/'',

    ''LocalPath'': ''/opt/ml/processing/test'',

    ''S3UploadMode'': ''EndOfJob''

    }

    },

    ],

    },

    ProcessingJobName=''preprocessing-job-test'',    # Giving a name to the entire
    job. It should be unique

    ProcessingResources={

    ''ClusterConfig'': {

    ''InstanceCount'': 1,                  # How many instances are required?

    ''InstanceType'': ''ml.m5.xlarge'',      # What''s the instance type?

    ''VolumeSizeInGB'': 5                 # What should be the instance size?

    }

    },

    AppSp {

    ''ImageUri'': ''809912564797.dkr.ecr.us-east-2.amazonaws.com/sagemaker-processing-container:latest'',

    # Docker Image URL

    ''ContainerEntrypoint'': [

    ''Python3'',''preprocessing.py''         # How to run the script

    ]

    },

    RoleArn=''arn:aws:iam::809912564797:role/sagemaker-full-accss'',    # IAM role
    definition

    )

    ```


    `RoleArn` defines the IAM role that will be needed to run the code. We have already
    made this role in the activity section. I also explained how to copy the ARN during
    IAM role creation.


    The previous code will start the processing job. But, you will not see any output.
    To know the status of the job, you can use `CloudWatch`, which I will talk about
    in the next section. For now, we will get help from the `Boto3` method `describe_processing_job`
    to get the information. We can do this by writing the following code:


    ```

    client.describe_processing_job(

    ProcessingJobName=''processing-job-test''

    )

    ```


    This will give us detailed information about the job, as shown in Figure [5-19](#495447_1_En_5_Chapter.xhtml#Fig19).


    ![../images/495447_1_En_5_Chapter/495447_1_En_5_Fig19_HTML.jpg](images/495447_1_En_5_Chapter/495447_1_En_5_Fig19_HTML.jpg)


    Figure 5-19


    Processing job description


    You will find the key `ProcessingJobStatus`, which tells about the status, and
    if the job fails, you will get a reason for the failure key as well. So, now we
    have seen the three ways of data processing provided by `SageMaker`. Let’s explore
    how we can monitor these jobs in the next section.


    ## Monitoring Processing Jobs Using CloudWatch


    `CloudWatch` is an amazing service provided by Amazon that helps you monitor almost
    every job, be it training, inference, or processing jobs. In this section, we
    will be looking at the usage of `CloudWatch` to monitor processing Jobs. In later
    chapters, we will explore it for other machine learning techniques as well.


    First, once we log in to the AWS Management Console, we must go to Services and
    then search for `CloudWatch` and open it. Then look for the Logs section in the
    panel on the right and click it. See Figure [5-20](#495447_1_En_5_Chapter.xhtml#Fig20).


    ![../images/495447_1_En_5_Chapter/495447_1_En_5_Fig20_HTML.jpg](images/495447_1_En_5_Chapter/495447_1_En_5_Fig20_HTML.jpg)


    Figure 5-20


    CloudWatch menu


    Here you can see all the log groups, depending upon the AWS services that we have
    used. Since we have used only two services so far, `SageMaker` and Processing,
    you’ll easily find the information, as shown in Figure [5-21](#495447_1_En_5_Chapter.xhtml#Fig21).


    ![../images/495447_1_En_5_Chapter/495447_1_En_5_Fig21_HTML.jpg](images/495447_1_En_5_Chapter/495447_1_En_5_Fig21_HTML.jpg)


    Figure 5-21


    Jobs information in CloudWatch


    We will click the ProcessingJobs section and search for the processing job name
    that we gave to our job. Once we find it, click the link. It will give us some
    output similar to Figure [5-22](#495447_1_En_5_Chapter.xhtml#Fig22).


    ![../images/495447_1_En_5_Chapter/495447_1_En_5_Fig22_HTML.jpg](images/495447_1_En_5_Chapter/495447_1_En_5_Fig22_HTML.jpg)


    Figure 5-22


    Job logs in CloudWatch


    If you have any errors, you can find them listed here as well, based on the processing
    job’s name. That’s why I mentioned before that the name should be unique. There
    are a lot of other sections as well in `CloudWatch`, but for now they are not
    important. We will explore them when the need arises.


    One thing to remember here is that inside the `SageMaker` console, you won’t find
    the logs of the processing jobs. That’s why you have to come to `CloudWatch` to
    find the job. For most training jobs, transformation jobs, etc., you’ll find the
    logs directly in the console of `SageMaker`—but not for processing jobs.


    ## Conclusion


    This chapter was all about the processing of raw data using `SageMaker`. In the
    next chapter, we will look at most of the built-in algorithms of `SageMaker` in
    detail. We will start with the processing of raw data and then move on to training
    the model and saving the model artifacts to an S3 bucket.


    # 6. Building and Deploying Models in SageMaker


    In this chapter, we will be exploring some of `SageMaker`’s built-in algorithms
    that are widely used in the industry. We will be exploring the algorithms from
    the general domain, natural language processing domain, computer vision domain,
    and forecasting domain.


    ## Exploring the Linear Learner Algorithm


    The linear learner algorithm of `SageMaker` is similar to the regression algorithms
    in the machine learning domain. We can make multiple linear regression, logistic
    regression, and multinomial logistic regression models using the linear learner
    algorithm. In this section, we will look at how this algorithm can be used for
    linear regression and logistic regression. We will use the Big Mart dataset that
    we used in the previous chapter to apply this algorithm. Before delving into how
    to apply linear learner in `SageMaker`, let’s take a brief look at linear and
    logistic regression.


    ### Overview of Linear Regression


    Linear regression is one of the most basic yet most important algorithms in machine
    learning. It is used to fit a line (or a curve in the case of nonlinear regression)
    on the observations and then interpolate the fitted line to get the predictions.
    To fit the line, we use an approach that is called *least squares estimations*,
    which gives us our coefficient values. These coefficient values are determined
    in such a way that the mean of the errors is approximately zero. Errors are the
    Euclidean distance of each observation from the fitted line. Figure [6-1](#495447_1_En_6_Chapter.xhtml#Fig1)
    shows simple linear regression used to fit a line.


    ![../images/495447_1_En_6_Chapter/495447_1_En_6_Fig1_HTML.jpg](images/495447_1_En_6_Chapter/495447_1_En_6_Fig1_HTML.jpg)


    Figure 6-1


    Simple linear regression


    Linear regression is used to predict numerical values. There are various versions
    of regression, namely, ridge regression, lasso regression, elastic net regression,
    Gaussian regression, etc.'
