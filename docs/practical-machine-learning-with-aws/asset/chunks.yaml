    ## 使用 CloudWatch 监控处理作业


    CloudWatch 是 Amazon 提供的一项出色服务，可帮助你监控几乎所有作业，无论是训练、推理还是处理作业。在本节中，我们将探讨如何使用 CloudWatch
    来监控处理作业。在后续章节中，我们还将把它用于其他机器学习技术。


    首先，登录 AWS 管理控制台后，我们需要转到“服务”，然后搜索 *CloudWatch* 并打开它。接着，在右侧面板中找到“日志”部分并点击它。参见图 5-20。


    ![../images/495447_1_En_5_Chapter/495447_1_En_5_Fig20_HTML.jpg](img/495447_1_En_5_Fig20_HTML.jpg)


    图 5-20


    CloudWatch 菜单


    在这里，你可以看到所有日志组，具体取决于我们使用过的 AWS 服务。由于我们目前只使用了 SageMaker 和 Processing 这两个服务，你可以轻松找到相关信息，如图
    5-21 所示。


    ![../images/495447_1_En_5_Chapter/495447_1_En_5_Fig21_HTML.jpg](img/495447_1_En_5_Fig21_HTML.jpg)


    图 5-21


    CloudWatch 中的作业信息


    我们将点击 ProcessingJobs 部分，并搜索我们为作业指定的处理作业名称。找到后，点击该链接。它将显示一些类似于图 5-22 的输出。


    ![../images/495447_1_En_5_Chapter/495447_1_En_5_Fig22_HTML.jpg](img/495447_1_En_5_Fig22_HTML.jpg)


    图 5-22


    CloudWatch 中的作业日志


    如果你有任何错误，也可以根据处理作业的名称在此处找到它们。这就是我之前提到名称应唯一的原因。CloudWatch 中还有很多其他部分，但目前它们并不重要。我们将在需要时再进行探索。


    这里需要记住的一点是，在 SageMaker 控制台内部，你找不到处理作业的日志。这就是为什么你必须到 CloudWatch 中查找作业的原因。对于大多数训练作业、转换作业等，你可以直接在
    SageMaker 控制台中找到日志——但处理作业除外。


    ## 结论


    本章主要介绍了如何使用 SageMaker 处理原始数据。在下一章中，我们将详细探讨 SageMaker 的大部分内置算法。我们将从处理原始数据开始，然后转向训练模型并将模型工件保存到
    S3 存储桶。


    # 6. 在 SageMaker 中构建和部署模型


    在本章中，我们将探索一些业界广泛使用的 SageMaker 内置算法。我们将从通用领域、自然语言处理领域、计算机视觉领域和预测领域探索这些算法。


    ## 探索线性学习器算法


    SageMaker 的线性学习器算法类似于机器学习领域的回归算法。我们可以使用线性学习器算法创建多元线性回归、逻辑回归和多项逻辑回归模型。在本节中，我们将了解如何将此算法用于线性回归和逻辑回归。我们将使用上一章中使用的
    Big Mart 数据集来应用此算法。在深入探讨如何在 SageMaker 中应用线性学习器之前，让我们先简要了解一下线性回归和逻辑回归。


    ### 线性回归概述


    线性回归是机器学习中最基础但也是最重要的算法之一。它用于在观测数据上拟合一条线（在非线性回归的情况下是曲线），然后对拟合的线进行插值以获得预测值。为了拟合这条线，我们使用一种称为*最小二乘估计*的方法，该方法为我们提供了系数值。这些系数值的确定方式使得误差的均值近似为零。误差是每个观测点到拟合线的欧几里得距离。图
    6-1 展示了用于拟合一条线的简单线性回归。


    ![../images/495447_1_En_6_Chapter/495447_1_En_6_Fig1_HTML.jpg](img/495447_1_En_6_Fig1_HTML.jpg)


    图 6-1


    简单线性回归


    线性回归用于预测数值。回归有多种变体，例如岭回归、套索回归、弹性网络回归、高斯回归等。

