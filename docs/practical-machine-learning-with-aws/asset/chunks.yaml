    This book is structured into three parts. The first part of the book covers the
    concepts of cloud computing and gives an overview of how AWS works. The second
    part of the book takes on AWS in detail and covers SageMaker, Step Functions,
    S3 buckets, ECR, etc. The last part talks about the use cases for AWS services.
    Different services such as Amazon Comprehend and Extract are discussed here.


    Specifically, Part I starts by covering cloud terminologies. It helps you understand
    the cloud concepts required to use AWS. Then the book discusses the various AWS
    services that Amazon provides and how they help users in different ways. It discusses
    the different functionalities of AWS that are categorized under storage-based,
    compute-based, security-based, etc. By end of the chapters in this part, you will
    have an overview of how AWS works.


    Part II discusses SageMaker in detail. The part starts by running a basic preprocessing
    script in SageMaker and ends with building a complete end-to-end pipeline of machine
    learning in it. It covers how SageMaker talks with different services such as
    ECR, S3, Step Functions, etc., to build the final model.


    Part III discusses three use cases of machine learning using some of the other
    services of AWS. The book discusses how to extract text using Amazon Textract,
    how to use Amazon Comprehend, and how to make a time-series model using Amazon
    Forecast.


    This book was written to give people who know Python and machine learning some
    experience with AWS. It teaches you how to use the power of AWS to build your
    heavy models and how AWS provides you with services to make super models or deploy
    your custom code with the same AWS support.


