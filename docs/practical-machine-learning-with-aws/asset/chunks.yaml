    ## Exploring the JSON File That Can Be Passed as Input


    There is one more option that we can use to create the flow in Step Functions
    if we want to avoid the Python code. You can pass a JSON directly and then decide
    on the sequence. Let’s see the JSON that was generated by Step Functions for our
    code. To look at the JSON code, we have to click the Edit State Machine option.
    You can look at the entire JSON format, as shown in Figure [9-13](#495447_1_En_9_Chapter.xhtml#Fig13).


    ![../images/495447_1_En_9_Chapter/495447_1_En_9_Fig13_HTML.jpg](images/495447_1_En_9_Chapter/495447_1_En_9_Fig13_HTML.jpg)


    Figure 9-13


    Looking at the JSON structure


    ## Conclusion


    In this chapter, you learned how to create an end-to-end pipeline using Step Functions.
    This is useful when creating the entire training and deployment process and when
    retraining models with the new data or with some new configuration. This also
    helps in creating a CI/CD pipeline where we can push the code to Git and then
    use tools such as Jenkins or Bamboo to create these step functions and start the
    execution. Hence, as you push to code to Git, immediately the process of training
    starts. That’s the power of creating a pipeline.


    This finishes our discussion on SageMaker and its services. In the next chapter
    of this book, we will look at some of the use cases of machine learning that can
    be done using other AWS services.


    # Part III: Other AWS Services


    # 10. Machine Learning Use Cases in AWS


    In this chapter, we will explore three use cases in which AWS can be used to solve
    typical machine learning problems, without writing too much code. We will use
    some of the AWS services besides SageMaker.


    ## Use Case 1: Natural Language Processing Using Amazon Comprehend


    Amazon Comprehend is a service in AWS that can perform various NLP tasks such
    as key entities extraction from text, sentiment analysis, phrases extraction,
    syntax check, language detection, topic modeling, and document classification.
    Amazon Comprehend provides a UI that we can use to train a model without writing
    any code. We can also use the API provided by Comprehend to connect it to the
    scripting language of your choice and then train the model directly from the code.


    In this section, we will explore how we can use Comprehend to analyze the text,
    and then we will create a custom sentiment analysis model using it.'
