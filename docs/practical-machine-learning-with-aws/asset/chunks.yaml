  trans: '

    ### SageMaker 中的模型部署


    模型训练完成后，所有学习到的参数都会存储在 S3 存储桶中，并被称为*模型工件*。这些模型工件将在推理（或预测）过程中使用。在图 4-7 中，底部是模型训练部分；现在我们将讨论上半部分，即模型部署部分。它包含以下几个部分：


    *   S3 存储桶中模型工件的 URL 引用


    *   辅助代码和推理代码


    *   推理代码镜像


    *   端点


    *   客户端


    辅助代码和推理代码由处理脚本和预测脚本组成。此外，它还包含了预测结果需要发送或保存的格式。预测时会使用训练阶段生成的模型工件。


    SageMaker 会将训练时的计算需求替换为部署时的计算需求。这是因为训练可能需要具有更强计算能力的大型实例，但预测时我们不需要那么多大型实例。因此，预测也可以使用较小的实例来完成。这有助于节省大量成本。


    我们可以使用为训练模型而构建的同一个 Docker 镜像来进行推理，只需添加一些额外的 Python 脚本即可帮助部署。这些脚本可能包括使用 Flask、Gunicorn
    等包。要开始部署，我们需要提供模型工件的 URL、ECR 镜像 URL 以及所需的计算实例。提供这三个参数后，部署即可完成，并会创建一个端点。


    端点是一个地方，我们以特定格式（可能是 CSV 或 JSON）向其发送请求，并从模型获取响应。这被称为 RESTful API。创建的模型通过此 API 提供服务，我们希望进行预测的数据以
    CSV 格式逐行发送，并以相同方式获取预测结果。这些是 POST 和 GET 请求。我们可以将此端点暴露给任何客户端对象。它可以是网站、移动应用、物联网设备或任何其他东西。我们只需要将一些记录发送到端点并获取预测结果。


    当我们进行实时预测时，会使用端点。因此，除非我们手动停止它们或添加超时条件，否则它们会一直运行。但假设我们只想对一部分数据（例如 5000 行）进行预测，并且不想要实时端点。那么
    SageMaker 支持一种称为*批量转换*的功能。使用这种方法，我们提供与部署代码相同的参数，但会额外提供一个参数。这个参数是需要进行推理的数据的链接。这些数据同样存储在
    S3 中，因此在需要预测时会下载到实例中。预测完成后，预测结果会存储回 S3，然后计算实例会立即停止。图 4-8 展示了 SageMaker 中批量转换的过程。


    ![../images/495447_1_En_4_Chapter/495447_1_En_4_Fig8_HTML.jpg](img/495447_1_En_4_Fig8_HTML.jpg)


    图 4-8


    批量处理


    我们将在接下来的章节中探讨这两种方法：端点生成和批量转换。


    ### SageMaker 内置算法


    以下是 SageMaker 提供的所有算法：


    *   **Blazing text**


    该算法用于涉及文本分类的问题陈述。它是 Word2Vec 算法的优化版本，可用于多种任务，如情感分析、命名实体识别等。


    *   **DeepAR 预测**


    该算法用于使用 RNN 进行单变量时间序列预测的领域。它可以用于在多个相似的时间序列数据上进行训练，并且在大多数情况下优于 ARIMA 或指数平滑方法。


    *   **因子分解机**


    这是一种通用算法，既可用于回归任务，也可用于分类任务。对于分类，它仅支持二分类问题。


    *   **图像分类**


    该算法基于 ResNet（CNN 模型）构建，用于图像的多标签分类。如果可用数据集很大，可以从头开始训练；如果数据集规模较小，则可以应用迁移学习。


    *   **IP 洞察**


    该算法用于一个特殊用例——查找 IPv4 地址的使用模式。它可以用来判断用户发送请求的 IP 地址是否异常。


    *   **K-means**


    该算法用于查找遵循相似模式的数据簇。它是统计 K-means 聚类算法的优化版本。


    *   **K-近邻**


    它通过寻找最近邻的方法对数据进行分类。它是统计 K-近邻算法的优化版本。


    *   **潜在狄利克雷分配**


    这是一种用于发现文档中主题的算法，因此其应用领域也被称为*主题建模*。它是一种无监督学习方法，用于从一堆文档中找出类别。


    *   **线性学习器**


    这是一个普通的简单和多元线性回归算法，也能够在分类问题上执行逻辑回归。


    *   **神经主题模型**


    这同样是一种主题建模方法，通过查找文档的统计分布从一堆文档中提取主题。该算法可用于文本摘要或推荐领域。


    *   **Object2Vec**


    该算法用于为对象生成向量，类似于 Word2Vec 算法。唯一不同的是，它是 Word2Vec 的通用版本。使用这种方法，可以进行大量优化且高效的分类和回归，从而为我们提供更好的性能。


    *   **目标检测**


    查找并识别图像中的对象是该算法的主要任务。它包含一个单一的深度神经网络来执行此操作。该模型使用的框架是单次多框检测器（SSD），并以 VGGNet 和 ResNet
    作为基础。


    *   **主成分分析**


    该算法基于查找变量的重要性，然后根据相似性合并变量。它用于数据的降维，以便通过使用特征值和特征向量的概念合并变量的重要性来减少变量的数量。


    *   **随机切割森林**


    该算法用于查找数据集中存在的模式，然后找出那些偏离数据集中所有一般模式的模式。例如，为什么时间序列数据中会出现不必要的尖峰？为什么某个特定数据点无法被分类？这些是随机切割森林方法的众多用途中的几个。


    *   **语义分割**


    该算法用于开发计算机视觉应用。它是一种像素级算法，根据数据对每个像素进行标记。可用于自动驾驶汽车、医学影像等领域。


    *   **SeqtoSeq 建模**


    当我们有输入序列并且需要生成输出序列时，会使用此算法。例如，我们可以有德语的输入序列，并需要将其翻译成英语序列。类似地，它也可以用于时间序列数据、图像和其他文本应用。该算法使用带有注意力机制的
    RNN 和 CNN。


    *   **XGBoost**


    这是集成树的高度优化版本之一，它使用了梯度提升方法的概念，并利用了多线程和多处理的能力，从而在数据集上提供出色的推理性能。它不仅是 SageMaker 中，也是其他领域中使用最广泛的算法之一。


    我们将在接下来的章节中看到这些算法中的大部分及其实际实现。

    '
- fmt: '### Custom Algorithms in SageMaker


    In the previous section, we saw the different algorithms that SageMaker supports.
    But what if you want to use a different algorithm that SageMaker doesn’t support?
    For example, instead of blazing text, what if you want to use BERT models? In
    that scenario, we can use custom Docker images, and in SageMaker terms this is
    called *bring-your-own-models*. As you saw earlier, all we need is a Docker image
    for training and inference, training files in S3 bucket, output S3 bucket location,
    etc. So, to make your custom models run in SageMaker, you’ll have to follow these
    steps:


    1. Write the training script.

    2. Test the training script inside the Docker container after installing all the
    important packages in Docker.

    3. Edit the inference script inside Docker. This will be a script written probably
    in Python and Flask.

    4. Test the inference script.

    5. Once everything works fine, push the Docker image along with the training and
    inference script onto ECR.

    6. You can now call this algorithm by passing the URL of ECR.


    We will look at how to make a custom algorithm in SageMaker in the upcoming chapters.


    There are a lot of other features in SageMaker that we will keep discussing throughout
    this book. But, for now, this introduction suffices. In the upcoming chapters
    we will be delving deeper into SageMaker and how to execute the code and algorithms
    in it.


    Let’s now explore some other machine learning services that AWS provides beyond
    SageMaker.


    ## Other Machine Learning Services by AWS


    Let’s start this section by looking at Amazon Comprehend, a service dedicated
    to text analytics in AWS.


    ### Amazon Comprehend


    Amazon Comprehend is a service provided by AWS for NLP-related tasks. If a company
    has a group of documents and some extraction from them is needed so that a specific
    insight can be drawn out, then Amazon Comprehend is the service to use. Same tasks
    can be done in SageMaker as well, but Comprehend requires the least amount of
    coding. This is an ideal solution for people with less coding experience. The
    following are key elements that can be extracted from the documents:


    - Entities such as organizations, places, names, etc.

    - Key phrases in the documents

    - The language and the sentiments of the sentences

    - The syntax and syntactical structure of sentences


    In addition to these features, custom classifiers can be built that can sort the
    document into categories based on similarity. Also, in addition to the default
    entities that can be extracted, custom entities can be extracted from documents.
    This can be done by training the base model of Amazon Comprehend. All the NLP
    tasks of Amazon Comprehend have a base of neural networks. That means all the
    tasks performed are deep learning based and can be customized as well.


    Also, we can do topic modeling using Amazon Comprehend when we can find key topics
    present in all the documents based on the frequency and distribution of words.
    For this task, Amazon recommends a minimum of 1,000 documents.


    ### Amazon Polly


    Amazon Polly is the service provided by AWS for speech synthesis. Whatever text
    that you give to Polly, it will be converted into lifelike speech. It supports
    multiple languages and can be customized to the voice of our choice. The base
    of Amazon Polly is neural networks, just like Comprehend. It is called a *neural
    text-to-speech* (NTTS) model. This is the reason why Polly has the most human-like
    voice as compared to its competitors.


    The pronouncing accuracy of Polly is super high, and it includes abbreviations,
    acronym expansions, and date/time interpretations; it also supports homograph
    disambiguation. This means that the words that have the same spellings but different
    meanings based on the sentence in which they are used can also be understood by
    Polly. This process is called *context-aware analysis*.


    Polly offers both male and female voices and supports three British English voices
    and eight US English voices. Polly even supports voices that can sound like newscasters.


    ### Amazon Rekognition


    Amazon Rekognition is used for understanding the objects present inside an image
    or a video and then extracting them. The objects may include people, text, scenes,
    activities, inappropriate content, etc. It has a capability for facial analysis,
    facial comparison, and face searching. Like other services, Amazon Rekognition
    has a back end of deep learning with neural networks used to understand the patterns.


    Amazon Rekognition’s development is ongoing, which means the data is continuously
    updated and given to the model, with an increased number of labels. This means
    that the accuracy of the model keeps getting better for different categories.
    Some of the common use cases of Amazon Rekognition are as follows:


    - Searching an image or a video for the presence of an object

    - Using facial feature–based authentication

    - Understanding emotional expressions such as happy, sad, enthusiastic, etc.

    - Using demographic information such as gender, place, type, etc.

    - Detecting adult and violent content present in videos or images

    - Recognizing and extracting textual content from the images


    We can also train Amazon Rekognition on custom labels, if required for a specific
    dataset related to a problem statement.


    ### Amazon Translate


    Machine translation is one of the applications of NLP where we translate one language
    to another language. Amazon has made a service totally dedicated to this use case
    wherein it supports neural machine translation from multiple languages to multiple
    languages. It is called Amazon Translate.


    This service is based on an encoder-decoder architecture similar to BERT and other
    language models. Here, first the input language is understood using encoder architecture,
    and then the task of translation is done using the decoder architecture. It also
    uses something called an *attention layer* that tries to understand the context
    of a sentence by understanding the relationship between the words. Combining all
    these things with a neural network like long short-term memory (LSTM), the process
    of translation is achieved.


    ### Amazon Transcribe


    When we have multiple audio files and we want to convert whatever is spoken in
    a clip into text, we can use Amazon Transcribe. It has multiple applications including
    a combination of some other Amazon services. Here are some examples:


    - A news clip can be first converted from speech to text using Transcribe, then
    it can be converted to your language of choice using Translate, and finally it
    can be read out aloud using Polly.

    - Customer service calls can be recorded and transcribed. Finally, Comprehend
    can be used to understand different aspects of the transcribed text.

    - It can be used to provide real-time subtitles.


    Amazon Transcribe can be used to identify speakers based on the voice. It can
    be used to tell the difference between the one asking the question and the answerer,
    supposedly in a recorded press conference. Also, if you feel like Transcribe is
    not able to understand a few words, then you can increase the vocabulary of Transcribe
    by providing a custom vocabulary.


    ### Amazon Textract


    Amazon Textract is used to detect text present inside a document that can be in
    PDF format or image format. It can also extract information from tabular data,
    or other types of document formats that can include applications such as financial
    reports extraction, medical records extraction, etc. Like other services, Textract
    is also built on a deep neural network architecture, where the weights are updated
    almost daily by having access to more than a billion images and videos. Textract
    can also be used to extract data from forms, CSV sheets, websites, etc.'
