- fmt: '# Use Case 2: Sales Forecasting Using Amazon Forecast


    In this section, we will be predicting the sales forecast for a company. For this
    we will be using a forecast dataset from Kaggle called Store Item Demand Forecast.
    You can download the dataset from [`https://www.kaggle.com/c/demand-forecasting-kernels-only/data?select=train.csv`](https://www.kaggle.com/c/demand-forecasting-kernels-only/data%253Fselect%253Dtrain.csv).


    Once we have downloaded the dataset, we have to do some formatting on it. The
    first thing is that we will add an `ID` column to it. This should be the first
    column of the dataset. Next, make sure that the date field is in the format of
    `YYYY-MM-DD`; otherwise, Amazon Forecast will not accept it. Once that done, upload
    the dataset to S3 and then note its path.


    ## Creating a Dataset Group


    Now, open the Amazon Management Console and then search for *Amazon Forecast Service*.
    Click Create Dataset Group. The first step will be to give the dataset group a
    name and then choose the domain of forecasting. For our analysis, we have chosen
    a custom domain. See Figure [10-14](#495447_1_En_10_Chapter.xhtml#Fig14).


    ![../images/495447_1_En_10_Chapter/495447_1_En_10_Fig14_HTML.jpg](images/495447_1_En_10_Chapter/495447_1_En_10_Fig14_HTML.jpg)


    Figure 10-14


    Creating a dataset group name


    ## Defining Column Attributes


    The next step is to give your dataset a name. Then, you have to define the column
    attributes. See Figure [10-15](#495447_1_En_10_Chapter.xhtml#Fig15).


    ![../images/495447_1_En_10_Chapter/495447_1_En_10_Fig15_HTML.jpg](images/495447_1_En_10_Chapter/495447_1_En_10_Fig15_HTML.jpg)


    Figure 10-15


    Defining column attributes


    Remember, the attributes should be in the same sequence as in the dataset. Also,
    all the attributes besides the attributes that were already present in the JSON
    schema must be strings. That’s why the store and quantity are mentioned as strings.
    You can define the interval as well. For us, it is a daily interval, so that’s
    how it is set. Click Next.


    ## Importing Data


    The last step will be to start importing the data. Here you will provide the S3
    path and the name to the dataset import. See Figure [10-16](#495447_1_En_10_Chapter.xhtml#Fig16).


    ![../images/495447_1_En_10_Chapter/495447_1_En_10_Fig16_HTML.jpg](images/495447_1_En_10_Chapter/495447_1_En_10_Fig16_HTML.jpg)


    Figure 10-16


    Configuring the dataset path


    ## Making Predictions


    Now, click “Start import.” Once the import is done, we have to click “Start predictor
    training.” Here we will inform Amazon Forecast about the type of forecast that
    we have to make and the horizon of forecasts. Figure [10-17](#495447_1_En_10_Chapter.xhtml#Fig17)
    shows the inputs that we have to make.


    ![../images/495447_1_En_10_Chapter/495447_1_En_10_Fig17_HTML.jpg](images/495447_1_En_10_Chapter/495447_1_En_10_Fig17_HTML.jpg)


    Figure 10-17


    Inputs for starting the training job


    The training will start after this. Wait until the training finishes, and if you
    feel that AutoML is taking too much time, you can select any of the custom predictors.
    Go with the manual algorithms.


    Once our training is done, we have to click “Create a forecast.” Here you need
    to give your forecast a name and the predictor that you have just created. Click
    “Create a forecast.” See Figure [10-18](#495447_1_En_10_Chapter.xhtml#Fig18).


    ![../images/495447_1_En_10_Chapter/495447_1_En_10_Fig18_HTML.jpg](images/495447_1_En_10_Chapter/495447_1_En_10_Fig18_HTML.jpg)


    Figure 10-18


    Generating forecasts


    Once the forecast is done, you can click “Forecast Lookup” and view it. See Figure
    [10-19](#495447_1_En_10_Chapter.xhtml#Fig19).


    ![../images/495447_1_En_10_Chapter/495447_1_En_10_Fig19_HTML.jpg](images/495447_1_En_10_Chapter/495447_1_En_10_Fig19_HTML.jpg)


    Figure 10-19


    Forecast lookup


    Just give the horizon for forecasts and you will get a very nice visualization,
    as shown in Figure [10-20](#495447_1_En_10_Chapter.xhtml#Fig20).


    ![../images/495447_1_En_10_Chapter/495447_1_En_10_Fig20_HTML.jpg](images/495447_1_En_10_Chapter/495447_1_En_10_Fig20_HTML.jpg)


    Figure 10-20


    Generated forecasts


    This finishes our discussion of using Amazon Forecast for making sales forecasts.
    As mentioned before, we can create different types of forecasts for different
    datasets. Let’s now look at the last use case where we will use Amazon Textract
    to extract textual information from different file formats.


    # Use Case 3: Image Text Extraction Using Amazon Textract


    Using Amazon Textract, not only can we extract the text from the images, PDFs,
    Word files, etc., but we can also extract the tabular and form-based data as well.
    Again, like with all the previous services, the process is simple. We just need
    to upload the image containing information, and the data will be extracted. Let’s
    start the process by first going to the Amazon Management Console and searching
    for *Amazon Textract service*. Next, click “try Amazon Textract.” Finally, click
    the upload document.


    ## Extracting Tabular Information


    First, let’s apply Textract on some tabular data. For this we will be using Figure
    [10-21](#495447_1_En_10_Chapter.xhtml#Fig21).


    ![../images/495447_1_En_10_Chapter/495447_1_En_10_Fig21_HTML.jpg](images/495447_1_En_10_Chapter/495447_1_En_10_Fig21_HTML.jpg)


    Figure 10-21


    Table of importance


    Once you upload the image, you will get the results, as shown in Figure [10-22](#495447_1_En_10_Chapter.xhtml#Fig22).
    The first extraction is of the raw text, while the second extraction is of the
    table. We can see that Textract worked perfectly, as shown in Figure [10-23](#495447_1_En_10_Chapter.xhtml#Fig23).


    ![../images/495447_1_En_10_Chapter/495447_1_En_10_Fig23_HTML.jpg](images/495447_1_En_10_Chapter/495447_1_En_10_Fig23_HTML.jpg)


    Figure 10-23


    Tabular keywords extracted


    ![../images/495447_1_En_10_Chapter/495447_1_En_10_Fig22_HTML.jpg](images/495447_1_En_10_Chapter/495447_1_En_10_Fig22_HTML.jpg)


    Figure 10-22


    Extracted keywords


    ## Extracting Form Data


    Now, let’s see how Textract works on the form data. Figure [10-24](#495447_1_En_10_Chapter.xhtml#Fig24)
    shows the image we will use.


    ![../images/495447_1_En_10_Chapter/495447_1_En_10_Fig24_HTML.jpg](images/495447_1_En_10_Chapter/495447_1_En_10_Fig24_HTML.jpg)


    Figure 10-24


    Form data test image


    When we upload this image and analyze the form results, we get the results shown
    in Figure [10-25](#495447_1_En_10_Chapter.xhtml#Fig25).


    ![../images/495447_1_En_10_Chapter/495447_1_En_10_Fig25_HTML.jpg](images/495447_1_En_10_Chapter/495447_1_En_10_Fig25_HTML.jpg)


    Figure 10-25


    Form data extracted


    You can see that most of the fields of the form are successfully extracted by
    Textract. Similarly, we can give PDF files and other supported formats to Textract,
    to get the required fields. We can connect to the Textract API as well so that
    directly the results can be absorbed by a scripting language like Python and further
    analysis can be made.


    # Conclusion


    In this chapter, you learned about different Amazon services in the domain of
    machine learning. They are the ready-made solutions provided by Amazon that minimize
    the coding knowledge so that people with deep mathematics/statistical backgrounds
    can conduct their analysis. This concludes the last chapter of this book.'
