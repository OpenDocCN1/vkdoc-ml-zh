  trans: '

    ### AWS 中的访问管理是如何实现的


    通常来说，*访问管理*也可以被称为*授权*。登录到 AWS 账户的个人或服务被称为*主体实体*。主体实体通过 IAM 进行身份验证（IAM 用于验证 IAM
    角色或用户）。身份验证完成后，系统会检查附加到特定用户或角色的策略。这些策略有助于确定授予主体实体的权限。它们被创建并附加到不同的 IAM 身份，例如用户、角色或组。现在，如果主体实体发送了某个服务的请求，但策略中未定义使用该服务的权限，那么访问将被拒绝。这就是
    AWS 中访问管理的实现方式。


    策略可以基于 IAM 角色、资源或访问控制列表来应用。角色示例是数据工程师。所有具有数据工程师角色的 IAM 用户都将被分配相同的策略。这意味着该角色中的每个人都能以相同的权限级别访问相同的资源。应用于资源的策略会对特定资源的使用施加限制。例如，我们可以创建一个策略，允许用户读取
    DynamoDB 表，但不允许创建表。当我们想要应用跨平台策略时，会使用 ACL。


    这里给出了一个基于角色的策略示例。我们定义了一个 JSON 文件，展示了针对 DynamoDB 定义的策略。


    ```

    {

    "Version": "2012-10-17",

    "Statement": {

    "Effect": "Allow",

    "Action": "dynamodb:*",

    "Resource": "arn:aws:dynamodb:us-east-2:123456789012:table/Books"

    }

    }

    ```


    这授予了用户使用 DynamoDB 中 `Books` 表的权限。这清楚地表明，要分配策略，必须创建 JSON 文件，并且这些文件必须附加到相应的实体。策略不仅可以附加到特定实体，还可以附加到一组实体。这些被称为*IAM
    组*；见图 3-3。


    ![../images/495447_1_En_3_Chapter/495447_1_En_3_Fig3_HTML.jpg](img/495447_1_En_3_Fig3_HTML.jpg)


    图 3-3


    IAM 组


    图 3-3 定义了多个 IAM 用户，并将他们分组到三个 IAM 组中：管理员、开发人员和测试人员。现在，策略可以应用于整个组，并自动应用于其成员。但这里需要注意的一点是，如果某个特定成员未被授予某个服务的权限，那么即使该组有权访问该服务，该成员仍然没有权限访问该服务。


    在哪里可以找到所有已定义策略的摘要？IAM 控制台中有三个表格提供了关于策略的详细信息。这些表格如下：


    *   策略摘要


    *   服务摘要


    *   操作摘要


    当我们打开策略摘要时，会看到已定义策略的服务列表。我们可以点击任意服务，进入该特定服务的摘要表。摘要表列出了可以在该特定服务上执行的所有操作以及附加到这些操作的权限。您可以点击任意操作，然后进入操作摘要，该摘要显示了已授予该特定操作的权限。图
    3-4 为您总结了这些表格。


    ![../images/495447_1_En_3_Chapter/495447_1_En_3_Fig4_HTML.jpg](img/495447_1_En_3_Fig4_HTML.jpg)


    图 3-4


    策略、服务和操作摘要


    策略可以分为两种：基于身份的策略和基于资源的策略。顾名思义，当策略附加到 IAM 角色、用户或组时，它们被称为*基于身份的策略*；而当我们将它们附加到资源（如
    S3 存储桶或 DynamoDB）时，它们被称为*基于资源的策略*。


    ### 基于属性的访问控制


    在讨论基于属性的访问控制（ABAC）之前，我们必须了解*AWS 标签*。这些是附加到 IAM 用户、角色、组甚至 AWS 资源的一些属性。当我们有一个大型组织并且需要为员工制定策略时，这些标签非常有用。标签如何发挥作用？让我们看一个例子。


    一家生产机器学习产品的公司已将其整个架构迁移到 AWS。现在，它正在使用 Amazon SageMaker 构建模型，使用 Amazon EMR 进行数据工程，构建网站、API，并使用
    DynamoDB 和 CloudFormation 进行数据库管理，同时使用各种其他 AWS 服务（如 CloudWatch、TrustedAdvisor
    等）来保障安全。现在，假设该公司约有 5,000 名员工。为每个员工提供 IAM 角色并附加策略将是一项繁琐的任务。那么，我们该怎么办？这时，标签和 ABAC
    就派上用场了。


    想象两位机器学习工程师；一位只使用 SageMaker 和 S3 存储桶，而另一位除了使用前一位工程师使用的服务外，还使用 EMR。组织可以为不同的用途创建两个标签。假设一个标签叫做
    *basic-machine-learning*，另一个叫做 *advanced-machine-learning*。在定义 IAM 角色时，所有机器学习工程师和初级数据科学家都可以被赋予第一个标签。高级数据科学家和解决方案架构师可以被赋予第二个标签。现在，当一位初级数据科学家尝试访问
    EMR 时，系统会检查标签，并查看其相应的策略。由于策略不足以提供此访问权限，访问将立即被拒绝。但是，如果一位解决方案架构师尝试访问初级数据科学家访问过的同一个标签，他将被授予访问权限，因为与该标签关联的策略为该人员提供了适当的权限。这些标签也被称为*属性*，因此这个过程被称为*基于属性的访问控制*（ABAC）。


    我们如何说 ABAC 流程优于传统流程？让我们看看它们之间的一些区别。传统流程也称为*基于角色的访问控制*（RBAC）。


    *   第一个区别是，在 RBAC 中，每次添加新资源时，都必须更新附加到角色或用户的策略——不仅针对一个角色，而是针对所有角色。而在 ABAC 中，只需要更新标签。


    *   由于这些标签的存在，ABAC 的策略比 RBAC 少得多，因此更易于管理。


    在本书的第二部分，我们将介绍使用 IAM 创建根凭证，然后定义角色、用户、组等的完整过程。在本节中，我们涵盖了其理论方面。实际上，我们将在下一节中查看其应用。


    AWS 还提供了一些其他服务来增强应用程序的安全性。


    *   AWS WAF


    *   AWS Shield


    *   AWS Firewall Manager


    让我们逐一讨论每个服务。

    '
- fmt: '# AWS Web Application Firewall


    All the HTTP or HTTPS requests that are sent to specific AWS services like `Amazon
    API Gateway`, `Amazon CloudFront`, or `Application Load Balancer` are monitored
    by `AWS Web Application Firewall` (`WAF`). `WAF` allows you to control the access
    to the content. It does this based on certain conditions and rules. Some of these
    rules are listed here:


    - Allow every HTTP/HTTPS request except the ones that are explicitly specified.

    - Block every HTTP/HTTPS request except the ones that are explicitly specified.

    - Count the requests and match the properties defined in the requests with the
    properties mentioned in `WAF`. If the count of the properties that are the same
    matches, then allow the requests; otherwise, block them.


    The conditions that are matched to allow or block the requests follow some characteristics.
    The following are some of those characteristics:


    - Monitor the IP address to see where the request originated.

    - Look at the country from where the request originated.

    - Analyze the values present in the request headers.

    - Regular expressions can be made that search for specific patterns in the string
    and then make the decision of acceptance or rejection.

    - Check whether SQL code is present, which can be malicious.

    - Check whether scripts are present, which can be malicious.


    `WAF` can also be used to protect the applications that are hosted inside `ECR`.
    `ECR` allows you to efficiently manage Docker containers inside clusters. To define
    the rules and conditions in `WAF`, the following features can be used:


    - Web ACLs

    - Rules

    - Rule groups


    First, an ACL can be created that monitors the access to specific AWS resources.
    Then rules can be assigned to these ACLs that will act as a firewall and monitor
    the requests. Each rule is a kind of a statement with a condition, which is termed
    the *inspection criteria*. If the condition is met, then either the requests are
    allowed or they are blocked. We can also use rule groups, which are groups of
    statements containing conditions that can be attached to your ACL and hence indirectly
    to AWS resources.


    # AWS Shield


    Before looking at the `AWS Shield` service, we must first understand a cyberattack
    called a *distributed denial of service* (`DDoS`), as `AWS Shield` helps to mitigate
    it.


    Every web service or server has some bandwidth to serve as much of its current
    user base as possible, while handling more traffic during peak times. To conduct
    a `DDoS` attack, cybercriminals flood the service or server with so much traffic
    that either it becomes difficult for the users to operate or the entire service
    or server crashes. If the traffic is generated from a single system, the attack
    will not be that effective. That’s why the traffic is generated from multiple
    systems in parallel, and the target is attacked. Figure [3-5](#495447_1_En_3_Chapter.xhtml#Fig5)
    shows a visual representation of a `DDoS` attack.


    ![../images/495447_1_En_3_Chapter/495447_1_En_3_Fig5_HTML.jpg](images/495447_1_En_3_Chapter/495447_1_En_3_Fig5_HTML.jpg)


    Figure 3-5


    DDoS attack


    `AWS WAF` can be used to block these sorts of attacks, but for advanced security
    we can also use `AWS Shield Standard` and `AWS Shield Advanced`. By default all
    the services that we use in AWS come with `AWS Standard Shield`, at no extra cost.
    To use `AWS Advanced Shield`, users need to pay a little extra.


    There are two specific layers in a network that get compromised with cyberattacks:
    the network and transport layers. `AWS Standard Shield` monitors both these layers
    and provides protection. If `AWS Standard Shield` is used with `Amazon CloudFront`
    or `Route53`, then it provides some additional benefits as well.


    For additional protection, for example, if you want to protect applications running
    in `EC2` or `Elastic Load Balancer`, a user can opt for `AWS Advanced Shield`.
    `Advanced Shield` provides security not only for the network and transport layers
    but also for the application layer. Figure [3-6](#495447_1_En_3_Chapter.xhtml#Fig6)
    shows the different layers inside a network, using the Open Source Interconnection
    (`OSI`) model of networking.


    ![../images/495447_1_En_3_Chapter/495447_1_En_3_Fig6_HTML.jpg](images/495447_1_En_3_Chapter/495447_1_En_3_Fig6_HTML.jpg)


    Figure 3-6


    OSI seven-layer model


    # AWS Firewall Manager


    To ensure `AWS WAF` and `AWS Shield` operate smoothly and efficiently, `AWS Firewall
    Manager` can be used. `AWS Firewall Manager` is responsible for automatically
    applying all the rules defined on the resources and services. This holds true
    even when new resources are added in AWS. Because of this automatic capability,
    `AWS Firewall Manager` provides lots of advantages.


    - If a group of resources is following a specific tag, `AWS Firewall Manager`
    can automatically apply some custom rules.

    - `AWS Firewall Manager` allows you to create and manage your own rules or the
    rules bought from the marketplace.

    - It is generally beneficial to use `AWS Firewall Manager` if you have many users
    in an organization.


    # Conclusion


    In this chapter, you learned about various security aspects of AWS. This finishes
    our first part of this book, where we covered all the basics related to AWS. Now,
    we will move on to the second part of the book where we will look at how to make
    machine learning models using AWS. In the next chapter, we will look at the concepts
    from this chapter more practically and become experts not only in making the machine
    learning models but in using various other services such as `S3` buckets, `DynamoDB`,
    the security tools of AWS, etc. You will also learn how to make the models efficient
    and how they can be automated.


    # Part II Machine Learning in AWS


    # 4. Introduction to Machine Learning


    This chapter covers two main topics. First, you’ll be introduced to machine learning
    and its components, and then, you’ll look at the different services that AWS provides
    to help you make machine learning models.'
  raw: '## AWS Web Application Firewall


    All the HTTP or HTTPS requests that are sent to specific AWS services like Amazon
    API Gateway, Amazon CloudFront, or Application Load Balancer are monitored by
    AWS Web Application Firewall (WAF). WAF allows you to control the access to the
    content. It does this based on certain conditions and rules. Some of these rules
    are listed here:


    *   Allow every HTTP/HTTPS request except the ones that are explicitly specified.


    *   Block every HTTP/HTTPS request except the ones that are explicitly specified.


    *   Count the requests and match the properties defined in the requests with the
    properties mentioned in WAF. If the count of the properties that are the same
    matches, then allow the requests; otherwise, block them.


    The conditions that are matched to allow or block the requests follow some characteristics.
    The following are some of those characteristics:


    *   Monitor the IP address to see where the request originated.


    *   Look at the country from where the request originated.


    *   Analyze the values present in the request headers.


    *   Regular expressions can be made that search for specific patterns in the string
    and then make the decision of acceptance or rejection.


    *   Check whether SQL code is present, which can be malicious.


    *   Check whether scripts are present, which can be malicious.


    WAF can also be used to protect the applications that are hosted inside ECR. ECR
    allows you to efficiently manage Docker containers inside clusters. To define
    the rules and conditions in WAF, the following features can be used:


    *   Web ACLs


    *   Rules


    *   Rule groups


    First, an ACL can be created that monitors the access to specific AWS resources.
