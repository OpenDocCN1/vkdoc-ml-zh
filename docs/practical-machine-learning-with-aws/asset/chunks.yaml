- fmt: '# Part I: Introduction to Amazon Web Services


    ## 1. Cloud Computing and AWS


    This chapter covers the different components of cloud computing and of Amazon
    Web Services (AWS). After reading the chapter, you’ll understand the different
    important components of AWS, which will make it easier to understand the machine
    learning components of AWS.


    ### What Is the Cloud?


    So, what is the cloud? If you look at memes shared across the internet, you might
    think the cloud is nothing but someone else’s computer that you can use from your
    own computing device, for your own personal use. Then the question arises, why
    do we need the other computer when we have our own? It’s because our computer
    may not have things that the other system has. Maybe your budget when buying a
    system was less than the other person’s, and he therefore has more computational
    power to use. So, instead of buying a new system with more computational power,
    you can just access the other system for some amount of time and then return to
    your own system. This is the benefit that the cloud provides. And, by the way,
    we all know the other system is not just any normal system. Cloud systems are
    provided by big companies such as Amazon and Google. So even if you are trying
    to buy a new system with as much computational power as cloud systems, you will
    not be able to afford it.


    Formally speaking, the *cloud* is a particular computing service that is present
    at a different remote location that we can access using networking or the internet.
    Cloud services may include storage services, infrastructure services, software
    services, or any other specific services that you need. Figure [1-1](#495447_1_En_1_Chapter.xhtml#Fig1)
    shows how different devices are connected to cloud systems at a remote location.


    ![../images/495447_1_En_1_Chapter/495447_1_En_1_Fig1_HTML.jpg](images/495447_1_En_1_Chapter/495447_1_En_1_Fig1_HTML.jpg)


    **Figure 1-1** How different devices are connected to cloud systems at a remote
    location


    If we are able to access any of the services present at the remote location using
    the internet or networking, then we call this *cloud computing*.


    ### Control of Cloud Systems


    Obviously, if someone is allowing access to use their personal system over the
    internet, then they may want to restrict access in some ways. Or, they may want
    one group of people to have full access, but another group to have limited access.
    This is done to avoid security issues and not expose the vulnerabilities present
    in the system. To solve this problem, cloud computing comes in four types.


    - Public cloud

    - Private cloud

    - Hybrid cloud

    - Community cloud


    #### Public Cloud


    When the entire cloud infrastructure is open for public consumption, then it is
    called a *public cloud*. Examples are the email services provided by Google or
    Yahoo.


    #### Private Cloud


    When only a specific group of people can access the services provided by a cloud,
    then it is called a *private cloud*. An example is when people in an organization
    can access the resources present in the organization’s cloud, but no one from
    outside the organization can access the same resources.


    #### Community Cloud


    When a cloud service is accessible to a group of organizations, then it is called
    a *community cloud*. For example, different organizations can access the services
    of AWS or the Google Cloud Platform by registering. So, the same services are
    available to all the organizations that have paid for it, but not to anyone else.


    #### Hybrid Cloud


    When a cloud service provides both options (i.e., services of a public and private
    cloud), then it is termed a *hybrid cloud*. An example is using two services of
    AWS. When we train a model using SageMaker training, it is a private task for
    specific organizations because it contains sensitive data and other things, but
    when we train a model and then share the endpoint publicly, it is a public cloud
    because whoever has the link can access that endpoint. (You’ll learn more about
    SageMaker in later chapters.)


    ### Cloud Services


    Now that you have learned about the different ways of accessing a cloud, let’s
    dive deeper and look at the services that a cloud platform may provide. We can
    group these services into four domains.


    - Infrastructure as a service (IaaS)

    - Platform as a service (PaaS)

    - Software as a service (SaaS)

    - Anything as a service (XaaS)'
