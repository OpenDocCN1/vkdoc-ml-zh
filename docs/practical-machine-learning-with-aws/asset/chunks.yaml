  trans: '

    ### 创建推理脚本


    训练脚本用于训练模型。但是，一旦模型训练完成，我们就需要进行预测，无论是像我们在第 6 章中看到的实时推理，还是本章将要介绍的批量转换。我们将推理脚本保存在名为
    `predictor.py` 的文件中。


    预测器文件包含以下组件：


    *   `ScoringService()` 类


    *   `ping()` 方法


    *   `transformation()` 方法


    *   任何其他所需的辅助函数


    `ScoringService()` 类包含两个函数。第一个函数 `get_model()` 负责加载并反序列化模型，而第二个方法 `predict()`
    则负责进行预测。请记住，推理脚本也使用与训练脚本相同的基础文件夹 `/opt/ml`。以下是 `ScoringService()` 类的脚本：


    ```

    prefix = ''/opt/ml/''

    model_path = os.path.join(prefix, ''model'')

    class ScoringService(object):

    model = None

    @classmethod

    def get_model(cls):

    if cls.model == None:

    with open(os.path.join(model_path, ''randomForest-tree-model.pkl''), ''r'') as
    inp:

    cls.model = pickle.load(inp)

    return cls.model

    @classmethod

    def predict(cls, input):

    clf = cls.get_model()

    return clf.predict(input)

    ```


    `ping()` 方法仅用于检查运行代码的 Docker 容器是否健康。如果不健康，则返回 404 错误，否则返回 202。


    ```

    @app.route(''/ping'', methods=[''GET''])

    def ping():

    status = 200 if health else 404

    return flask.Response(response=''\n'', status=status, mimetype=''application/json'')

    ```


    `transformation()` 是负责读取测试文件并调用所需方法和类的方法。这里需要理解的一点是，整个端点生成过程本质上就是创建一个 API。一旦创建了
    API，数据就会作为 POST 请求发送，然后我们就会收到预测结果作为响应。整个架构是使用 Flask 框架构建的。


    数据是使用 POST 方法发送的，因此要读取它，我们需要使用 `StringIO()` 方法来解码数据。一旦数据被解码，我们就可以使用常规的 Pandas
    方法来读取它。`transformation()` 函数将数据发送给 `ScoringService()` 类的 `predict()` 函数。该方法将输出发送回
    `transformation()` 函数。这个预测输出借助 `StringIO()` 函数被发送回调用 API 的主机。这样就完成了端点的整个循环。以下是
    `transformation()` 的代码：


    ```

    @app.route(''/invocations'', methods=[''POST''])

    def transformation():

    data = None

    if flask.request.content_type == ''text/csv'':

    data = flask.request.data.decode(''utf-8'')

    s = StringIO.StringIO(data)

    data = pd.read_csv(s, header=None)

    else:

    return flask.Response(response=''This predictor only supports CSV data'', status=415,
    mimetype=''text/plain'')

    print(''Invoked with {} records''.format(data.shape[0]))

    # Do the prediction

    predictions = ScoringService.predict(data)

    # Convert from numpy back to CSV

    out = StringIO.StringIO()

    pd.DataFrame({''results'':predictions}).to_csv(out, header=False, index=False)

    result = out.getvalue()

    return flask.Response(response=result, status=200, mimetype=''text/csv'')

    ```


    我们将使用这个 Python 文件进行预测，但为了高效运行服务器，我们需要一些配置文件。让我们在下一节中探讨它们。


    ### 配置端点生成文件


    要成功运行推理服务器，我们需要配置以下文件：


    *   `nginx.conf` 文件


    *   `serve` 文件


    *   `wsgi.py` 文件


    通常我们不会更改这些文件。我们创建它们，然后直接用于我们的预测。我们不会逐行详细讲解这些文件，但让我们了解每个文件的目的。


    Nginx 文件用于启动服务器，并使得部署在 EC2 实例上的 Docker 容器与 SageMaker 网络外部或内部的客户端之间建立连接成为可能。Nginx
    使用一个名为 Gunicorn 的 Python 框架来帮助设置 HTTP 服务器。


    Serve 利用正在运行的 Gunicorn 服务器来使不同资源之间的连接变得可行。具体来说，它用于以下目的：


    *   高效利用 CPU 数量来运行模型


    *   定义服务器超时时间


    *   生成日志


    *   使用 Nginx 和 Gunicorn 启动服务器


    *   如果事情没有按预期进行，则停止服务器


    最后，`wsgi.py` 文件用于告诉服务器关于我们的 `predictor.py` 文件的信息。我们可以在本书的 GitHub 仓库中探索每个文件中的代码。请记住，这些文件非常重要，因为没有它们，服务器将永远无法运行；因此，你将无法进行预测。除非你非常确定自己在做什么，否则不要更改这些文件。

