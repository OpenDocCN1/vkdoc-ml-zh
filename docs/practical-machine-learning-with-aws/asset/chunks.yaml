    ''S3Output'': {

    ''S3Uri'': ''s3://slytherins-test/'',      # 输出需要存储的位置

    ''LocalPath'': ''/opt/ml/processing/train'',   # 需要查找输出的本地目录

    ''S3UploadMode'': ''EndOfJob''     # 作业完成时上传

