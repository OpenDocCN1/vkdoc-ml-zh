- '# 第一部分 Amazon Web Services 简介


  '
- "# 1. 云计算与 AWS\n\n本章涵盖云计算和 Amazon Web Services (AWS) 的不同组成部分。阅读本章后，您将了解 AWS 的不同重要组件，这将使您更容易理解\
  \ AWS 的机器学习组件。\n\n## 什么是云？\n\n那么，什么是云？如果您看看互联网上分享的梗图，您可能会认为云不过是别人的计算机，您可以从自己的计算设备上访问它，用于个人用途。那么问题来了，既然我们有自己的计算机，为什么还需要别人的计算机呢？这是因为我们的计算机可能没有其他系统所拥有的东西。也许您购买系统时的预算比别人少，因此他拥有更多的计算能力可供使用。因此，与其购买一个计算能力更强的新系统，不如暂时访问其他系统，然后再回到自己的系统。这就是云提供的好处。而且，顺便说一句，我们都知道其他系统并非普通的系统。云系统由\
  \ Amazon 和 Google 等大公司提供。因此，即使您试图购买一个计算能力与云系统相当的新系统，您也负担不起。\n\n正式地说，*云*是一种特定的计算服务，位于不同的远程位置，我们可以通过网络或互联网进行访问。云服务可能包括存储服务、基础设施服务、软件服务或您需要的任何其他特定服务。图\
  \ 1-1 展示了不同设备如何连接到远程位置的云系统。\n\n![../images/495447_1_En_1_Chapter/495447_1_En_1_Fig1_HTML.jpg](img/495447_1_En_1_Fig1_HTML.jpg)\n\
  \n图 1-1\n\n不同设备如何连接到远程位置的云系统\n\n如果我们能够通过互联网或网络访问远程位置的任何服务，那么我们将此称为*云计算*。\n\n## 云系统的控制\n\
  \n显然，如果有人允许通过互联网访问其个人系统，那么他们可能希望以某种方式限制访问。或者，他们可能希望一组人拥有完全访问权限，而另一组人拥有有限访问权限。这样做是为了避免安全问题，并且不暴露系统中存在的漏洞。为了解决这个问题，云计算分为四种类型。\n\
  \n*   公有云\n\n*   私有云\n\n*   混合云\n\n*   社区云\n\n### 公有云\n\n当整个云基础设施对公众开放使用时，则称为*公有云*。例如，Google\
  \ 或 Yahoo 提供的电子邮件服务。\n\n### 私有云\n\n当只有特定群体可以访问云提供的服务时，则称为*私有云*。例如，组织内的人员可以访问组织云中的资源，但组织外的人员无法访问相同的资源。\n\
  \n### 社区云\n\n当云服务可供一组组织访问时，则称为*社区云*。例如，不同的组织可以通过注册来访问 AWS 或 Google Cloud Platform\
  \ 的服务。因此，所有已付费的组织都可以使用相同的服务，但其他组织则不能。\n\n### 混合云\n\n当云服务同时提供两种选项（即公有云和私有云的服务）时，则称为*混合云*。例如，使用\
  \ AWS 的两种服务。当我们使用 SageMaker 训练来训练模型时，这对特定组织来说是私有任务，因为它包含敏感数据和其他内容；但是，当我们训练模型然后公开共享端点时，它就是公有云，因为任何拥有链接的人都可以访问该端点。（您将在后续章节中了解更多关于\
  \ SageMaker 的信息。）\n\n## 云服务\n\n现在您已经了解了访问云的不同方式，让我们深入探讨云平台可能提供的服务。我们可以将这些服务分为四个领域。\n\
  \n*   基础设施即服务 (IaaS)\n\n*   平台即服务 (PaaS)\n\n*   软件即服务 (SaaS)\n\n*   一切即服务 (XaaS)\n\
  \n\n\n### 基础设施即服务（IaaS）\n\n顾名思义，当云服务提供商允许用户访问其构建的基础设施时，这便被视为 IaaS。例如，云提供商可能提供对虚拟机、物理机、存储设备等的访问。比如，我们可以使用\
  \ Google Drive 将信息存储在云端，因为谷歌将其硬盘作为服务提供。AWS 还提供了名为 EC2 实例的机器，个人可以使用它们来执行需要更高计算能力的操作。\n\
  \n### 平台即服务（PaaS）\n\n有时，我们不需要整个基础设施，而只需要一个特定的开发运行时环境，以便编写代码、制作游戏或网站。这样，构建整个基础设施的成本就可以降低。这种类型的服务就是\
  \ PaaS。例如，我们可以使用 Google Colaboratory 来编写 Python 或 R 代码。此外，我们还可以使用 AWS SageMaker\
  \ 来训练机器学习模型并将其投入生产。还有其他服务提供商，如 Microsoft Azure、Google Cloud Platform、IBM Cloud 等。\n\
  \n### 软件即服务（SaaS）\n\n当我们不需要运行时环境，但想使用带有内置运行时的特定软件应用程序时，我们就不需要 PaaS（它会提供运行时环境以及我们需要安装的依赖项和软件）。因此，存在一些云服务，它们为特定用途提供特定软件，称为\
  \ SaaS。SaaS 的例子包括用于数据管理的 Amazon Ground Truth 和微软的 Office 365。\n\n### 一切皆服务（XaaS）\n\
  \n前三种服务类型已在市场上存在相当长的时间，但现在，由于技术的进步，云服务提供商几乎将一切事物都作为云服务来提供。例如，我们现在可以绘制网页草图并将其交给 Azure，Azure\
  \ 会将其转换为 HTML 页面。此外，你可以通过与连接到 AWS 的 Alexa 对话来播放在线歌曲。所有这些都归入 XaaS 的范畴。\n\n现在，让我们深入了解一个特定的云服务提供商——亚马逊网络服务（AWS）。\n\
  \n## 亚马逊网络服务简介\n\nAWS 在许多国家提供全球云计算服务，目前负责处理许多公司（包括小型和大型企业）的基础设施。根据 AWS 文档，目前 AWS\
  \ 为 190 个国家的数十万家企业提供服务。\n\nAWS 提供超过 150 种可按需使用并根据使用时间付费的服务。目前，AWS 在许多区域都设有数据服务器，你可以选择仅使用离用户最近的一个区域服务器。以下是全球数据服务器列表：\n\
  \n*   **北美**\n    *   俄亥俄州（美国东部）\n\n    *   俄勒冈州（美国西部）\n\n    *   北加利福尼亚（美国西部）\n\
  \n    *   北弗吉尼亚（美国西部）\n\n    *   GovCloud（美国东部和美国西部）\n\n    *   加拿大（中部）\n\n*   **南美**\n\
  \    *   圣保罗\n\n*   **欧洲/中东/非洲**\n    *   伦敦（欧洲）\n\n    *   斯德哥尔摩（欧洲）\n\n    * \
  \  法兰克福（欧洲）\n\n    *   巴黎（欧洲）\n\n    *   巴林（中东）\n\n    *   爱尔兰（欧洲）\n\n*   **亚太地区**\n\
  \    *   新加坡（亚太地区）\n\n    *   北京（中国大陆）\n\n    *   悉尼（亚太地区）\n\n    *   东京（亚太地区）\n\
  \n    *   首尔（亚太地区）\n\n    *   宁夏（中国大陆）\n\n    *   大阪（亚太地区）\n\n    *   孟买（亚太地区）\n\
  \n    *   香港（亚太地区）\n\n正如我所提到的，AWS 拥有超过 150 种服务。问题是，你如何访问它们？是否有一个集中的地方可以访问它们？嗯，是的！这个地方叫做\
  \ AWS 管理控制台。让我们看看这个控制台的一些特性，以及它如何真正对用户有帮助。\n\n## AWS 管理控制台\n\n使用 AWS 管理控制台（AMC），你不仅可以访问服务，它还提供了一些其他很酷的功能。其中一些如下：\n\
  \n*   一旦你在 AWS 上创建了账户并登录到 AMC，你的会话将仅保持 12 小时的活动状态。之后，你需要重新登录。显然，这个时间限制是可定制的。提供此功能是出于安全原因。\n\
  \n*   你不仅可以从 Web 访问 AMC，还可以使用移动应用程序。AMC 应用程序在 iOS 和 Android 设备上都有。\n\n*   AMC 提供对不同学习资源、文章、文档、视频等的访问，这有助于我们理解\
  \ AWS 的不同服务。\n\n*   你甚至可以根据你的使用情况和需求自定义和个性化 AMC。\n\n登录 AWS 后，你将看到以下功能：\n\n*   用于查找特定服务的搜索按钮\n\
  \n*   用户最近访问的服务\n\n*   所有服务的列表\n\n*   自动化工作流程的链接\n\n*   学习资源的链接\n\n图 1-2、1-3、1-4\
  \ 和 1-5 展示了 AMC 的不同界面。\n\n![../images/495447_1_En_1_Chapter/495447_1_En_1_Fig5_HTML.jpg](img/495447_1_En_1_Fig5_HTML.jpg)\n\
  \n图 1-5\n\nAMC 上的所有服务列表\n\n![../images/495447_1_En_1_Chapter/495447_1_En_1_Fig4_HTML.jpg](img/495447_1_En_1_Fig4_HTML.jpg)\n\
  \n图 1-4\n\nAMC 上的自动化\n\n![../images/495447_1_En_1_Chapter/495447_1_En_1_Fig3_HTML.jpg](img/495447_1_En_1_Fig3_HTML.jpg)\n\
  \n图 1-3\n\nAMC 上的学习资源\n\n![../images/495447_1_En_1_Chapter/495447_1_En_1_Fig2_HTML.jpg](img/495447_1_En_1_Fig2_HTML.jpg)\n\
  \n图 1-2\n\nAMC 上的查找服务功能和最近访问的服务\n\n我们将在下一节关于机器学习的内容中详细查看如何登录 AWS 并访问 AMC。现在，让我们进入\
  \ AWS 的下一个功能，称为 AWS 命令行界面（AWS CLI）。\n\n## AWS 命令行界面\n\n如果说 AMC 为你提供了访问 AWS 服务的可视化界面，那么\
  \ CLI 则赋予你通过控制台访问相同服务的更高级能力。它由那些已经使用 AWS 一段时间的高级开发人员使用。你只需下载一个工具，然后就可以用它来控制不同的服务、编写脚本，并控制服务的自动化。\n\
  \nAWS 提供了大量资源，如参考文档、GitHub 仓库、论坛等，用于理解 AWS CLI。虽然你可以从默认控制台（如 Windows 的命令提示符或 Linux\
  \ 和 Mac 的终端）使用 AWS CLI，但还有一个专用的 AWS Shell，它提供了一些高级功能。其中一些如下：\n\n*   自动补全支持\n\n*\
  \   命令的内联文档\n\n*   操作系统 Shell 命令，也可以从同一个 Shell 中执行\n\n当我们详细讲解机器学习时，会大量使用 CLI。因此，我们将在该部分直接探讨其实际应用。\n\
  \n由于 AWS 提供了如此多的服务，在一本书中涵盖所有内容是不可能的。此外，这本书是关于机器学习的，因此在这里涵盖每一项服务也没有意义。但是，我们将讨论我认为非常重要且常用的三项服务。以下是我们将要讨论的服务：\n\
  \n*   AWS 存储服务\n\n*   AWS 计算服务\n\n*   AWS 网络和内容分发服务\n\n让我们从第一个服务——存储服务开始讨论。\n\n\n\
  \n## AWS 存储服务\n\n当我们在云平台上工作并使用其服务时，显然会根据需求产生大量数据。例如，如果我们正在构建一个网站，那么我们将需要存储图像、视频和许多其他内容。如果我们有一个机器学习模型，那么我们将需要处理数\
  \ TB 的数据。这些数据可以是结构化的，也可以是非结构化的。同样，出于业务目的，我们可能拥有多个 Excel 表格或演示文稿。所有这些数据类型都必须存储在云中的某个位置，而云平台应提供此功能。\n\
  \nAWS 提供了多种数据存储选项，本节我们将讨论其中三种。\n\n*   Amazon S3\n\n*   Amazon 弹性文件系统 (EFS)\n\n*\
  \   AWS Storage Gateway\n\n### Amazon S3\n\nAWS 最常用的服务之一是 Amazon Simple Storage\
  \ System (S3)。它为您提供了一个界面，您可以像在本地文件系统中存储数据一样存储数据。您可以创建文件夹和多个子目录来组织数据。以下是 Amazon S3\
  \ 提供的一些基本功能：\n\n*   它提供可扩展性，目前在行业中处于领先地位。\n\n*   它提供实时数据可用性。\n\n*   它提供安全性和优化的性能。\n\
  \n*   其持久性高达 99.9999999…%（11 个 9）。\n\nS3 使用起来非常简单。首先，让我们了解一些 Amazon S3 使用的命名约定。\n\
  \n#### 存储桶\n\n*存储桶*就像本地文件系统中的一个文件夹。它是一个用于存储文件的容器。\n\n#### 对象\n\n您在 S3 中存储的文件称为*对象*。所有对象都存储在存储桶内。\n\
  \n#### 键\n\n您存储的每个对象都会被赋予一个称为*键*的唯一标识符。此外，不仅对象，存储桶也具有唯一的键。\n\nS3 是否如其名称所示仅提供简单的存储？我的回答是既是也不是。说是，因为它的主要用途仅仅是存储，而且确实非常简单。说不是，因为它围绕存储功能还有许多其他特性，使其成为每个客户的首选服务。让我们看看是哪些特性让\
  \ S3 如此强大。\n\n*   根据数据使用的频率，S3 提供不同类型的存储类别。\n    *   **S3 STANDARD**：需要频繁访问的数据\n\
  \n    *   **S3 STANDARD_IA**：需要较少访问的数据\n\n    *   **S3 GLACIER**：我们希望归档的数据\n\n*\
  \   没有安全性的存储毫无意义。AWS 为您创建的存储桶提供访问控制。您可以使用*策略*来实现这一点。以下是我们可以应用的基于策略的三个控制级别：\n   \
  \ *   谁可以访问哪个存储桶？\n\n    *   可以从哪个网络访问存储桶？\n\n    *   应该在什么时间访问存储桶？\n\n*   您还可以创建对象的版本。例如，如果同一个\
  \ Excel 表格被更新了五次，那么可以创建它的五个版本。\n\n在整本书中，Amazon S3 是我们将随机器学习服务持续使用的服务。我们将在下一节详细讨论这些服务。\n\
  \n### Amazon 弹性文件系统\n\nAmazon 弹性文件系统 (EFS) 是一个弹性网络文件系统，与大多数 AWS 云服务兼容。它被称为*弹性*，是因为它既可扩展也可收缩。如果您上传的数据量较小，它会缩小其大小以适应这些数据。但如果您上传的数据量较大，它可以扩展其大小。扩展规模可达\
  \ PB 级。EFS 与最新版本的 NFS（即 NFSv4.1）配合使用。因此，它几乎与您想要开发的任何东西兼容。\n\n提示\n\n使用网络文件系统 (NFS)，您可以像在本地系统中执行操作一样，进行存储、编辑、删除和其他操作。它是一种使用*网络附加存储*\
  \ (NAS) 的分布式文件系统。当前版本的 NFS 提供了高级功能，例如强身份验证、文件缓存以及对 Windows 文件系统的支持。现在可以在全球广域网上访问\
  \ NFS。\n\n与 S3 类似，EFS 提供两种文件存储类型。\n\n*   标准访问\n\n*   不频繁访问\n\n当我们想要频繁访问数据时，我们使用标准访问，而不常使用的数据可以存储在\
  \ EFS 的不频繁访问中。此外，与 S3 一样，您可以在 EFS 中对数据进行身份验证和授权，并进一步对其进行加密。最后，您可以像 S3 一样添加策略，以维护访问控制。\n\
  \n### AWS Storage Gateway\n\nAWS Storage Gateway 是 AWS 提供的一种混合基础设施。如果您希望使用本地基础设施来满足所有存储需求，但又希望获得一些功能，以便能够使用\
  \ AWS 的云存储服务，那么 Storage Gateway 是最佳解决方案。\n\nStorage Gateway 提供三种解决方案。\n\n*   文件网关\n\
  \n*   卷网关\n\n*   磁带网关\n\n#### 文件网关\n\n使用此服务，所有文件都存储在 S3 中。它为您提供一个虚拟应用程序，您可以使用它来管理\
  \ S3 中的所有文件。检索/存储文件是通过网络文件系统或服务器消息块等协议完成的。我们所说的虚拟软件不过是一个用于管理文件的虚拟机。这可以基于 VMware\
  \ ESXi 或 Microsoft Hyper-V。\n\n#### 卷网关\n\n您可以直接将卷存储在云中，而不是文件，之后可以将其挂载为 Internet\
  \ 小型计算机系统接口 (iSCSI)。同样，部署在本地的软件是一个虚拟机。支持以下类型的卷：\n\n*   缓存卷\n\n*   存储卷\n\n拥有缓存卷意味着将数据完全存储在\
  \ S3 中，然后经常使用的数据被缓存在本地系统中。图 1-6 显示了 AWS 提供的缓存卷网关架构。\n\n![../images/495447_1_En_1_Chapter/495447_1_En_1_Fig6_HTML.jpg](img/495447_1_En_1_Fig6_HTML.jpg)\n\
  \n图 1-6\n\n缓存卷，Storage Gateway 架构\n\n图 1-6 分为三个部分。左侧部分显示了使用本地架构的实际用户。中间组件是组织的本地基础设施。右侧组件具有用于数据备份的\
  \ S3 连接。\n\n当您将整个数据存储在本地，然后将这些数据的快照版本备份到云端时，这就是卷网关的存储卷支持。我们可以在灾难恢复的情况下使用它。例如，如果您丢失了本地数据，您可以从云端下载最新的快照。同样，我们在这里使用\
  \ S3 作为存储服务。图 1-7 显示了存储卷的架构。\n\n![../images/495447_1_En_1_Chapter/495447_1_En_1_Fig7_HTML.jpg](img/495447_1_En_1_Fig7_HTML.jpg)\n\
  \n图 1-7\n\n存储卷，Storage Gateway 架构\n\n图 1-7 中的架构与图 1-6 几乎相同，但不同之处在于，我们不是存储整个数据，而是仅存储本地保存数据的快照。\n\
  \n\n\n#### 磁带网关\n\n此服务用于数据归档。为此，我们可以使用 Amazon S3 Glacier 或 Deep Archive 作为存储服务。它也可以使用虚拟机在本地部署。图\
  \ 1-8 所示的架构展示了磁带网关的工作原理。\n\n![../images/495447_1_En_1_Chapter/495447_1_En_1_Fig8_HTML.jpg](img/495447_1_En_1_Fig8_HTML.jpg)\n\
  \n图 1-8\n\n磁带网关，存储网关架构\n\n在架构中可以看到，不同的基础设施将数据存储到各自的 S3 存储桶中。随后，所有 S3 存储桶的数据被合并，然后存储到\
  \ Amazon S3 Glacier 中。虚拟磁带本质上只是一种存储数据的方式。就像物理磁带在未使用时是空的，使用时才被填充数据一样，虚拟磁带也可以是空白的，并可根据需要填充数据。\n\
  \n现在我们已经了解了 AWS 存储服务的运作方式并查看了不同的服务，接下来让我们继续探索计算服务。\n\n## AWS 计算服务\n\n在上一节中，您学习了如何使用\
  \ AWS 服务存储数据。在本节中，我们将介绍 AWS 提供的一些计算服务。当我们运行应用程序、玩游戏或开发某些东西时，我们需要系统的计算能力。我们通过 RAM、处理器、显卡等来衡量计算能力。有时我们可能有较大的系统需求，但由于资金或资源不足而无法满足。这就是\
  \ Amazon 为所有计算需求提供不同类型服务的原因。在本节中，我们将讨论以下 AWS 计算服务：\n\n*   Amazon EC2\n\n*   Amazon\
  \ ECR\n\n### Amazon EC2\n\n弹性计算云 (EC2) 减轻了用户在硬件需求上投资的负担。无论需求如何，EC2 都允许您创建相应数量的虚拟服务器，以便立即处理工作。此外，它不是静态的基础设施，而是动态的。这意味着，如果计算需求突然激增，EC2\
  \ 会自动扩展，而不会中断正在进行的进程。\n\n以下是 EC2 为其用户提供的一些功能：\n\n*   它提供了一个环境，我们可以在其中进行计算密集型工作。这是在\
  \ AWS 称之为*实例*的虚拟计算环境中完成的。\n*   无论您的软件或硬件需求是什么，您都可以使用 Amazon 系统映像 (AMI) 服务进行配置。\n\
  *   它为您启动的所有实例提供安全性。它还提供安全组，帮助用户配置防火墙、端口、IP 范围等。\n\n此外，还有许多其他服务可以帮助用户进行日常编码和开发工作。\n\
  \nEC2 提供的实例类型可以分为以下几类：\n\n*   通用型\n*   计算优化型\n*   内存优化型\n*   存储优化型\n*   加速计算型\n\n\
  #### 通用型\n\n这些类型提供了计算能力、存储和网络之间的平衡。它们进一步分为以下几组：\n\n*   A1\n*   T3\n*   T2\n*   M6g\n\
  *   M5\n*   M5a\n*   M5n\n*   M4\n\n#### 计算优化型\n\n当工作需要高计算使用率并需要强大处理器时，您可以使用计算优化型实例。它们可用于媒体任务、科学任务、快速\
  \ Web 服务器甚至游戏服务器。它们可以分为以下类型：\n\n*   C5\n*   C5n\n*   C4\n\n您可以在 [`https://aws.amazon.com/ec2/instance-types/`](https://aws.amazon.com/ec2/instance-types/)\
  \ 找到有关这些组的更多信息。\n\n#### 内存优化型\n\n如果工作需要处理大型数据集，您需要内存优化型实例。它们分为以下类型：\n\n*   R\n*\
  \   R5a\n*   R5n\n*   R4\n*   X1e\n*   X1\n*   高内存\n*   z1d\n\n#### 加速计算型\n\n对于所有机器学习和深度学习应用，首选这类实例。这些系统速度非常快，精度也非常高。它们可以分为以下类型：\n\
  \n*   P3\n*   P2\n*   Inf1\n*   G4\n*   G3\n*   F1\n\n#### 存储优化型\n\n如果您想处理海量数据集，并希望以更低的延迟实现更快的读写操作，那么这种类型是最佳选择。它们可以分为以下类型：\n\
  \n*   I3\n*   I3en\n*   D2\n*   H1\n\n您可以在 [`https://aws.amazon.com/ec2/instance-types/`](https://aws.amazon.com/ec2/instance-types/)\
  \ 找到关于每种实例类型的详细信息。\n\n### 其他服务\n\nAWS 还提供与大多数前述实例类型配合使用的其他服务。这样做是为了根据您的使用情况为您提供经济上的优惠。这些服务包括：\n\
  \n*   按需实例\n*   预留实例\n*   竞价型实例\n\n如果您认为您的工作不会花费很长时间，比如几天或几个月，那么您可以选择*按需实例*。这些实例按小时计费。无论您需要多大的计算、内存和存储容量，都可以使用，但费用将根据使用的小时数计算。\n\
  \n*预留实例*适用于长期使用，因此用户可获得的折扣高达按需实例价格的 75%。这还提供了更改类型的选项。\n\n有时会有大量 EC2 实例未被使用。*竞价型实例*让您能够利用这些实例，与使用按需实例相比，使用竞价型实例可获得高达\
  \ 90% 的折扣。\n\n## Amazon Elastic Container Registry\n\n近年来，Docker 席卷了整个行业。它允许公司将其基础设施与代码分离。简而言之，Docker\
  \ 为您提供了一个平台，您可以在该平台上高效地开发和交付代码，而无需担心底层架构。Amazon ECR 是一个存储库，用于存放您希望在 AWS 中运行的所有 Docker\
  \ 镜像。\n\n一旦您启动了一个 EC2 实例，您就可以选择在该实例上运行任何 Docker 镜像。AWS 有自己的预构建 Docker 镜像可供您导入，或者您也可以将自己定制的\
  \ Docker 镜像上传到 ECR，然后导入到 EC2 实例中。\n\nAmazon ECR 包含以下组件：\n\n*   注册表\n*   身份验证令牌\n\
  *   存储库\n*   策略\n*   镜像\n\n注册表就像一个普通的登记簿，您需要为您上传到 ECR 的每个镜像进行登记。为了确保只有合适的人才能访问 ECR\
  \ 上传镜像，会使用身份验证令牌。存储库是实际存储您的 Docker 镜像的地方。镜像就是您实际的 Docker 文件。这些是您创建的包含所有依赖项的文件。您使用镜像将它们存储在\
  \ ECR 中，并导入到 EC2 中。\n\n在后续章节介绍 SageMaker 时，您将详细了解 ECR 的操作。\n\n## AWS 网络和内容分发服务\n\
  \n在本节中，我们将讨论 AWS 在该领域的三个重要服务。\n\n*   Amazon VPC\n*   Amazon API Gateway\n*   Amazon\
  \ CloudFront\n\n\n\n### Amazon VPC\n\nAmazon Virtual Private Cloud（VPC）是一种我们创建的虚拟网络，用于将特定内容与整个用户域隔离开来。它的运作方式类似于普通云，但并非拥有独立的基础设施，而是只有一个云基础设施，并在其上构建多个虚拟云。例如，我们可以为市场部、财务部和运营部分别创建独立的虚拟云。只有各自部门的用户知道每个云中发生了什么，但实际上所有存储的文件都位于同一存储空间，由所有部门共享。因此，每个云都可以拥有自己的安全策略、访问级别等。\n\
  \nAmazon VPC 也是如此，只不过它还提供了可扩展的 AWS 架构。Amazon VPC 包含以下组件：\n\n*   *子网*：每个虚拟私有云只能由一组\
  \ IP 地址访问。来自列表之外地址的任何请求都将被拒绝访问。这个列表称为*子网*。\n\n*   *路由表*：如前所述，虚拟私有云与本地云共享相同的基础设施。但\
  \ AWS 也提供了自己的功能。其中一项功能是负载均衡，这意味着如果服务器负载变得非常高，我们可以将流量转移到备用服务器。一旦我们在 VPC 中工作，就必须知道流量需要被导向的路由。这些路由存储在路由表中。\n\
  \n*   *互联网网关*：通过互联网网关，您的所有虚拟私有云都能够与底层的 EC2 实例通信。\n\n*   *端点*：如果我们想将虚拟私有云连接到 AWS\
  \ 提供的任何服务，只需使用 Amazon VPC 提供的 VPC 端点服务即可。\n\n图 1-9 展示了一个使用互联网进行 VPC 访问的架构。\n\n![../images/495447_1_En_1_Chapter/495447_1_En_1_Fig9_HTML.jpg](img/495447_1_En_1_Fig9_HTML.jpg)\n\
  \n图 1-9\n\nAmazon VPC 架构\n\n如果你查看图 1-9 中的架构，可以看到在 VPC 内部有两个 EC2 实例，每个实例都有一个公有 IP\
  \ 地址和一个私有 IP 地址。如果你想从 VPC 外部访问服务，则使用公有 IP 地址；而从 VPC 内部访问相同服务时，则使用私有 IP 地址。你可以看到有一个路由器，它使用路由表来了解不同的路由，然后通过互联网网关进行访问。VPC\
  \ 还有一个 IP 地址和端口号（在图 1-9 中，IP 地址是 172.31.0.0，端口号是 16）。\n\n### Amazon API Gateway\n\
  \n在理解 API Gateway 之前，我先简要介绍一下应用程序编程接口（API）。API 是一种服务，用于让两个或多个应用程序相互通信。例如，当我们使用 Facebook\
  \ 上传图片或视频时，我们使用的是 Facebook 的上传 API；而当我们点赞、评论或分享时，我们使用的是 Facebook 的另一个 API。因此，在当前的开发场景中，每个小服务都被开发出来，然后转换为\
  \ API（REST API 是使用最广泛的 API 类型之一），之后便可以通过网络协议来使用。Amazon API Gateway 为您提供了有效管理这些 API\
  \ 的服务。\n\nAmazon API Gateway 可用于创建、发布、维护、监控和保护不同类型的 API，例如 REST、HTTP 或 WebSocket\
  \ API。这些 API 不仅可以拥有自己的应用程序，还可以访问和使用不同的 AWS 服务。\n\n图 1-10 展示了 API Gateway 的架构。\n\n\
  ![../images/495447_1_En_1_Chapter/495447_1_En_1_Fig10_HTML.jpg](img/495447_1_En_1_Fig10_HTML.jpg)\n\
  \n图 1-10\n\nAPI Gateway 架构\n\n在图 1-10 中，Amazon CloudWatch 用于监控当前状态下 AWS 和 API Gateway\
  \ 提供的任何服务的日志。API Gateway 缓存通过存储最常用的组件来降低延迟。所有 API 也可以连接到 AWS 的不同服务，例如 AWS Lambda、EC2、Kinesis（用于实时数据分析）、DynamoDB（云数据库）等。它也可以被任何第三方应用程序使用。\n\
  \n### Amazon CloudFront\n\n网络上有很多服务为我们提供了构建网站并将其提供给最终用户的多种选择。AWS 可以算作其中之一，但它提供了其他服务所不具备的功能。AWS\
  \ 提供了低延迟的选项。为了稍微详细地理解延迟，想象一下你正在打开一个网站，其服务器位于印度，而你却在朝鲜（假设该国为其公民提供互联网）。由于服务器距离很远，使用该网站提供的任何服务都需要很长时间。但是，如果该网站部署在\
  \ AWS 上，那么用户就可以使用位于韩国的服务器，而不是印度的服务器。因为服务器离该国更近，页面加载速度会更快。\n\nAWS 是如何做到这一点的？答案是其名为\
  \ CloudFront 的服务。CloudFront 又是如何做到的呢？它通过使用 AWS 提供的边缘站点来实现。当你创建一个网站时，它包含静态和动态内容，例如\
  \ HTML 页面、CSS 和 JavaScript 等。因此，如果来自你服务器所在位置之外的请求要使用该网站，CloudFront 会将网站的所有内容分发到离请求发起位置最近的边缘站点。因此，由于内容是从最近的服务器交付的，现在打开网站的速度会更快。要了解更多关于边缘站点的信息，请访问此链接：[`https://aws.amazon.com/cloudfront/features/`](https://aws.amazon.com/cloudfront/features/)。\n\
  \n在图 1-11 中，你可以看到 CloudFront 如何用于这种分发。让我们看看图中的每一步代表什么。\n\n![../images/495447_1_En_1_Chapter/495447_1_En_1_Fig11_HTML.jpg](img/495447_1_En_1_Fig11_HTML.jpg)\n\
  \n图 1-11\n\nAmazon CloudFront 服务\n\n1.  你的网站将要使用的所有文件都存储在 AWS 服务（如 S3）中，或者也可以是你自己的\
  \ HTTP 服务器。（步骤 1 和 2。）\n\n2.  现在，你通过提供 S3 或 HTTP 服务器的链接来启动 CloudFront 分发。（步骤 3。）\n\
  \n3.  一个特定于 CloudFront 的域名会被分配给你的分发。该域名也可以更改。（步骤 4。）\n\n4.  CloudFront 将刚刚创建的分发配置发送到全球所有的边缘站点。在这里，你的文件缓存被创建。（步骤\
  \ 5。）\n\n## 结论\n\n至此，我们完成了关于云计算和亚马逊云版本 AWS 的基本介绍。在本章中，你了解了与云计算相关的不同概念，并学习了 AWS 的不同组件。我们并未涵盖\
  \ AWS 的所有服务，因为其数量超过 150 个。一本书无法涵盖所有内容，但就本书而言，我们已经涵盖了所有重要的服务。\n\n在下一章中，我们将探讨 AWS\
  \ 的安全方面以及为保护应用程序安全而提供的不同类型的服务。\n\n"
- "# 2. AWS 定价与成本管理\n\n在上一章中，我们了解了一些云计算的概念，并探索了 AWS 提供的一些重要服务。在本章中，我们将探讨 AWS 如何对其提供的服务收费，以及我们如何以尽可能最小的经济负担，从\
  \ AWS 中获得最大收益。\n\n\n\n## 了解 AWS 的定价机制\n\n根据文档所述，AWS 试图通过与我们使用水电相同的计费方式来简化我们的生活。这意味着我们只需为实际使用的部分付费。当我们在本地拥有基础设施时，即使不使用，也必须为所有东西付费。在\
  \ AWS 中，情况则不同。这被称为*按需付费*。\n\n在图 2-1 和图 2-2 中，AWS 试图展示两种架构之间的定价差异。当我们查看图 2-1 时，我们看到即使我们没有使用基础设施（即红色阴影区域所示的部分），我们仍然需要为其付费。因此，最终你会发现每个月的费用都在增加，到年底时你会支付一大笔钱。\n\
  \n![../images/495447_1_En_2_Chapter/495447_1_En_2_Fig1_HTML.jpg](img/495447_1_En_2_Fig1_HTML.jpg)\n\
  \n图 2-1\n\n本地基础设施的定价\n\n相反，图 2-2 显示，使用量越大，付费越多，而在其余时间费用则低得多。因此，使用 AWS 可以节省更多成本。AWS\
  \ 帮助我们省钱的另一种方式是使用其提供的预留功能。\n\n![../images/495447_1_En_2_Chapter/495447_1_En_2_Fig2_HTML.jpg](img/495447_1_En_2_Fig2_HTML.jpg)\n\
  \n图 2-2\n\nAWS 基础设施的定价\n\n通过*预留实例*，AWS 意味着你预先为某项 AWS 服务付费，以获得更长时间的使用权。这意味着该服务后续所需的资源和基础设施已被预留，因此其他人无法使用这些预留的服务和基础设施。由于你要求长时间使用整个服务，这意味着\
  \ AWS 将持续从这些服务中获利。这些基础设施在资金层面永远不会闲置。因此，为了让选择预留实例的公司更容易，AWS 会向他们收取更少的费用。有时，其费用甚至低于我们在前一章讨论的按需实例的\
  \ 70%。\n\n现在，在深入了解 AWS 定价细节之前，让我们先看看 AWS 免费套餐，包括我们可以免费使用哪些服务以及可以使用多长时间。\n\n## AWS\
  \ 免费套餐\n\nAWS 在三个方面提供免费服务。\n\n*   始终免费的服务\n\n*   大约 12 个月内免费的服务\n\n*   提供试用期的服务\n\
  \n以下是一些始终免费的服务：\n\n*   DynamoDB 提供 25 GB 的免费存储空间。\n\n*   AWS Lambda 每月提供 100 万次请求和高达\
  \ 320 万秒的计算时间，始终免费。\n\n*   可以在 Amazon Glue 中免费存储 100 万个对象。\n\n以下是一些大约 12 个月内免费的服务：\n\
  \n*   5 GB 的 Amazon S3 存储\n\n*   每月 750 小时的 EC2 实例使用时间，支持 t2.micro 和 t3.micro\n\n\
  *   在 Amazon Comprehend 中处理 5 万个文本单位\n\n以下是提供试用期的服务：\n\n*   使用 t2.medium 实例，每月 250\
  \ 小时的 Amazon SageMaker 试用，为期两个月\n\n*   使用 m4.xlarge 实例，每月 50 小时的 Amazon SageMaker\
  \ 试用，为期两个月\n\n*   每月 125 小时的 Amazon SageMaker 托管服务，为期两个月\n\n## 影响 AWS 定价的因素\n\n\
  AWS 根据以下三个要素计算定价：\n\n*   计算\n\n*   存储\n\n*   数据传输\n\nAWS 不会对传入的数据传输或仅在 AWS 内部两个或多个服务之间的数据传输收费。但是，任何离开\
  \ AWS 网络的数据（出站数据传输），AWS 都会对此收费。费用取决于传输的数据量。数据量越大，每 GB 的价格越低。\n\n如前所述，计算费用按小时计费，存储费用按\
  \ GB 计费。既然我们已经了解了影响 AWS 定价的因素，我们必须知道如何优化 AWS 中的成本。\n\n## AWS 成本优化\n\n我们可以通过遵循以下四个简单步骤来构建经济高效的\
  \ AWS 架构：\n\n*   合理调整服务规模\n\n*   使用预留实例\n\n*   使用竞价市场\n\n*   使用成本管理器\n\n### 合理调整规模\n\
  \n*合理调整规模* 意味着你只使用你需要的服务。这意味着你只使用你需要的计算能力或只使用你需要的存储空间。你既不能过度配置，也不能在容量上妥协。AWS 为你提供了通过自动扩展来帮助你合理调整规模的服务，这包括根据使用情况进行纵向扩展、纵向缩减、横向扩展和横向缩减。\n\
  \n为了合理调整规模，组织应准确了解其需求和用量模式，然后利用 AWS 的弹性来实现合理调整。通过这种方式，组织可以节省高达 70% 的总成本。此外，必须记住这不是一次性的工作。这意味着公司必须定期规划其需求和模式，并做出相应的调整。因此，可以说合理调整规模是一个持续的过程。\n\
  \n你如何决定何时是再次进行合理调整的最佳时机？为此，AWS 为我们提供了一些可用于做出此类决策的工具。\n\n*   *Amazon CloudWatch*：你可以了解\
  \ CPU 利用率、网络吞吐量、磁盘 I/O 操作等，然后使用这些信息来决定是否需要进行修订后的合理调整。\n\n*   *AWS 成本优化*：这可以根据当前利用率提供关于合理调整的建议。我们将在下一节中进一步讨论这一点。\n\
  \n*   *AWS 成本管理器*：你可以使用成本管理器来了解公司产生成本的主要驱动因素。基于此，可以做出正确的决策。\n\n*   *AWS Trusted\
  \ Advisor*：这可以帮助你更多地了解闲置或未充分利用的资源。\n\n以下是在决定最佳合理调整规模时可以考虑的一些因素。这些因素可以分为以下几类：\n\n\
  *   基于性能数据的合理调整\n\n*   基于使用需求的合理调整\n\n*   通过停止实例进行合理调整\n\n*   基于选择正确实例系列的合理调整\n\n\
  *   基于选择数据库实例的合理调整\n\n在分析性能数据时，应识别出闲置或未充分利用的实例。为此，可以查看实例的 CPU 和内存使用情况。这可以使用 CloudWatch\
  \ 或前面提到的任何其他工具来完成。Amazon 建议，那些在四周内最大 CPU 或内存使用率低于 40% 的实例可以进行合理调整。\n\n在分析使用需求时，必须考虑以下几点：\n\
  \n*   如果负载在较长时间内保持恒定，我们可以选择预留实例，而不是按需实例或竞价实例。我们将在下一节详细讨论预留实例。\n\n*   如果负载不是恒定的，但我们可以说负载在大致相等的时间间隔内或在特定场景下增加或减少，那么我们可以使用\
  \ AWS EC2 实例的自动扩展功能。\n\n*   所有被认为是灵活的负载，即仅在需要时使用然后可以关闭的负载，可以使用按需实例或竞价实例。\n\n\n\n\
  当我们运行笔记本电脑或台式机等常规系统时，不使用时我们会将其关闭。AWS 也可以采用同样的做法。所有闲置超过两周的实例都可以停止或终止。一旦实例停止，公司就无需再为该\
  \ EC2 实例付费。但请记住，每个 EC2 实例都关联着一个 EBS 卷。该卷仍然存在，你仍需为其付费。如果你想终止该实例，附加的 EBS 卷也会被删除；因此，也就无需为\
  \ EBS 付费。但是，如果你想重新运行该实例，则需要重新配置以恢复 EBS 卷。最佳方法之一是存储 EBS 卷的快照，这样在终止甚至删除期间，EBS 卷可以以快照的形式作为备份保存下来。\n\
  \n#### 什么是 EBS 卷？\n\n在理解 Amazon 弹性块存储（EBS）之前，我们必须知道什么是块设备。简单来说，*块设备*是一种用于存储信息的设备。因此，所有像\
  \ HDD 或 SSD 这样的磁盘驱动器都是块设备。它们是平台无关的，这意味着你可以为它们安装任何操作系统，块设备都能正常工作。在块设备内部，存储着你所有的文件，并且可以通过任何实例和操作系统进行访问。\n\
  \n现在，当我们谈论 EBS 时，它允许在 Amazon EC2 实例中使用这种块存储。它为你提供了将多个 EBS 卷附加到单个 EC2 实例，或将一个 EBS\
  \ 卷附加到多个 EC2 实例的功能。\n\n我们可以决定为工作负载选择最合适的实例，也可以根据两个选项进行更改：在同一系列中更改实例，以及将实例更改为不同系列。我们可以根据以下指标将实例更改为同一系列中的另一个实例：\n\
  \n*   vCPU 数量\n\n*   查看内存\n\n*   查看网络吞吐量\n\n*   查看附加存储\n\n但是，当我们将实例更改为不同系列中的另一个实例时，我们会考虑以下指标：\n\
  \n*   选择正确的虚拟化类型\n\n*   选择是否需要 VPC 支持\n\n*   选择正确的平台\n\n*   选择是否升级硬件要求\n\n对于前三点，我们必须确保升级前后的配置相同。对于最后一点，将整个架构迁移到升级后的\
  \ EC2 实例需要付出努力。我们在前一章讨论了 EC2 实例的不同系列。\n\n#### 什么是虚拟化类型？\n\nAWS 中的 Linux 机器支持两种虚拟化类型：半虚拟化（PV）和硬件虚拟机（HVM）。这两种实例的区别在于操作系统如何启动，以及如何利用\
  \ CPU、存储等额外配置。\n\n#### 合理调整数据库实例规模\n\n最后但同样重要的是，我们可以合理调整数据库实例的规模。为此，必须牢记以下指标：\n\n\
  *   要么向上扩展，要么向下扩展数据库实例，或者存储大小保持不变。\n\n*   我们可以单独更改数据库实例的存储大小。\n\n*   AWS 非常重视许可证。因此，无论个人使用什么数据库，都必须拥有正确的许可证。\n\
  \n*   你可以选择调整数据库实例规模的时间。可以立即执行，也可以在特定时间窗口内执行，例如在维护期间。\n\n至此，我们关于 AWS 中合理调整规模的讨论就结束了。接下来，我们必须了解更多关于预留实例的内容。\n\
  \n### 使用预留实例\n\n预留实例关乎承诺。在购买 AWS 的预留兼容服务时，你必须决定是进行长期承诺，还是你的需求会定期变化。如果是长期承诺，那么你可以选择预留服务，这可以降低该服务的每小时成本。以下是\
  \ AWS 提供的提供预留功能的服务：\n\n*   Amazon EC2\n\n*   Amazon RDS\n\n*   Amazon ElastiCache\n\
  \n*   Amazon RedShift\n\n*   Amazon DynamoDB\n\n使用预留实例时必须绝对确定，因为锁定期要么是一年，要么是三年。这意味着你必须提前支付整整一年或三年的费用。付款完成后，无论你使用该实例多少，都不会像按需实例那样获得退款。因此，一旦你支付了锁定期的费用，你可以获得高达按需实例\
  \ 75% 的折扣，但之后你将无法根据使用模式获得动态定价。\n\n预留实例提供以下付款选项：\n\n*   无预付费用\n\n*   部分预付费用\n\n*\
  \   全部预付费用\n\n顾名思义，无预付费用意味着你一开始无需支付任何金额。部分预付费用意味着你可能一开始支付一部分金额，而全部预付费用则意味着你一开始支付全部金额。对于无预付的情况，客户按折扣后的每小时费率收费。但是，由于\
  \ AWS 不确定客户是否会付款，因此需要与他们签订合同协议，并且还会查看这些客户与 AWS 的过往关系。对于部分预付费用，也遵循同样的做法。剩余金额按折扣后的每小时费率收取。\n\
  \n预留实例分为两种类型。\n\n*   标准预留实例\n\n*   可转换预留实例\n\n使用标准预留实例，可以增加实例大小或修改可用区，也可以在预留实例市场中出售。另一方面，可转换预留实例可以与其他可能具有新属性（如实例系列、实例类型、平台等）的可转换实例进行交换。它们不能在市场中出售。\n\
  \n每月可购买的预留实例数量也有限制。对于特定区域，每月可以购买 20 个区域实例和 20 个可用区实例。区域实例是可用于整个区域的实例，而可用区实例是可用于特定可用区的实例。\n\
  \n### 使用竞价实例\n\n正如前一章所讨论的，竞价实例是那些处于闲置状态、目前未为 AWS 产生任何收益的实例。公司可以使用这些实例，并获得高达按需实例\
  \ 90% 的折扣。请记住，这些实例目前是闲置的，但这并不意味着它们会一直闲置。这意味着，每当它们的使用量再次上升时，EC2 会给你两分钟的通知，然后中断你的竞价实例会话。显然，每件好事都有缺点。你的竞价实例被终止的另一种方式是，当你产生的成本超过了设定的阈值。\n\
  \n我们必须了解在哪些场景下应该使用竞价实例。Amazon 建议在以下场景中使用竞价实例：\n\n*   构建容错且灵活的应用程序\n    *   Web 服务器\n\
  \n    *   API 后端\n\n    *   CI/CD 流水线（DevOps）\n\n    *   Hadoop 数据处理\n\n*   图像渲染\n\
  \n*   无状态 Web 服务\n\n*   大数据分析\n\n*   并行计算\n\n一旦你拥有按需实例，你可以请求竞价实例来处理应用程序的一些额外功能。为此，你可以通过在\
  \ EC2 中启动向导来请求竞价实例。你只需告知实例数量、实例类型、可用区以及你愿意为此支付的最高价格。\n\n\n\n### 使用 Cost Explorer\n\
  \n在决定了要使用的服务类型（预留实例、按需实例或竞价实例）后，您可以使用 AWS 提供的名为 Cost Explorer 的工具来分析您的使用情况和产生的成本。Cost\
  \ Explorer 提供三种类型的报告来帮助您：报告过去 12 个月的使用情况和产生的成本、根据您过去的使用情况预测未来三个月的支出，以及获取关于使用实例类型的建议。\n\
  \n如果您打开 Cost Explorer 控制面板，它会显示一个默认视图，如图 2-3 所示。\n\n![../images/495447_1_En_2_Chapter/495447_1_En_2_Fig3_HTML.jpg](img/495447_1_En_2_Fig3_HTML.jpg)\n\
  \n图 2-3\n\nAWS Cost Explorer 控制面板\n\n查看控制面板，我们可以说 Cost Explorer 由以下组件组成：\n\n*  \
  \ Cost Explorer 成本\n\n*   Cost Explorer 趋势\n\n*   每日非混合成本\n\n*   每月非混合成本\n\n*  \
  \ 净非混合成本\n\n*   最近的 Cost Explorer 报告\n\n*   摊销成本\n\n#### Cost Explorer 成本\n\n此组件向您展示两个指标：当前成本与上月成本的比较，以及当前预测与上月实际成本的比较。Cost\
  \ Explorer 以图表形式显示截至某个日期的当月当前成本，然后将其与上月同期的成本进行比较。它还会预测当月剩余天数的成本，然后将其与上月实际产生的成本进行比较。这有助于用户就各种因素做出决策，例如调整规模、减少用量等。\n\
  \n#### Cost Explorer 趋势\n\n此部分向您展示用户正在使用的不同服务的成本趋势。它在控制面板中显示主要趋势，但用户可以深入查看所有服务的趋势，并可以进一步深入查看特定服务，了解构成该趋势的不同成本。\n\
  \n#### 每日非混合成本\n\n首先，我们必须理解什么是非混合成本。它是指 AWS 在特定时间点向用户收取的费用。例如，如果 AWS 在上午 10:45 因我使用一个\
  \ EC2 实例而向我收取了 100 美元，那么这笔费用将计入我的每日非混合成本。通常，它被认为是最重要的成本数据，因为它能告诉您成本发生时的具体情况。显然，您可以使用不同的筛选条件来更改\
  \ Cost Explorer 非混合成本部分的视图。您还可以以 CSV 格式下载这些信息。有一点需要明确：非混合成本不显示用户在特定时间段内收到的退款金额。\n\
  \n#### 每月非混合成本\n\n顾名思义，您可以将粒度更改为月度级别，而不是查看每日非混合成本信息。这可以让您了解各个月份的整体情况，然后您可以继续查看特定月份的每日非混合成本，以便发现异常或进行进一步调查。\n\
  \n#### 净非混合成本\n\n净成本会考虑您产生的总成本，并根据同一时期给予您的折扣进行调整，然后向您呈现信息。如果用户愿意，他们可以实际包含或排除任何其他调整项，例如\
  \ AWS 提供的退款或信用额度。\n\n#### 最近的 Cost Explorer 报告\n\n此指标包含用户过去访问过的所有报告的列表，并附有时间戳和每个报告的链接。您只需点击链接即可再次查看报告。\n\
  \n#### 摊销成本\n\n通常，摊销成本是一种标准化的成本信息。例如，如果我们考虑一个月，不同服务的使用成本将按日收取，我们可以在非混合成本部分查看这些信息。但是，如果我们购买了预留实例，那么很可能每月的第一天就会收取整个月的费用。您会在图表中看到一个突然的峰值。因此，与其处理所有这些峰值，不如将信息标准化并分摊，这样就能为我们提供更好的整体视图。图\
  \ 2-4 完美地展示了非混合成本和摊销成本之间的区别。\n\n![../images/495447_1_En_2_Chapter/495447_1_En_2_Fig4_HTML.jpg](img/495447_1_En_2_Fig4_HTML.jpg)\n\
  \n图 2-4\n\n非混合成本与摊销成本的区别\n\n现在我们已经了解了 AWS Cost Explorer 的工作原理，接下来让我们探讨一下 AWS Trusted\
  \ Advisor 是如何工作的。\n\n## AWS Trusted Advisor\n\n众所周知，AWS 是云计算服务领域的市场领导者。由于它拥有大量客户，因此了解所有人的使用模式统计数据。基于此，AWS\
  \ 提出了一些最佳实践。它们分为以下几类：\n\n*   成本优化\n\n*   安全性\n\n*   容错能力\n\n*   性能\n\n*   服务限制\n\
  \n我们在本章中已经看到了一些影响成本优化的因素。我们将在下一章讨论其余的因素。但是，考虑到所有这些因素，用户可以以最低的成本获得最高的性能。AWS Trusted\
  \ Advisor 会考虑所有这些因素，并提供自己的建议，以帮助用户实现尽可能低的成本。Trusted Advisor 的工作原理在图 2-5 中得到了完美的展示。\n\
  \n![../images/495447_1_En_2_Chapter/495447_1_En_2_Fig5_HTML.jpg](img/495447_1_En_2_Fig5_HTML.jpg)\n\
  \n图 2-5\n\nAWS Trusted Advisor\n\n它的工作原理类似于您个人电脑中的防病毒保护软件，该软件会为您提供恶意软件和其他相关的见解。在这里，您获得的不是恶意软件见解，而是我之前指定的五个类别的见解。这些见解可能如图\
  \ 2-6 所示。\n\n![../images/495447_1_En_2_Chapter/495447_1_En_2_Fig6_HTML.jpg](img/495447_1_En_2_Fig6_HTML.jpg)\n\
  \n图 2-6\n\nAWS Trusted Advisor 见解\n\n绿色对勾表示我们做得正确的事情。黄色感叹号是需要处理的警告，否则可能导致问题。红色感叹号表示应立即查看建议，因为它们已经影响到成本、性能、安全性等。\n\
  \n以下是使用 AWS Trusted Advisor 的一些好处：\n\n*   一旦您登录到您的 AWS 账户，Trusted Advisor 就会为您提供实时通知。如果您启用它，它还可以通过电子邮件定期向您发送通知。\n\
  \n*   如果您愿意，可以对 Trusted Advisor 生成的报告进行更改。您可以包含或排除项目。\n\n*   当 Trusted Advisor 提出建议时，它会提供一个链接，将您带到\
  \ AWS 管理控制台，您可以在那里处理这些警告。\n\n\n\n## AWS 服务的定价\n\n我们已经了解了查找 AWS 服务使用成本以及优化成本的不同方法，接下来看看在哪里可以找到更多信息；请参见表\
  \ 2-1。\n\n表 2-1\n\n成本链接\n\n| AWS 服务 | AWS 定价页面 |\n| --- | --- |\n| 按需 EC2 实例 | [`https://aws.amazon.com/ec2/pricing/on-demand/`](https://aws.amazon.com/ec2/pricing/on-demand/)\
  \ |\n| 竞价型 EC2 实例 | [`https://aws.amazon.com/ec2/spot/pricing/`](https://aws.amazon.com/ec2/spot/pricing/)\
  \ |\n| 预留 EC2 实例 | [`https://aws.amazon.com/ec2/pricing/reserved-instances/pricing/`](https://aws.amazon.com/ec2/pricing/reserved-instances/pricing/)\
  \ |\n| Amazon S3 | [`https://aws.amazon.com/s3/pricing/`](https://aws.amazon.com/s3/pricing/)\
  \ |\n| Amazon VPC | [`https://aws.amazon.com/vpc/pricing/`](https://aws.amazon.com/vpc/pricing/)\
  \ |\n| Amazon SageMaker | [`https://aws.amazon.com/sagemaker/pricing/`](https://aws.amazon.com/sagemaker/pricing/)\
  \ |\n| Amazon RDS | [`https://aws.amazon.com/rds/pricing/`](https://aws.amazon.com/rds/pricing/)\
  \ |\n\n如需了解其他服务的信息，您可以登录 AWS 管理控制台，然后切换到您选择的服务并查看其定价部分。\n\n## 结论\n\n在本章中，您学习了 AWS\
  \ 如何对其服务收费，以及如何有效利用某些 AWS 服务来最大限度地降低成本。本章有助于您根据自己的预算和需求决定选择哪些服务。\n\n在下一章中，您将详细了解\
  \ AWS 的安全方面。您还将了解 AWS 如何处理容错，以及如何有效地构建一个能够基于组织层级提供 AWS 服务的架构。\n\n"
- '# 3. Amazon Web Services 中的安全性


  在本章中，我们将探讨 AWS 的安全方面。如您所知，AWS 拥有数百种服务，服务于成千上万的客户，因此其安全性上的任何微小疏漏都可能导致特定公司乃至 AWS 自身的巨大损失。这就是
  AWS 拥有一些具体的安全实践以及专门的安全服务来全面照管 AWS 功能的原因。


  本章专门介绍这些服务中一些最重要的部分。学完本章后，您将理解 AWS 的底层安全机制，并且能够在您使用的产品中实施不同的安全功能。


  ## AWS 的 SSR 模型


  在安全方面，AWS 遵循共享安全责任（SSR）模型。这个模型很简单：责任应由客户和 AWS 共同承担。具体来说，AWS 负责其提供给客户的整个基础设施的安全。另一方面，客户则负责其在该基础设施中存放的任何内容。图
  3-1 展示了 AWS 的 SSR 模型。


  ![../images/495447_1_En_3_Chapter/495447_1_En_3_Fig1_HTML.jpg](img/495447_1_En_3_Fig1_HTML.jpg)


  图 3-1


  AWS 的共享安全模型


  以下是 AWS 的部分责任：


  *   AWS 负责整个基础设施，包括 AWS 用于运行其服务的硬件、软件、网络和其他设施。


  *   AWS 通过组织第三方审计定期提供其运营报告。其合规性、安全标准和法规均经过验证。


  *   对于大多数服务，基本的安全任务也由 AWS 完成，例如安装客户操作系统、修补数据库、配置防火墙以及进行灾难恢复。


  以下是客户和用户的部分责任：


  *   在服务被预订且 AWS 处理了基本安全事务后，客户有责任执行所有必要的安全配置和管理任务。这可能包括更新操作系统、安装安全补丁、配置防火墙等。


  *   客户必须使用 Amazon Identity and Access Management (IAM) 服务设置用户账户。这将允许客户为其每个用户提供不同的凭证，从而访问不同的服务。


  *   客户必须为每个账户设置多因素认证。


  我们将在本章后面更深入地讨论 Amazon IAM 和多因素认证。


  AWS 为其客户提供高级别的安全性，这些安全性可以分为以下几类：


  *   合规性要求


  *   物理和环境安全


  *   业务连续性管理


  *   网络安全


  ### 合规性


  AWS 的基础设施基于多项 IT 安全标准，包括：


  *   SOC 1/SSAE 16/ISAE 3402（原 SAS 70）


  *   SOC 2


  *   SOC 3


  *   FISMA、DIACAP 和 FedRAMP


  *   DOD CSM 级别 1–5


  *   PCI DSS 级别 1


  *   ISO 9001/ISO 27001/ISO 27017/ISO 27018


  此外，AWS 还遵循一些行业特定标准。


  *   刑事司法信息服务（CJIS）


  *   云安全联盟（CSA）


  *   家庭教育权利和隐私法案（FERPA）


  *   健康保险流通与责任法案（HIPAA）


  *   美国电影协会（MPAA）


  ### 物理和环境安全


  为了基础设施的物理和环境安全，AWS 遵循以下标准：


  *   只有经过授权的人员才允许进入 AWS 数据中心场所，即使他们是 AWS 或亚马逊的员工也不例外。


  *   设施内安装了自动火灾探测传感器和灭火装置。


  *   AWS 数据中心不仅拥有稳定的电力供应，还配备了强大的 UPS，以便在发生电源故障时，运营永不中断。


  *   数据中心内安装了温度控制设备，并由人员持续监控，以保持最佳温度。


  *   AWS 按照严格规范淘汰任何硬件，以确保数据永不泄露。


  ### 业务连续性管理


  许多公司正在迁移到云平台，他们不希望自己的业务运营因 AWS 而中断。当公司将整个业务基础设施迁移到 AWS 时，他们所有的数据都驻留在那里。即使是几个小时的业务中断也可能给公司造成巨大损失。因此，AWS
  在制定其基础设施计划时必须严格，以防止这种情况发生。为了确保业务连续性管理，AWS 采取了许多措施。


  *   AWS 的所有数据中心全年 365 天、每周 7 天、每天 24 小时运行。因此，如果某个特定数据中心发生故障，AWS 要做的第一件事就是将数据流量从受影响的区域转移出去。


  *   使用 AWS，客户可以将其数据放入多个地理区域，并且在每个区域内，数据可以放入多个可用区。可用区的构建方式使其与同一区域内的所有其他可用区相互独立。因此，例如，如果某个可用区所在的区域在特定季节有可能受到洪水影响，那么同一区域内的所有其他可用区都将被放置在永远不会受到同一洪水影响的场所。


  *   每个数据中心都配备有 UPS 和现场备用发电设施。此外，为了进一步提高安全性，设施内还提供来自不同电网的电力，以便在一条线路发生故障时，另一条线路仍能有效供电。




  ### 网络安全


  正如我们在上一节中所见，AWS 已使其数据中心能够抵御灾难。但比这更大的威胁是网络入侵。随着技术的进步，黑客的技能也在提升。那么，AWS 是如何应对其网络安全问题的呢？好吧，让我们来探讨一下
  AWS 为确保其网络安全而采取的一些措施。


  *   有一个防火墙可以保护你的入站和出站流量。这是网络安全最基本但也是最强大的第一步。


  *   AWS 拥有访问控制列表（ACL），其中包含一组策略，用于决定谁可以访问 AWS 的哪些服务，以及哪些信息流向哪个服务。这些 ACL 会定期更新，并通过名为
  ACLManage 的 AWS 工具自动推送。


  *   信息流入 AWS 服务器可能有很多入口点，出口点也是如此。因此，在这种情况下，管理这些入口和出口点会变得非常困难。为了解决这个问题，AWS 采用了安全接入点。通过使用它们，AWS
  只有有限数量的接入点，通过这些接入点对所有进出传输进行全面监控。这些接入点被称为 *API 端点*，并且只允许 HTTPS 访问以建立安全连接。


  *   AWS 通过 Amazon VPC 为其客户提供额外的安全选项。我们在第 1 章中讨论过 VPC。


  *   对于 AWS 来说，有两种类型的客户端。一种是其常规客户，另一种是其自身的企业网络。AWS 在访问 AWS 服务时不会给予其企业网络任何特殊权限。对于
  AWS 员工，如果他们想访问任何 AWS 服务，首先必须提交一个工单，如果获得批准，他们才能获得访问权限。此外，出于安全目的，员工所做的所有操作都会被安全地记录下来。


  *   AWS 拥有许多自动化监控工具，以便监控服务器和网络使用情况，扫描端口的入站和出站传输，检测未经授权的入侵尝试等。


  ## AWS 账户安全功能


  在前面的章节中，我们了解了 AWS 如何确保其基础设施的安全。在本节中，我们将探讨 AWS 如何确保其客户的 AWS 账户安全。AWS 做的第一件事就是使用凭证保护每个账户。AWS
  使用凭证进行身份验证的方式有多种。


  *   密码


  *   加密密钥


  *   数字签名


  *   证书


  *   多因素身份验证


  一旦你为账户创建了凭证，就可以轻松地从安全凭证页面下载凭证报告。报告中包含的信息告诉我们：账户是否使用了密码、密码是否可轮换、密码上次更改时间、密钥上次轮换时间以及是否启用了多因素身份验证。


  在 AWS 中，我们可以创建多个访问密钥并定义多个证书。这样做是为了出于安全原因持续轮换它们。当它们被轮换时，为了不影响业务连续性，我们可以使用并发的密钥和证书。我们可以使用
  AWS IAM 来轮换密钥。我们将在下一节中更详细地了解密钥和证书。


  ### 用于身份验证的密码


  如果你想访问 AWS 服务，密码非常重要。它们授予你在 AWS 内部的第一级访问权限。密码在创建账户时创建，并可以随时通过安全凭证页面更改。AWS 允许密码长度最多为
  128 个字符，并且必须包含特殊字符组合才能足够强大。


  如果你的组织基础设施完全托管在 AWS 上，你可以创建密码策略，以便新密码必须遵循你的安全策略。这确保了创建最强大的密码。


  ### 多因素身份验证


  这是客户可以选择的一种额外安全级别。多因素身份验证要求客户成功输入用户名和密码后，用户还必须提供一个特定的、唯一的六位数代码进行身份验证。如果验证成功，则该人员将被允许进入账户。这个六位数代码会发送到客户的一个经过身份验证的设备上。它可以是智能手机、电子邮件或电话号码。当人员登录时，会收到一个需要输入的代码，然后才能成功登录。


  ### 用于 API 身份验证的访问密钥


  API 是一种功能，通过它向封装在 API 后的一段代码发送请求，然后人员接收输出。现在，API 内部的编码逻辑可能允许用户访问敏感信息。因此，发送给这些 API
  的请求也必须经过身份验证，这意味着只有正确的用户才能获得 API 的访问权限。这是通过*数字签名*完成的。这个数字签名是通过将请求文本和秘密访问密钥传递给负责加密的哈希函数生成的。这个哈希函数对消息进行加密，然后将其发送给
  API。这反过来在 API 端被解密；检查秘密密钥，然后提供入口。


  目前，数字签名使用名为 HMAC-SHA256 的协议，该协议已发展到第四版。数字签名验证中还有一个安全级别，即在请求中添加时间戳。如果生成的数字签名的时间戳与
  API 接收到的时间戳相差超过 15 分钟，则该请求将被拒绝。


  ### X.509 证书


  当我们希望两个或多个 Web 服务相互通信时，我们使用基于 SOAP 的请求。为了使这类请求安全，我们使用 X.509 证书。这些证书由三部分组成。


  *   公钥


  *   私钥


  *   附加元数据


  第一步是使用我们在上一节中看到的过程生成数字签名。现在，我们使用这个数字签名和证书来发送请求。首先，AWS 尝试通过解密数字签名并验证它来确认是经过身份验证的用户在发送请求。之后，AWS
  会将发送过来的证书与经过身份验证的用户在其自己的 AWS 账户中上传的证书进行匹配。如果一切正常，请求将被转发；否则，请求将被拒绝。




  ## AWS 身份与访问管理


  正如我们通过 Amazon 管理控制台访问所有 AWS 服务一样，对于所有安全需求，我们也有 AWS 身份与访问管理。所有身份验证或授权都可以通过 IAM 进行管理。我们可以创建用户、定义角色、授予权限、分配策略以及执行许多其他操作，所有这些都可以在
  IAM 中完成。因此，无论是从事机器学习还是 Web 开发，只要是使用 AWS 的人，都必须了解这项服务。


  想要使用 AWS 服务的人，首先要做的就是创建一个根用户账户。该账户可通过用户名和密码访问，并赋予用户对其已注册的所有服务的无限访问权限。但是，AWS 不鼓励我们始终使用根用户账户登录，因为这可能会危及组织的安全。因此，我们可以使用
  IAM 服务创建不同的用户，而不是使用根用户。这些用户被称为 *IAM 用户*。管理员可以向所有这些用户授予权限，要求他们设置自己的密码，分配不同的策略，从而使整个基础设施既简单又安全。


  为了更好地理解这一点，让我们看一个例子。假设有一个拥有 5000 名员工的组织。其中有董事会、CEO、CTO、总裁、经理、架构师、工程师和其他员工。首先，我们不能给每个人根访问权限，这无需解释。因此，组织可以创建
  IAM 用户。但是，授予高层管理人员的权限与授予层级较低员工的权限是不同的。即使在高层管理中，董事会成员可能只对某些具有仪表盘或可视化支持（例如 Splunk
  仪表盘）的特定服务拥有只读访问权限，而 CTO 则拥有某种根访问权限。同样，工程师将有权访问他们被雇用来使用的服务。机器学习工程师可能有权访问 SageMaker，数据工程师可能有权访问
  EMR 或 DynamoDB，等等。因此，通过这个例子我们可以得出结论：不同的用户需要不同的权限，而所有这些都可以通过 AWS IAM 来实现。


  一旦定义了 IAM 用户，它就会有自己的密码。用户登录后，将只能看到他们有权使用的服务。其他服务会要求提供凭证或拒绝访问。请注意，IAM 用户可能不是真实的人。它可能是一个软件服务。例如，假设一家公司在一个不同的平台上托管了一个网站，但使用了某些
  AWS 服务，如 S3 或 DynamoDB。因此，该网站需要持续与这些服务通信。为了验证正确的软件与 AWS 服务通信，会为这些服务创建一个 IAM 用户，然后该网站使用自己的凭证访问相应的服务。


  但是，组织通常已经拥有自己的基础设施，并且管理层中每个员工都有一个电子邮件 ID 和密码。当员工需要使用 AWS 时，他们将获得一个新的 ID 和密码。这意味着该人员必须记住并保护两个账户：公司账户和
  AWS 账户。如果 AWS 能提供一种方式，让员工只需登录公司账户就能自动登录 AWS 账户，那岂不是太棒了？AWS 确实有解决方案，称为*联合用户*。


  ### AWS 中的用户联合


  如果员工在公司网络中有账户，并且公司在 AWS 网络中也有账户，那么一旦员工登录公司网络，组织就可以将该用户身份联合到 AWS 网络。这样，就减轻了公司员工在
  AWS 内部登录的麻烦。参见图 3-2。


  ![../images/495447_1_En_3_Chapter/495447_1_En_3_Fig2_HTML.jpg](img/495447_1_En_3_Fig2_HTML.jpg)


  图 3-2


  用户联合


  以下是联合的一些特性：


  *   公司网络使用*单点登录* (SSO) 使得联合成为可能。此后，自动登录发生，员工无需再次登录即可进入 Amazon 管理控制台。


  *   即使某人在 Gmail、Facebook、Amazon 等平台拥有账户，这些账户也可用于 SSO。




  ### AWS 中的访问管理是如何实现的


  通常来说，*访问管理*也可以被称为*授权*。登录到 AWS 账户的个人或服务被称为*主体实体*。主体实体通过 IAM 进行身份验证（IAM 用于验证 IAM 角色或用户）。身份验证完成后，系统会检查附加到特定用户或角色的策略。这些策略有助于确定授予主体实体的权限。它们被创建并附加到不同的
  IAM 身份，例如用户、角色或组。现在，如果主体实体发送了某个服务的请求，但策略中未定义使用该服务的权限，那么访问将被拒绝。这就是 AWS 中访问管理的实现方式。


  策略可以基于 IAM 角色、资源或访问控制列表来应用。角色示例是数据工程师。所有具有数据工程师角色的 IAM 用户都将被分配相同的策略。这意味着该角色中的每个人都能以相同的权限级别访问相同的资源。应用于资源的策略会对特定资源的使用施加限制。例如，我们可以创建一个策略，允许用户读取
  DynamoDB 表，但不允许创建表。当我们想要应用跨平台策略时，会使用 ACL。


  这里给出了一个基于角色的策略示例。我们定义了一个 JSON 文件，展示了针对 DynamoDB 定义的策略。


  ```

  {

  "Version": "2012-10-17",

  "Statement": {

  "Effect": "Allow",

  "Action": "dynamodb:*",

  "Resource": "arn:aws:dynamodb:us-east-2:123456789012:table/Books"

  }

  }

  ```


  这授予了用户使用 DynamoDB 中 `Books` 表的权限。这清楚地表明，要分配策略，必须创建 JSON 文件，并且这些文件必须附加到相应的实体。策略不仅可以附加到特定实体，还可以附加到一组实体。这些被称为*IAM
  组*；见图 3-3。


  ![../images/495447_1_En_3_Chapter/495447_1_En_3_Fig3_HTML.jpg](img/495447_1_En_3_Fig3_HTML.jpg)


  图 3-3


  IAM 组


  图 3-3 定义了多个 IAM 用户，并将他们分组到三个 IAM 组中：管理员、开发人员和测试人员。现在，策略可以应用于整个组，并自动应用于其成员。但这里需要注意的一点是，如果某个特定成员未被授予某个服务的权限，那么即使该组有权访问该服务，该成员仍然没有权限访问该服务。


  在哪里可以找到所有已定义策略的摘要？IAM 控制台中有三个表格提供了关于策略的详细信息。这些表格如下：


  *   策略摘要


  *   服务摘要


  *   操作摘要


  当我们打开策略摘要时，会看到已定义策略的服务列表。我们可以点击任意服务，进入该特定服务的摘要表。摘要表列出了可以在该特定服务上执行的所有操作以及附加到这些操作的权限。您可以点击任意操作，然后进入操作摘要，该摘要显示了已授予该特定操作的权限。图
  3-4 为您总结了这些表格。


  ![../images/495447_1_En_3_Chapter/495447_1_En_3_Fig4_HTML.jpg](img/495447_1_En_3_Fig4_HTML.jpg)


  图 3-4


  策略、服务和操作摘要


  策略可以分为两种：基于身份的策略和基于资源的策略。顾名思义，当策略附加到 IAM 角色、用户或组时，它们被称为*基于身份的策略*；而当我们将它们附加到资源（如
  S3 存储桶或 DynamoDB）时，它们被称为*基于资源的策略*。


  ### 基于属性的访问控制


  在讨论基于属性的访问控制（ABAC）之前，我们必须了解*AWS 标签*。这些是附加到 IAM 用户、角色、组甚至 AWS 资源的一些属性。当我们有一个大型组织并且需要为员工制定策略时，这些标签非常有用。标签如何发挥作用？让我们看一个例子。


  一家生产机器学习产品的公司已将其整个架构迁移到 AWS。现在，它正在使用 Amazon SageMaker 构建模型，使用 Amazon EMR 进行数据工程，构建网站、API，并使用
  DynamoDB 和 CloudFormation 进行数据库管理，同时使用各种其他 AWS 服务（如 CloudWatch、TrustedAdvisor 等）来保障安全。现在，假设该公司约有
  5,000 名员工。为每个员工提供 IAM 角色并附加策略将是一项繁琐的任务。那么，我们该怎么办？这时，标签和 ABAC 就派上用场了。


  想象两位机器学习工程师；一位只使用 SageMaker 和 S3 存储桶，而另一位除了使用前一位工程师使用的服务外，还使用 EMR。组织可以为不同的用途创建两个标签。假设一个标签叫做
  *basic-machine-learning*，另一个叫做 *advanced-machine-learning*。在定义 IAM 角色时，所有机器学习工程师和初级数据科学家都可以被赋予第一个标签。高级数据科学家和解决方案架构师可以被赋予第二个标签。现在，当一位初级数据科学家尝试访问
  EMR 时，系统会检查标签，并查看其相应的策略。由于策略不足以提供此访问权限，访问将立即被拒绝。但是，如果一位解决方案架构师尝试访问初级数据科学家访问过的同一个标签，他将被授予访问权限，因为与该标签关联的策略为该人员提供了适当的权限。这些标签也被称为*属性*，因此这个过程被称为*基于属性的访问控制*（ABAC）。


  我们如何说 ABAC 流程优于传统流程？让我们看看它们之间的一些区别。传统流程也称为*基于角色的访问控制*（RBAC）。


  *   第一个区别是，在 RBAC 中，每次添加新资源时，都必须更新附加到角色或用户的策略——不仅针对一个角色，而是针对所有角色。而在 ABAC 中，只需要更新标签。


  *   由于这些标签的存在，ABAC 的策略比 RBAC 少得多，因此更易于管理。


  在本书的第二部分，我们将介绍使用 IAM 创建根凭证，然后定义角色、用户、组等的完整过程。在本节中，我们涵盖了其理论方面。实际上，我们将在下一节中查看其应用。


  AWS 还提供了一些其他服务来增强应用程序的安全性。


  *   AWS WAF


  *   AWS Shield


  *   AWS Firewall Manager


  让我们逐一讨论每个服务。




  ## AWS Web 应用防火墙


  发送至特定 AWS 服务（如 Amazon API Gateway、Amazon CloudFront 或 Application Load Balancer）的所有
  HTTP 或 HTTPS 请求，均由 AWS Web 应用防火墙（WAF）进行监控。WAF 允许你根据特定条件和规则来控制对内容的访问。以下列出其中一些规则：


  *   允许所有 HTTP/HTTPS 请求，但明确指定的请求除外。

  *   阻止所有 HTTP/HTTPS 请求，但明确指定的请求除外。

  *   对请求进行计数，并将请求中定义的属性与 WAF 中提及的属性进行匹配。如果匹配的属性数量一致，则允许请求；否则，阻止请求。


  用于允许或阻止请求的匹配条件遵循某些特征。以下是其中一些特征：


  *   监控 IP 地址以查看请求的来源。

  *   查看请求来源的国家/地区。

  *   分析请求标头中的值。

  *   可以创建正则表达式，用于在字符串中搜索特定模式，然后做出接受或拒绝的决定。

  *   检查是否存在可能具有恶意的 SQL 代码。

  *   检查是否存在可能具有恶意的脚本。


  WAF 还可用于保护托管在 ECR 内的应用程序。ECR 允许你高效地管理集群内的 Docker 容器。要在 WAF 中定义规则和条件，可以使用以下功能：


  *   Web ACL

  *   规则

  *   规则组


  首先，可以创建一个 ACL 来监控对特定 AWS 资源的访问。然后，可以将规则分配给这些 ACL，这些规则将充当防火墙并监控请求。每条规则都是一种带有条件的语句，该条件被称为*检查标准*。如果满足条件，则允许或阻止请求。我们还可以使用规则组，这些规则组是包含条件的语句组，可以附加到你的
  ACL，从而间接附加到 AWS 资源。


  ## AWS Shield


  在了解 AWS Shield 服务之前，我们必须先了解一种名为*分布式拒绝服务*（DDoS）的网络攻击，因为 AWS Shield 有助于缓解这种攻击。


  每个 Web 服务或服务器都有一定的带宽，以便在高峰时段处理更多流量的同时，尽可能多地服务其当前用户群。为了发起 DDoS 攻击，网络犯罪分子会向服务或服务器发送大量流量，导致用户难以操作，甚至整个服务或服务器崩溃。如果流量来自单个系统，攻击效果不会那么显著。这就是为什么流量会从多个系统并行产生，并对目标发起攻击。图
  3-5 展示了 DDoS 攻击的直观表示。


  ![../images/495447_1_En_3_Chapter/495447_1_En_3_Fig5_HTML.jpg](img/495447_1_En_3_Fig5_HTML.jpg)


  图 3-5


  DDoS 攻击


  AWS WAF 可用于阻止此类攻击，但为了获得高级安全性，我们还可以使用 AWS Shield Standard 和 AWS Shield Advanced。默认情况下，我们在
  AWS 中使用的所有服务都附带 AWS Standard Shield，无需额外费用。要使用 AWS Advanced Shield，用户需要支付少量额外费用。


  网络中容易受到网络攻击的两个特定层是：网络层和传输层。AWS Standard Shield 会监控这两层并提供保护。如果将 AWS Standard Shield
  与 Amazon CloudFront 或 Route53 一起使用，它还会提供一些额外的好处。


  为了获得额外的保护，例如，如果你想保护运行在 EC2 或 Elastic Load Balancer 中的应用程序，用户可以选择 AWS Advanced Shield。Advanced
  Shield 不仅为网络层和传输层提供安全保护，还为应用层提供保护。图 3-6 使用开放系统互连（OSI）网络模型展示了网络内的不同层。


  ![../images/495447_1_En_3_Chapter/495447_1_En_3_Fig6_HTML.jpg](img/495447_1_En_3_Fig6_HTML.jpg)


  图 3-6


  OSI 七层模型


  ## AWS Firewall Manager


  为了确保 AWS WAF 和 AWS Shield 平稳高效地运行，可以使用 AWS Firewall Manager。AWS Firewall Manager
  负责自动应用在资源和服务上定义的所有规则。即使在 AWS 中添加了新资源，这一点也依然适用。由于这种自动化能力，AWS Firewall Manager 提供了许多优势。


  *   如果一组资源遵循特定的标签，AWS Firewall Manager 可以自动应用一些自定义规则。

  *   AWS Firewall Manager 允许你创建和管理自己的规则，或从市场购买的规则。

  *   如果你的组织中有许多用户，使用 AWS Firewall Manager 通常是有益的。


  ## 结论


  在本章中，你了解了 AWS 的各个安全方面。这完成了本书的第一部分，我们涵盖了与 AWS 相关的所有基础知识。现在，我们将进入本书的第二部分，我们将探讨如何使用
  AWS 创建机器学习模型。在下一章中，我们将更实际地应用本章中的概念，不仅成为创建机器学习模型的专家，还能熟练使用各种其他服务，例如 S3 存储桶、DynamoDB、AWS
  安全工具等。你还将学习如何使模型高效以及如何实现自动化。


