- "# 8. 在 SageMaker 中运行自定义算法\n\n在本章中，你将了解如何运行自己的算法，而不是使用 SageMaker 的内置算法。尽管 SageMaker\
  \ 为几乎任何类型的问题陈述都提供了内置算法，但很多时候我们希望利用 SageMaker 的强大功能来运行我们自己的自定义模型。如果我们具备 Docker 的实用知识和\
  \ Python 的动手经验，就可以有效地做到这一点。在本章中，我们将为 Big Mart 数据集创建一个自定义的随机森林模型。我们将把容器部署到 ECR 中，然后使用\
  \ SageMaker 训练模型。接着，我们将使用该模型进行实时推理，并了解如何进行批量转换。\n\n## 问题陈述\n\n问题陈述是：我们将尝试使用随机森林算法（一种监督学习集成树算法）来预测一家电子商务公司的销售额。由于这是一个回归问题，我们将使用\
  \ Scikit-Learn 包中的 `RandomForestRegressor` 类。我们已经在之前的章节中探索过该数据集；它就是 Big Mart 数据集。图\
  \ 8-1 显示了数据集的前几行。\n\n![../images/495447_1_En_8_Chapter/495447_1_En_8_Fig1_HTML.jpg](img/495447_1_En_8_Fig1_HTML.jpg)\n\
  \n图 8-1\n\n数据集的开头\n\n如果你想了解该数据集，请回顾第 5 章。我们在那一章中已经处理了数据，并创建了训练集和验证集，因此这里不再重复该过程。我们将在完成训练集和测试集划分后继续开发算法。请通读第\
  \ 5 章以复习整个过程。\n\n\n\n## 运行模型\n\n在将模型应用到 SageMaker 环境之前，我们先在本地用准备好的数据集运行算法，并检查产生的总损失。\n\
  \n```\nfrom sklearn.ensemble import RandomForestRegressor\nrfc = RandomForestRegressor(n_estimators=500)\n\
  ```\n\n在上面的代码中，我们初始化了 `RandomForestRegressor` 算法，并要求合并 500 棵独立决策树的输出。初始化算法后，我们就可以开始训练模型了。\n\
  \n```\nrfc.fit(X_train, y_train)\n```\n\n上面的代码将开始训练模型。现在我们可以使用训练好的模型对测试集进行预测。\n\n\
  ```\npredictions = rfc.predict(X_test)\n```\n\n所有预测结果都存储在变量 predictions 中。让我们计算所创建模型的均方根误差。\n\
  \n```\nfrom sklearn.metrics import mean_squared_error\nnp.sqrt(mean_squared_error(predictions,\
  \ y_test))\n```\n\n这将给出最终误差的值。在我的例子中，大约是 1054。由于采样原因，不同系统可能输出不同结果。\n\n## 转换代码以使用\
  \ SageMaker 资源\n\n现在我们已经成功在本地环境中运行了代码，接下来将对其进行转换，以便能够在 SageMaker 环境中运行。以下是在 SageMaker\
  \ 中运行自定义模型的步骤：\n\n1.  将数据存储在 S3 中。\n\n2.  创建一个训练脚本并将其命名为 `train`。\n\n3.  创建一个有助于预测的推理脚本。我们将其命名为\
  \ `predictor.py`。\n\n4.  设置文件以帮助生成端点。\n\n5.  创建一个 Dockerfile，用于构建一个镜像，整个代码将在其中运行。\n\
  \n6.  编写一个脚本，将 Docker 镜像推送到 Amazon Elastic Container Registry (ECR)。\n\n7.  使用 SageMaker\
  \ 和 Boto3 API 来训练和测试模型。\n\n我们的训练数据已经在 S3 中，因此我们将从创建训练脚本开始。\n\n### 创建训练脚本\n\n我们已经创建了一个训练笔记本。这个训练脚本将与笔记本类似，但我们需要额外考虑一些事项。首先需要记住的是，脚本将在容器内运行。因此，由于脚本在容器内部，而数据来自容器外部的\
  \ S3 存储桶，可能会存在同步问题。此外，算法的结果也应保存在 S3 存储桶中。在创建训练脚本时，我们需要牢记所有这些。\n\n我们首先应该知道，在容器内部，无论传入什么数据，它都会被存储在\
  \ `/opt/ml` 文件夹中。因此，来自 S3 的数据将被下载到该文件夹。所以，我们需要在这个文件夹中创建三个子文件夹：一个用于存储输入，一个用于存储输出，一个用于存储模型。这可以通过使用以下脚本来定义：\n\
  \n```\nprefix = '/opt/ml/'\ninput_path = prefix + 'input/data'\noutput_path = os.path.join(prefix,\
  \ 'output')\nmodel_path = os.path.join(prefix, 'model')\n```\n\n在数据文件夹中，我们可以有多个文件，例如\
  \ `training`、`validation` 或 `testing`。我们也可以有多个文件共同组成一个训练文件。因此，我们也可以进行这种分类。对我们来说，只有一个文件：训练文件。所以，我们将只使用一个通道。\n\
  \n```\nchannel_name='training'\ntraining_path = os.path.join(input_path, channel_name)\n\
  ```\n\n这使我们的训练脚本能够处理数据。接下来是训练脚本本身。数据将来自 S3。首先我们必须读取它，然后应用我们在第 5 章中看到的所有步骤。要读取文件，我们可以使用以下脚本：\n\
  \n```\ninput_files = [ os.path.join(training_path, file) for file in os.listdir(training_path)\
  \ ]\nraw_data = [ pd.read_csv(file) for file in input_files ]\ndata = pd.concat(raw_data)\n\
  ```\n\n如果你有多个 CSV 表需要读取，这个脚本也很有帮助。但是，在这种情况下，请记住设置参数 `header=None`。现在我们已经读取了数据，可以开始训练过程了。以下是完整的训练脚本：\n\
  \n```\ndef train():\nprint('Starting the training.')\ntry:\n# Take the set of files\
  \ and read them all into a single pandas dataframe\ninput_files = [ os.path.join(training_path,\
  \ file) for file in os.listdir(training_path) ]\nif len(input_files) == 0:\nraise\
  \ ValueError(('There are no files in {}.\\n' +\n'This usually indicates that the\
  \ channel ({}) was incorrectly specified,\\n' +\n'the data specification in S3 was\
  \ incorrectly specified or the role specified\\n' +\n'does not have permission to\
  \ access the data.').format(training_path, channel_name))\nraw_data = [ pd.read_csv(file)\
  \ for file in input_files ]\ndata = pd.concat(raw_data)\ndata = data.sample(frac=1)\n\
  for i in data.Item_Type.value_counts().index:\ndata.loc[(data['Item_Weight'].isna())\
  \ & (data['Item_Type'] == i), ['Item_Weight']] = \\\ndata.loc[data['Item_Type']\
  \ == 'Fruits and Vegetables', ['Item_Weight']].mean()[0]\ncat_data = data.select_dtypes(object)\n\
  num_data = data.select_dtypes(np.number)\ncat_data.loc[(cat_data['Outlet_Size'].isna())\
  \ & (cat_data['Outlet_Type'] == 'Grocery Store'), ['Outlet_Size']] = 'Small'\ncat_data.loc[(cat_data['Outlet_Size'].isna())\
  \ & (cat_data['Outlet_Type'] == 'Supermarket Type1'), ['Outlet_Size']] = 'Small'\n\
  cat_data.loc[(cat_data['Outlet_Size'].isna()) & (cat_data['Outlet_Type'] == 'Supermarket\
  \ Type2'), ['Outlet_Size']] = 'Medium'\ncat_data.loc[(cat_data['Outlet_Size'].isna())\
  \ & (cat_data['Outlet_Type'] == 'Supermarket Type3'), ['Outlet_Size']] = 'Medium'\n\
  cat_data.loc[cat_data['Item_Fat_Content'] == 'LF' , ['Item_Fat_Content']] = 'Low\
  \ Fat'\ncat_data.loc[cat_data['Item_Fat_Content'] == 'reg' , ['Item_Fat_Content']]\
  \ = 'Regular'\ncat_data.loc[cat_data['Item_Fat_Content'] == 'low fat' , ['Item_Fat_Content']]\
  \ = 'Low Fat'\nle = LabelEncoder()\ncat_data = cat_data.apply(le.fit_transform)\n\
  ss = StandardScaler()\nnum_data = pd.DataFrame(ss.fit_transform(num_data.drop(['Item_Outlet_Sales'],\
  \ axis=1)), columns = num_data.drop(['Item_Outlet_Sales'],axis=1).columns)\ncat_data\
  \ = pd.DataFrame(ss.fit_transform(cat_data.drop(['Item_Identifier'], axis=1)), columns\
  \ = cat_data.drop(['Item_Identifier'], axis=1).columns)\nfinal_data = pd.concat([num_data,cat_data],axis=1)\n\
  X = final_data\ny = data['Item_Outlet_Sales']\nfrom sklearn.model_selection import\
  \ train_test_split\nX_train, X_test, y_train, y_test = train_test_split(X, y, test_size\
  \ = 0.1, random_state=5)\nfrom sklearn.ensemble import RandomForestRegressor\nrfc\
  \ = RandomForestRegressor(n_estimators=500)\nclf = rfc.fit(X_train, y_train)\n#\
  \ save the model\nwith open(os.path.join(model_path, 'randomForest-tree-model.pkl'),\
  \ 'w') as out:\npickle.dump(clf, out)\nprint('Training complete.')\nexcept Exception\
  \ as e:\ntrc = traceback.format_exc()\nwith open(os.path.join(output_path, 'failure'),\
  \ 'w') as s:\ns.write('Exception during training: ' + str(e) + '\\n' + trc)\nprint('Exception\
  \ during training: ' + str(e) + '\\n' + trc, file=sys.stderr)\nsys.exit(255)\n```\n\
  \n我们将整个脚本放在一个名为 `train()` 的函数中。读取 CSV 表后，我们将遵循与第 5 章中相同的过程。之后，我们将随机森林模型拟合到数据上，就像我们在上一节中运行的那样。\n\
  \n完成所有这些之后，我们必须保存这个模型，因为稍后我们将需要使用该模型进行预测。为了保存模型，我们首先使用 pickle 对其进行序列化，然后将其保存在模型位置。稍后，这个模型将被保存到\
  \ S3 中。\n\n最后，我们可以运行整个脚本。\n\n```\nif __name__ == '__main__':\ntrain()\nsys.exit(0)\n\
  ```\n\n我们必须使用 `sys.exit(0)`，因为它会向 SageMaker 发送训练已成功完成的消息。将文件保存为 `train`，不带任何扩展名。\n\
  \n\n\n### 创建推理脚本\n\n训练脚本用于训练模型。但是，一旦模型训练完成，我们就需要进行预测，无论是像我们在第 6 章中看到的实时推理，还是本章将要介绍的批量转换。我们将推理脚本保存在名为\
  \ `predictor.py` 的文件中。\n\n预测器文件包含以下组件：\n\n*   `ScoringService()` 类\n\n*   `ping()`\
  \ 方法\n\n*   `transformation()` 方法\n\n*   任何其他所需的辅助函数\n\n`ScoringService()` 类包含两个函数。第一个函数\
  \ `get_model()` 负责加载并反序列化模型，而第二个方法 `predict()` 则负责进行预测。请记住，推理脚本也使用与训练脚本相同的基础文件夹\
  \ `/opt/ml`。以下是 `ScoringService()` 类的脚本：\n\n```\nprefix = '/opt/ml/'\nmodel_path\
  \ = os.path.join(prefix, 'model')\nclass ScoringService(object):\nmodel = None\n\
  @classmethod\ndef get_model(cls):\nif cls.model == None:\nwith open(os.path.join(model_path,\
  \ 'randomForest-tree-model.pkl'), 'r') as inp:\ncls.model = pickle.load(inp)\nreturn\
  \ cls.model\n@classmethod\ndef predict(cls, input):\nclf = cls.get_model()\nreturn\
  \ clf.predict(input)\n```\n\n`ping()` 方法仅用于检查运行代码的 Docker 容器是否健康。如果不健康，则返回 404 错误，否则返回\
  \ 202。\n\n```\n@app.route('/ping', methods=['GET'])\ndef ping():\nstatus = 200 if\
  \ health else 404\nreturn flask.Response(response='\\n', status=status, mimetype='application/json')\n\
  ```\n\n`transformation()` 是负责读取测试文件并调用所需方法和类的方法。这里需要理解的一点是，整个端点生成过程本质上就是创建一个 API。一旦创建了\
  \ API，数据就会作为 POST 请求发送，然后我们就会收到预测结果作为响应。整个架构是使用 Flask 框架构建的。\n\n数据是使用 POST 方法发送的，因此要读取它，我们需要使用\
  \ `StringIO()` 方法来解码数据。一旦数据被解码，我们就可以使用常规的 Pandas 方法来读取它。`transformation()` 函数将数据发送给\
  \ `ScoringService()` 类的 `predict()` 函数。该方法将输出发送回 `transformation()` 函数。这个预测输出借助\
  \ `StringIO()` 函数被发送回调用 API 的主机。这样就完成了端点的整个循环。以下是 `transformation()` 的代码：\n\n```\n\
  @app.route('/invocations', methods=['POST'])\ndef transformation():\ndata = None\n\
  if flask.request.content_type == 'text/csv':\ndata = flask.request.data.decode('utf-8')\n\
  s = StringIO.StringIO(data)\ndata = pd.read_csv(s, header=None)\nelse:\nreturn flask.Response(response='This\
  \ predictor only supports CSV data', status=415, mimetype='text/plain')\nprint('Invoked\
  \ with {} records'.format(data.shape[0]))\n# Do the prediction\npredictions = ScoringService.predict(data)\n\
  # Convert from numpy back to CSV\nout = StringIO.StringIO()\npd.DataFrame({'results':predictions}).to_csv(out,\
  \ header=False, index=False)\nresult = out.getvalue()\nreturn flask.Response(response=result,\
  \ status=200, mimetype='text/csv')\n```\n\n我们将使用这个 Python 文件进行预测，但为了高效运行服务器，我们需要一些配置文件。让我们在下一节中探讨它们。\n\
  \n### 配置端点生成文件\n\n要成功运行推理服务器，我们需要配置以下文件：\n\n*   `nginx.conf` 文件\n\n*   `serve` 文件\n\
  \n*   `wsgi.py` 文件\n\n通常我们不会更改这些文件。我们创建它们，然后直接用于我们的预测。我们不会逐行详细讲解这些文件，但让我们了解每个文件的目的。\n\
  \nNginx 文件用于启动服务器，并使得部署在 EC2 实例上的 Docker 容器与 SageMaker 网络外部或内部的客户端之间建立连接成为可能。Nginx\
  \ 使用一个名为 Gunicorn 的 Python 框架来帮助设置 HTTP 服务器。\n\nServe 利用正在运行的 Gunicorn 服务器来使不同资源之间的连接变得可行。具体来说，它用于以下目的：\n\
  \n*   高效利用 CPU 数量来运行模型\n\n*   定义服务器超时时间\n\n*   生成日志\n\n*   使用 Nginx 和 Gunicorn 启动服务器\n\
  \n*   如果事情没有按预期进行，则停止服务器\n\n最后，`wsgi.py` 文件用于告诉服务器关于我们的 `predictor.py` 文件的信息。我们可以在本书的\
  \ GitHub 仓库中探索每个文件中的代码。请记住，这些文件非常重要，因为没有它们，服务器将永远无法运行；因此，你将无法进行预测。除非你非常确定自己在做什么，否则不要更改这些文件。\n\
  \n\n\n### 设置 Dockerfile\n\n现在所有脚本文件都已就绪，我们需要创建一个 Docker 镜像，以便将其上传到 ECR，然后 SageMaker\
  \ 可以访问其中的代码，并在附加的 EC2 实例上运行。首先，我们来看看如何为我们创建的文件赋予一个结构。图 8-2 展示了在创建镜像之前，目录应有的结构。\n\
  \n![../images/495447_1_En_8_Chapter/495447_1_En_8_Fig2_HTML.jpg](img/495447_1_En_8_Fig2_HTML.jpg)\n\
  \n图 8-2\n\n目录结构\n\n我们已经创建了 `Data` 目录中的所有文件。现在，我们需要创建一个 `Dockerfile` 脚本，该脚本将被运行以构建镜像。然后，我们将使用\
  \ `build_and_push.sh` 文件将镜像推送到 ECR。\n\n以下是我们将在 `Dockerfile` 中遵循的步骤：\n\n1.  从 DockerHub\
  \ 下载一个包含我们操作系统的镜像。我们将下载一个最小版本的 Ubuntu，以便我们的代码可以在其中运行。为此，我们将使用以下脚本：\n\n1.  指定维护和创建此镜像的个人或组织名称。我在这里给出了我的名字。你可以使用任何你喜欢的名字。\n\
  \n```\nFROM ubuntu:16.04\n```\n\n1.  运行一些 Ubuntu 命令，以便设置 Python 环境并更新操作系统文件。我们还将下载用于运行推理端点的服务器文件。你必须熟悉\
  \ Linux 命令才能理解该脚本。\n\n    ```\n    RUN apt-get -y update && apt-get install -y --no-install-recommends\
  \ \\\n    wget \\\n    python \\\n    nginx \\\n    ca-certificates \\\n    && rm\
  \ -rf /var/lib/apt/lists/*\n    ```\n\n2.  设置完成后，我们可以使用 Python 的 `pip` 来安装重要的 Python\
  \ 包。\n\n    ```\n    RUN wget https://bootstrap.pypa.io/get-pip.py && python get-pip.py\
  \ && \\\n    pip install numpy==1.16.2 scipy==1.2.1 scikit-learn==0.20.2 pandas\
  \ flask gevent gunicorn && \\\n    (cd /usr/local/lib/python2.7/dist-packages/scipy/.libs;\
  \ rm *; ln ../../numpy/.libs/* .) && \\\n    rm -rf /root/.cache\n    ```\n\n3.\
  \  设置环境变量，以便 Python 知道包含代码的默认文件夹。同时，我们还将设置 Python 的一些特性。我们首先确保能够及时从容器接收日志消息，然后确保一旦在\
  \ Python 中导入任何模块，就不会创建其 `.pyc` 文件。这分别通过变量 `pythonunbuffered` 和 `pythondontwritebytecode`\
  \ 来实现。\n\n    ```\n    ENV PYTHONUNBUFFERED=TRUE\n    ENV PYTHONDONTWRITEBYTECODE=TRUE\n\
  \    ENV PATH=\"/opt/program:${PATH}\"\n    ```\n\n4.  最后，实例将指示将我们的 `Data` 目录文件复制到默认工作目录，然后我们将更改默认工作目录。\n\
  \n    ```\n    COPY Data /opt/program\n    WORKDIR /opt/program\n    ```\n\n```\n\
  MAINTAINER Himanshu Singh\n```\n\n至此，我们的 `Dockerfile` 创建完成。以下是完整的代码：\n\n```\nFROM\
  \ ubuntu:16.04\nMAINTAINER Himanshu Singh\nRUN apt-get -y update && apt-get install\
  \ -y --no-install-recommends \\\nwget \\\npython \\\nnginx \\\nca-certificates \\\
  \n&& rm -rf /var/lib/apt/lists/*\nRUN wget https://bootstrap.pypa.io/get-pip.py\
  \ && python get-pip.py && \\\npip install numpy==1.16.2 scipy==1.2.1 scikit-learn==0.20.2\
  \ pandas flask gevent gunicorn && \\\n(cd /usr/local/lib/python2.7/dist-packages/scipy/.libs;\
  \ rm *; ln ../../numpy/.libs/* .) && \\\nrm -rf /root/.cache\nENV PYTHONUNBUFFERED=TRUE\n\
  ENV PYTHONDONTWRITEBYTECODE=TRUE\nENV PATH=\"/opt/program:${PATH}\"\nCOPY Data /opt/program\n\
  WORKDIR /opt/program\n```\n\n现在，让我们看看用于将此镜像推送到 ECR 的脚本。\n\n### 将 Docker 镜像推送到 ECR\n\
  \n我们将创建一个 shell 脚本文件，该文件首先用于根据我们在上一节中创建的 `Dockerfile` 构建镜像，然后将镜像推送到 ECR。让我们看看此过程的逐步说明：\n\
  \n1.  命名镜像。我们将名称保存在一个变量中。\n\n1.  为 `train` 和 `serve` 文件授予完全的读写权限，以便容器启动后不会出现访问被拒绝的错误。\n\
  \n    ```\n    chmod +x Data/train\n    chmod +x Data/serve\n    ```\n\n2.  获取 AWS\
  \ 配置，以便在推送镜像时不会中断。我们将定义 AWS 的账户和区域。请记住，由于我们将从 SageMaker 内部运行此代码，因此可以自动获取这些信息。如果从本地系统或\
  \ AWS 外部的任何地方运行此代码，则必须提供自定义值。\n\n    ```\n    account=$(aws sts get-caller-identity\
  \ --query Account --output text)\n    region=$(aws configure get region)\n    region=${region:-us-east-2}\n\
  \    ```\n\n3.  为容器指定路径和名称。我们将使用第一步中给出的相同名称。稍后将使用此路径推送镜像。\n\n    ```\n    fullname=\"\
