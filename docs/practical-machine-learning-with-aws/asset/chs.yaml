  处理作业需要一些时间才能完成。它首先启动一个实例（类似于启动操作系统），然后在实例上下载 `sklearn` 镜像。接着，数据被下载到实例。然后处理作业开始。当作业完成时，训练和测试数据被存回
  S3。然后整个操作结束。作业完成后，我们可以使用以下脚本获取有关该作业的详细信息：


