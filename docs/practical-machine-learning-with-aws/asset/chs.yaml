  ## 探索 Blazing Text 算法


  Blazing text 算法用于为文本数据生成词嵌入。之后，这些嵌入可以提供给任何机器学习模型来执行分类任务。在本节中，我们将首先了解 blazing text
  算法，然后将其应用于 text8 数据集。


  Blazing text 算法是 word2vec 算法的高度优化版本，它允许更快的训练和推理，并且也支持分布式训练。使用此算法生成向量后，我们可以将它们用于不同的任务，例如文本分类、摘要、翻译等。它支持两种架构，类似于
  word2vec。


  *   跳字（Skip gram）架构


  *   连续词袋（Continuous bag of words）架构


  让我们简要讨论一下这些架构。


  ### 词向量生成的跳字架构


  跳字算法通过查找彼此最相似的词来生成词向量。该算法试图理解句子的上下文。为此，它以一个词作为输入，然后尝试预测所有具有相似上下文的词。图 6-4 展示了该架构，该图取自
  [`https://arxiv.org/pdf/1301.3781.pdf`](https://arxiv.org/pdf/1301.3781.pdf) 的研究论文（Mikolov
  等人）。


  ![../images/495447_1_En_6_Chapter/495447_1_En_6_Fig4_HTML.jpg](img/495447_1_En_6_Fig4_HTML.jpg)


  图 6-4


  跳字算法


  为了理解上下文并生成词向量，使用了一个小型神经网络架构，其隐藏层没有激活函数。最初，每个词都使用独热编码算法进行编码，然后输入到网络中。隐藏层被分配一个权重，其值通过损失函数学习。模型训练完成后，它可以用于生成词向量或直接用于文本分类模型。




  ### 词向量生成的连续词袋架构


  连续词袋（CBOW）方法可以说是跳元模型的逆向过程。它通过理解上下文，然后尝试预测该上下文中的词语。例如，如果句子是“德里是印度的首都”，我们写下“德里是首都”，那么它应该预测出“印度”。其架构与跳元模型相同，包含一个隐藏层和一个输出层。传递给网络的每个词都采用独热编码。见图
  6-5。


  ![../images/495447_1_En_6_Chapter/495447_1_En_6_Fig5_HTML.jpg](img/495447_1_En_6_Fig5_HTML.jpg)


  图 6-5


  CBOW 算法


  ### SageMaker 中 BlazingText 的应用


  在开始编码之前，我们必须了解将使用 BlazingText 算法生成词向量的数据集。我们将使用的数据集称为 text8 数据集。它是整个维基百科文本的一个小型、清理过的版本。整个维基百科的转储文件称为
  wiki9，经过清理并转换为 fil9。从这个清理后的数据集中取一个子集（100 MB），称为 text8。我们可以从 [`http://mattmahoney.net/dc/text8.zip`](http://mattmahoney.net/dc/text8.zip)
  下载该数据集。


  你可能已经知道，下载的数据必须发送到 S3 存储桶，以便我们的资源和算法容器能够访问它。我们可以使用以下脚本上传数据：


