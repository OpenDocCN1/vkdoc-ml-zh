  之后训练将开始。等待训练完成，如果你觉得 AutoML 耗时过长，可以选择任何自定义预测器。建议使用手动算法。


  训练完成后，我们需要点击“创建预测”。在此，你需要为预测命名，并选择刚刚创建的预测器。点击“创建预测”。见图 10-18。


