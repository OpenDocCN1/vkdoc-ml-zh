  本书分为三个部分。第一部分涵盖云计算的概念，并概述 AWS 的工作原理。第二部分详细讲解 AWS，涵盖 SageMaker、Step Functions、S3
  存储桶、ECR 等内容。最后一部分讨论 AWS 服务的使用案例。此处将讨论 Amazon Comprehend 和 Extract 等不同服务。


  具体来说，第一部分首先介绍云术语。它帮助您理解使用 AWS 所需的云概念。然后，本书讨论 Amazon 提供的各种 AWS 服务，以及它们如何以不同方式帮助用户。它讨论了
  AWS 的不同功能，这些功能按存储型、计算型、安全型等进行分类。通过本部分各章节的学习，您将对 AWS 的工作原理有一个概览。


  第二部分详细讨论 SageMaker。本部分从在 SageMaker 中运行一个基本的预处理脚本开始，以在其中构建一个完整的端到端机器学习流水线结束。它涵盖了
  SageMaker 如何与 ECR、S3、Step Functions 等不同服务交互，以构建最终模型。


  第三部分讨论了使用 AWS 其他一些服务的三个机器学习用例。本书讨论了如何使用 Amazon Textract 提取文本、如何使用 Amazon Comprehend，以及如何使用
  Amazon Forecast 构建时间序列模型。


  本书旨在为熟悉 Python 和机器学习的人提供一些 AWS 使用经验。它教您如何利用 AWS 的强大功能来构建您的重型模型，以及 AWS 如何为您提供服务来构建超级模型或部署您的自定义代码，并同样获得
  AWS 的支持。


