  ```

  cat_data.head()

  ```


  我们将合并分类数据框和数值数据框，然后对列进行归一化。此外，在此之前我们还需要移除两列：`Item_Identifier`和`Item_Sales`。`Item_Identifier`并不是一个重要的列，而`Item_Sales`将作为我们的因变量，因此它不能出现在自变量列表中。见图
  5-13。


  ![../images/495447_1_En_5_Chapter/495447_1_En_5_Fig13_HTML.jpg](img/495447_1_En_5_Fig13_HTML.jpg)


  图 5-13


  标准化缩放输出


  ```

  from sklearn.preprocessing import StandardScaler

  ss = StandardScaler()

  num_data = pd.DataFrame(ss.fit_transform(num_data.drop([''Item_Outlet_Sales''],
  axis=1)), columns = num_data.drop([''Item_Outlet_Sales''],axis=1).columns)

  cat_data = pd.DataFrame(ss.fit_transform(cat_data.drop([''Item_Identifier''], axis=1)),
  columns = cat_data.drop([''Item_Identifier''], axis=1).columns)

  final_data = pd.concat([num_data,cat_data],axis=1)

  final_data.head()

  ```


  现在，我们的最终数据已经准备就绪。我们使用了标准缩放器类将所有数值归一化为它们的 z 分数。我们将使用`final_data`作为自变量，同时提取`Item Sales`作为因变量。


  ```

  X = final_data

  y = data[''Item_Outlet_Sales'']

  ```


  最后一步是获取我们的训练集和验证集。为此，我们将使用 Scikit-Learn 提供的`model_selection`类。我们将取 10% 的数据作为验证集，其余作为测试集。


  ```

  from sklearn.model_selection import train_test_split

  X_train, X_test, y_train, y_test = train_test_split(X, y, test_size = 0.1, random_state=5)

  ```


  这标志着数据处理的最后一步。现在，我们可以用它来训练任何我们想要的模型。我展示的这些代码行可以在任何 Jupyter Notebook 中执行，无论是在本地主机还是在云端。唯一的要求是必须安装必要的包。


  在下一节中，我将向你展示如何使用 SageMaker 服务提供的 Scikit-Learn 容器在 SageMaker 中运行相同的代码。脚本保持不变，但流程发生了变化，因为我们需要持续与
  S3 存储桶通信并定义实例。我们将在下一节中详细探讨这一点。


  ## 使用 SageMaker 的 Scikit-Learn 容器进行预处理


  我们使用 SageMaker 是为了利用其多项优势，尤其是计算能力、API 生成和存储的便捷性。因此，为了实现这些目标，代码必须以特定格式编写。我们将使用上一节中看到的相同代码，但会对整体结构进行一些修改，使其与
  SageMaker 兼容。


  首先，数据应位于 S3 存储桶中。在本章的第一节中，我们已经将`Train.csv`文件放入了存储桶。完成此操作后，我们就可以开始编写代码了。首先，我们将定义用户的角色以及我们使用
  SageMaker 服务的区域。


  ```

  import boto3

  import sagemaker

  from sagemaker import get_execution_role

  region = boto3.session.Session().region_name

  role = get_execution_role()

  ```


  如果我们使用 SageMaker notebook，Boto3 包会尝试自动提取区域名称。如果我们在本地主机 notebook 上工作，则需要自定义定义区域。我们将在本书的最后部分讨论这部分内容。`get_execution_role()`提取用户登录时使用的当前角色。它可以是根用户或
  IAM 角色。


  现在我们已经定义了区域和角色，下一步将是定义我们的 Scikit-Learn 容器。正如本书第一部分所述，SageMaker 基于 Docker 容器运行。所有内置算法本质上都是
  Docker 容器，甚至自定义算法也必须放入 Docker 容器中并上传到 ECR。由于我们将使用 Scikit-Learn 处理数据，SageMaker 已经为此提供了一个处理容器。我们只需要实例化它，然后使用它即可。


  ```

  from sagemaker.sklearn.processing import SKLearnProcessor

  sklearn_processor = SKLearnProcessor(framework_version=''0.20.0'',

  role=role,

  instance_type=''ml.m5.xlarge'',

  instance_count=1)

  ```


  在前面的代码中，我们创建了一个名为`SKLearnProcessor`的对象。传递的参数指定了要使用的 Scikit-Learn 版本、要传递给实例的 IAM
  角色、要使用的计算实例类型，以及最后要启动的计算实例数量。完成此操作后，我们编写的任何使用 Scikit-Learn 的 Python 脚本都可以在此容器内运行。


  现在，让我们检查一下我们的数据是否可以从 SageMaker 访问。


  ```

  import pandas as pd

  input_data = ''s3://slytherins-test/Train.csv''

  df = pd.read_csv(input_data)

  df.head()

  ```


  `slytherins-test`是我们在本章前面创建的 S3 存储桶的名称。`Train.csv`是我们上传的数据。如果一切正常，你将得到如图 5-14 所示的输出。


  ![../images/495447_1_En_5_Chapter/495447_1_En_5_Fig14_HTML.jpg](img/495447_1_En_5_Fig14_HTML.jpg)


  图 5-14


  数据概览


  如果你遇到任何错误，请确保存储桶和数据都已授予公共访问权限。我们在本书的前面部分已经讨论过这一点。


  现在，是时候定义将在容器内运行的处理脚本了。我们已经在上一部分编写了这个脚本。我们只需重构代码并将其保存到名为`preprocessing.py`的文件中即可。




  ```

  import argparse

  import os

  import warnings

  import pandas as pd

  import numpy as np

  from sklearn.model_selection import train_test_split

  from sklearn.preprocessing import StandardScaler, LabelEncoder

  from sklearn.exceptions import DataConversionWarning

  warnings.filterwarnings(action=''ignore'', category=DataConversionWarning)

  # 这里我们定义了数据中存在的所有列

  columns = [''Item_Identifier'', ''Item_Weight'', ''Item_Fat_Content'', ''Item_Visibility'',

  ''Item_Type'', ''Item_MRP'', ''Outlet_Identifier'',

  ''Outlet_Establishment_Year'', ''Outlet_Size'', ''Outlet_Location_Type'',

  ''Outlet_Type'', ''Item_Outlet_Sales'']

  # 此方法将帮助我们打印数据的形状

  def print_shape(df):

  print(''数据形状: {}''.format(df.shape))

  if __name__==''__main__'':

  # 在容器执行时，我们将使用此解析器来定义训练验证集划分比例。默认保留 10%

  parser = argparse.ArgumentParser()

  parser.add_argument(''--train-test-split-ratio'', type=float, default=0.1)

  args, _ = parser.parse_known_args()

  print(''接收到的参数 {}''.format(args))

  # 这是容器内数据路径，Train.csv 将被下载并保存于此

  input_data_path = os.path.join(''/opt/ml/processing/input'', ''Train.csv'')

  print(''正在从 {} 读取输入数据''.format(input_data_path))

  data = pd.read_csv(input_data_path)

  data = pd.DataFrame(data=data, columns=columns)

  for i in data.Item_Type.value_counts().index:

  data.loc[(data[''Item_Weight''].isna()) & (data[''Item_Type''] == i), [''Item_Weight'']]
  = \

  data.loc[data[''Item_Type''] == ''Fruits and Vegetables'', [''Item_Weight'']].mean()[0]

  cat_data = data.select_dtypes(object)

  num_data = data.select_dtypes(np.number)

  cat_data.loc[(cat_data[''Outlet_Size''].isna()) & (cat_data[''Outlet_Type''] ==
  ''Grocery Store''), [''Outlet_Size'']] = ''Small''

  cat_data.loc[(cat_data[''Outlet_Size''].isna()) & (cat_data[''Outlet_Type''] ==
  ''Supermarket Type1''), [''Outlet_Size'']] = ''Small''

  cat_data.loc[(cat_data[''Outlet_Size''].isna()) & (cat_data[''Outlet_Type''] ==
  ''Supermarket Type2''), [''Outlet_Size'']] = ''Medium''

  cat_data.loc[(cat_data[''Outlet_Size''].isna()) & (cat_data[''Outlet_Type''] ==
  ''Supermarket Type3''), [''Outlet_Size'']] = ''Medium''

  cat_data.loc[cat_data[''Item_Fat_Content''] == ''LF'' , [''Item_Fat_Content'']]
  = ''Low Fat''

  cat_data.loc[cat_data[''Item_Fat_Content''] == ''reg'' , [''Item_Fat_Content'']]
  = ''Regular''

  cat_data.loc[cat_data[''Item_Fat_Content''] == ''low fat'' , [''Item_Fat_Content'']]
  = ''Low Fat''

  le = LabelEncoder()

  cat_data = cat_data.apply(le.fit_transform)

  ss = StandardScaler()

  num_data = pd.DataFrame(ss.fit_transform(num_data), columns = num_data.columns)

  cat_data = pd.DataFrame(ss.fit_transform(cat_data), columns = cat_data.columns)

  final_data = pd.concat([num_data,cat_data],axis=1)

  print(''清洗后的数据: {}''.format(final_data.shape))

  X = final_data.drop([''Item_Outlet_Sales''], axis=1)

  y = data[''Item_Outlet_Sales'']

  split_ratio = args.train_test_split_ratio

  print(''正在以比例 {} 将数据拆分为训练集和测试集''.format(split_ratio))

  X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=split_ratio,
  random_state=0)

  # 这定义了容器内的输出路径，所有 CSV 文件将从这里被取出并上传到 S3 存储桶

  train_features_output_path = os.path.join(''/opt/ml/processing/train'', ''train_features.csv'')

  train_labels_output_path = os.path.join(''/opt/ml/processing/train'', ''train_labels.csv'')

  test_features_output_path = os.path.join(''/opt/ml/processing/test'', ''test_features.csv'')

  test_labels_output_path = os.path.join(''/opt/ml/processing/test'', ''test_labels.csv'')

  print(''正在将训练特征保存到 {}''.format(train_features_output_path))

  pd.DataFrame(X_train).to_csv(train_features_output_path, header=False, index=False)

  print(''正在将测试特征保存到 {}''.format(test_features_output_path))

  pd.DataFrame(X_test).to_csv(test_features_output_path, header=False, index=False)

  print(''正在将训练标签保存到 {}''.format(train_labels_output_path))

  y_train.to_csv(train_labels_output_path, header=False, index=False)

  print(''正在将测试标签保存到 {}''.format(test_labels_output_path))

  y_test.to_csv(test_labels_output_path, header=False, index=False)

  ```


  正如我们所见，前面的代码与本书上一部分的代码相同；我们所做的只是定义了数据在容器内的存储位置、输出的存储位置，以及从那里上传到 S3 存储桶的位置。一旦定义好这个脚本，我们就可以开始了。我们需要做的就是启动实例化的容器，将此脚本作为参数传递，将数据作为参数传递，传递输出文件将存储的目录，最后传递目标
  S3 存储桶。


  ```

  from sagemaker.processing import ProcessingInput, ProcessingOutput

  sklearn_processor.run(code=''preprocessing.py'',

  inputs=[ProcessingInput(

  source=input_data,

  destination=''/opt/ml/processing/input'')],

  outputs=[ProcessingOutput(output_name=''train_data'',

  source=''/opt/ml/processing/train'',

  destination=''s3://slytherins-test/''),

  ProcessingOutput(output_name=''test_data'',

  source=''/opt/ml/processing/test'',

  destination=''s3://slytherins-test/'')],

  arguments=[''--train-test-split-ratio'', ''0.1'']

  )

  ```


  在前面的代码中，我们传递了所有参数。此外，我们还定义了告知划分比例的参数。在 `preprocessing.py` 脚本内部，我们有解析此参数的代码。


