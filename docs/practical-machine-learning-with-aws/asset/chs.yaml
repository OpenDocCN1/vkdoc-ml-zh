  可以看到，其格式与 XGBoost 算法和图像分类算法相同。所有参数都与前几节讨论的算法一致，只有超参数是该算法特有的。下面我们来讨论这些参数：


  *   原始文本和目标文本的最大序列长度，是指作为序列输入到神经网络架构的字符数量。


  *   批量大小是指一次性传递给算法的数据行数。


  *   检查点频率表示每处理 1000 行数据后保存一次模型。


  *   神经网络的隐藏层数量定义为 512，包含一个编码器架构单元和一个解码器架构单元。请记住，这些单元用于理解句子的上下文。


