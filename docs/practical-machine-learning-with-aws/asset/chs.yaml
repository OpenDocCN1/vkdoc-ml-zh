  在本章中，我们将详细探讨 AWS 中的 CloudWatch 功能。具体来说，我们将关注 CloudWatch 的两个组件：CloudWatch Logs 和
  CloudWatch Metrics，在使用 SageMaker 时会频繁用到它们。




  ## Amazon CloudWatch


  Amazon CloudWatch 是亚马逊提供的一项服务，用于追踪 AWS 的资源活动并提供相关指标。它还会存储每个所用资源提供的日志。通过这些日志和指标，用户可以了解所用
  AWS 资源的性能，并探索改进方法。


  在机器学习领域，尤其是使用 SageMaker 时，CloudWatch Logs 会提供代码运行所在容器的输出。正如我们在前几章中看到的，机器学习算法运行在附加到
  EC2 实例的 Docker 容器内。因此，这些容器产生的输出无法直接查看。要查看这些输出，我们需要对代码进行一些调整，然后状态就可以直接在所使用的 Jupyter
  Notebook 中看到，或者我们可以使用 CloudWatch Logs 逐步获取这些输出。输出内容可以包括模型输出、模型失败的原因、逐步执行的详细信息等。三个任务都需要容器，因此我们在机器学习中有三个日志组。


  *   Processing Jobs（处理作业）日志组

  *   Training Jobs（训练作业）日志组

  *   Transform Jobs（转换作业）日志组


  我们将在后续章节中详细查看这些日志组。


  CloudWatch Metrics 以变量值的形式向我们提供信息。例如，在机器学习中，CloudWatch Metrics 可以提供模型准确率、精确率、误差等值。它还可以提供与资源相关的指标，例如
  GPU 利用率、内存利用率等。我们将在后续章节中详细查看 CloudWatch Metrics。图 7-1 展示了 CloudWatch 的工作原理架构。


  ![../images/495447_1_En_7_Chapter/495447_1_En_7_Fig1_HTML.jpg](img/495447_1_En_7_Fig1_HTML.jpg)


  图 7-1


  Amazon CloudWatch 架构


  通过查看此架构，我们可以看到，除了通过 Amazon 管理控制台访问服务外，我们还可以通过 Amazon SNS 集成告警，这些告警可以连接到您的电子邮件。我们还可以根据特定条件设置自定义规则。这包括启动、停止和终止进程，或使用自动扩缩等功能。让我们在下一节中更深入地了解
