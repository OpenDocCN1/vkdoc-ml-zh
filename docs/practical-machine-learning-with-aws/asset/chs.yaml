  至此，使用 `SklearnProcessor` 可以完成的整个处理作业就结束了。下一步始终是定义机器学习算法。我们将在接下来的章节中讨论这一点。


  但是，假设我们不想使用 SageMaker 预定义的容器（如 `ScriptProcessor`），而是想创建自己的容器并在其上运行脚本。在这种情况下，我们可以使用
  SageMaker 的一个名为 `ScriptProcessor` 的类。让我们在下一节中探讨这一点。




  ## 使用 ScriptProcessor 创建自定义预处理代码


  在上一节中，我们使用了 `SkLearnProcessor`，这是 SageMaker 提供的内置容器。但很多时候，我们编写的代码无法仅在 SageMaker
  预定义的容器中执行。为此，我们必须创建自己的容器。在训练机器学习模型时，我们也会探讨如何创建自己的容器。在本节中，我们将创建一个执行与 `SKlearnProcessor`
  容器相同任务的容器。唯一的区别在于它不是预构建的；我们将从头开始构建它。


  要为处理作业使用自定义容器，我们需要使用 SageMaker 提供的名为 `ScriptProcessor` 的类。在向 `ScriptProcessor` 提供输入之前，首要任务是创建我们的
  Docker 容器并将其推送到 ECR。


  ### 创建 Docker 容器


  为此，我们将创建一个名为 `Dockerfile` 的文件（无扩展名）。在该文件中，我们将下载一个最小操作系统的镜像，然后在其内部安装所需的软件包。因此，我们的最小操作系统将基于
  Linux，并在其中安装 Python、Scikit-Learn 和 Pandas。


  ```

  FROM python:3.7-slim-buster

  RUN pip3 install pandas==0.25.3 scikit-learn==0.21.3

  ENV PYTHONUNBUFFERED=TRUE

  ENTRYPOINT ["python3"]

  ```


  上述脚本必须存在于 `Dockerfile` 中。第一行 `FROM python:3.7-slim-buster` 指定了需要从 Docker Hub 下载的最小操作系统。该操作系统仅包含
  Python 3.7 和运行 Python 所需的最小软件包。但是，我们还需要安装其他软件包。因此，我们使用下一行 `RUN pip3 install pandas==0.25.3
  scikit-learn==0.21.3`。这将安装 Pandas、Scikit-Learn、Numpy 以及其他重要的软件包。下一行 `ENV PYTHONUNBUFFERED=TRUE`
  是一条高级指令，它告诉 Python 立即记录日志消息。这有助于调试。最后一行 `ENTRYPOINT ["python3"]` 指定了我们的 `preprocessing.py`
  文件应如何执行。


  ### 构建并推送镜像


  现在我们的 Docker 文件已准备就绪，我们需要构建此镜像，然后将其推送到 Amazon ECR（一个 Docker 镜像仓库服务）。要构建并推送此镜像，需要以下信息：


  *   账户 ID

  *   仓库名称

  *   区域

  *   分配给镜像的标签


  所有这些信息都可以使用以下脚本进行初始化：


  ```

  import boto3

  account_id = boto3.client(''sts'').get_caller_identity().get(''Account'')

  ecr_repository = ''sagemaker-processing-container''

  tag = '':latest''

  region = boto3.session.Session().region_name

  ```


  一旦我们有了这些信息，就可以首先定义 ECR 仓库地址，然后执行一些命令行脚本来启动该过程。


  ```

  processing_repository_uri = ''{}.dkr.ecr.{}.amazonaws.com/{}''.format(account_id,
  region, ecr_repository + tag)

  # 创建 ECR 仓库并推送 Docker 镜像

  ! docker build -t $ecr_repository docker # 构建镜像

  ! $(aws ecr get-login --region $region --registry-ids $account_id --no-include-email)
  # 登录 AWS

  ! aws ecr create-repository --repository-name $ecr_repository # 创建 ECR 仓库

  ! docker tag {ecr_repository + tag} $processing_repository_uri # 为镜像打标签以区别于其他镜像

  ! docker push $processing_repository_uri # 将镜像推送到 ECR

  ```


  如果一切顺利，您的镜像将成功推送到 ECR。您可以前往 ECR 服务并检查仓库。您可以在图 5-17 中看到视图。


  ![../images/495447_1_En_5_Chapter/495447_1_En_5_Fig17_HTML.jpg](img/495447_1_En_5_Fig17_HTML.jpg)


  图 5-17


  镜像已推送到 ECR


  ### 使用 ScriptProcessor 类


  现在我们的镜像已准备就绪，我们可以开始使用 `ScriptProcessor` 类了。我们将在此容器内执行相同的代码 `preprocessing.py`。就像我们在
  `SKLearnProcessor` 中所做的那样，我们将首先创建该类的对象。


  ```

  from sagemaker.processing import ScriptProcessor, ProcessingInput, ProcessingOutput

  from sagemaker import get_execution_role

  role = get_execution_role()

  script_processor = ScriptProcessor(command=[''python3''],

  image_uri=processing_repository_uri,

  role=role,

  instance_count=1,

  instance_type=''ml.m5.xlarge'')

  ```


  创建对象后，我们可以使用它来运行我们的 `preprocessing.py` 文件。


  ```

  input_data = ''s3://slytherins-test/Train.csv''

  script_processor.run(code=''preprocessing.py'',

  inputs=[ProcessingInput(

  source=input_data,

  destination=''/opt/ml/processing/input'')],

  outputs=[ProcessingOutput(source=''/opt/ml/processing/train'', destination=''s3://slytherins-test/''),

  ProcessingOutput(source=''/opt/ml/processing/test'', destination=''s3://slytherins-test/'')])

  ```


  您会发现代码与 `SKLearnProcessor` 的代码几乎相同。它也会产生相同的输出。最后，处理作业完成后，我们可以用同样的方式再次检查输出。


  ```

  preprocessing_job_description = script_processor.jobs[-1].describe()

  output_config = preprocessing_job_description[''ProcessingOutputConfig'']

  for output in output_config[''Outputs'']:

  if output[''OutputName''] == ''output-1'':

  preprocessed_training_data = output[''S3Output''][''S3Uri'']

  if output[''OutputName''] == ''output-2'':

  preprocessed_test_data = output[''S3Output''][''S3Uri'']

  import pandas as pd

  training_features = pd.read_csv(preprocessed_training_data + ''train_features.csv'',
  nrows=10, header=None)

  print(''Training features shape: {}''.format(training_features.shape))

  training_features.head(n=10)

  ```


  您将获得的输出与图 5-16 中显示的相同。


  在本节中，我们了解了如何创建自己的容器并运行处理脚本。这在许多情况下变得很重要。例如，如果我们想对 NLP 任务使用基于 BERT 的预处理，我们将需要为此创建一个容器，因为
  SageMaker 不提供基于 BERT 的服务。在后续章节中创建训练和推理作业时，我们将进一步探索自定义容器。


  在过去的两个部分中，我们一直在 SageMaker 容器内的 Jupyter Notebook 中工作。但大多数时候，尤其是在生产环境中，我们必须在不同的系统中运行代码。为此，我们将不得不使用
  Boto3 API 进行身份验证和执行。在下一节中，我们将了解如何使用 Boto3 运行我们的自定义脚本。


  ## 使用 Boto3 运行处理作业


  如前所述，我们使用 Boto3 包从任何其他计算机（包括您的本地主机）访问 AWS 的服务。因此，在本节中，我们将使用 Boto3 运行我们在上一节中看到的自定义
  Docker 容器脚本。




  ### 安装 Boto3


  使用 Boto3 的第一步是在本地主机环境中安装它。除了 Boto3，我们还需要安装 `awscli`，它将帮助我们完成与 AWS 的身份验证，以及 `s3fs`，后者将帮助我们与
  S3 存储桶进行通信。我们将使用 `pip` 进行安装，如下所示：


  ```

  pip install boto3

  pip install awscli

  pip install s3fs

  ```


  安装完成后，我们需要配置 AWS 的凭证。为此，我们将运行以下命令：


  ```

  aws configure

  ```


  这将要求您提供以下四项信息：


  *   AWS 访问密钥


  *   AWS 秘密访问密钥


  *   默认区域名称


  *   默认输出格式


  提供这些信息后，我们就可以轻松使用 Boto3 连接到 AWS 服务。我已经向您展示了在创建 IAM 角色时如何获取访问密钥和秘密访问密钥。默认区域名称将是 `us-east-2`，但您可以通过查看
  AWS 管理控制台右上角来重新确认。它会显示您的位置。如图 5-18 所示，我已经传入了所需的信息。


  ![../images/495447_1_En_5_Chapter/495447_1_En_5_Fig18_HTML.jpg](img/495447_1_En_5_Fig18_HTML.jpg)


  图 5-18


  设置 AWS 凭证


  这部分完成后，我们可以启动 Jupyter Notebook（本地系统笔记本），并在我们安装所有包并配置了 AWS 的同一环境中创建一个笔记本。


  ### 初始化 Boto3


  在笔记本中，第一步是初始化 Boto3。为此，我们将使用以下脚本：


  ```

  import boto3

  import s3fs

  region = boto3.session.Session().region_name

  client = boto3.client(''sagemaker'')

  ```


  在上一步中，区域由您设置。相同的区域将被提取并存储在变量 `region` 中。接下来是设置 Boto3。Boto3 可以为 AWS 的所有服务进行设置。目前，我们将使用
  SageMaker；因此，我们将调用 Boto3 的 `client` 类，并用 SageMaker 初始化它（`client = boto3.client(''sagemaker'')`）。


  ### 修改 Dockerfile 并推送镜像


  现在，我们将使用 Boto3 API 调用处理作业方法。这将创建我们在上一节中看到的相同处理作业。但是，需要进行一些小的更改，我们将逐一探讨。


  我们将使用 `create_processing_job` 方法来运行数据处理作业。要了解有关此方法或 Boto3 提供的所有与 SageMaker 相关的方法的更多信息，您可以访问
  [`https://boto3.amazonaws.com/v1/documentation/api/latest/reference/services/sagemaker.html`](https://boto3.amazonaws.com/v1/documentation/api/latest/reference/services/sagemaker.html)。


  但在此之前，我们必须对我们的 Docker 容器和处理 Python 文件进行一些更改。对于 Docker 容器，我们需要将 `preprocessing.py`
  脚本复制到其中，以便 Boto3 方法可以直接运行该脚本。为此，我们将对 Dockerfile 进行以下更改：


  ```

  FROM python:3.7-slim-buster

  RUN pip3 install pandas==0.25.3 scikit-learn==0.21.3

  ENV PYTHONUNBUFFERED=TRUE

  ENV PATH="/opt/ml/code:${PATH}"

  COPY preprocessing.py /opt/ml/code/preprocessing.py

  WORKDIR /opt/ml/code

  ```


  我们在现有的 Dockerfile 中添加了三行新内容。`ENV PATH="/opt/ml/code:${PATH}"` 这一行将环境路径设置为 `/opt/ml/code`。我们将通过
  `COPY preprocessing.py /opt/ml/code/preprocessing.py` 把我们的脚本 `preprocessing.py`
  放置在其中。最后，我们将工作目录设置为同一个文件夹：`WORKDIR /opt/ml/code`。这是必需的，以便 Docker 容器知道脚本文件所在的位置，这将有助于其执行。


  在 Dockerfile 中做出更改后，我们将对构建镜像并将其推送到 ECR 的脚本进行更改。我们需要做的唯一更改是添加一行，授予容器操作 `preprocessing.py`
  脚本的权限。否则，Docker 可能没有权限打开和查看其内容。


  ```

  # 创建 ECR 仓库并推送 Docker 镜像

  ! chmod +x docker/preprocessing.py # 此行授予预处理脚本读写权限

  ! docker build -t $ecr_repository docker # 构建镜像

  ! $(aws ecr get-login --region $region --registry-ids $account_id --no-include-email)
  # 登录 AWS

  ! aws ecr create-repository --repository-name $ecr_repository # 创建 ECR 仓库

  ! docker tag {ecr_repository + tag} $processing_repository_uri # 标记镜像以区别于其他镜像

  ! docker push $processing_repository_uri # 将镜像推送到 ECR

  ```


  完成此步骤后，我们就可以运行 Boto3 处理作业了。




  ### 创建处理作业


  简而言之，使用 Boto3 创建处理作业需要四个部分的信息。


  *   输入数据信息 (`ProcessingInput`)

  *   输出数据信息 (`ProcessingOutput`)

  *   资源信息 (`ProcessingResources`)

  *   容器信息 (`AppSpecification`)


  如下代码所示，上述所有信息都已提供。这段代码与我们之前看到的代码类似；区别在于，Boto3 需要手动将信息作为参数传入，而当我们从 SageMaker 内部运行代码时，大部分信息会自动提取。


  ```

  response = client.create_processing_job(       # 初始化方法

  ProcessingInputs=[

  {

  ''InputName'': "Training_Input",    # 为输入作业命名

  ''S3Input'': {

  ''S3Uri'': input_data,          # 数据来源的 URL

  ''LocalPath'': ''/opt/ml/processing/input'',     # 数据将下载到的本地目录

  ''S3DataType'': ''S3Prefix'',     # 数据类型是什么？

  ''S3InputMode'': ''File''         # 是文件还是连续数据流？

  }

  },

  ],

  ProcessingOutputConfig={

  ''Outputs'': [

  {

  ''OutputName'': ''Training'',      # 指定输出名称

  ''S3Output'': {

  ''S3Uri'': ''s3://slytherins-test/'',      # 输出需要存储的位置

  ''LocalPath'': ''/opt/ml/processing/train'',   # 需要查找输出的本地目录

  ''S3UploadMode'': ''EndOfJob''     # 作业完成时上传

  },

  ''OutputName'': ''Testing'',

  ''S3Output'': {

  ''S3Uri'': ''s3://slytherins-test/'',

  ''LocalPath'': ''/opt/ml/processing/test'',

  ''S3UploadMode'': ''EndOfJob''

  }

  },

  ],

  },

  ProcessingJobName=''preprocessing-job-test'',    # 为整个作业命名，名称应唯一

  ProcessingResources={

  ''ClusterConfig'': {

  ''InstanceCount'': 1,                  # 需要多少个实例？

  ''InstanceType'': ''ml.m5.xlarge'',      # 实例类型是什么？

  ''VolumeSizeInGB'': 5                 # 实例大小应为多少？

  }

  },

  AppSpecification={

  ''ImageUri'': ''809912564797.dkr.ecr.us-east-2.amazonaws.com/sagemaker-processing-container:latest'',

  # Docker 镜像 URL

  ''ContainerEntrypoint'': [

  ''Python3'',''preprocessing.py''         # 如何运行脚本

  ]

  },

  RoleArn=''arn:aws:iam::809912564797:role/sagemaker-full-accss'',    # IAM 角色定义

  )

  ```


  `RoleArn` 定义了运行代码所需的 IAM 角色。我们已经在活动部分创建了这个角色。我还解释了如何在创建 IAM 角色时复制 ARN。


  上述代码将启动处理作业。但是，你不会看到任何输出。要了解作业的状态，你可以使用 CloudWatch，我将在下一节中介绍。现在，我们将借助 Boto3 的 `describe_processing_job`
  方法来获取信息。我们可以通过编写以下代码来实现：


  ```

  client.describe_processing_job(

  ProcessingJobName=''processing-job-test''

  )

  ```


  这将提供关于该作业的详细信息，如图 5-19 所示。


  ![../images/495447_1_En_5_Chapter/495447_1_En_5_Fig19_HTML.jpg](img/495447_1_En_5_Fig19_HTML.jpg)


  图 5-19


  处理作业描述


  你会找到 `ProcessingJobStatus` 键，它指示了状态，如果作业失败，你还会获得失败原因键。至此，我们已经了解了 SageMaker 提供的三种数据处理方式。接下来，让我们在下一节中探讨如何监控这些作业。


  ## 使用 CloudWatch 监控处理作业


