  图 5-5


  已移除的数值型空值


  因此，我们成功填充了 `Item_Weight` 列的空值。对于 `Outlet_Size`，我们接下来要做的是先将数据拆分为数值型和类别型两个数据框，然后再填充空值。


  ```

  import numpy as np

  cat_data = data.select_dtypes(object)

  num_data = data.select_dtypes(np.number)

