  ```

  cat_data.isna().sum()

  ```


  所以，空值仍然存在。如果我们查看 `Outlet_Size` 列中的类别，会发现有三个。见图 5-7。


  ![../images/495447_1_En_5_Chapter/495447_1_En_5_Fig7_HTML.jpg](img/495447_1_En_5_Fig7_HTML.jpg)


  图 5-7


  类别及其计数


  ```

  cat_data.Outlet_Size.value_counts()

  ```


  但是，如果我们根据 `Outlet_Type` 来查看这些类别的计数，结果如图 5-8 所示。


  ![../images/495447_1_En_5_Chapter/495447_1_En_5_Fig8_HTML.jpg](img/495447_1_En_5_Fig8_HTML.jpg)


  图 5-8


  按类型对门店规模进行分组


  ```

  cat_data.groupby([''Outlet_Type'',''Outlet_Size'']).count()

  ```


  在此图中，我们可以看到，对于杂货店，最大规模的 `Small` 门店数量最多；对于超市类型 1，`Small` 最多；对于超市类型 2 和超市类型 3，`Medium`
  最多。因此，我们将根据门店类型相应地填充空值。


  ```

  cat_data.loc[(cat_data[''Outlet_Size''].isna()) & (cat_data[''Outlet_Type''] ==
  ''Grocery Store''), [''Outlet_Size'']] = ''Small''

  cat_data.loc[(cat_data[''Outlet_Size''].isna()) & (cat_data[''Outlet_Type''] ==
  ''Supermarket Type1''), [''Outlet_Size'']] = ''Small''

  cat_data.loc[(cat_data[''Outlet_Size''].isna()) & (cat_data[''Outlet_Type''] ==
  ''Supermarket Type2''), [''Outlet_Size'']] = ''Medium''

  cat_data.loc[(cat_data[''Outlet_Size''].isna()) & (cat_data[''Outlet_Type''] ==
  ''Supermarket Type3''), [''Outlet_Size'']] = ''Medium''

  ```


  现在我们可以检查空值以进行确认。见图 5-9。


  ![../images/495447_1_En_5_Chapter/495447_1_En_5_Fig9_HTML.jpg](img/495447_1_En_5_Fig9_HTML.jpg)


  图 5-9


  所有空值已移除


  最后，所有空值都已成功移除。请记住，我们可以使用 Pandas 的 `fillna()` 方法来完成同样的操作。此外，我们还可以使用其他不同的方法进行填充，例如向后填充、向前填充、插值等。你可以自行尝试所有这些方法。




  现在我们已经处理了所有空值，在进入虚拟变量处理之前，我们还需要做最后一件事。如果查看`Item Fat Content`列的类别，会发现存在以不同方式表示的相同值。见图
  5-10。


  ![../images/495447_1_En_5_Chapter/495447_1_En_5_Fig10_HTML.jpg](img/495447_1_En_5_Fig10_HTML.jpg)


