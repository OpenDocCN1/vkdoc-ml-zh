  ## 结论


  在本章中，你学习了如何使用 Step Functions 创建端到端管道。这在创建完整的训练和部署流程，以及使用新数据或新配置重新训练模型时非常有用。这也有助于创建
  CI/CD 管道，我们可以将代码推送到 Git，然后使用 Jenkins 或 Bamboo 等工具创建这些 Step Function 并启动执行。因此，当你将代码推送到
  Git 时，训练过程会立即开始。这就是创建管道的强大之处。


  至此，我们对 SageMaker 及其服务的讨论就结束了。在本书的下一章中，我们将介绍一些可以使用其他 AWS 服务完成的机器学习用例。


