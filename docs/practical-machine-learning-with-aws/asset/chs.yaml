  ## 用例 2：使用 Amazon Forecast 进行销售预测


  在本节中，我们将预测一家公司的销售情况。为此，我们将使用 Kaggle 上一个名为“商店商品需求预测”的预测数据集。你可以从 [`https://www.kaggle.com/c/demand-forecasting-kernels-only/data?select=train.csv`](https://www.kaggle.com/c/demand-forecasting-kernels-only/data%253Fselect%253Dtrain.csv)
  下载该数据集。


  下载数据集后，我们需要对其进行一些格式化。首先，我们要为其添加一个 ID 列。这应该是数据集的第一列。接下来，确保日期字段的格式为 YYYY-MM-DD；否则，Amazon
  Forecast 将无法接受。完成这些操作后，将数据集上传到 S3，并记下其路径。


  ### 创建数据集组


  现在，打开 Amazon 管理控制台，然后搜索 *Amazon Forecast Service*。点击“创建数据集组”。第一步是为数据集组命名，然后选择预测领域。在我们的分析中，我们选择了自定义领域。见图
  10-14。


  ![../images/495447_1_En_10_Chapter/495447_1_En_10_Fig14_HTML.jpg](img/495447_1_En_10_Fig14_HTML.jpg)


  图 10-14


  创建数据集组名称


  ### 定义列属性


  下一步是为你的数据集命名。然后，你需要定义列属性。见图 10-15。


  ![../images/495447_1_En_10_Chapter/495447_1_En_10_Fig15_HTML.jpg](img/495447_1_En_10_Fig15_HTML.jpg)


  图 10-15


  定义列属性


  请记住，属性的顺序应与数据集中的顺序一致。此外，除了 JSON 模式中已有的属性外，所有其他属性都必须是字符串。这就是为什么商店和数量被标记为字符串。你也可以定义时间间隔。对我们来说，这是每日间隔，因此按此设置。点击“下一步”。


  ### 导入数据


  最后一步是开始导入数据。在此，你需要提供 S3 路径和数据集导入的名称。见图 10-16。


  ![../images/495447_1_En_10_Chapter/495447_1_En_10_Fig16_HTML.jpg](img/495447_1_En_10_Fig16_HTML.jpg)


