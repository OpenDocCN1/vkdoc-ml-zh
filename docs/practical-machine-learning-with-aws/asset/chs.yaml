  cat_data.Item_Fat_Content.value_counts()

  ```


  `LF`表示低脂（Low Fat），`reg`表示常规（Regular），而`low fat`只是低脂的小写版本。让我们统一修正这些问题。


  ```

  cat_data.loc[cat_data[''Item_Fat_Content''] == ''LF'' , [''Item_Fat_Content'']]
  = ''Low Fat''

  cat_data.loc[cat_data[''Item_Fat_Content''] == ''reg'' , [''Item_Fat_Content'']]
  = ''Regular''

  cat_data.loc[cat_data[''Item_Fat_Content''] == ''low fat'' , [''Item_Fat_Content'']]
