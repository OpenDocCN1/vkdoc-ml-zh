- "# 1. 什么是人工智能？\n\n> *知识本身毫无价值，但有用知识的应用？那才强大。*\n> \n> ——奥修\n\n人工智能（AI）再次被视为我们这个时代最激动人心的进步之一。虚拟助手能够以惊人的准确性判断我们的音乐品味，汽车现在可以自动驾驶，移动应用则有助于逆转那些曾被认为是慢性和进行性的疾病。\n\
  \n许多人惊讶地发现，人工智能并非新鲜事物。人工智能技术已经存在了几十年。事实上，它正在经历一场复兴——这得益于数据的可用性和计算成本呈指数级下降。\n\n##\
  \ 多学科交叉的领域\n\n人工智能是计算机科学的一个子集，其起源涉及数学、逻辑学、哲学、心理学、认知科学和生物学等多个学科（图 1-1）。\n\n![../images/459335_2_En_1_Chapter/459335_2_En_1_Fig1_HTML.jpg](img/459335_2_En_1_Fig1_HTML.jpg)\n\
  \n图 1-1\n\n人工智能、机器学习及其在计算机科学中的位置\n\n最早的人工智能研究源于 20 世纪 30 年代末开始的一系列思想，并在 1950 年达到顶峰，当时英国先驱艾伦·图灵发表了《计算机器与智能》，文中他问道：“机器能思考吗？”图灵测试提出了一种测试机器展示“人工”智能能力的方法，评估机器的行为是否与人类无法区分。图灵提出，如果人类评估者能与计算机和人类进行自然语言对话，且无法区分两者（即成功模仿人类行为的智能体或系统），那么这台计算机就可以被认为能够思考。\n\
  \n“人工智能”一词最早于 1956 年由达特茅斯学院的约翰·麦卡锡教授提出。麦卡锡教授提出了一项夏季研究项目，其基础理念是“原则上，学习的每个方面或智能的任何其他特征都可以被精确地描述，以至于可以制造一台机器来模拟它”[6]。\n\
  \n事实上，人工智能的核心仅仅是编程。如图 1-1 所示，人工智能可以被理解为计算机科学的一种抽象。其受欢迎程度以及能力的激增，很大程度上与通过移动设备、智能手表、可穿戴设备产生的数据爆炸，以及以比以往更低的成本获取计算能力有关。据\
  \ IBM 估计，全球 90%的数据是在过去两年内产生的[7]。\n\n据估计，未来十年将会有 1500 亿个联网测量传感器——这是全球人口的 20 倍[8]。这种呈指数级增长的数据正在使一切变得智能。从智能手机到智能洗车机、智能家居、智慧城市和智慧社区，都即将到来。\n\
  \n这些数据带来了大量的学习机会，因此，现在的焦点已转向从可用数据中学习以及开发智能系统。系统获得的数据越多，其学习能力就越强，从而使其变得更加精确。\n\n\
  人工智能和机器学习在企业中的使用和应用仍然相对较新，在医疗健康领域更是如此。高德纳的“新兴技术成熟度曲线”将机器学习置于期望膨胀期的顶峰，预计还需 5 到 10\
  \ 年才能达到成熟期[9]。\n\n因此，机器学习在医疗环境中的应用是新颖、令人兴奋且富有创新性的。如今移动设备的数量已超过人口总数，健康的未来充满了来自患者、环境和医生的数据[31]。因此，利用人工智能和机器学习优化健康的机会正在成熟。\n\
  \n在当前生态系统中，人工智能和机器学习在医疗健康领域的实现再受欢迎不过了，因为全球医疗成本正在上升，政府和私人支付方正对服务施加越来越大的压力，要求其更具成本效益。成本管理通常不能对患者就医、患者护理和健康结果产生负面影响。\n\
  \n但是，人工智能和机器学习如何应用于日常医疗环境呢？本书旨在帮助那些希望了解人工智能和机器学习是什么，以及如何在其健康生态系统中开发、评估和部署智能系统的人。书中包含了健康智能领域的真实案例研究，展示了人工智能和机器学习如何改善患者健康和人群健康，并促进显著的成本节约和效率提升。\n\
  \n到本书结尾，读者应能自信地掌握人工智能和机器学习的关键主题。读者将能够描述机器学习的方法和局限性、基本算法、数据的用途和要求、学习的伦理与治理，以及如何评估此类系统的成功。最重要的是，读者将学习如何规划一个真实的机器学习项目——从准备数据和选择模型，到验证准确性和评估性能。\n\
  \n本书并非侧重于令人望而生畏的统计学和代数，而是探讨人工智能和机器学习在医疗健康领域的理论与实践应用——并提供评估人工智能和机器学习应用的有效性、适用性和成功与否的方法与技巧。\n\
  \n## 审视人工智能\n\n从核心上讲，人工智能可以被定义为在智能体（计算机）中模拟智能行为，其方式使我们人类认为其是聪明或类人的[10]。人工智能的核心概念包括智能体发展出知识、推理、问题解决、感知、学习、规划以及操纵和移动的能力等特质。\n\
  \n具体而言，人工智能可以被认为包含以下内容：\n\n*   让系统进行理性推理：技术包括自动推理、证明规划、约束求解和基于案例的推理。\n*   让程序学习、发现和预测：技术包括机器学习、数据挖掘（搜索）和科学知识发现。\n\
  *   让程序玩游戏：技术包括极小化极大搜索和阿尔法-贝塔剪枝。\n*   让程序与人类交流：技术包括自然语言处理（NLP）。\n*   让程序展现生命迹象：技术包括遗传算法（GA）。\n\
  *   使机器能够在世界中智能导航：这涉及机器人技术，如规划和视觉。\n\n关于人工智能存在许多误解，主要是因为它仍然是一门相当年轻的学科。事实上，关于它将如何发展也有许多观点。有趣的专家意见包括凯文·沃里克的观点，他认为机器人将接管地球。罗杰·彭罗斯则认为计算机永远无法真正拥有智能。与此同时，马克·杰弗里甚至提出计算机将进化成人类。人工智能是否会在下一代接管地球不太可能，但人工智能及其应用将会持续存在。\n\
  \n过去，由于数据集有限、数据样本代表性不足，以及无法存储、索引和分析大量数据，人工智能的智能方面受到了限制。如今，数据是实时到来的，这得益于手机使用、数字设备、日益数字化的系统、可穿戴设备和物联网（IoT）的指数级增长。\n\
  \n现在，数据不仅实时流入，而且来源多样、速度飞快，并且要求这些数据必须可用于分析，并且从根本上可解释，以便做出更好的决策。\n\n人工智能有四个不同的类别。\n\
  \n\n\n### 反应式机器\n\n这是最基本的人工智能。反应式系统在当前场景下做出响应，依靠已教授或已记忆的数据在当前状态下做出决策。反应式机器能很好地执行它们被设计来执行的任务，但除此之外什么也做不了。这是因为这些系统无法利用过去的经验来影响未来的决策。但这并不意味着反应式机器毫无用处。\n\
  \nIBM 的超级计算机“深蓝”是一台用于下棋的反应式机器，它能够根据当时的棋盘局势做出预测。深蓝在 1996 年击败了国际象棋世界冠军加里·卡斯帕罗夫。一个鲜为人知的事实是，卡斯帕罗夫赢得了剩余五局中的三局，最终以四比二的总比分击败了深蓝\
  \ [11]。最近，谷歌的 AlphaGo 战胜了世界顶尖的人类围棋选手 [73]。\n\n### 有限记忆：能理性思考与行动的系统\n\n这种人工智能基于有限记忆原理运作，同时使用预先编程的知识和随时间推移进行的后续观察。在观察过程中，系统会查看其环境中的对象，检测它们如何变化，然后做出必要的调整。这项技术被用于自动驾驶汽车。无处不在的互联网接入和物联网为有限记忆系统提供了无限的知识来源。\n\
  \n### 心智理论：像人类一样思考的系统\n\n心智理论型人工智能代表了那些能够解读其世界以及其中行动者（或人）的系统。这类人工智能需要理解环境中的事物和人也能改变他们的感受和行为。尽管目前这类人工智能还很有限，但它可以用于护理角色，例如协助老年人或残疾人完成日常任务。\n\
  \n因此，一个采用心智理论型人工智能的机器人将能够评估其世界中的事物，并认识到环境中的人拥有自己的思想、独特的情绪、习得的经验等等。心智理论型人工智能可以尝试理解人们的意图并预测他们可能的行为。\n\
  \n### 自我意识型人工智能：像人类一样的系统\n\n这种最先进的人工智能涉及拥有意识并能识别人类之外世界的机器。这种人工智能目前还不存在，但已有软件展示出对某些事物的渴望以及对其自身内部感受的认知。伦斯勒理工学院的研究人员给三个机器人提供了一个更新版本的“智者谜题”（一种归纳性自我意识测试），其中一个通过了测试。该测试要求人工智能能够倾听并理解非结构化文本，同时能够识别自己的声音以及与其他机器人的区别\
  \ [12]。\n\n如今的技术已经足够敏捷，可以实时访问海量数据集并随时学习。归根结底，人工智能的好坏取决于用于创建它的数据——有了强大且海量的数据，我们就能对自己的决策更有信心。\n\
  \n与交通、能源和金融领域相比，医疗保健领域在采用大数据和人工智能的优势方面进展缓慢。尽管原因有很多，但医疗健康部门的僵化在很大程度上是因为人命关天。医疗服务更像是一种必需品而非消费者的选择；因此，历史上医疗行业几乎没有或根本没有通常驱动其他行业寻求创新的威胁。\n\
  \n这加剧了医疗机构所能提供的与患者所期望之间的差距——这随后导致了护理和健康结果的差异，以及全球公认的“药物优先”的疾病治疗方法。\n\n数据的爆炸式增长通过实现以数据为导向的智能方法推动了人工智能的发展。过去五年对医疗保健领域的颠覆尤为显著，数据驱动的人工智能应用不仅帮助智能系统预测、诊断和管理疾病，还能主动逆转和预防疾病——并实现了数字疗法。\n\
  \n图像识别和分类方面的最新进展也开始渗透到工业领域，深度神经网络在视觉识别任务中取得了显著成功，通常能达到或超越人类的表现（图 1-2）。\n\n![../images/459335_2_En_1_Chapter/459335_2_En_1_Fig2_HTML.jpg](img/459335_2_En_1_Fig2_HTML.jpg)\n\
  \n图 1-2\n\n人工智能及其发展\n\n人工智能的类型也可以根据其能执行的任务来解释，并分为弱人工智能和强人工智能。\n\n### 弱人工智能\n\n弱人工智能或狭义人工智能指的是执行单一（狭义）任务的人工智能。弱人工智能系统不像人类，但如果经过正确训练，会显得很智能。一个例子是国际象棋游戏，其中所有规则和走法都由人工智能计算，并确定所有可能的场景。\n\
  \n### 强人工智能\n\n强人工智能能够像人类一样思考和执行任务。目前还没有突出的强人工智能实例。弱人工智能有助于构建强人工智能系统。\n\n## 什么是机器学习？\n\
  \n机器学习这个术语归功于 IBM 的阿瑟·塞缪尔，他在 1959 年提出，或许可以教会计算机学习它们需要了解的关于世界的一切，以及如何自行执行任务。机器学习可以被理解为人工智能的一种形式。\n\
  \n机器学习诞生于模式识别以及计算机无需编程即可学习执行特定任务的理论。这包括贝叶斯方法、神经网络、归纳逻辑编程、基于解释的自然语言处理、决策树和强化学习等技术。\n\
  \n拥有硬编码知识库的系统通常会在新环境中遇到困难。某些困难可以通过能够自行获取知识的系统来克服。这种能力被称为机器学习。这需要知识获取、推理、更新和优化知识库、获取启发式知识等等。\n\
  \n机器学习将在第 3 章中更深入地介绍。\n\n## 什么是数据科学？\n\n所有人工智能任务都会使用某种形式的数据。数据科学是一门不断发展的学科，涵盖与数据清洗、提取、准备和分析相关的所有内容。数据科学是一个通用术语，指代试图从数据中提取洞察（即试图理解）和信息时所使用的一系列技术。\n\
  \n数据科学这个术语由威廉·克利夫兰于 2001 年提出，用以描述一门将统计学、商业和计算机科学更紧密结合在一起的学科。\n\n从事人工智能项目的团队无疑会与数据打交道，无论数据量大小。在大数据的情况下，实时数据通常需要实时分析。在大多数商业案例中，需要数据科学家或数据工程师来执行许多与数据相关的技术角色，包括查找、解释和管理数据；确保数据的一致性；使用数据构建数学模型；以及向利益相关者展示和传达数据洞察/发现。虽然没有数据科学就无法处理大数据，但可以在没有大数据的情况下进行数据科学——所需要的只是数据。\n\
  \n由于数据探索需要统计分析，许多学者认为数据科学和统计学没有区别。一个数据科学团队（即使只有一个人）对于成功部署项目至关重要。\n\n数据科学团队通常扮演两个关键角色。首先，从一个问题或疑问开始，试图用数据来解决它；其次，利用数据通过分析来提取洞察和智能（图\
  \ 1-3）。\n\n![../images/459335_2_En_1_Chapter/459335_2_En_1_Fig3_HTML.jpg](img/459335_2_En_1_Fig3_HTML.jpg)\n\
  \n图 1-3\n\n数据科学流程\n\n\n\n## 从实时大数据中学习\n\n人工智能此前一直受限于其可用的技术和数据。在智能手机和更廉价的计算设备爆发之前，数据集在规模、有效性以及代表性（而非实时性）方面仍然有限。\n\
  \n如今，我们拥有实时、可即时访问的数据和能够进行快速分析的工具。现代生活的数据化正在推动机器学习的成熟，并促进向基于证据、数据驱动的方法转变。数据化指的是将生活的方方面面数字化（或数据化）的现代趋势。如今的技术已经足够敏捷，能够访问这些庞大的数据集，以快速演进机器学习应用。\n\
  \n患者和医疗专业人员都会产生海量数据。手机收集诸如血压、地理位置、步行步数、营养日记等指标，以及其他非结构化数据，如对话、反应和图像。\n\n这些数据也不仅仅是数字或临床数据。数据提取技术可以应用于纸质文档或扫描的图像，以处理这些文档用于综合分析和检索。\n\
  \n医疗专业人员收集健康生物标志物以及其他结构化指标。无论数据来源如何，为了进行学习，数据必须转化为信息。例如，当一位糖尿病患者将血糖读数输入应用程序时，如果系统已知血糖水平目标范围，就能理解该输入是否达到了建议的目标范围，这样该输入就具有了更大的相关性。\n\
  \n在二十一世纪，几乎每一个行为都会留下某种形式的交易足迹。苹果 iPhone 6 的速度比阿波罗时代将人类送上月球的 NASA 计算机快 32,000 倍以上。事实上，一个简单的\
  \ Wi-Fi 路由器甚至一个 USB-C 充电器，其计算能力都足以将宇航员送上月球 [13]。设备不仅比以往任何时候都更小巧，而且也比以往任何时候都更强大。随着各组织利用大数据源，已经出现了一种趋势，即将从数据中获得的洞察嵌入到用户体验的方方面面——从购买产品或服务，到应用程序内的用户体验，并以多种不同方式进行交互。\n\
  \n当数据以其原始形式被获取并转化为能够改变实践的知识时，数据的价值才得以体现。这种价值由项目和具体情境驱动。例如，其价值可能体现在更快地识别出在依从性、合规性和循证护理方面的不足。也可能体现在医院或组织内部更好地共享数据和洞察，或者与患者建立更个性化的关系，以提高依从性和合规性，并促进自我护理。同样，它也可能有助于避免更昂贵的治疗或代价高昂的错误。\n\
  \n## 人工智能在医疗保健中的应用\n\n人工智能代理完全取代医生和护士的可能性极低，但机器学习和人工智能正在改变医疗保健行业并改善治疗效果。而且这一趋势将持续下去。\n\
  \n机器学习正在改进诊断、预测结果，并开始触及个性化护理的皮毛（图 1-4）。\n\n![../images/459335_2_En_1_Chapter/459335_2_En_1_Fig4_HTML.jpg](img/459335_2_En_1_Fig4_HTML.jpg)\n\
  \n图 1-4\n\n一种数据驱动的患者-医疗专业人员关系\n\n想象一下这样一个场景：你因心脏周围疼痛去看医生（或通过远程会议应用程序）。在听取了你的症状（可能通过视频或健康物联网设备分享）后，医生将其输入电脑，电脑会调出医生应参考的最新证据库，以便有效诊断和治疗你的问题。你做了核磁共振扫描，一个智能计算机系统协助放射科医生检测任何可能因太小而无法被人眼察觉的异常。他们甚至可能建议使用特定的智能手机应用程序，配合你佩戴或可使用的设备，来测量心脏指标和多种潜在健康状况的风险。\n\
  \n你的手表可能一直在持续收集你的血压和脉搏，而一个连续血糖监测仪则实时记录你的血糖读数。你的戒指可能正在测量你的体温。最后，你的医疗记录和家族病史由一个计算机系统进行评估，该系统会为你精确推荐治疗方案。撇开数据隐私和治理不谈，我们从整合不同数据池中能学到什么，其前景令人兴奋。\n\
  \n### 预测\n\n已有技术可以监测数据以预测疾病爆发。这通常利用实时数据源（如社交媒体）以及来自网络和其他来源的历史信息来完成。通过分析降雨量、温度、病例数等各种数据点，已使用人工神经网络（ANNs）成功预测了疟疾爆发\
  \ [14]。\n\n### 诊断\n\n许多数字技术为非紧急医疗系统提供了替代方案。展望未来，将基因组与机器学习算法相结合，为学习疾病风险、改进药物遗传学以及为患者提供更好的治疗路径提供了机会\
  \ [15]。\n\n### 个性化治疗与行为矫正\n\n数字疗法是数字健康的一个新兴领域。数字医疗保健可以根据用户体验进行个性化设置，以促使人们做出可持续的行为改变\
  \ [16]。\n\n来自 Diabetes Digital Media 的数字疗法 Gro Health 是一个屡获殊荣、基于证据的行为改变平台，它通过解决健康的四个关键支柱（可改变的风险因素）来应对非传染性疾病。在营养、活动、睡眠和心理健康领域的教育和支持由人工智能驱动，以根据用户目标与关注点、疾病概况、种族、年龄、性别和地理位置来定制体验，并在人口健康管理中提供远程监测支持。该应用程序提供个性化教育和集成健康追踪，从用户自身及更广泛社区的进展中学习。\n\
  \n在 8 周结束时，Gro Health 显示出心理健康的改善，包括感知压力在 8 周内降低 23%，广泛性焦虑降低 32%，抑郁降低 31% [17]。\n\
  \n### 药物发现\n\n机器学习在初步药物发现中具有多种潜在用途，从药物化合物的初步筛选到基于生物因素预测成功率。这包括像下一代测序这样的研发发现技术。\n\
  \n药物在外观上不一定必须是药理学的。数字疗法的使用和真实世界患者数据的聚合，正在为那些曾被认为是慢性和进行性的疾病提供解决方案。例如，超过 30 万 2 型糖尿病患者使用的\
  \ Low Carb Program (LCP) 应用程序，在完成该计划一年的患者中，有 26% 实现了病情缓解 [16, 18]。\n\n\n\n### 后续护理\n\
  \n患者再次入院是医疗保健领域的一大难题。医生和政府都在努力维持患者的健康，尤其是在患者接受医院治疗后返回家中时。数字健康教练能够辅助护理，类似于电商网站上的虚拟客服代表。这些助手可以询问患者的用药情况，提醒他们服药，询问他们的症状，并将相关信息传达给医生[16]。在印度等一些地方，存在一种“管家”或精通技术的健康教练的市场，他们为老年人或行动不便的患者建立数字护理。通过设置\
  \ Zoom 通话或其他服务，这些管家使患者能够与他们的医疗团队互动，消除了过程中的任何惰性。\n\n## 释放人工智能在医疗保健领域的潜力\n\n要让人工智能和机器学习在医疗保健系统中得到全面接受和整合，必须解决几个关键挑战。\n\
  \n### 理解差距\n\n利益相关者对人工智能和机器学习的理解与其应用之间存在巨大差距。思想、方法和评估的沟通对于推动人工智能和机器学习在医疗保健领域发展所需的创新至关重要。数据，包括数据的共享和整合，是推动医疗保健向实现精准医学转变的基础。\n\
  \n培养专注于从数据中学习的数据科学团队，是成功医疗战略的关键。所需的方法是投资于数据。为患者和医疗服务提供者双方提升价值都需要数据，因此也需要数据科学专业人士。\n\
  \n### 数据碎片化\n\n有许多障碍需要克服。目前数据是碎片化的，难以整合。患者在手机、Fitbit 和手表上收集数据，而医生则收集常规的生物标志物和人口统计数据。在患者的整个就医过程中，这些数据从未被整合过。也不存在能够以有意义且稳健的方式解析和分析这组更大数据集的基础设施。此外，电子健康记录（EHR）目前在各数据库中仍然混乱且碎片化，需要以一种方便患者和医疗服务提供者随时获取的机制进行数字化。\n\
  \nCOVID-19 无疑加速了数据源的连接；然而，朝着实现一个真实、有用的数据结构（Data Fabric）的进展仍处于初期阶段。数据结构是指一个包含架构、技术和服务在内的统一环境，旨在帮助组织进行管理并改进决策。例如，某个特定国家的健康数据结构可能允许所有人通过一个通用途径访问与患者相关的所有健康数据。\n\
  \n尽管这听起来像乌托邦，但大多数健康应用和服务都使用安全的、基于云的托管提供商，如亚马逊云服务（AWS）、微软 Azure 云和谷歌云。供应商之间为创建数据结构而进行的连接，可能比我们想象的更近。\n\
  \n### 适当的安全性\n\n与此同时，组织面临着安全挑战以及满足政府法规的要求，特别是在患者数据管理以及确保其随时可访问性方面。此外，许多医疗机构使用的是旧版软件，这些软件更容易受到攻击。英国国家医疗服务体系（NHS）的数字基础设施曾因勒索软件“WannaCry”的肆虐而瘫痪。这种源自美国的勒索软件加密了计算机上的数据，并要求支付\
  \ 300 至 600 美元以恢复访问权限[19]。\n\n英格兰和苏格兰的医院及全科医生诊所是遭受此次“勒索软件”攻击的超过 16 个医疗服务组织中的一部分。此次攻击的影响不仅仅是技术故障的成本；它还影响了患者的生命。英格兰部分地区的医生诊所和医院不得不取消预约并拒绝手术。在一些地区，人们被建议仅在紧急情况下寻求医疗护理。NHS\
  \ 只是众多因黑客工具而瘫痪的全球组织之一；该勒索软件声称已感染了 150 个国家的计算机。\n\n在 COVID-19 期间，NHS 因拒绝苹果和谷歌的 COVID-19\
  \ 追踪方案，转而自行开发存在严重安全缺陷的方案而受到嘲笑[20]。\n\n无论数字技术还是其他技术，安全性和可靠性都是健康技术的首要考虑因素。\n\n###\
  \ 数据治理\n\n数据安全引出了数据治理的概念。医疗数据是个人化的，不易获取。人们普遍认为，出于隐私考虑，公众不愿分享他们的数据。然而，Wellcome 基金会一项关于英国公众对商业获取健康数据态度的调查发现，17%的人永远不会同意将其匿名数据与第三方共享[21]。\n\
  \n遵守多套法规意味着灾难恢复和安全性至关重要，而网络基础设施在确保满足这些要求方面发挥着关键作用。\n\n医疗机构需要实现网络基础设施的现代化，以确保它们做好充分准备，提供尽可能最好的患者护理。\n\
  \n在 COVID-19 期间，一些医疗机构能够联系到患者。这听起来可能很简单，但它改变了全世界的护理模式[22]。\n\n医疗专业人员认为，如果看到医疗数据，就有义务采取行动。这导致他们不愿查看可识别身份的患者数据，尤其是在非工作时间。因此，对于患者给其医疗团队发送电子邮件这一行为，能够收到回复这一事实改变了护理服务的提供方式。COVID-19\
  \ 使得每个人在自己的时间内完成任务变得可以接受——将期望从基于时间转变为基于任务。\n\n### 偏见\n\n学习的一个重大问题是偏见。随着人工智能日益融入我们的日常生活——与我们在家、工作和路上的经历相结合——我们必须质疑机器为何以及如何做它们所做的事情。在机器学习中，学会学习会基于先前的经验产生自身的归纳偏差。本质上，系统可能会根据其所接触的数据环境而产生偏见。\n\
  \n直到算法在真实环境中被使用时，人们才会发现其内置的偏见，而这些偏见往往通过现实世界的互动被放大。\n\n这加速了对更透明算法的日益增长的需求，以满足药物开发和预期方面的严格规定。透明度不是唯一的标准；确保决策无偏见以完全信任其能力至关重要。人们通过能够看透“黑箱”并理解机器结论背后的因果推理而获得信心。\n\
  \n偏见可能导致健康不平等。可怕的是，有些偏见只有在偶然、反思和/或灵感出现时才会显现。\n\n直到 2020 年，伦敦大学圣乔治学院的一名医学生才编写了一本基于黑人和亚洲人肤色的医学诊断手册，因为此前没有使用非白人肤色的此类手册[23]。\n\
  \n## 软件\n\n传统的人工智能系统是用 Prolog、Lisp 和 ML 开发的。如今，大多数机器学习系统都是用 Python 编写的，因为机器学习的许多数学基础都可以作为库使用。\n\
  \n能够“学习”的算法可以用大多数语言开发，包括 Perl、C++、Java 和 C。这将在后续章节中更深入地讨论。\n\n\n\n## 结论\n\n机器学习在医疗保健领域的潜在应用广阔且令人振奋。其中一些已在传统医疗服务中初现端倪，但未来才刚刚开始。\n\
  \n能够帮助我们逆转疾病、检测癌症风险、并根据实时生物标志物建议用药方案的智能系统，目前仍各自独立存在。人工智能的潜力是无限的——尤其是当各类服务被统一整合，形成无处不在的数据网络时。这将改变任何行业，但健康从未像现在这样重要。年龄、肥胖和种族已被证明是\
  \ COVID-19 期间的关键风险因素[24, 25, 26]。从未有过比现在更好的理由去好好生活。为老年人群、肥胖人群以及通常被认为“难以触及”的人群提供个性化数字治疗，才能真正改变医疗保健格局。\n\
  \n与此同时，这也带来了巨大的责任和更广泛的道德问题。我们尚未完全理解能从健康数据中学到什么。因此，学习的伦理是一个需要深思的基本议题。\n\n基于智能系统能够检测疾病风险这一前提，系统是否应该告知患者它正在追踪即将发生的结果？如果一种算法能根据你的血糖和体重测量值检测出胰腺癌（一种通常致命的疾病）的风险，那么向相关患者披露这一信息是否符合伦理？如此敏感的患者数据是否应该与医疗团队共享——而这样做又会带来哪些意想不到的后果？\n\
  \n数字连接设备的激增和机器学习的应用，正在使这些曾经未来主义的概念成为现实，而围绕这些话题的讨论是取得进展的关键。\n\n如果患者选择不共享数据，那么基于已知数据进行归纳以预测相同的疾病风险，这在伦理上是否可行？如果我不接受胰腺癌检查就无法获得人寿保险，又该怎么办？使用个人数据涉及相当大的隐私问题，什么应该保密、什么不应该，以及哪些数据有用，都是问题。\n\
  \n毋庸置疑，可用的数据越多，做出的决策就越精确——但究竟多少才算过多，则是另一个问题。驱动因素在于确定数据的价值。\n\n目前，人工智能的伦理缺乏关于如何管理这一巨大数据与机会宝库的重要指南、法规或参数。\n\
  \n许多人认为人工智能具有客观性，使其超越道德问题，但事实并非如此。人工智能算法的公平性和无偏见程度，完全取决于其从环境数据中学习的内容。正如社会关系、政治和宗教信仰以及性取向可以从数据中揭示一样，健康数据的学习也正在揭示新的伦理困境，有待深思。\n\
  \n在国家和国际层面，数据治理和此类数据的披露仍然需要政策支持。未来，无人驾驶汽车将能够实时利用海量数据，预测发生碰撞时的生存概率。如果系统选择谁生谁死，或者医生根据两位患者的\
  \ Apple Watch 读数来决定治疗谁，这符合伦理吗？人们又该在哪里接受医疗服务——是在当地诊所或医院，还是在当地外卖店、超市或便利店？\n\n这仅仅是个开始。\n\
  \n随着技术的发展，新的、改进的治疗方法和诊断手段将拯救更多生命，治愈更多疾病。当循证医学的未来建立在数据和分析之上时，这就引出了一个问题：是否会有足够的数据？即使如此，人们也不禁要问，收集这些数据的后果究竟是什么。\n\
  \n"
- "# 2. 数据\n\n> *轶事的复数形式就是数据。*\n> \n> ——雷蒙德·沃尔芬格\n\n数据无处不在。全球性的颠覆和国际倡议正在推动数据化。数据化指的是将生活的方方面面数字化（或数据化）的现代趋势[27]。这种数据的产生正在将数据转化为新的、潜在有价值的形式。整个城市都在被激励着变得更加智能。在不久的将来，我们的城镇将实时收集数千个变量，以优化、维持和提高全体居民的生活质量。随着人机交互进一步融入智能护理，这些数据甚至可能连接到你的亚马逊或谷歌账户，并了解我们健康和日常生活中的所有重大事件。\n\
  \n人们有理由期待，除了管理交通，交通灯可能还会收集其他数据，例如空气质量、能见度和交通速度。人们不禁要问，一张超速罚单是否可以根据某人智能手表上的温度或智能戒指上的平均心率来提出异议。\n\
  \n数据无处不在。可能性是无限的。来自互联设备、嵌入式传感器和物联网的大数据，推动了全球对数据分析、解读和可视化的需求。COVID-19 本身就是一个国家与临床医生之间数据共享的绝佳范例——尤其是在关于新型冠状病\
  \ du 的风险因素、合并症和并发症方面。\n\n\n\n## 什么是数据？\n\n数据本身可以呈现多种形式——字符、文本、词语、数字、图片、声音或视频。每一条数据都归属于两大主要类型：结构化数据和非结构化数据。\n\
  \n从本质上讲，数据是一组定性或定量变量的值。要成为信息，数据需要经过解读。信息是经过组织或分类的数据，对接收者而言具有某种（或多种）有意义的价值。信息是经过处理的数据，决策和行动应以此为基础。\n\
  \n医疗保健领域正在经历一场数据革命，这得益于两大巨变：一是需要控制日益增长的成本压力，这催生了新的激励机制和报销结构；二是数字健康，它通过数字设备和创新技术赋予人们力量，使医疗保健变得大众化。\n\
  \n临床趋势正在发生变化。社交媒体的兴起，以及通过互联网和健康社区即时获取信息，意味着患者对自己的健康状况了如指掌。患者不断生成数据，并希望拥有这些数据，且能在不同服务之间传输数据。与此同时，循证医学正以基于证据的决策方法为导向，追求个性化护理。\n\
  \n患者和医疗保健专业人员都强烈渴望获取所有可用的临床数据，以便根据当前证据做出更有效的治疗决策。2019 年 Diabetes.co.uk 的一项研究表明，三分之一的患者希望与他们的医疗保健专业人员共享数据，但只有五分之一的患者能够做到这一点[9]。\n\
  \n将个体数据集汇总到更大的人群中也能提供更有力的证据，因为亚群体中的细微差别可能不常见，以至于在小样本中不易显现。例如，汇总患有心血管疾病和高血压的患者数据，可能比单独的数据集更能可靠地揭示高胆固醇等健康状况。\n\
  \n在现代医疗保健中融入数据，为众多领域的重大改进提供了机会。随着医学向循证和个性化方向发展，数据可用于改善：\n\n*   患者和人群的健康状况\n*   患者教育和参与度\n\
  *   疾病和护理风险的预测\n*   用药依从性\n*   远程监控\n*   疾病管理\n*   疾病逆转/缓解\n*   治疗的个体化和个性化\n*  \
  \ 以及护理\n*   财务、交易和环境方面的预测、规划及准确性（尤其与医疗保健组织内的运营和财务团队相关）\n*   用户体验，可用于加速上述所有事项\n\n\
  数据促进信息。信息驱动洞察，洞察则引领做出更优决策。\n\n## 数据类型\n\n结构化数据通常指存储在数据库中的数据——其结构遵循某种模型或模式。几乎每个组织都会熟悉这种数据形式，并且可能已经在有效使用它。例如，大多数组织至少会将某种形式的数据存储在\
  \ Excel 电子表格中。在临床环境中，电子健康记录（EHR）也可能采用类似的结构化形式。\n\n来自嵌入式传感器、智能手机、智能手表和物联网设备的读数通常是结构化数据的形式——无论是提供血糖读数、步数、卡路里消耗、心率还是血压。\n\
  \n结构化数据类似于机器语言。其格式高度组织化，便于进行简单、直接的搜索和信息检索操作。为此，结构化数据通常存储在关系数据库中。\n\n非结构化数据指的是其他所有数据。非结构化数据没有预定义的模型或模式。非结构化数据内部没有可识别的结构，这给查询和信息检索带来了问题。电子邮件、短信、Facebook\
  \ 帖子、Twitter 推文以及其他社交媒体帖子都是非结构化数据的典型例子。非结构化数据可以释放出信息和洞察的宝库。\n\nGartner 报告指出，未来 5\
  \ 年数据量将增长 800%，其中 80%的数据将以非结构化数据的形式存在[29]。\n\n非结构化数据带来的问题是数据量庞大。缺乏结构使得编译和解读成为一项耗费时间和精力的资源密集型任务。任何组织都将受益于非结构化数据分析机制，以减少非结构化数据带来的资源成本。除非对数据有充分理解，否则可能需要领域专家的参与。\n\
  \n传统上，由于非结构化数据原始且无组织的形式，结构化数据比非结构化数据更容易分析。然而，随着数据科学和机器学习方法（如自然语言处理（NLP））的使用，非结构化、非正式数据集的分析能力正在提高，这些方法有助于理解和分类情感倾向。\n\
  \n将非结构化数据转换为结构化模型可能并不总是可行的。例如，通过电子邮件或通知传输的信息，其发送时间、主题和发件人作为统一字段存在。然而，消息的内容却不容易被解析和分类。\n\
  \n半结构化数据介于结构化数据和非结构化数据之间。半结构化数据不一定符合与关系数据库或数据表相关的数据模式的正式结构。然而，半结构化数据可能包含标签或标记，用于分隔语义元素，并在数据内强制执行记录和字段的分组。\n\
  \n诸如 JSON（JavaScript 对象表示法）和 XML（可扩展标记语言）之类的语言都是半结构化数据的形式。两者在促进数据交换方面都发挥了重要作用。\n\
  \n数据是智能系统学习的燃料，是成功实现人工智能最关键的部分。\n\n数据分为五个来源：\n\n*   网络和社交媒体数据：点击、历史记录、健康论坛\n*  \
  \ 机器对机器数据：传感器、可穿戴设备\n*   大型交易数据：健康索赔数据、账单数据\n*   生物识别数据：指纹、基因、来自可穿戴设备的生物标志物\n* \
  \  人类生成的数据：电子邮件、纸质文档、电子病历\n\n在考虑典型的 Excel 电子表格以及机器学习领域时，以下定义也很有用：\n\n*   实例：单行数据或观测值。\n\
  *   特征：单列数据。它是观测值的一个组成部分。\n*   数据类型：指特征所代表的数据种类（例如，布尔型、字符串型、数值型）。\n*   数据集：用于训练和测试机器学习模型的实例集合。\n\
  *   训练数据集：用于训练机器学习模型的数据集。\n*   测试数据集：用于确定机器学习模型准确性/性能的数据集。\n\n\n\n## 大数据\n\n大数据这一术语指的是海量的、传统的和数字化的数据集合，这些数据是发现和分析的源泉。\n\
  \n大数据是一个流行术语，它定义了那些过于庞大、无法在传统关系数据库系统中存储和处理的数据集。从这个意义上说，大数据这个术语是模糊的——虽然规模无疑是大数据的一部分，但仅凭规模并不能完全说明大数据为何真正“大”。\n\
  \n通过大数据分析，我们可以发现隐藏的模式、未知的关联、趋势和偏好，以及其他有助于利益相关者做出更明智决策的信息。机器学习提供了一套技术工具箱，正是为了这个目的而应用于数据集。\n\
  \n大数据最早由 Laney 在 2001 年描述，其具有以下特征，也称为“三 V”（图 2-1）[30]：\n\n![../images/459335_2_En_2_Chapter/459335_2_En_2_Fig1_HTML.jpg](img/459335_2_En_2_Fig1_HTML.jpg)\n\
  \n图 2-1\n\n数据的三个 V\n\n*   **容量**：生成和存储的数据量。大数据通常容量很大。数据的庞大规模本身就带来了存储、索引和检索方面的复杂性。\n\
  \n*   **多样性**：大数据在数据类型和性质上多种多样，需要高效的存储和分析，以及处理此类数据的系统。\n\n*   **速度**：大数据以一定的速度被接收，这带来了其自身的要求和挑战。\n\
  \n数据科学界讨论大数据的“三 V”已有一段时间。然而，还有另外两个数据方面需要考虑，它们可能比大数据的“三 V”更重要：数据真实性和数据价值的概念。Mark\
  \ van Rijmenam 提出了另外四个 V，以进一步理解大数据极其复杂的本质 [31]。\n\n更进一步，总共有十个 V（图 2-2）[32]。实际上，组织在制定数据策略时，需要牢记不同的\
  \ V 子集。\n\n![../images/459335_2_En_2_Chapter/459335_2_En_2_Fig2_HTML.jpg](img/459335_2_En_2_Fig2_HTML.jpg)\n\
  \n图 2-2\n\n数据的十个 V\n\n这里包含了目前提出的众多 V 中的一个子集。\n\nGartner 对 199 名成员进行的一项调查显示，对大数据的投资正在增加；但调查也显示出增长放缓的迹象，未来有意投资大数据计划的公司减少了。只有\
  \ 15% 的企业报告称已部署其大数据项目，这表明采用曲线仍在成熟中，对人才和专业知识的市场需求很高 [33]。\n\n患者和医生正在推动大数据的采用。患者通过临床数据、可穿戴设备、移动健康应用程序以及远程医疗/远程医疗服务来驱动数据。与此同时，医生则留下了临床数据（如书面记录、影像和保险数据）、患者记录和机器生成的数据。\n\
  \n### 容量\n\nLaney 在 2001 年定义了大数据的第一个关键特征，即第一个 V——即数据量很大的命题。\n\n历史上，大数据采用的主要障碍一直是对存储的相关需求及其相应成本。数据中心从本地托管转向云端，消除了这一担忧。更棒的是，它还带来了好处——主要是安全性和可扩展性。这显著降低了存储成本，同时在数据存储、协作和灾难恢复方面提供了灵活性。云，或云计算，指的是通过互联网提供的分布式计算。\n\
  \n摩尔定律不仅影响了存储容量，也降低了成本。摩尔定律是英特尔联合创始人戈登·摩尔在 1965 年提出的一个论断。摩尔指出，集成电路上可容纳的晶体管数量大约每\
  \ 18 个月翻一番。1981 年，1 GB 存储的价格是 30 万美元。2004 年，这个价格是 1 美元；2010 年则是 0.10 美元。如今，1 GB\
  \ 的云存储每月租金为 0.023 美元，并且第一年存储免费 [34]。\n\n医疗保健领域，无论是通过公共卫生服务、政府、制药组织还是企业提供，对大数据都不陌生。数据以数字和非数字形式持续收集，涵盖各种患者、行为、流行病学、环境和医疗信息。\n\
  \n数据被消费、管理和生成，用于患者护理、交易记录、研究、合规、流程和监管要求。\n\n截至 2020 年，患者的电子健康记录还不能以安全透明的方式通过数字手段轻易获取。许多组织正努力将这些信息放在区块链上，通过创建去中心化的网络系统，彻底改变健康数据的访问方式。\n\
  \n患者和医疗保健组织正在其环境中采用智能手机、可穿戴设备（如智能手表和健身追踪器）、家庭传感器、智能个人助理和社交网络。数据丰富、可访问且被认为是可靠的。然而，目前大多数医疗保健提供者并未使用这些数据，这凸显了以下几点：\n\
  \n*   患者数据的生成发生在医疗保健系统之外。\n*   患者生成的数据需要在更广泛的患者记录或健康时间线中进行整合和探索。\n*   患者数据超越了医学指标，扩展到更全面的指标，包括行为和环境健康。\n\
  *   医疗保健组织仍有巨大的兴趣，有待从机会和成本效益中实现。\n\n英国最近的一项倡议通过使用社交媒体标签 `#facesofdiabetes` 和 `#letstalk`，对儿童\
  \ 1 型糖尿病的患病率进行了地理映射。用户的情感也被分析，并通过使用机器学习工具对帖子类型进行分类，向用户提供了适当的支持 [35]。\n\n由人产生的数据及其近乎实时的使用，是实现个性化护理的圣杯。数据化在金融、能源和零售领域已全面展开。随着健康可穿戴设备和移动医疗的普及，每个个人和组织都有潜力利用这一不断增长的数据量。\n\
  \n#### 应对数据容量\n\n为了让大数据为您的组织发挥作用，存储的高效性和成本效益至关重要。选择最合适的存储解决方案取决于以下几个因素：\n\n*   **方法**：数据存储成本随存储需求增加而增加。因此，确定是收集特定数据还是采用“一网打尽”的方法，取决于项目和监管要求。低成本的云存储提供商使“一网打尽”的方法变得可行。数据科学和机器学习的初学者可能希望为简化起见，确定一组用于评估的关键数据指标。\n\
  *   **数据类型**：考虑存储的是结构化数据还是非结构化数据，以及数据来源——例如，音频或视频内容、文本、图像等。与文本相比，视频、音频或图像存储需要更多资源。\n\
  *   **部署**：确定解决方案将如何部署，可能包括本地部署、内部部署或基于云的部署。\n*   **访问**：确定解决方案将如何被访问——通过应用程序、Web\
  \ 界面、内联网等。\n*   **运维**：这包括数据结构、架构、归档、恢复、事件日志记录和法律要求。\n*   **未来用途**：这涉及为未来的数据源、系统扩展以及潜在的未来用例进行规划。\n\
  \n数据集的分布式特性意味着，此前大数据采用中的障碍通常指的是此类系统的碎片化性质。\n\n\n\n### 多样性\n\n数据的第二个“V”是多样性。这不仅指数据类型的多样化，还包括数据来源和用例的多样化。二十年前，我们通常以电子表格和数据库的形式存储数据。如今，数据可能以照片、传感器数据、推文、加密文件等形式存在。这种非结构化数据的多样性给数据的存储、挖掘和分析带来了挑战。这也是机器学习能够显著帮助人类的一个领域。\n\
  \n数据以结构化数据（如临床记录和结果）、非结构化数据（如通信和交互数据）以及半结构化数据（如带有书面注释的 X 光片）的形式存在。\n\n服务日益增长的数字化趋势，以及可穿戴设备和网络物理设备的广泛采用，正不断为发现和分析提供令人兴奋的新数据源。这使得能够创建由传感器数据、临床记录、通信与互动、人口统计以及账单记录驱动的新型风险模型——这些模型可以做出准确的预测，并节省宝贵的时间和资源。\n\
  \n#### 物联网\n\n物联网指的是智能互联设备和传感器的种类及其产生的数据量正在迅速增长（图 2-3）。\n\n![../images/459335_2_En_2_Chapter/459335_2_En_2_Fig3_HTML.jpg](img/459335_2_En_2_Fig3_HTML.jpg)\n\
  \n图 2-3\n\n物联网的演进\n\n数据在设备、服务以及最终在人与人之间传输。你可能还听说过类似术语，如工业物联网和医疗物联网，它们分别指代物联网中的特定垂直领域或行业。\n\
  \n如今，各种设备监测着患者方方面面的行为——从血糖监测仪到胎儿监护仪，再到心电图和血压监测仪。这些测量中的许多都需要后续的医疗专业人员随访。\n\n更智能的监测设备与其他设备、服务和系统进行通信，可以极大地优化这一过程，可能减少直接临床干预的需求，甚至用护士的一通电话来替代。当前智能设备的创新包括能够检测药物是否已被服用的智能药盒——通过蓝牙进行数据传输。如果确定用户未服药，则会通过电话联系他们，讨论并鼓励其坚持服药方案。还有用于检测皮肤癌和提供尿液分析服务的应用程序。物联网带来了大量机遇，不仅能改善患者护理，还能同时降低医疗成本。\n\
  \n大数据的多样性既包括传统数据源，也包括较新的结构化和非结构化数据源。随着数据多样性的增长，部署在医疗领域的算法和机器学习工具所能实现的潜力也在增长。\n\n\
  与数据源的多样性一样，大数据的多样性可以表现为以下几种形式：\n\n*   数据类型：文本、数字、音频、视频、图像等。\n*   功能：用例和用户需求。\n*\
  \   数据价值：数据是否适合特定目的？这将是关注数据使用背景下的质量。更多的数据并不一定意味着更好的数据。\n\n正如存在多样化的数据源、价值、类型和用例一样，数据也有多样化的应用。这些包括访问点（即\
  \ Web、移动端、SaaS [软件即服务]，有时也称为 MDaaS [医疗设备即服务]、API [应用程序编程接口]）和用户（通常是人或机器）。\n\n数据多样性正在呈指数级增长。随着新的医疗物联网设备的发展，从噪声中识别出有用的数据特征将变得至关重要。\n\
  \n#### 遗留数据\n\n遗留数据，无论是基于计算机的还是非基于计算机的，也可以用于你的项目中。越来越多的服务支持数字化，用于自然语言处理或分类目的。通过使用遗留数据，利益相关者可以最大化利用不足的数据中的洞察。遗留数据，或称传统数据，也可能被称为小数据，本章稍后会讨论。\n\
  \n通常，遗留数据是零散且不完整的，尤其是对于当今所需的标准而言。例如，许多超过 10 年前的记录可能没有关联的电子邮件地址或正确的电话号码。\n\n\n\n\
  ### 速度\n\n大数据的第三个 V 是速度，指数据创建、存储以及为分析和可视化做准备的速度。数据速度对底层计算机硬件基础设施提出了独特的要求。\n\n云计算的一个优势在于能够快速存储和处理通常会使传统服务器不堪重负的大数据量和大数据种类。由于在存储和成本方面具有灵活性，云计算成为大数据项目的首选途径。云提供商可以存储\
  \ PB 级的数据，并根据需求实时扩展数千台服务器。或许更有价值的是，计算能力也价格低廉且易于分配。\n\n2010 年海地地震后，与传统方法相比，Twitter\
  \ 数据是检测和追踪致命霍乱爆发的更快捷方式。随后的一项研究确定，在检测霍乱进展的速度和准确性方面，社交媒体平台优于官方的疾病流行监测方法[36]。\n\n在大数据时代，数据是实时或近乎实时创建的。网络物理设备、嵌入式传感器和其他设备的普及意味着，除了\
  \ MAC 地址和互联网接入外，数据可以在创建的那一刻进行传输。\n\n数据创建的速度是难以想象的。人们普遍认为，过去两年生成的数据比从时间开始到那时为止创建的数据还要多[37]。组织面临的挑战是应对数据实时创建和消费的巨大速度。\n\
  \n随着可穿戴设备和传感器的普及，它们在临床医疗中的应用也将继续增加（图 2-4）。实现最大临床价值的关键在于整合各种异构数据源。\n\n![../images/459335_2_En_2_Chapter/459335_2_En_2_Fig4_HTML.jpg](img/459335_2_En_2_Fig4_HTML.jpg)\n\
  \n图 2-4\n\n可穿戴生物医学传感器\n\n| **类型** | **示例** | **特征** |\n| --- | --- | --- |\n| 患者行为与情绪\
  \ | 社交媒体 智能手机 网络论坛 | 大多数数据是非结构化或半结构化的。数据量大且实时。提供学习、参与和理解的机会。通常是开源的。 |\n| 患者健康数据\
  \ | 传感器 血糖仪 智能手机 健身追踪器 图像 | 由患者拥有。数据通常由设备报告。存储需求通常较低。图像存储需求因所需存储的数据而异。传感器数据速度高。结构化数据便于分类和模式检测。某些项目可能需要数字化。\
  \ |\n| 制药与研发数据 | 临床试验数据 人群数据 | 包含由制药公司、研究机构、学术界和政府拥有的人群和疾病数据。 |\n| 网络健康数据 | 患者门户网站（Diabetes.co.uk）\
  \ 数字干预措施（例如，低碳水计划、Gro Health、低血糖计划） | 有用的元数据。通常由设备报告而非临床报告。 |\n| 临床数据 | 电子健康记录 患者登记册\
  \ 医生数据 图像（扫描等） | 本质上是结构化的。由医疗服务提供者拥有。 |\n| 索赔、成本、管理数据 | 索赔数据 费用数据 | 本质上是结构化的。包含与报销相关的任何数据集。\
  \ |\n| 交易数据 | 健康信息交换 | 可能需要预处理才能成为有用数据。 |\n\n传统的三个 V 让我们得以洞察数据的规模以及这些庞大数据集增长和倍增的快速速度。然而，数据多样性仅仅触及了大数据深度和挑战的表面。\n\
  \n大数据的力量在 2009 年由巨头谷歌得到了最好的证明，当时它通过分析相关的搜索词，能够仅以一天的延迟追踪流感在美国的传播，比美国疾病控制与预防中心（CDC）还要快[38]。\n\
  \n然而，在 2013 年，谷歌流感趋势出错了——这引发了关于数据价值和有效性的质疑[39]。\n\n在临床环境中，数据价值和真实性将占据更重要的位置，因为临床决策是基于数据做出的，关乎生命安危，其影响远不止于交易层面。\n\
  \n### 价值\n\n价值指的是数据的实用性。建立对数据信任的关键在于确保其准确性和可用性。在医疗保健领域，这将通过定性和定量分析来评估。价值可以通过多种因素来界定，主要包括对患者结果或行为改变的临床影响、患者和利益相关者的参与度、对流程和工作流程的影响，以及货币化（成本节约、成本效益等）。\n\
  \n麦肯锡指出，大数据对美国医疗保健的潜在年价值为 3000 亿美元。他们还提到，大数据对欧洲公共部门行政管理的潜在年价值为 2500 亿欧元[40]。\n\n\
  数据的价值来自于对其进行的分析。正是这种对数据的分析使其能够转化为信息，并最终旨在转化为知识。价值在于组织如何使用可用数据，并以信息为中心、以数据为驱动来进行决策。价值不是被发现的，而是被创造出来的。关键在于通过良好的管理，使数据对你的用户和组织具有意义。\n\
  \n谷歌在 2013 年追踪流感症状搜索方面做得非常出色。然而，它无法知道其结果在预测流感流行方面是否有效。至少在这个案例中，谷歌流感趋势并未为此用例提供有价值的结果。雪上加霜的是，谷歌永远无法知道现实世界中的流感病例与搜索分布和频率并不匹配——因此它对此无能为力。也许如果这个项目得以扩展，分析社交媒体帖子在确定流感流行方面可能会更有价值。社交媒体和更广泛的非结构化数据源提供了大量通常未被探索的信息。\n\
  \n识别 2 型糖尿病风险人群、预测心房颤动、协助患者从健康事件中恢复，以及向患者推荐最新的循证医学疗法，这些都是具有明确且有价值投资回报的任务。\n\n\n\n\
  ### 真实性\n\n毫无价值的数据，无论数量多么庞大，始终都是毫无价值的。真实性指的是数据的真实可靠程度，以及数据在其使用情境中（涉及偏差、噪声和异常）是否具有最佳质量和适用性。\n\
  \n多种因素会影响数据的真实性，包括以下方面：\n\n*   **数据录入**：数据是否正确录入？是否存在任何错误或事件？是否有数据录入的审计追踪？\n*  \
  \ **数据管理**：在系统中流转的数据其完整性如何？\n*   **集成质量**：数据是否被恰当地引用、注释，并具有唯一性？\n*   **时效性**：数据是否适合使用？是否及时且相关？\n\
  *   **使用方式**：数据是否以可操作的方式提供？数据是否有助于实现业务目标？使用这些数据是否符合伦理？\n\n可信数据的六个“C”标准有助于评估你用于项目的数据是否具有真实性。确保你的数据集是**干净、完整、最新、一致且合规**的至关重要。\n\
  \n*   **干净的数据**：这是良好数据质量流程（如去重、标准化、验证、匹配和处理）的结果。干净的数据能够基于高质量、无污染的数据做出稳健的决策。干净的数据是用户信任面临的最大挑战。干净的数据是彻底数据准备的产物。\n\
  *   **完整的数据**：这是整合了数据基础设施、技术和流程的结果，能够支持稳健的决策制定。\n*   **最新的数据**：新鲜的数据通常被认为比过时的数据更可靠。那么问题就变成了：数据在什么时候算是不再最新？随着实时、最新数据的增长，从噪声中辨别信号可能成为一项更具挑战性的任务。\n\
  *   **一致的数据**：数据必须保持一致（从而支持机器可读性）。这是系统间交叉兼容性的要求，也适用于元数据。\n*   **合规的数据**：合规性法规可能来自各种来源，例如利益相关者、客户、法律法规，或新政策的出台。尽管存在许多数据基础设施和标准，但数据科学作为一个类别，仍在不断遇到需要治理和立法的全新问题。合规性对内外部利益相关者可能意味着不同的事情。在内部，会有标准来确保数据符合质量、安全和隐私流程。所有利益相关者都需要相信数据是按照内外部规定被访问和分发的。通常，组织可能会设立一个数据和信息治理委员会。\n\
  \n第六个 C 是**协作数据**，指的是围绕数据进行协作，以确保数据管理和业务管理目标保持一致。第六个 C 更多指的是处理数据的方法，而非数据本身。虽然可信数据需要满足所有这六个\
  \ C，但其目的是拥有能够真实反映现实世界、理想情况下没有或只有极少偏差的干净数据。\n\n虽然大多数人都主张临床护理数据应具有完全的真实性，但在现实世界中，面对如此多样化的数据输入，临床护理的黄金标准更难实现。有人会质疑，如果数据尚未被有效利用，为什么还需要添加更多数据。强制执行数据质量可能被认为难以经济高效地实现。在这种情况下，训练一个智能系统来学习估计未见过的参数可能会有所帮助。真实性也可以指确保拥有足够大的训练样本，用于构建丰富的模型和进行验证，从而支持全人群分析。\n\
  \n真实性可以应用于对数据执行的分析，确保这些分析是正确的。不仅数据需要可信，解读数据的算法和系统也需要可信。\n\n如果没有良好的数据科学，数据录入可能成为一个被忽视的风险点。这通常是一个基于人的问题。即使在数据量较小的情况下，人类也会犯错。为了具有临床相关性，数据需要最大程度的真实性。随着数据真实性的提高，基于这些数据的机器学习能够得出更真实的结论。\n\
  \n### 有效性\n\n与大数据的真实性类似，还存在数据有效性的问题，它指的是数据对于其预期用途是否正确和准确。在临床应用中，有效性可能被视为优先考虑的“V”——确保只使用有用且相关的数据。\n\
  \n数据的真实性是绝对的，而有效性是情境相关的。有效的数据能够无偏差地代表现实世界。\n\n### 变异性\n\n大数据是可变的。变异性定义了其含义经常变化的数据。变异性在进行情感分析时非常相关。例如，在一系列推文中，同一个词可能具有完全不同的含义。\n\
  \n变异性经常与多样性混淆。举例来说，一个花商可能出售五种玫瑰。这是多样性。现在，如果你连续两周每天都去那个花商那里买同样的白玫瑰，你会发现每一天的玫瑰在形态和香气上都有细微的差别。这就是变异性。\n\
  \n为了进行正确的情感分析，算法需要能够理解文本的上下文，并能够解读某个词在特定上下文中的确切含义。即使在自然语言处理能力取得进展的情况下，这仍然非常困难。\n\
  \n### 可视化\n\n可视化是八个“V”中的最后一个，指的是对大数据进行适当的分析和可视化，使其变得可读、可理解和可操作。\n\n可视化听起来可能并不复杂；然而，克服可视化复杂数据集的挑战对于利益相关者的理解和项目进展至关重要。通常情况下，数据可视化正是将数据集中学到的知识传递给利益相关者的主要组成部分。\n\
  \n## 海量数据\n\n海量数据这个术语指的是那些包含海量记录的数据集。电子健康档案（EHRs）被认为是海量数据。海量数据集可能是简单的二维关系表。处理海量数据所需的资源超出了简单的电子表格分析，并且由于计算中涉及巨大的矩阵，计算量非常大。\n\
  \n## 小数据\n\n小数据与大数据的直接对比。大数据是分布式的、多样化的、实时的，而小数据则因其格式和体量而具有可访问性、信息性和可操作性。\n\n小数据的例子包括患者病历、处方数据、生物特征测量值、扫描结果，甚至互联网搜索历史。与谷歌和亚马逊等组织和服务相比，其数据量要小得多。\n\
  \n分析学已经经历了由大数据的采用和需求所推动的快速演变。回归传统数据集并应用更现代的技术（如机器学习）不应被忽视，并且是数据科学家起步的好地方。重要的不是数据的大小，而是你用它做了什么。\n\
  \n\n\n## 元数据\n\n元数据是关于数据的数据——即描述每个数据资产或单个数据片段的描述性信息。元数据提供关于单个文件的详细信息，支持从元数据及其所支持的数据中发现模式和趋势。\n\
  \n元数据提供有关文件来源、日期、时间和格式的信息；还可能包含注释或评论。在战略信息管理中投入资源（主要是时间）至关重要，以确保资产按照与集合中其他资产一致的分类法正确命名、标记、存储和归档。这有助于加快数据集链接，并保持资产管理方法的一致性，确保文件易于查找、检索和分发。\n\
  \n大数据的热潮曾让元数据黯然失色。然而，大数据伴随着大元数据，使组织能够生成知识并利用价值。例如，谷歌和 Facebook 使用诸如 Open Graph [41]之类的分类语言，帮助构建更具结构化的网络，从而能够向用户提供更强大、更具描述性的信息。这反过来又为用户提供人性化的结果，优化点击率和转化率。\n\
  \n元数据在任何以数据为主导的项目中都可能非常有用。例如，机器学习算法可以使用属于某段音乐的元数据，而不是（或同时使用）实际音乐本身，来推荐更多相关音乐。音乐的流派、艺术家、歌曲标题和发行年份等特征可以从元数据中获取，以提供相关结果。\n\
  \n## 医疗数据：小型与大型用例\n\n医疗保健利益相关者明白，他们被来自患者、专业人士和交易的海量数据所包围。关键是要知道如何驱动价值并达成关键绩效指标（KPI）。以下是一些令人兴奋的医疗数据用例。\n\
  \n### 预测等待时间\n\n在法国巴黎，组成巴黎公立医院集团（AP-HP）的四家医院与英特尔合作，利用内部和外部来源的数据（包括 10 年的住院记录），来确定基于日期和小时的预期入院患者数量预测\
  \ [42]。\n\n使用时间序列分析技术来预测不同时间的入院率。这些数据可供所有外科和诊所使用，展示了数据可以立即用于提高效率和赋能利益相关者的方式。\n\n\
  世界上大多数（如果不是全部）诊所都能获取类似的数据，这表明医疗保健领域才刚刚开始触及数据应用的表层。\n\n### 降低再入院率\n\n与等待时间相同的方法可用于帮助管理医院成本。利用数据分析，可以根据病史、人口统计数据和行为数据识别高风险患者群体。这可用于提供必要的护理，以降低再入院率。\n\
  \n在美国德克萨斯大学西南医学中心医院，通过成功识别高风险患者，电子健康记录分析使心脏病患者的再入院率从 26.2%降至 21.2% [23]。\n\n###\
  \ 预测分析\n\n前面的例子很可能使用静态数据（即非实时的小数据），并且在预测等待时间和再入院间隔方面相当准确。同样的数据分析概念可以大规模用于疾病预测和护理普及化。\n\
  \n在美国，Optum Labs 已经收集了超过 3000 万患者的电子健康记录，创建了一个用于预测分析工具的数据库，以改善护理服务。其目的是让医生能够基于数据做出近在咫尺的、明智的决策，从而改善患者的治疗\
  \ [44]。\n\n3000 万份健康记录提供的稳健性使得模型可以被训练和验证，以找到符合某些疾病（如高血压、心血管疾病、中风、2 型糖尿病、心脏病和代谢综合征）预测风险趋势的人群。\n\
  \n通过分析包括年龄、社会和经济人口统计数据、健康状况及其他健康生物标志物在内的患者数据，医疗服务提供者不仅可以通过预测风险，还可以通过提供最佳患者预后的治疗，在个体和群体层面改善护理。\n\
  \n### 电子健康记录\n\n电子健康记录尚未完全实现其潜力。这个想法在理论上很简单：每个患者都有一个数字健康记录，包含他们的详细信息、人口统计数据、病史、过敏史、临床结果等。在患者同意的情况下，记录可以通过安全的计算机系统共享，并可供公共和私营部门的医疗服务提供者使用。每条记录包含一个可修改的文件，这意味着医生可以随着时间的推移进行更改，而不会有数据复制或不一致的风险。\n\
  \n电子健康记录完全合理；然而，在全国范围内完全实施被证明是一项艰巨的任务。根据 HITECH 研究，在美国，高达 94%的符合条件的医院使用电子健康记录。欧洲则更为落后。欧盟委员会的一项指令设定了到\
  \ 2020 年创建一个集中的欧洲健康记录系统的任务 [46]。\n\n在美国，凯撒医疗机构已经实施了一个在其所有设施间共享数据的系统，并使电子健康记录的使用更加便捷。麦肯锡的一份报告强调，由于减少了办公室就诊和实验室测试，该数据共享系统估计节省了\
  \ 10 亿美元。该数据共享系统改善了心血管疾病的预后 [47]。\n\n电子健康记录正在向区块链演进，区块链旨在实现数据访问的去中心化和分布式。\n\n###\
  \ 基于价值的护理/患者参与\n\n患者不再被视为被动的护理接受者。医疗保健现在有义务让患者参与到他们的健康、医疗决策、护理和治疗中。可以通过数字手段维持患者参与。请注意，患者参与不应与患者体验混淆，后者是患者可能经历的路径（旅程）。\n\
  \n财务驱动因素已经促使医疗实践越来越有动力与每位患者进行最佳互动，以确保所接受的服务令人满意且质量上乘。\n\n数据驱动解决方案的关键驱动因素之一是对患者参与的需求以及向基于价值的护理的转变。更好的患者参与能增强患者、治疗提供者和支付方之间的信任。此外，它还能带来更好的健康结果，并为提供者节省成本（或带来其他好处）。\n\
  \n开创性的健康保险计划旨在通过将保费与良好健康挂钩来吸引患者参与，以实现更好的健康结果。位于英国沃里克的糖尿病数字媒体公司的健康创新者正与全球保险提供商和健康组织合作，为用户提供可扩展的数字健康技术，以优化他们的健康和福祉\
  \ [18]。\n\n加利福尼亚蓝盾公司正在通过开发一个集成系统来改善患者预后，该系统将医生、医院和健康保险与患者更广泛的健康数据连接起来，以提供基于证据的、个性化的护理\
  \ [48]。其目标是帮助改善疾病预防和护理协调方面的绩效。\n\n\n### 医疗物联网：实时通知、警报与自动化\n\n数百万人使用设备将生活数据化，迈向量化自我。当前连接到互联网的设备包括：体重秤；测量心率、运动和睡眠的活动监测器（如\
  \ Fitbit、Apple Watch、Microsoft Band）；以及血糖仪。所有这些设备都能实时发送指标，并以秒级精度追踪用户行为。甚至还有一款可穿戴的胎儿心跳监测器\
  \ [50]。\n\n记录的数据可用于检测疾病风险、提醒医生，或根据接收到的生物特征信息请求紧急服务。许多集成设备已超越脉搏和运动监测，开始测量汗液、氧化水平、血糖、尼古丁摄入量等指标。\n\
  \n精密的设备带来了针对新问题的精密解决方案。例如，由于心率监测变得更便宜、更普及，像房颤这样的病症现在比以往任何时候都更容易、更早地被检测到。心率超过 300\
  \ bpm（而非 60–80 bpm）的颤动可能是房颤的症状。被诊断患有房颤的患者患痴呆症的可能性高出 33%；超过 70% 的患者将死于中风 [51, 52]。治疗通常很简单：抗凝剂和血液稀释剂，其有效率高达\
  \ 80%。\n\n医疗服务提供者正缓慢地转向复杂的工具包，以利用患者产生的大量数据流，并在每次出现令人不安的结果时做出反应。这种采用是由成熟的数字组织和初创公司，与健康保险支付方共同推动的。\n\
  \n在另一个用例中，加州大学尔湾分校的一项创新项目让心脏病患者有机会带着无线体重秤回家，并定期称重。预测分析算法确定了不安全的体重增加阈值，并在需要紧急再次入院之前，主动提醒医生对患者进行诊治\
  \ [31]。\n\n值得注意的有趣一点是，这些互联健康设备并不一定能激励那些最易发生不良健康事件的受众或人群。根据几项随机试验，Fitbit 佩戴者确实锻炼得更多，但不足以保证减肥和改善体质。\n\
  \n事实上，一些研究确定它们可能会打击积极性 [55]。此外还有准确性的问题。克利夫兰诊所的一项研究发现，市场上四个品牌的心率监测器有 10% 到 20% 的时间报告不准确的读数，这表明该技术的精度还有待提高\
  \ [56]。\n\n尽管这些设备显示出潜力，但仍存在一个问题：在持续使用一段时间后，平均放弃率超过 30%。软件应用程序现在成为了参与互动的渠道，作为设备和物联网之上的智能层，它们还可以引入行为改变心理学，以实现可持续的行为改变和持续使用。\n\
  \n为这类设备的用户提供切实的激励措施，例如健康或人寿保险折扣，可能会变得更加主流，并推动预防许多与生活方式相关的慢性疾病，类似于带有嵌入式黑匣子传感器的激励型汽车保险。\n\
  \n实时警报也可用于通知患者其所服用药物的不良反应。目前，除非患者向治疗提供者注册，否则不会收到任何通知。医疗服务提供者可以利用公共信息源通知患者潜在的不良反应。电子邮件或短信足以作为一种互动形式，并能提供所需的所有指导，从而减少与临床医生的会诊时间。\n\
  \n电子健康记录（EHR）还可以触发警告、警报和提醒，告知患者何时应进行新的实验室检测，或追踪处方以查看患者是否遵循了治疗指示。\n\n### 迈向循证医学\n\
  \n循证医学是一个术语，指基于经过验证的科学方法进行治疗，以追求最佳结果。临床试验在小范围内进行，在具有内部效度（即，除指定条件外无其他状况或问题）的小组中测试新疗法，观察治疗效果如何，并确定是否存在任何副作用。\n\
  \n随着数据化的日益增长，“真实世界证据”或数据也在增加。这些数据可以在个体层面进行分析，以创建患者数据模型，并在群体层面进行汇总，以得出关于疾病流行率、治疗、参与度和结果的更广泛见解。这种方法提高了护理质量、透明度、结果和价值，其核心是使医疗服务民主化。\n\
  \n利用相似患者群体的数据，我们可以了解具有相似特征的患者所采取的治疗方案，从而根据人群中其他人对任何给定治疗的反应，推荐最佳治疗方案。推荐的治疗路径对患者来说是最好的，并且可以向患者和医疗专业人员解释为什么这是最佳路径。这源于预测分析，并且超越了识别群体和治疗方案的范畴。\n\
  \n通过挖掘真实世界的患者数据，包括临床患者记录和实时的个人患者健康数据——并结合关于疾病流行率、治疗路径和结果的人口统计学和健康数据——我们可以了解针对个体的最佳治疗方案，从而促进精准医学，这是循证医学的顶峰。\n\
  \n通过将真实世界的患者和临床数据与基因组联系起来，可以针对患者和人群的基因构成进行个性化定制，用于以下方面：\n\n*   药物处方\n*   不良反应和反应\n\
  *   预防策略\n*   未来疾病的可能风险\n\n### 公共卫生\n\n通过对疾病模式和暴发进行分析，可以通过分析驱动的方法显著改善公共卫生。\n\n大数据可以帮助确定需求、所需服务或治疗；并且可以预测和预防未来的危机，从而造福人群。通过绘制患者位置图，可以预测可能在某个区域内传播的疾病暴发（如流感），从而更容易制定应对患者、疫苗接种和护理服务的计划。\n\
  \n在西非，手机位置数据在追踪人口流动方面被证明是无价的，并因此帮助预测了埃博拉病毒的蔓延范围 [57]。\n\n在 2010 年海地地震后，一个由瑞典卡罗林斯卡学院和美国哥伦比亚大学组成的研究团队分析了\
  \ Digicel 海地网络上 200 万部手机的通话数据 [58]。通话记录被用于了解人口流动情况，并帮助联合国更有效地分配资源。这些数据还被用于识别随后霍乱暴发的风险区域。\n\
  \n\n\n## 数据及其分析的演变\n\n近在咫尺正在驱动未来。作为数字世界中的人、患者或代理，我们期望所提供的数据与所收到的反馈之间在时间上具有邻近性。随着数据规模的增加，从数据创建到洞察和行动之间的时间缩短的需求也随之增长。缩短从检测事件到自动响应的时间具有巨大的经济价值。这有助于在交易完成前发现欺诈交易，甚至提供与兴趣或需求相匹配的信息。\n\
  \n正如数据本身在演变，数据的分析方式也在演变（图 2-5）。\n\n![../images/459335_2_En_2_Chapter/459335_2_En_2_Fig5_HTML.jpg](img/459335_2_En_2_Fig5_HTML.jpg)\n\
  \n图 2-5\n\n大数据及其分析的演变\n\n作为一个概念，数据分析或分析学，已经历了多次迭代，其驱动力来自于对获取数据以支持决策的需求。\n\n分析 1.0\
  \ 表现为对小型、低速数据集的传统分析，通常采用电子表格和静态文档的形式。这适用于小数据。典型的分析是描述性的，并且基于报告。\n\n数据通常本质上是结构化的。这在\
  \ 20 世纪 90 年代推动了商业智能的发展，其特点是预定义的查询以及详细或历史的视图——通常由利用结构化数据（如客户数据、行为数据、销售数据、患者记录等）的\
  \ Web 仪表板驱动。关于生产过程、销售、交互和交易的数据在传统关系数据库中被收集、聚合和分析。在分析 1.0 时代，数据科学家花费大量时间准备数据以供分析，而不是亲自进行分析。\n\
  \n分析 2.0 标志着大数据与传统分析的整合，并提供了支持实时查询大数据集的接口。大数据分析始于 21 世纪初，它通过结合结构化数据和非结构化数据（如社交媒体、行为数据以及日益多样化的用户数据）的复杂查询与预测视图，促进了竞争洞察。那些无法在集中式平台上容纳或无法被快速分析的大数据，将通过诸如\
  \ Hadoop 之类的框架进行处理。Hadoop 是一个开源软件框架，用于在云端或本地的并行服务器上进行快速批数据处理。\n\n非结构化数据不仅通过 SQL（结构化查询语言）数据库得到支持，还支持键值、文档、图、列式和地理空间数据。这一时期引入的其他大数据技术包括用于快速分析的“内存中”分析，即数据在内存中而非磁盘上进行管理和处理。\n\
  \n如今，海量数据正在网络边缘产生，传统的分析方式已不再可行。与消费者打交道的组织——无论是制造物品、运输物品、消费物品还是与客户合作——在这些设备和活动中拥有越来越多的数据。每个设备、每批货物和每个人都会留下一条被称为“数据尾气”的轨迹。\n\
  \n分析 3.0 标志着一个成熟阶段，在此阶段，组织通过结合传统分析和大数据，实现了可衡量的业务影响。该方法支持在决策点进行敏捷的洞察发现和实时分析。分析 3.0\
  \ 主要是传统商业智能、大数据和分布在整个网络中的物联网的结合。组织可以分析这些数据集，以造福特定受众，实现其目标——无论是改善健康结果还是实现货币化。他们还可以将高级分析和优化近乎实时地嵌入到其运营一线做出的每一个产品或服务决策中。\n\
  \n## 将数据转化为信息：利用大数据\n\n数据的价值体现在将其转化为信息的能力上，这些信息可以驱动可操作的洞察，进而引导行为和流程。数据分析/分析学是数据科学的一个子集，旨在从原始数据源中提取洞察。\n\
  \n当今大数据分析的进步使研究人员能够在几分钟内解码人类 DNA，预测恐怖分子计划攻击的地点，确定哪个基因最可能导致特定疾病，当然，还能确定你在 Facebook\
  \ 上最可能对哪些广告做出反应。\n\n大数据分析可以帮助组织理解其数据中包含的信息，并识别出对业务目标、成果和决策最重要的数据。利益相关者通常希望获得来自数据分析的知识，这取决于所产生的结果类型和推理方法。\n\
  \n大多数大数据是非结构化的。IBM 估计，全球 80% 的大数据是非结构化的，包括照片、音频、视频、文档和交互 [59]。\n\n数据需要经过处理才能产生价值。要实现这一点，需要资源——以时间、人才和资金的形式。这是采用大数据方法的一个惯性所在：将数据处理成具有可用洞察力的东西，是否值得为此投入资本并承担风险？\n\
  \n数据科学分析分类中有四个流（图 2-6）。分类基于所产生的结果类型。\n\n![../images/459335_2_En_2_Chapter/459335_2_En_2_Fig6_HTML.jpg](img/459335_2_En_2_Fig6_HTML.jpg)\n\
  \n图 2-6\n\n分析的流\n\n### 描述性分析\n\n描述性分析通过分析历史数据，为过去提供洞察，重点关注“发生了什么”这个问题。描述性分析使用数据聚合和数据挖掘等技术来提供历史理解。从描述性分析中可以学到很多东西。\n\
  \n描述性分析的常见例子是提供以下问题答案的报告：去年七月有多少患者入院？有多少患者在 30 天内再次入院？有多少患者感染或遭受了护理失误？描述性分析是大数据分析的第一种形式。\n\
  \n对于许多组织来说，这种基本的报告水平仍然欠缺。专有数据标准维护着无益的信息孤岛；缺乏可用的人类专业知识或适当的组织支持可能导致数据被收集后闲置不用。\n\n\
  通过数据集链接，数据可以变得更有价值。例如，将医生预约与住院、教育出勤、用药依从性和服务获取联系起来，可以为优化医疗服务和节省成本提供重要的洞察和理解。\n\n\
  描述性分析的局限性在于，它基于过去的快照，指导决策的能力有限。虽然这很有用，但并不总能预示未来。\n\n### 诊断性分析\n\n诊断性分析是一种检查数据以回答“为什么某事会发生”这一问题的分析形式。诊断性分析包括决策树、数据发现、数据挖掘和相关性等技术。\n\
  \n接下来的两种分析类型，预测性分析和规范性分析，需要使用学习算法，并将在后续章节中进行更深入的介绍。\n\n\n\n### 预测性分析\n\n预测性分析使我们能够了解未来并预测未来结果的可能性。它利用手头已有的数据，并尝试通过最佳估算来填补缺失的数据。\n\
  \n预测性分析的特点包括回归分析、多元统计、数据挖掘、模式匹配、预测建模和机器学习等技术。它利用历史数据和当前数据来预测未来事件或可执行结果的可能性。\n\n\
  随着医疗保健提供者寻求基于证据的方法来降低成本、利用基于价值的报销模式，并避免因未能控制其能力范围内的慢性疾病和不良事件而受到处罚，预测性分析技能的需求日益增长。预测性分析正处于变革之中。过去五年的创新取得了显著进展，对患者生活产生了可衡量的影响。可穿戴技术和移动应用如今已能识别哮喘、房颤和慢性阻塞性肺疾病（COPD）等病症[60]。\n\
  \n预测性分析仍然难以实现，因为它需要获取实时数据以支持近乎实时的临床决策。为此，医疗传感器和连接设备必须完全集成，以提供患者健康状况的最新信息。\n\n此外，临床医生需要具备使用此类数据的经验。除了利用单个患者的数据外，更准确的诊断和治疗还必须尽可能多地参考可用的患者数据，包括人群层面的数据。\n\
  \n随着数据源和技术的发展，来自认知计算引擎、自然语言处理和预测性分析的高级决策支持，可以帮助医疗提供者精准定位那些可能被遗漏的诊断。人群健康管理工具可以识别出那些再入院风险最高、易患高成本慢性疾病或对药物产生不良反应的人群。\n\
  \n#### 应用案例：实现个性化护理\n\n代谢健康已被证明会影响多种健康状况的风险，包括 2 型糖尿病、高血压、某些痴呆症和某些癌症。作为针对 2 型糖尿病的数字干预手段，低碳水计划应用利用多种特征（以健康生物标志物和人口统计数据的形式，包括血糖、体重、性别和种族）来评估患者的代谢健康评分。随着该应用扩展到与可穿戴健康设备集成，增加的体重和血糖数据使算法能够进一步扩展，以确定胰腺癌的潜在风险。这些信息会在相关情况下与患者的医疗团队沟通，并通过队列数据比较进行参考[16]。\n\
  \n用户会收到支持性通知，告知其数据似乎不符合预期的人口统计特征，并提示用户与其医疗专业人员沟通。如本例所示，随着更多生物传感器和算法的开发，预测性分析的伦理影响变得十分重大。\n\
  \n#### 应用案例：实时患者监测\n\n在典型的医院病房中，病房护士会手动巡视患者，监测并确认关键生命体征。然而，无法保证在预定巡视间隔期间，患者的健康状况不会发生好转或恶化。因此，护理人员往往是在不良事件发生后被动应对问题，而如果能更早介入，则会对患者的健康产生显著影响。无线传感器可以比人工巡视更频繁地捕捉和传输患者的生命体征数据。\n\
  \n随着时间的推移，同样的数据可以应用于预测性分析技术，以便在通过床边巡视发现紧急情况之前，就判断其发生的可能性。\n\n### 规范性分析\n\n规范性分析致力于为获得最佳结果而做出决策，即利用所有可用数据和分析来告知并优化行动决策——也就是更智能的决策。规范性分析试图量化未来决策的影响，以便在决策前就可能的结果提供建议。\n\
  \n在最佳状态下，规范性分析不仅能预测将要发生什么，还能预测其发生的原因，从而提供关于如何利用这些预测采取行动的建议。\n\n规范性分析结合了多种人工智能技术和工具，如机器学习、数据挖掘和计算建模程序。这些技术应用于来自许多不同数据集的输入，包括历史数据和交易数据、实时数据流以及大数据集。\n\
  \n规范性分析会考虑现有证据，进行情境化预测。例如，典型的医院再入院分析会显示未来 14-30 天内可能返回医院的患者预测。一个更有用的预测器可能会将同一仪表板与预计成本、实时床位数量、可用教育材料和后续护理信息整合。有了这些额外信息，临床医生可以识别出再入院风险高的患者，并采取措施将风险降至最低，从而改善患者预后并减少医院资源消耗。人群管理方法可以考虑肥胖患者，并添加高胆固醇或心脏病风险等因素的筛选条件，以确定治疗重点和应针对哪些治疗方案。制药公司可以利用规范性分析，通过识别最适合临床试验的人群来加快药物开发。这包括预计依从性好的患者以及预计不会出现并发症的患者。\n\
  \n规范性分析通过从风险分层人群中识别适合个体的干预模型，结合临床数据、患者数据和更广泛的可用健康数据，实现了人群健康管理的优化。\n\n分析学正在经历进一步的转型，从规范性分析转向情境化分析。情境化分析在推荐最佳行动方案时，会考虑更广泛的数据——例如环境、位置和情境数据。\n\
  \n#### 应用案例：从数字疗法到药理学\n\n不同的治疗路径对不同的人效果不同。通过大规模收集数据，医生可以根据对患者人群的最新循证分析、预测性分析和规范性分析来开具治疗方案。\n\
  \n通过整合数字教育和药理学疗法，利用此类资源提供治疗，可以确保始终开具最精确的治疗方案，同时提供可追踪的依从性和进展洞察，并确保资源集中在需要的地方，从而民主化医疗保健的获取。\n\
  \n## 推理\n\n系统可以利用知识库中的可用信息，通过三种主要方法得出结论：演绎、归纳和溯因。虽然不需要逻辑学背景，但了解不同推理方法之间的差异是有益的。任何数据科学家都应熟悉这些推理技术。\n\
  \n### 演绎\n\n演绎推理允许你根据已知事实做出必然成立的陈述。例如，你已知两个事实：\n\n1.  每个星期六都下雨。\n2.  今天是星期六。\n\n\
  演绎推理允许你确定一个真实的陈述：如果今天是星期六，那么今天会下雨。\n\n在演绎推理中，人们从前提 p 推断出逻辑上合理的命题 q。大多数报告系统和商业智能软件都是演绎性的。\n\
  \n\n\n### 归纳\n\n归纳推理使你能够根据迄今为止积累的证据做出陈述。然而，关键在于证据并不等同于事实。某事物的充分证据，无论多么有力，都只是暗示某个“事物”是一个事实。因此，在归纳方法中，所确定的陈述只是极有可能为真，而非绝对真理。\n\
  \n通过归纳推理，人们试图推断出一个命题 q，该命题由 p 推导而来，但不一定是 p 的逻辑推论。\n\n例如，如果英格兰沃里克郡在 12 月份有超过 50 年的降雨记录，那么你就有强有力的证据（数据）支持一个归纳性陈述：沃里克郡即将到来的\
  \ 12 月份会下雨。然而，这并不意味着它一定会发生；它不是一个事实。\n\n统计学习关乎归纳推理：观察一些数据，科学地猜测一个总体假设，并基于此前提对测试数据做出陈述或预测。\n\
  \n### 溯因推理\n\n溯因推理是归纳推理的一种变体。溯因推理试图使用一个假设 p 来解释一个命题 q。在溯因推理中，推理的方向与演绎推理相反。最佳假设，即最能有效解释数据的假设，被推断为最可能是正确的假设。\n\
  \n一个经典的例子如下：\n\n*   (q) 观察：当我醒来时，窗外的草地是湿的。\n*   (p) 知识库包含信息：雨水能使草地变湿。\n*   溯因推理：昨晚可能下雨了。\n\
  \n通常可能存在多达成千上万种可能的结果，因此溯因推理有助于确定如何优先安排需要调查的解释。大数据集通过机器学习为归纳和推理提供了机会。\n\n## 我的项目需要多少数据？\n\
  \n尽管大数据的定义在于其存储在分布式系统中，但在创建机器学习算法时，关键在于质量而非数量。例如，如果你有超过 1000 个关于某位患者的数据点，你如何从噪声中理解最重要的属性？更进一步，从\
  \ 5000、10000 或 100000 个数据点中，你是否更有可能获得更好的结果？这个问题最好通过数据科学来解决，并且完全取决于领域和数据样本的质量。\n\n\
  循证医学的未来在于实现数据驱动的个性化医疗。当医疗服务提供者、患者以及从所有临床文档中获得的数据之间形成协同伙伴关系时，数据驱动的医疗便得以实现。这会产生能够实时驱动可操作洞察的分析结果，从而提升患者体验，并简化临床和行政工作流程。\n\
  \n## 大数据的挑战\n\n在大数据项目的推进过程中，存在若干挑战。\n\n### 数据增长\n\n从大数据的本质来看，存储就是一个挑战。人们普遍认为，数字宇宙的规模每两年将翻一番，这意味着从\
  \ 2010 年到 2020 年将增长 50 倍。\n\n大多数大数据是非结构化的，这意味着它们不驻留在传统的数据库模式中。文档、照片、音频、视频和其他非结构化数据可能难以搜索、分析和检索。因此，非结构化数据的管理是一个日益严峻的挑战。大数据项目的发展速度可能与其中使用的数据一样快。\n\
  \n### 基础设施\n\n大数据以基础设施、存储、带宽、数据库等形式消耗技术资源。挑战与其说是技术性的，不如说是寻找可靠的服务和支持供应商，以及建立正确的经济报酬模式。\n\
  \n与本地部署的解决方案相比，云端提供的解决方案将具有更强的可扩展性、成本效益和效率。\n\n### 专业知识\n\n许多组织面临的挑战是，在数据分析和数据科学领域难以找到高质量的专业知识（或深层次的专业知识）。与产生的数据量相比，数据科学家的比例非常低。\n\
  \n### 数据源\n\n大数据的一个重大挑战是数据生成和交付的体量和速度。管理大量涌入的数据源本身就是一项任务。\n\n### 数据质量\n\n数据质量当然不是一个新问题，但能够存储实时生成的每一条数据加剧了这个问题。必须解决导致脏数据的常见原因，包括用户输入错误、重复数据和错误的数据链接。除了维护数据，大数据算法也可用于帮助清理数据。\n\
  \n### 安全性\n\n患者数据的安全和隐私存在重大风险。对于敏感的健康数据，对安全和隐私问题的敏感性自然会增加。用于数据分析、存储、管理和利用的工具来自各种来源，这使数据面临风险。网络安全是一个令人担忧的问题。医疗行业曾发生过重大的数据泄露事件。在英国，信息专员办公室（ICO）对布莱顿和苏塞克斯大学医院\
  \ NHS 信托基金处以罚款，原因是发现数千人的敏感数据存放在硬盘上，而这些硬盘被放在 eBay 上拍卖[61, 62]。\n\n迄今为止，记录在案的最严重的医疗数据泄露事件是美国健康保险公司\
  \ Anthem [63]。此次泄露暴露了超过 7000 万现任和前任会员的个人记录，包括家庭住址和个人信息。数据丢失，包括数据盗窃，是一个真实存在的问题，并且不断受到极限考验。\n\
  \n安全挑战包括：对每个访问数据集的团队和团队成员进行身份验证、根据用户需求限制访问、记录数据访问历史、满足合规性要求，以及确保数据加密以防止窥探者和任何恶意行为。\n\
  \n医疗设备的安全性因其技术多样性而构成独特威胁。从智能手机上的健康应用程序到胰岛素泵，医疗设备正变得越来越网络化，为黑客留下了独特的可乘之机[64]。这种行为被认为是危险的，尽管对于更懂技术的人来说，他们明白这也可以被用于积极的目的。在制药公司或数字公司之前，爱好者们就已经“破解”了胰岛素泵和连续血糖监测仪，使其充当人工胰腺。然而，关键的担忧在于，如果被利用，类似的设备漏洞不仅可能导致数据泄露，还可能导致依赖医疗设备的人死亡。如今，颠覆与进步之间的平衡是一种现实世界的经验。昨日的颠覆者，是今日的创新者。\n\
  \n接下来是第三方服务和供应商的话题。大多数健康设备和健康应用程序都提供 API 访问。有必要记住，外部供应商服务和 API 的好坏取决于开发它们的开发者。经证实的信任和声誉才是人们真正依赖的全部。\n\
  \n## 阻力\n\n对机器学习项目的价值和成果缺乏理解，可能会招致内部利益相关者的阻力。只有当你能够为结果赋予明确的价值，并优先向利益相关者清晰解释产出时，你才能有效地管理项目。\n\
  \n除了惯性之外，一旦识别出关键模式，组织必须准备好采取必要行动并实施变革，以从中获取价值。这通常是首要的惯性，因此，精确且无术语的文档和治理对于理解项目和治理目的非常有用。\n\
  \n\n\n## 政策与治理\n\n通过可穿戴设备和传感器捕获的海量大数据引发了一系列问题：数据如何收集、如何处理、如何分析，以及数据应如何影响政策制定过程。此外，数据隐私和安全是处于持续发展和演变状态的法律领域。\n\
  \n## 数据碎片化\n\n大多数组织的数据高度碎片化。医院团队拥有自己的患者数据，医生和三级护理团队也是如此。这在多个层面带来了挑战：句法层面（即跨团队、站点和组织定义通用格式）、语义层面（就通用定义达成一致）以及政治层面（确定并确认所有权和责任）。这还尚未涉及患者通过手机、健康应用、可穿戴设备等自行收集的数据。\n\
  \n## 缺乏数据战略\n\n要从数据科学投资中获益，组织必须拥有连贯的数据战略。明确数据需求并识别正确的数据类型和数据来源以供使用至关重要。使用数据的期望目标是什么？目标又是什么？确立数据需求非常重要，以避免浪费资源和精力去收集无用的数据。\n\
  \n例如，在医院急诊科，需要收集患者入院、分诊和会诊的时间，以了解患者需要等待多久才能就诊，但这对于确定护理质量或结果而言几乎毫无用处。\n\n## 可视化\n\
  \n要真正从数据科学投资中获益，利益相关者必须理解数据分析和探索的输出结果。数据可视化效果不佳与缺乏数据战略有关：如果未确定具体的用例和目标，由于缺乏明确方向，数据结果的可视化可能会面临挑战。\n\
  \n## 分析的时效性\n\n与接近性相关，数据的价值可能会随时间推移而降低。与银行业一样，医疗保健中的欺诈检测等应用要求数据尽可能接近实时地交付，才能有效发挥作用。\n\
  \n## 伦理\n\n随着数据集变得足够庞大，引发了关于伦理的实际而非理论上的担忧，数据伦理正成为一个新兴话题。患者通过传感器、可穿戴设备、交易、社交媒体和交通出行留下了持续的数据轨迹。例如，基因检测公司\
  \ 23andMe 出售关于十多种疾病（包括阿尔茨海默病和帕金森病）的遗传风险倾向报告。这引发了关于什么合适、什么不合适的具有挑战性的讨论，更多内容将在第 8\
  \ 章中探讨。\n\n## 数据与信息治理\n\n数据对任何企业或组织而言都是宝贵的资产；但在医疗保健领域，数据治理对于确保任何组织在向数据驱动和分析驱动转型过程中的一致性、安全性和进步性至关重要。\n\
  \n数据治理的需求主要源于在规避风险的行业中对问责制的要求。随着数据价值的实现，数据治理也在不断发展，以定义组织中数据的方法、管理和利用。诸如 ISO（国际标准化组织）10027\
  \ 和 GDPR（通用数据保护条例）等流程和标准已被用于使整个数据行业符合最佳实践。\n\n数据治理和信息治理这两个术语经常互换使用，但确实存在差异。\n\n\
  数据治理是指在数据整个生命周期内管理数据资产，以确保其符合质量和完整性标准的实践。数据治理的目标是通过最佳的数据有效性和问责制，让用户信任数据。它为创建高质量数据以及以安全、合乎道德且经同意的方式使用数据设定了框架。医疗保健领域的数据治理旨在提高效率、建立问责制，并建立一个提供者和患者可以用来做出正确健康决策的数据池。\n\
  \n通常，数据治理的最佳方法是以实现最大公共利益所需的最小程度进行治理。在许多情况下，治理是针对尚不需要治理的情况而设定的。\n\n组织可能会在管理和决策上浪费大量时间，包括对数据的限制，这可能会阻碍项目的发展和方向。医疗保健组织应受到获取更多数据以进行学习的激励——收集信息以更好地管理风险并改善结果。\n\
  \n数据治理需要维护各种标准，以返回高质量的信息。\n\n### 数据管理\n\n数据管理者对所定义的数据及其适当使用负责。数据治理这一方面的目标是确保数据准确性、数据可访问性、数据一致性、完整性和更新方面的质量。这通常是运行项目的组织。此外，大多数组织会任命一名或多名官员，负责访问数据，并拥有更高的权限。\n\
  \n### 数据质量\n\n确保数据质量可以说是数据治理除安全性之外最重要的功能。数据质量差会对准确性产生不利影响，尤其是对于学习项目而言。治理应致力于强制执行数据的质量、准确性和时效性。\n\
  \n### 数据安全\n\n数据安全至关重要。首先，数据治理规定了数据如何受到保护，通常是数据如何加密、谁有权访问、数据处理流程（包括数据可能如何使用）以及在发生泄露时应采取的措施。这受到几个驱动因素的推动：要求采取行动的监管要求（例如在欧洲实施的\
  \ GDPR）、日益增长的网络安全风险，以及数字弱点认知可能损害声誉和信任的事实。自 2012 年以来，使用安全 https:// 协议运营的网站数量增长了 4,000%\
  \ [65]，这证明了这一点。患者期望他们的数据是安全的。\n\n话虽如此，2020 年的 Garmin 勒索软件攻击表明，人们会对他们依赖的服务保持耐心，当服务恢复上线时，会收到支持和欢呼的信息\
  \ [66]。Babylon Health 的情况类似，该平台公开分享了其他全科医生咨询的录音，并导致少数患者用户能够访问 [67]。\n\n人们意识到数据安全是所有相关方持续关注的问题，而\
  \ Garmin 网络攻击表明，人们会对他们偏好的、或能给他们带来用途或价值的服务和品牌保持耐心。值得注意的是，即使科技公司的创始人和高管被带到管理者面前，时间也表明，负责质询的人对所涉及的技术或使用的复杂性知之甚少。\n\
  \n### 数据可用性\n\n数据碎片化是医疗保健组织面临的最大问题之一。确保利益相关者、提供者和患者的数据访问至关重要。\n\n人们“拥有”自己的数据；因此，对所有人来说，访问需要透明、快速且高效。数据访问治理可以为系统设置用户角色的权限和身份验证级别。\n\
  \n### 数据内容\n\n项目的数据和信息治理可以说明收集的数据类型，包括健康数据、元数据以及位置、个人资料和行为数据。数据治理还可以详细说明数据的用途。\n\
  \n### 主数据管理 (MDM)\n\n随着数据传输成为优先事项，MDM 充当主参考，以确保跨组织一致地使用数据。MDM 的目标是创建一个可以在组织内共享的通用参考点。\n\
  \n\n\n### 使用场景\n\n在几乎所有情况下，数据治理策略都会包含数据访问以及“如果……会怎样”场景的用例。让所有需要参与行动的团队成员都参与模拟演练是很有用的，这可以确保数据访问或访问请求不会遭遇长时间的沉默。\n\
  \n用例将包括一系列流程，这些流程会因应患者的数据请求、删除请求、确保合适角色能够访问数据、确保保留适当的交易日志等情况而启动。\n\n数据治理除了内部效益外，还提供了若干额外优势，包括：\n\
  \n*   保护数据利益相关者——尤其是数据“提供者”的利益\n*   标准化流程与程序，以实现简化的重复操作并最大程度减少错误\n*   降低成本并提高效率\n\
  *   提高数据传输各方之间的透明度和问责制\n\n信息治理的目的略有不同。信息治理是对信息的管理和控制。这些信息是通过使用数据资产形成的（图 2-7）。\n\n\
  ![../images/459335_2_En_2_Chapter/459335_2_En_2_Fig7_HTML.jpg](img/459335_2_En_2_Fig7_HTML.jpg)\n\
  \n图 2-7\n\n数据与信息——有何区别？\n\n单个数据点，例如一次血糖读数，如果没有额外的背景信息或元数据，其价值非常有限。然而，过去 3 个月的一系列血糖读数可以显示患者的血糖控制情况是好是坏，例如，这可能是合并症的风险因素。它关注与患者和员工相关的个人及敏感信息。\n\
  \n在大多数组织中，数据与信息治理是合并进行的；但理解其区别仍然很有用。\n\n一个坚定的数据治理项目将涉及一个治理机构或委员会、一套明确的程序，以及这些程序得以维护和验证的方式。\n\
  \n随着学习系统的发展，信息治理正变得越来越关键。随着数据集变得无限庞大，数字健康应用和集成的生物-人体健康设备很快将能够预测并确定疾病风险和发病时间。\n\n\
  无论准确性问题如何，都需要立法来规定这些信息可以做什么、不可以做什么。\n\n## 开展大数据项目\n\n启动任何大数据项目都涉及三个步骤。大数据项目不一定是更大机器学习项目的一部分：\n\
  \n1.  理解项目将如何影响你的组织。\n\n    这包括确定业务案例；目标（我想要实现什么？）；当前和所需的基础设施；数据源；以及质量、工具和衡量成功的\
  \ KPI。确定量化目标是衡量成功和绩效的关键。确定可衡量的 ROI 以判断项目成功与否，有助于向利益相关者展示价值。与来自技术、医疗和运营团队的成员一起确定目标，有助于保持重点和方向的清晰。确定潜在的用例，如果时间和条件允许，还可以创建用例场景和用户画像。\n\
  \n2.  找到你所需的技能和技术。\n\n    确定项目的用例有助于定义项目所需的技术、基础设施和能力。很可能需要掌握 Python 和 R（开源编程语言）的技能，数据科学领域还需要分析技能。这些技能可以外包、以合同形式引入，或发展为全职岗位。\n\
  \n3.  实施项目。\n\n    确定你希望包含的数据，并专门识别那些将被排除在用例之外的数据。确定需要对数据执行的分析类型，以从项目中收集所需的输出。探索收集数据并将其准备成算法可用格式所需的要求；持有和使用数据所需的治理；以及数据将如何呈现给利益相关者，最重要的是，呈现给最终用户。此时可以做出架构决策，例如数据库结构、平台提供商和模型类型。正是在这个阶段，你可以考虑应用于数据的分析类型。\n\
  \n你可能需要考虑项目的分阶段实施，以及当前能力与未来需要解决的能力之间的差距。\n\n在测试环境中开发项目，并以有意义的方式向用户展示结果。\n\n## 大数据工具\n\
  \n有多种开源和付费工具可用于大数据收集和机器学习项目。基础始于 Hadoop 和 NoSQL（非关系型）数据库。\n\nHadoop 是大数据的代名词，它是一个基于\
  \ Java 的开源软件框架或软件生态系统，用于在计算机集群上分布式存储大型数据集。Hadoop 可以处理庞大而复杂的数据集以获取洞察和答案。Hadoop 分布式文件系统（HDFS）是\
  \ Hadoop 使用的存储系统，它将大数据分离并分布到集群内的各个节点上。这还可以在集群内复制数据，提供高可用性。对于那些不想自己深入研究 Java 的人，Microsoft\
  \ Azure、Cloudera、Google Cloud Platform 和 Amazon Web Services 都提供由 Hadoop 驱动的大数据托管服务。\n\
  \nMongoDB 是一种现代化的数据库方法，对于管理频繁变化的数据或本质上是非结构化或半结构化的数据非常有用。其架构具有更好的写入性能，通过压缩占用更少的存储空间，并减少了运营开销。MongoDB\
  \ 是日益增长的 NoSQL 数据库运动的一部分，NoSQL 数据库用于存储没有特定模式的非结构化数据。行可以各自拥有一组独特的列值。NoSQL 的发展是由提供更好的大数据存储性能的需求所驱动的。\n\
  \nR 是一种用于数据挖掘、统计分析和图形技术的开源软件和编程语言。\n\nPython 是另一种流行的开源编程语言，用于机器学习和数据挖掘中的数据预处理、计算和建模。\n\
  \n\n\n## 结论\n\n大数据与医疗保健意味着在实现众多机遇方面取得了重大进展，这包括远程患者监护、精准医疗、预防再入院以及深化对疾病的理解。\n\n从数据录入和记录保存等日常琐事，到观察和理解人们血糖模式等高级功能性应用，数据正日益成为我们日常生活的一部分。\n\
  \n大数据驱动解决方案所能带来的积极影响潜力，似乎超过了任何负面情绪。医疗数据日益集中化、由患者保管的趋势引发了担忧；然而，只要隐私和安全得到保障，这很可能促进新疗法的开发，并推动医学认知的演进。医疗行业在利用大数据服务于临床和商业用途方面仍处于起步阶段。可穿戴设备和健康物联网的爆发式增长，使得测量心率或每日步数成为可能，这看似是一组相对普通的数据集，但其对预防医学和整个人群健康的潜在影响却是巨大的。\n\
  \n大数据通过提供数据驱动、循证医学的方式，为精准医疗创造了机会。其益处众多，首要的是为患者提供更精准的治疗。\n\n由此带来的成本节约体现在：减少医疗差错、降低住院率、降低死亡率以及提高患者满意度。同时，通过优化医生和更广泛的医疗团队的时间利用（将更多时间用于有需要的患者），也能节省开支。\n\
  \n"
- "# 3. 什么是机器学习？\n\n> *傻瓜也能知道，关键在于理解。*\n> \n> ——阿尔伯特·爱因斯坦\n\n机器学习先驱亚瑟·塞缪尔于 1956 年推出了第一个跳棋程序，展示了人工“智能”的能力[68]。\n\
  \n自那时起，不仅人工智能的应用得到了发展，如今数据的产生速度、体量和多样性也前所未有。塞缪尔的软件运行在 IBM 701 上，那是一台双人床大小的计算机。当时的数据通常是离散的。\n\
  \n近 70 年后，数据无处不在，计算机变得更加强大，以至于 100 台 IBM 701 可以握在我们的手掌之中。这促进了人工智能领域中机器学习和深度学习的发展（见图\
  \ 3-1）。\n\n![../images/459335_2_En_3_Chapter/459335_2_En_3_Fig1_HTML.jpg](img/459335_2_En_3_Fig1_HTML.jpg)\n\
  \n图 3-1\n\n人工智能的组成部分\n\n我们在日常生活中都能看到并接触到“人工”智能（无论其是通过机器学习还是其他方式开发的）：比如叫 Uber、在数字菜单上点餐、寻找\
  \ Airbnb、在 eBay 上搜索、向 Alexa 提问、刷 Facebook 以及参与数字疗法。\n\n关于人工智能驱动的数字疗法应用的案例研究，将在第\
  \ 10 章中进一步详述。\n\n人类所能开发的人工智能，其想象力仅受限于人类自身。新颖创新的设备越来越多地连接到云端，增加了医疗保健领域的机遇。\n\n作为一个拥有海量数据的行业，人工智能正将焦点转向机器学习和深度学习的力量，即机器可以自我学习——这正在加速当前人工智能领域的突破性进展。\n\
  \n如果说塞缪尔的跳棋程序展示了简单的人工智能，那么机器学习的最佳体现则是 AlphaGo Zero，它通过与自己下棋学会了玩跳棋，超越了人类水平，并以 100\
  \ 比 0 的战绩击败了上一版本的 AlphaGo[69]。\n\n机器学习系统在医疗保健领域并不罕见。德克萨斯州休斯顿卫理公会研究所的研究人员开发了一种智能体，其审查和翻译乳房\
  \ X 光照片的速度比人类医生快 30 倍，准确率高达 99%[70]。\n\n根据美国癌症协会的数据，每年进行的 1210 万次乳房 X 光检查中，有 50%会产生假阳性结果，这意味着健康的女性被告知患有癌症[70]。该软件可以被理解为一个自主实体，它从数百万份乳房\
  \ X 光记录中学习，从而降低了假阳性的风险。\n\n关于人工智能和机器学习领域有许多书籍和资源。尽管这是一个需要扎实数学基础的学科，但本书旨在为有辨别力的读者介绍该主题，而不会深入探讨线性代数、概率论和统计学的细节。\n\
  \n本章将涵盖机器学习中的许多主题，从人工智能基础知识和术语的介绍开始，然后过渡到各种形式的学习和数据挖掘。\n\n算法将在下一章中介绍。\n\n## 基础知识\n\
  \n在深入探讨人工智能和机器学习之前，了解几个关键定义是很有用的。以下是一些有用术语的简要指南，本书末尾附有更详细的词汇表。\n\n### 智能体\n\n智能体是指任何可以通过传感器感知其环境，并通过效应器对环境采取行动的事物。这采用了罗素和诺维格对智能体的定义。因此，这包括机器人、人类和软件程序。\n\
  \n智能体有许多不同类型，可以根据其特征进行分类。《人工智能：一种现代方法》（AIMA）是由人工智能专家斯图尔特·J·罗素和彼得·诺维格撰写的一本综合性人工智能教科书[71]。\n\
  \n智能体应该如何行动？理性智能体是指做正确事情的智能体。这可以通过一个数学度量或对智能体性能的评估来表示，智能体可以寻求最大化该度量。\n\n智能体可以被理解为感知序列与行动之间的映射。例如，一个医疗诊断系统可能将医院中的患者视为其环境：感知症状、检查结果和患者的回答。然后，它可能通过提问、测试和治疗来对这些信息采取行动，目标是让患者恢复健康。\n\
  \n智能体的定义适用于软件程序或算法。\n\n### 自主性\n\n在人工智能中，自主性指的是智能体的行为由其自身经验决定的程度。\n\n如果没有自主性，所有决策都基于静态数据集或知识库。在完全自主的情况下，智能体会随机做出决策。智能体具有随着时间的推移变得更加自主的明确能力。\n\
  \n软件，就像人类一样，可以随着时间的推移从经验中学习。系统可以从其环境中的经验（最基本的是从一些新数据中“学习”）中学习，从而在其环境中变得更加自主。\n\n\
  ### 接口\n\n接口智能体是指为复杂系统提供接口的智能体。\n\n### 性能\n\n性能是用于评估智能体在环境中行为的度量。它回答了这个问题：“智能体在环境中是否做了它应该做的事情？”\n\
  \n### 目标\n\n目标指的是智能体试图实现的目标。在机器学习领域，目标不是让智能体“学习”。相反，这指的是总体目标或目的。\n\n目标可以分解为更小的任务。例如，为了实现剖腹产的目标，任务可能包括切开腹部、取出婴儿、检查婴儿是否健康以及重新缝合腹部。\n\
  \n\n\n### 效用\n\n效用指的是智能体自身的内部性能评估——即智能体在任意给定状态下对自身性能的度量。这可能与智能体的实际表现有所不同。值得注意的是，效用函数不一定等同于性能度量，尽管两者可以相同。\n\
  \n智能体可能没有明确的效用函数，而性能度量则始终存在。效用函数用于将状态映射为一个实数，该实数描述了与目标或目的相关的幸福程度或进展程度。\n\n这使得在存在多条路径通向同一目标的情况下能够做出理性决策，从而让智能体能够区分出更优的路径。\n\
  \n### 知识\n\n知识是智能体通过其传感器或对环境的知识所获取的。\n\n知识可用于决定如何行动；如果被存储，它可以用来保存先前的知识状态（换言之，即历史记录）；它还可以用来确定行动如何影响环境。\n\
  \n机器学习是数据驱动的。因此，无处不在的数据和普适计算的兴起，对于开发具有实际应用价值的系统而言意义非凡。\n\n### 环境\n\n环境是智能体所处的世界状态。根据罗素和诺维格的引导，环境具有若干特征。\n\
  \n#### 可访问性\n\n这指的是智能体能够访问环境的程度。在信息缺失的情况下，智能体可能需要做出有依据的猜测才能理性行动。\n\n#### 确定性\n\n\
  环境可以是确定性的或非确定性的。确定性环境是指世界的确切状态可以被理解的环境。在这种情况下，效用函数可以了解自身的性能。在非确定性环境中，世界的确切状态无法确定，这使得效用函数需要依赖最佳猜测决策。\n\
  \n#### 片段性\n\n片段式环境是指智能体当前的行动选择不依赖于其过去的行动。非片段式环境则要求智能体为其当前行动的效果进行规划。\n\n#### 环境类型\n\
  \n静态环境是指智能体在做决策时环境不会发生变化。动态环境则可能在处理过程中发生变化，因此智能体可能需要向环境反馈信息，或在输入与输出之间预测变化。\n\n####\
  \ 数据流向环境\n\n智能体设计的一个关键方面是数据如何被接收。例如，在国际象棋游戏中，智能体只能选择有限数量的走法。这是一个离散环境，因为可执行的走法数量是有限的。另一方面，例如在手术台上，情况可能在最后一毫秒发生变化。连续数据环境是指数据看似无限或没有穷尽的环境。\n\
  \n智能体从根本上说，是能够展现学习、自主性、适应性、推理能力以及一定程度的独创性等特征的实体。\n\n要实现这一点，智能体必须能够通过搜索、规划、适应环境变化以及从过往经验的反馈中，自主地确定行动序列。在机器学习领域，还有进一步的术语。\n\
  \n### 训练数据\n\n训练数据是学习算法将用来学习可能假设的数据。一个样本是包含其目标函数输出的 x 的一个实例。\n\n### 目标函数\n\n这是从\
  \ x 到 f(x) 的映射函数 f。\n\n### 假设\n\n这是对 f 的近似。在数据科学中，机器学习模型近似一个目标函数，用于将输入 x 映射到输出 y。\n\
  \n### 学习器\n\n学习器是创建分类器的学习算法或过程。\n\n### 验证\n\n验证包括机器学习开发中使用的各种方法，这些方法提供了评估模型性能的手段。\n\
  \n### 数据集\n\n数据集是样本的集合。\n\n### 特征\n\n特征是一个数据属性及其值。例如，肤色是棕色是一个特征，其中*肤色*是属性，*棕色*是值。\n\
  \n### 特征选择\n\n这是选择解释统计模型输出所需的特征，同时排除无关特征的过程。\n\n## 什么是机器学习？\n\n机器学习是人工智能的一个子集，其中计算机模型被训练来随着时间的推移从自身行动和环境中学习，以期表现得更好。\n\
  \n1959 年，跳棋程序的创造者阿瑟·塞缪尔将机器学习定义为“一个赋予计算机无需明确编程就能学习的能力的研究领域”[72]。\n\n机器学习源于模式识别以及计算机无需被编程执行特定任务就能学习的理论——即系统无需被明确编程就能学习。因此，学习是由数据驱动的——智能是通过基于学习信号或反馈的性质做出有效决策的能力而获得的。这些决策的效用会根据目标进行评估。\n\
  \n机器学习专注于开发能够适应新数据呈现和发现的算法。机器学习体现了数据挖掘的原则，但也能够推断相关性并从中学习，以应用于新算法。其目标是模仿人类通过经验学习的能力，并在没有或仅有最少外部（人类）协助的情况下完成指定任务。\n\
  \n就像人类的学习一样，机器学习由多种方法组成。在最基本的层面上，首先是记忆。其次，我们通过提取信息（通过阅读、倾听、学习新事物）来学习。第三，我们通过示例来学习。\n\
  \n例如，如果我们被教授平方数，并且向学生展示一组数字 Y = {1, 4, 9, 16, …}，并告诉他们 Y = n*n，他们通常就能理解平方数的概念，而无需被明确教授每一个平方数。\n\
  \n\n\n## 机器学习与传统软件工程有何不同？\n\n传统软件工程与机器学习都旨在解决一个或一组问题。两者之间的区别在于解决问题的方法。\n\n传统软件工程或编程，指的是将某项任务计算机化或自动化的过程，即编写一个函数或程序，给定输入，就能提供输出。换句话说，就是编写一个函数\
  \ f，使得给定输入 x 时，输出 y = f(x)。\n\n这通常通过逻辑来实现，例如 `if-else` 语句、`while` 循环和布尔运算符。\n\n\
  机器学习与传统编程的不同之处在于，它不是提供关于函数 f 的指令，而是向计算机提供输入 x 和输出 y，并期望其确定或预测函数 f（见图 3-2）。\n\n![../images/459335_2_En_3_Chapter/459335_2_En_3_Fig2_HTML.jpg](img/459335_2_En_3_Fig2_HTML.jpg)\n\
  \n图 3-2\n\n机器学习的工作原理\n\n传统程序由人类编写以解决问题，而机器学习程序则通过推理，从示例、规则和信息中学习来解决问题。机器学习中的许多分类器有助于进行预测。\n\
  \n机器学习程序还能学会泛化，并借助基于统计和概率驱动的技术来处理不确定性问题。模型可以从先前的计算或经验中学习，从而产生可靠、可重复的决策和结果。\n\n数据的可用性、互联网上的信息，以及正在产生、存储并可供分析的数字数据量的飞跃，使得工程师能够实现让机器了解我们的偏好，并根据我们的需求进行个性化定制。\n\
  \n只要你留心观察，机器学习无处不在——在网页搜索排名、药物设计、偏好个性化与社交网络推送、音乐推荐、物流、网页设计、自动驾驶汽车、冰箱、洗衣机、电视以及虚拟助手中都能看到它的身影。\n\
  \n## 机器学习基础\n\n机器学习算法的任务大致可分为以下几类（见图 3-3）：\n\n![../images/459335_2_En_3_Chapter/459335_2_En_3_Fig3_HTML.jpg](img/459335_2_En_3_Fig3_HTML.jpg)\n\
  \n图 3-3\n\n学习方法\n\n*   监督学习（也称为归纳学习）\n*   无监督学习\n*   半监督学习\n*   强化学习\n\n### 监督学习\n\
  \n在监督学习中，算法会接收到示例输入及其对应的期望输出（以训练数据的形式），其目标是学习将输入映射到输出的一般规则（见图 3-4）。输入数据被称为训练数据，并且关联着已知的输出（结果）。\n\
  \n![../images/459335_2_En_3_Chapter/459335_2_En_3_Fig4_HTML.jpg](img/459335_2_En_3_Fig4_HTML.jpg)\n\
  \n图 3-4\n\n监督学习：工作原理\n\n训练数据指导着算法的开发。通过一个训练过程来创建模型，在此过程中，模型进行预测，并在预测错误时得到纠正。\n\n\
  训练会持续进行，直到模型在训练数据上达到所需的准确度水平。监督算法包括逻辑回归。监督式机器学习算法可以利用带标签的数据示例，将过去学到的知识应用于新数据，以预测未来事件。\n\
  \n学习算法还可以将输出与正确输出进行比较，以发现任何错误，并相应地修改模型。\n\n监督学习问题可以应用于以下几种形式。\n\n#### 分类\n\n这是基于训练数据集来预测结果，其中输出变量以不同类别的形式呈现。通过输入预先标记好的训练数据来构建模型。\n\
  \n分类技术定义了决策边界，包括：\n\n*   支持向量机\n*   朴素贝叶斯\n*   高斯贝叶斯\n*   k-近邻算法\n*   逻辑回归\n\n分类的一个例子是根据一组症状，将某人标记为（或在现实应用中，诊断为）生病或不健康。\n\
  \n#### 回归\n\n回归与分类非常相似。分类和回归之间的唯一区别在于，回归是针对给定样本的输出结果，其中输出变量以实数值的形式呈现（例如，温度是一个数值，而不是“热”或“冷”的分类）。\n\
  \n例子包括身高、体温和体重。线性回归、多项式回归、支持向量机、集成方法、决策树和神经网络都是回归模型的例子。\n\n#### 预测\n\n这是一种基于过去和当前数据进行预测的方法。这也被称为时间序列预测。集成学习是一种监督学习类型，它结合多个不同的机器学习模型来预测新样本的结果。在集成学习中，模型本身成为了特征。\n\
  \n\n\n### 无监督学习\n\n当人们提到能够自主学习的系统时，实际上指的是无监督学习（见图 3-5）。在无监督学习中，学习算法不会收到数据的标签，而是由算法自行从输入中寻找结构。\n\
  \n![../images/459335_2_En_3_Chapter/459335_2_En_3_Fig5_HTML.jpg](img/459335_2_En_3_Fig5_HTML.jpg)\n\
  \n图 3-5\n\n无监督学习：工作原理\n\n由于数据未标记，因此无法评估算法输出结构的准确性。\n\n数据可能同时缺少分类和标签。因此，模型是通过解释来开发的：通过寻找输入数据中的隐藏结构和推断。这可以通过提取规则、减少数据冗余或组织数据的结果来实现。\n\
  \n这包括聚类、降维和关联规则学习。算法可能永远找不到正确的输出，而是对数据的底层结构进行建模。\n\n以下定义了三种类型的无监督学习问题。\n\n#### 关联\n\
  \n关联是发现集合中项目共现的概率。这在市场营销和医疗保健领域被广泛用于辅助决策。\n\n例如，这表示如果被诊断为肥胖，则患任何形式癌症的可能性百分比。关联类似于分类；然而，在关联中可以预测任何属性，而分类是二元的。\n\
  \n#### 聚类\n\n聚类是指将项目分组，使得同一聚类中的项目彼此之间的相似度高于与另一聚类中项目的相似度。\n\n#### 降维\n\n降维可以通过特征选择和特征提取来实现。降维可以在数学上重新表示或转换数据。\n\
  \n##### 特征提取\n\n特征执行从高维空间到低维空间的数据转换。这可以包括减少数据集的变量，同时保持数据完整性并确保最重要的信息得到表示。\n\n特征提取方法可用于降维。通常，会从原始特征集中创建一组新的特征。一个例子是将患者的所有临床测试结果组合成一个健康风险评分，该评分基于被证明会影响死亡率的测试结果。\n\
  \n减少维度数量有助于更轻松地可视化，尤其是在二维或三维空间中，同时还能减少存储所需的时间和空间。算法包括：\n\n*   Apriori 算法\n*   FP\
  \ 增长（也称为频繁模式增长）\n*   隐马尔可夫模型\n*   主成分分析（PCA）\n*   奇异值分解（SVD）\n*   k-Means\n*   神经网络\n\
  *   深度学习\n\n深度学习利用深度神经网络架构，这是一种机器学习算法。\n\n### 半监督学习\n\n半监督学习是一种混合方法，其中输入数据包含标记和未标记数据的混合。尽管可能存在期望的结果，但模型也会学习组织数据和进行预测的结构。示例问题包括分类和回归。\n\
  \n### 强化学习\n\n这是系统与动态环境交互的地方，其中智能体必须执行特定目标。强化学习是机器学习、行为心理学、伦理学和信息论之间的交叉点。\n\n算法在解决问题时会收到关于奖励和惩罚的反馈。强化学习允许智能体根据其当前状态以及通过学习能够最大化奖励的行为来决定下一个最佳行动。最优行动（或最优策略）通常通过试错和反馈来学习。这使得算法能够在上下文中确定理想的行为。\n\
  \n强化学习通常用于机器人技术，例如，一个机器人吸尘器通过碰撞桌子、椅子等接收负面反馈来学习避免碰撞——尽管如今这也涉及计算机视觉技术。\n\n强化学习与标准监督学习的不同之处在于，它从不呈现正确的示例，也从不明确纠正次优决策。其重点在于现实世界中的表现。\n\
  \n类似于人类的学习方式，强化学习假设了关于从自身经验中学习的理性行为，因此有助于理解人类如何从经验中学习以做出良好决策（见图 3-6）。\n\n![../images/459335_2_En_3_Chapter/459335_2_En_3_Fig6_HTML.jpg](img/459335_2_En_3_Fig6_HTML.jpg)\n\
  \n图 3-6\n\n强化学习：工作原理\n\n例如，DeepMind 让他们的 AlphaGo 智能体通过展示“大量强业余棋手的棋局来帮助它发展自己对合理人类棋局的理解，从而掌握中国古代围棋游戏。然后我们让它与不同版本的自己对弈数千次，每次从错误中学习并逐步改进，直到变得极其强大”[73]。\n\
  \n强化学习用于自动驾驶汽车。在现实世界中，智能体需要考虑环境的各个方面，包括当前速度、道路障碍物、周围交通、道路信息和操作员控制。\n\n智能体学会以适合环境特定状态的方式行动（或制定策略）。这引发了由人工智能和机器学习带来的、针对具有奖励驱动编程的智能体的新伦理困境。\n\
  \n\n\n### 数据挖掘\n\n数据挖掘，又称数据库知识发现，被定义为使用复杂算法探索数据以提取新信息（包括模式和关系）的过程。这可以应用于生活和工业的方方面面，并实现以下功能：\n\
  \n*   基于趋势和行为的模式预测\n*   基于可能结果的预测\n*   大型数据集（尤其是非结构化数据）的分析\n*   通过识别先前未知的事实进行聚类\n\
  \n数据挖掘利用机器学习、统计学和数据库技术的力量，是分析工作的核心（见图 3-7）。数据挖掘通常使用大量数据，也能提供更简单的描述性分析。例如，在医疗保健领域，数据挖掘应用可用于识别经常同时出现的病症或医疗程序。\n\
  \n![../images/459335_2_En_3_Chapter/459335_2_En_3_Fig7_HTML.jpg](img/459335_2_En_3_Fig7_HTML.jpg)\n\
  \n**图 3-7** 数据挖掘及其更广泛的协同作用\n\n数据挖掘最常见于对用户、客户或患者反馈的日常情感分析。\n\n数据挖掘还能通过识别数据内部的关系来进行预测。这可以帮助保险公司检测出有风险的客户行为模式。\n\
  \n机器学习可用于数据挖掘。数据挖掘将为决策提供信息，例如哪种学习模型最适合解决当前问题。然而，数据挖掘所涵盖的技术并不仅限于机器学习中的那些。在数据挖掘中，任务是发现未知知识，而机器学习的性能则是根据再现已知知识来评估的。\n\
  \n例如，如果你有一个患者血压的数据集，你可以进行异常检测，这被视为一项数据挖掘任务，用于识别先前未知的异常值。该任务可能会利用机器学习技术，也许是用于聚类分析的\
  \ k-means 算法，来识别异常数据并辅助算法的学习。\n\n数据挖掘与自然语言处理（NLP）不同。NLP 可能是数据挖掘中使用的一种技术，用于帮助智能体理解或“阅读”文本。数据挖掘算法包括：\n\
  \n*   C4.5\n*   k-Means\n*   支持向量机\n*   Apriori\n*   EM（期望最大化）\n*   PageRank\n*\
  \   AdaBoost\n*   kNN\n*   朴素贝叶斯\n*   CART（分类与回归树）\n\n### 参数化算法与非参数化算法\n\n算法在形式上可以是参数化的或非参数化的。可以简化为已知有限形式的算法被称为参数化算法，而非参数化算法则从训练数据中学习函数形式。\n\
  \n换句话说，对于非参数化算法，模型的复杂度会随着训练数据量的增加而增加。对于参数化模型，存在固定的结构或参数集，这使得参数化模型比非参数化模型更快。\n\n\
  如果非参数化模型在训练数据和训练时间方面获得了足够的训练资源，它们可以提供更好的准确性（见图 3-8）。\n\n![../images/459335_2_En_3_Chapter/459335_2_En_3_Fig8_HTML.jpg](img/459335_2_En_3_Fig8_HTML.jpg)\n\
  \n**图 3-8** 参数化算法与非参数化算法\n\n#### 何时使用参数化算法与非参数化算法\n\n参数化算法将函数简化为已知形式，并从训练数据中学习函数系数。因此，它们对数据做出了很强的假设。参数化算法的优势在于它们能快速从数据中学习，且不需要大量数据，可用于需要易于解释结果的场景。\n\
  \n非参数化算法使用数量可变的参数。k-近邻、神经网络和决策树都是非参数化算法，适用于数据量更大且对性能要求更高的场景。\n\n## 机器学习算法如何工作\n\n\
  监督学习是从带标签的训练数据中推断函数的计算机化任务。\n\n*   Y = f(x)，\n\n可以理解为：\n\n*   输出 = 函数(输入)。\n\n输入和输出可被称为变量，通常采用向量格式：f\
  \ 指的是你试图从输入中推断出的函数。\n\n以一位即将接受特定治疗的患者为例。在现实生活中，这个过程可能包括患者查看描述他们所推荐的药物或治疗特性的研究。\n\
  \n例如，如果他们看到研究主要由“好”、“棒”、“安全”等词语组成，那么我们会从情感分析中得出结论：该治疗是好的治疗，我们可以放心地接受它。而如果像“差”、“质量不好”、“不安全”这样的词语经常出现，那么我们会得出结论：最好寻找另一种治疗方法。这项研究帮助我们根据治疗研究中存在的词语模式来执行行动。\n\
  \n机器学习试图通过算法来理解这种人类决策过程。它专注于开发能够访问数据并利用数据自我学习的算法（或程序）。机器学习非常擅长分类和预测任务。\n\n机器学习最常用于预测分析——学习\
  \ Y = f(X) 的映射关系，以便对新的 X 值预测 Y 值。\n\n机器学习的实际例子如下：\n\n*   **欺诈检测**：x 是交易的属性，f(x)\
  \ 是交易是否存在欺诈。\n*   **疾病诊断**：x 是患者的属性，f(x) 是患者是否患有疾病。\n*   **语音识别**：x 是语音输入的属性，f(x)\
  \ 是对语音输入中包含的指令所给出的响应。\n\n机器学习的过程始于以示例、直接经验或指令形式提供的输入数据——目的是识别数据中的模式，并根据所提供的数据在未来做出更好的决策。\n\
  \n其目标是使程序能够在没有人工干预或协助的情况下自动学习，并相应地调整理性行动。\n\n## 结论\n\n读者应了解机器学习和数据挖掘、执行学习任务的方法以及使用这些技术时的关键考量。最重要的是，本章涵盖了机器学习算法的工作原理。\n\
  \n下一章将利用这些基础知识，重点讨论算法的选择与设计、模型考量以及最佳实践。\n\n\n"
- "# 4. 机器学习算法\n\n> *大自然并不觉得有必要遵循数学上精确的算法；事实上，大自然可能根本无法遵循算法。*\n> \n> —玛格丽特·韦特海姆\n\n\
  你不需要代数和统计学背景就能开始学习机器学习。前一章介绍了关键的 foundational 原则。但不要抱有幻想；数学是机器学习中极其重要的一部分。数学是理解算法如何运作的关键，也是从头开始编写机器学习项目是提升你数学和统计技能绝佳途径的原因。\n\
  \n不理解算法背后的基本原理，可能会导致对方法的理解有限，或对算法采取狭隘的解释。至少，理解算法所基于的数学原理是有用的，从而能更好地理解哪些机器学习技术最为合适。\n\
  \n公共领域中有数量庞大的机器学习算法。许多算法都是几个主要主题的变体（通常速度更快或计算成本更低）。学习器是任何机器学习算法的核心，它试图在训练和测试数据上最小化一个成本函数——也称为误差函数或损失函数。\n\
  \n你的许多机器学习项目将使用来自流行库（如 numpy、pandas、Matplotlib、SciPy、scikit-learn、scrapy、NLTK（自然语言工具包）等）的既定方法。\n\
  \n最常见的机器学习任务是分类、回归和聚类。\n\n有几种算法可用于离散预测函数，例如 k-近邻、支持向量机、决策树、贝叶斯网络和线性判别分析。\n\n本章对机器学习算法进行了全面分析，包括相关的编程库以及这些技术在现实世界中的应用示例。\n\
  \n## 定义你的机器学习项目\n\n汤姆·米切尔对机器学习给出了一个简洁的定义：“如果一个计算机程序在任务 T 上的性能（由 P 衡量）随着经验 E 的增加而提高，那么可以说该程序从关于某类任务\
  \ T 和性能度量 P 的经验 E 中学习” [75]。\n\n这个定义可用于辅助机器学习项目，帮助我们清晰地思考需要收集和利用哪些数据（E）、手头的任务是什么（T），以及我们将如何评估结果（P）。\n\
  \n### 任务 (T)\n\n任务指的是我们希望机器学习模型做什么。模型学习到的函数就是任务。这并非指实际学习的过程，而是指手头的任务。例如，一个机器人吸尘器的任务可能是清洁某个表面。通常，一个任务会被分解成更小的子任务。\n\
  \n### 性能 (P)\n\n性能是对机器学习模型能力的一种量化度量。性能通过成本函数来衡量，该函数通常计算模型在任务上的准确率。\n\n性能可以通过错误率来衡量，错误率是模型给出错误输出的样本比例。学习方法旨在最小化错误率，理想情况下避免陷入局部最小值或最大值。\n\
  \n### 经验 (E)\n\n经验指的是可用的标记数据量，以及机器学习模型所需的监督程度。\n\n米切尔的定义在定义机器学习项目时被证明非常有用。这个定义有助于理解需要收集的数据（E），这些数据会发展成知识库；需要决策的手头问题（T）；以及如何评估输出（P）。\n\
  \n例如，一个预测算法可能被分配任务 T，即根据过去医院入院记录及其各自日期和时间的经验数据 E，来预测急诊入院高峰。性能度量 P 可以是预测的准确率；随着模型获得更多经验数据，其预测能力理想情况下会变得更好。值得注意的是，单一标准并不一定能决定性能。\n\
  \n除了预测的准确率之外，一个高峰入院预测方法还可以通过预测那些成本最高或资源最密集的高峰期来提供额外信息。表 4-1 给出了任务和将创建的经验以及性能指标的示例。\n\
  \n表 4-1\n\n通过其组成部分理解学习问题\n\n| 问题 | 任务 | 性能 | 经验 |\n| --- | --- | --- | --- |\n|\
  \ **学习如何进行外科缝合** | 缝合患者头部 | 准确率（感知到的疼痛和/或时间可能是一个特征） | 缝合患者头部及对性能指标的反馈 |\n| **图像识别**\
  \ | 从图像中识别一个人的体重 | 体重预测的准确率 | 包含人物图像及其各自体重的训练数据集 |\n| **用于患者药物配送的机械臂** | 将正确的药物放入正确的患者药包中\
  \ | 正确放置药物的百分比 | 训练示例，真实经验 |\n| **预测疾病风险** | 诊断患 2 型糖尿病的可能性 | 正确诊断患者的百分比 | 患者健康记录的训练数据集，预测和反馈的真实经验\
  \ |\n\n机器学习用于回答诸如“我是否可能患有 2 型糖尿病？”、“这张图片中的物体是什么？”、“我能避开交通拥堵吗？”以及“这个推荐适合我吗？”等问题。\n\
  \n机器学习在这些问题领域中都得到了很好的应用，然而现实世界问题的复杂性意味着，目前不可能有一个专门的算法能在每种情况下、为每个人、每次都完美无瑕地工作——无论是在医疗保健还是任何其他行业。\n\
  \n数学中一个常见的格言来自英国统计学家乔治·博克斯：“所有模型都是错的，但有些是有用的。”机器学习的目的不是做出完美的猜测，因为根本不存在理想的模型。相反，机器学习建立在统计学基础之上，以提供有用、准确的预测，这些预测可以推广到现实世界。\n\
  \n在训练机器学习算法时，训练数据集必须是一个统计上显著的随机样本。如果不是这样，就存在发现不存在的模式（即噪声）的风险。对训练数据的记忆被称为过拟合。模型记住了训练数据，在训练中表现良好，但在面对未知数据时则表现不佳。同样，如果训练数据太少，模型可能会做出不准确的预测。\n\
  \n机器学习的目标，无论是有监督还是无监督，都是泛化——即基于过去经验表现良好的能力。\n\n\n\n## 机器学习的常用库\n\nPython 在数据科学和机器学习行业中日益流行。所有库都在\
  \ GitHub 上开源，这也提供了衡量其流行度和稳健性的指标：\n\n*   GitHub 是一项基于 Git 版本控制系统的服务。Git 存储数据的方式是流式的。Git\
  \ 会为你的文件拍摄快照，并存储对这些快照的引用。Git 有三种状态：已提交、已修改和已暂存，它们分别指代数据存储在本地文件系统中、本地文件发生更改以及标记为待提交的文件。使用元数据的好处在使用\
  \ GitHub 时显而易见。\n\n*   Numerical Python，即 numpy，是一个重要的 Python 扩展库。它提供了快速的 N 维数组对象，用于向量运算、数学函数、线性代数和随机数生成。如果没有这个库，基本的数组运算性能会明显变慢。\n\
  \n*   SciPy 是一个基于 numpy 构建的科学处理库。它支持线性代数例程，以及信号和图像处理、常微分方程方法和特殊函数。\n\n*   Matplotlib\
  \ 是一个提供类似数据绘图和可视化技术的 Python 库。Matlab 是用于数据处理的标准工具。然而，Matplotlib 的简洁性和实用性帮助 Python\
  \ 成为了 Matlab 的可行替代方案。\n\n*   Pandas 是一个用于数据聚合、数据操作和数据可视化的工具。在 pandas 中，一维数组被称为序列，多维数组则被称为数据框。\n\
  \n*   Scikit-learn 包含图像处理和机器学习技术。该库基于 SciPy 构建，支持聚类、分类和回归算法。这包括本章讨论的许多算法，例如朴素贝叶斯、决策树、随机森林、k-means\
  \ 和支持向量机。\n\n*   NLTK，即自然语言工具包，是一个用于自然语言处理的库集合。NLTK 为专家系统提供了基础，例如分词、词干提取、词性标注、句法分析和分类——这些对于情感分析和文本摘要至关重要。\n\
  \n*   Genism 是一个用于处理非结构化文本的库。\n\n*   Scrapy 是一个最初为抓取网站而设计的开源数据挖掘和统计工具。\n\n*   TensorFlow\
  \ 是一个由 Google Alphabet 支持的开源数据计算库，针对机器学习进行了优化。它支持多层神经网络和快速训练。TensorFlow 被用于谷歌的许多智能平台。\n\
  \n*   Keras 是一个基于 TensorFlow 构建的用于构建神经网络的库。\n\n## 监督学习算法\n\n在许多监督学习场景中，目标是微调一个预测函数\
  \ f(x)，即假设。学习过程包括使用数学算法在特定领域内表示输入数据 x。例如，x 可以取一天中的时间值，而 f(x) 可以是对某家医院等待时间的预测。\n\n\
  实际上，x 通常代表多个数据点。因此，输入被表示为一个向量。\n\n例如，在前面的例子中，f(x) 将输入 x 作为一周中的时间。为了改进预测器，我们可以不仅使用日期\
  \ (x[1])，还可以使用一天中的时间 (x[2])、天气 (x[3])、队列中的位置 (x[4]) 等等——前提是这些数据可用。决定使用哪些输入是机器学习设计过程中不可或缺的一部分。\n\
  \n数据集中的每条记录 i 都是一个特征向量 x(i)。在监督学习的情况下，每个实例还会有一个目标标签 y(i)。模型以 (x(i), y(i)) 的形式输入进行训练。训练数据集可以表示为\
  \ {(x(i), y(i)); i = 1, … , N}，其中 x 代表输入，y 代表输出。\n\n该模型具有简单的形式：\n\n*   f(x) = ax\
  \ + b，其中 a 和 b 是常数，b 指代数据中的噪声。\n\n机器学习旨在找到 a 和 b 的最优值，使得预测 f(x) 尽可能准确。学习方法是归纳式的。模型遍历训练数据集以学习数据中的模式。模型从一组示例中归纳出一个模式或假设。机器学习预测模型的输出与函数的实际值存在差异，这是由于偏差、噪声和方差造成的，如第\
  \ 3 章所述。\n\nf(x) 的优化通过训练示例进行。每个训练示例 {x[1] … x[n]} 都有一个输入值 x_training 和一个对应的输出 Y。\n\
  \n处理每个示例，并计算已知正确值 y（其中 y ∈ Y）与预测值 f(h_training) 之间的差异。在处理完训练数据集中适当数量的样本后，计算 f(x)\
  \ 的错误率，并使用 a 和 b 的值作为因子来提高预测的正确性。\n\n这也解决了数据中固有的随机性或噪声，也称为不可约误差。\n\n### 选择合适的特征\n\
  \n在特征选择方面，有两种不同的主要方法。第一种是基于数据一般特征的独立评估。属于这种方法的方法称为过滤方法，因为在模型构建之前，特征集就被过滤掉了。\n\n\
  第二种方法是使用机器学习算法来评估不同的特征子集，并最终选择在分类准确性上表现最好的那个。最终将使用后一种算法来构建预测模型。这类方法称为包装方法，因为生成的算法包装了整个特征选择过程。\n\
  \n大数定律适用于机器学习预测。该定理描述了大量相同实验的结果最终会收敛或趋于平均。\n\n这个过程会迭代，直到系统收敛到 a 和 b 的最佳值。这样，机器通过经验学习，并准备好进行部署。通常，我们关注的是最小化模型的误差，或做出尽可能准确的预测。\n\
  \n在监督机器学习中，有两种主要方法：基于回归的系统和基于分类的系统。\n\n### 分类\n\n分类是通过逼近一个映射函数 f，从一组离散的预定义类别（或标签\
  \ y）中确定一个项目（或多个项目 x）所属类别的过程。分类算法使用特征（或属性）来确定如何将项目分类到至少一个二元类或两个及以上的类中。\n\n训练数据以输入向量的形式提供。输入向量由项目特征的标签组成。例如，一个项目可能如下所示：\n\
  \n```\n{\"HbA1c, 7.8%\", \"Diabetic\"} 形式为 {x_training, output}\n```\n\n分类算法正是从这些数据中学习如何分类。分类问题需要对示例进行标记以确定模式；因此，模型分类准确性的最佳验证方式是通过所有预测中正确分类的示例数量。\n\
  \n执行分类的算法包括决策树、朴素贝叶斯、逻辑回归、kNN（k-最近邻）、支持向量机等。\n\n分类算法的常见用例包括：\n\n*   根据健康档案建议患者诊断——即，患者是否患有视网膜病变？\n\
  *   为患者推荐最合适的治疗方案\n*   确定诊所一天中就诊高峰的时段\n*   确定患者再次入院的风险\n*   对图像进行分类以识别疾病——例如，根据照片判断患者是否超重\n\
  \n\n\n### 回归\n\n回归涉及预测一个连续变量的输出。由于基于回归的系统预测的是一个数值，因此性能通过评估预测误差的数量来衡量。\n\n决定系数、平均绝对误差、相对绝对误差和均方根误差是用于评估回归模型的统计方法。\n\
  \n回归算法包括线性回归、回归树、支持向量机、K 近邻和感知机。\n\n通常可以在分类和回归问题之间进行转换。例如，患者的 HbA1c 值如果以连续数值形式存储，也同样有用。一个连续的\
  \ HbA1c 值（如 6.9%）可以根据基于 HbA1c 定义的规则分类为离散类别：糖尿病（集合 1，HbA1c ≥ 6.5%）和非糖尿病（集合 2，HbA1c\
  \ < 6.5%）。\n\n时间序列是指按时间顺序提供的输入数据。数据的顺序性增加了一个信息维度。时间序列回归问题非常常见。\n\n回归算法的常见用例包括：\n\
  \n*   根据既往血糖读数估算患者 HbA1c（时间序列预测）\n*   预测患者再次入院前的天数（可视为时间序列回归问题）\n*   基于临床数据估算患者死亡风险\n\
  *   预测出现健康并发症的风险\n*   预测办公室打印机何时会因其他员工的请求而排队\n\n## 决策树\n\n决策树是流程图，将决策过程表示为执行分类的规则。决策树从根节点开始，包含代表特征的内部节点和代表结果的分支。因此，决策树是分类问题的一种表示形式。\n\
  \n决策树可以被利用来使其更易于理解。每个决策树都是蕴含式（即 if-then 语句）的析取，而这些蕴含式是对于逻辑编程非常有用的霍恩子句。霍恩子句是文字的析取。\n\
  \n假设数据中没有不一致形式的错误，我们总是可以为训练数据集构建一个 100%准确率的决策树。然而，这在现实世界中可能无法实现，并且可能表明过拟合，我们将在后面讨论。\n\
  \n例如，以表 4-2 中的简化数据集为例，它可以表示为图 4-1 所示的决策树。\n\n表 4-2\n\n2 型糖尿病风险\n\n| 记录 | 不健康 | BMI\
  \ | 种族 | 结果 |\n| --- | --- | --- | --- | --- |\n| **人员 1** | 是 | >25 | 印度裔 | *高风险*\
  \ |\n| **人员 2** | 是 | <25 | 印度裔 | *低风险* |\n| **人员 3** | 是 | >25 | 白种人 | *高风险* |\n\
  | **人员 4** | 否 | <25 | 白种人 | *低风险* |\n| **人员 5** | 否 | >25 | 华裔 | *中风险* |\n\n对样本进行分类涉及将数据经过一系列有组织的测试以确定标签。树的构建和测试自上而下进行，如下所示：\n\
  \n1.  从模型的根节点开始。\n2.  等待直到所有样本都属于同一类别。\n3.  测试特征以基于成本函数确定最佳分割点。\n4.  沿着分支值到达结果。\n\
  5.  重复步骤 2。\n6.  输出叶节点。\n\n决策树学习的核心问题是将哪些节点放置在哪些位置，包括根节点和决策节点。\n\n主要有三种决策树算法。每种算法的区别在于选择节点或特征时所使用的度量或成本函数不同。根节点是顶部的节点。树被分割成多个分支，通过成本函数进行评估；不再分割的分支是终端节点、决策节点或叶节点。\n\
  \n决策树的有用之处在于，获取的知识可以以易于阅读和理解的格式表达（见图 4-1）。它模仿了人类的决策过程，其中由特征重要性、关系和决策决定的优先级是清晰的。它很简单，因为结果可以表示为一组规则。\n\
  \n![../images/459335_2_En_4_Chapter/459335_2_En_4_Fig1_HTML.jpg](img/459335_2_En_4_Fig1_HTML.jpg)\n\
  \n图 4-1\n\nn = 2 个节点的决策树\n\n决策树在表示大数据集和优先考虑最具区分度的特征方面具有优势。如果未设置决策树深度，它最终会学习所呈现的数据并导致过拟合。建议为决策树建模设置较小的深度。或者，可以对决策树进行剪枝，通常从最不重要的特征开始，或者结合使用降维技术。\n\
  \n过拟合是机器学习中常见的障碍，并且不仅限于决策树。所有算法都存在过拟合的风险，并且有多种技术可以克服这个问题。随机森林或丛林决策树在这方面非常有用。\n\n\
  剪枝通过移除提供信息最少的特征来减小决策树的大小。因此，最终的分类规则不那么复杂，并提高了预测准确性。\n\n模型的准确性计算为测试数据集中被正确分类的样本百分比：\n\
  \n*   真正例/TP：实际类别为“是”，预测类别也为“是”。\n*   假正例/FP：实际类别为“否”，预测类别为“是”。\n*   真负例/TN：实际类别为“否”，预测类别也为“否”。\n\
  *   假负例/FN：实际类别为“是”，但预测类别为“否”。\n*   准确率：(正确预测的观测数)/(总观测数) = (TP + TN)/(TP + TN +\
  \ FP + FN)。\n*   精确率：(正确预测的正例)/(总预测的正例) = TP/(TP + FP)。\n*   召回率：(正确预测的正例)/(总正确的正例观测数)\
  \ = TP/(TP + FN)。\n\n分类是机器学习中常用的方法；而 ID3（迭代二分器 3）、C4.5（分类 4.5）和 CART（分类与回归树）是常见的决策树方法，生成的树可用于对未来的样本进行分类。\n\
  \n\n\n### 迭代二分器 3（ID3）\n\nPython, scikit-learn；方法，decision-tree-id3\n\n罗斯·昆兰对决策树学习领域做出了重大贡献，开发了\
  \ ID3 和 C4.5 [76] 算法。ID3 算法使用信息增益作为代价函数，其理论基础源于“信息论之父”克劳德·香农的研究。信息增益通过一种称为熵的度量来计算。\n\
  \n熵用于衡量数据集的混乱程度或不纯度。给定一个任意分类 C，其类别为 {c1, … cn}，以及一组样本 S，其中 ci 的比例为 pi，则样本 S 的熵计算如下：\n\
  \n![$$ H(S)=\\sum \\limits_{X\\in X}-p(x){\\log}_2p(x) $$](img/459335_2_En_4_Chapter_TeX_Equa.png)\n\
  \n信息增益通过熵来计算。该值针对属性 A 相对于样本 S 给出。属性 A 可以取的值 {t1, … tn} 代表了集合 T 的全部。\n\n![$$ IG\\\
  left(A,S\\right)=H(S)-\\sum \\limits_{t\\in T}p(t)H(t) $$](img/459335_2_En_4_Chapter_TeX_Equb.png)\n\
  \nID3 选择信息增益最高的节点来生成数据子集，然后对这些子集递归地应用 ID3 算法。一个属性的信息增益可以理解为学习属性 A 的值后所期望的熵减。当所有属性用完或决策树能完全分类所有样本时，算法终止。ID3\
  \ 是一种分类算法，无法处理缺失值。\n\n例如，如果收到以下行，模型会将结果归类为高风险。种族可能是影响结果的一个决定因素。然而，没有足够的数据让模型学习潜在的结果。\n\
  \n| **记录** | **不健康** | **BMI** | **种族** | **结果** |\n| --- | --- | --- | --- | ---\
  \ |\n| **人员 5** | 否 | <25 | 华人 | ? |\n\n### C4.5\n\nPython, scikit-learn；方法，C45algorithm\n\
  \nC4.5 是建立在 ID3 基础上的增强算法，在选择属性时会考虑分支的数量和大小。C4.5 可以处理连续和离散标签，并使用增益率作为其分裂标准。随着数据集规模的增大，它在执行时间和准确性上都有所提升。\n\
  \nC4.5 引入了剪枝——一种也称为子树提升的自底向上技术——以及子树替换，以确保模型不会过拟合数据。\n\n### CART\n\nPython, scikit-learn；方法，cart\n\
  \nCART，全称为分类与回归树，是一种使用基尼指数作为代价函数的决策树算法。与 C4.5 一样，CART 以二叉树形式表示，可用于回归和分类问题。熵用于探索性分析，而基尼指数则用于最小化误分类。根节点代表输入变量\
  \ (x)，叶节点包含用于进行预测的输出变量 (y)。\n\n## 集成方法\n\n集成是一种机器学习算法形式，是机器学习领域中广泛使用的一种技术。集成方法使用一组机器学习模型或学习器。通过这种方式，一组弱学习模型被组合起来，以创建一个更精确的学习模型。\n\
  \n有两种类型的集成技术——装袋和提升。\n\n### 装袋\n\n装袋是一种集成技术，涉及使用自助采样技术（见图 4-2）从数据集中创建多个独立的模型。该技术通过减少方差来帮助降低误差。通常，由于异常行为被平均化，装袋可以改进预测。相比之下，一组迭代预测模型被称为提升。\n\
  \n![../images/459335_2_En_4_Chapter/459335_2_En_4_Fig2_HTML.jpg](img/459335_2_En_4_Fig2_HTML.jpg)\n\
  \n图 4-2\n\n装袋 vs. 提升\n\n在装袋中，从数据集 D 中有放回地抽取 n′ < n 个样本。每次都会随机选择特征来构建最佳分裂。\n\n使用平均值、多数投票或统计方法来确定模型的平均预测。随机森林决策树（见图\
  \ 4-3）扩展了装袋的概念，因为它们也使用特征的随机子集，从而减少了学习器之间预测的相关性。\n\n![../images/459335_2_En_4_Chapter/459335_2_En_4_Fig3_HTML.jpg](img/459335_2_En_4_Fig3_HTML.jpg)\n\
  \n图 4-3\n\n随机森林决策树\n\n#### 随机森林决策树\n\nPython, scikit-learn；方法，RandomForestClassifier\n\
  \n随机森林决策树是装袋的一个例子。随机森林通过同时训练多个决策树来创建，指的是一组决策树学习器的集合（因此得名“森林”）。随机森林的目的是防止过拟合。随机森林中的决策树越多，结果就越准确。\n\
  \n每个随机森林都会对数据集进行抽样，并随机选择特征子集进行决策。\n\n随机森林决策树可用于分类和回归问题。对于回归问题，取结果的平均值；而对于分类问题，则取多数类别。随机森林决策树是不同模型的集成。由于该过程通过结合多个模型的预测来减少算法中的方差，因此它是一种集成方法。\n\
  \n当数据通过自助法局限于分类或决策问题时，随机森林模型似乎表现得特别好。随机森林分类器的一个优点是它们也能处理缺失值。\n\n\n\n### 提升法\n\n\
  提升法是一种集成方法，通过迭代方式生成一系列预测模型。其核心理念是让每个新模型从先前模型的错误中学习。\n\n当有大量数据可用于预测时，通常会采用提升方法。\n\
  \n通过迭代创建新模型来补偿误差，这一过程“提升”了模型性能，将弱学习器转化为强学习器——从而降低其偏差和方差。该技术的每次迭代都会学习数据中的关系，随后分析误差，并对错误分类赋予权重。其目标是最大限度地减少前一个模型的误差。用于提升算法的底层机器学习方法可以是任何算法。\n\
  \n提升法通过以下过程实现：\n\n1.  数据被呈现。\n2.  在特征的最显著切分点上生成决策树桩。\n3.  对错误分类的观测值赋予权重。\n4.  重复此过程，并将所有树桩组合起来得到最终的分类器。\n\
  \n#### 梯度提升\n\nPython, scikit-learn; 方法, GradientBoostingClassifier, GradientBoostingRegressor\n\
  \n梯度提升有许多名称，包括多重加性回归树、随机梯度提升和梯度提升机。梯度提升是一种源自决策树的技术，由杰罗姆·弗里德曼在 2001 年将梯度提升概念应用于决策树时提出[77]。AdaBoost（Freund\
  \ 和 Shapire, 2001）是梯度提升的一个变体。在梯度提升中，模型是顺序训练的。每个迭代模型都致力于最小化损失函数[78]。\n\n与随机森林决策树类似，梯度提升由弱预测器构成。每个新树随后会使用前一个树先前错误分类的数据进行训练。这种迭代过程通过在学习早期完成较简单的预测后，专注于更具挑战性的数据，从而加速模型训练。\n\
  \nXGBoost，即极端梯度提升，是梯度提升的一个变体。XGBoost 增加了正则化，并利用分布式、多线程处理的计算能力，以获得更高的速度和效率。\n\n####\
  \ 自适应提升\n\nPython, scikit-learn, numpy; 方法, AdaBoostClassifier, AdaBoostRegressor\n\
  \n自适应提升是一种通过迭代从错误中学习的流行方法。决策树桩是弱学习器，仅通过一个规则来分割数据。通过关注被错误分类的样本，决策树桩得以改进。这些样本通过数据关联的权重来识别。模型可以从错误中学习，并提供比单个决策树偏差更低的最终解决方案。\n\
  \n## 线性回归\n\nPython, scikit-learn; 方法, linear_model.LinearRegression\n\n线性回归是一种连续的统计技术，用于理解输入（x：预测变量、解释变量或自变量）和输出（y：响应变量或因变量）之间的关系。顾名思义，线性回归（见图\
  \ 4-4）要求 y 由输入变量的线性组合计算得出。\n\n![../images/459335_2_En_4_Chapter/459335_2_En_4_Fig4_HTML.jpg](img/459335_2_En_4_Fig4_HTML.jpg)\n\
  \n图 4-4\n\n线性回归\n\n线性回归的目标是通过所有数据点放置一条最佳拟合线，通过最小化边际或残差变异，从而便于理解预测结果。\n\n![$$ \\\
  min \\sum {\\left({y}_i-{\\hat{y}}_i\\right)}², $$](img/459335_2_En_4_Chapter_TeX_Equc.png)\n\
  \n其中 y[i] 是实际观测到的响应值，![$$ {\\hat{y}}_i $$](img/459335_2_En_4_Chapter_TeX_IEq1.png)\
  \ 是响应变量的预测值，它们的差值是 y 的观测值与预测值之间的残差变异或差异。\n\n*   准则变量：我们正在预测的结果变量\n*   预测变量：预测所依据的变量\n\
  *   截距：最佳拟合线与 y 轴的交点\n\n当只有一个输入变量 x 时，这种技术称为简单线性回归。多元线性回归则评估两个或更多预测变量。\n\n![$$ {\\\
  displaystyle \\begin{array}{c}Y={\\beta}_0+{\\beta}_1X\\\\ {}{\\beta}_1=\\frac{\\\
  sum_{i=1}^m\\left({x}_i-\\overline{x}\\right)\\left({y}_i-\\overline{y}\\right)}{\\\
  sum_{i=1}^m{\\left({x}_i-\\overline{x}\\right)}²},\\\\ {}{\\beta}_0=\\overline{y}-{\\\
  beta}_1\\overline{x}\\end{array}} $$](img/459335_2_En_4_Chapter_TeX_Equd.png)\n\n\
  其中 y 是输出变量，x 是预测变量，B0 和 B1 是用于移动最佳拟合线而估计的系数，![$$ \\overline{x} $$](img/459335_2_En_4_Chapter_TeX_IEq2.png)\
  \ 指 x 的均值，B0 是偏差或截距（与 y 轴的交点），B1 是斜率或 y 每单位 x 增加/减少的速率。\n\n一旦模型学习了这些参数，它们就被用于根据新的、未见过的输入\
  \ X 来预测 y 的值。\n\n用于估计系数的流行技术包括普通最小二乘法和梯度下降法。给定一条通过具有线性关系的样本数据集放置的最佳拟合线，普通最小二乘法试图最小化每个数据点到回归线的平方距离之和。其目的是最小化残差平方和。通过迭代优化系数值来减少模型的误差。\n\
  \n普通最小二乘法从 B0 和 B1 的随机值开始。为每个（输入，输出）对计算误差平方和。选择一个学习率，它充当比例因子；然后优化系数以最小化误差，直到无法进一步改进为止。\n\
  \n学习率是一个超参数，其值通过实验确定。尝试不同的值，并使用产生最佳结果的值。\n\n对线性回归的批评主要集中在其简单性上，导致其无法捕捉数据中的复杂关系。模型也可能学习数据中的噪声，从而导致过拟合。\n\
  \n变量之间的关系并不总是线性的，因此，线性回归模型在处理具有非线性关系的数据时可能表现不佳。然而，有时可以通过变换变量来拟合线性回归模型。线性回归还假设变量是同方差的，这意味着向量中的所有变量都具有相同的方差。\n\
  \n以上内容完美地说明了为什么在训练模型时，应该使用多种机器学习算法。\n\n\n\n## 逻辑回归\n\nPython, scikit-learn; 方法,\
  \ linear_model.LogisiticRegression\n\n线性回归适用于连续变量，而逻辑回归的预测则是在应用转换函数后，适用于离散值或分类问题。\n\
  \n逻辑回归（或称 logit 回归）由统计学家戴维·考克斯于 1958 年提出，常用于二分类问题。例如，逻辑回归可用于预测患者在服用特定药物后是否会出现不良事件、患者是否可能再次入院，或者患者是否患有某种特定疾病。\n\
  \n与线性回归不同，该模型的输出形式是介于 0 和 1 之间的概率。预测输出是通过对输入 x 进行对数转换，并使用逻辑函数 h(x) = 1/(1 + e^–x)\
  \ 生成的。一个指定的阈值用于将此概率转换为二分类结果。\n\n逻辑回归使用 S 型函数，这是一种 S 形曲线（见图 4-5），它可以接受任何连续值，并将其映射为默认类别的介于\
  \ 0 和 1 之间的概率值。\n\n![../images/459335_2_En_4_Chapter/459335_2_En_4_Fig5_HTML.jpg](img/459335_2_En_4_Fig5_HTML.jpg)\n\
  \n图 4-5\n\n逻辑函数\n\nS 型函数：1/(1 + e^–value)，其中 e 是欧拉数，value 是需要转换的值。\n\n逻辑回归使用方程 P(x)\
  \ = e ^ (b0 + b1*x)/(1 + e^(b0 + b1*x))，该方程可转换为 ln(p(x)/1–p(x)) = b0 + b1*x)。与线性回归一样，b0\
  \ 和 b1 是从训练数据中学习到的值。\n\n举个例子，假设有一个模型用于判断皮肤表面的增生是否为良性。输入变量 x 可以是增生的大小、深度或纹理；默认变量\
  \ y = 1 表示良性增生。如图所示，逻辑函数将各个实例的 x 值转换为介于 0 和 1 之间的概率值。如果概率超过 0.5 的阈值，则该肿瘤被归类为良性。\n\
  \n逻辑回归旨在通过训练学习 b0 和 b1 的值，以最小化预测结果与实际结果之间的误差。最大似然估计是用于此目的的迭代过程。\n\n最大似然估计首先为每个预测变量随机分配一个最佳权重值，然后迭代调整这些系数，直到预测结果的能力不再提升。最终的系数值能够最小化预测概率中的误差。\n\
  \n与线性回归一样，逻辑回归假设输入变量和输出之间存在线性关系。可能需要进行特征降维，以将数据转换为线性模型。逻辑回归模型也容易过拟合，这可以通过移除高度相关的输入来克服。\n\
  \n最后，系数可能无法收敛，这在数据稀疏或高度相关时可能发生。\n\n## 支持向量机\n\nPython, scikit-learn; 方法, svm.SVC,\
  \ svm.LinearSVC\n\n支持向量机是一种非概率性的二分类线性分类器，可用于分类和回归问题。SVM 常与 NLP 方法一起用于分析文本，进行主题建模和情感分析。它也用于图像识别问题和手写数字识别。\n\
  \n该算法通过支持向量确定两个类别之间的超平面或最佳拟合线。支持向量是距离超平面最近的数据点，如果移除它们，超平面的位置将会改变。间隔值（即数据点到超平面的距离）越大，数据被正确分类的置信度就越高。最佳拟合线是通过一个旨在最大化间隔的优化过程学习到的。\n\
  \nSVM 使用一种称为核技巧的方法将数据映射到更高维的特征空间。数据通过核技巧被迭代地映射到更多维度，直到可以形成一个超平面来对其进行分类。\n\n以图 4-6\
  \ 中的问题为例。在左侧，我们看到在二维空间中不可能找到一条最佳拟合线。SVM 使用核技巧将数据映射到三维空间，并可以定义一个超平面来对数据进行分类。\n\n\
  ![../images/459335_2_En_4_Chapter/459335_2_En_4_Fig6_HTML.jpg](img/459335_2_En_4_Fig6_HTML.jpg)\n\
  \n图 4-6\n\nSVM 可视化\n\nSVM 接受数值输入，并且在小型数据集上表现良好。然而，随着维度的增加，理解和解释模型的能力会降低。随着数据集规模的增大，训练时间也会增加。SVM\
  \ 在处理噪声数据时能力也较弱。\n\nSVM 可以表示为支持向量的总和（见图 4-7）。\n\n![../images/459335_2_En_4_Chapter/459335_2_En_4_Fig7_HTML.jpg](img/459335_2_En_4_Fig7_HTML.jpg)\n\
  \n图 4-7\n\nSVM 表示为支持向量的总和\n\n## 朴素贝叶斯\n\nPython, scikit-learn; 方法, GaussianNB, MultinomialNB,\
  \ BernoulliNB\n\n朴素贝叶斯使用贝叶斯定理来计算在另一个事件已经发生的情况下，某个事件发生的概率。该算法之所以被认为是“朴素”的，是因为它假设所有变量彼此独立，这在现实世界的例子中并不典型。贝叶斯分类器通常在输入维度较高时使用。\n\
  \n例如，给定一个指定的阈值，该方法可用于概率性地判断一个向量属于某一类还是另一类：\n\nP(B|A) = (P(A|B) * P(B))/P(A)\n\n\
  ![../images/459335_2_En_4_Chapter/459335_2_En_4_Fig8_HTML.jpg](img/459335_2_En_4_Fig8_HTML.jpg)\n\
  \n图 4-8\n\n后验概率\n\n*   **P(B|A) =** 后验概率（图 4-8）：在给定数据 A 的情况下，假设 B 为真的概率，其中 P(B|A)=\
  \ P(a1|b) * P(a2|b) * … * P(an|b) * P(A)\n\n*   **P(A|B) =** 似然：在假设 B 为真的情况下，数据\
  \ A 的概率\n\n*   **P(A) =** 类别先验概率\n\n*   **P(B) =** 预测变量先验概率\n\n先验分布 P(B) 和似然概率 P(B|A)\
  \ 可以从训练数据中估计出来。为了计算一个样本属于哪个类别，需要计算其属于每个类别的概率。分配给样本的类别是能为其产生最高概率的类别。\n\n以表 4-3 作为一个简单示例，我们可以根据患者是否不健康来了解其患病风险的概率。为了确定\
  \ unhealthy = yes 的结果，我们计算 P(高风险|不健康) 和 P(低风险|不健康)，并选择概率最高的结果。\n\n表 4-3\n\n结果似然\n\
  \n| 记录 | 不健康 | 结果 |\n| --- | --- | --- |\n| **人员 1** | 是 | *高风险* |\n| **人员 2** |\
  \ 是 | *低风险* |\n| **人员 3** | 是 | *高风险* |\n| **人员 4** | 否 | *低风险* |\n\n*   P(高风险|不健康)\n\
  \n*   = (P(高风险|不健康) * P(高风险))/P(不健康) = (2/2 * 2/4)/(3/4) = 0.66\n\n朴素贝叶斯模型易于构建，并且对于大型数据集特别有用。除了其简单性（以及由此而来的“朴素性”）之外，朴素贝叶斯已知其性能甚至优于高度复杂的分类方法。\n\
  \n\n\n## kNN：k-最近邻算法\n\nPython, scikit-learn; 方法, neighbors.KNeighborsClassifier\n\
  \n不要与 k-means 聚类混淆，kNN 方法通过将未知对象 O 标记为其 k 个最近邻中多数样本的标签来进行分类。kNN 用于分类和回归问题，是一种非参数技术。它们不学习模型，而是将训练数据集存储为其表示形式，并通过类比学习对新样本进行分类。\n\
  \n由于不进行模型学习，kNN 被认为是懒惰学习器。\n\n每个对象代表 N 维空间中的一个点。如果某个邻居在特征空间中的距离最小，则将其定义为最近邻。计算未知对象与其邻居之间距离的方法之一，是使用\
  \ A = (a1 … an) 和 B = (b1 … bn) 之间的欧几里得距离，公式如下：\n\n![$$ d\\left(A,B\\right)=\\sqrt{\\\
  sum \\limits_{i=1}^n{\\left({a}_i-{b}_i\\right)}²} $$](img/459335_2_En_4_Chapter_TeX_Eque.png)\n\
  \n该算法的工作原理如下：\n\n1.  计算任意两点之间的距离。\n2.  基于这些成对距离找到最近邻。\n3.  根据最近邻列表对类别标签进行多数投票。\n\
  \n预测是在请求时进行的。在回归问题中，使用 k 个最相似实例的均值或中位数。在分类问题中，则从 k 个最相似实例中选择出现频率最高的类别。\n\n与大多数算法一样，距离度量方法可以有所不同。二进制向量之间的距离（汉明距离）以及实数向量之间绝对差的总和（曼哈顿距离）也常被使用。\n\
  \nkNN 的一个缺点是分类对象时需要大量的计算，因为必须计算训练数据集中所有邻居的距离。它不太适合高维数据。每个预测变量都可以被视为 N 维输入空间的一个维度。例如，x1\
  \ 是一维，x1、x2 是二维，以此类推。维度的增加会呈指数级扩大输入空间的体积。\n\nkNN 也不适合含有缺失值的数据，因为无法在缺失数据上计算向量之间的距离。\n\
  \n## 神经网络\n\n大脑工作的生物机制启发了人工神经网络，这是一种基于动物大脑并行架构的不同计算范式。\n\n神经网络因其能够对多维数据进行建模，并能高效地发现数据中的隐藏模式，非常适合数据挖掘任务。神经网络可应用于预测和分类问题。估计结果并将其与实际输出进行比较的过程称为前向传播。\n\
  \n神经网络是机器学习算法的一个子集，包括感知机、全连接神经网络、卷积神经网络、循环神经网络（RNN）、长短期记忆神经网络、自编码器、深度信念网络、生成对抗网络等等。其中大多数使用一种称为反向传播的算法进行训练。\n\
  \n人工神经网络（ANN）被广泛应用于众多任务：\n\n*   疾病分类——计算机可以学习患病器官（如肾脏、眼睛和肝脏）的图像特征，以预测疾病的可能性\n* \
  \  语音识别\n*   文本翻译与数字化\n*   人脸识别\n\n神经网络可以像人脑一样学习如何完成任务——通过监督学习、无监督学习以及强化学习。\n\n\
  ### 感知机\n\n感知机是人工神经网络的基本单元。在人工智能中，感知机是一个节点或单元，它接收多个输入并产生单个输出，通常为 1 或-1。感知机对输入进行加权求和得到\
  \ S，然后通过一个单元函数计算该节点的输出（见图 4-9）。单元函数可以是以下形式：\n\n![../images/459335_2_En_4_Chapter/459335_2_En_4_Fig9_HTML.jpg](img/459335_2_En_4_Fig9_HTML.jpg)\n\
  \n图 4-9\n\n人工神经元的配置\n\n*   线性函数——例如加权求和\n*   阈值函数——仅当加权和超过阈值时才触发\n*   阶跃函数——如果 S\
  \ 小于阈值，则输出相反值，通常为-1\n*   Sigma 函数（1/(1 + e^–s)），该函数支持反向传播\n\n感知机模仿生物神经元（见图 4-10），其中树突接收输入。如果在设定的时间范围内信号足够强，神经元就会向末梢发送电脉冲，然后被其他神经元的树突接收。每个感知机都有一个偏置，类似于线性函数\
  \ y = ax + b 中的 b。它通过上下移动直线来使预测更好地拟合数据。\n\n![$$ a=f\\left(\\sum \\limits_{i=0}^N{w}_i{x}_i\\\
  right), $$](img/459335_2_En_4_Chapter_TeX_Equf.png)\n\n其中 1 是 x[0]，b = w[0]。\n\n\
  ![../images/459335_2_En_4_Chapter/459335_2_En_4_Fig10_HTML.jpg](img/459335_2_En_4_Fig10_HTML.jpg)\n\
  \n图 4-10\n\n生物神经元的配置\n\n### 人工神经网络\n\nPython, scikit-learn; 方法, linear_model.Perceptron\n\
  \n人工神经网络由感知机构成，并包含一个或多个隐藏层（见图 4-11）。存在多种拓扑结构，其中最简单的是前馈网络。\n\n![../images/459335_2_En_4_Chapter/459335_2_En_4_Fig11_HTML.jpg](img/459335_2_En_4_Fig11_HTML.jpg)\n\
  \n图 4-11\n\n人工神经网络的组织结构\n\n反向传播是一种确定输出端误差（或损失）并将其传播回网络的方法。每个节点的权重都会被更新，以最小化每个神经元相应的误差输出。反向传播旨在通过更新各个神经元的权重，来最小化神经元的误差，从而最小化整个模型的误差。\n\
  \n神经网络模型需要完成的主要学习任务是训练神经元何时触发。一个 epoch 指的是前向传播和反向传播的一次训练迭代。在学习阶段，神经网络中的节点会根据上一次测试结果的误差来调整其权重。学习率控制着网络学习的速度。\n\
  \n模型中感知机或神经元的数量等于数据中变量的数量。某些表示形式还可能包含一个偏置节点。\n\n通常，人工神经网络中的神经元按层组织。每一层都可以对其接收的输入数据执行不同的变换。\n\
  \n## 深度学习\n\n深度学习是一种采用深层神经网络架构的过程。与其他类型的模型相比，训练深度人工神经网络模型需要更多的时间和 CPU 算力。值得注意的是，人工神经网络模型的性能不一定优于典型的监督学习技术。\n\
  \n深度学习并非一项新技术；然而，随着硬件（主要是算力和成本）的进步，使得此类计算变得可行，它正变得越来越普遍。\n\n深度神经网络（DNN）曾被 Alphabet\
  \ 公司用于打造史上最强的围棋选手，该选手在 2017 年击败了多位人类围棋冠军[74]。古老的围棋游戏历来被视为人工智能的挑战，它展示了深度学习的能力（见图\
  \ 4-12）。\n\n![../images/459335_2_En_4_Chapter/459335_2_En_4_Fig12_HTML.jpg](img/459335_2_En_4_Fig12_HTML.jpg)\n\
  \n图 4-12\n\n深度学习：它处于什么位置？\n\n人工神经网络有多种类型，包括以下几种。\n\n\n\n### 前馈神经网络\n\n在前馈神经网络中，加权输入的总和被传递到输出层（见图\
  \ 4-13）。当总和超过单位函数阈值时，输出被激活（通常为 1）。若未激活，则通常输出 –1。\n\n![../images/459335_2_En_4_Chapter/459335_2_En_4_Fig13_HTML.jpg](img/459335_2_En_4_Fig13_HTML.jpg)\n\
  \n图 4-13\n\n前馈神经网络\n\n### 循环神经网络：长短期记忆\n\n循环神经网络（RNN）会保存某一层的输出，并将其反馈回输入层，以改进输出层的预测结果（见图\
  \ 4-14）。因此，每个节点在执行计算时都具备记忆能力，并能利用序列信息。由此，节点被认为具有记忆功能。\n\n![../images/459335_2_En_4_Chapter/459335_2_En_4_Fig14_HTML.jpg](img/459335_2_En_4_Fig14_HTML.jpg)\n\
  \n图 4-14\n\n循环神经网络\n\n### 卷积神经网络\n\n卷积神经网络是一种深层的前馈神经网络。其网络层被称为卷积层，常用于语音识别、空间数据处理、自然语言处理和计算机视觉问题。不同的卷积层通常针对特定问题的不同方面。\n\
  \n例如，在判断一张照片中是否包含人脸时，深度神经网络中的不同卷积层可用于识别人脸的不同特征——如眼睛、鼻子、耳朵、嘴巴等。\n\n### 模块化神经网络\n\n\
  与人类大脑类似，模块化神经网络的概念是多个神经网络协同工作。\n\n### 径向基神经网络\n\n这是一种使用径向基激活函数的神经网络，其函数值取决于与原点之间的距离（见图\
  \ 4-15）。\n\n![../images/459335_2_En_4_Chapter/459335_2_En_4_Fig15_HTML.jpg](img/459335_2_En_4_Fig15_HTML.jpg)\n\
  \n图 4-15\n\n径向基神经网络\n\n人工神经网络和深度学习的关键优势在于能够从训练数据集中生成复杂的线性和非线性模型。\n\n深度神经网络（即深层、多层的\
  \ ANN）可以仅从训练数据中学习数据间的复杂关系，这通常能提升模型的泛化能力。然而，深度神经网络仍可能出现过拟合问题，因此可能需要进行适当的剪枝。顾名思义，深层网络也可能需要很长的训练时间，并且需要大量的训练样本。\n\
  \n神经网络的一个常见问题（尤其在医疗保健领域）是，它们像一个“黑箱”，没有为用户提供清晰的界面来理解其发现。实际上，人工神经网络模型难以解释，其权重和偏差并不能直观地反映模型中哪些因素重要。\n\
  \n通常认为，对于监督学习问题，防止过拟合的神经元数量上限为：\n\nN[h] = N[s] / (α * (N[i] + N[o]))\n\n其中：\n\n\
  *   N[i] = 输入神经元数量\n*   N[o] = 输出神经元数量\n*   N[s] = 训练数据集中的样本数量\n*   α = 任意缩放因子\n\
  \n## 无监督学习\n\n无监督学习是指从未标记数据中学习模型的过程。这意味着只提供输入数据 (x)，而不提供输出数据 (y)。算法需要自行发现数据中的模式，因此没有绝对的正确或错误答案。\n\
  \n当提供了部分输出标签 (y) 时，则称为半监督学习。例如，在利用部分标记的患者眼部扫描数据来学习预测青光眼的模型中，学习过程就是半监督的。如果只有一部分眼部扫描数据带有正确的输出标签（例如，青光眼、非青光眼），模型可能没有足够合适的数据来学习。随着更多标记数据提供给模型进行训练，系统的准确性可能会提高。\n\
  \n无监督学习在时间、资金和专业知识方面可能消耗较大。通常，通过改进数据标记可以大幅提升模型的准确性。\n\n无监督学习主要包含两个核心概念：聚类和关联。\n\n\
  ### 聚类\n\n聚类是指发现数据内部关系的过程。聚类在医疗保健领域有多种用途，包括：\n\n*   将具有相似特征的患者分组以进行监测\n*   检测索赔或交易中的异常值或离群点\n\
  *   根据药物或病情定义治疗组\n*   通过运动传感器检测活动\n\n### K-Means 算法\n\nPython, scikit-learn; 方法,\
  \ cluster.KMeans\n\nK-Means 聚类（见图 4-16）旨在数据中找到 k 个相似的组。K-Means 是一种迭代算法，它计算所定义的 k\
  \ 个簇的质心，并将所有训练数据分配到相应的簇中。\n\n![../images/459335_2_En_4_Chapter/459335_2_En_4_Fig16_HTML.jpg](img/459335_2_En_4_Fig16_HTML.jpg)\n\
  \n图 4-16\n\nK-Means 聚类\n\n数据点的分配依据是该数据点与其质心之间的距离。簇质心是一组定义最终簇的属性值的集合。\n\n![$$ \\\
  underset{c_i\\in C}{\\arg \\min } dist{\\left({c}_i,\\kern0.5em x\\right)}², $$](img/459335_2_En_4_Chapter_TeX_Equg.png)\n\
  \n其中 c[i] 是集合 C 中的质心集合，距离 (dist) 为标准欧几里得距离。\n\n与在数据探索之前预先定义分组不同，聚类使模型能够自行发现自然形成的分组。\n\
  \nK-Means 算法的步骤如下：\n\n*   步骤 1：设定 k 值。此处，我们设 k = 2。\n    *   将每个数据点随机分配到 k = 2 个簇中的任意一个。\n\
  \    *   确定每个簇的质心。\n*   步骤 2：对于每个数据点，将其分配到最近的簇质心。\n*   步骤 3：为新的簇重新计算质心。\n*   步骤\
  \ 4：重复此过程，直到簇质心不再变化。\n\n\n\n### 关联规则\n\n关联规则学习方法能够提取出最能解释数据中变量间感知关系的规则。这些规则可以在大型多维数据集中发现有用的关联，从而用于驱动和优化决策。\n\
  \n关联规则学习在历史上最经典的应用场景是分析在线购物结账时收集的用户购买习惯数据集。例如，当有人购买披萨时，他们可能也会倾向于购买葡萄酒，就像购买生菜的人可能也会倾向于购买西红柿、黄瓜和洋葱一样。通过分析交易数据集，可以预测商品之间关联的概率。我们知道某些物品（无论是食品、衣物，甚至是疾病）经常同时出现，而关联规则学习正是为了理解这些关系。\n\
  \n特别是在医疗保健领域，理解关联性症状有助于更好地预测和诊断疾病及不良事件。根据药物和相关的患者合并症路径来确定潜在的不良反应，可以改善护理和治疗路径。\n\n\
  需要熟悉三个重要的度量指标。\n\n#### 支持度\n\n支持度是绝对频率的值。如果数据集 T 中有 sup% 的交易包含 X U Y，则关联规则在数据集 T\
  \ 中以支持度 sup 成立。这表示一个项集的流行程度，通过该项集出现的交易比例来衡量：\n\n*   sup = Pr(X U Y) = count(X U\
  \ Y) / 总交易数\n\n#### 置信度\n\n置信度度量表示相关频率。如果包含 X 的交易中有 conf% 也包含 Y，则关联规则在数据集 T 中以置信度\
  \ conf 成立。这估计了当项 X 出现时，项 Y 在交易数据集中出现或存在的可能性。这表示为 {X → Y}，并衡量了包含项 X 的交易中，项 Y 也同时出现的比例：\n\
  \n*   conf = Pr(Y|X) = count(X U Y) / count(X)\n\n#### 提升度\n\n提升度在考虑 Y 的流行程度的同时，确定了在\
  \ X 出现的情况下 Y 出现的可能性：\n\n*   提升度 = 支持度 (X U Y) / (支持度 (X) * 支持度 (Y))\n\n关联规则确定了在\
  \ X 出现的情况下 Y 出现的概率。这些关联的优势在各行各业都有应用。有许多关联规则挖掘算法采用不同的策略来理解关联，并使用不同的数据结构。\n\n### Apriori\
  \ 算法\n\nApriori 是最流行的关联规则挖掘算法。Apriori 算法常用于模式挖掘以及识别经常同时出现的特征和项。它被广泛用于购物篮分析，是发现隐藏特征模式的强大工具。它通常应用于交易数据库，以挖掘频繁关系并生成关联规则。\n\
  \nApriori 算法从一组 n 个项开始。该算法计算所有可能的候选项集（或称频繁项集），这些项集满足指定的支持度和置信度阈值。Apriori 性质指出，对于一个项集是频繁的，其所有子集也必须是频繁的。Apriori\
  \ 算法采用自底向上的方法；先识别频繁子集，然后每次增加一个项。\n\nApriori 方法相对简单（见图 4-17）：\n\n![../images/459335_2_En_4_Chapter/459335_2_En_4_Fig17_HTML.jpg](img/459335_2_En_4_Fig17_HTML.jpg)\n\
  \n图 4-17\n\nApriori 算法\n\n*   应用最小支持度，在数据集 T 中找到所有包含 k 个项的频繁项集，其中频繁项集的支持度 ≥ min(sup)。\n\
  \n*   使用频繁 k-项集，扩展选择范围以找到包含 k + 1 个项的频繁项集。\n\n一个项集的最大大小为 k，即项的数量。\n\n## 降维算法\n\n\
  尽管普遍认为数据越多越好，但数据集通常包含大量变量，这使得捕捉数据中的信号成为一项更费力的任务。无论是处理稀疏值、缺失值、识别相关特征、提高资源效率，还是为了更直观的解释，降维算法对数据科学家来说都非常有用。\n\
  \n顾名思义，降维算法（DRAs）减少了数据集中存在的维度数量。当你考虑到用于做出精确决策的丰富数据时，降维的必要性就显而易见了：\n\n*   手机收集了数百个数据点，包括通话、短信、步数、消耗的卡路里、爬楼梯层数、互联网使用情况等等。哪些数据最能用于理解手机使用情况？\n\
  \n*   社交媒体上的品牌正在收集关于参与度和互动的数据，例如评论、点赞、关注者、情感和情绪。哪些数据最能用于理解对健康的态度？\n\n*   医疗健康记录包含大量信息，但只有部分信息与预测疾病风险或病情进展相关。哪些数据与理解未来的疾病或不良事件风险相关？\n\
  \n降维指的是将包含多个维度的数据集转换为更少的维度，同时简洁地表示相似的数据。\n\n图 4-18 中的图表显示了数据集中厘米和英寸之间的关系。这种二维表示可以简洁地转换为一维表示，从而改善可视化效果以便于理解。N\
  \ 维数据可以降为 k 维，其中 k < N。\n\n![../images/459335_2_En_4_Chapter/459335_2_En_4_Fig18_HTML.jpg](img/459335_2_En_4_Fig18_HTML.jpg)\n\
  \n图 4-18\n\n降维\n\n可以识别或组合有价值的维度，或者创建新的维度来表示内在关系。\n\n降维在机器学习任务中极其有用，具有众多优点：\n\n*\
  \   与原始数据集相比，更少的维度意味着更快的计算速度。\n\n*   默认情况下，降维算法减少了所需的存储空间。\n\n*   将数据减少到三个维度以下，便于可视化和更容易理解。\n\
  \n*   移除了冗余数据，从而提高了机器学习模型的性能。\n\n*   移除了噪声，从而提高了模型性能。\n\n## 降维技术\n\n可以通过多种方式实现降维。\n\
  \n### 缺失/空值\n\n孤立来看，缺失数据和空值并不是一个大问题，但不断增长的空值数量可能有助于决定是删除变量、忽略缺失值，还是计算一个预测值。\n\n\
  大多数数据科学家支持，如果一个属性有超过 50% 的空值或缺失值，则删除该变量。这个阈值会有所不同。\n\n### 低方差\n\n彼此非常相似的数据属性携带的信息不多。因此，数据内部的方差很小。因此，可以设置一个较低的方差阈值，并据此移除维度。\n\
  \n由于方差依赖于取值范围，因此应首先进行数据归一化。\n\n### 高相关性\n\n具有相似数据趋势的属性很可能携带相似的信息。多重共线性是指携带相似信息，这会降低模型的性能。连续数据之间的相关性由皮尔逊积矩相关系数确定，该系数衡量两个变量\
  \ X 和 Y 之间的线性相关性。\n\n对于离散数据，皮尔逊卡方值用于确定数据集之间观察到的任何差异是由偶然因素引起的可能性有多大。\n\n\n\n### 随机森林决策树\n\
  \n随机森林决策树集成方法有助于识别关键特征。随机森林决策树使用特征子集来识别最佳分裂属性。\n\n如果某个属性经常被选为最佳分裂节点，那么它很可能是一个值得保留的特征。决策树在可视化降维方面也特别有用。\n\
  \n### 反向特征消除\n\n在反向特征消除中，模型对 n 个属性进行训练。从 n 个属性开始，在每次迭代中，模型都会对 n-1 个属性进行 n 次训练。导致错误率增幅最小的属性被移除，然后算法对\
  \ n-1 个属性执行下一次迭代。\n\n在每次迭代 k 中，都会训练一个具有 n-k 个属性的模型。这种方法计算成本很高。\n\n### 前向特征构建\n\n\
  前向特征构建与反向特征消除相反。模型从一个属性开始，评估哪个属性带来的性能提升最大。与其相反的方法反向特征消除类似，除非在较低维度范围内操作，否则此方法的计算成本也很高。\n\
  \n### 主成分分析（PCA）\n\n主成分分析通过将原始变量集转换为一组新变量（即主成分）来减少变量（轴）的数量（见图 4-19）。此过程迭代计算数据中特征内的最大方差。\n\
  \n![../images/459335_2_En_4_Chapter/459335_2_En_4_Fig19_HTML.jpg](img/459335_2_En_4_Fig19_HTML.jpg)\n\
  \n图 4-19\n\nPCA\n\n每个主成分都是正交的，并且是原始变量的线性组合。正交性表明各主成分之间的相关性为零。\n\n第一主成分是具有最大方差的原始维度的线性组合；第\
  \ n 个主成分是具有最高方差的线性组合，并且与第 n-1 个主成分正交。\n\n## 自然语言处理（NLP）\n\n自然语言处理是专注于语言的人工智能领域。自然语言处理（NLP）被定义为系统分析、理解和生成人类语言（包括语音和文本）的能力。\n\
  \nNLP 是计算语言学（使用计算机科学研究语言学）的一个方面，在以下方面非常有用：\n\n*   在数据集中检索结构化和非结构化数据，例如，通过关键词或短语搜索临床笔记\n\
  *   社交媒体监控\n*   问答：解释来自人类的自然语言以进行适当交互，例如，与虚拟助手或语音识别软件交互\n*   分析文档以确定关键发现\n*   能够解析和解释文本以理解情感和情绪\n\
  *   识别诊断和关系之间的区别\n*   图像到文本识别，例如，读取标志或菜单\n*   机器翻译——NLP 用于机器翻译程序，其中一种人类语言被自动翻译成另一种人类语言\n\
  *   主题建模——这份文档在谈论什么？\n*   理解来自社交媒体或讨论帖子的情感\n\n解释自然语言充满挑战，因为人类语言天生具有歧义性——语言、发音、表达和感知。\n\
  \n尽管人类语言有规则，但它们经常被误解和误用。NLP 考虑语言的结构来推导含义。单词构成短语；短语构成句子；句子构成文档；所有上述内容都传达思想。\n\nNLP\
  \ 拥有一套文本处理程序工具包，包括一系列可用于模型开发的数据挖掘方法。由于非结构化数据的性质，NLP 任务在计算资源和时间方面可能成本高昂。神经网络和深度学习也可用于\
  \ NLP 任务。\n\n由于生成的大部分数据以非结构化数据的形式存在，NLP 是解释和理解自然语言的强大工具。\n\n与计算的任何方面一样，在继续之前需要理解几个术语：\n\
  \n*   **分词**：将文本语料库转换为更小单元（即标记）的过程。有许多算法可用于将文本分解为标记。\n*   **标记**：文本中存在的单词或实体。\n\
  *   **文本对象**：一个句子、短语、单词或一篇文章。\n*   **词干提取**：一种基本的基于规则的过程，用于去除单词的后缀（“ing”、“ly”、“es”、“s”等）。\n\
  *   **词干**：词干提取后创建的文本。\n*   **词形还原**：根据词典和词法分析确定单词的词根。\n*   **语素**：语言中的意义单位。\n*\
  \   **句法**：排列符号（单词）以构成句子。它涉及确定单词在句子和短语中的结构作用。\n*   **语义学**：单词的含义以及如何将单词组合成有意义的短语和句子。\n\
  *   **语用学**：在不同情境下使用和理解句子，以及解释如何受到影响。\n\n在本节中，我旨在介绍 NLP 的关键概念和方法，并演示可应用于数据集以产生定义价值的技术。\n\
  \n### NLP 入门\n\n为 NLP 模型提供一个输入句子并接收有用的输出需要几个关键组件（见图 4-20）。\n\n![../images/459335_2_En_4_Chapter/459335_2_En_4_Fig20_HTML.jpg](img/459335_2_En_4_Fig20_HTML.jpg)\n\
  \n图 4-20\n\nNLP 的工作原理\n\n## 预处理：词法分析\n\n与任何数据集一样，与数据上下文无关的文本语料库可以被理解为噪声。NLP 的第一阶段是清理和标准化输入文本，确保其无噪声并准备好进行分析。\n\
  \n除了拼写纠正和语法纠正之外，以下技术用于减少噪声。\n\n### 噪声去除\n\n噪声去除涉及准备一个噪声标记（即单词）词典，并解析文本，移除在噪声词典中找到的标记。例如，像\
  \ the、a、of、this、that 等单词将被移除。\n\n### 词汇规范化\n\nFollow、following、followed 和 follower\
  \ 都是单词 follow 的变体。在上下文上，这些单词是相似的。词汇规范化通过词干提取（去除前缀和后缀）和词形还原（一种使用单词结构和语法关系的定义过程）来降低维度。\n\
  \n### Porter 词干提取器\n\nPython，NLTK；方法，PorterStemmer\n\nPorter 词干提取算法是一种流行且有用的方法，用于提高信息检索的效率\
  \ [81]。该算法的工作原理基于英语中许多单词共享一个共同词根。词干提取作用于后缀，并去除单词中常见的形态和屈折词尾。因此，词干提取允许将相似的单词归约为一个共同的词根形式。\n\
  \n例如，以文本“I felt troubled by the fact that my best friend was in trouble. Not only\
  \ that, but the issues I had dealt with yesterday were still troubling me.”为例。\n\
  \n单词 troubled、trouble 和 troubling 都共享共同的词根 trouble。因此，根据 Porter 词干提取算法，不是将这三个单词各计数一次，而是将词干\
  \ trouble 计数三次。词干提取的好处在于，可以将常见单词聚类在一个共同的词干下，从而更准确地统计某个单词的出现次数。然而，词干提取的一个缺点是单词的语义含义可能会丢失。\n\
  \n词干提取和词形还原用于将单词的屈折形式，有时也包括派生相关形式，归约为一个共同的基式。\n\n\n\n### 对象标准化\n\n文本语料库中可能包含词典中查不到的词。例如，在推特上，有人可能会提到“DM’ing\
  \ someone”（给某人发私信），或者另一个人可能会点赞别人的“RT”（转发推文）。缩写词、话题标签、俚语和口语化表达可以通过预先准备好的词典或使用正则表达式来移除。\n\
  \n## 句法分析\n\n为了进行分析，文本需要被转换成特征。文本的句法分析涉及分析句子以理解词语之间的关系，并为其分配一个句法结构。句法分析有多种算法；然而，**上下文无关文法**因其是最简单的文法形式而被广泛使用，因此也最为流行。\n\
  \n以句子“David saw a patient with uncontrolled type 2 diabetes.”（大卫看到一位患有未受控制的 2 型糖尿病的病人。）为例。\n\
  \n在句子中，我们需要识别主语、宾语、噪声和属性，以理解词语的顺序及其依赖关系。\n\n### 依存句法分析\n\n工具包：NLTK；方法：StanfordDependencyParser\n\
  \n句子由词语按结构组成。基础语法可以确定结构之间的关系或依存关系。依存句法分析以树状结构表示这种关系，并呈现语法和词语的排列（见图 4-21）。\n\n![../images/459335_2_En_4_Chapter/459335_2_En_4_Fig21_HTML.jpg](img/459335_2_En_4_Fig21_HTML.jpg)\n\
  \n图 4-21\n\n依存句法分析\n\n依存语法分析的是词元之间的非对称二元关系。来自 NLTK 的 Stanford 解析器常用于此目的。\n\n使用图\
  \ 4-21 中的示例，解析树确定句子的根词为“saw”（看见），然后由子树连接。子树按主语和宾语划分，每个子树也显示了依存关系。\n\n### 词性标注\n\n\
  工具包：NLTK；方法：word_tokenize\n\n词性标注涉及将句子中的每个词或词元与一个词性标签关联起来。这些标签是你在小学学到的基本英语标签，用于确定名词、动词、形容词、副词、数词等。\n\
  \n这对于构建解析树等任务特别有用——解析树反过来又可用于确定某物是什么、情感分析、确定问题的合适答案或理解相似实体（见图 4-22）。\n\n![../images/459335_2_En_4_Chapter/459335_2_En_4_Fig22_HTML.jpg](img/459335_2_En_4_Fig22_HTML.jpg)\n\
  \n图 4-22\n\n词性标注\n\n词性标注是多个领域辅助工作的基础。\n\n#### 减少歧义\n\n有些句子因结构不同而有多种含义；例如，以下两个句子：\n\
  \n“I managed to read my book on the train.”（我设法在火车上读了我的书。）\n“Can you please book\
  \ my train tickets?”（你能帮我订火车票吗？）\n\n词性标注将第一个句子中的“book”识别为名词，将第二个句子中的“book”识别为动词。\n\
  \n#### 识别特征\n\n通过识别词语在不同上下文中的词性类型，词性标注可以区分不同用法，并为后续使用创建更强的特征。\n\n#### 规范化\n\n词性标签是规范化和词形还原的基础，用于理解句子结构和依存关系。\n\
  \n#### 停用词移除\n\n词性标注在从文本中移除常用词（即停用词）方面很有用。\n\n## 语义分析\n\n语义分析是自然语言处理中最复杂的阶段。它从文本中提取确切的含义或字典含义。利用关于上下文中的词语和句子结构的知识，规定词语、短语、句子和文本的含义，进而规定其目的和后果。\n\
  \n## 自然语言处理中使用的技术\n\n在对语料库进行数据预处理、词汇分析、句法分析和语义分析之后，我们需要将文本转换为数学表示形式，以便进行评估、比较和检索。例如，在患者档案集合中搜索患有“hypertension”（高血压）的用户，应该只找出那些患有高血压的用户。这是通过将文档转换为向量空间模型来实现的，其中评分和词项权重对于查询排序和搜索检索至关重要。\n\
  \n文档可以是患者记录、网页、数字化书籍等形式。以下算法在比较和评估过程中很典型。\n\n### N-gram\n\nPython：NLTK；方法：ngrams\n\
  \nN-gram 用于许多自然语言处理问题。如果 X = 给定句子 K 中的词数，那么句子 K 的 n-gram 数量为\n\n![$$ N\\kern0.5em\
  \ {grams}_K=X-\\left(N-1\\right) $$](img/459335_2_En_4_Chapter_TeX_Equh.png)\n\n\
  例如，如果 N = 2（二元组），句子“David reversed his metabolic syndrome”（大卫逆转了他的代谢综合征）将产生以下 n-gram：\n\
  \n*   David reversed\n*   Reversed his\n*   His metabolic\n*   Metabolic syndrome\n\
  \nN-gram 保留了文本输入中 N 个项目的序列。N-gram 可以有不同的 N 值：当 N = 1 时称为一元组，N = 2 时称为二元组，N = 3 时称为三元组。\n\
  \nN-gram 广泛用于拼写纠正、词语分解和文本摘要。\n\n### TF–IDF 向量\n\n一个文档可以表示为词语空间中的一个高维向量。向量中的每个条目对应文档中的一个不同词项及其出现次数。TF–IDF（词频-逆文档频率）向量方案使用以下公式为文档中的每个词项分配权重：\n\
  \n![$$ {W}_{td}={f}_{td}.\\log \\left(\\frac{D}{ND_t}\\right) $$](img/459335_2_En_4_Chapter_TeX_Equi.png)\n\
  \n每个词项的权重（W[td]）通过将词项频率（f[td]）乘以文档总数（D）除以包含该词项至少一次的文档数（ND[t]）的对数来计算。词项的排列顺序不一定保持不变。\n\
  \n收集到的词项权重随后可用于确定包含特定词项频率较高的文档。一组 TF–IDF 向量可用于表示用户的兴趣。\n\n### 潜在语义分析\n\n当存在包含大量文档的语料库时，对于每个文档\
  \ d，表示每个文档的向量的维度通常可能超过数千。潜在语义分析依赖于这样一个直觉：文档中的词项通常可能是相关的。例如，如果文档 d 包含词项“sea”（大海），它通常也会包含词“beach”（海滩）。\n\
  \n同样地，如果表示 d 的向量在“sea”条目中有一个非零分量，那么它在“beach”条目中也会有一个非零分量。如果能够检测到这种结构，就可以从数据中自动学习词语之间的关系。\n\
  \n词-文档矩阵由矩阵 A 表示，该矩阵使用奇异值分解进行分解，以给出最显著相关性的强度及其方向。\n\n对 A 的分解使得人们能够通过词项之间的相关性及其在文档中的重要性来发现文档的语义。潜在语义分析方法可用于确定各种材料的上下文，从而向网络用户呈现上下文相关的结果。\n\
  \n\n\n### 余弦相似度\n\nPython, SciPy；方法，余弦\n\n余弦相似度是一种衡量两个向量之间相似度的指标。因此，它既可以用于定义两个文档之间的相似度，也可以用于定义文档与查询之间的相似度。\n\
  \n两个向量之间的余弦相似度可以定义如下：\n\n![$$ Sim\\left(u,v\\right)=\\frac{u\\cdot v}{\\left\\Vert\
  \ u\\right\\Vert \\cdot \\left\\Vert v\\right\\Vert } $$](img/459335_2_En_4_Chapter_TeX_Equj.png)\n\
  \n两个向量之间的相似度是通过计算向量的内积，再除以这两个向量长度的乘积得到的。直观上，两个文档之间的夹角越大，它们的相似度就越低。这适用于任何 N 维空间中的向量。\n\
  \n此外，TF–IDF 向量方案可以与余弦相似度指标相结合，以确定搜索查询与大量文档之间的相似度：\n\n![$$ Sim\\left(q,d\\right)=\\\
  frac{\\sum \\limits_{t\\in q\\cap d}{W}_{td}\\cdot {W}_{tq}}{\\left\\Vert d\\right\\\
  Vert \\cdot \\left\\Vert q\\right\\Vert } $$](img/459335_2_En_4_Chapter_TeX_Equk.png)\n\
  \n查询 q 与文档 d 之间的相似度计算方式为：对查询和文档中所有共现的词项，将其在文档和查询中的 TF–IDF 权重相乘后求和，再除以文档长度与查询长度的乘积。然而，在实际应用中，随着文档数量的增长，计算\
  \ Sim(q,d)的计算开销会变得非常昂贵。\n\n### 朴素贝叶斯分类器\n\n贝叶斯分类器基于贝叶斯定理，特别适用于输入维度较高的情况。尽管朴素贝叶斯方法简单，但它通常能胜过更复杂的分类方法。\n\
  \n在给定阈值的情况下，该方法可用于分类表示文档的向量是否对用户感兴趣的概率。给定一个属性 d，我们可以通过以下公式计算该样本是否属于类别 C：\n\n![$$\
  \ P\\left(C=c|D=d\\right)=\\arg {\\max}_c\\frac{P\\left(D=d|C=c\\right)P\\left(C=c\\\
  right)}{P\\left(D=d\\right)} $$](img/459335_2_En_4_Chapter_TeX_Equl.png)\n\n其他技术，如\
  \ kNN 和 ANN，也可用于分类和信息检索。\n\n## 遗传算法\n\n遗传算法是机器学习中一个引人入胜的主题。GA 从进化中汲取灵感以最小化错误率，试图模仿染色体的功能，就像神经网络试图模仿人脑一样。\n\
  \n进化被认为是最优的学习算法。在机器学习中，其应用体现在某些模型中：生成多个候选答案（称为染色体或基因型），并对所有候选答案应用成本函数。\n\n在 GA 中，定义了一个适应度函数，用于判断染色体是否足够适应以进行交配。远离最优结果的染色体将被移除。染色体也会发生突变。GA\
  \ 是一种搜索和优化学习器，适用于离散和连续问题。\n\n接近最优解的染色体可以组合。染色体的组合或交配称为交叉。适者生存的方法识别出旨在表达符合自然选择特征的染色体——即后代比亲本更优。\n\
  \n突变有助于克服过拟合。这是一个随机过程，用于跳出局部最优解并找到全局最优解。突变有助于确保子代染色体与亲本不同，并继续进化。\n\n染色体突变和交配的程度是一个参数，可以人为控制，也可以让模型自行学习。\n\
  \nGA 有多种应用：\n\n*   眼科成像中的血管检测\n*   RNA 结构检测\n*   金融建模\n*   车辆路径规划\n\n一组染色体被称为一个种群。尽管种群大小保持恒定，但它通常会在世代或时间推移中进化，以产生更好的平均预测。\n\
  \n染色体 c 的评估值计算为其评估函数值除以该世代的平均值，表示如下：\n\n*   **fitness(c)** = g(c) / (整个种群中 g 的平均值)\n\
  \nJohn Holland 在 20 世纪 70 年代早期发明了 GA 方法（见图 4-23）[81]。染色体选择的自动化被称为遗传编程。\n\n## 最佳实践与注意事项\n\
  \n掌握机器学习的艺术需要时间和经验。然而，有几个值得考虑的领域，特别是对于机器学习初学者，以确保最佳的时间利用和最优的模型效率。\n\n### 良好的数据管理\n\
  \n鉴于机器学习任务中数据的数量和复杂性，恰当的数据管理至关重要。这不仅涉及数据管理所需的过程、策略、程序、权限和认证，还包括管理和转换训练数据以学习最优模型。\n\
  \n![../images/459335_2_En_4_Chapter/459335_2_En_4_Fig23_HTML.jpg](img/459335_2_En_4_Fig23_HTML.jpg)\n\
  \n图 4-23\n遗传算法的基本结构\n\n### 建立性能基线\n\n建立一个基线来衡量你的算法相对于其他迭代和模型类型的性能至关重要。由于没有一种算法能完美解决所有问题，应尝试多种算法以识别模型的相对性能。\n\
  \n### 花时间清洗数据\n\n训练机器学习模型所需的时间在不同算法之间差异很大。数据的准确性和训练模型所花费的时间对模型精度有积极影响。花时间清洗数据，以确保预测结果尽可能稳健。\n\
  \n通常情况下，并非所有输入变量都会影响因变量或结果。确保模型使用的变量不包括那些无关的变量。\n\n### 训练时间\n\n如果数据维度很高且计算能力有限，训练时间将会很长。当时间紧迫时，考虑那些不需要大量训练的机器学习算法会很有用。例如，神经网络可能不适合时间受限的任务。\n\
  \n### 选择合适的模型\n\n一些机器学习算法对数据结构或期望输出有特定的假设。因此，考虑模型选择及其是否是一种合适的方法会很有帮助。使用正确的模型有很多好处，包括更准确的预测、更快的训练时间和更有用的结果。\n\
  \n一些机器学习模型对异常值或非参数检验具有鲁棒性。例如，基于决策树的方法通常根据阈值将节点分为两类。因此，数据异常值在基于树的方法中影响较小。\n\n评估一系列模型是机器学习的一种有用方法。奥卡姆剃刀通常被应用于选择模型。奥卡姆剃刀旨在在所有其他条件相同的情况下，找到能够实现期望输出的最直接模型。\n\
  \n### 选择合适的变量\n\n尽管在机器学习问题中通常欢迎更多的数据，但出于多种原因，使用较少的预测变量通常更可取。\n\n### 冗余\n\n增加训练数据集中的变量数量会增加模型学习变量之间隐藏关系的可能性。识别不必要的变量并仅在模型中使用非冗余的预测变量至关重要。学习冗余连接的模型会影响模型的准确性。\n\
  \n\n\n### 过拟合\n\n即使模型中的预测变量之间不存在任何关系，使用较少的变量仍然是有益的。复杂的模型，或使用了大量预测变量的模型，通常会遭受过拟合问题。\n\
  \n这些模型在训练数据集上表现良好，但在验证集和现实场景中准确性较低，因为它们学习的是数据中的误差（即噪声），而非变量之间的信号或关系。\n\n### 生产力\n\
  \n即使一个复杂的机器学习模型中的所有变量都是相关的，使用大量预测变量也会对生产力产生实际影响。\n\n实际考量因素包括：可用数据量、对存储和计算资源的后续影响、相关成本、项目分配的时间，以及学习和验证所需的时间。预测变量可以通过特征选择来识别，或通过特征提取进行转换。在数据维度增加的情况下，支持向量机（SVM）非常有用。\n\
  \n帕累托原则（或称 80/20 法则、关键少数法则）是机器学习项目中一个有用的衡量标准。运用帕累托原则，专注于最重要的 20%的预测变量，应有助于在合理时间内构建相对成功的模型。微软发现，Windows\
  \ 和 Office 中 80%的错误和崩溃是由检测到的全部错误中的 20%引起的[82]。\n\n帕累托原则\n\n“帕累托原则”是指观察到大约 80%的后果源于\
  \ 20%的原因。许多自然现象已被经验证明呈现出这种分布。\n\n### 可理解性\n\n预测变量较少的模型更容易可视化、理解和解释。一个成功的机器学习项目的关键方面是所有利益相关者都能理解该模型。这通常需要数据科学家进行权衡。\n\
  \n通过减少预测变量的数量，机器学习模型成功的可能性可能会降低。然而，这同时也使模型更易于解释和理解。\n\n这种方法的有用性只有在项目接近尾声，需要分享模型的性能及其工作原理时才会显现出来。这在医疗保健领域尤其重要，因为人们对使用黑盒模型存在担忧。\n\
  \n### 准确性\n\n任何机器学习模型的目标都是实现良好的泛化。根据具体用例，近似值可能比精确、准确的输出更有益。通过近似值，模型往往能避免过拟合，并减少处理时间。\n\
  \n### 假阴性的影响\n\n在将模型部署到实际环境之前评估其影响时，需要考虑假阴性的影响。例如，以一个预测乳腺癌风险的模型为例。假阳性意味着患者被告知患有乳腺癌而实际上并未患病，这应在后续治疗路径中被识别出来。然而，假阴性则意味着患有乳腺癌的患者不会被通知——这潜在后果要严重得多，代价也高得多。\n\
  \n### 线性\n\n许多机器学习算法假设关系是线性的——换句话说，即类别可以通过一条最佳拟合直线或其高维表示来分隔。在某些情况下，关系并非线性。在存在非线性类别边界的情况下依赖线性分类算法将导致低准确性。\n\
  \n例如，线性回归假设输入和输出变量都不包含噪声。揭示数据中的信号至关重要，以确保模型学习到数据中的信号或正确关系。识别并移除输出变量中的异常值尤其有利，可以减少学习噪声的机会。\n\
  \n对于具有非线性趋势的数据，可能需要进行变换以使关系线性化，例如，对呈指数关系的数据进行对数变换。\n\n线性算法通常是机器学习场景中首先尝试的方法。由于线性特性，这些算法简单且训练速度快。\n\
  \n### 参数\n\n每个机器学习模型都受参数和超参数的影响。训练模型所需的时间和资源会随着参数数量的增加而增加。算法的参数是模型使用的一个变量，其值可以从数据集中估计出来。\n\
  \n算法的超参数是模型外部的变量，用于估计参数。超参数的值无法从数据中估计。相反，它由数据科学家设定（随机或其他方式），或通过启发式方法设定。\n\n### 集成方法\n\
  \n在特定的机器学习问题中，使用投票、加权和组合等技术将分类器分组，以识别出可能最准确的分类器，这被证明是更有用的。集成学习器在这方面非常有用。\n\n## 用例：迈向糖尿病的智能护理\n\
  \n2 型糖尿病是全球人口面临的最重大的健康和经济负担之一，每 6 秒钟就有六分之一的人死于糖尿病或其相关并发症[83, 84]。\n\n疾病进展涉及许多因素，如果能够解决这些因素，可以通过有针对性的治疗分析来帮助预防其进展，从而降低患者的发病率和死亡率。以健康生物标志物形式存在的数据——通常是血糖、糖化血红蛋白（HbA1c）、空腹血糖、胰岛素敏感性和酮体——被用来理解和监测疾病负担以及对治疗的反应。\n\
  \n由于 2 型糖尿病的巨大负担，该领域在开发智能模型方面投入了大量资金，重点是通过机器学习和数据挖掘来诊断、预测和管理该疾病。\n\n许多机器学习技术已被应用于\
  \ 2 型糖尿病数据集。传统技术、集成技术和无监督学习——特别是关联规则挖掘——已被用于识别具有最佳准确性的预测模型。\n\n### 预测血糖\n\nGeorga,\
  \ E. I. 等人使用随机森林决策树，基于从 15 名 1 型糖尿病患者收集的许多特征，来预测短期皮下葡萄糖浓度[85]。通过使用支持向量机（SVM）预测葡萄糖浓度。\n\
  \n研究得出结论，纳入两个生物标志物特征——8-羟基-2-脱氧鸟苷（一种氧化应激标志物）和白细胞介素-6——提高了分类准确性。\n\n\n\n### 预测风险\n\
  \nFarideh Bagherzadeh-Khiabani 等人利用来自 803 名女性糖尿病前期患者的临床数据集（包含 55 项特征，数据收集跨度超过十年），开发了多种用于预测\
  \ 2 型糖尿病风险的模型[86]。该研究构建了一个逻辑回归模型，展示了包装模型（即考虑特征子集并提升临床预测模型性能的模型）的效果。该模型被开发成一个 R 程序，用于可视化输出结果。\n\
  \nSummers、Panesar 等人开发了一个包含 34 项特征的模型，这些特征针对糖尿病前期和肥胖人群收集，基于超过 20 万名使用低碳水计划数字健康干预措施用户的健康与参与结果，来预测\
  \ 2 型糖尿病的发生风险。该模型使用 Python 开发，并部署在云端，用于评估患者风险及其是否适合使用这一屡获殊荣的数字疗法[16, 58]。\n\nRazavian\
  \ 等人进行了另一项大规模研究，确定 2 型糖尿病预测模型可以从人群规模的数据集中准确推导出来[87]。研究收集了 2005 年至 2009 年间超过 400\
  \ 万名患者的 4.2 万多个变量。通过机器学习确定了相关特征，最终筛选出约 900 个特征。研究还发现了 2 型糖尿病的新型风险因素，例如慢性肝病、高丙氨酸氨基转移酶、食管反流以及急性支气管炎病史。\n\
  \nDuygu Çalişir 等人开发了一种 2 型糖尿病自动诊断系统，通过使用线性判别分析和支持向量机分类器，分类准确率接近 90%[86]。研究采用潜在狄利克雷分配来区分健康患者与\
  \ 2 型糖尿病患者之间的特征，随后将这些特征作为支持向量机分类器的输入。在确定输出结果之前，第三阶段评估了敏感性、分类效果和混淆程度。\n\n### 预测其他疾病的风险\n\
  \n机器学习同样被应用于诊断与糖尿病相关的其他疾病风险。\n\nLagani 等人确定了以最少临床变量实现最佳预测准确性的特征集，用于预测心血管疾病（心脏病或中风）、低血糖、酮症酸中毒、蛋白尿、神经病变和视网膜病变等并发症[88]。\n\
  \nHuang 等人使用基于决策树的预测模型来识别糖尿病肾病患者[89]。Leung 等人比较了多种方法：偏最小二乘回归、回归树、随机森林决策树、朴素贝叶斯、神经网络以及支持向量机，这些方法应用于遗传和临床特征[90]。患者年龄、确诊年限、血压、子宫珠蛋白基因多态性以及脂质代谢被确定为\
  \ 2 型糖尿病最有效的预测因子。\n\nSummers 等人开发了一个预测模型，利用包含 120 多项特征的数据集来识别共病抑郁症和糖尿病相关困扰。Summers\
  \ 等人探索了多种技术，包括随机森林决策树、支持向量机、朴素贝叶斯和神经网络。患者年龄和就业状态被定义为最可能影响预测准确性的变量[16, 86]。\n\n无监督学习主要集中在关联规则挖掘上，用于识别糖尿病患者风险因素之间的关联。Simon\
  \ 等人提出了一种关联规则挖掘的扩展方法，称为生存关联规则挖掘，该方法包含了生存结局，并对混杂变量和剂量效应进行了调整[86]。\n\n### 逆转疾病\n\n\
  过去 15 年间，真实世界证据的生成从根本上颠覆了对 2 型糖尿病的认知。此前，2 型糖尿病被视为一种慢性、进行性疾病。\n\n低碳水计划数字健康干预措施在证明通过可扩展的数字疗法实现可持续减重是可行的方面发挥了关键作用，支持糖尿病前期和\
  \ 2 型糖尿病的缓解。该平台经过同行评审的证据显示，54%的患者减少或停用了糖尿病药物，一年留存率为 71%。\n\n低碳水计划成功的一个关键驱动因素是实施了一个预测模型，用于识别最有可能吸引患者参与的教育模块、资源、食谱和讨论话题。这使得应用程序本身根据关键特征（包括种族、年龄、性别、地点、语言、每周食品预算、饮食偏好、健康状况和合并症）为每位患者提供不同的体验。\n\
  \n该模型利用患者数据提供个性化、量身定制的护理，以最佳方式赋能患者决策并提供全天候支持。这种方法的好处不言而喻，四分之一的患者在一年内实现了 2 型糖尿病缓解。低碳水计划的成果已被用于影响公共营养政策和指南。该应用程序在英国国家医疗服务体系中被评为糖尿病类排名第一的应用[91,\
  \ 92]。\n\n机器学习通常侧重于预测和诊断疾病。将机器学习应用于逆转疾病，为我们提供了支持改善行为、重新定义过时范式的希望。\n\n"
- "# 5. 如何执行机器学习\n\n> *机器学习可以拓展我们的生命、能力和潜力。*\n> \n> ——Harkrishan Panesar\n\n机器学习是计算机科学中一个快速发展的、令人兴奋的学科，融合了探索与发现、工程和分析等一系列技能。机器学习利用大量事实性的历史数据来帮助我们更好地理解行为。\n\
  \n虽然一开始可能令人生畏，但通过分步骤的方法来执行机器学习及其先决条件，即使不是统计学家或程序员专家，也能成功完成项目。尽管数学和编程知识无疑是有利的，但许多机器学习算法都是现成的，并使用预先存在的库，因此很少需要从头开发全新的算法。\n\
  \n机器学习项目的方法与其试图解决的问题一样独特。然而，机器学习或数据科学生命周期中涉及的工作流程被详细阐述，可作为方法论使用。\n\n## 执行机器学习项目\n\
  \n了解执行机器学习项目所涉及的工作流程，有助于明确项目团队所需的技能，并有助于与他人沟通这些内容。\n\n机器学习项目的目标是开发能够从训练数据中的信号进行学习的算法。\n\
  \n在用于开发机器学习模型的方法论中，定义了七个工作流程（图 5-1）。这些阶段中的每一个都可以迭代执行，这意味着工作流程可以在过程中的任何步骤重复进行。\n\n\
  ![../images/459335_2_En_5_Chapter/459335_2_En_5_Fig1_HTML.jpg](img/459335_2_En_5_Fig1_HTML.jpg)\n\
  \n图 5-1\n\n执行机器学习项目所涉及的工作流程\n\n1.  问题框架：将手头的问题具体化为一个学习任务（并在继续之前确定它是否是一个机器学习问题）\n\
  \n2.  数据准备：涉及数据探索、分析、洞察和清洗\n\n3.  训练模型：选择学习方法，将其应用于创建模型，并尝试优化所创建的模型\n\n4.  评估：对方法和结果进行客观评估\n\
  \n5.  传播：向利益相关者报告评估结果，并确保可解释性\n\n6.  部署：发布训练好的机器学习模型，监控持续的使用情况和准确性\n\n\n\n### 框架构建：明确问题\n\
  \n机器学习的第一步是明确问题。这包括理解问题是什么、机器学习项目的目标，以及如何评估实现目标的尝试。了解你为何要解决这个问题很有帮助，尤其是在为机器学习项目制定预算方案时。这需要评估以下内容：\n\
  \n*   为什么这个问题很重要？\n*   你希望达成什么目标？你最大的期望是什么？\n*   当前任务的输入和输出是什么？\n*   这些数据是否可用？\n\
  *   结果将如何带来益处？\n*   这是探索性的工作吗？\n*   关键绩效指标（KPI）是什么？如何衡量性能？\n*   成功的标准是什么？\n*   我们手头是否有完成这项任务的人才？\n\
  *   当前任务存在哪些限制？这可能包括时间、资金、技能组合、经验、领域知识、数据可用性等。\n\n要解决问题，你可用的数据将包括示例和背景信息。\n\n####\
  \ 收集示例\n\n分类是一项可以通过示例学习的技能。它可用于预测性任务，例如疾病风险或资源需求预测。\n\n某些问题会出现在传统的医疗场景中，例如来自医疗预约的数据以及某些诊断附带的补充手写笔记。糟糕的示例有助于引入错误。对于分类任务，示例通常以正例和反例的形式提供。\n\
  \n#### 背景信息\n\n这指的是与机器学习问题相关的知识和公理。这可能包括元数据、属性或概念之间的关系。\n\n例如，在高血压预测工具中，根据医学证据和数据，2\
  \ 型糖尿病的诊断将与高血压的可能性相关。这些信息被用于学习的概念中，以实现分类。\n\n#### 数据中的错误\n\n请注意，现实世界中的错误可能会潜入数据，例如人为错误、错误分类、数据缺失、错误的背景信息以及重复数据。\n\
  \n错误可能通过多种方式潜入，例如纸质文档的数字化以及机器对书面文字的读取。务必记住，模型的质量取决于它所获得的数据。值得花时间验证数据，以确保人为错误降至最低。\n\
  \n### 数据准备\n\n机器学习算法从它们所训练的数据中学习。为模型提供有效且稳健的数据以供学习至关重要。\n\n数据必须以可用的格式进行准备。在现实场景中，这涉及理解用于建模问题的数据并导出数据。然后必须对数据进行处理，以确保格式正确、删除错误数据并修复任何缺失数据。数据集的大小可能超出所需，因此可能还需要进行数据集采样。\n\
  \n每位机器学习从业者都需要掌握数据准备的技能。数据预处理对于获得整洁、有效的数据至关重要。整洁、有效的数据是获得稳健、真实结果的关键。为了开发一个高度适用于特定领域的机器学习模型，能够高效实现算法的技术专家必须与能够理解数据、对其进行分类并找出趋势和模式的领域专家合作。\n\
  \n数据准备是机器学习中迄今为止最重要的方面。\n\n#### 我需要多少数据？\n\n遗憾的是，这个问题没有明确的答案——这取决于具体情况。这是你在训练模型并将其部署到现实世界的过程中需要探索的问题。\n\
  \n有几个因素会影响“学习曲线”。这些因素包括问题的复杂性和算法的复杂性。这反过来又会影响所需的数据量。模型能否输出在现实世界中具有真实性的结果，将取决于算法的复杂度和所提供数据的质量。\n\
  \n评估更多数据的可用性和有用性。在医疗场景中，关于药物的随机对照试验在任何特定场景下很少评估超过 1000 名患者。在外科场景中，获取更大的数据集是可能的，但训练模型可能并不需要。\n\
  \n非线性、非参数算法需要更多数据才能提高其准确性。这些通常是更强大的机器学习方法。然而，由于数据的有效性会影响偏差和方差，因此关键是要在尽可能多的数据上高效地对模型进行稳健的训练和验证。\n\
  \n### 训练机器学习模型\n\n任何机器学习新手都会问的标准问题是：“我应该使用哪种算法？”算法的选择取决于几个因素，包括数据的大小、质量和性质；任务截止日期；以及使用数据的可用资源和动机。学习技术也被称为“解决方案的表示”，因为每种机器学习方法都以不同的方式表示数据。算法本身是现成的，不需要从头开始编码。\n\
  \n话虽如此，某些算法比其他算法更适合特定问题，这有助于决定尝试哪些算法：\n\n*   分类：逻辑回归、支持向量机、随机森林、朴素贝叶斯\n*   回归：线性回归\n\
  *   特征降维：主成分分析（PCA）、线性判别分析（LDA）\n*   聚类：K 均值算法、线性判别分析（LDA）\n*   协同过滤：交替最小二乘法\n\n\
  几乎不可能预测哪种方法在数据上表现最佳。即使模型在训练和验证期间表现良好，也不能保证它在现实世界中也能表现良好。\n\n没有免费的午餐\n\n机器学习中的“没有免费的午餐”定理指出，没有一种算法能对所有问题都表现最佳。这对于监督学习尤其相关，因为有许多因素会影响算法的性能。\n\
  \n#### 我应该使用哪种编程语言？\n\n机器学习任务通常使用多种编程语言进行：主要是 R、Python、Matlab 和 SQL。Java 和 C 也常被使用。\n\
  \n*   R 通常用于统计分析。它允许你使用统计方法和图表来理解和探索数据，并包含广泛的机器学习算法。\n*   Python 是一种非常适合机器学习的语言。像\
  \ numpy 和 SciPy 这样的扩展对于机器学习和数据分析特别有用。\n*   Matlab 是许多大学生入门时使用的语言。它对于快速原型设计很有用，因为它包含一个大型的机器学习库。\n\
  *   SQL 是一种用于管理传统数据库管理系统（DBMS）中数据的语言。\n\n\n\n#### 我应该从零开始编写机器学习算法吗？\n\n从资源和价值角度出发，需要做出多项决策，这些决策会影响所采用的方法。概念验证项目可能时间紧迫，而高度具体且复杂的任务则会包含多种方法的组合。\n\
  \n完全可以通过实现学习库（如 scikit-learn、SciPy、pandas、Matplotlib、TensorFlow、Keras 等）提供的现成算法来运行机器学习算法。\n\
  \n这曾是机器学习的传统方法：组建一个数据科学团队，其中包含精通 Python 和 R 等语言的成员。拥有机器学习经验的成员通常比机器学习概念的初学者更具影响力。\n\
  \n工程师通过经验积累，能够理解针对特定问题应采用的适当机器学习技术。这种经验对于避免浪费时间、资源和探索至关重要。\n\n具备计算机科学基础的工程师通常熟悉机器学习中的许多概念。选择编程语言会影响你在实现中可使用的\
  \ API 和标准库。爱好者可能希望避免使用现成算法，而是自己编写实现代码，以更深入地理解其中涉及的数学、统计学和逻辑。\n\n在许多时间受限的情况下，用于工程热情的时间是有限的。诸如\
  \ Google AI、Microsoft Azure、IBM Watson 以及众多其他提供商提供的基于云的服务，允许提供商负责算法部分；许多服务还提供可视化界面，使用户能够对上传的数据尝试特定的机器学习技术。\n\
  \n提供数据挖掘和机器学习应用的云服务商正在增长，且成本低廉。使用此类服务商的好处之一是能够为实验尝试多种模型并比较结果，从而为你的问题任务找到最佳解决方案。\n\
  \n对于拥有更传统编程经验的人来说，几乎所有服务商都提供 API 或 Web 服务创建工具，允许你创建接口来与托管的模型进行交互。与 API 集成所需的全部条件就是一位高效的传统程序员或\
  \ Web 开发者。\n\n随着世界拥抱开源，可以考虑通过 GitHub、Reddit 和其他机器学习论坛浏览已经存在的实现。\n\nAPI 代表应用程序编程接口。API\
  \ 能够实现软件组件之间的通信，尤其可用于连接基于云的机器学习提供商和内部开发团队。有许多公共 API 可用于辅助你的机器学习任务。\n\n嵌入机器学习 API\
  \ 应谨慎且明智地进行。在日益开源的环境中，除了良好的文档和功能外，还要确保有可见的流行度和稳健性指标，例如 GitHub 状态、搜索引擎流行度和相关讨论。\n\
  \n#### 训练数据和测试数据\n\n从准备好的数据中选出测试集和训练集。算法在训练数据集上进行训练，并在测试数据集上进行评估。\n\n在许多情况下，需要尝试多种机器学习方法。在机器学习建模方面，理解两个术语很有用：\n\
  \n*   **信号**：数据集中真实的底层模式\n*   **噪声**：数据集中随机或无关的模式\n\n某些机器学习技术可能只返回一个解决方案，而其他技术可能产生多个解决方案。通常的做法是收集它们的输出（也称为假设或学习模型）并评估其输出。\n\
  \n假设的评估通过评估预测准确性、可理解性或实用性来进行。在大多数情况下，会使用奥卡姆剃刀原则，即在其他条件相同的情况下选择最简单的解决方案。评估完成后，会选择一个候选假设。\n\
  \n有多种方法可以将数据划分为训练集和测试集，以训练机器学习模型。\n\n##### 预测准确性\n\n预测准确性指的是智能体执行分类任务的准确程度。\n\n\
  ##### 可理解性\n\n可理解性指的是我们人类理解输出的程度。在现实世界中，这可以转化为许多不同的场景。\n\n最近，两个 Facebook 机器人开始用它们自己创造的语言互相交谈，这种语言人类无法理解\
  \ [93]。\n\n##### 实用性\n\n实用性指的是针对特定问题的价值衡量标准。例如，在药物合成中，对人体食用不安全的化合物组合可能是最佳组合。但这并不具有最大的实用性。同样，实用性可能会优先于准确性和可理解性。\n\
  \n#### 留出法\n\n留出法是一种可以采用的简单训练方法，它涉及保留一部分数据用于测试，将剩余数据用于训练和验证模型。\n\n测试通常能给出模型有效性或准确性的指标。\n\
  \n#### n 折交叉验证\n\nn 折交叉验证涉及将数据集分成大小相等的实例组（或折）。然后，模型在所有折上训练，但留出一折，并在最后留出的那一折上进行测试。这个过程会重复进行，每次迭代都会留出不同的折。\n\
  \n折的数量可以根据数据集的大小而变化。常见的折数包括三折、五折、七折和十折。其目的是在训练集和测试集中数据的大小和代表性之间取得平衡。它使得模型能够在不同的数据集上被测试\
  \ n 次。这使我们能够充分利用数据，在其上训练 n 次。\n\n一些机器学习文献可能将交叉验证称为机器学习过程中的交叉验证阶段。这是因为机器学习工程师经常使用这种方法来降低过拟合的可能性。\n\
  \n#### 蒙特卡洛交叉验证\n\n蒙特卡洛交叉验证类似于 n 折交叉验证。它涉及将数据集随机分成训练数据和测试数据。模型根据训练数据进行调优，并使用测试数据评估预测准确性。然后对多次分割的结果进行平均。\n\
  \n#### 我应该使用哪些算法？\n\n通常无法从一开始就确定要使用的算法。尝试多种与你的问题相关的技术。这使你能够比较并根据准确性、可理解性和实用性来选择解决方案。即使是最有经验的数据工程师，在尝试各种算法之前也无法判断哪种算法表现最好。\n\
  \n所有机器学习软件都支持多种算法。通过尽可能多地尝试可行的算法，为任务找到最佳算法。\n\n### 方法与结果的评估与优化\n\n机器学习任务的性能因所给数据的表示方式而异。例如，由\
  \ AI 系统分析的患者记录并非直接检查患者。相反，数据被输入系统，每条与患者表示相关的信息被称为一个特征。作为表示的一部分，并不需要完整的特征集才能获得高置信度的输出。\n\
  \n机器学习算法的目标是良好地泛化，既不过拟合也不欠拟合。泛化指的是模型在训练期间未见过的实例上以最大准确性执行。\n\n关于机器学习项目评估方法的更详细讨论，请参见第\
  \ 7 章。\n\n\n\n#### 算法准确度评估\n\n许多监督学习问题涉及二元分类，其任务是学习一种方法，将未见过的数据分类到两个类别之一。这两个类别通常被称为正类和负类：\n\
  \n*   如果二元分类器在处理新数据时，本应被归类为负类，却被错误地归类为正类，则称为**假正例**。\n\n*   **假负例**则是指分类器将新数据归类为负类，但该判断是错误的。\n\
  \n在许多医疗场景中，假正例的危害通常小于假负例。例如，在此类场景中，假正例可能包括根据一组特定症状对患者做出疾病诊断。显然，被告知患有某种疾病而实际上并未患病，要好过被告知没有患病，结果却发现事实恰恰相反。假负例意味着某人未被诊断出疾病，这或许更令人担忧。\n\
  \n衡量特定假设在测试数据集上预测准确度的一个简单方法是，计算正确识别出的结果（包括正类和负类）的数量。\n\n例如，如果一个心脏病诊断工具学习了一个假设，并用它对\
  \ 250 名新候选者进行分类，判断其是否患有心脏病。该工具正确地将 150 名正类中的 133 名和 100 名负类中的 98 名进行了分类，那么它的准确率为：\n\
  \n*   (133 + 98) / 250 = 92.4%\n\n这意味着，对于未见过的样本，该工具有 92%的概率能正确分类。\n\n泛化能力通过准确度来衡量。欠拟合和过拟合都会导致模型性能不佳，并对准确度产生不利影响。如果一个模型在测试中的分类准确率为\
  \ 92%，但在未见过的数据上只有 30%，我们就说该模型从训练数据到未见数据的泛化能力不佳。\n\n这就是过拟合。过拟合是指模型对训练数据拟合得过于完美。它记住了答案，而不是从数据中学习概念。在这种情况下，模型无法区分信号和噪声，而是学习了数据中存在的噪声。因此，模型无法理解数据中的实际模式（即信号）。该模型无法应用于新数据，这损害了模型的泛化能力，使得模型毫无用处。决策树就是可能对训练数据过拟合的算法示例。这可以通过剪枝来改善。在许多情况下，保持模型简单反而效果惊人。\n\
  \n如果一个模型在训练数据集上的表现优于在未见过的测试集上的表现，那么该模型很可能存在过拟合。交叉验证是一种用于衡量过拟合程度的技术。此外，使用更多数据进行训练可能有助于算法推断出更好的假设。\n\
  \n“更多数据带来更好结果”这一概念具有误导性。在许多情况下，更多数据确实可能有帮助。然而，更多数据并不意味着数据质量好。如果添加的是带有噪声的数据，则无助于减少过拟合。因此，确保数据干净且合适至关重要。\n\
  \n数据泄露发生在你用于训练机器学习模型的数据包含了你试图预测的信息时。这会导致泛化能力差，并加剧过拟合。数据泄露可能源于测试数据泄露到训练数据中，或者引入了额外的特征。一个简单的数据泄露例子是，模型将响应变量本身用作预测变量，从而得出诸如“患有结膜炎的患者患有结膜炎”这样的结论。\n\
  \n如果你机器学习算法的性能好到令人难以置信，那么数据泄露可能就是原因所在。n 折交叉验证有助于减少数据泄露。\n\n欠拟合很容易检测，因为它会表现出较差的性能。它指的是一个模型既无法对训练数据进行建模，也无法泛化到新数据。通常，这表现为特征过少的简单模型。结果往往倾向于偏差大于方差（即，得出错误的结果）。\n\
  \n#### 偏差与方差\n\n监督式机器学习的目标是理解数据集中的信号，同时忽略噪声。\n\n机器学习面临一个难题，即如何最小化两种导致预测误差的来源，这些误差阻碍了监督学习算法超越其训练集进行泛化。在模型最小化偏差和方差的能力之间存在一种权衡（也称为偏差-方差权衡）。\n\
  \n#### 偏差\n\n偏差指的是模型因从错误数据中学习而产生的误差。虽然这听起来很奇怪，但数据集可能呈现随机性。偏差衡量的是这些模型的预测值与实际正确值（或真实信号）之间的总体偏离程度：\n\
  \n*   **低偏差**：对数据集中的真实信号理解得更好\n\n*   **高偏差**：对数据集中的真实信号理解得更差\n\n高偏差通常表明可能存在更好的机器学习技术。\n\
  \n#### 方差\n\n方差指的是因对训练集波动敏感而产生的误差：\n\n*   **低方差**算法基于数据集输出相似的模型。\n\n*   **高方差**算法基于数据集输出差异显著的模型。\n\
  \n偏差和方差可以用飞镖盘的类比来最好地说明（见图 5-2）。想象一个飞镖盘，其靶心代表一个能完美预测正确值的模型。\n\n![../images/459335_2_En_5_Chapter/459335_2_En_5_Fig2_HTML.jpg](img/459335_2_En_5_Fig2_HTML.jpg)\n\
  \n图 5-2\n\n偏差与方差示意图\n\n当你离靶心越远，预测结果就越差。如果每个新模型都由一支新飞镖代表，那么每次投掷都代表了在给定训练数据可变性的情况下模型的一次实现。有了良好的数据分布用于训练，模型就能做出很好的预测。\n\
  \n包含异常值和冗余数据的数据会导致预测结果不佳。这可以在飞镖盘上直观地体现出来。\n\n工程师在使用机器学习算法时必须做出的权衡是：低偏差算法必须足够灵活，以便很好地拟合数据。然而，如果灵活性过大，每个数据集都会被不同地解释，从而导致高方差。有几种方法可以降低算法复杂度，这些将在第\
  \ 4 章中讨论。\n\n许多监督学习工具包提供了控制偏差-方差权衡的方法，要么是自动进行，要么是通过提供一个可调节的参数。\n\n与低偏差算法相比，低方差算法往往具有较低的复杂度。低方差算法具有简单或刚性的结构，导致生成的模型虽然一致，但平均而言不准确。这包括诸如回归、朴素贝叶斯等算法。\n\
  \n低偏差算法往往更复杂，结构更灵活。因此，它们平均而言是准确的；然而，它们可能不一致。这包括非参数算法，如决策树和 k 近邻。\n\n在你的项目中，关键在于找到偏差和方差之间的平衡点，以最小化总误差（见图\
  \ 5-3）。\n\n![../images/459335_2_En_5_Chapter/459335_2_En_5_Fig3_HTML.jpg](img/459335_2_En_5_Fig3_HTML.jpg)\n\
  \n图 5-3\n\n寻找最优算法平衡点\n\n*   总误差 = 偏差² + 方差 + 不可约误差\n\n不可约误差指的是无论使用何种模型或数据集都存在的误差。这是来自训练数据的噪声。它是一个常数，因为现实世界的数据总是存在一定程度的噪声。\n\
  \n#### 性能度量\n\n评估算法的方法示例包括：准确度、查准率与查全率、平方误差、似然、后验概率、成本以及熵（K-L 散度）。\n\n\n\n#### 优化\n\
  \n模型表现良好并不意味着它就是最佳且唯一的模型。关键在于从结果中获得最大准确性。诸如交叉验证之类的技术有助于确定模型结果的置信度。然而，我们还可以进一步优化机器学习算法。\n\
  \n此外，我们可能希望提升输出结果所需的时间性能。\n\n算法可以通过以下方式进行优化。\n\n##### 算法调优\n\n调优可以理解为优化影响模型的参数的过程，以使算法能够根据所定义的“最佳”标准，实现“最佳”性能。\n\
  \n##### 训练与验证数据\n\n采用 n 折交叉验证技术来处理机器学习问题，可以让你验证结果；而保留法（hold-back methodology）则采用一种瀑布式的方法进行学习。\n\
  \n##### 评估多种方法\n\n尝试多种机器学习方法有助于确定哪种方法能获得最准确的结果。\n\n#### 通过更好的数据改进结果\n\n有几种方法可以通过数据来提升性能，包括以下几种。\n\
  \n##### 获取更多数据\n\n如果你能获取更多数据，这可能有助于模型提升其性能。\n\n##### 获取更高质量的数据\n\n在可能的情况下，获取更高质量的数据通常比获取更多数据更好。这通常会改善数据中的信号，并减少噪声。你还可以通过清洗数据来提高数据质量。\n\
  \n##### 重新采样数据\n\n将样本数据划分为不同的大小或分布，可能能更好地表达概念，或通过减少属性（特征）来帮助提升性能。\n\n##### 数据表示\n\
  \n通过不同的机器学习方法，数据可以以不同的方式表示。改变所应用的机器学习方法类型并重新评估问题，可能会优化你的模型。\n\n##### 特征选择\n\n处理重要和不重要的特征，可以为你的模型提供新的推理依据。增加特征数量并不总是有益的。然而，在无监督学习的情况下，包含所有特征以确保没有任何遗漏可能是有益的。\n\
  \n##### 特征工程\n\n成功的关键在于数据的表示。特征工程涉及通过分解和聚合以其他方式展现数据。\n\n关于数据力量最著名的引述之一来自谷歌研究总监兼机器学习先驱彼得·诺维格，他声称：“我们并没有更好的算法。我们只是拥有更多的数据。”\n\
  \n#### 我应该选择监督学习还是无监督学习算法？\n\n在开发模型时，很少是单纯选择监督学习或无监督学习的情况。事实上，它们通常可以结合使用。无监督学习是用于降维和特征工程的有用技术，这些技术可以用于监督学习问题。\n\
  \n#### 集成方法\n\n当多个分类器专门处理问题的不同方面时，就形成了集成方法。集成方法将模型转化为一个特征。有三种类型的集成算法，即装袋法、提升法和堆叠法，详见第\
  \ 4 章。\n\n集成方法适用于机器学习的高级实践者。\n\n#### 问题分布\n\n另一种优化方法是分布处理机器学习任务所使用的计算资源。微软的 Azure\
  \ 和谷歌的 AI.io 等工具就是能够大规模分布问题的仓库示例。实际上，大多数问题都可以在单台多核机器上处理。\n\n#### 实现问题\n\n用户界面（UI）是涉及人机交互的机器学习应用中的关键组件。这不仅是显示结果的地方，也是收集最多智能信息的地方。在与用户互动时，重新思考用户界面和用户体验是值得考虑的。\n\
  \n### 传播结果\n\n在许多情况下，这是确保内部利益相关者支持机器学习项目的最关键方面。机器学习项目是否成功并不重要；如果人们不理解事件背后的原因，就可能失去对采用创新技术的支持。通常，在组织内部，一份\
  \ PowerPoint 演示文稿和白皮书就足以展示成果。\n\n报告结果的方式有很多种，评估的程度也各不相同。例如，一份内部白皮书可能已经过组织内部利益相关者的审阅，而在同行评审期刊上发表一篇评估创新的文章可能更受欢迎。随着医疗保健领域迅速拥抱大数据和机器学习，强有力的证据来证明人工智能的益处和影响至关重要，以确保只有基于证据、经过临床验证的框架和技术才能被使用和进一步发展。\n\
  \n就像你不会想要服用假药一样，你也不会想要使用那些未经评估、没有公开可查数据的、会影响你健康的技术。\n\n将问题视为一个科学实验，评估以下内容：\n\n*\
  \   **原因**：定义问题的背景以及解决问题的动机。\n\n*   **问题**：将问题描述为一个疑问。\n\n*   **解决方案**：解释所提出问题的答案。\n\
  \n*   **发现**：描述数据中的发现以及模型得出的推论。\n\n*   **结论**：评估从项目中学到的东西，并讨论其局限性、伦理问题、隐私和数据敏感性（特别是涉及\
  \ CCPA 和 GDPR 等数据法规时）。\n\n*   **监控**：如果计划部署模型，如何通过使用过程来监控和评估预测结果？\n\n一旦你报告了你的发现，就由你的利益相关者来决定项目在部署前的价值，甚至是否要部署。\n\
  \n讨论的主题包括如何处理假阴性和假阳性的报告，以及预测性声明的准确性。预测的影响是一个关键的考虑因素。有些问题可能是首次遇到。例如，使用所涉及的数据有哪些法律问题？机器学习模型何时是真正具有预测性的，还是仅仅是巧合？能够精确诊断某人患癌风险的影响是什么？\n\
  \n诸如可穿戴设备、追踪器和电子健康记录（EHR）等新颖的信息来源，将机器学习置于创新和伦理探索的领域。这对更广泛的医疗保健和保险业影响巨大，应在机器学习研究项目中予以考虑。\n\
  \n机器学习预测模型领域已经取得了进展，特别是在生物医学研究中，已经发布了模型报告指南，包括识别预测问题、确保 n 折交叉验证以及结果校准的步骤（见图 5-4）。\n\
  \n![../images/459335_2_En_5_Chapter/459335_2_En_5_Fig4_HTML.jpg](img/459335_2_En_5_Fig4_HTML.jpg)\n\
  \n图 5-4\n\n理解手头的任务\n\n校准在临床实践中具有重要意义，它指的是模型做出的预测与观察到的结果之间的关系。\n\n例如，如果预测模型“预测一名肺癌患者在未来一年内有\
  \ 70% 的死亡风险，那么如果在我们数据集中，大约 70% 的肺癌患者在未来一年内死亡，则该模型校准良好。”\n\n\n\n#### 部署前是否需要向利益相关者传播项目成果？\n\
  \n最终，在向更广泛的利益相关者传播项目成果之前部署机器学习模型，是一个组织层面的决策。这种做法存在若干固有风险，包括团队或组织内部缺乏治理和理解。管理和监控部署需要投入资源，最好提前规划，而非事后应对。\n\
  \n在部署公共项目之前，应进行多种形式的独立评估。除了预测评估，还必须解决网络安全问题，包括渗透测试和网络事件响应评估。机器学习模型可能引发意外后果——这可能会让那些既不了解也未参与相关影响的团队措手不及。\n\
  \n### 部署\n\n部署机器学习模型，是将模型从测试或预发布环境迁移到生产环境的过程。此后，模型可供他人访问，并向其他代理（无论是人类还是计算机）提供输出。\n\
  \n机器学习模型只有在可被访问时才能提供价值，因此部署是机器学习项目生命周期中至关重要的最终阶段。\n\n部署还应包含一个记录所有观测值和预测结果的机制，以及一个流程，用于监控和定期评估不断增长的日志，以确保其相关性和无害性。大多数已部署的项目将托管在云服务器上，这使得审计相对简单。此外，云服务器还支持可扩展性，这是一项额外优势。\n\
  \n应实施一个流程来监控和管理已部署模型的使用情况，并对相关数据进行分类处理。\n\n### 结论\n\n机器学习始于提出正确的问题。通常情况下，问题框架的构建是过程中最困难的部分。而迄今为止，最耗费资源的环节是数据准备。\n\
  \n构建正确的问题能提供一个明确定义的目标函数，使利益相关者能够识别所需数据、解决问题的方法、潜在影响以及所需资源。最初提出的问题可能并非正确的问题，但通过迭代式地修正问题，可以逐步朝着更清晰、更明确的目标前进。如果没有提出正确的问题，数据科学团队可能会在收集数据和训练模型上浪费无数时间，而这些模型最终对预期目标毫无用处。\n\
  \n要做好准备，你提出的假设或问题可能无法从数据中的信号得到答案——并探索这种可能性带来的后果。\n\n随着组织利用机器学习，如果不能完全理解感知到的失败的真实原因，可能会降低人工智能的感知价值，并导致未来支持减少。\n\
  \n追求简洁。只要可能，保持简单总比过度设计、构建复杂且昂贵的机器学习模型要好，因为后者难以解释和传播。\n\n"
- "# 6. 准备数据\n\n> *成功取决于事先的准备，没有这样的准备，失败就不可避免。*\n> \n> ——孔子\n\n机器学习围绕训练算法以执行各种计算密集型任务展开。算法的训练是通过向模型输入数据来完成的，因此，数据清洗和准备是任何数据或机器学习项目中最关键的步骤。再怎么强调也不为过：即使将糟糕的数据输入世界上最先进的机器学习模型，也会产生糟糕的结果。\n\
  \n这一切都是有充分理由的。无论是前往餐厅的路线、叫出租车、导航飞机，还是接受在线购物篮中的替代品，相信数据和算法胜过我们自己的判断，这种做法既有优点也有缺点。人非圣贤，孰能无过，但当算法犯错时，我们很可能不会再信任它。\n\
  \n现实世界中的数据本质上是碎片化的。在医疗保健领域，电子健康记录（EHR）分布在多个分布式数据库系统中。入院数据、处方数据、可穿戴设备数据和行为数据都各自孤立地存在。将数据汇集在一起的行为，即数据链接，通常会创建新的数据表，这些表中可能包含存在缺失、不完整或已转换值的变量。\n\
  \n人们对机器学习工程师有许多看法。现实情况是，大多数优秀的工程师将大部分时间花在清洗和准备数据上。\n\n制定适当的数据准备计划、填补缺失值、删除行和不必要的变量、以及转换特征，是一些最常见的数据准备实践。\n\
  \n## 数据准备的阶段\n\n在项目的数据准备阶段，目标是确保数据集处于最适合机器学习的状态。\n\n数据准备有五个不同的阶段，如图 6-1 所示：\n\n\
  ![../images/459335_2_En_6_Chapter/459335_2_En_6_Fig1_HTML.jpg](img/459335_2_En_6_Fig1_HTML.jpg)\n\
  \n图 6-1\n\n数据准备的五个阶段\n\n1.  收集\n\n2.  探索\n\n3.  清洗\n\n4.  转换\n\n5.  扩展（主要通过特征工程）\n\
  \n数据的审查和分析需要理解数据库和结构化查询语言（SQL），这是任何机器学习工程师或数据科学家必备的技能。\n\n## 什么是数据库？\n\n数据库是数据的结构化集合，通常以表格形式电子存储，表格由行和列构成。\n\
  \n作为一种持久化存储机制，数据库允许存储数据并实现诸如 CRUD（创建、读取、更新、删除）等功能。数据库管理系统（DBMS）是用于控制数据的软件。一些流行的\
  \ DBMS 示例包括 Microsoft Access、Microsoft SQL Server、MySQL、Oracle Database 和 Ingres。\n\
  \n数据库有多种类型，其中最常见的有以下几种：\n\n*   **关系型数据库**是最流行且使用最广泛的数据库类型。关系型数据库将数据存储在结构化的表中，包含行（记录）和列（变量或特征）。结构化查询语言（SQL）是用于查询关系型数据库的语言。\n\
  \n*   **层次型数据库**结构类似于树，以父子关系存储数据。每个子记录只有一个父记录。父记录可以有多个子记录。层次型数据库的示例包括 IBM 信息管理系统（IMS）和\
  \ Windows 注册表，检索数据需要遍历每个树直到找到记录。网状数据库是层次型数据库的扩展，其中子节点可以有多个父节点，因此存在多对多关系。\n\n*  \
  \ **面向对象数据库**将数据存储为对象，为面向对象编程语言提供数据库功能。\n\n*   **NoSQL 数据库**是非关系型的，意味着它们没有预定义的模式，因此允许存储和操作半结构化和非结构化数据。NoSQL\
  \ 数据库分为五类：列、文档、图、键和对象。\n\n虽然大多数人对关系型数据库比较熟悉，但受网络和移动应用程序的使用、存储和处理非结构化数据的需求，以及永恒的速度提升要求所驱动，NoSQL\
  \ 数据库的使用量激增。\n\n\n\n### 数据库面临的挑战\n\n针对特定场景的最佳数据库类型，取决于个人或组织希望如何使用所存储的数据。在大多数情况下，数据库需要近乎实时地返回复杂查询的结果。这使得性能提升成为数据库维护工作的核心焦点。\n\
  \n#### 应对不断增长的数据量\n\n随着数据来自可穿戴设备、传感器、联网设备、用户行为以及各种其他来源，应对高速数据源和不断增大的文件体积，是大多数数据库管理员（从新手到经验最丰富者）面临的主要难题。\n\
  \n#### 可扩展性\n\n很难准确预测需要多少存储空间。由于存储需要真金白银，一个能够根据所有者需求进行伸缩和调整的数据库更受青睐。\n\n#### 可访问性\n\
  \n对数据库的要求日益增长。在当今世界，各种利益相关者需要实时访问数据，以支持决策、抓住新机遇并理解趋势。\n\n#### 数据库管理与维护\n\n必须对数据库进行维护，以防止问题并确保遵循行业最佳实践。随着数据复杂性和数据量的增长，需要投入更多时间资源来监控和优化数据库。这可能包括定期备份、检查数据库是否损坏、确保安全措施到位、监控性能以及为预期需求进行规划。\n\
  \n#### 维护数据安全\n\n随着数据量和可访问性要求的提高，保护数据免受入侵者攻击变得越来越困难。随着技术的创新，网络犯罪分子也在不断进化。\n\n###\
  \ 数据库与电子表格有何区别？\n\n数据库和电子表格都能存储数据。然而，主要区别在于数据的存储方式、可存储的数据量以及数据的访问方式。\n\n电子表格最初是为单个用户设计的，该用户不希望执行过于复杂的操作。因此，电子表格的功能有限，其特性也反映了这一点。例如，需要仔细考虑如何最好地衡量对电子表格的并发访问。\n\
  \n而数据库则旨在容纳更大的数据集合，并允许多个用户通过编程语言安全地查询数据。\n\n## 什么是结构化查询语言（SQL）？\n\n无论是在项目的数据准备阶段还是数据分析阶段，对\
  \ SQL 的良好理解都将有助于处理大部分数据和机器学习任务。\n\n结构化查询语言（SQL）是用于与关系型数据库通信的编程语言，也是数据准备的首选语言。\n\n\
  使用 SQL 的常见数据库管理系统包括 MySQL、Microsoft SQL Server、Access 和 PostgreSQL。MySQL 是免费使用的，是业余爱好者和企业用户的热门选择。\n\
  \n尽管存在多个版本的 SQL，但它们在结构上非常相似，这意味着如果你了解如何使用一个版本的 SQL，你几乎就学会了所有版本。\n\n本章将介绍最重要的命令和概念。\n\
  \n### 常见 SQL 命令与概念\n\n常见的 SQL 命令包括 select、insert、update、delete、create 和 drop。\n\n\
  SQL 包含一组称为保留字的词汇，这些词汇被用作命令并被解释执行。因此，这些词不能用于命名表或变量。完整列表可在补充材料中找到。\n\n#### 创建表\n\n\
  关系型数据库将数据存储在称为表的对象中。表由行和列组成，用于存储数据，并通过名称进行唯一标识。行指代记录，列指代特征或属性。\n\n***create table***\
  \ 命令用于在 SQL 中创建表。创建表需要指定表名、字段及其各自的数据类型。语法如下：\n\n```\ncreate table Example_Table\
  \ {\ncolumn1_name datatype\ncolumn2_name datatype\ncolumn3_name datatype\n...\n\
  };\n```\n\n其中 columnX_name 指列的名称，datatype 指该列所保存的数据类型。常见的数据类型包括以下几种：\n\n| char(n)\
  \ | 一个固定长度的字符串，长度 *n* 在括号中指定。最大大小为 255 字节。 |\n| --- | --- |\n| varchar(n) | 一个可变长度的字符串，最大长度\
  \ n 在括号中指定。 |\n| number(n) | 一个数值，最大位数在括号中指定。 |\n| date | 一个日期值。 |\n| number(n,i)\
  \ | 一个数值，总位数最大为 \"n\"，小数点后最多有 \"i\" 位数字。 |\n\n数据类型的完整参考列表可在随附材料中找到。\n\n假设我们要创建一个小型数据库系统，用于管理一个医院网络的急诊入院情况，该系统主要关注三个实体：入院记录、地点和患者。每个实体都需要一个对应的表。每个表将描述这些实体的特征。每个特征将是表中的一个独立列。\n\
  \n为了便于说明，一个可用于记录医院急诊病房入院情况的表可以定义如下：\n\n```\ncreate table Emergency_Admissions {\n\
  [ADMISSION_ID] INT IDENTITY(1,1) PRIMARY KEY\n[LOCATION_ID] INT,\n[PATIENT_ID] INT,\n\
  [ADMISSION_DATE] DATE,\n[PRESENTING_WITH] TEXT,\n[CONTACT_TELEPHONE] INT\n[EMAIL]\
  \ CHAR(50),\n[PRIORITY] BIT\n}\n```\n\n在该示例中，入院记录实体有七个属性：入院 ID、地点 ID、患者 ID、入院日期和时间、呈现症状、联系电话号码以及是否为优先入院。每次入院都有一个唯一的\
  \ ID，并通过地点 ID 和患者 ID 来标识相关的医院和患者。\n\n#### 向表中插入数据\n\n***insert into*** 语句用于向表中插入记录：\n\
  \n```\ninsert into Example_Table {column1_name, column2_name, column3_name, ...)\n\
  values (value1, value2, value3, ...)\n};\n```\n\n其中列名指实体的特征或属性。例如，以下命令可用于向表 6-1\
  \ 中插入数据：\n\n表 6-1\n\n医院急诊入院记录\n\n| ADMISSION_ID | LOCATION_ID | PATIENT_ID | ADMISSION_DATE\
  \ | PRESENTING_WITH | CONTACT_TELEPHONE | PRIORITY |\n| --- | --- | --- | --- |\
  \ --- | --- | --- |\n| 594 | 11 | 1453 | 08/08/2020 | 脑震荡 | 447755366555 | 0 |\n\
  | 595 | 11 | 1225 | 08/07/2020 | 头部创伤 | 447733366552 | 1 |\n| 596 | 6 | 997 | 08/13/2020\
  \ | 心脏病发作 | 447709366550 | 1 |\n\n```\ninsert into Emergency_Admissions (LOCATION_ID,\
  \ PATIENT_ID, ADMISSION_DATE, PRESENTING_WITH, CONTACT_TELEPHONE, PRIORITY)\nvalues\
  \ ('6','997',Date(), 'Heart attack', '447709366550', '1')\n```\n\n#### 主键与外键\n\n\
  表中至少有一个字段是主键。主键作为表中每条记录或每行数据的唯一标识符。表中的每一列都描述了与主键相关的某些信息。在我们的入院记录示例中，主键是入院 ID。\n\n\
  外键是指用于链接两个或多个表之间数据的主键。例如，在我们的急诊入院表中，地点 ID 和患者 ID 都是各自独立表或实体的主键。外键有助于数据库最大限度地减少重复并提高效率。数据库管理的一个重点是节省空间，因此存储所需的最少数据量有助于实现这一目标。\n\
  \n\n\n#### Select、From 和 Where 命令\n\n***select*** 命令用于查询数据库并检索符合命令指定条件的数据。***from***\
  \ 关键字后的表名指定了要从中检索数据的表。可选地，可以使用 where 子句来指定数据返回所依据的条件：\n\n```\nselect column1_name,\
  \ column2_name, column3_name, …\nfrom Table_Name\nwhere condition;\n```\n\n要提取我们工作示例中所有入院到位置\
  \ 11 的记录，我们可以使用以下命令，该命令将仅返回入院表的前两行：\n\n```\nselect *\nfrom Emergency_Admissions\n\
  where LOCATION_ID = 11;\n```\n\n***where*** 命令与 SQL 语句一起使用，用于仅识别那些满足指定条件的记录。\n\n\
  ***distinct*** 语句通常与 select 语句结合使用，以仅从表中提取非重复值。以下语句将输出表 6-2 中的结果：\n\n表 6-2\n\n不同的急诊入院位置\
  \ ID\n\n| Location_ID |\n| 11 |\n| 6 |\n\n```\nselect distinct location_id\nfrom\
  \ Emergency_Admissions;\n```\n\nselect top 命令可用于指定要返回的行数。此命令对于大型数据集特别有用，因为可能只对其中一小部分结果感兴趣：\n\
  \n```\nselect top number | percent column_name(s)\nfrom Table_Name\nwhere condition;\n\
  ```\n\n#### AND、OR、NOT 运算符\n\n逻辑运算符 AND、OR 和 NOT 可以与 where 子句一起使用，根据条件过滤检索到的数据：\n\
  \n*   AND：如果所有由 AND 分隔的条件都为 TRUE，则显示记录。\n\n*   OR：如果由 OR 分隔的条件之一为 TRUE，则显示记录。\n\n\
  *   NOT：如果条件不为 TRUE，则显示记录。\n\n#### Group By\n\n***group by*** 命令将具有相同值的记录分组到聚合行中。因此，它通常与\
  \ COUNT、MAX、MIN、AVG 和 SUM 等聚合函数一起使用，以按列对结果集进行分组。使用我们的工作示例，以下语句将输出表 6-3 中所示的结果：\n\
  \n表 6-3\n\n按优先级分组的急诊入院记录\n\n| Count(Admission_ID) | PRIORITY |\n| --- | --- |\n\
  | 1 | 0 |\n| 2 | 1 |\n| 596 | 6 |\n\n```\nselect count(Admission_ID), Priority\n\
  from Emergency_Admissions\ngroup by Priority;\n```\n\n#### Update 命令\n\n***update***\
  \ 语句用于更新表中已存在的数据：\n\n```\nupdate Table_Name\nset column1_name = 'value'\nwhere condition;\n\
  ```\n\n在此示例中，column1_name 指的是其值将被更新的数据库表列。例如，要将我们工作示例中 admission_id = 594 的优先级更新为\
  \ 1，可以使用以下语法：\n\n```\nupdate Emergency_Admissions\nset priority = 1\nwhere admission_id\
  \ = 594;\n```\n\n#### Delete 和 Truncate 命令\n\n***delete*** 语句从表中删除一条或多条记录：\n\n```\n\
  delete from table_name\nwhere condition;\n```\n\n***truncate*** 命令删除表中的所有行，但保留列和约束。truncate\
  \ 命令删除表中的所有行，而 delete 命令允许过滤行。\n\n#### 删除表\n\n***drop table*** 命令用于删除表及其包含的数据。语法很简单：\n\
  \n```\ndrop table Table_Name;\n```\n\n其中 Table_Name 是要删除的表的名称。\n\n#### 类型转换\n\n\
  类型转换在准备数据时非常有用，例如，当需要将字符串转换为日期或将整数转换为字符串时。***cast()*** 函数将值更改为指定的数据类型：\n\n```\n\
  cast (valuetoconvert AS datatype(size))\n```\n\n#### NULL 值\n\nNULL 值指的是没有值的字段。或者，另一种理解\
  \ NULL 值的方式是将其视为空白。例如，如果某个表具有某些可选字段，在创建新行时这些字段不是必需的，则可能会出现 NULL 值。NULL 值与包含空格或零值的字段不同。\n\
  \n#### 连接\n\n存储在多个表中的数据需要先合并才能进行查询和分析。连接两个表主要有五种方式，它们都会影响结果表的大小。\n\n##### 内连接\n\n\
  INNER JOIN 命令是最常用的连接命令，用于选择两个表中具有匹配记录的行。该命令仅当列之间存在匹配时才选择行。INNER JOIN 的表示见图 6-2。\n\
  \n![../images/459335_2_En_6_Chapter/459335_2_En_6_Fig2_HTML.jpg](img/459335_2_En_6_Fig2_HTML.jpg)\n\
  \n图 6-2\n\nINNER JOIN 的集合表示\n\n***on*** 语句用于标识要连接表的列。\n\n例如，表 6-1 和 6-4 可以使用以下 SQL\
  \ 语句进行连接，以输出表 6-5 中显示的患者姓名列表：\n\n表 6-5\n\n内连接结果\n\n| ADMISSION_ID | ADMISSION_DATE\
  \ | PATIENT_ID | FIRSTNAME | SURNAME |\n| --- | --- | --- | --- | --- |\n| 594 |\
  \ 08/08/2020 | 845 | Susan | Riley |\n| 595 | 08/07/2020 | 36 | Ahmed | Ali |\n\
  | 596 | 08/13/2020 | 663 | Anupam | Sanyal |\n\n表 6-4\n\n患者联系表\n\n| PATIENT_ID |\
  \ GP_ID | FIRSTNAME | SURNAME | DOB | CITY |\n| --- | --- | --- | --- | --- | ---\
  \ |\n| 1453 | 845 | Susan | Riley | 06/04/1984 | Warwick |\n| 1225 | 36 | Ahmed\
  \ | Ali | 14/03/1955 | Wrexham |\n| 997 | 663 | Anupam | Sanyal | 04/04/1938 | Crewe\
  \ |\n\n```\nselect ADMISSION_ID, ADMISSION_DATE, FIRSTNAME, SURNAME,\nfrom Emergency_Admissions\n\
  inner join Patient_Details\non Emergency_Admissions.PATIENT_ID = Patient_Details.PATIENT_ID;\n\
  ```\n\n##### 左连接和右连接\n\nLEFT JOIN 命令将返回左表中的所有记录以及右表中匹配的记录。如果右表中没有匹配项，则输出 NULL。集合表示见图\
  \ 6-3。\n\n![../images/459335_2_En_6_Chapter/459335_2_En_6_Fig3_HTML.jpg](img/459335_2_En_6_Fig3_HTML.jpg)\n\
  \n图 6-3\n\nLEFT JOIN 的集合表示\n\n类似地，RIGHT JOIN 以相反的方式操作，返回右表中的所有记录以及左表中匹配的记录（如果存在匹配），否则输出\
  \ NULL。图 6-4 显示了其集合表示。\n\n![../images/459335_2_En_6_Chapter/459335_2_En_6_Fig4_HTML.jpg](img/459335_2_En_6_Fig4_HTML.jpg)\n\
  \n图 6-4\n\nRIGHT JOIN 的集合表示\n\n##### 全连接\n\nFULL JOIN 命令，也称为 FULL OUTER JOIN 命令，当左表或右表行中存在匹配时，返回所有记录。\n\
  \n因此，这可能会输出大型数据集，并且计算成本高昂，因为无论另一个表是否匹配，都会检索两个表中的所有匹配记录。图 6-5 显示了其集合表示。\n\n![../images/459335_2_En_6_Chapter/459335_2_En_6_Fig5_HTML.jpg](img/459335_2_En_6_Fig5_HTML.jpg)\n\
  \n图 6-5\n\nFULL OUTER JOIN 的集合表示\n\n\n\n#### SQL 日期函数\n\n每一条健康记录，无论是来自电子健康档案还是可穿戴设备，都带有日期和时间戳。\n\
  \n日期对于评估随时间变化的健康状况至关重要。例如，特定治疗后出现的症状可能被视为副作用，而并发症后的状况则属于后续病症。SQL 提供了几个有用的内置日期函数，可用于操作日期：\n\
  \n*   `GetDate()`：此函数输出当前日期，且不接受任何输入。\n\n*   `DateAdd(period, number, date)`：此函数将给定的时间量（由\
  \ period 指定，如小时、天、月、年）添加到所提供的日期上。提供的数字可以创建未来的日期，若为负数则可提供过去的日期。\n\n*   `DatePart(part_of_date,\
  \ date)`：此函数返回日期时间中的单个部分（如分钟、小时、天、季度、年等）。\n\n*   `DateDiff(part_of_date, date1,\
  \ date2)`：此函数返回两个给定日期之间的差值。`part_of_date` 指明了输出结果的时间单位。\n\n## 数据收集\n\n机器学习项目的第一个阶段涉及收集项目将要使用的数据集。由于我们处理的是电子健康档案数据，并且出于本章的目的，我们假设机器学习项目中要使用的数据集已经存在。\n\
  \n## 数据探索\n\n一旦收集到数据集，就需要对其进行探索。数据准备的发现阶段使工程师能够理解可用数据及其约束条件和细微差别。\n\n活动包括：\n\n*\
  \   有多少数据可用？\n*   数据以何种格式提供？\n*   数据以何种数据类型提供？\n*   日期以何种格式提供？\n*   是否存在缺失值？\n*\
  \   是否存在明显的重复？\n*   NULL 值是空值还是 NULL？\n*   异常值：离群值是否有效？\n*   数据是否平衡？\n*   数据中是否存在偏差？\n\
  *   是否存在拼写错误？\n*   是否存在多个字符串代表相同类别的情况？\n\n一旦审查完可用数据，项目便进入数据清洗阶段。\n\n### 不平衡数据\n\n\
  需要注意的一点是，数据可能是不平衡的。不平衡的特征可能会阻止机器学习模型学习类别如何影响输出。例如，一个主要在白人皮肤上训练的皮肤癌预测算法，对于黑人、棕色人种或任何其他肤色的人来说几乎毫无用处。为了防止这种形式的偏差，你应该为不同的类别计算准确率指标。\n\
  \n## 数据清洗\n\n数据清洗处理不完整、重复、缺失或不正确的值。数据清洗的目的是提高可用于训练模型、提供分析或做出决策的数据质量。机器学习项目的这个阶段最为艰巨，并且会消耗大量时间。数据清洗阶段涉及以下任务。\n\
  \n### 处理缺失值\n\n缺失值是一个常见问题。大多数机器学习模型需要完整的特征集，因此这个活动已被充分研究。缺失值可以被假定为数据集中最常见的值，从其他可用数据中推断出来，或者直接删除包含缺失值的行。\n\
  \n假设一个包含一组患者健康数据的数据表，其中有高血压、心脏病发作和中风诊断的列。如果高血压诊断值为 NULL，则该字段可以被假定为该单元格最常见的诊断值。或者，也可以根据附近的其他值来估算。\n\
  \n例如，心脏病发作和中风诊断可能有助于估算高血压诊断。此外，如果有更多数据可用，高血压诊断也可以从用药数据中推断出来。删除数据通常是最后的手段，以确保重要数据不会丢失或引入任何形式的偏差。\n\
  \n### 矛盾数据和重复数据\n\n如果数据与现实世界相似，则应探究矛盾数据，以确定事件是合理的还是随机的。例如，数据显示患者在出生日期之前入院，这突显了日期格式或表示方式可能存在问题。重复数据最好始终予以删除。\n\
  \n### 探索数据中的异常值\n\n需要探索数据中的异常值，以了解它们是错误的还是重要的。从数据集中移除异常值（或离群值）被称为数据修剪。如果数据与现实世界相似，异常值很可能是合理的。\n\
  \n机器学习的质量取决于你用来训练它的数据。如果数据存在偏差（即不具有代表性），那么学习结果也会有偏差。同时，在探索数据集时，要注意避免引入人为错误。这通常通过确保良好的版本控制来实现。\n\
  \n### 纠正拼写错误、清理值和格式化\n\n确保数据集中没有拼写错误。数字化文本（例如手写文本）可能存在错误。检查你的数据集是否存在错误、偏差和不一致之处。这是一个非常常见的问题。\n\
  \n将文本的大小写规范化为全小写或全大写。遍历数据，评估是否存在唯一项有多个表示形式的情况，并纠正任何拼写错误的字符串或分类。例如，高血压在数据表中可能表示为“high\
  \ blood pressure”、“hypertension”和“arterial hypertension”，所有这些类别都是正确的，但需要统一以确保数据准确性。\n\
  \n审查所有列的格式，特别注意日期和整数，确保它们采用首选的格式和编码。这可能涉及将列转换为不同的数据类型。\n\n格式可能需要更改；例如，你可能需要将数据导出为平面文件，而不是传统的关系数据库。你可能只想处理样本数据的一个子集。\n\
  \n### 对结果组进行分类\n\n数据集中的列通常具有较大的值分布，其中一些值的频率较低。当输入自由文本时尤其如此。在某些情况下，将这些记录分类到不同类别中可能会有所帮助。\n\
  \n## 数据转换\n\n数据准备的下一阶段是数据转换。收集到的数据恰好符合你的要求是罕见的情况。为了使数据更有用，可以应用数据转换技术。\n\n这通常由你使用的算法和可用的数据来指导。例如，如果一个机器学习算法将\
  \ 2 型糖尿病的诊断作为整数输入——“[0 表示假]”和“[1 表示确诊 2 型糖尿病]”——但医疗记录中写的是“type 2 diabetes”或“no type\
  \ 2 diabetes”，那么数据就需要从文本转换为整数，以便机器可读。\n\n也可能使用缩放——例如，将公制单位转换为英制单位。\n\n转换可以包括以下内容。\n\
  \n### 聚合\n\n聚合是指可以将多个属性聚合为单个属性。例如，可以将特定患者参加健康教育的日志聚合为参加总次数的计数，而不是分别表示每次参加。\n\n###\
  \ 分解\n\n分解是指对属性进行划分，使其对机器学习技术更有用。例如，患者的记录可能将其种族列为“亚洲人”。然而，为了更准确地预测肥胖风险等标准，了解患者的出生国和主要语言可能会更好。\n\
  \n### 编码\n\n编码将分类变量更改为数值型的、机器可读的表示形式。有序分类需要一个排名作为输入。无序分类可以使用一个列来标记该记录中某个类别是否为真。\n\
  \n\n\n### 缩放\n\n数据可能包含量级各异的属性。例如，以千克为单位的体重、以厘米为单位的身高以及临床指标可能使用完全不同的量纲。缩放将数据转换到特定的公共范围。缩放可以通过归一化或标准化来实现。\n\
  \n### 偏态数据\n\n偏态数据可以通过统计技术进行归一化，以近似更对称的分布。方法包括对数变换、根变换和倒数变换。\n\n### 偏差缓解\n\n如果数据中存在偏差，可以通过多种预处理技术来缓解。偏差缓解预处理算法包括重新加权、学习公平表示、消除差异性影响以及优化预处理。\n\
  \n偏差缓解与数据不平衡不同。数据不平衡是指数据集中每个类别的样本数量不相似。\n\n### 权重\n\n权重指的是特定特征的重要性或影响力。通常，正权重会增加预测值，而负权重则会降低预测值。\n\
  \n## 扩充\n\n现有的数据集可以通过特征工程进行扩充和丰富，基于当前特征的数据和任务目标来生成新特征。\n\n在执行特征工程时，对当前数据的理解至关重要——无论这种理解是由团队提供还是由领域专家提供。特征工程涉及提取特征和识别关系。\n\
  \n### 特征提取\n\n特征提取从原始数据字符串中创建新列。例如，这可能是一个基于短语、值或频率的新列。\n\n例如，聚合可能涉及将患者年龄按 10 年为一个区间进行分类，而不是指定一个连续的数字。分解则涉及减少数据内部的依赖性。这甚至可能包括在数据准备期间将之前被排除且模型未见过的属性纳入其中。\n\
  \n### 识别特征关系\n\n可以明确突出特征之间的关系，以帮助机器学习模型了解哪些是重要的。例如，一个模型可能难以轻易地将多个地址的纬度和经度联系起来，但通过指定城市，它可能能更好地识别模式。\n\
  \n### 特征缩减\n\n如果数据过多，过多的特征会使机器学习模型难以从噪声中识别信号。减少特征数量有助于避免“维度灾难”，即在高维空间中分析和组织数据时出现的、在低维设置中不会发生的现象。\n\
  \n## 结论\n\n机器学习模型需要数据以特定方式格式化才能进行学习。良好的数据准备能够生成清晰准确的数据，从而产生更有用、更准确的机器学习模型和预测。本章探讨了数据准备所涉及的阶段、所需技能以及注意事项。\n\
  \n正如所强调的，数据准备是成功机器学习项目的基础，也是不可跳过的重要步骤。\n\n即使是好的数据也必须经过审查，以确保其格式正确、量纲合适并保留了有意义的特征。高质量的数据将提供高质量的信息，使每一个决策都更加明智。\n\
  \n"
- "# 7. 评估机器学习模型\n\n> *智力是适应变化的能力。*\n> \n> ——斯蒂芬·霍金\n\n作为一个领域，机器学习仍处于起步阶段。先进的机器学习在过去\
  \ 25 年间才得到探索，这也推动了数据科学成为一种职业。因此，数据科学行业仍处于对人工智能和机器学习无限潜力的惊叹阶段。随之而来的是兴奋与困惑——以及一个正在积累知识、经验和首次遇到问题的行业。\n\
  \n通常，机器学习项目中最费力的任务是识别合适的模型和工程化特征，这对模型的输出有着实质性的影响。事实上，与模型选择本身相比，所选特征对模型质量的影响往往更大。\n\
  \n因此，评估将决定模型智能程度、用于预测未知样本输出的学习算法非常重要。这通常通过使用各种指标来完成，下文将进一步讨论。\n\n## 模型开发与工作流程\n\n\
  要成功部署和维护一个机器学习模型，需要经历几个开发和评估阶段，如图 7-1 所示。\n\n![../images/459335_2_En_7_Chapter/459335_2_En_7_Fig1_HTML.jpg](img/459335_2_En_7_Fig1_HTML.jpg)\n\
  \n图 7-1\n\n模型开发与工作流程\n\n第一阶段是原型阶段。在此阶段，通过在历史数据上测试各种方法来创建原型机器学习模型，以确定最佳拟合模型。超参数调优（本章后续会讨论）是模型训练的一个要求。一旦选定了最佳原型模型，就需要对其进行测试和验证。验证模型需要将数据集拆分为训练集、测试集和验证集，如第\
  \ 3 章所述。\n\n请考虑这样一个事实：不存在所谓的随机数据集，随机性实际上适用于数据集的拆分。要注意数据中可能出现的偏差。一旦模型成功验证，它就会被部署到生产环境。然后，模型通常会通过一个或多个性能指标进行评估，并在其整个生命周期中进行监控。\n\
  \n评估机器学习模型有两种方式：离线评估和在线（或实时）评估。\n\n### 为什么有两种评估模型的方法？\n\n一个已部署的机器学习模型会从两个来源消费数据：历史数据（即用作学习经验的数据）和实时数据。许多机器学习模型假设数据是平稳分布的——即数据分布随时间保持不变。然而，这在现实生活中并不典型，因为数据的分布通常会随时间变化——这被称为分布漂移。\n\
  \n考虑一个根据患者健康档案预测药物副作用的系统。药物副作用可能会根据人群因素（如种族、疾病特征、地域、药物流行程度和新药物）而变化。基于患者数据的相关副作用分布可能会随时间快速变化，因此，模型必须能够检测到分布漂移并相应地进化模型。\n\
  \n模型通过其在实时数据上的表现进行评估，同时也根据在历史数据的测试和验证阶段使用的验证指标进行评估。\n\n当在实时数据上评估时，性能与验证指标相似或处于可接受阈值内的模型，被认为是持续拟合数据的模型。模型性能下降表明模型不再拟合数据，需要重新训练。组织还应考虑，如果实时机器学习模型性能下降、变得不适合使用或在临床上不安全，所需采取的缓解措施。\n\
  \n#### 离线评估\n\n离线评估基于从历史、平稳分布数据集中学习和评估的指标来衡量模型。准确率和精确率-召回率等指标通常用于离线训练阶段。离线评估技术包括留出法和\
  \ n 折交叉验证。\n\n\n\n#### 在线（实时）评估\n\n在线评估是指在模型部署后对其预测指标进行的评估。关键在于，这些指标可能与模型实际上线时用于评估性能的指标有所不同。例如，一个正在学习新药物治疗方案的模型，在训练和验证阶段可能追求尽可能高的精确度；但上线后，它可能需要考虑预算或治疗价值等业务目标。同一个模型可能会找到一种完美的药物治疗方案，能够解决问题，但在临床上可能仍不安全。评估指标必须结合用例来设定，以确保项目所涉及的所有相关方都能得到体现。\n\
  \n在线评估的优势，尤其是在数字时代，在于它能够通过专门的反馈循环，支持多变量测试，从而实时了解性能最佳的模型。\n\n反馈循环是确保系统按预期运行的关键，有助于更好地理解模型在实际使用环境中的表现。这可以由人工代理执行，也可以通过上下文智能代理或模型用户自动完成。\n\
  \n实时评估可以定期进行，使用已生成但未标记的、之前见过的数据子集，以在约定的容差阈值内保持准确性。\n\n#### 寻找统计独立的数据集\n\n重要的是，机器学习模型的评估应基于一个统计独立的数据集，而不是其训练所用的数据集。这是因为，由于模型会适应训练数据集，因此对训练数据集的评估会对其真实性能过于乐观。通过使用模型从未见过的数据来评估模型，可以更好地估计其泛化误差。\n\
  \n新数据可能难以获取；因此，能够从现有数据集中获得新的、未见过的数据就显得尤为重要。诸如 n 折交叉验证之类的方法就是实现此目的的有效技术。通常，所使用的数据比算法选择更为重要；使用的特征越好，模型的性能就越高。所讨论的评估指标可以在\
  \ R 语言的`metrics`包和 Python 的`scikit-learn`中找到。\n\n如果安全可行，机器学习模型可以面向 BETA 测试参与者或感兴趣的利益相关者开放，以生成数据。\n\
  \n### 评估指标\n\n针对机器学习问题，有大量的评估指标可供使用。这些指标涵盖了各种机器学习任务——分类、回归、聚类、关联规则挖掘、自然语言处理、数据挖掘等等。\n\
  \n你选择的评估指标将根据你的机器学习模型试图解决的问题以及所使用的技术而量身定制。\n\n#### 分类\n\n分类问题旨在为输入数据赋予一个标签或类别。有多种衡量性能的方法，包括准确率、精确率-召回率、混淆矩阵、对数损失和\
  \ AUC（曲线下面积）。\n\n##### 准确率\n\n准确率是判断模型预测是否正确的最简单方法。其计算方式为正确预测数占总预测数的百分比。\n\n*  \
  \ **准确率** = 正确预测数 / 总预测数\n\n##### 混淆矩阵\n\n准确率是一个通用指标，它不考虑类别之间的划分。因此，它不考虑错误分类或与错误分类相关的代价。\n\
  \n例如，一个假阳性的医疗误诊（例如，将没有患乳腺癌的患者诊断为患有乳腺癌）与一个假阴性的情况（即，告知患者没有患乳腺癌，而实际上患者患有乳腺癌）相比，后果截然不同。\n\
  \n混淆矩阵分解了模型做出的正确和错误分类，并将其归因于相应的标签：\n\n*   真正例：实际类别为“是”，预测类别也为“是”。\n\n*   假正例：实际类别为“否”，预测类别为“是”。\n\
  \n*   真负例：实际类别为“否”，预测类别也为“否”。\n\n*   假负例：实际类别为“是”，但预测类别为“否”。\n\n举个例子，假设一个模型根据测试数据集中的\
  \ 50 个样本输入来预测患者是否患有乳腺癌，其中正例和负例样本各占一半。那么混淆矩阵将如表 7-1 所示。\n\n表 7-1\n\n混淆矩阵\n\n|   |\
  \ 预测：阳性 | 预测：阴性 |\n| --- | --- | --- |\n| 标签为阳性 | 20 | 5 |\n| 标签为阴性 | 15 | 10 |\n\
  \n从混淆矩阵可以确定，阳性类别的准确率高于阴性类别。阳性分类的准确率为 20/25 = 80%。阴性类别的准确率为 10/25 = 40%。这两个指标都与模型的整体准确率不同，整体准确率计算为(20\
  \ + 10)/50 = 60%。由此可见，混淆矩阵如何为机器学习模型的整体准确率增加了更多细节。\n\n因此，准确率可以重写为以下形式：\n\n*   **准确率**\
  \ = (正确预测的观测数) / (总观测数)\n\n*   = (TP + TN) / (TP + TN + FP + FN)\n\n##### 每类准确率\n\
  \n每类准确率是准确率的一种扩展，它考虑了每个类别的准确率。因此，前面的例子中，每类准确率为(80% + 40%) / 2 = 60%。\n\n在某个类别的样本数量远多于其他类别的偏斜问题中，每类准确率非常有用。样本数量多的类别在计算中占主导地位，因此仅靠准确率可能不足以反映模型的特性；因此，同时评估每类准确率也很有用。\n\
  \n##### 对数损失\n\n对数损失用于预测连续概率而非类别标签的问题。对数损失提供了准确率置信度的概率度量，并考虑了真实标签分布与预测分布之间的熵。\n\n\
  对于二分类问题，对数损失的计算方式如下：\n\n![$$ \\mathrm{Log}\\hbox{-} \\mathrm{loss}=-\\frac{1}{N}\\\
  sum \\limits_{i=1}^N{y}_i\\log {p}_i+\\left(1-{y}_i\\right)\\log \\left(1-{p}_i\\\
  right) $$](img/459335_2_En_7_Chapter_TeX_Equa.png)\n\n其中 P[i] 是第 *i* 个数据点属于某个类别的概率，y[i]\
  \ 是真实标签（0 或 1）。\n\n##### 曲线下面积 (AUC)\n\nAUC 绘制了真正例率与假正例率的关系曲线。AUC 能够直观地展示分类器的灵敏度和特异度。它突出了在允许假正例的情况下，可以获得多少正确的正分类。\n\
  \n该曲线被称为接收者操作特征曲线，或称 ROC，如图 7-2 所示。AUC 值高或曲线下方面积大是好的，而曲线下方面积小则是不理想的。\n\n![../images/459335_2_En_7_Chapter/459335_2_En_7_Fig2_HTML.jpg](img/459335_2_En_7_Fig2_HTML.jpg)\n\
  \n图 7-2\n\nROC 曲线\n\n在图 7-2 中，测试 A 的 AUC 优于测试 B，因为测试 A 的 AUC 大于测试 B。ROC 曲线直观地展示了模型特异度与灵敏度之间的权衡关系。\n\
  \n\n\n##### 精确率、召回率、特异度与 F1 分数\n\n精确率和召回率是两种常结合使用的模型性能评估指标。精确率评估在所有被正确分类的样本中，真正相关的样本有多少。召回率评估在所有相关样本中，被模型预测为相关的样本有多少：\n\
  \n*   精确率：正确预测的正例数 / 预测为正例的总数 = TP / (TP + FP)\n\n*   召回率：正确预测的正例数 / 实际正例的总数 = TP\
  \ / (TP + FN)\n\n特异度衡量模型正确识别负例的能力，其计算公式如图 7-3 所示。\n\n![../images/459335_2_En_7_Chapter/459335_2_En_7_Fig3_HTML.jpg](img/459335_2_En_7_Fig3_HTML.jpg)\n\
  \n图 7-3\n\n特异度分类示意图\n\n*   特异度：正确预测的负例数 / 实际负例的总数 = TN / (TN + FP)\n\nF1 分数超越了算术平均，计算的是精确率和召回率的调和平均数：\n\
  \n![$$ F\\frac{1}{\\frac{1}{2}\\left(\\frac{1}{p}+\\frac{1}{r}\\right)}=\\frac{2\
  \ pr}{p+r} $$](img/459335_2_En_7_Chapter_TeX_Equb.png)\n\n其中，*p* 表示精确率，*r* 表示召回率。\n\
  \n#### 回归\n\n回归机器学习模型输出连续变量，而均方根误差（RMSE）是这类问题最常用的评估指标。\n\n##### 均方根误差（RMSE）\n\n\
  RMSE 计算的是预测值与实际值之间平均距离的平方和的平方根。这也可以理解为真实值向量与预测值向量之间的平均欧几里得距离。RMSE 的一个缺点是它对异常值敏感。\n\
  \n![$$ RMSE=\\sqrt{\\frac{\\sum_i{\\left({y}_i-{\\hat{y}}_i\\right)}²}{2}}, $$](img/459335_2_En_7_Chapter_TeX_Equc.png)\n\
  \n其中，*y*[*i*] 表示实际值，![$$ \\hat{y} $$](img/459335_2_En_7_Chapter_TeX_IEq1.png) 表示预测值。\n\
  \n##### 误差百分位数\n\n误差的百分位数（或分位数）由于对异常值不那么敏感，因此更为稳健。现实世界的数据很可能包含异常值，因此，查看中位数绝对百分比误差（MAPE）而非平均值通常更有用。\n\
  \n![$$ MAPE= median\\left(\\left\\Vert \\left({y}_i-{\\hat{y}}_i\\right)/\\left({y}_i\\\
  right)\\right\\Vert \\right), $$](img/459335_2_En_7_Chapter_TeX_Equd.png)\n\n其中，*y*[*i*]\
  \ 表示实际值，![$$ \\hat{y} $$](img/459335_2_En_7_Chapter_TeX_IEq2.png) 表示预测值。\n\nMAPE\
  \ 通过使用数据集的中位数，受异常值的影响较小。可以为特定问题设定预测的阈值或百分比差异，以了解回归估计的精确度。\n\n该阈值取决于问题的性质。\n\n##\
  \ 偏斜数据集、异常值与稀有数据\n\n经验丰富的数据科学家会以审慎的态度对待所有数据。数据可能不一致；因此，偏斜数据集、类别样本不平衡以及异常值都可能显著影响模型的性能。某个类别的样本数量远多于另一个类别，可能导致模型性能不佳。如果模型出现问题，应回溯到数据本身，确保机器学习项目数据准备阶段的所有步骤都已正确执行。\n\
  \n异常值或数据异常会进一步扭曲性能评估指标。使用误差百分位数可以减轻大异常值的影响。然而，如果这些异常值代表了真实的患者数据，则应考虑保留它们。在实践中，良好的数据清洗、异常值剔除以及变量归一化可以降低对异常值的敏感度。\n\
  \n## 参数与超参数\n\n超参数和参数这两个术语经常互换使用，但两者之间存在区别。机器学习模型可以理解为表示数据各方面之间关系的数学模型。\n\n### 模型参数\n\
  \n模型参数是训练数据集的属性，在训练过程中由机器学习模型学习和调整。模型参数因模型、数据集属性和具体任务而异。例如，对于一个输出文本语料复杂度的 NLP 预测器，诸如词频、句子长度、每个句子中名词或动词的分布等参数，都将被视为模型参数。\n\
  \n### 模型超参数\n\n模型超参数是模型构建过程中的参数，在训练过程中不会被学习。超参数对机器学习模型的性能有显著影响。超参数定义了模型架构，并影响模型的容量，从而影响模型的灵活性。超参数也可以在训练过程中提供给损失优化算法。\n\
  \n超参数的最优设置会对预测结果产生显著影响，并有助于防止模型过拟合。最优超参数通常因数据集和模型而异。\n\n例如，对于神经网络，超参数将包括隐藏层的数量和大小、权重、学习率等。决策树的超参数将包括期望的树深度和叶子节点数量。支持向量机的超参数则包括误分类惩罚项。\n\
  \n\n\n### 调优超参数\n\n超参数调优或优化是指为机器学习模型选择一组最优超参数的任务。优化后的超参数值能够最大化模型的预测准确率。\n\n超参数通过以下过程进行优化：训练模型、评估整体准确率，并适当调整超参数。通过尝试多种超参数值，可以确定针对该问题的最佳超参数，从而提升模型的整体准确率。\n\
  \n#### 超参数调优算法\n\n超参数调优类似于训练机器学习模型。其核心任务属于优化问题。模型参数可以用损失函数来表示，而超参数则无法如此表达，因为它完全依赖于模型训练过程。超参数调优有几种方法，最常见的是网格搜索和随机搜索。\n\
  \n##### 网格搜索\n\n网格搜索是一种简单、有效但资源消耗较大的超参数优化技术，它会评估一个超参数网格。\n\n该方法会评估每个超参数并确定最优值。例如，如果超参数是决策树的叶子节点数量，其取值范围可能是\
  \ n = 2 到 100，网格搜索会评估 n 的每个值（即网格上的点），以确定最有效的超参数。\n\n通常，超参数的起始点（包括最小值和最大值）需要凭经验猜测。这种方法典型地属于试错法：如果最优值靠近最大值或最小值，网格就会向相应方向扩展，以进一步优化模型的超参数。\n\
  \n##### 随机搜索\n\n随机搜索是网格搜索的一种变体，它会评估网格点的随机样本。从计算角度来看，这比标准网格搜索要节省大量资源。虽然乍看之下，这种方法在寻找最优超参数方面似乎不那么有效，但\
  \ Bergstra 等人证明，在数量惊人的实例中，随机搜索的表现与网格搜索大致相当 [94]。\n\n随机搜索的简单性和超出预期的性能意味着它常常被优先选择，而非网格搜索。网格搜索和随机搜索都可以并行化。\n\
  \n还有一些更智能的超参数调优算法，由于需要评估接下来尝试哪些样本，因此计算成本较高。这些算法通常也有自己的超参数。贝叶斯优化、随机森林智能调优和无导数优化是这类算法的三个例子。\n\
  \n## 统计假设检验（多元检验）\n\n统计假设检验或多元检验是一种极其有用的方法，用于确定哪个模型最适合当前的具体问题。统计假设检验用于判断零假设与备择假设之间的差异。\n\
  \n零假设定义为新模型不影响性能指标的平均值，而备择假设则定义为新模型确实改变了性能指标的平均值。\n\n多元检验通过比较相似模型来了解哪个模型表现最佳，或者将新模型与旧的遗留模型进行比较。比较各自的性能指标，然后决定采用哪个模型。\n\
  \n测试过程如下：\n\n1.  将总体人群随机分为对照组和实验组。\n2.  记录各组人群在提出的假设下的行为表现。\n3.  计算性能指标及相关的 *p*\
  \ 值。\n4.  决定采用哪个模型。\n\n统计假设检验方法使团队能够通过学术交流传播项目成果，并提供了一个报告框架。\n\n尽管这个过程看起来相对简单，但仍有一些关键方面需要考虑。\n\
  \n### 应该使用哪个指标进行评估？\n\n选择适当的指标来评估模型取决于具体的应用场景。需要考虑误报（假阳性）、漏报（假阴性）的影响以及此类预测的后果。错误结果的影响可能非常显著。\n\
  \n构建模型时应使其适应相应的指标。如果一个模型试图预测一个仅发生 0.001% 的事件，可以报告 99.999% 的准确率，但这无法得到确认。\n\n一种方法是重复实验，即进行多次重复评估。虽然这不是万无一失的方法，但这可以减少出现虚幻结果的可能性。如果零假设和备择假设之间确实存在差异，那么这种差异将得到直观的确认。同样，如果一个模型似乎能正确预测输出，请确保结果具有统计显著性。\n\
  \n### 相关性不等于因果性\n\n“相关性不等于因果性”这句话用于强调两个变量之间的相关性并不意味着一个变量导致另一个变量。相关性指的是两个或多个变量之间关系的大小和方向。\n\
  \n因果性，也称为因果关系，强调一个事件的发生与另一个事件的存在有关。人们可能很容易假设一个变量导致了另一个变量；然而，在具有多个特征的模型中，可能存在隐藏因素导致两个变量同步变化。\n\
  \n例如，吸烟是增加患多种癌症风险的一个原因。然而，它可能与酗酒相关，但并不会导致酗酒。\n\n### 多大的变化才算真正的变化？\n\n在拒绝零假设之前所需的变化量，同样取决于具体的应用场景。在项目开始时指定一个令人满意的值，并严格遵守。确保结果具有统计显著性。\n\
  \n### 检验类型、统计功效和效应量\n\n主要有两种检验类型：单尾检验和双尾检验。单尾检验评估新模型是否优于原始模型。然而，这种检验无法说明模型是否比基线模型更差。\n\
  \n因此，单尾检验天生就存在偏差。使用双尾检验时，模型会针对两个方向（正向和负向）的变化可能性进行测试。\n\n统计功效指的是在测试中检测到的差异反映真实世界差异的概率。\n\
  \n效应量通过评估两组数据之间的标准化均值差异来确定两组之间的差异。效应量的计算公式如下：\n\n*   **效应量** = ((实验组均值) – (对照组均值))\
  \ / 标准差\n\n### 检查指标的分布\n\n许多多元检验使用 *t* 检验来分析均值之间的统计差异。*t* 值评估的是差异大小相对于样本数据变异性的程度。然而，*t*\
  \ 检验所做出的假设并非所有指标都能满足。例如，*t* 检验假设两组数据都具有正态分布（或高斯分布）。\n\n如果分布看起来不是高斯分布，则应选择不假设高斯分布的非参数检验，例如\
  \ Wilcoxon–Mann–Whitney 检验。\n\n\n\n### 确定合适的 *p* 值\n\n从统计学角度来说，*p* 值是假设检验中使用的一种计算指标，用于表示证据的强度。*p*\
  \ 值衡量的是统计显著性，或者说概率，即当两个总体之间不存在真实差异时，出现差异是由偶然因素引起的可能性。换句话说，假设零假设为真，数据出现的可能性有多大？它提供了反对零假设的证据，是利益相关者得出结论的一个有用指标。\n\
  \n*p* 值介于 0 和 1 之间，其解释如下 [95]：\n\n*   *p* 值 ≤ 0.05 表示有强有力的证据反对零假设，因此拒绝零假设。\n\n*\
  \   *p* 值 > 0.05 表示反对零假设的证据较弱，因此维持零假设。\n\n*   *p* 值接近 0.05 被认为是临界值，可能向任一方向倾斜。\n\n\
  *p* 值越小，结果由偶然因素造成的概率就越小。\n\n一些医疗保健研究人员建议，对于涉及计算机算法的研究，应采用小于 0.01 的 *p* 值，以证明存在实质性证据反对零假设。\n\
  \n### 需要多少观测值？\n\n所需的观测值数量由项目要求的统计功效决定。理想情况下，这应在项目开始时确定。\n\n### 多变量测试应运行多久？\n\n\
  多变量测试所需的持续时间，理想情况下是捕获足够观测值以满足既定统计功效所需的时间。通常，随着时间的推移进行测试有助于捕获具有代表性且可变的样本。\n\n在确定测试阶段的持续时间时，需考虑新奇效应，它描述了用户的短期反应如何不能代表长期反应。例如，每当\
  \ Facebook 更新其信息流布局或设计时，都会引起一片哗然。一旦新奇效应消退，这种反应很快就会平息。因此，将实验运行足够长的时间以克服这种偏差是很有用的。在模型优化中，长时间运行多变量测试通常不是问题。\n\
  \n### 发现数据变异和漂移\n\n一旦部署，持续监控机器学习模型的性能至关重要。数据变异、漂移以及系统开发要求定期对照基线确认模型。这是确保医疗保健 AI\
  \ 安全部署的关键要求。\n\n变异指的是由于训练数据集的微小变化而产生的误差敏感性。例如，对照组和实验组可能因非随机分割而产生偏差。这可能导致样本数据出现偏差。如果是这种情况，可以使用其他检验方法，例如不假设方差相等的韦尔奇\
  \ t 检验。\n\n通常，发现变异和漂移涉及将离线性能（或验证指标）与来自已部署的实时模型的数据进行对比。如果验证指标发生显著变化，则表明需要通过使用新数据重新训练来修订模型。这可以手动完成，也可以自动完成，以确保模型报告的一致性和对模型的信心。\n\
  \n## 记录模型变更\n\n记录对机器学习模型所做的所有变更，并附上变更说明。这不仅为利益相关者提供了变更日志，还提供了系统随时间变化的物理记录。它还可以作为审计日志。\n\
  \n在开发环境（从测试/预发布到实时部署）中使用版本控制软件，可以自动记录软件变更。版本控制软件提供了一种技术治理形式，可用于部署具有广泛回滚和备份功能的软件。\n\
  \n## 实时监控\n\n已部署的、进行预测的机器学习模型需要流程来支持临床安全性和稳健性。一旦模型部署，监控系统以检测模型级故障并识别环境变化，对于实时运行的临床模型来说是一个明智的考虑。\n\
  \n## 结论\n\n构建机器学习模型涉及一个迭代的、建设性的反馈原则。工程师构建模型，通过特定指标评估模型，进行改进，并持续进行直到达到期望的准确度。仅凭训练数据评估模型性能是无用的。一旦部署，保持这种准确度至关重要。\n\
  \n需要确保实时预测的安全性和准确性。这可以通过本章涵盖的一系列实时评估指标来实现。正如您所料，不同的问题类型需要不同的评估指标。\n\n统计假设检验可以确认假设，并进一步增强对机器学习模型准确性的信心。\n\
  \n\n\n"
- "# 8. 机器学习与人工智能伦理\n\n> *人们担心计算机会变得过于聪明并接管世界，但真正的问题在于它们太过愚蠢，却已经接管了世界。*\n> \n> ——佩德罗·多明戈斯\n\
  \n从超市结账到机场值机，从数字医疗到网上银行，利用数据和人工智能进行决策的现象无处不在。过去二十年间，数据的可用性呈天文数字般增长，这首先得益于网络连接，如今则归功于物联网。传统数据科学团队专注于利用数据来创建、实施、验证和评估可用于预测分析的机器学习模型。行为心理学已融入数字健康领域。\n\
  \n从引导应用用户提交健康数据的助推策略、调查问卷的措辞设计、内容呈现方式，到在快餐应用订单中推销附加薯条，机器学习正在影响我们的决策，而这种影响力需要得到规范。\n\
  \n在过去十年中，特别是在医疗保健领域，涌现了大量由数据驱动的人工智能和技术进步，这些进步改善了生活质量：\n\n*   **无创血糖监测**：无创血糖管理领域取得了诸多进展。谷歌开发了一种隐形眼镜，可通过泪液测定用户的血糖水平[96]。法国公司\
  \ PKvitality 则研发了一款小型手表，用于测定血液中的葡萄糖水平。此外，通过远红外信号测定血糖水平的技术也取得了进展[97]。\n\n*   **人工胰腺**：作为系统组合，人工胰腺使用两种设备。第一种设备通过传感器测量血糖，并与第二种设备（或贴片）通信，后者负责向患者输送胰岛素。胰岛素输送系统可根据血糖水平调整胰岛素剂量[99]。\n\
  \n*   **非传染性疾病的逆转/缓解**：数字疗法是数字健康领域一门新兴学科，它重新定义了诸如 2 型糖尿病等疾病，认为其并非必然是慢性和进行性的。数字疗法已被证明有助于维持体重减轻、改善血糖控制，并使\
  \ 2 型糖尿病和糖尿病前期得到缓解[91]。\n\n*   **皮肤构造物的生物打印**：3D 打印技术已被用于复制血管和皮肤细胞，以促进烧伤患者的伤口愈合[100]。\n\
  \n*   **同伴支持与人际关系**：诸如 Diabetes.co.uk 等同伴支持社区，在研究中已证明能够改善定性和定量的健康结果[101]。\n\n* \
  \  **足部溃疡检测**：通过机器学习，可以越来越多地检测到足部溃疡、瘀伤以及更广泛的糖尿病足问题，从而加速溃疡检测、预防截肢、确定有效治疗方法并缩短愈合时间[102]。\n\
  \n*   **开源数据共享**：数据存储库和公共 API 实现了系统间的数据共享。以往保守的公司现在也开始拥抱开源的分析、人工智能和数据管理软件。在许多组织中，员工被积极劝阻使用专有工具，或被赋予是否使用的自主权。成本和性能是转向开源数据的驱动因素，主要因为开源数据源已变得更加稳健和易于接受。这种采用也受到新一代数据科学家和大学毕业生对开源数据安全性和能力的认知所推动[103]。\n\
  \n通过机器学习开发出的解决问题的新方案，其本身也引发了道德和伦理问题。目前，治理的步伐与行业自身的发展速度相当。在人工智能领域，存在许多没有先例、法规或法律可循的场景。考虑创建智能系统的伦理和道德影响至关重要。\n\
  \n世界卫生组织报告称，到 2050 年，慢性病患病率将上升至全球人口的 57%[104]。不幸的是，世卫组织还报告称，全球医护人员短缺问题日益严重，到 2035\
  \ 年将增至 1290 万人[105]。缺乏提供医疗服务的专业人员，描绘了一幅严峻的未来图景，将对人类造成严重后果。医护人员短缺正通过人工智能、数字干预、物联网及其他数字技术得到弥补，这些技术不仅能替代体力和认知工作任务，还能提高医疗保健的覆盖范围、精准度和可用性。与此同时，在疾病检测与诊断、基因组学、药理学、干细胞与器官治疗、数字医疗以及机器人手术方面的进步，有望最大限度地降低治疗疾病和病症的成本。\n\
  \n随着人工智能渗透到人类的日常活动中，哲学、道德、伦理和法律问题也随之浮现。在医疗保健领域，这一点尤为突出，因为临床决策可能意味着生与死的差别。\n\n即使人工智能能够辅助诊断疾病或预测未来的死亡风险，人类会愿意接受人工智能的建议而非医生的建议吗？随着人类逐渐习惯于与智能系统共存，还有一系列障碍需要克服。\n\
  \n## 什么是伦理？\n\n伦理或道德哲学，指的是塑造人们决策和行为方式的道德行为准则（或一套道德原则）。道德则是指区分善/正确与恶/错误行为的原则。\n\n\
  例如，工作场所的伦理通常通过员工必须遵守的职业行为准则来传达。\n\n### 什么是数据科学伦理？\n\n数据科学伦理是伦理学的一个分支，关注隐私、决策和数据共享。\n\
  \n数据科学伦理包含三个主要方面：\n\n*   **数据伦理**\n\n    数据科学伦理的这一领域侧重于数据的生成、收集、使用、所有权、安全性和传输。\n\
  \n*   **智能伦理**\n\n    数据科学伦理的这一领域涵盖了利用数据开发的预测分析所产生的输出或结果。\n\n*   **实践伦理**\n\n  \
  \  实践伦理由弗洛里迪和塔代奥提出，指的是创新和系统的道德性，以指导解决新兴问题[106]。\n\n\n\n### 数据伦理\n\n全球智能手机的数量已超过人口总数——手机、平板电脑、数字设备，以及各类应用、可穿戴设备和传感器，每天都会产生数百万个数据点。目前全球有超过\
  \ 72 亿部手机在使用中，每年售出 1.12 亿台可穿戴设备，可供下载的医疗健康类应用超过 10 万个[107–110]。IBM 报告称，每天产生的数据量超过\
  \ 2.5×10¹⁸ 字节（2.5 京字节）[110]。数据无处不在，而且极具价值。\n\n数据伦理这一话题因 Facebook-剑桥分析公司丑闻等备受瞩目的重大事件而被推至公众视野。作为全球最大、最受信赖的数据收集组织之一，Facebook\
  \ 曾通过其平台上举办的一项测验，导致用户数据被非法获取。\n\n完成该测验的 150 万人的行为与人口统计数据被出售给剑桥分析公司。普遍认为，这些数据被用于精准定位并影响\
  \ 2017 年美国大选的结果[111]。更令人担忧的是，这一安全漏洞在最初数据泄露两年多后才被曝光。\n\n我们正处在一个假新闻传播速度比真相更快的时代。社会正处于其演进的关键节点，必须共同探讨数据的应用、接受与依赖问题，以制定关于如何合乎伦理地处理数据的对话框架与指导原则。人们已经意识到假新闻和错误信息的存在[112]。人工智能需要以伦理为基础，并且具备可解释性。\n\
  \n数据使用所涉及的伦理与道德影响极为广泛，通过一个例子最能说明问题。在本章中，我们将参考以下假设场景。\n\n**场景 A**\n\n约翰，30 岁，2 型糖尿病患者，因严重低血糖发作被紧急送往医院。\n\
  \n约翰在昏迷状态下被送往医院接受治疗。约翰是一名卡车司机，遵医嘱使用胰岛素治疗其 2 型糖尿病，这很可能是导致他低血糖的原因。在此过程中产生了大量数据：既有医院和医疗专业人员记录的数据，也有约翰的\
  \ Apple Watch 生成的数据——包括他的心率、心率变异性、活动详情以及血氧饱和度，用以监测糖尿病昏迷的迹象。此外，还采集了约翰的血样并确定了其基因组。我们假设所有这些数据都得到了利用，并且是有用的。\n\
  \n在前往急诊室的路上，约翰的 Apple Watch 被用于监测他的心脏状况，据此怀疑他存在心律不齐，随后通过医院的医疗设备得到了确认。\n\n从低血糖发作中苏醒后，约翰欣慰地得知基因检测并不总是带来坏消息：由于他携带了\
  \ 2020 年已知与前列腺癌相关的几个基因的低风险变异，他罹患前列腺癌的风险降低了。然而，基因分析也告知他，患阿尔茨海默病、结肠癌和中风的风险有所增加。\n\n\
  ## 知情同意\n\n知情同意是指用户（或患者）知晓其数据将被用于何种目的。知情同意还指个人在法律上有能力给予同意。通常，这要求个人年满 18 岁、心智健全，并且能够行使选择权。理想情况下，同意应是自愿的。\n\
  \n场景 A 展示了数据在特定情境（或用例）下可以多么有用，同时也揭示了知情同意所涉及的诸多复杂细节。\n\n## 选择自由\n\n选择自由是指自主决定你的数据是否被分享以及与谁分享。这指的是主动决定是否将你的数据分享给任何第三方。例如，患有\
  \ 2 型糖尿病的约翰，是否应该被要求在获准再次驾驶卡车之前，证明其血糖水平已得到控制并处于推荐范围内？\n\n一个人是否选择分享其数据，可能会导致这样一种未来：除非个人数据能证明其符合条件，否则将被排除在某些机会之外。在理想世界中，每个人都应有权选择是否分享自己的数据。\n\
  \n在实践中，这既不现实也不可行。\n\n如果约翰不同意或想要同意医疗团队使用其 Apple Watch 数据，会带来伦理影响——即约翰的 Apple Watch\
  \ 数据属于约翰本人。急救团队是否应该仅使用约翰的心率数据来确保心脏仍在跳动？随后诊断出约翰的心房颤动是否合乎伦理？通过知情同意，约翰将拥有选择权，这是数据伦理的基石。\n\
  \n这是患者以前无需做出的选择。在现代生活数据化之前，能够捕捉此类数据的设备更少，预测未来事件的手段也远不如现在先进。\n\n人工智能和机器学习在医疗领域的进步意味着，如今存在两类人：一类是主动寻求健康信息以帮助规划和应对未来情况的人；另一类是乐于活在“不知情”状态中的人。随着万物数据化的持续推进，那些乐于享受“无知之福”的人发现，他们选择不知情的空间越来越小。\n\
  \n## 个人的数据同意是否应被推翻？\n\n在理想世界中，个人分享其数据的决定应得到尊重。然而，作为一个绝对概念，这既不现实也不可行。例如，假设约翰拒绝同意使用他的数据。鉴于急救团队的职责是保障患者的健康，约翰的数据有助于监测其生命体征，这对他得以幸存起到了作用。可以说，如果急救团队在当时不利用手头可用的全部数据，他们的行为反而可能是不道德的。甚至约翰本人，如果这能增加他的生存几率，或许也会推翻自己原先的同意决定。\n\
  \n先例表明，选择自由和同意最终只是一个乌托邦式的概念。在德国，一名被指控强奸并杀害一名 19 岁医科学生的男子，其智能手机中的健康数据在审判中被用作对他不利的证据[113]。这名嫌疑人（通过犯罪现场发现的一根头发被识别）拒绝向警方提供其智能手机的\
  \ PIN 码。警方在慕尼黑一家网络取证公司的帮助下破解了该设备。嫌疑人 iPhone 上的数据包括他的步数和海拔变化，警方对此进行了分析。警方认为，嫌疑人的海拔（爬楼梯）数据可能与他将受害者拖下河岸再爬上来有关。除了定位嫌疑人的行动轨迹外，手机还显示了他进行剧烈活动的时段，其中两个峰值被手机内置应用记录为爬楼梯。\n\
  \n警方调查人员模拟了他们认为嫌疑人处理尸体的方式，并成功复现了嫌疑人 iPhone 上检测到的两个爬楼梯峰值。\n\n## 公众认知\n\nFacebook-剑桥分析公司丑闻进一步凸显了公众在数据隐私问题上的无知程度。美国参议院对\
  \ Facebook 首席执行官马克·扎克伯格的质询，生动地展示了公众在技术问题上的无知和缺乏了解。参议员们对 Facebook 作为一个免费平台如何盈利感到困惑，将发送电子邮件与通过\
  \ WhatsApp 混淆，并质疑加密信息是否可能被用于提供定向广告[114]。\n\n关键利益相关者在数据治理问题上表现出的误解和无知令人震惊。\n\n需要提高公众的认知和理解，以教育公众了解数据的使用，并赋予人们决定其数据如何、在何处以及由谁使用的权力。\n\
  \n\n\n## 谁拥有我的数据？\n\n人们每天都会生成数千个数据点。几乎每一笔交易和行为都会通过智能手机、电视、智能手表、移动应用、健康设备、非接触式卡片、汽车甚至冰箱等设备留下数据痕迹。然而，这些数据归谁所有？数据所有权这一话题是一个复杂的全新问题，它推动了国际政策与治理的发展。从历史上看，用户数据归公司所有，而非个人。\n\
  \n电子健康记录（EHR）能够实现基于机器学习的预测分析，最终使医疗服务提供者能够提供更高水平的护理。尽管患者似乎不太可能不愿分享其健康数据以改善发病率和死亡率，但人们有理由认为，撤回此类权限将变得更加困难，这很像闭路电视（CCTV）的情况——同意往往不被明确记录或显而易见，且人们普遍认为其长期具有功利性益处。\n\
  \n许多平台在用户禁用数据共享功能后，会阻止其访问全部服务。这是出于组织层面的需求，即为了安全、治理和改进，将数据存储在一个强大且集中的存储库中。\n\n以一位使用联网血糖仪和移动应用来追踪并记录血糖的患者为例。血糖数据从用户的血糖仪传输到其移动应用。尽管数据会显示在用户的手机上，但数据实际存储在移动应用提供商的数据库中，并受其使用条款和条件的约束。当今许多网站、移动应用、联网设备及健康服务都声明，数据可以且将会以匿名化或汇总的形式被使用，或者在某些情况下，以可识别身份的形式被提供服务方及其通常选定的合作伙伴使用。\n\
  \n数据收集、使用和共享已成为支持数据驱动型质量改进流程的基本组成部分。有几种类型的数据可以被共享。\n\n### 匿名化数据\n\n匿名化数据是指移除了可识别特征的数据。可识别特征是指能让某人识别出数据来源者的特征。例如，如果肿瘤科病房的患者电子表格移除了姓名、出生日期和患者编号，那么该表格就是匿名化的。\n\
  \n### 可识别数据\n\n可识别数据是指可用于识别个人身份的数据。例如，如果肿瘤科病房的患者电子表格包含了姓名、出生日期和患者编号，那么该表格就是可识别的。\n\
  \n### 汇总数据\n\n汇总数据是指经过合并并报告总计结果的数据。沿用肿瘤科的例子，如果病房的电子表格涵盖十名患者，汇总数据报告可能包括患者的男女比例或年龄区间。数据是针对数据集内的人群进行累积报告的。\n\
  \n### 个体化数据\n\n个体化数据与汇总数据相反。数据并非合并，而是针对数据集中的每个人分别报告。个体化数据不一定是可识别的。\n\n### 数据控制者与处理者\n\
  \n对数据隐私的担忧引发了全球性的回应。2018 年 5 月，GDPR（即《通用数据保护条例》）在整个欧洲生效。GDPR 立法规范了组织如何使用和共享用户数据[115]。\n\
  \n由于 GDPR，各组织被迫收集其成员的主动同意，并向用户声明他们将如何使用用户数据以及与谁共享。GDPR 立法将数据控制权牢牢掌握在用户手中。\n\n数据驱动系统的用户现在能够行使他们的权利：查看被持有的关于自己的数据、了解数据与谁共享及原因、被遗忘权以及被删除权。GDPR\
  \ 还定义了收集和处理数据的相关方标签。\n\n#### 数据控制者\n\n数据控制者是指控制、存储并使用数据的个人或组织。\n\n#### 数据处理者\n\n\
  数据处理者是指代表数据控制者处理数据的个人或组织。根据这一定义，像计算器这样的代理工具可被视为数据处理者。\n\n对于从事数据工作的人来说，理解数据处理者与控制者之间的区别以及各方的责任非常有用。这些责任必须被明确，并已在欧洲等地区通过《通用数据保护条例》（GDPR）得以确立。\n\
  \nGDPR 表明了数据安全已变得多么重要。GDPR 正在收紧数据访问、安全和管理，这是一项旨在保护欧盟 5 亿公民的雄心勃勃的尝试。它单枪匹马地将控制权重新交到用户手中。对于严重违反\
  \ GDPR 规定的行为，最高罚款为 2000 万欧元（1760 万英镑），或对大型组织处以全球收入的 4%[115]。不幸的是，法规影响着所有企业和组织，随之而来的是互联网上涌现出大量的同意请求。关于\
  \ GDPR 法律如何适用存在许多困惑，正如马克·扎克伯格被传唤至欧洲议会时所展示的那样。就像在美国一样，关键人物对 21 世纪的数据和连接如何运作一无所知。\n\
  \n#### 被遗忘权……从记忆中抹去？\n\n用户在机器学习中的被遗忘权这一话题提出了几个引人深思的伦理问题。例如，如果约翰的数据被用于机器学习算法来预测严重低血糖的可能性，并且约翰要求删除他的数据，那么几乎不可能将约翰的数据从已学习到的机器学习模型中分离出来。如何将约翰的数据从模型的记忆中移除？如果存在功利性益处，是否应该否决约翰的同意？\n\
  \n更进一步，如果约翰的数据出于某种原因对开发诊断和预测疾病的算法具有价值，那么可以声称约翰拒绝分享其数据或要求将其数据从该算法中移除是不道德的。如果约翰是世界上唯一具有某种基因缺陷的患者，或者他的数据出于某种原因有助于推动医学认知的进步，那么约翰的数据为何以及如何对人类有用就显而易见了。\n\
  \n\n\n## 我的数据能用来做什么？\n\n数据已被用于推动各种决策。几十年来，雇主一直使用心理测量和参数测试来了解潜在候选人。如今，雇主还会查看辅助数据来源。雇主们经常为了声誉风险而仔细审查潜在员工的社交媒体资料。同样，历史上也不乏因（被认为不当的）社交媒体使用而失业的人。\n\
  \n个人数据能被用于何种目的，引发了伦理和道德上的担忧。身份认同和自由意志的概念受到了挑战，因为个人数据可能被用来做出直接影响到该人、而该人却可能毫不知情的决策。\n\
  \n汽车保险是一个已发展到能优化数据使用的行业。从历史上看，汽车保险费率基于事故索赔数据，这些数据是针对人群细分进行概括的。黑匣子的出现使得基于各种人口统计和行为因素（如驾驶员年龄、车辆使用时间、驾驶速度、急加速频率等）的更精确保费成为可能。\n\
  \n如果驾驶员驾驶行为合理，这些数据还可用于降低汽车保险费；如果驾驶员不遵守保险公司规定的条款，则可能导致保费上涨。其他人则将这种持续不断的实时数据分析（及随后的反馈）视为“老大哥”。\n\
  \n同样，人寿和健康保险也开始效仿汽车保险。人寿和健康保险公司越来越多地提供激励性产品，奖励积极行为，惩罚消极行为。例如，人寿保险公司 Vitality 提供了一项产品，为其会员提供\
  \ Apple Watch 以鼓励积极健康的行为。同样，英国组织 Diabetes Digital Media 向全球的保险公司和账单支付方提供基于证据的数字健康干预措施，以激励健康行为。\n\
  \n个人应该意识到，数据也可能被用于愤世嫉俗、甚至更险恶的目的。例如，患者数据可能被用来拒绝某人接受治疗、手术或机会。公众对数据使用一直非常信任，因此需要强有力的数据治理来防止未来的滥用。GDPR\
  \ 被视为迈向更好理解和数据治理的第一步。一些人认为，GDPR 对数据科学的革命性意义，不亚于互联网本身的出现。\n\n## 隐私：谁能看到我的数据？\n\n\
  关于数据所有权的讨论自然会引出谁能看到你的数据的问题。关键在于确保只有经过批准的服务和组织才能访问你的数据。例如，你很可能不希望人寿保险公司在未经你同意的情况下获得你的医疗数据，特别是当其中包含可能影响你保险范围的数据时。\n\
  \n### 数据共享\n\n应用程序之间的数据共享很常见，API 使得独立服务之间的可访问性和连接速度更快。例如，用户可以将来自 MyFitnessPal 等应用的营养数据导入到他们的糖尿病管理或健身应用中。这些服务通常会在各种独立的架构中复制用户数据，这引发了对管理授权数据访问的担忧。支持数据集成的应用程序还必须提供解耦患者数据的功能。系统必须能够验证导入的数据，以进行数据治理、审计和患者安全。\n\
  \n围绕 Facebook 和 Cambridge Analytica 的丑闻进一步表明，即使你信任某个数据聚合商，第三方也可能在你不知情的情况下使用这些数据。Facebook\
  \ 要求 Cambridge Analytica 删除其 Facebook 用户数据。尽管 Cambridge Analytica 同意了这一要求并声称已删除用户数据，但后来被证明并未删除这些数据[111]。这种欺骗行为引发了关于问责制、数据泄露后果以及第三方数据泄露时谁应负责的问题。\n\
  \n### 匿名不等于隐私\n\n此外，即使数据被匿名化，也不能保证隐私。Netflix 最近发布了来自 50 万名会员的 1000 万条电影评分，作为改进 Netflix\
  \ 推荐系统挑战的一部分。\n\n尽管数据已被匿名化以去除会员的个人详细信息，但德克萨斯大学的研究人员通过将相似的评分和时间戳与 IMDb（互联网电影数据库）中的公开信息进行比较，成功地对部分\
  \ Netflix 数据进行了去匿名化处理[116]。匿名数据存在固有的安全问题——主要是这并不意味着你就是匿名的。\n\n### 数据对不同的人有不同的价值\n\
  \n在共享数据方面，区分“人”和“患者”是有用的。公众对医疗领域数据使用的态度远比对待非医疗数据使用要欢迎得多。患者似乎理解，或者至少希望，通过共享健康数据，他们正在推动医学认知和治疗进步。然而，作为“人”，他们对数据的有益使用则要怀疑得多。\n\
  \n保密性是数据伦理的核心原则。\n\n## 数据将如何影响未来？\n\n患者数据的共享和大数据集的聚合正被用于增强诊断、治疗和护理。随着数据类型和质量的提高，医疗保健的精准度将在以下讨论的领域变得更加精确。\n\
  \n### 优先治疗\n\n大数据医疗集可以实现预测分析，以确定不同人群的最佳治疗路径。有可能只优先考虑那些可能对治疗有效的人，这就引出了一个问题：如何最好地支持那些无效的人。\n\
  \n### 确定新的治疗和管理路径\n\n对真实世界经验数据、临床研究、随机临床试验（RCT）和药理学数据的分析正在促进治疗和管理方法的发现。\n\n数字健康干预已被证明可以逆转\
  \ 2 型糖尿病，并减少癫痫患者的发作次数[91, 117]。数据有潜力开发新的药理学干预措施，并颠覆传统的治疗范式。\n\n### 更多真实世界证据\n\n\
  来自患者社区、数字教育项目和健康追踪应用的大规模真实世界证据（RWE）的使用，正越来越多地被证明可以改善自我管理状况。对真实世界证据的一个典型担忧是缺乏学术严谨性。\n\
  \n然而，RWE 正越来越多地被用于研究，以确定人群的使用情况和获益。真实世界证据是人工智能伦理旅程中至关重要的一部分，患者和提供者之间必须建立信任。\n\n\
  ### 药理学的进步\n\n通过数字平台，可以更快、更容易地识别出 RCT 和学术研究所需的精准受众。这带来了诸多好处，例如更快的项目招募时间、更大的潜力和多源比较。真实世界数据正被用于开发更好、更有效的药物。\n\
  \n\n\n## 网络安全\n\n一个真正统一的系统会带来重大的隐私问题。如果这样的系统遭到入侵会怎样？人们，或者说患者，是想要一个真正统一的系统，还是认为其被用于恶意目的的可能性大于潜在的好处？漏洞的后果——无论是安全、运营还是技术方面的——在统一系统中都会被放大。\n\
  \n多年来，大型企业一直在讨论如何整合和分析它们各自收集的关于人们的海量数据仓库——来自智能手机的位置数据、来自银行的财务数据、来自社交网络应用的关系数据以及来自浏览器的搜索数据——以构建个人行为的完整画像。\n\
  \n据报道，Facebook 曾提议将医院掌握的个别患者数据与从该社交网站收集的社交信息进行匹配，例如此人有多少朋友，或者他们是否似乎在网站上与他人互动。在剑桥分析公司丑闻引发隐私担忧后，该公司暂停了该项目。\n\
  \n更进一步，围绕物联网设备还存在安全问题，这些设备现在范围广泛，从温度计、汽车、洗衣机到血糖仪、连续血糖监测仪和胰岛素泵。作为智能设备运行所需的网络连接使所有设备都容易受到攻击。\n\
  \n分布式拒绝服务（DDoS）攻击被用于物联网设备，以入侵并留下恶意代码来开发僵尸网络、泄露数据或以其他方式危害设备。WeLiveSecurity 报告了 73,000\
  \ 个使用默认密码的安全摄像头 [118]。从中可以学到的一个基本但关键的经验是，始终建议更改使用默认密码的凭据。DDoS 攻击并非新鲜事，但漏洞的程度只有通过研究以及首次出现的问题或安全漏洞才能被发现。佛罗里达大学的研究学生能够在\
  \ 15 秒内攻破谷歌的 Nest 恒温器 [119]。\n\nDDoS 攻击对任何组织都可能是毁灭性的。制定缓解程序，并确保网络基础设施能够监控进出网络的流量。制定\
  \ DDoS 防御计划是一种良好的实践，该计划应被保存、定期更新并进行演练。\n\n## 人工智能与机器学习伦理\n\n机器学习在医疗保健中的一个主要应用涉及患者诊断和治疗。人工智能模型被部署来帮助医生诊断患者，尤其是在涉及相对罕见疾病或结果难以预测的情况下。\n\
  \n想象一个未来，医生确切地知道你上个月吃了多少次快餐，并且这与你的医疗记录相关联。这些数据被用来建议该吃什么食物，将你的健康记录与成百上千的其他人的记录进行比较，以识别谁与你相似。此外，想象一下，这可能会直接影响人寿保险或健康保险，对积极行为和避免不良食物给予可能的奖励。想象一个能够实时预测你患上任何特定疾病可能性的系统。\n\
  \n### 什么是机器学习伦理？\n\n机器学习伦理特指围绕使用数据的机器学习模型输出所产生的道德问题，而这些数据本身就带有其伦理关切。\n\n机器学习已被用于开发能够根据健康生物标志物预测死亡风险和寿命的智能系统。人工智能已被用于分析电子健康记录中的数据，以高确定性预测心力衰竭的风险。\n\
  \n此外，机器学习可用于根据患者的真实世界和临床数据确定最有效的药物剂量，从而为患者和医疗服务提供者降低医疗成本。人工智能不仅可用于确定剂量，还可用于为患者确定最佳药物。随着基因数据的可用，针对诸如\
  \ HIV 和糖尿病等疾病的药物将适应种族、民族以及个体对特定药物反应的差异。在同一数据中，可以追踪药物相互作用和副作用。当临床试验和 FDA 批准要求着眼于受控环境时，大型真实世界数据为我们提供了实时数据，例如药物相互作用以及人口统计学、药物、遗传学和其他因素对结果的实时影响。\n\
  \n随着技术局限性的考验，需要克服伦理和法律问题。\n\n### 机器偏见\n\n机器偏见指的是机器学习模型表现出偏见的方式。机器偏见可能由多种原因造成，例如创建者对用于训练模型的数据的偏见。偏见通常作为首次出现的问题被发现，并带有微妙和明显的后果。所有机器学习算法都依赖统计偏差来对未见过的数据进行预测。然而，机器偏见反映了数据开发者的偏见。\n\
  \n人工智能在处理速度和容量方面的能力远超人类。因此，不能总是相信它是公平和中立的。谷歌及其母公司 Alphabet 在人工智能领域处于领先地位，正如谷歌的照片服务所示，该服务使用人工智能来识别人物、物体和场景。但它仍然可能出错，例如当搜索引擎对白人和黑人青少年的比较搜索显示出不敏感的结果时。用于预测未来罪犯的软件已被证明对黑人存在偏见\
  \ [120]。\n\n人工智能系统是由人类创造的，而人类是有偏见和判断力的。如果使用得当，并且由那些积极希望影响人类进步的人使用，人工智能将催化积极的变革。\n\
  \n### 数据偏见\n\n偏见指的是偏离预期结果。有偏见的数据可能导致糟糕的决策。偏见无处不在，包括数据本身。通过为数据偏见做好准备来最小化其影响。了解可能潜入数据并影响分析和决策的各种类型的偏见。为最佳实践的数据治理制定正式且有文档记录的程序。\n\
  \n### 人类偏见\n\n只要人类参与决策，偏见就永远存在。微软臭名昭著的人工智能聊天机器人 Tay 与其他 Twitter 用户互动，并从与他人的互动中学习。一旦\
  \ Twitter 世界控制了 Tay，网络喷子就将对话从积极互动引向了与喷子和喜剧演员的互动。几小时内，Tay 就发布了性别歧视、种族歧视和暗示性的帖子。可悲的是，Tay\
  \ 只存活了 24 小时。这个实验提出了一个问题：如果人工智能从人类行为中学习，它是否真的能安全 [121]。\n\n\n\n### 智能偏见\n\n机器学习模型的质量取决于其训练数据，而这往往会导致某种形式的偏见。具有人类思维的\
  \ AI 系统已展现出偏见放大效应，促使众多数据科学家探讨 AI 技术的伦理使用问题。基于人口数据构建的早期思维系统在性别、种族、社会地位及其他议题上表现出显著的偏见迹象。\n\
  \n算法偏见的一个臭名昭著的例子出现在刑事司法系统中。用于替代制裁的矫正罪犯管理画像（COMPAS）算法因其在威斯康星州的使用而在一起法庭案件中被剖析。非裔美国人犯罪的不成比例数据被输入犯罪预测模型，随后该模型输出对黑人群体存在偏见的结果。关于偏见算法的例子和定义还有很多[122]。\n\
  \n例如，评估房屋保险风险的算法会根据理赔数据对居住在特定区域的人群产生偏见。数据标准化是关键。如果数据未针对此类敏感性进行标准化，且系统未得到适当验证，人类将面临使机器学习模型对少数群体产生偏差，并导致许多人群代表性不足的风险。\n\
  \n消除偏见并不意味着模型将不再存在偏见。即使创建了绝对无偏见的模型，我们也无法保证 AI 不会学习到我们曾有的偏见。\n\n### 偏见纠正\n\n偏见纠正始于承认偏见的存在。研究人员早在\
  \ 1985 年就开始讨论机器学习伦理，当时詹姆斯·穆尔定义了隐性和显性伦理主体[123]。隐性主体因其固有的编程或目的而具有伦理性。显性主体则是被赋予原则或学习范例的机器，以便在不确定或未知情况下做出伦理决策。\n\
  \n克服偏见可能涉及对模型校准的后处理。分类器应进行校准，使其对敏感特征的所有子群体具有相同的性能。数据重采样有助于平滑偏斜样本。但出于多种原因，收集更多数据并不容易，且可能引发预算或时间问题。\n\
  \n数据科学界必须积极努力消除偏见。工程人员必须诚实地质疑对流程、智能系统的先入之见，或偏见如何在数据或预测中显现。这可能是一个棘手的问题，许多组织会聘请外部机构来挑战其做法。\n\
  \n工作场所的多样性也能防止偏见渗入智能系统。如果创建 AI 系统的研究人员和开发者本身缺乏多样性，那么 AI 系统解决的问题以及所使用的训练数据，都会因这些数据科学家输入\
  \ AI 训练数据的内容而产生偏见。多样性确保了思维、伦理和心态的广泛性。这有助于促进机器学习模型减少偏见、更具多样性。\n\n尽管算法可能被编写为尽可能避免偏见，但做到这一点极其困难。例如，即使是编程\
  \ AI 系统的人的动机，也可能与医生及其他护理人员的动机不一致，这可能会引入偏见。\n\n### 偏见是坏事吗？\n\n偏见引发了一个哲学问题，其前提是机器学习通常认为偏见是不好的。想象一个系统被其评估者解释为存在偏见，因此模型用新数据重新训练。如果模型输出类似的有偏见结果，评估者或许应考虑这可能是对输出的准确反映，从而需要重新审视存在何种偏见。\n\
  \n这是两个物种之间社会与哲学冲突的开端。\n\n### 预测伦理\n\n随着先进机器学习算法和模型的发展，将在短时间内得出更准确可靠的结论。当前技术正被用于解读各种图像，包括来自超声波、磁共振成像（MRI）、X\
  \ 射线和视网膜扫描的图像。机器学习算法已能有效识别眼部图像中的潜在关注区域，并形成可能的假设。\n\n通过良好的治理和透明度来确保对目标、数据和组织的信任至关重要。这是\
  \ AI 向前发展的基础。\n\n#### 解释预测\n\n随着 AI 算法变得愈发智能，它们也变得更加复杂。对机器学习系统的构建保持无知，或允许其作为黑箱构建，可能导致伦理上有问题的结果。如果发现某个主体预测错误，要找出导致隐藏且几乎无法发现的事件的行为，将是一项艰巨的任务。\n\
  \n数据和机器学习模型的可解释性是智能系统的关键方面。这不仅确保了模型的完整性，也确保它正试图解决正确的问题。嵌入数据科学的解决方案的用户，总是更倾向于那些可理解、可解释的体验。数据科学家也可以将可解释性指标作为验证和改进的基础。\n\
  \n机器学习黑箱可能通过程序员和数据选择而隐藏偏见、不公和歧视，且永远不为人知。神经网络是典型不可解释算法的例子。反向传播算法计算出的值无法解释。随着 AI 在模仿人类方面的准确性不断提高，将更需要确保\
  \ AI 不会沾染人类的坏习惯。\n\n\n\n### 防范错误\n\n无论是人类还是机器，智能都源于学习。而智能机器与人类一样，也会从错误中学习。数据科学家通常会通过训练、测试和验证阶段来开发机器学习模型，以确保系统能在规定的容差范围内检测到正确的模式。机器学习模型开发中的验证阶段无法涵盖现实世界中可能接收到的所有参数组合。这些系统可能会以人类不会犯错的方式被欺骗。因此，需要进行治理和定期审计，以确保人工智能系统按预期运行，并且人们无法影响模型以谋取私利。\n\
  \n预测分类的错误可能导致结果出现假阳性或假阴性的情况。这两种情况的影响都应根据你的领域背景加以考虑。以乳腺癌的误诊为例。在假阳性情况下，患者会被告知患有乳腺癌，而实际上并未患病。当得知这一分类错误时，患者会感到些许宽慰。而假阴性则会导致患者病情进展，并最终被正确重新诊断。应考虑到假阴性预测所造成的精神和身体创伤。患者应始终被告知结果的准确度水平。\n\
  \n对于将由患者使用的系统（面向患者），无论是预测性系统还是其他系统，其信息治理应为结果错误提供稳健的风险缓解措施。对于因误诊而遭受创伤的患者，应考虑提供情感或心理支持。\n\
  \n敏捷数字技术不仅充当着创新的催化剂，其推向市场的速度也是人工智能最大的陷阱。技术不仅可能失败，还可能被发现存在不公平的表现。\n\n科技公司 LG 曾在消费电子展（CES，由美国消费技术协会主办的年度贸易展）上展示了一款人工智能机器人，该机器人无视了演示者的指令，此事广为人知。这款被宣传为提供创新便利的人工智能机器人未能对其主人的任何指令做出回应，要么是出现故障，要么是选择忽略指令[124]。\n\
  \n2020 年，人们开始热议黑人和少数族裔如何成为技术针对的目标。2020 年，在全球对一名黑人男子被警察杀害感到愤怒之际，TikTok 羞愧地通过算法隐藏了包含“黑人的命也是命”或“乔治·弗洛伊德”标签的帖子，使其不被看到[125,\
  \ 126]。Instagram 也承认，在此期间需要审视其系统中的影子禁令和偏见。影子禁令是指“在不透明的情况下过滤用户，并因此限制其影响力”的过程[127]。\n\
  \n无论是在医疗领域还是其他领域，人工智能系统的性能指标都应透明并定期接受审计，以确保人们接触到的信息是绝对真实可靠的。尤其是在医疗领域，不这样做的代价太高了。医疗领域的人工智能系统已被证明会严重失效。在英国，NHS（英国国家医疗服务体系）的乳腺癌筛查系统未能适当邀请女性进行筛查，观察者声称多达\
  \ 270 名女性因此死亡[128, 129]。\n\n在这个特定案例中，负责运行该系统的组织将责任归咎于承包商。此类错误的伦理影响和公众认知是巨大的。\n\n\
  ### 有效性\n\n需要确保机器学习模型长期的有效性，以保证模型能够泛化且泛化是有效的。定期测试和验证模型对于维护机器学习模型的完整性和精确性至关重要。一个次优的预测分析模型会提供不可靠的结果并损害完整性。\n\
  \n### 防止算法变得不道德\n\n算法已经并且确实可能以不道德的方式运行。迄今为止，人工智能算法主要因设计原因而以不道德的方式运行。这在医疗领域之外已有很好的例证，例如优步和大众汽车等公司。优步的“灰球”算法试图预测哪些乘客是卧底警察，并利用该信息识别并拒绝为其提供交通服务[129]。大众汽车的算法则通过减少测试阶段的氮氧化物排放，使车辆能够通过排放测试[130]。\n\
  \n这两家组织因其公开欺骗和缺乏透明度而受到国际谴责。来自世界最大公司的此类先例表明，需要进行内部和外部审计，以验证算法及其所在组织的完整性和道德性。\n\n\
  人们真正担心的是，人工智能不仅可能从其创造者那里，还可能从其自身经验中学会不道德的行为。\n\n瑞士洛桑联邦理工学院智能系统实验室开展了一个项目，监测那些被设计用来协作寻找积极资源并忽略危险物品的机器人[131,\
  \ 132]。这些机器人被设计为配备传感器和灯的遗传智能体，灯用于标记发现数量有限的积极资源。\n\n每个智能体的基因组决定了其对刺激的反应，并经历了数百代的突变。智能体的学习通过以下方式得到强化：智能体因识别出积极资源而获得正面评分，因靠近有毒物品而获得负面评分。表现最好的前\
  \ 200 个基因组被随机配对和突变，以产生下一代智能体。在第一代中，智能体在发现积极资源时会打开灯。这使得其他智能体也能找到该积极资源。由于积极资源数量有限，并非所有智能体都能受益。过度拥挤意味着一些智能体也会远离它们最初发现的积极资源。到了第\
  \ 500 代，大多数智能体已经进化到在发现积极资源时保持灯关闭，而三分之一的智能体则进化到以与其编程完全相反的方式行事。一些智能体已经学会识别那些对光有厌恶感的撒谎智能体。最初被设计为合作的智能体最终由于资源稀缺而互相撒谎。\n\
  \n当这些担忧应用于受激励的临床决策支持系统时，问题会更加严重，因为这类系统可能为其设计者或提供者带来更多利润——例如，一个推荐其持有利益的临床测试、治疗或设备，或改变转诊模式的系统。\n\
  \n在医疗领域，这种情况非常令人担忧。所有机器学习模型，无论其用途如何，都必须受到治理且可验证。一个受激励做出决策的机器学习模型也应遵守透明度、道德性和严格审查的稳健标准。\n\
  \n\n\n### 意外后果\n\n人工智能在医学领域的应用正日益普遍；因此，首次出现的问题或意外后果将主导公众对 AI 伦理的认知和方向。几乎没有哪种技术在被嵌入医疗体系后不产生意外或不良影响。问题很快就变成了：数据科学家如何代表人类来减轻这些风险。\n\
  \nAI 伦理与意外后果在很大程度上受到了科幻作家艾萨克·阿西莫夫于 1942 年发表的《机器人三定律》的指引[133]。\n\n阿西莫夫定律出自公元 2058\
  \ 年出版的《机器人手册》第 56 版，其设计初衷是作为一种安全特性，防止机器人伤害人类：\n\n1.  机器人不得伤害人类，或因不作为而让人类受到伤害。\n\
  2.  机器人必须服从人类给予的命令，除非该命令与第一定律冲突。\n3.  机器人必须保护自身存在，只要\n    这种保护不与第一或第二定律冲突。\n\n在阿西莫夫的故事中，类人机器人的行为方式往往有悖常理。这些行为是智能体如何将阿西莫夫定律应用于其环境所产生的意外后果。仅仅\
  \ 70 年后，阿西莫夫的科幻幻想正惊人地变为现实。韩国颁布了《机器人伦理宪章》以防止弊端和恶意[135]；IEEE 和英国标准协会都发布了关于伦理智能体工程的最佳实践指南[136]。设计合乎伦理的智能体的最佳实践指南通常都基于阿西莫夫定律。\n\
  \n从根本上说，智能体由二进制代码构成，并不包含或遵守阿西莫夫定律。它们的人类设计者负责实施这些定律并降低意外后果的风险。\n\nAI 不太可能像好莱坞描绘的那样变得邪恶并转而攻击人类。相反，缺乏上下文可能导致\
  \ AI 做出意想不到的灾难性行为。例如，一个被委以在全球人口中根除 HIV 任务的智能体，最终可能会得出这样的结论：为了实现其目标，它应该杀死地球上的所有人。将\
  \ AI 智能置于负面情境中更容易理解。\n\n如果没有谨慎管理，AI 智能体的效用函数可能会允许潜在的有害场景发生。认为 AI 智能体会出现如此极端的适应性，其依据有限，但这仍然值得考虑。毫无疑问，AI\
  \ 也会带来许多积极的意外后果，这些后果可能拯救人类于自身。\n\n## 人类如何保持对复杂智能系统的控制？\n\n数百万年来，人类结合了创造力和智慧，创造了控制其他物种的方法和工具。作为一个物种，人类已经进化到占据主导地位，这主要得益于从自身或他人错误中学习的能力。通过这种方式，人类开发出了驾驭更大、更快、更强壮动物的工具，以及诸如心理或体能训练等技术，以便在这些任务中达到最佳表现。\n\
  \n### 当 AI 比人类更智能时会发生什么？\n\n人类制造的 AI 在特定领域已经能够超越人类的认知能力。由 Alphabet 开发的强化学习智能体 AlphaGo\
  \ Zero，通过自我对弈掌握了围棋游戏[137]。AlphaGo 能够在没有人类帮助或历史数据集的情况下，通过数千次对弈交互来自我学习。人类是否注定要被不断进化的\
  \ AI 种族所主宰？这个概念被称为奇点——即 AI 智能超越人类智能的时刻。同样，也不能指望一个智能超越人类的 AI 可以被关闭。一个足够聪明的智能体可能会预见到这一行动并可能进行自我防御。\n\
  \n当 AI 比人类更智能时，特别是如果它利用其超级智能进行自我学习，人类将不再能够预测结果，因此必须为这种可能性做好准备。\n\n## 智能\n\n智能指的是\
  \ AI 模型的输出结果及其使用方式。智能驱动着你看到的广告、你下载的应用、你在互联网上看到的内容、你叫的出租车，以及你为贷款和抵押贷款等项目支付的价格。\n\n\
  智能伦理提出了一些问题，例如自动驾驶汽车应该保护其驾驶员还是保护其他人。汽车应该优先保护其乘客，还是优先保护其他驾驶员和公众？如果发生导致生命损失的事故，那么应该采取什么方法？一旦自动驾驶汽车普及且涉及的人类驾驶员减少，这可能就不再是个大问题。在此之前，如果一辆处于自动驾驶模式且无人操控的汽车发生了事故，谁应该承担责任？涉及自动驾驶汽车事故的法庭案例表明，驾驶员在发生碰撞时往往正在使用自动驾驶功能[138]。\n\
  \n评估表明，人类并不想要一个公平、功利主义的方法，而是希望他们的车辆保护驾驶员。关于此类主题的法规将对自动驾驶汽车的长期普及起到关键作用。\n\n智能的另一个例子可以在\
  \ Alexa 等虚拟助手中找到，它们彻底改变了人机交互和参与的方式。\n\n随着 AI 的使用融入日常生活，不能假设人类始终保持警惕和清醒，组织应采取步骤来安抚公众。谷歌的\
  \ Duplex 机器人的语音能力在其开发者大会上得到了展示，当时它演示了预约理发。在舞台上的揭幕环节中，Duplex 软件与一位美发沙龙接待员进行了对话。这个计算机生成的声音使用了人类语言中常见的停顿、口语化表达和迂回说法。该语音由谷歌的\
  \ DeepMind WaveNet 软件控制，该软件通过大量对话进行训练，因此它知道人类的声音听起来是什么样子，并能有效地模仿。尽管受到一些人的欢迎，但许多人担心，一个试图成为人类并成功冒充人类的智能\
  \ AI，会故意欺骗人类。这放大了公众的声音：人类在与 AI 互动时要求得到明确的确认[139, 140]。\n\n自然语言可以分为两个部分：风格和内容。对互动、电子邮件或消息等通信内容的分析可以轻松识别情感和观点。\n\
  \n例如，可以识别负面词汇以了解某人的情绪健康状况。这在公开或私下场合产生的影响是巨大的。对社交媒体资料和其他非结构化数据源的分析，可能导致雇主或保险公司根据可供挖掘的互动、沟通或情感数据对人们做出预测。\n\
  \n\n\n## 健康智能\n\n健康智能特指通过医疗人工智能发展出的智能。在改善患者健康、降低成本及优化资源分配的驱动下，健康智能已在多个行业领域得到应用：\n\
  \n*   **医疗服务**：患者越来越多地使用预测分析服务进行疾病诊断。例如，Alphabet 与皇家马斯登医院合作开发的 AI 系统可检测糖尿病视网膜病变。糖尿病数字媒体公司开发了一种足部溃疡检测算法，以便更早、更快地将患者转诊至足病诊所。\n\
  \n*   **药理学**：通过基于真实世界数据和患者档案的学习，新药正在被发现。这使得制药公司能够开发出更精准的新型药物。\n\n*   **人寿与健康保险**：患有\
  \ 2 型糖尿病、糖尿病前期等健康问题（或风险）的患者，传统上需要支付附加保费，现在可以通过数字健康干预措施来管理和改善自身状况，并因其持续参与而获得保费减免，以激励健康行为。这对人寿与健康保险公司益处巨大。保险公司不仅能够通过将保险与改善健康联系起来，覆盖更多人群，还能通过减少和降低理赔、降低辅助医疗和药物成本来节省资金，同时改善风险状况，并优化风险算法和核保流程。\n\
  \n健康智能无法在忽视公众对合乎道德的 AI 要求（例如个人数据要求）的环境中发展。AI 伦理应成为具备健康智能的系统开发中不可或缺的一部分，在风险实现之前就识别出智能体的风险。健康智能伦理对于理解医学数据的意图和结果的使用至关重要。\n\
  \n## 谁应承担责任？\n\nAI 在医疗保健领域的应用是一个激动人心的机遇，可以在短时间内改善患者护理并节省成本。准确、及时的决策影响着任何数量疾病患者的诊断、治疗和结果。\n\
  \n医疗专业人员能够分析的图像、检测和样本数量是有限的；临床决策仍然容易出现人为错误。借助 AI，可以通过近乎实时地分析无限样本，以不同程度的置信度做出临床决策。AI\
  \ 在医学和技术上的局限性似乎比潜在的道德和法律问题更容易克服。如果乳腺癌诊断算法错误地预测了乳腺癌，或者算法未能识别出眼部扫描中的糖尿病视网膜病变迹象，谁应该承担责任？\n\
  \n在患者疾病的诊断中，存在三种责任可能性：\n\n*   人类医生在没有外部智能体协助的情况下决定患者诊断。当症状明显时，人类医生可能非常准确，并且常常能一眼发现不太明显的隐患。在这种情况下，责任始终在于医生。\n\
  \n*   智能体以 99% 的准确率预测患者诊断。患者被误诊的情况很少发生，但诸如死亡之类的错误既不是智能体的责任，也不是人类的责任。如果 AI 犯了这样的错误，患者该如何提出异议？\n\
  \n*   人类医生在智能体的辅助下进行诊断。在这种情况下，可能更难确定责任归属，因为预测是共享的。即使人类的决定是最终的，也可以认为 AI 智能体的无数经验是影响决策的关键因素。\n\
  \nAI 智能体行为的责任可理解为归属于以下方面：\n\n*   开发该 AI 智能体的组织。\n*   设计该 AI 智能体的人类团队，对任何意外功能或不准确预测负责。\n\
  *   AI 智能体本身，对其任何意外行为负责。\n\nAI 智能体的开发通常是众多工程师和协作者共同努力的结果，因此追究开发者的责任不仅难以管理，还可能使潜在的工程师不愿加入该行业。追究\
  \ AI 开发组织的责任似乎是确保遵守伦理的最佳途径。\n\n我们如何确保 AI 系统不会推翻人类？哪些法规保障我们的安全？Friedler 和 Diakopoulos\
  \ 建议使用五项核心原则来定义组织责任 [141]：\n\n*   **可审计性**：外部机构应能够分析和探查算法行为。\n*   **准确性**：确保使用良好、干净的数据。应确定评估指标，定期跟踪准确性，并使用基准测试来计算和审计准确性。\n\
  *   **可解释性**：智能体的决策应以所有利益相关者都能理解的方式进行解释。\n*   **公平性**：应对智能体进行歧视性评估。\n*   **责任性**：应确定单一联系点，以管理意外后果和意外输出。这类似于数据保护官，但专门针对\
  \ AI 伦理。\n\n## 首次出现的问题\n\n真实世界的数据已经表明，过去 50 年来对 2 型糖尿病的管理一直存在误导。当真实世界的经验表明传统疗法被误导时，谁应该承担责任？\n\
  \n基于患者数据开发的有监督和无监督模型正在医疗保健领域创造新概念，这些概念正在定义 AI 伦理。首次出现的问题是意外后果的一种形式。现在，数据可以在 AI 中用于检测疾病风险，例如\
  \ 2 型糖尿病、高血压和胰腺癌。如果一个应用程序能够告诉你一种你无能为力的绝症，你想知道吗？你甚至想知道存在一个选择去知道吗？基因分析服务会根据患者的基因图谱提供疾病风险反馈。如果有人被告知他们患某些疾病的风险较低，他们可能会倾向于采取更冒险的行为。如果患者被告知他们对肺癌的易感性低于平均水平，这是否会导致他们成为吸烟者或采取其他高风险行为的风险更高？\n\
  \n同样，了解患特定疾病的风险可能会导致心理和情感上的后果。随着时间和证据的发展，了解疾病风险对人类心理和行为的影响将会被发现。\n\n一个与 AI 相关的首次出现问题的例子是错误信息和假新闻。假新闻内容被创建出来，然后结合机器人和定向推送来放大人们的确认偏误，内容通过分享和互动进一步传播\
  \ [142]。这种基于感知到的证据扭曲现实认知的操纵性威胁非常令人担忧。另一个问题是深度伪造——使用人工神经网络将图像或视频中的人脸替换为其他人的脸。世界正在慢慢赶上如何最好地应对这些网络威胁。使用区块链技术验证来自可信来源的内容可能被证明是一种部分解决方案\
  \ [143]。然而，随着深度伪造技术的进步，对数字内容的信任正在减弱。\n\n\n\n## 定义公平性\n\n人工智能正在改变我们与产品和服务互动的方式。随着数据可及性的增长，我们如何确保\
  \ AI 代理公正地对待人们？例如，推荐系统会显著影响我们的体验。但我们如何知道它们是公平的？我们是否因被给予的选择而产生了偏见？\n\n如果没有对公平性的明确定义，机器学习模型就不可能做到公平。公平性有多种定义，需要社会科学家、工程师以及\
  \ AI 研究人员之间的协作，才能形成对公平性的清晰认知。公平性要求数据滥用必须承担公共、法律和道德层面的后果。\n\n## 机器如何影响我们的行为与互动？\n\
  \nAI 的快速发展正促使人类重新审视\"为人\"的意义。\n\n### 人性\n\n随着 AI 机器人越来越擅长模拟与人类的对话和互动，它们的普及程度也越来越高。Alexa、Siri\
  \ 和 Google Assistant 等虚拟助手已掌握在超过 1 亿人手中——而基于语音的电话代理也已司空见惯[144]。代理不仅能模仿对话语言，其情感和反应建模也比以往任何时候都更加复杂和可信。2015\
  \ 年，一个名为尤金的机器人赢得了图灵挑战赛，该挑战要求人类评估与未知代理的沟通质量，并猜测对方是人类还是 AI 代理。尤金成功让超过一半的人类评估者相信它是人类[145]。\n\
  \n人类与机器人之间的界限模糊，正催生出探索性的跨物种关系。2017 年，中国 AI 工程师郑佳佳与机器人莹莹结婚，这是他为了缓解婚姻压力而创造的机器人配偶[103]。他并非个例[18]。\n\
  \n用于替代人类的性爱机器人现已常见，联网的 AI 机器人被开发出类人皮肤和体温，并配备了防止触电或更严重事故的安全措施。\n\n无论是应用于银行、医疗、交通还是其他领域，人类正处在一个转折点：人们与\
  \ AI 代理互动的频率，已如同与真人互动一般。当人类在注意力、善意、同情心和精力方面存在极限时，AI 机器人却成为发展和维持关系的无限资源。\n\n### 行为与成瘾\n\
  \n我们的行为已经受到技术的影响和操控。网页着陆页、分享链接和用户体验都通过多变量测试进行优化。这是一种捕捉人类注意力的粗略算法方法。在美国大选中，唐纳德·特朗普的竞选团队曾著名地每天测试超过\
  \ 5 万个广告变体，以精准定位选民[149]。人类实验已进行了几个世纪，这并非新鲜事。然而，如今我们拥有了前所未有的影响选择和自由的能力。组织有道德责任去分析\
  \ AI 的影响，并保护特定人群（包括弱势成人和儿童）免受\"助推\"或\"社会认同\"等操纵性工具的侵害。技术实验中的行为实验需要行为准则。\n\n####\
  \ 技术成瘾\n\n技术成瘾正日益成为令人担忧的问题。南加州大学教授罗伯特·卢斯蒂格发现，人类大脑对技术的反应方式与其他成瘾物质相似[150]。网络成瘾已在多个国家被记录；青少年似乎面临更高风险，部分原因是前额叶皮层是大脑最后发育的部分。根据慈善机构\"\
  成瘾行动\"的数据，每三人中就有一人对某物上瘾[151]。网络成瘾正被越来越多地研究。台北一名 38 岁男子在网吧连续玩游戏五天后被发现死亡[152]。羞怯、孤独和逃避似乎在网络成瘾中扮演了一定角色[153]。\n\
  \n现实世界和学术证据表明，技术成瘾是一个日益严重的问题。AI 有潜力提高生产力和发现能力。然而，人类有责任采取措施，防止 AI 导致破坏性的数字成瘾，这种成瘾会让我们变得更加封闭、过度依赖和懒散。\n\
  \n### 经济与就业\n\n工作终结之后会发生什么？超市已经使用自动结账，甚至麦当劳也已用数字界面取代了人与人之间的点餐流程[108]。劳动力层级主要关注自动化，医疗领域也是如此。药房、装配线和登记系统都已普遍实现自动化。尽管这看似对人类构成挑战，但它可以促使人类承担更复杂的角色，推动人类从体力劳动向认知劳动转变。新冠疫情表明，虽然数字技术是善用工具，但关键工作者仍需确保系统持续运转。\n\
  \n探索使用 AI 的医疗机构正在研究如何对员工进行再培训或重新部署，而非裁员。随着这些 AI 系统日益普及，其能力和准确性不断提升，讨论已从体力与认知劳动转向放射学等专业领域将如何受到影响。例如，使用图像处理\
  \ AI 的医疗团队越来越面临如何处理专家团队的困境。\n\nAI 可用于重新分配资源以加强患者护理，提供更多与患者及其治疗互动的机会。AI 可以被理解为一种高效且有效的工具，能够以人类无法想象的速度和效率分析并检测患者数据中的模式，且误判极少。然而，AI\
  \ 应被视为增强人类自然知识和智力的辅助手段，而非让其做出最终决策。\n\n医疗领域的独特之处在于，纯数字化的方法是不可想象的。似乎始终需要人类干预来降低风险并确认预测。即使使用最先进的\
  \ AI，在一项健康调查的 1000 名受访者中，有 53%表示他们希望机器主导的诊断结果能得到人工验证[155]。\n\n## 影响未来\n\n许多迹象表明，人们使用技术的方式正在改变儿童和成人的发展模式。研究表明，过多的屏幕时间与大脑结构和功能的变化有关，影响注意力、决策和认知控制[156]。\n\
  \n格拉斯哥大学另一项针对 390,089 人的研究发现，长时间面对数字屏幕与健康状况不佳之间存在关联[157, 158]。此外，科学家表示，如果将屏幕时间减少到\
  \ 120 分钟或更少，患癌症和心血管疾病的风险会降低[159]。屏幕消费时间被视为久坐行为。过度的屏幕时间已被证明会损害大脑，尤其是额叶——人类在生活的各个方面都会用到它。\n\
  \n未来几十年将揭示互联技术对人类生理、心理、进化乃至最终生存的影响。\n\n## 扮演上帝\n\n阿德莱德大学的工程师开发了一个 AI 代理，能够预测你的死亡时间。该\
  \ AI 代理分析了 16,000 个图像特征，以了解患病器官的迹象[160]。这个基于神经网络的 AI 模型能够在 5 年内以 69%的准确率预测死亡率。数据访问、AI\
  \ 和预测分析能力的提升，使人类能够更精确地预测发病率和死亡率风险，这重新引发了关于 AI 是在扮演上帝，还是在帮助人类（借助数据驱动的方法）扮演上帝的争论。\n\
  \n\n\n## 过度炒作与危言耸听\n\n人工智能的能力在历史上一直通过营销和简化的媒体呈现而被过度炒作。媒体的危言耸听，加上更多公开的数据泄露事件，也对人工智能的发展毫无助益。\n\
  \n围绕数据及其输出的可能用途（以及滥用），存在着一片困惑与误解的迷雾。为了能让利益相关者认真考虑将人工智能应用于医疗系统，这片迷雾必须被驱散。\n\n## 利益相关者的认同与协同\n\
  \n确保所有利益相关者在项目所能提供的健康智能及其使用方式上达成一致，这一点至关重要。例如，医疗应用人工智能的开发者的价值观，可能与临床医生的价值观并不总是一致。比如，可能存在一种诱惑，即引导系统采取能够改善质量指标、但不一定改善患者护理的临床行动，或者在潜在监管机构审查时，歪曲提供给公众评估的数据。\n\
  \n## 政策、法律与法规\n\n未来十年将成为人工智能伦理领域的关键转折点。以法律、伦理准则和行业政策形式出现的监管，将影响机器学习的发展方向。同样，在缺乏此类政策且被认为风险主要集中的领域，机器学习也会受到影响。未能设定可接受性的边界，我们将面临更广泛意外后果的风险。\n\
  \n技术治理是必要的，尤其是在人工智能的应用方面。必须吸引关键意见领袖、利益相关者、立法者和颠覆者参与，以形成并培育这些政策，确保机器学习的潜力得以实现，而不会受到不当限制。人工智能在非医疗领域的应用已经表明，算法学习在规模化部署时存在潜在的伦理问题。\n\
  \n立法者和法律决策过程中的关键利益相关者必须理解人工智能的复杂性，并欣然接受它带来的前所未有的挑战。此外，不能想当然地认为人工智能只会被用于善意目的；人工智能已被用于战争，美国和中国在这方面投入巨大[161]。英国已决定将重点放在人工智能伦理上[162]。\n\
  \n使用人工智能的医疗专业人员必须了解已部署的人工智能算法是如何创建的，评估用于建模的数据，并理解该智能体如何防范错误。监管机构必须准备好逐一处理每个问题，因为所有人工智能都是独特的，就像人类一样。\n\
  \n只有通过由工程师、人文学者和社会科学家组成的多元化、包容性强的多学科团队，才能实现安全且包容的人工智能发展。\n\n就人工智能提出的关键议题，各组织和政府之间必须进行国际合作。关于伦理、责任、就业、安全和进化等问题的对话，需要公共部门、私营部门和学术界的利益相关者在人工智能融入社会并确保人类民主繁荣的过程中进行协作。\n\
  \n## 数据与信息治理\n\n在医疗领域实施人工智能需要应对伦理挑战，例如：存在不道德或作弊算法的可能性；使用不完整或有偏见的数据训练的算法；对算法的局限性或适用范围缺乏理解；以及人工智能对医患之间基本信托关系的影响。\n\
  \n数据治理政策是一套成文的指导方针，用于确保对组织数据（数字或其他形式）进行妥善管理。此类指导方针可涉及业务流程管理和企业风险规划的政策，以及安全、数据质量和隐私方面的政策。这与信息治理不同，信息治理是一套成文的指导方针，用于确保对组织信息进行妥善管理。信息治理政策将涵盖预测分析结果的使用。\n\
  \n伦理行为准则或伦理治理政策将涵盖组织的方向和意图，并指导治理工作。\n\n### 是否存在政策过多的问题？\n\n政策过多是有可能的，这会阻碍进展并使利益相关者疏离。人工智能推动了包括数字健康在内的所有行业的创新。与那些规模更大、通常对环境变化反应较慢的组织相比，初创企业因其较少的官僚主义和繁文缛节，在人工智能的普及方面走在了前列。请审计你的政策，确保为倾听用户声音并将其融入伦理创新循环留出空间。\n\
  \n## 全球标准与模式\n\n目前存在一些共享共同伦理和责任准则的机构，但缺乏全球强制执行的模式。一个能预测你死亡风险的人工智能智能体，除了你或它预测过的其他人死亡之外，几乎无法得到验证。这样的智能体应如何被验证？它必须遵守哪些标准？该智能体或其创造者是否需要提供证据？迄今为止，人工智能还没有明确的技术测试所依据的行业标准。因此，很难确保你所接触的人工智能的质量。而在人工智能这样一个快节奏的行业中，所呈现出的问题都是新颖且紧迫的。需要制定全球标准来设定人工智能系统的最低期望。\n\
  \n医疗领域还面临着从循证到临床接受之间的时间滞后问题。例如，2 型糖尿病患者将病情缓解已超过十年，但医疗系统在将患者登记为病情缓解方面进展缓慢。因此，患者过去要么被标记为“逆转”了\
  \ 2 型糖尿病，要么被标记为“患有”2 型糖尿病。如果患者被标记为逆转了糖尿病，他们往往无法接受能确认其 2 型糖尿病已缓解的检查，并面临无法获得后续检查的风险。同样，如果患者被标记为患有\
  \ 2 型糖尿病（而实际上并未患病），这会影响其保险，并且在技术上也是不真实的。在模式上进行协作并同步推进采用，将有助于减少国际间的差异。\n\n\n\n##\
  \ 我们是否需要以人道方式对待人工智能？\n\n强化学习的基本概念与人类及其他动物的学习方式相似。例如，在训练狗时，顺从且符合预期的表现通常会得到食物奖励。而强化学习系统的不顺从行为则会受到惩罚。这与人工智能体的强化学习类似，我们为其构建了奖励与惩罚机制。积极的表现会获得虚拟奖励，消极行为则会受到惩罚以增强规避。\n\
  \n目前，大多数人工智能系统都相当简单且具有还原论特征。随着人工智能的发展，我们可以预期它们会变得更加复杂和逼真。人类已经开始与机器人建立关系，在许多情况下，它们被视为人类的替代品，无论是为了陪伴还是满足肉欲。可以认为，对人工智能系统的惩罚输入是一种有害或负面的输入。当遗传算法删除不再有用的世代时，这算是一种谋杀吗？当人工智能系统能够模仿人类的行为和外貌时，我们何时才需要考虑对其施行人道待遇？\n\
  \n如果认为人工智能系统能够感知、感受并对刺激做出反应，那么将其视为一个物种、赋予其法律地位甚至国籍，就不是一个巨大的跨越。一个在美国制造的人工智能体甚至被授予了沙特阿拉伯国籍\
  \ [163]。\n\n人工智能是否应该被当作智力与人类相当的动物来对待？机器真的能感受和痛苦吗？我们如何对待人工智能体、减轻其痛苦以及避免负面结果风险的道德问题，是负责任地推动人工智能发挥其改善人类生活的巨大潜力的基础。\n\
  \n## 在组织内部运用数据和人工智能伦理\n\n许多组织都有行为准则，作为关于预期行为、要求和参与的内部沟通文件，并为外部利益相关者提供信心和保证。\n\n\
  行为准则应与适当的培训一起分享给员工，以确保准则被理解和遵守。组织的所有利益相关者都应实践并推广对行为准则的遵守。\n\n### 道德准则\n\n道德准则是一份用于规范组织道德行为的文件。道德准则表明组织致力于负责任的商业和技术进步。\n\
  \n道德准则阐述了组织所提倡的行为，以及那些被认为对组织自身的道德指南针、声誉或客户有害的行为。它可能不涵盖违法行为，但通常会说明不遵守的后果以及如何举报此类违规行为。应让员工了解那些对他们来说不明显的项目，并帮助他们避免无意中可能造成的有害行为。道德准则还应包括使用数据的动机及其在组织目标中的目的的摘要，并反映企业的盈利能力、诚信和声誉。\n\
  \n道德准则应避免使用技术和哲学行话，直接传达对员工的期望。保持简单明了。在新员工入职时设定期望，并培养一种遵守准则的组织文化。确保所有利益相关者了解修订和审查情况。不要仅仅向新员工或客户提及行为准则，而应经常引用道德准则，以便在内部和外部利益相关者中根植组织的道德方向。在审查将新技术纳入决策过程的道德风险时，请参考道德准则。\n\
  \n在从头开始制定道德行为准则时，应咨询员工和利益相关者的意见。需要考虑的问题包括：\n\n*   人工智能伦理对你意味着什么？\n*   我们的工作如何改善人类福祉？\n\
  *   我们的组织应如何在其[在此处插入目标]的目标中负责任地行事？\n*   我们想要实现的目标有哪些潜在好处？\n*   我们想要实现的目标有哪些潜在弊端？\n\
  *   我们如何改进我们的道德准则？\n*   道德准则中是否有令人困惑或需要更多解释的条目？\n*   道德准则在决策时是否有用？\n*   组织的伦理观与你个人的伦理观点是否一致？\n\
  \n一旦组织的不同部门回答了上述所有问题，就可以就实施计划达成共识。组织的道德准则可作为对未达到标准者采取纪律处分的参考点。道德准则为识别和处理伦理挑战提供了坚实的基础。\n\
  \n### 伦理框架考量\n\n组织有责任在收集和使用患者数据时遵循伦理指导。组织需要一种能够防止数据泄露并加强安全性的数据隐私方法。未能遵守法规可能导致罚款、声誉受损和客户流失。有多种方法可以在利用大数据带来的机遇的同时，降低不当数据收集的风险。有几种技术可以保障合乎伦理的数据收集。\n\
  \n#### 收集最少量的数据\n\n保护用户数据的第一步是只收集当前任务所需的数据。更多的数据并不总是意味着更有用的数据。尽管机器学习通常欢迎更多数据，但数据收集必须保持审慎和简洁。例如，如果某人申请信用卡，了解其种族和\
  \ BMI 几乎毫无用处；但在确定个人患 2 型糖尿病的风险时，这些数据却很重要。\n\n#### 识别并清除敏感数据\n\n所有敏感数据都应被识别并加以保护。数据科学家应了解哪些数据被视为个人数据，以及如何使用此类信息。例如，未经消费者同意收集的数据应清除个人身份信息。至关重要的是，只有拥有适当权限的个人才能查看敏感数据。许多组织也禁止使用\
  \ U 盘和外部数据驱动器，以确保数据安全并保留在本地。\n\n#### 遵守适用的法律法规\n\n通过遵守适当的本地和国家标准、政策及法律，可以赢得对组织数据与信息管理方法的信任。有多项数据和信息治理法律法规为合法且适当的数据使用设定了界限。遵守所有法规至关重要。\n\
  \n诸如美国 FDA（美国食品药品监督管理局）和欧盟 MHRA（欧盟药品和保健品监管局）等机构为数据合法、合乎伦理且合规的收集、使用和管理设定了界限。遵守 GDPR\
  \ 并获得治理相关认证机构的批准，能够展示贵组织对合乎伦理的数据使用的态度，并建立与用户之间的信任。\n\n\n\n#### 国际标准\n\n许多国家和国际层面的标准会有相当程度的重叠，要求具备适当的数据报告、文档记录、透明度以及风险缓解程序。例如，在欧洲，遵守《通用数据保护条例》（GDPR）等法规是必要的，该条例对欧盟\
  \ 27 个国家具有约束力。诸如 ISO 27001 之类的国际标准确保了良好的数据和信息管理规范。ISO 27001（正式名称为 ISO/IEC 27001:2005）是信息安全管理系统（ISMS）的规范。ISMS\
  \ 是一个包含政策与程序的框架，涵盖了组织信息风险管理流程中涉及的所有法律、物理和技术控制措施。\n\n许多数据法规是自我认证的。这意味着，作为一个组织，你必须收集所需的文档来证明符合标准，而无需由外部机构进行验证。自我认证的担忧显而易见，尤其是在应用于医疗保健领域时。\n\
  \n稳健的数据和信息治理是数据伦理的基础。\n\n#### 数据伦理的奠基\n\n彻底的数据和信息治理是数据伦理的基础。治理关注的是数据与信息在收集、使用、分析和处置过程中如何得到保护。良好的治理涵盖多种主题，包括数据架构、基础设施、风险评估、审计报告、风险处理计划、设计工作流程、信息安全政策、投诉程序、医疗治理、企业责任以及灾难恢复规划。组织的道德准则引导着良好治理的方向。\n\
  \n#### 审计你的框架\n\n定期对合乎伦理的数据和信息治理程序进行审计，并演练最坏情况下的场景，以确保一旦最坏情况发生，你的组织能够尽可能在最短时间内将风险降至最低。风险缓解演练应至少每年进行两次。\n\
  \n审查你行为准则的每个部分，确保其代表了组织的价值观。科技组织发展迅速，因此要确保遵守与你所在行业相关的最新标准、指南和政策。处理医疗数据的组织可能会提出新的预测方法或新的\
  \ AI 能力。考虑你行为准则中缺失的方面，特别是当你的组织正在扩张或面临新的应用场景时。例如，一个历史上以商业为导向的组织开始与患者互动时，就需要增加一个关于与患者互动的新章节。\n\
  \n没有理由不让每一位员工都参与到行为准则的制定和审查中来。数字调查是一种快速简便的收集意见方式。多元化的贡献有助于形成多元化、包容性和多学科的人工智能方法。就你认为员工应该了解的新章节或新概念征求意见。对话可以突出员工可能需要进一步培训、提高认识或进行演示的领域。与员工建立对话，将组织文化根植于更广泛的团队中，并培养一个具有伦理意识的环境。让尽可能多的利益相关者认同你组织的行为准则，很可能会提高员工的积极性和生产力。\n\
  \n在医疗保健组织中，特别是对于那些使用 AI 的组织，一个合乎伦理的框架能为内部和外部利益相关者提供最大化参与度所需的安全性、透明度、信任和方向。遵守行业标准并让组织成员参与制定和维护伦理框架，将加速员工和整个组织对框架的采纳。此外，良好的政策文档、培训和审计有助于维护组织\
  \ AI 的完整性。\n\n### 数据科学家的希波克拉底誓言\n\n能够访问敏感数据的数据科学家在入职时通常需要签署文件，以确保他们遵守风险缓解和安全政策。有人建议，为了在\
  \ AI 领域根植安全与积极进步的文化，在数字和非数字领域工作的数据科学家应宣誓遵守“不伤害”的希波克拉底誓言。这将与组织运营的法规、内部宣言、标准和行为准则并行[164]。\n\
  \n## 结论\n\n医疗保健领域有意义的变革将来自创新、伦理和深思熟虑的正确结合。随着探索边界的不断拓展，为患者提供精准循证医学和护理的潜力正在变为现实；与此同时，我们有责任去探索和预见创新所带来的社会、经济、政治和伦理后果。\n\
  \n大数据和 AI 在医疗保健领域的应用最好作为渐进式发展来管理，这将有利于利益相关者有时间去描绘和理解其实施可能带来的后果。需要建立稳健的标准来审计和理解 AI\
  \ 模型，以维护质量保证和信任。\n\nAI 标准的制定需要一个多元化、公开的论坛，该论坛在学术上要严谨，并根据最新的证据基础定期进行审查。\n\n需要在医疗专业人员和患者群体中提高认识。医疗保健专业人员需要了解\
  \ AI 应用在其各自医疗场景中如何运作的基本知识，以理解 AI 如何促进和协助他们完成日常任务的优势、劣势和后果。\n\n患者必须习惯于与 AI 系统互动，并亲自探索其益处，而\
  \ COVID-19 无疑加速了这一过程。AI 在医疗保健中如何优化效率、优化资源以及改善人口健康结果的具体实例，只会不断加强公众对 AI 的看法和采纳。\n\n\
  从事 AI 工作的组织需要与公众沟通，并让他们了解在医学中使用 AI 的潜在优势和风险。开发 AI 的组织必须与学术界合作，采取必要步骤，以便能够独立衡量 AI\
  \ 系统的成功和有效性。鼓励可负担的 AI 解决方案，使 AI 作为 21 世纪的听诊器得以普及，这一点至关重要；而经过验证的已发表证据、指南和文献对于 AI\
  \ 持续获得信任、采纳和保持道德性至关重要。\n\n"
- "# 9. 医疗保健的未来是什么？\n\n> *医学正处于一个关键节点，必须跟上现实世界中发现的步伐。*\n> \n> ——夏洛特·萨默斯\n\n医学领域的新进展以及曾经是科幻小说中未来主义主题的概念正逐渐成为现实。基因疗法、人体器官\
  \ 3D 打印、液体活检、机器人辅助手术以及语音驱动的个人助理，如今都已成为现实，并且随着时间的推移变得越来越精密[165–168]。\n\n技术的进步不仅影响着医学实践，也影响着公众对健康、生活方式以及何为健康的看法和态度。医疗保健必须明智地实施创新，以吸引尽可能多的患者。\n\
  \n数字健康技术以闪电般的速度发展。数据科学、人工智能、机器学习以及互联医疗技术的影响是巨大的，它要求我们以不带偏见的头脑和意愿，尽可能多地获取知识，参与到这个不断变化的环境中。\n\
  \n本章将探讨医疗保健领域的趋势转变，以及机器学习和 AI 在实现未来个性化医疗中的应用。读者还将探索沉浸式现实如何用于增强医疗保健，以及机器人、无人机和传感器如何用于开发智慧健康。\n\
  \n\n\n## 从数量转向价值\n\n医疗行业正从以数量为导向，转向以患者为中心、基于价值的护理，以追求循证医学和个性化医疗。\n\n医学领域正在发生转变，药物不再是第一且唯一的治疗手段；人们更加重视生活方式作为药物在预防和治疗中的作用。\n\
  \n### 什么是基于数量的护理？\n\n医疗保健领域的传统支付体系，其基础是奖励提供者所接诊和治疗的患者数量。基于数量的护理侧重于规模经济。提供者会因在固定时间内为患者提供的所有服务而获得一笔固定金额的报酬。资金价值、患者体验和医疗质量随后成为次要的评估考量。提供者的激励来自患者数量以及为患者提供的整体护理成本。医疗资源和成本压力、疲惫不堪的医生以及受利益驱动的临床医生，在不知不觉中助长了“尽可能多看病人”的做法，这导致疾病管理从“药物优先，患者其次”的角度出发。医院和临床医生被激励去接诊尽可能多的患者，进行尽可能多的检查，并从药物优先的角度来处理疾病。\n\
  \n基于数量的护理模式通常以财务指标为模型，例如优化每位患者的利润或最小化每位患者的成本，而非健康结果。\n\n基于数量的护理支付体系通常会在财务上惩罚那些致力于保持人群健康、减少错误或减少并发症的提供者，因为这些并非关键的绩效指标。例如，如果你被诊断出患有\
  \ 2 型糖尿病，你的医疗团队通常会采取以下措施：\n\n*   根据当前指南，提供如何管理血糖水平的信息。\n*   推进治疗方案。\n*   提供关于饮食选择的信息。\n\
  \n例如，在英国，如果一家医生诊所或医疗机构能够使患者实现 2 型糖尿病缓解，那么该诊所或医疗机构将无法获得因不再为患者开具药物而本应获得的资金。个人偏见也可能使问题复杂化。例如，在英国，参与评估应向\
  \ NHS 患者开具哪些药物的医生被发现每年从制药公司收取高达 10 万英镑的款项 [169–171]。\n\n基于数量的护理关注的是为特定人群提供固定金额的资金。随着人口增长和资源紧张，向基于价值的护理的演变进程得以加快。医疗保健现在正转向以患者为基础的护理，这与价值同义，而非数量。\n\
  \n### 以患者为中心的护理\n\nTseng 等人将医疗保健中的价值定义为护理质量，通常通过医疗结果来衡量 [172]。另一个值得考虑的价值指标是患者体验或以患者为中心。以患者为中心是基于价值的护理的一个重要但并非绝对主导的质量衡量标准。\n\
  \n以患者为中心的护理采用一种多层面的方法，围绕患者、其目标以及更广泛的家庭进行决策和评估。以患者为中心的护理包含多个领域，其中就包括以患者为中心。\n\n以患者为中心的护理是一种协作且多层面的方法，涉及提供以患者体验和患者结果为重点的健康和社会护理。以患者为中心的护理侧重于赋予患者知识、经验、技能和信心，以管理和优化他们的健康。护理是富有同情心的、个性化的、围绕患者协调的，并且尊重患者的世界观。这些目标对于医疗从业者来说似乎是常识。然而，它们并非总是作为标准实践来执行。医疗保健传统上采用还原论的方法，处理的是部分而非整体，并且是为患者做事，而非与患者合作。\n\
  \n像荷兰的 Buurtzorg 社区护理这样的组织就提供以患者为中心的护理。该组织每年为 8 万名患者提供护理，拥有 1 万名护士、21 名教练和 2 名管理人员\
  \ [173]。这种协作方法侧重于通过与护理人员建立关系来增强患者的能力。随着时间的推移，患者的健康状况得到改善，同时所需的外部护理总时间也减少了。患者和家属被赋予了照顾自己的技能和信心。数字疗法本质上能够提供以患者为中心的护理，根据用户的数据（如个人资料、行为、时间、地点或其他信息）定制体验，同时为医疗专业人员提供远程监控能力\
  \ [174]。\n\n### 基于价值的护理\n\n尽管是两种不同的理念，但以患者为中心的护理和基于价值的护理正变得越来越同义。纳入以患者为中心的结果、观点、经验和偏好的成功定义，正在积极影响护理的质量和提供方式。\n\
  \n基于价值的护理并不意味着廉价或经济的护理。实际上，护理是通过患者体验和结果的质量来评估的；并且该模式重塑了患者接受护理的方式。基于价值的护理正在重新定义健康经济学。\n\
  \n在基于价值的护理中，强调健康与预防。生活方式、行为和环境因素占疾病风险的 90% [175]。全球 2 型糖尿病患病率的不断上升已经证明了这一点。随着医疗资源压力日益增大，生活方式医学已悄然将重点重新聚焦于生活方式作为药物的作用。证据表明，活动、营养、睡眠和压力都会影响身体和情绪健康指标\
  \ [176]。\n\n生活方式医学对生活方式和行为的关注，使医疗专业人员能够处理可逆的非传染性疾病，如 2 型糖尿病和肥胖症。不是用还原论的方法治疗患者，而是为患者提供整体、富有同情心的护理。生活方式医学的处方已经在医疗保健领域实施，例如通过处方数字应用程序来治疗疾病。例如，2\
  \ 型糖尿病患者可能会被医生开具“低碳水计划”应用程序的处方，以支持患者自我管理病情，并在可能的情况下实现减肥和 2 型糖尿病缓解 [177]。生活方式干预通常安全、易于实施且可扩展。通过一种在引人入胜且有效的环境中实施的简单方法，可以缓解日益增长的慢性病水平。\n\
  \n\n\n#### 重新定义护理方式：质量优先，而非数量\n\n价值导向型医疗不再被动应对事件，而是采取预防性的、以生活方式为先的健康管理方法。其核心在于患者健康、医疗质量与效率。这正是患者数据、数字健康与人工智能蕴含巨大潜力的领域。对效率的强调确保了该方法具有可扩展性和有效性，使医疗服务提供者能够降低医疗成本，并改善患者的临床健康结果。\n\
  \n通过戒烟、改变营养结构、调整生活方式、增加活动、改善睡眠以及识别遗传风险因素来预防疾病，可以减轻医疗资源的负担。健康管理正变得有激励性。保险公司和医疗服务提供者更密切地监测患者健康，已成为其最佳利益所在。\n\
  \n初创企业和数字技术公司正在开发数字健康工具，这些工具正在颠覆传统的医患关系，并使医疗服务提供者成为促进持续健康的第三方参与者。价值导向型医疗的目标是通过最佳实践来标准化医疗流程，并普及医疗服务的可及性与质量。对数据和历史证据的挖掘可以判断哪些方法有效，哪些无效。\n\
  \n#### 数字健康赋能以患者为中心的价值导向模式\n\n保持人们健康可以降低医疗服务交付成本，并优化资源利用。例如，在管理 2 型糖尿病等慢性病时，价值导向型医疗采用协作和多学科的方法来管理疾病，以预防糖尿病相关并发症。\n\
  \n患者与一个了解其病情进展和健康状况的医疗团队合作。该医疗团队可能包括患者的糖尿病专科护士、营养师、行为健康教练以及其他专业人员，以支持患者的康复进程。\n\n\
  该团队会设定以患者为中心的目标，并帮助患者完成以下事项：\n\n*   维持血糖控制。\n*   引入一个由 2 型糖尿病患者组成的数字社区以提供支持。\n*\
  \   提供健康指导和习惯维持支持。\n*   促进活动计划的实施。\n*   利用最新的循证依据提供营养指导。\n*   处理 2 型糖尿病相关的心理问题。\n\
  \n激励机制发生了转变。以医院环境为例，医院的报酬不再基于接诊了多少患者，而是基于相反的标准。医院的报酬基于有多少患者处于健康状态以及有多少空余床位。关注点从入院那一刻转移到了预测未来风险的可能性，并通过预防性解决方案来预先应对。\n\
  \n除了面对面服务，还可以通过数字方式提供持续的患者支持，例如，通过应用程序、可穿戴技术或远程医疗提供健康指导、实施锻炼计划或帮助解决心理健康问题。人工智能和预测分析使医疗服务提供者能够优化医疗服务交付，专注于疾病的预防和治疗。\n\
  \n价值导向型医疗可以利用低成本的数字技术来提升和普及医疗服务。同时收集行为、人口统计、健康和参与度数据，为机器学习和新型人工智能的开发提供了机会，从而能够快速改进并从用户行为和结果中学习。\n\
  \n管理医疗运营并随后评估医疗质量是复杂的。为了评估价值导向型医疗模式，医疗机构必须收集和分析数据，通过护理质量、患者健康结果和成本效率来客观评估绩效。医疗服务提供者可以报告和建模预防性护理指标，例如再入院率、错误率、疾病进展、人群健康改善和参与策略。\n\
  \n医疗质量由多个指标定义。患者体验和满意度评分通常是首要评估指标。诸如每位患者花费的时间、患者参与度、药物节省和依从性等指标，是与生产力相关的质量示例。\n\n\
  人工智能在医疗领域的许多应用都发生在医院环境中。医院管理平台通过使机构能够做好准备来提供投资回报。能够预测患者流量高峰时间、预测再入院时间，并利用实时数据来应对现实世界医疗需求的系统，被视为对医疗服务提供者具有长期价值的系统。\n\
  \n涉及改善临床护理的应用显示出巨大潜力，但需要长期研究来评估其对疾病管理和人群健康的影响。\n\n初级和二级医疗之间的数据链接可以追踪包括药物消耗、住院和急诊入院在内的数据点网络，这些数据可用于开发激励性的报销模式。\n\
  \n#### 评论：没有资金？没问题？公共医疗体系中的价值导向型医疗\n\n*以下内容摘自为 NHS 创新加速器撰写的一篇博客，内容是关于创新资金模式以推广数字健康。*\n\
  \n*你拥有一个可以惠及数百万人的绝佳创新，它深受你向其展示过的 NHS 团队的喜爱，但当地的 NHS 区域却负担不起。没有资金。*\n\n*创新在 NHS 内无法发挥作用的原因有很多，但当创新未被采纳的唯一原因是缺乏资金时，这不仅令人沮丧，而且损害了患者和人群的健康。资金常常会扼杀一个伟大的愿景，甚至连最初步的探索都无法进行。更重要的是，这对于那些在撰写商业案例之前就投入时间、精力和热情来策划项目的医疗团队来说，是一个巨大的挫折。对于参与其中的创新者和\
  \ NHS 团队来说，这简直令人士气低落——我们怎么可能推动积极的改变？*\n\n*当我们与 NHS 地方机构接触时，利益相关者对通过一个可扩展且引人入胜的平台来改善\
  \ 2 型糖尿病**管理**和缓解的想法感到欣喜。患者在健康方面的益处以及因减少处方药而节省的开支显而易见——但寻找预算仍然很繁琐。即使有预算，也往往太少，无法真正在人群层面影响健康。*\n\
  \n*作为创新者，我们创新的不仅仅是服务——还有服务交付的路径。全球医疗保健正在向以患者为中心的护理过渡，这与价值而非数量是同义词。*\n\n*基于这一点以及我们在其他国家的经验，今年早些时候，我们与一个\
  \ NHS 临床委托小组（CCG）实施了首个“收益共享”模式。收益共享方法是一种按结果付费的模式，它不需要立即的预付预算，而是可以分享创新交付的成功。在我们的案例中，通过分享因患者血糖控制改善而减少用药所节省的开支。*\n\
  \n*这对各方都有利，因为它短期内需要的投资要小得多，而长期成果则可以共同庆祝和分享。这很有道理——如果每个人都为了“收益”，那么就会有完全的参与和更高水平的协作。这是一个团队——而不是两个——朝着共同的目标努力。*\n\
  \n*该模式重塑了患者接受护理的方式。更重要的是，由于生活方式、行为和环境因素占疾病风险的 90%，它使得一种可扩展的人群健康方法成为可能。*\n\n*作为 NHS\
  \ 的创新者，能够实现数字健康的好处真是太棒了。特别是，普及教育和自我管理的途径，让人们能够过上更健康、更幸福的生活。*\n\n\n\n## 循证医学\n\n\
  如图 91 所示，循证医学通过将最佳研究与临床证据同真实世界的临床专业知识及患者价值观相结合，来解决临床问题。在医疗保健领域，这被视为随机对照试验和日益增长的真实世界证据。数据化与物联网正在为证据基础做出重要贡献。\n\
  \n循证医学的基础是基于最新、最可靠的科学证据进行决策。随着我们开发新的医疗模式，无偏见的证据对于理解和信任服务与创新至关重要。\n\n循证医学先驱大卫·萨基特将这一概念定义为“在做出个体患者护理决策时，审慎、明确且明智地运用当前最佳证据”[178]。\n\
  \n随机对照试验（RCT）被视为评估治疗效果最可靠、最有力的证据形式。证据表明，许多因素会影响 RCT 的可靠性，包括方法学质量、报告质量和资金来源。“大型”公司资助了大部分临床研究，并面临着巨大的利益冲突。研究表明，存在偏向于行业资助研究的偏见，这削弱了对医学知识的信心。历史表明，一些组织选择了利润而非人民。可口可乐曾付钱给研究人员，让他们淡化糖与肥胖之间的联系[179]。\n\
  \n真实世界证据正出现在循证医学的关键时刻[27]。真实世界证据正在颠覆传统的循证等级体系和方法。通过手机、社交媒体、数字社区、健康应用、营养追踪、可穿戴设备和健康物联网，人类体验的数据化使患者能够成为自己的证据基础，并影响了医疗学术界和认知。例如，患者可以比较不同医院甚至不同医生的结果，从而最佳地选择其治疗提供者。\n\
  \n简单来说，当一个 RCT 启动并完成时，一个数字健康应用可能已经拥有数十万会员。需要其他渠道来验证数字医疗和创新在临床上的安全性和有效性[16]。\n\n\
  ### 数字健康研究提出有效性问题\n\n药理学领域进行的大多数 RCT 都具有内部有效性，确保特定药物的测试涉及精确的目标人群。例如，针对高血压药物的试验可能只关注患有高血压且无其他合并症的人群。在现实世界中，高血胆固醇和甘油三酯的合并症在高血压患者中可能很常见。这种方法意味着\
  \ RCT 报告的内容与患者报告的内容之间往往存在差距。这正是数字技术可以通过提供数据来连接这些点，从而帮助弥合药物干预与真实世界患者体验之间差距的地方。\n\n\
  数字社区可以提供关于药物副作用的真实世界证据。社区应用“糖尿病论坛”通过移动应用，以分析患者讨论和报告副作用的形式，向制药机构提供药物副作用数据。全球第二大常用糖尿病药物二甲双胍，其腹泻副作用据报道会影响十分之一的服药者。来自成员的真实世界证据表明，这一比例高出\
  \ 400%，超过 48%的 2 型糖尿病患者报告了此副作用[181]。\n\n历史上，真实世界证据被医学界视为轶事。然而，患者生活的数据化现在意味着数据直接来自设备、可穿戴设备和传感器，确保数据不会被误报。真实世界证据的增长速度之快，令医疗保健行业难以跟上。数字健康平台和数据聚合也对以往的医学范式提出了质疑。\n\
  \n### 循证医学如何跟上真实世界的步伐？\n\n循证医学必须跟上真实世界证据的发展。正如大卫·萨基特所说：“你在医学院学到的一半知识将在毕业五年后过时；问题在于没人能告诉你哪一半。最重要的事情是学会如何自学。”患者现在将互联网、自身及其同伴作为证据基础；真实世界证据和医疗人工智能的普及意味着医疗专业人员不能再对证据基础的变化视而不见，也不能再固守旧范式。\n\
  \n这些数据为人工智能和机器学习提供了丰富的机遇。医疗保健可以采用数据驱动的方法，利用多种数据源来改善患者体验并降低成本。在未来几十年里，对这些数据的探索将显著推动医疗进步，并促进精准医学的发展。\n\
  \n\n\n## 个性化医疗\n\n个性化医疗，也称为分层医疗或精准医疗，是一种将患者分为不同群体，并根据患者预期的治疗反应，做出明智的临床决策以提供治疗和干预措施的方法。作为循证医学的巅峰，个性化医疗的健康管理方法是为患者量身定制的。患者的健康在个体层面进行管理，以达到可能的最佳健康状态。\n\
  \n大约 10%的疾病风险基于遗传因素[182]。每个人都有一个独特版本的人类基因组。特定患者群体可能共享共同的基因组特征，从而具有共同的疾病风险。我们的基因变异决定了身体对特定药物的反应方式，或决定了疾病风险。例如，研究表明，南亚裔人群患\
  \ 2 型糖尿病的比例高于白种人[183]。一种药物可能不适合所有人的需求。服用相同剂量同一种药物的两个人可能会有不同的反应。利用个性化医疗，可以为每个人选择正确的药物及其剂量组合。\n\
  \n这种医疗方法并非新鲜事物，自希波克拉底时代以来，医疗保健专业人员就一直在使用这种方法。\n\n然而，通过使用患者基因组及其不断下降的成本——以及来自健康记录、可穿戴技术和健康物联网的医疗数据——所能实现的超个性化，再次激发了公众的兴趣。以前从未有可能预测疾病风险、人体对特定药物的反应，或者用墨水以外的材料打印治疗方案。这些技术的结合将推动个性化护理和医疗创新的时代。\n\
  \n预测工具可用于评估健康风险并制定个性化医疗计划，以减轻患者健康风险、预防疾病、管理疾病，并在疾病发生时进行精准治疗。随着医疗保健在治疗和服务提供方面越来越个性化，扩大可及性以确保社会各群体的参与变得至关重要。\n\
  \n诊断测试，例如血液检测，通常用于根据患者的生理分析来确定合适的治疗方案。最佳疗法的选择将越来越针对患者基因组进行个性化。医疗保健提供者将能够即时诊断现有疾病、预测未来疾病风险，并识别对治疗的预期反应以及细微特征。基因检测已开始在个性化医疗中产生影响；DNA\
  \ 结果目前仅限于导入那些可以为患者个性化定制治疗方案、饮食计划或教育的服务中。目前，接收 DNA 检测结果需要数天时间。我们很快将进入一个即时、廉价基因检测的时代，这将使患者能够就治疗、服务、产品、药物和结果做出明智的选择。\n\
  \n### 医疗个性化引发伦理问题\n\n基因检测的决定及其结果的影响引发了严重的伦理问题，需要仔细的准备和思考。对于提供者而言，这提供了一个充分参与个性化、基于价值的护理的机会，其中患者体验的质量至关重要。对于患者而言，它可以查明使人易患疾病的基因突变。了解此类信息的生理和心理影响可能是深远的，并在医学界和公众中引起了争议。\n\
  \n在特定问题上，所有人之间自然的分歧是要么支持，要么反对讨论的话题。进步并非没有道德后果，立法必须跟上首次出现问题的速度。人们对拥有大量关于自身的信息感到矛盾。\n\
  \n### 用数据实现医疗个性化\n\n可穿戴设备和物联网掌握着实现个性化医疗（也称为智能医疗）的关键。可穿戴设备中传感器捕获的数据在医疗保健中发挥着越来越重要的作用，促进了以患者为中心的医疗系统的发展。\n\
  \n许多因素正在加速可穿戴医疗解决方案的接受度，特别是在临床试验和学术研究中用于监测患者健康和生活方式因素。研究可以使用安卓手表、苹果手表、佳明、Fitbit\
  \ 或其他智能手表设备记录参与者的健康生命体征。参与者使用应用程序记录他们的生活习惯、营养、活动、用药依从性，并监测药物副作用等。保险公司开始使用可穿戴设备和患者数据来激励健康行为。\n\
  \n历史上，保险公司一直将产品瞄准精通数字技术的买家，提供最新设备以激励健康改善。激励型保险产品将在更广泛的人群中变得普遍，在对抗非传染性疾病方面尤其有效。\n\
  \n互联、数字医疗的提供为监测、管理和逆转疾病开辟了机会，扩大了风险组合，并创造了寿命更长、发病率更低的人群。不健康的成本太高，以至于支付方无法忽视。\n\n\n\
  \n\n#### 丰富、传感器驱动的数据\n\n随着传感器变得更快、更小、功能更强大，患者的健康档案最终将包含详细的睡眠分析、连续血糖监测数据、心率、血压以及近似卡路里消耗等信息。智能手表将集成多种诊断工具，能够监测血压、心率变异性、血糖、酮体等指标。健康传感器将变得可植入、可生物降解，并保持持续连接，在患者护理等任务中发挥关键作用。行为经济学将为我们日常生活提供更深入的洞察。\n\
  \n表 9-1 简要描述了一些互联医疗设备的示例，说明了这些设备可在何处使用及其用途。互联医疗中涉及的一些可穿戴设备和嵌入式传感器包括：\n\n表 9-1\n\n\
  可穿戴技术的应用\n\n| 设备类型 | 佩戴位置 | 用途 |\n| --- | --- | --- |\n| **沉浸式技术** **军用服装** **头盔**\
  \ **混合现实** | 头部 | 教育、行为改变、智能通信 |\n| **智能隐形眼镜** **追踪器** | 眼睛 | 血糖水平监测 |\n| **助听器**\
  \ **耳机** **追踪器** | 耳朵 | 声音 |\n| **气味检测** | 鼻子 | 嗅觉 |\n| **智能纹身** **追踪器** **贴片**\
  \ **植入物** **智能手表追踪器** | 手臂/手腕 | 血糖、血压、血氧饱和度、酮体水平、教育、康复 |\n| **服装** **胸带** **植入物**\
  \ **追踪器** **外骨骼** | 躯干 | 康复 |\n| **服装** | 腿部 | 保护、康复 |\n| **嵌入式鞋具** | 脚部 | 健康指标、姿势矫正、康复\
  \ |\n\n![../images/459335_2_En_9_Chapter/459335_2_En_9_Fig1_HTML.jpg](img/459335_2_En_9_Fig1_HTML.jpg)\n\
  \n图 9-1\n\n循证医学\n\n*   **压力监测带**\n\n    压力追踪与心灵平静是可穿戴设备的两大关键市场。目前，可穿戴设备通过监测呼吸和心率，检测紧张迹象，以改善呼吸并帮助使用者达到更平静的心态。健身追踪器提供正念功能，还有能够向大脑传递特定波形的头带\
  \ [185]。\n\n*   **紫外线传感器**\n\n    西北大学开发了能够精确监测个人紫外线暴露量的紫外线传感器。这种可穿戴传感器薄如晶圆，小到可以放在人的指甲盖上。由于紫外线是已知的强致癌物，该技术有望减少过度暴露于紫外线的情况，并预防中暑和黑色素瘤等并发症\
  \ [186]。\n\n*   **智能纹身**\n\n    智能纹身将传感器置于皮肤内，麻省理工学院和哈佛大学的研究人员在此领域取得了重大进展 [187]。智能纹身墨水会与组织间液的生化成分发生反应，以指示身体状况。未来的发展将使纹身能够降解，按需持续存在，甚至仅在特定光线下显现。例如，高血糖可能使血糖智能纹身变红，而低血糖则可能使其变蓝。\n\
  \n*   **智能药物**\n\n    药物智能化有众多发展方向。智能药物可以告知患者及其医疗团队已服用的药量、服药时间，并在可能漏服时及时提醒。如今，蓝牙连接的药瓶盖和药片包装可提醒患者服药，以提高用药依从性。蓝牙胰岛素笔和笔帽能够记录注射时间、剂量和胰岛素类型，通常会将数据从设备推送到云端，用户可通过数字应用程序界面查询数据。例如，智能哮喘吸入器可以在佩戴者意识到症状之前识别出即将发作的哮喘\
  \ [188]。\n\n*   **智能胰岛素**\n\n    作为智能药物的一种形式，智能胰岛素是下一代胰岛素，能够根据血糖水平的变化自动响应。血糖水平越低，释放的胰岛素越少；血糖水平越高，释放的胰岛素则越多。北卡罗来纳大学的研究人员报告称，他们研发的智能胰岛素贴片可贴在体外，利用微针系统自动检测高血糖水平，并通过活体β细胞适时释放胰岛素。由于β细胞被保存在体外的贴片内，因此完全不存在被\
  \ 1 型糖尿病患者免疫系统排斥的风险 [189]。\n\n患者在出现潜在疾病的第一个迹象或症状时，会立即求助于“谷歌医生”。网上搜索和症状自查工具最终都会告诉你，无论症状如何，你得了癌症——这已经成了一个经久不衰的笑话\
  \ [190]。\n\n患者最了解自己身体的变化，如今他们就诊时准备得比以往任何时候都更充分。现在，就诊的患者信息更灵通、意识更强、健康观念也更强，他们的参与被用于个性化定制医疗保健计划。然而，这也在不同程度上导致了精神焦虑和疑病症。\n\
  \n患者绝不能忘记，合格的医疗专业人员能提供更全面的健康评估和解释，尤其是在他们掌握最新循证依据的情况下。这或许是医学界并不总是欢迎以患者为中心的方法的一个原因。2019\
  \ 年的一项调查显示，87%的患者因使用该平台而与医疗专业人员的关系得到改善，75%的患者表示对自己的病情有了更好的了解。当这项调查在 2015 年进行时，同样比例的患者表示对病情有了更好的了解，但只有\
  \ 20%的患者报告与医疗团队的关系得到改善 [191]。\n\n互联医疗为解决新型健康问题提供了大量机会，尤其是在疾病管理和老年护理方面。\n\n2015 年，联合国估计每\
  \ 10 人中就有 1.2 人年龄超过 65 岁。预计到 2050 年，这一比例将跃升至 22% [192]。老年人口的医疗支出是一个日益令人担忧的问题，因为与其他年龄组相比，老年人口占医疗支出的份额更高。\n\
  \n2 型糖尿病和肥胖症等非传染性疾病已成为大流行病，世界卫生组织估计，到 2050 年将有 6 亿人患上 2 型糖尿病 [193]。大约四分之一的人患有两种或两种以上的慢性病\
  \ [194]。\n\n随着政府、支付方和制造商面临降低医疗成本的日益增大的压力，老年和长期护理需要为即将到来的人口增长做好准备。医疗物联网（Medical IoT）通过提供远程监测、预测和诊断能力，展现出加速实现价值医疗的巨大潜力。\n\
  \n### 个性化医疗的应用\n\n在丰富数据的驱动下，机器学习正在变革医疗保健，使其能够在越来越多的领域实现个性化。\n\n\n\n#### 疾病与状况管理\n\
  \n心脏监测器可以检测心率变异性，并实时向医疗专业人员发出警报。同样的概念也让使用智能血糖监测仪的 1 型糖尿病患儿的父母得以解放。血糖测量值会直接发送到云端，父母可以近乎实时地查看孩子的血糖水平，并在出现潜在低血糖事件时收到警报。数字应用程序可用于逆转\
  \ 2 型糖尿病、管理癫痫以及改善生活质量。\n\n技术的新颖应用可以最大限度地降低健康问题的风险及其后续的医疗成本。老年护理可以通过数字应用程序实现。例如，跌倒等风险可以通过跌倒检测和紧急援助来减轻。\n\
  \n手机或手表中内置的加速度计可用于检测跌倒或癫痫发作，并在紧急情况发生时，向护理人员触发包含事件详情和位置的通知。未来的技术还可能包含安全设备。行动不便的人可以使用可穿戴式成人安全气囊。如果检测到佩戴者正在跌倒，成人安全气囊会展开以防止受伤[195]。技术有助于节省可避免的老年护理费用以及大量相关的医疗开支。\n\
  \n然而，技术在提供老年护理方面的真正价值，尤其是在联网助手和可穿戴设备方面，体现在从收集的数据中生成的预测性分析上。例如，偏离日常活动模式可能预示着值得担忧的问题、新出现的身体或心理健康问题，并能预测患病风险。随着传感器数据和证据的扩展，可穿戴设备在检测疾病迹象方面的应用也在增加。例如，通过\
  \ Apple Watch 收集的心率变异性数据可以预测房颤[196, 197]。\n\n#### 虚拟助手\n\n虚拟助手不仅具有娱乐性；它们可以陪伴独居者，并为老年人和高龄人群提供支持。虚拟助手可以通过回答问题、教授新技能、设置语音提醒来执行任务（例如提醒服药），甚至通过执行接听电话或拨打电话等任务来控制家居，从而增强人们的能力。随着家居日益互联，虚拟助手将在生活的方方面面为人们提供帮助，并与家居的各个部分进行交互。\n\
  \n虚拟助手可以代表患者呼叫紧急服务，并提供精确的详细信息和位置。联网摄像头可以追踪运动以检测跌倒，从而触发虚拟助手寻求帮助。虚拟助手不局限于语音领域，机器人形式的虚拟助手可以在老年护理的特定情况下提供帮助，执行诸如帮助人们起床、进入浴缸或坐上轮椅等任务。此类虚拟助手中的\
  \ AI 甚至可以学习行为模式，例如人们可能想要去洗手间的时间。\n\n通过语音和触摸屏进行的交互实现了沟通，并将日益增强老年患者的自主权，减轻老年护理的负担。来自英国的\
  \ MiiCare 公司通过设备驱动的虚拟助手提供远程监控，以照看老年人群，测量患者体温，并监测活动、水分摄入和用药依从性。\n\n随着虚拟助手能力的提升，它们判断主人情绪（无论是快乐还是悲伤，兴奋还是沮丧）的能力也将随之提高。虚拟助手将解读对话的句法、语义和语调，以检查是否存在精神或情绪健康问题的迹象。\n\
  \n虚拟助手在为残障人士提供有用帮助方面也存在类似的机会。应用程序可用于控制灯光、音乐、暖气、食品订购和生活方式。英国互联网组织 Nominet 开发了一个名为\
  \ Pips 的开源原型，以满足感官或认知障碍人士的需求[198]。该原型通过音频和视觉提示、轻推和提醒，帮助人们完成日常活动，并培养他们驾驭周围环境的技能和信心。该原型采用低功耗蓝牙控制器构建，可在设备之间发送和接收通知。这些设备可用于引导人们完成诸如洗脸、洗澡或服药等任务。\n\
  \n#### 远程监控\n\n联网设备可以为护理人员和医疗专业人员提供支持，帮助人们避免住院并减少就医次数。应用程序和虚拟助手可以提供用药提醒；健身追踪器将监测用户的健康和活动，如果出现偏离常规的情况，会向护理提供者发出警报。\n\
  \n联网设备可以就诸如使用冰箱、洗澡或打开前门等事件向家人和护理提供者发出警报。数据中体现的日常活动模式将被学习，如果出现偏离常态的情况，相关账户将收到通知。紧急按钮可以通知相关服务部门，确保老年人或患有长期疾病的人在最需要的时候获得医疗干预。联网设备、应用程序和虚拟助手的结合使家居更智能，更有利于降低风险，确保医疗保健提供者/诊所掌握患者健康状况的最新概况，同时增强患者的能力。\n\
  \nGro Health 是一款生活方式和行为支持应用程序，它与一个由十几名医生组成的团队共同设计了一个实时远程监控仪表板，为加拿大不列颠哥伦比亚省的患者提供实时护理。如果患者不遵守治疗计划或脱离平台，该平台会向临床医生发出警报[199]。\n\
  \n#### 用药依从性\n\n忘记服药是很容易发生的事，但其后果可能是个问题。超过 50%的处方药未按医嘱服用[200]。漏服可能导致康复时间延长、病情恶化或产生更严重的后果。Benjamin\
  \ 等人进行的一项研究表明，让患者正确服药仅在美国每年就可防止约 12.5 万人死亡[200]。\n\n有许多应用程序和数字服务可以提醒患者何时服药，但医学的发展甚至超越了这一点。带有可摄入传感器的智能药丸旨在通过确认药物已被服用后通知相应的应用程序，帮助医生改善临床健康结果[201]。当传感器接触到胃液时，便会触发通知。这使得医生能够衡量治疗效果并优化患者治疗路径。\n\
  \n#### 便捷的诊断测试\n\n患有慢性病的人和老年人群通常比健康人需要更多的诊断测试。便携式设备中的智能传感器允许用户在舒适的家中进行检测，而无需前往诊所或药房进行尿液和血液检测。检测结果随后可以无线传输给他们的医疗团队。\n\
  \n针对胆固醇、心脏功能、糖化血红蛋白、空腹血糖、维生素 D 水平和胰岛素的检测，提高了重复进行诊断测试的便利性，从而能够实现更快的治疗、降低并发症风险并减少可避免的医疗支出。\n\
  \n#### 智能植入物\n\n连接到智能手机、医疗保健提供者和更广泛网络的植入式设备将用于实时监测和治疗疾病。这些数据带来的可能性是巨大的，因为可穿戴设备是外部植入物，有潜力从器官和组织中收集生物标志物的指标。\n\
  \n\n\n#### 远程医疗\n\n远程医疗的历史可追溯至 20 世纪初，指利用电子技术实现远距离患者护理、患者与医疗专业人员教育及健康管理的临床应用。远程医疗（telehealth）与远程医学（telemedicine）为同义词。近年来，随着医疗手段从电话设备转向互联设备，\"\
  数字健康\"一词已逐渐取代\"远程医疗\"。\n\n通过 Skype 或视频会议设施进行问诊、电子健康记录远程监测、数字健康教育、扫描或影像传输等应用均属于远程医疗范畴[202]。\n\
  \n当今世界已真正实现移动化，数字工具主要通过电子手段处理初级保健问题。更严重的病症则会转介至相关医疗专业人员、机构或团队。数字健康使医疗专业人员能够提前预判健康问题，而非等待症状出现。\n\
  \n#### 数字疗法\n\n数字健康领域中一个令人振奋的新兴分支是数字疗法。数字疗法是远程医疗的增强形式，它将数字与基因组技术同健康、生活方式及人为因素相结合，为患者提供个性化医疗，提升医疗服务的效率。\n\
  \n##### 该信任哪款健康应用？\n\n苹果应用商店中现有超过 15 万款专注于健康与保健的应用，下载量已突破 5000 万次[203]。数字健康工具使患者能够主动管理自身健康，通过影响人类行为来改善健康状况。\n\
  \n唯一的问题在于应用数量过多——在目前可供下载的 32.7 万款健康应用中，65%已超过 18 个月未更新，仅 15%的受评应用达到最低标准。唯有临床证据的质量才能区分市场上各供应商与服务的优劣[204]。\n\
  \n随着医疗干预重点从急性病转向慢性病，行为疗法正超越药物干预成为一线疗法。数字健康与更广泛的远程医疗已应用于多种健康状况，推动医疗与治疗手段快速变革。\n\n\
  确诊癫痫的患者可获处方应用管理癫痫发作，哮喘患者可配备联网吸入器应用，计划接受减重手术的患者可获处方数字健康应用辅助术前减重[205]。\n\n数字健康的绩效衡量将基于患者健康结局、护理质量及长期使用工具与服务的用户数量。\n\
  \n##### 增强传统医疗\n\n英国糖尿病患者中，不足十分之一在确诊后 12 个月内参加过面对面结构化教育[206, 207]。研究表明，线下教育的获益通常在干预停止后\
  \ 1-3 个月内消退，提示习得行为会随时间改变，需要进一步支持以维持生活方式改变。线下糖尿病教育课程的参与度十分有限。\n\n新冠疫情导致许多地区的面对面教育几乎完全消失。\n\
  \n数字健康为健康认知、教育与自我管理提供了绝佳机遇。数字健康并非取代传统医疗，而是对其进行增强。即便在新冠疫情期间我们拥有触手可及的数字健康技术，也未能阻止非直接由新冠病毒导致的超额死亡激增[208]。\n\
  \n数字教育天然具有互动性：患者可随时通过任意设备获取服务。通过用户与服务提供者之间的数据交换，数字教育还能实现个性化定制，实时患者数据的呈现与分析进而促进以目标为导向的个性化实践与可持续行为改变。\n\
  \n##### 以患者为中心的设计\n\n教育可实现以患者为中心、由患者主导，而非传统的师生模式。通过利用用户数据与第三方服务，治疗方案可达到精准化。\n\n\
  数字疗法与自我管理移动应用为赋能患者提供了重要契机，使其掌握管理并优化健康所需的知识、技能与资源[16]。\n\n戒烟、增加运动、减重等生活方式改变均可通过行为干预实现，同时针对主要慢性病进行干预。慢性病及其管理本质上受行为影响[91]。\n\
  \n数字健康工具使治疗实现个性化、民主化与规模化。真实世界证据已充分证明数字工具的有效性。但仍需更多证据与随机临床试验来证明因果关系。一个尚不明确的问题是：数字疗法由谁付费？若医生开具数字疗法处方，应由谁支付？保险公司？医疗机构？雇主？还是患者？\n\
  \n无论如何，数字创新正在彻底改变疾病管理模式。患者对自主权的需求日益增长，他们希望了解自身健康状况、掌握最新循证依据，并积极参与健康管理。\n\n\n\n#####\
  \ 数字疗法：一项长期案例研究\n\n参与研究时，案例“B”是一名 72 岁男性，于 2015 年被诊断患有肥胖症和 2 型糖尿病。B 居住在英国赫特福德郡。他在\
  \ 67 岁时被诊断出 2 型糖尿病。研究结束时，B 的临床诊断已不再显示为 2 型糖尿病。B 是由其英国国家医疗服务体系（NHS）的医生推荐参加低碳水计划（Low\
  \ Carb Program）的。\n\nB 遵循应用程序中提供的信息，减少了饮食中的碳水化合物摄入量。在使用平台的前 16 周，B 每周参与干预 3-4 次，平均每周投入\
  \ 20 分钟。B 使用了网页平台及相应的 iOS 移动应用程序，完成了 12 个核心教育模块中的 10 个。\n\nB 在社区中发布了七次帖子。B 使用该应用程序记录他的饮食日记。通过应用程序测量，B\
  \ 在加入研究第一周的基线碳水化合物平均摄入量为每天 253 克。\n\n到第 16 周，碳水化合物平均摄入量降至每天 102 克。到第 15 个月，B 的碳水化合物平均摄入量为每天\
  \ 109 克。B 饮食日记中最常出现的食物包括花椰菜泥、煎蛋卷、沙丁鱼、鲭鱼和水煮蛋。\n\n到第 15 个月，B 平均每周使用平台 9 分钟。到第 15 个月，B\
  \ 的糖化血红蛋白（HbA1c）已降至 2 型糖尿病诊断阈值以下。B 总共减重 36.29 公斤，糖化血红蛋白降低了 76 mmol/mol。平均血糖水平下降了\
  \ 2.2 mmol/L。B 在 11 个月时被确认进入 2 型糖尿病缓解期。\n\n作为案例研究报告的一部分，B 接受了采访。B 表示：“2018 年 6 月，医生告诉我，由于二甲双胍不起作用，他不得不开始让我注射胰岛素。这让我很害怕，我说我很乐意做任何事。我以前晚上会因呼吸困难而醒来，但想到要注射胰岛素是我主要的动力。12\
  \ 月我回去看医生时，他非常惊讶。”\n\nB 反思说，他现在的饮食中谷物和米饭明显减少了。“最重要的事情是意识到碳水化合物的总含糖量，特别是谷物和米饭，以及它们对血糖的影响有多大。戒掉它们似乎是一件小事。当你坐下来看看自己错过了什么，我并不觉得损失很大。我很惊讶它竟然有如此巨大的效果。”B\
  \ 建议“记录体重，并在每周同一时间称重，这有助于你看到自己的进步，这本身就是一种动力。”B 确认“制定膳食计划并打印出每周的膳食计划”有助于坚持健康的饮食习惯。\n\
  \n#### 激励式健康管理\n\n健康不佳代价高昂。对雇主和经济而言，身心健康问题每年给英国造成超过 770 亿英镑的损失[209]。\n\n由于疾病或因健康不佳导致的工作表现不佳，员工平均每年损失\
  \ 30 个工作日。根据世界经济论坛的数据，到 2030 年，癌症、2 型糖尿病和精神疾病等慢性病对全球经济的影响可能超过 47 万亿美元[210]。\n\n\
  个人的生活方式选择以及身心健康都会影响工作表现。对于保险公司和雇主等支付方来说，在改善缺勤率和出勤低效方面面临着巨大挑战。为此，支付方正在认识到整体健康的重要性——包括身体健康、心理健康以及工作内外的社交和人际互动。\n\
  \n随着医疗干预的重点从急性疾病转向慢性疾病，行为疗法通常正成为一线疗法，而非药物干预。\n\n由可用数据个性化定制并针对用户量身打造的健康计划，为雇主和其他支付方提供了一种便捷的机制来支持健康与保健。过去，激励式健康管理意味着鼓励个人去健身房、多走路——比如走楼梯或步行上班。雇主通常会推广与员工福祉和降低医疗成本相关的健康行为。如今，健康计划和数字工具已超越了简单的指引和筛查。可远程访问的沉浸式、引人入胜的计划，使个人能够以改善临床结果和获得更好健康为目标来改变自己的行为[91]。\n\
  \n以治疗、行为辅导、生物医学数据反馈和传感器等形式进行的行为改变，使健康管理真正实现了以患者为中心。\n\n## 人工智能还能在医学的哪些领域发挥作用？\n\n\
  人工智能是一系列技术的集合，而非单一技术，许多人工智能技术都与医学相关。个性化医疗为人工智能的应用和机器学习模型的开发提供了肥沃的土壤。人工智能旨在将医生，或者更具体地说，将医疗团队，放入我们的口袋。除此之外，人工智能在疾病预测、降低成本、提高效率、自动化手动任务、预约安排以及促使我们改变健康状况等方面都有应用。而且，人工智能在某些方面可以比人类做得更好[211]。\n\
  \n随着数据量和数据种类的增加，人工智能模型的能力将变得更加精确、更具探索性，也更具争议性。\n\n人工智能将改变医生的定义。人工智能与医学的融合正在造就更好的医生并拯救生命。从缩短等待时间、确定优先级，到寻找证据、保持生产力或支持决策，人工智能将协助医生和医疗专业人员做出明智的决策。\n\
  \n以下描述了人工智能技术的一些应用。\n\n### 挖掘电子健康记录（EHR）\n\n对医疗信息系统进行挖掘在医学领域拥有巨大潜力。这些系统存储着关于患者及其健康状况、处方、医生笔记等大量信息。医疗数据可用于提高医疗质量、降低成本、减少错误，并改善和普及医疗质量。\n\
  \n由于复杂性、词汇和标准化程度的差异，目前从这些系统所包含的数据中进行知识发现颇具挑战性。数据挖掘为从文本和图像档案中提取相关信息提供了机会。挖掘像电子健康记录这样的大规模数据，能够发现数据中的模式，这些模式可用于构建预测模型。\n\
  \n正如第 3 章和第 4 章所讨论的，无监督学习以特征提取而闻名，而有监督学习则适用于预测建模。记录挖掘对患者和医疗服务提供者都有益处。挖掘可用于识别高风险患者或慢性病患者，以便为他们提供个性化的干预措施。记录挖掘使医疗服务提供者能够找到最佳实践和治疗方法，以减少理赔和住院率。通过比较症状、治疗方法以及积极和不良效果，医疗服务提供者可以分析出改善患者群体预后的路径，从而实现临床最佳实践和护理标准。\n\
  \n\n\n### 对话式人工智能\n\n对话式人工智能指的是能够进行交谈的系统。与基于文本或代码输入的用户界面不同，人们通过语音与对话式人工智能系统互动。用户越来越多地使用聊天机器人与产品、品牌和服务进行沟通。像亚马逊的\
  \ Alexa 这样的语音驱动型人工智能拥有应用程序（或称技能），可以合成自然语言，提供食谱或健身建议、订购产品、查询食物卡路里或叫出租车。对话式人工智能正在普及：五分之一的美国人拥有智能音箱，并且有超过\
  \ 10 万个 Facebook Messenger 聊天机器人 [212]。\n\n随着人工智能聊天机器人的发展，它们的能力也在增强。智能个人助理将充当医疗保健助手。由于是语音控制，对于那些行动不便、只需使用语音即可执行任务或指令的人来说，具有直接的应用价值。\n\
  \n在医疗保健领域，对话式人工智能能够回答那些无需医生关注的简单问题。例如，新手父母可以向对话式人工智能提出各种问题，而无需担心尴尬或占用医疗专业人员的时间。诸如婴儿洗澡的水温、婴儿应该多久睡一次、或者是否达到了发育里程碑等问题，都可以由人工智能音箱即时回答。\n\
  \n许多人会求助于搜索引擎来寻找问题的答案。然而，大多数查询症状的患者并不知道如何辨别研究质量，除了可能遇到误导性信息（或假新闻）外，还可能遇到相互矛盾的证据，这会让患者感到困惑。\n\
  \n借助医疗人工智能聊天机器人的帮助，患者可以获得即时援助。延续前面的例子，如果新生儿的父母有医疗问题或对某种症状（比如胸腔咳嗽）感到担忧，他们为每个问题都去看医生会非常麻烦。然而，医疗确认的需求是存在的。这目前无法通过算法手段检测到；因此，对话式人工智能在医疗保健领域的发展，将使其被用作连接医疗团队及其周围世界的数字健康界面。\n\
  \n随着对话式人工智能的发展，认知系统将分析对话，以检测精神、身体或神经系统疾病的早期迹象。像 Alexa 这样的语音设备，有朝一日将能够通过对话语气识别阿斯伯格综合征、焦虑症、精神病、精神分裂症和抑郁症的症状。这将帮助医生更好地预测、监测和追踪疾病。有朝一日，医生或许能够通过患者在远程会诊中的声音来预测其患抑郁症的风险。\n\
  \n### 让医生更优秀\n\n人工智能将使医疗专业人员能够跟上最新的循证依据。例如，PubMed 的档案中存有超过 3000 万篇论文 [213]。能够挖掘这些文章并提供最相关证据的人工智能，将有助于培养知识更前沿的医疗专业人员，并使他们能够凭借最佳知识和证据基础行医。人工智能可以在行政任务中协助医疗专业人员，扮演认知助手的角色。\n\
  \n人工智能有助于减少错误，包括人为错误。特别是记录挖掘，将使医生能够随着时间的推移不断改进。关于患者、他们的治疗、医疗专业人员和诊所的数字化数据可以被挖掘，以识别治疗某些疾病时的错误，并避免不必要的住院。荷兰组织\
  \ Zorgprisma Publiek 目前正是这样做的：使用 IBM Watson 挖掘数据以识别重复性错误 [214]。\n\n次优流程会浪费时间和资源。为诊所、医生和患者设计的排班系统能使医疗保健尽可能高效。一个能够安排患者预约并简化沟通的人工智能系统，将减轻医生负担，使其能专注于更紧迫的事务。例如，如果患者出现紧急情况，人工智能可以根据风险进行评估并确定患者就诊的优先顺序。\n\
  \n### 诊断疾病\n\n神经网络先驱杰弗里·辛顿教授曾有一句名言：由于图像感知算法的复杂性，并且可能很快超越人类，“很明显，我们应该停止培训放射科医生”。\n\
  \n人工智能目前可用于检查医学扫描图像、识别 2 型糖尿病症状、识别视网膜病变和心血管疾病风险，以及发现乳腺癌迹象。随着算法在更多数据上进行训练，人工智能的表现会更好。\n\
  \n用于检测疾病的算法显示出巨大前景，其中一些已应用于医疗实践。然而，这并不意味着所有人工智能诊断都已准备好实施。许多人工智能工具是在没有经过同行评审及其学术严谨性的情况下开发的。关键细节需要验证，例如算法的代码、训练和验证数据集；与之比较的数据；性能评估方式；以及神经网络如何得出其结论。\n\
  \n### 制定与合理化决策\n\n医生每天都要做出具有挑战性的决策。确保这些决策尽可能基于充分信息至关重要。人工智能、数据挖掘和预测分析的应用，使临床医生能够合理化决策并制定基于证据的治疗方案。人工智能不必做出最终决定，但可以提出最合理的行动方向。\n\
  \n### 药物发现\n\n开发一种新药是一项昂贵的业务，每三种新药中只有一种能够上市。每种新药上市平均花费制药公司 27 亿美元 [215]。\n\n药物试验失败的后果可能是毁灭性的：从股价下跌到工厂关闭和人员裁减。因此，制药和生命科学行业越来越多地转向人工智能来促进药物研发。\n\
  \n制药业并非寻求用人工智能取代人类。相反，它希望通过使用创新的人工智能来了解失败率为何如此之高。正在开发的人工智能系统能够从现有药物的信息中识别新的疗法；这可以提高效率，带来药物开发的成功，并加速新药上市之路。在发生像埃博拉或猪流感这样的疫情时，加速上市之路可以挽救无数生命。\n\
  \n大约有 10⁶⁰ 种化合物具有类似药物的特性 [216]。未来的化学家将通过利用数据（历史数据、实验数据、推论和趋势）而获得赋能。人工智能能够更早地识别有前景的药物和生物标志物。\n\
  \n人工智能在临床试验中也有应用。临床试验患者分层能够识别出最有可能从相关药物中获益的患者群体。这使得临床试验操作者能够为试验找到合适的患者，而不是那些不太可能产生反应的患者。\n\
  \n\n\n### 3D 打印\n\n随着 3D 打印技术变得更加经济实惠且易于获取，该领域的创新正开始颠覆传统范式。顾名思义，3D 打印涉及根据数字模型打印三维物体，通过增材制造工艺来构建物体。\n\
  \n3D 打印也被称为增材制造，它通过逐层叠加材料来组装模型。这使得建模更加精确，并减少了误差。尽管与其他技术相比，3D 打印解决方案仍处于起步阶段，但其应用潜力令人振奋。许多人工智能专家认为，未来人类将把机器人和生物打印材料植入体内，这是可行的。很快，人类或许就能打印出几乎所有东西，从假肢、药片到生物工程替代身体部位和器官。3D\
  \ 打印的技术进步对患者具有改变生活的意义 [99]。\n\n#### 个性化假肢\n\n世界卫生组织指出，约有 3000 万人需要假肢、支架或行动辅助工具，但其中只有\
  \ 20% 的人拥有这些设备 [217]。3D 打印使得为每个人定制假肢成为可能。通过获取患者的测量数据，可以定制假肢，以确保佩戴舒适、贴合个人。随着多材料 3D\
  \ 打印有助于确保假肢与人体更好地融合，假肢也将变得更加舒适。\n\n通过同样的个性化方法，石膏绷带也可以变得更舒适。3D 打印促进了快速且经济高效地创建个性化产品。3D\
  \ 打印领域的创新正将集成传感器和机器学习算法相结合，以支持更自然、流畅的运动。\n\n预测性运动算法将不断进化，以模仿更自然的运动，人类将能够用大脑和身体来控制它们。3D\
  \ 打印技术使得假肢可以在不到 24 小时内完成建模和制造；重要的是，打印假肢的成本仅为传统假肢的一小部分。\n\n肾脏、肝脏和心脏移植可能很快就会成为历史。3D\
  \ 生物打印标志着一个时代的开始，在这个时代，移植等待名单将成为过去。3D 打印器官可以采用与 3D 打印相同的技术来构建，但使用干细胞作为打印材料。除了打印细胞，生物打印机通常还会输出一种凝胶，以在打印过程中保护细胞。\n\
  \n未来，一旦这些类器官被打印出来，它们将能够在患者体内生长。普林斯顿大学利用 3D 打印工具开发出了一种仿生耳朵，能够听到超出人类听力范围的频率。使用患者自身细胞制成的可打印、可定制的植入物，降低了身体排斥的潜在风险。\n\
  \n生物打印的一个应用案例是 3D 打印人类皮肤。例如，烧伤和酸液受害者，其毁容的皮肤可选择的治疗方案有限。一个西班牙研究团队开发了一种能够生产人类皮肤细胞的\
  \ 3D 生物打印机。在 30 分钟内，一种含有人类血浆和其他材料的生物墨水能够打印出 100 平方厘米的人类皮肤 [218]。生物打印技术带来的机遇确实是改变生活的。\n\
  \n毫无疑问，生物打印存在一个美容市场。未来，人们有可能使用面部打印机将别人的面部模型应用到自己的脸上，甚至存储自己面部的数字模型，并定期重新打印自己的面部以永葆青春。\n\
  \n与纳米技术和基因工程一样，生物打印可能被证明是追求延长寿命的一种工具。\n\n#### 药理学与设备\n\n3D 打印正在颠覆传统的药理学和设备制造方法。例如，药物和其他治疗方法的功效可以在复制的人体细胞组织上进行测试。通过这种方式，3D\
  \ 打印能够打印出为患者个性化定制的药物。\n\n通过这种方法减少药物变异性，3D 打印药物有潜力提高药效、减少不良反应并改善依从性。同样的概念也适用于设备耗材。例如，血糖试纸可以\
  \ 3D 打印，供糖尿病患者在家中使用。可能性是无限的。\n\n#### 教育\n\n英国利物浦的阿尔德希儿童医院使用 3D 打印来向利益相关者教学和介绍即将进行的心脏手术\
  \ [219]。\n\n每位心脏病患者都是独一无二的；对于接受手术的患者，会打印出 3D 模型以实现多种用途。首先，它使外科医生能够使用与人体组织非常相似的纹理和颜色，向常常焦虑担忧的家长演示将要进行的手术。其次，工作人员和外科医生使用\
  \ 3D 模型来熟悉手术中最重要的部分——孩子的心脏。最后，3D 模型用于培训学生。\n\n3D 打印还使外科医生能够通过评估患者身体或器官的精确模型，在手术前做好准备。这降低了出错的可能性，提高了外科医生的精确度，并减少了患者需要在手术台上的时间。3D\
  \ 建模在无需侵入性手术的情况下，对建模身体器官也很有用。\n\n### 基因治疗\n\n就像器官移植等待名单一样，遗传病可能很快就会成为历史。纳米技术的应用，即利用微小粒子操纵细胞和改变\
  \ DNA，使得在细胞水平上编辑基因表达成为可能。基因编辑已成功用于改造人类免疫细胞以抵抗 HIV 感染 [220]。由于每 25 名新生儿中就有 1 名患有遗传病，基因编辑有潜力治疗或消除疾病\
  \ [221]。它可用于纠正胚胎中的缺陷基因，并为孩子制定个性化的即时医疗保健计划。通过编辑患者细胞中的 DNA 来治疗囊性纤维化、镰状细胞性贫血和肌营养不良等遗传病是可行的。\n\
  \n基因编辑并非没有伦理影响；许多人对使用人类胚胎进行研究或编辑基因存在道德和宗教方面的担忧。\n\n有人担心纳米技术和基因编辑将只为富人服务，这将加剧医疗保健和干预措施方面的差距。纳米技术将显著改善治疗和恢复时间，并有潜力从一开始就防止人类患上疾病。\n\
  \n## 选择你的现实\n\n在不久的将来，进行 CT 扫描的外科医生将能够通过增强现实（AR）将扫描结果叠加到患者身体上；医学生将使用虚拟现实（VR）探索心脏内部；烧伤患者将被虚拟传送到白雪覆盖的山顶，作为一种疼痛缓解疗法。数字健康应用\
  \ Gro Health 以 360 度视频形式为用户提供引导式沉浸式正念练习，已被证明有助于人们去中心化 [222]。\n\n沉浸于完全数字化的环境——虚拟现实，主要用于游戏。增强现实和混合现实的创新意味着我们现在可以将虚拟世界和物理世界交织在一起，并同时操控这两个环境。\n\
  \n虚拟现实、增强现实和混合现实正越来越多地被应用于广泛的医疗应用中。很明显，随着它进一步融入医疗保健领域，它有潜力改变许多医疗服务的提供方式。\n\n\n\n\
  ### 虚拟现实\n\n虚拟现实（VR）通常与游戏相关联。在虚拟现实中，用户的现实被一个沉浸式的、完全数字化的环境所取代。目前，这是通过头戴式设备和手持传感器实现的，这些设备使得用户能够在环境中进行交互。\n\
  \n### 增强现实\n\n增强现实（AR）以物体、视频或数据的形式，将数字或三维环境叠加到用户的环境中。用户的真实世界体验仍然是核心，信息被添加到用户现有的现实中以增强其体验。这些信息是明显的数字信息，并不试图模仿真实世界的物体。\n\
  \nAR 不一定需要额外的硬件，可以通过手机等技术实现。AR 的普及性通过《精灵宝可梦 GO》应用现象得到了证实。这款游戏下载量超过 8 亿次，通过用户的 GPS\
  \ 位置将三维角色叠加到用户的真实世界环境中，并引发了一波 AR 创新浪潮 [223]。\n\n### 融合现实\n\n融合现实旨在模拟可以与之交互的数字物体。这需要额外的技术，例如头戴式设备。独立的传感器追踪手势和移动。在混合现实中，用户可以同时操控真实世界和数字环境。\n\
  \n### 沉浸式现实在医疗保健中的应用案例\n\n虚拟现实和增强现实主要用于增强传统的医疗保健路径，并提供治疗和教育。\n\n#### 疼痛管理\n\n研究表明，与对照分心条件相比，虚拟现实环境可用于减少人类感受到的疼痛量\
  \ [224]。大脑中的体感皮层和脑岛与疼痛相关。因此，通过让患者沉浸在虚拟现实中，VR 将被用于使患者能够忍受痛苦的手术。\n\n截肢者经常报告其被截去的、缺失的肢体有疼痛感。VR\
  \ 环境可用于让患者沉浸在一个环境中，以更好地应对他们的幻肢痛 [225]。\n\nVR 也可以作为一种分心手段。无论是儿童还是成人，在接受注射时，医生都会给他们戴上\
  \ VR 头显，以分散他们对即将到来的针刺的注意力。Hermes Pardini 实验室和疫苗接种中心试点使用了 VR 头显，将患者沉浸在一个虚构的、游戏化的环境中\
  \ [226]。患者在虚拟世界中分心，以至于他们常常没有意识到自己已经接受了注射。\n\n#### 物理治疗\n\nVR 可以追踪人体运动，从而能够监测和分析患者的动作。VR\
  \ 健身房已在旧金山和俄亥俄州开设 [227]。康复将变得游戏化，例如，通过踢虚拟球或接球来实现。\n\n康复锻炼可以在 VR 环境中进行和追踪，如果患者做得不对，可以重新告知他们。\n\
  \n#### 认知康复\n\nVR 和 AR 在恐惧和恐惧症中的应用是显而易见的。作为一种医疗手段，患者可以逐渐暴露，这被称为分级暴露疗法。来自传感器的数据将被评估，以确保患者安全并制定最佳实践。\n\
  \n对于难以完成日常任务的患者，可以改善其认知功能。通过监测患者在 VR 环境中的任务表现，医生可以判断记忆力的衰退情况，并确定需要关注或优先处理的领域。同样，对于脑部受伤或执行任务有困难的患者，可以创建代表现实生活场景的数字环境。\n\
  \n患者可以练习任务，并恢复或发展认知功能。可以监测和分析患者的参与度，以观察困难或注意力下降的领域。目前，关于 VR 在认知康复中的应用，进行的随机对照试验很少。然而，VR\
  \ 的某些应用在治疗有神经系统诊断患者的认知缺陷方面是有效的 [228]。\n\n#### 护理与药物递送\n\nVR 和 AR 将发展成为标准医疗培训的一部分。这两种现实都可以通过丰富个人可获得的信息来改善结果。英国的\
  \ Alder Leys 儿童医院使用 VR 头显和 360 度视频来培训医学生如何处理压力情况。本书末尾提供了来自 Alder Ley 的案例研究。\n\n\
  关键决策点可以与同事和工作人员一起审查和分析。虚拟现实将更多地用于学习医学专业，例如进行手术操作和解剖学。\n\n手术可以在专家实时监控和反馈的情况下进行练习。皇家伦敦医院进行了世界上首例\
  \ VR 手术，使观众能够观看 3D 360 度视频 [229]。\n\n这种学习体验是无与伦比的，并且有潜力颠覆医学培训，特别是对于医疗资源有限的国家。\n\n\
  医生将使用增强现实和混合现实来丰富他们的环境。外科医生将通过混合现实实时获取关键信息，并通过眼镜将其呈现在视野中。\n\n护士可以使用增强现实或混合现实来识别手臂上的静脉以进行抽血。波士顿塔夫茨医学中心的介入心脏病学中心使用\
  \ VR 在手术前向有焦虑情绪的潜在患者介绍该设施 [230]。\n\n#### 虚拟问诊与虚拟教室\n\n随着虚拟现实和融合现实设备成本的降低，虚拟问诊将变得普遍。虚拟问诊消除了前往诊所的不便，节省了时间和环境资源，并将医疗专业人员的时间集中在需要的地方。\n\
  \n虚拟问诊将变得像网络研讨会一样常见，使利益相关者无需出行即可参与。除了一对一问诊，虚拟现实和融合现实还提供了适合学习的沉浸式和引人入胜的体验。\n\n虚拟现实将成为教育和培训的主要工具——无论是对于医疗专业人员还是患者。\n\
  \n## 在医疗保健中使用区块链\n\n将传统的患者健康记录过渡到电子健康档案（EHR）被认为是医疗保健领域的巨大进步。患者记录的数字化减轻了集中式数据存储的一些传统风险。然而，这种模式仍然将医疗记录置于提供者手中。由比特币加密货币推广的区块链技术，有潜力彻底改变数据访问、隐私和信任。目前，区块链尚未在主流医疗保健领域部署。\n\
  \n\n\n### 什么是区块链？\n\n区块链本质上是一组数据记录的集合，它是由几种现有技术组合而成的一款软件，这些技术赋予了区块链其典型特征：一个不可篡改、分布式的公共账本，任何人都可以验证其真实性。那些验证账本上数据的人会获得价值奖励，这有助于在缺乏信任的环境中建立信任；分布式点对点控制提供了高度的安全性；并且该账本可以被编程，以智能合约的形式触发自动交易，从而使这项技术得以广泛应用。\n\
  \n例如，PayPal、Visa 和万事达卡充当着金融交易的中央权威机构：即作为中介的可信机构。土地登记处则充当着房屋所有权详细信息的可信存储库。这些中心化数据库容易遭受黑客攻击或被人为篡改。\n\
  \n区块链技术旨在解决数据管理、隐私和安全问题，通过使用去中心化、不可篡改的数据库，改善互操作性，并促进医生、医院、医疗保健系统和保险提供商之间的数据流动。\n\
  \n患者要求更多地访问自己的医疗健康记录。来自电子健康档案（EHR）、物联网、可穿戴设备及其他设备的数据，可以在一个可信、安全、透明且具有互操作性的环境中，被用于该账本。\n\
  \n### 防篡改安全性\n\n区块链是一个无法被编辑的数据库，由所有使用它的人共同存储和维护。每一笔新交易或每一条新数据都会被加密，然后通过网络上的其他节点，通过特定的证明协议（如共识机制、工作量证明、权益证明）进行批准，这些节点负责验证交易或核实存储的数据。\n\
  \n网络上的每个节点都拥有一份完全相同的区块链副本；因此，交易被永久记录，并与之前的记录相链接。这些链接被称为哈希值，可以追溯到区块链中的第一个区块。因此，任何在当前试图篡改某个区块的行为，都需要同时修改该交易以及所有相关区块，并且要在所有持有账本副本的节点上同步进行修改。最长的链被视为有效。\n\
  \n区块链采用了加密经济学和博弈论技术。任何试图创建一条竞争链的行为，都需要比当前被接受的“真相版本”创建得更快才能被认可。这需要投入巨大的计算能力、能源和资源。矿工们竞争以验证区块。这种良好行为在电力和算力方面代价高昂，因此矿工们受到激励去验证区块，并以此获得比特币（BTC；在比特币场景中）作为奖励。\n\
  \n通过创建一个通用的、分布式的、不可篡改的医疗信息数据库，医生和医疗保健提供者有可能从任何系统中访问医疗数据，同时获得更高的安全性和隐私性，减少管理负担，并更好地共享结果。\n\
  \n*   通过去中心化和加密数据，消除了单点故障。\n*   区块链是民主化的。任何人都可以贡献或存储一个版本的真相。\n*   通过确保对事件达成共识，保留了最可能的真相版本。\n\
  *   通过时间戳，提供了一个透明且可审计的事件账本。\n*   博弈论、加密经济学和哈希算法激励良好行为，并确保事件不受审查。\n\n### 应用案例\n\n\
  区块链技术在医疗保健领域有许多应用，目前大多数技术处于试点或概念验证阶段，应用于以下案例。\n\n#### 验证供应链\n\n区块链可以验证供应链。由于区块链是按时间顺序且可审计的方式创建的，它可以作为验证供应链中每个环节组件的一种手段。例如，材料或治疗方案的流转过程可以记录到区块链账本上，这可用于通过数据录入或物联网设备来识别欺诈活动、异常情况、错误或供应链中断。\n\
  \n从制造商到药房的胰岛素冷链配送过程，可以被确认为未被篡改且温度适宜。这在发展中国家目前正被用于打击假药。同时，它也被开发用于加强基因组数据保护，以应对大数据基因组学带来的隐私挑战。\n\
  \n#### 激励健康行为\n\n区块链技术可用于激励健康行为：通过使用加密货币作为有价值的数字代币。让人们参与健康服务或养成更健康的生活方式，可以为全球经济节省巨额的医疗保健成本。\n\
  \n健康服务提供者或雇主通常以节省成本或增加利润的形式看到其中的好处，而这种好处很少传递给个人。通过利用区块链技术，可以创建代币并通过区块链分发给患者，以分享节省下来的价值，并将其视为一种可交易的货币。\n\
  \n个人可以通过诸如去健身房、达到步数目标、参加教育课程、进行正念练习、完成特定体育赛事、坚持服药或数字疗法等行为来赚取代币。该生态系统用有价值的资产或代币来奖励积极行为。代币的价值可以是固定的。\n\
  \n扩展这一概念，积极的健康行为可以发展到患者拥有健康代币储蓄账户的程度，该账户可用于在医院进行交易。\n\n#### 患者记录访问\n\n患者要求访问自己的健康记录。这带来了一个重大挑战：如何最好地与未知的第三方共享敏感医疗数据。对于第三方而言，在确保患者隐私的同时验证数据的完整性也是一个挑战。\n\
  \n在适当授权的区块链上呈现患者记录，可以在无需人工干预的情况下，为数据质量提供加密保证。上传健康数据的提供者或消费者将生成交易。用户提供签名和时间戳，以及用于访问数据的私钥。通过使用数字签名，存储在区块链上的所有记录都可以被识别，并用于创建全面的患者健康记录。\n\
  \n数字签名和加密加密技术的使用确保了数据的安全传输，并且只有拥有相关公钥的人才能访问。通过使用区块链技术，对电子健康档案（EHR）的每一次添加都可以被记录下来，形成一条不可篡改、可审计的交易轨迹，同时确保使用的是记录的最新版本。患者将能够验证所有访问或处理数据的尝试。\n\
  \n区块链的去中心化结构使得任何经批准的参与者都可以加入该生态系统，而无需担心数据集成或操作问题。\n\n## 机器人\n\n与其他人工智能领域一样，机器人技术的应用正在改变医疗保健。机器人技术目前尚未广泛普及或实施，并且在医疗环境中，机器人不太可能完全取代人类。医院和医疗保健系统在技术得到验证之前无法承担其成本；并且机器人助手尚未取代，有些人甚至说无法取代，人与人之间的接触。\n\
  \n除了在供应链中的应用，机器人技术在以下领域也具有潜力。\n\n\n### 机器人辅助手术\n\n机器人辅助手术能够提供增强的视野、更高的精度和灵活性。目前其应用范围有限，但随着硬件成本、培训等准入门槛的降低，机器人辅助手术将变得普及。未来，医疗专业人员可能不仅需要学习如何操作仪器，还要学习如何执行手术。机器人辅助手术模糊了责任界限，这可能成为其推广的一个障碍。\n\
  \n### 外骨骼\n\n机器人外骨骼技术专注于让患者能够通过使用外部集成设备来执行任务。Ekso Bionics 是一家提供可穿戴外骨骼的组织，该外骨骼可帮助脊髓损伤患者站立并学习行走[231]。未来，外骨骼将成为一种标准的康复形式，并在更多活动和环境中辅助人类行动。\n\
  \n### 住院护理\n\n通过使用机器人来简化任务，可以提升住院护理水平。机器人可用于自动化执行诸如收集邮件或运送血液等任务。配送机器人将自主运送药物或重要物资。\n\
  \n机器人已被用于对病房进行消毒，通过使用机器人代理，可以将人类面临的风险降至最低[232]。不久之后，可摄入药剂和智能药丸将能够监测患者对治疗的内部反应；机器人护士将在自动化任务（如抽血）中变得普遍。机器人将比人类护士更准确地识别正确静脉，从而测量你的生命体征并抽血。机器人将用于支持对老年人和慢性病患者的护理。\n\
  \n### 伴侣\n\n随着自然语言处理技术的发展，虚拟助手正变得越来越像人类。如前所述，人类已经与机器人建立了情感联系。机器人可用于在心理健康、老年护理和长期护理的情况下提供陪伴或治疗孤独感。\n\
  \n随着机器人能力的提升，它们将能够执行越来越多的职责，例如为患者洗澡、转运患者等。机器人将能够通过物联网和可穿戴设备监测生命体征，并实时辅助患者。\n\n###\
  \ 无人机\n\n无人机有潜力改变药物的运送方式。无人机可用于难以到达的地区、冲突地区和偏远人群，以运送药物、疫苗和诊断用品。无人机将用于从药房运送药物，就像它们正被用于购物配送一样。对于血液、体液和器官等时效性强的物品，无人机可以在园区内或更远的距离内，以较短的路程直接送达目的地。在武汉新冠疫情期间，无人机被用于转移人道主义援助物资[233]。\n\
  \n无人机还可用于定位和识别，尤其是在偏远地区。无人机的一个用例是在紧急情况下作为飞行药箱。中风、创伤或心力衰竭发生后的几分钟内，关键护理对于加速康复和预防死亡至关重要。由代尔夫特理工大学开发的一款救护无人机原型，集成了心脏除颤器、药物和双向无线电，可在第一响应者到达前被派往患者处，以加快响应速度[234]。\n\
  \n目前对无人机的使用限制正在削弱其潜力。飞行限制、立法以及无人机电池寿命和载荷等功能性问题，可能还需要一段时间才能解决。\n\n## 智能场所\n\n智能家居、医院、场所和物品有望改变我们的生活方式。无处不在的连接和不断扩展的传感器基础为人们、患者和医疗服务提供者带来了大量机遇。过去\
  \ 30 年来，患者生活方式和医疗保健的改善使得百岁老人数量不断增加。仅在英国，活到 100 岁的人数就增加了 65%[235]。\n\n这些突破是以医疗成本为代价的；而智能场所和智能物品则提供了可扩展的机会来改善健康和社会护理——在降低人均成本的同时，为患者提供个性化体验。互联场所将不再需要经历连接和集成应用程序、传感器或设备的过程，而是使用无需用户持续关注的自动化传感器，收集海量实时数据。\n\
  \n面部识别、语音识别、响应式通知和基于数据的建议将成为常态。聚合与分析平台将在一个快速变化的环境中简化和优化决策过程。这些设备可以实时通知患者和医疗专业人员：忘掉你的“老大哥”吧，这是“大医生”。\n\
  \n### 智能家居\n\n为了改善患者和人群健康，家庭实现智能化的方式有很多种，通过举例可以最好地说明这一点。醒来时，可穿戴睡眠监测器会评估你的睡眠质量，同时你可以通过联网手表进行正念练习。你的睡眠监测器甚至会告诉你何时上床睡觉才能获得最佳恢复效果。在用一把能评估你是否脱水的牙刷刷牙后，你喝下早上的咖啡，咖啡会控制释放到血液中被吸收的胰岛素剂量。你的冰箱会告知你过期的食物，并确保你购买的食物中不含任何潜在的过敏原。\n\
  \n智能手机应用程序会标注食物的卡路里和营养价值；3D 打印机将能够打印出安全可服用的家用药品。虚拟助手甚至镜子会评估焦虑和抑郁的迹象，并以自然语言评估健康生物标志物。如果你开始咳嗽，你的虚拟助手会告诉你咳嗽比平时更频繁；并且根据智能手表检测到的体温变化，你的助手会代你给医生打电话并安排预约。\n\
  \n作为一个封闭环境，智能家居允许人工智能适应高度个性化的用户需求。任何“智能”事物最重要的元素在于规模化时的细微差别：理解上下文并优先处理本地活动。\n\n\
  未来并不像看起来那么遥远。意大利的博尔扎诺已经在与 IBM 及多家合作伙伴合作，帮助老年人安全地在家中养老[236]。安全与保障是首要任务，该项目使用安装在房屋内的传感器来监测温度、一氧化碳和水泄漏等环境因素。数据被推送至一个异地控制室，根据个人需求，会通知家庭成员、志愿者、应急响应人员和社会服务机构。\n\
  \n\n\n### 智慧医院\n\n智慧医院是一种互联互通的医院，与智能家居颇为相似。其目标在于借助技术手段，提供卓越的临床诊疗、高效的供应链以及极致的患者体验。智慧医院将运用一个持续学习的生态系统，涵盖电子数据采集与健康档案、数字技术、机器人技术、3D\
  \ 打印、非结构化数据以及强大的分析能力等多个领域。颇具讽刺意味的是，大规模使用技术和人工智能将使患者能够更积极地参与自身的治疗决策。非紧急咨询将在互联网上进行，通过人工智能的优先级排序，让具备相应技能和培训的合适医生来为患者诊疗。治疗将融合线下实体护理与数字护理——在这种模式下，患者的依从性和责任归属可以得到量化和维护。不断增长的数据和大规模分析将继续为患者个性化定制数字治疗方案。\n\
  \n患者入院时，自动化的精简流程可减少等待时间。入院后，患者将佩戴一个临床级别的可穿戴设备，用于在住院期间追踪生命体征。所有指标都通过无线方式发送到医疗团队可见的仪表板上。任何异常或值得关注的情况都会被检测到并设定优先级。\n\
  \n医院和手术中心将成为数据枢纽，医院与企业合作，从数据中挖掘价值——旨在提高效率、减少错误、优化治疗和器械决策。医疗保健将作为一种服务来提供，患者可通过保持明智健康的生活方式而获得加密货币奖励。所有相关数据都将进行匿名处理，并可供数字健康合作伙伴及内部部门访问，以便从每位患者的经历中持续学习。\n\
  \n## 发展整体人工智能\n\n推理是还原论的。还原论的基本前提是，通过将复杂的生物或医学现象分解或简化为其众多组成部分，人们更有可能找到单一病因并设计出疗法。\n\
  \n例如，一只老鼠可以被分解为骨骼、循环系统、神经系统、消化系统等等。它符合一个模型——一种模式、理论、方程、公式或某种通用结构。人工智能系统也遵循同样的还原论方法，将问题简化为一个明确的学科。要使人工智能真正发展出人工理解能力，关键在于从整体论的角度来对待人类。\n\
  \n随着世界不断沉浸在数字技术中，医疗保健人工智能模型正变得更快、更准确，以患者为中心的护理和生活方式医学将重点重新放回整体健康上。生活方式因素、睡眠、运动、营养、环境和遗传对健康的影响是众所周知的。我们也知道，世界和人、思想和语言，都可能是不可预测的。\n\
  \n随着人工智能的发展，那些还原论方法无法解决的、具有不可还原复杂性的问题将需要得到解决。重点在于价值，在于患者，将患者视为完整的人，并关注患者更广泛的健康、人际关系和目标。\n\
  \n## 结论\n\n自 1956 年被定义为一个领域以来，人工智能已经取得了长足的进步。机器已经发展到可以在拥有数百年历史的游戏中击败人类，并能告诉我们人类计算无法识别的信号。\n\
  \n随着人工智能的发展，不丢失人性化触感的要求也随之提高。合作性的学术研究、临床证据和政策制定必须塑造人工智能和医疗保健领域，以确保人类的最大利益免受那些开发智能软件者的侵害。\n\
  \n无论你是对人工智能对社会的影响持悲观态度，还是屏息以待地期待它，有一件事是确定的——随着数据量比以往任何时候都多，医疗保健领域最有希望的时代尚未到来。\n\n"
- "# 10. 案例研究\n\n> *从自己的失败中学习，或者从别人的失败中学习。无论你选择哪种，都要学习。*\n> \n> ——基尔帕·伽亚特里·考尔\n\n\
  人工智能正在改善医疗保健体验，为那些能够利用并适应新型医疗和护理服务模式的人带来成功。本章包含现实世界的案例研究，展示了机器学习应用如何被用于解决数字健康领域的实际问题。\n\
  \n每个案例研究都提供了关于大数据、人工智能和机器学习在健康与社会护理领域中应用的独特且引人入胜的视角。对组织处理数据识别出的医疗保健问题的方法的真实描述，展示了数据和人工智能的即时价值。\n\
  \n这些案例研究背后的目的是展示人工智能、机器学习、数据和物联网在现实世界中新颖且创新的应用。\n\n每个案例研究都分享了从各自智能系统的创建、训练和部署过程中获得的独特经验教训。\n\
  \n## 现实世界的灵感\n\n我们在 Twitter 上征集案例研究，共收到 108 份提交。如果案例研究已在现实世界中使用（无论是试点项目还是其他形式），并有证据证明其从健康效益或成本节约角度具有价值，则被接受。\n\
  \n用于评估案例研究是否入选的标准包括：\n\n*   重点关注精准医疗和大数据生成技术的交付。\n\n*   机器学习或数据驱动模型必须已部署到现实世界中。\n\
  \n*   作者必须强调从项目提供的经验中获得的教训。\n\n*   作者必须分享关于项目范围的充分信息，并就其组织、业务、临床或财务影响得出结论。\n\n\n\
  \n## 实际应用与经验总结\n\n所选案例研究展现了在提升患者参与度、治疗效果及临床成功率方面的卓越愿景、专注与驱动力。这些案例研究在以下方面提供了富有启发性的范例：\n\
  \n*   利用大数据驱动决策，实现患者及群体层面的精准医疗\n*   开发机器学习模型的优势与陷阱，及其在现实世界中的应用\n*   数据收集、分析、管理与治理\n\
  *   开发人工智能代理，融合数字化与面对面医疗保健\n*   在初级和二级医疗系统中使用可穿戴设备、传感器及物联网健康设备提供护理\n*   人工智能的伦理与道德\n\
  *   数字技术、医疗保健及循证医学在追求提升生活质量方面的未来\n\n关于案例研究、各自作者及其所属机构的更多详细信息，可在在线提供的补充阅读区域获取。\n\n\
  入选的案例研究均详细介绍了当今医疗保健领域中机器学习和人工智能的实际应用，并包含了我目前领导的机构 DDM 所提供的数字健康技术示例。\n\n案例研究包括：\n\
  \n1.  用于糖尿病足问题影像学检查及转诊优先级排序以改善发病率和死亡率的人工智能\n2.  数字化提供的低碳水化合物 2 型糖尿病自我管理项目的结果：一项单臂纵向研究的\
  \ 1 年结果\n3.  为癫痫提供可扩展且引人入胜的数字疗法\n4.  通过新颖的增强现实和虚拟现实应用改善初级医生的学习成果\n5.  可穿戴应用对健康结果有影响吗？一项关于活动影响的真实世界服务评估\n\
  6.  大数据、大影响、大伦理：从患者数据诊断疾病风险\n7.  用于个性化护理的预测性人工智能模型评估及准确性评价\n8.  语音激活助手能否支持成年人保持自主性？一项关于语音激活智能音箱应用对活动影响的真实世界服务评估\n\
  \n## 案例研究 1：用于糖尿病足问题影像学检查及转诊优先级排序以改善发病率和死亡率的人工智能\n\nHarkrishan Panesar，Gro Health，英国\n\
  \n### 背景\n\n全球有 4.63 亿人患有糖尿病，其中英国有 400 万[237]。目前英格兰有 7.7 万名糖尿病患者患有足部溃疡[238]。溃疡持续时间越长，愈合所需时间就越长。未经治疗的溃疡可能导致糖尿病足病（DFD）和截肢[239]。英格兰每天发生\
  \ 25 例下肢（脚趾/脚/腿）截肢；其中 85%是可以预防的[240, 241]。\n\n从 2015 年到 2018 年，英格兰发生了 27,465 例与糖尿病相关的下肢截肢，有\
  \ 147,067 例与 DFD 相关的住院，平均住院时间为 8 天，总计 1,826,734 个住院床日，花费超过 6.86 亿英镑[242, 243]。\n\
  \n英国国家医疗服务体系（NHS）每花费 100 英镑，就有 1 英镑用于 DFD[244]。将溃疡患病率降低 33%每年可为 NHS 英格兰节省 2.5 亿英镑[9]。足部检查是识别、评估潜在问题并采取行动的机会。NICE\
  \ NG19 指南指出，糖尿病患者应每年接受糖尿病足部检查，有活动性足部问题的患者应在一个工作日内转诊至多学科团队，并在另一个工作日内进行分诊[245]。\n\n\
  然而，由于以下原因，存在“患者对症状认识不足、医疗评估不准确以及获取专科服务困难”的问题[246]：\n\n*   检查延迟：国家糖尿病足部护理审计发现，39%的患者等待\
  \ 14 天以上才接受首次足部溃疡专科检查[247]。\n*   缺乏检测：英格兰有 80 万名患者未接受年度足部检查。80%的执业护士对进行足部检查缺乏信心，导致护理和结果存在差异[248]。\n\
  *   评估质量差：33%的 NHS 英格兰专员不为医疗保健专业人员（HCP）提供足部护理培训。即使有培训，评估质量也很差[249]。\n\n创新可以普及患者护理，并减轻溃疡/DFD\
  \ 带来的经济和健康负担。\n\n### 认知视觉\n\n认知视觉或图像识别是一种旨在模仿人脑功能的机器学习技术。通过这项技术，机器学习模型被训练识别构成图像的视觉组件。通过在大量图像数据集上学习并识别模式，模型能够理解其输入并确定相关的标签和分类。图像识别并非易事。要成功执行图像识别，神经网络是首选技术。\n\
  \n然而，即便如此，实际中的计算资源成本仍然很高。例如，一个 20 像素乘 20 像素的图像输入到神经网络中，将接收超过 400 个输入。虽然这在典型的硬件设置中听起来可行，但更大尺寸的图像，比如\
  \ 1000 像素乘 1000 像素，则需要强大的计算资源来处理更多的参数和输入。在传统的神经网络中，每个像素都会连接到一个单独的神经元。这在计算上非常昂贵。\n\
  \n图像中像素的邻近性与它们的相似性有很强的关系。卷积神经网络特别利用了这一特性。卷积神经网络不是将两个相邻的像素视为独立的，而是假设这些像素之间比距离较远的两个像素更可能存在关系。\n\
  \n通过绕过像素之间不太重要的连接，卷积解决了传统神经网络面临的计算和时间问题。\n\n卷积神经网络通过按邻近性过滤关系，改善了图像识别所需的计算资源。\n\n\
  临床证据表明，诊断测试和风险分层可以预测溃疡和截肢的风险，早期转诊可降低截肢率和愈合时间[251]。\n\n糖尿病足部护理的解决方案必须比标准的依赖医疗工作者的服务更广泛，并且能够以更低的成本为患者和医疗系统提供。\n\
  \n我和同事杨旺一起，应用了最先进的人工智能技术来自动检测糖尿病足问题的迹象，提醒患者，并支持医疗团队的沟通和评估。用于糖尿病足问题的图像识别技术将是革命性的，特别是考虑到这种机器学习经验可以改善溃疡愈合时间、成本以及截肢风险——因为这关系到溃疡被检测到的早晚。该模型在检测微小的瘀伤区域和足跟皲裂方面取得了高精度，这些问题很快可能发展成足部溃疡区域。\n\
  \n我们开发了一个基于云的系统，允许远程使用该应用程序，任何带有互联网浏览器的设备都可以按照标准化协议上传图像。输出将是一份检测到的任何问题的列表、最适合该问题的转诊路径，以及相关的教育信息（如果适用）。\n\
  \n该模型通过机器学习反馈循环不断优化，该循环定期使用随机标记数据子集（包括从基于 Web 的系统接收的数据）来优化和重新训练模型。\n\n\n\n### 项目目标\n\
  \n我们项目的目标是进一步开发和验证这项机器学习技术，包括用于预测足部问题风险并为患者提供精准医疗的深度学习神经网络。用于多重预测的卷积神经网络可以通过使用和用户反馈循环变得更加精确。\n\
  \n由于用户群体主要是医疗专业人员和护理人员，学习过程可以扩大规模，并由医疗专业人员验证以进行适当的分诊。该项目还旨在为患者提供服务，而这只有在模型达到最大、理想情况下接近绝对的准确度时才有可能实现。减少错误是该项目的一个关键优先事项。\n\
  \n分级方案和标准化协议支持模型发展出更高的精确度和召回率。更早识别溃疡和其他足部问题的能力将加速诊断和治疗，并挽救许多人的生命。基于云的系统将有助于更轻松地共享应用程序及其结果。我们开发了一个全面的活动日志，以识别生态系统中发生的所有事件。该平台包括行为健康指导，以及通过蓝牙设备、可穿戴设备和自我输入数据对血糖、血压、情绪、饮食、体重和睡眠进行集成跟踪。\n\
  \n人工智能模型在预测分析中提供了无限的机会。通过分析和归纳数千张图像，医学图像正在转变为科学。很少有像数字化这样引人入胜且身临其境的方式，它使医疗保健能够收集海量数据；进行分析并提供有用的反馈来告知患者；以及预防、预测、诊断和治疗疾病。\n\
  \n从图像的本质来看，为聚合学习而进行的去标识化在技术上是简单的。然而，能够解释深度神经网络预测机制的要求在技术上是困难的。对应用程序更普遍的理解可以缓解大多数利益相关者的担忧，这可以通过演示来解释。\n\
  \n作为一项新颖的创新，一直需要解释模型是如何生成、验证和持续评估的。由于围绕产品分类的定义较为松散，事实证明，监管批准比之前的项目更加费力。\n\n错误最小化一直是一个优先事项，监管批准的重点是确保患者安全。假阳性的风险被确定为更可能发生：早期溃疡检测意味着更快的愈合和更低的截肢风险。\n\
  \n在模型内部设定了关注阈值，任何疑问都会转交给人类处理。\n\n该项目的成果正在通过临床论文进行记录，以强调该项目对患者、医疗保健提供者和全球医疗保健提供者的价值。也许最重要的是，这些成果将展示糖尿病患者如何通过预防和检测糖尿病足问题来实现显著的健康改善。\n\
  \n### 挑战\n\n在整个项目期间，观察到了一些惯性点：\n\n#### 数据质量\n\n任何模型的好坏都取决于用于创建它的数据。数据的完整性和正确性对于稳健的机器学习算法至关重要。收集到的数据集存在几个重大挑战，这促进了稳健数据治理流程的开发。首先，缺乏标注意味着数据未标记，并且在接收时通常不明确。\n\
  \n其次，支持图像扫描的手写笔记通常难以辨认。拼写错误或不完整的医生笔记使数据验证过程复杂化。数据的清理和审查推进了一个被确立为模型“唯一真实来源”的数据集。\n\
  \n#### 数据治理\n\n获得国家和国际监管批准的要求需要建立适当、透明的数据治理流程。治理涵盖的领域包括数据架构、归档、管理、元数据管理、隐私、安全和验证。为数据采集、核查和验证制定了标准、最佳实践和程序。\n\
  \n一个中央存储库保存所有相关数据和元数据，通过凭据限制访问以确保适当的用户管理。根据监管要求，记录了所有决策的治理轨迹，这为项目结束时的反思性学习提供了机会。严格的数据治理确保了项目中所用数据的完整性。\n\
  \n#### 性能与“可解释性”\n\n神经网络以其难以解释而闻名，尤其是当模型变得更加复杂时。该项目的一个关键要求是算法决策的透明度。\n\n随着模型的发展，学习和反向传播的迭代调整了网络中的节点，使其变得无法解释。模型性能和准确性次于模型透明度。\n\
  \n#### 伦理治理\n\n与数据治理流程并行，制定了严格的数据伦理和信息伦理治理程序，以确保数据的合乎伦理和道德的使用。医疗专业人员使用该机器学习模型来预测和诊断足部溃疡的风险。\n\
  \n特别记录了关于假阳性和真阴性影响的过程，因为误诊被确定为最大的伦理问题。通过快速诊断和行动，溃疡和愈合时间的影响可以大大减少。\n\n由于该应用程序用于支持医疗专业人员的行动，用户被告知了模型的局限性，并解释了模型准确性如何基于验证数据集。\n\
  \n#### 闭环反馈\n\n开发的模型预测了足部溃疡和其他糖尿病足问题的可能性。由于这将用于预防和诊断阶段，一个被要求的功能是验证和确认模型预测的能力。为此，使用该应用程序的医疗专业人员要么确认诊断，要么将患者转诊给专家进行诊断。\n\
  \n将患者结果反馈回系统的过程使系统能够近乎实时地学习。一旦患者被转诊到医院，从他们那里收集数据反馈是困难且繁琐的。\n\n#### 利益相关者理解\n\n一个未曾预料的挑战是利益相关者缺乏理解，以及对技术驱动的医疗解决方案存在零星的抵触情绪。\n\
  \n关键利益相关者通常受到以往经验或负面新闻的影响，或者受到机器人时代将取代人类工作的担忧的威胁。这通过员工利益相关者培训日得以克服；第三方专家和内部利益相关者解释了人工智能和机器学习如何用于优化医疗专业人员执行的任务，减轻资源负担，并缓解对近期机器人竞赛的担忧。\n\
  \n项目范围是在一个多元化、多方面的利益相关者群体的意见下制定的，以确保所有相关方都参与到项目中。\n\n#### 采纳策略\n\n作为一个通过研发资金启动的项目，试点项目与更广泛的组织方向几乎没有结合。通过研讨会和实践经验，提高了利益相关者对这项新颖创新的舒适度和采纳度。研讨会侧重于减轻利益相关者的担忧，并强调预测系统的简便性、有效性和资源节约性。\n\
  \n\n\n### 结论\n\n对摄影硬件和格式差异具有敏感性且能灵活适应的云端智能，可与患者的临床、人口学、行为及基因组数据相结合，从而构建出用于检测糖尿病足问题的精准医疗框架。\n\
  \n该原型受到了医疗专业人士的欢迎，其中数人指出其某些元素提升了他们自身对该主题的认知。当与这一数字工具配合使用时，医疗专业人士在诊断足部问题方面感到更加自信。数字辅助手段能够确认并支持决策，同时促使医疗专业人士反思其决策过程。将该技术应用于医疗和研究机构收集的各类医学图像及数据，将能以可负担的方式实现大规模预后、风险分层以及最佳治疗决策。\n\
  \n根据我们的经验，拥有更多数据几乎总是比算法本身更重要。\n\n克服文本数字化、标签识别与医学影像相结合所带来的挑战，被证明是该领域内一个颇具难度的方向。手写体和人为错误一直是需要最大程度减少以降低错误召回率的最大难题。开展大规模临床试验是该项目的下一阶段。一项评估项目可行性的试点项目正在等待资金批准。\n\
  \n## 案例研究 2：数字化提供的低碳水化合物 2 型糖尿病自我管理项目的成效：一项单臂纵向研究的 1 年结果\n\nL. R. 萨斯洛博士，美国密歇根大学安娜堡分校\n\
  夏洛特·萨默斯，英国糖尿病数字媒体公司\nJ. E. 艾肯斯博士，美国密歇根大学安娜堡分校\nD. J. 安温，皇家全科医师学院院士，全科诊所主任医师，英国绍斯波特诺伍德外科诊所\n\
  \n### 背景\n\n2 型糖尿病具有严重的健康后果，包括失明、截肢、中风和痴呆；其年度全球成本超过 8000 亿美元。\n\n尽管通常被认为是一种进行性、不可逆的疾病，但一些研究人员和临床医生现在认为，2\
  \ 型糖尿病可以通过低碳水化合物饮食得到有效治疗，这可以改善 2 型糖尿病的管理，甚至可能导致病情缓解[252]。事实上，先前针对 2 型糖尿病的低碳水化合物饮食研究确实显示出改善的结果（例如血糖控制、体重减轻以及降糖药物使用减少），无论是极低碳水化合物饮食（总膳食热量中约\
  \ 20%或更少来自碳水化合物）[253, 254, 255]还是较低碳水化合物饮食（总膳食热量中约 40%或更少来自碳水化合物）[256, 257]。尽管饮食干预历来是面对面进行的，但正如针对糖尿病前期成年人的饮食和生活方式干预研究所表明的那样，在线项目对某些参与者同样有效[258]。因此，低碳水化合物饮食对\
  \ 2 型糖尿病患者的有益结果（血糖控制、体重减轻和降糖药物使用减少）已通过在线项目得到复制，这或许并不令人意外[259, 260]。\n\n### 目标\n\n\
  我们的目标是评估数字化提供的低碳水化合物项目（LCP）的 1 年成效，这是一个以营养为重点、包含十次课程的教育干预项目，旨在帮助 2 型糖尿病成人患者控制血糖和减轻体重。该项目通过行为技巧（包括目标设定、同伴支持和行为自我监控）来强化碳水化合物限制。\n\
  \n### 方法\n\n该研究采用准实验研究设计，包括一项开放标签、单臂、干预前后对比研究，并使用便利样本。\n\n从已加入该项目并拥有完整基线数据集的 2 型糖尿病成人患者中，我们随机选择参与者进行为期\
  \ 1 年的随访（N = 1,000；平均年龄 56.1 岁，标准差 15.7 岁；女性占 59% [593/1,000]；平均 HbA1c 7.8%，标准差\
  \ 2.1%；平均体重 89.6 公斤，标准差 23.1 公斤；平均服用 1.2 种糖尿病药物）。\n\n低碳水化合物项目是一个完全自动化、结构化的 10 周健康干预项目，面向\
  \ 2 型糖尿病成人患者。参与者可以访问以营养为重点的模块，在 10 周内每周开放一个新模块。这些模块旨在帮助参与者逐步将每日总碳水化合物摄入量减少至低于 130\
  \ 克，以实现他们自行选择的目标。该项目鼓励参与者根据每个模块末尾的“行动要点”或行为改变目标来做出行为改变。这些目标通过可下载的资源（包括信息表、食谱和建议的食物替代方案）得到支持。低碳水化合物项目在线平台还包括数字工具，用于提交关于多种不同变量的自我监测和设备驱动数据，包括血糖水平、血压、情绪、睡眠、食物摄入量和体重。根据用户对项目的使用情况，通过电子邮件通知每周提供自动反馈，并在下一周模块开放时通知参与者。课程通过视频、文字内容或不同长度的播客进行教学。\n\
  \n该项目强调参与者在第 1、2 和 10 周与其医疗保健提供者定期联系以调整药物的重要性。在 10 周的模块全部开放后，参与者仍可继续访问教育内容，并能够继续追踪他们的健康状况（血糖控制、体重）。\n\
  \n该项目中使用的内容和策略建立在先前的研究和理论之上。例如，有证据表明，目标设定可以作为一种有效的行为改变策略，用于提高肥胖管理项目中生活方式干预项目的依从性。因此，该项目鼓励参与者在项目开始时选择一个目标（例如减肥、减少药物依赖或为整个家庭做出更健康的选择）。参与者还被提示思考实现目标将如何有益于他们的健康。\n\
  \n在整个项目过程中，参与者会定期被提示思考他们距离实现目标还有多远。该项目通过整合追踪进一步强化行为改变，鼓励项目用户追踪他们的健康数据，包括情绪、食物摄入量、血糖水平、体重、睡眠和\
  \ HbA1c。\n\n根据行为改变的控制理论，监控目标进展——即评估个人相对于标准的持续表现——并做出相应反应，对于实现目标至关重要。最近的研究结果表明，能够提高进展监控频率的项目干预措施很可能诱发行为改变。\n\
  \n### 结果\n\n在 1,000 名研究参与者中，有 708 人（70.8%）报告了 12 个月时的结果，672 人（67.2%）完成了至少 40%的课程，528\
  \ 人（52.8%）完成了项目的所有课程。\n\n在起始 HbA1c 达到或超过 2 型糖尿病阈值 6.5%的 743 名参与者中，有 195 人（26.2%）在未服用降糖药物或仅服用二甲双胍的情况下，将其\
  \ HbA1c 降至阈值以下。\n\n在基线时至少服用一种降糖药物的参与者中，有 40.4%（289/714）减少了一种或多种此类药物。近一半（46.4%，464/1,000）的参与者体重减轻了至少\
  \ 5%。总体而言，血糖控制和体重减轻情况有所改善，尤其是完成了项目所有十个模块的参与者。\n\n例如，基线 HbA1c 升高（≥ 7.5%）且参与了所有十个每周模块的参与者，其\
  \ HbA1c 从 9.2%降至 7.1%（*P* < .001），并且平均体重减轻了 6.9%（*P* < .001）。\n\n\n\n### 观察\n\n\
  *   本研究患者使用的参与平台仅限网页端，而非移动应用。可以预见，移动应用将能提升参与度。\n\n*   本项目的纳入标准为年满 18 周岁且具备英语沟通能力。\n\
  \n*   HbA1c 水平低于 6.5%的患者比例从 26%（257/1,000）上升至 50%（503/1,000）。若通过药物治疗达到此种控制水平，通常伴随体重增加和低血糖事件风险[261]。正如著名的“控制糖尿病心血管风险行动”（ACCORD）研究报告所述，强化降糖药物治疗“增加了死亡率，且并未显著减少主要心血管事件”[262]。\n\
  \n*   本研究的局限性在于完整干预措施的完成率，仅有 528 人（52.8%）完成了所有模块。然而，有较高比例（70.8%）的患者报告了 12 个月的结果。这可能是由于项目于\
  \ 11 月启动，圣诞节和季节性活动影响了完成率。另一方面，鉴于该项目完全自动化且覆盖范围广泛，仍有大量个体得以完成项目。\n\n### 结论\n\n特别是对于完全投入的参与者而言，一项向\
  \ 2 型糖尿病成人患者教授低碳水化合物饮食的在线项目，在血糖控制、体重减轻和减少降糖药物方面是有效的。\n\n## 案例研究 3：为癫痫提供可扩展且高参与度的数字疗法\n\
  \n夏洛特·萨默斯，英国糖尿病数字媒体公司\n\n### 背景\n\n癫痫是一种大脑神经系统疾病。不同类型的癫痫由多种不同的潜在病因引起[263]。病因可能复杂且有时难以确定。一个人可能因以下一种或多种原因开始出现癫痫发作：遗传倾向、大脑结构改变或遗传性疾病[263]。\n\
  \n癫痫有时被称为一种长期疾病，因为患者通常需要与之共存多年甚至终生[264]。虽然癫痫通常无法“治愈”，但对大多数人来说，癫痫发作是可以“控制”（停止）的，从而使癫痫对其生活影响极小或无影响。治疗通常侧重于长期管理癫痫发作。\n\
  \n大多数癫痫患者服用抗癫痫药物（AEDs）来阻止癫痫发作[264]。然而，此类药物可能存在副作用，对于 AEDs 无法控制癫痫发作的患者，还有其他治疗选择，包括生酮饮食（KD）[265]。\n\
  \n本案例研究记录了该组织如何在团队内部阐明机器学习项目构想，以及如何运用循证方法来支持决策，以解决现实世界中的问题。\n\n### 实施循证依据\n\n饮食性酮症及生酮饮食（KD）对人体生理的积极影响和治疗机制已在文献中得到充分记载。KD\
  \ 是一种高脂肪、低碳水化合物（通常低于 50 克/天）、适量蛋白质的饮食[266]，其代谢效应可追溯至 20 世纪 60 年代；然而，KD 的治疗效果可追溯到\
  \ 20 世纪 20 年代初，当时它被成功用于治疗癫痫[267]。\n\n自那时起，多项研究对 KD 的潜在临床应用进行了探索，积累了关于 KD 对各种生理紊乱治疗作用的科学证据。多项研究表明，KD\
  \ 确实能减少或预防许多药物无法控制癫痫发作的儿童的癫痫发作。\n\n超过一半采用该饮食的儿童，其癫痫发作次数至少减少了 50%。一些儿童（通常为 10-15%）甚至不再发作[268]。英国癫痫协会支持将\
  \ KD 作为 12 个月以上患者的治疗选择。研究强调，KD 对癫痫患者的治疗效果主要体现在减少用药和减少癫痫发作。在最近一项关于 KD 效果的 Cochrane\
  \ 系统评价中，Levy 和 Cooper 未发现随机对照试验（RCTs）[269]。\n\n这表明癫痫是可以管理的；在某些情况下，患者通过持续应用生酮饮食方式，可以过上无癫痫发作的生活[270]。通过减少饮食中的糖分并同时改善血糖控制，癫痫患者可以获得显著的健康益处，例如降低癫痫发作风险和减少用药数量[271]。\n\
  \n### 传感器驱动的数字项目\n\n癫痫生酮项目（KPE）是一个针对癫痫患者的结构化教育行为改变项目。KPE 通过提供适当的个性化教育、健康追踪工具、支持、健康指导和资源，帮助用户可持续地采用低碳水化合物生活方式，以维持安全且可持续的生活。因此，癫痫患者有望改善血糖控制，从而减少癫痫发作的发生率，减少药物依赖，并增强管理自身状况的信心。\n\
  \n通过应用程序内的血糖监测、用药监测和癫痫发作追踪模块，实时收集健康数据。可穿戴设备用于收集数据以感知癫痫发作和跌倒。非结构化数据在理解患者情绪和心理方面特别有用。\n\
  \n研究活动持续 12 个月，报告 3 个月、6 个月、9 个月和 1 年时的流行病学健康结果和参与度数据，随后进行 18 个月和 2 年的随访，以证明项目在中短期内的有效性和依从性。\n\
  \n这是全球规模最大、持续时间最长的关于癫痫患者使用数字平台的研究。\n\n### 研究\n\n作为该项目的一部分，我们旨在探索最高效、最有效的方法，以加速向英国国家医疗服务体系（NHS）人群和国际付费方大规模推广我们的技术。该项目由一个屡获殊荣、经验丰富的团队领导，该团队以创新数字健康而闻名，致力于彻底改变全球人民的健康与福祉。\n\
  \n技术挑战在于创建一个可扩展、高参与度且有效的解决方案，以便在全球实施。通过依托 DDM 公司低碳水化合物项目的基础设施，并凭借经过临床验证的结果和一年后 71%的留存率，这一挑战得以缓解。截至撰写本文时，在全球注册参与低碳水化合物项目（针对\
  \ 2 型糖尿病）的 30 万名患者中，有 3,112 名癫痫患者（占英国人口的 0.5%）——这表明针对这一人群开展以营养为重点的在线干预措施的时机已经成熟。\n\
  \n为医疗付费方带来的潜在成本节约影响是巨大的。那些获得赋权、健康状况和福祉得到改善的患者，也会成为社区中更积极的成员，并减少对社会护理的需求。\n\n\n###\
  \ 项目影响\n\n通过赋能患者管理自身癫痫，癫痫患者及其家属将感受到最深远的影响。证据表明，通过生酮饮食（KD），婴儿和成年癫痫患者均能维持该饮食模式，并观察到癫痫发作次数和用药量的改善。同时，证据也显示其对心血管疾病风险有积极影响[272]。由此带来的健康改善和潜在成本节约相当可观。\n\
  \n除了健康改善，该项目对英国经济和国民健康服务体系（NHS）也具有巨大价值，其通过减少并发症、改善心理和情绪健康、降低住院率以及减少用药，直接影响了英国财政部的预算。\n\
  \n患者所经历的积极社会影响，会对更广泛的社区、企业和英国经济产生连锁反应。\n\n由于患者和人群健康状况的改善，各类组织将受益于病假天数减少、缺勤率降低、心理健康改善、感知生活质量提升，以及管理癫痫的感知负担减轻。临床医疗界也感受到了积极影响——这通过减轻医生和医疗专业人员的负担，并增强循证基础来实现。\n\
  \n### 初步分析\n\n本项目研究分支的目标是评估数字化交付的生酮饮食计划的 1 年效果：这是一项以营养为重点、包含 16 次课程的教育干预措施，旨在通过提供生酮饮食来控制癫痫。\n\
  \n该计划通过使用行为技巧（包括设定目标、同伴支持和行为自我监控）来帮助患者达到酮症状态。血糖升高与情绪之间有趣的相关性，使得能够开发预测算法来识别即将发作的癫痫症状，并通过通知提醒患者采取行动。\n\
  \n特别是对于完全投入的参与者而言，一项向成年癫痫患者教授低碳水化合物饮食的在线计划，可有效控制血糖、减轻体重、减少用药和患者癫痫发作次数。\n\n需要进行随机对照试验，以了解此类数字疗法的临床效果。\n\
  \n## 案例研究 4：通过创新使用增强现实和虚拟现实改善初级医生的学习成果\n\n保罗·杜瓦尔，英国利物浦大学\n维迪·泰勒-琼斯，英国利物浦大学\n\n###\
  \ 背景\n\n初级医生满怀服务人类的热情来到大学，但他们往往不知道如何处理高压、危急的场景。恰当地处理医疗问题——无论是否紧急——都需要多年的经验和学习。\n\
  \n随着时间的推移，在医生诊室、医院和诊所的历练，培养了初级医生实现其职业所需的自信、准备和经验。高压场景，例如患者心脏骤停，需要决策和行动达到精准无误。\n\n\
  在初次进入大学后的一段时间内，初级医生尚未准备好做出此类决策。这正是增强现实和虚拟现实提供机会的地方，可以让学生参与学习，为他们未来的医生生涯做好准备。当你成为一名医生时，每个决定都有后果——这对一些人来说可能是一种负担。\n\
  \n更重要的是，每年有 1500 名学生，集体去医院参观既昂贵，后勤管理也困难。\n\n该项目因其开创性而受到认可，获得了医学教育协会（ASME）教育创新奖。\n\
  \n### 目标\n\n该项目的目标有多个：\n\n*   在不使用模拟中心的情况下，增加初级医生接触模拟和培训环境的机会。\n*   让缺乏经验的医生在非关键环境中获得他们所需的经验。\n\
  *   展示有效和无效的临床实践。\n*   鼓励学生反思自己的实践和思维过程。\n*   让学生沉浸在临床学习环境中，并确定使用虚拟现实是否能使他们熟悉医疗环境和患者的不可预测性，并提供应对高压场景的信心。\n\
  \n### 项目描述\n\n大家一致认为该项目应尽可能扩大覆盖范围。这排除了像 HoloLens 或 Oculus 这样的虚拟现实硬件，并将交付重点放在移动设备上。三星\
  \ Gear 和谷歌 Pixel 能够通过使用头戴式设备来扩展视野进入虚拟现实，从而促进内容的交付。考虑到几乎每个学生都拥有手机，而 HoloLens 和 Oculus\
  \ 的使用仍然相对小众，这是合乎逻辑的。\n\n使用 360 度摄像技术拍摄了多种临床场景的模拟，由医生和患者担任演员。这些模拟是 5 到 10 分钟的短视频，其中包含需要学生做出主动选择的决策时刻——包括一名心脏骤停的患者和一名精神分裂症患者变得越来越焦躁不安。\n\
  \n这些视频被集成到一个虚拟现实应用程序中，该应用程序使学生能够在虚拟现实中探索临床环境，融入环境，并鼓励他们在过程中做出各种决策。该应用程序鼓励用户“佩戴”头戴式设备以获得完整的沉浸式体验。\n\
  \n随后，使用该增强现实应用程序教育初级医生的效果与学生一起进行了评估。\n\n### **什么是 360°视频？**\n\n360°视频是一项较新的技术，它使用全向摄像机来捕捉球形视频空间，而不是传统摄影的横向维度。这些视频被拼接在一起，创造出沉浸式的观看体验，将观看者置于场景中的环境内，而不是作为旁观者或“墙上的苍蝇”。观看者能够探索场景，旋转完整的\
  \ 360°。捕捉 360°视频需要专业摄像机。\n\n360°视频的回放最常在移动设备上进行，智能手机屏幕充当了通往 360°环境的窗口。观看者可以物理移动手机来查看\
  \ 360°视频的其他区域——同时控制方向和视角。\n\n可以获得允许将观看者的设备作为头戴式设备佩戴的物理设备，以提供完全沉浸式的体验。台式电脑也可以像移动设备一样播放\
  \ 360°视频。在台式电脑上与 360°视频交互通常需要使用鼠标在环境中移动。基于硬件的头戴式设备也可用于观看 360°视频；然而，考虑到项目的目标，这被认为成本过高。\n\
  \n\n\n### 结论\n\nVR 驱动的教育受到了团队成员、学生和教职员工的热烈欢迎。在经历了使用 360°视频和/或虚拟现实的初始“惊叹”效应后，佩戴头显设备的参与者能够融入周围环境，并参与到\
  \ VR 提供的培训中。\n\n*   虚拟现实模拟为初级医生提供了一个优质且安全的临床环境，供他们探索实践。\n*   特别是，该技术使学生能够专注于错误——从而在全体学生中统一医学处理方法。\n\
  *   该技术使学生能够随时随地学习：在家中、学校或图书馆。\n*   所有拥有合适硬件的医学生都可以使用虚拟现实模拟。\n*   学生在课堂上能够更积极地参与决策。\n\
  *   虚拟现实体验促进了讨论和学习。\n*   与组织学生前往医院病房相比，这种方式成本更低，后勤管理也更简便。\n*   这项创新技术的使用让初级医生为应对职业需求做好了准备。\n\
  *   随着这些工具变得越来越普及，需要研究和探索合适的教学法来支持虚拟现实学习。\n\n沉浸式教育是一种值得进一步探索的交付途径，以改善学生的学习体验、降低成本并进一步推动医疗保健创新。\n\
  \n## 案例研究 5：可穿戴应用对健康结果有影响吗？一项关于其对活动量影响的真实世界服务评估\n\n夏洛特·萨默斯，英国糖尿病数字媒体\n阿琼·帕内萨，英国糖尿病数字媒体\n\
  \n### 背景\n\n与许多发达国家一样，英国与饮食和生活方式选择相关的慢性病发病率正在上升，例如肥胖、2 型糖尿病和心血管疾病[273]。肥胖已被证明是 COVID-19\
  \ 的一个风险因素[274]。支持采用健康生活方式来预防和管理这些及其他长期健康状况的证据非常充分[275]。在英国，新确诊的 2 型糖尿病患者中，参加结构化教育的比例不足十分之一[276]。造成这种情况的原因有很多，包括这些课程安排在工作日，且时间往往不方便[277]。除此之外，参加线下教育项目\
  \ 6 个月后，习得的行为会逐渐消退[278]。通过减少碳水化合物摄入可以改善 2 型糖尿病的管理，这种方法已被证明是实现正常血糖控制和可持续减肥的最有效途径。减肥是改善肥胖和代谢健康状况（如糖尿病前期）自我管理的关键因素[279–281]。\n\
  \n面向患者的数字健康应用（应用程序）提供了改变个人管理自身健康方式的机会，其途径包括更有效地传递健康信息、更好地监测健康指标以及鼓励生活方式的改变。可穿戴设备（及可穿戴应用）已被证明可以增加老年人的活动量，并有助于减肥[282–284]。\n\
  \n过去几年，人们对健康应用潜力的热情迅速高涨，许多 NHS 服务机构现在都在委托开发数字健康应用。虽然健康应用有望增强对从心理健康到高血压、心血管疾病和 2\
  \ 型糖尿病等多种健康状况的护理，但与普及率相比，令人惊讶的是，人们对它们的功能或对健康结果的影响知之甚少。\n\n从现有的数据来看，有迹象表明，一些主要预测使用率的因素，与预测完成率或健康结果的因素并不完全相同，并且很少有健康应用能证明其具有长期依从性[285]或报告长期健康结果。这在一定程度上可能是由于缺乏跨健康应用的数据收集标准[286]。\n\
  \n应评估已被证明能影响行为和健康结果的数字健康应用的功能，以改善健康服务的设计和交付。需要进行研究以扩展先前的健康应用研究，并了解特定应用功能对参与度和健康结果的有效性。先前关于低碳水计划（一个结构化教育和行为改变应用）的出版物证明了其在支持肥胖管理方面的临床有效性，包括具有统计学意义的体重减轻[287]。\n\
  \n患者的行为直接影响其治疗成功与否，医生依赖患者服用处方药物，同时做出并坚持饮食和生活方式的改变。医疗保健领域许多最重大的挑战，特别是长期或慢性疾病（如肥胖和\
  \ 2 型糖尿病）中的挑战，只有在我们能够影响行为并支持可持续的行为改变（以及其他方面，如食品环境）时才能得到解决。\n\n我们对低碳水计划的功能进行了详细审查，并分析了每个应用功能存在的理论基础。本研究旨在评估其中一些应用功能，并了解对这些功能的参与度如何影响健康结果，特别是体重减轻。\n\
  \n肥胖与显著更差的心血管风险因素相关，这表明采取更积极的干预措施来控制体重增加，将有助于应对肥胖给 NHS 带来的日益沉重的负担。无论使用何种减肥干预措施——药物或行为——体重通常都会反弹[288–290]。\n\
  \n通常，减掉的体重在第一年内会恢复一半。体重反弹通常会持续到治疗后的 3 至 5 年；平均而言，80%的人会恢复到干预前的体重或超过该体重[291]。\n\n\
  同样，尝试戒烟和试图减少饮酒的人的复发率也很高[292–294]。\n\n因此，有效的干预措施需要考虑不仅与初始体重减轻相关，而且至关重要的是与维持体重减轻相关的已知因素，例如建立减肥的内在动力、建立社会支持机制、识别应对策略，或为自我效能和自主性提供支持，这些都能增强体重维持效果，这对于任何减肥干预措施的长期成功都至关重要[295]。\n\
  \n### 方法\n\n#### 研究设计\n\n本研究采用准实验研究设计，包括开放标签、单臂、干预前后对照。参与者未因参与而获得报酬；成员由其 NHS 医疗保健专业人员团队转介以访问该计划，并同意对去标识化数据进行分析。各研发委员会确认，由于该研究是一项服务评估，因此无需伦理批准。\n\
  \n该计划可通过运行 iOS 和 Android 的智能手机设备上的应用访问，并配有适用于 Apple Watch 3 及以上版本以及运行 Android 8.0\
  \ 或更高版本且搭载 Wear OS 2.7 或更高版本的 Wear OS 手表（在 Android 智能手表上运行）的配套应用。\n\n#### 参与者\n\n\
  参与者通过其 NHS 医疗保健专业人员招募并转介至该平台。从 2019 年 1 月 1 日至 2019 年 4 月 30 日期间转介至低碳水计划的 2 型糖尿病患者中，共找到\
  \ 200 名用户。对这些人注册后 6 个月的健康和参与度数据进行了分析。所有参与者均来自英国英格兰地区。\n\n\n\n#### 低碳水化合物计划\n\n低碳水化合物计划是一款针对\
  \ 2 型糖尿病、糖尿病前期和肥胖症患者的行为改变应用程序。该应用为 2 型糖尿病、糖尿病前期、肥胖症、代谢综合征、多囊卵巢综合征（PCOS）和非酒精性脂肪性肝病（NAFLD）患者提供经英国国家医疗服务体系（NHS）认证的结构化教育。该计划教导患者在为期\
  \ 12 周的核心实施阶段，将每日饮食中的糖分摄入量减少至 130 克碳水化合物。\n\n该平台允许用户追踪其健康状况（体重、糖化血红蛋白、血糖、饮食、情绪、用药、酮体、胆固醇、血压），通过饮食日记追踪营养摄入，并将应用与可穿戴设备（Apple\
  \ Health、Google Fit、Fitbit、Nokia、Garmin）连接，并提示用户定期进行健康检查。该应用已在 NHS 内部使用，并被证明有助于肥胖症、糖尿病前期和\
  \ 2 型糖尿病患者减轻体重[287]。\n\n该平台为南亚裔（旁遮普语）用户提供母语教育和文化相关的支持，并可在响应式网页、iOS、Android、Apple\
  \ Watch、Android Watch、Alexa 和 VR（Oculus）上使用。\n\n该平台建立在经过同行评审的行为改变架构之上，旨在支持应用内的长期行为改变。其组成部分包括目标设定、定制化教育、社区支持、集成追踪、定制化资源、辅导以及基于行为和健康状况的\
  \ AI 驱动参与。图 10-1 展示了该行为改变架构。\n\n![../images/459335_2_En_10_Chapter/459335_2_En_10_Fig1_HTML.jpg](img/459335_2_En_10_Fig1_HTML.jpg)\n\
  \n图 10-1\n\n低碳水化合物计划中使用的行为改变架构\n\n##### 可穿戴应用：适用于 Apple Watch 和 Wear OS 手表的低碳水化合物计划\n\
  \n低碳水化合物计划的可穿戴应用可在 Apple Watch 和 Android 手表（也称为 Wear OS）上使用。配套的低碳水化合物计划手表应用为佩戴者提供四项功能。\n\
  \n*   **健康追踪：** 配套应用用户可以追踪他们的体重、血糖、情绪、活动、步数、血压和心率。\n\n*   **放松：** 参与者可以选择一段固定的时间来专注于呼吸。智能手表会显示旨在舒缓情绪的动画，并指示何时吸气和呼气。\n\
  \n*   **生活方式：** 参与者可以阅读教育内容，并从每日更新的文章库中将文章发送到他们的手机。\n\n*   **激励：** 配套应用中的一个屏幕，显示随机选取的励志名言，旨在引发反思和目标重新评估。\n\
  \n#### 测量指标\n\n在基线期，即注册智能手机应用时，参与者被要求报告其糖尿病类型、确诊年份、体重、当前用药情况、年龄、性别、饮食偏好、社会经济状况（基于每周食品预算）以及是否患有共病慢性疾病。\n\
  \n在第 3 个月和第 6 个月时，参与者被要求报告他们当前的体重和用药情况以进行重新评估。在可能的情况下，提取了参与者的体重、活动量（步数）和参与度数据。\n\
  \n该研究探讨了在 6 个月时有多少参与者仍保持参与。它还探讨了所有用户各自的活动量、体重减轻情况以及平台参与度。\n\n#### 统计分析\n\n使用 SPSS\
  \ 21.0 版（SPSS Inc.，芝加哥，伊利诺伊州，美国）进行分析。我们进行了多元回归分析，以确定低碳水化合物计划应用功能参与度对体重减轻的预测能力。主要结局指标是参与度、体重和步数。\n\
  \n结局指标还根据参与者完成低碳水化合物计划的情况进行了分层分析（即，完成者：参与了 12 个低碳水化合物计划每周模块中至少 9 个，n=117；部分完成者：参与了\
  \ 4-8 个模块，n=49；未完成者：参与了≤3 个模块，n=34）。\n\n结果考虑了所有样本，无论是否提供随访信息或完成课程。队列中任何激活了账户的患者均被纳入分析。\n\
  \n对于在 6 个月时未报告结局指标的参与者，我们采用了高度保守的方法，即假设他们完全没有改善（末次观测值结转法），将其基线值作为其结局值进行插补。例如，未按要求报告\
  \ 6 个月结局指标的参与者被视为结局变量无变化，因此不计入有任何体重变化。\n\n### 结果\n\n#### 基线期参与者特征\n\n在基线期，平均体重为\
  \ 95.51 公斤（标准差 22.36），平均年龄为 56.86 岁（标准差 10.75）。女性略多于一半（59%，118/200），88%（176/200）为白人，所有参与者均来自英国英格兰。\n\
  \n#### 平台使用与参与度\n\n超过一半的转诊参与者（53%，106/200）在网页上注册。超过一半的参与者（121 人，54%）通过 iOS 设备访问该计划，79\
  \ 人（39.5%）通过 Android 设备访问。少数参与者（1%，2/200）下载了 Alexa 应用。\n\n在通过可穿戴设备（Apple 或 Android\
  \ 手表）追踪活动的 200 名参与者中，84%（168/200）保持参与并在 6 个月时有结局指标（定义为在过去 7 天内主动输入过数据）。对于在 6 个月时失访的\
  \ 32 人，采用末次观测值结转法。\n\n#### 可穿戴设备参与度\n\n对于完成计划的成员，使用配套应用并完成计划的参与者报告体重减轻了 7.38%（7.34\
  \ 公斤，t[116]=10.9247，p<0.001）。\n\n| **状态** | **基线体重（公斤），均值（标准差）** | **6 个月体重（公斤），均值（标准差）**\
  \ | **体重变化（公斤），均值（标准差）** | **体重变化（%），均值（标准差）** | **P 值** |\n| --- | --- | --- |\
  \ --- | --- | --- |\n| **所有参与者（n=200）** | 95.51 (22.36) | 90.43 (20.63) | -5.07\
  \ (6.99) | -4.99 (6.31) | <0.001 |\n| **完成者（n=117）** | 96.96 (23.21) | 89.61 (21.8)\
  \ | -7.34 (7.27) | -7.38 (6.72) | <0.001 |\n| **部分完成者（n=49）** | 96.72 (22.33) |\
  \ 93.51 (19.13) | -3.21 (6.35) | -2.78 (4.39) | .0009 |\n| **未完成者（n=34）** | 88.79\
  \ (18.44) | 88.81 (18.52) | 0.02 (0.44) | 0.02 (0.52) | .8478 |\n\n对于使用配套可穿戴应用并完成计划的\
  \ 117 名参与者，到 6 个月结束时，平均每日步数增加了 54.2%（t116=11.57，P<.0001）。用户在注册应用 6 个月后的平均步数显著更高。\n\
  \n| **状态** | **基线步数（步/天），均值（标准差）** | **6 个月步数（步/天），均值（标准差）** | **步数变化（步/天），均值（标准差）**\
  \ | **步数变化（%），均值（标准差）** | **P 值** |\n| --- | --- | --- | --- | --- | --- |\n| **所有参与者（n=200）**\
  \ | 2988.76 (598.95) | 4318.32 (1624.74) | 1329.56 (1515.61) | 46.5 (52.82) | <0.001\
  \ |\n| **完成者（n=117）** | 2947.86 (571.92) | 4494.02 (1577.88) | 1546.15 (1445.47)\
  \ | 54.2 (47.89) | <0.001 |\n| **部分完成者（n=49）** | 3057.35 (684.04) | 4649.04 (1837.2)\
  \ | 1591.69 (1778.9) | 55.85 (66.63) | <0.001 |\n| **未完成者（n=34）** | 3030.65 (564.1)\
  \ | 3237.1 (883.87) | +206.44 (580.23) | 6.37 (17.5) | .0459 |\n\n\n\n### 讨论\n\n\
  本研究并非随机对照试验，因此无法将 6 个月的结果与对照组或标准治疗组进行比较。然而，在转诊至该平台的 200 名肥胖患者中，84%使用可穿戴设备的患者在 6\
  \ 个月随访时仍保持参与，这支持了先前关于低碳水计划有效性的报告结果。\n\n尽管研究设计不支持对因果关系进行推断，但可穿戴设备的使用与体重减轻之间存在统计学上显著的相关性。\n\
  \n研究发现，完成（>9 个模块）或部分完成（>4 个模块）该计划的成员报告的体重减轻幅度大于未完成计划的成员。\n\n完成计划的成员在 6 个月时体重显著下降了\
  \ 7.38%。基于先前关于 2 型糖尿病患者使用该平台改善血糖控制和维持体重减轻的证据，本研究的结果进一步表明，对于完全投入的参与者而言，通过智能手机和配套应用程序提供的自动化在线计划，教导肥胖成年人采用低碳水饮食并提供按需定制的锻炼方案，可以促进体重减轻。\n\
  \n#### 主要发现\n\n我们最初的假设——患者对可穿戴配套应用程序的参与度可预测其生活方式行为改变——似乎成立。特别是，完成计划并使用可穿戴配套应用程序的参与者实现了显著的体重减轻。\n\
  \n使用平台配套可穿戴应用程序并完成计划的参与者，其体重减轻幅度超过了所有其他分析层级的参与者。使用配套应用程序并完成计划的成员在 6 个月随访时体重减轻超过\
  \ 7%。这些成员的步行量也增加了——6 个月时的步行量比基线时增加了 50%以上。值得注意的是，基线数据是由患者的医疗保健专业人员在转诊时提供的。\n\n然而，后续的健康结果（体重、步数）是通过自我报告和可穿戴追踪器输入的，而非通过临床健康记录进行测量。不过，先前的研究发现，这些自我报告的健康结果可能与实际值相当接近[296,\
  \ 297]。\n\n本研究的一个局限性在于，分析只能将*主动*的配套应用程序功能参与与健康结果相关联。任何特定患者可能进行的一些*被动*参与，虽可被视为应用程序内的参与，但不会被明确追踪。\n\
  \n一个例子是同伴支持社区；对于阅读帖子但不通过提问或回答来积极参与的“潜水者”，这一患者群体可能占数字社区人口的 75%。这可能对采纳生活方式行为改变及后续健康改善的可能性产生显著影响，但这些影响更难监测。\n\
  \n### 结论\n\n本研究旨在评估配套可穿戴应用程序是否有助于减轻体重。使用配套可穿戴应用程序追踪健康的参与者在 6 个月时表现出显著的体重减轻，同时活动水平也有所提高。\n\
  \n这些发现支持了先前的研究，表明可穿戴应用程序可以改善健康结果。应进行进一步分析以探索不同人群之间的差异，特别是不同年龄、性别、种族和社会经济地位是否会影响健康应用程序的参与度及后续健康结果。\n\
  \n## 案例研究 6：大数据，大影响，大伦理：从患者数据诊断疾病风险\n\n多米尼克·奥特罗，Diabetes.co.uk，英国\n\n### 背景\n\n\
  近几十年来，患者数据的多样性和产生速度呈指数级增长。但这些数据并未提升决策的稳健性。这引出了一个问题：为什么决策没有变得更加数据驱动，以及可以采取什么措施来验证并加速其采用。\n\
  \nDiabetes.co.uk 是世界上最大的糖尿病社区，位于华威大学，该平台每年接待超过 4500 万访客。作为全球性的糖尿病社区，该组织提供一系列专注于患者数据生态系统的服务，旨在赋能患者管理和控制自身健康。\n\
  \n通过长期收集患者数据（即真实世界证据），构建了这样一个生态系统，能够针对患者健康的特定方面提供见解、教育和反馈。\n\n### 平台服务\n\n该平台收集了大量数据。从访问平台的那一刻起，就会收集行为和参与度指标，随后患者会注册平台，并选择提供涵盖其糖尿病及整体健康状况的\
  \ 120 多个变量。\n\n进入平台后，会收集多种类型的数据——非结构化数据（如对话、互动、参与和行为）以及结构化数据（如自我报告、设备驱动、可穿戴设备、物联网和临床健康记录数据）。该平台为患者和付费方提供多项服务。\n\
  \n### 药物依从性、疗效与负担\n\n药物依从性、不良反应和浪费是药理学试图克服的问题。糖尿病患者在进入平台时通常至少服用一种药物。\n\n在平台内，患者会定期评估他们的药物，分享他们在现实世界中使用药物的个人看法，并报告更结构化的数据，如副作用、依从性、疗效以及使用药物的负担。这些数据会按地理位置、疾病、药物和其他标记进行映射，并以去标识化的汇总方式反馈给药理学和学术合作伙伴，用于研究目的。\n\
  \n合作伙伴利用这些数据来识别新药，并了解药物相互作用、使用情况、依从性以及真实世界中的不良反应发生率。同样的数据也用于改善患者安全。例如，如果特定药物或设备出现问题或需要召回，平台会向使用这些药物或设备的成员发出警报。\n\
  \n\n\n### 大数据：汇聚人群力量，赋能健康决策\n\nDiabetes.co.uk 社区论坛是全球规模最大的糖尿病患者支持社区，为洞察全球糖尿病群体提供了无与伦比的视角。该平台欢迎所有类型的糖尿病患者、护理人员以及医疗专业人士。其理念很简单：让真实的糖尿病患者分享自身经历，并与处境相似的人交流。患者参与度很高；会员们累计拥有超过\
  \ 200 万年的经验，每次访问平台的平均时长超过 17 分钟。\n\n参与在线健康社区对福祉的影响，主要从成员从社区获得的信息和情感支持，以及此类支持对其健康状况产生的积极影响这两个方面进行研究\
  \ [298, 299]。\n\n社区成员通过分享有助于管理自身健康状况的实用信息来提供和获取信息支持。情感支持则涉及社区成员通过分享自己与疾病共存的挫折与痛苦经历，来寻求相互理解和安慰\
  \ [300]。\n\n同样，并非所有人都对健康社区持积极态度。医疗专业人士之间一直存在争论，焦点在于在线分享信息的质量，以及健康自我管理可能带来的意外后果，尤其是在健康素养较低的人群中\
  \ [301, 302]。\n\n作为一个新颖的数字社区，来自在线论坛的数据和相应见解，以及学术研究成果，会持续在 Diabetes.co.uk 患者支持网络、组织医学顾问委员会、合作伙伴及其他相关网络内部分享。\n\
  \n由伦敦大学皇家霍洛威学院的 Bernardi 和 Wu 进行的第一阶段研究，探讨了在线健康社区在患者自我管理中的作用，评估了以下方面：\n\n*   患者如何评估来自在线健康社区的知识以管理糖尿病\n\
  *   患者的医疗专业人士如何看待这些知识，并可能如何利用这些知识来创新其临床实践\n\nBernardi 和 Wu 开发了一个模型，用于研究 a) 影响在线社区参与度的因素，以及\
  \ b) 在线社区参与度对成员在健康自我管理方面的认知、行为和情感体验的影响。该模型通过对 Diabetes.co.uk 论坛用户进行在线调查进行了实证检验 [303]。\n\
  \n该研究旨在提供一个整体视角，审视管理得当的在线健康社区对患者福祉的影响。\n\n研究得出以下结论：\n\n1.  Diabetes.co.uk 论坛是创新的催化剂。\n\
  2.  Diabetes.co.uk 论坛赋能患者，具体表现为：\n    *   与医疗专业人士建立良好关系\n    *   在管理自身状况方面具有高度信心或自我效能感\n\
  \    *   感觉情感负担减轻\n\n这一点得到了来自 13,000 名患者的数据支持，这些数据凸显了通过使用平台为患者带来的益处：\n\n*   53%\
  \ 的患者血糖控制得到改善\n*   58% 的患者生活质量得到提高\n*   59% 的患者管理糖尿病的信心增强\n*   65% 的患者饮食选择得到优化\n\
  *   76% 的患者对糖尿病的理解加深\n\n### 利用人工智能对患者互动进行优先级排序\n\n为满足监管要求，任何健康平台在发现患者健康或安全问题后必须立即报告。对于像\
  \ Diabetes.co.uk 这样成熟的健康平台，如果完全由人工主导，会因以下几个原因而变得繁琐：\n\n*   监控医疗讨论组和互动需要大量人力来发现监管方面的问题。\n\
  *   如果所有检查都由人工完成，将会浪费大量时间。\n\n为了履行我们的义务，决定使用人工智能机器人来加速这一过程，从而使人类能够将时间花在真正重要的问题上。这是通过开发一个基于神经网络的分类器来实现的，该分类器根据内容、用户资料以及其他关键指标的频率来判断情感倾向和关注点。\n\
  \n该分类系统经历了数百轮验证，从数百万条帖子构成的庞大数据库中提取了一个子集。该分类器能够识别出 99.8%的潜在问题，仅有 0.2%的案例需要人工干预。人工智能优先级排序带来了诸多好处：\n\
  \n*   节省了大量人力时间。\n*   人力被用于处理最受关注的问题。\n*   讨论的标记几乎是实时完成的，而人工标记则需要 15-20 分钟。\n\n\
  这些信息还帮助客户支持团队高效处理用户查询，因为他们能准确了解对话内容、此类查询的典型回复，以及如何与用户沟通以确保各方都能获得有利结果。此外，通过评估并存储用户的情感倾向，未来可以利用这些用户数据构建其他系统。\n\
  \n### 真实世界证据\n\n通过对患者数据的分析，我们可以发现官方健康统计数据与真实世界统计数据之间存在差异。例如，在英国，预计有 14%的糖尿病患者存在心理或情绪健康问题，而该平台显示有\
  \ 44%的用户患有此类健康问题 [304]。这凸显出，为了确保患者护理的关键方面不被忽视，迫切需要进一步探索和了解患者群体。随着时间的推移，合作伙伴对真实世界证据的兴趣日益浓厚，部分原因是对研究资金和利益冲突的担忧。\n\
  \n\n### 预测性分析中的伦理问题\n\n预测性分析使智能分类器能够预测疾病风险。通过收集多样化的患者数据集——包括对话、健康指标、人口统计信息和行为数据——可以开发出用于进一步优化预测的复杂模型。该项目的一个意外后果是在部署一个预测患者罹患胰腺癌风险的\
  \ AI 模型时被发现的。\n\n胰腺癌通常每 1 万人中仅有 1 例发病，且常被误诊。患者往往在确诊时已为时过晚。该胰腺癌 AI 模型利用包含健康指标、参与度和行为数据的临床数据集开发，首先预测患者代谢健康状况不佳的可能性。若患者达到代谢健康不佳的阈值，模型便会评估其罹患胰腺癌的风险。\n\
  \n如何向用户传达这一信息，对该组织而言是前所未有的难题。所有相关利益方，包括医学顾问委员会全体成员，均被要求就此议题提供意见。此前，预测性分析曾用于告知患者可能患有高血压或基于生活方式增加的疾病风险。\n\
  \n然而，告知患者其胰腺癌风险被认为是不道德的，尤其是因为我们不希望引发额外的心理健康问题或焦虑。\n\n应如何告知用户可能改变人生的健康隐患？沟通的关键行动是促使患者尽快就医。此案例中成功的决定因素被确定为“用户摩擦”。用户与沟通方之间的摩擦越小，互动就越成功。\n\
  \n来自行为经济学的利益相关者在测试和确认一种有效的沟通方式方面发挥了关键作用——即告知用户其数据偏离了正常预期范围，同时避免引发恐慌。为此，预测结果被置于患者个人及人群的人口统计与医疗数据背景下进行解读。患者不会被告知自己是唯一出现异常数据的人，而是得到安抚：其他人也曾出现类似模式，并成功改善了健康状况。\n\
  \n### 物联网的整合\n\n可穿戴设备中的传感器，如加速度计、高度计、心率及皮肤温度监测器，能提供海量有用信息。例如，运动、汗液分子和对话都是有用且相关的数据点。这些指标可用于快速评估代谢健康、心血管健康和心理健康。要实现大规模应用，患者与数据提供方之间的摩擦必须降至最低。\n\
  \n用户与其选择共享数据的对象之间的摩擦越小，产品就越成功。可穿戴设备在激励型健康计划中的应用日益广泛。验证患者行为与基本生理状况，有助于实现保费的个性化定制和基于结果的赔付。\n\
  \n患者可以选择将他们的设备和应用程序连接到 Diabetes.co.uk 的架构。有趣的是，年轻用户通常更习惯使用可穿戴设备并觉得操作简单，而老年用户则往往相反。这对保险和激励型健康计划具有重要意义，因为大多数理赔来自年长的保单持有人。\n\
  \n### 结论\n\n精准医疗的实现并非没有技术和伦理挑战。物联网、对话数据及可穿戴数据只是可收集并用于实时赋能患者、促进健康改善的多种数据类型中的几个例子。\n\
  \n数据与 AI 的应用带来了伦理问题，尤其是在预测未来疾病风险方面。随着 AI 能力的成熟，迫切需要建立关于此类议题的流程和治理机制。\n\n## 案例研究\
  \ 7：个性化护理预测性 AI 模型的评估与准确性评价\n\nKelvin Summoogum，MiiCare 创始首席执行官\n\n### 背景\n\n为了向用户提供个性化的医疗健康福利和服务，我们的\
  \ AI 试图学习并解读用户的日常生活活动。这包括与他们在室内的移动轨迹相关的行为模式，以及如厕习惯、起床和入睡时间等常规作息。\n\n这构成了所有预测分析的关键基础，这些分析旨在为独居老人建立情境感知和洞察，并检测需要触发警报的异常活动。\n\
  \n在之前的试验中，我们基于“状态”和“转换”识别异常行为的准确率已超过 90%。当时我们简要讨论了应用贝叶斯学习框架来自动化用户行为预测并实现主动监控能力的潜力。本文中，我们定义了该应用的问题陈述，并概述了为评估拟加入算法库的新预测算法的有效性所采取的贝叶斯方法。\n\
  \n我们基于一组选定用户的数据对该算法进行的初步评估显示，平均预测准确率为 82.2%。该准确率对应于系统需要在 10 分钟窗口内预测用户位置。然而，如果将窗口延长至\
  \ 30 分钟以上，准确率最高可达 93.75%。\n\n随着研究的推进，收集到更多关于受试者的数据，并在更广泛的数据集上训练模型，我们预计 10 分钟窗口的准确率也将提高。此外，我们也在投入精力开发另一种预测方案，该方案使用状态模型进行关键时间预测，无需在线连接。\n\
  \n### 问题陈述\n\nmiiCUBE 网络以传感器触发信号的形式收集移动数据。在每个用户的家中，该网络由安装在每个房间和通道中的专用运动检测传感器组成。\n\
  \n每当用户经过传感器时，网络会记录该活动，包括事件的时间戳和传感器被触发的位置。\n\n在我们之前的论文中，我们概述了如何开发算法和公式，根据一段时间（数天）内收集的传感器数据来可视化用户的日常作息。然而，该方法是静态的，无法考虑用户改变行为或突然做某事的情况。因此，我们需要一种能够实现以下功能的方法：\n\
  \n1.  预测用户在一天中的任何时间点应该在哪里\n2.  突出显示用户未遵循其日常作息的情况\n3.  持续适应因衰老和认知能力下降而在数周至数月内发生的行为细微变化\n\
  \n### 基于期望的建模方法\n\n本节概述了我们如何定义预测窗口的概念，并为每个此类窗口训练一个贝叶斯模型，以获得用户预期所在位置的概率分布。这种方法还使我们能够发现相对于模型而言“意外”的事件，并利用每天收集的新数据持续更新我们的模型。\n\
  \n\n\n#### 预测窗口\n\n早期的研究让我们推断出，单一的预测模型无法以足够高的准确度判断用户在一天中特定时间位于家中的哪个位置。这是因为：\n\n\
  *   一天中会有一些冲动性或情境性的小事件，这些事件并不能反映真实的行为模式。\n*   老年人倾向于在清晨、午后和深夜遵循固定的日常流程。这些是基于任务的例行活动，比如喂猫、吃药、看电视、外出等。但在这些时段之间，他们的行为更难以预测，这主要是由于疾病、身体虚弱或疲劳所致。\n\
  \n为了解决这个问题，我们将一天划分为若干个长度为 n 分钟的时间块或窗口。这个窗口的时长决定了我们对异常行为或事件的敏感度。\n\n如果窗口太大（例如 40\
  \ 分钟），我们将无法及时发送早期通知。相反，如果窗口太小（例如 5 分钟），则会降低预测算法的准确性，导致误报率过高。\n\n因此，设置窗口需要在服务提供商或老年人在紧急情况下可接受的范围内，具备一定的务实性。\n\
  \n#### 多项-狄利克雷模型\n\n假设一个预测窗口为早上 9:00 到 9:15 之间的 15 分钟。如果我们的用户通常在早上 9 点左右起床，那么我们可以预期在卧室和卫生间会有传感器触发。也许，用户上完卫生间后，会去厨房泡杯茶或咖啡。因此，厨房也可能有传感器触发。如果我们只监测这三个位置，我们可以将观察到的传感器触发次数分布可视化，如图\
  \ 10-2 所示。\n\n![../images/459335_2_En_10_Chapter/459335_2_En_10_Fig2_HTML.jpg](img/459335_2_En_10_Fig2_HTML.jpg)\n\
  \n图 10-2\n\n传感器触发次数的示例可视化\n\n这种传感器触发次数的分布是多项分布的一个例子。由于分布值是传感器触发次数，在归一化后，它们直接转化为概率值。\n\
  \n对于一天中的预测窗口 \U0001D461，我们定义了一个多项分布 (\U0001D459\U0001D45C\U0001D450\U0001D44E\U0001D461\
  \U0001D456\U0001D45C\U0001D45B = \U0001D45F)，它告诉我们观察到位置 \U0001D45F 有传感器触发的概率。从图\
  \ 10-2 中，我们可以得出：\n\n*   (\U0001D459\U0001D45C\U0001D450\U0001D44E\U0001D461\U0001D456\
  \U0001D45C\U0001D45B = 卧室) = 20/(20+10+12) = 10/21 ≈ 47.6%，时间在早上 9:00 到 9:15 之间。\n\
  \n狄利克雷分布是对多项分布的一个有力补充：它能够嵌入我们关于用户在一天中任何时间可能位于何处的先验个人知识。在贝叶斯框架中，我们总是从对所讨论事件发生概率的先验知识开始。\n\
  \n例如，从图 10-2 的例子中，我们知道用户在早上 9:00 到 9:15 之间会在卧室，因为他们在这个时间起床。我们通过为参数 \U0001D6FC 定义一个初始信息值来形式化这一知识，其中\
  \ \U0001D6FC[卧室] > 1，而 \U0001D6FC[其他房间] = 1。\n\n参数 \U0001D6FC 的值由狄利克雷分布 (\U0001D6FC\
  ) 定义为：\n\n\U0001D437\U0001D456\U0001D45F(\U0001D6FC) = {\U0001D6FC\U0001D45F } 对于\
  \ \U0001D45F ∈ {所有传感器位置}\n\n它代表了集中度，类似于权重。\U0001D6FC[\U0001D45F] > 1 表示将更高的集中度分配给用户位于位置\
  \ \U0001D45F 的概率，而 \U0001D6FC\U0001D45F = 1 表示无信息、无偏的集中度，即对该特定事件是否发生没有任何特殊知识的状态。\n\
  \n使用狄利克雷分布使我们能够指定用户的某些已知特征，从而为模型增加行为个性化。\n\n对于预测窗口 \U0001D461，我们的多项-狄利克雷分布 (\U0001D6FC\
  )(\U0001D459\U0001D45C\U0001D450\U0001D44E\U0001D461\U0001D456\U0001D45C\U0001D45B\
  \ = \U0001D45F) 告诉我们，在给定初始先验知识的情况下，用户通过触发该位置传感器而位于位置 \U0001D45F 的期望概率。这个定义构成了我们基于期望的预测模型\
  \ \U0001D440\U0001D438 的基础：\n\n\U0001D440\U0001D438 = \U0001D437\U0001D437\U0001D456\
  \U0001D45F(\U0001D6FC\U0001D461)(\U0001D459\U0001D45C\U0001D450\U0001D44E\U0001D461\
  \U0001D456\U0001D45C\U0001D45B = \U0001D45F)\n\n其中：\n\n1.  r ∈ {安装了传感器的房间}\n2. \
  \ t ∈ {一天 24 小时内 n 分钟时间块的序列}\n3.  n = 一个时间块的时长（分钟）\n4.  α[t] = 预测窗口 t 的狄利克雷分布的集中度参数\n\
  \n#### 基于观测数据对多项-狄利克雷模型进行条件化\n\n为了计算 (\U0001D6FC\U0001D461)(\U0001D459\U0001D45C\
  \U0001D450\U0001D44E\U0001D461\U0001D456\U0001D45C\U0001D45B = \U0001D45F)，我们需要计算“训练”期间内每一天在预测窗口\
  \ t 的“观测”多项分布。例如，如果我们将训练期设置为当月 1 日到 7 日，预测窗口为早上 9:00 到 9:15，那么我们必须首先计算该周内每一天、每个位置在该窗口内的传感器触发次数。\n\
  \n计算的结果是一个矩阵，其中每一行是训练期内某一天的传感器触发多项分布，而每一列代表不同的位置。\n\n然后，我们定义一个包含两个分布的贝叶斯模型：(\U0001D6FC\
  ) [用一组先验信息值初始化] 和 (\U0001D6FC)(\U0001D459\U0001D45C\U0001D450\U0001D44E\U0001D461\
  \U0001D456\U0001D45C\U0001D45B = \U0001D45F)。该模型将根据观测数据（即分布矩阵）进行自我条件化。一旦条件化完成（即“训练”完成），它就可以用于生成与输入矩阵维度相同的矩阵，但这些矩阵现在遵循从输入数据中学习到的传感器触发的真实多项分布。\n\
  \n为了计算 (\U0001D6FC)(\U0001D459\U0001D45C\U0001D450\U0001D44E\U0001D461\U0001D456\
  \U0001D45C\U0001D45B = \U0001D45F) 的期望值，我们对生成的矩阵按列求平均，从而得到真实多项分布的一个近似值。\n\n####\
  \ 预测准确度评估\n\n为了评估条件化后的模型 (\U0001D6FC\U0001D461)(\U0001D459\U0001D45C\U0001D450\U0001D44E\
  \U0001D461\U0001D456\U0001D45C\U0001D45B = \U0001D45F) 的性能：\n\n1.  我们计算测试日期上窗口 t\
  \ 的“观测”多项分布，并找出观测传感器触发次数最高的前两个位置 \U0001D43F\U0001D4421, \U0001D43F\U0001D4422。\n\
  2.  我们找出分布 \U0001D437\U0001D6FC\U0001D461 中期望概率最高的前两个位置 \U0001D43F\U0001D4381, \U0001D43F\
  \U0001D4382。\n3.  我们对观测位置和期望位置中概率最高的进行比对，规则如下：\n    1.  如果 \U0001D43F\U0001D442\
  1 = \U0001D43F\U0001D4381 或 \U0001D43F\U0001D4422 = \U0001D43F\U0001D4382，则视为一次好的预测（“命中”）。\n\
  \    2.  如果 \U0001D43F\U0001D4421 ≠ \U0001D43F\U0001D4381，则视为一次差的预测（“未命中”）。\n\n\n\
  \n### 模型评估\n\n在本节中，我们评估预测模型的性能。我们使用了六种不同时长的预测窗口，以便比较由此产生的预测准确率变化。\n\n请注意，出于隐私原因，未披露关于客户的唯一可识别详细信息。\n\
  \n使用的参数值如下：\n\n1.  训练期：2020 年 3 月（31 天）\n2.  测试期：2020 年 4 月第一周\n3.  所有预测窗口 t 和位置\
  \ r 的 \U0001D6FC\U0001D461 = 1（无信息无偏先验）\n4.  预测窗口长度 n = 10、30、60 和 90 分钟\n\n对于每个评估表：1）每一行代表\
  \ 2020 年 4 月第一周中的一天；2）每一列标题代表为该试验选择的预测窗口时长；3）每个单元格的值是“命中率”，其计算方式为模型在某一天做出良好预测的次数。\n\
  \n用户 A 是一位居住在英国、年龄 90 岁以上的老年绅士。他在家中十个位置部署了活动传感器。表 10-1 总结了测试期内每天在不同预测窗口时长下的命中率。我们发现，当使用一个月的数据进行训练并在一周的数据上进行测试时，该模型的预测准确率达到\
  \ 80%。\n\n表 10-1\n评估用户 A 的预测性能\n\n|     | 10 分钟 | 30 分钟 | 60 分钟 | 90 分钟 |\n|-----|-------|-------|-------|-------|\n\
  | **1** | 75.9  | 81    | 81    | 90.4  |\n| **2** | 80.6  | 83.5  | 81.4  | 88.1\
  \  |\n| **3** | 77    | 81.4  | 77.3  | 88    |\n| **4** | 70.5  | 76.5  | 76.5\
  \  | 82.8  |\n| **5** | 76.9  | 77.5  | 81.4  | 82.2  |\n| **6** | 72    | 79.4\
  \  | 77.5  | 82.1  |\n| **7** | 71    | 71.7  | 74.4  | 77.4  |\n| **平均** | 74.8\
  \  | 78.7  | 78.5  | 84.4  |\n\n我们还预期，随着我们预测更远的未来，准确率会出现下降趋势，如图 10-3 所示。阴影区域突出了使用\
  \ 10 分钟和 90 分钟窗口时准确率的差异范围。\n\n![../images/459335_2_En_10_Chapter/459335_2_En_10_Fig3_HTML.jpg](img/459335_2_En_10_Fig3_HTML.jpg)\n\
  \n图 10-3\n用户 A 随时间变化的预测准确率。阴影区域突出了使用 10 分钟和 90 分钟窗口时准确率的差异范围。\n\n用户 B 是一位居住在英国、年龄\
  \ 85 岁以上的老年女士。她的家中安装了六个活动传感器。表 10-2 总结了测试期内每天在不同预测窗口时长下的命中率。对于该用户，我们发现模型的预测准确率为\
  \ 84.4%。\n\n表 10-2\n评估用户 B 的预测性能\n\n|     | 10 分钟 | 30 分钟 | 60 分钟 | 90 分钟 |\n|-----|-------|-------|-------|-------|\n\
  | **1** | 74.2  | 89.17 | 89.2  | 87.5  |\n| **2** | 90.3  | 89.8  | 87.5  | 93.75\
  \ |\n| **3** | 82.8  | 87.5  | 79.2  | 93.75 |\n| **4** | 80.7  | 87.5  | 87.5 \
  \ | 93.75 |\n| **5** | 82.7  | 83.3  | 87.5  | 87.5  |\n| **6** | 77.4  | 85.4 \
  \ | 83.3  | 87.5  |\n| **7** | 76.4  | 77.1  | 80    | 82.5  |\n| **平均** | 80.6\
  \  | 84.3  | 83.4  | 89.4  |\n\n与用户 A 类似，用户 B 也观察到了下降趋势，如图 10-4 所示。阴影区域突出了使用 10\
  \ 分钟和 90 分钟窗口时准确率的差异范围。\n\n![../images/459335_2_En_10_Chapter/459335_2_En_10_Fig4_HTML.jpg](img/459335_2_En_10_Fig4_HTML.jpg)\n\
  \n图 10-4\n用户 B 随时间变化的预测准确率。阴影区域突出了使用 10 分钟和 90 分钟窗口时准确率的差异范围。\n\n### 改进方案\n\n在我们对两位用户的试验中，我们将所有预测窗口的\
  \ α 值设为 1。这代表了模型在未看到任何数据之前的无信息无偏状态。相反，我们可以手动定义一个反映我们对用户在一天中不同时间点存在情况认知的有信息有偏 α 值。这可能是一项繁琐的手动任务，但一旦定义好，就可以减少模型为完全适应自身以得出真实且精确的期望概率所需的数据量。\n\
  \n增加预测窗口的时长可以提高预测准确率；然而，我们的目标是改进模型，使其对 30 分钟窗口的预测准确率超过 90%。考虑到老年人不一定严格遵守日常作息，实现如此高的准确率极具挑战性。不过，随着数据点的增多，预测模型将能够学习到某些触发老年人偏离其日常作息的特定外部因素，例如疾病、药物影响等。\n\
  \n将模型置于养老院或家庭环境的预期使用场景中，模型将预测一个人“应该”在的位置，然后算法会将其与该特定窗口内人的实际位置进行比较。在大多数情况下，一两个 30\
  \ 分钟周期的位置不匹配并不会造成严重后果。\n\n然而，例如，如果我们预测用户将在接下来的 30 分钟（第一个周期）内待在厨房，然后在接下来的 30 分钟（第二个周期）内待在客厅，但系统检测到他们在浴室停留超过\
  \ 30 分钟，那么就会触发警报。同时，系统会监测他们的身体生命体征，如果观察到任何异常情况，也会通知其家人或护理人员。\n\n任何短于 30 分钟的窗口很可能会导致过多的误报，因为老年人的行为模式往往变化很大。话虽如此，任何身体生命体征的异常（例如心率过低）都会立即得到通知。\n\
  \n随着我们 miiCUBE 设备群的扩大，两个重点关注领域是用户持续时间和数据流。\n\n#### 用户持续时间\n\n确定用户必须在同一位置停留多长时间才能触发警报。这目前是一个可由用户/家人/护理人员配置的功能；然而，有了足够的数据点，机器学习模型将能够自动设置这些参数。\n\
  \n#### 数据带宽\n\nmiiCUBE 单元作为一个物联网中心，用于将传感器网络连接到服务器，并且还配备了一个小型板载计算机，用于执行其他功能，例如与老年人进行对话。我们的预测模型如果实施，将部署在服务器上，接收来自\
  \ miiCUBE 的数据用于训练和预测。此工作流程取决于用户所在地区的互联网连接质量。如果此连接长时间中断，网络将失去主动监控紧急情况的能力。\n\n#####\
  \ 下一代模型\n\n我们将探索的下一代预测模型是基于概率图模型的状态和转移模型。这在之前的白皮书中以及本文定义的贝叶斯方法中都有提及。\n\n概率图模型用于基于顺序敏感的数据来表示、建模和推断可能的行动过程。我们使用传感器位置作为“状态”，并将这些位置之间的连接定义为用户在其间移动的路径来定义此类模型。\n\
  \n因此，当用户处于某个位置（“状态”）或处于移动途中（在“状态”之间）时，我们可以隔离并检测到诸如跌倒之类的紧急情况。我们还可以找出用户在一天中的特定时间处于某个状态或处于两个状态之间转移的概率。此类模型可以在\
  \ miiCUBE 本地运行，并且在网络连接不可用时将非常有益，从而维持服务的连续性。\n\n\n\n### 结论\n\n本文采用贝叶斯框架作为 miiCUBE\
  \ 传感器网络的关键预测操作框架。我们定义了一种基于期望的预测方法，其中：\n\n*   对于一天中的每个 n 分钟窗口，存在一个多项-狄利克雷贝叶斯模型。\n\
  *   这些贝叶斯模型以特定于该天窗口的每个位置的传感器触发数据为条件。\n*   这些模型会指出用户在一天中特定窗口期最可能出现的两个位置。\n\n该方法有三个操作参数：训练周期、预测窗口的持续时间，以及为一天中每个窗口选择的\
  \ α 先验值。\n\n模型的预测准确性主要取决于后两个参数，其中：\n\n*   在一个窗口的模型中，预测的相关性与预测的不确定性之间存在权衡。增加窗口持续时间会降低预测的不确定性，但同时也会降低该预测在实时监控中的有用性。\n\
  *   为 α 定义强信息先验值，可以减少模型为得出用户未来位置的精确期望概率所需的条件数据量。\n\n在一项涉及我们两位 miiCUBE 用户的试验中，该方法实现了\
  \ 82.6% 的平均预测准确率。\n\n为了公平比较，两种情况下，训练期和测试期、预测窗口的持续时间以及一天中所有窗口的 α 值均保持不变。该试验已推广至我们所有用户。\n\
  \n## 案例研究 8：语音激活助手能否支持成年人保持自主性——一项关于语音激活智能音箱应用对体重和活动影响的真实世界服务评估\n\n夏洛特·萨默斯，英国糖尿病数字媒体公司\n\
  \n### 背景\n\n定期进行适度的体育锻炼能带来许多生理益处。它能降低疾病风险，也是重病后适当康复的基础[305]。最重要的是，规律活动可以改善生活质量[306]。研究表明，体育锻炼能提高痴呆症及相关认知障碍患者的体能、身体功能、认知功能和积极行为[307]。一项研究发现，游戏系统具有激励作用，并能对老年人群的力量、平衡能力和整体健康产生积极影响[308]。\n\
  \n面向患者的数字健康应用（App）通过更有效地传递健康信息，为改变个人（尤其是老年人）承担和照顾自身健康的方式提供了机会。新的平台和设备能够更好地监测健康指标，并可作为支持和鼓励生活方式行为改变的工具。已有证据表明，应用程序和可穿戴设备能够增强老年患者的活动能力，并有助于减轻体重[309]。\n\
  \n#### 健康应用\n\n过去几年，人们对健康应用潜力的热情迅速高涨，许多全球卫生服务机构都在委托开发数字健康应用。尽管健康应用有望增强对从心理健康到高血压、心血管疾病和肥胖等医学状况等多种健康状况的护理，但令人惊讶的是，人们对其功能或对健康结果的影响知之甚少。在英国，只有\
  \ 15% 的健康应用受到监管机构的正式审查[310]。\n\n养成积极健康的生活方式行为仍然是公共卫生领域的一项挑战，需要创新的解决方案[311]。语音激活助手是一种对话代理，包括亚马逊\
  \ Alexa、苹果 Siri、微软 Cortana 和谷歌助手。这些代理是人机交互计算的一种形式，通过基于声音的输入/输出提供人与计算机之间的交互。这为以新颖的方式吸引受众提供了机会——通过与处理用户语音（唤醒）并返回语句、图像、音频或视频作为输出的代理进行对话。\n\
  \n#### 对话代理\n\n对话代理是一种旨在与人类对话的计算机系统[312]。语音激活助手连接到互联网，监听命令，解释命令并采取行动。\n\n##### 智能音箱\n\
  \n智能音箱是一种音箱和语音命令设备，集成了虚拟的语音激活助手，借助唤醒词提供交互式操作和免提激活功能[313]。智能音箱可以运行第三方应用程序。对于亚马逊 Alexa\
  \ 来说，这被称为技能（Skill）。\n\n##### 语音激活助手\n\n智能音箱或语音助手（如 Alexa、Siri、Cortana 和谷歌助手）的使用量激增，据估计英国至少有五分之一的家庭在使用它们[314]。亚马逊\
  \ Alexa 是最受欢迎的智能音箱设备[315]。研究表明，Alexa 主要用于查看天气预报、播放音乐和控制其他设备[316]。使用亚马逊 Alexa 等设备提供了一种吸引新受众的新机制，并显示出帮助老年人的潜力[317,\
  \ 318]。Alexa 在周末的使用频率高于工作日，但总体使用量往往会随着时间的推移而下降[318]。\n\n用于语音激活助手的健康和健身应用被认为是智能护理的新兴领域，这一点从今年才进行的第一篇文献综述中可以看出[321]。有迹象表明，语音激活助手能够覆盖多样化、服务不足且难以触及的人群。\n\
  \n用户对语音助手的满意度和接受度前景看好，但与智能手机应用相比，语音设备功能非常有限且缺乏证据支持[321]。一项证据综述显示，语音激活助手已被用于提醒人们服药、作为孕期伴侣、帮助寻找问题答案以及提供指导[321]。值得注意的是，有证据表明这些应用的准确性有待提高[320,\
  \ 321]。\n\n语音助手的可访问性、普遍性和便利性，使得语音激活设备（例如智能手机、智能音箱）成为数字健康生态系统的重要组成部分。这种生态系统尤其为患有慢性病的患者所设想[322]。语音助手的预期益处也被认为体现在老年护理和帮助老年人更自主地生活（“智慧养老”）方面[323]。\n\
  \n一项研究发现，使用人工智能语音助手可能是提供可扩展的个性化行为健康指导，以改善癌症幸存者心血管健康的实用方法[324]。\n\n\n\n#### 网络安全\n\
  \n然而，语音助手面临的一个关键阻力领域，特别是如果它们要集成到电子健康记录（EHR）中，就是隐私、网络安全和被利用的真实及感知威胁 [320, 325]。其他人则对其在信息消费、用户画像以及人与技术关系方面可能产生的长期颠覆性影响提出了质疑\
  \ [325, 326]。\n\n有观点认为，智能音箱可以帮助老年人在家中保持更高的自主性 [327, 328]。作为“智能”未来的一部分，智能医疗可以通过多种方式衡量这一点——通过可穿戴设备、联网设备和智能音箱。有大量信号可用于衡量活动量——包括活跃分钟数、活动量、卡路里消耗和步数。\n\
  \n应评估数字健康应用中那些被证明能影响行为和健康结果的方面，以改善健康服务的设计和交付。已有证据表明，人们对新技术的接受度较低，但通过适当的培训，新技术可以在医疗保健中发挥重要作用\
  \ [329, 330]。\n\n需要进行研究来扩展先前的健康应用研究，并了解特定应用功能对用户参与度和健康结果的有效性。\n\n先前关于低碳计划（Low Carb\
  \ Program）的出版物，这是一个结构化的教育和行为改变应用，证明了其在支持肥胖和 2 型糖尿病自我管理方面的临床有效性，包括具有统计学意义的体重减轻、糖化血红蛋白（HbA1c）改善，以及因药物依赖减少而导致的\
  \ 2 型糖尿病缓解 [91]。\n\n已有对低碳计划功能的详细回顾，并分析了每个应用功能存在的理论基础 [16]。2019 年，配套的低碳计划亚马逊 Alexa\
  \ 技能（Amazon Alexa Skill）在 Alexa Echo 和 Echo Show 上推出。该技能使用户能够与 Alexa 对话，观看项目的所有课程、更新体重、更新糖化血红蛋白值、查询食物的营养价值，以及请求按需的锻炼课程、引导式拉伸课程和瑜伽课程\
  \ [331]。\n\n所包含的特征有：使用历史（点击/触摸次数、日期和时间、设备、屏幕尺寸）、年龄、性别、目标、健康状况、用药情况、饮食偏好、过敏史和位置。为降低复杂性，对特征进行了转换，例如对年龄进行分类。\n\
  \n#### 真实世界数字健康评估\n\n作为在网页、移动端、智能手表和语音助手等多个平台上提供低碳计划这一数字健康干预措施的提供方，我们有机会评估语音助手的用户参与度、健康结果及其在真实世界中的影响。\n\
  \n本研究的目的是考察使用低碳计划语音激活智能音箱技能（应用）作为健康管理工具，以支持可持续健康促进行为的参与者的个人特征和健康结果。\n\n### 目标\n\n\
  本研究的目的是考察将对话代理作为健康管理工具纳入其生活方式一部分的参与者的个人特征和活动结果。\n\n### 方法\n\n2020 年 2 月，共有 27 名患有肥胖症、糖尿病前期和\
  \ 2 型糖尿病的患者由其英国国家医疗服务体系（NHS）的医疗专业人员转介至低碳计划。其中 13 名患者还下载了该平台的亚马逊 Alexa 技能。\n\n所有参与者均来自英国英格兰地区。会排除医疗专业人员转介的健康状况包括：肉碱缺乏症（原发性）、肉碱棕榈酰转移酶（CPT）I\
  \ 或 II 缺乏症、肉碱转位酶缺乏症、β-氧化缺陷、中链酰基脱氢酶缺乏症（MCAD）、长链酰基脱氢酶缺乏症（LCAD）、短链酰基脱氢酶缺乏症（SCAD）、长链\
  \ 3-羟基酰基辅酶 A 缺乏症、中链 3-羟基酰基辅酶 A 缺乏症、丙酮酸羧化酶缺乏症、急性卟啉症、精神健康障碍病史或怀孕。\n\n所有用户均被纳入分析。在\
  \ 4 个月的时间里，对来自移动端和配套应用使用的患者健康数据和参与数据进行跟踪、收集和分析，以确定使用 Alexa 技能是否有助于改变健康促进行为。\n\n\
  分析的数据包括人口统计数据（年龄、性别、民族、地点、就业状况）、体重以及在按需课程上花费的分钟数。还对功能的定性反馈进行了评估。\n\n#### 低碳计划\n\n\
  低碳计划是一个基于证据的结构化教育和行为改变自我管理平台。该平台已显示出临床益处，包括体重减轻、药物减少以及支持 2 型糖尿病缓解。该平台建立在基于行为改变心理学的循证架构之上\
  \ [16]。\n\n低碳计划为患有肥胖症、糖尿病前期、2 型糖尿病、代谢综合征、多囊卵巢综合征（PCOS）和非酒精性脂肪性肝病（NAFLD）的患者提供经 NHS\
  \ 批准的结构化教育，内容涉及总体健康，并帮助患者在核心的 12 周实施期内将每日饮食中的糖摄入量减少至 130 克碳水化合物。\n\n参与低碳计划的用户在干预过程中，其活跃分钟数呈上升趋势。为支持这一点，应用中提供了按需活动。按需活动包括由合格私人教练带领的引导式锻炼、瑜伽和拉伸课程。\n\
  \n按需活动在所有应用平台上均可使用，包括亚马逊 Alexa，在这些平台上，活动以视频或音频格式仅以英语呈现给参与者。\n\n##### 语音助手应用：面向 Alexa\
  \ 的低碳计划\n\n低碳计划的亚马逊 Alexa 技能可从亚马逊托管的 Alexa 技能商店下载，或通过对亚马逊 Alexa Echo 或亚马逊 Echo Show\
  \ 智能音箱说“Alexa，启用低碳计划”来调用该技能 [331]。\n\n亚马逊 Echo 仅提供音频输出，而 Echo Show 也提供视频输出。参与者需要将其亚马逊账户与低碳计划账户关联，以便利用该技能为参与者提供的个人资料调用功能。\n\
  \n##### 与 Alexa 技能互动\n\n启用后，通过说“Alexa，询问低碳计划……”后跟一系列命令之一来调用低碳计划亚马逊 Alexa 技能，以开始一项活动：\n\
  \n*   给我一个锻炼。\n*   我想热身。\n*   我想放松。\n*   我想动起来。\n*   给我一个瑜伽。\n*   给我一个训练。\n*   给我一个拉伸。\n\
  \n参与者会在亚马逊 Alexa 技能列表页面以及应用内获知可用的命令。这些命令允许用户与 Alexa 对话，观看项目的所有课程、更新体重、更新糖化血红蛋白值、查询食物的营养价值，以及请求按需的锻炼课程、引导式拉伸课程和瑜伽课程。\n\
  \n深度神经网络推荐系统用于根据当前用户的个人资料和行为对其他资源、活动和教育内容进行预测。该神经网络基于 77,713 人的行为进行训练。提取了包含 105,394\
  \ 条记录的初始数据集。经探索确定，仅使用完全完成的属性集，其余 26,681 个半标记数据集将用于在真实世界中验证模型。\n\n亚马逊 Alexa 技能输出的锻炼分别以引导式音频或引导式视频的形式提供给亚马逊\
  \ Alexa Echo 和亚马逊 Alexa Echo Show。共有 21 项活动可用——7 项瑜伽训练、7 项 HIIT（高强度间歇训练）锻炼训练和 7\
  \ 项拉伸训练。这些训练针对初学者的体能水平进行了定制。\n\n使用亚马逊 Alexa 技能 12 周后，用户会收到一份调查问卷，以征求他们对亚马逊 Alexa\
  \ 技能的意见和反馈。用户有 4 周时间完成反馈调查。\n\n\n\n#### 措施\n\n在基线阶段，即注册应用程序时，参与者需报告其糖尿病类型、确诊年份、体重、当前用药情况、年龄、性别、饮食偏好、社会经济状况（基于每周食品预算）以及是否患有共病慢性疾病。完成注册后，参与者会收到电子邮件通知，告知其可使用亚马逊\
  \ Alexa 技能，并提示下载。\n\n在第 4 个月时，提取了参与者的体重、活跃分钟数和参与度数据（如有）。活跃分钟数定义为“按需锻炼、拉伸或瑜伽课程被打开且未在后台运行的分钟数”。\n\
  \n研究期间计算了总活跃分钟数。使用亚马逊 Alexa 技能的参与者收到了一份调查问卷，以征求其对功能、可用性、易用性和舒适度的反馈。\n\n该研究探讨了有多少参与者下载并使用亚马逊\
  \ Alexa 技能来参与按需课程。同时，还研究了所有用户各自的活跃分钟数、体重减轻情况以及平台持续参与度。\n\n#### 统计分析\n\n使用 SPSS 21.0\
  \ 版（SPSS 公司，美国伊利诺伊州芝加哥）进行分析。我们进行了多元回归分析，以确定低碳水计划应用程序功能参与度对活跃分钟数的预测能力。\n\n主要结果是亚马逊\
  \ Alexa 技能的参与度和下载量以及活跃分钟数。次要结果是健康结果，包括体重减轻。还根据参与者是否下载了低碳水计划亚马逊 Alexa 技能，在分层内对结果进行了分析，比较了技能用户（ASU，已下载亚马逊\
  \ Alexa 技能，n=13）和非技能用户（NSU，未下载亚马逊 Alexa 技能，n=14）。\n\n结果考虑了所有样本，无论其后续信息或课程完成情况如何。\n\
  \n对于未在第 4 个月报告结果的参与者，我们采用了高度保守的方法，即假设他们没有任何改善（末次观测值结转法），将其基线值作为其结果值进行插补。\n\n例如，未遵守报告第\
  \ 4 个月结果的参与者被视为结果变量无变化，因此不计入任何体重变化。\n\n### 结果\n\n对于将账户与 Alexa 技能同步（需要亚马逊账户）的 13\
  \ 名参与者，92%（12/13）在第 4 个月时仍保持参与，并产生了结果，定义为在过去 7 天内主动输入了一项数据。\n\n#### 基线参与者特征\n\n\
  在基线阶段，所有参与者的平均体重为 95.1 公斤（标准差 22.9 公斤），平均年龄为 61.7 岁（标准差 5.7 岁）。使用亚马逊 Alexa 技能的参与者在基线时的平均体重为\
  \ 91.7 公斤（标准差 21.7 公斤）。\n\n五分之二的参与者为女性（40.7%，11/27），超过一半为白人（55.5%，15/27），所有参与者均来自英国英格兰。\n\
  \n#### 平台使用与参与度\n\n近一半（48.1%）的参与者下载了亚马逊 Alexa 技能（13/27）。\n\n在总共 27 名参与者中，24 名（88.9%）在第\
  \ 4 个月时仍保持活跃。85.7%（12/14）的非亚马逊 Alexa 用户在第 4 个月时仍保持参与，而亚马逊 Alexa 用户的这一比例为 92.9%（12/13）（定义为在过去\
  \ 7 天内主动输入了一条数据）。\n\n#### 亚马逊 Alexa 技能使用情况\n\n使用亚马逊 Alexa 技能的参与者记录了 85.82 分钟的活跃分钟数，比未使用该技能的参与者记录的\
  \ 50.86 分钟活跃分钟数增加了 68.9%。\n\n| **状态** | **总活跃分钟数（分钟/天），平均值（标准差）** |\n| --- | ---\
  \ |\n| **所有参与者（n=27）** | 67.74 (28.36) |\n| **技能用户（n=13）** | 85.92 (12.84) |\n|\
  \ **非技能用户（n=14）** | 50.86 (28.61) |\n\n#### 体重\n\n使用亚马逊 Alexa 技能的参与者在整个研究期间平均减重\
  \ 1.77 公斤。\n\n| **状态** | **基线体重（公斤），平均值（标准差）** | **第 4 个月体重（公斤），平均值（标准差）** | **体重变化（公斤），平均值（标准差）**\
  \ | **体重变化（%），平均值（标准差）** | **P 值** |\n| --- | --- | --- | --- | --- | --- |\n| **所有参与者（n=27）**\
  \ | 95.05 (22.94) | 93.66 (22.86) | -1.39 (3.22) | 1.49 (3.43) | 0.557 |\n| **技能用户（n=13）**\
  \ | 91.69 (21.79) | 89.92 (21.68) | -1.77 (2.80) | 2.03 (3.25) | 0.041 |\n| **非技能用户（n=14）**\
  \ | 98.17 (24.45) | 97.14 (24.17) | -1.03 (3.63) | 0.99 (3.63) | 0.308 |\n\n####\
  \ 定性反馈\n\n作为用户体验的一部分，向使用亚马逊 Alexa 技能的参与者发送了一份反馈调查。在 13 名 Alexa 技能用户/参与者中，有 7 人（53.8%）完成了调查。\n\
  \n### 讨论\n\n这不是一项随机对照实验性试验，因此我们无法将第 4 个月的结果与对照组或标准护理组进行比较。然而，在使用低碳水计划 Alexa 技能的\
  \ 13 名参与者中，92.8%在第 4 个月的随访中仍保持参与，这支持了先前报告的低碳水计划参与度结果[91]。\n\n#### 参与度\n\n令人惊讶的是，近一半的参与者下载了\
  \ Alexa 技能，这表明智能音箱的普及度正在上升。医疗保健专业人员并未向所有参与者推荐使用亚马逊 Alexa，因此本研究中的一个未考虑到的偏差是参与者是否拥有亚马逊\
  \ Alexa Echo 或 Echo Show。本研究本质上偏向于那些已经拥有智能音箱的人。如果智能音箱仍被视为一项新兴技术，那么可以合理推断，该干预措施所接触的人群将被视为“早期采用者”。\n\
  \n尽管研究设计不支持对因果关系进行推断，但使用 Alexa 技能的参与者与未使用该技能的参与者记录的总活跃分钟数之间存在统计学上的显著差异。\n\n####\
  \ 总活跃分钟数\n\n在本研究中，Alexa 技能用户记录的总活跃分钟数（85.92 分钟，标准差 12.84 分钟）在统计学上显著高于非技能用户（50.86\
  \ 分钟，标准差 28.61 分钟），t[(25)]=-4.05，p=<0.01。\n\n与未使用 Alexa 技能的参与者相比，使用配套 Alexa 技能的参与者在整个研究期间平均记录了超过\
  \ 30 分钟的活动（按总活跃分钟数定义）。对此有几种可能的解释，包括智能音箱更优化的用户界面以及通过对话检索信息的便捷性。\n\nAlexa 的命令与重复特性似乎很适合参与活动。Alexa\
  \ 技能的使用可能受到了 COVID-19 的影响，当时广大公众在居家保持安全和健康的同时，开始接触并使用数字公共卫生服务，如远程监测。\n\n总活跃分钟数定义为用户在用户界面打开且未在后台运行的情况下，参与按需锻炼、拉伸或瑜伽课程所花费的总分钟数。\n\
  \n结果的准确性可以通过使用可穿戴设备数据来提高总活跃分钟数的精确度。按需课程的播放被用作衡量用户活跃分钟数的代理指标，并根据视频持续播放来假设用户处于参与状态。令人惊讶的是，没有与\
  \ Alexa 配对的用户同时使用智能手表与该应用程序。\n\n根据医疗软件的最佳实践，平台的安全自动注销机制减轻了让按需课程持续播放的可能性。\n\n进一步的研究可以探索使用可穿戴设备和\
  \ Alexa 来提高积极健康行为（如活动时间）的精确度。\n\n\n\n#### 体重减轻\n\n在这项研究中，Alexa 技能用户的体重减轻幅度（-1.77\
  \ 千克，标准差 2.80 千克）大于非技能用户（-1.03 千克，标准差 3.63 千克），t[(25)]=0.59，p=0.56。Alexa 技能用户比非技能用户减重更多。对此有几种可能的解释。\n\
  \n鉴于 Alexa 技能用户记录的总活跃分钟数也更多，可以推测 Alexa 智能音箱的所有者可能本身就偏向于那些对健身感兴趣的人。事实上，在新冠疫情期间使用该应用程序也可能促进了其参与度。\n\
  \n使用低碳计划 Alexa 技能的参与者平均年龄比非 Alexa 用户年长近 5 岁，这支持了其他研究，即语音助手和智能音箱可以帮助老年人更加活跃和自主，并改善社交联系\
  \ [318, 321, 332, 333]。\n\n#### 反馈\n\n在完成评估 Alexa 技能反馈调查的 13 名技能使用参与者中\n\n*   恰好四分之三的参与者（75%）认为设置简单，75%\
  \ 认为使用愉快。\n\n*   四分之三的参与者（75%）对新科技感兴趣。\n\n*   大多数参与者（76.9%）使用该技能进行按需课程或冥想与正念练习。\n\
  \n*   超过三分之一的参与者（38.4%）认为在新科技平台上使用是一种舒适的体验。\n\n*   大多数参与者（84.6%）会向朋友推荐该技能。\n\n*\
  \   超过一半的参与者（53.8%）感到对低碳计划 Alexa 技能负有责任，四分之三（75%）的人因使用它而感觉更活跃。\n\n*   几乎所有参与者（92.3%）都表示希望接受关于如何使用该技能的培训。\n\
  \n这些结果支持了以下证据：老年人群对新科技感兴趣，但在没有适当培训的情况下会感到使用不适。有明确信号表明，参与者期望新科技能提供上手支持。\n\n这项研究为智能护理领域的证据基础做出了贡献。目前评估智能音箱数字健康应用程序使用情况的研究非常少。\n\
  \n该研究基于应用程序平台引发了其他研究问题，包括使用智能手表和增强现实或虚拟现实的其他配套应用程序是否会影响健康状况或与平台的互动。\n\n### 结论\n\n\
  本研究旨在评估使用低碳计划 Alexa 技能是否有助于改善积极的健康行为。使用 Alexa 技能的参与者在总活跃分钟数上有所改善。\n\n研究结果支持了先前的研究，即语音助手应用程序可以改善健康结果。使用\
  \ Alexa 技能的参与者更有动力尝试创新技术，年龄较大，并渴望通过培训来克服舒适度低的问题。应进行进一步分析以探索不同人群之间的差异，特别是不同年龄、性别、种族和社会经济地位是否会影响参与度及随后的健康结果。\n\
