  xmltodict==0.12.0\nzc.lockfile==2.0\n```\n\n## 数据\n\n如图 10-1 所示，任何机器学习流水线都始于数据提取。鸢尾花物种数据集是我们机器学习流水线的输入。鸢尾花数据集是一个多变量数据集，由英国统计学家和生物学家罗纳德·费舍尔在他\
  \ 1963 年的经典论文中提出。该数据集可从 OML 数据库获取。你也可以从加州大学信息与计算机科学学院机器学习库[`http://archive.ics.uci.edu/ml`](http://archive.ics.uci.edu/ml)下载。\n\
  \n该数据集包含三种鸢尾花物种，每种有 50 个样本。数据包含多个列，记录了每朵花的其他属性。在我们的示例中，我们构建了一个分类模型来预测花的种类。\n\n现在我们已经搭建好了开源组件（TFDV\
  \ 和 DVC）并下载了输入数据（鸢尾花），接下来我们将演示如何实现机器学习流水线的功能，如数据验证、模型监控和实验跟踪（见图 10-1）。\n\n## 数据验证与模型监控实现\n\
  \n我们的机器学习流水线集成了开源包以实现自定义功能。本节将介绍基于 TensorFlow 数据验证（TFDV）包的数据验证和模型监控实现。\n\n如图 10-1\
  \ 所示，自动化机器学习流水线接收输入数据集。随着数据集被处理并经过每个步骤，会生成更多的中间数据、特征集、预测结果、评估指标和评分，这些数据被存储在模型注册表中（位于图\
  \ 10-1 中的 OML 服务器内）。TFDV 通过检测输入数据中的模式或分布偏移来支持数据验证。类似地，模型监控通过使用 TFDV 检查连续时间范围内的历史特征和预测结果来实现。\n\
  \n### TensorFlow 数据验证（TFDV）\n\n通过`pip install`安装开源组件后，即可导入`tensorflow_data_validation`模块。如下面的\
  \ Python 代码所示，TFDV 可以基于任何 Pandas 数据框生成模式和统计信息。通过将新数据框与从现有数据框推断出的模式和统计信息进行比较，可以检测出异常。\n\
  \n```\nimport numpy as np\nimport pandas as pd\nimport os\nimport tensorflow_data_validation\
  \ as tfdv\nfrom config import Config\nConfig.ANOMALIES_PATH.mkdir(parents=True,\
  \ exist_ok=True)\nConfig.ORIGINAL_DATASET_FILE_PATH.parent.mkdir(parents=True, exist_ok=True)\n\
  Config.DATASET_PATH.mkdir(parents=True, exist_ok=True)\ndef generateSchema(input_file,\
  \ schema_file):\nassets=pd.read_csv(input_file,low_memory=False)\nassets_stats=tfdv.generate_statistics_from_dataframe(assets)\n\
  assets_schema=tfdv.infer_schema(assets_stats)\ntfdv.write_schema_text(assets_schema,\
  \ schema_file)\ntfdv.display_schema(assets_schema)\nreturn tfdv.load_schema_text('assets_schema')\n\
  def getAnomalies(df, expected_df, anomalies_file):\nassets_stats=tfdv.generate_statistics_from_dataframe(df)\n\
  assets_schema=tfdv.infer_schema(assets_stats)\nexpected_assets_stats=tfdv.generate_statistics_from_dataframe(expected_df)\n\
  expected_assets_schema=tfdv.infer_schema(expected_assets_stats)\nanomalies=tfdv.validate_statistics(assets_stats,expected_assets_schema)\n\
  tfdv.write_anomalies_text(anomalies, anomalies_file)\ntfdv.display_anomalies(anomalies)\n\
  return tfdv.load_anomalies_text('anomalies')\n```\n\n\n\n### 数据验证\n\n数据验证在数据提取后立即进行，其目的是确保输入数据符合预期的模式。以下是示例代码。\n\
  \n```\niris_df = pd.read_csv(str(Config.ORIGINAL_DATASET_FILE_PATH))\niris_drift_df\
  \ = pd.read_csv(str(Config.ORIGINAL_DATASET_DRIFT_FILE_PATH))\ngetAnomalies(iris_drift_df,\
  \ iris_df, str(Config.ANOMALIES_PATH / \"anomalies_data_drift.json\"))\n```\n\n\
  图 10-4 展示了输入数据中数据变化的示例。原始鸢尾花数据集包含三个不同的标签：Iris-setosa、Iris-versicolor 和 Iris-virginica。为了模拟数据中的显著变化，我们特意将一个标签从\
  \ Iris-setosa 改为 Iris-setosaaaa。\n\n![../images/499897_1_En_10_Chapter/499897_1_En_10_Fig4_HTML.jpg](img/499897_1_En_10_Fig4_HTML.jpg)\n\
  \n图 10-4\n\n输入数据中的概念漂移示例\n\n输出结果是 anomalies_data_drift.json 文件。如图 10-5 所示，数据验证过程首先基于原始数据集生成一个基线模式。在该模式中，“species”列包含三个值：Iris-setosa、Iris-versicolor\
  \ 和 Iris-virginica。由于 iris_drift_df 数据框中的拼写错误，第四个值 Iris-setosaaaa 在 anomaly_info\
  \ 块中被标记为错误。\n\n![../images/499897_1_En_10_Chapter/499897_1_En_10_Fig5_HTML.jpg](img/499897_1_En_10_Fig5_HTML.jpg)\n\
  \n图 10-5\n\n数据验证结果：检测到的异常\n\n### 模型监控\n\n模型监控可以在模型服务之前进行。其目的是确保新数据与用于模型训练的数据相似。以下示例将鸢尾花数据集拆分为训练集和测试集，然后比较这两个数据集。\n\
  \n```\ntrain_df = pd.read_csv(str(Config.DATASET_PATH / \"train.csv\"))\ntest_df\
  \ = pd.read_csv(str(Config.DATASET_PATH / \"test.csv\"))\ndef extract_features(df):\n\
  return df[[\"sepal_length\", \"sepal_width\", \"petal_length\", \"petal_width\"\
  , \"species\"]]\ntrain_set = extract_features(train_df)\ntest_set = extract_features(test_df)\n\
  getAnomalies(train_set, test_set, str(Config.ANOMALIES_PATH / \"anomalies_train_test.json\"\
  ))\n```\n\n生成的 anomalies_train_test.json 文件不包含 anomaly_info 块，这表明不存在训练/测试数据漂移。\n\
  \n## 跟踪与重现机器学习流水线\n\nTFDV 可以检测任何数据/特征/预测集中的变化。然而，并非所有数据变化对模型的影响都相同。模型监控必须考虑数据之外其他领域的变化。例如，源代码和训练参数的变化可能需要重启部分或整个机器学习流水线。\n\
  \n本节演示了如何使用数据版本控制（DVC）实现变更跟踪和机器学习流水线的重现。借助 DVC，我们可以定义和自定义机器学习流水线各步骤之间的依赖关系。这种依赖关系会驱动并触发从上游最近发生变化的步骤开始重启机器学习流水线。\n\
  \n### 数据版本控制（DVC）\n\nDVC 是一款开源的数据版本管理、工作流和实验管理软件（[`https://dvc.org`](https://dvc.org)）。DVC\
  \ 在 Git 仓库之上运行，为数据和模型工件提供版本控制，并使机器学习流水线实验可重现。\n\n机器学习流水线由一系列阶段组成，通常从原始数据提取开始，经过中间的特征工程和模型训练阶段，生成训练好的模型和指标，并包含漂移监控。\n\
  \n通过命令行界面（dvc run），用户可以定义一个机器学习流水线阶段。流水线定义文件（dvc.yaml）可以包含以下字段。图 10-15 展示了一个 dvc.yaml\
  \ 流水线定义。\n\n*   `cmd`：在此阶段要执行的命令\n*   `wdir`：阶段命令运行的工作目录（相对于 dvc.yaml 文件的位置）\n*\
  \   `deps`：依赖的文件或目录路径（相对于 wdir）\n*   `params`：从文件（默认为 params.yaml）中读取的参数依赖字段名称\n\
  *   `outs`：输出的文件或目录路径（相对于 wdir）\n*   `metrics`：指标文件\n*   `plots`：绘图指标\n*   `frozen`：此阶段是否被冻结，不参与重现\n\
  *   `always_changed`：此阶段是否被诸如 `dvc status` 和 `dvc repro` 等命令视为已更改。默认为 false\n\n\
  ### 对代码、数据和模型文件进行版本控制\n\n图 10-6 中的机器学习流水线定义及其状态存储在一对元文件中：dvc.yaml 和 dvc.lock。这些元文件很小，它们与源代码一起被添加到\
  \ Git 仓库中。数据集、特征、参数、指标、模型和工件等大文件和目录则使用 DVC 内置的缓存进行存储，并与各种远程存储同步。\n\n![../images/499897_1_En_10_Chapter/499897_1_En_10_Fig6_HTML.jpg](img/499897_1_En_10_Fig6_HTML.jpg)\n\
  \n图 10-6\n\nDVC 中的代码和数据流\n\n### 实际机器学习流水线演示\n\n在我们的示例中，机器学习流水线源代码的入口点是一个名为 oml-pipeline\
  \ 的 Python 项目，如图 10-7 所示。该流水线在以下文件中实现了数据科学步骤。\n\n```\npipeline/data_extraction.py\n\
  pipeline/feature_engineering.py\npipeline/model_training.py\npipeline/model_evaluation.py\n\
  pipeline/model_monitoring.py\nore_client.R\n```\n\n注意\n\n在 model_training.py 和 model_evaluation.py\
  \ 中，模型训练和模型评估是通过 ore_client.R 脚本在 OML 中实现的。\n\n如第 9 章所述，OML 将鸢尾花数据集、特征、指标和评分存储在\
  \ Oracle 数据库中。然而，为了实现模型自动重新训练，我们希望自定义依赖关系、变更跟踪，并最终决定何时以及如何重启机器学习流水线。\n\n让我们深入一个简单的机器学习流水线，演示启用流水线变更跟踪是多么容易，以及多个阶段的变更如何触发自定义的流水线重启。\n\
  \n#### 使用 Git 和 DVC 初始化与配置的机器学习流水线项目\n\n首先，让我们将目录切换到机器学习流水线项目的根目录，并运行图 10-7 中所示的\
  \ `git` 命令。\n\n![../images/499897_1_En_10_Chapter/499897_1_En_10_Fig7_HTML.jpg](img/499897_1_En_10_Fig7_HTML.jpg)\n\
  \n图 10-7\n\nGit 初始化与代码签入\n\n接下来，我们运行 `dvc init` 为项目初始化 DVC，运行 `dvc remote add` 将默认的\
  \ DVC 远程存储指定为本地目录，并运行 `dvc config` 关闭匿名使用统计（core.analytics false）。\n\n![../images/499897_1_En_10_Chapter/499897_1_En_10_Fig8_HTML.jpg](img/499897_1_En_10_Fig8_HTML.jpg)\n\
  \n图 10-8\n\nDVC 初始化与配置\n\n生成的 DVC 配置会自动保存在流水线项目下 .dvc 目录中的 config 文件中。\n\n![../images/499897_1_En_10_Chapter/499897_1_En_10_Fig9_HTML.jpg](img/499897_1_En_10_Fig9_HTML.jpg)\n\
  \n图 10-9\n\n自动生成的 DVC 配置文件\n\n\n\n#### 使用 DVC 定义和记录依赖关系\n\n在 DVC 中，一个阶段通过要执行的命令、数据输入/输出、相互依赖关系以及结果来描述。`dvc\
  \ run` 是用于创建和更新流水线阶段的辅助命令。DVC 流水线中的每个阶段都依赖于其之前的所有阶段。以下是机器学习流水线的五个阶段。\n\n1.  提取（数据提取）\n\
  \n2.  特征（特征工程）\n\n3.  训练（模型训练）\n\n4.  评估（模型评估）\n\n5.  监控（模型监控）\n\n图 10-10 至 10-14\
  \ 展示了一系列用于定义这五个阶段的 `dvc run` 命令。\n\n![../images/499897_1_En_10_Chapter/499897_1_En_10_Fig14_HTML.jpg](img/499897_1_En_10_Fig14_HTML.jpg)\n\
  \n图 10-14\n\n使用 dvc run 定义模型监控阶段\n\n![../images/499897_1_En_10_Chapter/499897_1_En_10_Fig13_HTML.jpg](img/499897_1_En_10_Fig13_HTML.jpg)\n\
  \n图 10-13\n\n使用 dvc run 定义模型评估阶段\n\n![../images/499897_1_En_10_Chapter/499897_1_En_10_Fig12_HTML.jpg](img/499897_1_En_10_Fig12_HTML.jpg)\n\
  \n图 10-12\n\n使用 dvc run 定义模型训练阶段\n\n![../images/499897_1_En_10_Chapter/499897_1_En_10_Fig11_HTML.jpg](img/499897_1_En_10_Fig11_HTML.jpg)\n\
  \n图 10-11\n\n使用 dvc run 定义特征工程阶段\n\n![../images/499897_1_En_10_Chapter/499897_1_En_10_Fig10_HTML.jpg](img/499897_1_En_10_Fig10_HTML.jpg)\n\
  \n图 10-10\n\n使用 dvc run 定义数据提取阶段\n\n首次执行 `dvc run` 命令行时，会在工作目录中自动生成一对阶段跟踪文件：`dvc.yaml`\
  \ 和 `dvc.lock`。要使用 Git 跟踪阶段变更，请运行以下命令。\n\n```\ngit add dvc.yaml dvc.lock\n```\n\n\
  在后续每次调用 `dvc run` 或 `dvc run` 之后，`dvc.yaml` 和 `dvc.lock` 都会被更新，以记录流水线中的变更。图 10-15\
  \ 和图 10-16 分别展示了使用 `dvc.yaml` 和 `dvc.lock` 文件表示的流水线当前状态。此状态反映了在运行图 10-10 至 10-14\
  \ 中定义这五个阶段的一系列 `dvc run` 命令之后的流水线状态。\n\n![../images/499897_1_En_10_Chapter/499897_1_En_10_Fig16_HTML.jpg](img/499897_1_En_10_Fig16_HTML.jpg)\n\
  \n图 10-16\n\n自动生成并自动更新的机器学习流水线状态 (dvc.lock)\n\n![../images/499897_1_En_10_Chapter/499897_1_En_10_Fig15_HTML.jpg](img/499897_1_En_10_Fig15_HTML.jpg)\n\
  \n图 10-15\n\n机器学习流水线定义 (dvc.yaml)\n\n#### 使用 DVC 跟踪和复现机器学习流水线\n\n如图 10-17 所示，一旦生成的\
  \ `dvc.yaml` 和 `dvc.lock` 文件被添加到 Git 仓库中，流水线阶段的所有元素（输入/输出、相互依赖关系、文件、目录、数据集、模型、指标等）的变更都会被\
  \ DVC 跟踪。从此刻起，DVC 可以复现流水线的任何版本。\n\n![../images/499897_1_En_10_Chapter/499897_1_En_10_Fig17_HTML.jpg](img/499897_1_En_10_Fig17_HTML.jpg)\n\
  \n图 10-17\n\n使用 Git 跟踪并标记流水线的当前状态\n\n图 10-18 显示了当前的指标。\n\n![../images/499897_1_En_10_Chapter/499897_1_En_10_Fig18_HTML.jpg](img/499897_1_En_10_Fig18_HTML.jpg)\n\
  \n图 10-18\n\n显示当前模型指标\n\n图 10-17 中的 `git commit` 命令跟踪了流水线阶段的当前状态。`git tag -a` 命令添加了一个\
  \ `rf-pipeline` 标签，该标签引用了流水线变更历史中的一个特定点。如图 10-18 所示，`dvc metrics show -T` 命令显示了模型评估指标。\n\
  \n现在我们已经标记了流水线，实际上就为跟踪未来的变更建立了一个“基线”。\n\n#### 示例跟踪用例\n\n跟踪机器学习流水线的典型用例包括由输入数据变化引起的模型漂移（见图\
  \ 10-4）以及在流水线实验期间切换算法（见图 10-19）。\n\n数据集的变化（见图 10-4）会被 DVC 检测到，因为我们将该文件指定为两个流水线阶段（特征工程和模型监控）的依赖项。\n\
  \n图 10-19 展示了 DVC 跟踪的另一个流水线变更示例。在模型训练代码中，我们可以在随机森林回归和线性回归之间切换分类算法。由于模型训练代码（`model_training.py`）是训练阶段定义的一部分，因此在流水线复现期间，算法的变更会被\
  \ DVC 标记出来。\n\n![../images/499897_1_En_10_Chapter/499897_1_En_10_Fig19_HTML.jpg](img/499897_1_En_10_Fig19_HTML.jpg)\n\
  \n图 10-19\n\n模型训练算法变更示例：在随机森林回归和线性回归之间切换\n\n#### 复现机器学习流水线：一个示例\n\n本节演示了 DVC 如何利用模型算法跟踪信息来优化流水线复现。\n\
  \n##### 步骤 1：更新流水线并使用 Git 跟踪变更\n\n在此示例中，流水线的唯一变更是将分类算法从随机森林回归切换为线性回归。使用此变更更新 `model_training.py`\
  \ 后，保存它。\n\n##### 步骤 2：从评估阶段开始复现流水线\n\n`dvc repro <stage>` 命令允许用户指定要复现的流水线阶段。在这种情况下，更新训练算法后，我们希望查看指标（由模型评估阶段产生）。\n\
  \n在图 10-20 中，DVC 被要求从模型评估阶段开始复现机器学习流水线。借助跟踪信息，DVC 发现模型训练阶段已发生变更。根据流水线定义的相互依赖关系，数据提取和特征工程阶段未受影响。因此，可以跳过它们。然后，DVC\
  \ 自动运行模型训练和模型评估阶段。图 10-20 还显示了复现后的结果指标。\n\n此示例表明，无论变更的类型或位置如何，我们都可以自动化协调机器学习流水线的所有方面。\n\
  \n![../images/499897_1_En_10_Chapter/499897_1_En_10_Fig20_HTML.jpg](img/499897_1_En_10_Fig20_HTML.jpg)\n\
  \n图 10-20\n\n可复现的机器学习流水线\n\n\n\n#### 代码与流水线工件的独立存储位置\n\n如图 10-6 所示，代码和流水线工件是分开存储的。图\
  \ 10-21 展示了 Git 中追踪的源代码变更。图 10-22 展示了存储在 Git 中的 DVC 元文件。图 10-23 展示了保存在 DVC 内置缓存中的其他工件。\n\
  \n![../images/499897_1_En_10_Chapter/499897_1_En_10_Fig23_HTML.jpg](img/499897_1_En_10_Fig23_HTML.jpg)\n\
  \n图 10-23\n\n在 DVC 内置缓存中追踪的 ML 流水线工件\n\n![../images/499897_1_En_10_Chapter/499897_1_En_10_Fig22_HTML.jpg](img/499897_1_En_10_Fig22_HTML.jpg)\n\
  \n图 10-22\n\nML 流水线状态变更作为 Git 中 dvc.lock 的一个版本进行追踪\n\n![../images/499897_1_En_10_Chapter/499897_1_En_10_Fig21_HTML.jpg](img/499897_1_En_10_Fig21_HTML.jpg)\n\
  \n图 10-21\n\n源代码变更作为 Git 中 model_training.py 的一个版本进行追踪\n\n#### ML 流水线的可视化\n\n`dvc\
  \ dag` 命令可以提供 ML 流水线的简单可视化。图 10-24 展示了该命令输出的一个示例。\n\n![../images/499897_1_En_10_Chapter/499897_1_En_10_Fig24_HTML.jpg](img/499897_1_En_10_Fig24_HTML.jpg)\n\
  \n图 10-24\n\n将 ML 流水线可视化为连接阶段的图\n\n## OML4R 故障排除提示\n\n本节介绍 OML4R 配置过程中可能出现的几个常见问题。更多信息请参阅“环境”部分。\n\
  \n### 连接到 Oracle 数据库时出错（以 oml_user 身份）\n\n在我们的演示环境中安装好 OML4R 客户端和服务器后，我们通过以下函数调用加载了\
  \ OML4R 库，以验证 OML4R 的基本功能是否正常。\n\n```\n> library(ORE)\n```\n\n接下来，我们以 OML_USER 身份建立了与\
  \ OML4R 服务器的连接。\n\n```\nore.connect(user=\"oml_user\", sid=\"k19c\", host=\"kaidb\"\
  , password=\"oml_userpsw\", port=1521, all=TRUE)\n```\n\n最初，我们遇到了以下错误信息。\n\n```\n\
  Error in .oci.GetQuery(conn, statement, data = data, prefetch = prefetch,  :\nORA-28578:\
  \ protocol error during callback from an external procedure\nORA-06512: at \"RQSYS.RQEVALIMPL\"\
  , line 17\nORA-06512: at \"RQSYS.RQEVALIMPL\", line 14\nORA-06512: at line 4\n```\n\
  \n该错误是由于 Oracle extproc 代理不允许 OML4R 所需的外部过程调用引起的。我们通过编辑 `ORACLE_HOME/hs/admin/extproc.ora`\
  \ 文件中的 `EXTPROC_DLLS` 环境变量解决了这个问题。\n\n#### 解决方案\n\n在服务器端执行以下操作。\n\n1.  在 `$ORACLE_HOME/hs/admin/extproc.ora`\
  \ 中设置 `EXTPROC_DLLS=ANY`。\n\n2.  重启数据库。\n\n### 构建模型时因缺少包而报错\n\n建立与 OML 服务器的连接后，我们尝试了一些简单的函数调用，例如将并行进程数设置为全局选项。\n\
  \n> options(ore.parallel=8)\n\n当我们调用 `ore.randomForest` 函数来加载训练数据的副本并构建随机森林模型时，该函数调用导致了以下错误信息。\n\
  \n```\n> mod <- ore.randomForest('default.payment.next.month~LIMIT_BAL+AGE+PAY_0+PAY_2+PAY_3+PAY_4+PAY_5+PAY_6',\
  \ data = UCI_Credit_Card.train, na.action = na.exclude)\nError in .oci.GetQuery(conn,\
  \ statement, data = data, prefetch = prefetch,  :\nError in try({ : ORA-12801: error\
  \ signaled in parallel query server P001\nORA-20000: RQuery error\nError in .ore.embed.initCairo(pngargs,\
  \ imglst.name) :\nThe package 'Cairo' is required\nORA-06512: at \"RQSYS.RQGROUPEVALIMPL\"\
  , line 121\nORA-06512: at \"RQSYS.RQGROUPEVALIMPL\", line 118\n```\n\n该消息似乎表明所需的\
  \ Cairo 包存在问题。我们按照 Oracle 文档（[`https://docs.oracle.com/cd/F35732_01/oread/oracle-machine-learning-r-installation-and-administration-guide.pdf`](https://docs.oracle.com/cd/F35732_01/oread/oracle-machine-learning-r-installation-and-administration-guide.pdf)）中的“验证\
  \ Cairo 和 png 依赖项”部分安装了 Cairo 和 .png 包，但错误仍然存在。\n\n最后，我们通过直接加载 Cairo 库找到了问题所在。\n\
  \n```\n> library('Cairo')\nError : .onLoad failed in loadNamespace() for 'Cairo',\
  \ details:\ncall: dyn.load(file, DLLpath = DLLpath, ...)\nerror: unable to load\
  \ shared object '/usr/lib64/R/library/Cairo/libs/Cairo.so':\nlibtiff.so.3: cannot\
  \ open shared object file: No such file or directory\nError: package or namespace\
  \ load failed for ‘Cairo’\n```\n\n因此，根本原因是所需的共享库：`libtiff.so.3`。我们通过在 OML4R 客户端和服务器端运行以下命令解决了该问题：\n\
  \n#### 解决方案\n\n```\n[root@kaidb downloads]# rpm -i compat-libtiff3-3.9.4-11.el7.x86_64.rpm\n\
  [root@kaidb downloads]# rpm -qa | grep libtiff\ncompat-libtiff3-3.9.4-11.el7.x86_64\n\
  libtiff-4.0.3-27.el7_3.x86_64\n[root@kaidb downloads]# rpm -ql compat-libtiff3-3.9.4-11.el7.x86_64\n\
  /usr/lib64/libtiff.so.3\n/usr/lib64/libtiff.so.3.9.4\n/usr/lib64/libtiffxx.so.3\n\
  /usr/lib64/libtiffxx.so.3.9.4\n```\n\n我们还通过使用 `library(xxx)` 函数显式加载它们来验证了其他必需的包。\n\
  \n```\n>library(Cairo)\n> library(arules)\nLoading required package: Matrix\nAttaching\
  \ package: 'arules'\nThe following objects are masked from 'package:base':\nabbreviate,\
