  \ Pod，并配置它们相互通信。\n\n## 总结\n\n本章概述了主要的机器学习平台。它解释了 Oracle 机器学习组件如何支持 ML 流水线的各个阶段。\n\
  \n*   数据提取\n\n*   数据准备\n\n*   特征工程\n\n*   模型训练\n\n*   模型评分\n\n*   模型管理/存储库\n\n我们介绍了多种\
  \ OML API，例如 OML4R、OML4Py、OML4SQL 和 OML4Spark。我们解释了如何使用这些 API 将第三方或开源包（如 TFDV）与\
  \ OML 平台集成，以增强 ML 流水线功能。我们演示了 OML 内置的高性能分析和内置集成能力如何实现 ML 产品化流水线的关键需求：可扩展性、自动化以及与开源组件的集成，以实现端到端的生命周期管理。\n\
  \n# 10. 使用 Oracle 机器学习构建可复现的 ML 流水线\n\n如前一章所述，Oracle 机器学习（OML）提供了内置的数据安全性和调优后的 ML\
  \ 算法，为模型训练和模型评分提供可扩展、并行和分布式的执行。通过 OML4R 和 OML4Py，开源组件可以集成到 OML 平台中，从而在 ML 流水线中启用额外的自定义功能。\n\
  \n本章以一个实际的监督机器学习模型为例。它演示了如何将开源包集成到 OML 平台中，以端到端地自动化 ML 流水线。它还演示了如何跟踪 ML 流水线所有工件（源代码、数据、模型、指标等）的版本，并使流水线实验可复现。\n\
  \n如图 10-1 所示，ML 流水线（顶部中心绿色高亮部分）包含多个步骤：数据提取、数据验证、特征工程、数据准备、模型训练、模型评估、模型验证和模型监控。\n\
  \n在本章介绍的示例中，Oracle 机器学习（OML）组件提供了大部分功能。例如，OML 支持数据安全性、可扩展的模型训练和可扩展的模型评分。在图 10-1\
  \ 中，这些 OML 组件以红色高亮显示，它们作为 OML 服务器（右侧灰色高亮部分）或 OML 客户端（底部灰色高亮部分）的一部分进行部署。\n\n为了获得额外的流水线功能或特定的自定义，我们通过\
  \ OML4Py 或 OML4R（OML 客户端内部红色高亮部分）将开源包（左侧灰色高亮部分）集成到 ML 流水线中。在我们的示例中，开源包恰好是用 Python\
  \ 编写的，但选择的 OML 集成机制是 OML4R。Python 的 `subprocess` 模块连接到 Rscript 中的 OML 客户端代码。\n\n\
  以下是我们的示例中包含的开源包列表。\n\n*   TensorFlow 数据验证（TFDV）用于数据验证和模型监控。\n\n*   数据版本控制（DVC）用于\
  \ ML 流水线实验跟踪。\n\n![../images/499897_1_En_10_Chapter/499897_1_En_10_Fig1_HTML.jpg](img/499897_1_En_10_Fig1_HTML.jpg)\n\
  \n图 10-1\n\n流水线实现：将开源组件与 OML 集成\n\nTFDV 和 DVC 将在本章后面进一步讨论。\n\n## 环境\n\n本章的主要目标是提供一个实现图\
  \ 10-1 所述设计的 ML 流水线示例。我们将介绍 OML 客户端和服务器的软件栈，以及开源组件，如 DVC 和 TFDV。我们还将介绍主要的安装和配置步骤。让我们开始吧。\n\
  \n\n\n### 设置 Oracle Machine Learning for R\n\nOML4R 客户端和服务器均以 Oracle Linux 7 作为操作系统进行设置。OML\
  \ 服务器上安装了 Oracle Database 19c 版本。客户端和服务器端均安装了用于 Oracle Database 组件的 Oracle R Enterprise\
  \ (ORE) 1.5.1 版本。ORE 1.5.1 已通过 R-3.3.0（包括开源 R 和 Oracle R 发行版）认证。R-3.3.0 与社区贡献的 R\
  \ 支持包兼容。\n\n以下是需要安装的具体 R 包及其版本。\n\n*   arules 1.5-0\n\n*   cairo 1.5-9\n\n*   DBI\
  \ 0.6-1\n\n*   png 0.1-7\n\n*   ROracle 1.3-1\n\n*   statmod 1.4.29\n\n*   randomForest\
  \ 4.6-12\n\n注意\n\n所有组件均作为 Oracle Database 19c for Linux x86-64 的一部分包含在内。您可以在 [`www.oracle.com/database/technologies/oracle19c-linux-downloads.html/`](http://www.oracle.com/database/technologies/oracle19c-linux-downloads.html/)\
  \ 下载。这些组件的版本在编写本书时是最新的。您应检查是否有更新的版本。\n\n图 10-2 和图 10-3 分别展示了服务器端和客户端的安装步骤。\n\n![../images/499897_1_En_10_Chapter/499897_1_En_10_Fig3_HTML.jpg](img/499897_1_En_10_Fig3_HTML.jpg)\n\
  \n图 10-3\n\nOML4R 客户端安装顺序\n\n![../images/499897_1_En_10_Chapter/499897_1_En_10_Fig2_HTML.jpg](img/499897_1_En_10_Fig2_HTML.jpg)\n\
  \n图 10-2\n\nOML4R 服务器安装顺序\n\n### 验证 Oracle Machine Learning for R 安装\n\n验证软件堆栈配置是否正确始终是一个好习惯。请按照以下步骤验证\
  \ ORE 库能否加载，以及能否从服务器和客户端访问数据库对象。\n\n#### 在服务器端验证 OML4R\n\n首先，使用 ORE 脚本启动一个 R 实例并加载\
  \ ORE 库。\n\n```\n% ORE\n> library(ORE)\n```\n\n随后应显示一系列“Loading required package:\
  \ ORExxx”语句，且无任何错误。\n\n接下来，以 OML_USER 身份连接到服务器。以下示例将用户 oml_user 通过端口 1521 连接到 kaidb\
  \ 服务器主机上的数据库 k19c。\n\n```\nore.connect(user=\"oml_user\", sid=\"k19c\", host=\"\
  kaidb\", password=\"oml_userpsw\", port=1521, all=TRUE)\n```\n\n现在，执行一些基本函数。\n\n\
  ```\n## OML4R 客户端是否已连接到 OML4R 服务器？\nore.is.connected()\n[1] TRUE\n```\n\n如果连接成功，该函数返回\
  \ TRUE。\n\n```\n## 列出可用的数据库表。\nore.ls()\n[1] \"TABLE1\" \"TABLE2\"\n```\n\n如果配置成功，ore.ls()\
  \ 函数将返回当前模式下的表列表。\n\n#### 在客户端验证 OML4R\n\n由于我们的客户端运行在 Linux 上，请从命令提示符启动 R，并输入以下命令启动\
  \ OML4R。\n\n```\n> library(ORE)\n```\n\n随后应显示一系列“Loading required package: ORExxx”语句，且无任何错误。\n\
  \n使用以下命令连接到 OML4R 服务器。\n\n```\n>  ore.connect(user=\"OML_USER\", sid=\"pdb1\", host=\"\
  kaidb\", password=\"OML_USERpsw\", port=1521, all=TRUE)\nLoading required package:\
  \ ROracle\nLoading required package: DBI\n```\n\n现在检查连接状态。\n\n```\n> ore.is.connected()\n\
  [1] TRUE\n```\n\n如果连接成功，该函数返回 TRUE。\n\n接下来，列出 ore.frame 代理对象。\n\n```\n> ore.ls()\n\
  [1] \"TABLE1\" \"TABLE2\"\n```\n\n如果配置成功，ore.ls() 函数将返回当前模式下的表列表。\n\n如果出现配置问题，本章最后一节提供了一些故障排除技巧。\n\
  \n一旦 OML 客户端和服务器配置完成，让我们继续设置 ML 管道的开源组件。\n\n### 设置开源组件\n\n我们的 ML 管道示例包含 OML 客户端和服务器以及开源组件。这里，我们重点介绍安装和配置诸如\
  \ DVC 和 TFDV 等开源组件。\n\n要安装 TFDV，请运行以下命令。\n\n```\npip install tensorflow-data-validation\n\
  ```\n\n要安装 DVC，请运行以下命令。\n\n```\npip install dvc\n```\n\n或者，如果您希望在我们的环境中使用相同版本的 DVC\
  \ 和 TFDV 代码，可以跳过前面两个 `pip install` 命令，直接使用附带的 requirements.txt 文件运行 `pip install\
