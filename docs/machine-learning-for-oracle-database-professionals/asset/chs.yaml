  笔记本的工作方式与任何笔记本一样，并且所需的大多数 Python 库都已存在。如果您找不到所需的库，您可以像在任何 Python 环境中一样，使用 `pip install`
  命令自行添加。


  在常规 Python 环境之上，OCI 数据科学服务还包含了 Oracle 加速数据科学 (ADS) SDK Python 库。它提供了一个友好的用户界面，其中的对象和方法涵盖了机器学习模型生命周期中的所有步骤，从数据获取到模型评估和解释。ADS
  SDK 具有用于特征工程的自动数据可视化 (`auto_transform`) 和用于模型评估的 ADSEvaluator。AutoML 可自动进行特征选择、算法选择、特征编码和超参数调优。


  对于图像和视频上的机器学习任务，或者如果您已经使用 Python 构建了大量代码，或者您想使用 ADS SDK 并能够安装任何 Python 库，OCI 数据科学可能是最佳选择。


  ## Oracle 分析云


  对于业务用户或希望无需编程即可分析数据的人来说，Oracle 分析云 (OAC) 可能是最佳选择。它还拥有极其强大的数据准备工具，并且能够使用几乎任何数据源。您可以将这些数据源作为单一数据使用，也可以在
  OAC 中使用数据流将来自不同数据源的数据连接为一个整体，并将其存储到 Oracle 数据库中，以便与 OML4SQL、OML4R 或 OML4Py 一起使用。


  Oracle 拥有三条分析产品线：OAC、Oracle Analytics Server 和 Oracle Analytics for Applications。Oracle
  Analytics 使数据准备变得更加容易，提供了增强分析和可视化功能。在 OAC 中，您可以使用通过 OML4SQL 创建的机器学习模型。我们将在第 7 章中进一步讨论
  OAC。




  ## 自动机器学习（AutoML）


  自动机器学习（AutoML）是许多机器学习工具中非常流行的扩展功能，因为它不仅让模型构建阶段更高效，也让新手更容易入门机器学习。


  Oracle 自治数据库在机器学习功能下提供了专门的 AutoML 功能。在图 2-7 中，你可以看到它的位置。该功能是使用本章前面提到的相同 Python AutoML
  库构建的。


  ![../images/499897_1_En_2_Chapter/499897_1_En_2_Fig7_HTML.jpg](img/499897_1_En_2_Fig7_HTML.jpg)


