- '# 1. 机器学习简介


  我们生活在一个激动人心的时代，智能手机和手表、智能服装、机器人、无人机、人脸识别、智能个人助理、推荐系统、自动驾驶汽车以及全天候服务聊天机器人，这些都是*人工智能*（AI）。但什么是智能？智能可能被定义为获取和应用知识和技能的能力，换句话说，就是学习和运用所学技能的能力。人工智能正是如此，但由计算机和软件来完成。在现实生活中，人们希望拥有能够完成那些人们觉得无聊、效率低下或根本无法完成的事情的智能机器。它可以是利用计算机对人类智能的延伸，这就是人工智能。人工智能的核心是学习、获取知识和技能的能力，即*机器学习*。在机器学习中，机器进行学习、推理和自我修正。阿瑟·塞缪尔在
  1959 年将机器学习定义为“一个赋予计算机无需明确编程即可学习能力的研究领域”，这很好地定义了机器学习。




  ## 为什么需要机器学习？


  当亚瑟·塞缪尔在 1959 年定义机器学习时，所需的许多数学和统计学知识早已被发明。然而，当时既没有足够的技术，也没有足够的数据将理论付诸实践。如今，我们拥有硬件解决方案，包括用于矩阵计算的
  GPU 和 TPU、用于存储数据的廉价存储方案、开放数据集、用于迁移学习的预训练模型等等。这一切使得以最有趣、最有用的方式运用机器学习成为可能。但不仅仅是现在能够使用机器学习，而且使用它也是必要的。大数据以其体量、速度、多样性、真实性、可行性、价值、可变性和可视化，使得将传统数据处理转变为更高效、更快速的方式——机器学习——成为必然。


  机器学习并非万能灵药，也不应被如此看待。只有在能带来价值时才应使用机器学习。典型的用例是当规则和方程复杂或不断变化时。如果规则可以理解，并且能够用 if-else-then
  结构编程，那么机器学习可能不是最佳解决方案。


  机器学习用例的经典例子包括图像识别、语音识别、欺诈检测、购物趋势预测、垃圾邮件过滤器、医疗诊断或机器人技术。一些面向企业的机器学习例子包括客户流失预测、客户行为预测、员工自愿离职预测以及交叉销售和追加销售机会。


  机器学习的一个重要前提是你拥有数据；否则，它就毫无意义。数据被提供给机器，或者由机器产生，就像在强化学习中那样。数据质量越高，机器学习就能利用得越好。但即使数据质量极佳，机器学习运行得完美无缺，机器学习的预测也永远不是事实；它始终是一个复杂的猜测。有时这个猜测很好，甚至很有用，但有时则不然。


  此外，如果某些情况发生了变化——比如数据中噪声增多、数据量变大或数据质量下降——一个运行良好的机器学习模型将不再有效。换句话说，重要的是要理解，机器学习模型需要监控其定义的指标，以确保它们仍按预期工作，并在必要时进行调整。


  ## 什么是机器学习？


  机器学习可以根据训练数据的性质、问题类型以及用于解决问题的技术分为不同的类别。本书将机器学习分为三大类：监督学习、无监督学习和半监督学习。


  ### 监督学习


  监督机器学习由人类进行监督。通常，这意味着有人已经标记了数据以显示输出或正确答案。例如，有人手动检查 1000 张图片并对其进行标记，以识别哪些图片显示的是猫、狗或马。


  当有足够的高质量数据并且你知道目标（例如，数据已被标记）时，使用监督学习。模型在已知输入和已知输出数据上进行训练和测试，以预测新数据上的未来输出。在测试模型时，将预测结果与真实输出进行比较以评估模型。为了使这个过程有意义，训练数据必须与用于测试的数据分开。每个模型都使用不同的算法构建。模型将数据映射到算法并产生预测。因此，每种算法都以不同的方式处理数据。根据所选指标，评估过程会确定哪种算法表现最佳，然后使用该算法的模型可以投入生产。算法的选择取决于数据的大小、数据类型、你想从数据中获得的洞察，或者这些洞察将如何使用。这个决策是在许多因素之间进行权衡，例如对新数据的预测准确性、训练速度、内存使用、透明度（黑盒与“白盒”，决策如何做出）或可解释性（人类理解模型的能力）。


  回归和分类是监督学习中最常用的方法。回归预测数值，适用于连续数据。分类适用于分类数据，并对数据点进行分类。因此，如果你想预测一个数量，应该使用回归。如果你想预测一个类别或群体，应该使用分类。回归的一个例子是房价随时间的变化。分类的一个例子是通过将啤酒与其他啤酒按
  1 到 5 的等级进行评分来预测其评价，其中 1 表示质量差，5 表示质量优秀。图 1-1 是一个简单的回归示例。从图 1-1 所示的线条中，你可以看到对于值
  3，目标值的预测是 1.5。


