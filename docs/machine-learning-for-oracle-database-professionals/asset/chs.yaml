  Type rfNews() to see new features/changes/bug fixes.\n> library(ROracle)\n> library(statmod)\n\
  ```\n\n### 创建或删除用于嵌入式 R 执行的 R 脚本时出错\n\n我们尝试创建或删除自己的用于嵌入式 R 执行的 R 脚本，以实现更多自定义功能。我们遇到了以下错误信息。\n\
  \n```\n> ore.scriptCreate(\"Script1\")\nError: role \"RQADMIN\" is required to perform\
  \ this operation\n```\n\n必须将 RQADMIN 角色显式授予 OML4R 用户，才能启用带有 FUN 参数的 `ore.doEval()`、`ore.scriptCreate()`\
  \ 和 `ore.scriptDrop()` 的调用。\n\n#### 解决方案\n\n使用系统权限登录并执行以下语句，将 RQADMIN 角色授予 OML4R\
  \ 用户。\n\n```\nSQLPLUS / AS SYSDBA\nGRANT RQADMIN TO oml_username;\n```\n\n## 总结\n\
