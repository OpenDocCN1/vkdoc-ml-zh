  图 2-5


  操作笔记本会话


  图 2-6 显示了一个笔记本会话的示例。Oracle JupyterLab 环境已预装。它还包括用于从 OCI 对象存储读取和写入的默认存储选项。您可以轻松地从多种其他数据源和数据格式进行读取和写入。


