  ## 引言


  本书帮助数据库开发人员和 DBA 从概念上理解机器学习，包括方法、算法、流程和部署。本书涵盖了支持在 Oracle 数据库中实现机器学习的 Oracle 机器学习（OML）技术，包括
  OML4SQL、OML Notebooks、OML4R 和 OML4Py。*《Oracle 数据库专业人员机器学习》* 聚焦于 Oracle 自治数据库中的 Oracle
  机器学习，例如作为 ADW 协作环境一部分的自治数据仓库（ADW）数据库。本书还涵盖了一些高级主题，例如机器学习中的交付和自动化流水线。


  本书还通过动手示例提供了实用的实现细节，展示如何使用 OML 与 ADW 实现机器学习，以及如何自动化机器学习的部署。主要目标是通过获得机器学习的实践知识，弥合数据库开发/管理与机器学习之间的差距。作为一位擅长管理数据的资深数据库专业人员，你可以通过在同一数据管理系统中分析数据来应用这些知识。通过本书，三位在机器学习及数据库开发与管理方面经验丰富的作者将带你踏上一段从数据库开发人员或
  DBA 到数据科学家的旅程。


  ## 读者与受众


  本书面向以下读者：


  *   希望了解机器学习的数据库开发人员和管理员

  *   希望使用 Oracle 数据库内置机器学习功能集构建模型和应用程序的开发人员

  *   负责支持 Oracle 数据库和 ADW 中使用机器学习功能集的应用程序的管理员


  读者将学习如何执行以下操作：


  *   构建能够检测并处理数据/模型性能变化的自动化流水线

  *   在 ADW 中开发和部署机器学习项目

  *   使用内置机器学习包在 Oracle 数据库中开发机器学习

  *   使用 OML4R 和 OML4SQL 分析、开发、评估和部署各种机器学习模型


