  如果您理解机器学习流程，Data Miner 非常易于使用。无需任何编码。所有操作都通过点击和拖放完成。\n\n### OML Notebooks\n\n在 Oracle\
  \ 云中，可以使用自治数据库。自治数据库有两种不同的工作负载：事务处理（ATP）和数据仓库（ADW）。两者都为 Oracle Machine Learning\
  \ 提供了一个额外的选项：OML Notebooks。OML Notebooks 是 Apache Zeppelin 笔记本。使用这些笔记本，机器学习过程易于记录，并且包含许多数据可视化功能。OML\
  \ Notebooks 使用本章前面讨论过的相同 PL/SQL 包。您可以在第 4、5 和 6 章中了解更多关于 OML Notebooks 和自治数据库的信息。\n\
  \n## 总结\n\nOML4SQL 在 Oracle 数据库中运行。这意味着无需为机器学习过程移动数据。它可以在数据库中进行处理。此外，机器学习模型是数据库对象，可以像任何数据库对象一样使用。数据库中有\
  \ PL/SQL 包，用于准备和转换机器学习数据，以及构建和评估机器学习模型。这些包可以从任何允许调用 PL/SQL 包的界面中使用。它们也可以在 Oracle\
  \ SQL Developer 的 Oracle Data Miner 插件 GUI 或 OCI 的 OML Notebooks 中使用。\n\n\n\n"
- "# 4. 用于机器学习的 Oracle 自治数据库\n\n接下来的三章将探讨如何在 Oracle 云环境中进行机器学习，特别是在 Oracle 自治数据库环境中，该环境为机器学习项目提供了诸多优势。首先，您可以利用各种\
  \ Oracle 云基础设施服务，例如计算、存储和内存，以及自治数据库平台。这些服务使您能够轻松地在云中提供一个自我管理且高度可扩展的机器学习开发和运行时平台，而无需花费时间和资源在环境创建和管理上。因此，您可以更专注于机器学习开发。其次，您可以在自治数据库中使用一套全面的机器学习算法，以满足各种机器学习项目的需求。第三，您可以使用\
  \ Oracle 机器学习，这是一个内置工具，为数据科学家提供了一个基于 Web 的协作式交互式数据分析环境。该工具包括一个 SQL 界面和一个数据挖掘笔记本，专为数据分析、数据发现和数据可视化，以及机器学习项目的模型构建和评估而设计。\n\
  \n虽然接下来的两章重点介绍 Oracle 机器学习的功能以及如何将其用于机器学习项目，但本章将描述 Oracle 自治数据库环境，包括配置和访问、加载数据以及导入数据库模式。这些是开发机器学习项目的基本任务和实践。在本章末尾，我们将讨论如何通过自治数据库访问\
  \ Oracle 机器学习。本章涵盖以下主题。\n\n*   Oracle 云基础设施和自治数据库\n\n*   Oracle 自治数据库架构和组件\n\n*\
  \   Oracle 自治数据库的使用\n\n*   使用 Oracle 自治数据库的 Oracle 机器学习\n\n## Oracle 云基础设施和自治数据库\n\
  \n启动 Oracle 机器学习项目的一个快速方法是利用 Oracle 自治数据库。Oracle 云基础设施 (OCI) 提供三种类型的自治数据库，它们针对相应的工作负载进行了优化。\n\
  \n*   **自治数据仓库 (ADW)**：针对数据仓库、业务分析和机器学习等工作负载进行了优化。\n\n*   **自治事务处理 (ATP)**：针对事务处理和实时分析应用程序以及混合工作负载（例如事务、批处理、报告、物联网\
  \ (IoT)、应用程序开发等）进行了优化。\n\n*   **Oracle 自治 JSON 数据库**：一种云文档数据库，针对开发以 JSON 为中心的应用程序进行了优化。\n\
  \n虽然这些自治数据库共享通用的自治属性和通用的云基础设施，但我们仍然可以强调它们之间的一些主要区别。例如，ADW 使用列式数据格式，而 ATP 使用行式数据格式。ADW\
  \ 主要将内存用于并行连接和数据聚合，而 ATP 将内存用于数据缓存以减少 ATP 的 IO。ADW 旨在加速数据访问以创建数据摘要，而 ATP 则专注于用于消息传递和\
  \ IO 的远程直接内存访问 (RDMA)。由于 ADW 和 ATP 都支持相同的 Oracle 机器学习环境，因此本章将以 ADW 为例。\n\nOCI 提供所有三种类型的\
  \ Oracle 自治数据库。让我们首先回顾一下 OCI。\n\n### Oracle 云基础设施服务\n\nOracle 云基础设施提供了一套云服务，您可以在高可用性环境中利用这些服务来构建和运行应用程序。这些服务包括核心云基础设施以及各种数据库服务、大数据和人工智能\
  \ (AI) 服务。核心云基础设施提供计算、存储和网络服务。OCI 提供的重要数据库服务之一是 Oracle 自治数据库，它包括用于业务分析和机器学习工作负载的自治数据仓库、用于事务类型工作负载的自治事务处理以及用于\
  \ JSON 应用程序的自治 JSON 数据库。\n\n通过 OCI，您可以轻松配置这些基础设施资源，用于开发和运行各种应用程序和服务，例如数据库和业务分析应用程序，而无需花费大量时间和精力进行硬件和基础设施的安装和配置。例如，当您请求配置一个自治数据库实例时，配置过程会在\
  \ OCI 中创建以下服务。\n\n*   计算资源，例如具有所需 CPU 和内存的虚拟机，用于数据库服务器运行数据库实例\n\n*   网络资源，用于创建和管理数据库服务的网络组件（例如，配置虚拟云网络\
  \ (VCN) 以支持进出数据库服务的公共和私有网络流量）\n\n*   存储服务，用于存储数据库的所有数据库文件\n\n除了运行自治数据库实例的这些基本基础设施服务之外，您还可以使用其他\
  \ OCI 服务，例如[对象存储](https://docs.cloud.oracle.com/en-us/iaas/Content/Object/Concepts/objectstorageoverview.htm)服务，它为各种类型的数据提供高吞吐量存储。例如，如果您需要将数据从外部源加载到\
  \ Oracle 云中的自治数据库，则必须首先将该数据从外部源上传到 OCI 中的对象存储服务。然后，您可以将数据复制到您的 ADW 实例。\n\n\n\n###\
  \ 注册并访问 Oracle 云基础设施\n\n要开始使用 OCI 中的自治数据库服务或其他服务，您需要注册一个 Oracle 云免费套餐账户或付费账户。Oracle\
  \ 云免费套餐账户提供为期最多 30 天、价值 300 美元的免费试用额度，以及“始终免费”服务。在 30 天免费试用期内，您可以使用 OCI 中的所有服务，直至免费额度用完。免费试用期结束后，您可以选择升级为付费账户，或继续使用“始终免费”服务来保留账户。以下“始终免费”服务可无限期使用，但每项服务均有资源容量限制。\n\
  \n*   自治数据仓库\n*   自治事务处理\n*   计算\n*   块存储卷\n*   对象存储\n*   归档存储\n*   负载均衡\n*   监控\n\
  *   通知\n*   出站数据传输\n\n以下内容说明如何在 OCI 中注册 Oracle 云免费套餐账户。\n\n![../images/499897_1_En_4_Chapter/499897_1_En_4_Fig1_HTML.jpg](img/499897_1_En_4_Fig1_HTML.jpg)\n\
  \n图 4-1\n\n注册 Oracle 云基础设施账户\n\n1.  访问 Oracle 云免费套餐页面：[`www.oracle.com/cloud/free`/](http://www.oracle.com/cloud/free/)。点击“免费开始使用”按钮。\n\
  2.  在 Oracle 云免费套餐注册屏幕上，选择您的国家/地区，输入您的姓名和电子邮件地址，并接受使用条款。\n3.  这将进入下一个屏幕（见图 4-1），您可以在其中输入您的云账户信息，包括云账户名称。选择账户类型和符合“始终免费”条件的合适主区域。\n\
  4.  输入您的账户密码和手机号码以接收验证码。\n5.  提供您的信用卡支付信息。除非您选择升级为付费账户，否则不会向您收费。\n\n注册账户后不久，您将收到来自\
  \ Oracle 的确认电子邮件，其中包含云账户名称、用户名（您的电子邮件地址）以及云账户登录页面的链接。\n\n图 4-2 显示了登录 Oracle 云后的主页面。“快速操作”部分显示了创建云服务（如\
  \ ADW）的快捷方式。免费云服务标记为“符合始终免费条件”。“开始探索”部分列出了有用的 Oracle 云在线文档。要启动任何云服务，您可以从 Oracle\
  \ 云徽标下的下拉菜单中选择。免费试用账户可以随时升级为付费账户。免费试用期结束后，账户将仅限于使用那些“始终免费”的资源。一旦账户升级为付费账户，在试用额度用完后，您的信用卡将根据使用量进行扣费。\n\
  \n![../images/499897_1_En_4_Chapter/499897_1_En_4_Fig2_HTML.jpg](img/499897_1_En_4_Fig2_HTML.jpg)\n\
  \n图 4-2\n\nOracle 云基础设施页面\n\n## Oracle 自治数据库架构与组件\n\n本节概述 Oracle 自治数据库主要组件的架构。Oracle\
  \ 自治数据库云服务提供完全自治的数据库功能，包括 ADW、自治事务处理和自治 JSON 数据库。自动驾驶、自我安全、自我修复等特性完全自动化了数据库服务的配置、管理和维护。您可以使用易于使用的图形用户界面工具配置数据库服务、加载数据，并将您的应用程序连接到\
  \ ADW。\n\n除了核心数据库服务，Oracle 自治数据库还提供一套协作工具。例如，ADW 包含数据集成和业务分析工具，如图 4-3 所示。\n\n![../images/499897_1_En_4_Chapter/499897_1_En_4_Fig3_HTML.jpg](img/499897_1_En_4_Fig3_HTML.jpg)\n\
  \n图 4-3\n\nADW 架构\n\nADW 针对数据仓库工作负载进行了优化。所有能与 Oracle 数据库配合使用的应用程序也应能与 ADW 配合使用。这些应用程序可以部署在您数据中心内的本地环境中，也可以部署在公有云上。图\
  \ 4-3 显示，诸如 SQL Developer 和数据集成服务等开发工具可连接到 ADW 进行开发或数据集成。同时，商业智能应用程序服务也支持与 ADW 的连接。例如，通过连接到\
  \ ADW，Oracle 分析云或 Oracle 分析桌面可以创建业务数据可视化和分析。\n\nOracle 自治数据仓库包含一个基于云的服务控制台和多个基于云的内置查询及应用程序工具。服务控制台专为管理任务而设计，例如启动、停止和扩展数据库服务，以及服务监控任务，例如监控近期活动和数据库资源利用率。内置的查询和应用程序开发工具包括\
  \ Oracle 机器学习、SQL Developer Web 版、Oracle REST 数据服务和 Oracle Application Express。我们将在本章末尾进一步讨论这些工具。\n\
  \n\n\n### Oracle 自治数据库属性\n\n作为 Oracle 云数据库服务的一部分，Oracle 自治数据库是一个完全托管、预配置的数据库环境。它旨在为整个数据库生命周期带来完全自动化。自治数据库服务中嵌入了三种自治属性：**自动驾驶**、**自我安全**和**自我修复**。\n\
  \n*自动驾驶*属性包括数据库服务的快速配置、自动扩展、自动调优以及自动索引。借助这些功能，您无需配置任何硬件基础设施，也无需安装任何软件（如操作系统和 Oracle\
  \ 软件），或运行数据库创建来配置 Oracle 自治数据库。您只需选择工作负载类型并指定规模信息，例如 CPU 核心数、内存大小和数据库存储大小。\n\nOracle\
  \ 自治数据库服务可自动执行数据库生命周期管理任务，包括数据库的创建、管理和维护任务，例如数据库监控、调优、索引、备份/恢复、修补和升级。数据库配置完成后，您可以随时扩展\
  \ CPU 核心数、内存大小或存储大小。\n\n*自我安全*属性确保自治数据库中的所有数据都以加密格式存储。只有经过身份验证的用户和应用程序才能通过基于证书的身份验证和安全套接字层\
  \ (SSL) 访问数据。基于证书的身份验证使用存储在客户端和服务器端钱包中的加密密钥。关键安全补丁会自动按需应用于堆栈的不同层级，包括固件、操作系统、虚拟机监控程序、Oracle\
  \ Clusterware 和 Oracle 数据库。\n\n*自我修复*意味着硬件和软件的自我修复特性。自我修复硬件特性基于 Exadata 基础设施独特的服务器故障检测、对故障设备的持续监控以及亚秒级\
  \ I/O 存储重定向。自我修复软件依赖于全天候在后台运行的监控工具和故障预防工具，以及自动问题检测和解决。它利用机器学习算法应用已知问题的诊断和解决方案。自我修复还得益于最大可用性架构，该架构可保护自治数据库免受硬件和软件故障导致的计划外停机，以及硬件和软件维护导致的计划内停机。\n\
  \n所有这些自治特性都自动化了数据库及其底层云基础设施的生命周期管理。这使得数据库用户和应用程序开发人员能够专注于开发应用程序，而不是管理和维护硬件和软件堆栈。\n\
  \n### 免费试用和始终免费中的自治数据库\n\n如果您决定为您的 Oracle 云账户使用“始终免费”选项，您可以创建并访问最多两个 ADW 或 ATP 实例。为确保自治数据库实例保持免费，它不得超过以下资源和容量限制。\n\
  \n*   **处理器**：1 个 Oracle CPU 处理器（不可扩展）\n\n*   **内存**：8 GB RAM\n\n*   **数据库存储**：20\
  \ GB 存储（不可扩展）\n\n*   **工作负载类型**：可选择事务处理或数据仓库工作负载类型\n\n*   **数据库版本**：Oracle 数据库 21c\
  \ 或 Oracle 数据库 19c\n\n*   **基础设施类型**：共享 Exadata 基础设施\n\n*   **最大并发数据库会话数**：20\n\n\
  如果“始终免费”自治数据库连续七天无活动，数据库将自动关闭。它可以随时重新启动。但是，如果“始终免费”自治数据库连续三个月处于关闭状态，数据库将自动终止并删除，数据库资源将被回收。\n\
  \n## 使用 Oracle 自治数据仓库\n\n本节介绍如何使用 ADW 的协作环境来支持业务分析应用程序和机器学习。自治事务处理数据库的工作方式与 ADW\
  \ 相同。\n\n使用 Oracle 自治数据仓库从创建 ADW 实例开始。以下是一些典型任务。\n\n*   配置 ADW\n\n*   连接并查询 ADW\n\
  \n*   从/向 ADW 加载或导出数据\n\n### 配置 Oracle 自治数据仓库\n\n登录 OCI 后，您将进入主页面（见图 4-4）。\n\n![../images/499897_1_En_4_Chapter/499897_1_En_4_Fig4_HTML.jpg](img/499897_1_En_4_Fig4_HTML.jpg)\n\
  \n图 4-4\n\nOracle 云页面\n\n要创建 ADW 实例，请转到 Oracle 云基础设施页面，然后在“快速操作”中单击“创建 ADW 数据库”，或单击\
  \ Oracle 云页面左侧导航菜单中的“自治数据仓库”。图 4-4 中的箭头突出显示了这些选项的位置。\n\n在“自治数据库”对话框页面（见图 4-5）上，为自治数据仓库提供以下信息。\n\
  \n![../images/499897_1_En_4_Chapter/499897_1_En_4_Fig5a_HTML.jpg](img/499897_1_En_4_Fig5a_HTML.jpg)![../images/499897_1_En_4_Chapter/499897_1_En_4_Fig5b_HTML.jpg](img/499897_1_En_4_Fig5b_HTML.jpg)\n\
  \n图 4-5\n\n自治数据库对话框页面\n\n1.  输入区间、数据库名称和显示名称。\n\n2.  在工作负载类型中选择“数据仓库”。\n\n3.  选择部署类型：共享基础设施或专用基础设施。\n\
  \n4.  确定是否仅显示“始终免费”配置选项。\n\n5.  选择数据库版本。您可以选择 19c 或 21c。\n\n6.  指定 OCPU 计数和存储大小（以\
  \ TB 为单位）。如果您选择“始终免费”选项，它将采用默认的固定配置：OCPU=1 且存储=0.02TB。\n\n7.  如果选择了“自动扩展”，则启用它。\n\
  \n8.  创建管理员凭据。输入数据库管理员账户密码。\n\n9.  选择网络访问。允许从任何地方进行安全访问，除非您只想使用虚拟云网络配置私有访问。\n\n\
  10. 选择许可证类型。选择“自带许可证”或“包含许可证”。\n\n单击“创建自治数据库”。数据库实例将在大约 5 到 10 分钟内自动配置完成，具体时间取决于存储大小。\n\
  \n\n\n### 连接到 Oracle 自治数据仓库\n\n成功创建 ADW 数据库后，您会在 ADW 徽标下方看到“AVAILABLE”字样（见图 4-6）。您会在数据库实例名称旁边看到\
  \ *Always Free*，这表示该数据库始终可用且免费。\n\n![../images/499897_1_En_4_Chapter/499897_1_En_4_Fig6_HTML.jpg](img/499897_1_En_4_Fig6_HTML.jpg)\n\
  \n图 4-6\n\n自治数据库信息页面\n\n当通过公共互联网建立与 ADW 数据库的连接时，身份验证证书和安全套接字层 (SSL) 可确保数据库客户端与数据库服务器之间的通信完全加密且安全。证书认证使用存储在客户端和数据库服务器端（即您的\
  \ ADW 实例）钱包中的加密密钥。在建立通信之前，客户端存储的密钥必须与数据库服务器中存储的密钥匹配。要配置与此 ADW 实例的安全连接，您需要单击“DB Connection”按钮下载钱包（一个凭证\
  \ zip 文件），如图 4-6 所示。\n\n这将进入数据库连接页面，如图 4-7 所示。您可以单击“Download Wallet”将钱包 zip 文件下载到本地计算机。如图\
  \ 4-8 所示，钱包 zip 文件（wallet_databasename.zip）包含以下内容：\n\n![../images/499897_1_En_4_Chapter/499897_1_En_4_Fig8_HTML.jpg](img/499897_1_En_4_Fig8_HTML.jpg)\n\
  \n图 4-8\n\n压缩的钱包文件\n\n![../images/499897_1_En_4_Chapter/499897_1_En_4_Fig7_HTML.jpg](img/499897_1_En_4_Fig7_HTML.jpg)\n\
  \n图 4-7\n\n下载钱包\n\n*   `tnsnames.ora` 和 `sqlnet.ora`：存储连接描述符和 SQL*Net 客户端配置的网络配置文件。\n\
  \n*   `cwallet.ora` 和 `ewallet.p12`：自动打开的 SSO 钱包和 PKCS12 文件。PKCS12 文件受 UI 中提供的钱包密码保护。\n\
  \n*   `keystore.jks` 和 `truststore.jks`：受下载钱包时提供的钱包密码保护的 JKS 信任库和密钥库。\n\n*   `ojdbc.properties`：包含\
  \ JDBC 连接所需的钱包相关连接属性。该文件应与 `tnsnames.ora` 位于同一路径。\n\n要将客户端连接到数据库，钱包 zip 文件需要作为连接配置的一部分包含在内。例如，如果您想使用\
  \ Oracle 客户端（如 Oracle SQL*Plus）连接到数据库，请按照以下步骤操作。\n\n1.  将 wallet_databasename.zip\
  \ 文件解压到一个目录；例如，/home/oracle/adw。\n\n2.  cd $ORACLE_HOME/network/admin，将 wallet_location\
  \ 和 SSL_SERVER_DN_MATCH 这两个条目添加到 sqlnet.ora 文件中，如清单 4-1 所示。wallet_location *条目*指定了\
  \ Oracle 钱包的物理文件位置，其中包含由 SSL 处理的证书、密钥和信任点。将 SSL_SERVER_DN_MATCH 设置为 Yes 会强制要求数据库服务器的专有名称\
  \ (DN) 与其服务名称匹配。\n\n1.  将 /home/oracle/adw/tnsnames.ora 中的数据库服务条目附加到 $ORACLE_HOME/network/admin/tnsnames.ora\
  \ 中。\n\n例如，将此数据库服务名称条目（如清单 4-2 所示）附加到 $ORACLE_HOME/network/admin/tnsnames.ora 中。\n\
  \n```\nWALLET_LOCATION = (SOURCE = (METHOD = file) (METHOD_DATA = (DIRECTORY=\"\
  /home/oracle/adw\")))\nSSL_SERVER_DN_MATCH=yes\n清单 4-1\nsqlnet.ora 文件中的两个条目\n```\n\
  \n```\nkaiadw1_low = (description= (retry_count=20)(retry_delay=3)(address=(protocol=tcps)(port=1522)(host=adb.us-ashburn-1.oraclecloud.com))(connect_data=(service_name=mojg\
  \ gjecekbigkm_kaiadw1_low.adwc.oraclecloud.com))(security=(ssl_server_cert_dn=\"\
  CN=adwc.uscom-east-1.oraclecloud.com,OU=Oracle BMCS US,O=Oracle Corporation,L=Redwood\
  \ City,ST=California,C=US\")))\n清单 4-2\nADW 的数据库服务名称条目\n```\n\n通常，钱包 zip 文件中的 tnsnames.ora\
  \ 文件包含三个标记为 high、medium 和 low 的数据库服务名称条目：<database_name>_low、<database_name>_medium\
  \ 和 <database_name>_high。这些预定义的服务名称代表了数据库连接可以获得的资源和并发性的不同级别。您可以根据数据库连接的性能和并发性要求，使用其中一个服务名称连接到\
  \ ADW 数据库。例如，使用 kaiadw1_low 数据库服务名称连接到 kaiadw1 ADW 数据库，该连接为每个 SQL 语句提供最低级别的资源，并支持最大数量的并发\
  \ SQL 语句。清单 4-3 显示了使用 admin 用户和此 kaiadw1_low 数据库服务名称的 SQL*Plus 连接。\n\n```\n$sqlplus\
  \ admin/admin_passwd@kaiadw1_low\n清单 4-3\n连接到 ADW 实例的 SQL*Plus 连接\n\n要连接支持钱包的客户端应用程序（例如，SQL\
  \ Developer 18.3 或更高版本），您可以选择 Cloud Wallet 作为连接类型，并在配置文件框中提供钱包 zip 文件，如图 4-9 所示。\n\
  \n![../images/499897_1_En_4_Chapter/499897_1_En_4_Fig9_HTML.jpg](img/499897_1_En_4_Fig9_HTML.jpg)\n\
  \n图 4-9\n\n使用 ADW 连接 SQL Developer\n\n一旦 Oracle SQL Developer 连接到 ADW 实例，您就可以使用它来执行\
  \ SQL 语句、浏览数据库模式对象以及在 ADW 上执行许多其他任务，如图 4-10 所示。\n\n![../images/499897_1_En_4_Chapter/499897_1_En_4_Fig10_HTML.jpg](img/499897_1_En_4_Fig10_HTML.jpg)\n\
  \n图 4-10\n\n通过 Oracle SQL Developer 在 ADW 上执行 SQL 查询\n\n### 将数据加载到 Oracle 自治数据仓库\n\
  \n要使用您的 ADW 数据库启动应用程序开发或机器学习项目，您可能需要将数据从各种数据源加载到数据库中，例如将 .csv 格式的文本文件加载到数据仓库。在 Oracle\
  \ 自治数据仓库环境中，此数据加载过程包括三个步骤，如图 4-11 所示。\n\n![../images/499897_1_En_4_Chapter/499897_1_En_4_Fig11_HTML.jpg](img/499897_1_En_4_Fig11_HTML.jpg)\n\
  \n图 4-11\n\n将数据加载到 Oracle ADW 的三个步骤\n\n1.  将数据文件从客户端的本地计算机上传到对象存储。\n\n2.  在 ADW\
  \ 中创建适当的云凭证。\n\n3.  将数据文件从对象存储复制到 ADW 中的表。\n\n我们将在以下各节中详细讨论每个步骤。\n\n\n\n#### 步骤\
  \ 1：从本地计算机上传文件到对象存储\n\n对象存储使用存储桶来组织文件。要将文件加载到对象存储，必须先在其中创建一个存储桶。请在 Oracle Cloud\
  \ 控制台中执行以下步骤来创建存储桶。\n\n![../images/499897_1_En_4_Chapter/499897_1_En_4_Fig13_HTML.jpg](img/499897_1_En_4_Fig13_HTML.jpg)\n\
  \n图 4-13\n\n已创建 data1 存储桶\n\n![../images/499897_1_En_4_Chapter/499897_1_En_4_Fig12_HTML.jpg](img/499897_1_En_4_Fig12_HTML.jpg)\n\
  \n图 4-12\n\n对象存储：创建存储桶\n\n1.  在 Oracle Cloud 主页面，导航到对象存储并点击创建存储桶（见图 4-12）。\n\n2.\
  \  在创建存储桶对话框中，输入存储桶名称（例如，*data1*）。选择存储层，然后点击创建存储桶。图 4-13 显示了已创建的 data1 存储桶。\n\n\
  请按照以下步骤将文件上传到存储桶窗口中的存储桶，如图 4-13 所示。\n\n![../images/499897_1_En_4_Chapter/499897_1_En_4_Fig15_HTML.jpg](img/499897_1_En_4_Fig15_HTML.jpg)\n\
  \n图 4-15\n\n查看对象详细信息\n\n![../images/499897_1_En_4_Chapter/499897_1_En_4_Fig14_HTML.jpg](img/499897_1_En_4_Fig14_HTML.jpg)\n\
  \n图 4-14\n\n上传对象\n\n1.  点击存储桶名称 (*data1*) 以获取存储桶的详细信息，然后点击上传对象（见图 4-14）。\n\n2. \
  \ 将文件拖入“将文件拖放到此处...或选择文件”对话框。\n\n3.  可选：在对象名称前缀字段中指定文件名称前缀。\n\n4.  点击上传对象以将文件加载到对象存储桶。\n\
  \n5.  上传文件后，通过点击查看对象详细信息来获取该文件的对象详细信息，如图 4-15 所示。对象详细信息如代码清单 4-4 所示。\n\n```\nObject\
  \ Details\nBasic Information\nName: db1_customers.csv\nURL Path (URI): https://objectstorage.us-ashburn-1.oraclecloud.com/n/idudzqoitv0b/b/data1/o/db1_customers.csv\n\
  Storage Tier: Standard\nSize: 2.14 MiB\nListing 4-4\nObject Details\n```\n\n最重要的详细信息之一是对象的\
  \ URL 路径（URI）。请保留此 URL 路径，因为它将在 `DBMS_CLOUD.COPY_DATA` 过程中使用。\n\n#### 步骤 2：创建凭证\n\
  \n要将数据从存储在对象存储中的文件加载到 ADW，您需要在 ADW 中创建一个对象存储凭证。请使用您的 OCI 登录名和一个身份验证令牌。\n\n在您注册 Oracle\
  \ Cloud 账户并登录 Oracle Cloud 后，请执行以下步骤为您的 OCI 登录创建身份验证令牌。\n\n1.  在 Oracle Cloud 主页面，打开位于右上角的配置文件菜单\
  \ ![../images/499897_1_En_4_Chapter/499897_1_En_4_Figa_HTML.jpg](img/499897_1_En_4_Figa_HTML.jpg)。然后点击用户设置（见图\
  \ 4-16）以进入用户详细信息页面。\n\n    ![../images/499897_1_En_4_Chapter/499897_1_En_4_Fig16_HTML.jpg](img/499897_1_En_4_Fig16_HTML.jpg)\n\
  \n    图 4-16\n\n    配置文件菜单\n\n2.  在用户详细信息页面（见图 4-17），找到资源部分并点击身份验证令牌。\n\n    ![../images/499897_1_En_4_Chapter/499897_1_En_4_Fig17_HTML.jpg](img/499897_1_En_4_Fig17_HTML.jpg)\n\
  \n    图 4-17\n\n    用户详细信息页面：身份验证令牌\n\n3.  在身份验证令牌部分，点击生成令牌（见图 4-18）。\n\n    ![../images/499897_1_En_4_Chapter/499897_1_En_4_Fig18_HTML.jpg](img/499897_1_En_4_Fig18_HTML.jpg)\n\
  \n    图 4-18\n\n    生成令牌\n\n4.  在生成令牌框中，输入令牌的描述；例如，`ADW_TOKEN`。\n\n5.  点击生成令牌按钮。新的令牌字符串会显示出来（见图\
  \ 4-19）。\n\n    ![../images/499897_1_En_4_Chapter/499897_1_En_4_Fig19_HTML.jpg](img/499897_1_En_4_Fig19_HTML.jpg)\n\
  \n    图 4-19\n\n    复制令牌字符串\n\n6.  立即复制 '`nL7HEjMP{3>:;n4OVSdS'` 令牌字符串。使用 `ADW_TOKEN`\
  \ 令牌名称和该令牌字符串，通过 `DBMS_CLOUD.CREATE_CREDENTIAL` 过程创建一个对象存储凭证。\n\n在 `CREATE_CREDENTIAL`\
  \ 过程（见代码清单 4-5）中，`password` 参数使用 '`nL7HEjMP{3>:;n4OVSdS'` 令牌字符串。`username` 是 OCI\
  \ 账户登录名。\n\n```\nBEGIN\nDBMS_CLOUD.CREATE_CREDENTIAL(credential_name => 'ADW_TOKEN',\n\
  username => 'oracleidentitycloudservice/kai_yu@dell.com',\npassword => 'nL7HEjMP{3>:;n4OVSdS');\n\
  END;\n/\nListing 4-5\nStore Object Storage Credentials in ADW\n```\n\n#### 步骤 3：将数据加载到自治数据仓库的表中\n\
  \n将数据加载到 Oracle Cloud 的对象存储服务后，您可以将此数据加载到 ADW 数据库中。首先，您需要通过执行代码清单 4-6 中的 DDL 来创建一个客户表。\n\
  \n```\ncreate table customer\n(\ncustomer number(38,0),\nage number(4,0),\nincome\
  \ number(38,0),\nmarital status varchar2(26 byte)\n);\nListing 4-6\nCreate the Customer\
  \ Table to Store the Data\n```\n\n其次，如代码清单 4-7 所示，执行 `DBMS_CLOUD.COPY_DATA` 过程，将数据从对象存储中的\
  \ `db1_customer_score.xls` 文件复制到 ADW 中的 `customer` 表。此 `DBMS_CLOUD.COPY_DATA` 过程接受多个参数。\n\
  \n*   `table_name`：数据被复制到的表\n*   `credential_name`：使用 `DBMS_CLOUD.CREATE_CREDENTIAL`\
  \ 创建的凭证名称\n*   `file_uri_list`：存储在对象存储桶中的源文件的 URL 地址，该地址从对象的对象详细信息中获取，如代码清单 4-4\
  \ 所示\n*   `Format`：描述源文件的格式（选项以 JSON 字符串形式指定）\n\n```\nBEGIN\nDBMS_CLOUD.COPY_DATA\
  \ (\ntable_name =>'CUSTOMER',\ncredential_name =>'ADM_TOKEN',\nfile_uri_list =>'https://objectstorage.us-ashburn-1.oraclecloud.com/n/idudzqoitv0b/b/data1/o/db1_customers.csv',\n\
  format =>json_object('ignore missing columns' value 'true', 'removequotes' value\
  \ 'true', 'blankasnull' value 'true', 'delimiter' value ',')\n);\nEND;\n/\nListing\
  \ 4-7\nLoad the Data from Object Storage to Customer Table\n```\n\n如果您在使用 `COPY_DATA`\
  \ 过程时遇到任何问题，可以查看过程执行时返回的错误消息以进行诊断。代码清单 4-8 是一个错误消息示例。\n\n```\nError report -\nORA-20003:\
  \ Reject limit reached, query table \"ADMIN\".\"COPY$11_LOG\" for error details\n\
  ORA-06512: at \"C##CLOUD$SERVICE.DBMS_CLOUD\", line 943\nListing 4-8\nDBMS_CLOUD.COPY_DATA\
  \ Procedure Error Message\n```\n\n此错误消息表明，您可以通过查询错误日志表 `COPY$11_LOG` 来获取错误消息的更多详细信息。代码清单\
  \ 4-9 展示了对错误日志表的查询：***`COPY$11_LOG` 以获取更详细的消息。***\n\n```\nSelect * from COPY$11_LOG;\n\
  ORA-29913: error in executing ODCIEXTTABLEOPEN callout\nORA-29400: data cartridge\
  \ error\nListing 4-9\nQuery Error Log Table COPY$11_LOG\n```\n\n此消息表明存在某些数据错误。在进一步调查数据后，发现数据异常是由于数据中存在一些空白字段。解决方案是将\
  \ `'blankasnull' value 'true'` 选项添加到 `DBMS_CLOUD.COPY_DATA` 的 `format` 参数的 JSON\
  \ 对象中，如代码清单 4-7 所示，我们最初并未使用该选项。\n\n\n\n### 将表/模式导入 Oracle 自治数据库\n\n将模式或表从本地数据库迁移到\
  \ ADW 是一种常见操作。实现此类迁移的一种快速方法是将本地数据库中的模式或表导出为转储文件，然后将转储文件导入 ADW。为了实现快速稳定的导入，建议将转储文件上传到\
  \ Oracle 云对象存储，然后再导入到 ADW 数据库实例。图 4-20 展示了此迁移过程的四个步骤。\n\n1.  将源数据库中的模式或表导出为转储文件。\n\
  \n2.  将转储文件上传到 Oracle 云中的对象存储。\n\n3.  创建云身份验证凭证。\n\n4.  将模式或表从转储文件导入到 ADW。导入过程在客户端计算机上进行。\n\
  \n![../images/499897_1_En_4_Chapter/499897_1_En_4_Fig20_HTML.jpg](img/499897_1_En_4_Fig20_HTML.jpg)\n\
  \n图 4-20\n\n将模式/表导出和导入到 ADW\n\n以下是四个步骤的详细说明。\n\n步骤 1\\. 从源数据库导出\n\nOracle ADW 文档\
  \ [1] 建议为数据转储导出设置两个导出参数：EXCLUDE 和 DATA_OPTIONS。清单 4-10 显示了这两个参数的设置。\n\n```\nexclude=index,cluster,indextype,materialized_view,materialized_view_log,materialized_zonemap,db_link\n\
  encryption_pwd_prompt=yes\n清单 4-10\n为数据转储导出设置两个参数\n```\n\n这些设置确保在导出中排除 ADW 中不需要的那些对象类型，并确保将表分区分组在一起，以便更快地导入到\
  \ ADW。清单 4-11 是从数据库 K19cdb 导出 sales 模式的示例。\n\n```\n$expdp sales/passwd@K19cdb  exclude=index,cluster,indextype,materialized_view,materialized_view_log,materialized_zonemap,db_link\
  \ \\\ndata_options=group_partition_table_data \\\nparallel =2 \\\nschemas=sales\
  \ \\\ndumpfile=export%u.dmp \\\nencryption_pwd_prompt=yes \\\nlog=expdp_k19c.log\n\
  清单 4-11\n从源数据库导出 Sales 模式\n```\n\n此处，由于 parallel 参数设置为 2，因此仅生成两个转储文件：export01.dmp\
  \ 和 export02.dmp。如果 ADW 实例具有更多 CPU，则可以将 parallel 参数设置为该数量。例如，如果有 16 个 CPU，则导出会生成\
  \ 16 个转储文件，这允许您以 16 个并行流将它们导入到 ADW 实例，从而实现更快的导入。\n\n为了提高数据库导出的安全性，您可以将 encryption_pwd_prompt\
  \ 参数设置为 Yes。通过此设置，导出会提示输入密码以加密转储文件。\n\n导入转储文件时，系统会提示您提供相同的加密密码来解密转储文件。\n\n步骤 2\\\
  . 将 export01.dmp 和 export02.dmp 转储文件上传到对象存储。执行此操作的方法与步骤 1 中介绍的方法相同。\n\n步骤 3\\. 创建云身份验证凭证。让我们使用与上一节步骤\
  \ 2 和清单 4-5 相同的方法来创建 ADW_TOKEN 凭证。\n\n步骤 4：导入到自治数据仓库。\n\n如图 4-20 所示，导入操作在安装了 Oracle\
  \ 客户端软件的本地计算机上执行。为了从将要执行导入的本地计算机连接到自治数据仓库数据库，让我们向 $ORACLE_HOME/network/admin/sqlnet.ora\
  \ 添加两个条目，如清单 4-12 所示。\n\n```\nWALLET_LOCATION = (SOURCE = (METHOD = file) (METHOD_DATA\
  \ = (DIRECTORY=\"/home/oracle/adw\")))\nSSL_SERVER_DN_MATCH=yes\n清单 4-12\nsqlnet.ora\
  \ 文件中的两个条目\n```\n\nADW 数据库服务名称条目被复制到 Oracle 客户端安装中的 $ORACLE_HOME/network/admin/tnsnames.ora。清单\
  \ 4-13 是 ADW 数据库服务名称条目的示例。\n\n```\nkaiadw1_low = (description= (retry_count=20)(retry_delay=3)(address=(protocol=tcps)(port=1522)(host=adb.us-ashburn-1.oraclecloud.com))(connect_data=(service_name=mojg\
  \ gjecekbigkm_kaiadw1_low.adwc.oraclecloud.com))(security=(ssl_server_cert_dn=\"\
  CN=adwc.uscom-east-1.oraclecloud.com,OU=Oracle BMCS US,O=Oracle Corporation,L=Redwood\
  \ City,ST=California,C=US\")))\n清单 4-13\nADW 数据库服务名称条目\n```\n\nSQLPLUS 命令可以测试与 ADW\
  \ 实例的连接，如清单 4-14 所示。\n\n```\n$sqlplus admin/admin_passwd@kaiadw1_low\n清单 4-14\n\
  SQLPLUS 登录到 ADW 实例\n```\n\n在将转储文件导入到 ADW 数据库之前，您需要确保满足以下先决条件。\n\n*   export01.dmp\
  \ 和 export02.dmp 均已上传到步骤 2 中的对象存储。\n\n*   已复制转储文件的 URL（参见清单 4-15）以用于导入操作。\n\n```\n\
  https://objectstorage.us-ashburn-1.oraclecloud.com/n/idudzqoitv0b/b/data1/o/export01.dmp\n\
  https://objectstorage.us-ashburn- 1.oraclecloud.com/n/idudzqoitv0b/b/data1/o/export02.dmp\n\
  清单 4-15\n两个转储文件的 URL\n```\n\nADW_TOKEN 凭证已在步骤 3 中创建。满足所有这些先决条件后，`impdp` 命令（参见清单\
  \ 4-16）将对象存储中转储文件中的模式导入到 ADW 数据库。\n\n```\nimpdp admin/admin_passwd@kaiadw1_low \\\
  \ndirectory=data_pump_dir \\\ncredential=ADW_TOKEN \\\ndumpfile=https://objectstorage.us-ashburn-1.oraclecloud.com/n/idudzqoitv0b/b/data1/o/export01.dmp,\
  \ https://objectstorage.us-ashburn-1.oraclecloud.com/n/idudzqoitv0b/b/data1/o/export02.dmp\
  \  \\\nparallel=2 \\\nencryption_pwd_prompt=yes \\\npartition_options=merge \\\n\
  清单 4-16\n导入到 ADW\n```\n\n默认情况下，导入日志文件 import.log 存储在 data_pump_dir 中，该目录是通过 impdp\
  \ 目录参数指定的。您可以通过在 ADW 中使用其管理员帐户运行以下查询来检查 data_pump_dir 的目录路径。例如，此查询结果类似于清单 4-17 中的结果。\n\
  \n```\nSelect directory_path from all_directories where directory_name = 'DATA_PUMP_DIR';\n\
  DIRECTORT_PATH\n\n/u03/dbfs/A6B99C1F8E42C676E0539114000A16AF/data/dpdump\n清单 4-17\n\
  data_pump_dir 目录路径\n```\n\n但是，由于 ADW 主机的此文件系统无法直接访问，因此您需要将此文件移动到对象存储，然后从对象存储下载此文件，而不是直接访问\
  \ import.log 文件。清单 4-18 展示了如何使用 DBMS_CLOUD.PUT_OBJECT 过程将 import.log 文件放入对象存储。\n\
  \n```\nBEGIN\nDBMS_CLOUD.PUT_OBJECT(\ncredential_name =>'ADW_TOKEN',\nobject_uri\
  \ =>'https://objectstorage.us-ashburn-1.oraclecloud.com/n/idudzqoitv0b/b/data1/o/import.log',\n\
  directory_name  => 'DATA_PUMP_DIR',\nfile_name       => 'import.log');\nEND;\n/\n\
  清单 4-18\n将导入日志放入对象存储\n```\n\n此过程执行后，import.log 会显示在对象存储中（参见图 4-21）。可以通过单击“下载”来下载此文件。\n\
  \n![../images/499897_1_En_4_Chapter/499897_1_En_4_Fig21_HTML.jpg](img/499897_1_En_4_Fig21_HTML.jpg)\n\
  \n图 4-21\n\n从对象存储下载 Import.log\n\n\n\n## 使用 ADW 的 Oracle 机器学习\n\nADW 包含以下内置查询和应用程序开发工具（另请参见图\
  \ 4-3）。\n\n*   **Oracle 机器学习 (OML)**：一个基于 Web 的笔记本应用程序，提供简单的查询、数据可视化和协作功能。开发人员、业务用户和数据科学家可以使用该笔记本执行数据分析、数据发现和数据虚拟化。\n\
  \n*   **Oracle SQL Developer**：Oracle SQL Developer 的基于 Web 浏览器的界面。\n\n*   **Oracle\
  \ REST 数据服务 (ORDS)**：一种基于 Java 的数据服务，用于为关系数据和 JSON 文档存储开发现代 REST 接口。\n\n*   **Oracle\
  \ Application Express (APEX)**：一个低代码开发平台，使您能够构建可扩展、安全的企业应用程序。\n\n可以通过 ADW 数据库详细信息页面的“工具”选项卡访问这些内置工具，如图\
  \ 4-22 所示。我们重点关注 Oracle 机器学习内置工具。如果您对其他工具感兴趣，请参阅 Oracle 公司于 2021 年 6 月发布的《在共享 Exadata\
  \ 基础设施上使用 Oracle 自治数据仓库云服务指南》，文档编号 F35573-24 (URL: [`https://docs.oracle.com/en/cloud/paas/autonomous-database/adbsa/`](https://docs.oracle.com/en/cloud/paas/autonomous-database/adbsa/))。\n\
  \n![../images/499897_1_En_4_Chapter/499897_1_En_4_Fig22_HTML.jpg](img/499897_1_En_4_Fig22_HTML.jpg)\n\
  \n图 4-22\n\n自治数据库构建工具\n\n### 通过 Oracle 自治数据库访问 Oracle 机器学习\n\nOracle 机器学习是 Oracle\
  \ 自治数据库的内置应用程序。您可以通过 Oracle 自治数据库（例如 ADW 实例）访问它，方法是将现有数据库用户帐户添加到 Oracle 机器学习，或使用\
  \ Oracle 机器学习管理 GUI 创建新用户帐户。\n\n执行以下操作以向 Oracle 机器学习添加新用户帐户。\n\n![../images/499897_1_En_4_Chapter/499897_1_En_4_Fig25_HTML.jpg](img/499897_1_En_4_Fig25_HTML.jpg)\n\
  \n图 4-25\n\nOracle 机器学习登录页面\n\n![../images/499897_1_En_4_Chapter/499897_1_En_4_Fig24_HTML.jpg](img/499897_1_En_4_Fig24_HTML.jpg)\n\
  \n图 4-24\n\n新用户已创建\n\n1.  在自治数据仓库中单击“服务控制台”。\n\n2.  在“服务控制台”上，单击“管理”。\n\n3.  在“管理”中，单击“管理\
  \ OML 用户”以打开 Oracle 机器学习用户管理页面（参见图 4-23），然后单击“创建”以打开“创建用户”页面。\n\n    ![../images/499897_1_En_4_Chapter/499897_1_En_4_Fig23_HTML.jpg](img/499897_1_En_4_Fig23_HTML.jpg)\n\
  \n    图 4-23\n\n    用户管理页面\n\n4.  在“创建用户”页面上，输入所需信息，例如用户名、名字和姓氏、电子邮件地址和密码，然后单击“创建”。将创建一个新用户\
  \ OMLUSER。\n\n5.  单击屏幕右上角的“主页”徽标（参见图 4-24）。这将带您进入 Oracle 机器学习登录页面（参见图 4-25），您可以在其中使用您创建的用户名和密码登录\
  \ Oracle 机器学习。\n\n您还可以将现有数据库用户帐户添加到 Oracle 机器学习。\n\n![../images/499897_1_En_4_Chapter/499897_1_En_4_Fig28_HTML.jpg](img/499897_1_En_4_Fig28_HTML.jpg)\n\
  \n图 4-28\n\n现有用户 HR 被授予 OML 开发者角色\n\n![../images/499897_1_En_4_Chapter/499897_1_En_4_Fig27_HTML.jpg](img/499897_1_En_4_Fig27_HTML.jpg)\n\
  \n图 4-27\n\n编辑现有用户以授予开发者角色\n\n1.  在自治数据库实例中单击“服务控制台”。\n\n2.  在“服务控制台”中，单击“管理”。\n\
