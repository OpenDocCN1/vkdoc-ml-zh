  \n图 5-24\n\n散点图\n\n\n\n## 总结\n\n本章介绍了 Oracle 机器学习，它是 Oracle ADW 应用环境内置工具集的一部分。要访问\
  \ OML，ADW 数据库管理员需要创建一个新用户，或为 ADW 中的现有用户授予 OML 开发者（OML developer）角色。拥有此角色后，该用户即可登录\
  \ OML。登录后，该用户会获得默认的工作区和默认项目。该用户也可以创建新的工作区和项目。用户在选择工作区和项目（无论是默认的还是新建的）后，即可创建笔记本。笔记本使用其连接设置连接到\
  \ ADW 数据库，并使用其解释器绑定设置连接到 ADW 数据库的 SQL 和 PL/SQL 解释器，以处理笔记本中的 SQL 语句和 SQL 脚本。\n\n\
  你可以在笔记本中编写 SQL 脚本，并在后端的 ADW 数据库中执行它们。这使我们能够在 Oracle 机器学习笔记本中运行 OML4SQL。你也可以在笔记本中编写\
  \ SQL 语句，并在后端的 ADW 数据库中执行它们。SQL 查询语句可以从 ADW 数据库中获取结果数据，并将其显示在笔记本中。通过选择不同的显示图标以及\
  \ X 轴和 Y 轴设置，你可以以多种图形格式显示结果。这些格式包括表格、条形图、饼图、面积图、折线图和散点图。这些结果数据的图形化表示是在 OML 项目中分析和可视化数据的关键。\n\
  \n下一章将讨论如何使用 OML 环境。\n\n# 6. 使用 OML 笔记本构建机器学习模型\n\n第 4 章讨论了 Oracle 自治数据库环境，并探讨了如何在\
  \ Oracle 自治数据库中执行一些基本任务，例如数据库配置、数据加载以及数据库模式/表导入。第 5 章重点介绍了 Oracle 自治数据库的一个关键组件——Oracle\
  \ 机器学习，并讨论了如何使用 Oracle 机器学习笔记本运行 SQL 语句以及 SQL 和 PL/SQL 脚本，以及如何可视化从 Oracle 自治数据库获取的数据。通过这些关键特性，Oracle\
  \ 自治数据库中的 Oracle 机器学习（OML）为各种机器学习开发项目提供了一个卓越的平台。本章专门探讨如何利用这个平台进行机器学习项目。\n\n除了 Oracle\
  \ 机器学习笔记本之外，Oracle 自治数据库（如自治数据仓库 (ADW) 和自治事务处理 (ATP)）通过其 Oracle 数据库引擎，为 Oracle 机器学习\
  \ for SQL（也称为 OM4SQL）提供了全面支持。OML4SQL 作为 Oracle 数据库的一个组件，在 Oracle 数据库内核中实现。它包含在最常见的\
  \ Oracle 数据库许可选项中，例如 SE2、EE、EE-ES、DBCS SE、DBCS EE、DBCS EE-HP、DBCS EE-EP 和 ExaCS。\n\
  \nOML4SQL 的机器学习能力使我们能够在运行于自有基础设施和 Oracle 自治数据库中的 Oracle 数据库中进行数据库内机器学习。通过 Oracle\
  \ 机器学习笔记本，你可以使用 PL/SQL API 以及 SQL 语言运算符和函数中的 OML4SQL 编程接口，在 Oracle 自治数据库中利用所有 OML4SQL\
  \ 功能。\n\n本章涵盖以下内容。\n\n*   Oracle 机器学习概述\n\n*   机器学习流程\n\n*   Oracle 机器学习 for SQL\n\
  \n*   一个机器学习项目示例\n\n## Oracle 机器学习概述\n\n机器学习任务通常涉及构建能够基于大量数据集进行学习或提升性能的智能系统。机器学习可以帮助解决各种类型的业务问题。以下是一些需要机器学习的业务问题。\n\
  \n*   **模式发现**：机器学习系统通过搜索大量数据集自动发现某些模式或趋势。机器学习基于现有数据创建模型，然后将该模型应用于新数据。\n\n*   **预测**：机器学习系统可以基于一些历史数据预测未来事件的概率。在这种情况下，机器学习基于历史数据创建模型，然后将该模型应用于未来数据，以预测该预测为真的相关概率（即可能性）。\n\
  \n*   **分组**：机器学习的一种形式是寻找数据的自然分组，例如识别指定信用评分范围内的客户群体。\n\n*   **可操作信息**：机器学习可以从大量数据中生成可操作的决策。例如，机器学习系统可以创建一个模型来为客户信用卡申请分配信用额度。\n\
  \n\n\n### 监督学习与无监督学习\n\n机器学习功能定义了一类可通过机器学习进行建模和解决的问题。这些机器学习功能通常分为两类：监督式机器学习与无监督式机器学习。\n\
  \n监督式机器学习过程由预先已知的目标输出及其依赖的输入属性所引导。模型基于已知数据集，将目标值建立为一组独立属性的函数。构建此监督式学习模型涉及模型训练、模型测试和模型评分。\n\
  \n*   **模型训练**：此过程分析一组已知目标和属性的案例数据。在训练过程中，模型学习将目标作为属性的函数。例如，模型训练过程基于已知信用评分的数据集以及这些属性值，将客户信用评分建立为财富、收入、职业、家庭规模和职业历史等属性的函数。\n\
  \n*   **模型测试**：此过程将模型应用于已知的测试数据集，并将模型生成的目标值与已知目标值进行比较，以确定模型的准确性。在上一个例子中，模型被应用于测试数据并生成目标值：客户信用评分。然后将生成的客户信用评分与测试数据中实际已知的客户信用评分进行比较。\n\
  \n*   **模型评分**：此过程将模型应用于实际数据（称为*评分数据*），以预测评分数据中未知的目标值。在上一个例子中，模型评分过程将模型应用于新客户。它根据这些新客户的财富、收入、职业、家庭规模和职业历史来预测其信用评分。\n\
  \nOracle Machine Learning 支持以下监督式学习功能。\n\n*   **属性重要性**：此功能识别并排序在预测目标属性时更为重要的属性；例如，对收入和职业等属性进行排序，以确定客户的信用评分。按重要性排序有助于在分类和回归模型的模型训练中选择更重要的属性。Oracle\
  \ Machine Learning 不支持属性重要性功能的模型评分操作（应用模型）。\n\n*   **分类**：此功能确定对象属于哪个类别。例如，针对一组客户的给定人口统计和个人数据，预测客户是否会购买某些产品。\n\
  \n*   **回归**：此功能预测与对象相关的连续值属性。例如，根据客户的人口统计数据，预测客户在促销活动期间的消费金额。\n\n无监督式学习过程不受引导。当您不知道目标输出应该是什么时，会使用它。在无监督学习中，没有预先已知的结果来训练模型和测试模型。无监督学习可用于描述性或预测性目的。Oracle\
  \ Machine Learning 支持以下无监督式学习功能。\n\n*   **异常检测**：它判断案例是否符合正常案例的特征，例如确定客户的购买模式是否与同类客户中的正常模式不同。\n\
  \n*   **关联规则**：它识别数据内部的关联模式，例如客户倾向于一起购买的产品。\n\n*   **聚类**：它将彼此相似的项分组；例如，它将投票给某个特定候选人的选民分组。\n\
  \n*   **特征提取**：它使用原始属性的线性组合创建新的属性。\n\nOracle Machine Learning 支持聚类和特征提取的模型评分操作，但不支持关联规则的评分操作。关联模型不能应用于分离的数据。相反，它们可以解释或返回关于项和事件如何相互关联的规则。\n\
  \n为了构建机器学习模型，Oracle Machine Learning 为每个机器学习功能支持至少一个或多个称为*算法*的数学过程。表 6-1 列出了 Oracle\
  \ Machine Learning 为其对应的机器学习功能支持的机器学习算法。\n\n表 6-1\n\nOracle Machine Learning 功能与算法\n\
  \n| 功能 | 类型 | 算法 |\n| --- | --- | --- |\n| 属性重要性 | 监督式学习 | 最小描述长度 |\n| 分类 | 监督式学习\
  \ | 决策树、显式语义分析、朴素贝叶斯、随机森林 |\n| 分类与回归 | 监督式学习 | 广义线性模型、神经网络、支持向量机、XGBoost |\n| 异常检测\
  \ | 无监督式学习 | CUR 矩阵分解、多元状态估计技术 – 序贯概率比检验、单类支持向量机 |\n| 关联规则 | 无监督式学习 | Apriori、*k*-均值\
  \ |\n| 聚类 | 无监督式学习 | 期望最大化 |\n| 特征提取 | 无监督式学习 | 显式语义分析 |\n\n每种算法的详细描述见 *Oracle Machine\
  \ Learning for SQL Concepts, 21c*，F31930-05，2021 年 6 月，Oracle 公司。（URL：[`https://docs.oracle.com/en/database/oracle/machine-learning/oml4sql/21/dmcon/index.html`](https://docs.oracle.com/en/database/oracle/machine-learning/oml4sql/21/dmcon/index.html)）。\n\
  \n### 机器学习流程\n\n一个典型的机器学习过程包含以下主要阶段。\n\n*   **业务问题定义**：这个初始阶段涉及获取业务问题需求，评估机器学习项目的目标。为了理解项目目标和需求，您可以定义机器学习问题并制定项目计划。\n\
  \n*   **数据收集与准备**：一旦确定了业务需求，下一步是确保有高质量的数据可用于解决业务问题。此阶段包括数据收集、数据清洗与质量检查、数据探索、数据分析、数据采样和数据转换。它还包括特征或属性选择，以及将数据集拆分为训练数据和测试数据。\n\
  \n*   **模型训练**：此阶段使用选定的机器学习算法，通过理解数据模式并从模式中提取洞察来创建机器学习模型。此过程基于训练数据集训练模型。在监督式学习中，模型将目标属性建立为其依赖属性的函数。\n\
  \n*   **模型评估与测试**：新创建的模型需要测试其准确性，并进行评估以查看该模型是否能满足业务问题的需求。测试模型的一种方法是将模型应用于测试数据，然后将模型生成的目标值与测试数据的实际目标值进行比较。\n\
  \n*   **模型评分与应用**：在模型通过评估和测试后，可以将模型应用于新数据，以生成先前未知的新目标值。模型应用也可以部署到业务应用环境中。例如，预测客户信用评分的模型评分可以部署在客户信用卡审批应用中。\n\
  \n接下来的部分将讨论如何在 Oracle Machine Learning 环境中，使用 Oracle Autonomous Database 执行机器学习过程的这些主要阶段。\n\
  \n\n\n## Oracle 机器学习 for SQL\n\nOracle 自治数据库（如 ADW）支持数据库内机器学习。所有机器学习功能均在 Oracle\
  \ 数据库内部实现，在本例中即为 ADW。这种数据库内机器学习是通过 Oracle 机器学习 for SQL（OML4SQL）实现的。\n\nOML4SQL 作为\
  \ Oracle 数据库内核的一部分实现，可用于本地 Oracle 数据库和 Oracle 自治数据库（如 ADW）。因此，当您在 Oracle 云基础设施中配置\
  \ ADW 时，该 ADW 的数据库内核已完全配备 OML4SQL。OML4SQL 模型作为可导出的**一等数据库对象**存储。当您使用 OML4SQL 执行机器学习任务时，可以充分利用最大可扩展性和\
  \ Oracle 数据库系统资源。\n\n如表 6-1 所示，OML4SQL 提供了一组数据库内机器学习算法，可实现各种机器学习功能，例如分类、回归、特征选择、聚类、异常检测和特征提取。这些机器学习算法可以直接处理\
  \ ADW 中的数据，例如星型模式数据、事务数据和其他形式的非结构化数据。因此，您无需将大量数据从 ADW 复制并转换到另一个机器学习平台。通过消除数据移动并仅在\
  \ ADW 中保留一份数据副本，数据集始终受到 ADW 广泛安全功能的保护。只有具有特定数据库权限的用户才能访问数据并执行相关的 OML4SQL 任务。\n\n\
  ### OML4SQL PL/SQL API 和 SQL 函数\n\n您可以通过其应用程序编程接口访问 Oracle 数据库中的 OML4SQL 功能：PL/SQL\
  \ API 和 SQL 语言运算符/函数。\n\nPL/SQL API 由一组用于构建和维护模型的 PL/SQL 包组成。一个常用的 PL/SQL 包是 `DBMS_DATA_MINING`\
  \ 包，其中包含用于构建、测试和维护机器学习模型的例程。SQL 语言运算符和 SQL 函数广泛用于数据准备和模型评分阶段。接下来，我们将讨论使用 Oracle\
  \ 数据库进行数据库内机器学习的各个阶段，以及这些阶段中 OML4SQL API 和 SQL 函数的使用。\n\n### 数据准备与数据转换\n\n通常，机器学习项目会访问\
  \ Oracle 数据库中单个表或视图中定义的数据。数据准备的第一步是确保数据存储在数据库表或视图中，并且每个案例的信息存储在表或视图的单行中。如果信息分布在多个表中，您可以创建一个连接这些表的视图。\n\
  \n#### 拆分数据\n\n您可以使用数据库视图来拆分数据集。对于分类和回归，应准备两个数据集。一个数据集（构建数据）用于训练模型，另一个数据集（测试数据）用于测试模型。两个数据集应源自同一数据。例如，您可以创建两个视图，分别随机选择\
  \ 60% 和 40% 的行作为构建数据集和测试数据集，如清单 6-1 所示。\n\n```\ncreate or replace view credit_scoring_build_v\
  \ as select * from admin.credit_scoring sample (60);\ncreate or replace view credit_scoring_test_v\
  \ as select * from admin.credit_scoring sample (40);\n清单 6-1\n使用视图拆分数据\n```\n\n\
  #### 数据转换\n\n数据分析师通常需要在数据准备期间，通过执行一些数据转换来分析数据，然后才能使用数据构建模型。这些数据转换包括对数值数据进行分箱、处理缺失值以及选择用于模型构建的\
  \ Top N 属性（特征选择）。数据转换通过修改数据集（表）的一个或多个列的 SQL 表达式完成。OML4SQL 通过自动数据准备（ADP）自动完成大部分此类转换。通过\
  \ ADP，这些转换被嵌入模型中，并在应用模型时自动执行。您还可以使用 SQL 表达式指定额外的转换，作为模型创建过程的输入。\n\n#### 转换表达式\n\n\
  OML4SQL API 提供了 `DBMS_DATA_MING_TRANSFORM` 包，用于机器学习中常用的转换操作。该包提供了两种实现转换的方法。\n\n\
  一种方法是创建转换表达式列表，并将该列表传递给 `CREATE_MODEL` 过程。此转换列表可以使用 `SET_TRANSFORM` 过程创建。以下是此方法的一个示例。声明一个转换表达式列表\
  \ `v_xlst`，并使用 `dbms_data_mining_transform.set_transform` 过程构建它。然后，通过 `xform_list`\
  \ 参数将此列表传递给 `DBMS_DATA_MINING.CREATE_MODEL` 模型创建过程，如清单 6-2 所示。\n\n```\ndeclare\n\
  v_xlst dbms_data_mining_transform.TRANSFORM_LIST;\nBEGIN\ndbms_data_mining_transform.set_transform(v_xlst,\n\
  'HOME_THEATER_PACKAGE', NULL, 'HOME_THEATER_PACKAGE',\n'HOME_THEATER_PACKAGE', 'FORCE_IN');\n\
  DBMS_DATA_MINING.CREATE_MODEL(\nmodel_name          => 'GLMR_SH_Regr_sample',\n\
  mining_function     => dbms_data_mining.regression,\ndata_table_name     => 'mdb_rdemo_v',\n\
  case_id_column_name => 'cust_id',\ntarget_column_name  => 'age',\nsettings_table_name\
  \ => 'glmr_sh_sample_settings',\nxform_list          => v_xlst);\nEND;\n清单 6-2\n\
  通过模型创建过程传递转换表达式列表\n```\n\n#### 分箱转换\n\n第二种方法是创建一个实现转换的视图，并将该视图的名称传递给 `CREATE_MODEL`\
  \ 过程。以下示例展示了如何创建一个名为 `'mining_data_bin_view'` 的视图来实现分箱转换，如清单 6-3 所示。\n\n```\ndbms_data_mining_transform.create_bin_num(\n\
  bin_table_name     => 'bin_num_tbl');\ndbms_data_mining_transform.insert_autobin_num_eqwidth(\n\
  bin_table_name     => 'bin_num_tbl',\ndata_table_name  => 'CREDIT_SCORING_100K_V',\n\
  bin_num            => 5,\nmax_bin_num        => 10,\nexclude_list       => );\n\
  dbms_data_mining_transform.COLUMN_LIST('CUSTOMER_ID'));\ndbms_data_mining_transform.xform_bin_num(\n\
  bin_table_name      => 'bin_num_tbl',\ndata_table_name     => 'CREDIT_SCORING_100K_V',\n\
  xform_view_name     => 'mining_data_bin_view');\n清单 6-3\n分箱转换\n```\n\n这种分箱转换，也称为*离散化*，是机器学习中常用的转换之一。它是一种降低数据基数的技术。通过将相关值分组到箱中，它减少了数据集属性的不同值的数量。ADP\
  \ 使用默认或用户可自定义的分箱策略（例如等宽、等频和用户定义的箱）自动对数值属性进行分箱。创建分箱视图后，此 SQL 查询将在 OML Notebooks 中的分箱视图\
  \ `mining_data_bin_view` 上运行（参见清单 6-4）。\n\n```\nSelect customer_id, age, income,\
  \ education_level from ming_data_bin_view;\n清单 6-4\nmining_data_bin_view 查询\n```\n\
  \n通过在笔记本的“键”字段中选择“年龄”，在“值”字段中选择“客户 ID 计数”，图 6-1 显示了按每个年龄分箱组的客户数量直方图。\n\n![../images/499897_1_En_6_Chapter/499897_1_En_6_Fig1_HTML.jpg](img/499897_1_En_6_Fig1_HTML.jpg)\n\
  \n图 6-1\n\n按年龄分箱组的客户数量直方图\n\n\n\n### 模型创建\n\nOML4SQL 提供了 `DBMS_DATA_MINING.CREATE_MODEL`\
  \ 过程用于机器学习模型的创建。如下代码所示，`CREATE_MODEL` 过程接收一组参数作为输入来创建一个机器学习模型，如代码清单 6-5 所示。\n\n\
  ```\nPROCEDURE CREATE_MODEL(\nmodel_name IN VARCHAR2,\nmining_function IN VARCHAR2,\n\
  data_table_name IN VARCHAR2,\ncase_id_column_name IN VARCHAR2,\ntarget_column_name\
  \ IN VARCHAR2 DEFAULT NULL,\nsettings_table_name IN VARCHAR2 DEFAULT NULL,\ndata_schema_name\
  \ IN VARCHAR2 DEFAULT NULL,\nsettings_schema_name IN VARCHAR2 DEFAULT NULL,\nxform_list\
  \ IN TRANSFORM_LIST DEFAULT NULL);\n代码清单 6-5\n模型创建过程\n```\n\n因此，在调用 `CREATE_MODEL`\
  \ 过程之前，你需要准备好这些参数。\n\n1.  为 `mining_function` 参数确定机器学习函数和算法的名称。OML4SQL 支持的各种机器学习函数和算法如表\
  \ 6-1 所示。\n\n2.  为 `data_table_name` 参数准备模型训练数据集。例如，我们创建了一个视图，提取了 60% 的数据集用于模型训练。\n\
  \n3.  确定目标属性。例如，监督学习将目标属性预测为依赖于其他属性。目标属性通过 `target_column_name` 参数传递给 `CREATE_MODEL`\
  \ 过程。\n\n4.  指定模型设置。这些是用于机器学习模型创建的配置设置。这些模型设置可以在一个包含两列（`setting_name` 和 `setting_values`）的设置表中指定。部分设置用于机器学习模型函数，部分设置用于机器学习算法。设置表通过\
  \ `settings_table_name` 参数传递给 `CREATE_MODEL` 过程。\n\n5.  指定转换列表。这个转换表达式列表指定了模型创建所需的属性值转换。该列表通过\
  \ `xform_list` 参数传递给模型创建过程。\n\n`CREATE_MODEL` 过程使用数据，结合模型函数/算法以及其他传递给该过程的参数，来创建一个机器学习模型。创建的模型是一个数据库表，其名称由过程中的\
  \ `model_name` 参数指定。\n\n你可以使用以下示例代码来调用模型创建过程，如代码清单 6-6 所示。\n\n```\ndeclare\nv_xlst\
  \ dbms_data_mining_transform.TRANSFORM_LIST;\nBEGIN\ndbms_data_mining_transform.set_transform(v_xlst,\n\
  'HOME_THEATER_PACKAGE', NULL, 'HOME_THEATER_PACKAGE',\n'HOME_THEATER_PACKAGE', 'FORCE_IN');\n\
  DBMS_DATA_MINING.CREATE_MODEL(\nmodel_name          => 'GLMR_SH_Regr_sample',\n\
  mining_function     => dbms_data_mining.regression,\ndata_table_name     => 'mdb_rdemo_v',\n\
  case_id_column_name => 'cust_id',\ntarget_column_name  => 'age',\nsettings_table_name\
  \ => 'glmr_sh_sample_settings',\nxform_list          => v_xlst);\nEND;\n代码清单 6-6\n\
  模型创建过程示例\n```\n\n### 模型评估\n\n一旦基于训练数据集通过模型训练过程创建了模型，你就可以评估模型的准确性。对于监督式机器学习模型（例如分类模型），由于数据集中包含已知的目标值，你可以将新创建的模型应用于测试数据，然后将模型的预测结果与测试数据中的目标值进行比较。\n\
  \n此模型评估包含两个步骤：模型应用和结果比较。\n\n#### 模型应用\n\n此步骤将模型应用于测试数据以生成预测结果。`DBMS_DATA_MINING`\
  \ 包中的 `APPLY` 过程用于将模型应用于测试数据表，并将模型结果写入结果表。`DBMS_DATA_MINING.APPLY` 过程的语法如代码清单 6-7\
  \ 所示。\n\n```\nDBMS_DATA_MINING.APPLY (\nmodel_name IN VARCHAR2,\ndata_table_name\
  \ IN VARCHAR2,\ncase_id_column_name IN VARCHAR2,\nresult_table_name IN VARCHAR2,\n\
  data_schema_name IN VARCHAR2 DEFAULT NULL);\n代码清单 6-7\n模型应用过程\n```\n\n以下是该过程的参数。\n\
  \n*   `model_name`：模型的名称\n*   `data_table_name`：包含待测试数据的表或视图的名称\n*   `case_id_column_name`：案例标识符列的名称\n\
  *   `result_table_name`：用于存储应用结果的表的名称\n*   `data_schema_name`：包含待评分数据的模式名称\n\n通过在\
  \ OML Notebooks 中执行以下过程，将 'N1_CLASS_MODEL' 模型应用于 'N1_TEST_DATA' 测试数据表，从而产生存储在 'N1_APPLY_RESULT'\
  \ 表中的结果（参见代码清单 6-8）。\n\n```\nDBMS_DATA_MINING.APPLY(\nmodel_name         => 'N1_CLASS_MODEL',\n\
  data_table_name     => 'N1_TEST_DATA',\ncase_id_column_name => 'CUSTOMER_ID',\n\
  result_table_name   => 'N1_APPLY_RESULT');\n代码清单 6-8\n模型应用过程示例\n```\n\n\n\n####\
  \ 结果比较\n\n此步骤将模型应用的结果与实际目标值进行比较。作为进行比较的一种方式，`DBMS_DATA_MINING` 包中的 `COMPUTE_LIFT`\
  \ 过程旨在计算提升度，这是一种用于二分类模型的测试指标。`COMPUTE_LIFT` 将模型生成的预测与测试数据集中的实际目标值进行比较。提升度衡量模型的预测比随机猜测好多少。该过程的语法如代码清单\
  \ 6-9 所示。\n\n```\nDBMS_DATA_MINING.COMPUTE_LIFT (\napply_result_table_name =>  \
  \    'N1_APPLY_RESULT'\ntarget_table_name       => 'N1_TEST_DATA'\ncase_id_column_name\
  \     => 'CUSTOMER_ID'\ntarget_column_name      => 'CREDIT_SCORE_BIN'\nlift_table_name\
  \         =>  'N1_LEFT_TABL\npositive_target_value   =>  'GOOD CREDIT'\nscore_column_name\
  \       =>       'PREDICTION',\nscore_criterion_column_name =>'PROBABILITY',\nnum_quantiles\
  \               => 100)\n代码清单 6-9\nCOMPUTE_LIFT 过程\n```\n\n该过程中的参数包括以下内容。\n\n* \
  \  `apply_result_table_name`：用于存储应用结果表的名称\n*   `target_table_name`：存储测试数据集的表的名称\n\
  *   `case_id_column_name`：案例标识符列的名称。\n*   `target_column_name`：目标列的名称\n*   `lift_table_name`：提升度表的名称\n\
  *   `positive_target_value`：正目标的值\n*   `score_column_name`：表示应用结果表中得分的列名；默认值为 'PREDICTION'\n\
  *   `score_criterion_column_name`：表示应用结果表中得分排序因子的列名；默认值为 'PROBABILITY'\n*   `num_quantiles`：提升度表中所需的分位数数量\n\
  \n在代码清单 6-10 中，查询 `N1_LIFT_TABLE` 以查看模型评估结果。\n\n```\nSelect QUANTITLE_NUMBER, GAIN_CUMMULATIVE\
  \ from N1_LIFT_TABLE;\n代码清单 6-10\n查询提升度表\n```\n\n在 OML Notebooks 的图形显示选项中，这些查询结果显示为增益和提升度图。该图表通过计算使用模型和未使用模型所得结果之间的比率来衡量分类模型的有效性。该图表为评估分类模型的性能提供了可视化辅助。如图\
  \ 6-2 所示，该图表由模型的提升度曲线和基线（随机）组成。提升度曲线与基线之间的面积越大，模型越好。\n\n![../images/499897_1_En_6_Chapter/499897_1_En_6_Fig2_HTML.jpg](img/499897_1_En_6_Fig2_HTML.jpg)\n\
  \n图 6-2\n\n增益和提升度图\n\n在此示例中，对 `NI_LIFT_TABLE` 的查询结果显示为增益和提升度图，如图 6-3 所示。曲线与直线基线之间的面积大小表明了模型的有效性。\n\
  \n![../images/499897_1_En_6_Chapter/499897_1_En_6_Fig3_HTML.jpg](img/499897_1_En_6_Fig3_HTML.jpg)\n\
  \n图 6-3\n\n增益和提升度图显示了模型的有效性\n\n### 模型评分与模型部署\n\n模型评分，也称为*模型应用*，是将模型应用于新数据的过程。一旦基于现有的已知数据集创建并评估了模型，就可以将模型应用于新数据以预测新的目标结果。\n\
  \n使用 OML4SQL，模型评分通过 SQL 语言函数在数据库中进行。`PREDICTION` 函数用于分类、回归和异常检测。以下查询是一个示例，展示了如何使用\
  \ `PREDICTION` 函数应用模型，如代码清单 6-11 所示。\n\n```\nSELECT cust_gender, COUNT(*) AS cnt,\
  \ ROUND(AVG(age)) AS avg_age\nFROM new_data_v\nWHERE PREDICTION(dt_sh_clas_sample\
  \ USING *) = 1\nGROUP BY cust_gender\nORDER BY cust_gender;\n代码清单 6-11\n使用预测函数\n\
  ```\n\n`PREDICTION` 使用 `USING` 子句来指定用于评分的属性。在此示例中，`USING *` 表示选择所有属性作为预测变量。您也可以仅指定部分属性作为预测变量。在代码清单\
  \ 6-12 所示的查询中，客户的性别、婚姻状况、职业和收入水平被用作预测变量。\n\n```\nSELECT cust_gender, COUNT(*) AS\
  \ cnt, ROUND(AVG(age)) AS avg_age\nFROM new_data_v\nWHERE PREDICTION(dt_sh_clas_sample\
  \ USING *) = 1\nGROUP BY cust_gender\nORDER BY cust_gender;\n代码清单 6-12\n预测函数示例\n\
  ```\n\n```\nSELECT cust_gender, COUNT(*) AS cnt, ROUND(AVG(age)) AS avg_age\nFROM\
  \ mining_data_apply_v\nWHERE PREDICTION(dt_sh_clas_sample USING\ncust_gender,cust_marital_status,\n\
  occupation, cust_income_level) = 1\nGROUP BY cust_gender\nORDER BY cust_gender;\n\
  ```\n\n该查询还支持将缺失属性和表达式作为预测变量。此查询使用客户性别、婚姻状况和职业作为预测变量。它使用一个表达式假设所有客户的收入水平都在 30 万美元或更高，如代码清单\
  \ 6-13 所示。\n\n```\nSELECT cust_gender, COUNT(*) AS cnt, ROUND(AVG(age)) AS avg_age\n\
  FROM mining_data_apply_v\nWHERE PREDICTION(dt_sh_clas_sample USING\ncust_gender,\
  \ cust_marital_status, occupation,\n'L: 300,000 and above' AS cust_income_level)\
  \ = 1\nGROUP BY cust_gender\nORDER BY cust_gender;\nC CNT AVG_AGE\n- ----------\
  \ ----------\nF 30 38\nM 186 43\n代码清单 6-13\n带表达式的预测函数示例\n```\n\n`PREDICTION_PROBABILITY`\
  \ 是另一个可以应用模型的 SQL 函数。该函数通过将模型应用于新数据来预测概率。图 6-4 所示的查询将模型应用于单个记录，以预测一位财富等级为“富裕”、收入为\
  \ 2000 美元、客户价值细分等级为“银牌”的新客户拥有“良好信用”的概率。\n\n![../images/499897_1_En_6_Chapter/499897_1_En_6_Fig4_HTML.jpg](img/499897_1_En_6_Fig4_HTML.jpg)\n\
  \n图 6-4\n\n概率预测\n\n模型评分也可以通过 `DBMS_DATA_MINING.APPLY` 过程执行。在模型测试部分，我们讨论了如何使用此 `APPLY`\
  \ 过程来测试数据以获得预测结果。该方法同样适用于将模型应用于新数据。`APPLY` 过程生成与使用 SQL 评分函数评分相同的结果，并为分类、异常检测、聚类机器学习函数创建一个包含\
  \ `CASE_ID`、`PREDICTION`、`PROBABILITY` 列的结果输出表。对于回归函数，此结果表包含 `CASE_ID`、`PREDICTION`\
  \ 列；对于特征提取函数，此表包含 `CASE_ID`、`FEATURE_ID` 和 `MATCH_QUALIFY` 列。\n\n在代码清单 6-14 中，`APPLY`\
  \ 过程将 `N1_CLASS_Model` 模型应用于以 `CUSTOMER_ID` 作为案例 ID 的新 `N1_NEW_DATA` 数据集表。结果，该过程生成了\
  \ `N1_NEW_RESULT` 表。\n\n\n\n```\nExec DBMS_DATA_MINING.APPLY ('N1_CLASS_MODEL',\
  \ 'N1_NEW_DATA', 'CUSTOMER_ID','N1_NEW_RESULT')\n清单 6-14\n将模型应用于新数据\n```\n\n清单 6-15\
  \ 查询结果表，以查看每个客户 ID 的概率。\n\n```\nSelect CUSTOMER_ID,PREDICATION,PROBABILITY     \
  \ from N1_NEW_RESULT;\n清单 6-15\n查询概率\n```\n\n为了利用模型的结果，这些模型通常部署在生产应用程序环境中。借助用于模型评分的\
  \ SQL 函数和 `DATA_MINING.APPLY`，OML4SQL 支持将模型部署到各种应用程序生产环境中，并实现实时和批量模型评分。模型的应用可能包括提取模型的详细结果以生成报告，或通过整合预测结果来扩展商业智能，以及将模型从模型训练数据库导出/导入到模型评分数据库环境。\n\
  \n## 机器学习项目示例\n\n本章的其余部分将介绍在 ADW Oracle 机器学习环境中构建和应用机器学习模型的示例。我们使用预加载在 ADW 数据库中的示例模式。此示例使用的所有\
  \ SQL 查询和 PL/SQL 脚本都记录在代码库中，您可以下载并在自己的 ADW OML 环境中执行。\n\n创建 ADW 数据库后，它会附带 SH 模式，其中包含图\
  \ 6-5 中使用 SQL Developer 显示的预加载表。\n\n![../images/499897_1_En_6_Chapter/499897_1_En_6_Fig5_HTML.jpg](img/499897_1_En_6_Fig5_HTML.jpg)\n\
  \n图 6-5\n\nADW 数据库中的 SH 模式\n\n带有 ADW 的 Oracle 机器学习笔记本可以访问这些表。您可以通过 OML 笔记本对 ADW\
  \ 数据库执行 SQL 语句和 PL/SQL 脚本。OML 笔记本的可视化功能可根据通过 SQL 查询从 ADW 数据库获取的结果数据，提供各种图形化展示。\n\
  \n## 分类预测示例\n\n本示例使用分类决策树函数构建一个模型，该模型根据客户信息预测客户是否可能购买家庭影院套餐。此监督学习模型基于存储在 ADW 数据库中的已知样本数据构建。\n\
  \n### 数据准备与数据转换\n\n本示例使用 ADW 数据库中示例 SH 模式的一个 `SUPPLEMENTARY_DEMOGRAPHICS` 表。用于模型构建的每个案例的信息都存储在该表的一行中。该表有\
  \ 14 列，如图 6-6 所示。每一列对应案例的一个属性。\n\n![../images/499897_1_En_6_Chapter/499897_1_En_6_Fig6_HTML.jpg](img/499897_1_En_6_Fig6_HTML.jpg)\n\
  \n图 6-6\n\n`SUPPLEMENTARY_DEMOGRAPHICS` 表结构\n\n目标属性 `home_theater_package` 的值为 1\
  \ 或 0，用于定义客户是否会购买家庭影院套餐。所有案例（表中的行）的目标属性（列）都具有已知的 0 或 1 值。\n\n让我们开始探索 `SUPPLEMENTARY_DEMOGRAPHICS`\
  \ 表中的数据。为了探索目标数据分布，请在 OML 笔记本中执行以下查询以获取清单 6-16 中的数据。\n\n```\nselect cust_id, HOME_THEATER_PACKAGE\
  \ from sh.supplementary_demographics;\n清单 6-16\n在 OML 笔记本中获取数据\n```\n\n为了可视化数据，请按如下方式调整\
  \ OML 笔记本中的显示设置。\n\n1.  单击条形图图标并展开设置。\n2.  将 `HOME_THEATER_PACKAGE` 拖到键中，将 `CUST_ID`\
  \ 拖到值中。组中应无内容。\n3.  单击值中的 `CUST_ID` 并选择计数。\n\nOML 笔记本通过 `CUST_ID` 计数显示目标 `home_theater_package`\
  \ 值在 0 和 1 之间的分布，如图 6-7 所示。\n\n![../images/499897_1_En_6_Chapter/499897_1_En_6_Fig7_HTML.jpg](img/499897_1_En_6_Fig7_HTML.jpg)\n\
  \n图 6-7\n\n`Home_theater_package` 目标值分布\n\n类似地，清单 6-17 中的查询显示了按 `HOME_THEATER_PACKAGE`\
  \ 列分组的 `YRS_RESIDENCE`、`Y_BOX_GAMES` 列的客户数量图形分布。\n\n```\nSELECT COUNT(CUST_ID) AS\
  \ NUM_CUSTOMERS, Y_BOX_GAMES, YRS_RESIDENCE, HOME_THEATER_PACKAGE\nFROM SH.SUPPLEMENTARY_DEMOGRAPHICS\n\
  GROUP BY Y_BOX_GAMES, YRS_RESIDENCE, HOME_THEATER_PACKAGE\n清单 6-17\n获取图形分布信息\n```\n\
  \n图 6-8 显示了按组显示客户数量分布的过程。\n\n![../images/499897_1_En_6_Chapter/499897_1_En_6_Fig8_HTML.jpg](img/499897_1_En_6_Fig8_HTML.jpg)\n\
  \n图 6-8\n\n按组划分的客户数量分布\n\n1.  单击条形图图标并展开设置。\n2.  将 `Y_BOX_GAMES` 和 `YRS_RESIDENCE`\
  \ 拖到键中。将 `HOME_THEATER_PACKAGE` 拖到组中。\n3.  单击值中的 `NUM_CUSTOMERS` 并选择总和。\n4.  单击堆叠按钮。\n\
  \n为了准备数据，我们基于 `SH.SUPPLEMENTARY_DEMOGRAPHICS` 创建了一个视图 `DEMOGRAPHICS_HTP_V`，如清单 6-18\
  \ 所示。\n\n```\n%sql\nCREATE OR REPLACE VIEW DEMOGRAPHICS_HTP_V\nAS (SELECT AFFINITY_CARD,\
  \ BOOKKEEPING_APPLICATION,\nBULK_PACK_DISKETTES, CUST_ID,EDUCATION, FLAT_PANEL_MONITOR,\n\
  HOME_THEATER_PACKAGE, HOUSEHOLD_SIZE,OCCUPATION,\nOS_DOC_SET_KANJI, PRINTER_SUPPLIES,\
  \ YRS_RESIDENCE,\nY_BOX_GAMES\nFROM SH.SUPPLEMENTARY_DEMOGRAPHICS);\n清单 6-18\n创建\
  \ `DEMOGRAPHICS_HTP_V` 视图\n```\n\n基于此视图，数据被随机分成两部分：60% 用于训练数据（`N1_TRAIN_DATA` 视图），40%\
  \ 用于测试数据（`N1_TEST_DATA`），如清单 6-19 所示。\n\n```\nCREATE OR REPLACE VIEW N1_TRAIN_DATA\
  \ AS SELECT * FROM DEMOGRAPHICS_HTP_V SAMPLE (60) SEED (1);\nCREATE OR REPLACE VIEW\
  \ N1_TEST_DATA AS SELECT * FROM DEMOGRAPHICS_HTP_V MINUS SELECT * FROM N1_TRAIN_DATA;\n\
  清单 6-19\n使用视图准备训练和测试数据\n```\n\n### 预测属性重要性\n\nOM4SQL 在 `DBMS_PREDICTIVE_ANALYTICS`\
  \ 包中提供了 `EXPLAIN` 函数，用于分析并创建属性重要性模型。该函数使用最小描述长度算法来分析属性在预测目标值时的相对重要性。清单 6-20 中的 `EXPLAIN`\
  \ 函数创建了一个新的结果表，该表保存了按对预测影响的相对顺序排列的属性列表。\n\n```\nBEGIN\nDBMS_PREDICTIVE_ANALYTICS.EXPLAIN(\n\
  data_table_name        => 'DEMOGRAPHICS_HTP_V',\nexplain_column_name    => 'HOME_THEATER_PACKAGE',\n\
  result_table_name      => 'EXPLAN_RESULTS');\nEND;\n清单 6-20\n`EXPLAIN` 函数\n```\n\
  \n如清单 6-20 所示，结果表是 `EXPLAIN_RESULTS`。清单 6-21 是一个简单的 SQL 查询，列出了前 N（N=6）个属性。\n\n```\n\
  select * from ai_explain_output_HOME_THEATER_PACKAGE where rownum<7;\n清单 6-21\n\
  查询前六个属性\n```\n\n将 `EXPLAINATORY_VALUE` 拖到值中并选择总和。将 `ATTRIBUTE_NAME` 拖到键中。条形图显示了按预测目标\
  \ `HOME_THEATER_PACKAGE` 值的重要性（`EXPLAINATORY_VALUE`）排序的前六个属性。条形图可以按重要性显示前六个属性，如图\
  \ 6-9 所示。\n\n![../images/499897_1_En_6_Chapter/499897_1_En_6_Fig9_HTML.jpg](img/499897_1_En_6_Fig9_HTML.jpg)\n\
  \n图 6-9\n\n按重要性排序的前六个属性\n\n\n\n### 模型创建\n\n你可以通过执行 OML Notebooks 中清单 6-22 所示的 PL/SQL\
  \ 脚本，利用 N1_TRAIN_DATA 表中的训练数据来构建机器学习模型。\n\n```\n%script\nBEGIN\nDBMS_DATA_MINING.DROP_MODEL('HTP_CLASS_MODEL');\n\
  EXCEPTION WHEN OTHERS THEN NULL;\nEND;\n/\nBEGIN\nEXECUTE IMMEDIATE 'CREATE TABLE\
  \ N1_BUILDING_SETTINGS\n(setting_name varchar2(30), setting_value varchar2(4000))';\n\
  EXECUTE IMMEDIATE 'INSERT INTO N1_BUILDING_SETTINGS  values\n(''PREP_AUTO'', ''ON'')';\n\
  EXECUTE IMMEDIATE 'INSERT INTO N1_BUILDING_SETTINGS  values\n(''ALGO_NAME'', ''ALGO_DECISION_TREE'')';\n\
  DBMS_DATA_MINING.CREATE_MODEL(\nmodel_name      => 'HTP_CLASS_MODEL',\nmining_function\
  \ => 'CLASSIFICATION',\ndata_table_name  => 'N1_TRAIN_DATA',\nsettings_table_name\
  \ => 'N1_BUILDING_SETTINGS',\ncase_id_column_name => 'CUST_ID',\ntarget_column_name\
  \ => 'HOME_THEATER_PACKAGE');\nEND;\n清单 6-22\n执行模型创建 PL/SQL 脚本\n```\n\n此脚本会创建一个模型，该模型存储在\
  \ HTP_CLASS_MODEL 表中。\n\n另一种方法是使用 `CREATE_MODEL2` 过程来创建模型。此过程允许我们在不创建输入表的持久表或视图（例如\
  \ N1_TRAIN_DATA）的情况下创建模型。相反，你可以通过 `data_query` 参数将查询传递给 `CREATE_MODEL2` 过程，如清单 6-23\
  \ 所示。\n\n```\nSELECT * FROM DEMOGRAPHICS_HTP_V SAMPLE (60) SEED (1)\n清单 6-23\n向\
  \ CREATE_MODEL2 过程传递查询\n```\n\n示例代码见清单 6-24。\n\n```\n%script\nBEGIN DBMS_DATA_MINING.DROP_MODEL('HTP_CLASS_MODEL');\n\
  EXCEPTION WHEN OTHERS THEN NULL; END;\n/\nDECLARE\nv_setlst DBMS_DATA_MINING.SETTING_LIST;\n\
  BEGIN\nv_setlst('PREP_AUTO') := 'ON';\nv_setlst('ALGO_NAME') := 'ALGO_DECISION_TREE';\n\
  DBMS_DATA_MINING.CREATE_MODEL2(\nmodel_name         => 'HTP_CLASS_MODEL',\nmining_function\
  \    => 'CLASSIFICATION',\ndata_query         => 'SELECT * FROM DEMOGRAPHICS_HTP_V\n\
  SAMPLE (60) SEED (1)',\nset_list           => v_setlst,\ncase_id_column_name =>\
  \ 'CUST_ID',\ntarget_column_name => 'HOME_THEATER_PACKAGE');\nEND;\n清单 6-24\n调用\
  \ CREATE_MODEL2 过程的示例\n```\n\n此示例还展示了如何通过对象数据类型变量 `v_setlst`（由 `DBMS_DATA_MINING.SETTING_LIST`\
  \ 数据类型定义）将模型创建设置传递给模型创建过程。\n\n### 模型测试与评估\n\n一旦创建了 HTP_CLASS_MODEL 模型，你就可以通过将其应用于测试数据来测试和评估它。如清单\
  \ 6-25 的 PL/SQL 脚本所示，为了测试和评估新生成的 HTP_CLASS_MODEL 模型，`DBMS_DATA_MINING.APPLY` 过程将该模型应用于\
  \ N1_TEST_DATA 中的测试数据，并生成存储在 HTP_APPLY_RESULT 表中的模型评分结果。\n\n```\nBEGIN\nDBMS_DATA_MINING.APPLY('HTP_CLASS_MODEL','N1_TEST_DATA','CUST_ID','HTP_APPLY_RESULT');\n\
  DBMS_DATA_MINING.COMPUTE_LIFT('HTP_APPLY_RESULT','N1_TEST_DATA','CUST_ID','HOME_THEATER_PACKAGE',\
  \ 'N1_LIFT_TABLE', '1', 'PREDICTION', 'PROBABILITY',100);\nEND;\n清单 6-25\n将模型应用于测试数据\n\
  ```\n\n第二个过程 `DBMS_DATA_MINING.COMPUTE_LIFT` 接收 HTP_APPLY_RESULT 表中的模型评分结果，计算增益和提升结果，并将其存储在\
  \ N1_LIFT_TABLE 表中。要查看模型的提升结果，可以通过清单 6-26 中的 SELECT 语句查询提升表 N1_LIFT_TABLE 来创建累积增益图。\n\
  \n```\nSELECT QUANTILE_NUMBER, GAIN_CUMULATIVE FROM N1_LIFT_TABLE;\n清单 6-26\n查询提升表\n\
  ```\n\n要基于此查询结果创建增益和提升图，在 Notebook 的可视化设置中，使用键中的 `QUANTILE_NUMBER` 和值中的 `GAIN_CUMULATIVE`（总和），且不分组，如图\
  \ 6-10 所示。\n\n![../images/499897_1_En_6_Chapter/499897_1_En_6_Fig10_HTML.jpg](img/499897_1_En_6_Fig10_HTML.jpg)\n\
  \n图 6-10\n\n示例的增益和提升图\n\n让我们将此图与图 6-2 中的标准增益和提升图进行比较，以衡量模型的有效性。提升曲线与基线之间的面积越大，模型效果越好。\n\
  \n通过提升图评估模型准确性后，你可以通过查询 HTP_APPLY_RESULT 表来查看测试数据生成的模型评分结果。清单 6-27 中的查询会获取所有拥有家庭影院套餐概率（PREDICTION=1）大于\
  \ 50% 的客户。\n\n```\nSELECT CUST_ID, PREDICTION PRED, ROUND(PROBABILITY,3) PROBABILITY\n\
  FROM HTP_APPLY_RESULT WHERE PREDICTION = 1 AND PROBABILITY > 0.5\n清单 6-27\n获取模型结果\n\
  ```\n\n你可以使用清单 6-28 中的查询，连接测试数据表 N1_TEST_DATA 和结果表 HTP_APPLY_RESULT，获取所有被预测拥有家庭影院套餐（PREDICTION=1）的客户的相关数据。\n\
  \n```\nSELECT A.*, B.*\nFROM HTP_APPLY_RESULT A, N1_TEST_DATA B\nWHERE PREDICTION\
  \ = ${PREDICTION='1','1'|'0'} AND A.CUST_ID = B.CUST_ID;\n清单 6-28\n连接测试表与结果表\n```\n\
  \n\n\n### 模型应用\n\n在模型应用阶段，模型会被应用于一组新的数据。`N1_NEW_DATA` 表包含了除目标属性 `HOME_THEATER_PACKAGE`\
  \ 值之外的新客户信息。您可以使用该模型，通过清单 6-29 中的查询，预测 `N1_NEW_DATA` 表中每位客户拥有家庭影院套件的概率。\n\n```\n\
  SELECT *\nFROM (SELECT CUST_ID, PREDICTION_PROBABILITY(HTP_CLASS_MODEL, '1'\nUSING\
  \ A.*) PROBABILITY\nFROM N1_NEW_DATA A);\n清单 6-29\n预测新数据的概率\n```\n\n若要预测一组特定客户（例如客户\
  \ ID 为 102837、103434、103459 的客户）的概率，只需运行一个简单的查询，如清单 6-30 所示。\n\n```\nSELECT CUST_ID,\
  \ ROUND(PREDICTION_PROBABILITY(HTP_CLASS_MODEL, '1' USING A.*), 2) PROBABILITY FROM\
  \ N1_NEW_DATA A\nwhere CUST_ID in (102837, 103434, 103459);\n清单 6-30\n预测一组客户的概率\n\
  ```\n\n图 6-11 显示了此查询的结果。\n\n![../images/499897_1_En_6_Chapter/499897_1_En_6_Fig11_HTML.jpg](img/499897_1_En_6_Fig11_HTML.jpg)\n\
  \n图 6-11\n\n预测一组特定客户的概率\n\n同样的查询可以与 `N1_TEST_DATA` 表连接，以预测所有客户的概率，如清单 6-31 所示。\n\
  \n```\nSELECT A.CUST_ID, A.PROBABILITY, B.EDUCATION, B.OCCUPATION, B.HOUSEHOLD_SIZE,\
  \ B.YRS_RESIDENCE, B.Y_BOX_GAMES\nFROM (SELECT * FROM (SELECT CUST_ID,\nROUND(PREDICTION_PROBABILITY(HTP_CLASS_MODEL,\
  \ '1'  USING\nC.*), 2) PROBABILITY FROM N1_NEW_DATA C)) A,\nN1_TEST_DATA B\nWHERE\
  \ A.CUST_ID = B.CUST_ID\nORDER by A.PROBABILITY DESC;\n清单 6-31\n预测所有新客户的概率\n```\n\
  \n图 6-12 显示了 OML Notebooks 中显示的查询及其结果。\n\n![../images/499897_1_En_6_Chapter/499897_1_En_6_Fig12_HTML.jpg](img/499897_1_En_6_Fig12_HTML.jpg)\n\
  \n图 6-12\n\n预测所有新客户的概率\n\n您可以通过使用类似清单 6-32 中的查询填充数据，来创建一个名为 `HTP_NEW_PREDICTION`\
  \ 的新表。\n\n```\nCREATE TABLE HTP_NEW_PREDICTION AS\nSELECT A.CUST_ID, A.PROBABILITY,\
  \ B.EDUCATION, B.OCCUPATION, B.HOUSEHOLD_SIZE, B.YRS_RESIDENCE, B.Y_BOX_GAMES\n\
  FROM (SELECT * FROM (SELECT CUST_ID,\nROUND(PREDICTION_PROBABILITY(HTP_CLASS_MODEL,\
  \ '1' USING\nC.*), 2) PROBABILITY FROM N1_NEW_DATA C)) A ,\nN1_TEST_DATA B\nwhere\
  \ A.CUST_ID = B.CUST_ID;\n清单 6-32\n用预测概率填充新的预测表\n```\n\n然后，您可以通过运行清单 6-33 中的 `SELECT`\
  \ 语句来获取概率值的分布情况。\n\n```\nselect * from HTP_NEW_PREDICTION;\n清单 6-33\n查询新的预测表\n```\n\
  \n您可以将查询结果显示为柱状图，其中键为 `PROBABILITY`，值为 `CUST_ID COUNT`。图 6-13 显示了概率柱状图。\n\n![../images/499897_1_En_6_Chapter/499897_1_En_6_Fig13_HTML.jpg](img/499897_1_En_6_Fig13_HTML.jpg)\n\
  \n图 6-13\n\n按概率划分的客户数量柱状图\n\n## 总结\n\n本章重点介绍了在 Oracle 机器学习环境中，使用 Oracle 自治数据库构建、评估和应用机器学习模型。它介绍了机器学习流程的主要阶段以及两类机器学习函数：监督式机器学习与非监督式机器学习，以及\
  \ Oracle 机器学习支持的相关算法。\n\n我们讨论了如何在机器学习流程的不同阶段（例如数据准备与数据转换、模型创建、模型评估以及模型评分与应用）利用 Oracle\
  \ 机器学习的 SQL 功能（OML4SQL）。我们讨论了一些关键的 OML4SQL API 包，例如 `DBMS_DATA_MINING` 和 `DBMS_DATA_MING_TRANSFORM`，及其相关过程，包括\
  \ `CREATE_MODEL`、`CREATE_MODEL2`、`APPLY` 和 `COMPUTE_LIFT`。我们还讨论了用于模型评分的 SQL 函数，例如\
  \ `PREDICTION` 和 `PREDICTION_PROBABILITY`。\n\n本章的最后一部分通过一个逐步示例，演示了如何使用 ADW 数据库示例模式中的样本数据，通过\
  \ OML4SQL API 和 OML Notebooks 在 ADW 中构建、评估和应用机器学习模型。一旦您注册了 Oracle 云账户并创建了 ADW 数据库实例，您也可以按照此示例在\
  \ ADW OML Notebooks 环境中进行操作。\n\n\n\n# 7. Oracle Analytics Cloud\n\n本章重点介绍 Oracle\
  \ Analytics Cloud。Oracle 拥有三条分析产品线：Oracle Analytics Cloud (OAC)、Oracle Analytics\
  \ Server 和 Oracle Analytics for Applications。Oracle Analytics Desktop 可用于在个人电脑上进行独立的数据探索和可视化。Oracle\
  \ 对分析的愿景是：分析应当是增强的、集成的和协作的。数据准备和可视化是机器学习过程中非常重要的步骤，而 OAC 正是实现这一目标的绝佳工具，尤其是其增强功能。增强分析由机器学习驱动。OAC\
  \ 允许用户从许多不同的数据源（包括 Oracle SaaS 应用程序）添加数据，从而很好地支持集成。\n\nOAC 还允许您创建机器学习模型（ML 模型）、注册并使用在\
  \ Oracle 数据库中创建的 ML 模型，以及基于 ML 模型为新数据集创建场景。它还提供了多种方法，可以轻松高效地准备数据并存储准备好的数据，例如，将其作为\
  \ Oracle 自治数据仓库 (ADW) 中的一张表，用于进一步的机器学习处理。OAC 以多种方式支持协作，包括精细调整的权限以及在不同平台上发布分析结果的可能性。\n\
  \n目前，OAC 有两个版本：Oracle Analytics Cloud 专业版和 Oracle Analytics Cloud 企业版。专业版包含数据分析的所有功能。企业版则包含更多功能，例如数据建模、像素级完美报告以及来自其他产品和环境的不同迁移可能性。\n\
  \nOAC 不属于免费产品，但可以使用 30 天免费试用版。桌面版（Oracle Analytics Desktop）可以免费用于测试和培训，但如果用于生产环境，则需要支付许可费。Oracle\
  \ Analytics Server 将 OAC 平台功能引入本地部署。Oracle Analytics for Applications 为 Oracle 云应用程序提供分析功能，由自治数据仓库和\
  \ Oracle Analytics 驱动。\n\n在图 7-1 中，您可以看到 OAC 的主导航菜单。**主页** 将您带到包含 OAC 中所有内容和搜索功能的主页面。**目录**\
  \ 列出所有文件夹及其内容。**数据** 包含所有数据集、连接、数据流、序列和数据复制定义。**机器学习** 包含使用 OAC 创建或从 Oracle 数据库注册的所有机器学习模型。**作业**\
  \ 列出在 OAC 中定义的所有作业和计划。**控制台** 列出用于可视化、共享、配置和管理的工具。可视化和共享工具包括地图、扩展和社交。配置和管理工具包括搜索索引、安全域、用户和角色、快照、连接、病毒扫描器、会话和查询缓存、执行\
  \ SQL、监控交付、邮件设置、系统设置和远程数据连接。**学院** 将您带到一个充满关于 OAC 学习资源的页面。内容涵盖从入门到高级主题，如设置和管理，或如何使用像素级完美报告。\n\
  \n在 OAC 中，**项目** 是数据准备、可视化和叙述的集合，并且可以以不同格式与其他用户共享。\n\n![../images/499897_1_En_7_Chapter/499897_1_En_7_Fig1_HTML.jpg](img/499897_1_En_7_Fig1_HTML.jpg)\n\
  \n图 7-1\nOAC 主导航菜单\n\n## 数据准备\n\n与机器学习一样，数据分析始于业务问题，并定义您想要实现的目标。然后，您需要数据来支持任务和业务问题。\n\
  \n使用**创建**按钮（见图 7-2），您可以创建项目、数据集、数据流、序列、连接、数据复制和复制连接。**项目** 是一个集合，包含您的数据集、可视化以及您想要连接的所有元素，称为**数据可视化项目**。您可以通过在画布上选择“创建项目”来从正在准备的数据集创建项目。您也可以通过打开数据集并单击“保存”来创建项目。您可以使用主页屏幕上的“创建”按钮并选择“数据集”来创建项目。\n\
  \n![../images/499897_1_En_7_Chapter/499897_1_En_7_Fig2_HTML.jpg](img/499897_1_En_7_Fig2_HTML.jpg)\n\
  \n图 7-2\n创建\n\n您可以通过选择“创建” ➤ “数据集”（见图 7-2）来创建数据集。或者，您可以通过从主菜单中选择“主页”或“数据”并找到您要查找的数据集来打开现有数据集。数据集可以从文件或与外部数据源的连接创建。如果您想使用文件，只需拖放文件即可。如果您想使用连接，则可以使用现有连接中的数据或创建新连接。创建连接时，您可以通过选择众多连接类型之一来开始。图\
  \ 7-3 显示了本书编写时可用的连接类型。您还可以使用 ODBC 和 JDBC 连接到支持这些连接器的其他数据库。\n\n![../images/499897_1_En_7_Chapter/499897_1_En_7_Fig3_HTML.jpg](img/499897_1_En_7_Fig3_HTML.jpg)\n\
  \n图 7-3\n创建连接，选择连接类型\n\n当您打开一个数据集时，系统会自动对数据集的样本运行列级分析。分析数据集后，OAC 会推荐一些数据转换和扩充。您可以在“准备”选项卡下的“建议”中看到这些建议。检查这些建议，然后接受或忽略它们。这些建议可以是增强型数据扩充，例如敏感数据检测，或地理或人口统计扩充。它们也可以是转换，例如将姓名列划分为名字列和姓氏列，或从数据集中删除社会安全号码。\n\
  \n您还可以使用列的“选项”菜单添加自己的转换或扩充。列可用的菜单选项列表取决于该列中的数据类型。在屏幕中间，您可以看到数据样本。当您使用建议或手动步骤转换或扩充数据时，一个步骤会自动添加到“准备脚本”窗格中，并对数据样本集运行。您可以在“准备脚本”中添加、编辑或删除操作步骤。检查建议后，检查每一列，看看是否有需要处理的地方。例如，也许需要更改列名、数据类型、视为（属性/度量）、格式，或者创建分组或分箱。准备脚本中转换步骤旁边的蓝点表示该脚本尚未对整个数据集运行。要对整个数据集运行脚本，请单击“应用脚本”。\n\
  \n\n\n您可以通过选择多个数据集来同时准备它们。如果点击屏幕底部的“数据关系图”选项卡，就能看到 OAC 认为数据集之间是如何关联的。如果关联正确，您无需进行任何操作；如果不正确，请为数据集创建准确的关联。您对某个数据集应用的数据转换和扩充，会影响所有使用该数据集的项目和数据流。如果您不希望这样，可以使用“复制数据集”功能，使该数据集与其他数据处理保持独立。保存数据转换和扩充后，会创建一个项目。\n\
  \n如果您有多个数据集需要合并，或者希望将结果保存到新的数据集中，请使用数据流。您可以使用“准备”功能来准备数据集，然后将这些准备好的数据集添加到数据流中。数据流会创建一系列顺序转换，并生成一个新的数据集供项目使用，而不会更改原始数据集。通过使用“分支”操作，您可以从一个数据流中创建多个输出。在数据流中，您可以使用过滤器来限制数据量、添加列以包含更多数据、添加新数据集以扩展维度或事实、选择列以聚焦相关数据属性、聚合数据、重命名列等等。\n\
  \n数据流可以手动运行，也可以按计划运行。计划选项仅在云环境中可用。您可以通过选择“创建”➤“数据流”来创建数据流，如图 7-2 所示。在图 7-4 中，您可以在数据流画布的左侧看到“数据流步骤”菜单。\n\
  \n![../images/499897_1_En_7_Chapter/499897_1_En_7_Fig4_HTML.jpg](img/499897_1_En_7_Fig4_HTML.jpg)\n\
  \n图 7-4\n\n数据与数据流\n\n以下是您可以添加到数据流中的可能步骤。首先选择“添加数据”，然后选择所需的数据集。如果您添加了多个数据集，工具会自动为数据创建联接，以查找用于联接的列。然后，针对每个数据集，定义您要执行的步骤。例如，您可以添加、选择、重命名、转换、合并或拆分列。您还可以对数据进行分箱或分组，并使用分支来分离两个不同的结果。您可以过滤或聚合数据等等。数据流的最后一步始终是“保存数据”。数据可以保存到\
  \ OAC，也可以保存到您可以连接的外部目标数据库。这使得 OAC 成为准备数据的绝佳工具。在 Oracle 机器学习（OML）处理中，来自不同来源的数据可以使用\
  \ OAC 进行组合和准备，并存储到 ADW 中，以供 OML 使用，如图 7-5 所示。\n\n![../images/499897_1_En_7_Chapter/499897_1_En_7_Fig5_HTML.jpg](img/499897_1_En_7_Fig5_HTML.jpg)\n\
  \n图 7-5\n\n将数据流的结果保存到 ADW 的表中\n\n*序列*是一组用于执行多个数据流的数据流集合。序列可以手动运行，也可以按计划运行。计划选项仅在云环境中可用。您可以通过将多个数据流链接在一起并执行来创建一个序列。\n\
  \n您也可以通过创建项目来启动准备过程。只需点击“创建”按钮并选择“项目”（参见图 7-2）。创建项目后，下一步是为其选择数据集。您可以从可用数据集列表中选择，也可以创建新的数据集。\n\
  \n项目创建并选择好数据集后，您就可以开始处理它了。如果您选择了多个数据集，工具会尝试查找数据以联接它们，或者您可以手动操作。如果尚未准备数据，首先要做的就是准备数据。在右上角，您会看到三个选项卡：“准备”、“可视化”和“叙述”。对于数据准备，请选择“准备”。在画布的左侧，您会看到两个“准备”选项：“数据”和“准备脚本”。如果选择“数据”，您将看到所选的数据集，可以准备它们，并向项目添加新的数据集。如果选择“准备脚本”，您将看到准备数据的步骤。您可以通过接受\
  \ OAC 建议的步骤或添加自己的步骤来向脚本添加步骤。\n\n## 数据可视化与叙述\n\n如果您从画布右侧的选项中选择“可视化”，您会看到处理项目的三个选项：“数据”、“可视化”和“分析”。\n\
  \n您可以通过点击“数据”一词旁边的 + 图标并选择“添加数据集”来向项目添加更多数据集。您可以通过选择“数据”按钮来处理所选的数据集。您还可以创建场景（参见图\
  \ 7-6）或添加计算（参见图 7-8）。\n\n![../images/499897_1_En_7_Chapter/499897_1_En_7_Fig6_HTML.jpg](img/499897_1_En_7_Fig6_HTML.jpg)\n\
  \n图 7-6\n\n添加场景\n\n要创建场景，请从预创建的场景列表中选择一个模型。然后，将数据集映射到模型中的数据。数据集和模型会计算出场景。该场景会显示在与数据集相同的导航器中（参见图\
  \ 7-7），并可用于可视化。\n\n![../images/499897_1_En_7_Chapter/499897_1_En_7_Fig7_HTML.jpg](img/499897_1_En_7_Fig7_HTML.jpg)\n\
  \n图 7-7\n\n使用机器学习模型进行预测\n\n要添加新的计算，请选择“添加计算”（参见图 7-8）。为计算命名，从列表中选择数学函数，然后填写所需信息。在图\
  \ 7-8 中，我们选择了“聚合”。通过双击 *度量* 一词，您可以从数据集中获取可能的度量列表。通过双击 *维度* 一词，您可以获取维度列表。\n\n![../images/499897_1_En_7_Chapter/499897_1_En_7_Fig8_HTML.jpg](img/499897_1_En_7_Fig8_HTML.jpg)\n\
  \n图 7-8\n\n添加计算\n\n要创建可视化，您可以选择属性（按住 Ctrl 键并选择所有需要的属性），然后将它们拖放到画布中。或者，您可以右键单击并选择“最佳可视化”，让工具决定哪种图表最适合所选数据。或者，您可以选择“可视化”，然后从图\
  \ 7-9 所示的选项中进行选择。\n\n![../images/499897_1_En_7_Chapter/499897_1_En_7_Fig9_HTML.jpg](img/499897_1_En_7_Fig9_HTML.jpg)\n\
  \n图 7-9\n\n可视化选项\n\n如果您想快速开始分析，可以尝试使用“解释”功能。“解释”功能（参见图 7-10）会自动解释所选属性。\n\n![../images/499897_1_En_7_Chapter/499897_1_En_7_Fig10_HTML.jpg](img/499897_1_En_7_Fig10_HTML.jpg)\n\
  \n图 7-10\n\n解释属性\n\n“解释”功能会解释该属性，包括其关键驱动因素和细分，以及数据集中与之相关的任何异常。所有这些都会通过图表和文本进行解释。如果您喜欢其中任何一个或几个，可以通过将它们选择到画布中，作为分析的基础，如图\
  \ 7-11 所示。\n\n![../images/499897_1_En_7_Chapter/499897_1_En_7_Fig11_HTML.jpg](img/499897_1_En_7_Fig11_HTML.jpg)\n\
  \n图 7-11\n\n从解释报告中选择到画布\n\n从“解释”功能开始至少有两点好处：避免认知偏差和启动任务。“解释”能让您很好地理解数据。\n\n\n\n\
  您可以添加、编辑、删除、复制和复制可视化内容。您可以添加和移除数据、筛选器、图表、画布等。您可以通过画布左下角的图表属性对图表进行微调。您可以创建自己的扩展（插件），也可以使用现有的扩展，这些扩展可在\
  \ [`www.oracle.com/business-analytics/data-visualization/extensions.html`](http://www.oracle.com/business-analytics/data-visualization/extensions.html)\
  \ 获取。您可以在控制台的“扩展”➤“上传”下将这些插件添加到您的 OAC 中。您还可以从列表中选择“语言叙述”作为可视化类型，让 OAC 自动创建可视化的叙述。这是一种快速生成报告基础的简便方法。\n\
  \n如果单击“分析”工具，您可以添加关于聚类或异常值的信息，或者向图表添加参考线、趋势线或预测（见图 7-12）。\n\n![../images/499897_1_En_7_Chapter/499897_1_En_7_Fig12_HTML.jpg](img/499897_1_En_7_Fig12_HTML.jpg)\n\
  \n图 7-12\n\n分析选项\n\n您可以使用“叙述”选项卡，从已创建的分析和可视化中创建报告或演示文稿。您可以从可视化中选择画布，为其添加描述，隐藏图表，添加注释等。您还可以从\
  \ OAC 中呈现叙述。或者，您可以将项目导出为 PowerPoint (.pptx)、Acrobat (.pdf)、图像 (.png) 或 OAC 包 (.dva)\
  \ 格式，或者直接打印出来。\n\n## Oracle Analytics Cloud 中的机器学习\n\n您已经看到了 OAC 中使用机器学习的几个示例。当数据上传到\
  \ OAC 时，数据样本会找到转换和扩充的建议。“解释”功能、自动语言叙述以及其他一些功能都是机器学习使工具更易用、更高效的示例。但您也可以以其他方式使用机器学习。\n\
  \n您可以使用数据流创建预测模型。使用数据流编辑器首先在训练数据上创建并训练模型（见图 7-13），然后将其应用于具有已知输入和输出的数据集以进行评估。您可以迭代训练过程，直到模型达到您想要的质量。最后，使用完成的模型对新数据的未知输出进行评分/预测，并保存预测的数据集。您还可以通过添加场景将预测模型应用于项目。\n\
  \n![../images/499897_1_En_7_Chapter/499897_1_En_7_Fig13_HTML.jpg](img/499897_1_En_7_Fig13_HTML.jpg)\n\
  \n图 7-13\n\nOAC 中的机器学习模型训练\n\n要查看可用的机器学习模型，请从主导航菜单中选择“机器学习”（见图 7-1）。如果您从可用模型中选择一个机器学习模型，您可以对其进行研究、将其标记为收藏或删除。如果您无法从列表中找到该模型，您可以注册该模型。注册允许您使用在\
  \ Oracle 数据库中创建的现有机器学习模型。选择“注册 ML 模型”，如图 7-14 所示。\n\n![../images/499897_1_En_7_Chapter/499897_1_En_7_Fig14_HTML.jpg](img/499897_1_En_7_Fig14_HTML.jpg)\n\
  \n图 7-14\n\n注册现有的机器学习模型\n\n要注册 ML 模型，您需要选择一个连接到该模型所在的 Oracle 数据库（见图 7-15）。这可以是本地数据库或\
  \ Oracle 自治数据库。如果没有可用的连接到 ML 模型所在的数据库，您需要使用“创建连接”按钮创建一个新连接。\n\n![../images/499897_1_En_7_Chapter/499897_1_En_7_Fig15_HTML.jpg](img/499897_1_En_7_Fig15_HTML.jpg)\n\
  \n图 7-15\n\n选择连接或创建新连接以注册 OAC 的 ML 模型\n\n当您连接到数据库后，您会看到可用 ML 模型的列表。选择模型并单击“注册”。现在该模型即可在\
  \ OAC 中使用。\n\n您还可以在 OAC 主屏幕的搜索功能中使用机器学习。您可以单击麦克风图标并口头提出您的分析问题。OAC 会检查数据，找到回答问题的数据，并自动创建分析图表。OAC\
  \ 使用大量机器学习来帮助用户分析数据，并基于此构建报告和预测。该工具的每个版本都会带来更多这些有趣的功能。这个工具值得深入研究。\n\n## 总结\n\n本章讨论了\
  \ Oracle Analytics Cloud，这是 Oracle 为分析需求提供的产品之一。OAC 是一个很好的分析工具，也是一个为机器学习准备数据的优秀工具。Oracle\
  \ 对分析的愿景是它应该是增强的、集成的和协作的。这也是 OAC 成为机器学习绝佳选择的原因。您可以轻松地组合来自不同来源的数据，并使用增强功能来准备数据。完成数据准备后，您可以将其存储在数据库中供进一步使用。OAC\
  \ 的“解释”功能使理解数据变得更加容易。您可以将 Oracle 数据库中的机器学习模型与 OAC 一起使用，或者构建简单的机器学习模型。OAC 是机器学习过程的一个不错选择，因为它与其他\
  \ Oracle 产品和其他可能的数据源集成良好，并且具有强大的增强功能。\n\n# 8. 机器学习中的交付与自动化管道\n\n可用数据量的不断增长、更便宜且更强大的计算处理能力以及更实惠的数据存储，持续加速并推动了业务应用与机器学习模型的集成。机器学习模型为生产中越来越多的应用提供动力。以下是一些著名的模型驱动应用。\n\
  \n*   Netflix 和亚马逊使用的在线推荐系统\n*   特斯拉和 Alphabet 推出的时尚自动驾驶汽车\n*   银行和电商商户的欺诈检测解决方案\n\
  *   用于医疗诊断和预测的机器学习算法\n*   社交媒体上的情感分析器，提供数字消费者洞察\n\n本章探讨了机器学习开发和部署的问题与挑战。它涵盖了 ML\
  \ 部署解决方案背后的一些关键需求和设计考量。最后，深入探讨了具体的解决方案组件、最佳实践和工具。\n\n## ML 开发挑战\n\n与任何软件解决方案一样，模型驱动应用使用常见的软件质量特性来衡量，例如功能性、可靠性、可维护性、可扩展性和性能。ML\
  \ 应用必须解决传统软件的所有质量问题，外加一套额外的 ML 特定要求。因此，ML 应用开发比传统软件开发更困难。\n\n\n\n### 经典软件工程 vs.\
  \ 机器学习\n\n在经典软件工程环境中，所需的产品行为可以仅通过软件逻辑充分表达。一旦编码逻辑在包含模拟数据的用户场景中得到充分测试，代码预计将在生产环境中继续使用真实数据正常工作。\n\
  \n相反，机器学习应用无需专门编程即可学习执行任务。其质量取决于输入数据和调优参数。当模型被训练时，会在输入（即自变量）和输出（即目标变量）之间建立映射函数。如果输入和输出数据之间的关系发生变化，这种从历史数据中学习到的映射在未来面对新数据时可能不再有效。这种变化可能对依赖的应用或服务产生不利影响，因为随着时间的推移，模型预测的准确性会下降。机器学习应用必须不断输入新数据才能保持工作。\n\
  \n### 模型漂移\n\n模型漂移的概念是指，随着时间的推移，变化的外部数据会导致预测模型的预测性能下降和退化。根据漂移的原因，模型漂移可分为两类：概念漂移和数据漂移。\n\
  \n概念漂移是指目标变量的统计属性随时间发生变化。由于垃圾邮件和合法电子邮件的不断演变，电子邮件垃圾邮件过滤应用会频繁出现概念漂移。\n\n概念漂移关注的是目标变量，而数据漂移则发生在自变量的属性发生变化时。例如，一个数据集包含信用卡客户的违约支付信息、人口统计因素、信用数据、支付历史以及账单报表。可以训练一个机器学习模型来预测银行客户信用卡违约的可能性。在这种情况下，发生变化的是定义目标的自变量（人口统计因素、信用数据、支付历史和账单报表）的值，而不是目标变量（违约支付）的定义。\n\
  \n注意\n\n在机器学习中，特征或属性是输入给机器学习算法进行分析的自变量。目标（输出）是您希望深入了解的因变量。在监督分类模型的上下文中，术语“类标签”指的是目标的一个唯一值。\n\
  \n## 机器学习部署挑战\n\n随着数据科学家和软件工程师在实时机器学习系统中不断积累经验，您可以更深入地理解这些独特的挑战、它们如何发生、其影响以及如何克服这些挑战。\n\
  \n在部署之前，模型会经过预训练，并通常导出为某种文件格式（例如，pickle、ONNX、PMML）。在没有模型漂移的情况下，模型服务代码可以加载这些预训练的模型包并进行预测，以服务于下游应用。\n\
  \n![../images/499897_1_En_8_Chapter/499897_1_En_8_Fig1_HTML.jpg](img/499897_1_En_8_Fig1_HTML.jpg)\n\
  \n图 8-1\n\n机器学习生命周期与关键产物\n\n对于处理实时数据的模型，模型训练并不会在模型开发阶段结束。一旦投入运行，模型需要被监控，并且可能需要频繁地重新训练模型以适应不断变化的环境。需要添加一个包含模型监控的重新训练管道来为模型服务模块提供数据，从而形成图\
  \ 8-1 中的生命周期模式。\n\n### 机器学习生命周期\n\n部署和维护实时机器学习驱动应用的最终目标是保持最优的模型性能指标（如损失、准确率）。由于实时数据的变化，这需要持续的实验/验证来改进指标。更具挑战性的是，这种改进需要实现自动化。\n\
  \n如图 8-1 所述，机器学习生命周期的每次迭代都与从外部仓库推送的特定版本的源代码（包括版本化的依赖库）相关联。同时，该迭代从外部数据源访问输入数据，该数据源也是版本化的。\n\
  \n所有阶段的操作都需要进行编排，以便生命周期能够完全自动化。让我们看看每个阶段处理过程中产生的额外产物。\n\n*   **数据准备**：数据处理代码首先验证原始数据，如果检测到模式或分布偏移，则生成事件。否则，数据被预处理并分割成训练集和测试集。\n\
  \n*   **模型构建**：使用实验参数创建一个候选模型。该模型使用训练集进行训练。\n\n*   **模型评估**：对候选模型进行评估，并生成性能指标。\n\
  \n*   **模型验证**：对候选模型进行验证，并与当前的线上版本进行比较。验证代码会选择更符合性能要求的版本。\n\n*   **模型服务**：模型服务代码将选定的模型提升到生产环境，以使用新数据进行预测服务。\n\
  \n*   **模型监控**：在此阶段，通过比较连续的历史数据集跨度来检测模式或分布偏移（在特征和预测中）。例如，如果数据摄取每月发生一次，则比较连续月份的训练数据。如果检测到显著的漂移，则会记录模型漂移事件，并通过启动生命周期的新迭代来触发模型重新训练。\n\
  \n### 规模化挑战\n\n在规模化机器学习解决方案时，数据科学家和数据工程师关注几个关键领域。\n\n#### 模型训练\n\n在训练过程中，会对海量数据重复应用一系列数学计算。训练这样一个模型以达到可接受的准确率可能需要很长时间（数天或数周）。这个问题会随着需要训练的模型数量而倍增。\n\
  \n#### 模型推理\n\n模型推理服务必须处理大量的输入或用户，并满足延迟和吞吐量要求。为了加速计算机视觉中的深度学习推理，需要在硬件和应用层面进行优化。\n\
  \n#### 输入数据处理\n\n在整个典型的机器学习生命周期中，海量数据被输入系统。内存表示以及算法访问数据的方式会对可扩展性产生重大影响。此外，为了跟上多个加速硬件设备的数据消耗速率，必须提升数据处理速度和吞吐量。\n\
  \n## 关键需求\n\n基于以上分析，支持实时机器学习模型的关键需求如下。\n\n*   整个机器学习生命周期的自动化（在需要时允许人工干预/审批）。\n\n\
  *   跟踪和管理机器学习模型及产物（如数据、代码、模型包、配置、依赖项和性能指标）对于漂移检测、模型可复现性、可审计性、调试和可解释性至关重要。\n\n* \
  \  模型性能（如准确率）是任何机器学习模型的关键质量指标。\n\n*   机器学习运维需求包括机器学习 API 端点的响应时间、执行预测时的内存/CPU 使用率以及磁盘利用率（如果适用）。\n\
  \n## 设计考虑与解决方案\n\n为了克服挑战并满足一系列需求，让我们讨论常见的设计考虑因素以及解决方案和工具方面的最新进展。\n\n\n\n### 自动化数据科学步骤\n\
  \n通常，将任何机器学习模型产品化都需要自动化生命周期处理流程，这具体体现为以下数据科学步骤。\n\n*   **数据摄取/预处理**：从传入的数据源收集并处理原始数据。\n\
  \n*   **数据验证**：验证输入数据的模式（Schema）和统计属性是否符合模型的预期。\n\n*   **数据准备**：对数据进行清洗、归一化，并将其拆分为训练集和测试集。\n\
  \n*   **特征工程**：转换原始数据以构建额外的特征，这些特征能更好地向模型呈现底层问题。\n\n*   **特征选择**：移除不相关的特征，并选择那些对目标变量贡献最大的特征。此步骤的输出是以训练算法所期望的格式呈现的特征拆分结果。\n\
  \n*   **模型训练**：对准备好的特征集应用各种机器学习算法来训练机器学习模型。这包括超参数调优，以获得性能最佳的机器学习模型。此步骤的输出是一个训练好的模型。\n\
  \n*   **模型评估**：使用一组指标评估训练好的模型的质量。\n\n*   **模型验证**：基于模型评估和监控指标，确定模型是否适合部署。\n\n* \
  \  **模型服务**：机器学习推理程序使用训练好的模型生成预测结果。\n\n*   **模型监控**：监控以检测训练/服务偏差和模型漂移。如果漂移显著，则必须使用更新的数据重新训练并刷新模型。\n\
  \n在将流水线部署到任何生产环境之前，这些手动执行的数据科学步骤必须在一个自动化流水线中得以体现。MLOps 在机器学习自动化领域是一个重要且相对较新的概念。让我们先介绍\
  \ MLOps，然后深入探讨 MLOps 框架内实现的关键解决方案。\n\n### 自动化机器学习流水线：MLOps\n\nMLOps（*机器学习*和*运维*的合成词）是一套实践方法，它结合了数据科学家和运维专业人员之间的实践，以自动化和管理生产级机器学习（或深度学习）生命周期。MLOps\
  \ 是一个用于大规模机器学习产品化的 CI/CD 框架。\n\n注意\n\n*持续集成*（CI）是一种软件开发最佳实践，旨在频繁地将所有开发者的工作副本合并到共享仓库中，最好每天多次。每次合并后，都可以通过自动化构建和自动化验收测试进行验证。*持续交付*（CD）是一种实践，旨在使你的代码库在任何时候都处于可部署状态。除了确保你的应用程序通过自动化测试外，它还必须具备推送到生产环境所需的所有配置、依赖项和打包。\n\
  \nDevOps 是一套自动化和集成传统软件开发与运维团队之间流程的实践方法。DevOps 结合了文化理念、实践和工具，以提高组织交付高速应用程序和服务的能力。\n\
  \nMLOps 流程的运维方面与 DevOps 类似。MLOps 可以重用经典的 DevOps 工具链组件来处理源代码仓库、构建/测试/打包/部署自动化以及集成测试，例如以下工具。\n\
  \n*   Git：源代码仓库\n*   Jenkins：自动化设施\n*   Kubeflow 和 Airflow：编排器\n*   Travis CI：持续集成服务\n\
  *   Argo CD：持续交付工具\n*   Kubernetes：用于自动化应用程序部署的容器编排系统\n\n图 8-2 展示了一个模型驱动的应用程序代码，其中包含一个机器学习流水线（步骤\
  \ 1）。\n\n一旦代码被提交并合并到代码仓库（Git）中，DevOps 的持续集成工具会自动启动集成和测试（步骤 2）。\n\n持续交付工具确保机器学习流水线打包了所有必要的配置/依赖库，并准备好部署到生产环境（步骤\
  \ 3）。\n\n![../images/499897_1_En_8_Chapter/499897_1_En_8_Fig2_HTML.jpg](img/499897_1_En_8_Fig2_HTML.jpg)\n\
  \n图 8-2\n\n机器学习流水线自动化\n\n然而，生产级机器学习由于机器学习特有的相互依赖关系，带来了额外的 CI/CD 和编排挑战及细微差别。MLOps\
  \ 是 DevOps 的扩展，增加了额外的基础设施和工具。\n\n*   **特殊硬件**：需要数据和算法的特殊分段与编排，以利用加速硬件（如图形处理单元（GPU）和张量处理单元（TPU））并满足可扩展性要求。\n\
  *   **复杂的计算图**：编排可能涉及复杂的运行时计算图。机器学习应用程序可以有多个并行执行的流水线。\n    *   A/B 测试\n    *   集成方法\n\
  \    *   多臂老虎机\n*   **可复现性**：由于模型训练的试验性质，保持流水线和组件的可重复性至关重要。机器学习流水线可以使用模型注册表中的信息进行重用、调整和恢复。例如，流水线可以跳过某些步骤或恢复某个中间步骤（步骤\
  \ 4）。\n*   **持续模型交付**：一旦模型注册表决定将模型从预发布环境提升到生产环境，该模型就会自动准备好供预测服务以及下游应用程序/客户端使用（步骤\
  \ 5）。此步骤实现了在机器学习流水线内“持续交付”新模型版本，这覆盖了常规的 DevOps 流程（步骤 3）。此外，还有机器学习特有的其他相互依赖关系，例如模型注册表、模型刷新管理、模型验证、数据验证或漂移检测。\n\
  *   **法规遵从性**：额外的可解释性和可解释性模块必须阐明模型的复杂性，以满足各种合规监管机构的要求。\n\n\n\n### 用于追踪的模型注册表\n\n\
  模型注册表组件是一个集中式数据存储，支持对机器学习模型全生命周期的管理。它提供模型版本管理、生产/预发布/归档状态转换、数据依赖追踪、代码依赖追踪、环境追踪，以及每个活跃流水线实例的配置追踪。\n\
  \n如图 8-3 中的示例所示，自动化机器学习流水线生成了训练模型的多个版本：v1、v2 和 v3。利用模型注册表的信息，模型验证/监控模块决定将 v1 部署到生产环境。v1\
  \ 随后被归档，并由更优的 v2 取代。这种机制允许由模型监控触发的持续模型刷新/回滚。\n\n![../images/499897_1_En_8_Chapter/499897_1_En_8_Fig3_HTML.jpg](img/499897_1_En_8_Fig3_HTML.jpg)\n\
  \n图 8-3\n\n模型注册表示例\n\n以下项目通常会在模型注册表中被追踪和保存。\n\n*   所选版本的训练模型\n*   输入数据的版本（用于标识原始输入数据的版本）\n\
  *   代码的版本（外部源代码仓库中追踪的所有源代码版本——模型训练、应用、流水线处理等）\n*   依赖项（与依赖库、数据库连接等的链接）\n*   环境配置（用于控制机器学习流水线组件的参数，例如数据处理、特征选择、数据验证或模型监控使用的阈值）\n\
  *   超参数（其值控制机器学习学习过程的参数；例如，学习率、批量大小、神经网络大小、训练轮数、层数、过滤器数量和优化器名称）\n*   训练好的模型包（模型训练产生的最终包。典型格式有\
  \ pickle、ONNX 和 PMML）\n*   模型评分结果（模型做出的预测）\n*   用于训练和测试的特征\n*   特征重要性（根据输入特征在预测目标变量时的有用程度为其分配的分数）\n\
  *   模型性能指标\n    *   训练时间\n    *   准确率\n    *   损失\n    *   混淆矩阵（见图 8-4）\n    * \
  \  准确率：(TP+TN)/(TP+FP+TN+FN)\n    *   精确率：TP/(TP+FP)\n    *   召回率：TP/(TP+FN)\n\n\
  TP、TN、FP 和 FN 分别代表真正例、真负例、假正例和假负例。图 8-4 描述了在二分类器（具有两个类别：真和假的分类器）中如何定义 TP、TN、FP 和\
  \ FN。\n\n*   TP 是被预测为真且实际结果也为真的案例数量。\n*   TN 是被预测为真但实际结果为假的案例数量。\n*   FP 是被预测为假但实际结果为真的案例数量。\n\
  *   FN 是被预测为假且实际结果也为假的案例数量。\n\n![../images/499897_1_En_8_Chapter/499897_1_En_8_Fig4_HTML.jpg](img/499897_1_En_8_Fig4_HTML.jpg)\n\
  \n图 8-4\n\n模型评估：二分类的混淆矩阵\n\n通过将信息存储在模型注册表中，可以重现任何模型训练过程。您还可以监控一系列训练实例以检测任何回归，并选择重新部署甚至回滚生产环境中的全部或部分流水线。\n\
  \n### 数据验证\n\n随着机器学习模型快速应用于日常生活的关键领域，解释模型预测背后的推理过程变得非常重要。然而，目前还没有简单的方法来有效检查训练后模型的内部结构以验证其正确性，从而证明意外模型行为的合理性。\n\
  \n相比之下，验证数据要直接得多。输入数据是机器学习流水线的起点，因此数据验证应该是在整个流水线因不良数据被激活之前标记问题的第一道防线。\n\n验证在模型训练之前执行，通过检查一系列连续的数据集来检测数据漂移，以确保以下内容。\n\
  \n*   当前数据集与先前数据集遵循相同的模式。\n*   当前数据集的特征值与先前数据集的特征值相似。\n*   当前数据集的特征值分布与先前数据集的特征值分布相似。\n\
  *   其他特定于模型的模式保持不变。例如，在自然语言处理（NLP）场景中，单词数量或先前数据集中未出现过的单词列表发生突变。\n\n在模型服务之前也会执行数据验证，以确保以下内容。\n\
  \n*   服务数据集和训练数据集遵循相同的模式。\n*   模型训练所用的特征值与模型在服务时看到的特征值相似。\n*   训练数据集的特征值分布与服务数据集的特征值分布相似。\n\
  *   其他特定于模型的模式保持不变。例如，在 NLP 场景中，服务数据中单词数量或训练数据中未出现过的单词列表发生突变。\n\n### 流水线抽象\n\n机器学习流水线由各种处理步骤组成，无论针对何种业务问题，这些步骤都或多或少是相同的。流水线抽象是一种流行的实践，旨在将通用功能模块化，并将其作为服务在所有流水线中共享。其目的是减少代码不一致性，提高流水线质量和可维护性，并提升机器学习系统的整体生产力。以下是抽象服务示例列表。\n\
  \n*   数据转换\n*   数据归一化\n*   模型调用\n*   算法选择\n*   词频-逆文档频率（TF-IDF）加权\n\n### 自动机器学习（AutoML）\n\
  \n流水线抽象旨在去重和优化代码结构，而 AutoML 则旨在自动化流水线在运行时中许多繁琐且重复的步骤或步骤组。\n\n借助 AutoML，机器学习专业知识有限的人员也可以利用最先进的模块。AutoML\
  \ 还将模型开发者从重复且耗时的任务负担中解放出来。\n\n此外，AutoML 利用神经架构搜索和迁移学习来自动选择能够产生最佳模型性能的算法和参数组合。以下是\
  \ AutoML 已针对的机器学习流水线中的一些步骤。\n\n*   数据预处理\n*   数据分区\n*   特征提取\n*   特征选择\n*   算法选择\n\
  *   训练\n*   调优\n*   集成\n*   部署\n*   监控\n\n### 模型监控\n\n您如何知道生产环境中的模型是否按预期运行？当您的训练数据变得陈旧时，会对您的模型和下游应用产生什么影响？您的机器学习流水线如何处理损坏的实时数据或训练/服务偏差？\n\
  \n为了开始解决这些复杂问题，代表性能或行为原始测量值的指标和工件会在整个系统中被观察和收集。对于每个流水线执行实例，模型包、指标和其他工件都会持久化存储在模型注册表中。本章后面会更详细地介绍模型注册表。\n\
  \n利用模型注册表中的信息，模型监控组件可以重现流水线执行，对当前实例和历史实例进行详细比较，以检测数据偏差、模型漂移、依赖项变化，并进行生产环境的 A/B 测试。\n\
  \n\n\n### 模型监控实施\n\n模型监控在机器学习管道的各个实例之间执行，其目标是检测预测结果、特征和指标中的显著偏移/变化。\n\n*   原始输入数据的模式\n\
  *   原始输入数据的分布\n*   回归算法的模型预测分布或分类算法的预测频率\n*   数值特征的模型特征分布或分类特征的输入频率\n*   缺失值检查\n\
  *   模型性能指标（损失、准确率等）\n\n计算偏移的常用指标：\n\n*   给定时间范围内的中位数和平均值\n*   最小值/最大值\n*   给定时间范围内的标准差\n\
  \n如果监控组件检测到显著漂移，它将使用更新的输入数据触发机器学习管道的重启。生成的模型实例被放置在预发布环境中。然后，模型验证模块决定是否在生产环境中刷新模型。\n\
  \n在依赖关系发生变化时，监控模块会通知数据科学家，请求人工干预/批准。\n\n## 扩展解决方案\n\n机器学习应用需要特定的硬件配置和可扩展性考量。例如，训练神经网络可能需要强大的\
  \ GPU。训练常见的机器学习模型可能需要 CPU 集群。为了利用加速硬件，需要将机器学习模型和输入数据进行分区、调整大小、配置，并映射到计算节点集群（运行诸如\
  \ Spark、scikit-learn 和 PyTorch 等机器学习框架）。\n\n### 用于大规模模型训练和推理的机器学习加速器\n\n许多机器学习加速器已发布，用于支持目标检测、自然语言处理和辅助驾驶的各种深度学习模型。机器学习加速器的能力取决于神经网络的类型。此外，神经网络训练和推理之间也存在区别。本节的目的仅是简要介绍当前生产环境中一些广泛采用的加速器。\n\
  \n*   GPU（图形处理单元）包含数百个嵌入式 ALU，用于处理并行计算。\n*   专用集成电路（ASIC），例如谷歌的 TPU，是专为深度学习设计的矩阵处理器。\n\
  *   英特尔 Habana Goya 和 Gaudi 芯片：Gaudi 用于训练，Goya 用于推理。\n\n### 用于模型训练的分布式机器学习\n\n分布式机器学习指的是多节点/多处理器的机器学习算法和系统，旨在提高训练性能、准确性，并扩展到更大的输入数据规模。数据并行和模型并行是在节点间分配工作负载的不同方式。数据并行是指在每个节点上运行算法，但向其提供分区数据的不同部分；模型并行是指每个节点使用相同的数据，但在节点间拆分模型。\n\
  \n以下是一些用于分布式机器学习的框架。\n\n*   Apache Hadoop (HDFS)\n*   Apache Spark (MLlib)\n*  \
  \ Apache Mahout\n*   TensorFlow 和 PyTorch：通过模型/数据并行提供分布式计算 API 的框架。\n\n### 模型推理选项\n\
  \n根据推理实现方式，有多种选项可用于满足吞吐量和延迟要求。\n\n*   REST 端点\n*   传统的批量推理操作\n*   分布式流处理系统，例如 Spark\
  \ Streaming 或 Apache Flink\n\n在所有可用节点/加速设备上并行化机器学习推理可以减少总体推理时间。其他推理优化方法包括批量大小调整和模型剪枝。\n\
  \n以下是为深度学习扩展而优化的流行硬件选择，注重速度、小尺寸和能效。\n\n*   图形处理单元 (GPU)\n*   现场可编程门阵列 (FPGA)\n*\
  \   视觉处理单元 (VPU)\n\n### 输入数据管道\n\n使用分布式机器学习时，多个强大的 GPU/TPU 会消耗处理后的输入数据。因此，输入数据管道很容易成为新的性能瓶颈（见图\
  \ 8-5）。\n\n![../images/499897_1_En_8_Chapter/499897_1_En_8_Fig5_HTML.jpg](img/499897_1_En_8_Fig5_HTML.jpg)\n\
  \n图 8-5\n\n性能瓶颈：输入数据管道\n\n典型的输入准备工作是一个 ETL 管道。ETL 是提取、转换和加载的缩写。\n\n*   提取是从多个且通常不同类型的源中读取数据的过程。此阶段是\
  \ I/O 密集型的。\n*   转换是应用规则将提取的数据转换/组合成所需格式的过程。此阶段是计算密集型的，通常由 CPU 处理。\n*   加载是将数据写入目标数据存储并准备馈送到训练算法的过程。此阶段也是\
  \ I/O 密集型的。\n\n如图 8-6 所示，输入管道的两个实例顺序执行。每个实例将一个数据分区馈送到一个 GPU/TPU 设备。存在两个间隙：一个在*转换*操作之间，另一个在*训练*操作之间，表明\
  \ CPU 和 GPU/TPU 处于空闲状态。\n\n![../images/499897_1_En_8_Chapter/499897_1_En_8_Fig6_HTML.jpg](img/499897_1_En_8_Fig6_HTML.jpg)\n\
  \n图 8-6\n\n顺序输入数据管道\n\n输入管道的部分可以并行化，以确保 CPU 和 GPU/TPU 得到充分利用（见图 8-7）。\n\n![../images/499897_1_En_8_Chapter/499897_1_En_8_Fig7_HTML.jpg](img/499897_1_En_8_Fig7_HTML.jpg)\n\
  \n图 8-7\n\n并行（优化）输入数据管道\n\n*   在提取阶段并行化文件/数据库读取\n*   在多个 CPU 核心上并行化转换操作（如洗牌、映射等）\n\
  *   为训练预取管道和操作\n\n## 机器学习工具生态系统\n\n在本章开头，我们介绍了机器学习管道和管道自动化的概念。如图 8-2 所述，机器学习管道由两个不同的阶段组成：模型开发（步骤\
  \ 1、2 和 3）和模型部署（步骤 4、5 和 6）。\n\n图 8-8 概述了机器学习领域的工具格局，我们根据阶段对工具进行分组：模型开发/训练（左下）和模型服务（右下）分别是支持模型开发和模型部署阶段的特定框架/库/模块。\n\
  \n在此之上，机器学习平台（顶部中央）是集成和集中化的服务环境。机器学习平台的关键功能包括加速数据探索和准备、加速模型开发和训练，并从根本上简化整个生命周期中机器学习操作的规模——从模型开发、实验跟踪到部署。\n\
  \n![../images/499897_1_En_8_Chapter/499897_1_En_8_Fig8_HTML.jpg](img/499897_1_En_8_Fig8_HTML.jpg)\n\
  \n图 8-8\n\n机器学习工具\n\n### 机器学习平台\n\n以下是业界流行的机器学习平台列表。我们将在第 9 章详细介绍主流机器学习平台。在第 10\
  \ 章中，我们将通过一个示例演示如何使用 Oracle 机器学习（OML）实现机器学习管道自动化。\n\n*   Amazon SageMaker\n*   Facebook\
  \ FBLearner\n*   Oracle 机器学习\n*   Uber Michelangelo\n*   Google AI Platform\n* \
  \  Neptune\n\n接下来，让我们回顾一下机器学习开发工具。模型开发/训练组中的工具可以分为以下几类：机器学习框架、开发环境、实验跟踪和资源管理。\n\n\
  \n\n### ML 开发工具\n\n框架类别中的工具包含用于建模和训练的库（参见下方示例列表）。直到 2011 年，机器学习领域一直由这类库主导。\n\n*\
  \   TensorFlow\n\n*   Keras\n\n*   scikit-learn\n\n*   PyTorch\n\n*   Spark MLlib\n\
  \n在开发环境类别中，Jupyter notebook、Python、R 在数据科学家中很受欢迎。Git 是一个分布式版本控制系统。\n\n在实验管理方面，我们有用于跟踪的\
  \ mlflow。Tensorboard 对于跟踪和可视化指标以及模型图非常有用。有关 tensorboard 的更多信息，请参见：[`https://www.tensorflow.org/tensorboard/get_started`](https://www.tensorflow.org/tensorboard/get_started)。\n\
  \n在资源管理方面，可以使用 Docker 和 Kubernetes 来定义和定制数据处理和模型训练期间的一组资源使用条件和策略。\n\n自 2016 年以来，随着大量数据和现成模型变得越来越容易获取，对帮助产品化/部署机器学习的工具的需求也随之增加。如图\
  \ 8-8 所示，部署工具可分为模型监控和模型服务两类。\n\n### ML 部署工具\n\n一旦训练好的模型部署到生产环境中，模型服务工具（如下所示）对于简化模型维护、减少延迟以及扩展大数据流管道等非常有用。\n\
  \n*   Seldom\n\n*   Argo\n\n*   Kubernetes\n\n*   Jenkins\n\n*   此外，通常还会部署如下所示的监控工具来处理/可视化模型漂移和数据异常检测。\n\
  \n*   TensorFlow Data Validation\n\n*   Logstash\n\n*   Elasticsearch\n\n*   Kibana\n\
  \n## 总结\n\n本章分析了部署机器学习模型驱动应用的挑战。我们探讨了关键需求、重要概念、高层架构和设计考量。我们讨论了机器学习部署基础设施和解决方案。本章最后总结了支持机器学习管道生命周期的工具。\n\
  \n# 9. 使用 Oracle 机器学习的 ML 部署管道\n\n随着大规模模型驱动应用以前所未有的速度部署，企业和行业竞相采用能够使构建和维护这些应用的过程更高效、成本更低的技术。机器学习平台是一种数据中心软件和硬件基础设施，它能够自动化和加速能够处理海量数据集的预测应用生命周期的交付。当前的趋势是将机器学习平台作为整个企业的集中式服务来运营，从而在众多组织之间实现高效、统一、可靠且可复现的管道。\n\
  \n本章首先简要介绍由主要人工智能先驱（如 Google、Facebook、Oracle 和 Uber）支持的主流机器学习平台。我们重点关注 Oracle 机器学习，将其作为\
  \ Oracle 数据库专业人员在生产环境中管理机器学习模型的理想平台。我们将深入探讨 OML 内置的高性能分析和内置集成能力。本章旨在赋能数据库专业人员创建和部署分析能力，将其扩展以满足不断增长的业务需求，并利用开源数据科学包来管理完整的端到端机器学习生命周期。\n\
  \n## 主流机器学习平台\n\n机器学习平台集中化了所有机器学习相关任务的服务和组织。机器学习平台可以基于开源或专有组件。它们可以托管在云端或本地。然而，其核心是运行机器学习管道。让我们了解一些主要的机器学习平台，并理解它们所涵盖的机器学习管道组件、依赖的框架、扩展方式以及目标用户。\n\
  \n*   **Google 的 TensorFlow Extended（目标用户：数据科学家）**：TFX 是一个基于 TensorFlow 的开源生产级机器学习平台。TFX\
  \ 在 Google 内部实现，旨在支持完整的机器学习管道。但是，它需要 TensorFlow 框架。所有并行和分布式机器学习策略仅针对大规模深度学习模型训练。该平台管理以下内容。\n\
  \    *   数据摄取\n\n    *   数据分析\n\n    *   数据转换\n\n    *   数据验证\n\n    *   训练器\n\n\
  \    *   模型评估与验证\n\n    *   服务\n\n    *   日志记录\n\n*   **Facebook 的 FBLearner（目标用户：数据科学家）**：FBLearner\
  \ 是一个内部的机器学习即服务数据中心基础设施，运行在特定的 FB 硬件上。FBLearner 需要特定的机器学习框架（如 PyTorch）来构建模型，并使用\
  \ ONNX 格式来交换模型。\n\n*   **Uber 的 Michelangelo（目标用户：数据科学家）**：Michelangelo 构建在 HDFS、Spark、Cassandra、MLlib、Kafka\
  \ 和 TensorFlow 等开源组件之上。它是一个内部的机器学习即服务平台，处理机器学习管道的以下阶段。\n    *   管理数据\n\n    *  \
  \ 训练模型\n\n    *   评估模型\n\n    *   部署模型\n\n    *   进行预测\n\n    *   监控预测\n\n*   **MLFlow（目标用户：数据科学家）**：来自\
  \ Spark 的创建者 Databricks 的一个开源机器学习平台。MLFlow 专注于管理、跟踪、打包和共享模型训练实验。它需要额外的工作流和外部工具来处理生产环境中的模型服务和扩展。\n\
  \n*   **Oracle 机器学习（目标用户：数据库专业人员、数据科学家）**：OML 是 Oracle 的机器学习平台，它将超过 30 种机器学习算法的高级分析功能迁移到\
  \ Oracle 数据库和 Spark 2 集群等数据管理基础设施中。除了内置的数据安全、备份和恢复功能外，嵌入式机器学习算法经过调优，可为模型训练和模型评分提供可扩展、并行和分布式的执行。\n\
  \n以下是 OML 直接处理的机器学习管道阶段。\n\n*   数据提取\n\n*   数据准备\n\n*   特征工程\n\n*   模型训练\n\n*  \
  \ 模型评分\n\n*   模型管理/存储库\n\n本章的主要目标是在 Oracle 机器学习平台的背景下深入介绍这些机器学习管道阶段。此外，我们将解释多个 OML\
  \ 用户界面和 API 如何实现与开源包的集成，以处理机器学习管道的其他阶段。\n\n*   数据验证\n\n*   模型监控\n\n*   管道编排与部署\n\
  \n## Oracle 机器学习环境\n\n机器学习管道组件使用脚本语言（如 R 和 Python）进行编排。借助 OML4R 和 OML4Py（即将推出），管道组件可以即时访问\
  \ Oracle 数据库中的机器学习算法、数据和模型存储。同时，OML4R 和 OML4Py API 为数据科学家提供了开源环境。图 9-1 提供了可从机器学习管道访问的\
  \ OML 架构概览。\n\n![../images/499897_1_En_9_Chapter/499897_1_En_9_Fig1_HTML.jpg](img/499897_1_En_9_Fig1_HTML.jpg)\n\
  \n图 9-1\n\n从自动化机器学习管道访问 OML\n\n现在，让我们深入了解每个机器学习管道组件，以理解 OML 平台如何支持它们。\n\n\n\n##\
  \ 大数据环境下的数据提取\n\nOracle Machine Learning for Spark（OML4Spark）是 R 语言 API 组件，它将 Hadoop\
  \ 与 OML 的其他组件（包括 Oracle 数据库）连接起来。如图 9-2 所示，OML4Spark 作为一个从 R 客户端运行的透明层，使用代理对象来引用和操作（通过标准\
  \ R 语法）来自各种数据源的数据，例如文件系统、HDFS、Hive、Impala、Spark DataFrames 和 JDBC 数据源。\n\n![../images/499897_1_En_9_Chapter/499897_1_En_9_Fig2_HTML.jpg](img/499897_1_En_9_Fig2_HTML.jpg)\n\
  \n图 9-2\n\nOML4Spark：机器学习流水线与大数据环境之间的透明层\n\n## 集群内并行数据处理\n\nOML4Spark 通过一组 R 包和\
  \ Java 库实现了可扩展的数据摄取和预处理。从 R 客户端，这些包/库可以直接访问和操作存储在各种数据源中的大规模数据：本地文件系统、HDFS、HIVE、Spark\
  \ DataFrames、Impala、Oracle 数据库以及其他 JDBC 数据源中存储的数据。数据处理是可扩展的，因为它是在 Hadoop 节点集群上以并行和分布式的方式进行准备。\n\
  \nOracle Cloud SQL 支持对存储在多个大数据源中的非关系型数据进行查询。\n\n*   Apache Hive\n*   HDFS\n*   Oracle\
  \ NoSQL 数据库\n*   Apache Kafka\n*   Apache HBase\n*   对象存储（Oracle 对象存储和 S3）\n\n通过结合\
  \ OML4Spark 和 Oracle Cloud SQL，您可以处理大规模数据驱动的分析，并在大数据、关系型数据或两者的组合中发现模式。作为复杂机器学习流水线的一个组件，OML4Spark\
  \ 在分布式集群中提供可扩展的数据摄取和数据预处理。\n\n## 自动化数据准备与特征工程\n\n机器学习流水线通常涉及许多重复性活动，例如数据准备、特征工程、文本处理、集成、算法选择和模型超参数调优。\n\
  \n### 通用数据处理自动化\n\nOML 自动化数据准备（ADP）支持常见的数据转换任务，例如分箱、归一化以及异常值/缺失值插补。ADP 可以配置为自动执行特定算法所需的转换（更多详情见表\
  \ 9-1）。用户可以通过额外的转换来补充自动转换，或者用户也可以选择自行处理所有转换。\n\n表 9-1\n\nADP 执行的转换\n\n| 算法 | ADP\
  \ 执行的转换 |\n| --- | --- |\n| GLM | 数值属性被归一化。 |\n| k-Means | 数值属性被归一化。 |\n| MDL |\
  \ 所有属性通过监督分箱进行分箱。 |\n| 朴素贝叶斯 | 所有属性通过监督分箱进行分箱。 |\n| NMF | 数值属性被归一化。 |\n| O-cluster\
  \ | 数值属性通过一种特殊形式的等宽分箱进行分箱，该形式自动计算每个属性的分箱数量。所有列为空或单一值的数值列将被移除。 |\n| SVD | 数值属性被归一化。\
  \ |\n\n### 文本处理自动化\n\n对于文本处理，OML 会自动处理文本列，以基于 TF-IDF 分数提取词元。生成的稀疏词元化数据会自动与提供的训练数据集中的其他特征集成，并提供给算法。\n\
  \n### AutoML\n\nAutoML 是即将推出的 Oracle Machine Learning for Python（OML4Py）引入的一项新功能。它包括自动模型选择、特征选择和超参数调优。\n\
  \n#### 自动模型选择\n\n自动模型选择能够比穷举搜索更快地识别出实现最高模型质量的数据库内算法。\n\n#### 自动特征选择\n\n自动特征选择通过识别最相关的特征来减少特征数量，从而提高模型性能和准确性。\n\
  \n#### 自动超参数调优\n\n自动调优超参数在机器学习指导下显著提高模型准确性，并避免手动或穷举搜索技术。\n\n## 可扩展的数据库内模型训练与评分\n\
  \n数据库内模型训练和评分算法是 Oracle Machine Learning 最重要的特性。这些算法在 Oracle 数据库内部执行。因此，它们可以充分利用\
  \ Oracle 数据库的可扩展性、并行性、安全性、集成性、云以及结构化/非结构化数据处理能力。\n\n本节探讨与扩展性相关的能力，例如数据库内并行执行和集群内并行执行。\n\
  \n### 通过嵌入式算法实现数据库内并行执行\n\n嵌入在 Oracle 数据库内核中的 OML 算法消除了数据移出数据库的情况。\n\n在本节中，让我们探讨一些支持数据库内并行执行的\
  \ Oracle Machine Learning for R 嵌入式 R 执行函数。\n\n如图 9-3 所示，并行执行能力允许将机器学习流水线中的任何用户定义脚本卸载到\
  \ OML 服务器，以利用高性能计算硬件，例如 Oracle Exadata 数据库云平台。\n\n![../images/499897_1_En_9_Chapter/499897_1_En_9_Fig3_HTML.jpg](img/499897_1_En_9_Fig3_HTML.jpg)\n\
  \n图 9-3\n\n基于 OML 的自动化流水线\n\n为了支持嵌入式 R 执行，Oracle 数据库的职责可以总结如下。\n\n*   通过在数据库服务器上生成可能多个服务器端\
  \ R 引擎来管理和控制 R 脚本的执行。\n*   自动分区并将数据传递给并行执行的 R 引擎。\n*   通过`ore.frame`代理对象引用数据，消除从\
  \ Oracle 数据库移动数据的需求。\n*   确保所有数据/任务分区的所有 R 引擎执行完成；否则返回错误。\n*   以`ore.list`格式提供每个用户定义的嵌入式\
  \ R 函数执行的结果。此列表存储在数据库中，直到用户需要该结果。\n\n以下小节将更详细地描述这五个职责领域中的每一个。\n\n#### 任务并行执行\n\n\
  在通过`ore.indexApply`函数进行任务并行执行期间，用户定义的函数被划分为多个任务。这些任务被分配给一个或多个 R 引擎进行处理。任务并行能力在各种用例中很有价值，例如模拟、实验，或者当整个模型太大而无法放入单个\
  \ R 引擎时。\n\n#### 数据并行执行\n\n在通过`ore.groupApply`和`rq.groupEval`函数进行数据并行执行期间，一个或多个\
  \ R 引擎在不同的数据分区上执行相同的用户定义 R 函数或任务。基于组的数据并行执行能够进行大量的并行模型训练会话，例如数十万个预测模型，每个数据段一个模型。\n\
  \n在针对`ore.rowApply`和`rq.rowEval`函数的数据并行执行中，一个或多个 R 引擎在数据批次（按行）上执行相同的用户定义 R 函数。基于行的数据并行执行适用于大规模数据集上的可扩展模型评分。\n\
  \n#### 并行度\n\n`ore.groupApply`、`ore.rowApply`和`ore.indexApply`函数依赖其`parallel`参数来指定嵌入式\
  \ R 执行中使用的并行度。`parallel`参数默认为每个 ORE 连接的全局`ore.parallel`选项，如果未设置`ore.parallel`，则默认为`FALSE`。\n\
  \n对于等效的 SQL 函数`rq.groupEval`和`rq.rowEval`，并行度由输入游标参数中的`PARALLEL`提示指定。\n\n\n\n####\
  \ 环境\n\n`rq.groupEval` 和 `rq.rowEval` 函数可在 SQL*Plus 等 SQL 环境中实现并行执行。\n\n`ore.groupApply`、`ore.rowApply`\
  \ 和 `ore.indexApply` 函数可在 R 环境中实现并行执行。\n\n注意\n\n使用 `ore.doEval` 或 `ore.tableApply`\
  \ 调用的用户自定义 R 函数绝不会并行执行。\n\n#### 使用分区模型的数据库内并行执行\n\n作为一种集成模型，OML 中的分区模型功能会根据一个或多个列自动对数据进行分区。OML4SQL\
  \ 会为这些分区构建、组织、维护并持久化子模型。子模型在顶层模型实体中表示为分区，使用户能够轻松构建和管理许多针对独立数据切片定制的模型。允许用户直接与顶层模型交互也极大地简化了分区模型的评分过程。\n\
  \n在分区模型评分期间，您必须将分区列作为 `USING` 子句的一部分包含在内。分区名称、列以及分区模型的结构都存储在 Oracle 数据库的 `ALL_MINING_MODEL_PARTITIONS`\
  \ 视图中。\n\n分区模型可以充分利用数据库内并行执行来训练和评分潜在的大量子模型。\n\n图 9-4 描述了构建分区模型的过程。\n\n1.  用户从输入数据集中指定一个分区键（即，一个逗号分隔的列列表）。\n\
  2.  根据分区键的不同值，输入数据被切分成多个数据分区。\n3.  每个数据切片都会产生一个对应的模型分区。但是，子模型不是独立的模型，因此对用户不可见。可配置的最大分区数，默认值为\
  \ 1000 个分区。\n4.  使用数据库内并行执行来训练子模型。\n5.  用户直接访问顶层模型进行模型评分。\n\n注意\n\n分区键仅支持 `NUMBER`\
  \ 和 `VARCHAR2` 列数据类型。\n\n![../images/499897_1_En_9_Chapter/499897_1_En_9_Fig4_HTML.jpg](img/499897_1_En_9_Fig4_HTML.jpg)\n\
  \n图 9-4\n\n分区模型：最大化数据库内并行执行\n\n### 集群内并行执行\n\n如图 9-2 所示，OML4Spark 可以访问整个 Hadoop\
  \ 集群来执行并行的分布式机器学习算法。这些算法包括以下内容。\n\n*   OML4Spark 算法，例如深度神经网络、自定义线性模型 (LM)、ELM、广义线性模型\
  \ (GLM)、H-ELM、PCA 和 SCD。这些 OML4Spark 算法针对 Spark 并行执行进行了优化。因此，它们的性能优于 Spark MLlib。\n\
  *   Spark MLlib 算法，例如 GLM、LM、梯度提升树、PCA、k-means、SVM、LASSO、岭回归、决策树和随机森林。\n*   从 R\
  \ 运行的通用并行分布式 MapReduce 作业，利用开源 CRAN 包。\n\n注意\n\n类似的核心功能在 Java 库中也可用，可以从任何 Java 或\
  \ Scala 平台调用。\n\n## 模型管理\n\nOracle Machine Learning 使用户能够在 Oracle 数据库内部构建和部署预测模型。为了支持模型管理和模型分析，必须持久化已训练的模型及相关信息（训练/测试数据、版本、参数等）。\n\
  \n如果模型是在 Oracle 数据库中创建的，则该模型以及与模型相关的不同信息将存储在以下特定的数据库表和视图中。用户可以查询这些表和视图来了解模型。\n\n\
  *   `ALL_MINING_MODELS`：此视图包含当前用户可访问的所有 OML 模型的记录。每条记录都包含模型所有者、名称、创建日期、大小和模型算法（分类、回归、聚类等）等详细信息。\n\
  *   `ALL_MINING_MODEL_ATTRIBUTES`：此视图包含用于构建模型的训练数据中列的信息。\n*   `ALL_MINING_MODEL_SETTINGS`：此视图描述了用于训练模型的参数。\n\
  *   `ALL_MINING_MODEL_VIEWS`：此视图描述了用户可访问的所有模型视图。\n\n## 使用数据库中的 R 数据存储保存模型\n\n由于\
  \ ML 管道是由会话中运行的脚本（例如 R）编排和驱动的，因此您可以利用 R 允许将会话中的任何 R 对象持久化到磁盘并在不同 R 会话之间重新加载的功能（见图\
  \ 9-5）。\n\n![../images/499897_1_En_9_Chapter/499897_1_En_9_Fig5_HTML.jpg](img/499897_1_En_9_Fig5_HTML.jpg)\n\
  \n图 9-5\n\n将 ML 模型持久化到文件系统\n\n另一方面，OML 支持使用 Oracle 数据库中的 R 数据存储进行对象持久化（见图 9-6）。\n\
  \n![../images/499897_1_En_9_Chapter/499897_1_En_9_Fig6_HTML.jpg](img/499897_1_En_9_Fig6_HTML.jpg)\n\
  \n图 9-6\n\n将 ML 模型持久化到数据库中的 R 数据存储\n\n本节重点介绍如何使用数据存储实现模型注册表。模型注册表会跟踪已训练模型的多个版本以及相应的训练/测试数据集、特征、参数以及模型评分、模型监控和模型管理所需的任何其他元数据。作为\
  \ Oracle Machine Learning 平台的关键元素，Oracle R Enterprise (ORE) 支持将已训练的模型（例如“mod”）及其元数据作为\
  \ R 对象持久化到数据库中。ORE 代理对象（例如“IRIS”）以及任何 R 对象（例如“tree10”和“ans”）都可以作为命名实体（例如“iris_class_model_v1_ds”）在\
  \ Oracle 数据库中跨 R 会话保存和恢复。模型版本可以嵌入为数据存储名称的一部分。用户可以选择覆盖或删除数据存储。\n\n在 Oracle 数据库中，任何保存的已训练模型——连同所有相关的元数据、训练/测试集、指标和超参数——都可以使用数据存储名称进行检索。这种持久化机制允许任何实验被可靠地重复，而无需专门管理磁盘上的文件。\n\
  \n## 利用开源包\n\n如今，有许多开源工具可用于满足 ML 生命周期中的特定需求。通过支持多种 API（例如 OML4R、OML4Py、OML4SQL 和\
  \ OML4Spark），可以将第三方或开源包与 OML 平台集成，以增强 ML 管道的功能。以下部分说明如何使用开源工具实现数据验证和模型监控。我们将介绍 TensorFlow\
  \ Extended、scikit-multiflow 和 Kubeflow。\n\n### 用于数据验证的 TensorFlow Extended (TFX)\n\
  \nTensorFlow 数据验证 (TFDV) 是 TensorFlow Extended 的一个组件，但 TFDV 可以在不需要 TFX 的情况下部署。\n\
  \nTFDV 验证可以应用于输入数据和预测值中的所有重要特征/标签。\n\n支持的异常检测用例将在以下小节中讨论。\n\n#### 基于模式的验证\n\n根据数据类型、范围和其他统计数据，对照模式执行有效性检查。所有异常都会作为数据验证的结果报告。\n\
  \n用户无需手动从头构建模式，而是可以自动使用 `infer_schema()` 方法从任何输入数据集自动生成模式的初始版本。用户可以根据需要修改生成的模式。\n\
  \n#### 训练与服务偏差检测\n\n此功能检测训练数据和服务数据之间的以下类型的偏差。\n\n*   **模式偏差**：检测训练数据集和服务数据集是否不符合相同的模式。\n\
  *   **特征偏差**：检测训练时的特征值是否与服务时的特征值不同。\n*   **分布偏差**：检测训练数据的特征值分布是否与服务数据的特征值分布显著不同。\n\
  \n\n\n#### 漂移检测\n\n数据漂移的检测涉及对一系列数据进行比较。仅对连续两个数据集（例如，连续两天的训练数据）之间的分类特征进行比较。漂移程度通过\
  \ L-无穷范数距离来衡量。用户需定义一个可接受的阈值距离值，当漂移超过该阈值时，系统会通知用户。\n\n### 用于模型监控的 scikit-multiflow\n\
  \n基于一种称为*自适应窗口*（ADWIN）的算法，scikit-multiflow Python 包能够检测动态环境中的概念漂移变化。每当有新值添加到数据中时，ADWIN\
  \ 会在一个自动增长和收缩的自适应窗口内跟踪数据的若干统计属性。这些统计属性包括所有值的总和、窗口宽度以及总方差。`admin.detected_change()`\
  \ 方法用于指示变化。更多信息可在 GitHub 仓库 [`https://github.com/scikit-multiflow/scikit-multiflow`](https://github.com/scikit-multiflow/scikit-multiflow)\
  \ 中找到。\n\n一旦检测到变化（图 9-3 中的步骤 6），自动 ML 流水线将被触发重启，以使用更新的数据集重新训练模型（图 9-3 中的步骤 4）。此外，如果需要进行人工调查或代码更改，更显著的漂移可能会触发向数据科学家发送通知。在这种情况下，新代码可以触发整个\
  \ ML 流水线的重新部署（图 9-3 中的步骤 1 到 3）。\n\n### Kubeflow：云原生 ML 流水线部署\n\nKubeflow 是一个开源项目，支持云原生\
  \ ML 流水线部署。Kubeflow 可在任何符合 Kubernetes 标准的集群（云端或本地）中运行。使用 Kubeflow，您可以执行以下操作。\n\n\
  ![../images/499897_1_En_9_Chapter/499897_1_En_9_Fig10_HTML.jpg](img/499897_1_En_9_Fig10_HTML.jpg)\n\
