  \ HR 用户授予 OML 开发者角色，如图 4-28 所示。\n\n## 总结\n\n本章介绍了 Oracle 云基础设施服务，并特别关注了自治数据库云服务。我们讨论了如何在\
  \ OCI 服务和自治数据库（如 ADW）上注册免费套餐帐户，以及如何实现“始终免费”服务以利用这些云服务进行持续的机器学习项目。我们还讨论了如何执行一些重要任务，例如建立数据库连接、加载数据以及将模式和表导入\
  \ ADW，这些可以被视为使用 ADW 进行机器学习项目所必需的数据库技能。在本章末尾，我们介绍了 ADW 中的 Oracle 机器学习内置工具。下一章将重点介绍如何使用此工具开发机器学习项目。\n\
  \n# 5. 使用自治数据库运行 Oracle 机器学习\n\n上一章探讨了 Oracle 机器学习 (OML)，这是自治数据库提供的内置环境。我们讨论了如何添加数据库用户帐户或为现有数据库用户帐户授予机器学习开发者角色。此角色使数据库帐户用户能够使用\
  \ OML 环境和自治数据库进行机器学习项目。Oracle 机器学习适用于两种类型的 Oracle 自治数据库：自治数据仓库 (ADW) 和自治事务处理 (ATP)。\n\
  \n本章深入探讨 Oracle 机器学习环境。它讨论了环境的元素（工作区、项目和笔记本）以及如何为协作式 OML 开发项目在开发人员之间共享此环境。我们探讨了两个重要的笔记本设置：数据库连接设置和解释器绑定设置。数据库连接设置指定笔记本及其后端数据库（在本例中为\
  \ Oracle 自治数据库）的链接。虽然本章的其余部分侧重于 ADW，但内容也适用于 ATP。\n\n笔记本的解释器绑定决定了段落如何被解释和执行。一个重要的解释器绑定是与\
  \ Oracle 数据库的 SQL 和 PL/SQL 解释器（本质上是自治数据库）的绑定。通过设置解释器绑定和与 ADW 数据库的数据库连接，您可以在笔记本中创建并运行针对后端\
  \ ADW 数据库的 SQL 语句和 PL/SQL 脚本。通过利用 OML 中的 SQL 和 PL/SQL 支持，笔记本、开发人员、数据科学家和业务分析师可以完成其机器学习项目中的一些关键任务。\n\
  \n*   在笔记本中运行 PL/SQL 脚本允许 Oracle SQL 机器学习 (OML4SQL) 包执行基本的机器学习任务，例如数据转换、模型构建和模型评估。\n\
  \n*   在笔记本中执行 SQL 语句会从自治数据库中获取结果数据。结果数据可以以各种格式显示，用于数据分析、数据发现和数据可视化。\n\n本章涵盖以下主题。\n\
  \n*   OML 协作环境\n\n*   运行 SQL 脚本和 SQL 语句\n\n*   笔记本和数据可视化\n\n\n\n## Oracle 机器学习协作环境\n\
  \n在 ADW 等 Oracle 自治数据库中，Oracle 机器学习笔记本提供了一个基于 Web 的协作式界面，用于数据分析、数据发现、数据可视化和协作。此笔记本环境基于\
  \ Apache Zeppelin 笔记本，允许数据科学家和开发人员协作构建、评估和部署机器学习模型。您可以在笔记本中编写代码、脚本和文本，并在 ADW 数据库中执行它们。笔记本允许您根据执行的代码或脚本（例如\
  \ SQL 查询结果或来自 ADW 的 SQL 脚本）创建数据可视化并执行数据分析。\n\n### Oracle 机器学习入门\n\n要在 ADW 中使用 Oracle\
  \ 机器学习，您需要使用具有 OML 开发者角色的 ADW 数据库用户帐户登录 OML。ADW 数据库的管理员可以创建一个具有 OML 开发者角色的新数据库用户帐户，或者简单地将\
  \ OML 开发者角色授予 ADW 中的现有用户，如第 3 章所述。\n\n登录 OML 后，您将进入主页（见图 5-1）。\n\n![../images/499897_1_En_5_Chapter/499897_1_En_5_Fig1_HTML.jpg](img/499897_1_En_5_Fig1_HTML.jpg)\n\
  \n图 5-1\n\nOracle 机器学习主页\n\n页面上有两个部分。“我该怎么做？”部分提供了许多在线文档和实践教学材料的链接。“快速操作”部分包含指向操作页面的链接。单击“笔记本”、“运行\
  \ SQL 语句”或“运行 SQL 脚本”将分别进入笔记本创建页面、SQL 查询草稿页面或 SQL 脚本草稿页面。“示例”链接列出了许多很好的示例，您可以尝试这些示例来获得机器学习任务的实践经验。“作业”链接允许您调度要在笔记本中运行的作业。\n\
  \n在主页的右上角，一个文本框 ![../images/499897_1_En_5_Chapter/499897_1_En_5_Figa_HTML.jpg](img/499897_1_En_5_Figa_HTML.jpg)\
  \ 显示了当前项目名称和工作区名称。OML 提供了三个层级来组织内容：工作区、项目和笔记本。工作区是您可以存储项目的区域。一个项目可以有一个或多个笔记本。换句话说，工作区是项目的容器，而项目是笔记本的容器。\n\
  \n当用户首次登录 OML 时，会创建一个初始工作区和一个默认项目。如图 5-2 所示，新用户登录名 Johndev1 被提供了初始工作区 John Workspace\
  \ 和默认项目 John Project。\n\n![../images/499897_1_En_5_Chapter/499897_1_En_5_Fig2_HTML.jpg](img/499897_1_En_5_Fig2_HTML.jpg)\n\
  \n图 5-2\n\n初始工作区和默认项目\n\n用户还可以创建其他工作区和项目，并选择不同的工作区和项目来创建笔记本。如图 5-3 所示，通过单击 Oracle\
  \ 机器学习主页右上角的文本框，您可以看到一个项目工作区下拉列表，您可以从中选择一个项目、创建一个新项目或管理工作区和权限。列表顶部指示当前项目和当前工作区。\n\
  \n![../images/499897_1_En_5_Chapter/499897_1_En_5_Fig3_HTML.jpg](img/499897_1_En_5_Fig3_HTML.jpg)\n\
  \n图 5-3\n\n项目工作区下拉列表\n\n要创建新项目，您可以使用现有工作区，也可以通过单击 +（加号）创建新工作区，如图 5-4 所示。\n\n![../images/499897_1_En_5_Chapter/499897_1_En_5_Fig4_HTML.jpg](img/499897_1_En_5_Fig4_HTML.jpg)\n\
  \n图 5-4\n\n创建项目\n\n图 5-5 展示了两个登录用户 Johndev1 和 Nancydev2 及其在 OML 中的工作区、项目和笔记本，以及它们如何连接到\
  \ ADW 数据库的示例。\n\n![../images/499897_1_En_5_Chapter/499897_1_En_5_Fig5_HTML.jpg](img/499897_1_En_5_Fig5_HTML.jpg)\n\
  \n图 5-5\n\n用户登录及其工作区、项目和笔记本\n\n### 与其他用户共享工作区\n\n您可以通过允许其他用户访问您的工作区以及工作区内的项目和笔记本，与他们进行协作。您可以向其他用户授予三种不同类型的工作区访问权限。\n\
  \n*   **管理者**：对工作区仅查看；对项目可创建、更新和删除；对笔记本可创建、更新、运行、删除和调度作业。请注意，拥有管理者权限的用户还可以在所有者账户上删除表并运行任何脚本。\n\
  \n*   **开发者**：对工作区仅查看；对项目仅查看；对开发者自己创建的笔记本可创建、更新、运行或删除。请注意，拥有开发者权限的用户还可以在所有者账户上删除表并运行脚本。您只能查看和运行来自共享笔记本的作业。开发者不能为共享的笔记本创建作业。\n\
  \n要向其他用户授予访问权限，请单击 OML 主页右上角的“项目和 Workspace”框以获取下拉列表。然后，选择“工作区权限”，如图 5-6 所示。\n\n\
  ![../images/499897_1_En_5_Chapter/499897_1_En_5_Fig6_HTML.jpg](img/499897_1_En_5_Fig6_HTML.jpg)\n\
  \n图 5-6\n\n下拉列表\n\n在“工作区权限”窗口中，从菜单中选择用户和权限类型：管理者、开发者和查看者，如图 5-7 所示。单击 +添加 和 确定。\n\
  \n![../images/499897_1_En_5_Chapter/499897_1_En_5_Fig8_HTML.jpg](img/499897_1_En_5_Fig8_HTML.jpg)\n\
  \n图 5-8\n\nNancydev2 拥有 John Workspace 的访问权限\n\n![../images/499897_1_En_5_Chapter/499897_1_En_5_Fig7_HTML.jpg](img/499897_1_En_5_Fig7_HTML.jpg)\n\
  \n图 5-7\n\n工作区权限窗口\n\n接下来，用户获得访问共享工作区的权限。如图 5-9 所示，除了默认的 Nancy Workspace 之外，Nancydev2\
  \ 用户还拥有 John Workspace 以及两个项目 John Project 和 project2 的访问权限。\n\n![../images/499897_1_En_5_Chapter/499897_1_En_5_Fig9_HTML.jpg](img/499897_1_En_5_Fig9_HTML.jpg)\n\
  \n图 5-9\n\n笔记本屏幕\n\n\n\n### 创建机器学习笔记本\n\n选择项目或创建新项目后，您可以在所选项目内创建笔记本。您可以通过点击快速操作区域中的笔记本图标，或在\
  \ OML 主页左上角的下拉菜单中选择“笔记本”来开始创建笔记本。这将进入笔记本页面，如图 5-9 所示。\n\n点击“创建”按钮将进入“创建笔记本”对话框。您可以在“名称”字段中指定笔记本名称，并在“注释”字段中输入任何注释。在“连接”字段中，您可以采用默认的“全局”连接组，然后点击“确定”按钮完成创建过程，如图\
  \ 5-10 所示。\n\n![../images/499897_1_En_5_Chapter/499897_1_En_5_Fig10_HTML.jpg](img/499897_1_En_5_Fig10_HTML.jpg)\n\
  \n图 5-10\n\n创建笔记本\n\n“连接”字段指定了笔记本如何连接到获取查询结果的后端数据库。该连接组由一种连接类型组成：全局。当新数据库配置完成后，会自动创建全局连接组。它指向笔记本创建者（本例中为\
  \ JohnDev1）所属的 ADW 数据库。\n\n您可以通过以管理员账户登录 OML 来验证此配置。在登录主页左侧的下拉菜单中，点击“连接组”进入“连接组：全局”页面（见图\
  \ 5-11）。\n\n![../images/499897_1_En_5_Chapter/499897_1_En_5_Fig11_HTML.jpg](img/499897_1_En_5_Fig11_HTML.jpg)\n\
  \n图 5-11\n\n默认全局连接组\n\n此全局连接组包含三个指向 ADW 数据库的数据库服务（高、中、低）。\n\n### 指定解释器绑定和连接组\n\n\
  您可以在笔记本中编写 SQL 语句或 PL/SQL 脚本。您需要了解这些 SQL 语句和 PL/SQL 脚本是如何被解释和执行的。这个问题的答案与笔记本的解释器绑定有关。一个\
  \ Zeppelin 笔记本由多个段落组成，这些段落可以包含文本、SQL 语句和脚本（PL/SQL）。段落中的这些不同内容需要不同的解释器来处理。通常，解释器的名称设置在段落顶部，如下所示。\n\
  \n*   `%md`：使用纯文本格式化语法，可转换为 HTML 格式的 Markdown 语言\n*   `%sql`：运行单个 SQL 语句\n*   `%script`：运行一组\
  \ SQL 语句或 PL/SQL 脚本\n\nOracle 数据库在后端提供 SQL 解释器和脚本解释器，用于处理诸如 SQL 和 PL/SQL 之类的数据处理语言。为了让笔记本使用这些解释器，您需要将其绑定到一个解释器，以便从数据库或任何数据源获取数据。Oracle\
  \ 机器学习笔记本必须设置解释器绑定，以连接 ADW 数据库解释器组中的 SQL 和 PL/SQL 解释器。\n\n笔记本有一个解释器设置规范，其中包含一个内部绑定列表，该列表决定了解释器组中解释器绑定的顺序。解释器的名称采用“数据库名\
  \ _ 服务名”的格式；例如，图 5-12 中的 `kaiadw1_low %sql`（默认）、`%script`。您可以通过点击屏幕右上角的齿轮图标 ![../images/499897_1_En_5_Chapter/499897_1_En_5_Figb_HTML.jpg](img/499897_1_En_5_Figb_HTML.jpg)\
  \ 来检查解释器绑定的顺序。\n\n![../images/499897_1_En_5_Chapter/499897_1_En_5_Fig12_HTML.jpg](img/499897_1_En_5_Fig12_HTML.jpg)\n\
  \n图 5-12\n\n解释器绑定\n\n图 5-12 展示了 Oracle 数据库解释器组中解释器绑定的默认顺序示例。\n\n*   `kaiadw1_low\
  \ %sql`（默认）、`%script`：它为每条 SQL 语句提供最低级别的资源。但它可以支持最大数量的并发 SQL 语句。此解释器优先级较低，被列为默认选项。此解释器可用于\
  \ SQL 语句和 PL/SQL 脚本。\n*   `kaiadw1_medium %sql`（默认）、`%script`：它为每条 SQL 语句提供较低级别的资源。但它可以支持更多的并发\
  \ SQL 语句。此解释器可用于 SQL 语句和 PL/SQL 脚本。\n*   `kaiadw1_high %sql`（默认）、`%script`：它为每条\
  \ SQL 语句提供最高级别的资源。此解释器通过支持最少数量的并发 SQL 语句来提供最高性能。此解释器可用于 SQL 语句和 PL/SQL 脚本。\n*  \
  \ `Md %md`（默认）：它提供纯文本格式化语法，可转换为 HTML 格式。\n\n您可以通过拖放解释器绑定来更改顺序。列表中的第一个解释器绑定是默认选择。您可以点击为此笔记本绑定/解绑解释器。您也可以更改任何特定段落的解释器绑定。\n\
  \n笔记本的连接组定义了一组到这些解释器的连接。由于 SQL 和 PL/SQL 解释器在 Oracle 数据库解释器组中使用，因此连接组也是数据库连接的集合。默认情况下是“全局连接组”，如图\
  \ 5-13 所示。连接组是全局的。\n\n![../images/499897_1_En_5_Chapter/499897_1_En_5_Fig13_HTML.jpg](img/499897_1_En_5_Fig13_HTML.jpg)\n\
  \n图 5-13\n\n连接组\n\n当创建新的 ADW 数据库时，会自动创建此全局连接组。此全局连接组的连接类型为“全局”，并包含一个作为计算资源的数据库连接列表。点击“全局”一词会显示列在“计算资源”下的数据库连接，例如\
  \ `kaiadw1_high`、`kaiadw1_medium` 和 `kaiadw1_low`，如图 5-14 所示。您可能已经注意到，这些数据库连接名称也显示在图\
  \ 5-12 的解释器绑定中。这些连接表示与笔记本的解释器绑定的连接。\n\n![../images/499897_1_En_5_Chapter/499897_1_En_5_Fig14_HTML.jpg](img/499897_1_En_5_Fig14_HTML.jpg)\n\
  \n图 5-14\n\n全局连接组的数据库连接\n\n当笔记本使用 `kaiadw1_low %sql` 解释器绑定时，它会使用 `kaiadw1_low %sql`\
  \ 解释器来解释 SQL 语句。它还会使用 `kaiadw1_low` 数据库服务连接到数据库。\n\n一旦使用解释器绑定设置创建了笔记本，您就可以编写包含 SQL\
  \ 语句或 PL/SQL 脚本的段落，用于数据分析、数据发现和数据可视化。您可以通过点击运行图标 ![../images/499897_1_En_5_Chapter/499897_1_En_5_Figc_HTML.jpg](img/499897_1_En_5_Figc_HTML.jpg)\
  \ 来运行一个或所有代码段落。结果可以通过点击下载图标 ![../images/499897_1_En_5_Chapter/499897_1_En_5_Figd_HTML.jpg](img/499897_1_En_5_Figd_HTML.jpg)\
  \ 导出。\n\n图 5-15 展示了您可以在笔记本中编写和执行 SQL 查询语句。\n\n![../images/499897_1_En_5_Chapter/499897_1_En_5_Fig15_HTML.jpg](img/499897_1_En_5_Fig15_HTML.jpg)\n\
  \n图 5-15\n\n编辑笔记本\n\n## 运行 SQL 脚本和语句\n\n通常，数据库应用程序开发环境允许编写或执行单个 SQL 语句以及 SQL 或 PL/SQL\
  \ 脚本。接下来，我们讨论 Oracle 机器学习笔记本环境如何支持这两种方式。\n\n\n\n### 在笔记本中创建并执行 SQL 脚本\n\n借助 SQL\
  \ Developer 或 SQL*Plus 工具，您可以在 Oracle Machine Learning 笔记本中编写和执行 SQL 脚本。您可以将多个 SQL\
  \ 语句或 PL/SQL 块放入一个脚本中，在笔记本中运行该脚本，并将其保存为 JSON 文件。\n\n要创建 SQL 脚本，请在 OML 主页上单击“运行 SQL\
  \ 脚本”以打开 SQL 草稿板。然后输入 **%script** 并按 Enter 键，打开下一行以输入和编辑 SQL 脚本。完成脚本编辑后，您可以单击 ![../images/499897_1_En_5_Chapter/499897_1_En_5_Fige_HTML.jpg](img/499897_1_En_5_Fige_HTML.jpg)\
  \ 按钮在后端数据库中运行该脚本。\n\n图 5-16 展示了创建一个调用 CREATE_MODEL 过程的示例 SQL 脚本。这是用于机器学习模型创建的 ML4SQL\
  \ 过程。\n\n![../images/499897_1_En_5_Chapter/499897_1_En_5_Fig16_HTML.jpg](img/499897_1_En_5_Fig16_HTML.jpg)\n\
  \n图 5-16\n\n创建 SQL 和 PL/SQL 脚本\n\n您还可以通过单击 ![../images/499897_1_En_5_Chapter/499897_1_En_5_Figf_HTML.jpg](img/499897_1_En_5_Figf_HTML.jpg)\
  \ 图标，将 SQL PL/SQL 脚本导出为本地系统中的 .json 文件。\n\n### 在笔记本中运行 SQL 语句\n\n通过连接组设置以及与后端 ADW\
  \ 数据库的解释器绑定，Oracle Machine Learning 笔记本可以被视为 ADW 数据库的 Web 前端开发和 GUI 界面。您可以在笔记本中编写\
  \ SQL 语句，并让后端 ADW 数据库解释和执行这些语句，类似于 SQL*Plus 或 SQL Developer 等 Oracle 客户端工具连接到后端的\
  \ ADW 数据库。\n\n登录 OML 后，在“快速操作”部分单击“运行 SQL 语句”，SQL 查询草稿板随即打开。在 SQL 查询草稿板上，输入 %sql\
  \ 并按 Enter 键。您可以在下一行输入 SQL 语句。要运行该 SQL 语句，请单击 ![../images/499897_1_En_5_Chapter/499897_1_En_5_Figg_HTML.jpg](img/499897_1_En_5_Figg_HTML.jpg)\
  \ 或按 Shift+Enter 键。如果 SQL 语句成功运行，其执行状态将显示为 FINISHED；如果出现错误，则显示为 ERROR 并附带错误消息（见图\
  \ 5-17）。\n\n![../images/499897_1_En_5_Chapter/499897_1_En_5_Fig17_HTML.jpg](img/499897_1_En_5_Fig17_HTML.jpg)\n\
  \n图 5-17\n\n执行 SQL 语句并返回状态\n\nOracle Machine Learning 笔记本使您能够可视化数据。如果您运行一条 select\
  \ 语句从后端数据库获取数据。例如，在 `select * from sh.customers` 中，该语句被发送到解释器执行。它从后端数据库获取数据，并显示在\
  \ select 语句下方的输出区域中。输出会话默认以表格格式显示数据，如图 5-18 所示。\n\n![../images/499897_1_En_5_Chapter/499897_1_En_5_Fig18_HTML.jpg](img/499897_1_En_5_Fig18_HTML.jpg)\n\
