  ### 应该包含多少个滞后？


  现在，时间序列分析中的大问题始终是应该包含多少个滞后。这被称为**时间序列的阶数**。符号 **AR(1)** 表示**阶数为 1**，**AR(p)** 表示**阶数为
  p**。


  阶数由你决定。从理论上讲，你可以根据 PACF 图来确定阶数。理论告诉你，要取自相关变为 0 之前的滞后数量。所有其他滞后应为 0。


  在理论中，你经常看到一些很棒的图表，其中第一个尖峰非常高，其余部分为零。在这些情况下，选择很容易：你正在处理一个非常“纯粹”的 AR(1) 示例。另一种常见情况是，你的自相关从高值开始，然后缓慢衰减到零。在这种情况下，你应该使用所有
  PACF 尚未为零的滞后。


  然而，在实践中，情况并不总是这么简单。请记住那句名言：“所有模型都是错的，但有些是有用的。”很难找到完全符合 AR 模型的案例。通常，自回归过程有助于解释变量的一部分变化，但并非全部。


  在地震示例中，更远的滞后上仍然存在一点偏自相关，并且这种情况一直持续到非常远的滞后。甚至在滞后 18 处也有一个 PACF 尖峰。这可能意味着很多事情：也许确实存在与较远滞后的自相关。或者可能有一个隐藏的过程是
  AR 模型未能很好捕捉的。


  在实践中，你将尝试选择能为模型带来**最佳预测性能**的滞后数量。最佳预测性能通常不是通过查看自相关图来定义的：这些图只给你一个理论上的估计。然而，预测性能的最佳定义是通过进行**模型评估和基准测试**，使用你在第
  2 章中看到的技术。在本章后面，你将看到如何使用模型评估来为 AR 模型选择一个高性能的阶数。但在深入探讨之前，是时候更深入地了解 AR 模型的确切定义了。


  ## AR 模型定义


  到目前为止，你已经直观地了解了自回归模型的许多方面。如前所述，自相关显示了每个滞后是否与当前值存在相关性。AR 模型利用这些相关性来构建预测模型。


  但最重要的部分仍然缺失：AR 模型的数学定义。为了基于自相关进行预测，你需要将目标变量的未来值表示为滞后变量的函数。对于 AR 模型，这给出了以下模型定义：


  ![$$ {X}_t=\sum \limits_{i=1}^p{\varphi}_i{X}_{t-i}+{\varepsilon}_t $$](img/508548_1_En_3_Chapter_TeX_Equb.png)


  在这个公式中，*X*[*t*] 是当前值，它被计算为每个滞后值 *X*[*t* − *i*] 乘以该特定滞后的系数 *φ*[*i*] 的总和。最后的误差项 *ε*[*t*]
  是你无法预测的随机噪声，但你可以对其进行估计。


  ## 使用 Yule-Walker 方程估计 AR


  你现在已经了解了**AR 模型的定义**。也就是说，你已经定义了它的形式。然而，只要没有可以代入公式的值，你就无法使用它。下一步是**拟合模型**：你需要找到每个系数的最优值才能使用它。这也被称为**估计系数**。


  一旦你有了参数的值，使用模型就相对容易了：只需代入滞后值即可。但正如任何机器学习理论一样，困难的部分总是在于估计模型。


  在公式中，你看到过去的值 (*X*[*t* − *i*]) 乘以一个系数 (*φ*[*i*])。这些值的总和将给出当前值 *X*[*t*]。当开始拟合模型时，你已经知道过去的值和当前值。你唯一不知道的是
  φ 值 (*φ*[*i*])。φ 值是需要通过数学方法找到的，以定义模型。一旦你估计出这些 φ 值，你将能够使用估计出的 φ 值和已知的今天及之前的值来计算明天的
  *X*[*t*] 值。


  对于 AR 模型，已经找到了不同的方法来估计系数（φ 值），但 Yule-Walker 方法被普遍认为是最合适的方法。




  ### 尤尔-沃克方法


  **尤尔-沃克方法**包含一组方程：


  ![$$ {\gamma}_m=\sum \limits_{k=1}^p{\varphi}_k{\gamma}_{m-k}+{\sigma}_{\varepsilon}²{\delta}_{m,0}
  $$](img/508548_1_En_3_Chapter_TeX_Equc.png)


  在此公式中，*γ*[*m*] 是 *X*[*t*] 的**自协方差函数**。*m* 是从 0 到 p 的滞后数（p 为最大滞后数）。因此共有 p + 1 个方程。![$$
  {\sigma}_{\varepsilon}² $$](img/508548_1_En_3_Chapter_TeX_IEq1.png) 是误差的标准差。


  *δ*[*m*, 0] 是**克罗内克δ函数**：若两个值相等（即 m 等于 0），则返回 1；若 m 不等于 0，则返回 0。由此可见，当 m 为 0 时，加号后的所有项等于
  ![$$ {\sigma}_{\varepsilon}² $$](img/508548_1_En_3_Chapter_TeX_IEq2.png)，否则整体等于
  0。因此，只有一个方程包含加号后的部分，而其他方程（从 m = 1 到 m = p）则不包含该部分。


  求解的关键在于，首先仅将 m = 1 到 m = p 的方程（共 p 个方程）写成**矩阵形式**：


  ![$$ \left(\begin{array}{c}{\gamma}_1\\ {}{\gamma}_2\\ {}{\gamma}_3\\ {}\dots \\
  {}{\gamma}_p\end{array}\right)=\left(\begin{array}{cccc}{\gamma}_0&amp; {\gamma}_{-1}&amp;
  {\gamma}_{-2}&amp; \dots \\ {}{\gamma}_1&amp; {\gamma}_0&amp; {\gamma}_{-1}&amp;
  \dots \\ {}{\gamma}_2&amp; {\gamma}_1&amp; {\gamma}_0&amp; \dots \\ {}\dots &amp;
  \dots &amp; \dots &amp; \dots \\ {}{\gamma}_{p-1}&amp; {\gamma}_{p-2}&amp; {\gamma}_{p-3}&amp;
  \dots \end{array}\right)\left(\begin{array}{c}{\varphi}_1\\ {}{\varphi}_2\\ {}{\varphi}_3\\
  {}\dots \\ {}{\varphi}_p\end{array}\right) $$](img/508548_1_En_3_Chapter_TeX_Equd.png)


  这可以用**矩阵符号**表示为：


  ![$$ \mathbf{\mathsf{\boldsymbol{\upgamma}}}={\mathbf{\mathsf{\boldsymbol{\Gamma}}}}^{\hbox{-}
  \mathbf{\mathsf{1}}}\hat{\boldsymbol{\upphi}} $$](img/508548_1_En_3_Chapter_TeX_Eque.png)


  要获得 φ 的值，可以使用**普通最小二乘法**（OLS）。普通最小二乘法是一种矩阵计算方法，广泛应用于统计学中来解决此类问题。当您拥有包含历史数据的矩阵和包含历史结果的向量时，该方法可用于估计系数。找到
  φ 的最佳估计值的解如下：


  ![$$ \hat{\boldsymbol{\upphi}}={\left({\mathbf{\mathsf{\boldsymbol{\Gamma}}}}^{\mathbf{T}}\mathbf{\mathsf{\boldsymbol{\Gamma}}}\right)}^{-\mathbf{1}}{\mathbf{\mathsf{\boldsymbol{\Gamma}}}}^{\mathbf{T}}\boldsymbol{\upgamma}
  $$](img/508548_1_En_3_Chapter_TeX_Equf.png)


  您将在本书的第 11 章及其他章节中再次看到 OLS 方法。


  一旦应用了 OLS，您将获得 φ 的估计值，然后可以通过使用估计出的 φ 来求解以下方程，从而计算 σ：


  ![$$ {\gamma}_0=\sum \limits_{k=1}^p{\varphi}_k{\gamma}_{m-k}+{\sigma}_{\varepsilon}²
  $$](img/508548_1_En_3_Chapter_TeX_Equg.png)


  现在，您将使用清单 3-12 在 Python 中开始拟合 AR 模型。在此情况下，拟合模型意味着为 φ 确定最佳可能值。由于您处理的是真实数据而非模拟样本，请注意，在本示例中，您将致力于使
  AR 模型达到最佳拟合效果。


  ```

  from statsmodels.regression.linear_model import yule_walker

  coefficients, sigma = yule_walker(differenced_data, order = 3)

  print(''coefficients: '', -coefficients)

  print(''sigma: '', sigma)

