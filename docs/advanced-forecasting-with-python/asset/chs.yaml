  ### 对 kNN 进行网格搜索


  scikit-learn 实现默认使用的邻居数量是五个。现在作为最后一步，我们尝试添加一个网格搜索，看看不同数量的邻居是否能带来更好的性能。我们以 2 为增量测试邻居数量，以稍微加快速度。这在代码清单
  13-5 中完成。


  ```

  from sklearn.model_selection import GridSearchCV

  my_knn = GridSearchCV(KNeighborsRegressor(),

  {''n_neighbors'':[2, 4, 6, 8, 10, 12]},

  scoring = ''r2'', n_jobs = -1)

  my_knn.fit(X_train, y_train)

  print(r2_score(list(y_test), list(my_knn.predict(X_test))))

  print(my_knn.best_estimator_)

  代码清单 13-5

  为 kNN 模型添加网格搜索交叉验证

  ```


  使用这个调优后的模型获得的 R² 得分是 **0.9695**。该模型使用了八个最近邻居而不是五个，并且在 R² 得分上提高了 0.0002 点。这个提升非常小，因此几乎可以认为改进不存在。在这种情况下，默认模型从一开始就相当不错。


  ### 随机搜索：网格搜索的替代方案


  作为本章的最后一个主题，我想介绍一种网格搜索的替代方案。这种替代方案称为随机搜索。随机搜索在直观上非常容易理解：它不是检查网格上超参数的每一种组合，而是检查超参数的一个随机选择。


  这样做的主要原因是它快得多。此外，人们发现随机搜索通常能够获得与网格搜索非常接近的结果，因此速度上的提升是完全值得的。代码清单 13-6 展示了如何用随机搜索替换网格搜索。


  ```

  from sklearn.model_selection import RandomizedSearchCV

  my_knn = RandomizedSearchCV(KNeighborsRegressor(),

  {''n_neighbors'':list(range(1, 20))},

  scoring = ''r2'', n_iter=10, n_jobs = -1)

  my_knn.fit(X_train, y_train)

  print(r2_score(list(y_test), list(my_knn.predict(X_test))))

  print(my_knn.best_estimator_)

  代码清单 13-6

  为 kNN 模型添加随机搜索交叉验证

  ```


  随机搜索被允许在 1 到 20 之间选择任意 k 值。参数 **n_iter** 决定了在此范围内应**随机选择**的值的数量。请注意，选择是随机的，因此这可能会给出与网格搜索不同的结果。无法保证某个特定值会被包含在测试中。


  为了与网格搜索进行公平比较，我们将 n_iter 设置为 6。由于网格搜索中测试了六个值，这使得两者等效。执行代码时，返回的解与网格搜索返回的解完全相同。


  ## 要点总结


  *   kNN 模型基于其最近邻居的值进行预测。


  *   通过计算平均值或基于距离的加权平均值，将邻居的值合并为预测结果。


  *   距离度量通常使用欧几里得距离。


  *   在组合中使用的邻居数量记为 k，是模型的一个超参数。


  *   k 的值可以通过超参数调优来优化，例如通过网格搜索交叉验证。


  *   随机搜索是网格搜索的一种替代方案，它速度更快，并且通常能给出（几乎）同样好的结果。




  '
- "# 14. 随机森林\n\n在本章中，你将了解**随机森林模型**。这是一个易于使用的模型，并且以性能卓越而闻名。随机森林以及你将在下一章中了解的 XGBoost\
  \ 模型，是现代应用中最常用的两种机器学习算法。\n\n市场上存在大量随机森林和 XGBoost 的变体，但如果你理解了这两种基础模型，适应任何变体都将相对容易。\n\
  \n## 随机森林背后的直观思想\n\n随机森林*强烈基于决策树模型*，但为其增加了更多复杂性。顾名思义，随机森林由大量决策树组成，每棵树都有细微的差异。\n\n\
  随机森林的性能远优于决策树。通常，随机森林可以组合数百甚至数千个决策树模型。这些模型将在略有不同的数据上进行拟合，以确保它们不完全相同。简而言之，它是由大量决策树组成的，这些决策树做出的预测应该彼此接近，但又并非完全相同。\n\
  \n当单个机器学习模型有时会出错时，大量机器学习模型的平均预测则不太可能出错。这一思想是**集成学习**的基础。\n\n在随机森林中，集成学习应用于许多决策树的重复组合。集成学习可以应用于大量机器学习模型的任何组合。之所以使用决策树，是因为它已被证明是一种性能卓越且易于配置的模型。\n\
  \n## 随机森林概念 1：集成学习\n\n那么集成学习究竟是如何工作的呢？你可以理解，拥有 1000 棵完全相同的决策树，与只使用一棵决策树相比，没有任何附加价值。\n\
  \n在集成模型中，每个单独的模型都必须与其他模型略有不同。有两种著名的创建集成的方法：**装袋**和**提升**。\n\n随机森林使用装袋来创建决策树的集成。在下一章中，你将了解\
  \ XGBoost 算法，它使用了另一种称为提升的技术。\n\n让我们来探索装袋背后的思想。装袋是 Bootstrap 聚合的简称。其思想包含两个部分：\n\n\
  1.  Bootstrap\n\n2.  聚合\n\n### 装袋概念 1：Bootstrap\n\n**Bootstrap** 是该算法的关键部分之一，它确保每个单独的学习器都能拟合出略有不同的决策树。Bootstrap\
  \ 意味着对于每个单独的学习器，数据集是通过**重采样过程**创建的。\n\n重采样意味着基于原始数据集创建一个新的数据集。新数据集将通过从原始数据集中随机选择数据点来创建。然而，这里需要认识到的重要一点是，重采样是**有放回地**进行的。\n\
  \n有放回地重采样会将每个被采样的数据点放回母总体中。这使得原始数据集中的单个数据点有可能在 bootstrap 数据集中被多次选中。原始数据中也会有一些数据点不会被选入\
  \ bootstrap 数据集。示意图如图 14-1 所示。\n\n![../images/508548_1_En_14_Chapter/508548_1_En_14_Fig1_HTML.jpg](img/508548_1_En_14_Fig1_HTML.jpg)\n\
  \n图 14-1\n\nBootstrap 过程\n\n### 装袋概念 2：聚合\n\n**聚合**部分描述了使用多个学习器的事实。在随机森林中，bootstrap\
  \ 过程会执行多次。具体次数由一个名为 **n_estimators** 的超参数定义。\n\n对于每个 n_estimators，都会使用一个 bootstrap\
  \ 数据集构建一棵决策树。这将生成大量决策树，由于数据集的差异，这些树都略有不同。最后，你可以使用每棵决策树进行预测。然而，你会得到许多略有不同的预测。\n\n\
  这个问题的解决方案在于聚合部分。为了将所有单独的决策树预测组合成一个随机森林预测，你只需取所有单独预测的平均值。这相对简单，但却是该算法的关键部分。\n\n其背后的思想是，许多弱学习器的聚合将导致误差相互平均抵消。这使得随机森林成为一种性能非常卓越的机器学习算法。\n\
  \n## 随机森林概念 2：变量子集\n\n除了 bootstrap 方法之外，随机森林还有**第二个过程**来确保各个学习器不相同。这个过程不适用于使用或不使用的数据点，而是**适用于使用或不使用的变量**。\n\
  \n如第 12 章所述，决策树会检查每个变量以找到最佳分裂点并将其添加到树中。然而，当使用每个变量的一个子集时，你只让树在随机选择的变量数量中检查分裂点。具体数量在大多数数学描述中由一个名为\
  \ **mtry** 的超参数定义，在 scikit-learn 中则称为 **max_features**。虽然这有时可能导致选择次优的分裂点，但它确实有助于使各个决策树彼此不同。\n\
  \n这个值通常在 **80%** 左右，但也可以更高或更低。**n_estimators** 和 **max_features** 共同构成了随机森林模型的主要超参数。\n\
  \n\n\n## 使用随机森林预测太阳黑子\n\n让我们来开发一个随机森林模型的示例。在这个例子中，你将再次使用第 5 章中用过的太阳黑子数据。第 5 章中的\
