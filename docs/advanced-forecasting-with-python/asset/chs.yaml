  \ = 'holiday'\nholidays.columns = ['ds', 'holiday']\n清单 19-11\n准备假日数据\n```\n\n然后，你可以使用清单\
  \ 19-12 在添加假日参数的同时拟合模型。\n\n```\nm3 = Prophet(holidays=holidays)\nm3.fit(train)\n\
