  \ 中使用这个分布。\n\n\n\n### n_estimators 的分布\n\n对于 n_estimators 的分布，我们尝试一些不同的方法。假设我们想要测试\
  \ 50 到 1000 之间的值，但我们对 n_estimators 的实际值应该是什么并没有很好的想法。\n\n这意味着**均匀分布**可能是合适的：在均匀分布中，你指定一个最小值和最大值，介于两者之间的所有值被选中的概率**均等**。如代码清单\
  \ 14-7 所示。\n\n```\nx = np.linspace(0, 2000, 100)\nplt.plot(x, stats.uniform.pdf(x,\
  \ 50, 950))\nplt.show()\n代码清单 14-7\n测试 n_estimators 的均匀分布\n```\n\n生成的图表如图 14-4 所示。\n\
  \n![../images/508548_1_En_14_Chapter/508548_1_En_14_Fig4_HTML.jpg](img/508548_1_En_14_Fig4_HTML.jpg)\n\
  \n图 14-4\n\n最小值为 50、最大值为 1000 的均匀分布\n\n然而，这里有一个小问题。均匀分布返回的是浮点数，而 n_estimators 只能接受**整数**。对于均匀整数，更好的替代方案是使用\
  \ **scipy.stats.randint** 函数，该函数返回一个介于最小值和最大值之间的随机整数。\n\n### 拟合 RandomizedSearchCV\n\
  \n现在，我们使用代码清单 14-8 中的代码来拟合 RandomizedSearchCV。\n\n```\nfrom sklearn.model_selection\
  \ import RandomizedSearchCV\n# 指定要从中抽样的分布\ndistributions = {\n'max_features': stats.norm(0.8,\
  \ math.sqrt(0.005)),\n'n_estimators': stats.randint(50, 1000)\n}\n# 创建搜索对象\nmy_rf\
  \ = RandomizedSearchCV(RandomForestRegressor(),\ndistributions, n_iter=10,\nscoring\
  \ = 'r2',\nn_jobs = -1,\nrandom_state = 12345)\n# 拟合搜索\nmy_rf.fit(X_train, y_train)\n\
  # 打印结果\nprint(r2_score(list(y_test), list(my_rf.predict(X_test))))\nprint(my_rf.best_params_)\n\
  代码清单 14-8\n使用两个分布的 RandomizedSearchCV\n```\n\n你应该得到的结果是 R2 为 **0.86**，选定的超参数如下所示。请注意，由于随机性，你可能会得到略有不同的结果：\n\
  \n*   ‘max_features’: 0.70\n*   ‘n_estimators’: 819\n\nR2 略低于网格搜索得到的结果。然而，你应该会观察到执行时间的大幅提升。RandomizedSearchCV\
  \ 速度更快，而性能损失却非常微小：这是使用 RandomizedSearchCV 而非 GridSearchCV 的有力论据。\n\n## 随机森林的解释：特征重要性\n\
  \n到目前为止，你应该已经明白，随机森林是一个相对复杂的模型。在进行预测时，它结合了许多决策树的预测结果。这使得模型具有出色的性能，但也使得模型相对难以解释。\n\
  \n对于决策树模型，你已经了解了如何绘制树形图并根据新观测值跟踪其决策过程。而对于随机森林，你需要多次执行此操作，这使得过程非常困难。\n\n幸运的是，存在一种解释随机森林的替代方法。这种方法称为特征重要性。\n\
  \n每个变量的特征重要性是在随机森林拟合过程中全程计算的。每当一个变量被用于分裂时，该分裂带来的误差减少量就会被累加到该变量的特征重要性上。在算法结束时，这些累加的误差会被标准化，使得所有变量的特征重要性之和为\
  \ 1.0。\n\n变量的特征重要性越高，它在模型中扮演的角色就越重要，因此对你的预测也就越有价值。\n\n你可以使用代码清单 14-9 从随机森林中获取特征重要性。请注意，这里的随机森林是通过\
  \ RandomizedSearchCV 拟合的，这就是为什么你首先要调用 best_estimator。你还会看到如何将特征重要性数组组合成一个更易于访问的数据框。\n\
  \n```\nfi = pd.DataFrame({\n'feature': X_train.columns,\n'importance': my_rf.best_estimator_.feature_importances_})\n\
  fi.sort_values('importance', ascending=False)\n代码清单 14-9\n特征重要性\n```\n\n结果如图 14-5\
  \ 所示。\n\n![../images/508548_1_En_14_Chapter/508548_1_En_14_Fig5_HTML.jpg](img/508548_1_En_14_Fig5_HTML.jpg)\n\
  \n图 14-5\n\n随机森林的特征重要性\n\n如你所见，这里最重要的特征是 L1：1 阶滞后自回归分量。接下来的重要性是其他滞后项。我们可以从中理解到，模型主要是在学习自回归效应，其中较近的滞后项更为重要。这对于理解模型来说是一个有趣的发现。在某些情况下，这些信息还可以通过改进变量选择来帮助你进一步优化模型，或者为你如何改进特征工程提供线索。\n\
  \n## 关键要点\n\n*   随机森林将 Bagging 方法应用于决策树模型。\n*   Bagging 是一种集成方法：它多次拟合相同的模型，并将其平均值作为预测结果。\n\
  *   随机森林有两个主要的超参数：\n    *   森林中使用的树的数量\n    *   每次决策树分裂时使用的随机选择变量的数量\n*   随机搜索是一种更快的超参数调优方法，其结果通常不比网格搜索差太多。你可以为每个要调优的超参数指定概率分布，随机搜索将在这些分布中进行一定次数的抽样。\n\
  *   变量重要性是解释随机森林模型结果的一种方法。它也可以提示如何进一步改进模型。\n\n"
- "# 15. 使用 XGBoost 和 LightGBM 的梯度提升\n\n在本章中，你将了解**梯度提升模型**。在上一章中，你了解了集成方法背后的思想。回顾一下，集成方法通过结合众多小型、低性能模型的预测来做出强大的预测。\n\
  \n## 提升：集成学习的一种不同方式\n\n梯度提升结合了众多小型决策树模型来进行预测。当然，这些小决策树彼此不同；否则，使用更多数量的它们就没有任何优势了。\n\
  \n这里需要理解的重要概念是这些决策树是如何变得彼此不同的。这是通过一个称为**提升**的过程实现的。提升和你在上一章中看到的 Bagging 是集成学习的两种主要方法。\n\
  \n提升是一个**迭代过程**。它以智能的方式向集成模型中添加越来越多的弱学习器。在每一步中，单个数据点都会被赋予权重。已经预测良好的数据点对于将要添加的学习器来说并不重要。因此，新的弱学习器将*专注于学习尚未理解的内容，从而改进集成模型*。\n\
  \n你可以在图 15-1 中看到提升过程的示意图。通过这种方法，你迭代地拟合那些专注于数据中尚未理解部分的弱模型。在此过程中，你保留所有中间的弱模型。集成模型是所有那些弱学习器的组合。\n\
  \n![../images/508548_1_En_15_Chapter/508548_1_En_15_Fig1_HTML.jpg](img/508548_1_En_15_Fig1_HTML.jpg)\n\
  \n图 15-1\n\n提升过程\n\n\n\n## 梯度提升中的梯度\n\n这个迭代过程之所以被称为*梯度*提升，是有原因的。梯度是一个数学术语，指的是指向最陡坡度方向的偏导数向量场。简单来说，我们常将梯度比作上坡路的坡度：坡度越高，山丘越陡。梯度是通过对函数求导或求偏导来计算的。\n\
  \n在梯度提升中，当向模型添加额外的树时，目标是添加一棵能够最好地解释先前树未能解释的变异的树。因此，新树的目标是：\n\n![$$ y-\\hat{y} $$](img/508548_1_En_15_Chapter_TeX_Equa.png)\n\
  \n这可以改写为损失函数对 y 预测值的负偏导数：\n\n![$$ y-\\hat{y}=-\\frac{\\partial L}{\\partial \\hat{y}}\
  \ $$](img/508548_1_En_15_Chapter_TeX_Equb.png)\n\n你将其设置为新树的目标，以确保添加这棵树将解释整体梯度提升模型中最大量的额外变异。这就解释了为什么该模型被称为*梯度*提升。\n\
  \n## 梯度提升算法\n\n有许多算法各自执行略有不同版本的梯度提升。当梯度提升方法首次被发明时，算法性能并不高，但随着 AdaBoost 算法的出现，情况发生了改变：这是第一个能够适应弱学习器的算法。\n\
  \n梯度提升算法是市场上性能最高的机器学习工具之一。在 AdaBoost 之后，文献中又增加了一系列略有不同的提升算法，包括 XGBoost、LightGBM、LPBoost、BrownBoost、MadaBoost、LogitBoost\
  \ 和 TotalBoost。目前仍有许多贡献致力于改进梯度提升理论。在本章中，将介绍两种算法：XGBoost 和 LightGBM。\n\n**XGBoost**\
  \ 是最常用的机器学习算法之一。XGBoost 是快速获得良好性能的途径。由于它易于使用且性能卓越，是许多机器学习从业者的首选算法。\n\n**LightGBM**\
  \ 是另一种需要了解的梯度提升算法。目前，它不如 XGBoost 普及，但其受欢迎程度正在显著上升。LightGBM 相对于 XGBoost 的预期优势在于速度和内存使用方面的提升。\n\
  \n在本章中，你将了解这两种梯度提升算法的实现。\n\n## XGBoost 与 LightGBM 的区别\n\n如果你打算使用这两种梯度提升算法，理解它们之间的区别很重要。这也能让你洞察到市场上存在如此大量模型的原因所在。\n\
  \n区别在于它们在弱学习器（即单个决策树）中识别最佳分裂点的方式。请记住，决策树中的分裂是指树需要找到最能改进模型的那个分裂点。\n\n寻找最佳分裂点最直观简单的想法是遍历所有潜在的分裂点并找到最佳的那个。然而，这非常耗时，而近期的算法提出了更好的替代方案。\n\
  \nXGBoost 提出的替代方案是使用**基于直方图的分裂**。在这种情况下，模型不是遍历所有可能的分裂点，而是为每个变量构建直方图，并利用这些直方图来找到每个变量的最佳分裂点。然后保留全局最佳的分裂点。\n\
  \nLightGBM 由微软发明，它有一种更高效的方法来定义分裂点。这种方法称为**基于梯度的单边采样（GOSS）**。GOSS 为每个数据点计算梯度，并利用此信息过滤掉梯度较低的数据点。毕竟，梯度低的数据点已经被很好地理解了，而梯度高的个体则需要更好地学习。LightGBM\
  \ 还使用了一种称为**互斥特征捆绑（EFB）**的方法，该特性可以在有许多相关变量可供选择时加速处理。\n\n另一个区别是，LightGBM 模型采用按叶子节点生长（最佳优先）的树生长方式，而\
  \ XGBoost 则按层级生长树。你可以在图 15-2 中看到这种区别。理论上，这种区别在准确性方面有利于 LightGBM，但在数据量较少的情况下，它伴随着更高的过拟合风险。\n\
  \n![../images/508548_1_En_15_Chapter/508548_1_En_15_Fig2_HTML.jpg](img/508548_1_En_15_Fig2_HTML.jpg)\n\
  \n图 15-2\n\n按叶子节点生长与按层级生长\n\n有关梯度提升算法之间差异的更多详细信息，你可以查看微软的论文（[`www.microsoft.com/en-us/research/publication/lightgbm-a-highly-efficient-gradient-boosting-decision-tree/`](http://www.microsoft.com/en-us/research/publication/lightgbm-a-highly-efficient-gradient-boosting-decision-tree/)）。\n\
  \n## 使用 XGBoost 预测交通流量\n\n在本章中，我们将使用与 kNN 模型相同的数据集：州际交通流量。在之前的示例中，我们获得了 **0.9695**\
  \ 的 R2 值。梯度提升是一种性能更高的算法，让我们看看是否可以用它来改进这个已经很不错的分数。\n\n你可以在 UCI 机器学习库中找到此数据集：[`https://archive.ics.uci.edu/ml/datasets/Metro+Interstate+Traffic+Volume`](https://archive.ics.uci.edu/ml/datasets/Metro%252BInterstate%252BTraffic%252BVolume)。你可以使用清单\
  \ 15-1 导入数据。\n\n```\nimport pandas as pd\ndata = pd.read_csv('Metro_Interstate_Traffic_Volume.csv')\n\
  清单 15-1\n导入数据\n```\n\n为了在梯度提升模型和 kNN 模型之间进行公平的基准测试，让我们执行与第 13 章完全相同的特征工程。该特征工程如清单\
  \ 15-2 所示。\n\n```\ndata['year'] = data['date_time'].apply(lambda x: int(x[:4]))\n\
  data['month'] = data['date_time'].apply(lambda x: int(x[5:7]))\ndata['weekday']\
  \ = pd.to_datetime(data['date_time']).apply(lambda x: x.weekday())\ndata['hour']\
  \ = pd.to_datetime(data['date_time']).apply(lambda x: x.hour)\ndata['isholiday']\
  \ = (data['holiday'] == 'None').apply(float)\n清单 15-2\n应用与之前 kNN 模型相同的特征工程\n```\n\
  \n现在，让我们使用清单 15-3 对 XGBoost 进行首次测试。为此，你需要使用 XGBoost 包。\n\n注意\n\n由于需要不同的依赖项，使用 Python\
  \ 安装库有时会很麻烦。如果你在安装这些提升库时遇到问题，可以查看 Google Colaboratory 笔记本（[`https://colab.research.google.com`](https://colab.research.google.com)）或\
  \ Kaggle 笔记本（kaggle.com/notebooks），它们是免费的笔记本环境，为你准备好了所有现代机器学习库。\n\n```\n# 创建对象 X\
  \ 和 y\nX = data[['year', 'month', 'weekday', 'hour', 'isholiday']]\ny = data['traffic_volume']\n\
  # 创建训练测试集划分\nfrom sklearn.model_selection import train_test_split\nX_train, X_test,\
  \ y_train, y_test = train_test_split(X, y, test_size=100, random_state=12345, shuffle=False)\n\
  from xgboost import XGBRegressor\nmy_xgb = XGBRegressor()\nmy_xgb.fit(X_train, y_train)\n\
  xgb_fcst = my_xgb.predict(X_test)\nfrom sklearn.metrics import r2_score\nprint(r2_score(list(y_test),\
  \ list(xgb_fcst)))\n清单 15-3\n应用默认的 XGBoost 模型\n```\n\n这得到的 R2 分数为 **0.920**。这比使用\
  \ kNN 获得的 0.9695 要差一些。\n\n\n\n## 使用 LightGBM 预测交通流量\n\n现在，我们用 LightGBM 做同样的事情，并通过清单\
  \ 15-4 来比较其结果。\n\n```\nfrom lightgbm import LGBMRegressor\nmy_lgbm = LGBMRegressor()\n\
  my_lgbm.fit(X_train, y_train)\nlgbm_fcst = my_lgbm.predict(X_test)\nprint(r2_score(list(y_test),\
  \ list(lgbm_fcst)))\n清单 15-4\n应用默认的 LightGBM 模型\n```\n\nLightGBM 的 R2 分数是 **0.972**。这比默认的\
  \ XGBoost 模型好得多，也优于调优后的 kNN 模型。让我们创建一个图表，看看 XGBoost 模型和 LightGBM 模型在哪些地方的预测有所不同。你可以使用清单\
  \ 15-5 来创建图表。该图表应如图 15-3 所示。\n\n![../images/508548_1_En_15_Chapter/508548_1_En_15_Fig3_HTML.jpg](img/508548_1_En_15_Fig3_HTML.jpg)\n\
  \n图 15-3\n\n比较两种梯度提升模型\n\n```\nimport matplotlib.pyplot as plt\nplt.figure(figsize=(20,10))\n\
  plt.plot(list(y_test))\nplt.plot(list(xgb_fcst))\nplt.plot(list(lgbm_fcst))\nplt.legend(['actual',\
  \ 'xgb forecast', 'lgbm forecast'])\nplt.ylabel('Traffic Volume')\nplt.xlabel('Steps\
  \ in test data')\nplt.show()\n清单 15-5\n创建图表以比较 XGBoost 和 LightGBM 的预测值与实际值\n```\n\
  \n正如你在该图表中所见，两种模型性能的差异非常显著：XGBoost 在某些地方严重偏离。这表明存在一些它未能学习到的信息。\n\n## 使用贝叶斯优化进行超参数调优\n\
  \n因此，目前 LightGBM 表现更好，但我们希望对这两个模型进行调优，以观察调优后的版本性能如何。这可能会带来巨大的差异。\n\n这里我们将使用**贝叶斯优化**，而不是\
  \ GridSearchCV。到目前为止，你应该已经熟悉了前面介绍的两种超参数调优方法：GridSearchCV 和 RandomizedSearchCV。\n\
  \n### 贝叶斯优化理论\n\n在贝叶斯优化中，它不是尝试每一种超参数组合，也不是仅仅进行随机猜测，而是通过对超参数某个特定值为最优值的可能性进行建模，从而做出智能猜测。这是通过对超参数周围的概率分布进行建模来实现的。\n\
  \n该概念如图 15-4 所示。图中只显示了一个超参数，但它可以推广到多个超参数的情况。贝叶斯优化会首先对超参数的一些值进行采样，并观察这些点上的模型性能。\n\
  \n其目标不是随机找到一个表现良好的值，而是估计*曲线周围的灰色区域*。某些超参数值会比其他值带来更好的性能。在测试这些值时，贝叶斯优化会建立一个关于最优值位于此位置的概率分布模型。\n\
  \n通过这种方式，贝叶斯优化比你目前看到的两种调优方法要**智能**得多。它可以基于概率对接下来应该测试的点做出智能猜测。这使得它在优化超参数方面更加强大。\n\
  \n![../images/508548_1_En_15_Chapter/508548_1_En_15_Fig4_HTML.jpg](img/508548_1_En_15_Fig4_HTML.jpg)\n\
  \n图 15-4\n\n贝叶斯优化\n\n### 使用 scikit-optimize 进行贝叶斯优化\n\n在这一部分，你将看到如何使用 `scikit-optimize`\
  \ 包对 XGBoost 和 LightGBM 应用贝叶斯超参数调优。之后，你将比较这两个模型。让我们从清单 15-6 中的 XGBoost 开始。\n\n```\n\
  from skopt import BayesSearchCV\nfrom skopt.space import Real, Categorical, Integer\n\
  import random\nrandom.seed(0)\nxgb_opt = BayesSearchCV(\nXGBRegressor(),\n{\n'learning_rate':\
  \ (10e-6, 1.0, 'log-uniform'),\n'max_depth': Integer(0, 50, 'uniform'),\n'n_estimators'\
  \ : (10, 1000, 'log-uniform'),\n},\nn_iter=10,\ncv=3\n)\nxgb_opt.fit(X_train, y_train)\n\
  xgb_tuned_fcst = opt.best_estimator_.predict(X_test)\nr2_score(list(y_test), list(xgb_tuned_fcst))\n\
  清单 15-6\n对 XGBoost 应用贝叶斯优化\n```\n\n调优后模型的 R2 分数是 **0.969**。让我们直接继续处理 LightGBM 模型，如清单\
  \ 15-7 所示。\n\n```\nRandom.seed(0)\nlgbm_opt = BayesSearchCV(\nLGBMRegressor(),\n\
  {\n'learning_rate': (10e-6, 1.0, 'log-uniform'),\n'max_depth': Integer(-1, 50, 'uniform'),\n\
  'n_estimators' : (10, 1000, 'log-uniform'),\n},\nn_iter=10,\ncv=3\n)\nlgbm_opt.fit(X_train,\
  \ y_train)\nlgbm_tuned_fcst = lgbm_opt.best_estimator_.predict(X_test)\nr2_score(list(y_test),\
  \ list(lgbm_tuned_fcst))\n清单 15-7\n对 LightGBM 应用贝叶斯优化\n```\n\nLightGBM 的 R2 分数是\
  \ **0.973**。因此，在使用贝叶斯优化对这两个模型进行调优后，分数发生了逆转：现在是 XGBoost 赢得了基准测试。作为最终确认，让我们使用清单 15-8\
  \ 中的代码绘制两个模型所做的预测，你将得到图 15-5 中的图表。\n\n![../images/508548_1_En_15_Chapter/508548_1_En_15_Fig5_HTML.jpg](img/508548_1_En_15_Fig5_HTML.jpg)\n\
  \n图 15-5\n\n比较两个调优后模型的性能\n\n```\nimport matplotlib.pyplot as plt\nplt.figure(figsize=(20,10))\n\
  plt.plot(list(y_test))\nplt.plot(list(xgb_tuned_fcst))\nplt.plot(list(lgbm_tuned_fcst))\n\
  plt.legend(['actual', 'xgb forecast', 'lgbm forecast'])\nplt.ylabel('Traffic Volume')\n\
  plt.xlabel('Steps in test data')\nplt.show()\n清单 15-8\n绘制两个调优后的模型\n```\n\n在当前执行中，**n_iter**（即迭代次数）被固定为\
  \ 20。使用这个迭代次数执行相对较快。如果你想尝试一下，可以测试更高的 `n_iter` 值是否能让贝叶斯优化找到更高的分数。\n\n## 结论\n\n总之，你在本章中发现了两种性能非常优越的机器学习算法。你还了解了如何对两个模型进行基准测试。在实践中，你经常需要对更多模型进行基准测试。你将在本书的最后一章中了解更多关于模型基准测试的内容。然而，重要的是要认识到模型开发应该始终是数据驱动的：你选择的模型应该是你确信在未来能拥有最佳性能的那个。\n\
  \n## 关键要点\n\n*   梯度提升是一种集成学习技术，它允许集成中的后续个体模型学习模型尚未充分理解的部分。\n\n*   你了解了两种梯度提升模型：\n\
  \    *   *XGBoost*：一种更传统的梯度提升方法\n\n    *   *LightGBM*：一个更新但性能非常优越的竞争者\n\n*   贝叶斯优化是一种更智能的超参数调优方法。它估计最优值位于某个位置的概率，从而对最优值做出智能猜测。\n\
  \n"
- '# 第五部分高级机器学习和深度学习模型


  '
- "# 16. 神经网络\n\n在前五章中，你了解了许多监督式机器学习模型，从线性回归到梯度提升。在本章中，你将了解**神经网络**。\n\n神经网络的范围非常广泛。你在本章中看到的版本是一个称为**全连接神经网络**的子类。这些神经网络在直觉上与之前的监督模型非常接近。在接下来的章节中，你还将了解**循环神经网络**，并看到一个名为\
  \ **LSTM** 神经网络的特定网络。\n\n本章的目标是熟悉神经网络的一般概念。\n\n\n\n## 全连接神经网络\n\n首先，让我们通过图 16-1\
  \ 中的模型示意图来开始讲解。\n\n![../images/508548_1_En_16_Chapter/508548_1_En_16_Fig1_HTML.jpg](img/508548_1_En_16_Fig1_HTML.jpg)\n\
  \n图 16-1\n\n全连接神经网络示意图\n\n你可以从上到下阅读这张示意图。该模型始终包含一个输入层和一个输出层。网络的输入层为每个变量包含一个节点。输出层包含的节点数与输出变量数相同。在单变量回归的情况下，只有一个输出变量（目标变量\
  \ y），但有时可能同时存在多个输出变量，例如你在 VAR 模型中看到的那样。在这种情况下，输出层中会有多个节点。\n\n在输入之后，进入第一个隐藏层。粗略地说，隐藏层的值是通过**将输入乘以权重**，然后**将值通过激活函数**计算得出的。这种乘法与激活函数的组合在每个节点中重复，直到到达输出节点。这种模型被称为全连接模型，因为每个节点都与下一层的每个节点相连。也存在其他架构形式，其中并非如此：我们将在接下来的两章中看到一些例子。\n\
  \n## 激活函数\n\n当你选择神经网络的架构时，还需要选择在每个位置使用的激活函数类型。激活函数在网络的每个节点中应用，然后才进入下一层。\n\n三种相对常见的激活函数选择是\
  \ **tanh**、**ReLU** 和 **sigmoid**。你可以在图 16-2 中看到它们的具体行为。我们使用激活函数的原因是，它们允许模型用更少的节点拟合更复杂的问题，因为它们为计算引入了非线性。\n\
  \n![../images/508548_1_En_16_Chapter/508548_1_En_16_Fig2_HTML.jpg](img/508548_1_En_16_Fig2_HTML.jpg)\n\
  \n图 16-2\n\n三种常见的激活层\n\n在不深入探讨激活层细节的情况下，了解如何使用它们很重要。ReLU 通常是一个不错的起始选择，而 tanh 常用于你将在下一章看到的循环神经网络。\n\
  \n激活层的选择，就像拟合神经网络中的许多事情一样，并非显而易见：通过反复试验来获得一个有效的神经网络是唯一的方法。有时，如果你运气好，也可以在文献中找到应用于与你类似案例的神经网络示例。需要记住的重要一点是，要得到准确的结果需要花费时间和精力，但如果你成功了，就能获得出色的性能。\n\
  \n## 权重：反向传播\n\n因此，当输入值在神经网络中传递时，除了激活层之外，你还会遇到其他东西：权重。这些权重是在模型拟合时通过一种称为反向传播算法的算法来估计的。\n\
  \n反向传播算法一次一层地计算损失函数相对于网络权重的梯度。然后从最后一层开始向后迭代，这就是它被称为反向传播的原因。这是一种拟合神经网络所需的大量权重的有效方法。然而，它仍然是一种复杂的算法，并且计算需要时间。\n\
  \n## 优化器\n\n反向传播算法的性能取决于优化器的选择。这又是一个必须由建模者做出的决定。有许多可用的优化器。第一个可用的优化器是梯度下降法，如前一段所述。\n\
  \n**SGD**，即**随机梯度下降法**的缩写，是梯度下降算法的一种改进版本。它更高效，因为它在每次迭代时不是在整个数据集上计算，而只在数据集的一个子集上计算。\n\
  \n在 SGD 的基础上进行了两项改进，从而产生了两个新的优化器：**RMSProp** 和 **AdaGrad**。一个更先进的优化器称为 Adam，它结合了这两者的优点。\n\
  \n虽然我不会深入探讨优化器之间深层的数学差异，但了解存在不同的优化器是很重要的。此外，这方面的工作仍在进行中，在不久的将来很可能会出现更新更好的版本。这里需要记住的重点是，优化器的选择是一个由模型开发者选择的超参数。尝试不同的优化器可能有助于为你的模型增加最后那一点精度。\n\
  \n## 优化器的学习率\n\n你需要作为超参数选择的下一项是优化器的学习率。你可以这样理解。你的优化器会找到正确的移动方向，并朝着那个方向迈出一步。然而，这些步骤可以是大步，也可以是小步。这取决于你选择的学习率。\n\
  \n选择较大的学习率意味着你在正确的方向上迈出了大步。然而，风险在于你迈的步子太大，因此会越过最优值并错过它。\n\n另一方面，较小的学习率可能会让你陷入局部最优而无法摆脱，因为你的步长太小。你也可能需要很长时间才能收敛。\n\
  \n## 开发神经网络时涉及的超参数\n\n到目前为止，这里的概述与我们之前看到的，例如在随机森林和 XGBoost 中，并没有太大不同。然而，在开发神经网络方面有一个很大的区别：超参数的数量和模型训练的时间如此之大，以至于简单地启动一个超参数优化工具变得不可能。\n\
  \n这完全归因于用于拟合神经网络的反向传播算法。简而言之，该算法在网络中来回传递，并更新权重。它不会一次性传递所有数据，而是一批一批地传递，直到所有数据都被传递完毕。当所有数据都被传递一次时，这被称为一个**周期**。\n\
  \n正如你所看到的，对于神经网络，需要进行大量的超参数调整。其中很多是手动完成的，使用特定的工具来判断模型拟合的质量。构建神经网络比拟合经典的机器学习模型要复杂得多。\n\
  \n作为概述，神经网络的主要超参数包括：\n\n*   层数。\n\n*   每层中的节点数。\n\n*   **优化器**是通过反向传播更新权重的方法。标准的优化器之一是\
  \ Adam，但还有很多其他优化器。\n\n*   优化器的**学习率**影响优化器的步长。学习率太小会使朝向最优值的步长过小，可能导致收敛过慢，或者陷入局部最优。\n\
  \n你还需要选择的另外两个超参数与数学关系不大，但它们仍然非常重要：\n\n*   **批量大小**指定了算法每次传递时将使用的样本数量。如果太大，可能会耗尽内存；但如果太小，可能会太慢。\n\
  \n*   **周期数**是整个数据集通过网络传递的次数。周期越多，模型继续训练的时间就越长。但这实际上应该取决于你何时达到最优值。\n\n\n\n## 介绍示例数据\n\
  \n在进入神经网络的拟合与优化之前，我们先来介绍示例数据和两种数据准备方法。本章将使用马克斯·普朗克生物地球化学研究所的示例数据。该数据集名为耶拿气候数据集，包含每\
  \ 10 分钟记录一次的温度、湿度等气象测量值。\n\n你可以从 [`https://storage.googleapis.com/tensorflow/tf-keras-datasets/jena_climate_2009_2016.csv.zip`](https://storage.googleapis.com/tensorflow/tf-keras-datasets/jena_climate_2009_2016.csv.zip)\
  \ 下载数据。也可以下载并解压后，使用 pandas 通过代码清单 16-1 导入数据。\n\n```\nimport keras\nimport pandas\
  \ as pd\nfrom zipfile import ZipFile\nimport os\nuri = \"https://storage.googleapis.com/tensorflow/tf-keras-datasets/jena_climate_2009_2016.csv.zip\"\
  \nzip_path = keras.utils.get_file(origin=uri, fname=\"jena_climate_2009_2016.csv.zip\"\
  )\nzip_file = ZipFile(zip_path)\nzip_file.extractall()\ncsv_path = \"jena_climate_2009_2016.csv\"\
  \ndf = pd.read_csv(csv_path)\ndel zip_file\ndf = df.drop('Date Time', axis=1)\n\
  cols = ['p',  'T', 'Tpot', 'Tdew', 'rh', 'VPmax', 'VPact', 'VPdef', 'sh', 'H2OC',\
  \ 'rho', 'wv', 'mwv', 'wd']\ndf.columns = cols\n代码清单 16-1\n导入数据\n```\n\n在本示例中，我们将进行**12\
  \ 小时后的温度预测**。为此，我们需要为自变量创建滞后变量，并构建正确的数据框。由于数据量相当大，我们可以添加多个滞后值，以便为模型提供尽可能多的信息。我们将使用代码清单\
  \ 16-2 来添加 72 个滞后值（72 个 10 分钟间隔，以及向后 84、96、108、120 和 132 步的值）。\n\n```\ny = df.loc[2*72:,'T']\n\
  lagged_x = []\nfor lag in range(72,2*72,12):\nlagged = df.shift(lag)\nlagged.columns\
  \ = [x + '.lag' + str(lag) for x in lagged.columns]\nlagged_x.append(lagged)\ndf\
  \ = pd.concat(lagged_x, axis=1)\ndf = df.iloc[2*72:,:] #drop missing values due\
  \ to lags\n代码清单 16-2\n创建滞后数据集\n```\n\n## 神经网络特定的数据准备需求\n\n神经网络对输入数据的问题非常敏感。让我们看看两种在数据准备中常用的工具。\n\
  \n### 缩放与标准化\n\n如果不对输入数据进行标准化，神经网络将无法学习。标准化意味着*将数据调整到同一尺度*。两个常见的例子是标准缩放器和最小-最大缩放器：\n\
  \n1.  标准缩放器将变量映射为服从标准正态分布。即变量的新均值为 0，新标准差为 1。其计算方式为：每个值减去变量的平均值，再除以标准差。\n2.  最小-最大缩放器将变量缩放到\
  \ 0–1 的范围内，方法是将每个值减去变量的最小值，再除以变量的极差。\n\n你可以使用代码清单 16-3 中的语法来应用缩放器。\n\n```\n# apply\
  \ a min max scaler\nfrom sklearn.preprocessing import MinMaxScaler\nscaler = MinMaxScaler()\n\
  df = pd.DataFrame(scaler.fit_transform(df), columns = df.columns)\n代码清单 16-3\n拟合最小-最大缩放器\n\
  ```\n\n### 主成分分析（PCA）\n\n**PCA** 本身就是一个机器学习模型，属于降维模型家族。它允许将包含大量变量的数据集*投影到若干维度上，从而减少变量数量*。这些维度将包含大部分信息，并且噪声更少。\n\
  \n确保输入数据包含更少的噪声将极大地帮助神经网络的拟合。那么 PCA 是如何工作的呢？其思想是基于强相关变量的组合来创建新的变量，称为**主成分**。在图 16-3\
  \ 中，你可以看到一个假设示例，其中包含两个可能相关的变量：降雨量和湿度。第一个主成分捕获了尽可能多的变异。\n\n![../images/508548_1_En_16_Chapter/508548_1_En_16_Fig3_HTML.jpg](img/508548_1_En_16_Fig3_HTML.jpg)\n\
  \n图 16-3\n\nPCA\n\n主成分是一个数学公式，它是原始变量的线性组合。你可以将这个得分作为一个新变量使用。如果主成分捕获了大量原始变量的信息，那么在机器学习模型中使用主成分而非原始变量会更有价值。\n\
  \n要拟合 PCA，通常从包含所有主成分的 PCA 开始。代码清单 16-4 展示了这一过程。\n\n```\n# Fit a PCA with maximum\
  \ number of components\nfrom sklearn.decomposition import PCA\nmypca = PCA()\nmypca.fit(df)\n\
  代码清单 16-4\n拟合完整 PCA\n```\n\n使用这个 PCA 来绘制**碎石图**。碎石图是用于确定保留主成分数量的多种工具之一。在肘部位置，你可以选择主成分的数量。你可以使用代码清单\
  \ 16-5 来绘制碎石图，结果如图 16-4 所示。\n\n![../images/508548_1_En_16_Chapter/508548_1_En_16_Fig4_HTML.jpg](img/508548_1_En_16_Fig4_HTML.jpg)\n\
  \n图 16-4\n\n碎石图\n\n```\n# Make a scree plot\nimport matplotlib.pyplot as plt\nplt.plot(mypca.explained_variance_ratio_)\n\
  plt.show()\n代码清单 16-5\n绘制碎石图\n```\n\n你可以在图 16-4 中看到碎石图。\n\n在这张图中，x 轴显示从第一个到最后一个的主成分。y\
  \ 轴显示这些主成分所捕获的变异量。因此，你可以清楚地看到，前*五到十个主成分*包含的信息远多于后面的主成分（更靠右的那些）。你可以看到肘部大约在 5 附近，但保留十个主成分似乎是个好主意，这样我们几乎保留了所有信息，同时只用了十个变量而不是\
  \ 80 多个。最后，使用代码清单 16-6 重新拟合包含十个主成分的 PCA，并对数据进行转换。\n\n```\nmypca = PCA(10)\ndf =\
  \ mypca.fit_transform(df)\n代码清单 16-6\n拟合包含十个主成分的 PCA\n```\n\n\n\n## 使用 Keras 构建神经网络\n\
  \n现在我们已经确认数据已正确准备，终于可以进入实际的神经网络构建环节了。\n\n构建神经网络是一项繁重的工作，我希望在引导你入门和优化网络之间找到良好的平衡，而不是仅仅展示一个最终的高性能网络。\n\
  \n通常，一个好的起点是从相对简单的网络开始，然后逐步优化。这里，我们先从一个包含两个 64 节点全连接层的网络开始。其架构如下所示。\n\n对于其他超参数，我们采用一些较为标准的设置：\n\
  \n*   *优化器*：Adam\n\n*   *学习率*：0.01\n\n*   *批量大小*：32（如果内存不足，可减小此值）\n\n*   *训练轮数*：10\n\
  \n开始之前，我们先进行训练-测试集划分，如代码清单 16-7 所示。\n\n```\nfrom sklearn.model_selection import\
  \ train_test_split\nX_train, X_test, y_train, y_test = train_test_split(df, y, test_size=0.33,\
  \ random_state=42)\n代码清单 16-7\n训练-测试集划分\n```\n\n现在，使用以下代码通过 **keras 库** 构建模型。首先，使用代码清单\
  \ 16-8 指定网络架构。Keras 是 Python 中用于神经网络的首选库。\n\n```\nfrom tensorflow.keras.models import\
  \ Sequential\nfrom tensorflow.keras.layers import Dense\nimport random\nrandom.seed(42)\n\
  simple_model = Sequential([\nDense(64, activation='relu', input_shape=(X_train.shape[1],)),\n\
  Dense(64, activation='relu'),\nDense(1),\n])\n代码清单 16-8\n指定模型及其架构\n```\n\n你可以使用代码清单\
  \ 16-9 获取模型摘要，以检查一切是否正常。\n\n```\nsimple_model.summary()\n代码清单 16-9\n获取模型架构摘要\n```\n\
  \n然后，使用代码清单 16-10 编译模型。在编译部分，你需要指定优化器和学习率，同时指定损失函数，本例中为平均绝对误差。\n\n```\nsimple_model.compile(\n\
  optimizer=keras.optimizers.Adam(learning_rate=0.01),\nloss='mean_absolute_error',\n\
  metrics=['mean_absolute_error'],\n)\n代码清单 16-10\n编译模型\n```\n\n接着，使用代码清单 16-11 拟合模型。在拟合调用中，你需要指定训练轮数和批量大小。你还可以指定验证集划分比例，从而形成训练-验证-测试场景，这样仍能保留测试集用于最终检查\
  \ R² 分数，避免模型开发过程带来的偏差。\n\n```\nsmod_history = simple_model.fit(X_train, y_train,\n\
  validation_split=0.2,\nepochs=10,\nbatch_size=32,\nshuffle = True\n)\n代码清单 16-11\n\
  拟合模型\n```\n\n请注意，拟合神经网络可能会耗费大量时间。在 GPU 上运行通常很快，但并非总是可行，具体取决于你的计算机硬件。\n\n现在，关键点在于判断该模型是否通过这些超参数学到了东西。有一个关键图表将在你构建神经网络时提供巨大帮助。你可以使用代码清单\
  \ 16-12 获取该图表，如图 16-5 所示。\n\n请注意，你得到的结果可能略有不同。设置随机种子并不足以强制 Keras 中的随机性保持一致。虽然可以在\
  \ Keras 中强制实现精确的可重复性，但过程相当复杂，因此我更倾向于忽略这一点，并接受结果并非 100% 可重复的事实。你可以查看以下说明，了解如何在 Keras\
  \ 中固定随机性：[`https://keras.io/getting_started/faq/#how-can-i-obtain-reproducible-results-using-keras-during-development`](https://keras.io/getting_started/faq/%2523how-can-i-obtain-reproducible-results-using-keras-during-development)。\n\
  \n```\nplt.plot(smod_history.history['loss'])\nplt.plot(smod_history.history['val_loss'])\n\
  plt.title('model loss')\nplt.ylabel('accuracy')\nplt.xlabel('epoch')\nplt.legend(['train',\
  \ 'val'], loc='upper left')\nplt.show()\n代码清单 16-12\n绘制训练历史\n```\n\n![../images/508548_1_En_16_Chapter/508548_1_En_16_Fig5_HTML.jpg](img/508548_1_En_16_Fig5_HTML.jpg)\n\
  \n图 16-5\n\n显示模型学习效果不佳的历史图\n\n在图 16-6 中，你会看到几个你期望或不期望的图表示例。在图 1 中，你看到的是理想曲线，这正是你试图达到的目标。\n\
  \n在图 2 中，你看到一个学习效果良好的神经网络，同时也展示了实践中出现的过拟合现象：训练损失大幅下降，验证损失也随之下降。然而，在某个时刻，你需要减少训练轮数，否则模型将开始过拟合。如果你还记得前一章的内容，过拟合意味着模型学习了训练数据中的特定噪声，因此学到的趋势无法泛化。\n\
  \n在第三个图中，你看到一个什么都没学到的神经网络。你可以通过训练损失没有下降来识别这种情况。此时，可能是数据存在问题，或者你需要尝试一个完全不同的网络结构。\n\
  \n![../images/508548_1_En_16_Chapter/508548_1_En_16_Fig6_HTML.jpg](img/508548_1_En_16_Fig6_HTML.jpg)\n\
  \n图 16-6\n\n理想的历史图\n\n那么，在我们的案例中发生了什么？很可能是情况 3：模型什么都没学到。为什么模型学不到东西？我们应该尝试一下，是否因为神经元数量太少而无法学习。从这里开始，你就知道需要增加层数和神经元数量，看看情况是否会好转。\n\
  \n从此刻起，这实际上是一个反复试错的过程。你尝试的第一个模型通常非常简单，并且学习效果不足。接下来，你应该寻找一个确实能学习的模型，即使最坏情况下它会过拟合。最后一步，你进行微调，直到获得一个与图\
  \ 16-6 左侧图表足够接近的图形，并且得到一个你满意的误差分数。\n\n经过反复试错，发现了一个更好的模型架构，如代码清单 16-13 所示。这远非最佳模型，但至少该模型能够在测试数据上获得相对较好的\
  \ R² 分数 **0.908**。欢迎尝试进一步调整该模型，看看会发生什么，以及你是否能改进它。\n\n```\nrandom.seed(42)\nmodel\
  \ = Sequential([\nDense(256, activation='relu', input_shape=(X_train.shape[1],)),\n\
  Dense(256, activation='relu'),\nDense(256, activation='relu'),\nDense(256, activation='relu'),\n\
  Dense(256, activation='relu'),\nDense(256, activation='relu'),\nDense(256, activation='relu'),\n\
  Dense(256, activation='relu'),\nDense(256, activation='relu'),\nDense(256, activation='relu'),\n\
  Dense(256, activation='relu'),\nDense(256, activation='relu'),\nDense(256, activation='relu'),\n\
  Dense(256, activation='relu'),\nDense(256, activation='relu'),\nDense(256, activation='relu'),\n\
  Dense(256, activation='relu'),\nDense(256, activation='relu'),\nDense(256, activation='relu'),\n\
  Dense(256, activation='relu'),\nDense(1), ])\nmodel.compile(\noptimizer=keras.optimizers.Adam(learning_rate=0.001),\n\
  loss='mean_absolute_error',\nmetrics=['mean_absolute_error'],\n)\nhistory = model.fit(X_train,\
  \ y_train,\n#validation_data=(X_test, y_test),\nvalidation_split=0.2,\nepochs=100,\n\
  batch_size=32,\nshuffle = True\n)\nplt.plot(history.history['loss'])\nplt.plot(history.history['val_loss'])\n\
  plt.title('model loss')\nplt.ylabel('accuracy')\nplt.xlabel('epoch')\nplt.legend(['train',\
  \ 'val'], loc='upper left')\nplt.show()\npreds = model.predict(X_test)\nprint(r2_score(preds,\
  \ y_test))\n代码清单 16-13\n一个更好的架构\n```\n\n\n\n结果图如图 16-7 所示。\n\n![../images/508548_1_En_16_Chapter/508548_1_En_16_Fig7_HTML.jpg](img/508548_1_En_16_Fig7_HTML.jpg)\n\
  \n图 16-7\n\n更复杂模型的历史曲线图\n\n## 结论\n\n拟合神经网络真正困难的地方在于，你很难判断自己取得的成果是否还能改进，或者它已经足够好了。目前，本章展示了如何从一个非常简单的网络开始改进，并尝试获得优化版本。\n\
  \n有一些库可用于超参数优化。当然，你甚至可以对网络架构进行网格搜索。但要知道，拟合神经网络没有灵丹妙药。它比经典机器学习模型需要更多的努力和投入。训练时间非常长，并且你需要强大的计算能力才能开始考虑此类优化。不过，从好的方面来看，神经网络有时能获得比经典机器学习强大得多的结果，它是你机器学习工具箱中的重要工具。\n\
  \n神经网络和人工智能的科学领域有很多发展。在接下来的两章中，你将发现比密集结构更先进的神经网络结构，但它们可能非常适用于预测场景。\n\n## 要点总结\n\n\
  *   神经网络是一种强大的监督式机器学习模型，但构建它比经典机器学习模型更困难。\n\n*   超参数包括：\n    *   层数\n    *   每层的节点数\n\
  \    *   **优化器**\n    *   **学习率**\n    *   **批量大小**\n    *   **周期数**\n\n*   显示训练损失和验证损失下降的曲线图是开发神经网络时非常重要的方面。\n\
  \n*   PCA 是一种降维模型。它也可用于数据准备，尤其是在存在许多相关变量时。\n\n*   对输入数据进行缩放是神经网络的必要步骤。一些常用的方法包括标准缩放器和\
  \ MinMax 缩放器。\n\n"
- "# 17. 使用 SimpleRNN 和 GRU 的循环神经网络\n\n在本章中，你将发现一种更高级的神经网络版本，称为**循环神经网络**。RNN 有三种非常常见的版本：SimpleRNN、GRU（门控循环单元）和\
  \ LSTM（长短期记忆）。在实践中，由于我稍后会谈到的一些问题，SimpleRNN 已经很少使用了。因此，我将 SimpleRNN 和 GRU 归入本章，而\
  \ LSTM 则有单独的章节。\n\n## 什么是 RNN：架构\n\n那么，什么是循环神经网络，它们与你之前看到的密集神经网络有何不同？下图展示了一个全连接网络的节点与一个\
  \ SimpleRNN 节点的示例对比。\n\n![../images/508548_1_En_17_Chapter/508548_1_En_17_Fig1_HTML.jpg](img/508548_1_En_17_Fig1_HTML.jpg)\n\
  \n图 17-1\n\n循环网络与密集网络对比\n\n如图 17-1 所示，RNN 模块的最大区别在于存在一个反馈回路。全连接网络的每个输入完全独立，而 RNN\
  \ 的输入之间具有反馈关系。这使得**RNN 非常适合处理具有序列的数据**，例如：\n\n*   时间序列\n*   书面文本（单词序列）\n*   DNA\
  \ 序列\n*   地理位置序列\n\n## SimpleRNN 单元内部结构\n\n由于架构上的这种差异，单元内部也存在差异。如图所示，每个单元中不仅有一个输入，而是有两个输入。这两个输入都需要被考虑。作为示意图，其结构如图\
  \ 17-2 所示，其中 X 是时间 t 的输入，Y 是时间 t 的目标变量，而 a 是图 17-1 中从左到右的权重，也就是使模型在时间上作为序列进行拟合的权重。\n\
  \n![../images/508548_1_En_17_Chapter/508548_1_En_17_Fig2_HTML.jpg](img/508548_1_En_17_Fig2_HTML.jpg)\n\
  \n图 17-2\n\nRNN 单元\n\n在上一章中，你主要看到使用了 **ReLU** 激活层。然而，在循环神经网络中，**tanh** 层是标准配置。原因是对于长序列，ReLU\
  \ 层会遇到梯度爆炸问题：与权重的重复乘法就像指数运算一样，会导致梯度爆炸。tanh 激活层没有这个问题，因为其值被强制限制在 -1 和 1 之间。\n\n##\
  \ 示例\n\nRNN 在序列上进行学习。因此，我们需要调整问题描述。在本章中，让我们使用与上一章相同的数据，以便更好地感受数据准备和数据使用方式与全连接架构的不同之处。\n\
  \n快速回顾一下：你有一个包含天气测量数据的数据集，我们试图预测未来 12 小时（72 个 10 分钟时间步长）的温度。\n\n在全连接模型中，我们做的是创建滞后变量。有一个\
  \ y 变量（未滞后），而自变量是 y 变量的滞后值以及许多其他变量。第一个滞后在 72 个时间步长处，这样模型将使用 12 小时前的数据来预测当前（使用从现在到\
  \ 12 小时前的历史数据来预测当前，等同于使用当前数据来预测 12 小时后）。\n\n## 预测序列而非单个值\n\n在 RNN 中，我们不应该这样做，因为\
  \ RNN 学习的是序列。一个 72 个时间步长的大跳跃并没有真正尊重序列的变化。然而，我们也不只是想预测下一个时间步长，因为那意味着预测未来 10 分钟的温度，这并不太有趣。\n\
  \n我们要做的是*创建一个 y 变量矩阵*，也包含滞后项。之前，我们想预测未来 72 个时间步长后的一个值，但现在让我们建模来预测这 72 个值中的每一个。尽管用一个\
  \ y 变量也可能做到，但这也是一个有趣的*多步预测*案例，通常很有用。\n\n## 单变量模型而非多变量模型\n\n我们与之前模型相比的另一个变化是，在这种情况下，我们将只使用温度数据，而不使用其他变量。这可能会使任务稍微困难一些，但会让你更容易理解序列和\
  \ RNN 的使用。然而，你必须知道，向 RNN 中添加其他解释变量是可行的。例如，为了预测明天的温度，你可能不仅想使用今天的温度，还想使用今天的风向、风速和湿度。在这种情况下，你可以向输入数据添加第三个维度。\n\
  \n\n\n## 准备数据\n\n你可以按照以下步骤准备数据。第一步是使用清单 17-1 导入数据。\n\n```\nimport keras\nimport\
  \ pandas as pd\nfrom zipfile import ZipFile\nimport os\nuri = \"https://storage.googleapis.com/tensorflow/tf-keras-datasets/jena_climate_2009_2016.csv.zip\"\
  \nzip_path = keras.utils.get_file(origin=uri, fname=\"jena_climate_2009_2016.csv.zip\"\
  )\nzip_file = ZipFile(zip_path)\nzip_file.extractall()\ncsv_path = \"jena_climate_2009_2016.csv\"\
  \ndf = pd.read_csv(csv_path)\ndel zip_file\n清单 17-1\n导入数据\n```\n\n下一步是删除除温度之外的所有列，因为我们正在构建一个单变量模型。这一步在清单\
  \ 17-2 中完成。\n\n```\ndf = df[['T (degC)']]\n清单 17-2\n仅保留温度数据\n```\n\n现在，正如你在第 16\
  \ 章中记得的那样，神经网络需要经过标准化的数据。因此，让我们像清单 17-3 那样应用一个 `MinMaxScaler`。\n\n```\n# 应用一个 min\
  \ max scaler\nfrom sklearn.preprocessing import MinMaxScaler\nscaler = MinMaxScaler()\n\
  df = pd.DataFrame(scaler.fit_transform(df), columns = ['T'])\n清单 17-3\n应用 MinMaxScaler\n\
  ```\n\n现在是一个可能较难直观理解的部分。我们需要将数据分割成一种形状，其中包含过去数据的序列和未来数据的序列。我们想要预测未来的 72 个时间步，并将使用过去的\
  \ 3*72 个时间步。这是一个任意的选择，请随意尝试使用更多或更少的过去数据。清单 17-4 中的代码遍历数据并为模型训练创建序列。\n\n```\nylist\
  \ = list(df['T'])\nn_future = 72\nn_past = 3*72\ntotal_period = 4*72\nidx_end =\
  \ len(ylist)\nidx_start = idx_end - total_period\nX_new = []\ny_new = []\nwhile\
  \ idx_start > 0:\nx_line = ylist[idx_start:idx_start+n_past]\ny_line = ylist[idx_start+n_past:idx_start+total_period]\n\
  X_new.append(x_line)\ny_new.append(y_line)\nidx_start = idx_start - 1\n# 将列表的列表转换为\
  \ numpy 数组\nimport numpy as np\nX_new = np.array(X_new)\ny_new = np.array(y_new)\n\
  清单 17-4\n准备序列数据\n```\n\n现在我们已经获得了用于模型训练的 X 和 Y 矩阵，和往常一样，我们需要将其分割为训练集和测试集，以便能够进行公平的模型评估。这一步在清单\
  \ 17-5 中完成。\n\n```\nfrom sklearn.model_selection import train_test_split\nX_train,\
  \ X_test, y_train, y_test = train_test_split(X_new, y_new, test_size=0.33, random_state=42)\n\
  清单 17-5\n分割为训练集和测试集\n```\n\n拟合 SimpleRNN 还需要最后一步。这一步可能难以直观理解，因为实际上并没有一个明确的理由。SimpleRNN\
  \ 层需要一个 3D 的输入格式，其形状必须对应 (n_samples, n_timesteps, n_features)。这可以通过 reshape 实现。不幸的是，在使用\
  \ Keras 时，有时必须进行这种 reshape，因为它对输入数据的确切形状要求非常严格。\n\n当你处理尚不了解的层类型时，这有时会让人非常头疼。但学习如何处理它是至关重要的。清单\
  \ 17-6 向你展示了如何将数据重塑为 Keras 能够识别的正确格式。\n\n```\nbatch_size = 32\nn_samples = X_train.shape[0]\n\
  n_timesteps = X_train.shape[1]\nn_steps = y_train.shape[1]\nn_features = 1\nX_train_rs\
  \ = X_train.reshape(n_samples, n_timesteps, n_features )\nX_test_rs = X_test.reshape(X_test.shape[0],\
  \ n_timesteps, n_features )\n清单 17-6\n重塑数据以便 Keras 识别\n```\n\n## 一个简单的 SimpleRNN\n\
  \n现在让我们从一个使用 SimpleRNN 层的非常小的神经网络开始。你可以使用清单 17-7 对其进行参数化。\n\n```\nimport random\n\
  random.seed(42)\nfrom tensorflow.keras.models import Sequential\nfrom tensorflow.keras.layers\
  \ import Dense, SimpleRNN\nsimple_model = Sequential([\nSimpleRNN(8, activation='tanh',input_shape=(n_timesteps,\
  \ n_features)),\nDense(y_train.shape[1]),\n])\nsimple_model.summary()\nsimple_model.compile(\n\
  optimizer=keras.optimizers.Adam(learning_rate=0.001),\nloss='mean_absolute_error',\n\
  metrics=['mean_absolute_error'],\n)\nsmod_history = simple_model.fit(X_train_rs,\
  \ y_train,\nvalidation_split=0.2,\nepochs=5,\nbatch_size=batch_size,\nshuffle =\
  \ True\n)\npreds = simple_model.predict(X_test_rs)\nfrom sklearn.metrics import\
  \ r2_score\nprint(r2_score(preds, y_test))\nimport matplotlib.pyplot as plt\nplt.plot(smod_history.history['loss'])\n\
  plt.plot(smod_history.history['val_loss'])\nplt.title('model loss')\nplt.xlabel('epoch')\n\
  plt.legend(['train', 'val'], loc='upper left')\nplt.show()\n清单 17-7\n使用 SimpleRNN\
  \ 参数化一个小型网络\n```\n\n得到的图如图 17-3 所示，得到的 R2 分数为 **0.66**。这个分数并不理想，训练历史也证实了模型没有正确指定：损失在下降，但似乎学习得不够。损失就是我们所说的贯穿模型的准确度，因为神经网络的误差函数通常被称为损失函数。一个更复杂的模型应该能让损失下降得更多。\n\
  \n![../images/508548_1_En_17_Chapter/508548_1_En_17_Fig3_HTML.jpg](img/508548_1_En_17_Fig3_HTML.jpg)\n\
  \n图 17-3\n\nSimpleRNN 的训练历史\n\n## 带隐藏层的 SimpleRNN\n\n作为对此的改进，让我们给这个网络添加第二个层。要做到这一点，你需要在除最后一个层之外的每个层中指定\
  \ `**return_sequences = True**`。拟合 RNN 甚至比拟合**前馈神经网络**还要慢，所以请注意本章中的计算时间可能会很长。\n\n\
  你可以构建清单 17-8 中稍微复杂一点的网络，并观察其性能。\n\n```\nrandom.seed(42)\nsimple_model = Sequential([\n\
  SimpleRNN(32, activation='tanh',input_shape=(n_timesteps, n_features), return_sequences=True),\n\
  SimpleRNN(32, activation='tanh', return_sequences = True),\nSimpleRNN(32, activation='tanh'),\n\
  Dense(y_train.shape[1]),\n])\nsimple_model.summary()\nsimple_model.compile(\noptimizer=keras.optimizers.Adam(learning_rate=0.001),\n\
  loss='mean_absolute_error',\nmetrics=['mean_absolute_error'],\n)\nsmod_history =\
  \ simple_model.fit(X_train_rs, y_train,\nvalidation_split=0.2,\nepochs=5,\nbatch_size=batch_size,\n\
  shuffle = True\n)\npreds = simple_model.predict(X_test_rs)\nprint(r2_score(preds,\
  \ y_test))\nplt.plot(smod_history.history['loss'])\nplt.plot(smod_history.history['val_loss'])\n\
  plt.title('model loss')\nplt.xlabel('epoch')\nplt.legend(['train', 'val'], loc='upper\
  \ left')\nplt.show()\n清单 17-8\n一个包含三层 SimpleRNN 的更复杂网络\n```\n\n这给出了一个多变量 R2 分数 0.90。你将观察到如图\
  \ 17-4 所示的训练历史图。\n\n![../images/508548_1_En_17_Chapter/508548_1_En_17_Fig4_HTML.jpg](img/508548_1_En_17_Fig4_HTML.jpg)\n\
  \n图 17-4\n\n三层 SimpleRNN 的训练历史\n\n这个网络使得损失能够更早、更低地下降，尽管曲线看起来仍然不太令人印象深刻。同时，获得的 R2\
  \ 相当不错，所以感觉事情正朝着正确的方向发展。\n\n\n\n## 简单 GRU\n\n现在我们可以进一步深入 SimpleRNN 并尝试优化它。但我们不会在这里这样做。SimpleRNN\
  \ 已经不符合当今的标准了。它存在一些严重的问题。其中一个重大影响是它无法记住很久以前的信息。此外，它还有一些更技术性的问题。\n\n一种更先进的 RNN 层被发明出来，称为\
  \ GRU，即门控循环单元（Gated Recurrent Unit）。如图 17-5 所示，GRU 单元拥有更多参数。这表明单元内部多了一条通道，从而可以估计一个额外的参数。这有助于学习长期趋势。\n\
  \n![../images/508548_1_En_17_Chapter/508548_1_En_17_Fig5_HTML.jpg](img/508548_1_En_17_Fig5_HTML.jpg)\n\
  \n图 17-5\n\nGRU 单元\n\n由于这些差异，GRU 获得了比 SimpleRNN 更好的整体性能，而 SimpleRNN 已经很少使用了。让我们构建一个使用\
  \ GRU 的简单网络，看看它在数据上的表现如何。这在代码清单 17-9 中完成。\n\n```\nrandom.seed(42)\nfrom tensorflow.keras.layers\
  \ import GRU\nsimple_model = Sequential([\nGRU(8, activation='tanh',input_shape=(n_timesteps,\
