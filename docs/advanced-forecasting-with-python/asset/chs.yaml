  print(r2_score( list(test_ds)[0][''target''][-28:], predictions))

  import matplotlib.pyplot as plt

  plt.plot(predictions)

  plt.plot(list(test_ds)[0][''target''][-28:])

  plt.legend([''predictions'', ''actuals''])

  plt.show()

  清单 20-5

  R2 分数和预测图

  ```


