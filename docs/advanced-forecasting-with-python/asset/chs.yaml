  ## 自相关中的滞后


  除了自相关的方向，**滞后**的概念也很重要。这个概念仅适用于自相关，而不适用于“常规”相关性。


  自相关的滞后数指的是对当前值有影响的过去时间步的数量。在许多情况下，如果存在自相关，不仅前一个时间步有影响，可能多个时间步都有影响。


  应用到医生问诊时长的例子中，你可以想象一位医生在某次问诊中延误了很长时间，因此需要在接下来的三次问诊中加快速度。这意味着第三次“快速”问诊仍然受到那次延误的影响。所以自相关的滞后至少为三：即回溯三个时间步。


  医生问诊时长的例子非常直观，因为医生时间有限是合乎逻辑的。在每年地震次数的例子中，并没有如此清晰的逻辑来解释过去值与当前值之间的关系。这使得凭直觉判断应包含的滞后数量变得困难。


  一个同时研究多个滞后自相关的绝佳工具是使用 **statsmodels 包** 中的自相关图。相关代码如清单 3-10 所示。**ACF** 是 **自相关函数**
  的缩写：即作为滞后函数的自相关。


  请注意，选择 20 个滞后是任意的：仅用于绘图目的。20 个滞后意味着回溯 20 年，这应该足以显示相关的自相关，但选择 40 个甚至更多也是可以接受的选项。


  ```

  from statsmodels.graphics.tsaplots import plot_acf

  import matplotlib.pyplot as plt

  plot_acf(differenced_data, lags=20)

  plt.show()

  清单 3-10

  差分数据的自相关

  ```


  你将得到图 3-7 中的图形。该图显示了哪些自相关是重要的。在 y 轴上，你看到的是**非滞后数据**（原始数据）与**滞后数据**之间的**相关系数**。相关系数介于-1
  和 1 之间。在 x 轴上，你看到的是应用的**滞后数量**，本例中为 0 到 20。第一个相关性为 1，因为这是 0 滞后的数据：即原始数据。


  ![../images/508548_1_En_3_Chapter/508548_1_En_3_Fig7_HTML.jpg](img/508548_1_En_3_Fig7_HTML.jpg)


  图 3-7


  自相关图


  在此图中，你应该寻找**自相关**值至少高于 0.2 或低于-0.2 的数值。低于此范围的值可视为噪声。使用 0.3 或 0.4 作为最小值也是可能的：在解释相关系数方面没有严格的标准，因为某些领域的数据天生噪声更大。例如，在社会研究中，处理问卷调查的测量数据时，你通常会看到比处理精确物理测量数据时更多的噪声。


  图中的蓝色区域可以帮助你直观地检测哪些自相关只是噪声：如果尖峰超出蓝色区域，则存在显著的自相关；但如果尖峰保持在蓝色区域内，则观察到的自相关不显著。通常可以预期，离当前时间越近的滞后，其自相关越高，并随着向更远的时刻推移而减弱。


  在图 3-7 的图形中，你观察到一个非常强的第一个尖峰（在滞后 0 处）。这是正常的，因为它是原始数据。一个变量与自身的相关性总是 1（100%）。第二个尖峰是与滞后
  1 的相关性。这就是你之前使用相关矩阵计算的自相关。相关系数为-0.37，你在此图中再次看到了这个值。


  其余的自相关强度较弱。这意味着，要了解今天的地震次数，我们主要应查看滞后一个时间步的值；在当前示例中，这意味着去年的地震次数。如果去年地震很多，我们可以预期今年地震较少：这由滞后
  1 的负自相关所指示。


  为了理解如何解释更远的滞后，想象一个不同的（假设的）ACF 图，其中仅在滞后 5 处有一个正尖峰，而其他滞后均为 0。这意味着，要了解今年的地震次数，你需要查看五年前发生了什么：如果五年前地震很多，那么今年地震也会很多。中间发生的事件不相关：由于与前四年没有自相关，前四年的地震次数无法帮助你确定今年的地震次数。例如，这可能是一个周期为
  5 年的季节性案例。




  ### 偏自相关


  **偏自相关图**是另一个你应该关注的图表。自相关与偏自相关的区别在于，偏自相关确保任何相关性不会因多个滞后而被重复计算。因此，每个滞后的偏自相关是相对于每个较低滞后的**额外自相关**。更数学化的说法是，偏自相关是**基于较早滞后的条件自相关**。


  ![$$ PAC\left({y}_i,{y}_{i-h}\right)=\frac{\mathit{\operatorname{cov}}\left({y}_i,{y}_{i-h}|{y}_{i-1},\dots,
  {y}_{i-h}\right)}{\sqrt{\mathit{\operatorname{var}}\left({y}_i|{y}_{i-1},\dots,
  {y}_{i-h+1}\right)\ast \mathit{\operatorname{var}}\left({y}_{i-h}|{y}_{i-1},\dots,
  {y}_{i-h+1}\right)}} $$](img/508548_1_En_3_Chapter_TeX_Equa.png)


  这具有附加价值，因为自相关图中的相关性之间可能存在冗余。


  通过一个假设的例子更容易理解这个想法。想象一个假设情况：当前值、滞后 1 和滞后 5 的值完全相同。自相关会告诉你，滞后 1 和滞后 5 都存在完美的自相关。而偏自相关会告诉你，滞后
  1 存在完美的自相关，但不会显示滞后 5 的自相关。由于你应该始终尝试使用所需变量数量最少的模型（通常称为**奥卡姆剃刀**或**简约原则**），在这种情况下，最好只包含滞后
  1，而不包含滞后 5。


  你可以使用 statsmodels 计算偏自相关图，如代码清单 3-11 所示。**PACF** 是**偏自相关函数**的缩写：自相关作为滞后的函数。


  ```

  from statsmodels.graphics.tsaplots import plot_pacf

  plot_pacf(differenced_data, lags = 20)

  plt.show()

  代码清单 3-11

  差分数据的偏自相关

  ```


  这段代码将生成图 3-8 所示的图表。根据图中的蓝色背景阴影区域可以看出，PACF 显示第一个和第二个滞后位于阴影区域之外。这意味着在 AR 模型中也包含第二个滞后会很有意义。


