  train4['ds'] = pd.to_datetime(train4['ds']).dt.date\ntrain4 = train4.merge(X_reservations,\
  \ left_on = 'ds', right_on = 'visit_date', how = 'left')[['ds', 'y', 'reserve_visitors']].fillna(0)\n\
  清单 19-13\n将预订数据添加到数据中\n```\n\n然后，在模型拟合中，你可以使用 \"add_regressor\" 方法将其添加到模型中。你还需要将额外变量添加到未来数据框中。你可以使用清单\
  \ 19-14 来实现。\n\n```\nm4 = Prophet()\nm4.add_regressor('reserve_visitors')\nm4.fit(train4)\n\
  future4 = m4.make_future_dataframe(periods=len(test))\nfuture4['ds'] = pd.to_datetime(future4['ds']).dt.date\n\
  future4 = future4.merge(X_reservations, left_on = 'ds', right_on = 'visit_date',\
  \ how = 'left')[['ds', 'reserve_visitors']].fillna(0)\nforecast4 = m4.predict(future4)\n\
  print(r2_score(list(test['y']), list(forecast4.loc[450:,'yhat'] )))\nplt.plot(list(test['y']))\n\
  plt.plot(list(forecast4.loc[450:,'yhat'] ))\nfig2 = m4.plot_components(forecast4)\n\
  plt.show()\n清单 19-14\n将预订数据添加到模型中\n```\n\n此模型获得的 R2 得分为 **0.849**。这比之前的任何配置都要好，这意味着预订数量是对模型的一个很好的补充。你可以在图\
  \ 19-6 中看到预测结果的图表。\n\n![../images/508548_1_En_19_Chapter/508548_1_En_19_Fig6_HTML.jpg](img/508548_1_En_19_Fig6_HTML.jpg)\n\
  \n图 19-6\n\n预测值与实际数据对比\n\n你还可以在图 19-7 中看到此模型拟合的不同成分。在这个特定模型中，你可以看到额外变量“预订量”的影响。\n\
  \n![../images/508548_1_En_19_Chapter/508548_1_En_19_Fig7_HTML.jpg](img/508548_1_En_19_Fig7_HTML.jpg)\n\
  \n图 19-7\n\n模型分解图\n\n## 使用网格搜索调整超参数\n\n回顾一下，让我们在表 19-1 中列出我们目前看到的 Prophet 模型的不同变体。\n\
  \n表 19-1\n\nProphet 模型的结果\n\n| 模型变体 | R2 得分 |\n| --- | --- |\n| **基础 Prophet** |\
  \ **0.808** |\n| **包含月度季节性** | **0.787** |\n| **包含假日** | 0.806 |\n| **包含预订量作为回归变量**\
  \ | 0.849 |\n\n现在 0.849 是一个很好的分数。我们已经涵盖了可以添加到模型中的所有附加项：额外季节性、假日和额外回归变量。通过调整一些超参数，仍有改进空间。Prophet\
  \ 模型的超参数如下：\n\n*   **傅里叶阶数**可以为每个季节性设置。傅里叶阶数越高，意味着变化频率越高，这意味着傅里叶阶数较高的季节性曲线不那么平滑。\n\
  *   **changepoint_prior_scale** 允许趋势拟合得或多或少灵活。值越高，趋势越灵活。\n*   **holidays_prior_scale**\
  \ 允许假日效应变得不那么重要。默认值为 10，值越低，假日的重要性越低。\n*   **季节性**也有一个**先验尺度**。对于这个调优示例，我们将忽略它们；但要知道你也可以调整它们。\n\
  \n我们将对这些超参数进行网格搜索，看看是否能改进模型。既然要做，我们不妨将之前的测试也重新纳入考量。毕竟，当改变某些新超参数时，可能会改变其他选择上的最优值。\n\
  \n如前所述，网格搜索的基本方法是遍历超参数值的所有组合，然后选择性能最佳的组合。清单 19-15 展示了如何实现。\n\n\n\n```\ndef model_test(holidays,\
  \ weekly_seasonality,\nyearly_seasonality, add_monthly, add_reserve, changepoint_prior_scale,\
  \ holidays_prior_scale, month_fourier):\nm4 = Prophet(\nyearly_seasonality=yearly_seasonality,\n\
  weekly_seasonality=weekly_seasonality,\nholidays=holidays,\nchangepoint_prior_scale=changepoint_prior_scale,\n\
  holidays_prior_scale=holidays_prior_scale)\nif add_monthly:\nm4.add_seasonality(\n\
  name='monthly',\nperiod=30.5,\nfourier_order=month_fourier)\nif add_reserve:\nm4.add_regressor('reserve_visitors')\n\
  m4.fit(train4)\nfuture4 = m4.make_future_dataframe(periods=len(test))\nfuture4['ds']\
  \ = pd.to_datetime(future4['ds']).dt.date\nif add_reserve:\nfuture4 = future4.merge(\n\
  X_reservations,\nleft_on = 'ds',\nright_on = 'visit_date',\nhow = 'left')\nfuture4\
  \ = future4[['ds', 'reserve_visitors']]\nfuture4 = future4.fillna(0)\nforecast4\
  \ = m4.predict(future4)\nreturn r2_score(\nlist(test['y']),\nlist(forecast4.loc[450:,'yhat']\
  \ ))\n# 设置网格\nholidays_opt = [holidays, None]\nweekly_seas = [ 5, 10, 30, 50]\n\
  yearly_seas = [ 5, 10, 30, 50]\nadd_monthly = [True, False]\nadd_reserve = [True,\
  \ False]\nchangepoint_prior_scale = [0.1, 0.3, 0.5]\nholidays_prior_scale = [0.1,\
  \ 0.3, 0.5]\nmonth_fourier = [5, 10, 30, 50]\n# 遍历网格\ngrid_results = []\nfor h in\
  \ holidays_opt:\nfor w in weekly_seas:\nfor ys in yearly_seas:\nfor m in add_monthly:\n\
  for r in add_reserve:\nfor c in changepoint_prior_scale:\nfor hp in holidays_prior_scale:\n\
  for mf in month_fourier:\nr2=model_test(h,w,ys,m,r,c,hp,mf)\nprint([w,ys,m,r,c,hp,mf,r2])\n\
  grid_results.append([h,w,ys,m,r,c,hp,mf,r2])\n# 将所有结果添加到数据框并提取最佳模型\nbenchmark =\
  \ pd.DataFrame(grid_results)\nbenchmark = benchmark.sort_values(8, ascending=False)\n\
  h, w,ys, m, r, c,hp,mf,r2 = list(benchmark.iloc[0,:])\n# 使用这些最佳超参数拟合 Prophet 模型\n\
  m4 = Prophet(\nyearly_seasonality=ys,\nweekly_seasonality=w,\nholidays=h,\nchangepoint_prior_scale=c,\n\
  holidays_prior_scale=hp)\nif m:\nm4.add_seasonality(\nname='monthly',\nperiod=30.5,\n\
  fourier_order=mf)\nif r:\nm4.add_regressor('reserve_visitors')\nm4.fit(train4)\n\
  future4 = m4.make_future_dataframe(periods=len(test))\nfuture4['ds'] = pd.to_datetime(future4['ds']).dt.date\n\
  if r:\nfuture4 = future4.merge(\nX_reservations,\nleft_on = 'ds',\nright_on = 'visit_date',\n\
  how = 'left')\nfuture4 = future4[['ds', 'reserve_visitors']]\nfuture4 = future4.fillna(0)\n\
  forecast4 = m4.predict(future4)\n清单 19-15\n网格搜索 Prophet\n```\n\n经过调优的模型给出的 R2 得分为\
  \ **0.928**。该模型使用了趋势、周和年季节性，并将预约数量作为额外的回归变量。周季节性阶数为 **50**，年季节性傅里叶阶数为 **10**。“changepoint_prior_scale”为\
  \ **0.1**，而“holidays_prior_scale”无关紧要，因为最终模型未使用节假日。您可以在图 19-8 中看到预测性能，最终模型的分解结果如图\
  \ 19-9 所示。\n\n网格之外可能存在更好的结果。请随意更改网格参数并重新运行网格搜索，看看是否能获得更优的分数。\n\n![../images/508548_1_En_19_Chapter/508548_1_En_19_Fig9_HTML.jpg](img/508548_1_En_19_Fig9_HTML.jpg)\n\
  \n图 19-9\n\n调优模型的分解结果\n\n![../images/508548_1_En_19_Chapter/508548_1_En_19_Fig8_HTML.jpg](img/508548_1_En_19_Fig8_HTML.jpg)\n\
  \n图 19-8\n\n调优模型的预测性能\n\n## 关键要点\n\n*   Facebook Prophet 是 Facebook 开发的一种用于构建预测模型的自动化流程。\n\
  \n*   该模型易于设置和调优，这是一个巨大的优势。\n\n*   输入可能性包括：\n    *   任意规则阶数的季节性\n\n    *   节假日\n\
  \n    *   额外的回归变量\n\n*   您只能将 Prophet 用于单变量模型。对于多变量模型，您需要构建多个 Prophet 模型。\n\n* \
  \  该模型的目标是在无需过多干预的情况下获得良好结果，但仍有几个超参数可供调优：\n    *   *季节性的傅里叶阶数*：阶数越高，灵活性越大。\n\n \
  \   *   *changepoint_prior_scale* 影响趋势：值越高，趋势越灵活。\n\n    *   *holidays_prior_scale*：该值越低，节假日对模型的重要性越低。\n\
  \n    *   *季节性的先验尺度*\n\n"
- '# 20. DeepAR 模型


  **DeepAR** 是由亚马逊研究人员开发的一种模型。DeepAR 提供了一个使用基于 RNN 的深度学习架构构建时间序列模型的接口。使用 DeepAR 的优势在于，与
  Keras 相比，它提供了一个更易于用于模型构建的接口。


  DeepAR 可以被视为上一章中介绍的 Facebook Prophet 的竞争对手。这两种模型都试图为底层非常复杂的模型提供一个易于使用的模型接口。如果您希望以相对较少的工作量获得良好的模型，那么
  DeepAR 和 Prophet 绝对值得加入您的模型基准测试中。


  ## 关于 DeepAR


  DeepAR 使用 RNN 预测单变量或多变量时间序列。DeepAR 的理论附加价值在于，它同时对所有时间序列拟合一个单一模型。它旨在利用多个时间序列之间的相关性，因此它是多变量预测的绝佳模型。然而，它也可以应用于单个时间序列。


  DeepAR 对多种类型的季节性变量进行建模。它还会为月中的第几天、年中的第几天以及其他派生变量创建变量。作为 DeepAR 模型的用户，我们对这些变量以及算法的内部工作机制没有太多控制权。除了我们稍后将讨论的几个超参数外，该模型相对而言是一个黑盒。



  ## 使用 DeepAR 进行模型训练


  为了探索 DeepAR 模型，我们将使用上一章中用过的餐厅访问量数据集。这样，我们可以将 DeepAR 与 Facebook 的 Prophet 模型进行基准测试。数据可在
  [`www.kaggle.com/c/recruit-restaurant-visitor-forecasting`](http://www.kaggle.com/c/recruit-restaurant-visitor-forecasting)
  获取。你可以通过使用清单 20-1 对所有餐厅的数据求和来准备数据。


  ```

  import pandas as pd

  y = pd.read_csv(''air_visit_data.csv.zip'')

  y = y.pivot(index=''visit_date'', columns=''air_store_id'')[''visitors'']

  y = y.fillna(0)

  y = pd.DataFrame(y.sum(axis=1))

  y = y.reset_index(drop=False)

  y.columns = [''date'', ''y'']

  清单 20-1

  导入数据

  ```


  回顾一下，经过调优的最终 Facebook Prophet 模型获得了 0.928 的 R2 分数。让我们看看 DeepAR 是否能达到这个性能。我们将使用 gluonts
  库提供的 DeepAR 模型。我建议使用以下链接获取安装说明并了解依赖关系：[`https://ts.gluon.ai/install.html`](https://ts.gluon.ai/install.html)。


  要使用这个库，我们首先需要将数据准备成该库能够理解的格式。Gluonts 使用一种相对不直观的数据格式。它使用一个名为 **ListDataset** 的对象。该对象必须包含*目标变量、起始时间戳和频率*。训练数据只需包含训练数据，而测试数据则需要包含训练数据和测试数据。


  你可以使用清单 20-2 来构建这些对象。注意：不合逻辑的是，为了获得合理准确的预测，必须指定季节性为“H”（小时）而不是“D”（天）。这很可能是由于在撰写本文时
  gluonts 中存在一个未解决的错误。


  ```

  from gluonts.dataset.common import ListDataset

  start = pd.Timestamp("01-01-2016", freq="H")

  # 训练数据集：裁剪最后一个长度为 "prediction_length" 的窗口，添加 "target" 和 "start" 字段

  train_ds = ListDataset([{''target'': y.loc[:450,''y''], ''start'': start}], freq=''H'')

  # 测试数据集：使用整个数据集，添加 "target" 和 "start" 字段

  test_ds = ListDataset([{''target'': y[''y''], ''start'': start}],freq=''H'')

  清单 20-2

  准备 gluonts 库所需的数据格式

  ```


  现在，让我们开始在清单 20-3 中使用 gluonts 构建一个简单的 DeepAR 模型。为此，你需要创建一个名为 **DeepAREstimator**
  的**估计器**，它内部会使用一个**训练器**。该函数中的重要参数如下：


  *   **prediction_length**，即你想要预测的步数。

  *   **ctx**，用于指定你希望在 CPU 还是 GPU 上运行。在 GPU 上运行要快得多，但前提是你的硬件上有可用的 GPU。

  *   **epochs** 的数量，即你希望所有数据通过底层深度神经网络的次数。

  *   **learning rate** 是神经网络优化器的步长：较大的学习率允许你迈出更大的步伐，但可能会错过最优值；而较小的学习率可能会使优化变慢，或让你陷入局部最优。


  ```

  from gluonts.model.deepar import DeepAREstimator

  from gluonts.trainer import Trainer

  import mxnet as mx

  import numpy as np

  np.random.seed(7)

  mx.random.seed(7)

  estimator = DeepAREstimator(

  prediction_length=28,

  context_length=100,

  freq=''H'',

  trainer=Trainer(ctx="gpu", # 如果在 Windows 上运行，请移除

  epochs=5,

  learning_rate=1e-3,

  num_batches_per_epoch=100

  )

  )

  predictor = estimator.train(train_ds)

  清单 20-3

  拟合默认的 DeepAR 模型

  ```


  ## 使用 DeepAR 进行预测


  然后，要对测试集进行预测，你可以使用清单 20-4。这一步中有些复杂的事情。模型不仅仅做出一个预测，而是做出许多预测。默认情况下，它每个时间步会做出 100 个预测，每个预测都是一个备选的未来轨迹。


  这听起来可能很奇怪，因为你通常只想要一个预测。这个预测应该尽可能准确。然而，其思路是，在预测了大量潜在轨迹后，你可以将这 100 个备选轨迹的中位数作为预测值。中位数也称为
  0.5 分位数。


  ```

  predictions = predictor.predict(test_ds)

  predictions = list(predictions)[0]

  predictions = predictions.quantile(0.5)

  清单 20-4

  预测

  ```


  让我们计算测试集的 R2 分数，并使用清单 20-5 绘制图表，看看这些预测结果是什么样的。


