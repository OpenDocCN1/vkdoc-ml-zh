  ## 要点总结


  *   AR 模型通过利用变量过去值与当前值之间的相关性来预测变量的未来。


  *   自相关是指时间序列与其自身先前值之间的相关性。


  *   偏自相关是条件于更早滞后项的自相关：它避免了相关性的重复计算。


  *   AR 模型中包含的滞后阶数可以基于理论（ACF 和 PACF 图）确定，也可以通过网格搜索确定。


  *   网格搜索包括对模型超参数的每个取值进行模型评估。这是一种用于选择超参数的优化方法。


  *   超参数不同于模型系数。模型系数由模型优化，而超参数由建模者选择。然而，模型可以使用像网格搜索这样的优化技术来找到最佳超参数。


  *   Yule-Walker 方程用于拟合 AR 模型。拟合模型意味着找到模型的系数。




  '
- "# 4. MA 模型\n\nMA 模型，即**移动平均模型**，是单变量时间序列中第二个重要的构建模块（见表 4-1）。与 AR 模型一样，它通常作为更复杂时间序列的一部分来使用，但也可以单独使用。\n\
  \n表 4-1\n单变量时间序列的构建模块\n\n| 名称 | 解释 | 章节 |\n| --- | --- | --- |\n| AR | 自回归 | 3 |\n\
  | MA | 移动平均 | 4 |\n| ARMA | AR 与 MA 模型的组合 | 5 |\n| ARIMA | 在 ARMA 模型中加入差分（I） | 6\
  \ |\n| SARIMA | 在 ARIMA 模型中加入季节性（S） | 7 |\n| SARIMAX | 在 SARIMA 模型中加入外部变量（X）*（注意，加入外部变量后，模型不再是单变量模型）*\
  \ | 8 |\n\n在本章中，你将看到 MA 模型应用于一个预测示例。请注意，与上一章一样，该模型被优化为**一个独立的模型**。在实际应用单变量时间序列时，你通常会直接使用\
  \ SARIMA 或 SARIMAX 模型：毕竟，MA 模型只是该模型的一个组成部分。然而，单独观察 MA 模型的应用仍有其价值，因为分别理解 SARIMAX\
  \ 模型的每个构建模块非常重要。\n\n## 模型定义\n\nMA 模型背后的数学模型在形式上与 AR 模型非常相似，但在直观理解上却大相径庭。AR 模型通过观察目标变量的滞后值来预测未来，而\
  \ MA 模型则观察**过去预测的模型误差**。模型定义如下：\n\n![$$ {X}_t=\\mu +{\\varepsilon}_t+{\\theta}_1{\\\
  varepsilon}_{t-1}+\\dots +{\\theta}_q{\\varepsilon}_{t-q} $$](img/508548_1_En_4_Chapter_TeX_Equa.png)\n\
  \n在这个方程中，**Xt** 是当前值（非滞后值），*μ*（mu）是序列的平均值，*ε*（epsilon）是模型的误差，*θ*（theta）是与每个过去值相乘的系数。\n\
  \n如你所见，该模型只包含过去的误差，而不包含过去的值。这意味着，要预测未来，你不需要看过去发生了什么，而只需要看过去你错得有多离谱！\n\n这看起来可能有些奇怪，但其中自有逻辑。想象一个场景，你试图根据过去进行预测。在某些时刻，过程与你预期的结果大相径庭，而你却不明白原因。假设在某个时间点，股票价格出现了巨大且意外的暂时性下跌。\n\
  \nAR 模型和 MA 模型都能随着时间的推移考虑到这种下跌，但方式不同。AR 模型会将其建模为一个过去的低值。而 MA 模型则会将其建模为一个巨大的误差，这个误差可以被解释为一个巨大的冲击。在这种情况下，将误差视为冲击本身而非数值是合理的，因为正是这种冲击的意外性，将成为未来几天股票价格的驱动因素——股票交易者会对这种意外冲击做出反应。\n\
  \n这样看来，*过去的模型误差会影响未来，过去的误差可以帮助你进行预测*。这就是 MA 模型背后的思想。\n\n注意\n\n“移动平均”这个术语也用于指代对最近的值取平均。在时间序列分析中，这通常用于平滑时间序列。这与\
  \ MA 模型无关。\n\n## 拟合 MA 模型\n\n拟合 MA 模型比拟合 AR 模型更复杂。从宏观层面看，MA 模型似乎与 AR 模型相对可比：MA 依赖于过去的误差，而\
  \ AR 模型依赖于过去的值。\n\n然而，这里有一个巨大的区别。在拟合 MA 模型时，你还没有得到模型过去的误差。由于你尚未定义模型，你无法估计模型的误差。而你需要模型的误差来估计系数。\n\
  \n这里存在某种循环依赖关系，这使得无法找到一种直接的方法来一次性拟合模型。不过，可以使用不同的技术来拟合 MA 模型，其中最常用的是非线性最小二乘法。它假设时间\
  \ 0 处的误差可以忽略不计。然后可以使用以下公式估计 theta 值：\n\n![$$ {\\hat{\\theta}}_{nls}=\\underset{\\\
  theta }{\\mathrm{argmin}}\\sum \\limits_{t=2}^T{\\left({x}_t-\\theta \\sum \\limits_{k=0}^{t-2}{\\\
  left(-\\theta \\right)}^k{\\varphi}_{t-1-k}\\right)}² $$](img/508548_1_En_4_Chapter_TeX_Equb.png)\n\
  \n由于该公式使用了**argmin**，因此这是一个对 theta 最优值的数值搜索过程。这意味着拟合模型只需通过迭代搜索不同的 theta 值，并确定哪些\
  \ theta 值能使公式其余部分的值最小，即以下公式的值最小：\n\n![$$ {\\sum}_{t=2}^T{\\left({x}_t-\\theta {\\\
  sum}_{k=0}^{t-2}{\\left(-\\theta \\right)}^k{\\varphi}_{t-1-k}\\right)}²\\. $$](img/508548_1_En_4_Chapter_TeX_Equc.png)\n\
  \n图 4-1 中展示了这样一个最小化的示例。该图显示了一条依赖于参数的误差曲线。目标是找到能让你获得最低模型误差的参数。这并非易事，因为你通常对这些参数一无所知。\n\
  \n我不会深入探讨可用于此最小化任务的优化方法，因为这超出了本书的范围。但你应该知道，有许多算法可以执行此类优化任务。\n\n![../images/508548_1_En_4_Chapter/508548_1_En_4_Fig1_HTML.jpg](img/508548_1_En_4_Fig1_HTML.jpg)\n\
  \n图 4-1\n使误差最小化的参数\n\n## 平稳性\n\n需要注意的是，MA 模型绝对需要平稳性。AR 模型可以适应非平稳的情况，而 MA 模型则不能。增广迪基-富勒检验和差分这些概念已在第\
  \ 3 章中介绍过，此处同样适用。\n\n## 在 AR 模型和 MA 模型之间进行选择\n\n与 AR 模型一样，MA 模型的滞后阶数可以通过观察 PACF\
  \ 图（偏自相关函数）来确定。但 PACF 曲线的用途不仅仅在于选择最佳的理论滞后阶数。\n\nPACF 图还可以帮助你选择正确的模型类型。例如，你现在已经了解了\
  \ AR 模型和 MA 模型，但可能不知道应该使用哪一个。自相关的类型可以成为决策的一个因素。\n\n以下是用于判断模型类型的指标：\n\n![../images/508548_1_En_4_Chapter/508548_1_En_4_Fig3_HTML.jpg](img/508548_1_En_4_Fig3_HTML.jpg)\n\
  \n图 4-3\n典型的 MA 模型 ACF\n\n*   自回归（典型的 PACF 图见图 4-2）：\n\n    ![../images/508548_1_En_4_Chapter/508548_1_En_4_Fig2_HTML.jpg](img/508548_1_En_4_Fig2_HTML.jpg)\n\
  \n    图 4-2\n    典型的 AR 模型 PACF\n\n    *   自相关衰减至 0。\n    *   自相关呈指数衰减。\n    * \
  \  自相关在正负之间交替并衰减至 0。\n\n*   移动平均（典型的 ACF 图见图 4-3）：\n    *   许多值（几乎）为零，并伴有少数尖峰。\n\
  \n\n\n## MA 模型的应用\n\n现在让我们通过一个例子来应用它。本例中使用的数据是微软股票的收盘价。你可以通过雅虎财经 Python 包获取这些数据，如代码清单\
  \ 4-1 所示。\n\n注意\n\n雅虎财经包是一个 Python 包，允许从雅虎财经网站下载股票数据。\n\n```\nfrom pandas_datareader\
  \ import data as pdr\nimport yfinance\ndata = pdr.get_data_yahoo('MSFT', start='2019-01-01',\
  \ end='2019-12-31')\ndata = data['Close']\n代码清单 4-1\n使用雅虎财经包导入股票价格数据\n```\n\n如你所知，初步了解数据非常重要，因此我们先绘制收盘价的图表。这在代码清单\
  \ 4-2 中完成。\n\n```\nimport matplotlib.pyplot as plt\nax = data.plot()\nax.set_ylabel(\"\
  Stock Price\")\nplt.show()\n代码清单 4-2\n绘制股票价格数据\n```\n\n这将输出图 4-4 中的图表。\n\n![../images/508548_1_En_4_Chapter/508548_1_En_4_Fig4_HTML.jpg](img/508548_1_En_4_Fig4_HTML.jpg)\n\
  \n图 4-4\n\n原始数据图\n\n在这张图中，你可以清晰地看到一个上升趋势。这里甚至不需要应用增广迪基-富勒检验就能看出这些数据是**非平稳的**。由于\
  \ MA 模型无法在非平稳状态下运行，我们应用标准的解决方案：差分。这在代码清单 4-3 中完成，并将显示图 4-5 中的图表。\n\n![../images/508548_1_En_4_Chapter/508548_1_En_4_Fig5_HTML.jpg](img/508548_1_En_4_Fig5_HTML.jpg)\n\
  \n图 4-5\n\n差分后数据图\n\n```\n# 需要进行差分\ndata = data.diff().dropna()\nax = data.plot()\n\
  ax.set_ylabel(\"Daily Difference in Stock Price\")\nplt.show()\n代码清单 4-3\n计算差分数据并绘制图表\n\
  ```\n\n这个差分后的数据看起来是平稳的。为了保持一致性，代码清单 4-4 展示了如何对这些差分数据应用增广迪基-富勒检验，尽管通过目视检查，这一点毫无疑问：数据明显围绕着一个固定均值\
  \ 0 波动。\n\n```\nfrom statsmodels.tsa.stattools import adfuller\nresult = adfuller(data)\n\
  pvalue = result[1]\nif pvalue < 0.05:\nprint('stationary')\nelse:\nprint('not stationary')\n\
  代码清单 4-4\n对差分数据应用 ADF 检验\n```\n\n这证实了差分序列的平稳性。让我们查看自相关函数和偏自相关函数，看看是否存在明显的滞后阶数选择，使用代码清单\
  \ 4-5 来获取图 4-6 中的 ACF 和图 4-7 中的 PACF。\n\n![../images/508548_1_En_4_Chapter/508548_1_En_4_Fig7_HTML.jpg](img/508548_1_En_4_Fig7_HTML.jpg)\n\
  \n图 4-7\n\n偏自相关函数\n\n![../images/508548_1_En_4_Chapter/508548_1_En_4_Fig6_HTML.jpg](img/508548_1_En_4_Fig6_HTML.jpg)\n\
  \n图 4-6\n\n自相关函数\n\n```\nfrom statsmodels.graphics.tsaplots import plot_acf, plot_pacf\n\
  plot_acf(data, lags=20)\nplot_pacf(data, lags=20)\nplt.show()\n代码清单 4-5\n绘制自相关函数和偏自相关函数\n\
  ```\n\n不幸的是，自相关函数和偏自相关函数中都没有非常清晰的模式来确认阶数的选择。你可以观察到偏自相关函数有一些衰减，这是使用时间序列方法的一个积极信号。但在滞后阶数的选择上并不明显。让我们拟合阶数为\
  \ 1 的 MA 模型，看看效果如何。\n\n要在 Python 中拟合 MA 模型，你需要使用 statsmodels 中的 ARIMA 函数。ARIMA 是一个你将在下一章看到的模型。它包含多个单变量时间序列的构建模块，包括用于\
  \ AR 模型的 AR 和用于 MA 模型的 MA。你可以分别为每个“子”模型指定阶数，因此通过将所有除 MA 之外的参数设置为 0，就可以得到 MA 模型。这可以使用代码清单\
  \ 4-6 来完成。\n\n```\nfrom sklearn.metrics import r2_score\nfrom statsmodels.tsa.arima.model\
  \ import ARIMA\n# 预测第一个 MA(1) 模型\nmod = ARIMA(data.diff().dropna(), order=(0,0,1))\n\
  res = mod.fit()\norig_data = data.diff().dropna()\npred = res.predict()\nplt.plot(orig_data)\n\
  plt.plot(pred)\nplt.show()\nprint(r2_score(orig_data, pred))\n代码清单 4-6\n拟合 MA 模型并绘制预测结果\n\
  ```\n\n这将给出拟合图（图 4-8）以及整个周期上的 R2 分数。\n\n![../images/508548_1_En_4_Chapter/508548_1_En_4_Fig8_HTML.jpg](img/508548_1_En_4_Fig8_HTML.jpg)\n\
  \n图 4-8\n\n训练数据集上的实际值与预测值对比\n\n这张图看起来还不错：橙色曲线（预测值）跟随蓝色曲线（实际值）的总体趋势。你可以观察到预测曲线的预测值不那么极端（高点更低，低点更高）。R2\
  \ 分数为 **0.51**。\n\n作为解释，你可以观察到这个模型存在欠拟合：它捕捉到了基本情况，但没有捕捉到足够的趋势来成为一个非常好的模型。在这个阶段，你可以通过创建训练集和测试集来检查其样本外表现。这可以使用代码清单\
  \ 4-7 如下完成。\n\n```\ntrain = data.diff().dropna()[0:240]\ntest = data.diff().dropna()[240:250]\n\
  # 预测第一个 MA(1) 模型\nmod = ARIMA(train, order=(0,0,1))\nres = mod.fit()\norig_data\
  \ = data.diff().dropna()\npred = res.predict()\nfcst = res.forecast(steps = len(test))\n\
  print(r2_score(train, pred))\nprint(r2_score(test, fcst))\n代码清单 4-7\n在训练数据上拟合 MA\
  \ 模型并评估训练集和测试集上的 R2 分数\n```\n\n这将给出训练集 R2 为 **0.51**，测试集 R2 为 **0.13**。训练数据上的表现不佳，测试数据上的表现更差（测试数据中只有\
  \ 13% 的变异可以由 MA 模型解释）。测试数据实际值与预测值的可视化对比应该能证实这种较差的拟合（使用代码清单 4-8 得到图 4-9）。\n\n![../images/508548_1_En_4_Chapter/508548_1_En_4_Fig9_HTML.jpg](img/508548_1_En_4_Fig9_HTML.jpg)\n\
  \n图 4-9\n\nMA(1) 模型的样本外表现\n\n```\nplt.plot(list(test))\nplt.plot(list(fcst))\nplt.legend(['Actual\
  \ Prices', 'Predicted Prices'])\nplt.show()\n代码清单 4-8\n绘制 MA(1) 模型（阶数为 1 的 MA 模型）的样本外预测结果\n\
  ```\n\n但是，查看这张图时，你会发现测试集上的预测有些奇怪。MA(1) 预测除了第一步之外，其余所有值都预测了平均值。\n\n这背后有数学原因：MA(q)\
  \ 模型使用过去 q 步的模型误差来预测未来。当预测未来一步时，没有问题：模型拥有预测之前每个时间步的实际值和拟合值。但是，当预测第二个时间步时，模型不知道时间\
  \ t + 1 的实际值，而这是预测 t + 2 所需的输入。\n\n\n\n## 带模型重训练的多步预测\n\n在上一章中，我们进行了向前十步的预测。然而，我们尚未关注预测中的一个关键区别，即单步预测与多步预测之间的差异。\n\
  \n单步预测是基础。预测下一步相对容易。而使用时间序列进行多步预测并非易事，因为每向前一步，误差都会累积。\n\n在许多情况下，最精确的解决方案是每一步都重新训练模型。事实上，只要你获得一个新的数据点就立即更新模型，这是可行的。这意味着你将进行重复的单步预测。在某些情况下，这种方法有效，而在其他情况下，则需要对更远的未来进行预测。\n\
  \n在模型评估中，考虑预测的时长非常重要。如果你进行多步预测，就应该在多步训练-测试集划分上进行评估。如果你进行单步预测，就应该在单步训练-测试集划分上进行评估。\n\
  \n如果你进行单步预测，会发现测试数据集不足：你无法仅根据一个数据点的测试数据来计算预测误差。一个可行的解决方案是迭代地拟合单步模型，并基于多个单步预测构建一个多步预测。这在代码清单\
  \ 4-9 中实现。\n\n```\nimport pandas as pd\ntrain = data.diff().dropna()[0:240]\ntest\
  \ = data.diff().dropna()[240:250]\n# 从 statsmodels 导入 ARMA 模块\nfrom statsmodels.tsa.arima.model\
  \ import ARIMA\nfcst = []\nfor step in range(len(test)):\n# 预测第一个 MA(1) 模型\nmod\
  \ = ARIMA(train.reset_index(drop=True), order=(0,0,1))\nres = mod.fit()\norig_data\
  \ = data.diff().dropna()\npred = res.predict()\nfcst += list(res.forecast(steps\
  \ = 1))\ntrain = train.append(pd.Series(test[step]))\nprint(r2_score(list(test),\
  \ fcst))\nplt.plot(list(test))\nplt.plot(fcst)\nplt.legend(['实际价格', '预测价格'])\nplt.show()\n\
  代码清单 4-9\n评估 MA(1) 模型在十次重新拟合的单步预测中的误差\n```\n\n使用此方法获得的 R2 分数是 **0.48**：虽然不完美，但已开始显现出一定的实用性。预测值与实际值的对比图如图\
  \ 4-10 所示。\n\n![../images/508548_1_En_4_Chapter/508548_1_En_4_Fig10_HTML.jpg](img/508548_1_En_4_Fig10_HTML.jpg)\n\
  \n图 4-10\n\n多次单步预测产生了相对可接受的预测结果\n\n当然，通过这种方式获得的误差估计仅适用于下一个时间步的预测，对于更长的周期则无效。如何在实践中应用这一点，取决于你的具体用例。\n\
  \n对于这个特定示例，你可以认为，如果你能完美预测第二天的股票市场，这已经是相当了不起的成就了：在这种情况下，我们保留单步误差。\n\n## 网格搜索寻找最佳\
  \ MA 阶数\n\n作为下一步，让我们尝试进行网格搜索，以找到在测试集上获得最低误差的 MA 模型阶数。回想一下上一章的网格搜索：其基本版本就是简单地遍历阶数的每个可能值，并在测试数据上评估模型。\n\
  \n还有其他更优的自动化超参数优化方法：你将在接下来的章节中看到它们，所以请确保你现在理解了基本版本背后的思想。现在，让我们使用代码清单 4-10 来找出是否存在某个特定的\
  \ MA 阶数能为我们带来更好的预测性能。\n\n```\ndef evaluate2(order):\ntrain = data.diff().dropna()[0:240]\n\
  test = data.diff().dropna()[240:250]\nfcst = []\nfor step in range(len(test)):\n\
  # 预测第一个 MA(1) 模型\nmod = ARIMA(train.reset_index(drop=True), order=(0,0,order))\n\
  res = mod.fit()\norig_data = data.diff().dropna()\npred = res.predict()\nfcst +=\
  \ list(res.forecast(steps = 1))\ntrain = train.append(pd.Series(test[step]))\nreturn\
  \ r2_score(list(test), fcst)\nscores = []\nfor i in range(1, 21):\nscores.append((i,\
  \ evaluate2(i)))\n# 观察到最佳阶数为 4，R2 为 0.566\nscores = pd.DataFrame(scores)\nprint(scores[scores[1]\
  \ == scores.max()[1]])\n代码清单 4-10\n网格搜索以获取优化预测 R2 的 MA 阶数\n```\n\n这将给出最佳阶数为 4，样本外\
  \ R2 为 **0.57**。你可以使用代码清单 4-11 中的代码查看由此产生的最终预测。你将得到的图表如图 4-11 所示。\n\n![../images/508548_1_En_4_Chapter/508548_1_En_4_Fig11_HTML.jpg](img/508548_1_En_4_Fig11_HTML.jpg)\n\
  \n图 4-11\n\n最终结果：MA(4) 预测\n\n```\ntrain = data.diff().dropna()[0:240]\ntest = data.diff().dropna()[240:250]\n\
  fcst = []\nfor step in range(len(test)):\n# 预测第一个 MA(1) 模型\nmod = ARIMA(train.reset_index(drop=True),\
  \ order=(0,0,4))\nres = mod.fit()\norig_data = data.diff().dropna()\npred = res.predict()\n\
  fcst += list(res.forecast(steps = 1))\ntrain = train.append(pd.Series(test[step]))\n\
  print(r2_score(list(test), fcst))\nplt.plot(list(test))\nplt.plot(fcst)\nplt.legend(['实际价格',\
  \ '预测价格'])\nplt.show()\n代码清单 4-11\n获取最终预测\n```\n\n## 要点总结\n\n*   移动平均模型基于过去的冲击来预测未来。\n\
  \    *   这些冲击以模型误差来衡量。\n\n    *   其背后的思想是，意外的冲击实际上可能对未来产生重大影响。\n\n    *   MA 模型系数没有一次性计算方法，因此与\
  \ AR 模型相比，估计该模型所需的时间稍长。\n\n    *   MA 模型是 SARIMA 模型的第二个构建块。AR 和 MA 模型共同构成了 ARMA\
  \ 模型，这是下一章的主题。\n\n*   多步预测是对未来多个时间步的预测。这对于 MA 模型来说很困难，尤其是当阶数较低时。有时，一个解决方案是进行多次单步预测，并在每次收到新数据时重新训练模型。\n\
  \n*   自相关函数和偏自相关函数可以帮助你判断正在处理的是 AR 预测还是 MA 预测。AR 预测的自相关函数呈指数衰减至 0，并在正负值之间交替。MA 自相关函数的特征是许多值接近零，并伴有少数几个尖峰。\n\
  \n"
- "# 5. ARMA 模型\n\n在本章中，你将了解 ARMA 模型。它是你在前两章中看到的 AR 模型和 MA 模型的组合。由于本章的理论对你来说应该已经相对熟悉，本章还将介绍一些额外的模型质量指标，这些指标适用于\
  \ ARMA 模型，但也可以分别用于 AR 和 MA 模型。\n\n\n\n## ARMA 模型背后的思想\n\nARMA 模型是 AR 模型和 MA 模型的简单组合。将\
  \ AR 和 MA 模型合并为一个模型背后的思想是，组合后的模型比单一模型性能更优。一个变量随时间的发展可以同时遵循多个过程。\n\n让我们分别简要回顾一下 AR\
  \ 和 MA 模型。AR 模型试图通过**将过去的值乘以一个系数**来预测未来。这个 AR 过程基于自相关的存在：目标变量的当前值与过去的值相关。MA 模型不使用目标变量的过去值来预测其未来，而是使用**过去预测的误差**作为预测值的驱动力。\n\
  \nARMA 模型只不过是一个允许这两个过程同时存在的模型：\n\n*   变量未来的部分由过去的值解释（AR 效应）。\n*   变量的另一部分由过去的误差解释（MA\
  \ 效应）。\n\n两者合并到一个模型中使得使用起来更加简单：你可以想象，使用两个独立的模型会非常繁琐。\n\n## ARMA 模型的数学定义\n\nARMA\
  \ 模型由以下方程定义：\n\n![$$ {X}_t=c+{\\varepsilon}_t+\\sum \\limits_{i=1}^p{\\varphi}_i{X}_{t-i}+\\\
  sum \\limits_{i=1}^q{\\theta}_i{\\varepsilon}_{t-i} $$](img/508548_1_En_5_Chapter_TeX_Equa.png)\n\
  \n在这个方程中，你可以清晰地看到 AR 部分和 MA 部分。AR 部分使用系数 *φ*[*i*]（phi）乘以过去的观测值 *X*[*t* − *i*]，对应**滞后阶数**定义为\
  \ **p**，也称为 **AR 阶数**。MA 部分使用系数 *θ*[*i*]（theta）乘以过去的误差 *ε*[*t* − *i*]（epsilon），对应**滞后阶数\
  \ q**，即 **MA 阶数**。\n\n这些 p 和 q 与你之前遇到的超参数相同。对于模型表示法，你使用 *AR(p) 表示阶数为 p 的 AR 模型*，*MA(q)\
  \ 表示阶数为 q 的 MA 模型*。在 ARMA 模型中，p 和 q 保持不变。这给出了以下表示法：**ARMA(p, q)**。\n\n这里你应该注意，p\
  \ 和 q 之间没有依赖关系，就像方程中 AR 和 MA 的定义之间没有依赖关系一样。这意味着 ARMA(p, q) 模型可以取任意阶数的 p 和 q。特殊情况是当\
  \ p = 0 时，表示你有一个 MA 模型；当 q = 0 时，表示你有一个 AR 模型。\n\n由于 p 和 q 是超参数，它们是由建模者选择的参数，而 c、*φ*\
  \ 和 *θ* 是模型的系数，因此将由模型估计。\n\n## 示例：使用 ARMA 预测太阳黑子\n\n现在，让我们开始一个示例，看看 AR 和 MA 模型的组合能力是否能提供良好的预测。你将使用太阳黑子数据集，这是一个相对著名的数据集，包含对太阳黑子数量非常长期的历史观测数据。你可以使用代码清单\
  \ 5-1 将数据导入 Python，并在图 5-1 中查看数据框的前几行。\n\n```\nimport pandas as pd\ndata = pd.read_csv('Ch05_Sunspots_database.csv',\
  \ usecols = [1, 2])\n代码清单 5-1\n将太阳黑子数据导入 Python\n```\n\n太阳黑子数据集以其在 11 年周期内具有特定的季节性效应模式而闻名。该数据集并不十分详细：它只包含每月的计数数据。由于有大量数据可供使用，让我们设定目标，使用年度数据进行预测。为此，需要将数据聚合为年度数据。你可以使用代码清单\
  \ 5-2 来完成此操作。\n\n![../images/508548_1_En_5_Chapter/508548_1_En_5_Fig1_HTML.jpg](img/508548_1_En_5_Fig1_HTML.jpg)\n\
  \n图 5-1\n\n太阳黑子数据摘录\n\n```\ndata['year'] = data.Date.apply(lambda x: x[:4])\ndata\
  \ = data[['Monthly Mean Total Sunspot Number', 'year']].groupby('year').sum()\n\
  data.head()\n代码清单 5-2\n将太阳黑子数据聚合为年度数据\n```\n\n让我们也绘制一个随时间变化的图，看看你正在处理的是哪种类型的波动。你可以使用代码清单\
  \ 5-3 来完成此操作。使用此代码，你应该得到图 5-2 中的图形。\n\n![../images/508548_1_En_5_Chapter/508548_1_En_5_Fig2_HTML.jpg](img/508548_1_En_5_Fig2_HTML.jpg)\n\
  \n图 5-2\n\n太阳黑子数据图\n\n```\nimport matplotlib.pyplot as plt\nax = data.plot()\nax.set_ylabel('Sunspots')\n\
  plt.show()\n代码清单 5-3\n绘制年度太阳黑子数据\n```\n\n观察此图，模式已经非常清晰：在规则的时间间隔内出现高峰。让我们看看如何使用 ARMA\
  \ 模型来捕捉这种模式并对未来进行预测。第一步，一如既往，是验证数据是否平稳。\n\n请记住，平稳性意味着数据中没有长期趋势：平均值随时间保持恒定。查看数据时，没有明显的长期趋势，但你可以使用\
  \ ADF 检验（增广迪基-富勒检验）来确认这一点。代码清单 5-4 展示了如何执行此操作。\n\n```\nfrom statsmodels.tsa.stattools\
  \ import adfuller\nresult = adfuller(data['Monthly Mean Total Sunspot Number'])\n\
  print(result)\npvalue = result[1]\nif pvalue < 0.05:\nprint('stationary')\nelse:\n\
  print('not stationary')\n代码清单 5-4\n对太阳黑子年度总数应用 ADF 检验\n```\n\n应用此检验得到的结果出乎意料：ADF\
  \ 检验告诉你数据**不平稳**。在这种情况下，直观的判断是假设平稳，而 ADF 检验却告诉你并非如此。必须做出选择。\n\n现在，让我们尽可能保持简单，继续使用原始数据。\n\
  \n接下来要关注的是自相关函数（ACF）和偏自相关函数（PACF）。请记住，ACF 和 PACF 图可以帮助你确定你正在处理的是 AR 还是 MA 过程。你可以使用代码清单\
  \ 5-5 获取 ACF 和 PACF。\n\n```\nfrom statsmodels.graphics.tsaplots import plot_acf,\
  \ plot_pacf\nimport matplotlib.pyplot as plt\nplot_acf(data['Monthly Mean Total\
  \ Sunspot Number'], lags=40)\nplot_pacf(data['Monthly Mean Total Sunspot Number'],\
  \ lags=40)\nplt.show()\n代码清单 5-5\n创建 ACF 和 PACF 图\n```\n\n你将得到图 5-3 和图 5-4 中的图形。\n\
  \n![../images/508548_1_En_5_Chapter/508548_1_En_5_Fig4_HTML.jpg](img/508548_1_En_5_Fig4_HTML.jpg)\n\
  \n图 5-4\n\n偏自相关函数（PACF）\n\n![../images/508548_1_En_5_Chapter/508548_1_En_5_Fig3_HTML.jpg](img/508548_1_En_5_Fig3_HTML.jpg)\n\
  \n图 5-3\n\n自相关函数（ACF）\n\n图 5-3 和图 5-4 中的 ACF 和 PACF 图是研究时间序列模式的绝佳案例；在真实数据中观察到如此强烈的模式是罕见的。请记住前面章节中你应该关注哪些类型的模式：\n\
  \n*   AR 过程的识别特征为：\n    *   偏自相关呈指数衰减\n    *   偏自相关向零衰减\n    *   偏自相关在负值和正值之间摆动\n\
  *   MA 过程的识别特征为：\n    *   ACF 和 PACF 中出现突然的尖峰\n\n这意味着在太阳黑子案例中，你有一个强烈的指标表明观察到 AR\
  \ 模式：PACF 呈指数衰减，同时在负值和正值之间切换。观察这些图时，没有真正的证据表明存在 MA 过程。\n\n\n\n## 拟合 ARMA(1,1) 模型\n\
  \nARMA(p,q) 模型只是 AR 模型和 MA 模型的简单组合，重要的是要认识到，其中存在一个优化过程，旨在找到使模型均方误差最小化的系数。这与第 4 章中讨论的方法是相同的。\n\
  \n请记住，系数和超参数之间存在重要区别。系数由模型估计，而超参数必须由建模者选择。在 ARMA(p,q) 模型中，p 和 q 是您必须通过图表、性能指标等方式来决定的超参数。\n\
  \n首先，让我们看看如何在 Python 中拟合 ARMA(1,1) 模型。ARMA(1,1) 模型是指一个 AR 分量为 1 阶、MA 分量也为 1 阶的 ARMA\
  \ 模型。请记住，阶数指的是用于解释当前值的历史值的数量。\n\n对于这个阶数为 (1,1) 的首次尝试，选择它只是为了从最简单的 ARMA 模型开始。在整个示例中，您将看到如何微调这个决策。\n\
  \n对太阳黑子数据应用 ARMA(1,1) 模型意味着，您将通过观察今天的实际值（AR 部分）和今天的误差（MA 部分）来预测明天的值。由于阶数仅为 1，您不需要回溯更远的历史数据。\n\
  \n这个模型可以使用清单 5-6 中的代码在 Python 中创建。\n\n```\nfrom sklearn.metrics import r2_score\n\
  from statsmodels.tsa.arima.model import ARIMA\n# 预测第一个 ARMA(1,1) 模型\nmod = ARIMA(list(data['Monthly\
  \ Mean Total Sunspot Number']), order=(1,0,1))\nres = mod.fit()\npred = res.predict()\n\
  print(r2_score(data, pred))\nplt.plot(list(data['Monthly Mean Total Sunspot Number']))\n\
  plt.plot(pred)\nplt.legend(['实际太阳黑子数', '预测太阳黑子数'])\nplt.xlabel('时间步长')\nplt.show()\n\
  清单 5-6\n拟合 ARMA(1,1) 模型\n```\n\n这段代码还会生成一个实际值与拟合值的对比图（图 5-5）。它还会给出模型拟合的 R2 分数。由于您尚未创建训练-测试集划分，此\
  \ R2 分数并不代表任何未来的性能。然而，它可以用来查看当前模型的误差程度：这为您如何改进模型提供了直观感受。在这种情况下，R2 分数为 **0.76**，您可以得出结论：该模型的拟合效果已经相当不错了。\n\
  \n![../images/508548_1_En_5_Chapter/508548_1_En_5_Fig5_HTML.jpg](img/508548_1_En_5_Fig5_HTML.jpg)\n\
  \n图 5-5\n\nARMA(1,1) 模型的实际值与拟合值对比\n\n## 更多模型评估 KPI\n\n作为性能指标的补充，我想借此机会检查更多模型拟合的\
  \ KPI。到目前为止，您已经了解了如何使用增强迪基-富勒检验来帮助您决定差分阶数，以及如何使用 ACF 和 PACF 图来帮助您决定所需的模型类型（AR 与\
  \ MA）并帮助您选择最佳阶数。您还了解了将训练-测试集划分与超参数搜索相结合，以识别最大化样本外性能的阶数。\n\n另一个可以帮助您评估模型拟合的 KPI 是查看模型的残差。如果模型拟合良好，您通常会观察到残差服从正态分布。如果发现相反的情况，通常意味着您的模型遗漏了重要信息。\n\
  \n您可以使用清单 5-7 中的代码绘制模型残差的直方图。\n\n```\nax = pd.Series(res.resid).hist()\nax.set_ylabel('出现次数')\n\
  ax.set_xlabel('残差')\nplt.show()\n清单 5-7\n绘制残差直方图\n```\n\n您应该会得到图 5-6 中的图形。\n\n![../images/508548_1_En_5_Chapter/508548_1_En_5_Fig6_HTML.jpg](img/508548_1_En_5_Fig6_HTML.jpg)\n\
  \n图 5-6\n\nARMA(1,1) 模型残差的直方图\n\n您可以通过观察发现，残差的直方图并未遵循**正态分布**的钟形曲线。这意味着可能需要添加一些滞后项，这很合理：您已经知道太阳黑子数据具有\
  \ 11 年的季节性，而目前模型中只包含了一个滞后周期（回溯 1 年）。\n\n注意\n\n有许多不同的方法可以检验变量的分布，包括直方图、QQ 图和众多的假设检验。虽然正态性假设检验在许多情况下很有用，但预测的目标通常是最大化未来性能。为此，并不要求残差完全服从正态分布，在实践中，通过图形方式判断残差的正态性通常就足够了。\n\
  \n在评估了模型残差的正态性之后，您还可以查看模型的汇总表。您可以使用清单 5-8 中的代码获取此汇总表。\n\n```\nres.summary()\n清单\
  \ 5-8\n获取模型拟合的汇总表\n```\n\n您应该会得到如图 5-7 所示的汇总表。\n\n![../images/508548_1_En_5_Chapter/508548_1_En_5_Fig7_HTML.jpg](img/508548_1_En_5_Fig7_HTML.jpg)\n\
  \n图 5-7\n\nARMA(1,1) 模型的汇总表\n\n您可以从该表中获得的重要信息包括**系数的估计值**和相应的 **p 值**。请记住，您正在处理一个\
  \ ARMA(1,1) 模型，因此您将有一个 AR 模型的系数（对应回溯一个时间步的数据点）和一个 MA 模型的系数（对应回溯一个时间步的误差）。\n\n当您在数据上拟合模型时，模型会为这些系数估计出最佳可能值。您可以在表中看到系数的估计值，位于标记为\
  \ **ar.L1** 的行（第一个滞后项的 AR 系数为 **0.7193**）和标记为 **ma.L1** 的行（第一个滞后项的 MA 系数为 **0.5254**）。\n\
  \n您可以通过回顾公式来解释这些值。基本上，这些估计值表明，您可以通过使用 **const** 作为 c，ar.L1 作为系数 *φ*[*i*] (phi)，以及\
  \ ma.L1 作为系数 *θ*[*i*] (theta) 来填充 ARMA 公式，从而预测未来的数据点。填入这些系数将**允许您计算下一个值**。这对于理解您的模型使用哪些信息来预测未来非常有帮助。\n\
  \n\n\n现在你已经知道了系数的估计值，还可以查看这些系数的假设检验。对于每个系数，汇总表会显示一个假设检验，告诉你该系数是否**显著不为零**。如果某个系数为零，则意味着将该参数纳入模型是没有用的。然而，如果假设检验证明某个系数显著不为零，则意味着将该系数添加到模型中是有用的。这有助于你决定在\
  \ ARMA 预测中使用哪个阶数。\n\n假设检验的 p 值可以在系数所在行、**P>|z|** 列下找到。该列给出了假设检验的 p 值。p 值必须**小于 0.05**\
  \ 才能证明该系数显著不为零。\n\n在这种情况下，解释如下：\n\n*   ar.L1 系数的 p 值为 0.000，因此显著。\n*   ma.L1 系数的\
  \ p 值也为 0.000，因此显著。\n*   两者都小于 0.05，因此你可以得出结论，两个系数都应保留在模型中。\n\n可以想象，这在创建模型时是非常有用的信息。你可以在**独立地增加和减少\
  \ AR 和 MA 的阶数**之间来回尝试，并找出系数开始变得不显著（p 值高于 0.05）的点，此时，你将仍然显著的滞后最高阶数作为最佳模型。当然，请记住，显著性只是多个指标中的一个指标。\n\
  \n## 自动超参数调优\n\n尽管这种理论方法可能非常有趣，但你应该将其与预测性能测试结合起来，就像你在第 3 章和第 4 章中使用非常基础的超参数优化方法所做的那样。\n\
  \n如果你还记得，你所做的是创建一个训练-测试集划分，然后遍历超参数的所有可能值，并评估在测试集上的性能。保留在测试集上表现最佳的阶数。\n\n在本部分中，你将通过正式引入网格搜索和交叉验证的概念来对此方法进行补充。\n\
  \n## 网格搜索：为预测性能调优\n\n我特意等到现在才解释**网格搜索**，因为用一个包含两个超参数的例子来解释会更好。在 ARMA 模型中，需要同时优化两个超参数：p\
  \ 和 q。\n\n用于超参数优化的网格搜索的目标是简化选择超参数的任务。你已经看到了多种可以帮助你做出选择的统计工具：\n\n*   自相关函数 (ACF)\n\
  *   偏自相关函数 (PACF)\n*   模型残差\n*   汇总表\n\n面对多个指标，很难决定最佳参数。网格搜索是一种会测试每个**超参数**组合，并评估该超参数组合的预测误差的方法。这将为你提供一个关于哪些超参数能获得最佳性能的客观估计。\n\
  \n网格搜索的一个基本方法是创建一个**训练-测试集划分**，然后在训练集上使用每个超参数组合拟合模型，并在测试集上评估模型。在实践中，网格搜索通常与**交叉验证**结合使用。正如你在第\
  \ 2 章中所见，交叉验证是对训练-测试集划分方法的增强，其中训练-测试集划分会重复多次。这会产生更可靠的误差估计。\n\n要应用带交叉验证的网格搜索，你需要实现一个循环，遍历每个超参数组合（在本例中为\
  \ p 和 q）。对于每个组合，代码会将数据分割成多个**交叉验证划分**：多个训练-测试集划分的组合。这些划分也称为折。对于每个折，你在训练集上训练模型，并在测试集上测试模型。这会为每个折产生一个误差，取这些误差的平均值，即可得到每个超参数组合的误差。具有最佳误差的超参数组合将是你为预测保留的模型。\n\
  \n清单 5-9 展示了如何在代码中实现这一点。\n\n```\nimport numpy as np\nfrom sklearn.model_selection\
  \ import TimeSeriesSplit\ndata_array = data.values\navg_errors = []\nfor p in range(13):\n\
  for q in range(13):\nerrors = []\ntscv = TimeSeriesSplit(test_size=10)\nfor train_index,\
  \ test_index in tscv.split(data_array):\nX_train, X_test = data_array[train_index],\
  \ data_array[test_index]\nX_test_orig = X_test\nfcst = []\nfor step in range(10):\n\
  try:\nmod = ARIMA(X_train, order=(p,0,q))\nres = mod.fit()\nfcst.append(res.forecast(steps=1))\n\
  except:\nprint('errorred')\nfcst.append(-9999999.)\nX_train = np.concatenate((X_train,\
  \ X_test[0:1,:]))\nX_test = X_test[1:]\nerrors.append(r2_score(X_test_orig, fcst))\n\
  pq_result = [p, q, np.mean(errors)]\nprint(pq_result)\navg_errors.append(pq_result)\n\
  avg_errors = pd.DataFrame(avg_errors)\navg_errors.columns = ['p', 'q', 'error']\n\
  result = avg_errors.pivot(index='p', columns='q')\nListing 5-9\nGrid search with\
  \ cross-validation for optimal p and q\n```\n\n网格搜索的结果是一个表格，其中包含在你指定的范围内（0 到 11\
  \ 之间）每个 p 和 q 组合的估计误差。得益于交叉验证方法，你可以对这个误差估计充满信心：毕竟，它是五个独立误差测量的平均值，这使得因有利的测试集选择而产生任何偏差的可能性很小。你可以在图\
  \ 5-8 中看到结果表格。\n\n![../images/508548_1_En_5_Chapter/508548_1_En_5_Fig8_HTML.jpg](img/508548_1_En_5_Fig8_HTML.jpg)\n\
  \n图 5-8\n\n每个 p 和 q 组合的 R2 分数表\n\n产生最佳 R2 分数的组合是 **p = 10 和 q = 9** 的组合，其在测试集上产生的估计\
  \ R2 分数为 **0.84**。作为最后一步，你可以在训练-测试集划分上重新拟合模型，并将其绘制在训练-测试集上，以查看此误差的样子。这在清单 5-10 中完成，并应为你提供图\
  \ 5-9 中显示的图形。\n\n![../images/508548_1_En_5_Chapter/508548_1_En_5_Fig9_HTML.jpg](img/508548_1_En_5_Fig9_HTML.jpg)\n\
  \n图 5-9\n\n最终模型在测试集上的预测\n\n```\ndata_array = data.values\nX_train, X_test = data_array[:-10],\
  \ data_array[-10:]\nX_test_orig = X_test\nfcst = []\nfor step in range(10):\nmod\
  \ = ARIMA(X_train, order=(10,0,9))\nres = mod.fit()\nfcst.append(res.forecast(steps=1))\n\
  X_train = np.concatenate((X_train, X_test[0:1,:]))\nX_test = X_test[1:]\nplt.plot(X_test_orig)\n\
  plt.plot(fcst)\nplt.legend(['Actual Sunspots', 'Predicted Sunspots'])\nplt.xlabel('Time\
  \ steps of test data')\nplt.show()\nListing 5-10\nShowing the test prediction of\
  \ the final model\n```\n\n## 关键要点\n\n*   ARMA 模型是自回归模型和移动平均模型的组合。\n*   ARMA 的超参数是\
  \ p 和 q：p 代表自回归阶数，q 代表移动平均阶数。\n*   网格搜索是优化超参数选择的常用工具。它可以与交叉验证结合使用，以产生更可靠的误差估计。\n\
  *   你可以使用残差的分布来评估模型的拟合度。如果残差不遵循正态分布，通常意味着模型设定有问题。\n*   你可以使用模型汇总表查看模型拟合的详细指标。你还可以找到模型系数的估计值，以及检验模型系数是否为零的假设检验。\n\
  \n\n\n"
- "# 6. ARIMA 模型\n\n在了解了单变量时间序列的几个基本构建模块后，本章将介绍一个整合了更多时间序列组件的模型：ARIMA 模型。\n\n为了追踪这些不同的构建模块，让我们回到时间序列组件表（表\
  \ 6-1），看看 ARIMA 模型所处的位置。\n\n表 6-1\n\n单变量时间序列的构建模块\n\n| 名称 | 解释 | 章节 |\n| --- | ---\
  \ | --- |\n| AR | 自回归 | 3 |\n| MA | 移动平均 | 4 |\n| ARMA | AR 和 MA 模型的组合 | 5 |\n|\
  \ ARIMA | 在 ARMA 模型中加入差分 (I) | 6 |\n| SARIMA | 在 ARIMA 模型中加入季节性 (S) | 7 |\n| SARIMAX\
  \ | 在 SARIMA 模型中加入外部变量 (X) *(注意：加入外部变量后，模型不再是单变量)* | 8 |\n\n如你所见，ARIMA 已经非常接近最终模型了。唯一尚未包含的部分是\
  \ S（季节性）和 X（外部变量）。某些时间序列过程既没有季节性也没有外部变量，这使得 ARIMA 经常被用作一个独立的模型。\n\n在实践中，如果你在处理单变量时间序列，并且对季节性没有预期，通常会直接使用\
  \ ARIMA；如果预期存在季节性，则会直接使用 SARIMA（这将在下一章中介绍）。\n\n## ARIMA 模型定义\n\nARIMA 模型是一个结合了 AR\
  \ 和 MA 构建模块的模型，正如你在上一章中看到的 ARMA 模型一样。ARIMA 的额外之处在于“I”这个构建模块，它代表**非平稳时间序列的自动差分**。\n\
  \n你应该还记得，在之前的章节中，平稳性被介绍为时间序列中的一个重要概念。平稳时间序列是指没有长期趋势的时间序列。如果一个时间序列不是平稳的，你可以通过应用差分使其变得平稳：用实际值与前一时刻值的差来替换实际值。\n\
  \nARIMA 中的“I”代表**整合**。整合是对非平稳时间序列进行差分的更数学化的同义词。在 ARIMA 中，这种差分不再是在建模阶段之前进行，而是在模型拟合过程中完成。\n\
  \n## 模型定义\n\nARIMA 模型是自回归整合移动平均模型（Autoregressive Integrated Moving Average model）的简称。它与\
  \ ARMA 模型的区别很小：只是增加了一个使时间序列变得非平稳的额外效应。一个简单的例子是线性增长趋势，如下式所示：\n\n![$$ {X}_t=c+{\\\
  varepsilon}_t+\\sum \\limits_{i=1}^p{\\varphi}_i{X}_{t-i}+\\sum \\limits_{i=1}^q{\\\
  theta}_i{\\varepsilon}_{t-i}+\\delta t $$](img/508548_1_En_6_Chapter_TeX_Equa.png)\n\
  \n当你对一个时间序列进行差分时，实际上是在建模从一个时间步到下一个时间步的差异，而不是原始值。如果变量的实际值随时间不稳定，那么这些差值仍然有可能随时间保持稳定。\n\
  \n线性趋势就是一个很好的例子。想象一个从 0 开始，每个时间步增加 2 的线性趋势。这些值将完全不是平稳的：它们会无限增大。然而，每个值与下一个值之间的差值始终是\
  \ 2，因此差分后的时间序列是完全平稳的。\n\n## ARIMA 在 CO2 示例中的应用\n\n差分作为超参数的一部分，为模型构建带来了巨大的附加价值。这使得可以对应该进行差分的次数进行自动超参数调优。让我们通过一个例子来看看。\n\
  \n本例中的数据是每周的 CO2 数据，可通过 `statsmodels` 库获取。你可以使用清单 6-1 中的代码获取这些数据。\n\n```\nimport\
  \ statsmodels.api as sm\ndata = sm.datasets.co2.load_pandas()\ndata = data.data\n\
  data.head()\n清单 6-1\n导入数据\n```\n\n为了解你正在处理的数据，像往常一样，最好绘制一个数据随时间变化的图。使用清单 6-2 中的代码可以得到图\
  \ 6-1 中的图形。\n\n![../images/508548_1_En_6_Chapter/508548_1_En_6_Fig1_HTML.jpg](img/508548_1_En_6_Fig1_HTML.jpg)\n\
  \n图 6-1\n\nCO2 数据随时间变化的图\n\n```\nimport matplotlib.pyplot as plt\nax = data.plot()\n\
  ax.set_ylabel('CO2 level')\nplt.show()\n清单 6-2\n绘制数据图\n```\n\n这些数据显示出非常明显的上升趋势，且相当稳定。同时，这些数据中也有非常清晰的季节性模式（上下波动）。\n\
  \n现在回想一下，根据前几章的内容，通常首先要查看的是自相关和偏自相关函数。请记住，自相关（ACF）和偏自相关（PACF）图仅适用于平稳数据。你可以使用清单 6-3\
  \ 直接在差分后的数据上创建 ACF 和 PACF 图。\n\n```\nfrom statsmodels.graphics.tsaplots import plot_acf,\
  \ plot_pacf\nplot_acf(data.diff().dropna(), lags=40)\nplot_pacf(data.diff().dropna(),\
  \ lags=40)\nplt.show()\n清单 6-3\nACF 和 PACF 图\n```\n\n你应该会得到图 6-2 所示的 ACF 图和图 6-3\
  \ 所示的 PACF 图。\n\n![../images/508548_1_En_6_Chapter/508548_1_En_6_Fig3_HTML.jpg](img/508548_1_En_6_Fig3_HTML.jpg)\n\
  \n图 6-3\n\n偏自相关函数图\n\n![../images/508548_1_En_6_Chapter/508548_1_En_6_Fig2_HTML.jpg](img/508548_1_En_6_Fig2_HTML.jpg)\n\
  \n图 6-2\n\n自相关函数图\n\n有趣的是，自相关和偏自相关中有许多滞后值。这意味着什么？通常，如果相关性没有衰减到零，则意味着数据不是平稳的。然而，数据已经过差分，看起来是平稳的。\n\
  \n这里的答案是，衰减发生在自相关中相对较晚的位置。ACF 和 PACF 图有 40 个滞后，但对于当前示例来说还不够。你可以使用清单 6-4 获取回溯更远的\
  \ ACF 和 PACF 图，你会观察到存在向零的衰减。相应的图分别显示在图 6-4 和图 6-5 中。\n\n![../images/508548_1_En_6_Chapter/508548_1_En_6_Fig5_HTML.jpg](img/508548_1_En_6_Fig5_HTML.jpg)\n\
  \n图 6-5\n\n具有 600 个滞后的偏自相关函数图\n\n![../images/508548_1_En_6_Chapter/508548_1_En_6_Fig4_HTML.jpg](img/508548_1_En_6_Fig4_HTML.jpg)\n\
  \n图 6-4\n\n具有 600 个滞后的自相关函数图\n\n```\nplot_acf(data.diff().dropna(), lags=600)\n\
  plot_pacf(data.diff().dropna(), lags=600)\nplt.show()\n清单 6-4\n具有更多滞后的 ACF 和 PACF\
  \ 图\n```\n\n这使得它成为探讨模型阶数问题的一个有趣案例。让我们看看如何通过将 I 作为第三个超参数添加到优化中，来增强上一章的网格搜索交叉验证。相关代码见清单\
  \ 6-5。\n\n\n\n```\nimport pandas as pd\nfrom statsmodels.tsa.arima.model import\
  \ ARIMA\nfrom sklearn.metrics import r2_score\nimport numpy as np\nfrom sklearn.model_selection\
  \ import TimeSeriesSplit\ndata_array = data[['co2']].values\navg_errors = []\nfor\
  \ p in range(6):\nfor q in range(6):\nfor i in range(3):\nerrors = []\ntscv = TimeSeriesSplit(test_size=10)\n\
  for train_index, test_index in tscv.split(data_array):\nX_train, X_test = data_array[train_index],\
  \ data_array[test_index]\nX_test_orig = X_test\nfcst = []\nfor step in range(10):\n\
  try:\nmod = ARIMA(X_train, order=(p,i,q))\nres = mod.fit()\nfcst.append(res.forecast(steps=1))\n\
  except:\nprint('errorred')\nfcst.append(-9999999.)\nX_train = np.concatenate((X_train,\
  \ X_test[0:1,:]))\nX_test = X_test[1:]\nerrors.append(r2_score(X_test_orig, fcst))\n\
  pq_result = [p, i, q, np.mean(errors)]\nprint(pq_result)\navg_errors.append(pq_result)\n\
  avg_errors = pd.DataFrame(avg_errors)\navg_errors.columns = ['p', 'i', 'q', 'error']\n\
  avg_errors.sort_values('error', ascending=False)\n代码清单 6-5\n超参数调优\n```\n\n这段代码的运行结果将为你提供一个按\
  \ R2 分数排序的数据框。最佳的 R2 分数是 **0.741**，该分数由 **p = 4、q = 4** 和 **I = 1** 的组合获得。这意味着存在一个\
  \ 4 阶的自回归效应和一个 4 阶的移动平均效应。数据必须进行一次差分。代码清单 6-6 展示了如何显示模型的测试拟合结果，对应的图表如图 6-6 所示。\n\
  \n![../images/508548_1_En_6_Chapter/508548_1_En_6_Fig6_HTML.jpg](img/508548_1_En_6_Fig6_HTML.jpg)\n\
  \n图 6-6\n\n最佳预测结果\n\n```\nX_train, X_test = data_array[:-10], data_array[-10:]\n\
  X_test_orig = X_test\nfcst = []\nfor step in range(10):\nmod = ARIMA(X_train, order=(4,1,4))\n\
  res = mod.fit()\nfcst.append(res.forecast(steps=1))\nX_train = np.concatenate((X_train,\
  \ X_test[0:1,:]))\nX_test = X_test[1:]\nplt.plot(fcst)\nplt.plot(X_test_orig)\n\
  plt.legend(['Predicted', 'Actual'])\nplt.ylabel('CO2 Level')\nplt.xlabel('Time Step\
  \ of Test Data')\nplt.show()\n代码清单 6-6\n绘制最终结果\n```\n\n## 关键要点\n\n*   ARIMA 模型结合了三种效应：\n\
  \    *   AR 过程，基于过去值与当前值之间的自相关\n\n    *   MA 过程，基于过去误差与当前值之间的相关关系\n\n    *   若时间序列非平稳，则自动进行差分整合\n\
  \n*   ARIMA(p,I,q) 模型有三个超参数：\n    *   AR 过程的阶数，用 p 表示\n\n    *   MA 过程的阶数，用 q 表示\n\
  \n    *   差分阶数，用 I 表示（某些记法中写作 d）\n\n"
- "# 7. SARIMA 模型\n\n在本章中，你将了解单变量时间序列模型的最终模型：SARIMA 模型。本章将汇集单变量时间序列的所有内容。\n\n## 单变量时间序列模型分解\n\
  \n借助前几章介绍的 ARIMA 组件，你现在可以对自回归过程、移动平均组件以及差分整合进行建模。但时间序列中一个常见的过程仍未涉及：**季节性**。\n\n\
  让我们看一下单变量时间序列分解表，了解其位置（表 7-1）。你可以看到，比 SARIMA 模型更复杂的模型只有一个：SARIMAX 模型。\n\n表 7-1\n\
  \n单变量时间序列的构建模块\n\n| 名称 | 说明 | 章节 |\n| --- | --- | --- |\n| AR | 自回归 | 3 |\n| MA\
  \ | 移动平均 | 4 |\n| ARMA | AR 与 MA 模型的组合 | 5 |\n| ARIMA | 在 ARMA 模型中加入差分（I） | 6 |\n\
  | SARIMA | 在 ARIMA 模型中加入季节性（S） | 7 |\n| SARIMAX | 在 SARIMA 模型中加入外部变量（X）*（注意：加入外部变量后，模型不再是单变量模型）*\
  \ | 8 |\n\nSARIMAX 模型与 SARIMA 模型有很大不同：它使用与目标变量相关的外部变量。这也使得 SARIMAX 成为一个非常强大的工具，但仅在你拥有外部变量时才能应用。使用外部变量会使模型不再是单变量时间序列模型。\n\
  \nSARIMA 模型的优势在于它仅需使用目标变量的历史数据，这使其可应用于非常多的预测场景。在单变量时间序列建模中，SARIMA 模型是最完整的模型，它综合运用了\
  \ AR、MA、趋势建模的差分整合以及季节性。\n\n## SARIMA 模型定义\n\nSARIMA 模型将多种不同的过程结合在同一个模型中。因此，其模型定义在数学上相对复杂。以下是\
  \ SARIMA 模型的定义方程：\n\n![$$ {\\displaystyle \\begin{array}{c}{y}_t={u}_t+{\\eta}_t\\\
  \\ {}{\\varphi}_p(L){\\tilde{\\phi}}_p\\left({L}^s\\right){\\varDelta}^d{\\varDelta}_s^D{u}_t=A(t)+{\\\
  theta}_q(L){\\tilde{\\theta}}_Q\\left({L}^s\\right){\\zeta}_t\\end{array}} $$](img/508548_1_En_7_Chapter_TeX_Equa.png)\n\
  \n在该模型中，你可以观察到以下部分：\n\n*   常规 AR 部分，系数为 *φ*[*p*]（小写 phi）\n\n*   季节性 AR 部分，系数为 ![$$\
  \ {\\overset{\\sim }{\\phi}}_P $$](img/508548_1_En_7_Chapter_TeX_IEq1.png)（大写 phi）\n\
  \n*   常规 MA 部分，系数为 *θ*[*q*]（小写 theta）\n\n*   季节性 MA 部分，系数为 ![$$ {\\overset{\\sim\
  \ }{\\theta}}_Q $$](img/508548_1_En_7_Chapter_TeX_IEq2.png)（大写 theta）\n\n*   常规差分部分，由阶数\
  \ d 表示\n\n*   季节性差分部分，由阶数 D 表示\n\n*   季节性周期系数 s\n\n如你所见，在 ARIMA 模型中加入季节性使得模型复杂得多。季节性并非仅仅是在先前模型上增加一个构建模块，而是为每个构建模块都增加了季节性部分。这也使得\
  \ SARIMA 模型的滞后阶数选择变得更加困难。之前相同的超参数仍需确定：\n\n*   p 表示 AR 阶数\n\n*   q 表示 MA 阶数\n\n*\
  \   I 表示差分阶数\n\n在此基础上，又增加了三个阶数：\n\n*   P 表示季节性 AR 阶数\n\n*   Q 表示季节性 MA 阶数\n\n* \
  \  D 表示季节性差分阶数\n\n最后，还需要选择参数 **s，即季节性周期**。这个 s 不像其他阶数那样是一个超参数。s 不应通过网格搜索来测试，而应基于逻辑来确定。s\
  \ 是季节性的周期。如果你处理的是月度数据，应选择 12；如果是周度数据，应选择 52；以此类推。\n\n\n\n## 示例：沃尔玛销售额的 SARIMA 模型\n\
  \n在本章中，你将把 SARIMA 模型应用于 Kaggle 上提供的沃尔玛销售预测数据集（[`www.kaggle.com/c/walmart-recruiting-store-sales-forecasting/`](http://www.kaggle.com/c/walmart-recruiting-store-sales-forecasting/)）。\n\
  \n让我们用 Python 获取这些数据，并通过清单 7-1 初步了解其内容。请注意，沃尔玛数据包含许多门店和产品，但在此练习中，你将使用每周数据的总和。\n\n\
  ```\nimport pandas as pd\nimport matplotlib.pyplot as plt\ndata = pd.read_csv('train.csv')\n\
  data = data.groupby('Date').sum()\nax = data['Weekly_Sales'].plot()\nax.set_ylabel('Weekly\
