  ## 结论


  那么这给我们带来了什么？最好的 RNN 是三层 GRU，紧随其后的是三层 LSTM 和单层 LSTM。分数的差异清楚地说明了为什么 SimpleRNN 层不再被广泛使用。GRU
  和 LSTM 是两种在预测任务中表现良好的 RNN 模型。


  LSTM 模型相对于 GRU 的优势在于能够拟合更长期的趋势。GRU 性能更好的一个假设原因是数据不包含非常长期的趋势，因为数据被重新处理，使得每一行数据只包含过去
  36 小时的数据。


  在实际建模时，运行像本例中这样的基准测试是非常常见的。重要的是掌握不同的模型，以便能够有效地调整和基准测试它们。之后，决策应基于基准测试期间的性能客观做出。在这种情况下，获胜的不是更新的
  LSTM，而是 GRU。




  ## 关键要点


  *   LSTM 是最先进的 RNN 类型，因为它拥有大量组件，使其能够记住更长期的趋势。


  *   你已经看到了一个如何在同一个数据集上对多个模型进行模型基准测试的示例。这在应用机器学习中至关重要。


  *   你还看到了一个如何解读和处理显示损失下降的神经网络历史图的示例。你可以利用它们来推断模型的学习方式以及如何改进。


  '
- "# 19. Prophet 模型\n\n在本章中，你将了解 **Prophet 模型**，该模型由 Facebook 开源。它严格来说并非一个模型，而是一种构建预测模型的*自动化流程*。\n\
  \n你会注意到，使用此模型与使用 Keras 有很大不同，因为 Prophet 模型为你完成了大部分工作。它的用户友好性更高：与之前的章节不同，它不需要任何理论知识即可上手。\n\
  \n这样做的一个缺点可能是，你理解模型究竟如何学习以及学习什么的可能性较少。可调整的参数也更少，如果模型有效，这可能是一个优势；但如果无法达到所需的模型精度，这可能就是一个劣势。\n\
  \n来自开发者的一段话解释了 Facebook Prophet 的目标：\n\n> *我们使用一个简单、模块化的回归模型，该模型在默认参数下通常表现良好，并且允许分析师选择与其预测问题相关的组件，并根据需要轻松进行调整。第二个组件是一个用于衡量和跟踪预测准确性的系统，并标记需要手动检查的预测，以帮助分析师进行增量改进。*\n\
  > \n> —[`https://peerj.com/preprints/3190/`](https://peerj.com/preprints/3190/)\n\
  \n由于 Facebook 的 Prophet 是一个流程而非实际模型，因此它并没有贡献某一特定的数学理论部分。有用的是不同过程的组合以及其背后的自动化调优方式。让我们直接进入一个示例，探索共同构成\
  \ Facebook Prophet 的不同组件。\n\n## 示例\n\n在本示例中，我们将使用来自一个 Kaggle 竞赛的数据集，该竞赛旨在预测餐厅访客数量。你可以从使用此数据集的竞赛的\
  \ Kaggle 页面下载数据：[`www.kaggle.com/c/recruit-restaurant-visitor-forecasting`](http://www.kaggle.com/c/recruit-restaurant-visitor-forecasting)。你需要从该页面获取以下数据集：'air_visit_data.csv.zip'、'date_info.csv.zip'\
  \ 和 'air_reserve.csv.zip'。\n\n我们将使用 Prophet，并且 **Prophet 只能进行单变量预测**。如果你还记得之前的内容，这意味着\
  \ Prophet 仅使用一个因变量进行预测。如果你想适应多变量预测，你需要为每个因变量分别训练一个 Prophet 模型。因此，我们将对所有餐厅的总和进行组合预测。你可以使用代码清单\
  \ 19-1 准备因变量的数据。\n\n```\nimport pandas as pd\ny = pd.read_csv('air_visit_data.csv.zip')\n\
  y = y.pivot(index='visit_date', columns='air_store_id')['visitors']\ny = y.fillna(0)\n\
  y = pd.DataFrame(y.sum(axis=1))\n代码清单 19-1\n准备因变量\n```\n\n## Prophet 数据格式\n\n在构建\
  \ Prophet 模型时，你总是必须拥有一个包含 'ds' 和 'y' 列的数据集。这是模型识别日期列（'ds'）和因变量（'y'）的方式。你可以使用代码清单\
  \ 19-2 创建此格式。\n\n```\ny = y.reset_index(drop=False)\ny.columns = ['ds', 'y']\n代码清单\
  \ 19-2\n准备建模数据框\n```\n\n我们还将通过将最后 28 天放入测试集来添加一个训练-测试分割。这可以使用代码清单 19-3 完成。\n\n```\n\
  train = y.iloc[:450,:]\ntest = y.iloc[450:,:]\n代码清单 19-3\n创建训练-测试分割\n```\n\n## 基础\
  \ Prophet 模型\n\n拥有一个包含两个正确列名的数据框就是你开始创建基础 Prophet 模型所需的全部。建模过程与 scikit-learn 没有太大区别，因此你应该相当熟悉。你可以使用代码清单\
  \ 19-4 创建并拟合一个基础模型。\n\n```\nfrom fbprophet import Prophet\nm = Prophet()\nm.fit(train)\n\
  代码清单 19-4\n创建基础 Prophet 模型\n```\n\n模型拟合后，你需要进行预测。为了进行预测，你可以使用 Prophet 函数创建一个未来数据框，该数据框将作为预测函数的输入。然后，你可以使用\
  \ predict 方法进行预测。代码清单 19-5 展示了如何操作。\n\n```\nfuture = m.make_future_dataframe(periods=len(test))\n\
  forecast = m.predict(future)\n代码清单 19-5\n进行预测\n```\n\n为了评估此预测的质量，让我们使用代码清单 19-6\
  \ 计算测试数据上的 R2 分数。一旦你做出预测，你将获得一个数据框，其中 **'yhat'** 列包含预测值。\n\n```\nfrom sklearn.metrics\
  \ import r2_score\nprint(r2_score(list(test['y']), list(forecast.loc[450:,'yhat']\
  \ )))\n代码清单 19-6\n计算 R2 分数\n```\n\n这个基础 Prophet 模型获得了 **0.808** 的 R2 分数。这已经相当不错了！让我们通过绘制预测值与测试数据的对比图来看看模型的拟合情况。该图使用代码清单\
