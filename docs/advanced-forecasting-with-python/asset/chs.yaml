- '# 1. 预测模型


  预测，粗略地翻译为预测未来的任务，在人类社会中已经存在了很长时间。无论是通过占卜师、天气预报还是算法股票交易，人类一直对预测未来会发生什么感兴趣。


  然而，预测未来并不容易。想想占卜师、股市大师或天气预报员：许多人试图预测未来，但很少有人成功。而对于那些成功的人，你永远不知道那是运气还是技巧。


  近年来，计算机的计算能力比 30 年前变得普遍得多。这引发了人工智能的巨大繁荣。人工智能，尤其是机器学习，可用于广泛的任务，包括机器人技术、自动驾驶汽车，以及预测——前提是你有足够多的关于过去的数据，可以将其投射到未来。


  在本书中，你将学习与现代预测相关的机器学习技术。我将介绍大量的机器学习模型，并附上对模型的直观解释、其数学原理以及一个应用案例。


  本书的目标是让你真正深入了解这些机器学习模型的应用。你将看到应用于真实数据集的完整示例，以及对结果的诚实评估：有些成功，有些不那么成功。


  通过这种方式，本书不同于许多其他资源，后者通常展示在模拟数据上完美拟合的用例。要学习现实世界中的机器学习和预测，了解模型如何工作固然重要，但更重要的是知道如何诚实、客观地评估模型。这种务实的观点将贯穿各章节。


  ## 本书阅读指南


  在深入探讨本书中的不同模型之前，我将首先概述机器学习领域：存在许多类型和系列的模型。每种模型都有其应用。在开始之前，了解机器学习中存在的模型类型以及哪些与预测相关是很重要的。


  之后，我将介绍评估预测模型的几种策略和指标。在实践之前理解客观评估很重要：你需要在开始实践之前了解你的目标。


  本书的其余章节将分别介绍一个特定模型，包括对模型的直观解释、其数学定义以及在真实数据集上的应用。你将从常见但简单的方法开始，逐步学习到市场上最新、最先进的方法。


  ## 机器学习领域


  在深入了解细节之前，先掌握机器学习模型的全局图景，将有助于你理解不同模型之间的比较，并帮助你在整本书中保持全局观。你首先会看到单变量时间序列和监督回归模型：预测模型的主要类别。之后，你将看到对与预测相关性较低的机器学习技术的简要描述。


  ### 单变量时间序列模型


  我想谈的第一类机器学习模型是时间序列模型。尽管单变量时间序列已经存在很长时间，但它们仍在使用。它们也构成了几种最先进技术的重要基础。它们是任何预测者都应熟悉的经典技术。


  时间序列模型是仅通过观察变量自身的历史发展来对该变量进行预测的模型。这意味着，与其他模型家族不同，时间序列模型并不试图描述变量之间的任何“逻辑”关系。它们不试图解释趋势或季节性的“原因”，而只是对过去应用一个数学公式，并试图将其投射到未来。


  时间序列建模有时因这种“缺乏科学性”而受到批评。但由于其性能，时间序列模型在预测中占据了重要地位，不容忽视。



  #### 时间序列方法快速示例


  让我们看一个超级简单、纯假设性的例子：预测一个名为 X 的虚构城市中一杯咖啡的平均价格。假设有人花了 90 年时间，以五年为间隔收集了这个城镇的咖啡平均价格，并由此得到了表
  1-1 中的数据。


  表 1-1


  一个假设性示例：历年一杯咖啡的价格


  | 年份 | 平均价格 |

  | --- | --- |

  | 1960 | 0.80 |

  | 1965 | 1.00 |

  | 1970 | 1.20 |

  | 1975 | 1.40 |

  | 1980 | 1.60 |

  | 1985 | 1.80 |

  | 1990 | 2.00 |

  | 1995 | 2.20 |

  | 2000 | 2.40 |

  | 2005 | 2.60 |

  | 2010 | 2.80 |

  | 2015 | 3.00 |

  | 2020 | 3.20 |


  这些虚构数据清晰地显示，价格每五年上涨 20 美分。这是一个**线性增长趋势**：线性是因为每年增长幅度相同，增长是因为数值变得越来越大而非越来越小。


  让我们将这些数据导入 Python，看看如何使用清单 1-1 绘制这个线性增长趋势。本书的源代码可通过图书产品页面在 GitHub 上获取，网址为[`www.apress.com/978-1-4842-7149-0`](http://www.apress.com/978-1-4842-7149-0)。请注意，库导入操作每章只执行一次。


  ```

  import pandas as pd

  import matplotlib.pyplot as plt

  years = [1965, 1970, 1975, 1980, 1985, 1990, 1995, 2000, 2005, 2010, 2015, 2020]

  prices = [1.00, 1.20, 1.40, 1.60, 1.80, 2.00, 2.20, 2.40, 2.60, 2.80, 3.00, 3.20]

  data = pd.DataFrame({

  ''year'' : years,

  ''prices'': prices

  })

  ax = data.plot.line(x=''year'')

  ax.set_title(''Coffee Price Over Time'', fontsize=16)

  plt.show()

  清单 1-1

  将咖啡示例导入 Python 并绘制趋势图

  ```


