  该模型获得的 R2 分数为 **0.872**。请注意，由于不可控的随机性，你的结果可能会有所不同。这个 R2 分数优于未添加额外回归变量的模型，因此我们继续在数据集中保留这些变量。


  注意


  通常，在 CPU 与 GPU 上运行模型，或使用分布式计算时，很难控制随机性。这可能是一个缺点，但 GPU 和分布式计算能显著加快执行速度，因此牺牲对随机性的控制通常是值得的。毕竟，至少在理论上，随机性不应在获得良好结果中扮演关键角色。当结果不一致时，最好的做法是多次运行测试，并尝试评估你观察到的变化幅度。如果这种变化过大，导致预测不可靠，你始终可以切换到更简单的模型，或尝试调整模型使其更稳定。


  ## DeepAR 的超参数


  现在，我们来研究一些超参数，看看如何调整这个模型。我们将把三个超参数放入一个小型网格搜索循环中，观察它们是否能提升 R2 分数：


  *   `learning_rate`


  *   `num_layers`：RNN 层数（默认值：2）


  *   `num_cells`：每层 RNN 的单元数（默认值：40）


  你可以使用代码清单 20-9 来遍历这三个超参数的一组选定值。


  ```

  np.random.seed(7)

  mx.random.seed(7)

  results = []

  for learning_rate in [1e-4, 1e-2]:

  for num_layers in [2, 5]:

  for num_cells in [30, 100]:

  estimator = DeepAREstimator(

  prediction_length=28,

  freq=''H'',

  trainer=Trainer(ctx="gpu", # 如果在 Windows 上运行，请移除该参数

  epochs=10,

  learning_rate=learning_rate,

  num_batches_per_epoch=100

  ),

  num_layers = num_layers,

  num_cells = num_cells,

  )

  predictor = estimator.train(train_ds)

  predictions = predictor.predict(test_ds)

  r2 = r2_score(list(predictions)[0].quantile(0.5), list(test_ds)[0][''target''][-28:])

  result = [learning_rate, num_layers, num_cells, r2]

  print(result)

  results.append(result)

  代码清单 20-9

  调整超参数

  ```


  此次网格搜索得出的最佳模型，其学习率为 **0.01**，包含**两层** RNN 层，每层有 **100** 个单元。该模型获得的 R2 分数为 **0.874**。


  这个超参数搜索特意设计得相对简短，因为模型运行需要相当长的时间。作为更通用的指导，以下是根据 DeepAR 相关文献，你可以尝试调整的所有超参数概览：


  *   `learning_rate` 介于 1e-5 和 1e-1 之间


  *   `num_layers` 介于 1 和 8 之间（默认值：2）


  *   `num_cells` 介于 30 和 200 之间（默认值：40）


  *   `epochs` 介于 1 和 1000 之间


  *   `context_length`：在计算预测之前展开 RNN 的步数，介于 1 和 200 之间（默认值：无）


  *   `dropout_rate`：Dropout 正则化参数，介于 0 和 0.2 之间（默认值：0.1）




  ## 基准测试与结论


  现在，使用 DeepAR，你能够获得 **0.874** 的 R2 分数。这很不错，但并未超越经过最佳调优的 Facebook Prophet 模型，后者取得了
  **0.928** 的分数。


  我们在 DeepAR 中观察到一个难点：该模型中的随机性难以控制。在进行预测时，DeepAR 会生成大量潜在轨迹，这些轨迹的中位数可作为最终预测值。然而，当第二次运行代码时，这些轨迹并不相同，因此它们的中位数也会略有差异。这可以被视为
  DeepAR 的一个缺点。


  如果你想使用该模型进行精确预测，就需要彻底分析模型的变异性。DeepAR 是一个强大的模型，也可以作为一个出色的分析工具。获取大量轨迹还能为你提供非常有用的概率边界。在某些情况下，理解可能发生的不同情景，可能比获得一个最精确的预测更有价值。


  例如，假设你正在预测餐厅的客流量，以估算是否有足够利润开设第二家分店。在这种情况下，了解客流量的下限可能非常有价值。如果在这种低客流情景下你会破产，那么你就知道选择开这家餐厅将承担巨大风险。


  为了进行精确预测，还有其他因素需要考虑：DeepAR 比 Prophet 更适合进行多变量预测。这一点并未包含在基准测试中，因为 Prophet 根本无法实现。使用
  Prophet，你需要为每个时间序列开发和调优一个模型，而一个经过调优的 DeepAR 模型可以同时处理所有时间序列。


  在下一章中，我们将对模型基准测试和模型选择进行最终概述，以了解应使用哪些数据和其他决策规则来做出这些决策。


  ## 关键要点


  *   DeepAR 是亚马逊构建的模型，基于 RNN 进行深度预测。

  *   `gluonts` 包通过 `DeepAREstimator` 实现了 DeepAR。

  *   DeepAR 模型可以同时从多个时间序列中学习趋势，并对多个时间序列进行预测。

  *   预测时，它会生成大量潜在轨迹。你可以使用这些轨迹的中位数作为预测值。

  *   DeepAR 具有较大的随机性成分，难以获得可重复的结果。根据你正在处理的具体用例，这可能会成为一个障碍。


  '
- '# 21. 模型选择


  在过去的 18 章中，你看到了可用于预测的一长串机器学习模型。在本章中，你将找到一些关于如何为实际用例决定使用哪个模型的最终思考。


  ## 基于指标的模型选择


  本书以模型指标概述开篇。在后续各章中，基于 R2 分数进行了一些模型基准测试。首先是在第 15 章，将 XGBoost 的性能与 LightGBM 进行了基准比较。另一个基准测试在第
  17 章中呈现，比较了 SimpleRNN、GRU 和 LSTM。


  本书中呈现的基准测试均基于指标。使用这种方法时，有两种通用方法。第一种方法是构建训练数据集和测试数据集。然后，你在训练数据上调优和优化多个模型，之后在测试数据上计算
  R2 分数。选择在测试数据上表现最佳的模型。


  第二种常见的基于指标的模型选择方法是使用交叉验证。当数据量较少时，留出数据作为测试集可能代价高昂，而交叉验证可以成为基于指标进行模型选择的解决方案。使用交叉验证的另一个优点是，每个模型都会被多次训练和测试，因此随机性的影响较小。毕竟，测试结果可能仅仅因为随机选择过程和运气不佳而对某个模型有利。


  然而在实践中，为你的用例选择合适模型时，除了指标之外，还有其他需要考虑的因素。让我们看看其中的一些。


  ## 模型结构与输入


  选择模型时需要考虑的另一件事是，它需要与你数据集的潜在变化相匹配。例如，如果你根据经验知道你的用例中没有自回归效应，那么使用带有自回归组件的模型就没有意义。让我们快速回顾一下本书各章节中可以建模的组件类型。


  我们从**单变量时间序列模型**开始，它允许基于变量自身过去的变化来预测一个变量。当你没有其他数据可用于建模过程时，或者更重要的是，当数据中确实存在**时间序列组件**（如自回归、移动平均等）时，这些模型非常有用。


  之后，我们介绍了**多变量时间序列模型**，它们做同样的事情，但同时应用于多个时间序列。当你需要同时预测多个时间序列时，它们具有优势，因为你只需为多个时间序列构建一个模型，而不是为每个序列构建一个模型。此外，它还可以受益于时间序列之间的共享变化，并在性能上具有优势。


  然后，你了解了如何使用一些经典的**监督式机器学习模型**进行预测。从高层次来看，这些模型都以相同的方式工作。它们将多个输入变量转换为一个目标变量。为了向这些模型添加季节性，你可以将季节性信息转换为输入变量。如果你不仅有目标变量，还有关于未来的其他信息可用于预测，例如，在尝试预测餐厅客流量时使用餐厅预订数量，那么这种类型的模型非常棒。


  接着，我们转向使用多种类型的**神经网络**。我们看到的第一种神经网络是**密集前馈神经网络**。这种神经网络与经典监督式机器学习模型的工作方式非常相似：有输入变量和一个（或多个）目标变量。


  我们看到的其他神经网络是**循环神经网络**。它们非常不同，因为它们是为学习和预测数据序列而设计的。因此，RNN 的输入数据必须准备成序列形式。你也可以将外部变量添加到
  RNN 模型中。


  神经网络在参数化良好时可以非常高效。然而，调优和参数化神经网络可能很困难：这需要开发者投入大量时间，也需要大量的计算时间才能获得良好的结果。


  最后，你了解了来自**大型科技公司**的两种建模技术。你了解了 Facebook 的 Prophet 和亚马逊的 DeepAR。这些模型通常在底层使用神经网络。这些方法试图通过易于使用的界面来自动化复杂技术。


  在某些方面，这是有效的：调优 Prophet 或 DeepAR 比调优神经网络更容易。在其他方面，仍有工作要做：我们已经看到，要获得出色的结果，调优仍然是必要的。因此，它并非完全自动化。


  Prophet 和 DeepAR 也能够同时学习季节性组件和额外数据。Prophet 无法同时建模多个时间序列，而 DeepAR 则可以。




  ## 单步预测 vs. 多步预测


  与模型能否使用额外回归变量相关的问题是模型能否进行多步预测。正如我们所看到的，模型基本上可以分为三类。


  第一类模型根本无法进行多步预测。这类模型在每次预测下一个数据点时，都需要最新的数据点。


  第二类模型可以通过迭代预测值并每次重新进行单步预测来实现多步预测。在这种情况下，模型将预测值作为历史数据点使用，但存在误差不断累积的风险。


  第三类模型可以轻松学习多步预测。在某些情况下，这是通过进行一次多元预测来实现的，其中将每个时间步视为一个新的因变量。另一种方法是学习输入序列与输出序列之间的关系。


  ## 模型复杂度 vs. 收益


  除了模型可使用的指标和变量类型之外，我想回到模型复杂度这个话题。对于某些模型，需要花费很长时间才能让 R² 获得微小的提升。你应该思考，对于你的用例，是否有办法判断某个精度的提升是否仍然值得。例如，在进行销售预测时，花费一年时间将
  R² 提升 0.001 点可能并不值得，但在医疗工作、飞机安全或军事项目中，这可能是完全值得的。


  你必须考虑到，模型调优不仅会耗费建模人员的时间，还会消耗计算时间。例如，长时间运行云计算环境，计算成本可能会变得非常高昂。


  当我们从经典的监督学习模型转向神经网络时，就能看到这类考量。神经网络性能非常强大，能够获得出色的结果。但参数化和优化神经网络架构的复杂度，远高于对例如梯度提升模型进行超参数调优。简而言之，你需要清楚你的
  R² 分数的影响，以确保你的预测对你的用例仍然具有实际意义。


  ## 模型复杂度 vs. 可解释性


  复杂模型的第二个问题是，通常很难理解模型学到了什么。对于单变量时间序列或经典的监督学习模型，提取模型系数或使用其他模型解释工具（如打印决策树或提取变量重要性）相对容易。


  对于更复杂的模型，包括多变量时间序列，但主要是神经网络，要遍历庞大的系数矩阵并以人类可理解的方式理解模型学到了什么，要困难得多。


  对于 Prophet 和 DeepAR 来说，模型的可解释性甚至更差，因为这些模型的黑箱方法使模型构建者离实际学到的技术细节更远了。


  模型的可解释性很重要。作为预测者，你需要对自己的模型有信心。要有信心，你至少应该完全清楚模型在做什么。对于复杂模型，情况往往并非如此，这可能导致非常棘手的局面。


  ## 模型稳定性与变异性


  作为选择预测模型的最后一点思考，我想回到模型稳定性这个问题。在第 20 章中，我们观察到 DeepAR 在给出我们可能期望模型所处的置信区间方面表现出色，但在重复模型训练时，它通常无法重现相同的结果。当你试图做出可靠的预测时，这种模型稳定性问题可能是一个严重的问题。


  在讨论模型过拟合时，模型变异性也很重要。我们已经看到，当模型过拟合时，它们可能会死记硬背地学习训练数据，因此它们不再学习普遍规律，而是学习训练数据中的噪声。


  这也是变异性的一种表现：当你基于建模过程期望得到出色结果，但在实际预测中却得到糟糕结果时，这可能是由于过拟合导致的指标变异性。从某种意义上说，它也是一种模型指标。它可能不是我们通常首先谈论的指标，但在从开发阶段过渡到实际现场预测时，它仍然是一个需要牢记的非常重要的概念。


  ## 结论


  在本书中，你已经了解了如何管理模型基准，以及不同的模型评估技术，包括训练-测试集、交叉验证等。到目前为止，模型性能通常由像 R² 分数这样的指标来定义。这些指标显示了模型在平均情况下的表现。


  平均性能通常是首先考虑的因素，但在本章中，你看到了关于模型选择的一些额外思考，这些思考在模型开发阶段也同样重要。


  在阅读完本书的前 20 章后，你应该已经掌握了使用 Python 进行高效预测所需的所有必要输入。本章提出的这些一般性思考应该能帮助你避免一些容易犯但很重要的错误。


  毕竟，当你构建一个预测模型时，最重要的不是它是否只适用于你的训练数据，甚至也不是它是否适用于你的测试数据。在实际应用中，唯一重要的是你对未来的预测是否成真。


  ## 关键要点


  *   模型指标通常告诉我们模型在平均情况下是否良好。


  *   模型变异性告诉我们模型的质量指标是否存在很大波动，例如，当我们在略有不同的数据集上重新训练模型时。


  *   更复杂的模型有时能提供更好的模型指标，但通常伴随着建模时间、计算成本的增加，以及模型可解释性降低的代价。


  *   在选择模型类型时，你应该考虑你使用的模型是否能够拟合你理论上预期数据集中存在的各种效应，包括添加额外回归变量的可能性以及进行多步预测的可能性。




