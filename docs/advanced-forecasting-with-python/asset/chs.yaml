  \n图 19-5\n\n包含假日的 Prophet 分解图\n\n## 为 Prophet 添加额外回归变量\n\n数据集中还有一个包含预订信息的文件。当然，我们可以预期预订量是预测餐厅访客数量的一个很好的额外变量。你可以很容易地向\
  \ Prophet 模型添加一个额外的回归变量。首先，将额外变量添加到包含 'ds' 和 'y' 列的数据框中。你可以使用清单 19-13 来实现。\n\n```\n\
  X_reservations = pd.read_csv('air_reserve.csv.zip')\nX_reservations['visit_date']\
