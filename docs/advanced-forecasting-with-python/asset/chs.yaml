  引言


  *《Python 高级预测》* 涵盖了所有与预测问题相关的机器学习技术，范围从单变量和多变量时间序列到监督学习，再到最先进的深度预测模型，如 LSTM、循环神经网络（RNN）、Facebook
  的开源 Prophet 模型以及亚马逊的 DeepAR 模型。


  本书并非专注于某一特定模型集，而是全面概述了所有与预测实践者相关的技术。它首先用高层次语言解释了与预测相关的不同模型类别。接着，介绍了单变量和多变量时间序列模型，随后是高级机器学习和深度学习模型，例如循环神经网络、LSTM、Facebook
  的 Prophet 和亚马逊的 DeepAR。最后，本书对模型选择进行了反思，如基准分数与模型可理解性及计算时间之间的权衡，以及模型的自动重新训练和更新。本书中介绍的每个模型都进行了深入讲解，包括对模型的直观简单解释、该思想的数学转换，以及将模型应用于示例数据集的
  Python 代码。


