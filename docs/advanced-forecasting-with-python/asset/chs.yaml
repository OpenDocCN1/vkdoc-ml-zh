  如果你下载这些数据，你会发现它包含每小时的交通流量，以及一些天气数据和节假日信息。对于当前这个例子，我们避免依赖天气数据，而是基于季节性和节假日进行预测。毕竟，我们可以想象交通流量在很大程度上取决于一天中的时间、工作日和节假日。


  要将数据导入 Python，你可以使用代码清单 13-1 中的代码。


