- "# 8. SARIMAX 模型\n\n在本章中，你将了解 SARIMAX 模型。该模型是经典时间序列模型中最完整的版本，因为它包含了你在本书前几章中学习到的所有组件。它增加了\
  \ X 组件：外部变量。\n\n## 时间序列构建模块\n\n让我们通过表 8-1 快速回顾一下你在前几章中看到的时间序列的不同组成部分。\n\n表 8-1\n\
  \n单变量时间序列的构建模块\n\n| 名称 | 解释 | 章节 |\n| --- | --- | --- |\n| AR | 自回归 | 3 |\n| MA\
  \ | 移动平均 | 4 |\n| ARMA | AR 和 MA 模型的组合 | 5 |\n| ARIMA | 在 ARMA 模型中加入差分（I） | 6 |\n\
  | SARIMA | 在 ARIMA 模型中加入季节性（S） | 7 |\n| SARIMAX | 在 SARIMA 模型中加入外部变量（X）*（注意，外部变量使得该模型不再是单变量模型）*\
  \ | 8 |\n\n这些章节从简单到复杂逐步构建时间序列模型。SARIMAX 模型不被视为单变量时间序列模型的完美范例。单变量时间序列模型仅使用目标变量的变化，而\
  \ SARIMAX 模型还使用了外部变量。\n\n## 模型定义\n\nSARIMAX 模型的数学定义如下：\n\n![$$ {\\displaystyle \\\
  begin{array}{c}{y}_t={\\beta}_t{x}_t+{u}_t\\\\ {}{\\varphi}_p(L){\\tilde{\\phi}}_p\\\
  left({L}^s\\right){\\varDelta}^d{\\varDelta}_s^D{u}_t=A(t)+{\\theta}_q(L){\\tilde{\\\
  theta}}_Q\\left({L}^s\\right){\\zeta}_t\\end{array}} $$](img/508548_1_En_8_Chapter_TeX_Equa.png)\n\
  \n第一个公式中的*β*（beta）部分代表外部变量。其余部分与 SARIMA 模型非常相似，但为完整起见，让我们重新列出该模型的超参数：\n\n*   p 代表自回归阶数\n\
  \n*   q 代表移动平均阶数\n\n*   I 代表差分阶数\n\n*   P 代表季节性自回归阶数\n\n*   Q 代表季节性移动平均阶数\n\n* \
  \  D 代表季节性差分\n\n*   s 代表季节性系数\n\n\n\n## 监督模型 vs. SARIMAX\n\n在后续章节中，你将看到许多监督模型的案例。你可能还记得第一章的内容，监督模型使用外部变量来预测目标变量。这个想法与\
  \ SARIMAX 中的 X 部分非常相似。\n\n当然，问题在于实践中应该使用哪一种。从理论角度来看，当时间序列部分比外部变量部分更突出时，SARIMAX 可能是更优选择。如果仅靠外部变量就能解释很多，并且自相关或季节性部分对此进行了补充，那么监督模型可能是更好的选择。\n\
  \n然而，一如既往，合理的做法是在模型基准测试中使用多个模型。模型的选择应直接基于其预测性能。\n\n## 沃尔玛数据集上的 SARIMAX 示例\n\n在上一章中，你看到了使用\
  \ SARIMA 模型预测沃尔玛每周销售额的案例。但该数据集不仅仅包含每周销售额数据：还有一个指标，用于指示某周是否包含节假日。\n\n你在 SARIMA 模型中没有使用节假日信息，因为无法向其添加外部数据。这其实无关紧要，因为测试数据中没有因节假日导致的极端峰值。尽管模型中缺少了节假日信息，但这并未在误差估计中体现出来。\n\
  \n然而，添加此类信息非常重要，因为它可能能够解释模型中的大部分变异。让我们看看如何使用外部变量来改进沃尔玛的示例。\n\n第一步，你应该导入并准备数据。你可以使用代码清单\
  \ 8-1 来完成此操作。这段代码还向你展示了如何创建销售额随时间变化的图表。\n\n```\nimport pandas as pd\nimport matplotlib.pyplot\
  \ as plt\ndata = pd.read_csv('walmart/train.csv')\ndata = data.groupby('Date').sum()\n\
  data['IsHoliday'] = data['IsHoliday'] > 0\ndata['IsHoliday'] = data['IsHoliday'].apply(\n\
  lambda x: float(x)\n)\nax = data['Weekly_Sales'].plot()\nax.set_ylabel('Weekly Sales')\n\
  plt.gcf().autofmt_xdate()\nplt.show()\n代码清单 8-1\n准备数据并绘制图表\n```\n\n你应该会得到如图 8-1\
  \ 所示的图形。\n\n![../images/508548_1_En_8_Chapter/508548_1_En_8_Fig1_HTML.jpg](img/508548_1_En_8_Fig1_HTML.jpg)\n\
  \n图 8-1\n\n每周销售额图\n\n下一步是使用相关性分析来研究将节假日信息添加到模型中是否可能带来改进。如果销售额与节假日之间完全没有相关性，那么将其添加到模型中是不明智的。让我们使用代码清单\
