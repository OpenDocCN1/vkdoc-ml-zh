    4, 4, 4, B 22 to 24 is temperature, C 22 is hot, C 23 is mild, C 24 is cool, D
    21 is yes, E 21 is no, F 21 is p asterisk log of p, G 21 is p asterisk log of
    p minus r, H 21 is weighted, I 21 is entropy, and J 21 is info gain.


    Figure 10-5


    Table setup in process


    1.  Enter “Sample-size” in cell A16 and 14 in cell B16\. 14 is the data size.


    2.  Enter “p*log(p)” in cell E17\. p*log(p) represents *P*[*K*]log[2](*P*[*k*])
    in Equation ([10-1](#494428_2_En_10_Chapter.xhtml#Equ1)).


    3.  Enter “entropy” in cell F17.


    4.  Merge cells B18 and B19 together; enter “Play” inside the merged cell.


    5.  Enter “yes” in cell C18 and “no” in cell C19.


    By now, part of our worksheet looks like Figure [10-3](#494428_2_En_10_Chapter.xhtml#Fig3)
    except that our worksheet has no numbers in cell D18 or D19\. Don’t worry, we
    are going to compute them soon.


    ![](images/494428_2_En_10_Chapter/494428_2_En_10_Fig3_HTML.jpg)


    A screenshot of golf data in Excel with columns A to F and rows 14 to 20\. Cells
    with data are A 16 is sample size, B 16 is 14, E 17 is p asterisk log of p, F
    17 is entropy, B 18 and 19 is play, C 18 is yes, C 19 is no, D 18 is 9, and D
    19 is 5.


    Figure 10-3


    Golf dataset and table setup for Play


    Follow these instructions to complete the computation of the entropy for the target
    variable Play:


    6.  In cell D18, enter the formula `=COUNTIFS($E$2:$E$15,C18)`. This counts how
    many *yes* there are for Play.


    7.  Autofill from cell D18 to cell D19\. D19 counts how many *no* for Play.


    8.  In cell E18, enter the formula `=D18/$B$16*LOG(D18/$B$16,2)`. This formula
    computes P[yes] × Log2(P[yes]).


    9.  Autofill from E18 to E19\. E19 computes P[no] × Log2(P[no]).


    10.  Merge cells F18 and F19; enter the formula `=-SUM(E18:E19)` inside the merged
    cell. The result is the entropy for the target variable Play.


    Our worksheet looks like Figure [10-4](#494428_2_En_10_Chapter.xhtml#Fig4).


    ![](images/494428_2_En_10_Chapter/494428_2_En_10_Fig4_HTML.jpg)


