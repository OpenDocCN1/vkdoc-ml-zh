    ## Reinforcement Exercises


    The data in Chapter9-HW.xlsx is downloaded from the famous UCI Machine Learning
    Repository at [`https://archive.ics.uci.edu/`](https://archive.ics.uci.edu/).
    This dataset provides a good opportunity for practicing Naïve Bayes data mining.
    Refer to Chapter9-HW-withAnswers whenever you need help.


    ## Review Points


    1.  General understanding of Naïve Bayes. Learn how to deduce Bayes’ theorem from
    conditional probability and try to repeat the deduction process by yourself.


    2.  COUNTIF, COUNTIFS, and SUMIF functions and operator &.


    3.  INDEX, MATCH, and TEXT functions.


    # 10. Decision Trees


    Decision tree is probably the most intuitive data classification and prediction
    method. It is also used frequently. While most of the data mining methods we have
    learned are parametric, decision tree is a rule-based method. The most critical
    concept in understanding decision trees is entropy which will be explained soon.
    A tree is composed of nodes and the leaves are the bottom nodes. At each node
    except for the leaf nodes, a decision must be made to split the node into at least
    two branches. Figure [10-1](#494428_2_En_10_Chapter.xhtml#Fig1) depicts a sample
    decision tree structure.


    ![](images/494428_2_En_10_Chapter/494428_2_En_10_Fig1_HTML.jpg)


    A decision tree structure. Node N 1 is subdivided into nodes N 2 1, 2, and 3\.
    Node 2 1 is subdivided into N 3 1 and L 1\. Node N 2 2 is subdivided into L 2
    and L 3\. Node N 2 3 is subdivided into L 4, N 3 2, and L 5\. Node N 3 1 is subdivided
    into L 6 and L 7\. Node N 3 2 is subdivided into L 8 and L 9.


    Figure 10-1


    A sample decision tree structure


    In Figure [10-1](#494428_2_En_10_Chapter.xhtml#Fig1), all nodes start with letter
    “N”, while all leaves start with letter “L”. In a decision tree, a node can be
    split into two or more child nodes. However, a leaf can never be split again.
    The most critical action in a decision tree is to determine how to split a node.
    Though there is a general rule applied to every node, each node must be considered
    individually based on its inside data.


    Please download the sample Excel files from [`https://github.com/hhohho/Learn-Data-Mining-through-Excel-2`](https://github.com/hhohho/Learn-Data-Mining-through-Excel-2)
    for this chapter’s exercises.


    ## General Understanding


    How a node is split in a decision tree is based on the entropy computed with the
    data inside the node. Entropy represents how “pure” the data inside a tree node
    is. The higher the entropy, the less pure the data is. Let’s learn how to calculate
    entropy so that we can develop a better understanding.


    Assume that the target variable of a dataset has `m` distinct classes. The entropy
    of this dataset is usually computed based on Equation ([10-1](#494428_2_En_10_Chapter.xhtml#Equ1)):


    ![$$ H=-\sum \limits_{k=1}^m{P}_K{\log}_2\left({P}_k\right) $$](images/494428_2_En_10_Chapter/494428_2_En_10_Chapter_TeX_Equ1.png)


    (10-1)


    In Equation ([10-1](#494428_2_En_10_Chapter.xhtml#Equ1)), *P*[*K*] is the probability
    for the kth class to occur; it is used to weigh the log[2](*P*[*k*]). For example,
    suppose there are 10 data items among which 3 are “yes” and 7 are “no”. Since
    there are only two distinct classes (yes or no), `m` = 2.


    *   For “yes”, *p* = 3/10 = 0.3, log[2](*p*) = -1.74, *p*log[2](*p*) = -0.52.


    *   For “no”, *p* = 7/10 = 0.7, log[2](*p*) = -0.51, *p*log[2](*p*) = -0.36.


    *   H = -(-0.52 - 0.36) = 0.88.


    If there are 10 “yes” and 0 “no”, the computation would be as follows:


    *   For “yes”, *p* = 10/10 = 1, log[2](*p*) = 0, *p*log[2](*p*) = 0.


    *   For “no”, *p* = 0/10 = 0, *p*log[2](*p*) = 0 (assume log[2](0) is not an error).


    *   H = -(0 + 0) = 0.


    If there are 5 “yes” and 5 “no”, the computation will give out H = 1.0.


    It seems if the data are more skewed to a class, the entropy is lower. Decision
    tree method tends to pick the attribute that generates the least entropy to split
    a node. This is easy to understand. Suppose there are two paths before us, and
    we need to select one to reach our destination. If both paths offer us the same
    likelihood to arrive on time, we will find ourselves hesitating (H=1). If one
    way is definitely much more likely to allow us to arrive on time, our decision
    won’t be difficult. Moreover, if there is only one way, our selection is definite
    (H = 0).


    In Equation ([10-1](#494428_2_En_10_Chapter.xhtml#Equ1)), base 2 logarithm is
    used. Base 2 logarithm is the most commonly used logarithm function in decision
    trees. When there are only two classes in a dataset, base 2 logarithm guarantees
    that the entropy is between 0 and 1 (inclusively). When there are more than two
    classes, base 2 logarithm cannot guarantee the entropy to be between 0 and 1\.
    If we prefer the entropy to be between 0 and 1, then when there are N distinct
    classes, a logarithm function of base N must be used.


