    \ 84。\n\n4.  在单元格 W5 中输入“截止点”，在单元格 X5 中输入“错误分类”。\n\n5.  在单元格 T6 中输入公式 `=AVERAGEIFS($X$11:$X$182,$F$11:$F$182,T$5)`。此公式计算那些“类别”值等于\
