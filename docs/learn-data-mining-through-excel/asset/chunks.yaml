    \ 到 I 列以及第 1 到 15 行。F 到 I 列的列标题为：温度、湿度、有风和天气。单元格 I2 的数据为 sunny，并已高亮显示。\n\n图 10-21\n\
    \n工作表 level-2-sunny 概览\n"
- fmt: "### Apply the Model\n\nDecision trees are both classification and predictive\
    \ models. We build the decision tree model to predict the class of future events.\
    \ Open `Chapter10-3a.xlsx`; the data table looks like Figure [10-22](#494428_2_En_10_Chapter.xhtml#Fig22).\n\
    \n![](images/494428_2_En_10_Chapter/494428_2_En_10_Fig22_HTML.jpg)\n\nAn Excel\
    \ screenshot with columns A to G and rows 1 to 21. The column headers are temperature,\
    \ humidity, windy, outlook, play, and probability. Some of the cells with data\
    \ are D17 is outlook, B19 is rainy (3, 2), D19 is overcast (4, 0), and D19 is\
    \ sunny (2, 3).\n\n**Figure 10-22** Prediction for future events based on the\
    \ decision tree model\n\nThe data in the table are randomly generated. Our job\
    \ is to predict the decision for Play based on the decision tree model which is\
    \ also shown in Figure [10-22](#494428_2_En_10_Chapter.xhtml#Fig22). This decision\
    \ tree is a rule-based model, which can be best programmed using the `IF` function.\n\
    \n![](images/494428_2_En_10_Chapter/494428_2_En_10_Fig23_HTML.jpg)\n\nAn Excel\
    \ screenshot of computed decision tree probability. It has columns A to E and\
    \ rows 1 to 14. The column headers are temperature, humidity, windy, outlook,\
    \ play, and probability. Each cell contains a data.\n\n**Figure 10-23** Decision\
    \ tree probability computed\n\n1.  Enter the following formula in cell `E2` and\
    \ autofill from cell `E2` to cell `E15`:\n\n    ```\n    =IF(D2=\"overcast\",\"\
    yes\", IF(D2=\"rainy\",IF(C2=\"TRUE\",\"no\",\"yes\"), IF(B2=\"high\",\"no\",\"\
    yes\")))\n    ```\n\n    This formula implements our simple decision tree rules.\n\
    \n2.  Enter the following formula in cell `F2`:\n\n    ```\n    =IF(D2=\"overcast\"\
    ,4/4, IF(D2=\"rainy\",IF(C2=\"TRUE\",2/2,3/3), IF(B2=\"high\",3/3,2/2)))\n   \
    \ ```\n\n    This formula computes the probability for each Play class. The probability\
    \ of each Play class is computed based on the numbers inside each leaf node. For\
    \ example, if the Outlook is overcast, the leaf node has 4 yes and 0 no; thus,\
    \ the probability is 4/4 = 1. Given that the Outlook is sunny and Humidity is\
    \ high, since the corresponding leaf node has 0 yes and 3 no, the probability\
    \ for “no” is 3/3 = 1. Our data size is very small, which simplifies each leaf\
    \ node to have data of only one class. This is the reason why all probability\
    \ values are 1 as shown in Figure [10-23](#494428_2_En_10_Chapter.xhtml#Fig23).\n\
    \n    Note, we are using actual numbers instead of cell references in the preceding\
    \ formula. This is for better demonstration.\n\nComputing the probability only\
    \ based on the numbers inside each leaf node is debatable, in my opinion. However,\
    \ this is not a topic of discussion in this book. The complete prediction results\
    \ can be found in the file `Chapter10-3b.xlsx` which contains an additional worksheet\
    \ that randomizes the input data for the demonstration purpose.\n\nThis wraps\
    \ up another chapter. A critical part of decision tree method is to visualize\
    \ the model. Certainly, Excel is not suitable to draw customized decision tree\
    \ graphs. Nevertheless, this chapter demonstrates that Excel is capable of conducting\
    \ decision tree analysis.\n\n## Reinforcement Exercises\n\nThough the dataset\
    \ used previously is good for demonstration, it is quite small and not impractical\
    \ for real applications. For this chapter’s reinforcement exercise, we are going\
    \ to make use of the Car Evaluation dataset again (Bohanec, Marko. 1997. Car Evaluation.\
    \ UCI Machine Learning Repository. [`https://doi.org/10.24432/C5JP48`](https://doi.org/10.24432/C5JP48)).\
    \ Please open the file `Chapter10-HW.xlsx` to practice Decision Trees data mining\
    \ method. You can reference to `Chapter10-HW-withAnswers.xlsx` whenever you need\
    \ help.\n\n## Review Points\n\n1.  Entropy, information gain, and gain ratio\n\
    2.  Set up helping tables\n3.  Functions `IF`, `COUNTIFS`, `SUMIFS`, and `INDEX`\n\
    4.  Functions `LOG` and `IFERROR`\n5.  The operator `<>`\n6.  Copy a worksheet\
    \ to continue a tree node split\n\n# 11. EDA, Data Cleaning, and Feature Selection\n\
    \nExploratory data analysis (EDA) and data cleaning are usually the first two\
    \ topics in a traditional data mining course. So, it is legitimate to ask why\
    \ I place them in Chapter [11](#494428_2_En_11_Chapter.xhtml).\n\nWhen I started\
    \ to self-learn data mining, the first book I read did place these two topics\
    \ in the first three chapters. At that point of time, I had no idea how data mining\
    \ methods work and was eager to learn the magic. I was not happy that after the\
    \ first three chapters, I still had no idea what typical data mining methods were,\
    \ let alone how they worked. It is after I had finished the whole book, I began\
    \ to appreciate the necessity of EDA and data cleaning. Later, through my own\
    \ practices and research in machine learning, I realized the importance of feature\
    \ selection. Now you have accumulated enough knowledge about some data mining\
    \ methods, it is time to develop some understanding about EDA, data cleaning,\
    \ and feature selection, which are the three tasks we should perform before we\
    \ construct our data mining models.\n\nPlease download the sample Excel files\
    \ from [`https://github.com/hhohho/Learn-Data-Mining-through-Excel-2`](https://github.com/hhohho/Learn-Data-Mining-through-Excel-2)\
    \ for this chapter’s exercises."
  raw: "### Apply the Model\n\nDecision trees are both classification and predictive\
    \ models. We build the decision tree model to predict the class of future events.\
    \ Open Chapter10-3a.xlsx; the data table looks like Figure [10-22](#494428_2_En_10_Chapter.xhtml#Fig22).\n\
    \n![](images/494428_2_En_10_Chapter/494428_2_En_10_Fig22_HTML.jpg)\n\nAn Excel\
    \ screenshot with columns A to G and rows 1 to 21\\. The column headers are temperature,\
    \ humidity, windy, outlook, play, and probability. Some of the cells with data\
    \ are D 17 is outlook, B 19 is rainy (3, 2), D 19 is overcast (4, 0), and D 19\
    \ is sunny (2, 3).\n\nFigure 10-22\n\nPrediction for future events based on the\
    \ decision tree model\n\nThe data in the table are randomly generated. Our job\
    \ is to predict the decision for Play based on the decision tree model which is\
    \ also shown in Figure [10-22](#494428_2_En_10_Chapter.xhtml#Fig22). This decision\
    \ tree is a rule-based model, which can be best programmed using the IF function.\n\
    \n![](images/494428_2_En_10_Chapter/494428_2_En_10_Fig23_HTML.jpg)\n\nAn Excel\
    \ screenshot of computed decision tree probability. It has columns A to E and\
    \ rows 1 to 14\\. The column headers are temperature, humidity, windy, outlook,\
    \ play, and probability. Each cell contains a data.\n\nFigure 10-23\n\nDecision\
    \ tree probability computed\n\n1.  Enter the following formula in cell E2 and\
    \ autofill from cell E2 to cell E15:\n\n    ```\n    =IF(D2=\"overcast\",\"yes\"\
    , IF(D2=\"rainy\",IF(C2=\"TRUE\",\"no\",\"yes\"), IF(B2=\"high\",\"no\",\"yes\"\
    )))\n    ```\n\n    This formula implements our simple decision tree rules.\n\n\
    2.  Enter the following formula in cell F2:\n\n    ```\n    =IF(D2=\"overcast\"\
    ,4/4, IF(D2=\"rainy\",IF(C2=\"TRUE\",2/2,3/3), IF(B2=\"high\",3/3,2/2)))\n   \
    \ ```\n\n    This formula computes the probability for each Play class. The probability\
    \ of each Play class is computed based on the numbers inside each leaf node. For\
    \ example, if the Outlook is overcast, the leaf node has 4 yes and 0 no; thus,\
    \ the probability is 4/4 = 1. Given that the Outlook is sunny and Humidity is\
    \ high, since the corresponding leaf node has 0 yes and 3 no, the probability\
    \ for “no” is 3/3 = 1\\. Our data size is very small, which simplifies each leaf\
    \ node to have data of only one class. This is the reason why all probability\
    \ values are 1 as shown in Figure [10-23](#494428_2_En_10_Chapter.xhtml#Fig23).\n\
    \n    Note, we are using actual numbers instead of cell references in the preceding\
    \ formula. This is for better demonstration.\n\nComputing the probability only\
    \ based on the numbers inside each leaf node is debatable, in my opinion. However,\
    \ this is not a topic of discussion in this book. The complete prediction results\
    \ can be found in the file Chapter10-3b.xlsx which contains an additional worksheet\
    \ that randomizes the input data for the demonstration purpose.\n\nThis wraps\
    \ up another chapter. A critical part of decision tree method is to visualize\
    \ the model. Certainly, Excel is not suitable to draw customized decision tree\
    \ graphs. Nevertheless, this chapter demonstrates that Excel is capable of conducting\
    \ decision tree analysis.\n\n## Reinforcement Exercises\n\nThough the dataset\
    \ used previously is good for demonstration, it is quite small and not impractical\
    \ for real applications. For this chapter’s reinforcement exercise, we are going\
    \ to make use of the Car Evaluation dataset again (Bohanec, Marko. 1997\\. Car\
    \ Evaluation. UCI Machine Learning Repository. [`https://doi.org/10.24432/C5JP48`](https://doi.org/10.24432/C5JP48)).\
    \ Please open the file Chapter10-HW.xlsx to practice Decision Trees data mining\
    \ method. You can reference to Chapter10-HW-withAnswers.xlsx whenever you need\
    \ help.\n\n## Review Points\n\n1.  Entropy, information gain, and gain ratio\n\
    \n2.  Set up helping tables\n\n3.  Functions IF, COUNTIFS, SUMIFS, and INDEX\n\
    \n4.  Functions LOG and IFERROR\n\n5.  The operator <>\n\n6.  Copy a worksheet\
    \ to continue a tree node split\n\n# 11. EDA, Data Cleaning, and Feature Selection\n\
    \nExploratory data analysis (EDA) and data cleaning are usually the first two\
    \ topics in a traditional data mining course. So, it is legitimate to ask why\
    \ I place them in Chapter [11](#494428_2_En_11_Chapter.xhtml).\n\nWhen I started\
    \ to self-learn data mining, the first book I read did place these two topics\
    \ in the first three chapters. At that point of time, I had no idea how data mining\
    \ methods work and was eager to learn the magic. I was not happy that after the\
    \ first three chapters, I still had no idea what typical data mining methods were,\
    \ let alone how they worked. It is after I had finished the whole book, I began\
    \ to appreciate the necessity of EDA and data cleaning. Later, through my own\
    \ practices and research in machine learning, I realized the importance of feature\
    \ selection. Now you have accumulated enough knowledge about some data mining\
    \ methods, it is time to develop some understanding about EDA, data cleaning,\
    \ and feature selection, which are the three tasks we should perform before we\
    \ construct our data mining models.\n\nPlease download the sample Excel files\
    \ from [`https://github.com/hhohho/Learn-Data-Mining-through-Excel-2`](https://github.com/hhohho/Learn-Data-Mining-through-Excel-2)\
    \ for this chapter’s exercises."
  trans: "\n### 应用模型\n\n决策树既是分类模型，也是预测模型。我们构建决策树模型是为了预测未来事件的类别。打开 `Chapter10-3a.xlsx`\
    \ 文件；数据表如图 10-22 所示。\n\n![](img/494428_2_En_10_Fig22_HTML.jpg)\n\n一张 Excel 截图，包含\
    \ A 到 G 列以及第 1 到 21 行。列标题为：温度、湿度、风力、天气、是否打球和概率。部分包含数据的单元格有：D17 为“天气”，B19 为“雨天\
    \ (3, 2)”，D19 为“阴天 (4, 0)”，D19 为“晴天 (2, 3)”。\n\n图 10-22\n\n基于决策树模型对未来事件的预测\n\n\
    表中的数据是随机生成的。我们的任务是基于图 10-22 所示的决策树模型，预测“是否打球”的决策。该决策树是一个基于规则的模型，最适合使用 IF 函数进行编程实现。\n\
    \n![](img/494428_2_En_10_Fig23_HTML.jpg)\n\n一张计算了决策树概率的 Excel 截图。它包含 A 到 E 列以及第\
    \ 1 到 14 行。列标题为：温度、湿度、风力、天气、是否打球和概率。每个单元格都包含数据。\n\n图 10-23\n\n计算出的决策树概率\n\n1.\
    \  在单元格 E2 中输入以下公式，并从单元格 E2 自动填充到单元格 E15：\n\n    ```\n    =IF(D2=\"overcast\"\
    ,\"yes\", IF(D2=\"rainy\",IF(C2=\"TRUE\",\"no\",\"yes\"), IF(B2=\"high\",\"no\"\
    ,\"yes\")))\n    ```\n\n    此公式实现了我们简单的决策树规则。\n\n2.  在单元格 F2 中输入以下公式：\n\n    ```\n\
    \    =IF(D2=\"overcast\",4/4, IF(D2=\"rainy\",IF(C2=\"TRUE\",2/2,3/3), IF(B2=\"\
    high\",3/3,2/2)))\n    ```\n\n    此公式计算每个“是否打球”类别的概率。每个“是否打球”类别的概率是基于每个叶节点内的数字计算的。例如，如果天气为阴天，叶节点有\
    \ 4 个“是”和 0 个“否”；因此概率为 4/4 = 1。假设天气为晴天且湿度为高，由于对应的叶节点有 0 个“是”和 3 个“否”，则“否”的概率为\
    \ 3/3 = 1。我们的数据量非常小，这使得每个叶节点只包含一个类别的数据。这就是如图 10-23 所示所有概率值都为 1 的原因。\n\n    请注意，我们在上述公式中使用了实际数字而不是单元格引用。这是为了更好的演示效果。\n\
    \n在我看来，仅基于每个叶节点内的数字来计算概率是有争议的。然而，这不是本书要讨论的主题。完整的预测结果可以在文件 `Chapter10-3b.xlsx`\
    \ 中找到，该文件包含一个额外的工作表，用于演示目的而随机化输入数据。\n\n本章到此结束。决策树方法的一个关键部分是模型的可视化。当然，Excel 并不适合绘制自定义的决策树图形。尽管如此，本章展示了\
    \ Excel 能够进行决策树分析。\n\n## 强化练习\n\n虽然之前使用的数据集很适合演示，但它非常小，不适用于实际应用。对于本章的强化练习，我们将再次使用汽车评估数据集（Bohanec,\
    \ Marko. 1997. Car Evaluation. UCI Machine Learning Repository. [`https://doi.org/10.24432/C5JP48`](https://doi.org/10.24432/C5JP48)）。请打开文件\
    \ `Chapter10-HW.xlsx` 来练习决策树数据挖掘方法。当你需要帮助时，可以参考 `Chapter10-HW-withAnswers.xlsx`。\n\
    \n## 复习要点\n\n1.  熵、信息增益和增益率\n\n2.  设置辅助表\n\n3.  函数 IF、COUNTIFS、SUMIFS 和 INDEX\n\
    \n4.  函数 LOG 和 IFERROR\n\n5.  运算符 <>\n\n6.  复制工作表以继续树节点分裂\n\n# 11. 探索性数据分析、数据清洗与特征选择\n\
    \n探索性数据分析（EDA）和数据清洗通常是传统数据挖掘课程中的前两个主题。因此，很自然会问为什么我把它们放在第 11 章。\n\n当我开始自学数据挖掘时，我读的第一本书确实将这两个主题放在了前三章。那时，我完全不知道数据挖掘方法是如何工作的，并且渴望学习其中的奥秘。我不高兴的是，在读完前三章后，我仍然不知道典型的数据挖掘方法是什么，更不用说它们是如何工作的了。直到我读完整本书，我才开始体会到\
    \ EDA 和数据清洗的必要性。后来，通过我自己在机器学习方面的实践和研究，我认识到了特征选择的重要性。现在你已经积累了一些关于数据挖掘方法的知识，是时候对\
    \ EDA、数据清洗和特征选择这三个在构建数据挖掘模型之前应该执行的任务有所了解了。\n\n请从 [`https://github.com/hhohho/Learn-Data-Mining-through-Excel-2`](https://github.com/hhohho/Learn-Data-Mining-through-Excel-2)\
    \ 下载本章练习所需的示例 Excel 文件。\n"
- fmt: '# Learn Exploratory Data Analysis Through Excel


    A typical full data mining project starts with business understanding and data
    understanding because we should have a clear mind of what problems we try to solve
    and what data we need. The next phase is data preparation during which we collect
    and prepare the data. It is in the data preparation phase that we conduct exploratory
    data analysis and data cleaning tasks.


    The keyword “exploratory” indicates that EDA refers to the initial investigations
    so that we understand the following regarding the data:


    - Number of records

    - Number of attributes

    - Data type of each attribute

    - Sum, mean, median, and variances of each numerical attribute

    - Value range of each numerical attribute

    - Unique values of categorical target and attributes

    - Class distribution of the target

    - If there are any missing data

    - Data anomalies, etc.


    Excel is fairly suitable for EDA because the data in a worksheet is directly visible
    and Excel has many functions and built-in features that allow easy completion
    of summary statistics operations and anomaly detection. Please open `Chapter11-1a.xlsx`
    which shows a dataset contributed by Chiharu Sano to UCI Machine Learning Repository.
    You shall notice that in the worksheet named “crx”, there are 15 attributes and
    one target variable as shown in Figure [11-1](#494428_2_En_11_Chapter.xhtml#Fig1).


    ![](images/494428_2_En_11_Chapter/494428_2_En_11_Fig1_HTML.jpg)


    An Excel sheet has 15 attributes and one target variable.


    **Figure 11-1** Excel provides a direct visual view of the dataset


    Let’s complete the previously listed exploratory actions one by one in this worksheet.


    ## 1. Number of records


    Since the dataset is in Excel, you can easily scroll down to the bottom to find
    out that there are 691-1 = 690 records. In case the dataset size is too large,
    you can type the formula `=COUNTA(P:P) - 1` in cell `Q2` to obtain the number
    of records. The `COUNTA` function counts the number of cells that are not empty
    in a range. Since there might be empty cells inside attributes, counting the target
    values is a reliable way to confirm the number of records.


    ## 2. Number of attributes


    As Excel allows us to view the data directly, we can easily tell the number of
    attributes of a dataset in an Excel worksheet. Should you want to make use of
    a formula, please type `=COUNTA(A1:P1)` in cell `Q1`. Thus, there are 15 attributes
    and one target (label).


    ## 3. Data type of each attribute


    The Excel worksheet immediately tells us through our eyes that attributes `A1`,
    `A4`–`A7`, `A9`, `A10`, `A12`, and `A13` and the target are categorical text data,
    while `A2`, `A3`, `A8`, `A11`, `A14`, and `A15` are numerical data.


    ## 4. Sum, mean, median, and variances of each numerical attribute


    Certainly we can apply the functions `SUM`, `AVERAGE`, and `MEDIAN` to columns
    `A2`, `A3`, `A8`, `A11`, `A14`, and `A15` to obtain their sum, mean, and median.
    I don’t need to demonstrate how to achieve them here.


    For the variances of these numerical attributes, we need to apply the function
    `VAR.P`, which calculates the population variance. The population variance is
    calculated as ![$$ \frac{\sum \limits_{i=1}^n{\left({x}_i-\overline{x}\right)}^2}{n}
    $$](images/494428_2_En_11_Chapter/494428_2_En_11_Chapter_TeX_IEq1.png). Since
    there are only 690 records, we can scroll down to the bottom of the worksheet
    to enter the formula `=IFERROR(VAR.P(A2:A691), "")` in cell `A692` and then autofill
    to cell `O692`. The `IFERROR` function is used to take care of the nonnumerical
    attributes. Note, if there are a large number of records, we can certainly insert
    a row right above the attribute names to calculate and store the variances. At
    this point of time, part of our worksheet should look like Figure [11-2](#494428_2_En_11_Chapter.xhtml#Fig2).
    Note, the word “Variance” was added inside cell `Q692` to mark the row 692.


    ![](images/494428_2_En_11_Chapter/494428_2_En_11_Fig2_HTML.jpg)


    A screenshot of the Excel sheet demonstrates the numerical attribute variances
    in row 692.


    **Figure 11-2** The variances of the numerical attributes are stored in row 692


    The variances are not computed on the same scale by default and therefore you
    will notice that attribute `A15` has the largest variance. Sometimes the variances
    are computed after all the attributes are normalized into the same range. I will
    address the normalization issue in detail when I explain the feature selection.
    Here, let’s normalize all the numerical attributes into the range of 0–100.


    To compute the variances on the same scale of 0–100, let’s make a copy of the
    current worksheet and rename the new worksheet `crx2`. In the cell `A2` of worksheet
    `crx2`, enter the following formula:


    ```

    =IFERROR((crx!A2-MIN(crx!A$2:A$691))/(MAX(crx!A$2:A$691)-MIN(crx!A$2:A$691))*100,
    crx!A2)

    ```


    This formula processes the corresponding data item inside worksheet `crx` before
    placing it inside cell `A2`. The `IFERROR` function guarantees if the column `A`
    data is not numerical, an error will occur and therefore the data at `crx!A2`
    will be placed inside cell `A2` without normalization. If the column `A` data
    is numerical, it then normalizes the data value inside `crx!A2` into the range
    of 0–100 inclusively.


    Autofill from `A2` to `O2` and then autofill together to `A691:O691`, we shall
    obtain the variances of the normalized data which illustrate that the largest
    variance is in attribute `A2`. Part of our `crx2` worksheet should look like Figure
    [11-3](#494428_2_En_11_Chapter.xhtml#Fig3).


    ![](images/494428_2_En_11_Chapter/494428_2_En_11_Fig3_HTML.jpg)


    An Excel spreadsheet with variances after numerical attributes are normalized.


    **Figure 11-3** The variances after numerical attributes are normalized into the
    range 0–100


    ## 5. Value range of each numerical attribute


    The value range usually indicates the largest and smallest values of a numerical
    attribute. We can apply the Excel function `MAX` and `MIN` to obtain the largest
    and smallest values of each numerical attribute. The value range can help identify
    outliers and data anomalies.


    ## 6. Unique values of categorical target and attributes


    To obtain the unique values of categorical attributes, we can make use of the
    Excel built-in feature “Remove Duplicates”. Before we remove duplicates for each
    categorical attribute, we’d better make a copy of the worksheet `crx` and rename
    the new worksheet `crx3`.


    Inside the `crx3` worksheet, please click the column letter `G` ➤ click the `Data`
    tab ➤ select `Remove Duplicates` ➤ on the upcoming menu, select the option “Continue
    with the current selection” and then click the button “Remove Duplicates…”. This
    is shown in Figure [11-4](#494428_2_En_11_Chapter.xhtml#Fig4).


    ![](images/494428_2_En_11_Chapter/494428_2_En_11_Fig4_HTML.jpg)


    An Excel spreadsheet explains how to open the remove duplicates warning window.
    The steps are as follows. Data, column G, Remove Duplicates, and then choose the
    appropriate option.


    **Figure 11-4** Select Remove Duplicates


    Another small menu shows up. Follow the instruction in Figure [11-5](#494428_2_En_11_Chapter.xhtml#Fig5)
    to click the `OK` button. Finally, a last small menu appears which tells us that
    there are “680 duplicates found and removed; 11 unique values remain.”


    ![](images/494428_2_En_11_Chapter/494428_2_En_11_Fig5_HTML.jpg)


    A screenshot of the Remove Duplicates window. The My data has headers checkbox
    is enabled.


    **Figure 11-5** Make sure that “My data has headers” is checked


    These actions removed the duplicates for attribute `A7`. We need to repeat these
    actions on all other categorical attributes and the target.


    Interestingly, you will realize that some attributes have the value “?” inside.
    Well, the question mark symbol “?” is commonly used to represent a missing value.
    So, those “?” in the `crx3` worksheet indicates that there are missing values
    in the corresponding attributes. We will talk about missing values soon.


    ## 7. Class distribution of the target'
