    `CELL` 函数代替 `SHEET`。`Chapter3-HW-withAnswers-Cell-Function.xlsx` 文件展示了这种解决方案，欢迎自行探索。


    Excel 提供了一些配置公式计算的选项。默认情况下，“启用迭代计算”选项是禁用的。如果在 Excel 中启用迭代计算，则只需两个工作表即可完成 `k-means`
    聚类过程，因为第二个工作表可以执行类似循环的过程来达到收敛！由于本书篇幅有限，我不会解释如何实现这一点。但请注意，基于上述逐工作表过程获得的聚类结果可能与通过迭代计算得到的结果不同，尽管两种结果都是正确的，这表明可能存在多个最优聚类解。


