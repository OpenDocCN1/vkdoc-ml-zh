    \ 中的决策树分析有了清晰思路之后，再介绍这种方法，能让我们更欣赏它。请按照以下说明操作：\n\n1.  打开 Chapter10-2a.xlsx。其中只有一个名为“level-1”的工作表，该工作表与文件\
    \ Chapter10-1b.xlsx（我们之前处理过的那个）中的工作表 level-1 相同。此工作表如图 10-17 所示。\n\n![](img/494428_2_En_10_Fig17_HTML.jpg)\n\
    \n一张工作表 level-1 的 Excel 截图。它包含 A 到 J 列以及第 2 到 22 行。列标题为：温度、湿度、有风、天气和是否打球。\n\n\
    图 10-17\n\n工作表 level-1 概览\n\n![](img/494428_2_En_10_Fig18_HTML.jpg)\n\n一张 Excel\
    \ 截图，包含 A 到 I 列以及第 1 到 15 行。F 到 I 列的列标题为：温度、湿度、有风和天气。第 2 行的单元格内容为不等号。\n\n图 10-18\n\
    \n数据表的额外设置\n\n1.  分别在单元格 F1、G1、H1 和 I1 中输入文本“温度”、“湿度”、“有风”和“天气”。在单元格 F2:I2 中输入“<>”（不含引号）。“<>”在\
    \ Excel 中表示“不等于”。请参考图 10-18。\n\n![](img/494428_2_En_10_Fig19_HTML.jpg)\n\n一张 Excel\
    \ 截图，展示了计算结果。列标题包括：是、否、p 乘以 log(p) 减去是、p 乘以 log(p) 减去否、加权、熵和信息增益。\n\n图 10-19\n\
    \n更好方法的计算结果\n\n1.  在单元格 B16 中输入以下公式：\n\n```\n    =COUNTIFS(A2:A15,F2,B2:B15, G2,C2:C15,H2,D2:D15,I2)\n\
    \    ```\n\n由于单元格 F2:I2 都包含“<>”，上述公式实际上并未为 COUNTIFS 函数设置任何条件。单元格 B16 中的值仍然是 14。\n\
    \n2.  在单元格 D18 中，将公式修改为：\n\n`=COUNTIFS($E$2:$E$15,C18,$A$2:$A$15,F$2, $B$2:$B$15,G$2,$C$2:$C$15,H$2,$D$2:$D$15,I$2)`\n\
    \n此公式考虑了单元格 F2:I2 中的条件。\n\n3.  从单元格 D18 自动填充到单元格 D19。\n\n4.  在单元格 D22 中，将公式修改为：\n\
    \n```\n    =COUNTIFS(INDEX($A$2:$E$15,0,$A22),$C22, $E$2:$E$15,D$21,$A$2:$A$15,$F$2,$B$2:$B$15,\
    \ $G$2,$C$2:$C$15,$H$2,$D$2:$D$15,$I$2)\n    ```\n\n此公式同样考虑了单元格 F2:I2 中的条件。\n\n\
    5.  从单元格 D22 自动填充到单元格 E22，然后将单元格 D22:E22 一起自动填充到单元格 D31:E31。\n\n此时，此工作表中的所有内容都应自动计算完成。我们工作表的一部分看起来与图\
    \ 10-19 完全一致，这与我们之前的结果相同。\n\n1.  我们将再次拆分节点 rainy(3, 2)。像之前一样，复制工作表 level-1，并将新工作表重命名为\
