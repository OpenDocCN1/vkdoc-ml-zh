    \ Q11 中，输入公式 `=(P11-F11)²`。这是当前参数设置下层 1 的误差。\n\n9.  分别将 P11 和 Q11 自动填充到 P182 和\
    \ Q182。\n\n10.  在单元格 P1 中，输入文本“Error Sum1”。\n\n11.  在单元格 Q1 中，输入公式 `=SUM(Q11:Q182)`。\n\
    \n我们的工作表部分内容应如图 13-16 所示。\n\n![](img/494428_2_En_13_Fig16_HTML.jpg)\n\nExcel 工作表的截图展示了层\
    \ 1 输出和计算出的误差数据。\n\n图 13-16\n\n层 1 输出和误差计算\n\n在神经网络中，每一层都应在将其输出作为输入传递给下一层之前，优化其参数集。这就是我们必须计算层\
    \ 1 的输出和误差总和的原因。我们需要使用求解器，通过最小化层 1 的误差总和来优化层 1 的参数。\n\n12.  单击“数据”➤“求解器”；按图 13-17\
    \ 所示设置求解器的参数。取消选中“使无约束变量为非负数”。单击“求解”。\n\n![](img/494428_2_En_13_Fig20_HTML.jpg)\n"
- fmt: '# An Excel sheet illustrates the calculated errors.


    **Figure 13-20** Errors calculated


    1. On the upcoming menu, make sure the option “Keep Solver Solution” is chosen.
    By now, our result looks like Figure [13-18](#494428_2_En_13_Chapter.xhtml#Fig18).


    ![](images/494428_2_En_13_Chapter/494428_2_En_13_Fig18_HTML.jpg)


    **Figure 13-18** Only layer 1 parameters are optimized


    The transformed data of layer 1 is the input for layer 2 neurons. Follow these
    instructions to complete layer 2 input aggregation and data transformation:


    2. Merge cells `R9:T9`; enter “2nd hidden layer aggregation” inside the merged
    cell.

    3. Enter numbers 1, 2, and 3 in cells `R10`, `S10`, and `T10`, respectively.

    4. In cell `R11`, enter the following formula:


    ```

    =SUMPRODUCT($M11:$O11,INDEX($I$2:$K$4,R$10, 0))+INDEX($L$2:$L$4,R$10,1)

    ```


    This formula aggregates layer 1’s transformed data by using the function `SUMPRODUCT`.
    Its mathematical equation is similar to `y = w1x2 + w2x2 + w3x3 + b`.


    5. Autofill cell `R11` to cell `T11`, and then autofill together to cells `R182:T182`.

    6. We are going to make use of sigmoid function again to transform the layer 2
    data. However, we do not want to normalize the data again. We can certainly normalize
    the data again into range [-1, 1] before applying sigmoid transformation if we
    so desired. Merge cells `U9:W9`; enter “2nd layer transformation” in the merged
    cell.

    7. Enter numbers 1, 2, and 3 in cells `U10`, `V10`, and `W10`, respectively.

    8. Enter the formula `=1/(1+EXP(-R11))` in cell `U11`, autofill to cell `W11`,
    and then autofill together to cells `U182:W182`.

    9. Enter “Output-2” in cell `X10`.

    10. Enter “Error-2” in cell `Y10`.


    Part of our worksheet looks like Figure [13-19](#494428_2_En_13_Chapter.xhtml#Fig19).


    ![](images/494428_2_En_13_Chapter/494428_2_En_13_Fig19_HTML.jpg)


    **Figure 13-19** Layer 2 data transformation without normalization


    The following instructions guide us how to continue:


    11. In cell `X11`, enter the formula `=MMULT(U11:W11,$M$2:$M$4)+$N$2` to generate
    output.

    12. Autofill from `X11` to `X182`.

    13. In cell `Y11`, enter the formula `=(F11-X11)^2` to calculate the error.

    14. Autofill from `Y11` to `Y182`.

    15. In cell `S1`, enter “Error Sum2”.

    16. In cell `T1`, enter the formula `=SUM(Y11:Y182)`.


    Part of our worksheet looks like Figure [13-20](#494428_2_En_13_Chapter.xhtml#Fig20).


    1. Let’s use Solver again to optimize all the weights and biases. Click **Data**
    ➤ **Solver** to start the Solver and set up the Solver parameters as shown in
    Figure [13-21](#494428_2_En_13_Chapter.xhtml#Fig21).


    ![](images/494428_2_En_13_Chapter/494428_2_En_13_Fig21_HTML.jpg)


    **Figure 13-21** Use Solver again to optimize the parameter set of all layers


    After the optimization of the weights and biases by Solver, part of our worksheet
    looks like Figure [13-22](#494428_2_En_13_Chapter.xhtml#Fig22). Since the model
    becomes more complicated, your result may look slightly different from that in
    Figure [13-22](#494428_2_En_13_Chapter.xhtml#Fig22). Don’t be surprised.


    ![](images/494428_2_En_13_Chapter/494428_2_En_13_Fig22_HTML.jpg)


    **Figure 13-22** Optimize all parameters by Solver


    As usual, we now need to set up the cutoff. Follow these instructions:


    2. Enter “mean” in cell `S6` and “count” in cell `S7`.

    3. Enter numbers 39, 69, and 84 in cells `T5`, `U5`, and `V5`.

    4. Enter “cutoff” in cell `W5` and “missed” in cell `X5`.

    5. Enter the formula `=AVERAGEIFS($X$11:$X$182,$F$11:$F$182,T$5)` in cell `T6`.
    This formula calculates the Output mean for those samples whose Class values equal
    to 39. Autofill from `T6` to `V6`.

    6. Enter the formula `=COUNTIFS($F$11:$F$182,T$5)` in cell `T7`. This counts the
    number of samples whose Class values equal to 39. Autofill from `T7` to `V7`.

    7. Enter the formula `=(T6*T7+U6*U7)/(T7+U7)` in cell `W6`. This is the cutoff
    between the two classes 39 and 69.

    8. Enter the formula `=(U6*U7+V6*V7)/(U7+V7)` in cell `W7`. This is the cutoff
    to differentiate the two classes 69 and 84.


    Part of our worksheet looks exactly like Figure [13-23](#494428_2_En_13_Chapter.xhtml#Fig23).


    ![](images/494428_2_En_13_Chapter/494428_2_En_13_Fig23_HTML.jpg)


    **Figure 13-23** Cutoff for the neural network model with two hidden layers


    We want to use the training data to estimate how well our model is. As our data
    size is not large, we are not performing a cross-validation here.


    9. Enter “Predict” in cell `Z10` and “Diff” in cell `AA10`.

    10. Enter the formula `=IF(X11<$W$6,39,IF(X11<$W$7,69,84))` in cell `Z11`. This
    formula categorizes each sample based on the Output value and the two cutoff values.
    Autofill from `Z11` to `Z182`.

    11. Enter the formula `=IF(F11=Z11,0,1)` in cell `AA11`. This formula returns
    0 if the predicted class type is the same as the existing class type; otherwise,
    it returns 1. Autofill from `AA11` to `AA182`.

    12. Enter the formula `=SUM(AA11:AA182)` in cell `X6`. This formula counts how
    many predicted class types are incorrect.


    Our result should be similar as Figure [13-24](#494428_2_En_13_Chapter.xhtml#Fig24).
    Our neural network with two hidden layers incorrectly predicted 48 out of 172
    samples.


    ![](images/494428_2_En_13_Chapter/494428_2_En_13_Fig24_HTML.jpg)


    **Figure 13-24** The neural network incorrectly predicted 48 samples


    You may obtain a result slightly different from what is shown in Figure [13-24](#494428_2_En_13_Chapter.xhtml#Fig24).
    If so, don’t be surprised. This difference is caused by Solver. We have been experiencing
    Solver in learning data mining through Excel. Solver is a mathematical optimization
    tool that can sometimes generate slightly different results due to its internal
    algorithm. If your Excel is using a newer version of Solver, your model may have
    a better performance.


    The next step in this experiment is to make prediction on the scoring dataset.
    Follow these instructions:


    13. Select cells `G182:X182`. Autofill to cells `G190:X190`.

    14. Autofill from cell `Z182` to `Z190`.


    The predicted results look similar to Figure [13-25](#494428_2_En_13_Chapter.xhtml#Fig25).


    ![](images/494428_2_En_13_Chapter/494428_2_En_13_Fig25_HTML.jpg)


    **Figure 13-25** The predicted class types for the scoring dataset


    We may have quite a few questions about the preceding experiment process. For
    example, we may ask why we need to generate `output-1`, `error-1`, `output-2`,
    and `error-2` to optimize layer 1 and layer 2 parameters separately. That is a
    good question. We can certainly practice this neural network model a little differently,
    for example, without optimizing layer 1 parameters first. In fact, we might even
    get a better result. This is the advantage of using Excel to learn data mining
    methods, especially those complex ones. Because we have a clear image about every
    step, we may raise various questions in the learning process and some of them
    may help reform and improve certain data mining algorithms.


    We can also make use of a different transformation function in hidden layer 2.
    It would be easy to test in Excel if using a different transformation function
    (such as the rectified linear unit function) in a different layer can improve
    the model result. This is a good exercise to try out.


    This wraps up the study of artificial neural networks in Excel. Please find the
    final result in `Chapter13-2b.xlsx`.'
