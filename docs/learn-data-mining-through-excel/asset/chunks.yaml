    ## 强化练习


    你可能已经意识到，通过 Excel 完成层次聚类和树状图容易出错，因为需要大量手动操作。当数据点数量增加时尤其如此。正如我之前提到的，减少错误的一种方法是通过复制工作工作表来保持中间步骤的完整性，类似于我们在
    k-means 聚类中所做的。


    我们能否通过 Excel 对数百个数据点进行层次聚类？当然可以。但我们必须首先借助 k-means 聚类。思路是先在较大的数据集上应用 k-means 聚类（例如，`k=7`），然后将每个聚类视为一个数据点，开始进行层次聚类。


    *   `Chapter8-HW-1.xlsx`文件为你提供了练习层次聚类和绘制树状图的机会。需要帮助时，请参考`Chapter8-HW-1-withAnswers.xlsx`。


    *   `Chapter8-HW-2.xlsx`允许你使用更大的数据集练习层次聚类，因此你需要先应用 k-means 聚类。`Chapter8-HW-2-withAnswers.xlsx`展示了如何实现这一点。`Chapter8-HW-2-withAnswers.xlsx`还通过保持中间步骤的完整性展示了层次聚类过程。


