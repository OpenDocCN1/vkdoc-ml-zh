- fmt: '对于属性`Outlook`，有3个值（状态）：`overcast`、`rainy`和`sunny`；每个值分别有4、5和5个数据点。考虑`overcast`，4个`overcast`匹配4个`Yes`和0个`No`。因此：


    ```

    H-outlook-overcast = -(4/4×log2(4/4)+0/4×log2(0/4)) = 0.0

    ```


    注意，此处`log2(0) = 0`。


    类似地，5个`rainy`匹配3个`Yes`和2个`No`，5个`sunny`匹配2个`Yes`和3个`No`。因此：


    ```

    H-outlook-rainy = -(3/5×log2(3/5)+2/5×log2(2/5)) = 0.97

    H-outlook-sunny = -(2/5×log2(2/5)+3/5×log2(3/5)) = 0.97

    ```


    三个子熵值在求和之前必须加权。`overcast`、`rainy`和`sunny`的权重分别为`4/14`、`5/14`和`5/14`。因此：


    ```

    H-outlook = 4/14×0.0+5/14×0.97+5/14×0.97 = 0.69

    ```


    对`Temperature`、`Humidity`和`Windy`继续此计算，我们得到：


    ```

    H-temperature = 0.91

    H-humidity = 0.79

    H-windy = 0.89

    ```


    这里引入另一个概念：“信息增益”（`information gain`），它表示基于某个属性划分当前数据集可以获取多少信息。其定义为目标变量的熵与某个属性的熵之差。例如，`Outlook`的信息增益
    = `0.94 – 0.69 = 0.25`。


    信息增益可能会偏向于具有更多值的属性。为减少这种偏差，可以使用“增益率”（`gain ratio`）。一个属性的增益率定义为：


    *   属性增益率 = 属性信息增益 / 属性固有信息


    属性的固有信息通过公式（[10-2](#494428_2_En_10_Chapter.xhtml#Equ2)）计算：


    ![$$ S=-\sum \limits_{k=1}^C\frac{N_k}{N}{\log}_2\left(\frac{N_k}{N}\right) $$](images/494428_2_En_10_Chapter/494428_2_En_10_Chapter_TeX_Equ2.png)


    （10-2）


    在公式（[10-2](#494428_2_En_10_Chapter.xhtml#Equ2)）中，`N`表示数据大小，`N[k]`是给定属性值的数据点数量，而`C`是某个属性的不同值的数量。


    让我们再次以属性`Outlook`为例来实现公式（[10-2](#494428_2_En_10_Chapter.xhtml#Equ2)）。


    *   `Outlook`有三个不同的值：`overcast`、`rainy`和`sunny`。所以，`C = 3`。

    *   有4个`overcast`；因此，`N-overcast = 4`。

    *   类似地，`N-rainy = 5`且`N-sunny = 5`。


    属性`Outlook`的固有信息计算如下：


    ```

    S-outlook

    = -(4/14×Log2(4/14)+5/14×Log2(5/14)+5/14×Log2(5/14))

    = 1.58

    ```


    属性`Outlook`的最终增益率`= (0.94–0.69)/1.58 = 0.16`。


    由于在我们的决策树示例中，信息增益是节点分裂的一个良好度量，我们不会为每个属性计算增益率。相反，选择具有最大信息增益的属性来分裂树节点。在这种情况下，选择`Outlook`根据其三个值（`overcast`、`rainy`和`sunny`）将树节点分裂为三个子节点。


    由于`overcast`节点的熵为`0.0`，它必须是一个叶节点。另外两个节点，`rainy`节点和`sunny`节点，可以基于`Temperature`、`Windy`或`Humidity`进一步划分。


