  trans: "\n2.  自动填充单元格 G2 至 G152。一旦我们获得了每个数据点的预测值，下一步需要找到临界值，以便将每个预测值分类到特定的鸢尾花类型中。\n\
    \n3.  在单元格 K11、L11 和 M11 中，分别输入“均值”、“样本数量”和“临界值”（不含引号）。\n\n4.  在单元格 K12 中，输入以下公式：\n\
    \n```\n    =AVERAGEIFS(G$2:G$151,F$2:F$151,K1)\n    ```\n\n此公式计算 Iris-setosa 预测值的均值。\n\
    \n5.  自动填充 K12 至 K14。Iris-versicolor 和 Iris-virginica 的预测值均值分别存储在单元格 K13 和 K14\
    \ 中。\n\n6.  在单元格 L12 中，输入公式：\n\n```\n    =COUNTIFS(F$2:F$151,K1)\n    ```\n\n\
    此公式统计训练数据集中 Iris-setosa 的数量。\n\n7.  自动填充 L12 至 L14。单元格 L13 和 L14 分别存储 Iris-versicolor\
    \ 和 Iris-virginica 的数量。\n\n8.  在单元格 M12 中，输入公式计算第一个临界值：\n\n```\n    =(K12*L12+K13*L13)/(L12+L13)\n\
    \    ```\n\n9.  自动填充 M12 至 M13。不要自动填充到单元格 M14。基于这两个临界值，每个预测数值都可以转换为一种鸢尾花类型。工作表的一部分如图\
    \ 4-10 所示。\n\n1.  在单元格 H1 中，输入“类型分类”。\n\n2.  在单元格 H2 中，输入以下公式，然后从 H2 自动填充至 H152：\n\
    \n```\n    =IF(G2<M$12,L$1,IF(G2<M$13,L$2,L$3))\n    ```\n\n此公式将 G 列中的每个数值转换为一种鸢尾花类型。快速浏览结果即可发现，大多数鸢尾花类型都被正确分类。\n\
    \n3.  要统计有多少个鸢尾花数据点被错误分类，请在单元格 I1 中输入“差异”。\n\n4.  在 I2 中，输入以下公式：\n\n```\n    =IF(A2=H2,0,1)\n\
    \    ```\n\n此公式将已知的鸢尾花类型与分类后的鸢尾花类型进行比较。如果发现不匹配，则返回 1。\n\n5.  自动填充单元格 I2 至 I152。\n\
    \n6.  选中单元格 K16 和 L16，合并这两个单元格，并在合并后的单元格中输入文本“差异 =”。\n\n7.  在单元格 M16 中，输入公式 `=SUM(I2:I151)`。公式的一部分应如图\
    \ 4-11 所示。\n\n![](img/494428_2_En_4_Fig11_HTML.jpg)\n\n一张 Excel 表格截图，显示 14 行和\
    \ 7 列。表格包含诸如类型分类、差异、均值、样本数量和临界值等标签。\n\n图 4-11\n\n对鸢尾花训练数据集的 LDA 分析\n\n本次 LDA 分析相当成功，尽管仍有四个鸢尾花数据点被错误分类。请注意，数据挖掘方法在训练数据集上遗漏少量数据点是常见现象。然而，一般来说，我们不应使用同一训练数据集来评估模型性能的好坏。一个在相同训练数据集上实现完美分类或预测的模型可能暗示过拟合，这意味着模型过于针对训练数据，但很可能在未知的评分数据上失效。\n\
    \n如果在单元格 K1:L3 中，我们将 Iris-virginica 赋值为 0，Iris-versicolor 赋值为 1，Iris-setosa 赋值为\
    \ 2，将会得到非常相似的结果。但是，如果在单元格 K1:L3 中，我们将 Iris-virginica 赋值为 0，Iris-setosa 赋值为 1，Iris-versicolor\
    \ 赋值为 2，就会发现分类结果完全混乱。这是在 Excel 中进行 LDA 分析的一个缺点。\n\n构建好第一个模型（即找到初始线性函数 P）后，我们可以根据\
    \ x1、x2、x3 和 x4 预测鸢尾花类型。我们可以在文件 Chapter4-1b.xlsx 的工作表 iris-LINEST 中查看这些预测结果。\n\
    \n方程 (4-3) 要求最大化 Sg/Sw 的比值。为此，我们需要使用规划求解。请注意，我们可以直接使用规划求解获得优化后的参数集，而无需先使用 LINEST。然而，在\
    \ LDA 中，在应用规划求解之前先使用最小二乘法是一个好主意。\n\n*通过以下分步说明继续学习：*\n\n![](img/494428_2_En_4_Fig12_HTML.jpg)\n"
- fmt: "A screenshot of excel sheet displays 20 rows and 4 columns. A sheet includes\
    \ labels such as within g variances, Difference, mean, sample number, and cutoff.\n\
    \n**Figure 4-12**\n\n**Variances computed**\n\n1.  In cells `K18`, `K19`, and\
    \ `K20`, type “Inter-group variance”, “Within-group variance”, and “inter/within\
    \ ratio”, respectively.\n\n2.  Enter the following formula in cell `L18`:\n\n\
    \    ```\n    =(K12-AVERAGE(K12:K14))^2+(K13-AVERAGE(K12:K14))^2+(K14-AVERAGE(K12:K14))^2\n\
    \    ```\n\n    This formula computes the variance among group means, that is,\
    \ the `Sg` as shown in Equation ([4-1](#494428_2_En_4_Chapter.xhtml#Equ1)). The\
    \ larger this value, the higher the separability among groups. Note, cells `K12`,\
    \ `K13`, and `K14` reference the within-group means.\n\n3.  We must compute the\
    \ variance of each data point in their belonging group first before computing\
    \ the within-group variance. Enter “Within-g variances” in cell `J1`, then enter\
    \ the following formula in cell `J2`:\n\n    ```\n    =IF(F2=K$1,(G2-K$12)^2,IF(F2=K$2,\
    \ (G2-K$13)^2,(G2-K$14)^2))\n    ```\n\n    In this formula, column `F` is used\
    \ to determine which group each data point lies in. Note that column `F` represents\
    \ the true group each data point belongs. LDA is a supervised classification method;\
    \ it is more accurate to use column `F` than column `G` here. If `F2 = K1`, then\
    \ the within-group variance of the corresponding data point is computed by the\
    \ expression `(G2-K12)^2`. If not but `F2 = K2`, the variance is computed via\
    \ the expression `(G2-K13)^2`; otherwise, use the expression `(G2-K14)^2`.\n\n\
    4.  Autofill cells `J2` to `J152`.\n\n5.  Enter the formula `=SUM(J1:J152)` in\
    \ cell `L19`. This is the `S[w]` value as shown in Equation ([4-2](#494428_2_En_4_Chapter.xhtml#Equ2)).\n\
    \n6.  Enter the formula `=L18/L19` in cell `L20`. This is the `Sg(P)/Sw(P)` that\
    \ needs to be maximized by Solver. By now, part of our worksheet looks like Figure\
    \ [4-12](#494428_2_En_4_Chapter.xhtml#Fig12).\n\n![](images/494428_2_En_4_Chapter/494428_2_En_4_Fig13_HTML.jpg)\n\
    \nA screenshot of excel sheet with menu which highlights data and solver options.\n\
    \n**Figure 4-13**\n\n**Using Excel Solver**\n\n1.  Copy the content of cells `M5:M9`\
    \ to cells `N5:N9` by value only. Remember to make use of the Excel feature “Paste\
    \ Special”. We are going to use Solver to optimize these values in cells `M5:M9`.\
    \ Before doing that, we would like to make a copy of them so that we can tell\
    \ the changes after using Solver. At this point, take a look at the values in\
    \ cells `L18` and `L19`; try to remember them.\n\n2.  Click the menu tab Data;\
    \ locate the Solver as shown in Figure [4-13](#494428_2_En_4_Chapter.xhtml#Fig13).\n\
    \n![](images/494428_2_En_4_Chapter/494428_2_En_4_Fig14_HTML.jpg)\n\nA screenshot\
    \ of solver parameters dialogue box highlights dollar L dollar 20, max and by\
    \ changing variable cells dollar M dollar 5 colon dollar M dollar 9\\. 2 arrows\
    \ points G R G nonlinear and solve button.\n\n**Figure 4-14**\n\n**Using Excel\
    \ Solver to optimize the parameters for function P**\n\n1.  Click Solver. On the\
    \ upcoming menu, specify the values exactly as shown in Figure [4-14](#494428_2_En_4_Chapter.xhtml#Fig14).\
    \ Set Objective indicates the value to be optimized. In this case, we need the\
    \ value in `L20` to be maximized. The Solver is requested to maximize `L20` by\
    \ changing values in cells `M5:M9`. The selected Solving Method is GRG Nonlinear.\n\
    \n![](images/494428_2_En_4_Chapter/494428_2_En_4_Fig15_HTML.jpg)\n\nA screen displaying\
    \ the Solver Results dialog box, which indicates that the solver has converged\
    \ to the current solution, with all constraints satisfied.\n\n**Figure 4-15**\n\
    \n**Keep Solver Solution**\n\n1.  After clicking Solve, click OK on the upcoming\
    \ menu as demonstrated in Figure [4-15](#494428_2_En_4_Chapter.xhtml#Fig15).\n\
    \nThe values inside cells `M5:M9` are changed, and the value in cell `M16` is\
    \ changed to 2 from 4. This is shown in Figure [4-16](#494428_2_En_4_Chapter.xhtml#Fig16).\n\
    \n![](images/494428_2_En_4_Chapter/494428_2_En_4_Fig16_HTML.jpg)\n\nA screenshot\
    \ of excel sheet with 4 columns and 16 rows. Labels are mean, sample number, cutoff,\
    \ obtained by solver and optimized by linest.\n\n**Figure 4-16**\n\n**Solver further\
    \ improves the LDA model**\n\nThough the new parameter set slightly improves the\
    \ classification results, we need to pay close attention to the changes happened\
    \ in cells `K12:K14` and `L18:L20` as shown in Figure [4-17](#494428_2_En_4_Chapter.xhtml#Fig17).\
