  trans: "\n## 通过 Excel 学习文本挖掘\n\n让我们切换到 Excel 来练习一个文本挖掘的示例。打开文件 Chapter14-1a.xlsx。其中包含两个工作表。名为“dictionary”的工作表包含一些停用词和一些正面与负面关键词（在工作表中称为极性词）。请注意，这些词汇仅为本次文本挖掘演示而专门收集。图\
    \ 14-1 展示了“dictionary”工作表的一部分。\n\n![](img/494428_2_En_14_Fig1_HTML.jpg)\n\n一个包含\
    \ 3 列 22 行的表格截图。列标题分别为极性词、极性得分和停用词。极性词包括：not、amazing、best、cozy、delightful、enjoy、excellent、fantastic、good、lovely\
    \ 等。\n\n图 14-1\n\n部分极性关键词及其否定形式，以及部分停用词\n\n如图 14-1 所示，dictionary 工作表中的 D 列存储了一些停用词。A\
    \ 列存储了正面和负面的单个关键词及其否定形式的二元词组。B 列存储了每个关键词对应的得分。请注意，“not”被指定为负面关键词（单元格 A2），得分为 -1。除了关键词“not”之外，图\
    \ 14-1 中所有其他单个关键词都是正面的。它们的否定二元词组都被分配了 -1 的得分。为什么？让我用短句“It is not amazing”为例来解释。对于短句“It\
    \ is not amazing”，两个单个关键词“not”和“amazing”分别产生 -1 和 1。二元词组“not amazing”给出 -1；因此，这个短句的总得分等于\
    \ −1 + 1 − 1 = −1：负面。\n\n![](img/494428_2_En_14_Fig2_HTML.jpg)\n\n一个表格的截图。该表格包含两列和二十行。行条目为否定二元词组及其得分。否定词组包括：bad、difficult、expensive、outrageous、ridiculous、rude、sick、terrible、unhappy、unpleasant、not\
    \ bad 等。\n\n图 14-2\n\n单个负面关键词及其否定二元词组\n\n如图 14-2 所示，分配给单个负面关键词的二元词组的得分均为 2。例如，“not\
    \ bad”的得分为 2。为什么？考虑短句“It is not bad”。“not”和“bad”都返回 -1，而“not bad”返回 2。因此，这个短句的总得分为\
    \ −1 − 1 + 2 = 0：中性。\n\n请记住，上述得分分配仅适用于本次文本挖掘任务。我们当然可以根据其他偏好修改“dictionary”。例如，如果我们希望“not\
    \ bad”是正面的，那么我们可以将二元词组“not bad”的得分设为 3。这里使用的评分系统只是一个示例。\n\n为了方便使用这些关键词和停用词，我们希望对它们进行命名。点击主选项卡“公式”➤\
    \ 在出现的菜单中点击“名称管理器”➤ 点击“新建”按钮。此过程在图 14-3 中进行了说明。请注意，名称管理器自 Excel 2010 起可用。\n\n\
    ![](img/494428_2_En_14_Fig3_HTML.jpg)\n\n一个 Excel 选项卡的截图，展示了如何为关键词创建名称。点击主选项卡“公式”，然后在出现的菜单中点击“名称管理器”，接着点击“新建”按钮。文本说明：当此菜单出现时，点击“新建”按钮。\n\
    \n图 14-3\n\n为关键词和停用词创建名称\n\n如图 14-3 所示，点击“新建…”按钮会弹出另一个小菜单，如图 14-4 所示。由于关键词位于数组\
    \ A2:A56 中，“引用位置”设置为 `=dictionary!$A$2:$A$56`。在“名称”中输入“kw”。\n\n请注意，“范围”是工作簿。这表明名称\
    \ kw 在每个工作表中都可访问。点击“确定”。\n\n![](img/494428_2_En_14_Fig4_HTML.jpg)\n\n新建名称对话框的截图，其中包含名称（kw）、范围（工作簿）、备注（请确保范围是工作簿，如图所示）和引用位置。右下角是“确定”和“取消”按钮。“确定”按钮高亮显示。\n\
    \n图 14-4\n\n为关键词数组命名\n\n点击“确定”按钮后，图 14-3 中的菜单将更新为图 14-5 所示。\n\n![](img/494428_2_En_14_Fig5_HTML.jpg)\n\
    \n名称管理器选项卡的截图，展示了关键词数组被命名为 kw 后的名称、值、引用位置、范围和备注。底部是“引用位置”选项和一个“关闭”按钮。\n\n图 14-5\n\
    \n关键词数组被命名为 kw 之后\n\n继续分别为关键词得分数组（在工作表中称为“极性得分”）和停用词数组命名，如图 14-6 所示。\n\n![](img/494428_2_En_14_Fig6_HTML.jpg)\n\
    \n新建名称对话框 kws 的截图。其范围是工作簿，并带有备注和引用位置窗格。新建名称对话框 stw 的截图。其范围是工作簿，并带有备注和引用位置窗格。每个框的右下角都有“确定”和“取消”按钮。“确定”按钮高亮显示。\n\
    \n图 14-6\n\n为关键词得分和停用词命名\n\n确保关键词得分被命名为“kws”，停用词被命名为“stw”。名称管理器最终显示的命名情况如图 14-7\
    \ 所示。\n\n![](img/494428_2_En_14_Fig7_HTML.jpg)\n\n名称管理器选项卡的截图，展示了关键词数组被命名为 kw、kws\
    \ 和 stw 后的名称、值、引用位置、范围和备注。底部是“引用位置”选项和一个“关闭”按钮。\n\n图 14-7\n\n确认命名\n\n通过命名这些数组，我们现在可以通过名称“kw”引用关键词，通过“kws”引用关键词得分，通过“stw”引用停用词。\n\
    \n名为“hotelReview”的工作表中有 34 条评论。它们位于单元格 A1:A34 中。请仔细查看它们。图 14-8 展示了部分评论。\n\n![](img/494428_2_En_14_Fig8_HTML.jpg)\n\
    \n酒店评论的截图，例如：酒店很棒，环境很好，舒适，早餐有高品质的产品但选择不多，价格与你所得到的相比极其荒谬，10 星，一切都好，等等。\n\n图 14-8\n\
    \n评论概览\n\n按照以下步骤完成我们的文本挖掘练习：\n\n![](img/494428_2_En_14_Fig9_HTML.jpg)\n\n一个包含\
    \ 3 列 8 行的截图。它展示了相同的酒店评论，例如：酒店很棒，环境很好，舒适，早餐有高品质的产品但选择不多，价格与你所得到的相比极其荒谬，我们会再来的，一点也不差，等等。\n\
    \n图 14-9\n\n粘贴数值后的工作表\n\n1.  正如我们所学，我们需要将所有单词转换为小写，并修剪每个句子两端的空格。在单元格 B1 中输入公式\
    \ =TRIM(LOWER(A1))，然后自动填充到单元格 B34。此公式将文本转换为小写，并修剪掉前导和尾随的空白空格。\n\n2.  有些句子以感叹号结尾。为了移除感叹号，请在单元格\
    \ C1 中输入以下公式：\n\n```\n    =IF(MID(B1,LEN(B1),1)=\"!\", TRIM(LEFT(B1,LEN(B1)-1)),B1)\n\
    \    ```\n\n`LEN(B1)` 返回单元格 B1 中文本的长度。`MID(B1,LEN(B1),1)` 选取 B1 中文本的最后一个字符。如果最后一个字符是“!”，`LEFT(B1,LEN(B1)-1)`\
    \ 通过取除最后一个字符外的所有字符来移除“!”。如果最后一个字符不是“!”，则取 B1 中的原内容。\n\n注意：移除“!”后，`TRIM(LEFT(B1,LEN(B1)-1))`\
    \ 会再次修剪可能存在的空格。\n"
- fmt: "3. Before we tokenize the words, we need to copy the sentences in column C\
    \ into column D via Paste Special (paste values). If we don’t, the Excel feature\
    \ `Text to Columns` we are going to employ will split the formulas instead of\
    \ the text values in column C. Let’s copy and paste cells `C1:C34` to column D\
    \ by values. Part of our worksheet looks like Figure [14-9](#494428_2_En_14_Chapter.xhtml#Fig9).\n\
    \n![](images/494428_2_En_14_Chapter/494428_2_En_14_Fig10_HTML.jpg)\n\nA screenshot\
    \ of the tool tab `Text to Columns` is under the main tab `Data` in Excel. Once\
    \ clicking the main tab `Data`, the tool tab `Text to Columns` exhibits with data\
    \ tools.\n\n**Figure 14-10**  \nThe tool tab `Text to Columns` is under the main\
    \ tab `Data`\n\n1. The tool tab `Text to Columns` is under the main tab `Data`\
    \ in Excel. Once clicking the main tab `Data`, the tool tab `Text to Columns`\
    \ shows up. Refer to Figure [14-10](#494428_2_En_14_Chapter.xhtml#Fig10).\n\n\
    ![](images/494428_2_En_14_Chapter/494428_2_En_14_Fig11_HTML.jpg)\n\nA screenshot\
    \ of the convert text to columns wizard step 1 of 3. Choose the file type that\
    \ best describes the data as delimited. The next button is highlighted.\n\n**Figure\
    \ 14-11**  \nChoose delimited and click Next\n\n1. Select column D and click the\
    \ tool tab `Text to Columns`; a menu shows up. Choose `Delimited` as shown in\
    \ Figure [14-11](#494428_2_En_14_Chapter.xhtml#Fig11).\n\n![](images/494428_2_En_14_Chapter/494428_2_En_14_Fig12_HTML.jpg)\n\
    \nA screenshot of the convert text to columns wizard step 2 of 3. Choose the delimiters\
    \ such as tab, semicolon, comma, space, and others. Tick the checkbox of treat\
    \ consecutive delimiters as one. The next button is highlighted.\n\n**Figure 14-12**\
    \  \nSplit the sentence into words by delimiters\n\n1. Click Next; on the next\
    \ menu, select all delimiters and enter period `.` in the box next to `Other`,\
    \ as illustrated in Figure [14-12](#494428_2_En_14_Chapter.xhtml#Fig12).\n\n1.\
    \ On the next menu, click Finish as shown in Figure [14-13](#494428_2_En_14_Chapter.xhtml#Fig13).\
    \ Note: the destination is cell `D1`. By selecting `D1` as the destination, the\
    \ tokenized words will be placed in an area starting from column D. This indicates\
    \ that the original texts inside column D will be replaced.\n\n![](images/494428_2_En_14_Chapter/494428_2_En_14_Fig13_HTML.jpg)\n\
    \nA screenshot of the convert text to columns wizard step 3 of 3. Choose the column\
    \ data format as general and destinations as `$D$1`. Select the general in the\
    \ data preview. The next button is highlighted.\n\n**Figure 14-13**  \nDestination\
    \ is `D1`\n\nBy now, part of our worksheet looks like Figure [14-14](#494428_2_En_14_Chapter.xhtml#Fig14).\n\
    \n![](images/494428_2_En_14_Chapter/494428_2_En_14_Fig14_HTML.jpg)\n\nA screenshot\
    \ of a table of some hotel tokenized words. The table consists of ten columns\
    \ and eight rows. The tokenized words are the, cozy, wonderful, best, back, hotels,\
    \ fantastic, environment, choice, great, utterly, ridiculous, products, has, a,\
    \ get, and others.\n\n**Figure 14-14**  \nA glance of the tokenized words\n\n\
    ![](images/494428_2_En_14_Chapter/494428_2_En_14_Fig15_HTML.jpg)\n\nA screenshot\
    \ of a table of stop words that are replaced by empty spaces. The table consists\
    \ of ten columns and eight rows. The words are cozy, wonderful, best, back, hotels,\
    \ fantastic, environment, choice, great, utterly, ridiculous, products, what,\
    \ you, and others.\n\n**Figure 14-15**  \nStop words are replaced by empty space\n\
    \n1. Our next step is to remove the stop words. To do so, we need to replace every\
    \ stop word with empty space first. The rightmost column of the tokenized words\
    \ is column N, so in cell `O1`, enter the following formula:\n\n```\n=IF(OR(ISBLANK(D1),COUNTIFS(stw,D1)>0),\"\
    \",D1)\n```\n\nSome sentences are shorter, and some are longer. This leaves some\
    \ blank cells in the working range as shown in Figure [14-14](#494428_2_En_14_Chapter.xhtml#Fig14).\n\
    \n`ISBLANK(D1)` evaluates if `D1` is a blank cell. `COUNTIFS(stw,D1)>0` evaluates\
    \ if `D1` is a stop word. `OR(ISBLANK(D1),COUNTIFS(stw,D1)>0)` returns `TRUE`\
    \ if at least one evaluation is `TRUE`. In this case, the cell `O1` is assigned\
    \ an empty space. Otherwise, cell `O1` is given whatever inside cell `D1`.\n\n\
    It is a common technique to remove words of a short length, for example, removing\
    \ all words of length 3 or less. We do not implement this technique in our exercise,\
    \ however.\n\n2. Autofill from cells `O1` to `O34`, then autofill together to\
    \ cells `Y1:Y34`. Part of our worksheet looks like Figure [14-15](#494428_2_En_14_Chapter.xhtml#Fig15).\n\
    \n![](images/494428_2_En_14_Chapter/494428_2_En_14_Fig16_HTML.jpg)\n\nA screenshot\
    \ of the hotel review after removing stop words from the sentence. The reviews\
    \ are hotel fantastic, environment great, cozy, breakfast has high-quality products\
    \ but lacks choice, price utterly ridiculous what you get, what wonderful hotel,\
    \ not bad all, come back, and one best hotels.\n\n**Figure 14-16**  \nAfter removing\
    \ stop words\n\n1. To remove the stop words, our plan is to make blank the cells\
    \ containing stop words, then concatenate remaining words for each sentence, and\
    \ then apply `Text to Columns` to retokenize. Leave column Z untouched. In cell\
    \ `AA1`, enter the following formula:\n\n```\n=IF(ISBLANK(O1)=FALSE,TRIM(Z1 &\
    \ \" \" & O1), TRIM(Z1 & \"\"))\n```\n\nWhen we autofill this formula horizontally,\
    \ it accumulates the texts in cells but skips blank cells. As column Z is left\
    \ untouched, cells in column Z are all blank cells. If `ISBLANK(O1)=FALSE`, that\
    \ is, cell `O1` is not a blank cell, concatenate the cell before `AA1` (`Z1`)\
    \ with `O1`. Otherwise, only keep in cell `AA1` whatever the cell before `AA1`\
    \ has.\n\nSince Office 2019 or Office 365, Excel has a new function named `TEXTJOIN`\
    \ which can:\n- Concatenate the texts from multiple ranges\n- Ignore empty cells\n\
    - And insert a desired delimiter\n\nThe function `TEXTJOIN` is definitely a much\
    \ better choice than the preceding formula if it is available in your Excel. Assume\
    \ that it is available, then:\n- Ignore the preceding formula.\n- Enter the formula\
    \ `=TEXTJOIN(\" \",TRUE,O1:Y1)` in cell `AK1`.\n- Autofill from cell `AK1` to\
    \ cell `AK34`.\n- And skip the following step (step 11).\n\n2. Autofill from cell\
    \ `AA1` to cell `AK1` and then autofill together to cells `AA34:AK34`. Column\
    \ `AK` keeps the sentences without stop words. Check Figure [14-16](#494428_2_En_14_Chapter.xhtml#Fig16).\n\
    \n![](images/494428_2_En_14_Chapter/494428_2_En_14_Fig17_HTML.jpg)\n\nA screenshot\
    \ of a table of some hotel retokenized words. The table consists of ten columns\
    \ and eleven rows. The retokenized words are cozy, wonderful, best, back, hotels,\
    \ fantastic, environment, choice, great, utterly, ridiculous, products, have,\
    \ all, get, and others.\n\n**Figure 14-17**  \nRetokenized words\n\n1. Copy cells\
    \ `AK1:AK34` and paste values only to column `AL`.\n\n2. Use tool tab `Text to\
    \ Columns` to tokenize the texts inside column `AL`. Refer to steps 4–7. Part\
    \ of our worksheet looks like Figure [14-17](#494428_2_En_14_Chapter.xhtml#Fig17).\n\
    \n![](images/494428_2_En_14_Chapter/494428_2_En_14_Fig18_HTML.jpg)\n\nA screenshot\
    \ of a table of 2-gram phrases. The table consists of five columns and eight rows.\
    \ The 2-gram phrases are hotel fantastic, environment great, best hotels, ridiculous\
    \ what, what you, come back, price utterly, has high quality, products but, bad\
    \ all, and others.\n\n**Figure 14-18**  \n2-gram phrases\n\n1. To generate 2-gram\
    \ phrases, enter the following formula in cell `AU1`:\n\n```\n=IF(AND(ISBLANK(AL1)=FALSE,\
    \ ISBLANK(AM1)=FALSE),AL1 & \" \" & AM1,\"\")\n```\n\nThis formula guarantees\
    \ that only when both cells `AL1` and `AM1` are not blank cells, a 2-gram phrase\
    \ is created inside cell `AU1`.\n\n2. Autofill from cell `AU1` to `BB1` and then\
    \ autofill together from cells `AU1:BB1` to cells `AU34:BB34`.\n\nOur 2-gram phrases\
    \ look like Figure [14-18](#494428_2_En_14_Chapter.xhtml#Fig18). Note there is\
    \ no 2-gram phrase for row 2. Also note the last 2-gram phrase is in column `BB`\
    \ (not shown in Figure [14-18](#494428_2_En_14_Chapter.xhtml#Fig18))."
