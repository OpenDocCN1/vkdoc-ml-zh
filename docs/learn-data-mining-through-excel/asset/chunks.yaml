    ## Learn LDA Through Excel


    `Chapter4-1a.xlsx` contains the famous Iris dataset that is a perfect sample for
    LDA practice. In the Iris dataset, the four attributes `x1`, `x2`, `x3`, and `x4`
    are some flower characteristics that are used to determine the type of iris: the
    target variable. This is the training dataset. Note that there are three distinct
    values for the target variable, that is, the target variable has three classes
    (categories). Follow these instructions:


    1. Open `Chapter4-1a.xlsx`; enter `"y"` in cell `F1` (without quotation marks).

    2. In cells `K1`, `K2`, and `K3`, enter `0`, `1`, and `2`, respectively.

    3. In cells `L1`, `L2`, and `L3`, enter `Iris-setosa`, `Iris-versicolor`, and
    `Iris-virginica`. Our worksheet looks like Figure [4-7](#494428_2_En_4_Chapter.xhtml#Fig7).


    ![](images/494428_2_En_4_Chapter/494428_2_En_4_Fig7_HTML.jpg)


    A screenshot displaying an Excel sheet with data arranged in columns B through
    K and rows 1 to 9, containing values and labels iris setosa, versicolor and virginica.


    Figure 4-7


    Iris dataset and table setup


    We would like to make use of the least square method first to obtain the linear
    function `P`. Thus, we need to convert the categorical values into numerical values
    first. Cells `K1:L3` define that `0` ➤ `Iris-setosa`, `1` ➤ `Iris-versicolor`,
    and `2` ➤ `Iris-virginica`.


    ![](images/494428_2_En_4_Chapter/494428_2_En_4_Fig8_HTML.jpg)


    A screenshot displays an Excel data with 9 columns and 14 rows. It highlights
    K and L column.


    Figure 4-8


    Iris dataset categorized


    1. In cell `F2`, enter the following formula:


    ```

    =IF(A2=L$1,K$1,IF(A2=$L$2,K$2,K$3))

    ```


    2. Autofill cell `F2` all the way to `F151` (there are 150 data points). Our worksheet
    should look like Figure [4-8](#494428_2_En_4_Chapter.xhtml#Fig8).


    ![](images/494428_2_En_4_Chapter/494428_2_En_4_Fig9_HTML.jpg)


    A screenshot of an Excel sheet displays 3 columns and 9 rows with the following
    values `b`, `w1`, `w2`, `w3`, `w4` in column K, 5 to 1 in column L, and values
    ranging from negative 0.1 to 0.6 in column M.


    Figure 4-9


    Using least square method to obtain function coefficients


    1. In cells `K5:K9`, enter `b`, `w1`, `w2`, `w3`, and `w4`, respectively. These
    represent the coefficients (weights) and intercept of the linear function `P`.

    2. In cells `L5:L9`, enter `5`, `4`, `3`, `2`, and `1`, respectively. We are going
    to make use of the functions `INDEX` and `LINEST` to find the coefficients and
    intercept for the linear function `P`. The function `LINEST` returns an array
    containing five elements. The order of the elements in the array is `w4`, `w3`,
    `w2`, `w1`, and `b`.

    3. In cell `M5`, enter the formula:


    ```

    =INDEX(LINEST(F$2:F$151,B$2:E$151,TRUE,TRUE),1,L5)

    ```


    4. Autofill cells `M5` to `M9`. Part of our worksheet should look like Figure
    [4-9](#494428_2_En_4_Chapter.xhtml#Fig9). Cells `M5:M9` contain the coefficients
    of the linear function `P`. Our next step is to apply `P` to obtain the predicted
    value for each data point. We will store such predicted values in column `G`.


    ![](images/494428_2_En_4_Chapter/494428_2_En_4_Fig10_HTML.jpg)


    A screenshot displaying an Excel table with 14 rows and 7 columns. The columns
    are labeled G, H, I, J, K, L, and M, and the table contains numerical values related
    to Iris classifications, as well as values associated with variables like `w1`,
    `w2`, `w3`, and `w4`.


    Figure 4-10


    Cutoffs computed


    1. Enter `"Numerical prediction"` in cell `G1`. In cell `G2`, enter the following
    formula:


    ```

    =MMULT(B2:E2, M$6:M$9)+ M$5

    ```


    This formula represents the expression `w[1]x[1] + w[2]x[2] + …+ w[n]x[n] + b`.
    Because `B2:E2` is a horizontal array while `M6:M9` is a vertical array, the multiplication
    of the two arrays can only be achieved by the function `MMULT` which performs
    a matrix-like multiplication. A similar function, `SUMPRODUCT`, cannot be applied
    here. This formula can be replaced by a clumsier one (which is not recommended):


    ```

    =M$6*B2+M$7*C2+M$8*D2+M$9*E2+M$5

    ```'
