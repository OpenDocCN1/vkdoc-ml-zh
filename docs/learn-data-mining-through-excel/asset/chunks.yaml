  trans: "\n### IF 函数系列\n\nIF 语句据说是编程中使用最频繁的语句，在我们通过 Excel 学习数据挖掘的过程中，这个说法也同样成立。由于我们会经常用到\
    \ IF 函数以及其他与 IF 相关的函数，因此先对它们有个基本了解是个好主意。\n\n本书附带了许多示例 Excel 文件。我们会经常用到它们。这些文件位于\
    \ [`https://github.com/hhohho/Learn-Data-Mining-through-Excel-2`](https://github.com/hhohho/Learn-Data-Mining-through-Excel-2)。这些\
    \ Excel 文件是为不同的数据挖掘实践而设计的示例。有两种下载方式：\n\n1.  将它们一起下载为压缩文件，然后解压到您电脑上的一个文件夹（目录）中。\n\
    \n2.  根据各个章节单独下载。\n\n下载后，打开文件 Chapter1-1a.xlsx。我们的工作表看起来像图 1-11。如果您愿意，也可以在一个空白工作表中手动输入数据。\n\
    \n![](img/494428_2_En_1_Fig11_HTML.jpg)\n\n一张 Excel 截图。姓名、季度、销售额和佣金分别是单元格 A1、B1、C1\
    \ 和 D1 中的数据。A、B、C 列包含数据。\n\n图 1-11\n\n部分销售代表的表现\n\n我们的第一个任务是计算每位销售代表的佣金。佣金的计算方式如下：\n\
    \n1.  任何销售额低于或等于 50000 美元的，没有佣金。\n\n2.  销售额超过 50000 美元但低于或等于 100000 美元的，获得 10%\
    \ 的佣金。\n\n3.  销售额超过 100000 美元的，获得 20% 的佣金。\n\n我们计算佣金的公式基于 IF 函数。在单元格 D2 中输入以下公式：\n\
    \n```\n=IF(C2<=50000,0,IF(C2<=100000,(C2-50000)*10%,50000*0.1+(C2-100000)*20%))\n\
    ```\n\nIF 函数的基本形式是：IF(布尔表达式, 真值, 假值)。在我们的公式中，如果 C2 中的销售额不超过 50000，则返回 0。但是，当 C2\
    \ 超过 50000 时，这里使用了一个嵌套的 IF 函数，因为我们还有两个条件需要评估。\n\n在内部的 IF 函数中，如果 `C2<=100000`，则将超过\
    \ 50000 的部分乘以 0.1（10%）并返回。否则，C2 必定大于 100000，因此返回表达式 `50000*0.1+(C2-100000)*20%)`\
    \ 的计算结果。\n\n我们的工作表看起来完全像图 1-12。\n\n![](img/494428_2_En_1_Fig12_HTML.jpg)\n\n一张\
    \ Excel 截图。A1、B1、C1 和 D1 中的数据分别对应姓名、季度、销售额和佣金。所有单元格都包含数据。\n\n图 1-12\n\n使用 IF 函数计算的佣金\n\
    \n如果我们想统计第一季度销售额在 50000 到 100000 之间的销售代表人数，该怎么办？要回答这个问题，我们需要应用 COUNTIFS 函数。在 Excel\
    \ 中，还有另一个名为 COUNTIF 的函数。COUNTIFS 能够完成 COUNTIF 所能完成的所有任务，并且有许多任务我们必须使用 COUNTIFS\
    \ 而不是 COUNTIF。\n\nMicrosoft Office 支持对 COUNTIFS 的解释是：“COUNTIFS 函数将条件应用于跨多个区域的单元格，并计算满足所有条件的次数。”其语法类似于\
    \ COUNTIFS(条件区域 1, 条件 1, 条件区域 2, 条件 2, …)。基于此理解，在单元格 E1 中输入以下公式：\n\n```\n=COUNTIFS(B2:B10,1,C2:C10,\"\
    >50000\",C2:C10,\"<=100000\")\n```\n\n此公式确保：\n\n*   在单元格区域 B2:B10 中，季度为 1。\n\n\
    *   并且在单元格区域 C2:C10 中，销售额 >50000。请注意，条件被放在一对双引号内。\n\n*   并且在单元格区域 C2:C10 中，销售额\
    \ <=100000。\n\n单元格 E1 中的答案应为 2。\n\n我们想检查每位销售代表的总销售额以及可能的平均销售额。为此，我们需要建立一个表格。按照以下说明建立表格：\n\
    \n![](img/494428_2_En_1_Fig13_HTML.jpg)\n\n一张 Excel 截图。数据选项卡被选中。单元格 F1 到 F10 被选中。主选项卡中的删除重复项功能被选中。\n\
    \n图 1-13\n\n选择“删除重复项”功能\n\n1.  将单元格 A1:A10 复制到 F1:F10。选中单元格 F1:F10；按照图 1-13 中的说明选择“删除重复项”（单击主选项卡“数据”➤\
    \ 单击“删除重复项”图标）。\n\n![](img/494428_2_En_1_Fig14_HTML.jpg)\n\n一张“删除重复项警告”窗口的截图。选中了“以当前选定区域排序”。选中了删除重复项的选项。\n\
    \n图 1-14\n\n以当前选定区域继续\n\n1.  可能会出现一个像图 1-14 那样的小菜单。确保选中“以当前选定区域继续”。单击“删除重复项”按钮。\n\
    \n![](img/494428_2_En_1_Fig15_HTML.jpg)\n\n一张“删除重复项”窗口的截图。选中了“数据包含标题”复选框。在“列”部分下，选中了“姓名”复选框。\n\
    \n图 1-15\n\n数据包含标题\n\n1.  如图 1-15 所示，勾选“数据包含标题”。\n\n1.  在随后出现的小菜单上单击“确定”。\n\n\
    2.  在单元格 G1 中输入文本“年度销售额”，在单元格 H1 中输入“平均销售额”。\n\n我们的工作表应该看起来像图 1-16。\n\n![](img/494428_2_En_1_Fig16_HTML.jpg)\n\
    \n一张 Excel 截图。第 1 行的列标题是姓名、季度、销售额、佣金、2、姓名、年度销售额和平均销售额。单元格 A2 到 D10 有数据。F、G、H 列中的数据被高亮显示。\n\
    \n图 1-16\n\n表格设置\n\n对于年度销售额的计算，我们需要使用 SUMIFS 函数。同样，还有另一个名为 SUMIF 的函数。这两个函数的语法不同，可能会造成混淆。由于\
    \ SUMIFS 可以完成 SUMIF 能做的任何事情，为了简单起见，我们坚持使用 SUMIFS。\n\n1.  SUMIFS 的语法是 SUMIFS(求和区域,\
    \ 条件区域 1, 条件 1, 条件区域 2, 条件 2, …)。基于此理解，在单元格 G2 中输入以下公式：\n\n```\n    =SUMIFS(C$2:C$10,A$2:A$10,F2)\n\
    \    ```\n\n上述公式的工作方式如下：在数组 A2:A10 中，单元格 A2、A7、A9 和 A10 等于 F2（“Amie”）；因此，对数组 C2:C10\
    \ 中对应的单元格进行求和，即对单元格 C2、C7、C9 和 C10 求和。请注意公式中使用了绝对单元格引用，因为我们将要从单元格 G2 自动填充到 G5。\n\
    \n2.  从单元格 G2 自动填充到单元格 G5。\n\n3.  在单元格 H2 中输入以下公式（这里您可以使用 AVERAGEIF 或 AVERAGEIFS，它们的语法相似）：\n\
    \n```\n    =AVERAGEIFS(C$2:C$10,A$2:A$10,F2)\n    ```\n\n4.  从单元格 H2 自动填充到单元格\
    \ H5。\n\n我们的工作表看起来完全像图 1-17。完整结果可在 Chapter1-1b.xlsx 中找到。\n\n![](img/494428_2_En_1_Fig17_HTML.jpg)\n\
    \n一张 Excel 截图。第 1 行的列标题是姓名、季度、销售额、佣金、2、姓名、年度销售额和平均销售额。单元格 A2 到 D10 以及 F2 到 F5\
    \ 有数据。\n\n图 1-17\n\nSUMIFS 和 AVERAGEIFS 函数的使用\n\n请注意，自 Office 2019 或 Microsoft\
    \ 365 起，Excel 在 IF 函数家族中增加了两个新函数：MAXIFS 和 MINIFS。它们的语法与 COUNTIFS、SUMIFS 和 AVERAGEIFS\
    \ 非常相似。\n\n数据准备中经常使用的另外两个 Excel 功能是数据导入和导出。在 Excel 中导出数据相当简单。例如，单击“文件”➤“另存为”➤\
    \ 选择“CSV”将当前工作表导出为 CSV 格式的文件。请注意，CSV 格式可能是数据科学中最常用的文件格式。这里，CSV 代表“逗号分隔值”。\n"
