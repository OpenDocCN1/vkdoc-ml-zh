    |\ \mathrm{yes}\right)\times \mathrm{p}\left(\mathrm{yes}\right)+\mathrm{p}\left(\mathrm{big}\
    |\mathrm{no}\right)\times \mathrm{p}\left(\mathrm{over}\ |\mathrm{no}\right)\times
    \mathrm{p}\left(\mathrm{deep}|\mathrm{no}\right)\times \mathrm{p}\left(\mathrm{no}\right)}
    $$](images/494428_2_En_9_Chapter/494428_2_En_9_Chapter_TeX_Equc.png)


    Certainly, we need to compute the following items:


    1.  p(yes) = 6/10, as there are 6 “yes” out of 10 records.


    2.  p(no) = 4/10, as there are 4 “no” out of 10 records.


    3.  p(big|yes) = 5/6\. When the class is “yes”, correspondingly there are 5 “big”.


    4.  p(over|yes) = 5/6\. When the class is “yes”, correspondingly there are 5 “over”.


    5.  p(deep|yes) = 5/6\. When the class is “yes”, correspondingly there are 5 “deep”.


    6.  p(big|no) = 2/4\. When the class is “no”, correspondingly there are 2 “big”.


    7.  p(over|no) = 1/4\. When the class is “no”, correspondingly there is 1 “over”.


    8.  p(deep|no) = 1/4\. When the class is “no”, correspondingly there is 1 “deep”.


    Thus,


    ![$$ P\left( yes|&lt; big, over, deep&gt;\right)= $$](images/494428_2_En_9_Chapter/494428_2_En_9_Chapter_TeX_Equd.png)


    ![$$ \frac{\left(5/6\right)\times \left(5/6\right)\times \left(5/6\right)\times
    \left(6/10\right)}{\left(5/6\right)\times \left(5/6\right)\times \left(5/6\right)\times
    \left(6/10\right)+\left(2/4\right)\times \left(1/4\right)\times \left(1/4\right)\times
    \left(4/10\right)} $$](images/494428_2_En_9_Chapter/494428_2_En_9_Chapter_TeX_Eque.png)


    The final answer is 0.965\. This says that the probability for the scoring record
    to be “yes” (lung cancer positive) is 0.965.


    Certainly, the mathematical background of Naïve Bayes classification is relatively
    much simpler than that of logistic regression, LDA, and K-NN. This is an important
    reason why Naïve Bayes classification can have outstanding computation efficiency
    when the data size is large. In addition, though Naïve Bayes makes a “naïve” assumption
    that all the attributes are independent from each other, Naïve Bayes does have
    fair performance compared to many other classification data mining models.


    ## Learn Naïve Bayes Through Excel


    We are going to practice two examples through Excel in this chapter. The first
    example is the same as Table [9-1](#494428_2_En_9_Chapter.xhtml#Tab1). The second
    example simulates a similar image analysis case. However, the data are more complicated,
    and the data size is much larger.'
  trans: '

    贝叶斯定理的精妙之处在于，它将计算 *P*(*y*[1]|*x*[*a*]) 转化为计算 *P*(*x*[*a*]|*y*[1]) 和 *P*(*x*[*a*]|*y*[2])！在数据挖掘中思考这个问题。给定已知
    y 的训练数据集，我们可以轻松计算出 *P*(*x*[*a*]|*y*[1])、*P*(*x*[*a*]|*y*[2])、*P*(*y*[1]) 和 *P*(*y*[2])。现在对于评分数据集，y
    未知但 x 已知。如果 x 是 x[a]，那么我们可以利用公式 (9-6) 来预测在 x[a] 条件下 y[1] 的发生概率。


    公式 (9-6) 假设只有一个独立属性 x。在大多数情况下，存在多个独立属性（`x`[`1`]`,x`[`2`]`,...,x`[`n`]）来对 y 进行分类，并且
    y 可能有两个以上的类别。假设 y 有 `m` 个不同的类别，并且在条件（`x`[`1`]`,x`[`2`]`,...,x`[`n`]）下，令


    ![$$ {P}^{\prime}\left(\left.{y}_k\right|x\right)=P\left({x}_1|{y}_k\right)P\left({x}_2|{y}_k\right)\cdots
    P\left({x}_n|{y}_k\right)P\left({y}_k\right) $$](img/494428_2_En_9_Chapter_TeX_Equ7.png)


    (9-7)


    根据我们之前的内容，不难推导出最终的 *P*(*y*[*k*]|*x*)，即在条件（`x`[`1`]`,x`[`2`]`,...,x`[`n`]）下第 k
    个 y 类别的概率，可以通过以下公式计算：


    ![$$ P\left(\left.{y}_k\right|x\right)=\frac{P^{\prime}\left(\left.{y}_k\right|x\right)}{\sum
    \limits_i^m{P}^{\prime}\left(\left.{y}_i\right|x\right)} $$](img/494428_2_En_9_Chapter_TeX_Equ8.png)


    (9-8)


    当然，![$$ \sum \limits_i^mP\left(\left.{y}_i\right|x\right)=1 $$](img/494428_2_En_9_Chapter_TeX_IEq1.png)
    。


    我们将使用表 9-1 中的示例来实现上述概念。


    表 9-1 中的数据模拟了一个图像分析案例，该案例根据所拍摄图像的特征（属性）来确定某种癌症的发生。请注意，表中的数据是虚构的，不代表有效的图像或癌症分析方法。


    表 9-1


    用于朴素贝叶斯分析的虚构样本数据


    | 编号 | 尺寸 | 数量 | 厚度 | 肺癌 |

    | --- | --- | --- | --- | --- |

    | 1 | 大 | 低 | 深 | 是 |

    | 2 | 大 | 多 | 深 | 是 |

    | 3 | 正常 | 多 | 浅 | 否 |

    | 4 | 大 | 低 | 浅 | 否 |

    | 5 | 大 | 多 | 深 | 是 |

    | 6 | 正常 | 多 | 深 | 是 |

    | 7 | 大 | 低 | 浅 | 否 |

    | 8 | 大 | 多 | 浅 | 是 |

    | 9 | 大 | 多 | 深 | 是 |

    | 10 | 正常 | 低 | 深 | 否 |

    | 评分 | 大 | 多 | 深 | ??? |


    共有三个属性：尺寸、数量和厚度（将它们视为 x[1]、x[2] 和 x[3]）。每个属性有两个不同的值。目标变量是肺癌，它有两个不同的类别：是和否。在表 9-1
    中，有十条训练数据记录，最后一条是评分记录，我们需要根据这三个属性值来预测其类别。


    基于公式 (9-7) 和 (9-8)，评分记录为“是”的概率通过以下公式计算：


    ![$$ \mathrm{P}\left(\mathrm{yes}|&lt;\mathrm{big},\mathrm{over},\mathrm{deep}&gt;\right)=
    $$](img/494428_2_En_9_Chapter_TeX_Equb.png)


    ![$$ \frac{\mathrm{p}\left(\mathrm{big}|\mathrm{yes}\right)\times \mathrm{p}\left(\mathrm{over}|\mathrm{yes}\right)\times
    \mathrm{p}\left(\mathrm{deep}\ |\ \mathrm{yes}\right)\times \mathrm{p}\left(\mathrm{yes}\right)}{\mathrm{p}\left(\mathrm{big}|\mathrm{yes}\right)\times
    \mathrm{p}\left(\mathrm{over}|\mathrm{yes}\right)\times \mathrm{p}\left(\mathrm{deep}\
    |\ \mathrm{yes}\right)\times \mathrm{p}\left(\mathrm{yes}\right)+\mathrm{p}\left(\mathrm{big}\
    |\mathrm{no}\right)\times \mathrm{p}\left(\mathrm{over}\ |\mathrm{no}\right)\times
    \mathrm{p}\left(\mathrm{deep}|\mathrm{no}\right)\times \mathrm{p}\left(\mathrm{no}\right)}
    $$](img/494428_2_En_9_Chapter_TeX_Equc.png)


    当然，我们需要计算以下各项：


    1.  p(是) = 6/10，因为 10 条记录中有 6 条“是”。

    2.  p(否) = 4/10，因为 10 条记录中有 4 条“否”。

    3.  p(大|是) = 5/6。当类别为“是”时，相应地有 5 个“大”。

    4.  p(多|是) = 5/6。当类别为“是”时，相应地有 5 个“多”。

    5.  p(深|是) = 5/6。当类别为“是”时，相应地有 5 个“深”。

    6.  p(大|否) = 2/4。当类别为“否”时，相应地有 2 个“大”。

    7.  p(多|否) = 1/4。当类别为“否”时，相应地有 1 个“多”。

    8.  p(深|否) = 1/4。当类别为“否”时，相应地有 1 个“深”。


    因此，


    ![$$ P\left( yes|&lt; big, over, deep&gt;\right)= $$](img/494428_2_En_9_Chapter_TeX_Equd.png)


    ![$$ \frac{\left(5/6\right)\times \left(5/6\right)\times \left(5/6\right)\times
    \left(6/10\right)}{\left(5/6\right)\times \left(5/6\right)\times \left(5/6\right)\times
    \left(6/10\right)+\left(2/4\right)\times \left(1/4\right)\times \left(1/4\right)\times
    \left(4/10\right)} $$](img/494428_2_En_9_Chapter_TeX_Eque.png)


    最终答案是 0.965。这表明评分记录为“是”（肺癌阳性）的概率是 0.965。


    当然，朴素贝叶斯分类的数学背景比逻辑回归、LDA 和 K-NN 相对简单得多。这是朴素贝叶斯分类在数据量较大时能够拥有出色计算效率的重要原因。此外，尽管朴素贝叶斯做出了一个“朴素”的假设，即所有属性相互独立，但与许多其他分类数据挖掘模型相比，朴素贝叶斯确实具有不错的性能。


    ## 通过 Excel 学习朴素贝叶斯


    在本章中，我们将通过 Excel 练习两个示例。第一个示例与表 9-1 相同。第二个示例模拟了一个类似的图像分析案例。然而，数据更复杂，数据量也大得多。

    '
- fmt: '### Exercise 1


    The file `Chapter9-1a.xlsx` contains the same data as shown in Table [9-1](#494428_2_En_9_Chapter.xhtml#Tab1).
    There are only ten training samples and one scoring sample. The reason to make
    the sample size small is for better illustration. Once we have gained enough experience
    through this simple example, we will work on another dataset which is more complicated.


    In `Chapter9-1a.xlsx`, data are already set up in the worksheet for easy processing
    as shown in Figure [9-1](#494428_2_En_9_Chapter.xhtml#Fig1). What we need to do
    is to complete necessary computations for Naïve Bayes analysis.


    ![](images/494428_2_En_9_Chapter/494428_2_En_9_Fig1_HTML.jpg)


    An Excel screenshot represents the Naive Bayes data setup. It consists of data
    of sample size, size, number, and thickness and a table with column headers number,
    size, number, thickness, and lung cancer.


    Figure 9-1


    Naive Bayes data setup


    To apply Naïve Bayes method to predict the class of the scoring record, we need
    to build the model based on the training data first. Follow these instructions:


    ![](images/494428_2_En_9_Chapter/494428_2_En_9_Fig2_HTML.jpg)


    An Excel screenshot represents the partial Naive Bayes analysis. It contains a
    table with column headers yes and no. The row headers are count, probability,
    big, and normal


    Figure 9-2


    Naive Bayes analysis is partially completed


    1.  Enter `10` in cell `B1`, as there are only ten training records.

    2.  Enter the formula `=COUNTIF($E$13:$E$22,C$2)` in cell `C3`. This counts the
    number of class “yes” for the target variable Lung Cancer. Autofill from cell
    `C3` to cell `D3`. Cell `D3` stores the number of class “no”.

    3.  Enter the formula `=C$3/$B$1` in cell `C4`, and then autofill from cell `C4`
    to cell `D4`. Cells `C4` and `D4` reference `p(yes)` and `p(no)`.

    4.  Enter the following formula in cell `C5`:


    ```

    =COUNTIFS($E$13:$E$22,C$2,$B$13:$B$22,$B5)/C$3

    ```


    5.  Autofill from cell `C5` to cell `C6`, and then autofill together to cells
    `D5:D6`. Cells `C5`, `C6`, `D5`, and `D6` represent the probabilities `p(big|yes)`,
    `p(normal|yes)`, `p(big|no)`, and `p(normal|no)`, respectively. Recall `p(big|yes)`
    is the conditional probability: given “yes”, the probability of Size = “big”.


    At this moment, part of our worksheet looks like Figure [9-2](#494428_2_En_9_Chapter.xhtml#Fig2).


    ![](images/494428_2_En_9_Chapter/494428_2_En_9_Fig4_HTML.jpg)


    An Excel screenshot represents the Naive Bayes classification. It contains a table
    with column headers number, size, number, thickness, and lung cancer. It has 10
    rows of data and a row of scoring result.


    Figure 9-4


    Naive Bayes classification completed


    1.  Enter the following formula in cell `C7`:


    ```

    =COUNTIFS($E$13:$E$22,C$2,$C$13:$C$22,$B7)/C$3

    ```


    2.  Autofill from cell `C7` to cell `C8`, and then autofill together to cells
    `D7:D8`. Cells `C7`, `C8`, `D7`, and `D8` reference the probabilities `p(over|yes)`,
    `p(low|yes)`, `p(over|no)`, and `p(low|no)`, respectively.

    3.  Enter the following formula in cell `C9`:


    ```

    =COUNTIFS($E$13:$E$22,C$2,$D$13:$D$22,$B9)/C$3

    ```


    4.  Autofill from cell `C9` to cell `C10`, and then autofill together to cells
    `D9:D10`. Cells `C9`, `C10`, `D9`, and `D10` reference the probabilities `p(deep|yes)`,
    `p(shallow|yes)`, `p(deep|no)`, and `p(shallow|no)`, respectively.


    By now, our worksheet should look the same as Figure [9-3](#494428_2_En_9_Chapter.xhtml#Fig3).
    If there are differences, examine the formulas inside the cells `C3:D10`.


    ![](images/494428_2_En_9_Chapter/494428_2_En_9_Fig3_HTML.jpg)


    An Excel screenshot represents the Naive Bayes data preparation. It contains numerical
    data for the count, probability, big and normal sizes, over and low numbers, and
    deep and shallow thicknesses.


    Figure 9-3


    Naive Bayes data preparation


    Continue our Naïve Bayes data mining process by following these instructions:


    5.  Enter `"p''(scoring|yes)"`, `"p''(scoring|no)"`, and `"P(yes|scoring)"` in
    cells `F22`, `G22`, and `H22`, respectively.

    6.  Enter the following formula in cell `F23`:


    ```

    =SUMIF($B$5:$B$10,$B23,C$5:C$10) * SUMIF($B$5:$B$10,$C23,C$5:C$10) * SUMIF($B$5:$B$10,$D23,C$5:C$10)*C$4

    ```


    The preceding formula computes the probability of the scoring record given the
    class is “yes”. It implements Equation ([9-7](#494428_2_En_9_Chapter.xhtml#Equ7)).
    Note that the function `SUMIF` has a different syntax from `SUMIFS`. For example,
    `SUMIF($B$5:$B$10,$B23,C$5:C$10)` sums the cells in the array `C5:C10` only if
    their matching cells in the array `B5:B10` have the same value as cell `B23`.
    If we want to use the function `SUMIFS` for the same purpose, then the expression
    should be `SUMIFS(C$5:C$10,$B$5:$B$10,$B23)`.


    7.  Autofill from cell `F23` to cell `G23`. Cell `G23` references the probability
    of the scoring record given the class is “no”.

    8.  Enter in cell `H23` the formula `=F23/(F23+G23)` which implements Equation
    ([9-8](#494428_2_En_9_Chapter.xhtml#Equ8)).

    9.  Enter in cell `E23` the formula `=IF(H23>0.5,"yes","no")`.


    This completes our first endeavor on the Naïve Bayes classification. Our result
    should look the same as what is shown in Figure [9-4](#494428_2_En_9_Chapter.xhtml#Fig4).
    The complete result is available in the file `Chapter9-1b.xlsx`.'
