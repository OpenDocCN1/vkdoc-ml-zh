    and is presented as follows:


    ```

    =SQRT(SUMXMY2($B3:$E3, H$3:H$6))

    ```


    This formula computes the Euclidean distance between L1 and C1\. Pay close attention
    to the use of absolute references in the formula. The use of absolute references
    here is for easy autofill. Function SQRT computes the square root of a value,
    and function SUMXMY2 computes the sum of squares of differences of corresponding
    values in two arrays (in this case, the two arrays are B3:E3 for L1 and H3:H6
    for C1).


    Continue the process by following these instructions:


