    \ `=F4/SUM(F4:G4)`。单元格 H4 中的值即为当 k=1 时的接受概率。\n\n6.  从 H4 自动填充到 H9。\n\n至此，工作表的一部分应如图\
    \ 7-7 所示。\n\n1.  现在是对黛西的响应进行分类的时候了。在单元格 B4 中输入公式 `=IF(H4>0.5,\"Yes\",\"No\")`。\n\
    \n2.  从 B4 自动填充到 B9。\n\n我们的结果应如图 7-8 所示。当然，通过 K-NN 模型中的加权投票，我们比之前更有信心认为黛西可能会拒绝信用卡优惠。完整结果可在文件\
    \ Chapter7-2b.xlsx 中找到。\n\n![](img/494428_2_En_7_Fig8_HTML.jpg)\n\n电子表格突出显示了黛西的年龄、收入和持卡数量详情，以及她的响应。右侧标明了\
    \ Small、1、0 和 Probability 的值。底部标明了名称 N1 和 N2 的年龄、收入、持卡数量、响应、距离、倒数和权重的详细信息。\n\n\
    图 7-8\n在 K-NN 模型中应用加权投票\n\n在此实验中，我们使用的临界值为 0.5，也就是说，如果接受概率大于 0.5，我们认为黛西的响应可能是“是”，否则为“否”。将\
    \ 0.5 设为临界值是一个自然的选择。然而，在通过交叉验证评估我们的 K-NN 模型时，选择不同的临界值并进行 ROC 分析将会很有趣。\n\n我们能否进一步改进加权\
    \ K-NN 模型？答案可能是肯定的。不难注意到，属性“收入”对距离的贡献最大，而属性“持卡数量”的贡献最小。我们知道，不同的属性对确定黛西的响应可能有不同的影响，这是开发数据挖掘模型时业务理解阶段的一部分。然而，当我们不清楚哪个属性贡献更大时，最好对所有属性一视同仁。因此，有必要对所有三个属性进行归一化，使它们处于同一量级，例如\
    \ 0–100。\n\n### 实验 3\n\n归一化可以通过不同的方式完成。Z-score 归一化基于数据的方差。在本实验中，我们执行范围归一化，即所有属性都根据其各自的最大值和最小值进行归一化。\n\
    \n我们希望范围是 0–100。因此，每个属性的最小值被转换为 0，最大值被转换为 100。\n\n让我们按照以下分步说明来执行此实验：\n\n1.  打开\
    \ Chapter7-3a.xlsx。在单元格 J1:J6 和 K1:K6 中，输入如图 7-9 所示的文本或公式。这些值是三个属性的实际范围。\n\n![](img/494428_2_En_7_Fig9_HTML.jpg)\n\
    \n一个表格展示了一组用于计算最大年龄、最小年龄、最大收入、最小收入、最大持卡数量和最小持卡数量的公式。公式中指明了单元格的范围。\n\n图 7-9\n定义范围\n\
    \n归一化值的表达式为 100 / (最大值 – 最小值) * (值 – 最小值)。请注意，对于给定的属性，如果其最大值等于最小值，此表达式可能会失败。然而，这种情况非常罕见。当这种情况发生时，该属性没有方差，因此对我们的数据挖掘项目没有价值。我将在后面介绍探索性数据分析（EDA）的章节中讨论这一点。\n\
    \n2.  在单元格 F11、G11 和 H11 中，分别输入“归一化年龄”、“归一化收入”和“归一化持卡数量”。\n\n3.  在单元格 F12 中，输入以下公式，然后从\
    \ F12 自动填充到 F211：\n\n```\n    =100/($K$1-$K$2)*(B12-$K$2)\n    ```\n\n4.  在单元格\
    \ G12 中，输入以下公式，然后从 G12 自动填充到 G211：\n\n```\n    =100/($K$3-$K$4)*(C12-$K$4)\n \
    \   ```\n\n5.  在单元格 H12 中，输入以下公式，然后从 H12 自动填充到 H211：\n\n```\n    =100/($K$5-$K$6)*(D12-$K$6)\n\
    \    ```\n\n工作表的一部分应如图 7-10 所示。\n\n![](img/494428_2_En_7_Fig10_HTML.jpg)\n\n电子表格突出显示了黛西的年龄、收入和持卡数量详情。右侧标明了年龄、收入和持卡数量的最小值和最大值。底部的一个表格展示了名称、年龄、收入、持卡数量、响应以及归一化年龄、收入和持卡数量的详细信息。\n\
    \n图 7-10\n归一化所有属性\n\n按照我们之前的方法继续以下步骤以完成此实验：\n\n6.  在单元格 E2 中，输入公式 `=100/(K1-K2)*(B2-K2)`。这是黛西的归一化“年龄”。\n\
    \n7.  在单元格 F2 中，输入公式 `=100/(K3-K4)*(C2-K4)`。这是黛西的归一化“收入”。\n\n8.  在单元格 G2 中，输入公式\
    \ `=100/(K5-K6)*(D2-K6)`。这是黛西的归一化“持卡数量”。\n\n9.  在单元格 I11、J11 和 K11 中，分别输入“距离”、“倒数”和“权重”。\n\
    \n10.  在单元格 E3、F3、G3 和 H3 中，分别输入“Small”、“1”、“0”和“Probability”。\n\n工作表的一部分现在如图\
    \ 7-11 所示。\n\n![](img/494428_2_En_7_Fig11_HTML.jpg)\n\n一个表格在左侧展示了 Small、1、0 和\
    \ Probability 的值。在右侧，标明了年龄、收入和持卡数量的最小值和最大值。底部有几个列标题，包括响应、归一化年龄、收入、持卡数量、距离、倒数和权重。\n\
    \n图 7-11\n实验 3 的设置\n\n1.  在单元格 I12 中，输入以下公式，并从 I12 自动填充到 I211：\n\n```\n    =SQRT(SUMXMY2(E$2:G$2,\
    \ F12:H12))\n    ```\n\n2.  在单元格 J12 中，输入公式 `=1/(1+I12)`，并从 J12 自动填充到 J211。\n\n\
    3.  在单元格 K12 中，输入公式 `=J12/SUM($J$12:$J$211)`，并从 K12 自动填充到 K211。\n\n确保我们的工作表如图\
    \ 7-12 所示。如果不同，我们最好检查一下公式。\n\n![](img/494428_2_En_7_Fig12_HTML.jpg)\n\n一个包含六行的表格展示了归一化年龄、归一化收入、归一化持卡数量、距离、倒数和权重的详细信息。\n\
    \n图 7-12\n归一化后计算权重\n\n按照以下说明继续任务：\n\n4.  在单元格 E4 中输入公式 `=SMALL(I$12:I$211,A4)`。自动填充到\
    \ E9。\n\n5.  在单元格 F4 中输入以下公式：\n\n```\n    =SUMIFS($K$12:$K$211,$E$12:$E$211, F$3,$I$12:$I$211,\"\
    <=\"&$E4)\n    ```\n\n6.  从单元格 F4 自动填充到 G4，并从 F4 自动填充到 F9 以及从 G4 自动填充到 G9。\n\n\
    7.  在单元格 H4 中输入公式 `=F4/SUM(F4:G4)`，然后从 H4 自动填充到 H9。\n\n8.  在单元格 B4 中输入公式 `=IF(H4>0.5,\"\
    Yes\",\"No\")`，然后从 B4 自动填充到 B9。\n\n最终结果如图 7-13 所示。显然，当数据以不同方式处理时，结果可能会不同（将图 7-13\
    \ 与图 7-8 和图 7-4 进行比较）。在应用 K-NN 方法时，了解数据是如何处理的始终是一个好主意。完整结果可在 Chapter7-3b.xlsx\
    \ 中找到。\n\n![](img/494428_2_En_7_Fig13_HTML.jpg)\n\n电子表格包含黛西的年龄、收入、持卡数量和响应的详细信息，以及\
    \ Small、1、0、Probability 的值，以及年龄、收入和持卡数量的最大值和最小值。底部的一个表格包含年龄、收入、持卡数量、响应、距离、倒数、权重和归一化变量的详细信息。\n\
    \n图 7-13\n一种结合归一化属性和加权投票的 K-NN 方法\n"
- fmt: "### Experiment 4\n\nIn the previous three experiments, the target variable\
    \ has only two distinct responses. Let’s conduct a K-NN analysis when the target\
    \ variable has more than two responses. Open `Chapter7-4a.xlsx`. This file is\
    \ very similar to `Chapter7-3b.xlsx` except (1) its responses are Yes, Not Sure,\
    \ and No; (2) it has not computed the probability for each possible response or\
    \ Daisy’s likely responses. Take a look at the file first. The worksheet looks\
    \ like Figure [7-14](#494428_2_En_7_Chapter.xhtml#Fig14). Note in cell `I3`, it\
    \ is “Max Weight”, not “Probability”.\n\n![](images/494428_2_En_7_Chapter/494428_2_En_7_Fig14_HTML.jpg)\n\
    \nA spreadsheet comprises the details of Daisy's age, income, and cards at the\
    \ top. The details of maximum and minimum age, income, and cards are on the right.\
    \ The details of name, age, income, cards, response, distance, reciprocal, weight,\
    \ and normalized age, income, and cards are at the bottom.\n\n**Figure 7-14**\
    \ K-NN with three distinct categorical outcomes\n\nFollow these instructions to\
    \ complete the final computation:\n\n1.  Enter the following formula in cell `F4`:\n\
    \n    ```\n    =SUMIFS($K$12:$K$211,$E$12:$E$211, F$3,$I$12:$I$211,\"<=\"&$E4)\n\
    \    ```\n\n2.  Autofill from `F4` to `H4`, then autofill all together to row\
    \ 9.\n\n3.  Enter the formula `=MAX(F4:H4)` in cell `I4`, and autofill from `I4`\
    \ to `I9`.\n\n4.  In cell `B4`, enter the following formula and then autofill\
    \ to cell `B9`:\n\n    ```\n    =INDEX(F$3:H$3,1,MATCH(I4,F4:H4,0))\n    ```\n\
    \n    Note the use of `MATCH` function. The last parameter inside `MATCH` is 0,\
    \ indicating it is searching for an exact match. This is important here as many\
    \ numbers are close to each other.\n\nThat’s it. The final result is shown in\
    \ Figure [7-15](#494428_2_En_7_Chapter.xhtml#Fig15) and can be available in the\
    \ file `Chapter7-4b.xlsx`.\n\n![](images/494428_2_En_7_Chapter/494428_2_En_7_Fig15_HTML.jpg)\n\
    \nA spreadsheet comprises the details of Daisy's age, income, cards, and responses\
    \ along with the values of small, yes, not sure, no, max weight, and minimum and\
    \ maximum age, income, and cards. The details of name, age, income, cards, response,\
    \ distance, reciprocal, weight, and normalized variables are at the bottom.\n\n\
    **Figure 7-15** The final result of K-NN with three predictive outcomes\n\n##\
    \ Reinforcement Exercises\n\nThe reinforcement exercise in `Chapter7-HW.xlsx`\
    \ may take you some effort and caution. But it is necessary for you to become\
    \ more skilled with the K-NN data mining method. Should you run into any difficulty\
    \ completing this reinforcement exercise, feel free to take a look at the solution\
    \ inside `Chapter7-HW-withAnswers.xlsx`.\n\n## Review Points\n\n1.  What is K-NN\
    \ and its resemblance in our life\n2.  Different distance functions\n3.  Different\
    \ weight functions and normalization techniques\n4.  The Elbow method for finding\
    \ the optimal K value for K-NN\n5.  Excel functions `SQRT` and `SMALL` and Excel\
    \ operator `&`\n6.  Excel functions `IF`, `COUNTIFS`, `SUMIFS`, `MATCH`, and `INDEX`\n\
    \n# 8. Hierarchical Clustering and Dendrogram\n\nYou may wonder why I do not explain\
    \ hierarchical clustering right after k-means clustering. Well, there are some\
    \ reasons. The first one is that Excel is not as suitable for hierarchical clustering\
    \ or dendrogram as it is for k-means clustering. I would like to introduce a few\
    \ more other popular data mining methods before diving into this challenging topic.\
    \ The second reason is that I consider it suitable to explain hierarchical clustering\
    \ right after K-NN. The last reason is because of dendrogram. To draw a dendrogram\
    \ in Excel requires quite some manual work, which could be boring to some learners.\n\
    \nPlease download the sample Excel files from [`https://github.com/hhohho/Learn-Data-Mining-through-Excel-2`](https://github.com/hhohho/Learn-Data-Mining-through-Excel-2)\
    \ for this chapter’s exercises.\n\n## General Understanding\n\nHierarchical clustering\
    \ is similar to k-means clustering in that it is also an unsupervised classification\
    \ method that categorizes subjects (data points) into different groups (clusters)\
    \ based on the similarity of certain characteristics. However, these two clustering\
    \ methods are based on two different algorithms, which results in different final\
    \ products. K-means clustering generates parallel clusters. Hierarchical clustering\
    \ produces a tree of clusters as its name indicates, instead. Moreover, the final\
    \ product of hierarchical clustering is usually presented in the form of a dendrogram\
    \ that shows the relative distances of the original data points or grouped data\
    \ points. This is the major reason why hierarchical clustering is frequently used\
    \ in biomedical sciences to show the clustering of genes or samples.\n\nK-means\
    \ clustering starts with defining the number k, the number of clusters. Hierarchical\
    \ clustering starts with a proximity matrix and never needs to predefine the number\
    \ of clusters. The algorithm of hierarchical clustering can be explained by the\
    \ following example that contains six data points A, B, C, D, E, and F.\n\n1.\
    \  Every data point is treated as a cluster initially.\n2.  A proximity matrix\
    \ is constructed to show the distances among the six clusters.\n3.  Assume that\
    \ the smallest distance is between A and C, then A and C are placed in the same\
    \ cluster in the first round and they are represented as AC.\n4.  Now, there are\
    \ five clusters only: AC, B, D, E, and F.\n5.  Repeat step 2 to create a proximity\
    \ matrix for the five clusters. Assume that B and D have the least distance, then\
    \ there are only four clusters: AC, BD, E, and F.\n6.  Repeat step 2 to create\
    \ a proximity matrix for the four clusters. Assume that AC and F have the least\
    \ distance, then there are only three clusters: ACF, BD, and E.\n7.  Repeat step\
    \ 2 to create a proximity matrix for the three clusters. Assume that ACF and BD\
    \ have the least distance, then there are only two clusters: ACFBD and E.\n8.\
    \  Hierarchical clustering stops at only one cluster: ACFBDE.\n\nThe preceding\
    \ algorithm is for agglomerative clustering, a bottom-up hierarchical clustering.\
    \ The opposite of agglomerative clustering is called divisive clustering, which\
    \ is top down. In this book, we will experience agglomerative clustering, and\
    \ the distance among clusters is again the Euclidean distance.\n\nWhat is dendrogram?\
    \ Well, a graph truly worth more than one thousand words in this case. Following\
    \ the preceding example, the final product of the algorithm can be represented\
    \ by the following diagram which is a bona fide dendrogram.\n\n![](images/494428_2_En_8_Chapter/494428_2_En_8_Fig1_HTML.png)\n\
    \nA dendrogram plots 5 cluster A, C, F, B, D and E from level 6, 5, 4, 3, 2 and\
    \ 1.\n\n**Figure 8-1** A sample dendrogram showing the hierarchical clustering\
    \ process of A, B, C, D, E, F\n\nObserve in Figure [8-1](#494428_2_En_8_Chapter.xhtml#Fig1)\
    \ that (1) there are five levels for six data points, one level for one round\
    \ of clustering and (2) A and C are first clustered together, and therefore the\
    \ clade for AC has the least height. In dendrogram, the higher the clade, the\
    \ larger the distance between the two clusters."
