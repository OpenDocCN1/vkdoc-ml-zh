  trans: '

    ## 在 Excel 中绘制树状图（无需加载项）


    在我向你展示如何使用 Excel 实现凝聚层次聚类算法之前，我们先学习如何在 Excel 中绘制树状图。请注意，市面上有可购买并添加到 Excel 中的商业分析软件，以简化层次聚类过程和树状图的创建。而这里所展示的方法不需要任何加载项。


    让我们从最简单的树状图开始，如图 8-2 所示。


    ![](img/494428_2_En_8_Fig2_HTML.png)


    一张树状图，在高度 2 处绘制了一个聚类，并标记为 A 和 C。


    图 8-2

    最简单的树状图


    如果我要求你用笔在一张纸上画出图 8-2 中的图表，条件是你的笔在画完之前不能离开纸面，你会怎么画？嗯，你可以从顶部、右侧或左侧开始画。假设你从字母 A 所在的左侧开始（高度=0），你的笔应该按如下方式移动：


    1.  从 A 开始，向上移动 1 个单位。

    2.  向右转，停在字母 C 的上方。

    3.  向下移动 1 个单位到字母 C。

    4.  向上移动 1 个单位。

    5.  向左转，停在 A 和 C 的中间位置。

    6.  向上移动 1 个单位到高度 2。


    如果树状图看起来像图 8-3，并且我们需要停在高度 3 处，该怎么办？


    ![](img/494428_2_En_8_Fig3_HTML.jpg)


    一张树状图，从高度 3 处绘制了 2 个聚类，并标记为 A、C 和 F。一个箭头停在聚类 3 处并标注“停在此处”。


    图 8-3

    稍微复杂一点的树状图


    嗯，我们可以继续移动笔，步骤如下：


    7.  将笔向右转，使其正好位于字母 F 的上方。

    8.  向下移动 2 个单位到高度 0。

    9.  向上移动 2 个单位。

    10.  向左转，停在字母 C 的上方。

    11.  向上移动 1 个单位到高度 3。


    到目前为止，我们应该已经明白，我们的笔有些路径走了两次。没错，这就是诀窍。如果我们将这些笔的移动轨迹转换成 Excel 中的散点图，那么这些移动就可以用图
    8-4 中所示的数据点来表示。


    ![](img/494428_2_En_8_Fig4_HTML.jpg)


    一张 Excel 表格截图，描述了一系列移动序列，从单元格 (1, 0) 开始，涉及向上、向下、向左、向右移动到各个单元格的步骤。这些移动在网格中形成了一条路径，最终到达单元格
    (3, 3)。


    图 8-4

    用于生成树状图的散点图的 X 和 Y 值


    请打开 Chapter8-1a.xlsx。映入你眼帘的应该类似于图 8-5，这是一个与图 8-3 略有不同的树状图，因为它没有标签 A、C 或 F。请注意，这个树状图是一个散点图，它是基于
    A1:B13 区域的数据生成的，该数据与图 8-4 中所示相同。


    ![](img/494428_2_En_8_Fig5_HTML.jpg)


    一张屏幕截图，显示了一个包含 X 和 Y 坐标的 Excel 表格以及一个没有标签的树状图。


    图 8-5

    没有标签的树状图


    要使图 8-5 中的树状图看起来像图 8-3 中的那样，我们需要完成以下步骤：


    12.  如图 8-6 所示，点击 x 轴内部，然后在弹出的菜单中选择“删除”。此操作将删除 x 轴。

    13.  右键单击图表标题，也将其删除，如图 8-6 所示。


    ![](img/494428_2_En_8_Fig6_HTML.jpg)


    一张屏幕截图，展示了修改树状图的说明。它首先建议右键单击标题将其删除，然后选择删除选项，以及其他用于自定义图表外观的潜在操作或设置。


    图 8-6

    删除 x 轴和图表标题


    14.  按照图 8-7 添加数据标签。确保选择“下方”。


    ![](img/494428_2_En_8_Fig7_HTML.jpg)


    一张屏幕截图，显示了一组自定义树状图的说明。它提到了选择数据标签、添加图表元素以及调整各种图表元素（如坐标轴、标题和网格线）等操作。


    图 8-7

    添加数据标签


    15.  按照图 8-8 逐个删除数据标签，但保留底部三个标签不变。请记住，此操作需要一些耐心。

    注意，当你点击一个数据标签时，所有数据标签都会被选中。你应该继续点击那个特定的标签（单击一次）。此操作将取消选择其他数据标签，而只选中你点击的那个。


    ![](img/494428_2_En_8_Fig8_HTML.jpg)


    一张屏幕截图，显示了一系列操作或项目，以框架和数字 4 到 0 表示。说明要求从 4 开始依次向下到 0，逐个删除这些项目。


    图 8-8

    逐个删除标记的数据标签。保留底部三个标签不变


    16.  对于底部的三个数据标签，点击最左边的一个。所有三个标签都被选中。立即再次点击最左边的数据标签；现在只有最左边的数据标签被选中。将其文本更改为 A。

    17.  继续更改其余两个数据标签的文本。图 8-9 显示了最后一个数据标签的文本更改过程。完成此步骤后，我们将得到一个类似于图 8-3 的树状图。


    ![](img/494428_2_En_8_Fig9_HTML.jpg)


    一张屏幕截图，显示在树状图图形上编辑框架 0 的文本。


    图 8-9

    编辑数据标签内的文本


    最终结果可在 Chapter8-1b.xlsx 中找到。

