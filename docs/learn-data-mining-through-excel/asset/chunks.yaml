    About the Author About the Technical Reviewer


    # 1. Excel and Data Mining


    Let’s get right to the topic. Why do we need to learn Excel in our data mining
    endeavor? It is true that there are some outstanding data mining software tools
    such as RapidMiner that make the mining process easy and straightforward. In addition,
    programming languages Python and R have a large number of reliable packages dedicated
    to various data mining tasks. What is the purpose of studying data mining or machine
    learning through Excel?


    ## Why Excel?


    If you are already an experienced data mining professional, I would say that you
    are asking the right question and probably you should not read this book. However,
    if you are a beginner in data mining, or a visual learner, or want to understand
    the mathematical background behind some popular data mining techniques, or an
    educator, then this book is right for you, and probably is the first book you
    should read before you start your data mining journey.


    Excel allows you to work with data in a transparent manner, meaning when an Excel
    file is opened, the data is visible immediately and every step of data processing
    is also visible. Intermediate results are contained in the Excel worksheet and
    can be examined while you are conducting your mining task. This allows you to
    obtain a deep and clear understanding of how the data are manipulated and how
    the results are obtained. Other software tools and programming languages hide
    critical aspects of the model construction process. For most data mining projects,
    the goal is to find the internal hidden patterns inside the data. Therefore, hiding
    the detailed process is beneficial to the users of the tools or packages. But
    it is not helpful for beginners, visual learners, or those who want to understand
    how the mining process works. Let me use k-nearest neighbors method (K-NN) to
    illustrate the learning differences between RapidMiner, R, and Excel. Before we
    do that, we need to understand several terminologies in data mining.


    There are two types of data mining techniques: supervised and unsupervised. Supervised
    methods require the use of a training dataset to “train” the software programs
    or algorithms (such programs or algorithms are often referred to as machines)
    first. Programs are trained to reach an optimal state called a model. This is
    why a training process is also called modeling. Data mining methods can also be
    categorized into parametric and nonparametric methods. For parametric methods,
    a model is just a set of parameters or rules obtained through the training process
    that are believed to allow the programs to work well with the training dataset.
    Nonparametric methods do not generate a set of parameters. Instead, they dynamically
    evaluate the incoming data based on the existing dataset. You may be confused
    by such definitions at this time. They will make sense soon.


    What is a training dataset? In a training dataset, the target variable (also called
    label, target, dependent variable, outcome variable, response), the value of which
    is to be predicted, is given or known. The value of the target variable depends
    on the values of other variables which are usually called attributes, predictors,
    or independent variables. Based on the attribute values, a supervised data mining
    method computes (or so-called predicts) the value of the target variable. Some
    computed target values might not match the known target values in the training
    dataset. A good model indicates an optimal set of parameters or rules that can
    minimize the mismatches.


    A model is usually constructed to work on future datasets with unknown target
    values in a supervised data mining method. Such future datasets are commonly called
    scoring datasets. In an unsupervised data mining method, however, there is no
    training dataset and the model is an algorithm that can directly be applied on
    the scoring datasets. K-nearest neighbors method is a supervised data mining technique.'
