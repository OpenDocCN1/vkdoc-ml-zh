    | 91 | 89.8 |

    | 87 | 90.2 |

    | 86 | 81.1 |

    | 88 | 83.0 |

    | 92.8 | 90.9 |

    | 95.2 | 119.0 |

    | 93.3 | 94.9 |

    | 97.7 | 132.4 |


