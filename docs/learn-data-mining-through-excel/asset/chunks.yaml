    \ 是 humidity h（湿度-高）(0, 3) 和 humidity n（湿度-正常）(2, 0)。\n\n图 10-16\n\n决策树构建完成\n\n\
    属性温度（Temperature）从未用于拆分树。这恰好是该数据集的情况，即决策完全不依赖于温度。\n\n上述过程的完整结果可在文件 Chapter10-1b.xlsx\
    \ 中找到。\n\n您可能会想，是否可以应用在层次聚类章节中绘制树状图时学到的相同技巧来绘制树形图。当然可以。同样，这需要大量手动操作，因此我在此不进行演示，留给您自行尝试。\n\
    \n### 一种更好的方法\n\n还记得当我们从步骤 31 开始拆分节点 rainy(3,2) 时，需要修改工作表 level-2-rainy 中的一些公式吗？还有另一种非常相似但无需修改任何公式的方法。该方法在文件\
