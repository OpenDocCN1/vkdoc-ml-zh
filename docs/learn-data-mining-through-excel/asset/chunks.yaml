- fmt: '### Absolute Reference


    Assume that there is a ledger keeping the fixed interest rate and the amounts
    of loans lent to customers. Our job is to compute the interest each customer owes.
    Follow these instructions to complete the experiment:


    ![](images/494428_2_En_1_Chapter/494428_2_En_1_Fig6_HTML.jpg)


    An Excel screenshot. `Loan` and `Interest` are the data in cells `A1` and `B1`.
    Cells `A2` to `A9` are packed with numbers. Cell `B2` is highlighted. The arrow
    pointing to cell `B2` is the double click to autofill.


    **Figure 1-6** Autofill by double-click


    1. Open a blank Excel worksheet. Enter texts `"Loan"`, `"Interest"`, and `"Rate"`
    in cells `A1`, `B1`, and `D1`. Leave `C1` blank. Enter `"5%"` inside cell `D2`
    (without quotation marks).


    2. In cell `A2`, enter the formula `=RANDBETWEEN(1000,50000)`. This formula randomly
    generates an integer between 1000 and 50000 inclusively.


    3. Autofill from `A2` to `A12`.


    4. In cell `B2`, enter the formula `=A2*D2`. This formula calculates how much
    interest `A2` owes. Everything should be perfectly fine at this moment.


    5. Let’s try another quick autofill skill: select cell `B2` ➤ move the mouse cursor
    to the lower right corner of cell `B2` until the cursor becomes a black cross
    ➤ double-click. See Figure [1-6](#494428_2_En_1_Chapter.xhtml#Fig6). This double-click
    action automatically fills in formulas from cell `B3` to cell `B12` (`B2` already
    has a formula). Note: autofill by double-click works only with vertical downward
    autofill operations.


    Our worksheet now looks like Figure [1-7](#494428_2_En_1_Chapter.xhtml#Fig7).


    ![](images/494428_2_En_1_Chapter/494428_2_En_1_Fig7_HTML.jpg)


    An Excel screenshot. `Loan`, `Interest`, and `Rate` are the data in the cells
    `A1`, `B1`, and `D1`. `A2` to `A12` are packed with numbers. Cell `B2` is selected.
    Cell `D3` is `5%`. Data in the formula bar is `=A3*D3`, which is highlighted.


    **Figure 1-7** Autofill failed on interest calculation


    Except for cell `B2`, all other cells in column B do not obtain the correct result.
    The reason is because when we autofill from `B2` to `B12` vertically, the original
    formula in cell `B2` (`=A2*D2`) changes: the row index of every cell reference
    in the formula is automatically incremented one by one. As shown in Figure [1-7](#494428_2_En_1_Chapter.xhtml#Fig7),
    the formula in cell `B3` is `=A3*D3`. We can imagine that the formula in cell
    `B4` is `=A4*D4`.


    In cell `B3`, we need the formula to be `=A3*D2`, that is, when we autofill from
    `B2` to `B3`, we need the cell reference `A2` to be changed to `A3`, but we need
    the cell reference `D2` to stay the same.


    As mentioned before, cell reference `D2` has two parts: the column index `D` and
    the row index `2`. For vertical autofill, the column index will never change but
    the row index will. To keep the row index unchanged during autofill, we need to
    place `$` before the row index. This means, the formula in cell `B2` should be
    `=A2*D$2`. Using the symbol `$` to keep cell reference(s) in a formula unchanged
    or locked in autofill operations is called absolute reference.


    With this corrected formula in cell `B2`, let’s autofill from cell `B2` to `B12`
    again. We should get the correct result this time.


    Be aware that in cell `B2`, the formula `=A2*$D$2` works fine, too, for this specific
    task. When placing `$` before the column index `D`, the column index won’t change
    even when we are performing a horizontal autofill. However, be aware that we will
    run into cases where we must keep only part of a cell reference (either row index
    or column index only) unchanged in an autofill operation.


    ### Paste Special and Paste Values


    Continue with the worksheet on which we have been trying some interest calculation.
    Because they are generated by the function `RANDBETWEEN`, the numbers in column
    A keep changing in our worksheet and this is not good for demonstration. We would
    like to copy the numbers in cells `A1:D12` to another location and remove the
    random number feature. We can accomplish this task by using the Paste Special
    feature.


    Follow these instructions:


    ![](images/494428_2_En_1_Chapter/494428_2_En_1_Fig8_HTML.jpg)


    An Excel screenshot. The home tab is selected. In the paste drop-down list, the
    paste special option is selected.


    **Figure 1-8** Select Paste Special


    1. Select the cell area `A1:D12`. Under the main tab Home, click tool tab Copy.
    Let’s copy the numbers to area `A15:D26`.


    2. Click on cell `A15`; under the main tab Home, click Paste ➤ select Paste Special.
    This process is explained in Figure [1-8](#494428_2_En_1_Chapter.xhtml#Fig8).
    Note if your operating system has Right Click enabled, you can right-click on
    cell `A15` ➤ select Paste Special, too.


    ![](images/494428_2_En_1_Chapter/494428_2_En_1_Fig9_HTML.jpg)


    A screenshot of the paste special window. An option `Values` is selected in the
    paste. In operation, `None` is selected. A text reads another important feature
    to practice text is pointing towards the `Transpose` check box.


    **Figure 1-9** Paste Values


    1. A small menu shows up. On this menu, choose `Values` under Paste as shown in
    Figure [1-9](#494428_2_En_1_Chapter.xhtml#Fig9). Be aware of another available
    feature `"Transpose"` on this menu. It is a good idea to practice this `Transpose`
    feature as it is very useful for data preparation.


    Part of our worksheet looks similar to Figure [1-10](#494428_2_En_1_Chapter.xhtml#Fig10).


    ![](images/494428_2_En_1_Chapter/494428_2_En_1_Fig10_HTML.jpg)


    An Excel screenshot. Data in `A15`, `B15`, and `D15` are loans, interest, and
    rates. `A16` to `A26` and `B16` to `B26` are numbered cells. `D16` is `0.05`.


    **Figure 1-10** After Paste Values'
