- fmt: 'Suppose we want to predict if a person is likely to accept a credit card offer
    based on the person’s age, gender, income, and number of credit cards they already
    have. The target variable is the response to the credit card offer (assume it
    is either Yes or No), while age, gender, income, and number of existing credit
    cards are the attributes. In the training dataset, all variables including both
    the target and attributes are known. In such a scenario, a K-NN model is constructed
    through the use of the training dataset. Based on the constructed model, we can
    predict the responses to the credit card offer of people whose information is
    stored in the scoring dataset.


    In RapidMiner, one of the best data mining tools, the prediction process is as
    follows: retrieve both the training data and scoring data from the repository
    ➤ set role for the training data ➤ apply the K-NN operator on the training data
    to construct the model ➤ connect the model and the scoring data to the `Apply
    Model` operator. That’s it! You can now execute the process and the result is
    obtained. Yes, very straightforward. This is shown in Figure [1-1](#494428_2_En_1_Chapter.xhtml#Fig1).
    Be aware that there is no model validation in this simple process.


    ![](images/494428_2_En_1_Chapter/494428_2_En_1_Fig1_HTML.jpg)


    An illustration of the K-NN model. The processes are training data, set role,
    K-NN, scoring data, and apply model. The result is obtained at the end.


    **Figure 1-1** K-NN model in RapidMiner


    Applying K-NN method is very simple in R, too. After loading the library `class`,
    read the training data and scoring data, make use of the `knn()` function, and
    by then we have finished our job: ready to view our result. This is demonstrated
    in Figure [1-2](#494428_2_En_1_Chapter.xhtml#Fig2). Note that lines starting with
    `#` are comments.


    ![](images/494428_2_En_1_Chapter/494428_2_En_1_Fig2_HTML.jpg)


    A screenshot of a 10-line K-NN program in R. It includes the library class import,
    the training and scoring data read, the prediction combined with the scoring data
    set, and the prediction result viewed.


    **Figure 1-2** K-NN in R


    The knowledge you have gained from the preceding tasks is enough to just be able
    to apply the data mining method K-NN. But if you are trying to understand, step
    by step, why and how K-NN works, you will need a lot more information. Excel can
    offer you the opportunity to go through a step-by-step analysis process on a dataset
    during which you can develop a solid understanding of the K-NN algorithm. With
    this solid understanding, you can then be more proficient in using other powerful
    tools or programming languages. Most importantly, you will have a better understanding
    of the quality and value of your data mining results. You will see that in later
    chapters.


    Of course, Excel is much more limited in data mining compared to Python, R, and
    RapidMiner. Excel can only work with data up to a smaller size limit. Meanwhile,
    some data mining techniques are too complicated to be practiced through Excel.
    Nonetheless, Excel provides us direct and visual understanding of the data mining
    mechanisms. In addition, Excel is naturally suitable for data preparation.


    Today, because of the software tools and other packages, most effort in a data
    mining task is spent on understanding the task (including the business understanding
    and data understanding), preparing the data, and presenting the results. Less
    than 10% of the effort is spent on the modeling process. The process of preparing
    the data for modeling is called data engineering. Excel has an advantage on data
    engineering when the datasets are not too large because it can give us a visual
    representation of data engineering, which allows us to be more confident in our
    data preparation process.


    As an experienced educator, I realize that students can better develop a deep
    understanding of data mining methods if these methods are also explained through
    step-by-step instructions in Excel. Studying through Excel unveils the mystery
    behind data mining or machine learning methods and makes students more confident
    in applying these methods.


    Did I just mention machine learning? Yes, I did. Machine learning is another buzz
    phrase today. What is machine learning? What is the difference between data mining
    and machine learning? Moreover, what is artificial intelligence (AI) and what
    is the difference between AI and machine learning?


    The purposes of machine learning and data mining are somewhat different. The purpose
    of machine learning is to study how computers can develop human-like learning
    ability by learning from data. The purpose of data mining is to find valuable
    patterns or knowledge from data. However, data mining makes use of machine learning
    methods to achieve its goals, that is, the methodologies of data mining and machine
    learning can be the same. Anyhow, it is not necessary to differentiate them, and
    I would suggest that we treat them the same at this moment.


    The same scenario applies to AI and machine learning. Simply put, AI is computer
    software that simulates human brain functions, while machine learning trains computer
    algorithm through data to mimic human thinking ability. Because most AI makes
    use of machine learning to achieve its goals, machine learning is usually considered
    a subset of AI and therefore it is almost impossible to differentiate AI and machine
    learning either.'
