  trans: '

    ## 强化练习


    虽然有三项强化练习，但它们都基于我们在实验 2 中使用的数据。


    1.  练习 1：从与 Chapter13-2a.xlsx 相同的 Chapter13-HW-1.xlsx 开始；请按照实验 2 所示构建一个 2 隐藏层神经网络。但是，在使用规划求解最小化误差平方和时，请仅优化$H$2:$N$4
    范围内的参数。将预测结果与实验 2 的结果进行比较。参考 Chapter13-HW-1-withAnswers.xlsx。


    2.  练习 2：从与 Chapter13-2a.xlsx 相同的 Chapter13-HW-2.xlsx 开始；请按照实验 2 所示构建一个 2 隐藏层神经网络。但是，不要先优化第
    1 层参数。而是在构建两个隐藏层后，一起优化所有参数。将预测结果与实验 2 的结果进行比较。参考 Chapter13-HW-2-withAnswers.xlsx。


    3.  练习 3：从使用了四个神经元的 Chapter13-HW-3.xlsx 开始。请构建一个具有一个或两个隐藏层的神经网络。将预测结果与实验 2 的结果进行比较。参考
    Chapter13-HW-3-withAnswers.xlsx。


    比较从实验 2、练习 1、练习 2 和练习 3 中获得的结果将会很有趣。


    ## 复习要点


    1.  对神经网络的总体理解


    2.  输入层、隐藏层和输出层


    3.  聚合函数、转换函数或激活函数，特别是 Sigmoid 函数


    4.  Excel 函数：SUMPRODUCT、COUNTIFS、INDEX、AVERAGEIFS、MMULT 和 EXP


    5.  什么是深度学习


    6.  规划求解


    # 14. 文本挖掘


    文本挖掘是数据挖掘中一个庞大的主题，足以成为一个独立的领域。它也非常重要且应用广泛，以至于任何一本典型的数据挖掘书籍都不会遗漏它。到目前为止，我们使用的所有数据都是结构化数据。根据定义，结构化数据是指数据以特定格式排列，以便计算机程序可以轻松处理。我们一直使用的数据已经以表格格式排列，这是我们学过的所有数据挖掘方法所要求的格式。然而，文本数据（文本挖掘方法处理的对象）是一种非结构化数据，通常是序列数据。其他形式的非结构化数据包括音频文件、图像等。


    是否有可能应用我们学过的技术来挖掘像文章或网页这样的非结构化数据？答案是肯定的。但有一个前提条件。


    ## 总体理解


    要将我们学过的数据挖掘技术应用于非结构化文本数据，必须对数据进行预处理，使其成为结构化或至少是半结构化数据。有几种典型的预处理（准备）文本数据的技术。这些技术包括大小写转换、分词、停用词移除、词干提取、生成
    n-gram、词元替换等。在文本数据以表格格式组织后，我们可以构建一个词项-文档矩阵。由此，可以挖掘出有意义的信息，包括词频和词项模式，用于各种应用，如风险管理、客户服务、欺诈预防、垃圾邮件过滤、社交媒体文本分析等。


    假设我们正在阅读大量关于某家酒店的评论。我们的目的是根据正面评论数量与负面评论数量的对比来给酒店评级。首要任务是确定什么是正面或负面评论。这类任务类似于句子情感分析：判断一个短句的情绪或情感。评估句子情感的最简单技术是统计正面关键词和负面关键词的出现次数。当然，应该有一个包含这些关键词（和短语）的词典，代表正面或负面情绪。MPQA
    主观性词典正是这样一个词典，并被 Excel Azure 机器学习插件所采用。在 MPQA 主观性词典中，大约有 8000 个词；每个词都被分配了一个强或弱的极性分数。由于本书除了内置的规划求解插件外不使用其他插件，我们不会使用
    Azure 或 MPQA。相反，我将通过 Excel 创建一个小型词典来说明如何进行简单的观点（情感）分析。让我们先通过处理一条评论“The hotel it
    is fantastic”来了解数据准备步骤。


    1.  大小写转换：将所有单词转换为小写是一个好主意。我们不希望将“Fantastic”与“fantastic”区别对待。经过大小写转换后，原始评论变为“the
    hotel it is fantastic”。


    2.  分词：通过分词，我们将每个单词分离成一个独立的词元。在分词过程中，我们还会移除标点符号和空白字符。分词后，原始句子变成五个独立的单词：the, hotel,
    it, is, fantastic。


    3.  停用词是在上下文中没有实际意义的词。它们是英语中必要的连词和冠词，例如，then, a, the, it, is, of, for, just, to
    等。移除它们可以简化文本。移除停用词后，我们只剩下两个词：hotel 和 fantastic。


    4.  假设“fantastic”是我们词典中的一个正面词，极性分数为 1，而“hotel”是一个中性词，极性分数为 0。因此，这条评论被评估为正面（分数=1）。


    如果评论变为“The hotel it is not fantastic”，我们知道即使关键词 fantastic 存在，它也不应该是一条正面评论。如何评估这条评论为负面？可以有多种方法。


    *   方法 1：将“not”标记为负面关键词。如果采用这种方法，那么像“the hotel is not bad”这样的评论呢？


    *   方法 2：将“not fantastic”或“not bad”视为一个短语，并根据短语评估其含义。这就是 n-gram 技术的含义。


    *   方法 3：将方法 1 和方法 2 结合起来。将“not”标记为负面关键词，并将“not fantastic”或“not bad”视为一个短语。


    在文本挖掘中，n-gram 是`n`个单词的组合。单个单词可能会遗漏一些含义。“Good”是“not good”的反义词，并且在强度上与“very good”不同。应用
    gram 可以使我们的文本挖掘活动更精细，但也可能带来更多的复杂性。在本章中，为简单起见，我们只考虑 2-gram。这意味着我们将把“not fantastic”或“not
    bad”视为一个短语。


    在前面的例子中，我们没有使用词干提取技术。人们可能不会写“The hotel it is fantastic”，而是写成“The hotel it is a
    fantasy”。“fantasy”和“fantastic”具有相同的词源。为了降低文本挖掘的复杂性，词干提取技术会将“fantasy”视为“fantastic”。另一个例子是将“thanks”与“thank”同等对待。

    '
- fmt: "# Learn Text Mining Through Excel\n\nLet’s switch to Excel to exercise one\
    \ text mining example. Open the file `Chapter14-1a.xlsx`. There are two worksheets\
    \ there. The worksheet named “dictionary” contains some stop words and some positive\
    \ vs. negative keywords (called Polarity Words in the worksheet). Note, these\
    \ words are specifically collected for this text mining demonstration only. Figure\
    \ [14-1](#494428_2_En_14_Chapter.xhtml#Fig1) shows part of the worksheet “dictionary”.\n\
    \n![](images/494428_2_En_14_Chapter/494428_2_En_14_Fig1_HTML.jpg)\n\nA screenshot\
    \ of the table with 3 columns and 22 rows. The column headers are polarity words,\
    \ polarity score, and stop words. The polarity words are not, amazing, best, cozy,\
    \ delightful, enjoy, excellent, fantastic, good, lovely, and many more.\n\n**Figure\
    \ 14-1** Some polarity keywords and their negations, and some stop words\n\nAs\
    \ shown in Figure [14-1](#494428_2_En_14_Chapter.xhtml#Fig1), column D in worksheet\
    \ dictionary stores some stop words. Both positive and negative single keywords\
    \ together with their negated 2-gram phrases are stored in column A. Column B\
    \ keeps the scores associated with each keyword. Note “not” is designated as a\
    \ negative keyword (cell A2) with score -1. Except for the keyword “not”, all\
    \ other single keywords in Figure [14-1](#494428_2_En_14_Chapter.xhtml#Fig1) are\
    \ positive. Their negated 2-gram phrases are all assigned a score of -1. Why?\
    \ Let me use the short sentence “It is not amazing” as an example to explain.\
    \ Given the short sentence “It is not amazing”, the two single keywords “not”\
    \ and “amazing” would generate -1 and 1, respectively. The 2-gram phrase “not\
    \ amazing” gives -1; therefore, the total score of this short sentence equals\
    \ −1 + 1 − 1 = −1: negative.\n\n![](images/494428_2_En_14_Chapter/494428_2_En_14_Fig2_HTML.jpg)\n\
    \nA screenshot of a table. The table consists of two columns and twenty rows.\
    \ The row entries are negated 2-gram phrases and their scores. The negated phrases\
    \ are bad, difficult, expensive, outrageous, ridiculous, rude, sick, terrible,\
    \ unhappy, unpleasant, not bad, and many more.\n\n**Figure 14-2** Single negative\
    \ keywords and their negated 2-gram phrases\n\nThe scores assigned to the 2-gram\
    \ phrases of single negative keywords are all 2, as shown in Figure [14-2](#494428_2_En_14_Chapter.xhtml#Fig2).\
    \ For example, “not bad” has a score of 2. Why? Consider the short sentence “It\
    \ is not bad”. Both “not” and “bad” return -1, while “not bad” returns 2. Therefore,\
    \ the total score of this short sentence is −1 − 1 + 2 = 0: neutral.\n\nRemember\
    \ that the preceding score assignments are for this text mining task only. We\
    \ can certainly modify the “dictionary” based on other preferences. For example,\
    \ if we prefer “not bad” to be positive, then we may want to assign the 2-gram\
    \ phrase “not bad” a score of 3. The scoring system used here is just an example.\n\
    \nTo make easy use of these keywords and stop words, we would like to name them.\
    \ Click the main tab Formula ➤ click Name Manager on the upcoming menu ➤ click\
    \ the button New. This procedure is explained in Figure [14-3](#494428_2_En_14_Chapter.xhtml#Fig3).\
    \ Note that Name Manager is available since Excel 2010.\n\n![](images/494428_2_En_14_Chapter/494428_2_En_14_Fig3_HTML.jpg)\n\
    \nA screenshot of the Excel tab exhibits how to create names for keywords. Click\
    \ the main tab Formula then click Name Manager on the upcoming menu and then click\
    \ the button New. The text is written once this menu shows up click on the button\
    \ new.\n\n**Figure 14-3** Create names for keywords and stop words\n\nClicking\
    \ the button “New…” as shown in Figure [14-3](#494428_2_En_14_Chapter.xhtml#Fig3)\
    \ would pop up another small menu, as illustrated in Figure [14-4](#494428_2_En_14_Chapter.xhtml#Fig4).\
    \ As the keywords are in the array A2:A56, the “Refers to:” is set to `=dictionary!$A$2:$A$56`.\
    \ Enter “kw” for the name.\n\nBe aware that the “Scope” is Workbook. This indicates\
    \ that the name `kw` is accessible in every worksheet. Click OK.\n\n![](images/494428_2_En_14_Chapter/494428_2_En_14_Fig4_HTML.jpg)\n\
    \nA screenshot of the new name dialog box that includes the name as k w, scope\
    \ as a workbook, comment as please make sure that the scope is workbook as shown\
    \ here, and refer to. At the bottom right are ok and cancel buttons. Ok button\
    \ highlighted.\n\n**Figure 14-4** Name the array for keywords\n\nAfter clicking\
    \ the button OK, the menu in Figure [14-3](#494428_2_En_14_Chapter.xhtml#Fig3)\
    \ is updated to be like Figure [14-5](#494428_2_En_14_Chapter.xhtml#Fig5).\n\n\
    ![](images/494428_2_En_14_Chapter/494428_2_En_14_Fig5_HTML.jpg)\n\nA screenshot\
    \ of the name manager tab exhibits the name, value, refers to, scope, and comment\
    \ after the keyword array is named k w. At the bottom is the refers to option\
    \ with a close button.\n\n**Figure 14-5** After keyword array is named `kw`\n\n\
    Continue to name the array of keyword scores (called “Polarity Scores” in the\
    \ worksheet) and the array of stop words, respectively, as shown in Figure [14-6](#494428_2_En_14_Chapter.xhtml#Fig6).\n\
    \n![](images/494428_2_En_14_Chapter/494428_2_En_14_Fig6_HTML.jpg)\n\nA screenshot\
    \ of new name dialog box k w s. It has scope as a workbook alongside comment and\
    \ refer to panes. A screenshot of new name dialog box s t w. It has scope as a\
    \ workbook alongside comment and refer to panes. At the bottom right of each box\
    \ are the ok and cancel buttons. Ok button highlighted.\n\n**Figure 14-6** Name\
    \ the keyword scores and stop words\n\nMake sure that the keyword scores are named\
    \ “kws” and the stop words are named “stw”. The Name Manager concludes the naming\
    \ as shown in Figure [14-7](#494428_2_En_14_Chapter.xhtml#Fig7).\n\n![](images/494428_2_En_14_Chapter/494428_2_En_14_Fig7_HTML.jpg)\n\
    \nA screenshot of the name manager tab exhibits the name, value, refers to, scope,\
    \ and comment after the keyword array is named k w, k w s, and s t w. At the bottom\
    \ is the refers to option with a close button.\n\n**Figure 14-7** Confirm the\
    \ naming\n\nBy naming those arrays, we can now reference the keywords by the name\
    \ “kw”, keyword scores by “kws”, and stop words by “stw”.\n\nThere are 34 reviews\
    \ in the worksheet named “hotelReview”. They are placed in cells A1:A34. Take\
    \ a close look at them. Figure [14-8](#494428_2_En_14_Chapter.xhtml#Fig8) displays\
    \ part of the reviews.\n\n![](images/494428_2_En_14_Chapter/494428_2_En_14_Fig8_HTML.jpg)\n\
    \nA screenshot of hotel reviews such as the hotel is fantastic, environment it\
    \ is great, cozy, breakfast has high-quality products but it lacks in choice,\
    \ price utterly ridiculous for what you get, 10 stars, everything ok, and many\
    \ more.\n\n**Figure 14-8** A glance of the reviews\n\nFollow these steps to complete\
    \ our text mining exercise:\n\n![](images/494428_2_En_14_Chapter/494428_2_En_14_Fig9_HTML.jpg)\n\
    \nA screenshot of 3 columns and 8 rows. It exhibits the same hotel reviews such\
    \ as the hotel is fantastic, the environment it is great, cozy, breakfast has\
    \ high-quality products but it lacks in choice, price is utterly ridiculous for\
    \ what you get, we will come back, not bad at all, and others.\n\n**Figure 14-9**\
    \ Worksheet after paste values\n\n1.  As we have learned, we need to transform\
    \ all the words into lowercase and trim the spaces around each sentence. Enter\
    \ the formula `=TRIM(LOWER(A1))` in cell B1, and then autofill to cell B34. This\
    \ formula transforms the text into lowercase and trims off both the leading and\
    \ tailing blank spaces.\n\n2.  Some sentences are ended by exclamation. To remove\
    \ exclamations, enter the following formula in cell C1:\n\n    ```\n    =IF(MID(B1,LEN(B1),1)=\"\
    !\", TRIM(LEFT(B1,LEN(B1)-1)),B1)\n    ```\n\n    `LEN(B1)` returns the length\
    \ of the text inside cell B1. `MID(B1,LEN(B1),1)` picks the last character of\
    \ the text in B1. If the last character is “!”, `LEFT(B1,LEN(B1)-1)` removes “!”\
    \ by taking all the characters except the last one. If the last character is not\
    \ “!”, it takes whatever is inside B1.\n\n    Note: after removing “!”, `TRIM(LEFT(B1,LEN(B1)-1))`\
    \ trims any possible spaces again."
