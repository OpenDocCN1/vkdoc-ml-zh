    the main tab `Data` ➤ click `Get Data`; a list of data sources is presented including
    `From File`, `From Databases`, etc. For general purpose, importing data from files
    might be the most common. Be aware that Excel can only import text files properly.
    It cannot properly import files with special formatting such as Microsoft Word
    files.


    Different Excel versions have different user interfaces on data importing. I won’t
    illustrate how to use this feature in this book because all needed data for this
    book are well prepared in those Excel files which can be downloaded from GitHub
    at [`https://github.com/hhohho/Learn-Data-Mining-through-Excel-2`](https://github.com/hhohho/Learn-Data-Mining-through-Excel-2).


    Before I end this chapter, I would like to point out that this book is for Office
    2016 and after. Thus, some new and more powerful functions of Office 365 are not
    introduced in this book because they are not available in Office 2016.


    ## Reinforcement Exercises


    If you would like to practice some of the skills mentioned in this chapter, please
    open the `Chapter1-HW.xlsx` file to practice. Should you run into difficulties,
    please take a look at the solutions inside `Chapter1-HW-withAnswers.xlsx`.


    ## Review Points


    This is our first chapter. Please review the following topics and skills:


    1.  The advantages of learning data mining through Excel examples

    2.  Excel formula

    3.  Excel skill autofill

    4.  Absolute and relative references

    5.  `Remove Duplicates` and `Paste Special`

    6.  Excel functions `RANDBETWEEN`, `IF`, `COUNTIFS`, `SUMIFS`, and `AVERAGEIFS`


    # 2. Linear Regression


    Please download the sample Excel files from [`https://github.com/hhohho/Learn-Data-Mining-through-Excel-2`](https://github.com/hhohho/Learn-Data-Mining-through-Excel-2)
    for this chapter’s exercises.


    ## General Understanding


    Linear regression is a predictive model in which training data is employed to
    construct a linear model to make predictions on the scoring data. When we talk
    about a linear model, we mean that the relationship between the target (dependent
    variable) and the attribute(s) (independent variables) is linear. It is a convention
    to use the terminologies “independent variable” and “dependent variable” in regression
    analysis. Therefore, in this chapter, we will replace attribute with independent
    variable and substitute dependent variable for target.


    There might be one or more independent variables in linear regression analysis.
    When there is only one independent variable, the linear model is expressed by
    the commonly seen linear function `y = mx + b`, where `y` is the dependent variable,
    `m` is the slope of the line, and `b` is the y-intercept. In most cases, there
    is more than one independent variable; therefore, the linear model is represented
    as `y = m1x1 + m2x2 + ... + mnxn + b`, where there are `n` independent variables
    and `mi` is the coefficient associated with a specific independent variable `xi`,
    for `i = 1 ... n`. To construct such a linear model, we need to find the values
    of `mi` and `b`, based on the known `y` and `xi` values in the training dataset.


    Let’s start a scenario to learn what linear regression can do. In a southern beach
