  trans: "\n### 实验 1\n\n打开 `Chapter13-1a.xlsx` 文件，其中包含从 UCI 机器学习库（[`https://doi.org/10.24432/C5HP4Z`](https://doi.org/10.24432/C5HP4Z)）下载的威斯康星州乳腺癌（原始）数据集。有关该数据集的详细信息，请访问\
    \ [`https://archive.ics.uci.edu/`](https://archive.ics.uci.edu/) 或阅读期刊文章（W.H.\
    \ Wolberg 和 O.L. Mangasarian：“用于医学诊断的乳腺细胞学模式分离多表面方法”，PNAS，1990，87:9193-9196）。\n\
    \n原始数据包含十个属性和一个名为“Class”的目标变量。该目标变量有两个值：2 表示良性乳腺癌，4 表示恶性乳腺癌。第一个属性是样本编码编号，已在 `Chapter13-1a.xlsx`\
    \ 中移除。为简化起见，其余九个属性被重命名为 x1, x2, …, x9。下载的数据集最初有 699 个样本。由于 16 个样本缺少一个属性，因此这 16\
    \ 个样本已被移除。因此，在 `Chapter13-1a.xlsx` 中，只有 683 个样本。\n\n其中 500 个样本用作训练数据集；其余 183 个样本将用作测试数据集，以评估我们的神经网络模型的性能。工作表顶部部分如图\
    \ 13-3 所示。\n\n![](img/494428_2_En_13_Fig3_HTML.jpg)\n\nExcel 工作表截图展示了乳腺癌数据集。\n\
    \n图 13-3\n\n从 UCI 下载的乳腺癌数据集\n\n在我们的第一个实验中，为简单起见，我们将只设置一个包含三个神经元（通常称为节点）的隐藏层，如单元格\
    \ A1:A4 中所标记。权重 w1, w2, …, w9 是九个属性的权重（系数），而 `b` 是所谓的偏置，即线性函数中的截距。每个神经元都有自己的一组权重和偏置。注意，我们将使用线性聚合函数。`Wo`\
    \ 和 `Bo` 表示用于输出层的权重和偏置。如果此时感到困惑，不必担心。当这些数据被使用时，我会在每一步详细解释。\n\n请按照以下说明完成此实验：\n\n\
    ![](img/494428_2_En_13_Fig4_HTML.jpg)\n\nExcel 工作表截图包含权重和截距数据，其值均为 1。\n\n图 13-4\n\
    \n用 1 初始化权重和截距\n\n1.  第一个任务是为权重和截距赋值。我们将它们全部赋值为 1，如图 13-4 所示。\n\n1.  每个神经元将所有训练样本作为输入。训练样本存储在表格\
    \ B11:K510 中。对于样本 1（第 11 行），其所有属性值分别在神经元 1、2 和 3 内部聚合成一个单一值。因此，我们需要在单元格 L11 中输入以下公式：\n\
    \n```\n    =SUMPRODUCT($B11:$J11,INDEX($B$2:$J$4,L$10,0))+INDEX($K$2:$K$4,L$10,1)\n\
    \    ```\n\n该公式实现了线性表达式 w1x1 + w2x2 + w3x3 + … + b。在此特定公式中，w1, w2, w3… 和 `b` 对应于神经元\
    \ 1（B2:K2），而 x1, x2, x3, … 对应于第 11 行的第一个数据点。\n\n函数 SUMPRODUCT 用于计算两个数组（B11:J11\
    \ 和 B2:J2）的乘积之和。我们可以将函数写为 `SUMPRODUCT($B11:$J11,$B$2:$J$2)`。然而，我们希望在不重复编写公式的情况下，从\
    \ L11 自动填充到 N11。因此，应用了 `INDEX($B$2:$J$4,L$10,0)`，以根据单元格 L10 中的值获取数组 B2:J2。由于 L10\
    \ = 1，`INDEX($B$2:$J$4,L$10,0)` 从表格 B2:J4 中提取第一行。\n\n`INDEX($K$2:$K$4,L$10,1)`\
    \ 获取单元格 K2 中的值，即偏置。注意，数组 K2:K4 只有一列；这就是 INDEX 函数中最后一个参数为 1 的原因。\n\n2.  从 L11 自动填充到\
    \ N11，然后一起自动填充到 L510:N510。工作表的部分内容如图 13-5 所示。检查单元格 M11 内的公式。由于 M10 = 2，聚合函数使用了神经元\
    \ 2 的系数。\n"
- fmt: '# This step can be understood as the input layer.


    ![](images/494428_2_En_13_Chapter/494428_2_En_13_Fig5_HTML.jpg)


    A screenshot of the Excel sheet contains the weights and intercepts data. Following
    the aggregation function, the neuron weighted sum is updated.


    **Figure 13-5** Aggregation function applied


    As mentioned before, after the aggregation function, the activation function (sigmoid
    function) needs to be applied to start the hidden layer. However, since sigmoid
    function favors its input data to be normalized between -1 and 1 or between 0
    and 1, we need to normalize the values in columns L, M, and N. Let’s just normalize
    the values into the range of 0 and 1 as all values are positive at this point.


    3. Enter `MAX` inside cell K6 and `MIN` in cell K7.

    4. Enter the formula `=MAX(L11:L510)` in cell L6 and the formula `=MIN(L11:L510)`
    in cell L7.

    5. Select both cells L6 and L7; autofill to N6:N7 as shown in Figure [13-6](#494428_2_En_13_Chapter.xhtml#Fig6).

    6. In addition, merge cells O9:Q9; enter the text `normalized` in the merged cell,
    and 1, 2, and 3 in cells O10, P10, and Q10, respectively. The normalized weighted
    sums will be stored in columns O, P, and Q, respectively.


    Compare our worksheet with Figure [13-6](#494428_2_En_13_Chapter.xhtml#Fig6).
    Don’t be surprised that numbers in columns L, M, and N are the same.


    ![](images/494428_2_En_13_Chapter/494428_2_En_13_Fig6_HTML.jpg)


    A screenshot of the Excel sheet contains the weights and intercepts data. Cells
    L6 and L7 are chosen. The normalized weighted sums are in columns O, P, and Q,
    respectively.


    **Figure 13-6** Ready to normalize data


    1. Enter the formula `=(L11-L$7)/(L$6-L$7)` in cell O11. This formula normalizes
    the value inside cell L11 to be between 0 and 1 inclusively.

    2. Autofill from O11 to Q11, and then autofill together to O510:Q510. Don’t be
    surprised that numbers in columns O, P, and Q are the same. Be aware that the
    formula `=(L11-L$7)/(L$6-L$7)` can cause an error when L6 (the maximum) equals
    L7 (the minimum). Such a case should never happen, however. If it does happen,
    that means the attribute has no variance and should be removed.

    3. Time to transform the normalized data by the sigmoid function. Merge cells
    R9, S9, and T9. In the merged cell, enter `sigmoid transformed`. In cells R10,
    S10, and T10, enter numbers 1, 2, and 3, respectively. Part of our worksheet looks
    like Figure [13-7](#494428_2_En_13_Chapter.xhtml#Fig7).


    ![](images/494428_2_En_13_Chapter/494428_2_En_13_Fig7_HTML.jpg)


    An Excel sheet contains the weights and intercepts data. The normalized and sigmoid
    transformed columns are highlighted.


    **Figure 13-7** After normalization but before sigmoid transformation


    ![](images/494428_2_En_13_Chapter/494428_2_En_13_Fig8_HTML.jpg)


    An excel spreadsheet containing neuron weighted sum, normalized, sigmoid transformed,
    output, and error values.


    **Figure 13-8** Ready to generate output and compute errors


    1. Based on Equation (11-1), enter the formula `=1/(1+EXP(-O11))` in cell R11.

    2. Autofill from R11 to T11, then autofill together to R510:T510.

    3. In cells U10 and V10, enter `Output` and `Error`, respectively. By now, part
    of our worksheet looks exactly like Figure [13-8](#494428_2_En_13_Chapter.xhtml#Fig8).


    ![](images/494428_2_En_13_Chapter/494428_2_En_13_Fig9_HTML.jpg)


    An Excel spreadsheet containing the generated output and the calculated error.
    The error sum equals 314.828.


    **Figure 13-9** Output generated and error calculated


    1. The output is another aggregation function using the `Wo` values in cells L2:L4
    and the `Bo` value in cell M2. In cell U11, enter the following formula:


    ```

    =MMULT(R11:T11,$L$2:$L$4)+$M$2

    ```


    Note that the function `SUMPRODUCT` does not work for the two arrays R11:T11 and
    L2:L4. This is because R11:T11 is like a row, while L2:L4 is like a column. However,
    the function `MMULT` (matrix multiplication) is perfect for this type of array
    multiplication. Observe cells M3 and M4 are not used.


    2. Autofill from cell U11 to cell U510.

    3. In cell V11, enter the formula `=(U11-K11)^2` which gives the square of the
    difference between the output U11 and the original Class value K11. We have seen
    the use of square in error calculation before. One reason to square the difference
    is to make the error positive.

    4. Autofill from cell V11 to cell V510.


    In neural network, we need to search for optimal values for weights w1, w2, …,
    w9, `Wo`, `b`, and `Bo` such that the sum of the errors is minimized.


    5. In cell P1, enter `Error Sum`.

    6. In cell Q1, enter the formula `=SUM(V11:V510)`.


    Compare our result with Figure [13-9](#494428_2_En_13_Chapter.xhtml#Fig9).


    ![](images/494428_2_En_13_Chapter/494428_2_En_13_Fig10_HTML.jpg)


    A screenshot of the solver parameters window. It has the following fields. Set
    objective, by changing variable cells, subject to the constraints, and select
    a solving method.


    **Figure 13-10** Using Solver to find optimal parameters


    1. We need to make use of Solver again to find the optimal weights and biases.
    Click Data ➤ Solver; follow Figure [13-10](#494428_2_En_13_Chapter.xhtml#Fig10)
    to set up the cell ranges for Solver.

    2. Check `Make Unconstrained Variables Non-Negative`. The result will be different
    (likely better) if we uncheck it. In this experiment, let’s check it.


    It may take some time for Solver to complete the optimal parameter search. Once
    Solver completes its work, our worksheet should look like Figure [13-11](#494428_2_En_13_Chapter.xhtml#Fig11).


    ![](images/494428_2_En_13_Chapter/494428_2_En_13_Fig11_HTML.jpg)


    An Excel sheet illustrates the optimal parameters search for neural network.


    **Figure 13-11** Solver finds optimal parameters for neural network with one hidden
    layer


    With the optimized weights and biases, our next task is to find a cutoff to distinguish
    between benign and malignant classes. In neural network, it is common to employ
    the softmax function (for multi-classification) or sigmoid function (for binary
    classification) to compute the probabilities for each class in the output layer.
    This requires quite some effort for the computation of cross-entropy. For simplicity,
    let’s just find a cutoff to complete the output layer in our experiment. Follow
    these instructions to compute the cutoff:


    ![](images/494428_2_En_13_Chapter/494428_2_En_13_Fig13_HTML.jpg)


    An Excel sheet contains the calculation of the predicted testing samples. Columns
    W and X are highlighted.


    **Figure 13-13** Assess the neural network model with the testing dataset


    1. Enter `mean` and `count` in cells P6 and P7, respectively.

    2. Enter numbers 2 and 4 in cells Q5 and R5 and `cutoff` and `missed` in cells
    S5 and T5.

    3. Enter the formula `=AVERAGEIFS($U11:$U510,$K11:$K510,Q5)` in cell Q6. This
    formula computes the averaged output value for class benign.

    4. Autofill from Q6 to R6.

    5. Enter the formula `=COUNTIFS($K11:$K510,Q5)` in cell Q7. This formula computes
    the number of class benign in the training dataset.

    6. Autofill from Q7 to R7.

    7. Enter the formula `=(Q6*Q7+R6*R7)/500` in cell S6. This is the cutoff to distinguish
    class 2 and 4 (benign and malignant).


    Part of our worksheet looks like Figure [13-12](#494428_2_En_13_Chapter.xhtml#Fig12).


    ![](images/494428_2_En_13_Chapter/494428_2_En_13_Fig12_HTML.jpg)


    An Excel sheet illustrates the cutoff data to distinguish class 2 and 4.


    **Figure 13-12** Cutoff computed for the neural network model with one hidden
    layer


    It’s time to assess our neural network model (note again that this model is just
    a set of optimized parameters) with the testing dataset. Follow these instructions:


    8. Select cells L510:U510; autofill them together down to cells L693:U693.

    9. Enter `Predict` and `Diff` in cells W10 and X10.

    10. Enter the formula `=IF(U11<=$S$6,2,4)` in cell W11; autofill from W11 to W693.

    11. Enter the formula `=IF(K11=W11,0,1)` in cell X11; autofill from X11 to X693.'
