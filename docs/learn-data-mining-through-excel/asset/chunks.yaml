    \ 5-1\n\nApply LDA on the training dataset\n\nAgain, the LDA works well on the\
    \ Iris dataset. There are only two false predictions. However, the validation\
    \ results in Figure [5-1](#494428_2_En_5_Chapter.xhtml#Fig1) were obtained through\
    \ a residual analysis.\n\nFollow these instructions to complete the cross-validation\
    \ procedure in Excel:\n\n![](images/494428_2_En_5_Chapter/494428_2_En_5_Fig2_HTML.jpg)\n\
    \nA spreadsheet represents the values of Iris type, x 1, x 2, x 3, and x 4, from\
    \ the columns A to E. The Iris type reads Iris-Setosa. Columns K, L, and M denote\
    \ the mean and cutoff values of 3 sample numbers at the bottom and a set of values\
    \ at the top without any column header.\n\nFigure 5-2\n\nCopy the LDA parameter\
    \ set to the testing worksheet\n\n1.  In the worksheet training_dataset, the parameter\
    \ set (w[1], w[2], …w[n], b) is stored in cells M5:M9, while the cutoffs are referenced\
    \ by cells M12 and M13\\. Select cells K1:M16 and copy them.\n\n2.  Click the\
    \ testing_dataset worksheet to open it.\n\n3.  In the worksheet testing_dataset,\
    \ right-click on cell K1 ➤ apply the Paste Special skill to paste values into\
    \ cell K1\\. Remember to paste values only.\n\nOur testing_dataset worksheet should\
    \ look like Figure [5-2](#494428_2_En_5_Chapter.xhtml#Fig2).\n\n![](images/494428_2_En_5_Chapter/494428_2_En_5_Fig3_HTML.jpg)\n\
    \nA spreadsheet represents the values of Iris type, x 1, x 2, x 3, x 4, numerical\
    \ classifier, type classifier, and difference, from columns A to I The Iris type\
    \ reads Iris-Setosa. Columns K, L, and M denote the mean, cutoff, and difference\
    \ values of 3 sample numbers at the bottom.\n\nFigure 5-3\n\nCross-validation\
    \ with the testing dataset\n\n1.  In cells G1:I1, type “Numerical classification”,\
    \ “Type classification”, and “Difference”, respectively.\n\n2.  In cell G2, enter\
    \ the following formula:\n\n```\n    =MMULT(B2:E2, M$6:M$9)+ M$5\n    ```\n\n\
    3.  Autofill from G2 to G48.\n\n4.  In cell H2, enter the following formula:\n\
    \n```\n    =IF(G2<M$12,L$1,IF(G2<M$13,L$2,L$3))\n    ```\n\n5.  Autofill from\
    \ H2 to H48.\n\n6.  In cell I2, enter the formula `=IF(A2=H2,0,1)`, hit Enter,\
    \ and then autofill from I2 to I48.\n\n7.  At last, in cell M16, enter the formula\
    \ `=SUM(I2:I48)`."
  trans: "\n## 交叉验证的总体理解\n\n预测模型在成功应用于评分数据之前，必须经过验证。使用与测试数据集相同的训练数据集来评估构建的模型，并不是一种好的模型验证方法。这种验证策略被称为残差分析。它比较实际输出与预测输出之间的差异（即所谓的残差）。在第\
    \ 4 章中，我们应用残差分析来评估所构建的 LDA 模型的质量。\n\n残差分析无法判断模型在评分数据（即未来目标值未知的数据）上的表现。一种解决方案是保留部分原始训练数据集作为测试子集。在许多情况下，测试子集也被称为验证子集，尽管它们可以进一步区分。在本书中，我们将它们视为等同。由于模型未使用测试子集进行训练，因此该测试子集可以充当评分数据集，并告诉我们模型在未知数据上的表现如何。这种验证策略称为交叉验证。\n\
    \n交叉验证有几种策略。最简单的是留出法，它将原始训练数据集分为两个子集：训练子集和测试子集。模型在训练子集上训练，但在测试子集上评估。这种方法比残差分析更可靠，但其性能在很大程度上取决于训练子集和测试子集中包含哪些数据，即如何划分原始训练数据集会显著影响模型性能。机器学习领域的一个共识是，训练子集应大于测试子集，通常至少是测试子集的两倍。此外，在保证测试子集中有足够的数据点来评估模型的前提下，训练子集应尽可能大。\n\
    \nK 折交叉验证是留出法的一种改进版本。在 K 折交叉验证中，原始训练数据被随机分成 k 个子集，然后进行 k 次留出评估。在每次留出评估中，一个子集被用作测试数据进行验证；所有其他\
    \ k-1 个子集被组合在一起用于训练。在 K 折交叉验证中，每个数据点在测试子集中被使用一次，但在训练子集中被使用 k-1 次。模型的性能基于这 k 次评估的整体质量。\n\
    \n一种广泛使用的交叉验证方法是留一法（LOO），它是 K 折交叉验证的一种极端形式。在 LOO 中，每次测试数据只包含一个数据点；其余的数据点被组合在一起作为训练子集。\n\
    \n## 通过 Excel 学习交叉验证\n\n当数据集很大时，如果不涉及 VBA 编程，在 Excel 中进行 LOO 交叉验证是不切实际的。事实上，在\
    \ Excel 中进行 K 折交叉验证也非常繁琐。因此，我将仅演示如何使用 Excel 进行留出法交叉验证。不过，文件 Chapter5-cv-1c.xlsx\
    \ 提供了一个使用 LDA 进行五折交叉验证的演示。\n\n在上一章中，我们学习了如何对鸢尾花数据集进行线性判别分析。在本章中，鸢尾花数据集已被分为两个子集：训练子集和测试子集。使用随机算法选取大约三分之二的数据点作为训练数据集，其余作为测试数据集。\n\
    \n打开文件 Chapter5-cv-1a.xlsx。其中有两个工作表：training_dataset（包含 103 条数据记录）和 testing_dataset（包含\
    \ 47 条数据记录）。按照我们在上一章中学到的关于 LDA 的知识，让我们利用函数 LINEST 在 training_dataset 工作表中找到函数\
    \ P 的参数集（w[1], w[2], …w[n], b）。我们的工作表应如图 5-1 所示。请注意，训练数据集中只有 103 个数据点。\n\n![](img/494428_2_En_5_Fig1_HTML.jpg)\n\
    \n一张电子表格截图，显示了鸢尾花类型、x1、x2、x3、x4、y、数值分类、类型分类和差异的值。K、L、M 列表示一组没有列标题的值。\n\n图 5-1\n\
    \n在训练数据集上应用 LDA\n\n同样，LDA 在鸢尾花数据集上表现良好。只有两个错误预测。然而，图 5-1 中的验证结果是通过残差分析获得的。\n\n\
    请按照以下说明在 Excel 中完成交叉验证过程：\n\n![](img/494428_2_En_5_Fig2_HTML.jpg)\n\n一张电子表格，显示了从\
    \ A 列到 E 列的鸢尾花类型、x1、x2、x3 和 x4 的值。鸢尾花类型显示为 Iris-Setosa。K、L、M 列表示底部 3 个样本数的平均值和截止值，以及顶部一组没有列标题的值。\n\
    \n图 5-2\n\n将 LDA 参数集复制到测试工作表\n\n1.  在 training_dataset 工作表中，参数集（w[1], w[2], …w[n],\
    \ b）存储在单元格 M5:M9 中，而截止值由单元格 M12 和 M13 引用。选择单元格 K1:M16 并复制它们。\n\n2.  单击 testing_dataset\
    \ 工作表将其打开。\n\n3.  在 testing_dataset 工作表中，右键单击单元格 K1 ➤ 应用“选择性粘贴”功能将值粘贴到单元格 K1 中。请记住仅粘贴值。\n\
    \n我们的 testing_dataset 工作表应如图 5-2 所示。\n\n![](img/494428_2_En_5_Fig3_HTML.jpg)\n\
    \n一张电子表格，显示了从 A 列到 I 列的鸢尾花类型、x1、x2、x3、x4、数值分类器、类型分类器和差异的值。鸢尾花类型显示为 Iris-Setosa。K、L、M\
    \ 列表示底部 3 个样本数的平均值、截止值和差异值。\n\n图 5-3\n\n使用测试数据集进行交叉验证\n\n1.  在单元格 G1:I1 中，分别输入“数值分类”、“类型分类”和“差异”。\n\
    \n2.  在单元格 G2 中，输入以下公式：\n\n```\n    =MMULT(B2:E2, M$6:M$9)+ M$5\n    ```\n\n3.\
    \  从 G2 自动填充到 G48。\n\n4.  在单元格 H2 中，输入以下公式：\n\n```\n    =IF(G2<M$12,L$1,IF(G2<M$13,L$2,L$3))\n\
    \    ```\n\n5.  从 H2 自动填充到 H48。\n\n6.  在单元格 I2 中，输入公式`=IF(A2=H2,0,1)`，按 Enter\
    \ 键，然后从 I2 自动填充到 I48。\n\n7.  最后，在单元格 M16 中，输入公式`=SUM(I2:I48)`。\n"
