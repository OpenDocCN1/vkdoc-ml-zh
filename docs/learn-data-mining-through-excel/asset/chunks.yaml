    假设我们要根据一个人的年龄、性别、收入以及他们已有的信用卡数量，来预测其是否可能接受信用卡优惠。目标变量是对信用卡优惠的响应（假设为“是”或“否”），而年龄、性别、收入和现有信用卡数量则是属性。在训练数据集中，包括目标和属性在内的所有变量都是已知的。在这种情况下，我们通过使用训练数据集来构建一个
    K-NN 模型。基于构建好的模型，我们可以预测那些信息存储在评分数据集中的人对信用卡优惠的响应。


    在最佳数据挖掘工具之一 RapidMiner 中，预测过程如下：从存储库中检索训练数据和评分数据 ➤ 为训练数据设置角色 ➤ 对训练数据应用 K-NN 算子以构建模型
    ➤ 将模型和评分数据连接到“应用模型”算子。就这样！现在你可以执行该过程，结果就会得到。是的，非常直接。如图 1-1 所示。请注意，在这个简单过程中没有模型验证。


    ![](img/494428_2_En_1_Fig1_HTML.jpg)


    K-NN 模型的示意图。流程包括训练数据、设置角色、K-NN、评分数据和应用模型。最终得到结果。


    图 1-1

    RapidMiner 中的 K-NN 模型


    在 R 语言中应用 K-NN 方法也非常简单。加载“class”库后，读取训练数据和评分数据，使用 K-NN 函数，至此我们就完成了任务：可以查看结果了。如图
    1-2 所示。请注意，以“#”开头的行是注释。


    ![](img/494428_2_En_1_Fig2_HTML.jpg)


    一个包含 10 行代码的 R 语言 K-NN 程序截图。它包括导入 class 库、读取训练数据和评分数据、结合评分数据集进行预测，以及查看预测结果。


    图 1-2

    R 语言中的 K-NN


    你从前面的任务中获得的知识足以让你能够应用数据挖掘方法 K-NN。但如果你想逐步理解 K-NN 为何以及如何工作，你将需要更多信息。Excel 可以让你有机会在数据集上逐步进行分析过程，在此过程中你可以对
    K-NN 算法建立扎实的理解。有了这种扎实的理解，你就能更熟练地使用其他强大的工具或编程语言。最重要的是，你将更好地理解数据挖掘结果的质量和价值。你将在后续章节中看到这一点。


    当然，与 Python、R 和 RapidMiner 相比，Excel 在数据挖掘方面的局限性要大得多。Excel 只能处理较小规模的数据。同时，有些数据挖掘技术过于复杂，无法通过
    Excel 实践。尽管如此，Excel 为我们提供了对数据挖掘机制直接且直观的理解。此外，Excel 天然适合数据准备。


    如今，由于软件工具和其他程序包的存在，数据挖掘任务中的大部分精力都花在理解任务（包括业务理解和数据理解）、准备数据和呈现结果上。只有不到 10%的精力花在建模过程上。为建模准备数据的过程称为数据工程。当数据集不是太大时，Excel
    在数据工程方面具有优势，因为它能提供数据工程的可视化表示，这让我们在数据准备过程中更有信心。


    作为一名经验丰富的教育工作者，我意识到如果通过 Excel 中的逐步指导来解释数据挖掘方法，学生可以更好地深入理解这些方法。通过 Excel 学习能揭开数据挖掘或机器学习方法背后的神秘面纱，让学生更自信地应用这些方法。


    我刚才提到机器学习了吗？是的，我提到了。机器学习是当今另一个流行词。什么是机器学习？数据挖掘和机器学习有什么区别？此外，什么是人工智能（AI），AI 和机器学习又有什么区别？


    机器学习和数据挖掘的目的有所不同。机器学习的目的是研究计算机如何通过从数据中学习来发展类似人类的学习能力。数据挖掘的目的是从数据中发现有价值的模式或知识。然而，数据挖掘利用机器学习方法来实现其目标，也就是说，数据挖掘和机器学习的方法论可以是相同的。无论如何，没有必要区分它们，我建议我们目前将它们视为相同。


    同样的情形也适用于 AI 和机器学习。简单来说，AI 是模拟人脑功能的计算机软件，而机器学习是通过数据训练计算机算法来模拟人类思维能力。由于大多数 AI 利用机器学习来实现其目标，机器学习通常被认为是
    AI 的一个子集，因此几乎不可能区分 AI 和机器学习。

    '
- fmt: '# Why the Second Edition?


    Practice is the key in learning, especially in learning technologies including
    Excel and data mining. Thus, the first reason for the second edition is to provide
    homework-like exercise(s) at the end of each chapter so that you can practice
    on your own the core skills explained in each chapter. Starting from this first
    chapter, you will find reinforcement exercises which may even be more challenging
    than whatever was explained step by step in the book. Of course standard answers
    or suggestions are provided to these exercises.


    The second reason is that some chapters are updated based on feedbacks from some
    readers.


    1. Chapter [3](#494428_2_En_3_Chapter.xhtml), K-Means Clustering: By introducing
    the function `SHEET`, the k-means clustering process is updated so that the process
    is even more automatic.

    2. Chapter [6](#494428_2_En_6_Chapter.xhtml), Logistic Regression: As loss function
    is frequently used in machine learning, the concept and use of loss function is
    introduced in this chapter.

    3. Chapter [9](#494428_2_En_9_Chapter.xhtml), Naive Bayes Classification: The
    Naïve Bayes’ theorem is now explained in detail such that the theorem is deduced
    from the conditional probability. This gives readers a clear mathematical understanding
    about why and how the Naïve Bayes classification works.

    4. Chapter [14](#494428_2_En_14_Chapter.xhtml), Text Mining: Because of the arrival
    of ChatGPT, I consider it is necessary to give a simple and quick introduction
    about the word vectorization (also called text embedding) technology which is
    widely used in large language models including ChatGPT.


    The third reason is that some minor errors are fixed and some formulas are updated.
    For example, the function `IFERROR` is used more often to simplify a few formulas.


    The last reason, probably the primary reason for the second edition, is that there
    are two new chapters.


    1. One chapter is about exploratory data analysis (EDA), data cleaning, and feature
    selection. These critical concepts and skills are a must for studying data mining
    or machine learning. They are usually introduced before any data mining or machine
    learning models are explained. Though I take this opportunity to include them
    in this edition, I introduce them in Chapter [11](#494428_2_En_11_Chapter.xhtml)
    after several machine learning models. The reason is explained in Chapter [11](#494428_2_En_11_Chapter.xhtml).
    So, you will figure out why when you read Chapter [11](#494428_2_En_11_Chapter.xhtml).

    2. Another new chapter (Chapter [8](#494428_2_En_8_Chapter.xhtml)) is about hierarchical
    clustering which was once mentioned together with k-means clustering in the first
    edition of this book. This chapter presents two bright highlights. One is to implement
    a bottom-up hierarchical clustering algorithm in Excel; the second is to show
    how to draw a dendrogram in Excel without any add-in.


    ## Prepare Some Excel Skills


    There are quite some Excel skills to learn in this book. I will explain some of
    them in detail when we need to use them. However, there are several fundamental
    Excel skills and functions that we need to be familiar with before we start talking
    about data mining.


    ### Formula


    Formula is the most important feature of Excel. Writing a formula is like writing
    a programming statement. In Excel, a formula always starts with an equal sign
    (`=` without quotation marks).


    Upon opening an Excel file, we are greeted with a table-like worksheet. Yes, every
    worksheet is a huge table. One reason why Excel is naturally suitable for data
    storage, analysis, and mining is because data are automatically arranged in a
    table format in Excel. Each cell in the big table has a name or so-called reference.
    By default, each column is labeled by a letter, while each row is labeled with
    a number. For example, the very first cell at the top-left corner is cell `A1`,
    that is, column A and row 1. The content in a cell, whatever it is, is represented
    by the cell reference.


    Enter number 1 in cell `A1`. The value of cell `A1` is 1 and `A1` represents 1
    at this moment.


    Enter the formula `=A1*10` (without the double quotation marks and no space before
    `=`) in cell `B1` and hit the Enter key. Note that the formula starts with `=`.
    Be aware that this is the only time a formula is presented inside a pair of double
    quotation marks in this book. From now on, all formulas are presented directly
    without quotation marks.


    Enter the text `A1 * 10` in cell `C1`. Because the text does not start with `=`,
    it is not a formula.


    Our worksheet looks like Figure [1-3](#494428_2_En_1_Chapter.xhtml#Fig3).


    ![](images/494428_2_En_1_Chapter/494428_2_En_1_Fig3_HTML.jpg)


    An Excel screenshot with columns A to D and rows 1 to 3. The cells with data are
    A1 1, B1 10, and C1 A1 asterisk 10.


    Figure 1-3


    Excel formula


    ### Autofill or Copy


    Autofill is another critical feature of Excel which makes Excel capable of working
    with a relatively large dataset. Autofill is also called “copy” by many people.


    Let’s learn autofill by the following experiment:


    ![](images/494428_2_En_1_Chapter/494428_2_En_1_Fig4_HTML.jpg)


    An Excel screenshot with columns A to D and rows 1 to 3. The cells with data are
    A1 1, B1 10, and C1 A1 asterisk 10. Cells A1 and A2 are selected.


    Figure 1-4


    Cursor becomes a black cross


    1. Enter 1 in cell `A1`.

    2. Enter 2 in cell `A2`.

    3. Select both cells `A1` and `A2`.

    4. Release the left mouse button.

    5. Move the mouse cursor to the lower right corner of cell `A2` until the cursor
    becomes a black cross (shown in Figure [1-4](#494428_2_En_1_Chapter.xhtml#Fig4)).

    6. Press down the left mouse button and drag down to cell `A6`.


    The cells `A1:A6` are automatically filled with numbers 1, 2, 3, 4, 5, and 6.
    This process is called autofill. Some people call it “copy”, too. But more precisely,
    this process is autofill.


    Let’s conduct another experiment:


    ![](images/494428_2_En_1_Chapter/494428_2_En_1_Fig5_HTML.jpg)


    An Excel screenshot. Cells A1 to A6 have numbers 1 to 6. Cells B1 to B6 have numbers
    10, 20, 30, 40, 50, and 60. C1 has A1 asterisk 10. Cell B2 is selected. The data
    in the formula bar is equal to A2 asterisk 10, which is highlighted.


    Figure 1-5


    Autofill formula (relative reference)


    1. Select cell `B1` (make sure that `B1` still has the formula `=A1*10`). Lift
    up the left mouse button.

    2. Move the mouse cursor to the lower right corner of cell `B1` until the cursor
    becomes a black cross.

    3. Drag down the mouse cursor to cell `B6`. Our worksheet looks like Figure [1-5](#494428_2_En_1_Chapter.xhtml#Fig5).


    Note that in Figure [1-5](#494428_2_En_1_Chapter.xhtml#Fig5), the formula in cell
    `B1` is `=A1*10`, but the formula in cell `B2` is automatically changed to `=A2*10`.
    When we autofill vertically down, Excel automatically increments the row index
    of all the cell references by 1 in a formula. Similarly, when we autofill horizontally
    to the right, Excel automatically increments the column index of all the cell
    references in a formula.


    Click on cell `B3`; the formula inside must be `=A3*10`.


    **Note**


    Changing the number in `A1` to 10 automatically changes the number in `B1` to
    100. By default, the whole Excel workbook will automatically recalculate if a
    cell value is changed. This is another important feature of Excel.'
