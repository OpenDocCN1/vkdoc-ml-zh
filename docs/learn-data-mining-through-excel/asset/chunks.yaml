  trans: '

    一旦我们在工作表 crx3 中获得了目标的唯一值，就可以轻松获取目标的类别分布。在 crx3 工作表中，在 R2 单元格内输入公式 `=COUNTIFS(crx!P2:P691,
    P2)`，然后自动填充至 R3。我们可以立即看出，“+”和“-”这两个类别分别有 307 个和 383 个数据点。


    一个平衡良好的数据集应该具有均衡的类别，也就是说，所有类别的数据点数量应大致相同。在这个具体案例中，两个类别分别占比约 44.5% 和 54.5%，这可以被认为是相当平衡的。


    如果数据集存在类别不平衡怎么办？如果发生这种情况，你应该尽力增加代表性不足的类别的数据点。如果数据量足够大，你也可以减少代表性过高的类别的数据点。在最坏的情况下，如果你完全无法改变这种不平衡，那么你应该确保你的机器学习模型对代表性不足的类别足够敏感。


    8.  如果存在缺失数据：


    缺失值可以以不同形式存在，例如空格或问号“?”。前面删除重复项的操作有助于我们识别出属于缺失值的异常分类值。对于空格，我们可以利用 `COUNTBLANK`
    函数来统计它们。


    回到工作表 crx，在 A693 单元格内输入 `=COUNTBLANK(A2:A691)`，然后自动填充至 P693。幸运的是，我们的数据集中没有任何空格。


    要统计每个属性中由“?”标记的缺失值数量，请在 A694 单元格内输入 `=COUNTIFS(A2:A691, "~?")`，然后自动填充至 P694。请注意，问号“?”在
    Excel 中是一个特殊字符。因此，要在此公式中插入字面意义上的“?”，我们必须在其前面加上“~”。


    完整结果见 Chapter11-1b.xlsx。请注意，“Variance”、“Blank Cells”和“Missing Data”这些词分别位于单元格
    Q692、Q693 和 Q694 中。这些词是为了说明。


    9.  数据异常：


    数据异常与离群值不同。离群值是有效的，但其值超出了正常范围。是否应该保留或删除离群数据记录是一个难以抉择的问题。


    数据异常指的是意外数据或数据不一致，可能是非预期的数据类型或超出范围的数据值。一般来说，在收集数据时，我们应该了解每个属性的预期数据类型和范围；否则，我们将没有标准来识别非预期的数据值。对于数值数据，我们可以使用
    IF 函数来识别任何超出预期范围的数值。对于非预期的数据类型，有其他函数可以处理。


    为了练习数据异常检测，请打开 Chapter11-2a.xlsx，我特意在其中创建了一些数据异常。假设我们知道每个属性的预期数据类型和范围。具体来说，数值属性的值必须
    >= 0。


    同样，我们将复制现有的工作表 crx，并将新工作表重命名为 crx2。


    在工作表 crx2 中，在 A2 单元格内输入 `=IF(ISNONTEXT(crx!A2), "N", "")`。由于我们知道属性 A1 的数据类型必须是字母，因此使用
    `ISNONTEXT` 函数来判断工作表 crx 中对应的值是否为非文本。如果是，则显示“N”；否则，A2 单元格中不显示任何内容。双击 A2 单元格的右下角，从
    A2 自动填充至 A691。


    对于属性 A2 和 A3，我们知道它们必须是数值且不能小于 0。因此，在 B2 单元格内输入 `=IF(ISTEXT(crx!B2), "T", IF(crx!B2<0,
    "F", ""))`，并自动填充至 C2，然后一起自动填充至 B691:C691。我们会立即注意到 C6 单元格中的“F”和 C8 单元格中的“T”，因为如果
    crx!B2 包含文本，此公式返回“T”；如果 crx!B2 < 0，则返回“F”；否则在 B2 中不显示任何内容。


    在 D2 单元格内输入 `=IF(ISNONTEXT(crx!D2), "N", "")`，并自动填充至 D691；我们还会发现 D15 单元格中显示“N”。


    我希望你已经意识到复制原始工作表的好处。当然，当工作表 crx2 中的 C6、C8 和 D15 单元格分别出现“F”、“T”或“N”时，我们立即就能知道原始工作表
    crx 中完全相同的位置（C6、C8 和 D15）存在数据异常。


    此时，我们工作表 crx2 的一部分应该如图 11-6 所示。


    ![](img/494428_2_En_11_Fig6_HTML.jpg)


    一个 Excel 电子表格在 C6、C8 和 D15 单元格中显示了意外数据。


    图 11-6


    单元格 C6、C8 和 D15 显示了意外的数据值


    工作表中还有更多意外数据。我想留给你来完成其余属性的检查。请注意，你当然可以使用不同的 Excel 函数来实现相同的目的。


    完成后的结果见 Chapter11-2b.xlsx。由于上述异常检测过程相当繁琐，还有另一个文件 Chapter11-2c.xlsx，其中所有属性只需要一个公式。请查看一下。

