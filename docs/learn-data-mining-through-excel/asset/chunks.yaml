    你可能已经意识到，通过 Excel 完成层次聚类和树状图容易出错，因为需要手动操作。当数据点数量增加时尤其如此。正如我之前提到的，减少错误的一种方法是通过复制工作工作表来保持中间步骤的完整性，类似于我们在
