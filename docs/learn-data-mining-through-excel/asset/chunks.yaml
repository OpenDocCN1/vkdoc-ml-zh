  trans: "\n一张 Excel 截图展示了晴天（Sunny）的熵和信息增益值。列标题包括：是、否、p 乘以 log(p) 减去是、p 乘以 log(p)\
    \ 减去否、加权、熵和信息增益。\n\n图 10-15\n\n为晴天(2,3)计算的所有熵和信息增益值\n\n从工作表 level-2-sunny 显示的结果中，我们注意到树节点晴天(2,3)应根据湿度（Humidity）进行分支。由于生成的两个子节点熵均为零，它们都是叶节点。因此，无需再对树进行拆分。结果如图\
