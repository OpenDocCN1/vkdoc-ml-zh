    Chapter3-HW.xlsx 文件为你提供了一个练习机会。在此练习中，你需要遍历 15 个工作表才能达到收敛。如果你觉得练习有困难，请参考 Chapter3-HW-withAnswers.xlsx
    文件。


    Chapter3-HW-withAnswers-NameManager.xlsx 文件利用了名称管理器（Excel 内置功能）来简化公式。


    到目前为止，我们使用 SHEET 函数来帮助自动化 k-means 聚类过程。使用 SHEET 函数的一个关键要求是按顺序放置所有工作表。如果我们不想按顺序放置所有工作表，可以使用
    CELL 函数代替 SHEET。Chapter3-HW-withAnswers-Cell-Function.xlsx 文件展示了这种解决方案。欢迎自行探索。


    Excel 有一些配置公式计算的选项。默认情况下，“启用迭代计算”选项是禁用的。如果我们在 Excel 中启用迭代计算，那么只需两个工作表即可完成 k-means
    聚类过程，因为第二个工作表可以执行类似循环的过程来达到收敛！由于本书篇幅有限，我不会解释如何实现这一点。但请注意，基于上述逐工作表过程获得的聚类结果可能与通过这种迭代计算获得的结果不同，尽管两种结果都是正确的，这表明可能存在不止一个最优聚类解。


    ## 复习要点


    对于第 3 章，以下知识、技能和函数值得复习：


    1.  质心、欧几里得距离

    2.  通过工作表名称后跟感叹号“!”来引用工作表

    3.  INDEX、IF、SQRT、SUMXMY2 和 MATCH 函数

    4.  IFERROR、SHEET、INDIRECT、ADDRESS 和 AVERAGEIFS 函数

    5.  运算符 &

    6.  复制工作表以开始新的迭代

    7.  聚类过程


    # 4. 线性判别分析


    请从 [`https://github.com/hhohho/Learn-Data-Mining-through-Excel-2`](https://github.com/hhohho/Learn-Data-Mining-through-Excel-2)
    下载本章练习所需的示例 Excel 文件。


    ## 总体理解


    线性判别分析（LDA）与线性回归和 k-means 聚类相似，但也与两者不同。K-means 聚类是一种无监督分类方法；而 LDA 是有监督的，因为其分类是基于已知数据进行训练的。然而，线性回归的预测结果是定量数值型的，而
    LDA 的预测结果是定性类别型的。


    LDA 试图找到最佳的线性函数，该函数可以将数据点分离到不同的类别或组中。组均值之间的方差应尽可能大，而每组内部的方差应尽可能小。请注意，方差是在每个数据点投影到线性函数
    `P = w`[`1`]`x`[`1`] `+ w`[`2`]`x`[`2`] `+ ... + w`[`n`]`x`[`n`] `+ b` 之后计算的。训练数据集用于找到最佳的
    `P` 函数，该函数由参数集 (`w`[`1`]`,w`[`2`]`...,w`[`n`]`,b`) 表示。图 4-1 在二维空间中演示了这一概念。


    ![](img/494428_2_En_4_Fig1_HTML.png)


    一幅插图展示了最佳投影轴（线 P）和较差的投影轴（线 A）。


    图 4-1


    LDA 用于分离组


    给定一组已按不同组分类的训练数据点集 S，应用 LDA 的三个步骤可简化如下：


    步骤 1：通过以下表达式求和组间方差：


    ![$$ Sg=\kern0.5em \sum \limits_i^k{s}_g=\sum \limits_{i=1}^k{\left({\overline{x}}_i-\overline{x}\right)}²
    $$](img/494428_2_En_4_Chapter_TeX_Equ1.png)


    (4-1)


    其中 k 是组的数量，![$$ \overline{x} $$](img/494428_2_En_4_Chapter_TeX_IEq1.png) 是各组均值的均值，![$$
    {\overline{x}}_i $$](img/494428_2_En_4_Chapter_TeX_IEq2.png) 是单个组的均值。


    步骤 2：通过以下表达式求和组内方差：


    ![$$ {S}_w=\sum \limits_i^k\sum \limits_{\dot{j}}^n{\left({x}_{ij}-{\overline{x}}_i\right)}²
    $$](img/494428_2_En_4_Chapter_TeX_Equ2.png)


    (4-2)


    其中 n 是一个组中的数据点数量。


    步骤 3：`P` 是最佳投影线性函数，使得 Sg(P)/Sw(P) 最大化。由于 `P` 由 (`w`[`1`]`,w`[`2`]`,...,w`[`n`]`,b`)
    定义，LDA 的模型构建阶段就是求解 (`w`[`1`]`,w`[`2`]`,...,w`[`n`]`,b`)。这在公式 (4-3) 中解释：


    ![$$ {\mathrm{w}}_1{\mathrm{x}}_1+{\mathrm{w}}_2{\mathrm{x}}_2+\dots +{\mathrm{w}}_{\mathrm{n}}{\mathrm{x}}_{\mathrm{n}}+\mathrm{b}=\max
    \left( Sg\left(\mathrm{P}\right)/ Sw\left(\mathrm{P}\right)\right) $$](img/494428_2_En_4_Chapter_TeX_Equ3.png)


    (4-3)


    可以首先应用最小二乘法来求解 (`w`[`1`]`,w`[`2`]`,...,w`[`n`]`,b`)。然后，我们可以使用 Excel 规划求解进一步优化
    (`w`[`1`]`,w`[`2`]`,...,w`[`n`]`,b`)。

