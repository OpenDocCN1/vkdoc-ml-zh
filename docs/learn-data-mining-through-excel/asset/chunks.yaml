    \ into `P(x[a]|y[1])` and `P(x[a]|y[2])`! Thinking about this in data mining.\
    \ Given the training dataset where `y` is known, we can easily compute `P(x[a]|y[1])`,\
    \ `P(x[a]|y[2])`, `P(y[1])`, and `P(y[2])`. Now for the scoring dataset where\
    \ `y` is unknown but `x` is given. If `x` is `x[a]`, we can then make use of Equation\
    \ (9-6) to predict the occurrence probability of `y[1]` under the condition of\
    \ `x[a]`.\n\nEquation (9-6) assumes that there is only one independent attribute\
    \ `x`. In most cases, there are a number of independent attributes (`x[1]`, `x[2]`,\
    \ ..., `x[n]`) to classify `y` and `y` can have more than two classes. Assume\
    \ that `y` has `m` distinct classes and given the condition (`x[1]`, `x[2]`, ...,\
    \ `x[n]`), let\n\n```\nP'(y_k|x) = P(x_1|y_k) * P(x_2|y_k) * ... * P(x_n|y_k)\
    \ * P(y_k)\n```\n\n(9-7)\n\nFollowing what we have gone through earlier, it is\
    \ not difficult to deduce that the final `P(y[k]|x)`, the probability of the kth\
    \ `y` class under the condition of (`x[1]`, `x[2]`, ..., `x[n]`), can be computed\
    \ as\n\n```\nP(y_k|x) = P'(y_k|x) / Σ_i^m P'(y_i|x)\n```\n\n(9-8)\n\nCertainly,\
    \ `Σ_i^m P(y_i|x) = 1`.\n\nWe are going to implement the preceding concepts using\
    \ the example presented in Table 9-1.\n\nData in Table 9-1 simulate an image analysis\
    \ case in which the occurrence of a certain cancer is determined based on features\
    \ (attributes) of the images taken. Note, data in the table are faked and do not\
    \ represent a valid image or cancer analysis method.\n\n**Table 9-1** A faked\
    \ sample data for Naive Bayes analysis\n\n| No. | Size | Number | Thickness |\
    \ Lung Cancer |\n| --- | --- | --- | --- | --- |\n| 1 | Big | Low | Deep | Yes\
    \ |\n| 2 | Big | Over | Deep | Yes |\n| 3 | Normal | Over | Shallow | No |\n|\
    \ 4 | Big | Low | Shallow | No |\n| 5 | Big | Over | Deep | Yes |\n| 6 | Normal\
    \ | Over | Deep | Yes |\n| 7 | Big | Low | Shallow | No |\n| 8 | Big | Over |\
    \ Shallow | Yes |\n| 9 | Big | Over | Deep | Yes |\n| 10 | Normal | Low | Deep\
    \ | No |\n| Scoring | Big | Over | Deep | ??? |\n\nThere are three attributes:\
    \ Size, Number, and Thickness (think them as `x[1]`, `x[2]`, and `x[3]`). Each\
    \ attribute has two distinct values. The target variable is Lung Cancer, which\
    \ has two distinct classes: Yes and No. In Table 9-1, there are ten training data\
    \ records, and the last record is the scoring record for which we need to predict\
    \ the class based on the three attribute values.\n\nBased on Equations (9-7) and\
    \ (9-8), the probability of being “yes” for the scoring record is computed by\
    \ the following equation:\n\n```\nP(yes|<big, over, deep>) = \n(p(big|yes) * p(over|yes)\
    \ * p(deep|yes) * p(yes)) / \n(p(big|yes) * p(over|yes) * p(deep|yes) * p(yes)\
    \ + p(big|no) * p(over|no) * p(deep|no) * p(no))\n```\n\nCertainly, we need to\
    \ compute the following items:\n\n1.  `p(yes) = 6/10`, as there are 6 “yes” out\
    \ of 10 records.\n2.  `p(no) = 4/10`, as there are 4 “no” out of 10 records.\n\
    3.  `p(big|yes) = 5/6`. When the class is “yes”, correspondingly there are 5 “big”.\n\
    4.  `p(over|yes) = 5/6`. When the class is “yes”, correspondingly there are 5\
