    ## Reinforcement Exercises


    The file Chapter3-HW.xlsx provides an exercise opportunity for you. In this exercise,
    you need go over 15 worksheets to reach convergence. Should you find the exercise
    difficult, please refer to Chapter3-HW-withAnswers.xlsx.


    The file Chapter3-HW-withAnswers-NameManager.xlsx makes use of Name Manager, an
    Excel built-in feature, to make the formulas simpler.


    So far we employ the SHEET function to help automate the k-means clustering process.
    One critical requirement of the use of SHEET function is to place all worksheets
    in order. If we do not want to place all the worksheets in order, we can make
    use of the function CELL instead of SHEET. The file Chapter3-HW-withAnswers-Cell-Function.xlsx
    shows such a solution. Feel free to explore it.


    Excel has some options to configure formula calculations. By default, the “Enable
    iterative calculation” option is disabled. If we enable iterative calculation
    in Excel, we can then complete the k-means clustering process in only two worksheets
    because the second worksheet can perform a loop-like procedure to reach convergence!
    Due to the space limit of this book, I won’t explain how to achieve it. But please
    be advised that the clustering result obtained based on the preceding worksheet-by-worksheet
    procedure may be different from what can be acquired through this iterative calculation,
    though both results are correct, which indicates that there can be more than one
    optimal clustering solution.


