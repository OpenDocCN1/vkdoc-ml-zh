    ![](images/494428_2_En_1_Chapter/494428_2_En_1_Fig11_HTML.jpg)\n\nAn Excel screenshot.\
    \ Name, season, sales, and commissions are the data in cells A 1, B 1, C 1, and\
    \ D 1\\. Columns A, B, and C contain data.\n\nFigure 1-11\n\nThe performances\
    \ of some sales representatives\n\nOur first task is to compute the commissions\
    \ for each sales representative. The commission is calculated in this way:\n\n\
    1.  Any sale amount lower or equal to $50000 has no commission.\n\n2.  The sale\
    \ amount more than $50000 but less than or equal to $100000 gains 10% commission.\n\
    \n3.  The sale amount more than $100000 gains 20% commission.\n\nOur formula to\
    \ compute the commissions is based on the IF function. Enter the following formula\
    \ in cell D2:\n\n```\n=IF(C2<=50000,0,IF(C2<=100000,(C2-50000)*10%,50000*0.1+(C2-100000)*20%))\n\
    ```\n\nIF function has the basic form: IF(boolean-expression, true-value, false-value).\
    \ In our formula, if the sales in C2 are no more than 50000, 0 is returned. However,\
    \ when C2 is more than 50000, a nested IF function is used here as we have two\
    \ more conditions to assess.\n\nIn the inner IF function, if `C2<=100000`, the\
    \ amount more than 50000 is multiplied by 0.1 (10%) and returned. Otherwise, C2\
    \ must be more than 100000, and therefore the calculated result of the expression\
    \ `50000*0.1+(C2-100000)*20%)` is returned.\n\nOur worksheet looks exactly like\
    \ Figure [1-12](#494428_2_En_1_Chapter.xhtml#Fig12).\n\n![](images/494428_2_En_1_Chapter/494428_2_En_1_Fig12_HTML.jpg)\n\
    \nAn Excel screenshot. The data in A 1, B 1, C 1, and D 1 correspond to name,\
    \ season, sales, and commissions. All the cells contain data in it.\n\nFigure\
    \ 1-12\n\nCommissions calculated by using the IF function\n\nWhat if we want to\
    \ count how many sales representatives have sales between 50000 and 100000 in\
    \ season 1? To answer this question, we need to apply the function COUNTIFS. In\
    \ Excel, there is another function named COUNTIF. COUNTIFS is capable of every\
    \ task that COUNTIF is capable of, and there are many tasks for which we must\
    \ use COUNTIFS instead of COUNTIF.\n\nThe explanation of COUNTIFS from Microsoft\
    \ Office Support states “The COUNTIFS function applies criteria to cells across\
    \ multiple ranges and counts the number of times all criteria are met.” Its syntax\
    \ is like COUNTIFS(criteria_range1, criteria_1, criteria_range2, criteria_2, …).\
    \ Based on this understanding, enter the following formula in cell E1:\n\n```\n\
    =COUNTIFS(B2:B10,1,C2:C10,\">50000\",C2:C10,\"<=100000\")\n```\n\nThis formula\
    \ makes sure that\n\n*   In cell range B2:B10, the season is 1.\n\n*   And in\
    \ cell range C2:C10, the sales are >50000\\. Note the criteria is placed inside\
