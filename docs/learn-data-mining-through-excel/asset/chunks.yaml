    \ I 列以及第 1 到 15 行。F 到 I 列的列标题为：温度、湿度、有风和天气。单元格 I2 的数据为 rainy，并已高亮显示。\n\n图 10-20\n\
    \n工作表 level-2-rainy 概览\n\n1.  要拆分节点 sunny(2, 3)，请复制工作表 level-2-rainy，并将新工作表重命名为\
