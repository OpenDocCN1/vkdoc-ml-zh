  trans: "\n## 通过 Excel 学习关联分析\n\n让我们打开 Chapter12-1a.xlsx 文件，其中包含 371 张收据（交易）的 1831\
    \ 条记录。这 1831 条记录是从一个更大的在线零售数据集中筛选并预处理得到的，该数据集由 UCI 机器学习库提供，网址为 [`https://doi.org/10.24432/C5BW33`](https://doi.org/10.24432/C5BW33)。部分数据如图\
    \ 12-1 所示。\n\n![](img/494428_2_En_12_Fig1_HTML.jpg)\n\n一张电子表格截图，显示了收据编号、数量和商品代码的详细信息。共有\
    \ 11 行，分别表示收据编号 1、2、3 和 4 的详细信息。\n\n图 12-1\n\n购物篮数据\n\nChapter12-1a.xlsx 中的数据已按收据编号排序。A\
    \ 列显示收据编号，C 列显示收据上的商品，共有 50 种不同的商品，编号从 I1 到 I50，B 列列出了每张收据上每种商品的购买数量。例如，第 2 至\
    \ 6 行显示收据 1 上有商品 I28、I46、I47、I48 和 I50。在本研究中，我们忽略购买数量。\n\n对于关联分析，必须将 Chapter12-1a.xlsx\
    \ 中的数据重新组织成表 12-1 的形式。请按照以下说明组织 Chapter12-1a.xlsx 中的数据：\n\n![](img/494428_2_En_12_Fig2_HTML.jpg)\n\
    \n一张电子表格截图，显示了收据编号、数量和商品代码的详细信息。A 列表示收据编号 1 到 7，而 D 列表示收据数量为 15。\n\n图 12-2\n\n\
    组织数据\n\n1.  在单元格 D1 中输入“收据编号”。\n\n2.  由于共有 371 张收据，编号从 1 到 371，因此在单元格 D2 中输入 1，在单元格\
    \ D3 中输入 2。选中单元格 D2 和 D3，然后向下自动填充至单元格 D372。\n\n3.  在单元格 E1 中输入“I1”，然后从单元格 E1 水平自动填充至单元格\
    \ BB1。单元格 E1:BB1 包含商品编号 I1、I2、……、I50。工作表的部分内容如图 12-2 所示。\n\n![](img/494428_2_En_12_Fig4_HTML.jpg)\n\
    \n一张电子表格，显示了 BB 列下 I50 的值列表、BE 列下 I1 到 I16 的出现次数，以及 BF 到 BO 列之间 I1 到 I10 的值。\n\
    \n图 12-4\n\n设置关联表\n\n1.  如果某商品出现在某张收据上，则其对应单元格的值应为数值 1。例如，由于商品 I8 在收据 #6 上，单元格\
    \ L7 的值应为 1。同理，由于 I28 在收据 #1 上，单元格 AF2 的值也应为 1。单元格 E2、F2 和 G2 内部的值应为 0，因为商品 I1、I2\
    \ 和 I3 不在收据 #1 上。我们需要一个公式，如果商品在收据上，则在该商品下方分配 1；否则，分配 0。在单元格 E2 中输入以下公式：\n\n```\n\
    \    =COUNTIFS($A$2:$A$1832,$D2,$C$2:$C$1832,E$1)\n    ```\n\n在此公式中，`“$A$2:$A$1832,$D2”`\
    \ 返回 A2:A6，因为 $D2 匹配 1。但是，A2:A6 内的任何单元格在 C 列中都没有等于 E$1 (I1) 的值。因此，此公式在单元格 E2 中返回\
    \ 0。\n\n2.  将公式从 E2 自动填充到单元格 BB2，然后一起自动填充到单元格 E372:BB372。部分数据如图 12-3 所示。\n\n![](img/494428_2_En_12_Fig3_HTML.jpg)\n\
    \n一张电子表格截图，显示了商品代码和收据编号的详细信息，以及 I1、I2、I3、I4、I5、I6、I7、I8、I9 和 I10 的值。表格中共有 21 行。\n\
    \n图 12-3\n\n创建用于关联分析的数据表\n\n在本例中，我们将检查所有大小为 2 的项集；因此，我们需要设置一个表格，使得表格的行和列都用每个商品标记。之后，我们还需要计算每个项集的置信度和支持度值。为此，我们需要计算\
    \ (1) 两个商品在同一张收据上共同出现的次数，以及 (2) 某个商品出现的收据数量。\n"
- fmt: "3. 在单元格`BF1`中输入文本“I1”，然后自动填充至单元格`DC1`。\n\n4. 在`BE2`中输入文本“Occurrences”，在单元格`BF2`中输入公式`=COUNTIFS(E2:E372,1)`，并从`BF2`自动填充至`DC2`。单元格区域`BF2:DC2`引用“某个商品出现的收据数量”。例如，商品`I1`出现在20张收据上（如图[12-4](#494428_2_En_12_Chapter.xhtml#Fig4)所示）。\n\
    \n5. 在单元格`BD3`中输入`1`，在`BD4`中输入`2`。选中`BD3`和`BD4`两个单元格，将其自动填充至单元格`BD52`。此操作将在单元格`BD3`、`BD4`、`BD5`、…、`BD52`中填入数字`1,\
    \ 2, 3, …, 50`。这些数字将用于引用数据表`E2:BB372`中的列，因为`E2:BB372`中有50列，每列对应一个商品。\n\n6. 在单元格`BE3`中输入“I1”，并从`BE3`自动填充至`BE52`。\n\
    \n将我们的工作表与图[12-4](#494428_2_En_12_Chapter.xhtml#Fig4)进行比较。如果工作表看起来与图[12-4](#494428_2_En_12_Chapter.xhtml#Fig4)不同，我们需要：(1)\
    \ 检查公式，(2) 确保商品名称中没有多余的空格。例如，在单元格`E1`或`BF1`中，如果商品名称输入为“I1 ”，那么对`I1`的计算将不正确。\n\n\
    ![](images/494428_2_En_12_Chapter/494428_2_En_12_Fig5_HTML.jpg)\n\n一个电子表格，展示了BE列下从I1到I13的出现次数，以及BF到BM列之间I1到I8的值列表。数据描述了商品同时出现在一张收据上的次数。\n\
    \n图12-5\n计算出的两个商品的共现次数\n\n1. 让我们计算两个商品在同一张收据上共同出现的次数。在单元格`BF3`中输入以下公式：\n\n```\n\
    =COUNTIFS(INDEX($E$2:$BB$372,0,$BD3),1,E$2:E$372,1)\n```\n\n`BD3 = 1`，因此函数`INDEX($E$2:$BB$372,0,$BD3)`从表`E2:BB372`中获取第一列，即商品`I1`的列，也就是`E2:E372`。因此，单元格`BF3`中的上述公式变为`=COUNTIFS(E2:E372,1,E$2:E$372,1)`。此公式计算同时满足两个条件的行数：`E2:E372`中的单元格值为`1`，且`E$2:E$372`中的单元格值也为`1`。\n\
    \n在这个特定公式中，两个条件恰好相同，因为单元格`BF3`对应的是项集(I1, I1)。这可能会让人困惑。我们继续，稍后会进一步解释。\n\n2. 从单元格`BF3`自动填充至`DC3`，然后一起自动填充至`BF52:DC52`。我们来看一下单元格`BG3`中的公式：\n\
    \n```\n=COUNTIFS(INDEX($E$2:$BB$372,0,$BD3), 1,F$2:F$372,1)\n```\n\n`INDEX($E$2:$BB$372,0,$BD3)`仍然会给出商品`I1`对应的`E2:E372`。然而，`F$2:F$372`对应的是商品`I2`。因此，此公式现在计算的是商品`I1`和商品`I2`在同一张收据上共同出现的次数。\n\
    \n另一个例子是单元格`BJ4`中的公式：\n\n```\n=COUNTIFS(INDEX($E$2:$BB$372,0,$BD4), 1,I$2:I$372,1)\n\
    ```\n\n由于`BD4 = 2`，此公式实际上等同于：\n\n```\n=COUNTIFS(F$2:F$372,1,I$2:I$372,1)\n```\n\
    \n显然，单元格`BJ4`计算的是商品`I2`和商品`I5`在同一张收据上共同出现的次数。\n\n现在，让我们将工作表与图[12-5](#494428_2_En_12_Chapter.xhtml#Fig5)进行比较。\n\
    \n![](images/494428_2_En_12_Chapter/494428_2_En_12_Fig7_HTML.jpg)\n\n一个电子表格，展示了DF列下的支持度值0.03和置信度值0.5。DG列纵向排列了I1到I13。DH到DM列分别横向排列了I1到I6。单元格DK11和DM11显示值为0.035,\
    \ 0.500。\n\n图12-7\n大小为2的项集的关联分析\n\n1. 我们需要构建另一个表格，以显示基于最小支持度值和最小置信度值哪些项集是有效的。\n\
    \    *   在单元格`DF2`中输入文本“Support”，在`DF3`中输入数字`0.03`，在`DF4`中输入文本“Confidence”，在`DF5`中输入数字`0.5`。\n\
    \    *   在`DH1`中输入“I1”，并横向自动填充至`FE1`。\n    *   在`DG3`中输入“I1”，并纵向自动填充至`DG52`。\n\
    \n将我们的表格设置与图[12-6](#494428_2_En_12_Chapter.xhtml#Fig6)进行比较。\n\n![](images/494428_2_En_12_Chapter/494428_2_En_12_Fig6_HTML.jpg)\n\
    \n一个电子表格，展示了DC列下I50的值列表以及DF列下的支持度和置信度值。DG列纵向排列了I1到I13。DH到DN列分别横向排列了I1到I7。\n\n\
    图12-6\n关联分析表格设置\n\n2. 在单元格`DH3`中输入以下公式，从`DH3`自动填充至`FE3`，然后一起从`DH3:FE3`自动填充至`DH52:FE52`：\n\
    \n```\n=IF($DG3=DH$1,\"\",IF(AND(BF$2>0,BF3/371>=$DF$3, BF3/BF$2>=$DF$5),TEXT(BF3/371,\"\
    0.000\") & \", \" &TEXT(BF3/BF$2,\"0.000\"),\"\"))\n```\n\n对于此公式，我们需要理解以下几点：\n\
    \    1.  注意，单元格`DH3`引用的项集是(DH1, DG3)，恰好是(I1, I1)。类似地，单元格`DJ7`引用的项集是(DJ1, DG7)，即项集(I3,\
    \ I5)。\n    2.  如果`DG3`和`DH1`对应的是同一个商品（本例中正是如此），则无需计算支持度或置信度值。\n    3.  `BF$2>0`是为了避免可能的“除以零”错误。\n\
    \    4.  `BF3/371>=$DF$3`是为了确保项集(DH1, DG3)的支持度值不小于最小支持度值。注意，这里我硬编码了收据数量371。更好的方法是使用单元格引用，即将收据数量存储在一个单元格中。在后面的“强化练习”中，你会看到我将收据数量存储在了单元格中。\n\
    \    5.  `BF3/BF$2>=$DF$5`是为了确保项集(DH1, DG3)的置信度值满足最小置信度要求。\n    6.  `AND`函数保证如果任何要求未满足，单元格`DH3`中不显示任何内容。\n\
    \    7.  `TEXT`函数用于格式化结果。\n\n3. 将我们的结果与图[12-7](#494428_2_En_12_Chapter.xhtml#Fig7)进行比较。调整最小支持度值和置信度值，以观察找到的项集的变化。\n\
    \n最终结果可在`Chapter12-1b.xlsx`文件中找到。\n\n在第13步，我们也可以输入一个非常复杂的公式来生成如图[12-7](#494428_2_En_12_Chapter.xhtml#Fig7)所示的关联分析结果。这样做，我们就不需要创建第三个表格。打开`Chapter12-2b.xlsx`文件查看这个复杂的公式。\n\
    \n使用Excel对大小为3或更大的项集进行关联分析变得不切实际，这就是本章在此处停止的原因。请注意，当商品和交易数量很大时，关联分析的计算量可能非常大。\n\
    \n## 强化练习\n\n本章有一个练习供你完成。打开`Chapter12-HW.xlsx`文件；你会看到一些从在线零售数据集中提取并预处理过的数据，该数据集可从UCI机器学习库的[`https://doi.org/10.24432/C5BW33`](https://doi.org/10.24432/C5BW33)下载。查看图[12-8](#494428_2_En_12_Chapter.xhtml#Fig8)，这是数据的截图。\n\
    \n![](images/494428_2_En_12_Chapter/494428_2_En_12_Fig8_HTML.jpg)\n\n一个电子表格，展示了发票号、数量和库存代码下的值列表。共有11行，描述了发票号1、2和3的详细信息。\n\
    \n图12-8\n强化练习的数据\n\n当然，`Chapter12-HW.xlsx`中的数据组织方式与`Chapter12-1a.xlsx`相同，只是数据名称不同。请记住将发票视为收据，将库存代码视为商品代码。文件`Chapter12-HW-withAnswers.xlsx`包含我对这个练习的答案。请注意，在答案工作表中，不同发票的数量存储在单元格`D2`中，而不是硬编码在公式中。\n\
    \n希望你喜欢这个练习。\n\n## 复习要点\n\n1.  关联及其潜在应用\n2.  商品与项集\n3.  最小支持度与最小置信度\n4.  函数`IF`、`AND`、`COUNTIFS`、`INDEX`和`TEXT`以及运算符`&`"
  raw: "3.  In cell BF1, enter the text “I1” and then autofill horizontally to cell\
    \ DC1.\n\n4.  Enter the text “Occurrences” in BE2, enter the formula `=COUNTIFS(E2:E372,1)`\
    \ in cell BF2, and autofill from cell BF2 to cell DC2\\. Cells BF2:DC2 reference\
    \ “the number of receipts that an item appears on”. For example, item I1 appears\
    \ on 20 receipts (shown in Figure [12-4](#494428_2_En_12_Chapter.xhtml#Fig4)).\n\
    \n5.  Enter 1 in cell BD3 and 2 in cell BD4\\. Select both cells BD3 and BD4;\
    \ autofill them to cell BD52\\. This action will fill in numbers 1, 2, 3, …, 50\
    \ into cells BD3, BD4, BD5, …, BD52\\. These numbers will be used to reference\
    \ a column in the data table E2:BB372 as there are 50 columns in E2:BB372, one\
    \ column for one item.\n\n6.  Enter “I1” in cell BE3; autofill from cell BE3 to\
    \ cell BE52.\n\nCompare our worksheet with Figure [12-4](#494428_2_En_12_Chapter.xhtml#Fig4).\
    \ If our worksheet looks different from Figure [12-4](#494428_2_En_12_Chapter.xhtml#Fig4),\
    \ we need to (1) examine our formulas and (2) make sure that there are no empty\
    \ spaces in the item names. For example, in cell E1 or cell BF1, if the item name\
    \ is entered as “I1 ”, then the calculation for I1 won’t be correct.\n\n![](images/494428_2_En_12_Chapter/494428_2_En_12_Fig5_HTML.jpg)\n\
    \nA spreadsheet represents the Occurrences from I 1 to I 13 under column B E and\
    \ a list of values of I 1 to I 8 ranging in the columns between B F and B M. The\
    \ data depict the number of times the items co-appear on a single receipt.\n\n\
    Figure 12-5\n\nThe co-occurrences of two items computed\n\n1.  Let’s calculate\
    \ the number of times two items co-occur in a single receipt. Enter the following\
    \ formula in cell BF3:\n\n```\n    =COUNTIFS(INDEX($E$2:$BB$372,0,$BD3),1,E$2:E$372,1)\n\
    \    ```\n\nBD3 = 1, so the function `INDEX($E$2:$BB$372,0,$BD3)` fetches the\
    \ first column from the table E2:BB372, which is the column for item I1, that\
    \ is, E2:E372\\. Thus, the preceding formula becomes `=COUNTIFS(E2:E372,1,E$2:E$372,1)`\
    \ in cell BF3\\. This formula counts how many rows meeting the two conditions\
    \ at the same time: cells inside `E2:E372` having value 1 and cells inside E$2:E$372\
    \ having value 1, too.\n\nIn this specific formula, it happens that the two conditions\
    \ are the same because cell BF3 is for itemset (I1, I1). This may be confusing.\
    \ Let’s continue; I will explain it more soon.\n\n2.  Autofill from cell BF3 to\
    \ cell DC3, then autofill together to BF52:DC52. Let’s take a look at the formula\
    \ inside cell BG3\\. It is\n\n```\n    =COUNTIFS(INDEX($E$2:$BB$372,0,$BD3), 1,F$2:F$372,1)\n\
    \    ```\n\n`INDEX($E$2:$BB$372,0,$BD3)` will still give us E2:E372 for item I1\\\
    . However, `F$2:F$372` is for item I2\\. Thus, this formula is now counting how\
    \ many times item I1 and item I2 co-appear on a single receipt.\n\nAnother example\
    \ is the formula inside cell BJ4\\. It is\n\n```\n    =COUNTIFS(INDEX($E$2:$BB$372,0,$BD4),\
    \ 1,I$2:I$372,1)\n    ```\n\nAs BD4 = 2, this formula is in fact the same as\n\
    \n```\n    =COUNTIFS(F$2:F$372,1,I$2:I$372,1)\n    ```\n\nClearly, cell BJ4 is\
    \ counting how many times item I2 and item I5 co-appear on a single receipt.\n\
    \nBy now, let’s compare our worksheet with Figure [12-5](#494428_2_En_12_Chapter.xhtml#Fig5).\n\
    \n![](images/494428_2_En_12_Chapter/494428_2_En_12_Fig7_HTML.jpg)\n\nA spreadsheet\
    \ represents the support value of 0.03 and confidence value of 0.5 under column\
    \ D F. Column D G denotes I 1 to I 13 arranged vertically. Columns D H to D M\
    \ indicate the horizontal arrangement of I 1 to I 6, respectively. Cells D K 11\
    \ and D M 11 exhibit the values 0.035, 0.500.\n\nFigure 12-7\n\nThe association\
    \ analysis of itemsets of size 2\n\n1.  We need to construct another table to\
    \ show what itemsets are valid based on our minimum support value and minimum\
    \ confidence value.\n    *   Enter the text “Support” in cell DF2, number 0.03\
    \ in cell DF3, text “Confidence” in cell DF4, and number 0.5 in cell DF5.\n\n\
    *   Enter “I1” in cell DH1 and autofill horizontally to cell FE1.\n\n*   Enter\
    \ “I1” in cell DG3 and autofill vertically to cell DG52.\n\nCompare our table\
    \ setup with Figure [12-6](#494428_2_En_12_Chapter.xhtml#Fig6).\n\n![](images/494428_2_En_12_Chapter/494428_2_En_12_Fig6_HTML.jpg)\n\
    \nA spreadsheet represents a list of values of I 50 under column D C and support\
    \ and confidence values under D F. Column D G denotes I 1 to I 13 arranged vertically.\
    \ Columns D H to D N indicate the horizontal arrangement of I 1 to I 7, respectively.\n\
    \nFigure 12-6\n\nAssociation analysis table setup\n\n2.  Enter the following formula\
    \ in cell DH3, autofill from DH3 to FE3, and then autofill together from cells\
    \ DH3:FE3 to cells DH52:FE52:\n\n```\n    =IF($DG3=DH$1,\"\",IF(AND(BF$2>0,BF3/371>=$DF$3,\
    \ BF3/BF$2>=$DF$5),TEXT(BF3/371,\"0.000\") & \", \" &TEXT(BF3/BF$2,\"0.000\"),\"\
    \"))\n    ```\n\nFor this formula, we need to understand the following:\n    1.\
    \  Note, cell DH3 references itemset (DH1, DG3) which happens to be (I1, I1).\
    \ Similarly, cell DJ7 references itemset (DJ1, DG7) which is itemset (I3, I5).\n\
    \n2.  If DG3 and DH1 are for the same item (they are in this case), there is no\
    \ need to compute the support or confidence values.\n\n3.  `BF$2>0` is to avoid\
    \ the possible “divided by zero” error.\n\n4.  `BF3/371>=$DF$3` is to make sure\
    \ that the support value of the itemset (DH1, DG3) is no less than the minimum\
    \ support value. Note that I hard-coded the number of receipts 371 here. A better\
    \ approach is to use a cell reference, that is, storing the number of receipts\
    \ in a cell. Later in the “Reinforcement Exercises,” you will notice that I do\
    \ store the number of receipts in a cell.\n\n5.  `BF3/BF$2>=$DF$5` is to make\
    \ sure that the confidence value of the itemset (DH1, DG3) meets the minimum confidence\
    \ requirement.\n\n6.  The AND function guarantees if any requirement is not met,\
    \ nothing is displayed in cell DH3.\n\n7.  TEXT function is used to format the\
    \ results.\n\n3.  Compare our result with Figure [12-7](#494428_2_En_12_Chapter.xhtml#Fig7).\
    \ Adjust the minimum support value and confidence value to view the changes of\
    \ found itemsets.\n\nThe final result is available in Chapter12-1b.xlsx.\n\nAt\
    \ step 13, we can also enter a very complicated formula to generate the association\
    \ analysis result as shown in Figure [12-7](#494428_2_En_12_Chapter.xhtml#Fig7).\
    \ Doing this way, we don’t need to create the third table. Open the file Chapter12-2b.xlsx\
    \ to view the complicated formula.\n\nUsing Excel to conduct association analysis\
    \ on itemsets of size 3 or larger becomes impractical, that is why this chapter\
    \ stops here. Please be aware that association analysis can be computationally\
    \ expensive when the numbers of items and transactions are large.\n\n## Reinforcement\
    \ Exercises\n\nFor this chapter, I have one exercise for you. Open the file Chapter12-HW.xlsx;\
    \ you will see some data taken and preprocessed from the Online Retail dataset\
    \ that can be downloaded at [`https://doi.org/10.24432/C5BW33`](https://doi.org/10.24432/C5BW33)\
    \ from UCI Machine Learning Repository. Take a look at Figure [12-8](#494428_2_En_12_Chapter.xhtml#Fig8)\
    \ which is a screenshot of the data.\n\n![](images/494428_2_En_12_Chapter/494428_2_En_12_Fig8_HTML.jpg)\n\
    \nA spreadsheet represents a list of values under the invoice number, quantity,\
    \ and stock code. There are 11 rows denoting the details of the invoice numbers\
    \ 1, 2, and 3.\n\nFigure 12-8\n\nThe data for the reinforcement exercise\n\nCertainly,\
    \ the data inside Chapter12-HW.xlsx are organized the same as those in Chapter12-1a.xlsx\
    \ except for the names of the data. Remember to treat Invoices as Receipts and\
    \ Stock Code as Item Code. The file Chapter12-HW-withAnswers.xlsx contains my\
    \ answer to this exercise. Be advised that inside the answer worksheet, the number\
    \ of distinct invoices is stored in cell D2 instead of being hard-coded in formulas.\n\
    \nHope you enjoy the exercise.\n\n## Review Points\n\n1.  Association and its\
    \ potential applications\n\n2.  Item and itemset\n\n3.  Minimum support and minimum\
    \ confidence\n\n4.  Functions IF, AND, COUNTIFS, INDEX, and TEXT and the operator\
    \ &"
  trans: "\n3.  在单元格 BF1 中输入文本“I1”，然后向右自动填充至单元格 DC1。\n\n4.  在 BE2 中输入文本“出现次数”，在单元格\
    \ BF2 中输入公式 `=COUNTIFS(E2:E372,1)`，并从单元格 BF2 自动填充至单元格 DC2。单元格 BF2:DC2 引用的是“某个商品出现在收据上的次数”。例如，商品\
    \ I1 出现在 20 张收据上（如图 12-4 所示）。\n\n5.  在单元格 BD3 中输入 1，在单元格 BD4 中输入 2。同时选中单元格 BD3\
    \ 和 BD4，然后自动填充至单元格 BD52。此操作会将数字 1, 2, 3, …, 50 填入单元格 BD3, BD4, BD5, …, BD52。这些数字将用于引用数据表\
    \ E2:BB372 中的列，因为 E2:BB372 中共有 50 列，每列对应一个商品。\n\n6.  在单元格 BE3 中输入“I1”，然后从单元格 BE3\
    \ 自动填充至单元格 BE52。\n\n将我们的工作表与图 12-4 进行比较。如果我们的工作表与图 12-4 看起来不同，我们需要 (1) 检查公式，以及\
    \ (2) 确保商品名称中没有多余的空格。例如，在单元格 E1 或 BF1 中，如果商品名称输入为“I1 ”，那么针对 I1 的计算将不正确。\n\n![](img/494428_2_En_12_Fig5_HTML.jpg)\n\
    \n一个电子表格，展示了 BE 列下从 I1 到 I13 的出现次数，以及 BF 到 BM 列之间 I1 到 I8 的值列表。这些数据描述了商品共同出现在同一张收据上的次数。\n\
    \n图 12-5\n计算出的两个商品的共现次数\n\n1.  让我们计算两个商品在同一张收据上共同出现的次数。在单元格 BF3 中输入以下公式：\n\n```\n\
    \    =COUNTIFS(INDEX($E$2:$BB$372,0,$BD3),1,E$2:E$372,1)\n    ```\n\nBD3 = 1，因此函数\
    \ `INDEX($E$2:$BB$372,0,$BD3)` 会从表 E2:BB372 中取出第一列，即商品 I1 所在的列，也就是 E2:E372。因此，单元格\
    \ BF3 中的上述公式变为 `=COUNTIFS(E2:E372,1,E$2:E$372,1)`。此公式统计同时满足两个条件的行数：`E2:E372` 中的单元格值为\
    \ 1，且 E$2:E$372 中的单元格值也为 1。\n\n在这个特定公式中，两个条件恰好相同，因为单元格 BF3 对应的是项集 (I1, I1)。这可能会让人困惑。请继续往下看，我很快就会进一步解释。\n\
    \n2.  从单元格 BF3 自动填充至单元格 DC3，然后一起自动填充至 BF52:DC52。让我们看看单元格 BG3 中的公式。它是：\n\n```\n\
    \    =COUNTIFS(INDEX($E$2:$BB$372,0,$BD3), 1,F$2:F$372,1)\n    ```\n\n`INDEX($E$2:$BB$372,0,$BD3)`\
    \ 仍然会给出商品 I1 对应的 E2:E372。然而，`F$2:F$372` 对应的是商品 I2。因此，这个公式现在统计的是商品 I1 和商品 I2 在同一张收据上共同出现的次数。\n\
    \n另一个例子是单元格 BJ4 中的公式。它是：\n\n```\n    =COUNTIFS(INDEX($E$2:$BB$372,0,$BD4), 1,I$2:I$372,1)\n\
    \    ```\n\n由于 BD4 = 2，这个公式实际上等同于：\n\n```\n    =COUNTIFS(F$2:F$372,1,I$2:I$372,1)\n\
    \    ```\n\n显然，单元格 BJ4 统计的是商品 I2 和商品 I5 在同一张收据上共同出现的次数。\n\n现在，让我们将我们的工作表与图 12-5\
    \ 进行比较。\n\n![](img/494428_2_En_12_Fig7_HTML.jpg)\n\n一个电子表格，展示了 DF 列下的支持度值 0.03\
    \ 和置信度值 0.5。DG 列纵向排列了 I1 到 I13。DH 到 DM 列分别横向排列了 I1 到 I6。单元格 DK11 和 DM11 显示值为 0.035,\
    \ 0.500。\n\n图 12-7\n大小为 2 的项集的关联分析\n\n1.  我们需要构建另一个表格，根据我们的最小支持度值和最小置信度值来显示哪些项集是有效的。\n\
    \    *   在单元格 DF2 中输入文本“支持度”，在单元格 DF3 中输入数字 0.03，在单元格 DF4 中输入文本“置信度”，在单元格 DF5\
    \ 中输入数字 0.5。\n\n*   在单元格 DH1 中输入“I1”，然后向右自动填充至单元格 FE1。\n\n*   在单元格 DG3 中输入“I1”，然后向下自动填充至单元格\
    \ DG52。\n\n将我们的表格设置与图 12-6 进行比较。\n\n![](img/494428_2_En_12_Fig6_HTML.jpg)\n\n\
    一个电子表格，展示了 DC 列下 I50 的值列表，以及 DF 列下的支持度和置信度值。DG 列纵向排列了 I1 到 I13。DH 到 DN 列分别横向排列了\
    \ I1 到 I7。\n\n图 12-6\n关联分析表格设置\n\n2.  在单元格 DH3 中输入以下公式，从 DH3 自动填充至 FE3，然后一起从单元格\
    \ DH3:FE3 自动填充至单元格 DH52:FE52：\n\n```\n    =IF($DG3=DH$1,\"\",IF(AND(BF$2>0,BF3/371>=$DF$3,\
    \ BF3/BF$2>=$DF$5),TEXT(BF3/371,\"0.000\") & \", \" &TEXT(BF3/BF$2,\"0.000\"),\"\
    \"))\n    ```\n\n对于这个公式，我们需要理解以下几点：\n    1.  注意，单元格 DH3 引用的是项集 (DH1, DG3)，恰好是\
    \ (I1, I1)。类似地，单元格 DJ7 引用的是项集 (DJ1, DG7)，即项集 (I3, I5)。\n\n2.  如果 DG3 和 DH1 对应的是同一个商品（本例中正是如此），则无需计算支持度或置信度值。\n\
    \n3.  `BF$2>0` 是为了避免可能的“除以零”错误。\n\n4.  `BF3/371>=$DF$3` 是为了确保项集 (DH1, DG3) 的支持度值不小于最小支持度值。请注意，我在这里硬编码了收据数量\
    \ 371。更好的方法是使用单元格引用，即将收据数量存储在一个单元格中。稍后在“强化练习”中，您会注意到我将收据数量存储在了单元格中。\n\n5.  `BF3/BF$2>=$DF$5`\
    \ 是为了确保项集 (DH1, DG3) 的置信度值满足最小置信度要求。\n\n6.  AND 函数确保如果任何要求未满足，单元格 DH3 中不显示任何内容。\n\
    \n7.  TEXT 函数用于格式化结果。\n\n3.  将我们的结果与图 12-7 进行比较。调整最小支持度值和置信度值，以查看找到的项集的变化。\n\n\
    最终结果可在 Chapter12-1b.xlsx 文件中找到。\n\n在第 13 步，我们也可以输入一个非常复杂的公式来生成如图 12-7 所示的关联分析结果。这样做的话，我们就不需要创建第三个表格了。打开\
    \ Chapter12-2b.xlsx 文件查看这个复杂公式。\n\n使用 Excel 对大小为 3 或更大的项集进行关联分析变得不切实际，这就是本章在此处结束的原因。请注意，当商品数量和交易数量很大时，关联分析的计算量可能非常大。\n\
    \n## 强化练习\n\n本章为您准备了一个练习。打开 Chapter12-HW.xlsx 文件；您会看到一些从在线零售数据集中提取并预处理过的数据，该数据集可从\
    \ UCI 机器学习库的 [`https://doi.org/10.24432/C5BW33`](https://doi.org/10.24432/C5BW33)\
    \ 下载。请查看图 12-8，这是数据的截图。\n\n![](img/494428_2_En_12_Fig8_HTML.jpg)\n\n一个电子表格，展示了发票号、数量和库存代码下的值列表。共有\
    \ 11 行，描述了发票号 1、2 和 3 的详细信息。\n\n图 12-8\n强化练习的数据\n\n当然，Chapter12-HW.xlsx 中的数据组织方式与\
    \ Chapter12-1a.xlsx 中的相同，只是数据名称不同。请记住将发票视为收据，将库存代码视为商品代码。文件 Chapter12-HW-withAnswers.xlsx\
    \ 包含我对这个练习的答案。请注意，在答案工作表中，不同发票的数量存储在单元格 D2 中，而不是硬编码在公式中。\n\n希望您喜欢这个练习。\n\n## 复习要点\n\
    \n1.  关联性及其潜在应用\n\n2.  商品与项集\n\n3.  最小支持度与最小置信度\n\n4.  函数 IF、AND、COUNTIFS、INDEX\
    \ 和 TEXT 以及运算符 &\n"
- fmt: '# 13. Artificial Neural Network


    A data mining book without artificial neural network is not complete. By its name,
    we can tell that artificial neural network mimics the architecture and biological
    process of human neurons. In our brain, millions of neurons work together to generate
    corresponding outputs from various inputs. This conceptual understanding is taken
    to develop artificial neural network method, though how neurons work together
    biologically still needs much research to elucidate.


    Please download the sample Excel files from [`https://github.com/hhohho/Learn-Data-Mining-through-Excel-2`](https://github.com/hhohho/Learn-Data-Mining-through-Excel-2)
    for this chapter’s exercises.


    ## General Understanding


    Despite the extremely complicated biological architecture and process of our brain’s
    neuron network, the neural network data mining method has clear mathematical foundation.
    In its simplest form, artificial neural network is a linear function, similar
    to linear discriminant analysis. It takes inputs in the form of attributes and
    searches for optimal coefficients (or weights) for the attributes to generate
    an output that is as close as possible to the experimental data. However, neural
    network can be much more complicated and flexible than linear discriminant analysis.
    Of course, it can also be nonlinear. The true beauty of neural network is that
    it mimics the learning ability of neurons, that is, the output can be fed back
    as the input to further optimize the weights.


    The architecture in a typical neural network has multiple layers. The first layer
    is the input layer, and the last layer is the output layer. Between these two
    layers, there can be one or more hidden layers. The data into a layer are input
    to this specific layer; the information coming out of the layer is the output
    of the layer but the input to the next layer. At each hidden layer, data go through
    certain processing actions including aggregation and transformation. Figure [13-1](#494428_2_En_13_Chapter.xhtml#Fig1)
    depicts a simple neural network architecture. In this architecture, all data go
    into every node.


    ![](images/494428_2_En_13_Chapter/494428_2_En_13_Fig1_HTML.jpg)


    An artificial neural network. Six input layer nodes are linked to four hidden
    layer nodes, and the process concludes with an output layer. The output layer
    is classified into three classes, such as 1, 2, and 3.


    Figure 13-1


    Illustration of a simple neural network


    Hidden layers and the output layer are active layers because they aggregate and
    transform data. The transformation function is also called the activation function.
    The aggregate function can be linear or nonlinear. The two most commonly used
    activation functions are the sigmoid function and rectified linear unit function,
    though there are other activation functions such as bell-shaped function, logistic
    function, etc. Heaviside step function is also used commonly as it behaves very
    similarly to how a neuron generates output: either none or all. A common characteristic
    of these activation functions is that they all can provide a linear transformation,
    either for all data or only for a particular range of values. Clearly, these activation
    functions can simplify data by mapping the multidimensional data points into a
    linear space.


    Equation (6-2) defines the sigmoid function in its simplest form. Let’s review
    it again as Equation ([13-1](#494428_2_En_13_Chapter.xhtml#Equ1)):


    ![$$ S=\frac{1}{1+{\mathrm{e}}^{-\left({m}_1{x}_1+{m}_2{x}_2+\cdots +{m}_n{x}_n+b\right)}}
    $$](images/494428_2_En_13_Chapter/494428_2_En_13_Chapter_TeX_Equ1.png)


    (13-1)


    Figure [13-2](#494428_2_En_13_Chapter.xhtml#Fig2) shows the graph of the sigmoid
    function. Note that sigmoid function converges to 1 or -1 when the input goes
    to the positive or negative infinity. More importantly, sigmoid function can transform
    data into a linear space if the input is between -1 and 1. That is why data input
    of sigmoid activation function is usually normalized to the range of -1 and 1,
    or at least, the range of 0 and 1.


    ![](images/494428_2_En_13_Chapter/494428_2_En_13_Fig2_HTML.jpg)


    Two graphs illustrate the sigmoid function. The line begins at around -10, remains
    stable, and then passes diagonally through the vertical axis. It reaches 1 and
    then remains constant. The sigmoid function depicts the linear function between
    negative 1 and 1.


    Figure 13-2


    Sigmoid function is linear between -1 and 1


    ## Learn Neural Network Through Excel


    We are going to practice two experiments in this chapter. The first experiment
    is much simpler. It can help us to get a good idea about how a neural network
    works. The second experiment reinforces and elevates our understanding.'
  raw: '# 13. Artificial Neural Network


    A data mining book without artificial neural network is not complete. By its name,
    we can tell that artificial neural network mimics the architecture and biological
    process of human neurons. In our brain, millions of neurons work together to generate
    corresponding outputs from various inputs. This conceptual understanding is taken
    to develop artificial neural network method, though how neurons work together
    biologically still needs much research to elucidate.


    Please download the sample Excel files from [`https://github.com/hhohho/Learn-Data-Mining-through-Excel-2`](https://github.com/hhohho/Learn-Data-Mining-through-Excel-2)
    for this chapter’s exercises.


    ## General Understanding


    Despite the extremely complicated biological architecture and process of our brain’s
    neuron network, the neural network data mining method has clear mathematical foundation.
    In its simplest form, artificial neural network is a linear function, similar
    to linear discriminant analysis. It takes inputs in the form of attributes and
    searches for optimal coefficients (or weights) for the attributes to generate
    an output that is as close as possible to the experimental data. However, neural
    network can be much more complicated and flexible than linear discriminant analysis.
    Of course, it can also be nonlinear. The true beauty of neural network is that
    it mimics the learning ability of neurons, that is, the output can be fed back
    as the input to further optimize the weights.


    The architecture in a typical neural network has multiple layers. The first layer
    is the input layer, and the last layer is the output layer. Between these two
    layers, there can be one or more hidden layers. The data into a layer are input
    to this specific layer; the information coming out of the layer is the output
    of the layer but the input to the next layer. At each hidden layer, data go through
    certain processing actions including aggregation and transformation. Figure [13-1](#494428_2_En_13_Chapter.xhtml#Fig1)
    depicts a simple neural network architecture. In this architecture, all data go
    into every node.


    ![](images/494428_2_En_13_Chapter/494428_2_En_13_Fig1_HTML.jpg)


    An artificial neural network. Six input layer nodes are linked to four hidden
    layer nodes, and the process concludes with an output layer. The output layer
    is classified into three classes, such as 1, 2, and 3.


    Figure 13-1


    Illustration of a simple neural network


    Hidden layers and the output layer are active layers because they aggregate and
    transform data. The transformation function is also called the activation function.
    The aggregate function can be linear or nonlinear. The two most commonly used
    activation functions are the sigmoid function and rectified linear unit function,
    though there are other activation functions such as bell-shaped function, logistic
    function, etc. Heaviside step function is also used commonly as it behaves very
    similarly to how a neuron generates output: either none or all. A common characteristic
    of these activation functions is that they all can provide a linear transformation,
    either for all data or only for a particular range of values. Clearly, these activation
    functions can simplify data by mapping the multidimensional data points into a
    linear space.


    Equation (6-2) defines the sigmoid function in its simplest form. Let’s review
    it again as Equation ([13-1](#494428_2_En_13_Chapter.xhtml#Equ1)):


    ![$$ S=\frac{1}{1+{\mathrm{e}}^{-\left({m}_1{x}_1+{m}_2{x}_2+\cdots +{m}_n{x}_n+b\right)}}
    $$](images/494428_2_En_13_Chapter/494428_2_En_13_Chapter_TeX_Equ1.png)


    (13-1)


    Figure [13-2](#494428_2_En_13_Chapter.xhtml#Fig2) shows the graph of the sigmoid
    function. Note that sigmoid function converges to 1 or -1 when the input goes
    to the positive or negative infinity. More importantly, sigmoid function can transform
    data into a linear space if the input is between -1 and 1\. That is why data input
    of sigmoid activation function is usually normalized to the range of -1 and 1,
    or at least, the range of 0 and 1.


    ![](images/494428_2_En_13_Chapter/494428_2_En_13_Fig2_HTML.jpg)


    Two graphs illustrate the sigmoid function. The line begins at around -10, remains
    stable, and then passes diagonally through the vertical axis. It reaches 1 and
    then remains constant. The sigmoid function depicts the linear function between
    negative 1 and 1.


    Figure 13-2


    Sigmoid function is linear between -1 and 1


    ## Learn Neural Network Through Excel


    We are going to practice two experiments in this chapter. The first experiment
    is much simpler. It can help us to get a good idea about how a neural network
    works. The second experiment reinforces and elevates our understanding.'
  trans: '

    # 13. 人工神经网络


    一本没有人工神经网络的数据挖掘书籍是不完整的。顾名思义，人工神经网络模仿了人类神经元的架构和生物过程。在我们的大脑中，数百万个神经元协同工作，从各种输入中产生相应的输出。这种概念性的理解被用来开发人工神经网络方法，尽管神经元在生物学上如何协同工作仍需大量研究来阐明。


    请从 [`https://github.com/hhohho/Learn-Data-Mining-through-Excel-2`](https://github.com/hhohho/Learn-Data-Mining-through-Excel-2)
    下载本章练习所需的示例 Excel 文件。


    ## 总体理解


    尽管我们大脑神经元网络的生物架构和过程极其复杂，但神经网络数据挖掘方法却有着清晰的数学基础。在其最简单的形式中，人工神经网络是一个线性函数，类似于线性判别分析。它以属性的形式接收输入，并寻找属性的最优系数（或权重），以生成尽可能接近实验数据的输出。然而，神经网络可以比线性判别分析复杂和灵活得多。当然，它也可以是非线性的。神经网络真正的美妙之处在于它模仿了神经元的学习能力，即输出可以反馈作为输入，以进一步优化权重。


    典型神经网络的架构具有多个层。第一层是输入层，最后一层是输出层。在这两层之间，可以有一个或多个隐藏层。进入某一层的数据是该特定层的输入；从该层输出的信息是该层的输出，但却是下一层的输入。在每个隐藏层，数据会经历某些处理动作，包括聚合和转换。图
    13-1 描绘了一个简单的神经网络架构。在此架构中，所有数据都会进入每一个节点。


    ![](img/494428_2_En_13_Fig1_HTML.jpg)


    一个人工神经网络。六个输入层节点连接到四个隐藏层节点，该过程以输出层结束。输出层被分类为三个类别，例如 1、2 和 3。


    图 13-1


    一个简单神经网络的示意图


    隐藏层和输出层是活跃层，因为它们会聚合和转换数据。转换函数也称为激活函数。聚合函数可以是线性的或非线性的。两种最常用的激活函数是 Sigmoid 函数和修正线性单元函数，尽管还有其他激活函数，如钟形函数、逻辑函数等。Heaviside
    阶跃函数也经常被使用，因为它与神经元产生输出的方式非常相似：要么全有，要么全无。这些激活函数的一个共同特点是，它们都能提供线性变换，无论是针对所有数据还是仅针对特定范围的值。显然，这些激活函数可以通过将多维数据点映射到线性空间来简化数据。


    公式 (6-2) 定义了其最简单形式的 Sigmoid 函数。让我们将其作为公式 (13-1) 再次回顾：


    ![$$ S=\frac{1}{1+{\mathrm{e}}^{-\left({m}_1{x}_1+{m}_2{x}_2+\cdots +{m}_n{x}_n+b\right)}}
    $$](img/494428_2_En_13_Chapter_TeX_Equ1.png)


    (13-1)


    图 13-2 显示了 Sigmoid 函数的图形。请注意，当输入趋向正无穷或负无穷时，Sigmoid 函数收敛于 1 或 -1。更重要的是，如果输入在 -1
    和 1 之间，Sigmoid 函数可以将数据转换到线性空间。这就是为什么 Sigmoid 激活函数的数据输入通常被归一化到 -1 和 1 的范围，或者至少是
    0 和 1 的范围。


    ![](img/494428_2_En_13_Fig2_HTML.jpg)


    两个图形说明了 Sigmoid 函数。该线大约从 -10 开始，保持稳定，然后对角穿过纵轴。它达到 1 后保持恒定。Sigmoid 函数描绘了 -1 和 1
    之间的线性函数。


    图 13-2


    Sigmoid 函数在 -1 和 1 之间是线性的


    ## 通过 Excel 学习神经网络


    本章我们将进行两个实验。第一个实验要简单得多，它可以帮助我们很好地理解神经网络的工作原理。第二个实验则能巩固并提升我们的理解。

    '
- fmt: '### Experiment 1


    Open `Chapter13-1a.xlsx` which contains the Breast Cancer Wisconsin (Original)
    dataset downloaded from UCI Machine Learning Repository at [`https://doi.org/10.24432/C5HP4Z`](https://doi.org/10.24432/C5HP4Z).
    For details of the dataset, please visit [`https://archive.ics.uci.edu/`](https://archive.ics.uci.edu/)
    or read the journal article (W.H. Wolberg and O.L. Mangasarian: “Multisurface
    method of pattern separation for medical diagnosis applied to breast cytology,”
    PNAS, 1990, 87:9193-9196).


    There are originally ten attributes and one target named `Class`. The class has
    two values: 2 for benign breast cancer and 4 for malignant breast cancer. The
    first attribute is the sample code number which is removed in `Chapter13-1a.xlsx`.
    The other nine attributes are renamed `x1`, `x2`, …, `x9` for simplicity. The
    downloaded dataset had 699 samples originally. Because one attribute is missing
    in 16 samples, these 16 samples were removed. Thus in `Chapter13-1a.xlsx`, there
    are only 683 samples.


    Five hundred samples are used as the training dataset; the rest 183 samples will
    be used as the testing dataset to assess how well our neural network model can
    perform. The top part of our worksheet looks like Figure [13-3](#494428_2_En_13_Chapter.xhtml#Fig3).


    ![](images/494428_2_En_13_Chapter/494428_2_En_13_Fig3_HTML.jpg)


    A screenshot of the Excel sheet demonstrates the breast cancer dataset.


    Figure 13-3


    The breast cancer dataset downloaded from UCI


    In our first experiment, for the purpose of simplicity, we are going to have only
    one hidden layer with three neurons (usually called Nodes) as marked in cells
    `A1:A4`. The weights, `w1`, `w2`, …, `w9`, are the weights (coefficients) for
    the nine attributes, while `b` is the so-called bias, that is, the intercept in
    a linear function. Each neuron has its own set of weights and bias. Note, we are
    going to use a linear aggregation function. `Wo` and `Bo` represent the weights
    and bias used for the output layer. If confused at this moment, don’t worry. I
    will explain more details at each step when these data are used.


    Follow these instructions to complete this experiment:


    ![](images/494428_2_En_13_Chapter/494428_2_En_13_Fig4_HTML.jpg)


    A screenshot of the Excel sheet contains the weights and intercepts data. They
    have a value of 1.


    Figure 13-4


    Initialize weights and intercepts with 1s


    1.  The first task is to assign values to the weights and intercepts. Let’s assign
    1s to all of them as shown in Figure [13-4](#494428_2_En_13_Chapter.xhtml#Fig4).


    2.  Each neuron takes all training samples as input. The training samples are
    stored in table `B11:K510`. For sample 1 (row 11), all of its attribute values
    are aggregated into a single value inside neurons 1, 2, and 3, respectively. Thus,
    we need to enter the following formula into cell `L11`:


    ```

    =SUMPRODUCT($B11:$J11,INDEX($B$2:$J$4,L$10,0))+INDEX($K$2:$K$4,L$10,1)

    ```


    This formula implements the linear expression `w1x1 + w2x2 + w3x3 + … + b`. In
    this specific formula, `w1`, `w2`, `w3`… and `b` are for neuron 1 (`B2:K2`), and
    `x1`, `x2`, `x3`, … are for the first data point in row 11.


    The function `SUMPRODUCT` is used to compute the sum product of the two arrays:
    `B11:J11` and `B2:J2`. We can write the function as `SUMPRODUCT($B11:$J11,$B$2:$J$2)`.
    However, we want to autofill from `L11` to `N11` without rewriting the formula
    again and again. Therefore, `INDEX($B$2:$J$4,L$10,0)` is applied to obtain the
    array `B2:J2` based on the value in cell `L10`. As `L10 = 1`, `INDEX($B$2:$J$4,L$10,0)`
    fetches the first row from the table `B2:J4`.


    `INDEX($K$2:$K$4,L$10,1)` fetches the value inside cell `K2`, that is, the bias.
    Note, there is only one column in the array `K2:K4`; that is why the last parameter
    inside the `INDEX` function is 1.


    3.  Autofill from `L11` to `N11`, and then autofill together to `L510:N510`. Part
    of our worksheet looks like Figure [13-5](#494428_2_En_13_Chapter.xhtml#Fig5).
    Examine the formula inside cell `M11`. Since `M10 = 2`, the aggregation function
    makes use of the coefficients of neuron 2.'
