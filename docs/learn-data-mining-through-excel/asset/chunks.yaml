    对于`Size`、`Number`和`Thickness`这三个属性，我们在步骤3、5和7中输入了三个不同的公式。有一种方法可以让我们在`C5`单元格中输入一个公式，然后自动填充到`F17`单元格，从而完成所有三个属性的概率计算。我们将在下一章中体验这种技术。


    `Chapter9-2a.xlsx`中呈现的数据是随机生成的，不适合用于交叉验证。然而，考虑到训练数据集的大小，我们当然可以将其分成两部分来练习交叉验证。


    ## 强化练习


    `Chapter9-HW.xlsx`中的数据来自著名的UCI机器学习库（[`https://archive.ics.uci.edu/`](https://archive.ics.uci.edu/)）。该数据集为练习朴素贝叶斯数据挖掘提供了一个很好的机会。需要帮助时，请参考`Chapter9-HW-withAnswers`。


    ## 复习要点


    1.  对朴素贝叶斯的一般理解。学习如何从条件概率推导出贝叶斯定理，并尝试自己重复推导过程。

    2.  `COUNTIF`、`COUNTIFS`和`SUMIF`函数以及运算符`&`。

    3.  `INDEX`、`MATCH`和`TEXT`函数。


    # 10. 决策树


    决策树可能是最直观的数据分类和预测方法，它也被频繁使用。虽然我们学过的大多数数据挖掘方法都是参数化的，但决策树是一种基于规则的方法。理解决策树最关键的概念是熵，我们很快就会解释它。一棵树由节点组成，叶子节点是最底层的节点。在每个非叶子节点处，必须做出决策，将该节点分裂成至少两个分支。图[10-1](#494428_2_En_10_Chapter.xhtml#Fig1)描绘了一个示例决策树结构。


    ![](images/494428_2_En_10_Chapter/494428_2_En_10_Fig1_HTML.jpg)


    一个决策树结构。节点`N1`被细分为节点`N21`、`N22`和`N23`。节点`N21`被细分为`N31`和`L1`。节点`N22`被细分为`L2`和`L3`。节点`N23`被细分为`L4`、`N32`和`L5`。节点`N31`被细分为`L6`和`L7`。节点`N32`被细分为`L8`和`L9`。


    **图 10-1**


    一个示例决策树结构


    在图[10-1](#494428_2_En_10_Chapter.xhtml#Fig1)中，所有节点都以字母“N”开头，而所有叶子节点都以字母“L”开头。在决策树中，一个节点可以分裂成两个或多个子节点。但是，叶子节点永远不能再被分裂。决策树中最关键的操作是确定如何分裂一个节点。尽管每个节点都适用一个通用规则，但必须根据节点内部的数据单独考虑每个节点。


    请从[`https://github.com/hhohho/Learn-Data-Mining-through-Excel-2`](https://github.com/hhohho/Learn-Data-Mining-through-Excel-2)下载本章练习所需的示例Excel文件。


    ## 一般理解


    决策树中节点如何分裂，取决于使用该节点内部数据计算出的熵。熵表示树节点内部数据的“纯净”程度。熵越高，数据越不纯净。让我们学习如何计算熵，以便更好地理解。


    假设一个数据集的目标变量有`m`个不同的类别。该数据集的熵通常基于公式（[10-1](#494428_2_En_10_Chapter.xhtml#Equ1)）计算：


    ![$$ H=-\sum \limits_{k=1}^m{P}_K{\log}_2\left({P}_k\right) $$](images/494428_2_En_10_Chapter/494428_2_En_10_Chapter_TeX_Equ1.png)


    (10-1)


    在公式（[10-1](#494428_2_En_10_Chapter.xhtml#Equ1)）中，`Pk`是第`k`个类别出现的概率；它用于对`log2(Pk)`进行加权。例如，假设有10个数据项，其中3个是“是”，7个是“否”。由于只有两个不同的类别（是或否），所以`m`
    = 2。


    *   对于“是”，`p` = 3/10 = 0.3，`log2(p)` = -1.74，`p*log2(p)` = -0.52。

    *   对于“否”，`p` = 7/10 = 0.7，`log2(p)` = -0.51，`p*log2(p)` = -0.36。

    *   `H` = -(-0.52 - 0.36) = 0.88。


    如果有10个“是”和0个“否”，计算如下：


    *   对于“是”，`p` = 10/10 = 1，`log2(p)` = 0，`p*log2(p)` = 0。

    *   对于“否”，`p` = 0/10 = 0，`p*log2(p)` = 0（假设`log2(0)`不是错误）。

    *   `H` = -(0 + 0) = 0。


    如果有5个“是”和5个“否”，计算得出的`H` = 1.0。


    似乎数据越偏向某个类别，熵就越低。决策树方法倾向于选择产生最小熵的属性来分裂节点。这很容易理解。假设我们面前有两条路，需要选择一条到达目的地。如果两条路让我们准时到达的可能性相同，我们会发现自己犹豫不决（`H`=1）。如果某条路让我们准时到达的可能性明显大得多，我们的决定就不会困难。此外，如果只有一条路，我们的选择是确定的（`H`
    = 0）。


    在公式（[10-1](#494428_2_En_10_Chapter.xhtml#Equ1)）中，使用了以2为底的对数。以2为底的对数是决策树中最常用的对数函数。当数据集中只有两个类别时，以2为底的对数保证熵在0到1之间（包括端点）。当类别超过两个时，以2为底的对数不能保证熵在0到1之间。如果我们希望熵在0到1之间，那么当有`N`个不同类别时，必须使用以`N`为底的对数函数。


    让我们使用著名的高尔夫数据集（也称为天气数据集）来解释如何构建决策树。


    **表 10-1**


    打高尔夫数据集


    | Temperature | Humidity | Windy | Outlook | Play |

    | --- | --- | --- | --- | --- |

    | Hot | High | FALSE | overcast | Yes |

    | Cool | Normal | TRUE | overcast | Yes |

    | Mild | High | TRUE | overcast | Yes |

    | Hot | Normal | FALSE | overcast | Yes |

    | Mild | High | FALSE | rainy | Yes |

    | Cool | Normal | FALSE | rainy | Yes |

    | Cool | Normal | TRUE | rainy | No |

    | Mild | Normal | FALSE | rainy | Yes |

    | Mild | High | TRUE | rainy | No |

    | Hot | High | FALSE | sunny | No |

    | Hot | High | TRUE | sunny | No |

    | Mild | High | FALSE | sunny | No |

    | Cool | Normal | FALSE | sunny | Yes |

    | Mild | Normal | TRUE | sunny | Yes |


    这个数据集非常简单。它只有14个样本和4个属性。是否打高尔夫取决于这4个属性。要基于这个训练数据集构建决策树，首要任务是找到一个属性，从一开始就将树分裂成多个分支。为此，我们需要计算目标变量`Play`的熵，以及4个属性相对于目标变量的熵。


    对于目标变量`Play`，有9个“是”和5个“否”；因此，根据公式（[10-1](#494428_2_En_10_Chapter.xhtml#Equ1)）：


    ```

    H-play = -(9/14×log2(9/14)+5/14×log2(5/14)) = 0.94

    ```'
