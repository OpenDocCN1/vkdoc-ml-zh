  trans: "\n一张 Excel 表格截图显示了 20 行和 4 列。表格中包含组内方差、差值、均值、样本数量和临界值等标签。\n\n图 4-12\n\n\
    计算方差\n\n1.  在单元格 K18、K19 和 K20 中，分别输入“组间方差”、“组内方差”和“组间/组内比率”。\n\n2.  在单元格 L18\
    \ 中输入以下公式：\n\n```\n    =(K12-AVERAGE(K12:K14))²+(K13-AVERAGE(K12:K14))²+(K14-AVERAGE(K12:K14))²\n\
    \    ```\n\n此公式计算各组均值之间的方差，即公式(4-1)中所示的 Sg。该值越大，表示各组之间的可分离性越高。注意，单元格 K12、K13 和\
    \ K14 引用的是组内均值。\n\n3.  在计算组内方差之前，我们必须先计算每个数据点在其所属组内的方差。在单元格 J1 中输入“组内方差”，然后在单元格\
    \ J2 中输入以下公式：\n\n```\n    =IF(F2=K$1,(G2-K$12)²,IF(F2=K$2, (G2-K$13)²,(G2-K$14)²))\n\
    \    ```\n\n在此公式中，F 列用于确定每个数据点属于哪个组。请注意，F 列代表每个数据点所属的真实组。LDA 是一种监督分类方法；此处使用 F\
    \ 列比使用 G 列更准确。如果 F2 = K1，则通过表达式`(G2-K12)²`计算相应数据点的组内方差。如果不是但 F2 = K2，则通过表达式`(G2-K13)²`计算方差；否则，使用表达式`(G2-K14)²`。\n\
    \n4.  自动填充单元格 J2 至 J152。\n\n5.  在单元格 L19 中输入公式`=SUM(J1:J152)`。这是公式(4-2)中所示的*S*[*w*]值。\n\
    \n6.  在单元格 L20 中输入公式`=L18/L19`。这是需要通过规划求解最大化的 Sg(P)/Sw(P)值。至此，我们的工作表部分内容如图 4-12\
    \ 所示。\n\n![](img/494428_2_En_4_Fig13_HTML.jpg)\n\n一张 Excel 表格截图，菜单中高亮显示了数据和规划求解选项。\n\
    \n图 4-13\n\n使用 Excel 规划求解\n\n1.  仅将单元格 M5:M9 的内容以数值形式复制到单元格 N5:N9。记得使用 Excel 的“选择性粘贴”功能。我们将使用规划求解来优化单元格\
    \ M5:M9 中的这些值。在此之前，我们想先复制一份，以便在使用规划求解后能看出变化。此时，查看单元格 L18 和 L19 中的值，并尝试记住它们。\n\n\
    2.  单击菜单选项卡“数据”；找到如图 4-13 所示的规划求解。\n\n![](img/494428_2_En_4_Fig14_HTML.jpg)\n\n\
    规划求解参数对话框截图，高亮显示了$L$20、最大值和通过更改可变单元格$M$5:$M$9。两个箭头指向 GRG 非线性及求解按钮。\n\n图 4-14\n\
    \n使用 Excel 规划求解优化函数 P 的参数\n\n1.  单击规划求解。在出现的菜单中，严格按照图 4-14 所示指定值。设置目标指示要优化的值。在此例中，我们需要最大化\
    \ L20 中的值。规划求解被要求通过更改单元格 M5:M9 中的值来最大化 L20。选择的求解方法是 GRG 非线性。\n\n![](img/494428_2_En_4_Fig15_HTML.jpg)\n\
    \n显示规划求解结果对话框的屏幕截图，表明规划求解已收敛到当前解，且满足所有约束。\n\n图 4-15\n\n保留规划求解的解\n\n1.  单击求解后，在出现的菜单上单击确定，如图\
    \ 4-15 所示。\n\n单元格 M5:M9 中的值已更改，单元格 M16 中的值从 4 变为 2。如图 4-16 所示。\n\n![](img/494428_2_En_4_Fig16_HTML.jpg)\n\
    \n一张 Excel 表格截图，包含 4 列和 16 行。标签为均值、样本数量、临界值、由规划求解获得和由 LINEST 优化。\n\n图 4-16\n\n\
    规划求解进一步改进了 LDA 模型\n\n尽管新的参数集略微改善了分类结果，但我们需要密切关注单元格 K12:K14 和 L18:L20 中发生的变化，如图\
    \ 4-17 所示。显然，组间方差显著减小，但组内方差减小得更多。\n\n![](img/494428_2_En_4_Fig17_HTML.jpg)\n\n\
    一张 Excel 表格截图，包含 3 列和 10 行。标签为均值、样本数量和临界值，差值为 2，组间方差、组内方差和组间/组内比率的值为高亮显示的 0.52、0.8\
    \ 和 0.65。\n\n图 4-17\n\n关注参数\n\n为了评估我们的模型有多好，我们需要对模型进行交叉验证，并学习接收者操作特征（ROC）曲线分析。这将是下一章的主题。\n\
    \n## 强化练习\n\n请打开文件 Chapter4-HW.xlsx，并尝试其中的 LDA 练习。如果遇到任何困难，请参考名为 Chapter4-HW-withAnswers.xlsx\
    \ 的 Excel 文件。\n\n## 复习要点\n\n1.  LDA 的基本理解\n\n2.  规划求解，包括其安装和使用\n\n3.  Excel 函数\
    \ INDEX 和 LINEST\n\n4.  Excel 函数 IF、MMULT、COUNTIFS 和 AVERAGEIFS\n\n# 5. 交叉验证与\
    \ ROC\n\n请从[`https://github.com/hhohho/Learn-Data-Mining-through-Excel-2`](https://github.com/hhohho/Learn-Data-Mining-through-Excel-2)下载本章练习所需的示例\
    \ Excel 文件。\n"
- fmt: '# General Understanding of Cross-Validation


    A prediction model should be validated before it can be successfully applied to
    scoring data. Using the same training dataset as the testing dataset to assess
    the constructed model is not a good way to validate the model. Such a validating
    strategy is called residual analysis. It compares the difference (so-called residual)
    between the actual output and the predicted output. In Chapter [4](#494428_2_En_4_Chapter.xhtml),
    we applied residual analysis to assess the quality of our constructed LDA model.


    Residual analysis cannot tell how well the model can perform on the scoring data,
    the future data with unknown target values. One solution is to leave part of the
    original training dataset unused as the testing subset. In many occasions, the
    testing subset is also called validation subset, though they can be further distinguished.
    In this book, let’s treat them the same. As the model is not trained with the
    testing subset, such a testing subset can act as a scoring dataset and can also
    tell us how well the model can perform with unknown data. Such a validation strategy
    is called cross-validation.


    There are several cross-validation strategies. The simplest one is the holdout
    method in which the original training dataset is divided into two subsets: training
    and testing. The model is trained on the training subset but assessed on the testing
    subset. This method is more reliable than residual analysis, but its performance
    heavily relies on what is inside the training subset and what is inside the testing
    subset, that is, how to divide the original training dataset can significantly
    impact the model performance. A consensus in machine learning community is that
    the training subset should be larger than the testing subset, usually at least
    twice as large. In addition, the training subset should be as large as possible
    as long as there are enough data points inside the testing subset to evaluate
    the model.


    K-fold cross-validation is an improved version over the holdout method. In k-fold
    cross-validation, the original training data is randomly divided into k subsets,
    and the holdout assessment is performed k times. In each holdout assessment, one
    subset is used as the testing data for validation; all other k-1 subsets are grouped
    together for training. In k-fold cross-validation, each data point is used once
    in the testing subset but k-1 times in the training subset. The model’s performance
    is based on the overall quality of the k assessments.


    One widely used cross-validation method is the leave-one-out (LOO) method, which
    is an extreme version of the k-fold cross-validation. In LOO, the testing data
    contains only one data point every time; the rest of the data points are grouped
    together as the training subset.


    # Learn Cross-Validation Through Excel


    When the dataset is large, it is impractical to conduct LOO cross-validation in
    Excel if no VBA programming is involved. In fact, it is very tedious to carry
    out a k-fold cross-validation in Excel, too. Therefore, I will only demonstrate
    how to conduct a holdout cross-validation using Excel. However, file `Chapter5-cv-1c.xlsx`
    presents a demonstration of a fivefold cross-validation using LDA.


    In the last chapter, we have learned how to carry out linear discriminant analysis
    on the Iris dataset. In this chapter, the Iris dataset has been divided into two
    subsets: training and testing. A random algorithm is used to pick about two-third
    data points as the training dataset, while the rest is the testing dataset.


    Open the file `Chapter5-cv-1a.xlsx`. There are two worksheets: `training_dataset`,
    which contains 103 data records, and `testing_dataset`, which contains 47 data
    records. Follow what we have learned about LDA in the last chapter; let’s make
    use of the function `LINEST` to find the parameter set (`w[1]`, `w[2]`, …`w[n]`,
    `b`) for function `P` in the worksheet `training_dataset`. Our worksheet should
    look like Figure [5-1](#494428_2_En_5_Chapter.xhtml#Fig1). Note that there are
    only 103 data points in the training dataset.


    ![](images/494428_2_En_5_Chapter/494428_2_En_5_Fig1_HTML.jpg)


    A screenshot of a spreadsheet represents the values of Iris type, x 1, x 2, x
    3, x 4, y, numerical classification, type classification, and difference. Columns
    K, L, and M denote a set of values without any column header.


    Figure 5-1


    Apply LDA on the training dataset


    Again, the LDA works well on the Iris dataset. There are only two false predictions.
    However, the validation results in Figure [5-1](#494428_2_En_5_Chapter.xhtml#Fig1)
    were obtained through a residual analysis.


    Follow these instructions to complete the cross-validation procedure in Excel:


    ![](images/494428_2_En_5_Chapter/494428_2_En_5_Fig2_HTML.jpg)


    A spreadsheet represents the values of Iris type, x 1, x 2, x 3, and x 4, from
    the columns A to E. The Iris type reads Iris-Setosa. Columns K, L, and M denote
    the mean and cutoff values of 3 sample numbers at the bottom and a set of values
    at the top without any column header.


    Figure 5-2


    Copy the LDA parameter set to the testing worksheet


    1.  In the worksheet `training_dataset`, the parameter set (`w[1]`, `w[2]`, …`w[n]`,
    `b`) is stored in cells `M5:M9`, while the cutoffs are referenced by cells `M12`
    and `M13`. Select cells `K1:M16` and copy them.


    2.  Click the `testing_dataset` worksheet to open it.


    3.  In the worksheet `testing_dataset`, right-click on cell `K1` ➤ apply the Paste
    Special skill to paste values into cell `K1`. Remember to paste values only.


    Our `testing_dataset` worksheet should look like Figure [5-2](#494428_2_En_5_Chapter.xhtml#Fig2).


    ![](images/494428_2_En_5_Chapter/494428_2_En_5_Fig3_HTML.jpg)


    A spreadsheet represents the values of Iris type, x 1, x 2, x 3, x 4, numerical
    classifier, type classifier, and difference, from columns A to I The Iris type
    reads Iris-Setosa. Columns K, L, and M denote the mean, cutoff, and difference
    values of 3 sample numbers at the bottom.


    Figure 5-3


    Cross-validation with the testing dataset


    1.  In cells `G1:I1`, type “Numerical classification”, “Type classification”,
    and “Difference”, respectively.


    2.  In cell `G2`, enter the following formula:


    ```

    =MMULT(B2:E2, M$6:M$9)+ M$5

    ```


    3.  Autofill from `G2` to `G48`.


    4.  In cell `H2`, enter the following formula:


    ```

    =IF(G2<M$12,L$1,IF(G2<M$13,L$2,L$3))

    ```


    5.  Autofill from `H2` to `H48`.


    6.  In cell `I2`, enter the formula `=IF(A2=H2,0,1)`, hit Enter, and then autofill
    from `I2` to `I48`.


    7.  At last, in cell `M16`, enter the formula `=SUM(I2:I48)`.'
