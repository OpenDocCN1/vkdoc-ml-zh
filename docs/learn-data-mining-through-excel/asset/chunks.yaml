  trans: "\n## 通过 Excel 学习 ROC 分析\n\n文件 `Chapter5-roc-1a.xlsx` 中的数据是模拟的。在该文件中，TP、FN、FP\
    \ 和 TN 会随着不同截断值的变化而变化，如图 5-6 所示。虽然文件中有 19 条记录，但图 5-6 仅显示了 11 条记录。第 8 至 15 行被隐藏了。\n\
    \n![](img/494428_2_En_5_Fig6_HTML.jpg)\n\n电子表格展示了真阳性、假阴性、假阳性、真阴性和截断值下的一组数值。在第\
    \ 7 行处画了一条线。截断值的范围是从 1 到 7，步长为 0.5。\n\n图 5-6\n\nChapter5-roc-1a.xlsx 训练数据集\n\n\
    我们想要绘制一张图表，以观察敏感度和特异度如何随不同截断值而变化。请遵循以下说明：\n\n1.  分别在单元格 F2 和 G2 中输入“敏感度”和“特异度”。\n\
    \n2.  在单元格 F3 中，输入公式 `=A3/(A3+B3)`。此公式计算截断值 = 1 时的敏感度。从 F3 自动填充到 F21。\n\n3.  在单元格\
    \ G3 中，输入公式 `=D3/(C3+D3)`。此公式计算截断值 = 1 时的特异度。从 G3 自动填充到 G21。\n\n4.  选中单元格区域 E2:G21；点击菜单选项卡“插入”➤“图表”➤\
    \ 选择“带平滑线和数据标记的散点图”。工作表中会出现一个散点图。\n\n5.  我们可以根据需要添加坐标轴标题和图表标题。默认情况下，垂直轴的最大边界值为\
    \ 1.2。我更喜欢将其设置为 1.0，因此我双击数值 1.2，然后在弹出的“坐标轴选项”菜单中将其更改为 1.0。\n\n我们的图表可能类似于图 5-7（包含相关数据）。请注意，两条曲线在某一点相交。该交点标记了一个截断值，在此值下敏感度等于特异度。\n\
    \n![](img/494428_2_En_5_Fig7_HTML.jpg)\n\n电子表格展示了截断值、敏感度和特异度下的一系列数值。折线图表示敏感度和特异度相对于截断点的百分比。敏感度呈下降趋势，特异度呈上升趋势。两者在中间相交。\n\
    \n图 5-7\n\n敏感度/特异度 vs. 截断值\n\n下一步是绘制 ROC 曲线。ROC 曲线是以假阳性率为横轴、真阳性率为纵轴绘制的，即 1-特异度\
    \ vs. 敏感度。为了更易于查看，所有数值都乘以了 100。因此，ROC 曲线实际上是 (100-100*特异度) vs. (100*敏感度)。\n\n\
    在 ROC 曲线图中，X 轴是 100-特异度。因此，特异度值应按降序排列。由于当前的特异度值是升序排列的，我们需要将特异度值翻转。相应地，我们也需要翻转敏感度值。继续遵循以下说明：\n\
    \n6.  选中单元格区域 E2:G21；使用“选择性粘贴”将数值仅粘贴到单元格 A25。\n\n7.  选中单元格区域 A25:C44；点击菜单选项卡“数据”➤“排序”。\n\
    \n8.  在弹出的菜单中，按“截断值”排序，顺序为“从大到小”，如图 5-8 所示。确保勾选“数据包含标题”。点击“确定”。\n\n![](img/494428_2_En_5_Fig8_HTML.jpg)\n\
    \n一个标题为“排序”的对话框截图。它展示了按列名“截断值”根据单元格数值从大到小排序的选项。\n\n图 5-8\n\n按截断值排序数据\n\n我们工作表的一部分看起来像图\
    \ 5-9。\n\nExcel 可以仅对选中的单元格进行排序，同时保持其他所有单元格不变。这是 Excel 的一个强大功能。如果待排序的单元格包含引用排序区域外其他单元格的公式，排序可能会打乱某些计算。这就是为什么我们需要先按值复制\
    \ E2:G21，然后再对复制的值进行排序。\n\n![](img/494428_2_En_5_Fig9_HTML.jpg)\n\n一个电子表格截图，展示了截断值、敏感度和特异度下的一系列数值。截断值范围从\
    \ 1 到 10，间隔为 0.5。数值按降序排列。\n\n图 5-9\n\n翻转后的数据\n\n我们还需要对数据进行缩放。继续遵循以下说明：\n\n9. \
    \ 在单元格 D25 中输入“100-特异度”，在单元格 E25 中输入“敏感度”。\n\n10. 在单元格 D26 中，输入公式 `=100-ROUND(C26*100,0)`。此公式将现有的特异度值乘以\
    \ 100，进行四舍五入，然后用 100 减去该结果。\n\n11. 从单元格 D26 自动填充到 D44。\n\n12. 在单元格 E26 中，输入公式\
    \ `=ROUND(100*B26,0)`。\n\n13. 从单元格 E26 自动填充到 E44。\n\n14. 右键单击行号 26，选择“插入”。此操作会插入一个空白行。原来的单元格\
    \ D26 现在变成了 D27。\n\n15. 在单元格 D26 和 E26 中都输入 0。\n\n我们工作表的一部分应该看起来像图 5-10。\n\n![](img/494428_2_En_5_Fig10_HTML.jpg)\n\
    \n一个电子表格展示了截断值、敏感度、特异度、100-特异度和敏感度的一系列数值。从下到上，截断值范围从 5 到 10，间隔为 0.5。\n\n图 5-10\n\
    \n为 ROC 曲线设置数据\n\n现在是绘制 ROC 曲线的最后一步：\n\n16. 选中单元格区域 D25:E45。\n\n17. 点击菜单选项卡“插入”➤“图表”➤“带平滑线的散点图”。\n\
    \n18. 根据需要添加图表标题和坐标轴标题。我们的 ROC 图表可能类似于图 5-11。\n\n![](img/494428_2_En_5_Fig11_HTML.png)\n\
    \n一条敏感度相对于 100-特异度的 ROC 曲线，呈上升趋势。曲线从原点开始，大致延伸到 (95, 91) 点。\n\n图 5-11\n\nROC 曲线\n\
    \nROC 曲线下面积的大小衡量了模型的质量。面积值越大，表明模型可以同时具有良好的敏感度和特异度。在一个完美模型中，敏感度和特异度都是 100%。这意味着，当\
    \ 100-特异度等于 0 时，敏感度为 100%。换句话说，一个完美模型的 ROC 曲线会经过左上角点。然而，这种情况很少发生。\n\n文件 `Chapter5-roc-1b.xlsx`\
    \ 展示了前述练习的结果。\n\n本章到此结束。为什么我们需要在学习其他数据挖掘方法之前先学习交叉验证和 ROC 呢？嗯，一旦我们掌握了交叉验证和 ROC\
    \ 的知识，我们就可以在学习其他数据挖掘方法时实践它们。本章之后，我们将学习逻辑回归、K-近邻、朴素贝叶斯、决策树等。在某个时候，我们可能想要评估我们的模型有多好，那时我们就可以实践交叉验证和/或\
    \ ROC 曲线分析了。\n\n## 强化练习\n\n本章有两个强化练习，一个关于交叉验证，一个关于 ROC 曲线分析。建议将两个练习都完成以巩固你的理解。你应该能找到这两个强化练习对应的四个\
    \ Excel 文件：\n\n1.  Chapter5-HW-CrossValidation.xlsx\n\n2.  Chapter5-HW-CrossValidation-Answers.xlsx\n\
    \n3.  Chapter5-roc-HW.xlsx\n\n4.  Chapter5-roc-HW-withAnswers.xlsx\n\n## 复习要点\n\
    \n1.  残差分析\n\n2.  测试数据集\n\n3.  交叉验证的留出法\n\n4.  K 折交叉验证和留一法交叉验证\n\n5.  什么是 ROC\n\
    \n6.  真阳性、假阳性、真阴性和假阴性\n\n7.  敏感度和特异度\n\n8.  ROC 曲线\n\n9.  Excel 技巧和函数：\n    1.\
    \  排序\n\n    2.  散点图\n\n    3.  函数 IF、ROUND 和 MMULT\n\n# 6. 逻辑回归\n\n请从 [`https://github.com/hhohho/Learn-Data-Mining-through-Excel-2`](https://github.com/hhohho/Learn-Data-Mining-through-Excel-2)\
    \ 下载本章练习所需的示例 Excel 文件。\n"
- fmt: '# General Understanding


    Logistic regression can be thought of as a special case of linear regression when
    the predicted outcomes are categorical. If there are only two outcomes, the logistic
    regression is called binomial logistic regression which is the most popular one.
    If there are more than two outcomes, the logistic regression is called multinomial
    logistic regression. In this chapter, we are learning binomial logistic regression
    in Excel.


    Binomial logistic regression can also be thought of as a special case of LDA,
    but its mechanism of achieving good separability between data groups is different
    from that of LDA.


    The name of logistic regression comes from the fact that logistic function is
    used in the model. Equation (6-1) shows the logistic function in its general form
    (where `a`, `b`, and `c` are all positive numbers).


    ```

    f(x) = c / (1 + a * b^(-kx))

    ```


    (6-1)


    The well-known sigmoid function is a special case of the logistic function.


    ```

    s(x) = 1 / (1 + e^(-x))

    ```


    (6-2)


    Logistic regression is a statistical model, capable of estimating the probability
    of the occurrence of an event. Let 1 represent the case when the event happens
    and 0 represent the case when the event does not happen. Thus, `P(1)` is the probability
    of the event and `P(0) = 1 - P(1)`. Note, the probability must be between 0 and
    1 inclusively. Finally, `P(1) / (1 - P(1))` is the odds for the event to happen.


    Suppose the occurrence of the event is dependent on the variables `x[1]`, `x[2]`,
    ..., `x[n]`. In logistic regression, it is believed that the log of the odds is
    a linear function of `x[i]`, as depicted in Equation (6-3).


    ```

    ln(P(1) / (1 - P(1))) = m1 * x1 + m2 * x2 + ... + mn * xn + b

    ```


    (6-3)


    Solving for `P(1)`, we can get the logistic function as shown in Equation (6-4).


    ```

    P(1) = 1 / (1 + e^(-(m1 * x1 + m2 * x2 + ... + mn * xn + b)))

    ```


    (6-4)


    Logistic regression does not maximize the probability of `P(1)` by optimizing
    the coefficients `m[1]`, `m[2]`, ..., `m[n]`, `b` (here, let’s take `b` as a coefficient;
    later we will know that `b` is also called “bias” in machine learning community).
    Instead, it tries to maximize the likelihood associated with each data sample.
    What then is likelihood? Simply speaking, likelihood is the probability of a sample
    to match the actual event outcome (either 1 or 0). Still confused? Let me use
    one example to explain what is likelihood.


    Assume there are two data records A and B in the training dataset. A has the event
    happened, that is, its event outcome is 1, and B does not have the event happened,
    that is, its event outcome is 0. Through the logistic function, the `P(1)` for
    A and the `P(1)` for B are calculated as 0.8 and 0.6, respectively. Because A’s
    actual event outcome is 1, A’s likelihood is then its probability for the event
    to happen, that is, `P(1)` which is 0.8. On the other hand, because B’s actual
    outcome is 0, its likelihood is its probability for the event not to happen, that
    is, its matching event outcome becomes 0. Thus, B’s likelihood is `P(0)` instead
    of `P(1)`, and `P(0) = 1 - P(1) = 0.4`.


    Logistic regression tries to maximize the likelihoods of all samples as a whole.
    By maximizing the likelihoods, logistic regression achieves good separability
    between two groups. In implementation, it is common to use the logarithm of a
    likelihood, either natural logarithm or base 10 logarithm. The advantage of logarithm
    lies in the fact that it decreases rapidly when the predicted likelihood diverges
    from the actual event outcome, regardless if the actual event outcome is 1 or
    0. Because when the likelihood is 0, the calculation of `log(0)` will result in
    an error. Thus, `log(0)` is treated as a predefined minimum number.


    In implementation, logistic regression can also be achieved by minimizing the
    log loss of likelihoods. The log loss is the negation of the log of a likelihood.
    Thus, when the actual outcome is 1, the log loss is computed as `-log(P(1))`,
    and when the actual outcome is 0, the log loss is computed as `-log(1 - P(1))`.
    Here, `log(0)` is treated as a predefined maximum number. Note, the log loss increases
    rapidly when the predicted likelihood diverges from the actual event outcome.
    Figure 6-1 shows the log loss when the event outcome is 1. Here, the `log(0)`
    is predefined as 0.000001.


    A line graph of log loss versus predicted probability represents a decreasing
    trend. The line passes through the coordinates of (0, 6), (0.2, 0.8), (0.4, 0.5),
    (0.6, 0.2), and (0.8, 0.1). Values are approximate.


    **Figure 6-1** The calculation of log loss when event = 1


    With this understanding, our approach of logistic regression is to use linear
    regression to obtain a set of coefficients first, then apply Solver to optimize
    these coefficients by either maximizing the likelihoods as a whole or minimizing
    the log loss as a whole.


    # Learn Logistic Regression Through Excel


    Data inside the two files `Chapter6-1a.xlsx` and `Chapter6-2a.xlsx` are the same.
    They simulate the following scenario:


    > *Suppose there are five genes whose expression levels can be used to predict
    the five-year survival probability of patients with a certain cancer disease.
    Value 1 indicates the patient did survive five years, and 0 means they did not.*


    As stated earlier, in our logistic regression practices, we are going to apply
    Solver to optimize the model parameters (coefficients) by either maximizing the
    likelihoods as a whole or minimizing the log loss as a whole.'
