  trans: '

    到目前为止，我们的 `testing_dataset` 工作表应如图 5-3 所示。上述过程将训练数据集获得的参数集（包括系数、截距和分界点）应用于测试数据集，并比较了实际的鸢尾花类型（A
    列）与预测类型（H 列）。有两个样本预测错误。由于训练数据集和测试数据集之间没有共同的数据点，因此通过测试数据集进行的这种验证是真正的交叉验证。


    ![](img/494428_2_En_5_Fig4_HTML.jpg)


    电子表格展示了 K、L、M、N 列下的一组数值。这些数值包括由求解器获取的 b、w1、w2、w3、w4，经 LINEST 优化的结果、均值、样本数、分界点、差值、组间方差、组内方差以及组间与组内方差比。


    图 5-4

    在训练数据集中通过求解器获得的参数集


    1.  我们当然可以进一步优化 `training_dataset` 工作表中的 LDA 模型。按照上一章学到的步骤，将求解器应用于训练数据集。


    回顾上一章，使用求解器优化模型后，“组间方差”显著减小。然而，在处理这个较小的训练数据集时，应用求解器优化模型后，“组间方差”显著增大。这是一个很好的例子，说明数据样本在数据挖掘中确实很重要。部分结果如图
    5-4 所示。


    1.  将参数集应用于测试子集（将 `training_dataset` 工作表中经求解器优化的 M5:M9 单元格的值复制到 `testing_dataset`
    工作表中）。


    2.  在 L16 单元格中输入“交叉验证遗漏数 =”。在 L17 单元格中输入“交叉验证准确率 =”，并在 M17 单元格中输入公式 =1-M16/47。我们的结果如图
    5-5 所示。


    ![](img/494428_2_En_5_Fig5_HTML.jpg)


    电子表格展示了类型分类、差值、b、w1、w2、w3、w4（经求解器优化）、均值、样本数和分界点的值。底部高亮显示的交叉验证遗漏数和交叉验证准确率的值分别为
    1 和 97.87%。


    图 5-5

    使用测试数据集进行交叉验证


    完整结果可在文件 `Chapter5-cv-1b.xlsx` 中找到。


    请记住，在交叉验证中，仅使用原始训练数据集的一部分来构建模型，而其余部分则用于测试模型性能。一旦确认数据挖掘方法（例如 LDA）具有可接受的性能，最好基于整个原始训练数据集，使用
    LDA 方法生成最终模型（或参数集）。


    ## ROC 分析概述


    受试者工作特征（ROC）曲线分析是另一种常用的评估模型性能的方法。与交叉验证不同，ROC 分析仅适用于目标变量恰好有两个不同值的情况，例如真与假，或阳性与阴性。因此，ROC
    分析不能用于评估前述的鸢尾花数据集 LDA 模型。


    ROC 分析广泛应用于生物医学模型评估中，其中诊断测试必须确定样本对于某种疾病是阳性还是阴性。以下场景有助于解释 ROC 分析的应用。


    假设我们的研究发现某些血液特征与识别某种特定疾病有很好的相关性。我们将这些特征命名为 C1、C2、C3 和 C4，将疾病命名为 D。我们基于 C1、C2、C3
    和 C4 开发了一个 LDA 模型，用于判断患者是否患有该疾病。一个完美的模型能够在大量人群中清晰地区分患病组和未患病组。不幸的是，由于分类错误，现实中并不存在清晰的区分。在患病组中，有些人被正确分类为阳性（真阳性，或
    TP），而有些人被错误分类为阴性（假阴性，或 FN）。类似地，在未患病组中，有些人被正确分类为阴性（真阴性，或 TN），而有些人被错误分类为阳性（假阳性，或
    FP）。通过调整分界点或其他相关的评估指标，TP、FN、FP 和 TN 的数量会发生变化。


    以下概念对于理解和应用 ROC 分析至关重要：


    *   **灵敏度** 是指当疾病存在时，测试结果为阳性的概率。它也被称为真阳性率，定义为 TP / (TP + FN)。它仅衡量测试能够正确分类的患病个体的百分比。


    *   **特异度** 是指当疾病不存在时，测试结果为阴性的概率。它也被称为真阴性率，计算公式为 TN / (TN + FP)。它仅衡量测试能够正确分类的未患病个体的百分比。


    *   **假阳性率** 是指当疾病不存在时，测试结果为阳性的概率。假阳性率 = 1 - 特异度。


    *   **阳性预测值** 是指当测试结果为阳性时，疾病存在的概率，表示为 TP / (TP + FP)。


    *   **阴性预测值** 是指当测试结果为阴性时，疾病不存在的概率，表示为 TN / (TN + FN)。


    考虑一种极端情况：测试将每个个体都判定为阳性。在这种情况下，FN = 0 且 TN = 0，特异度 = 0，但灵敏度 = 100%。


    在另一种极端情况下，当测试将每个个体都判定为阴性时，特异度 = 100%，而灵敏度 = 0。


    通过调整分界点，灵敏度和特异度都会发生变化。在大多数情况下，我们会观察到当灵敏度上升时，特异度会下降。一个好的模型会有一个分界点，使得灵敏度和特异度都保持较高水平。然而，某些测试可能更强调高阳性预测值或高阴性预测值。

