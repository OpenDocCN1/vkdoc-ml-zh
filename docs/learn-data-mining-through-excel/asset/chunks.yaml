    # 9. 朴素贝叶斯分类


    我们一直在学习的数据挖掘方法都偏好数值型数据：线性回归、LDA、k-means 聚类、逻辑回归、K-NN 和层次聚类。然而，朴素贝叶斯偏好分类型数据。由于其简单性，朴素贝叶斯数据挖掘方法比许多其他数据挖掘方法效率高得多，而其性能仍能与大多数其他数据挖掘方法相媲美。


    请从 [`https://github.com/hhohho/Learn-Data-Mining-through-Excel-2`](https://github.com/hhohho/Learn-Data-Mining-through-Excel-2)
    下载本章练习所需的示例 Excel 文件。


    ## 总体理解


    数据挖掘方法或机器学习模型通常被认为是概率方法/模型。概率计算从训练数据集开始。一个基本原则是，如果属性或目标变量的特定状态 *S*[*k*] 在给定条件下出现的概率为
    *P*[*k*]，那么可以假设在评分数据集的相同条件下，*S*[*k*] 出现的概率仍然是 *P*[*k*]。当你阅读本章以及其他章节（如关联分析和决策树）时，你会发现这个原则的隐含应用，尽管我可能明确提及也可能不提及。


    朴素贝叶斯是最常用的分类算法之一。其数学基础是条件概率，它提出了这样一个问题：在给定 x 发生的情况下，事件 y 发生的概率是多少？这里，条件是 x（x 发生或
    x 为真），条件概率表示为 *P*(*y*|*x*)。


    条件概率 *P*(*y*|*x*) 的计算公式为


    ![$$ P\left(\left.y\right|x\right)=\frac{P\left(y\cap x\right)}{P(x)}, $$](img/494428_2_En_9_Chapter_TeX_Equ1.png)


    (9-1)


    其中 *P*(*x*) 表示 x 为真的概率，*P*(*y* ∩ *x*) 表示 x 和 y 同时为真的概率。


    类似地，条件概率 *P*(*x*|*y*) 的计算公式为


    ![$$ P\left(\left.x\right|y\right)=\frac{P\left(x\cap y\right)}{P(y)}, $$](img/494428_2_En_9_Chapter_TeX_Equ2.png)


    (9-2)


    因为 *P*(*y* ∩ *x*)= *P*(*x* ∩ *y*)，所以我们有 *P*(*y*|*x*)*P*(*x*) = *P*(*x*|*y*)*P*(*y*)。因此，我们可以推导出最简单的贝叶斯定理，如公式
    (9-3) 所述：


    ![$$ P\left(\left.y\right|x\right)=\frac{P\left(\left.x\right|y\right)P(y)}{P(x)},
    $$](img/494428_2_En_9_Chapter_TeX_Equ3.png)


    (9-3)


    注意，贝叶斯定理将 *P*(*y*|*x*) 的计算转换为 *P*(*x*|*y*) 的计算。


    公式 (9-3) 隐含地假设 y 是因变量 y 的研究类别，x 是自变量 x 的研究状态。这可能有点令人困惑，因为 y 必须有多个类别，x 必须有多个状态。别担心，请继续阅读，你会对贝叶斯定理有清晰的理解。


    假设 y 有两个类别 y[1] 和 y[2]，让我们针对特定条件 x[a]（假设 x 有不同的状态/条件，x[a] 是其中之一）下的 y[1] 重写公式 (9-3)，我们得到


    ![$$ P\left(\left.{y}_1\right|{x}_a\right)=\frac{P\left(\left.{x}_a\right|{y}_1\right)P\left({y}_1\right)}{P\left({x}_a\right)},
    $$](img/494428_2_En_9_Chapter_TeX_Equ4.png)


    (9-4)


    对 y[2] 重复上述操作，我们得到


    ![$$ P\left(\left.{y}_2\right|{x}_a\right)=\frac{P\left(\left.{x}_a\right|{y}_2\right)P\left({y}_2\right)}{P\left({x}_a\right)},
    $$](img/494428_2_En_9_Chapter_TeX_Equ5.png)


    (9-5)


    因为 y 只有两个类别，在条件 x[a] 下，要么 y[1] 发生，要么 y[2] 发生，即 *P*(*y*[1]|*x*[*a*]) + *P*(*y*[2]|*x*[*a*])
    必须等于 1。因此，


    ![$$ \frac{P\left(\left.{x}_a\right|{y}_1\right)P\left({y}_1\right)}{P\left({x}_a\right)}+\frac{P\left(\left.{x}_a\right|{y}_2\right)P\left({y}_2\right)}{P\left({x}_a\right)}=1
    $$](img/494428_2_En_9_Chapter_TeX_Equa.png)


    即，*P*(*x*[*a*]) = *P*(*x*[*a*]|*y*[1])*P*(*y*[1]) + *P*(*x*[*a*]|*y*[2])*P*(*y*[2])。因此，我们最终可以得到


    ![$$ P\left(\left.{y}_1\right|{x}_a\right)=\frac{P\left(\left.{x}_a\right|{y}_1\right)P\left({y}_1\right)}{P\left(\left.{x}_a\right|{y}_1\right)P\left({y}_1\right)+P\left(\left.{x}_a\right|{y}_2\right)P\left({y}_2\right)}
    $$](img/494428_2_En_9_Chapter_TeX_Equ6.png)


    (9-6)

