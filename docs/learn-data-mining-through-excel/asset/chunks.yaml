    \ look like Figure [11-3](#494428_2_En_11_Chapter.xhtml#Fig3).\n\n![](images/494428_2_En_11_Chapter/494428_2_En_11_Fig3_HTML.jpg)\n\
    \nAn Excel spreadsheet with variances after numerical attributes are normalized.\n\
    \nFigure 11-3\n\nThe variances after numerical attributes are normalized into\
    \ the range 0–100\n\n5.  Value range of each numerical attribute:\n\nThe value\
    \ range usually indicates the largest and smallest values of a numerical attribute.\
    \ We can apply the Excel function MAX and MIN to obtain the largest and smallest\
    \ values of each numerical attribute. The value range can help identify outliers\
    \ and data anomalies.\n\n6.  Unique values of categorical target and attributes:\n\
    \nTo obtain the unique values of categorical attributes, we can make use of the\
    \ Excel built-in feature “Remove Duplicates”. Before we remove duplicates for\
    \ each categorical attribute, we’d better make a copy of the worksheet crx and\
    \ rename the new worksheet crx3.\n\nInside the crx3 worksheet, please click the\
    \ column letter G ➤ click the Data tab ➤ select Remove Duplicates ➤ on the upcoming\
    \ menu, select the option “Continue with the current selection” and then click\
    \ the button “Remove Duplicates…”. This is shown in Figure [11-4](#494428_2_En_11_Chapter.xhtml#Fig4).\n\
    \n![](images/494428_2_En_11_Chapter/494428_2_En_11_Fig4_HTML.jpg)\n\nAn Excel\
    \ spreadsheet explains how to open the remove duplicates warning window. The steps\
    \ are as follows. Data, column G, Remove Duplicates, and then choose the appropriate\
    \ option.\n\nFigure 11-4\n\nSelect Remove Duplicates\n\nAnother small menu shows\
    \ up. Follow the instruction in Figure [11-5](#494428_2_En_11_Chapter.xhtml#Fig5)\
    \ to click the OK button. Finally, a last small menu appears which tells us that\
    \ there are “680 duplicates found and removed; 11 unique values remain.”\n\n![](images/494428_2_En_11_Chapter/494428_2_En_11_Fig5_HTML.jpg)\n\
    \nA screenshot of the Remove Duplicates window. The My data has headers checkbox\
    \ is enabled.\n\nFigure 11-5\n\nMake sure that “My data has headers” is checked\n\
    \nThese actions removed the duplicates for attribute A7\\. We need to repeat these\
    \ actions on all other categorical attributes and the target.\n\nInterestingly,\
    \ you will realize that some attributes have the value “?” inside. Well, the question\
    \ mark symbol “?” is commonly used to represent a missing value. So, those “?”\
    \ in the crx3 worksheet indicates that there are missing values in the corresponding\
    \ attributes. We will talk about missing values soon.\n\n7.  Class distribution\
    \ of the target:"
  trans: "\n## 通过 Excel 学习探索性数据分析\n\n一个典型的数据挖掘项目通常从业务理解和数据理解开始，因为我们需要清楚要解决什么问题以及需要哪些数据。下一个阶段是数据准备，在此阶段我们收集和准备数据。正是在数据准备阶段，我们进行探索性数据分析和数据清洗任务。\n\
    \n关键词“探索性”表明 EDA 指的是初步调查，以便我们了解关于数据的以下信息：\n\n*   记录数量\n*   属性数量\n*   每个属性的数据类型\n\
    *   每个数值属性的总和、均值、中位数和方差\n*   每个数值属性的取值范围\n*   分类目标和属性的唯一值\n*   目标的类别分布\n*   是否存在缺失数据\n\
    *   数据异常等\n\nExcel 非常适合进行 EDA，因为工作表中的数据直接可见，并且 Excel 拥有许多函数和内置功能，可以轻松完成汇总统计操作和异常检测。请打开\
    \ Chapter11-1a.xlsx，该文件展示了由 Chiharu Sano 贡献给 UCI 机器学习仓库的一个数据集。你会注意到，在名为“crx”的工作表中，有\
    \ 15 个属性和一个目标变量，如图 11-1 所示。\n\n![](img/494428_2_En_11_Fig1_HTML.jpg)\n\n一个 Excel\
    \ 工作表包含 15 个属性和一个目标变量。\n\n图 11-1\n\nExcel 提供了数据集的直接可视化视图\n\n让我们在此工作表中逐一完成前面列出的探索性操作。\n\
    \n1.  **记录数量：**\n\n由于数据集在 Excel 中，你可以轻松滚动到底部，发现共有 691-1 = 690 条记录。如果数据集规模过大，你可以在单元格\
    \ Q2 中输入公式 `=COUNTA(P:P) - 1` 来获取记录数量。COUNTA 函数用于计算一个区域中非空单元格的数量。由于属性内部可能存在空单元格，因此统计目标值的数量是确认记录数量的可靠方法。\n\
    \n2.  **属性数量：**\n\n由于 Excel 允许我们直接查看数据，我们可以轻松判断 Excel 工作表中数据集的属性数量。如果你想使用公式，请在单元格\
    \ Q1 中输入 `=COUNTA(A1:P1)`。因此，共有 15 个属性和一个目标（标签）。\n\n3.  **每个属性的数据类型：**\n\n通过 Excel\
    \ 工作表，我们可以直观地看出属性 A1、A4–A7、A9、A10、A12 和 A13 以及目标变量是分类文本数据，而 A2、A3、A8、A11、A14 和\
    \ A15 是数值数据。\n\n4.  **每个数值属性的总和、均值、中位数和方差：**\n\n当然，我们可以对列 A2、A3、A8、A11、A14 和 A15\
    \ 应用 SUM、AVERAGE 和 MEDIAN 函数来获取它们的总和、均值和中位数。这里无需演示如何实现。\n\n对于这些数值属性的方差，我们需要应用\
    \ VAR.P 函数，该函数计算总体方差。总体方差的计算公式为 ![$$ \\frac{\\sum \\limits_{i=1}^n{\\left({x}_i-\\\
    overline{x}\\right)}²}{n} $$](img/494428_2_En_11_Chapter_TeX_IEq1.png)。由于只有 690\
    \ 条记录，我们可以滚动到工作表底部，在单元格 A692 中输入公式 `=IFERROR(VAR.P(A2:A691), \"\")`，然后自动填充到单元格\
    \ O692。使用 IFERROR 函数是为了处理非数值属性。注意，如果记录数量很大，我们当然可以在属性名称上方插入一行来计算和存储方差。此时，工作表的一部分应如图\
    \ 11-2 所示。注意，单词“Variance”已添加到单元格 Q692 中，以标记第 692 行。\n\n![](img/494428_2_En_11_Fig2_HTML.jpg)\n\
    \nExcel 工作表的截图展示了第 692 行中的数值属性方差。\n\n图 11-2\n\n数值属性的方差存储在第 692 行\n\n默认情况下，方差并非在同一尺度上计算，因此你会注意到属性\
    \ A15 的方差最大。有时，方差是在所有属性归一化到相同范围后计算的。我将在解释特征选择时详细讨论归一化问题。这里，让我们将所有数值属性归一化到 0–100\
    \ 的范围。\n\n为了在 0–100 的相同尺度上计算方差，让我们复制当前工作表并将新工作表重命名为 crx2。在 crx2 工作表的单元格 A2 中，输入以下公式：\n\
    \n```\n    =IFERROR((crx!A2-MIN(crx!A$2:A$691))/(MAX(crx!A$2:A$691)-MIN(crx!A$2:A$691))*100,\
    \ crx!A2)\n    ```\n\n此公式在处理 crx 工作表中的相应数据项后，将其放入单元格 A2。IFERROR 函数确保如果列 A 的数据不是数值，则会出错，因此\
    \ crx!A2 处的数据将直接放入单元格 A2 而不进行归一化。如果列 A 的数据是数值，则它将 crx!A2 中的数据值归一化到 0–100 的闭区间内。\n\
    \n从 A2 自动填充到 O2，然后一起自动填充到 A691:O691，我们将得到归一化数据的方差，这表明最大的方差在属性 A2 中。crx2 工作表的一部分应如图\
    \ 11-3 所示。\n\n![](img/494428_2_En_11_Fig3_HTML.jpg)\n\n一个 Excel 电子表格，显示了数值属性归一化后的方差。\n\
    \n图 11-3\n\n数值属性归一化到 0–100 范围后的方差\n\n5.  **每个数值属性的取值范围：**\n\n取值范围通常表示数值属性的最大值和最小值。我们可以应用\
    \ Excel 函数 MAX 和 MIN 来获取每个数值属性的最大值和最小值。取值范围有助于识别异常值和数据异常。\n\n6.  **分类目标和属性的唯一值：**\n\
    \n要获取分类属性的唯一值，我们可以利用 Excel 的内置功能“删除重复项”。在为每个分类属性删除重复项之前，最好先复制 crx 工作表并将新工作表重命名为\
    \ crx3。\n\n在 crx3 工作表中，请点击列字母 G ➤ 点击“数据”选项卡 ➤ 选择“删除重复项” ➤ 在弹出的菜单中，选择“以当前选定区域排序”选项，然后点击“删除重复项…”按钮。如图\
    \ 11-4 所示。\n\n![](img/494428_2_En_11_Fig4_HTML.jpg)\n\n一个 Excel 电子表格解释了如何打开删除重复项警告窗口。步骤如下：数据、列\
    \ G、删除重复项，然后选择适当的选项。\n\n图 11-4\n\n选择“删除重复项”\n\n另一个小菜单出现。按照图 11-5 中的说明点击“确定”按钮。最后，出现一个小菜单，提示“已找到并删除\
    \ 680 个重复项；保留 11 个唯一值。”\n\n![](img/494428_2_En_11_Fig5_HTML.jpg)\n\n“删除重复项”窗口的截图。已勾选“数据包含标题”复选框。\n\
    \n图 11-5\n\n确保勾选了“数据包含标题”\n\n这些操作删除了属性 A7 的重复项。我们需要对所有其他分类属性和目标重复这些操作。\n\n有趣的是，你会注意到某些属性内部包含值“？”。嗯，问号符号“？”通常用于表示缺失值。因此，crx3\
    \ 工作表中的那些“？”表示相应属性中存在缺失值。我们稍后将讨论缺失值。\n\n7.  **目标的类别分布：**\n"
- fmt: 'Once we have the unique values of the target available in the worksheet `crx3`,
    we can easily acquire the class distribution of the target. Inside the `crx3`
    worksheet, enter the formula `=COUNTIFS(crx!P2:P691, P2)` inside `R2` and then
    autofill to `R3`. We can immediately tell that there are 307 and 383 data points
    for the two classes “+” and “-”, respectively.


    A well-balanced dataset should have balanced classes, that is, all the classes
    should have about the same number of data points. In this specific case, the two
    classes weigh about 44.5% and 54.5%, which could be considered well balanced.


    What if a dataset has imbalanced classes? If something like this happens, you
    should try your best to increase the data points for the underrepresented class
    or classes. If the data size is large enough, you can also decrease the data points
    of the overrepresented class or classes. In the worst case when you cannot change
    the imbalance at all, you then should make sure that your machine learning model
    is sensitive enough on the underrepresented class or classes.


    ## 8. If there are any missing data:


    Missing values can exist in different forms, such as empty space or the question
    mark “?”. The preceding action to remove duplicates helps us identify unusual
    categorical values which are missing values. For empty spaces, we can make use
    of the function `COUNTBLANK` to count them.


    Go back to the worksheet `crx`, enter `=COUNTBLANK(A2:A691)` inside `A693`, and
    then autofill to `P693`. Fortunately, we do not have any empty spaces in our dataset.


    To count how many missing values marked by “?” in each attribute, enter `=COUNTIFS(A2:A691,
    "~?")` inside `A694` and then autofill to `P694`. Be aware that the question mark
    “?” is a special character in Excel. Therefore, to insert a literal “?” in this
    formula, we must prefix it with “~”.


    The complete result is in `Chapter11-1b.xlsx`. Observe that words “Variance”,
    “Blank Cells”, and “Missing Data” are inside cells `Q692`, `Q693`, and `Q694`.
    These words are for explanation.


    ## 9. Data anomalies:


    Data anomaly is different from outlier. Outliers are valid but their values are
    outside of the normal range. It is a difficult call if we should keep or drop
    the outlier data records.


    Data anomaly references unexpected data or data inconsistence, either an undesired
    data type or a data value out of range. Generally speaking, when we collect data,
    we should be aware of the desired data type and data range for each attribute;
    otherwise, we won’t have a standard to distinguish unexpected data values. For
    numerical data, we can use the `IF` function to identify any numerical value outside
    the desired range. For undesired data types, there are other functions to take
    care of them.


    To practice data anomaly detection, open `Chapter11-2a.xlsx` in which I specifically
    created some data anomalies. Let’s assume that we know the desired data types
    and ranges for each attribute. Specifically, the values must be >= 0 for numerical
    attributes.


    Again, we will make a copy of the existing worksheet `crx` and rename the new
    worksheet `crx2`.


    Inside worksheet `crx2`, enter `=IF(ISNONTEXT(crx!A2), "N", "")` in `A2`. Since
    we know that the data type must be alphabet for attribute `A1`, the function `ISNONTEXT`
    is used to determine if the corresponding value inside the worksheet `crx` is
    non-text. If it is, “N” is displayed; otherwise, nothing will be displayed in
    cell `A2`. Autofill from `A2` to `A691` by double-clicking on the lower right
    corner of the cell `A2`.


    For attributes `A2` and `A3`, we know that they must be numerical values and they
    cannot be less than 0. Thus, enter `=IF(ISTEXT(crx!B2), "T", IF(crx!B2<0, "F",
    ""))` in `B2` and autofill to `C2`, then autofill together to `B691:C691`. We
    will immediately notice “F” in `C6` and “T” in `C8` because this formula returns
    “T” if `crx!B2` contains text; else returns “F” if `crx!B2 <0`; else displays
    nothing in `B2`.


    Enter `=IF(ISNONTEXT(crx!D2), "N", "")` in `D2` and autofill to `D691`; we will
    also find “N” displayed in `D15`.


    I hope you have realized the advantage of making copies of the original worksheet.
    Certainly, when there is “F”, “T”, or “N” showing up in cells `C6`, `C8`, and
    `D15`, respectively, inside the worksheet `crx2`, we immediately become knowledgeable
    that there are data anomalies at the exact same locations (`C6`, `C8`, and `D15`)
    inside the original worksheet `crx`.


    At this point, part of our worksheet `crx2` should look like Figure [11-6](#494428_2_En_11_Chapter.xhtml#Fig6).


    ![](images/494428_2_En_11_Chapter/494428_2_En_11_Fig6_HTML.jpg)


    An Excel spreadsheet displays unexpected data in C 6, C 8, and D 15 cells.


    **Figure 11-6** Cells `C6`, `C8`, and `D15` display unexpected data values


    There are more unexpected data inside the worksheet. I would like to leave for
    you to finish the rest attributes. Note, you can certainly make use of different
    Excel functions to achieve the same purpose.


    The completed result is available in `Chapter11-2b.xlsx`. Because the preceding
    anomaly detection process is pretty tedious, there is another file `Chapter11-2c.xlsx`
    in which only one formula is needed for all attributes. Please take a look.'
