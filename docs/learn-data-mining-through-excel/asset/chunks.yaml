- fmt: '### IF Function Series


    The `IF` statement is said to be the most used statement in programming, and this
    saying is also true in our learning data mining through Excel effort. As we are
    going to make use of the function `IF` and other `IF`-related functions very often,
    it is a good idea for us to get some basic understanding of them first.


    This book comes with a number of sample Excel files. We are going to make use
    of them often. These files are available at [`https://github.com/hhohho/Learn-Data-Mining-through-Excel-2`](https://github.com/hhohho/Learn-Data-Mining-through-Excel-2).
    These Excel files are examples designed for different data mining practices. There
    are two ways to download them:


    1. Download them together as a compressed file and decompress them into a folder
    (directory) on your computer.

    2. Download them based on individual chapters.


    After downloading, open the file `Chapter1-1a.xlsx`. Our worksheet looks like
    Figure [1-11](#494428_2_En_1_Chapter.xhtml#Fig11). If you want, you can enter
    the data manually in a blank worksheet, too.


    ![](images/494428_2_En_1_Chapter/494428_2_En_1_Fig11_HTML.jpg)


    *An Excel screenshot. Name, season, sales, and commissions are the data in cells
    A1, B1, C1, and D1. Columns A, B, and C contain data.*


    **Figure 1-11** The performances of some sales representatives


    Our first task is to compute the commissions for each sales representative. The
    commission is calculated in this way:


    1. Any sale amount lower or equal to $50000 has no commission.

    2. The sale amount more than $50000 but less than or equal to $100000 gains 10%
    commission.

    3. The sale amount more than $100000 gains 20% commission.


    Our formula to compute the commissions is based on the `IF` function. Enter the
    following formula in cell `D2`:


    ```

    =IF(C2<=50000,0,IF(C2<=100000,(C2-50000)*10%,50000*0.1+(C2-100000)*20%))

    ```


    `IF` function has the basic form: `IF(boolean-expression, true-value, false-value)`.
    In our formula, if the sales in `C2` are no more than 50000, 0 is returned. However,
    when `C2` is more than 50000, a nested `IF` function is used here as we have two
    more conditions to assess.


    In the inner `IF` function, if `C2<=100000`, the amount more than 50000 is multiplied
    by 0.1 (10%) and returned. Otherwise, `C2` must be more than 100000, and therefore
    the calculated result of the expression `50000*0.1+(C2-100000)*20%)` is returned.


    Our worksheet looks exactly like Figure [1-12](#494428_2_En_1_Chapter.xhtml#Fig12).


    ![](images/494428_2_En_1_Chapter/494428_2_En_1_Fig12_HTML.jpg)


    *An Excel screenshot. The data in A1, B1, C1, and D1 correspond to name, season,
    sales, and commissions. All the cells contain data.*


    **Figure 1-12** Commissions calculated by using the `IF` function


    What if we want to count how many sales representatives have sales between 50000
    and 100000 in season 1? To answer this question, we need to apply the function
    `COUNTIFS`. In Excel, there is another function named `COUNTIF`. `COUNTIFS` is
    capable of every task that `COUNTIF` is capable of, and there are many tasks for
    which we must use `COUNTIFS` instead of `COUNTIF`.


    The explanation of `COUNTIFS` from Microsoft Office Support states “The `COUNTIFS`
    function applies criteria to cells across multiple ranges and counts the number
    of times all criteria are met.” Its syntax is like `COUNTIFS(criteria_range1,
    criteria_1, criteria_range2, criteria_2, …)`. Based on this understanding, enter
    the following formula in cell `E1`:


    ```

    =COUNTIFS(B2:B10,1,C2:C10,">50000",C2:C10,"<=100000")

    ```


    This formula makes sure that:


    - In cell range `B2:B10`, the season is 1.

    - And in cell range `C2:C10`, the sales are >50000. Note the criteria is placed
    inside a pair of double quotation marks.

    - And in cell range `C2:C10`, the sales are <=100000.


    The answer in cell `E1` must be 2.


    We want to examine the total sales and probably the averaged sales for every sales
    representative. For this purpose, we need to set up a table. Follow these instructions
    to set up the table:


    ![](images/494428_2_En_1_Chapter/494428_2_En_1_Fig13_HTML.jpg)


    *An Excel screenshot. The data tab is selected. Cells F1 to F10 are selected.
    The remove duplicates function in the main tab is selected.*


    **Figure 1-13** Select the Remove Duplicates feature


    1. Copy cells `A1:A10` to `F1:F10`. Select cells `F1:F10`; follow instructions
    in Figure [1-13](#494428_2_En_1_Chapter.xhtml#Fig13) to select Remove Duplicates
    (click main tab Data ➤ click the icon for Remove Duplicates).


    ![](images/494428_2_En_1_Chapter/494428_2_En_1_Fig14_HTML.jpg)


    *A screenshot of the remove duplicates warning window. Continue with the current
    selection is selected. The option to remove duplicates is selected.*


    **Figure 1-14** Continue with the current selection


    2. A small menu may show up like Figure [1-14](#494428_2_En_1_Chapter.xhtml#Fig14).
    Make sure to select “Continue with the current selection”. Click the button Remove
    Duplicates.


    ![](images/494428_2_En_1_Chapter/494428_2_En_1_Fig15_HTML.jpg)


    *A screenshot of the remove duplicates window. The checkbox my data has headers
    is selected. The check box name under the columns section is selected.*


    **Figure 1-15** My data has headers


    3. Check “My data has headers” as shown in Figure [1-15](#494428_2_En_1_Chapter.xhtml#Fig15).

    4. Click OK on the upcoming small menu.

    5. Enter the text “Yearly Sales” in cell `G1` and “Average Sales” in cell `H1`.


    Our worksheet should look like Figure [1-16](#494428_2_En_1_Chapter.xhtml#Fig16).


    ![](images/494428_2_En_1_Chapter/494428_2_En_1_Fig16_HTML.jpg)


    *An Excel screenshot. The column headers in row 1 are name, season, sales, commissions,
    2, name, yearly sales, and average sales. Cells A2 through D10 have data. Data
    in the columns F, G, and H are highlighted.*


    **Figure 1-16** Table setup


    For yearly sales computation, we need to use the function `SUMIFS`. Again, there
    is another function named `SUMIF`. The syntaxes of these two functions are different
    and could cause confusion. As `SUMIFS` can accomplish anything `SUMIF` can do,
    let’s stick to `SUMIFS` for simplicity.


    1. `SUMIFS` has the syntax `SUMIFS(sum_range, criteria_range1, criteria1, criteria_range2,
    criteria2, …)`. Based on this understanding, enter the following formula in cell
    `G2`:


    ```

    =SUMIFS(C$2:C$10,A$2:A$10,F2)

    ```


    The preceding formula works this way: in the array `A2:A10`, cells `A2`, `A7`,
    `A9`, and `A10` equal `F2` (“Amie”); thus, their corresponding cells in the array
    `C2:C10` are summed, that is, cells `C2`, `C7`, `C9`, and `C10` are summed. Observe
    the use of absolute cell references in the formula because we are going to autofill
    from cell `G2` to `G5`.


    2. Autofill from cell `G2` to cell `G5`.

    3. Enter the following formula in cell `H2` (here you can use either `AVERAGEIF`
    or `AVERAGEIFS`, they have similar syntax):


    ```

    =AVERAGEIFS(C$2:C$10,A$2:A$10,F2)

    ```


    4. Autofill from cell `H2` to cell `H5`.


    Our worksheet looks exactly like Figure [1-17](#494428_2_En_1_Chapter.xhtml#Fig17).
    The complete result is available in `Chapter1-1b.xlsx`.


    ![](images/494428_2_En_1_Chapter/494428_2_En_1_Fig17_HTML.jpg)


    *An Excel screenshot. The column headers in row 1 are name, season, sales, commissions,
    2, name, yearly sales, and average sales. Cells A2 through D10 and F2 through
    F5 have data.*


    **Figure 1-17** The use of functions `SUMIFS` and `AVERAGEIFS`


    Beware that since Office 2019 or Microsoft 365, Excel adds two more functions
    into the `IF`-function family: `MAXIFS` and `MINIFS`. Their syntaxes are very
    much similar to those of `COUNTIFS`, `SUMIFS`, and `AVERAGEIFS`.


    Another two Excel features used often in data preparation are data import and
    export. To export data in Excel is fairly simple. For example, click File ➤ Save
    As ➤ select CSV to export the current worksheet into a file in CSV format. Note,
    CSV format is probably the most used file format for data science. Here, CSV represents
    “comma-separated values.”'
