  trans: "\n### 练习 1\n\n文件 Chapter9-1a.xlsx 包含与表 9-1 所示相同的数据。其中只有十个训练样本和一个评分样本。将样本量设置得较小是为了更好地进行说明。一旦我们通过这个简单的例子积累了足够的经验，我们将处理另一个更复杂的数据集。\n\
    \n在 Chapter9-1a.xlsx 中，数据已在工作表中设置好以便于处理，如图 9-1 所示。我们需要做的是完成朴素贝叶斯分析所需的必要计算。\n\n\
    ![](img/494428_2_En_9_Fig1_HTML.jpg)\n\n一张 Excel 截图展示了朴素贝叶斯数据设置。它包含样本量、大小、数量和厚度的数据，以及一个列标题为数量、大小、数量、厚度和肺癌的表格。\n\
    \n图 9-1\n朴素贝叶斯数据设置\n\n要应用朴素贝叶斯方法预测评分记录的类别，我们首先需要基于训练数据构建模型。请遵循以下说明：\n\n![](img/494428_2_En_9_Fig2_HTML.jpg)\n\
    \n一张 Excel 截图展示了部分朴素贝叶斯分析。它包含一个列标题为“是”和“否”的表格。行标题为计数、概率、大和正常。\n\n图 9-2\n朴素贝叶斯分析部分完成\n\
    \n1.  在单元格 B1 中输入 10，因为只有十条训练记录。\n\n2.  在单元格 C3 中输入公式 `=COUNTIF($E$13:$E$22,C$2)`。这将计算目标变量“肺癌”中类别为“是”的数量。从单元格\
    \ C3 自动填充到单元格 D3。单元格 D3 存储类别为“否”的数量。\n\n3.  在单元格 C4 中输入公式 `=C$3/$B$1`，然后从单元格 C4\
    \ 自动填充到单元格 D4。单元格 C4 和 D4 分别引用 p(是) 和 p(否)。\n\n4.  在单元格 C5 中输入以下公式：\n\n```\n \
    \   =COUNTIFS($E$13:$E$22,C$2,$B$13:$B$22,$B5)/C$3\n    ```\n\n5.  从单元格 C5 自动填充到单元格\
    \ C6，然后一起自动填充到单元格 D5:D6。单元格 C5、C6、D5 和 D6 分别表示概率 p(大|是)、p(正常|是)、p(大|否) 和 p(正常|否)。回想一下，p(大|是)\
    \ 是条件概率：给定“是”的情况下，大小 = “大”的概率。\n\n此时，我们的工作表部分看起来如图 9-2 所示。\n\n![](img/494428_2_En_9_Fig4_HTML.jpg)\n\
    \n一张 Excel 截图展示了朴素贝叶斯分类。它包含一个列标题为数量、大小、数量、厚度和肺癌的表格。它有 10 行数据以及一行评分结果。\n\n图 9-4\n\
    朴素贝叶斯分类完成\n\n1.  在单元格 C7 中输入以下公式：\n\n```\n    =COUNTIFS($E$13:$E$22,C$2,$C$13:$C$22,$B7)/C$3\n\
    \    ```\n\n2.  从单元格 C7 自动填充到单元格 C8，然后一起自动填充到单元格 D7:D8。单元格 C7、C8、D7 和 D8 分别引用概率\
    \ p(过高|是)、p(低|是)、p(过高|否) 和 p(低|否)。\n\n3.  在单元格 C9 中输入以下公式：\n\n```\n    =COUNTIFS($E$13:$E$22,C$2,$D$13:$D$22,$B9)/C$3\n\
    \    ```\n\n4.  从单元格 C9 自动填充到单元格 C10，然后一起自动填充到单元格 D9:D10。单元格 C9、C10、D9 和 D10 分别引用概率\
    \ p(深|是)、p(浅|是)、p(深|否) 和 p(浅|否)。\n\n到目前为止，我们的工作表应该与图 9-3 所示相同。如果有差异，请检查单元格 C3:D10\
    \ 内的公式。\n\n![](img/494428_2_En_9_Fig3_HTML.jpg)\n\n一张 Excel 截图展示了朴素贝叶斯数据准备。它包含计数、概率、大和正常大小、过高和低数量、以及深和浅厚度的数值数据。\n\
    \n图 9-3\n朴素贝叶斯数据准备\n\n按照以下说明继续我们的朴素贝叶斯数据挖掘过程：\n\n5.  分别在单元格 F22、G22 和 H22 中输入“p’(评分|是)”、“p’(评分|否)”和“P(是|评分)”。\n\
    \n6.  在单元格 F23 中输入以下公式：\n\n```\n    =SUMIF($B$5:$B$10,$B23,C$5:C$10) * SUMIF($B$5:$B$10,$C23,C$5:C$10)\
    \ * SUMIF($B$5:$B$10,$D23,C$5:C$10)*C$4\n    ```\n\n上述公式计算了在给定类别为“是”的情况下评分记录的概率。它实现了公式\
    \ (9-7)。请注意，函数 `SUMIF` 的语法与 `SUMIFS` 不同。例如，`SUMIF($B$5:$B$10,$B23,C$5:C$10)` 仅当数组\
    \ B5:B10 中对应的单元格与单元格 B23 的值相同时，才对数组 C5:C10 中的单元格求和。如果我们想使用函数 `SUMIFS` 达到相同目的，则表达式应为\
    \ `SUMIFS(C$5:C$10,$B$5:$B$10,$B23)`。\n\n7.  从单元格 F23 自动填充到单元格 G23。单元格 G23 引用在给定类别为“否”的情况下评分记录的概率。\n\
    \n8.  在单元格 H23 中输入公式 `=F23/(F23+G23)`，该公式实现了公式 (9-8)。\n\n9.  在单元格 E23 中输入公式 `=IF(H23>0.5,\"\
    是\",\"否\")`。\n\n至此，我们完成了朴素贝叶斯分类的首次尝试。我们的结果应与图 9-4 所示相同。完整结果可在文件 Chapter9-1b.xlsx\
    \ 中找到。\n"
- fmt: '### Exercise 2


    Hopefully by now you have developed some decent understanding about how to conduct
    a Naïve Bayes classification in Excel. Let’s proceed with a more complicated example.


    Open the file `Chapter9-2a.xlsx` which contains randomly generated data similar
    to `Chapter9-1a.xlsx`. In `Chapter9-2a.xlsx`, there are 1978 samples in the training
    dataset, and there are four distinct classes for the target variable “Lung Cancer”.
    The four classes are `negative`, `stage-1`, `stage-2`, and `stage-3`. In addition,
    the three predictors all have more than two categorical values. Observe that Naïve
    Bayes method only works with categorical values. If our data values are not categorical
    but numerical, we must transform them into categorical values before applying
    Naïve Bayes classification method.


    Take a close look at the data. Part of our worksheet looks like Figure [9-5](#494428_2_En_9_Chapter.xhtml#Fig5).
    The training dataset ranges from row 34 to row 2011. The scoring dataset ranges
    from row 21 to row 30.


    ![](images/494428_2_En_9_Chapter/494428_2_En_9_Fig5_HTML.jpg)


    An Excel screenshot represents the setup. It contains row headers such as count,
    probability, extra large, large, medium, small, and none under sizes, scales 1
    to 5 under numbers, and light, grey, and dark under thicknesses. The column headers
    are negative and stages 1 to 3.


    **Figure 9-5** Setup of Exercise 2


    Follow these instructions to complete Naïve Bayes classification on the given
    dataset:


    ![](images/494428_2_En_9_Chapter/494428_2_En_9_Fig6_HTML.jpg)


    An Excel screenshot. The row headers are size, number, and thickness. The column
    headers are negative and stages 1 to 3. It contains numerical data for the different
    sizes, such as extra large, large, medium, small, and none.


    **Figure 9-6** Examine our current data


    1.  Enter the following formula in cell `C3` and then autofill from cell `C3`
    to cell `F3`:


    ```

    =COUNTIF($E$34:$E$2011,C2)

    ```


    2.  Enter the formula `=C3/$B$1` in cell `C4` and autofill from cell `C4` to `F4`.
    Cells `C4:F4` reference the probability of each class.


    3.  To compute `p(ex-large|negative)`, enter the following formula in cell `C5`:


    ```

    =COUNTIFS($B$34:$B$2011,$B5,$E$34:$E$2011,C$2)/C$3

    ```


    4.  Autofill from cell `C5` to `F5`, then autofill together to cells `C9:F9`.


    At this moment, examine if our worksheet looks similar to what is shown in Figure
    [9-6](#494428_2_En_9_Chapter.xhtml#Fig6). Depending on the number formatting,
    the last couple digits of the decimal numbers in cells `C4:F9` in our worksheet
    may be different from those in Figure [9-6](#494428_2_En_9_Chapter.xhtml#Fig6).
    Make sure that our formulas are correct before continuing.


    ![](images/494428_2_En_9_Chapter/494428_2_En_9_Fig8_HTML.jpg)


    An Excel screenshot represents the scoring data. It contains a table with the
    column headers sample I d, size, number, thickness, and lung cancer. It has the
    probability computation on the right.


    **Figure 9-8** Computing probabilities for scoring dataset


    1.  To compute `p(scale-1|negative)`, enter the following formula in cell `C10`:


    ```

    =COUNTIFS($C$34:$C$2011,$B10,$E$34:$E$2011,C$2)/C$3

    ```


    2.  Autofill from cell `C10` to cell `F10`, and then autofill together to cells
    `C14:F14`.


    3.  To compute `p(light|negative)`, enter the following formula in cell `C15`:


    ```

    =COUNTIFS($D$34:$D$2011,$B15,$E$34:$E$2011,C$2)/C$3

    ```


    4.  Autofill from cell `C15` to cell `F15`, and then autofill together to cells
    `C17:F17`.


    Examine our worksheet again. It should look similar to Figure [9-7](#494428_2_En_9_Chapter.xhtml#Fig7).
    By far, we have completed the computation for each individual conditional probability
    based on the training dataset.


    ![](images/494428_2_En_9_Chapter/494428_2_En_9_Fig7_HTML.jpg)


    An Excel screenshot. The row headers are size, number, and thickness. The column
    headers are negative and stages 1 to 3. It contains numerical data in all the
    cells.


    **Figure 9-7** Examine our data and formula again


    Continue to work on the scoring dataset by following these instructions:


    5.  In cell `F21`, enter the following formula:


    ```

    =SUMIF($B$5:$B$17,$B21,C$5:C$17) * SUMIF($B$5:$B$17,$C21,C$5:C$17) * SUMIF($B$5:$B$17,$D21,C$5:C$17)
    * C$4

    ```


    Row 21 is the first scoring record. `B21` is the Size attribute of the first scoring
    record. In this specific case, the value of `B21` is “none”. Cells `C5:C17` store
    all the individual conditional probabilities with respect to class “negative”.


    The expression `SUMIF($B$5:$B$17,$B21,C$5:C$17)` sums all the cells in array `C5:C17`
    as long as their corresponding cells in array `B5:B17` have the value “none”.
    Indeed, this expression fetches the conditional probability `p(none|negative)`
    for scoring record 1 (attribute Size).


    `SUMIF($B$5:$B$17,$C21,C$5:C$17)` fetches the conditional probability `p(scale-4|negative)`
    for scoring record 1 (attribute Number).


    `SUMIF($B$5:$B$17,$D21,C$5:C$17)` fetches the conditional probability `p(light|negative)`
    for scoring data record 1 (attribute Thickness).


    The formula in cell `F21` implements Equation ([9-7](#494428_2_En_9_Chapter.xhtml#Equ7))
    for scoring data record 1 when the class is “negative”.


    6.  Autofill from cell `F21` to cell `I21`.


    The formula in cell `G21` implements Equation ([9-7](#494428_2_En_9_Chapter.xhtml#Equ7))
    for scoring data record 1 when the class is “stage-1”.


    The formula in cell `H21` implements Equation ([9-7](#494428_2_En_9_Chapter.xhtml#Equ7))
    for scoring data record 1 when the class is “stage-2”.


    The formula in cell `I21` implements Equation ([9-7](#494428_2_En_9_Chapter.xhtml#Equ7))
    for scoring data record 1 when the class is “stage-3”.


    7.  In cell `J21`, enter the formula `=MAX(F21:I21)`.


    As there are more than two classes, the final categorical class is determined
    by the maximum among `F21:I21`. Note the final probability is not computed here,
    that is, Equation ([9-8](#494428_2_En_9_Chapter.xhtml#Equ8)) is not implemented.
    If needed, we can compute the `P(negative|record1)` by the formula `=F21/SUM(F21:I21)`.
    The probabilities of other classes for scoring record 1 can be computed in a similar
    way.


    Part of our worksheet looks like Figure [9-8](#494428_2_En_9_Chapter.xhtml#Fig8).


    1.  Autofill cells `F21:J21` together to cells `F30:J30`.


    2.  In cell `E21`, enter the following formula and then autofill from cell `E21`
    to `E30`:


    ```

    =INDEX($C$2:$F$2, MATCH(J21, F21:I21, 0)) &" ("&TEXT(J21/SUM(F21:I21),"0.0000")&")"

    ```


    The preceding formula is worth a detailed explanation. This formula finds the
    most likely corresponding class for scoring record 1 and displays the probability
    of this class.


    1.  Cells `C2:F2` store the class names of the target variable Lung Cancer. Cells
    `F21:I21` store the probabilities of scoring record 1 with respect to each class.


    2.  `=INDEX($C$2:$F$2, MATCH(J21, F21:I21, 0))` finds the corresponding class
    of “Lung Cancer” based on the value inside cell `J21`: the maximum of `F21:I21`.
    There must be a value inside `F21:I21` matching cell `J21`. In this specific case,
    it is `H21`. Function `INDEX` returns the value of the cell in `C2:F2` that aligns
    to `H21` in `F21:I21`.


    3.  Operator `&` is used to concatenate multiple strings together.


    4.  `J21/SUM(F21:I21)` computes the probability of the most likely class of scoring
    record 1 by following Equation ([9-8](#494428_2_En_9_Chapter.xhtml#Equ8)).


    5.  `TEXT(J21/SUM(F21:I21),"0.0000")` formats the probability so that four digits
    are displayed after the decimal point.


    Our final result should look similar to Figure [9-9](#494428_2_En_9_Chapter.xhtml#Fig9).
    Note as the training dataset is randomly generated, the probabilities (column
    E) in Figure [9-9](#494428_2_En_9_Chapter.xhtml#Fig9) are not dominant. They are
    all close to 0.25.


    ![](images/494428_2_En_9_Chapter/494428_2_En_9_Fig9_HTML.jpg)


    An Excel screenshot represents the Naive Bayes classification. It contains a table
    with the column headers sample I d, size, number, thickness, and lung cancer.
    All the cells have data.


    **Figure 9-9** Naive Bayes classification is completed'
