    ### 绝对引用


    假设有一本账本，记录了固定利率以及借给客户的贷款金额。我们的任务是计算每位客户应付的利息。请按照以下说明完成实验：


    ![](img/494428_2_En_1_Fig6_HTML.jpg)


    一张 Excel 截图。贷款和利息分别是单元格 A1 和 B1 中的数据。单元格 A2 到 A9 填满了数字。单元格 B2 被高亮显示。指向单元格 B2 的箭头表示双击自动填充。


    图 1-6


    通过双击自动填充


    1.  打开一个空白的 Excel 工作表。在单元格 A1、B1 和 D1 中分别输入文本“贷款”、“利息”和“利率”。将 C1 留空。在单元格 D2 中输入“5%”（不含引号）。


    2.  在单元格 A2 中，输入公式 `=RANDBETWEEN(1000,50000)`。此公式会随机生成一个介于 1000 和 50000（含）之间的整数。


    3.  从 A2 自动填充到 A12。


    4.  在单元格 B2 中，输入公式 `=A2*D2`。此公式计算 A2 应付的利息。此时一切应该都正常。


    5.  让我们尝试另一个快速自动填充技巧：选中单元格 B2 ➤ 将鼠标光标移动到单元格 B2 的右下角，直到光标变成黑色十字 ➤ 双击。见图 1-6。此双击操作会自动将公式填充到单元格
    B3 到 B12（B2 已有公式）。注意：通过双击自动填充仅适用于垂直向下的自动填充操作。


    现在，我们的工作表看起来像图 1-7。


    ![](img/494428_2_En_1_Fig7_HTML.jpg)


    一张 Excel 截图。贷款、利息和利率分别是单元格 A1、B1 和 D1 中的数据。A2 到 A12 填满了数字。单元格 B2 被选中。单元格 D3 是
    5%。公式栏中的数据是等于 A3 星号 D3，该部分被高亮显示。


    图 1-7


    利息计算自动填充失败


    除了单元格 B2，B 列中的所有其他单元格都没有得到正确结果。原因在于，当我们从 B2 垂直自动填充到 B12 时，单元格 B2 中的原始公式（`=A2*D2`）发生了变化：公式中每个单元格引用的行号会自动逐一递增。如图
    1-7 所示，单元格 B3 中的公式是 `=A3*D3`。我们可以想象，单元格 B4 中的公式将是 `=A4*D4`。


    在单元格 B3 中，我们需要公式为 `=A3*D2`，也就是说，当我们从 B2 自动填充到 B3 时，我们需要单元格引用 A2 变为 A3，但需要单元格引用
    D2 保持不变。


    如前所述，单元格引用 D2 包含两部分：列索引 D 和行索引 2。对于垂直自动填充，列索引永远不会改变，但行索引会改变。为了在自动填充期间保持行索引不变，我们需要在行索引前加上“$”。这意味着，单元格
    B2 中的公式应为 `=A2*D$2`。使用符号“$”来保持公式中的单元格引用在自动填充操作中不变或锁定，这被称为绝对引用。


    在单元格 B2 中使用这个修正后的公式，让我们再次从单元格 B2 自动填充到 B12。这次我们应该能得到正确的结果。


    请注意，对于这个特定任务，单元格 B2 中的公式 `=A2*$D$2` 也同样有效。当在列索引 D 前放置 $ 时，即使我们执行水平自动填充，列索引也不会改变。但是，请注意，我们可能会遇到需要在自动填充操作中仅保持单元格引用的一部分（仅行索引或仅列索引）不变的情况。


    ### 选择性粘贴和粘贴数值


    继续使用我们之前尝试计算利息的工作表。由于 A 列中的数字是由 RANDBETWEEN 函数生成的，它们在工作表中不断变化，这不利于演示。我们希望将单元格
    A1:D12 中的数字复制到另一个位置，并移除随机数特性。我们可以通过使用“选择性粘贴”功能来完成此任务。


    请按照以下说明操作：


    ![](img/494428_2_En_1_Fig8_HTML.jpg)


    一张 Excel 截图。已选中“开始”选项卡。在“粘贴”下拉列表中，选中了“选择性粘贴”选项。


    图 1-8


    选择“选择性粘贴”


    1.  选中单元格区域 A1:D12。在“开始”主选项卡下，点击“复制”工具选项卡。让我们将这些数字复制到区域 A15:D26。


    2.  点击单元格 A15；在“开始”主选项卡下，点击“粘贴” ➤ 选择“选择性粘贴”。此过程在图 1-8 中进行了说明。注意，如果你的操作系统启用了右键单击功能，你也可以右键单击单元格
    A15 ➤ 选择“选择性粘贴”。


    ![](img/494428_2_En_1_Fig9_HTML.jpg)


    “选择性粘贴”窗口的截图。在“粘贴”选项中，选中了“数值”。在“运算”中，选中了“无”。一段文字写着“另一个需要练习的重要功能是文本”，指向“转置”复选框。


    图 1-9


    粘贴数值


    1.  出现一个小菜单。在此菜单上，如图 1-9 所示，在“粘贴”下选择“数值”。请注意此菜单上另一个可用的功能“转置”。练习这个“转置”功能是个好主意，因为它对于数据准备非常有用。


    我们工作表的一部分看起来类似于图 1-10。


    ![](img/494428_2_En_1_Fig10_HTML.jpg)


    一张 Excel 截图。A15、B15 和 D15 中的数据分别是贷款、利息和利率。A16 到 A26 以及 B16 到 B26 是编号的单元格。D16 是
    0.05。


    图 1-10


    粘贴数值之后

