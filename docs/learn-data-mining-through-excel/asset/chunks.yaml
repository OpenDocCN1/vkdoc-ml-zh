    ## Reinforcement Exercises


    You may have realized that accomplishing hierarchical clustering and dendrogram
    via Excel is error prone because of the necessary manual work. This is especially
    true when the number of data points increases. As I mentioned before, one way
    to mitigate errors is to keep intermediate steps intact by making copies of the
    working worksheet, similar to what we did in k-means clustering.


    Can we conduct hierarchical clustering on hundreds of data points through Excel?
    Certainly we can. But we must borrow a hand from k-means clustering first. The
    idea is to apply k-means clustering (e.g., k=7) on the larger dataset first, then
    treat each cluster as one data point to start hierarchical clustering.


    *   The file Chapter8-HW-1.xlsx provides an opportunity for you to practice hierarchical
    clustering and dendrogram drawing. Refer to Chapter8-HW-1-withAnswers.xlsx whenever
    you need some help.


    *   Chapter8-HW-2.xlsx allows you to practice hierarchical clustering with a larger
