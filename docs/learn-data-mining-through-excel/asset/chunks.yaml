    \n一个 Excel 截图。行标题是尺寸、数字和厚度。列标题是阴性和 1 期到 3 期。所有单元格都包含数值数据。\n\n图 9-7\n再次检查我们的数据和公式\n\
    \n继续处理评分数据集，请按照以下说明操作：\n\n5.  在单元格 F21 中，输入以下公式：\n\n```\n    =SUMIF($B$5:$B$17,$B21,C$5:C$17)\
    \ * SUMIF($B$5:$B$17,$C21,C$5:C$17) * SUMIF($B$5:$B$17,$D21,C$5:C$17) * C$4\n\
    \    ```\n\n第 21 行是第一条评分记录。B21 是第一条评分记录的“尺寸”属性。在此特定情况下，B21 的值为“无”。单元格 C5:C17 存储了所有相对于类别“阴性”的单个条件概率。\n\
    \n表达式 `SUMIF($B$5:$B$17,$B21,C$5:C$17)` 对数组 C5:C17 中所有与数组 B5:B17 中对应单元格值为“无”的单元格进行求和。实际上，此表达式获取了评分记录\
    \ 1（属性：尺寸）的条件概率 p(无|阴性)。\n\n`SUMIF($B$5:$B$17,$C21,C$5:C$17)` 获取了评分记录 1（属性：数字）的条件概率\
    \ p(刻度-4|阴性)。\n\n`SUMIF($B$5:$B$17,$D21,C$5:C$17)` 获取了评分数据记录 1（属性：厚度）的条件概率 p(浅色|阴性)。\n\
    \n单元格 F21 中的公式实现了当类别为“阴性”时，评分数据记录 1 的方程 (9-7)。\n\n6.  从单元格 F21 自动填充到单元格 I21。\n\
    \n单元格 G21 中的公式实现了当类别为“1 期”时，评分数据记录 1 的方程 (9-7)。\n\n单元格 H21 中的公式实现了当类别为“2 期”时，评分数据记录\
    \ 1 的方程 (9-7)。\n\n单元格 I21 中的公式实现了当类别为“3 期”时，评分数据记录 1 的方程 (9-7)。\n\n7.  在单元格 J21\
    \ 中，输入公式 `=MAX(F21:I21)`。\n\n由于类别超过两个，最终的分类类别由 F21:I21 中的最大值决定。请注意，此处未计算最终概率，即未实现方程\
    \ (9-8)。如果需要，我们可以通过公式 `=F21/SUM(F21:I21)` 计算 P(阴性|记录 1)。评分记录 1 的其他类别的概率可以类似方式计算。\n\
    \n我们的工作表部分内容如图 9-8 所示。\n\n8.  将单元格 F21:J21 一起自动填充到单元格 F30:J30。\n\n9.  在单元格 E21\
    \ 中，输入以下公式，然后从单元格 E21 自动填充到 E30：\n\n```\n    =INDEX($C$2:$F$2, MATCH(J21, F21:I21,\
    \ 0)) &\" (\"&TEXT(J21/SUM(F21:I21),\"0.0000\")&\")\"\n    ```\n\n上述公式值得详细解释。此公式找到评分记录\
    \ 1 最可能对应的类别，并显示该类别的概率。\n    1.  单元格 C2:F2 存储了目标变量“肺癌”的类别名称。单元格 F21:I21 存储了评分记录\
    \ 1 相对于每个类别的概率。\n\n2.  `=INDEX($C$2:$F$2, MATCH(J21, F21:I21, 0))` 根据单元格 J21 中的值（即\
    \ F21:I21 的最大值）找到“肺癌”对应的类别。F21:I21 中必须有一个值与单元格 J21 匹配。在此特定情况下，该值是 H21。函数 INDEX\
    \ 返回单元格 C2:F2 中与 `F21:I21` 中的 H21 对齐的单元格的值。\n\n3.  运算符 & 用于将多个字符串连接在一起。\n\n4.\
    \  `J21/SUM(F21:I21)` 通过遵循方程 (9-8) 计算评分记录 1 最可能类别的概率。\n\n5.  `TEXT(J21/SUM(F21:I21),\"\
    0.0000\")` 格式化概率，以便小数点后显示四位数字。\n\n我们的最终结果应类似于图 9-9。请注意，由于训练数据集是随机生成的，图 9-9 中的概率（E\
    \ 列）并不占主导地位。它们都接近 0.25。\n\n![](img/494428_2_En_9_Fig9_HTML.jpg)\n\n一个 Excel 截图展示了朴素贝叶斯分类。它包含一个表格，列标题为样本\
    \ ID、尺寸、数字、厚度和肺癌。所有单元格都有数据。\n\n图 9-9\n朴素贝叶斯分类完成\n"
