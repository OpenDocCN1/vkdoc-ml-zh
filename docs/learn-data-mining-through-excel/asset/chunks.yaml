  trans: "\n## 求解器\n\nExcel 求解器是一款优化工具。它通过调整决策变量的值，来搜索最大值、最小值或精确的目标值。求解器是一个内置的加载项程序，无需下载即可安装。请按照以下说明，将求解器与数据分析加载项一同安装：\n\
    \n![](img/494428_2_En_4_Fig2_HTML.jpg)\n\n屏幕显示一个菜单，其中包含打印、共享、管理工作簿、导出等选项，允许用户与其工作簿进行交互和自定义。\n\
    \n图 4-2\n\n单击文件 ➤ 选项\n\n1.  打开一个空白 Excel 文件。\n\n2.  单击文件 ➤ 选项。选项链接位于底部，如图 4-2\
    \ 所示。\n\n![](img/494428_2_En_4_Fig3_HTML.jpg)\n\n屏幕显示 Excel 选项，包含常规 Excel 使用、公式、数据、校对、保存选项、语言偏好、辅助功能、高级设置以及\
    \ Microsoft Office 中功能区与工具栏的自定义等设置。其中“加载项”被高亮显示。\n\n图 4-3\n\n单击加载项\n\n1.  单击加载项，如图\
    \ 4-3 所示。\n\n![](img/494428_2_En_4_Fig4_HTML.jpg)\n\n窗口屏幕显示“查看和管理 Microsoft Office\
    \ 加载项”窗口，高亮显示“规划求解加载项”及其文件位置，并用箭头指示“转到”按钮。\n\n图 4-4\n\n选择规划求解加载项并单击转到\n\n1.  在出现的菜单中，选择规划求解加载项，然后单击“转到...”按钮，如图\
    \ 4-4 所示。同时，也选择分析工具库并单击“转到...”按钮。\n\n![](img/494428_2_En_4_Fig5_HTML.png)\n\n\
    屏幕显示加载项，包括分析工具库和规划求解加载项，右侧有一个“确定”按钮。\n\n图 4-5\n\n添加规划求解和分析工具库\n\n1.  单击“确定”按钮，如图\
    \ 4-4 所示。随后会出现一个小菜单，如图 4-5 所示。确保“规划求解”和“分析工具库”都已勾选。单击“确定”按钮。\n\n![](img/494428_2_En_4_Fig6_HTML.jpg)\n\
    \n菜单栏截图，高亮显示“数据分析”和“规划求解”。\n\n图 4-6\n\n规划求解现已可用\n\n1.  单击主选项卡“数据”；“数据分析”和“规划求解”均可用，如图\
    \ 4-6 所示。\n\n## 通过 Excel 学习 LDA\n\nChapter4-1a.xlsx 包含著名的鸢尾花数据集，它是进行 LDA 实践的绝佳样本。在鸢尾花数据集中，四个属性\
    \ x1、x2、x3 和 x4 是一些用于确定鸢尾花类型（即目标变量）的花卉特征。这是训练数据集。请注意，目标变量有三个不同的值，即目标变量有三个类别。请按照以下说明操作：\n\
    \n1.  打开 Chapter4-1a.xlsx；在单元格 F1 中输入“y”（不含引号）。\n\n2.  在单元格 K1、K2 和 K3 中，分别输入\
    \ 0、1 和 2。\n\n3.  在单元格 L1、L2 和 L3 中，分别输入 Iris-setosa、Iris-versicolor 和 Iris-virginica。我们的工作表如图\
    \ 4-7 所示。\n\n![](img/494428_2_En_4_Fig7_HTML.jpg)\n\n屏幕截图显示一个 Excel 工作表，数据排列在\
    \ B 列到 K 列以及第 1 行到第 9 行，包含数值和标签 Iris setosa、versicolor 和 virginica。\n\n图 4-7\n\
    \n鸢尾花数据集和表格设置\n\n我们想先利用最小二乘法来获得线性函数 P。因此，我们需要先将分类值转换为数值。单元格 K1:L3 定义了 0 ➤ Iris-setosa，1\
    \ ➤ Iris-versicolor，2 ➤ Iris-virginica。\n\n![](img/494428_2_En_4_Fig8_HTML.jpg)\n\
    \n屏幕截图显示一个包含 9 列和 14 行的 Excel 数据。它高亮显示了 K 列和 L 列。\n\n图 4-8\n\n分类后的鸢尾花数据集\n\n1.\
    \  在单元格 F2 中，输入以下公式：\n\n```\n    =IF(A2=L$1,K$1,IF(A2=$L$2,K$2,K$3))\n    ```\n\
    \n2.  将单元格 F2 自动填充到 F151（共有 150 个数据点）。我们的工作表应如图 4-8 所示。\n\n![](img/494428_2_En_4_Fig9_HTML.jpg)\n\
    \nExcel 工作表截图显示 3 列和 9 行，K 列包含值 b、w1、w2、w3、w4，L 列包含值 5 到 1，M 列包含从 -0.1 到 0.6 的值。\n\
    \n图 4-9\n\n使用最小二乘法获取函数系数\n\n1.  在单元格 K5:K9 中，分别输入 b、w1、w2、w3 和 w4。这些代表线性函数 P 的系数（权重）和截距。\n\
    \n2.  在单元格 L5:L9 中，分别输入 5、4、3、2 和 1。我们将利用 INDEX 和 LINEST 函数来查找线性函数 P 的系数和截距。LINEST\
    \ 函数返回一个包含五个元素的数组。数组中元素的顺序是 w4、w3、w2、w1 和 b。\n\n3.  在单元格 M5 中，输入公式：\n\n```\n \
    \   =INDEX(LINEST(F$2:F$151,B$2:E$151,TRUE,TRUE),1,L5)\n    ```\n\n4.  将单元格 M5\
    \ 自动填充到 M9。我们工作表的一部分应如图 4-9 所示。单元格 M5:M9 包含线性函数 P 的系数。下一步是应用 P 来获取每个数据点的预测值。我们将这些预测值存储在\
    \ G 列中。\n\n![](img/494428_2_En_4_Fig10_HTML.jpg)\n\n屏幕截图显示一个包含 14 行和 7 列的 Excel\
    \ 表格。列标签为 G、H、I、J、K、L 和 M，表格包含与鸢尾花分类相关的数值，以及与变量 w1、w2、w3 和 w4 相关的值。\n\n图 4-10\n\
    \n计算出的分界点\n\n1.  在单元格 G1 中输入“数值预测”。在单元格 G2 中，输入以下公式：\n\n```\n    =MMULT(B2:E2,\
    \ M$6:M$9)+ M$5\n    ```\n\n此公式表示表达式 w[1]x[1] + w[2]x[2] + …+ w[n]x[n] + b。由于\
    \ B2:E2 是水平数组，而 M6:M9 是垂直数组，因此两个数组的乘法只能通过执行类似矩阵乘法的 MMULT 函数来实现。类似的函数 SUMPRODUCT\
    \ 在此处不适用。此公式可以用一个更繁琐的公式（不推荐）替代：\n\n```\n    =M$6*B2+M$7*C2+M$8*D2+M$9*E2+M$5\n\
    \    ```\n"
- fmt: '2.  Autofill cells `G2` to `G152`. Once we have the predicted values for each
    data point, what we need next is to find cutoffs to classify each predicted value
    into a specific iris type.


    3.  In cells `K11`, `L11`, and `M11`, enter `mean`, `sample number`, and `cutoff`,
    respectively (no quotation marks).


    4.  In cell `K12`, enter the following formula:


    ```

    =AVERAGEIFS(G$2:G$151,F$2:F$151,K1)

    ```


    This formula computes the mean of the predicted values for Iris-setosa.


    5.  Autofill `K12` to `K14`. The means of the predicted values for Iris-versicolor
    and Iris-virginica are stored in cells `K13` and `K14`, respectively.


    6.  In cell `L12`, enter the formula:


    ```

    =COUNTIFS(F$2:F$151,K1)

    ```


    This formula counts the number of Iris-setosa in the training dataset.


    7.  Autofill `L12` to `L14`. Cells `L13` and `14` store the number of Iris-versicolor
    and Iris-virginica, respectively.


    8.  In cell `M12`, enter the formula to compute the first cutoff:


    ```

    =(K12*L12+K13*L13)/(L12+L13)

    ```


    9.  Autofill `M12` to `M13`. Do not autofill to cell `M14`. Based on the two cutoffs,
    each predicted numerical value can be converted into an iris type. Part of our
    worksheet looks like Figure [4-10](#494428_2_En_4_Chapter.xhtml#Fig10).


    1.  In cell `H1`, type `Type classification`.


    2.  In cell `H2`, enter the following formula and then autofill from `H2` to `H152`:


    ```

    =IF(G2<M$12,L$1,IF(G2<M$13,L$2,L$3))

    ```


    This formula converts each numerical value in column `G` into an iris type. A
    glance of the result would tell that most iris types are classified into the right
    group.


    3.  To count how many iris data points are incorrectly classified, enter `Difference`
    in cell `I1`.


    4.  In `I2`, enter the following formula:


    ```

    =IF(A2=H2,0,1)

    ```


    This formula compares the known iris type with the classified iris type. If a
    mismatch is found, `1` is returned.


    5.  Autofill cells `I2` to `I152`.


    6.  Select cells `K16` and `L16`, merge these two cells, and type inside the text
    `Difference =` in the merged cell.


    7.  In cell `M16`, enter the formula `=SUM(I2:I151)`. Part of our formula should
    look like Figure [4-11](#494428_2_En_4_Chapter.xhtml#Fig11).


    ![](images/494428_2_En_4_Chapter/494428_2_En_4_Fig11_HTML.jpg)


    A screenshot of excel sheet displays 14 rows and 7 columns. A sheet includes labels
    such as Type classification, Difference, mean, sample number and cutoff.


    Figure 4-11


    LDA analysis on the Iris training dataset


    This LDA analysis is quite successful, though there are still four iris data points
    incorrectly classified. Note that it is common for a data mining method to miss
    a few data points on the training dataset. Generally speaking, we should not use
    the same training dataset to assess how good a model can perform, however. A model
    with a perfect classification or prediction on the same training dataset might
    suggest an overfit, which indicates that the model is too specific to the training
    data but is likely to fail on unknown scoring data.


    If we assign `0` to Iris-virginica, `1` to Iris-versicolor, and `2` to Iris-setosa
    in cells `K1:L3`, we will get a very similar result. However, if we assign `0`
    to Iris-virginica, `1` to Iris-setosa, and `2` to Iris-versicolor in cells `K1:L3`,
    we will find that the classification is totally messed up. This is a disadvantage
    of carrying out LDA analysis in Excel.


    With the first model constructed, that is, the initial linear function `P` found,
    we can predict the iris type based on `x1`, `x2`, `x3`, and `x4`. We can view
    such predictions in the worksheet `iris-LINEST` of the file `Chapter4-1b.xlsx`.


    Equation ([4-3](#494428_2_En_4_Chapter.xhtml#Equ3)) requests to maximize the ratio
    of `Sg/Sw`. For this purpose, we need to make use of Solver. Note, we can obtain
    an optimized parameter set by using Solver directly without using LINEST first.
    However, in LDA, it is a good idea to use least square method first before applying
    Solver.


    *Continue our learning through the following step-by-step instructions:*


