    \ 和 69 之间的截止点。\n\n8.  在单元格 W7 中输入公式 `=(U6*U7+V6*V7)/(U7+V7)`。这是区分类别 69 和 84 的截止点。\n\
    \n工作表的一部分应完全如图 13-23 所示。\n\n![](img/494428_2_En_13_Fig23_HTML.jpg)\n\n一张 Excel\
    \ 表格的截图，展示了神经网络的截止点数据。\n\n图 13-23\n\n具有两个隐藏层的神经网络模型的截止点\n\n我们想使用训练数据来评估我们的模型效果如何。由于我们的数据量不大，这里不进行交叉验证。\n\
    \n9.  在单元格 Z10 中输入“预测”，在单元格 AA10 中输入“差异”。\n\n10.  在单元格 Z11 中输入公式 `=IF(X11<$W$6,39,IF(X11<$W$7,69,84))`。此公式根据“输出”值和两个截止点值对每个样本进行分类。从\
    \ Z11 自动填充至 Z182。\n\n11.  在单元格 AA11 中输入公式 `=IF(F11=Z11,0,1)`。如果预测的类别类型与现有的类别类型相同，此公式返回\
    \ 0；否则返回 1。从 AA11 自动填充至 AA182。\n\n12.  在单元格 X6 中输入公式 `=SUM(AA11:AA182)`。此公式计算预测错误的类别类型数量。\n\
    \n我们的结果应类似于图 13-24。我们的具有两个隐藏层的神经网络在 172 个样本中错误预测了 48 个。\n\n![](img/494428_2_En_13_Fig24_HTML.jpg)\n\
    \n一张 Excel 表格的截图，展示了错误预测的 48 个样本。\n\n图 13-24\n\n神经网络错误预测了 48 个样本\n\n您可能会得到与图 13-24\
    \ 所示略有不同的结果。如果是这样，不必感到惊讶。这种差异是由规划求解引起的。我们在通过 Excel 学习数据挖掘的过程中一直在使用规划求解。规划求解是一个数学优化工具，由于其内部算法，有时可能会产生略有不同的结果。如果您的\
    \ Excel 使用的是更新版本的规划求解，您的模型可能会有更好的性能。\n\n本实验的下一步是对评分数据集进行预测。请遵循以下说明：\n\n13.  选择单元格\
    \ G182:X182。自动填充至单元格 G190:X190。\n\n14.  从单元格 Z182 自动填充至 Z190。\n\n预测结果类似于图 13-25。\n\
    \n![](img/494428_2_En_13_Fig25_HTML.jpg)\n\n一张预测类别类型的 Excel 表格。评分数据集已高亮显示。\n\n\
    图 13-25\n\n评分数据集的预测类别类型\n\n关于上述实验过程，我们可能会有不少疑问。例如，我们可能会问，为什么需要生成输出-1、误差-1、输出-2\
    \ 和误差-2 来分别优化第 1 层和第 2 层参数。这是个好问题。我们当然可以稍微不同地实践这个神经网络模型，例如，不先优化第 1 层参数。事实上，我们甚至可能得到更好的结果。这就是使用\
    \ Excel 学习数据挖掘方法（尤其是那些复杂方法）的优势所在。因为我们对每一步都有清晰的了解，所以在学习过程中可能会提出各种问题，其中一些问题可能有助于改革和改进某些数据挖掘算法。\n\
    \n我们也可以在隐藏层 2 中使用不同的转换函数。在不同的层中使用不同的转换函数（例如修正线性单元函数）是否能改善模型结果，这在 Excel 中很容易测试。这是一个值得尝试的好练习。\n\
    \n至此，我们在 Excel 中学习人工神经网络的内容就结束了。请在 Chapter13-2b.xlsx 文件中找到最终结果。\n"
- fmt: '# Reinforcement Exercises


    Though there are three reinforcement exercises, they are all based on the data
    we used in Experiment 2.


    1. **Exercise 1**: Start with `Chapter13-HW-1.xlsx` which is the same as `Chapter13-2a.xlsx`;
    please construct a 2-hidden-layers neural network as shown in Experiment 2. However,
    when using Solver to minimizing `Error Sum2`, please optimize parameters in `$H$2:$N$4`
    only. Compare the prediction result with that of Experiment 2. Refer to `Chapter13-HW-1-withAnswers.xlsx`.


    2. **Exercise 2**: Start with `Chapter13-HW-2.xlsx` which is also the same as
    `Chapter13-2a.xlsx`; please construct a 2-hidden-layers neural network as shown
    in Experiment 2. However, do not optimize layer 1 parameters first. Instead, optimize
    all parameters together after constructing both hidden layers. Compare the prediction
    result with that of Experiment 2. Refer to `Chapter13-HW-2-withAnswers.xlsx`.


    3. **Exercise 3**: Start with `Chapter13-HW-3.xlsx` which makes use of four neurons.
    Please construct a neural network with one or two hidden layers. Compare the prediction
    result with that of Experiment 2. Refer to `Chapter13-HW-3-withAnswers.xlsx`.


    It would be interesting to compare the results obtained from Experiment 2, Exercise
    1, Exercise 2, and Exercise 3.


    # Review Points


    1. General understanding of neural network

    2. Input layer, hidden layer(s), and output layer

    3. Aggregation function, transformation function, or activation function, especially
    sigmoid function

    4. Excel functions `SUMPRODUCT`, `COUNTIFS`, `INDEX`, `AVERAGEIFS`, `MMULT`, and
    `EXP`

    5. What is deep learning

    6. Solver


    # 14. Text Mining


    Text mining is such a large topic in data mining that it can be a separate field.
    It is also so important and has so many applications that a typical data mining
    book will never miss. So far, all the data we have been using are structured data.
    By definition, structured data indicate that the data are arranged in a specific
    format such that they can be easily processed by computer programs. The data we
    have been using have already been arranged in a table format, a format that is
    requested by all the data mining methods we have learned. However, text data,
    what text mining methods work with, is a form of unstructured data and is usually
    sequential data. Other forms of unstructured data include audio files, images,
    etc.


    Is it possible to apply techniques we have learned to mine unstructured forms
    of data like articles or web pages? The answer is yes. There is a prerequisite,
    however.


    ## General Understanding


    To apply the data mining techniques we have learned to unstructured text data,
    the data must be preprocessed to be structured or at least semistructured. There
    are several typical techniques to preprocess (prepare) text data. Such techniques
    include case transformation, tokenization, stop-word removal, stemming, generating
    n-grams, token replacement, etc. After the text data are organized in a table
    format, we can build up a term-document matrix. From there, meaningful information
    can be mined including term frequency and term pattern for various applications,
    such as risk management, customer care service, fraud prevention, spam filtering,
    social media text analysis, etc.


    Assume that we are reading a large number of reviews about a hotel. Our purpose
    is to grade the hotel based on the number of positive comments vs. the number
    of negative comments. The first task is to determine what is a positive or negative
    review. Such a task is similar to sentence sentiment analysis: determining the
    emotion or sentiment of a short sentence. The simplest technique to assess the
    sentiment of a sentence is counting the appearances of positive keywords and negative
    keywords. Certainly, there should be a dictionary of such keywords (and phrases),
    representing either positive or negative emotions. `MPQA Subjectivity Lexicon`
    is exactly such a dictionary and it is adopted by Excel Azure machine learning
    add-in. In `MPQA Subjectivity Lexicon`, there are about 8000 words; each is assigned
    a strong or weak polarity score. Since this book does not use add-ins except for
    the built-in add-in Solver, we are not going to use Azure or MPQA. Instead, I
    am going to illustrate how to conduct a simple opinion (sentiment) analysis by
    creating a small dictionary in Excel. Let’s go through the data preparation steps
    first by working on one review “The hotel it is fantastic”.


    1. **Case transformation**: It is a good idea to transform all words into lowercase.
    We do not want to treat “Fantastic” differently from “fantastic”. After case transformation,
    the original review becomes “the hotel it is fantastic”.


    2. **Tokenization**: By tokenization, we separate each word into an independent
    term. In the process of tokenization, we also remove punctuations and white spaces.
    After tokenization, the original sentence becomes five separate words: the, hotel,
    it, is, fantastic.


    3. **Stop words** are those that do not have actual meaning in the context. They
    are necessary conjunctions and articles in English, for example, then, a, the,
    it, is, of, for, just, to, etc. Removing them can simplify the texts. After removing
    stop words, we have only two words left: hotel and fantastic.


    4. Assume that “fantastic” is a positive word in our dictionary with polarity
    score 1 and “hotel” is a neutral word with polarity score 0. Thus, this review
    is assessed as positive (score = 1).


    If the review becomes “The hotel it is not fantastic” instead, we know that it
    should not be a positive comment even though the keyword fantastic is there. How
    to assess this review to be negative? There can be multiple ways.


    - **Way 1**: Mark “not” as a negative keyword. If we take this approach, what
    about a review like “the hotel is not bad”?

    - **Way 2**: Take “not fantastic” or “not bad” as a phrase and assess their meaning
    based on the phrase. This is what n-gram technique means.

    - **Way 3**: Combine way 1 and way 2 together. Mark “not” as a negative keyword
    and take “not fantastic” or “not bad” as a phrase.


    In text mining, an n-gram is a combination of `n` words. A single word can miss
    some meaning. Good is the opposite of “not good” and different in intensity from
    “very good”. Applying grams can make our text mining activities more granular
    but can also incur much more complexity. In this chapter, we will only consider
    2-grams for the purpose of simplicity. This indicates that we will consider “not
    fantastic” or “not bad” as a phrase.


    We didn’t make use of the stemming technique in the preceding example. Instead
    of writing “The hotel it is fantastic”, people may write it as “The hotel it is
    a fantasy”. Both “fantasy” and “fantastic” have the same word origin. To reduce
    the text mining complexity, the stemming technique would treat “fantasy” as “fantastic”.
    Another example would be to treat “thanks” the same as “thank”.'
