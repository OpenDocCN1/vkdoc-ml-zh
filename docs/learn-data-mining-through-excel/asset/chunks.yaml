  raw: 'For the attribute Outlook, there are 3 values (states): overcast, rainy, and
    sunny; each has 4, 5, and 5 data points. Considering overcast, the 4 overcast
    match to 4 Yes but 0 No. Thus,


    ```

    H-outlook-overcast = -(4/4×log2(4/4)+0/4×log2(0/4)) = 0.0

    ```


    Note, log2(0) = 0 here.


    Similarly, the 5 rainy match to 3 Yes and 2 No, and the 5 sunny match to 2 Yes
    and 3 No. Thus,


    ```

    H-outlook-rainy = -(3/5×log2(3/5)+2/5×log2(2/5)) = 0.97

    H-outlook-sunny = -(2/5×log2(2/5)+3/5×log2(3/5)) = 0.97

    ```


    The three sub-entropy values must be weighted before they are summed. The weights
    for overcast, rainy, and sunny are 4/14, 5/14, and 5/14, respectively. Thus,


    ```

    H-outlook = 4/14×0.0+5/14×0.97+5/14×0.97 = 0.69

    ```


    Continue this calculation for Temperature, Humidity, and Windy; we get


    ```

    H-temperature = 0.91

    H-humidity = 0.79

    H-windy = 0.89

    ```


    Here comes another concept: “information gain”, which represents how much information
    can be gained by splitting the current dataset based on an attribute. It is defined
    as the difference between the entropy of the target variable and the entropy of
    one attribute. For example, the information gain for Outlook = 0.94 – 0.69 = 0.25.


    Information gain can be biased to an attribute with more values. To reduce such
    a bias, “gain ratio” can be used. Gain ratio for an attribute is defined as


    *   attribute gain ratio = attribute-information-gain / attribute-intrinsic-information


    The intrinsic information for an attribute is calculated by Equation ([10-2](#494428_2_En_10_Chapter.xhtml#Equ2)):


    ![$$ S=-\sum \limits_{k=1}^C\frac{N_k}{N}{\log}_2\left(\frac{N_k}{N}\right) $$](images/494428_2_En_10_Chapter/494428_2_En_10_Chapter_TeX_Equ2.png)


    (10-2)


    In Equation ([10-2](#494428_2_En_10_Chapter.xhtml#Equ2)), *N* represents the data
    size, *N*[*k*] is the number of data points for a given attribute value, while
    C is the number of distinct values for an attribute.


    Let’s use attribute Outlook as the example again to implement Equation ([10-2](#494428_2_En_10_Chapter.xhtml#Equ2)).


    *   Outlook has three distinct values: overcast, rainy, and sunny. So, C = 3.


    *   There are 4 overcast; thus, N-overcast = 4.


    *   Similarly, N-rainy = 5 and N-sunny = 5.


    The intrinsic information of attribute Outlook is then computed as


    ```

    S-outlook

    = -(4/14×Log2(4/14)+5/14×Log2(5/14)+5/14×Log2(5/14))

    = 1.58

    ```


    The final gain ratio of attribute Outlook `= (0.94–0.69)/1.58 = 0.16`.


    As information gain is a good measure for node split in our decision tree example,
    we won’t compute gain ratio for each attribute. Instead, the attribute with the
    largest information gain is picked to split the tree node. In this case, Outlook
    is selected to split the tree node into three child nodes based on the three values:
    overcast, rainy, and sunny.


    Since the overcast node has entropy of 0.0, it must be a leaf node. Another two
    nodes, rainy node and sunny node, can be further divided based on either Temperature,
    Windy, or Humidity.


