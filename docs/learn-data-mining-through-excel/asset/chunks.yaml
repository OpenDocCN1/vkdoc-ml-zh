- fmt: "# Learn ROC Analysis Through Excel\n\nData inside the file `Chapter5-roc-1a.xlsx`\
    \ are simulated. In the file, `TP`, `FN`, `FP`, and `TN` change along with different\
    \ cutoff values, as shown in Figure [5-6](#494428_2_En_5_Chapter.xhtml#Fig6).\
    \ Though there are 19 records in the file, Figure [5-6](#494428_2_En_5_Chapter.xhtml#Fig6)\
    \ only displays 11 records. Records 8–15 are hidden.\n\n![](images/494428_2_En_5_Chapter/494428_2_En_5_Fig6_HTML.jpg)\n\
    \nA spreadsheet represents a set of values under true positive, false negative,\
    \ false positive, true negative, and cut-off. A line is drawn at row 7. The cut-off\
    \ value ranges from 1 to 7, with an increment of 0.5 in each step.\n\n**Figure\
    \ 5-6**  \n`Chapter5-roc-1a.xlsx` training dataset\n\nWe want to draw a chart\
    \ to view how both sensitivity and specificity change along with different cutoff\
    \ values. Follow these instructions:\n\n1. Enter “sensitivity” and “specificity”\
    \ in cells `F2` and `G2`, respectively.\n2. In cell `F3`, enter the formula `=A3/(A3+B3)`.\
    \ This formula computes sensitivity when cutoff = 1. Autofill from `F3` to `F21`.\n\
    3. In cell `G3`, enter the formula `=D3/(C3+D3)`. This formula calculates specificity\
    \ when cutoff = 1. Autofill from `G3` to `G21`.\n4. Select cells `E2:G21`; click\
    \ the menu tab **Insert** ➤ **Chart** ➤ select **Scatter with Smooth Lines and\
    \ Markers**. A scatter chart shows up in our worksheet.\n5. We can add axis titles\
    \ and chart title as desired. The vertical axis’s bound maximum is 1.2 by default.\
    \ I prefer setting it to 1.0, so I double-click on the value 1.2 and then change\
    \ it to 1.0 when the menu for **Axis Options** shows up.\n\nOur chart may look\
    \ similar to Figure [5-7](#494428_2_En_5_Chapter.xhtml#Fig7) (related data included).\
    \ Note that the two curves cross each other at a point. The intersection point\
    \ marks a cutoff value at which the sensitivity equals the specificity.\n\n![](images/494428_2_En_5_Chapter/494428_2_En_5_Fig7_HTML.jpg)\n\
    \nA spreadsheet represents a list of values under the cut-off, sensitivity, and\
    \ specificity. A line graph denotes the percentages of sensitivity and specificity\
    \ with respect to the cutoff points. Sensitivity has a decreasing and specificity\
    \ has an increasing trend. Both intersect in the middle.\n\n**Figure 5-7**  \n\
    Sensitivity/specificity vs. cutoffs\n\nThe next step is to draw a ROC curve. ROC\
    \ curve is graphed as false positive rate vs. true positive rate, that is, 1-specificity\
    \ vs. sensitivity. To make it more viewable, the values are all multiplied by\
    \ 100. So, the ROC curve is in fact (100-100\\*specificity) vs. (100\\*sensitivity).\n\
    \nIn a ROC curve chart, the x-axis is 100-specificity. Therefore, the specificity\
    \ values should be arranged in descending order. As the current specificity values\
    \ are in ascending order, we need to flip-flop the specificity values. Accordingly,\
    \ we need to flip-flop the sensitivity values, too. Continue following the instructions\
    \ below:\n\n6. Select cells `E2:G21`; use **Paste Special** to paste values only\
    \ into cell `A25`.\n7. Select cells `A25:C44`; click menu tab **Data** ➤ **Sort**.\n\
    8. On the upcoming menu, sort the data by **Cut-off** and the order is **Largest\
    \ to Smallest**, as shown in Figure [5-8](#494428_2_En_5_Chapter.xhtml#Fig8).\
    \ Make sure to check “My data has headers”. Click **OK**.\n\n![](images/494428_2_En_5_Chapter/494428_2_En_5_Fig8_HTML.jpg)\n\
    \nA screenshot of a dialog box titled sort. It represents the options to sort\
    \ by the column name of cut-off according to the cell values from the largest\
    \ to smallest order.\n\n**Figure 5-8**  \nSort data by Cut-off\n\nPart of our\
    \ worksheet looks like Figure [5-9](#494428_2_En_5_Chapter.xhtml#Fig9).\n\nExcel\
    \ can sort the selected cells only while leaving all other cells intact. This\
    \ is a great feature of Excel. If the to-be sorted cells have formula referencing\
    \ other cells outside the sorting area, sorting can mess up some calculations.\
    \ This is why we need to copy `E2:G21` by values first and then sort the copied\
    \ values.\n\n![](images/494428_2_En_5_Chapter/494428_2_En_5_Fig9_HTML.jpg)\n\n\
    A screenshot of a spreadsheet represents a list of values under cut-off, sensitivity,\
    \ and specificity. The cut-off value ranges from 1 to 10 at an interval of 0.5.\
    \ The values are arranged in descending order.\n\n**Figure 5-9**  \nData flip-flopped\n\
    \nWe also need to scale up the data. Continue following the instructions below:\n\
    \n9. Enter “100-specificity” in cell `D25` and “sensitivity” in cell `E25`.\n\
    10. In cell `D26`, enter the formula `=100-ROUND(C26*100,0)`. This formula multiplies\
    \ the existing specificity value by 100, rounds it, and subtracts 100 by it.\n\
    11. Autofill cells `D26` to `D44`.\n12. In cell `E26`, enter the formula `=ROUND(100*B26,0)`.\n\
    13. Autofill cells `E26` to `E44`.\n14. Right-click on the row number 26 and select\
    \ “Insert”. This action inserts a blank row. The original cell `D26` becomes `D27`\
    \ now.\n15. Enter 0 in both cells `D26` and `E26`.\n\nPart of our worksheet should\
    \ look like Figure [5-10](#494428_2_En_5_Chapter.xhtml#Fig10).\n\n![](images/494428_2_En_5_Chapter/494428_2_En_5_Fig10_HTML.jpg)\n\
    \nA spreadsheet represents a list of values of cut-off, sensitivity, specificity,\
    \ 100-specificity, and sensitivity. The cut-off ranges from 5 to 10 at an interval\
    \ of 0.5, from bottom to top.\n\n**Figure 5-10**  \nSet up data for ROC curve\n\
    \nNow comes the last step to draw the ROC curve:\n\n16. Select cells `D25:E45`.\n\
    17. Click menu tab **Insert** ➤ **Chart** ➤ **Scatter with Smooth Lines**.\n18.\
    \ Add chart title and axis titles as desired. Our ROC chart may look similar to\
    \ Figure [5-11](#494428_2_En_5_Chapter.xhtml#Fig11).\n\n![](images/494428_2_En_5_Chapter/494428_2_En_5_Fig11_HTML.png)\n\
    \nAn ROC curve of sensitivity versus 100-specificity represents an increasing\
    \ trend. The curve emerges from the origin and spans approximately up to (95,\
    \ 91).\n\n**Figure 5-11**  \nThe ROC curve\n\nThe size of the area under the ROC\
    \ curve measures the quality of a model. A large value of the area indicates that\
    \ the model can have both good sensitivity and specificity. In a perfect model,\
    \ both the sensitivity and specificity are 100%. This means, when 100-specificity\
    \ equals 0, the sensitivity is 100. In another word, a perfect model has a ROC\
    \ curve that goes through the upper-left point. This rarely happens, however.\n\
    \nThe file `Chapter5-roc-1b.xlsx` presents the results of the preceding exercise.\n\
    \nThis wraps up another chapter. Why do we need to learn cross-validation and\
    \ ROC before we learn other data mining methods? Well, once we have the knowledge\
    \ about cross-validation and ROC, we can practice them when we learn other data\
    \ mining methods. After this chapter, we will learn logistic regression, k-nearest\
    \ neighbors, Naïve Bayes, decision trees, etc. At one point, we may want to assess\
    \ how good our models are, and that is when we can practice cross-validation and/or\
    \ ROC curve analysis.\n\n## Reinforcement Exercises\n\nThis chapter has two reinforcement\
    \ exercises, one for cross-validation and one for ROC curve analysis. It is a\
    \ good idea to go through both to reinforce your understanding. You should find\
    \ four Excel files for the two reinforcement exercises:\n\n1. `Chapter5-HW-CrossValidation.xlsx`\n\
    2. `Chapter5-HW-CrossValidation-Answers.xlsx`\n3. `Chapter5-roc-HW.xlsx`\n4. `Chapter5-roc-HW-withAnswers.xlsx`\n\
    \n## Review Points\n\n1. Residual analysis\n2. Testing dataset\n3. The holdout\
    \ method of cross-validation\n4. K-fold cross-validation and LOO cross-validation\n\
    5. What is ROC\n6. True positive, false positive, true negative, and false negative\n\
    7. Sensitivity and specificity\n8. ROC curve\n9. Excel skills and functions:\n\
    \   - Sort\n   - Scatter chart\n   - Functions `IF`, `ROUND`, and `MMULT`\n\n\
    # 6. Logistic Regression\n\nPlease download the sample Excel files from [`https://github.com/hhohho/Learn-Data-Mining-through-Excel-2`](https://github.com/hhohho/Learn-Data-Mining-through-Excel-2)\
    \ for this chapter’s exercises."
