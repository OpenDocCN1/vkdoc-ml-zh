    13.  Merge cells B22:B24; enter “Temperature” in the merged cell.


    14.  Enter “hot”, “mild”, and “cool” in cells C22, C23, and C24, respectively.'
  trans: '

    对于属性 Outlook（天气），共有 3 个值（状态）：阴天（overcast）、雨天（rainy）和晴天（sunny）；每个值分别有 4、5 和 5 个数据点。考虑阴天的情况，4
    个阴天对应 4 个“是”和 0 个“否”。因此，


    ```

    H-outlook-overcast = -(4/4×log2(4/4)+0/4×log2(0/4)) = 0.0

    ```


    注意，此处 log2(0) = 0。


    类似地，5 个雨天对应 3 个“是”和 2 个“否”，5 个晴天对应 2 个“是”和 3 个“否”。因此，


    ```

    H-outlook-rainy = -(3/5×log2(3/5)+2/5×log2(2/5)) = 0.97

    H-outlook-sunny = -(2/5×log2(2/5)+3/5×log2(3/5)) = 0.97

    ```


    这三个子熵值在求和之前必须进行加权。阴天、雨天和晴天的权重分别为 4/14、5/14 和 5/14。因此，


    ```

    H-outlook = 4/14×0.0+5/14×0.97+5/14×0.97 = 0.69

    ```


    继续对温度（Temperature）、湿度（Humidity）和风（Windy）进行此计算；我们得到


    ```

    H-temperature = 0.91

    H-humidity = 0.79

    H-windy = 0.89

    ```


    这里引入另一个概念：“信息增益”（information gain），它表示基于某个属性划分当前数据集所能获得的信息量。其定义为目标变量的熵与某个属性的熵之差。例如，Outlook
    的信息增益 = 0.94 – 0.69 = 0.25。


    信息增益可能会偏向于取值较多的属性。为了减少这种偏差，可以使用“增益率”（gain ratio）。某个属性的增益率定义为


    *   属性增益率 = 属性信息增益 / 属性固有信息


    属性的固有信息通过公式（10-2）计算：


    ![$$ S=-\sum \limits_{k=1}^C\frac{N_k}{N}{\log}_2\left(\frac{N_k}{N}\right) $$](img/494428_2_En_10_Chapter_TeX_Equ2.png)


    （10-2）


    在公式（10-2）中，*N* 表示数据量，*N*[*k*] 是给定属性值的数据点数量，而 C 是某个属性的不同取值个数。


    让我们再次以属性 Outlook 为例来应用公式（10-2）。


    *   Outlook 有三个不同的取值：阴天、雨天和晴天。因此，C = 3。


    *   有 4 个阴天；因此，N-阴天 = 4。


    *   类似地，N-雨天 = 5 且 N-晴天 = 5。


    属性 Outlook 的固有信息计算如下：


    ```

    S-outlook

    = -(4/14×Log2(4/14)+5/14×Log2(5/14)+5/14×Log2(5/14))

    = 1.58

    ```


    属性 Outlook 的最终增益率 `= (0.94–0.69)/1.58 = 0.16`。


    由于在我们的决策树示例中，信息增益是衡量节点分裂的一个良好指标，我们不会为每个属性计算增益率。相反，会选择信息增益最大的属性来分裂树节点。在这种情况下，选择
    Outlook 将树节点根据三个值（阴天、雨天和晴天）分裂为三个子节点。


    由于阴天节点的熵为 0.0，它必定是一个叶节点。另外两个节点，即雨天节点和晴天节点，可以进一步根据温度、风或湿度进行划分。


    ## 通过 Excel 学习决策树


    上述计算可能非常繁琐且容易出错。让我们使用 Excel 来简化这个过程。打开 Chapter10-1a.xlsx；里面只有一个名为 level-1 的工作表（level-1
    表示这是树节点的第一层）。Chapter10-1a.xlsx 中的数据与表 10-1 完全相同，如图 10-2 所示。


    ![](img/494428_2_En_10_Fig2_HTML.jpg)


    一张 Excel 中高尔夫数据的截图，包含 A 到 E 列以及第 1 到 14 行。列标题分别为温度、湿度、风、天气和是否打球。每个单元格都包含数据。


    图 10-2


    Excel 中的高尔夫数据


    ### 通过 Excel 学习决策树


    我们需要将数据设置在一个合适的表格中，以便能够自动填充公式。我们在前面的章节中已经见过这样的表格组织方式。


    ![](img/494428_2_En_10_Fig5_HTML.jpg)


    一张 Excel 截图。包含数据的单元格有 A22 到 A31（分别为 1, 1, 1, 2, 2, 3, 3, 4, 4, 4），B22 到 B24 是温度，C22
    是热，C23 是温和，C24 是凉爽，D21 是“是”，E21 是“否”，F21 是 p 乘以 log(p)，G21 是 p 乘以 log(p) 减去 r，H21
    是加权，I21 是熵，J21 是信息增益。


    图 10-5


    处理中的表格设置


    1.  在单元格 A16 中输入“样本大小”，在单元格 B16 中输入 14。14 是数据量。


    2.  在单元格 E17 中输入“p*log(p)”。p*log(p) 代表公式（10-1）中的 *P*[*K*]log2。


    3.  在单元格 F17 中输入“熵”。


    4.  合并单元格 B18 和 B19；在合并后的单元格中输入“是否打球”。


    5.  在单元格 C18 中输入“是”，在单元格 C19 中输入“否”。


    到目前为止，我们的工作表部分看起来像图 10-3，只是我们的工作表中单元格 D18 或 D19 没有数字。别担心，我们很快就会计算它们。


    ![](img/494428_2_En_10_Fig3_HTML.jpg)


    一张 Excel 中高尔夫数据的截图，包含 A 到 F 列以及第 14 到 20 行。包含数据的单元格有 A16 是样本大小，B16 是 14，E17 是
    p 乘以 log(p)，F17 是熵，B18 和 B19 是是否打球，C18 是“是”，C19 是“否”，D18 是 9，D19 是 5。


    图 10-3


    高尔夫数据集及“是否打球”的表格设置


    按照以下说明完成目标变量“是否打球”的熵的计算：


    6.  在单元格 D18 中，输入公式 `=COUNTIFS($E$2:$E$15,C18)`。这会统计“是否打球”中“是”的数量。


    7.  从单元格 D18 自动填充到单元格 D19。D19 统计“是否打球”中“否”的数量。


    8.  在单元格 E18 中，输入公式 `=D18/$B$16*LOG(D18/$B$16,2)`。此公式计算 P[是] × Log2(P[是])。


    9.  从 E18 自动填充到 E19。E19 计算 P[否] × Log2(P[否])。


    10. 合并单元格 F18 和 F19；在合并后的单元格中输入公式 `=-SUM(E18:E19)`。结果就是目标变量“是否打球”的熵。


    我们的工作表看起来像图 10-4。


    ![](img/494428_2_En_10_Fig4_HTML.jpg)


    一张 Excel 截图。包含数据的单元格有 A16 是样本大小，B16 是 14，E17 是 p 乘以 log(p)，F17 是熵，B18 和 B19 是是否打球，C18
    是“是”，C19 是“否”，D18 是 9，D19 是 5，E18 是 -0.40977638，E19 是 -0.53050958，F18 和 F19 是
    0.94028596。


    图 10-4


    “是否打球”的熵已计算完成


    现在是时候为四个属性设置合适的表格了。技巧在于，一旦第一个公式正确定义，如何实现垂直自动填充以处理排列在不同列中的不同属性（见图 10-2）。这听起来可能有些挑战性，但
    INDEX 函数可以提供帮助。


    函数 INDEX 需要一个数组（实际上是一个表格）作为第一个输入参数。如果第二个参数（行）为 0，则该函数返回由数组中的列号指定的列。在数据集中，温度、湿度、风和天气分别是第
    1、2、3 和 4 列。表达式 `INDEX($A$2:$E$15,0,1)` 获取温度列，而 `INDEX($A$2:$E$15,0,4)` 获取天气列。


    按照以下说明为四个属性设置辅助表格：


    11. 在单元格 A22:A31 中分别输入 1, 1, 1, 2, 2, 3, 3, 4, 4, 4。


    12. 在单元格 D21:J21 中分别输入“是”、“否”、“p*log(p)-是”、“p*log(p)-否”、“加权”、“熵”和“信息增益”。“加权”列存储每个属性值的加权熵。


    13. 合并单元格 B22:B24；在合并后的单元格中输入“温度”。


    14. 在单元格 C22、C23 和 C24 中分别输入“热”、“温和”和“凉爽”。

