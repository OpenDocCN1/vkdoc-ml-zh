    # 2. 线性回归


    请从 [`https://github.com/hhohho/Learn-Data-Mining-through-Excel-2`](https://github.com/hhohho/Learn-Data-Mining-through-Excel-2)
    下载本章练习所需的示例 Excel 文件。


    ## 总体理解


    线性回归是一种预测模型，它利用训练数据构建一个线性模型，以便对评分数据进行预测。当我们谈论线性模型时，意味着目标变量（因变量）与属性（自变量）之间的关系是线性的。在回归分析中，通常使用术语“自变量”和“因变量”。因此，在本章中，我们将用自变量替换属性，并用因变量替换目标变量。


    在线性回归分析中，可能有一个或多个自变量。当只有一个自变量时，线性模型用常见的线性函数 `y = mx + b` 表示，其中 `y` 是因变量，`m` 是直线的斜率，`b`
    是 y 轴截距。在大多数情况下，会有多个自变量；因此，线性模型表示为 `y = m`[`1`]`x`[`1`] `+ m`[`2`]`x`[`2`] `+
    ... + m`[`n`]`x`[`n`] `+ b`，其中有 `n` 个自变量，`m`[`i`] 是与特定自变量 `x`[`i`] 相关的系数，其中 `i
    = 1 ... n`。要构建这样的线性模型，我们需要根据训练数据集中已知的 `y` 和 `x`[`i`] 值来找到 `m`[`i`] 和 `b` 的值。


    让我们开始一个场景来了解线性回归能做什么。在一个南方海滩小镇，超市经理汤米正考虑根据天气预报预测冰淇淋销量。他收集了一些数据，这些数据将夏季一周内日均最高气温与冰淇淋销量联系起来。训练数据如表
    2-1 所示。


    表 2-1


    冰淇淋销量与气温的关系


    | 气温（华氏度） | 冰淇淋销量（千美元） |

    | --- | --- |

    | 91 | 89.8 |

    | 87 | 90.2 |

    | 86 | 81.1 |

    | 88 | 83.0 |

    | 92.8 | 90.9 |

    | 95.2 | 119.0 |

    | 93.3 | 94.9 |

    | 97.7 | 132.4 |


    将上述数据输入 Excel 工作表。请注意，在此场景中，气温是唯一的自变量，冰淇淋销量是因变量。根据给定的数据，汤米绘制了一个散点图。图表如图 2-1 所示。


    ![](img/494428_2_En_2_Fig1_HTML.png)


    一个散点图，绘制了销量与气温的关系，标题为“冰淇淋销量（千美元）”。数据点从 (86, 81.1) 开始，上升到 (95.2, 119)，并在 (97.7,
    132.4) 达到峰值。


