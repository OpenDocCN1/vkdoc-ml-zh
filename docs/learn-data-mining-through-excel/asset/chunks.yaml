    \ 0.77）。因此，核心特征集可能只是 A1、A7 和 A9。\n\n上述操作记录在 Chapter11-4b.xlsx 中。此时，一个好的练习是尝试使用所有特征或仅使用核心特征来运行数据挖掘方法。记住应用交叉验证来评估核心特征集是否能表现良好。\n\
    \nChapter11-5a.xlsx 和 Chapter11-6a.xlsx 旨在让你对你选择的数据挖掘方法进行交叉验证，使用所有特征或仅使用核心特征。为此，我应用了逻辑回归，因为与目标高度相关的特征有助于回归模型，如线性回归或逻辑回归（记住特征\
    \ A1 与目标具有高正相关性）。我的工作可以在 Chapter11-5b.xlsx 和 Chapter11-6b.xlsx 中找到。注意，由于目标只有两个类别（0,\
    \ 1），这是应用逻辑回归的完美案例。当然，其他数据挖掘方法如 K-NN 和朴素贝叶斯也是不错的选择。\n\n## 强化练习\n\n共有三组强化练习。\n\n\
    1.  Chapter11-HW-1a.xlsx 用于 EDA 练习。请使用它练习以下内容（必要时可参考 Chapter11-HW-1a-withAnswers.xlsx）：\n\
    \    *   记录数量\n\n    *   属性数量\n\n    *   每个属性的数据类型\n\n    *   每个数值属性的总和、均值、中位数和方差\n\
    \n    *   每个数值属性的值范围\n\n    *   分类目标和属性的唯一值\n\n    *   目标的类别分布\n\n2.  Chapter11-HW-2a.xlsx\
    \ 用于数据清洗练习。你可以在 Chapter11-HW-2a-withAnswers.xlsx 中找到标准答案。\n\n3.  Chapter11-HW-3a.xlsx\
    \ 用于特征选择练习。注意，对于此练习，没有标准答案，我仅在文件 Chapter11-HW-3a-withSuggestions.xlsx 中提供建议。\n\
    \n## 复习要点\n\n请复习以下主题和技能：\n\n1.  EDA 中的初步调查\n\n2.  缺失数据和异常值的检测\n\n3.  数据清洗\n\n\
    4.  编码，包括独热编码和序数编码\n\n5.  归一化、标准化和中位数归一化\n\n6.  数据挖掘的特征选择\n\n7.  Excel 的“删除重复项”功能\n\
    \n8.  Excel 函数 COUNT、COUNTA、MAX、MIN、AVERAGE、MEDIAN、IF、OR、ISNONTEXT、ISTEXT、ROW、CORREL、VAR.P、STDEV.P\
    \ 和 INDEX\n"
- fmt: "# 12. Association Analysis\n\nWe have learned that correlation measures the\
    \ linear association strength between two numerical variables. While correlation\
    \ study requires the two variables to be numeric and only measures the linear\
    \ relationship, association analysis has no such restriction. Association analysis\
    \ measures the strength of co-occurrence between two or more variables. It is\
    \ an effective data mining technique for cross-selling, and it also has applications\
    \ in biomedical research such as gene network study.\n\nPlease download the sample\
    \ Excel files from [`https://github.com/hhohho/Learn-Data-Mining-through-Excel-2`](https://github.com/hhohho/Learn-Data-Mining-through-Excel-2)\
    \ for this chapter’s exercises.\n\n## General Understanding\n\nThe most well-known\
    \ application of association analysis is the so-called market basket analysis,\
    \ which finds the co-occurrence of one store item (or more) with another item\
    \ within the same purchase transaction. By identifying what items are commonly\
    \ purchased together, the stores (usually retail stores or supermarkets) can take\
    \ relevant actions to increase their sales. Such actions include placing certain\
    \ items together, promoting bundle prices, etc.\n\nThe common understanding is\
    \ to find the co-occurrences among those frequently purchased items. Therefore,\
    \ the first concept we need to understand is “support percentage”, or simply speaking,\
    \ “support”. The support of an item (or itemset) is defined as the occurrence\
    \ frequency of the item (or itemset) in the transaction set. I will use the data\
    \ in Table [12-1](#494428_2_En_12_Chapter.xhtml#Tab1) to help explain the concept\
    \ of `support`.\n\nTable 12-1\n\nA sample shopping basket\n\n| Shopping basket\
    \ | Beer | Movie | Diaper | Pen | Rice | Apple | Juice |\n| --- | --- | --- |\
    \ --- | --- | --- | --- | --- |\n| 1 | 1 |   | 1 |   |   |   |   |\n| 2 | 1 |\
    \ 1 |   | 1 |   | 1 |   |\n| 3 |   |   |   |   |   | 1 | 1 |\n| 4 |   |   | 1\
    \ |   |   |   |   |\n| 5 | 1 | 1 |   |   |   |   |   |\n| 6 | 1 |   | 1 |   |\
    \ 1 |   |   |\n| 7 |   |   |   |   |   |   |   |\n| 8 | 1 | 1 | 1 |   |   |  \
    \ |   |\n| 9 | 1 | 1 |   |   |   |   |   |\n| 10 |   |   |   |   | 1 | 1 | 1 |\n\
    | 11 | 1 |   | 1 |   |   |   |   |\n| 12 |   | 1 |   |   |   |   | 1 |\n\nIn Table\
    \ [12-1](#494428_2_En_12_Chapter.xhtml#Tab1), a shopping basket represents a purchase\
    \ transaction and there are 12 transactions. Number 1 indicates that the item\
    \ appears in the specific transaction. As Beer shows up 7 times out of the 12\
    \ transactions, support of Beer = 7/12. Similarly, support of Pen = 1/12, and\
    \ support of Apple = 3/12.\n\nAnother important concept is “confidence”. Confidence\
    \ is similar to conditional probability. For example, when Beer is purchased,\
    \ how often Diaper is also purchased? This probability is expressed as `confidence\
    \ (B → D)` (Beer implies Diaper). Since when Beer is purchased, Diaper is also\
    \ purchased 4 times; thus, `confidence (B → D) = 4/7`.\n\nNote that `confidence\
    \ (D → B) = 4/5`, as Diaper is purchased 5 times and there are 4 times Beer is\
    \ purchased together with Diaper. This shows that itemset `(B, D)` is different\
    \ from itemset `(D, B)`.\n\nFollow these instructions to experience how association\
    \ analysis works:\n\n1.  Assume that the minimum support is 0.25 and the minimum\
    \ confidence is 0.6.\n\n2.  Since Pen and Rice both have support values lower\
    \ than 0.25, any itemsets containing either Pen or Rice would have a support value\
    \ less than 0.25, too. Our interested items are then limited to Beer, Movie, Diaper,\
    \ Apple, and Juice. Thus, the data to analyze are reduced as shown in Table [12-2](#494428_2_En_12_Chapter.xhtml#Tab2).\n\
    \nTable 12-2\n\nShopping basket data reduced after applying minimum support\n\n\
    | Shopping basket | Beer | Movie | Diaper | Apple | Juice |\n    | --- | --- |\
    \ --- | --- | --- | --- |\n    | 1 | 1 |   | 1 |   |   |\n    | 2 | 1 | 1 |  \
    \ | 1 |   |\n    | 3 |   |   |   | 1 | 1 |\n    | 4 |   |   | 1 |   |   |\n  \
    \  | 5 | 1 | 1 |   |   |   |\n    | 6 | 1 |   | 1 |   |   |\n    | 7 |   |   |\
    \   |   |   |\n    | 8 | 1 | 1 | 1 |   |   |\n    | 9 | 1 | 1 |   |   |   |\n\
    \    | 10 |   |   |   | 1 | 1 |\n    | 11 | 1 |   | 1 |   |   |\n    | 12 |  \
    \ | 1 |   |   | 1 |\n\n3.  Assume that we are only interested in itemsets containing\
    \ at least two items. There are totally 20 different itemsets of size `(5 choose\
    \ 2) × 2`. Assessing them by hand would be very tedious and error prone, though\
    \ it is still doable. Only four itemsets `(Movie, Beer)`, `(Diaper, Beer)`, `(Apple,\
    \ Juice)`, and `(Juice, Apple)` pass the confidence requirement. However, both\
    \ `(Apple, Juice)` and `(Juice, Apple)` fail the support criteria as their support\
    \ values are less than 0.25, which leaves only two itemsets of size 2. The result\
    \ is illustrated in Table [12-3](#494428_2_En_12_Chapter.xhtml#Tab3).\n\nTable\
    \ 12-3\n\nItemsets of size 2 only\n\n| Itemset | Support | Confidence | Itemset\
    \ | Support | Confidence |\n    | --- | --- | --- | --- | --- | --- |\n    | `(B,\
    \ M)` | 4/10 | 4/7 | `(M, A)` | 1/10 | 1/5 |\n    | `(M, B)` | 4/10 | 4/5 | `(A,\
    \ M)` | 1/10 | 1/3 |\n    | `(B, D)` | 4/10 | 4/7 | `(M, J)` | 1/10 | 1/5 |\n\
    \    | `(D, B)` | 4/10 | 4/5 | `(J, M)` | 1/10 | 1/3 |\n    | `(B, A)` | 1/10\
    \ | 1/7 | `(D, A)` | 0 | 0 |\n    | `(A, B)` | 1/10 | 1/3 | `(A, D)` | 0 | 0 |\n\
    \    | `(B, J)` | 0 | 0 | `(D, J)` | 0 | 0 |\n    | `(J, B)` | 0 | 0 | `(J, D)`\
    \ | 0 | 0 |\n    | `(M, D)` | 1/10 | 1/5 | `(A, J)` | 2/10 | 2/3 |\n    | `(D,\
    \ M)` | 1/10 | 1/5 | `(J, A)` | 2/10 | 2/3 |\n\n4.  Examining itemsets of size\
    \ 3 can now only happen inside the three items: Beer, Movie, and Diaper. There\
    \ are six different itemsets: `(B, {M, D})`, `(M, {B, D})`, `(D, {B, M})` and\
    \ `({M, D}, B)`, `({B, D}, M)`, `({B, M}, D)`. However, Beer, Movie, and Diaper\
    \ co-occur only once; itemsets of size 3 would all fail the minimum support requirement,\
    \ that is, there is no itemset of size 3 that meets the requirements. When there\
    \ is no itemset of size 3, definitely there is no itemset of size 4 or 5 that\
    \ can pass the criteria.\n\nConclusion: The preceding association analysis identified\
    \ only two meaningful itemsets, `(Movie, Beer)` and `(Diaper, Beer)`, based on\
    \ the given minimum support and confidence values."
