    **图7-8**

    在K-NN模型中应用加权投票


    在此实验中，我们使用的截止值是0.5，即如果接受概率大于0.5，我们认为Daisy的响应为“是”，否则为“否”。将0.5设为截止值是一个自然的决定。然而，在通过交叉验证评估我们的K-NN模型时，选择不同的截止值并进行ROC分析会很有趣。


    我们能否进一步改进加权K-NN模型？答案可能是肯定的。不难注意到，属性“收入”对距离的贡献最大，而属性“拥有卡片数”贡献最小。我们理解不同的属性对确定Daisy的响应可能有不同的影响，这是开发数据挖掘模型时业务理解阶段的一部分。然而，当我们不清楚哪个属性贡献更大时，最好对所有属性一视同仁。因此，有必要对所有三个属性进行归一化，使它们处于同一尺度，例如0-100。


    ### 实验3


    归一化可以通过不同的方式完成。Z-score归一化基于数据的方差。在本实验中，我们执行范围归一化，即所有属性都基于其各自的最大值和最小值进行归一化。


    我们希望范围是0-100。因此，每个属性的最小值和最大值分别被转换为0和100。


    让我们按照以下分步说明来执行此实验：


    1. 打开`Chapter7-3a.xlsx`。在单元格`J1:J6`和`K1:K6`中，输入如图[7-9](#494428_2_En_7_Chapter.xhtml#Fig9)所示的文本或公式。这些值是三个属性的实际范围。


    ![](images/494428_2_En_7_Chapter/494428_2_En_7_Fig9_HTML.jpg)


    一个表格展示了一组用于计算最大年龄、最小年龄、最大收入、最小收入、最大卡片数和最小卡片数的公式。公式中指明了单元格范围。


    **图7-9**

    定义范围


    归一化值的表达式为`100 / (max – min) * (value – min)`。请注意，对于给定的属性，如果其最大值等于最小值，此表达式可能会失败。然而，这种情况非常罕见。当这种情况发生时，该属性没有方差，因此对我们的数据挖掘项目没有价值。我将在后面介绍探索性数据分析（EDA）的章节中讨论这一点。


    2. 在单元格`F11`、`G11`和`H11`中，分别输入“normalized age”、“normalized income”和“normalized
    cards”。


    3. 在单元格`F12`中，输入以下公式，然后从`F12`自动填充到`F211`：


    ```

    =100/($K$1-$K$2)*(B12-$K$2)

    ```


    4. 在单元格`G12`中，输入以下公式，然后从`G12`自动填充到`G211`：


    ```

    =100/($K$3-$K$4)*(C12-$K$4)

    ```


    5. 在单元格`H12`中，输入以下公式，然后从`H12`自动填充到`H211`：


    ```

    =100/($K$5-$K$6)*(D12-$K$6)

    ```


