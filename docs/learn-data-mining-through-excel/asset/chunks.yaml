    \n1.  Enter the texts Temperature, Humidity, Windy, and Outlook in cells F1, G1,\
    \ H1, and I1, respectively. Enter “<>” (without quotation marks) in cells F2:I2\\\
    . “<>” means “not equal” in Excel. Refer to Figure [10-18](#494428_2_En_10_Chapter.xhtml#Fig18).\n\
    \n![](images/494428_2_En_10_Chapter/494428_2_En_10_Fig19_HTML.jpg)\n\nAn Excel\
    \ screenshot represents the computation results. The column headers include yes,\
    \ no, p asterisk log of p minus yes, p asterisk log of p minus r, weighted, entropy,\
    \ and info gain.\n\nFigure 10-19\n\nThe computation results of the better approach\n\
    \n1.  Enter the following formula in cell B16:\n\n```\n    =COUNTIFS(A2:A15,F2,B2:B15,\
