    \mathrm{p}\left(\mathrm{deep}\ |\ \mathrm{yes}\right)\times \mathrm{p}\left(\mathrm{yes}\right)}{\mathrm{p}\left(\mathrm{big}|\mathrm{yes}\right)\times
