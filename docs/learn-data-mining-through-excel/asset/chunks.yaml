  trans: "\n# 12. 关联分析\n\n我们已经了解到，相关性衡量的是两个数值变量之间的线性关联强度。相关性研究要求两个变量必须是数值型，且仅衡量线性关系，而关联分析则没有这种限制。关联分析衡量的是两个或多个变量之间共同出现的强度。它是一种用于交叉销售的有效数据挖掘技术，并且在生物医学研究（如基因网络研究）中也有应用。\n\
    \n请从 [`https://github.com/hhohho/Learn-Data-Mining-through-Excel-2`](https://github.com/hhohho/Learn-Data-Mining-through-Excel-2)\
    \ 下载本章练习所需的示例 Excel 文件。\n\n## 总体理解\n\n关联分析最著名的应用是所谓的购物篮分析，它找出在同一笔购买交易中一个（或多个）商品与另一个商品共同出现的情况。通过识别哪些商品经常被一起购买，商店（通常是零售店或超市）可以采取相关措施来增加销售额。这些措施包括将某些商品摆放在一起、推广捆绑价格等。\n\
    \n通常的理解是找出那些频繁购买的商品之间的共同出现关系。因此，我们需要理解的第一个概念是“支持度百分比”，或者简单地说，“支持度”。一个商品（或项集）的支持度定义为该商品（或项集）在交易集中出现的频率。我将使用表\
    \ 12-1 中的数据来帮助解释*支持度*的概念。\n\n表 12-1\n\n一个示例购物篮\n\n| 购物篮 | 啤酒 | 电影 | 尿布 | 笔 | 大米\
    \ | 苹果 | 果汁 |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| 1 | 1 |  \
    \ | 1 |   |   |   |   |\n| 2 | 1 | 1 |   | 1 |   | 1 |   |\n| 3 |   |   |   |\
    \   |   | 1 | 1 |\n| 4 |   |   | 1 |   |   |   |   |\n| 5 | 1 | 1 |   |   |  \
    \ |   |   |\n| 6 | 1 |   | 1 |   | 1 |   |   |\n| 7 |   |   |   |   |   |   |\
    \   |\n| 8 | 1 | 1 | 1 |   |   |   |   |\n| 9 | 1 | 1 |   |   |   |   |   |\n\
    | 10 |   |   |   |   | 1 | 1 | 1 |\n| 11 | 1 |   | 1 |   |   |   |   |\n| 12 |\
    \   | 1 |   |   |   |   | 1 |\n\n在表 12-1 中，一个购物篮代表一笔购买交易，共有 12 笔交易。数字 1 表示该商品出现在该特定交易中。由于啤酒在\
    \ 12 笔交易中出现了 7 次，因此啤酒的支持度 = 7/12。类似地，笔的支持度 = 1/12，苹果的支持度 = 3/12。\n\n另一个重要概念是“置信度”。置信度类似于条件概率。例如，当购买啤酒时，同时购买尿布的频率是多少？这个概率表示为置信度\
    \ (B → D)（啤酒蕴含尿布）。由于当购买啤酒时，尿布也被购买了 4 次；因此，置信度 (B → D) = 4/7。\n\n请注意，置信度 (D → B)\
    \ = 4/5，因为尿布被购买了 5 次，其中有 4 次啤酒与尿布一起购买。这表明项集 (B, D) 与项集 (D, B) 是不同的。\n\n请按照以下说明来体验关联分析是如何工作的：\n\
    \n1.  假设最小支持度为 0.25，最小置信度为 0.6。\n\n2.  由于笔和大米的支持度值都低于 0.25，任何包含笔或大米的项集的支持度值也会低于\
    \ 0.25。那么我们感兴趣的商品就仅限于啤酒、电影、尿布、苹果和果汁。因此，要分析的数据缩减为表 12-2 所示。\n\n表 12-2\n\n应用最小支持度后缩减的购物篮数据\n\
    \n| 购物篮 | 啤酒 | 电影 | 尿布 | 苹果 | 果汁 |\n    | --- | --- | --- | --- | --- | --- |\n\
    \    | 1 | 1 |   | 1 |   |   |\n    | 2 | 1 | 1 |   | 1 |   |\n    | 3 |   |  \
    \ |   | 1 | 1 |\n    | 4 |   |   | 1 |   |   |\n    | 5 | 1 | 1 |   |   |   |\n\
    \    | 6 | 1 |   | 1 |   |   |\n    | 7 |   |   |   |   |   |\n    | 8 | 1 | 1\
    \ | 1 |   |   |\n    | 9 | 1 | 1 |   |   |   |\n    | 10 |   |   |   | 1 | 1 |\n\
    \    | 11 | 1 |   | 1 |   |   |\n    | 12 |   | 1 |   |   | 1 |\n\n3.  假设我们只对包含至少两个商品的项集感兴趣。总共有\
    \ 20 个不同的二元项集，即 ![$$ \\left(\\begin{array}{c}5\\\\ {}2\\end{array}\\right)\\times\
    \ 2 $$](img/494428_2_En_12_Chapter_TeX_IEq1.png) 。手动评估它们会非常繁琐且容易出错，尽管仍然可行。只有四个项集\
    \ (电影, 啤酒)、(尿布, 啤酒)、(苹果, 果汁) 和 (果汁, 苹果) 通过了置信度要求。然而，(苹果, 果汁) 和 (果汁, 苹果) 都未能满足支持度标准，因为它们的支持度值小于\
    \ 0.25，因此只剩下两个二元项集。结果如表 12-3 所示。\n\n表 12-3\n\n仅限二元项集\n\n| 项集 | 支持度 | 置信度 | 项集\
    \ | 支持度 | 置信度 |\n    | --- | --- | --- | --- | --- | --- |\n    | (B, M) | 4/10\
    \ | 4/7 | (M, A) | 1/10 | 1/5 |\n    | (M, B) | 4/10 | 4/5 | (A, M) | 1/10 | 1/3\
    \ |\n    | (B, D) | 4/10 | 4/7 | (M, J) | 1/10 | 1/5 |\n    | (D, B) | 4/10 |\
    \ 4/5 | (J, M) | 1/10 | 1/3 |\n    | (B, A) | 1/10 | 1/7 | (D, A) | 0 | 0 |\n\
    \    | (A, B) | 1/10 | 1/3 | (A, D) | 0 | 0 |\n    | (B, J) | 0 | 0 | (D, J) |\
    \ 0 | 0 |\n    | (J, B) | 0 | 0 | (J, D) | 0 | 0 |\n    | (M, D) | 1/10 | 1/5\
    \ | (A, J) | 2/10 | 2/3 |\n    | (D, M) | 1/10 | 1/5 | (J, A) | 2/10 | 2/3 |\n\
    \n4.  现在，只能在这三个商品（啤酒、电影和尿布）内部检查三元项集。共有六个不同的项集：(B, {M, D})、(M, {B, D})、(D, {B,\
    \ M}) 以及 ({M, D}, B)、({B, D}, M)、({B, M}, D)。然而，啤酒、电影和尿布仅共同出现一次；所有三元项集都将无法满足最小支持度要求，也就是说，不存在满足要求的三元项集。当没有三元项集时，肯定也没有四元或五元项集能通过标准。\n\
    \n结论：根据给定的最小支持度和置信度值，上述关联分析仅识别出两个有意义的项集，即 (电影, 啤酒) 和 (尿布, 啤酒)。\n"
- fmt: '# Learn Association Analysis Through Excel


    Let’s open `Chapter12-1a.xlsx` which contains 1831 records for 371 receipts (transactions).
    The 1831 records were selected and preprocessed from a much larger online retail
    dataset which is provided by UCI Machine Learning Repository at [`https://doi.org/10.24432/C5BW33`](https://doi.org/10.24432/C5BW33).
    Part of the data looks like Figure [12-1](#494428_2_En_12_Chapter.xhtml#Fig1).


    ![](images/494428_2_En_12_Chapter/494428_2_En_12_Fig1_HTML.jpg)


    A screenshot of a spreadsheet represents the details of receipt number, quantity,
    and item code. There are 11 rows denoting the details of the receipt numbers 1,
    2, 3, and 4.


    Figure 12-1


    Market basket data


    The data in `Chapter12-1a.xlsx` are sorted based on Receipt numbers. Column A
    presents the receipt numbers, column C shows the items on a receipt and there
    are 50 distinct items numbered from `I1` to `I50`, and column B lists the purchased
    quantities of each item on a receipt. For example, rows 2–6 showcase items `I28`,
    `I46`, `I47`, `I48`, and `I50` are on Receipt 1. Let’s ignore the purchase quantity
    in this study.


    For association analysis, the data in `Chapter12-1a.xlsx` must be reorganized
    as Table [12-1](#494428_2_En_12_Chapter.xhtml#Tab1). Follow these instructions
    to organize the data in `Chapter12-1a.xlsx`:


    ![](images/494428_2_En_12_Chapter/494428_2_En_12_Fig2_HTML.jpg)


    A screenshot of a spreadsheet represents the details of receipt number, quantity,
    and item code. Column A represents the receipt numbers between 1 and 7, while
    column D denotes the number of receipts are 15.


    Figure 12-2


    Organize the data


    1.  Enter `“Receipt#”` in cell `D1`.


    2.  As there are 371 receipts numbering from 1 to 371, enter `1` in cell `D2`
    and `2` in cell `D3`. Select both cells `D2` and `D3`; autofill down to cell `D372`.


    3.  Enter `“I1”` in cell `E1`, then horizontally autofill from cell `E1` to cell
    `BB1`. The cells `E1:BB1` contain the item numbers `I1`, `I1`, …, `I50`. Part
    of our worksheet looks like Figure [12-2](#494428_2_En_12_Chapter.xhtml#Fig2).


    ![](images/494428_2_En_12_Chapter/494428_2_En_12_Fig4_HTML.jpg)


    A spreadsheet represents a list of values of `I50` under column `BB`, Occurrences
    from `I1` to `I16` under column `BE`, and the values of `I1` to `I10` ranging
    in the columns between `BF` and `BO`.


    Figure 12-4


    Set up the association table


    1.  An item showing up on a receipt should have numerical value `1` in the corresponding
    cell. For example, cell `L7` should have value `1` as item `I8` is on receipt
    #6. Similarly, since `I28` is on receipt #1, cell `AF2` should have value `1`,
    too. Cells `E2`, `F2`, and `G2` should have value `0` inside as items `I1`, `I2`,
    and `I3` are not on receipt #1. We need a formula to assign `1` under the item
    if it is on a receipt; otherwise, assign `0`. Enter in cell `E2` the following
    formula:


    ```

    =COUNTIFS($A$2:$A$1832,$D2,$C$2:$C$1832,E$1)

    ```


    In this formula, `“$A$2:$A$1832,$D2”` returns `A2:A6` because `$D2` matches `1`.
    However, none of the cells inside `A2:A6` has a value in column C equaling `E$1`
    (`I1`). Thus, this formula returns `0` in cell `E2`.


    2.  Autofill the formula from `E2` to cell `BB2`, and then autofill together to
    cells `E372:BB372`. Part of our data would look like Figure [12-3](#494428_2_En_12_Chapter.xhtml#Fig3).


    ![](images/494428_2_En_12_Chapter/494428_2_En_12_Fig3_HTML.jpg)


    A screenshot of a spreadsheet represents the details of the item code and receipt
    number, along with the values of `I1`, `I2`, `I3`, `I4`, `I5`, `I6`, `I7`, `I8`,
    `I9`, and `I10`. There are 21 rows in the table.


    Figure 12-3


    Create the data table for association analysis


    We are going to examine all possible itemsets of size 2 in this example; therefore,
    we need to set up a table such that both the rows and columns of the table are
    marked by each item. Later, we also need to compute both the confidence and support
    values for each itemset. For that, we need to calculate (1) the number of times
    two items co-occur on a single receipt and (2) the number of receipts on which
    an item appears.'
