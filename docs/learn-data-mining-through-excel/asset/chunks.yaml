    # 4. Linear Discriminant Analysis


    Please download the sample Excel files from [`https://github.com/hhohho/Learn-Data-Mining-through-Excel-2`](https://github.com/hhohho/Learn-Data-Mining-through-Excel-2)
    for this chapter’s exercises.


    ## General Understanding


    Linear discriminant analysis (LDA) is similar to linear regression and k-means
    clustering, but different from both, too. K-means clustering is an unsupervised
    classification method; LDA is supervised since its classification is trained on
    known data, however. The predictive results are quantitatively numerical in linear
    regression, while they are qualitatively categorical in LDA.


    LDA tries to find the best linear function that can separate data points into
    distinct categories or groups. The variances between group means should be as
    large as possible, while the variances inside each group should be as small as
    possible. Note that the variances are computed after every data point has been
    projected to a linear function `P = w`[`1`]`x`[`1`] `+ w`[`2`]`x`[`2`] `+ ...
    + w`[`n`]`x`[`n`] `+ b`. The training dataset is used to find the best `P` function
    which is represented by the parameter set (`w`[`1`]`,w`[`2`]`...,w`[`n`]`,b`).
    Figure [4-1](#494428_2_En_4_Chapter.xhtml#Fig1) demonstrates the concept in two
    dimensions.


    ![](images/494428_2_En_4_Chapter/494428_2_En_4_Fig1_HTML.png)


    An illustration depicts line P best projection axis and line A poor projection
    axis.


    Figure 4-1


    LDA is to separate groups


    Given a set S of training data points which have already been sorted into different
    groups, the three steps of applying LDA can be simplified as follows:


    Step 1: Sum the inter-group variances via the following expression:


    ![$$ Sg=\kern0.5em \sum \limits_i^k{s}_g=\sum \limits_{i=1}^k{\left({\overline{x}}_i-\overline{x}\right)}^2
    $$](images/494428_2_En_4_Chapter/494428_2_En_4_Chapter_TeX_Equ1.png)


    (4-1)


    where k is the number of groups, ![$$ \overline{x} $$](images/494428_2_En_4_Chapter/494428_2_En_4_Chapter_TeX_IEq1.png)
    is the mean of group means, and ![$$ {\overline{x}}_i $$](images/494428_2_En_4_Chapter/494428_2_En_4_Chapter_TeX_IEq2.png)
    is the mean of an individual group.


    Step 2: Sum the within-group variances via the following expression:


    ![$$ {S}_w=\sum \limits_i^k\sum \limits_{\dot{j}}^n{\left({x}_{ij}-{\overline{x}}_i\right)}^2
    $$](images/494428_2_En_4_Chapter/494428_2_En_4_Chapter_TeX_Equ2.png)


    (4-2)


    where n is the number of data points in a group.


    Step 3: `P` is the best projection linear function such that Sg(P)/Sw(P) is maximized.
    As `P` is defined by (`w`[`1`]`,w`[`2`]`,...,w`[`n`]`,b`), the model construction
    phase of LDA is to solve for (`w`[`1`]`,w`[`2`]`,...,w`[`n`]`,b`). This is explained
    in Equation ([4-3](#494428_2_En_4_Chapter.xhtml#Equ3)):


    ![$$ {\mathrm{w}}_1{\mathrm{x}}_1+{\mathrm{w}}_2{\mathrm{x}}_2+\dots +{\mathrm{w}}_{\mathrm{n}}{\mathrm{x}}_{\mathrm{n}}+\mathrm{b}=\max
    \left( Sg\left(\mathrm{P}\right)/ Sw\left(\mathrm{P}\right)\right) $$](images/494428_2_En_4_Chapter/494428_2_En_4_Chapter_TeX_Equ3.png)


    (4-3)


    The least square method can be applied to solve for (`w`[`1`]`,w`[`2`]`,...,w`[`n`]`,b`)
    first. We can then further optimize (`w`[`1`]`,w`[`2`]`,...,w`[`n`]`,b`) by using
    Excel Solver.'
