  trans: '

    ### 归一化与标准化


    为了使所有数值属性处于同一量级，有两种常用方法：归一化与标准化。


    标准化等同于计算每个值的 Z 分数，即通过公式（11-1）将属性的每个值转换为其对应的 Z 分数：


    ![$$ z=\frac{x-\mu }{\sigma } $$](img/494428_2_En_11_Chapter_TeX_Equ1.png)


    （11-1）


    其中 *x* 是属性的单个值，*μ* 是属性的均值，*σ* 是属性的标准差。


    归一化，即传统的归一化方法，是将所有数值按比例放大或缩小到同一范围，通常为 0–1 或 0–100。


    这两种方法都可用于将数值属性转换到同一量级。然而，它们各有优缺点。此外，我个人认为，当需要保留方差时，另一种归一化方法——中位数归一化——比传统归一化方法和标准化方法都更为合适。中位数归一化常用于基因表达的生物信息学研究。要比较这三种方法，请打开
    Excel 文件 `Chapter11-scale-a.xlsx`。图 11-11 将立即呈现在您眼前。


    ![](img/494428_2_En_11_Fig11_HTML.jpg)


    该截图包含三个虚构属性，如 A1、A2 和 A3。


    图 11-11

    三个虚构属性 A1、A2 和 A3


    到目前为止，我们对传统归一化有了一些经验，可以看出属性 A2 很容易被缩放到与 A1 相同。那么属性 A3 呢？好吧，让我们先在“归一化”部分（E–G 列）将这三个属性都归一化到
    0–100 的范围。在单元格 E3 中输入以下公式，从 E3 自动填充到 G3，然后一起自动填充到 E12:G12：


    ```

    =(B3-MIN(B$3:B$12))/(MAX(B$3:B$12)-MIN(B$3:B$12))*100

    ```


    一切看起来不错。现在，让我们将公式（11-1）应用于这三个属性，在 H3 中输入以下公式，自动填充到 J3，然后一起自动填充到 H12:J12：


    ```

    =(B3-AVERAGE(B$3:B$12))/STDEV.P(B$3:B$12)

    ```


    这里，我们将这十条记录视为整个总体，因此对属性 A1 应用函数 `STDEV.P`。观察 H3:J12 中的值，既有负值也有正值。


    请注意，通过上述两种方法，属性 A1、A2 和 A3 被转换成了相同的值。这种情况在现实中不太可能发生。我这样设计是为了演示目的。


    一个好的转换应该保留数据的方差。因此，在 B13 中输入公式 `=VAR.P(B3:B12)`，然后自动填充到 J13。此时，您的工作表应如图 11-12
    所示。


    ![](img/494428_2_En_11_Fig12_HTML.jpg)


    该 Excel 电子表格截图包含原始数据、归一化、标准化以及中位数归一化数据。


    图 11-12

    归一化和标准化均未能保留某些属性的方差


    图 11-12 显示，归一化和标准化都使这三个属性具有相同的方差。由于 A2 = 100 x A1，我们可以认同 A1 和 A2 在经过归一化或标准化后应具有相同的方差。但原始的
    A3 似乎方差很小，却被归一化/标准化为与 A1 或 A2 相同的方差。


    中位数归一化是一种可以将属性缩放到相同范围并保留方差的方法。它基于中位数对属性进行缩放。该方法首先选择一个参考属性，例如 A1。然后假设所有其他属性应与参考属性具有相同的中位数。最后，根据该属性与参考属性之间的两个中位数的比值，对该属性进行缩放。


    因此，在 K3 中输入以下公式，自动填充到 M3，然后一起自动填充到 K12:M12：


    ```

    =B3/(MEDIAN(B$3:B$12)/MEDIAN($B$3:$B$12))

    ```


    同时，从 J13 自动填充到 M13。您的工作表应如图 11-13 所示。


    ![](img/494428_2_En_11_Fig13_HTML.jpg)


    该 Excel 电子表格展示了通过中位数归一化保留了 A3 的方差。


    图 11-13

    中位数归一化方法保留了属性方差


    图 11-13 说明，通过中位数归一化，A3 的方差也得到了保留。


    在数据挖掘项目中，是否进行归一化或标准化以及如何进行，始终是一个需要复杂评估的难题。在许多情况下，我们只能通过多轮实验后才能确定。


    ### 相关性


    相关性衡量两个数值变量或属性之间的线性关联强度。该强度由相关系数表示，其取值范围必须在-1 到 1 之间（含端点）。给定两个变量 X 和 Y，如果它们正相关，则
    X 和 Y 同向变化。例如，X 是每日气温，Y 是冰淇淋销量。X 越高，Y 越大；或 X 越低，Y 越小。如果 X 和 Y 负相关，则它们反向变化。例如，汽车里程数与汽车重量。当相关系数接近零时，X
    和 Y 之间不存在相关性。在 Excel 中，通过函数 `CORREL` 计算相关系数非常简单。如图 11-14 所示。


    ![](img/494428_2_En_11_Fig14_HTML.jpg)


    该 Excel 电子表格展示了相关性计算公式。


    图 11-14

    在 Excel 中计算相关性

