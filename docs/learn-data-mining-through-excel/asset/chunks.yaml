  trans: "\n一张 Excel 表格展示了计算出的误差。\n\n图 13-20\n\n计算出的误差\n\n1.  在即将出现的菜单中，确保选中“保留规划求解解”选项。至此，我们的结果应如图\
    \ 13-18 所示。\n\n![](img/494428_2_En_13_Fig18_HTML.jpg)\n\n一张 Excel 表格显示了第 1 层参数的优化数据。\n\
    \n图 13-18\n\n仅优化了第 1 层参数\n\n第 1 层的转换数据是第 2 层神经元的输入。请按照以下说明完成第 2 层的输入聚合和数据转换：\n\
    \n2.  合并单元格 R9:T9；在合并后的单元格中输入“第二隐藏层聚合”。\n\n3.  分别在单元格 R10、S10 和 T10 中输入数字 1、2\
    \ 和 3。\n\n4.  在单元格 R11 中输入以下公式：\n\n```\n    =SUMPRODUCT($M11:$O11,INDEX($I$2:$K$4,R$10,\
    \ 0))+INDEX($L$2:$L$4,R$10,1)\n    ```\n\n此公式使用函数 `SUMPRODUCT` 聚合第 1 层的转换数据。其数学方程类似于\
    \ y = w1x2 + w2x2 + w3x3 + b。\n\n5.  将单元格 R11 自动填充至单元格 T11，然后一起自动填充至单元格 R182:T182。\n\
    \n6.  我们将再次使用 sigmoid 函数来转换第 2 层数据。但是，我们不想再次对数据进行归一化。当然，如果愿意，我们也可以在应用 sigmoid\
    \ 转换之前，再次将数据归一化到 [-1, 1] 范围内。合并单元格 U9:W9；在合并后的单元格中输入“第二层转换”。\n\n7.  分别在单元格 U10、V10\
    \ 和 W10 中输入数字 1、2 和 3。\n\n8.  在单元格 U11 中输入公式 `=1/(1+EXP(-R11))`，自动填充至单元格 W11，然后一起自动填充至单元格\
    \ U182:W182。\n\n9.  在单元格 X10 中输入“输出-2”。\n\n10.  在单元格 Y10 中输入“误差-2”。\n\n工作表的一部分应如图\
    \ 13-19 所示。\n\n![](img/494428_2_En_13_Fig19_HTML.jpg)\n\n一张包含第 2 层数据转换（未归一化）的\
    \ Excel 表格。\n\n图 13-19\n\n第 2 层数据转换（未归一化）\n\n以下说明指导我们如何继续：\n\n11.  在单元格 X11 中输入公式\
    \ `=MMULT(U11:W11,$M$2:$M$4)+$N$2` 以生成输出。\n\n12.  从 X11 自动填充至 X182。\n\n13.  在单元格\
    \ Y11 中输入公式 `=(F11-X11)²` 以计算误差。\n\n14.  从 Y11 自动填充至 Y182。\n\n15.  在单元格 S1 中输入“误差总和\
    \ 2”。\n\n16.  在单元格 T1 中输入公式 `=SUM(Y11:Y182)`。\n\n工作表的一部分应如图 13-20 所示。\n\n1.  让我们再次使用规划求解来优化所有权重和偏置。单击“数据”➤“规划求解”启动规划求解，并设置规划求解参数，如图\
    \ 13-21 所示。\n\n![](img/494428_2_En_13_Fig21_HTML.jpg)\n\n规划求解参数窗口的截图。设置目标包含 $T$1。通过更改可变单元格选项包含\
    \ $B$2:$N$4。\n\n图 13-21\n\n再次使用规划求解优化所有层的参数集\n\n经过规划求解对权重和偏置进行优化后，工作表的一部分应如图 13-22\
    \ 所示。由于模型变得更加复杂，您的结果可能与图 13-22 略有不同。不必感到惊讶。\n\n![](img/494428_2_En_13_Fig22_HTML.jpg)\n\
    \n一张 Excel 表格的截图，展示了优化后的数据。\n\n图 13-22\n\n通过规划求解优化所有参数\n\n像往常一样，我们现在需要设置截止点。请遵循以下说明：\n\
