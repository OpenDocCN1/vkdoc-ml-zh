    数据表的额外设置


    2.  分别在单元格 `F1`、`G1`、`H1` 和 `I1` 中输入文本 `Temperature`、`Humidity`、`Windy` 和 `Outlook`。在单元格
    `F2:I2` 中输入 `<>`（不带引号）。`<>` 在 Excel 中表示“不等于”。请参考图 [10-18](#494428_2_En_10_Chapter.xhtml#Fig18)。


    ![](images/494428_2_En_10_Chapter/494428_2_En_10_Fig19_HTML.jpg)


    一个 Excel 截图展示了计算结果。列标题包括 `yes`、`no`、`p * log(p) - yes`、`p * log(p) - r`、`weighted`、`entropy`
    和 `info gain`。


    **图 10-19**


    更好方法的计算结果


    3.  在单元格 `B16` 中输入以下公式：


    ```

    =COUNTIFS(A2:A15,F2,B2:B15, G2,C2:C15,H2,D2:D15,I2)

    ```


    由于单元格 `F2:I2` 都包含 `<>`，上述公式实际上并未为函数 `COUNTIFS` 设置任何条件。单元格 `B16` 中的值仍然是 14。


    4.  在单元格 `D18` 中，将公式修改为：


    `=COUNTIFS($E$2:$E$15,C18,$A$2:$A$15,F$2, $B$2:$B$15,G$2,$C$2:$C$15,H$2,$D$2:$D$15,I$2)`


    此公式将单元格 `F2:I2` 中的条件考虑在内。


    5.  从单元格 `D18` 自动填充到单元格 `D19`。


    6.  在单元格 `D22` 中，将公式修改为：


    ```

    =COUNTIFS(INDEX($A$2:$E$15,0,$A22),$C22, $E$2:$E$15,D$21,$A$2:$A$15,$F$2,$B$2:$B$15,
    $G$2,$C$2:$C$15,$H$2,$D$2:$D$15,$I$2)

    ```


    此公式也将单元格 `F2:I2` 中的条件考虑在内。


    7.  从单元格 `D22` 自动填充到单元格 `E22`，然后将单元格 `D22:E22` 一起自动填充到单元格 `D31:E31`。


    此时，此工作表中的所有内容都应自动计算完成。我们工作表的一部分看起来与图 [10-19](#494428_2_En_10_Chapter.xhtml#Fig19)
    完全一致，这与我们之前得到的结果相同。


    8.  我们将再次拆分节点 `rainy(3, 2)`。像之前一样，复制工作表 `level-1` 并将新工作表重命名为 `level-2-rainy`。在工作表
    `level-2-rainy` 的单元格 `I2` 中，输入 `rainy`，如图 [10-20](#494428_2_En_10_Chapter.xhtml#Fig20)
    所示。仅此而已！此工作表中的所有计算都由 Excel 自动完成。


    ![](images/494428_2_En_10_Chapter/494428_2_En_10_Fig20_HTML.jpg)


    一个 Excel 截图，包含 A 到 I 列以及 1 到 15 行。F 到 I 列的列标题是 `temperature`、`humidity`、`windy`
    和 `outlook`。单元格 `I2` 的数据是 `rainy`，并被高亮显示。


    **图 10-20**


    工作表 `level-2-rainy` 概览


    9.  要拆分节点 `sunny(2, 3)`，请复制工作表 `level-2-rainy` 并将新工作表重命名为 `level-2-sunny`。在工作表
    `level-2-sunny` 中，将单元格 `I2` 中的文本更改为 `sunny`，如图 [10-21](#494428_2_En_10_Chapter.xhtml#Fig21)
    所示。同样，仅此而已。所有计算都由 Excel 为我们自动完成。


    ![](images/494428_2_En_10_Chapter/494428_2_En_10_Fig21_HTML.jpg)


    一个 Excel 截图，包含 A 到 I 列以及 1 到 15 行。F 到 I 列的列标题是 `temperature`、`humidity`、`windy`
    和 `outlook`。单元格 `I2` 的数据是 `sunny`，并被高亮显示。


    **图 10-21**


    工作表 `level-2-sunny` 概览'
  raw: "An Excel screenshot represents the entropy and information gain values for\
