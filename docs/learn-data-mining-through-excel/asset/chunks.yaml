  trans: "\n3.  在对单词进行分词之前，我们需要通过“选择性粘贴”（粘贴数值）将 C 列中的句子复制到 D 列。如果不这样做，我们即将使用的 Excel\
    \ 功能“分列”将会拆分 C 列中的公式，而不是文本值。让我们将 C1:C34 单元格的值复制并粘贴到 D 列。工作表的一部分如图 14-9 所示。\n\n\
    ![](img/494428_2_En_14_Fig10_HTML.jpg)\n\n工具选项卡“分列”位于 Excel 的主选项卡“数据”下方。点击主选项卡“数据”后，工具选项卡“分列”会与数据工具一同显示。\n\
    \n图 14-10\n\n工具选项卡“分列”位于主选项卡“数据”下方\n\n1.  工具选项卡“分列”位于 Excel 的主选项卡“数据”下方。点击主选项卡“数据”后，工具选项卡“分列”会显示出来。请参考图\
    \ 14-10。\n\n![](img/494428_2_En_14_Fig11_HTML.jpg)\n\n“文本分列向导”步骤 2/3 的截图。选择最能描述数据的分隔符号。下一步按钮被高亮显示。\n\
    \n图 14-11\n\n选择分隔符号并点击下一步\n\n1.  选中 D 列，点击工具选项卡“分列”；会弹出一个菜单。如图 14-11 所示，选择“分隔符号”。\n\
    \n![](img/494428_2_En_14_Fig12_HTML.jpg)\n\n“文本分列向导”步骤 2/3 的截图。选择分隔符号，如制表符、分号、逗号、空格等。勾选“将连续分隔符号视为单个处理”复选框。下一步按钮被高亮显示。\n\
    \n图 14-12\n\n通过分隔符将句子拆分为单词\n\n1.  点击“下一步”；在下一个菜单中，选择所有分隔符，并在“其他”旁边的框中输入句点“.”，如图\
    \ 14-12 所示。\n\n1.  在下一个菜单中，点击“完成”，如图 14-13 所示。注意：目标区域是单元格 D1。通过选择 D1 作为目标区域，分词后的单词将被放置在以\
    \ D 列开头的区域。这意味着 D 列中的原始文本将被替换。\n\n![](img/494428_2_En_14_Fig13_HTML.jpg)\n\n“文本分列向导”步骤\
    \ 3/3 的截图。选择列数据格式为“常规”，目标区域为$D$1。在数据预览中选择“常规”。下一步按钮被高亮显示。\n\n图 14-13\n\n目标区域为\
    \ D1\n\n至此，我们工作表的一部分如图 14-14 所示。\n\n![](img/494428_2_En_14_Fig14_HTML.jpg)\n\n\
    一个包含部分酒店分词单词的表格截图。该表格由十列和八行组成。分词后的单词包括：the, cozy, wonderful, best, back, hotels,\
    \ fantastic, environment, choice, great, utterly, ridiculous, products, has, a,\
    \ get 等。\n\n图 14-14\n\n分词单词一览\n\n![](img/494428_2_En_14_Fig15_HTML.jpg)\n\n一个包含被替换为空格的停用词表格截图。该表格由十列和八行组成。单词包括：cozy,\
    \ wonderful, best, back, hotels, fantastic, environment, choice, great, utterly,\
    \ ridiculous, products, what, you 等。\n\n图 14-15\n\n停用词被替换为空\n\n1.  我们的下一步是移除停用词。为此，我们需要先将每个停用词替换为空。分词单词的最右侧列是\
    \ N 列，因此在单元格 O1 中输入以下公式：\n\n```\n    =IF(OR(ISBLANK(D1),COUNTIFS(stw,D1)>0),\"\
    \",D1)\n    ```\n\n有些句子较短，有些较长。这会在工作区域中留下一些空白单元格，如图 14-14 所示。\n\n`ISBLANK(D1)`\
    \ 判断 D1 是否为空白单元格。`COUNTIFS(stw,D1)>0` 判断 D1 是否为停用词。`OR(ISBLANK(D1),COUNTIFS(stw,D1)>0)`\
    \ 如果至少有一个判断结果为 TRUE，则返回 TRUE。在这种情况下，单元格 O1 被赋值为空。否则，单元格 O1 被赋予单元格 D1 中的内容。\n\n\
    移除短单词（例如，移除所有长度小于等于 3 的单词）是一种常见技巧。不过，我们在本练习中不采用此技巧。\n\n2.  从单元格 O1 自动填充到 O34，然后一起自动填充到单元格\
    \ Y1:Y34。工作表的一部分如图 14-15 所示。\n\n![](img/494428_2_En_14_Fig16_HTML.jpg)\n\n从句子中移除停用词后的酒店评论截图。评论内容为：hotel\
    \ fantastic, environment great, cozy, breakfast has high-quality products but\
    \ lacks choice, price utterly ridiculous what you get, what wonderful hotel, not\
    \ bad all, come back, one best hotels。\n\n图 14-16\n\n移除停用词后\n\n1.  为了移除停用词，我们的计划是：将包含停用词的单元格清空，然后为每个句子连接剩余的单词，最后应用“分列”功能重新分词。保持\
    \ Z 列不变。在单元格 AA1 中输入以下公式：\n\n```\n    =IF(ISBLANK(O1)=FALSE,TRIM(Z1 & \" \" &\
    \ O1), TRIM(Z1 & \"\"))\n    ```\n\n当我们水平自动填充此公式时，它会累积单元格中的文本，但会跳过空白单元格。由于 Z 列保持不变，Z\
    \ 列中的单元格都是空白单元格。如果 `ISBLANK(O1)=FALSE`，即单元格 O1 不是空白单元格，则将 AA1 之前的单元格（Z1）与 O1 连接起来。否则，单元格\
    \ AA1 仅保留其前一个单元格的内容。\n\n自 Office 2019 或 Office 365 起，Excel 新增了一个名为 TEXTJOIN 的函数，它可以：\n\
    \    *   连接多个区域中的文本\n\n*   忽略空单元格\n\n*   并插入所需的分隔符\n\n如果你的 Excel 可用，TEXTJOIN 函数绝对比前面的公式好得多。假设它可用，则：\n\
    \    *   忽略前面的公式。\n\n*   在单元格 AK1 中输入公式 `=TEXTJOIN(\" \",TRUE,O1:Y1)`。\n\n*  \
    \ 从单元格 AK1 自动填充到单元格 AK34。\n\n*   并跳过以下步骤（步骤 11）。\n\n2.  从单元格 AA1 自动填充到单元格 AK1，然后一起自动填充到单元格\
    \ AA34:AK34。AK 列保存了不含停用词的句子。请查看图 14-16。\n\n![](img/494428_2_En_14_Fig17_HTML.jpg)\n\
    \n一个包含部分酒店重新分词单词的表格截图。该表格由十列和十一行组成。重新分词后的单词包括：cozy, wonderful, best, back, hotels,\
    \ fantastic, environment, choice, great, utterly, ridiculous, products, have,\
    \ all, get 等。\n\n图 14-17\n\n重新分词后的单词\n\n1.  复制单元格 AK1:AK34，并仅将数值粘贴到 AL 列。\n\n\
    2.  使用工具选项卡“分列”对 AL 列中的文本进行分词。请参考步骤 4-7。工作表的一部分如图 14-17 所示。\n\n![](img/494428_2_En_14_Fig18_HTML.jpg)\n\
    \n一个包含 2-gram 短语的表格截图。该表格由五列和八行组成。2-gram 短语包括：hotel fantastic, environment great,\
    \ best hotels, ridiculous what, what you, come back, price utterly, has high quality,\
    \ products but, bad all 等。\n\n图 14-18\n\n2-gram 短语\n\n1.  为了生成 2-gram 短语，在单元格\
    \ AU1 中输入以下公式：\n\n```\n    =IF(AND(ISBLANK(AL1)=FALSE, ISBLANK(AM1)=FALSE),AL1\
    \ & \" \" & AM1,\"\")\n    ```\n\n此公式确保仅当单元格 AL1 和 AM1 都不是空白单元格时，才会在单元格 AU1 中创建一个\
    \ 2-gram 短语。\n\n2.  从单元格 AU1 自动填充到 BB1，然后一起从单元格 AU1:BB1 自动填充到单元格 AU34:BB34。\n\n\
    我们的 2-gram 短语如图 14-18 所示。请注意，第 2 行没有 2-gram 短语。另请注意，最后一个 2-gram 短语位于 BB 列（图 14-18\
    \ 中未显示）。\n"
- fmt: "![](images/494428_2_En_14_Chapter/494428_2_En_14_Fig19_HTML.jpg)\n\nA screenshot\
    \ of polarity scores for tokenized words in 15 rows and 8 columns. The words are\
    \ the hotel it is fantastic, the environment it is great, cozy, breakfast has\
    \ high-quality products but it lacks in choice, price utterly ridiculous for what\
    \ you get, 10 stars, everything ok, and others.\n\n**Figure 14-19** Polarity scores\
    \ computed for tokenized words and 2-grams\n\n1.  All words are tokenized in cells\
    \ `AL1:BB34`, including both single words and 2-gram phrases. It is time to calculate\
    \ the scores for each sentence. In cell `BC1`, enter the following formula:\n\n\
    \    ```\n    =IFERROR(INDEX(kws, MATCH(AL1, kw, 0), 1), 0)\n    ```\n\n    This\
    \ formula calculates the polarity score for the word in cell `AL1` (“hotel”).\n\
    \n    When the `MATCH` function cannot find an exact match of `AL1` in the keyword\
    \ array (represented by the name `kw`), it gives a `#NA` error. Thus, the `IFERROR`\
    \ function guarantees when there is no such keyword and therefore a `#NA` error\
    \ occurs, `0` is returned. When `MATCH` function succeeds, it returns the word\
    \ position in the array `kw`. This position is fed to the function `INDEX` to\
    \ find the corresponding score in the keyword score array (represented by `kws`).\n\
    \n    Pay close attention to the expression `INDEX(kws, MATCH(AL1, kw, 0), 1)`.\
    \ The last parameter inside `MATCH` function is `0`, indicating an exact match\
    \ is demanded. The last parameter inside the `INDEX` function is `1` since `kws`\
    \ has only one column.\n\n2.  Autofill from cell `BC1` to cell `BS1`, then autofill\
    \ together to cells `BC34:BS34`. `BC1:BS34` is a sparse matrix. Part of our worksheet\
    \ looks like Figure [14-19](#494428_2_En_14_Chapter.xhtml#Fig19).\n\n![](images/494428_2_En_14_Chapter/494428_2_En_14_Fig20_HTML.jpg)\n\
    \nA screenshot of exhibits some hotel reviews with polarity score in 19 rows and\
    \ 4 columns. The words are the hotel it is fantastic, the environment it is great,\
    \ cozy, breakfast has high-quality products but it lacks in choice, price utterly\
    \ ridiculous for what you get, 10 stars, everything ok, and others.\n\n**Figure\
    \ 14-20** Sentiment analysis of hotel reviews\n\n1.  In cell `BT1`, enter the\
    \ formula `=SUM(BC1:BS1)`. This formula sums up all the scores for the first sentence.\n\
    \n2.  Autofill from cell `BT1` to cell `BT34`.\n\n3.  In cell `BU1`, enter the\
    \ formula:\n\n    ```\n    =IF(BT1>0,\"Positive\", IF(BT1=0,\"Neutral\",\"Negative\"\
    ))\n    ```\n\n    If the summed score is positive, the sentence is considered\
    \ positive. If the summed score is `0`, the sentence is considered neutral, otherwise\
    \ negative.\n\n4.  Autofill from cell `BU1` to cell `BU34`.\n\n5.  By freezing\
    \ column B (click column B ➤ click View ➤ click Freeze Panes ➤ select Freeze Panes),\
    \ our final result can be viewed as Figure [14-20](#494428_2_En_14_Chapter.xhtml#Fig20).\n\
    \nThe complete text mining work is available in `Chapter14-1b.xlsx` and `Chapter14-1c.xlsx`.\n\
    \n`Chapter14-1b.xlsx` does not make use of the function `TEXTJOIN`, while `Chapter14-1c.xlsx`\
    \ does.\n\nA careful examination of our result reveals that our text mining model\
    \ does not work well for reviews 9, 15, 16, 20, and 26. This does not mean our\
    \ mining job is a failure. Reviews 9 (“10 stars!”), 15 (“A five star stay!”),\
    \ and 20 (“Not cheap, but worthy.”) can be properly assessed by adding more keywords.\
    \ Review 26 (“want to say ‘Thanks’ to all of you!”) can also be properly assessed\
    \ by applying the stemming technique.\n\nSome words imply the same meaning though\
    \ they are different in writing, for example, “thanks” and “thank you”. Other\
    \ examples could be “book” and “books”, “imply” and “implies”, etc. “Thanks”,\
    \ “books”, and “implies” are all derived from their basic stems (“thank”, “book”,\
    \ and “imply”). Reducing words to their basic stems is called stemming in text\
    \ mining. Certainly, reducing “thanks” to “thank” can assess review 26 to be positive.\n\
    \nWhat is really challenging is review 16 (“Come back again is not even a question.”).\
    \ We understand this is a positive comment, but many computer algorithms will\
    \ fail to recognize it as such. It is because of sentences like this that text\
    \ mining is a very challenging and complex task. This chapter only provides a\
    \ learning and education example. Therefore, I won’t explain how to handle such\
    \ a sentence in this book.\n\nText mining can also identify the words that appear\
    \ the most frequently in reviews, comments, and customer support inquires. Words\
    \ of high term frequency can inform us of the common issues that customers are\
    \ facing. Term frequency (TF) can also be used together with another concept,\
    \ inverse document frequency (IDF), to rank the web pages in a web search.\n\n\
    Certainly, Excel is not suitable for ranking web pages. This is one example showing\
    \ the limitation of applying Excel in data mining. However, Excel is becoming\
    \ more and more powerful in data mining or machine learning by more and more add-ins,\
    \ though this book tries to demonstrate the use of Excel without additional add-ins."
