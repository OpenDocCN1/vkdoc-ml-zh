  trans: "\n## 通过 Excel 学习层次聚类\n\n让我们打开包含十条数据记录的 `Chapter8-2a.xlsx` 文件。使用 Excel 演示记录过多的层次聚类并不实际，因为树状图的创建和层次聚类过程都需要相当多的人工操作。本章的目的是让你体验层次聚类的工作原理，因此无需从过多记录开始。\n\
    \n你可能已经注意到，这十条记录来自 `Chapter3-1a.xlsx` 的前十条数据。这些记录对应十个国家 L1、L2、……、L10（B 列）。我们的任务是对这十个数据点进行层次聚类，然后观察它们之间的相对距离或相似性。\n\
    \n请按照以下说明执行前面介绍的层次聚类算法：\n\n![](img/494428_2_En_8_Fig10_HTML.jpg)\n\n屏幕显示一个表格，包含与步骤\
    \ 1 到步骤 10 相关的数据，以及国家、谋杀、袭击、城市人口和强奸等属性，并附有每个步骤对应的数值。\n\n图 8-10\n\n层次聚类的初始步骤\n\n\
    1.  在单元格 G1:P1 中，依次输入文本“Step-1”、“Step-2”、“Step-3”、“Step-4”、“Step-5”、“Step-6”、“Step-7”、“Step-8”、“Step-9”和“Step-10”。你可以在\
    \ G1 单元格中输入“Step-1”，然后自动填充至 P1 来实现。\n\n2.  为了更好地区分 C:F 列中的原始数据与各个步骤，建议将 G1:P1\
