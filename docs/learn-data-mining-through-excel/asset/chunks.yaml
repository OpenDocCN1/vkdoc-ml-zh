  trans: "\n### 通过最大化对数似然\n\n请打开文件 `Chapter6-1a.xlsx`，其中包含 87 个样本，工作表顶部有 4 个空白行。这些空白行是特意留出的。\n\
    \n我们将再次使用 Excel 函数 `INDEX` 和 `LINEST`，基于最小二乘法获取系数。由于 `LINEST` 返回的第一个值对应基因 5，最后一个值对应系数\
    \ `b`，我们需要按图 6-2 所示设置顶部两个空白行。这样设置是为了方便后续的自动填充。\n\n![](img/494428_2_En_6_Fig2_HTML.jpg)\n\
    \n一张电子表格截图，显示了患者 ID、基因 1、基因 2、基因 3、基因 4、基因 5 和 5 年生存率的详细信息。B 列到 G 列顶部的一组值被高亮显示。\n\
    \n图 6-2\n为最小二乘法系数设置数据\n\n请按照以下说明在 Excel 中进行逻辑回归练习：\n\n![](img/494428_2_En_6_Fig6_HTML.jpg)\n\
    \n一张电子表格截图，显示了 P(1)、结果、差异、似然和对数似然的值。在表格顶部，J 列表示总差异的公式，K 列的值为 53，L 列显示文本“待最大化”，M\
    \ 列的值为 -63.03342831。\n\n图 6-6\n计算出的似然\n\n1.  在单元格 B3 和 B4 中输入以下公式：\n\n```\n  \
    \  =INDEX(LINEST($G$6:$G$92,$B$6:$F$92),1,B1)\n```\n\n在两个单元格中输入相同公式的原因是，我们希望保留一组系数不变，同时让另一组系数能被规划求解修改。\n\
    \n注意，`LINEST` 函数中的“known_ys”参数是单元格 `$G$6:$G$92`，这些单元格只有两个值：1 和 0。这表明，如果我们的原始目标值不是\
    \ 1 和 0，则必须将其归类为此类。\n\n2.  将 B3 自动填充至 G3，并将 B4 自动填充至 G4。\n\n3.  在单元格 H5 中输入文本“m1x1+m2x2+…+b”。H\
    \ 列代表方程 (6-3) 的右侧表达式。\n\n4.  在单元格 H6 中输入以下公式，并自动填充至单元格 H92：\n\n```\n    =SUMPRODUCT($B$4:$F$4,B6:F6)+$G$4\n\
    ```\n\n函数 `SUMPRODUCT` 计算两个数组的乘积。注意，单元格引用 B4、F4 和 G4 使用了绝对引用。\n\n5.  在单元格 I5 中输入文本“P(1)”。I\
    \ 列代表基于 H 列值计算出的五年生存概率。\n\n6.  在单元格 I6 中输入以下公式，并自动填充至单元格 I92：\n\n```\n    =1/(1+EXP(0-H6))\n\
    ```\n\n该公式实现了方程 (6-4)。`(0-H6)` 表示 −(*m*[1]*x*[1] + *m*[2]*x*[2] + ⋯ + *m*[*n*]*x*[*n*]\
    \ + *b*)，而 `EXP(0-H6)` 代表 ![$$ {e}^{-\\left({m}_1{x}_1+{m}_2{x}_2+\\cdots +{m}_n{x}_n+b\\\
    right)} $$](img/494428_2_En_6_Chapter_TeX_IEq1.png)。函数 `EXP` 返回常数 `e`（自然对数的底数）的幂。至此，工作表的一部分应如图\
    \ 6-3 所示。\n\n![](img/494428_2_En_6_Fig3_HTML.jpg)\n\n一张电子表格截图，显示了 7 个患者 ID 的基因\
    \ 1、基因 2、基因 3、基因 4、基因 5、5 年生存率、m1x1 + m2x2 和 P(1) 的详细信息。顶部标出了两组值，分别对应 m1 到 m5\
    \ 以及 b。\n\n图 6-3\n计算出的 P(1)\n\n此时，了解最小二乘法生成的系数在区分两组患者（存活超过五年和未存活超过五年）方面的效果会很有趣。\n\
    \n7.  在单元格 J5 中输入“结果”，并在单元格 J6 中输入公式 `=IF(I6>0.5,1,0)`。该公式规定，如果 I 列的概率大于 0.5（此处\
    \ 0.5 为临界值），则患者的预测结果为 1，否则为 0。\n\n8.  从单元格 J6 自动填充至单元格 J92。\n\n9.  在单元格 K5 中输入“差异”，并在单元格\
    \ K6 中输入公式 `=IF(G6=J6,0,1)`。该公式断言，如果 J 列中的预测结果与 G 列中的实际结果匹配，则返回 0；否则返回 1。\n\n\
    10. 从单元格 K6 自动填充至单元格 K92。\n\n11. 在单元格 J2 中输入“总差异=”，并在单元格 K2 中输入公式 `=SUM(K6:K92)`。通过统计数组\
    \ K6:K92 中 1 的个数，我们可以知道有多少预测与实际结果不匹配。\n\n注意，单元格 K2 中的值为 53。这表明 87 个样本中有 53 个被错误分类。如图\
    \ 6-4 所示，该图显示了当前工作表的一部分。\n\n![](img/494428_2_En_6_Fig4_HTML.jpg)\n\n一张电子表格截图，显示了基因\
    \ 3、基因 4、基因 5、5 年生存率、m1x1 + m2x2、P(1)、结果和差异的详细信息。顶部以两组形式标出了 m3、m4、m5 和 b 的值。总差异为\
    \ 53。\n\n图 6-4\n检查临时分类结果\n\n如果你的工作表结果与图 6-4 所示不同，请仔细检查公式，尤其是单元格 H6:K6 中的公式。图 6-5\
    \ 显示了到目前为止输入的一些公式。请确保你的公式与图 6-5 中的一致。\n\n![](img/494428_2_En_6_Fig5_HTML.jpg)\n\
    \n一张电子表格截图，显示了 m1x1 + m2x2 + ... + b、P(1)、结果和差异的值。J 列表示总差异的公式，而 K 列包含 K6 到 K92\
    \ 值之和的公式。\n\n图 6-5\n检查到目前为止输入的公式\n\n12. 继续，在单元格 L5 中输入“似然”。\n\n13. 在单元格 L6 中输入\
    \ `=IF(G6=1,I6,1-I6)`。该公式断言，如果实际结果为 1，则似然为 I6；否则，似然为 `1–I6`。\n\n14. 从单元格 L6 自动填充至单元格\
    \ L92。\n\n15. 我们需要将所有似然值视为一个整体。有多种方法可以做到这一点，例如对 L6:L92 中的所有值求和，或计算 L6:L92 的乘积。我在这里要介绍的是每个似然值的对数之和。在单元格\
    \ M5 中输入文本“Ln(似然)”。\n\n16. 在单元格 M6 中输入公式 `=IF(L6=0, -1000000, LN(L6))`，然后从单元格\
    \ M6 自动填充至单元格 M92。此处，当似然为 0 时，预定义的最小值为 -1000000。\n\n17. 在单元格 L1 中输入“待最大化”。\n\n\
    18. 在单元格 M1 中输入公式 `=SUM(M6:M92)`。单元格 M1 存储了将由规划求解最大化的值。\n\n工作表的一部分应如图 6-6 所示。\n\
    \n![](img/494428_2_En_6_Fig7_HTML.jpg)\n\n一张标题为“规划求解参数”的对话框截图。它显示了设置目标、更改可变单元格、修改约束条件以及选择求解方法的设置。底部高亮显示了一个“求解”按钮。\n\
    \n图 6-7\n使用规划求解最大化似然\n\n1.  下一步是使用规划求解最大化单元格 M1 中的值。选择单元格 M1 ➤ 单击主选项卡“数据” ➤ 单击“规划求解”。\n\
    \n2.  出现一个菜单，供我们选择适当的单元格并设置要求。按照图 6-7 进行操作：\n    1.  为“设置目标”选择单元格 $M$1。\n    2.\
    \  为“通过更改可变单元格”选择 $B$4:$G$4。\n    3.  如图 6-7 所示，选择“最大值”。\n    4.  选择求解方法“GRG 非线性”。注意，“使无约束变量为非负数”复选框未被选中。\n\
    \n![](img/494428_2_En_6_Fig8_HTML.jpg)\n"
- fmt: "# Solver Result Dialog Box\n\nA screenshot of a dialog box titled \"Solver\
    \ Result\". It represents the settings to keep the solver solution, restore original\
    \ values, and generate reports of the answer, sensitivity, and limits. A message\
    \ at the bottom reads: \"The solver has converged to the current solution. All\
    \ constraints are satisfied.\"\n\n**Figure 6-8**\n\n## Keep Solver Solution\n\n\
    1. Click the button `Solve`. Another menu shows up on which make sure that \"\
    Keep Solver Solution\" is chosen as shown in Figure [6-8](#494428_2_En_6_Chapter.xhtml#Fig8).\n\
    \nThe number of mistakenly classified samples is reduced to 12, as shown in Figure\
    \ [6-9](#494428_2_En_6_Chapter.xhtml#Fig9) (cell `K2`). Observe that the values\
    \ inside cells `B4:G4` are changed, that is, optimized by Solver to maximize the\
    \ value inside cell `M1`. They are different from values inside `B3:G3`.\n\n![](images/494428_2_En_6_Chapter/494428_2_En_6_Fig9_HTML.jpg)\n\
    \nA screenshot of a spreadsheet represents the values of Gene 5, 5-year survival,\
    \ `m1 * 1 + m2 * 2 + ... + b`, `P1`, outcome, difference, likelihood, and `ln`\
    \ of likelihood. The values of `m5`, `b`, total difference, and \"To-maximize\"\
    \ are denoted at the top.\n\n**Figure 6-9**  \nThe result of logistic regression\
    \ by means of maximizing log likelihoods\n\nRecall at step 15, I mentioned that\
    \ we can compute the value in cell `M1` differently. For example, we can enter\
    \ the formula `=SUM(L6:L92)` or `=PRODUCT(L6:L92)` in cell `M1`, or substitute\
    \ `LOG` function for `LN` function in `M6:M92`, and then use Solver to maximize\
    \ the value in `M1` by optimizing the coefficients in cells `B4:G4`. I would like\
    \ to challenge you to try these formulas and compare your results with the method\
    \ used in this book. You can also try other methods, too.\n\nThe aforementioned\
    \ process is stored in the file `chapter6-1b.xlsx`. `Chapter6-1b.xlsx` also includes\
    \ some scoring data in `A1:J101`. Please take a look so that you are confident\
    \ how to apply the constructed logistic regression model to scoring data. Again,\
    \ the model is just a set of parameters. In this specific case, the set of parameters\
    \ are in `B4:G4`.\n\n## By Means of Minimizing Log Losses\n\n\"Loss function\"\
    \ is a phrase that appears very often in machine learning. What is it? Well, we\
    \ have used it before in linear regression. In linear regression, the least square\
    \ method is used to minimize the prediction error, commonly called mean square\
    \ error or quadratic loss, which is the sum of the squares of the differences\
    \ between predictions and actual values (see Equation 2-1). Here, Equation 2-1\
    \ is a bona fide loss function. Thus, we can tell that a loss function is just\
    \ a mathematical function that quantifies the error between the predicted and\
    \ actual values in a machine learning method. Indeed, we can understand \"loss\"\
    \ as \"error\" in this sense.\n\nGenerally speaking, there are two types of losses\
    \ in machine learning: regression loss and classification loss. Equation 2-1 is\
    \ a type of regression loss. The \"total diff\", that is, the number of mistakenly\
    \ classified samples in cell `K2` which we used earlier in step 11, is a type\
    \ of classification loss.\n\nA loss function usually works with an optimization\
    \ function which helps a machine learning model to minimize the loss. In this\
    \ book, we won't explain optimization function, but we have been using one optimization\
    \ function employed by the GRG Nonlinear algorithm of Excel Solver to maximize\
    \ a target value. However, when using a loss function, we want to minimize the\
    \ target value.\n\nLet's open the file `Chapter6-2a.xlsx`. You shall notice that\
    \ the work in this worksheet is near completion as shown in Figure [6-10](#494428_2_En_6_Chapter.xhtml#Fig10).\
    \ Yes, as explained before, log loss is the negation of log of likelihood. So,\
    \ we do not need to repeat the steps up to the calculation of likelihoods but\
    \ restart from step 16 to compute the log loss for each likelihood.\n\n![](images/494428_2_En_6_Chapter/494428_2_En_6_Fig10_HTML.jpg)\n\
    \nA screenshot of a spreadsheet represents the values of gene 1, gene 2, gene\
    \ 3, gene 4, gene 5, 5-year survival, `m1 * 1 + m2 * 2 + ... + b`, `P1`, outcomes,\
    \ difference, and likelihood. The values of `m1` to `m5`, `b`, and the total difference\
    \ are denoted at the top.\n\n**Figure 6-10**  \nThe starting point of computing\
    \ the log loss\n\n1. Enter the formula `=IF(L6=0, 1000000, -LN(L6))` in cell `M6`,\
    \ then autofill from cell `M6` to cell `M92`. Here, the predefined maximum loss\
    \ is 1000000 when the likelihood is 0.\n\n2. In cell `L1`, enter \"To-Minimize\"\
    .\n\n3. Enter the formula `=SUM(M6:M92)` in cell `M1`. Cell `M1` stores the value\
    \ to be minimized by Solver.\n\n4. The next step is to minimize the value inside\
    \ cell `M1` by using Solver. Select cell `M1` ➤ click the main tab Data ➤ click\
    \ Solver.\n\n5. A menu shows up for us to select proper cells and set up requirements.\
    \ Follow Figure [6-11](#494428_2_En_6_Chapter.xhtml#Fig11) to:\n   - Select cell\
    \ `$M$1` for \"Set Objective\".\n   - Select `$B$4:$G$4` for \"By Changing Variable\
    \ Cells\".\n   - Choose \"Min\" as shown in Figure [6-11](#494428_2_En_6_Chapter.xhtml#Fig11).\n\
    \   - Select the solving method \"GRG Nonlinear\".\n\n![](images/494428_2_En_6_Chapter/494428_2_En_6_Fig11_HTML.jpg)\n\
    \nA screenshot of a dialog box titled \"Solver Parameters\". It highlights the\
    \ settings to set the objective to the minimum, change variable cells from `B4`\
    \ to `G4`, and select the solving method as GRG Nonlinear. The Solve button is\
    \ highlighted at the bottom.\n\n**Figure 6-11**  \nUsing Solver to minimize the\
    \ log loss\n\n6. Click the button `Solve`. Another menu shows up on which make\
    \ sure that \"Keep Solver Solution\" is chosen.\n\nPart of our worksheet should\
    \ look like Figure [6-12](#494428_2_En_6_Chapter.xhtml#Fig12).\n\n![](images/494428_2_En_6_Chapter/494428_2_En_6_Fig12_HTML.jpg)\n\
    \nA screenshot of a spreadsheet represents the values of gene 5, 5-year survival,\
    \ `m1 * 1 + m2 * 2 + ... + b`, `P1`, outcome, difference, likelihood, and log\
    \ loss. The values of `m5`, `b`, total difference, and \"To-minimize\" are denoted\
    \ at the top.\n\n**Figure 6-12**  \nThe result of logistic regression by means\
    \ of minimizing log losses\n\nThe completed result can be found in `Chapter6-2b.xlsx`.\
    \ You shall notice that the result generated by log loss is the same as that by\
    \ likelihood.\n\nThis summarizes another chapter. Certainly, Excel is fairly capable\
    \ of carrying out logistic regression analysis.\n\n## Reinforcement Exercises\n\
    \nThe reinforcement exercises make use of the Heart Disease dataset downloaded\
    \ from UCI Machine Learning Repository at [`http://archive.ics.uci.edu/dataset/45/heart+disease`](http://archive.ics.uci.edu/dataset/45/heart%252Bdisease)\
    \ (more details can be found at: [`https://doi.org/10.24432/C52P4X`](https://doi.org/10.24432/C52P4X)).\n\
    \n- `Chapter6-HW-1.xlsx` is for practicing the logistic regression process. `Chapter6-HW-1-withAnswers.xlsx`\
    \ presents two solutions: one by maximizing log likelihood and one by minimizing\
    \ log loss.\n- `Chapter6-HW-2-cross-validation.xlsx` provides an additional exercise\
    \ for practicing cross-validation as we have just learned cross-validation.\n\
    - `Chapter6-HW-2-cross-validation-withAnswers.xlsx` presents a reference solution\
    \ for the cross-validation exercise.\n\n## Review Points\n\n1. The mechanism of\
    \ logistic regression\n2. Logistic function, sigmoid function, and odds\n3. The\
    \ assumption that log of odds is a linear function\n4. The concept of likelihood\
    \ and log loss\n5. Excel functions `IF`, `INDEX`, `LINEST`, `SUMPRODUCT`, `EXP`,\
    \ and `LN`\n6. The use of Solver\n\n# 7. K-Nearest Neighbors\n\nPlease download\
    \ the sample Excel files from [`https://github.com/hhohho/Learn-Data-Mining-through-Excel-2`](https://github.com/hhohho/Learn-Data-Mining-through-Excel-2)\
    \ for this chapter's exercises."
