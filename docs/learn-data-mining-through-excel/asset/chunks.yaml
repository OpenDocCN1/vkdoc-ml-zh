- fmt: "### Learn Feature Selection Through Excel\n\n打开文件`Chapter11-4a.xlsx`，你会发现有两个工作表：`cleaned-crx`和`encoded`。工作表`cleaned-crx`与`Chapter11-3b.xlsx`中的对应工作表相同。然而，我们将从工作表`encoded`开始进行特征选择。如果你比较这两个工作表，你会意识到工作表`encoded`在A列中多了一个名为`Customer`的属性。添加此列是为了作为每条记录的ID。此外，在工作表`encoded`中，所有分类属性都已转换为数值属性（整数）。在这里，我执行了“编码”操作，使数据为特征选择操作做好准备。\n\
    \n一些数据挖掘方法只能处理数值，因此将分类值转换为数值（这个过程称为“编码”）非常常见。有两种常用的编码方案：独热编码和序数编码。使用哪一种取决于分类属性的类型。一般来说，所有分类属性可以分为两类：名义型或序数型。名义型分类属性没有特定顺序，例如，眼睛的颜色（黄色、黑色、棕色、蓝色）。序数型分类属性有特定顺序，例如，等级A、B、C、D、F。\n\
    \n独热编码通常适用于名义型分类属性，它会为每个类别创建一个值为0或1的新属性。例如，假设我们有一个名为`EyeColor`的属性，它有三个类别：黄色、黑色和蓝色。独热编码会将这个`EyeColor`属性替换为三个新属性，可能命名为`yellow`、`black`和`blue`，每个对应一种眼睛颜色。新属性`yellow`中的1值表示存在黄色眼睛颜色，而0值表示不存在黄色眼睛颜色。同样的方案适用于`black`和`blue`属性。\n\
    \n序数编码要简单得多。给定等级A、B、C、D、F，我们可以简单地将它们转换为4–0或0–4。由于我们使用的样本数据集没有提供关于分类属性的任何有意义信息，我对所有分类属性应用了序数编码。\n\
    \n按照以下说明在Excel中练习特征选择。\n\n![](images/494428_2_En_11_Chapter/494428_2_En_11_Fig15_HTML.jpg)\n\
    \n规范化后的Excel工作表截图。\n\n**图 11-15**\n\n**规范化属性**\n\n1.  复制工作表`encoded`，并将新工作表重命名为`normalized`。\n\
    \n2.  在工作表`normalized`的单元格B2中，输入以下公式：\n\n```\n=IFERROR((encoded!B2-MIN(encoded!B$2:B$647))/(MAX(encoded!B$2:B$647)-MIN(encoded!B$2:B$647))*100,\
    \ encoded!B2)\n```\n\n此公式将属性A1中B2的值规范化为0–100范围。\n\n3.  从B2自动填充到P2，然后从B2:P2自动填充到B647:P647。我们规范化后的工作表部分应如图[11-15](#494428_2_En_11_Chapter.xhtml#Fig15)所示。\n\
    \n![](images/494428_2_En_11_Chapter/494428_2_En_11_Fig16_HTML.jpg)\n\nExcel中每个规范化属性方差的截图。\n\
    \n**图 11-16**\n\n**每个规范化属性的方差**\n\n1.  在单元格A648中，输入`Variance`。\n\n2.  在B648中输入`=VAR.P(A2:B647)`，然后自动填充到P648。我们工作表的部分应如图[11-16](#494428_2_En_11_Chapter.xhtml#Fig16)所示。\n\
    \n![](images/494428_2_En_11_Chapter/494428_2_En_11_Fig17_HTML.jpg)\n\n展示计算出的相关矩阵的Excel电子表格。\n\
    \n**图 11-17**\n\n**计算相关矩阵**\n\n1.  从图[11-16](#494428_2_En_11_Chapter.xhtml#Fig16)中，我们可以看出除了A15之外，所有属性都有相当数量的方差。显然，A1具有最大的方差。\n\
    \n2.  我们的下一步是创建一个相关矩阵，显示每两个属性之间的相关性。两个属性之间的高正或负相关系数表明这两个属性在讲述相同的数据故事。要创建相关矩阵，请创建一个新工作表并将此工作表重命名为`correlation`。\n\
    \n3.  在工作表`correlation`中，分别在单元格B1:Q1中输入整数1–16。一种快速的方法是自动填充这些数字。\n\n4.  在单元格A2:A17中自动填充整数1–16。\n\
    \n5.  在B2中输入以下公式，自动填充到Q2，然后一起自动填充到B17:Q17：\n\n`=CORREL(INDEX(normalized!$B$2:$Q$647,$A2,0),INDEX(normalized!$B$2:$Q$647,B$1,0))`\n\
    \n6.  在单元格B18中输入`A1`，然后自动填充到P18。我们的工作表应如图[11-17](#494428_2_En_11_Chapter.xhtml#Fig17)所示。\n\
    \n1.  我们首先应该查看的是Q列或第17行，它们标记了目标与其他属性之间的相关系数。我们将意识到A1与目标具有最大的相关系数，表明A1与目标共享了许多数据故事，也就是说，A1可能是目标的一个良好指标。由于A1也具有最大的方差，我们当然应该将A1选入核心特征集。\n\
    \n2.  选择A1之后，我们应该寻找与A1相关系数小的独立属性。一个很好的候选是A7。我们选择它。\n\n3.  下一个候选是A9。对于A9，我们必须检查它与A1和A7的相关系数。\n\
    \n4.  我们应该选择A4还是A14？嗯，它们与A1的相关系数处于中等偏高水平，但它们与A9或A7的相关系数很高（分别为0.70和0.77）。因此，核心特征集可能只是A1、A7和A9。\n\
    \n上述操作记录在`Chapter11-4b.xlsx`中。此时，一个好的练习是尝试使用所有特征或仅使用核心特征的数据挖掘方法。记住应用交叉验证来评估核心特征集是否表现良好。\n\
    \n`Chapter11-5a.xlsx`和`Chapter11-6a.xlsx`旨在让你对你选择的数据挖掘方法（使用所有特征或仅使用核心特征）进行交叉验证。为此，我应用了逻辑回归，因为与目标高度相关的特征有助于回归模型，如线性回归或逻辑回归（记住特征A1与目标具有高正相关性）。我的工作可以在`Chapter11-5b.xlsx`和`Chapter11-6b.xlsx`中找到。注意，由于目标只有两个类别（0，1），这是应用逻辑回归的完美案例。当然，其他数据挖掘方法如K-NN和朴素贝叶斯也是不错的选择。\n\
    \n## 强化练习\n\n共有三组强化练习。\n\n1.  `Chapter11-HW-1a.xlsx`用于EDA练习。请使用它练习以下内容（必要时参考`Chapter11-HW-1a-withAnswers.xlsx`）：\n\
    \    *   记录数\n    *   属性数\n    *   每个属性的数据类型\n    *   每个数值属性的总和、均值、中位数和方差\n  \
    \  *   每个数值属性的值范围\n    *   分类目标和属性的唯一值\n    *   目标的类别分布\n\n2.  `Chapter11-HW-2a.xlsx`用于数据清洗练习。你可以在`Chapter11-HW-2a-withAnswers.xlsx`中找到标准答案。\n\
    \n3.  `Chapter11-HW-3a.xlsx`用于特征选择练习。注意，对于此练习，没有标准答案，我只在文件`Chapter11-HW-3a-withSuggestions.xlsx`中提供建议。\n\
    \n## 复习要点\n\n请复习以下主题和技能：\n\n1.  EDA中的初步调查\n2.  缺失数据和异常值的检测\n3.  数据清洗\n4.  编码，包括独热编码和序数编码\n\
    5.  规范化、标准化和基于中位数的规范化\n6.  数据挖掘中的特征选择\n7.  Excel功能：删除重复项\n8.  Excel函数：`COUNT`、`COUNTA`、`MAX`、`MIN`、`AVERAGE`、`MEDIAN`、`IF`、`OR`、`ISNONTEXT`、`ISTEXT`、`ROW`、`CORREL`、`VAR.P`、`STDEV.P`和`INDEX`"
  raw: "### Learn Feature Selection Through Excel\n\nOpen the file Chapter11-4a.xlsx;\
    \ you will find out there are two worksheets: “cleaned-crx” and “encoded”. Worksheet\
    \ cleaned-crx is the same as its counterpart in Chapter11-3b.xlsx. However, we\
    \ are going to start our feature selection from the worksheet “encoded”. If you\
    \ compare the two worksheets, you will realize that worksheet encoded has an additional\
    \ attribute named “Customer” in column A. This column is added to serve as the\
    \ ID for each record. In addition, all the categorical attributes have been transformed\
    \ into numerical attributes (integers) inside the worksheet encoded. Here, I performed\
    \ an “encoding” action to make the data ready for feature selection operations.\n\
    \nSome data mining methods can only work with numerical values; thus, it is very\
    \ common to transform categorical values into numerical, a process called “encoding”.\
    \ There are two types of commonly used encoding schemes: one hot encoding and\
    \ ordinal encoding. Which one to use is based on the type of the categorical attribute.\
    \ Generally speaking, all categorical attributes can be divided into two categories:\
    \ nominal or ordinal. Nominal categorical attribute has no specific order, for\
    \ example, the colors of eyes (yellow, black, brown, blue). Ordinal categorical\
    \ attribute has specific order, for example, the grades A, B, C, D, F.\n\nOne\
    \ hot encoding usually applies to nominal categorical attributes where a new attribute\
    \ of values 0 or 1 is created for each category. For example, assume we have an\
    \ attribute named EyeColor which has three categories: yellow, black, and blue.\
    \ One hot encoding will then replace this EyeColor attribute with three new attributes,\
    \ possibly named “yellow”, “black”, and “blue”, one for an eye color. The 1s values\
    \ in the new attribute “yellow” denote the presence of yellow eye color, while\
    \ 0s values denote the absence of the yellow eye color. The same scheme applies\
    \ to the “black” and “blue” attributes.\n\nOrdinal encoding is much simpler. Given\
    \ the grades A, B, C, D, F, we can simply transform them into 4–0, or 0–4\\. Because\
    \ the sample dataset we are using does not provide any meaningful information\
    \ about the categorical attributes, I applied ordinal encoding to all the categorical\
    \ attributes.\n\nFollow these instructions to practice feature selections in Excel.\n\
    \n![](images/494428_2_En_11_Chapter/494428_2_En_11_Fig15_HTML.jpg)\n\nA screenshot\
    \ of the normalized Excel worksheet.\n\nFigure 11-15\n\nNormalize the attributes\n\
    \n1.  Make a copy of the worksheet encoded and rename the new worksheet “normalized”.\n\
    \n2.  In cell B2 of the worksheet normalized, enter the following formula:\n\n\
    ```\n    =IFERROR((encoded!B2-MIN(encoded!B$2:B$647))/(MAX(encoded!B$2:B$647)-MIN(encoded!B$2:B$647))*100,\
    \ encoded!B2)\n    ```\n\nThis formula normalizes the value in B2 of the attribute\
    \ A1 into the 0–100 range.\n\n3.  Autofill from B2 to P2 then autofill from B2:P2\
    \ to B647:P647\\. Part of our normalized worksheet should look like Figure [11-15](#494428_2_En_11_Chapter.xhtml#Fig15).\n\
    \n![](images/494428_2_En_11_Chapter/494428_2_En_11_Fig16_HTML.jpg)\n\nA screenshot\
    \ of the variances of each normalized attribute in Excel depicted.\n\nFigure 11-16\n\
    \nThe variances of each normalized attributes\n\n1.  Inside cell A648, type “Variance”.\n\
    \n2.  Enter `=VAR.P(A2:B647)` in B648 and then autofill to P648\\. Part of our\
    \ worksheet should look like Figure [11-16](#494428_2_En_11_Chapter.xhtml#Fig16).\n\
    \n![](images/494428_2_En_11_Chapter/494428_2_En_11_Fig17_HTML.jpg)\n\nAn Excel\
    \ spreadsheet demonstrates the computed correlation matrix.\n\nFigure 11-17\n\n\
    The correlation matrix is computed\n\n1.  From Figure [11-16](#494428_2_En_11_Chapter.xhtml#Fig16),\
    \ we can tell that all attributes have fair amount of variances except for A15.\
    \ Clearly, A1 has the largest variance.\n\n2.  Our next step is to create a correlation\
    \ matrix that shows the correlation between every two attributes. A high positive\
    \ or negative correlation coefficient between two attributes indicates that these\
    \ two attributes are speaking about the same data story. To create a correlation\
    \ matrix, create a new worksheet and rename this worksheet “correlation”.\n\n\
    3.  Inside the worksheet correlation, enter integers 1–16 inside cells B1:Q1,\
    \ respectively. A quick way is to autofill these numbers.\n\n4.  Autofill integers\
    \ 1–16 inside cells A2:A17.\n\n5.  Enter the following formula in B2, autofill\
    \ to Q2 and then autofill together to B17:Q17:\n\n`=CORREL(INDEX(normalized!$B$2:$Q$647,$A2,0),INDEX(normalized!$B$2:$Q$647,B$1,0))`\n\
    \n6.  Type “A1” in cell B18 and then autofill to P18\\. Our worksheet should look\
    \ like Figure [11-17](#494428_2_En_11_Chapter.xhtml#Fig17).\n\n1.  The first thing\
    \ we should look at is either column Q or row 17, which marks the correlation\
    \ coefficients between the target and other attributes. We shall realize that\
    \ A1 has the largest correlation coefficient with the target, indicating that\
    \ A1 shares much data story with the target, that is, A1 could be a good indicator\
    \ of the target. Since A1 also has the largest variance, certainly we should select\
    \ A1 into the core feature set.\n\n2.  After A1 is selected, we should then look\
    \ for independent attributes that share a small correlation coefficient with A1\\\
    . A good candidate is A7\\. Let’s take it.\n\n3.  Next candidate would be A9\\\
    . For A9, we must examine its correlation coefficients with A1 and A7.\n\n4. \
    \ Should we take A4 or A14? Well, their correlation coefficients with A1 are on\
    \ the mediate high, but their correlation coefficients with A9 or A7 are high\
    \ (0.70 and 0.77, respectively). So, the core feature set could be just A1, A7,\
    \ and A9.\n\nThe preceding operations are recorded in Chapter11-4b.xlsx. At this\
    \ point, a good exercise is to try a data mining method with all the features\
    \ or the core features only. Remember to apply cross-validation to assess if the\
    \ core feature set can perform well.\n\nChapter11-5a.xlsx and Chapter11-6a.xlsx\
    \ are designed for you to conduct a cross-validation on your chosen data mining\
    \ method with all the features or the core features only. I applied logistic regression\
    \ for this purpose because features highly correlated with the target can help\
    \ regression models such as linear regression or logistical regression (remember\
    \ that the feature A1 has high positive correlation with the target). My work\
    \ can be found in Chapter11-5b.xlsx and Chapter11-6b.xlsx. Note, since the target\
    \ has only two classes (0, 1), it is a perfect case to apply logistic regression.\
    \ Of course, other data mining methods such as K-NN and Naïve Bayes would be good\
    \ choices, too.\n\n## Reinforcement Exercises\n\nThere are three sets of reinforcement\
    \ exercises.\n\n1.  Chapter11-HW-1a.xlsx is for EDA practice. Please use it to\
    \ practice the following (refer to Chapter11-HW-1a-withAnswers.xlsx when needed):\n\
    \    *   Number of records\n\n    *   Number of attributes\n\n    *   Data type\
    \ of each attribute\n\n    *   Sum, mean, median, and variances of each numerical\
    \ attribute\n\n    *   Value range of each numerical attribute\n\n    *   Unique\
    \ values of categorical target and attributes\n\n    *   Class distribution of\
    \ the target\n\n2.  Chapter11-HW-2a.xlsx is for data cleaning practice. You can\
    \ find the standard answer inside Chapter11-HW-2a-withAnswers.xlsx.\n\n3.  Chapter11-HW-3a.xlsx\
    \ is for feature selection practice. Note, for this practice, there is no standard\
    \ answer, I only make suggestions inside the file Chapter11-HW-3a-withSuggestions.xlsx.\n\
    \n## Review Points\n\nPlease review the following topics and skills:\n\n1.  The\
    \ initial investigations in EDA\n\n2.  Detection of missing data and anomalies\n\
    \n3.  Data cleaning\n\n4.  Encoding including one hot encoding and ordinal encoding\n\
    \n5.  Normalization, standardization, and normalization by median\n\n6.  Feature\
    \ selection of data mining\n\n7.  Excel feature Remove Duplicates\n\n8.  Excel\
    \ functions COUNT, COUNTA, MAX, MIN, AVERAGE, MEDIAN, IF, OR, ISNONTEXT, ISTEXT,\
    \ ROW, CORREL, VAR.P, STDEV.P, and INDEX"
