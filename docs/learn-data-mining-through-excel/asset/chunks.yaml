    \ to select Remove Duplicates (click main tab Data ➤ click the icon for Remove\
    \ Duplicates).\n\n![](images/494428_2_En_1_Chapter/494428_2_En_1_Fig14_HTML.jpg)\n\
    \nA screenshot of the remove duplicates warning window. Continue with the current\
    \ selection is selected. The option to remove duplicates is selected.\n\nFigure\
    \ 1-14\n\nContinue with the current selection\n\n1.  A small menu may show up\
    \ like Figure [1-14](#494428_2_En_1_Chapter.xhtml#Fig14). Make sure to select\
    \ “Continue with the current selection”. Click the button Remove Duplicates.\n\
    \n![](images/494428_2_En_1_Chapter/494428_2_En_1_Fig15_HTML.jpg)\n\nA screenshot\
    \ of the remove duplicates window. The checkbox my data has headers is selected.\
    \ The check box name under the columns section is selected.\n\nFigure 1-15\n\n\
    My data has headers\n\n1.  Check “My data has headers” as shown in Figure [1-15](#494428_2_En_1_Chapter.xhtml#Fig15).\n\
    \n1.  Click OK on the upcoming small menu.\n\n2.  Enter the text “Yearly Sales”\
    \ in cell G1 and “Average Sales” in cell H1.\n\nOur worksheet should look like\
    \ Figure [1-16](#494428_2_En_1_Chapter.xhtml#Fig16).\n\n![](images/494428_2_En_1_Chapter/494428_2_En_1_Fig16_HTML.jpg)\n\
    \nAn Excel screenshot. The column headers in row 1 are name, season, sales, commissions,\
    \ 2, name, yearly sales, and average sales. Cells A 2 through D 10 have data.\
    \ Data in the columns F, G, and H are highlighted.\n\nFigure 1-16\n\nTable setup\n\
    \nFor yearly sales computation, we need to use the function SUMIFS. Again, there\
    \ is another function named SUMIF. The syntaxes of these two functions are different\
    \ and could cause confusion. As SUMIFS can accomplish anything SUMIF can do, let’s\
    \ stick to SUMIFS for simplicity.\n\n1.  SUMIFS has the syntax SUMIFS(sum_range,\
    \ criteria_range1, criteria1, criteria_range2, criteria2, …). Based on this understanding,\
    \ enter the following formula in cell G2:\n\n```\n    =SUMIFS(C$2:C$10,A$2:A$10,F2)\n\
    \    ```\n\nThe preceding formula works this way: in the array A2:A10, cells A2,\
    \ A7, A9, and A10 equal F2 (“Amie”); thus, their corresponding cells in the array\
    \ C2:C10 are summed, that is, cells C2, C7, C9, and C10 are summed. Observe the\
    \ use of absolute cell references in the formula because we are going to autofill\
    \ from cell G2 to G5.\n\n2.  Autofill from cell G2 to cell G5.\n\n3.  Enter the\
    \ following formula in cell H2 (here you can use either AVERAGEIF or AVERAGEIFS,\
    \ they have similar syntax):\n\n```\n    =AVERAGEIFS(C$2:C$10,A$2:A$10,F2)\n \
    \   ```\n\n4.  Autofill from cell H2 to cell H5.\n\nOur worksheet looks exactly\
    \ like Figure [1-17](#494428_2_En_1_Chapter.xhtml#Fig17). The complete result\
    \ is available in Chapter1-1b.xlsx.\n\n![](images/494428_2_En_1_Chapter/494428_2_En_1_Fig17_HTML.jpg)\n\
    \nAn Excel screenshot. The column headers in row 1 are name, season, sales, commissions,\
    \ 2, name, yearly sales, and average sales. Cells A 2 through D 10 and F 2 through\
    \ F 5 have data.\n\nFigure 1-17\n\nThe use of functions SUMIFS and AVERAGEIFS\n\
    \nBeware that since Office 2019 or Microsoft 365, Excel adds two more functions\
    \ into the IF-function family: MAXIFS and MINIFS. Their syntaxes are very much\
    \ similar to those of COUNTIFS, SUMIFS, and AVERAGEIFS.\n\nAnother two Excel features\
    \ used often in data preparation are data import and export. To export data in\
