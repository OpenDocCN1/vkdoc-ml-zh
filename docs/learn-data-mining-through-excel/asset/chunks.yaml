- fmt: "# Learn Data Cleaning Through Excel\n\nData cleaning usually applies on data\
    \ records instead of data attributes, that is, on rows instead of columns. When\
    \ there are missing data or unexpected data in a record, the safest approach is\
    \ to delete this record since keeping it can introduce errors in our data mining\
    \ result. The famous slogan “garbage in garbage out” says that if the data is\
    \ not of high quality, the data mining result for sure won’t be of high quality\
    \ no matter whatever we do. Nevertheless, there are other data wrangling methods\
    \ that a data engineer can adapt, though I usually do not recommend if your data\
    \ size is large enough without those records.\n\nA common technique is to replace\
    \ a missing numerical data value with a constant (such as 0), or mean, median,\
    \ or mode of the attribute. In certain cases, for example, if the unexpected value\
    \ for a numerical data type is “high”, we may consider replacing this unexpected\
    \ value with a number larger than the mean or median.\n\nFor categorical attributes,\
    \ a missing or null value can be replaced with a constant such as “missing”.\n\
    \nWhen an attribute has too many low-quality data values, we should consider dropping\
    \ this attribute as it is problematic by nature and becomes the data tumor. There\
    \ is no one-for-all cutoff that determines when we should remove a column, it\
    \ is upon experience and test and trial.\n\nA more advanced approach is to develop\
    \ a machine learning model to predict the missing or null values. For example,\
    \ assume we have `A1`, `A2`, …, `A10` attributes and the label `T`, and there\
    \ are some missing values inside `A1`. We can then develop a machine learning\
    \ model that treats `A1` as the target, but all other attributes include the label\
    \ `T` as the predictors. The model is trained with the complete records and then\
    \ used to predict for the missing `A1` values.\n\nOpen `Chapter11-3a.xlsx`. You\
    \ may realize it is the same as `Chapter-2b.xlsx`. The worksheet `crx2` has already\
    \ marked where the missing data or unexpected values are located. A quick looking\
    \ through should let us be aware that there are not many data records to delete,\
    \ compared to the data size. Thus, we should proceed to delete those records marked\
    \ in worksheet `crx2`. We could start our operations from the worksheet `crx2`,\
    \ or we can restart from the original worksheet `crx`.\n\nLet’s restart from the\
    \ original worksheet `crx` by making a copy of it and rename the new worksheet\
    \ `crx3`. Inside the worksheet `crx3`, please follow the succeeding instructions\
    \ to complete our data cleaning effort. Note, for data cleaning, we must consider\
    \ both missing data and data anomalies.\n\n![](images/494428_2_En_11_Chapter/494428_2_En_11_Fig7_HTML.jpg)\n\
    \nA screenshot of the Excel spreadsheet contains the row number of the to-be-deleted\
    \ records.\n\n**Figure 11-7** Row numbers of the to-be-deleted records are marked\n\
    \n1.  In cell `A2`, enter the following formula:\n\n    ```\n    =IF(COUNT(crx!A2:A691)/COUNTA(crx!A2:A691)>0.8,\
    \ IF(ISTEXT(crx!A2), ROW(A2), IF(crx!A2<0, ROW(A2), \"\")), IF(OR(ISNONTEXT(crx!A2),\
    \ crx!A2=\"?\"), ROW(A2), \"\"))\n    ```\n\n    In this formula, `COUNT(crx!A2:A691)/COUNTA(crx!A2:A691)>0.8`\
    \ is used to determine if an attribute is text or numerical data. Based on the\
    \ data type, this attribute is examined for missing or unexpected data accordingly.\
    \ Be advised that the function `ISTEXT` can detect the question mark “?”.\n\n\
    \    Autofill from `A2` to `O691`.\n\n    At this point, part of our worksheet\
    \ should look like Figure [11-7](#494428_2_En_11_Chapter.xhtml#Fig7).\n\n    ![](images/494428_2_En_11_Chapter/494428_2_En_11_Fig8_HTML.jpg)\n\
    \n    An Excel spreadsheet for the `crx4`.\n\n    **Figure 11-8** The worksheet\
    \ `crx4`\n\n2.  Type “toKeep” inside cell `Q1`, enter `=IF(SUM(A2:O2)>0, 1, 0)`\
    \ in `Q2`, and autofill to `Q691`. This formula determines if there is a row number\
    \ inside `A2:O2`, then this row needs to be deleted by marking it as 1. This will\
    \ help us later to keep those wanted records.\n\n3.  Again, let’s make a copy\
    \ of the worksheet `crx` so that we do not directly delete records inside the\
    \ original worksheet. This is very important in data cleaning. Rename the new\
    \ worksheet `crx4`.\n\n4.  Copy the cells `Q1:Q691` in worksheet `crx3` and paste\
    \ them by values into the same `Q1:Q691` region in worksheet `crx4`. Note, the\
    \ paste action must be by values only. Part of our worksheet `crx4` should look\
    \ like Figure [11-8](#494428_2_En_11_Chapter.xhtml#Fig8).\n\n    ![](images/494428_2_En_11_Chapter/494428_2_En_11_Fig9_HTML.jpg)\n\
    \n    An Excel spreadsheet demonstrates the steps to select the option equals\
    \ to prepare filter records. The steps are as follows. Data tab, Filter, to Keep,\
    \ number filters, and equals.\n\n    **Figure 11-9** Prepare to filter records\
    \ based on the column “toKeep”\n\n5.  Let’s create a blank new worksheet and name\
    \ it “cleaned-crx”. We are going to store our cleaned data inside this worksheet\
    \ later.\n\n6.  Go back to the worksheet `crx4`. Select all the columns `A–Q`\
    \ ➤ click the Data tab ➤ click Filter ➤ click the arrow inside the cell `Q1` ➤\
    \ select Number Filters ➤ select the option Equals…. This is illustrated by Figure\
    \ [11-9](#494428_2_En_11_Chapter.xhtml#Fig9).\n\n    ![](images/494428_2_En_11_Chapter/494428_2_En_11_Fig10_HTML.jpg)\n\
    \n    A screenshot of the custom auto filter window. 0 is entered next to the\
    \ equals option.\n\n    **Figure 11-10** Set up Custom AutoFilter\n\n7.  A Custom\
    \ AutoFilter window shows up. Follow the instructions in Figure [11-10](#494428_2_En_11_Chapter.xhtml#Fig10)\
    \ to proceed.\n\n8.  Now in the worksheet `crx4`, only those to-be-kept records\
    \ show up. Select all the data and copy/paste them into the cell `A1` of the worksheet\
    \ “cleaned-crx”. That’s it! The worksheet `cleaned-crx` contains the cleaned data.\n\
    \nThe completed work is contained in the worksheet `Chapter11-3b.xlsx`. Note,\
    \ you can delete column `Q` inside the worksheet `cleaned-crx`.\n\nAt this point,\
    \ you may have realized that from `Chapter11-2b.xlsx` to `Chapter11-2c.xlsx` and\
    \ `Chapter11-3b.xlsx`, the formulas I used become more advanced, making the process\
    \ easier. This is just a simple demonstration that practice can get our skills\
    \ better.\n\n## Feature Selection\n\nIn many cases, there will be a number of\
    \ features/attributes available in a dataset. Some features can be more significant\
    \ than others for our data mining purpose, and multiple features might be closely\
    \ related such that they provide the same information. Thus, the purpose of feature\
    \ selection is to find the best set of features that can provide the highest prediction\
    \ result measured by the chosen evaluation metric.\n\nThe buzz word “Big Data”\
    \ may give us an impression that more features are always better in data mining\
    \ or machine learning. It is not true, indeed. More features bring a much larger\
    \ dimensional space that can complicate the data mining model. Thus, a critical\
    \ skill in data mining is to discover the most determinant features or attributes.\
    \ For example, what are the most important several features that determine the\
    \ customer attitudes toward a credit card offer?\n\nIn machine learning, there\
    \ are quite some techniques for feature selections, for example, forward selection\
    \ and backward elimination. Forward selection starts with one or two features\
    \ and then continues to add more features into the feature set until no significant\
    \ improvement can be made. Backward elimination starts with the full feature set\
    \ and eliminates one feature a time until there is a core feature set that can\
    \ provide comparable prediction quality. Certainly, such feature selection processes\
    \ are not suitable for Excel to operate. In this book, I will show you some fundamental\
    \ feature selection principles and techniques that can be implemented in Excel\
    \ worksheets.\n\nThere are three general principles regarding feature selections:\n\
    \n1.  Features on the same scale work better.\n\n2.  Features with larger variances\
    \ contribute more.\n\n3.  Related features tell the same data story.\n\nAs you\
    \ can see, the first principle is to select features on the same scale. But what\
    \ if none of the numerical features are on the same scale? This is something I\
    \ promised to discuss in detail."
