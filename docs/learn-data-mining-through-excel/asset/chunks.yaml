- fmt: "# Learn Hierarchical Clustering Through Excel\n\nLet’s open the file `Chapter8-2a.xlsx`\
    \ which contains ten data records. Using Excel to demonstrate hierarchical clustering\
    \ with too many records won’t be practical because both dendrogram creation and\
    \ the hierarchical clustering process require quite some manual work. As the purpose\
    \ of this chapter is to let you experience how hierarchical clustering works,\
    \ there is no need to start with too many records.\n\nYou may have already noticed\
    \ that these ten records are the first ten records from `Chapter3-1a.xlsx`. These\
    \ ten records are for the ten countries `L1`, `L2`, …, `L10` (column B). Our task\
    \ is to hierarchically cluster these ten data points and then observe their relative\
    \ distances or similarities.\n\nPlease follow these instructions to execute the\
    \ hierarchical clustering algorithm as explained earlier:\n\n![](images/494428_2_En_8_Chapter/494428_2_En_8_Fig10_HTML.jpg)\n\
    \nA screen displays a table contains data related to different Step-1 to Step-10\
    \ and various attributes such as Country, Murder, Assault, Urban Pop, and Rape,\
    \ along with numerical values corresponding to each step.\n\n**Figure 8-10** The\
    \ initial step of hierarchical clustering\n\n1. In cells `G1:P1`, enter the text\
    \ words “Step-1”, “Step-2”, “Step-3”, “Step-4”, “Step-5”, “Step-6”, “Step-7”,\
    \ “Step-8”, “Step-9”, and “Step-10”. You can achieve this by entering “Step-1”\
    \ in cell `G1` and then autofill to `P1`.\n\n2. To help differentiate the original\
    \ data inside columns `C:F` from the Steps, it is a good idea to format the text\
    \ words in `G1:P1` such that they are bold and red (or another non-black color).\n\
    \n3. In cells `G2:G11`, enter numbers 11–20. These numbers represent the current\
    \ clusters each data point is in. Note, since we have ten data points, any integer\
    \ greater than ten can mark that this data point hasn’t been clustered. This is\
    \ the initial step, that is, Step-1.\n\nAt this moment, our worksheet should look\
    \ like Figure [8-10](#494428_2_En_8_Chapter.xhtml#Fig10).\n\n![](images/494428_2_En_8_Chapter/494428_2_En_8_Fig11_HTML.jpg)\n\
    \nAn Excel sheet displaying a matrix of numerical values. The matrix appears to\
    \ represent a dataset or data table with various numerical entries. Each cell\
    \ contains a value, and the values seem to be related to some form of data analysis.\n\
    \n**Figure 8-11** The proximity matrix and the first cluster\n\n1. In cells `B13:K13`,\
    \ enter integers 1–10, respectively. These numbers are used to help fetch a record\
    \ from the array `C2:F11`.\n\n2. In cells `A14:A23`, enter integers 1–10, respectively,\
    \ too. We are going to construct the proximity matrix in cells `B14:K23`.\n\n\
    3. In cell `B14`, enter the formula\n\n```\n=IFERROR(IF($A14=B$13,1000000, SQRT(SUMXMY2($C2:$F2,INDEX($C$2:$F$11,B$13,0)))),1000000)\n\
    ```\n\nIn this formula, `INDEX($C$2:$F$11,B$13,0)` picks a record referenced by\
    \ `B13`. In this particular case, it is the first data point (`C2:F2`).\n\n`SQRT(SUMXMY2($C2:$F2,INDEX($C$2:$F$11,B$13,0)))`\
    \ computes the distance between `C2:F2` and `C2:F2`.\n\nInside the `IF` function,\
    \ the integer 1000000 is used as the maximum distance. If `$A14=B$13`, we know\
    \ that it is computing the distance between the same data point (in this particular\
    \ case, it is between `C2:F2` and `C2:F2`). Though such a distance should be 0,\
    \ but we would like to assign it the maximum distance for later use. Else the\
    \ calculation result of the `SQRT` function will be returned.\n\nThe `IFERROR`\
    \ function is used to make sure whenever there is an error, the maximum distance\
    \ is assigned. This is important and necessary!\n\n4. Autofill from `B14` to `K23`.\
    \ Now the proximity matrix has been constructed.\n\n5. Enter the formula `=MATCH(MIN($B$14:$K$23),B14:K14,0)`\
    \ in cell `L14`. Autofill from `L14` to `L23`. The proximity matrix should look\
    \ like Figure [8-11](#494428_2_En_8_Chapter.xhtml#Fig11) and it tells that data\
    \ points 4 and 1 have the shortest distance between.\n\n1. **Step-2:**\n   - Now\
    \ we need to update the cluster information for the ten data points. Copy the\
    \ numbers inside `G2:G11` to `H2:H11`.\n   - Update the number inside `H2` and\
    \ `H5` to 1. Here, 1 indicates this is the first cluster.\n   - Since countries\
    \ `L1` and `L4` are inside cluster 1, we need to compute the centroid of cluster\
    \ 1. In cell `N14`, enter the formula `=AVERAGE(C2, C5)` and then autofill to\
    \ `Q14`. Be advised that a cluster is represented by its centroid in this exercise.\n\
    \   - Copy the content of `N14:Q14` to `N15:Q15` by values only. Note, it is very\
    \ important to copy `N14:Q14` and paste by values to `N15:Q15`. The purpose is\
    \ to avoid accidental iterative calculation in next step.\n   - Copy `N15:Q15`\
    \ to `C2:F2`, and then clear the content in `C5:F5`. Our worksheet should look\
    \ like Figure [8-12](#494428_2_En_8_Chapter.xhtml#Fig12).\n\nNote, it is very\
    \ important to clear the content in `C5:F5` for country `L4` because country `L1`\
    \ (`C2:F2`) is now representing cluster 1.\n\n![](images/494428_2_En_8_Chapter/494428_2_En_8_Fig12_HTML.jpg)\n\
    \nAn Excel sheet displaying a dataset with various columns A, B, D, E, F, G, H,\
    \ J, K, M, N, O, P and rows. The table contains numerical values, and it seems\
    \ to represent data related to different Step-1 to Step-10, along with attributes\
    \ like Country, Murder, Assault, Urban Pop, and Rape.\n\n**Figure 8-12** After\
    \ step-2, the cell array `L14:L23` automatically shows that countries `L5` and\
    \ `L3` are in a cluster together\n\n1. **Step-3:**\n   - Figure [8-12](#494428_2_En_8_Chapter.xhtml#Fig12)\
    \ shows that countries `L3` and `L5` are in a cluster. Since the current cluster\
    \ values of `L3` and `L5` are 13 and 15, both greater than 10, we know that `L3`\
    \ and `L5` haven’t be clustered. Thus, they should be in cluster 2 together.\n\
    \   - Copy `H2:H11` to `I2:I11`.\n   - Update cells `I4` and `I6` to 2.\n   -\
    \ Time to compute the centroid of countries `L3` and `L5`. In cell `N14`, enter\
    \ `=AVERAGE(C4,C6)` and then autofill from `N14` to `Q14`.\n   - Copy `N14:Q14`\
    \ and paste them by values into `N15:Q15`.\n   - Copy and paste `N15:Q15` into\
    \ `C4:F4`. We are using `C4:F4` (country `L3`) to represent the cluster 2.\n \
    \  - Clear the content in `C6:F6`.\n\nOur worksheet should look like Figure [8-13](#494428_2_En_8_Chapter.xhtml#Fig13).\n\
    \n![](images/494428_2_En_8_Chapter/494428_2_En_8_Fig13_HTML.jpg)\n\nAn Excel sheet\
    \ displaying a dataset with various columns A, B, C, D, E, F, G, H, J, K, L, M,\
    \ N, O, P, Q and rows. The table contains numerical values and labels related\
    \ to different Step-1 to Step-10, as well as attributes like Country, Murder,\
    \ Assault, Urban Pop, and Rape.\n\n**Figure 8-13** Countries `L3` and `L5` are\
    \ in cluster 2, Country `L8` is in the same cluster as `L1`\n\n![](images/494428_2_En_8_Chapter/494428_2_En_8_Fig14_HTML.jpg)\n\
    \nAn Excel sheet displaying a dataset with various columns A, B, C, D, E, F, G,\
    \ H, J, K, L, M, N, O, P, Q and rows. The table contains numerical values and\
    \ labels related to different Step-1 to Step-10, as well as attributes like Country,\
    \ Murder, Assault, Urban Pop, and Rape.\n\n**Figure 8-14** After Step-4, countries\
    \ `L3` and `L9` are in the same cluster\n\n1. **Step-4:**\n   - Figure [8-13](#494428_2_En_8_Chapter.xhtml#Fig13)\
    \ also automatically shows that country `L8` is in the same cluster as `L1`. As\
    \ `I2:I11` of Step-3 reveals that `L8` has not been clustered (its current cluster\
    \ value is 18) but `L1` has, `L8` should now be assigned to cluster 1 with `L1`.\n\
    \   - Copy `I2:I11` to `J2:J11`; update `J9` to 1.\n   - Recompute the centroid\
    \ of cluster 1. Enter `=SUM(C2*2,C9)/3` in cell `N14`; autofill from `N14` to\
    \ `Q14`. Note, because cluster 1 already has two data points and now includes\
    \ country `L8`, we need to double `C2` first.\n   - Copy `N14:Q14` and paste by\
    \ values to `N15:Q15`, then copy `N15:Q15` to `C2:F2`.\n   - Clear the content\
    \ inside `C9:F9`. Our worksheet should disclose that countries `L3` and `L9` are\
    \ in the same cluster. Refer to Figure [8-14](#494428_2_En_8_Chapter.xhtml#Fig14).\n\
    \n1. **Step-5:**\n   - Certainly, country `L9` should be in cluster 2 with `L3`.\
    \ Copy `J2:J11` to `K2:K11`, and update `K10` to 2.\n   - To recompute the centroid\
    \ of cluster 2, enter `=SUM(C4*2, C10)/3` in `N14`; autofill from `N14` to `Q14`.\n\
    \   - Copy `N14:Q14` and paste by values into `N15:Q15`."
