  trans: "\n图 7-4 展示了最终结果。结果表明，当 k 值不同时，基于其“邻居”的多数投票对黛西反应的预测也会不同。请注意，K-NN 是一个概率模型，这意味着它会根据邻居们过去的反应来计算黛西可能做出何种反应的概率。例如，当\
    \ k 等于 5（5 是 K 的常见选择）时，K-NN 预测她很可能接受信用卡优惠。她接受的概率是 3/5。不过，她仍有 2/5 的概率拒绝该信用卡优惠。观察发现，当\
    \ k=1 时，她拒绝的概率是 100%。然而，这并不能保证她一定不会接受信用卡优惠。\n\n![](img/494428_2_En_7_Fig4_HTML.jpg)\n\
    \n一个电子表格展示了黛西的年龄、收入和持卡数量的详细信息。响应列包含一组 0 和 1 的值。K、L、M 列分别代表标签为 small、1 和 0 下的数值列表。\n\
    \n图 7-4\n\nK-NN 基于不同 K 值预测黛西的反应\n\n不难发现，K 值在 K-NN 模型中至关重要。哪个 K 值最佳尚有争议，但普遍认为 K\
    \ 最好是一个奇数整数。\n\n如果数据量足够大可以进行交叉验证，那么我们可以计算不同 K 值下的交叉验证误差，并绘制误差与 K 值的关系图。该图应呈 L\
    \ 形或 U 形，即存在一个拐点。通常最优 K 值位于拐点处（如果是 U 形，则取第一个拐点）。这就是所谓的用于寻找 K-NN 最优 K 值的肘部法或肘部曲线验证技术。\n\
    \n通过 Excel 进行肘部曲线验证是可行的，但并不实用，因此这里不展示具体实现方法。\n\n### 实验 2\n\n在现实生活中，我们往往更重视最信任之人的建议。那么，既然黛西的邻居们与她距离不同，我们是否应该区别对待他们呢？是的，应该如此。例如，我们应该赋予离她更近的邻居的投票更高的权重。\n\
    \nK-NN 的基本概念是，彼此接近的数据点彼此相似，属于同一类别。两个数据点越接近，它们属于同一类别的可能性就越大。相反，两个数据点距离越远，它们属于不同类别的可能性就越大。在为邻居分配权重时，应遵循的规则是：距离越大，投票权重越小。\n\
    \n哪个函数能恰当地将距离因素纳入投票中呢？一个简单的解决方案是使用距离的倒数。然而，当某个邻居与黛西的距离为 0 时，使用倒数会导致错误。为避免此类错误，可以使用一个修正的倒数函数：\n\
    \n![$$ w=\\frac{1}{1+ bd} $$](img/494428_2_En_7_Chapter_TeX_Equ1.png)\n\n(7-1)\n\
    \n其中 `b` 是一个常数，最好大于或等于 1，`d` 是两个数据点之间的欧几里得距离。\n\n一个更常见的函数采用以下方程形式：\n\n![$$ w=\\\
    frac{1}{a^d} $$](img/494428_2_En_7_Chapter_TeX_Equ2.png)\n\n(7-2)\n\n其中 *a* >\
    \ 1。通常 `a` 被设置为自然对数的底数 `e`。注意，*w* 随着 `d` 的增加呈指数级下降，特别是当 `a` = `e` 时，在这种情况下，距离更近的数据点很容易成为主导投票。\n\
    \n在本实验中，我们采用方程 (7-1) 并设置 `b` = 1。打开 Chapter7-2a.xlsx。该文件中的数据设置如图 7-5 所示。\n\n![](img/494428_2_En_7_Fig5_HTML.jpg)\n\
    \n一个电子表格的截图展示了黛西的年龄、收入和持卡数量的详细信息，以及用于输入响应的空格。底部有一个表格，显示了从 N 1 到 N 4 四个名字的年龄、收入、持卡数和响应的详细信息。\n\
