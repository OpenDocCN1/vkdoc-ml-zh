  trans: "\n这一步可以理解为输入层。\n\n![](img/494428_2_En_13_Fig5_HTML.jpg)\n\n一张 Excel 表格的截图，其中包含权重和截距数据。经过聚合函数处理后，神经元的加权和得到更新。\n\
    \n图 13-5\n应用聚合函数\n\n如前所述，在聚合函数之后，需要应用激活函数（Sigmoid 函数）来启动隐藏层。然而，由于 Sigmoid 函数倾向于将其输入数据归一化到\
    \ -1 到 1 或 0 到 1 之间，我们需要对 L、M 和 N 列中的值进行归一化。由于此时所有值均为正数，我们只需将这些值归一化到 0 到 1 的范围内。\n\
    \n3.  在单元格 K6 中输入“MAX”，在单元格 K7 中输入“MIN”。\n\n4.  在单元格 L6 中输入公式 `=MAX(L11:L510)`，在单元格\
    \ L7 中输入公式 `=MIN(L11:L510)`。\n\n5.  选中单元格 L6 和 L7，然后自动填充至 N6:N7，如图 13-6 所示。\n\n\
    6.  此外，合并单元格 O9:Q9，在合并后的单元格中输入文本“归一化”，并分别在单元格 O10、P10 和 Q10 中输入 1、2 和 3。归一化后的加权和将分别存储在\
    \ O、P 和 Q 列中。\n\n将我们的工作表与图 13-6 进行比较。如果发现 L、M 和 N 列中的数字相同，不必惊讶。\n\n![](img/494428_2_En_13_Fig6_HTML.jpg)\n\
    \n一张 Excel 表格的截图，其中包含权重和截距数据。单元格 L6 和 L7 已被选中。归一化后的加权和分别位于 O、P 和 Q 列。\n\n图 13-6\n\
    准备归一化数据\n\n1.  在单元格 O11 中输入公式 `=(L11-L$7)/(L$6-L$7)`。此公式将单元格 L11 中的值归一化到 0 到 1\
    \ 之间（包含端点）。\n\n2.  从 O11 自动填充至 Q11，然后一起自动填充至 O510:Q510。如果发现 O、P 和 Q 列中的数字相同，不必惊讶。请注意，当\
    \ L6（最大值）等于 L7（最小值）时，公式 `=(L11-L$7)/(L$6-L$7)` 会导致错误。不过，这种情况不应发生。如果确实发生了，则意味着该属性没有方差，应予以移除。\n\
    \n3.  是时候通过 Sigmoid 函数转换归一化数据了。合并单元格 R9、S9 和 T9。在合并后的单元格中输入“Sigmoid 转换”。在单元格 R10、S10\
    \ 和 T10 中分别输入数字 1、2 和 3。工作表的一部分看起来如图 13-7 所示。\n\n![](img/494428_2_En_13_Fig7_HTML.jpg)\n\
    \n一张 Excel 表格，包含权重和截距数据。归一化列和 Sigmoid 转换列已被高亮显示。\n\n图 13-7\n归一化之后，Sigmoid 转换之前\n\
    \n![](img/494428_2_En_13_Fig8_HTML.jpg)\n\n一张 Excel 电子表格，包含神经元加权和、归一化值、Sigmoid\
    \ 转换值、输出值和误差值。\n\n图 13-8\n准备生成输出并计算误差\n\n1.  基于公式 (11-1)，在单元格 R11 中输入公式 `=1/(1+EXP(-O11))`。\n\
    \n2.  从 R11 自动填充至 T11，然后一起自动填充至 R510:T510。\n\n3.  在单元格 U10 和 V10 中，分别输入“输出”和“误差”。至此，工作表的一部分看起来与图\
    \ 13-8 完全一致。\n\n![](img/494428_2_En_13_Fig9_HTML.jpg)\n\n一张 Excel 电子表格，包含生成的输出和计算出的误差。误差总和等于\
    \ 314.828。\n\n图 13-9\n输出已生成，误差已计算\n\n1.  输出是另一个聚合函数，使用了单元格 L2:L4 中的 `Wo` 值和单元格\
    \ M2 中的 `Bo` 值。在单元格 U11 中，输入以下公式：\n\n```\n    =MMULT(R11:T11,$L$2:$L$4)+$M$2\n\
    \    ```\n\n请注意，函数 SUMPRODUCT 不适用于数组 R11:T11 和 L2:L4。这是因为 R11:T11 类似于一行，而 L2:L4\
    \ 类似于一列。然而，函数 MMULT（矩阵乘法）非常适合这种类型的数组乘法。注意单元格 M3 和 M4 未被使用。\n\n2.  从单元格 U11 自动填充至单元格\
    \ U510。\n\n3.  在单元格 V11 中，输入公式 `=(U11-K11)²`，该公式计算输出 U11 与原始类别值 K11 之差的平方。我们之前已经在误差计算中见过平方的用法。对差值进行平方的一个原因是使误差为正。\n\
    \n4.  从单元格 V11 自动填充至单元格 V510。\n\n在神经网络中，我们需要搜索权重 w1, w2, …, w9、`Wo`、`b` 和 `Bo`\
    \ 的最优值，以使误差总和最小化。\n\n5.  在单元格 P1 中输入“误差总和”。\n\n6.  在单元格 Q1 中输入公式 `=SUM(V11:V510)`。\n\
    \n将我们的结果与图 13-9 进行比较。\n\n![](img/494428_2_En_13_Fig10_HTML.jpg)\n\n规划求解参数窗口的截图。它包含以下字段：设置目标、通过更改可变单元格、遵守约束、选择求解方法。\n\
    \n图 13-10\n使用规划求解寻找最优参数\n\n1.  我们需要再次使用规划求解来寻找最优的权重和偏置。点击“数据”➤“规划求解”；按照图 13-10\
    \ 设置规划求解的单元格范围。\n\n2.  勾选“使无约束变量为非负数”。如果取消勾选，结果可能会不同（可能更好）。在本实验中，我们勾选它。\n\n规划求解可能需要一些时间来完成最优参数搜索。一旦规划求解完成其工作，我们的工作表应如图\
    \ 13-11 所示。\n\n![](img/494428_2_En_13_Fig11_HTML.jpg)\n\n一张 Excel 表格，展示了神经网络的最优参数搜索。\n\
    \n图 13-11\n规划求解为具有一个隐藏层的神经网络找到最优参数\n\n有了优化后的权重和偏置，我们的下一个任务是找到一个阈值来区分良性和恶性类别。在神经网络中，通常使用\
    \ Softmax 函数（用于多分类）或 Sigmoid 函数（用于二分类）来计算输出层中每个类别的概率。这需要相当大的努力来计算交叉熵。为简单起见，在我们的实验中，我们直接找到一个阈值来完成输出层。按照以下说明计算阈值：\n\
    \n![](img/494428_2_En_13_Fig13_HTML.jpg)\n\n一张 Excel 表格，包含预测测试样本的计算。W 列和 X 列已被高亮显示。\n\
    \n图 13-13\n使用测试数据集评估神经网络模型\n\n1.  在单元格 P6 和 P7 中分别输入“平均值”和“计数”。\n\n2.  在单元格 Q5\
    \ 和 R5 中分别输入数字 2 和 4，在单元格 S5 和 T5 中分别输入“阈值”和“遗漏数”。\n\n3.  在单元格 Q6 中输入公式 `=AVERAGEIFS($U11:$U510,$K11:$K510,Q5)`。此公式计算良性类别的平均输出值。\n\
    \n4.  从 Q6 自动填充至 R6。\n\n5.  在单元格 Q7 中输入公式 `=COUNTIFS($K11:$K510,Q5)`。此公式计算训练数据集中良性类别的数量。\n\
    \n6.  从 Q7 自动填充至 R7。\n\n7.  在单元格 S6 中输入公式 `=(Q6*Q7+R6*R7)/500`。这是区分类别 2 和 4（良性和恶性）的阈值。\n\
    \n工作表的一部分看起来如图 13-12 所示。\n\n![](img/494428_2_En_13_Fig12_HTML.jpg)\n\n一张 Excel\
    \ 表格，展示了用于区分类别 2 和 4 的阈值数据。\n\n图 13-12\n为具有一个隐藏层的神经网络模型计算出的阈值\n\n现在是时候用测试数据集评估我们的神经网络模型了（再次注意，这个模型只是一组优化后的参数）。按照以下说明操作：\n\
    \n8.  选中单元格 L510:U510；将它们一起向下自动填充至单元格 L693:U693。\n\n9.  在单元格 W10 和 X10 中分别输入“预测”和“差异”。\n\
    \n10. 在单元格 W11 中输入公式 `=IF(U11<=$S$6,2,4)`；从 W11 自动填充至 W693。\n\n11. 在单元格 X11 中输入公式\
    \ `=IF(K11=W11,0,1)`；从 X11 自动填充至 X693。\n"
- fmt: "12. 在单元格`T6`中输入公式`=SUM(X511:X693)`。`T6`中的数字表示我们的神经网络模型未能正确预测的测试样本数量。请注意，此公式中的单元格范围是`X511:X693`。\n\
    \n工作表的一部分看起来与图[13-13](#494428_2_En_13_Chapter.xhtml#Fig13)完全一致。在183个测试样本中，有5个未被正确预测，准确率为97.3%。您可以在`Chapter13-1b..xlsx`中找到完整的结果。\n\
    \n对于这个特定的乳腺癌数据集，良性和恶性类别都由九个属性很好地表征。区分这两个类别并不困难。上述Excel分步说明的目的是剖析神经网络建模过程，并向我们清晰地展示一个简单的神经网络模型是如何工作的。\n\
    \n如`Q7:R7`所示，目标类别的分布并不十分均衡。由于我们没有平衡目标类别分布，因此检查模型对代表性不足的类别（即4）的预测准确性是一个好主意。稍加分析即可证实，我们的模型对代表性不足类别的预测准确率为94.6%，这是一个相当不错的性能。\n\
    \n### 实验2\n\n让我们开始另一个实验，在此过程中我们将构建一个具有两个隐藏层的神经网络。每个隐藏层仍然有三个神经元。当存在多个隐藏层时，该神经网络通常被称为深度学习。请注意，真正的深度学习通常具有两个以上的隐藏层和更多的神经元。\n\
    \n打开文件`Chapter13-2a.xlsx`。其中的数据是短发夹RNA（shRNA）功效预测的实验结果。数据经过预处理和简化。有四个属性用于预测目标类别`Class`，该类别具有三个不同的值：`39`\
    \ = 低功效，`69` = 中功效，`84` = 高功效。第11至182行是训练数据集，而第183至190行是评分数据集。工作表的设置如图[13-14](#494428_2_En_13_Chapter.xhtml#Fig14)所示。请注意，不同的神经元以不同的权重和偏置开始。`W21`、`W22`、`W23`和`B2`是隐藏层2中神经元的权重和偏置。此后，我们将两个隐藏层分别称为“层1”和“层2”。\n\
    \n![](images/494428_2_En_13_Chapter/494428_2_En_13_Fig14_HTML.jpg)\n\nExcel工作表的截图展示了实验结果。\n\
    \n**图13-14**\n实验2数据设置\n\n![](images/494428_2_En_13_Chapter/494428_2_En_13_Fig17_HTML.jpg)\n\
    \n求解器参数窗口的截图。隐藏层1的参数已设置。\n\n**图13-17**\n用于隐藏层1参数优化的求解器\n\n1.  在单元格`G11`中输入以下公式：\n\
    \n```\n=SUMPRODUCT($B11:$E11,INDEX($B$2:$E$4,G$10, 0))+INDEX($F$2:$F$4,G$10,1)\n\
    ```\n\n同样，此公式实现了线性表达式`w1x1 + w2x2 + w3x3 + … + b`。\n\n2.  从`G11`自动填充到`I11`，然后一起自动填充到`G182:I182`。\n\
    \n3.  为了将数据归一化到`[-1, 1]`范围，我们需要先将数据归一化到`[0, 1]`范围，乘以2，然后减去1。因此，我们需要执行以下操作：\n \
    \   *   在单元格`G6`中，输入公式`=MAX(G11:G182)`；从`G6`自动填充到`I6`。\n    *   在单元格`G7`中，输入公式`=MIN(G11:G182)`；从`G7`自动填充到`I7`。\n\
    \    *   在单元格`J11`中，输入公式`=(G11-G$7)/(G$6-G$7)*2-1`。从单元格`J11`自动填充到`L182`。\n\n工作表的一部分看起来如图[13-15](#494428_2_En_13_Chapter.xhtml#Fig15)所示。\n\
    \n![](images/494428_2_En_13_Chapter/494428_2_En_13_Fig15_HTML.jpg)\n\nExcel工作表的截图展示了归一化加权和的计算方式。\n\
    \n**图13-15**\n聚合数据归一化到[-1, 1]\n\n按照以下说明完成层1的数据转换和输出生成：\n\n4.  在单元格`P10`中输入文本“Output-1”，在单元格`Q10`中输入文本“Error-1”。\n\
    \n5.  在单元格`M11`中输入公式`=1/(1+EXP(-J11))`。\n\n6.  从单元格`M11`自动填充到`O11`，然后一起从单元格`M11:O11`自动填充到`M182:O182`。\n\
    \n7.  在单元格`P11`中，输入公式`=MMULT(M11:O11,$G$2:$G$4)+$H$2`。这是来自隐藏层1的输出。\n\n8.  在单元格`Q11`中，输入公式`=(P11-F11)^2`。这是当前参数设置下层1的误差。\n\
    \n9.  分别将`P11`和`Q11`自动填充到`P182`和`Q182`。\n\n10. 在单元格`P1`中，输入文本“Error Sum1”。\n\n\
    11. 在单元格`Q1`中，输入公式`=SUM(Q11:Q182)`。\n\n工作表的一部分应如图[13-16](#494428_2_En_13_Chapter.xhtml#Fig16)所示。\n\
    \n![](images/494428_2_En_13_Chapter/494428_2_En_13_Fig16_HTML.jpg)\n\nExcel工作表的截图展示了层1输出和计算出的误差数据。\n\
    \n**图13-16**\n层1输出和计算出的误差\n\n在神经网络中，每一层都应该在将其输出作为输入传递给下一层之前优化其参数集。这就是我们必须计算层1的输出和误差总和的原因。我们需要使用求解器通过最小化层1的误差总和来优化层1的参数。\n\
    \n12. 点击“数据” ➤ “求解器”；按照图[13-17](#494428_2_En_13_Chapter.xhtml#Fig17)所示设置求解器的参数。取消选中“使无约束变量为非负数”。点击“求解”。\n\
    \n![](images/494428_2_En_13_Chapter/494428_2_En_13_Fig20_HTML.jpg)"
  raw: "12.  Enter the formula `=SUM(X511:X693)` in cell T6\\. The number in T6 tells\
    \ how many testing samples are not correctly predicted by our neural network model.\
    \ Be careful that the cell range in this formula is X511:X693.\n\nPart of our\
    \ worksheet looks exactly like Figure [13-13](#494428_2_En_13_Chapter.xhtml#Fig13).\
    \ There are 5 out of 183 testing samples that are not correctly predicted, which\
    \ accounts to the accuracy rate of 97.3%. You can find the completed result in\
    \ Chapter13-1b..xlsx.\n\nFor this specific breast cancer dataset, both benign\
    \ and malignant classes are well characterized by the nine attributes. It is not\
    \ difficult to differentiate between the two classes. The purpose of the preceding\
    \ step-by-step instructions in Excel is to dissect the neural network modeling\
    \ process and present us a clear image about how a simple neural network model\
    \ works.\n\nAs shown in Q7:R7, the target class distribution is not very well\
    \ balanced. Since we didn’t balance the target class distribution, it is a good\
    \ idea to examine how well our model can accurately predict the underrepresented\
    \ class (which is 4). A little bit more analysis will soon confirm us that the\
    \ accuracy rate is 94.6% for our model to predict the underrepresented class,\
    \ a fairly good performance.\n\n### Experiment 2\n\nLet’s start another experiment\
    \ during which we are going to build a neural network with two hidden layers.\
    \ Still, each hidden layer has three neurons. When there is more than one hidden\
    \ layer, the neural network is usually called deep learning. Note, true deep learning\
    \ usually has more than two hidden layers and much more neurons.\n\nOpen the file\
    \ Chapter13-2a.xlsx. The data inside are experimental results for short hairpin\
    \ RNA (shRNA) efficacy prediction. The data were preprocessed and simplified.\
    \ There are four attributes used to predict the target Class which has three distinct\
    \ values: 39 = low efficacy, 69 = medium efficacy, and 84 = high efficacy. Rows\
    \ 11–182 are the training dataset, while rows 183–190 are the scoring dataset.\
    \ The worksheet is set up like Figure [13-14](#494428_2_En_13_Chapter.xhtml#Fig14).\
    \ Note that different neurons start with different weights and biases. W21, W22,\
    \ W23, and B2 are the weights and bias for the neurons in hidden layer 2. We will\
    \ call the two hidden layers “layer 1” and “layer 2”, respectively, hereafter.\n\
    \n![](images/494428_2_En_13_Chapter/494428_2_En_13_Fig14_HTML.jpg)\n\nA screenshot\
    \ of the Excel sheet illustrates the experiment results.\n\nFigure 13-14\n\nExperiment\
    \ 2 data setup\n\n![](images/494428_2_En_13_Chapter/494428_2_En_13_Fig17_HTML.jpg)\n\
    \nA screenshot of the Solver Properties window. The parameters for the hidden\
    \ layer 1 are set.\n\nFigure 13-17\n\nSolver for hidden layer 1 parameter optimization\n\
    \n1.  Enter in cell G11 the following formula:\n\n```\n    =SUMPRODUCT($B11:$E11,INDEX($B$2:$E$4,G$10,\
    \ 0))+INDEX($F$2:$F$4,G$10,1)\n    ```\n\nAgain, this formula implements the linear\
    \ expression w1x1 + w2x2 + w3x3 + … + b.\n\n2.  Autofill from G11 to I11 and then\
    \ autofill together to G182:I182.\n\n3.  To normalize the data into range [-1,\
    \ 1], we need to normalize the data into range [0, 1] first, multiply by 2, and\
    \ then subtract by 1\\. Thus, we need to do the following:\n    *   In cell G6,\
    \ enter the formula `=MAX(G11:G182)`; autofill from G6 to I6.\n\n*   In cell G7,\
    \ enter the formula `=MIN(G11:G182)`; autofill from G7 to I7.\n\n*   In cell J11,\
    \ enter the formula `=(G11-G$7)/(G$6-G$7)*2-1`. Autofill from cell J11 to cell\
    \ L182.\n\nPart of our worksheet looks like Figure [13-15](#494428_2_En_13_Chapter.xhtml#Fig15).\n\
    \n![](images/494428_2_En_13_Chapter/494428_2_En_13_Fig15_HTML.jpg)\n\nA screenshot\
    \ of the Excel sheet demonstrates how the normalized weighted sum is calculated.\n\
    \nFigure 13-15\n\nAggregated data normalized to [-1, 1]\n\nFollow these instructions\
    \ to finish layer 1 data transformation and output generation:\n\n4.  Enter the\
    \ text “Output-1” in cell P10 and text “Error-1” in cell Q10.\n\n5.  Enter the\
    \ formula `=1/(1+EXP(-J11))` in cell M11.\n\n6.  Autofill from cell M11 to cell\
    \ O11, then autofill together from cells M11:O11 to cells M182:O182.\n\n7.  In\
    \ cell P11, enter the formula `=MMULT(M11:O11,$G$2:$G$4)+$H$2`. This is the output\
    \ from hidden layer 1.\n\n8.  In cell Q11, enter the formula `=(P11-F11)^2`. This\
    \ is the error of layer 1 with the current parameter settings.\n\n9.  Autofill\
    \ P11 and Q11 to P182 and Q182, respectively.\n\n10.  In cell P1, enter the text\
    \ “Error Sum1”.\n\n11.  In cell Q1, enter the formula `=SUM(Q11:Q182)`.\n\nPart\
    \ of our worksheet should look like Figure [13-16](#494428_2_En_13_Chapter.xhtml#Fig16).\n\
    \n![](images/494428_2_En_13_Chapter/494428_2_En_13_Fig16_HTML.jpg)\n\nA screenshot\
    \ of the Excel sheet illustrates the layer 1 output and error calculated data.\n\
    \nFigure 13-16\n\nLayer 1 output and error calculated\n\nIn a neural network,\
    \ every layer is supposed to optimize its parameter set before it passes on its\
    \ output to the next layer as input. This is why we must compute the output and\
    \ error sum of layer 1\\. We need to use Solver to optimize layer 1 parameters\
    \ by minimizing the error sum of layer 1.\n\n12.  Click Data ➤ Solver; set up\
    \ the parameters of Solver as shown in Figure [13-17](#494428_2_En_13_Chapter.xhtml#Fig17).\
    \ Leave “Make Unconstrained Variables Non-Negative” unchecked. Click Solve.\n\n\
    ![](images/494428_2_En_13_Chapter/494428_2_En_13_Fig20_HTML.jpg)"
