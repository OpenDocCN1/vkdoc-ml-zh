  trans: "\n![](img/494428_2_En_14_Fig19_HTML.jpg)\n\n一个包含 15 行 8 列、展示分词后单词极性得分的截图。这些单词包括：the\
    \ hotel it is fantastic, the environment it is great, cozy, breakfast has high-quality\
    \ products but it lacks in choice, price utterly ridiculous for what you get,\
    \ 10 stars, everything ok 等。\n\n图 14-19\n\n为分词后的单词和二元词组计算的极性得分\n\n1.  所有单词（包括单个单词和二元词组）都已分词并放置在单元格\
    \ AL1:BB34 中。现在需要计算每个句子的得分。在单元格 BC1 中，输入以下公式：\n\n```\n    =IFERROR(INDEX(kws,\
    \ MATCH(AL1, kw, 0), 1), 0)\n    ```\n\n此公式用于计算单元格 AL1 中单词（“hotel”）的极性得分。\n\n\
    当 MATCH 函数在关键词数组（由名称 kw 表示）中找不到 AL1 的完全匹配项时，会返回 #NA 错误。因此，IFERROR 函数确保当不存在此类关键词并因此出现\
    \ #NA 错误时，返回 0。当 MATCH 函数成功时，它会返回该单词在数组 kw 中的位置。该位置被传递给 INDEX 函数，以在关键词得分数组（由名称\
    \ kws 表示）中找到对应的得分。\n\n请特别注意表达式 `INDEX(kws, MATCH(AL1, kw, 0), 1)`。MATCH 函数中的最后一个参数是\
    \ 0，表示要求精确匹配。INDEX 函数中的最后一个参数是 1，因为 kws 只有一列。\n\n2.  从单元格 BC1 自动填充到单元格 BS1，然后一起自动填充到单元格\
    \ BC34:BS34。BC1:BS34 是一个稀疏矩阵。工作表的一部分如图 14-19 所示。\n\n![](img/494428_2_En_14_Fig20_HTML.jpg)\n\
    \n一个包含 19 行 4 列、展示部分酒店评论及其极性得分的截图。这些单词包括：the hotel it is fantastic, the environment\
    \ it is great, cozy, breakfast has high-quality products but it lacks in choice,\
    \ price utterly ridiculous for what you get, 10 stars, everything ok 等。\n\n图 14-20\n\
    \n酒店评论的情感分析\n\n1.  在单元格 BT1 中，输入公式 `=SUM(BC1:BS1)`。此公式对第一个句子的所有得分进行求和。\n\n2. \
    \ 从单元格 BT1 自动填充到单元格 BT34。\n\n3.  在单元格 BU1 中，输入公式：\n\n```\n    =IF(BT1>0,\"Positive\"\
    , IF(BT1=0,\"Neutral\",\"Negative\"))\n    ```\n\n如果求和得分为正，则该句子被视为正面评价。如果求和得分为\
    \ 0，则该句子被视为中性评价，否则为负面评价。\n\n4.  从单元格 BU1 自动填充到单元格 BU34。\n\n5.  通过冻结 B 列（点击 B 列\
    \ ➤ 点击“视图” ➤ 点击“冻结窗格” ➤ 选择“冻结窗格”），我们的最终结果如图 14-20 所示。\n\n完整的文本挖掘工作可在 Chapter14-1b.xlsx\
    \ 和 Chapter14-1c.xlsx 文件中找到。\n\nChapter14-1b.xlsx 未使用 TEXTJOIN 函数，而 Chapter14-1c.xlsx\
    \ 使用了。\n\n仔细检查我们的结果后发现，我们的文本挖掘模型对评论 9、15、16、20 和 26 的效果不佳。但这并不意味着我们的挖掘工作是失败的。评论\
    \ 9（“10 stars!”）、15（“A five star stay!”）和 20（“Not cheap, but worthy.”）可以通过添加更多关键词来正确评估。评论\
    \ 26（“want to say ‘Thanks’ to all of you!”）也可以通过应用词干提取技术来正确评估。\n\n有些单词虽然写法不同，但含义相同，例如“thanks”和“thank\
    \ you”。其他例子包括“book”和“books”、“imply”和“implies”等。“Thanks”、“books”和“implies”都源自它们的基本词干（“thank”、“book”和“imply”）。将单词还原为其基本词干在文本挖掘中称为词干提取。当然，将“thanks”还原为“thank”可以将评论\
    \ 26 评估为正面评价。\n\n真正具有挑战性的是评论 16（“Come back again is not even a question.”）。我们知道这是一条正面评论，但许多计算机算法无法将其识别为正面评论。正是因为有这样的句子，文本挖掘才成为一项极具挑战性和复杂性的任务。本章仅提供一个教学示例。因此，我不会在本书中解释如何处理这样的句子。\n\
    \n文本挖掘还可以识别评论、反馈和客户支持查询中出现频率最高的单词。高频词可以告知我们客户面临的常见问题。词频（TF）也可以与另一个概念——逆文档频率（IDF）结合使用，用于对网络搜索中的网页进行排名。\n\
    \n当然，Excel 并不适合对网页进行排名。这只是展示 Excel 在数据挖掘中应用局限性的一个例子。然而，通过越来越多的插件，Excel 在数据挖掘或机器学习方面的功能正变得越来越强大，尽管本书试图在不使用额外插件的情况下演示\
    \ Excel 的用法。"
- fmt: '# Word Embedding and ChatGPT


    Don’t be misled by the heading of this section. There does not seem to have a
    way for Excel to successfully simulate word embedding (also known as text embedding),
    let alone to simulate ChatGPT. However, since ChatGPT has brought us a dizzying
    AI revolution which may reshape the course of human as an intelligent species,
    I would like to talk about them briefly here.


    As mentioned before, to process text data via computers, we need to arrange the
    data in a table format. This is exactly what word embedding does. The brilliance
    of embedding is to use a numerical vector to define a word, each numerical value
    representing a certain unknown property of the word. Thus, all words in a corpus
    can be represented numerically by a matrix. For example, assume our corpus is
    the sentence “At the most beautiful place remember the most beautiful you” and
    every word has seven properties; once we have tokenized each word, we may randomly
    get a matrix like Table [14-1](#494428_2_En_14_Chapter.xhtml#Tab1).


    **Table 14-1** A sample word embedding matrix. Notice that some words are repeated


    | Words | P1 | P2 | P3 | P4 | P5 | P6 | P7 |

    | --- | --- | --- | --- | --- | --- | --- | --- |

    | at | 0.6 | -0.9 | 0.1 | -0.4 | -0.2 | -0.1 | -0.9 |

    | the | 0.2 | -0.9 | 1.0 | 0.9 | -0.8 | 0.5 | 0.0 |

    | most | 0.5 | 0.5 | 0.4 | -0.1 | -0.1 | 0.2 | 0.9 |

    | beautiful | 0.0 | 0.9 | 0.3 | -1.0 | 0.7 | -0.4 | -0.3 |

    | place | -0.6 | 0.7 | -1.0 | -0.9 | 0.0 | -0.3 | 1.0 |

    | remember | 0.8 | 1.0 | 0.8 | 0.5 | 0.0 | -0.5 | -0.4 |

    | the | 0.2 | -0.9 | 1.0 | 0.9 | -0.8 | 0.5 | 0.0 |

    | most | 0.5 | 0.5 | 0.4 | -0.1 | -0.1 | 0.2 | 0.9 |

    | beautiful | 0.0 | 0.9 | 0.3 | -1.0 | 0.7 | -0.4 | -0.3 |

    | you | 0.6 | -0.1 | 0.5 | -0.4 | 0.0 | 0.8 | -0.5 |


    By convention, when a word is represented by a vector of N numerical values, we
    say that the embedding dimension size is N, or the dimension of the word vector
    is N, instead of saying N properties. In natural language processing (NLP), especially
    for a large language model (LLM), the embedding dimension size is usually at the
    magnitude of hundreds, thousands, or even much larger.


    When we conducted sentiment analysis on hotel reviews, we predefined stop words
    and polarity words. However, in word embedding, the numerical vector of each word
    is not predefined; instead, it is trained and optimized through a neural network.
    This is the beauty of the embedding technique! In a LLM, the first hidden layer
    is always the embedding layer, which reveals that embedding is the foundation
    of very large language models. Once the training and testing of such a model is
    completed, the embedding matrix is optimized, that is, pretrained. A successfully
    well pretrained embedding matrix can precisely define almost all the words for
    other language processing tasks, for example, the famous `Word2Vec`.


    Assume that our neural network model achieved a well pretrained embedding matrix
    whose word vector is of two dimensions. Our embedding matrix might give us (`king`:
    -0.2, 0.9), (`man`: -0.2, 0.5), (`woman`: 0.3, -0.2), and (`queen`: 0.3, 0.2).
    We then could mathematically “prove” that `king – man + woman = queen`, an interesting
    equation originally obtained by `Word2Vec` (note, `Word2Vec`’s embedding dimension
    is unknown, but roughly between 100 and 1000).


    GPT stands for Generative Pre-Trained Transformer. You may get confused by the
    two words “generative” and “transformer”. Well, the data mining methods or machine
    learning models we have learned in this book can only make discoveries, they do
    not generate anything new by themselves. A GPT model, however, can make creations,
    that is, “generate”, by themselves. Transformer is a new type of neural network
    model that can learn and evolve. In some sense, it has self-attention. At the
    end, ChatGPT is a large language model developed by the company OpenAI and pretrained
    to perform various NLP tasks.


    The embedding technology plays a very important role in ChatGPT. Though OpenAI
    released that ChatGPT 3 has 175 billion parameters, its embedding dimension is
    unknown (at least to me). But we can safely say that its embedding dimension is
    fairly large.


    ## Reinforcement Exercises


    The only reinforcement exercise is presented in the file `Chapter14-HW.xlsx`.
    Inside this file, you shall find out that a dictionary has already been prepared
    for you, though you are welcome to revise it. Based on the given dictionary, `Chapter14-HW-withAnswers.xlsx`
    presents a standard solution without making use of the `TEXTJOIN` function. As
    its name suggests, `Chapter14-HW-withAnswers-UseTEXTJOIN.xlsx` provides a solution
    that makes use of the `TEXTJOIN` function. At the time when I revise this book,
    I am sure that `TEXTJOIN` function is available to most Excel users.


    ## Review Points


    1. Structured and unstructured data

    2. Applications of text mining

    3. Term frequency, polarity score, tokenize, keywords, stop words, stemming, n-gram

    4. Excel functions `IF`, `COUNTIFS`, `INDEX`, `MATCH`, `AND`

    5. Excel functions `IFERROR`, `OR`, `ISBLANK`, `MID`, `TRIM`, `LEN`, `LOWER`

    6. Name Manager

    7. Text to Columns

    8. Excel function `TEXTJOIN`

    9. Word embedding'
  raw: '## Word Embedding and ChatGPT


    Don’t be misled by the heading of this section. There does not seem to have a
    way for Excel to successfully simulate word embedding (also known as text embedding),
    let alone to simulate ChatGPT. However, since ChatGPT has brought us a dizzying
    AI revolution which may reshape the course of human as an intelligent species,
    I would like to talk about them briefly here.


    As mentioned before, to process text data via computers, we need to arrange the
    data in a table format. This is exactly what word embedding does. The brilliance
    of embedding is to use a numerical vector to define a word, each numerical value
    representing a certain unknown property of the word. Thus, all words in a corpus
    can be represented numerically by a matrix. For example, assume our corpus is
    the sentence “At the most beautiful place remember the most beautiful you” and
    every word has seven properties; once we have tokenized each word, we may randomly
    get a matrix like Table [14-1](#494428_2_En_14_Chapter.xhtml#Tab1).


    Table 14-1


    A sample word embedding matrix. Notice that some words are repeated


    | Words | P1 | P2 | P3 | P4 | P5 | P6 | P7 |

    | --- | --- | --- | --- | --- | --- | --- | --- |

    | at | 0.6 | -0.9 | 0.1 | -0.4 | -0.2 | -0.1 | -0.9 |

    | the | 0.2 | -0.9 | 1.0 | 0.9 | -0.8 | 0.5 | 0.0 |

    | most | 0.5 | 0.5 | 0.4 | -0.1 | -0.1 | 0.2 | 0.9 |

    | beautiful | 0.0 | 0.9 | 0.3 | -1.0 | 0.7 | -0.4 | -0.3 |

    | place | -0.6 | 0.7 | -1.0 | -0.9 | 0.0 | -0.3 | 1.0 |

    | remember | 0.8 | 1.0 | 0.8 | 0.5 | 0.0 | -0.5 | -0.4 |

    | the | 0.2 | -0.9 | 1.0 | 0.9 | -0.8 | 0.5 | 0.0 |

    | most | 0.5 | 0.5 | 0.4 | -0.1 | -0.1 | 0.2 | 0.9 |

    | beautiful | 0.0 | 0.9 | 0.3 | -1.0 | 0.7 | -0.4 | -0.3 |

    | you | 0.6 | -0.1 | 0.5 | -0.4 | 0.0 | 0.8 | -0.5 |


    By convention, when a word is represented by a vector of N numerical values, we
    say that the embedding dimension size is N, or the dimension of the word vector
    is N, instead of saying N properties. In natural language processing (NLP), especially
    for a large language model (LLM), the embedding dimension size is usually at the
    magnitude of hundreds, thousands, or even much larger.


    When we conducted sentiment analysis on hotel reviews, we predefined stop words
    and polarity words. However, in word embedding, the numerical vector of each word
    is not predefined; instead, it is trained and optimized through a neural network.
    This is the beauty of the embedding technique! In a LLM, the first hidden layer
    is always the embedding layer, which reveals that embedding is the foundation
    of very large language models. Once the training and testing of such a model is
    completed, the embedding matrix is optimized, that is, pretrained. A successfully
    well pretrained embedding matrix can precisely define almost all the words for
    other language processing tasks, for example, the famous Word2Vec.


    Assume that our neural network model achieved a well pretrained embedding matrix
    whose word vector is of two dimensions. Our embedding matrix might give us (king:
    -0.2, 0.9), (man: -0.2, 0.5), (woman: 0.3, -0.2), and (queen: 0.3, 0.2). We then
    could mathematically “prove” that king – man + woman = queen, an interesting equation
    originally obtained by Word2Vec (note, Word2Vec’s embedding dimension is unknown,
    but roughly between 100 and 1000).


    GPT stands for Generative Pre-Trained Transformer. You may get confused by the
    two words “generative” and “transformer”. Well, the data mining methods or machine
    learning models we have learned in this book can only make discoveries, they do
    not generate anything new by themselves. A GPT model, however, can make creations,
    that is, “generate”, by themselves. Transformer is a new type of neural network
    model that can learn and evolve. In some sense, it has self-attention. At the
    end, ChatGPT is a large language model developed by the company OpenAI and pretrained
    to perform various NLP tasks.


    The embedding technology plays a very important role in ChatGPT. Though OpenAI
    released that ChatGPT 3 has 175 billion parameters, its embedding dimension is
    unknown (at least to me). But we can safely say that its embedding dimension is
    fairly large.


    ## Reinforcement Exercises


    The only reinforcement exercise is presented in the file Chapter14-HW.xlsx. Inside
    this file, you shall find out that a dictionary has already been prepared for
    you, though you are welcome to revise it. Based on the given dictionary, Chapter14-HW-withAnswers.xlsx
    presents a standard solution without making use of the TEXTJOIN function. As its
    name suggests, Chapter14-HW-withAnswers-UseTEXTJOIN.xlsx provides a solution that
    makes use of the TEXTJOIN function. At the time when I revise this book, I am
    sure that TEXTJOIN function is available to most Excel users.


    ## Review Points


    1.  Structured and unstructured data


    2.  Applications of text mining


    3.  Term frequency, polarity score, tokenize, keywords, stop words, stemming,
    n-gram


    4.  Excel functions IF, COUNTIFS, INDEX, MATCH, AND


    5.  Excel functions IFERROR, OR, ISBLANK, MID, TRIM, LEN, LOWER


    6.  Name Manager


    7.  Text to Columns


    8.  Excel function TEXTJOIN


    9.  Word embedding'
  trans: '

    ## 词嵌入与 ChatGPT


    不要被本节标题误导。Excel 似乎无法成功模拟词嵌入（也称为文本嵌入），更不用说模拟 ChatGPT 了。然而，由于 ChatGPT 给我们带来了一场令人目眩的
    AI 革命，这场革命可能会重塑人类作为智慧物种的进程，因此我想在此简要谈谈它们。


    如前所述，要通过计算机处理文本数据，我们需要将数据整理成表格格式。这正是词嵌入所做的。嵌入的精妙之处在于使用一个数值向量来定义一个词，每个数值代表该词的某个未知属性。因此，语料库中的所有单词都可以通过一个矩阵用数值表示。例如，假设我们的语料库是句子“At
    the most beautiful place remember the most beautiful you”，并且每个单词有七个属性；一旦我们对每个单词进行了分词，我们可能会随机得到一个像表
    14-1 这样的矩阵。


    表 14-1


    一个示例词嵌入矩阵。注意有些单词是重复的


    | 单词 | P1 | P2 | P3 | P4 | P5 | P6 | P7 |

    | --- | --- | --- | --- | --- | --- | --- | --- |

    | at | 0.6 | -0.9 | 0.1 | -0.4 | -0.2 | -0.1 | -0.9 |

    | the | 0.2 | -0.9 | 1.0 | 0.9 | -0.8 | 0.5 | 0.0 |

    | most | 0.5 | 0.5 | 0.4 | -0.1 | -0.1 | 0.2 | 0.9 |

    | beautiful | 0.0 | 0.9 | 0.3 | -1.0 | 0.7 | -0.4 | -0.3 |

    | place | -0.6 | 0.7 | -1.0 | -0.9 | 0.0 | -0.3 | 1.0 |

    | remember | 0.8 | 1.0 | 0.8 | 0.5 | 0.0 | -0.5 | -0.4 |

    | the | 0.2 | -0.9 | 1.0 | 0.9 | -0.8 | 0.5 | 0.0 |

    | most | 0.5 | 0.5 | 0.4 | -0.1 | -0.1 | 0.2 | 0.9 |

    | beautiful | 0.0 | 0.9 | 0.3 | -1.0 | 0.7 | -0.4 | -0.3 |

    | you | 0.6 | -0.1 | 0.5 | -0.4 | 0.0 | 0.8 | -0.5 |


    按照惯例，当一个词由一个包含 N 个数值的向量表示时，我们说嵌入维度大小为 N，或者说词向量的维度是 N，而不是说 N 个属性。在自然语言处理（NLP）中，尤其是对于大型语言模型（LLM），嵌入维度大小通常达到数百、数千甚至更大。


    当我们在对酒店评论进行情感分析时，我们预定义了停用词和极性词。然而，在词嵌入中，每个词的数值向量并非预定义的；相反，它是通过神经网络训练和优化得到的。这就是嵌入技术的精妙之处！在大型语言模型中，第一个隐藏层始终是嵌入层，这表明嵌入是超大型语言模型的基础。一旦此类模型的训练和测试完成，嵌入矩阵就被优化了，也就是预训练好了。一个成功且预训练良好的嵌入矩阵可以精确地定义几乎所有单词，用于其他语言处理任务，例如著名的
    Word2Vec。


    假设我们的神经网络模型获得了一个预训练良好的嵌入矩阵，其词向量是二维的。我们的嵌入矩阵可能会给出（king: -0.2, 0.9）、（man: -0.2,
    0.5）、（woman: 0.3, -0.2）和（queen: 0.3, 0.2）。然后我们可以在数学上“证明” king – man + woman =
    queen，这是最初由 Word2Vec 得出的一个有趣等式（注意，Word2Vec 的嵌入维度未知，但大致在 100 到 1000 之间）。


    GPT 代表生成式预训练变换器。你可能会对“生成式”和“变换器”这两个词感到困惑。嗯，我们在本书中学到的数据挖掘方法或机器学习模型只能进行发现，它们本身不能生成任何新东西。然而，GPT
    模型可以自行进行创造，即“生成”。变换器是一种新型的神经网络模型，可以学习和进化。从某种意义上说，它具有自注意力机制。最后，ChatGPT 是由 OpenAI
    公司开发的一个大型语言模型，经过预训练以执行各种 NLP 任务。


    嵌入技术在 ChatGPT 中扮演着非常重要的角色。尽管 OpenAI 公布 ChatGPT 3 拥有 1750 亿个参数，但其嵌入维度是未知的（至少对我来说是未知的）。但我们可以肯定地说，它的嵌入维度相当大。


    ## 强化练习


    唯一的强化练习在文件 Chapter14-HW.xlsx 中。在这个文件中，你会发现已经为你准备了一个字典，当然你也可以自行修改。基于给定的字典，Chapter14-HW-withAnswers.xlsx
    提供了一个不使用 TEXTJOIN 函数的标准解决方案。顾名思义，Chapter14-HW-withAnswers-UseTEXTJOIN.xlsx 提供了一个使用
    TEXTJOIN 函数的解决方案。在我修订本书时，我确信大多数 Excel 用户都可以使用 TEXTJOIN 函数。


    ## 复习要点


    1.  结构化与非结构化数据


    2.  文本挖掘的应用


    3.  词频、极性得分、分词、关键词、停用词、词干提取、n-gram


    4.  Excel 函数 IF、COUNTIFS、INDEX、MATCH、AND


    5.  Excel 函数 IFERROR、OR、ISBLANK、MID、TRIM、LEN、LOWER


    6.  名称管理器


    7.  分列


    8.  Excel 函数 TEXTJOIN


    9.  词嵌入

    '
- fmt: '# 15. After Excel


    Excel is a remarkable tool for business intelligence, office jobs, and many other
    applications. Its greatness comes from many features it has, including formula
    and functions, autofill, automatic workbook calculation, add-in, etc. Via automatic
    workbook calculation, any modifications on the formula or the value inside a cell
    can trigger recalculations of all other cells that are directly or indirectly
    related to this cell, even if they are on a different worksheet. The recalculation
    can also reshape charts that are dependent on these cells. The value of a cell
    can also be linked to a form control, which renders visual control of data values
    and charts.


    Autofill automates the calculation of a large number of cells, which is an extremely
    powerful feature. This feature makes Excel capable of working with a dataset of
    large size. Data in Excel is automatically arranged in a table format, making
    Excel naturally suitable for many data mining techniques, too.


    The hundreds of functions in Excel make Excel programmable. We can treat an Excel
    formula like a programming statement, a worksheet like a modular function, a class,
    or a program. The available functions can be categorized based on their specific
    purposes, for example, financial, mathematical, statistical, references and lookup,
    etc. The creative uses of these functions offer us the opportunities to learn
    data mining step by step through Excel.


    The power of Excel has been evolving all the time. In the first Excel version
    I used, Excel 2003, its available numbers of the rows and columns were 65,536
    and 256, respectively. Since version 2007, the number of available rows is more
    than 1 million and the number of available columns is more than 16,000. The capacity
    of today’s Excel allows it to operate on large datasets.


    The available number of functions of Excel has been increasing all the time, too.
    Table 15-1 lists the new functions since version 2010 and the total functions
    since version 2007. Data in Table 15-1 were compiled from `https://support.office.com/`.
    Generally speaking, a larger set of functions indicates greater capabilities.


    I am sure by now we have accumulated quite some understanding about data mining
    and won’t consider data mining or machine learning a mysterious technology. We
    may also be asking what else Excel can do as there are many other data mining
    methods we have not touched in this book, for example, random forest, support
    vector machine, principal component analysis, deep learning, natural language
    processing (NLP), etc.


    **Table 15-1** Number of functions in different Excel versions


    | Office Version | 2007 | 2010 | 2013 | 2016 | 2019 | 2023/365 |

    | --- | --- | --- | --- | --- | --- | --- |

    | New Functions | | 56 | 51 | 6 | 16 | 11 |

    | Total Functions | 350 | 406 | 457 | 463 | 479 | 490 |


    I would like to emphasize that the purpose of this book is to introduce basic
    data mining methods through Excel examples. I have no intention to cover all possible
    data mining methods in this book, though the simplified versions of some other
    data mining methods can also be illustrated through Excel examples.


    We must also admit that Excel is not a programming language, that is, we must
    admit the limit of Excel in learning data mining. In the last chapter, I mentioned
    that Excel is not suitable for certain text mining tasks. In Chapter 12, I could
    show how to conduct an association analysis with itemsets of size 2 only. When
    the itemset size increases, the number of different itemsets goes up exponentially,
    and it becomes unsuitable and eventually impossible to conduct association analysis
    through Excel.


    Originally, data mining software tools provided semiautomatic mining processes.
    Users must apply one data mining method at a time. To compare the performances
    of different methods, users must try out different methods and compare their performances
    manually. Today automatic data mining becomes more and more popular. Software
    tools such as RapidMiner provide “Auto Model” that allows users to apply as many
    mining methods as they select and can automatically compare the performances of
    these methods. Some Python packages such as AutoGluon can even automatically complete
    the EDA and feature selection processes, generate new features (e.g., applying
    the embedding technique on text data), and construct an ensemble machine learning
    model that consists of a set of selected data mining methods. Certainly, it is
    much more difficult for Excel to provide such an automatic data mining feature,
    even though the Azure machine learning add-in is quite powerful. Once we have
    learned the data mining knowledge through Excel, we do need to be skilled in data
    mining software tools and/or languages if we have the desire to become a data
    mining or machine learning expert.


    Automatic data mining requires minimum effort in the mining phase but pushes large
    effort into the data preparation phase. As mentioned before, Excel can provide
    users direct visual examination of every data preparation operation. Thus, Excel
    will always play an important role for data mining practices. When the dataset
    is too large for Excel to operate on, Excel can still be a good tool to test the
    data preparation process at a smaller scale.


    Learning is a step-by-step process; it is not and never will be an automatic process.
    We know that learning by doing is the best educational approach. Learning data
    mining using Excel forces learners to go through every data mining step manually,
    offering them an active learning experience. I would state that the automatic
    data mining trend makes Excel even more important in studying data mining or machine
    learning.'
