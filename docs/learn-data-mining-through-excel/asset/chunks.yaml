- fmt: '# 排版后的内容


    A table represents data with K-means clustering. A table consists of 18 columns
    and 18 rows. The column headers are country, murder, assault, urban-pop, rape,
    mean with 5 sub-columns cluster, C 1, C 2, C 3 and C 4, and distance with 5 sub-columns
    with cluster, C 1, C 2, C 3, and C 4.


    **Figure 3-5** After first round of computation in worksheet 1


    1. Data in column Q specify the clusters to which each data point belongs based
    on the shortest distance rule. In cell Q3, enter the following formula:


    ```

    =INDEX($M$2:$P$2,1,MATCH(MIN(M3:P3),M3:P3,0))

    ```


    The syntax of function `MATCH` is `MATCH(lookup_value, lookup_array, match_type)`.
    If `match_type = 0`, the function is looking for an exact match in the `lookup_array`
    for the `lookup_value`. If not found, an `#N/A` error (value not available error)
    is returned. If found, the function returns the relative position in the array.
    Note, the first position in Microsoft Office tools is always 1.


    In the preceding formula, the `MATCH` function finds the relative column position
    of the minimum value of the array `M3:P3` (which is 4 in this specific case).
    The column position is fed to the `INDEX` function to find the proper cluster
    name in the array `M2:P2`. This formula determines in which cluster the data point
    L1 is.


    As there are only four clusters, a nested `IF` statement instead of the preceding
    formula suffices the purpose, too.


    ```

    =IF(MIN(M3:P3)=M3,"C1",IF(MIN(M3:P3)=N3,"C2", IF(MIN(M3:P3)=O3,"C3","C4")))

    ```


    In the nested `IF` formula, if the minimum value is the same as `M3`, return “C1”;
    else if the minimum value equals `N3`, return “C2”; else if the minimum value
    equals `O3`, return “C3”; else returns “C4”.


    We can tell when there are too many clusters, `INDEX` and `MATCH` functions are
    a better programming approach than nested `IF` statements.


    2. Autofill `Q3` to `Q52`. By now, our data look like Figure [3-5](#494428_2_En_3_Chapter.xhtml#Fig5).


    1. We now need to start the second round of the clustering process. Make a copy
    of worksheet 1 and rename the new worksheet 2. Yes, the name of the new worksheet
    is number 2! Also, make sure worksheet 2 is right to worksheet 1. Their order
    is very important.


    In worksheet 2, we need a formula in cell `H3` to recalculate the mean of attribute
    Murder for all data points inside cluster 1. The needed data are inside the worksheet
    1, however. A formula like the following can accomplish the job for us:


    ```

    =AVERAGEIFS(''1''!$B$3:''1''!$B$52, ''1''!$Q$3:''1''!$Q$52,H$2)

    ```


    Though this formula is inside worksheet 2, the data used are all in worksheet
    1, and `''1''!` references worksheet 1 by its name which is “1” indeed. This formula
    makes use of the function `AVERAGEIFS` to compute the mean of attribute Murder
    for all data points inside cluster 1. Note, only the data points (column B only,
    too) whose cluster name matches cell `H2` (C1) are averaged.


    However, the preceding formula is not good enough!


    First, this formula is computing an average. In the process of k-means clustering,
    it is possible that one cluster has no data points. In this case, the denominator
    will be zero and will result in a divided-by-zero error. Thus, we need to make
    use of `IFERROR` function to safeguard such a case.


    Second and the most important reason is that, when we need to start another clustering
    iteration in another worksheet 3, we must go to cell `H3` of worksheet 3 to change
    “1” to “2”, because worksheet 3 must make use of data in worksheet 2. We do not
    want to manually revise our formulas again and again.


    To answer this challenge, we need to make use of the functions `SHEET`, `INDIRECT`,
    and `ADDRESS` and operator `&`.


    `SHEET` is a very interesting function which returns the sheet number of the referenced
    sheet. The leftmost worksheet in a workbook is numbered 1, the second leftmost
    worksheet is numbered 2, and so on. The syntax of `SHEET` is `SHEET(reference)`,
    where the argument is usually a cell reference, for example, `A1`.'
