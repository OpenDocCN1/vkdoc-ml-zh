- fmt: '# 散点图与线性回归


    一个散点图绘制了销售额与温度的关系，标题为“冰淇淋销售额（千美元）”。数据点从(86, 81.1)开始，上升到(95.2, 119)，并在(97.7, 132.4)达到峰值。回归线呈上升趋势，其方程为`y
    = 3.8394 * x - 253.17`。


    **图 2-3**


    ## 使用趋势线进行预测


    利用这条线性线，Tommy 可以估算出当温度 = 88.8 时，销售额约为 89,000 美元。使用方程`y = 3.8394 * x - 253.17`，其中`m`
    = 3.8394，`b` = -253.17，Tommy 可以更精确地预测他的冰淇淋销售额：


    ```

    3.8394 × 88.8 – 253.17 = $87.8k.

    ```


    这里的线性方程是本次特定线性回归研究的线性数据挖掘模型。我们了解到，对于这种形式的线性方程`y = mx + b`，`m`和`b`是两个决定因素。一旦找到`m`和`b`，模型就构建并最终确定。当然，对于这个简单案例，模型由`m`和`b`表示，也就是说，由`m`和`b`组成的参数集就是模型。模型构建过程就是寻找`m`和`b`的过程。


    ## 如何获得`m`和`b`？


    从图 [2-3](#494428_2_En_2_Chapter.xhtml#Fig3) 中，我们可以看出趋势线并未穿过每一个点，它只是遵循趋势。如果多个人手动独立绘制，可能会得到多条不同的趋势线。Excel
    是如何得出这条特定趋势线的呢？


    为了找到形如`y = mx + b`的特定线性方程，采用了最小二乘法。让我解释一下什么是最小二乘法。


    观察温度 = 91 对应的点，该点不在趋势线上。这表明趋势线（预测值）与实际数据之间存在误差（我们可以将其理解为差异）。事实上，图 [2-3](#494428_2_En_2_Chapter.xhtml#Fig3)
    中的所有数据点都存在微小误差。误差的平方和可以表示为：


    ![$$ E={\sum}_{i=1}^n{\left({y}_i-\left(m{x}_i+b\right)\right)}^2 $$](images/494428_2_En_2_Chapter/494428_2_En_2_Chapter_TeX_Equ1.png)


    (2-1)


    其中`y[i]`是训练数据集中与温度值`x[i]`对应的实际冰淇淋销售额。目标是使误差总和最小化。为此，我们可以求偏导数：


    ![$$ \frac{\partial E}{\partial x}=0\ \mathrm{and}\ \frac{\partial E}{\partial
    y}=0 $$](images/494428_2_En_2_Chapter/494428_2_En_2_Chapter_TeX_Equ2.png)


    (2-2)


    通过求解上述两个偏导数方程，我们可以得到`m`和`b`的值：


    ![$$ m=\frac{n{\sum}_{i=1}^n{x}_i{y}_i-\left({\sum}_{i=1}^n{x}_i\right)\left({\sum}_{i=1}^n{y}_i\right)}{n\left({\sum}_{i=1}^n{x_i}^2\right)-{\left({\sum}_{i=1}^n{x}_i\right)}^2}
    $$](images/494428_2_En_2_Chapter/494428_2_En_2_Chapter_TeX_Equ3.png)


    (2-3)


    ![$$ b=\frac{\left({\sum}_{i=1}^n{x_i}^2\right)\left({\sum}_{i=1}^n{y}_i\right)-\left({\sum}_{i=1}^n{x}_i\right)\left({\sum}_{i=1}^n{x}_i{y}_i\right)}{n\left({\sum}_{i=1}^n{x_i}^2\right)-{\left({\sum}_{i=1}^n{x}_i\right)}^2}
    $$](images/494428_2_En_2_Chapter/494428_2_En_2_Chapter_TeX_Equ4.png)


    (2-4)


    # 通过 Excel 学习线性回归


    在公式 ([2-3](#494428_2_En_2_Chapter.xhtml#Equ3)) 和 ([2-4](#494428_2_En_2_Chapter.xhtml#Equ4))
    中，`x[i]`是已知的平均每日最高温度，`y[i]`是与`x[i]`对应的实际冰淇淋销售额。它们来自表 [2-1](#494428_2_En_2_Chapter.xhtml#Tab1)
    所示的训练数据集。


    打开文件`Chapter2-1a.xlsx`。如图 [2-4](#494428_2_En_2_Chapter.xhtml#Fig4) 所示，在 C 列和 D
    列中输入文本和公式，以计算`m`和`b`的值。图 [2-4](#494428_2_En_2_Chapter.xhtml#Fig4) 中的公式基于公式 ([2-3](#494428_2_En_2_Chapter.xhtml#Equ3))
    和 ([2-4](#494428_2_En_2_Chapter.xhtml#Equ4))。请注意，在图 [2-4](#494428_2_En_2_Chapter.xhtml#Fig4)
    中，温度被重命名为`x`，冰淇淋销售额被重命名为`y`，以便设置更贴近公式 ([2-3](#494428_2_En_2_Chapter.xhtml#Equ3))
    和 ([2-4](#494428_2_En_2_Chapter.xhtml#Equ4))。


    ![](images/494428_2_En_2_Chapter/494428_2_En_2_Fig4_HTML.jpg)


    一个包含 4 列 8 行的表格。C 列和 D 列包含文本和公式，A 列中的温度被重命名为`x`，B 列中的冰淇淋销售额被重命名为`y`。


    **图 2-4** 通过最小二乘近似计算`m`和`b`


    在图 [2-4](#494428_2_En_2_Chapter.xhtml#Fig4) 中，`A:A`和`B:B`分别用于表示 A 列和 B 列中的所有单元格。因此，`=SUM(A:A)`和`=SUM(B:B)`将分别对
    A 列和 B 列中的所有单元格求和。此外，还使用了 Excel 函数`SUMPRODUCT`来简化两个数组之间的计算。对`SUMPRODUCT`的一个重要理解是，两个数组必须具有相同的类型和长度。这里，相同类型意味着两个数组可以都是列或都是行。计算出`m`和`b`后，Tommy
    可以完成他的预测，如图 [2-5](#494428_2_En_2_Chapter.xhtml#Fig5) 所示（在单元格`D12`中输入公式`=D$8*C12
    + D$9`，并从`D12`自动填充到`D14`）。


    ![](images/494428_2_En_2_Chapter/494428_2_En_2_Fig5_HTML.jpg)


    一个包含 4 列 13 行的表格。C 列和 D 列包含文本和公式，A 列中的温度被重命名为`x`，B 列中的冰淇淋销售额被重命名为`y`。该表格突出显示了评分数据和预测。


    **图 2-5** 基于线性回归模型的预测


    对于这个特定示例，计算`m`和`b`的更有效方法是使用`SLOPE`和`INTERCEPT`这两个函数。请按照以下说明练习使用这两个函数：


    ![](images/494428_2_En_2_Chapter/494428_2_En_2_Fig6_HTML.jpg)


    一个包含 2 列 8 行的表格。A 列中的温度被重命名为`x`，B 列中的冰淇淋销售额被重命名为`y`。


    **图 2-6** 准备数据以使用`SLOPE`和`INTERCEPT`函数


    1.  如图 [2-6](#494428_2_En_2_Chapter.xhtml#Fig6) 所示输入`x`和`y`值。注意：仅输入`x`和`y`值。C
    列和 D 列为空。

    2.  在单元格`C2`中输入`m`，在单元格`D2`中输入`b`。

    3.  在单元格`C3`中输入公式`=SLOPE(B2:B9, A2:A9)`。

    4.  在单元格`D3`中输入公式`=INTERCEPT(B2:B9, A2:A9)`。


    结果应如图 [2-7](#494428_2_En_2_Chapter.xhtml#Fig7) 所示。


    ![](images/494428_2_En_2_Chapter/494428_2_En_2_Fig7_HTML.jpg)


    一个包含 4 列 8 行的表格。A 列中的温度被重命名为`x`，B 列中的冰淇淋销售额被重命名为`y`，C 列的`m`值为 3.8394（斜率），D 列的`b`值为
    -253.2（截距）。


    **图 2-7** 通过`SLOPE`和`INTERCEPT`函数获得的结果


    另一种获取`m`和`b`值的方法是通过 Excel 的“数据分析”工具。这是许多人采用的一种流行方法，尽管我不喜欢它。使用“数据分析”工具进行回归的缺点是，一旦获得系数和截距值，它们不会随着训练数据的变化而更新。


    默认情况下，我们的 Excel 没有“数据分析”工具。要使其可用，我们必须启用 Excel 中内置的加载项“分析工具库”。稍后当我们需要使用“规划求解”时，我将向您展示如何在
    Excel 中启用“分析工具库”和“规划求解”。目前，我们不需要使用“数据分析”工具。


    上述学习过程的结果存储在文件`Chapter2-1b.xlsx`中。'
  raw: 'A scattered graph plots sales versus temperature titled ice cream sales in
    dollars in thousands. The data points start at 86, 81.1, rise at 95.2, 119, and
    peak at 97.7, 132.4\. The line of regression has an increasing trend for an equation
    y = 3.8394 multiplied by x negative 253.17.


    Figure 2-3


    Using trendline to predict


    With this linear line, Tommy can then estimate that when the temperature = 88.8,
    the sales would be about $89k. Using the equation *y* = 3.8394*x* − 253.17, where
    `m` = 3.8394 and `b` = -253.17, Tommy can predict his ice cream sales more precisely:


    ```

    3.8394 × 88.8 – 253.17 = $87.8k.

    ```


    The linear equation here is the linear data mining model for this specific linear
    regression study. We understand that for this type of linear equation `y = mx
    + b`, `m` and `b` are the two determinants. Once `m` and `b` are found, the model
    is constructed and finalized. Certainly, for this simple case, the model is represented
    by `m` and `b`, that is, the parameter set composed of `m` and `b` is the model.
    The model construction process is to find `m` and `b`.


    How are `m` and `b` obtained? From Figure [2-3](#494428_2_En_2_Chapter.xhtml#Fig3),
    we can tell that the trendline does not pass through every point, it only follows
    the trend. There could be multiple distinct trendlines if several people are drawing
    it manually and independently. How does Excel come up with this specific trendline?


    To find a specific linear equation in the form of `y = mx + b`, the least square
    method is employed. Let me explain what the least square method is.


    Observe the point corresponding to temperature = 91, the dot is not on the trendline.
    This indicates that there is an error (we can understand it as difference) between
    the trendline (the predicted value) and the actual data. In fact, all the data
    points in Figure [2-3](#494428_2_En_2_Chapter.xhtml#Fig3) have small errors. The
    sum of the squares of the errors can be represented as


    ![$$ E={\sum}_{i=1}^n{\left({y}_i-\left(m{x}_i+b\right)\right)}^2 $$](images/494428_2_En_2_Chapter/494428_2_En_2_Chapter_TeX_Equ1.png)


    (2-1)


    where *y*[*i*] is the actual ice cream sale corresponding to the temperature value
    *x*[*i*] in the training dataset. The goal is to minimize the sum of the errors.
    For this purpose, we can take the partial derivatives:


    ![$$ \frac{\partial E}{\partial x}=0\ \mathrm{and}\ \frac{\partial E}{\partial
    y}=0 $$](images/494428_2_En_2_Chapter/494428_2_En_2_Chapter_TeX_Equ2.png)


    (2-2)


    By solving the preceding two partial derivative equations, we can obtain the values
    of `m` and `b` as


    ![$$ m=\frac{n{\sum}_{i=1}^n{x}_i{y}_i-\left({\sum}_{i=1}^n{x}_i\right)\left({\sum}_{i=1}^n{y}_i\right)}{n\left({\sum}_{i=1}^n{x_i}^2\right)-{\left({\sum}_{i=1}^n{x}_i\right)}^2}
    $$](images/494428_2_En_2_Chapter/494428_2_En_2_Chapter_TeX_Equ3.png)


    (2-3)


    ![$$ b=\frac{\left({\sum}_{i=1}^n{x_i}^2\right)\left({\sum}_{i=1}^n{y}_i\right)-\left({\sum}_{i=1}^n{x}_i\right)\left({\sum}_{i=1}^n{x}_i{y}_i\right)}{n\left({\sum}_{i=1}^n{x_i}^2\right)-{\left({\sum}_{i=1}^n{x}_i\right)}^2}
    $$](images/494428_2_En_2_Chapter/494428_2_En_2_Chapter_TeX_Equ4.png)


    (2-4)


    ## Learn Linear Regression Through Excel


    In Equations ([2-3](#494428_2_En_2_Chapter.xhtml#Equ3)) and ([2-4](#494428_2_En_2_Chapter.xhtml#Equ4)),
    *x*[*i*] is the known averaged daily high temperature and *y*[*i*] is the actual
    ice cream sale corresponding to *x*[*i*]. They are from the training dataset shown
    in Table [2-1](#494428_2_En_2_Chapter.xhtml#Tab1).


    Open the file Chapter2-1a.xlsx. Enter the texts and formulas in columns C and
    D as shown in Figure [2-4](#494428_2_En_2_Chapter.xhtml#Fig4) to compute the values
    of `m` and `b`. The formulas in Figure [2-4](#494428_2_En_2_Chapter.xhtml#Fig4)
    are based on Equations ([2-3](#494428_2_En_2_Chapter.xhtml#Equ3)) and ([2-4](#494428_2_En_2_Chapter.xhtml#Equ4)).
    Observe that in Figure [2-4](#494428_2_En_2_Chapter.xhtml#Fig4), temperature is
    renamed as `x` and ice cream sale is renamed as `y` so that the setup follows
    Equations ([2-3](#494428_2_En_2_Chapter.xhtml#Equ3)) and ([2-4](#494428_2_En_2_Chapter.xhtml#Equ4))
    more closely.


    ![](images/494428_2_En_2_Chapter/494428_2_En_2_Fig4_HTML.jpg)


    A table consists of 4 columns and 8 rows. The columns consist of the texts and
    formulas in columns C and D, temperature is renamed as x in column A, and ice
    cream sale is renamed as y in column B.


    Figure 2-4


    Computing m and b via least square approximation


    In Figure [2-4](#494428_2_En_2_Chapter.xhtml#Fig4), A:A and B:B are used to represent
    all cells in column A and column B, respectively. Thus, =SUM(A:A) and =SUM(B:B)
    will sum up all cells in column A and column B, respectively. Also, an Excel function
    SUMPRODUCT is used to simplify the computation between two arrays. An important
    understanding of SUMPRODUCT is that the two arrays must be of the same type and
    length. Here, the same type means that the two arrays can be both a column and
    a row. With both `m` and `b` computed, Tommy can accomplish his predictions as
    shown in Figure [2-5](#494428_2_En_2_Chapter.xhtml#Fig5) (enter the formula `=D$8*C12
    + D$9` inside cell D12 and autofill from D12 to D14).


    ![](images/494428_2_En_2_Chapter/494428_2_En_2_Fig5_HTML.jpg)


    A table consists of 4 columns and 13 rows. The columns consist of the texts and
    formulas in columns C and D, temperature is renamed as x in column A, and ice
    cream sale is renamed as y in column B. The table highlights the scoring data
    and prediction


    Figure 2-5


    Prediction based on a linear regression model


    A much more efficient way to compute `m` and `b` is to make use of the two functions
    SLOPE and INTERCEPT for this specific example. Follow these instructions to practice
    the use of the two functions:


    ![](images/494428_2_En_2_Chapter/494428_2_En_2_Fig6_HTML.jpg)


    A table consists of 2 columns and 8 rows. The column consists of temperature is
    renamed as x in column A, and the ice cream sale is renamed as y in column B.


    Figure 2-6


    Prepare data to use functions SLOPE and INTERCEPT


    1.  Input the `x` and `y` values as shown Figure [2-6](#494428_2_En_2_Chapter.xhtml#Fig6).
    Note: input `x` and `y` values only. Columns C and D are empty.


    2.  Enter `m` in cell C2 and `b` in cell D2.


    3.  Enter the formula =SLOPE(B2:B9, A2:A9) in cell C3.


    1.  Enter the formula =INTERCEPT(B2:B9, A2:A9) in cell D3.


    The result should look like Figure [2-7](#494428_2_En_2_Chapter.xhtml#Fig7).


    ![](images/494428_2_En_2_Chapter/494428_2_En_2_Fig7_HTML.jpg)


    A table consists of 4 columns and 8 rows. The column consists of temperature is
    renamed as x in column A, and the ice cream sale is renamed as y in column B,
    column C has a value of m is 3.8394 which is slope, and column D has a value of
    b is negative 253.2 which is intercept.


    Figure 2-7


    The result obtained by the SLOPE and INTERCEPT functions


    Another way to obtain the values of `m` and `b` is through the Data Analysis tool
    of Excel. This is a popular approach to take by many people, though I dislike
    it. The disadvantage of using Data Analysis tool for regression is that once the
    coefficients and intercept value are obtained, they won’t update along with the
    changes in the training data.


    By default, our Excel does not have Data Analysis tool available. To make it available,
    we must enable the built-in add-in Analysis ToolPak in our Excel. I will show
    you how to enable Analysis ToolPak and Solver in our Excel later when we need
    to use Solver. As of right now, we do not need to use the Data Analysis tool.


    The results of the preceding learning processes are stored in the file Chapter2-1b.xlsx.'
  trans: '

    一张散点图绘制了销售额与温度的关系，标题为“冰淇淋销售额（单位：千美元）”。数据点从 (86, 81.1) 开始，上升到 (95.2, 119)，并在 (97.7,
    132.4) 达到峰值。回归线呈上升趋势，其方程为 y = 3.8394 * x - 253.17。


    图 2-3


    使用趋势线进行预测


    利用这条线性线，Tommy 可以估算出当温度 = 88.8 时，销售额约为 8.9 万美元。使用方程 *y* = 3.8394*x* − 253.17，其中
    `m` = 3.8394，`b` = -253.17，Tommy 可以更精确地预测他的冰淇淋销售额：


    ```

    3.8394 × 88.8 – 253.17 = 87.8 千美元。

    ```


    这里的线性方程就是本次特定线性回归研究的线性数据挖掘模型。我们知道，对于这种形式的线性方程 `y = mx + b`，`m` 和 `b` 是两个决定因素。一旦找到
    `m` 和 `b`，模型就构建并确定了。当然，对于这个简单的案例，模型由 `m` 和 `b` 表示，也就是说，由 `m` 和 `b` 组成的参数集就是模型。模型构建的过程就是寻找
    `m` 和 `b` 的过程。


    `m` 和 `b` 是如何得到的呢？从图 2-3 中我们可以看出，趋势线并未穿过每一个点，它只是遵循了趋势。如果由几个人手动独立绘制，可能会得到多条不同的趋势线。Excel
    是如何得出这条特定趋势线的呢？


    为了找到形如 `y = mx + b` 的特定线性方程，我们采用了最小二乘法。让我来解释一下什么是最小二乘法。


    观察温度 = 91 对应的点，该点并不在趋势线上。这表明趋势线（预测值）与实际数据之间存在误差（我们可以将其理解为差异）。事实上，图 2-3 中的所有数据点都存在微小误差。误差的平方和可以表示为


    ![$$ E={\sum}_{i=1}^n{\left({y}_i-\left(m{x}_i+b\right)\right)}² $$](img/494428_2_En_2_Chapter_TeX_Equ1.png)


    (2-1)


    其中 *y*[*i*] 是训练数据集中与温度值 *x*[*i*] 对应的实际冰淇淋销售额。目标是使误差之和最小化。为此，我们可以求偏导数：


    ![$$ \frac{\partial E}{\partial x}=0\ \mathrm{and}\ \frac{\partial E}{\partial
    y}=0 $$](img/494428_2_En_2_Chapter_TeX_Equ2.png)


    (2-2)


    通过求解上述两个偏导数方程，我们可以得到 `m` 和 `b` 的值：


    ![$$ m=\frac{n{\sum}_{i=1}^n{x}_i{y}_i-\left({\sum}_{i=1}^n{x}_i\right)\left({\sum}_{i=1}^n{y}_i\right)}{n\left({\sum}_{i=1}^n{x_i}²\right)-{\left({\sum}_{i=1}^n{x}_i\right)}²}
    $$](img/494428_2_En_2_Chapter_TeX_Equ3.png)


    (2-3)


    ![$$ b=\frac{\left({\sum}_{i=1}^n{x_i}²\right)\left({\sum}_{i=1}^n{y}_i\right)-\left({\sum}_{i=1}^n{x}_i\right)\left({\sum}_{i=1}^n{x}_i{y}_i\right)}{n\left({\sum}_{i=1}^n{x_i}²\right)-{\left({\sum}_{i=1}^n{x}_i\right)}²}
    $$](img/494428_2_En_2_Chapter_TeX_Equ4.png)


    (2-4)


    ## 通过 Excel 学习线性回归


    在公式 (2-3) 和 (2-4) 中，*x*[*i*] 是已知的平均每日最高气温，*y*[*i*] 是与 *x*[*i*] 对应的实际冰淇淋销售额。它们来自表
    2-1 所示的训练数据集。


    打开文件 Chapter2-1a.xlsx。如图 2-4 所示，在 C 列和 D 列中输入文本和公式，以计算 `m` 和 `b` 的值。图 2-4 中的公式基于公式
    (2-3) 和 (2-4)。请注意，在图 2-4 中，温度被重命名为 `x`，冰淇淋销售额被重命名为 `y`，以便设置更贴近公式 (2-3) 和 (2-4)。


    ![](img/494428_2_En_2_Fig4_HTML.jpg)


    一个包含 4 列 8 行的表格。C 列和 D 列包含文本和公式，A 列中的温度被重命名为 x，B 列中的冰淇淋销售额被重命名为 y。


    图 2-4


    通过最小二乘近似计算 m 和 b


    在图 2-4 中，A:A 和 B:B 分别用于表示 A 列和 B 列中的所有单元格。因此，=SUM(A:A) 和 =SUM(B:B) 将分别对 A 列和 B
    列中的所有单元格求和。此外，还使用了 Excel 函数 SUMPRODUCT 来简化两个数组之间的计算。对 SUMPRODUCT 的一个重要理解是，两个数组必须具有相同的类型和长度。这里，相同的类型意味着两个数组可以都是列或都是行。计算出
    `m` 和 `b` 后，Tommy 就可以完成他的预测，如图 2-5 所示（在单元格 D12 中输入公式 `=D$8*C12 + D$9`，然后从 D12
    自动填充到 D14）。


    ![](img/494428_2_En_2_Fig5_HTML.jpg)


    一个包含 4 列 13 行的表格。C 列和 D 列包含文本和公式，A 列中的温度被重命名为 x，B 列中的冰淇淋销售额被重命名为 y。该表格突出显示了评分数据和预测结果。


    图 2-5


    基于线性回归模型的预测


    对于这个特定示例，计算 `m` 和 `b` 的一种更高效的方法是使用 SLOPE 和 INTERCEPT 这两个函数。请按照以下说明练习这两个函数的使用：


    ![](img/494428_2_En_2_Fig6_HTML.jpg)


    一个包含 2 列 8 行的表格。A 列中的温度被重命名为 x，B 列中的冰淇淋销售额被重命名为 y。


    图 2-6


    准备数据以使用 SLOPE 和 INTERCEPT 函数


    1.  如图 2-6 所示输入 `x` 和 `y` 值。注意：仅输入 `x` 和 `y` 值。C 列和 D 列为空。


    2.  在单元格 C2 中输入 `m`，在单元格 D2 中输入 `b`。


    3.  在单元格 C3 中输入公式 =SLOPE(B2:B9, A2:A9)。


    4.  在单元格 D3 中输入公式 =INTERCEPT(B2:B9, A2:A9)。


    结果应如图 2-7 所示。


    ![](img/494428_2_En_2_Fig7_HTML.jpg)


    一个包含 4 列 8 行的表格。A 列中的温度被重命名为 x，B 列中的冰淇淋销售额被重命名为 y，C 列的 m 值为 3.8394（即斜率），D 列的 b
    值为 -253.2（即截距）。


    图 2-7


    通过 SLOPE 和 INTERCEPT 函数得到的结果


    另一种获取 `m` 和 `b` 值的方法是通过 Excel 的数据分析工具。这是许多人采用的一种流行方法，尽管我不喜欢它。使用数据分析工具进行回归的缺点是，一旦获得系数和截距值，它们不会随着训练数据的变化而更新。


    默认情况下，我们的 Excel 没有数据分析工具。要使其可用，我们必须启用 Excel 中内置的加载项“分析工具库”。稍后当我们需要使用规划求解时，我会向您展示如何在
    Excel 中启用分析工具库和规划求解。目前，我们还不需要使用数据分析工具。


    上述学习过程的结果存储在文件 Chapter2-1b.xlsx 中。

    '
- fmt: '# Learn Multiple Linear Regression Through Excel


    Tommy has successfully predicted his ice cream sales, but he wants to improve
    his prediction even more. After some studies, he collected additional information
    such as the number of tourists (obtained from hotels) and the number of sunny
    days in a week. His updated training dataset is presented in Table 2-2.


    **Table 2-2** Ice cream sale vs. temperature, tourists, and sunny days


    | Temperature (F) | Tourists | Sunny Days | Ice Cream Sale (dollar in thousand)
    |

    | --- | --- | --- | --- |

    | 91 | 998 | 4 | 89.8 |

    | 87 | 1256 | 7 | 90.2 |

    | 86 | 791 | 6 | 81.1 |

    | 88 | 705 | 5 | 83 |

    | 92.8 | 1089 | 3 | 90.9 |

    | 95.2 | 1135 | 6 | 119 |

    | 93.3 | 1076 | 4 | 94.9 |

    | 97.7 | 1198 | 7 | 132.4 |


    There are three independent variables in Table 2-2: temperature, tourists, and
    sunny days. When there is more than one independent variable, the linear regression
    is specifically called multiple linear regression. Let’s denote temperature as
    `x1`, tourists as `x2`, sunny days as `x3`, the y-intercept as `b`, and the sales
    as `y`. Our multiple linear regression equation is `y = m1 * x1 + m2 * x2 + m3
    * x3 + b`. For such multiple linear regression, we need to make use of `LINEST`
    function to obtain the coefficients `m[i]` and `b`. Follow these instructions
    to practice multiple linear regression through Excel:


    ![Figure 2-8](images/494428_2_En_2_Chapter/494428_2_En_2_Fig8_HTML.jpg)


    **Figure 2-8** Set up the table to find coefficients and y-intercept


    1. Enter the data of Table 2-2 into cells `A1:D9` in a new Excel worksheet, or
    open the file `Chapter2-2a.xlsx`.


    The model construction process is to find the optimal values of `m1`, `m2`, `m3`,
    and `b`. We are going to make use of the array function `LINEST`. Be advised that
    `LINEST` returns an array of values. The returned values are in the order of `mn`,
    `mn-1`, …, `m1`, and `b`, the reversed order to the way in which the formula is
    expressed. This necessitates the use of the `INDEX` function to fetch individual
    values from the returned array. The `INDEX` function is designed to work with
    a matrix or table. It requires a row index and a column index to locate an element
    in a table. As `LINEST` returns an array which has only one row, the row index
    is always 1, while the column indexes are 1, 2, 3, and 4, respectively.


    2. Enter the texts “Sunny Days”, “Tourists”, “Temperature”, and “Y-intercept”
    in cells `A11:A14`.


    3. Enter numbers 1, 2, 3, and 4 in cells `B11:B14`. Our worksheet looks like Figure
    2-8. I will explain why we need to enter these numbers soon.


    ![Figure 2-9](images/494428_2_En_2_Chapter/494428_2_En_2_Fig9_HTML.jpg)


    **Figure 2-9** Using INDEX and LINEST functions to obtain coefficients


    4. Enter the following formula in cell `C11` and hit Enter:


    ```

    =INDEX(LINEST(D$2:D$9,A$2:C$9,TRUE,TRUE),1,B11)

    ```


    In this formula, the first input argument in the function `LINEST` is `D2:D9`,
    the dependent variable values. The second input argument is `A2:C9` which contains
    values for `x1`, `x2`, and `x3`. The returned array from `LINEST` is fed to the
    function `INDEX` as an input. Since `B11 = 1`, the function `INDEX` fetches the
    first element in the returned array, which is `m3`. Note again, `LINEST` returns
    an array that arranges the coefficients in the order of `mn`, `mn-1`, `mn-2`,
    …, `m1`, `b`. In this specific example, the data in the returned array are `m3`,
    `m2`, `m1`, and `b` for independent variables Sunny Days, Tourists, Temperature,
    and Y-intercept.


    Refer to Figure 2-9.


    ![Figure 2-10](images/494428_2_En_2_Chapter/494428_2_En_2_Fig10_HTML.jpg)


    **Figure 2-10** A model of multiple linear regression


    5. Autofill from cell `C11` to cell `C14`. Pay attention to the use of `B11`,
    `B12`, `B13`, and `B14`.


    When we autofill from cell `C11` to `C14`, the preceding formula automatically
    becomes `=INDEX(LINEST(D$2:D$9,A$2:C$9,TRUE,TRUE),1,B12)` in cell `C12`. Because
    `B12 = 2`, the formula in `C12` correctly fetches the coefficient for Tourists
    (`m2`). The same logic applies to the formulas in `C13` and `C14`. By pre-entering
    numbers in cells `B11:B14`, once we have the initial formula entered correctly,
    we can then obtain all needed values by autofill.


    This is a common technique. We certainly do not want to enter the formula multiple
    times. Note, the function `LINEST` is repeatedly called for every coefficient.


    6. Our last step is to examine how well the new model is. Enter the text “Predicted”
    in cell `E1`.


    7. Enter the following formula in cell `E2` and then autofill to cell `E9`:


    ```

    =A2*C$13+B2*C$12+C2*C$11+C$14

    ```


    As mentioned before, the parameter set, that is, the coefficients and the Y-intercept,
    represent the linear regression model. We want to examine how good the model is;
    therefore, we need to generate the predicted sales in column E.


    8. To examine the quality of the preceding linear regression model, we can further
    compute the errors based on Equation (2-1). Enter the text “Error” in cell `F1`,
    and the formula `=POWER(D2-E2,2)` in cell `F2`, then autofill from cell `F2` to
    `F9`.


    9. Enter the text “Sum of Errors” in cell `D11` and the formula `=SUM(F2:F9)`
    in cell `E11`. Our worksheet looks like Figure 2-10.


    Recall that the coefficients obtained through the function `LINEST` guarantee
    that the error value in cell `E11` is minimized. You can manually modify the coefficients
    to examine if you can obtain a smaller error value. I will leave this as an exercise
    for you to practice.


    The coefficient for the independent variable “Tourists” is negative. This simply
    means when there are more tourists, the ice cream sales will be smaller. However,
    in this specific example, this coefficient is close to zero, indicating that the
    number of tourists does not have much impact on the ice cream sales.


    The complete work can be found in the file `Chapter2-2b.xlsx`.


    ## Reinforcement Exercises


    Practice is the key to success. It is a good idea to open `Chapter2-HW.xlsx` to
    practice linear regression by yourself. `Chapter2-HW-withAnswers.xlsx` provides
    one way of solutions to reference.


    ## Review Points


    We have reached the end of Chapter 2. For this chapter, please review the following
    concepts and Excel skills:


    1. Linear regression model

    2. Least square method

    3. Multiple linear regression

    4. Functions `SUM`, `COUNT`, `SLOPE`, `INTERCEPT`, `LINEST`, `SUMPRODUCT`, `INDEX`,
    and `POWER`


    # K-Means Clustering


    Please download the sample Excel files from [`https://github.com/hhohho/Learn-Data-Mining-through-Excel-2`](https://github.com/hhohho/Learn-Data-Mining-through-Excel-2).
    Double-click `Chapter3-1a.xlsx` to open it.'
  raw: "## Learn Multiple Linear Regression Through Excel\n\nTommy has successfully\
    \ predicted his ice cream sales, but he wants to improve his prediction even more.\
    \ After some studies, he collected additional information such as the number of\
    \ tourists (obtained from hotels) and the number of sunny days in a week. His\
    \ updated training dataset is presented in Table [2-2](#494428_2_En_2_Chapter.xhtml#Tab2).\n\
    \nTable 2-2\n\nIce cream sale vs. temperature, tourists, and sunny days\n\n| Temperature\
    \ (F) | Tourists | Sunny Days | Ice Cream Sale (dollar in thousand) |\n| --- |\
    \ --- | --- | --- |\n| 91 | 998 | 4 | 89.8 |\n| 87 | 1256 | 7 | 90.2 |\n| 86 |\
    \ 791 | 6 | 81.1 |\n| 88 | 705 | 5 | 83 |\n| 92.8 | 1089 | 3 | 90.9 |\n| 95.2\
    \ | 1135 | 6 | 119 |\n| 93.3 | 1076 | 4 | 94.9 |\n| 97.7 | 1198 | 7 | 132.4 |\n\
    \nThere are three independent variables in Table [2-2](#494428_2_En_2_Chapter.xhtml#Tab2):\
    \ temperature, tourists, and sunny days. When there is more than one independent\
    \ variable, the linear regression is specifically called multiple linear regression.\
    \ Let’s denote temperature as `x`[`1`], tourists as `x`[`2`], sunny days as `x`[`3`],\
    \ the y-intercept as `b`, and the sales as `y`. Our multiple linear regression\
    \ equation is `y = m`[`1`]`x`[`1`] `+ m`[`2`]`x`[`2`] `+ m`[`3`]`x`[`3`] `+ b`.\
    \ For such multiple linear regression, we need to make use of LINEST function\
    \ to obtain the coefficients m[i] and b. Follow these instructions to practice\
    \ multiple linear regression through Excel:\n\n![](images/494428_2_En_2_Chapter/494428_2_En_2_Fig8_HTML.jpg)\n\
    \nA table consists of 4 columns and 8 rows. The column consists of temperature\
    \ in column A, tourists in column B, sunny days in column C, and ice cream sales\
    \ in column D. The texts sunny days 1, tourists 2, temperature 3, and Y-intercept\
    \ 4 are placed below the table.\n\nFigure 2-8\n\nSet up the table to find coefficients\
    \ and y-intercept\n\n1.  Enter the data of Table [2-2](#494428_2_En_2_Chapter.xhtml#Tab2)\
    \ into cells A1:D9 in a new Excel worksheet, or open the file Chapter2-2a.xlsx.\n\
    \nThe model construction process is to find the optimal values of `m`[`1`], `m`[`2`],\
    \ `m`[`3`], and `b`. We are going to make use of the array function LINEST. Be\
    \ advised that LINEST returns an array of values. The returned values are in the\
    \ order of `m`[`n`], `m`[`n-1`], …, `m`[`1`], and `b`, the reversed order to the\
    \ way in which the formula is expressed. This necessitates the use of the INDEX\
    \ function to fetch individual values from the returned array. The INDEX function\
    \ is designed to work with a matrix or table. It requires a row index and a column\
    \ index to locate an element in a table. As LINEST returns an array which has\
    \ only one row, the row index is always 1, while the column indexes are 1, 2,\
    \ 3, and 4, respectively.\n\n2.  Enter the texts “Sunny Days”, “Tourists”, “Temperature”,\
    \ and “Y-intercept” in cells A11:A14.\n\n3.  Enter numbers 1, 2, 3, and 4 in cells\
    \ B11:B14\\. Our worksheet looks like Figure [2-8](#494428_2_En_2_Chapter.xhtml#Fig8).\
    \ I will explain why we need to enter these numbers soon.\n\n![](images/494428_2_En_2_Chapter/494428_2_En_2_Fig9_HTML.jpg)\n\
    \nA table consists of 4 columns and 8 rows. The column consists of temperature\
    \ in column A, tourists in column B, sunny days in column C, and ice cream sales\
    \ in column D. The texts sunny days 1 with index formula, tourists 2, temperature\
    \ 3, and Y-intercept 4 are placed below the table.\n\nFigure 2-9\n\nUsing INDEX\
    \ and LINEST functions to obtain coefficients\n\n1.  Enter the following formula\
    \ in cell C11 and hit Enter:\n\n```\n    =INDEX(LINEST(D$2:D$9,A$2:C$9,TRUE,TRUE),1,B11)\n\
    \    ```\n\nIn this formula, the first input argument in the function LINEST is\
    \ D2:D9, the dependent variable values. The second input argument is A2:C9 which\
    \ contains values for `x`[`1`], `x`[`2`], and `x`[`3`]. The returned array from\
    \ LINEST is fed to the function INDEX as an input. Since B11 = 1, the function\
    \ INDEX fetches the first element in the returned array, which is `m`[`3`]. Note\
    \ again, LINEST returns an array that arranges the coefficients in the order of\
    \ m[n], m[n-1], m[n-2], …, m[1], b. In this specific example, the data in the\
    \ returned array are m[3], m[2], m[1], and b for independent variables Sunny Days,\
    \ Tourists, Temperature, and Y-intercept.\n\nRefer to Figure [2-9](#494428_2_En_2_Chapter.xhtml#Fig9).\n\
    \n![](images/494428_2_En_2_Chapter/494428_2_En_2_Fig10_HTML.jpg)\n\nA table consists\
    \ of 6 columns and 8 rows. The column consists of temperature, tourists, sunny\
    \ days, ice cream sales, predicted, and error. The texts sunny days 1, tourists\
    \ 2, temperature 3, Y-intercept 4, and sum of errors alongside respective values\
    \ are placed below the table.\n\nFigure 2-10\n\nA model of multiple linear regression\n\
    \n1.  Autofill from cell C11 to cell C14\\. Pay attention to the use of B11, B12,\
    \ B13, and B14.\n\nWhen we autofill from cell C11 to C14, the preceding formula\
    \ automatically becomes `=INDEX(LINEST(D$2:D$9,A$2:C$9,TRUE,TRUE),1,B12)` in cell\
    \ C12\\. Because B12 = 2, the formula in C12 correctly fetches the coefficient\
    \ for Tourists (`m`[`2`]). The same logic applies to the formulas in C13 and C14\\\
    . By pre-entering numbers in cells B11:B14, once we have the initial formula entered\
    \ correctly, we can then obtain all needed values by autofill.\n\nThis is a common\
    \ technique. We certainly do not want to enter the formula multiple times. Note,\
    \ the function LINEST is repeatedly called for every coefficient.\n\n2.  Our last\
    \ step is to examine how well the new model is. Enter the text “Predicted” in\
    \ cell E1.\n\n3.  Enter the following formula in cell E2 and then autofill to\
    \ cell E9:\n\n```\n    =A2*C$13+B2*C$12+C2*C$11+C$14\n    ```\n\nAs mentioned\
    \ before, the parameter set, that is, the coefficients and the Y-intercept, represent\
    \ the linear regression model. We want to examine how good the model is; therefore,\
    \ we need to generate the predicted sales in column E.\n\n4.  To examine the quality\
    \ of the preceding linear regression model, we can further compute the errors\
    \ based on Equation ([2-1](#494428_2_En_2_Chapter.xhtml#Equ1)). Enter the text\
    \ “Error” in cell F1, and the formula `=POWER(D2-E2,2)` in cell F2, then autofill\
    \ from cell F2 to F9.\n\n5.  Enter the text “Sum of Errors” in cell D11 and the\
    \ formula `=SUM(F2:F9)` in cell E11\\. Our worksheet looks like Figure [2-10](#494428_2_En_2_Chapter.xhtml#Fig10).\n\
    \nRecall that the coefficients obtained through the function LINEST guarantee\
    \ that the error value in cell E11 is minimized. You can manually modify the coefficients\
    \ to examine if you can obtain a smaller error value. I will leave this as an\
    \ exercise for you to practice.\n\nThe coefficient for the independent variable\
    \ “Tourists” is negative. This simply means when there are more tourists, the\
    \ ice cream sales will be smaller. However, in this specific example, this coefficient\
    \ is close to zero, indicating that the number of tourists does not have much\
    \ impact on the ice cream sales.\n\nThe complete work can be found in the file\
    \ Chapter2-2b.xlsx.\n\n## Reinforcement Exercises\n\nPractice is the key to success.\
    \ It is a good idea to open Chapter2-HW.xlsx to practice linear regression by\
    \ yourself. Chapter2-HW-withAnswers.xlsx provides one way of solutions to reference.\n\
    \n## Review Points\n\nWe have reached the end of Chapter [2](#494428_2_En_2_Chapter.xhtml).\
    \ For this chapter, please review the following concepts and Excel skills:\n\n\
    1.  Linear regression model\n\n2.  Least square method\n\n3.  Multiple linear\
    \ regression\n\n4.  Functions SUM, COUNT, SLOPE, INTERCEPT, LINEST, SUMPRODUCT,\
    \ INDEX, and POWER\n\n# 3. K-Means Clustering\n\nPlease download the sample Excel\
    \ files from [`https://github.com/hhohho/Learn-Data-Mining-through-Excel-2`](https://github.com/hhohho/Learn-Data-Mining-through-Excel-2).\
    \ Double-click Chapter3-1a.xlsx to open it."
  trans: "\n## 通过 Excel 学习多元线性回归\n\nTommy 成功预测了他的冰淇淋销量，但他希望进一步提高预测的准确性。经过一番研究，他收集了更多信息，例如游客数量（从酒店获取）和一周内的晴天数。他更新后的训练数据集如表\
    \ 2-2 所示。\n\n表 2-2\n\n冰淇淋销量 vs. 温度、游客数和晴天数\n\n| 温度 (华氏度) | 游客数 | 晴天数 | 冰淇淋销量 (千美元)\
    \ |\n| --- | --- | --- | --- |\n| 91 | 998 | 4 | 89.8 |\n| 87 | 1256 | 7 | 90.2\
    \ |\n| 86 | 791 | 6 | 81.1 |\n| 88 | 705 | 5 | 83 |\n| 92.8 | 1089 | 3 | 90.9\
    \ |\n| 95.2 | 1135 | 6 | 119 |\n| 93.3 | 1076 | 4 | 94.9 |\n| 97.7 | 1198 | 7\
    \ | 132.4 |\n\n表 2-2 中有三个自变量：温度、游客数和晴天数。当存在多个自变量时，线性回归特称为多元线性回归。我们将温度记为 `x`[`1`]，游客数记为\
    \ `x`[`2`]，晴天数记为 `x`[`3`]，y 轴截距记为 `b`，销量记为 `y`。我们的多元线性回归方程为 `y = m`[`1`]`x`[`1`]\
    \ `+ m`[`2`]`x`[`2`] `+ m`[`3`]`x`[`3`] `+ b`。对于这种多元线性回归，我们需要使用 `LINEST` 函数来获取系数\
    \ m[i] 和 b。请按照以下说明通过 Excel 练习多元线性回归：\n\n![](img/494428_2_En_2_Fig8_HTML.jpg)\n\
    \n一个包含 4 列 8 行的表格。列 A 为温度，列 B 为游客数，列 C 为晴天数，列 D 为冰淇淋销量。表格下方依次放置了文本“晴天数 1”、“游客数\
    \ 2”、“温度 3”和“Y 轴截距 4”。\n\n图 2-8\n\n设置表格以查找系数和 y 轴截距\n\n1.  将表 2-2 的数据输入到新 Excel\
    \ 工作表的单元格 A1:D9 中，或者打开文件 Chapter2-2a.xlsx。\n\n模型构建过程就是找到 `m`[`1`]、`m`[`2`]、`m`[`3`]\
    \ 和 `b` 的最优值。我们将使用数组函数 `LINEST`。请注意，`LINEST` 返回一个数组值。返回值的顺序是 `m`[`n`]、`m`[`n-1`]、…、`m`[`1`]\
    \ 和 `b`，这与公式表达的顺序相反。因此，需要使用 `INDEX` 函数从返回的数组中提取单个值。`INDEX` 函数设计用于处理矩阵或表格。它需要行索引和列索引来定位表格中的元素。由于\
    \ `LINEST` 返回的数组只有一行，因此行索引始终为 1，而列索引分别为 1、2、3 和 4。\n\n2.  在单元格 A11:A14 中输入文本“晴天数”、“游客数”、“温度”和“Y\
    \ 轴截距”。\n\n3.  在单元格 B11:B14 中输入数字 1、2、3 和 4。此时工作表应如图 2-8 所示。稍后我将解释为什么需要输入这些数字。\n\
    \n![](img/494428_2_En_2_Fig9_HTML.jpg)\n\n一个包含 4 列 8 行的表格。列 A 为温度，列 B 为游客数，列 C\
    \ 为晴天数，列 D 为冰淇淋销量。表格下方依次放置了文本“晴天数 1（含 INDEX 公式）”、“游客数 2”、“温度 3”和“Y 轴截距 4”。\n\n\
    图 2-9\n\n使用 INDEX 和 LINEST 函数获取系数\n\n1.  在单元格 C11 中输入以下公式并按 Enter 键：\n\n```\n\
    \    =INDEX(LINEST(D$2:D$9,A$2:C$9,TRUE,TRUE),1,B11)\n    ```\n\n在此公式中，`LINEST`\
    \ 函数的第一个输入参数是 D2:D9，即因变量值。第二个输入参数是 A2:C9，其中包含 `x`[`1`]、`x`[`2`] 和 `x`[`3`] 的值。`LINEST`\
    \ 返回的数组作为输入传递给 `INDEX` 函数。由于 B11 = 1，`INDEX` 函数提取返回数组中的第一个元素，即 `m`[`3`]。再次注意，`LINEST`\
    \ 返回的数组按 m[n]、m[n-1]、m[n-2]、…、m[1]、b 的顺序排列系数。在此特定示例中，返回数组中的数据分别是自变量“晴天数”、“游客数”、“温度”和“Y\
    \ 轴截距”对应的 m[3]、m[2]、m[1] 和 b。\n\n请参考图 2-9。\n\n![](img/494428_2_En_2_Fig10_HTML.jpg)\n\
    \n一个包含 6 列 8 行的表格。列分别为温度、游客数、晴天数、冰淇淋销量、预测值和误差。表格下方依次放置了文本“晴天数 1”、“游客数 2”、“温度 3”、“Y\
    \ 轴截距 4”以及“误差总和”及其对应值。\n\n图 2-10\n\n多元线性回归模型\n\n1.  从单元格 C11 自动填充到单元格 C14。注意 B11、B12、B13\
    \ 和 B14 的使用。\n\n当我们从 C11 自动填充到 C14 时，单元格 C12 中的公式会自动变为 `=INDEX(LINEST(D$2:D$9,A$2:C$9,TRUE,TRUE),1,B12)`。因为\
    \ B12 = 2，所以 C12 中的公式正确地提取了游客数的系数 (`m`[`2`])。同样的逻辑适用于 C13 和 C14 中的公式。通过预先在单元格\
    \ B11:B14 中输入数字，一旦我们正确输入了初始公式，就可以通过自动填充获得所有需要的值。\n\n这是一种常用技巧。我们当然不希望多次输入公式。请注意，`LINEST`\
    \ 函数会为每个系数重复调用。\n\n2.  最后一步是检查新模型的效果。在单元格 E1 中输入文本“预测值”。\n\n3.  在单元格 E2 中输入以下公式，然后自动填充到单元格\
    \ E9：\n\n```\n    =A2*C$13+B2*C$12+C2*C$11+C$14\n    ```\n\n如前所述，参数集（即系数和 Y 轴截距）代表了线性回归模型。我们想要检查模型的好坏，因此需要在\
    \ E 列生成预测销量。\n\n4.  为了检查上述线性回归模型的质量，我们可以进一步根据公式 (2-1) 计算误差。在单元格 F1 中输入文本“误差”，在单元格\
    \ F2 中输入公式 `=POWER(D2-E2,2)`，然后从 F2 自动填充到 F9。\n\n5.  在单元格 D11 中输入文本“误差总和”，在单元格\
    \ E11 中输入公式 `=SUM(F2:F9)`。此时工作表应如图 2-10 所示。\n\n回顾一下，通过 `LINEST` 函数获得的系数保证了单元格\
    \ E11 中的误差值最小化。您可以手动修改系数，看看是否能得到更小的误差值。我将此作为练习留给您实践。\n\n自变量“游客数”的系数为负。这仅仅意味着当游客数量增多时，冰淇淋销量会减少。然而，在这个特定示例中，该系数接近于零，表明游客数量对冰淇淋销量影响不大。\n\
    \n完整的工作可在文件 Chapter2-2b.xlsx 中找到。\n\n## 强化练习\n\n实践是成功的关键。建议您打开 Chapter2-HW.xlsx\
    \ 自行练习线性回归。Chapter2-HW-withAnswers.xlsx 提供了一种参考答案。\n\n## 复习要点\n\n我们已到达第 2 章的末尾。对于本章，请复习以下概念和\
    \ Excel 技能：\n\n1.  线性回归模型\n\n2.  最小二乘法\n\n3.  多元线性回归\n\n4.  函数 SUM、COUNT、SLOPE、INTERCEPT、LINEST、SUMPRODUCT、INDEX\
    \ 和 POWER\n\n# 3. K-Means 聚类\n\n请从 [`https://github.com/hhohho/Learn-Data-Mining-through-Excel-2`](https://github.com/hhohho/Learn-Data-Mining-through-Excel-2)\
    \ 下载示例 Excel 文件。双击 Chapter3-1a.xlsx 将其打开。\n"
- fmt: '# General Understanding


    Unlike linear regression which is a predictive method, clustering is a classification
    method that categorizes subjects (data points) into different groups (clusters),
    each with a number of characteristic measurements. For example, a bank may want
    to categorize customers into different risk groups when considering lending loans
    to its customers. Such a categorizing process relies on the selected characteristics
    and the algorithm adopted. Pay attention to the terminologies: subject, data point,
    group, cluster, class, etc. In a table, a row is called a record. Since a record
    can be composed of multiple numerical values, it can also be called a data point.
    In addition, a record can contain characteristics that are used to describe somebody,
    so in some cases a record is also called a subject. In this book, data point,
    record, and subject all have the same meaning. Similarly, the three terms group,
    cluster, and class have the same meaning, too.


    Clustering is an unsupervised data mining method. It does not require a training
    dataset. The two most popular types of clustering methods are partitioning clustering
    and hierarchical clustering. K-means clustering, where `k` represents the desired
    number of clusters, is a type of partitioning clustering. In k-means clustering,
    each cluster is defined by the centroid (or mean) of the data points in the cluster.
    For example, suppose a cluster has three data points expressed as three vectors:
    `(1, 2, 3, 4, 5)`, `(2, 3, 4, 5, 6)`, and `(5, 4, 3, 2, 1)`. The centroid of this
    cluster is then `((1+2+5)/3, (2+3+4)/3, (3+4+3)/3, (4+5+2)/3, (5+6+1)/3)`, that
    is, `(2.7, 3, 3.3, 3.7, 4)`. Note that the k-means clustering method requires
    all data to be numerical.


    To start the k-means clustering process, the first task is to decide how many
    clusters are needed, that is, the value of `k`. We may need to try multiple `k`
    values to examine which `k` value serves our purpose the best. The second task
    is to select `k` data points as the initial centroids. We can randomly select
    the `k` centroids, or we can pick them based on the data distribution. The distances
    from each data point to every centroid are computed, and a data point is pushed
    into a cluster that is the closest to it than all other clusters are. Once every
    data point has been pushed into a cluster, the centroid of the points in a cluster
    is recomputed. The distances of each data point to every new centroid are recomputed,
    too, followed by categorizing points into clusters based on the shortest distance
    rule again. Such a process is repeated until all data points are assigned into
    the same clusters in two consecutive iterations, at which point the cluster centroids
    have stabilized and will remain the same thereafter. The process can also be stopped
    when the predefined maximum number of iterations has been reached.


    There are different methods to compute the distances between any two data points,
    though Euclidean distance is commonly used. Given two data points `(x1, x2, x3,
    x4)` and `(y1, y2, y3, y4)`, their Euclidean distance is computed as


    ![$$ \sqrt{{\left(x1-y1\right)}^2+{\left(x2-y2\right)}^2+{\left(x3-y3\right)}^2+{\left(x4-y4\right)}^2}
    $$](images/494428_2_En_3_Chapter/494428_2_En_3_Chapter_TeX_Equ1.png)


    (3-1)


    # Learn K-Means Clustering Through Excel


    Suppose there are 50 countries that we want to categorize into four clusters based
    on four attributes: murder rate, assault rate, urban population, and rape rate.
    All the data are stored in the Excel file `Chapter3-1a.xlsx`. Let’s open this
    Excel file which has only one worksheet named `1`. Yes, this worksheet is named
    “1”. Column A stores the unique codes for each country. The data look like Figure
    [3-1](#494428_2_En_3_Chapter.xhtml#Fig1).


    ![](images/494428_2_En_3_Chapter/494428_2_En_3_Fig1_HTML.jpg)


    A table represents data of 50 countries K-means clustering. A table consists of
    12 columns and 16 rows. The column headers are country, murder, assault, Urban
    pop, and rape.


    **Figure 3-1** Data about 50 countries


    Let’s select cells `G1:K1` and then click “Merge & Center”. Cells `G1` to `K1`
    are merged into one cell. Enter “Mean” in this merged cell (its reference is `G1`).
    Enter other data inside cells `G2:K6` as shown in Figure [3-2](#494428_2_En_3_Chapter.xhtml#Fig2).
    Note that `C1`, `C2`, `C3`, and `C4` are all uppercased. Be advised that there
    is another file named `Chapter3-1a-preEntered.xlsx` in which data in `G1:K6` are
    pre-entered. You are welcome to start with `Chapter3-1a-preEntered.xlsx`.


    ![](images/494428_2_En_3_Chapter/494428_2_En_3_Fig2_HTML.jpg)


    A table represents data in G 1 K 6 with K-means clustering. A table consists of
    12 columns and 15 rows. The columns headers are murder, assault, Urban pop, rape,
    and mean with 5 sub-columns are cluster, C 1, C 2, C 3, and C 4.


    **Figure 3-2** Set up data in G1:K6


    `C1`, `C2`, `C3`, and `C4` represent cluster 1, cluster 2, cluster 3, and cluster
    4, respectively. The numbers in cells `H3:K6` are selected after a quick peek
    at the data ranges of each attribute. We can randomly pick some numbers for them,
    too. For this demonstration, let’s keep these numbers exactly. Numbers in cells
    `H3:H6`, `I3:I6`, `J3:J6`, and `K3:K6` stand for the centroids of `C1`, `C2`,
    `C3`, and `C4`, respectively.


    Select cells `M1:P1` and click “Merge & Center”. Cells `M1` to `P1` are merged
    into one cell in which we enter the text “Distances”. We are going to store the
    Euclidean distances from each data point to the four centroids in columns M, N,
    O, and P. The setup of cells `M1:Q2` is illustrated in Figure [3-3](#494428_2_En_3_Chapter.xhtml#Fig3).


    ![](images/494428_2_En_3_Chapter/494428_2_En_3_Fig3_HTML.jpg)


    A table represents data in M 1 Q 2 with K-means clustering. A table consists of
    11 columns and 6 rows. The column headers are mean with 6 sub-columns and distance
    with 5 sub-columns that are C 1, C 2, C 3, C 4, and cluster. The distance column
    with sub-columns is highlighted.


    **Figure 3-3** Setup of the cells M1:Q2


    Cell `M3` stores the distance from country L1 `(12, 193, 51, 21)` to centroid
    C1 `(2.3, 15, 9.9, 10)`. The formula in `M3` is based on Equation ([3-1](#494428_2_En_3_Chapter.xhtml#Equ1))
    and is presented as follows:


    ```

    =SQRT(SUMXMY2($B3:$E3, H$3:H$6))

    ```


    This formula computes the Euclidean distance between L1 and C1. Pay close attention
    to the use of absolute references in the formula. The use of absolute references
    here is for easy autofill. Function `SQRT` computes the square root of a value,
    and function `SUMXMY2` computes the sum of squares of differences of corresponding
    values in two arrays (in this case, the two arrays are `B3:E3` for L1 and `H3:H6`
    for C1).


    Continue the process by following these instructions:


