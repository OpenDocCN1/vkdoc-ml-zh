    Entropy of Play is computed


    It’s time to set up proper tables for the four attributes. The trick is once the
    first formula is defined correctly, how to allow a vertical autofill to work on
    different attributes that are arranged in separate columns (see Figure [10-2](#494428_2_En_10_Chapter.xhtml#Fig2)).
    This may sound challenging, but the function INDEX can help out.


    The function INDEX requires an array (it is a table indeed) as the first input
    parameter. If the second parameter (row) is 0, the function returns a column specified
    by the column number in the array. In the dataset, Temperature, Humidity, Windy,
    and Outlook are columns 1, 2, 3, and 4\. The expression `INDEX($A$2:$E$15,0,1)`
    fetches the Temperature column, while `INDEX($A$2:$E$15,0,4)` fetches the Outlook
    column.


    Follow these instructions to set up the helping tables for the four attributes:


    11.  Enter 1, 1, 1, 2, 2, 3, 3, 4, 4, 4 into cells A22:A31, respectively.


    12.  Enter “yes”, “no”, “p*log(p)-yes”, “p*log(p)-no”, “weighted”, “entropy”,
    and “info gain” in cells D21:J21, respectively. Column “weighted” stores the weighted
