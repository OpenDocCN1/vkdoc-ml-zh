    # 4. 线性判别分析


    请从 [`https://github.com/hhohho/Learn-Data-Mining-through-Excel-2`](https://github.com/hhohho/Learn-Data-Mining-through-Excel-2)
    下载本章练习所需的示例 Excel 文件。


    ## 总体理解


    线性判别分析（LDA）与线性回归和 `k-means` 聚类既有相似之处，又有所不同。`K-means` 聚类是一种无监督分类方法；而 LDA 是有监督的，因为其分类是基于已知数据进行训练的。线性回归的预测结果是定量数值型的，而
    LDA 的预测结果是定性类别型的。


    LDA 试图找到最佳的线性函数，将数据点划分为不同的类别或组。组间均值之间的方差应尽可能大，而每组内部的方差应尽可能小。请注意，方差是在每个数据点投影到线性函数
    `P = w[1]x[1] + w[2]x[2] + ... + w[n]x[n] + b` 之后计算的。训练数据集用于找到最佳的 `P` 函数，该函数由参数集
    (`w[1]`, `w[2]`, ..., `w[n]`, `b`) 表示。图 [4-1](#494428_2_En_4_Chapter.xhtml#Fig1)
    展示了二维空间中的概念。


    ![](images/494428_2_En_4_Chapter/494428_2_En_4_Fig1_HTML.png)


    图 4-1 展示了 LDA 如何分离组别，其中线 `P` 为最佳投影轴，线 `A` 为较差的投影轴。


    给定一组已按不同组别分类的训练数据点集 `S`，应用 LDA 的三个步骤可简化为：


    步骤 1：通过以下表达式计算组间方差之和：


    ![$$ Sg=\kern0.5em \sum \limits_i^k{s}_g=\sum \limits_{i=1}^k{\left({\overline{x}}_i-\overline{x}\right)}^2
    $$](images/494428_2_En_4_Chapter/494428_2_En_4_Chapter_TeX_Equ1.png)


    (4-1)


    其中 `k` 是组数，`x̄` 是各组均值的平均值，`x̄_i` 是单个组的均值。


    步骤 2：通过以下表达式计算组内方差之和：


    ![$$ {S}_w=\sum \limits_i^k\sum \limits_{\dot{j}}^n{\left({x}_{ij}-{\overline{x}}_i\right)}^2
    $$](images/494428_2_En_4_Chapter/494428_2_En_4_Chapter_TeX_Equ2.png)


    (4-2)


    其中 `n` 是某个组中的数据点数量。


    步骤 3：`P` 是最佳投影线性函数，使得 `Sg(P)/Sw(P)` 最大化。由于 `P` 由 (`w[1]`, `w[2]`, ..., `w[n]`,
    `b`) 定义，LDA 的模型构建阶段就是求解 (`w[1]`, `w[2]`, ..., `w[n]`, `b`)。这在公式 ([4-3](#494428_2_En_4_Chapter.xhtml#Equ3))
    中说明：


    ![$$ {\mathrm{w}}_1{\mathrm{x}}_1+{\mathrm{w}}_2{\mathrm{x}}_2+\dots +{\mathrm{w}}_{\mathrm{n}}{\mathrm{x}}_{\mathrm{n}}+\mathrm{b}=\max
    \left( Sg\left(\mathrm{P}\right)/ Sw\left(\mathrm{P}\right)\right) $$](images/494428_2_En_4_Chapter/494428_2_En_4_Chapter_TeX_Equ3.png)


    (4-3)


    可以首先应用最小二乘法来求解 (`w[1]`, `w[2]`, ..., `w[n]`, `b`)。然后，我们可以使用 Excel 规划求解（`Solver`）进一步优化
    (`w[1]`, `w[2]`, ..., `w[n]`, `b`)。'
