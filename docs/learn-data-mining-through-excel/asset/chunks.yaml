    \ revise our formulas again and again.\n\nTo answer this challenge, we need to\
    \ make use of the functions SHEET, INDIRECT, and ADDRESS and operator &.\n\nSHEET\
    \ is a very interesting function which returns the sheet number of the referenced\
    \ sheet. The leftmost worksheet in a workbook is numbered 1, the second leftmost\
    \ worksheet is numbered 2, and so on. The syntax of SHEET is SHEET(reference),\
    \ where the argument is usually a cell reference, for example, A1."
  trans: "\n![](img/494428_2_En_3_Fig5_HTML.jpg)\n\n一张表格展示了使用 K-means 聚类后的数据。该表格包含\
    \ 18 列和 18 行。列标题依次为国家、谋杀、袭击、城市人口、强奸、均值（含 5 个子列：聚类、C1、C2、C3、C4）以及距离（含 5 个子列：聚类、C1、C2、C3、C4）。\n\
    \n图 3-5\n\n工作表 1 中第一轮计算后的结果\n\n1.  Q 列中的数据根据最短距离规则，指明了每个数据点所属的聚类。在单元格 Q3 中，输入以下公式：\n\
    \n```\n    =INDEX($M$2:$P$2,1,MATCH(MIN(M3:P3),M3:P3,0))\n    ```\n\n函数 MATCH\
    \ 的语法为 MATCH(查找值, 查找数组, 匹配类型)。如果 match_type = 0，该函数会在查找数组中精确查找查找值。如果未找到，则返回#N/A\
    \ 错误（值不可用错误）。如果找到，则返回该值在数组中的相对位置。请注意，在 Microsoft Office 工具中，第一个位置始终为 1。\n\n在上述公式中，MATCH\
    \ 函数找到数组 M3:P3 中最小值（本例中为 4）的列相对位置。该列位置被传递给 INDEX 函数，以便在数组 M2:P2 中找到对应的聚类名称。此公式用于确定数据点\
    \ L1 所属的聚类。\n\n由于只有四个聚类，使用嵌套的 IF 语句也能达到与上述公式相同的目的。\n\n```\n    =IF(MIN(M3:P3)=M3,\"\
    C1\",IF(MIN(M3:P3)=N3,\"C2\", IF(MIN(M3:P3)=O3,\"C3\",\"C4\")))\n    ```\n\n在嵌套的\
    \ IF 公式中，如果最小值等于 M3，则返回“C1”；否则，如果最小值等于 N3，则返回“C2”；否则，如果最小值等于 O3，则返回“C3”；否则返回“C4”。\n\
    \n我们可以看出，当聚类数量过多时，使用 INDEX 和 MATCH 函数比嵌套 IF 语句是更好的编程方法。\n\n2.  将 Q3 自动填充至 Q52。至此，我们的数据如图\
    \ 3-5 所示。\n\n1.  现在我们需要开始第二轮聚类过程。复制工作表 1，并将新工作表重命名为工作表 2。是的，新工作表的名称就是数字 2！同时，确保工作表\
    \ 2 位于工作表 1 的右侧。它们的顺序非常重要。\n\n在工作表 2 中，我们需要在单元格 H3 中输入一个公式，以重新计算聚类 1 内所有数据点的“谋杀”属性均值。然而，所需数据位于工作表\
    \ 1 中。如下公式可以为我们完成此任务：\n\n```\n    =AVERAGEIFS('1'!$B$3:'1'!$B$52, '1'!$Q$3:'1'!$Q$52,H$2)\n\
    \    ```\n\n虽然此公式位于工作表 2 中，但所使用的数据均在工作表 1 中，'1'!通过其名称（确实是“1”）引用工作表 1。该公式利用函数 AVERAGEIFS\
    \ 计算聚类 1 内所有数据点的“谋杀”属性均值。请注意，只有聚类名称与单元格 H2（C1）匹配的数据点（且仅限 B 列）才会被计算平均值。\n\n然而，上述公式还不够完善！\n\
    \n首先，此公式计算的是平均值。在 k-means 聚类过程中，有可能某个聚类没有数据点。在这种情况下，分母将为零，从而导致除以零的错误。因此，我们需要利用\
    \ IFERROR 函数来防范这种情况。\n\n其次，也是最重要的原因是，当我们需要在另一个工作表 3 中开始新一轮聚类迭代时，我们必须转到工作表 3 的单元格\
    \ H3，将“1”改为“2”，因为工作表 3 必须使用工作表 2 中的数据。我们不想一次又一次地手动修改公式。\n\n为了解决这个难题，我们需要利用 SHEET、INDIRECT\
    \ 和 ADDRESS 函数以及运算符&。\n\nSHEET 是一个非常有趣的函数，它返回所引用工作表的编号。工作簿中最左侧的工作表编号为 1，左侧第二个工作表编号为\
    \ 2，依此类推。SHEET 的语法为 SHEET(引用)，其中参数通常是一个单元格引用，例如 A1。"
- fmt: '函数`INDIRECT`将文本作为单元格引用进行求值。函数`ADDRESS`将两个数字转换为单元格引用。函数`ADDRESS`需要行号和列号。在Excel中，A列是1，B列是2，依此类推。运算符`&`可以连接文本（字符串）。


    - 在工作表2的单元格F1中，输入公式`=SHEET(A1)-1`。你会注意到F1中的值是1，可用于引用工作表1。

    - 在单元格F3到F6中，分别输入数字2、3、4和5。这些数字有助于在水平自动填充公式时选择正确的列。同样，在Excel中，B列是第2列，C列是第3列，依此类推。这些数字可用于引用B、C、D和E列。


    工作表2的部分内容如图[3-6](#494428_2_En_3_Chapter.xhtml#Fig6)所示。


    ![](images/494428_2_En_3_Chapter/494428_2_En_3_Fig6_HTML.jpg)


    一个表格展示了K-means聚类数据。该表格包含11列和9行。列标题为谋杀、袭击、城市人口、强奸、均值，以及6个子列：聚类、C1、C2、C3和C4。表格高亮了均值列及其子列。


    **图3-6** 设置工作表2以实现公式自动更新


    在单元格H3中，输入以下公式：


    ```

    =IFERROR(AVERAGEIFS(INDIRECT($F$1 & "!" & ADDRESS(3,$F3,1)) : INDIRECT($F$1 &
    "!" & ADDRESS(52,$F3,1)),INDIRECT($F$1 & "!$Q$3"):INDIRECT($F$1 & "!$Q$52"),H$2),0)

    ```


    在此公式中：

    - `IFERROR`确保当出现错误时，平均值被设置为0。

    - `ADDRESS(3,$F3,1)` 给出 `$B$3`。

    - `INDIRECT($F$1 & "!" & ADDRESS(3,$F3,1))` ➔ `''1''!$B$3`。

    - `INDIRECT($F$1 & "!" & ADDRESS(52,$F3,1))` ➔ `''1''!$B$52`。

    - `INDIRECT($F$1 & "!" & ADDRESS(3,$F3,1)) : INDIRECT($F$1 & "!" & ADDRESS(52,$F3,1))`
    ➔ `''1''!$B$3:''1''!$B$52`。

    - `INDIRECT($F$1 & "!$Q$3"):INDIRECT($F$1 & "!$Q$52")` ➔ `''1''!$Q$3:''1''!$Q$52`。


    上述公式生成一个最终公式，等同于：


    ```

    =IFERROR(AVERAGEIFS(''1''!$B$3:''1''!$B$52, ''1''!$Q$3:''1''!$Q$52,H$2),0)

    ```


    上述公式的优点如下：

    - 我们可以从H3自动填充到K6。

    - 结合单元格F1中`SHEET`函数的使用，只要我们将工作表3放置在工作表2的紧右侧，就可以在工作表3中自动引用工作表2。


    2. 从单元格H3自动填充到单元格K6。我们的工作表可以与图[3-7](#494428_2_En_3_Chapter.xhtml#Fig7)进行比较。


    ![](images/494428_2_En_3_Chapter/494428_2_En_3_Fig7_HTML.jpg)


    一个表格表示质心。该表格包含6列和6行。列标题为1和均值，以及5个子列：聚类、C1、C2、C3和C4。


    **图3-7** 工作表2中的质心


    3. 到目前为止，每个数据点到四个新质心的距离已自动计算，同时还有它们所属的聚类。在单元格R1和R2中，分别输入数字1和2。选中这两个单元格并自动填充到单元格R52。单元格R1:R52现在包含数字1、2、3、…、52。


    4. 在单元格S2中，输入“旧聚类”。S列存储上一次迭代中所有数据点所属的聚类（这些数据在工作表1中）。


    5. 在单元格T2中，输入“差异”。T列记录当前迭代与上一次迭代之间的聚类切换情况。工作表的部分内容如图[3-8](#494428_2_En_3_Chapter.xhtml#Fig8)所示。


    ![](images/494428_2_En_3_Chapter/494428_2_En_3_Fig8_HTML.jpg)


    一个表格展示了K-means聚类数据。该表格包含8列和18行。列标题为距离，以及5个子列：聚类、C1、C2、C3和C4，旧聚类和差异。


    **图3-8** 准备与工作表1进行比较


    ![](images/494428_2_En_3_Chapter/494428_2_En_3_Fig9_HTML.jpg)


    一个表格展示了K-means聚类数据。该表格包含15列和18行。列标题为均值，以及5个子列：聚类、C1、C2、C3和C4，距离，以及5个子列：聚类、C1、C2、C3和C4，旧聚类和差异。


    **图3-9** 工作表2中第二轮之后


    1. 在单元格S3中，输入以下公式并自动填充到S52：


    ```

    =INDIRECT($F$1 & "!Q" & R3)

    ```


    此公式引用工作表1中单元格Q3的值。


    2. 在单元格T3中，输入以下公式并自动填充到T52：


    ```

    =IF(Q3=S3,0,1)

    ```


    上述公式定义：对于给定的数据点，如果其上一次所属聚类与当前所属聚类不同，则返回1；否则返回0。我们的目标是达到稳定状态，即S列只有0，所有数据点与上一次迭代时保持在同一个聚类中。


    3. 选中单元格G10和H10，合并它们，并在其中输入“收敛”。在单元格I10中，输入以下公式：


    ```

    =SUM(T3:T52)

    ```


    如前所述，我们希望单元格I10中的值为0。工作表2的部分内容应如图[3-9](#494428_2_En_3_Chapter.xhtml#Fig9)所示。


    ![](images/494428_2_En_3_Chapter/494428_2_En_3_Fig10_HTML.jpg)


    一个表格展示了K-means聚类数据。该表格包含15列和17行。列标题为均值，以及5个子列：聚类、C1、C2、C3和C4，距离，以及5个子列：聚类、C1、C2、C3和C4，旧聚类和差异。


    **图3-10** 工作表3中三轮后的K-means聚类


    1. 由于在第二次迭代中有四个数据点切换了聚类，我们需要继续聚类过程。复制工作表2，并将新工作表命名为3。确保工作表3紧邻工作表2的右侧。我们会注意到工作表3已自动完成，其部分内容如图[3-10](#494428_2_En_3_Chapter.xhtml#Fig10)所示。


    ![](images/494428_2_En_3_Chapter/494428_2_En_3_Fig11_HTML.jpg)


    一个表格展示了K-means聚类数据。该表格包含15列和17行。列标题为均值，以及5个子列：聚类、C1、C2、C3和C4，距离，以及5个子列：聚类、C1、C2、C3和C4，旧聚类和差异。


    **图3-11** 工作表4中四轮后的K-means聚类


    1. 重复上述聚类过程：将工作表3复制到工作表4；确保新工作表命名为4，并位于工作表3的右侧。工作表4的部分内容如图[3-11](#494428_2_En_3_Chapter.xhtml#Fig11)所示。


    ![](images/494428_2_En_3_Chapter/494428_2_En_3_Fig12_HTML.jpg)


    一个表格展示了K-means聚类数据。该表格包含15列和17行。列标题为均值，以及5个子列：聚类、C1、C2、C3和C4，距离，以及5个子列：聚类、C1、C2、C3和C4，旧聚类和差异。


    **图3-12** 工作表5中五轮后的K-means聚类


    1. 再次重复聚类过程：将工作表4复制到工作表5；确保新工作表命名为5，并位于工作表4的右侧。收敛值变为0，如图[3-12](#494428_2_En_3_Chapter.xhtml#Fig12)所示。


    ![](images/494428_2_En_3_Chapter/494428_2_En_3_Fig13_HTML.jpg)


    一个表格展示了K-means聚类数据。该表格包含10列和12行。列标题为谋杀、袭击、城市人口、强奸、5和均值，以及4个子列：聚类、C1、C2和C3。底部的6个工作表被高亮显示。


    **图3-13** 六个工作表必须按顺序放置


    1. 一旦收敛值达到0，无论我们继续多少次迭代，数据都不会再改变。然而，有必要通过创建另一个工作表6来重复上述过程以确认这一点。


    注意，按顺序排列这六个工作表非常重要；否则，你将无法得到正确的结果。请查看图[3-13](#494428_2_En_3_Chapter.xhtml#Fig13)。


    至此，所有数据点已成功聚类。'
  raw: "Function INDIRECT evaluates a text as a cell reference. Function ADDRESS converts\
    \ two numbers into a cell reference. Function ADDRESS requires a row number and\
    \ a column number. In Excel, column A is 1, B is 2, and so on. The operator &\
    \ can concatenate texts (strings) together.\n    *   In cell F1 of worksheet 2,\
    \ enter the formula `=SHEET(A1)-1`. You will notice that the value in F1 is 1\
    \ which can be used to reference worksheet 1.\n\n*   In cells F3 to F6, enter\
    \ numbers 2, 3, 4, and 5, respectively. These numbers can help to pick the right\
    \ column when we autofill our formula horizontally. Again, in Excel, column B\
    \ is column 2, column C is column 3, and so on. These numbers can be used to reference\
    \ columns B, C, D, and E.\n\nPart of our worksheet 2 looks like Figure [3-6](#494428_2_En_3_Chapter.xhtml#Fig6).\n\
    \n![](images/494428_2_En_3_Chapter/494428_2_En_3_Fig6_HTML.jpg)\n\nA table represents\
    \ data with K-means clustering. A table consists of 11 columns and 9 rows. The\
    \ column headers are murder, assault, urban-pop, rape, mean with 6 sub-columns\
    \ cluster, C 1, C 2, C 3 and C 4. The table highlights the mean column with its\
    \ sub-columns.\n\nFigure 3-6\n\nSet up worksheet 2 for formula automatic updates\n\
    \nIn cell H3, enter the following formula:\n\n```\n    =IFERROR(AVERAGEIFS(INDIRECT($F$1\
    \ & \"!\" & ADDRESS(3,$F3,1)) : INDIRECT($F$1 & \"!\" & ADDRESS(52,$F3,1)),INDIRECT($F$1\
    \ & \"!$Q$3\"):INDIRECT($F$1 & \"!$Q$52\"),H$2),0)\n    ```\n\nIn this formula\n\
    \    *   IFERROR makes sure when there is an error, the average is set to 0.\n\
    \n*   `ADDRESS(3,$F3,1)` gives `$B$3`.\n\n*   `INDIRECT($F$1 & \"!\" & ADDRESS(3,$F3,1))`\
    \ ➔ `'1'!$B$3`.\n\n*   `INDIRECT($F$1 & \"!\" & ADDRESS(52,$F3,1))` ➔ `'1'!$B$52`.\n\
    \n*   `INDIRECT($F$1 & \"!\" & ADDRESS(3,$F3,1)) : INDIRECT($F$1 & \"!\" & ADDRESS(52,$F3,1))`\
    \ ➔ `'1'!$B$3:'1'!$B$52`.\n\n*   `INDIRECT($F$1 & \"!$Q$3\"):INDIRECT($F$1 & \"\
    !$Q$52\")` ➔ `'1'!$Q$3:'1'!$Q$52`.\n\nThe preceding formula generates a final\
    \ formula which is the same as\n\n```\n    =IFERROR(AVERAGEIFS('1'!$B$3:'1'!$B$52,\
    \ '1'!$Q$3:'1'!$Q$52,H$2),0)\n    ```\n\nThe advantages of the preceding formula\
    \ are as follows:\n    *   We can autofill from H3 to K6.\n\n*   Together with\
    \ the use of the SHEET function in cell F1, we can automate the referencing to\
    \ worksheet 2 in worksheet 3 as long as we place worksheet 3 to the immediate\
    \ right of worksheet 2.\n\n2.  Autofill from cell H3 to cell K6\\. Our worksheet\
    \ can be compared to Figure [3-7](#494428_2_En_3_Chapter.xhtml#Fig7).\n\n![](images/494428_2_En_3_Chapter/494428_2_En_3_Fig7_HTML.jpg)\n\
    \nA table represents centroids. A table consists of 6 columns and 6 rows. The\
    \ column headers are 1 and the mean with 5 sub-columns are cluster, C 1, C 2,\
    \ C 3, and C 4.\n\nFigure 3-7\n\nThe centroids in worksheet 2\n\n3.  By now, the\
    \ distances of each data point to the four new centroids have been automatically\
    \ computed, together with their belonging clusters. In cells R1 and R2, enter\
    \ numbers 1 and 2, respectively. Select these two cells and autofill to cell R52\\\
    . Cells R1:R52 now have numbers 1, 2, 3, …, 52.\n\n4.  In cell S2, enter “Old\
    \ cluster”. Column S stores the belonging clusters of all the data points in the\
    \ previous iteration (such data are in worksheet 1).\n\n5.  In cell T2, enter\
    \ “difference”. Column T books the cluster switches between the current iteration\
    \ and the last iteration. Part of our worksheet looks like Figure [3-8](#494428_2_En_3_Chapter.xhtml#Fig8).\n\
    \n![](images/494428_2_En_3_Chapter/494428_2_En_3_Fig8_HTML.jpg)\n\nA table represents\
    \ data with K-means clustering. A table consists of 8 columns and 18 rows. The\
    \ column headers are distance with 5 sub-columns with cluster, C 1, C 2, C 3,\
    \ and C 4, old cluster, and difference.\n\nFigure 3-8\n\nReady to compare with\
    \ worksheet 1\n\n![](images/494428_2_En_3_Chapter/494428_2_En_3_Fig9_HTML.jpg)\n\
    \nA table represents data with K-means clustering. A table consists of 15 columns\
    \ and 18 rows. The column headers mean with 5 sub-columns cluster, C 1, C 2, C\
    \ 3 and C 4, distance with 5 sub-columns with cluster, C 1, C 2, C 3, and C 4,\
    \ old cluster, and difference.\n\nFigure 3-9\n\nAfter the second round in worksheet\
    \ 2\n\n1.  In cell S3, enter the following formula and autofill to S52:\n\n```\n\
    \    =INDIRECT($F$1 & \"!Q\" & R3)\n    ```\n\nThis formula references the value\
    \ in cell Q3 of worksheet 1.\n\n2.  In cell T3, enter the following formula and\
    \ autofill to T52:\n\n```\n    =IF(Q3=S3,0,1)\n    ```\n\nThe preceding formula\
    \ defines that for a given data point, if its last belonging cluster is different\
    \ from the current belonging cluster, 1 is returned; otherwise, 0 is returned.\
    \ Our goal is to reach a stable condition when column S has 0s only, that is,\
    \ all data points stay in the same cluster as they were in the last iteration.\n\
    \n3.  Select cells G10 and H10, merge them, and type “convergence” inside. In\
    \ cell I10, enter the following formula:\n\n```\n    =SUM(T3:T52)\n    ```\n\n\
    As mentioned earlier, we want to get 0 inside the cell I10\\. Part of our worksheet\
    \ 2 should look like Figure [3-9](#494428_2_En_3_Chapter.xhtml#Fig9).\n\n![](images/494428_2_En_3_Chapter/494428_2_En_3_Fig10_HTML.jpg)\n\
    \nA table represents data with K-means clustering. A table consists of 15 columns\
    \ and 17 rows. The column headers are mean with 5 sub-columns cluster, C 1, C\
    \ 2, C 3, and C 4, distance with 5 sub-columns with cluster, C 1, C 2, C 3, and\
    \ C 4, old cluster, and difference.\n\nFigure 3-10\n\nK-means clustering after\
    \ three rounds in worksheet 3\n\n1.  As there are four data points that have switched\
    \ clusters in the second iteration, we need continue the clustering process. Make\
    \ a copy of worksheet 2 and give the new worksheet the name 3\\. Make sure that\
    \ the worksheet 3 is immediately right to worksheet 2\\. We shall notice that\
    \ worksheet 3 is automatically done and part of it looks like Figure [3-10](#494428_2_En_3_Chapter.xhtml#Fig10).\n\
    \n![](images/494428_2_En_3_Chapter/494428_2_En_3_Fig11_HTML.jpg)\n\nA table represents\
    \ data with K-means clustering. A table consists of 15 columns and 17 rows. The\
    \ column headers are mean with 5 sub-columns cluster, C 1, C 2, C 3, and C 4,\
    \ distance with 5 sub-columns with cluster, C 1, C 2, C 3, and C 4, old cluster,\
    \ and difference.\n\nFigure 3-11\n\nK-means clustering after four rounds in worksheet\
    \ 4\n\n1.  Repeat the preceding clustering process: copy worksheet 3 to worksheet\
    \ 4; make sure that the new worksheet is named 4 and is right to worksheet 3\\\
    . Part of worksheet 4 looks like Figure [3-11](#494428_2_En_3_Chapter.xhtml#Fig11).\n\
    \n![](images/494428_2_En_3_Chapter/494428_2_En_3_Fig12_HTML.jpg)\n\nA table represents\
    \ data with K-means clustering. A table consists of 15 columns and 17 rows. The\
    \ column headers are mean with 5 sub-columns cluster, C 1, C 2, C 3, and C 4,\
    \ distance with 5 sub-columns with cluster, C 1, C 2, C 3, and C 4, old cluster,\
    \ and difference.\n\nFigure 3-12\n\nK-means clustering after five rounds in worksheet\
    \ 5\n\n1.  Repeat the clustering process again: copy worksheet 4 to worksheet\
    \ 5; make sure that the new worksheet is named 5 and is right to worksheet 4\\\
    . The convergence becomes 0 as shown in Figure [3-12](#494428_2_En_3_Chapter.xhtml#Fig12).\n\
    \n![](images/494428_2_En_3_Chapter/494428_2_En_3_Fig13_HTML.jpg)\n\nA table represents\
    \ data with K-means clustering. A table consists of 10 columns and 12 rows. The\
    \ column headers are murder, assault, urban pop, rape, 5, and mean with 4 sub-columns\
    \ cluster, C 1, C 2, and C 3, The 6 worksheets at the bottom are highlighted.\n\
    \nFigure 3-13\n\nThe six worksheets must be placed in order\n\n1.  Once the convergence\
