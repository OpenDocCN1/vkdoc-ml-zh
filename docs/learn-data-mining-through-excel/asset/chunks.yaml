  trans: '

    ## 总体理解


    与作为预测方法的线性回归不同，聚类是一种分类方法，它将主体（数据点）归入不同的组（簇），每个组都有一系列特征度量值。例如，银行在考虑向客户发放贷款时，可能希望将客户划分为不同的风险组。这种分类过程依赖于所选的特征和采用的算法。请注意以下术语：主体、数据点、组、簇、类别等。在表格中，一行被称为一条记录。由于一条记录可以由多个数值组成，因此它也可以被称为一个数据点。此外，一条记录可以包含用于描述某人的特征，因此在某些情况下，一条记录也被称为一个主体。在本书中，数据点、记录和主体含义相同。同样，组、簇和类别这三个术语也具有相同的含义。


    聚类是一种无监督的数据挖掘方法。它不需要训练数据集。两种最流行的聚类方法是划分聚类和层次聚类。K-means 聚类（其中 `k` 表示所需的簇数量）是划分聚类的一种类型。在
    K-means 聚类中，每个簇由其内部数据点的质心（或均值）定义。例如，假设一个簇有三个数据点，表示为三个向量：(1, 2, 3, 4, 5)、(2, 3,
    4, 5, 6) 和 (5, 4, 3, 2, 1)。那么该簇的质心为 ((1+2+5)/3, (2+3+4)/3, (3+4+3)/3, (4+5+2)/3,
    (5+6+1)/3)，即 (2.7, 3, 3.3, 3.7, 4)。请注意，K-means 聚类方法要求所有数据都是数值型的。


    要开始 K-means 聚类过程，首要任务是确定需要多少个簇，即 `k` 的值。我们可能需要尝试多个 `k` 值，以检查哪个 `k` 值最能满足我们的目的。第二个任务是选择
    `k` 个数据点作为初始质心。我们可以随机选择这 `k` 个质心，也可以根据数据分布来挑选。计算每个数据点到每个质心的距离，并将数据点归入距离其最近的那个簇（相较于其他所有簇）。一旦每个数据点都被归入某个簇，就重新计算该簇内各点的质心。同时，重新计算每个数据点到每个新质心的距离，然后再次根据最短距离规则将点划分到簇中。重复此过程，直到连续两次迭代中所有数据点都被分配到相同的簇，此时簇质心已稳定，并将保持不变。当达到预定义的最大迭代次数时，该过程也可以停止。


    计算任意两个数据点之间的距离有多种方法，但通常使用欧几里得距离。给定两个数据点 (x1, x2, x3, x4) 和 (y1, y2, y3, y4)，它们的欧几里得距离计算公式为


    ![$$ \sqrt{{\left(x1-y1\right)}²+{\left(x2-y2\right)}²+{\left(x3-y3\right)}²+{\left(x4-y4\right)}²}
    $$](img/494428_2_En_3_Chapter_TeX_Equ1.png)


    (3-1)


    ## 通过 Excel 学习 K-Means 聚类


    假设有 50 个国家，我们希望根据四个属性（谋杀率、袭击率、城市人口和强奸率）将它们分为四个簇。所有数据都存储在 Excel 文件 Chapter3-1a.xlsx
    中。让我们打开这个 Excel 文件，它只有一个名为“1”的工作表。是的，这个工作表的名字就是“1”。A 列存储每个国家的唯一代码。数据如图 3-1 所示。


    ![](img/494428_2_En_3_Fig1_HTML.jpg)


    一个表格展示了 50 个国家的 K-means 聚类数据。该表格包含 12 列和 16 行。列标题为国家、谋杀、袭击、城市人口和强奸。


    图 3-1


    关于 50 个国家的数据


    让我们选中单元格 G1:K1，然后点击“合并后居中”。单元格 G1 到 K1 被合并为一个单元格。在这个合并后的单元格（其引用为 G1）中输入“均值”。在单元格
    G2:K6 中输入其他数据，如图 3-2 所示。请注意，C1、C2、C3 和 C4 均为大写。提醒一下，还有另一个名为 Chapter3-1a-preEntered.xlsx
    的文件，其中 G1:K6 的数据已预先输入。欢迎您从 Chapter3-1a-preEntered.xlsx 开始操作。


    ![](img/494428_2_En_3_Fig2_HTML.jpg)


    一个表格展示了 G1 到 K6 中用于 K-means 聚类的数据。该表格包含 12 列和 15 行。列标题为谋杀、袭击、城市人口、强奸和均值，其中均值下有
    5 个子列：簇、C1、C2、C3 和 C4。


    图 3-2


    在 G1:K6 中设置数据


    C1、C2、C3 和 C4 分别代表簇 1、簇 2、簇 3 和簇 4。单元格 H3:K6 中的数字是在快速查看每个属性的数据范围后选定的。我们也可以为它们随机挑选一些数字。在本演示中，让我们保持这些数字完全不变。单元格
    H3:H6、I3:I6、J3:J6 和 K3:K6 中的数字分别代表 C1、C2、C3 和 C4 的质心。


    选中单元格 M1:P1，点击“合并后居中”。单元格 M1 到 P1 被合并为一个单元格，我们在其中输入文本“距离”。我们将把每个数据点到四个质心的欧几里得距离存储在
    M、N、O 和 P 列中。单元格 M1:Q2 的设置如图 3-3 所示。


    ![](img/494428_2_En_3_Fig3_HTML.jpg)


    一个表格展示了 M1 到 Q2 中用于 K-means 聚类的数据。该表格包含 11 列和 6 行。列标题为均值（下有 6 个子列）和距离（下有 5 个子列：C1、C2、C3、C4
    和簇）。距离列及其子列被突出显示。


    图 3-3


    单元格 M1:Q2 的设置


    单元格 M3 存储从国家 L1 (12, 193, 51, 21) 到质心 C1 (2.3, 15, 9.9, 10) 的距离。M3 中的公式基于公式 (3-1)，如下所示：


    ```

    =SQRT(SUMXMY2($B3:$E3, H$3:H$6))

    ```


    此公式计算 L1 和 C1 之间的欧几里得距离。请密切注意公式中绝对引用的使用。此处使用绝对引用是为了方便自动填充。函数 SQRT 计算一个值的平方根，函数
    SUMXMY2 计算两个数组中对应值之差的平方和（在此例中，两个数组分别是 L1 的 B3:E3 和 C1 的 H3:H6）。


    按照以下说明继续该过程：


    ![](img/494428_2_En_3_Fig4_HTML.jpg)


    一个表格展示了 G1 到 K6 中用于 K-means 聚类的数据。该表格包含 9 列和 12 行。列标题为均值（下有 2 个子列：C3 和 C4）和距离（下有
    5 个子列：簇、C1、C2、C3 和 C4）。


    图 3-4


    在工作表 1 中计算出的距离


    1.  选中单元格 M3，并水平自动填充至 P3。


    2.  选中单元格 M3:P3；将它们一起自动填充至单元格 M52:P52。到目前为止，每个数据点到每个质心的距离都已计算完毕。工作表的一部分如图 3-4
    所示。

