  trans: '

    ## 总体理解


    当预测结果为分类变量时，逻辑回归可被视为线性回归的一种特例。如果只有两种结果，逻辑回归称为二项逻辑回归，这是最常见的形式。如果结果多于两种，则称为多项逻辑回归。本章我们将学习如何在
    Excel 中进行二项逻辑回归。


    二项逻辑回归也可被视为 LDA 的一种特例，但其实现数据组间良好可分性的机制与 LDA 不同。


    逻辑回归的名称源于模型中使用了逻辑函数。方程（6-1）展示了逻辑函数的一般形式（其中 `a`、`b` 和 `c` 均为正数）。


    ![$$ f(x)=\frac{c}{1+a\cdotp {b}^{- kx}} $$](img/494428_2_En_6_Chapter_TeX_Equ1.png)


    (6-1)


    著名的 Sigmoid 函数是逻辑函数的一种特例。


    ![$$ s(x)=\frac{1}{1+{\mathrm{e}}^{-x}} $$](img/494428_2_En_6_Chapter_TeX_Equ2.png)


    (6-2)


    逻辑回归是一种统计模型，能够估计事件发生的概率。设 1 表示事件发生，0 表示事件未发生。因此，P(1) 是事件发生的概率，`P(0) = 1 - P(1)`。注意，概率必须介于
    0 和 1 之间（含端点）。最后，`P(1)/(1-P(1))` 是事件发生的优势比。


    假设事件的发生依赖于变量 *x*[1]、*x*[2]、⋯、*x*[*n*]。在逻辑回归中，认为优势比的对数是 *x*[*i*] 的线性函数，如方程（6-3）所示。


    ![$$ \ln \left(\frac{P(1)}{1-P(1)}\right)={m}_1{x}_1+{m}_2{x}_2+\cdots +{m}_n{x}_n+b
    $$](img/494428_2_En_6_Chapter_TeX_Equ3.png)


    (6-3)


    求解 P(1)，我们可以得到如方程（6-4）所示的逻辑函数。


    ![$$ P(1)=\frac{1}{1+{\mathrm{e}}^{-\left({m}_1{x}_1+{m}_2{x}_2+\cdots +{m}_n{x}_n+b\right)}}
    $$](img/494428_2_En_6_Chapter_TeX_Equ4.png)


    (6-4)


    逻辑回归并非通过优化系数 *m*[1]、*m*[2]、⋯、*m*[*n*]、*b* 来最大化 P(1) 的概率（这里我们将 `b` 视为一个系数；稍后我们会知道，在机器学习领域
    b 也被称为“偏置”）。相反，它试图最大化每个数据样本对应的似然。那么什么是似然？简单来说，似然是一个样本与实际事件结果（1 或 0）相匹配的概率。还是不明白？让我用一个例子来解释什么是似然。


    假设训练数据集中有两个数据记录 A 和 B。A 的事件发生了，即其事件结果为 1；B 的事件未发生，即其事件结果为 0。通过逻辑函数，计算得到 A 的 P(1)
    为 0.8，B 的 P(1) 为 0.6。由于 A 的实际事件结果为 1，因此 A 的似然就是事件发生的概率，即 P(1) = 0.8。另一方面，由于 B
    的实际结果为 0，其似然是事件不发生的概率，即其匹配的事件结果为 0。因此，B 的似然是 P(0) 而非 P(1)，且 `P(0) = 1 – P(1) =
    0.4`。


    逻辑回归试图最大化所有样本的整体似然。通过最大化似然，逻辑回归实现了两组之间的良好可分性。在实现中，通常使用似然的对数，无论是自然对数还是以 10 为底的对数。对数的优势在于，当预测的似然偏离实际事件结果时，无论实际事件结果是
    1 还是 0，对数都会迅速减小。因为当似然为 0 时，计算 log(0) 会导致错误。因此，log(0) 被当作一个预定义的最小值来处理。


    在实现中，逻辑回归也可以通过最小化似然的对数损失来实现。对数损失是似然对数的相反数。因此，当实际结果为 1 时，对数损失计算为 -log(P(1))；当实际结果为
    0 时，对数损失计算为 -log(1-P(1))。这里，log(0) 被当作一个预定义的最大值来处理。注意，当预测的似然偏离实际事件结果时，对数损失会迅速增加。图
    6-1 展示了事件结果为 1 时的对数损失。这里，log(0) 被预定义为 0.000001。


    ![](img/494428_2_En_6_Fig1_HTML.png)


    一张对数损失与预测概率关系的折线图，呈现下降趋势。该线经过坐标点 (0, 6)、(0.2, 0.8)、(0.4, 0.5)、(0.6, 0.2) 和 (0.8,
    0.1)。数值为近似值。


    图 6-1


    事件 = 1 时对数损失的计算


    基于此理解，我们进行逻辑回归的方法是：首先使用线性回归获得一组系数，然后应用规划求解来优化这些系数，要么最大化整体似然，要么最小化整体对数损失。


    ## 通过 Excel 学习逻辑回归


    文件 Chapter6-1a.xlsx 和 Chapter6-2a.xlsx 中的数据相同。它们模拟了以下场景：


    > *假设有五个基因，其表达水平可用于预测某种癌症患者五年生存概率。值 1 表示患者存活了五年，0 表示未存活。*


    如前所述，在我们的逻辑回归实践中，我们将应用规划求解来优化模型参数（系数），要么最大化整体似然，要么最小化整体对数损失。

    '
- fmt: "### By Means of Maximizing Log Likelihoods\n\nPlease open the file `Chapter6-1a.xlsx`\
    \ in which there are 87 samples and there are 4 blank rows on the top of the worksheet.\
    \ These blank rows are left there on purpose.\n\nExcel functions `INDEX` and `LINEST`\
    \ will be used again to obtain the coefficients based on the least square method.\
    \ As the first value returned by `LINEST` is for Gene 5, and the last value for\
    \ coefficient `b`, we need to set up the top two blank rows as shown in Figure\
    \ [6-2](#494428_2_En_6_Chapter.xhtml#Fig2). Such a setup is for easy autofill\
    \ later.\n\n![](images/494428_2_En_6_Chapter/494428_2_En_6_Fig2_HTML.jpg)\n\n\
    A screenshot of a spreadsheet represents the details of patient I D, Gene 1, Gene\
    \ 2, Gene 3, Gene 4, Gene 5, and 5-year survival. A set of values at the top between\
    \ columns B and G are highlighted.\n\n**Figure 6-2** Set up the data for least\
    \ square method coefficients\n\nFollow these instructions to exercise logistic\
    \ regression in Excel:\n\n![](images/494428_2_En_6_Chapter/494428_2_En_6_Fig6_HTML.jpg)\n\
    \nA screenshot of a spreadsheet represents the values of P 1, outcome, difference,\
    \ likelihood, and l n of likelihood. At the top of the table, column j denotes\
    \ the formula for the total difference, k denotes the value 53, L reads the text\
    \ To maximize, and M has a value of negative 63.03342831.\n\n**Figure 6-6** Likelihood\
    \ computed\n\n1.  Enter the following formula in both cells `B3` and `B4`:\n\n\
    \    ```\n    =INDEX(LINEST($G$6:$G$92,$B$6:$F$92),1,B1)\n    ```\n\n    The reason\
    \ to enter the same formula in two cells is that we want to keep one set of coefficients\
    \ unchanged while let another set be modified by Solver.\n\n    Note, the “known_ys”\
    \ parameter inside the `LINEST` function is cells `$G$6:$G$92`, which have only\
    \ two values: 1 and 0. This indicates that if our original target values are not\
    \ 1 and 0, they must be categorized into such.\n\n2.  Autofill `B3` to `G3`, and\
    \ `B4` to `G4`.\n\n3.  Enter the text “m1x1+m2x2+…+b” in cell `H5`. Column H represents\
    \ the right-side expression of Equation ([6-3](#494428_2_En_6_Chapter.xhtml#Equ3)).\n\
    \n4.  In cell `H6`, enter the following formula and autofill to cell `H92`:\n\n\
    \    ```\n    =SUMPRODUCT($B$4:$F$4,B6:F6)+$G$4\n    ```\n\n    The function `SUMPRODUCT`\
    \ computes the product between two arrays. Note that absolute references are used\
    \ for cell references `B4`, `F4`, and `G4`.\n\n5.  Enter the text “P(1)” in cell\
    \ `I5`. Column I represents the five-year survival probability computed based\
    \ on the values in column H.\n\n6.  In cell `I6`, enter the following formula\
    \ and autofill to cell `I92`:\n\n    ```\n    =1/(1+EXP(0-H6))\n    ```\n\n  \
    \  This formula implements Equation ([6-4](#494428_2_En_6_Chapter.xhtml#Equ4)).\
    \ `(0-H6)` represents −(*m*[1]*x*[1] + *m*[2]*x*[2] + ⋯ + *m*[*n*]*x*[*n*] + *b*),\
    \ while `EXP(0-H6)` stands for ![$$ {e}^{-\\left({m}_1{x}_1+{m}_2{x}_2+\\cdots\
    \ +{m}_n{x}_n+b\\right)} $$](images/494428_2_En_6_Chapter/494428_2_En_6_Chapter_TeX_IEq1.png).\
    \ Function `EXP` returns the power of the constant `e` (the base of the natural\
    \ logarithm). By now, part of our worksheet should look like Figure [6-3](#494428_2_En_6_Chapter.xhtml#Fig3).\n\
    \n    ![](images/494428_2_En_6_Chapter/494428_2_En_6_Fig3_HTML.jpg)\n\n    A screenshot\
    \ of a spreadsheet represents the details of Gene 1, Gene 2, Gene 3, Gene 4, Gene\
    \ 5, 5-year survival, m 1 times 1 + m 2 times 2, and P 1 for 7 patient I Ds. Two\
    \ sets of values, for m 1 to m 5 along with b, are denoted at the top.\n\n   \
    \ **Figure 6-3** P(1) computed\n\n    At this point, it would be interesting to\
    \ know how well the coefficients generated by the least square method can differentiate\
    \ the two groups of patients: survived or did not survive five years.\n\n7.  Enter\
    \ “Outcome” in cell `J5` and the formula `=IF(I6>0.5,1,0)` in cell `J6`. This\
    \ formula specifies if the probability in column I is greater than 0.5 (here,\
    \ 0.5 is the cutoff), the predicted outcome of the patient is 1, otherwise 0.\n\
    \n8.  Autofill from cell `J6` to cell `J92`.\n\n9.  Enter “Difference” in cell\
    \ `K5` and enter the formula `=IF(G6=J6,0,1)` in cell `K6`. This formula asserts\
    \ that if the predicted outcome in column J does match the actual outcome in column\
    \ G, 0 is returned; otherwise, 1 is returned.\n\n10.  Autofill from cell `K6`\
    \ to cell `K92`.\n\n11.  Enter “total diff=” in cell `J2`, and enter the formula\
    \ `=SUM(K6:K92)` in cell `K2`. By counting how many 1s there are in the array\
    \ `K6:K92`, we can tell how many predictions do not match the actual outcomes.\n\
    \n    Note that the value in cell `K2` is 53. This indicates that 53 out of 87\
    \ samples are falsely classified. This is illustrated in Figure [6-4](#494428_2_En_6_Chapter.xhtml#Fig4),\
    \ which displays part of our current worksheet.\n\n    ![](images/494428_2_En_6_Chapter/494428_2_En_6_Fig4_HTML.jpg)\n\
    \n    A screenshot of a spreadsheet represents the details of Gene 3, Gene 4,\
    \ Gene 5, 5-year survival, m 1 times 1 + m 2 times 2, P 1, outcomes, and difference.\
    \ The values of m 3, m 4, m 5, and b are denoted at the top in 2 sets. The total\
    \ difference is 53.\n\n    **Figure 6-4** Examine the temporary classification\
    \ result\n\n    If your worksheet has a result different from what is shown in\
    \ Figure [6-4](#494428_2_En_6_Chapter.xhtml#Fig4), double check the formulas,\
    \ especially those in cells `H6:K6`. Figure [6-5](#494428_2_En_6_Chapter.xhtml#Fig5)\
    \ displays some formulas entered so far. Make sure that yours are the same as\
    \ those in Figure [6-5](#494428_2_En_6_Chapter.xhtml#Fig5).\n\n    ![](images/494428_2_En_6_Chapter/494428_2_En_6_Fig5_HTML.jpg)\n\
    \n    A screenshot of a spreadsheet represents the values of m 1 times 1 + m 2\
    \ times 2 + dot dot dot + b, P 1, outcomes, and difference. Column j denotes the\
    \ formula for total difference, while column K has the formula for the sum of\
    \ values in K 6 to K 92.\n\n    **Figure 6-5** Examine the formulas entered so\
    \ far\n\n12.  Continue by entering “Likelihood” in cell `L5`.\n\n13.  Enter `=IF(G6=1,I6,1-I6)`\
    \ in cell `L6`. This formula asserts that if the actual outcome is 1, then the\
    \ likelihood is `I6`; otherwise, the likelihood is `1–I6`.\n\n14.  Autofill from\
    \ cell `L6` to cell `L92`.\n\n15.  We need to treat all the likelihood values\
    \ as a whole. There can be different ways to do it, such as summing all the values\
    \ in `L6:L92`, or computing the product of `L6:L92`. What I am introducing you\
    \ here is the sum of the logarithm of each likelihood value. Enter the text “Ln(Likelihood)”\
    \ in cell `M5`.\n\n16.  Enter the formula `=IF(L6=0, -1000000, LN(L6))` in cell\
    \ `M6`, then autofill from cell `M6` to cell `M92`. Here, the predefined minimum\
    \ is -1000000 when the likelihood is 0.\n\n17.  In cell `L1`, enter “To-Maximize”.\n\
    \n18.  Enter the formula `=SUM(M6:M92)` in cell `M1`. Cell `M1` stores the value\
    \ to be maximized by Solver.\n\n    Part of our worksheet should look like Figure\
    \ [6-6](#494428_2_En_6_Chapter.xhtml#Fig6).\n\n    ![](images/494428_2_En_6_Chapter/494428_2_En_6_Fig7_HTML.jpg)\n\
    \n    A screenshot of a dialog box titled solver parameter. It represents the\
    \ settings to set the objective, change the variable cells, modify the subject\
    \ to the constraints, and select a solving method. It highlights a solve button\
    \ at the bottom.\n\n    **Figure 6-7** Using Solver to maximize the likelihood\n\
    \n1.  The next step is to maximize the value inside cell `M1` by using Solver.\
    \ Select cell `M1` ➤ click the main tab Data ➤ click Solver.\n\n2.  A menu shows\
    \ up for us to select proper cells and set up requirements. Follow Figure [6-7](#494428_2_En_6_Chapter.xhtml#Fig7)\
    \ to\n    1.  Select cell `$M$1` for “Set Objective”.\n    2.  Select `$B$4:$G$4`\
    \ for “By Changing Variable Cells”.\n    3.  Choose “Max” as shown in Figure [6-7](#494428_2_En_6_Chapter.xhtml#Fig7).\n\
    \    4.  Select the solving method “GRG Nonlinear”. Observe that the check box\
    \ for “Make Unconstrained Variables Non-Negative” is not checked.\n\n    ![](images/494428_2_En_6_Chapter/494428_2_En_6_Fig8_HTML.jpg)"
