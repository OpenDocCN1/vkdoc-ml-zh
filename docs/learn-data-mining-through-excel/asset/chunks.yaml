    \ that (1) there are five levels for six data points, one level for one round\
    \ of clustering and (2) A and C are first clustered together, and therefore the\
    \ clade for AC has the least height. In dendrogram, the higher the clade, the\
    \ larger the distance between the two clusters."
  trans: "\n### 实验 4\n\n在前三个实验中，目标变量只有两种不同的响应。现在，我们来开展一次目标变量具有两种以上响应的 K-NN 分析。打开 `Chapter7-4a.xlsx`\
    \ 文件。该文件与 `Chapter7-3b.xlsx` 非常相似，不同之处在于：(1) 其响应为“是”、“不确定”和“否”；(2) 它尚未计算每种可能响应或\
    \ Daisy 最可能响应的概率。请先查看该文件。工作表如图 7-14 所示。请注意，在单元格 I3 中，显示的是“最大权重”，而非“概率”。\n\n![](img/494428_2_En_7_Fig14_HTML.jpg)\n\
    \n电子表格顶部包含 Daisy 的年龄、收入和持卡数量详情。右侧是年龄、收入和持卡数量的最大值与最小值详情。底部包含姓名、年龄、收入、持卡数量、响应、距离、倒数、权重以及归一化后的年龄、收入和持卡数量详情。\n\
    \n**图 7-14**\n\n具有三种不同分类结果的 K-NN\n\n请按照以下说明完成最终计算：\n\n1.  在单元格 F4 中输入以下公式：\n\n\
    \    ```\n    =SUMIFS($K$12:$K$211,$E$12:$E$211, F$3,$I$12:$I$211,\"<=\"&$E4)\n\
    \    ```\n\n2.  从 F4 自动填充至 H4，然后一起自动填充至第 9 行。\n\n3.  在单元格 I4 中输入公式 `=MAX(F4:H4)`，并从\
    \ I4 自动填充至 I9。\n\n4.  在单元格 B4 中输入以下公式，然后自动填充至单元格 B9：\n\n    ```\n    =INDEX(F$3:H$3,1,MATCH(I4,F4:H4,0))\n\
    \    ```\n\n    请注意 `MATCH` 函数的使用。`MATCH` 内部的最后一个参数是 0，表示它正在搜索精确匹配。这一点在此处很重要，因为许多数值彼此接近。\n\
    \n完成。最终结果如图 7-15 所示，并可在文件 `Chapter7-4b.xlsx` 中找到。\n\n![](img/494428_2_En_7_Fig15_HTML.jpg)\n\
    \n电子表格包含 Daisy 的年龄、收入、持卡数量和响应详情，以及“小”、“是”、“不确定”、“否”、“最大权重”的值，还有年龄、收入和持卡数量的最小值和最大值。底部包含姓名、年龄、收入、持卡数量、响应、距离、倒数、权重和归一化变量的详情。\n\
    \n**图 7-15**\n\n具有三种预测结果的 K-NN 的最终结果\n\n## 强化练习\n\n`Chapter7-HW.xlsx` 中的强化练习可能需要您付出一些努力并保持谨慎。但这是您更熟练地掌握\
    \ K-NN 数据挖掘方法所必需的。如果在完成此强化练习时遇到任何困难，请随时查看 `Chapter7-HW-withAnswers.xlsx` 中的解答。\n\
    \n## 复习要点\n\n1.  什么是 K-NN 及其在生活中的相似之处\n2.  不同的距离函数\n3.  不同的权重函数和归一化技术\n4.  用于寻找\
    \ K-NN 最优 K 值的肘部法则\n5.  Excel 函数 `SQRT` 和 `SMALL` 以及 Excel 运算符 `&`\n6.  Excel\
    \ 函数 `IF`、`COUNTIFS`、`SUMIFS`、`MATCH` 和 `INDEX`\n\n# 8. 层次聚类与树状图\n\n您可能想知道为什么我不在\
    \ K 均值聚类之后立即解释层次聚类。嗯，这有几个原因。首先，Excel 并不像适用于 K 均值聚类那样适用于层次聚类或树状图。在深入探讨这个具有挑战性的主题之前，我想先介绍另外几种更流行的数据挖掘方法。第二个原因是我认为在\
    \ K-NN 之后立即解释层次聚类是合适的。最后一个原因与树状图有关。在 Excel 中绘制树状图需要相当多的手动操作，这可能会让一些学习者感到枯燥。\n\n\
    请从 [`https://github.com/hhohho/Learn-Data-Mining-through-Excel-2`](https://github.com/hhohho/Learn-Data-Mining-through-Excel-2)\
    \ 下载本章练习所需的示例 Excel 文件。\n\n## 总体理解\n\n层次聚类与 K 均值聚类相似，它也是一种无监督分类方法，根据某些特征的相似性将对象（数据点）分类到不同的组（簇）中。然而，这两种聚类方法基于不同的算法，这导致了不同的最终结果。K\
    \ 均值聚类生成并行的簇。而层次聚类则如其名所示，生成一个簇的树状结构。此外，层次聚类的最终结果通常以树状图的形式呈现，该图显示了原始数据点或分组数据点的相对距离。这是层次聚类在生物医学科学中经常用于展示基因或样本聚类的主要原因。\n\
    \nK 均值聚类从定义簇的数量 k 开始。层次聚类则从邻近度矩阵开始，并且永远不需要预先定义簇的数量。层次聚类的算法可以通过以下包含六个数据点 A、B、C、D、E\
    \ 和 F 的示例来解释。\n\n1.  最初，每个数据点都被视为一个簇。\n2.  构建一个邻近度矩阵来显示这六个簇之间的距离。\n3.  假设 A 和\
    \ C 之间的距离最小，那么在第一轮中，A 和 C 被置于同一个簇中，并表示为 AC。\n4.  现在，只剩下五个簇：AC、B、D、E 和 F。\n5. \
    \ 重复步骤 2，为这五个簇创建一个邻近度矩阵。假设 B 和 D 的距离最小，那么只剩下四个簇：AC、BD、E 和 F。\n6.  重复步骤 2，为这四个簇创建一个邻近度矩阵。假设\
    \ AC 和 F 的距离最小，那么只剩下三个簇：ACF、BD 和 E。\n7.  重复步骤 2，为这三个簇创建一个邻近度矩阵。假设 ACF 和 BD 的距离最小，那么只剩下两个簇：ACFBD\
    \ 和 E。\n8.  层次聚类在只剩下一个簇时停止：ACFBDE。\n\n上述算法适用于凝聚聚类，这是一种自下而上的层次聚类。与凝聚聚类相反的是分裂聚类，它是自上而下的。在本书中，我们将体验凝聚聚类，并且簇之间的距离仍然是欧几里得距离。\n\
    \n什么是树状图？嗯，在这种情况下，一张图确实胜过千言万语。按照前面的示例，该算法的最终结果可以用下图表示，这是一个真正的树状图。\n\n![](img/494428_2_En_8_Fig1_HTML.png)\n\
    \n一个树状图，从第 6、5、4、3、2 和 1 层绘制了 5 个簇 A、C、F、B、D 和 E。\n\n**图 8-1**\n\n一个示例树状图，展示了\
    \ A、B、C、D、E、F 的层次聚类过程\n\n观察图 8-1 可以发现：(1) 六个数据点有五个层级，一个层级对应一轮聚类；(2) A 和 C 首先聚类在一起，因此\
    \ AC 分支的高度最小。在树状图中，分支越高，两个簇之间的距离越大。\n"
- fmt: '# Draw a Dendrogram in Excel Without Add-ins


    Before I show you how to use Excel to implement the agglomerative hierarchical
    clustering algorithm, let’s learn how to draw a dendrogram first in Excel. Note,
    there are commercial analytical software that can be purchased and added into
    Excel to ease the hierarchical clustering process and dendrogram creation. What
    I am showing here does not require any add-ins.


    Let’s start from the simplest dendrogram as shown in Figure [8-2](#494428_2_En_8_Chapter.xhtml#Fig2).


    ![](images/494428_2_En_8_Chapter/494428_2_En_8_Fig2_HTML.png)


    A dendrogram plots cluster at 2 and labeled A and C.


    **Figure 8-2** The simplest dendrogram


    If I ask you to use a pen to draw the chart in Figure [8-2](#494428_2_En_8_Chapter.xhtml#Fig2)
    on a piece of paper under the condition that your pen can never leave the paper
    until completion, how are you going to draw it? Well, you can start from the top,
    right, or left. Assume you start from the left where the letter A stays (height=0),
    your pen should move as follows:


    1. Start from A, go up by 1.

    2. Turn to right, stop at above letter C.

    3. Go down by 1 to letter C.

    4. Go up by 1.

    5. Turn left and stop at the middle between A and C.

    6. Go up by 1 to 2.


    What if the dendrogram looks like Figure [8-3](#494428_2_En_8_Chapter.xhtml#Fig3)
    and we need to stop at height 3?


    ![](images/494428_2_En_8_Chapter/494428_2_En_8_Fig3_HTML.jpg)


    A dendrogram plots 2 clusters from 3 with labels A, C and F. An arrow stops here
    points at cluster 3.


    **Figure 8-3** A slightly more complicated dendrogram


    Well, we can continue moving our pen as follows:


    7. Turn our pen to right so that it is right above letter F.

    8. Go down by 2 to 0.

    9. Go up by 2.

    10. Turn left and stop above letter C.

    11. Go up by 1 to 3.


    So far, we should have understood that our pen goes through some paths twice.
    Yes, that is the trick. If we convert these pen movements into a scatter plot
    in Excel, then the movements can be represented by the data points shown in Figure
    [8-4](#494428_2_En_8_Chapter.xhtml#Fig4).


    ![](images/494428_2_En_8_Chapter/494428_2_En_8_Fig4_HTML.jpg)


    A screenshot depicts Excel sheet, a sequence of movements is described, starting
    from cell (1, 0) and involving steps such as going up, down, left, and right to
    various cells. The movements form a path in the grid, ultimately reaching cell
    (3, 3).


    **Figure 8-4** The X and Y values for a scatter plot that produces a dendrogram


    Please open `Chapter8-1a.xlsx`. What will jump into your eyes should look like
    Figure [8-5](#494428_2_En_8_Chapter.xhtml#Fig5), which is a dendrogram slightly
    different from Figure [8-3](#494428_2_En_8_Chapter.xhtml#Fig3) because it does
    not have the labels A, C, or F. Note, this dendrogram is a scatter plot and is
    produced based on the data in `A1:B13` which is the same as shown in Figure [8-4](#494428_2_En_8_Chapter.xhtml#Fig4).


    ![](images/494428_2_En_8_Chapter/494428_2_En_8_Fig5_HTML.jpg)


    A screen depicts a excel sheet with X and Y coordinates and a dendrogram without
    labels.


    **Figure 8-5** The dendrogram without labels


    To make the dendrogram in Figure [8-5](#494428_2_En_8_Chapter.xhtml#Fig5) look
    like that in Figure [8-3](#494428_2_En_8_Chapter.xhtml#Fig3), we need to complete
    the following:


    12. As shown in Figure [8-6](#494428_2_En_8_Chapter.xhtml#Fig6), click inside
    the x-axis, then select Delete on the upcoming menu. This action deletes the x-axis.

    13. Right-click on the chart title to delete it, too, as shown in Figure [8-6](#494428_2_En_8_Chapter.xhtml#Fig6).


    ![](images/494428_2_En_8_Chapter/494428_2_En_8_Fig6_HTML.jpg)


    A screen depicts instructions for modifying a dendrogram. It first suggests right-clicking
    on the title to delete it and then selecting the delete option, among other potential
    actions or settings for customizing the chart''s appearance.


    **Figure 8-6** Delete the x-axis and the chart title


    14. Follow Figure [8-7](#494428_2_En_8_Chapter.xhtml#Fig7) to add data labels.
    Make sure to select Below.


    ![](images/494428_2_En_8_Chapter/494428_2_En_8_Fig7_HTML.jpg)


    A screen displays a set of instructions for customizing a dendrogram. It mentions
    actions like selecting data labels, adding chart elements and adjusting various
    chart elements such as axes, titles and gridlines.


    **Figure 8-7** Add data labels


    15. Follow Figure [8-8](#494428_2_En_8_Chapter.xhtml#Fig8) to delete data labels
    one by one but leave the bottom three labels intact. Bear in mind that this action
    requires some effort.


    Note, when you click on one data label, all data labels are selected. You should
    continue clicking on that specific label (single click). This action will deselect
    other data labels but only select the one you clicked.


    ![](images/494428_2_En_8_Chapter/494428_2_En_8_Fig8_HTML.jpg)


    A screen with a sequence of actions or items displayed, represented by frame and
    numbers from 4 to 0. The instruction is to delete these items one by one, starting
    from 4 and descending to 0.


    **Figure 8-8** Delete the marked data labels one by one. Leave the bottom three
    labels intact


    16. For the three bottom data labels, click on the leftmost one. All the three
    labels are selected. Immediately click on the leftmost data label again; now only
    the leftmost data label is selected. Change its text to A.

    17. Continue to change the text of the rest two data labels. Figure [8-9](#494428_2_En_8_Chapter.xhtml#Fig9)
    shows the text changing for the last data label. After this step, we shall get
    a dendrogram similar to Figure [8-3](#494428_2_En_8_Chapter.xhtml#Fig3).


    ![](images/494428_2_En_8_Chapter/494428_2_En_8_Fig9_HTML.jpg)


    A screen with edit the text from frame 0 on dendrogram graph.


    **Figure 8-9** Edit the text inside a data label


    The final result is available in `Chapter8-1b.xlsx`.'
