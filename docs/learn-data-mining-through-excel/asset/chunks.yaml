    # 9. Naive Bayes Classification


    The data mining methods we have been learning all favor numerical data: linear
    regression, LDA, k-means clustering, logistic regression, K-NN, and hierarchical
    clustering. Naïve Bayes favors categorical data, however. Because of its simplicity,
    Naïve Bayes data mining method is much more efficient compared to many other data
    mining methods, while its performance can still match most other data mining methods.


    Please download the sample Excel files from [`https://github.com/hhohho/Learn-Data-Mining-through-Excel-2`](https://github.com/hhohho/Learn-Data-Mining-through-Excel-2)
    for this chapter’s exercises.


    ## General Understanding


    Data mining methods or machine learning models are generally considered probability
    methods/models. The probability computation starts from the training dataset.
    A fundamental principal is that if a specific state of the attribute or the target
    *S*[*k*] has the probability *P*[*k*] to appear in a given condition, then it
    is assumed that under the same condition in the scoring dataset, the probability
    for *S*[*k*] to appear is still *P*[*k*]. When you read this chapter and other
    chapters such as Association Analysis and Decision Trees, you will find the implicit
    application of this principal, though I may or may not explicitly mention it.


    Naive Bayes (Naïve Bayes) is one of the most used classification algorithms. Its
    mathematical background is the conditional probability which asks this question:
    what is the probability for event y to happen given x happens? Here, the condition
    is x (x happens or x is true), and the conditional probability is expressed as
    *P*(*y*|*x*).


    The conditional probability *P*(*y*|*x*) is computed as


    ![$$ P\left(\left.y\right|x\right)=\frac{P\left(y\cap x\right)}{P(x)}, $$](images/494428_2_En_9_Chapter/494428_2_En_9_Chapter_TeX_Equ1.png)


    (9-1)


    where *P*(*x*) represents the probability for x to be true and *P*(*y* ∩ *x*)
    is the probability for both x and y to be true.


    Similarly, the conditional probability *P*(*x*|*y*) is computed as


    ![$$ P\left(\left.x\right|y\right)=\frac{P\left(x\cap y\right)}{P(y)}, $$](images/494428_2_En_9_Chapter/494428_2_En_9_Chapter_TeX_Equ2.png)


    (9-2)


    Because *P*(*y* ∩ *x*)= *P*(*x* ∩ *y*), we then have *P*(*y*|*x*)*P*(*x*) = *P*(*x*|*y*)*P*(*y*).
    Thus, we can derive the simplest Bayes’ theorem as stated in Equation (9-3):


    ![$$ P\left(\left.y\right|x\right)=\frac{P\left(\left.x\right|y\right)P(y)}{P(x)},
    $$](images/494428_2_En_9_Chapter/494428_2_En_9_Chapter_TeX_Equ3.png)


    (9-3)


    Note, the Bayes’ theorem converts the computation of *P*(*y*|*x*) into *P*(*x*|*y*).


    Equation ([9-3](#494428_2_En_9_Chapter.xhtml#Equ3)) implicitly assumes that y
    is the class in study for the dependent variable y and x is the state in study
    for the independent attribute x. This may be a little bit confusing since y must
    have more than one class and x must have more than one state. Don’t worry, please
    read on and you will develop a clear understanding of the Bayes’ theorem.


    Assume that y has two classes y[1] and y[2], let’s rewrite Equation ([9-3](#494428_2_En_9_Chapter.xhtml#Equ3))
    for a given y[1] under a specific condition x[a] (assume x has different states/conditions
    and x[a] is one of them), we then have


    ![$$ P\left(\left.{y}_1\right|{x}_a\right)=\frac{P\left(\left.{x}_a\right|{y}_1\right)P\left({y}_1\right)}{P\left({x}_a\right)},
    $$](images/494428_2_En_9_Chapter/494428_2_En_9_Chapter_TeX_Equ4.png)


    (9-4)


    Repeat the preceding action for y[2]; we have


    ![$$ P\left(\left.{y}_2\right|{x}_a\right)=\frac{P\left(\left.{x}_a\right|{y}_2\right)P\left({y}_2\right)}{P\left({x}_a\right)},
    $$](images/494428_2_En_9_Chapter/494428_2_En_9_Chapter_TeX_Equ5.png)


    (9-5)


    Because y has only two classes, under the condition x[a], either y[1] or y[2]
    must happen, that is, *P*(*y*[1]|*x*[*a*]) + *P*(*y*[2]|*x*[*a*]) must equal 1\.
    Therefore,


    ![$$ \frac{P\left(\left.{x}_a\right|{y}_1\right)P\left({y}_1\right)}{P\left({x}_a\right)}+\frac{P\left(\left.{x}_a\right|{y}_2\right)P\left({y}_2\right)}{P\left({x}_a\right)}=1
    $$](images/494428_2_En_9_Chapter/494428_2_En_9_Chapter_TeX_Equa.png)


    that is, *P*(*x*[*a*]) = *P*(*x*[*a*]|*y*[1])*P*(*y*[1]) + *P*(*x*[*a*]|*y*[2])*P*(*y*[2]).
    Thus, we can finally reach


    ![$$ P\left(\left.{y}_1\right|{x}_a\right)=\frac{P\left(\left.{x}_a\right|{y}_1\right)P\left({y}_1\right)}{P\left(\left.{x}_a\right|{y}_1\right)P\left({y}_1\right)+P\left(\left.{x}_a\right|{y}_2\right)P\left({y}_2\right)}
    $$](images/494428_2_En_9_Chapter/494428_2_En_9_Chapter_TeX_Equ6.png)


    (9-6)'
