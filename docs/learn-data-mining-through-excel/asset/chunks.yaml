  trans: "\n### 练习 2\n\n希望到目前为止，你已经对如何在 Excel 中进行朴素贝叶斯分类有了一定的了解。接下来，我们看一个更复杂的例子。\n\
    \n打开文件 `Chapter9-2a.xlsx`，其中包含与 `Chapter9-1a.xlsx` 类似的随机生成数据。在 `Chapter9-2a.xlsx`\
    \ 中，训练数据集包含 1978 个样本，目标变量“肺癌”有四个不同的类别。这四个类别分别是：阴性、1 期、2 期和 3 期。此外，三个预测变量均具有两个以上的分类值。请注意，朴素贝叶斯方法仅适用于分类值。如果我们的数据值不是分类值而是数值，则必须在应用朴素贝叶斯分类方法之前将其转换为分类值。\n\
    \n仔细查看数据。工作表的一部分如图 9-5 所示。训练数据集的范围是从第 34 行到第 2011 行。评分数据集的范围是从第 21 行到第 30 行。\n\
    \n![](img/494428_2_En_9_Fig5_HTML.jpg)\n\n一个 Excel 截图展示了设置。它包含行标题，如计数、概率，以及尺寸下的超大、大、中、小和无，数字下的刻度\
    \ 1 到 5，以及厚度下的浅色、灰色和深色。列标题是阴性和 1 期到 3 期。\n\n图 9-5\n练习 2 的设置\n\n按照以下说明对给定数据集完成朴素贝叶斯分类：\n\
    \n![](img/494428_2_En_9_Fig6_HTML.jpg)\n\n一个 Excel 截图。行标题是尺寸、数字和厚度。列标题是阴性和 1 期到\
    \ 3 期。它包含不同尺寸（如超大、大、中、小和无）的数值数据。\n\n图 9-6\n检查我们当前的数据\n\n1.  在单元格 C3 中输入以下公式，然后从单元格\
    \ C3 自动填充到单元格 F3：\n\n```\n    =COUNTIF($E$34:$E$2011,C2)\n    ```\n\n2.  在单元格\
    \ C4 中输入公式 `=C3/$B$1`，并从单元格 C4 自动填充到 F4。单元格 C4:F4 引用了每个类别的概率。\n\n3.  要计算 p(超大|阴性)，请在单元格\
    \ C5 中输入以下公式：\n\n```\n    =COUNTIFS($B$34:$B$2011,$B5,$E$34:$E$2011,C$2)/C$3\n\
    \    ```\n\n4.  从单元格 C5 自动填充到 F5，然后一起自动填充到单元格 C9:F9。\n\n此时，检查我们的工作表是否与图 9-6 中显示的内容相似。根据数字格式，我们工作表中单元格\
    \ C4:F9 中小数的最后几位数字可能与图 9-6 中的不同。在继续之前，请确保我们的公式是正确的。\n\n![](img/494428_2_En_9_Fig8_HTML.jpg)\n\
    \n一个 Excel 截图展示了评分数据。它包含一个表格，列标题为样本 ID、尺寸、数字、厚度和肺癌。右侧有概率计算。\n\n图 9-8\n计算评分数据集的概率\n\
    \n1.  要计算 p(刻度-1|阴性)，请在单元格 C10 中输入以下公式：\n\n```\n    =COUNTIFS($C$34:$C$2011,$B10,$E$34:$E$2011,C$2)/C$3\n\
    \    ```\n\n2.  从单元格 C10 自动填充到单元格 F10，然后一起自动填充到单元格 C14:F14。\n\n3.  要计算 p(浅色|阴性)，请在单元格\
    \ C15 中输入以下公式：\n\n```\n    =COUNTIFS($D$34:$D$2011,$B15,$E$34:$E$2011,C$2)/C$3\n\
