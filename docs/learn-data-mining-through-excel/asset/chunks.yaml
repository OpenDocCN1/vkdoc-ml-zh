    ### Learn Decision Trees Through Excel


    We need to set up our data in a proper table so that we can autofill formulas.
    We have seen such table organizations in previous chapters.


    ![](images/494428_2_En_10_Chapter/494428_2_En_10_Fig5_HTML.jpg)


