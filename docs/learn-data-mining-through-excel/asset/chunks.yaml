  trans: "\n## 通过 Excel 学习数据清洗\n\n数据清洗通常应用于数据记录而非数据属性，即针对行而非列。当一条记录中存在缺失数据或意外数据时，最安全的做法是删除该记录，因为保留它可能会给数据挖掘结果引入误差。著名的“垃圾进，垃圾出”原则指出，如果数据质量不高，无论我们做什么，数据挖掘结果的质量肯定也不会高。尽管如此，数据工程师还可以采用其他数据处理方法，不过如果你的数据量足够大且不包含这些记录，我通常不推荐使用这些方法。\n\
    \n一种常见的技术是用一个常量（如 0），或者该属性的均值、中位数或众数来替换缺失的数值型数据值。在某些情况下，例如，如果数值型数据类型的意外值是“高”，我们可以考虑用大于均值或中位数的数字来替换这个意外值。\n\
    \n对于分类属性，缺失或空值可以用一个常量（如“missing”）来替换。\n\n当一个属性有太多低质量的数据值时，我们应该考虑删除该属性，因为它本身就有问题，并成为数据肿瘤。没有一刀切的阈值来决定何时删除一列，这取决于经验以及反复试验。\n\
    \n一种更高级的方法是开发一个机器学习模型来预测缺失或空值。例如，假设我们有 A1、A2、……、A10 这些属性和标签 T，并且 A1 中存在一些缺失值。然后我们可以开发一个机器学习模型，将\
    \ A1 视为目标，而所有其他属性（包括标签 T）作为预测变量。该模型使用完整的记录进行训练，然后用于预测 A1 中缺失的值。\n\n打开 Chapter11-3a.xlsx。你可能会发现它与\
    \ Chapter-2b.xlsx 相同。工作表 crx2 已经标记了缺失数据或意外值所在的位置。快速浏览一下，我们应该能意识到，与数据量相比，需要删除的数据记录并不多。因此，我们应该继续删除工作表\
    \ crx2 中标记的那些记录。我们可以从工作表 crx2 开始操作，也可以从原始工作表 crx 重新开始。\n\n让我们从原始工作表 crx 重新开始，复制一份并将其重命名为新工作表\
    \ crx3。在工作表 crx3 中，请按照以下说明完成我们的数据清洗工作。注意，对于数据清洗，我们必须同时考虑缺失数据和数据异常。\n\n![](img/494428_2_En_11_Fig7_HTML.jpg)\n\
    \n一张 Excel 电子表格的截图，其中包含待删除记录的行号。\n\n图 11-7\n\n标记了待删除记录的行号\n\n1.  在单元格 A2 中，输入以下公式：\n\
    \n```\n    =IF(COUNT(crx!A2:A691)/COUNTA(crx!A2:A691)>0.8, IF(ISTEXT(crx!A2),\
    \ ROW(A2), IF(crx!A2<0, ROW(A2), \"\")), IF(OR(ISNONTEXT(crx!A2), crx!A2=\"?\"\
    ), ROW(A2), \"\"))\n    ```\n\n在此公式中，`COUNT(crx!A2:A691)/COUNTA(crx!A2:A691)>0.8`\
    \ 用于判断属性是文本还是数值数据。根据数据类型，相应地检查该属性是否存在缺失或意外数据。请注意，函数 ISTEXT 可以检测问号“?”。\n\n从 A2\
    \ 自动填充到 O691。\n\n此时，我们工作表的一部分应如图 11-7 所示。\n\n![](img/494428_2_En_11_Fig8_HTML.jpg)\n\
    \n一个用于 crx4 的 Excel 电子表格。\n\n图 11-8\n\n工作表 crx4\n\n1.  在单元格 Q1 中输入“toKeep”，在 Q2\
    \ 中输入 `=IF(SUM(A2:O2)>0, 1, 0)`，然后自动填充到 Q691。此公式判断 A2:O2 中是否有行号，如果有，则通过将其标记为 1\
    \ 来表示该行需要删除。这将帮助我们稍后保留那些想要的记录。\n\n2.  再次，复制一份工作表 crx，这样我们就不会直接删除原始工作表中的记录。这在数据清洗中非常重要。将新工作表重命名为\
    \ crx4。\n\n3.  复制工作表 crx3 中的单元格 Q1:Q691，并以值的形式粘贴到工作表 crx4 中相同的 Q1:Q691 区域。注意，粘贴操作必须仅以值的形式进行。工作表\
    \ crx4 的一部分应如图 11-8 所示。\n\n![](img/494428_2_En_11_Fig9_HTML.jpg)\n\n一张 Excel 电子表格演示了选择“等于”选项以准备筛选记录的步骤。步骤如下：数据选项卡、筛选、toKeep、数字筛选、等于。\n\
    \n图 11-9\n\n准备根据“toKeep”列筛选记录\n\n1.  让我们创建一个新的空白工作表，并将其命名为“cleaned-crx”。稍后我们将把清洗后的数据存储在此工作表中。\n\
    \n2.  返回工作表 crx4。选择所有列 A–Q ➤ 单击数据选项卡 ➤ 单击筛选 ➤ 单击单元格 Q1 中的箭头 ➤ 选择数字筛选 ➤ 选择“等于…”选项。如图\
    \ 11-9 所示。\n\n![](img/494428_2_En_11_Fig10_HTML.jpg)\n\n自定义自动筛选窗口的截图。在“等于”选项旁边输入了\
    \ 0。\n\n图 11-10\n\n设置自定义自动筛选\n\n1.  出现一个自定义自动筛选窗口。按照图 11-10 中的说明进行操作。\n\n1.  现在，在工作表\
    \ crx4 中，只显示那些要保留的记录。选择所有数据，并将其复制/粘贴到工作表“cleaned-crx”的单元格 A1 中。就这样！工作表 cleaned-crx\
    \ 包含了清洗后的数据。\n\n完成的工作包含在工作表 Chapter11-3b.xlsx 中。注意，你可以删除工作表 cleaned-crx 中的 Q 列。\n\
    \n此时，你可能已经意识到，从 Chapter11-2b.xlsx 到 Chapter11-2c.xlsx 和 Chapter11-3b.xlsx，我使用的公式变得更加高级，使得过程更简单。这只是一个简单的演示，说明实践可以提高我们的技能。\n\
    \n## 特征选择\n\n在许多情况下，数据集中会有许多特征/属性可用。对于我们的数据挖掘目的而言，某些特征可能比其他特征更重要，并且多个特征可能密切相关，以至于它们提供相同的信息。因此，特征选择的目的是找到能够根据所选评估指标提供最高预测结果的最佳特征集。\n\
    \n流行词“大数据”可能会给我们一种印象，即在数据挖掘或机器学习中，特征越多越好。事实上，并非如此。更多的特征会带来更大的维度空间，这会使数据挖掘模型复杂化。因此，数据挖掘中的一项关键技能是发现最具决定性的特征或属性。例如，决定客户对信用卡优惠态度的最重要的几个特征是什么？\n\
    \n在机器学习中，有相当多的特征选择技术，例如前向选择和后向消除。前向选择从一个或两个特征开始，然后继续向特征集中添加更多特征，直到无法再做出显著改进为止。后向消除从完整的特征集开始，一次消除一个特征，直到得到一个能够提供可比预测质量的核心特征集。当然，这样的特征选择过程不适合在\
    \ Excel 中操作。在本书中，我将向你展示一些可以在 Excel 工作表中实现的基本特征选择原则和技术。\n\n关于特征选择，有三个通用原则：\n\n\
    1.  处于同一量纲的特征效果更好。\n\n2.  方差较大的特征贡献更大。\n\n3.  相关的特征讲述相同的数据故事。\n\n如你所见，第一个原则是选择处于同一量纲的特征。但如果没有任何数值特征处于同一量纲，该怎么办？这是我承诺要详细讨论的问题。\n"
- fmt: '### Normalization and Standardization


    To make all numerical attributes on the same scale, there are two commonly used
    methods: normalization and standardization.


    Standardization is the same as computing the Z-score of each value, that is, each
    value of an attribute is transformed to its corresponding Z-score by Equation
    (11-1):


    ![$$ z=\frac{x-\mu }{\sigma } $$](images/494428_2_En_11_Chapter/494428_2_En_11_Chapter_TeX_Equ1.png)


    (11-1)


    where `x` is a single value of an attribute, `μ` is the mean of the attribute,
    and `σ` is the standard deviation of this attribute.


    Normalization, the traditional normalization method, is to scale up or down all
    the numerical values into the same range, commonly 0–1 or 0–100.


    Both methods can be used to transform numerical attributes into the same scale.
    However, they both have their own advantages and disadvantages. Moreover, I personally
    believe that another normalization method, normalization by median, is an approach
    more appropriate than both the traditional normalization method and standardization
    method when we need to preserve the variances. Normalization by median is commonly
    used in bioinformatics study of gene expression. To compare these three methods,
    please open the Excel file `Chapter11-scale-a.xlsx`. Immediately, Figure 11-11
    will be reflected in your eyes.


    ![](images/494428_2_En_11_Chapter/494428_2_En_11_Fig11_HTML.jpg)


    A screenshot contains the three faked attributes such as A1, A2, and A3.


    **Figure 11-11** Three faked attributes A1, A2, and A3


    So far, we have had some experiences with the traditional normalization, which
    allows us able to tell that attribute A2 can be easily scaled down to the same
    as A1. What about the attribute A3? Well, let’s normalize all the three attributes
    into the range 0–100 in the section of Normalization (columns E–G) first. In cell
    `E3`, enter the following formula and autofill from `E3` to `G3` then autofill
    together to `E12:G12`:


    ```

    =(B3-MIN(B$3:B$12))/(MAX(B$3:B$12)-MIN(B$3:B$12))*100

    ```


    Everything looks good. Now, let’s apply Equation (11-1) to the three attributes
    by entering the following formula in `H3` and autofill to `J3` then autofill together
    to `H12:J12`:


    ```

    =(B3-AVERAGE(B$3:B$12))/STDEV.P(B$3:B$12)

    ```


    Here, we treat the ten records as the whole population and therefore apply the
    function `STDEV.P` on attribute A1. Observe that the values in `H3:J12` have both
    negative and positive values.


    Notice that attributes A1, A2, and A3 are transformed into the same values by
    the two previous methods. Something like this is unlikely to happen in reality.
    I designed them this way for demonstration purpose.


    A good transformation should preserve the variances of the data. So, enter the
    formula `=VAR.P(B3:B12)` in `B13` and then autofill to `J13`. At this point of
    time, our worksheet should look like Figure 11-12.


    ![](images/494428_2_En_11_Chapter/494428_2_En_11_Fig12_HTML.jpg)


    A screenshot of the Excel spreadsheet that contains the original, normalization,
    standardization, and normalization by median data.


    **Figure 11-12** Both normalization and standard fail to preserve certain attributes’
    variances


    Figure 11-12 shows that both normalization and standardization render the three
    attributes the same variance. Since A2 = 100 x A1, we may agree that A1 and A2
    should have the same variance after either normalization or standardization. But
    the original A3 seems to have little variance which was normalized/standardized
    to be the same as that of A1 or A3.


    Normalization by median is a method that can scale the attribute into the same
    range and preserve the variance. It scales up or down attributes based on the
    medians. This method starts with selecting a reference attribute, for example,
    A1. Then it goes ahead to assume that all other attributes should have the same
    median as that of the reference attribute. Finally, it scales up or down an attribute
    based on the ratio of the two medians between this attribute and the reference
    attribute.


    So, enter the following formula in `K3`, autofill to `M3`, and then autofill together
    to `K12:M12`:


    ```

    =B3/(MEDIAN(B$3:B$12)/MEDIAN($B$3:$B$12))

    ```


    Also, autofill from `J13` to `M13`. Our worksheet should look like Figure 11-13.


    ![](images/494428_2_En_11_Chapter/494428_2_En_11_Fig13_HTML.jpg)


    An Excel spreadsheet illustrates the variance of A3 is preserved through normalization
    by median.


    **Figure 11-13** The normalization by median method preserves attribute variances


    Figure 11-13 illustrates that the variance of A3 is also preserved through normalization
    by median.


    In data mining projects, whether or not and how to normalize or standardize is
    always a puzzle requiring sophisticated assessment. In many cases, we can only
    be sure after multiple rounds of experiments.


    ### Correlation


    Correlation measures the linear association strength between two numerical variables
    or attributes. The strength is expressed by the correlation coefficient which
    must be in the range of -1 to 1 inclusively. Given two variables X and Y, if they
    are positively correlated, then X and Y go in the same direction. For example,
    if X is the daily temperature while Y is the ice cream sale. The higher the X,
    the larger the Y; or the lower the X, the smaller the Y. If X and Y are negatively
    correlated, then they go in the opposite directions. For example, the car mileage
    and car weight. When the correlation coefficient is close to zero, there is no
    correlation between X and Y. The computation of correlation coefficient is very
    simple in Excel by the function `CORREL`. This is shown in Figure 11-14.


    ![](images/494428_2_En_11_Chapter/494428_2_En_11_Fig14_HTML.jpg)


    An Excel spreadsheet illustrates the correlation computation formula.


    **Figure 11-14** Correlation computation in Excel'
