    The preceding procedure applies the parameter set (including coefficients, intercept,
    and cutoffs) obtained through the training dataset to the testing dataset. It
    compares the actual Iris types (in column A) with the predicted types (in column
    H). There are two samples falsely predicted. As there are no common data points
    between the training and testing datasets, this validation through the testing
    dataset is a bona fide cross-validation.


    ![](images/494428_2_En_5_Chapter/494428_2_En_5_Fig4_HTML.jpg)


    A spreadsheet represents a set of values under columns K, L, M, and N. The values
    include `b`, `w1`, `w2`, `w3`, `w4`, obtained by the solver, optimized by `LINEST`,
    mean, sample number, cutoff, difference, inter-group variance, within-group variance,
    and inter-to-within ratio.


    **Figure 5-4** Parameter set obtained through Solver in the training dataset


    1.  We can certainly further optimize the LDA model in the `training_dataset`
    worksheet. Follow the procedure we have learned in the last chapter to apply Solver
    to the training dataset.


    Recall in the last chapter, after using Solver to optimize the model, the “Inter-group
    variance” significantly decreased. However, working with this smaller training
    dataset, after applying Solver to optimize the model, the “Inter-group variance”
    significantly increased. This is a good example illustrating that data sample
    does matter in data mining. Part of the result is shown in Figure [5-4](#494428_2_En_5_Chapter.xhtml#Fig4).


    2.  Apply the parameter set to the testing subset (copying values in cells `M5:M9`
    which are optimized by Solver in the `training_dataset` worksheet to the `testing_dataset`
    worksheet).


    3.  In `L16`, enter “Cross validation missed =”. In `L17`, enter “Cross validation
    accuracy=”, and in `M17`, enter the formula `=1-M16/47`. Our result looks like
    Figure [5-5](#494428_2_En_5_Chapter.xhtml#Fig5).


    ![](images/494428_2_En_5_Chapter/494428_2_En_5_Fig5_HTML.jpg)


    A spreadsheet represents the values of type classification, difference, `b`, `w1`,
    `w2`, `w3`, `w4`, optimized by the solver, mean, sample number, and cutoff. The
    values of cross-validation missed and cross-validation accuracy, highlighted at
    the bottom, are 1 and 97.87%, respectively.


    **Figure 5-5** Cross-validation with testing dataset


    The complete results are available in the file `Chapter5-cv-1b.xlsx`.


    Bear in mind that in cross-validation, only part of the original training dataset
    is used to construct the model, while the rest is used to test the model performance.
    Once the data mining method, for example, LDA, is confirmed to have acceptable
    performance, it is better for the final model (or the parameter set) to be generated
    based on the whole original training dataset using LDA method.


    ## General Understanding of ROC Analysis


    Receiver operating characteristic (ROC) curve analysis is another commonly used
    method to assess the performance of a model. Different from cross-validation,
    ROC analysis works only for the case when the target variable has exactly two
    distinct values, such as true and false, or positive and negative. For this reason,
    ROC analysis cannot be used to assess the preceding Iris dataset LDA model.


    ROC analysis is widely used in biomedical model assessments, where a diagnostic
    test must determine if a sample is positive or negative regarding a disease. The
    following scenario helps explain what ROC analysis can be applied.


    Suppose our research has discovered that certain blood characteristics are well
    correlated with the identification of a certain type of disease. Let’s name these
    characteristics `C1`, `C2`, `C3`, and `C4` and the disease `D`. We have developed
    an LDA model based on `C1`, `C2`, `C3`, and `C4` to determine the presence of
    the disease in patients. A perfect model would clearly separate the group with
    the disease from the group without the disease in a large population. Unfortunately,
    clear separation doesn’t exist in reality because of classification errors. In
    the group having the disease, some are correctly classified as positive (true
    positive, or `TP`), while some are incorrectly classified as negative (false negative,
    or `FN`). Similarly, in the group without the disease, some are correctly classified
    as negative (true negative, or `TN`), while some are mistakenly classified as
    positive (false positive, or `FP`). By adjusting the cutoff or other related assessment
    metric, the numbers of `TP`, `FN`, `FP`, and `TN` can vary.


    The following concepts are critical in understanding and applying ROC analysis:


    *   **Sensitivity** is the probability that a test result will be positive when
    the disease is present. It is also called true positive rate and is defined as
    `TP / (TP + FN)`. It only measures the percentage of diseased individuals that
    can be correctly classified by the test.


    *   **Specificity** is the probability that a test result will be negative when
    the disease is not present. It is also called true negative rate and is computed
    as `TN / (TN + FP)`. It only measures the percentage of un-diseased individuals
    that can be correctly classified by the test.


    *   **False positive rate** is the probability that a test result will be positive
    when the disease is not present. False positive rate = `1 - specificity`.


    *   **Positive predictive value** is the probability that the disease is present
    when the test is positive, expressed as `TP / (TP + FP)`.


    *   **Negative predictive value** is the probability that the disease is absent
    when the test is negative, expressed as `TN / (TN + FN)`.


    Consider the extreme situation when the test determines every individual as positive.
    In this case, `FN = 0` and `TN = 0`, `specificity = 0` but `sensitivity = 100%`.


    In another extreme situation, when the test determines every individual as negative,
    `specificity = 100%`, while `sensitivity = 0`.


    By adjusting the cutoff, both sensitivity and specificity can vary. In most cases,
    we will observe when sensitivity goes up, specificity goes down. A good model
    has a cutoff point that can keep both sensitivity and specificity high. However,
    some tests may emphasize on high positive predictive values or high negative predictive
    values.'
