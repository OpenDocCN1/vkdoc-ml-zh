  \n一张电子表格截图，显示了基因 3、基因 4、基因 5、5 年生存率、m1x1 + m2x2、P(1)、结果和差异的详细信息。顶部以两组形式标出了 m3、m4、m5\
  \ 和 b 的值。总差异为 53。\n\n图 6-4\n检查临时分类结果\n\n如果你的工作表结果与图 6-4 所示不同，请仔细检查公式，尤其是单元格 H6:K6\
  \ 中的公式。图 6-5 显示了到目前为止输入的一些公式。请确保你的公式与图 6-5 中的一致。\n\n![](img/494428_2_En_6_Fig5_HTML.jpg)\n\
  \n一张电子表格截图，显示了 m1x1 + m2x2 + ... + b、P(1)、结果和差异的值。J 列表示总差异的公式，而 K 列包含 K6 到 K92 值之和的公式。\n\
  \n图 6-5\n检查到目前为止输入的公式\n\n12. 继续，在单元格 L5 中输入“似然”。\n\n13. 在单元格 L6 中输入 `=IF(G6=1,I6,1-I6)`。该公式断言，如果实际结果为\
  \ 1，则似然为 I6；否则，似然为 `1–I6`。\n\n14. 从单元格 L6 自动填充至单元格 L92。\n\n15. 我们需要将所有似然值视为一个整体。有多种方法可以做到这一点，例如对\
  \ L6:L92 中的所有值求和，或计算 L6:L92 的乘积。我在这里要介绍的是每个似然值的对数之和。在单元格 M5 中输入文本“Ln(似然)”。\n\n16.\
  \ 在单元格 M6 中输入公式 `=IF(L6=0, -1000000, LN(L6))`，然后从单元格 M6 自动填充至单元格 M92。此处，当似然为 0 时，预定义的最小值为\
