  \ 函数不能以 0 作为输入。因此，这里使用 IFERROR 函数来捕获此类错误。如果发生错误，则返回 0。\n\n此公式计算属性值“hot”对应的 P[yes]\
  \ × Log2(P[yes])。\n\n2.  从单元格 F22 自动填充至 G22，然后一起自动填充至单元格 F31:G31。注意，单元格 G22 计算属性值“hot”对应的\
