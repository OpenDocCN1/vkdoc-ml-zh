  \n## 特征选择\n\n在许多情况下，数据集中会有许多特征/属性可用。对于我们的数据挖掘目的而言，某些特征可能比其他特征更重要，并且多个特征可能密切相关，以至于它们提供相同的信息。因此，特征选择的目的是找到能够根据所选评估指标提供最高预测结果的最佳特征集。\n\
  \n流行词“大数据”可能会给我们一种印象，即在数据挖掘或机器学习中，特征越多越好。事实上，并非如此。更多的特征会带来更大的维度空间，这会使数据挖掘模型复杂化。因此，数据挖掘中的一项关键技能是发现最具决定性的特征或属性。例如，决定客户对信用卡优惠态度的最重要的几个特征是什么？\n\
  \n在机器学习中，有相当多的特征选择技术，例如前向选择和后向消除。前向选择从一个或两个特征开始，然后继续向特征集中添加更多特征，直到无法再做出显著改进为止。后向消除从完整的特征集开始，一次消除一个特征，直到得到一个能够提供可比预测质量的核心特征集。当然，这样的特征选择过程不适合在\
  \ Excel 中操作。在本书中，我将向你展示一些可以在 Excel 工作表中实现的基本特征选择原则和技术。\n\n关于特征选择，有三个通用原则：\n\n1.\
  \  处于同一量纲的特征效果更好。\n\n2.  方差较大的特征贡献更大。\n\n3.  相关的特征讲述相同的数据故事。\n\n如你所见，第一个原则是选择处于同一量纲的特征。但如果没有任何数值特征处于同一量纲，该怎么办？这是我承诺要详细讨论的问题。\n\
  \n\n\n### 归一化与标准化\n\n为了使所有数值属性处于同一量级，有两种常用方法：归一化与标准化。\n\n标准化等同于计算每个值的 Z 分数，即通过公式（11-1）将属性的每个值转换为其对应的\
  \ Z 分数：\n\n![$$ z=\\frac{x-\\mu }{\\sigma } $$](img/494428_2_En_11_Chapter_TeX_Equ1.png)\n\
  \n（11-1）\n\n其中 *x* 是属性的单个值，*μ* 是属性的均值，*σ* 是属性的标准差。\n\n归一化，即传统的归一化方法，是将所有数值按比例放大或缩小到同一范围，通常为\
  \ 0–1 或 0–100。\n\n这两种方法都可用于将数值属性转换到同一量级。然而，它们各有优缺点。此外，我个人认为，当需要保留方差时，另一种归一化方法——中位数归一化——比传统归一化方法和标准化方法都更为合适。中位数归一化常用于基因表达的生物信息学研究。要比较这三种方法，请打开\
  \ Excel 文件 `Chapter11-scale-a.xlsx`。图 11-11 将立即呈现在您眼前。\n\n![](img/494428_2_En_11_Fig11_HTML.jpg)\n\
  \n该截图包含三个虚构属性，如 A1、A2 和 A3。\n\n图 11-11\n三个虚构属性 A1、A2 和 A3\n\n到目前为止，我们对传统归一化有了一些经验，可以看出属性\
  \ A2 很容易被缩放到与 A1 相同。那么属性 A3 呢？好吧，让我们先在“归一化”部分（E–G 列）将这三个属性都归一化到 0–100 的范围。在单元格 E3\
  \ 中输入以下公式，从 E3 自动填充到 G3，然后一起自动填充到 E12:G12：\n\n```\n=(B3-MIN(B$3:B$12))/(MAX(B$3:B$12)-MIN(B$3:B$12))*100\n\
  ```\n\n一切看起来不错。现在，让我们将公式（11-1）应用于这三个属性，在 H3 中输入以下公式，自动填充到 J3，然后一起自动填充到 H12:J12：\n\
  \n```\n=(B3-AVERAGE(B$3:B$12))/STDEV.P(B$3:B$12)\n```\n\n这里，我们将这十条记录视为整个总体，因此对属性\
  \ A1 应用函数 `STDEV.P`。观察 H3:J12 中的值，既有负值也有正值。\n\n请注意，通过上述两种方法，属性 A1、A2 和 A3 被转换成了相同的值。这种情况在现实中不太可能发生。我这样设计是为了演示目的。\n\
  \n一个好的转换应该保留数据的方差。因此，在 B13 中输入公式 `=VAR.P(B3:B12)`，然后自动填充到 J13。此时，您的工作表应如图 11-12\
  \ 所示。\n\n![](img/494428_2_En_11_Fig12_HTML.jpg)\n\n该 Excel 电子表格截图包含原始数据、归一化、标准化以及中位数归一化数据。\n\
  \n图 11-12\n归一化和标准化均未能保留某些属性的方差\n\n图 11-12 显示，归一化和标准化都使这三个属性具有相同的方差。由于 A2 = 100 x\
  \ A1，我们可以认同 A1 和 A2 在经过归一化或标准化后应具有相同的方差。但原始的 A3 似乎方差很小，却被归一化/标准化为与 A1 或 A2 相同的方差。\n\
  \n中位数归一化是一种可以将属性缩放到相同范围并保留方差的方法。它基于中位数对属性进行缩放。该方法首先选择一个参考属性，例如 A1。然后假设所有其他属性应与参考属性具有相同的中位数。最后，根据该属性与参考属性之间的两个中位数的比值，对该属性进行缩放。\n\
  \n因此，在 K3 中输入以下公式，自动填充到 M3，然后一起自动填充到 K12:M12：\n\n```\n=B3/(MEDIAN(B$3:B$12)/MEDIAN($B$3:$B$12))\n\
  ```\n\n同时，从 J13 自动填充到 M13。您的工作表应如图 11-13 所示。\n\n![](img/494428_2_En_11_Fig13_HTML.jpg)\n\
  \n该 Excel 电子表格展示了通过中位数归一化保留了 A3 的方差。\n\n图 11-13\n中位数归一化方法保留了属性方差\n\n图 11-13 说明，通过中位数归一化，A3\
  \ 的方差也得到了保留。\n\n在数据挖掘项目中，是否进行归一化或标准化以及如何进行，始终是一个需要复杂评估的难题。在许多情况下，我们只能通过多轮实验后才能确定。\n\
  \n### 相关性\n\n相关性衡量两个数值变量或属性之间的线性关联强度。该强度由相关系数表示，其取值范围必须在-1 到 1 之间（含端点）。给定两个变量 X\
  \ 和 Y，如果它们正相关，则 X 和 Y 同向变化。例如，X 是每日气温，Y 是冰淇淋销量。X 越高，Y 越大；或 X 越低，Y 越小。如果 X 和 Y 负相关，则它们反向变化。例如，汽车里程数与汽车重量。当相关系数接近零时，X\
  \ 和 Y 之间不存在相关性。在 Excel 中，通过函数 `CORREL` 计算相关系数非常简单。如图 11-14 所示。\n\n![](img/494428_2_En_11_Fig14_HTML.jpg)\n\
  \n该 Excel 电子表格展示了相关性计算公式。\n\n图 11-14\n在 Excel 中计算相关性\n\n\n\n### 通过 Excel 学习特征选择\n\
  \n打开文件 Chapter11-4a.xlsx，你会发现其中有两个工作表：“cleaned-crx”和“encoded”。工作表 cleaned-crx 与\
  \ Chapter11-3b.xlsx 中的同名工作表相同。不过，我们将从“encoded”工作表开始进行特征选择。如果你比较这两个工作表，会发现工作表 encoded\
  \ 在 A 列多了一个名为“Customer”的属性。添加此列是为了作为每条记录的 ID。此外，在工作表 encoded 中，所有分类属性都已转换为数值属性（整数）。在这里，我执行了“编码”操作，使数据为特征选择操作做好准备。\n\
  \n某些数据挖掘方法只能处理数值；因此，将分类值转换为数值是非常常见的，这个过程称为“编码”。有两种常用的编码方案：独热编码和序数编码。使用哪一种取决于分类属性的类型。一般来说，所有分类属性可以分为两类：名义型或序数型。名义型分类属性没有特定顺序，例如，眼睛的颜色（黄色、黑色、棕色、蓝色）。序数型分类属性有特定顺序，例如，等级\
  \ A、B、C、D、F。\n\n独热编码通常适用于名义型分类属性，它会为每个类别创建一个值为 0 或 1 的新属性。例如，假设我们有一个名为 EyeColor\
  \ 的属性，它有三个类别：黄色、黑色和蓝色。那么独热编码会将这个 EyeColor 属性替换为三个新属性，可能命名为“yellow”、“black”和“blue”，每个对应一种眼睛颜色。新属性“yellow”中的\
  \ 1 表示存在黄色眼睛颜色，而 0 表示不存在黄色眼睛颜色。同样的方案适用于“black”和“blue”属性。\n\n序数编码则简单得多。对于等级 A、B、C、D、F，我们可以简单地将它们转换为\
  \ 4–0 或 0–4。由于我们使用的样本数据集没有提供关于分类属性的任何有意义信息，我对所有分类属性应用了序数编码。\n\n按照以下说明在 Excel 中练习特征选择。\n\
  \n![](img/494428_2_En_11_Fig15_HTML.jpg)\n\n归一化后的 Excel 工作表截图。\n\n图 11-15\n\n归一化属性\n\
  \n1.  复制工作表 encoded，并将新工作表重命名为“normalized”。\n\n2.  在工作表 normalized 的单元格 B2 中，输入以下公式：\n\
  \n```\n    =IFERROR((encoded!B2-MIN(encoded!B$2:B$647))/(MAX(encoded!B$2:B$647)-MIN(encoded!B$2:B$647))*100,\
  \ encoded!B2)\n    ```\n\n此公式将属性 A1 中 B2 的值归一化到 0–100 范围。\n\n3.  从 B2 自动填充到 P2，然后从\
  \ B2:P2 自动填充到 B647:P647。我们归一化后的工作表部分应如图 11-15 所示。\n\n![](img/494428_2_En_11_Fig16_HTML.jpg)\n\
  \nExcel 中每个归一化属性方差的截图。\n\n图 11-16\n\n每个归一化属性的方差\n\n1.  在单元格 A648 中，输入“Variance”。\n\
  \n2.  在 B648 中输入 `=VAR.P(A2:B647)`，然后自动填充到 P648。我们工作表的部分应如图 11-16 所示。\n\n![](img/494428_2_En_11_Fig17_HTML.jpg)\n\
  \n展示计算出的相关矩阵的 Excel 电子表格。\n\n图 11-17\n\n计算出的相关矩阵\n\n1.  从图 11-16 中，我们可以看出，除了 A15\
  \ 之外，所有属性都有相当数量的方差。显然，A1 的方差最大。\n\n2.  下一步是创建一个相关矩阵，显示每两个属性之间的相关性。两个属性之间的高正或高负相关系数表明这两个属性在讲述相同的数据故事。要创建相关矩阵，请创建一个新工作表并将其重命名为“correlation”。\n\
  \n3.  在工作表 correlation 中，分别在单元格 B1:Q1 中输入整数 1–16。一个快速的方法是自动填充这些数字。\n\n4.  在单元格 A2:A17\
  \ 中自动填充整数 1–16。\n\n5.  在 B2 中输入以下公式，自动填充到 Q2，然后一起自动填充到 B17:Q17：\n\n`=CORREL(INDEX(normalized!$B$2:$Q$647,$A2,0),INDEX(normalized!$B$2:$Q$647,B$1,0))`\n\
  \n6.  在单元格 B18 中输入“A1”，然后自动填充到 P18。我们的工作表应如图 11-17 所示。\n\n1.  我们首先应该查看的是 Q 列或第 17\
  \ 行，它们标记了目标属性与其他属性之间的相关系数。我们会发现 A1 与目标属性的相关系数最大，表明 A1 与目标属性共享了大量数据故事，也就是说，A1 可能是目标属性的一个良好指标。由于\
  \ A1 也具有最大的方差，我们当然应该将 A1 选入核心特征集。\n\n2.  选择 A1 之后，我们应该寻找与 A1 相关系数较小的独立属性。A7 是一个不错的候选。我们选择它。\n\
  \n3.  下一个候选是 A9。对于 A9，我们必须检查它与 A1 和 A7 的相关系数。\n\n4.  我们应该选择 A4 还是 A14？嗯，它们与 A1 的相关系数处于中等偏高水平，但它们与\
  \ A9 或 A7 的相关系数很高（分别为 0.70 和 0.77）。因此，核心特征集可能只是 A1、A7 和 A9。\n\n上述操作记录在 Chapter11-4b.xlsx\
  \ 中。此时，一个好的练习是尝试使用所有特征或仅使用核心特征来运行数据挖掘方法。记住应用交叉验证来评估核心特征集是否能表现良好。\n\nChapter11-5a.xlsx\
  \ 和 Chapter11-6a.xlsx 旨在让你对你选择的数据挖掘方法进行交叉验证，使用所有特征或仅使用核心特征。为此，我应用了逻辑回归，因为与目标高度相关的特征有助于回归模型，如线性回归或逻辑回归（记住特征\
  \ A1 与目标具有高正相关性）。我的工作可以在 Chapter11-5b.xlsx 和 Chapter11-6b.xlsx 中找到。注意，由于目标只有两个类别（0,\
  \ 1），这是应用逻辑回归的完美案例。当然，其他数据挖掘方法如 K-NN 和朴素贝叶斯也是不错的选择。\n\n## 强化练习\n\n共有三组强化练习。\n\n\
  1.  Chapter11-HW-1a.xlsx 用于 EDA 练习。请使用它练习以下内容（必要时可参考 Chapter11-HW-1a-withAnswers.xlsx）：\n\
  \    *   记录数量\n\n    *   属性数量\n\n    *   每个属性的数据类型\n\n    *   每个数值属性的总和、均值、中位数和方差\n\
  \n    *   每个数值属性的值范围\n\n    *   分类目标和属性的唯一值\n\n    *   目标的类别分布\n\n2.  Chapter11-HW-2a.xlsx\
  \ 用于数据清洗练习。你可以在 Chapter11-HW-2a-withAnswers.xlsx 中找到标准答案。\n\n3.  Chapter11-HW-3a.xlsx\
  \ 用于特征选择练习。注意，对于此练习，没有标准答案，我仅在文件 Chapter11-HW-3a-withSuggestions.xlsx 中提供建议。\n\n\
  ## 复习要点\n\n请复习以下主题和技能：\n\n1.  EDA 中的初步调查\n\n2.  缺失数据和异常值的检测\n\n3.  数据清洗\n\n4.  编码，包括独热编码和序数编码\n\
  \n5.  归一化、标准化和中位数归一化\n\n6.  数据挖掘的特征选择\n\n7.  Excel 的“删除重复项”功能\n\n8.  Excel 函数 COUNT、COUNTA、MAX、MIN、AVERAGE、MEDIAN、IF、OR、ISNONTEXT、ISTEXT、ROW、CORREL、VAR.P、STDEV.P\
  \ 和 INDEX\n\n\n\n"
- "# 12. 关联分析\n\n我们已经了解到，相关性衡量的是两个数值变量之间的线性关联强度。相关性研究要求两个变量必须是数值型，且仅衡量线性关系，而关联分析则没有这种限制。关联分析衡量的是两个或多个变量之间共同出现的强度。它是一种用于交叉销售的有效数据挖掘技术，并且在生物医学研究（如基因网络研究）中也有应用。\n\
  \n请从 [`https://github.com/hhohho/Learn-Data-Mining-through-Excel-2`](https://github.com/hhohho/Learn-Data-Mining-through-Excel-2)\
  \ 下载本章练习所需的示例 Excel 文件。\n\n## 总体理解\n\n关联分析最著名的应用是所谓的购物篮分析，它找出在同一笔购买交易中一个（或多个）商品与另一个商品共同出现的情况。通过识别哪些商品经常被一起购买，商店（通常是零售店或超市）可以采取相关措施来增加销售额。这些措施包括将某些商品摆放在一起、推广捆绑价格等。\n\
  \n通常的理解是找出那些频繁购买的商品之间的共同出现关系。因此，我们需要理解的第一个概念是“支持度百分比”，或者简单地说，“支持度”。一个商品（或项集）的支持度定义为该商品（或项集）在交易集中出现的频率。我将使用表\
  \ 12-1 中的数据来帮助解释*支持度*的概念。\n\n表 12-1\n\n一个示例购物篮\n\n| 购物篮 | 啤酒 | 电影 | 尿布 | 笔 | 大米\
  \ | 苹果 | 果汁 |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| 1 | 1 |   |\
  \ 1 |   |   |   |   |\n| 2 | 1 | 1 |   | 1 |   | 1 |   |\n| 3 |   |   |   |   |\
  \   | 1 | 1 |\n| 4 |   |   | 1 |   |   |   |   |\n| 5 | 1 | 1 |   |   |   |   |\
  \   |\n| 6 | 1 |   | 1 |   | 1 |   |   |\n| 7 |   |   |   |   |   |   |   |\n| 8\
  \ | 1 | 1 | 1 |   |   |   |   |\n| 9 | 1 | 1 |   |   |   |   |   |\n| 10 |   |  \
  \ |   |   | 1 | 1 | 1 |\n| 11 | 1 |   | 1 |   |   |   |   |\n| 12 |   | 1 |   |\
  \   |   |   | 1 |\n\n在表 12-1 中，一个购物篮代表一笔购买交易，共有 12 笔交易。数字 1 表示该商品出现在该特定交易中。由于啤酒在\
  \ 12 笔交易中出现了 7 次，因此啤酒的支持度 = 7/12。类似地，笔的支持度 = 1/12，苹果的支持度 = 3/12。\n\n另一个重要概念是“置信度”。置信度类似于条件概率。例如，当购买啤酒时，同时购买尿布的频率是多少？这个概率表示为置信度\
  \ (B → D)（啤酒蕴含尿布）。由于当购买啤酒时，尿布也被购买了 4 次；因此，置信度 (B → D) = 4/7。\n\n请注意，置信度 (D → B)\
  \ = 4/5，因为尿布被购买了 5 次，其中有 4 次啤酒与尿布一起购买。这表明项集 (B, D) 与项集 (D, B) 是不同的。\n\n请按照以下说明来体验关联分析是如何工作的：\n\
  \n1.  假设最小支持度为 0.25，最小置信度为 0.6。\n\n2.  由于笔和大米的支持度值都低于 0.25，任何包含笔或大米的项集的支持度值也会低于\
  \ 0.25。那么我们感兴趣的商品就仅限于啤酒、电影、尿布、苹果和果汁。因此，要分析的数据缩减为表 12-2 所示。\n\n表 12-2\n\n应用最小支持度后缩减的购物篮数据\n\
  \n| 购物篮 | 啤酒 | 电影 | 尿布 | 苹果 | 果汁 |\n    | --- | --- | --- | --- | --- | --- |\n\
  \    | 1 | 1 |   | 1 |   |   |\n    | 2 | 1 | 1 |   | 1 |   |\n    | 3 |   |   |\
  \   | 1 | 1 |\n    | 4 |   |   | 1 |   |   |\n    | 5 | 1 | 1 |   |   |   |\n  \
  \  | 6 | 1 |   | 1 |   |   |\n    | 7 |   |   |   |   |   |\n    | 8 | 1 | 1 | 1\
  \ |   |   |\n    | 9 | 1 | 1 |   |   |   |\n    | 10 |   |   |   | 1 | 1 |\n   \
  \ | 11 | 1 |   | 1 |   |   |\n    | 12 |   | 1 |   |   | 1 |\n\n3.  假设我们只对包含至少两个商品的项集感兴趣。总共有\
  \ 20 个不同的二元项集，即 ![$$ \\left(\\begin{array}{c}5\\\\ {}2\\end{array}\\right)\\times\
  \ 2 $$](img/494428_2_En_12_Chapter_TeX_IEq1.png) 。手动评估它们会非常繁琐且容易出错，尽管仍然可行。只有四个项集\
  \ (电影, 啤酒)、(尿布, 啤酒)、(苹果, 果汁) 和 (果汁, 苹果) 通过了置信度要求。然而，(苹果, 果汁) 和 (果汁, 苹果) 都未能满足支持度标准，因为它们的支持度值小于\
  \ 0.25，因此只剩下两个二元项集。结果如表 12-3 所示。\n\n表 12-3\n\n仅限二元项集\n\n| 项集 | 支持度 | 置信度 | 项集 |\
  \ 支持度 | 置信度 |\n    | --- | --- | --- | --- | --- | --- |\n    | (B, M) | 4/10 |\
  \ 4/7 | (M, A) | 1/10 | 1/5 |\n    | (M, B) | 4/10 | 4/5 | (A, M) | 1/10 | 1/3 |\n\
  \    | (B, D) | 4/10 | 4/7 | (M, J) | 1/10 | 1/5 |\n    | (D, B) | 4/10 | 4/5 |\
  \ (J, M) | 1/10 | 1/3 |\n    | (B, A) | 1/10 | 1/7 | (D, A) | 0 | 0 |\n    | (A,\
  \ B) | 1/10 | 1/3 | (A, D) | 0 | 0 |\n    | (B, J) | 0 | 0 | (D, J) | 0 | 0 |\n\
  \    | (J, B) | 0 | 0 | (J, D) | 0 | 0 |\n    | (M, D) | 1/10 | 1/5 | (A, J) | 2/10\
  \ | 2/3 |\n    | (D, M) | 1/10 | 1/5 | (J, A) | 2/10 | 2/3 |\n\n4.  现在，只能在这三个商品（啤酒、电影和尿布）内部检查三元项集。共有六个不同的项集：(B,\
  \ {M, D})、(M, {B, D})、(D, {B, M}) 以及 ({M, D}, B)、({B, D}, M)、({B, M}, D)。然而，啤酒、电影和尿布仅共同出现一次；所有三元项集都将无法满足最小支持度要求，也就是说，不存在满足要求的三元项集。当没有三元项集时，肯定也没有四元或五元项集能通过标准。\n\
  \n结论：根据给定的最小支持度和置信度值，上述关联分析仅识别出两个有意义的项集，即 (电影, 啤酒) 和 (尿布, 啤酒)。\n\n\n\n## 通过 Excel\
  \ 学习关联分析\n\n让我们打开 Chapter12-1a.xlsx 文件，其中包含 371 张收据（交易）的 1831 条记录。这 1831 条记录是从一个更大的在线零售数据集中筛选并预处理得到的，该数据集由\
  \ UCI 机器学习库提供，网址为 [`https://doi.org/10.24432/C5BW33`](https://doi.org/10.24432/C5BW33)。部分数据如图\
  \ 12-1 所示。\n\n![](img/494428_2_En_12_Fig1_HTML.jpg)\n\n一张电子表格截图，显示了收据编号、数量和商品代码的详细信息。共有\
  \ 11 行，分别表示收据编号 1、2、3 和 4 的详细信息。\n\n图 12-1\n\n购物篮数据\n\nChapter12-1a.xlsx 中的数据已按收据编号排序。A\
  \ 列显示收据编号，C 列显示收据上的商品，共有 50 种不同的商品，编号从 I1 到 I50，B 列列出了每张收据上每种商品的购买数量。例如，第 2 至 6\
  \ 行显示收据 1 上有商品 I28、I46、I47、I48 和 I50。在本研究中，我们忽略购买数量。\n\n对于关联分析，必须将 Chapter12-1a.xlsx\
  \ 中的数据重新组织成表 12-1 的形式。请按照以下说明组织 Chapter12-1a.xlsx 中的数据：\n\n![](img/494428_2_En_12_Fig2_HTML.jpg)\n\
  \n一张电子表格截图，显示了收据编号、数量和商品代码的详细信息。A 列表示收据编号 1 到 7，而 D 列表示收据数量为 15。\n\n图 12-2\n\n组织数据\n\
  \n1.  在单元格 D1 中输入“收据编号”。\n\n2.  由于共有 371 张收据，编号从 1 到 371，因此在单元格 D2 中输入 1，在单元格 D3\
  \ 中输入 2。选中单元格 D2 和 D3，然后向下自动填充至单元格 D372。\n\n3.  在单元格 E1 中输入“I1”，然后从单元格 E1 水平自动填充至单元格\
  \ BB1。单元格 E1:BB1 包含商品编号 I1、I2、……、I50。工作表的部分内容如图 12-2 所示。\n\n![](img/494428_2_En_12_Fig4_HTML.jpg)\n\
  \n一张电子表格，显示了 BB 列下 I50 的值列表、BE 列下 I1 到 I16 的出现次数，以及 BF 到 BO 列之间 I1 到 I10 的值。\n\n\
  图 12-4\n\n设置关联表\n\n1.  如果某商品出现在某张收据上，则其对应单元格的值应为数值 1。例如，由于商品 I8 在收据 #6 上，单元格 L7\
  \ 的值应为 1。同理，由于 I28 在收据 #1 上，单元格 AF2 的值也应为 1。单元格 E2、F2 和 G2 内部的值应为 0，因为商品 I1、I2 和\
  \ I3 不在收据 #1 上。我们需要一个公式，如果商品在收据上，则在该商品下方分配 1；否则，分配 0。在单元格 E2 中输入以下公式：\n\n```\n \
  \   =COUNTIFS($A$2:$A$1832,$D2,$C$2:$C$1832,E$1)\n    ```\n\n在此公式中，`“$A$2:$A$1832,$D2”`\
  \ 返回 A2:A6，因为 $D2 匹配 1。但是，A2:A6 内的任何单元格在 C 列中都没有等于 E$1 (I1) 的值。因此，此公式在单元格 E2 中返回\
  \ 0。\n\n2.  将公式从 E2 自动填充到单元格 BB2，然后一起自动填充到单元格 E372:BB372。部分数据如图 12-3 所示。\n\n![](img/494428_2_En_12_Fig3_HTML.jpg)\n\
  \n一张电子表格截图，显示了商品代码和收据编号的详细信息，以及 I1、I2、I3、I4、I5、I6、I7、I8、I9 和 I10 的值。表格中共有 21 行。\n\
  \n图 12-3\n\n创建用于关联分析的数据表\n\n在本例中，我们将检查所有大小为 2 的项集；因此，我们需要设置一个表格，使得表格的行和列都用每个商品标记。之后，我们还需要计算每个项集的置信度和支持度值。为此，我们需要计算\
  \ (1) 两个商品在同一张收据上共同出现的次数，以及 (2) 某个商品出现的收据数量。\n\n\n\n3.  在单元格 BF1 中输入文本“I1”，然后向右自动填充至单元格\
  \ DC1。\n\n4.  在 BE2 中输入文本“出现次数”，在单元格 BF2 中输入公式 `=COUNTIFS(E2:E372,1)`，并从单元格 BF2\
  \ 自动填充至单元格 DC2。单元格 BF2:DC2 引用的是“某个商品出现在收据上的次数”。例如，商品 I1 出现在 20 张收据上（如图 12-4 所示）。\n\
  \n5.  在单元格 BD3 中输入 1，在单元格 BD4 中输入 2。同时选中单元格 BD3 和 BD4，然后自动填充至单元格 BD52。此操作会将数字 1,\
  \ 2, 3, …, 50 填入单元格 BD3, BD4, BD5, …, BD52。这些数字将用于引用数据表 E2:BB372 中的列，因为 E2:BB372\
  \ 中共有 50 列，每列对应一个商品。\n\n6.  在单元格 BE3 中输入“I1”，然后从单元格 BE3 自动填充至单元格 BE52。\n\n将我们的工作表与图\
  \ 12-4 进行比较。如果我们的工作表与图 12-4 看起来不同，我们需要 (1) 检查公式，以及 (2) 确保商品名称中没有多余的空格。例如，在单元格 E1\
  \ 或 BF1 中，如果商品名称输入为“I1 ”，那么针对 I1 的计算将不正确。\n\n![](img/494428_2_En_12_Fig5_HTML.jpg)\n\
  \n一个电子表格，展示了 BE 列下从 I1 到 I13 的出现次数，以及 BF 到 BM 列之间 I1 到 I8 的值列表。这些数据描述了商品共同出现在同一张收据上的次数。\n\
  \n图 12-5\n计算出的两个商品的共现次数\n\n1.  让我们计算两个商品在同一张收据上共同出现的次数。在单元格 BF3 中输入以下公式：\n\n```\n\
  \    =COUNTIFS(INDEX($E$2:$BB$372,0,$BD3),1,E$2:E$372,1)\n    ```\n\nBD3 = 1，因此函数\
  \ `INDEX($E$2:$BB$372,0,$BD3)` 会从表 E2:BB372 中取出第一列，即商品 I1 所在的列，也就是 E2:E372。因此，单元格\
  \ BF3 中的上述公式变为 `=COUNTIFS(E2:E372,1,E$2:E$372,1)`。此公式统计同时满足两个条件的行数：`E2:E372` 中的单元格值为\
  \ 1，且 E$2:E$372 中的单元格值也为 1。\n\n在这个特定公式中，两个条件恰好相同，因为单元格 BF3 对应的是项集 (I1, I1)。这可能会让人困惑。请继续往下看，我很快就会进一步解释。\n\
  \n2.  从单元格 BF3 自动填充至单元格 DC3，然后一起自动填充至 BF52:DC52。让我们看看单元格 BG3 中的公式。它是：\n\n```\n \
  \   =COUNTIFS(INDEX($E$2:$BB$372,0,$BD3), 1,F$2:F$372,1)\n    ```\n\n`INDEX($E$2:$BB$372,0,$BD3)`\
  \ 仍然会给出商品 I1 对应的 E2:E372。然而，`F$2:F$372` 对应的是商品 I2。因此，这个公式现在统计的是商品 I1 和商品 I2 在同一张收据上共同出现的次数。\n\
  \n另一个例子是单元格 BJ4 中的公式。它是：\n\n```\n    =COUNTIFS(INDEX($E$2:$BB$372,0,$BD4), 1,I$2:I$372,1)\n\
  \    ```\n\n由于 BD4 = 2，这个公式实际上等同于：\n\n```\n    =COUNTIFS(F$2:F$372,1,I$2:I$372,1)\n\
  \    ```\n\n显然，单元格 BJ4 统计的是商品 I2 和商品 I5 在同一张收据上共同出现的次数。\n\n现在，让我们将我们的工作表与图 12-5\
  \ 进行比较。\n\n![](img/494428_2_En_12_Fig7_HTML.jpg)\n\n一个电子表格，展示了 DF 列下的支持度值 0.03 和置信度值\
  \ 0.5。DG 列纵向排列了 I1 到 I13。DH 到 DM 列分别横向排列了 I1 到 I6。单元格 DK11 和 DM11 显示值为 0.035, 0.500。\n\
  \n图 12-7\n大小为 2 的项集的关联分析\n\n1.  我们需要构建另一个表格，根据我们的最小支持度值和最小置信度值来显示哪些项集是有效的。\n   \
  \ *   在单元格 DF2 中输入文本“支持度”，在单元格 DF3 中输入数字 0.03，在单元格 DF4 中输入文本“置信度”，在单元格 DF5 中输入数字\
  \ 0.5。\n\n*   在单元格 DH1 中输入“I1”，然后向右自动填充至单元格 FE1。\n\n*   在单元格 DG3 中输入“I1”，然后向下自动填充至单元格\
  \ DG52。\n\n将我们的表格设置与图 12-6 进行比较。\n\n![](img/494428_2_En_12_Fig6_HTML.jpg)\n\n一个电子表格，展示了\
  \ DC 列下 I50 的值列表，以及 DF 列下的支持度和置信度值。DG 列纵向排列了 I1 到 I13。DH 到 DN 列分别横向排列了 I1 到 I7。\n\
  \n图 12-6\n关联分析表格设置\n\n2.  在单元格 DH3 中输入以下公式，从 DH3 自动填充至 FE3，然后一起从单元格 DH3:FE3 自动填充至单元格\
  \ DH52:FE52：\n\n```\n    =IF($DG3=DH$1,\"\",IF(AND(BF$2>0,BF3/371>=$DF$3, BF3/BF$2>=$DF$5),TEXT(BF3/371,\"\
  0.000\") & \", \" &TEXT(BF3/BF$2,\"0.000\"),\"\"))\n    ```\n\n对于这个公式，我们需要理解以下几点：\n\
  \    1.  注意，单元格 DH3 引用的是项集 (DH1, DG3)，恰好是 (I1, I1)。类似地，单元格 DJ7 引用的是项集 (DJ1, DG7)，即项集\
  \ (I3, I5)。\n\n2.  如果 DG3 和 DH1 对应的是同一个商品（本例中正是如此），则无需计算支持度或置信度值。\n\n3.  `BF$2>0`\
  \ 是为了避免可能的“除以零”错误。\n\n4.  `BF3/371>=$DF$3` 是为了确保项集 (DH1, DG3) 的支持度值不小于最小支持度值。请注意，我在这里硬编码了收据数量\
  \ 371。更好的方法是使用单元格引用，即将收据数量存储在一个单元格中。稍后在“强化练习”中，您会注意到我将收据数量存储在了单元格中。\n\n5.  `BF3/BF$2>=$DF$5`\
  \ 是为了确保项集 (DH1, DG3) 的置信度值满足最小置信度要求。\n\n6.  AND 函数确保如果任何要求未满足，单元格 DH3 中不显示任何内容。\n\
  \n7.  TEXT 函数用于格式化结果。\n\n3.  将我们的结果与图 12-7 进行比较。调整最小支持度值和置信度值，以查看找到的项集的变化。\n\n最终结果可在\
  \ Chapter12-1b.xlsx 文件中找到。\n\n在第 13 步，我们也可以输入一个非常复杂的公式来生成如图 12-7 所示的关联分析结果。这样做的话，我们就不需要创建第三个表格了。打开\
  \ Chapter12-2b.xlsx 文件查看这个复杂公式。\n\n使用 Excel 对大小为 3 或更大的项集进行关联分析变得不切实际，这就是本章在此处结束的原因。请注意，当商品数量和交易数量很大时，关联分析的计算量可能非常大。\n\
  \n## 强化练习\n\n本章为您准备了一个练习。打开 Chapter12-HW.xlsx 文件；您会看到一些从在线零售数据集中提取并预处理过的数据，该数据集可从\
  \ UCI 机器学习库的 [`https://doi.org/10.24432/C5BW33`](https://doi.org/10.24432/C5BW33)\
  \ 下载。请查看图 12-8，这是数据的截图。\n\n![](img/494428_2_En_12_Fig8_HTML.jpg)\n\n一个电子表格，展示了发票号、数量和库存代码下的值列表。共有\
  \ 11 行，描述了发票号 1、2 和 3 的详细信息。\n\n图 12-8\n强化练习的数据\n\n当然，Chapter12-HW.xlsx 中的数据组织方式与\
  \ Chapter12-1a.xlsx 中的相同，只是数据名称不同。请记住将发票视为收据，将库存代码视为商品代码。文件 Chapter12-HW-withAnswers.xlsx\
  \ 包含我对这个练习的答案。请注意，在答案工作表中，不同发票的数量存储在单元格 D2 中，而不是硬编码在公式中。\n\n希望您喜欢这个练习。\n\n## 复习要点\n\
  \n1.  关联性及其潜在应用\n\n2.  商品与项集\n\n3.  最小支持度与最小置信度\n\n4.  函数 IF、AND、COUNTIFS、INDEX\
  \ 和 TEXT 以及运算符 &\n\n\n\n"
- "# 13. 人工神经网络\n\n一本没有人工神经网络的数据挖掘书籍是不完整的。顾名思义，人工神经网络模仿了人类神经元的架构和生物过程。在我们的大脑中，数百万个神经元协同工作，从各种输入中产生相应的输出。这种概念性的理解被用来开发人工神经网络方法，尽管神经元在生物学上如何协同工作仍需大量研究来阐明。\n\
  \n请从 [`https://github.com/hhohho/Learn-Data-Mining-through-Excel-2`](https://github.com/hhohho/Learn-Data-Mining-through-Excel-2)\
  \ 下载本章练习所需的示例 Excel 文件。\n\n## 总体理解\n\n尽管我们大脑神经元网络的生物架构和过程极其复杂，但神经网络数据挖掘方法却有着清晰的数学基础。在其最简单的形式中，人工神经网络是一个线性函数，类似于线性判别分析。它以属性的形式接收输入，并寻找属性的最优系数（或权重），以生成尽可能接近实验数据的输出。然而，神经网络可以比线性判别分析复杂和灵活得多。当然，它也可以是非线性的。神经网络真正的美妙之处在于它模仿了神经元的学习能力，即输出可以反馈作为输入，以进一步优化权重。\n\
  \n典型神经网络的架构具有多个层。第一层是输入层，最后一层是输出层。在这两层之间，可以有一个或多个隐藏层。进入某一层的数据是该特定层的输入；从该层输出的信息是该层的输出，但却是下一层的输入。在每个隐藏层，数据会经历某些处理动作，包括聚合和转换。图\
  \ 13-1 描绘了一个简单的神经网络架构。在此架构中，所有数据都会进入每一个节点。\n\n![](img/494428_2_En_13_Fig1_HTML.jpg)\n\
  \n一个人工神经网络。六个输入层节点连接到四个隐藏层节点，该过程以输出层结束。输出层被分类为三个类别，例如 1、2 和 3。\n\n图 13-1\n\n一个简单神经网络的示意图\n\
  \n隐藏层和输出层是活跃层，因为它们会聚合和转换数据。转换函数也称为激活函数。聚合函数可以是线性的或非线性的。两种最常用的激活函数是 Sigmoid 函数和修正线性单元函数，尽管还有其他激活函数，如钟形函数、逻辑函数等。Heaviside\
  \ 阶跃函数也经常被使用，因为它与神经元产生输出的方式非常相似：要么全有，要么全无。这些激活函数的一个共同特点是，它们都能提供线性变换，无论是针对所有数据还是仅针对特定范围的值。显然，这些激活函数可以通过将多维数据点映射到线性空间来简化数据。\n\
  \n公式 (6-2) 定义了其最简单形式的 Sigmoid 函数。让我们将其作为公式 (13-1) 再次回顾：\n\n![$$ S=\\frac{1}{1+{\\\
  mathrm{e}}^{-\\left({m}_1{x}_1+{m}_2{x}_2+\\cdots +{m}_n{x}_n+b\\right)}} $$](img/494428_2_En_13_Chapter_TeX_Equ1.png)\n\
  \n(13-1)\n\n图 13-2 显示了 Sigmoid 函数的图形。请注意，当输入趋向正无穷或负无穷时，Sigmoid 函数收敛于 1 或 -1。更重要的是，如果输入在\
  \ -1 和 1 之间，Sigmoid 函数可以将数据转换到线性空间。这就是为什么 Sigmoid 激活函数的数据输入通常被归一化到 -1 和 1 的范围，或者至少是\
  \ 0 和 1 的范围。\n\n![](img/494428_2_En_13_Fig2_HTML.jpg)\n\n两个图形说明了 Sigmoid 函数。该线大约从\
  \ -10 开始，保持稳定，然后对角穿过纵轴。它达到 1 后保持恒定。Sigmoid 函数描绘了 -1 和 1 之间的线性函数。\n\n图 13-2\n\nSigmoid\
  \ 函数在 -1 和 1 之间是线性的\n\n## 通过 Excel 学习神经网络\n\n本章我们将进行两个实验。第一个实验要简单得多，它可以帮助我们很好地理解神经网络的工作原理。第二个实验则能巩固并提升我们的理解。\n\
  \n\n\n### 实验 1\n\n打开 `Chapter13-1a.xlsx` 文件，其中包含从 UCI 机器学习库（[`https://doi.org/10.24432/C5HP4Z`](https://doi.org/10.24432/C5HP4Z)）下载的威斯康星州乳腺癌（原始）数据集。有关该数据集的详细信息，请访问\
  \ [`https://archive.ics.uci.edu/`](https://archive.ics.uci.edu/) 或阅读期刊文章（W.H. Wolberg\
  \ 和 O.L. Mangasarian：“用于医学诊断的乳腺细胞学模式分离多表面方法”，PNAS，1990，87:9193-9196）。\n\n原始数据包含十个属性和一个名为“Class”的目标变量。该目标变量有两个值：2\
  \ 表示良性乳腺癌，4 表示恶性乳腺癌。第一个属性是样本编码编号，已在 `Chapter13-1a.xlsx` 中移除。为简化起见，其余九个属性被重命名为 x1,\
  \ x2, …, x9。下载的数据集最初有 699 个样本。由于 16 个样本缺少一个属性，因此这 16 个样本已被移除。因此，在 `Chapter13-1a.xlsx`\
  \ 中，只有 683 个样本。\n\n其中 500 个样本用作训练数据集；其余 183 个样本将用作测试数据集，以评估我们的神经网络模型的性能。工作表顶部部分如图\
  \ 13-3 所示。\n\n![](img/494428_2_En_13_Fig3_HTML.jpg)\n\nExcel 工作表截图展示了乳腺癌数据集。\n\n\
  图 13-3\n\n从 UCI 下载的乳腺癌数据集\n\n在我们的第一个实验中，为简单起见，我们将只设置一个包含三个神经元（通常称为节点）的隐藏层，如单元格 A1:A4\
  \ 中所标记。权重 w1, w2, …, w9 是九个属性的权重（系数），而 `b` 是所谓的偏置，即线性函数中的截距。每个神经元都有自己的一组权重和偏置。注意，我们将使用线性聚合函数。`Wo`\
  \ 和 `Bo` 表示用于输出层的权重和偏置。如果此时感到困惑，不必担心。当这些数据被使用时，我会在每一步详细解释。\n\n请按照以下说明完成此实验：\n\n\
  ![](img/494428_2_En_13_Fig4_HTML.jpg)\n\nExcel 工作表截图包含权重和截距数据，其值均为 1。\n\n图 13-4\n\
  \n用 1 初始化权重和截距\n\n1.  第一个任务是为权重和截距赋值。我们将它们全部赋值为 1，如图 13-4 所示。\n\n1.  每个神经元将所有训练样本作为输入。训练样本存储在表格\
  \ B11:K510 中。对于样本 1（第 11 行），其所有属性值分别在神经元 1、2 和 3 内部聚合成一个单一值。因此，我们需要在单元格 L11 中输入以下公式：\n\
  \n```\n    =SUMPRODUCT($B11:$J11,INDEX($B$2:$J$4,L$10,0))+INDEX($K$2:$K$4,L$10,1)\n\
  \    ```\n\n该公式实现了线性表达式 w1x1 + w2x2 + w3x3 + … + b。在此特定公式中，w1, w2, w3… 和 `b` 对应于神经元\
  \ 1（B2:K2），而 x1, x2, x3, … 对应于第 11 行的第一个数据点。\n\n函数 SUMPRODUCT 用于计算两个数组（B11:J11 和\
  \ B2:J2）的乘积之和。我们可以将函数写为 `SUMPRODUCT($B11:$J11,$B$2:$J$2)`。然而，我们希望在不重复编写公式的情况下，从\
  \ L11 自动填充到 N11。因此，应用了 `INDEX($B$2:$J$4,L$10,0)`，以根据单元格 L10 中的值获取数组 B2:J2。由于 L10\
  \ = 1，`INDEX($B$2:$J$4,L$10,0)` 从表格 B2:J4 中提取第一行。\n\n`INDEX($K$2:$K$4,L$10,1)` 获取单元格\
  \ K2 中的值，即偏置。注意，数组 K2:K4 只有一列；这就是 INDEX 函数中最后一个参数为 1 的原因。\n\n2.  从 L11 自动填充到 N11，然后一起自动填充到\
  \ L510:N510。工作表的部分内容如图 13-5 所示。检查单元格 M11 内的公式。由于 M10 = 2，聚合函数使用了神经元 2 的系数。\n\n\n\
  \n这一步可以理解为输入层。\n\n![](img/494428_2_En_13_Fig5_HTML.jpg)\n\n一张 Excel 表格的截图，其中包含权重和截距数据。经过聚合函数处理后，神经元的加权和得到更新。\n\
  \n图 13-5\n应用聚合函数\n\n如前所述，在聚合函数之后，需要应用激活函数（Sigmoid 函数）来启动隐藏层。然而，由于 Sigmoid 函数倾向于将其输入数据归一化到\
  \ -1 到 1 或 0 到 1 之间，我们需要对 L、M 和 N 列中的值进行归一化。由于此时所有值均为正数，我们只需将这些值归一化到 0 到 1 的范围内。\n\
  \n3.  在单元格 K6 中输入“MAX”，在单元格 K7 中输入“MIN”。\n\n4.  在单元格 L6 中输入公式 `=MAX(L11:L510)`，在单元格\
  \ L7 中输入公式 `=MIN(L11:L510)`。\n\n5.  选中单元格 L6 和 L7，然后自动填充至 N6:N7，如图 13-6 所示。\n\n\
  6.  此外，合并单元格 O9:Q9，在合并后的单元格中输入文本“归一化”，并分别在单元格 O10、P10 和 Q10 中输入 1、2 和 3。归一化后的加权和将分别存储在\
  \ O、P 和 Q 列中。\n\n将我们的工作表与图 13-6 进行比较。如果发现 L、M 和 N 列中的数字相同，不必惊讶。\n\n![](img/494428_2_En_13_Fig6_HTML.jpg)\n\
  \n一张 Excel 表格的截图，其中包含权重和截距数据。单元格 L6 和 L7 已被选中。归一化后的加权和分别位于 O、P 和 Q 列。\n\n图 13-6\n\
  准备归一化数据\n\n1.  在单元格 O11 中输入公式 `=(L11-L$7)/(L$6-L$7)`。此公式将单元格 L11 中的值归一化到 0 到 1 之间（包含端点）。\n\
  \n2.  从 O11 自动填充至 Q11，然后一起自动填充至 O510:Q510。如果发现 O、P 和 Q 列中的数字相同，不必惊讶。请注意，当 L6（最大值）等于\
  \ L7（最小值）时，公式 `=(L11-L$7)/(L$6-L$7)` 会导致错误。不过，这种情况不应发生。如果确实发生了，则意味着该属性没有方差，应予以移除。\n\
  \n3.  是时候通过 Sigmoid 函数转换归一化数据了。合并单元格 R9、S9 和 T9。在合并后的单元格中输入“Sigmoid 转换”。在单元格 R10、S10\
  \ 和 T10 中分别输入数字 1、2 和 3。工作表的一部分看起来如图 13-7 所示。\n\n![](img/494428_2_En_13_Fig7_HTML.jpg)\n\
  \n一张 Excel 表格，包含权重和截距数据。归一化列和 Sigmoid 转换列已被高亮显示。\n\n图 13-7\n归一化之后，Sigmoid 转换之前\n\
  \n![](img/494428_2_En_13_Fig8_HTML.jpg)\n\n一张 Excel 电子表格，包含神经元加权和、归一化值、Sigmoid 转换值、输出值和误差值。\n\
  \n图 13-8\n准备生成输出并计算误差\n\n1.  基于公式 (11-1)，在单元格 R11 中输入公式 `=1/(1+EXP(-O11))`。\n\n\
  2.  从 R11 自动填充至 T11，然后一起自动填充至 R510:T510。\n\n3.  在单元格 U10 和 V10 中，分别输入“输出”和“误差”。至此，工作表的一部分看起来与图\
  \ 13-8 完全一致。\n\n![](img/494428_2_En_13_Fig9_HTML.jpg)\n\n一张 Excel 电子表格，包含生成的输出和计算出的误差。误差总和等于\
  \ 314.828。\n\n图 13-9\n输出已生成，误差已计算\n\n1.  输出是另一个聚合函数，使用了单元格 L2:L4 中的 `Wo` 值和单元格 M2\
  \ 中的 `Bo` 值。在单元格 U11 中，输入以下公式：\n\n```\n    =MMULT(R11:T11,$L$2:$L$4)+$M$2\n    ```\n\
  \n请注意，函数 SUMPRODUCT 不适用于数组 R11:T11 和 L2:L4。这是因为 R11:T11 类似于一行，而 L2:L4 类似于一列。然而，函数\
  \ MMULT（矩阵乘法）非常适合这种类型的数组乘法。注意单元格 M3 和 M4 未被使用。\n\n2.  从单元格 U11 自动填充至单元格 U510。\n\n\
  3.  在单元格 V11 中，输入公式 `=(U11-K11)²`，该公式计算输出 U11 与原始类别值 K11 之差的平方。我们之前已经在误差计算中见过平方的用法。对差值进行平方的一个原因是使误差为正。\n\
  \n4.  从单元格 V11 自动填充至单元格 V510。\n\n在神经网络中，我们需要搜索权重 w1, w2, …, w9、`Wo`、`b` 和 `Bo` 的最优值，以使误差总和最小化。\n\
  \n5.  在单元格 P1 中输入“误差总和”。\n\n6.  在单元格 Q1 中输入公式 `=SUM(V11:V510)`。\n\n将我们的结果与图 13-9\
  \ 进行比较。\n\n![](img/494428_2_En_13_Fig10_HTML.jpg)\n\n规划求解参数窗口的截图。它包含以下字段：设置目标、通过更改可变单元格、遵守约束、选择求解方法。\n\
  \n图 13-10\n使用规划求解寻找最优参数\n\n1.  我们需要再次使用规划求解来寻找最优的权重和偏置。点击“数据”➤“规划求解”；按照图 13-10 设置规划求解的单元格范围。\n\
  \n2.  勾选“使无约束变量为非负数”。如果取消勾选，结果可能会不同（可能更好）。在本实验中，我们勾选它。\n\n规划求解可能需要一些时间来完成最优参数搜索。一旦规划求解完成其工作，我们的工作表应如图\
  \ 13-11 所示。\n\n![](img/494428_2_En_13_Fig11_HTML.jpg)\n\n一张 Excel 表格，展示了神经网络的最优参数搜索。\n\
  \n图 13-11\n规划求解为具有一个隐藏层的神经网络找到最优参数\n\n有了优化后的权重和偏置，我们的下一个任务是找到一个阈值来区分良性和恶性类别。在神经网络中，通常使用\
  \ Softmax 函数（用于多分类）或 Sigmoid 函数（用于二分类）来计算输出层中每个类别的概率。这需要相当大的努力来计算交叉熵。为简单起见，在我们的实验中，我们直接找到一个阈值来完成输出层。按照以下说明计算阈值：\n\
  \n![](img/494428_2_En_13_Fig13_HTML.jpg)\n\n一张 Excel 表格，包含预测测试样本的计算。W 列和 X 列已被高亮显示。\n\
  \n图 13-13\n使用测试数据集评估神经网络模型\n\n1.  在单元格 P6 和 P7 中分别输入“平均值”和“计数”。\n\n2.  在单元格 Q5 和\
  \ R5 中分别输入数字 2 和 4，在单元格 S5 和 T5 中分别输入“阈值”和“遗漏数”。\n\n3.  在单元格 Q6 中输入公式 `=AVERAGEIFS($U11:$U510,$K11:$K510,Q5)`。此公式计算良性类别的平均输出值。\n\
  \n4.  从 Q6 自动填充至 R6。\n\n5.  在单元格 Q7 中输入公式 `=COUNTIFS($K11:$K510,Q5)`。此公式计算训练数据集中良性类别的数量。\n\
  \n6.  从 Q7 自动填充至 R7。\n\n7.  在单元格 S6 中输入公式 `=(Q6*Q7+R6*R7)/500`。这是区分类别 2 和 4（良性和恶性）的阈值。\n\
  \n工作表的一部分看起来如图 13-12 所示。\n\n![](img/494428_2_En_13_Fig12_HTML.jpg)\n\n一张 Excel 表格，展示了用于区分类别\
  \ 2 和 4 的阈值数据。\n\n图 13-12\n为具有一个隐藏层的神经网络模型计算出的阈值\n\n现在是时候用测试数据集评估我们的神经网络模型了（再次注意，这个模型只是一组优化后的参数）。按照以下说明操作：\n\
  \n8.  选中单元格 L510:U510；将它们一起向下自动填充至单元格 L693:U693。\n\n9.  在单元格 W10 和 X10 中分别输入“预测”和“差异”。\n\
  \n10. 在单元格 W11 中输入公式 `=IF(U11<=$S$6,2,4)`；从 W11 自动填充至 W693。\n\n11. 在单元格 X11 中输入公式\
  \ `=IF(K11=W11,0,1)`；从 X11 自动填充至 X693。\n\n\n\n12.  在单元格 T6 中输入公式 `=SUM(X511:X693)`。T6\
  \ 中的数字表示我们的神经网络模型未能正确预测的测试样本数量。请注意，此公式中的单元格范围是 X511:X693。\n\n我们的工作表部分内容与图 13-13\
  \ 完全一致。在 183 个测试样本中，有 5 个未能正确预测，准确率为 97.3%。你可以在 Chapter13-1b..xlsx 文件中找到完整结果。\n\n\
  对于这个特定的乳腺癌数据集，良性和恶性类别均能通过这九个属性得到很好的表征。区分这两个类别并不困难。上述 Excel 分步操作指南的目的是剖析神经网络建模过程，让我们清晰地了解一个简单的神经网络模型是如何工作的。\n\
  \n如 Q7:R7 所示，目标类别的分布并不十分均衡。由于我们没有平衡目标类别的分布，因此有必要检查我们的模型在准确预测代表性不足的类别（即 4）方面的表现如何。稍加分析即可证实，我们的模型预测代表性不足类别的准确率为\
  \ 94.6%，这是一个相当不错的性能。\n\n### 实验 2\n\n让我们开始另一个实验，这次我们将构建一个包含两个隐藏层的神经网络。每个隐藏层仍然有三个神经元。当存在多个隐藏层时，这种神经网络通常被称为深度学习。请注意，真正的深度学习通常包含两个以上的隐藏层和更多的神经元。\n\
  \n打开文件 Chapter13-2a.xlsx。其中的数据是短发夹 RNA (shRNA) 功效预测的实验结果。这些数据经过预处理和简化。共有四个属性用于预测目标类别，该类别有三个不同的值：39\
  \ = 低功效，69 = 中功效，84 = 高功效。第 11–182 行是训练数据集，而第 183–190 行是评分数据集。工作表的设置如图 13-14 所示。请注意，不同的神经元以不同的权重和偏置开始。W21、W22、W23\
