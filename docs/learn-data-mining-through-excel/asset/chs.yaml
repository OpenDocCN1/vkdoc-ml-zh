  \ 1 和 97.87%。\n\n图 5-5\n使用测试数据集进行交叉验证\n\n完整结果可在文件 `Chapter5-cv-1b.xlsx` 中找到。\n\n\
  请记住，在交叉验证中，仅使用原始训练数据集的一部分来构建模型，而其余部分则用于测试模型性能。一旦确认数据挖掘方法（例如 LDA）具有可接受的性能，最好基于整个原始训练数据集，使用\
  \ LDA 方法生成最终模型（或参数集）。\n\n## ROC 分析概述\n\n受试者工作特征（ROC）曲线分析是另一种常用的评估模型性能的方法。与交叉验证不同，ROC\
  \ 分析仅适用于目标变量恰好有两个不同值的情况，例如真与假，或阳性与阴性。因此，ROC 分析不能用于评估前述的鸢尾花数据集 LDA 模型。\n\nROC 分析广泛应用于生物医学模型评估中，其中诊断测试必须确定样本对于某种疾病是阳性还是阴性。以下场景有助于解释\
  \ ROC 分析的应用。\n\n假设我们的研究发现某些血液特征与识别某种特定疾病有很好的相关性。我们将这些特征命名为 C1、C2、C3 和 C4，将疾病命名为\
  \ D。我们基于 C1、C2、C3 和 C4 开发了一个 LDA 模型，用于判断患者是否患有该疾病。一个完美的模型能够在大量人群中清晰地区分患病组和未患病组。不幸的是，由于分类错误，现实中并不存在清晰的区分。在患病组中，有些人被正确分类为阳性（真阳性，或\
  \ TP），而有些人被错误分类为阴性（假阴性，或 FN）。类似地，在未患病组中，有些人被正确分类为阴性（真阴性，或 TN），而有些人被错误分类为阳性（假阳性，或\
  \ FP）。通过调整分界点或其他相关的评估指标，TP、FN、FP 和 TN 的数量会发生变化。\n\n以下概念对于理解和应用 ROC 分析至关重要：\n\n*\
  \   **灵敏度** 是指当疾病存在时，测试结果为阳性的概率。它也被称为真阳性率，定义为 TP / (TP + FN)。它仅衡量测试能够正确分类的患病个体的百分比。\n\
  \n*   **特异度** 是指当疾病不存在时，测试结果为阴性的概率。它也被称为真阴性率，计算公式为 TN / (TN + FP)。它仅衡量测试能够正确分类的未患病个体的百分比。\n\
  \n*   **假阳性率** 是指当疾病不存在时，测试结果为阳性的概率。假阳性率 = 1 - 特异度。\n\n*   **阳性预测值** 是指当测试结果为阳性时，疾病存在的概率，表示为\
  \ TP / (TP + FP)。\n\n*   **阴性预测值** 是指当测试结果为阴性时，疾病不存在的概率，表示为 TN / (TN + FN)。\n\n\
  考虑一种极端情况：测试将每个个体都判定为阳性。在这种情况下，FN = 0 且 TN = 0，特异度 = 0，但灵敏度 = 100%。\n\n在另一种极端情况下，当测试将每个个体都判定为阴性时，特异度\
  \ = 100%，而灵敏度 = 0。\n\n通过调整分界点，灵敏度和特异度都会发生变化。在大多数情况下，我们会观察到当灵敏度上升时，特异度会下降。一个好的模型会有一个分界点，使得灵敏度和特异度都保持较高水平。然而，某些测试可能更强调高阳性预测值或高阴性预测值。\n\
  \n\n\n## 通过 Excel 学习 ROC 分析\n\n文件 `Chapter5-roc-1a.xlsx` 中的数据是模拟的。在该文件中，TP、FN、FP\
  \ 和 TN 会随着不同截断值的变化而变化，如图 5-6 所示。虽然文件中有 19 条记录，但图 5-6 仅显示了 11 条记录。第 8 至 15 行被隐藏了。\n\
  \n![](img/494428_2_En_5_Fig6_HTML.jpg)\n\n电子表格展示了真阳性、假阴性、假阳性、真阴性和截断值下的一组数值。在第 7\
  \ 行处画了一条线。截断值的范围是从 1 到 7，步长为 0.5。\n\n图 5-6\n\nChapter5-roc-1a.xlsx 训练数据集\n\n我们想要绘制一张图表，以观察敏感度和特异度如何随不同截断值而变化。请遵循以下说明：\n\
  \n1.  分别在单元格 F2 和 G2 中输入“敏感度”和“特异度”。\n\n2.  在单元格 F3 中，输入公式 `=A3/(A3+B3)`。此公式计算截断值\
  \ = 1 时的敏感度。从 F3 自动填充到 F21。\n\n3.  在单元格 G3 中，输入公式 `=D3/(C3+D3)`。此公式计算截断值 = 1 时的特异度。从\
  \ G3 自动填充到 G21。\n\n4.  选中单元格区域 E2:G21；点击菜单选项卡“插入”➤“图表”➤ 选择“带平滑线和数据标记的散点图”。工作表中会出现一个散点图。\n\
  \n5.  我们可以根据需要添加坐标轴标题和图表标题。默认情况下，垂直轴的最大边界值为 1.2。我更喜欢将其设置为 1.0，因此我双击数值 1.2，然后在弹出的“坐标轴选项”菜单中将其更改为\
  \ 1.0。\n\n我们的图表可能类似于图 5-7（包含相关数据）。请注意，两条曲线在某一点相交。该交点标记了一个截断值，在此值下敏感度等于特异度。\n\n![](img/494428_2_En_5_Fig7_HTML.jpg)\n\
  \n电子表格展示了截断值、敏感度和特异度下的一系列数值。折线图表示敏感度和特异度相对于截断点的百分比。敏感度呈下降趋势，特异度呈上升趋势。两者在中间相交。\n\n\
  图 5-7\n\n敏感度/特异度 vs. 截断值\n\n下一步是绘制 ROC 曲线。ROC 曲线是以假阳性率为横轴、真阳性率为纵轴绘制的，即 1-特异度 vs.\
  \ 敏感度。为了更易于查看，所有数值都乘以了 100。因此，ROC 曲线实际上是 (100-100*特异度) vs. (100*敏感度)。\n\n在 ROC 曲线图中，X\
  \ 轴是 100-特异度。因此，特异度值应按降序排列。由于当前的特异度值是升序排列的，我们需要将特异度值翻转。相应地，我们也需要翻转敏感度值。继续遵循以下说明：\n\
  \n6.  选中单元格区域 E2:G21；使用“选择性粘贴”将数值仅粘贴到单元格 A25。\n\n7.  选中单元格区域 A25:C44；点击菜单选项卡“数据”➤“排序”。\n\
  \n8.  在弹出的菜单中，按“截断值”排序，顺序为“从大到小”，如图 5-8 所示。确保勾选“数据包含标题”。点击“确定”。\n\n![](img/494428_2_En_5_Fig8_HTML.jpg)\n\
  \n一个标题为“排序”的对话框截图。它展示了按列名“截断值”根据单元格数值从大到小排序的选项。\n\n图 5-8\n\n按截断值排序数据\n\n我们工作表的一部分看起来像图\
  \ 5-9。\n\nExcel 可以仅对选中的单元格进行排序，同时保持其他所有单元格不变。这是 Excel 的一个强大功能。如果待排序的单元格包含引用排序区域外其他单元格的公式，排序可能会打乱某些计算。这就是为什么我们需要先按值复制\
  \ E2:G21，然后再对复制的值进行排序。\n\n![](img/494428_2_En_5_Fig9_HTML.jpg)\n\n一个电子表格截图，展示了截断值、敏感度和特异度下的一系列数值。截断值范围从\
  \ 1 到 10，间隔为 0.5。数值按降序排列。\n\n图 5-9\n\n翻转后的数据\n\n我们还需要对数据进行缩放。继续遵循以下说明：\n\n9.  在单元格\
  \ D25 中输入“100-特异度”，在单元格 E25 中输入“敏感度”。\n\n10. 在单元格 D26 中，输入公式 `=100-ROUND(C26*100,0)`。此公式将现有的特异度值乘以\
  \ 100，进行四舍五入，然后用 100 减去该结果。\n\n11. 从单元格 D26 自动填充到 D44。\n\n12. 在单元格 E26 中，输入公式 `=ROUND(100*B26,0)`。\n\
  \n13. 从单元格 E26 自动填充到 E44。\n\n14. 右键单击行号 26，选择“插入”。此操作会插入一个空白行。原来的单元格 D26 现在变成了 D27。\n\
  \n15. 在单元格 D26 和 E26 中都输入 0。\n\n我们工作表的一部分应该看起来像图 5-10。\n\n![](img/494428_2_En_5_Fig10_HTML.jpg)\n\
  \n一个电子表格展示了截断值、敏感度、特异度、100-特异度和敏感度的一系列数值。从下到上，截断值范围从 5 到 10，间隔为 0.5。\n\n图 5-10\n\
  \n为 ROC 曲线设置数据\n\n现在是绘制 ROC 曲线的最后一步：\n\n16. 选中单元格区域 D25:E45。\n\n17. 点击菜单选项卡“插入”➤“图表”➤“带平滑线的散点图”。\n\
  \n18. 根据需要添加图表标题和坐标轴标题。我们的 ROC 图表可能类似于图 5-11。\n\n![](img/494428_2_En_5_Fig11_HTML.png)\n\
  \n一条敏感度相对于 100-特异度的 ROC 曲线，呈上升趋势。曲线从原点开始，大致延伸到 (95, 91) 点。\n\n图 5-11\n\nROC 曲线\n\
  \nROC 曲线下面积的大小衡量了模型的质量。面积值越大，表明模型可以同时具有良好的敏感度和特异度。在一个完美模型中，敏感度和特异度都是 100%。这意味着，当\
  \ 100-特异度等于 0 时，敏感度为 100%。换句话说，一个完美模型的 ROC 曲线会经过左上角点。然而，这种情况很少发生。\n\n文件 `Chapter5-roc-1b.xlsx`\
  \ 展示了前述练习的结果。\n\n本章到此结束。为什么我们需要在学习其他数据挖掘方法之前先学习交叉验证和 ROC 呢？嗯，一旦我们掌握了交叉验证和 ROC 的知识，我们就可以在学习其他数据挖掘方法时实践它们。本章之后，我们将学习逻辑回归、K-近邻、朴素贝叶斯、决策树等。在某个时候，我们可能想要评估我们的模型有多好，那时我们就可以实践交叉验证和/或\
  \ ROC 曲线分析了。\n\n## 强化练习\n\n本章有两个强化练习，一个关于交叉验证，一个关于 ROC 曲线分析。建议将两个练习都完成以巩固你的理解。你应该能找到这两个强化练习对应的四个\
