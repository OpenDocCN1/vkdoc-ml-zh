  \ J 列中的预测结果与 G 列中的实际结果匹配，则返回 0；否则返回 1。\n\n10. 从单元格 K6 自动填充至单元格 K92。\n\n11. 在单元格\
  \ J2 中输入“总差异=”，并在单元格 K2 中输入公式 `=SUM(K6:K92)`。通过统计数组 K6:K92 中 1 的个数，我们可以知道有多少预测与实际结果不匹配。\n\
