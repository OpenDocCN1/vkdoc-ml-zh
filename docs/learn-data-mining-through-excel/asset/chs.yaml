  \n### 一种更好的方法\n\n还记得当我们从步骤 31 开始拆分节点 rainy(3,2) 时，需要修改工作表 level-2-rainy 中的一些公式吗？还有另一种非常相似但无需修改任何公式的方法。该方法在文件\
  \ Chapter10-2b.xlsx 中提供。这种方法更灵活、更好，但关键公式稍微复杂一些。这也是我一开始没有介绍它的原因之一。此外，在我们对 Excel 中的决策树分析有了清晰思路之后，再介绍这种方法，能让我们更欣赏它。请按照以下说明操作：\n\
  \n1.  打开 Chapter10-2a.xlsx。其中只有一个名为“level-1”的工作表，该工作表与文件 Chapter10-1b.xlsx（我们之前处理过的那个）中的工作表\
