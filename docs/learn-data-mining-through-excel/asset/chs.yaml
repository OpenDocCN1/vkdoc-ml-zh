  \ 2 个单位。\n10.  向左转，停在字母 C 的上方。\n11.  向上移动 1 个单位到高度 3。\n\n到目前为止，我们应该已经明白，我们的笔有些路径走了两次。没错，这就是诀窍。如果我们将这些笔的移动轨迹转换成\
