  \    ```\n\n此公式计算各组均值之间的方差，即公式(4-1)中所示的 Sg。该值越大，表示各组之间的可分离性越高。注意，单元格 K12、K13 和 K14\
  \ 引用的是组内均值。\n\n3.  在计算组内方差之前，我们必须先计算每个数据点在其所属组内的方差。在单元格 J1 中输入“组内方差”，然后在单元格 J2 中输入以下公式：\n\
