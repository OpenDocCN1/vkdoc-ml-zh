  \ 概览\n\n\n\n### 应用模型\n\n决策树既是分类模型，也是预测模型。我们构建决策树模型是为了预测未来事件的类别。打开 `Chapter10-3a.xlsx`\
  \ 文件；数据表如图 10-22 所示。\n\n![](img/494428_2_En_10_Fig22_HTML.jpg)\n\n一张 Excel 截图，包含\
  \ A 到 G 列以及第 1 到 21 行。列标题为：温度、湿度、风力、天气、是否打球和概率。部分包含数据的单元格有：D17 为“天气”，B19 为“雨天 (3,\
  \ 2)”，D19 为“阴天 (4, 0)”，D19 为“晴天 (2, 3)”。\n\n图 10-22\n\n基于决策树模型对未来事件的预测\n\n表中的数据是随机生成的。我们的任务是基于图\
  \ 10-22 所示的决策树模型，预测“是否打球”的决策。该决策树是一个基于规则的模型，最适合使用 IF 函数进行编程实现。\n\n![](img/494428_2_En_10_Fig23_HTML.jpg)\n\
  \n一张计算了决策树概率的 Excel 截图。它包含 A 到 E 列以及第 1 到 14 行。列标题为：温度、湿度、风力、天气、是否打球和概率。每个单元格都包含数据。\n\
  \n图 10-23\n\n计算出的决策树概率\n\n1.  在单元格 E2 中输入以下公式，并从单元格 E2 自动填充到单元格 E15：\n\n    ```\n\
  \    =IF(D2=\"overcast\",\"yes\", IF(D2=\"rainy\",IF(C2=\"TRUE\",\"no\",\"yes\"\
  ), IF(B2=\"high\",\"no\",\"yes\")))\n    ```\n\n    此公式实现了我们简单的决策树规则。\n\n2.  在单元格\
  \ F2 中输入以下公式：\n\n    ```\n    =IF(D2=\"overcast\",4/4, IF(D2=\"rainy\",IF(C2=\"\
  TRUE\",2/2,3/3), IF(B2=\"high\",3/3,2/2)))\n    ```\n\n    此公式计算每个“是否打球”类别的概率。每个“是否打球”类别的概率是基于每个叶节点内的数字计算的。例如，如果天气为阴天，叶节点有\
  \ 4 个“是”和 0 个“否”；因此概率为 4/4 = 1。假设天气为晴天且湿度为高，由于对应的叶节点有 0 个“是”和 3 个“否”，则“否”的概率为 3/3\
  \ = 1。我们的数据量非常小，这使得每个叶节点只包含一个类别的数据。这就是如图 10-23 所示所有概率值都为 1 的原因。\n\n    请注意，我们在上述公式中使用了实际数字而不是单元格引用。这是为了更好的演示效果。\n\
  \n在我看来，仅基于每个叶节点内的数字来计算概率是有争议的。然而，这不是本书要讨论的主题。完整的预测结果可以在文件 `Chapter10-3b.xlsx` 中找到，该文件包含一个额外的工作表，用于演示目的而随机化输入数据。\n\
  \n本章到此结束。决策树方法的一个关键部分是模型的可视化。当然，Excel 并不适合绘制自定义的决策树图形。尽管如此，本章展示了 Excel 能够进行决策树分析。\n\
  \n## 强化练习\n\n虽然之前使用的数据集很适合演示，但它非常小，不适用于实际应用。对于本章的强化练习，我们将再次使用汽车评估数据集（Bohanec, Marko.\
  \ 1997. Car Evaluation. UCI Machine Learning Repository. [`https://doi.org/10.24432/C5JP48`](https://doi.org/10.24432/C5JP48)）。请打开文件\
  \ `Chapter10-HW.xlsx` 来练习决策树数据挖掘方法。当你需要帮助时，可以参考 `Chapter10-HW-withAnswers.xlsx`。\n\
  \n## 复习要点\n\n1.  熵、信息增益和增益率\n\n2.  设置辅助表\n\n3.  函数 IF、COUNTIFS、SUMIFS 和 INDEX\n\n\
  4.  函数 LOG 和 IFERROR\n\n5.  运算符 <>\n\n6.  复制工作表以继续树节点分裂\n\n"
- "# 11. 探索性数据分析、数据清洗与特征选择\n\n探索性数据分析（EDA）和数据清洗通常是传统数据挖掘课程中的前两个主题。因此，很自然会问为什么我把它们放在第\
  \ 11 章。\n\n当我开始自学数据挖掘时，我读的第一本书确实将这两个主题放在了前三章。那时，我完全不知道数据挖掘方法是如何工作的，并且渴望学习其中的奥秘。我不高兴的是，在读完前三章后，我仍然不知道典型的数据挖掘方法是什么，更不用说它们是如何工作的了。直到我读完整本书，我才开始体会到\
  \ EDA 和数据清洗的必要性。后来，通过我自己在机器学习方面的实践和研究，我认识到了特征选择的重要性。现在你已经积累了一些关于数据挖掘方法的知识，是时候对 EDA、数据清洗和特征选择这三个在构建数据挖掘模型之前应该执行的任务有所了解了。\n\
  \n请从 [`https://github.com/hhohho/Learn-Data-Mining-through-Excel-2`](https://github.com/hhohho/Learn-Data-Mining-through-Excel-2)\
  \ 下载本章练习所需的示例 Excel 文件。\n\n\n\n## 通过 Excel 学习探索性数据分析\n\n一个典型的数据挖掘项目通常从业务理解和数据理解开始，因为我们需要清楚要解决什么问题以及需要哪些数据。下一个阶段是数据准备，在此阶段我们收集和准备数据。正是在数据准备阶段，我们进行探索性数据分析和数据清洗任务。\n\
  \n关键词“探索性”表明 EDA 指的是初步调查，以便我们了解关于数据的以下信息：\n\n*   记录数量\n*   属性数量\n*   每个属性的数据类型\n\
  *   每个数值属性的总和、均值、中位数和方差\n*   每个数值属性的取值范围\n*   分类目标和属性的唯一值\n*   目标的类别分布\n*   是否存在缺失数据\n\
  *   数据异常等\n\nExcel 非常适合进行 EDA，因为工作表中的数据直接可见，并且 Excel 拥有许多函数和内置功能，可以轻松完成汇总统计操作和异常检测。请打开\
  \ Chapter11-1a.xlsx，该文件展示了由 Chiharu Sano 贡献给 UCI 机器学习仓库的一个数据集。你会注意到，在名为“crx”的工作表中，有\
  \ 15 个属性和一个目标变量，如图 11-1 所示。\n\n![](img/494428_2_En_11_Fig1_HTML.jpg)\n\n一个 Excel\
  \ 工作表包含 15 个属性和一个目标变量。\n\n图 11-1\n\nExcel 提供了数据集的直接可视化视图\n\n让我们在此工作表中逐一完成前面列出的探索性操作。\n\
  \n1.  **记录数量：**\n\n由于数据集在 Excel 中，你可以轻松滚动到底部，发现共有 691-1 = 690 条记录。如果数据集规模过大，你可以在单元格\
  \ Q2 中输入公式 `=COUNTA(P:P) - 1` 来获取记录数量。COUNTA 函数用于计算一个区域中非空单元格的数量。由于属性内部可能存在空单元格，因此统计目标值的数量是确认记录数量的可靠方法。\n\
  \n2.  **属性数量：**\n\n由于 Excel 允许我们直接查看数据，我们可以轻松判断 Excel 工作表中数据集的属性数量。如果你想使用公式，请在单元格\
  \ Q1 中输入 `=COUNTA(A1:P1)`。因此，共有 15 个属性和一个目标（标签）。\n\n3.  **每个属性的数据类型：**\n\n通过 Excel\
  \ 工作表，我们可以直观地看出属性 A1、A4–A7、A9、A10、A12 和 A13 以及目标变量是分类文本数据，而 A2、A3、A8、A11、A14 和 A15\
  \ 是数值数据。\n\n4.  **每个数值属性的总和、均值、中位数和方差：**\n\n当然，我们可以对列 A2、A3、A8、A11、A14 和 A15 应用\
  \ SUM、AVERAGE 和 MEDIAN 函数来获取它们的总和、均值和中位数。这里无需演示如何实现。\n\n对于这些数值属性的方差，我们需要应用 VAR.P\
  \ 函数，该函数计算总体方差。总体方差的计算公式为 ![$$ \\frac{\\sum \\limits_{i=1}^n{\\left({x}_i-\\overline{x}\\\
  right)}²}{n} $$](img/494428_2_En_11_Chapter_TeX_IEq1.png)。由于只有 690 条记录，我们可以滚动到工作表底部，在单元格\
  \ A692 中输入公式 `=IFERROR(VAR.P(A2:A691), \"\")`，然后自动填充到单元格 O692。使用 IFERROR 函数是为了处理非数值属性。注意，如果记录数量很大，我们当然可以在属性名称上方插入一行来计算和存储方差。此时，工作表的一部分应如图\
  \ 11-2 所示。注意，单词“Variance”已添加到单元格 Q692 中，以标记第 692 行。\n\n![](img/494428_2_En_11_Fig2_HTML.jpg)\n\
  \nExcel 工作表的截图展示了第 692 行中的数值属性方差。\n\n图 11-2\n\n数值属性的方差存储在第 692 行\n\n默认情况下，方差并非在同一尺度上计算，因此你会注意到属性\
  \ A15 的方差最大。有时，方差是在所有属性归一化到相同范围后计算的。我将在解释特征选择时详细讨论归一化问题。这里，让我们将所有数值属性归一化到 0–100\
  \ 的范围。\n\n为了在 0–100 的相同尺度上计算方差，让我们复制当前工作表并将新工作表重命名为 crx2。在 crx2 工作表的单元格 A2 中，输入以下公式：\n\
  \n```\n    =IFERROR((crx!A2-MIN(crx!A$2:A$691))/(MAX(crx!A$2:A$691)-MIN(crx!A$2:A$691))*100,\
  \ crx!A2)\n    ```\n\n此公式在处理 crx 工作表中的相应数据项后，将其放入单元格 A2。IFERROR 函数确保如果列 A 的数据不是数值，则会出错，因此\
  \ crx!A2 处的数据将直接放入单元格 A2 而不进行归一化。如果列 A 的数据是数值，则它将 crx!A2 中的数据值归一化到 0–100 的闭区间内。\n\
  \n从 A2 自动填充到 O2，然后一起自动填充到 A691:O691，我们将得到归一化数据的方差，这表明最大的方差在属性 A2 中。crx2 工作表的一部分应如图\
  \ 11-3 所示。\n\n![](img/494428_2_En_11_Fig3_HTML.jpg)\n\n一个 Excel 电子表格，显示了数值属性归一化后的方差。\n\
  \n图 11-3\n\n数值属性归一化到 0–100 范围后的方差\n\n5.  **每个数值属性的取值范围：**\n\n取值范围通常表示数值属性的最大值和最小值。我们可以应用\
  \ Excel 函数 MAX 和 MIN 来获取每个数值属性的最大值和最小值。取值范围有助于识别异常值和数据异常。\n\n6.  **分类目标和属性的唯一值：**\n\
  \n要获取分类属性的唯一值，我们可以利用 Excel 的内置功能“删除重复项”。在为每个分类属性删除重复项之前，最好先复制 crx 工作表并将新工作表重命名为\
  \ crx3。\n\n在 crx3 工作表中，请点击列字母 G ➤ 点击“数据”选项卡 ➤ 选择“删除重复项” ➤ 在弹出的菜单中，选择“以当前选定区域排序”选项，然后点击“删除重复项…”按钮。如图\
  \ 11-4 所示。\n\n![](img/494428_2_En_11_Fig4_HTML.jpg)\n\n一个 Excel 电子表格解释了如何打开删除重复项警告窗口。步骤如下：数据、列\
  \ G、删除重复项，然后选择适当的选项。\n\n图 11-4\n\n选择“删除重复项”\n\n另一个小菜单出现。按照图 11-5 中的说明点击“确定”按钮。最后，出现一个小菜单，提示“已找到并删除\
  \ 680 个重复项；保留 11 个唯一值。”\n\n![](img/494428_2_En_11_Fig5_HTML.jpg)\n\n“删除重复项”窗口的截图。已勾选“数据包含标题”复选框。\n\
  \n图 11-5\n\n确保勾选了“数据包含标题”\n\n这些操作删除了属性 A7 的重复项。我们需要对所有其他分类属性和目标重复这些操作。\n\n有趣的是，你会注意到某些属性内部包含值“？”。嗯，问号符号“？”通常用于表示缺失值。因此，crx3\
  \ 工作表中的那些“？”表示相应属性中存在缺失值。我们稍后将讨论缺失值。\n\n7.  **目标的类别分布：**\n\n\n\n一旦我们在工作表 crx3 中获得了目标的唯一值，就可以轻松获取目标的类别分布。在\
  \ crx3 工作表中，在 R2 单元格内输入公式 `=COUNTIFS(crx!P2:P691, P2)`，然后自动填充至 R3。我们可以立即看出，“+”和“-”这两个类别分别有\
  \ 307 个和 383 个数据点。\n\n一个平衡良好的数据集应该具有均衡的类别，也就是说，所有类别的数据点数量应大致相同。在这个具体案例中，两个类别分别占比约\
  \ 44.5% 和 54.5%，这可以被认为是相当平衡的。\n\n如果数据集存在类别不平衡怎么办？如果发生这种情况，你应该尽力增加代表性不足的类别的数据点。如果数据量足够大，你也可以减少代表性过高的类别的数据点。在最坏的情况下，如果你完全无法改变这种不平衡，那么你应该确保你的机器学习模型对代表性不足的类别足够敏感。\n\
  \n8.  如果存在缺失数据：\n\n缺失值可以以不同形式存在，例如空格或问号“?”。前面删除重复项的操作有助于我们识别出属于缺失值的异常分类值。对于空格，我们可以利用\
  \ `COUNTBLANK` 函数来统计它们。\n\n回到工作表 crx，在 A693 单元格内输入 `=COUNTBLANK(A2:A691)`，然后自动填充至\
  \ P693。幸运的是，我们的数据集中没有任何空格。\n\n要统计每个属性中由“?”标记的缺失值数量，请在 A694 单元格内输入 `=COUNTIFS(A2:A691,\
  \ \"~?\")`，然后自动填充至 P694。请注意，问号“?”在 Excel 中是一个特殊字符。因此，要在此公式中插入字面意义上的“?”，我们必须在其前面加上“~”。\n\
  \n完整结果见 Chapter11-1b.xlsx。请注意，“Variance”、“Blank Cells”和“Missing Data”这些词分别位于单元格\
  \ Q692、Q693 和 Q694 中。这些词是为了说明。\n\n9.  数据异常：\n\n数据异常与离群值不同。离群值是有效的，但其值超出了正常范围。是否应该保留或删除离群数据记录是一个难以抉择的问题。\n\
  \n数据异常指的是意外数据或数据不一致，可能是非预期的数据类型或超出范围的数据值。一般来说，在收集数据时，我们应该了解每个属性的预期数据类型和范围；否则，我们将没有标准来识别非预期的数据值。对于数值数据，我们可以使用\
  \ IF 函数来识别任何超出预期范围的数值。对于非预期的数据类型，有其他函数可以处理。\n\n为了练习数据异常检测，请打开 Chapter11-2a.xlsx，我特意在其中创建了一些数据异常。假设我们知道每个属性的预期数据类型和范围。具体来说，数值属性的值必须\
  \ >= 0。\n\n同样，我们将复制现有的工作表 crx，并将新工作表重命名为 crx2。\n\n在工作表 crx2 中，在 A2 单元格内输入 `=IF(ISNONTEXT(crx!A2),\
  \ \"N\", \"\")`。由于我们知道属性 A1 的数据类型必须是字母，因此使用 `ISNONTEXT` 函数来判断工作表 crx 中对应的值是否为非文本。如果是，则显示“N”；否则，A2\
  \ 单元格中不显示任何内容。双击 A2 单元格的右下角，从 A2 自动填充至 A691。\n\n对于属性 A2 和 A3，我们知道它们必须是数值且不能小于 0。因此，在\
  \ B2 单元格内输入 `=IF(ISTEXT(crx!B2), \"T\", IF(crx!B2<0, \"F\", \"\"))`，并自动填充至 C2，然后一起自动填充至\
  \ B691:C691。我们会立即注意到 C6 单元格中的“F”和 C8 单元格中的“T”，因为如果 crx!B2 包含文本，此公式返回“T”；如果 crx!B2\
  \ < 0，则返回“F”；否则在 B2 中不显示任何内容。\n\n在 D2 单元格内输入 `=IF(ISNONTEXT(crx!D2), \"N\", \"\"\
  )`，并自动填充至 D691；我们还会发现 D15 单元格中显示“N”。\n\n我希望你已经意识到复制原始工作表的好处。当然，当工作表 crx2 中的 C6、C8\
  \ 和 D15 单元格分别出现“F”、“T”或“N”时，我们立即就能知道原始工作表 crx 中完全相同的位置（C6、C8 和 D15）存在数据异常。\n\n此时，我们工作表\
  \ crx2 的一部分应该如图 11-6 所示。\n\n![](img/494428_2_En_11_Fig6_HTML.jpg)\n\n一个 Excel 电子表格在\
  \ C6、C8 和 D15 单元格中显示了意外数据。\n\n图 11-6\n\n单元格 C6、C8 和 D15 显示了意外的数据值\n\n工作表中还有更多意外数据。我想留给你来完成其余属性的检查。请注意，你当然可以使用不同的\
  \ Excel 函数来实现相同的目的。\n\n完成后的结果见 Chapter11-2b.xlsx。由于上述异常检测过程相当繁琐，还有另一个文件 Chapter11-2c.xlsx，其中所有属性只需要一个公式。请查看一下。\n\
  \n\n\n## 通过 Excel 学习数据清洗\n\n数据清洗通常应用于数据记录而非数据属性，即针对行而非列。当一条记录中存在缺失数据或意外数据时，最安全的做法是删除该记录，因为保留它可能会给数据挖掘结果引入误差。著名的“垃圾进，垃圾出”原则指出，如果数据质量不高，无论我们做什么，数据挖掘结果的质量肯定也不会高。尽管如此，数据工程师还可以采用其他数据处理方法，不过如果你的数据量足够大且不包含这些记录，我通常不推荐使用这些方法。\n\
  \n一种常见的技术是用一个常量（如 0），或者该属性的均值、中位数或众数来替换缺失的数值型数据值。在某些情况下，例如，如果数值型数据类型的意外值是“高”，我们可以考虑用大于均值或中位数的数字来替换这个意外值。\n\
  \n对于分类属性，缺失或空值可以用一个常量（如“missing”）来替换。\n\n当一个属性有太多低质量的数据值时，我们应该考虑删除该属性，因为它本身就有问题，并成为数据肿瘤。没有一刀切的阈值来决定何时删除一列，这取决于经验以及反复试验。\n\
  \n一种更高级的方法是开发一个机器学习模型来预测缺失或空值。例如，假设我们有 A1、A2、……、A10 这些属性和标签 T，并且 A1 中存在一些缺失值。然后我们可以开发一个机器学习模型，将\
  \ A1 视为目标，而所有其他属性（包括标签 T）作为预测变量。该模型使用完整的记录进行训练，然后用于预测 A1 中缺失的值。\n\n打开 Chapter11-3a.xlsx。你可能会发现它与\
  \ Chapter-2b.xlsx 相同。工作表 crx2 已经标记了缺失数据或意外值所在的位置。快速浏览一下，我们应该能意识到，与数据量相比，需要删除的数据记录并不多。因此，我们应该继续删除工作表\
  \ crx2 中标记的那些记录。我们可以从工作表 crx2 开始操作，也可以从原始工作表 crx 重新开始。\n\n让我们从原始工作表 crx 重新开始，复制一份并将其重命名为新工作表\
  \ crx3。在工作表 crx3 中，请按照以下说明完成我们的数据清洗工作。注意，对于数据清洗，我们必须同时考虑缺失数据和数据异常。\n\n![](img/494428_2_En_11_Fig7_HTML.jpg)\n\
  \n一张 Excel 电子表格的截图，其中包含待删除记录的行号。\n\n图 11-7\n\n标记了待删除记录的行号\n\n1.  在单元格 A2 中，输入以下公式：\n\
  \n```\n    =IF(COUNT(crx!A2:A691)/COUNTA(crx!A2:A691)>0.8, IF(ISTEXT(crx!A2), ROW(A2),\
  \ IF(crx!A2<0, ROW(A2), \"\")), IF(OR(ISNONTEXT(crx!A2), crx!A2=\"?\"), ROW(A2),\
  \ \"\"))\n    ```\n\n在此公式中，`COUNT(crx!A2:A691)/COUNTA(crx!A2:A691)>0.8` 用于判断属性是文本还是数值数据。根据数据类型，相应地检查该属性是否存在缺失或意外数据。请注意，函数\
  \ ISTEXT 可以检测问号“?”。\n\n从 A2 自动填充到 O691。\n\n此时，我们工作表的一部分应如图 11-7 所示。\n\n![](img/494428_2_En_11_Fig8_HTML.jpg)\n\
  \n一个用于 crx4 的 Excel 电子表格。\n\n图 11-8\n\n工作表 crx4\n\n1.  在单元格 Q1 中输入“toKeep”，在 Q2\
  \ 中输入 `=IF(SUM(A2:O2)>0, 1, 0)`，然后自动填充到 Q691。此公式判断 A2:O2 中是否有行号，如果有，则通过将其标记为 1 来表示该行需要删除。这将帮助我们稍后保留那些想要的记录。\n\
