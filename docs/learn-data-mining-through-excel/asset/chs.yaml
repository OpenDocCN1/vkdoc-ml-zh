  使用最小二乘法获取函数系数\n\n1.  在单元格 K5:K9 中，分别输入 b、w1、w2、w3 和 w4。这些代表线性函数 P 的系数（权重）和截距。\n\n\
  2.  在单元格 L5:L9 中，分别输入 5、4、3、2 和 1。我们将利用 INDEX 和 LINEST 函数来查找线性函数 P 的系数和截距。LINEST\
  \ 函数返回一个包含五个元素的数组。数组中元素的顺序是 w4、w3、w2、w1 和 b。\n\n3.  在单元格 M5 中，输入公式：\n\n```\n   \
  \ =INDEX(LINEST(F$2:F$151,B$2:E$151,TRUE,TRUE),1,L5)\n    ```\n\n4.  将单元格 M5 自动填充到\
  \ M9。我们工作表的一部分应如图 4-9 所示。单元格 M5:M9 包含线性函数 P 的系数。下一步是应用 P 来获取每个数据点的预测值。我们将这些预测值存储在\
  \ G 列中。\n\n![](img/494428_2_En_4_Fig10_HTML.jpg)\n\n屏幕截图显示一个包含 14 行和 7 列的 Excel\
  \ 表格。列标签为 G、H、I、J、K、L 和 M，表格包含与鸢尾花分类相关的数值，以及与变量 w1、w2、w3 和 w4 相关的值。\n\n图 4-10\n\n\
  计算出的分界点\n\n1.  在单元格 G1 中输入“数值预测”。在单元格 G2 中，输入以下公式：\n\n```\n    =MMULT(B2:E2, M$6:M$9)+\
  \ M$5\n    ```\n\n此公式表示表达式 w[1]x[1] + w[2]x[2] + …+ w[n]x[n] + b。由于 B2:E2 是水平数组，而\
  \ M6:M9 是垂直数组，因此两个数组的乘法只能通过执行类似矩阵乘法的 MMULT 函数来实现。类似的函数 SUMPRODUCT 在此处不适用。此公式可以用一个更繁琐的公式（不推荐）替代：\n\
  \n```\n    =M$6*B2+M$7*C2+M$8*D2+M$9*E2+M$5\n    ```\n\n\n\n2.  自动填充单元格 G2 至 G152。一旦我们获得了每个数据点的预测值，下一步需要找到临界值，以便将每个预测值分类到特定的鸢尾花类型中。\n\
  \n3.  在单元格 K11、L11 和 M11 中，分别输入“均值”、“样本数量”和“临界值”（不含引号）。\n\n4.  在单元格 K12 中，输入以下公式：\n\
  \n```\n    =AVERAGEIFS(G$2:G$151,F$2:F$151,K1)\n    ```\n\n此公式计算 Iris-setosa 预测值的均值。\n\
  \n5.  自动填充 K12 至 K14。Iris-versicolor 和 Iris-virginica 的预测值均值分别存储在单元格 K13 和 K14 中。\n\
  \n6.  在单元格 L12 中，输入公式：\n\n```\n    =COUNTIFS(F$2:F$151,K1)\n    ```\n\n此公式统计训练数据集中\
  \ Iris-setosa 的数量。\n\n7.  自动填充 L12 至 L14。单元格 L13 和 L14 分别存储 Iris-versicolor 和 Iris-virginica\
  \ 的数量。\n\n8.  在单元格 M12 中，输入公式计算第一个临界值：\n\n```\n    =(K12*L12+K13*L13)/(L12+L13)\n\
  \    ```\n\n9.  自动填充 M12 至 M13。不要自动填充到单元格 M14。基于这两个临界值，每个预测数值都可以转换为一种鸢尾花类型。工作表的一部分如图\
  \ 4-10 所示。\n\n1.  在单元格 H1 中，输入“类型分类”。\n\n2.  在单元格 H2 中，输入以下公式，然后从 H2 自动填充至 H152：\n\
  \n```\n    =IF(G2<M$12,L$1,IF(G2<M$13,L$2,L$3))\n    ```\n\n此公式将 G 列中的每个数值转换为一种鸢尾花类型。快速浏览结果即可发现，大多数鸢尾花类型都被正确分类。\n\
  \n3.  要统计有多少个鸢尾花数据点被错误分类，请在单元格 I1 中输入“差异”。\n\n4.  在 I2 中，输入以下公式：\n\n```\n    =IF(A2=H2,0,1)\n\
  \    ```\n\n此公式将已知的鸢尾花类型与分类后的鸢尾花类型进行比较。如果发现不匹配，则返回 1。\n\n5.  自动填充单元格 I2 至 I152。\n\
  \n6.  选中单元格 K16 和 L16，合并这两个单元格，并在合并后的单元格中输入文本“差异 =”。\n\n7.  在单元格 M16 中，输入公式 `=SUM(I2:I151)`。公式的一部分应如图\
  \ 4-11 所示。\n\n![](img/494428_2_En_4_Fig11_HTML.jpg)\n\n一张 Excel 表格截图，显示 14 行和 7\
  \ 列。表格包含诸如类型分类、差异、均值、样本数量和临界值等标签。\n\n图 4-11\n\n对鸢尾花训练数据集的 LDA 分析\n\n本次 LDA 分析相当成功，尽管仍有四个鸢尾花数据点被错误分类。请注意，数据挖掘方法在训练数据集上遗漏少量数据点是常见现象。然而，一般来说，我们不应使用同一训练数据集来评估模型性能的好坏。一个在相同训练数据集上实现完美分类或预测的模型可能暗示过拟合，这意味着模型过于针对训练数据，但很可能在未知的评分数据上失效。\n\
