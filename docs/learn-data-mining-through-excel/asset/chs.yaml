  \ 和 sunny。\n\n图 10-6\n\n建立所有辅助表\n\n辅助表准备就绪后，按照以下说明计算熵和信息增益：\n\n7.  在单元格 D22 中输入以下公式：\n\
  \n```\n    =COUNTIFS(INDEX($A$2:$E$15,0,$A22), $C22,$E$2:$E$15,D$21)\n    ```\n\n\
  单元格 A22 引用 1；因此，`INDEX($A$2:$E$15,0,$A22)` 会获取 Temperature 列。此公式统计同时满足 Temperature\
  \ 为“hot”且 Play 为“yes”的数据点数量。\n\n8.  从单元格 D22 自动填充至 E22，然后一起自动填充至单元格 D31:E31。如图 10-7\
