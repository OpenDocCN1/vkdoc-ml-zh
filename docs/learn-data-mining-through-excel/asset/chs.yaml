  6.  真阳性、假阳性、真阴性和假阴性\n\n7.  敏感度和特异度\n\n8.  ROC 曲线\n\n9.  Excel 技巧和函数：\n    1.  排序\n\
  \n    2.  散点图\n\n    3.  函数 IF、ROUND 和 MMULT\n\n"
- "# 6. 逻辑回归\n\n请从 [`https://github.com/hhohho/Learn-Data-Mining-through-Excel-2`](https://github.com/hhohho/Learn-Data-Mining-through-Excel-2)\
  \ 下载本章练习所需的示例 Excel 文件。\n\n\n\n## 总体理解\n\n当预测结果为分类变量时，逻辑回归可被视为线性回归的一种特例。如果只有两种结果，逻辑回归称为二项逻辑回归，这是最常见的形式。如果结果多于两种，则称为多项逻辑回归。本章我们将学习如何在\
  \ Excel 中进行二项逻辑回归。\n\n二项逻辑回归也可被视为 LDA 的一种特例，但其实现数据组间良好可分性的机制与 LDA 不同。\n\n逻辑回归的名称源于模型中使用了逻辑函数。方程（6-1）展示了逻辑函数的一般形式（其中\
  \ `a`、`b` 和 `c` 均为正数）。\n\n![$$ f(x)=\\frac{c}{1+a\\cdotp {b}^{- kx}} $$](img/494428_2_En_6_Chapter_TeX_Equ1.png)\n\
  \n(6-1)\n\n著名的 Sigmoid 函数是逻辑函数的一种特例。\n\n![$$ s(x)=\\frac{1}{1+{\\mathrm{e}}^{-x}}\
  \ $$](img/494428_2_En_6_Chapter_TeX_Equ2.png)\n\n(6-2)\n\n逻辑回归是一种统计模型，能够估计事件发生的概率。设\
  \ 1 表示事件发生，0 表示事件未发生。因此，P(1) 是事件发生的概率，`P(0) = 1 - P(1)`。注意，概率必须介于 0 和 1 之间（含端点）。最后，`P(1)/(1-P(1))`\
  \ 是事件发生的优势比。\n\n假设事件的发生依赖于变量 *x*[1]、*x*[2]、⋯、*x*[*n*]。在逻辑回归中，认为优势比的对数是 *x*[*i*]\
  \ 的线性函数，如方程（6-3）所示。\n\n![$$ \\ln \\left(\\frac{P(1)}{1-P(1)}\\right)={m}_1{x}_1+{m}_2{x}_2+\\\
  cdots +{m}_n{x}_n+b $$](img/494428_2_En_6_Chapter_TeX_Equ3.png)\n\n(6-3)\n\n求解 P(1)，我们可以得到如方程（6-4）所示的逻辑函数。\n\
  \n![$$ P(1)=\\frac{1}{1+{\\mathrm{e}}^{-\\left({m}_1{x}_1+{m}_2{x}_2+\\cdots +{m}_n{x}_n+b\\\
  right)}} $$](img/494428_2_En_6_Chapter_TeX_Equ4.png)\n\n(6-4)\n\n逻辑回归并非通过优化系数 *m*[1]、*m*[2]、⋯、*m*[*n*]、*b*\
  \ 来最大化 P(1) 的概率（这里我们将 `b` 视为一个系数；稍后我们会知道，在机器学习领域 b 也被称为“偏置”）。相反，它试图最大化每个数据样本对应的似然。那么什么是似然？简单来说，似然是一个样本与实际事件结果（1\
  \ 或 0）相匹配的概率。还是不明白？让我用一个例子来解释什么是似然。\n\n假设训练数据集中有两个数据记录 A 和 B。A 的事件发生了，即其事件结果为 1；B\
  \ 的事件未发生，即其事件结果为 0。通过逻辑函数，计算得到 A 的 P(1) 为 0.8，B 的 P(1) 为 0.6。由于 A 的实际事件结果为 1，因此\
  \ A 的似然就是事件发生的概率，即 P(1) = 0.8。另一方面，由于 B 的实际结果为 0，其似然是事件不发生的概率，即其匹配的事件结果为 0。因此，B\
  \ 的似然是 P(0) 而非 P(1)，且 `P(0) = 1 – P(1) = 0.4`。\n\n逻辑回归试图最大化所有样本的整体似然。通过最大化似然，逻辑回归实现了两组之间的良好可分性。在实现中，通常使用似然的对数，无论是自然对数还是以\
  \ 10 为底的对数。对数的优势在于，当预测的似然偏离实际事件结果时，无论实际事件结果是 1 还是 0，对数都会迅速减小。因为当似然为 0 时，计算 log(0)\
  \ 会导致错误。因此，log(0) 被当作一个预定义的最小值来处理。\n\n在实现中，逻辑回归也可以通过最小化似然的对数损失来实现。对数损失是似然对数的相反数。因此，当实际结果为\
  \ 1 时，对数损失计算为 -log(P(1))；当实际结果为 0 时，对数损失计算为 -log(1-P(1))。这里，log(0) 被当作一个预定义的最大值来处理。注意，当预测的似然偏离实际事件结果时，对数损失会迅速增加。图\
  \ 6-1 展示了事件结果为 1 时的对数损失。这里，log(0) 被预定义为 0.000001。\n\n![](img/494428_2_En_6_Fig1_HTML.png)\n\
  \n一张对数损失与预测概率关系的折线图，呈现下降趋势。该线经过坐标点 (0, 6)、(0.2, 0.8)、(0.4, 0.5)、(0.6, 0.2) 和 (0.8,\
  \ 0.1)。数值为近似值。\n\n图 6-1\n\n事件 = 1 时对数损失的计算\n\n基于此理解，我们进行逻辑回归的方法是：首先使用线性回归获得一组系数，然后应用规划求解来优化这些系数，要么最大化整体似然，要么最小化整体对数损失。\n\
  \n## 通过 Excel 学习逻辑回归\n\n文件 Chapter6-1a.xlsx 和 Chapter6-2a.xlsx 中的数据相同。它们模拟了以下场景：\n\
  \n> *假设有五个基因，其表达水平可用于预测某种癌症患者五年生存概率。值 1 表示患者存活了五年，0 表示未存活。*\n\n如前所述，在我们的逻辑回归实践中，我们将应用规划求解来优化模型参数（系数），要么最大化整体似然，要么最小化整体对数损失。\n\
  \n\n\n### 通过最大化对数似然\n\n请打开文件 `Chapter6-1a.xlsx`，其中包含 87 个样本，工作表顶部有 4 个空白行。这些空白行是特意留出的。\n\
  \n我们将再次使用 Excel 函数 `INDEX` 和 `LINEST`，基于最小二乘法获取系数。由于 `LINEST` 返回的第一个值对应基因 5，最后一个值对应系数\
  \ `b`，我们需要按图 6-2 所示设置顶部两个空白行。这样设置是为了方便后续的自动填充。\n\n![](img/494428_2_En_6_Fig2_HTML.jpg)\n\
  \n一张电子表格截图，显示了患者 ID、基因 1、基因 2、基因 3、基因 4、基因 5 和 5 年生存率的详细信息。B 列到 G 列顶部的一组值被高亮显示。\n\
  \n图 6-2\n为最小二乘法系数设置数据\n\n请按照以下说明在 Excel 中进行逻辑回归练习：\n\n![](img/494428_2_En_6_Fig6_HTML.jpg)\n\
  \n一张电子表格截图，显示了 P(1)、结果、差异、似然和对数似然的值。在表格顶部，J 列表示总差异的公式，K 列的值为 53，L 列显示文本“待最大化”，M\
  \ 列的值为 -63.03342831。\n\n图 6-6\n计算出的似然\n\n1.  在单元格 B3 和 B4 中输入以下公式：\n\n```\n    =INDEX(LINEST($G$6:$G$92,$B$6:$F$92),1,B1)\n\
  ```\n\n在两个单元格中输入相同公式的原因是，我们希望保留一组系数不变，同时让另一组系数能被规划求解修改。\n\n注意，`LINEST` 函数中的“known_ys”参数是单元格\
  \ `$G$6:$G$92`，这些单元格只有两个值：1 和 0。这表明，如果我们的原始目标值不是 1 和 0，则必须将其归类为此类。\n\n2.  将 B3 自动填充至\
  \ G3，并将 B4 自动填充至 G4。\n\n3.  在单元格 H5 中输入文本“m1x1+m2x2+…+b”。H 列代表方程 (6-3) 的右侧表达式。\n\
  \n4.  在单元格 H6 中输入以下公式，并自动填充至单元格 H92：\n\n```\n    =SUMPRODUCT($B$4:$F$4,B6:F6)+$G$4\n\
  ```\n\n函数 `SUMPRODUCT` 计算两个数组的乘积。注意，单元格引用 B4、F4 和 G4 使用了绝对引用。\n\n5.  在单元格 I5 中输入文本“P(1)”。I\
  \ 列代表基于 H 列值计算出的五年生存概率。\n\n6.  在单元格 I6 中输入以下公式，并自动填充至单元格 I92：\n\n```\n    =1/(1+EXP(0-H6))\n\
  ```\n\n该公式实现了方程 (6-4)。`(0-H6)` 表示 −(*m*[1]*x*[1] + *m*[2]*x*[2] + ⋯ + *m*[*n*]*x*[*n*]\
  \ + *b*)，而 `EXP(0-H6)` 代表 ![$$ {e}^{-\\left({m}_1{x}_1+{m}_2{x}_2+\\cdots +{m}_n{x}_n+b\\\
  right)} $$](img/494428_2_En_6_Chapter_TeX_IEq1.png)。函数 `EXP` 返回常数 `e`（自然对数的底数）的幂。至此，工作表的一部分应如图\
  \ 6-3 所示。\n\n![](img/494428_2_En_6_Fig3_HTML.jpg)\n\n一张电子表格截图，显示了 7 个患者 ID 的基因 1、基因\
  \ 2、基因 3、基因 4、基因 5、5 年生存率、m1x1 + m2x2 和 P(1) 的详细信息。顶部标出了两组值，分别对应 m1 到 m5 以及 b。\n\
  \n图 6-3\n计算出的 P(1)\n\n此时，了解最小二乘法生成的系数在区分两组患者（存活超过五年和未存活超过五年）方面的效果会很有趣。\n\n7.  在单元格\
  \ J5 中输入“结果”，并在单元格 J6 中输入公式 `=IF(I6>0.5,1,0)`。该公式规定，如果 I 列的概率大于 0.5（此处 0.5 为临界值），则患者的预测结果为\
