  \ 6 来重复上述过程以确认这一点。\n\n注意，按顺序排列这六个工作表非常重要；否则，你将无法得到正确的结果。请查看图 3-13。\n\n至此，所有数据点已成功聚类。\n\
  \n\n\n从上述聚类过程中可以看出，在 Excel 中进行聚类并不困难。相反，它让我们能够经历每一个步骤，从而深入理解 k-means 聚类的工作原理。我想挑战你分别检查四个聚类中的数字。我相信你会发现一些规律。当你这样做时，请记住，聚类的目的是将相似的记录归组在一起。\n\
  \n完整结果见 Chapter3-1b.xlsx 文件（其中也包含我对这些规律的观察）。\n\n## 强化练习\n\nChapter3-HW.xlsx 文件为你提供了一个练习机会。在此练习中，你需要遍历\
  \ 15 个工作表才能达到收敛。如果你觉得练习有困难，请参考 Chapter3-HW-withAnswers.xlsx 文件。\n\nChapter3-HW-withAnswers-NameManager.xlsx\
  \ 文件利用了名称管理器（Excel 内置功能）来简化公式。\n\n到目前为止，我们使用 SHEET 函数来帮助自动化 k-means 聚类过程。使用 SHEET\
  \ 函数的一个关键要求是按顺序放置所有工作表。如果我们不想按顺序放置所有工作表，可以使用 CELL 函数代替 SHEET。Chapter3-HW-withAnswers-Cell-Function.xlsx\
  \ 文件展示了这种解决方案。欢迎自行探索。\n\nExcel 有一些配置公式计算的选项。默认情况下，“启用迭代计算”选项是禁用的。如果我们在 Excel 中启用迭代计算，那么只需两个工作表即可完成\
  \ k-means 聚类过程，因为第二个工作表可以执行类似循环的过程来达到收敛！由于本书篇幅有限，我不会解释如何实现这一点。但请注意，基于上述逐工作表过程获得的聚类结果可能与通过这种迭代计算获得的结果不同，尽管两种结果都是正确的，这表明可能存在不止一个最优聚类解。\n\
  \n## 复习要点\n\n对于第 3 章，以下知识、技能和函数值得复习：\n\n1.  质心、欧几里得距离\n2.  通过工作表名称后跟感叹号“!”来引用工作表\n\
  3.  INDEX、IF、SQRT、SUMXMY2 和 MATCH 函数\n4.  IFERROR、SHEET、INDIRECT、ADDRESS 和 AVERAGEIFS\
  \ 函数\n5.  运算符 &\n6.  复制工作表以开始新的迭代\n7.  聚类过程\n\n"
- "# 4. 线性判别分析\n\n请从 [`https://github.com/hhohho/Learn-Data-Mining-through-Excel-2`](https://github.com/hhohho/Learn-Data-Mining-through-Excel-2)\
  \ 下载本章练习所需的示例 Excel 文件。\n\n## 总体理解\n\n线性判别分析（LDA）与线性回归和 k-means 聚类相似，但也与两者不同。K-means\
  \ 聚类是一种无监督分类方法；而 LDA 是有监督的，因为其分类是基于已知数据进行训练的。然而，线性回归的预测结果是定量数值型的，而 LDA 的预测结果是定性类别型的。\n\
  \nLDA 试图找到最佳的线性函数，该函数可以将数据点分离到不同的类别或组中。组均值之间的方差应尽可能大，而每组内部的方差应尽可能小。请注意，方差是在每个数据点投影到线性函数\
  \ `P = w`[`1`]`x`[`1`] `+ w`[`2`]`x`[`2`] `+ ... + w`[`n`]`x`[`n`] `+ b` 之后计算的。训练数据集用于找到最佳的\
  \ `P` 函数，该函数由参数集 (`w`[`1`]`,w`[`2`]`...,w`[`n`]`,b`) 表示。图 4-1 在二维空间中演示了这一概念。\n\n\
  ![](img/494428_2_En_4_Fig1_HTML.png)\n\n一幅插图展示了最佳投影轴（线 P）和较差的投影轴（线 A）。\n\n图 4-1\n\
  \nLDA 用于分离组\n\n给定一组已按不同组分类的训练数据点集 S，应用 LDA 的三个步骤可简化如下：\n\n步骤 1：通过以下表达式求和组间方差：\n\n\
  ![$$ Sg=\\kern0.5em \\sum \\limits_i^k{s}_g=\\sum \\limits_{i=1}^k{\\left({\\overline{x}}_i-\\\
  overline{x}\\right)}² $$](img/494428_2_En_4_Chapter_TeX_Equ1.png)\n\n(4-1)\n\n其中\
  \ k 是组的数量，![$$ \\overline{x} $$](img/494428_2_En_4_Chapter_TeX_IEq1.png) 是各组均值的均值，![$$\
  \ {\\overline{x}}_i $$](img/494428_2_En_4_Chapter_TeX_IEq2.png) 是单个组的均值。\n\n步骤 2：通过以下表达式求和组内方差：\n\
  \n![$$ {S}_w=\\sum \\limits_i^k\\sum \\limits_{\\dot{j}}^n{\\left({x}_{ij}-{\\overline{x}}_i\\\
  right)}² $$](img/494428_2_En_4_Chapter_TeX_Equ2.png)\n\n(4-2)\n\n其中 n 是一个组中的数据点数量。\n\
  \n步骤 3：`P` 是最佳投影线性函数，使得 Sg(P)/Sw(P) 最大化。由于 `P` 由 (`w`[`1`]`,w`[`2`]`,...,w`[`n`]`,b`)\
  \ 定义，LDA 的模型构建阶段就是求解 (`w`[`1`]`,w`[`2`]`,...,w`[`n`]`,b`)。这在公式 (4-3) 中解释：\n\n![$$\
  \ {\\mathrm{w}}_1{\\mathrm{x}}_1+{\\mathrm{w}}_2{\\mathrm{x}}_2+\\dots +{\\mathrm{w}}_{\\\
  mathrm{n}}{\\mathrm{x}}_{\\mathrm{n}}+\\mathrm{b}=\\max \\left( Sg\\left(\\mathrm{P}\\\
  right)/ Sw\\left(\\mathrm{P}\\right)\\right) $$](img/494428_2_En_4_Chapter_TeX_Equ3.png)\n\
  \n(4-3)\n\n可以首先应用最小二乘法来求解 (`w`[`1`]`,w`[`2`]`,...,w`[`n`]`,b`)。然后，我们可以使用 Excel 规划求解进一步优化\
  \ (`w`[`1`]`,w`[`2`]`,...,w`[`n`]`,b`)。\n\n\n\n## 求解器\n\nExcel 求解器是一款优化工具。它通过调整决策变量的值，来搜索最大值、最小值或精确的目标值。求解器是一个内置的加载项程序，无需下载即可安装。请按照以下说明，将求解器与数据分析加载项一同安装：\n\
