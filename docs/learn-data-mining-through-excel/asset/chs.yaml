  \ 1 到步骤 10 相关的数据，以及国家、谋杀、袭击、城市人口和强奸等属性，并附有每个步骤对应的数值。\n\n图 8-10\n\n层次聚类的初始步骤\n\n\
  1.  在单元格 G1:P1 中，依次输入文本“Step-1”、“Step-2”、“Step-3”、“Step-4”、“Step-5”、“Step-6”、“Step-7”、“Step-8”、“Step-9”和“Step-10”。你可以在\
  \ G1 单元格中输入“Step-1”，然后自动填充至 P1 来实现。\n\n2.  为了更好地区分 C:F 列中的原始数据与各个步骤，建议将 G1:P1 中的文本格式设置为**粗体**和红色（或其他非黑色）。\n\
  \n3.  在单元格 G2:G11 中，输入数字 11–20。这些数字代表每个数据点当前所在的簇。请注意，由于我们有十个数据点，任何大于十的整数都可以标记该数据点尚未被聚类。这是初始步骤，即\
  \ Step-1。\n\n此时，我们的工作表应如图 8-10 所示。\n\n![](img/494428_2_En_8_Fig11_HTML.jpg)\n\n\
  一个显示数值矩阵的 Excel 工作表。该矩阵似乎代表一个数据集或数据表，包含各种数值条目。每个单元格包含一个值，这些值似乎与某种数据分析相关。\n\n图 8-11\n\
  \n邻近矩阵和第一个簇\n\n1.  在单元格 B13:K13 中，分别输入整数 1–10。这些数字用于从数组 C2:F11 中提取记录。\n\n2.  在单元格\
  \ A14:A23 中，也分别输入整数 1–10。我们将在单元格 B14:K23 中构建邻近矩阵。\n\n3.  在单元格 B14 中，输入公式：\n\n```\n\
  \    =IFERROR(IF($A14=B$13,1000000, SQRT(SUMXMY2($C2:$F2,INDEX($C$2:$F$11,B$13,0)))),1000000)\n\
  ```\n\n在此公式中，`INDEX($C$2:$F$11,B$13,0)` 选取由 B13 引用的记录。在此特定情况下，它是第一个数据点（C2:F2）。\n\
  \n`SQRT(SUMXMY2($C2:$F2,INDEX($C$2:$F$11,B$13,0)))` 计算 C2:F2 与 C2:F2 之间的距离。\n\n\
  在 IF 函数内部，整数 1000000 用作最大距离。如果 $A14=B$13，我们知道它正在计算同一数据点之间的距离（在此特定情况下，是 C2:F2 与 C2:F2\
  \ 之间）。虽然这样的距离应为 0，但我们希望为其分配最大距离以便后续使用。否则，将返回 SQRT 函数的计算结果。\n\nIFERROR 函数用于确保一旦出现错误，就分配最大距离。这一点非常重要且必要！\n\
  \n4.  从 B14 自动填充至 K23。现在邻近矩阵已构建完成。\n\n5.  在单元格 L14 中输入公式 `=MATCH(MIN($B$14:$K$23),B14:K14,0)`。从\
  \ L14 自动填充至 L23。邻近矩阵应如图 8-11 所示，它表明数据点 4 和 1 之间的距离最短。\n\n1.  步骤 2：\n    *   现在我们需要更新十个数据点的簇信息。将\
