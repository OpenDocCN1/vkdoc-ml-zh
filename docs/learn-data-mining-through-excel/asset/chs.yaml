  \ 列到 K 列以及第 1 行到第 9 行，包含数值和标签 Iris setosa、versicolor 和 virginica。\n\n图 4-7\n\n鸢尾花数据集和表格设置\n\
  \n我们想先利用最小二乘法来获得线性函数 P。因此，我们需要先将分类值转换为数值。单元格 K1:L3 定义了 0 ➤ Iris-setosa，1 ➤ Iris-versicolor，2\
  \ ➤ Iris-virginica。\n\n![](img/494428_2_En_4_Fig8_HTML.jpg)\n\n屏幕截图显示一个包含 9 列和 14\
  \ 行的 Excel 数据。它高亮显示了 K 列和 L 列。\n\n图 4-8\n\n分类后的鸢尾花数据集\n\n1.  在单元格 F2 中，输入以下公式：\n\
  \n```\n    =IF(A2=L$1,K$1,IF(A2=$L$2,K$2,K$3))\n    ```\n\n2.  将单元格 F2 自动填充到 F151（共有\
  \ 150 个数据点）。我们的工作表应如图 4-8 所示。\n\n![](img/494428_2_En_4_Fig9_HTML.jpg)\n\nExcel 工作表截图显示\
