  \n评论概览\n\n按照以下步骤完成我们的文本挖掘练习：\n\n![](img/494428_2_En_14_Fig9_HTML.jpg)\n\n一个包含 3\
  \ 列 8 行的截图。它展示了相同的酒店评论，例如：酒店很棒，环境很好，舒适，早餐有高品质的产品但选择不多，价格与你所得到的相比极其荒谬，我们会再来的，一点也不差，等等。\n\
  \n图 14-9\n\n粘贴数值后的工作表\n\n1.  正如我们所学，我们需要将所有单词转换为小写，并修剪每个句子两端的空格。在单元格 B1 中输入公式 =TRIM(LOWER(A1))，然后自动填充到单元格\
  \ B34。此公式将文本转换为小写，并修剪掉前导和尾随的空白空格。\n\n2.  有些句子以感叹号结尾。为了移除感叹号，请在单元格 C1 中输入以下公式：\n\n\
  ```\n    =IF(MID(B1,LEN(B1),1)=\"!\", TRIM(LEFT(B1,LEN(B1)-1)),B1)\n    ```\n\n\
  `LEN(B1)` 返回单元格 B1 中文本的长度。`MID(B1,LEN(B1),1)` 选取 B1 中文本的最后一个字符。如果最后一个字符是“!”，`LEFT(B1,LEN(B1)-1)`\
  \ 通过取除最后一个字符外的所有字符来移除“!”。如果最后一个字符不是“!”，则取 B1 中的原内容。\n\n注意：移除“!”后，`TRIM(LEFT(B1,LEN(B1)-1))`\
  \ 会再次修剪可能存在的空格。\n\n\n\n3.  在对单词进行分词之前，我们需要通过“选择性粘贴”（粘贴数值）将 C 列中的句子复制到 D 列。如果不这样做，我们即将使用的\
  \ Excel 功能“分列”将会拆分 C 列中的公式，而不是文本值。让我们将 C1:C34 单元格的值复制并粘贴到 D 列。工作表的一部分如图 14-9 所示。\n\
  \n![](img/494428_2_En_14_Fig10_HTML.jpg)\n\n工具选项卡“分列”位于 Excel 的主选项卡“数据”下方。点击主选项卡“数据”后，工具选项卡“分列”会与数据工具一同显示。\n\
  \n图 14-10\n\n工具选项卡“分列”位于主选项卡“数据”下方\n\n1.  工具选项卡“分列”位于 Excel 的主选项卡“数据”下方。点击主选项卡“数据”后，工具选项卡“分列”会显示出来。请参考图\
  \ 14-10。\n\n![](img/494428_2_En_14_Fig11_HTML.jpg)\n\n“文本分列向导”步骤 2/3 的截图。选择最能描述数据的分隔符号。下一步按钮被高亮显示。\n\
  \n图 14-11\n\n选择分隔符号并点击下一步\n\n1.  选中 D 列，点击工具选项卡“分列”；会弹出一个菜单。如图 14-11 所示，选择“分隔符号”。\n\
  \n![](img/494428_2_En_14_Fig12_HTML.jpg)\n\n“文本分列向导”步骤 2/3 的截图。选择分隔符号，如制表符、分号、逗号、空格等。勾选“将连续分隔符号视为单个处理”复选框。下一步按钮被高亮显示。\n\
  \n图 14-12\n\n通过分隔符将句子拆分为单词\n\n1.  点击“下一步”；在下一个菜单中，选择所有分隔符，并在“其他”旁边的框中输入句点“.”，如图\
  \ 14-12 所示。\n\n1.  在下一个菜单中，点击“完成”，如图 14-13 所示。注意：目标区域是单元格 D1。通过选择 D1 作为目标区域，分词后的单词将被放置在以\
  \ D 列开头的区域。这意味着 D 列中的原始文本将被替换。\n\n![](img/494428_2_En_14_Fig13_HTML.jpg)\n\n“文本分列向导”步骤\
  \ 3/3 的截图。选择列数据格式为“常规”，目标区域为$D$1。在数据预览中选择“常规”。下一步按钮被高亮显示。\n\n图 14-13\n\n目标区域为 D1\n\
  \n至此，我们工作表的一部分如图 14-14 所示。\n\n![](img/494428_2_En_14_Fig14_HTML.jpg)\n\n一个包含部分酒店分词单词的表格截图。该表格由十列和八行组成。分词后的单词包括：the,\
  \ cozy, wonderful, best, back, hotels, fantastic, environment, choice, great, utterly,\
  \ ridiculous, products, has, a, get 等。\n\n图 14-14\n\n分词单词一览\n\n![](img/494428_2_En_14_Fig15_HTML.jpg)\n\
  \n一个包含被替换为空格的停用词表格截图。该表格由十列和八行组成。单词包括：cozy, wonderful, best, back, hotels, fantastic,\
  \ environment, choice, great, utterly, ridiculous, products, what, you 等。\n\n图 14-15\n\
  \n停用词被替换为空\n\n1.  我们的下一步是移除停用词。为此，我们需要先将每个停用词替换为空。分词单词的最右侧列是 N 列，因此在单元格 O1 中输入以下公式：\n\
  \n```\n    =IF(OR(ISBLANK(D1),COUNTIFS(stw,D1)>0),\"\",D1)\n    ```\n\n有些句子较短，有些较长。这会在工作区域中留下一些空白单元格，如图\
  \ 14-14 所示。\n\n`ISBLANK(D1)` 判断 D1 是否为空白单元格。`COUNTIFS(stw,D1)>0` 判断 D1 是否为停用词。`OR(ISBLANK(D1),COUNTIFS(stw,D1)>0)`\
  \ 如果至少有一个判断结果为 TRUE，则返回 TRUE。在这种情况下，单元格 O1 被赋值为空。否则，单元格 O1 被赋予单元格 D1 中的内容。\n\n移除短单词（例如，移除所有长度小于等于\
  \ 3 的单词）是一种常见技巧。不过，我们在本练习中不采用此技巧。\n\n2.  从单元格 O1 自动填充到 O34，然后一起自动填充到单元格 Y1:Y34。工作表的一部分如图\
  \ 14-15 所示。\n\n![](img/494428_2_En_14_Fig16_HTML.jpg)\n\n从句子中移除停用词后的酒店评论截图。评论内容为：hotel\
  \ fantastic, environment great, cozy, breakfast has high-quality products but lacks\
  \ choice, price utterly ridiculous what you get, what wonderful hotel, not bad all,\
  \ come back, one best hotels。\n\n图 14-16\n\n移除停用词后\n\n1.  为了移除停用词，我们的计划是：将包含停用词的单元格清空，然后为每个句子连接剩余的单词，最后应用“分列”功能重新分词。保持\
  \ Z 列不变。在单元格 AA1 中输入以下公式：\n\n```\n    =IF(ISBLANK(O1)=FALSE,TRIM(Z1 & \" \" & O1),\
  \ TRIM(Z1 & \"\"))\n    ```\n\n当我们水平自动填充此公式时，它会累积单元格中的文本，但会跳过空白单元格。由于 Z 列保持不变，Z\
  \ 列中的单元格都是空白单元格。如果 `ISBLANK(O1)=FALSE`，即单元格 O1 不是空白单元格，则将 AA1 之前的单元格（Z1）与 O1 连接起来。否则，单元格\
  \ AA1 仅保留其前一个单元格的内容。\n\n自 Office 2019 或 Office 365 起，Excel 新增了一个名为 TEXTJOIN 的函数，它可以：\n\
  \    *   连接多个区域中的文本\n\n*   忽略空单元格\n\n*   并插入所需的分隔符\n\n如果你的 Excel 可用，TEXTJOIN 函数绝对比前面的公式好得多。假设它可用，则：\n\
  \    *   忽略前面的公式。\n\n*   在单元格 AK1 中输入公式 `=TEXTJOIN(\" \",TRUE,O1:Y1)`。\n\n*   从单元格\
  \ AK1 自动填充到单元格 AK34。\n\n*   并跳过以下步骤（步骤 11）。\n\n2.  从单元格 AA1 自动填充到单元格 AK1，然后一起自动填充到单元格\
  \ AA34:AK34。AK 列保存了不含停用词的句子。请查看图 14-16。\n\n![](img/494428_2_En_14_Fig17_HTML.jpg)\n\
  \n一个包含部分酒店重新分词单词的表格截图。该表格由十列和十一行组成。重新分词后的单词包括：cozy, wonderful, best, back, hotels,\
  \ fantastic, environment, choice, great, utterly, ridiculous, products, have, all,\
  \ get 等。\n\n图 14-17\n\n重新分词后的单词\n\n1.  复制单元格 AK1:AK34，并仅将数值粘贴到 AL 列。\n\n2.  使用工具选项卡“分列”对\
  \ AL 列中的文本进行分词。请参考步骤 4-7。工作表的一部分如图 14-17 所示。\n\n![](img/494428_2_En_14_Fig18_HTML.jpg)\n\
  \n一个包含 2-gram 短语的表格截图。该表格由五列和八行组成。2-gram 短语包括：hotel fantastic, environment great,\
  \ best hotels, ridiculous what, what you, come back, price utterly, has high quality,\
  \ products but, bad all 等。\n\n图 14-18\n\n2-gram 短语\n\n1.  为了生成 2-gram 短语，在单元格 AU1\
  \ 中输入以下公式：\n\n```\n    =IF(AND(ISBLANK(AL1)=FALSE, ISBLANK(AM1)=FALSE),AL1 & \"\
  \ \" & AM1,\"\")\n    ```\n\n此公式确保仅当单元格 AL1 和 AM1 都不是空白单元格时，才会在单元格 AU1 中创建一个 2-gram\
  \ 短语。\n\n2.  从单元格 AU1 自动填充到 BB1，然后一起从单元格 AU1:BB1 自动填充到单元格 AU34:BB34。\n\n我们的 2-gram\
  \ 短语如图 14-18 所示。请注意，第 2 行没有 2-gram 短语。另请注意，最后一个 2-gram 短语位于 BB 列（图 14-18 中未显示）。\n\
  \n\n\n![](img/494428_2_En_14_Fig19_HTML.jpg)\n\n一个包含 15 行 8 列、展示分词后单词极性得分的截图。这些单词包括：the\
  \ hotel it is fantastic, the environment it is great, cozy, breakfast has high-quality\
  \ products but it lacks in choice, price utterly ridiculous for what you get, 10\
  \ stars, everything ok 等。\n\n图 14-19\n\n为分词后的单词和二元词组计算的极性得分\n\n1.  所有单词（包括单个单词和二元词组）都已分词并放置在单元格\
  \ AL1:BB34 中。现在需要计算每个句子的得分。在单元格 BC1 中，输入以下公式：\n\n```\n    =IFERROR(INDEX(kws, MATCH(AL1,\
  \ kw, 0), 1), 0)\n    ```\n\n此公式用于计算单元格 AL1 中单词（“hotel”）的极性得分。\n\n当 MATCH 函数在关键词数组（由名称\
  \ kw 表示）中找不到 AL1 的完全匹配项时，会返回 #NA 错误。因此，IFERROR 函数确保当不存在此类关键词并因此出现 #NA 错误时，返回 0。当\
  \ MATCH 函数成功时，它会返回该单词在数组 kw 中的位置。该位置被传递给 INDEX 函数，以在关键词得分数组（由名称 kws 表示）中找到对应的得分。\n\
  \n请特别注意表达式 `INDEX(kws, MATCH(AL1, kw, 0), 1)`。MATCH 函数中的最后一个参数是 0，表示要求精确匹配。INDEX\
  \ 函数中的最后一个参数是 1，因为 kws 只有一列。\n\n2.  从单元格 BC1 自动填充到单元格 BS1，然后一起自动填充到单元格 BC34:BS34。BC1:BS34\
  \ 是一个稀疏矩阵。工作表的一部分如图 14-19 所示。\n\n![](img/494428_2_En_14_Fig20_HTML.jpg)\n\n一个包含\
  \ 19 行 4 列、展示部分酒店评论及其极性得分的截图。这些单词包括：the hotel it is fantastic, the environment it\
  \ is great, cozy, breakfast has high-quality products but it lacks in choice, price\
  \ utterly ridiculous for what you get, 10 stars, everything ok 等。\n\n图 14-20\n\n\
  酒店评论的情感分析\n\n1.  在单元格 BT1 中，输入公式 `=SUM(BC1:BS1)`。此公式对第一个句子的所有得分进行求和。\n\n2.  从单元格\
  \ BT1 自动填充到单元格 BT34。\n\n3.  在单元格 BU1 中，输入公式：\n\n```\n    =IF(BT1>0,\"Positive\"\
  , IF(BT1=0,\"Neutral\",\"Negative\"))\n    ```\n\n如果求和得分为正，则该句子被视为正面评价。如果求和得分为 0，则该句子被视为中性评价，否则为负面评价。\n\
  \n4.  从单元格 BU1 自动填充到单元格 BU34。\n\n5.  通过冻结 B 列（点击 B 列 ➤ 点击“视图” ➤ 点击“冻结窗格” ➤ 选择“冻结窗格”），我们的最终结果如图\
  \ 14-20 所示。\n\n完整的文本挖掘工作可在 Chapter14-1b.xlsx 和 Chapter14-1c.xlsx 文件中找到。\n\nChapter14-1b.xlsx\
  \ 未使用 TEXTJOIN 函数，而 Chapter14-1c.xlsx 使用了。\n\n仔细检查我们的结果后发现，我们的文本挖掘模型对评论 9、15、16、20\
  \ 和 26 的效果不佳。但这并不意味着我们的挖掘工作是失败的。评论 9（“10 stars!”）、15（“A five star stay!”）和 20（“Not\
  \ cheap, but worthy.”）可以通过添加更多关键词来正确评估。评论 26（“want to say ‘Thanks’ to all of you!”）也可以通过应用词干提取技术来正确评估。\n\
  \n有些单词虽然写法不同，但含义相同，例如“thanks”和“thank you”。其他例子包括“book”和“books”、“imply”和“implies”等。“Thanks”、“books”和“implies”都源自它们的基本词干（“thank”、“book”和“imply”）。将单词还原为其基本词干在文本挖掘中称为词干提取。当然，将“thanks”还原为“thank”可以将评论\
  \ 26 评估为正面评价。\n\n真正具有挑战性的是评论 16（“Come back again is not even a question.”）。我们知道这是一条正面评论，但许多计算机算法无法将其识别为正面评论。正是因为有这样的句子，文本挖掘才成为一项极具挑战性和复杂性的任务。本章仅提供一个教学示例。因此，我不会在本书中解释如何处理这样的句子。\n\
  \n文本挖掘还可以识别评论、反馈和客户支持查询中出现频率最高的单词。高频词可以告知我们客户面临的常见问题。词频（TF）也可以与另一个概念——逆文档频率（IDF）结合使用，用于对网络搜索中的网页进行排名。\n\
  \n当然，Excel 并不适合对网页进行排名。这只是展示 Excel 在数据挖掘中应用局限性的一个例子。然而，通过越来越多的插件，Excel 在数据挖掘或机器学习方面的功能正变得越来越强大，尽管本书试图在不使用额外插件的情况下演示\
  \ Excel 的用法。\n\n\n## 词嵌入与 ChatGPT\n\n不要被本节标题误导。Excel 似乎无法成功模拟词嵌入（也称为文本嵌入），更不用说模拟\
  \ ChatGPT 了。然而，由于 ChatGPT 给我们带来了一场令人目眩的 AI 革命，这场革命可能会重塑人类作为智慧物种的进程，因此我想在此简要谈谈它们。\n\
  \n如前所述，要通过计算机处理文本数据，我们需要将数据整理成表格格式。这正是词嵌入所做的。嵌入的精妙之处在于使用一个数值向量来定义一个词，每个数值代表该词的某个未知属性。因此，语料库中的所有单词都可以通过一个矩阵用数值表示。例如，假设我们的语料库是句子“At\
  \ the most beautiful place remember the most beautiful you”，并且每个单词有七个属性；一旦我们对每个单词进行了分词，我们可能会随机得到一个像表\
  \ 14-1 这样的矩阵。\n\n表 14-1\n\n一个示例词嵌入矩阵。注意有些单词是重复的\n\n| 单词 | P1 | P2 | P3 | P4 | P5\
  \ | P6 | P7 |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| at | 0.6 | -0.9\
  \ | 0.1 | -0.4 | -0.2 | -0.1 | -0.9 |\n| the | 0.2 | -0.9 | 1.0 | 0.9 | -0.8 | 0.5\
  \ | 0.0 |\n| most | 0.5 | 0.5 | 0.4 | -0.1 | -0.1 | 0.2 | 0.9 |\n| beautiful | 0.0\
  \ | 0.9 | 0.3 | -1.0 | 0.7 | -0.4 | -0.3 |\n| place | -0.6 | 0.7 | -1.0 | -0.9 |\
  \ 0.0 | -0.3 | 1.0 |\n| remember | 0.8 | 1.0 | 0.8 | 0.5 | 0.0 | -0.5 | -0.4 |\n\
  | the | 0.2 | -0.9 | 1.0 | 0.9 | -0.8 | 0.5 | 0.0 |\n| most | 0.5 | 0.5 | 0.4 |\
  \ -0.1 | -0.1 | 0.2 | 0.9 |\n| beautiful | 0.0 | 0.9 | 0.3 | -1.0 | 0.7 | -0.4 |\
  \ -0.3 |\n| you | 0.6 | -0.1 | 0.5 | -0.4 | 0.0 | 0.8 | -0.5 |\n\n按照惯例，当一个词由一个包含\
  \ N 个数值的向量表示时，我们说嵌入维度大小为 N，或者说词向量的维度是 N，而不是说 N 个属性。在自然语言处理（NLP）中，尤其是对于大型语言模型（LLM），嵌入维度大小通常达到数百、数千甚至更大。\n\
  \n当我们在对酒店评论进行情感分析时，我们预定义了停用词和极性词。然而，在词嵌入中，每个词的数值向量并非预定义的；相反，它是通过神经网络训练和优化得到的。这就是嵌入技术的精妙之处！在大型语言模型中，第一个隐藏层始终是嵌入层，这表明嵌入是超大型语言模型的基础。一旦此类模型的训练和测试完成，嵌入矩阵就被优化了，也就是预训练好了。一个成功且预训练良好的嵌入矩阵可以精确地定义几乎所有单词，用于其他语言处理任务，例如著名的\
  \ Word2Vec。\n\n假设我们的神经网络模型获得了一个预训练良好的嵌入矩阵，其词向量是二维的。我们的嵌入矩阵可能会给出（king: -0.2, 0.9）、（man:\
  \ -0.2, 0.5）、（woman: 0.3, -0.2）和（queen: 0.3, 0.2）。然后我们可以在数学上“证明” king – man + woman\
  \ = queen，这是最初由 Word2Vec 得出的一个有趣等式（注意，Word2Vec 的嵌入维度未知，但大致在 100 到 1000 之间）。\n\n\
  GPT 代表生成式预训练变换器。你可能会对“生成式”和“变换器”这两个词感到困惑。嗯，我们在本书中学到的数据挖掘方法或机器学习模型只能进行发现，它们本身不能生成任何新东西。然而，GPT\
  \ 模型可以自行进行创造，即“生成”。变换器是一种新型的神经网络模型，可以学习和进化。从某种意义上说，它具有自注意力机制。最后，ChatGPT 是由 OpenAI\
  \ 公司开发的一个大型语言模型，经过预训练以执行各种 NLP 任务。\n\n嵌入技术在 ChatGPT 中扮演着非常重要的角色。尽管 OpenAI 公布 ChatGPT\
  \ 3 拥有 1750 亿个参数，但其嵌入维度是未知的（至少对我来说是未知的）。但我们可以肯定地说，它的嵌入维度相当大。\n\n## 强化练习\n\n唯一的强化练习在文件\
  \ Chapter14-HW.xlsx 中。在这个文件中，你会发现已经为你准备了一个字典，当然你也可以自行修改。基于给定的字典，Chapter14-HW-withAnswers.xlsx\
  \ 提供了一个不使用 TEXTJOIN 函数的标准解决方案。顾名思义，Chapter14-HW-withAnswers-UseTEXTJOIN.xlsx 提供了一个使用\
  \ TEXTJOIN 函数的解决方案。在我修订本书时，我确信大多数 Excel 用户都可以使用 TEXTJOIN 函数。\n\n## 复习要点\n\n1.  结构化与非结构化数据\n\
  \n2.  文本挖掘的应用\n\n3.  词频、极性得分、分词、关键词、停用词、词干提取、n-gram\n\n4.  Excel 函数 IF、COUNTIFS、INDEX、MATCH、AND\n\
  \n5.  Excel 函数 IFERROR、OR、ISBLANK、MID、TRIM、LEN、LOWER\n\n6.  名称管理器\n\n7.  分列\n\n\
  8.  Excel 函数 TEXTJOIN\n\n9.  词嵌入\n\n\n\n"
- '# 15. 超越 Excel


  Excel 是一款出色的商业智能、办公事务及其他众多应用领域的工具。其强大之处源于众多功能，包括公式与函数、自动填充、自动工作簿计算、加载项等。通过自动工作簿计算，对某个单元格中的公式或值所做的任何修改，都会触发所有直接或间接与该单元格相关的其他单元格重新计算，即使它们位于不同的工作表中。重新计算还可以重塑依赖于这些单元格的图表。单元格的值还可以链接到窗体控件，从而实现对数据值和图表的可视化控制。


  自动填充功能可自动完成大量单元格的计算，这是一项极其强大的特性。该特性使 Excel 能够处理大规模数据集。Excel 中的数据会自动以表格格式排列，这也使得
  Excel 天然适用于许多数据挖掘技术。


  Excel 中的数百个函数使其具备了可编程性。我们可以将 Excel 公式视为一条编程语句，将工作表视为模块化函数、类或程序。这些函数可根据其特定用途进行分类，例如财务、数学、统计、查找与引用等。创造性地运用这些函数，为我们提供了通过
  Excel 逐步学习数据挖掘的机会。


  Excel 的功能一直在不断演进。在我使用的第一个 Excel 版本（Excel 2003）中，其可用行数和列数分别为 65,536 和 256。自 2007
  版本起，可用行数超过 100 万，可用列数超过 16,000。当今 Excel 的容量使其能够处理大型数据集。


  Excel 的可用函数数量也一直在增加。表 15-1 列出了自 2010 版本以来的新增函数以及自 2007 版本以来的函数总数。表 15-1 中的数据来源于
  [`https://support.office.com/`](https://support.office.com/)。一般来说，函数集越大，表示能力越强。


  我相信，到目前为止，我们已经对数据挖掘有了相当程度的了解，不会再认为数据挖掘或机器学习是一种神秘的技术。我们可能也会问，Excel 还能做什么，因为本书中尚未涉及许多其他数据挖掘方法，例如随机森林、支持向量机、主成分分析、深度学习、自然语言处理（NLP）等。


  表 15-1


  不同 Excel 版本中的函数数量


  | Office 版本 | 2007 | 2010 | 2013 | 2016 | 2019 | 2023//365 |

  | --- | --- | --- | --- | --- | --- | --- |

  | 新增函数 |   | 56 | 51 | 6 | 16 | 11 |

  | 函数总数 | 350 | 406 | 457 | 463 | 479 | 490 |


  我想强调的是，本书的目的是通过 Excel 示例介绍基本的数据挖掘方法。我无意在本书中涵盖所有可能的数据挖掘方法，尽管某些其他数据挖掘方法的简化版本也可以通过
  Excel 示例进行说明。


  我们也必须承认，Excel 不是一种编程语言，也就是说，我们必须承认 Excel 在学习数据挖掘方面的局限性。在上一章中，我提到 Excel 不适合某些文本挖掘任务。在第
  12 章中，我只能展示如何对大小为 2 的项集进行关联分析。当项集大小增加时，不同项集的数量呈指数级增长，通过 Excel 进行关联分析将变得不合适，最终变得不可能。


  最初，数据挖掘软件工具提供半自动化的挖掘过程。用户必须一次应用一种数据挖掘方法。为了比较不同方法的性能，用户必须手动尝试不同的方法并比较它们的性能。如今，自动化数据挖掘变得越来越流行。诸如
  RapidMiner 之类的软件工具提供了“自动模型”，允许用户应用他们选择的尽可能多的挖掘方法，并能自动比较这些方法的性能。一些 Python 包，如 AutoGluon，甚至可以自动完成
  EDA 和特征选择过程，生成新特征（例如，对文本数据应用嵌入技术），并构建由一组选定的数据挖掘方法组成的集成机器学习模型。当然，即使 Azure 机器学习加载项非常强大，Excel
  要提供这样的自动数据挖掘功能也要困难得多。一旦我们通过 Excel 学习了数据挖掘知识，如果我们渴望成为数据挖掘或机器学习专家，我们确实需要熟练掌握数据挖掘软件工具和/或语言。


  自动化数据挖掘在挖掘阶段所需的工作量最小，但将大量工作推向了数据准备阶段。如前所述，Excel 可以为用户提供对每个数据准备操作的直接可视化检查。因此，Excel
  将始终在数据挖掘实践中发挥重要作用。当数据集过大而 Excel 无法处理时，Excel 仍然可以作为一个很好的工具，在较小规模上测试数据准备过程。


  学习是一个循序渐进的过程；它不是，也永远不会是一个自动化的过程。我们知道，边做边学是最好的教育方法。使用 Excel 学习数据挖掘迫使学习者手动经历每一个数据挖掘步骤，为他们提供主动的学习体验。我想说，自动化数据挖掘的趋势使得
  Excel 在学习数据挖掘或机器学习方面变得更加重要。




