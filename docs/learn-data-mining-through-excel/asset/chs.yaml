  编辑数据标签内的文本\n\n最终结果可在 Chapter8-1b.xlsx 中找到。\n\n\n\n## 通过 Excel 学习层次聚类\n\n让我们打开包含十条数据记录的\
  \ `Chapter8-2a.xlsx` 文件。使用 Excel 演示记录过多的层次聚类并不实际，因为树状图的创建和层次聚类过程都需要相当多的人工操作。本章的目的是让你体验层次聚类的工作原理，因此无需从过多记录开始。\n\
