- "# 14. 文本挖掘\n\n文本挖掘是数据挖掘中一个庞大的主题，足以成为一个独立的领域。它也非常重要且应用广泛，以至于任何一本典型的数据挖掘书籍都不会遗漏它。到目前为止，我们使用的所有数据都是结构化数据。根据定义，结构化数据是指数据以特定格式排列，以便计算机程序可以轻松处理。我们一直使用的数据已经以表格格式排列，这是我们学过的所有数据挖掘方法所要求的格式。然而，文本数据（文本挖掘方法处理的对象）是一种非结构化数据，通常是序列数据。其他形式的非结构化数据包括音频文件、图像等。\n\
  \n是否有可能应用我们学过的技术来挖掘像文章或网页这样的非结构化数据？答案是肯定的。但有一个前提条件。\n\n## 总体理解\n\n要将我们学过的数据挖掘技术应用于非结构化文本数据，必须对数据进行预处理，使其成为结构化或至少是半结构化数据。有几种典型的预处理（准备）文本数据的技术。这些技术包括大小写转换、分词、停用词移除、词干提取、生成\
  \ n-gram、词元替换等。在文本数据以表格格式组织后，我们可以构建一个词项-文档矩阵。由此，可以挖掘出有意义的信息，包括词频和词项模式，用于各种应用，如风险管理、客户服务、欺诈预防、垃圾邮件过滤、社交媒体文本分析等。\n\
  \n假设我们正在阅读大量关于某家酒店的评论。我们的目的是根据正面评论数量与负面评论数量的对比来给酒店评级。首要任务是确定什么是正面或负面评论。这类任务类似于句子情感分析：判断一个短句的情绪或情感。评估句子情感的最简单技术是统计正面关键词和负面关键词的出现次数。当然，应该有一个包含这些关键词（和短语）的词典，代表正面或负面情绪。MPQA\
  \ 主观性词典正是这样一个词典，并被 Excel Azure 机器学习插件所采用。在 MPQA 主观性词典中，大约有 8000 个词；每个词都被分配了一个强或弱的极性分数。由于本书除了内置的规划求解插件外不使用其他插件，我们不会使用\
  \ Azure 或 MPQA。相反，我将通过 Excel 创建一个小型词典来说明如何进行简单的观点（情感）分析。让我们先通过处理一条评论“The hotel it\
  \ is fantastic”来了解数据准备步骤。\n\n1.  大小写转换：将所有单词转换为小写是一个好主意。我们不希望将“Fantastic”与“fantastic”区别对待。经过大小写转换后，原始评论变为“the\
  \ hotel it is fantastic”。\n\n2.  分词：通过分词，我们将每个单词分离成一个独立的词元。在分词过程中，我们还会移除标点符号和空白字符。分词后，原始句子变成五个独立的单词：the,\
  \ hotel, it, is, fantastic。\n\n3.  停用词是在上下文中没有实际意义的词。它们是英语中必要的连词和冠词，例如，then, a,\
  \ the, it, is, of, for, just, to 等。移除它们可以简化文本。移除停用词后，我们只剩下两个词：hotel 和 fantastic。\n\
  \n4.  假设“fantastic”是我们词典中的一个正面词，极性分数为 1，而“hotel”是一个中性词，极性分数为 0。因此，这条评论被评估为正面（分数=1）。\n\
  \n如果评论变为“The hotel it is not fantastic”，我们知道即使关键词 fantastic 存在，它也不应该是一条正面评论。如何评估这条评论为负面？可以有多种方法。\n\
  \n*   方法 1：将“not”标记为负面关键词。如果采用这种方法，那么像“the hotel is not bad”这样的评论呢？\n\n*   方法 2：将“not\
  \ fantastic”或“not bad”视为一个短语，并根据短语评估其含义。这就是 n-gram 技术的含义。\n\n*   方法 3：将方法 1 和方法\
  \ 2 结合起来。将“not”标记为负面关键词，并将“not fantastic”或“not bad”视为一个短语。\n\n在文本挖掘中，n-gram 是`n`个单词的组合。单个单词可能会遗漏一些含义。“Good”是“not\
  \ good”的反义词，并且在强度上与“very good”不同。应用 gram 可以使我们的文本挖掘活动更精细，但也可能带来更多的复杂性。在本章中，为简单起见，我们只考虑\
  \ 2-gram。这意味着我们将把“not fantastic”或“not bad”视为一个短语。\n\n在前面的例子中，我们没有使用词干提取技术。人们可能不会写“The\
  \ hotel it is fantastic”，而是写成“The hotel it is a fantasy”。“fantasy”和“fantastic”具有相同的词源。为了降低文本挖掘的复杂性，词干提取技术会将“fantasy”视为“fantastic”。另一个例子是将“thanks”与“thank”同等对待。\n\
  \n\n\n## 通过 Excel 学习文本挖掘\n\n让我们切换到 Excel 来练习一个文本挖掘的示例。打开文件 Chapter14-1a.xlsx。其中包含两个工作表。名为“dictionary”的工作表包含一些停用词和一些正面与负面关键词（在工作表中称为极性词）。请注意，这些词汇仅为本次文本挖掘演示而专门收集。图\
  \ 14-1 展示了“dictionary”工作表的一部分。\n\n![](img/494428_2_En_14_Fig1_HTML.jpg)\n\n一个包含\
  \ 3 列 22 行的表格截图。列标题分别为极性词、极性得分和停用词。极性词包括：not、amazing、best、cozy、delightful、enjoy、excellent、fantastic、good、lovely\
  \ 等。\n\n图 14-1\n\n部分极性关键词及其否定形式，以及部分停用词\n\n如图 14-1 所示，dictionary 工作表中的 D 列存储了一些停用词。A\
  \ 列存储了正面和负面的单个关键词及其否定形式的二元词组。B 列存储了每个关键词对应的得分。请注意，“not”被指定为负面关键词（单元格 A2），得分为 -1。除了关键词“not”之外，图\
  \ 14-1 中所有其他单个关键词都是正面的。它们的否定二元词组都被分配了 -1 的得分。为什么？让我用短句“It is not amazing”为例来解释。对于短句“It\
  \ is not amazing”，两个单个关键词“not”和“amazing”分别产生 -1 和 1。二元词组“not amazing”给出 -1；因此，这个短句的总得分等于\
  \ −1 + 1 − 1 = −1：负面。\n\n![](img/494428_2_En_14_Fig2_HTML.jpg)\n\n一个表格的截图。该表格包含两列和二十行。行条目为否定二元词组及其得分。否定词组包括：bad、difficult、expensive、outrageous、ridiculous、rude、sick、terrible、unhappy、unpleasant、not\
  \ bad 等。\n\n图 14-2\n\n单个负面关键词及其否定二元词组\n\n如图 14-2 所示，分配给单个负面关键词的二元词组的得分均为 2。例如，“not\
  \ bad”的得分为 2。为什么？考虑短句“It is not bad”。“not”和“bad”都返回 -1，而“not bad”返回 2。因此，这个短句的总得分为\
  \ −1 − 1 + 2 = 0：中性。\n\n请记住，上述得分分配仅适用于本次文本挖掘任务。我们当然可以根据其他偏好修改“dictionary”。例如，如果我们希望“not\
  \ bad”是正面的，那么我们可以将二元词组“not bad”的得分设为 3。这里使用的评分系统只是一个示例。\n\n为了方便使用这些关键词和停用词，我们希望对它们进行命名。点击主选项卡“公式”➤\
  \ 在出现的菜单中点击“名称管理器”➤ 点击“新建”按钮。此过程在图 14-3 中进行了说明。请注意，名称管理器自 Excel 2010 起可用。\n\n![](img/494428_2_En_14_Fig3_HTML.jpg)\n\
  \n一个 Excel 选项卡的截图，展示了如何为关键词创建名称。点击主选项卡“公式”，然后在出现的菜单中点击“名称管理器”，接着点击“新建”按钮。文本说明：当此菜单出现时，点击“新建”按钮。\n\
