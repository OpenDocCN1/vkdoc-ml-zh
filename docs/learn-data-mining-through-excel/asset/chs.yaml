  \n1.  我们当然可以进一步优化 `training_dataset` 工作表中的 LDA 模型。按照上一章学到的步骤，将求解器应用于训练数据集。\n\n回顾上一章，使用求解器优化模型后，“组间方差”显著减小。然而，在处理这个较小的训练数据集时，应用求解器优化模型后，“组间方差”显著增大。这是一个很好的例子，说明数据样本在数据挖掘中确实很重要。部分结果如图\
