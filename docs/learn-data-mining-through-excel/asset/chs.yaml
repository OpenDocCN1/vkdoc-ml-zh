  \ 完成层次聚类和树状图容易出错，因为需要手动操作。当数据点数量增加时尤其如此。正如我之前提到的，减少错误的一种方法是通过复制工作工作表来保持中间步骤的完整性，类似于我们在\
  \ k-means 聚类中所做的。\n\n我们能否通过 Excel 对数百个数据点进行层次聚类？当然可以。但我们必须首先借助 k-means 聚类。思路是先在较大的数据集上应用\
  \ k-means 聚类（例如，k=7），然后将每个聚类视为一个数据点，再开始层次聚类。\n\n*   文件 Chapter8-HW-1.xlsx 为你提供了练习层次聚类和绘制树状图的机会。需要帮助时，请参考\
  \ Chapter8-HW-1-withAnswers.xlsx。\n\n*   Chapter8-HW-2.xlsx 允许你在更大的数据集上练习层次聚类，因此你需要先应用\
  \ k-means 聚类。Chapter8-HW-2-withAnswers.xlsx 展示了如何实现这一点。该文件还通过保持中间步骤的完整性展示了层次聚类的过程。\n\
  \n*   注意，Chapter8-2e.xlsx 也通过复制工作表来保持中间步骤的完整性，展示了层次聚类的过程。我强烈建议你仔细查看这个文件。\n\n## 复习要点\n\
  \n对于第 8 章，以下知识、技能和函数值得复习：\n\n1.  层次聚类与树状图\n\n2.  凝聚聚类算法\n\n3.  邻近矩阵\n\n4.  Excel\
  \ 内置功能：排序和选择性粘贴（数值）\n\n5.  散点图与数据标签\n\n6.  函数 IF、MIN、IFERROR、INDEX、MATCH、SQRT 和\
  \ SUMXMY2\n\n7.  复制工作表以保持中间步骤的完整性\n\n"
- "# 9. 朴素贝叶斯分类\n\n我们一直在学习的数据挖掘方法都偏好数值型数据：线性回归、LDA、k-means 聚类、逻辑回归、K-NN 和层次聚类。然而，朴素贝叶斯偏好分类型数据。由于其简单性，朴素贝叶斯数据挖掘方法比许多其他数据挖掘方法效率高得多，而其性能仍能与大多数其他数据挖掘方法相媲美。\n\
  \n请从 [`https://github.com/hhohho/Learn-Data-Mining-through-Excel-2`](https://github.com/hhohho/Learn-Data-Mining-through-Excel-2)\
  \ 下载本章练习所需的示例 Excel 文件。\n\n## 总体理解\n\n数据挖掘方法或机器学习模型通常被认为是概率方法/模型。概率计算从训练数据集开始。一个基本原则是，如果属性或目标变量的特定状态\
  \ *S*[*k*] 在给定条件下出现的概率为 *P*[*k*]，那么可以假设在评分数据集的相同条件下，*S*[*k*] 出现的概率仍然是 *P*[*k*]。当你阅读本章以及其他章节（如关联分析和决策树）时，你会发现这个原则的隐含应用，尽管我可能明确提及也可能不提及。\n\
  \n朴素贝叶斯是最常用的分类算法之一。其数学基础是条件概率，它提出了这样一个问题：在给定 x 发生的情况下，事件 y 发生的概率是多少？这里，条件是 x（x 发生或\
  \ x 为真），条件概率表示为 *P*(*y*|*x*)。\n\n条件概率 *P*(*y*|*x*) 的计算公式为\n\n![$$ P\\left(\\left.y\\\
  right|x\\right)=\\frac{P\\left(y\\cap x\\right)}{P(x)}, $$](img/494428_2_En_9_Chapter_TeX_Equ1.png)\n\
  \n(9-1)\n\n其中 *P*(*x*) 表示 x 为真的概率，*P*(*y* ∩ *x*) 表示 x 和 y 同时为真的概率。\n\n类似地，条件概率 *P*(*x*|*y*)\
  \ 的计算公式为\n\n![$$ P\\left(\\left.x\\right|y\\right)=\\frac{P\\left(x\\cap y\\right)}{P(y)},\
  \ $$](img/494428_2_En_9_Chapter_TeX_Equ2.png)\n\n(9-2)\n\n因为 *P*(*y* ∩ *x*)= *P*(*x* ∩ *y*)，所以我们有\
  \ *P*(*y*|*x*)*P*(*x*) = *P*(*x*|*y*)*P*(*y*)。因此，我们可以推导出最简单的贝叶斯定理，如公式 (9-3) 所述：\n\
  \n![$$ P\\left(\\left.y\\right|x\\right)=\\frac{P\\left(\\left.x\\right|y\\right)P(y)}{P(x)},\
  \ $$](img/494428_2_En_9_Chapter_TeX_Equ3.png)\n\n(9-3)\n\n注意，贝叶斯定理将 *P*(*y*|*x*)\
  \ 的计算转换为 *P*(*x*|*y*) 的计算。\n\n公式 (9-3) 隐含地假设 y 是因变量 y 的研究类别，x 是自变量 x 的研究状态。这可能有点令人困惑，因为\
  \ y 必须有多个类别，x 必须有多个状态。别担心，请继续阅读，你会对贝叶斯定理有清晰的理解。\n\n假设 y 有两个类别 y[1] 和 y[2]，让我们针对特定条件\
  \ x[a]（假设 x 有不同的状态/条件，x[a] 是其中之一）下的 y[1] 重写公式 (9-3)，我们得到\n\n![$$ P\\left(\\left.{y}_1\\\
  right|{x}_a\\right)=\\frac{P\\left(\\left.{x}_a\\right|{y}_1\\right)P\\left({y}_1\\\
  right)}{P\\left({x}_a\\right)}, $$](img/494428_2_En_9_Chapter_TeX_Equ4.png)\n\n\
  (9-4)\n\n对 y[2] 重复上述操作，我们得到\n\n![$$ P\\left(\\left.{y}_2\\right|{x}_a\\right)=\\\
  frac{P\\left(\\left.{x}_a\\right|{y}_2\\right)P\\left({y}_2\\right)}{P\\left({x}_a\\\
  right)}, $$](img/494428_2_En_9_Chapter_TeX_Equ5.png)\n\n(9-5)\n\n因为 y 只有两个类别，在条件\
  \ x[a] 下，要么 y[1] 发生，要么 y[2] 发生，即 *P*(*y*[1]|*x*[*a*]) + *P*(*y*[2]|*x*[*a*]) 必须等于\
  \ 1。因此，\n\n![$$ \\frac{P\\left(\\left.{x}_a\\right|{y}_1\\right)P\\left({y}_1\\\
  right)}{P\\left({x}_a\\right)}+\\frac{P\\left(\\left.{x}_a\\right|{y}_2\\right)P\\\
  left({y}_2\\right)}{P\\left({x}_a\\right)}=1 $$](img/494428_2_En_9_Chapter_TeX_Equa.png)\n\
  \n即，*P*(*x*[*a*]) = *P*(*x*[*a*]|*y*[1])*P*(*y*[1]) + *P*(*x*[*a*]|*y*[2])*P*(*y*[2])。因此，我们最终可以得到\n\
  \n![$$ P\\left(\\left.{y}_1\\right|{x}_a\\right)=\\frac{P\\left(\\left.{x}_a\\right|{y}_1\\\
  right)P\\left({y}_1\\right)}{P\\left(\\left.{x}_a\\right|{y}_1\\right)P\\left({y}_1\\\
  right)+P\\left(\\left.{x}_a\\right|{y}_2\\right)P\\left({y}_2\\right)} $$](img/494428_2_En_9_Chapter_TeX_Equ6.png)\n\
  \n(9-6)\n\n\n\n贝叶斯定理的精妙之处在于，它将计算 *P*(*y*[1]|*x*[*a*]) 转化为计算 *P*(*x*[*a*]|*y*[1])\
  \ 和 *P*(*x*[*a*]|*y*[2])！在数据挖掘中思考这个问题。给定已知 y 的训练数据集，我们可以轻松计算出 *P*(*x*[*a*]|*y*[1])、*P*(*x*[*a*]|*y*[2])、*P*(*y*[1])\
  \ 和 *P*(*y*[2])。现在对于评分数据集，y 未知但 x 已知。如果 x 是 x[a]，那么我们可以利用公式 (9-6) 来预测在 x[a] 条件下\
  \ y[1] 的发生概率。\n\n公式 (9-6) 假设只有一个独立属性 x。在大多数情况下，存在多个独立属性（`x`[`1`]`,x`[`2`]`,...,x`[`n`]）来对\
  \ y 进行分类，并且 y 可能有两个以上的类别。假设 y 有 `m` 个不同的类别，并且在条件（`x`[`1`]`,x`[`2`]`,...,x`[`n`]）下，令\n\
  \n![$$ {P}^{\\prime}\\left(\\left.{y}_k\\right|x\\right)=P\\left({x}_1|{y}_k\\right)P\\\
  left({x}_2|{y}_k\\right)\\cdots P\\left({x}_n|{y}_k\\right)P\\left({y}_k\\right)\
  \ $$](img/494428_2_En_9_Chapter_TeX_Equ7.png)\n\n(9-7)\n\n根据我们之前的内容，不难推导出最终的 *P*(*y*[*k*]|*x*)，即在条件（`x`[`1`]`,x`[`2`]`,...,x`[`n`]）下第\
  \ k 个 y 类别的概率，可以通过以下公式计算：\n\n![$$ P\\left(\\left.{y}_k\\right|x\\right)=\\frac{P^{\\\
  prime}\\left(\\left.{y}_k\\right|x\\right)}{\\sum \\limits_i^m{P}^{\\prime}\\left(\\\
  left.{y}_i\\right|x\\right)} $$](img/494428_2_En_9_Chapter_TeX_Equ8.png)\n\n(9-8)\n\
  \n当然，![$$ \\sum \\limits_i^mP\\left(\\left.{y}_i\\right|x\\right)=1 $$](img/494428_2_En_9_Chapter_TeX_IEq1.png)\
  \ 。\n\n我们将使用表 9-1 中的示例来实现上述概念。\n\n表 9-1 中的数据模拟了一个图像分析案例，该案例根据所拍摄图像的特征（属性）来确定某种癌症的发生。请注意，表中的数据是虚构的，不代表有效的图像或癌症分析方法。\n\
  \n表 9-1\n\n用于朴素贝叶斯分析的虚构样本数据\n\n| 编号 | 尺寸 | 数量 | 厚度 | 肺癌 |\n| --- | --- | --- | ---\
  \ | --- |\n| 1 | 大 | 低 | 深 | 是 |\n| 2 | 大 | 多 | 深 | 是 |\n| 3 | 正常 | 多 | 浅 | 否 |\n\
  | 4 | 大 | 低 | 浅 | 否 |\n| 5 | 大 | 多 | 深 | 是 |\n| 6 | 正常 | 多 | 深 | 是 |\n| 7 | 大 |\
  \ 低 | 浅 | 否 |\n| 8 | 大 | 多 | 浅 | 是 |\n| 9 | 大 | 多 | 深 | 是 |\n| 10 | 正常 | 低 | 深 |\
  \ 否 |\n| 评分 | 大 | 多 | 深 | ??? |\n\n共有三个属性：尺寸、数量和厚度（将它们视为 x[1]、x[2] 和 x[3]）。每个属性有两个不同的值。目标变量是肺癌，它有两个不同的类别：是和否。在表\
  \ 9-1 中，有十条训练数据记录，最后一条是评分记录，我们需要根据这三个属性值来预测其类别。\n\n基于公式 (9-7) 和 (9-8)，评分记录为“是”的概率通过以下公式计算：\n\
  \n![$$ \\mathrm{P}\\left(\\mathrm{yes}|&lt;\\mathrm{big},\\mathrm{over},\\mathrm{deep}&gt;\\\
  right)= $$](img/494428_2_En_9_Chapter_TeX_Equb.png)\n\n![$$ \\frac{\\mathrm{p}\\\
  left(\\mathrm{big}|\\mathrm{yes}\\right)\\times \\mathrm{p}\\left(\\mathrm{over}|\\\
  mathrm{yes}\\right)\\times \\mathrm{p}\\left(\\mathrm{deep}\\ |\\ \\mathrm{yes}\\\
  right)\\times \\mathrm{p}\\left(\\mathrm{yes}\\right)}{\\mathrm{p}\\left(\\mathrm{big}|\\\
  mathrm{yes}\\right)\\times \\mathrm{p}\\left(\\mathrm{over}|\\mathrm{yes}\\right)\\\
  times \\mathrm{p}\\left(\\mathrm{deep}\\ |\\ \\mathrm{yes}\\right)\\times \\mathrm{p}\\\
  left(\\mathrm{yes}\\right)+\\mathrm{p}\\left(\\mathrm{big}\\ |\\mathrm{no}\\right)\\\
  times \\mathrm{p}\\left(\\mathrm{over}\\ |\\mathrm{no}\\right)\\times \\mathrm{p}\\\
  left(\\mathrm{deep}|\\mathrm{no}\\right)\\times \\mathrm{p}\\left(\\mathrm{no}\\\
  right)} $$](img/494428_2_En_9_Chapter_TeX_Equc.png)\n\n当然，我们需要计算以下各项：\n\n1.  p(是)\
  \ = 6/10，因为 10 条记录中有 6 条“是”。\n2.  p(否) = 4/10，因为 10 条记录中有 4 条“否”。\n3.  p(大|是) =\
  \ 5/6。当类别为“是”时，相应地有 5 个“大”。\n4.  p(多|是) = 5/6。当类别为“是”时，相应地有 5 个“多”。\n5.  p(深|是)\
  \ = 5/6。当类别为“是”时，相应地有 5 个“深”。\n6.  p(大|否) = 2/4。当类别为“否”时，相应地有 2 个“大”。\n7.  p(多|否)\
  \ = 1/4。当类别为“否”时，相应地有 1 个“多”。\n8.  p(深|否) = 1/4。当类别为“否”时，相应地有 1 个“深”。\n\n因此，\n\n\
  ![$$ P\\left( yes|&lt; big, over, deep&gt;\\right)= $$](img/494428_2_En_9_Chapter_TeX_Equd.png)\n\
  \n![$$ \\frac{\\left(5/6\\right)\\times \\left(5/6\\right)\\times \\left(5/6\\right)\\\
  times \\left(6/10\\right)}{\\left(5/6\\right)\\times \\left(5/6\\right)\\times \\\
  left(5/6\\right)\\times \\left(6/10\\right)+\\left(2/4\\right)\\times \\left(1/4\\\
  right)\\times \\left(1/4\\right)\\times \\left(4/10\\right)} $$](img/494428_2_En_9_Chapter_TeX_Eque.png)\n\
  \n最终答案是 0.965。这表明评分记录为“是”（肺癌阳性）的概率是 0.965。\n\n当然，朴素贝叶斯分类的数学背景比逻辑回归、LDA 和 K-NN 相对简单得多。这是朴素贝叶斯分类在数据量较大时能够拥有出色计算效率的重要原因。此外，尽管朴素贝叶斯做出了一个“朴素”的假设，即所有属性相互独立，但与许多其他分类数据挖掘模型相比，朴素贝叶斯确实具有不错的性能。\n\
  \n## 通过 Excel 学习朴素贝叶斯\n\n在本章中，我们将通过 Excel 练习两个示例。第一个示例与表 9-1 相同。第二个示例模拟了一个类似的图像分析案例。然而，数据更复杂，数据量也大得多。\n\
  \n\n\n### 练习 1\n\n文件 Chapter9-1a.xlsx 包含与表 9-1 所示相同的数据。其中只有十个训练样本和一个评分样本。将样本量设置得较小是为了更好地进行说明。一旦我们通过这个简单的例子积累了足够的经验，我们将处理另一个更复杂的数据集。\n\
  \n在 Chapter9-1a.xlsx 中，数据已在工作表中设置好以便于处理，如图 9-1 所示。我们需要做的是完成朴素贝叶斯分析所需的必要计算。\n\n![](img/494428_2_En_9_Fig1_HTML.jpg)\n\
  \n一张 Excel 截图展示了朴素贝叶斯数据设置。它包含样本量、大小、数量和厚度的数据，以及一个列标题为数量、大小、数量、厚度和肺癌的表格。\n\n图 9-1\n\
  朴素贝叶斯数据设置\n\n要应用朴素贝叶斯方法预测评分记录的类别，我们首先需要基于训练数据构建模型。请遵循以下说明：\n\n![](img/494428_2_En_9_Fig2_HTML.jpg)\n\
  \n一张 Excel 截图展示了部分朴素贝叶斯分析。它包含一个列标题为“是”和“否”的表格。行标题为计数、概率、大和正常。\n\n图 9-2\n朴素贝叶斯分析部分完成\n\
  \n1.  在单元格 B1 中输入 10，因为只有十条训练记录。\n\n2.  在单元格 C3 中输入公式 `=COUNTIF($E$13:$E$22,C$2)`。这将计算目标变量“肺癌”中类别为“是”的数量。从单元格\
  \ C3 自动填充到单元格 D3。单元格 D3 存储类别为“否”的数量。\n\n3.  在单元格 C4 中输入公式 `=C$3/$B$1`，然后从单元格 C4\
  \ 自动填充到单元格 D4。单元格 C4 和 D4 分别引用 p(是) 和 p(否)。\n\n4.  在单元格 C5 中输入以下公式：\n\n```\n   \
  \ =COUNTIFS($E$13:$E$22,C$2,$B$13:$B$22,$B5)/C$3\n    ```\n\n5.  从单元格 C5 自动填充到单元格\
  \ C6，然后一起自动填充到单元格 D5:D6。单元格 C5、C6、D5 和 D6 分别表示概率 p(大|是)、p(正常|是)、p(大|否) 和 p(正常|否)。回想一下，p(大|是)\
  \ 是条件概率：给定“是”的情况下，大小 = “大”的概率。\n\n此时，我们的工作表部分看起来如图 9-2 所示。\n\n![](img/494428_2_En_9_Fig4_HTML.jpg)\n\
  \n一张 Excel 截图展示了朴素贝叶斯分类。它包含一个列标题为数量、大小、数量、厚度和肺癌的表格。它有 10 行数据以及一行评分结果。\n\n图 9-4\n\
  朴素贝叶斯分类完成\n\n1.  在单元格 C7 中输入以下公式：\n\n```\n    =COUNTIFS($E$13:$E$22,C$2,$C$13:$C$22,$B7)/C$3\n\
  \    ```\n\n2.  从单元格 C7 自动填充到单元格 C8，然后一起自动填充到单元格 D7:D8。单元格 C7、C8、D7 和 D8 分别引用概率\
  \ p(过高|是)、p(低|是)、p(过高|否) 和 p(低|否)。\n\n3.  在单元格 C9 中输入以下公式：\n\n```\n    =COUNTIFS($E$13:$E$22,C$2,$D$13:$D$22,$B9)/C$3\n\
  \    ```\n\n4.  从单元格 C9 自动填充到单元格 C10，然后一起自动填充到单元格 D9:D10。单元格 C9、C10、D9 和 D10 分别引用概率\
  \ p(深|是)、p(浅|是)、p(深|否) 和 p(浅|否)。\n\n到目前为止，我们的工作表应该与图 9-3 所示相同。如果有差异，请检查单元格 C3:D10\
  \ 内的公式。\n\n![](img/494428_2_En_9_Fig3_HTML.jpg)\n\n一张 Excel 截图展示了朴素贝叶斯数据准备。它包含计数、概率、大和正常大小、过高和低数量、以及深和浅厚度的数值数据。\n\
  \n图 9-3\n朴素贝叶斯数据准备\n\n按照以下说明继续我们的朴素贝叶斯数据挖掘过程：\n\n5.  分别在单元格 F22、G22 和 H22 中输入“p’(评分|是)”、“p’(评分|否)”和“P(是|评分)”。\n\
  \n6.  在单元格 F23 中输入以下公式：\n\n```\n    =SUMIF($B$5:$B$10,$B23,C$5:C$10) * SUMIF($B$5:$B$10,$C23,C$5:C$10)\
  \ * SUMIF($B$5:$B$10,$D23,C$5:C$10)*C$4\n    ```\n\n上述公式计算了在给定类别为“是”的情况下评分记录的概率。它实现了公式\
  \ (9-7)。请注意，函数 `SUMIF` 的语法与 `SUMIFS` 不同。例如，`SUMIF($B$5:$B$10,$B23,C$5:C$10)` 仅当数组\
  \ B5:B10 中对应的单元格与单元格 B23 的值相同时，才对数组 C5:C10 中的单元格求和。如果我们想使用函数 `SUMIFS` 达到相同目的，则表达式应为\
  \ `SUMIFS(C$5:C$10,$B$5:$B$10,$B23)`。\n\n7.  从单元格 F23 自动填充到单元格 G23。单元格 G23 引用在给定类别为“否”的情况下评分记录的概率。\n\
  \n8.  在单元格 H23 中输入公式 `=F23/(F23+G23)`，该公式实现了公式 (9-8)。\n\n9.  在单元格 E23 中输入公式 `=IF(H23>0.5,\"\
  是\",\"否\")`。\n\n至此，我们完成了朴素贝叶斯分类的首次尝试。我们的结果应与图 9-4 所示相同。完整结果可在文件 Chapter9-1b.xlsx\
  \ 中找到。\n\n\n\n### 练习 2\n\n希望到目前为止，你已经对如何在 Excel 中进行朴素贝叶斯分类有了一定的了解。接下来，我们看一个更复杂的例子。\n\
  \n打开文件 `Chapter9-2a.xlsx`，其中包含与 `Chapter9-1a.xlsx` 类似的随机生成数据。在 `Chapter9-2a.xlsx`\
  \ 中，训练数据集包含 1978 个样本，目标变量“肺癌”有四个不同的类别。这四个类别分别是：阴性、1 期、2 期和 3 期。此外，三个预测变量均具有两个以上的分类值。请注意，朴素贝叶斯方法仅适用于分类值。如果我们的数据值不是分类值而是数值，则必须在应用朴素贝叶斯分类方法之前将其转换为分类值。\n\
  \n仔细查看数据。工作表的一部分如图 9-5 所示。训练数据集的范围是从第 34 行到第 2011 行。评分数据集的范围是从第 21 行到第 30 行。\n\n\
  ![](img/494428_2_En_9_Fig5_HTML.jpg)\n\n一个 Excel 截图展示了设置。它包含行标题，如计数、概率，以及尺寸下的超大、大、中、小和无，数字下的刻度\
  \ 1 到 5，以及厚度下的浅色、灰色和深色。列标题是阴性和 1 期到 3 期。\n\n图 9-5\n练习 2 的设置\n\n按照以下说明对给定数据集完成朴素贝叶斯分类：\n\
  \n![](img/494428_2_En_9_Fig6_HTML.jpg)\n\n一个 Excel 截图。行标题是尺寸、数字和厚度。列标题是阴性和 1 期到\
  \ 3 期。它包含不同尺寸（如超大、大、中、小和无）的数值数据。\n\n图 9-6\n检查我们当前的数据\n\n1.  在单元格 C3 中输入以下公式，然后从单元格\
  \ C3 自动填充到单元格 F3：\n\n```\n    =COUNTIF($E$34:$E$2011,C2)\n    ```\n\n2.  在单元格 C4\
  \ 中输入公式 `=C3/$B$1`，并从单元格 C4 自动填充到 F4。单元格 C4:F4 引用了每个类别的概率。\n\n3.  要计算 p(超大|阴性)，请在单元格\
  \ C5 中输入以下公式：\n\n```\n    =COUNTIFS($B$34:$B$2011,$B5,$E$34:$E$2011,C$2)/C$3\n \
  \   ```\n\n4.  从单元格 C5 自动填充到 F5，然后一起自动填充到单元格 C9:F9。\n\n此时，检查我们的工作表是否与图 9-6 中显示的内容相似。根据数字格式，我们工作表中单元格\
  \ C4:F9 中小数的最后几位数字可能与图 9-6 中的不同。在继续之前，请确保我们的公式是正确的。\n\n![](img/494428_2_En_9_Fig8_HTML.jpg)\n\
  \n一个 Excel 截图展示了评分数据。它包含一个表格，列标题为样本 ID、尺寸、数字、厚度和肺癌。右侧有概率计算。\n\n图 9-8\n计算评分数据集的概率\n\
  \n1.  要计算 p(刻度-1|阴性)，请在单元格 C10 中输入以下公式：\n\n```\n    =COUNTIFS($C$34:$C$2011,$B10,$E$34:$E$2011,C$2)/C$3\n\
  \    ```\n\n2.  从单元格 C10 自动填充到单元格 F10，然后一起自动填充到单元格 C14:F14。\n\n3.  要计算 p(浅色|阴性)，请在单元格\
