  \ 以及 5 个子列 cluster、C 1、C 2、C 3 和 C 4，还有 old cluster 和 difference。\n\n图 3-12\n\n\
  工作表 5 中五轮后的 K-means 聚类\n\n1.  再次重复聚类过程：将工作表 4 复制到工作表 5；确保新工作表命名为 5 并位于工作表 4 的右侧。收敛值变为\
  \ 0，如图 3-12 所示。\n\n![](img/494428_2_En_3_Fig13_HTML.jpg)\n\n一个表格展示了使用 K-means 聚类算法的数据。该表格包含\
