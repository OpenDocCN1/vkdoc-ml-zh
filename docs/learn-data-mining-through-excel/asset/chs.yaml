  \n2.  COUNTIF、COUNTIFS 和 SUMIF 函数以及连接运算符&。\n\n3.  INDEX、MATCH 和 TEXT 函数。\n\n"
- "# 10. 决策树\n\n决策树可能是最直观的数据分类和预测方法，它也被频繁使用。虽然我们学过的大多数数据挖掘方法都是参数化的，但决策树是一种基于规则的方法。理解决策树最关键的概念是熵，我们很快就会解释它。树由节点组成，叶子节点是最底层的节点。在每个非叶子节点处，必须做出决策，将该节点至少分成两个分支。图\
  \ 10-1 描绘了一个示例决策树结构。\n\n![](img/494428_2_En_10_Fig1_HTML.jpg)\n\n一个决策树结构。节点 N1 被细分为节点\
  \ N2_1、N2_2 和 N2_3。节点 N2_1 被细分为 N3_1 和 L1。节点 N2_2 被细分为 L2 和 L3。节点 N2_3 被细分为 L4、N3_2\
  \ 和 L5。节点 N3_1 被细分为 L6 和 L7。节点 N3_2 被细分为 L8 和 L9。\n\n图 10-1\n\n一个示例决策树结构\n\n在图 10-1\
  \ 中，所有节点都以字母“N”开头，而所有叶子节点都以字母“L”开头。在决策树中，一个节点可以分裂成两个或更多的子节点。然而，叶子节点永远不能再被分裂。决策树中最关键的操作是确定如何分裂一个节点。尽管每个节点都适用一个通用规则，但必须根据每个节点内部的数据单独考虑。\n\
  \n请从[`https://github.com/hhohho/Learn-Data-Mining-through-Excel-2`](https://github.com/hhohho/Learn-Data-Mining-through-Excel-2)下载本章练习所需的示例\
  \ Excel 文件。\n\n## 总体理解\n\n决策树中节点如何分裂，是基于该节点内部数据计算出的熵。熵表示树节点内部数据的“纯净”程度。熵越高，数据越不纯净。让我们学习如何计算熵，以便更好地理解。\n\
  \n假设一个数据集的目标变量有`m`个不同的类别。该数据集的熵通常根据公式(10-1)计算：\n\n![$$ H=-\\sum \\limits_{k=1}^m{P}_K{\\\
  log}_2\\left({P}_k\\right) $$](img/494428_2_En_10_Chapter_TeX_Equ1.png)\n\n(10-1)\n\
  \n在公式(10-1)中，*P*[*K*]是第 k 个类别出现的概率；它用于对 log2 进行加权。例如，假设有 10 个数据项，其中 3 个是“是”，7 个是“否”。由于只有两个不同的类别（是或否），所以`m`\
  \ = 2。\n\n*   对于“是”，*p* = 3/10 = 0.3，log2 = -1.74，*p*log2 = -0.52。\n\n*   对于“否”，*p*\
  \ = 7/10 = 0.7，log2 = -0.51，*p*log2 = -0.36。\n\n*   H = -(-0.52 - 0.36) = 0.88。\n\
  \n如果有 10 个“是”和 0 个“否”，计算如下：\n\n*   对于“是”，*p* = 10/10 = 1，log2 = 0，*p*log2 = 0。\n\
  \n*   对于“否”，*p* = 0/10 = 0，*p*log2 = 0（假设 log2 不是错误）。\n\n*   H = -(0 + 0) = 0。\n\
  \n如果有 5 个“是”和 5 个“否”，计算得出 H = 1.0。\n\n似乎数据越偏向某个类别，熵就越低。决策树方法倾向于选择能产生最小熵的属性来分裂节点。这很容易理解。假设我们面前有两条路，需要选择一条到达目的地。如果两条路让我们准时到达的可能性相同，我们会发现自己犹豫不决（H=1）。如果某条路让我们准时到达的可能性明显大得多，我们的决定就不会困难。此外，如果只有一条路，我们的选择就是确定的（H\
  \ = 0）。\n\n在公式(10-1)中，使用了以 2 为底的对数。以 2 为底的对数是决策树中最常用的对数函数。当数据集中只有两个类别时，以 2 为底的对数能保证熵在\
  \ 0 到 1 之间（包含端点）。当类别超过两个时，以 2 为底的对数不能保证熵在 0 到 1 之间。如果我们希望熵在 0 到 1 之间，那么当有 N 个不同类别时，必须使用以\
  \ N 为底的对数函数。\n\n让我们使用著名的高尔夫数据集（也称为天气数据集）来解释如何构建决策树。\n\n表 10-1\n\n打高尔夫数据集\n\n| Temperature\
  \ | Humidity | Windy | Outlook | Play |\n| --- | --- | --- | --- | --- |\n| Hot\
  \ | High | FALSE | overcast | Yes |\n| Cool | Normal | TRUE | overcast | Yes |\n\
  | Mild | High | TRUE | overcast | Yes |\n| Hot | Normal | FALSE | overcast | Yes\
  \ |\n| Mild | High | FALSE | rainy | Yes |\n| Cool | Normal | FALSE | rainy | Yes\
  \ |\n| Cool | Normal | TRUE | rainy | No |\n| Mild | Normal | FALSE | rainy | Yes\
  \ |\n| Mild | High | TRUE | rainy | No |\n| Hot | High | FALSE | sunny | No |\n\
  | Hot | High | TRUE | sunny | No |\n| Mild | High | FALSE | sunny | No |\n| Cool\
  \ | Normal | FALSE | sunny | Yes |\n| Mild | Normal | TRUE | sunny | Yes |\n\n这个数据集非常简单。它只有\
  \ 14 个样本和 4 个属性。是否打高尔夫取决于这 4 个属性。基于这个训练数据集构建决策树，首要任务是从一开始就找到一个属性，将树分裂成多个分支。为此，我们需要计算目标变量\
  \ Play 的熵，以及 4 个属性相对于目标变量的熵。\n\n对于目标变量 Play，有 9 个 Yes 和 5 个 No；因此，根据公式(10-1)\n\n\
  ```\nH-play = -(9/14×log2(9/14)+5/14×log2(5/14)) = 0.94\n```\n\n\n\n对于属性 Outlook（天气），共有\
  \ 3 个值（状态）：阴天（overcast）、雨天（rainy）和晴天（sunny）；每个值分别有 4、5 和 5 个数据点。考虑阴天的情况，4 个阴天对应\
  \ 4 个“是”和 0 个“否”。因此，\n\n```\nH-outlook-overcast = -(4/4×log2(4/4)+0/4×log2(0/4))\
  \ = 0.0\n```\n\n注意，此处 log2(0) = 0。\n\n类似地，5 个雨天对应 3 个“是”和 2 个“否”，5 个晴天对应 2 个“是”和\
  \ 3 个“否”。因此，\n\n```\nH-outlook-rainy = -(3/5×log2(3/5)+2/5×log2(2/5)) = 0.97\nH-outlook-sunny\
  \ = -(2/5×log2(2/5)+3/5×log2(3/5)) = 0.97\n```\n\n这三个子熵值在求和之前必须进行加权。阴天、雨天和晴天的权重分别为\
  \ 4/14、5/14 和 5/14。因此，\n\n```\nH-outlook = 4/14×0.0+5/14×0.97+5/14×0.97 = 0.69\n\
  ```\n\n继续对温度（Temperature）、湿度（Humidity）和风（Windy）进行此计算；我们得到\n\n```\nH-temperature\
  \ = 0.91\nH-humidity = 0.79\nH-windy = 0.89\n```\n\n这里引入另一个概念：“信息增益”（information\
  \ gain），它表示基于某个属性划分当前数据集所能获得的信息量。其定义为目标变量的熵与某个属性的熵之差。例如，Outlook 的信息增益 = 0.94 – 0.69\
  \ = 0.25。\n\n信息增益可能会偏向于取值较多的属性。为了减少这种偏差，可以使用“增益率”（gain ratio）。某个属性的增益率定义为\n\n* \
  \  属性增益率 = 属性信息增益 / 属性固有信息\n\n属性的固有信息通过公式（10-2）计算：\n\n![$$ S=-\\sum \\limits_{k=1}^C\\\
  frac{N_k}{N}{\\log}_2\\left(\\frac{N_k}{N}\\right) $$](img/494428_2_En_10_Chapter_TeX_Equ2.png)\n\
  \n（10-2）\n\n在公式（10-2）中，*N* 表示数据量，*N*[*k*] 是给定属性值的数据点数量，而 C 是某个属性的不同取值个数。\n\n让我们再次以属性\
  \ Outlook 为例来应用公式（10-2）。\n\n*   Outlook 有三个不同的取值：阴天、雨天和晴天。因此，C = 3。\n\n*   有 4 个阴天；因此，N-阴天\
  \ = 4。\n\n*   类似地，N-雨天 = 5 且 N-晴天 = 5。\n\n属性 Outlook 的固有信息计算如下：\n\n```\nS-outlook\n\
  = -(4/14×Log2(4/14)+5/14×Log2(5/14)+5/14×Log2(5/14))\n= 1.58\n```\n\n属性 Outlook\
  \ 的最终增益率 `= (0.94–0.69)/1.58 = 0.16`。\n\n由于在我们的决策树示例中，信息增益是衡量节点分裂的一个良好指标，我们不会为每个属性计算增益率。相反，会选择信息增益最大的属性来分裂树节点。在这种情况下，选择\
  \ Outlook 将树节点根据三个值（阴天、雨天和晴天）分裂为三个子节点。\n\n由于阴天节点的熵为 0.0，它必定是一个叶节点。另外两个节点，即雨天节点和晴天节点，可以进一步根据温度、风或湿度进行划分。\n\
  \n## 通过 Excel 学习决策树\n\n上述计算可能非常繁琐且容易出错。让我们使用 Excel 来简化这个过程。打开 Chapter10-1a.xlsx；里面只有一个名为\
  \ level-1 的工作表（level-1 表示这是树节点的第一层）。Chapter10-1a.xlsx 中的数据与表 10-1 完全相同，如图 10-2 所示。\n\
  \n![](img/494428_2_En_10_Fig2_HTML.jpg)\n\n一张 Excel 中高尔夫数据的截图，包含 A 到 E 列以及第 1 到\
  \ 14 行。列标题分别为温度、湿度、风、天气和是否打球。每个单元格都包含数据。\n\n图 10-2\n\nExcel 中的高尔夫数据\n\n### 通过 Excel\
  \ 学习决策树\n\n我们需要将数据设置在一个合适的表格中，以便能够自动填充公式。我们在前面的章节中已经见过这样的表格组织方式。\n\n![](img/494428_2_En_10_Fig5_HTML.jpg)\n\
  \n一张 Excel 截图。包含数据的单元格有 A22 到 A31（分别为 1, 1, 1, 2, 2, 3, 3, 4, 4, 4），B22 到 B24 是温度，C22\
  \ 是热，C23 是温和，C24 是凉爽，D21 是“是”，E21 是“否”，F21 是 p 乘以 log(p)，G21 是 p 乘以 log(p) 减去 r，H21\
  \ 是加权，I21 是熵，J21 是信息增益。\n\n图 10-5\n\n处理中的表格设置\n\n1.  在单元格 A16 中输入“样本大小”，在单元格 B16\
  \ 中输入 14。14 是数据量。\n\n2.  在单元格 E17 中输入“p*log(p)”。p*log(p) 代表公式（10-1）中的 *P*[*K*]log2。\n\
  \n3.  在单元格 F17 中输入“熵”。\n\n4.  合并单元格 B18 和 B19；在合并后的单元格中输入“是否打球”。\n\n5.  在单元格 C18\
  \ 中输入“是”，在单元格 C19 中输入“否”。\n\n到目前为止，我们的工作表部分看起来像图 10-3，只是我们的工作表中单元格 D18 或 D19 没有数字。别担心，我们很快就会计算它们。\n\
  \n![](img/494428_2_En_10_Fig3_HTML.jpg)\n\n一张 Excel 中高尔夫数据的截图，包含 A 到 F 列以及第 14 到\
  \ 20 行。包含数据的单元格有 A16 是样本大小，B16 是 14，E17 是 p 乘以 log(p)，F17 是熵，B18 和 B19 是是否打球，C18\
  \ 是“是”，C19 是“否”，D18 是 9，D19 是 5。\n\n图 10-3\n\n高尔夫数据集及“是否打球”的表格设置\n\n按照以下说明完成目标变量“是否打球”的熵的计算：\n\
  \n6.  在单元格 D18 中，输入公式 `=COUNTIFS($E$2:$E$15,C18)`。这会统计“是否打球”中“是”的数量。\n\n7.  从单元格\
  \ D18 自动填充到单元格 D19。D19 统计“是否打球”中“否”的数量。\n\n8.  在单元格 E18 中，输入公式 `=D18/$B$16*LOG(D18/$B$16,2)`。此公式计算\
  \ P[是] × Log2(P[是])。\n\n9.  从 E18 自动填充到 E19。E19 计算 P[否] × Log2(P[否])。\n\n10. 合并单元格\
  \ F18 和 F19；在合并后的单元格中输入公式 `=-SUM(E18:E19)`。结果就是目标变量“是否打球”的熵。\n\n我们的工作表看起来像图 10-4。\n\
  \n![](img/494428_2_En_10_Fig4_HTML.jpg)\n\n一张 Excel 截图。包含数据的单元格有 A16 是样本大小，B16 是\
