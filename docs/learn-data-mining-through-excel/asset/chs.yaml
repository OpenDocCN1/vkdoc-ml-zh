  Chapter4-1a.xlsx 包含著名的鸢尾花数据集，它是进行 LDA 实践的绝佳样本。在鸢尾花数据集中，四个属性 x1、x2、x3 和 x4 是一些用于确定鸢尾花类型（即目标变量）的花卉特征。这是训练数据集。请注意，目标变量有三个不同的值，即目标变量有三个类别。请按照以下说明操作：\n\
  \n1.  打开 Chapter4-1a.xlsx；在单元格 F1 中输入“y”（不含引号）。\n\n2.  在单元格 K1、K2 和 K3 中，分别输入 0、1\
  \ 和 2。\n\n3.  在单元格 L1、L2 和 L3 中，分别输入 Iris-setosa、Iris-versicolor 和 Iris-virginica。我们的工作表如图\
