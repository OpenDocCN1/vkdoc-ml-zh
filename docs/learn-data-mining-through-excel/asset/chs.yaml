- "# 2. 线性回归\n\n请从 [`https://github.com/hhohho/Learn-Data-Mining-through-Excel-2`](https://github.com/hhohho/Learn-Data-Mining-through-Excel-2)\
  \ 下载本章练习所需的示例 Excel 文件。\n\n## 总体理解\n\n线性回归是一种预测模型，它利用训练数据构建一个线性模型，以便对评分数据进行预测。当我们谈论线性模型时，意味着目标变量（因变量）与属性（自变量）之间的关系是线性的。在回归分析中，通常使用术语“自变量”和“因变量”。因此，在本章中，我们将用自变量替换属性，并用因变量替换目标变量。\n\
  \n在线性回归分析中，可能有一个或多个自变量。当只有一个自变量时，线性模型用常见的线性函数 `y = mx + b` 表示，其中 `y` 是因变量，`m` 是直线的斜率，`b`\
  \ 是 y 轴截距。在大多数情况下，会有多个自变量；因此，线性模型表示为 `y = m`[`1`]`x`[`1`] `+ m`[`2`]`x`[`2`] `+\
  \ ... + m`[`n`]`x`[`n`] `+ b`，其中有 `n` 个自变量，`m`[`i`] 是与特定自变量 `x`[`i`] 相关的系数，其中 `i\
  \ = 1 ... n`。要构建这样的线性模型，我们需要根据训练数据集中已知的 `y` 和 `x`[`i`] 值来找到 `m`[`i`] 和 `b` 的值。\n\
  \n让我们开始一个场景来了解线性回归能做什么。在一个南方海滩小镇，超市经理汤米正考虑根据天气预报预测冰淇淋销量。他收集了一些数据，这些数据将夏季一周内日均最高气温与冰淇淋销量联系起来。训练数据如表\
  \ 2-1 所示。\n\n表 2-1\n\n冰淇淋销量与气温的关系\n\n| 气温（华氏度） | 冰淇淋销量（千美元） |\n| --- | --- |\n|\
  \ 91 | 89.8 |\n| 87 | 90.2 |\n| 86 | 81.1 |\n| 88 | 83.0 |\n| 92.8 | 90.9 |\n| 95.2\
  \ | 119.0 |\n| 93.3 | 94.9 |\n| 97.7 | 132.4 |\n\n将上述数据输入 Excel 工作表。请注意，在此场景中，气温是唯一的自变量，冰淇淋销量是因变量。根据给定的数据，汤米绘制了一个散点图。图表如图\
  \ 2-1 所示。\n\n![](img/494428_2_En_2_Fig1_HTML.png)\n\n一个散点图，绘制了销量与气温的关系，标题为“冰淇淋销量（千美元）”。数据点从\
  \ (86, 81.1) 开始，上升到 (95.2, 119)，并在 (97.7, 132.4) 达到峰值。\n\n图 2-1\n\n气温与冰淇淋销量\n\n\
  根据图 2-1 中的图表，如果预测下周的日均最高气温平均值为 88.8 华氏度，汤米发现很难预测销量，因为没有数据点直接对应 88.8 度。右键单击一个数据点；会显示一个小菜单。在菜单上，单击“添加趋势线”，如图\
  \ 2-2 所示。\n\n![](img/494428_2_En_2_Fig2_HTML.jpg)\n\n一个散点图，绘制了销量与气温的关系，标题为“冰淇淋销量（千美元）”。数据点从\
  \ (86, 81.1) 开始，上升到 (95.2, 119)，并在 (97.7, 132.4) 达到峰值。右键单击数据点 (95.2, 119)，会显示一个选项列表，从列表中选择“添加趋势线”。\n\
  \n图 2-2\n\n添加趋势线\n\n图表中会出现一条趋势线，如图 2-3 所示。请注意，默认情况下，图 2-3 中的线不是实心红线，并且不会显示方程。弄清楚如何将趋势线格式化为实心红线以及如何在图表上显示方程，将是一个很好的练习。要在图表上显示方程，请右键单击图表中的趋势线\
  \ ➤ 选择“设置趋势线格式…” ➤ 勾选“在图表上显示公式”。\n\n![](img/494428_2_En_2_Fig3_HTML.png)\n\n\n\n\
  一张散点图绘制了销售额与温度的关系，标题为“冰淇淋销售额（单位：千美元）”。数据点从 (86, 81.1) 开始，上升到 (95.2, 119)，并在 (97.7,\
  \ 132.4) 达到峰值。回归线呈上升趋势，其方程为 y = 3.8394 * x - 253.17。\n\n图 2-3\n\n使用趋势线进行预测\n\n利用这条线性线，Tommy\
  \ 可以估算出当温度 = 88.8 时，销售额约为 8.9 万美元。使用方程 *y* = 3.8394*x* − 253.17，其中 `m` = 3.8394，`b`\
  \ = -253.17，Tommy 可以更精确地预测他的冰淇淋销售额：\n\n```\n3.8394 × 88.8 – 253.17 = 87.8 千美元。\n\
  ```\n\n这里的线性方程就是本次特定线性回归研究的线性数据挖掘模型。我们知道，对于这种形式的线性方程 `y = mx + b`，`m` 和 `b` 是两个决定因素。一旦找到\
  \ `m` 和 `b`，模型就构建并确定了。当然，对于这个简单的案例，模型由 `m` 和 `b` 表示，也就是说，由 `m` 和 `b` 组成的参数集就是模型。模型构建的过程就是寻找\
  \ `m` 和 `b` 的过程。\n\n`m` 和 `b` 是如何得到的呢？从图 2-3 中我们可以看出，趋势线并未穿过每一个点，它只是遵循了趋势。如果由几个人手动独立绘制，可能会得到多条不同的趋势线。Excel\
  \ 是如何得出这条特定趋势线的呢？\n\n为了找到形如 `y = mx + b` 的特定线性方程，我们采用了最小二乘法。让我来解释一下什么是最小二乘法。\n\n\
  观察温度 = 91 对应的点，该点并不在趋势线上。这表明趋势线（预测值）与实际数据之间存在误差（我们可以将其理解为差异）。事实上，图 2-3 中的所有数据点都存在微小误差。误差的平方和可以表示为\n\
  \n![$$ E={\\sum}_{i=1}^n{\\left({y}_i-\\left(m{x}_i+b\\right)\\right)}² $$](img/494428_2_En_2_Chapter_TeX_Equ1.png)\n\
  \n(2-1)\n\n其中 *y*[*i*] 是训练数据集中与温度值 *x*[*i*] 对应的实际冰淇淋销售额。目标是使误差之和最小化。为此，我们可以求偏导数：\n\
  \n![$$ \\frac{\\partial E}{\\partial x}=0\\ \\mathrm{and}\\ \\frac{\\partial E}{\\\
  partial y}=0 $$](img/494428_2_En_2_Chapter_TeX_Equ2.png)\n\n(2-2)\n\n通过求解上述两个偏导数方程，我们可以得到\
  \ `m` 和 `b` 的值：\n\n![$$ m=\\frac{n{\\sum}_{i=1}^n{x}_i{y}_i-\\left({\\sum}_{i=1}^n{x}_i\\\
  right)\\left({\\sum}_{i=1}^n{y}_i\\right)}{n\\left({\\sum}_{i=1}^n{x_i}²\\right)-{\\\
  left({\\sum}_{i=1}^n{x}_i\\right)}²} $$](img/494428_2_En_2_Chapter_TeX_Equ3.png)\n\
  \n(2-3)\n\n![$$ b=\\frac{\\left({\\sum}_{i=1}^n{x_i}²\\right)\\left({\\sum}_{i=1}^n{y}_i\\\
  right)-\\left({\\sum}_{i=1}^n{x}_i\\right)\\left({\\sum}_{i=1}^n{x}_i{y}_i\\right)}{n\\\
  left({\\sum}_{i=1}^n{x_i}²\\right)-{\\left({\\sum}_{i=1}^n{x}_i\\right)}²} $$](img/494428_2_En_2_Chapter_TeX_Equ4.png)\n\
  \n(2-4)\n\n## 通过 Excel 学习线性回归\n\n在公式 (2-3) 和 (2-4) 中，*x*[*i*] 是已知的平均每日最高气温，*y*[*i*]\
  \ 是与 *x*[*i*] 对应的实际冰淇淋销售额。它们来自表 2-1 所示的训练数据集。\n\n打开文件 Chapter2-1a.xlsx。如图 2-4 所示，在\
  \ C 列和 D 列中输入文本和公式，以计算 `m` 和 `b` 的值。图 2-4 中的公式基于公式 (2-3) 和 (2-4)。请注意，在图 2-4 中，温度被重命名为\
  \ `x`，冰淇淋销售额被重命名为 `y`，以便设置更贴近公式 (2-3) 和 (2-4)。\n\n![](img/494428_2_En_2_Fig4_HTML.jpg)\n\
  \n一个包含 4 列 8 行的表格。C 列和 D 列包含文本和公式，A 列中的温度被重命名为 x，B 列中的冰淇淋销售额被重命名为 y。\n\n图 2-4\n\n\
  通过最小二乘近似计算 m 和 b\n\n在图 2-4 中，A:A 和 B:B 分别用于表示 A 列和 B 列中的所有单元格。因此，=SUM(A:A) 和 =SUM(B:B)\
  \ 将分别对 A 列和 B 列中的所有单元格求和。此外，还使用了 Excel 函数 SUMPRODUCT 来简化两个数组之间的计算。对 SUMPRODUCT 的一个重要理解是，两个数组必须具有相同的类型和长度。这里，相同的类型意味着两个数组可以都是列或都是行。计算出\
  \ `m` 和 `b` 后，Tommy 就可以完成他的预测，如图 2-5 所示（在单元格 D12 中输入公式 `=D$8*C12 + D$9`，然后从 D12\
  \ 自动填充到 D14）。\n\n![](img/494428_2_En_2_Fig5_HTML.jpg)\n\n一个包含 4 列 13 行的表格。C 列和 D\
  \ 列包含文本和公式，A 列中的温度被重命名为 x，B 列中的冰淇淋销售额被重命名为 y。该表格突出显示了评分数据和预测结果。\n\n图 2-5\n\n基于线性回归模型的预测\n\
  \n对于这个特定示例，计算 `m` 和 `b` 的一种更高效的方法是使用 SLOPE 和 INTERCEPT 这两个函数。请按照以下说明练习这两个函数的使用：\n\
  \n![](img/494428_2_En_2_Fig6_HTML.jpg)\n\n一个包含 2 列 8 行的表格。A 列中的温度被重命名为 x，B 列中的冰淇淋销售额被重命名为\
  \ y。\n\n图 2-6\n\n准备数据以使用 SLOPE 和 INTERCEPT 函数\n\n1.  如图 2-6 所示输入 `x` 和 `y` 值。注意：仅输入\
  \ `x` 和 `y` 值。C 列和 D 列为空。\n\n2.  在单元格 C2 中输入 `m`，在单元格 D2 中输入 `b`。\n\n3.  在单元格 C3\
  \ 中输入公式 =SLOPE(B2:B9, A2:A9)。\n\n4.  在单元格 D3 中输入公式 =INTERCEPT(B2:B9, A2:A9)。\n\n\
  结果应如图 2-7 所示。\n\n![](img/494428_2_En_2_Fig7_HTML.jpg)\n\n一个包含 4 列 8 行的表格。A 列中的温度被重命名为\
  \ x，B 列中的冰淇淋销售额被重命名为 y，C 列的 m 值为 3.8394（即斜率），D 列的 b 值为 -253.2（即截距）。\n\n图 2-7\n\n\
  通过 SLOPE 和 INTERCEPT 函数得到的结果\n\n另一种获取 `m` 和 `b` 值的方法是通过 Excel 的数据分析工具。这是许多人采用的一种流行方法，尽管我不喜欢它。使用数据分析工具进行回归的缺点是，一旦获得系数和截距值，它们不会随着训练数据的变化而更新。\n\
  \n默认情况下，我们的 Excel 没有数据分析工具。要使其可用，我们必须启用 Excel 中内置的加载项“分析工具库”。稍后当我们需要使用规划求解时，我会向您展示如何在\
  \ Excel 中启用分析工具库和规划求解。目前，我们还不需要使用数据分析工具。\n\n上述学习过程的结果存储在文件 Chapter2-1b.xlsx 中。\n\
  \n\n\n## 通过 Excel 学习多元线性回归\n\nTommy 成功预测了他的冰淇淋销量，但他希望进一步提高预测的准确性。经过一番研究，他收集了更多信息，例如游客数量（从酒店获取）和一周内的晴天数。他更新后的训练数据集如表\
  \ 2-2 所示。\n\n表 2-2\n\n冰淇淋销量 vs. 温度、游客数和晴天数\n\n| 温度 (华氏度) | 游客数 | 晴天数 | 冰淇淋销量 (千美元)\
  \ |\n| --- | --- | --- | --- |\n| 91 | 998 | 4 | 89.8 |\n| 87 | 1256 | 7 | 90.2\
  \ |\n| 86 | 791 | 6 | 81.1 |\n| 88 | 705 | 5 | 83 |\n| 92.8 | 1089 | 3 | 90.9 |\n\
  | 95.2 | 1135 | 6 | 119 |\n| 93.3 | 1076 | 4 | 94.9 |\n| 97.7 | 1198 | 7 | 132.4\
  \ |\n\n表 2-2 中有三个自变量：温度、游客数和晴天数。当存在多个自变量时，线性回归特称为多元线性回归。我们将温度记为 `x`[`1`]，游客数记为 `x`[`2`]，晴天数记为\
  \ `x`[`3`]，y 轴截距记为 `b`，销量记为 `y`。我们的多元线性回归方程为 `y = m`[`1`]`x`[`1`] `+ m`[`2`]`x`[`2`]\
  \ `+ m`[`3`]`x`[`3`] `+ b`。对于这种多元线性回归，我们需要使用 `LINEST` 函数来获取系数 m[i] 和 b。请按照以下说明通过\
  \ Excel 练习多元线性回归：\n\n![](img/494428_2_En_2_Fig8_HTML.jpg)\n\n一个包含 4 列 8 行的表格。列 A\
  \ 为温度，列 B 为游客数，列 C 为晴天数，列 D 为冰淇淋销量。表格下方依次放置了文本“晴天数 1”、“游客数 2”、“温度 3”和“Y 轴截距 4”。\n\
  \n图 2-8\n\n设置表格以查找系数和 y 轴截距\n\n1.  将表 2-2 的数据输入到新 Excel 工作表的单元格 A1:D9 中，或者打开文件 Chapter2-2a.xlsx。\n\
  \n模型构建过程就是找到 `m`[`1`]、`m`[`2`]、`m`[`3`] 和 `b` 的最优值。我们将使用数组函数 `LINEST`。请注意，`LINEST`\
  \ 返回一个数组值。返回值的顺序是 `m`[`n`]、`m`[`n-1`]、…、`m`[`1`] 和 `b`，这与公式表达的顺序相反。因此，需要使用 `INDEX`\
  \ 函数从返回的数组中提取单个值。`INDEX` 函数设计用于处理矩阵或表格。它需要行索引和列索引来定位表格中的元素。由于 `LINEST` 返回的数组只有一行，因此行索引始终为\
  \ 1，而列索引分别为 1、2、3 和 4。\n\n2.  在单元格 A11:A14 中输入文本“晴天数”、“游客数”、“温度”和“Y 轴截距”。\n\n3.\
  \  在单元格 B11:B14 中输入数字 1、2、3 和 4。此时工作表应如图 2-8 所示。稍后我将解释为什么需要输入这些数字。\n\n![](img/494428_2_En_2_Fig9_HTML.jpg)\n\
  \n一个包含 4 列 8 行的表格。列 A 为温度，列 B 为游客数，列 C 为晴天数，列 D 为冰淇淋销量。表格下方依次放置了文本“晴天数 1（含 INDEX\
  \ 公式）”、“游客数 2”、“温度 3”和“Y 轴截距 4”。\n\n图 2-9\n\n使用 INDEX 和 LINEST 函数获取系数\n\n1.  在单元格\
  \ C11 中输入以下公式并按 Enter 键：\n\n```\n    =INDEX(LINEST(D$2:D$9,A$2:C$9,TRUE,TRUE),1,B11)\n\
  \    ```\n\n在此公式中，`LINEST` 函数的第一个输入参数是 D2:D9，即因变量值。第二个输入参数是 A2:C9，其中包含 `x`[`1`]、`x`[`2`]\
  \ 和 `x`[`3`] 的值。`LINEST` 返回的数组作为输入传递给 `INDEX` 函数。由于 B11 = 1，`INDEX` 函数提取返回数组中的第一个元素，即\
  \ `m`[`3`]。再次注意，`LINEST` 返回的数组按 m[n]、m[n-1]、m[n-2]、…、m[1]、b 的顺序排列系数。在此特定示例中，返回数组中的数据分别是自变量“晴天数”、“游客数”、“温度”和“Y\
  \ 轴截距”对应的 m[3]、m[2]、m[1] 和 b。\n\n请参考图 2-9。\n\n![](img/494428_2_En_2_Fig10_HTML.jpg)\n\
  \n一个包含 6 列 8 行的表格。列分别为温度、游客数、晴天数、冰淇淋销量、预测值和误差。表格下方依次放置了文本“晴天数 1”、“游客数 2”、“温度 3”、“Y\
  \ 轴截距 4”以及“误差总和”及其对应值。\n\n图 2-10\n\n多元线性回归模型\n\n1.  从单元格 C11 自动填充到单元格 C14。注意 B11、B12、B13\
  \ 和 B14 的使用。\n\n当我们从 C11 自动填充到 C14 时，单元格 C12 中的公式会自动变为 `=INDEX(LINEST(D$2:D$9,A$2:C$9,TRUE,TRUE),1,B12)`。因为\
  \ B12 = 2，所以 C12 中的公式正确地提取了游客数的系数 (`m`[`2`])。同样的逻辑适用于 C13 和 C14 中的公式。通过预先在单元格 B11:B14\
  \ 中输入数字，一旦我们正确输入了初始公式，就可以通过自动填充获得所有需要的值。\n\n这是一种常用技巧。我们当然不希望多次输入公式。请注意，`LINEST`\
  \ 函数会为每个系数重复调用。\n\n2.  最后一步是检查新模型的效果。在单元格 E1 中输入文本“预测值”。\n\n3.  在单元格 E2 中输入以下公式，然后自动填充到单元格\
  \ E9：\n\n```\n    =A2*C$13+B2*C$12+C2*C$11+C$14\n    ```\n\n如前所述，参数集（即系数和 Y 轴截距）代表了线性回归模型。我们想要检查模型的好坏，因此需要在\
  \ E 列生成预测销量。\n\n4.  为了检查上述线性回归模型的质量，我们可以进一步根据公式 (2-1) 计算误差。在单元格 F1 中输入文本“误差”，在单元格\
  \ F2 中输入公式 `=POWER(D2-E2,2)`，然后从 F2 自动填充到 F9。\n\n5.  在单元格 D11 中输入文本“误差总和”，在单元格 E11\
  \ 中输入公式 `=SUM(F2:F9)`。此时工作表应如图 2-10 所示。\n\n回顾一下，通过 `LINEST` 函数获得的系数保证了单元格 E11 中的误差值最小化。您可以手动修改系数，看看是否能得到更小的误差值。我将此作为练习留给您实践。\n\
  \n自变量“游客数”的系数为负。这仅仅意味着当游客数量增多时，冰淇淋销量会减少。然而，在这个特定示例中，该系数接近于零，表明游客数量对冰淇淋销量影响不大。\n\n\
  完整的工作可在文件 Chapter2-2b.xlsx 中找到。\n\n## 强化练习\n\n实践是成功的关键。建议您打开 Chapter2-HW.xlsx 自行练习线性回归。Chapter2-HW-withAnswers.xlsx\
  \ 提供了一种参考答案。\n\n## 复习要点\n\n我们已到达第 2 章的末尾。对于本章，请复习以下概念和 Excel 技能：\n\n1.  线性回归模型\n\
  \n2.  最小二乘法\n\n3.  多元线性回归\n\n4.  函数 SUM、COUNT、SLOPE、INTERCEPT、LINEST、SUMPRODUCT、INDEX\
  \ 和 POWER\n\n"
- "# 3. K-Means 聚类\n\n请从 [`https://github.com/hhohho/Learn-Data-Mining-through-Excel-2`](https://github.com/hhohho/Learn-Data-Mining-through-Excel-2)\
  \ 下载示例 Excel 文件。双击 Chapter3-1a.xlsx 将其打开。\n\n\n\n## 总体理解\n\n与作为预测方法的线性回归不同，聚类是一种分类方法，它将主体（数据点）归入不同的组（簇），每个组都有一系列特征度量值。例如，银行在考虑向客户发放贷款时，可能希望将客户划分为不同的风险组。这种分类过程依赖于所选的特征和采用的算法。请注意以下术语：主体、数据点、组、簇、类别等。在表格中，一行被称为一条记录。由于一条记录可以由多个数值组成，因此它也可以被称为一个数据点。此外，一条记录可以包含用于描述某人的特征，因此在某些情况下，一条记录也被称为一个主体。在本书中，数据点、记录和主体含义相同。同样，组、簇和类别这三个术语也具有相同的含义。\n\
  \n聚类是一种无监督的数据挖掘方法。它不需要训练数据集。两种最流行的聚类方法是划分聚类和层次聚类。K-means 聚类（其中 `k` 表示所需的簇数量）是划分聚类的一种类型。在\
  \ K-means 聚类中，每个簇由其内部数据点的质心（或均值）定义。例如，假设一个簇有三个数据点，表示为三个向量：(1, 2, 3, 4, 5)、(2, 3,\
  \ 4, 5, 6) 和 (5, 4, 3, 2, 1)。那么该簇的质心为 ((1+2+5)/3, (2+3+4)/3, (3+4+3)/3, (4+5+2)/3,\
  \ (5+6+1)/3)，即 (2.7, 3, 3.3, 3.7, 4)。请注意，K-means 聚类方法要求所有数据都是数值型的。\n\n要开始 K-means\
  \ 聚类过程，首要任务是确定需要多少个簇，即 `k` 的值。我们可能需要尝试多个 `k` 值，以检查哪个 `k` 值最能满足我们的目的。第二个任务是选择 `k`\
  \ 个数据点作为初始质心。我们可以随机选择这 `k` 个质心，也可以根据数据分布来挑选。计算每个数据点到每个质心的距离，并将数据点归入距离其最近的那个簇（相较于其他所有簇）。一旦每个数据点都被归入某个簇，就重新计算该簇内各点的质心。同时，重新计算每个数据点到每个新质心的距离，然后再次根据最短距离规则将点划分到簇中。重复此过程，直到连续两次迭代中所有数据点都被分配到相同的簇，此时簇质心已稳定，并将保持不变。当达到预定义的最大迭代次数时，该过程也可以停止。\n\
  \n计算任意两个数据点之间的距离有多种方法，但通常使用欧几里得距离。给定两个数据点 (x1, x2, x3, x4) 和 (y1, y2, y3, y4)，它们的欧几里得距离计算公式为\n\
  \n![$$ \\sqrt{{\\left(x1-y1\\right)}²+{\\left(x2-y2\\right)}²+{\\left(x3-y3\\right)}²+{\\\
  left(x4-y4\\right)}²} $$](img/494428_2_En_3_Chapter_TeX_Equ1.png)\n\n(3-1)\n\n##\
  \ 通过 Excel 学习 K-Means 聚类\n\n假设有 50 个国家，我们希望根据四个属性（谋杀率、袭击率、城市人口和强奸率）将它们分为四个簇。所有数据都存储在\
  \ Excel 文件 Chapter3-1a.xlsx 中。让我们打开这个 Excel 文件，它只有一个名为“1”的工作表。是的，这个工作表的名字就是“1”。A\
  \ 列存储每个国家的唯一代码。数据如图 3-1 所示。\n\n![](img/494428_2_En_3_Fig1_HTML.jpg)\n\n一个表格展示了 50\
  \ 个国家的 K-means 聚类数据。该表格包含 12 列和 16 行。列标题为国家、谋杀、袭击、城市人口和强奸。\n\n图 3-1\n\n关于 50 个国家的数据\n\
  \n让我们选中单元格 G1:K1，然后点击“合并后居中”。单元格 G1 到 K1 被合并为一个单元格。在这个合并后的单元格（其引用为 G1）中输入“均值”。在单元格\
  \ G2:K6 中输入其他数据，如图 3-2 所示。请注意，C1、C2、C3 和 C4 均为大写。提醒一下，还有另一个名为 Chapter3-1a-preEntered.xlsx\
  \ 的文件，其中 G1:K6 的数据已预先输入。欢迎您从 Chapter3-1a-preEntered.xlsx 开始操作。\n\n![](img/494428_2_En_3_Fig2_HTML.jpg)\n\
  \n一个表格展示了 G1 到 K6 中用于 K-means 聚类的数据。该表格包含 12 列和 15 行。列标题为谋杀、袭击、城市人口、强奸和均值，其中均值下有\
  \ 5 个子列：簇、C1、C2、C3 和 C4。\n\n图 3-2\n\n在 G1:K6 中设置数据\n\nC1、C2、C3 和 C4 分别代表簇 1、簇 2、簇\
  \ 3 和簇 4。单元格 H3:K6 中的数字是在快速查看每个属性的数据范围后选定的。我们也可以为它们随机挑选一些数字。在本演示中，让我们保持这些数字完全不变。单元格\
  \ H3:H6、I3:I6、J3:J6 和 K3:K6 中的数字分别代表 C1、C2、C3 和 C4 的质心。\n\n选中单元格 M1:P1，点击“合并后居中”。单元格\
  \ M1 到 P1 被合并为一个单元格，我们在其中输入文本“距离”。我们将把每个数据点到四个质心的欧几里得距离存储在 M、N、O 和 P 列中。单元格 M1:Q2\
  \ 的设置如图 3-3 所示。\n\n![](img/494428_2_En_3_Fig3_HTML.jpg)\n\n一个表格展示了 M1 到 Q2 中用于 K-means\
  \ 聚类的数据。该表格包含 11 列和 6 行。列标题为均值（下有 6 个子列）和距离（下有 5 个子列：C1、C2、C3、C4 和簇）。距离列及其子列被突出显示。\n\
  \n图 3-3\n\n单元格 M1:Q2 的设置\n\n单元格 M3 存储从国家 L1 (12, 193, 51, 21) 到质心 C1 (2.3, 15, 9.9,\
  \ 10) 的距离。M3 中的公式基于公式 (3-1)，如下所示：\n\n```\n=SQRT(SUMXMY2($B3:$E3, H$3:H$6))\n```\n\
  \n此公式计算 L1 和 C1 之间的欧几里得距离。请密切注意公式中绝对引用的使用。此处使用绝对引用是为了方便自动填充。函数 SQRT 计算一个值的平方根，函数\
  \ SUMXMY2 计算两个数组中对应值之差的平方和（在此例中，两个数组分别是 L1 的 B3:E3 和 C1 的 H3:H6）。\n\n按照以下说明继续该过程：\n\
  \n![](img/494428_2_En_3_Fig4_HTML.jpg)\n\n一个表格展示了 G1 到 K6 中用于 K-means 聚类的数据。该表格包含\
  \ 9 列和 12 行。列标题为均值（下有 2 个子列：C3 和 C4）和距离（下有 5 个子列：簇、C1、C2、C3 和 C4）。\n\n图 3-4\n\n\
  在工作表 1 中计算出的距离\n\n1.  选中单元格 M3，并水平自动填充至 P3。\n\n2.  选中单元格 M3:P3；将它们一起自动填充至单元格 M52:P52。到目前为止，每个数据点到每个质心的距离都已计算完毕。工作表的一部分如图\
  \ 3-4 所示。\n\n\n\n![](img/494428_2_En_3_Fig5_HTML.jpg)\n\n一张表格展示了使用 K-means 聚类后的数据。该表格包含\
  \ 18 列和 18 行。列标题依次为国家、谋杀、袭击、城市人口、强奸、均值（含 5 个子列：聚类、C1、C2、C3、C4）以及距离（含 5 个子列：聚类、C1、C2、C3、C4）。\n\
  \n图 3-5\n\n工作表 1 中第一轮计算后的结果\n\n1.  Q 列中的数据根据最短距离规则，指明了每个数据点所属的聚类。在单元格 Q3 中，输入以下公式：\n\
  \n```\n    =INDEX($M$2:$P$2,1,MATCH(MIN(M3:P3),M3:P3,0))\n    ```\n\n函数 MATCH 的语法为\
  \ MATCH(查找值, 查找数组, 匹配类型)。如果 match_type = 0，该函数会在查找数组中精确查找查找值。如果未找到，则返回#N/A 错误（值不可用错误）。如果找到，则返回该值在数组中的相对位置。请注意，在\
  \ Microsoft Office 工具中，第一个位置始终为 1。\n\n在上述公式中，MATCH 函数找到数组 M3:P3 中最小值（本例中为 4）的列相对位置。该列位置被传递给\
  \ INDEX 函数，以便在数组 M2:P2 中找到对应的聚类名称。此公式用于确定数据点 L1 所属的聚类。\n\n由于只有四个聚类，使用嵌套的 IF 语句也能达到与上述公式相同的目的。\n\
  \n```\n    =IF(MIN(M3:P3)=M3,\"C1\",IF(MIN(M3:P3)=N3,\"C2\", IF(MIN(M3:P3)=O3,\"\
  C3\",\"C4\")))\n    ```\n\n在嵌套的 IF 公式中，如果最小值等于 M3，则返回“C1”；否则，如果最小值等于 N3，则返回“C2”；否则，如果最小值等于\
  \ O3，则返回“C3”；否则返回“C4”。\n\n我们可以看出，当聚类数量过多时，使用 INDEX 和 MATCH 函数比嵌套 IF 语句是更好的编程方法。\n\
  \n2.  将 Q3 自动填充至 Q52。至此，我们的数据如图 3-5 所示。\n\n1.  现在我们需要开始第二轮聚类过程。复制工作表 1，并将新工作表重命名为工作表\
  \ 2。是的，新工作表的名称就是数字 2！同时，确保工作表 2 位于工作表 1 的右侧。它们的顺序非常重要。\n\n在工作表 2 中，我们需要在单元格 H3 中输入一个公式，以重新计算聚类\
  \ 1 内所有数据点的“谋杀”属性均值。然而，所需数据位于工作表 1 中。如下公式可以为我们完成此任务：\n\n```\n    =AVERAGEIFS('1'!$B$3:'1'!$B$52,\
  \ '1'!$Q$3:'1'!$Q$52,H$2)\n    ```\n\n虽然此公式位于工作表 2 中，但所使用的数据均在工作表 1 中，'1'!通过其名称（确实是“1”）引用工作表\
  \ 1。该公式利用函数 AVERAGEIFS 计算聚类 1 内所有数据点的“谋杀”属性均值。请注意，只有聚类名称与单元格 H2（C1）匹配的数据点（且仅限 B\
  \ 列）才会被计算平均值。\n\n然而，上述公式还不够完善！\n\n首先，此公式计算的是平均值。在 k-means 聚类过程中，有可能某个聚类没有数据点。在这种情况下，分母将为零，从而导致除以零的错误。因此，我们需要利用\
  \ IFERROR 函数来防范这种情况。\n\n其次，也是最重要的原因是，当我们需要在另一个工作表 3 中开始新一轮聚类迭代时，我们必须转到工作表 3 的单元格\
  \ H3，将“1”改为“2”，因为工作表 3 必须使用工作表 2 中的数据。我们不想一次又一次地手动修改公式。\n\n为了解决这个难题，我们需要利用 SHEET、INDIRECT\
  \ 和 ADDRESS 函数以及运算符&。\n\nSHEET 是一个非常有趣的函数，它返回所引用工作表的编号。工作簿中最左侧的工作表编号为 1，左侧第二个工作表编号为\
  \ 2，依此类推。SHEET 的语法为 SHEET(引用)，其中参数通常是一个单元格引用，例如 A1。\n\n\n函数 INDIRECT 将文本作为单元格引用进行求值。函数\
  \ ADDRESS 将两个数字转换为单元格引用。函数 ADDRESS 需要一个行号和一个列号。在 Excel 中，A 列是 1，B 列是 2，依此类推。运算符\
  \ & 可以连接文本（字符串）。\n    *   在工作表 2 的单元格 F1 中，输入公式 `=SHEET(A1)-1`。你会注意到 F1 中的值是 1，可用于引用工作表\
  \ 1。\n\n*   在单元格 F3 到 F6 中，分别输入数字 2、3、4 和 5。这些数字有助于我们在水平自动填充公式时选择正确的列。同样，在 Excel\
  \ 中，B 列是第 2 列，C 列是第 3 列，依此类推。这些数字可用于引用 B、C、D 和 E 列。\n\n工作表 2 的一部分如图 3-6 所示。\n\n\
  ![](img/494428_2_En_3_Fig6_HTML.jpg)\n\n一个表格展示了使用 K-means 聚类算法的数据。该表格包含 11 列和 9\
  \ 行。列标题为 murder、assault、urban-pop、rape、mean，以及 6 个子列 cluster、C 1、C 2、C 3 和 C 4。表格高亮显示了\
  \ mean 列及其子列。\n\n图 3-6\n\n设置工作表 2 以实现公式自动更新\n\n在单元格 H3 中，输入以下公式：\n\n```\n    =IFERROR(AVERAGEIFS(INDIRECT($F$1\
  \ & \"!\" & ADDRESS(3,$F3,1)) : INDIRECT($F$1 & \"!\" & ADDRESS(52,$F3,1)),INDIRECT($F$1\
  \ & \"!$Q$3\"):INDIRECT($F$1 & \"!$Q$52\"),H$2),0)\n    ```\n\n在此公式中\n    *   IFERROR\
  \ 确保当出现错误时，平均值被设置为 0。\n\n*   `ADDRESS(3,$F3,1)` 返回 `$B$3`。\n\n*   `INDIRECT($F$1\
  \ & \"!\" & ADDRESS(3,$F3,1))` ➔ `'1'!$B$3`。\n\n*   `INDIRECT($F$1 & \"!\" & ADDRESS(52,$F3,1))`\
  \ ➔ `'1'!$B$52`。\n\n*   `INDIRECT($F$1 & \"!\" & ADDRESS(3,$F3,1)) : INDIRECT($F$1\
  \ & \"!\" & ADDRESS(52,$F3,1))` ➔ `'1'!$B$3:'1'!$B$52`。\n\n*   `INDIRECT($F$1 &\
  \ \"!$Q$3\"):INDIRECT($F$1 & \"!$Q$52\")` ➔ `'1'!$Q$3:'1'!$Q$52`。\n\n上述公式生成一个最终公式，等同于\n\
  \n```\n    =IFERROR(AVERAGEIFS('1'!$B$3:'1'!$B$52, '1'!$Q$3:'1'!$Q$52,H$2),0)\n\
  \    ```\n\n上述公式的优点如下：\n    *   我们可以从 H3 自动填充到 K6。\n\n*   结合单元格 F1 中 SHEET 函数的使用，只要我们将工作表\
  \ 3 放置在工作表 2 的紧右侧，就可以自动实现对工作表 2 的引用。\n\n2.  从单元格 H3 自动填充到单元格 K6。我们的工作表可以与图 3-7 进行比较。\n\
  \n![](img/494428_2_En_3_Fig7_HTML.jpg)\n\n一个表格表示质心。该表格包含 6 列和 6 行。列标题为 1 和 mean，以及\
  \ 5 个子列 cluster、C 1、C 2、C 3 和 C 4。\n\n图 3-7\n\n工作表 2 中的质心\n\n3.  到目前为止，每个数据点到四个新质心的距离以及它们所属的簇都已自动计算出来。在单元格\
  \ R1 和 R2 中，分别输入数字 1 和 2。选中这两个单元格并自动填充到单元格 R52。现在单元格 R1:R52 中的数字为 1, 2, 3, …, 52。\n\
  \n4.  在单元格 S2 中，输入“旧簇”。S 列存储了上一次迭代中所有数据点所属的簇（这些数据在工作表 1 中）。\n\n5.  在单元格 T2 中，输入“差异”。T\
  \ 列记录了当前迭代与上一次迭代之间的簇切换情况。工作表的一部分如图 3-8 所示。\n\n![](img/494428_2_En_3_Fig8_HTML.jpg)\n\
  \n一个表格展示了使用 K-means 聚类算法的数据。该表格包含 8 列和 18 行。列标题为 distance，以及 5 个子列 cluster、C 1、C\
  \ 2、C 3 和 C 4，还有 old cluster 和 difference。\n\n图 3-8\n\n准备与工作表 1 进行比较\n\n![](img/494428_2_En_3_Fig9_HTML.jpg)\n\
  \n一个表格展示了使用 K-means 聚类算法的数据。该表格包含 15 列和 18 行。列标题为 mean，以及 5 个子列 cluster、C 1、C 2、C\
  \ 3 和 C 4，distance 以及 5 个子列 cluster、C 1、C 2、C 3 和 C 4，还有 old cluster 和 difference。\n\
  \n图 3-9\n\n工作表 2 中第二轮之后\n\n1.  在单元格 S3 中，输入以下公式并自动填充到 S52：\n\n```\n    =INDIRECT($F$1\
  \ & \"!Q\" & R3)\n    ```\n\n此公式引用工作表 1 中单元格 Q3 的值。\n\n2.  在单元格 T3 中，输入以下公式并自动填充到\
  \ T52：\n\n```\n    =IF(Q3=S3,0,1)\n    ```\n\n上述公式定义：对于给定的数据点，如果其上一次所属的簇与当前所属的簇不同，则返回\
  \ 1；否则返回 0。我们的目标是达到一个稳定状态，即 S 列只有 0，这意味着所有数据点都停留在与上一次迭代相同的簇中。\n\n3.  选中单元格 G10 和\
  \ H10，合并它们，并在其中输入“收敛”。在单元格 I10 中，输入以下公式：\n\n```\n    =SUM(T3:T52)\n    ```\n\n如前所述，我们希望单元格\
  \ I10 中的值为 0。工作表 2 的一部分应如图 3-9 所示。\n\n![](img/494428_2_En_3_Fig10_HTML.jpg)\n\n\
  一个表格展示了使用 K-means 聚类算法的数据。该表格包含 15 列和 17 行。列标题为 mean，以及 5 个子列 cluster、C 1、C 2、C\
  \ 3 和 C 4，distance 以及 5 个子列 cluster、C 1、C 2、C 3 和 C 4，还有 old cluster 和 difference。\n\
  \n图 3-10\n\n工作表 3 中三轮后的 K-means 聚类\n\n1.  由于在第二次迭代中有四个数据点切换了簇，我们需要继续聚类过程。复制工作表 2，并将新工作表命名为\
  \ 3。确保工作表 3 紧邻工作表 2 的右侧。我们会注意到工作表 3 已自动完成，其部分内容如图 3-10 所示。\n\n![](img/494428_2_En_3_Fig11_HTML.jpg)\n\
  \n一个表格展示了使用 K-means 聚类算法的数据。该表格包含 15 列和 17 行。列标题为 mean，以及 5 个子列 cluster、C 1、C 2、C\
  \ 3 和 C 4，distance 以及 5 个子列 cluster、C 1、C 2、C 3 和 C 4，还有 old cluster 和 difference。\n\
  \n图 3-11\n\n工作表 4 中四轮后的 K-means 聚类\n\n1.  重复上述聚类过程：将工作表 3 复制到工作表 4；确保新工作表命名为 4 并位于工作表\
  \ 3 的右侧。工作表 4 的一部分如图 3-11 所示。\n\n![](img/494428_2_En_3_Fig12_HTML.jpg)\n\n一个表格展示了使用\
