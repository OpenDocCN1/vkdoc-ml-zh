    ```


    请记住，该程序没有考虑其他条件，例如天气和种子品种，这些也会影响作物产量和收成。构建这样的数据集无疑是一项巨大的工作，超出了本书的范围。


    ## 总结


    至此，我们来到了本案例研究和本书的结尾。我非常享受为您带来这些基于物联网的解决方案，以解决现代、实际的商业问题，并尝试通过机器学习来解决它们。我希望您也喜欢从中学到东西。请考虑在
    [`www.pmauthor.com/raspbian`](http://www.pmauthor.com/raspbian) 的论坛上留下反馈。

