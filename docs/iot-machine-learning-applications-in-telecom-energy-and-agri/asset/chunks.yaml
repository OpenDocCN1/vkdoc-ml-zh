  raw: '## Agriculture Industry Case Study Overview


    An international agriculture conglomerate named Aystsaga Agro has investments
    in farming, fertilizer production, and tractors. The president, Tamio Polskab,
    is also the founder of the company. He has steered the company from its humble
    origins from one North American farm inherited from his father to an agri-business
    that spans three continents, North America, Africa, and Asia. The agri-business
    is not an easy one as it has many challenges that are emerging as a result of
    tariff wars and climate change. Worldwide, there is an agriculture crisis happening
    from South Asia to African countries trying to protect small farmers from the
    onslaught of such rapid changes. There is one big silent change that is happening:
    the use of technology, such as robotic machines, to replace humans in farming.
    Agriculture conglomerates such as Aystsaga Agro, which are highly commercial in
    their operations, are embracing technology to see how they can adopt and benefit
    from it. Since agriculture is not such a profitable business as compared to other
    industries such as service industries, the funding for such operations is really
    hard to get due to low ROI. This is the reason why such commercial companies focus
    on cash crops like corn, sugarcane, wheat, and soybeans. Sugarcane, sugar beets,
    and tomatoes fetch better yield than other crops for Aystsaga Agro, as shown in
    Table [9-1](#484167_1_En_9_Chapter.xhtml#Tab1).


    Table 9-1


    Global Yearly Production at Aystasaga Agro for Three Cash Crops


    | Aystsaga Agro |

    | --- |

    | 2017-2018 Worldwide Production | Tonnes | Total Land Size |

    | --- | --- | --- |

    | Sugarcane | 470817.99 | 5361.70 |

    | Sugar beet | 503999.80 | 5361.70 |

    | Tomatoes | 273446.70 | 5361.70 |


    In 2013, Aystsaga Agro purchased big farms in Brazil and South Africa. The Brazil
    farms were in the region of Sao Palo, and the South African farms were in the
    interior regions. Tamio, the founder of the company, succeeded in expanding the
    company’s agriculture farming operations by acquiring land and using it for commercial
    operations. His vision was to establish his company as a major agri-business in
    the world.


    While drinking his morning green tea, Tamio looked at the yearly financial results
    his CFO sent him that morning for his review. See Table [9-2](#484167_1_En_9_Chapter.xhtml#Tab2).


    Table 9-2


    Worldwide Production Numbers and Revenue Figures for Aystsaga Agro


    | 2017-2018 Worldwide Production | Tonnes | Total Land Size | US$ |

    | --- | --- | --- | --- |

    | Sugarcane | 470817.99 | 5361.70 | 241058809.3 |

    | Sugar beet | 503999.80 | 5361.70 | 25199990 |

    | Tomatoes | 178446.70 | 5361.70 | 180231167 |

    | **Income from Agricultural Operation** |   |   | 446489966.3 |


    While he was looking at the numbers, there was a knock on his plush South African
    office cabin door. He raised his head to catch his Chief Operations Officer, Glanzo,
    smiling. He signaled for him to come and sit in front of him. As Glanzo came and
    sat down, Tanio rose up and went near the right side of the window. He looked
    at the breathtaking view of the sea in the South African capital as he started
    speaking slowly.


    ### The Problem


    “Have you seen the numbers sent by Nambi this morning?” asked Tamio.


    Glanzo nodded and said, “I think they are pretty impressive given that we have
    had several storms around our farms in Brazil and South Africa this year.”


    “You don’t understand my vision, do you?” asked Tamio, looking straight at his
    right-hand man. “My vision is to achieve a turnover of USD 500 million and reach
    USD 1 billion in six years. I told the board about this in the last AGM. You were
    there too,” said the boss.


    Glanzo said, raising his shoulders, “We were all there, but I thought you were
    saying that to please the investors and the board.”


    “No, that was a goal that I have been working towards for the past 15 years, ever
    since this company went public. This is not just a vision or a goal; this is a
    challenge that I have thrown up to you all,” said Tamio decidedly.


    Glanzo retorted, “Yes, I understand the need to grow; otherwise, we will be eaten
    by the big fish in the industry. But you must understand the challenges that our
    operations are facing today, and unless we find real solutions for them, we will
    not grow at the rate that you want it to happen.”


    Tamio now had a frown at his face as he sat down and rested his head on his huge,
    leather executive chair. He was listening intently as Glanzo spoke further. “The
    single thing that is preventing us from growing is our ability to predict the
    yield of crops in a given land.” Glanzo continued, “Our agriculture operations
    are a major problem for us in regions where we made a bad decision in buying infertile
    land that is low yielding. Low yielding land requires us to rectify it by applying
    different chemicals on hectares of land, which increases the cost of production
    and eats into our profitability. If we have to grow at the rate that you are spelling
    out, we need a way to determine which land is high yielding for a particular crop.
    If we are able to achieve this, we can avoid buying farms that are unproductive
    and low yielding, like the ones we have in Brazil where the soil is highly acidic
    and has to be treated with lime to make it more alkaline.”


    Tamio raised his head slightly, signaling that he understood what Glanzo was talking
    about. He asked, “Do you know of a way to find out how to predict the yield for
    a particular type of land, Glanzo?”


    Glanzo responded, “I have been looking at some of the research that has been happening
    in universities around the world; however, nothing concrete is available. But,
    in my opinion, data machine learning and AI show some promise to solve the problem.
    We can hire some machine learning engineers and data scientists who can help us
    create a model for ascertaining the yield of crop in a particular land location.”


    “That sounds great. Why don’t you form a team to look into this problem and propose
    possible solutions?” asked Tamio, smiling at Glanzo.


    Glanzo said, “Yes, that is what I intend to do. First, I’ll hire machine learning
    engineers and data scientist and then I’ll add people from our business operations
    to the team.”


    “Send me an email for approval to go ahead,” said Tamio, picking up the eyeglasses
    from his desk as Glanzo rose to leave his cabin.'
  trans: '

    ## 农业行业案例研究概述


    一家名为 Aystsaga Agro 的国际农业综合企业集团，其业务涵盖农业种植、化肥生产和拖拉机销售。公司总裁兼创始人塔米奥·波尔斯卡布，将这家企业从他父亲继承的一座北美农场，逐步发展壮大为横跨北美、非洲和亚洲三大洲的农业综合企业。农业经营并非易事，由于关税战和气候变化，正面临着诸多新出现的挑战。全球范围内，从南亚到非洲各国，一场农业危机正在上演，各国都在努力保护小农户免受这种急剧变化的冲击。与此同时，一场静默的重大变革正在发生：使用机器人等科技手段替代人类进行农业耕作。像
    Aystsaga Agro 这样运营高度商业化的农业综合企业，正在积极拥抱技术，探索如何应用并从中获益。由于农业与服务业等其他行业相比利润不高，这类运营因投资回报率低而难以获得资金。这也是此类商业公司专注于玉米、甘蔗、小麦和大豆等经济作物的原因。如表
    9-1 所示，对于 Aystsaga Agro 而言，甘蔗、甜菜和番茄的产量高于其他作物。


    **表 9-1**


    **Aystasaga Agro 三种经济作物的全球年产量**


    | Aystsaga Agro |

    | --- |

    | 2017-2018 全球产量 | 吨 | 总土地面积 |

    | --- | --- | --- |

    | 甘蔗 | 470817.99 | 5361.70 |

    | 甜菜 | 503999.80 | 5361.70 |

    | 番茄 | 273446.70 | 5361.70 |


    2013 年，Aystsaga Agro 在巴西和南非收购了大型农场。巴西的农场位于圣保罗地区，南非的农场则在内陆地区。公司创始人塔米奥通过收购土地并用于商业运营，成功拓展了公司的农业种植业务。他的愿景是让公司成为全球主要的农业综合企业。


    在喝早茶时，塔米奥查看了首席财务官当天早上发来的年度财务报告。见表 9-2。


    **表 9-2**


    **Aystsaga Agro 全球产量与收入数据**


    | 2017-2018 全球产量 | 吨 | 总土地面积 | 美元 |

    | --- | --- | --- | --- |

    | 甘蔗 | 470817.99 | 5361.70 | 241058809.3 |

    | 甜菜 | 503999.80 | 5361.70 | 25199990 |

    | 番茄 | 178446.70 | 5361.70 | 180231167 |

    | **农业运营收入** |   |   | 446489966.3 |


    他正看着这些数字，这时他位于南非的豪华办公室门被敲响了。他抬起头，看到首席运营官格兰佐正微笑着。他示意格兰佐进来坐到他面前。格兰佐走进来坐下后，塔米奥起身走到窗户右侧。他一边欣赏着南非首都令人叹为观止的海景，一边缓缓开口。


    ### 问题所在


    “你看到南比今早发来的数据了吗？”塔米奥问道。


    格兰佐点点头说：“考虑到今年我们在巴西和南非的农场遭遇了几次风暴，我认为这些数字已经相当可观了。”


    “你不理解我的愿景，是吗？”塔米奥直视着他的得力助手问道。“我的愿景是实现 5 亿美元的营业额，并在六年内达到 10 亿美元。我在上次股东大会上已经向董事会说明了这一点。你当时也在场。”老板说道。


    格兰佐耸耸肩说：“我们都在场，但我以为你那么说只是为了取悦投资者和董事会。”


    “不，那是公司上市 15 年来我一直努力的目标。这不仅仅是一个愿景或目标；这是我向你们所有人提出的挑战。”塔米奥坚定地说。


    格兰佐反驳道：“是的，我理解增长的必要性；否则，我们就会被行业里的大公司吞并。但你必须明白我们运营目前面临的挑战，除非我们找到真正的解决方案，否则我们无法按照你期望的速度增长。”


    塔米奥此时皱起了眉头，他坐下来，头靠在宽大的真皮行政椅上。他专注地听着格兰佐继续说。“阻碍我们增长的一个关键因素，是我们预测特定土地作物产量的能力。”格兰佐继续说道，“在我们因决策失误而购买了低产贫瘠土地的地区，农业运营对我们来说是个大问题。低产土地需要我们通过在大片土地上施用不同的化学物质来改良，这增加了生产成本，侵蚀了我们的利润。如果我们想按照你提出的速度增长，就需要一种方法来确定哪块土地适合种植哪种作物，并且能获得高产。如果能做到这一点，我们就可以避免购买像我们在巴西那样的低产、无生产力的农场，那里的土壤酸性很强，必须用石灰处理才能使其碱性更强。”


    塔米奥微微抬起头，示意他明白了格兰佐的意思。他问道：“格兰佐，你知道有什么方法可以预测特定类型土地的产量吗？”


    格兰佐回答说：“我一直在关注世界各地大学的一些研究；但目前还没有什么具体成果。不过，在我看来，数据机器学习和人工智能显示出解决这个问题的潜力。我们可以聘请一些机器学习工程师和数据科学家，他们可以帮助我们创建一个模型，用于确定特定地块的作物产量。”


    “听起来不错。你为什么不组建一个团队来研究这个问题并提出可能的解决方案呢？”塔米奥微笑着问格兰佐。


    格兰佐说：“是的，这正是我打算做的。首先，我会聘请机器学习工程师和数据科学家，然后从我们的业务运营部门抽调人员加入团队。”


    “给我发一封邮件批准你去做吧。”塔米奥说着，从桌上拿起眼镜，这时格兰佐起身离开了他的办公室。

    '
- fmt: '### Machine Learning to the Rescue?


    The machine learning team was formed in two months’ time with Hert Liu hired as
    the machine learning engineer for the pilot project. Along with three data scientists,
    he was made to take a robust tour of Aystsaga Agro’s agriculture operations in
    Brazil, South Africa, and India. The business operations team members were introduced
    to them once their induction program was over. With detailed briefings, Hert and
    his team had various new words typical to agriculture farming added to their vocabulary.
    They also understood the inside processes that went into producing crops. The
    detailed tours really helped the team in dig deeper into the company’s operations.
    However, what they lacked was the experiential knowledge, and that is the gap
    the business operations team members were going to fill in this pilot team.


    Hert and his team met a couple of times after coming together. They met Glanzo
    several times too. He effectively communicated the company founder’s vision and
    the problem at hand, which was linked to its growth. Hert was an experienced machine
    learning engineer who worked in the insurance domain earlier. His only brush with
    agriculture was creating a model for predicting claims for agricultural farmers.
    So this was a very high learning curve for him, where he had to understand the
    intricacies of the commercial farming business and also the intricacies involved
    in managing it, such as crop failures due to insect infestations, changes in weather
    patterns, and the soil constitution and its effects on farm output. Hert and his
    team started gathering some parameters that they felt could help in predicting
    the farm output of a crop. They divided their analysis into weather, soil, and
    economic environments. They shared their understanding with Glanzo in bi-weekly
    meeting with him. Hert showed how weather was damaging crops in their Indian farms
    due to unpredictable rains and floods near the farm. Glanzo pointed out that the
    biggest problem they faced was determining the profile of high yielding farm land
    before purchase. “As per our founder’s vision, we are looking to buy a lot of
    farm land around the world such as in Australia, Thailand, and other regions;
    however, we can’t do this simply by blindly buying land and then finding out it
    yields less crop that the average farming operations. This means disaster to our
    ROI. You as a team should build a model that helps us in determining the profile
    of high yield cash crop farmland. To do so, you should look at the soil profile
    and what makes soil give high yield or low yield. Use whatever instruments you
    want; we can buy them. There is no shortage of funds but you must build a system
    that will benefit us the most in our bid to grow exponentially,” he said.


    After getting clear direction on which way to proceed, Hert and his team got together
    with the business operations team members to understand what constituted a soil
    profile for a sugarcane crop, which they chose for their pilot project. They selected
    the parameters shown in Table [9-3](#484167_1_En_9_Chapter.xhtml#Tab3).


    **Table 9-3** Parameters for Monitoring Soil Nutrients


    | Soil pH |

    | --- |

    | Organic Carbon % |

    | Nitrogen kg/ha |

    | Phosphorus kg/ha |

    | Potassium kg/ha |

    | Zinc mg/kg |

    | Iron mg/kg |

    | Copper mg/kg |

    | Manganese mg/kg |

    | Sulphur kg/ha |


    After having decided to zero in on these parameters in order to create a soil
    profile, they now wanted to collect data from each of the farms from Aystsaga
    Agro globally. Glanzo helped them buy the following equipment:


    1. Commercial grade IoT sensors kits to read soil nutrient data

    2. Soil nutrient manual testing kits for places where IoT sensors were hard to
    run


    We are now going to build a solution for the problem of predicting the yield of
    a sugarcane cash crop based on the dataset from the file `cashcrop_Yield_dataset.csv`.


    ## Solution


    We can assume that the dataset is produced after reading soil samples from the
    IoT sensors and manual soil nutrient test kits for the various parameters given
    in the dataset file `cashcrop_Yield_dataset.csv`. The code in Listing [9-1](#484167_1_En_9_Chapter.xhtml#PC1)
    is not the most definitive solution for this problem but one that is simple and
    quick to achieve, as in any pilot project. In a real-world scenario, the data
    collected for soil nutrients will have many more parameters. Such a data collection
    exercise may take months to complete if the size of operations spans several continents.
    Agriculture operations are spread far and wide away from urban places so it’s
    a hectic job for any company to comply. We’ll keep these factors in mind when
    designing a solution. Note that we’re only using linear regression as it gives
    a highly accurate score; however, I leave it up to you to try other regressor
    algorithms.


    ### The Python Code


    Listing [9-1](#484167_1_En_9_Chapter.xhtml#PC1) gives the Python-based solution
    for the problem that Aystsaga Agro is facing. The code starts with the usual imports
    of the common Python libraries such as `pandas`, `StringIO`, `requests`, etc.
    After this, we load the dataset from the CSV file `cashcrop_Yield_dataset.csv`.
    You can use a SQLite database instead. After this, we do the exploratory data
    analysis by looking at the mean, median, mode, standard deviation, and minimum
    and maximum values of each column of the dataframe. After this, we look at the
    outliers and count them, such as in the code `df[''Yield_per_ha''].loc[df[''Yield_per_ha'']
    <=151.50000].count()` for the yield per hectare column. This is going to be our
    predictor because the company wants to know the parameters that increase this
    yield, as discussed in the case study. We then visualize the data using boxplots
    and look at the skewness and kurtosis of the numeric columns. We also visualize
    it using an area plot and histogram. After this, it’s time to look at the relationships
    between the columns with reference to the predictor column `Yield_per_ha` with
    the `df.corr()` code. Next in a three-step process, the code in the first step
    splits data into features and target variables. In step 2, it shuffles and splits
    the final dataset into training and testing datasets for building the prediction
    model. The last step is model building and evaluation, where we use linear regression
    since our goal is to predict a numerical variable yield per hectare. The last
    lines of the code give us the ability to take any new farm values and predict
    yield per hectare through the code `predicted= regr.predict([[26,1500,6.8,0.9,367,32,490,35]])`.
    To understand more about the result of the code and how it is being executed,
    look at the discussion after Listing [9-1](#484167_1_En_9_Chapter.xhtml#PC1).'
  raw: '### Machine Learning to the Rescue?


    The machine learning team was formed in two months’ time with Hert Liu hired as
    the machine learning engineer for the pilot project. Along with three data scientists,
    he was made to take a robust tour of Aystsaga Agro’s agriculture operations in
    Brazil, South Africa, and India. The business operations team members were introduced
    to them once their induction program was over. With detailed briefings, Hert and
    his team had various new words typical to agriculture farming added to their vocabulary.
    They also understood the inside processes that went into producing crops. The
    detailed tours really helped the team in dig deeper into the company’s operations.
    However, what they lacked was the experiential knowledge, and that is the gap
    the business operations team members were going to fill in this pilot team.


    Hert and his team met a couple of times after coming together. They met Glanzo
    several times too. He effectively communicated the company founder’s vision and
    the problem at hand, which was linked to its growth. Hert was an experienced machine
    learning engineer who worked in the insurance domain earlier. His only brush with
    agriculture was creating a model for predicting claims for agricultural farmers.
    So this was a very high learning curve for him, where he had to understand the
    intricacies of the commercial farming business and also the intricacies involved
    in managing it, such as crop failures due to insect infestations, changes in weather
    patterns, and the soil constitution and its effects on farm output. Hert and his
    team started gathering some parameters that they felt could help in predicting
    the farm output of a crop. They divided their analysis into weather, soil, and
    economic environments. They shared their understanding with Glanzo in bi-weekly
    meeting with him. Hert showed how weather was damaging crops in their Indian farms
    due to unpredictable rains and floods near the farm. Glanzo pointed out that the
    biggest problem they faced was determining the profile of high yielding farm land
    before purchase. “As per our founder’s vision, we are looking to buy a lot of
    farm land around the world such as in Australia, Thailand, and other regions;
    however, we can’t do this simply by blindly buying land and then finding out it
    yields less crop that the average farming operations. This means disaster to our
    ROI. You as a team should build a model that helps us in determining the profile
    of high yield cash crop farmland. To do so, you should look at the soil profile
    and what makes soil give high yield or low yield. Use whatever instruments you
    want; we can buy them. There is no shortage of funds but you must build a system
    that will benefit us the most in our bid to grow exponentially,” he said.


    After getting clear direction on which way to proceed, Hert and his team got together
    with the business operations team members to understand what constituted a soil
    profile for a sugarcane crop, which they chose for their pilot project. They selected
    the parameters shown in Table [9-3](#484167_1_En_9_Chapter.xhtml#Tab3).


    Table 9-3


    Parameters for Monitoring Soil Nutrients


    | Soil pH |

    | --- |

    | Organic Carbon % |

    | Nitrogen kg/ha |

    | Phosphorus kg/ha |

    | Potassium kg/ha |

    | Zinc mg/kg |

    | Iron mg/kg |

    | Copper mg/kg |

    | Manganese mg/kg |

    | Sulphur kg/ha |


    After having decided to zero in on these parameters in order to create a soil
    profile, they now wanted to collect data from each of the farms from Aystsaga
    Agro globally. Glanzo helped them buy the following equipment:


    1.  Commercial grade IoT sensors kits to read soil nutrient data


    2.  Soil nutrient manual testing kits for places where IoT sensors were hard to
    run


    We are now going to build a solution for the problem of predicting the yield of
    a sugarcane cash crop based on the dataset from the file `cashcrop_Yield_dataset.csv`.


    ## Solution


    We can assume that the dataset is produced after reading soil samples from the
    IoT sensors and manual soil nutrient test kits for the various parameters given
    in the dataset file `cashcrop_Yield_dataset.csv` . The code in Listing [9-1](#484167_1_En_9_Chapter.xhtml#PC1)
    is not the most definitive solution for this problem but one that is simple and
    quick to achieve, as in any pilot project. In a real-world scenario, the data
    collected for soil nutrients will have many more parameters. Such a data collection
    exercise may take months to complete if the size of operations spans several continents.
    Agriculture operations are spread far and wide away from urban places so it’s
    a hectic job for any company to comply. We’ll keep these factors in mind when
    designing a solution. Note that we’re only using linear regression as it gives
    a highly accurate score; however, I leave it up to you to try other regressor
