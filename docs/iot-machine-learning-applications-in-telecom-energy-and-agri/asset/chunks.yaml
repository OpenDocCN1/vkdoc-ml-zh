    this book.


    ## Summary


    We have now come to the end of this case study and the book. I have thoroughly
    enjoyed bringing you these IoT-based solutions to modern-day, practical business
    problems and trying to solve them through machine learning. I hope you enjoyed
    learning from them too. Do consider leaving feedback on the forums at [`www.pmauthor.com/raspbian`](http://www.pmauthor.com/raspbian).'
