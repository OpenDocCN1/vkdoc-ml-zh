  trans: '

    ## 设置树莓派 3 Model B+


    请参考第 3 章的图 3-1，了解案例研究所需组件的示意图。有两个软件组件，即 Python IDE 和 Arduino IDE，你将在硬件组件完全设置好后进行安装。那么，让我们从硬件开始。


    设置树莓派 3 Model B+ 硬件的第一步是决定用于运行应用程序的操作系统。目前有两种流行的操作系统可供选择：**Raspbian** 和 **Noobs**。Noobs
    适用于树莓派新手。你将使用的是 Linux 版本的 Raspbian，可从 [`www.raspberrypi.org/downloads/`](http://www.raspberrypi.org/downloads/)
    获取。如图 5-1 所示，该图显示了可从树莓派官方网站下载的可用操作系统镜像。


    ![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig1_HTML.jpg](img/484167_1_En_5_Fig1_HTML.jpg)


    图 5-1


    [www.​raspberrypi.​org](http://www.raspberrypi.org) 下载选项


    请注意，在此阶段你尚未启动树莓派 3 B+，因为其 microSD 卡上尚未安装任何操作系统。树莓派 3 B+ 套件附带一张 microSD 卡和一个 microSD
    卡读卡器或适配器。如果你没有 microSD 卡，可以从我网站 [`www.pmauthor.com/raspbian/`](http://www.pmauthor.com/raspbian/)
    上的选项中获得。对于 Raspbian 的安装，建议的 microSD 卡基本容量为 8GB。对于 Raspbian Lite 镜像安装，Raspberrypi.org
    建议至少 4GB。请记住，只有树莓派 3A+、3B+ 和 Compute Module 3+ 可以从大于 256GB 的 SD 卡启动。这是因为早期树莓派型号所使用的
    SoC 存在一个错误。另外，请务必注意你的 microSD 卡所属的等级，因为这决定了其支持的写入速度；Class 4 卡很可能以 4MB/s 的速度写入，而
    Class 10 卡应能达到 10 MB/s。请注意，这并不意味着 Class 10 卡在常规读写性能上一定优于 Class 4 卡，因为这种写入速度通常是以牺牲读取速度和大幅增加
    microSD 卡操作的寻道时间为代价的。你的树莓派 3 B+ 套件附带的 microSD 卡应该是最新的，并且很可能像现在常见的那样是 Class 10
    的；但是，如果你拿到的是 Class 4 等较低等级的卡，可以在 [`www.pmauthor.com/raspbian/`](http://www.pmauthor.com/raspbian/)
    订购一张更快的 Class 10 卡。


    当然，你的笔记本电脑必须有一个插槽，可以直接或通过适配器读写 microSD 卡。如图 5-2 所示。此外，你还需要一台运行 Windows 或 MacOS
    的电脑或笔记本电脑，以便下载此镜像，然后格式化 SD 卡并将此镜像安装到卡上。本章我将向你展示如何在 Windows 系统上完成此操作。


    ![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig2_HTML.jpg](img/484167_1_En_5_Fig2_HTML.jpg)


    图 5-2


    官方套件附带的 microSD 卡和 microSD 卡适配器


    暂时不要将 microSD 卡适配器插入树莓派 3 B+ 主板，因为它是空的，尚未格式化，也没有写入任何操作系统镜像。你需要先点击网站的下载部分，下载 Raspbian
    镜像。完成后，你将获得下载最新版 Raspbian 镜像的选项。在撰写本书时，有三个下载选项，如图 5-3 所示。


    ![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig3_HTML.jpg](img/484167_1_En_5_Fig3_HTML.jpg)


    图 5-3


    Raspbian 下载选项


    第一个选项是 **Raspbian Buster**，这是适用于桌面环境并推荐软件的 Raspbian 版本名称。第二个选项仅包含桌面环境，第三个是 Lite
    版本，它不具备你为物联网应用进行广泛编程所需的所有功能。因此，你将使用第一个选项，它提供了入门所需的所有软件组件。你可以根据解压软件点击 Torrent 或
    zip 文件。我使用的是 zip 文件版本。Raspbian Buster 版本的 zip 文件大约为 2.3GB，因此下载时间取决于你的网络连接速度。


    下载完成后，你需要将 microSD 卡读卡器插入用于将操作系统安装到 SD 卡插槽的电脑/笔记本电脑。由于你使用的是 Windows，因此需要一个磁盘映像工具。我使用的免费工具是
    **Win32 Disk Imager**。如果你没有，可以从这个页面下载：[`www.pmauthor.com/raspbian/`](http://www.pmauthor.com/raspbian/)。从网站下载并安装
    Win32 Disk Imager 工具后，你可以双击其图标打开它。它应该看起来像图 5-4 中所示。


    ![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig4_HTML.jpg](img/484167_1_En_5_Fig4_HTML.jpg)


    图 5-4


    Win32 Disk Imager


    点击图中所示的浏览图标，找到你下载并解压后的镜像文件。选择镜像文件位置后，点击右侧的 Device 下拉框，从中选择你的 microSD 卡盘符。对话框中的
    Write 按钮将变为可用，点击它即可写入镜像。进度条会显示完成进度；这应该只需要几分钟。完成后，点击 Exit 按钮弹出 microSD 卡。现在，你的
    microSD 卡上已写入了最新的 Raspbian OS 镜像，可以启动了。但是，在启动之前，你需要设置单板计算机（SBC）板上的物理连线，然后将 microSD
    卡连接到树莓派 3 B+ 主板。


    设置树莓派 3 Model B+ 的第二步是连接其主板，如第 2 章中 GPIO 引脚和 SBC 各组件的照片所示。你需要插入最少的必要组件才能开始。首先，你需要一个
    LED/LCD 电视或显示器。市面上有很多选择，但我喜欢并在我的项目中使用的列在 [`www.pmauthor.com/raspbian/`](http://www.pmauthor.com/raspbian/)。如果你有闲置的电视，可以使用
    HDMI 转 HDMI 线缆将其连接到 SBC 的 HDMI 端口。见图 5-5 和 5-6。


    ![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig5_HTML.jpg](img/484167_1_En_5_Fig5_HTML.jpg)


    图 5-5


    HDMI 转 HDMI 线缆


    如果你有一个 5 英寸或 7 英寸的小型显示器，那么你会使用不同的线缆，并且紧凑型 LCD/LED 面板上可能没有 HDMI 插槽。


    ![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig6_HTML.jpg](img/484167_1_En_5_Fig6_HTML.jpg)


    图 5-6


    树莓派 3 B+ 上的 HDMI 端口

    '
- fmt: "已连接好的树莓派应如图 [5-7](#484167_1_En_5_Chapter.xhtml#Fig7) 所示。请确保连接正确，并且两端（电视显示器和树莓派\
    \ 3 B+）的接口都没有松动，否则显示器将无法显示。这是初学者常见的问题：当你给树莓派上电后，发现显示器没有画面，却不知道发生了什么。这个问题很容易解决，因为树莓派的\
    \ `HDMI` 端口很大，你可以清楚地看到线缆是否牢固地插在主板上。此外，在插拔 `HDMI` 线缆时，请务必不要给树莓派 3 B+ 通电；这既是出于安全考虑，也是操作上的要求。有时，当你给树莓派通电后再插入\
    \ `HDMI` 线缆，显示器可能不会显示画面。在这种情况下，请重启树莓派 3 B+，因为这款单板计算机（SBC）上没有重启按钮。\n\n在最终启动树莓派之前，我建议你做两件事。第一，将一个\
    \ `USB` 鼠标的接收器插入树莓派 3 B+ 主板上的四个 `USB` 端口之一。第二，再插入一个无线键盘的 `USB` 接收器。这些是控制你的单板计算机（SBC）的必需品。你可以在图\
    \ [5-7](#484167_1_En_5_Chapter.xhtml#Fig7) 中看到它们连接到 SBC 的样子。如果你没有无线版本的鼠标或键盘，也不必担心；有线版本的\
    \ `USB` 鼠标和键盘也能很好地工作。只是有线设备对于非常轻巧的 SBC 来说会显得有些沉重，当鼠标或键盘的线缆晃动时，SBC 可能会跟着移动。\n\n\
    ![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig7_HTML.jpg](images/484167_1_En_5_Chapter/484167_1_En_5_Fig7_HTML.jpg)\n\
    \n**图 5-7**  \n连接到 SBC 的 USB 接收器\n\n接下来，要让你的树莓派启动，你需要将其连接到电源。这款小巧的 SBC 的妙处在于它使用\
    \ `microUSB` 作为电源。这意味着你也可以通过连接 `microUSB` 电源线，用移动电源为其供电。为什么需要移动电源？它可以提供备用电源，这样在断电时树莓派就不会关机。如果你生活在世界上经常停电的地区，这一点非常重要。如果你所在的地区电力稳定，则无需连接移动电源，可以直接通过电源适配器充电器连接到电源。你可以在图\
    \ [5-8](#484167_1_En_5_Chapter.xhtml#Fig8) 中看到我连接到移动电源的方式。\n\n![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig8_HTML.jpg](images/484167_1_En_5_Chapter/484167_1_En_5_Fig8_HTML.jpg)\n\
    \n**图 5-8**  \n连接到移动电源的树莓派 3 B+ 电源线\n\n图中是一个 `Portronics` 10000mAh 的移动电源。它可以为商业应用提供几个小时的电力。在我们的一次工厂能源审计应用中，我们不得不创建一个移动电源备份方案，将一个移动电源与另一个串联，第一个为第二个供电，这样即使断电几个小时，其上运行的树莓派能源审计应用也不会受到影响。有时你需要跳出思维定式，才能构建出能够从容应对停电的商业级应用。\n\
    \n现在，要让你的树莓派 3 B+ 启动，你只需将电源线的 `microUSB` 端插入 SBC 的电源插槽，如图 [5-9](#484167_1_En_5_Chapter.xhtml#Fig9)\
    \ 所示。请记住，如果你已经连接了电源或移动电源，并且在将线缆插入 SBC 时，它可能会在你手中启动。为防止这种情况，请确保在连接 `microUSB` 时，另一端没有通电。\n\
    \n![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig9_HTML.jpg](images/484167_1_En_5_Chapter/484167_1_En_5_Fig9_HTML.jpg)\n\
    \n**图 5-9**  \n连接到树莓派 3 B+ SBC 的 microUSB 和 HDMI 线缆\n\n现在你已经准备好启动设备了，请继续为连接到 `microUSB`\
    \ 电源线的电源适配器通电。你会看到 `HDMI` 端口插槽附近有一个绿色 `LED` 闪烁，连接的 `LED/LCD` 显示器应该会显示你在第 [3](#484167_1_En_3_Chapter.xhtml)\
    \ 章中看到的启动画面。现在你拥有的是安装了最新版 `Raspbian` 的基本树莓派。接下来，你需要安装软件，以便与物联网传感器和设备一起工作。\n\n\
    如果你运行的是 `Raspbian`（非 `Lite` 版本），`Python` 2.7 版本已预装在 `Raspbian` 发行版镜像中。但是，如果你想使用\
    \ `Python 3`，则需要通过以下 `Raspbian` 命令行提示符进行安装。毋庸置疑，你需要通过连接的以太网线缆或 `Wi-Fi` 连接为树莓派提供网络连接。\n\
    \n```\npi@raspberrypi:~ $ sudo apt-get install python3\n```\n\n通过在图 [5-10](#484167_1_En_5_Chapter.xhtml#Fig10)\
    \ 中给出的命令，测试你在 `Raspbian` 上的 `Python 3` 安装。\n\n![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig10_HTML.jpg](images/484167_1_En_5_Chapter/484167_1_En_5_Fig10_HTML.jpg)\n\
    \n**图 5-10**  \n测试 Python 3 安装\n\n现在你已经安装并测试了所需的 `Python` 版本，你需要一个集成开发环境（IDE）来在\
    \ `Raspbian` 上进行编程。我推荐你使用 `Thonny IDE`，因为它允许你在编辑器内的一个地方编译和运行程序。我在第 [3](#484167_1_En_3_Chapter.xhtml)\
    \ 章中已经讨论过它的需求和特性，所以我们直接进入在 `Raspbian` 上安装它的步骤。\n\n`Thonny IDE` 是免费的，并且预装在大多数带有\
    \ `Stretch` 程序的 `Raspbian` 操作系统中。如果你在已安装的程序中没有找到它，正如你在第 [3](#484167_1_En_3_Chapter.xhtml)\
    \ 章中看到的，可以从其网站下载：`https://thonny.org/`。这个网站的好处是，它的主页上有一个关于如何使用该 IDE 的图文教程，非常基础和简单。安装可以使用清单\
    \ [5-1](#484167_1_En_5_Chapter.xhtml#PC2) 中的命令完成。"
  raw: 'The connected Raspberry Pi will look like the one in Figure [5-7](#484167_1_En_5_Chapter.xhtml#Fig7).
    Make sure you get the connections right and do not to leave them loose in the
    port on both sides (the TV display and the Raspberry Pi 3 b+) or your display
    will not show up. This is a common beginner problem; after you power on your Raspberry
    Pi, you don’t see the display coming up and you wonder what happened. It’s an
    easy mistake to fix because the HDMI ports on the Raspberry Pi are quite large
    so you can see if the wire is secured properly on to the board. Also, make sure
    you do not power on the Raspberry Pi 3 B+ when you are fixing the HDMI cable onto
    it; this is important both as a safety precaution and as an operational requirement.
    Sometimes, when you have a powered-on Raspberry Pi and you fix the HDMI cable
    into its HDMI port, the display won’t show up. In this case, restart the Raspberry
    Pi 3 B+ as there is no reboot button on this SBS.


    There are two things I recommend doing before you finally boot up your Raspberry
    Pi. The first is to insert a USB mouse dongle into one of the four USB ports on
    the Raspberry Pi 3 B+ board. The second is to add another USB dongle for a wireless
    keyboard. These are essentials for you to control your SBC. You can see them connected
    to the SBC in Figure [5-7](#484167_1_En_5_Chapter.xhtml#Fig7). Don’t worry if
    you do not have a wireless version of a mouse or a keyboard; the wired versions
    of the USB mouse and keyboards work pretty well. It’s just that the wired devices
    prove to be a bit too heavy for the SBC, which is very light and can move around
    if the wire of the mouse or keyboard shakes.


    ![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig7_HTML.jpg](images/484167_1_En_5_Chapter/484167_1_En_5_Fig7_HTML.jpg)


    Figure 5-7


    USB dongles connected to the SBC


    Next, to get your Raspberry Pi to boot up, you need to plug it into a power source.
    The wonderful thing about this small SBC is that it uses microUSB as its power
    source. This means that you can power it via a power bank as well by attaching
    a microUSB power cable to it. Why do you need a power bank? It provides a power
    backup so that it does not shut down when the power goes off. This is important
    if you live in a region of the world where power cuts are frequent. If your region
    has stable power, then you do not need to connect to a power bank and you can
    connect it to the power source through a power adapter charger. You can see my
    connection to a power bank in Figure [5-8](#484167_1_En_5_Chapter.xhtml#Fig8).


    ![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig8_HTML.jpg](images/484167_1_En_5_Chapter/484167_1_En_5_Fig8_HTML.jpg)


    Figure 5-8


    Raspberry Pi 3 B+ power cord connected to a power bank


    What you see in the image is a Portronics 10000mAH power bank. It provides power
    for commercial applications for a few hours. In one of our factory energy audit
    applications, we had to create a power bank backup with one power bank connected
    to another one in serial, the first one feeding into the another one, so that
    even if the power went off for a few hours, the Raspberry Pi energy audit applications
    running on it would not be affected. Sometimes you need to think out of the box
    to build commercial grade applications that can take power cuts in its stride.


    Now to bring your Raspberry Pi 3 B+ to life you just need to insert the microUSB
    side of the power cable into the power slot of the SBC, as shown in Figure [5-9](#484167_1_En_5_Chapter.xhtml#Fig9).
    Please remember that if you have connected to a power source or a power bank and
    you are inserting the wire in the SBC, it will boot up in your hand. To prevent
    this, make sure the other end does not have power when you connect the microUSB
    to it.


    ![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig9_HTML.jpg](images/484167_1_En_5_Chapter/484167_1_En_5_Fig9_HTML.jpg)


    Figure 5-9


    microUSB and HDMI cables connected to Raspberry Pi 3 B+ SBC


    Now you are ready to boot up your device, so go ahead and switch on the power
    to your power adapter, which is connect to microUSB power cable. You will see
    a green LED blink near the HDMI port slot and the connected LED/LCD monitor should
    show the booting up image you saw in Chapter [3](#484167_1_En_3_Chapter.xhtml).
    Now you just have the basic Raspberry Pi with the latest version of Raspbian installed
    onto it. Next you need the software to be installed in order to work with the
    IoT sensors and devices.


    If you are running Raspbian (not the Lite version), Python version 2.7 is preinstalled
    with the Raspbian distribution image. However, if you want to use Python 3, it
    needs to be installed through the following Raspbian command line prompt. Needless
    to say, you need an internet connection either through a connected Ethernet cable
    or a Wi-Fi connection to your Raspberry Pi.


    ```

    pi@raspberrypi:~ $ sudo apt-get install python3

    ```


    Test your Python 3 installation on the Raspbian by typing the command given in
    Figure [5-10](#484167_1_En_5_Chapter.xhtml#Fig10).


    ![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig10_HTML.jpg](images/484167_1_En_5_Chapter/484167_1_En_5_Fig10_HTML.jpg)


    Figure 5-10


    Testing the Python 3 installation


    Now that you have the required Python version installed and tested, you need an
    integrated development environment (IDE) to program on Raspbian. I recommend you
    use the Thonny IDE because it lets you compile programs and run them in a single
    place inside an editor. I have discussed the need and features in Chapter [3](#484167_1_En_3_Chapter.xhtml)
    so let’s get straight to the steps you need to install it on your Raspbian.


    The Thonny IDE is free and comes preinstalled on most Raspbian OSes with Stretch
    program. If you do not find it in your installed programs, as you saw in Chapter
    [3](#484167_1_En_3_Chapter.xhtml), it can be downloaded from its website: [`https://thonny.org/`](https://thonny.org/).
    The good thing about this website is that it has a pictorial tutorial on its home
    page on how to use the IDE, which is pretty basic and simple. The installation
    can be done using the command in Listing [5-1](#484167_1_En_5_Chapter.xhtml#PC2).'
  trans: '

    连接好的树莓派将如图 5-7 所示。请确保连接正确，并且两端（电视显示屏和树莓派 3 B+）的接口处不要松动，否则显示器将无法显示画面。这是初学者常见的问题：当你给树莓派通电后，发现显示器没有画面，却不知道发生了什么。这个问题很容易解决，因为树莓派的
    HDMI 接口比较大，你可以清楚地看到线缆是否牢固地插在主板上。此外，在插拔 HDMI 线缆时，请务必不要给树莓派 3 B+ 通电；这既是出于安全考虑，也是操作上的要求。有时，当你给树莓派通电后再插入
    HDMI 线缆，显示器可能不会显示画面。这种情况下，请重启树莓派 3 B+，因为这款单板计算机（SBC）上没有重启按钮。


    在最终启动树莓派之前，我建议你做两件事。第一，将一个 USB 鼠标接收器插入树莓派 3 B+ 主板上的四个 USB 端口之一。第二，再插入一个无线键盘的 USB
    接收器。这些是控制你的单板计算机（SBC）的必需品。你可以在图 5-7 中看到它们连接到 SBC 的样子。如果你没有无线版本的鼠标或键盘，也不必担心；有线版本的
    USB 鼠标和键盘也能很好地工作。只是有线设备对于非常轻巧的 SBC 来说会显得有点沉重，如果鼠标或键盘的线缆晃动，SBC 可能会跟着移动。


    ![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig7_HTML.jpg](img/484167_1_En_5_Fig7_HTML.jpg)


    图 5-7


    连接到 SBC 的 USB 接收器


    接下来，要让你的树莓派启动，你需要将其连接到电源。这款小巧的 SBC 的妙处在于它使用 microUSB 作为电源接口。这意味着你也可以通过连接一根 microUSB
    电源线，用移动电源为其供电。为什么需要移动电源？它可以提供备用电源，这样在断电时树莓派就不会关机。如果你生活在世界上经常停电的地区，这一点尤为重要。如果你所在的地区电力稳定，则无需连接移动电源，可以直接通过电源适配器充电器连接到电源。你可以在图
    5-8 中看到我连接移动电源的方式。


    ![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig8_HTML.jpg](img/484167_1_En_5_Fig8_HTML.jpg)


    图 5-8


    连接到移动电源的树莓派 3 B+ 电源线


    图中是一个 Portronics 10000mAH 的移动电源。它可以为商业应用提供几个小时的电力。在我们的一次工厂能源审计应用中，我们不得不创建一个移动电源备份方案，将一个移动电源与另一个串联，第一个为第二个供电，这样即使断电几个小时，运行在树莓派上的能源审计应用也不会受到影响。有时你需要跳出固有思维，才能构建出能够从容应对断电的商业级应用。


    现在，要让你的树莓派 3 B+ 启动，你只需将电源线的 microUSB 端插入 SBC 的电源插槽，如图 5-9 所示。请记住，如果你已经连接了电源或移动电源，并且在将线缆插入
    SBC 时，它可能会在你手中启动。为避免这种情况，请确保在连接 microUSB 端时，另一端没有通电。


    ![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig9_HTML.jpg](img/484167_1_En_5_Fig9_HTML.jpg)


    图 5-9


    连接到树莓派 3 B+ SBC 的 microUSB 和 HDMI 线缆


    现在你已经准备好启动设备了，请继续操作，打开连接到 microUSB 电源线的电源适配器的开关。你会看到 HDMI 接口插槽附近有一个绿色 LED 闪烁，连接的
    LED/LCD 显示器应该会显示你在第 3 章中看到的启动画面。现在你拥有了一台安装了最新版 Raspbian 系统的基本树莓派。接下来，你需要安装软件，以便与物联网传感器和设备协同工作。


    如果你运行的是 Raspbian（非 Lite 版本），Python 2.7 已预装在 Raspbian 发行版镜像中。但是，如果你想使用 Python 3，则需要通过以下
    Raspbian 命令行提示符进行安装。不用说，你需要通过连接的以太网线或 Wi-Fi 连接为树莓派提供网络。


    ```

    pi@raspberrypi:~ $ sudo apt-get install python3

    ```


    通过输入图 5-10 中给出的命令，测试你在 Raspbian 上的 Python 3 安装。


    ![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig10_HTML.jpg](img/484167_1_En_5_Fig10_HTML.jpg)


    图 5-10


    测试 Python 3 安装


    现在你已经安装并测试了所需的 Python 版本，你需要一个集成开发环境（IDE）来在 Raspbian 上进行编程。我推荐你使用 Thonny IDE，因为它允许你在编辑器内编译和运行程序。我在第
    3 章中已经讨论过它的需求和特性，所以我们直接进入在 Raspbian 上安装它的步骤。


    Thonny IDE 是免费的，并且大多数带有 Stretch 程序的 Raspbian 操作系统都已预装。如果你在已安装的程序中没有找到它，正如你在第 3
    章中看到的，可以从其网站下载：[`https://thonny.org/`](https://thonny.org/)。这个网站的好处是，它的主页上有一个关于如何使用该
    IDE 的图文教程，非常基础且简单。安装可以使用清单 5-1 中的命令完成。

