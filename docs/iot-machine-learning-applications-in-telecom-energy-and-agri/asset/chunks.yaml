  trans: '

    在新建发电厂的调试过程中，该电厂峰值负荷装机容量为 500 兆瓦，而当前峰值负荷需求为 640 兆瓦。困扰其运行的问题包括：电力系统损耗高、电厂效率低、供电不稳定、窃电现象、停电事故以及电厂维护资金短缺。总体而言，过去十年该国发电机组无法满足系统需求。目前该国正从邻国购电，且需以美元支付，这正在消耗其宝贵的外汇储备。每当该电厂发生故障停电时，便从邻国获取备用电力以维持供电。该电厂在夏季和冬季用电高峰季节均存在发电问题。


    诺巴格总统阿格·齐西上月因夏季大量消费者投诉电厂停电事故，紧急召见了首席执行官诺基·奥拉。这些停电导致首都地区多次断电数小时。最近一次停电持续超过 48 小时，直至邻国提供替代电力后全城才恢复供电。总统质疑为何一座仅投产八个月的新电厂会问题频发。火电厂设计寿命通常超过
    30 年。由于媒体持续施压，指责政府无法为首都提供充足电力，总统召集欧洲企业集团官员成立调查委员会，要求就频繁停电的原因及解决方案提交报告。该委员会耗时 20
    余天研究电厂基础设施。团队中包括一位名为卡尔的机器学习工程师，他受命利用电厂现有数据协助团队确定停电的真正原因。卡尔通过 Modbus RS485 接口设备，在两周内从电厂关键设备中采集数据。其发现如下：


    *   蒸汽轮机是电厂最常见的停电故障源。

    *   必须设法缩短停电持续时间。

    *   需减少停电次数。

    *   需围绕电厂当前负荷及未来数小时的预测负荷建立预测模型。


    基于第一委员会的调查结果，诺巴格政府成立了第二个国家委员会，以查明并纠正停电的主要原因。报告发现，故障实际上源于燃气轮机运行协调不足。


    同样参与第二国家委员会的卡尔制定了以下参数，用于从燃气轮机/电网收集停电数据：


    *   总周期 T

    *   周期 T 内发生的故障次数

    *   维护间隔期间的故障次数

    *   维护间隔期间的总运行时间

    *   每年总停电小时数

    *   每年故障次数

    *   燃气轮机运行时间

    *   燃气轮机停机时间


    与任何传统燃煤电厂设施一样，各设备与机器独立运行，缺乏集中存储的互联数据源。从汽轮机到变压器再到锅炉，每个单元均独立监控。此外，电厂并未存储卡尔所需的数据，因此委员会成员无法确定燃气轮机故障的真正原因。国家委员会要求诺基·奥拉的公司利用物联网传感器从燃气轮机采集数据，并通过中继传输存储至新的私有云服务器。结果需在两周内全天候生成，以便清晰记录停电持续时间。此举旨在帮助卡尔创建停电预测模型。当然，描述和诊断停电也是流程的一部分。委员会的努力方向是让电厂公司从被动应对转向主动预防，对电厂内部发生的停电事件具备预测性和规范性。


    如同任何改变运营方式的尝试，委员会的工作遭遇了阻力。工会联合起来，迫切想知道此举的后果：是否会导致失业？是否会削减薪资？所有人都充满疑虑。在汽轮机周围安装新型物联网传感器以获取新数据集的做法也遭到抵制。尽管如此，卡尔及其团队仍决心推进计划实施。


    该计划部署了大量传感器，从测量汽轮机周围温度和光照的传感器，到测量附近超声波信号的传感器。卡尔希望确保在确定汽轮机故障的真正原因时不留任何死角。尽管身为机器学习工程师，卡尔仍需研究其工作领域——电厂，因此他必须学习电厂的完整运行原理。他绘制了电厂的简易示意图，其单元如图
    8-1 所示。


    ![../images/484167_1_En_8_Chapter/484167_1_En_8_Fig1_HTML.jpg](img/484167_1_En_8_Fig1_HTML.jpg)


    图 8-1


    火电厂原理示意图


    他向委员会官员及其他不了解火电厂工作原理的成员展示了这份报告。报告内容如下：


    “请记住，这并非技术图纸，而是一份帮助您理解火电厂关键组件的简图。实际电厂更为复杂，但核心组件相同。让我们逐一讨论各个组件。


    锅炉是一种容器，水作为输入进入其中，蒸汽以所需的压力、温度和流量输出。热量施加于容器上。为此，锅炉需具备燃烧燃料并释放热量的功能。锅炉的主要功能如下：


    *   将燃料（如空气）的化学能转化为热能。

    *   将这些热能传递给水使其蒸发，并传递给蒸汽使其过热。


    锅炉的基本组件包括：


    *   炉膛与燃烧器

    *   蒸汽与过热装置


    同样，另一组件——省煤器，旨在通过从烟气中回收热量来加热给水并将其送入锅炉汽包，从而提高锅炉效率。


    顾名思义，省煤器的优点包括：


    *   节省燃料：用于节约燃料，提高锅炉装置的整体效率。

    *   减小锅炉尺寸：由于给水在省煤器中预热后以更高温度进入锅炉管，所需的蒸发换热面积显著减少。

    '
- fmt: '# 排版后的文本


    在低压和高压加热器中，热量从流经省煤器的烟气中提取，并进一步用于预热空气，然后将其供应至燃烧室。这是将热空气送入煤粉燃料系统以干燥煤炭、促进炉膛内燃料燃烧的关键设备。如果缺少此功能，燃烧室可能会出现故障。发电厂炉膛还包含一个再热器组件，其管道由流出的高温烟气加热。从高压涡轮机排出的蒸汽被引导流经再热器管道以重新获得能量，从而驱动后续的中低压涡轮机。


    蒸汽轮机主要用作所有火力发电站的关键组件。蒸汽轮机分为两种类型：


    *   冲动式汽轮机

    *   冲动-反动式汽轮机


    涡轮发电机由一系列相互连接并连接到同一根轴（铁棒结构）上的蒸汽轮机和一台发电机构成。一端是高压涡轮机（`HPT`），随后是中压涡轮机（`IPT`）、两个低压涡轮机（`LPT`）和发电机。蒸汽以高温（约`536°C`至`540°C`）和高压（`140`至`170
    kg/cm²`）在涡轮机中膨胀。


    冷凝器将涡轮机排出的蒸汽冷凝成液体，以便进一步泵送。冷凝器的功能包括：


    *   为蒸汽提供最低的排热温度。

    *   将来自涡轮机的排汽转化为水以备再用，从而节省发电厂的给水需求。


    冷却塔是一种半封闭装置，通过空气接触对水进行蒸发冷却。来自冷凝器的热水被输送到塔顶，并以薄片或水滴的形式向下滴落。空气从塔底或垂直于水流方向流入，在有效冷却后排入大气。


    发电机是涡轮发电机组的电气终端。它将燃气轮机的机械能转换为电能。发电基于电磁感应原理。没有发电机，燃气轮机的输出将无法产生电力。因此，它是发电厂中最重要的设备。


    卡尔在他的报告中解释了这些内容之后，又说明了从燃气轮机周围的物联网传感器获取数据所需的设置。正如第一份委员会报告所指出的，故障发生在燃气轮机上。然而，该报告未能得出根本原因，也未指出任何可能导致燃气轮机反复故障的潜在问题。这使得情况更加复杂，因此需要结合燃气轮机附带电子单元生成的数据进行监控，这些数据通过`Modbus`协议发送到树莓派（`Raspberry
    Pi`）工作站进行收集。为了确定根本原因并观察外部环境温度是否产生影响，在燃气轮机上安装了一些物联网传感器。监测了三个参数：环境光、环境温度，以及用于测量机器设备周围超声波声音的物联网传感器。当然，在现阶段，这只是一个假设，即外部环境中的任何这些因素都可能导致令电厂工程师和设备制造商困惑的故障。只有精心收集的数据才能证明或反驳这一假设。该设置如图[8-2](#484167_1_En_8_Chapter.xhtml#Fig2)所示。


    ![../images/484167_1_En_8_Chapter/484167_1_En_8_Fig2_HTML.jpg](images/484167_1_En_8_Chapter/484167_1_En_8_Fig2_HTML.jpg)


    **图 8-2** 用于收集数据的燃气轮机物联网传感器


    树莓派 3 B+（`Raspberry Pi 3 B+`）使用`Python`程序以`SQLite`格式记录数据，记录时间至少持续数周，在此期间燃气轮机很可能发生故障。然后，使用`Python`对收集到的数据应用机器学习程序，以得出最终结论。


    首席执行官诺基·奥拉（`CEO Noki Ora`）希望卡尔和他的团队提供以下结果：


    *   关于那台异常蒸汽轮机故障原因的确凿证据

    *   能够实现自动监控和预测故障流程的可行解决方案


    两者都必须作为概念验证阶段向第二委员会进行演示，以便后续开展商业开发。


    至此，本案例研究结束。我们将从`SQLite3`数据库`powerplant.db`中收集的蒸汽轮机数据集中推导出解决方案。我们将使用这些数据，假设电厂技术人员从物联网传感器收集了这些数据并将其发送到树莓派程序。使用机器学习技术的完整`Python`代码解决方案如清单[8-1](#484167_1_En_8_Chapter.xhtml#PC1)所示。'
  raw: 'In the LP and HP heaters, the heat is taken out from the flue gases as they
    flow out of economizer and then further utilized for preheating the air before
    supplying it to the combustion chamber. It is key equipment for sending hot air
    for drying the coal in pulverized fuel systems to facilitate the combustion of
    fuel in the furnace. If this function is not present, there can be malfunction
    in the combustion chambers. Power plant furnaces also have a reheater component,
    which has tubes heated by hot flue gases flowing out of the tubes. Exhaust steam
    flowing out of the high pressure turbine is made to flow inside the reheater tubes
    to get energized in order to run the intermediate lower pressure turbines.


    Steam turbines are used mainly as key components in all thermal power stations.
    The steam turbines are of two types:


    *   Impulse turbine


    *   Impulse-reaction turbine


    The turbine generator consists of a series of steam turbines that are connected
    to each other and a generator on a common shaft (iron rod structure). There is
    a high pressure turbine (HPT) at one end, followed by an intermediate pressure
    turbine (IPT), two low pressure turbines (LPT), and the generator. The steam flows
    at high temperature in the range of (536 ‘c to 540 ‘c) and with pressure (140
    to 170 kg/cm2) is expanded in the turbine.


    The condenser condenses the steam flowing out of the exhaust of the turbine into
    liquid to allow it to be pumped further. The functions of a condenser are


    *   To provide the lowest rate of heat rejection temperature for steam.


    *   To convert the exhaust steam coming from the turbines to water for reserve,
    thus saving on the feed water requirement for the power plant.


    The cooling tower is a semi-enclosed device for evaporative cooling of water by
    contact with air. The hot water coming out from the condenser is fed to the tower
    on the top and allowed to trickle in the form of thin sheets or drops. The air
    flows from bottom of the tower or perpendicular to the direction of water flow
    and then exhausts to the atmosphere after effective cooling.


    The generator is the electrical end of a turbo-generator set. It is a convertor
    of the mechanical energy of the gas turbine into electricity. The generation of
    electricity is based on the principle of electromagnetic induction. Without the
    generator, the output of the gas turbine will not give out electricity. So it
    is the most important piece of equipment in the power plant.”


    After explaining this in his report, Carl explained the setup needed to get data
    from the IoT sensors around the gas turbine. The outage was happening in the gas
    turbine, as the first commission’s report pointed out. However, it was not able
    to conclude the root cause or point to any potential problems that could have
    led to the repeated outage in the gas turbine. This made it more complicated,
    so it needed to be monitored along with the data that was being generated by the
    attached electronic unit with the gas turbine and was sent to a Raspberry Pi station
    to collect data using the Modbus protocol. In order to determine the root cause
    and to see if there was any effect of outside environment temperature, some IoT
    sensors were installed on the gas turbine. Three parameters were monitored: ambient
    light, ambient temperature, and an IoT sensor to measure ultrasonic sounds around
    the machine equipment. Of course, it was just a hypothesis at this stage that
    any of these elements from the outside environment could lead to an outage that
    was puzzling the plant engineers and the equipment manufacturers. Only meticulously
    collected data would be able to prove or disprove the hypothesis. The setup is
    shown in Figure [8-2](#484167_1_En_8_Chapter.xhtml#Fig2).


    ![../images/484167_1_En_8_Chapter/484167_1_En_8_Fig2_HTML.jpg](images/484167_1_En_8_Chapter/484167_1_En_8_Fig2_HTML.jpg)


    Figure 8-2


    Iot sensors used on the gas turbine to collect data


    The Raspberry Pi 3 B+ records the data using a Python program in the SQLite format
    for at least couple of weeks during which an outage in the gas turbine is likely
    to occur. The machine learning program is applied on this collected data using
    Python to arrive at final conclusions.


    CEO Noki Ora wanted Carl and his team to provide the following results:


    *   Conclusive evidence of the cause of outage in the rogue steam turbine


    *   Possible solutions that would enable an automated process of monitoring and
    predicting outages


    Both had to be demonstrated to the second commission as a proof of concept stage
    so that further commercial development could be taken up.


    With this we come to the end of the case study. We will derive our solutions from
    the dataset collected from the steam turbine machine in the SQLite3 database named
