    ## Industrial Internet of Things


    It is now time to understand the Industrial Internet of Things (IIoT). The IIoT
    plays the industrial equivalent of the IoT; it is computers, devices, and objects
    that may be connected to each other and share shop data with each other. The collected
    data resides as a central service like the cloud-based service or resides in private
    computers which they access for their own use. IIoT works in the manufacturing
    world. IIoT allows access to industrial data at better speeds and direct use of
    connected devices in the factory environment. Many IIoT protocols such as the
    `Modbus` or `MQTT` protocols allow IoT devices to directly link with industrial
    devices like assembly-line machines, processing machines, boilers, or heat exchangers,
    to just name a few. So what is the advantage of connecting today’s factory machines,
    which are already monitored by their own software of some kind? Yes, it is true
    that any kind of an industrial machine that is built today has some kind of monitoring
    and control system which has data that is available from within the machine since
    it has a limited storage capacity recycled for continuous operation. Let’s consider
    a heat exchanger, as part of a power plant. It has data about temperature details
    like heat and pressure within the control panel. However, if we want to make the
    single unit machine more efficient and productive, there is some kind of a pattern
    operating them and this data can be centralized on a public or private cloud.
    You could also apply some IoT sensors to the heat exchanger in order to collect
    different data that is not generated within it. So we see in this simple example
    that the biggest benefit can be cost reduction if we are able to collect data
    from machines currently sitting in silos and then apply learning and deep learning
    on them to gain an advantage. This can be seen from Figure [2-3](#484167_1_En_2_Chapter.xhtml#Fig3).


