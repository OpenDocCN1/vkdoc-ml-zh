    The library gpiozero is not installed in the default version of Python on Raspberry
    Pi so you must do so by typing `pip install gpiozero` in the installed Python
    directory. This library has the requisite properties and functions to communicate
    with the GPIO pins and devices. In this program, you first import the gpiozero
    library LightSensor and then in second line you initialize it to GPIO pin number
    25 to get the signal from the LDR module. Refer to Table [3-1](#484167_1_En_3_Chapter.xhtml#Tab1)
    for the GPIO signal pin number to the one given in the second line of this program;
    they should match or you will not be able to communicate with the LDR module at
    all. Next, you use an infinite loop to print the LDR value, which is returned
    as 0 for day and 1 for night. However, the output is a floating point number closer
    to 1 between 0.9 and 1\. If you want it to be more sensitive, you may need to
    adjust the blue potentiometer on top of the LDR module. This small program uses
    an `if` condition to check if the value of the LDR is greater than 0 and then
    it prints “It is Night time now;” otherwise, it prints “It is Day time.” After
    the loop comes to the end, you turn off the LDR module sensor so that it can be
    initialized again. In the real world, this is where your application code to control
    any device such as an LED light or any other appliance through the Raspberry Pi
    would sit. Listing [3-4](#484167_1_En_3_Chapter.xhtml#PC6) gives the output of
    the program run in Listing [3-2](#484167_1_En_3_Chapter.xhtml#PC4) using Python.


