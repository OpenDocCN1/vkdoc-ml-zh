- fmt: 'In the diagram, there is an industrial machine with its own control panel.
    (It does not really matter what kind of industrial machine process; I am showing
    you that it’s universally applicable.) There all are four major IoT systems. The
    first one is the industrial machine itself. The second is its `hello`. The third
    is the private cloud. The fourth are the IoT sensor devices that affect the industrial
    machine. `V continent` really is the heart of IoT system which provides the real
    benefit behind machine learning or deep learning model that is built using the
    private or public cloud. Industrial machines cannot communicate directly with
    IoT sensor devices, so they have a control panel that faces into the parts of
    the machine to monitor and create data. We generate machine-level internal data
    access through the control unit interfacing a device using the `MQTT` protocol.
    These common industrial communication protocols help us access the private data
    and send it all to the private cloud. If we were to monitor the effect of temperature
    on the industrial machine, we would have to install IoT sensor devices on the
    industrial machine. After installing the IoT sensor device, this device would
    send data to the private cloud and integrate it into a centralized database. Once
    we have enough data, we could apply machine learning or deep learning models to
    this data. It is now up to the business to check the results of machine learning
    or deep learning model and to apply efficiencies on the industrial machines. So
    with this example, you should now have a clear picture of how machine learning
    or deep learning is applied in an industrial environment. IIoT applications can
    include energy audits, machine efficiency checks, and improving factory efficiencies.
    The applications are limitless. Now let’s look at some successful IIoT applications
    that are working well in the market.


    ## Commercial Uses of IIoT


    Let’s look at some of the successful IoT applications that are working well in
    the market. There are not many players who focus on this market. Nevertheless,
    we look at a few who are dominating this space. An IIoT player known as Corlina
    ([`https://corlina.com/product/`](https://corlina.com/product/)) has a product
    for the market that offers edge device security to make the devices visible and
    to certify them as trustworthy. It provides the first line of defense against
    security attacks to IIoT devices. It has a Smart Factory solution which allows
    factory owners to monitor and control IIoT infrastructure from inside the factory
    or remote location allowing even thousands of devices operating on the shop floor.


    Next is the giant conglomerate General Electric. Predix ([`www.ge.com/digital/lp/predix-industrial-internet-platform-brief`](http://www.ge.com/digital/lp/predix-industrial-internet-platform-brief))
    is an IIoT platform in which real-time factory originated industrial data can
    be put into actionable insights and prediction models. It uses data from edge
    devices and helps the industrial owners to harness this digital industrial data
    into predictive models using digital twins and industrial AI.


    Schieder Electric offers Wonderware ([`https://sw.aveva.com/monitor-and-control/industrial-information-management/insight`](https://sw.aveva.com/monitor-and-control/industrial-information-management/insight)),
    an IIoT-based systems and solution for energy management and industrial automation.
    Industrial data is collected in a fast and secure manner to provide device integrations
    such as edge devices, HMI process visualization software, and monitor-and-control
    solutions for factories. It also has a solution named Edge to Enterprise where
    it uses data from edge devices, moves the data to the cloud from the factory settings,
    and uses machine learning and AI to derive meaningful business actions out of
    it.


    ## IoT and IIoT Differences


    Thus far, you have looked at IoT and IIoT in detail. You now understand the commercial
    developments that are happening in these areas. However, it is important to know
    the difference between them; this is a very common question that I get asked in
    conferences and seminars. Table [2-5](#484167_1_En_2_Chapter.xhtml#Tab5) highlights
    these differences.


    **Table 2-5** Differences Between IoT and IIoT Applications


    | Parameter | IoT | IIoT | Description |

    | --- | --- | --- | --- |

    | Focus | Consumer | Industrial | IoT caters to the consumer at large while IIoT
    focuses on industries and factory settings. |

    | Accuracy and precision | Low | High | Accuracy and precision for IIoT applications
    is higher than in IoT applications because industries need to have higher fault
    tolerant systems because they deal with giant machines. |

    | Risk impact | Low | High | IIoT systems work in spaces such as aerospace, healthcare,
    etc. where the room for error is very low so the risk impact is very high in comparison
    to consumer-based IoT applications. |


    The focus of IoT applications is the consumer at large and the focus of IIoT is
    industrial applications. This actually determines the ground for the next two
    parameters: accuracy/precision and risk impact. The accuracy and precision of
    industrial grade applications should be higher because they sometimes deal with
    hazardous processes and impact many lives on the factory shop floor. An error
    by an IIoT application could cause a company millions or even billions of dollars
    of losses and endanger the human lives involved in the production processes. This
    is the reason why IIoT devices use sensors that have higher accuracy levels than
    those used in personal IoT applications. The risk impact of an IIoT application
    failure is very high because many lives and a lot of business money and resources
    are at stake. IoT applications are also used in critical processes like healthcare
    where lives could be at danger; however, they are of personal nature. Nevertheless,
    every life is important and has value. With this, we come to the end of this chapter.
    Next you’ll see how machine learning is used with IoT and IIoT in Python with
    example code.


    ## Summary


    In this chapter, you learned what IoT and IIoT are all about. You now understand
    the differences in their implementation based on focus, accuracy, and risk impact.
    You looked at some commercial IoT applications such as C3 AI Appliance, MindSphere
    (the cloud-based IoT open operating system from Siemens), and Mbed OS (the leading
    open-source RTOS for the Internet of Things). Next, you looked at the transformation
    of AI for human needs from typewriting to dictation to Thought AI, which is in
    the future. You looked in depth into IIoT and how industrial communication protocols
    work together for industrial applications. You explored the commercial use of
    IIoT by companies such as Corlina, which certifies edge devices and the General
    Electric Predix platform for IIoT devices and solutions, to name a few. Lastly,
    you learned the differences between IoT and IIoT in order to understand how they
    are implemented in real-world environments.'
