    现在你已经准备好进行下一步：将 Arduino 模块连接到树莓派板。为此，你需要一根串行 USB 线，从树莓派 3 B+ 板的串行 USB 端口连接到 Arduino
    Mega 2560 板。为清晰起见，该线缆如图 5-28 所示。


    ![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig28_HTML.jpg](img/484167_1_En_5_Fig28_HTML.jpg)


    图 5-28


    用于连接 Arduino Mega 2560 与树莓派 3 B+ 的 USB 串行线


    现在，你终于可以启动整个系统了。Arduino 不需要单独的电源线，尽管其板上有一个电源插槽。串行线为 Arduino 板供电，因为它是树莓派 3 B+ 板的从设备。当你启动树莓派
    3 B+ 时，你应该会看到 Modbus 转换模块和 Arduino Mega 2560 板上的 LED 灯亮起。这初步表明你的连接成功。如图 5-29 所示。


    ![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig29_HTML.jpg](img/484167_1_En_5_Fig29_HTML.jpg)


    图 5-29


    最终上电


    如果板卡或模块没有亮起，你应该重新检查连接，特别是为模块或 Arduino 板供电的连接。现在，继续运行第 3 章的 Arduino Hello world
    程序，以确认 Arduino Mega 从设备与树莓派 3 B+ 主设备之间的串行通信。


    ## 总结


    本章介绍了如何为案例研究的实施准备你的设备。你现在已完全配置完毕：在树莓派 3 型号 B+ 上设置了 Raspbian 操作系统，并从 [`www.raspberrypi.org`](http://www.raspberrypi.org)
    的下载选项中下载了该系统。你使用了 microSD 卡和 microSD 卡适配器来获取操作系统。然后，你使用 Win32 磁盘管理器解包并提取了软件包。之后，你使用
    HDMI 转 HDMI 线缆将树莓派连接到电视显示器。你使用 USB 无线网卡将键盘和鼠标连接到单板计算机。接着，你将树莓派 3 B+ 的电源线连接到移动电源，以确保在断电情况下其电源连接不会中断。


    然后，你在 Raspbian 上安装并测试了 Python。接下来，你安装并验证了 Thonny Python IDE。接着，你运行了一个 Raspbian
    命令行脚本来安装所需的 Python 包。


    你运行了一个脚本来测试 Python 高级包的安装并检查错误。你为 Python 安装了 `tkinter` 包以实现 GUI，然后在 Python 3.x
    解释器上成功执行了 `tkinter`。之后，你运行了 `iotpypackages.run` Raspbian 脚本，在 Raspbian 上安装了 IoT
    Python 包。


    接着，你通过运行 `install.sh` 文件完成了 Arduino IDE 的安装。你安装了一个 SQLite3 数据库，用于存储来自物联网传感器的数据。之后，你将
    Modbus 接口设备（单相电表）安装到了 Arduino 上。你配置并连接了三个设备：施耐德电气 Conzerv EM6400 系列电力仪表、用于 Arduino
    过压保护的 5V RS485 转 TTL 信号双向转换模块（带信号指示灯），以及 5V Modbus 转换器模块。接着，你将 Modbus 转换器的线缆连接到
    Arduino Mega 板，并连接到 Arduino Mega 板的 PWM 和通信端。你通过 USB 串行线连接了 Modbus 转换模块的通信和 PWM
    引脚，以连接 Arduino Mega 2560 与树莓派 3 B+。最后，你为整个系统执行了最终上电。


    至此，你已完成系统（包括硬件和软件）的设置。现在可以继续进行案例研究了。


    # 6. 配置电能表


    延续第 5 章的内容，你在该章结束时连接了施耐德电气的三相 Conzerv EM6400 电能表。在本章中，你将完成两件事。首先，你将编写代码，从 Arduino
    Mega 从设备上的 EM6400 电能表获取数据，然后在树莓派主设备上将其读入 Python。其次，你将使用单相电气连接设置另一个电能表，然后通过 USB
    串行 Modbus 协议将其数据直接读入树莓派。第二个设置是为了让那些工业物联网爱好者能够体验工业设备（如电能表和机器）如何生成真实数据。然而，在现实世界中，你会看到像
    EM6400 这样的三相电能表和机器通过 Modbus 协议进行通信。再次，我想提醒读者，我们使用 Arduino Mega 2560 是因为它是一款真正的工业级单板计算机，支持连接多个设备，例如电能表或工业机器，这些设备可以以串行或菊花链电气配置方式相互连接。如果你只有一个设备，无论是单相、两相还是三相，你都可以像本章所示的那样直接将其连接到树莓派
    3B+。那么，让我们开始编写代码，从 Arduino 上的 EM6400 电能表获取数据。该代码可在名为 `modbus01_EM6400_Tested.ino`
    的代码包中找到，你可以从 [`www.PMAuthor.com/raspbian/`](http://www.pmauthor.com/raspbian/)
    下载。在执行代码之前，请记得像我在第 3 章中所示的那样，在 Arduino IDE 中打开它，并配置和测试 Arduino IDE。

