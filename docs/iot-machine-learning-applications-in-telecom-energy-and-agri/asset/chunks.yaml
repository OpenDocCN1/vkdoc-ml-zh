  trans: '

    # 2. 物联网与工业物联网概述


    你在第 1 章中了解了物联网的定义。在本章中，我想对此进行扩展。物联网概念得以实现的关键在于两大能力：使用小型传感器和电机，以及通过编程接口控制它们的输入和输出。物联网的核心是能够远程监控和控制设备。这可以通过与这些设备交互的小型可编程微控制器或微型计算机来实现。在应用物联网的过程中，嵌入式系统、控制系统、数字和模拟传感器等多种技术融合在了一起。其理念是将传感器嵌入日常物品中，并通过监控和控制使它们变得更加智能。然而，并非每个支持物联网的设备都能赢得消费者的青睐或满足业务需求。


    ## 深入探究物联网


    人们已经对日常物品进行过实验，例如智能椅子，它可以监控你坐在上面的时间，并监测你的血压等生命体征。在某些情况下，消费者认为购买这些产品并无益处。


    并非所有智能物品都能为消费者带来实质性好处，或者消费者可能认为其额外价格并不值得。在这种情况下，智能产品在推出时就会失败。尽管技术上确实有能力让物品变得更智能，但消费者的认知并未达到其预期。


    此外，还有智能家居的概念，洗碗机等物品通过中央监控系统进行控制。然而，由于其高昂的成本，这一概念并未普及。


    图 2-1 展示了物联网领域的技术进步。此图引自我的著作 *《使用 Python 的机器学习应用》*。


    ![../images/484167_1_En_2_Chapter/484167_1_En_2_Fig1_HTML.jpg](img/484167_1_En_2_Fig1_HTML.jpg)


    **图 2-1**


    机器学习技术采用过程


    物联网目前正处于快速应用和早期应用阶段。你知道，在追踪应用阶段，它正试图摆脱过去，例如切换所有家用电器的电源。在应用阶段，今天的益处是通过降低监控成本来实现的，例如安装物联网传感器和摄像头用于安防等。下一阶段的应用将进入辅助应用阶段。通过使用物联网，将致力于增强预测人类需求的能力，例如，利用计算机视觉摄像头监控智能橱柜内常见家居用品的数量，并预测何时需要补充，从而自动订购杂货。这类应用会进入第三阶段，即辅助应用阶段，或者第四阶段，即机器人操作增强人类能力的阶段。如今由人类仆人在家中执行的操作，例如清洗餐具和衣物，未来将由机器人完成。这类机器人将能够预测家庭中可能发生的任何未来问题，并为其提供解决方案。例如，一个自动补货机器人会检查任何物品是否即将用完，然后在线向附近提供折扣和送货上门服务的商店发送补货订单。它还可以等待订单确认。如果在指定时间内未收到确认，它会通过短信向其人类主人发送警报，甚至直接走到主人面前展示问题。它还可以建议替代方案，例如从一家不提供送货上门服务的远方商店订购产品。这样的机器人无疑会成为任何家庭的宝贵资产。这只是一个例子，说明机器人操作如何能够变得具有预测性，同时也能在潜在问题出现之前提出替代解决方案。表
    2-1 展示了当前场景下物联网的一些应用示例。


    **表 2-1**


    物联网的应用


    | 技术阶段 | 物联网应用 |

    | --- | --- |

    | 快速应用 | 家庭自动化 |

    | 早期应用 | 个人可穿戴设备 |

    | 智能城市 |

    | 辅助应用 | 农业自动化 |

    | 零售自动化 |

    | 智能汽车 |

    | 独立操作 | 医疗手术 |


    在上表中，你可以看到家庭自动化已进入应用阶段，因为人们目前正在自动化他们日复一日重复执行的平凡家务，例如通过 Android 和 iPhone 等个人手机来关闭电器、监控和控制它们。这些应用允许你控制智能手表等设备，这些设备可以精确收集个人生物信息，如步数、每分钟心跳数、血压率和携氧能力。这些应用可以生成每周、每月或每年的报告，并利用这些数据展示你的健康习惯。


    物联网领域的另一个发展是智能城市，它正处于早期应用阶段。其中最著名的是新加坡，它正试图在各个方面真正成为一个智能城市。智能建筑正在建设中，以便最大限度地利用阳光，并通过使用雨水收集、太阳能电池板等能源回收方法实现自给自足，为居民提供离网能源。一个智能城市会回收所有废物，并消耗和回收其所有资源，如水、石油、垃圾和天然气。


    农业自动化是物联网使得自动化操作成为可能的早期应用示例之一；然而，它必须发展到预测阶段，能够预测作物周期，例如作物歉收或丰收。IBM 旗下的天气公司（[`www.ibm.com/weather`](http://www.ibm.com/weather)）正试图通过预测作物天气来改变农业自动化的方式。当今的农业完全依赖于天气周期和季节。尽管从播种到收割的与农业相关的一切都已实现自动化，但预测农业天气的能力才能真正将其推向独立操作阶段。


    智能汽车是另一个此类应用。当你能够使用计算机视觉传感器和 GPS 定位器等物联网传感器在拥挤区域驾驶智能汽车时，该应用将处于独立操作阶段；同时，它还能预测和预防事故。


    医疗手术在一定程度上已经达到了独立操作水平，例如用于癌症的医疗手术，机器人可以通过增强外科医生的任务来独立进行手术。其他手术将随着时间的推移而成熟，因为世界正在对如何为机器人增加手术技能进行更多研究，使其变得更加高效。


    以上是物联网应用的一些示例，旨在为你提供背景，了解它们如何融入技术采用过程。

    '
- fmt: '# Commercial Uses of the IoT


    Let’s now look at some of the successful IoT applications that are working well
    in the market.


    A 2019 survey by teknowlogy ([`www.device-insight.com/wp-content/uploads/2019/03/the_iot_survey_2019_highlights_device_insight.pdf`](http://www.device-insight.com/wp-content/uploads/2019/03/the_iot_survey_2019_highlights_device_insight.pdf)),
    was carried out on IoT vendors based on parameters such as user review matrix,
    effectiveness, efficiency, business value, solution timeline, visualization, support
    of new concepts, innovation, pricing model, product satisfaction, partner ecosystem,
    performance satisfaction, flexibility, ease of use, and customer experience. The
    companies covered are mid-sized ones and this is where the major implementations
    of IoT are happening. I’ve picked the best parameter, which is customer experience,
    and I’ll discuss the solutions that these high-scoring companies have provided.
    The reason for choosing this parameter is because even though you may have the
    best products as per the rest of the parameters like innovation and visualization,
    if your customer is not satisfied, you can’t sustain that product in the long
    run. Table [2-2](#484167_1_En_2_Chapter.xhtml#Tab2) shows the three companies
    with great IoT solutions that are being used commercially today.


    **Table 2-2** Top Three solutions of 2019


    | Company | Top Solution | Applications |

    | --- | --- | --- |

    | C3 IoT | C3 AI Appliance | The C3 AI Appliance™ powered by Intel is for organizations
    that need to deploy artificial intelligence (AI) applications to analyze massive
    amounts of data without compromising stringent data governance, compliance, and
    security requirements. [`https://c3.ai/products/ai-appliance/`](https://c3.ai/products/ai-appliance/)
    |

    | Siemens IoT EMEA | MindSphere | MindSphere is the cloud-based IoT open operating
    system from Siemens. It connects your products, plants, systems, and machines,
    enabling you to harness the wealth of your data with advanced analytics. In addition,
    it gives you access to a growing number of apps and a dynamic development platform
    as a service (PaaS). MindSphere works with all popular web browsers. [`https://siemens.mindsphere.io/en`](https://siemens.mindsphere.io/en)
    |

    | ARM Mbed | Mbed OS 5 | Mbed OS is the leading open-source RTOS for the Internet
    of Things, speeding up the creation and deployment of IoT devices based on Arm
    processors. With the Mbed OS, you can develop IoT software in C++ with the free
    online IDE, generate optimized code with the Arm C/C++ Compiler, and run it on
    hundreds of hardware platforms. The Mbed OS stack includes TLS, networking, storage,
    and drivers, and is enhanced by thousands of code examples and libraries. [`https://os.mbed.com/`](https://os.mbed.com/)
    |


    The three solutions that I picked to showcase here work well commercially. The
    top solution according to the survey is C3 AI Appliance. Appliances that run on
    different servers are very hard to develop, and it’s harder to meet all customer
    expectations. Given that this is an AI platform-based appliance running on an
    Intel server which allows analyzing massive amounts of data and also meets the
    data governance, compliance, and security protocols, it’s amazing that the customer
    experience is very high. The customer testimonials on the website are very positive
    so it’s no wonder it gets a top slot in the survey.


    The next product picked from the survey is by Siemens ([`https://new.siemens.com/global/en/products/software/mindsphere.html`](https://new.siemens.com/global/en/products/software/mindsphere.html)).
    It’s a cloud-based IoT open operating system that connects products, plants, systems,
    and machines, and lets the customers harness it with advanced analytics. It is
    an excellent example of an implementation of a platform as a service (PaaS). It’s
    known as MindSphere. In order to make this another amazing product, given that
    it is a platform as a service, MindSphere truly works from all popular web browsers
    such as Chrome, Mozilla, and Firefox, to just name few.


    The third product is from all Mbed ([`https://os.mbed.com/`](https://os.mbed.com/)),
    which created an operating system open source RTOS for IoT, speeding up the creation
    and deployment of IoT devices based on Arm processors. The main development languages
    used by this OS are C and C++. It runs on hundreds of hardware platforms such
    as Raspberry Pi and also has a community that is very active. This platform has
    various drivers and code examples in libraries available for rapid implementation
    of all the three functions to compete with each other especially in the MindSphere
    IoT operating system from Siemens because they are the core for delivering total
    solutions. C3 AI Appliance takes the concept of an OS further by its ability to
    host on a private cloud; this solution is boon for those companies that want complete
    control of their IoT solutions. For companies that want open source solutions,
    the MindSphere solution by Siemens can work on hardware platforms and specifically
    uses C and C++ code for software solutions.


    You have seen three different companies and three different solutions, and the
    excellent part is they are delighting customers with their experiences.'
