  trans: '

    ### 整合所有环节


    现在，让我们在 Raspberry Pi 3 Model B+ 板上连接一个物联网传感器，并编写一个 Python 程序来获取其数据。在本章下一节中，你将学习如何将物联网传感器数据存储到数据库中。


    首先需要定义带有 Raspberry Pi 的物联网传感器电路图，以便你理解要构建的内容。图 3-17 展示了该项目的电气连接图。


    ![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig17_HTML.jpg](img/484167_1_En_3_Fig17_HTML.jpg)


    图 3-17


    连接到 Raspberry Pi 的物联网传感器电气连接图


    你将使用的物联网传感器是一个 LDR（光敏电阻模块）。你使用的并非单个 LDR 或光敏电阻，而是一个预制的 LDR 模块，其 PCB 上集成了功能完整的电路板，远端装有光电电阻，在图
    3-17 中标记为数字 6。该模块感知环境中的光线，并以 0/1 格式返回数据。它返回的值是浮点数，白天返回 0，黑暗时返回接近 1 的值（如 0.90 到
    0.99）。要模拟黑暗，你可以用物体遮住 LDR 的光敏电阻。你可以看到标记为 1 的点，即 VCC；你需要将导线从这里连接到 Raspberry Pi 板上的
    GPIO 引脚 1。标记为接地的点必须连接到 Raspberry Pi 板上的 GPIO 引脚 6。点 3 是 LDR 模块的 DO（数字输出信号线），必须连接到
    Raspberry Pi 板上的 GPIO 引脚 25。LDR 模块完全连接后，两侧会亮起两个红色 LED 信号，如图 3-18 所示。


    ![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig18_HTML.jpg](img/484167_1_En_3_Fig18_HTML.jpg)


    图 3-18


    完全连接的 LDR 模块


    现在让我们看看带有光电电阻的 LDR 模块。在远端，它被遮盖了；结果只有一个灯亮起，表明 LDR 模块周围是黑暗的（见图 3-19）。


    ![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig19_HTML.jpg](img/484167_1_En_3_Fig19_HTML.jpg)


    图 3-19


    完全连接并遮盖光电电阻的 LDR 模块


    图 3-19 中标记为 1 的点是用于数字输出的第二个 LED，它处于熄灭状态，表明没有从光电电阻接收到信号。图中标记为 2 的点是光电电阻，我用铅笔将其遮盖住了。任何不透光的物体都可以用来遮盖光电电阻。模拟白天和黑夜是为了测试目的；然而，在现实世界中，当你将此传感器应用于诸如检测白天或黑夜，并根据结果打开或关闭消费/工业电器等场景时，它会发挥奇妙的作用。这些数据与来自工业机器的数据相结合，还有助于诊断预测性维护应用中的关键问题，你将在案例研究中应用这些方法。在本章下一节中，你将把此
    LDR 物联网传感器数据存储到数据库中。


    请确保表 3-1 中列出的 GPIO 引脚已连接到 Raspberry Pi 板上对应的引脚。


    表 3-1


    Raspberry Pi GPIO 引脚与 LDR 模块的连接


    | Raspberry Pi | GPIO 引脚编号 | 光敏传感器模块 |

    | --- | --- | --- |

    | 3.3v 电源 | 1 | VCC (V) |

    | 接地 | 6 | GND (G) |

    | GPIO 信号引脚 | 25 | SIGNAL (S) |


    GPIO 引脚 1 必须连接到 LDR 模块上标记为 VCC 的引脚。同样，接地的 GPIO 引脚应通过导线连接到 LDR 模块上显示 GND 的中间引脚。你在程序中使用的第三个引脚是
    GPIO 信号引脚，它将与 LDR 模块发送和接收数字信号，即引脚 25 连接到 GPIO 信号引脚的第三个引脚。有些 LDR 模块有四个引脚；最后一个引脚用于模拟输入和输出，以备你需要使用。但在你的情况下，由于你使用的是三引脚
    LDR 模块，无需担心这一点。GPIO 和 LDR 模块上已连接的 LDR 引脚如图 3-20 所示。


    ![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig20_HTML.jpg](img/484167_1_En_3_Fig20_HTML.jpg)


    图 3-20


    Raspberry Pi GPIO 引脚与 LDR 模块的连接

    '
- fmt: '### Programming the IoT Sensor LDR Module


    The first sign that you have connected the pins correctly is that you will see
    two red LEDs glowing on the LDR module, signaling that the module is receiving
    power and input from the Raspberry Pi board. This is essential because unless
    you get these lights, you cannot implement the Python code shown in Listing [3-3](#484167_1_En_3_Chapter.xhtml#PC5),
    called `ldr.py`.


    ```

    #Turn on Light Sensor

    from gpiozero import LightSensor

    ldr = LightSensor(25)

    while True:

    print(ldr.value)

    ldval=float(ldr.value)

    #print(ldval)

    #print("done deal")

    if(ldval>0.0):

    print("It is Night time now")

    else:

    print("It is Day time")

    Listing 3-3

    Programming the LDR Module IoT Sensor

    ```


    The library `gpiozero` is not installed in the default version of Python on Raspberry
    Pi so you must do so by typing `pip install gpiozero` in the installed Python
    directory. This library has the requisite properties and functions to communicate
    with the GPIO pins and devices. In this program, you first import the `gpiozero`
    library `LightSensor` and then in second line you initialize it to GPIO pin number
    25 to get the signal from the LDR module. Refer to Table [3-1](#484167_1_En_3_Chapter.xhtml#Tab1)
    for the GPIO signal pin number to the one given in the second line of this program;
    they should match or you will not be able to communicate with the LDR module at
    all. Next, you use an infinite loop to print the LDR value, which is returned
    as 0 for day and 1 for night. However, the output is a floating point number closer
    to 1 between 0.9 and 1. If you want it to be more sensitive, you may need to adjust
    the blue potentiometer on top of the LDR module. This small program uses an `if`
    condition to check if the value of the LDR is greater than 0 and then it prints
    “It is Night time now;” otherwise, it prints “It is Day time.” After the loop
    comes to the end, you turn off the LDR module sensor so that it can be initialized
    again. In the real world, this is where your application code to control any device
    such as an LED light or any other appliance through the Raspberry Pi would sit.
    Listing [3-4](#484167_1_En_3_Chapter.xhtml#PC6) gives the output of the program
    run in Listing [3-2](#484167_1_En_3_Chapter.xhtml#PC4) using Python.


    ```

    pi@raspberrypi:~/ python ldr.py


    0.94490146637

    It is Night time now

    0.94490146637

    It is Night time now

    0.94490146637

    It is Night time now

    0.94490146637

    It is Night time now

    0.94490146637

    It is Night time now

    0.94490146637

    It is Night time now

    0.94490146637

    It is Night time now

    0.94490146637

    It is Night time now

    0.94490146637

    It is Night time now

    0.94490146637

    It is Night time now

    Listing 3-4

    Output of LDR Python Program

    ```


    The output is a trial run of the LDR Python program and it works by giving out
    the floating point values closer to 1, which means it is dark when this program
    is being run or there is darkness around the LDR sensor module (it may be covered
    by an object). If you were to light a torch or bulb over the photoelectric resistor
    of the LDR module, it would start giving a value of 0, indicating there is light
    around it. You can test this and improve the sensitivity by adjusting the blue
    square-shaped potentiometer on top of the LDR module PCB. You have come to the
    end of this section because you are able to achieve getting data from IoT sensors.


    Please remember there are many more sensors with many uses and which can be used
    for simple to complex consumer and industrial applications. The data from any
    of these sensors would be very similar. The digital output is always on the extreme
    ends of 0 and 1; however, analog output can be varied and give you in-between
    readings, which are not in the extremities of 0 and 1. Also, one point to remember
    is that the accuracy of these IoT sensors deteriorates over time when they are
    used heavily so you may need to replace sensors that come in contact with water
    or soil, leading to corrosion of their sensor heads.


    ## Storing IoT Sensor Data in a Database


    In this section, I am going to show you how to store data in the SQLite3 database.
    You will look at how to install this database in Chapter [5](#484167_1_En_5_Chapter.xhtml)
    in detail. However, as with previous examples in this chapter, I am making you
    sit back and have a look at what you can do with the IoT sensors by testing them
    and putting the system together one by one and accumulating data in a database.
    In the example in the previous section, you were able to get the LDR module IoT
    sensor data successfully; however, such data if collected in isolation has no
    meaning and needs other sets of data to become meaningful. As an example, just
    knowing whether it is day or night is not enough; if you couple it with temperature
    IoT sensor data, you can put together a correlation between them to see if light
    has any relationship to temperature. It would then have some meaning if there
    was any relationship found.


    You will also modify and add new code to the existing code from Listing [3-2](#484167_1_En_3_Chapter.xhtml#PC4)
    to store it in a SQLite3 database. You can store this data in any other RDBMS
    or in a flat file like a CSV or JSON format as well; however, here you will use
    SQLite3 which works well on raspbian.


    ### Configuring a SQLite3 Database


    In Figure [3-21](#484167_1_En_3_Chapter.xhtml#Fig21), you can see the SQLite3
    database named `iotsensor.db`. Since this is a vanilla database, the SQLite3 database
    engine automatically creates it for you. This new database will be empty and will
    not have any tables or other structures. You will need to create them.


    ![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig21_HTML.jpg](images/484167_1_En_3_Chapter/484167_1_En_3_Fig21_HTML.jpg)


    Figure 3-21


    Starting the SQLite3 database


    The code for starting the SQLite3 database is shown in Listing [3-5](#484167_1_En_3_Chapter.xhtml#PC7).


    ```

    pi@raspberrypi:~/iot $ SQLite3 iotsensor.db

    SQLite version 3.16.2 2017-01-06 16:32:41

    Enter ".help" for usage hints.

    sqlite>

    Listing 3-5

    Starting the SQLite3 Database

    ```


    Once you are logged into the database, it greets you with its version number and
    the date and timestamp when you have logged in. It displays a prompt `sqlite>`,
    which is where you run your commands to work with the databases. There are two
    sets of commands that work in this prompt: one is the set of commands that start
    with a dot, such as `.databases` or `.tables`, and the other is the set of SQL
    commands such as `select * from <tablename>;`. A common beginner mistake is to
    forget to put a dot before the databases or tables commands and then the SQLite
    prompt throws out an error. For the SQL commands, do not forget to use a semicolon
    (`;`) at the end of each statement; if you don’t, the `sqlite>` prompt will continue
    to the next line and your command will not execute.


    You can now look at the database and its information by typing the `.databases`
    and `.dbinfo` commands at the `sqlite>` prompt. The code for the commands and
    the output are shown in Listing [3-6](#484167_1_En_3_Chapter.xhtml#PC8) and Figure
    [3-22](#484167_1_En_3_Chapter.xhtml#Fig22), respectively.


