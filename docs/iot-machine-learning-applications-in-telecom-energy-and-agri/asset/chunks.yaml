- fmt: '# 3. Using Machine Learning with IoT and IIoT in Python


    The purpose of this chapter is not to get you going on the hardware and the software
    but to show you how the interconnection between the hardware and software happens
    in the IoT. You’ll get an introduction here to this concept and then later in
    Chapter [5](#484167_1_En_5_Chapter.xhtml) you’ll learn how to do the hardware
    and software setup when I show you how to install Raspberry Pi, Arduino, and other
    devices from scratch.


    This chapter is designed to show how the entire system is tested and made ready
    to implement a machine learning model. I will show you step by step how to use
    the hardware and software to get data from IoT sensors and store that data in
    flat files. After this, you will do machine learning processes, especially my
    seven-step machine learning lifecycle process from my book *Machine Learning Applications
    using Python*, in Chapter [1](#484167_1_En_1_Chapter.xhtml). Figure [3-1](#484167_1_En_3_Chapter.xhtml#Fig1)
    shows a block system diagram of how the communication between hardware and software
    components is going to happen in this chapter.


    ## Testing the Raspberry Pi Using Python


    The first step to creating a solution using any hardware is to test the hardware-software
    interconnect and see if it is working fine. Figure [3-1](#484167_1_En_3_Chapter.xhtml#Fig1)
    shows the system diagram I built in order to test the hardware and software along
    with the IoT sensor data by applying machine learning on it.


    ![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig1_HTML.jpg](images/484167_1_En_3_Chapter/484167_1_En_3_Fig1_HTML.jpg)


    Figure 3-1


    Block system diagram


    You can clearly see the two blocks in the system diagram named Hardware and Software.
    It is important to distinguish between them so you get a clear understanding of
    the way the IoT- and IIoT-based solutions work. The software layer communicates
    with the respective hardware component with its own programming integrated development
    environment (IDE). The Python IDE here is the Thonny IDE on Raspbian; it’s the
    software component that communicates with the Raspberry Pi 3 Model B+, and the
    Arduino IDE software component communicates with the Arduino Mega 2560 microcontroller.
    In the hardware section, this is the most important one to understand. The Raspberry
    Pi 3 Model B+ is the SBC that acts as a master and hosts the software for Python
    and Arduino. The software components fully run on the Raspbian. The Raspberry
    Pi hardware component has GPIO pins inside its board through which it communicates
    with IoT sensors (remember from Chapter [2](#484167_1_En_2_Chapter.xhtml) that
    most IoT sensors are common to Raspberry Pi and Arduino). Raspberry Pi also communicates
    with the Arduino Mega 2560 via its USB serial port cable and fetches data from
    it. Please remember that you can add many more devices to the Arduino, especially
    ones that need Modbus communication to the microcontroller board, than the Raspberry
    Pi because it has more pins available on its board. The Arduino Mega 2560 communicates
    with the Modbus devices such as energy meters, etc. Then it gets the data to Raspberry
    Pi 3 Model B+ back through its USB serial port. In order to create a robust system,
    you will need to test the communication from the Raspberry Pi Python code and
    then to its connected IoT sensors or LEDs. After this, you will test the Arduino
    communication between the Raspberry Pi and Arduino. Once you get the IoT sensor
    data, you will store it in a lightweight database, SQLite3. In the real world,
    you could store this in any other database such as Oracle, db2, PostgreSQL, etc.
    Once you have the data, you need to then apply the machine learning process on
    top of it to get any meaningful insights into the workings of IoT or any of the
    connected Modbus devices. In this chapter, however, you will not be using a Modbus
    device with Arduino but a simple IoT sensor attached to the Arduino microcontroller
    to test if the serial communication is happening between the master and slave.
    Let’s go ahead and start testing the system.


    ### Testing the System


    Before you start your system, you need to ensure that every device in your solution
    is working properly. Raspberry Pi is your master system and you need to boot it
    up first to see if it works properly. In order to do so, you need to plug the
    power cord into the power cord of the Raspberry Pi board. Once done, you need
    to connect the LED screen using the HDMI port. All this is done after you have
    installed the Raspbian OS on the SD card of the Raspberry Pi 3 Model B+. Figure
    [3-2](#484167_1_En_3_Chapter.xhtml#Fig2) shows the Raspberry Pi booting up.


    ![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig2_HTML.jpg](images/484167_1_En_3_Chapter/484167_1_En_3_Fig2_HTML.jpg)


    Figure 3-2


    Raspberry Pi bootup


    After it has finished booting up, the Raspberry Pi desktop will show up and will
    look similar to what you see in Figure [3-3](#484167_1_En_3_Chapter.xhtml#Fig3).


    ![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig3_HTML.jpg](images/484167_1_En_3_Chapter/484167_1_En_3_Fig3_HTML.jpg)


    Figure 3-3


    Raspberry Pi 3 Model B+ desktop after booting up


    Go to the Start button at the top of your Raspberry Pi desktop, click Programming,
    and then click the Thonny Python IDE. This is the IDE that you will be using for
    your programming. Please remember that this is not a very professional IDE but
    a small one to help you get started on IoT projects. It does not have advanced
    features that an IDE like PyCharm has, but it is good enough to write code and
    get it executed on Python IDLE.


    Once the Thonny IDE shows up, you’ll type a simple “Hello world” program to check
    if Python''s pandas library is installed correctly and working (Listing [3-1](#484167_1_En_3_Chapter.xhtml#PC1)).
    The code for the simple program to test if the pandas library is installed and
    Python is working properly, `hello_world.py`, is shown in Figure [3-3](#484167_1_En_3_Chapter.xhtml#Fig3).
    You’re importing standard libraries into the program: pandas for managing dataframes,
    matplotlib for visualizations such as graphs and charts, numpy for mathematical
    computations, and Seaborn for data visualizations such as heatmaps.


    ```

    import pandas as pd

    import matplotlib as plt

    import numpy as np

    import seaborn as sb

    print("Hello World from Raspberry Pi")

    Listing 3-1

    hello_world.py

    ```


    Run the Python code in the Thonny IDE by pressing the Run button in the toolbar
    and you should have the output that appears in Figure [3-4](#484167_1_En_3_Chapter.xhtml#Fig4).


    ![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig4_HTML.jpg](images/484167_1_En_3_Chapter/484167_1_En_3_Fig4_HTML.jpg)


    Figure 3-4


    “Hello world” Python code on Raspberry Pi 3 Model B+


    Successful output means that most of the common libraries like pandas, matplotlib,
    numpy, and Seaborn are installed and that Python IDLE is configured to give you
    output. If you encounter any error in this simple Python program on the Raspberry
    Pi, it could be due to a typo or a library not being installed on your Raspbian-based
    Python. In this case, you could try installing it using the `pip install <library_name>`
    command. Replace `<library_name>` with the name of library that is giving you
    the error, such as pandas, Seaborn, matplotlib, etc.


    You could run another simple test on pandas by creating a test dataframe such
    as one given in the following code, which imports the pandas dataframe and then
    creates an instance of the `DataFrame()` object and then prints out “Pandas loaded”.
    The result appears in the Thonny IDE in Figure [3-5](#484167_1_En_3_Chapter.xhtml#Fig5).


    ![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig5_HTML.jpg](images/484167_1_En_3_Chapter/484167_1_En_3_Fig5_HTML.jpg)


    Figure 3-5


    Result of code execution for testing the loading of the pandas dataset


    ```

    import pandas as pd

    df=pd.DataFrame()

    print("Pandas loaded")

    ```'
