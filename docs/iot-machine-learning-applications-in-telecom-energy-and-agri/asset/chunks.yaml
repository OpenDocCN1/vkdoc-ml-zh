    ## 将物联网传感器数据存储在数据库中


    在本节中，我将向你展示如何将数据存储在 SQLite3 数据库中。你将在第 5 章中详细了解如何安装此数据库。然而，与本章前面的示例一样，我将让你坐下来，看看你可以通过测试物联网传感器、逐一组装系统并将数据累积到数据库中来做些什么。在上一节的示例中，你已成功获取了
    LDR 模块物联网传感器的数据；然而，如果孤立地收集，这些数据是没有意义的，需要与其他数据集结合才能变得有意义。例如，仅仅知道是白天还是夜晚是不够的；如果你将其与温度物联网传感器数据结合起来，就可以找出它们之间的相关性，看看光照是否与温度有关。如果发现了任何关系，那么它就有了一定的意义。


    你还将修改清单 3-2 中的现有代码并添加新代码，以便将其存储在 SQLite3 数据库中。你也可以将这些数据存储在任何其他关系型数据库管理系统（RDBMS）中，或者存储在像
    CSV 或 JSON 格式这样的平面文件中；但是，这里你将使用在 Raspbian 上运行良好的 SQLite3。


    ### 配置 SQLite3 数据库


    在图 3-21 中，你可以看到一个名为 `iotsensor.db` 的 SQLite3 数据库。由于这是一个空白数据库，SQLite3 数据库引擎会自动为你创建它。这个新数据库将是空的，没有任何表或其他结构。你需要创建它们。


    ![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig21_HTML.jpg](img/484167_1_En_3_Fig21_HTML.jpg)


    图 3-21


    启动 SQLite3 数据库


    启动 SQLite3 数据库的代码如清单 3-5 所示。


    ```

