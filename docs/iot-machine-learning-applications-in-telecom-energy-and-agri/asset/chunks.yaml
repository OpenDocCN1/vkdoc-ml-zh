- fmt: '# Setup and Solution for the Case Study


    The setup tools are both hardware and software. The hardware elements are the
    following:


    1. An Android app to capture call data with a live Regoniatel SIM embedded on
    it

    2. An industrial grade drone that could handle a mobile phone of 500 grams or
    1 pound weight.

    3. `Raspberry Pi Model 3 B+` with a Wi-Fi module to receive data from the mounted
    mobile phone on the drone


    The software elements:


    1. An Android app that measures and captures call signal quality data and stores
    it in a CSV file format built by the team

    2. A Python machine learning program with a prediction model from the imported
    data from the Android app device


    Figure [7-1](#484167_1_En_7_Chapter.xhtml#Fig1) shows how these elements come
    together to form the pilot solution.


    ![../images/484167_1_En_7_Chapter/484167_1_En_7_Fig1_HTML.jpg](images/484167_1_En_7_Chapter/484167_1_En_7_Fig1_HTML.jpg)


    **Figure 7-1** Case study solution setup of hardware and software


    The key to this setup is the drone that carries the mobile phone around a particular
    area. The drone is manually piloted by a person on the ground and flown at human
    height level around the mobile towers where the calls are being piloted. The mounted
    mobile phone on the drone makes a call automatically every few minutes to another
    mobile phone in the same network. The purpose is to automatically capture the
    call quality data and store it into a data file in the CSV format. When the mobile
    phone has made a sufficient number of calls, it is brought down by the human operator
    and then taken to another location with a different mobile tower. This way the
    data is captured and then collated into a `SQLite3` database. Once there is sufficient
    data from all the pilot mobile towers, the Python machine learning program is
    run to look at the results of the model. The mobile dataset is shown in Figure
    [7-2](#484167_1_En_7_Chapter.xhtml#Fig2) and the Python is shown in Listing [7-1](#484167_1_En_7_Chapter.xhtml#PC1).


    ![../images/484167_1_En_7_Chapter/484167_1_En_7_Fig2_HTML.png](images/484167_1_En_7_Chapter/484167_1_En_7_Fig2_HTML.png)


    **Figure 7-2** Mobile call quality dataset


    Please remember this is just a basic call quality dataset; in the real world,
    you would have a lot more parameters to be measured to determine call quality
    like the call duration, voice quality parameters, feedback over the phone, etc.
    The purpose of this dataset is to show you how to do an analysis from basic telecom
    data.


    After importing this dataset into a `SQLite3` database, we can use the program
    given in Listing [7-1](#484167_1_En_7_Chapter.xhtml#PC1).


    ```

    # -*- coding: utf-8 -*-

    """

    Author: Puneet Mathur

    Copyright 2020

    Free to copy this code with following attribution text: Author Puneet Mathur,
    www.PMAuthor.com

    """

    import pandas as pd

    import sqlite3

    conn = sqlite3.connect(''C:\\ machinemon.db'')

    #df.to_sql(name=''tempdata'', con=conn)

    curr=conn.cursor()

    #query="INSERT INTO TEMPERATURE VALUES(" +"''" + str(datetime.date(datetime.now()))
    + "''" +"," + "''" + str(datetime.time(datetime.now())) + "''"+ "," + "''" + str(tem)
    +  "''" + "," + "''" + tempstatus +"''" + ")"

    df = pd.read_sql_query("select * from fielddata;", conn)

    print(df)

    #curr.execute(query)

    #conn.commit()

    #Looking at data

    print(df.columns)

    print(df.shape)

    #Looking at datatypes

    print(df.dtypes)

    df.tail(1)

    #Checking for missing values

    print(df.isnull().any())

    #EDA- Exploratory Data Analysis

    import numpy as np

    print("----------EDA STATISTICS---------------")

    pd.option_context(''display.max_columns'', 40)

    with pd.option_context(''display.max_columns'', 40):

    print(df.describe(include=[np.number]))

    #Correlation results

    print("----------Correlation---------------")

    with pd.option_context(''display.max_columns'', 40):

    print(df.corr())

    #Dividing data into features and target

    target=df[''Calldrop'']

    nm=[''CID1'',''CID2'',''Speed'',''OutsideTemperature'',''OutsideHumidity'',''SignalStrength'',''BatteryLevel'']

    features=df[nm]

    with pd.option_context(''display.max_columns'', 40):

    features.head(1)

    target.head(1)

    #Building the Model

    from sklearn.model_selection import train_test_split

    x_train, x_test, y_train, y_test = train_test_split( features, target, test_size=0.25,
    random_state=0)

    from sklearn.linear_model import LogisticRegression

    lr  = LogisticRegression()

    lr.fit(x_train, y_train)

    # Returns a NumPy Array

    # Predict for One Observation (image)

    lr.predict(x_test)

    predictions = lr.predict(x_test)

    # Use score method to get accuracy of model

    score = lr.score(x_test, y_test)

    print(score)

    import matplotlib.pyplot as plt

    import seaborn as sns

    from sklearn import metrics

    import numpy as np

    cm = metrics.confusion_matrix(y_test, predictions)

    print(cm)

    plt.figure(figsize=(9,9))

    sns.heatmap(cm, annot=True, fmt=".3f", linewidths=.5, square = True, cmap = ''Blues_r'');

    plt.ylabel(''Actual Calldrops'');

    plt.xlabel(''Predicted Calldrops'');

    all_sample_title = ''Accuracy Score: {0}''.format(score)

    plt.title(all_sample_title, size = 15);

    plt.figure(figsize=(7,7))

    plt.imshow(cm, interpolation="nearest", cmap="Pastel1")

    plt.title(''Confusion matrix'', size = 15)

    plt.colorbar()

    tick_marks = np.arange(1)

    plt.xticks(tick_marks, ["0", "1"], rotation=45, size = 15)

    plt.yticks(tick_marks, ["0", "1"], size = 15)

    plt.tight_layout()

    plt.ylabel(''Actual Calldrops'', size = 15)

    plt.xlabel(''Predicted Calldrops'', size = 15)

    width, height = cm.shape

    for x in range(width):

    for y in range(height):

    plt.annotate(str(cm[x][y]), xy=(y, x),

    horizontalalignment=''center'',

    verticalalignment=''center'')

    plt.show()

    ```


    **Listing 7-1** Code for the Solution to the Case Study


    Please remember that the code to get data from `LightSensor` and other IoT sensors
    is given in Figure [3-25](https://doi.org/10.1007/978-1-4842-5549-0_3Fig#25) in
    Chapter [3](#484167_1_En_3_Chapter.xhtml). The process of getting data from the
    sensors remains the same regardless of the solution we are trying to implement.
    The only difference is that the `Raspberry Pi` in this case sits inside a drone
    while collecting data. It is the machine monitoring agent similar to Chapter [3](#484167_1_En_3_Chapter.xhtml)’s
    Figure 3-33 program to store LDR module IoT sensor data in a `SQLite3` database
    and the Figure 3-35 code for simulating an IoT-based solution which together give
    us the ability to get data from IoT sensors and then store it and process it for
    advanced warning signals if required. In this case, we do not need any advanced
    warning signals.'
