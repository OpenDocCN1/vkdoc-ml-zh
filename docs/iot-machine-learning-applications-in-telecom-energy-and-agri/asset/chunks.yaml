    IT 系统，勒索技术人员交出所有智能设备，移动设备管理解决方案不得不放弃这些设备以保护它们免受搜索攻击。一个有趣的案例被重点提及：用于保障食品安全的物联网技术平板电脑调查数据。例如，一家冷食存储运营商利用混合云来保障食品安全，物联网正在帮助企业监控冷藏设施的温湿度。


    本文强调的另一个问题是利用物联网简化制造业的维护工作。文章讨论了使用传感器来预判制造过程中的问题，现场技术人员只需在触摸屏上点击传感器，就能检测机器在近期可能出现的故障。正如本文所强调的，工厂工人将佩戴基于物联网的可穿戴设备，以便控制中心对其进行管理、监控和控制。


    TechGenix 一篇关于 2019 年趋势与预测的文章，探讨了新型物联网平台的两个有趣方面（[`http://techgenix.com/iot-trends-2019/`](http://techgenix.com/iot-trends-2019/)）。文章指出，物联网平台供应商并未专注于用例和完整性。超大规模云将被标记为物联网目的地；从今年起，超大规模云与物联网平台将开始融合。另一个趋势是物联网托管服务市场的发展。物联网服务的出现将包括物联网网络及其他物联网资产的管理和运营。文章预测，这些服务将为智能家居的智能产品进行定制，以支持
    IT 解决方案。


    最后一项调查是福布斯（[`www.forbes.com/sites/bernardmarr/2019/02/04/5-internet-of-things-trends-everyone-should-know-about/#752315be4b1f`](http://www.forbes.com/sites/bernardmarr/2019/02/04/5-internet-of-things-trends-everyone-should-know-about/%2523752315be4b1f)）在
    2019 年 2 月由伯纳德·马尔撰写的文章。除其他事项外，文章预测设备将变得更加“健谈”。例如，Alexa、Siri 和 Google 语音指令将迎来它们的崛起。


    我们已经审视了物联网领域众多预测中的共同点，并找出其中的共性。这些物联网预测与趋势的总结如表 2-3 所示。


    表 2-3


    2019 年起物联网的常见预测与趋势


    | 物联网趋势领域 | 描述 |

    | --- | --- |

    | 智能家居 | 家电、清洁服务等方面的家庭自动化。 |

    | 边缘计算 | 在偏远操作区域工作的去中心化分布式边缘设备。 |

    | 端点安全 | 针对物联网设备勒索软件的安全系统。 |

    | 5G 服务引入 | 5G 将使物联网设备能够以更高带宽、更快速度向集中式云传输数据。 |

    | 人工智能 | 机器学习和深度学习能力以及机器人技术。 |

    | 物联网云服务 | 所有云服务现在都将提供基于物联网的解决方案。 |

    | 物联网传感器创新 | 许多传感器，如思维传感器和语音传感器，将得到创新。 |


    在审视了业内顶尖机构对物联网未来共同趋势和预测之后，我现在向您介绍一个从 2020 年开始必将崛起的趋势。思维人工智能尚未实现商业应用，包括思维传感器的发明。我将在本章的下一节讨论所有这些内容。


    ## 深入探讨思维人工智能


    您已经看到了物联网领域最优秀的商业应用。您也看到了上述文章预测的未来趋势。然而，作为一名技术远见者，我认为这些趋势中没有任何一项能像某个特定应用那样具有颠覆性。是的，我谈论的这项技术不仅将彻底改变，还将重塑人类与机器互动的方式。它将创造一个更直观、更轻松、更能响应人类需求的世界。它将带来如同个人电脑或手机发明一样的革命性变革。它将见证技术提升到一个前所未有的水平。它将使技术无限接近智人。这将是机器成为朋友和“流氓”的时代。当然，这类技术同样具有反人类的潜力。我再次引用我的第一本书《使用
    Python 的机器学习应用》中的话：“改变我们未来生活方式的不是人工智能，而是人工智能背后的人类智能。”请记住，本节内容具有未来主义色彩，思维人工智能是近未来的基础，因为它尚未实现。它可能在将来发生。此外，您需要知道，实施思维人工智能的成本将会很高，因为它仍处于研发阶段。


    作为一名远见者，我向您展示未来的技术。这就是我所说的思维人工智能。如果您审视人类向任何机器输入信息的方式，其实只有两种。第一种是通过键盘打字，第二种是通过扬声器进行语音听写。表
    2-4 列出了在我们的计算机上模拟类机器人的打字输入和语音输入之间的区别。


    图 2-2 展示了人脑为了产生打字作品所需经历的过程。您需要将两者结合起来阅读，以理解思维人工智能的优势。


    ![../images/484167_1_En_2_Chapter/484167_1_En_2_Fig2_HTML.jpg](img/484167_1_En_2_Fig2_HTML.jpg)


    图 2-2


    人脑的打字过程


    表 2-4


    使用思维人工智能的优势

