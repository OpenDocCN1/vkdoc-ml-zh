    issues, it says that as online gains acceptance, social, legal, and ethical issues
    will crop up.


    A survey by Network World covers the top 10 IoT trends for 2019 and beyond ([`www.networkworld.com/article/3322517/a-critical-look-at-gartners-top-10-iot-trends.html`](http://www.networkworld.com/article/3322517/a-critical-look-at-gartners-top-10-iot-trends.html)).
    The first trend is artificial intelligence, which is not a big surprise. The second
