- fmt: '## Summary


    In this chapter, you looked at Raspberry Pi using Python and the overall block
    diagram of this IoT monitoring application. You tested your system by writing
    a Python Raspberry Pi Hello world program. Then you tested to see if all the Python
    libraries like `scikit-learn` and `pandas` were loading perfectly or not. Then
    you tested your Arduino setup using Python to see if it was communicating properly
    after setting up its hardware. You ran your first sketch by flashing the Arduino''s
    memory with it. Next, you saw how to get IoT sensor data from Raspberry Pi''s
    sample code by first configuring its GPIO pins and then the hardware setup using
    the breadboard circuit. You then learned to program the IoT sensor light density
    resistor module through a Python program to detect day and night. The next important
    part of the program was to store IoT data in a database like `SQLite3` by configuring
    it and creating a database structure. You then ran a Python program to get the
    data from the LDR module and store it in the `SQLite3` database. Then you created
    a practical Python-based IoT application with advanced warning capabilities based
    on data from temperature and light statuses, allowing you to create a monitoring
    agent for it. Then you applied machine learning on top of this collected data
    from the temperature and LDR module by using a logistic regression algorithm to
    classify temperature status based on readings from the IoT sensor. You created
    a visualization of the classification model by building a confusion matrix using
    the `Seaborn` Python library and determining the accuracy of your prediction model.


    With the visualization of the accuracy score and confusion matrix, I conclude
    this section and the chapter. You now have a substantial understanding of how
    the IoT sensor data can be used to apply machine learning on it to get any business
    results. In Chapter [5](#484167_1_En_5_Chapter.xhtml), you will look at the setup
    and installation required in order to execute IoT and IioT applications using
    Python.


    # 4. Using Machine Learning and the IoT in Telecom, Energy, and Agriculture


    In Chapter [2](#484167_1_En_2_Chapter.xhtml), you looked at the IoT and IIoT and
    their uses. You also saw via a practical example how an IoT system is designed
    using Raspberry Pi, Arduino, and Python with machine learning. By seeing a practical
    example, you now have an understanding of the implementation aspects of any IoT
    or IIoT applications such as creating monitoring systems for giving advanced warning
    signals to users by gathering data from IoT sensors and then measuring it against
    a benchmark number such as a temperature threshold and alerting the users through
    email or GUI alerts.


    In this chapter, you are going to see the state-of-the-art implementation of machine
    learning and IoT in the telecom, energy, and agriculture domains. I will be walking
    you through some rapid implementations of machine learning and the IoT in each
    of these sectors, helping you understand the nuances and the complexity involved
    in building applications for them.


    ## State-of-the-Art Implementation of Machine Learning and the IoT in the Telecom
    Domain


    The telecom domain is going through a rapid technological wave right now all over
    the world. The heart of this change is the 5G spectrum introduction. In my blog
    post on two reasons why 5G IoT is safe (`https://pmauthor.com/2019/07/02/3-reasons-why-5g-iot-is-safe/`),
    I talk about what the spectrum of each telecom technology was able to achieve.
    Mobile technology has seen four generations of technological development with
    1G, 2G, 3G, and 4G. Each generation is a set of telephone network standards for
    communication across mobile devices such as mobile phones and tablets. The 1G
    gave 2.4 kbps of connectivity, 2G gave 64 Kbps of connectivity and was based on
    GSM, 3G gave 144 kbps to 2 Mbps of connectivity, and 4G gave 100 Mbps to 1 Gbps
    of connectivity and is based on LTE technology. The 1G systems started in Australia
    and were analog in nature. Truly digital telecommunication started with the introduction
    of the 2G standard, which brought with it the CDMS and GSM protocols with SMS
    and MMS services, among others. 3G led to the introduction of smartphone technology
    such as web browsing, video streaming, and more. 4G has revolutionized the cost
    and usage of data as we knew it; with 3G, it was very costly. 4G gave high speed,
    high quality, and high capacity at affordable rates to users.


    In my blog post at `https://pmauthor.com/2019/07/02/3-reasons-why-5g-iot-is-safe/`,
    I also pointed out the key benefits of 5G. The biggest benefit that 5G will give
    mankind, apart from high data connectivity speeds of up to 35.46 Gbps, is the
    promise of connecting up to 100 billion devices through its network. The communication
    protocol that is going to enable this is known as `mmWave`, or millimeter wave
    mobile communication. This is the biggest breakthrough for the 5G telecommunication
    standard. We’ll look in detail at how this works technically.


    Now let’s look at the state-of-the-art implementation of machine learning and
    the IoT in the telecom domain.


    **HUAWEI**: Yes, this is one company in the AI sector to watch out for in spite
    of the controversy of spying and data breaches that it has been embroiled in.
    This company was the first one to launch the full mobile 5G chipset. In my blog
    post on three top machine learning skills for 2019 (`https://pmauthor.com/2019/07/05/3-top-machine-learning-skills-for-2019/`)
    and another post covering two reasons why 5G IoT is safe (`https://pmauthor.com/2019/07/02/3-reasons-why-5g-iot-is-safe/`),
    I say that 5G IoT is going to be the next game changer in the world of AI. Huawei
    has launched a full capability 5G chipset. It has also launched the world’s first
    data center switch with an AI brain. Huawei has also launched full-stack, all-scenario
    AI technologies to enable an autonomous driving network and developed the `SoftCOM
    AI` solution to help mobile operators maximize energy efficiency, network performance,
    O&M efficiency, and user experiences. Huawei''s solution focuses on building a
    digital village, as mentioned in the article at `www.busiweek.com/huawei-presents-its-simplified-5g-and-softcom-ai-solutions/`.
    IoT will also enable its applications to do 8K high-definition (HD) live streaming
    of audio and video between devices. Real-time virtual healthcare doctors will
    be able to stream both ways with a patient in critical condition from home, and
    employees can live stream a business meetings with much clarity and low feedback
    along with transfer of high speed data. With the launch of 5G services in every
    country, it’s now possible to provide IoT cloud services, personal mobile services,
    five-star premium home broadband, and cloud-network convergence. Although Huawei
    does not describe much about its `OceanConnect IoT` platform on its website (`www.huawei.com/minisite/iot/en/overview.html`),
    it is not difficult to see the key areas of IoT that it sees developing in society.
    See Figure 1 on the aforementioned webpage for Huawei''s IoT solution.


    5G and the IoT are destined to take off together since the technology that the
    5G telecom spectrum provides not only compliments the capabilities of IoT but
    also enhances them by providing very fast and efficient data transfers, which
    are the backbone of IoT devices and applications in every country where it is
    implemented.'
