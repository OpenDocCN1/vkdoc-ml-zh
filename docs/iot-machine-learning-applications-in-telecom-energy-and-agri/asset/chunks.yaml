    After having looked at the common future trends and predictions in IoT from the
    best in the industry, I now present to you a trend that is definitely going to
    see its emergence starting in 2020\. The Thought AI has yet to see its commercial
    implementation, including inventions of thought sensors. I will discuss all of
    this in the next section of this chapter.


    ## A Closer Look at Thought AI


    You have seen the best IoT commercial applications in the field of IoT. You have
    also seen the trends for the future as predicted by the aforementioned articles.
    However, as a technical visionary, I do not think that any of these trends are
    going to be as game-changing as a certain application. Yes, I am talking about
    something that is going to not only revolutionize but also change the way humans
    and machines interact with each other. It is going to create a world that is going
    to be more intuitive, easy going, and responsive to human needs. It will bring
    about a change as revolutionary as the invention of the PC or the mobile phone.
    It will see technology move up to a level that has not been seen before. It will
    make technology rise extremely close to the Homo sapiens as could ever be. It
    will be the age of machines as friends and rogues. Of course, such technology
    has the equal potential of being anti-human as well. I re-quote from my first
    book, *Machine Learning Applications Using Python*, “It is not the artificial
    intelligence but the human intelligence behind the artificial intelligence that
    is going to change the way we live our lives in the future”. Please remember that
    this section is futuristic and that Thought AI is a basis for the near-future
    as it is yet realized. It can happen in the future. Also, you need to know that
    implementing Thought AI will be costly as it is in the research and development
    stage.


    As a visionary, I present to you the technology for tomorrow. This is what I call
    Thought AI. If you look at the input methods that exist in any machine from a
    human being, there are just two. The first one is typewriting via a keyboard and
    the second one is voice dictation via a speaker. Table [2-4](#484167_1_En_2_Chapter.xhtml#Tab4)
    lists the differences between the type and voice inputs to emulate machine-like
    robots on our computer.


    Figure [2-2](#484167_1_En_2_Chapter.xhtml#Fig2) shows the process that the human
    brain has to undergo to produce a typewritten work. You need to read them together
    to understand the advantages of Thought AI.


    ![../images/484167_1_En_2_Chapter/484167_1_En_2_Fig2_HTML.jpg](images/484167_1_En_2_Chapter/484167_1_En_2_Fig2_HTML.jpg)


    Figure 2-2


