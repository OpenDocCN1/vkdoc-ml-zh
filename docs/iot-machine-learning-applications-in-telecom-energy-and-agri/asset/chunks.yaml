    ## 使用Python测试Arduino


    Arduino是一种微控制器。如第[2](#484167_1_En_2_Chapter.xhtml)章所述，它用于通过Modbus协议与工业设备通信。让我们开始使用Arduino。


    Arduino程序是在Arduino IDE中编写的。Arduino IDE是在树莓派系统上运行的特殊软件。您将把它用作主设备，而Arduino将作为从设备，与您的IIoT设备（如电能表）进行通信。它允许您为不同的Arduino板编写草图（在Arduino语言中，*程序*的同义词）。Arduino编程语言基于一种非常简单的硬件编程语言Processing，其语法类似于C语言。在Arduino
    IDE中编写草图后，需要将其烧录到Arduino芯片板上执行。这个过程称为上传到Arduino微控制器。在此测试中，您将使用Arduino IDE在树莓派3
    Model B+上进行测试。请记住，Arduino不是一个功能完整的计算机；它没有像树莓派那样的操作系统，这就是为什么它需要一个像树莓派这样的主设备来监控、控制和使用它。从设备Arduino在其主设备和连接的IIoT或IoT设备之间进行双向通信。虽然这最初看起来很复杂，但一旦您开始测试并将每个硬件和软件组件组合起来使系统工作，它就会变得容易。


    ### Arduino硬件设置与通信


    首先，使用Arduino Mega 2560附带的USB串行电缆将其连接到树莓派3 Model B+，如图[3-7](#484167_1_En_3_Chapter.xhtml#Fig7)所示。使用树莓派的USB端口进行连接，另一端连接到Arduino板的串行端口。


    ![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig7_HTML.png](images/484167_1_En_3_Chapter/484167_1_En_3_Fig7_HTML.png)


    **图 3-7** 连接的树莓派3 B+和Arduino Mega 2560


    下一步，打开Arduino IDE，如图[3-8](#484167_1_En_3_Chapter.xhtml#Fig8)所示，并编写清单[3-2](#484167_1_En_3_Chapter.xhtml#PC4)中所示的程序。


    ![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig8_HTML.png](images/484167_1_En_3_Chapter/484167_1_En_3_Fig8_HTML.png)


    **图 3-8** 在树莓派3 Model B+上打开Arduino IDE


    打开Arduino IDE后，您可以编写Arduino版本的“Hello world”程序。


    ```

    void setup() {

    // put your setup code here, to run once:

    Serial.begin(9600);

    }

    void loop() {

    // put your main code here, to run repeatedly:

    Serial.println("Hello World from Arduino");

    }

    ```

    **清单 3-2** Arduino “Hello world” 程序


    为Arduino编写草图程序时，需要包含两个与C语言非常相似的函数。第一个是`void setup()`函数，主要用于初始化串行总线通信、LED或连接到Arduino微控制器的其他设备。图[3-12](#484167_1_En_3_Chapter.xhtml#Fig12)所示的Arduino
    IDE是您将在树莓派3 B+上从桌面“开始 ➤ 编程”菜单中打开的，然后您将编写图[3-9](#484167_1_En_3_Chapter.xhtml#Fig9)所示的程序。


    ![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig9_HTML.jpg](images/484167_1_En_3_Chapter/484167_1_En_3_Fig9_HTML.jpg)


    **图 3-9** 默认的Arduino IDE草图


    代码不言自明，采用C语言风格和语法。第一个函数是`void setup()`，符号`//`后的注释（表示注释）解释了您可以在此处放置代码，并且只需要运行一次，例如初始化任何设备或变量值等。在`setup`函数中，由花括号`{
    }`表示的主体是您编写代码的区域。下一个函数是`loop`函数，您希望它循环或重复运行。如果您有纯软件背景，可能会对此感到困惑，可能不理解为什么需要一个重复执行操作的函数。请这样理解：像Arduino这样的机器或微控制器无法自行运行，除非有一个程序反复告诉它该做什么。这就像您有一个随时待命的仆人，闲着会感到无聊。同样，Arduino也需要重复执行某些操作，不能闲置。您可以要求它监控一个设备，并在某个事件发生或设备即将出现故障时触发某些操作。这只是您可以使用`loop()`函数实现的一个例子；其应用是无限的。您可以根据Modbus设备的输入值（如温度等）打开或关闭LED。这只需要Arduino微控制器连续不停地工作，而这正是`loop()`函数的全部意义所在。


    在继续之前，您需要了解在Arduino IDE中编译和运行程序的过程。首先，编写草图代码并将其保存为扩展名为`*.ino`的文件。保存后，转到“工具 ➤ 板”，悬停以打开支持的Arduino微控制器板列表。从列表中选择“Arduino
    Mega 2560”。您必须记住每次打开Arduino IDE时都要检查，以免在编译时出现错误。图[3-10](#484167_1_En_3_Chapter.xhtml#Fig10)显示了如何执行此操作。'
