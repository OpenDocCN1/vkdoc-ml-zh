    ## 总结


    在本章中，你看到了一个近乎实际现实世界的场景：一家虚构的电信公司经历了一场社会政治危机，其老板被要求调查并解决其通话掉线问题。世界各地的电信公司都面临着类似的技术挑战和问题，并且正在使用人工智能来解决它们。我在这个案例研究解决方案中展示了如何预测通话掉线问题。预测问题是企业在找到问题解决方案之前必须跨越的第一个障碍。这在本次案例研究中已经完成。我们使用逻辑回归分类器算法构建了一个模型来预测通话掉线何时发生。有了这些数据，企业就可以看到需要什么样的技术升级来解决预测模型给出的湿度问题。是否有更好的发射和接收塔可以在这种潮湿条件下良好工作？他们是否需要将一些塔架远离水体？一旦预测模型提供结果，这些都是企业必须解决的一些问题。


    # 8. Gantara 发电厂：工业机器的预测性维护


    本章是关于一个能源行业的案例研究，我们尝试模拟工业机器预测性维护的数据。该案例研究的背景是未来非洲地区的一个虚构国家。它阐述了在第三世界国家建立发电厂所面临的挑战，从承担土地征用任务，到构思其设计，再到实际建设。还涵盖了建立发电厂的技术要求和技术规格，其中包括与行业相关的发电厂用地，以便你了解发电厂真正需要什么才能建立起来。如果你对能源行业不熟悉或有一些了解，你会发现关于发电厂需求的输入、处理和输出格式的表格很有帮助，它列出了企业的完整结构和基础。尽管人物、情境和国家都是虚构的，但它们会让你了解社会政治环境压力是如何作用于像发电这样基本的事情的。作为案例研究的一部分，还包括一位机器学习工程师，其角色在案例研究中被精心塑造，以让你了解典型的机器学习工程师在处理这类问题时可能会承受的压力。那么，让我们深入我们的案例研究吧。


    ## 案例研究


    Noki Ora，一家私营发电厂的首席执行官，刚刚降落在非洲 Nobag 的 Gantara 首都，由于最近当选政府的进步政策，该地区正在快速发展。然而，发展也带来了为工业和住宅需求生产足够电力的挑战。Noki
    从电厂概念化到目前状态（即现在能在 500 MW 峰值负荷下发电）就一直在这家公司。这个过程并非一帆风顺；一路上充满了问题。事实是，在第三世界国家建立发电厂面临着巨大的挑战，从寻找融资伙伴到寻找愿意进行安装的工厂设备供应商。


    Nobag 在 2024 年叙利亚战争结束后，在主要国家联合起来划出这个国家后，成为了非洲大陆的一个独立国家。自独立以来，该国对其采矿和农业产业（这里是人们的主要职业）的发展兴趣日益浓厚。其政府设立了各种经济特区，为来此设立业务的公司提供各种税收减免。Noki
    的公司，Nobag Power Enterprise Ltd.，就是这样一个由一群欧洲企业集团设立的公司，旨在利用该国的发展潜力并促进其基础设施建设。Nobag
    总统 Ag Zisi 发布了以下章程，作为总统令的一部分，授予 Nobag Power Enterprises 以使其成功完成使命：


    *授予 Nobag Power Enterprises 在两年时间内发电和输送高达 500 MW 容量的热能电力，以支持 Gantara 首都地区的电力需求。*


    公司的愿景声明反映了总统的章程，内容如下：


    *Nobag Power Enterprises 的愿景是发电和输送电力，以满足 Nobag 人民的电能需求，以帮助其住宅和工业发展。*

    '
- fmt: '# Project Background


    When the Gantara power plant was conceptualized by Nobag Power Enterprises, it
    drew up the land requirement plan for construction and installation of the power
    plant as this was the key factor for setting up the project by the Nobag government.
    The requirement of land was communicated to the government officials because this
    was a thermal power plant and it needed the land acquisition to be completed quickly
    so that it could start the power plant building process. The land plan schedule
    for the 500MW power plant is given in Table [8-1](#484167_1_En_8_Chapter.xhtml#Tab1).


    **Table 8-1** Power Plant Land Requirement for the Gantara Power Plant


    | Area in acres | |

    | --- | --- |

    | Description | 500MW |

    | **Facilities inside the power plant boundary** | |

    | **Main plant** | **25** |

    | **Coal handling system** | **230** |

    | **Water system** | **45** |

    | **Water reservoir** | **30** |

    | **Switchyard** | **25** |

    | **BOP, stores, and road** | **70** |

    | **Green belt area** | **150** |

    | **Facilities outside the power plant boundary** | |

    | **Ash disposal area** | **270** |

    | **Employee township** | **100** |

    | **Ash, raw water, and coal disposal** | **250** |

    | **Grand total** | **1195** |


    Although Nobag had ample land to set up a power plant project, most of the land
    around the city of Gantara was occupied by farmers. They gave stiff resistance
    to the newly formed Nobag government’s efforts to acquire land for development
    of a power plant. This led to violence and the government declared an emergency
    in the area where the land acquisition was sought by the company as it was close
    to a water reservoir. Finally, after the government agreed to the farmers’ demand
    for adequate compensation, the land acquisition went ahead after a struggle of
    nine months, which was a record of sorts given similar cases of government attempts
    to acquire land for dams and other projects; it had run into litigation and violent
    protests. Although the people of Nobag understood that the power plant was for
    their benefit, as was communicated by the government and Noki Ora in his interactions
    with the farmers and the people of Gantara, the issue was that of trust that the
    government was giving them a win-win deal. With a bit of pressure from its European
    conglomerate, the government bent to the pressure to acquire the land by giving
    market-based compensation.


    Noki Ora, 54, is an African-born electrical engineer who had worked with companies
    like GE and had ample experience in setting up power plant facilities for its
    European conglomerate partner. He had risen into the CEO position after his successful
    implementation of a plant in Middle East. He knew the geography well, being a
    native from this continent. He was well connected politically and was able to
    pull a few strings in order to make the project successful. He was shortlisted
    by the selection committee among three potential candidates who had similar profiles
    but did not have the ethnicity which gave him the advantage for this job.


    Nobag has extensive coal mines reserves to last it another 100 years. So setting
    up a thermal power plant is the best option as it has less petroleum reserves
    to fulfil the requirement of natural gas for a power plant. It will have to buy
    it from other Middle Eastern countries, which will be expensive and will drain
    its already meager foreign exchange reserves. Moreover, it will make it dependant
    on the natural gas supply for its power because the neighbouring countries had
    just come out of a long war and a natural gas pipeline could become the target
    of a militant strike if the situation became fluid in the region again. Although
    Nobag has its own pollution control laws, since it is taking help from external
    parties like the European conglomerate, it must adhere to the clean power requirements
    set by them. The thermal coal power plant must have CCS implemented, which is
    the process of capturing the carbon and putting it into the ground bed ([`https://en.wikipedia.org/wiki/Carbon_capture_and_storage`](https://en.wikipedia.org/wiki/Carbon_capture_and_storage)),
    thus reducing the release of carbon into the atmosphere. The primary purpose of
    the power plant is to convert the chemical energy of the coal into electrical
    energy. This is typically done by raising steam in the boilers, expanding it through
    the steam turbine, and then coupling the steam turbines to the electrical generators
    that convert mechanical energy into electrical energy. The input and output capacity
    of this thermal power plant is given in Table [8-2](#484167_1_En_8_Chapter.xhtml#Tab2).
    Note that all figures are for a daily consumption cycle of 24 hours.


    **Table 8-2** Input and Output of the Gantara Power Plant


    | Description | Input | Processing | Description | Output |

    | --- | --- | --- | --- | --- |

    | **Coal** | 6000 | | **CO2** | 15000 |

    | **Furnace Oil** | 50.5 | 500 MW | **SO2 + NO2** | 340 |

    | **Water** | 4900 | | **GT** | 460 |

    | **Electricity** | 40 | | **ASH** | 2100 |


    The problem with a typical coal-based thermal power plant is that of generation
    of gases like `CO2`, `SO2`, and `NO2`, which heavily pollute the environment.
    So these gases need to be treated by capturing them and putting them in the ground,
    especially `CO2`. This increased the cost of the project and the requirement of
    funds. The power plant itself requires electricity for its own consumption and
    so takes in about 40 megawatts of current for its operation and only 460 megawatts
    is released for further transmission to the city of Gantara. The requirement of
    4900 cubic meters per day is the reason why the specific land near a water reservoir
    was sought and also where the farmland was posing a problem for its setup. The
    ash generated is 2100 tonnes per day and the government invited private parties
    to build factories to create concrete products and wallboards from it so as not
    to pollute the land area around the water reservoir because it was also used by
    the farmers. When the power plant started near Gantara, there were hardly any
    factories for production of Portland Pozzolana Cement (PPC), which could recycle
    the ash generated so it was being released into dry landfills near the power plant.
    The environmental activists raised protests about creating such an environmental
    hazard for the farmers around the power plant; however, the government assured
    them that the facilities to completely use the fly ash output from the power plant
    would be ready in a few years’ time, reducing the environmental hazard around
    the proposed power plant.


    To build the thermal power plant near Gantara, the company took a loan from a
    global investor consortium of $600 million to cater to the increasing load of
    power consumption in the localities nearby.'
