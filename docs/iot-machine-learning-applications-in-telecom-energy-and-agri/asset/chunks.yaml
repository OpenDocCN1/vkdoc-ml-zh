    + "''" +"," + "''" + str(datetime.time(datetime.now())) + "''"+ "," + "''" + str(tem)
    +  "''" + "," + "''" + tempstatus +"''" + ")"

    df = pd.read_sql_query("select * from fielddata;", conn)

    print(df)

    #curr.execute(query)

