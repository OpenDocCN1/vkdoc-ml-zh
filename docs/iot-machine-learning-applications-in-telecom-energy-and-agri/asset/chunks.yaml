    在低压和高压加热器中，热量从流经省煤器的烟气中提取，并进一步用于预热即将送入燃烧室的空气。它是将热空气送入煤粉燃料系统以干燥煤炭、从而促进炉膛内燃料燃烧的关键设备。如果缺少这一功能，燃烧室可能会出现故障。发电厂锅炉还包含一个再热器组件，其管道由流经管道的热烟气加热。从高压汽轮机排出的蒸汽被送入再热器管道内部以获取能量，从而驱动后续的中低压汽轮机。


    汽轮机主要用作所有火力发电站的核心部件。汽轮机分为两种类型：


    *   冲动式汽轮机

    *   冲动-反动式汽轮机


    汽轮发电机组由一系列相互连接并共同安装在同一根轴（铁质杆状结构）上的汽轮机和一台发电机组成。一端是高压汽轮机（HPT），随后是中压汽轮机（IPT）、两台低压汽轮机（LPT）以及发电机。蒸汽在高温（约
    536°C 至 540°C）和高压（140 至 170 kg/cm²）下进入汽轮机膨胀做功。


    凝汽器将汽轮机排出的蒸汽冷凝成液态水，以便进一步泵送。凝汽器的功能包括：


    *   为蒸汽提供最低的排热温度。

    *   将汽轮机排出的蒸汽转化为水进行回收，从而节省发电厂的给水需求。


    冷却塔是一种半封闭式设备，通过空气接触对水进行蒸发冷却。从凝汽器流出的热水被送入冷却塔顶部，并以薄片或水滴的形式向下滴落。空气从冷却塔底部或垂直于水流方向流入，在有效冷却后排入大气。


    发电机是汽轮发电机组中的电气部分。它将燃气轮机的机械能转换为电能。发电基于电磁感应原理。没有发电机，燃气轮机的输出就无法产生电力。因此，它是发电厂中最重要的设备。”


    卡尔在报告中解释完这些之后，接着说明了获取燃气轮机周围物联网传感器数据所需的设置。正如第一份委员会报告所指出的，故障发生在燃气轮机上。然而，该报告未能得出根本原因，也未指出任何可能导致燃气轮机反复故障的潜在问题。这使得情况更加复杂，因此需要结合燃气轮机附带电子单元生成的数据进行监控，这些数据通过
    Modbus 协议发送到树莓派工作站进行收集。为了确定根本原因并观察外部环境温度是否产生影响，在燃气轮机上安装了一些物联网传感器。监测了三个参数：环境光照、环境温度，以及一个用于测量机器设备周围超声波声音的物联网传感器。当然，在现阶段，这仅仅是一个假设，即外部环境中的任何这些因素都可能导致让电厂工程师和设备制造商困惑的故障。只有精心收集的数据才能证明或反驳这一假设。该设置如图
