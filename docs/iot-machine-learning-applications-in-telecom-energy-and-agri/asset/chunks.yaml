  trans: '

    ### 确定位数


    在继续安装 Arduino IDE 之前，你需要了解你的树莓派是 32 位还是 64 位的。为此，有两个有用的命令，如清单 5-10 所示，它们可以显示 bash
    的位数版本。


    ```

    > which bash

    /bin/bash

    > file /bin/bash

    /bin/bash: ELF 32-bit LSB executable, ARM, version 1 (SYSV) ...

    清单 5-10

    查找树莓派的位数版本

    ```


    我的树莓派 3 B+ 有一个 32 位的 bash 可执行文件。这不是确定位数版本的非常明确的方法，但硬件制造商在 64 位处理器上编译 32 位 bash
    的可能性极小。此外，为了确认，你可以使用清单 5-11 中所示的 `uname` 命令，该命令显示我正在 ARMv7 处理器上运行树莓派 Linux 变体。


    ```

    pi@raspberrypi:~/$ uname -a

    Linux raspberrypi 4.14.98-v7+ #1200 SMP Tue Feb 12 20:27:48 GMT 2019 armv7l GNU/Linux

    清单 5-11

    用于确认处理器信息的命令


    ```


    即便如此，这也没有明确说明处理器的位宽。了解此信息很重要，因为你不想安装错误的 Arduino IDE 版本而搞乱你的 Raspbian 安装。因此，你可以使用一个名为
    `lshw` 的程序，你可以使用清单 5-12 中所示的命令来安装它。


    ```

    pi@raspberrypi:~/$ sudo apt-get install lshw

