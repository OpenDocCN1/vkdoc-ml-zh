    statement which enters data into all the three columns: `date`, `time`, and `ldrvalue`.
    The value entered into `time` column is taken from the `datetime.now()` function,
    which returns the date and time together. Since you want the time and date separately,
    you first use `datetime.date()` and then in the second column, you use the `datetime.time()`
