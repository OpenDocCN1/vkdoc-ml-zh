    `.databases` 或 `.tables`；另一组是 SQL 命令，例如 `select ∗ from <tablename>;`。初学者常犯的一个错误是忘记在
    `databases` 或 `tables` 命令前加点，然后 SQLite 提示符会报错。对于 SQL 命令，不要忘记在每个语句的末尾使用分号 (`;`)；如果不这样做，`sqlite>`
    提示符会继续到下一行，你的命令将不会执行。


