    The last survey is the article by Forbes ([`www.forbes.com/sites/bernardmarr/2019/02/04/5-internet-of-things-trends-everyone-should-know-about/#752315be4b1f`](http://www.forbes.com/sites/bernardmarr/2019/02/04/5-internet-of-things-trends-everyone-should-know-about/%2523752315be4b1f))
    written by Bernard Marr in February 2019\. Among other things, it predicts that
