    ## 总结


    在本章中，您研究了一个属于能源领域的非常技术性的案例研究：热电厂。这个案例研究将您带到了电厂公司在建立和成功运营电厂时所面临的一些挑战的前沿。该案例研究提出了一个非常年轻的电厂出现停机的问题，这很可能是由于温度引起的，就像炎热气候下的电厂情况一样。团队利用数据将问题定位到蒸汽轮机内部一个异常的入口操作单元，但需要数据和预测模型来为此类异常创建预警系统。这将触发预测性维护请求，只要通过定期数据监测看到此类异常的症状。我们创建了一个解决方案作为概念验证，以确定构建这样一个模型是否可行，以及是否能有切实的成果。通过使用分类算法，我们创建了一个能够
    100%预测或准确率分数为 1.0 的模型，这在现实世界中是罕见的。您看到了如何利用物联网传感器和树莓派 Model 3 B+ 的数据轻松创建整个解决方案。


    # 9. 农业行业案例研究：预测经济作物产量


