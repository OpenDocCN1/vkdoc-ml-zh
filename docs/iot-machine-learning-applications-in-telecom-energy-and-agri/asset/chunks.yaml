  trans: '

    ### 拥抱能源领域物联网的解决方案


    全球有多家公司正尝试利用基于物联网传感器的新技术，为这些老旧设备开发数据采集解决方案。其中一家知名企业是西门子（[`https://new.siemens.com/us/en/products/energy/featured-topics/redefine-performance.html`](https://new.siemens.com/us/en/products/energy/featured-topics/redefine-performance.html)）。能源领域面临的关键问题如下：


    1.  可再生能源电厂正在兴起。这体现在两个方面：一是老旧的化石燃料发电厂正被太阳能或风能企业取代；二是新增的发电厂本质上都是可再生能源电厂。


    能源运营的去中心化正在发生，这意味着发电机组为了生产能源，正变得越来越独立。传统的能源生产方式，如石油和天然气，需要集中的工厂设施来协助生产。然而，像太阳能电网和风力发电场这样的可再生能源发电系统，则允许能源生产的去中心化。去中心化使得能源生产计划可以在小型设施中执行，并且能更便捷地为本地社区的能源需求做出独立决策。中心化则赋予了能源公司跨地域运营的自由，并能利用物联网和机器学习等技术来生产能源。去中心化确实给利用规模经济带来了挑战；然而，它所带来的快速制定本地化能源生产决策的能力及其灵活性，弥补了这一不足。本地化的小型能源生产单元，可以利用机器学习或深度学习等技术，根据观察到的消费模式，快速决定何时削减或增加发电量。这种调节能源需求的能力，将成为未来建立去中心化能源生产单元的关键差异化因素。


    2.  我们都知道，人类对能源的需求，尤其是石油和天然气，在全球范围内不断增长，发电厂被迫在超出其原始设计规格的条件下运行。这对未来构成了严重威胁，因为电厂的产能已经达到极限，其未来运营面临压力。各公司正在采用多种技术：有些公司在化石燃料电厂旁边建设可再生能源电厂，而另一些公司则在提高现有化石燃料电厂的产能。


    3.  大多数国家面临的一个问题是电网的稳定性。为此，他们需要一个良好的系统，能够提前准确预测电网任何部分的能源需求，以便在用电高峰或低谷到来之前增加或减少发电量。停电会给依赖能源运营的工业和居民带来问题。因此，大多数国家都在规划运营方案，以更高效地满足其社区的能源发电需求。与不稳定的电网相比，稳定的发电电网通过提供稳定的电力经济来降低成本；而不稳定的电网则会推高发电成本，并对社区产生更深层次的经济影响。


    一家专注于发电厂和能源发电技术的公司——西门子，对其客户进行了一项关于利用其能源领域技术实现发电厂未来适应性的调查。参见[`https://assets.new.siemens.com/siemens/assets/public.1552332517.656a83b0-646a-4286-9546-dc54bd8a2e35.future-proofing-power-plant-ebook-2019.pdf`](https://assets.new.siemens.com/siemens/assets/public.1552332517.656a83b0-646a-4286-9546-dc54bd8a2e35.future-proofing-power-plant-ebook-2019.pdf)。调查中的客户谈到了发电厂预计在未来三年将面临的公用事业挑战。30%的受访者提到的第二个问题是采用新的人工智能技术。这表明，能源发电公司看到了在当前环境中采用人工智能、机器学习和物联网所面临的挑战。调查给出的展望是未来三年，因此这是一个短期展望。在关于通过规划和数据分析（一个与数据科学和机器学习密切相关的领域）取得成功的提问中，它询问客户在过去三年中，电厂改造和更新项目的成功程度如何；那些实现了电厂运营目标的公司的回复显示，超过
    50%的公司达到了这一目标。然而，调查得出的主要结论是，能源发电商正在大力投资于包括新数字技术在内的计划升级和改造，但在决定改造和升级方面的信心水平较低：在确定优先级方面约为
    20%至 27%，在决定哪些合作伙伴应参与此类升级项目方面约为 20%至 30%，在决定何时或什么时间点进行投资方面约为 18%至 33%。过去三年中，升级项目报告的整体成功率约为
    25%，这意味着尽管能源发电公司已经采用了升级项目，但成功的案例很少，失败率很高。


    因此，我们看到能源行业正处于动荡之中，许多公司被迫将其电厂升级为更依赖太阳能和风能等可再生能源；然而，此类项目升级的成功率非常低，导致投资回报率下降。正如调查所指出的，采用机器学习和人工智能等技术是一项挑战，这意味着该行业在适应和利用这些技术为自己创造优势方面准备不足。但在任何先进的实施方案中，像西门子这样的公司都通过使用物联网传感器和设备，并将其连接到机器学习模型来预测任何电网的能源需求，从而提供解决方案。这种创新解决方案甚至可以应用于化石燃料发电厂和旧的数据存储库，以分析和综合数据，创建预测模型。从预测工厂和设备的定期维护周期到预测用电高峰，各公司正在使用机器学习模型来解决遗留问题（[`https://assets.new.siemens.com/siemens/assets/public.1534921431.05f93d5a3c096441998512706a42840c51fd3f68.2018-05-ew-article-iot-manfred-unterweger-en.pdf`](https://assets.new.siemens.com/siemens/assets/public.1534921431.05f93d5a3c096441998512706a42840c51fd3f68.2018-05-ew-article-iot-manfred-unterweger-en.pdf)）。

    '
- fmt: '# 能源领域的前沿机器学习应用


    另一家名为 MindSphere 的公司实现了先进的能源技术，该公司专注于能源流程的数字化。它通过实施工业 4.0，将能源互联网作为物联网的延伸进行推广，使机器和流程智能互联，从而在整个服务生命周期内更高效、更可靠地运行。MindSphere
    创建了能源领域的能源网络（EN），涵盖广泛且多样化的应用，包括智能计量、保护数字服务、电力连接、电能质量稳定性、关键电源管理系统、电厂状态监测系统、能源中断管理系统、智慧城市平台系统、分布式能源资源微电网等级以及强大的预测仿真模型。这些领域正在使用智能物联网传感器采集各类数据，使业务应用能够评估设备状态，并在此基础上应用机器学习和数据科学，例如用于断路器的预防性维护和警报监控。作为西门子旗下公司，MindSphere
    为最终成功的数字化转型和利润实现奠定了基础。它能够监控现场设备和装置，从而在电厂紧急情况下根据需要采取适当行动。这类数字解决方案将改变物联网和机器学习在能源领域的实施方式。能源公司的业务活动性质复杂且具有关键性，因为它们服务于医院和机场等众多紧急服务部门，因此使用人工智能和机器学习进行决策和规划辅助也显得尤为重要。


    1.  涉及能源勘探、生产和分配的跨境复杂运营需要使用机器学习，以便通过创建高效业务模型，仔细分析从这些运营中收集的所有数据，从而辅助能源领域管理高管的决策过程。


    2.  客户数量庞大且分布广泛给能源公司从终端用户收集数据带来了挑战。使用能够从单个客户设备（如智能电网、智能云存储应用）回传数据的智能计量技术，并利用机器学习基于这些数据预测能源消耗，有助于能源领域的决策过程。


    3.  基础设施投资需要主要设备和设施、车队升级或新工厂的调试与安装。在进行此类投资前，使用机器学习和人工智能创建模型，通过提供关于过去失败原因以及如何在新升级或安装项目中避免问题区域的数据，能够极大地帮助做出正确决策。


    为了提高运营绩效，发电厂正在利用物联网获取数据，将其工业资产连接到物联网传感器设备，在工厂层面监控机械性能，并衡量组织关键绩效指标（KPI），如机械生产率和设备效率。老旧工厂的预测性维护无疑是物联网应用正在为能源领域解决的问题。物联网数据可以生成，使企业了解设备性能负载以及老化能源资产的位置。基于物联网的管道能源计量表已变得非常普遍；它们利用机器学习来测量和预测石油、天然气等能源液体的流量。流体的质量也可以被监控，任何劣化都可以提前预测，以避免生产过程中的巨大损失。能源领域还利用机器学习来预测化石燃料厂的能源消耗，以便通过备用可再生能源电厂启动并承担负荷，使其处于就绪状态以应对消费者能源需求的任何激增。这种基于能源需求预测性需求响应的平衡是能源领域的一个绝佳用例。


    您已经了解了能源领域机器学习的前沿应用。本章下一节将介绍机器学习与物联网在农业领域的前沿应用。'
  raw: 'Another state-of-the-art implementation of energy is by a company named MindSphere
    , which specialises in digitization of the energy processes. It has evangelized
    the concept of using the Internet of Energy as an extension to the IoT by implementing
    Industry 4.0 where machines and processes are intelligently linked with each other
    so that they can work more efficiently and reliability through their entire service
    life. It has created the EN of the energy sector with a broad range of applications
    that are diverse in nature, from smart metering, digital services for protection,
    power except connectivity, power quality stability, critical power management
    systems, power plant condition monitoring systems, energy outage management systems,
    smart city platform systems, distribution of energy resource microgrid grades,
    and great prediction simulation models. These are some of the areas that are using
    smart IoT sensors to pick up a range of data, allowing business applications to
    evaluate the status of equipment and apply machine learning and data science on
    top for preventive maintenance and alert monitoring for circuit breakers, for
    example. MindSphere, a Siemens company, delivers the basis for successful digital
    transformation in the end and the realization of profits. It allows monitoring
    of field equipment and devices to make it possible to take appropriate actions
    as needed in an emergency situation in power plants. These kind of digital solutions
    are going to transform the implementation of the IoT and machine learning for
    the energy sector. The business activities of energy companies, which are very
    complex in nature and have criticality attached to them since they cater to many
    emergency services such as hospitals and airports, also make it very important
    for them to use artificial intelligence and machine learning in decision-making
    and planning assistance.


    1.  Complex operations distributed over the border involving exploration, generation,
    and distribution of energy requires the use of machine learning so that the data
    collected from all of these operations is analysed carefully by creating productive
    business models to aid the decision-making process of the energy sector management
    executives.


    2.  The high number and spread of customers pose challenges for energy companies
    in collecting data from the end user. The use of smart metering, which has the
    ability to communicate back data from individual customer devices such as smartgrid
    smartcloud storage applications and the use of machine learning to predict energy
    consumption based on this data can help the decision-making process in the energy
    sector.


    3.  Investments in infrastructures require major equipment and facilities and
    fleet upgrades or new plant commissioning and installation. The use of machine
    learning and AI for creating models before making such investments can greatly
    help in making the right decisions by providing data on what failed in the past
    and how to avoid the problem areas while implementing new upgrade or installation
    projects.


    To improve operational performance, energy generation plants are using the IoT
    for data by connecting their industrial assets to IoT sensor devices and monitoring
    the performance of machinery at the plant level and by measuring organizational
    KPI such as machinery productivity and equipment efficiency. Predictive maintenance
    of old plants is definitely a problem that IoT-based applications are solving
    for the energy sector. IoT data can be generated such that it makes them aware
    of the equipment performance payloads and locations of deteriorating energy assets.
    IoT-based pipeline energy meters have become very common; they use machine learning
    for measuring and predicting the flow of energy liquids like oil and gas. The
    quality of the flow can also be monitored and any deterioration can be predicted
    well in advance to avoid any huge losses during the production process. The energy
    sector is also using machine learning to preidct energy consumption in the fossil
    fuel plant so that it is in ready state to accommodate any spike in consumer energy
    requirement by having a standby renewable energy plant power up to take up the
    load. This balancing based on a predictive demand forecasting of energy requirements
    is an excellent use case for the energy sector.


    You have looked at the state-of-the-art implementation of machine learning in
    the energy sector. The next section in this chapter covers the state-of-the-art
    implementation of machine learning and the IoT in the agriculture domain.'
  trans: '

    另一项先进的能源技术实现来自一家名为 MindSphere 的公司，该公司专注于能源流程的数字化。它通过实施工业 4.0，将机器和流程智能互联，使其在整个使用寿命期间能够更高效、更可靠地运行，从而推广了将能源互联网作为物联网延伸的概念。该公司为能源领域构建了生态系统，应用范围广泛且性质多样，涵盖智能计量、保护数字服务、电力连接、电能质量稳定性、关键电源管理系统、电厂状态监测系统、能源中断管理系统、智慧城市平台系统、分布式能源微电网等级以及出色的预测模拟模型。这些领域正利用智能物联网传感器采集各类数据，使业务应用能够评估设备状态，并在此基础上应用机器学习和数据科学，例如对断路器进行预防性维护和警报监控。作为西门子旗下公司，MindSphere
    最终为成功的数字化转型和实现盈利奠定了基础。它能够监控现场设备和装置，从而在电厂紧急情况下根据需要采取适当行动。这类数字解决方案将改变物联网和机器学习在能源领域的实施方式。能源公司的业务活动本质上非常复杂，且具有关键性，因为它们服务于医院和机场等众多紧急服务部门，因此，在决策和规划辅助中应用人工智能和机器学习也显得尤为重要。


    1.  涉及能源勘探、生产和分配的跨境复杂运营，需要利用机器学习，通过创建高效业务模型，仔细分析从所有这些运营中收集的数据，以辅助能源领域管理高管的决策过程。


    2.  客户数量庞大且分布广泛，给能源公司从终端用户收集数据带来了挑战。使用能够从单个客户设备（如智能电网、智能云存储应用）回传数据的智能计量技术，并利用机器学习基于这些数据预测能源消耗，有助于能源领域的决策过程。


    3.  基础设施投资需要主要设备和设施、车队升级或新工厂的调试与安装。在进行此类投资前，利用机器学习和人工智能创建模型，通过提供关于过去失败原因以及如何在实施新升级或安装项目时规避问题区域的数据，能够极大地帮助做出正确决策。


    为了提高运营绩效，发电厂正在利用物联网获取数据，将其工业资产连接到物联网传感器设备，监测工厂层面的机械性能，并衡量组织关键绩效指标，如机械生产率和设备效率。老旧电厂的预防性维护无疑是基于物联网的应用正在为能源领域解决的问题。可以生成物联网数据，使其能够了解设备性能负载以及老化能源资产的位置。基于物联网的管道能源计量表已变得非常普遍；它们利用机器学习来测量和预测石油、天然气等能源液体的流量。还可以监测流体的质量，并提前预测任何劣化情况，以避免在生产过程中造成巨大损失。能源领域还利用机器学习来预测化石燃料电厂的能源消耗，以便其处于就绪状态，通过启动备用可再生能源电厂来承担负荷，以应对消费者能源需求的任何激增。这种基于能源需求预测性需求预测的平衡，是能源领域一个极佳的应用案例。


    您已经了解了机器学习在能源领域的先进实现。本章下一节将介绍机器学习和物联网在农业领域的先进实现。

    '
- fmt: '# State-of-the-Art Implementation of Machine Learning and the IoT in the Agriculture
    Domain


    The agriculture domain is seeing the emergence of an AI revolution right now.
    This technological wave is happening all over the world. The key transformation
    that is happening worldwide in farming is that major food conglomerates are trying
    to take over farming for their own consumption in producing products for the end
    consumer. The bigger food conglomerates want the farmers to produce specific patented
    varieties of crops in order to maintain good food quality and productivity. So
    in some countries they are tying up with farming communities and buying raw vegetables
    and beef from them. In other countries, they are hiring farmers on contract to
    produce specific varieties of food grains and other products such as potatoes,
    lettuce, carrots, dairy, and rapeseed, which are used as inputs for end consumer
    products such as burgers by McDonalds through the Flagship Farmers program ([`www.flagshipfarmers.com/en/about-the-program/`](http://www.flagshipfarmers.com/en/about-the-program/)).


    The effort by these food giants is to create a bank of patented varieties of their
    core materials such as potatoes and lettuce. For example, McDonalds uses its famous
    patented Russet Burbank potato for its french fries ([`www.earthandtablelawreporter.com/2015/09/11/patenting-the-potato-not-all-taters-are-created-equal/`](http://www.earthandtablelawreporter.com/2015/09/11/patenting-the-potato-not-all-taters-are-created-equal/)).
    Another example is that of Monsanto, a food conglomerate that owns many patents
    for its vegetables and seeds, such as beans, broccoli, carrots, cucumber, and
    melons, among others. Many of these vegetables are commercially used by other
    companies. Monsanto’s potatoes are used by PepsiCo for its flagship potato chip
    brand Lays ([`https://feast.media/food-brands-owned-by-monsanto`](https://feast.media/food-brands-owned-by-monsanto)).
    Monsanto holds 14 varieties of patents and the most popular is Roundup Ready®
    Corn 2 ([`www.monsantotechnology.com/content/genuity-traits-corn.aspx`](http://www.monsantotechnology.com/content/genuity-traits-corn.aspx)).


    This is just an example of how food companies are buying a patent and utilizing
    it commercially. There is currently a controversy surrounding the use of GMO products
    as raw material for commercial foods. Genetically modified foods can cause various
    diseases, so they are not being used by major food companies; however, there is
    pressure on them to become commercially viable and to adapt to GMO-based practices
    to increase profits, which GMO food varieties offer.


    The bold new alternative to genetically modified crops is computationally bred
    crop technologies combined with AI and machine learning to give excellent yields
    to farmers. The first one uses the IoT to gather data about the crop and its environment,
    such as the components of air using air filter sensors and oil sensors to gather
    data about the soil mix. The applications are already available through something
    known as statistical breeding patterns, which allow the farmer to get the best
    crop for the environment based on the atmosphere comprising of the air and soil
    mix. In this system, the farmer uses intelligent machine learning and IoT systems
    to select the best seed breed for the given air and soil mix based on past data
    in other regions of the world that have similar climates in order to produce maximum
    yields for their farms. This is being done by a company known as HFG; it is using
    farming data sets and predictive data science to build a predictive breeding platform
    for crops. ([`www.zdnet.com/article/computational-breeding-can-ai-offer-an-alternative-to-genetically-modified-crops/`](http://www.zdnet.com/article/computational-breeding-can-ai-offer-an-alternative-to-genetically-modified-crops/)).


    Another state-of-the-art implementation of AI in comes from technologically advanced
    nations like Japan for application in rice farming. People in rural areas are
    moving to cities to earn their livelihood. As a result of this mass migration
    of the population from rural areas to urban centers such as Tokyo and Kyoto, there
    are no people available to undertake farming in rural Japan. So Japan has an urgent
    need for farmers, especially for rice production, which is a staple. Automating
    and using machine learning and AI for farming in rural Japan can offer help. In
    this application, the farmers and developers in northeast Japan started using
    drones to supplement the workforce in the fields (see Figure [4-1](#484167_1_En_4_Chapter.xhtml#Fig1)).


    ![../images/484167_1_En_4_Chapter/484167_1_En_4_Fig1_HTML.jpg](images/484167_1_En_4_Chapter/484167_1_En_4_Fig1_HTML.jpg)


    Figure 4-1


    Drone robot for detecting disease onset in crops


    A drone named `91108 rich''s` was developed by a startup company. Its main function
    is to disperse pesticides and fertilizers on crops. It’s able to do in 15 minutes
    work that would take a farmer 60 minutes. Control of such a drone through an iPad
    merged with a machine learning application to identify areas that require more
    fertilizer or pesticides can be developed on top of such an application. The diagnostic
    drones can detect onset of disease by continuous play Selma the crops and protecting
    any microorganisms near The Cross set on it pacific Best Buy all those areas are
    such an infestation occur. This is the where the use of IoT sensors on pest control
    along with machine learning applications running from nearby Raspberry Pi application
    station can help to automate the entire farming cycle ([`www.techrepublic.com/article/how-drones-are-changing-farming-in-rural-japan/?ftag=CMG-01-10aaa1b`](http://www.techrepublic.com/article/how-drones-are-changing-farming-in-rural-japan/%253Fftag%253DCMG-01-10aaa1b)).


    ## Summary


    All of the applications you saw in this chapter are experimental in nature and
    have been newly introduced with the state-of-the-art implementation in the IoT
    of 5G by the Chinese company Huawei. You also saw how the challenges faced by
    energy sector are being resolved by the use of the IoT in areas of power generation
    both for fossil fuels and renewable energy sources. You then looked at the farming
    sector where the intelligent use of the IoT and machine learning promises to solve
    the human drain problem of farmers selling their land and migrating to the cities
    for a better living. In Chapter [5](#484167_1_En_5_Chapter.xhtml), you will prepare
    your setup for implementing case studies in these three domains.


    # 5. Preparing for the Case Studies Implementation


    This chapter is all about preparing for the case studies implementation. You will
    first learn how to set up your Raspberry Pi 3 Model B+ with its hardware and software
    from scratch. Of course, you will be installing the popular Raspbian OS for this.
    After this, you will set up the Arduino Mega 2560 to your Raspberry Pi along with
    the IoT sensor modules to get data from. This will be followed by setting up the
    Python required for running a program on the Raspberry Pi. You will also be setting
    up the energy meter device with the Modbus enabled on it. After this, you will
    connect the Raspberry Pi with the Arduino and start communication between them.
    Lastly, you will test everything.'
