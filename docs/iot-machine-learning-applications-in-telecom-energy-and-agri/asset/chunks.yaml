- fmt: 'This concludes the code for programming the Arduino side of the program. You
    can compile it and upload it to the Arduino Mega 2560 by using the steps shown
    in Chapter [3](#484167_1_En_3_Chapter.xhtml) and Chapter [5](#484167_1_En_5_Chapter.xhtml).
    You should be able to see the code compile success and upload success messages
    like they appear in Figure [6-6](#484167_1_En_6_Chapter.xhtml#Fig6) and [6-7](#484167_1_En_6_Chapter.xhtml#Fig7).


    ![../images/484167_1_En_6_Chapter/484167_1_En_6_Fig7_HTML.jpg](images/484167_1_En_6_Chapter/484167_1_En_6_Fig7_HTML.jpg)


    Figure 6-7


    “Done uploading” message after uploading the code for EM6400


    ![../images/484167_1_En_6_Chapter/484167_1_En_6_Fig6_HTML.jpg](images/484167_1_En_6_Chapter/484167_1_En_6_Fig6_HTML.jpg)


    Figure 6-6


    “Done compiling” message after compiling the code for EM6400


    You are done with the steps from the Arduino side of the code. However, you will
    not see the results of the Line to Neutral Voltage and frequency in the Arduino
    side of things. Remember that you wrote everything to the serial port via statements
    `Serial.write()`. To read these values, you need to write a very small Python
    program that shows you what the Arduino Mega 2560 is writing to its serial port.


    First, you need to install a Python package or module named `serial`, which can
    be done on the Raspberry Pi 3 B+ command line, as shown in Figure [6-8](#484167_1_En_6_Chapter.xhtml#Fig8).


    ![../images/484167_1_En_6_Chapter/484167_1_En_6_Fig8_HTML.jpg](images/484167_1_En_6_Chapter/484167_1_En_6_Fig8_HTML.jpg)


    Figure 6-8


    Installing the `serial` module in Python on the Raspberry Pi 3 B+


    Python installations have this module by default, so you may not need to install
    it. You can check if it requires an installation by running the simple import
    statement `import serial` on the Python prompt as shown in Figure [6-9](#484167_1_En_6_Chapter.xhtml#Fig9).


    ![../images/484167_1_En_6_Chapter/484167_1_En_6_Fig9_HTML.jpg](images/484167_1_En_6_Chapter/484167_1_En_6_Fig9_HTML.jpg)


    Figure 6-9


    Checking if the `serial` Python module is installed


    If you get an error, then the module for your version of Python is not installed.
    If you do not get an error and the Python prompt `>>>` returns without giving
    out any message, it’s an indication that the library module is already present
    and you don’t need to install it again.


    Now that you have the `serial` library installed, you can go ahead and write the
    code for Python to fetch the data from serial port. See Listing [6-8](#484167_1_En_6_Chapter.xhtml#PC9).


    ```

    import serial

    ser= serial.Serial(''/dev/ttyACM0'', 9600)

    while 1:

    print("Reading...")

    print(ser.readline())

    Listing 6-8

    Python Code to Read Data from the Arduino Serial Port

    ```


    In this Python program, you first import the `serial` object and then create an
    object named `ser` with the `serial.Serial()` function by giving the first parameter,
    `/dev/ttyACM0`; usually this is the serial port where Arduino communicates. The
    second parameter, `9600`, is the frequency baud rate at which it is communicating
    from the energy meter. This is frequency value you set in the code block in Figure
    [6-10](#484167_1_En_6_Chapter.xhtml#Fig10). If you have changed that frequency
    for some reason, you need to change it here to the same value or the communication
    will not happen due to baud rate frequency mismatch. When you run this Python
    program, you will see output similar to that given in Listing [6-9](#484167_1_En_6_Chapter.xhtml#PC10).
    The code `ser.readline()` reads one line of values from the serial port connected
    to the Arduino Mega 2560 and then in turn to the EM6400 Energy Meter.


    ```

    >>> %Run arduino.py

    Reading...

    b''Hello World\r\n''

    Reading...

    b''preTransmission\r\n''

    Reading...

    Line to Neutral Voltage:

    221.5

    Frequency:

    49.67

    b''postTransmission\r\n''

    Listing 6-9

    Sample Output of the Python Program on Raspberry P 3 B+

    ```


    You can see in the sample output that the program starts with `preTransmission`
    written and then prints “Line to Neutral Voltage:” and its value of 221.5 and
    then it prints “Frequency:” and its value of 49.67. This runs in an infinite loop
    every 2 seconds and every time the setup runs, “Hello World” is printed in the
    serial communication output. You can change this to something meaningful like
    “Setup initialized.” I leave it up to you.


    With this you come to the end of configuring and setting up the Conzerv EM6400
    Energy Meter. Now, as I promised at the beginning of the chapter, you will get
    to configure an energy meter with just a single-phase two-wire setup, which is
    much simpler to set up and configure. This energy meter is by Eastron SDM630,
    which has a Modbus interface as well. This time you are not going to use the Arduino
    Mega 2560; you’ll use Python and Raspberry Pi to directly get data from it.


    Now you will first be connecting with a single Eastron SDM 630 through a single
    phase connection. I do not recommend connecting more than one of this meter either
    in a serial or daisy-wheel fashion because, unlike the Arduino Mega 2560, the
    Raspberry Pi 3 B+ is not a rugged industrial grade board and it can get burned
    easily. So the connection system that I am giving here is only for a small project,
    unlike the Conzerv EM6400 connection and configuration from earlier chapters.


    The Eastron SDM630 Energy Meter (Figure [6-10](#484167_1_En_6_Chapter.xhtml#Fig10))
    is made by a Chinese company and is easily available worldwide. You can check
    out the links on [`www.pmauthor.com/raspbian`](https://www.pmauthor.com/raspbian)
    if you need one. This smart energy meter is one of the most popular ones for domestic
    and industrial purposes and supports three-phase connections as well. I recommend
    this one because I and my team have sufficiently tested it for personal and commercial
    applications for client projects and it performs well. Although there are a few
    competitors on the market, we use this popular one the most.


    ![../images/484167_1_En_6_Chapter/484167_1_En_6_Fig10_HTML.jpg](images/484167_1_En_6_Chapter/484167_1_En_6_Fig10_HTML.jpg)


    Figure 6-10


    Eastron SDM630


    The first step is to connect this energy meter to the Raspberry Pi and for that
    you will need the following components:


    1.  RS485 Modbus USB Convertor

    2.  At least 1 meter twin wire that can pass 5V current

    3.  Eastron SDM630 Energy Meter

    4.  Single phase machine such as a motor or a milling machine that has electronic
    coils and motors to produce reactive power

    5.  At least 20W LED bulb to produce active power


    All the items listed are mentioned with their specifications at [`www.pmauthor.com/raspbian/`](https://www.pmauthor.com/raspbian/).
    Let’s get started connecting all of them together.


    The RS485 USB Convertor needs to be connected with the twin wires, as shown in
    Figure [6-11](#484167_1_En_6_Chapter.xhtml#Fig11). You can see the specific terminals
    to connect. There are two terminal pins at the base of the USB convertor.


    ![../images/484167_1_En_6_Chapter/484167_1_En_6_Fig11_HTML.jpg](images/484167_1_En_6_Chapter/484167_1_En_6_Fig11_HTML.jpg)


    Figure 6-11


    RS485 USB convertor'
