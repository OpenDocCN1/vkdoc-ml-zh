    Thermal power plant schematic diagram


    He showed this report to the commission officials and other members who were not
    aware of how a thermal power plan worked. His report read as follows:


    “Please remember that this is not a technical diagram but a rough one to help
    you understand the key components of a thermal power plant. The actual power plant
    is more complex; however, the components remain the same. Let’s discuss each of
    the components one by one.


    A boiler is a vessel into which water is fed as an input and steam is taken out
    at desired pressure, temperature, and flow. Heat is applied on the container.
    For that, the boiler should have a facility to burn fuel and release the heat.
    The main functions of a boiler are as follows:


    - Conversion of the chemical energy of the fuel such as air into heat energy.

    - Conversion of this heat energy to water for evaporation as well to steam for
    superheating.


    The basic components of a boiler are:


    - Furnace and burners

    - Steam and superheating


    Similarly, the other component, the economizer, is to improve the efficiency of
    the boiler by extracting heat from flue gases to heat water and send it to the
    boiler drum.


    The advantages of the economizer, as the name says, include:


    - Fuel savings: Used to save fuel and increase the overall efficiency of boiler
    plant

    - Reducing the size of the boiler: Since the feed water is preheated in the Economizer
    and then enters the boiler tube at a higher temperature, the heat transfer area
    required for evaporation is reduced considerably.”'
  raw: 'On the commissioning of the new power plant, which has an installed peak load
    capacity of 500 MW against a current peak load demand of 640 MW, the problems
    that have plagued its operation are high power system losses, low plant efficiency,
    erratic power supply, electricity theft, blackouts, and shortages of funds for
    power plant maintenance. Overall, the country’s generation plants were unable
    to meet system demand over the past decade. It is currently buying electricity
    from a neighbouring country to which it has to make payments in US Dollars, which
    is depleting its vital foreign exchange reserves. Whenever there is an outage
    in this power plant, backup power is taken from the neighbouring country to supply
    power during a blackout. It had issues with power generation during summer and
    winter peak load seasons.


    President Ag Zisi of Nobag called for an urgent meeting last month with CEO Noki
    Ora based on heavy consumer complaints during the summer months about the power
    plants outages, which led to several hours of blackout in the capital city. The
    last outage lasted for more than 48 hours and the power was restored to the entire
    city only after the neighbouring country gave alternative power. The President
    wanted to why a new power plant that was commissioned only eight months ago was
    having problems. Thermal power plants have a life beyond 30 years. Due to the
    mounting pressure through the press on his government’s inability to supply electricity
    to the nation’s capital adequately, the President called the European conglomerate
    officials to constitute an investigation and submit a report on the cause of the
    frequent outages and how this problem could be resolved. The commission took more
    than 20 days to study the plant infrastructure. It had among its team a machine
    learning engineer named Carl, who was also roped in to help the team determine
    the real reason of these outages based on data available from the power plant.
    Carl used Modbus RS485 interface devices to get data from the key power plant
    machines over a period of two weeks. His findings were as follows:


    *   Outage is the most common issue in the power plant due to its steam turbine.


    *   Finding a way to reduce the outage duration needs to happen.


    *   The number of outages needs to be reduced.


    *   A prediction model needs to be built around what is loading now and the projected
    loading across several hours for the power plant.


    A second national committee was set up by the government of Nobag based on the
    findings of the first commission to find out and rectify the main reasons for
    the outages. The report found out that the fault was actually due to lack of coordination
    on the operation of the gas turbine.


    The following parameters were laid down by Carl, who was also part of the second
    national commission, to collect outage data from the gas turbine/grid:


    *   Total period, T


    *   Number of faults that occurred during period T


    *   Number of failures between maintenance


    *   Total operating time between maintenance


    *   Total outage hours per year


    *   Number of failures per year


    *   Uptime of gas turbine


    *   Downtime of gas turbine


    As in any traditional coal-fired power plant facility, the devices and machines
    work in silos with no connected single source of data stored centrally. Each unit,
    from turbine to transformers to boiler, is monitored independently. Also the data
    asked for by Carl was not being stored by the power plant so it was not possible
    for the commission members to determine the real reason for the failure that occurred
    in the gas turbine. Noki Ora’s company was asked by the national commission to
    collect the data using IoT sensors from the gas turbine and relay and store that
    data in new private cloud servers. The results were to be generated over a period
    of two weeks 24x7 so that the outage durations could be clearly recorded. The
    purpose was to help Carl create a model to predict an outage. Of course, describing
    and diagnosing an outage was part of the process. The effort by the commission
    was to make the power plant company become forward-looking rather than just backward-looking
    and to become predictive and prescriptive on the outages that were happening inside
    the power plant.


    As with any new exercise to change the way operations worked, there was resistance
    to what was being done by the commission. The unions got together and were keen
    to know what the outcome of this exercise would be. Would it lead to job losses?
    Would it lead to cuts in pay? Everyone was curious. There was resistance to putting
    new IoT sensors around the turbines in order to get a new set of data. In spite
    of all this, Carl and his team were determined to go ahead and get their plan
    implemented.


    The plan employed many sensors, such as the ones measuring temperature and light
    around the turbines to the ones that measured ultrasonic sounds near it. Carl
    wanted to ensure that he did not leave any stone unturned in determining the real
    cause for the turbine failures. Carl, although a machine learning engineer, had
    to study the domain in which he was working, the power plant, so he had to learn
    the complete functioning of the power plant. He produced a short schematic of
    the power plant, and its units are shown in Figure [8-1](#484167_1_En_8_Chapter.xhtml#Fig1).


    ![../images/484167_1_En_8_Chapter/484167_1_En_8_Fig1_HTML.jpg](images/484167_1_En_8_Chapter/484167_1_En_8_Fig1_HTML.jpg)


    Figure 8-1


    Thermal power plant schematic diagram


