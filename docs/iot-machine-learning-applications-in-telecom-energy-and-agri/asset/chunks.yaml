    截至撰写本文时，当今最流行的单板计算机是 Raspberry Pi 和 Banana Pi。它们在爱好者和严肃用户中同样受欢迎。Raspberry Pi 运行
    Noobs、Raspbian 和 Windows IoT 等操作系统，而 Banana Pi 运行 Linux 和 Android 4.x。Raspberry
    Pi 从 Model Zero 发展到目前的 3 Model B+，正如你在表 1-2 中所见，硬件有了巨大的改进。Raspberry Pi 3 B+ 现在拥有
    ARM Cortex-A53 1.4GHz CPU，相比拥有 ARM Cortex-A53 1.2GHz CPU 的 Raspberry Pi 3 B 有所提升。RAM
    大小没有改变；然而，Wi-Fi 有所增强，现在支持高达 5GHz 的传输。以太网支持已从 100Mbps 提升到 300Mbps。对于项目与移动应用紧密相关的用户来说，他们更倾向于使用
    Banana Pi，因为其操作系统是 Android，虽然 Android 构建在 Linux 之上，但其内核是 Android。对于本书中的项目，我选择了
    Raspberry Pi。我们将使用的操作系统是 Raspbian，它是 Debian 操作系统的改编版。我们不使用 Noobs，因为我们希望在单板计算机上制作商业级应用程序；我们也不使用
    Windows IoT，因为我们需要一个内置桌面和开发 IDE 的操作系统。因此，选择 Raspbian 是显而易见的。


    使用表 1-3 来帮助你决定为项目使用哪款 Raspberry Pi。


