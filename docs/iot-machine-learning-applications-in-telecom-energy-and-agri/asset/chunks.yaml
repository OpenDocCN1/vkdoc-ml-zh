    A thermal power plant has its prime mover medium as steam. To explain simply,
    water is heated, turned into steam, and spun in a steam turbine, which in turn
    drives an electrical generator. After this, the steam passes through the turbine
    and is condensed in a condenser; this is known as the Rankine cycle.


    The steam turbine always operates under a high steam pressure environment and
    has a number of high velocity moving parts. The nozzles (inlet and outlet valves)
    and turbine blades are designed through a careful analysis and its parts are manufactured
    to a high degree of precision.


    Steam turbine plants generally have a history of achieving up to 95% availability
    and can operate for more than a year between shutdowns for maintenance and inspections.
    Their unplanned or forced outage rates are typically less than 2%, or less than
    one week per year. In our case study, after careful analysis of entire plant data,
    the problem of erractic outages was narrowed down to a malfunctioning of a steam
    turbine by the plant manufacturing engineers who were part of the group that included
    machine learning engineer Carl.


    In Listing [8-1](#484167_1_En_8_Chapter.xhtml#PC1), we first import libraries
    like `pandas` and `sqlite3` for connecting to the database. The database name
    is `powerplant.db` and the table name is `TURBINE_INLET_DATASET`. We use this
