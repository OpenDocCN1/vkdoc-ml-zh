  trans: "\n```\npi@raspberrypi:~/$ cat tkinter.out\nTraceback (most recent call last):\n\
    File \"\", line 1, in \nImportError: No module named tkinter\npi@raspberrypi:~/$\n\
    清单 5-7\nPython 2.7 命令行报错\n```\n\n这个错误信息并不直观，但它确实表明该解释器版本无法识别名为 `tkinter` 的模块。如果其他\
    \ Python 库安装出现问题，你可能会遇到不同的错误，这需要你单独进行调试。到目前为止，你已经安装了 Python 程序运行所需的基本库，包括用于机器学习算法的\
    \ `sklearn`。然而，为了让物联网通过 Raspberry Pi 3 B+ 和 Arduino Mega 4560 正常工作，你还需要从以下列表中安装高级库：\n\
    \n*   **gpiozero**：用于实现 Python 与 Raspberry Pi 3 B+ 上 GPIO 端口通信的主要库。\n*   **smtplib**：用于从基于\
    \ Raspbian Linux 的操作系统发送电子邮件警报。\n*   **pygame**：用于在 Python 程序中生成声音。\n*   **psutil（进程和系统工具）**：一个跨平台库，用于在\
    \ Python 中检索**正在运行的进程**和**系统利用率**（CPU、内存、磁盘、网络、传感器）的信息。\n*   **platform**：用于访问底层平台的数据，例如硬件、操作系统和解释器版本信息。\n\
    *   **time**：Python 定义了一个名为 `time` 的包，它允许你处理与时间及其转换和表示相关的各种操作，这些操作在你的应用程序中可用于通过物联网设备存储事件的时间戳。\n\
    \n`gpiozero` 是我在 Raspberry Pi 3 B+ 上使用的主要 Python 包，它已经过测试并成功运行在我客户的商业应用中，因此我推荐使用这个包与物联网设备进行通信。一个能够进行监控和警报，却无法实时通知相关人员应用程序有什么用呢？为此，你需要\
    \ `smtplib` Python 库。在 Raspberry Pi 3 B+ 上配置 SMTP 服务器超出了本书的范围，因此我不会涉及这部分内容。不过，一旦配置完成，使用第\
    \ 3 章中给出的 `machinemon` 应用程序发送电子邮件就很容易了。`psutil` 和 `platform` Python 包用于从 Raspberry\
    \ Pi 3 B+ 的底层硬件获取数据，例如 CPU 百分比、温度、内存、磁盘空间等。要创建一个成功的商业应用程序，你需要存储通过物联网设备进行监控期间发生的每个事件的时间戳，而\
    \ `time` Python 包正好可以派上用场。\n\n现在你已经了解了用于物联网的高级包，接下来请使用名为 `iotpypackagesinstall.run`\
    \ 的脚本和名为 `iotpypackages.run` 的测试来安装它们，分别如清单 5-8 和 5-9 所示。\n\n```\npi@raspberrypi:~/IoTBook/Chapter5\
    \ $ cat iotpypackages.run\npython -c \"import tkinter\" &> tkinter.out\npython\
    \ -c \"import gpiozero\" &> gpiozero.out\npython -c \"import smtplib\" &> smtplib.out\n\
    python -c \"import pygame\" &> pygame.out\npython -c \"import psutil\" &> psutil.out\n\
    python -c \"import platform\" &> platform.out\npython -c \"import time\" &> time.out\n\
    pi@raspberrypi:~/IoTBook/Chapter5 $ ls -l ∗.out\n-rw-r--r-- 1 pi pi   0 Aug 18\
    \ 00:51 gpiozero.out\n-rw-r--r-- 1 pi pi   0 Aug 18 00:51 platform.out\n-rw-r--r--\
    \ 1 pi pi   0 Aug 18 00:51 psutil.out\n-rw-r--r-- 1 pi pi   0 Aug 18 00:51 pygame.out\n\
    -rw-r--r-- 1 pi pi   0 Aug 18 00:51 smtplib.out\n-rw-r--r-- 1 pi pi   0 Aug 18\
    \ 00:51 time.out\n-rw-r--r-- 1 pi pi 111 Aug 18 00:51 tkinter.out\npi@raspberrypi:~/IoTBook/Chapter5\
    \ $\n清单 5-9\n脚本 iotpypackages.run 的输出\n```\n\n```\nsudo pip install gpiozero |\
    \ tee gpiozero.log\nsudo pip install pygame | tee  pygame.log\nsudo pip install\
    \ psutil | tee  psutil.log\npi@raspberrypi:~$ ./iotpypackagesinstall.run\nRequirement\
    \ already satisfied: gpiozero in /usr/lib/python2.7/dist-packages\nRequirement\
    \ already satisfied: pygame in /usr/lib/python2.7/dist-packages\nRequirement already\
    \ satisfied: psutil in /usr/lib/python2.7/dist-packages\n#使用脚本测试已安装的包\npi@raspberrypi:~/IoTBook/Chapter5\
    \ $ ./iotpypackages.run\n清单 5-8\n运行 iotpypackages.run Raspbian 脚本的代码\n```\n\n\
    从清单 5-9 中的测试脚本输出可以看出，除了 `tkinter.out` 之外，所有文件的大小都是 0 字节。因此，高级包已成功安装。如果你在这些 Python\
    \ 库安装过程中遇到任何问题，可以通过 [`www.pmauthor.com/raspbian/`](http://www.pmauthor.com/raspbian/)\
    \ 的技术论坛给我留言，我会尽力帮你解决疑问。\n\n到目前为止，你已经成功设置了 Raspberry Pi 3 B+ 以及 Python 及其所需的包，并通过本章和第\
    \ 3 章中的脚本对其进行了测试。现在，你必须安装 Arduino IDE 以与 Arduino Mega 4560 通信，并创建一个 SQLite3 数据库，以便你的物联网应用程序可以存储数据。安装\
    \ Arduino IDE 后，你需要使用串行电缆测试 Raspberry Pi 和 Arduino 之间的通信。在接下来的步骤中，你将了解将 Arduino\
    \ Mega 4560 硬件连接到 Raspberry Pi 3 B+ 的详细步骤。"
- fmt: '### Determining Bit Size


    Before you proceed to installing the Arduino IDE, you need to know whether your
    Raspberry Pi is 32-bit or 64-bit. For this, there are two useful commands that
    are given in Listing [5-10](#484167_1_En_5_Chapter.xhtml#PC11), which provide
    the bash bit version.


    ```

    > which bash

    /bin/bash

    > file /bin/bash

    /bin/bash: ELF 32-bit LSB executable, ARM, version 1 (SYSV) ...

    Listing 5-10

    Finding Out the Bit Version of Your Raspberry Pi

    ```


    My Raspberry Pi 3 B+ has a 32-bit `bash` executable. This is not a very definitive
    way of determining your bit version, but it is most unlikely that a 32-bit `bash`
    has been compiled on a 64-bit processor by the hardware manufacturer. Further,
    to confirm, you can use the `uname` command shown in Listing [5-11](#484167_1_En_5_Chapter.xhtml#PC12),
    which shows that I am running a Raspberry Pi Linux variant on an ARMv7 processor.


    ```

    pi@raspberrypi:~/$ uname -a

    Linux raspberrypi 4.14.98-v7+ #1200 SMP Tue Feb 12 20:27:48 GMT 2019 armv7l GNU/Linux

    Listing 5-11

    Command for Confirming the Processor Information

    ```


    Even this does not clearly say the width bit of the processor. It is important
    to know this information because you don’t want to install the wrong Arduino bit
    IDE and mess up your Raspbian installation. So you can use a program known as
    `lshw`, which you can install using the command shown in Listing [5-12](#484167_1_En_5_Chapter.xhtml#PC13).


    ```

    pi@raspberrypi:~/$ sudo apt-get install lshw

