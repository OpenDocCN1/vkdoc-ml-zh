    ```


    从代码中可以看出，它首先导入稍后将在程序中使用的 Python 库，例如 `pandas` 和 `SQLite3`。然后初始化与 `machinemon.db`
    数据库的连接，并为连接对象创建一个游标。这次，你没有使用查询字符串来创建查询，而是使用 pandas 对象 `pd` 及其下的函数 `read_sql_query()`，通过传递
    SQL 查询和 `conn` 对象，通过 SQLite3 驱动程序连接到你的数据库。使用代码 `df = pd.read_sql_query("select
    ∗ from machinedata;", conn)` 将 `machinemon.db` 数据库中的整个 `machinedata` 表传输到 pandas
    数据框 `df` 中。


    下一部分是探索性数据分析（EDA），你使用 `df.columns` 和 `df.size` 语句查看数据框 `df` 的大小和形状。在代码的下一部分，你使用
    `astype()` 函数将 `outage` 列转换为整数，因为它包含的值中，1 表示发生中断，0 表示未发生中断。`tempstatus` 列包含非数值（RED、GREEN
    和 YELLOW）；需要将它们映射为 0 表示绿色，1 表示橙色或黄色，2 表示红色。你需要这样做，因为 Python 中的机器学习库无法处理非数值，需要数值数据来进行计算。这种转换也称为创建虚拟变量，通过代码中的语句
    `df[''tempstatus''] = df[''tempstatus''].map({''RED'':2, ''ORANGE'':1, ''GREEN'':0})`
    实现。


    代码的下一部分是检查是否存在任何缺失值，但这里没有缺失值，因为你有自己的程序将值输入数据库，并且在此过程中没有人工干预。


    你使用 pandas 数据框对象 `df` 的 `df.describe()` 函数进行探索性数据分析。完成此操作后，你将查看变量之间的相关性，以检查是否存在任何强关系。确定之后，你将数据框划分为目标变量和特征变量。目标变量是你想要预测的内容。在你的案例中，它是中断（outage）。你想要预测中断并查看其发生时间。你将
    `outage` 从特征变量中删除，因为它是你的预测目标。


    现在你可以开始创建训练集和测试集。为此，你使用 sklearn 库中的 `train_test_split` 函数。你知道，你的预测目标 `outage`
    的值可以是 1 或 0。1 表示发生中断，0 表示未发生中断。所以这是一个分类问题。你使用一个简单的分类算法：逻辑回归。你也可以使用其他算法，如朴素贝叶斯或支持向量机（SVM），来观察预测准确率是否会提高。


    你使用 `x_train` 和 `y_train` 数据集训练逻辑回归模型，然后使用 `x_test` 进行预测。预测结果存储在 `predictions`
    变量中。为了获得模型的准确率，你使用 `score()` 函数，并将 `x_test` 和 `y_test` 数据集输入其中。一旦知道预测的得分，你就可以使用预测结果来可视化混淆矩阵。这是通过语句
    `cm = metrics.confusion_matrix(y_test, predictions)` 完成的。接下来的几行代码初始化 `matplotlib`
    对象，并通过将 `cm`（混淆矩阵）对象输入其中来创建图形热力图。你将在本节中看到两个图形可视化：第一个是准确率得分，第二个是输入到 `plt.title()`
    函数中的混淆矩阵。最后，`plt.show()` 将两个图形显示在屏幕上。如果你在 Raspbian 命令行窗口中运行此代码，它将自动在桌面上弹出一个包含两个图形的窗口，看起来非常像图
    3-26 和图 3-27。


    ![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig27_HTML.jpg](img/484167_1_En_3_Fig27_HTML.jpg)


    图 3-27


    混淆矩阵


