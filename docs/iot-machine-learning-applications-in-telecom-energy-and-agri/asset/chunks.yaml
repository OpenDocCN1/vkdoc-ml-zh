  trans: "\n## 安装 SQLite3 数据库\n\nSQLite3 是一款免费数据库，你可以轻松地使用它在应用程序中创建和使用数据库进行存储。虽然 SQLite3\
    \ 并非功能完备的数据库，但它支持大部分 SQL 标准，非常适合需要简单数据库引擎嵌入应用的开发场景。SQLite3 在智能手机开发者中非常流行。树莓派的环境也是一种移动环境，我们可以将其带到现场、工厂、农田或移动基站附近，通过物联网传感器收集数据，并存储在这个紧凑而稳健的数据库中。请记住，你不能将此数据库用于需要高级安全功能（如内置用户管理）的应用程序。因此，请在没有此类安全需求的场景下使用它。你可以在\
    \ Raspbian 上配置 PostgreSQL 或任何其他 Linux 数据库（如 MySQL），但这超出了本书的范围，因为我们只开发概念验证级别的代码。\n\
    \n使用以下脚本在 Raspbian 操作系统上安装 Sqlite3：\n\n```\nsudo apt-get update\nsudo apt-get\
    \ upgrade\nsudo apt-get install sqlite3\nsqlite3 \nSQLite version 3.8.7.1 2014-10-29\
    \ 13:59:56\nEnter \".help\" for usage hints.\nsqlite>\n```\n\n你也可以按照我之前展示的 Arduino\
    \ IDE 图形界面安装方式，从 SQLite 组织的官方网站 [`www.sqlite.org/download.html`](http://www.sqlite.org/download.html)\
    \ 安装 SQLite3。\n\n现在，你已经到了在 Arduino 上安装 Modbus 接口设备（单相电表）的最后一步。\n\n免责声明\n\n在继续之前，我想提醒你使用此\
    \ Modbus 设备所涉及的风险。电能表是一种电器设备，如果连接不当，存在短路风险。如果未按照其使用说明书操作，也可能危及人身安全。如果连接错误，还可能烧毁并损坏你的树莓派和\
    \ Arduino 板。因此，如果你对电气连接不熟悉，我强烈建议你不要使用此设备，或者请当地电气技术人员提供专业帮助进行正确连接。无论是作者还是出版商，均不对任何形式的物质或人身损害承担责任。请用户自行审慎判断。\n\
    \n你将用于设置电能表的其他设备如图 5-21 至 5-23 所示：\n\n![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig23_HTML.jpg](img/484167_1_En_5_Fig23_HTML.jpg)\n\
    \n图 5-23\n\n已连接的 5V Modbus 转换模块\n\n![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig22_HTML.jpg](img/484167_1_En_5_Fig22_HTML.jpg)\n\
    \n图 5-22\n\n用于 Arduino 的 5V RS485 转 TTL 信号双向转换模块\n\n1.  用于 Arduino 的 5V RS485\
    \ 转 TTL 信号双向转换模块，带过压保护和信号指示灯\n\n![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig21_HTML.jpg](img/484167_1_En_5_Fig21_HTML.jpg)\n\
    \n图 5-21\n\nConzerv EM6400 电能表\n\n1.  施耐德电气 Conzerv EM6400 系列电力仪表\n\n现在，让我们连接\
    \ Arduino Mega 256 和 5V RS485 Modbus 转换模块之间的导线。我已经展示了连接到 Arduino Mega 2560 上 Modbus\
    \ 转换模块的导线。\n\n为了将 Modbus 转换模块连接到 Arduino，你首先需要了解 Arduino Mega 2560 PCB 的布局，如图\
    \ 5-24 所示。请注意，图中上方的引脚涉及通信和 GPIO 引脚。电路板的右侧有数据引脚，底部有电源和模拟引脚。这块板与 Arduino Uno 板有很大不同，因为它用于控制多个从设备，并用于工业应用。这就是\
    \ PCB 布局中有这么多数据引脚的原因。\n\n现在，将 Modbus 转换模块连接到 Arduino Mega 板。你需要将三个引脚连接到板的电源区域，该区域靠近图\
    \ 5-24 布局图左下角的电源控制器。最左边的深蓝色引脚连接到标有 5V 的引脚。下一根绿色导线连接到紧邻的标有 GND 的引脚。忽略图 5-24 左侧的黄色导线；你的设置中不需要它。你可以在图\
    \ 5-24 中看到——连接到 Arduino Mega 板电源部分的三个引脚。请记住，你需要的是公头杜邦线，因为 Arduino Mega 板只有孔，而没有像树莓派\
    \ GPIO 那样的引脚。\n\n![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig24_HTML.jpg](img/484167_1_En_5_Fig24_HTML.jpg)\n\
    \n图 5-24\n\nModbus 转换模块与 Arduino Mega 板的导线连接\n\n另一端的导线必须是母头杜邦线，因为 Modbus 转换模块有引脚可以插入导线。因此，你需要两根公对母杜邦线来进行此连接。将这两根导线的另一端连接到\
    \ Modbus 转换模块上标有 VCC 和 GND 的引脚（VCC 是 5V 电源线，GND 是电路接地）。你可以参考图 5-25。\n\n![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig25_HTML.jpg](img/484167_1_En_5_Fig25_HTML.jpg)\n\
    \n图 5-25\n\nModbus 转换模块的电源和接地连接\n\n连接到 Arduino 上的 5V 深蓝色导线连接到 Modbus 转换模块上标有 VCC\
    \ 的引脚。Arduino 板上的 GND 绿色导线引脚连接到 Modbus 转换模块 PCB 上的 GND。\n\n现在，你的 Modbus 转换模块的一部分已连接到\
    \ Arduino 板。你需要将另一端连接到 Arduino 板的 GPIO 引脚部分或通信侧，总共四个引脚。见图 5-26。在 Arduino 板上\n\n\
    ![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig26_HTML.jpg](img/484167_1_En_5_Fig26_HTML.jpg)\n\
    \n图 5-26\n\n连接到 Arduino Mega 板的 PWM 和通信侧\n\n如你所见，板左侧有两个名为 PWM 的引脚，连接到编号为 3 和 2\
    \ 的引脚，它们彼此相邻。接下来的两个引脚连接到通信引脚 18 和 19，在 Arduino Mega 板上分别标记为 TX1 和 RX1。完成此连接后，你需要按以下方式连接四个引脚的另一端。在\
    \ Arduino 板上连接到 PWM 引脚 3 的引脚 1，需要连接到 Modbus 转换模块上标有 DE 的引脚。在 Arduino 板上连接到 PWM\
    \ 引脚 2 的引脚 2，需要连接到 Modbus 转换模块中间标有 RE 的引脚。类似地，在图 5-27 中，在 Arduino 板上连接到引脚 18 的引脚\
    \ 3，需要连接到 Modbus 转换模块上标有 DI 的引脚。在 Arduino 板上连接到引脚 19 的第四个引脚，应连接到 Modbus 转换模块上标有\
    \ RO 的引脚。至此，Modbus 转换模块到 Arduino Mega 板的接线过程完成。你可以对照图 5-27 检查你的连接。\n\n![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig27_HTML.jpg](img/484167_1_En_5_Fig27_HTML.jpg)\n\
    \n图 5-27\n\nModbus 转换模块通信和 PWM 引脚的接线\n"
- fmt: 'Now you are ready for the next step: to connect your Arduino module to the
    Raspberry Pi board. For this, you need to connect a serial USB wire from the serial
    USB port of the Raspberry Pi 3 B+ board to the Arduino Mega 2560 board. The wire
    is shown in Figure [5-28](#484167_1_En_5_Chapter.xhtml#Fig28) for clarity.


    ![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig28_HTML.jpg](images/484167_1_En_5_Chapter/484167_1_En_5_Fig28_HTML.jpg)


    Figure 5-28


    USB serial cable to connect the Arduino Mega 2560 with the Raspberry Pi 3 B+


    Now you are finally ready to power on your complete system. The Arduino does not
    need a separate power cable, although it has a slot for it on the board. The serial
    cable powers on the Arduino Board because it is a slave of the Raspberry Pi 3
    B+ board. When you power on the Raspberry Pi 3 B+, you should see LED lights on
    the Modbus Conversion Module and the Arduino Mega 2560 board. This signals preliminarily
    that your connections are successful. This can be seen in Figure [5-29](#484167_1_En_5_Chapter.xhtml#Fig29).


    ![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig29_HTML.jpg](images/484167_1_En_5_Chapter/484167_1_En_5_Fig29_HTML.jpg)


    Figure 5-29


    Final power on


    If the board or the module does not light up, you should check your connections
    again, especially the ones supplying power to the module or the Arduino board.
    Now go ahead and run the Arduino Hello world program from Chapter [3](#484167_1_En_3_Chapter.xhtml)
    to confirm the serial communication between the Arduino Mega slave and Raspberry
    Pi 3 B+ master.


    ## Summary


    This chapter was about preparing your setup for the case studies implementation.
    You are now fully configured by setting up the Raspbian OS on the Raspberry Pi
    3 Model B+ and downloading it from the [`www.raspberrypi.org`](http://www.raspberrypi.org)
    download options. You used the microSD card and microSD card adapter to get the
    OS. Then you used the Win32 Disk Manager to unpack and extract the package. After
    this, you used the HDMI-to-HDMI cable in order to connect the Raspberry Pi to
    a TV monitor. You used USB dongles to connect a keyboard and mouse to the SBC.
    After this, you connected the Raspberry Pi 3 B+ power cord to a power bank so
    that its power connection would be failproof in case of a power outage.


    You then installed Python and tested it on Raspbian. Next you installed and verified
    the Thonny Python IDE. You then ran a Raspbian command line script to install
    the required Python packages.


    You ran a script to test the installation of the Python advanced packages and
    to check for errors. You installed the `tkinter` package on Python for a GUI implementation
    and then successfully executed `tkinter` on the Python 3.x interpreter. After
    this, you ran the `iotpypackages.run` Raspbian script to install the IoT Python
    packages on Raspbian.


    After this, you finished installing the Arduino IDE by running the `install.sh`
    file. You installed a SQLite3 database for storing data from IoT sensors. After
    this, you installed the Modbus interface device, the single phase meter, onto
    the Arduino. You configured and connected the three devices, the Schneider Electric
    Conzerv EM6400 Series Power Meter, the 5V RS485 to TTL Signal Mutual Conversion
    Module for Arduino Overvoltage Protection with Signal Indicator, and the 5V Modbus
    Converter Module. After this, you made the Modbus converter wire connections to
    the Arduino Mega board and connections to the PWM and communications side of the
    Arduino Mega board. You wired the Modbus Conversion Module communication and PWM
    pins through the USB serial cable to connect the Arduino Mega 2560 with Raspberry
    Pi 3 B+. After this, you performed the final power on for your complete system.


    With this you come to the end of setting up your system, including the hardware
    and software. You can now proceed with the case studies.


    # 6. Configuring the Energy Meter


    In a continuation to Chapter [5](#484167_1_En_5_Chapter.xhtml) where you left
    off by connecting the three-phase Conzerv EM6400 Energy Meter from Schnieder Electric,
    in this chapter you will do two things. First, you’ll write up the code for getting
    data from the EM6400 Energy Meter on the Arduino Mega slave and then reading it
    into Python on the Raspberry Pi master. The second is to set up another energy
    meter using single phase electrical connections and then read its data directly
    into Raspberry Pi via the USB serial Modbus protocol. The second setup is to enable
    those enthusiasts of the IIoT who want to get the feel of how real-life data is
    generated by industrial devices such as energy meters and machines. In the real
    world, however, you will see three-phase energy meters and machines like EM6400
    communicating through the Modbus protocol. Again, I want to remind the readers
    that we are using the Arduino Mega 2560 because it is a truly industrial grade
    SBC that supports connecting multiple devices like energy meters or industrial
    machines connected to each other serially or in a daisy wheel electrical configuration.
    If you have just a single device, regardless of single phase, two phase, or three
    phase, you can connect it directly to a Raspberry Pi 3B+ like I show you in this
    chapter. So let’s get started writing the code to get data from the EM6400 Energy
    Meter on the Arduino. The code for this is available in the file named `modbus01_EM6400_Tested.ino`
    code bundle that you can download from [`www.PMAuthor.com/raspbian/`](http://www.pmauthor.com/raspbian/).
    Remember to open it up in the Arduino IDE and configure and test the Arduino IDE
    like I showed you in Chapter [3](#484167_1_En_3_Chapter.xhtml) before executing
    the code.'
