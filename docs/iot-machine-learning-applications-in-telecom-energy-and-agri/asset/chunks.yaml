    second one being the confusion matrix that is input into the `plt.title()` function.
    Lastly, `plt.show()` puts both graphs on the screen. If you run this code in a
    Raspbian command line window, it will automatically pop up a window with both
    graphs on the desktop, which will look very much like Figures [3-26](#484167_1_En_3_Chapter.xhtml#Fig26)
    and [3-27](#484167_1_En_3_Chapter.xhtml#Fig27).


