    Before we move on to the topic of microcontrollers in the next section, let’s
    look at a very important aspect of the Raspberry Pi architecture, which is the
    overlay of GPIO pins on the SBC board. These pins are used for communication with
    auxiliary hardware such as sensors or other microcontrollers that can do serial
    communication such as Arduino. Figure [1-1](#484167_1_En_1_Chapter.xhtml#Fig1)
    shows the GPIO overlay of Raspberry Pi 3 Model B+.


    ![../images/484167_1_En_1_Chapter/484167_1_En_1_Fig1_HTML.jpg](images/484167_1_En_1_Chapter/484167_1_En_1_Fig1_HTML.jpg)


    **Figure 1-1** GPIO pin overlay for Raspberry Pi 3 Model B+


    In Figure [1-1](#484167_1_En_1_Chapter.xhtml#Fig1), you can see that there are
    a total 40 GPIO pins. They have a structure and it is important that you understand
    it in order to use it. The pins are numbered from 1 to 40 in the diagram. Pin
    1 and 17 are for supplying power output to your device (3.5 volts). Pins 2 and
    4 are used for giving a power output of 5 volts each. Pins numbered 6, 9, 14,
    20, 25, 30, 34 and 39 are used for grounding the circuit. The rest of the pins
    are used for GPIO. You will be using this information later when you create a
    complete circuit for some IoT-based solutions.


    Let’s now discuss microcontrollers and how they are used.


    ## Single-Board Microcontrollers


    SBMs are microcontrollers built into a single circuit board; they are used in
    industrial and commercial applications to interface between industrial and commercial
    devices such as ones that use serial bus communication. They are used in applications
    to develop solutions requiring interfacing with industrial machines or network
    interfaces such as ones requiring Modbus communication protocol.


    Arduino is a very popular single-board microcontroller and is used by hobbyists
    and students to learn hardware implementations and how to control and build hobby
    machines that interface with common C and C++ programs. However, we are going
    to use Arduino for an industrial-grade purpose. Let’s compare three models from
    the Arduino line in order to select the best microcontroller for our purpose.


    Arduino Uno, Arduino Mega, and Arduino Mega 2560 are the three models we are going
    to use for our comparison. All three single-board microcontrollers use a 16MHz
    frequency processor. The printed circuit board dimensions of the Mega and Mega
    2560 are higher than the Arduino Uno, which is smaller than both of them by half
    in length at 2.7 inches x 2.1 inches to 4 inches x 2.1 inches. The Arduino Mega
    2560 has the highest flash memory of 256kb, whereas Arduino Uno has the lowest
    flash memory of 32kb. Arduino Mega has 128kb. Flash memory is very important as
    far as SBMs are concerned because whatever programs you write for controlling
    the hardware through your application has to be written to the flash memory first.
    If the flash memory is low, you cannot write an industrial-grade application on
    top of it. Both the Mega models have higher EEPROM and SRAM than the Arduino Uno;
    also, the Mega models have 54 GPIO pins while the Uno has just 14 pins. Why do
    we need more pins for our applications? We will be using our applications for
    communicating with serial Modbus communication interfaces which may need two or
    three devices connected at the same time. If the number of pins is less, we will
    be limited in having parallel devices. So we need higher pins for this purpose.


    So the best model for us is the Arduino Mega 2560, which has the highest flash
    memory.


    ### Arduino Mega 2560


    Figure [1-2](#484167_1_En_1_Chapter.xhtml#Fig2) shows the GPIO overlay of the
    Arduino Mega 2560 and its communication architecture.


    ![../images/484167_1_En_1_Chapter/484167_1_En_1_Fig2_HTML.jpg](images/484167_1_En_1_Chapter/484167_1_En_1_Fig2_HTML.jpg)


    **Figure 1-2** Arduino Mega 2560 architecture


    You can see the area marked as GPIO pins in the single-board computer diagram
    in Figure [1-2](#484167_1_En_1_Chapter.xhtml#Fig2). This model supports both digital
    pins and analog pins. Digital pins are used to control and communicate with devices
    such as digital sensors, and analog pins are used to communicate with analog devices
    such as analog sensors. This model has a USB interface, which is used for serial
    bus communication with another device such as a SBC like the Raspberry Pi. You
    will look at this in detail later in the part of the book on how to connect and
    communicate between the Raspberry Pi and Arduino. Figure [1-3](#484167_1_En_1_Chapter.xhtml#Fig3)
    shows the overlay of GPIO pins on the Arduino Mega 2560 board.


    ![../images/484167_1_En_1_Chapter/484167_1_En_1_Fig3_HTML.jpg](images/484167_1_En_1_Chapter/484167_1_En_1_Fig3_HTML.jpg)


    **Figure 1-3** Arduino Mega 2560 GPIO pins overlay


    As you can see in the figure, the pin numbers starting from D mean digital pins;
    these are the slots where you will connect digital sensors and devices. The pins
    starting from A are analog pins and can be used to communicate with analog devices.
    For now, this is what you need to understand. You will look at all of this in
    detail once you start to assemble your system.'
