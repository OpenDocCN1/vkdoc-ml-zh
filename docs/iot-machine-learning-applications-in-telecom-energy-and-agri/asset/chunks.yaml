    清单 6-10

    从电能表获取数据并存储到数据库的 Python 代码

    ```


    在这段代码中，首先导入 minimalmodbus Python 库，以实现树莓派与电能表之间的 Modbus 通信。然后导入 datetime，用于在从电能表获取一条数据记录时存储时间戳。其用法在代码后面会体现。之后，通过
    Rs485 Modbus USB 转换器初始化 Modbus 仪器，该转换器在 Raspbian 设备列表中显示为 `/dev/tty/USB0`。这是默认设备，在大多数情况下应该可以正常工作；但是，如果遇到任何通信错误，请使用命令
    `lsusb` 检查你的 485 转换器连接到了哪个 tty 端口。接下来，以 9600 的波特率初始化串口通信。这是默认值；如果你更改了电能表中的波特率，则需要在此处将代码语句
    `sdm630.serial.baudrate = 9600` 中的值改为新值。你为寄存器初始化了 8 位字节大小，以及其他设置参数，如停止位和超时间隔。`print(sdm630)`
    会将对象打印到 Raspbian 的控制台，因此你应该能通过这条打印语句看到所有的连接设置配置。之后，你的电能表设置就完成了，现在你可以与其通信并从中获取数据。为此，在接下来的代码中，你使用一个无限
    `while` 循环来持续获取数据并打印到屏幕上，最后将其存储到 SQLite 3 数据库中。这段代码与 Conzerv EM6400 电能表的代码非常相似，因此我不再深入探讨。但需要注意的一点是，你从电能表获取了总共
    15 个值，包括其电压、电流、有功功率和无功功率，直至当前发电量。运行程序后，你应该会看到类似于图 6-24 的输出。


    ![../images/484167_1_En_6_Chapter/484167_1_En_6_Fig24_HTML.jpg](img/484167_1_En_6_Fig24_HTML.jpg)


    图 6-24


    程序 sdm630_tested.py 的输出


    用于将数据存储到 SQLite3 数据库的 `insert into` 语句的输出会进入一个名为 `sdm630data` 的表中。表创建脚本位于文件 `sdm630_db_creation_script.sql`
    中，该文件随你从 [www.​pmauthor.​com/​raspbian/​](https://www.pmauthor.com/raspbian/)
    下载的压缩包一起提供。


    ## 总结


    至此，我们完成了电能表的设置、配置以及将数据获取到数据库系统的全部工作。到目前为止，你已经成功下载了用于设置电能表设备的脚本。你通过使用 Arduino IDE
    中的 Modbus 库为 EM6400 电能表编写了代码。你还通过编写一个简单的“Hello World”程序，学习并实现了 Arduino Mega 2560
    与 Conzerv EM6400 电能表之间的通信前与通信后操作。然后，你编写了代码，通过其寄存器从电能表获取数据值。之后，你配置了另一款更常见的 Eastron
    SDM630 电能表。你将其硬件连接好，然后加载了树莓派与 SDM360 电能表之间进行 Modbus 通信所需的 Python 库。最后，你编写了一个 Python
    程序，用于从电能表获取电压、电流和功率等数据，并将其存储到 SQLite3 数据库中。


    接下来，你将研究一些案例，并设计一些有趣的物联网和工业物联网解决方案。

    '
- fmt: '# 7. Telecom Industry Case Study: Solving the Problem of Call Drops with the
    IoT


    This case study is based on a fictitious nation state with a fictitious company
    and a fictitious scenario. However, what you will gain through this case study
    is a near-to-real problem of call drops, which most telecommunication companies
    grapple with. The case study takes you through the formation of a telecom operator,
    giving you enough background of its business establishment. The case study gives
    you a common political and business background and the socio-political stakes
    which are relatively uniform, so a specific country is not important for that.
    The reason for including the background of the political and business side in
    this case study is to make the machine learning engineer in you realize how important
    the decisions become based on the models for predictions that you build and how
    they can have a significant impact on the business and society at large. Let’s
    get into the case study now.


    ## Telecom Case Study Overview


    `Regoniatel` started operations in 2016 as a 2G telecommunications operator in
    Regonia, a country surrounded by mountains on three sides.


    The CEO is Kaun Methi John. He has other businesses, such as mining and refineries,
    through which he has become rich. He’s established an empire in this small European
    country.


    When Regonia adaptation the new 2G technology for mobile phone operations, the
    government called for proposals from interested businesses. John understood this
    was a golden opportunity for him to expand and get into this business of telecommunications,
    which was going to boom in the future. Since he did not have the technical expertise
    to set up a telecom infrastructure in his country, he actively looked for partners
    around the globe to help him achieve success in this new venture. He found `Samtel`,
    a USA-based company that was in setting up a joint venture with other companies.


    Once the project plans and the feasibility study were carried out, the joint partners
    created a proposal for the 2G spectrum for the government. The bid was awarded
    to them and three other companies. They succeeded in getting the government contract;
    however, there was going to be stiff competition for setting up the telecom network
    and then getting customers onboard the network. The other three companies were
    also set up as joint ventures between local companies and international telecom
    companies. The government thought it wise to award contracts to such joint ventures,
    hoping the international experience could be taken advantage of.


    The government carried out many months of testing of the 2G network in the country
    to determine its feasibility. Once this was done successfully by the internal
    telecom agency, the door was open for businesses to start their operations.


    The booming 1 trillion economy of the country demanded an upgrade in the communication
    infrastructure. The primary occupations in the country were farming and mining.
    The country was surrounded by land on all four sides; it did not have a seacoast.
    There was a lot of interest in the gold and diamond mines this country was blessed
    to have, and they were big revenue earners. The average income of a miner working
    in the gold or diamond mines was $6,000 per annum. The reason for the higher wages
    was that these mines produced some of the best gold and diamonds. Diamonds from
    this country were in demand and sought the world over. Mining contributed almost
    50% to the GDP of Regonia.


    The growing needs of this country required a good telecom infrastructure to provide
    a robust communication system for its citizens. This small nation could afford
    the best infrastructure in the world.


    `Regoniatel` was able to set up good infrastructure in the urban areas in the
    three years after it was awarded the spectrum contract. Its rivals, `Ytel` and
    `Fretel`, also set up mobile towers in urban areas and rural areas. The problem
    for `Sautele` after four years of developing an office infrastructure was that
    it had become largely an urban-oriented company.


    The government set up a telecom watchdog to publish data from consumer interactions
    like customer complaints and network glitches for telecom subscribers across all
    companies.


    In its 2019 report, it highlighted a 35% jump in call drops across all operators.
    The magnanimity of the problem reached such a level that the ruling and opposition
    parties started mud-slinging matches on how the telecom regulator and the government
    administration were shielding the telecom operators. The Prime Minister called
    an urgent meeting with the heads of the three companies in order to discuss the
    problem and its possible solutions. `Sautele` received the following report about
    its call drop complaints, which are given Table [7-1](#484167_1_En_7_Chapter.xhtml#Tab1).'
