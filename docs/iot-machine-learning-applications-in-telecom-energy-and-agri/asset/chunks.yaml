    虽然你看到的是一大段代码，但其真正目的是向你展示如何构建一个基于 Python 的实用物联网应用程序。你进行的唯一模拟是：并非从实际的物联网传感器获取数据，而是从树莓派内置的硬件物联网传感器中获取数据。温度和百分比值的概念适用于工业设备，例如热交换器或锅炉，这些设备同时包含温度值、百分比值以及一些绝对值。电气设备则有从频率到电压的各种数值。所有这些构成了你将在案例研究示例中使用的数据，因为在这些示例中，数据将来自连接到树莓派和
    Arduino 的实际物联网传感器。


    代码首先初始化并导入所需的 Python 库，例如来自`gpiozero`库的`CPUTemperature`。这个库将用于获取树莓派的内部温度。你还导入了`datetime`库以获取数据生成的时间和日期，`pandas`数据框用于临时存储数据，以及导入的`LED`用于通过点亮相应的
    LED 来显示绿色、橙色或红色状态。例如，如果 CPU 温度低于 55 摄氏度，绿色 LED 将点亮；如果树莓派的 CPU 温度高于 55 但低于 60 摄氏度，橙色
    LED 将点亮；如果温度高于 60 摄氏度，红色 LED 将点亮。这正是你在测量外部温度值时，使用物联网传感器实现预警系统的方式。之后，你导入了`pygame`，以确保当温度超过
    60 摄氏度时，树莓派扬声器会发出声音。这对你的单板计算机来说是一个关键系统，如果不采取措施，系统过一段时间后会挂起，甚至主板或其组件也可能烧毁。试着想象一下，在一个物联网环境中，你希望实现这样一个关键的警报系统。`pygame`库通过`init()`函数进行初始化，在下一行中，它将`example.mp3`（一个尖锐的警报声）加载到内存中。它不会播放，因为你还没有发出命令；它只是被加载到了内存中。


    在代码的下一部分，你初始化了将根据 CPU 温度点亮的 LED。红色 LED 连接 GPIO 引脚 18，绿色 LED 连接 GPIO 引脚 22，黄色 LED
    连接 GPIO 引脚 17。请确保树莓派上的 LED 已连接到图 3-15 中给出的正确引脚编号。


    现在，预警系统包括针对红色温度的声音警报以及使用 LED 针对 CPU 温度的视觉警报。在实际应用中，你将需要这些警报系统以及其他系统，例如短信或电子邮件警报，为此你可能需要在树莓派上配置邮件和短信网关服务器。我们不会这样做，因为我们正在进行概念验证级别的代码，这超出了本书的范围。'
- fmt: 'Now you need to initialize the `LDR`, or light sensor module, at pin number
    25, which you did in an earlier section of this chapter. After this, you initialize
    the pandas dataframe to store data in memory. The reason you are using pandas
    is that it gives a structure to the data and allows to you manipulate and analyze
    it as per need in Python. Next is the infinite `while` loop in which first you
    get the CPU temperature using `cpu.temperature` and store it in a variable. The
    next step is to check the value of the temperature. If it is greater than 60,
    an alert is displayed on the screen saying “RED ALERT CPU EXCEEDING HIGH TEMPERATURE”
    followed by the red LED being turned on in the program using the `redled.on()`
    function. When this event happens, the other LEDs (green and yellow) should be
    turned off so you use the `off()` function for these LED objects so that there
    is no confusion as to the status of the CPU temperature. You do not want all of
    the LEDs to glow; only the red LED should glow at this time to show the critical
    status. The pygame is used to play an alerting sound from the Raspberry Pi speaker
    using the `pygame.mixer.music.play()` function. Similarly, there are two other
    conditions. The next is when the temperature value of the CPU lies between 55
    and 60 degrees; the status is displayed on the screen as “YELLOW ALERT CPU NEARING
    HIGH-TEMPERATURE THRESHOLD” and the yellow LED is turned on using the `on()` function
    and the red and green LEDs are turned off using their respective `off()` functions.
    There is no sound played because this is not a critical situation; the sound plays
    only when the temperature reaches a critical limit of 60 degrees. You may wonder
    how I came up with this number of 60 degrees Celsius. I simply referred to the
    Raspberry Pi manual, which came with it, and it mentions a range of 30 to 60 degrees
    Celsius. The next is the green status where the CPU is safe and does not need
    any alerting, but for someone watching the screen, a message of “TEMPERATURE IS
    NORMAL” is displayed. The green LED is turned on using its `on()` function and
    the yellow and red LEDs are turned off using their respective `off()` functions.
    Once you have this status of the CPU system in the variable `tempstatus`, you
    need to store it in a pandas dataframe and this is done by storing the date and
    time using the `datetime now()` function in the `df[''date'']` and `df[''time'']`
    columns. `df[''temperature'']` stores the temperature from the `tem` variable.
    The `df[''tempstatus'']` column stores the value that you get after going through
    the `if` condition for the `tempstatus` variable of “GREEN,” “RED,” or “YELLOW.”


    Now you need to prepare to write the data into the SQLite3 database, which is
    done in the import statement `import SQLite3`. Then you initialize the connection
    object to the `machinemon.db` database. A `curr` cursor object is created after
    this to help parse the table if needed. Before you can write to the dataframe,
    it has empty values for some of the columns like `cpu_percent`, `memory_percent`,
    `disk_percent`, and `LDR value`. The `cpu_percent` variable is used for storing
    the CPU percentage value, the `memory_percent` variable is used for storing the
    memory percentage value, `disk_percent` is used for storing the disk percentage
    value, and the `ldrval` variable is used for storing the LDR module value of day
    or night.


    Next, you have all the data to write to the database table so now you construct
    an `insert into` statement similar to what you did in the code in Figure 3-33
    using the `datetime now()` function for date and time, and appending the values
    of the rest of the columns like `temperature`, `cpu_percent`, `disk_percent`,
    `tempstatus`, `memory_percent`, and `ldrval` variables, which you got from Raspberry
    Pi earlier using the psutil library. Using the `curr` cursor object, which you
    created out of the SQLite3 library, the query string containing the `insert into`
    statement is executed using the `execute()` function. To count the number of records
    that have been inserted into the `machinedata` table, you use a counter variable
    that is incremented at the end of the `while` loop as well. Listing [3-10](#484167_1_En_3_Chapter.xhtml#PC12)
