  trans: '

    ## 物联网的商业用途


    现在，让我们来看看市场上一些运行良好的成功物联网应用。


    teknowlogy 在 2019 年进行了一项调查（[`www.device-insight.com/wp-content/uploads/2019/03/the_iot_survey_2019_highlights_device_insight.pdf`](http://www.device-insight.com/wp-content/uploads/2019/03/the_iot_survey_2019_highlights_device_insight.pdf)），该调查基于用户评价矩阵、有效性、效率、商业价值、解决方案时间线、可视化、对新概念的支持、创新性、定价模式、产品满意度、合作伙伴生态系统、性能满意度、灵活性、易用性和客户体验等参数，对物联网供应商进行了评估。所涵盖的公司均为中型企业，这也是物联网主要实施发生的地方。我挑选了最佳参数——客户体验，并将讨论这些高分公司提供的解决方案。选择这个参数的原因是，即使你拥有根据其他参数（如创新性和可视化）来看最好的产品，但如果客户不满意，你无法长期维持该产品。表
    2-2 展示了目前已在商业上使用的、拥有出色物联网解决方案的三家公司。


    **表 2-2**


    **2019 年三大解决方案**


    | 公司 | 最佳解决方案 | 应用 |

    | --- | --- | --- |

    | C3 IoT | C3 AI Appliance | 由英特尔驱动的 C3 AI Appliance™ 适用于那些需要在满足严格的数据治理、合规性和安全要求的同时，部署人工智能（AI）应用以分析海量数据的组织。[`https://c3.ai/products/ai-appliance/`](https://c3.ai/products/ai-appliance/)
    |

    | Siemens IoT EMEA | MindSphere | MindSphere 是西门子推出的基于云的物联网开放操作系统。它连接您的产品、工厂、系统和机器，使您能够利用高级分析来驾驭您的数据财富。此外，它还让您能够访问越来越多的应用和一个动态的开发平台即服务（PaaS）。MindSphere
    兼容所有主流网页浏览器。[`https://siemens.mindsphere.io/en`](https://siemens.mindsphere.io/en)
    |

    | ARM Mbed | Mbed OS 5 | Mbed OS 是面向物联网的领先开源 RTOS，可加速基于 Arm 处理器的物联网设备的创建和部署。使用
    Mbed OS，您可以通过免费的在线 IDE 用 C++ 开发物联网软件，使用 Arm C/C++ 编译器生成优化代码，并在数百个硬件平台上运行。Mbed
    OS 堆栈包括 TLS、网络、存储和驱动程序，并通过数千个代码示例和库得到增强。[`https://os.mbed.com/`](https://os.mbed.com/)
    |


    我在此挑选展示的三个解决方案在商业上运行良好。根据调查，排名第一的解决方案是 C3 AI Appliance。运行在不同服务器上的设备非常难以开发，而要满足所有客户期望则更加困难。鉴于这是一个基于
    AI 平台、运行在英特尔服务器上的设备，它能够分析海量数据，同时满足数据治理、合规性和安全协议，其客户体验如此之高令人惊叹。网站上的客户评价非常积极，因此它在调查中占据榜首也就不足为奇了。


    调查中选出的下一个产品来自西门子（[`https://new.siemens.com/global/en/products/software/mindsphere.html`](https://new.siemens.com/global/en/products/software/mindsphere.html)）。它是一个基于云的物联网开放操作系统，连接产品、工厂、系统和机器，并让客户能够通过高级分析来驾驭数据。这是平台即服务（PaaS）实施的一个绝佳范例。它被称为
    MindSphere。为了使这款产品同样出色，鉴于它是一个平台即服务，MindSphere 确实可以在所有主流网页浏览器上运行，例如 Chrome、Mozilla
    和 Firefox 等。


    第三个产品来自 ARM Mbed（[`https://os.mbed.com/`](https://os.mbed.com/)），它为物联网创建了一个开源
    RTOS 操作系统，加速了基于 Arm 处理器的物联网设备的创建和部署。该操作系统使用的主要开发语言是 C 和 C++。它可以在数百个硬件平台上运行，例如
    Raspberry Pi，并且拥有一个非常活跃的社区。该平台拥有各种驱动程序和库中的代码示例，可用于快速实现所有三项功能，使它们相互竞争，尤其是与西门子的
    MindSphere 物联网操作系统竞争，因为它们是提供整体解决方案的核心。C3 AI Appliance 通过其托管在私有云上的能力，将操作系统的概念进一步延伸；这个解决方案对于那些希望完全控制其物联网解决方案的公司来说是一大福音。对于寻求开源解决方案的公司来说，西门子的
    MindSphere 解决方案可以在硬件平台上运行，并专门使用 C 和 C++ 代码来开发软件解决方案。


    你已经看到了三家不同的公司和三种不同的解决方案，而最棒的部分是，它们都通过卓越的体验让客户感到满意。

    '
- fmt: '# IoT Trends for the Future


    It is important to look at the top trends that are emerging in the field of IoT
    in order to get a holistic picture about it. A lot of surveys and prediction of
    all the IoT trends for the year 2019 have been done. According to ZDNet story
    on 2019 IoT trends by Eileen Brown (`www.zdnet.com/article/whats-next-for-2019-iot-trends-and-predictions/`)
    a Northstar survey of global consumers showed that intelligent homes will become
    mainstream and the next hot thing will be interdelivery options to consumers that
    will be delivered through smartphones and GPS positioning data. It also predicted
    better quality in healthcare due to the deployment of connected sensors in hospitals
    to ensure that the time to find critical medical equipment is reduced. The survey
    also talked about the function of smart cities by delivery cost reduction benefits
    in terms of better waste management and citizen engagement for revenue stream
    opportunities and energy efficient buildings. This has been in the mainstream
    now with cities like Singapore, which has already shown that a smart building
    can reuse its waste including water and garbage resources to be self-sufficient.


    A survey by GoodWorkLabs on the IoT, published in February 2019 (`www.goodworklabs.com/iot-trends-2019/`),
    talked about edge computing, which is distributed computing performed on distributed
    smart edge devices instead of in a centralized environment for indoor areas or
    industries where there is no requirement for a centralized network for processing.
    The survey lists as an important item security for IoT devices and notes the efforts
    taken by hardware manufacturers like Siemens and GE, which are making smart devices
    that focus on the endpoint security of the user. The survey also talks about its
    application in the healthcare and manufacturing industries. The smart beacon RFID
    tags are part of the new industrial revolution that is going to take place on
    devices by 2020. The governance of consumer IoT industry is also pointed out to
    be a trend that will advance the development of smart homes. Another major development
    is that large players in the consumer industry are coming together to form subscription
    offerings. This will happen in the areas of utilities, food companies, and service
    aggregators. There are talks about the growing market of connected smart cars
    which will be accessible through the smart apps on your mobile phones, which will
    show you real-time diagnostic information about your car using IoT technology.
    All the sensors residing within your car will give you data about your current
    location but also what is going in your car such as tire pressure. The survey
    welcomes the beginning of 5G in 2019, which will become the backbone of IoT technology
    by supporting the interconnectivity of IoT devices. The 5G network will allow
    smart devices to produce and send data in real time, which has not been imagined
    so far.


    The website `iotforall.com` (`www.iotforall.com/top-iot-trends-rule-2019/`) reports
    that 2019 will be about big data and artificial intelligence. The topmost forecast
    by Gartner says that there will be a rise of 14.2 billion IoT deployments. It
    talks about connected clouds. Many companies will rely on clouds to store data
    because cloud storage is connected to bandwidth. Accessing data is the reason
    for choosing different cloud services, such as the offerings by giants like Amazon
    AWS Cloud Platform, Microsoft Azure, and the Google Cloud platform. Today’s need
    is for these different clouds to speak to each other; this is known as connected
    clouds, such as the partnership formed by Oracle and Microsoft by connecting their
    cloud platform services. The survey also talks about connecting private and public
    cloud for any company for servicing their data storage needs. The survey also
    talks about edge computing, which is going to break through in 2019. The survey
    talks about digital twins, which are also known as hybrid or virtual prototyping
    businesses using special tools like AI and machine learning and IoT to improve
    their customer business experiences by streamlining their data operations. This
    survey highlights that 5G will be game-changing in the IoT market by bringing
    about revolutionary applications. One point mentioned by this survey is sensor
    innovation, although it does not talk about what type of sensors will be developed
    in the market, but it says that the new special purpose sensors will lead to efficient
    and effective use of power consumption using deep neural networks, leading to
    new age architectures and low power IoT and endpoint devices. The development
    of new algorithms using data from these sensor technologies will lead to new implementations
    in the domains where they are applied. The survey prediction for social IoT, which
    is giving rise to social anxiety and is going to transfer the business sector
    from consumer devices to large scale manufacturing, is like a warning for the
    IoT applications and solutions implementers in order to take social responsibility
    into considerations when building their products. The social aspect is highlighting
    the need for a human being to accept the current state of human beings in accepting
    IoT in their everyday life. Although the survey does not point to any specific
    issues, it says that as online gains acceptance, social, legal, and ethical issues
    will crop up.


    A survey by Network World covers the top 10 IoT trends for 2019 and beyond (`www.networkworld.com/article/3322517/a-critical-look-at-gartners-top-10-iot-trends.html`).
    The first trend is artificial intelligence, which is not a big surprise. The second
    one is social, legal, and ethical issues. Info Linux and data booking which river
    is commercializing of Information and making the data available agents and submergence
    on subscription or condition basis which this Gartner study reports. IV is shift
    phone edge intelligent mesh. The edge mesh defined as a network of connected edge
    devices true internet connect with cloud end-user devices together at a high level
    known as edge mesh. The study points to the fact that instead of having such devices
    working in silos, this will get them connected to intelligent machines and will
    create a network of networks of their own. The trend, as seen by Gartner, is that
    of IoT governance, covering the legal and social aspects and ethics involved in
    the implementation of IoT applications.


    The other oils like new user experiences and new Wireless Networking Technologies
    for IoT salwar significant thanks that the study mentions.'
