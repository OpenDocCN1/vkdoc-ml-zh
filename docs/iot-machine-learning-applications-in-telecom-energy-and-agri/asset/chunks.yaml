- fmt: '### Creating the Database Structure


    The output shows various results for the database, such as page size used in memory,
    text encoding, number of tables, number of indexes, number triggers, and number
    of views. You do not have any tables, views, triggers, or indexes since this is
    a vanilla database. You can verify this with the dot command `.tables`, which
    will show any tables if they exist, as shown in Figure [3-22](#484167_1_En_3_Chapter.xhtml#Fig22).
    It returned nothing, which means there are no tables in this database. So let’s
    create a table to store your small IoT sensor data with a date and time stamp,
    as shown in Listing [3-7](#484167_1_En_3_Chapter.xhtml#PC9).


    ```

    pi@raspberrypi:~/iot $ SQLite3 iotsensor.db

    SQLite version 3.16.2 2017-01-06 16:32:41

    Enter ".help" for usage hints.

    sqlite> .tables

    sqlite> create table ldrvalues(date date, time time, ldrvalue float);

    sqlite>

    Listing 3-7

    Code for Table Creation to Store LDR IoT Sensor Values

    ```


    You can see the result of this table creation in Figure [3-23](#484167_1_En_3_Chapter.xhtml#Fig23),
    which shows the output of the `.tables` command and that the table `ldrvalues`
    now exists.


    ![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig23_HTML.jpg](images/484167_1_En_3_Chapter/484167_1_En_3_Fig23_HTML.jpg)


    Figure 3-23


    Table creation in SQLite3 for storing IoT sensor data


    ### Inserting Data into the Database


    You now have a table structure named `ldrvalues` to store your IoT sensor data
    in a SQLite3 database named `iotsensor.db`. You can go ahead and update the Python
    program from Listing [3-2](#484167_1_En_3_Chapter.xhtml#PC4), which fetches data
    from the IoT sensor, to now write the values into this SQLite3 database. The program
    is shown in Listing [3-8](#484167_1_En_3_Chapter.xhtml#PC10).


    ```

    pi@raspberrypi:~/iot $ cat ldrdb.py

    #Light Dependant Resistor Module Initialization

    from gpiozero import LightSensor

    #importing Sqlite3 python library to connect with database

    import SQLite3

    from datetime import datetime

    #GPIO LDR Signal Pin initialization

    ldr = LightSensor(25)

    #Read value infinitely in a loop

    while True:

    print(ldr.value)

    ldval=float(ldr.value)

    if(ldval>0.0):

    print("It is Night time now")

    else:

    print("It is Day time")

    conn = SQLite3.connect(''iotsensor.db'')

    curr=conn.cursor()

    query="INSERT INTO ldrvalues(date,time,ldrvalue) VALUES(" +"''" + str(datetime.date(datetime.now()))
    + "''" +"," + "''" +                 str(datetime.time(datetime.now())) + "''"
    + "," + "''" + str(ldval) + "''" + ")"

    print(query)

    curr.execute(query)

    conn.commit()

    Listing 3-8

    Program to Store LDR Module IoT Sensor Data in a SQLite3 Database

    ```


    Notice the modifications to the code from Listing [3-2](#484167_1_En_3_Chapter.xhtml#PC4).
    You added import statements to the SQLite3 Python library; this is necessary to
    communicate with the SQLite3 database. You also imported the `datetime` library
    to get date and time so that you can enter it in the database when inserting the
    query. The `while(true):` loop didn’t change; you just added the database insertion
    code at the end of it. The `conn` object is used to connect to the `iotsensor.db`
    database, where you created a table named `ldrvalues`; refer to Figure [3-23](#484167_1_En_3_Chapter.xhtml#Fig23)
    for this. The cursor object inside the `while` loop initializes the cursor with
    the connection to the `iotsensor` database. The next statement is an `INSERT INTO...`
    statement which enters data into all the three columns: `date`, `time`, and `ldrvalue`.
    The value entered into `time` column is taken from the `datetime.now()` function,
    which returns the date and time together. Since you want the time and date separately,
    you first use `datetime.date()` and then in the second column, you use the `datetime.time()`
    function to get only the time value out of it. You separate the date and time
    instead of creating a single column because when you are doing EDA it becomes
    convenient if your date and time are in separate columns; it’s easier to find
    trends with date and time. Although you can do the same operation for taking out
    date and time from the column during EDA, you save yourself some cumbersome functions
    at the time of querying it. In a practical world, however, you may rarely find
    these two values of date and time separate and in the same column known as a timestamp.
    After the query is done, you use the `curr.execute(query)` to get the insert into
    the statement executed by the SQLite database engine. This is the stage when you
    are likely to get an error if you have a syntax problem in your query.


    ### Checking the Data for Sanity


    Based on the error messages that you get, you should try to resolve it. I ran
    the program for a few minutes and it inserted the LDR module IoT sensor data into
    the SQLite3 `iotsensor.db` database. You can see the result in Figure [3-24](#484167_1_En_3_Chapter.xhtml#Fig24).


    ![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig24_HTML.jpg](images/484167_1_En_3_Chapter/484167_1_En_3_Fig24_HTML.jpg)


    Figure 3-24


    Program execution result of `ldrdb.py`


    You can see that the program has inserted about 1316 rows in a few minutes. The
    structure of the table can be seen in the execution of the `pragma table_info(ldrvalues);`
    statement. The pragma statement has a function named `table_info` and takes the
    argument of the table name of the connected database. In your case, the connected
    database is `iotsensor.db` and the table is `ldrvalues`. It has three columns,
    which you can see as an output of the pragma statement. The first one is `date`,
    the second is `time`, and the third is `ldrvalue`. Their respective datatypes
    in the SQLite3 table are given beside each of them. After this, you run a query
    of `select count(∗) from ldrvalues` to get the count of total rows. Next, you
    look at the count of all the values in `ldrvalue` column which are not equal to
    `0.0`, which stands for day. Any value in this column shows darkness or night.
    You should understand through the demonstration of this simple program how the
    IoT sensor data can be stored in databases and used.


    Next, I am going to show you a full-fledged Python program that uses the internal
    Raspberry Pi CPU to measure its temperature and store it in a database. The program
    is going to simulate that it is measuring data from an industrial device or an
    IoT sensor and storing it in a database. After this, through a separate program,
    it is going to create a graph to display the data as you would do in a real-world
    IoT application. In the next section, you will apply and build a machine learning
    model. It is really going to be exciting when you get this data from the internal
    Raspberry Pi SBC board and then store it in a database for use in a machine learning
    model later. Let’s get started.


    The program for implementing machine learning is shown in Listing [3-9](#484167_1_En_3_Chapter.xhtml#PC11).'
