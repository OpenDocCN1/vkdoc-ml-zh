    are going to see their emergence.


    We have looked at money predictions the trains the field of IoT silent love and
    see what the common friend is within all of these. Summaries of these predictions
    and trends for IoT are shown in Table [2-3](#484167_1_En_2_Chapter.xhtml#Tab3).


    Table 2-3


    Common Predictions and Trends for IoT from 2019 Onwards


    | IoT Trend Area | Description |

    | --- | --- |

    | Smart homes | Home automation in electrical appliances, cleaning services, etc.
    |

    | Edge computing | Decentralized and distributed edge devices work in remote areas
    of operations. |

    | Endpoint security | Security systems against ransomware for IoT devices. |

    | 5G service introduction | 5G will enable IoT devices to communicate data with
