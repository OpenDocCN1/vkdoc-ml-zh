    ![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig10_HTML.jpg](img/484167_1_En_3_Fig10_HTML.jpg)


    图 3-10


    选择 Arduino Mega 2560 开发板


    选择 Arduino/Genuino Mega 或 Mega 2560 后，你就可以编写第一个 Hello world 程序了，如图 3-11 所示。


    ![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig11_HTML.jpg](img/484167_1_En_3_Fig11_HTML.jpg)


    图 3-11


    在 Arduino IDE 中编写 Hello world 程序


    你会注意到，程序的 `setup` 函数以 9600 的波特率初始化了串口。`loop` 函数中包含一条向 Arduino 串口打印信息的语句。实际上，这类程序本身并无实际意义；然而，你是在尝试测试与
    Arduino 微控制器的通信。下一步，如果你能成功编译该程序，则说明你没有犯任何错误。这个 Hello world 程序中常见的错误是首字母大写（在 `Serial`
    中，字母 S 必须大写）。另一件需要记住的事情是，`Serial` 对象的函数名不需要大写。`begin` 和 `println` 函数名都没有大写。就像任何
    C 或 C++ 程序一样，每条语句都必须以分号结尾。


    现在，让我们进入下一步，在 Arduino IDE 中编译程序，如图 3-12 所示。


    ![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig12_HTML.jpg](img/484167_1_En_3_Fig12_HTML.jpg)


    图 3-12


    在 Arduino IDE 中编译草图


    ### 运行草图


    成功编译 Hello world 程序后，你可以继续下一步：上传程序。在此步骤中，Arduino IDE 通过树莓派的 USB 串行接口与 Arduino
    Mega 2560 微控制器通信，并将整个程序烧录到其中。现在，该程序将驻留在微控制器的内存中并无限运行，直到你编写下一个程序并通过相同的过程将其覆盖写入。图
    3-13 显示了“草图”菜单中用于将程序上传到微控制器开发板的“上传”选项。


    ![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig13_HTML.jpg](img/484167_1_En_3_Fig13_HTML.jpg)


    图 3-13


    Arduino IDE 中用于上传草图的选项


    现在，你已经编译了程序并点击了上传，你应该会看到程序正在上传，并且有一个进度条指示 Arduino IDE 将程序写入微控制器开发板的进度。如果你没有选择正确的微控制器开发板，你将在此处看到错误。如果树莓派和
    Arduino 之间的连接出现问题，你也会在此步骤中看到错误。上传阶段出错的最常见原因是线缆松动或串行总线线缆不良。因此，请检查树莓派和 Arduino 开发板两端的接口，以确认你的线缆没有问题。如果上传时仍然遇到错误，请尝试更换线缆。图
    3-14 显示了将 Hello world 程序成功上传到 Arduino 微控制器开发板的结果。请注意 Arduino IDE 底部面板上的“完成编译”消息。下面的方框显示了与程序存储空间或可供其使用的最大空间相关的消息。在此例中，它使用了可用最大空间
    253952 字节中的 1820 字节。同样，它还告知你，其全局变量使用了 212 字节（2%）的动态内存，在总共 8192 字节中，为局部变量留下了 7980
    字节。非常长的程序可能无法放入 Arduino Mega 2560 开发板的小容量内存中，因此这些信息会派上用场，以便你可以优化程序以使其适合。


    ![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig14_HTML.jpg](img/484167_1_En_3_Fig14_HTML.jpg)


    图 3-14


    Arduino IDE 上的“完成编译”消息


    这是测试树莓派与 Arduino 通信过程的最后一步。现在，你已经准备好进行下一步，从树莓派获取物联网传感器数据。


    ## 使用树莓派示例代码获取物联网传感器数据


    为了在树莓派中获取物联网传感器数据，你首先需要重新审视单板计算机上的 GPIO 引脚。它们如图 3-15 所示。


    ![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig15_HTML.jpg](img/484167_1_En_3_Fig15_HTML.jpg)


    图 3-15


    树莓派 3 型号 B+ GPIO 引脚布局


    40 个 GPIO 引脚在图 3-15 中清晰可见。我在前面的章节中解释过它们的用途；然而，在本章中，你将使用它们来构建电路，与 LED 和物联网传感器等设备进行通信。此后，我将引用这些引脚编号，例如，带有红色圆圈且编号为
    1 的引脚标有 3V，这意味着它用于为你的设备提供 3V 电流；而带有红色圆圈且编号为 2 和 4 的引脚提供 5V 电源。此外，你将使用编号为 6、9、14、20、30、34
    和 39 的接地引脚。其余引脚可用于数字 GPIO 通信。


    你现在正处于将物联网传感器连接到树莓派开发板 GPIO 引脚的步骤。有两种方法可以做到这一点：使用面包板（如图 3-16 所示）或印刷电路板（PCB）。本书中的所有示例、解决方案和案例研究练习都处于概念验证（PoC）级别。当你首次设计电子系统作为概念验证时，会使用面包板；当你在面包板上测试了与程序配合使用的电子电路，并且现在希望将其永久化用于生产或商业用途时，则会使用
    PCB。


    ![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig16_HTML.jpg](img/484167_1_En_3_Fig16_HTML.jpg)


    图 3-16


    用于电路测试的面包板


    如你所见，面包板的顶部和底部有两条导轨，其内部嵌有正极和负极孔。中间的分区各有五列和六十四行，用于连接 LED、物联网传感器或电机等设备。关于此面包板，需要注意的关键点是，在塑料涂层下面是一个电路网格，它将每一行连接在一起。因此，如果你将
    LED 的一个引脚放在该行的任何中间位置，你应该能够通过将另一根导线放在同一行上来连接到它。你无需将导线插入与插入任何设备引脚的同一个孔中。面包板的这一特性使其使用起来非常方便，并且无需焊接电路（在使用印刷电路板时需要焊接）。由于此板的性质是整个电路基于孔且不是永久性的，因此你不能将其用于生产级工作。

    '
- fmt: '### Connecting It All Together


    Let’s now connect an IoT sensor on the Raspberry Pi 3 Model B+ board and write
    a Python program to get data from it. You will learn how to store the IoT sensor
    data in a database in the next section of this chapter.


    The circuit diagram of the IoT sensor with Raspberry Pi needs to be defined first
    so that you can understand what you are trying to build. Figure [3-17](#484167_1_En_3_Chapter.xhtml#Fig17)
    shows the electrical connections diagram for the project.


    ![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig17_HTML.jpg](images/484167_1_En_3_Chapter/484167_1_En_3_Fig17_HTML.jpg)


    **Figure 3-17** — Electrical connections diagram of an IoT sensor connected to
    the Raspberry Pi


    The IoT sensor that you are going to use is an LDR, or light-dependent resistor
    module. You’re not using an LDR or a photoresistor but a pre-made LDR module that
    has a completely functional circuit board made on its PCB with the far end hosting
    the photoelectric resistor marked as number 6 in Figure [3-17](#484167_1_En_3_Chapter.xhtml#Fig17).
    This module senses light from the ambient environment and gives back data in the
    0/1 format. The values it gives are in a float, and it gives back 0 for daylight
    and a value closer to 1 (like 0.90 to 0.99) when it is dark. To simulate darkness,
    you can use an object to cover the light photo resistor of the LDR. You can see
    the point marked as 1, which is the `VCC`; this is where you have to connect the
    wire to the `GPIO` pin 1 on the Raspberry Pi board. The point marked is the ground
    connection and must be connected to the `GPIO` pin 6 on the Raspberry Pi board.
    Point number 3 is the `DO`, or digital output signal wire, from the LDR module
    and it must be connected to `GPIO` pin 25 on the Raspberry Pi board. The LDR module,
    when fully connected, gives out two red LED signals on both sides, which you can
    see in Figure [3-18](#484167_1_En_3_Chapter.xhtml#Fig18).


    ![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig18_HTML.jpg](images/484167_1_En_3_Chapter/484167_1_En_3_Fig18_HTML.jpg)


    **Figure 3-18** — Fully connected LDR module


    Now let’s look at the LDR module with the photoelectric resistor. At the far end,
    it’s covered; as a result, only one light glows, showing there is darkness around
    the LDR module (see Figure [3-19](#484167_1_En_3_Chapter.xhtml#Fig19)).


    ![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig19_HTML.jpg](images/484167_1_En_3_Chapter/484167_1_En_3_Fig19_HTML.jpg)


    **Figure 3-19** — Fully connected LDR module covering the PE resistor


    The point marked 1 in Figure [3-19](#484167_1_En_3_Chapter.xhtml#Fig19) is the
    second LED for digital output, which is off and shows there is no signal being
    received from the photoelectric resistor to it. The point marked 2 in the diagram
    is the photoelectric resistor, which is covered by me using a pencil. Anything
    can be used to cover the PE resistor as long as no light goes through it. Simulation
    of day and night is for testing purposes; however, in the real world, this sensor
    works wonders when you place it in an application such as detecting day or night
    and switching on or off a consumer/industrial appliance based on the result. This
    data, combined with data from an industrial machine, also helps diagnose critical
    problems in applications of predictive maintenance, which you will apply in the
    case studies. You will be storing this LDR IoT sensor data in a database in the
    next section of this chapter.


    Make sure that the `GPIO` pins listed in Table [3-1](#484167_1_En_3_Chapter.xhtml#Tab1)
    are connected to the corresponding pins on the Raspberry Pi board.


    **Table 3-1** — Raspberry Pi GPIO Pins to LDR Module Connections


    | Raspberry Pi | GPIO Pin Number | Light Sensor Module |

    | --- | --- | --- |

    | 3.3v Power | 1 | VCC (V) |

    | Ground | 6 | GND (G) |

    | GPIO signal pin | 25 | SIGNAL (S) |


    The `GPIO` pin number 1 has to be connected to the LDR module pin marked on its
    PCB as `VCC`. Similarly, the `GPIO` Pin for Ground should be connected through
    the wire to the middle pin showing `GND` on the LDR module. The third pin you
    are using in your program is the `GPIO` signal pin, which will send and receive
    the digital signal to and from the LDR module, which is pin number 25, to the
    third pin of the `GPIO` signal pin. There are some LDR modules that have four
    pins; that last pin is for analog input and output in case you want to use it.
    But in your case, since you have a three-pin LDR module, you don’t have to worry
    about it. The connected LDR pins on the `GPIO` and the LDR module can be seen
    in Figure [3-20](#484167_1_En_3_Chapter.xhtml#Fig20).


    ![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig20_HTML.jpg](images/484167_1_En_3_Chapter/484167_1_En_3_Fig20_HTML.jpg)


    **Figure 3-20** — Raspberry Pi GPIO pins to LDR module connections'
