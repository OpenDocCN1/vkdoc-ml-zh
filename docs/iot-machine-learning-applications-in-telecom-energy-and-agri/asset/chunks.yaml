    ```python

    #!/usr/bin/Python

    #Loading modbus library

    import minimalmodbus

    from datetime import datetime

    #Initializing searial communication on the modbus library

    sdm630 = minimalmodbus.Instrument(''/dev/ttyUSB0'', 1)

    sdm630.serial.baudrate = 9600

    sdm630.serial.bytesize = 8

    sdm630.serial.parity = minimalmodbus.serial.PARITY_NONE

    sdm630.serial.stopbits = 1

    sdm630.serial.timeout = 1

    sdm630.debug = False

    sdm630.mode = minimalmodbus.MODE_RTU

    print(sdm630)

    while 1:

    Volts = sdm630.read_float(0, functioncode=4)

    Current = sdm630.read_float(6, functioncode=4)

    Active_Power = sdm630.read_float(12, functioncode=4)

    Apparent_Power = sdm630.read_float(18, functioncode=4)

    Reactive_Power = sdm630.read_float(24, functioncode=4)

    Power_Factor = sdm630.read_float(30, functioncode=4)

    Phase_Angle = sdm630.read_float(36, functioncode=4)

    Frequency = sdm630.read_float(70, functioncode=4)

    Import_Active_Energy = sdm630.read_float(72, functioncode=4)

    Export_Active_Energy = sdm630.read_float(74, functioncode=4)

    Import_Reactive_Energy = sdm630.read_float(76, functioncode=4)

    Export_Reactive_Energy = sdm630.read_float(78, functioncode=4)

    Total_Active_Energy = sdm630.read_float(342, functioncode=4)

    Total_Reactive_Energy = sdm630.read_float(344, functioncode=4)

    print(''Voltage: {0:.1f} Volts''.format(Volts))

    print(''Current: {0:.1f} Amps''.format(Current))

    print(''Active power: {0:.1f} Watts''.format(Active_Power))

    print(''Apparent power: {0:.1f} VoltAmps''.format(Apparent_Power))

    print(''Reactive power: {0:.1f} VAr''.format(Reactive_Power))

    print(''Power factor: {0:.1f}''.format(Power_Factor))

    print(''Phase angle: {0:.1f} Degree''.format(Phase_Angle))

    print(''Frequency: {0:.1f} Hz''.format(Frequency))

    print(''Import active energy: {0:.3f} Kwh''.format(Import_Active_Energy))

    print(''Export active energy: {0:.3f} kwh''.format(Export_Active_Energy))

    print(''Import reactive energy: {0:.3f} kvarh''.format(Import_Reactive_Energy))

    print(''Export reactive energy: {0:.3f} kvarh''.format(Export_Reactive_Energy))

    print(''Total active energy: {0:.3f} kwh''.format(Total_Active_Energy))

    print(''Total reactive energy: {0:.3f} kvarh''.format(Total_Reactive_Energy))

    print(''Current Yield (V*A): {0:.1f} Watt''.format(Volts * Current))

    import sqlite3

    conn = sqlite3.connect(''/home/pi/IoTBook/Chapter6/energymeter.db'')

    #df.to_sql(name=''tempdata'', con=conn)

    curr=conn.cursor()

    query="INSERT INTO sdm630data(timestamp, voltage , current ,activepow ,apparentpow
    ,reactivepow ,powerfactor ,phaseangle , frequency , impactiveng , expactiveeng
    ,impreactiveeng , expreactiveeng ,totalactiveeng ,totalreactiveeng ,currentyield,
    device ) VALUES(" + "''" + str(datetime.now()) + "''" + "," + "''" + str(Volts)
    + "''" + "," +  "''" + str(Current) + "''" + "," +  "''" + str(Active_Power) +
    "''" + "," +  "''"  + str(Apparent_Power) + "''" + "," +  "''" + str(Reactive_Power)
    +  "''" + "," +  "''" + str(Power_Factor) + "''" + "," +  "''" +  str(Phase_Angle)
    + "''" + "," +  "''" + str(Frequency) + "''" + "," +  "''" +  str(Import_Active_Energy)
    + "''" + "," +  "''" + str(Export_Active_Energy) + "''" + "," +  "''" + str(Import_Reactive_Energy)
    + "''" + "," +  "''" + str(Export_Reactive_Energy) + "''" + "," +  "''" + str(Total_Active_Energy)
    + "''" + "," +  "''" + str(Total_Reactive_Energy) + "''" + "," +  "''" + str((Volts
    * Current)) + "''" + "," + "''" + str("millmachine")+ "''" + ")"

    print(query)

    curr.execute(query)

    conn.commit()

    ```


    **Listing 6-10** Python Code to Get Data from the Energy Meter and Store It in
    a Database


    In this code, first you import the `minimalmodbus` Python library to enable Modbus
    communication between the Raspberry Pi and the energy meter. Then you import `datetime`
    to store a timestamp along with one record of data from the energy meter. Its
    usage comes later in the code. After this you initialize the Modbus instrument
    through its Rs485 Modbus USB converter, which is connected on the Raspbian device
    list as `/dev/tty/USB0`. This is the default device and should work in most cases;
    however, if you face any communication errors, use the command `lsusb` to check
    which tty port your 485 converter is connected to. Next, you initialize the serial
    port communication at the frequency baud rate of 9600. This is the default value;
    if you have changed the baud rate in your energy meter, you need to change it
    here in the code statement `sdm630.serial.baudrate = 9600` to its new value. You
    initialize the byte size of 8 for a register along with other setup parameters
    like stopbits and timeout interval. The `print(sdm630)` prints the object out
    to the console on the Raspbian so you should see all of the connection setup configuration
    through this print statement. After this, your setup of the energy meter is done
    and you can now communicate with it and get data from it. For this, in the next
    piece of code you use an infinite `while` loop to get the data continuously printing
    on the screen and then lastly store it in a SQLite 3 database. This code is very
    similar to the code for the Conzerv EM6400 Energy Meter so I won’t delve deeper
    into it. However, the points to note are that you are getting a total of 15 values
    from the energy meter, including its voltage, current, active power, and reactive
    power to the current yield. After running the program, you should see output similar
    to Figure [6-24](#484167_1_En_6_Chapter.xhtml#Fig24).


    ![../images/484167_1_En_6_Chapter/484167_1_En_6_Fig24_HTML.jpg](images/484167_1_En_6_Chapter/484167_1_En_6_Fig24_HTML.jpg)


    **Figure 6-24** Output of the program `sdm630_tested.py`


    The output of the `insert into` statement used to store data into the SQLite3
    database goes into a table named `sdm630data`. The table creation script is in
    the file `sdm630_db_creation_script.sql`, which came along with the zip you downloaded
    from [www.​pmauthor.​com/​raspbian/​](https://www.pmauthor.com/raspbian/).


    ## Summary


    This completes the setup, configuration, and getting data from the energy meter
    into a database system. So far you have successfully downloaded the scripts for
    use in the setup of the energy meter device. You coded for the EM6400 Energy Meter
    by the use of a Modbus library in the Arduino IDE. You also learned and implemented
    pre- and post-communication between the Arduino Mega 2560 and the Conzerv EM6400
    Energy Meter by writing a small “Hello World” program. Then you wrote code to
    get data values from the energy meter through its registers. After this, you configured
    another energy meter, the more commonly available Eastron SDM630. You connected
    the hardware to it and then loaded the required Python libraries for the Modbus
    communication between the Raspberry Pi and the SDM360 Energy Meter. Lastly, you
    wrote a Python program to get data from the energy meter such as voltage, current,
    and power and stored it in a SQLite3 database.


    Next, you will examine some case studies and design some interesting IoT and IIoT
    solutions.'
