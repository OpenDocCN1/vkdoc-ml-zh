    ## Testing Arduino Using Python


    Arduino is a microcontroller. As you know from Chapter [2](#484167_1_En_2_Chapter.xhtml),
    it is used for communicating with industrial devices using the Modbus protocol.
    Let’s get started with Arduino.


    Arduino programs are written in the Arduino IDE. The Arduino IDE is special software
    running on the Raspberry Pi system. You are going to use it as a master, and Arduino
    is going to be the slave that communicates with your IIoT devices such as energy
    meters. It allows you to write sketches (a synonym for *program* in the Arduino
    language) for different Arduino boards. The Arduino programming language is based
    on a very simple hardware programming language called Processing, which is similar
    to the C language in its syntax. After the sketch is written in the Arduino IDE,
    it should be burnt onto the Arduino chipboard for execution. This process is known
    as uploading to the Arduino microcontroller. In this test, you are going to use
    the Arduino IDE for testing on a Raspberry Pi 3 Model B+. Please remember Arduino
    is not a fully functional computer; it does not have its own OS like Raspberry
    Pi has and that is why it needs a master like Raspberry Pi to monitor, control,
    and use it. The slave Arduino communicates back and forth between its master and
    the connected IIoT or IoT devices. Although this looks complicated initially,
    it becomes easier once you start to test and put together each of the pieces of
    hardware and software for this system to work.


    ### Arduino Hardware Setup and Communication


    You first connect using the USB serial cable that comes with the Arduino Mega
    2560 with Raspberry Pi 3 Model B+, as you can see in Figure [3-7](#484167_1_En_3_Chapter.xhtml#Fig7).
    The USB port of the Raspberry Pi is used to do this and the other end is connected
    to the serial port of the Arduino board.


    ![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig7_HTML.png](images/484167_1_En_3_Chapter/484167_1_En_3_Fig7_HTML.png)


    Figure 3-7


    Connected Raspberry Pi 3 B+ and Arduino Mega 2560


    In the next step, open up the Arduino IDE as shown in Figure [3-8](#484167_1_En_3_Chapter.xhtml#Fig8)
    and write the program shown in Listing [3-2](#484167_1_En_3_Chapter.xhtml#PC4).


    ![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig8_HTML.png](images/484167_1_En_3_Chapter/484167_1_En_3_Fig8_HTML.png)


    Figure 3-8


    Opening the Arduino IDE on Raspberry Pi 3 Model B+


    Once the Arduino IDE comes up, you can write the Arduino version of the “Hello
    world” program.


    ```

    void setup() {

    // put your setup code here, to run once:

    Serial.begin(9600);

    }

    void loop() {

    // put your main code here, to run repeatedly:

    Serial.println("Hello World from Arduino");

    }

    Listing 3-2

    Arduino “Hello world” Program

    ```


    When you write a sketch program for Arduino, there are two functions that are
    very similar to the C language that need to be present. The first one is the `void
    setup()` function, which is primarily used for initializing things like serial
    bus communications, LEDs, or other devices connected to the Arduino microcontroller.
    The Arduino IDE shown in Figure [3-12](#484167_1_En_3_Chapter.xhtml#Fig12) is
    what you will open on Raspberry Pi 3 B+ from the Start ➤ Programming menu from
    the desktop and then you’ll write the program shown in Figure [3-9](#484167_1_En_3_Chapter.xhtml#Fig9).


    ![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig9_HTML.jpg](images/484167_1_En_3_Chapter/484167_1_En_3_Fig9_HTML.jpg)


    Figure 3-9


    Default Arduino IDE sketch


    The code is self-explanatory and is in the C style and syntax. The first function
    is `void setup()` and the comment after the symbol `//`, which stands for comment,
    explains that you can put your code here and that you need to run it only once,
    like initializing any devices or variable values, etc. In the setup function,
    the body denoted by curly braces, { }, is the area where you write your code.
    The next function is the loop function, which you want to run in a loop or repeatedly.
    You may find this confusing if you have a pure software background and may not
    understand why you need a function that does things repeatedly. Try to understand
    it this way: a machine or a microcontroller like Arduino cannot function on its
    own unless there is a program that tells it what to do again and again. It is
    like having a servant at your disposal who gets bored of staying idle. Similarly,
    Arduino also needs to do something repeatedly and cannot stay idle. You can ask
    it to monitor a device and trigger something when a certain event happens or the
    device is about to malfunction. This is just an example of what you can do with
    this `loop()` function ; the applications are limitless. You could turn an LED
    on or off based on a Modbus device’s input value such as temperature etc. This
    just requires that the Arduino microcontroller works continuously without stopping,
    and that is what this `loop()` function is all about.


    Before you can continue, you need to know the process of compiling and running
    the program in the Arduino IDE. First, you write the sketch code and save it in
    a file with the extension `∗.ino`. Once saved, you go to Tools ➤ Board and hover
    to open up the list of supported Arduino microcontroller boards. Select Arduino
    Mega 2560 from the list. You have to remember to check every time you open up
    the Arduino IDE so that you don’t get errors in your compilation. Figure [3-10](#484167_1_En_3_Chapter.xhtml#Fig10)
    shows how to do this.'
