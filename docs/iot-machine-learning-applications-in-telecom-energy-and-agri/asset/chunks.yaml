  trans: '

    ## 未来物联网发展趋势


    为了全面了解物联网领域，审视其新兴的主要趋势至关重要。针对 2019 年物联网趋势，已有大量调查和预测。根据 Eileen Brown 在 ZDNet 上关于
    2019 年物联网趋势的报道（[`www.zdnet.com/article/whats-next-for-2019-iot-trends-and-predictions/`](http://www.zdnet.com/article/whats-next-for-2019-iot-trends-and-predictions/)），一项
    Northstar 全球消费者调查显示，智能家居将成为主流，下一个热门领域将是通过智能手机和 GPS 定位数据向消费者提供的中介配送选项。该调查还预测，由于在医院部署联网传感器以确保缩短寻找关键医疗设备的时间，医疗保健质量将得到提升。该调查还讨论了智慧城市的功能，通过更好的废物管理和公民参与来降低配送成本，从而创造收入流机会和节能建筑。这一点如今已成为主流，例如新加坡已经证明，智能建筑可以回收利用包括水和垃圾资源在内的废弃物，实现自给自足。


    GoodWorkLabs 于 2019 年 2 月发布的一项关于物联网的调查（[`www.goodworklabs.com/iot-trends-2019/`](http://www.goodworklabs.com/iot-trends-2019/)）谈到了边缘计算，这是一种在分布式智能边缘设备上执行的计算，而非在需要集中式网络进行处理的室内区域或工业领域的集中式环境中执行。该调查将物联网设备的安全性列为重要事项，并指出了西门子和通用电气等硬件制造商所做的努力，它们正在制造专注于用户端点安全的智能设备。该调查还谈到了其在医疗保健和制造业中的应用。智能信标
    RFID 标签是到 2020 年将在设备上发生的新工业革命的一部分。消费者物联网行业的治理也被指出是推动智能家居发展的一个趋势。另一个重大发展是，消费行业的大型企业正在联合起来提供订阅服务。这将发生在公用事业、食品公司和服务聚合商等领域。有讨论提到联网智能汽车市场的增长，这些汽车可以通过手机上的智能应用程序访问，这些应用程序将使用物联网技术向您显示有关汽车的实时诊断信息。您汽车内的所有传感器将为您提供有关当前位置的数据，以及车内情况，例如轮胎气压。该调查对
    2019 年 5G 的到来表示欢迎，5G 将通过支持物联网设备的互联互通，成为物联网技术的支柱。5G 网络将允许智能设备实时生成和发送数据，这在以前是无法想象的。


    网站 iotforall.com（[`www.iotforall.com/top-iot-trends-rule-2019/`](http://www.iotforall.com/top-iot-trends-rule-2019/)）报道称，2019
    年将是关于大数据和人工智能的。Gartner 的最高预测是，物联网部署量将增长 142 亿。它谈到了互联云。许多公司将依赖云来存储数据，因为云存储与带宽相关。访问数据是选择不同云服务的原因，例如亚马逊
    AWS 云平台、微软 Azure 和谷歌云平台等巨头提供的服务。如今的需求是让这些不同的云能够相互通信；这被称为互联云，例如甲骨文和微软通过连接其云平台服务建立的合作伙伴关系。该调查还谈到了为任何公司连接私有云和公有云以满足其数据存储需求。该调查还谈到了边缘计算，它将在
    2019 年取得突破。该调查谈到了数字孪生，也称为混合或虚拟原型设计业务，它使用人工智能、机器学习和物联网等特殊工具，通过简化数据操作来改善客户业务体验。该调查强调，5G
    将通过带来革命性的应用，改变物联网市场的游戏规则。该调查提到的一点是传感器创新，虽然没有说明市场上将开发何种类型的传感器，但指出新的专用传感器将利用深度神经网络实现高效节能，从而催生新一代架构以及低功耗物联网和端点设备。利用这些传感器技术的数据开发新算法，将导致其应用领域出现新的实现方式。该调查对社交物联网的预测，即它正在引发社交焦虑，并将把商业领域从消费设备转移到大规模制造业，这就像是对物联网应用和解决方案实施者的一个警告，要求他们在构建产品时考虑社会责任。社交方面强调了人类需要接受当前人类在日常生活中接受物联网的状态。尽管该调查没有指出任何具体问题，但它表示，随着在线接受度的提高，社会、法律和伦理问题将会出现。


    Network World 的一项调查涵盖了 2019 年及以后的十大物联网趋势（[`www.networkworld.com/article/3322517/a-critical-look-at-gartners-top-10-iot-trends.html`](http://www.networkworld.com/article/3322517/a-critical-look-at-gartners-top-10-iot-trends.html)）。第一个趋势是人工智能，这并不令人意外。第二个是社会、法律和伦理问题。Info
    Linux 和数据预订，即信息商业化并使数据代理和订阅或条件基础上的淹没可用，这是 Gartner 研究报告的内容。IV 是向电话边缘智能网格的转变。边缘网格被定义为连接边缘设备的网络，通过互联网将云和终端用户设备在高层连接在一起，称为边缘网格。该研究指出，与其让这些设备孤立工作，不如将它们连接到智能机器，并创建它们自己的网络之网络。Gartner
    认为的趋势是物联网治理，涵盖物联网应用实施中涉及的法律、社会方面和伦理。


    该研究提到的其他趋势，如新的用户体验和用于物联网的新无线网络技术，也具有重要意义。

    '
- fmt: 'PCMag（[`www.pcmag.com/feature/365945/8-iot-trends-to-watch-in-2019/8`](http://www.pcmag.com/feature/365945/8-iot-trends-to-watch-in-2019/8)）发布了其2019年值得关注的趋势。物联网目前面临的一个问题是针对勒索软件的附加保护。文章提到了亚特兰大市的案例，当时该市的供水服务系统等城市系统被黑客入侵。黑客通过勒索软件攻击IT系统，迫使所有智能设备的管理解决方案（如移动设备管理解决方案）不得不放弃保护，以抵御此类搜索攻击。一个有趣的案例被重点提及：利用物联网技术来保障食品安全。例如，一家冷食存储运营商采用混合云来确保食品安全，物联网正在帮助公司监控冷藏设施的温湿度。


    文章强调的另一个问题是利用物联网简化制造业的维护工作。文中讨论了使用传感器来预判制造过程中的问题，现场技术人员只需在触摸屏上点击传感器，就能检测机器在近期可能出现的故障。正如文章所指出的，工厂工人将佩戴基于物联网的可穿戴设备，以便控制中心对其进行管理、监控和控制。


    一篇关于2019年趋势与预测的TechGenix文章讨论了新物联网平台的两个有趣方面（[`http://techgenix.com/iot-trends-2019/`](http://techgenix.com/iot-trends-2019/)）。文章提到，物联网平台供应商并未专注于用例和完整性。超大规模云将被标记为物联网目的地；从今年起，超大规模云与物联网平台之间的融合将开始出现。另一个趋势是物联网托管服务市场的发展。物联网服务的出现将包括物联网网络及其他物联网资产的管理与运营。文章预测，这些服务将为智能家居的智能产品进行定制，以支持IT解决方案。


    最后一项调查是福布斯（[`www.forbes.com/sites/bernardmarr/2019/02/04/5-internet-of-things-trends-everyone-should-know-about/#752315be4b1f`](http://www.forbes.com/sites/bernardmarr/2019/02/04/5-internet-of-things-trends-everyone-should-know-about/%2523752315be4b1f)）在2019年2月由Bernard
    Marr撰写的文章。文章预测，设备将变得更加“健谈”。例如，`Alexa`、`Siri`和`Google Voice`命令将迎来它们的崛起。


    我们已经审视了物联网领域的诸多预测，并试图找出其中的共同点。这些预测和趋势的总结如表[2-3](#484167_1_En_2_Chapter.xhtml#Tab3)所示。


    **表 2-3** 2019年起物联网的常见预测与趋势


    | IoT Trend Area | Description |

    | --- | --- |

    | Smart homes | Home automation in electrical appliances, cleaning services, etc.
    |

    | Edge computing | Decentralized and distributed edge devices work in remote areas
    of operations. |

    | Endpoint security | Security systems against ransomware for IoT devices. |

    | 5G service introduction | 5G will enable IoT devices to communicate data with
    higher bandwidth and faster to centralized clouds. |

    | Artificial intelligence | Machine learning and deep learning capabilities and
    robotics |

    | Cloud services for IoT | All cloud services will now be offering IoT-based solutions.
    |

    | IoT sensors innovation | Many sensors such as thought and voice sensors will
    be innovated. |


    在了解了业界最佳实践对物联网未来共同趋势和预测的分析之后，我现在向您介绍一个从2020年开始必将崛起的趋势。思维人工智能（Thought AI）尚未实现商业化，包括思维传感器的发明。我将在本章的下一节中详细讨论所有这些内容。


    ## 深入探讨思维人工智能


    您已经看到了物联网领域最佳的商业应用，也看到了上述文章预测的未来趋势。然而，作为一名技术远见者，我认为这些趋势中没有任何一项能像某个特定应用那样具有颠覆性。是的，我指的是一项不仅将彻底改变，而且将重塑人与机器交互方式的技术。它将创造一个更直观、更轻松、更响应人类需求的世界。它将带来一场如同个人电脑或手机发明般的革命性变革。它将使技术提升到一个前所未有的水平，使技术无限接近人类。这将是机器成为朋友和伙伴的时代。当然，这种技术同样具有反人类的潜力。我再次引用我的第一本书《使用Python的机器学习应用》中的话：“改变我们未来生活方式的不是人工智能，而是人工智能背后的人类智能。”请记住，本节内容具有未来主义色彩，思维人工智能是近未来的基础，因为它尚未实现。它可能在将来发生。此外，您需要知道，实施思维人工智能的成本将会很高，因为它仍处于研发阶段。


    作为一名远见者，我向您介绍未来的技术。这就是我所说的思维人工智能。如果您审视人类向任何机器输入信息的方法，会发现只有两种。第一种是通过键盘打字，第二种是通过扬声器进行语音听写。表[2-4](#484167_1_En_2_Chapter.xhtml#Tab4)列出了在计算机上模拟类人机器人的打字输入和语音输入之间的区别。


    图[2-2](#484167_1_En_2_Chapter.xhtml#Fig2)展示了人脑产生打字作品所需经历的过程。您需要将两者结合起来阅读，以理解思维人工智能的优势。


    ![../images/484167_1_En_2_Chapter/484167_1_En_2_Fig2_HTML.jpg](images/484167_1_En_2_Chapter/484167_1_En_2_Fig2_HTML.jpg)


    **图 2-2** 人脑的打字过程


    **表 2-4** 使用思维人工智能的优势'
