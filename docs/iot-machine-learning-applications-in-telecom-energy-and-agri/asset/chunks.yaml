    been imagined so far.


    The website iotforall.com ([`www.iotforall.com/top-iot-trends-rule-2019/`](http://www.iotforall.com/top-iot-trends-rule-2019/))
    reports that 2019 will be about big data and artificial intelligence. The topmost
    forecast by Gartner says that there will be a rise of 14.2 billion IoT deployments.
    It talks about connected clouds. Many companies will rely on clouds to store data
