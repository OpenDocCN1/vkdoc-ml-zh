    learning consultant for this problem for RegoniaTel.'
  trans: '

    数据显示，RegoniaTel 网络的掉话投诉量上升了 41%。在所有运营商中，其掉话率增幅最大。由总理设立的电信委员会建议，对超过 10% 掉话投诉阈值的电信运营商处以
    9 亿美元的罚款。这是一笔巨额罚款，如果掉话问题在其网络上持续发生，将给公司带来巨大的经济损失。


    面对这一威胁和公众的强烈抗议，RegoniaTel 总裁召集其运营团队开会，以了解掉话率飙升背后的关键原因。根据运营经理的建议，需要设立一个试点项目，整合机器学习、物联网等前景广阔且创新的新兴技术，以解决这一技术商业问题。运营经理调来了其最有经验的机器学习工程师以及两位最优秀的数据科学家，共同组成试点团队，以寻找解决方案。


    试点团队首次会面，研究了导致掉话的各种技术原因，包括对表 7-1 中给出的不同网络位置阶段的分析。


    表 7-1


    2018 年 Regonia 电信运营商掉话数据


    | 网络名称 | 平均信号强度 (dBM) | 用户数 | 电话普及率 % | 网络停机时间 % | 通话成功率 % | 掉话率 | 掉话投诉量 |

    | --- | --- | --- | --- | --- | --- | --- | --- |

    | EtiTel | 92 | 1160000 | 113 | 0.05 | 98.2 | 0.048 | 55680 |

    | GribaTel | 107 | 1030900 | 96 | 0.87 | 97.4 | 0.8352 | 861007.68 |

    | RegoniaTel | 89 | 1243080 | 97 | 1.3 | 96.2 | 1.248 | 1551363.84 |


    如您所见，信号强度以 dBm 为单位，这是衡量信号强度的单位。表格显示了用户数、电话普及率百分比、网络停机时间百分比、通话成功率百分比以及掉话率百分比。表格还显示了三家电信运营商各自收到的掉话投诉数量。平均信号强度最好的是
    GribaTel，其次是 EtiTel，最后是 RegoniaTel。用户数量最多的是 RegoniaTel，约为 1240 万。RegoniaTel 的电话普及率为
    97%，最高的是 EtiTel。RegoniaTel 的网络停机时间最高，为 1.3%。通话成功率最高的是 EtiTel，最低的是 RegoniaTel。RegoniaTel
    的掉话率为 1.248%，最低的是 EtiTel。RegoniaTel 的掉话投诉量也最高。因此，您可以清楚地看到 RegoniaTel 存在网络停机、平均信号强度低以及掉话率最高的问题。


    RegoniaTel 的运营经理报告称，用户数量正在下降，服务客户反馈显示，超过 60% 的用户表示因掉话问题而转投竞争对手的网络。用户数据见表 7-2。


    表 7-2


    RegoniaTel 七个月的用户数量


    | 月份 | 用户数量 |

    | --- | --- |

    | 2018 年 4 月 | 1286588 |

    | 2018 年 5 月 | 1274157 |

    | 2018 年 6 月 | 1269806 |

    | 2018 年 7 月 | 1266580 |

    | 2018 年 8 月 | 1262845 |

    | 2018 年 9 月 | 1261726 |

    | 2018 年 10 月 | 1243080 |


    如您所见，从 2018 年 4 月到 10 月出现了一个峰值，随后用户数量稳步下降。在七个月的时间里，其用户基数稳定下降了 3.4%。公司总裁向运营经理表达了他的担忧，并要求他加快项目进度，以找到解决此问题的方法。


    试点项目中的机器学习工程师和数据科学家都意识到了这个问题的严重性，以及它与 RegoniaTel 收入减少的直接关联。如果用户流失继续下去，预计用户基数将进一步减少
    4.75%（表 7-3）。运营经理还解释说，用户数量每下降一个百分点，平均会导致收入相应减少 1000 万美元。对于一家正在努力维持其网络质量的公司来说，这是一个巨大的数字。CEO
    已经在考虑可能不得不裁员以降低运营成本。这是一个可怕的想法，但这是基于呈现在他面前的数据得出的。他向运营经理和试点团队解释了这项基于机器学习和物联网的试点项目的成功对公司有多么重要。


    表 7-3


    RegoniaTel 2019 年预计用户数


    | 月份 | 用户数量 |

    | --- | --- |

    | 2018 年 10 月 | 1243080 |

    | 2018 年 11 月 | 1212003 |

    | 2018 年 12 月 | 1210760 |

    | 2019 年 1 月 | 1184034 |

    | 2019 年 2 月 | 1129338 |


    试点团队被要求设计并实施一个试点系统，该系统能够解决掉话的直接问题，并应解决以下问题：


    1.  导致掉话问题的原因是什么？

    2.  掉话问题在哪些地点更为普遍？

    3.  如何衡量特定地点的通话质量？

    4.  能否预测掉话？如何预测？


    这就是完整的案例研究。如果您来自电信行业，您会发现这些问题非常熟悉，并且应该能够轻松地将它们联系起来。请跟随我，看看作为一名机器学习顾问，我将如何为 RegoniaTel
    构建这个问题的解决方案。

