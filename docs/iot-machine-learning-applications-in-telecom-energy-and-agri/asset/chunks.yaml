  raw: '### Single-Board Computer


    A single-board computer is a completely functional computer set on a single printed
    circuit board. What makes this type of computer unique is that the entire input,
    output, and processing such as graphics and numeric calculations all happen on
    the same board. While a SBC can be built as a high computing server, a more popular
    version of this type of computer is a small and compact machine.


    Historically, SBCs were built to be educational and compact; now they are used
    in mainstream commercial applications.


    Single-board computers are built on different microprocessors but they are all
    of a simple design. They are built to be handy and compact. Running a fast computer
    that occupies very little space and is stable and also portable adds to the charm
    of owning these machines.


    One of the early implementations (May, 1976) of single-board computer was called
    the Diana micro; it was based on the Intel C8080A processor and was a very popular
    home computer as part of the BigBook series of computers. With the expansion of
    the PC market, the SBC did not progress further until now, when the PC has almost
    been replaced by tablets, laptops, and mobiles. You can go to [`https://en.wikipedia.org/wiki/Single-board_computer`](https://en.wikipedia.org/wiki/Single-board_computer)
    for more information.


    Some of the advantages of using SBCs are shown in Table [1-1](#484167_1_En_1_Chapter.xhtml#Tab1).


    Table 1-1


    SBC Features and Advantages


    | Features | Advantage |

    | --- | --- |

    | Price | SBCs are available for under $30 each today. |

    | Form factor | SBCs are very small, almost the size of a palmtop, which makes
    them portable and handy to use. |

    | Operating system | Linux variants are most popular. Windows IoT |

    | Architecture | Two variants: slot support and no slot support. |

    | Power efficiency | High |


    The main reason for the popularity of single-board computers is the price because
    they are available for under $30 each. Another perk is their compact and handy
    form factor; they fit the palm of the hand. There are variants that run Linux
    or Windows IoT or other operating systems. Most of the SBCs do not come with slot
    support; however, some do to support putting industrial grade cards on them. These
    small machines are highly efficient in terms of power and can run on home power
    single phase connections efficiently. Unless you want to plug them into a big
    LED or LCD screen, they do not need a separate power supply for the screen. They
    have their own 5-inch or 7-inch LED/LCD flat screens, which can be powered off
    the SBC itself. There is a flexibility of covers where the single boards can be
    put inside. From transparent ones to stylish cases to housing for clusters of
    4 or 7 SBCs, there is a wide range of options to choose from for today’s SBCs.
    This availability has extended the appeal of these computers by giving the user
    the DIY sense of achievement. From choosing the case to installing the operating
    system to using other types of software, everything is flexible and there are
    many options to choose from. Now let’s look at the most popular SBCs on the market
    and their development.


    ### Popular Single-Board Computers on the Market


