    the Thonny IDE and you should get a similar output too. If not, you may have not
    installed your Python libraries correctly; you may need to go back and check your
    installation logs from Figure [5-11](#484167_1_En_5_Chapter.xhtml#Fig11) to check
    where the error occurred. Then you should go ahead and execute the code for testing
    the Pandas dataframe in Figure [3-5](#484167_1_En_3_Chapter.xhtml#Fig5), whose
    output should be similar to that shown in Figure [3-6](#484167_1_En_3_Chapter.xhtml#Fig6)
    on the Thonny IDE. Further, you should test the small code in Figure [3-7](#484167_1_En_3_Chapter.xhtml#Fig7)
    for the sklearn machine learning integrated library, the output of which appears
