    `Listing 5-1`

    `Installing Thonny for Python 3`


    The Raspbian package for the Thonny IDE is downloaded from the archives of the
    `raspberry.org` official website and then processed and set up for use. If the
    installation is successful, you should see your IDE installed under the Programming
    menu in the Start bar, as shown in Figure [5-11](#484167_1_En_5_Chapter.xhtml#Fig11).


    ![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig11_HTML.jpg](images/484167_1_En_5_Chapter/484167_1_En_5_Fig11_HTML.jpg)


    Figure 5-11


    Verifying the Thonny Python IDE installation


    I discussed the verification part of the Thonny IDE in Chapter [3](#484167_1_En_3_Chapter.xhtml),
    so let’s move to the next step of installing the required Python libraries for
    use in the case studies. The following is a list of Python libraries that you
    will need. Remember to change `tkinter` to `Tkinter` (yes, capital T), as discussed
    in Chapter [3](#484167_1_En_3_Chapter.xhtml).


    *   `numpy` is for operations on n-arrays and matrices in Python.

    *   `pandas` is used for data wrangling. It was designed for quick and easy data
    manipulation, aggregation, and visualization.

    *   `Seaborn` is for data visualization of statistical models through heatmaps
    and aggregrates.

    *   `scikit-learn` provides a consistent interface for machine learning algorithms
    used in your programs.

    *   `Tkinter` is for creating a graphical user interface for Python programs.

    *   `scipy` contains modules for linear algebra, optimization, integration, and
    statistics.

    *   `matplotlib` is for data visualization through various plots and graphs.

    *   `NLTK` is a natural language toolkit, and it used for common tasks of symbolic
    and statistical natural language processing.

    *   `statsmodels` is used to conduct data exploration through the use of various
    methods of estimation of statistical models and performing statistical assertions
    and analysis.


    Now that you have seen the Python libraries that you need for the case studies,
    go ahead and install them. I created a script that does so on the Raspbian command
    line; see Figure [5-10](#484167_1_En_5_Chapter.xhtml#Fig10). Please remember that
    the code is to install on Python 2.7; your need to change the script to add a
    `3` to `pip` and make it `pip3` if you want to install all the libraries on Python
    3.


    Alert


    If you use your own script for installing the Python libraries, make sure you
    use `sudo` before the `pip install` command, as shown in the script `pipinstaller.run`
    in Listing [5-2](#484167_1_En_5_Chapter.xhtml#PC3).


    ```

    pi@raspberrypi:~/$ cat pipinstaller.run

    sudo pip install numpy | tee /home/pi/numpy.log

    sudo pip install pandas | tee /home/pi/pandas.log

