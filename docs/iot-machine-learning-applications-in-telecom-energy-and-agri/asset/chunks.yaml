  trans: '

    OceanConnect 物联网平台致力于将物联网融入人类生活的各个层面。该平台的基础是 5G 芯片组或 5G 设备，这些设备在 2G、3G 及其他物联网和
    5G 连接基础设施网络之上拥有自己的云互联网关，并与智能家居网关相结合。在此基础层之上是 OceanConnect 物联网平台，其内部包含三大核心组件。第一个组件是物联网连接管理，它位于
    2G、3G、4G 或 5G 基础设施之上，这些基础设施中包含了安装在个人住宅中的智能家居物联网网关。连接管理为这些个人智能家居网关提供了接入 OceanConnect
    物联网平台的通道。每个智能家居网关都将连接已启用的物联网设备，而物联网平台将提供设备管理服务，例如将设备添加到物联网平台或从物联网平台中移除设备。然而，即使你拥有最佳的智能网关基础设施，并结合了物联网平台上的连接管理和设备管理服务，但如果平台不具备应用使能能力，它也将毫无实际用途。正是应用程序为用户带来了实际效益，并为设备提供了稳定的
    5G 连接。因此，该物联网平台也提供应用使能服务。华为着眼于其物联网平台的商业化；它看到了在公共事业服务（如能源、水利和交通）中的应用。它也看到了工业应用，其中工业
    4.0 使工业物联网应用能够适配其物联网平台，并利用该平台提供智能工业解决方案。它还致力于打造一个与其物联网平台相连的智能家居，从而获得各种服务，如医疗保健、食品杂货管理、交通管理、财务监控与管理。OceanConnect
    物联网平台还提出了车联网的概念，这是一个由配备各种物联网传感器的小型车辆组成的网络，这些车辆能够通过相互发送数据进行通信。这样的车联网无疑将有助于使交通管理更便捷、更实时。然而，在我看来，未来还将催生出一种被称为“设备互联网”的新事物，它将是一个互联设备的网络，不仅限于车辆，而是任何使用物联网传感器的设备，这些设备能够凭借独特的应用程序接入任何物联网平台。正是这个设备互联网，将引发智能生活的革命。


    物联网的另一项前沿实现是面向所有物联网连接性的开放连接基金会。物联网当前面临、并且未来将成为主要问题的一个挑战，是社会缺乏统一的物联网标准。没有统一的物联网标准，各种物联网设备和应用将相互孤立，无法与自身之外的其它物联网设备进行通信。不过，现在已有标准来解决这个问题。参与社会标准制定的有三类人群。第一类是物联网应用的开发者。第二类是企业为其开发物联网应用的消费者群体。第三类是将物联网变为现实的物联网应用的开发者或创造者。这个面向物联网标准的开放连接基金会弥合了这三者之间的鸿沟。其关键优势在于，它为安全互操作性提供了共同定义，并提供了一个通用标准平台，以及物联网设备和应用的开源实现与认证。基于此框架的新模型层出不穷，并且每月都有发布，例如智能食品储藏室物联网设备、监控应用，以及
    OCF 目前支持的智能狗屋等创新应用。这个开放的物联网标准正在创建完整的生态系统，以使物联网更加安全可靠。


    接下来，我们进入下一部分，探讨机器学习和物联网在能源领域的一项前沿实现。我们将审视推动能源行业发展的关键技术进展。


    ## 机器学习和物联网在能源领域的前沿实现


    目前，全球能源领域正经历着一场快速的技术变革。这场变革的核心是将物联网和机器学习引入全球能源系统。然而，物联网和机器学习的采用并不像在电信领域那样直接。这不仅仅是创造新的频谱领域并加以利用的问题。能源行业传统上是一个资本密集型产业，无论是石油、天然气、水力发电，还是太阳能或风能等可再生能源。能源领域的这一特性使其成为物联网和机器学习等技术的缓慢采用者。真正的原因是，大多数能源公司使用大量的能源设备，而建造和安装这些工厂需要花费数十亿美元。


    ### 物联网在能源领域的现状


    该领域面临的实际挑战在于如何利用物联网并改造旧的能源系统。对于能够使用 Modbus 接口等协议进行通信的能源设备，实施起来很容易。能源领域中那些无法使用通用工业接口进行通信的非常陈旧的设备，对任何能源公司来说无疑都是一个巨大的挑战。替换正在生产中的机械工厂的某些部件并非易事，因为这些能源系统不能停机。在无法轻易更换工厂设备的情况下，物联网和机器学习必须采用创新方法来读取此类老旧设备的数据。毕竟，机器学习需要数据来分析和预测能源领域的问题。

    '
- fmt: '# Solutions for Embracing the IoT in the Energy Domain


    There are several companies around the world that are trying to develop solutions
    for this old equipment using new IoT sensor-based technology to capture data.
    The prominent one is Siemens (`https://new.siemens.com/us/en/products/energy/featured-topics/redefine-performance.html`).
    The key problems faced by the energy sector are the following:


    1. Renewable energy plants are rising. This is happening in two ways. One is by
    old fossil fuel energy generation plants being replaced by solar or wind energy
    firms. The second is by the new energy plants being added to the grades which
    are renewable in nature.


    Decentralizing of energy operations is happening and this means that the power
    plant units are becoming more and more independent in order to generate energy.
    The old way of making energy, like oil and gas, required a centralized plant facility
    that would help create them. However, renewable energy generation systems like
    solar grids and wind grades allow the decentralization of energy generation. Decentralization
    allows the plans for energy generation to be operated in a small facility and
    also to make independent decisions more conveniently for localized community energy
    needs. Centralization gives the energy companies the freedom to spread their operations
    across geographies and use technology with the IoT and machine learning in order
    to generate energy. Decentralization does bring challenges for making use of economies
    of scale; however, it is compensated by the ability to make fast and localized
    decisions on energy generation and the flexibility that it brings along with it.
    The localized small energy generation unit can make decisions very quickly on
    when to cut the power generation or up the power generation based on the consumption
    pattern it observes using techniques like machine learning or deep learning. The
    ability to adjust the energy needs becomes the key differentiating factor for
    establishing decentralized energy generation units for the future.


    2. We all know that the energy needs of humans, especially oil and gas, are increasing
    around the world and the power plants are being forced to perform outside of their
    original build specifications. This is a serious threat for the future as the
    capacity for the plans has already been breached and there is a stress on their
    operations for the future. There are various techniques that companies are adopting;
    some are using renewal energy plants beside the fossil fuel plants whereas others
    are increasing the capacity of existing fossil fuel plants.


    3. A problem that most countries face is that of stabilization of the energy power
    grid and for that they need to have a good system that is able to predict energy
    needs well in advance for any part of the grade so that they can increase or decrease
    the energy generation before a spike or a bust happens. Blackouts can create problems
    for industries and citizens who are dependent on energy for their operations.
    So most countries are planning operations that will help them be more productive
    regarding the energy generation requirements of their communities. Having a stable
    grid for energy generation reduces the cost by providing a stable power economy
    versus if there is an unstable grade; the latter worsens the cost of energy generation
    and has a deeper economic impact on the community.


    Siemens, a company that deals with the power plant and energy generation technologies,
    has conducted a survey of its clients on futureproofing the power plant with its
    energy domain. See `https://assets.new.siemens.com/siemens/assets/public.1552332517.656a83b0-646a-4286-9546-dc54bd8a2e35.future-proofing-power-plant-ebook-2019.pdf`.
    Customers in the survey talk about the future utility challenges that power plants
    anticipate facing in the next three years. The second problem mentioned by 30%
    of the respondents concerns adopting new AI technologies. This shows that the
    energy generation companies see challenges around adopting artificial intelligence
    machine learning and the IoT in their current environment. The outlook given in
    the survey was that of next three years, so it’s a short-term outlook. In the
    question on success through planning and data analytics, a field that is closely
    associated with data science and machine learning, it asked its customers how
    successful plant modification and update projects have been in the past three
    years; the responses from the companies that are delivering plant operational
    objectives show that over 50% of them met this target. However, the major point
    that comes out of the survey is that the energy generators are investing heavily
    in planned upgrades and modifications including new digital technologies, but
    the confidence levels in deciding on modification and upgrades stands around 20
    to 27% for prioritizing it and 203% for deciding which partners should be involved
    in such an upgrade project and between 18 to 33% for deciding when the investment
    should be made or at what point of time that investment should be made. The overall
    level of success reported by the upgrade projects in the past three years is around
    25%, which means that although upgrade projects have been adopted by the energy
    generation companies, they have met with very little success and there is a high
    failure rate.


    So we have seen that the energy sector is in a state of flux, with many companies
    being forced to upgrade their plans to more renewable energy sources like solar
    and wind; however, the success rate of such project upgrades is very low, leading
    to depletion in the return on investments. The adoption of technologies like machine
    learning and artificial intelligence is a challenge, as pointed out in the survey,
    and this means that the sector is less prepared to adapt and use these technologies
    to its advantage. But in any state-of-the-art implementation, a company like Siemens
    provides solutions by using IoT sensors and devices and connecting them to machine
    learning models in order to predict the energy demands in any grid. This innovative
    solution can be applied even to fossil fuel energy plants and to old data stores
    to analyze and synthesize data to create prediction models. From predicting the
    periodic maintenance cycles of plants and equipment to predicting energy spikes,
    the machine learning models are being used by companies in order to solve legacy
    problems (`https://assets.new.siemens.com/siemens/assets/public.1534921431.05f93d5a3c096441998512706a42840c51fd3f68.2018-05-ew-article-iot-manfred-unterweger-en.pdf`).'
  raw: '### Solutions for Embracing the IoT in the Energy Domain


    There are several companies around the world that are trying to develop solutions
    for this old equipment using new IoT sensor-based technology to capture data.
    The prominent one is Siemens ([`https://new.siemens.com/us/en/products/energy/featured-topics/redefine-performance.html`](https://new.siemens.com/us/en/products/energy/featured-topics/redefine-performance.html)).
    The key problems faced by the energy sector are the following:


    1.  Renewable energy plants are rising. This is happening in two ways. One is
    by old fossil fuel energy generation plants being replaced by solar or wind energy
    firms. The second is by the new energy plants being added to the grades which
    are renewable in nature.


    Decentralizing of energy operations is happening and this means that the power
    plant units are becoming more and more independent in order to generate energy.
    The old way of making energy, like oil and gas, required a centralized plant facility
    that would help create them. However, renewable energy generation systems like
    solar grids and wind grades allow the decentralization of energy generation. Decentralization
    allows the plans for energy generation to be operated in a small facility and
    also to make independent decisions more conveniently for localized community energy
    needs. Centralization gives the energy companies the freedom to spread their operations
    across geographies and use technology with the IoT and machine learning in order
    to generate energy. Decentralization does bring challenges for making use of economies
    of scale; however, it is compensated by the ability to make fast and localized
    decisions on energy generation and the flexibility that it brings along with it.
    The localized small energy generation unit can make decisions very quickly on
    when to cut the power generation or up the power generation based on the consumption
    pattern it observes using techniques like machine learning or deep learning. The
    ability to adjust the energy needs becomes the key differentiating factor for
    establishing decentralized energy generation units for the future.


    2.  We all know that the energy needs of humans, especially oil and gas, are increasing
    around the world and the power plants are being forced to perform outside of their
    original build specifications. This is a serious threat for the future as the
    capacity for the plans has already been breached and there is a stress on their
    operations for the future. There are various techniques that companies are adopting;
    some are using renewal energy plants beside the fossil fuel plants whereas others
    are increasing the capacity of existing fossil fuel plants.


    3.  A problem that most countries face is that of stabilization of the energy
    power grid and for that they need to have a good system that is able to predict
    energy needs well in advance for any part of the grade so that they can increase
    or decrease the energy generation before a spike or a bust happens. Blackouts
    can create problems for industries and citizens who are dependent on energy for
    their operations. So most countries are planning operations that will help them
    be more productive regarding the energy generation requirements of their communities.
    Having a stable grid for energy generation reduces the cost by providing a stable
    power economy versus if there is an unstable grade; the latter worsens the cost
    of energy generation and has a deeper economic impact on the community.


    Siemens, a company that deals with the power plant and energy generation technologies,
