    在图 9-2 至 9-8 中，我们可以看到箱线图显示 `Crop_in_tonnes` 的值分布非常分散。避免这种情况的一种方法是对所有数值变量进行缩放，就像我在我的书《*使用
    Python 的机器学习应用*》中针对医疗、零售和金融案例研究解决方案中所做的那样。直方图显示了变量的分布，我们看到除铜和铁外，大多数土壤养分都呈右偏态。我们还注意到，通过
    Python 代码 `df.plot.hexbin(x=''Yield_per_ha'', y="Soil_pH", gridsize=20)`，`Yield_per_ha`
    和 `Soil_pH` 的散点图密切相关。在完成通常的数据准备步骤，将其划分为名为 `cropyield` 的目标变量和包含所有其他特征的特征变量后，我们将数据集拆分为训练集和测试集，其中
    360 个样本属于训练集，91 个样本属于测试集。之后，我们加载 `linear_model` Python 库，通过 Python 代码 `regr.fit(X_train,y_train)
    , y_pred= regr.predict(X_test)` 在训练集和测试集上执行线性回归算法。然后，在开始进行预测之前，我们通过代码 `print("Variance
    score: %2f" % r2_score(y_test, y_pred))` 查看测试集获得的准确率分数，该分数为 0.9502，即 95.02% 的准确率。由于这个结果不错，我们可以继续进行预测。请记住，这是虚构数据，因此我们能够达到良好的准确率水平。然而，在现实世界中，您可能需要运行更多的回归器或微调您的数据收集工作，才能达到这样的准确率水平。


    为了进行预测，使用的代码是 `predicted= regr.predict([[26,1500,6.8,0.9,367,32,490,35]])`，这些是
    Aystsaga Agro 正在评估的另一国家的一块农业用地的值，其特征如下：


    ```

    landsize_in_ha      26

    Crop_in_tonnes      1500

    Soil_pH             6.8

    Organic Carbon %    0.9

    Nitrogen kg/ha      367

    Phosphorus kg/ha    32

    Potassium kg/ha     490

    Sulphur kg/ha       35

    ```


    Glanzo 想从模型中知道，在他们购买这块农田后，可能的年产量是多少。Python 程序给出的值为每公顷 75.2637 吨，如清单 9-3 所示。


    ```

    predicted= regr.predict([[26,1500,6.8,0.9,367,32,490,35]])

    print(predicted)

    [[75.26373654]]

