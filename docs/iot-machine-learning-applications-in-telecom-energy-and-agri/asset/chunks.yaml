  trans: "\n\n![](img/978-1-4842-5549-0_CoverFigure.jpg)\n\nISBN 978-1-4842-5548-3e-ISBN\
    \ 978-1-4842-5549-0 [`doi.org/10.1007/978-1-4842-5549-0`](https://doi.org/10.1007/978-1-4842-5549-0)\
    \ © Puneet Mathur 2020 Apress Standard 本出版物中使用通用描述性名称、注册商标、商标、服务标记等，即使未作特别声明，也不意味着这些名称不受相关保护法律和法规的约束，因此可自由通用。出版商、作者和编辑假定本书中的建议和信息在出版之日是真实准确的。出版商、作者或编辑均不对本书所含材料或可能存在的任何错误或遗漏提供明示或暗示的担保。出版商对已出版地图中的管辖权主张和机构归属保持中立。本书通过\
    \ Springer Science+Business Media New York 在全球图书贸易中发行，地址：233 Spring Street, 6th\
    \ Floor, New York, NY 10013。电话：1-800-SPRINGER，传真：(201) 348-4505，电子邮件：orders-ny@springer-sbm.com，或访问\
    \ www.springeronline.com。Apress Media, LLC 是加利福尼亚州的一家有限责任公司，其唯一成员（所有者）是 Springer\
    \ Science + Business Media Finance Inc (SSBM Finance Inc)。SSBM Finance Inc 是一家特拉华州公司。\n\
    \n*本书献给至高无上的神圣母亲。*\n\n引言\n\n2019 年 1 月下旬，在参加完一场关于物联网的会议后，我在孟买会见了一位潜在客户，讨论在工厂环境中使用机器学习。他想知道机器学习能否在他的环境中使用，如果能，实施后他能期待获得什么样的商业利益。我与他讨论了一些涉及工业物联网（IIoT）应用的用例。在商业中，有两种策略：一种是收入增长，另一种是成本降低。如果你的业务正处于高速增长期，那么你可能不会太在意成本降低，你的重点将是扩展业务。然而，如果你的业务多年来增长稳定，并且面临激烈竞争，那么你面临的压力就不仅仅是维持现有客户，还要降低成本，以便在竞争中胜出。我的客户正处于这种业务模式中。我向他展示的大多数用例都是关于收入增长的，这并不符合他的期望。但是，一个利用\
    \ IIoT 在他的工厂进行能源审计的用例引起了他的注意，他解释说他的电费账单很高，希望我实施能源审计来帮助降低成本。他接下来的一连串问题涉及，与实施解决方案所需的投资相比，他能期待实现多少成本降低。我为他制定了一个包含实施计划的小型方案，该方案在他的公司内部得到了良好反响，尽管这是我们第一次在工厂环境中进行此类尝试。\n\
    \n本书介绍了其中一种解决方案，尽管并非完整的方案（完整的方案需要另一本书来阐述）。但本书中的解决方案将帮助你入门，使用机器学习进行物联网和工业物联网应用。\n\
    \n致谢\n\n我感谢在电信公司、高科技农业农场和能源领域工作的各位工程师，他们主动分享了关于其运营需要进一步改进以及人工智能可以提供帮助的信息；我通过个人和在线方式进行了匿名调查。我还要感谢来自\
    \ ABB、GE 等跨国公司的多位公司专家，他们就本书相关主题进行了讨论并提供了宝贵建议。\n\n本书中的所有数据均已匿名处理，并非取自任何特定公司、情况或来源。与实际数据的任何相似之处纯属巧合。本书中的数据集基于我与客户和工程师合作的经验；但我已注意不从中获取任何此类数据，并且完全不存在任何抄袭。\n\
    \n包括无人机和能源设备在内的仪器和传感器未得到任何公司的赞助，我也没有因使用某种设备而获得任何费用或任何形式的激励。本书中使用的所有设备和传感器的选择完全基于我独立的判断和经验。\n\
    \n关于作者 关于技术审校者\n\n# 1. 入门指南：必要的软件和硬件\n\n本章将带你进入单板计算机（SBC）的世界。你们中的许多人可能是第一次听到这个术语，可能会好奇什么是\
    \ SBC 以及它的用途。本章将解释 SBC 及其历史发展。你还将了解市场上最流行的 SBC，例如 Banana Pi、Raspberry Pi 和 Arduino。通过深入比较，我将解释流行\
    \ SBC 在 USB、存储、网络和通信方面的特性。\n\n然后，你将学习 Raspberry Pi，更具体地说是 Raspberry Pi 3 Model\
    \ B+，因为你将在本书的物联网和工业物联网项目中将其用作主节点。你还将深入了解 Raspberry Pi 上的 GPIO（通用输入/输出）引脚及其用途。接着，你将学习单板微控制器（SBM），它与单板计算机不同。在物联网和工业物联网应用中，单板微控制器通常用作\
    \ Raspberry Pi 等单板计算机的从设备。最流行的单板微控制器是 Arduino，你将通过详细的表格形式了解 SBM 的类型，涵盖其处理器、I/O\
    \ 模块、频率、电压等。\n\n然后，你将了解 Arduino Mega 2560 及其布局，并学习其 GPIO 引脚。接下来，你将学习本书最重要的主题：物联网传感器及其类型和应用。你将在案例研究解决方案中使用其中一些传感器。此外，还将涵盖无人机的主题，因为它们可用于为电信应用收集数据。请注意，在大多数国家/地区，飞行无人机需要许可证，在尝试将其用于任何项目之前，你应遵守相关规定。你还将了解\
    \ Modbus 设备以及如何使用它来构建商业应用。最后，你将学习运行所有这些设备的软件程序。\n\n注意\n\n本书通篇使用 Python 3.x 版本。如果你使用的是较旧版本的\
    \ Python，代码示例可能无法运行。你需要 Python 3.x 或更高版本才能成功运行它们。\n\n## 硬件要求\n\n要运行本书中的练习，你需要以下硬件：\n\
    \n*   **Raspberry Pi 3 Model B+**\n\n*   **Arduino Mega 2560**\n\n*   **用于输出 Raspberry\
    \ Pi 3 Model B+的 LCD/LED 屏幕**\n\n*   **单相电能表：Modbus 220/230V，双向，多功能，RS485，脉冲/Modbus\
    \ 输出**\n\n*   **无人机：工业级，重型负载，满足以下规格：**\n    *   **最大有效载荷：1.5 千克（3.5 磅）**\n\n \
    \   *   **航程：5 公里**\n\n    *   **飞行时间：至少 30 分钟**"
- fmt: '### Single-Board Computer


    A single-board computer is a completely functional computer set on a single printed
    circuit board. What makes this type of computer unique is that the entire input,
    output, and processing such as graphics and numeric calculations all happen on
    the same board. While a `SBC` can be built as a high computing server, a more
    popular version of this type of computer is a small and compact machine.


    Historically, `SBC`s were built to be educational and compact; now they are used
    in mainstream commercial applications.


    Single-board computers are built on different microprocessors but they are all
    of a simple design. They are built to be handy and compact. Running a fast computer
    that occupies very little space and is stable and also portable adds to the charm
    of owning these machines.


    One of the early implementations (May, 1976) of single-board computer was called
    the Diana micro; it was based on the Intel `C8080A` processor and was a very popular
    home computer as part of the BigBook series of computers. With the expansion of
    the PC market, the `SBC` did not progress further until now, when the PC has almost
    been replaced by tablets, laptops, and mobiles. You can go to [`https://en.wikipedia.org/wiki/Single-board_computer`](https://en.wikipedia.org/wiki/Single-board_computer)
    for more information.


    Some of the advantages of using `SBC`s are shown in Table [1-1](#484167_1_En_1_Chapter.xhtml#Tab1).


    **Table 1-1** SBC Features and Advantages


    | Features | Advantage |

    | --- | --- |

    | Price | `SBC`s are available for under $30 each today. |

    | Form factor | `SBC`s are very small, almost the size of a palmtop, which makes
    them portable and handy to use. |

    | Operating system | Linux variants are most popular. Windows IoT |

    | Architecture | Two variants: slot support and no slot support. |

    | Power efficiency | High |


    The main reason for the popularity of single-board computers is the price because
    they are available for under $30 each. Another perk is their compact and handy
    form factor; they fit the palm of the hand. There are variants that run Linux
    or Windows IoT or other operating systems. Most of the `SBC`s do not come with
    slot support; however, some do to support putting industrial grade cards on them.
    These small machines are highly efficient in terms of power and can run on home
    power single phase connections efficiently. Unless you want to plug them into
    a big LED or LCD screen, they do not need a separate power supply for the screen.
    They have their own 5-inch or 7-inch LED/LCD flat screens, which can be powered
    off the `SBC` itself. There is a flexibility of covers where the single boards
    can be put inside. From transparent ones to stylish cases to housing for clusters
    of 4 or 7 `SBC`s, there is a wide range of options to choose from for today’s
    `SBC`s. This availability has extended the appeal of these computers by giving
    the user the DIY sense of achievement. From choosing the case to installing the
    operating system to using other types of software, everything is flexible and
    there are many options to choose from. Now let’s look at the most popular `SBC`s
    on the market and their development.


    ### Popular Single-Board Computers on the Market


    Table [1-2](#484167_1_En_1_Chapter.xhtml#Tab2) lists some of the most popular
    `SBC`s on the market, per [`https://en.wikipedia.org/wiki/Comparison_of_single-board_computers#Operating_system`](https://en.wikipedia.org/wiki/Comparison_of_single-board_computers%2523Operating_system).


    **Table 1-2** Popular Single-Board Computers


    | Name | PCIe | USB[2] | Storage | Networking | Communication | Generic I/O |

    | --- | --- | --- | --- | --- | --- | --- |

    | 2 | 3 | Device | On-board | Flash slots | SATA | Eth. | Wi-Fi | Bt. | I²C |
    SPI | GPIO | Analog |

