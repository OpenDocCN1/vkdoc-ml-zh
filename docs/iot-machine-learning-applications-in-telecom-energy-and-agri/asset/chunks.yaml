    如你所见，代码实现完全遵循第 3 章中机器学习代码实现的思路。但请注意，其结果和输出与第 3 章的解决方案截然不同。


    由于我们正在复现第 3 章中的机器学习代码，我将简要描述该问题的解决方案。理解蒸汽轮机至关重要，因此我们将其作为本案例研究解决方案的一部分进行探讨。


    火力发电厂的原动机介质是蒸汽。简单来说，水被加热后转化为蒸汽，在蒸汽轮机中旋转，进而驱动发电机。之后，蒸汽通过涡轮机并在冷凝器中冷凝；这被称为朗肯循环。


    蒸汽轮机始终在高蒸汽压力环境下运行，并拥有大量高速运动部件。喷嘴（进口和出口阀门）以及涡轮叶片均经过仔细分析设计，其部件制造精度极高。


    蒸汽轮机发电厂通常可实现高达 95% 的可用性，并且两次停机维护和检查之间的运行时间可超过一年。其非计划或强制停机率通常低于 2%，即每年少于一周。在我们的案例研究中，经过对整个电厂数据的仔细分析，包括机器学习工程师
    Carl 在内的团队中的电厂制造工程师将异常停机问题缩小到蒸汽轮机的故障。


    在清单 8-1 中，我们首先导入 pandas 和 sqlite3 等库以连接数据库。数据库名为 `powerplant.db`，表名为 `TURBINE_INLET_DATASET`。我们利用这些信息，首先通过
    `sqlite3.connect()` 建立与数据库的连接，然后使用代码 `pd.read_sql_query("select * from TURBINE_INLET_DATASET;",
    conn)` 读取表 `TURBINE_INLET_DATASET` 中的所有行，从而连接到我们的电厂数据集。成功将数据从数据库读取到 pandas 数据框
    `df` 后，我们通过 `df.columns`、`df.shape` 和 `df.dtypes` 语句查看其结构。之后，我们通过代码 `df.tail(1)`
    查看最后一行；我们也可以使用 `df.head(1)` 来查看第一行。这仅用于进行完整性检查，以确认数据是否已正确加载。下一步是检查数据集中是否存在缺失值，由于本案例中用于监测蒸汽轮机进口和出口阀门的仪器是
    Vibro Meter（振动计），它测量蒸汽轮机内阀门系统的声音和电气输入等值，因此缺失值的可能性较小。使用的代码是 `print(df.isnull().any())`，在我们的案例中，由于任何列中都没有空值，因此输出结果为
    False。通过此数据检查后，我们就可以对电厂数据集进行探索性数据分析。在实际工作中，你需要合并来自物联网传感器和设备（如 Vibro Meter）的数据，以及蒸汽轮机监控软件（如
