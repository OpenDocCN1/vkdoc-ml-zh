    ```

    SQLite version 3.16.2 2017-01-06 16:32:41

    Enter ".help" for usage hints.

    sqlite> .databases

    sqlite> .dbinfo

    sqlite> .tables

    sqlite>

    Listing 3-6

    Code for Database Information for SQLite3

    ```'
