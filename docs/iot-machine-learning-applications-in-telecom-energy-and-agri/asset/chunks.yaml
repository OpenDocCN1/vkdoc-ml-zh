    execute any code and enjoy the execution of the IoT with machine learning along
    with Arduino. But here you are setting up all the infrastructure software and
    hardware that you need to get up and running for the case studies ahead.


    However, before proceeding to the execution in the next chapter, I urge you to
    go back to Chapter [3](#484167_1_En_3_Chapter.xhtml) and execute all the code
    for testing your Python libraries given in Figure [3-3](#484167_1_En_3_Chapter.xhtml#Fig3),
    the Hello world Python code that tests the installed libraries on your Raspbian.
