    \ a Delaware corporation.\n\n*This book is dedicated to the Supreme Divine Mother.*\n\
    \n# Introduction\n\nIn late January of 2019, after attending a conference on IoT,\
    \ I met a potential client in Mumbai regarding the use of machine learning in\
    \ a factory setting. He wanted to know if machine learning could be used in his\
    \ environment and, if so, what kind of business benefit could he look forward\
    \ to in its implementation. I discussed a few use cases with him which involved\
    \ the use of Industrial Internet of Things (IIoT). In business, there are two\
    \ types of strategies: one is revenue growth and the other is cost reduction.\
    \ If you are in a business where there is high revenue growth taking place, then\
    \ you would not bother much about cost reduction. Your focus would be to expand\
    \ your business. However, if you are seeing steady growth for a number of years\
    \ and you have stiff competition, then the pressure on you is to not just to maintain\
    \ your existing customers but also to reduce cost so that you can beat the competition.\
    \ My client was in this mode of business. Most of the use cases I showed him were\
    \ of revenue growth, which did not meet his expectation. However, the use case\
    \ of doing an energy audit in his factory using IIoT caught his attention and\
    \ he explained that he had a large electricity bill and he wanted me to implement\
    \ an energy audit to help reduce cost. His next set of questions involved how\
    \ much of cost reduction he could look forward to versus the investment that was\
    \ needed to implement the solution. I gave him a small workout with a plan for\
    \ its implementation, which was received well within his company, although we\
    \ were doing this for the first time in a factory setting.\n\nThis book features\
    \ one of those solutions, although not the complete one as it would need a separate\
    \ book to do so. But the solutions in this book will help you get started in IoT\
    \ and IIoT using machine learning.\n\n# Acknowledgments\n\nI acknowledge the various\
    \ engineers working at telecom companies, hi-tech agricultural farms, and in the\
    \ energy sector who came forward to share information on how their operations\
    \ needed further improvements and where AI could help; I used anonymous surveys\
    \ conducted through personal and online means. I would also like to thank various\
    \ company experts from multinationals like ABB, GE, and others who came forward\
    \ to discuss topics related to this book, which needed their suggestions.\n\n\
    All the data in this book is anonymized and is not taken from any particular company,\
    \ situation, or source. Any resemblance to actual data is only a coincidence.\
    \ The datasets in this book are based on my experience working with clients and\
    \ engineers; however, I have taken care to not take any such data from them and\
    \ it is completely clean of any plagiarism.\n\nThe instruments and sensors including\
    \ the drone and energy devices are not sponsored by any company nor did I get\
    \ any fee or any incentive of any kind to use one over the other. The choice of\
    \ all devices and sensors used in this book is entirely based on my independent\
    \ judgement and experience.\n\n# About the Author About the Technical Reviewer\n\
    \n# 1. Getting Started: Necessary Software and Hardware\n\nThis chapter will introduce\
    \ you to the world of single-board computers (SBCs). Many of you, hearing this\
    \ term for the first time, may wonder what an SBC is and what it is used for.\
    \ This chapter will explain SBCs and how they have developed historically. You\
    \ will also learn about the most popular SBCs on the market such as Banana Pi,\
    \ Raspberry Pi, and Arduino. In an in-depth comparison, I will explain the features\
    \ of popular SBCs with regards to USB, storage, networking, and communication.\n\
    \nYou will then learn about the Raspberry Pi and more specifically the Raspberry\
    \ Pi 3 Model B+ because you are going to use it as a master node in the IoT and\
    \ IIoT projects in this book. You will also find an in-depth explanation of the\
    \ GPIO (general purpose input/output) pins located on the Raspberry Pi and their\
    \ uses. You will then learn about single board micron rollers (SBMs), which are\
    \ different from single-board computers. The single-board microcontrollers in\
    \ IoT and IIoT applications are generally used as slaves to the single-board computers\
    \ like Raspberry Pi. The most popular single-board microcontroller is the Arduino,\
    \ and you will look at the types of SBMs in a detailed tabular format covering\
    \ their processors, I/O modules, frequency, voltage, etc.\n\nYou will then look\
    \ at Arduino Mega 2560 and its layout and learn about its GPIO pins. Next, you\
    \ will learn about the most important topic of the book: IoT sensors and their\
    \ types and applications. You will use some of them in the case study solutions.\
    \ Also covered is the topic of drones because they can be used to collect data\
    \ for a telecom application. Please note that flying drones requires a license\
    \ in most countries and you should comply before trying to use one for any project.\
    \ You will also learn about an Modbus device and how it is used to build a commercial\
    \ application. Lastly, you will learn about the software programs that run all\
    \ of these devices.\n\n**Note**\n\n`Python` version 3.x is used throughout the\
    \ book. If you have an older version of `Python`, the code examples may not work.\
    \ You need `Python` 3.x or later to be able to run them successfully.\n\n## Hardware\
    \ Requirements\n\nFor running the exercises in this book you will need the following\
    \ hardware:\n\n*   **Raspberry Pi 3 Model B+**\n\n*   **Arduino Mega 2560**\n\n\
    *   **LCD/LED screen to output Raspberry Pi 3 Model B+**\n\n*   **Single phase\
    \ energy meter: Modbus 220/230V, bidirectional, multi-function, RS485, pulse/Modbus\
    \ output**\n\n*   **Drone: Industrial grade, heavy lifting which meets these specifications:**\n\
    \    *   **Max payload: 1.5 kg (3.5 pounds)**\n\n    *   **Range: 5 km**\n\n \
    \   *   **Time to fly: At least 30 mins**"
