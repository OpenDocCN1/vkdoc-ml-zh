- fmt: '# Coding for the EM6400 Energy Meter


    Installing the Modbus libraries in the Arduino IDE is the first step before you
    start running any code. This is required so that you get some of the C language
    header files. `ModbusMaster.h` and `SPI.h` and other libraries are available to
    communicate with Modbus through the Arduino slave to your energy meter. You can
    open the libraries as shown in Figures [6-1](#484167_1_En_6_Chapter.xhtml#Fig1)
    through [6-3](#484167_1_En_6_Chapter.xhtml#Fig3).


    ![../images/484167_1_En_6_Chapter/484167_1_En_6_Fig1_HTML.jpg](images/484167_1_En_6_Chapter/484167_1_En_6_Fig1_HTML.jpg)


    Figure 6-1


    Opening the Manage Libraries menu


    Open the Manage libraries menu from Menus Sketch ➤ Include Library ➤ Manage Libraries
    or use the keyboard shortcut of Control + Shift + I. The Library screen will open
    up, as shown in Figure [6-2](#484167_1_En_6_Chapter.xhtml#Fig2).


    ![../images/484167_1_En_6_Chapter/484167_1_En_6_Fig2_HTML.jpg](images/484167_1_En_6_Chapter/484167_1_En_6_Fig2_HTML.jpg)


    Figure 6-2


    Opening the Library Manage section in the Arduino IDE


    Now you have the library manager, which is the repository maintained inside the
    Arduino IDE for libraries installed in its environment. The wonderful things for
    a developer is that you do not need to worry about where you files are stored
    or kept or the paths associated with them. The library manager does the job itself;
    you just need to include the libraries exposed by it in your code. In your case,
    you need the Modbus library, which provide the two header files noted earlier,
    so your Arduino program can communicate with the energy meter. Type `Modbus` in
    the “Filter your search” field and press Enter to allow the library manager to
    get you all the libraries that have Modbus within their description. This is shown
    in Figure [6-3](#484167_1_En_6_Chapter.xhtml#Fig3).


    ![../images/484167_1_En_6_Chapter/484167_1_En_6_Fig3_HTML.jpg](images/484167_1_En_6_Chapter/484167_1_En_6_Fig3_HTML.jpg)


    Figure 6-3


    Filter search for Modbus libraries


    As you can see in Figure [6-3](#484167_1_En_6_Chapter.xhtml#Fig3), there’s a listing
    of many libraries with Modbus in their name. You just need the first one, ArduinoModbus
    by Arduino, version 1.0.1. Note that you may see a different version when you
    do this in your IDE because the Arduino organization keeps updating its libraries
    by fixing bugs and offering enhancements to its users. After you have installed
    this Modbus library by clicking the Install button below its description, you
    will see a screen message saying “INSTALLED,” as it says in Figure [6-3](#484167_1_En_6_Chapter.xhtml#Fig3).
    Note that the “Install” button is greyed out because I already have it installed
    in my environment. After you have successfully done this, you can close the library
    manager window and return to your code window in the Arduino IDE, as shown in
    Figure [6-4](#484167_1_En_6_Chapter.xhtml#Fig4).


    ![../images/484167_1_En_6_Chapter/484167_1_En_6_Fig4_HTML.jpg](images/484167_1_En_6_Chapter/484167_1_En_6_Fig4_HTML.jpg)


    Figure 6-4


    Loading the code file named `modbus01_EM6400_Tested.ino`


    In the first few lines of code you see the include statement `#include <ModbusMaster.h>`.
    This is the library that has now loaded. After the include statements, you move
    ahead to declare the global variables, as shown in Listing [6-1](#484167_1_En_6_Chapter.xhtml#PC1).


    ```

    // ****** GLOBALS ******

    ModbusMaster node;  // instantiate ModbusMaster object

    float reg1;         // will store the float value found at 3910/3911

    float reg2;         // will store the float value found at 3914/3915

    int low_word;       // this will hold the low 16-bit resgter value after a read

    int high_word;      // this will hold the high 16-bit resgter value after a read

    Listing 6-1

    Code for Declaring Global Variables

    ```


    The first global variable is `reg1`, which is a float type variable to store the
    value in registers 3910 and 3911 from the Conzerv EM6400 Energy Meter. The registers
    are the actual places where values of various energy parameters are found through
    the Modbus protocol. This information is given in the user manual by Schnieder
    Electric for the EM6400 at the official URL: [`www.schneider-electric.com/resources/sites/SCHNEIDER_ELECTRIC/content/live/FAQS/345000/FA345958/en_US/EM%206433%20series%20Communication.pdf`](http://www.schneider-electric.com/resources/sites/SCHNEIDER_ELECTRIC/content/live/FAQS/345000/FA345958/en_US/EM%25206433%2520series%2520Communication.pdf).
    This manual also gives you a simple way to test your protocol using free software
    under heading “Communication Test” on Page 55. You can try this on your own; it’s
    beyond the scope of this book so I leave it up to you. The good thing is that
    the manual describes the entire process with screenshots and it’s extremely easy
    to understand. Page 57, under the heading “Data Address” gives a detailed table
    with various electrical data parameters that the energy meter can transmit through
    Modbus protocol. This table has the individual parameter address and provides
    information on the register address number that you need to get that particular
    data. For example, for the data value of Line to Neutral Voltage value (VLN) the
    register address is 3911. The type of value is float so you use a corresponding
    variable in the code (Figure [6-5](#484167_1_En_6_Chapter.xhtml#Fig5)) as `float
    reg1` for register addresses 3910 and 3911 and `float reg2` for storing the values
    of registers 3914/3915. Please note each register is 16 bits so it will have a
    high word and low word each, so you declare the global variables `int low_word;`
    and `int high_word;` after it is read from the energy meter through the Arduino
    Mega 2560. Now that you understand the concept of registers and how data is transmitted
    back from the energy meter through the Arduino Mega, you can look at a union structure
    for converting them to float values. This is given in Listing [6-2](#484167_1_En_6_Chapter.xhtml#PC2).


    ```

    // converting to floating point - union structure

    union u_tag {

    int bdata[2];

    float flotvalue;

    } uniflot;

    Listing 6-2

    Union Structure to Store Register Values from the Energy Meter

    ```


    Here you declare an array of `int variable bdata[2]`, which stores two values:
    the high and low words from a register. The float variable `flotvalue` is the
    one that actually converts and stores the values into a float data type because
    the actual value that it will be getting is a float data type, which is needed
    for the program to work. Usage of this union structure will become much clearer
    during the `loop()` function of the code, which is later. Now let’s declare some
    functions that are going to help you complete the process of communicating with
    the energy meter using the Modbus interface protocol. The sequence of communication
    is given in Figure [6-5](#484167_1_En_6_Chapter.xhtml#Fig5).


    ![../images/484167_1_En_6_Chapter/484167_1_En_6_Fig5_HTML.png](images/484167_1_En_6_Chapter/484167_1_En_6_Fig5_HTML.png)


    Figure 6-5


    Communication between the Arduino Mega 2560 and the energy meter


    As you can see, there are three transmissions that happen between the Arduino
    Mega and the energy meter. First there is a pre-transmission, then there is the
    actual data transmission, and then after the data is communicated back from the
    energy meter to the Arduino there is a post-transmission. This cycle is important
    to understand because the code is divided into these three sequences.'
  raw: '## Coding for the EM6400 Energy Meter


    Installing the Modbus libraries in the Arduino IDE is the first step before you
    start running any code. This is required so that you get some of the C language
    header files. `ModbusMaster.h` and `SPI.h` and other libraries are available to
    communicate with Modbus through the Arduino slave to your energy meter. You can
    open the libraries as shown in Figures [6-1](#484167_1_En_6_Chapter.xhtml#Fig1)
    through [6-3](#484167_1_En_6_Chapter.xhtml#Fig3).


    ![../images/484167_1_En_6_Chapter/484167_1_En_6_Fig1_HTML.jpg](images/484167_1_En_6_Chapter/484167_1_En_6_Fig1_HTML.jpg)


    Figure 6-1


    Opening the Manage Libraries menu


    Open the Manage libraries menu from Menus Sketch ➤ Include Library ➤ Manage Libraries
    or use the keyboard shortcut of Control + Shift + I. The Library screen will open
    up, as shown in Figure [6-2](#484167_1_En_6_Chapter.xhtml#Fig2).


    ![../images/484167_1_En_6_Chapter/484167_1_En_6_Fig2_HTML.jpg](images/484167_1_En_6_Chapter/484167_1_En_6_Fig2_HTML.jpg)


    Figure 6-2


    Opening the Library Manage section in the Arduino IDE


    Now you have the library manager, which is the repository maintained inside the
    Arduino IDE for libraries installed in its environment. The wonderful things for
    a developer is that you do not need to worry about where you files are stored
    or kept or the paths associated with them. The library manager does the job itself;
    you just need to include the libraries exposed by it in your code. In your case,
    you need the Modbus library, which provide the two header files noted earlier,
    so your Arduino program can communicate with the energy meter. Type **Modbus**
    in the “Filter your search” field and press Enter to allow the library manager
    to get you all the libraries that have Modbus within their description. This is
    shown in Figure [6-3](#484167_1_En_6_Chapter.xhtml#Fig3).


    ![../images/484167_1_En_6_Chapter/484167_1_En_6_Fig3_HTML.jpg](images/484167_1_En_6_Chapter/484167_1_En_6_Fig3_HTML.jpg)


    Figure 6-3


    Filter search for Modbus libraries


    As you can see in Figure [6-3](#484167_1_En_6_Chapter.xhtml#Fig3), there’s a listing
    of many libraries with Modbus in their name. You just need the first one, ArduinoModbus
    by Arduino, version 1.0.1\. Note that you may see a different version when you
    do this in your IDE because the Arduino organization keeps updating its libraries
    by fixing bugs and offering enhancements to its users. After you have installed
    this Modbus library by clicking the Install button below its description, you
    will see a screen message saying “INSTALLED,” as it says in Figure [6-3](#484167_1_En_6_Chapter.xhtml#Fig3).
    Note that the “Install” button is greyed out because I already have it installed
    in my environment. After you have successfully done this, you can close the library
    manager window and return to your code window in the Arduino IDE, as shown in
    Figure [6-4](#484167_1_En_6_Chapter.xhtml#Fig4).


    ![../images/484167_1_En_6_Chapter/484167_1_En_6_Fig4_HTML.jpg](images/484167_1_En_6_Chapter/484167_1_En_6_Fig4_HTML.jpg)


    Figure 6-4


    Loading the code file named modbus01_EM6400_Tested.ino


    In the first few lines of code you see the include statement `#include <ModbusMaster.h>`.
    This is the library that has now loaded. After the include statements, you move
    ahead to declare the global variables, as shown in Listing [6-1](#484167_1_En_6_Chapter.xhtml#PC1).


    ```

    // ****** GLOBALS ******

    ModbusMaster node;  // instantiate ModbusMaster object

    float reg1;         // will store the float value found at 3910/3911

    float reg2;         // will store the float value found at 3914/3915

    int low_word;       // this will hold the low 16-bit resgter value after a read

    int high_word;      // this will hold the high 16-bit resgter value after a read

    Listing 6-1

    Code for Declaring Global Variables

    ```


    The first global variable is `reg1`, which is a float type variable to store the
    value in registers 3910 and 3911 from the Conzerv EM6400 Energy Meter. The registers
    are the actual places where values of various energy parameters are found through
    the Modbus protocol. This information is given in the user manual by Schnieder
    Electric for the EM6400 at the official URL: [`www.schneider-electric.com/resources/sites/SCHNEIDER_ELECTRIC/content/live/FAQS/345000/FA345958/en_US/EM%206433%20series%20Communication.pdf`](http://www.schneider-electric.com/resources/sites/SCHNEIDER_ELECTRIC/content/live/FAQS/345000/FA345958/en_US/EM%25206433%2520series%2520Communication.pdf).
    This manual also gives you a simple way to test your protocol using free software
    under heading “Communication Test” on Page 55\. You can try this on your own;
    it’s beyond the scope of this book so I leave it up to you. The good thing is
    that the manual describes the entire process with screenshots and it’s extremely
    easy to understand. Page 57, under the heading “Data Address” gives a detailed
    table with various electrical data parameters that the energy meter can transmit
    through Modbus protocol. This table has the individual parameter address and provides
    information on the register address number that you need to get that particular
    data. For example, for the data value of Line to Neutral Voltage value (VLN) the
    register address is 3911\. The type of value is float so you use a corresponding
    variable in the code (Figure [6-5](#484167_1_En_6_Chapter.xhtml#Fig5)) as `float
    reg1` for register addresses 3910 and 3911 and `float reg2` for storing the values
    of registers 3914/3915\. Please note each register is 16 bits so it will have
    a high word and low word each, so you declare the global variables `int low_word;`
    and `int high_word;` after it is read from the energy meter through the Arduino
    Mega 2560. Now that you understand the concept of registers and how data is transmitted
    back from the energy meter through the Arduino Mega, you can look at a union structure
    for converting them to float values. This is given in Listing [6-2](#484167_1_En_6_Chapter.xhtml#PC2).


    ```

    // converting to floating point - union structure

    union u_tag {

    int bdata[2];

    float flotvalue;

    } uniflot;

    Listing 6-2

    Union Structure to Store Register Values from the Energy Meter

    ```


    Here you declare an array of `int variable bdata[2]`, which stores two values:
    the high and low words from a register. The float variable `flotvalue` is the
    one that actually converts and stores the values into a float data type because
    the actual value that it will be getting is a float data type, which is needed
    for the program to work. Usage of this union structure will become much clearer
    during the `loop()` function of the code, which is later. Now let’s declare some
    functions that are going to help you complete the process of communicating with
    the energy meter using the Modbus interface protocol. The sequence of communication
    is given in Figure [6-5](#484167_1_En_6_Chapter.xhtml#Fig5).


    ![../images/484167_1_En_6_Chapter/484167_1_En_6_Fig5_HTML.png](images/484167_1_En_6_Chapter/484167_1_En_6_Fig5_HTML.png)


    Figure 6-5


    Communication between the Arduino Mega 2560 and the energy meter


    As you can see, there are three transmissions that happen between the Arduino
    Mega and the energy meter. First there is a pre-transmission, then there is the
    actual data transmission, and then after the data is communicated back from the
    energy meter to the Arduino there is a post-transmission. This cycle is important
    to understand because the code is divided into these three sequences.'
  trans: '

    ## 为 EM6400 电能表编程


    在开始运行任何代码之前，第一步是在 Arduino IDE 中安装 Modbus 库。这是必需的，以便获取一些 C 语言头文件。`ModbusMaster.h`、`SPI.h`
    以及其他库可用于通过 Arduino 从机与您的电能表进行 Modbus 通信。您可以按照图 6-1 至 6-3 所示的方式打开这些库。


    ![../images/484167_1_En_6_Chapter/484167_1_En_6_Fig1_HTML.jpg](img/484167_1_En_6_Fig1_HTML.jpg)


    **图 6-1**

    打开管理库菜单


    从菜单栏选择 **项目（Sketch）** ➤ **包含库（Include Library）** ➤ **管理库（Manage Libraries）**，或使用快捷键
    **Control + Shift + I** 打开管理库菜单。库管理器屏幕将会打开，如图 6-2 所示。


    ![../images/484167_1_En_6_Chapter/484167_1_En_6_Fig2_HTML.jpg](img/484167_1_En_6_Fig2_HTML.jpg)


    **图 6-2**

    在 Arduino IDE 中打开库管理部分


    现在您打开了库管理器，它是 Arduino IDE 内部维护的一个仓库，用于管理其环境中安装的库。对开发者来说，美妙之处在于您无需担心文件存储在哪里，或者它们关联的路径。库管理器会自行处理这些工作；您只需在代码中包含它提供的库即可。在您的情况下，您需要
    Modbus 库，它提供了前面提到的两个头文件，这样您的 Arduino 程序才能与电能表通信。在“筛选您的搜索（Filter your search）”字段中输入
    **Modbus** 并按回车键，让库管理器为您列出所有描述中包含 Modbus 的库。如图 6-3 所示。


    ![../images/484167_1_En_6_Chapter/484167_1_En_6_Fig3_HTML.jpg](img/484167_1_En_6_Fig3_HTML.jpg)


    **图 6-3**

    筛选搜索 Modbus 库


    如图 6-3 所示，列表中列出了许多名称中包含 Modbus 的库。您只需要第一个，即由 Arduino 官方提供的 **ArduinoModbus**，版本
    1.0.1。请注意，当您在您的 IDE 中执行此操作时，可能会看到不同的版本，因为 Arduino 组织会通过修复错误和为用户提供增强功能来不断更新其库。点击其描述下方的“安装（Install）”按钮安装此
    Modbus 库后，您将看到一条屏幕消息显示“已安装（INSTALLED）”，如图 6-3 所示。请注意，“安装”按钮是灰色的，因为我的环境中已经安装了它。成功完成此操作后，您可以关闭库管理器窗口，返回到
    Arduino IDE 中的代码窗口，如图 6-4 所示。


    ![../images/484167_1_En_6_Chapter/484167_1_En_6_Fig4_HTML.jpg](img/484167_1_En_6_Fig4_HTML.jpg)


    **图 6-4**

    加载名为 `modbus01_EM6400_Tested.ino` 的代码文件


    在代码的前几行，您会看到包含语句 `#include <ModbusMaster.h>`。这就是刚刚加载的库。在包含语句之后，继续声明全局变量，如代码清单
    6-1 所示。


    ```

    // ****** 全局变量 ******

    ModbusMaster node;  // 实例化 ModbusMaster 对象

    float reg1;         // 将存储寄存器 3910/3911 中的浮点数值

    float reg2;         // 将存储寄存器 3914/3915 中的浮点数值

    int low_word;       // 读取后将保存低 16 位寄存器值

    int high_word;      // 读取后将保存高 16 位寄存器值

    代码清单 6-1

    声明全局变量的代码

    ```


    第一个全局变量是 `reg1`，它是一个浮点类型变量，用于存储来自 Conzerv EM6400 电能表的寄存器 3910 和 3911 中的值。寄存器是通过
    Modbus 协议查找各种电能参数值的实际位置。此信息在施耐德电气（Schneider Electric）为 EM6400 提供的用户手册中给出，官方网址为：[`www.schneider-electric.com/resources/sites/SCHNEIDER_ELECTRIC/content/live/FAQS/345000/FA345958/en_US/EM%206433%20series%20Communication.pdf`](http://www.schneider-electric.com/resources/sites/SCHNEIDER_ELECTRIC/content/live/FAQS/345000/FA345958/en_US/EM%25206433%2520series%2520Communication.pdf)。该手册还为您提供了一种使用免费软件测试协议的方法，位于第
    55 页的“通信测试（Communication Test）”标题下。您可以自行尝试；这超出了本书的范围，因此我留给您自己探索。好在该手册通过截图描述了整个过程，并且非常容易理解。第
    57 页的“数据地址（Data Address）”标题下提供了一个详细的表格，列出了电能表可以通过 Modbus 协议传输的各种电气数据参数。该表格包含各个参数的地址，并提供了获取特定数据所需的寄存器地址编号信息。例如，对于线对中性点电压值（VLN），寄存器地址是
    3911。该值的类型是浮点数，因此您在代码中使用相应的变量（图 6-5），即 `float reg1` 用于寄存器地址 3910 和 3911，`float
    reg2` 用于存储寄存器 3914/3915 的值。请注意，每个寄存器是 16 位的，因此每个寄存器都会有一个高字和一个低字，所以您在通过 Arduino
    Mega 2560 从电能表读取数据后，声明了全局变量 `int low_word;` 和 `int high_word;`。现在您已经理解了寄存器的概念以及数据如何通过
    Arduino Mega 从电能表传回，您可以查看一个用于将它们转换为浮点值的联合体结构。这在代码清单 6-2 中给出。


    ```

    // 转换为浮点数 - 联合体结构

    union u_tag {

    int bdata[2];

    float flotvalue;

    } uniflot;

    代码清单 6-2

    用于存储来自电能表的寄存器值的联合体结构

    ```


    这里声明了一个 `int variable bdata[2]` 数组，它存储两个值：来自一个寄存器的高字和低字。浮点变量 `flotvalue` 是实际转换并将值存储为浮点数据类型的变量，因为它将要获取的实际值是浮点数据类型，这是程序运行所必需的。这个联合体结构的用法在后面的代码
    `loop()` 函数中会变得更加清晰。现在让我们声明一些函数，这些函数将帮助您完成使用 Modbus 接口协议与电能表通信的过程。通信序列如图 6-5 所示。


    ![../images/484167_1_En_6_Chapter/484167_1_En_6_Fig5_HTML.png](img/484167_1_En_6_Fig5_HTML.png)


    **图 6-5**

    Arduino Mega 2560 与电能表之间的通信


    如图所示，Arduino Mega 和电能表之间会发生三次传输。首先是预传输，然后是实际的数据传输，最后在数据从电能表传回 Arduino 之后，是后传输。理解这个周期很重要，因为代码就是按照这三个序列来划分的。

    '
- fmt: 'You must have noticed in Chapter [5](#484167_1_En_5_Chapter.xhtml) when you
    configured the Arduino Mega board and connected the pins to it that there were
    two pins, yellow and brown, that you connected to pins marked `Rx` and `Tx`. These
    are the ones where the actual communication happens. When data is read through
    these pins, there is a chip on the Arduino Mega 2560 board named `ATMEL MEGA 16U2`
    whose LEDs light up; you can see them clearly communicating back to the Arduino
    board as a sign that your connections are correct. This, however, is not a guarantee
    that you will get back data; that depends on a number of factors such as the correct
    register and parameter numbers passed in the functions, etc. Pins 2 and 3 are
    connected to orange and green wires, respectively, on the TTL to RS485 converter
    module, which in turn is connected to the energy meter. It uses TTL communication
    to the energy meter; however, with a chip on its PCB it converts it back to the
    Modbus protocol and vice versa. To get data and to initialize them so that they
    get ready to transmit data to and fro, you need to define variables, as shown
    in Listing [6-3](#484167_1_En_6_Chapter.xhtml#PC3).


    ```

    // ****** DEFINES ******

    #define MAX485_DE      3

    #define MAX485_RE_NEG  2

    Listing 6-3

    Defining the Pins for Communicating with the Energy Meter

    ```


    Please remember that the DX or DE marked by the variable `MAX485_DE` is communicating
    through pin number 3 on the Arduino Mega board, which in turn is connected to
    the Modbus converter module on the corresponding DE male pin marked on it. Similarly,
    the variable `MAX485_RE` is negative and is communicating through pin 2 marked
    on the Arduino board, which in turn is connected to the Modbus converter module
    on the corresponding RE male pin marked on it.


    During pre-transmission and post-transmission the main work of the next functions
    is to write to these pins to start and end communications. This is shown in the
    piece of code in Listing [6-4](#484167_1_En_6_Chapter.xhtml#PC4).


    ```

    // ****** Transmission Functions ******

    void preTransmission()

    {

    digitalWrite(MAX485_RE_NEG, 1);

    digitalWrite(MAX485_DE, 1);

    Serial.println("preTransmission");

    }

    void postTransmission()

    {

    digitalWrite(MAX485_RE_NEG, 0);

    digitalWrite(MAX485_DE, 0);

    Serial.println("postTransmission");

    }

    Listing 6-4

    Pre- and Post-transmission Functions

    ```


    The two functions given in the code initialize communication in the function `void
    preTransmission(){}` by using `digitalWrite(MAX485_RE_NEG, 1);`. This function
    initializes the RE pin# 2 to start writing. The first parameter in the `digitalWrite`
    function is the pin number, which is defined in the variable `MAX485_RE_NEG`,
    and the second parameter is the on/off binary parameter that enables writing to
    the pin with value of 1 and stops it by passing a value of 0. Next, `MAX485_DE`
    is initialized and then the `postTransmission(){}` function passes values of 0
    to both pins to stop the transmission. Now that you have these functions, you
    are ready to execute the standard functions for the Arduino Mega, which are the
    `void setup()` and `void loop()`. To recall from Chapter [3](#484167_1_En_3_Chapter.xhtml),
    the `void setup()` function is defined first in the program in order to initialize
    and set up the code for the Arduino Mega 2560 to start functioning. For this function,
    you first initialize the output to pins 2 and 3 in order to start controlling
    the flow of data through them using the Modbus 485 protocol. Once this is done,
    you need to initialize the receiving mode for the same pins. After which you set
    the baud rate frequency at which the energy meter has been set to receive and
    send signals. The default for this meter is 9600 Hz and I don’t intend to change
    it as it communicates well at this rate. After this, a slave id is defined for
    this slave. If you have multiple slaves connected to the Arduino Mega board, you
    can give multiple slave ids to them in this section. After this the `preTransmission()`
    and `postTransmission()` functions are called. As a measure to find out if the
    communication has happened correctly between the Arduino and energy meter, you
    can write something like “Hello World.” This is exactly what you see in Listing
    [6-5](#484167_1_En_6_Chapter.xhtml#PC5).


    ```

    // ****** STANDARD ARDUINO SETUP FUNCTION ******

    void setup() {

    // make pins 2 and 3 output pins for Max485 flow control

    pinMode(MAX485_RE_NEG, OUTPUT);

    pinMode(MAX485_DE, OUTPUT);

    // Init in receive mode

    digitalWrite(MAX485_RE_NEG, 0);

    digitalWrite(MAX485_DE, 0);

    Serial.begin(9600);    // TX0/RX0 serial monitor

    Serial1.begin(9600);   // TX1/RX1 Modbus comms

    // Modbus slave ID = 1

    node.begin(1, Serial1);

    // Callbacks allow us to configure the RS485 transceiver correctly

    node.preTransmission(preTransmission);

    node.postTransmission(postTransmission);

    Serial.println("Hello World");

    }

    Listing 6-5

    The void setup() Function

    ```


    The `Serial.println()` function is sent as an output to the serial port by the
    Arduino. So you can use a Python program to read these statements from the Raspberry
    Pi master to which the Arduino Mega slave is connected. Now that you have your
    initial configuration for the Arduino done in the `void setup()` function, you
    can move on to the last step of defining the main work that you want the sketch
    to perform with the Arduino Mega. First, you need to read values from the energy
    meter and for that you need to define variables to hold the results and the data
    from it, as shown in Listing [6-6](#484167_1_En_6_Chapter.xhtml#PC6).'
