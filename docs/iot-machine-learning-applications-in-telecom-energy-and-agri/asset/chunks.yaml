    are doing is instead of getting data from an actual IoT sensor, you are taking
    it from the internal hardware IoT sensors embedded in the Raspberry Pi. The concept
    of temperature and the percent values are applicable to industrial devices such
    as heat exchangers or boilers, which have a mix of values in temperature and percentages
    and some absolute values as well. The electrical devices have various values ranging
    from frequencies to voltages. All this makes up the data you will use in the case
    study examples because there the data is going to come from the actual IoT sensors
    connected to the Raspberry Pi and Arduino.


    The code first initializes and imports the required Python libraries like CPUTemperature
    from the gpiozero library. This is the one that is going to get you the internal
    Raspberry Pi temperature. You also import libraries like datetime to get the time
    and date of when the data is generated, the pandas dataframe to store the data
    temporarily, and an imported LED to give a status of green, orange, or red through
    the lighting of the appropriate one. For example, if the CPU temperature is less
    than 55 degrees Celsius, the green LED will light up; if the CPU temperature of
    the Raspberry Pi is greater than 55 but less than 60 degrees Celsius, the orange
    LED will light up; and if the temperature is greater than 60 degrees, the red
    LED will light up. This is exactly how you would implement an advance warning
    system using IoT sensors if you were measuring outside temperature values. After
    this, you import pygame to ensure that there is a sound coming out of the Raspberry
    Pi speaker when the temperature reaches beyond 60 degrees Celsius. This is a critical
    system for your SBC and if something is not done, the system will hang after a
    while and the board or its components can also burn. Try to imagine this in an
    IoT-based environment where you would like to implement such a critical alert
    system. The library pygame is initialized using the `init()` function and in the
    next line, it loads `example.mp3`, a shrill alerting sound, into memory. It does
    not play it since you have not given the command yet; it is just loaded into the
    memory.


    In the next section of the code, you initialize the LEDs that will light up according
    to the CPU temperature. The red LED is at GPIO pin number 18, the green LED is
    at GPIO pin number 22, and the yellow LED is at GPIO number 17\. Make sure the
    LEDs on the Raspberry Pi have been connected to the right pin numbers given in
    Figure [3-15](#484167_1_En_3_Chapter.xhtml#Fig15).


    The advance warning system now comprises a sound for the red temperature and a
    visual alert using LEDs for the CPU temperature. In a real-world application,
    you will need these alerting systems plus others like SMS or e-mail alerts for
    which you may need to configure mail and SMS gateway servers on your Raspberry
    Pi. We will not be doing this as we are undertaking PoC-level code and this is
    beyond the scope of the book.'
