    ### 机器学习能否力挽狂澜？


    机器学习团队在两个月内组建完成，赫特·刘被聘为该试点项目的机器学习工程师。他与三位数据科学家一同，对阿斯塔萨加农业公司在巴西、南非和印度的农业运营进行了全面考察。入职培训结束后，业务运营团队成员向他们做了介绍。通过详细的简报，赫特和他的团队掌握了许多农业种植领域的专业术语。他们还了解了作物生产的内部流程。这些细致的考察确实帮助团队深入了解了公司的运营。然而，他们缺乏的是经验性知识，而这正是业务运营团队成员将在该试点团队中弥补的差距。


    赫特和他的团队在会合后开了几次会。他们也多次与格兰佐会面。格兰佐有效地传达了公司创始人的愿景以及当前与增长相关的问题。赫特是一位经验丰富的机器学习工程师，此前曾在保险领域工作。他与农业的唯一交集是为农业种植者创建了一个理赔预测模型。因此，对他来说，这是一个非常陡峭的学习曲线，他必须理解商业种植农业的复杂性，以及管理它所带来的复杂性，例如虫害导致的作物歉收、天气模式的变化、土壤成分及其对农场产出的影响。赫特和他的团队开始收集一些他们认为有助于预测作物农场产出的参数。他们将分析分为天气、土壤和经济环境三个方面。他们在每两周一次的会议上与格兰佐分享了他们的理解。赫特展示了由于印度农场附近不可预测的降雨和洪水，天气如何损害了他们的作物。格兰佐指出，他们面临的最大问题是在购买前确定高产农田的特征。“根据我们创始人的愿景，我们计划在全球购买大量农田，例如在澳大利亚、泰国和其他地区；然而，我们不能盲目购买土地，然后发现其产量低于平均种植水平。这对我们的投资回报率来说是灾难性的。你们团队应该建立一个模型，帮助我们确定高产经济作物农田的特征。为此，你们应该研究土壤特征，以及是什么导致土壤高产或低产。使用你们想要的任何仪器；我们可以购买。资金不是问题，但你们必须建立一个系统，在我们追求指数级增长的过程中，能最大程度地造福我们，”他说。


    在明确了前进方向后，赫特和他的团队与业务运营团队成员一起，着手了解甘蔗作物的土壤特征构成，他们选择了甘蔗作为试点项目。他们选定了表 9-3 中所示的参数。


    **表 9-3 监测土壤养分的参数**


    | 土壤 pH 值 |

    | --- |

    | 有机碳 % |

    | 氮 kg/ha |

    | 磷 kg/ha |

    | 钾 kg/ha |

    | 锌 mg/kg |

    | 铁 mg/kg |

    | 铜 mg/kg |

    | 锰 mg/kg |

    | 硫 kg/ha |


    在决定锁定这些参数以创建土壤特征后，他们现在希望从全球各地的阿斯塔萨加农业公司农场收集数据。格兰佐帮助他们购买了以下设备：


    1.  用于读取土壤养分数据的商用级物联网传感器套件

    2.  用于物联网传感器难以运行区域的土壤养分手动测试套件


    现在，我们将基于 `cashcrop_Yield_dataset.csv` 文件中的数据集，构建一个预测甘蔗经济作物产量的解决方案。


    ## 解决方案


    我们可以假设，该数据集是通过读取物联网传感器和手动土壤养分测试套件中针对 `cashcrop_Yield_dataset.csv` 数据集中给出的各种参数生成的。清单
    9-1 中的代码并非此问题的最权威解决方案，而是一个简单快速的实现方案，正如任何试点项目一样。在现实场景中，为土壤养分收集的数据将包含更多参数。如果运营规模横跨几个大洲，这样的数据收集工作可能需要数月才能完成。农业运营地点远离城市，分布广泛，因此对任何公司来说都是一项繁重的工作。在设计解决方案时，我们会将这些因素考虑在内。请注意，我们仅使用线性回归，因为它能给出非常高的准确率分数；不过，我鼓励您尝试其他回归算法。


    ### Python 代码


    清单 9-1 给出了针对阿斯塔萨加农业公司所面临问题的基于 Python 的解决方案。代码从导入常见的 Python 库开始，例如 pandas、StringIO、requests
    等。之后，我们从 CSV 文件 `cashcrop_Yield_dataset.csv` 加载数据集。您也可以改用 SQLite 数据库。接着，我们通过查看数据框每列的平均值、中位数、众数、标准差、最小值和最大值来进行探索性数据分析。之后，我们查找并统计异常值，例如代码
    `df[''Yield_per_ha''].loc[df[''Yield_per_ha''] <=151.50000].count()` 用于每公顷产量列。这将是我们的预测目标，因为正如案例研究中讨论的，公司想知道提高该产量的参数。然后，我们使用箱线图可视化数据，并查看数值列的偏度和峰度。我们还使用面积图和直方图进行可视化。之后，是时候使用
    `df.corr()` 代码查看各列与预测目标列 `Yield_per_ha` 之间的关系了。接下来是一个三步过程：第一步，代码将数据拆分为特征和目标变量。第二步，它打乱并将最终数据集拆分为训练集和测试集，用于构建预测模型。最后一步是模型构建和评估，由于我们的目标是预测每公顷产量这个数值变量，因此我们使用线性回归。代码的最后几行使我们能够输入任何新的农场数值，并通过代码
    `predicted= regr.predict([[26,1500,6.8,0.9,367,32,490,35]])` 预测每公顷产量。要更深入地了解代码结果及其执行方式，请参阅清单
    9-1 后的讨论。

