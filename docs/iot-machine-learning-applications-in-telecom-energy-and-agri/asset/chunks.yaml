    `pip3 install scikit-learn`。如果需要排查问题，请参考 Stackoverflow.com 上关于此主题的讨论：[`https://stackoverflow.com/questions/38865708/how-can-i-run-python-scikit-learn-on-raspberry-pi`](https://stackoverflow.com/questions/38865708/how-can-i-run-python-scikit-learn-on-raspberry-pi)。


    现在，你已经测试并运行了 Python 及其库。如果到目前为止一切正常，下一步是使用 Python 测试 Arduino，这将在下一节中进行。


    ## 使用 Python 测试 Arduino


    Arduino 是一种微控制器。正如你在第 2 章中所了解的，它用于通过 Modbus 协议与工业设备通信。让我们开始使用 Arduino。


    Arduino 程序是在 Arduino IDE 中编写的。Arduino IDE 是运行在树莓派系统上的特殊软件。你将把它用作主设备，而 Arduino
    将作为从设备，与你的 IIoT 设备（如电能表）进行通信。它允许你为不同的 Arduino 板编写草图（在 Arduino 语言中，*程序*的同义词）。Arduino
    编程语言基于一种非常简单的硬件编程语言 Processing，其语法类似于 C 语言。在 Arduino IDE 中编写草图后，需要将其烧录到 Arduino
    芯片板上执行。这个过程称为上传到 Arduino 微控制器。在此测试中，你将使用 Arduino IDE 在树莓派 3 Model B+ 上进行测试。请记住，Arduino
    不是一个功能完整的计算机；它不像树莓派那样拥有自己的操作系统，这就是为什么它需要一个像树莓派这样的主设备来监控、控制和使用它。从设备 Arduino 在其主设备和连接的
    IIoT 或 IoT 设备之间进行双向通信。虽然这最初看起来复杂，但一旦你开始测试并将每个硬件和软件组件组合起来使系统工作，它就会变得更容易。


    ### Arduino 硬件设置与通信


    首先，使用 Arduino Mega 2560 附带的 USB 串行电缆将其与树莓派 3 Model B+ 连接，如图 3-7 所示。使用树莓派的 USB
    端口进行连接，另一端连接到 Arduino 板的串行端口。


    ![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig7_HTML.png](img/484167_1_En_3_Fig7_HTML.png)


    图 3-7


    连接的树莓派 3 B+ 和 Arduino Mega 2560


    下一步，打开 Arduino IDE，如图 3-8 所示，并编写清单 3-2 中所示的程序。


    ![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig8_HTML.png](img/484167_1_En_3_Fig8_HTML.png)


    图 3-8


    在树莓派 3 Model B+ 上打开 Arduino IDE


    打开 Arduino IDE 后，你可以编写 Arduino 版本的“Hello world”程序。


    ```

    void setup() {

    // put your setup code here, to run once:

    Serial.begin(9600);

    }

    void loop() {

    // put your main code here, to run repeatedly:

    Serial.println("Hello World from Arduino");

    }

    清单 3-2

    Arduino “Hello world” 程序

    ```


    当你为 Arduino 编写草图程序时，需要包含两个与 C 语言非常相似的函数。第一个是 `void setup()` 函数，主要用于初始化串行总线通信、LED
    或连接到 Arduino 微控制器的其他设备。图 3-12 所示的 Arduino IDE 是你将在树莓派 3 B+ 上从桌面“开始 ➤ 编程”菜单中打开的，然后你将编写图
    3-9 所示的程序。


    ![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig9_HTML.jpg](img/484167_1_En_3_Fig9_HTML.jpg)


    图 3-9


    默认的 Arduino IDE 草图


    代码不言自明，采用 C 风格和语法。第一个函数是 `void setup()`，符号 `//` 后的注释（表示注释）说明你可以在此处放置代码，并且只需运行一次，例如初始化任何设备或变量值等。在
    setup 函数中，由花括号 { } 表示的主体是你编写代码的区域。下一个函数是 loop 函数，你希望它循环或重复运行。如果你有纯软件背景，可能会觉得这令人困惑，可能不明白为什么需要一个重复执行操作的函数。试着这样理解：像
    Arduino 这样的机器或微控制器无法自行运行，除非有一个程序反复告诉它该做什么。这就像有一个随时听候差遣的仆人，闲着就会感到无聊。同样，Arduino
    也需要重复做一些事情，不能闲置。你可以让它监控一个设备，并在某个事件发生或设备即将出现故障时触发某些操作。这只是你可以使用这个 `loop()` 函数的一个例子；其应用是无限的。你可以根据
    Modbus 设备的输入值（如温度等）打开或关闭 LED。这只需要 Arduino 微控制器持续不间断地工作，而这正是 `loop()` 函数的全部意义所在。


    在继续之前，你需要了解在 Arduino IDE 中编译和运行程序的过程。首先，编写草图代码并将其保存为扩展名为 `∗.ino` 的文件。保存后，转到“工具
    ➤ 板”并悬停以打开支持的 Arduino 微控制器板列表。从列表中选择 Arduino Mega 2560。你必须记住每次打开 Arduino IDE 时都要检查，以免在编译中出现错误。图
    3-10 显示了如何执行此操作。

    '
- fmt: '![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig10_HTML.jpg](images/484167_1_En_3_Chapter/484167_1_En_3_Fig10_HTML.jpg)


    **Figure 3-10** Choosing the Arduino Mega 2560 board


    After choosing `Arduino/Genuino Mega` or `Mega 2560`, you are good to write your
    first Hello world program, as shown in Figure [3-11](#484167_1_En_3_Chapter.xhtml#Fig11).


    ![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig11_HTML.jpg](images/484167_1_En_3_Chapter/484167_1_En_3_Fig11_HTML.jpg)


    **Figure 3-11** Writing the Hello world program in the Arduino IDE


    You will notice that the `setup` function of the program initializes the serial
    port with a baud rate of 9600. The `loop` function contains a print statement
    to the serial port of the Arduino. In practical terms, this type of program does
    not mean anything; however, you are trying to test your communication with the
    Arduino microcontroller. In the next step, if you are able to successfully compile
    the program, it means you have not made any errors. The common mistakes in this
    Hello world program are the capitalization of first word (in `serial`, the letter
    `S` has to be capitalized). Another thing to remember is the functions of object
    `serial` do not to be capitalized. The `begin` and `println` functions are not
    capitalized. Just like any C or C++, program every sentence has to end with a
    semicolon.


    Now let’s move to the next step of compiling the program in the Arduino IDE, which
    is shown in Figure [3-12](#484167_1_En_3_Chapter.xhtml#Fig12).


    ![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig12_HTML.jpg](images/484167_1_En_3_Chapter/484167_1_En_3_Fig12_HTML.jpg)


    **Figure 3-12** Compiling a sketch in the Arduino IDE


    ### Running the Sketch


    After you have successfully compiled the Hello world program, you may proceed
    to the next step of uploading it. In this step, the Arduino IDE communicates to
    the Arduino Mega 2560 microcontroller through Raspberry Pi’s USB serial interface
    and flashes the entire program to it. Now this program will reside in the microcontroller''s
    memory and run infinitely until you write your next program and write it on top
    via the same process. Figure [3-13](#484167_1_En_3_Chapter.xhtml#Fig13) shows
    the Upload option in the Sketch menu for uploading the program onto the microcontroller
    board.


    ![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig13_HTML.jpg](images/484167_1_En_3_Chapter/484167_1_En_3_Fig13_HTML.jpg)


    **Figure 3-13** Option in the Arduino IDE to upload the sketch


    Now that you have compiled the program and clicked upload, you should see the
    program being uploaded and a progress bar which will indicate the progress of
    the Arduino IDE writing the program to the microcontroller board. If you have
    not chosen the right microcontroller board, you will see an error here. You can
    also see an error in this step if there is a problem with the connection between
    the Raspberry Pi and Arduino. The most common reason for an error at the upload
    stage is a loose cable or a bad serial bus cable. So check the ends on both Raspberry
    Pi and Arduino boards to verify your cable does not have any issue. Try changing
    it if you still face an error when uploading. Figure [3-14](#484167_1_En_3_Chapter.xhtml#Fig14)
    shows the result of a successful upload of your Hello world program onto the Arduino
    microcontroller board. Notice the “Done Compiling” message at the bottom panel
    of the Arduino IDE. The box below shows messages related to the program storage
    space or the maximum space available for it to use. In this case, it has used
    1820 bytes of the available maximum space of 253952 bytes. Similarly, it also
    informs you that it uses for its global variables 212 bytes (2%) of dynamic memory,
    leaving 7980 bytes for local variables out of a maximum of 8192 bytes. Very long
    programs may not fit into the small memory of the Arduino Mega 2560 board, so
    this information comes in handy so you can optimize the program to fit into it.


    ![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig14_HTML.jpg](images/484167_1_En_3_Chapter/484167_1_En_3_Fig14_HTML.jpg)


    **Figure 3-14** The “done compiling” message on the Arduino IDE


    This is the last step of the process to test the Raspberry Pi to Arduino communication.
    Now you are ready to undertake the next step in getting IoT sensor data from the
    Raspberry Pi.


    ## Getting IoT Sensor Data with Raspberry Pi Sample Code


    In order to get IoT sensor data in the Raspberry Pi, you first need to relook
    at the GPIO pins on the SBC microcomputer board. They are shown in Figure [3-15](#484167_1_En_3_Chapter.xhtml#Fig15).


    ![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig15_HTML.jpg](images/484167_1_En_3_Chapter/484167_1_En_3_Fig15_HTML.jpg)


    **Figure 3-15** Raspberry Pi 3 Model B+ GPIO pin layout


    The 40 GPIO pins are clearly visible in Figure [3-15](#484167_1_En_3_Chapter.xhtml#Fig15).
    I explained their use in earlier chapters; however, in this chapter you are going
    to use them to make a circuit to communicate with things like LEDs and IoT sensors.
    I will refer to these pin numbers henceforth like, for example, the pin with a
    red circle with number 1 has 3V marked against it, which means it is to be used
    to power your device with a 3V current and a pin with 5 volts of power has a red
    circle, like numbers 2 and 4. Also, you will use the ground pins circled with
    numbers 6, 9, 14, 20, 30, 34, and 39. The rest of the pins can be used for digital
    GPIO communication.


    You’re now at the step of connecting the IoT sensor to the GPIO pins of the Raspberry
    Pi board. There are two ways of doing this: the use of a breadboard, as shown
    in Figure [3-16](#484167_1_En_3_Chapter.xhtml#Fig16), or a printed circuit board
    (PCB). All the examples, solutions, and case study exercises in this book are
    at the proof-of-concept (PoC) level. Breadboards are used when you are designing
    an electronic system for the first time as a proof of concept, and PCBs are used
    when you have tested an electronic circuit on the breadboard that works with your
    program and now you want to make it permanent for production or commercial use.


    ![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig16_HTML.jpg](images/484167_1_En_3_Chapter/484167_1_En_3_Fig16_HTML.jpg)


    **Figure 3-16** Breadboard for circuit testing


    The breadboard, as you can see, has two rails at the top and bottom which have
    positive and negative holes embedded inside them. The middle partitions with five
    columns and 64 rows each are used to connect devices such as LED, IoT sensors,
    or motors. The key thing to note about this breadboard is that underneath the
    plastic coating is a mesh of circuitry that connects each of the rows together.
    So if you place a leg of an LED at any middle portion of the row, you should be
    able to connect to it by placing another wire on the same row. You need not put
    the wire on the same hole that you insert into the hole the leg of any device.
    This feature of the breadboard makes it very convenient to work with and does
    away with the need to solder the circuit together (which is required when working
    with printed circuit boards). Since the nature of this board is that the entire
    circuit is based on holes and it is not permanent, you cannot use it for production-level
    work.'
