- fmt: '# Installing the Arduino IDE


    Since you know your processor bit width, you can move to the actual installation
    of the Arduino IDE, which can be done in two ways. One way is to go to [`www.arduino.cc`](http://www.arduino.cc/)
    and click Software ➤ Downloads, as shown in Figure [5-12](#484167_1_En_5_Chapter.xhtml#Fig12).


    ![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig12_HTML.jpg](images/484167_1_En_5_Chapter/484167_1_En_5_Fig12_HTML.jpg)


    Figure 5-12


    Downloading the Arduino IDE from [*www.arduino.cc*](http://www.arduino.cc)


    Now scroll down to the Arduino IDE download section shown in Figure [5-13](#484167_1_En_5_Chapter.xhtml#Fig13)
    and choose the operating system with the corresponding bit (32 or 64) for download.


    ![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig13_HTML.jpg](images/484167_1_En_5_Chapter/484167_1_En_5_Fig13_HTML.jpg)


    Figure 5-13


    Download the Arduino IDE


    As you can see, there are various options in the blue bar on the right-hand side
    of the page. Linux has four options: Linux 32 bits, Linux 64 bit, Linux ARM 32
    bits, and Linux ARM 64 bits. The `uname` and `lshw` commands showed that I am
    running Linux on an ARM v7 processor with a width bit of 32 bits, so I select
    Linux ARM 32 bits for download in my case. If you have a 64-bit processor, you
    need to download the Linux ARM 64-bit IDE. Click the Just Download button on the
    next page if you do not want to contribute a small donation towards Arduino development.


    After the download ends, follow the steps given in Figure [5-14](#484167_1_En_5_Chapter.xhtml#Fig14)
    by clicking Show in Folder option in your browser.


    ![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig14_HTML.jpg](images/484167_1_En_5_Chapter/484167_1_En_5_Fig14_HTML.jpg)


    Figure 5-14


    Click the Show in Folder option to see the downloaded file


    After this, the Raspbian GUI File Explorer will open the Downloads folder where
    the Arduino compressed file has been downloaded, as shown in Figure [5-15](#484167_1_En_5_Chapter.xhtml#Fig15).


    ![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig15_HTML.jpg](images/484167_1_En_5_Chapter/484167_1_En_5_Fig15_HTML.jpg)


    Figure 5-15


    Downloads folder with the `*.xz` compressed file


    You need to extract the tar file from inside the `*.xz` extension file, as shown
    in Figure [5-16](#484167_1_En_5_Chapter.xhtml#Fig16). Right-click the file to
    select and left-click the Extract Here menu option.


    ![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig16_HTML.jpg](images/484167_1_En_5_Chapter/484167_1_En_5_Fig16_HTML.jpg)


    Figure 5-16


    The Extract Here option for the `*.xz` file


    When you click the Extract Here option, you will see a dialog box that will show
    you the progress of your file extraction process. See Figure [5-17](#484167_1_En_5_Chapter.xhtml#Fig17).


    ![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig17_HTML.jpg](images/484167_1_En_5_Chapter/484167_1_En_5_Fig17_HTML.jpg)


    Figure 5-17


    Extraction in progress for the `*.xz` file


    Once you have this extracted, you will be able to see a new file created in the
    `Downloads` folder with the same name as the `*.xz` file but now with a `*.tar`
    extension. Right-click this file again and select the Extract Here option from
    the dropdown menu once again, as shown in Figure [5-18](#484167_1_En_5_Chapter.xhtml#Fig18).


    ![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig18_HTML.jpg](images/484167_1_En_5_Chapter/484167_1_En_5_Fig18_HTML.jpg)


    Figure 5-18


    Extraction of the tar file


    After the extraction process is complete, you will now see a new folder created,
    as shown in Figure [5-19](#484167_1_En_5_Chapter.xhtml#Fig19).


    ![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig19_HTML.jpg](images/484167_1_En_5_Chapter/484167_1_En_5_Fig19_HTML.jpg)


    Figure 5-19


    New Arduino folder after extraction


    You can go into the folder by double-clicking it, as shown in Figure [5-20](#484167_1_En_5_Chapter.xhtml#Fig20).
    You will see a file named `install.sh`. Double-click this file and the Arduino
    IDE will be installed on your system.


    ![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig20_HTML.jpg](images/484167_1_En_5_Chapter/484167_1_En_5_Fig20_HTML.jpg)


    Figure 5-20


    Running the `install.sh` file to finish the installation


    The second, easier method to install the Arduino IDE just involves executing three
    commands:


    ```

    sudo apt-get update

    sudo apt-get upgrade

    sudo apt-get install arduino

    ```


    Although the command line method of installing the Arduino IDE is much simpler
    and has lot less steps, some people like the GUI more than the command line, so
    I have shown both the methods and leave it up to you on how you want to install
    it. Now you are at the data storage step in your setup, that of installing a SQLite3
    database on Raspbian.'
