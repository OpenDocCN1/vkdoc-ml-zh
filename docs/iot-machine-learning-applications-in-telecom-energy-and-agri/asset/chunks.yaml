  trans: '

    ## 安装 Arduino IDE


    既然你已经知道了处理器的位宽，就可以开始实际安装 Arduino IDE 了。安装方式有两种。一种方法是访问 [`www.arduino.cc`](http://www.arduino.cc/)，然后依次点击“软件”
    ➤ “下载”，如图 5-12 所示。


    ![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig12_HTML.jpg](img/484167_1_En_5_Fig12_HTML.jpg)


    图 5-12


    从 [*www.arduino.cc*](http://www.arduino.cc) 下载 Arduino IDE


    现在向下滚动到图 5-13 所示的 Arduino IDE 下载区域，选择对应位宽（32 位或 64 位）的操作系统进行下载。


    ![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig13_HTML.jpg](img/484167_1_En_5_Fig13_HTML.jpg)


    图 5-13


    下载 Arduino IDE


    如你所见，页面右侧的蓝色栏中有多个选项。Linux 有四个选项：Linux 32 位、Linux 64 位、Linux ARM 32 位和 Linux ARM
    64 位。`uname` 和 `lshw` 命令显示我运行的是 ARM v7 处理器，位宽为 32 位，因此我选择下载 Linux ARM 32 位版本。如果你使用的是
    64 位处理器，则需要下载 Linux ARM 64 位版本的 IDE。如果你不想为 Arduino 开发提供小额捐赠，请点击下一页的“仅下载”按钮。


    下载完成后，按照图 5-14 所示的步骤，在浏览器中点击“在文件夹中显示”选项。


    ![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig14_HTML.jpg](img/484167_1_En_5_Fig14_HTML.jpg)


    图 5-14


    点击“在文件夹中显示”选项查看下载的文件


    之后，Raspbian 的 GUI 文件资源管理器将打开“下载”文件夹，其中已下载了 Arduino 压缩文件，如图 5-15 所示。


    ![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig15_HTML.jpg](img/484167_1_En_5_Fig15_HTML.jpg)


    图 5-15


    包含 `*.xz` 压缩文件的“下载”文件夹


    你需要从 `*.xz` 扩展名文件中提取 tar 文件，如图 5-16 所示。右键单击该文件以选中它，然后左键单击“解压到此处”菜单选项。


    ![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig16_HTML.jpg](img/484167_1_En_5_Fig16_HTML.jpg)


    图 5-16


    `*.xz` 文件的“解压到此处”选项


    当你点击“解压到此处”选项时，会看到一个对话框，显示文件解压的进度。见图 5-17。


    ![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig17_HTML.jpg](img/484167_1_En_5_Fig17_HTML.jpg)


    图 5-17


    `*.xz` 文件正在解压中


    解压完成后，你会在 `Downloads` 文件夹中看到一个新创建的文件，其名称与 `*.xz` 文件相同，但扩展名变为 `*.tar`。再次右键单击此文件，并从下拉菜单中选择“解压到此处”选项，如图
    5-18 所示。


    ![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig18_HTML.jpg](img/484167_1_En_5_Fig18_HTML.jpg)


    图 5-18


    解压 tar 文件


    解压过程完成后，你会看到创建了一个新文件夹，如图 5-19 所示。


    ![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig19_HTML.jpg](img/484167_1_En_5_Fig19_HTML.jpg)


    图 5-19


    解压后新的 Arduino 文件夹


    你可以双击该文件夹进入，如图 5-20 所示。你会看到一个名为 `install.sh` 的文件。双击此文件，Arduino IDE 将安装到你的系统上。


    ![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig20_HTML.jpg](img/484167_1_En_5_Fig20_HTML.jpg)


    图 5-20


    运行 `install.sh` 文件完成安装


    第二种更简单的安装 Arduino IDE 的方法只需执行三条命令：


    ```

    sudo apt-get update

    sudo apt-get upgrade

    sudo apt-get install arduino

    ```


    虽然通过命令行安装 Arduino IDE 的方法简单得多，步骤也少很多，但有些人更喜欢图形界面而非命令行，因此我展示了这两种方法，由你决定如何安装。现在，你已经进入了设置中的数据存储步骤，即在
    Raspbian 上安装 SQLite3 数据库。

    '
- fmt: "# Installing SQLite3 Database\n\n`SQLite3` is a free database that you are\
    \ going to use easily to create and use a database in your applications for storage.\
    \ Although `SQLite3` is not a full-featured database, it supports a large set\
    \ of the SQL standard and is great for application development that need a simple\
    \ database engine to plug into applications. `SQLite3` is very popular with smartphone\
    \ developers. The environment of the Raspberry Pi is also a mobile environment\
    \ where we take it on the field, in factories, in agricultural fields, or near\
    \ mobile towers to gather data through IoT sensors and store it in this compact,\
    \ robust database. Please remember that you can’t use this database for applications\
    \ that require high security features like built-in user management. So use it\
    \ wherever there is no such security requirement. You can configure `PostgreSQL`\
    \ or any other Linux database like `MySQL` on Raspbian but that is beyond the\
    \ scope of this book since we are developing only PoC-grade code.\n\nUse the following\
    \ script to install `Sqlite3` onto the Raspbian OS:\n\n```\nsudo apt-get update\n\
    sudo apt-get upgrade\nsudo apt-get install sqlite3\nsqlite3 \nSQLite version 3.8.7.1\
    \ 2014-10-29 13:59:56\nEnter \".help\" for usage hints.\nsqlite>\n```\n\nYou can\
    \ also install `SQLite3` in the manner I showed you for the GUI installation for\
    \ the Arduino IDE from the official website of the SQLite organization at [`www.sqlite.org/download.html`](http://www.sqlite.org/download.html).\n\
    \nNow you’ve come to the last step of installing the Modbus interface device,\
    \ the single phase meter, onto the Arduino.\n\n## Disclaimer\n\nBefore proceeding\
    \ further, I would like to warn you of the risk associated with using this Modbus\
    \ device. The energy meter is an electrical appliance and carries the risk of\
    \ short-circuiting if not connected properly. It can also be dangerous to human\
    \ life if not used as per its instruction manual. It can also burn and damage\
    \ your Raspberry Pi and Arduino boards if wrong connections are made. So if you\
    \ are not comfortable with electric connections, I strongly advise you to not\
    \ use this device or to get expert help from a local electrical technician to\
    \ make the proper connections. Neither I nor the publisher can be held responsible\
    \ in any way whatsoever for any kind of damages, either material or to life. User\
    \ discretion is highly advised.\n\nThe additional devices that you will be using\
    \ to set up the energy meter are shown in Figures [5-21](#484167_1_En_5_Chapter.xhtml#Fig21)\
    \ through [5-23](#484167_1_En_5_Chapter.xhtml#Fig23):\n\n![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig23_HTML.jpg](images/484167_1_En_5_Chapter/484167_1_En_5_Fig23_HTML.jpg)\n\
    \nFigure 5-23\n\nConnected 5V Modbus Conversion Module\n\n![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig22_HTML.jpg](images/484167_1_En_5_Chapter/484167_1_En_5_Fig22_HTML.jpg)\n\
    \nFigure 5-22\n\n5V RS485 to TTL Signal Mutual Conversion Module for Arduino\n\
    \n1.  5V RS485 to TTL Signal Mutual Conversion Module for Arduino Overvoltage\
    \ Protection with Signal Indicator\n\n![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig21_HTML.jpg](images/484167_1_En_5_Chapter/484167_1_En_5_Fig21_HTML.jpg)\n\
    \nFigure 5-21\n\nConzerv EM6400 Energy Meter\n\n1.  Schneider Electric Conzerv\
    \ EM6400 Series Power Meter\n\nLet’s now connect the wires between the Arduino\
    \ Mega 256 and the 5V RS485 Modbus Conversion Module. I have shown the wires attached\
    \ to the Modbus Conversion Module in the Arduino Mega 2560.\n\nIn order to connect\
    \ the Modbus Conversion Module to Arduino, you need to first understand the layout\
    \ of the Arduino Mega 2560 PCB, which is shown in Figure [5-24](#484167_1_En_5_Chapter.xhtml#Fig24).\
    \ Notice in the diagram that the upper pins pertain to communication and the GPIO\
    \ pins. The right side of the board has the data pins and the bottom part of the\
    \ board has the power and analog pins. This board is very different from the Arduino\
    \ Uno board because it is used for controlling multiple slaves and is used in\
    \ industrial applications. This is why there are so many data pins in the PCB\
    \ layout.\n\nNow connect the Modbus Conversion Module to the Arduino Mega board.\
    \ You have to connect three pins to the power area of the board, which is near\
    \ the power controller on the bottom left-hand side of the layout diagram in Figure\
    \ [5-24](#484167_1_En_5_Chapter.xhtml#Fig24). The left-most dark blue pin gets\
    \ connected to the pin that has 5V written under it. The next green wire is connected\
    \ to the immediate next pin marked as GND. Ignore the yellow wire on the left\
    \ of Figure [5-24](#484167_1_En_5_Chapter.xhtml#Fig24); you don’t need it for\
    \ your setup. You can see this in Figure [5-24](#484167_1_En_5_Chapter.xhtml#Fig24)—the\
    \ three pins connected to the power section of the Arduino Mega board. Please\
    \ remember these are male jumper wires that you need because the Arduino Mega\
    \ board only has holes and not pins like the Raspberry Pi GPIO setup.\n\n![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig24_HTML.jpg](images/484167_1_En_5_Chapter/484167_1_En_5_Fig24_HTML.jpg)\n\
    \nFigure 5-24\n\nModbus Conversion Module wire connections to Arduino Mega board\n\
    \nThe wires on the other end have to be female jumper wires because the Modbus\
    \ Conversion Module has pins to put the wires into. So you should have two male-to-female\
    \ jumper wires for this connection. Connect the other end of these two wires to\
    \ the Modbus Conversion Module pins marked as VCC and GND (VCC is the 5V power\
    \ wire and GND is the grounding of the circuit). You can refer to Figure [5-25](#484167_1_En_5_Chapter.xhtml#Fig25).\n\
    \n![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig25_HTML.jpg](images/484167_1_En_5_Chapter/484167_1_En_5_Fig25_HTML.jpg)\n\
    \nFigure 5-25\n\nPower and ground connections to the Modbus Conversion Module\n\
    \nThe 5V dark blue wire connected on Arduino connects to the VCC pin marked on\
    \ the Modbus Conversion Module. The GND green wire pin on the Arduino board connects\
    \ to GND on the Modbus Conversion Module PCB.\n\nNow one part of your Modbus Conversion\
    \ Module is connected to the Arduino board. You need to connect the other end\
    \ to the GPIO pins section of the Arduino board or the communication side for\
    \ a total of four pins. See Figure [5-26](#484167_1_En_5_Chapter.xhtml#Fig26).\
    \ On the Arduino board\n\n![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig26_HTML.jpg](images/484167_1_En_5_Chapter/484167_1_En_5_Fig26_HTML.jpg)\n\
    \nFigure 5-26\n\nConnections to the PWM and communications side of Arduino Mega\
    \ board\n\nAs you can see, there are two pins on the left-hand side of the board\
    \ named PWM connected to pins numbered 3 and 2, which are adjacent to each other.\
    \ The next two pins are connected to the communications pins 18 and 19, which\
    \ are marked as TX1 and RX1, respectively, on the Arduino Mega board. Once you\
    \ have this in place, you need to connect the other end of the four pins in the\
    \ following manner. Pin 1 connected on the Arduino board to pin number 3 of PWM\
    \ needs to connect to the pin marked DE on the Modbus Conversion Module pin. Pin\
    \ 2 connected on the Arduino board to pin number 2 of PWM needs to connect to\
    \ the pin marked RE in the middle of the Modbus Conversion Module. Similarly,\
    \ pin 3 connected on the Arduino board to pin number 18 in Figure [5-27](#484167_1_En_5_Chapter.xhtml#Fig27)\
    \ needs to connect to the pin marked DI on the Modbus Conversion Module. The fourth\
    \ pin connected to pin number 19 on the Arduino board should be connected to the\
    \ pin marked RO on the Modbus Conversion Module. This completes the wiring process\
    \ for the Modbus Conversion Module to the Arduino Mega board. You can check your\
    \ connections against Figure [5-27](#484167_1_En_5_Chapter.xhtml#Fig27).\n\n![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig27_HTML.jpg](images/484167_1_En_5_Chapter/484167_1_En_5_Fig27_HTML.jpg)\n\
    \nFigure 5-27\n\nWiring to the Modbus Conversion Module communication and PWM\
    \ pins"
