  trans: '

    ## 机器学习与物联网在农业领域的前沿应用


    农业领域正迎来一场人工智能革命。这场技术浪潮正在全球范围内展开。全球农业正在经历的关键变革是，大型食品集团正试图接管农业生产，以满足自身对终端消费产品的原料需求。这些大型食品集团希望农民种植特定的专利作物品种，以维持良好的食品质量和生产力。因此，在一些国家，它们与农业社区合作，从农民手中直接采购生鲜蔬菜和牛肉；而在另一些国家，它们则通过合同雇佣农民，专门生产特定品种的粮食及其他产品，如土豆、生菜、胡萝卜、乳制品和油菜籽。这些产品被用作终端消费品的原料，例如麦当劳通过“旗舰农民计划”（[`www.flagshipfarmers.com/en/about-the-program/`](http://www.flagshipfarmers.com/en/about-the-program/)）生产的汉堡。


    这些食品巨头的努力旨在建立其核心原料（如土豆和生菜）的专利品种库。例如，麦当劳使用其著名的专利品种“Russet Burbank”土豆来制作薯条（[`www.earthandtablelawreporter.com/2015/09/11/patenting-the-potato-not-all-taters-are-created-equal/`](http://www.earthandtablelawreporter.com/2015/09/11/patenting-the-potato-not-all-taters-are-created-equal/)）。另一个例子是食品集团孟山都，它拥有许多蔬菜和种子的专利，例如豆类、西兰花、胡萝卜、黄瓜和甜瓜等。其中许多蔬菜被其他公司商业化使用。百事公司旗下的旗舰薯片品牌乐事就使用了孟山都的土豆（[`https://feast.media/food-brands-owned-by-monsanto`](https://feast.media/food-brands-owned-by-monsanto)）。孟山都持有
    14 种专利品种，其中最受欢迎的是 Roundup Ready® Corn 2（[`www.monsantotechnology.com/content/genuity-traits-corn.aspx`](http://www.monsantotechnology.com/content/genuity-traits-corn.aspx)）。


    这仅仅是食品公司购买专利并商业化利用的一个例子。目前，关于使用转基因产品作为商业食品原料存在争议。转基因食品可能引发多种疾病，因此大型食品公司并未使用它们；然而，这些公司面临着提高商业可行性和适应转基因实践以增加利润的压力，而转基因作物品种恰好能提供这种可能性。


    转基因作物的一种全新替代方案是计算育种技术，该技术结合了人工智能和机器学习，为农民带来卓越的产量。首先，利用物联网收集作物及其环境的数据，例如通过空气过滤传感器分析空气成分，以及通过油类传感器收集土壤混合物的数据。这些应用已通过所谓的“统计育种模式”得以实现，该模式使农民能够根据由空气和土壤混合物构成的大气环境，获得最适合该环境的作物。在该系统中，农民利用智能机器学习和物联网系统，基于全球其他具有相似气候地区的过往数据，为给定的空气和土壤混合物选择最佳的种子品种，从而在自家农场实现最大产量。一家名为
    HFG 的公司正在开展这项工作，它利用农业数据集和预测性数据科学，为作物构建预测性育种平台（[`www.zdnet.com/article/computational-breeding-can-ai-offer-an-alternative-to-genetically-modified-crops/`](http://www.zdnet.com/article/computational-breeding-can-ai-offer-an-alternative-to-genetically-modified-crops/)）。


    人工智能的另一项前沿应用来自日本等科技发达国家，主要应用于水稻种植。农村地区的人们正迁往城市谋生。由于人口从农村地区大规模迁移到东京、京都等城市中心，日本农村地区已无人从事农业。因此，日本迫切需要农民，尤其是用于生产主食大米。在日本农村地区，利用自动化和机器学习及人工智能进行农业种植可以提供帮助。在这一应用中，日本东北部的农民和开发者开始使用无人机来补充田间劳动力（见图
    4-1）。


    ![../images/484167_1_En_4_Chapter/484167_1_En_4_Fig1_HTML.jpg](img/484167_1_En_4_Fig1_HTML.jpg)


    图 4-1


    用于检测作物病害的无人机机器人


    一家初创公司开发了一款名为“91108 rich''s”的无人机。其主要功能是向作物喷洒农药和肥料。它能在 15 分钟内完成农民需要 60 分钟才能完成的工作。通过
    iPad 控制此类无人机，并结合机器学习应用来识别需要更多肥料或农药的区域，可以在这种应用的基础上进行开发。诊断型无人机能够通过持续监测作物，并保护作物附近可能存在的微生物，从而检测到病害的爆发。这正是利用物联网传感器进行害虫防治，并结合附近树莓派应用站运行的机器学习应用，来实现整个农业周期自动化的关键所在（[`www.techrepublic.com/article/how-drones-are-changing-farming-in-rural-japan/?ftag=CMG-01-10aaa1b`](http://www.techrepublic.com/article/how-drones-are-changing-farming-in-rural-japan/%253Fftag%253DCMG-01-10aaa1b)）。


    ## 总结


    你在本章中看到的所有应用本质上都是实验性的，并且是由中国公司华为在 5G 物联网领域引入的前沿实现。你还了解了能源行业面临的挑战如何通过物联网在化石燃料和可再生能源发电领域得到解决。接着，你考察了农业领域，其中物联网和机器学习的智能应用有望解决农民出售土地并迁往城市寻求更好生活的“人力流失”问题。在第
    5 章中，你将准备好在上述三个领域实施案例研究的环境。


    # 5. 准备案例研究的实施


    本章主要介绍如何准备案例研究的实施。你将首先学习如何从零开始设置你的树莓派 3 Model B+及其硬件和软件。当然，为此你将安装流行的 Raspbian
    操作系统。之后，你将把 Arduino Mega 2560 连接到树莓派，并连接物联网传感器模块以获取数据。接下来，将设置运行树莓派程序所需的 Python
    环境。你还需要设置启用了 Modbus 的电能计量设备。然后，你将连接树莓派与 Arduino，并启动它们之间的通信。最后，你将测试所有内容。

    '
- fmt: '# Setting Up Raspberry Pi 3 Model B+


    Please refer back to Figure [3-1](#484167_1_En_3_Chapter.xhtml#Fig1) in Chapter
    [3](#484167_1_En_3_Chapter.xhtml) for a schematic diagram on the components that
    you need to set up for the case studies. There are two software components, the
    Python IDE and the Arduino IDE, which you will set up once you have the hardware
    components fully set up. So let’s get started with the hardware.


    The first step to setting up your Raspberry Pi 3 Model B+ hardware is to decide
    on the operating system that you will use to run your applications. There are
    two popular operating systems available: Raspbian and Noobs. Noobs is used by
    people who are new to Raspberry Pi. You will be using the Linux version Raspbian,
    which is available from [`www.raspberrypi.org/downloads/`](http://www.raspberrypi.org/downloads/).
    It can be seen in Figure [5-1](#484167_1_En_5_Chapter.xhtml#Fig1), which shows
    the available operating system images for download from the official Raspberry
    Pi website.


    ![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig1_HTML.jpg](images/484167_1_En_5_Chapter/484167_1_En_5_Fig1_HTML.jpg)


    Figure 5-1


    [www.​raspberrypi.​org](http://www.raspberrypi.org) download options


    Note that at this stage you have not booted up your Raspberry Pi 3 B+ as there
    is no operating system installed on its microSD card yet. A microSD card and microSD
    card reader or adapter come with the Raspberry Pi 3 B+ kit. If you do not have
    a microSD card, you can get one from the options on my website at [`www.pmauthor.com/raspbian/`](http://www.pmauthor.com/raspbian/).
    For the installation of Raspbian, the base suggested microSD card size is 8GB.
    For Raspbian Lite image installations, Raspberrypi.org suggests at least 4GB.
    Do keep in mind that just the Raspberry Pi 3A+, 3B+, and Compute Module 3+ can
    boot from an SD card bigger than 256GB. This is because there was a bug in the
    SoC utilized on past models of Pi. Also remember to note the microSD card class
    to which your microSD card belongs because that decides the supported writing
    speed for it; a class 4 card will most likely write at 4MB/s, while a class 10
    ought to accomplish 10 MB/s. Do note this does not mean a class 10 card will beat
    a class 4 card for general read/write performance, in light of the fact that frequently
    this write speed is accomplished at the expense of read speed and a substantial
    increase seek times to the microSD card operations. The microSD card that comes
    with your Raspberry Pi 3 B+ kit should be latest and should most probably be class
    10, as is common now; however, if you get a lower class like 4, you can order
    a faster card of class 10 at [`www.pmauthor.com/raspbian/`](http://www.pmauthor.com/raspbian/).


    Of course your laptop must have a slot for reading and writing to microSD cards
    either directly or through an adapter. This is shown in Figure [5-2](#484167_1_En_5_Chapter.xhtml#Fig2).
    Also, you will need a computer or a laptop that is running either Windows or MacOS
    in order to download this image and then format the SD card and install this image
    on to it. I will show you how to do this on a Windows system in this chapter.


    ![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig2_HTML.jpg](images/484167_1_En_5_Chapter/484167_1_En_5_Fig2_HTML.jpg)


    Figure 5-2


    The microSD card and microSD card adapter that comes with the official kit


    Do not insert the microSD card adapter into the Raspberry Pi 3 B+ board yet because
    it is empty and not formatted with any operating system image written on top of
    it yet. You need to first download the Raspbian image by clicking the download
    section of the website. Once you do so, you will get the option to download the
    latest image of Raspbian for your use. As of the writing of this book, the there
    are three options for download, as shown in Figure [5-3](#484167_1_En_5_Chapter.xhtml#Fig3).


    ![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig3_HTML.jpg](images/484167_1_En_5_Chapter/484167_1_En_5_Fig3_HTML.jpg)


    Figure 5-3


    Download options for Raspbian


    The first option is the Raspbian Buster, which is the name of the Raspbian flavor
    available for the desktop and recommended software. The second option is only
    the desktop and the third is the Lite version, which does not have all the features
    needed for you to do extensive programming for your IoT applications. So you will
    use the first option, which provides all the components of the software necessary
    to get going. You can click the Torrent or zip file depending on the software
    that you use to unzip it. I used the zip file version. The zip file for the Buster
    flavor of Raspbian is approximately 2.3GB so it takes time to download depending
    on your internet connection speed.


    Once you have this downloaded, you need to insert your microSD card reader into
    the computer/laptop from which you are installing the operating system onto the
    SD card slot. Since you are using Windows, you will need a disk imaging utility.
    The free utility that I use is Win32 Disk Imager. If you do not have it, you can
    download it from this page: [`www.pmauthor.com/raspbian/`](http://www.pmauthor.com/raspbian/).
    Once you have installed the Win32 Disk Imager utility after downloading it from
    the website, you can open it by double-clicking its icon. It should look like
    the one in Figure [5-4](#484167_1_En_5_Chapter.xhtml#Fig4).


    ![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig4_HTML.jpg](images/484167_1_En_5_Chapter/484167_1_En_5_Fig4_HTML.jpg)


    Figure 5-4


    Win32 Disk Imager


    Click the browse icon shown in the figure and locate your unzipped image file
    where you downloaded it. After selecting the location of the image file, click
    the Device drop-down box on the right-hand side and select your microSD Card drive
    letter from it. The Write button on the dialog box will get enabled, so click
    it to write the image. The progress bar will show you when it is done; this should
    not take more than a few minutes. Once it is done, click the Exit button to eject
    the microSD card. You now have an image of the latest Raspbian OS written on your
    microSD card and ready to boot. Before you can boot, however, you need to set
    up the SBC physical wires on the board and then attach the microSD card to the
    Raspberry Pi 3 B+ board.


    The second step to setting up the Raspberry Pi 3 Model B+ is to get its board
    wired as shown in Chapter [2](#484167_1_En_2_Chapter.xhtml) with photos of the
    GPIO pins and the various components of the SBC. You need to plug in the bare
    minimum to get started. First, you need an LED/LCD TV or a display. There are
    many available, but the ones I prefer and use on my projects are listed at [`www.pmauthor.com/raspbian/`](http://www.pmauthor.com/raspbian/).
    If you have a spare TV, you can use the HDMI-to-HDMI cable to connect it from
    your TV to the HDMI port on the SBC. See Figures [5-5](#484167_1_En_5_Chapter.xhtml#Fig5)
    and [5-6](#484167_1_En_5_Chapter.xhtml#Fig6).


    ![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig5_HTML.jpg](images/484167_1_En_5_Chapter/484167_1_En_5_Fig5_HTML.jpg)


    Figure 5-5


    HDMI-to-HDMI cable


    If you have a small 5-inch or 7-inch display, then you will have a different cable
    and you may not have an HDMI slot on the compact LCD/LED panel.


    ![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig6_HTML.jpg](images/484167_1_En_5_Chapter/484167_1_En_5_Fig6_HTML.jpg)


    Figure 5-6


    HDMI port on Raspberry Pi 3 B+'
