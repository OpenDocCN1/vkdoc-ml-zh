  trans: '

    # 7. 电信行业案例研究：利用物联网解决通话中断问题


    本案例研究基于一个虚构的国家、虚构的公司和虚构的场景。然而，通过本案例研究，您将了解到大多数电信公司都面临的、近乎真实的通话中断问题。案例研究将带您了解一家电信运营商的成立过程，为您提供其业务建立的足够背景信息。案例研究为您提供了一个普遍的政治和商业背景，以及相对一致的社会政治利害关系，因此具体是哪个国家并不重要。在本案例研究中纳入政治和商业背景的原因，是为了让身为机器学习工程师的您认识到，基于您构建的预测模型所做出的决策有多么重要，以及这些决策如何对商业乃至整个社会产生重大影响。现在，让我们进入案例研究。


    ## 电信案例研究概述


    Regoniatel 于 2016 年开始运营，是 Regonia 的一家 2G 电信运营商。Regonia 是一个三面环山的国家。


    首席执行官是 Kaun Methi John。他还拥有其他业务，例如采矿和炼油，并因此致富。他在这个欧洲小国建立了一个商业帝国。


    当 Regonia 采用新的 2G 移动电话技术时，政府向有兴趣的企业征集提案。John 明白这是他拓展业务、进入未来将蓬勃发展的电信行业的黄金机会。由于他缺乏在本国建立电信基础设施的技术专长，他积极在全球寻找合作伙伴，以帮助他在这项新事业中取得成功。他找到了
    Samtel，一家总部位于美国的公司，该公司正在与其他公司建立合资企业。


    在项目计划和可行性研究完成后，合资伙伴为政府制定了 2G 频谱的提案。他们和其他三家公司一起中标了。他们成功获得了政府合同；然而，在建立电信网络并吸引客户入网方面，将面临激烈的竞争。其他三家公司也是由本地公司与国际电信公司合资成立的。政府认为将合同授予此类合资企业是明智之举，希望借此利用国际经验。


    政府对该国的 2G 网络进行了数月的测试，以确定其可行性。一旦内部电信机构成功完成测试，企业就可以开始运营。


    该国蓬勃发展的 1 万亿美元经济要求升级通信基础设施。该国的主要产业是农业和采矿业。该国四面环陆，没有海岸线。人们对这个国家得天独厚的金矿和钻石矿非常感兴趣，这些矿产是重要的收入来源。在金矿或钻石矿工作的矿工平均年收入为
    6,000 美元。工资较高的原因是这些矿山出产一些最好的黄金和钻石。这个国家的钻石在全球范围内都备受追捧和需求。采矿业贡献了 Regonia 近 50% 的
    GDP。


    这个国家日益增长的需求需要良好的电信基础设施，为其公民提供强大的通信系统。这个小国能够负担得起世界上最好的基础设施。


    Regoniatel 在获得频谱合同后的三年内，成功在城市地区建立了良好的基础设施。其竞争对手 Ytel 和 Fretel 也在城市和农村地区建立了移动基站。Sautele
    在开发办公基础设施四年后的问题在于，它基本上已成为一家以城市为导向的公司。


    政府设立了一个电信监管机构，负责发布所有公司的电信用户互动数据，例如客户投诉和网络故障。


    在其 2019 年的报告中，该机构强调所有运营商的通话中断率上升了 35%。问题严重到执政党和反对党开始互相指责，称电信监管机构和政府行政部门在包庇电信运营商。总理紧急召见了三家公司的负责人，讨论问题及其可能的解决方案。Sautele
    收到了关于其通话中断投诉的以下报告，如表 7-1 所示。

    '
- fmt: 'It clearly shows that there has been a rise of call drop complaints on `Regoniatel`’s
    network by 41%. It had the largest spike in call drops across all the operators.
    The telecom committee set up by the Prime Minister suggested penalizing the telecom
    operators to the tune of $900 million dollars for crossing a threshold of 10%
    complaints on call drops. This was a heavy fine and would cost the company a huge
    amount of money if call drops continued to happen on its network.


    Looking at this threat and the public outcry, the president of `Regoniatel` called
    for a meeting with its operations team in order to understand the key reasons
    behind the spike in call drops. Based on the suggestions given by the operations
    manager, there was a requirement to set up a pilot that would incorporate promising
    and innovative emerging technologies like machine learning and the IoT in order
    to come out with a solution to this techno-commercial problem. The operations
    manager called in its most experienced machine learning engineer along with the
    two best data scientists to work together on the pilot team in order to find a
    solution.


    The pilot team met for the first time and studied the various technical reasons
    that were leading to call drops including studies on various network locations
    stages given in Table [7-1](#484167_1_En_7_Chapter.xhtml#Tab1).


    **Table 7-1** Call Drop Data for Telecom Providers of Regonia, Year 2018


    | Network Name | Average Signal Strength (dBM) | Subscribers | Teledensity % |
    Network Downtime % | Successful Calls % | Call Drop Rate | Calldrop Complaints
    |

    | --- | --- | --- | --- | --- | --- | --- | --- |

    | EtiTel | 92 | 1160000 | 113 | 0.05 | 98.2 | 0.048 | 55680 |

    | GribaTel | 107 | 1030900 | 96 | 0.87 | 97.4 | 0.8352 | 861007.68 |

    | RegoniaTel | 89 | 1243080 | 97 | 1.3 | 96.2 | 1.248 | 1551363.84 |


    As you can see, the signal strength in `dBm` which is the unit to measure signal
    strength. It tells about the number of subscribers, teledensity percentage, network
    down time in percentage, successful calls in percentage, and the call drop rate
    also in percentage. The table also shows the number of call drop complaints received
    by each of the three telecom operators. The best average signal strength is that
    by `GribaTel`, then by `EtiTel`, and then followed by `RegoniaTel`. The highest
    number of subscribers are with `RegoniaTel` which are about 12.4 million. Teledensity
    is reported as 97% for `RegoniaTel`, the highest being with `EtiTel`. The highest
    network down time is reported for `RegoniaTel` at 1.3%. The successful calls percentage
    is highest for `EtiTel` and lowest with `RegoniaTel`. The call drop rate is 1.248%
    for `RegoniaTel` and lowest by `EtiTel`. Call drop complaints are also highest
    with `RegoniaTel`. So you clearly see a problem of network downtime, low average
    signal strength, and highest call drop rate with `RegoniaTel`.


    The operations manager at `RegoniaTel` reported that the number of subscribers
    was going down and service customer feedback said that more than 60% describe
    switching to rival networks due to this call drop problem. The subscriber report
    is in Table [7-2](#484167_1_En_7_Chapter.xhtml#Tab2).


    **Table 7-2** Number of Subscribers of RegoniaTel for Seven Months


    | Month | Number of Subscribers |

    | --- | --- |

    | Apr-18 | 1286588 |

    | May-18 | 1274157 |

    | Jun-18 | 1269806 |

    | Jul-18 | 1266580 |

    | Aug-18 | 1262845 |

    | Sep-18 | 1261726 |

    | Oct-18 | 1243080 |


    As you can see, there is a spike from April 2018 to October and then a steady
    drop in subscribers. This is a steady drop of 3.4% of its subscriber base in a
    seven-month period. The president of the company expressed his concern to the
    operations manager and asked him to expedite the project in order to show some
    way out of this problem.


    The machine learning engineer and the data scientists on this pilot were made
    aware of the seriousness of this problem and that it was directly linked to a
    reduction in revenue for `RegoniaTel`. If this exodus of subscribers continued,
    the subscriber base was projected to reduce by another 4.75% (Table [7-3](#484167_1_En_7_Chapter.xhtml#Tab3)).
    The operations manager also explained that every percentage drop in subscribers
    resulted in a corresponding drop of on average $10 million dollars in revenue.
    This was a substantial number for a company that was struggling to keep the quality
    of its network intact. The CEO was already thinking that he might have to lay
    off some staff to reduce the operations cost. It was a scary thought but it was
    based on the numbers that were being presented to him. He explained to the operations
    manager and the pilot team how important the success of this pilot machine learning
    and IoT-based project was for the company.


    **Table 7-3** Projected Subscribers of RegoniaTel for 2019


    | Month | Number of Subscribers |

    | --- | --- |

    | Oct-18 | 1243080 |

    | Nov-18 | 1212003 |

    | Dec-18 | 1210760 |

    | Jan-19 | 1184034 |

    | Feb-19 | 1129338 |


    The pilot team was asked to design and implement a pilot system that would be
    able to address the direct problem of call drops and should address the following
    concerns:


    1.  What was causing this problem of call drops?

    2.  In which location was this problem of call drops more prevalent?

    3.  How would you measure the call quality given a certain location?

    4.  Can a call drop be predicted? How?


    This is the complete case study. If you are from the telecom industry, you will
    find these issues very familiar and you should be able to relate to them easily.
    Follow along with me to see how I would go about building a solution as a machine
    learning consultant for this problem for `RegoniaTel`.'
