    ## Summary


    In this chapter, you saw a near-practical real-world scenario of a fictitious
    telecom company going through a socio-political crisis and whose bosses were called
    upon to investigate and correct its problem of call drops. Around the world telecommunication
    companies face similar technical challenges and problems, and are using AI to
    solve them. I showed in this case study solution how the problem of call drops
    can be predicted. Predicting problems is the first hurdle that a business has
    to jump before finding a solution for the problem. This was done in this case
    study. We built a model using a logistic regression classifier algorithm to predict
    when a call drop happens. Armed with this data, the business can see what kind
    of technical upgrades are needed to address the humidity problem as given by the
    prediction model. Are there better transmission and receiver towers available
    that work well in such humid conditions? Do they need to position some towers
    away from bodies of water? These are some of the questions that the business will
    have to address once the prediction model provides its results.


    # 8. Gantara power plant: Predictive Maintenance for an Industrial Machine


    This chapter is about an energy industry case study where we try to simulate data
    for predictive maintenance for an industrial machine. The case study is against
    a backdrop of a fictitious country in the future in the African region. It lays
    down the challenges of setting up a power plant in a third-world country from
    taking up the task of land acquisition to conceptualizing its design to actually
    setting it up. Also covered are the technical requirements for setting up a power
    plant and the technical specifications, which include industry-relevant land for
    the power plant so that you understand what a power plant really needs in order
    to be set up. If you are new or have some exposure to the energy industry, what
    you will find helpful is the table with the input processing and output format
    of the requirements of a power plant, which lays down the complete structure and
    the base of the enterprise. Although the characters, the situation, and the country
    are all fictitious, they will give you an idea of how socio-political environment
    pressures work on a basic thing like electricity energy generation. Also included
    as part of the case study is a machine learning engineer whose character is carefully
    chiseled in the case study to give you an understanding as to what pressures a
    typical machine learning engineer would go through when working with these kinds
    of problems. So let’s dive into our case study.


    ## The Case Study


    Noki Ora, the CEO of a private power plant, has just landed in the capital city
    of Gantara in Nobag, Africa, which is seeing rapid development due to the progressive
    policies of its recently elected government. However, with development comes the
    challenge of producing enough power for industrial and residential needs. Noki
    has been with the company right from the time the plant was conceptualized to
    its current state where it is now generating power on peak loads of 500 MW. The
    journey has not been straightforward; it’s been riddled with problems all the
    way. The fact is that power generation plant setup in a third-world country has
    immense challenges from finding funding partners to finding plant equipment suppliers
    willing to do the installation.


    Nobag became an independent country in the African continent after the end of
    the Syrian War in the year 2024 when the major countries came together to carve
    out this nation. Ever since its independence, the country has seen a rise in interest
    in the development of its mining and agrarian industries, which are the mainstay
    occupations for the people here. Its government has set up various special economic
    zones that give various tax breaks to companies that come here to set up businesses.
    Noki’s company, Nobag Power Enterprise Ltd., is one such company that has been
    set up by a group of European conglomerates in order to harness the country’s
    development potential and provide a boost to its infrastructure. Nobag President
    Ag Zisi gave the following charter, which was part of the presidential order,
    to Nobag Power Enterprises in order to succeed in its mission:


    *Nobag Power Enterprises is given permission to generate and distribute thermal
    power up to 500 MW capacity to support the capital region of Gantara for its power
    requirements in a two year time period.*


    The company’s vision statement reflects the President’s charter and reads


    *Nobag Power Enterprises has a vision to generate and distribute power to meet
    the electrical energy needs of the people of Nobag in order to help its residential
    and industrial development.*'
