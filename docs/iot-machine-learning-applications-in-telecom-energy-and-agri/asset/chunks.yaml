    至此，Arduino 端的程序代码编写完毕。你可以按照第 3 章和第 5 章所示的步骤，将其编译并上传到 Arduino Mega 2560 上。你应该能看到代码编译成功和上传成功的消息，如图
    6-6 和图 6-7 所示。


    ![../images/484167_1_En_6_Chapter/484167_1_En_6_Fig7_HTML.jpg](img/484167_1_En_6_Fig7_HTML.jpg)


    图 6-7


    上传 EM6400 代码后显示的“上传完成”消息


    ![../images/484167_1_En_6_Chapter/484167_1_En_6_Fig6_HTML.jpg](img/484167_1_En_6_Fig6_HTML.jpg)


    图 6-6


    编译 EM6400 代码后显示的“编译完成”消息


    至此，Arduino 端的代码步骤已完成。但是，你无法在 Arduino 端看到线对中性点电压和频率的结果。请记住，你是通过 `Serial.write()`
    语句将所有内容写入串口的。要读取这些值，你需要编写一个非常小的 Python 程序，来显示 Arduino Mega 2560 正在向串口写入的内容。


    首先，你需要安装一个名为 serial 的 Python 包或模块，可以在 Raspberry Pi 3 B+ 的命令行中完成安装，如图 6-8 所示。


    ![../images/484167_1_En_6_Chapter/484167_1_En_6_Fig8_HTML.jpg](img/484167_1_En_6_Fig8_HTML.jpg)


    图 6-8


    在 Raspberry Pi 3 B+ 上安装 Python 的 serial 模块


    Python 安装通常默认包含此模块，因此你可能无需安装。你可以通过在 Python 提示符下运行简单的导入语句 `import serial` 来检查是否需要安装，如图
    6-9 所示。


    ![../images/484167_1_En_6_Chapter/484167_1_En_6_Fig9_HTML.jpg](img/484167_1_En_6_Fig9_HTML.jpg)


    图 6-9


    检查 serial Python 模块是否已安装


    如果出现错误，则表示你的 Python 版本未安装该模块。如果没有出现错误，并且 Python 提示符 `>>>` 返回且未发出任何消息，则表明该库模块已存在，你无需再次安装。


    现在你已经安装了 serial 库，可以继续编写 Python 代码来从串口获取数据。参见代码清单 6-8。


    ```

    import serial

    ser= serial.Serial(''/dev/ttyACM0'', 9600)

    while 1:

    print("Reading...")

    print(ser.readline())

    代码清单 6-8

    从 Arduino 串口读取数据的 Python 代码

    ```


    在这个 Python 程序中，你首先导入 `serial` 对象，然后使用 `serial.Serial()` 函数创建一个名为 `ser` 的对象，第一个参数是
    `/dev/ttyACM0`；这通常是 Arduino 通信的串口。第二个参数 `9600` 是电能表通信的波特率。这是你在图 6-10 的代码块中设置的频率值。如果你因某种原因更改了该频率，则需要在此处将其更改为相同的值，否则会因波特率不匹配而无法通信。当你运行这个
    Python 程序时，你将看到类似于代码清单 6-9 中给出的输出。代码 `ser.readline()` 从连接到 Arduino Mega 2560 的串口读取一行值，进而读取连接到
    EM6400 电能表的值。


    ```

    >>> %Run arduino.py

    Reading...

    b''Hello World\r\n''

    Reading...

    b''preTransmission\r\n''

    Reading...

    Line to Neutral Voltage:

    221.5

    Frequency:

    49.67

    b''postTransmission\r\n''

    代码清单 6-9

    Raspberry Pi 3 B+ 上 Python 程序的示例输出

    ```


    你可以在示例输出中看到，程序以写入 `preTransmission` 开始，然后打印“Line to Neutral Voltage:”及其值 221.5，接着打印“Frequency:”及其值
    49.67。这每 2 秒在一个无限循环中运行，每次设置运行时，串行通信输出中都会打印“Hello World”。你可以将其更改为更有意义的内容，例如“Setup
    initialized.”。这由你决定。


    至此，Conzerv EM6400 电能表的配置和设置就完成了。现在，正如我在本章开头所承诺的，你将配置一个仅使用单相两线设置的电能表，这要简单得多。这款电能表是
    Eastron SDM630，它也带有 Modbus 接口。这次你将不再使用 Arduino Mega 2560，而是使用 Python 和 Raspberry
    Pi 直接从中获取数据。


    现在，你将首先通过单相连接与单个 Eastron SDM 630 进行连接。我不建议以串联或菊花链方式连接多个此类仪表，因为与 Arduino Mega 2560
    不同，Raspberry Pi 3 B+ 不是坚固的工业级板卡，很容易烧毁。因此，我这里给出的连接系统仅适用于小型项目，不同于前面章节中 Conzerv EM6400
    的连接和配置。


    Eastron SDM630 电能表（图 6-10）由一家中国公司制造，在全球范围内都很容易买到。如果你需要，可以查看 [`www.pmauthor.com/raspbian`](https://www.pmauthor.com/raspbian)
    上的链接。这款智能电能表是家用和工业用途中最受欢迎的电能表之一，也支持三相连接。我推荐这款，因为我和我的团队在客户项目中已对其进行了充分的个人和商业应用测试，它表现良好。虽然市场上有一些竞争对手，但我们最常使用的是这款流行的产品。


    ![../images/484167_1_En_6_Chapter/484167_1_En_6_Fig10_HTML.jpg](img/484167_1_En_6_Fig10_HTML.jpg)


    图 6-10


    Eastron SDM630


    第一步是将此电能表连接到 Raspberry Pi，为此你需要以下组件：


    1.  RS485 Modbus USB 转换器


    2.  至少 1 米长的双绞线，能够通过 5V 电流


    3.  Eastron SDM630 电能表


    4.  单相机器，例如带有电子线圈和电机以产生无功功率的电机或铣床


    5.  至少 20W 的 LED 灯泡以产生有功功率


    列出的所有物品及其规格均在 [`www.pmauthor.com/raspbian/`](https://www.pmauthor.com/raspbian/)
    上提及。让我们开始将它们全部连接起来。


    RS485 USB 转换器需要与双绞线连接，如图 6-11 所示。你可以看到需要连接的特定端子。USB 转换器的底部有两个端子引脚。


    ![../images/484167_1_En_6_Chapter/484167_1_En_6_Fig11_HTML.jpg](img/484167_1_En_6_Fig11_HTML.jpg)


    图 6-11


    RS485 USB 转换器

    '
- fmt: 'They are marked as `A` and `B`. Please note that these are the same terminals
    in the energy meter that are marked `A` and `B`, as shown in Figure [6-12](#484167_1_En_6_Chapter.xhtml#Fig12).
    If you insert the pink wire to the terminal marked `A`, then you must connect
    the same pink wire at the other end to the energy meter terminal marked `A`; if
    you do the opposite, it may damage the energy meter, so keep this in mind. Similarly,
    connect the grey wire marked at terminal `B` in the USB convertor to the one marked
    `B` in the energy meter. This completes the USB convertor connection to the energy
    meter.


    For your own safety, please ensure that neither the Raspberry Pi nor the energy
    meter is running. Make sure they are in the off position and unplugged from any
    electrical terminals. This is to prevent accidental shocks. Also, never connect
    to the mains unless you have MCB or circuit breakers installed in your electrical
    system, so that in the eventuality of a short circuit the MCB trips and doesn’t
    cause damage to the electrical wiring system.


    ![../images/484167_1_En_6_Chapter/484167_1_En_6_Fig12_HTML.jpg](images/484167_1_En_6_Chapter/484167_1_En_6_Fig12_HTML.jpg)


    **Figure 6-12** Connecting wires to the RS485 Modbus Converter


    Have a look at the corresponding wire connections in Figure [6-13](#484167_1_En_6_Chapter.xhtml#Fig13),
    which has the grey wire connected to the `B-` terminal and the pink wire connected
    to the `A+` terminal on the Eastron SDM630 Energy Meter.


    ![../images/484167_1_En_6_Chapter/484167_1_En_6_Fig13_HTML.jpg](images/484167_1_En_6_Chapter/484167_1_En_6_Fig13_HTML.jpg)


    **Figure 6-13** Wires connected to the data terminals inside the Eastron SDM630


    Now that both the ends of the twin wires are connected, you must make two connections
    to the SDM630 Energy Meter. One is for the input wire connections, which will
    come from the mains and supply power to the energy meter, and the second is the
    output wire connections, which will supply electrical current to the load or the
    source of the current such as an LED bulb, electrical motor, or milling machine.
    This is depicted in Figure [6-14](#484167_1_En_6_Chapter.xhtml#Fig14).


    ![../images/484167_1_En_6_Chapter/484167_1_En_6_Fig14_HTML.jpg](images/484167_1_En_6_Chapter/484167_1_En_6_Fig14_HTML.jpg)


    **Figure 6-14** Input connections to the Eastron SDM630 Energy Meter


    As you can see, there are four terminal wire connections in the input side of
    the meter. Out of the four terminals, since you are using a single-phase two-wire
    model in this energy meter, you need only terminal number 4 connected with the
    black wire or Neutral and terminal number 1 with the red wire or the power cable,
    also known as live wire. Once you have these wires connected, you can connect
    the socket end of these wires with a plug. Please note that you are not using
    the third wire, the ground wire, in this architecture. The plug connection is
    shown in Figure [6-15](#484167_1_En_6_Chapter.xhtml#Fig15) for your convenience.


    ![../images/484167_1_En_6_Chapter/484167_1_En_6_Fig15_HTML.jpg](images/484167_1_En_6_Chapter/484167_1_En_6_Fig15_HTML.jpg)


    **Figure 6-15** Plug connection to the input wire of the energy meter


    You now have to make the connection to the output terminals of the energy meter
    and place a load at the other end of it like an LED bulb, electric motor, or milling
    machine. Remember they all need to be single phase. So connect them up as shown
    in Figure [6-16](#484167_1_En_6_Chapter.xhtml#Fig16), where the output red or
    live wire is connected to terminal 6 and the output black or neutral wire is connected
    to terminal 8.


    ![../images/484167_1_En_6_Chapter/484167_1_En_6_Fig16_HTML.jpg](images/484167_1_En_6_Chapter/484167_1_En_6_Fig16_HTML.jpg)


    **Figure 6-16** Output wire connections to the energy meter


    Once this connection is done, you need to connect the other end of the terminal
    wire to a load such as an LED bulb, single-phase milling machine, or electric
    motor. In Figure [6-17](#484167_1_En_6_Chapter.xhtml#Fig17), you can see an LED
    bulb connected as the load; however, this will not give very realistic data as
    the reactive power will always be zero. Nevertheless, it is a good way to test
    your circuit. The load at the other end can always be replaced with any other
    within no time.


    ![../images/484167_1_En_6_Chapter/484167_1_En_6_Fig17_HTML.jpg](images/484167_1_En_6_Chapter/484167_1_En_6_Fig17_HTML.jpg)


    **Figure 6-17** LED bulb connected to the output end of the energy meter


    At this stage, all the output and input connections are done and you can power
    on the energy meter by connecting it to the power socket from the input end. You
    should see the energy meter come to life and the LED bulb light up, as shown in
    Figures [6-18](#484167_1_En_6_Chapter.xhtml#Fig18) and [6-19](#484167_1_En_6_Chapter.xhtml#Fig19),
    respectively.


    ![../images/484167_1_En_6_Chapter/484167_1_En_6_Fig19_HTML.jpg](images/484167_1_En_6_Chapter/484167_1_En_6_Fig19_HTML.jpg)


    **Figure 6-19** LED bulb and energy meter after power on


    ![../images/484167_1_En_6_Chapter/484167_1_En_6_Fig18_HTML.jpg](images/484167_1_En_6_Chapter/484167_1_En_6_Fig18_HTML.jpg)


    **Figure 6-18** Eastron SDM630 Energy Meter after power on


    This completes the hardware side of the setup. Please remember that you have not
    yet connected the Raspberry Pi 3 B+ to the energy meter. This is just to check
    that all the connections to the energy meter are working and that the load powers
    on along with the energy meter. If this is successful, you can connect with the
    Raspberry Pi and then use a Python program to get data from it and store it in
    a SQLite3 database. After powering on the energy meter, you can power on the Raspberry
    Pi 3 B+. But before that, please remember to connect the RS485 Modbus converter
    to a USB port in the Raspberry Pi, as shown in Figure [6-20](#484167_1_En_6_Chapter.xhtml#Fig20).


    ![../images/484167_1_En_6_Chapter/484167_1_En_6_Fig20_HTML.jpg](images/484167_1_En_6_Chapter/484167_1_En_6_Fig20_HTML.jpg)


    **Figure 6-20** Connecting the RS485 Modbus converter to the Raspberry Pi 3 B+


    Please note there is no LED light on this RS485 converter module PCB, so there
    is no way to tell that it is receiving a signal from the energy meter except from
    the Python software. It’s named `sdm630_tested.py` and you can unzip it from the
    bundle pack available at [`www.pmauthor.com/raspbian/`](https://www.pmauthor.com/raspbian/).
    The entire code is given in Listing [6-10](#484167_1_En_6_Chapter.xhtml#PC11).
    Before you can run the Python code, you need to install the Python libraries that
    are required by the Raspberry Pi to communicate with the energy meter using the
    RS485 Modbus protocol. For this you, need to install a Python library known as
    `minimalmodbus`. First, run the commands `sudo apt-get update` and then `sudo
    apt-get upgrade` because it is a good practice to keep the OS libraries and kernel
    updated and upgraded so that newer Python libraries do not fail due to any dependencies
    on the newer Raspbian structure. Figures [6-21](#484167_1_En_6_Chapter.xhtml#Fig21)
    and [6-22](#484167_1_En_6_Chapter.xhtml#Fig22) show this installation procedure.


    ![../images/484167_1_En_6_Chapter/484167_1_En_6_Fig22_HTML.jpg](images/484167_1_En_6_Chapter/484167_1_En_6_Fig22_HTML.jpg)


    **Figure 6-22** Upgrading the Raspbian kernel


    ![../images/484167_1_En_6_Chapter/484167_1_En_6_Fig21_HTML.jpg](images/484167_1_En_6_Chapter/484167_1_En_6_Fig21_HTML.jpg)


    **Figure 6-21** Updating the Rapsbian kernel


    After you have installed the `minimalmodbus` Python module (Figure [6-23](#484167_1_En_6_Chapter.xhtml#Fig23)),
    you can load the Python code and run it (Listing [6-10](#484167_1_En_6_Chapter.xhtml#PC11)).
    Just a reminder: By this time your energy meter should be up and the Raspberry
    Pi 3 B+ connected using the RS485 Modbus converter.'
