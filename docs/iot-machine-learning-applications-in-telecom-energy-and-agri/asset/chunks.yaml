    ## 物联网传感器


    物联网是将互联网连接扩展到日常物理设备和物品的延伸。当传感器和互联网连接等设备被添加到艺术品或任何其他显示创建日期、艺术家描述、最近修改日期等信息的物理物品中时，物联网便形成了。我们现在有了自动补货柜的概念，这些柜子可以在食物被消耗后自动在线订购。通过将物联网传感器嵌入日常物品，我们正在使它们变得智能且易于使用，以造福人类。


    市面上常见的物联网传感器均可与树莓派和 Arduino 配合使用，因为它们都使用 GPIO 引脚进行通信。表 1-4 列出了可在树莓派和 Arduino 上使用的常见传感器类型。


    **表 1-4**


    **常见物联网传感器类型及其用途**


    | 传感器类型 | 用途 |

    | --- | --- |

    | 机器视觉 | 光学和环境光检测 |

    | 接近与位置 | GPS 定位及物体存在检测 |

    | 温度 | 检测空气、土壤和水中的大气温度 |

    | 湿度/水分 | 检测空气和土壤中的大气湿度 |

    | 声学 | 检测大气中的次声波和超声波振动 |

    | 化学 | 检测空气、土壤和水中的气体含量 |

    | 流量 | 检测管道等封闭区域内的空气和水流 |

    | 电磁 | 检测环境中的电磁水平 |

    | 加速度 | 检测所连接电子设备的倾斜角度 |

    | 负载/重量 | 检测被监测环境中负载或重量的变化 |


    从表 1-4 中可以看出，有各种各样的传感器可用，它们从数字到模拟，从使用 Wi-Fi 摄像头测量和检测物体，到检测电子设备上重量或负载的变化。这些传感器的用途和应用是无限的，可以为物联网应用注入新的活力。在本书中，您将使用这些常见类型的传感器，并且在您构建解决方案时，我将更详细地介绍它们。


    ## 无人机


    根据维基百科（[`https://simple.wikipedia.org/wiki/Unmanned_aerial_vehicle`](https://simple.wikipedia.org/wiki/Unmanned_aerial_vehicle)）的定义，无人机是一种通过遥控设备操作的无人驾驶飞行器。无人机内部通常嵌入了一个小型微控制器，能够检测气压变化、物体接近度、加速度等。它内部嵌入了许多物联网传感器，使其比有人驾驶飞机更智能。然而，很少有自动无人机可以在无需人工监督的情况下飞行和工作。大多数无人机都有操作员通过遥控机制控制其活动。


    您将在电信领域案例研究的解决方案中使用工业级无人机。您需要一架能够承载高达 3.5 磅（约 1.5 公斤）有效载荷、航程为 5 公里的工业级无人机，因为您将用它在一个特定区域的周边进行探测。您需要的最短飞行时间是
    30 分钟，因为这是收集一些像样数据以应用机器学习所需的最短时间。这类无人机绝对不便宜；起售价为 2500 美元。


    ## Modbus 设备


    您将在案例研究的能源部分使用另一种设备。Modbus 设备是一种用于连接工业设备（例如将机器连接到计算机）的标准通信协议。它们也用于收集和发送数据。有一个主设备或微控制器使用
    Modbus 协议与其从设备通信，从设备数量最多可达 247 个。这使得该协议非常强大，这也是我选择 Arduino Mega 2560 单板微控制器的原因（因为它的板上有大量用于通信的模拟和数字引脚）。


    **免责声明**


    在进一步操作之前，我想提醒您使用此 Modbus 设备作为电能表所涉及的风险。它是一种电器，如果连接不当，存在短路风险。如果不按照其使用说明书操作，也可能危及人身安全。如果连接错误，它还可能烧毁并损坏您的树莓派和
    Arduino 板。因此，如果您对电气连接不熟悉，我强烈建议您不要使用此设备，或者请当地电气技术人员提供专业帮助进行正确连接。无论是作者还是出版商，对任何形式的物质或人身损害均不承担任何责任。请用户自行斟酌。


    在工业领域，三相 Modbus 电能表被广泛使用，但这在普通环境中难以复制，因此我建议改用单相电能表，它使用 Modbus RTU 通信协议。施耐德电气等公司提供了多种选择。


    ## 所需软件


    为了运行本书中的练习，您需要安装 Python 3.x。我建议您为此使用 Raspbian 操作系统自带的默认 Python 安装。Python 是一个简单的发行版，与
    Anaconda 不同，它不需要任何安装。本书中的所有编码练习都适用于此版本的 Python。本书中的练习和解决方案不支持 Windows，也未在任何 Windows
    版本上进行过测试。必须使用 Raspbian 操作系统才能使其正常工作。请按照本书安装部分给出的步骤进行安装。


    您还将使用 Arduino IDE 在 Arduino 和树莓派之间进行通信，因此在您的解决方案中，Arduino 将作为树莓派的从设备工作。这可以通过`apt-get`命令安装，您将在本书后面的安装部分看到该命令。


    ## 总结


    本章介绍了单板计算机及其历史发展。您了解了市场上最流行的单板计算机，例如香蕉派、树莓派和 Arduino。通过深入比较，您从 USB、存储、网络和通信功能方面探索了流行单板计算机的特性。您还了解了树莓派，特别是树莓派
    3 Model B+，您将在本书后面的物联网和工业物联网项目中将其用作主节点。您了解了树莓派上的 GPIO 引脚及其用途。您还了解了单板微控制器及其与单板计算机的区别。您还了解到，在物联网和工业物联网应用中，单板微控制器通常用作树莓派等单板计算机的从设备。您还了解到最流行的单板微控制器是
    Arduino，并查看了一个关于 SBM 类型和功能信息（如处理器、I/O 模块、频率、电压等）的表格。


    接着，您了解了 Arduino Mega 2560 及其布局，并学习了其 GPIO 引脚。然后，您学习了本书最重要的主题：物联网传感器及其类型和应用。您还了解了无人机，因为它们将用于为本书中的电信应用收集数据。您了解了
    Modbus 设备以及如何使用它来构建商业应用。最后，您获得了将在本书中使用的软件列表。'
- fmt: '# 2. Overview of IoT and IIoT


    You looked at the definition of IoT in Chapter [1](#484167_1_En_1_Chapter.xhtml).
    In this chapter, I want to expand on it. What makes the concept of the Internet
    of Things work are the twin abilities of using small scale sensors and motors,
    and controlling their input and output through programming interfaces. The crux
    of IoT is the ability to remotely monitor and control the devices. This can be
    achieved through small programmable microcontrollers or microcomputers that interface
    with such devices. In using IoT, various technologies have come together like
    embedded systems, control systems, and digital and analog sensors. The concept
    is to embed sensors into everyday objects and make them smarter by monitoring
    and controlling them. However, not every IoT-enabled device catches the fancy
    of the consumer or meets a business needs.


    ## A Closer Look at the IoT


    There have been experiments with everyday objects such as smart choice, which
    monitors how much time you sit on it and monitors your vital statistics such as
    blood pressure, etc. In some of cases, the consumer does not see benefit buying
    these products.


    Not all smart objects provide substantial benefits to the consumer or she may
    fail to perceive it as a substantial benefit for the extra price. In such cases,
    the smart product will fail at its launch. Although the technical capability does
    exist to make the object smarter, the consumer perception does not meet the expectations
    of the consumer.


    There’s also the concept of a smart home, in which objects like dishwashers are
    controlled out of a central monitoring system. However, due to its expense, this
    hasn’t gained popularity.


    Figure [2-1](#484167_1_En_2_Chapter.xhtml#Fig1) illustrates the technological
    advancement in the field of IoT. It’s reiterated from my book *Machine Learning
    Applications Using Python*.


    ![../images/484167_1_En_2_Chapter/484167_1_En_2_Fig1_HTML.jpg](images/484167_1_En_2_Chapter/484167_1_En_2_Fig1_HTML.jpg)


    Figure 2-1


    Machine learning technology adoption process


    The IoT is presently in the stage of quick applications and early applications.
    You know that track applications stage it is trying to forget the past such as
    switching all end of the home electrical appliances. Applications stage today’s
    benefit by reducing the cost of monitor dinosaurs installing IoT sensors and cameras
    for security etc. The next stage of applications sends it to you state applications
    stage. By using the Internet of Things, the effort will be to augment the capability
    to predict the needs of humans, such as ordering groceries inside smart cabinets
    by using computer vision cameras to monitor the number of common household items
    inside it and predict when they will need to be replenished. Such applications
    make it to the third stage, the assisted applications stage, or the fourth stage,
    where robotic operations augment human capabilities. The operations that a human
    servant would perform at home today will be performed by a robot, such as cleaning
    utensils and clothes. Such robots would have the ability to predict any future
    problems that can happen in the household and also prescribe remedies for them.
    For example, a reordering robot would check if any of the items are getting low
    and then send a reorder online to a nearby store that offering a discount plus
    home delivery. It could also wait for confirmation of the placed order. If it
    does not get confirmation in the specified time, it would send an alert to its
    human master via SMS or even walking up to them and showing the problem to them
    directly. It could also suggest alternatives such as ordering the product from
    a faraway store that does not do home delivery. Such a robot would definitely
    be an asset to any household. This is just an example of how robotic operations
    could become predictive but also prescriptive in suggesting an alternate solution
    to a potential problem before it arises. Table [2-1](#484167_1_En_2_Chapter.xhtml#Tab1)
    shows some example applications of the IoT in the current scenario.


    Table 2-1


    Applications of the IoT


    | Technology Phase | Application of IoT |

    | --- | --- |

    | Quick applications | Home automation |

    | Early applications | Personal wearables |

    | Smart city |

    | Assisted applications | Farm automation |

    | Retail automation |

    | Smart car |

    | Independent operations | Medical surgery |


    You can see home automation move to the applications stage in the table above
    because people are currently automating mundane home tasks that they are performing
    repeatedly, day in and day out, such as switching off appliances and monitoring
    and controlling them through personal phones like Android and iPhone devices.
    These applications allow you to control devices like smartwatches, which can accurately
    gather personal bio information like number of steps taken, heartbeats per minute,
    blood pressure rate, and oxygen carrying capacity. These apps can generate reports
    on a weekly, monthly, or yearly basis and use that data to show your health routine.


    Another development in the IoT arena is that of the smart city, which is at the
    stage of early application. The most prominent one is Singapore, which is trying
    to truly become one in every way. Smart buildings are being built so that they
    take in maximum sunlight and are self-dependent by using energy recycling methods
    such as rainwater harvesting solar panels for producing off-grid energy for the
    residents. A smart city recycles all its waste and consumes and recycles all its
    resources such as water, oil, garbage, and gas.


    Farm automation is one of the examples of an early application of automated operations
    now possible due to the IoT; however, it has to move to the predictive stage where
    it is able to produce the crop cycles such as crop failure or crop success. The
    Weather Company by IBM ([`www.ibm.com/weather`](http://www.ibm.com/weather)) is
    trying to change the way farming automation is being done by trying to predict
    the weather for crops. Today’s farming is completely dependent upon weather cycles
    and seasons. Although everything in relation to farming, from sowing the seeds
    to harvesting them, has been automated, the ability to predict the weather for
    farming will truly move it to the stage of independent operations.


    Smart cars are another such application. When you can drive a smart car in crowded
    areas using IoT sensors such as computer vision sensors and GPS locators, this
    application will be in the stage of independent operations; also, when it can
    predict and prevent accidents.


    Medical surgery has to a certain extent attained the independent operation level,
    like medical surgery for cancer where the robot can independently do surgery by
    augmenting the surgeon’s tasks. 2019 game search applications Other surgeries
    will mature over time as the world does more research on how to add surgery skills
    to robots so that they become more efficient.


    These are some of the examples of applications of for the IoT to give you a context
    on how they are placed with technology adoption.'
