    ### Typing


    Typing is an old way of doing things. It’s how laptops and PCs have been receiving
    inputs from human beings since the beginning. The advantage is that many people
    are familiar with how to type on a keyboard. However, for PCs and many laptops,
    it’s necessary to have an external keyboard. Typing on a keyboard is a fairly
    private activity as long as the screen is not visible to others. In terms of love
    letters, screen privacy is important.


    In terms of disadvantages, typewriting takes time and skill; in fact, special
    practice is required to type quickly and accurately. Proper finger placement on
    the keyboard requires practice. Regardless of skill, typing can get very tiring
    and can cause serious injury like carpal tunnel issues. The other disadvantage
    is that it is not a real-time input from the brain; the lag between our brain
    and any activity on the keyboard has to do with the extra processing of converting
    thoughts to the motor activity of spelling each word and then giving each finger
    the command to type appropriately. This can be seen in Figure [2-2](#484167_1_En_2_Chapter.xhtml#Fig2)
    where I show you the process of a human typing.


    ### Voice Dictation


    Now let’s look at voice dictation. It’s a new way to import data into computers
    and other machines. The major advantage over typing is that anyone who can speak
    can work with this type of input. Another advantage is that microphones are in
    every device these days including PCs, laptops, mobiles, and tablets. One of the
    greatest disadvantages of technology is that it is not a private activity; anybody
    who is nearby can listen to what you are speaking to the machine. Another disadvantage
    of this type of input is that it takes time; although in comparison to typing,
    it is faster because the brain does not have to convert each word to a finger
    movement. The biggest disadvantage of this type of input is that it does not work
    in a noisy environment; if some people are talking at the top of their voices,
    the system may fail to detect your commands properly. Another disadvantage is
    that speaking continuously for a long time makes the human jaw tired because of
    the use of the muscles around the mouth. Another difficulty for voice typing apart
    from privacy is different accents; for example, there are so many different English,
    African, American, and Asian accents. This is the reason why voice dictation programs
    aren’t very popular.


    ### Thought AI


    Love will come to technology in the future; this is my vision of how this technology
    is going to develop. It is going to be the new way of doing things. Its greatest
    advantage is that this type of input is available to everyone who can think. People
    with disabilities can use this type of input. The best example is the popular
    scientist Stephen Hawking, who had physical disabilities but could communicate
    with the machine through his thoughts. The current disadvantage is that commercial
    grade thought IoT sensors have yet to be developed. Once this type of IoT sensor
    is developed and on the market, they will be built into every device. The key
    advantage of Thought AI is that it provides total privacy; nobody else except
    the device reading your thoughts knows what you are thinking. This is why this
    type of input is going to be popular; it’s going to be a real-time input from
    the brain. The catchy phrase that is going to popularize this concept is "what
    you think is what you get." The advantage is that it does not require any special
    skill like learning to bang on a keyboard. Another advantage is that there is
    hardly any physical activity required for this kind of input; you only get tired
    if you get tired of your thoughts. The biggest advantage of this input is that
    there is hardly any lag between what you think and what will be available to the
    machine through the thought IoT sensor. There won’t be any issue with accents
    because thoughts are universal and they don’t have any accent, so they don’t care
    if you speak in African English or Asian English or American English. So now you
    have looked at the futuristic Thought AI. It will truly revolutionize the way
    we will interact with machines and the way machines interact with us.'
