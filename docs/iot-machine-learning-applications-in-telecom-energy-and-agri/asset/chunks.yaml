    for choosing different cloud services, such as the offerings by giants like Amazon
    AWS Cloud Platform, Microsoft Azure, and the Google Cloud platform. Today’s need
    is for these different clouds to speak to each other; this is known as connected
    clouds, such as the partnership formed by Oracle and Microsoft by connecting their
    cloud platform services. The survey also talks about connecting private and public
    cloud for any company for servicing their data storage needs. The survey also
    talks about edge computing, which is going to break through in 2019\. The survey
    talks about digital twins, which are also known as hybrid or virtual prototyping
    businesses using special tools like AI and machine learning and IoT to improve
    their customer business experiences by streamlining their data operations. This
    survey highlights that 5G will be game-changing in the IoT market by bringing
    about revolutionary applications. One point mentioned by this survey is sensor
    innovation, although it does not talk about what type of sensors will be developed
    in the market, but it says that the new special purpose sensors will lead to efficient
    and effective use of power consumption using deep neural networks, leading to
    new age architectures and low power IoT and endpoint devices. The development
    of new algorithms using data from these sensor technologies will lead to new implementations
    in the domains where they are applied. The survey prediction for social IoT, which
    is giving rise to social anxiety and is going to transfer the business sector
