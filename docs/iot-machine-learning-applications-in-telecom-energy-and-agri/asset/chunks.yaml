- fmt: '# IoT sensors


    IoT is an extension of internet connectivity to everyday physical devices and
    objects. When devices like sensors and internet connectivity are added to it and
    embedded to physical devices like art objects or any other object that display
    information on creation date, an artist description of the object, recently modified
    date, etc., then the IoT is formed. We now have the concept of automatic reordering
    cabinets which can order food online as they gets empty upon consumption. By embedding
    IoT sensors in everyday objects we are making them smart and accessible for human
    betterment.


    The common IoT sensors available on the market work with both the Raspberry Pi
    and Arduino because they use GPIO pins to communicate. Table [1-4](#484167_1_En_1_Chapter.xhtml#Tab4)
    lists the common types of sensors that can be used both on Raspberry Pi and Arduino.


    **Table 1-4** Common Types of IoT Sensors and Their Purposes


    | Types of Sensors | Purpose |

    | --- | --- |

    | Machine vision | Optics and ambient light detection |

    | Proximity and location | GPS location and presence of objects |

    | Temperature | Detecting atmospheric temperature in air, soil, and water |

    | Humidity/moisture | Detecting atmospheric humidity in air and soil |

    | Acoustic | Detecting infra and ultrasound vibrations in the atmosphere |

    | Chemicals | Detecting gas content in air, soil, and water |

    | Flow | Detecting air and water flow in enclosed areas such as pipes |

    | Electromagnetic | Detecting electromagnetic levels in the environment |

    | Acceleration | Detecting the tilt of a connected electronic device |

    | Load/weight | Detecting change in load or weight in the environment which is
    being monitored |


    You can see from Table [1-4](#484167_1_En_1_Chapter.xhtml#Tab4) that there are
    a variety of sensors available and they range from digital to analog to measure
    and detect objects using Wi-Fi cameras to detecting a change in weight or load
    on an electronic device. The uses and applications of these sensors are limitless
    and can give fresh life to an IoT application. You will be using these common
    types of sensors in this book and I will outline them in more detail as you build
    your solutions.


    # Drones


    A drone is defined by Wikipedia ([`https://simple.wikipedia.org/wiki/Unmanned_aerial_vehicle`](https://simple.wikipedia.org/wiki/Unmanned_aerial_vehicle))
    as an unmanned aerial vehicle operated through remote control devices. Drones
    usually have a small microcontroller embedded inside them which has the capability
    to detect changes in air pressure, the proximity of objects, acceleration, etc.
    It has many IoT sensors embedded within it, making it smarter than manned planes.
    However, there are very few automatic drones that do not require human supervision
    to fly and work. Most drones have human supervisors who control their activities
    through a remote control mechanism.


    You will be using an industrial grade drone in the solution for the telecom domain
    case study. You will need an industrial grade drone that can take payloads up
    to 3.5 pounds or 1.5 kgs and has a range of 5 km since you will be flying it for
    detection purposes around an area in a particular locality. The minimum flight
    time you need is 30 minutes because this is the minimum time required to gather
    some decent data to apply machine learning. These types of drones are definitely
    not cheap; they start at $2,500.


    # Modbus Device


    You will be using another device in the energy segment of the case study. A Modbus
    device is a standard communication protocol for connecting to industrial devices,
    such as machines to a computer. They are also used to gather and send data. There
    is a master device or microcontroller that uses the Modbus protocol to communicate
    with its slaves, which can be up to 247 in number. This makes the protocol very
    robust, which is the reason I chose an Arduino Mega 2560 single-board microcontroller
    (because it has a lot of space for analog and digital pins on its board for communication).


    **Disclaimer**


    Before proceeding further, I would like to warn you of the risk associated with
    using this Modbus device as the energy meter. It is an electric appliance and
    carries the risk of short-circuiting if not connected properly. It can also be
    dangerous to human life if not used as per its instruction manual. It can also
    burn and damage your Raspberry Pi and Arduino boards if wrong connections are
    made. So if you are not comfortable with electric connections, I strongly advise
    you to not use this device or to get expert help from a local electrical technician
    to make the proper connections. Neither I nor the publisher can be held responsible
    in any way whatsoever for any kind of damages, either material or to life. User
    discretion is advised.


    In the industrial world, three-phase Modbus energy meters are used, but this is
    difficult to replicate in a normal environment, so I recommend using a single-phase
    energy meter instead, which uses the Modbus RTU communication protocol. There
    are plenty of options available from companies such as Schneider Electric and
    others.


    # Required Software


    For running the exercise in this book, you will need Python 3.x installed. I recommend
    you use the default Python installation that comes with the Raspbian OS for this
    purpose. Python is a simple distribution and it does not require any installation
    whatsoever, unlike Anaconda. All the coding exercises in this book work on this
    version of Python. The exercises and solutions in this book do not support Windows
    nor have they been tested on any version of Windows. Using the Raspbian OS is
    a must to make them work. Please follow the steps for installation that are given
    in the installation section of this book.


    You will also be using the Arduino IDE to communicate between the Arduino and
    Raspberry Pi, so the Arduino is going to work as a slave to the Raspberry Pi in
    your solutions. This can be installed via the `apt-get` command, which you will
    see later in the installation part of the book.


    # Summary


    This chapter covered SBCs and how they have developed historically. You learned
    about the most popular SBCs in the market, such as Banana Pi, Raspberry Pi, and
    Arduino. In an in-depth comparison, you explored the features of popular SBCs
    in terms of USB, storage, networking, and communication features. You also learned
    about the Raspberry Pi and more specifically the Raspberry Pi 3 Model B+ that
    you will be using to use as a master node in your IoT and IIoT projects later
    in this book. You learned about the GPIO pins located on the Raspberry Pi and
    their uses. You also learned about the single-board microcontrollers and how they
    are different from the single-board computers. You also learned that the single-board
    microcontrollers in IoT and IIoT applications are generally used as slaves to
    the single-board computers like Raspberry Pi. You also saw that the most popular
    single-board microcontroller is the Arduino and you looked at a table about the
    types of SBMs and feature information like processors, I/O modules, frequency,
    voltage, etc.


    You then looked at the Arduino Mega 2560 and its layout and learned about its
    GPIO pins. Then you learned about the most important topic of the book: IoT sensors
    and their types and applications. You also learned about drones, as they will
    be used to collect data for the telecom application in this book. You learned
    about a Modbus device and how it is used to build a commercial application. Lastly,
    you got a list of software that will be used through this book.'
