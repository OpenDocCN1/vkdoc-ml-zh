    | 4.1 | Mini-HDMI | - | 支持 |


    在进入下一节关于微控制器的主题之前，我们先来看一下树莓派架构中一个非常重要的方面，即 SBC 板上的 GPIO 引脚布局。这些引脚用于与辅助硬件通信，例如传感器或其他能够进行串行通信的微控制器（如
    Arduino）。图 1-1 展示了 Raspberry Pi 3 Model B+ 的 GPIO 引脚布局。


    ![../images/484167_1_En_1_Chapter/484167_1_En_1_Fig1_HTML.jpg](img/484167_1_En_1_Fig1_HTML.jpg)


    图 1-1


    Raspberry Pi 3 Model B+ 的 GPIO 引脚布局


    在图 1-1 中，你可以看到总共有 40 个 GPIO 引脚。它们具有特定的结构，理解这一结构对于使用它们至关重要。图中引脚编号从 1 到 40。引脚 1
    和 17 用于为你的设备提供电源输出（3.5 伏）。引脚 2 和 4 用于分别提供 5 伏的电源输出。编号为 6、9、14、20、25、30、34 和 39
    的引脚用于电路接地。其余引脚用于 GPIO。稍后当你为某些基于物联网的解决方案创建完整电路时，将会用到这些信息。


    现在我们来讨论微控制器及其使用方法。


    ## 单板微控制器


    SBM 是集成在单块电路板上的微控制器；它们用于工业和商业应用，作为工业与商业设备（例如使用串行总线通信的设备）之间的接口。它们被用于开发需要与工业机器或网络接口（例如需要
    Modbus 通信协议的接口）进行交互的解决方案。


    Arduino 是一种非常流行的单板微控制器，被爱好者和学生用来学习硬件实现，以及如何控制和构建与常见 C 和 C++ 程序交互的爱好机器。然而，我们将把
    Arduino 用于工业级目的。让我们比较 Arduino 系列中的三个型号，以便为我们的目的选择最佳的微控制器。


    我们将比较 Arduino Uno、Arduino Mega 和 Arduino Mega 2560 这三个型号。这三款单板微控制器均使用 16MHz 频率的处理器。Mega
    和 Mega 2560 的印刷电路板尺寸大于 Arduino Uno，后者在长度上比两者都短一半，尺寸为 2.7 英寸 x 2.1 英寸，而前两者为 4 英寸
    x 2.1 英寸。Arduino Mega 2560 拥有最高的闪存，为 256kb，而 Arduino Uno 的闪存最低，为 32kb。Arduino
    Mega 拥有 128kb。就 SBM 而言，闪存非常重要，因为无论你编写什么程序来通过应用程序控制硬件，都必须首先写入闪存。如果闪存容量低，你就无法在其上编写工业级应用程序。两款
    Mega 型号的 EEPROM 和 SRAM 都高于 Arduino Uno；此外，Mega 型号有 54 个 GPIO 引脚，而 Uno 只有 14 个引脚。为什么我们的应用程序需要更多引脚？我们将使用应用程序与串行
    Modbus 通信接口进行通信，这可能需要同时连接两个或三个设备。如果引脚数量较少，我们在并行连接设备方面就会受到限制。因此，为此目的我们需要更多的引脚。


    因此，对我们来说最好的型号是 Arduino Mega 2560，它拥有最高的闪存。


    ### Arduino Mega 2560


    图 1-2 展示了 Arduino Mega 2560 的 GPIO 引脚布局及其通信架构。


    ![../images/484167_1_En_1_Chapter/484167_1_En_1_Fig2_HTML.jpg](img/484167_1_En_1_Fig2_HTML.jpg)


    图 1-2


    Arduino Mega 2560 架构


    你可以在图 1-2 的单板计算机图中看到标记为 GPIO 引脚的区域。该型号同时支持数字引脚和模拟引脚。数字引脚用于控制和与数字传感器等设备通信，模拟引脚用于与模拟传感器等模拟设备通信。该型号有一个
    USB 接口，用于与另一个设备（如树莓派这样的 SBC）进行串行总线通信。你将在本书后面关于如何连接树莓派和 Arduino 并进行通信的部分中详细了解这一点。图
    1-3 展示了 Arduino Mega 2560 板上的 GPIO 引脚布局。


    ![../images/484167_1_En_1_Chapter/484167_1_En_1_Fig3_HTML.jpg](img/484167_1_En_1_Fig3_HTML.jpg)


    图 1-3


    Arduino Mega 2560 GPIO 引脚布局


    如图所示，以 D 开头的引脚编号表示数字引脚；这些是你连接数字传感器和设备的插槽。以 A 开头的引脚是模拟引脚，可用于与模拟设备通信。目前，你只需要理解这些。一旦你开始组装系统，你将详细研究所有这些内容。

