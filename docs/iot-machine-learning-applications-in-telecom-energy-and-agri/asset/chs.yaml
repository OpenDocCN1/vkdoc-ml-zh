  2019 年值得关注的趋势。物联网目前面临的一个问题是针对勒索软件的附加保护。文章提到了亚特兰大市的案例，当时该市的供水服务系统等城市系统遭到黑客攻击。黑客入侵了
  IT 系统，勒索技术人员交出所有智能设备，移动设备管理解决方案不得不放弃这些设备以保护它们免受搜索攻击。一个有趣的案例被重点提及：用于保障食品安全的物联网技术平板电脑调查数据。例如，一家冷食存储运营商利用混合云来保障食品安全，物联网正在帮助企业监控冷藏设施的温湿度。


