  \ `.databases`、`.tables` 和 `.schema` 来查看基本数据，这些命令会告诉你数据库的路径、数据库中存在的表以及表的模式或结构。在你的案例中，表名为\
  \ `machinedata`，包含以下列：`date`、`time`、`temperature`、`tempstatus`、`cpupercent`、`diskpercent`、`memorypercent`、`outage`\
  \ 和 `ldrvalue`。这些列的用途已在列表 3-9 和 3-10 的代码执行中展示。\n\n### 创建基于物联网图形用户界面的监控代理\n\n对于任何专业的物联网应用来说，要真正作为早期预警系统发挥作用，都需要有一个监控代理来监控状态并发送更多警报，例如在图形用户界面上、屏幕上显示，以及向管理员发送电子邮件。你将要做的正是如此：为你的\
  \ CPU 监控程序创建一个小的监控代理。创建完美监控代理的方法有很多；但为了简洁起见，我采用了一种简单的方法，即使用树莓派上的 crontab 调度器，它每分钟运行一次，检查\
  \ LED 的状态，然后根据当前点亮的 LED 决定要采取的行动。因此，如果红色 LED 亮起，代码将在图形用户界面屏幕上发送严重警报，并同时向管理员发送电子邮件。你可以在列表\
  \ 3-12 中看到代码。\n\n```\n∗∗此为 Python 3.6 兼容代码\nimport tkinter as tk\nimport tkinter.font\n\
  from gpiozero import LED\nimport smtplib\nwin= tk.Tk()\nwin.title(\"LED 监控代理应用程序\"\
  )\nmyfont= tkinter.font.Font(family= 'Helvetica', size=30, weight=\"bold\")\nredled=LED(18)\n\
  yellowled=LED(22)\ngreenled=LED(17)\ndef ledstatus():\nwhile(1):\nif(redled.value==1):\n\
  print(\"红色 LED 亮\")\nsender = 'newsletter@machinelearningcasestudies.com'\nreceivers\
  \ = ['newsletter@machinelearningcasestudies.com']\nmessage = \"\"\"发件人：某人\n\n收件人：某人\
  \ \n主题：SMTP 电子邮件严重警报\n消息：    这是一条严重消息警报，树莓派的 CPU 温度已超过阈值。\n\"\"\"\ntry:\nsmtpObj\
  \ = smtplib.SMTP('mail.machinelearningcasestudies.com')\nsmtpObj.sendmail(sender,\
  \ receivers, message)\nprint(\"成功发送电子邮件\")\nexcept smtplib.SMTPException:\nprint(\"\
  错误：无法发送电子邮件\")\nif(yellowled.value==1):\nprint(\"黄色 LED 亮\")\nif(greenled.value==1):\n\
  print(\"绿色 LED 亮\")\ndef exitprog():\nwin.quit()\n#command=ledstatus\nstatusButton=\
  \ tk.Button(win, text=“,command=ledstatus,font=myfont ,bg='green', height=1, width=24)\n\
  statusButton.grid(row=0,sticky=tk.NSEW)\nexitButton= tk.Button(win, text=\"退出\"\
  , font=myfont , command=exitprog,bg='green', height=1, width=24)\nexitButton.grid(row=30,sticky=tk.NSEW)\n\
  tk.mainloop()\n列表 3-12\nMachinemon 应用程序监控代理的代码\n```\n\n此代理运行在 Python 3.6 上，因为使用的库是\
  \ tkinter 图形用户界面库。要运行它，你只需在 Raspbian 命令行中输入 `python3 mmagent.py`。请注意使用的是 `python3`\
  \ 而不仅仅是 `python`。仅输入 `python` 将调用 Python 2.7 编译器，而输入 `python3` 将调用 Python 3.x 编译器。要使图\
  \ 3-38 中的代码与 Python 2.7 兼容，你可能需要先安装 Tkinter 图形用户界面 Python 库，然后将代码中的导入改为导入 Tkinter（大写\
  \ T）而不是小写的 tkinter。大小写的区别可能会让不了解其重要性的人感到困惑。StackOverflow 上关于此主题的讨论可能有助于你更好地理解；请访问\
  \ [`https://raspberrypi.stackexchange.com/questions/53899/tkinter-on-raspberry-pi-raspbian-jessie-python-3-4`](https://raspberrypi.stackexchange.com/questions/53899/tkinter-on-raspberry-pi-raspbian-jessie-python-3-4)。\n\
  \n列表 3-12 中的代码创建了一个 `tk.TK() win` 对象的实例窗口。它为其设置了标题“LED 监控代理应用程序”，然后在下一行将屏幕字体设置为\
  \ Helvetica，大小为 30，粗细参数为粗体。之后，你在树莓派板上的 GPIO 引脚（引脚编号 18-红色、22-黄色和 17-绿色）处初始化了三个 LED。接下来，你创建了一个函数来检查\
  \ LED 状态，因为每次代理调用它时都需要重复执行此操作。该函数通过其 `value` 属性检查 LED 状态值，并检查其是否等于 1。如果任何 LED 的值等于\
  \ 1，则表示该 LED 亮起。它会在屏幕上打印 LED 状态。在此函数之后，你有另一个函数用于优雅地退出程序。该函数只有一行，使用 `win.quit()`\
  \ 函数退出应用程序窗口，同时关闭应用程序监控图形用户界面。在 `exitprog()` 函数之后的通用部分，你使用 `tk.Button()` 方法实例化了一个\
  \ `ledstatus` 按钮，该方法接受 `command=ledstatus` 参数。`ledstatus` 是按钮函数的名称，当按下状态按钮时需要执行该函数。默认情况下，按钮颜色为绿色。然后使用\
  \ `grid()` 函数将其放置在网格中，指定其所在的行；这里你使用 0，因为你希望将其放置在屏幕顶部。`sticky` 参数接受 `tk.NSEW`，代表北、南、东、西。以类似的方式，你现在固定了退出按钮，它允许用户通过\
  \ `exitprog()` 函数中的 `win.quit()` 优雅地退出程序。该程序的最后一条语句是 `tk.mainloop()`，这是使窗口保持打开状态直到应用程序工作完成所必需的。在命令行运行命令\
  \ `$python mmagent.py` 后，树莓派上生成的屏幕窗口如图 3-25 所示。\n\n![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig25_HTML.jpg](img/484167_1_En_3_Fig25_HTML.jpg)\n\
