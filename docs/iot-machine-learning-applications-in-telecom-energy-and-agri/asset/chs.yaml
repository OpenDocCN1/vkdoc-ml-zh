  \ nltk 之外，我拥有所有必要的库，而 nltk 则被下载并安装。为了验证 nltk 库在设置过程中是否有任何错误，`nltk.log` 文件的输出如清单\
  \ 5-4 所示。\n\n```\nCollecting nltk\nDownloading https://files.pythonhosted.org/packages/87/16/4d247e27c55a7b6412e7c4c86f2500ae61afcbf5932b9e3491f8462f8d9e/nltk-3.4.4.zip\
  \ (1.5MB)\nCollecting singledispatch; python_version < \"3.4\" (from nltk)\nDownloading\
