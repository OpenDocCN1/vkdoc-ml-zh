  请记住，从 LightSensor 和其他物联网传感器获取数据的代码在第 [3](https://doi.org/10.1007/978-1-4842-5549-0_3Fig#25)
  章的图 [3-25](https://doi.org/10.1007/978-1-4842-5549-0_3Fig#25) 中给出。无论我们尝试实现何种解决方案，从传感器获取数据的过程都是相同的。唯一的区别在于，本案例中的
  Raspberry Pi 在收集数据时位于无人机内部。它类似于第 3 章中用于将 LDR 模块物联网传感器数据存储到 SQLite3 数据库的图 3-33 程序，以及用于模拟基于物联网的解决方案的图
  3-35 代码，这两者共同使我们能够从物联网传感器获取数据，然后存储并处理这些数据，以便在需要时发出高级预警信号。在本案例中，我们不需要任何高级预警信号。




  数据由搭载着树莓派（Raspberry Pi）作为有效载荷的无人机在飞往指定信号塔时收集，同时，代理程序既从用于监测温度和湿度的物联网传感器收集数据，也从附带的
  4G/LTE 模块收集数据。这些数据被收集并存储在树莓派的 SQLite 数据库中后，便可用于进一步分析。因此，该解决方案假设数据收集已通过上述设置完成。


  代码首先导入了常用的 `pandas` 和 `SQLite3` 库。它与 `machinemon` SQLite3 数据库建立连接，然后使用 `Select *
  from fielddata` SQL 查询从数据库中获取数据。`Fielddata` 是存储来自无人机物联网传感器和 4G/LTE 模块数据的表。接下来，在构建任何模块之前，我们检查是否存在缺失值，在本例中不存在缺失值，因此我们无需对其进行任何处理。之后，我们对数据集进行探索性数据分析。


