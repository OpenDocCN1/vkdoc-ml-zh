- "# 1. 入门指南：必要的软件和硬件\n\n本章将带你进入单板计算机（SBC）的世界。你们中的许多人可能是第一次听到这个术语，可能会好奇什么是 SBC 以及它的用途。本章将解释\
  \ SBC 及其历史发展。你还将了解市场上最流行的 SBC，例如 Banana Pi、Raspberry Pi 和 Arduino。通过深入比较，我将解释流行\
  \ SBC 在 USB、存储、网络和通信方面的特性。\n\n然后，你将学习 Raspberry Pi，更具体地说是 Raspberry Pi 3 Model B+，因为你将在本书的物联网和工业物联网项目中将其用作主节点。你还将深入了解\
  \ Raspberry Pi 上的 GPIO（通用输入/输出）引脚及其用途。接着，你将学习单板微控制器（SBM），它与单板计算机不同。在物联网和工业物联网应用中，单板微控制器通常用作\
  \ Raspberry Pi 等单板计算机的从设备。最流行的单板微控制器是 Arduino，你将通过详细的表格形式了解 SBM 的类型，涵盖其处理器、I/O 模块、频率、电压等。\n\
  \n然后，你将了解 Arduino Mega 2560 及其布局，并学习其 GPIO 引脚。接下来，你将学习本书最重要的主题：物联网传感器及其类型和应用。你将在案例研究解决方案中使用其中一些传感器。此外，还将涵盖无人机的主题，因为它们可用于为电信应用收集数据。请注意，在大多数国家/地区，飞行无人机需要许可证，在尝试将其用于任何项目之前，你应遵守相关规定。你还将了解\
  \ Modbus 设备以及如何使用它来构建商业应用。最后，你将学习运行所有这些设备的软件程序。\n\n注意\n\n本书通篇使用 Python 3.x 版本。如果你使用的是较旧版本的\
  \ Python，代码示例可能无法运行。你需要 Python 3.x 或更高版本才能成功运行它们。\n\n## 硬件要求\n\n要运行本书中的练习，你需要以下硬件：\n\
  \n*   **Raspberry Pi 3 Model B+**\n\n*   **Arduino Mega 2560**\n\n*   **用于输出 Raspberry\
  \ Pi 3 Model B+的 LCD/LED 屏幕**\n\n*   **单相电能表：Modbus 220/230V，双向，多功能，RS485，脉冲/Modbus\
  \ 输出**\n\n*   **无人机：工业级，重型负载，满足以下规格：**\n    *   **最大有效载荷：1.5 千克（3.5 磅）**\n\n   \
  \ *   **航程：5 公里**\n\n    *   **飞行时间：至少 30 分钟**\n\n\n### 单板计算机\n\n单板计算机是一台完全功能化的计算机，集成在一块印刷电路板上。这类计算机的独特之处在于，所有输入、输出以及图形和数值计算等处理过程都在同一块板上完成。虽然单板计算机可以构建为高性能计算服务器，但更常见的版本是小型紧凑的机器。\n\
  \n历史上，单板计算机的设计初衷是用于教育和追求紧凑性；如今，它们已被广泛应用于主流商业领域。\n\n单板计算机基于不同的微处理器构建，但设计都较为简洁。它们被设计得便于携带且紧凑。运行一台占用空间极小、稳定且便携的快速计算机，增添了拥有这些机器的魅力。\n\
  \n单板计算机的早期实现之一（1976 年 5 月）被称为 Diana micro；它基于 Intel C8080A 处理器，是 BigBook 系列计算机中非常流行的家用电脑。随着个人电脑市场的发展，单板计算机一度停滞不前，直到现在，当个人电脑几乎被平板电脑、笔记本电脑和手机取代时，它才重新兴起。你可以访问\
  \ [`https://en.wikipedia.org/wiki/Single-board_computer`](https://en.wikipedia.org/wiki/Single-board_computer)\
  \ 获取更多信息。\n\n使用单板计算机的一些优势如表 1-1 所示。\n\n表 1-1\n\n单板计算机特性与优势\n\n| 特性 | 优势 |\n| ---\
  \ | --- |\n| 价格 | 如今每块单板计算机售价低于 30 美元。 |\n| 外形尺寸 | 单板计算机非常小巧，几乎只有掌上电脑大小，便于携带和使用。\
  \ |\n| 操作系统 | Linux 变体最为流行。Windows IoT |\n| 架构 | 两种变体：支持插槽和不支持插槽。 |\n| 能效 | 高 |\n\
  \n单板计算机流行的主要原因是价格，因为每块售价低于 30 美元。另一个优点是它们紧凑便携的外形；可以握在手掌中。有运行 Linux 或 Windows IoT\
  \ 或其他操作系统的变体。大多数单板计算机不支持插槽；然而，有些型号支持插入工业级扩展卡。这些小型机器在功耗方面非常高效，可以有效地使用家用单相电源。除非你想将它们连接到大型\
  \ LED 或 LCD 屏幕，否则它们不需要为屏幕单独供电。它们有自己的 5 英寸或 7 英寸 LED/LCD 平板屏幕，可以由单板计算机本身供电。外壳选择也很灵活，可以将单板放入其中。从透明外壳到时尚机箱，再到容纳\
  \ 4 块或 7 块单板计算机的集群外壳，当今的单板计算机有广泛的选择。这种多样性通过给用户带来 DIY 的成就感，扩展了这些计算机的吸引力。从选择外壳到安装操作系统，再到使用其他类型的软件，一切都很灵活，并且有很多选择。现在，让我们看看市场上最流行的单板计算机及其发展。\n\
