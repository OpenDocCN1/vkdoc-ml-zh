  ## 总结


  在本章中，您研究了一个属于能源领域的非常技术性的案例研究：热电厂。这个案例研究将您带到了电厂公司在建立和成功运营电厂时所面临的一些挑战的前沿。该案例研究提出了一个非常年轻的电厂出现停机的问题，这很可能是由于温度引起的，就像炎热气候下的电厂情况一样。团队利用数据将问题定位到蒸汽轮机内部一个异常的入口操作单元，但需要数据和预测模型来为此类异常创建预警系统。这将触发预测性维护请求，只要通过定期数据监测看到此类异常的症状。我们创建了一个解决方案作为概念验证，以确定构建这样一个模型是否可行，以及是否能有切实的成果。通过使用分类算法，我们创建了一个能够
  100%预测或准确率分数为 1.0 的模型，这在现实世界中是罕见的。您看到了如何利用物联网传感器和树莓派 Model 3 B+ 的数据轻松创建整个解决方案。


  # 9. 农业行业案例研究：预测经济作物产量


  本章介绍一个基于农业行业的案例研究，用于预测经济作物产量。该案例研究让您了解一家中型农业综合企业所面临的挑战，该公司正试图达到新的水平，并实现其创始人的宏伟愿景。对于此类组织而言，作物产量问题非常重要，因为他们希望最大化土地资源以获得尽可能高的收入。您在本案例研究中将主要学到的是，公司的愿景应与其正在进行的机器学习操作相结合；否则，这将是一种浪费的开支。这也是我大多数客户在聘请我进行咨询，评估他们当前的机器学习应用如何帮助他们时，我常对他们说的话。它能降低成本吗？如果能，能增加多少收入？又能增加多少？项目的目标必须是可量化的，否则不仅不会成功，还会让企业主和利益相关者感到不满。那么，请继续阅读吧…




  ## 农业行业案例研究概述


  一家名为 Aystsaga Agro 的国际农业综合企业集团，其业务涵盖农业种植、化肥生产和拖拉机销售。公司总裁兼创始人塔米奥·波尔斯卡布，将这家企业从他父亲继承的一座北美农场，逐步发展壮大为横跨北美、非洲和亚洲三大洲的农业综合企业。农业经营并非易事，由于关税战和气候变化，正面临着诸多新出现的挑战。全球范围内，从南亚到非洲各国，一场农业危机正在上演，各国都在努力保护小农户免受这种急剧变化的冲击。与此同时，一场静默的重大变革正在发生：使用机器人等科技手段替代人类进行农业耕作。像
  Aystsaga Agro 这样运营高度商业化的农业综合企业，正在积极拥抱技术，探索如何应用并从中获益。由于农业与服务业等其他行业相比利润不高，这类运营因投资回报率低而难以获得资金。这也是此类商业公司专注于玉米、甘蔗、小麦和大豆等经济作物的原因。如表
