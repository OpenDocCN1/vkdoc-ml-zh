  火力发电厂的原动机介质是蒸汽。简单来说，水被加热后转化为蒸汽，在蒸汽轮机中旋转，进而驱动发电机。之后，蒸汽通过涡轮机并在冷凝器中冷凝；这被称为朗肯循环。


  蒸汽轮机始终在高蒸汽压力环境下运行，并拥有大量高速运动部件。喷嘴（进口和出口阀门）以及涡轮叶片均经过仔细分析设计，其部件制造精度极高。


  蒸汽轮机发电厂通常可实现高达 95% 的可用性，并且两次停机维护和检查之间的运行时间可超过一年。其非计划或强制停机率通常低于 2%，即每年少于一周。在我们的案例研究中，经过对整个电厂数据的仔细分析，包括机器学习工程师
  Carl 在内的团队中的电厂制造工程师将异常停机问题缩小到蒸汽轮机的故障。


