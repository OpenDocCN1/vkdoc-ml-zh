  尽管诺巴格拥有充足的土地来建设电厂项目，但甘塔拉市周边的大部分土地都被农民占用。他们对新成立的诺巴格政府为开发电厂而征用土地的努力进行了强烈抵制。这导致了暴力事件，政府宣布该公司寻求征地的区域进入紧急状态，因为该区域靠近一座水库。最终，在政府同意农民关于充分补偿的要求后，土地征用经过九个月的斗争才得以推进——考虑到政府为水坝和其他项目征地的类似案例往往陷入诉讼和暴力抗议，这算是一个创纪录的速度。尽管诺巴格人民明白电厂是为了他们的利益（正如政府和诺基·奥拉在与农民及甘塔拉市民的互动中所传达的那样），但问题在于他们是否信任政府能提供双赢的方案。在其欧洲财团施加的一点压力下，政府屈服于压力，通过提供基于市场价格的补偿来征用土地。


  54 岁的诺基·奥拉是一位出生于非洲的电气工程师，曾任职于通用电气等公司，在为欧洲财团合作伙伴建设电厂设施方面拥有丰富经验。他在成功实施中东某电厂项目后晋升为首席执行官。作为非洲本土人，他非常熟悉当地地理环境。他在政界人脉广泛，能够动用一些关系来确保项目成功。他被遴选委员会从三位潜在候选人中选中，这三人背景相似，但只有他具备种族优势，从而获得了这份工作。


  诺巴格拥有丰富的煤矿储量，足以再开采 100 年。因此，建设火力发电厂是最佳选择，因为其石油储量较少，无法满足电厂对天然气的需求。它需要从其他中东国家购买天然气，这将非常昂贵，并会耗尽本已微薄的外汇储备。此外，这将使其电力供应依赖天然气，因为邻国刚刚结束长期战争，如果该地区局势再次动荡，天然气管道可能成为武装袭击的目标。尽管诺巴格有自己的污染控制法律，但由于它正在接受欧洲财团等外部机构的帮助，因此必须遵守这些机构制定的清洁电力要求。这座燃煤火力发电厂必须实施碳捕集与封存（CCS）技术，即捕获碳并将其注入地下（[`https://en.wikipedia.org/wiki/Carbon_capture_and_storage`](https://en.wikipedia.org/wiki/Carbon_capture_and_storage)），从而减少碳向大气的释放。电厂的主要目的是将煤炭的化学能转化为电能。这通常通过锅炉产生蒸汽、蒸汽通过汽轮机膨胀做功，然后将汽轮机与发电机耦合来实现，发电机将机械能转化为电能。这座火力发电厂的输入和输出能力见表
  8-2。请注意，所有数据均基于 24 小时的日消耗周期。


  表 8-2


  甘塔拉发电厂的输入与输出


  | 描述 | 输入 | 处理 | 描述 | 输出 |

  | --- | --- | --- | --- | --- |

  | **煤炭** | 6000 |   | **二氧化碳** | 15000 |

  | **重油** | 50.5 | 500 兆瓦 | **二氧化硫 + 二氧化氮** | 340 |

  | **水** | 4900 |   | **发电量** | 460 |

  | **电力** | 40 |   | **灰渣** | 2100 |


  典型的燃煤火力发电厂的问题在于会产生二氧化碳、二氧化硫和二氧化氮等气体，这些气体会严重污染环境。因此，这些气体需要通过捕获并注入地下的方式进行处理，尤其是二氧化碳。这增加了项目成本和资金需求。电厂自身运行也需要消耗电力，因此其运行需要输入约
  40 兆瓦的电流，最终只有 460 兆瓦被释放用于进一步输送到甘塔拉市。每天 4900 立方米的水需求是为什么选址在靠近水库的特定土地的原因，也是农田对电厂建设构成问题的原因。每天产生
  2100 吨灰渣，政府邀请私营企业建造工厂，利用这些灰渣生产混凝土制品和墙板，以免污染水库周边的土地，因为农民也在使用这片土地。当甘塔拉附近的电厂开始运行时，几乎没有工厂生产能够回收灰渣的火山灰质硅酸盐水泥（PPC），因此灰渣被排放到电厂附近的干式填埋场。环保活动人士抗议此举对电厂周边农民造成环境危害；然而，政府向他们保证，完全利用电厂粉煤灰产出的设施将在几年内准备就绪，从而减少拟建电厂周边的环境危害。


  为了在甘塔拉附近建设这座火力发电厂，该公司从一个全球投资者财团获得了 6 亿美元的贷款，以满足附近地区日益增长的电力消费需求。




  在新建发电厂的调试过程中，该电厂峰值负荷装机容量为 500 兆瓦，而当前峰值负荷需求为 640 兆瓦。困扰其运行的问题包括：电力系统损耗高、电厂效率低、供电不稳定、窃电现象、停电事故以及电厂维护资金短缺。总体而言，过去十年该国发电机组无法满足系统需求。目前该国正从邻国购电，且需以美元支付，这正在消耗其宝贵的外汇储备。每当该电厂发生故障停电时，便从邻国获取备用电力以维持供电。该电厂在夏季和冬季用电高峰季节均存在发电问题。


  诺巴格总统阿格·齐西上月因夏季大量消费者投诉电厂停电事故，紧急召见了首席执行官诺基·奥拉。这些停电导致首都地区多次断电数小时。最近一次停电持续超过 48 小时，直至邻国提供替代电力后全城才恢复供电。总统质疑为何一座仅投产八个月的新电厂会问题频发。火电厂设计寿命通常超过
  30 年。由于媒体持续施压，指责政府无法为首都提供充足电力，总统召集欧洲企业集团官员成立调查委员会，要求就频繁停电的原因及解决方案提交报告。该委员会耗时 20
  余天研究电厂基础设施。团队中包括一位名为卡尔的机器学习工程师，他受命利用电厂现有数据协助团队确定停电的真正原因。卡尔通过 Modbus RS485 接口设备，在两周内从电厂关键设备中采集数据。其发现如下：


  *   蒸汽轮机是电厂最常见的停电故障源。

  *   必须设法缩短停电持续时间。

  *   需减少停电次数。

  *   需围绕电厂当前负荷及未来数小时的预测负荷建立预测模型。


  基于第一委员会的调查结果，诺巴格政府成立了第二个国家委员会，以查明并纠正停电的主要原因。报告发现，故障实际上源于燃气轮机运行协调不足。


  同样参与第二国家委员会的卡尔制定了以下参数，用于从燃气轮机/电网收集停电数据：


  *   总周期 T

  *   周期 T 内发生的故障次数

  *   维护间隔期间的故障次数

  *   维护间隔期间的总运行时间

  *   每年总停电小时数

  *   每年故障次数

  *   燃气轮机运行时间

  *   燃气轮机停机时间


  与任何传统燃煤电厂设施一样，各设备与机器独立运行，缺乏集中存储的互联数据源。从汽轮机到变压器再到锅炉，每个单元均独立监控。此外，电厂并未存储卡尔所需的数据，因此委员会成员无法确定燃气轮机故障的真正原因。国家委员会要求诺基·奥拉的公司利用物联网传感器从燃气轮机采集数据，并通过中继传输存储至新的私有云服务器。结果需在两周内全天候生成，以便清晰记录停电持续时间。此举旨在帮助卡尔创建停电预测模型。当然，描述和诊断停电也是流程的一部分。委员会的努力方向是让电厂公司从被动应对转向主动预防，对电厂内部发生的停电事件具备预测性和规范性。


  如同任何改变运营方式的尝试，委员会的工作遭遇了阻力。工会联合起来，迫切想知道此举的后果：是否会导致失业？是否会削减薪资？所有人都充满疑虑。在汽轮机周围安装新型物联网传感器以获取新数据集的做法也遭到抵制。尽管如此，卡尔及其团队仍决心推进计划实施。


  该计划部署了大量传感器，从测量汽轮机周围温度和光照的传感器，到测量附近超声波信号的传感器。卡尔希望确保在确定汽轮机故障的真正原因时不留任何死角。尽管身为机器学习工程师，卡尔仍需研究其工作领域——电厂，因此他必须学习电厂的完整运行原理。他绘制了电厂的简易示意图，其单元如图
  8-1 所示。


  ![../images/484167_1_En_8_Chapter/484167_1_En_8_Fig1_HTML.jpg](img/484167_1_En_8_Fig1_HTML.jpg)


  图 8-1


  火电厂原理示意图


  他向委员会官员及其他不了解火电厂工作原理的成员展示了这份报告。报告内容如下：


  “请记住，这并非技术图纸，而是一份帮助您理解火电厂关键组件的简图。实际电厂更为复杂，但核心组件相同。让我们逐一讨论各个组件。


  锅炉是一种容器，水作为输入进入其中，蒸汽以所需的压力、温度和流量输出。热量施加于容器上。为此，锅炉需具备燃烧燃料并释放热量的功能。锅炉的主要功能如下：


  *   将燃料（如空气）的化学能转化为热能。

  *   将这些热能传递给水使其蒸发，并传递给蒸汽使其过热。


  锅炉的基本组件包括：


  *   炉膛与燃烧器

  *   蒸汽与过热装置


  同样，另一组件——省煤器，旨在通过从烟气中回收热量来加热给水并将其送入锅炉汽包，从而提高锅炉效率。


  顾名思义，省煤器的优点包括：


  *   节省燃料：用于节约燃料，提高锅炉装置的整体效率。

  *   减小锅炉尺寸：由于给水在省煤器中预热后以更高温度进入锅炉管，所需的蒸发换热面积显著减少。




  在低压和高压加热器中，热量从流经省煤器的烟气中提取，并进一步用于预热即将送入燃烧室的空气。它是将热空气送入煤粉燃料系统以干燥煤炭、从而促进炉膛内燃料燃烧的关键设备。如果缺少这一功能，燃烧室可能会出现故障。发电厂锅炉还包含一个再热器组件，其管道由流经管道的热烟气加热。从高压汽轮机排出的蒸汽被送入再热器管道内部以获取能量，从而驱动后续的中低压汽轮机。


  汽轮机主要用作所有火力发电站的核心部件。汽轮机分为两种类型：


  *   冲动式汽轮机

  *   冲动-反动式汽轮机


  汽轮发电机组由一系列相互连接并共同安装在同一根轴（铁质杆状结构）上的汽轮机和一台发电机组成。一端是高压汽轮机（HPT），随后是中压汽轮机（IPT）、两台低压汽轮机（LPT）以及发电机。蒸汽在高温（约
  536°C 至 540°C）和高压（140 至 170 kg/cm²）下进入汽轮机膨胀做功。


  凝汽器将汽轮机排出的蒸汽冷凝成液态水，以便进一步泵送。凝汽器的功能包括：


  *   为蒸汽提供最低的排热温度。

  *   将汽轮机排出的蒸汽转化为水进行回收，从而节省发电厂的给水需求。


  冷却塔是一种半封闭式设备，通过空气接触对水进行蒸发冷却。从凝汽器流出的热水被送入冷却塔顶部，并以薄片或水滴的形式向下滴落。空气从冷却塔底部或垂直于水流方向流入，在有效冷却后排入大气。


  发电机是汽轮发电机组中的电气部分。它将燃气轮机的机械能转换为电能。发电基于电磁感应原理。没有发电机，燃气轮机的输出就无法产生电力。因此，它是发电厂中最重要的设备。”


  卡尔在报告中解释完这些之后，接着说明了获取燃气轮机周围物联网传感器数据所需的设置。正如第一份委员会报告所指出的，故障发生在燃气轮机上。然而，该报告未能得出根本原因，也未指出任何可能导致燃气轮机反复故障的潜在问题。这使得情况更加复杂，因此需要结合燃气轮机附带电子单元生成的数据进行监控，这些数据通过
  Modbus 协议发送到树莓派工作站进行收集。为了确定根本原因并观察外部环境温度是否产生影响，在燃气轮机上安装了一些物联网传感器。监测了三个参数：环境光照、环境温度，以及一个用于测量机器设备周围超声波声音的物联网传感器。当然，在现阶段，这仅仅是一个假设，即外部环境中的任何这些因素都可能导致让电厂工程师和设备制造商困惑的故障。只有精心收集的数据才能证明或反驳这一假设。该设置如图
