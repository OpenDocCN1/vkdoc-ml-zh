  \ - | 802.11n | 4.1 | Mini-HDMI | - | 支持 |\n\n在进入下一节关于微控制器的主题之前，我们先来看一下树莓派架构中一个非常重要的方面，即\
  \ SBC 板上的 GPIO 引脚布局。这些引脚用于与辅助硬件通信，例如传感器或其他能够进行串行通信的微控制器（如 Arduino）。图 1-1 展示了 Raspberry\
  \ Pi 3 Model B+ 的 GPIO 引脚布局。\n\n![../images/484167_1_En_1_Chapter/484167_1_En_1_Fig1_HTML.jpg](img/484167_1_En_1_Fig1_HTML.jpg)\n\
  \n图 1-1\n\nRaspberry Pi 3 Model B+ 的 GPIO 引脚布局\n\n在图 1-1 中，你可以看到总共有 40 个 GPIO 引脚。它们具有特定的结构，理解这一结构对于使用它们至关重要。图中引脚编号从\
  \ 1 到 40。引脚 1 和 17 用于为你的设备提供电源输出（3.5 伏）。引脚 2 和 4 用于分别提供 5 伏的电源输出。编号为 6、9、14、20、25、30、34\
  \ 和 39 的引脚用于电路接地。其余引脚用于 GPIO。稍后当你为某些基于物联网的解决方案创建完整电路时，将会用到这些信息。\n\n现在我们来讨论微控制器及其使用方法。\n\
  \n## 单板微控制器\n\nSBM 是集成在单块电路板上的微控制器；它们用于工业和商业应用，作为工业与商业设备（例如使用串行总线通信的设备）之间的接口。它们被用于开发需要与工业机器或网络接口（例如需要\
  \ Modbus 通信协议的接口）进行交互的解决方案。\n\nArduino 是一种非常流行的单板微控制器，被爱好者和学生用来学习硬件实现，以及如何控制和构建与常见\
  \ C 和 C++ 程序交互的爱好机器。然而，我们将把 Arduino 用于工业级目的。让我们比较 Arduino 系列中的三个型号，以便为我们的目的选择最佳的微控制器。\n\
  \n我们将比较 Arduino Uno、Arduino Mega 和 Arduino Mega 2560 这三个型号。这三款单板微控制器均使用 16MHz 频率的处理器。Mega\
  \ 和 Mega 2560 的印刷电路板尺寸大于 Arduino Uno，后者在长度上比两者都短一半，尺寸为 2.7 英寸 x 2.1 英寸，而前两者为 4 英寸\
  \ x 2.1 英寸。Arduino Mega 2560 拥有最高的闪存，为 256kb，而 Arduino Uno 的闪存最低，为 32kb。Arduino\
  \ Mega 拥有 128kb。就 SBM 而言，闪存非常重要，因为无论你编写什么程序来通过应用程序控制硬件，都必须首先写入闪存。如果闪存容量低，你就无法在其上编写工业级应用程序。两款\
  \ Mega 型号的 EEPROM 和 SRAM 都高于 Arduino Uno；此外，Mega 型号有 54 个 GPIO 引脚，而 Uno 只有 14 个引脚。为什么我们的应用程序需要更多引脚？我们将使用应用程序与串行\
  \ Modbus 通信接口进行通信，这可能需要同时连接两个或三个设备。如果引脚数量较少，我们在并行连接设备方面就会受到限制。因此，为此目的我们需要更多的引脚。\n\
  \n因此，对我们来说最好的型号是 Arduino Mega 2560，它拥有最高的闪存。\n\n### Arduino Mega 2560\n\n图 1-2 展示了\
  \ Arduino Mega 2560 的 GPIO 引脚布局及其通信架构。\n\n![../images/484167_1_En_1_Chapter/484167_1_En_1_Fig2_HTML.jpg](img/484167_1_En_1_Fig2_HTML.jpg)\n\
  \n图 1-2\n\nArduino Mega 2560 架构\n\n你可以在图 1-2 的单板计算机图中看到标记为 GPIO 引脚的区域。该型号同时支持数字引脚和模拟引脚。数字引脚用于控制和与数字传感器等设备通信，模拟引脚用于与模拟传感器等模拟设备通信。该型号有一个\
  \ USB 接口，用于与另一个设备（如树莓派这样的 SBC）进行串行总线通信。你将在本书后面关于如何连接树莓派和 Arduino 并进行通信的部分中详细了解这一点。图\
  \ 1-3 展示了 Arduino Mega 2560 板上的 GPIO 引脚布局。\n\n![../images/484167_1_En_1_Chapter/484167_1_En_1_Fig3_HTML.jpg](img/484167_1_En_1_Fig3_HTML.jpg)\n\
  \n图 1-3\n\nArduino Mega 2560 GPIO 引脚布局\n\n如图所示，以 D 开头的引脚编号表示数字引脚；这些是你连接数字传感器和设备的插槽。以\
  \ A 开头的引脚是模拟引脚，可用于与模拟设备通信。目前，你只需要理解这些。一旦你开始组装系统，你将详细研究所有这些内容。\n\n\n\n## 物联网传感器\n\
  \n物联网是将互联网连接扩展到日常物理设备和物品的延伸。当传感器和互联网连接等设备被添加到艺术品或任何其他显示创建日期、艺术家描述、最近修改日期等信息的物理物品中时，物联网便形成了。我们现在有了自动补货柜的概念，这些柜子可以在食物被消耗后自动在线订购。通过将物联网传感器嵌入日常物品，我们正在使它们变得智能且易于使用，以造福人类。\n\
  \n市面上常见的物联网传感器均可与树莓派和 Arduino 配合使用，因为它们都使用 GPIO 引脚进行通信。表 1-4 列出了可在树莓派和 Arduino 上使用的常见传感器类型。\n\
  \n**表 1-4**\n\n**常见物联网传感器类型及其用途**\n\n| 传感器类型 | 用途 |\n| --- | --- |\n| 机器视觉 | 光学和环境光检测\
  \ |\n| 接近与位置 | GPS 定位及物体存在检测 |\n| 温度 | 检测空气、土壤和水中的大气温度 |\n| 湿度/水分 | 检测空气和土壤中的大气湿度\
  \ |\n| 声学 | 检测大气中的次声波和超声波振动 |\n| 化学 | 检测空气、土壤和水中的气体含量 |\n| 流量 | 检测管道等封闭区域内的空气和水流\
  \ |\n| 电磁 | 检测环境中的电磁水平 |\n| 加速度 | 检测所连接电子设备的倾斜角度 |\n| 负载/重量 | 检测被监测环境中负载或重量的变化 |\n\
  \n从表 1-4 中可以看出，有各种各样的传感器可用，它们从数字到模拟，从使用 Wi-Fi 摄像头测量和检测物体，到检测电子设备上重量或负载的变化。这些传感器的用途和应用是无限的，可以为物联网应用注入新的活力。在本书中，您将使用这些常见类型的传感器，并且在您构建解决方案时，我将更详细地介绍它们。\n\
  \n## 无人机\n\n根据维基百科（[`https://simple.wikipedia.org/wiki/Unmanned_aerial_vehicle`](https://simple.wikipedia.org/wiki/Unmanned_aerial_vehicle)）的定义，无人机是一种通过遥控设备操作的无人驾驶飞行器。无人机内部通常嵌入了一个小型微控制器，能够检测气压变化、物体接近度、加速度等。它内部嵌入了许多物联网传感器，使其比有人驾驶飞机更智能。然而，很少有自动无人机可以在无需人工监督的情况下飞行和工作。大多数无人机都有操作员通过遥控机制控制其活动。\n\
  \n您将在电信领域案例研究的解决方案中使用工业级无人机。您需要一架能够承载高达 3.5 磅（约 1.5 公斤）有效载荷、航程为 5 公里的工业级无人机，因为您将用它在一个特定区域的周边进行探测。您需要的最短飞行时间是\
  \ 30 分钟，因为这是收集一些像样数据以应用机器学习所需的最短时间。这类无人机绝对不便宜；起售价为 2500 美元。\n\n## Modbus 设备\n\n\
  您将在案例研究的能源部分使用另一种设备。Modbus 设备是一种用于连接工业设备（例如将机器连接到计算机）的标准通信协议。它们也用于收集和发送数据。有一个主设备或微控制器使用\
  \ Modbus 协议与其从设备通信，从设备数量最多可达 247 个。这使得该协议非常强大，这也是我选择 Arduino Mega 2560 单板微控制器的原因（因为它的板上有大量用于通信的模拟和数字引脚）。\n\
  \n**免责声明**\n\n在进一步操作之前，我想提醒您使用此 Modbus 设备作为电能表所涉及的风险。它是一种电器，如果连接不当，存在短路风险。如果不按照其使用说明书操作，也可能危及人身安全。如果连接错误，它还可能烧毁并损坏您的树莓派和\
  \ Arduino 板。因此，如果您对电气连接不熟悉，我强烈建议您不要使用此设备，或者请当地电气技术人员提供专业帮助进行正确连接。无论是作者还是出版商，对任何形式的物质或人身损害均不承担任何责任。请用户自行斟酌。\n\
  \n在工业领域，三相 Modbus 电能表被广泛使用，但这在普通环境中难以复制，因此我建议改用单相电能表，它使用 Modbus RTU 通信协议。施耐德电气等公司提供了多种选择。\n\
  \n## 所需软件\n\n为了运行本书中的练习，您需要安装 Python 3.x。我建议您为此使用 Raspbian 操作系统自带的默认 Python 安装。Python\
  \ 是一个简单的发行版，与 Anaconda 不同，它不需要任何安装。本书中的所有编码练习都适用于此版本的 Python。本书中的练习和解决方案不支持 Windows，也未在任何\
  \ Windows 版本上进行过测试。必须使用 Raspbian 操作系统才能使其正常工作。请按照本书安装部分给出的步骤进行安装。\n\n您还将使用 Arduino\
  \ IDE 在 Arduino 和树莓派之间进行通信，因此在您的解决方案中，Arduino 将作为树莓派的从设备工作。这可以通过`apt-get`命令安装，您将在本书后面的安装部分看到该命令。\n\
  \n## 总结\n\n本章介绍了单板计算机及其历史发展。您了解了市场上最流行的单板计算机，例如香蕉派、树莓派和 Arduino。通过深入比较，您从 USB、存储、网络和通信功能方面探索了流行单板计算机的特性。您还了解了树莓派，特别是树莓派\
  \ 3 Model B+，您将在本书后面的物联网和工业物联网项目中将其用作主节点。您了解了树莓派上的 GPIO 引脚及其用途。您还了解了单板微控制器及其与单板计算机的区别。您还了解到，在物联网和工业物联网应用中，单板微控制器通常用作树莓派等单板计算机的从设备。您还了解到最流行的单板微控制器是\
  \ Arduino，并查看了一个关于 SBM 类型和功能信息（如处理器、I/O 模块、频率、电压等）的表格。\n\n接着，您了解了 Arduino Mega 2560\
  \ 及其布局，并学习了其 GPIO 引脚。然后，您学习了本书最重要的主题：物联网传感器及其类型和应用。您还了解了无人机，因为它们将用于为本书中的电信应用收集数据。您了解了\
  \ Modbus 设备以及如何使用它来构建商业应用。最后，您获得了将在本书中使用的软件列表。\n\n\n"
- '# 2. 物联网与工业物联网概述


  你在第 1 章中了解了物联网的定义。在本章中，我想对此进行扩展。物联网概念得以实现的关键在于两大能力：使用小型传感器和电机，以及通过编程接口控制它们的输入和输出。物联网的核心是能够远程监控和控制设备。这可以通过与这些设备交互的小型可编程微控制器或微型计算机来实现。在应用物联网的过程中，嵌入式系统、控制系统、数字和模拟传感器等多种技术融合在了一起。其理念是将传感器嵌入日常物品中，并通过监控和控制使它们变得更加智能。然而，并非每个支持物联网的设备都能赢得消费者的青睐或满足业务需求。


  ## 深入探究物联网


  人们已经对日常物品进行过实验，例如智能椅子，它可以监控你坐在上面的时间，并监测你的血压等生命体征。在某些情况下，消费者认为购买这些产品并无益处。


  并非所有智能物品都能为消费者带来实质性好处，或者消费者可能认为其额外价格并不值得。在这种情况下，智能产品在推出时就会失败。尽管技术上确实有能力让物品变得更智能，但消费者的认知并未达到其预期。


  此外，还有智能家居的概念，洗碗机等物品通过中央监控系统进行控制。然而，由于其高昂的成本，这一概念并未普及。


  图 2-1 展示了物联网领域的技术进步。此图引自我的著作 *《使用 Python 的机器学习应用》*。


  ![../images/484167_1_En_2_Chapter/484167_1_En_2_Fig1_HTML.jpg](img/484167_1_En_2_Fig1_HTML.jpg)


  **图 2-1**


  机器学习技术采用过程


  物联网目前正处于快速应用和早期应用阶段。你知道，在追踪应用阶段，它正试图摆脱过去，例如切换所有家用电器的电源。在应用阶段，今天的益处是通过降低监控成本来实现的，例如安装物联网传感器和摄像头用于安防等。下一阶段的应用将进入辅助应用阶段。通过使用物联网，将致力于增强预测人类需求的能力，例如，利用计算机视觉摄像头监控智能橱柜内常见家居用品的数量，并预测何时需要补充，从而自动订购杂货。这类应用会进入第三阶段，即辅助应用阶段，或者第四阶段，即机器人操作增强人类能力的阶段。如今由人类仆人在家中执行的操作，例如清洗餐具和衣物，未来将由机器人完成。这类机器人将能够预测家庭中可能发生的任何未来问题，并为其提供解决方案。例如，一个自动补货机器人会检查任何物品是否即将用完，然后在线向附近提供折扣和送货上门服务的商店发送补货订单。它还可以等待订单确认。如果在指定时间内未收到确认，它会通过短信向其人类主人发送警报，甚至直接走到主人面前展示问题。它还可以建议替代方案，例如从一家不提供送货上门服务的远方商店订购产品。这样的机器人无疑会成为任何家庭的宝贵资产。这只是一个例子，说明机器人操作如何能够变得具有预测性，同时也能在潜在问题出现之前提出替代解决方案。表
  2-1 展示了当前场景下物联网的一些应用示例。


  **表 2-1**


  物联网的应用


  | 技术阶段 | 物联网应用 |

  | --- | --- |

  | 快速应用 | 家庭自动化 |

  | 早期应用 | 个人可穿戴设备 |

  | 智能城市 |

  | 辅助应用 | 农业自动化 |

  | 零售自动化 |

  | 智能汽车 |

  | 独立操作 | 医疗手术 |


  在上表中，你可以看到家庭自动化已进入应用阶段，因为人们目前正在自动化他们日复一日重复执行的平凡家务，例如通过 Android 和 iPhone 等个人手机来关闭电器、监控和控制它们。这些应用允许你控制智能手表等设备，这些设备可以精确收集个人生物信息，如步数、每分钟心跳数、血压率和携氧能力。这些应用可以生成每周、每月或每年的报告，并利用这些数据展示你的健康习惯。


  物联网领域的另一个发展是智能城市，它正处于早期应用阶段。其中最著名的是新加坡，它正试图在各个方面真正成为一个智能城市。智能建筑正在建设中，以便最大限度地利用阳光，并通过使用雨水收集、太阳能电池板等能源回收方法实现自给自足，为居民提供离网能源。一个智能城市会回收所有废物，并消耗和回收其所有资源，如水、石油、垃圾和天然气。


  农业自动化是物联网使得自动化操作成为可能的早期应用示例之一；然而，它必须发展到预测阶段，能够预测作物周期，例如作物歉收或丰收。IBM 旗下的天气公司（[`www.ibm.com/weather`](http://www.ibm.com/weather)）正试图通过预测作物天气来改变农业自动化的方式。当今的农业完全依赖于天气周期和季节。尽管从播种到收割的与农业相关的一切都已实现自动化，但预测农业天气的能力才能真正将其推向独立操作阶段。


  智能汽车是另一个此类应用。当你能够使用计算机视觉传感器和 GPS 定位器等物联网传感器在拥挤区域驾驶智能汽车时，该应用将处于独立操作阶段；同时，它还能预测和预防事故。


  医疗手术在一定程度上已经达到了独立操作水平，例如用于癌症的医疗手术，机器人可以通过增强外科医生的任务来独立进行手术。其他手术将随着时间的推移而成熟，因为世界正在对如何为机器人增加手术技能进行更多研究，使其变得更加高效。


  以上是物联网应用的一些示例，旨在为你提供背景，了解它们如何融入技术采用过程。




  ## 物联网的商业用途


  现在，让我们来看看市场上一些运行良好的成功物联网应用。


  teknowlogy 在 2019 年进行了一项调查（[`www.device-insight.com/wp-content/uploads/2019/03/the_iot_survey_2019_highlights_device_insight.pdf`](http://www.device-insight.com/wp-content/uploads/2019/03/the_iot_survey_2019_highlights_device_insight.pdf)），该调查基于用户评价矩阵、有效性、效率、商业价值、解决方案时间线、可视化、对新概念的支持、创新性、定价模式、产品满意度、合作伙伴生态系统、性能满意度、灵活性、易用性和客户体验等参数，对物联网供应商进行了评估。所涵盖的公司均为中型企业，这也是物联网主要实施发生的地方。我挑选了最佳参数——客户体验，并将讨论这些高分公司提供的解决方案。选择这个参数的原因是，即使你拥有根据其他参数（如创新性和可视化）来看最好的产品，但如果客户不满意，你无法长期维持该产品。表
  2-2 展示了目前已在商业上使用的、拥有出色物联网解决方案的三家公司。


