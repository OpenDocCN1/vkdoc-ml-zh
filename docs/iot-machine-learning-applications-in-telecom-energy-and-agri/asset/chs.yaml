  \ reactive energy: {0:.3f} kvarh'.format(Export_Reactive_Energy))\nprint('Total\
  \ active energy: {0:.3f} kwh'.format(Total_Active_Energy))\nprint('Total reactive\
  \ energy: {0:.3f} kvarh'.format(Total_Reactive_Energy))\nprint('Current Yield (V*A):\
  \ {0:.1f} Watt'.format(Volts * Current))\nimport sqlite3\nconn = sqlite3.connect('/home/pi/IoTBook/Chapter6/energymeter.db')\n\
  #df.to_sql(name='tempdata', con=conn)\ncurr=conn.cursor()\nquery=\"INSERT INTO sdm630data(timestamp,\
