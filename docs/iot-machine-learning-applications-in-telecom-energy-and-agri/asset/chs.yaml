  \ IDE，如图 5-11 所示。\n\n![../images/484167_1_En_5_Chapter/484167_1_En_5_Fig11_HTML.jpg](img/484167_1_En_5_Fig11_HTML.jpg)\n\
  \n图 5-11\n\n验证 Thonny Python IDE 安装\n\n我在第 3 章中讨论过 Thonny IDE 的验证部分，因此我们进入下一步，安装案例研究中所需的\
  \ Python 库。以下是您需要的 Python 库列表。请记住将 `tkinter` 改为 `Tkinter`（是的，大写 T），如第 3 章所述。\n\n\
  *   **numpy** 用于在 Python 中对 n 维数组和矩阵进行操作。\n*   **pandas** 用于数据整理。它专为快速简便的数据操作、聚合和可视化而设计。\n\
  *   **Seaborn** 用于通过热图和聚合图对统计模型进行数据可视化。\n*   **scikit-learn** 为程序中使用的机器学习算法提供一致的接口。\n\
  *   **Tkinter** 用于为 Python 程序创建图形用户界面。\n*   **scipy** 包含用于线性代数、优化、积分和统计的模块。\n* \
  \  **matplotlib** 用于通过各种图表和图形进行数据可视化。\n*   **NLTK** 是一个自然语言工具包，用于符号和统计自然语言处理的常见任务。\n\
  *   **statsmodels** 用于通过使用各种统计模型估计方法以及执行统计断言和分析来进行数据探索。\n\n现在你已经看到了案例研究所需的 Python\
  \ 库，请继续安装它们。我创建了一个脚本，可以在 Raspbian 命令行上执行此操作；见图 5-10。请记住，该代码是为 Python 2.7 安装的；如果你想在\
  \ Python 3 上安装所有库，则需要修改脚本，在 `pip` 后面加上 `3`，使其变为 `pip3`。\n\n警告\n\n如果你使用自己的脚本来安装 Python\
  \ 库，请确保在 `pip install` 命令前加上 `sudo`，如清单 5-2 中的脚本 `pipinstaller.run` 所示。\n\n```\n\
  pi@raspberrypi:~/$ cat pipinstaller.run\nsudo pip install numpy | tee /home/pi/numpy.log\n\
  sudo pip install pandas | tee /home/pi/pandas.log\nsudo pip install seaborn | tee\
  \ /home/pi/seaborn.log\nsudo pip install sklearn | tee /home/pi/sklearn.log\nsudo\
  \ pip install tkinter | tee /home/pi/tkinter.log\nsudo pip install scipy | tee /home/pi/scipy.log\n\
  sudo pip install nltk | tee /home/pi/nltk.log\nsudo pip install statsmodels | tee\
  \ /home/pi/statsmodels.log\npi@raspberrypi:~/\n清单 5-2\n用于安装所需 Python 包的 Raspbian\
  \ 命令行脚本\n```\n\n你会注意到，我在每个命令前都添加了 `sudo`，然后将输出通过管道传递给 `tee` 命令，以便将每个 Python 库的输出记录到文件中。因此，对于\
  \ `sudo pip install scipy | tee /home/pi/scipy.log`，输出会存储在一个名为 `scipy.log` 的单独日志文件中。这样更容易单独查看每个日志文件，并进行调试，查看安装过程中是否有任何错误。你可能会问，为什么我要将所有输出存储在日志文件中？简单的答案是，在\
  \ Raspbian 3 Model b+ 上，根据软件包的大小和你所在地区的互联网下载速度，安装一个软件包可能需要几个小时。因此，在运行脚本之前请牢记这一点，并确保你的\
  \ Raspberry Pi 系统和显示器有备用电源。在尝试运行此脚本之前，所有设备都应具备备用电源。显示器的备用电源同样重要，因为如果你的显示器因断电等原因关闭，Raspberry\
  \ Pi Model 3 B+ 有时会无法显示屏幕。脚本的输出可能如清单 5-3 所示。\n\n\n\n```\nRequirement already satisfied:\
  \ numpy in /usr/lib/python2.7/dist-packages\nRequirement already satisfied: pandas\
  \ in /usr/lib/python2.7/dist-packages\nRequirement already satisfied: numpy>=1.7.0\
