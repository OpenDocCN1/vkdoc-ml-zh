  在这个相关性中有几点值得注意。室外温度与湿度之间存在显著的正相关（0.77），而室外温度与信号强度之间存在负相关。这意味着当温度下降时，信号强度也会下降（信号强度具有反向效应，因此越低越好）。通话掉线与室外温度的相关性为
  0.49，这并不十分显著。最值得注意的是，湿度与信号强度之间存在完美的负相关。如果湿度上升，信号强度肯定会下降。实际上，这意味着在雨天，当室外湿度非常高时，信号强度会很低。我们难道没有在雨天经历过通话语音质量下降吗？这个数据集恰恰证明了这一点。


  室外湿度与通话掉线之间的相关性也呈正相关，高达 0.68，因此在构建模型时也应考虑这一点。对于模型而言，需要注意的相关结果是信号强度与通话掉线之间的相关性，为高度负相关（-0.68）。这意味着信号强度越好，通话掉线的频率就越低。既然我们知道数据集具有潜力，就可以使用这些选定的变量来构建我们的机器学习模型。


  在下一步中，我们将数据集拆分为目标变量（即预测对象）和特征（即与目标或预测对象高度相关的列）。为此，我们从特征中省略了以下列：`CID1`、`CID2`、`Speed`
  和 `BatteryLevel`，因为它们在结果中没有显著的相关性。我们在代码中仅为模型选择了三个变量：`nm=[''OutsideTemperature'',
  ''OutsideHumidity'', ''SignalStrength'']`, `features=df[nm]`。




  此外，我们可以通过 `x_train, x_test, y_train, y_test = train_test_split(features, target,
  test_size=0.25, random_state=0)` 将数据集拆分为训练集和测试集，从而开始构建模型。我选择 25% 作为测试数据集，75% 作为训练数据集。你可以进一步试验，看看预测模型是否会得到不同的结果。接下来，我们仅使用逻辑回归分类器算法来构建预测模型；但我强烈建议你采用类似的方法来选择合适的分类器算法，就像我在我的书《*使用
  Python 的机器学习应用*》第 3 章图 3-32 中所做的那样。这里，我们通过代码 `lr.fit(x_train, y_train)` 将数据集拟合到我们的逻辑回归对象，然后对
  x_test（即我们的特征训练数据集）进行预测。接着，我们对预测结果进行评分，以查看模型的执行准确度，逻辑回归模型的准确度得分为 1.0。这表明我们的模型存在过拟合问题。因此，正如我所提到的，我们需要评估其他分类器算法，以找到不会过拟合的最佳算法。


  混淆矩阵和准确度得分可以通过使用热图和颜色条以图形方式可视化。这就是我们接下来在代码中使用 matplotlib 和 Seaborn 库所做的事情。该代码通过语句
  `cm = metrics.confusion_matrix(y_test, predictions)` 使用 sklearn 库的 metrics 包构建了一个混淆矩阵。有时，就混淆矩阵而言，这种简单的输出不如视觉上吸引人的颜色条或热图那样有影响力，而这正是代码下一部分使用
  Seaborn 热图库包通过代码语句 `sns.heatmap(cm, annot=True, fmt=".3f", linewidths=.5, square
  = True, cmap = ''Blues_r'')` 所实现的效果。这里，注释设置为 true，以便输出可以在热图上显示；此外，我们使用了 `cmap` 或一个具有蓝色色调比例的颜色映射。要了解更多关于带注释的颜色映射的信息，请参考这个
  matplotlib URL：[`https://matplotlib.org/gallery/images_contours_and_fields/image_annotated_heatmap.html`](https://matplotlib.org/gallery/images_contours_and_fields/image_annotated_heatmap.html)。


  ## 总结


  在本章中，你看到了一个近乎实际现实世界的场景：一家虚构的电信公司经历了一场社会政治危机，其老板被要求调查并解决其通话掉线问题。世界各地的电信公司都面临着类似的技术挑战和问题，并且正在使用人工智能来解决它们。我在这个案例研究解决方案中展示了如何预测通话掉线问题。预测问题是企业在找到问题解决方案之前必须跨越的第一个障碍。这在本次案例研究中已经完成。我们使用逻辑回归分类器算法构建了一个模型来预测通话掉线何时发生。有了这些数据，企业就可以看到需要什么样的技术升级来解决预测模型给出的湿度问题。是否有更好的发射和接收塔可以在这种潮湿条件下良好工作？他们是否需要将一些塔架远离水体？一旦预测模型提供结果，这些都是企业必须解决的一些问题。


  # 8. Gantara 发电厂：工业机器的预测性维护


  本章是关于一个能源行业的案例研究，我们尝试模拟工业机器预测性维护的数据。该案例研究的背景是未来非洲地区的一个虚构国家。它阐述了在第三世界国家建立发电厂所面临的挑战，从承担土地征用任务，到构思其设计，再到实际建设。还涵盖了建立发电厂的技术要求和技术规格，其中包括与行业相关的发电厂用地，以便你了解发电厂真正需要什么才能建立起来。如果你对能源行业不熟悉或有一些了解，你会发现关于发电厂需求的输入、处理和输出格式的表格很有帮助，它列出了企业的完整结构和基础。尽管人物、情境和国家都是虚构的，但它们会让你了解社会政治环境压力是如何作用于像发电这样基本的事情的。作为案例研究的一部分，还包括一位机器学习工程师，其角色在案例研究中被精心塑造，以让你了解典型的机器学习工程师在处理这类问题时可能会承受的压力。那么，让我们深入我们的案例研究吧。


  ## 案例研究


  Noki Ora，一家私营发电厂的首席执行官，刚刚降落在非洲 Nobag 的 Gantara 首都，由于最近当选政府的进步政策，该地区正在快速发展。然而，发展也带来了为工业和住宅需求生产足够电力的挑战。Noki
  从电厂概念化到目前状态（即现在能在 500 MW 峰值负荷下发电）就一直在这家公司。这个过程并非一帆风顺；一路上充满了问题。事实是，在第三世界国家建立发电厂面临着巨大的挑战，从寻找融资伙伴到寻找愿意进行安装的工厂设备供应商。


  Nobag 在 2024 年叙利亚战争结束后，在主要国家联合起来划出这个国家后，成为了非洲大陆的一个独立国家。自独立以来，该国对其采矿和农业产业（这里是人们的主要职业）的发展兴趣日益浓厚。其政府设立了各种经济特区，为来此设立业务的公司提供各种税收减免。Noki
  的公司，Nobag Power Enterprise Ltd.，就是这样一个由一群欧洲企业集团设立的公司，旨在利用该国的发展潜力并促进其基础设施建设。Nobag
  总统 Ag Zisi 发布了以下章程，作为总统令的一部分，授予 Nobag Power Enterprises 以使其成功完成使命：


  *授予 Nobag Power Enterprises 在两年时间内发电和输送高达 500 MW 容量的热能电力，以支持 Gantara 首都地区的电力需求。*


  公司的愿景声明反映了总统的章程，内容如下：


  *Nobag Power Enterprises 的愿景是发电和输送电力，以满足 Nobag 人民的电能需求，以帮助其住宅和工业发展。*




  ## 项目背景


  当诺巴格电力企业构思甘塔拉发电厂项目时，它制定了电厂建设和安装所需的土地需求计划，因为这是诺巴格政府设立该项目的关键因素。土地需求已传达给政府官员，由于这是一座火力发电厂，需要尽快完成土地征用，以便启动电厂建设进程。这座
  500 兆瓦电厂的土地规划时间表见表 8-1。


