  \ nltk 库已成功安装。你可能想逐一检查为你安装的所有其他日志文件，例如 `scipy.log`、`statsmodels.log` 等。现在，你已经成功安装了所有必需的\
  \ Python 库。\n\n### 测试时间\n\n我在第 3 章开头要求你不要执行任何代码，而是享受结合 Arduino 的物联网与机器学习的执行过程。但在这里，你正在设置所有必要的基础设施软件和硬件，以便为后续的案例研究做好准备。\n\
  \n然而，在进入下一章的执行之前，我强烈建议你回到第 3 章，执行图 3-3 中给出的所有用于测试 Python 库的代码，即用于测试 Raspbian 上已安装库的\
  \ Hello world Python 代码。图 3-4 显示了该代码在 Thonny IDE 上的输出，你也应该得到类似的输出。如果没有，你可能没有正确安装\
  \ Python 库；你可能需要返回并检查图 5-11 中的安装日志，以查看错误发生的位置。然后，你应该继续执行图 3-5 中用于测试 Pandas 数据框的代码，其输出应与\
  \ Thonny IDE 上图 3-6 所示的输出类似。此外，你应该测试图 3-7 中用于 sklearn 机器学习集成库的小段代码，其输出显示在第 3 章的图\
  \ 3-8 中。这些是对基本库的测试；然而，你也可以通过清单 5-5 中给出的 Raspbian 命令行脚本 `iotpypkgtest.run` 程序，检查第\
  \ 3 章 Python 代码中使用的更高级的库，如 tkinter、gpiozero、smtplib、pygame、psutil、platform 和 time。我展示了一个你可能在首次执行时在命令行上遇到的权限拒绝错误；可以通过使用\
  \ `chmod 700` 命令更改脚本的权限来解决。\n\n```\npi@raspberrypi:~/$ ./iotpypkgtest.run\nbash:\
  \ ./iotpypkgtest.run: Permission denied\npi@raspberrypi:~/$ chmod 700 iotpypkgtest.run\n\
  pi@raspberrypi:~/$./iotpypkgtest.run\npi@raspberrypi:~/$\npi@raspberrypi:~/$ ls\
  \ -l ∗.out\n-rw-r--r-- 1 pi pi   0 Aug 17 23:19 gpiozero.out\n-rw-r--r-- 1 pi pi\
  \   0 Aug 17 23:19 platform.out\n-rw-r--r-- 1 pi pi   0 Aug 17 23:19 psutil.out\n\
  -rw-r--r-- 1 pi pi   0 Aug 17 23:19 pygame.out\n-rw-r--r-- 1 pi pi   0 Aug 17 23:19\
  \ smtplib.out\n-rw-r--r-- 1 pi pi   0 Aug 17 23:19 time.out\n-rw-r--r-- 1 pi pi\
  \ 111 Aug 17 23:19 tkinter.out\npi@raspberrypi:~/$\n清单 5-5\n用于测试高级包安装的脚本\n```\n\n\
  我特意在脚本中使用了命令 `python -c ‘import tkinter’` 来制造一个错误，这样你可以在清单 5-5 中看到其余文件的大小为零字节；然而，`tkinter.out`\
  \ 文件有 111 字节写入其中，表明那里存在一些错误。你在第 3 章中看到了错误的原因；但重申一下，tkinter 库用于 GUI 创建目的，例如窗口屏幕和用于操作物联网设备的按钮，并且它适用于\
  \ Python 3.x 而不是 Python 2.7。在你的 Raspbian 命令行上，当你只输入 `python` 时，你调用的是 Python 2.7\
  \ 解释器；如果你想调用 Python 3 版本的解释器，你需要在命令行中输入 `python3`，就像我在清单 5-6 中所做的那样。\n\n```\npi@raspberrypi:~/$\
  \ python3 -c \"import tkinter\"\npi@raspberrypi:~/$\n清单 5-6\n在 Python 3.x 解释器上成功执行\
  \ tkinter\n```\n\n来自 Python 2.7 命令行的错误如清单 5-7 所示。\n\n\n\n```\npi@raspberrypi:~/$\
  \ cat tkinter.out\nTraceback (most recent call last):\nFile \"\", line 1, in \n\
  ImportError: No module named tkinter\npi@raspberrypi:~/$\n清单 5-7\nPython 2.7 命令行报错\n\
  ```\n\n这个错误信息并不直观，但它确实表明该解释器版本无法识别名为 `tkinter` 的模块。如果其他 Python 库安装出现问题，你可能会遇到不同的错误，这需要你单独进行调试。到目前为止，你已经安装了\
  \ Python 程序运行所需的基本库，包括用于机器学习算法的 `sklearn`。然而，为了让物联网通过 Raspberry Pi 3 B+ 和 Arduino\
  \ Mega 4560 正常工作，你还需要从以下列表中安装高级库：\n\n*   **gpiozero**：用于实现 Python 与 Raspberry Pi\
  \ 3 B+ 上 GPIO 端口通信的主要库。\n*   **smtplib**：用于从基于 Raspbian Linux 的操作系统发送电子邮件警报。\n*\
  \   **pygame**：用于在 Python 程序中生成声音。\n*   **psutil（进程和系统工具）**：一个跨平台库，用于在 Python 中检索**正在运行的进程**和**系统利用率**（CPU、内存、磁盘、网络、传感器）的信息。\n\
  *   **platform**：用于访问底层平台的数据，例如硬件、操作系统和解释器版本信息。\n*   **time**：Python 定义了一个名为 `time`\
  \ 的包，它允许你处理与时间及其转换和表示相关的各种操作，这些操作在你的应用程序中可用于通过物联网设备存储事件的时间戳。\n\n`gpiozero` 是我在 Raspberry\
  \ Pi 3 B+ 上使用的主要 Python 包，它已经过测试并成功运行在我客户的商业应用中，因此我推荐使用这个包与物联网设备进行通信。一个能够进行监控和警报，却无法实时通知相关人员应用程序有什么用呢？为此，你需要\
  \ `smtplib` Python 库。在 Raspberry Pi 3 B+ 上配置 SMTP 服务器超出了本书的范围，因此我不会涉及这部分内容。不过，一旦配置完成，使用第\
  \ 3 章中给出的 `machinemon` 应用程序发送电子邮件就很容易了。`psutil` 和 `platform` Python 包用于从 Raspberry\
  \ Pi 3 B+ 的底层硬件获取数据，例如 CPU 百分比、温度、内存、磁盘空间等。要创建一个成功的商业应用程序，你需要存储通过物联网设备进行监控期间发生的每个事件的时间戳，而\
  \ `time` Python 包正好可以派上用场。\n\n现在你已经了解了用于物联网的高级包，接下来请使用名为 `iotpypackagesinstall.run`\
  \ 的脚本和名为 `iotpypackages.run` 的测试来安装它们，分别如清单 5-8 和 5-9 所示。\n\n```\npi@raspberrypi:~/IoTBook/Chapter5\
  \ $ cat iotpypackages.run\npython -c \"import tkinter\" &> tkinter.out\npython -c\
  \ \"import gpiozero\" &> gpiozero.out\npython -c \"import smtplib\" &> smtplib.out\n\
  python -c \"import pygame\" &> pygame.out\npython -c \"import psutil\" &> psutil.out\n\
  python -c \"import platform\" &> platform.out\npython -c \"import time\" &> time.out\n\
  pi@raspberrypi:~/IoTBook/Chapter5 $ ls -l ∗.out\n-rw-r--r-- 1 pi pi   0 Aug 18 00:51\
  \ gpiozero.out\n-rw-r--r-- 1 pi pi   0 Aug 18 00:51 platform.out\n-rw-r--r-- 1 pi\
  \ pi   0 Aug 18 00:51 psutil.out\n-rw-r--r-- 1 pi pi   0 Aug 18 00:51 pygame.out\n\
  -rw-r--r-- 1 pi pi   0 Aug 18 00:51 smtplib.out\n-rw-r--r-- 1 pi pi   0 Aug 18 00:51\
  \ time.out\n-rw-r--r-- 1 pi pi 111 Aug 18 00:51 tkinter.out\npi@raspberrypi:~/IoTBook/Chapter5\
  \ $\n清单 5-9\n脚本 iotpypackages.run 的输出\n```\n\n```\nsudo pip install gpiozero | tee\
  \ gpiozero.log\nsudo pip install pygame | tee  pygame.log\nsudo pip install psutil\
  \ | tee  psutil.log\npi@raspberrypi:~$ ./iotpypackagesinstall.run\nRequirement already\
  \ satisfied: gpiozero in /usr/lib/python2.7/dist-packages\nRequirement already satisfied:\
  \ pygame in /usr/lib/python2.7/dist-packages\nRequirement already satisfied: psutil\
  \ in /usr/lib/python2.7/dist-packages\n#使用脚本测试已安装的包\npi@raspberrypi:~/IoTBook/Chapter5\
  \ $ ./iotpypackages.run\n清单 5-8\n运行 iotpypackages.run Raspbian 脚本的代码\n```\n\n从清单\
  \ 5-9 中的测试脚本输出可以看出，除了 `tkinter.out` 之外，所有文件的大小都是 0 字节。因此，高级包已成功安装。如果你在这些 Python\
  \ 库安装过程中遇到任何问题，可以通过 [`www.pmauthor.com/raspbian/`](http://www.pmauthor.com/raspbian/)\
  \ 的技术论坛给我留言，我会尽力帮你解决疑问。\n\n到目前为止，你已经成功设置了 Raspberry Pi 3 B+ 以及 Python 及其所需的包，并通过本章和第\
  \ 3 章中的脚本对其进行了测试。现在，你必须安装 Arduino IDE 以与 Arduino Mega 4560 通信，并创建一个 SQLite3 数据库，以便你的物联网应用程序可以存储数据。安装\
  \ Arduino IDE 后，你需要使用串行电缆测试 Raspberry Pi 和 Arduino 之间的通信。在接下来的步骤中，你将了解将 Arduino\
  \ Mega 4560 硬件连接到 Raspberry Pi 3 B+ 的详细步骤。\n\n\n### 确定位数\n\n在继续安装 Arduino IDE 之前，你需要了解你的树莓派是\
  \ 32 位还是 64 位的。为此，有两个有用的命令，如清单 5-10 所示，它们可以显示 bash 的位数版本。\n\n```\n> which bash\n\
  /bin/bash\n> file /bin/bash\n/bin/bash: ELF 32-bit LSB executable, ARM, version\
  \ 1 (SYSV) ...\n清单 5-10\n查找树莓派的位数版本\n```\n\n我的树莓派 3 B+ 有一个 32 位的 bash 可执行文件。这不是确定位数版本的非常明确的方法，但硬件制造商在\
  \ 64 位处理器上编译 32 位 bash 的可能性极小。此外，为了确认，你可以使用清单 5-11 中所示的 `uname` 命令，该命令显示我正在 ARMv7\
  \ 处理器上运行树莓派 Linux 变体。\n\n```\npi@raspberrypi:~/$ uname -a\nLinux raspberrypi 4.14.98-v7+\
