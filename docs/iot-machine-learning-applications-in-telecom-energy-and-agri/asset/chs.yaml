  \ 所示。\n\n![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig6_HTML.jpg](img/484167_1_En_3_Fig6_HTML.jpg)\n\
  \n图 3-6\n\n在树莓派上加载 scikit-learn 的结果\n\n```\nimport sklearn as sk\nprint(\"Scikit\
  \ learn loaded\")\n```\n\n如果 scikit-learn 库加载成功，你应该会在底部的 shell 区域看到图 3-6 所示的输出。如果你从\
  \ shell 中收到任何错误，说明该库未在你的树莓派系统中加载。要加载该库，请使用命令 `pip3 install scikit-learn`。如果需要排查问题，请参考\
  \ Stackoverflow.com 上关于此主题的讨论：[`https://stackoverflow.com/questions/38865708/how-can-i-run-python-scikit-learn-on-raspberry-pi`](https://stackoverflow.com/questions/38865708/how-can-i-run-python-scikit-learn-on-raspberry-pi)。\n\
  \n现在，你已经测试并运行了 Python 及其库。如果到目前为止一切正常，下一步是使用 Python 测试 Arduino，这将在下一节中进行。\n\n##\
  \ 使用 Python 测试 Arduino\n\nArduino 是一种微控制器。正如你在第 2 章中所了解的，它用于通过 Modbus 协议与工业设备通信。让我们开始使用\
  \ Arduino。\n\nArduino 程序是在 Arduino IDE 中编写的。Arduino IDE 是运行在树莓派系统上的特殊软件。你将把它用作主设备，而\
  \ Arduino 将作为从设备，与你的 IIoT 设备（如电能表）进行通信。它允许你为不同的 Arduino 板编写草图（在 Arduino 语言中，*程序*的同义词）。Arduino\
  \ 编程语言基于一种非常简单的硬件编程语言 Processing，其语法类似于 C 语言。在 Arduino IDE 中编写草图后，需要将其烧录到 Arduino\
  \ 芯片板上执行。这个过程称为上传到 Arduino 微控制器。在此测试中，你将使用 Arduino IDE 在树莓派 3 Model B+ 上进行测试。请记住，Arduino\
  \ 不是一个功能完整的计算机；它不像树莓派那样拥有自己的操作系统，这就是为什么它需要一个像树莓派这样的主设备来监控、控制和使用它。从设备 Arduino 在其主设备和连接的\
  \ IIoT 或 IoT 设备之间进行双向通信。虽然这最初看起来复杂，但一旦你开始测试并将每个硬件和软件组件组合起来使系统工作，它就会变得更容易。\n\n###\
  \ Arduino 硬件设置与通信\n\n首先，使用 Arduino Mega 2560 附带的 USB 串行电缆将其与树莓派 3 Model B+ 连接，如图\
  \ 3-7 所示。使用树莓派的 USB 端口进行连接，另一端连接到 Arduino 板的串行端口。\n\n![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig7_HTML.png](img/484167_1_En_3_Fig7_HTML.png)\n\
  \n图 3-7\n\n连接的树莓派 3 B+ 和 Arduino Mega 2560\n\n下一步，打开 Arduino IDE，如图 3-8 所示，并编写清单\
  \ 3-2 中所示的程序。\n\n![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig8_HTML.png](img/484167_1_En_3_Fig8_HTML.png)\n\
  \n图 3-8\n\n在树莓派 3 Model B+ 上打开 Arduino IDE\n\n打开 Arduino IDE 后，你可以编写 Arduino 版本的“Hello\
  \ world”程序。\n\n```\nvoid setup() {\n// put your setup code here, to run once:\n\
  Serial.begin(9600);\n}\nvoid loop() {\n// put your main code here, to run repeatedly:\n\
  Serial.println(\"Hello World from Arduino\");\n}\n清单 3-2\nArduino “Hello world”\
  \ 程序\n```\n\n当你为 Arduino 编写草图程序时，需要包含两个与 C 语言非常相似的函数。第一个是 `void setup()` 函数，主要用于初始化串行总线通信、LED\
  \ 或连接到 Arduino 微控制器的其他设备。图 3-12 所示的 Arduino IDE 是你将在树莓派 3 B+ 上从桌面“开始 ➤ 编程”菜单中打开的，然后你将编写图\
  \ 3-9 所示的程序。\n\n![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig9_HTML.jpg](img/484167_1_En_3_Fig9_HTML.jpg)\n\
  \n图 3-9\n\n默认的 Arduino IDE 草图\n\n代码不言自明，采用 C 风格和语法。第一个函数是 `void setup()`，符号 `//`\
  \ 后的注释（表示注释）说明你可以在此处放置代码，并且只需运行一次，例如初始化任何设备或变量值等。在 setup 函数中，由花括号 { } 表示的主体是你编写代码的区域。下一个函数是\
  \ loop 函数，你希望它循环或重复运行。如果你有纯软件背景，可能会觉得这令人困惑，可能不明白为什么需要一个重复执行操作的函数。试着这样理解：像 Arduino\
  \ 这样的机器或微控制器无法自行运行，除非有一个程序反复告诉它该做什么。这就像有一个随时听候差遣的仆人，闲着就会感到无聊。同样，Arduino 也需要重复做一些事情，不能闲置。你可以让它监控一个设备，并在某个事件发生或设备即将出现故障时触发某些操作。这只是你可以使用这个\
  \ `loop()` 函数的一个例子；其应用是无限的。你可以根据 Modbus 设备的输入值（如温度等）打开或关闭 LED。这只需要 Arduino 微控制器持续不间断地工作，而这正是\
  \ `loop()` 函数的全部意义所在。\n\n在继续之前，你需要了解在 Arduino IDE 中编译和运行程序的过程。首先，编写草图代码并将其保存为扩展名为\
  \ `∗.ino` 的文件。保存后，转到“工具 ➤ 板”并悬停以打开支持的 Arduino 微控制器板列表。从列表中选择 Arduino Mega 2560。你必须记住每次打开\
  \ Arduino IDE 时都要检查，以免在编译中出现错误。图 3-10 显示了如何执行此操作。\n\n\n\n![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig10_HTML.jpg](img/484167_1_En_3_Fig10_HTML.jpg)\n\
  \n图 3-10\n\n选择 Arduino Mega 2560 开发板\n\n选择 Arduino/Genuino Mega 或 Mega 2560 后，你就可以编写第一个\
  \ Hello world 程序了，如图 3-11 所示。\n\n![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig11_HTML.jpg](img/484167_1_En_3_Fig11_HTML.jpg)\n\
  \n图 3-11\n\n在 Arduino IDE 中编写 Hello world 程序\n\n你会注意到，程序的 `setup` 函数以 9600 的波特率初始化了串口。`loop`\
  \ 函数中包含一条向 Arduino 串口打印信息的语句。实际上，这类程序本身并无实际意义；然而，你是在尝试测试与 Arduino 微控制器的通信。下一步，如果你能成功编译该程序，则说明你没有犯任何错误。这个\
  \ Hello world 程序中常见的错误是首字母大写（在 `Serial` 中，字母 S 必须大写）。另一件需要记住的事情是，`Serial` 对象的函数名不需要大写。`begin`\
  \ 和 `println` 函数名都没有大写。就像任何 C 或 C++ 程序一样，每条语句都必须以分号结尾。\n\n现在，让我们进入下一步，在 Arduino\
  \ IDE 中编译程序，如图 3-12 所示。\n\n![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig12_HTML.jpg](img/484167_1_En_3_Fig12_HTML.jpg)\n\
  \n图 3-12\n\n在 Arduino IDE 中编译草图\n\n### 运行草图\n\n成功编译 Hello world 程序后，你可以继续下一步：上传程序。在此步骤中，Arduino\
  \ IDE 通过树莓派的 USB 串行接口与 Arduino Mega 2560 微控制器通信，并将整个程序烧录到其中。现在，该程序将驻留在微控制器的内存中并无限运行，直到你编写下一个程序并通过相同的过程将其覆盖写入。图\
  \ 3-13 显示了“草图”菜单中用于将程序上传到微控制器开发板的“上传”选项。\n\n![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig13_HTML.jpg](img/484167_1_En_3_Fig13_HTML.jpg)\n\
  \n图 3-13\n\nArduino IDE 中用于上传草图的选项\n\n现在，你已经编译了程序并点击了上传，你应该会看到程序正在上传，并且有一个进度条指示\
  \ Arduino IDE 将程序写入微控制器开发板的进度。如果你没有选择正确的微控制器开发板，你将在此处看到错误。如果树莓派和 Arduino 之间的连接出现问题，你也会在此步骤中看到错误。上传阶段出错的最常见原因是线缆松动或串行总线线缆不良。因此，请检查树莓派和\
  \ Arduino 开发板两端的接口，以确认你的线缆没有问题。如果上传时仍然遇到错误，请尝试更换线缆。图 3-14 显示了将 Hello world 程序成功上传到\
  \ Arduino 微控制器开发板的结果。请注意 Arduino IDE 底部面板上的“完成编译”消息。下面的方框显示了与程序存储空间或可供其使用的最大空间相关的消息。在此例中，它使用了可用最大空间\
  \ 253952 字节中的 1820 字节。同样，它还告知你，其全局变量使用了 212 字节（2%）的动态内存，在总共 8192 字节中，为局部变量留下了 7980\
  \ 字节。非常长的程序可能无法放入 Arduino Mega 2560 开发板的小容量内存中，因此这些信息会派上用场，以便你可以优化程序以使其适合。\n\n![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig14_HTML.jpg](img/484167_1_En_3_Fig14_HTML.jpg)\n\
  \n图 3-14\n\nArduino IDE 上的“完成编译”消息\n\n这是测试树莓派与 Arduino 通信过程的最后一步。现在，你已经准备好进行下一步，从树莓派获取物联网传感器数据。\n\
  \n## 使用树莓派示例代码获取物联网传感器数据\n\n为了在树莓派中获取物联网传感器数据，你首先需要重新审视单板计算机上的 GPIO 引脚。它们如图 3-15\
  \ 所示。\n\n![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig15_HTML.jpg](img/484167_1_En_3_Fig15_HTML.jpg)\n\
  \n图 3-15\n\n树莓派 3 型号 B+ GPIO 引脚布局\n\n40 个 GPIO 引脚在图 3-15 中清晰可见。我在前面的章节中解释过它们的用途；然而，在本章中，你将使用它们来构建电路，与\
  \ LED 和物联网传感器等设备进行通信。此后，我将引用这些引脚编号，例如，带有红色圆圈且编号为 1 的引脚标有 3V，这意味着它用于为你的设备提供 3V 电流；而带有红色圆圈且编号为\
  \ 2 和 4 的引脚提供 5V 电源。此外，你将使用编号为 6、9、14、20、30、34 和 39 的接地引脚。其余引脚可用于数字 GPIO 通信。\n\n\
  你现在正处于将物联网传感器连接到树莓派开发板 GPIO 引脚的步骤。有两种方法可以做到这一点：使用面包板（如图 3-16 所示）或印刷电路板（PCB）。本书中的所有示例、解决方案和案例研究练习都处于概念验证（PoC）级别。当你首次设计电子系统作为概念验证时，会使用面包板；当你在面包板上测试了与程序配合使用的电子电路，并且现在希望将其永久化用于生产或商业用途时，则会使用\
  \ PCB。\n\n![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig16_HTML.jpg](img/484167_1_En_3_Fig16_HTML.jpg)\n\
  \n图 3-16\n\n用于电路测试的面包板\n\n如你所见，面包板的顶部和底部有两条导轨，其内部嵌有正极和负极孔。中间的分区各有五列和六十四行，用于连接 LED、物联网传感器或电机等设备。关于此面包板，需要注意的关键点是，在塑料涂层下面是一个电路网格，它将每一行连接在一起。因此，如果你将\
  \ LED 的一个引脚放在该行的任何中间位置，你应该能够通过将另一根导线放在同一行上来连接到它。你无需将导线插入与插入任何设备引脚的同一个孔中。面包板的这一特性使其使用起来非常方便，并且无需焊接电路（在使用印刷电路板时需要焊接）。由于此板的性质是整个电路基于孔且不是永久性的，因此你不能将其用于生产级工作。\n\
  \n\n\n### 整合所有环节\n\n现在，让我们在 Raspberry Pi 3 Model B+ 板上连接一个物联网传感器，并编写一个 Python 程序来获取其数据。在本章下一节中，你将学习如何将物联网传感器数据存储到数据库中。\n\
  \n首先需要定义带有 Raspberry Pi 的物联网传感器电路图，以便你理解要构建的内容。图 3-17 展示了该项目的电气连接图。\n\n![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig17_HTML.jpg](img/484167_1_En_3_Fig17_HTML.jpg)\n\
  \n图 3-17\n\n连接到 Raspberry Pi 的物联网传感器电气连接图\n\n你将使用的物联网传感器是一个 LDR（光敏电阻模块）。你使用的并非单个\
  \ LDR 或光敏电阻，而是一个预制的 LDR 模块，其 PCB 上集成了功能完整的电路板，远端装有光电电阻，在图 3-17 中标记为数字 6。该模块感知环境中的光线，并以\
  \ 0/1 格式返回数据。它返回的值是浮点数，白天返回 0，黑暗时返回接近 1 的值（如 0.90 到 0.99）。要模拟黑暗，你可以用物体遮住 LDR 的光敏电阻。你可以看到标记为\
  \ 1 的点，即 VCC；你需要将导线从这里连接到 Raspberry Pi 板上的 GPIO 引脚 1。标记为接地的点必须连接到 Raspberry Pi 板上的\
  \ GPIO 引脚 6。点 3 是 LDR 模块的 DO（数字输出信号线），必须连接到 Raspberry Pi 板上的 GPIO 引脚 25。LDR 模块完全连接后，两侧会亮起两个红色\
  \ LED 信号，如图 3-18 所示。\n\n![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig18_HTML.jpg](img/484167_1_En_3_Fig18_HTML.jpg)\n\
  \n图 3-18\n\n完全连接的 LDR 模块\n\n现在让我们看看带有光电电阻的 LDR 模块。在远端，它被遮盖了；结果只有一个灯亮起，表明 LDR 模块周围是黑暗的（见图\
  \ 3-19）。\n\n![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig19_HTML.jpg](img/484167_1_En_3_Fig19_HTML.jpg)\n\
  \n图 3-19\n\n完全连接并遮盖光电电阻的 LDR 模块\n\n图 3-19 中标记为 1 的点是用于数字输出的第二个 LED，它处于熄灭状态，表明没有从光电电阻接收到信号。图中标记为\
  \ 2 的点是光电电阻，我用铅笔将其遮盖住了。任何不透光的物体都可以用来遮盖光电电阻。模拟白天和黑夜是为了测试目的；然而，在现实世界中，当你将此传感器应用于诸如检测白天或黑夜，并根据结果打开或关闭消费/工业电器等场景时，它会发挥奇妙的作用。这些数据与来自工业机器的数据相结合，还有助于诊断预测性维护应用中的关键问题，你将在案例研究中应用这些方法。在本章下一节中，你将把此\
  \ LDR 物联网传感器数据存储到数据库中。\n\n请确保表 3-1 中列出的 GPIO 引脚已连接到 Raspberry Pi 板上对应的引脚。\n\n表 3-1\n\
  \nRaspberry Pi GPIO 引脚与 LDR 模块的连接\n\n| Raspberry Pi | GPIO 引脚编号 | 光敏传感器模块 |\n| ---\
  \ | --- | --- |\n| 3.3v 电源 | 1 | VCC (V) |\n| 接地 | 6 | GND (G) |\n| GPIO 信号引脚 |\
  \ 25 | SIGNAL (S) |\n\nGPIO 引脚 1 必须连接到 LDR 模块上标记为 VCC 的引脚。同样，接地的 GPIO 引脚应通过导线连接到\
  \ LDR 模块上显示 GND 的中间引脚。你在程序中使用的第三个引脚是 GPIO 信号引脚，它将与 LDR 模块发送和接收数字信号，即引脚 25 连接到 GPIO\
  \ 信号引脚的第三个引脚。有些 LDR 模块有四个引脚；最后一个引脚用于模拟输入和输出，以备你需要使用。但在你的情况下，由于你使用的是三引脚 LDR 模块，无需担心这一点。GPIO\
  \ 和 LDR 模块上已连接的 LDR 引脚如图 3-20 所示。\n\n![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig20_HTML.jpg](img/484167_1_En_3_Fig20_HTML.jpg)\n\
  \n图 3-20\n\nRaspberry Pi GPIO 引脚与 LDR 模块的连接\n\n\n\n### 对物联网传感器 LDR 模块进行编程\n\n正确连接引脚的首要迹象是，你会看到\
  \ LDR 模块上有两个红色 LED 灯亮起，这表明该模块正在从树莓派主板接收电源和输入。这一点至关重要，因为除非看到这些指示灯亮起，否则你将无法运行清单 3-3\
  \ 中所示的名为 `ldr.py` 的 Python 代码。\n\n```\n#打开光传感器\nfrom gpiozero import LightSensor\n\
  ldr = LightSensor(25)\nwhile True:\nprint(ldr.value)\nldval=float(ldr.value)\n#print(ldval)\n\
  #print(\"done deal\")\nif(ldval>0.0):\nprint(\"现在是夜晚时间\")\nelse:\nprint(\"现在是白天时间\"\
  )\n清单 3-3\n对 LDR 模块物联网传感器进行编程\n```\n\n`gpiozero` 库并未安装在树莓派默认版本的 Python 中，因此你必须在已安装的\
  \ Python 目录中通过输入 `pip install gpiozero` 来安装它。该库拥有与 GPIO 引脚和设备通信所需的属性和函数。在这个程序中，你首先导入\
  \ `gpiozero` 库中的 `LightSensor`，然后在第二行将其初始化为 GPIO 引脚编号 25，以便从 LDR 模块获取信号。请参考表 3-1，将\
  \ GPIO 信号引脚编号与本程序第二行中给出的编号进行核对；它们必须匹配，否则你将完全无法与 LDR 模块通信。接下来，你使用一个无限循环来打印 LDR 值，该值返回\
  \ 0 表示白天，返回 1 表示夜晚。然而，输出是一个浮点数，更接近于 1，范围在 0.9 到 1 之间。如果你希望它更灵敏，可能需要调整 LDR 模块顶部的蓝色电位器。这个小程序使用了一个\
  \ `if` 条件来检查 LDR 的值是否大于 0，如果大于 0，则打印“现在是夜晚时间”；否则，打印“现在是白天时间”。循环结束后，你关闭 LDR 模块传感器，以便它可以再次被初始化。在实际应用中，这里就是你通过树莓派控制任何设备（如\
  \ LED 灯或任何其他电器）的应用代码所在的位置。清单 3-4 给出了使用 Python 运行清单 3-2 中程序的输出。\n\n```\npi@raspberrypi:~/\
  \ python ldr.py\n\n0.94490146637\n现在是夜晚时间\n0.94490146637\n现在是夜晚时间\n0.94490146637\n\
  现在是夜晚时间\n0.94490146637\n现在是夜晚时间\n0.94490146637\n现在是夜晚时间\n0.94490146637\n现在是夜晚时间\n\
  0.94490146637\n现在是夜晚时间\n0.94490146637\n现在是夜晚时间\n0.94490146637\n现在是夜晚时间\n0.94490146637\n\
  现在是夜晚时间\n0.94490146637\n现在是夜晚时间\n清单 3-4\nLDR Python 程序的输出\n\n输出是 LDR Python 程序的一次试运行，它通过输出接近\
  \ 1 的浮点数来工作，这意味着运行此程序时环境是黑暗的，或者 LDR 传感器模块周围是黑暗的（它可能被物体遮挡了）。如果你在 LDR 模块的光敏电阻上方点亮手电筒或灯泡，它就会开始输出\
  \ 0 值，表明其周围有光。你可以通过调整 LDR 模块 PCB 顶部的蓝色方形电位器来测试这一点并提高灵敏度。至此，你已经完成了本节的学习，因为你已经能够从物联网传感器获取数据了。\n\
  \n请记住，还有许多其他传感器，用途广泛，可用于从简单到复杂的消费和工业应用。任何这些传感器的数据都非常相似。数字输出总是在 0 和 1 的两个极端；然而，模拟输出可以是变化的，并给出介于两者之间的读数，这些读数不在\
  \ 0 和 1 的极端范围内。另外，需要记住的一点是，这些物联网传感器在大量使用后，其精度会随着时间的推移而下降，因此你可能需要更换那些接触水或土壤的传感器，因为这些接触会导致传感器头腐蚀。\n\
  \n## 将物联网传感器数据存储在数据库中\n\n在本节中，我将向你展示如何将数据存储在 SQLite3 数据库中。你将在第 5 章中详细了解如何安装此数据库。然而，与本章前面的示例一样，我将让你坐下来，看看你可以通过测试物联网传感器、逐一组装系统并将数据累积到数据库中来做些什么。在上一节的示例中，你已成功获取了\
  \ LDR 模块物联网传感器的数据；然而，如果孤立地收集，这些数据是没有意义的，需要与其他数据集结合才能变得有意义。例如，仅仅知道是白天还是夜晚是不够的；如果你将其与温度物联网传感器数据结合起来，就可以找出它们之间的相关性，看看光照是否与温度有关。如果发现了任何关系，那么它就有了一定的意义。\n\
  \n你还将修改清单 3-2 中的现有代码并添加新代码，以便将其存储在 SQLite3 数据库中。你也可以将这些数据存储在任何其他关系型数据库管理系统（RDBMS）中，或者存储在像\
  \ CSV 或 JSON 格式这样的平面文件中；但是，这里你将使用在 Raspbian 上运行良好的 SQLite3。\n\n### 配置 SQLite3 数据库\n\
  \n在图 3-21 中，你可以看到一个名为 `iotsensor.db` 的 SQLite3 数据库。由于这是一个空白数据库，SQLite3 数据库引擎会自动为你创建它。这个新数据库将是空的，没有任何表或其他结构。你需要创建它们。\n\
  \n![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig21_HTML.jpg](img/484167_1_En_3_Fig21_HTML.jpg)\n\
  \n图 3-21\n\n启动 SQLite3 数据库\n\n启动 SQLite3 数据库的代码如清单 3-5 所示。\n\n```\npi@raspberrypi:~/iot\
  \ $ SQLite3 iotsensor.db\nSQLite version 3.16.2 2017-01-06 16:32:41\nEnter \".help\"\
  \ for usage hints.\nsqlite>\n清单 3-5\n启动 SQLite3 数据库\n```\n\n一旦你登录到数据库，它会显示其版本号以及你登录时的日期和时间戳来欢迎你。它会显示一个提示符\
  \ `sqlite>`，你可以在其中运行命令来操作数据库。在此提示符下有两组命令可以工作：一组是以点开头的命令，例如 `.databases` 或 `.tables`；另一组是\
  \ SQL 命令，例如 `select ∗ from <tablename>;`。初学者常犯的一个错误是忘记在 `databases` 或 `tables` 命令前加点，然后\
  \ SQLite 提示符会报错。对于 SQL 命令，不要忘记在每个语句的末尾使用分号 (`;`)；如果不这样做，`sqlite>` 提示符会继续到下一行，你的命令将不会执行。\n\
  \n你现在可以通过在 `sqlite>` 提示符下输入 `.databases` 和 `.dbinfo` 命令来查看数据库及其信息。命令的代码和输出分别如清单\
  \ 3-6 和图 3-22 所示。\n\n![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig22_HTML.jpg](img/484167_1_En_3_Fig22_HTML.jpg)\n\
  \n图 3-22\n\n数据库信息命令代码的输出\n\n```\nSQLite version 3.16.2 2017-01-06 16:32:41\nEnter\
  \ \".help\" for usage hints.\nsqlite> .databases\nsqlite> .dbinfo\nsqlite> .tables\n\
  sqlite>\n清单 3-6\nSQLite3 数据库信息代码\n```\n\n\n\n### 创建数据库结构\n\n输出显示了数据库的各种结果，例如内存中使用的页面大小、文本编码、表数量、索引数量、触发器数量和视图数量。由于这是一个原始数据库，你没有任何表、视图、触发器或索引。你可以使用点命令\
  \ `.tables` 来验证这一点，该命令会显示所有已存在的表，如图 3-22 所示。它返回了空结果，这意味着该数据库中没有表。因此，让我们创建一个表来存储带有日期和时间戳的小型物联网传感器数据，如代码清单\
  \ 3-7 所示。\n\n```\npi@raspberrypi:~/iot $ SQLite3 iotsensor.db\nSQLite version 3.16.2\
  \ 2017-01-06 16:32:41\nEnter \".help\" for usage hints.\nsqlite> .tables\nsqlite>\
  \ create table ldrvalues(date date, time time, ldrvalue float);\nsqlite>\n代码清单 3-7\n\
  用于创建存储 LDR 物联网传感器值的表的代码\n```\n\n你可以在图 3-23 中看到此表创建的结果，该图显示了 `.tables` 命令的输出，并且表\
  \ `ldrvalues` 现在已存在。\n\n![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig23_HTML.jpg](img/484167_1_En_3_Fig23_HTML.jpg)\n\
  \n图 3-23\n\n在 SQLite3 中创建用于存储物联网传感器数据的表\n\n### 向数据库中插入数据\n\n你现在有了一个名为 `ldrvalues`\
  \ 的表结构，用于将物联网传感器数据存储在名为 `iotsensor.db` 的 SQLite3 数据库中。你可以继续更新代码清单 3-2 中的 Python\
  \ 程序（该程序从物联网传感器获取数据），现在将值写入此 SQLite3 数据库。该程序如代码清单 3-8 所示。\n\n```\npi@raspberrypi:~/iot\
  \ $ cat ldrdb.py\n#Light Dependant Resistor Module Initialization\nfrom gpiozero\
  \ import LightSensor\n#importing Sqlite3 python library to connect with database\n\
  import SQLite3\nfrom datetime import datetime\n#GPIO LDR Signal Pin initialization\n\
  ldr = LightSensor(25)\n#Read value infinitely in a loop\nwhile True:\nprint(ldr.value)\n\
  ldval=float(ldr.value)\nif(ldval>0.0):\nprint(\"It is Night time now\")\nelse:\n\
  print(\"It is Day time\")\nconn = SQLite3.connect('iotsensor.db')\ncurr=conn.cursor()\n\
  query=\"INSERT INTO ldrvalues(date,time,ldrvalue) VALUES(\" +\"'\" + str(datetime.date(datetime.now()))\
  \ + \"'\" +\",\" + \"'\" +                 str(datetime.time(datetime.now())) +\
  \ \"'\" + \",\" + \"'\" + str(ldval) + \"'\" + \")\"\nprint(query)\ncurr.execute(query)\n\
  conn.commit()\n代码清单 3-8\n将 LDR 模块物联网传感器数据存储到 SQLite3 数据库的程序\n```\n\n请注意代码清单 3-2\
  \ 中对代码的修改。你添加了 SQLite3 Python 库的导入语句；这是与 SQLite3 数据库通信所必需的。你还导入了 datetime 库以获取日期和时间，以便在插入查询时将其输入到数据库中。`while(true):`\
  \ 循环没有改变；你只是在它的末尾添加了数据库插入代码。`conn` 对象用于连接到 `iotsensor.db` 数据库，你在其中创建了一个名为 `ldrvalues`\
  \ 的表；请参考图 3-23。`while` 循环内的 cursor 对象使用与 `iotsensor` 数据库的连接来初始化游标。下一条语句是一个 INSERT\
  \ INTO... 语句，它将数据插入到所有三个列中：`date`、`time` 和 `ldrvalue`。输入到 `time` 列的值取自 `datetime.now()`\
  \ 函数，该函数同时返回日期和时间。由于你需要分别获取时间和日期，因此首先使用 `datetime.date()`，然后在第二列中使用 `datetime.time()`\
  \ 函数来仅从中获取时间值。你将日期和时间分开而不是创建单个列，因为在进行探索性数据分析（EDA）时，如果日期和时间位于单独的列中会更方便；更容易找到日期和时间的趋势。尽管你可以在\
  \ EDA 期间执行相同的操作来从列中提取日期和时间，但你在查询时可以省去一些繁琐的函数。然而，在实际应用中，你很少会发现日期和时间这两个值分开，它们通常位于同一列中，称为时间戳。查询完成后，你使用\
  \ `curr.execute(query)` 让 SQLite3 数据库引擎执行插入语句。如果你的查询存在语法问题，此时你很可能会收到错误。\n\n### 检查数据的合理性\n\
  \n根据你收到的错误消息，你应该尝试解决它。我运行了该程序几分钟，它将 LDR 模块物联网传感器数据插入到了 SQLite3 `iotsensor.db` 数据库中。你可以在图\
  \ 3-24 中看到结果。\n\n![../images/484167_1_En_3_Chapter/484167_1_En_3_Fig24_HTML.jpg](img/484167_1_En_3_Fig24_HTML.jpg)\n\
  \n图 3-24\n\nldrdb.py 的程序执行结果\n\n你可以看到该程序在几分钟内插入了大约 1316 行。表的结构可以通过执行 `pragma table_info(ldrvalues);`\
  \ 语句来查看。pragma 语句有一个名为 `table_info` 的函数，该函数接受已连接数据库的表名作为参数。在你的例子中，连接的数据库是 `iotsensor.db`，表是\
  \ `ldrvalues`。它有三列，你可以将其视为 pragma 语句的输出。第一列是 `date`，第二列是 `time`，第三列是 `ldrvalue`。它们在\
  \ SQLite3 表中各自的数据类型显示在它们旁边。之后，你运行查询 `select count(∗) from ldrvalues` 来获取总行数。接下来，你查看\
  \ `ldrvalue` 列中所有不等于 0.0（代表白天）的值的计数。该列中的任何值都表示黑暗或夜晚。通过这个简单程序的演示，你应该了解物联网传感器数据如何存储在数据库中并使用。\n\
  \n接下来，我将向你展示一个完整的 Python 程序，它使用树莓派内部的 CPU 来测量其温度并将其存储在数据库中。该程序将模拟从工业设备或物联网传感器测量数据并将其存储在数据库中的过程。之后，通过一个单独的程序，它将创建一个图表来显示数据，就像你在现实世界的物联网应用中所做的那样。在下一节中，你将应用并构建一个机器学习模型。当你从树莓派单板计算机（SBC）板获取这些数据，然后将其存储在数据库中供以后在机器学习模型中使用时，这将会非常令人兴奋。让我们开始吧。\n\
  \n用于实现机器学习的程序如代码清单 3-9 所示。\n\n\n\n```\n#初始化 Python 库\nfrom gpiozero import CPUTemperature\n\
  import time\nfrom datetime import datetime\nimport pandas as pd\nimport psutil\n\
  import platform\nfrom gpiozero import LED\nimport time\n#初始化红色状态音频播放\nimport pygame\n\
  pygame.mixer.init()\npygame.mixer.music.load(\"example.mp3\")\n#在引脚 18 初始化 LED\n\
  redled= LED(18)\ngreenled= LED(22)\nyellowled= LED(17)\n#初始化光敏模块\nfrom gpiozero\
  \ import LightSensor\nldr = LightSensor(25)\ntempstatus=\"\"\n#pandas 数据框的列名\ncolumns=['date','time','temperature','tempstatus','cpupercent','diskpercent','memorypercent']\n\
  #创建一个 pandas 数据框来存储树莓派硬件数据\ndf=pd.DataFrame(columns=columns)\ndf['date']=datetime.date(datetime.now())\n\
  df['time']=datetime.time(datetime.now())\ndf['temperature']=0\ndf['tempstatus']=\"\
  \"\ndf[\"ldrval\"]=0\ncpu = CPUTemperature()\ncounter=0\nwhile True:\n#print(cpu.temperature)\n\
  time.sleep(1)\ntem=cpu.temperature\nif(tem>60):\nprint(\"红色警报：CPU 温度过高\")\ntempstatus=\"\
  RED\"\nredled.on()\ngreenled.off()\nyellowled.off()\npygame.mixer.music.play()\n\
  elif(tem>55 and tem<60):\nprint(\"黄色警报：CPU 接近高温阈值\")\ntempstatus=\"ORANGE\"\nredled.off()\n\
  greenled.off()\nyellowled.on()\nelse:\nprint(\"温度正常\")\ntempstatus=\"GREEN\"\n#time.sleep(1)\n\
  greenled.on()\nredled.off()\nyellowled.off()\ndf['date'].loc[counter]=datetime.date(datetime.now())\n\
  print(datetime.date(datetime.now()))\ndf['time'].loc[counter]=datetime.time(datetime.now())\n\
  df['temperature'].loc[counter]=tem\ndf['tempstatus'].loc[counter]=tempstatus\n#print(df['date'].values)\n\
  #print(df['time'].values)\n#print(df['temperature'].values)\n#print(df['tempstatus'].values)\n\
  #现在将数据写入 SQLite3 数据库 temperature.db\n#print(\"已连接到 MACHINEMON 数据库\")\nimport SQLite3\n\
  conn = SQLite3.connect('machinemon.db')\n#df.to_sql(name='tempdata', con=conn)\n\
  curr=conn.cursor()\n#获取机器数据\nos, name, version, _, _, _ = platform.uname()\nversion\
  \ = version.split('-')[0]\ncores = psutil.cpu_count()\ncpu_percent = psutil.cpu_percent()\n\
  memory_percent = psutil.virtual_memory()[2]\ndisk_percent = psutil.disk_usage('/')[3]\n\
  #获取光敏传感器数据以判断白天或夜晚，0 表示白天，1 表示夜晚\n#print(ldr.value)\nldrval=ldr.value\n#boot_time\
  \ = datetime.datetime.fromtimestamp(psutil.boot_time())\n#running_since = boot_time.strftime(\"\
  %A %d. %B %Y\")\n#query=\"INSERT INTO TEMPERATURE VALUES(\" +\"'\" + str(datetime.date(datetime.now()))\
  \ + \"'\" +\",\" + \"'\" + str(datetime.time(datetime.now())) + \"'\"+ \",\" + \"\
  '\" + str(tem) +  \"'\" + \",\" + \"'\" + tempstatus +\"'\" + \")\"\nquery=\"INSERT\
  \ INTO machinedata(date,time,temperature,tempstatus,cpupercent,diskpercent,memorypercent,ldrval)\
  \ VALUES(\" +\"'\" + str(datetime.date(datetime.now())) + \"'\" +\",\" + \"'\" +\
  \ str(datetime.time(datetime.now())) + \"'\"+ \",\" + \"'\" + str(tem) +  \"'\"\
  \ + \",\" + \"'\" + tempstatus + \"'\" + \",\" + \"'\" + str(cpu_percent) + \"'\"\
  \ + \",\" + \"'\" + str(disk_percent) + \"'\" + \",\" + \"'\" + str(memory_percent)\
  \ + \"'\" \",\" + \"'\" + str(ldrval) + \"'\" + \")\"\nprint(query)\ncurr.execute(query)\n\
  conn.commit()\n#计数器递增，以解析到数据框中的下一条记录\ncounter=counter+1\n列表 3-9\n模拟物联网解决方案的代码\n\
  ```\n\n虽然你看到的是一大段代码，但其真正目的是向你展示如何构建一个基于 Python 的实用物联网应用程序。你进行的唯一模拟是：并非从实际的物联网传感器获取数据，而是从树莓派内置的硬件物联网传感器中获取数据。温度和百分比值的概念适用于工业设备，例如热交换器或锅炉，这些设备同时包含温度值、百分比值以及一些绝对值。电气设备则有从频率到电压的各种数值。所有这些构成了你将在案例研究示例中使用的数据，因为在这些示例中，数据将来自连接到树莓派和\
  \ Arduino 的实际物联网传感器。\n\n代码首先初始化并导入所需的 Python 库，例如来自`gpiozero`库的`CPUTemperature`。这个库将用于获取树莓派的内部温度。你还导入了`datetime`库以获取数据生成的时间和日期，`pandas`数据框用于临时存储数据，以及导入的`LED`用于通过点亮相应的\
  \ LED 来显示绿色、橙色或红色状态。例如，如果 CPU 温度低于 55 摄氏度，绿色 LED 将点亮；如果树莓派的 CPU 温度高于 55 但低于 60 摄氏度，橙色\
  \ LED 将点亮；如果温度高于 60 摄氏度，红色 LED 将点亮。这正是你在测量外部温度值时，使用物联网传感器实现预警系统的方式。之后，你导入了`pygame`，以确保当温度超过\
  \ 60 摄氏度时，树莓派扬声器会发出声音。这对你的单板计算机来说是一个关键系统，如果不采取措施，系统过一段时间后会挂起，甚至主板或其组件也可能烧毁。试着想象一下，在一个物联网环境中，你希望实现这样一个关键的警报系统。`pygame`库通过`init()`函数进行初始化，在下一行中，它将`example.mp3`（一个尖锐的警报声）加载到内存中。它不会播放，因为你还没有发出命令；它只是被加载到了内存中。\n\
  \n在代码的下一部分，你初始化了将根据 CPU 温度点亮的 LED。红色 LED 连接 GPIO 引脚 18，绿色 LED 连接 GPIO 引脚 22，黄色 LED\
  \ 连接 GPIO 引脚 17。请确保树莓派上的 LED 已连接到图 3-15 中给出的正确引脚编号。\n\n现在，预警系统包括针对红色温度的声音警报以及使用\
  \ LED 针对 CPU 温度的视觉警报。在实际应用中，你将需要这些警报系统以及其他系统，例如短信或电子邮件警报，为此你可能需要在树莓派上配置邮件和短信网关服务器。我们不会这样做，因为我们正在进行概念验证级别的代码，这超出了本书的范围。\n\
  \n\n现在你需要在 25 号引脚初始化 LDR（光敏传感器模块），这在本章前面的部分已经完成。之后，你需要初始化 pandas 数据框（dataframe）来在内存中存储数据。使用\
  \ pandas 的原因是它能给数据提供结构，并允许你根据需求在 Python 中操作和分析数据。接下来是一个无限`while`循环，首先你通过`cpu.temperature`获取\
  \ CPU 温度并存储在一个变量中。下一步是检查温度值。如果温度大于 60，屏幕上会显示一条警报信息：“RED ALERT CPU EXCEEDING HIGH\
  \ TEMPERATURE”（红色警报：CPU 温度过高），随后程序中使用`redled.on()`函数点亮红色 LED。当此事件发生时，其他 LED（绿色和黄色）应被关闭，因此你为这些\
  \ LED 对象使用`off()`函数，以避免对 CPU 温度状态产生混淆。你不希望所有 LED 都亮起；此时只有红色 LED 应亮起以显示危急状态。使用 pygame\
  \ 通过`pygame.mixer.music.play()`函数从树莓派扬声器播放警报音。类似地，还有另外两个条件。下一个条件是当 CPU 温度值介于 55\
  \ 到 60 度之间时，屏幕上显示状态信息“YELLOW ALERT CPU NEARING HIGH-TEMPERATURE THRESHOLD”（黄色警报：CPU\
  \ 接近高温阈值），并使用`on()`函数点亮黄色 LED，同时使用各自的`off()`函数关闭红色和绿色 LED。此时不播放声音，因为这不是危急情况；只有当温度达到\
  \ 60 度的临界极限时才会播放声音。你可能会好奇我是如何得出 60 摄氏度这个数值的。我只是参考了树莓派附带的官方手册，其中提到了 30 到 60 摄氏度的范围。下一个是绿色状态，此时\
  \ CPU 安全，无需任何警报，但对于观看屏幕的人来说，会显示一条信息“TEMPERATURE IS NORMAL”（温度正常）。使用其`on()`函数点亮绿色\
  \ LED，并使用各自的`off()`函数关闭黄色和红色 LED。一旦你在变量`tempstatus`中获得了 CPU 系统的这个状态，就需要将其存储到 pandas\
  \ 数据框中，这通过使用`datetime now()`函数将日期和时间存储到`df['date']`和`df['time']`列中来完成。`df['temperature']`存储来自`tem`变量的温度值。`df['tempstatus']`列存储的是你通过`if`条件对\
  \ tempstatus 变量进行判断后得到的值，即“GREEN”、“RED”或“YELLOW”。\n\n现在你需要准备将数据写入 SQLite3 数据库，这通过导入语句`import\
  \ SQLite3`完成。然后你初始化连接到`machinemon.db`数据库的连接对象。之后创建一个`curr`游标对象，以便在需要时解析表。在写入数据框之前，它的一些列（如`cpu_percent`、`memory_percent`、`disk_percent`和`LDR\
  \ value`）是空值。`cpu_percent`变量用于存储 CPU 百分比值，`memory_percent`变量用于存储内存百分比值，`disk_percent`用于存储磁盘百分比值，`ldrval`变量用于存储\
  \ LDR 模块的白天或夜晚值。\n\n接下来，你已拥有写入数据库表的所有数据，因此现在构建一个`insert into`语句，类似于你在图 3-33 的代码中所做的那样，使用`datetime\
