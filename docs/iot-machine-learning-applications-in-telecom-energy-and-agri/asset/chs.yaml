  Agro 正在评估的另一国家的一块农业用地的值，其特征如下：


  ```

  landsize_in_ha      26

  Crop_in_tonnes      1500

  Soil_pH             6.8

  Organic Carbon %    0.9

  Nitrogen kg/ha      367

  Phosphorus kg/ha    32

  Potassium kg/ha     490

  Sulphur kg/ha       35

  ```


  Glanzo 想从模型中知道，在他们购买这块农田后，可能的年产量是多少。Python 程序给出的值为每公顷 75.2637 吨，如清单 9-3 所示。


  ```

  predicted= regr.predict([[26,1500,6.8,0.9,367,32,490,35]])

  print(predicted)

