  \ + \"'\" + \",\" + \"'\" + str(Volts) + \"'\" + \",\" +  \"'\" + str(Current) +\
  \ \"'\" + \",\" +  \"'\" + str(Active_Power) + \"'\" + \",\" +  \"'\"  + str(Apparent_Power)\
  \ + \"'\" + \",\" +  \"'\" + str(Reactive_Power) +  \"'\" + \",\" +  \"'\" + str(Power_Factor)\
  \ + \"'\" + \",\" +  \"'\" +  str(Phase_Angle) + \"'\" + \",\" +  \"'\" + str(Frequency)\
  \ + \"'\" + \",\" +  \"'\" +  str(Import_Active_Energy) + \"'\" + \",\" +  \"'\"\
  \ + str(Export_Active_Energy) + \"'\" + \",\" +  \"'\" + str(Import_Reactive_Energy)\
  \ + \"'\" + \",\" +  \"'\" + str(Export_Reactive_Energy) + \"'\" + \",\" +  \"'\"\
  \ + str(Total_Active_Energy) + \"'\" + \",\" +  \"'\" + str(Total_Reactive_Energy)\
  \ + \"'\" + \",\" +  \"'\" + str((Volts * Current)) + \"'\" + \",\" + \"'\" + str(\"\
  millmachine\")+ \"'\" + \")\"\nprint(query)\ncurr.execute(query)\nconn.commit()\n\
  清单 6-10\n从电能表获取数据并存储到数据库的 Python 代码\n```\n\n在这段代码中，首先导入 minimalmodbus Python 库，以实现树莓派与电能表之间的\
  \ Modbus 通信。然后导入 datetime，用于在从电能表获取一条数据记录时存储时间戳。其用法在代码后面会体现。之后，通过 Rs485 Modbus USB\
  \ 转换器初始化 Modbus 仪器，该转换器在 Raspbian 设备列表中显示为 `/dev/tty/USB0`。这是默认设备，在大多数情况下应该可以正常工作；但是，如果遇到任何通信错误，请使用命令\
  \ `lsusb` 检查你的 485 转换器连接到了哪个 tty 端口。接下来，以 9600 的波特率初始化串口通信。这是默认值；如果你更改了电能表中的波特率，则需要在此处将代码语句\
  \ `sdm630.serial.baudrate = 9600` 中的值改为新值。你为寄存器初始化了 8 位字节大小，以及其他设置参数，如停止位和超时间隔。`print(sdm630)`\
  \ 会将对象打印到 Raspbian 的控制台，因此你应该能通过这条打印语句看到所有的连接设置配置。之后，你的电能表设置就完成了，现在你可以与其通信并从中获取数据。为此，在接下来的代码中，你使用一个无限\
  \ `while` 循环来持续获取数据并打印到屏幕上，最后将其存储到 SQLite 3 数据库中。这段代码与 Conzerv EM6400 电能表的代码非常相似，因此我不再深入探讨。但需要注意的一点是，你从电能表获取了总共\
  \ 15 个值，包括其电压、电流、有功功率和无功功率，直至当前发电量。运行程序后，你应该会看到类似于图 6-24 的输出。\n\n![../images/484167_1_En_6_Chapter/484167_1_En_6_Fig24_HTML.jpg](img/484167_1_En_6_Fig24_HTML.jpg)\n\
  \n图 6-24\n\n程序 sdm630_tested.py 的输出\n\n用于将数据存储到 SQLite3 数据库的 `insert into` 语句的输出会进入一个名为\
  \ `sdm630data` 的表中。表创建脚本位于文件 `sdm630_db_creation_script.sql` 中，该文件随你从 [www.​pmauthor.​com/​raspbian/​](https://www.pmauthor.com/raspbian/)\
  \ 下载的压缩包一起提供。\n\n## 总结\n\n至此，我们完成了电能表的设置、配置以及将数据获取到数据库系统的全部工作。到目前为止，你已经成功下载了用于设置电能表设备的脚本。你通过使用\
  \ Arduino IDE 中的 Modbus 库为 EM6400 电能表编写了代码。你还通过编写一个简单的“Hello World”程序，学习并实现了 Arduino\
  \ Mega 2560 与 Conzerv EM6400 电能表之间的通信前与通信后操作。然后，你编写了代码，通过其寄存器从电能表获取数据值。之后，你配置了另一款更常见的\
  \ Eastron SDM630 电能表。你将其硬件连接好，然后加载了树莓派与 SDM360 电能表之间进行 Modbus 通信所需的 Python 库。最后，你编写了一个\
  \ Python 程序，用于从电能表获取电压、电流和功率等数据，并将其存储到 SQLite3 数据库中。\n\n接下来，你将研究一些案例，并设计一些有趣的物联网和工业物联网解决方案。\n\
  \n\n\n# 7. 电信行业案例研究：利用物联网解决通话中断问题\n\n本案例研究基于一个虚构的国家、虚构的公司和虚构的场景。然而，通过本案例研究，您将了解到大多数电信公司都面临的、近乎真实的通话中断问题。案例研究将带您了解一家电信运营商的成立过程，为您提供其业务建立的足够背景信息。案例研究为您提供了一个普遍的政治和商业背景，以及相对一致的社会政治利害关系，因此具体是哪个国家并不重要。在本案例研究中纳入政治和商业背景的原因，是为了让身为机器学习工程师的您认识到，基于您构建的预测模型所做出的决策有多么重要，以及这些决策如何对商业乃至整个社会产生重大影响。现在，让我们进入案例研究。\n\
  \n## 电信案例研究概述\n\nRegoniatel 于 2016 年开始运营，是 Regonia 的一家 2G 电信运营商。Regonia 是一个三面环山的国家。\n\
  \n首席执行官是 Kaun Methi John。他还拥有其他业务，例如采矿和炼油，并因此致富。他在这个欧洲小国建立了一个商业帝国。\n\n当 Regonia\
  \ 采用新的 2G 移动电话技术时，政府向有兴趣的企业征集提案。John 明白这是他拓展业务、进入未来将蓬勃发展的电信行业的黄金机会。由于他缺乏在本国建立电信基础设施的技术专长，他积极在全球寻找合作伙伴，以帮助他在这项新事业中取得成功。他找到了\
  \ Samtel，一家总部位于美国的公司，该公司正在与其他公司建立合资企业。\n\n在项目计划和可行性研究完成后，合资伙伴为政府制定了 2G 频谱的提案。他们和其他三家公司一起中标了。他们成功获得了政府合同；然而，在建立电信网络并吸引客户入网方面，将面临激烈的竞争。其他三家公司也是由本地公司与国际电信公司合资成立的。政府认为将合同授予此类合资企业是明智之举，希望借此利用国际经验。\n\
  \n政府对该国的 2G 网络进行了数月的测试，以确定其可行性。一旦内部电信机构成功完成测试，企业就可以开始运营。\n\n该国蓬勃发展的 1 万亿美元经济要求升级通信基础设施。该国的主要产业是农业和采矿业。该国四面环陆，没有海岸线。人们对这个国家得天独厚的金矿和钻石矿非常感兴趣，这些矿产是重要的收入来源。在金矿或钻石矿工作的矿工平均年收入为\
  \ 6,000 美元。工资较高的原因是这些矿山出产一些最好的黄金和钻石。这个国家的钻石在全球范围内都备受追捧和需求。采矿业贡献了 Regonia 近 50% 的\
  \ GDP。\n\n这个国家日益增长的需求需要良好的电信基础设施，为其公民提供强大的通信系统。这个小国能够负担得起世界上最好的基础设施。\n\nRegoniatel\
  \ 在获得频谱合同后的三年内，成功在城市地区建立了良好的基础设施。其竞争对手 Ytel 和 Fretel 也在城市和农村地区建立了移动基站。Sautele 在开发办公基础设施四年后的问题在于，它基本上已成为一家以城市为导向的公司。\n\
  \n政府设立了一个电信监管机构，负责发布所有公司的电信用户互动数据，例如客户投诉和网络故障。\n\n在其 2019 年的报告中，该机构强调所有运营商的通话中断率上升了\
  \ 35%。问题严重到执政党和反对党开始互相指责，称电信监管机构和政府行政部门在包庇电信运营商。总理紧急召见了三家公司的负责人，讨论问题及其可能的解决方案。Sautele\
  \ 收到了关于其通话中断投诉的以下报告，如表 7-1 所示。\n\n\n\n数据显示，RegoniaTel 网络的掉话投诉量上升了 41%。在所有运营商中，其掉话率增幅最大。由总理设立的电信委员会建议，对超过\
  \ 10% 掉话投诉阈值的电信运营商处以 9 亿美元的罚款。这是一笔巨额罚款，如果掉话问题在其网络上持续发生，将给公司带来巨大的经济损失。\n\n面对这一威胁和公众的强烈抗议，RegoniaTel\
  \ 总裁召集其运营团队开会，以了解掉话率飙升背后的关键原因。根据运营经理的建议，需要设立一个试点项目，整合机器学习、物联网等前景广阔且创新的新兴技术，以解决这一技术商业问题。运营经理调来了其最有经验的机器学习工程师以及两位最优秀的数据科学家，共同组成试点团队，以寻找解决方案。\n\
  \n试点团队首次会面，研究了导致掉话的各种技术原因，包括对表 7-1 中给出的不同网络位置阶段的分析。\n\n表 7-1\n\n2018 年 Regonia 电信运营商掉话数据\n\
  \n| 网络名称 | 平均信号强度 (dBM) | 用户数 | 电话普及率 % | 网络停机时间 % | 通话成功率 % | 掉话率 | 掉话投诉量 |\n|\
  \ --- | --- | --- | --- | --- | --- | --- | --- |\n| EtiTel | 92 | 1160000 | 113\
  \ | 0.05 | 98.2 | 0.048 | 55680 |\n| GribaTel | 107 | 1030900 | 96 | 0.87 | 97.4\
  \ | 0.8352 | 861007.68 |\n| RegoniaTel | 89 | 1243080 | 97 | 1.3 | 96.2 | 1.248\
  \ | 1551363.84 |\n\n如您所见，信号强度以 dBm 为单位，这是衡量信号强度的单位。表格显示了用户数、电话普及率百分比、网络停机时间百分比、通话成功率百分比以及掉话率百分比。表格还显示了三家电信运营商各自收到的掉话投诉数量。平均信号强度最好的是\
  \ GribaTel，其次是 EtiTel，最后是 RegoniaTel。用户数量最多的是 RegoniaTel，约为 1240 万。RegoniaTel 的电话普及率为\
  \ 97%，最高的是 EtiTel。RegoniaTel 的网络停机时间最高，为 1.3%。通话成功率最高的是 EtiTel，最低的是 RegoniaTel。RegoniaTel\
  \ 的掉话率为 1.248%，最低的是 EtiTel。RegoniaTel 的掉话投诉量也最高。因此，您可以清楚地看到 RegoniaTel 存在网络停机、平均信号强度低以及掉话率最高的问题。\n\
  \nRegoniaTel 的运营经理报告称，用户数量正在下降，服务客户反馈显示，超过 60% 的用户表示因掉话问题而转投竞争对手的网络。用户数据见表 7-2。\n\
