  ### 打字输入


  打字是一种传统的操作方式。自计算机诞生以来，笔记本电脑和个人电脑一直通过这种方式接收人类的输入。其优势在于许多人熟悉如何在键盘上打字。然而，对于个人电脑和许多笔记本电脑来说，必须使用外接键盘。只要屏幕不被他人看到，在键盘上打字是一项相当私密的活动。就写情书而言，屏幕隐私至关重要。


  至于劣势，打字需要时间和技巧；事实上，要快速准确地打字需要专门的练习。手指在键盘上的正确放置需要练习。无论技巧如何，打字都会让人非常疲劳，并可能导致严重损伤，如腕管综合征。另一个劣势是它并非来自大脑的实时输入；我们大脑与键盘上任何活动之间的延迟，源于将想法转化为拼写每个单词的运动活动，然后向每个手指发出适当打字指令的额外处理过程。这一点如图
  2-2 所示，图中展示了人类打字的过程。


  ### 语音听写


  现在让我们看看语音听写。这是一种将数据输入计算机和其他机器的新方式。与打字相比，其主要优势在于任何会说话的人都能使用这种输入方式。另一个优势是，如今包括个人电脑、笔记本电脑、手机和平板电脑在内的所有设备都内置了麦克风。该技术最大的劣势之一是它并非一项私密活动；任何附近的人都能听到你对机器说的话。这种输入方式的另一个劣势是它耗时；不过与打字相比，它更快，因为大脑无需将每个单词转换为手指动作。这种输入方式最大的劣势是它在嘈杂环境中无法使用；如果有人大声说话，系统可能无法正确识别你的指令。另一个劣势是长时间连续说话会因使用嘴部周围肌肉而导致下巴疲劳。除了隐私问题外，语音打字的另一个困难是口音差异；例如，存在多种不同的英语、非洲、美国及亚洲口音。这就是语音听写程序不太普及的原因。


  未来，技术将迎来爱，这是我对这项技术将如何发展的愿景。它将成为未来的新方式。其最大优势在于，任何会思考的人都能使用这种输入方式。残障人士也能使用这种输入方式。最好的例子是著名科学家斯蒂芬·霍金，他虽有身体残疾，但能通过他的思维与机器沟通。目前的劣势是商用级思维物联网传感器尚待开发。一旦这类物联网传感器开发成功并上市，它们将被集成到每一种设备中。思维
  AI 的关键优势在于它提供了完全的隐私；除了读取你思维的设备外，没有人知道你在想什么。这就是这种输入方式将变得流行的原因；它将成为来自大脑的实时输入。一个朗朗上口的短语将很好地诠释这个概念：“所思即所得”。其优势在于无需任何特殊技能，比如学习敲击键盘。另一个优势是这种输入几乎不需要任何身体活动；只有当你厌倦了自己的想法时，你才会感到疲倦。这种输入最大的优势在于，你的想法与通过思维物联网传感器传递给机器的内容之间几乎没有延迟。也不存在口音问题，因为思维是通用的，没有任何口音，所以无论你说的是非洲英语、亚洲英语还是美国英语都无关紧要。现在你已经了解了未来派的思维
  AI。它将真正彻底改变我们与机器互动的方式，以及机器与我们互动的方式。



  ### 思维人工智能技术


  思维人工智能技术将催生一个独立的网络。“思维网络”将无处不在、无孔不入，因为它将成为一个互联网络，能够在几分钟内读取一个国家民众的公开思维。正如政府正在利用社交媒体一样，“思维网络”也将被利用。这将催生一种新媒体——“思维媒体”。许多新设备需要被发明出来，以满足思维网络和思维媒体的需求。


  对于像吃冰淇淋这样简单的事情，会有专门的站点读取你的思维，然后根据你的情绪和思维模式为你购买冰淇淋。一件可穿戴的思维感应服装会分析穿着者，寻找诸如自杀倾向或强迫思维等模式，并提醒该人及其关联的思维医生。特殊的思维传感器可以安装在惯犯身上，以检测他们的犯罪思维模式，并阻止他们实施犯罪。这真正做到了在犯罪念头从罪犯大脑转化为行动之前就预测到犯罪事件。它还能检测人们的强迫思维模式，并尝试通过在这些思维模式更突出的领域提供指导或咨询课程，来防止有害行为。企业可以通过寻找对某些商品的强迫思维模式，并根据你的强迫需求进行推广，从而利用幸福模式。


  在这样的社会中，思维速度将成为新的货币，物联网传感器将受到监管，尤其是在公共思维领域。一个人将有能力决定并定制物联网设备，哪些思维保持私密，哪些保持公开。


  思维识别将发展起来，通过机器训练来识别一个人的思维模式，从而识别该人。能够打印你思维模式的设备将赋予你这种能力。本部分的第二部分视频还涉及思维到语音的转换，让你能够与他人分享思维，而不是使用电子邮件进行语音通信。这个概念类似于内在声音和外在声音，与私密思维和公开思维的概念相似。


  所有这一切只有在拥有良好的思维物联网传感器、思维发射器和思维接收器的情况下才能实现。知识产权法必须修改，以承认人们的思维为知识产权。思维转文本将被认可为法律文件。在这样的未来社会中，公共喷子会用思维读取器来评估人们的情绪，这将会非常普遍。当然，有些人可能会选择思维干扰器来阻止公共读取器。基于个人思维模式和犯罪倾向的预防措施在这样的社会中将变得司空见惯。在这样的思维时代，你可以根据你的公开思维实时获得优惠；例如，你反复出现的对披萨的思维模式会让你获得与之相关的新促销优惠。将不再有文本或书面文件，而是思维文件在人们的个人思维读取器之间共享。最佳思维将在法庭上被采纳为证据。医生将能够根据思维报告诊断疾病。零售商店可以根据你对某些物品的强迫思维提供折扣。“渴望、思考、购买”产品和“渴望、思考、出售”将成为常态。在这样的社会中，约会意味着与约会对象的个人思维读取器分享你私密的内在声音和所有个人想法。


  它带来的最大变化是，你的思维在法律上不再私密，因为有一台机器在持续读取你脑海中的声音。如果设备不安全，黑客攻击这种设备将成为现实可能。大规模洗脑的可能性将使这项技术备受争议。思维黑客攻击是这项技术在早期阶段将面临的最大问题之一。


  ## 工业物联网


  现在是时候了解工业物联网（IIoT）了。IIoT 扮演着物联网在工业领域的对应角色；它是计算机、设备和物体，可以相互连接并共享车间数据。收集到的数据作为中央服务（如基于云的服务）存在，或驻留在供其自身使用的私有计算机中。IIoT
  在制造业世界中运作。IIoT 允许以更快的速度访问工业数据，并直接在工厂环境中使用连接设备。许多 IIoT 协议，如 Modbus 或 MQTT 协议，允许物联网设备直接与工业设备连接，例如装配线机器、加工机器、锅炉或热交换器等。那么，连接当今已经通过某种自有软件进行监控的工厂机器有什么优势呢？是的，如今制造的任何工业机器都有某种监控和控制系统，其数据可从机器内部获取，因为机器具有有限的存储容量，用于循环操作以维持连续运行。让我们考虑一个作为发电厂一部分的热交换器。它在控制面板内拥有温度细节数据，如热量和压力。然而，如果我们想让单个机器单元更高效、更具生产力，就需要某种操作模式，并且这些数据可以集中到公共或私有云上。你还可以在热交换器上应用一些物联网传感器，以收集其内部未生成的不同数据。因此，在这个简单的例子中，我们看到，如果我们能够从当前孤立运行的机器中收集数据，然后对其应用学习和深度学习以获得优势，那么最大的好处就是降低成本。这可以从图
  2-3 中看出。


  ![../images/484167_1_En_2_Chapter/484167_1_En_2_Fig3_HTML.jpg](img/484167_1_En_2_Fig3_HTML.jpg)


  图 2-3


  IIoT 传感器和工业通信协议如何与机器学习协同工作




  图中展示了一台带有自身控制面板的工业机器。（具体是什么工业加工过程并不重要；我向你展示的是它具有普遍适用性。）这里共有四个主要的物联网系统。第一个是工业机器本身。第二个是它的“你好”。第三个是私有云。第四个是影响工业机器的物联网传感器设备。V
  大陆实际上是物联网系统的核心，它提供了利用私有云或公有云构建的机器学习或深度学习模型背后的真正价值。工业机器无法直接与物联网传感器设备通信，因此它们有一个控制面板，面向机器部件进行监控并生成数据。我们通过使用
  MQTT 协议与设备接口的控制单元来生成机器级别的内部数据访问。这些常见的工业通信协议帮助我们访问私有数据，并将其全部发送到私有云。如果我们要监控温度对工业机器的影响，就必须在工业机器上安装物联网传感器设备。安装物联网传感器设备后，该设备会将数据发送到私有云，并将其集成到集中式数据库中。一旦我们拥有足够的数据，就可以将机器学习或深度学习模型应用于这些数据。现在，由企业来检查机器学习或深度学习模型的结果，并在工业机器上应用效率优化。因此，通过这个例子，你现在应该清楚地了解机器学习或深度学习是如何在工业环境中应用的。工业物联网应用可以包括能源审计、机器效率检查以及提高工厂效率。其应用是无限的。现在，让我们看看市场上一些运行良好的成功工业物联网应用。


  ### 工业物联网的商业用途


  让我们看看市场上一些运行良好的成功物联网应用。专注于这个市场的参与者并不多。尽管如此，我们还是来看看几个在这个领域占据主导地位的公司。一家名为 Corlina
  ([`https://corlina.com/product/`](https://corlina.com/product/)) 的工业物联网厂商，其产品为市场提供边缘设备安全服务，使设备可见并认证其可信度。它为工业物联网设备提供了抵御安全攻击的第一道防线。它拥有一个智能工厂解决方案，允许工厂所有者从工厂内部或远程位置监控和控制工业物联网基础设施，甚至支持车间内数千台设备的运行。


  接下来是大型企业集团通用电气。Predix ([`www.ge.com/digital/lp/predix-industrial-internet-platform-brief`](http://www.ge.com/digital/lp/predix-industrial-internet-platform-brief))
  是一个工业物联网平台，可以将工厂实时产生的工业数据转化为可操作的见解和预测模型。它利用来自边缘设备的数据，帮助工业所有者利用数字孪生和工业人工智能，将这些数字工业数据转化为预测模型。


  施耐德电气提供 Wonderware ([`https://sw.aveva.com/monitor-and-control/industrial-information-management/insight`](https://sw.aveva.com/monitor-and-control/industrial-information-management/insight))，这是一套基于工业物联网的系统和解决方案，用于能源管理和工业自动化。它以快速、安全的方式收集工业数据，提供设备集成，如边缘设备、人机界面过程可视化软件以及工厂的监控和控制解决方案。它还有一个名为“从边缘到企业”的解决方案，该方案利用来自边缘设备的数据，将数据从工厂环境移动到云端，并使用机器学习和人工智能从中提取有意义的业务行动。


  ## 物联网与工业物联网的区别


  到目前为止，你已经详细了解了物联网和工业物联网。你现在了解了这些领域正在发生的商业发展。然而，了解它们之间的区别很重要；这是我在会议和研讨会上经常被问到的一个非常常见的问题。表
  2-5 突出了这些区别。


  表 2-5


  物联网与工业物联网应用的区别


  | 参数 | 物联网 | 工业物联网 | 描述 |

  | --- | --- | --- | --- |

  | 关注点 | 消费者 | 工业 | 物联网主要面向广大消费者，而工业物联网则侧重于工业和工厂环境。 |

  | 准确性与精度 | 低 | 高 | 工业物联网应用的准确性和精度高于物联网应用，因为工业需要具有更高容错能力的系统，因为它们处理的是大型机器。 |

  | 风险影响 | 低 | 高 | 工业物联网系统在航空航天、医疗保健等领域工作，这些领域容错空间非常小，因此与面向消费者的物联网应用相比，其风险影响非常高。 |


  物联网应用关注的是广大消费者，而工业物联网关注的是工业应用。这实际上决定了接下来两个参数的基础：准确性/精度和风险影响。工业级应用的准确性和精度应该更高，因为它们有时会处理危险过程，并影响工厂车间许多人的生命。工业物联网应用的一个错误可能导致公司损失数百万甚至数十亿美元，并危及参与生产过程的人员的生命安全。这就是为什么工业物联网设备使用的传感器比个人物联网应用中使用的传感器具有更高精度水平的原因。工业物联网应用失败的风险影响非常高，因为涉及许多生命以及大量的企业资金和资源。物联网也用于关键流程，如医疗保健，其中生命可能面临危险；然而，它们属于个人性质。尽管如此，每条生命都是重要且有价值的。至此，本章内容结束。接下来，你将看到如何使用
  Python 以及示例代码将机器学习与物联网和工业物联网结合使用。


  ## 总结


  在本章中，你了解了物联网和工业物联网的全部内容。你现在理解了它们在关注点、准确性和风险影响方面实施上的差异。你了解了一些商业物联网应用，例如 C3 AI Appliance、MindSphere（西门子基于云的物联网开放操作系统）和
  Mbed OS（领先的物联网开源实时操作系统）。接着，你了解了人工智能从打字到听写到未来思维人工智能的人类需求转变。你深入研究了工业物联网以及工业通信协议如何协同工作以支持工业应用。你探索了诸如
  Corlina（认证边缘设备）和通用电气 Predix 平台（用于工业物联网设备和解决方案）等公司的工业物联网商业用途。最后，你学习了物联网和工业物联网之间的区别，以理解它们在实际环境中的实施方式。




