    ### Horovod


    Horovod 是一个开源的分布式深度学习训练库，可与 PyTorch 和 TensorFlow/Keras 配合使用。如果你已有非分布式训练的代码，只需添加几行代码即可通过
    Horovod 实现分布式训练。（关于如何在不同的集群上进行分布式部署，请参考相关文档。）与 PyTorch Distributed 类似，Horovod
    能够使用 Gloo、MPI 以及其他后端通信方式。在本节中，我们将探讨需要进行哪些修改，以及这些修改与上一节中 PyTorch 实现的相似之处。


    首先，在 PyTorch 中编写一个简单的单机神经网络训练代码。你可以参考附录 II 的 PyTorch 部分。创建以下函数：


    *   `Network()`：一个继承自 `torch.nn.Module` 的类，用于创建神经网络架构

    *   `train_epoch()`：一个用于在单机上训练神经网络的函数


    同时定义以下全局变量：`batch_size`、`learning_rate`、`momentum` 和 `epochs`。下面的代码展示了如何使用 horovod
    进行分布式模型训练：


    ```

    import horovod.torch as hvd

    from sparkdl import HorovodRunner

    from torch.utils.data.distributed import DistributedSampler

    def train_hvd():

    hvd.init()

    device = torch.device(''cuda'' if torch.cuda.is_available() else ''cpu'')

    if device.type == ''cuda'':

    torch.cuda.set_device(hvd.local_rank())

    transformation = [transforms.ToTensor(),

    transforms.Normalize((0.1307,), (0.3081,))]

    train_dataset = datasets.MNIST(

    root=f''data-{hvd.rank()}'',

    train=True,

    download=True,

    transform=transforms.Compose(transformation)

    )

    train_sampler = DistributedSampler(train_dataset,

    num_replicas=hvd.size(),

    rank=hvd.rank())

    train_loader = torch.utils.data.DataLoader(train_dataset,

    batch_size=int(batch_size/hvd.size()),

    sampler=train_sampler)

    model = Network().to(device)

    optimizer = optim.SGD(model.parameters(),

    lr=learning_rate,

    momentum=momentum)

    optimizer = hvd.DistributedOptimizer(optimizer,

    named_parameters=model.named_parameters())

    hvd.broadcast_parameters(model.state_dict(), root_rank=0)

    for epoch in range(1, epochs + 1):

    train_epoch(train_loader)

    ```


    `train_hvd()` 函数与我们使用 PyTorch Distributed 时的做法非常相似。`hvd.rank()` 用于获取工作节点 ID，因此我们为集群中的每个工作节点（rank）创建一个独立的根文件夹。


    与上一节中使用 `partition_dataset()` 在工作节点间创建和划分数据类似，这里我们使用 `DistributedSampler()` 根据工作节点数量创建数据集的分区，并将该对象传递给
    `Dataloader()` 以生成数据集。同样，有效的批量大小会根据工作节点数量进行缩放。


    定义 `optimizer` 后，我们将其包装在 `hvd.DistributedOptimizer()` 中，这类似于我们之前使用的 `all_reduce()`。梯度会在不同节点上运行的模型之间进行平均。`hvd.broadcast_parameters()`
    使用新的梯度更新所有梯度，确保所有 rank 上的模型都以相同的参数启动。


    现在，为了在集群间进行分布式训练，我们将使用 `HorovodRunner` 提供的简单接口：


    ```

    hr = HorovodRunner(np=2)

    hr.run(train_hvd)

    ```


    这里，`np` 定义了工作节点的数量，`hr.run()` 启动分布式训练。


    当你在成百上千维度的空间中优化超参数时，这些分布式方法会非常有用。在优化超参数时，时间效率和资源利用率都是重要的考量因素。


    在下一章中，你将看到更先进的基于贝叶斯的优化方法，这些方法实际上会从之前的试验中学习。


    脚注 1


    # 4. 贝叶斯优化


    在第 2 章和第 3 章中，我们探讨了几种超参数调优方法。网格搜索和随机搜索非常直接，我们还讨论了如何将它们分布式化以节省内存和时间。我们也深入研究了一些更复杂的算法，例如
    HyperBand。但我们回顾的所有算法都没有从它们的历史记录中学习。假设一个算法可以记录所有之前的观测结果并从中学习。例如，假设它可以观察到我们的模型正在超参数的某些值附近被优化，并且可以利用这个宝贵的信息，继续探索那些接近表现良好的超参数，从而从历史中学习。通过这样做，该算法在达到最佳性能超参数的过程中，就不会在表现不佳的超参数上浪费时间。在本章中，我们将探讨具备这种能力的算法。


    让我们从一个例子开始。图 4-1-1 展示了两个超参数之间的关系图。将其与第 2 章中的图 2-2-1 进行比较，后者表示网格搜索（我们在选定的参数网格中进行遍历）和随机搜索（随机命中一组超参数）。


    ![../images/494613_1_En_4_Chapter/494613_1_En_4_Fig1_HTML.jpg](img/494613_1_En_4_Fig1_HTML.jpg)


    图 4-1-1


    两个超参数之间的关系图，其中颜色较深的区域表示准确率较低，颜色较浅的区域表示准确率较高


    在图 4-1-1 中，标有数字 1 的圆圈是随机选择的超参数。观察到一些位于最深色和最浅色区域之间的中间区域的 1 号点生成了更好的模型。因此，我们不再在其余的
    1 号试验点上浪费时间，而是关注表现更好的 1 号试验点周围的区域，并用 2 号点训练模型，依此类推。最终，我们到达了 4 号点，其中一个 4 号点位于中间区域，另一个几乎位于最浅色区域的中心。因此，我们选择位于最浅色区域的
    4 号试验点作为我们最佳的超参数集。直观地说，这个过程似乎比你之前学过的穷举方法更好。

