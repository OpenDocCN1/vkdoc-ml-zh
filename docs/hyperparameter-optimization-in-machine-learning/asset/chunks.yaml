- fmt: '### Search Space


    `fmin()` passes only one parameter to the objective function, so we need to stuff
    all the hyperparameter ranges in either one of the dictionaries, list or tuples.
    Unlike scikit-learn’s Grid Search and Random Search, `fmin()` does not support
    just any iterable distribution; all the hyperparameters should be objects of Hyperopt’s
    `hp` module. Follow Figure [4-3-2](#494613_1_En_4_Chapter.xhtml#Fig4) for visualization
    of different distributions.


    Following are some of the functions that give a certain value from different types
    of distributions, for our hyperparameter searches:


    ![../images/494613_1_En_4_Chapter/494613_1_En_4_Fig4_HTML.jpg](images/494613_1_En_4_Chapter/494613_1_En_4_Fig4_HTML.jpg)


    Figure 4-3-2


    These graphs are plotted using Hyperopt distributions. Graph (a) shows a uniform
    distribution between -1, 1. Graph (b) shows a loguniform distribution between
    -3, 4. Graph (c) shows a normal distribution with mean 1 and standard deviation
    0.5. Graph (d) shows a lognormal distribution with mean and standard deviation
    both 1.


    - `hp.choice()`: chooses one of the options from the given list

    - `hp.randint()`: Chooses a random integer out of a range of integers

    - `hp.uniform()`: Returns a value between a range, the distribution is uniform
    between two given numbers

    - `hp.loguniform()`: Returns a value such that its logarithm is uniformly distributed
    between two given numbers

    - `hp.normal()`: Returns a value from a Gaussian distribution as per mean and
    standard deviation

    - `hp.lognormal()`: logarithm of the returned value is normally distributed as
    per mean and standard deviation


    **Tip**


    `loguniform(label, a, b)` can be written as `exp(uniform(label, a, b))`, where
    `a` and `b` are the lower and upper limit, respectively. Distribution is between
    `e^a` and `e^b`, but if you want it between `10^a` and `10^b`, you can easily
    manipulate it by doing something like this: `loguniform(label, a * log[e](10),
    b * log[e](10))`.


    We can use these functions to create really complex search spaces. Let''s look
    at an example of creating a search space:


    ```

    from hyperopt import tpe, fmin, hp

    space = hp.choice(''classifier'',[

    {''model'': ''KNeighborsClassifier'',

    ''param'': {''n_neighbors'':

    hp.choice(''n_neighbors'',range(3,11)),

    ''algorithm'':hp.choice(''algorithm'', [''ball_tree'', ''kd_tree'']),

    ''leaf_size'':hp.choice(''leaf_size'', range(1,50)),

    ''metric'':hp.choice(''metric'', ["euclidean", "manhattan",

    "chebyshev", "minkowski"

    ])}

    },

    {''model'': ''SVC'',

    ''param'':{''C'':hp.loguniform(''C'', -2*m.log(10), 11*m.log(10)),

    ''kernel'':hp.choice(''kernel'',[''rbf'', ''poly'', ''sigmoid'']),

    ''degree'':hp.choice(''degree'', range(1,15)),

    ''gamma'':hp.loguniform(''gamma'', -9*m.log(10), 3*m.log(10))}

    }

    ])

    ```


    We start by choosing a classifier for our model using `hp.choice()`, one of KNN
    or SVM would be chosen. Once we choose the classifier, we can create distributions.
    In the preceding example, I chose to use `hp.choice()` for discrete distributions
    and `hp.lognormal()` for `C` and `gamma` in SVM. As mentioned earlier, we can
    manipulate function `hp.loguniform()` to use `10^x` instead of `e^x`.


    **Note**


    We need to provide labels to these `hp` functions. In the preceding code, I used
    the name of the hyperparameter itself to label the distribution.


    Now that we have a search space, we’ll work on the objective function:


    ```

    from sklearn.datasets import load_digits

    from sklearn.model_selection import train_test_split

    from sklearn.neighbors import KNeighborsClassifier

    from sklearn.svm import SVC

    from hyperopt import tpe, fmin, hp

    import math as m

    digits = load_digits()

    X_train, X_test, y_train, y_test = train_test_split(digits.data,

    digits.target,

    test_size=0.3)

    logs = {''args'':list(),

    ''train_score'': list(),

    ''val_score'': list()}

    def objective_func(args):

    clf_func = args["model"]

    params = args["param"]

    clf = eval(clf_func)(**params)

    clf.fit(X_train, y_train)

    val_score = clf.score(X_test, y_test)

    train_score = clf.score(X_train, y_train)

    logs[''args''].append(args)

    logs[''train_score''].append(train_score)

    logs[''val_score''].append(val_score)

    return -val_score

    best = fmin(objective_func, space, algo=tpe.suggest, max_evals=100)

    ```


    Creating the objective function is easy. We extract the hyperparameters and pass
    them to the classifier. However, in this case, since our classifier is also a
    variable, we extract that as well. I have also created a log dictionary to save
    history. Run `fmin()` and the algorithm will start tuning. Refer to Figure [4-3-3](#494613_1_En_4_Chapter.xhtml#Fig5),
    scatter plot of accuracy v/s trials.


    ![../images/494613_1_En_4_Chapter/494613_1_En_4_Fig5_HTML.jpg](images/494613_1_En_4_Chapter/494613_1_En_4_Fig5_HTML.jpg)


    Figure 4-3-3


    Figure [4-3-3](#494613_1_En_4_Chapter.xhtml#Fig5) shows the result of optimizing
    a support vector classifier for hyperparameters `C`, `kernel`, `degree`, and `gamma`
    on the digits dataset. We can see the score saturating at 0.99 after some 30 trials.
    Hence, the model is more certain about where to look to get the best hyperparameters.


    Defining a neural network architecture using a Hyperopt search space can be a
    bit tricky where change in certain hyperparameters like the ‘number of layers’
    change the total number of hyperparameters, because then we’ll have to decide
    the number of nodes in each layer or whether or not layers use methods like batch
    normalization/dropout. So let’s look at another interesting example that shows
    how we can define these kinds of awkward search spaces.'
