  trans: '

    ## 超参数优化的必要性


    在上一节中，我们在公式 1.2.6 中使用了一个正数 𝛼 来控制算法。这个 𝛼 在梯度下降算法中被称为*学习率*。它控制着损失函数达到最小值时的速率。图 1-3-1、1-3-2
    和 1-3-3 展示了如下所述的情况。


    ![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig6_HTML.jpg](img/494613_1_En_1_Fig6_HTML.jpg)


    图 1-3-3


    𝛼 的最优值


    ![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig5_HTML.jpg](img/494613_1_En_1_Fig5_HTML.jpg)


    图 1-3-2


    𝛼 的较大值


    ![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig4_HTML.jpg](img/494613_1_En_1_Fig4_HTML.jpg)


    图 1-3-1


    𝛼 的较小值


    在图 1-3-1 中，𝛼 的值很小；它最终会收敛，但 ΔΘ（即权重的变化）会非常小，以至于需要大量的迭代步数，从而增加了时间。较大的学习率（𝛼）值会导致损失剧烈变化，从而产生过冲并导致发散，如图
    1-3-2 所示。然而，如果我们找到 𝛼 的最优值，就能在更短的时间内收敛且不会过冲，如图 1-3-3 所示。这就是为什么我们需要将 𝛼 调整到其最高效的值，这个优化过程被称为*超参数调优*。


    在更高级的梯度下降算法变体中，我们从较大的步长（即较大的学习率值）开始以节省时间，当接近收敛点时，再减小该值以避免过冲。但此时，减小 𝛼 的因子又成了另一个超参数。所以，现在你明白了调优这些超参数的重要性。


    要调优这些超参数，你必须对算法以及这些超参数如何影响性能有很好的理解。即使你打算使用超参数调优算法（将在后续章节介绍），设定一个好的起点和终点也非常重要。这将为你节省大量时间，并提升算法的性能。


    ## 算法及其超参数


    在本节中，我将讨论一些基本的机器学习算法，以帮助你理解它们的超参数是如何工作的。我将使用 scikit-learn 的约定来讨论这些超参数，但由于它们是通用的，你也可以将它们用于其他实现，甚至是自行实现的算法。我不会深入数学细节，但会提供足够的信息，让你直观地了解它们如何影响算法。在第
    2 章中，我们将看到一组糟糕的超参数如何导致模型性能不佳，而一组好的超参数如何创建出优秀的机器学习模型。


    ### K-近邻算法


    K-近邻（KNN）算法既可用作监督学习算法，也可用作无监督学习算法，并可应用于分类、回归、聚类和异常值检测问题。KNN 假设相似的点在空间上更接近，如图 1-4-1
    所示。


    ![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig7_HTML.jpg](img/494613_1_En_1_Fig7_HTML.jpg)


    图 1-4-1


    一个二维分类数据集在使用 KNN 时显示的决策边界


    K-近邻算法会找到与待预测点最接近的 K 个（最近邻点的数量）已标记样本。这个 K 值可以由用户定义。而最近邻的距离可以通过不同的度量来计算，例如欧几里得距离、曼哈顿距离等。为了找到这些最近邻点，会使用诸如
    kd-tree 和 ball tree 之类的索引算法。下面我们来讨论这些超参数。


    ![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig8_HTML.jpg](img/494613_1_En_1_Fig8_HTML.jpg)


    图 1-4-2


    上方图像 k=3，下方图像 k=15


    *   *K 值（最近邻数量）*：我们设定 K 的值，它是一个正整数，决定了在预测新数据点时，需要考虑的训练数据集中已标记样本的数量。图 1-4-2 展示了增加
    K 值如何使边界变得更平滑。而当 k=3 时，边界则更为严格。


    *   *权重*：我们可以给予最近邻点相同的优先级，也可以根据它们与查询点的距离来决定其权重；距离越远，权重越小。


    *   *索引算法*：索引算法用于映射最近邻点。由于暴力搜索需要计算数据集中所有数据点对之间的距离，因此我们使用基于树的索引算法，如 kd-tree 和 ball
    tree。kd-tree 在笛卡尔坐标轴上划分数据，而 ball tree 在嵌套的超球面上划分数据。当维度较高时，ball tree 比 kd-tree
    更高效。


    *   *距离度量*：需要使用一种度量来计算点之间的距离。它可以是欧几里得距离、曼哈顿距离，或者更高阶的闵可夫斯基距离。

    '
- fmt: "### Support Vector Machine\n\n`Support vector machine (SVM)` is a powerful\
    \ algorithm that finds a hyperdimensional plane that separates distinct classes.\
    \ An example is shown in Figure [1-4-3](#494613_1_En_1_Chapter.xhtml#Fig9), in\
    \ which we have two classes denoted by red and blue colors. The black line dividing\
    \ them is our hyperplane (a line in this case since we are visualizing in two\
    \ dimensions). `SVM` finds the hyperplane such that the margin (the distance between\
    \ the two dotted lines) is maximum.\n\nThe data points lying near dotted lines\
    \ are called `support vectors`. They are highly responsible for the formation\
    \ of the hyperplane. We use the optimization method of Lagrange multipliers to\
    \ find this hyperplane.\n\n![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig9_HTML.jpg](images/494613_1_En_1_Chapter/494613_1_En_1_Fig9_HTML.jpg)\n\
    \nFigure 1-4-3\n\nClasses separated by hyperplane\n\nBut this was a linearly separable\
    \ problem. In real life, datasets are not linearly separable. So let’s take another\
    \ example and see how `SVM` would work on the example shown in Figure [1-4-4](#494613_1_En_1_Chapter.xhtml#Fig10).\n\
    \n![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig10_HTML.jpg](images/494613_1_En_1_Chapter/494613_1_En_1_Fig10_HTML.jpg)\n\
    \nFigure 1-4-4\n\nDataset with two classes, blue and red\n\nFigure [1-4-4](#494613_1_En_1_Chapter.xhtml#Fig10)\
    \ is not linearly separable. So we project it into a higher dimension (three dimensions\
    \ in this case) as shown in Figure [1-4-5](#494613_1_En_1_Chapter.xhtml#Fig11)\
    \ and now we can apply `SVM` and find the plane separating it.\n\n![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig11_HTML.jpg](images/494613_1_En_1_Chapter/494613_1_En_1_Fig11_HTML.jpg)\n\
    \nFigure 1-4-5\n\nData projected into higher dimension and separated by a plane\n\
    \nWe need to find the correct mapping function to project data to higher dimensions.\
    \ That’s where different kernels come into play. Right mapping functions can be\
    \ achieved from using the right kernel functions, which is one of the most crucial\
    \ hyperparameters in `SVMs`.\n\nLet’s now discuss different hyperparameters:\n\
    \n- **Kernel**: As previously described, a kernel helps achieve the right mapping\
    \ function, which is essential for `SVM` to perform efficiently. Finding just\
    \ the kernel reduces the complexity of finding the mapping function; there’s a\
    \ direct mathematical relation between the mapping function and kernel function.\
    \ Figure [1-4-4](#494613_1_En_1_Chapter.xhtml#Fig10) is an example problem that\
    \ can be solved using the radial basis function (`RBF`) kernel. Some of the widely\
    \ used kernels are the polynomial kernel, Gaussian kernel, sigmoid kernel, and\
    \ of course `RBF` kernel, most of them defined in the `scikit-learn` implementation\
    \ of `SVM` (`sklearn` also allows you to define your own kernel).\n\n- **C**:\
    \ `C` is a regularization parameter. It trades off between training accuracy and\
    \ the width of margin. A decrease in `C` results in larger margins and lower training\
    \ accuracy, and vice versa.\n\n- **Gamma**: Gamma (`\U0001D6FE`) defines the influence\
    \ of training points. Higher value of `\U0001D6FE` means lesser influence of training\
    \ point; a very high value will result in influence on training point itself.\
    \ A lower value will influence more; the training points (which are support vectors)\
    \ will influence more of the training set, hence extremely lower values will be\
    \ ineffective in catching the complexity of dataset and the resulting hyperplane\
    \ will be equivalent to a linear hyperplane separating two classes (by their density\
    \ regions).\n\n    This establishes an interesting relation between hyperparameters\
    \ `C` and `Gamma`. Generally, we search values of `Gamma` and `C` on a logarithmic\
    \ grid of `10^(-3)` to `10³`.\n\n- **Degree**: This hyperparameter is used only\
    \ in polynomial kernels; a higher degree means a more flexible decision boundary.\
    \ Degree 1 would result in a linear kernel.\n\n### Decision Tree\n\n`Decision\
    \ tree` is similar to a bunch of `if-else` statements, a simple yet elegant algorithm\
    \ with a very intuitive visualization. It’s really easy to understand what’s going\
    \ inside, unlike neural networks. Moreover, little or no data preprocessing is\
    \ required.\n\nAs the name suggests, it’s a tree, so it starts with a root node,\
    \ which is one of the features. Based on the value of that feature for our data\
    \ point, we select the next node of the tree. This goes on until we reach the\
    \ leaf and thus the prediction value.\n\nCreating this tree is a little bit complicated;\
    \ various different algorithms are used to select which feature goes on the top,\
    \ which goes second, and so on. Some of the algorithms which calculate the importance\
    \ of features are Gini index, information gain, and chi-square. Selecting this\
    \ algorithm can be considered as one of the important hyperparameters in the decision\
    \ tree algorithm.\n\nLet’s take the example of a classical Iris dataset. Here\
    \ the goal is to classify the three species of Iris flowers, Setosa, Versicolor,\
    \ and Virginica, based on four features, sepal length, sepal width, petal length,\
    \ and petal width.\n\nAs I said earlier, visualization of a decision tree is very\
    \ easy; `sklearn` provides a function, `tree.plot_tree()`, where you just have\
    \ to input your trained classifier and it will plot the tree (Figure [1-4-6](#494613_1_En_1_Chapter.xhtml#Fig12)).\n\
    \n![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig12_HTML.jpg](images/494613_1_En_1_Chapter/494613_1_En_1_Fig12_HTML.jpg)\n\
    \nFigure 1-4-6\n\nA decision tree classifier trained on the Iris dataset\n\nAs\
    \ you can see in Figure [1-4-6](#494613_1_En_1_Chapter.xhtml#Fig12), there are\
    \ gini indexes for all the nodes, based on which features are placed in the tree.\
    \ As we move down the tree, the value of gini index decreases. On top of nodes,\
    \ a condition is specified; if it’s true, the data point goes to the right child,\
    \ and if it’s false, the data point goes to left child. The value of samples tells\
    \ us the number of samples lying in the true and false condition of the parent\
    \ node.\n\nOne of the problems we face with decision trees is that when the tree\
    \ grows complex, there is a huge chance the model will overfit over training data.\
    \ Some of the hyperparameters can help in reducing this complexity. To solve this\
    \ problem, we can prune the tree, using hyperparameters such as maximum depth\
    \ of tree and minimum number of samples at the leaf node to help in pruning.\n\
    \nHere are the hyperparameters:\n\n- **Algorithm**: As previously mentioned, this\
    \ algorithm decides the priority of features and hence their order in the tree\
    \ structure.\n\n- **Depth of Tree**: This defines the layer of depth. This can\
    \ certainly affect both structural and time complexity of the tree. We can remove\
    \ unimportant nodes and reduce depth.\n\n- **Minimum Sample Split**: This is an\
    \ integer value that defines the minimum number of samples required to split an\
    \ internal node. In Figure [1-4-6](#494613_1_En_1_Chapter.xhtml#Fig12), if we\
    \ would have chosen 101, the tree would have stopped after the second layer.\n\
    \n- **Minimum Sample Leaf**: This defines the minimum number of samples at the\
    \ leaf. This hyperparameter can help reduce overfitting by reducing the depth\
    \ of the tree."
  raw: "### Support Vector Machine\n\n*Support vector machine (SVM)* is a powerful\
    \ algorithm that finds a hyperdimensional plane that separates distinct classes.\
    \ An example is shown in Figure [1-4-3](#494613_1_En_1_Chapter.xhtml#Fig9), in\
    \ which we have two classes denoted by red and blue colors. The black line dividing\
    \ them is our hyperplane (a line in this case since we are visualizing in two\
    \ dimensions). SVM finds the hyperplane such that the margin (the distance between\
    \ the two dotted lines) is maximum.\n\nThe data points lying near dotted lines\
    \ are called *support vectors*. They are highly responsible for the formation\
    \ of the hyperplane. We use the optimization method of Lagrange multipliers to\
    \ find this hyperplane.\n\n![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig9_HTML.jpg](images/494613_1_En_1_Chapter/494613_1_En_1_Fig9_HTML.jpg)\n\
    \nFigure 1-4-3\n\nClasses separated by hyperplane\n\nBut this was a linearly separable\
    \ problem. In real life, datasets are not linearly separable. So let’s take another\
    \ example and see how SVM would work on the example shown in Figure [1-4-4](#494613_1_En_1_Chapter.xhtml#Fig10).\n\
    \n![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig10_HTML.jpg](images/494613_1_En_1_Chapter/494613_1_En_1_Fig10_HTML.jpg)\n\
    \nFigure 1-4-4\n\nDataset with two classes, blue and red\n\nFigure [1-4-4](#494613_1_En_1_Chapter.xhtml#Fig10)\
    \ is not linearly separable. So we project it into a higher dimension (three dimensions\
    \ in this case) as shown in Figure [1-4-5](#494613_1_En_1_Chapter.xhtml#Fig11)\
    \ and now we can apply SVM and find the plane separating it.\n\n![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig11_HTML.jpg](images/494613_1_En_1_Chapter/494613_1_En_1_Fig11_HTML.jpg)\n\
    \nFigure 1-4-5\n\nData projected into higher dimension and separated by a plane\n\
    \nWe need to find the correct mapping function to project data to higher dimensions.\
    \ That’s where different kernels come into play. Right mapping functions can be\
    \ achieved from using the right kernel functions, which is one of the most crucial\
    \ hyperparameters in SVMs.\n\nLet’s now discuss different hyperparameters:\n\n\
    *   Kernel: As previously described, a kernel helps achieve the right mapping\
    \ function, which is essential for SVM to perform efficiently. Finding just the\
    \ kernel reduces the complexity of finding the mapping function; there’s a direct\
    \ mathematical relation between the mapping function and kernel function. Figure\
    \ [1-4-4](#494613_1_En_1_Chapter.xhtml#Fig10) is an example problem that can be\
    \ solved using the radial basis function (RBF) kernel. Some of the widely used\
    \ kernels are the polynomial kernel, Gaussian kernel, sigmoid kernel, and of course\
    \ RBF kernel, most of them defined in the scikit-learn implementation of SVM (sklearn\
    \ also allows you to define your own kernel).\n\n*   C: C is a regularization\
    \ parameter. It trades off between training accuracy and the width of margin.\
    \ A decrease in C results in larger margins and lower training accuracy, and vice\
    \ versa.\n\n*   Gamma: Gamma (\U0001D6FE) defines the influence of training points.\
    \ Higher value of \U0001D6FE means lesser influence of training point; a very\
    \ high value will result in influence on training point itself. A lower value\
    \ will influence more; the training points (which are support vectors) will influence\
    \ more of the training set, hence extremely lower values will be ineffective in\
    \ catching the complexity of dataset and the resulting hyperplane will be equivalent\
    \ to a linear hyperplane separating two classes (by their density regions).\n\n\
    \    This establishes an interesting relation between hyperparameters C and Gamma.\
    \ Generally, we search values of Gamma and C on a logarithmic grid of 10^(-3)\
    \ to 10³.\n\n*   Degree: This hyperparameter is used only in polynomial kernels;\
    \ a higher degree means a more flexible decision boundary. Degree 1 would result\
    \ in a linear kernel.\n\n### Decision Tree\n\n*Decision tree* is similar to a\
    \ bunch of if-else statements, a simple yet elegant algorithm with a very intuitive\
    \ visualization. It’s really easy to understand what’s going inside, unlike neural\
    \ networks. Moreover, little or no data preprocessing is required.\n\nAs the name\
    \ suggests, it’s a tree, so it starts with a root node, which is one of the features.\
    \ Based on the value of that feature for our data point, we select the next node\
    \ of the tree. This goes on until we reach the leaf and thus the prediction value.\n\
    \nCreating this tree is a little bit complicated; various different algorithms\
    \ are used to select which feature goes on the top, which goes second, and so\
    \ on. Some of the algorithms which calculate the importance of features are Gini\
    \ index, information gain, and chi-square. Selecting this algorithm can be considered\
    \ as one of the important hyperparameters in the decision tree algorithm.\n\n\
    Let’s take the example of a classical Iris dataset. Here the goal is to classify\
    \ the three species of Iris flowers, Setosa, Versicolor, and Virginica, based\
    \ on four features, sepal length, sepal width, petal length, and petal width.\n\
    \nAs I said earlier, visualization of a decision tree is very easy; sklearn provides\
    \ a function, `tree.plot_tree()`, where you just have to input your trained classifier\
    \ and it will plot the tree (Figure [1-4-6](#494613_1_En_1_Chapter.xhtml#Fig12)).\n\
    \n![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig12_HTML.jpg](images/494613_1_En_1_Chapter/494613_1_En_1_Fig12_HTML.jpg)\n\
    \nFigure 1-4-6\n\nA decision tree classifier trained on the Iris dataset\n\nAs\
    \ you can see in Figure [1-4-6](#494613_1_En_1_Chapter.xhtml#Fig12), there are\
    \ gini indexes for all the nodes, based on which features are placed in the tree.\
    \ As we move down the tree, the value of gini index decreases. On top of nodes,\
    \ a condition is specified; if it’s true, the data point goes to the right child,\
    \ and if it’s false, the data point goes to left child. The value of samples tells\
    \ us the number of samples lying in the true and false condition of the parent\
    \ node.\n\nOne of the problems we face with decision trees is that when the tree\
    \ grows complex, there is a huge chance the model will overfit over training data.\
    \ Some of the hyperparameters can help in reducing this complexity. To solve this\
    \ problem, we can prune the tree, using hyperparameters such as maximum depth\
    \ of tree and minimum number of samples at the leaf node to help in pruning.\n\
    \nHere are the hyperparameters:\n\n*   Algorithm: As previously mentioned, this\
    \ algorithm decides the priority of features and hence their order in the tree\
    \ structure.\n\n*   Depth of Tree: This defines the layer of depth. This can certainly\
    \ affect both structural and time complexity of the tree. We can remove unimportant\
    \ nodes and reduce depth.\n\n*   Minimum Sample Split: This is an integer value\
    \ that defines the minimum number of samples required to split an internal node.\
    \ In Figure [1-4-6](#494613_1_En_1_Chapter.xhtml#Fig12), if we would have chosen\
    \ 101, the tree would have stopped after the second layer.\n\n*   Minimum Sample\
    \ Leaf: This defines the minimum number of samples at the leaf. This hyperparameter\
    \ can help reduce overfitting by reducing the depth of the tree."
  trans: "\n### 支持向量机\n\n*支持向量机（SVM）* 是一种强大的算法，它能找到一个将不同类别分开的超平面。图 1-4-3 展示了一个示例，其中有两个类别，分别用红色和蓝色表示。分隔它们的黑色直线就是我们的超平面（由于我们在二维空间中可视化，因此这里是一条直线）。SVM\
    \ 会找到这样一个超平面，使得间隔（两条虚线之间的距离）最大化。\n\n位于虚线附近的数据点被称为*支持向量*。它们对超平面的形成起着至关重要的作用。我们使用拉格朗日乘数法的优化方法来寻找这个超平面。\n\
    \n![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig9_HTML.jpg](img/494613_1_En_1_Fig9_HTML.jpg)\n\
    \n图 1-4-3\n\n被超平面分隔的类别\n\n但这是一个线性可分的问题。在现实生活中，数据集往往不是线性可分的。那么，让我们再举一个例子，看看 SVM\
    \ 在图 1-4-4 所示的示例中会如何工作。\n\n![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig10_HTML.jpg](img/494613_1_En_1_Fig10_HTML.jpg)\n\
    \n图 1-4-4\n\n包含蓝色和红色两个类别的数据集\n\n图 1-4-4 中的数据不是线性可分的。因此，我们将其投影到更高维度（本例中是三维），如图\
    \ 1-4-5 所示，现在我们可以应用 SVM 并找到分隔它的平面。\n\n![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig11_HTML.jpg](img/494613_1_En_1_Fig11_HTML.jpg)\n\
    \n图 1-4-5\n\n数据被投影到更高维度并被一个平面分隔\n\n我们需要找到正确的映射函数来将数据投影到更高维度。这就是不同核函数发挥作用的地方。正确的映射函数可以通过使用正确的核函数来实现，这是\
    \ SVM 中最关键的超参数之一。\n\n现在让我们讨论不同的超参数：\n\n*   核函数：如前所述，核函数有助于实现正确的映射函数，这对于 SVM 高效运行至关重要。找到合适的核函数降低了寻找映射函数的复杂性；映射函数和核函数之间存在直接的数学关系。图\
    \ 1-4-4 是一个可以使用径向基函数（RBF）核解决的示例问题。一些广泛使用的核函数包括多项式核、高斯核、Sigmoid 核，当然还有 RBF 核，其中大部分都在\
    \ scikit-learn 的 SVM 实现中定义（sklearn 也允许你定义自己的核函数）。\n\n*   C：C 是一个正则化参数。它在训练精度和间隔宽度之间进行权衡。C\
    \ 值减小会导致间隔变大和训练精度降低，反之亦然。\n\n*   Gamma：Gamma (\U0001D6FE) 定义了训练点的影响范围。\U0001D6FE\
    \ 值越高，意味着训练点的影响范围越小；非常高的值将导致仅影响训练点本身。较低的值影响范围更大；训练点（即支持向量）将对更多的训练集产生影响，因此极低的值将无法有效捕捉数据集的复杂性，最终得到的超平面将等同于一个根据密度区域分隔两个类别的线性超平面。\n\
    \n    这就在超参数 C 和 Gamma 之间建立了一种有趣的关系。通常，我们在 10^(-3) 到 10³ 的对数网格上搜索 Gamma 和 C 的值。\n\
    \n*   度：此超参数仅用于多项式核；更高的度意味着更灵活的决策边界。度为 1 将产生一个线性核。\n\n### 决策树\n\n*决策树* 类似于一组 if-else\
    \ 语句，是一种简单而优雅的算法，具有非常直观的可视化效果。与神经网络不同，它很容易理解内部发生的事情。此外，它几乎不需要或完全不需要数据预处理。\n\n\
    顾名思义，它是一棵树，因此从一个根节点开始，根节点是其中一个特征。根据数据点在该特征上的值，我们选择树的下一个节点。这个过程一直持续到我们到达叶节点，从而得到预测值。\n\
    \n创建这棵树有点复杂；需要使用各种不同的算法来选择哪个特征放在顶层，哪个放在第二层，等等。一些用于计算特征重要性的算法包括基尼指数、信息增益和卡方检验。选择哪种算法可以被视为决策树算法中重要的超参数之一。\n\
    \n让我们以经典的鸢尾花数据集为例。这里的目标是根据四个特征（花萼长度、花萼宽度、花瓣长度和花瓣宽度）对三种鸢尾花（Setosa、Versicolor 和\
    \ Virginica）进行分类。\n\n正如我之前所说，决策树的可视化非常简单；sklearn 提供了一个函数 `tree.plot_tree()`，你只需输入训练好的分类器，它就会绘制出树（图\
    \ 1-4-6）。\n\n![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig12_HTML.jpg](img/494613_1_En_1_Fig12_HTML.jpg)\n\
    \n图 1-4-6\n\n在鸢尾花数据集上训练的决策树分类器\n\n如图 1-4-6 所示，所有节点都有基尼指数，特征在树中的位置即基于此。随着我们沿着树向下移动，基尼指数的值会减小。在节点的顶部指定了一个条件；如果条件为真，数据点进入右子节点；如果为假，则进入左子节点。样本数（samples）的值告诉我们，在父节点的真和假条件下分别有多少样本。\n\
    \n我们使用决策树时面临的一个问题是，当树变得复杂时，模型有很大几率会过拟合训练数据。一些超参数可以帮助降低这种复杂性。为了解决这个问题，我们可以对树进行剪枝，使用诸如树的最大深度和叶节点的最小样本数等超参数来帮助剪枝。\n\
    \n以下是超参数：\n\n*   算法：如前所述，该算法决定了特征的优先级，从而决定了它们在树结构中的顺序。\n\n*   树的深度：这定义了树的层数深度。它肯定会影响树的结构复杂度和时间复杂度。我们可以移除不重要的节点并减少深度。\n\
    \n*   最小样本分裂数：这是一个整数值，定义了分割内部节点所需的最小样本数。在图 1-4-6 中，如果我们选择 101，那么树将在第二层之后停止生长。\n\
    \n*   最小叶节点样本数：这定义了叶节点上的最小样本数。这个超参数可以通过减少树的深度来帮助减少过拟合。\n"
- fmt: '# Neural Networks


    A basic *neural network* is made of nodes and layers of nodes, and these nodes
    are nothing but the output of the previous layer multiplying with weights (see
    Appendix II for more details). We call weights and biases in this context *parameters*
    (since they are decided by a modeling algorithm based on the dataset) and we call
    the number of nodes, number of layers, and so on *hyperparameters* (since we intervene
    to decide them).


    Defining the architecture of a neural network is one of the most challenging tasks
    faced by deep learning practitioners today. The architecture can’t be discovered
    by brute force because the time complexity of neural networks is very high and
    trying out all the combinations of hyperparameters is not possible. So, creating
    a neural network architecture is more of an art, relying on logic and more advanced
    hyperparameter tuning algorithms.


    A vast number of different hyperparameters are possible in neural networks, so
    we’ll discuss a few of them here:


    - **Number of Layers**: Adding layers increases the depth of the neural network,
    and also the ability to learn more complex features.

    - **Number of Nodes**: The number of nodes varies as per the layers, but the number
    of nodes in the first hidden layer and the last hidden layer must be equal to
    the number of input features and classes to predict, respectively. For the hidden
    layer, by convention we use the number of nodes in exponents of 2, meaning 2,
    4, 8, 16, 32, 64, 128, 256, 512, 1024, and so on. This is because hardware performs
    more efficiently when numbers are stored in powers of two, though there is no
    proof that this is the most optimal way of selecting these kind of hyperparameters.

    - **Batch Size**: If we take out a subsample of the dataset, it should represent
    the properties of the whole dataset. This batch can be used to calculate the gradient
    and update the weights. And we iterate over all the subsamples until we cover
    the whole dataset. The idea is to save memory space. But you need to choose the
    optimal value of the size of the subset, because a lesser batch size would cause
    more fluctuations while reaching the minima, and a greater value can cause memory
    errors.

    - **Activation Function**: Activation functions are used to introduce a nonlinearity
    on each node. Few things we need to make sure while deciding activation functions
    are, they are to be used on thousands and millions of nodes, and back propagation
    uses their derivatives, so both the function and its derivative should be less
    computationally complex. Some of the widely used activations are `ReLU`, `Sigmoid`,
    and `Leaky ReLU`.

    - **Loss Function**: Loss function is chosen on the basis of output, whether it’s
    a binary classification, multi-class classification, regression, and so forth.
    There are also other factors. For example, using `sigmoid` activation on the last
    layer and quadratic loss function can result in learning slow down. So things
    like these are need to be taken care of. And there are internal hyperparameters
    for loss function as well which can be tuned.

    - **Optimizer**: In the “Understanding Hyperparameters” section we discussed an
    optimization method, gradient descent. There are other, more advanced optimization
    methods, like `Adagrad`, `Adam Optimizer`, and so on, and these optimizers also
    contain various hyperparameters that affect the overall optimization.


    There are many more hyperparameters in neural networks, such as batch normalization,
    dropout, and so on. And every few days these variables are increasing with the
    advance in technology.


    This section was intended to give you an idea of what hyperparameters are and
    how they work. As we proceed we’ll be discussing more of these algorithms and
    their hyperparameters while finding their optimal values.


    ## Distribution of Possible Hyperparameter Values


    The value of a hyperparameter can vary based on its functioning. For algorithms
    of the likes of grid search (discussed in Chapter [2](#494613_1_En_2_Chapter.xhtml)),
    we iterate over certain permutations of hyperparameters. But most of the hyperparameter
    optimization algorithms pick variables at random. These random values can belong
    to a certain type of distribution. For example, we saw in the “Neural Networks”
    section that we choose the value for the number of nodes in a layer to be an exponent
    of 2. So, we consider the set {2, 4, 8, 16, 32, 64, 128, 256, 512...} to be a
    distribution.


    **Tip**


    Seeing Theory ([`https://seeing-theory.brown.edu/`](https://seeing-theory.brown.edu/))
    is a great website with interactive visualizations of probability and statistics.
    Check out Chapter [3](#494613_1_En_3_Chapter.xhtml) of this website for visualizations
    of probability distributions.


    The likelihood of a value that a random variable can assume is defined by probabilistic
    distribution. Suppose we have to pick a single random value for a hyperparameter;
    the underlying distribution can be either of the following:


    - Discrete probabilistic distribution

    - Continuous probabilistic distribution


    There are different types of probabilistic distributions for both discrete and
    continuous variables. But before we delve into those types, let’s look at what
    discrete and continuous variables are.


    ### Discrete Variables


    A set of values where each value has some positive finite distance to the next
    value is *discrete distribution*. Discrete variables can be either finite values
    or infinite values depending upon range. Figure [1-5-1](#494613_1_En_1_Chapter.xhtml#Fig13)
    shows both finite discrete and infinite discrete distributions.


    ![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig13_HTML.jpg](images/494613_1_En_1_Chapter/494613_1_En_1_Fig13_HTML.jpg)


    Figure 1-5-1


    Two distributions, (a) finite discrete and (b) infinite discrete


    A finite discrete value lies between two finite real numbers, as shown in Figure
    [1-5-1(a)](#494613_1_En_1_Chapter.xhtml#Fig13), where the value lies in the range
    [−0.4, 1.0] with a difference of 0.2. However, an infinite discrete value can
    go up to infinity, each value still maintaining a finite positive distance to
    the next value and the previous value. In Figure [1-5-1(b)](#494613_1_En_1_Chapter.xhtml#Fig13),
    the value lies between [−0.4, +∞) while the difference is still 0.2.


    Note that the difference does not necessarily have to be same. It can be exponential,
    incremental, and so forth. The example in Figure [1-5-2](#494613_1_En_1_Chapter.xhtml#Fig14)
    shows a uniform distribution.


    ![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig14_HTML.jpg](images/494613_1_En_1_Chapter/494613_1_En_1_Fig14_HTML.jpg)


    Figure 1-5-2


    An example of finite distribution, `f(x) = x + 2` such that `x ∈ [0, 5]` with
    a difference of 1 between each value of `x`


    Recall from the “Support Vector Machine” section that possible values for the
    hyperparameter `kernel` can be `rbf`, `sigmoid`, `linear`, `polynomial`, and so
    on. There would be a finite set of values for `''kernel''`. This can be considered
    an example of a *finite discrete value*. We can write these hyperparameters as
    follows:


    - `rbf` ↔︎ 1

    - `sigmoid` ↔︎ 2

    - `linear` ↔︎ 3

    - and so on


    In the same algorithm we have another hyperparameter, `''degree''`, whose value
    can be any possible integer. This is an example of an *infinite discrete value*.
    However, this does not mean that we are going to search this value from −∞ to
    +∞. The results would saturate on extreme value and it is also not practically
    possible to search in an infinite space. So we’ll use a huge range (huge is relative;
    10 can be huge in some cases, while 10^(100) can be huge in others) to contain
    the distribution.'
