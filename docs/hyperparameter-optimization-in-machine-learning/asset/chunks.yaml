    如果这个示例看起来很眼熟，那是因为我们在第 4 章中处理过相同的问题。Optuna 的用户界面与 Hyperopt 非常相似。我们必须定义一个目标函数，该函数应返回一个分数（损失/准确率），该分数将被最小化/最大化。


    我们实例化 `create_study()` 函数并对其进行优化，而不是使用 `fmin()` 函数。但 Optuna 提供的最佳特性之一是能够动态定义超参数搜索范围。与
    Hyperopt 必须预先定义搜索空间不同，在 Optuna 中，我们在目标函数本身中定义搜索空间（类似于我们在 Hyperas 中所做的）。让我们讨论一下
    Optuna 的一些关键方面。


    ### 搜索空间


    在 Hyperopt 和许多其他算法中，我们使用字典来定义搜索空间。如前所述，在 Optuna 中，我们动态定义搜索空间。正如你在第 4 章中所见，使用 Hyperopt
    和 Hyperas 在神经网络中创建搜索空间很困难。对于依赖于层数的节点数等超参数，Hyperas 会使用 *if*…*else*。如果使用循环，Hyperas
    会为所有层选择相同数量的节点。在 Optuna 中，我们可以在循环中为每个超参数提供唯一的标签。例如：


    ```

    n_layers = trial.suggest_int(''n_layers'', 1, 3)

    layers = []

    in_features = 28 * 28

    for i in range(n_layers):

    out_features = trial.suggest_int(''n_units_{}''.format(i), 4, 128)

    layers.append(Linear(in_features, out_features))

    layers.append(ReLU())

    in_features = out_features

    ```


    Optuna 使处理这个问题变得容易得多。并且 Optuna 提供了与 Hyperopt 相同的分布。以下是一些常用的分布：


    *   *分类分布*：`trial.suggest_categorical()` 用于从列表中选择离散值，这与 Hyperopt 中的 `hp.choice()`
    相同。


    *   *均匀分布*：`trial.suggest_uniform()` 用于在均匀尺度上进行随机分布，类似于 `hp.uniform()`。


    *   *对数均匀分布*：`trial.suggest_loguniform(label, low, high)` 用于对数均匀尺度。然而，在 Hyperopt
    中，`hp.loguniform(label, low, high)` 返回 *exp*(*low*) 和 *exp*(*high*) 之间的分布。在 Optuna
    中，返回的是 *low* 和 *high* 之间的对数均匀分布。


    我们还可以根据需要使用的其他分布。


    ### 底层算法


    除了树结构 Parzen 估计器和随机搜索之外，Optuna 还提供了连续减半和 HyperBand，这是相对于 Hyperopt 的优势。我们已经在第 3
    章中讨论过 HyperBand。以下是使用方法：


    ```

    import optuna

    # define the objective function

    study = optuna.create_study(pruner=optuna.pruners.HyperbandPruner())

    study.optimize(objective, n_trials=20)

    ```

