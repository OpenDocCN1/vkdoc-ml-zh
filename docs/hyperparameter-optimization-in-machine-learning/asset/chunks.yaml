- fmt: '# Random Search


    Grid search eventually finds the near optimal set of hyperparameters, but its
    time and resource consumption is high. Another method, random search, consumes
    less time and resources. It randomly picks hyperparameters, makes a set, and trains
    the model on it. This method may not find the best set, but there are higher chances
    of finding a near best set saving a huge amount of time.


    Unlike grid search, instead of spending a large amount of time on unpromising
    candidates, random search jumps to random hyperparameters, and even though it
    does not learn from its past results, it usually delivers satisfactory results.
    In random search, we define the number of trials, which is the number of sets
    of hyperparameters to be tried.


    Let’s see how random search can be better than grid search by exploring the example
    shown in Figure [2-2-1](#494613_1_En_2_Chapter.xhtml#Fig4).


    ![../images/494613_1_En_2_Chapter/494613_1_En_2_Fig4_HTML.jpg](images/494613_1_En_2_Chapter/494613_1_En_2_Fig4_HTML.jpg)


    Figure 2-2-1


    Comparing grid search (left) to random search (right)


    In both images in Figure [2-2-1](#494613_1_En_2_Chapter.xhtml#Fig4), ‘x’ and ‘y’
    axis represents two hyperparameters and the background represents increasing accuracy
    as the color gets lighter. In the case of grid search, shown on the left, if we
    start searching from the top-left corner, along the grid, our search will take
    a considerable amount of time to reach the higher-accuracy region. In the case
    of random search, shown on the right, because we are randomly searching for hyperparameters,
    we have better chances of reaching higher accuracy earlier than with grid search.
    And as soon as the defined number of trials are over, we’ll select the best set
    of hyperparameters available, hoping it’s at least near the best set.


    The following are two main benefits of using random search over grid search:


    * The number of trials is defined and is independent of the total number of combinations.

    * Since the number of trials is defined, even if the number of noncontributing
    parameters is increased, the time efficiency of the algorithm isn’t affected.


    In random search, since we select hyperparameters randomly out of the search range,
    we can use the `random` library in Python, `random.randint(a, b)` (which gives
    a random integer between integers a and b) for discrete hyperparameters and `random.random()`
    (which gives a random float number between 0 and 1, where 1 is exclusive) for
    continuous or functions from `numpy` or `scipy.stats` which gives different types
    of distributions like uniform, lognormal, exponential, and so forth.


    Alternatively, as shown next, we can create a bigger grid for hyperparameters
    with continuous distribution—like really large, since it won’t increase the number
    of trials (which we are going to define)—enabling the algorithm to choose hyperparameters
    from a bigger sample.


    ```

    import random

    import numpy as np

    def loguniform(low=0, high=1, size=100, base=10):

    # function creates a log uniform distribution with

    # random values.

    return np.power(base, np.random.uniform(low, high, size))

    param_grid = {

    "gamma": loguniform(low=-10, high=4, base=10),

    "C": loguniform(low=-3, high=11, base=10)

    }

    def get_random_hp_set(grid):

    # function chooses a random value for each from grid

    hp_set = dict()

    for key, param in grid.items():

    hp_set[key] = np.random.choice(param)

    return hp_set

    def random_search(clf, grid, n_iterations, X_train, y_train, X_test, y_test):

    # defining function for random search

    logs = list()

    best_hp_set = {

    "best_test_score": 0.0

    }

    for iteration in range(n_iterations):

    log = dict()

    # selecting the set of hyperparameters from function defined

    # for random search.

    hp_set = get_random_hp_set(grid)

    # print(hp_set)

    model = clf(**hp_set)

    model.fit(X_train, y_train)

    train_score = model.score(X_train, y_train)

    test_score = model.score(X_test, y_test)

    log["hp"] = hp_set

    log["train_score"] = train_score

    log["test_score"] = test_score

    if best_hp_set["best_test_score"] < test_score:

    best_hp_set["best_test_score"] = test_score

    best_hp_set["best_hp_set"] = hp_set

    logs.append(log)

    return logs, best_hp_set

    ```


    Now we can call the function:


    ```

    >>> X_train, y_train, X_test, y_test = train_test_split(X, y)

    >>> logs, best = random_search(SVC, param_grid, 20, X_train, y_train, X_test,
    y_test)

    ```


    And hence we would get at least the near best set of hyperparameters from random
    search in lesser iterations.


    Again scikit-learn provides us with a cross-validating function, `RandomizedSearchCV()`.
    Let’s see how it works:


    ```

    >>> from sklearn.model_selection import RandomizedSearchCV

    >>> # just like our function RandomizedSearchCV also has argument ''n_itern''

    >>> clf = RandomizedSearchCV(SVC(), param_grid, n_iter=20, cv=3)

    >>> clf.fit(X_train, y_train)

    >>> clf.best_estimator_

    SVC(C=1000000000.0, break_ties=False, cache_size=200, class_weight=None,

    coef0=0.0, decision_function_shape="ovr", degree=3, gamma=1e-05,

    kernel=''rbf'', max_iter=-1, probability=False, random_state=None,

    shrinking=True, tol=0.001, verbose=False)

    ```


    As shown in Figure [2-2-2](#494613_1_En_2_Chapter.xhtml#Fig5), random search reached
    comparable accuracy in just 20 iterations.


    ![../images/494613_1_En_2_Chapter/494613_1_En_2_Fig5_HTML.jpg](images/494613_1_En_2_Chapter/494613_1_En_2_Fig5_HTML.jpg)


    Figure 2-2-2


    Iteration vs. accuracy plot for random search


    Both `GridSearchCV` and `RandomizedSearchCV` have another useful argument, `scoring`;
    if set to its default value, the machine learning algorithm’s scoring method is
    used, which is usually `''accuracy''`. However, we can provide it with any of
    the scoring methods we find fit for our work, like `''roc_auc''`, `''f1''`, `''precision''`,
    `''recall''`, and so forth.'
