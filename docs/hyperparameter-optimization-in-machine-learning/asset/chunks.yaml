  trans: '

    ## 基于序列模型的全局优化


    值得注意的是，在机器学习中，函数训练和评估的成本高昂且速度缓慢。在本节中，我们将探讨基于序列模型的全局优化（SMBO）来解决超参数优化问题。SMBO 采用贝叶斯优化的方法，该方法用于跟踪先前的评估结果，并基于概率模型选择下一组超参数。


    ![$$ p\left(y|x\right) $$](img/494613_1_En_4_Chapter_TeX_Equa.png)


    我们的目标函数（机器学习算法）记为 *f*，*y* 是通过在超参数集 *x* 上评估 *f* 计算得到的分数。在贝叶斯优化中，本质上包含四个重要方面（在以下步骤列表之后定义）：搜索空间、目标函数、概率回归模型和采集函数。


    整个贝叶斯优化过程可总结为以下步骤：


    1.  构建一个回归模型。

    2.  初始化一些随机的超参数集（在首次试验的情况下，因为我们需要从某处提供初始超参数）。

    3.  在采集函数建议的超参数集上评估模型（如果是首次试验，则从步骤 2 中选择超参数），并计算目标函数上的分数。

    4.  根据新建议的超参数和分数更新代理模型。

    5.  重复步骤 3 和 4，进行指定次数的迭代。


    *搜索空间*（*X*），正如你在第 1 章所学到的，是一个定义好的范围，我们为超参数优化算法提供一个可供选择的范围。根据超参数的不同，范围可以是连续的或离散的。例如，在
    SVM 中选择核函数是一个离散超参数，但 gamma 是从连续分布中选择的。搜索空间可能非常复杂。例如，在神经网络中，选择每个隐藏层的节点数取决于隐藏层的数量。


    *目标函数*（*f*）是一个函数，它在给定的超参数集上训练机器学习模型，其输出是根据采集函数返回的准确率分数或损失分数。在下面的示例中，我们计算准确率分数，如果返回的值需要最小化，我们将通过最小化其负值来最大化准确率分数。


    ```

    X, y = load_data()  # X 和 y 是一些预处理过的数据

    X_train, X_test, y_train, y_test = train_test_split(X, y, test_size = 0.3)

    def objective_function(hyperparameters):

    C = hyperparameters["C"]

    gamma = hyperparameters["gamma"]

    model = SVC(C=C, gamma=gamma)

    model.fit(X_train, y_train)

    score = model.score(X_test, y_test)

    # 因为我们想要最大化分数，所以取其负值

    return -score

    ```


    *概率回归模型*（*p*(*y*| *x*) 或 *M*），也称为代理函数，是利用先前的评估结果构建的，是对目标函数的概率建模。因此，每次迭代都会通过在目标函数上评估超参数来更新代理模型。与目标函数相比，代理函数的*评估成本更低*，并且代理函数决定下一组将由目标函数评估的超参数，从而降低了优化成本。代理函数可以通过不同的方法构建，例如高斯过程（GP）、随机森林或树形结构
    Parzen 估计器（TPE）。以下是这些代理函数如何形成的简要概述：


    *   在高斯过程中，函数 *f* 被假定为高斯分布的一个实现，其预测遵循正态分布。GP 直接对 *p*(*y*| *x*) 进行建模。

    *   在 TPE 中，*p*(*y*| *x*) 是基于 *p*(*x*| *y*) 和 *p*(*y*) 两者进行建模的。我们将在本章后面更详细地讨论
    TPE。


    *采集函数*（*S*）使用代理模型以及先前超参数集上的预测损失分数来选择下一组超参数。有几种采集函数，例如改进概率、期望改进、最小化器的条件熵和基于赌博机的准则。最常用的是期望改进：


    ![$$ {EI}_{y\ast }(x):= {\int}_{-\infty}^{y\ast}\mathit{\max}\left({y}^{\ast }-y,0\right).p\left(y|x\right).
    dy $$](img/494613_1_En_4_Chapter_TeX_Equb.png)


    这里，*EI* 由代理函数和损失分数建模。*y** 是某个阈值，而 *y* = *f* (*x*) 是在建议的超参数集 *x* 上从目标函数获得的分数。*p*(*y*|
    *x*) 是代理模型。上述积分的正值意味着所建议的超参数很有可能产生更好的结果。在建议集 *x* 上，如果 *y* 负向增加，EI 将为正值，从而表明这是一个更好的超参数选择。


    以下是 SMBO 方法工作原理的通用伪代码模板：


    ![../images/494613_1_En_4_Chapter/494613_1_En_4_Figa_HTML.jpg](img/494613_1_En_4_Figa_HTML.jpg)


    在此伪代码中，*f* 是目标函数，*X* 是超参数的搜索空间，*S* 是采集函数，*M* 是回归模型（代理函数）。


    首先，我们用搜索空间中的一些随机样本初始化 *D*；*D* 以 (*x*[i,] *y*[i]) 的形式存储评估历史，其中 *x*[i] 表示后续的超参数集，*y*[i]
    表示损失分数。


    现在，我们针对指定次数的试验 *T* 运行循环。首先，使用历史记录 *D* 更新代理函数。然后，*S* 建议一组超参数 *x*i。*x*i 被发送给 *f*，并计算损失分数。历史记录现在保存在
    *D* 中，将再次用于更新代理函数。


    经过 *T* 次试验后，我们将得到最佳的超参数集。


    你无需自己实现这些方法，因为所有概率回归模型都可以在不同的库中找到实现。例如，Hyperopt^(³) 实现了 TPE，Spearmint^(⁴) 和 MOE^(⁵)
    实现了高斯过程，而 SMAC^(⁶) 实现了基于随机森林的代理函数。


    接下来，我们将详细讨论树形结构 Parzen 估计器以及期望改进采集函数的工作原理。

    '
- fmt: "# Tree-Structured Parzen Estimator\n\nTree-structured Parzen estimator is\
    \ a popular Bayesian optimization approach that uses the expected improvement\
    \ acquisition function^([⁷](#fn7)). In TPE, `p(y|x)` is modeled over `p(x|y)`\
    \ and `p(y)` following Bayes’ theorem, unlike GP where `p(y|x)` is directly modeled.\n\
    \n![$$ p\\left(y|x\\right)=\\frac{\\left(p\\left(x|y\\right)\\ast p(y)\\right)}{p(x)}\
    \ $$](images/494613_1_En_4_Chapter/494613_1_En_4_Chapter_TeX_Equ1.png)\n\n(Equation\
    \ 4.2.1)\n\n`p(x|y)` is represented as:\n\n`p(x|y) = l(x) if y < y*` (Equation\
    \ 4.2.2)\n\nand\n\n`p(x|y) = g(x) if y >= y*` (Equation 4.2.3)\n\nHere, `y*` is\
    \ a quantile that is called *threshold loss score*. `l(x)` and `g(x)` are hyperparameter\
    \ distributions. Hence, on certain sets of hyperparameters (`x[i]`), if predicted\
    \ loss score (`y`) is less than `y*`, it means those sets lie in distribution\
    \ `l(x)`, and if `y` is greater than `y*` then they lie in distribution `g(x)`.\
    \ We can understand this clearly by Figure [4-2-1](#494613_1_En_4_Chapter.xhtml#Fig2).\n\
    \n![../images/494613_1_En_4_Chapter/494613_1_En_4_Fig2_HTML.jpg](images/494613_1_En_4_Chapter/494613_1_En_4_Fig2_HTML.jpg)\n\
    \nFigure 4-2-1\n\nOn hyperparameter `x[i0]` points below `y*` are from distribution\
    \ `l(x)` and points above `y*` are from distribution `g(x)`.\n\nThe value of `y*`\
    \ is chosen such that it is larger than the best observed value of `f(x)`, `y\
    \ < y*`, and therefore we have to find sets of hyperparameters that lie in the\
    \ `l(x)` distribution so that the predicted loss score is less than `y*`.\n\n\
    Let:\n\n`p(y < y*) = γ` (Equation 4.2.4)\n\nand continuous marginal probability\
    \ be:\n\n![$$ p(x)={\\int}_Rp\\left(x|y\\right).p(y). dy $$](images/494613_1_En_4_Chapter/494613_1_En_4_Chapter_TeX_Equ2.png)\n\
    \n(Equation 4.2.5)\n\nNow we optimize EI:\n\n![$$ {EI}_{y\\ast }(x)={\\int}_{-\\\
    infty}^{y^{\\ast }}\\left({y}^{\\ast }-y\\right).p\\left(y|x\\right). dy $$](images/494613_1_En_4_Chapter/494613_1_En_4_Chapter_TeX_IEq1.png)\
    \ = ![$$ {\\int}_{-\\infty}^{y^{\\ast }}\\left({y}^{\\ast }-y\\right)\\frac{p\\\
    left(x|y\\right).p(y)}{p(x)}. dy $$](images/494613_1_En_4_Chapter/494613_1_En_4_Chapter_TeX_IEq2.png)\
    \ (Equation 4.2.6)\n\nEquation 4.2.5 can be written as follows by using Equations\
    \ 4.2.2, 4.2.3, and 4.2.4:\n\n![$$ p(x)={\\int}_Rp\\left(x|y\\right).p(y). dy=\\\
    gamma .l(x)+\\left(1-\\gamma \\right).g(x) $$](images/494613_1_En_4_Chapter/494613_1_En_4_Chapter_TeX_Equ3.png)\n\
    \n(Equation 4.2.7)\n\nNow that denominator term in Eq. 4.2.6 is simplified to\
    \ Equation 4.2.7, which doesn’t depend on `y`. Let’s simplify the numerator:\n\
    \n![$$ {\\int}_{-\\infty}^{y^{\\ast }}\\left({y}^{\\ast }-y\\right).p\\left(x|y\\\
    right).p(y). dy=l(x){\\int}_{-\\infty}^{y^{\\ast }}\\left({y}^{\\ast }-y\\right).p(y).\
    \ dy=\\gamma .{y}^{\\ast }.l(x)-l(x){\\int}_{-\\infty}^{y^{\\ast }}p(y). dy $$](images/494613_1_En_4_Chapter/494613_1_En_4_Chapter_TeX_Equ4.png)\n\
    \n(Equation 4.2.8)\n\nPutting together Equations 4.2.7 and 4.2.8, we get the value\
    \ of expected improvement:\n\n![$$ {EI}_{y\\ast }(x)=\\frac{\\gamma .{y}^{\\ast\
    \ }.l(x)-l(x){\\int}_{-\\infty}^{y^{\\ast }}p(y). dy}{\\gamma .l(x)+\\left(1-\\\
    gamma \\right).g(x)} $$](images/494613_1_En_4_Chapter/494613_1_En_4_Chapter_TeX_Equc.png)\n\
    \nSimplify it further and we get:\n\n![$$ {EI}_{y\\ast }(x)=\\frac{\\ l(x)\\left[\\\
    gamma .{y}^{\\ast }-{\\int}_{-\\infty}^{y^{\\ast }}p(y). dy\\right]}{\\gamma .l(x)+\\\
    left(1-\\gamma \\right).g(x)} $$](images/494613_1_En_4_Chapter/494613_1_En_4_Chapter_TeX_Equd.png)\n\
    \nTherefore:\n\n![$$ {EI}_{y\\ast }(x)\\propto {\\left[\\gamma +\\frac{g(x)}{l(x)}.\\\
    left(1-\\gamma \\right)\\right]}^{-1} $$](images/494613_1_En_4_Chapter/494613_1_En_4_Chapter_TeX_Equ5.png)\n\
    \n(Equation 4.2.9)\n\nEquation 4.2.9 significantly tells us that expected improvement\
    \ is inversely proportional to the ratio `g(x)/l(x)`. This means we would prefer\
    \ our hyperparameters (`x`) to lie in distribution `l(x)` instead of `g(x)` to\
    \ increase the EI.\n\nAnd thus on each iteration, candidates are drawn from `l(x)`\
    \ and return the one with least loss score, hence selecting best hyperparameters.\n\
    \nNow that you have a basic idea of how in the Bayesian method we model surrogate\
    \ functions and acquisition functions, we’ll next look at an open source library\
    \ that implements TPE, Hyperopt.\n\n## Hyperopt\n\nHyperopt is a brilliant open\
    \ source library for distributed asynchronous hyperparameter optimization that\
    \ implements algorithms like random search, TPE, and adaptive TPE. In this section\
    \ we’ll focus on how we can use the Hyperopt library to optimize hyperparameters.\n\
    \nHyperopt handles awkward search spaces, which includes searching over both discrete\
    \ and continuous values. We can use the library to search between algorithms and\
    \ find the best set of hyperparameters for those algorithms. When working on problems\
    \ in deep learning, we deal in hundreds of dimensions, and to exploit the full\
    \ potential of deep networks, we need the hyperparameter setting to be optimal.\
    \ Using grid search or random search would not be an option, because each training\
    \ of the network is quite costly. In such cases, using Bayesian optimization can\
    \ be the best option.\n\nTo use Hyperopt we need a search space and an objective\
    \ function. Let’s take a simple example:\n\n![$$ f\\left(a,b\\right)={a}^2-{b}^2\
    \ $$](images/494613_1_En_4_Chapter/494613_1_En_4_Chapter_TeX_Eque.png)\n\nHere,\
    \ we minimize `f(a, b)` such that `a ∈ [-2, 3]` and `b ∈ [-1, 2]`.\n\nLet’s use\
    \ Hyperopt to optimize this problem:\n\n```python\nfrom hyperopt import tpe, fmin,\
    \ hp\n\ndef objective_func(args):\n    a = args['a']\n    b = args['b']\n    f\
    \ = a**2 - b**2\n    return f\n\nrange_a = hp.uniform('a', -2, 3)\nrange_b = hp.uniform('b',\
    \ -1, 2)\nspace = {'a': range_a,\n         'b': range_b}\n\nbest = fmin(objective_func,\
    \ space, algo=tpe.suggest, max_evals=100)\n```\n\nThe preceding piece of code\
    \ uses TPE to find the best values of `a` and `b` such that `f(a, b)` is minimum.\
    \ We can see that function would be minimum at `a = 0` and `b = 2`, and the minimum\
    \ value would be `f[min] = -4`. Let’s see how Hyperopt in 1000 trials approached\
    \ the problem.\n\nFigure [4-3-1](#494613_1_En_4_Chapter.xhtml#Fig3) shows that\
    \ the values of `a` and `b` are saturating over 0 and 2 respectively, and the\
    \ value of `f` is saturating over -4 in the early trials. This was an easy function\
    \ where optimal values were integers. For more complicated functions where values\
    \ must be picked from a continuous distribution, TPE proves to be efficient.\n\
    \n![../images/494613_1_En_4_Chapter/494613_1_En_4_Fig3_HTML.jpg](images/494613_1_En_4_Chapter/494613_1_En_4_Fig3_HTML.jpg)\n\
    \nFigure 4-3-1\n\nPlotting value of `f`, `a` and `b` over 1000 iterations using\
    \ TPE\n\nAs mentioned earlier, to use Hyperopt we must define an objective function\
    \ and search space. In the previous code, our objective function takes hyperparameters\
    \ as inputs and outputs a score that we want to minimize. To create the search\
    \ space, for each hyperparameter we must use distribution in the form of a Hyperopt\
    \ object. We have a wide variety of options, uniform, normal, loguniform, lognormal,\
    \ and so on, which we’ll discuss in more detail in the next section. Finally,\
    \ we pass both the objective function and search space to the `fmin()` function\
    \ while using the algorithm TPE for optimization. We also decide the number of\
    \ trials, just as we did when using random search. A dictionary is returned that\
    \ give the best trials out of all the iterations."
