    图 1-5-6


    均匀分布的直方图


    #### 高斯分布


    *高斯分布*（或*正态分布*）是自然界中最常见的分布之一。大多数机器学习算法都假设数据集服从高斯分布；也就是说，异常值数量较少，大部分数据集中在簇中。极端值的频率较低，而均值附近的频率较高。


    对于均值为 0、标准差为 1 的分布，您可以在图 1-5-4 中看到一个高斯分布。请注意，在 *x* 轴上，如果您标记出 *μ* − *σ* 和 *μ* + *σ*，如图
    1-5-7 所示，您会发现它覆盖了大约 68% 的面积。类似地，*μ* − 2*σ* 和 *μ* + 2*σ* 覆盖了大约 95% 的面积，而 *μ* − 3*σ*
    和 *μ* + 3*σ* 覆盖了 99.7% 的面积。


    ![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig19_HTML.jpg](img/494613_1_En_1_Fig19_HTML.jpg)


    图 1-5-7


    均值为 0、标准差为 1 的高斯分布


    以下是从高斯数据中采样随机值的代码：


    ```

    from scipy.stats import norm

    import seaborn as sns

    mean = 0

    std_dev = 1

    data = norm.rvs(size=10000,loc=0,scale=1)

    ax = sns.distplot(data,

    bins=100,

    hist_kws={''alpha'':0.8})

    ax.set(xlabel=''Gaussian Distribution '', ylabel="Frequency")

    ```


    图 1-5-8 显示了根据从高斯分布采样的随机值绘制的直方图。


    ![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig20_HTML.jpg](img/494613_1_En_1_Fig20_HTML.jpg)


    图 1-5-8


    高斯分布的直方图


    #### 指数分布


    另一个重要的分布是*指数分布*。顾名思义，值呈指数增长。有一个参数比率 (*λ*) 控制着分布的斜率。


    ```

    from scipy.stats import expon

    import seaborn as sns

    loc = 10

    lambda_inverse = 1

    data = expon.rvs(size=10000,loc=loc,scale=lambda_inverse)

    ax = sns.distplot(data,

    bins=100,

    hist_kws={''alpha'':0.8})

    ax.set(xlabel=''Exponential Distribution'', ylabel="Frequency")

    ```


    图 1-5-9 显示了当从对数正态分布中选择随机值时的直方图，该分布可以使用上述代码绘制。


    ![../images/494613_1_En_1_Chapter/494613_1_En_1_Fig21_HTML.jpg](img/494613_1_En_1_Fig21_HTML.jpg)


    图 1-5-9


    指数分布的直方图


    在后续章节中，随着我们使用更多的分布，我们将会遇到更多。我们将看到哪些超参数适合哪些分布以及原因。现在您已经了解了超参数，在第 2 章中，我们将探讨一些基本的超参数调优方法。


    # 2. 使用 Scikit-Learn 进行超参数优化


    在上一章中，您了解了什么是超参数以及它们如何影响算法的性能。既然您知道了调整超参数的重要性，本章将向您介绍一些简单但功能强大的算法使用方法，这些算法已在 scikit-learn
    库中实现，用于超参数优化。Scikit-learn 是机器学习实践中使用最广泛的开源库之一。它易于使用，并且在预测分析中非常有效。


    ## 更改超参数


    您从第 1 章了解了支持向量机 (SVM) 的工作原理。现在您将看到，在泰坦尼克号数据集（数据集在附录 [I](https://doi.org/10.1007/978-1-4842-6579-6)
    中解释）上，当核函数固定为 RBF 时，更改两个超参数——C（正则化因子）和 gamma（核系数）——如何影响结果。


    图 2-1(a) 显示了 gamma 和 C 之间的比较；热图中较浅的颜色代表更高的准确率。我们看到，当 C 值较高 (10¹¹) 且 gamma 值较低
    (10^-8) 时，我们获得更高的测试准确率；而当 C 值较低 (10⁴) 且 gamma 值相对较高 (10^-3) 时，我们获得相当的准确率。图 2-1(b)
    中的图表显示，随着 gamma 值的增加，在保持 C 恒定为 1 的情况下，训练准确率（蓝线）和测试准确率（橙线）之间的差异在某个点之后持续增大，导致模型过拟合，这证明我们需要通过降低
    C 来正则化模型。


    ![../images/494613_1_En_2_Chapter/494613_1_En_2_Fig1_HTML.png](img/494613_1_En_2_Fig1_HTML.png)


    图 2-1


    (a) gamma 和 C 不同取值的热图。(b) 随着 gamma 增加而变化的准确率

