    *This book is dedicated to my parents and my grandparents.*


    # Foreword 1


    I have to admit that tweaking parameters by hand was something that I really enjoyed
    when I trained my first ML models. I would change a parameter, run my training
    script, and wait to see if the evaluation score improved. One of those guilty
    pleasures.


    But as I spent more time in the ML world, I understood that there are other, more
    impactful areas where I could spend my time. I realized that I could (and should)
    outsource parameter tweaking somewhere.


    I learned about random search and started using it in my projects. At some point,
    I felt I could do better than random search and started reading about more advanced
    hyperparameter optimization algorithms and libraries.


    A lot of articles I found where pretty shallow and basic, but I remember reading
    this deep, hands-on yet easy-to-follow article about Hyperopt, one of the most
    popular HPO libraries. It was written by Tanay Agrawal. That article probably
    still is one of the more valuable articles I’ve ever read on the subject. I mentioned
    it in one of my blog posts and this is how we met.


    When Tanay told me that he was writing a book about hyperparameter optimization,
    without hesitation, I proposed to review it. I am not going to lie, I really wanted
    to read it before anyone else! To my surprise, Tanay agreed and I was able to
    give a few notes here and there.


    This book truly is a deep dive into the theory and practice of hyperparameter
    optimization. I really like how it explains theory deeply but not in an overly
    complex way. The practical examples are centered on the libraries and frameworks
    that are heavily used today, which makes this book current and, most importantly,
    useful.


    I recommend this book to any ML practitioner who wants to go beyond the basics
    and learn the why, how, and what of hyperparameter optimization.


    > Jakub Czakon


    > Senior Data Scientist


    > Neptune.ai


    # Foreword 2


    In this book, Tanay takes you on an interactive journey—in the most literal sense,
    as each line of code can be run in a notebook—of the depths of hyperparameters.
    It helps anyone to quickly get started on tuning and improving their deep learning
    project with any library they choose to use.


    The author mindfully covers the inner workings of hyperparameters in ML models
    in a thorough but accessible fashion, which will allow you to understand and build
    upon them using different libraries. The book also demystifies the blackest of
    the black box: hyperparameter optimization in automated machine learning.


    It’s a friendly guide to a complicated subject, and yet it’s full of cutting-edge
    gems that even advanced practitioners will love.


    > Akruti Acharya


    > Data Scientist


    > Curl HG


    # Introduction


    Choosing the right hyperparameters when building a machine learning model is one
    of the biggest problems faced by data science practitioners. This book is a guide
    to hyperparameter optimization (HPO). It starts from the very basic definition
    of *hyperparameter* and takes you all the way to building your own AutoML script
    using advance HPO techniques. This book is intended for both students and data
    science professionals.


    The book consists of five chapters. Chapter [1](#494613_1_En_1_Chapter.xhtml)
    helps you to build an understanding of how hyperparameters affect the overall
    process of model building. It teaches the importance of HPO. Chapter [2](#494613_1_En_2_Chapter.xhtml)
    introduces basic and easy-to-implement HPO methods. Chapter [3](#494613_1_En_3_Chapter.xhtml)
    takes you through various techniques to tackle time and memory constraints. Chapters
    [4](#494613_1_En_4_Chapter.xhtml) and [5](#494613_1_En_5_Chapter.xhtml) discuss
    Bayesian optimization, related libraries, and AutoML.


    The intent of this book is for readers to gain an understanding of the HPO concepts
    in an intuitive as well as practical manner, with code implementation provided
    for each section. I hope you enjoy it.


    # Acknowledgments


    I would like to thank Kailash Ahirwar (CTO, MateLabs) for being a great mentor.
    A big thanks to teams from both MateLabs and Curl HG for their constant support.
    I am grateful to Akruti Acharya and Jakub Czakon for their insightful inputs while
    writing this book. I would also like to thank Paankhi Agrawal, Sahil Sharma, Dr.
    H.-Y. Amanieu, Anubhav Kesari, Abhishek Kumar, Amog Chandrashekar, and others.
    This book wouldn’t have been possible without all the love and encouragement from
    my family.


    # About the Author About the Technical Reviewer


    # 1. Introduction to Hyperparameters


    Artificial intelligence (AI) is suddenly everywhere, transforming everything from
    business analytics, the healthcare sector, and the automobile industry to various
    platforms that you may enjoy in your day-to-day life, such as social media, gaming,
    and the wide spectrum of the entertainment industry. Planning to watch a movie
    on a video-streaming app but can’t decide which movie to watch? With the assistance
    of AI, you might end up watching one of the recommendations that are based on
    your past movie selections.


    Machine learning is a subset of AI that involves algorithms learning from previous
    experiences. In some cases, machine learning has achieved human-level accuracy.
    For example, state-of-the-art deep neural networks (DNNs) perform as well as humans
    in certain tasks, such as image classification, object detection, and so forth,
    although this is not the same as simulating human intelligence (but it’s a step).


    In machine learning algorithms, tuning hyperparameters is one of the important
    aspects in building efficient models. In this chapter you’ll discover the meaning
    of the term *hyperparameter* and learn how hyperparameters affect the overall
    process of building machine learning models.'
