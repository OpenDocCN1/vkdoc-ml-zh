    # 5. Optuna and AutoML


    We can now create an efficient model using the techniques that were discussed
    in the previous chapters. Bayesian optimization goes a long way in finding optimal
    hyperparameters. This chapter provides an overview of the `Optuna` framework and
    discusses further the role of hyperparameter optimization in automated machine
    learning. We’ll use `Optuna` to create our own little AutoML script. And then
    we’ll explore the Tree-based Pipeline Optimization Tool (`TPOT`), an AutoML tool
    that uses genetic programming to optimize machine learning pipelines.


    ## Optuna


    Like `Hyperopt` discussed in Chapter [4](#494613_1_En_4_Chapter.xhtml), `Optuna`^([^(11)](#fn11))
    is open source library that uses Bayesian optimization. The underlying algorithms
    `Optuna` uses are the same as in `Hyperopt`, but the `Optuna` framework is much
    more flexible. `Optuna` can be easily used with `PyTorch`, `Keras`, `scikit-learn`,
    `Apache MXNet`, and other libraries. The API is very similar to `Hyperopt`’s API,
    with a few changes. Let’s dive into an example:


    ```

    from sklearn.datasets import load_digits

    from sklearn.model_selection import train_test_split, cross_val_score

    from sklearn.neighbors import KNeighborsClassifier

    from sklearn.svm import SVC

    import optuna

    from optuna.samplers import TPESampler

    digits = load_digits()

    X_train, X_test, y_train, y_test = train_test_split(digits.data,

    digits.target,

    test_size=0.3)

    def objective_func(trial):

    classifier_name = trial.suggest_categorical("classifier",

    ["SVC", "RandomForest"])

    if classifier_name == "SVC":

    c = trial.suggest_loguniform("svc_c", 1e-2, 1e+11)

    gamma = trial.suggest_loguniform("svc_gamma", 1e-9, 1e+3)

    kernel = trial.suggest_categorical("svc_kernel",

    [''rbf'',''poly'',''rbf'',''sigmoid''])

    degree = trial.suggest_categorical("svc_degree", range(1,15))

    clf = SVC(C=c, gamma=gamma, kernel=kernel, degree=degree)

    else:

    algorithm = trial.suggest_categorical("algorithm",

    [''ball_tree'', "kd_tree"])

    leaf_size = trial.suggest_categorical("leaf_size",

    range(1,50))

    metric = trial.suggest_categorical("metric",

    ["euclidean","manhattan",

    "chebyshev","minkowski"])

    clf = KNeighborsClassifier(algorithm=algorithm,

    leaf_size=leaf_size,

    metric=metric)

    clf.fit(X_train, y_train)

    val_acc = clf.score(X_test, y_test)

    return val_acc

    study = optuna.create_study(direction=''maximize'', sampler=TPESampler())

    study.optimize(objective_func, n_trials=100)

    best_trial = study.best_trial.value

    print(f"Best trial  accuracy: {best_trial}")

    print("parameters for best trail are :")

    for key, value in study.best_trial.params.items():

    print(f"{key}: {value}")

    ```


    In Figure [5-1-1](#494613_1_En_5_Chapter.xhtml#Fig1), we can see the graph saturated
    around 1. Note that here the objective value is the validation accuracy.


    ![../images/494613_1_En_5_Chapter/494613_1_En_5_Fig1_HTML.jpg](images/494613_1_En_5_Chapter/494613_1_En_5_Fig1_HTML.jpg)


    Figure 5-1-1


    Plot showing the accuracy vs. trial on the first 50 trials of preceding code example


    If this example looks familiar, the reason is that we worked on the same problem
    in Chapter [4](#494613_1_En_4_Chapter.xhtml). The user interface of `Optuna` is
    quite similar to that of `Hyperopt`. We have to define an objective function that
    should return a score (loss/accuracy) which would be minimized/maximized.


    In place of the `fmin()` function, we instantiate the `create_study()` function
    and optimize it. But one of the best features provided by `Optuna` is the capability
    to define the hyperparameter search range on the fly. Unlike `Hyperopt`, where
    we have to predefine the search space, in `Optuna` we define the search space
    in the objective function itself (something like what we did in `Hyperas`). Let’s
    discuss some key aspects of `Optuna`.


    ### Search Space


    In `Hyperopt` and many other algorithms, we define search space using a dictionary.
    As mentioned, in `Optuna`, we define the search space on the fly. As you saw in
    Chapter [4](#494613_1_En_4_Chapter.xhtml), creating search spaces in neural networks
    is difficult with `Hyperopt` and `Hyperas`. In hyperparameters such as number
    of nodes that are dependent on the number of layers, `Hyperas` would use `if`…`else`.
    If a loop was used, `Hyperas` would choose the same number of nodes for all the
    layers. In `Optuna` we can provide the unique labels to each hyperparameter in
    a loop. For example:


    ```

    n_layers = trial.suggest_int(''n_layers'', 1, 3)

    layers = []

    in_features = 28 * 28

    for i in range(n_layers):

    out_features = trial.suggest_int(''n_units_{}''.format(i), 4, 128)

    layers.append(Linear(in_features, out_features))

    layers.append(ReLU())

    in_features = out_features

    ```


    `Optuna` makes it so much easier to deal with this problem. And `Optuna` provides
    the same distributions as `Hyperopt`. The following are some of the commonly used
    distributions:


    *   *Categorical distribution*: `trial.suggest_categorical()` is used for selecting
    discrete values from a list, which is the same as `hp.choice()` in `Hyperopt`.


    *   *Uniform distribution*: `trial.suggest_uniform()` is used for a random distribution
    on a uniform scale, which is similar to `hp.uniform()`.


    *   *LogUniform Distribution*: `trial.suggest_loguniform(label, low, high)` is
    used for a loguniform scale. However, in `Hyperopt` `hp.loguniform(label, low,
    high)` returns a distribution between `exp(low)` and `exp(high)`. In `Optuna`,
    a loguniform distribution between `low` and `high` is returned.


    And there are more distributions we can use as per our need.


    ### Underlying Algorithms


    In addition to tree-structured Parzen estimator and random search, `Optuna` provides
    successive halving and `HyperBand`, which is an advantage over `Hyperopt`. We
    have already discussed `HyperBand` in Chapter [3](#494613_1_En_3_Chapter.xhtml).
    Here’s how we can use it:


    ```

    import optuna

    # define the objective function

    study = optuna.create_study(pruner=optuna.pruners.HyperbandPruner())

    study.optimize(objective, n_trials=20)

    ```'
  raw: 'For instance, if there are three layers, the same hyperparameter will be chosen
    for all three because Hyperas makes a template of the Python code and sends the
    distributions to Hyperopt, which will consider it to be one hyperparameter, since
    it’s written once. You have two alternatives to work around this problem: either
    you can go back and use Hyperopt as we did in last example in the “Search Space”
    section, or you can use *if*…*else* statement to add layers:


    ```

