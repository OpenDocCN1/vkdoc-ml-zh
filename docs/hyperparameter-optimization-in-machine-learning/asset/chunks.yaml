- fmt: '### Horovod


    `Horovod` is an open source distributed deep learning training library that works
    with both `PyTorch` and `TensorFlow/Keras`. If you have code for undistributed
    training, you can use `Horovod` simply by adding only a few lines of code to make
    it distributed. (Refer to the documentation on how to distribute on different
    clusters.) Similar to `PyTorch Distributed`, `Horovod` is capable of using both
    `Gloo` and `MPI` and other back-end communications. In this section we’ll examine
    what changes we need to make and how they are similar to the `PyTorch` implementation
    in the previous section.


    Write a simple code for training a neural network in a simple machine in `PyTorch`.
    For this you can refer to the `PyTorch` section of Appendix II. Create the following
    functions:


    *   `Network()`: A class extended from `torch.nn.Module` to create a neural network
    architecture

    *   `train_epoch()`: A function that can train the neural network for a single
    machine


    Also define these global variables: `batch_size`, `learning_rate`, `momentum`,
    and `epochs`. The following piece of code shows how we can distribute model training
    using `horovod`:


    ```

    import horovod.torch as hvd

    from sparkdl import HorovodRunner

    from torch.utils.data.distributed import DistributedSampler

    def train_hvd():

    hvd.init()

    device = torch.device(''cuda'' if torch.cuda.is_available() else ''cpu'')

    if device.type == ''cuda'':

    torch.cuda.set_device(hvd.local_rank())

    transformation = [transforms.ToTensor(),

    transforms.Normalize((0.1307,), (0.3081,))]

    train_dataset = datasets.MNIST(

    root=f''data-{hvd.rank()}'',

    train=True,

    download=True,

    transform=transforms.Compose(transformation)

    )

    train_sampler = DistributedSampler(train_dataset,

    num_replicas=hvd.size(),

    rank=hvd.rank())

    train_loader = torch.utils.data.DataLoader(train_dataset,

    batch_size=int(batch_size/hvd.size()),

    sampler=train_sampler)

    model = Network().to(device)

    optimizer = optim.SGD(model.parameters(),

    lr=learning_rate,

    momentum=momentum)

    optimizer = hvd.DistributedOptimizer(optimizer,

    named_parameters=model.named_parameters())

    hvd.broadcast_parameters(model.state_dict(), root_rank=0)

    for epoch in range(1, epochs + 1):

    train_epoch(train_loader)

    ```


    The function `train_hvd()` is pretty much similar to what we did while using `PyTorch
    Distributed`. `hvd.rank()` gives the worker ID, so we create a separate root folder
    for every worker (rank) in our cluster.


    Similar to the previous section in which we used `partition_dataset()` to create
    and divide data among workers, here we use `DistributedSampler()` to create partitions
    of the dataset as per the number of workers and give the object to `Dataloader()`
    to generate the dataset. Again, effective batch size is scaled based on number
    of workers.


    After defining `optimizer`, we wrap it in `hvd.DistributedOptimizer()`, which
    is similar to `all_reduce()` that we used earlier. The gradients are averaged
    across models running on different nodes. `hvc.broadcast_parameters()` updates
    all the gradients with new gradients. It makes sure models on all ranks start
    with the same parameters.


    Now to distribute this training across clusters, we’ll use a simple interface
    provided by `HorovodRunner`:


    ```

    hr = HorovodRunner(np=2)

    hr.run(train_hvd)

    ```


    Here, `np` defines the number of workers and `hr.run()` starts the distributed
    training.


    These distribution methodologies can come in handy when you are working on optimizing
    hyperparameters in hundreds to thousands of dimensions. Time efficiency and resource
    utilization are both important aspects while optimizing hyperparameters.


    In the next chapter, you’ll see more advanced Bayesian-based optimization methods,
    which actually learn from their previous trials.


    Footnotes [1](#494613_1_En_3_Chapter.xhtml#Fn1_source)


    # 4. Bayesian Optimization


    In Chapters [2](#494613_1_En_2_Chapter.xhtml) and [3](#494613_1_En_3_Chapter.xhtml)
    we explored several hyperparameter tuning methods. Grid search and random search
    were quite straightforward, and we discussed how to distribute them to save memory
    and time. We also delved into some more-complex algorithms, such as `HyperBand`.
    But none of the algorithms that we reviewed learned from their previous history.
    Suppose an algorithm could keep a log of all the previous observations and learn
    from them. For example, suppose it could observe that our model is being optimized
    near certain values of hyperparameters and could exploit this valuable information
    and proceed to the hyperparameters nearest to those good-performing ones, hence
    learning from its history. By doing so, the algorithm would not waste time on
    bad-performing hyperparameters while reaching the best-performing hyperparameters.
    In this chapter we’ll explore algorithms that have that capability.


    Let’s start with an example. Figure [4-1-1](#494613_1_En_4_Chapter.xhtml#Fig1)
    shows a plot between two hyperparameters. Compare that to Figure [2-2-1](#494613_1_En_2_Chapter.xhtml#Fig2)
    in Chapter [2](#494613_1_En_2_Chapter.xhtml), which represents a grid search in
    which we were going through a grid of selected parameters and, in a random search,
    randomly hitting a set of hyperparameters.


    ![../images/494613_1_En_4_Chapter/494613_1_En_4_Fig1_HTML.jpg](images/494613_1_En_4_Chapter/494613_1_En_4_Fig1_HTML.jpg)


    Figure 4-1-1


    Plot between two hyperparameters, where darker area represents lesser accuracy
    and lighter area represents greater accuracy


    In Figure [4-1-1](#494613_1_En_4_Chapter.xhtml#Fig1), the circles with number
    1 are the hyperparameters chosen at random. Some of the 1s lying in the middle
    region between the darkest and lightest regions were observed to generate better
    models. So, instead of wasting our time on the rest of the 1 trials, we look at
    surrounding regions of better-performing 1 trials and train the model with 2s,
    and so on. In the end, we reach 4, where one of the 4s lies in the middle region
    and one lies almost at the center of the lightest region. Hence, we select the
    4 trial lying in the lightest region as our best set of hyperparameters. Intuitively,
    this process seems better than the exhaustive methods you learned before.'
