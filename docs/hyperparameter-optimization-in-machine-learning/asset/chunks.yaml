    from hyperopt.mongoexp import MongoTrials

    def objective_func(args):

    a = args[''a'']

    b = args[''b'']

    f = a**2 - b**2

    return f

    range_a = hp.uniform(''a'', -2, 3)

    range_b = hp.uniform(''b'', -1, 2)

    space = {''a'': range_a,

    ''b'': range_b}

    m_trials = MongoTrials("mongo://localhost:27017/foo_db/jobs", exp_key="exp2")

    best = fmin(objective_func, space, algo=tpe.suggest, trials=m_trials, max_evals=1000)

    ```


    In the preceding code we used `MongoTrials()`. The first step is to start a MongoDB
    server:


    ```

    $ mongod --dbpath . --port 27017

    ```


    By default, the port is 27017, but you can change it according to your need.


    Now execute the previous Python script. In `MongoTrials()` we need to define the
    port and an `exp_key`, which you’ll need to change in different runs if you are
    using the same database.


    When you execute the script, it’ll wait for mongo workers to start, which you
    can start with this command:


    ```

    $ hyperopt-mongo-worker --mongo=localhost:1234/foo_db --poll-interval=0.1

    ```


    As previously mentioned, `hyperopt-mongo-worker` is a file stored in your `$PATH`
    (i.e., bin of the Python environment you are using). Here you need to give the
    `<host> <port> / <db-name>` and the poll interval checks work between every defined
    interval; if a job is found it’ll start the computation.


    As soon as you start the mongo workers, the sets of hyperparameters suggested
    by previous EI will be passed to the objective function and the process will start.


    Note that worker is being executed in `$PATH`, and worker needs an objective function,
    so the Python script where the objective function is defined must be exported
    to `$PATH`.


    And now you will get the asynchronous updates instead of serial ones. Alternatively,
    you can use Apache Spark for parallelization.


    Hyperopt is designed to accommodate other surrogate functions like Gaussian process
    and random forest regression, but they are not implemented yet. But since Hyperopt
    is an open source library, I believe authors would certainly welcome these implementations.
    So go ahead and contribute to this amazing library for the greater good of the
