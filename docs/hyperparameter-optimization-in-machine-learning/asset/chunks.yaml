    we get more test accuracy, and with lower values of `C` (10^4) and relatively
    higher values of `gamma` (10^-3), we get comparative accuracy. The graph in Figure
    [2-1(b)](#494613_1_En_2_Chapter.xhtml#Fig1) shows that as the value of `gamma`
    increases, keeping the `C` constant at 1, the difference between train accuracy
    (blue line) and test accuracy (orange line) after a certain point keeps on increasing,
    resulting in overfitting of the model, which proves that we need to regularize
    the model by decreasing `C`.


