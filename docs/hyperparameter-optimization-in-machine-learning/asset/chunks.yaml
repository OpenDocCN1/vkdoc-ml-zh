- fmt: "# Grid Search\n\nPerhaps the most brute-force approach for finding the most\
    \ optimized set of hyperparameters is to train the dataset on each possible set.\
    \ This approach, called *grid search*, is the most certain way of finding the\
    \ best set of hyperparameters, but it also has its disadvantages. Figure [2-1-1](#494613_1_En_2_Chapter.xhtml#Fig2)\
    \ depicts a grid going through all possible combinations of parameters 1 and 2.\n\
    \n![../images/494613_1_En_2_Chapter/494613_1_En_2_Fig2_HTML.jpg](images/494613_1_En_2_Chapter/494613_1_En_2_Fig2_HTML.jpg)\n\
    \nFigure 2-1-1\n\nA grid search going through each possible combination of two\
    \ hyperparameters\n\nSuppose you have ten algorithms with five hyperparameters\
    \ each, with four possible values for each hyperparameter, and a huge dataset\
    \ that takes 1 minute to train on one algorithm on one set of hyperparameters.\
    \ This scenario would take around a week to discover your best hyperparameter.\
    \ But for less number of hyperparameters and smaller training time we can go with\
    \ grid search. Now we’ll build this simple algorithm in Python and test it on\
    \ the example shown in Figure [2-1-1](#494613_1_En_2_Chapter.xhtml#Fig2).\n\n\
    The value of a hyperparameter can vary on either a continuous distribution or\
    \ a discrete distribution. If the value is discrete, there is a finite number\
    \ of possible values in a range. However, in a continuous distribution, there\
    \ are infinite possible values, as we saw in Chapter [1](#494613_1_En_1_Chapter.xhtml).\
    \ Next we’ll be tuning `C` and `gamma`, both of which have a continuous distribution\
    \ between a range. But to make a grid, we’ll make an even distribution on a log\
    \ scale. Grid search does not take random variables; to make a grid, it needs\
    \ specific values.\n\nLet’s make a grid of hyperparameters `C` and `gamma`:\n\n\
    ```\nc = 0.001\ngamma = 1e-10\nparam_grid = {\n\"C\": [c*(10**i) for i in range(1,14)],\n\
    \"gamma\": [gamma*(10**i) for i in range(1,14)]\n}\n```\n\nNote\n\nI have used\
    \ a preprocessed dataset (`X_train`, `y_train`, `X_test`, `y_test`), the Titanic\
    \ dataset. Refer to Appendix I to view all the preprocessing methods.\n\nWe’ll\
    \ first make a function to break this grid into a list of all possible sets of\
    \ hyperparameters, `make_sets()`:\n\n```\nfrom itertools import product\ndef make_sets(grid):\n\
    \    sets = list()\n    all_hps_vals = [lst for lst in param_grid.values()]\n\
    \    hp_keys = [hp for hp in param_grid.keys()]\n    val_sets = product(*all_hps_vals)\n\
    \    for val in val_sets:\n        hp_set = dict()\n        for idx, hp_key in\
    \ enumerate(hp_keys):\n            hp_set[hp_key] = val[idx]\n        sets.append(hp_set)\n\
    \    return sets\n>>> make_sets(param_grid)\n[{'C':0.01, 'gamma':1e-09},\n {'C':0.01,\
    \ 'gamma':1e-08},\n {'C':0.01, 'gamma':1e-07},\n ...\n ...\n {'C':10000000000.0,\
    \ 'gamma':1000.0}\n]\n```\n\nNow we’ll make another function, `grid_search()`,\
    \ to fit all the sets on the machine learning algorithm:\n\n```\ndef grid_search(clf,\
    \ grid, X_train, y_train, X_test, y_test):\n    all_sets = make_sets(grid)\n \
    \   logs = list()\n    best_hp_set = {\n        \"best_test_score\": 0.0\n   \
    \ }\n    for hp_set in all_sets:\n        log = dict()\n        model = clf(**hp_set)\n\
    \        model.fit(X_train, y_train)\n        train_score = model.score(X_train,\
    \ y_train)\n        test_score = model.score(X_test, y_test)\n        log[\"hp\"\
    ] = hp_set\n        log[\"train_score\"] = train_score\n        log[\"test_score\"\
    ] = test_score\n        if best_hp_set[\"best_test_score\"] < test_score:\n  \
    \          best_hp_set[\"best_test_score\"] = test_score\n            best_hp_set[\"\
    best_hp\"] = hp_set\n        logs.append(log)\n    return logs, best_hp_set\n\
    ```\n\nNow we’ll call the `grid_search()` function:\n\n```\n>>> from sklearn.model_selection\
    \ import train_test_split\n>>> from sklearn.svm import SVC\n# train test split\
    \ dataset.\n# X and y are the pre-processed features and labels respectively.\n\
    >>> X_train, y_train, X_test, y_test = train_test_split(X, y)\n>>> logs, best\
    \ = grid_search(SVC, param_grid, X_train, y_train, X_test, y_test)\n```\n\nThe\
    \ `grid_search()` function that we just defined takes the following inputs: classifier,\
    \ `parameter_grid`, and dataset. From the `make_sets()` function, `grid_search()`\
    \ creates all combinations of hyperparameters and trains the model on all of them.\
    \ Then we save the train and test scores in a dictionary and search for best results.\n\
    \nNote that for the sake of simplicity of code, I did not *cross-validate* while\
    \ training. To actually evaluate each set of hyperparameters, we must use a validation\
    \ set and save the test set for later, so that we can evaluate the model on an\
    \ independent set. However, instead of splitting the training set into training\
    \ and validation sets (since in datasets like Titanic, we have only around 700\
    \ datapoints), we cross-validate, saving the precious training data unaltered.\
    \ Cross-validation also prevents overfitting on the validation set.\n\nWe’ll now\
    \ see how to use the `GridSearchCV()` function provided by scikit-learn to split\
    \ the training set in a K-fold cross-validation:\n\n```\n>>> from sklearn.model_selection\
    \ import GridSearchCV\n>>> clf = GridSearchCV(SVC(), param_grid, cv=3)\n>>> #\
    \ X_train and y_train being datapoints from titanic dataset.\n>>> # titanic dataset\
    \ is used for sake of presenting this example.\n>>> clf.fit(X_train, y_train)\n\
    >>> clf.best_estimator_\nSVC(C=100000.0, break_ties=False, cache_size=200, class_weight=None,\
    \ coef0=0.0,\n    decision_function_shape='ovr', degree=3, gamma=0.0001, kernel=\"\
    rbf\",\n    max_iter=-1, probability=False, random_state=None, shrinking=True,\n\
    \    tol=0.001, verbose=False)\n```\n\nIn Figure [2-1-2](#494613_1_En_2_Chapter.xhtml#Fig3),\
    \ we can see that the accuracy score varies with iterations (for 169 combinations).\n\
    \n![../images/494613_1_En_2_Chapter/494613_1_En_2_Fig3_HTML.jpg](images/494613_1_En_2_Chapter/494613_1_En_2_Fig3_HTML.jpg)\n\
    \nFigure 2-1-2\n\nPlot of iteration vs. accuracy score\n\nFigure [2-1-2](#494613_1_En_2_Chapter.xhtml#Fig3)\
    \ exhibits no clear pattern since it’s an exhaustive search method; we are trying\
    \ all possible combinations. You can define the `GridSearchCV()` function and\
    \ pass the algorithm, parameter grid, and number of folds for cross-validation.\
    \ All the other methods like `fit()`, `score()` and so forth are same. You can\
    \ use the method `best_estimator_` to get the best value of hyperparameters. I\
    \ tuned for `gamma` and `C` the same as our scratch implementation, keeping the\
    \ rest of the hyperparameters constant."
  raw: '## Grid Search


    Perhaps the most brute-force approach for finding the most optimized set of hyperparameters
    is to train the dataset on each possible set. This approach, called *grid search*
    , is the most certain way of finding the best set of hyperparameters, but it also
    has its disadvantages. Figure [2-1-1](#494613_1_En_2_Chapter.xhtml#Fig2) depicts
    a grid going through all possible combinations of parameters 1 and 2.


    ![../images/494613_1_En_2_Chapter/494613_1_En_2_Fig2_HTML.jpg](images/494613_1_En_2_Chapter/494613_1_En_2_Fig2_HTML.jpg)


    Figure 2-1-1


    A grid search going through each possible combination of two hyperparameters


    Suppose you have ten algorithms with five hyperparameters each, with four possible
    values for each hyperparameter, and a huge dataset that takes 1 minute to train
    on one algorithm on one set of hyperparameters. This scenario would take around
    a week to discover your best hyperparameter. But for less number of hyperparameters
    and smaller training time we can go with grid search. Now we’ll build this simple
    algorithm in Python and test it on the example shown in Figure [2-1-1](#494613_1_En_2_Chapter.xhtml#Fig2).


    The value of a hyperparameter can vary on either a continuous distribution or
    a discrete distribution. If the value is discrete, there is a finite number of
    possible values in a range. However, in a continuous distribution, there are infinite
    possible values, as we saw in Chapter [1](#494613_1_En_1_Chapter.xhtml). Next
    we’ll be tuning C and gamma, both of which have a continuous distribution between
    a range. But to make a grid, we’ll make an even distribution on a log scale. Grid
    search does not take random variables; to make a grid, it needs specific values.


    Let’s make a grid of hyperparameters C and gamma:


    ```

    c = 0.001

    gamma = 1e-10

    param_grid = {

    "C": [c*(10**i) for i in range(1,14)],

    "gamma": [gamma*(10**i) for i in range(1,14)]

    }

    ```


    Note


    I have used a preprocessed dataset (X_train, y_train, X_test, y_test), the Titanic
    dataset. Refer to Appendix I to view all the preprocessing methods.


    We’ll first make a function to break this grid into a list of all possible sets
    of hyperparameters, `make_sets()`:


    ```

    from itertools import product

    def make_sets(grid):

    sets = list()

    all_hps_vals = [lst for lst in param_grid.values()]

    hp_keys = [hp for hp in param_grid.keys()]

    val_sets = product(*all_hps_vals)

    for val in val_sets:

    hp_set = dict()

    for idx, hp_key in enumerate(hp_keys):

    hp_set[hp_key] = val[idx]

    sets.append(hp_set)

    return sets

    >>> make_sets(param_grid)

    [{''C'':0.01, ''gamma'':1e-09},

    {''C'':0.01, ''gamma'':1e-08},

    {''C'':0.01, ''gamma'':1e-07},

    ...

    ...

    {''C'':10000000000.0, ''gamma'':1000.0}

    ]

    ```


    Now we’ll make another function, `grid_search()`, to fit all the sets on the machine
    learning algorithm:


    ```

    def grid_search(clf, grid, X_train, y_train, X_test, y_test):

    all_sets = make_sets(grid)

    logs = list()

    best_hp_set = {

    "best_test_score": 0.0

    }

    for hp_set in all_sets:

    log = dict()

    model = clf(**hp_set)

    model.fit(X_train, y_train)

    train_score = model.score(X_train, y_train)

    test_score = model.score(X_test, y_test)

    log["hp"] = hp_set

    log["train_score"] = train_score

    log["test_score"] = test_score

    if best_hp_set["best_test_score"]>> from sklearn.model_selection import train_test_split

    >>> from sklearn.svm import SVC

    # train test split dataset.

    # X and y are the pre-processed features and labels respectively.

    >>> X_train, y_train, X_test, y_test = train_test_split(X, y)

    >>> logs, best = grid_search(SVC, param_grid, X_train, y_train, X_test, y_test)

    ```


    The `grid_search()` function that we just defined takes the following inputs:
    classifier, parameter_grid, and dataset. From the `make_sets()` function, `grid_search()`
    creates all combinations of hyperparameters and trains the model on all of them.
    Then we save the train and test scores in a dictionary and search for best results.


    Note that for the sake of simplicity of code, I did not *cross-validate* while
    training. To actually evaluate each set of hyperparameters, we must use a validation
    set and save the test set for later, so that we can evaluate the model on an independent
    set. However, instead of splitting the training set into training and validation
    sets (since in datasets like Titanic, we have only around 700 datapoints), we
    cross-validate, saving the precious training data unaltered. Cross-validation
    also prevents overfitting on the validation set.


    We’ll now see how to use the `GridSearchCV()` function provided by scikit-learn
    to split the training set in a K-fold cross-validation:


    ```

    >>> from sklearn.model_selection import GridSearchCV

    >>> clf = GridSearchCV(SVC(), param_grid, cv=3)

    >>> # X_train and y_train being datapoints from titanic dataset.

    >>> # titanic dataset is used for sake of presenting this example.

    >>> clf.fit(X_train, y_train)

    >>> clf.best_estimator_

    SVC(C=100000.0, break_ties=False, cache_size=200, class_weight=None, coef0=0.0,

    decision_function_shape=''ovr'', degree=3, gamma=0.0001, kernel="rbf",

    max_iter=-1, probability=False, random_state=None, shrinking=True,

    tol=0.001, verbose=False)

    ```


    In Figure [2-1-2](#494613_1_En_2_Chapter.xhtml#Fig3), we can see that the accuracy
    score varies with iterations (for 169 combinations).


    ![../images/494613_1_En_2_Chapter/494613_1_En_2_Fig3_HTML.jpg](images/494613_1_En_2_Chapter/494613_1_En_2_Fig3_HTML.jpg)


    Figure 2-1-2


    Plot of iteration vs. accuracy score


    Figure [2-1-2](#494613_1_En_2_Chapter.xhtml#Fig3) exhibits no clear pattern since
    it’s an exhaustive search method; we are trying all possible combinations. You
    can define the `GridSearchCV()` function and pass the algorithm, parameter grid,
    and number of folds for cross-validation. All the other methods like ‘fit()’,
    ‘score()’ and so forth are same. You can use the method `best_estimator_` to get
    the best value of hyperparameters. I tuned for ‘gamma’ and ‘C’ the same as our
    scratch implementation, keeping the rest of the hyperparameters constant.'
  trans: '

    ## 网格搜索


    寻找最优超参数集最暴力的方法或许是在每一种可能的参数组合上训练数据集。这种方法被称为*网格搜索*，是找到最佳超参数集最确定的方式，但它也有其缺点。图 2-1-1
    展示了一个遍历参数 1 和参数 2 所有可能组合的网格。


    ![../images/494613_1_En_2_Chapter/494613_1_En_2_Fig2_HTML.jpg](img/494613_1_En_2_Fig2_HTML.jpg)


    图 2-1-1


    一个遍历两个超参数所有可能组合的网格搜索


    假设你有十个算法，每个算法有五个超参数，每个超参数有四个可能的值，并且有一个庞大的数据集，在一组超参数上训练一个算法需要 1 分钟。这种情况下，大约需要一周时间才能找到最佳超参数。但对于超参数数量较少且训练时间较短的情况，我们可以采用网格搜索。现在，我们将用
    Python 构建这个简单的算法，并在图 2-1-1 所示的示例上进行测试。


    超参数的值可以分布在连续分布或离散分布上。如果值是离散的，那么在一个范围内可能值的数量是有限的。然而，在连续分布中，存在无限个可能的值，正如我们在第 1 章中所见。接下来，我们将调整
    C 和 gamma，这两个参数在某个范围内都是连续分布。但为了构建网格，我们将在对数尺度上创建均匀分布。网格搜索不接受随机变量；要构建网格，它需要具体的值。


    让我们创建一个超参数 C 和 gamma 的网格：


    ```

    c = 0.001

    gamma = 1e-10

    param_grid = {

    "C": [c*(10**i) for i in range(1,14)],

    "gamma": [gamma*(10**i) for i in range(1,14)]

    }

    ```


    注意


    我使用了预处理后的数据集（X_train, y_train, X_test, y_test），即泰坦尼克号数据集。请参考附录 I 查看所有预处理方法。


    我们首先创建一个函数，将这个网格分解为所有可能的超参数集列表，即 `make_sets()`：


    ```

    from itertools import product

    def make_sets(grid):

    sets = list()

    all_hps_vals = [lst for lst in param_grid.values()]

    hp_keys = [hp for hp in param_grid.keys()]

    val_sets = product(*all_hps_vals)

    for val in val_sets:

    hp_set = dict()

    for idx, hp_key in enumerate(hp_keys):

    hp_set[hp_key] = val[idx]

    sets.append(hp_set)

    return sets

    >>> make_sets(param_grid)

    [{''C'':0.01, ''gamma'':1e-09},

    {''C'':0.01, ''gamma'':1e-08},

    {''C'':0.01, ''gamma'':1e-07},

    ...

    ...

    {''C'':10000000000.0, ''gamma'':1000.0}

    ]

    ```


    现在，我们将创建另一个函数 `grid_search()`，用于将所有参数集拟合到机器学习算法上：


    ```

    def grid_search(clf, grid, X_train, y_train, X_test, y_test):

    all_sets = make_sets(grid)

    logs = list()

    best_hp_set = {

    "best_test_score": 0.0

    }

    for hp_set in all_sets:

    log = dict()

    model = clf(**hp_set)

    model.fit(X_train, y_train)

    train_score = model.score(X_train, y_train)

    test_score = model.score(X_test, y_test)

    log["hp"] = hp_set

    log["train_score"] = train_score

    log["test_score"] = test_score

    if best_hp_set["best_test_score"]>> from sklearn.model_selection import train_test_split

    >>> from sklearn.svm import SVC

    # 训练测试分割数据集。

    # X 和 y 分别是预处理后的特征和标签。

    >>> X_train, y_train, X_test, y_test = train_test_split(X, y)

    >>> logs, best = grid_search(SVC, param_grid, X_train, y_train, X_test, y_test)

    ```


    我们刚刚定义的 `grid_search()` 函数接收以下输入：分类器、参数网格和数据集。通过 `make_sets()` 函数，`grid_search()`
    创建所有超参数组合，并在所有组合上训练模型。然后，我们将训练分数和测试分数保存在一个字典中，并搜索最佳结果。


    请注意，为了代码的简洁性，我在训练时没有进行*交叉验证*。为了真正评估每一组超参数，我们必须使用一个验证集，并将测试集留待以后使用，这样我们才能在一个独立的集上评估模型。然而，我们并没有将训练集分割成训练集和验证集（因为在像泰坦尼克号这样的数据集中，我们只有大约
    700 个数据点），而是进行交叉验证，从而保留宝贵的训练数据不变。交叉验证还可以防止在验证集上过拟合。


    现在，我们将看到如何使用 scikit-learn 提供的 `GridSearchCV()` 函数，以 K 折交叉验证的方式分割训练集：


    ```

    >>> from sklearn.model_selection import GridSearchCV

    >>> clf = GridSearchCV(SVC(), param_grid, cv=3)

    >>> # X_train 和 y_train 是来自泰坦尼克号数据集的数据点。

    >>> # 使用泰坦尼克号数据集是为了展示这个示例。

    >>> clf.fit(X_train, y_train)

    >>> clf.best_estimator_

    SVC(C=100000.0, break_ties=False, cache_size=200, class_weight=None, coef0=0.0,

    decision_function_shape=''ovr'', degree=3, gamma=0.0001, kernel="rbf",

    max_iter=-1, probability=False, random_state=None, shrinking=True,

    tol=0.001, verbose=False)

    ```


    在图 2-1-2 中，我们可以看到准确率分数随迭代次数（针对 169 种组合）而变化。


    ![../images/494613_1_En_2_Chapter/494613_1_En_2_Fig3_HTML.jpg](img/494613_1_En_2_Fig3_HTML.jpg)


    图 2-1-2


    迭代次数与准确率分数的关系图


    图 2-1-2 没有显示出明显的模式，因为这是一种穷举搜索方法；我们正在尝试所有可能的组合。你可以定义 `GridSearchCV()` 函数，并传入算法、参数网格以及交叉验证的折数。所有其他方法，如
    `fit()`、`score()` 等，都是相同的。你可以使用 `best_estimator_` 方法来获取超参数的最佳值。我调整了 ''gamma''
    和 ''C''，与我们的手动实现相同，并保持其余超参数不变。

