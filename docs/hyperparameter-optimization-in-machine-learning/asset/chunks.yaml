- fmt: "### Building Your Own AutoML Module\n\nThis example provides instructions\
    \ for building a basic module that you can subsequently experiment with and add\
    \ more algorithms. For use in real-world problems, there are many optimized AutoML\
    \ libraries, which we’ll discuss later. We’ll work on the Titanic dataset, which\
    \ is messy, but our code will handle all the cleaning and preprocessing.\n\nLet’s\
    \ start by importing everything and loading the dataset^([(13)](#fn13)):\n\n```\n\
    import pandas as pd\nimport numpy as np\nimport impyute as impy\nimport optuna\n\
    from optuna.samplers import TPESampler\nfrom sklearn.model_selection import train_test_split\n\
    from sklearn.preprocessing import LabelEncoder, MinMaxScaler, \\\nStandardScaler\n\
    from sklearn.impute import SimpleImputer\nfrom sklearn.feature_selection import\
    \ SelectKBest, \\\nchi2, f_classif, mutual_info_classif\nfrom sklearn.svm import\
    \ SVC\nfrom sklearn.neighbors import KNeighborsClassifier\ndata = pd.read_csv(\"\
    ./titanic/train.csv\")\ny = data['Survived']\nX = data.drop('Survived', axis=1)\n\
    ```\n\nNow we’ll address the part where we are not optimizing the hyperparameters.\
    \ We’ll define the outside objective function because it does not make sense to\
    \ iterate the same process that is not to be optimized.\n\n```\ndef label_encode_column(col):\n\
    \    nans = col.isnull()\n    nan_lst = []\n    nan_idx_lst = []\n    label_lst\
    \ = []\n    label_idx_lst = []\n    for idx, nan in enumerate(nans):\n       \
    \ if nan:\n            nan_lst.append(col[idx])\n            nan_idx_lst.append(idx)\n\
    \        else:\n            label_lst.append(col[idx])\n            label_idx_lst.append(idx)\n\
    \    nan_df = pd.DataFrame(nan_lst, index=nan_idx_lst)\n    label_df = pd.DataFrame(label_lst,\
    \ index=label_idx_lst)\n    label_encoder = LabelEncoder()\n    label_df = label_encoder.fit_transform(label_df.astype(str))\n\
    \    label_df = pd.DataFrame(label_df, index=label_idx_lst)\n    final_col = pd.concat([label_df,\
    \ nan_df])\n    return final_col.sort_index()\nfor column_name in X.columns:\n\
    \    if str(X[column_name].dtype) == 'object':\n        X[column_name] = label_encode_column(X[column_name])\n\
    \    if len(X[column_name].unique()) > len(X)/3:\n        X = X.drop(column_name,\
    \ axis=1)\n```\n\nWe are using the function `label_encode_column()`, but what’s\
    \ wrong with just `LabelEncoding()`? `LabelEncoding()` also labels the NaN values,\
    \ but we want to impute those later. So function takes each column, separates\
    \ the NaN and other values, and labels them while saving their index position.\
    \ It returns a sorted dataframe, an example of which is shown in Figure [5-2-1](#494613_1_En_5_Chapter.xhtml#Fig3).\n\
    \n![../images/494613_1_En_5_Chapter/494613_1_En_5_Fig3_HTML.jpg](images/494613_1_En_5_Chapter/494613_1_En_5_Fig3_HTML.jpg)\n\
    \nFigure 5-2-1\n\nLabel Encoder encodes all values except NaNs\n\nSo after we\
    \ label encode all the columns, we drop those with a high number of unique values.\
    \ You can alternatively include label encoding in the objective function if you\
    \ want one-hot encoding as an option. Next, we are going to define some functions\
    \ to be used in the objective function:\n\n```\ndef mice_imputer(data):\n    data\
    \ = data.to_numpy()\n    imputed_data = impy.mice(data)\n    imputed_data = pd.DataFrame(imputed_data)\n\
    \    return imputed_data\ndef mean_imputer(data):\n    imputer = SimpleImputer(strategy='mean')\n\
    \    imputed_data = imputer.fit_transform(data)\n    imputed_data = pd.DataFrame(imputed_data)\n\
    \    return imputed_data\n```\n\nThe preceding code parameterizes two imputers,\
    \ Mean Imputation and MICE Imputation. Refer to Appendix I for instructions on\
    \ including more options.\n\n```\ndef feature_selector(X, y, k, algo=\"f_classif\"\
    ):\n    kbest = SelectKBest(eval(algo), k)\n    X = kbest.fit_transform(X, y)\n\
    \    X = pd.DataFrame(X)\n    return X\n```\n\nWe are going to select `k` number\
    \ of best features, which is also going to be a hyperparameter. Another hyperparameter\
    \ is selecting the feature selection algorithm. We have `f_classif`, `chi2`, and\
    \ `mutual_info_classif`. The last of the preprocessing steps is scaling. We select\
    \ between normalization and standardization.\n\n```\ndef scaling(data, scaler=\"\
    min_max\"):\n    if scaler=='min_max':\n        scaled_data = MinMaxScaler().fit_transform(data)\n\
    \    else:\n        scaled_data = StandardScaler().fit_transform(data)\n    scaled_data\
    \ = pd.DataFrame(scaled_data)\n    return scaled_data\n```\n\nAnd now we define\
    \ the objective function:\n\n```\ndef objective_func(trial):\n    try:\n     \
    \   # imputation\n        imputer = trial.suggest_categorical('impyter', ['mice',\
    \ 'mean'])\n        if imputer=='mice':\n            imputed_X = mice_imputer(X)\n\
    \        else:\n            imputed_X = mean_imputer(X)\n        # feature selection\n\
    \        fea_slct = trial.suggest_categorical('fea_slct',\n                  \
    \                           ['chi2', 'f_classif',\n                          \
    \                    'mutual_info_classif'])\n        no_feature_cols = trial.suggest_int('k',\
    \ 3, len(X.columns))\n        selected_features = feature_selector(imputed_X,\
    \ y,\n                                             no_feature_cols, fea_slct)\n\
    \        # scaling\n        scaler = trial.suggest_categorical('scaler',\n   \
    \                                        ['min_max', 'standard'])\n        scaled_X\
    \ = scaling(selected_features)\n    except:\n        return 0.0\n    # instantiating\
    \ machine learning algorithm\n    classifier_name = trial.suggest_categorical(\"\
    classifier\",\n                                                [\"SVC\", \"RandomForest\"\
    ])\n    if classifier_name == \"SVC\":\n        c = trial.suggest_loguniform(\"\
    svc_c\", 1e-2, 1e+11)\n        gamma = trial.suggest_loguniform(\"svc_gamma\"\
    , 1e-9, 1e+3)\n        kernel = trial.suggest_categorical(\"svc_kernel\",\n  \
    \                                         ['rbf','poly','rbf','sigmoid'])\n  \
    \      degree = trial.suggest_categorical(\"svc_degree\", range(1,15))\n     \
    \   clf = SVC(C=c, gamma=gamma, kernel=kernel, degree=degree)\n    else :\n  \
    \      algorithm = trial.suggest_categorical(\"algorithm\",\n                \
    \                              ['ball_tree', \"kd_tree\"])\n        leaf_size\
    \ = trial.suggest_categorical(\"leaf_size\", range(1,50))\n        metric = trial.suggest_categorical(\"\
    metic\",\n                                           [\"euclidean\",\"manhattan\"\
    ,\n                                            \"chebyshev\",\"minkowski\"])\n\
    \        clf = KNeighborsClassifier(algorithm=algorithm,\n                   \
    \                leaf_size=leaf_size, metric=metric)\n    # fit the model\n  \
    \  clf.fit(scaled_X, y)\n    val_acc = clf.score(scaled_X, y)\n    return val_acc\n\
    study = optuna.create_study(direction='maximize', sampler=TPESampler())\nstudy.optimize(objective_func,\
    \ n_trials=100)\nbest_trial = study.best_trial.value\nprint(f\"Best trial  accuracy:\
    \ {best_trial}\")\nprint(\"parameters for best trial are :\")\nfor key, value\
    \ in study.best_trial.params.items():\n    print(f\"{key}: {value}\")\n```\n\n\
    The first part of the objective function consists of all the preprocessing steps,\
    \ where we are using `try`...`except`. We are using the functions defined before.\
    \ In some cases, when there is a mismatch in algorithm and hyperparameter, or\
    \ if the data processed by the previous step is not acceptable by the next step,\
    \ you might encounter an error. For instance, some of the feature selection algorithms\
    \ don’t work on negative values, but even if you are careful with the dataset,\
    \ the imputer might impute a NaN with some negative value. In that case, just\
    \ return zero, the least possible accuracy value.\n\nWe then define the choice\
    \ for classifiers as we did before (you can add more classifiers). The idea of\
    \ AutoML is to create a generic code that gives you the best possible pipeline\
    \ for the dataset. You can train any tabular dataset for classification to get\
    \ the best possible pipeline for the previous set of steps and choices of algorithm\
    \ without writing another line of code.\n\nAs the complexity of the search space\
    \ is increased, we need to perform more trials over the dataset. The more trials,\
    \ the better the results we’ll achieve. To reduce the time, you can distribute\
    \ the optimization process, as described next."
  raw: '### Building Your Own AutoML Module


    This example provides instructions for building a basic module that you can subsequently
    experiment with and add more algorithms. For use in real-world problems, there
    are many optimized AutoML libraries, which we’ll discuss later. We’ll work on
    the Titanic dataset, which is messy, but our code will handle all the cleaning
    and preprocessing.


    Let’s start by importing everything and loading the dataset^([^(13)](#fn13)):


    ```

    import pandas as pd

    import numpy as np

    import impyute as impy

    import optuna

    from optuna.samplers import TPESampler

    from sklearn.model_selection import train_test_split

    from sklearn.preprocessing import LabelEncoder, MinMaxScaler, \

    StandardScaler

    from sklearn.impute import SimpleImputer

    from sklearn.feature_selection import SelectKBest, \

    chi2, f_classif, mutual_info_classif

    from sklearn.svm import SVC

    from sklearn.neighbors import KNeighborsClassifier

    data = pd.read_csv("./titanic/train.csv")

    y = data[''Survived'']

    X = data.drop(''Survived'', axis=1)

    ```


    Now we’ll address the part where we are not optimizing the hyperparameters. We’ll
    define the outside objective function because it does not make sense to iterate
    the same process that is not to be optimized.


    ```

    def label_encode_column(col):

    nans = col.isnull()

    nan_lst = []

    nan_idx_lst = []

    label_lst = []

    label_idx_lst = []

    for idx, nan in enumerate(nans):

    if nan:

    nan_lst.append(col[idx])

    nan_idx_lst.append(idx)

    else:

    label_lst.append(col[idx])

    label_idx_lst.append(idx)

    nan_df = pd.DataFrame(nan_lst, index=nan_idx_lst)

    label_df = pd.DataFrame(label_lst, index=label_idx_lst)

    label_encoder = LabelEncoder()

    label_df = label_encoder.fit_transform(label_df.astype(str))

    label_df = pd.DataFrame(label_df, index=label_idx_lst)

    final_col = pd.concat([label_df, nan_df])

    return final_col.sort_index()

    for column_name in X.columns:

    if str(X[column_name].dtype) == ''object'':

    X[column_name] = label_encode_column(X[column_name])

    if len(X[column_name].unique()) > len(X)/3:

    X = X.drop(column_name, axis=1)

    ```


    We are using the function `label_encode_column()`, but what’s wrong with just
    LabelEncoding()? LabelEncoding() also labels the NaN values, but we want to impute
    those later. So function takes each column, separates the NaN and other values,
    and labels them while saving their index position. It returns a sorted dataframe,
    an example of which is shown in Figure [5-2-1](#494613_1_En_5_Chapter.xhtml#Fig3).


    ![../images/494613_1_En_5_Chapter/494613_1_En_5_Fig3_HTML.jpg](images/494613_1_En_5_Chapter/494613_1_En_5_Fig3_HTML.jpg)


    Figure 5-2-1


    Label Encoder encodes all values except NaNs


    So after we label encode all the columns, we drop those with a high number of
    unique values. You can alternatively include label encoding in the objective function
    if you want one-hot encoding as an option. Next, we are going to define some functions
    to be used in the objective function:


    ```

    def mice_imputer(data):

    data = data.to_numpy()

    imputed_data = impy.mice(data)

    imputed_data = pd.DataFrame(imputed_data)

    return imputed_data

    def mean_imputer(data):

    imputer = SimpleImputer(strategy=''mean'')

    imputed_data = imputer.fit_transform(data)

    imputed_data = pd.DataFrame(imputed_data)

    return imputed_data

    ```


    The preceding code parameterizes two imputers, Mean Imputation and MICE Imputation.
    Refer to Appendix I for instructions on including more options.


    ```

    def feature_selector(X, y, k, algo="f_classif"):

    kbest = SelectKBest(eval(algo), k)

    X = kbest.fit_transform(X, y)

    X = pd.DataFrame(X)

    return X

    ```


    We are going to select ''k'' number of best features, which is also going to be
    a hyperparameter. Another hyperparameter is selecting the feature selection algorithm.
    We have `''f_classif''`, `''chi2''`, and `''mutual_info_classif''`. The last of
    the preprocessing steps is scaling. We select between normalization and standardization.


    ```

    def scaling(data, scaler="min_max"):

    if scaler==''min_max'':

    scaled_data = MinMaxScaler().fit_transform(data)

    else:

    scaled_data = StandardScaler().fit_transform(data)

    scaled_data = pd.DataFrame(scaled_data)

    return scaled_data

    ```


    And now we define the objective function:


    ```

    def objective_func(trial):

    try:

    # imputation

    imputer = trial.suggest_categorical(''impyter'', [''mice'', ''mean''])

    if imputer==''mice'':

    imputed_X = mice_imputer(X)

    else:

    imputed_X = mean_imputer(X)

    # feature selection

    fea_slct = trial.suggest_categorical(''fea_slct'',

    [''chi2'', ''f_classif'',

    ''mutual_info_classif''])

    no_feature_cols = trial.suggest_int(''k'', 3, len(X.columns))

    selected_features = feature_selector(imputed_X, y,

    no_feature_cols, fea_slct)

    # scaling

    scaler = trial.suggest_categorical(''scaler'',

    [''min_max'', ''standard''])

    scaled_X = scaling(selected_features)

    except:

    return 0.0

    # instantiating machine learning algorithm

    classifier_name = trial.suggest_categorical("classifier",

    ["SVC", "RandomForest"])

    if classifier_name == "SVC":

    c = trial.suggest_loguniform("svc_c", 1e-2, 1e+11)

    gamma = trial.suggest_loguniform("svc_gamma", 1e-9, 1e+3)

    kernel = trial.suggest_categorical("svc_kernel",

    [''rbf'',''poly'',''rbf'',''sigmoid''])

    degree = trial.suggest_categorical("svc_degree", range(1,15))

    clf = SVC(C=c, gamma=gamma, kernel=kernel, degree=degree)

    else :

    algorithm = trial.suggest_categorical("algorithm",

    [''ball_tree'', "kd_tree"])

    leaf_size = trial.suggest_categorical("leaf_size", range(1,50))

    metric = trial.suggest_categorical("metic",

    ["euclidean","manhattan",

    "chebyshev","minkowski"])

    clf = KNeighborsClassifier(algorithm=algorithm,

    leaf_size=leaf_size, metric=metric)

    # fit the model

    clf.fit(scaled_X, y)

    val_acc = clf.score(scaled_X, y)

    return val_acc

    study = optuna.create_study(direction=''maximize'', sampler=TPESampler())

    study.optimize(objective_func, n_trials=100)

    best_trial = study.best_trial.value

    print(f"Best trial  accuracy: {best_trial}")

    print("parameters for best trial are :")

    for key, value in study.best_trial.params.items():

    print(f"{key}: {value}")

    ```


    The first part of the objective function consists of all the preprocessing steps,
    where we are using `try`...`except`. We are using the functions defined before.
    In some cases, when there is a mismatch in algorithm and hyperparameter, or if
    the data processed by the previous step is not acceptable by the next step, you
    might encounter an error. For instance, some of the feature selection algorithms
    don’t work on negative values, but even if you are careful with the dataset, the
    imputer might impute a NaN with some negative value. In that case, just return
    zero, the least possible accuracy value.


    We then define the choice for classifiers as we did before (you can add more classifiers).
    The idea of AutoML is to create a generic code that gives you the best possible
    pipeline for the dataset. You can train any tabular dataset for classification
    to get the best possible pipeline for the previous set of steps and choices of
    algorithm without writing another line of code.


    As the complexity of the search space is increased, we need to perform more trials
    over the dataset. The more trials, the better the results we’ll achieve. To reduce
    the time, you can distribute the optimization process, as described next.'
  trans: '

    ### 构建你自己的 AutoML 模块


    本示例提供了构建一个基础模块的说明，你可以随后对其进行实验并添加更多算法。对于实际应用场景，有许多经过优化的 AutoML 库，我们将在后面讨论。我们将使用泰坦尼克号数据集，该数据集虽然杂乱，但我们的代码将处理所有清洗和预处理工作。


    首先，我们导入所有必要的库并加载数据集^(¹³)：


    ```

    import pandas as pd

    import numpy as np

    import impyute as impy

    import optuna

    from optuna.samplers import TPESampler

    from sklearn.model_selection import train_test_split

    from sklearn.preprocessing import LabelEncoder, MinMaxScaler, \

    StandardScaler

    from sklearn.impute import SimpleImputer

    from sklearn.feature_selection import SelectKBest, \

    chi2, f_classif, mutual_info_classif

    from sklearn.svm import SVC

    from sklearn.neighbors import KNeighborsClassifier

    data = pd.read_csv("./titanic/train.csv")

    y = data[''Survived'']

    X = data.drop(''Survived'', axis=1)

    ```


    现在，我们来处理不需要优化超参数的部分。我们将定义外部目标函数，因为重复迭代那些无需优化的过程是没有意义的。


    ```

    def label_encode_column(col):

    nans = col.isnull()

    nan_lst = []

    nan_idx_lst = []

    label_lst = []

    label_idx_lst = []

    for idx, nan in enumerate(nans):

    if nan:

    nan_lst.append(col[idx])

    nan_idx_lst.append(idx)

    else:

    label_lst.append(col[idx])

    label_idx_lst.append(idx)

    nan_df = pd.DataFrame(nan_lst, index=nan_idx_lst)

    label_df = pd.DataFrame(label_lst, index=label_idx_lst)

    label_encoder = LabelEncoder()

    label_df = label_encoder.fit_transform(label_df.astype(str))

    label_df = pd.DataFrame(label_df, index=label_idx_lst)

    final_col = pd.concat([label_df, nan_df])

    return final_col.sort_index()

    for column_name in X.columns:

    if str(X[column_name].dtype) == ''object'':

    X[column_name] = label_encode_column(X[column_name])

    if len(X[column_name].unique()) > len(X)/3:

    X = X.drop(column_name, axis=1)

    ```


    我们使用了 `label_encode_column()` 函数，但直接使用 `LabelEncoding()` 有什么问题呢？`LabelEncoding()`
    也会对 NaN 值进行编码，但我们希望稍后对这些值进行插补。因此，该函数会逐列处理，将 NaN 值与其他值分离，并在保存其索引位置的同时进行编码。它返回一个排序后的数据框，如图
    5-2-1 所示。


    ![../images/494613_1_En_5_Chapter/494613_1_En_5_Fig3_HTML.jpg](img/494613_1_En_5_Fig3_HTML.jpg)


    图 5-2-1


    标签编码器对除 NaN 之外的所有值进行编码


    因此，在对所有列进行标签编码后，我们会删除那些唯一值数量过多的列。如果你希望将独热编码作为一个选项，也可以将标签编码包含在目标函数中。接下来，我们将定义一些在目标函数中使用的函数：


    ```

    def mice_imputer(data):

    data = data.to_numpy()

    imputed_data = impy.mice(data)

    imputed_data = pd.DataFrame(imputed_data)

    return imputed_data

    def mean_imputer(data):

    imputer = SimpleImputer(strategy=''mean'')

    imputed_data = imputer.fit_transform(data)

    imputed_data = pd.DataFrame(imputed_data)

    return imputed_data

    ```


    上述代码参数化了两个插补器：均值插补和 MICE 插补。关于如何包含更多选项的说明，请参考附录 I。


    ```

    def feature_selector(X, y, k, algo="f_classif"):

    kbest = SelectKBest(eval(algo), k)

    X = kbest.fit_transform(X, y)

    X = pd.DataFrame(X)

    return X

    ```


    我们将选择 ''k'' 个最佳特征，这本身也是一个超参数。另一个超参数是选择特征选择算法。我们有 `''f_classif''`、`''chi2''` 和
    `''mutual_info_classif''`。预处理步骤的最后一步是缩放。我们在归一化和标准化之间进行选择。


    ```

    def scaling(data, scaler="min_max"):

    if scaler==''min_max'':

    scaled_data = MinMaxScaler().fit_transform(data)

    else:

    scaled_data = StandardScaler().fit_transform(data)

    scaled_data = pd.DataFrame(scaled_data)

    return scaled_data

    ```


    现在，我们定义目标函数：


    ```

    def objective_func(trial):

    try:

    # 插补

    imputer = trial.suggest_categorical(''impyter'', [''mice'', ''mean''])

    if imputer==''mice'':

    imputed_X = mice_imputer(X)

    else:

    imputed_X = mean_imputer(X)

    # 特征选择

    fea_slct = trial.suggest_categorical(''fea_slct'',

    [''chi2'', ''f_classif'',

    ''mutual_info_classif''])

    no_feature_cols = trial.suggest_int(''k'', 3, len(X.columns))

    selected_features = feature_selector(imputed_X, y,

    no_feature_cols, fea_slct)

    # 缩放

    scaler = trial.suggest_categorical(''scaler'',

    [''min_max'', ''standard''])

    scaled_X = scaling(selected_features)

    except:

    return 0.0

    # 实例化机器学习算法

    classifier_name = trial.suggest_categorical("classifier",

    ["SVC", "RandomForest"])

    if classifier_name == "SVC":

    c = trial.suggest_loguniform("svc_c", 1e-2, 1e+11)

    gamma = trial.suggest_loguniform("svc_gamma", 1e-9, 1e+3)

    kernel = trial.suggest_categorical("svc_kernel",

    [''rbf'',''poly'',''rbf'',''sigmoid''])

    degree = trial.suggest_categorical("svc_degree", range(1,15))

    clf = SVC(C=c, gamma=gamma, kernel=kernel, degree=degree)

    else :

    algorithm = trial.suggest_categorical("algorithm",

    [''ball_tree'', "kd_tree"])

    leaf_size = trial.suggest_categorical("leaf_size", range(1,50))

    metric = trial.suggest_categorical("metic",

    ["euclidean","manhattan",

    "chebyshev","minkowski"])

    clf = KNeighborsClassifier(algorithm=algorithm,

    leaf_size=leaf_size, metric=metric)

    # 拟合模型

    clf.fit(scaled_X, y)

    val_acc = clf.score(scaled_X, y)

    return val_acc

    study = optuna.create_study(direction=''maximize'', sampler=TPESampler())

    study.optimize(objective_func, n_trials=100)

    best_trial = study.best_trial.value

    print(f"最佳试验准确率: {best_trial}")

    print("最佳试验的参数为：")

    for key, value in study.best_trial.params.items():

    print(f"{key}: {value}")

    ```


    目标函数的第一部分包含所有预处理步骤，我们使用了 `try`...`except`。我们使用了之前定义的函数。在某些情况下，当算法和超参数不匹配，或者上一步处理后的数据无法被下一步接受时，你可能会遇到错误。例如，某些特征选择算法不适用于负值，但即使你对数据集很小心，插补器也可能用某个负值来插补
    NaN。在这种情况下，只需返回零，即可能的最低准确率值。


    然后，我们像之前一样定义分类器的选择（你可以添加更多分类器）。AutoML 的理念是创建一个通用代码，为你提供针对数据集的最佳可能流水线。你可以训练任何表格数据集进行分类，从而在无需编写额外代码的情况下，获得针对上述步骤和算法选择的最佳可能流水线。


    随着搜索空间复杂度的增加，我们需要对数据集进行更多次试验。试验次数越多，我们获得的结果就越好。为了减少时间，你可以像下面描述的那样，将优化过程分布化。

