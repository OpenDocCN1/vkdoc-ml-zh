    ### 可视化


    Optuna 提供了优雅的可视化功能。图 5-1-1 是由 Optuna 通过 `optuna.visualization.plot_optimization_history(study)`
    生成的。你可以传入 `study` 对象，它就会创建一个图表。你可以点击每个散点，观察所使用的不同超参数。此外，还有更多的可视化选项。


    回调函数（Callbacks）是 `study.optimize()` 中的一个参数，它会在每次试验后调用回调。利用这一点，你可以在像 *tensorboardX*
    这样的仪表盘上实时查看进度。


    回调函数的工作方式如下：


    ```

    import optuna

    from optuna.samplers import TPESampler

    def log(study, trial):

    print(f"Trial No.={trial.number}, HP_Set={trial.params}, \

    Score={trial.value}")

    print(f"Best Value ={study.best_value}")

    # def objective_func()

    study = optuna.create_study(sampler=TPESampler())

    study.optimize(objective_func, n_trials=100, callbacks=[log])

    ```


    使用起来非常简单。你可以将这些结果写入仪表盘，每次试验后它们都会更新。


    ### 分布式优化


    与 Hyperopt 一样，Optuna 也支持分布式优化，但 Optuna 的实现比 Hyperopt 更容易使用。让我们看看如何配置它：


    ```

    study = optuna.create_study(study_name=''distributed_test'',

    storage=''database_url'',

    load_if_exists=True)

    ```


    在实例化 `create_study()` 时定义数据库 URL。并将 `load_if_exits=True` 设置为 `True`，这样它就不会创建新的
    study，而是查找名为 “distributed_test” 的先前 study。这样一来，每次工作节点启动时，都不会创建新的 study，而是查找现有的
    study，从而避免从头开始训练。


    有关 Hyperopt 和 Optuna 的全面比较，请参阅 Neptune.ai 高级数据科学家 Jakub Czakon 撰写的以下文章：“Optuna
    vs Hyperopt：你应该选择哪个超参数优化库？”^(¹²)。


    现在，让我们探索一个如何使用 Optuna 优化神经网络超参数的示例。我们将使用 MNIST 数据集和 Keras。首先，导入库并将数据拆分为训练集和测试集。


    ```

    from keras.datasets import mnist

    from keras.layers.core import Dense, Dropout, Activation

    from keras.models import Sequential

    from keras.utils import np_utils

    import numpy as np

    import optuna

    from optuna.samplers import TPESampler

    (x_train, y_train), (x_test, y_test) = mnist.load_data()

    x_train = x_train.reshape(60000, 784)

    x_test = x_test.reshape(10000, 784)

    x_train = x_train.astype(''float32'')

    x_test = x_test.astype(''float32'')

    x_train /= 255

    x_test /= 255

    classes = 10

    input_shape = 784

    y_train = np_utils.to_categorical(y_train, classes)

    y_test = np_utils.to_categorical(y_test, classes)

    x_train, y_train, x_test, y_test, input_shape, classes

    ```


    ```

    def log(study, trial):

    print(f"Trial No.={trial.number}, HP_Set={trial.params}, \

    Score={trial.value}")

    print(f"Best Value ={study.best_value}")

    def objective_func(trial):

    model = Sequential()

    hidden_layer_unit_choice = [32, 64, 256, 512, 1024]

    hidden_layers = trial.suggest_int(''hidden_layers'', 1, 6)

    model.add(Dense(units=trial.suggest_categorical(''layer1'', [8, 16]),

    input_shape=(input_shape, ),

    name=''dense1''))

    model.add(Activation(activation=trial.suggest_categorical(

    f''activation1'',

    [''relu'',

    ''elu''])))

    for i in range(1, hidden_layers):

    model.add(Dense(units=trial.suggest_categorical(

    f''layer{i+1}'',

    hidden_layer_unit_choice)))

    model.add(Dropout(trial.suggest_uniform(

    f''dropout{i+1}'', 0, 0.8)))

    model.add(Activation(

    activation=trial.suggest_categorical(

    f''activation{i+1}'',

    [''relu'',

    ''elu''])))

    model.add(Dense(classes))

    model.add(Activation(activation=''softmax''))

    model.compile(loss=''categorical_crossentropy'',

    metrics=[''accuracy''],

    optimizer=trial.suggest_categorical(''optimizer'',

    [''rmsprop'', ''adam'', ''sgd'']))

    result = model.fit(x_train, y_train,

    batch_size=4,

    epochs=1,

    verbose=3,

    validation_split=0.2)

    validation_acc = np.amax(result.history[''val_accuracy''])

    print(''Validation accuracy:'', validation_acc)

    return validation_acc

    ```


    定义目标函数。在上述代码中，我们看到超参数是动态地为每一层选择的，只需为标签指定唯一的名称即可。


    最后，我们开始优化：


    ```

    study = optuna.create_study(direction=''maximize'', sampler=TPESampler())

    study.optimize(objective_func, n_trials=50, callbacks=[log])

    best_trial = study.best_trial.value

